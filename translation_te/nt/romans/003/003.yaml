- from: అయితే ఏమిటి? కొందరు నమ్మకంగా ఉండకపోతే, వారి అపనమ్మకత్వం దేవుని నమ్మకత్వాన్ని నిర్వీర్యం చేస్తుందా?[a]
  to: అయితే ఏమిటి? కొందరు నమ్మకంగా లేకపోయినా, వారి అవిశ్వసనీయత దేవుని విశ్వసనీయతను రద్దు చేస్తుందా?[a]
