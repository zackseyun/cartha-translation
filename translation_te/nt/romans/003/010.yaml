  text: καθὼς γέγραπται ὅτι Οὐκ ἔστιν δίκαιος οὐδὲ εἷς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/010.yaml
  text: 'As it is written: “There is no one righteous, not even one.”'
translation:
  language: te
  text: 'వ్రాయబడి ఉన్నట్లుగా: “నీతిమంతుడు ఒక్కడు కూడా లేడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: ప్రకారం
  rationale: γέγραπταιతో కలిసి లేఖన ఉల్లేఖనాన్ని సహజంగా పరిచయం చేస్తూ ‘వ్రాయబడి ఉన్న ప్రకారం’ అనే భావాన్ని ఇస్తుంది.
- source_word: γέγραπται
  choice: వ్రాయబడి ఉన్న
  rationale: పరిపూర్ణ కర్మణి రూపంలోని, వ్రాయబడినది ఇప్పటికీ ప్రమాణంగా నిలిచి ఉందనే భావాన్ని తెలుగులో నిలుపుతుంది.
- source_word: ὅτι
  choice: ':'
  rationale: ఉల్లేఖన సూత్రం తర్వాత ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి తెలుగులో ద్విబిందువు సహజంగా ఉంటుంది.
- source_word: Οὐκ ἔστιν
  choice: లేడు
  rationale: వ్యక్తిని సూచించే δίκαιοςతో కలిపి అస్తిత్వ నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δίκαιος
  choice: నీతిమంతుడు
  rationale: పౌలు వాడుకలోని నైతిక, దేవుని ఎదుట న్యాయస్థితికి సంబంధించిన భావవ్యాప్తిని కాపాడే స్థిరమైన బైబిలు తెలుగు పదం.
- source_word: οὐδὲ εἷς
  choice: ఒక్కడు కూడా
  rationale: ఒక్క మినహాయింపూ లేదనే గ్రీకు పదబంధపు ఉద్ఘాటనను సహజంగా, బలంగా తెలియజేస్తుంది.
theological_decisions:
- issue: వాక్యాన్ని వ్యక్తికేంద్రితంగా విప్పి చెప్పాలా, లేక గ్రీకులోని సమగ్ర నిరాకరణను నేరుగా ఉంచాలా?
  choice: నీతిమంతుడు ఒక్కడు కూడా లేడు
  alternative: ఎవరూ నీతిమంతులు కారు
  rationale: ఎంచుకున్న రూపం δίκαιος అనే ఏకవచన విశేషణాత్మక నామవాచకాన్ని, οὐδὲ εἷς యొక్క ఉద్ఘాటనను స్పష్టంగా నిలుపుతూ, పౌలు చేసిన ఉల్లేఖనంలోని సార్వత్రికతను అదనపు వ్యాఖ్యానం లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలితో రూపొందించబడింది.
