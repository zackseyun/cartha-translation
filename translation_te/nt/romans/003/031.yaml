  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: te
  text: అయితే, విశ్వాసం ద్వారా ధర్మశాస్త్రాన్ని నిరర్థకం చేస్తున్నామా? ఎంతమాత్రమూ కాదు! దానికి విరుద్ధంగా, మనం ధర్మశాస్త్రాన్ని నిలబెడుతున్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం ధర్మశాస్త్రాన్ని స్థిరపరుస్తున్నాం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: ధర్మశాస్త్రాన్ని
  rationale: రోమా పత్రికలోని వాదనలో ఇది దేవుని ధర్మశాస్త్రం/తోరాను సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో ‘ధర్మశాస్త్రం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: οὖν
  choice: అయితే
  rationale: ముందటి వాదన నుంచి వచ్చే ప్రశ్నాత్మక నిర్ధారణను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: καταργοῦμεν
  choice: నిరర్థకం చేస్తున్నామా
  rationale: ధర్మశాస్త్రాన్ని పూర్తిగా తొలగించడం కంటే దాని ప్రభావం లేదా చెల్లుబాటును లేకుండా చేయడం అనే భావాన్ని నిలుపుతుంది.
- source_word: διὰ τῆς πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనార్థాన్ని కాపాడుతూ πίστις‌ను స్థిరంగా ‘విశ్వాసం’గా అనువదిస్తుంది.
- source_word: μὴ γένοιτο
  choice: ఎంతమాత్రమూ కాదు!
  rationale: పౌలు వాడిన బలమైన తిరస్కారాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀλλὰ
  choice: దానికి విరుద్ధంగా
  rationale: ముందటి ప్రతిపాదనను కేవలం నిరాకరించకుండా, దానికి పూర్తి వ్యతిరేకమైన విషయాన్ని పౌలు చెబుతున్నాడనే పదునైన భేదాన్ని చూపుతుంది.
- source_word: ἱστάνομεν
  choice: నిలబెడుతున్నాం
  rationale: ధర్మశాస్త్రాన్ని కొత్తగా ఉనికిలోకి తేవడం అనే అపార్థాన్ని నివారించి, దానిని స్థిరంగా నిలిపి ఉంచడం లేదా సమర్థించడం అనే సందర్భోచిత భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: విశ్వాసానికి ధర్మశాస్త్రంతో ఉన్న సంబంధం
  choice: మనం ధర్మశాస్త్రాన్ని నిలబెడుతున్నాం
  alternative: మనం ధర్మశాస్త్రాన్ని స్థిరపరుస్తున్నాం
  rationale: ἱστάνομεν అనే పదం ‘స్థిరపరుస్తున్నాం’ అనే అర్థాన్నీ అనుమతిస్తుంది. అయితే ప్రధాన పాఠంలోని ‘నిలబెడుతున్నాం’ విశ్వాసం ధర్మశాస్త్రాన్ని నిరర్థకం చేయదనే వ్యతిరేకతను స్పష్టంగా ఉంచుతుంది; అదే సమయంలో ఏదైనా ప్రత్యేక మతశాఖ వివరణను పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. పౌలు ప్రశ్న–తిరస్కారం–వ్యతిరేక నిర్ధారణ అనే వాక్య నిర్మాణాన్ని, అలాగే మూలంలోని బలమైన వాక్చాతుర్యాన్ని కాపాడాం.
