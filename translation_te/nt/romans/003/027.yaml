id: ROM.3.27
reference: Romans 3:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: te
  text: అయితే, గొప్పలు చెప్పుకోవడం ఎక్కడ? అది మినహాయించబడింది. ఎలాంటి నియమం ద్వారా? క్రియల నియమం ద్వారానా? కాదు, విశ్వాస నియమం ద్వారా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: గొప్పలు చెప్పుకోవడం
  rationale: సందర్భంలో దేవుని ఎదుట తనకున్న ఆధారాన్ని బట్టి అతిశయించడం లేదా ప్రగల్భాలు పలకడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξεκλείσθη
  choice: తొలగించబడింది
  rationale: ఏదో ఒకటి లోపలికి రాకుండా మినహాయించబడింది లేదా పూర్తిగా మూసివేయబడింది అనే రూపకార్థాన్ని, గొప్పలు చెప్పుకోవడానికి ఇక అవకాశం లేదనే భావంతో తెలుపుతుంది.
- source_word: νόμος
  choice: నియమం
  rationale: ఈ వాక్యంలోని ప్రశ్నోత్తర నిర్మాణంలో 'సూత్రం/పద్ధతి' అనే విస్తృత భావానికి వీలు ఉంచుతుంది; అదే సమయంలో పౌలు ఉద్దేశపూర్వకంగా ఉపయోగించిన 'ధర్మశాస్త్రం/నియమం' పదప్రయోగంలోని ఉద్రిక్తతను పూర్తిగా తొలగించదు.
- source_word: πίστεως
  choice: విశ్వాస
  rationale: πίστις యొక్క సాధారణ పౌలీయ భావాన్ని నిలుపుతుంది; ఇక్కడ వ్యాకరణ సంబంధం 'విశ్వాసానికి సంబంధించిన నియమం'గా ఉద్దేశపూర్వకంగా సంక్షిప్తంగానే ఉంచబడింది.
- source_word: διὰ
  choice: ద్వారా
  rationale: గ్రీకు షష్ఠీ విభక్తితో వచ్చిన సాధనార్థక సంబంధాన్ని సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: '''νόμος πίστεως'' యొక్క అర్థం'
  choice: విశ్వాస నియమం
  alternative: విశ్వాస సూత్రం / విశ్వాస ధర్మశాస్త్రం
  rationale: ఇది మోషే ధర్మశాస్త్రమేనా, సాధారణ సూత్రమా, లేక కార్యవిధానమా అనే ప్రశ్నను అనువాదంలో ముందుగానే నిర్ణయించకుండా పౌలు చేసిన పదప్రయోగాన్ని నిలుపుతుంది.
- issue: '''τῶν ἔργων''లో క్రియల స్వరూపం'
  choice: క్రియల నియమం
  alternative: ధర్మశాస్త్ర క్రియల నియమం / మంచి పనుల నియమం
  rationale: గ్రీకు పాఠ్యంలో ఈ వాక్యంలో 'ధర్మశాస్త్ర సంబంధమైన' లేదా 'మంచి' అనే విశేషణం లేదు; అందువల్ల theological specification జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే ప్రశ్నోత్తర శైలి. మూలంలోని సంక్షిప్తతను, పునరుక్తిని, విశ్వాసం-క్రియల మధ్య ఉద్రిక్తతను నిలుపుకుంది.
