id: ROM.3.21
reference: Romans 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: te
  text: కానీ ఇప్పుడు, ధర్మశాస్త్రానికి వేరుగా దేవుని నీతి[a][b] వెల్లడైంది; ధర్మశాస్త్రమూ ప్రవక్తలూ[c] దానికి సాక్ష్యమిస్తున్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని న్యాయం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుని నుండి వచ్చే నీతి’ అని కూడా అర్థం కావచ్చు.
    reason: alternative_reading
  - marker: c
    text: అంటే, లేఖనాలు; ‘ధర్మశాస్త్రమూ ప్రవక్తలూ’ అనేది పాత నిబంధన లేఖన సాక్ష్యాన్ని సూచించే పదబంధం.
    reason: cross_reference
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: అయితే ఇప్పుడు
  rationale: δὲ లోని వ్యతిరేక భావాన్నీ, Νυνὶ లోని కాలసూచననూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: χωρὶς νόμου
  choice: ధర్మశాస్త్రానికి వేరుగా
  rationale: χωρίς సూచించే వేరుపాటును నిలుపుతుంది. సందర్భంలో νόμος మోషే ధర్మశాస్త్రాన్ని సూచిస్తున్నందున ‘ధర్మశాస్త్రం’ ఎంచుకున్నాం.
- source_word: δικαιοσύνη θεοῦ
  choice: దేవుని నీతి
  rationale: δικαιοσύνη కి ‘నీతి’ సహజమైన, విస్తృతమైన తెలుగు సమానార్థకం. θεοῦ లోని సంబంధాన్ని ‘దేవుని’ అని ఉంచడం ద్వారా అది దేవుని స్వనీతి/న్యాయక్రియనా లేక దేవుని నుండి లభించే నీతినా అనే భావసాధ్యతను ప్రధాన పాఠంలో అతిగా నిర్ణయించలేదు.
- source_word: πεφανέρωται
  choice: ప్రత్యక్షపరచబడింది
  rationale: పూర్వంలో జరిగిన వెల్లడింపు ఫలితం ప్రస్తుతం నిలిచి ఉందనే perfect భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: μαρτυρουμένη
  choice: దానికి సాక్ష్యమిస్తున్నాయి
  rationale: వర్తమాన నిష్క్రియార్థక కృదంతంలోని కొనసాగుతున్న సాక్ష్యభావాన్ని సహజమైన తెలుగు క్రియారూపంతో వ్యక్తపరుస్తుంది; కర్తలైన ధర్మశాస్త్రమూ ప్రవక్తలూ తెలుగులో స్పష్టంగా నిలుస్తాయి.
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: ధర్మశాస్త్రమూ ప్రవక్తలూ
  rationale: ఇది కేవలం ఆజ్ఞలూ ప్రవక్తల వ్యక్తులూ కాక, గుర్తింపుపొందిన లేఖన సాక్ష్యాన్ని సూచించే జంటపదబంధంగా సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: δικαιοσύνη θεοῦ లోని షష్ఠీ విభక్తి సంబంధం
  choice: దేవుని నీతి
  alternative: దేవుని నుండి వచ్చే నీతి; దేవుని న్యాయం
  rationale: గ్రీకు పదబంధం దేవుని స్వభావం/నీతికార్యాన్ని, అలాగే రక్షణార్థంగా దేవుని నుండి వచ్చే నీతిని సూచించే భావతీవ్రతను కలిగి ఉండవచ్చు. ప్రధాన పాఠం ఒకే సిద్ధాంతార్థానికి దానిని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలిపాం. ‘ధర్మశాస్త్రం,’ ‘నీతి,’ ‘సాక్ష్యమిస్తున్నాయి’ వంటి సుపరిచిత పదాలను ఉపయోగించి మూలంలోని భావసంబంధాలనూ ఉద్దేశపూర్వక అస్పష్టతనూ కాపాడాం.
