id: ROM.3.2
reference: Romans 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν ⸀γὰρ ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: te
  text: ప్రతి విధంగానూ ఎంతో ఉంది. ఎందుకంటే, మొదటిగా, దేవుని వాక్కులు వారికి అప్పగించబడ్డాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని ఉక్తులు.”
    reason: λόγια అనే పదానికి ‘దైవిక ఉక్తులు’ అనే మరింత రూపనిష్ఠ ప్రత్యామ్నాయాన్ని చూపించడానికి.
lexical_decisions:
- source_word: πολὺ
  choice: ఎంతో ఉంది
  rationale: ముందటి వచనంలోని ప్రయోజనం గురించిన ప్రశ్నకు పరిమాణాన్ని సూచించే సంక్షిప్త సమాధానంగా πολὺ వాడబడింది; తెలుగులో సహజంగా ఉండేందుకు క్రియను పూరించాం.
- source_word: κατὰ πάντα τρόπον
  choice: ప్రతి విధంగానూ
  rationale: ఈ నుడికారం ప్రయోజనం అన్ని కోణాల్లో విస్తారంగా ఉందని తెలియజేస్తుంది.
- source_word: πρῶτον μὲν γὰρ
  choice: ఎందుకంటే, మొదటిగా
  rationale: γὰρ వివరణాత్మక కారణాన్ని, πρῶτον μὲν మొదటి అంశాన్ని పరిచయం చేస్తాయి. వెంటనే రెండవ అంశం రాకపోయినా మూలంలోని సంభాషణ నిర్మాణాన్ని నిలిపాం.
- source_word: ἐπιστεύθησαν
  choice: వారికి అప్పగించబడ్డాయి
  rationale: ఇక్కడ πιστεύω యొక్క కర్మణి రూపం ‘నమ్మారు’ అని కాక, బాధ్యతగా ఏదో ఒకరికి అప్పగించడాన్ని సూచిస్తుంది.
- source_word: τὰ λόγια
  choice: వాక్కులు
  rationale: λόγια దేవుడు పలికిన ప్రకటనలను సూచిస్తుంది. ‘వాక్కులు’ దైవిక ఉక్తుల భావాన్ని కాపాడుతూ, ‘ప్రవచనాలు’ వంటి మరింత సంకుచిత అర్థాన్ని మోపదు.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: మూలంలోని షష్ఠీ విభక్తి సంబంధాన్ని నేరుగా నిలిపి, ఆ వాక్కులు దేవునివని తెలియజేస్తుంది.
theological_decisions:
- issue: λόγια యొక్క పరిధి
  choice: దేవుని వాక్కులు
  alternative: దేవుని ప్రవచనాలు / దేవుని మాటలు
  rationale: ఈ పదం కేవలం భవిష్యద్వాణులకు పరిమితం కాక దైవిక ఉక్తులను విస్తృతంగా సూచించగలదు; అందువల్ల పరిధిని సంకుచితం చేయలేదు.
- issue: ἐπιστεύθησανలో సూచిత స్వీకర్తలు
  choice: వారికి
  alternative: యూదులకు
  rationale: ముందటి వచనం ద్వారా యూదులే సూచించబడుతున్నా, గ్రీకు వాక్యంలో నామవాచకం పునరుక్తం కాలేదు. కాబట్టి సందర్భసంబంధ సర్వనామాన్ని ఉంచి మూలంలోని అంతర్నిహితత్వాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘వాక్కులు’ అనే పదం కొంత గంభీరమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, దైవిక ప్రకటన భావాన్ని కాపాడుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
