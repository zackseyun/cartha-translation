  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: te
  text: 'వారి గొంతు తెరిచి ఉన్న సమాధి;

    తమ నాలుకలతో వారు మోసం చేస్తారు[a];

    వారి పెదవుల కింద విషసర్పాల[c] విషం[b] ఉంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ నాలుకలతో వారు మోసం చేస్తూనే ఉన్నారు.” గ్రీకు అపరిపూర్ణ క్రియ కొనసాగుతున్న చర్యను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “విషపదార్థం” అని కూడా అనువదించవచ్చు; పాముల సందర్భంలో “విషం” సహజమైన తెలుగు ప్రయోగం.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు పదాన్ని “నాగుపాముల” అని కూడా అనువదిస్తారు; అది ఏ పాము జాతిని సూచిస్తుందో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: సమాధి
  rationale: మరణం, కుళ్లు అనే రూపకాన్ని నిలుపుతూ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అర్థమయ్యే పదం.
- source_word: ἀνεῳγμένος
  choice: తెరిచి ఉన్న
  rationale: గ్రీకు పరిపూర్ణ కర్మణి కృదంతంలోని ‘తెరవబడి ఆ స్థితిలో ఉన్న’ ఫలితస్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λάρυγξ
  choice: గొంతు
  rationale: శరీర అవయవాన్ని సూచించే స్పష్టమైన, సాధారణ తెలుగు పదం; మూలంలోని రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ἐδολιοῦσαν
  choice: మోసం చేస్తారు
  rationale: నాలుకలతో కపటంగా వ్యవహరించడాన్ని సహజంగా తెలియజేస్తుంది; అపరిపూర్ణ కాలంలోని కొనసాగుతున్న భావాన్ని పాదసూచికలో వెల్లడించాం.
- source_word: ἰὸς
  choice: విషం
  rationale: పాముల సందర్భంలో విషపూరిత స్రావాన్ని తెలుగులో సహజంగా, ఖచ్చితంగా సూచిస్తుంది.
- source_word: ἀσπίδων
  choice: విషసర్పాల
  rationale: ప్రాచీన జాతిపేరు యొక్క ఖచ్చిత గుర్తింపు అనిశ్చితంగా ఉన్నందున మూలంలోని విషసర్ప భావాన్ని అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: వారి పెదవుల కింద
  rationale: మూలంలోని స్పష్టమైన శరీర రూపకాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
