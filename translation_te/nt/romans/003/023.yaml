id: ROM.3.23
reference: Romans 3:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/023.yaml
  text: For all have sinned and fall short of the glory of God[b][a],
translation:
  language: te
  text: ఎందుకంటే అందరూ పాపం చేశారు; దేవుని మహిమను పొందలేకపోతున్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని మహిమ వారికి లోటుగా ఉంది” లేదా “దేవుని మహిమను పొందలేకపోతున్నారు.”
    reason: lexical_alternative
  - marker: b
    text: “దేవుని మహిమ” అనేది దేవుని స్వంత మహిమను, మానవులు ప్రతిబింబించవలసిన మహిమను, లేదా దేవుడు అనుగ్రహించే మహిమను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: అందరూ
  rationale: సందర్భంలో సమస్త మానవాళిని సమగ్రంగా సూచిస్తుంది; గ్రీకులో లేని అదనపు పదాలు చేర్చకుండా సహజంగా ఉంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న వాదనకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἥμαρτον
  choice: పాపం చేశారు
  rationale: అయోరిస్ట్ రూపం మానవుల పాపాన్ని సమగ్ర వాస్తవంగా సంగ్రహిస్తుంది; తెలుగు భాషలో ఇది సహజమైన వ్యక్తీకరణ.
- source_word: ὑστεροῦνται
  choice: పొందలేకపోతున్నారు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న లోపస్థితిని సహజంగా వ్యక్తపరుస్తుంది; అయితే ‘లోటుగా ఉన్నారు’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: δόξης
  choice: మహిమను
  rationale: δόξαకు స్థిరమైన, సందర్భోచితమైన తెలుగు పదం; దేవుని తేజస్సు, ఘనత, లేదా ఆయన అనుగ్రహించే మహిమ అనే భావసాధ్యతలను మూసివేయదు.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తిని నేరుగా నిలుపుతూ, ‘దేవుని నుండి వచ్చే’ వంటి నిర్దిష్ట అర్థాన్ని ప్రధాన పాఠ్యంలో ముందుగానే నిర్ణయించదు.
theological_decisions:
- issue: ‘దేవుని మహిమ’ అనే పదబంధం యొక్క అర్థం
  choice: ‘దేవుని మహిమ’ అని వ్యాఖ్యాన విస్తరణ లేకుండా ఉంచాం.
  alternative: దేవుని స్వంత మహిమ; మానవులు ప్రతిబింబించవలసిన మహిమ; దేవుడు అనుగ్రహించే మహిమ
  rationale: τῆς δόξης τοῦ θεοῦ అనే గ్రీకు పదబంధం సంక్షిప్తంగా ఉండి అనేక సంబంధిత భావాలకు అవకాశం ఇస్తుంది. అందువల్ల ప్రధాన పాఠ్యం ఆ వేదాంతపరమైన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పాపం చేశారు’ అనే సాధారణ ప్రయోగం ἥμαρτον యొక్క సమగ్ర భావాన్ని అందిస్తుంది. ὑστεροῦνται యొక్క కొనసాగుతున్న స్థితిని ‘పొందలేకపోతున్నారు’ తెలియజేస్తుంది; దాని ‘లోటు/లేమి’ అర్థాన్ని పాదసూచిక సంరక్షిస్తుంది.
