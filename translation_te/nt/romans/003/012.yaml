id: ROM.3.12
reference: Romans 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: te
  text: అందరూ దారి తప్పారు; వారందరూ కలిసి పనికిరానివారయ్యారు.[a] మేలు చేసేవారెవరూ లేరు;[b] ఒక్కరైనా లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విలువలేనివారయ్యారు” లేదా “చెడిపోయారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మంచి చేసేవారెవరూ లేరు”; χρηστότητα అనే పదానికి “దయ” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: అందరూ
  rationale: గ్రీకు బహువచనంలోని సార్వత్రిక పరిధిని, మూలంలో లేని నామవాచకాన్ని చేర్చకుండా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐξέκλιναν
  choice: దారి తప్పారు
  rationale: సరైన మార్గం నుంచి నైతికంగా తొలగిపోవడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἅμα
  choice: వారంతా కలిసి
  rationale: ఇక్కడ మానవులందరూ ఒకే స్థితిలో భాగస్వాములయ్యారనే సమష్టి భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἠχρεώθησαν
  choice: పనికిరానివారయ్యారు
  rationale: క్రియలోని ఫలితస్థితిని, బలమైన ప్రతికూల అంచనాను నిలుపుతుంది; ‘విలువలేనివారు’ కంటే తెలుగులో సహజంగా ఉంటుంది.
- source_word: ποιῶν
  choice: చేసేవాడు
  rationale: గ్రీకు వర్తమాన కృదంతంలోని అలవాటుగా లేదా లక్షణంగా చేసే భావాన్ని సహజమైన తెలుగు సంబంధ క్రియారూపంతో అందిస్తుంది.
- source_word: χρηστότητα
  choice: మేలు
  rationale: ఈ నైతిక సందర్భంలో ‘మంచితనం’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; ‘దయ’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: οὐκ ἔστιν
  choice: ఎవడూ లేడు
  rationale: వ్యక్తిని సూచించే బలమైన నిరాకరణను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἕως ἑνός
  choice: ఒక్కడు కూడా లేడు
  rationale: గ్రీకు నుడికారంలోని చివరి గట్టి ఉద్ఘాటనను సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: వాక్యంలోని సార్వత్రిక నిరాకరణ
  choice: ‘అందరూ’ మరియు ‘ఒక్కడు కూడా లేడు’ అనే రెండు ఉద్ఘాటనలనూ నిలిపాం.
  alternative: చివరి ఉద్ఘాటనను సంక్షిప్తం చేయడం లేదా మొదటి ‘అందరూ’లో కలిపివేయడం.
  rationale: మూలపాఠం మానవులందరినీ చేర్చే పరిధిని మొదట ప్రకటించి, చివరలో ఒక్క మినహాయింపూ లేదని మళ్లీ బలపరుస్తుంది; ఆ ఉద్వేగాన్ని వ్యాఖ్యానంతో పరిమితం చేయకుండా అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘దారి తప్పారు,’ ‘పనికిరానివారయ్యారు,’ ‘ఒక్కడు కూడా’ వంటి సాధారణ పదబంధాలు మూలంలోని నైతిక తీవ్రతను నిలుపుతూ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా ఎంపికయ్యాయి.
