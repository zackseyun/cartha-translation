  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἔστιν φόβος θεοῦ ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/018.yaml
  text: There is no fear of God before their eyes[a][b].
translation:
  language: te
  text: వారి కళ్ల ఎదుట దేవుని భయం లేదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి కళ్ల ఎదుట దేవునిపట్ల భక్తిపూర్వక గౌరవం లేదు.”
    reason: lexical_alternative
  - marker: b
    text: కీర్తన 36:1 నుండి ఉల్లేఖనం (సెప్టువజింటులో 35:2).
    reason: cross_reference
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: లేదు
  rationale: నిరాకరణతో కూడిన అస్తిత్వ భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: φόβος
  choice: భయం
  rationale: గ్రీకు పదంలోని ప్రాథమిక భావాన్ని, అలాగే దేవునిపట్ల ఉండవలసిన భయాన్ని సూచించే లేఖన భాషను కాపాడుతుంది; ‘భక్తిపూర్వక గౌరవం’ అనే భావం ప్రత్యామ్నాయంగా పాదసూచికలో ఇవ్వబడింది.
- source_word: θεοῦ
  choice: దేవుని
  rationale: సంబంధార్థక షష్ఠీ విభక్తిని సహజంగా నిలుపుతూ, భయానికి దేవుడే లక్ష్యమని స్పష్టం చేస్తుంది.
- source_word: ἀπέναντι
  choice: ఎదుట
  rationale: కళ్ల ముందు ఉంచబడినదనే స్థలరూపక భావాన్ని సహజమైన తెలుగు నుడికారంలో కాపాడుతుంది.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: వారి కళ్ల
  rationale: ‘కళ్లు’ అనే స్పష్టమైన మూలచిత్రాన్ని నిలుపుతుంది; ఇది వారి దృష్టి, అవగాహన, నైతిక వైఖరిని సూచించే లేఖన నుడికారానికి అనుగుణంగా ఉంది.
theological_decisions:
- issue: φόβος θεοῦ యొక్క భావవ్యాప్తి
  choice: దేవుని భయం
  alternative: దేవునిపట్ల భక్తిపూర్వక గౌరవం
  rationale: ‘భయం’ మూలపదానికి ప్రత్యక్షమైన సమానార్థం; అయితే సందర్భంలో భక్తిపూర్వక గౌరవం అనే భావఛాయ ఉండవచ్చు కాబట్టి దాన్ని ప్రధాన పాఠ్యంలో కలిపి అస్పష్టతను తొలగించకుండా పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన లేఖన శైలి. ‘కళ్ల ఎదుట’ అనే సహజ నుడికారం ద్వారా గ్రీకు మూలంలోని దృశ్య రూపకం నిలుపబడింది.
