translation:
  language: te
  text: రక్తం చిందించడానికి వారి పాదాలు తొందరపడతాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “వారి పాదాలు రక్తాన్ని కుమ్మరించడానికి పదునైనవి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξεῖς
  choice: వేగంగా పరుగెత్తుతాయి
  rationale: ఈ పదానికి అక్షరార్థంగా ‘పదునైనవి’ అనే భావం ఉన్నా, హింసకు వెంటనే దూసుకుపోయే పాదాలను వర్ణించే ఈ ప్రయోగంలో వేగం, సంసిద్ధత ప్రధాన భావాలు. సహజమైన ఆధునిక తెలుగులో వాటిని ‘వేగంగా పరుగెత్తుతాయి’ అని వ్యక్తం చేశాం.
- source_word: πόδες
  choice: పాదాలు
  rationale: మూలంలోని శరీర అవయవ చిత్రణను నేరుగా, గౌరవప్రదమైన సాధారణ తెలుగు పదంతో నిలిపాం.
- source_word: αὐτῶν
  choice: వారి
  rationale: పాదాలు ఎవరివో తెలిపే షష్ఠీ విభక్తి సర్వనామాన్ని సహజమైన తెలుగు స్వామ్యరూపంతో అనువదించాం.
- source_word: ἐκχέαι
  choice: చిందించడానికి
  rationale: అక్షరార్థం ‘కుమ్మరించడానికి’; రక్తం సందర్భంలో ‘రక్తం చిందించడం’ సహజమైన తెలుగు ప్రయోగం, హింసాత్మక భావాన్ని నిలుపుతుంది.
- source_word: αἷμα
  choice: రక్తం
  rationale: మూల నామవాచకానికి ప్రామాణికమైన, సందర్భోచితమైన తెలుగు సమానం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన శైలిని వాడాం. ὀξεῖς అనే అసాధారణ రూపకాన్ని ప్రధాన పాఠ్యంలో సహజార్థంతో ఇచ్చి, దాని అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
