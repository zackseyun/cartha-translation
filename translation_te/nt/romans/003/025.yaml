  to: ఆయనను దేవుడు ఆయన రక్తంపై విశ్వాసం ద్వారా[b] పాపపరిహార బలిగా[a] అందరి ముందు ఉంచాడు. ఇంతకుముందు జరిగిన పాపాలను ఉపేక్షించిన కారణంగా, తన నీతిని[c] చూపించడానికి ఆయన ఇలా చేశాడు.
