id: ROM.3.25
reference: Romans 3:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: te
  text: ఆయనను దేవుడు ఆయన రక్తంపై విశ్వాసం ద్వారా[b] పాపపరిహార బలిగా[a] అందరి ముందు ఉంచాడు. ఇంతకుముందు జరిగిన పాపాలను ఉపేక్షించిన కారణంగా, తన నీతిని[c] చూపించడానికి ఆయన ఇలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కోపశాంతికర బలి”; లేదా “కరుణాసనం”—పాత నిబంధనలో మందసంపై ఉండి, ప్రాయశ్చిత్త రక్తం చల్లబడిన బంగారు మూత.
    reason: lexical_alternative
  - marker: b
    text: ఈ పదబంధాన్ని “విశ్వాసం ద్వారా, ఆయన రక్తం చేత” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా “న్యాయం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: అందరి ముందు ఉంచాడు
  rationale: సందర్భంలో దేవుడు క్రీస్తును బహిరంగంగా ప్రతిపాదించి ప్రదర్శించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ‘నిర్ణయించాడు’ అనే సాధ్యమైన అర్థం ఇక్కడ సందర్భానికి తక్కువ అనుకూలం.
- source_word: ἱλαστήριον
  choice: పాపపరిహార బలి
  rationale: బలి ద్వారా పాపానికి పరిహారం కలిగే విస్తృత భావాన్ని సామాన్య పాఠకునికి అర్థమయ్యేలా తెలియజేస్తుంది; దేవుని కోపశాంతి లేదా కరుణాపీఠం అనే ఒక్క వ్యాఖ్యానానికే పదాన్ని పరిమితం చేయదు.
- source_word: διὰ πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: πίστιςకు సహజమైన ప్రాజెక్టు-సంగత తెలుగు సమానార్థకం; సాధనాన్ని సూచించే διά భావాన్ని కాపాడుతుంది.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: ఆయన రక్తంపై
  rationale: ప్రధాన పఠనంలో విశ్వాసానికి లక్ష్యంగా క్రీస్తు రక్తాన్ని చూపుతుంది. గ్రీకు వాక్యనిర్మాణం వేరుగా అనుసంధానించడానికి వీలున్నందున ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: εἰς ἔνδειξιν
  choice: చూపించడానికి
  rationale: ఉద్దేశ్య లేదా ఫలిత భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: పౌలు వాడుకలో δικαιοσύνηకు విస్తృతమైన, స్థిరమైన తెలుగు పదం; ఇక్కడ ‘న్యాయం’ అనే భావఛాయ కూడా సాధ్యమని పాదసూచికలో సూచించబడింది.
- source_word: πάρεσιν
  choice: ఉపేక్షించినందువల్ల
  rationale: పాపాలను వెంటనే శిక్షించకుండా వదిలివేయడం లేదా సహనంతో దాటవేయడం అనే ప్రత్యేక భావాన్ని కాపాడుతుంది; దీనిని సంపూర్ణ క్షమాపణతో సమానంగా చేయదు.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: గతంలో జరిగిన పాపాలు
  rationale: ముందుగా సంభవించిన పాపాలు అనే కాలసంబంధ భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ἱλαστήριον అనే వివాదాస్పద పదాన్ని ఎలా అనువదించాలి
  choice: పాపపరిహార బలి
  alternative: కోపశాంతికర బలి; కరుణాపీఠం
  rationale: ప్రధాన పాఠంలో బలి మరియు పాపపరిహార కార్యాన్ని స్పష్టంగా ఉంచుతూ, దేవునివైపు కోపశాంతి అనే భావానికో లేదా మందసపు బంగారు మూత అనే స్థలార్థానికో మాత్రమే కట్టుబడదు. ప్రధాన ప్రత్యామ్నాయాలు పాదసూచికలో నిలుపబడ్డాయి.
- issue: διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι పదబంధ సంబంధం
  choice: ఆయన రక్తంపై విశ్వాసం ద్వారా
  alternative: విశ్వాసం ద్వారా, ఆయన రక్తం చేత
  rationale: ప్రధాన పఠనం విశ్వాసాన్ని క్రీస్తు రక్తం లేదా బలిమరణం వైపు ఉంచుతుంది. అయితే ἐν τῷ αὐτοῦ αἵματι ఏ పదబంధంతో అనుసంధానమవుతుందో వ్యాకరణపరంగా వివాదాస్పదం కాబట్టి ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- issue: δικαιοσύνηలోని భావఛాయ
  choice: నీతి
  alternative: న్యాయం
  rationale: ‘నీతి’ పౌలు వాడుకలోని విస్తృత భావాన్ని కాపాడుతుంది; ఈ సందర్భంలో దేవుని న్యాయస్వరూపం ముందుకు రావచ్చని పాదసూచిక తెలియజేస్తుంది.
- issue: πάρεσιςను క్షమాపణగా చూపాలా
  choice: ఉపేక్షించడం
  alternative: దాటవేయడం; తాత్కాలికంగా శిక్షించకుండా ఉండడం
  rationale: ఈ అరుదైన పదం పాపాలను పూర్తిగా క్షమించడం కంటే గతంలో వాటిని శిక్షించకుండా సహనంతో దాటవేయడాన్ని సూచించవచ్చు; అందువల్ల theological tensionను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ‘పాపపరిహార బలి’ వంటి పరిచితమైన ధార్మిక పదాన్ని ఉపయోగించినా, వివాదాస్పద గ్రీకు పదంలోని ప్రధాన ప్రత్యామ్నాయాలను పాదసూచికల్లో భద్రపరచాం. మూలంలోని సంబంధసూచక ὃν గత వచనానికి అనుసంధానమై ఉన్నా, ఒంటరి వచనంగా తెలుగులో సహజంగా ఉండేందుకు ‘ఆయనను’ అని ప్రారంభించాం.
