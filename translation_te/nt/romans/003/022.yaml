id: ROM.3.22
reference: Romans 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: te
  text: అయితే, యేసు మెస్సీయపై విశ్వాసం ద్వారా విశ్వసించే వారందరికీ దేవుని నీతి[a] ప్రత్యక్షపరచబడింది; ఎందుకంటే ఎలాంటి భేదమూ లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని న్యాయం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοσύνη θεοῦ
  choice: దేవుని నీతి
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని పారదర్శకంగా ఉంచుతూ, దేవుని నీతిగల స్వభావం, కార్యం, ఆయన అనుగ్రహించే నీతిస్థితి అనే భావవిస్తృతిని ముందుగానే ఒకే అర్థానికి పరిమితం చేయదు.
- source_word: διὰ πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: πίστιςకు పౌలు వాడుకలో సహజమైన ప్రధాన సమానార్థంగా ‘విశ్వాసం’ను ఎంచుకున్నాం; ‘విశ్వసనీయత’ అనే సాధ్యార్థాన్ని వివాదాస్పద షష్ఠీ విభక్తి నిర్మాణంతో కలిపి పాదసూచికలో ఉంచాం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ యేసుకు బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ అని అనువదించాం.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: విశ్వసించే వారందరికీ
  rationale: εἰς యొక్క దిశ/వ్యాప్తిని తెలుగులో సహజమైన ‘అందరికీ’తో, వర్తమాన కృదంత భావాన్ని ‘విశ్వసించే వారు’తో వ్యక్తం చేశాం.
- source_word: διαστολή
  choice: భేదం
  rationale: ఈ సందర్భంలో మనుషుల మధ్య దేవుని ఎదుట వేరుచేసే తేడా లేదనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయపై విశ్వాసం
  alternative: యేసు మెస్సీయ యొక్క విశ్వసనీయత
  rationale: షష్ఠీ విభక్తిని విశ్వాసానికి లక్ష్యాన్ని సూచించేదిగా చదవడం సాధారణమైనదైనా, మెస్సీయ స్వయంగా చూపిన విశ్వసనీయతను సూచించే పఠనం కూడా వ్యాకరణపరంగా సాధ్యమే; అందువల్ల దానిని పాదసూచికలో నిలిపాం.
- issue: δικαιοσύνη θεοῦ
  choice: దేవుని నీతి
  alternative: దేవుని న్యాయం
  rationale: ‘నీతి’ పౌలు వాడుకలోని విస్తృత భావాన్ని, నీతిస్థితితో పాటు దేవుని నీతియుక్త కార్యాన్ని కూడా మోయగలదు; ‘న్యాయం’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: Ellipsis dependent on Romans 3:21
  choice: లభిస్తుంది అనే క్రియను తెలుగులో పూరించాం
  alternative: క్రియలేని నామవాచక ఖండంగా ఉంచడం
  rationale: గ్రీకు వాక్యం ముందరి వచనంలోని క్రియపై ఆధారపడుతుంది. వచనాన్ని విడిగా చదివినప్పుడు సహజంగా ఉండేందుకు ‘లభిస్తుంది’ను పూరించాం; ఇది εἰς πάντας యొక్క గ్రహీతల దిశను వ్యక్తం చేస్తుంది, అయితే దేవుని నీతి భావాన్ని మరింత సంకుచితం చేయకుండా వాక్యాన్ని పూర్తి చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ఎలాంటి భేదమూ లేదు’ అనేది οὐ γάρ ἐστιν διαστολήను సహజంగా, బలంగా వ్యక్తం చేస్తుంది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలోనే ఉంచబడ్డాయి.
