id: ROM.3.5
reference: Romans 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: te
  text: అయితే, మన అనీతి దేవుని నీతిని చూపిస్తే[a], మనమేమి చెప్పాలి? కోపాన్ని విధించే దేవుడు అన్యాయుడా? (నేను మానవరీతిగా మాట్లాడుతున్నాను.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన అన్యాయం దేవుని న్యాయాన్ని చూపిస్తే.”
    reason: ἀδικία మరియు δικαιοσύνηలకు ఈ సందర్భంలో వరుసగా ‘అన్యాయం,’ ‘న్యాయం’ అనే న్యాయపరమైన అర్థాలు కూడా సాధ్యమే.
lexical_decisions:
- source_word: ἀδικία
  choice: అనీతి
  rationale: పౌలు వాదనలో దేవుని δικαιοσύνηతో ఉన్న నైతిక వ్యతిరేకతను సహజంగా నిలుపుతుంది; ‘అన్యాయం’ కూడా సందర్భానుసారమైన ప్రత్యామ్నాయం.
- source_word: δικαιοσύνη
  choice: నీతి
  rationale: దేవుని నైతిక యథార్థతను, న్యాయాన్ని రెండింటినీ సూచించగల సంప్రదాయబద్ధమైనప్పటికీ ఆధునికంగా అర్థమయ్యే పదం; ప్రత్యామ్నాయ న్యాయార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: συνίστησιν
  choice: స్పష్టంగా చూపిస్తుంది
  rationale: మనుష్యుల అనీతి దేవుని నీతిని ప్రత్యక్షపరుస్తుంది లేదా రుజువుచేస్తుంది అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μὴ ἄδικος
  choice: దేవుడు అన్యాయస్థుడా?
  rationale: μή ప్రతికూల సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను సూచించినా, మూలంలోని ప్రశ్నారూపాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: ఉగ్రతను విధించే
  rationale: ἐπιφέρωలోని తీర్పు అమలుచేసే భావాన్ని ‘విధించే’ నిలుపుతుంది; ὀργήను వ్యక్తిగత కోపంగా మాత్రమే కుదించకుండా ‘ఉగ్రత’గా అనువదిస్తుంది.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: నేను మానవరీతిగా మాట్లాడుతున్నాను
  rationale: ఇది మానవ వాదనరీతి లేదా దృక్కోణం నుండి పలికిన అభ్యంతరమని తెలిపే పౌలు వివరణను సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుని తీర్పు న్యాయసమ్మతతను ప్రశ్నించే పౌలు అలంకారిక ప్రశ్న
  choice: ఉగ్రతను విధించే దేవుడు అన్యాయస్థుడా?
  alternative: ఉగ్రతను విధించే దేవుడు అన్యాయస్థుడు కాడు గదా?
  rationale: μή ప్రశ్న ప్రతికూల సమాధానాన్ని ఆశిస్తున్నప్పటికీ, మూల వాక్యంలోని ఉద్రిక్తతను ముందుగానే పరిష్కరించకుండా ప్రత్యక్ష ప్రశ్నగా ఉంచాం.
- issue: ἀδικία మరియు δικαιοσύνη పదజంటలో నైతికత–న్యాయం అర్థవిస్తృతి
  choice: అనీతి ... నీతి
  alternative: అన్యాయం ... న్యాయం
  rationale: ప్రధాన పాఠ్యంలో పౌలు విస్తృత నైతిక/సంబంధపరమైన వ్యతిరేకతను నిలిపి, న్యాయపరమైన అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రశ్నారూపం వాడబడింది. ‘మనమేమంటాం?’ పౌలు వాదనశైలిని నిలుపుతుంది; కుండలీకరణలోని వివరణను మూలానుసారంగా ఉంచాం.
