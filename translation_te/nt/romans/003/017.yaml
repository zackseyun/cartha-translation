  edition: SBLGNT
  text: καὶ ὁδὸν εἰρήνης οὐκ ἔγνωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/017.yaml
  text: and they have not known the way of peace[a].
translation:
  language: te
  text: మరియు వారు శాంతి మార్గాన్ని తెలుసుకోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శాంతి పథం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది ముందున్న నిందల పరంపరను కొనసాగించే సంధాయకం. ఈ ఒక్క వచనాన్ని సహజమైన ఆధునిక తెలుగులో చదివేటప్పుడు ‘మరియు’ అని ప్రారంభించడం కృత్రిమంగా అనిపిస్తుంది; వాక్యక్రమమే కొనసాగింపును సూచిస్తుంది.
- source_word: ὁδὸν
  choice: మార్గం
  rationale: ‘మార్గం’ రహదారి అనే రూపకాన్నీ, జీవనవిధానం లేదా ప్రవర్తనా పద్ధతి అనే భావాన్నీ సహజంగా నిలుపుతుంది.
- source_word: εἰρήνης
  choice: శాంతి
  rationale: εἰρήνηకు సాధారణమైన, స్పష్టమైన తెలుగు సమానం ‘శాంతి’; ఇక్కడ అది శాంతికి దారితీసే లేదా శాంతితో లక్షణీకరించబడిన మార్గాన్ని సూచిస్తుంది.
- source_word: οὐκ ἔγνωσαν
  choice: వారికి తెలియదు
  rationale: గ్రీకు అఓరిస్ట్‌ను తెలుగు సందర్భంలో సహజమైన స్థితివాచక రూపంతో అందించాం. ఇది వారు ఆ మార్గాన్ని ఎరుగకపోవడం లేదా అనుభవపూర్వకంగా తెలుసుకోకపోవడం అనే భావాన్ని అతిగా నిర్ధారించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘శాంతి మార్గం’ అనే సంబంధం
  choice: సంక్షిప్తమైన ‘శాంతి మార్గం’ రూపాన్ని నిలిపాం
  alternative: ‘శాంతికి దారితీసే మార్గం’ లేదా ‘శాంతియుతమైన మార్గం’
  rationale: గ్రీకు సంబంధవిభక్తి శాంతికి దారితీసే మార్గమా, శాంతితో లక్షణీకరించబడిన మార్గమా అన్నది పూర్తిగా నిర్ధారించదు; తెలుగు సంక్షిప్త రూపం ఆ భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గంభీరంగా, సాధారణ పాఠకులకు సులభంగా రూపొందించబడింది. ‘మార్గం’ ప్రధాన పాఠంలో సహజమైనది; ‘పథం’ను పదప్రత్యామ్నాయంగా అడుగుటిప్పణిలో ఇచ్చాం.
