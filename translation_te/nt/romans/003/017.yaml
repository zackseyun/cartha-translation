    text: లేదా “శాంతి పథం.”
    reason: lexical_alternative
  revision_rationale: The revision explicitly represents καὶ with “మరియు” and renders οὐκ ἔγνωσαν with the natural Telugu past/perfective negative “తెలుసుకోలేదు.” It retains the compact genitive expression “శాంతి మార్గం,” which does not prematurely decide whether the way leads to peace or is characterized by it.
