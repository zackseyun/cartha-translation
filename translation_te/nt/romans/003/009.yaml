id: ROM.3.9
reference: Romans 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: te
  text: అయితే ఏమిటి? మనం మెరుగైన స్థితిలో ఉన్నామా?[a] ఎంతమాత్రమూ కాదు. ఎందుకంటే యూదులూ గ్రీకులూ—అందరూ పాపం కింద ఉన్నారని మేము ఇంతకుముందే ఆరోపించాము.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనకు ఏదైనా ఆధిక్యం ఉందా?”
    reason: alternative_reading
  - marker: b
    text: లేదా, “అందరూ పాపం అధికారానికి లోబడి ఉన్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: అయితే ఏమిటి?
  rationale: οὖν సూచించే తార్కిక కొనసాగింపును స్పష్టంగా ఉంచుతూ, పౌలు వాదనా శైలికి తగిన సంక్షిప్త ప్రశ్నగా అనువదించబడింది.
- source_word: προεχόμεθα
  choice: మనం మెరుగైన స్థితిలో ఉన్నామా?
  rationale: వివాదాస్పదమైన మధ్యమ వాచ్య క్రియను, ఈ సందర్భంలో యూదులకు ఉన్న తులనాత్మక స్థితిని ప్రశ్నించేదిగా సహజమైన తెలుగులో అందిస్తుంది; ‘మనకు ఏదైనా ఆధిక్యం ఉందా?’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: οὐ πάντως
  choice: ఎంతమాత్రమూ కాదు
  rationale: సందర్భంలోని బలమైన నిరాకరణను ఆధునిక, సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: προῃτιασάμεθα
  choice: మేము ఇంతకుముందే ఆరోపించాము
  rationale: ముందుగానే నేరారోపణ చేయడం అనే న్యాయవాద సంబంధమైన భావాన్ని నిలుపుతుంది.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: యూదులూ గ్రీకులూ
  rationale: τε καὶ జత నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతూ, మూలంలోని యూదులు–గ్రీకులు అనే పదజాలాన్నే అనుసరిస్తుంది.
- source_word: πάντας
  choice: అందరూ
  rationale: రెండు వర్గాల్లోని వారందరినీ సమగ్రంగా సూచించే బలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: పాపం కింద ఉన్నారు
  rationale: పాపానికి లోబడిన స్థితిని తెలిపే పౌలు సంక్షిప్త రూపకాన్ని పరిష్కరించకుండా సన్నిహితంగా నిలుపుతుంది.
theological_decisions:
- issue: προεχόμεθα లోని ప్రథమ పురుష బహువచనం మరియు క్రియ భావం
  choice: యూదుల తులనాత్మక స్థితిని అడిగే ప్రశ్నగా ‘మనం మెరుగైన స్థితిలో ఉన్నామా?’
  alternative: ‘మనకు ఏదైనా ఆధిక్యం ఉందా?’
  rationale: రోమా 3:1–9లో యూదుల ప్రత్యేక ప్రయోజనం మరియు నైతిక బాధ్యత రెండూ చర్చలో ఉన్నాయి. ప్రధాన పాఠం నైతిక లేదా తులనాత్మక మెరుగుదల ప్రశ్నను ప్రతిబింబిస్తుంది; ‘ఆధిక్యం’ అనే భావమూ భాషాపరంగా సాధ్యమైనందున పాదటిప్పణిలో నిలుపబడింది.
- issue: ὑφ’ ἁμαρτίαν యొక్క పరిధి
  choice: ‘పాపం కింద’ అనే సంక్షిప్త రూపకాన్ని నిలుపడం
  alternative: ‘పాపం అధికారానికి లోబడి’
  rationale: మూలంలోని లోబడిన స్థితి లేదా ఆధీనత భావాన్ని సిద్ధాంతపరంగా విస్తరించకుండా ప్రధాన పాఠంలో నిలుపుతూ, స్పష్టీకరణను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాదనా శైలి ఉపయోగించబడింది. ‘పాపం కింద’ అనే పౌలు రూపకం ప్రధాన పాఠంలో నిలుపబడింది; అస్పష్టతలను పాదటిప్పణుల్లో భద్రపరిచాం.
