id: ROM.3.29
reference: Romans 3:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: te
  text: లేక దేవుడు యూదులకు మాత్రమే దేవుడా? ఆయన అన్యజనులకు కూడా దేవుడు కాదా? అవును, అన్యజనులకు కూడా దేవుడే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అన్యజనులు” అని అనువదించిన గ్రీకు పదాన్ని మరింత అక్షరార్థంగా “దేశాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: లేక
  rationale: పౌలు వాదనలో తదుపరి ప్రశ్నారూప ప్రత్యామ్నాయాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: Ἰουδαίων
  choice: యూదులకు
  rationale: θεόςతో ఉన్న సంబంధాన్ని తెలుగులో సహజమైన ‘యూదులకు దేవుడు’ అనే నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: θεόςకు ప్రామాణిక తెలుగు పదం; ప్రశ్నలోని సంబంధార్థం విభక్తి నిర్మాణం ద్వారా స్పష్టమవుతుంది.
- source_word: μόνον
  choice: మాత్రమే
  rationale: యూదులకు పరిమితమా అనే ప్రత్యేకతను, ప్రశ్న యొక్క వాదనాత్మక బలాన్ని కాపాడుతుంది.
- source_word: οὐχὶ καὶ
  choice: కూడా దేవుడు కాడా?
  rationale: οὐχί ఆశించే సమాధానం అవుననే ప్రశ్నను సూచిస్తుంది; తెలుగు ప్రతికూల ప్రశ్నారూపం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐθνῶν
  choice: అన్యజనులకు
  rationale: యూదులతో స్పష్టమైన వ్యత్యాసంలో ఇది యూదేతర ప్రజలను సూచిస్తుంది; ‘దేశాలకు’ కంటే ‘అన్యజనులకు’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: ναὶ
  choice: అవును
  rationale: ర rhetorical ప్రశ్నకు సంక్షిప్తమైన స్పష్టమైన అంగీకార సమాధానం.
- source_word: καὶ
  choice: కూడా
  rationale: యూదులతోపాటు అన్యజనులనూ చేర్చే సమావేష బలాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἐθνῶνను ‘అన్యజనులు’గా లేదా ‘జనాలు/దేశాలు’గా అనువదించాలా
  choice: అన్యజనులు
  alternative: జనాలు లేదా దేశాలు
  rationale: ఈ వాక్యంలో యూదులు–ἐθνῶν వ్యత్యాసం ఉన్నందున, భౌగోళిక దేశాలకన్నా యూదేతర ప్రజలే ఉద్దేశ్యం. ‘అన్యజనులు’ పౌలు వాదనను పరిష్కరించి మార్చకుండా సందర్భోచితంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నోత్తర శైలి. మూలంలోని సంక్షిప్త వాదనాత్మక ప్రవాహాన్ని నిలుపుతూ, తెలుగులో అవసరమైన ‘దేవుడు’ను రెండవ ప్రశ్నలోను సమాధానంలోను స్పష్టంగా పునరుక్తి చేశాం.
