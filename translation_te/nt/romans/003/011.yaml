base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: te
  text: గ్రహించేవారెవరూ లేరు; దేవుణ్ణి వెదికేవారెవరూ[a] లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుణ్ణి శ్రద్ధగా వెదికేవారు’ లేదా ‘దేవుని కోసం పట్టుదలగా వెదికేవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: గ్రహించేవాడు
  rationale: ఈ వర్తమాన కృదంతం అవగాహనతో అర్థం చేసుకోవడాన్ని సూచిస్తుంది. ‘గ్రహించేవాడు’ సహజమైన ఆధునిక తెలుగు పదప్రయోగంగా మూలంలోని భావాన్ని కాపాడుతుంది.
- source_word: ἐκζητῶν
  choice: వెదికేవాడు
  rationale: ఈ సంయుక్త క్రియలో శ్రద్ధగా లేదా పట్టుదలగా వెదికే తీవ్రత ఉండవచ్చు. ప్రధాన వాక్యంలో సహజమైన ‘వెదికేవాడు’ను ఉంచి, ఆ బలమైన ఛాయను పాదసూచికలో తెలిపాం.
- source_word: οὐκ ἔστιν
  choice: ఒక్కడూ లేడు
  rationale: మూలంలోని సార్వత్రిక, బలమైన నిషేధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది; రెండుసార్లు వచ్చిన నిర్మాణాన్ని రెండుసార్లూ నిలిపింది.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: గ్రహించేవాడు / వెదికేవాడు
  rationale: నామవాచకార్థక వర్తమాన కృదంతాలను తెలుగులో సహజమైన కర్తృవాచక రూపాలతో అనువదించడం మూల నిర్మాణానికీ అర్థానికీ సముచితంగా ఉంటుంది.
- source_word: τὸν θεόν
  choice: దేవుణ్ణి
  rationale: ఇక్కడ నిర్దిష్టంగా దేవునినే సూచించే గ్రీకు కర్మపదానికి ఇది సహజమైన తెలుగు కర్మరూపం.
theological_decisions:
- issue: పౌలు ఉటంకించిన ఈ వాక్యంలోని నిషేధం యొక్క పరిధి
  choice: ‘ఒక్కడూ లేడు’ అనే నిరపేక్షమైన మాటను రెండుసార్లూ యథాతథ బలంతో ఉంచడం
  alternative: ‘నిజంగా గ్రహించేవాడు లేడు; నిజంగా దేవుణ్ణి వెదికేవాడు లేడు’ అని అర్థవివరణాత్మకంగా పరిమితం చేయడం
  rationale: గ్రీకు పాఠం వర్గీకృతమైన సార్వత్రిక నిషేధాన్ని వ్యక్తం చేస్తుంది. ‘నిజంగా’ వంటి పదాలను చేర్చి దాని బలాన్ని తగ్గించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. సమాంతర నిర్మాణం మరియు రెండుసార్లు వచ్చే సార్వత్రిక నిషేధం నిలుపబడ్డాయి. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం తర్వాత ఉంచబడింది.
