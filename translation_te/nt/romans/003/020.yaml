id: ROM.3.20
reference: Romans 3:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: te
  text: ఎందుకంటే ధర్మశాస్త్ర క్రియల వల్ల ఆయన ఎదుట ఏ మనిషీ నీతిమంతుడిగా తీర్చబడడు; ధర్మశాస్త్రం ద్వారా పాపం గురించిన జ్ఞానం కలుగుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: ధర్మశాస్త్రం నిర్దేశించిన క్రియల వల్ల
  rationale: νόμου అనే సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తూనే, ధర్మశాస్త్రాన్ని పాటించడం ద్వారా చేసే క్రియలు అనే మూల భావాన్ని నిలుపుతుంది.
- source_word: οὐ δικαιωθήσεται
  choice: నీతిమంతుడిగా తీర్చబడడు
  rationale: దైవిక న్యాయతీర్పు సందర్భంలోని న్యాయస్థాన భావాన్ని నిలుపుతుంది; కేవలం నైతికంగా మంచివాడవడం అనే అర్థానికి పరిమితం చేయదు.
- source_word: πᾶσα σὰρξ
  choice: ఏ మనిషీ
  rationale: ఇక్కడ సెమిటిక్ ప్రయోగమైన ‘సమస్త శరీరం’ మానవులందరినీ సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, సందర్భానుగుణంగా అందిస్తుంది.
- source_word: ἐνώπιον αὐτοῦ
  choice: ఆయన ఎదుట
  rationale: దేవుని సమక్షంలో మరియు ఆయన తీర్పు దృష్టిలో అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: పాపం గురించిన స్పష్టమైన జ్ఞానం
  rationale: ἐπίγνωσις లోని గుర్తింపు లేదా అవగాహన భావాన్ని ‘జ్ఞానం’గా అందించి, దాని బలాన్ని ‘స్పష్టమైన’తో సూచిస్తుంది.
theological_decisions:
- issue: ‘ధర్మశాస్త్ర క్రియలు’ మరియు నీతిమంతునిగా తీర్చబడడం మధ్య సంబంధం
  choice: క్రియల వల్ల ఎవరూ నీతిమంతుడిగా తీర్చబడరని నేరుగా పేర్కొనడం
  alternative: క్రియల వల్ల ఎవరూ నిజంగా నీతిమంతులు కాలేరని అనువదించడం
  rationale: δικαιόω యొక్క తీర్పు లేదా ప్రకటనా భావాన్ని కాపాడి, అంతర్గత నైతిక మార్పుగా మాత్రమే అర్థాన్ని నిర్ణయించకుండా ఉంటుంది.
- issue: ధర్మశాస్త్రం యొక్క కార్యం
  choice: పాపం గురించిన స్పష్టమైన జ్ఞానం కలిగించడం
  alternative: పాపాన్ని సృష్టించడం లేదా పాపం నుండి విమోచించడం
  rationale: మూలవాక్యం ధర్మశాస్త్రం ద్వారా పాపం తెలిసివస్తుందని చెబుతుంది; దానికంటే ఎక్కువ సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా ఉండి, ‘ధర్మశాస్త్రం’, ‘నీతిమంతుడిగా తీర్చబడడం’ వంటి పౌలు వాడిన ప్రధాన ధార్మిక-న్యాయపర పదబంధాలను గౌరవప్రదంగా నిలుపుతుంది.
