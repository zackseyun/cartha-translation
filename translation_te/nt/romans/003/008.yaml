id: ROM.3.8
reference: Romans 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: te
  text: మరి, మేము అపవాదుగా చెప్పబడుతున్నట్లుగానూ, కొందరు మేము ఇలా చెబుతున్నామని అంటున్నట్లుగానూ, “మేలు కలగడానికి చెడు చేద్దాం” అని ఎందుకు అనకూడదు? వారి మీద తీర్పు న్యాయమైనదే.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “మరి—మా గురించి అపవాదుగా చెప్పబడుతున్నట్లూ, కొందరు మేము ఇలా చెబుతున్నామని అంటున్నట్లూ—‘మేలు కలగడానికి చెడు చేద్దాం’ అని అనకూడదా?”'
    reason: lexical_alternative
  - marker: b
    text: “వారి” అనేది ప్రధానంగా ‘కొందరు’ అని చెప్పబడిన, పౌలుపై ఈ అపవాదును మోపేవారిని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: మేము దూషణకు గురవుతున్నాం
  rationale: ఇక్కడ దేవదూషణ అనే సాంకేతిక భావం కంటే పౌలు బోధను విరోధులు అపవాదుగా వక్రీకరించడం ఉద్దేశం; ఈ ఎంపిక సహజమైన తెలుగులో ఆ విరోధపూరిత నిందను తెలియజేస్తుంది.
- source_word: φασίν τινες
  choice: కొందరు ... అంటున్నారు
  rationale: వాక్యంలోని ఆరోపణాత్మక సందర్భాన్ని నిలుపుతూ, గ్రీకు పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λέγειν
  choice: మేము ... చెబుతున్నామని
  rationale: ‘బోధిస్తున్నామని’ అని భావాన్ని విస్తరించకుండా, infinitive యొక్క ప్రత్యక్ష అర్థమైన ‘చెప్పడం’నే నిలుపుతుంది.
- source_word: Ποιήσωμεν
  choice: చేద్దాం
  rationale: మొదటి పురుష బహువచన hortatory subjunctive‌ను సహజమైన ప్రేరణార్థక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὰ κακὰ
  choice: చెడు
  rationale: article-plus-adjective నిర్మాణాన్ని ‘చెడు కార్యాలు’ అని అనవసరంగా విస్తరించకుండా సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: మేలు కలిగేలా
  rationale: ἵνα యొక్క ఉద్దేశం/ఫలితం మధ్య ఉండే భావాన్ని సహజంగా ఉంచుతుంది; ‘మంచి విషయాలు రావడానికి’ అనే కృత్రిమ పదానువాదాన్ని నివారిస్తుంది.
- source_word: κρίμα
  choice: విధించబడే శిక్ష
  rationale: ఈ సందర్భంలో ప్రతికూల న్యాయతీర్పు ఉద్దేశం; ‘తీర్పు’ కంటే శిక్షాత్మక ఫలితాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔνδικόν
  choice: న్యాయమైనదే
  rationale: న్యాయపరమైన, నైతికమైన సముచితత్వం రెండింటినీ గంభీరంగా నిలుపుతుంది.
- source_word: καὶ μὴ
  choice: మరి ... ఎందుకు అనకూడదు?
  rationale: ముందటి వచనంలోని వాదనను కొనసాగించే గ్రీకు elliptical నిర్మాణాన్ని తెలుగులో అర్థవంతమైన ప్రశ్నగా అందిస్తుంది.
theological_decisions:
- issue: ὧν అనే సంబంధ సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ‘అలాంటివారికి’ అని అనువదించి, ఈ అపవాదును చెప్పే లేదా దానికి సమ్మతించే వారిని సూచించేలా చేశాం.
  alternative: ‘వారి శిక్ష’ అని మాత్రమే ఉంచి సూచితులను అస్పష్టంగా విడిచిపెట్టడం.
  rationale: వ్యాకరణపరంగా ఇది సమీపంలోని τινες (‘కొందరు’)ను సూచిస్తుంది; అయితే ఆరోపణతో కూడిన తర్కాన్ని సమర్థించేవారూ భావపరిధిలో ఉన్నారని పాదటిప్పణిలో స్పష్టం చేశాం, కొత్త సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా అయినప్పటికీ గంభీరతను నిలుపుతూ అనువదించబడింది. గ్రీకు వాక్యంలోని వ్యంగ్యభరిత rhetorical question‌ను ‘ఎందుకు అనకూడదు?’ ద్వారా, ఆరోపణను quotation marks ద్వారా స్పష్టంగా ఉంచాం.
