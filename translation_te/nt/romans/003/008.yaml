revisions:
- from: మరి—మేము దూషణకు గురవుతున్నట్లుగానూ, కొందరు మేము ఇలా చెబుతున్నామని అంటున్నట్లుగానూ—“మేలు కలిగేలా చెడు చేద్దాం” అని ఎందుకు అనకూడదు? అలాంటివారికి విధించబడే శిక్ష న్యాయమైనదే.[a][b]
