    rationale: ὧν ప్రధానంగా ‘కొందరు’ అని చెప్పబడిన అపవాదకులను సూచిస్తుంది. ఆరోపణను ‘సమర్థించేవారిని’ కూడా చేర్చడం సాధ్యమైన అనువర్తనం కావచ్చు, కానీ పాదటిప్పణి మూలంలోని సూచనను మించి వ్యాఖ్యానిస్తుంది.
