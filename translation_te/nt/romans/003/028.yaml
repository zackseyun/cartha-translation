source:
  edition: SBLGNT
  text: λογιζόμεθα ⸀γὰρ ⸂δικαιοῦσθαι πίστει⸃ ἄνθρωπον χωρὶς ἔργων νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: te
  text: ఎందుకంటే, ధర్మశాస్త్ర క్రియలు లేకుండానే విశ్వాసం ద్వారా ఒక వ్యక్తి నీతిమంతునిగా తీర్చబడడాన్ని[a] మనం నిర్ధారిస్తున్నాం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీతిమంతుడని ప్రకటించబడడాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఒక మనిషి.” గ్రీకు పదం వ్యాకరణపరంగా పుంలింగమైనప్పటికీ, ఇక్కడ సాధారణంగా ఒక వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: మనం నిర్ధారిస్తున్నాం
  rationale: ఈ క్రియ పౌలు తర్కబద్ధంగా చేరుకున్న నిర్ణయాన్ని సూచిస్తుంది. ‘నిర్ధారిస్తున్నాం’ అనేది వాదన ప్రవాహంలో సహజంగా ఉండి, కేవలం ‘భావిస్తున్నాం’ అనే బలహీన భావాన్ని నివారిస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు కారణాన్ని లేదా వివరణను జతచేసే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: δικαιοῦσθαι
  choice: నీతిమంతునిగా తీర్చబడతాడు
  rationale: గ్రీకు వర్తమాన కర్మణి క్రియార్థాన్ని నిలుపుతూ, పౌలు వాడుకలోని న్యాయస్థాన సంబంధమైన మరియు ధార్మిక భావవ్యాప్తిని ముందుగానే ఒకే వివరణకు పరిమితం చేయదు.
- source_word: πίστει
  choice: విశ్వాసం ద్వారా
  rationale: దత్తివిభక్తి ఇక్కడ సాధన భావాన్ని వ్యక్తం చేస్తుంది. ‘విశ్వాసం ద్వారా’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని భావాన్ని కాపాడుతుంది.
- source_word: ἄνθρωπον
  choice: ఒక వ్యక్తి
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగమైనప్పటికీ ఇక్కడ మానవుని సాధారణంగా సూచిస్తుంది; ‘ఒక వ్యక్తి’ ఆ సమగ్ర భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: χωρὶς
  choice: లేకుండానే
  rationale: విశ్వాసం ద్వారా నీతిమంతునిగా తీర్చబడటానికి ధర్మశాస్త్ర క్రియలను వేరుచేసి మినహాయించే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔργων νόμου
  choice: ధర్మశాస్త్ర క్రియలు
  rationale: పౌలు వాడే గుర్తించదగిన పదబంధానికి రూపసంబంధాన్ని కాపాడుతుంది; దానిని సాధారణ మంచి పనులకో, కేవలం నైతిక ప్రయత్నానికో ముందుగానే కుదించదు.
theological_decisions:
- issue: δικαιοῦσθαι అనే పదంలోని న్యాయస్థాన సంబంధమైన మరియు ధార్మిక భావం
  choice: నీతిమంతునిగా తీర్చబడతాడు
  alternative: నీతిమంతుడని ప్రకటించబడతాడు
  rationale: ప్రధాన పాఠం స్థిరమైన పౌలు సంబంధిత పదప్రయోగాన్ని నిలుపుతుంది. ప్రత్యామ్నాయం దాని ప్రకటనాత్మక భావాన్ని వివరిస్తుంది; అయితే ప్రధాన పాఠంలోనే భావాన్ని పూర్తిగా ఆ ఒక్క కోణానికి పరిమితం చేయకుండా పాదటిప్పణిలో ఉంచబడింది.
- issue: ἄνθρωπον పదం యొక్క సాధారణ మానవ సూచన
  choice: ఒక వ్యక్తి
  alternative: ఒక పురుషుడు / ఒక మనిషి
  rationale: మూలపదం వ్యాకరణపరంగా పుంలింగమైనా, సందర్భంలో పురుషులను మాత్రమే కాక సాధారణంగా ఏ వ్యక్తినైనా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘ధర్మశాస్త్ర క్రియలు’ అనే పౌలు సంబంధిత పదబంధాన్ని వివరణాత్మకంగా విస్తరించకుండా అలాగే నిలిపి, మూలంలోని భావ ఉద్రిక్తతను కాపాడాం.
