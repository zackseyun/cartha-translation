id: ROM.12.9
reference: Romans 12:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: te
  text: ప్రేమ కపటంలేకుండా ఉండాలి.[a] చెడును పూర్తిగా ద్వేషించండి; మంచిని గట్టిగా పట్టుకొని ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రేమ నిష్కపటంగా ఉండాలి.” గ్రీకులో అక్షరార్థంగా, “కపటం లేని ప్రేమ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: ἀγάπηకి సహజమైన, విస్తృతంగా అర్థమయ్యే ఆధునిక తెలుగు సమానార్థకం; ఈ సందర్భంలోని నైతిక భావాన్ని నిలుపుతుంది.
- source_word: ἀνυπόκριτος
  choice: కపటం లేనిదిగా
  rationale: నటించడం లేదా వేషధారణ అనే భావం లేని ప్రేమను సూచించే గ్రీకు పదంలోని స్పష్టమైన నైతిక భావాన్ని నిలుపుతుంది. క్రియలేని గ్రీకు వాక్యాన్ని తెలుగులో సహజమైన ప్రబోధంగా చేయడానికి ‘ఉండాలి’ చేర్చబడింది.
- source_word: ἀποστυγοῦντες
  choice: తీవ్రంగా అసహ్యించుకోండి
  rationale: ఈ పదం బలమైన విరక్తిని సూచిస్తుంది. ‘అసహ్యించుకోండి’ సహజమైన తెలుగు; ‘తీవ్రంగా’ మూలపదంలోని బలాన్ని వ్యక్తం చేస్తుంది. సందర్భానుసారం కృదంతానికి ఆజ్ఞార్థక బలం ఇవ్వబడింది.
- source_word: τὸ πονηρόν
  choice: చెడును
  rationale: నపుంసకలింగ విశేషణం నామవాచకంగా వాడబడింది; ‘చెడును’ ఏ ఒక్క చర్యకూ పరిమితం చేయకుండా విస్తృత నైతిక వర్గాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κολλώμενοι
  choice: గట్టిగా అంటిపెట్టుకొని ఉండండి
  rationale: దగ్గరగా అతుక్కొని, విడువకుండా ఉండే బలమైన అనుబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది. సందర్భంలో దీనికి ఆజ్ఞార్థక బలం ఉంది.
- source_word: τῷ ἀγαθῷ
  choice: మంచిని
  rationale: నామవాచకంగా వాడిన నపుంసకలింగ విశేషణాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘చెడును’ అనే సమాంతర నిర్మాణాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: క్రియలేని మొదటి పదబంధం మరియు ప్రబోధ సందర్భంలోని కృదంతాల బలం
  choice: ‘ప్రేమ ... ఉండాలి; ... అసహ్యించుకోండి; ... అంటిపెట్టుకొని ఉండండి’ అనే వరుస ప్రబోధాలుగా అనువదించడం
  alternative: ‘కపటం లేని ప్రేమ—చెడును అసహ్యించుకుంటూ, మంచిని అంటిపెట్టుకొని’ వంటి మరింత అక్షరానుసారమైన అసంపూర్ణ నిర్మాణం
  rationale: గ్రీకులో మొదటి భాగం క్రియలేని నామవాచక పదబంధం; తరువాతి రెండు పదాలు కృదంతాలు. అయితే రోమీయులకు 12వ అధ్యాయంలోని వరుస ప్రబోధాల సందర్భం వీటికి ఆజ్ఞార్థక బలాన్ని ఇస్తుంది. తెలుగు పాఠకునికి ఉద్దేశాన్ని సహజంగా తెలియజేస్తూనే మూల నిర్మాణ స్వభావాన్ని పాదసూచికలో పేర్కొనబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రబోధ శైలి ఉపయోగించబడింది. ‘తీవ్రంగా అసహ్యించుకోండి’ మరియు ‘గట్టిగా అంటిపెట్టుకొని ఉండండి’ మూలంలోని బలమైన విరక్తి, అనుబంధ భావాలను సామాన్య పాఠకునికి స్పష్టంగా అందిస్తాయి.
