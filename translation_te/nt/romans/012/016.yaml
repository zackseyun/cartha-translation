revisions:
- from: ఒకరి పట్ల ఒకరు ఒకే మనస్సు కలిగి ఉండండి; ఉన్నతమైన వాటిపై మనస్సు పెట్టకుండా, అణకువైనవారితో కలిసిమెలిసి ఉండండి.[a] మీ దృష్టిలో మీరే జ్ఞానులుగా మారకండి.
  to: ఒకరి పట్ల ఒకరు ఒకే మనస్సు కలిగి ఉండండి; ఉన్నతమైన వాటిపై మనస్సు పెట్టకుండా, తక్కువ స్థితిలో ఉన్నవారితో కలిసిమెలిసి ఉండండి.[a] మీ దృష్టిలో మీరే జ్ఞానులుగా మారకండి.
