id: ROM.12.16
reference: Romans 12:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: te
  text: ఒకరి పట్ల ఒకరు ఒకే మనస్సు కలిగి ఉండండి; ఉన్నతమైన వాటిపై మనస్సు పెట్టకుండా, తక్కువ స్థితిలో ఉన్నవారితో కలిసిమెలిసి ఉండండి.[a] మీ దృష్టిలో మీరే జ్ఞానులుగా మారకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అల్పమైన విషయాలకు లేదా పనులకు మిమ్మల్ని మీరు అప్పగించుకోండి.” ఇక్కడ గ్రీకు పదం తక్కువ స్థితిలో ఉన్న వ్యక్తులను గానీ, అల్పమైన విషయాలను గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: ఒకరి పట్ల ఒకరు ఒకే మనస్సు కలిగి ఉండండి
  rationale: ఈ గ్రీకు నుడికారం అందరూ ఒకే అభిప్రాయం కలిగి ఉండాలని మాత్రమే కాక, పరస్పర సామరస్యంతో కూడిన వైఖరిని కలిగి ఉండాలని సూచిస్తుంది. తెలుగు వాక్యం సంబంధపరమైన దిశను, ఆజ్ఞారూప భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: ఉన్నతమైన వాటిపై మనస్సు పెట్టకుండా
  rationale: అక్షరార్థంగా ‘ఉన్నతమైన వాటిని తలంచకుండా’ అనే ఈ మాట గర్వపూరిత వైఖరినీ, ఉన్నత స్థానం లేదా గొప్ప వాటిపట్ల ఆకాంక్షనూ సూచించగలదు. ఎంపిక చేసిన రూపం ఆ విస్తృతిని కాపాడుతుంది.
- source_word: τοῖς ταπεινοῖς συναπαγόμενοι
  choice: అణకువైనవారితో కలిసిమెలిసి ఉండండి
  rationale: సందర్భంలో συναπαγόμενοι అనేది తక్కువ స్థితిలో ఉన్నవారితో సహవాసం చేయడం లేదా వారితో కలిసి నడవడం అనే భావాన్ని ఇస్తుంది. సహజమైన తెలుగుకోసం ‘కలిసిమెలిసి ఉండండి’ ఎంచుకోబడింది; τοῖς ταπεινοῖς‌లో వ్యక్తులు లేదా అల్పమైన విషయాలు అనే సందిగ్ధతను పాదటిప్పణి తెలియజేస్తుంది.
- source_word: μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς
  choice: మీ దృష్టిలో మీరే జ్ఞానులుగా మారకండి
  rationale: γίνεσθε‌లోని ‘అలా మారడం’ అనే ప్రక్రియాత్మక భావాన్ని ‘మారకండి’ నిలుపుతుంది; παρ’ ἑαυτοῖς స్వీయ అంచనాలో జ్ఞానులమని భావించే అహాన్ని సూచిస్తుంది.
theological_decisions:
- issue: τὰ ὑψηλά మరియు τοῖς ταπεινοῖς సామాజిక స్థితిని సూచిస్తున్నాయా, లేక గర్వం మరియు అణకువకు సంబంధించిన వైఖరులను సూచిస్తున్నాయా?
  choice: ప్రధాన పాఠ్యంలో ఉన్నతమైన వాటిపై మనస్సు పెట్టడాన్ని అణకువైనవారితో కలిసిమెలిసి ఉండటానికి వ్యతిరేకంగా ఉంచడం
  alternative: ‘గర్విష్ఠులుగా ఉండకండి; అణకువగలవారితో సహవసించండి’ లేదా ‘గొప్ప వాటిని ఆశించకండి; అల్పమైన పనులకు మిమ్మల్ని మీరు అప్పగించుకోండి’
  rationale: గ్రీకు పదాలు అంతర్గత గర్వాన్ని, సామాజికంగా ఉన్నతమైన స్థితిని, అణకువగల లేదా తక్కువ స్థితిలో ఉన్న వ్యక్తులను, లేక అల్పమైన విషయాలను సూచించగలవు. ప్రధాన పాఠ్యం సందర్భానికి సహజమైన వ్యక్తుల అర్థాన్ని ఇస్తూ, నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆజ్ఞారూప శైలి వాడబడింది. ‘ఒకే మనస్సు,’ ‘మనస్సు పెట్టడం,’ ‘మీ దృష్టిలో’ వంటి రూపాలు మూలంలోని పునరుక్త భావసంబంధాన్ని వీలైనంతవరకు నిలుపుతాయి.
