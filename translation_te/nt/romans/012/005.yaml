id: ROM.12.5
reference: Romans 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: te
  text: అలాగే, అనేకులమైన మనం మెస్సీయలో[a] ఒకే శరీరం; మనలో ఒక్కొక్కరం ఒకరికొకరం అవయవాలం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రీస్తులో.” గ్రీకు బిరుదు Χριστόςను దాని అర్థాన్ని చూపించడానికి “మెస్సీయ” అని అనువదించవచ్చు; “క్రీస్తు” అనేది సంప్రదాయంగా వాడే రూపం. ఇక్కడ దాని బిరుదు భావాన్ని నిలుపడానికి “మెస్సీయ” అని అనువదించాం.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: అలాగే
  rationale: మునుపటి వచనంలోని శరీరపు ఉపమానాన్ని ప్రస్తుత వచనానికి అన్వయిస్తూ ఉన్న పోలికను, అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οἱ πολλοὶ
  choice: అనేకులమైన మనం
  rationale: సందర్భంలో పౌలు తనతో సహా విశ్వాసుల గురించి మాట్లాడుతున్నాడు; ఈ రూపం బహుత్వాన్ని, ప్రథమ పురుష సమావేషాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἓν σῶμά
  choice: ఒకే శరీరం
  rationale: ఏకత్వాన్ని నొక్కిచెప్పుతూ శరీర రూపకాన్ని యథాతథంగా కాపాడుతుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός అనే బిరుదులోని అభిషిక్త రాజు భావాన్ని నిలుపుతూ, పౌలు చెప్పే మెస్సీయతో ఐక్యతను సూచించే ‘లో’ నిర్మాణాన్ని కాపాడుతుంది.
- source_word: τὸ δὲ καθ’ εἷς
  choice: విడివిడిగా మనం
  rationale: ప్రతి వ్యక్తిని వేరువేరుగా పరిగణించే పంపిణీ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀλλήλων
  choice: ఒకరికొకరం
  rationale: విశ్వాసుల మధ్య పరస్పర సంబంధాన్ని తెలుగులో నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: μέλη
  choice: అవయవాలు
  rationale: శరీర రూపకాన్ని స్పష్టంగా నిలుపుతుంది; సమూహంలోని భాగాలు అనే ద్వితీయ భావం కూడా సందర్భంలో గ్రాహ్యంగా ఉంటుంది.
theological_decisions:
- issue: ἐν Χριστῷ లోని Χριστῷ బిరుదు అనువాదం
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ దాని బిరుదు భావాన్ని స్పష్టంగా నిలుపుతుంది. అయితే తెలుగు క్రైస్తవ వాడుకలో స్థిరమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చి, రెండింటి సాధ్యత్వాన్ని కాపాడాం.
- issue: సభను శరీరంగా చెప్పే రూపకం
  choice: ఒకే శరీరం; ఒకరికొకరం అవయవాలు
  alternative: ఒకే దేహం; ఒకరికొకరం భాగాలు
  rationale: గ్రీకు వాక్యంలో ఉన్న శరీర-అవయవ రూపకాన్ని వివరణాత్మకంగా మార్చకుండా నిలిపి, ఐక్యత మరియు పరస్పర అనుబంధం రెండింటినీ వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘శరీరం—అవయవాలు’ అనే మూల రూపకాన్ని నిలిపి, ‘అలాగే’ మరియు అర్ధవిరామంతో వాక్యంలోని పోలిక, విభజన స్పష్టంగా చేశాం.
