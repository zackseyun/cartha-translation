id: ROM.12.8
reference: Romans 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: te
  text: ప్రోత్సహించేవాడైతే[a], ప్రోత్సహించడంలో; పంచిపెట్టేవాడు[b], ఉదారతతో[c]; నాయకత్వం వహించేవాడు[d], శ్రద్ధతో[e]; కనికరం చూపేవాడు, సంతోషంతో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “హితబోధ చేసేవాడు … హితబోధ చేయడంలో.” గ్రీకు పదజంటకు ప్రోత్సహించడం, హితబోధ చేయడం అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఇచ్చేవాడు,” “విరాళమిచ్చేవాడు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “నిష్కపటతతో,” “సరళతతో.” గ్రీకు ἁπλότης సందర్భాన్ని బట్టి ఏకనిష్ఠత, నిష్కపటత, సరళత లేదా ఉదారతను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: లేదా “నిర్వహించేవాడు,” “పర్యవేక్షించేవాడు.”
    reason: lexical_alternative
  - marker: e
    text: లేదా “ఆసక్తితో,” “పట్టుదలతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ παρακαλῶν … ἐν τῇ παρακλήσει
  choice: ప్రోత్సహించేవాడు … ప్రోత్సహించడంలో
  rationale: παρακαλέω / παράκλησις పదజంటలోని క్రియ–నామ సంబంధాన్ని తెలుగులోనూ కనిపించేలా ఉంచుతుంది. సందర్భంలో ప్రోత్సాహం, హితబోధ రెండూ సాధ్యమైనప్పటికీ, సాధారణ పాఠకునికి సహజమైన విస్తృత పదంగా ‘ప్రోత్సహించు’ ఎంచుకోబడింది.
- source_word: ὁ μεταδιδοὺς
  choice: పంచిపెట్టేవాడు
  rationale: తనకున్న వనరులను ఇతరులతో పంచుకోవడం లేదా ఇవ్వడం అనే క్రియాశీల భావాన్ని తెలియజేస్తుంది.
- source_word: ἐν ἁπλότητι
  choice: ఉదారతతో
  rationale: వనరులను పంచిపెట్టే తక్షణ సందర్భంలో ἁπλότης పదానికి ‘ఉదారత’ అనే భావం అత్యంత సముచితం; దాని ‘నిష్కపటత/సరళత’ భావసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: ὁ προϊστάμενος
  choice: నాయకత్వం వహించేవాడు
  rationale: నడిపించడం లేదా బాధ్యతతో పర్యవేక్షించడం అనే విస్తృత భావాన్ని ఇస్తుంది; ఒక నిర్దిష్ట సంఘపదవిని అనవసరంగా సూచించదు.
- source_word: ἐν σπουδῇ
  choice: శ్రద్ధతో
  rationale: σπουδήలోని శ్రద్ధ, ఆసక్తి, పట్టుదల భావాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ ἐλεῶν
  choice: కనికరం చూపేవాడు
  rationale: పాల్గొనే వ్యక్తి చేసే క్రియను స్పష్టంగా ఉంచి, ἐλεέωలోని దయాపూర్వక చర్యను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν ἱλαρότητι
  choice: సంతోషంతో
  rationale: బలవంతంగా కాకుండా ఆనందపూర్వకంగా, సుముఖంగా కనికరం చూపే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: προϊστάμενος పదం సూచించే పరిధి
  choice: సాధారణంగా ‘నాయకత్వం వహించేవాడు’ అని అనువదించబడింది
  alternative: ‘పాలించేవాడు,’ ‘నిర్వహించేవాడు,’ లేదా ఒక నిర్దిష్ట సంఘాధికారి
  rationale: మూలపాఠం కృపావరాలను విస్తృత కర్తృవాచక రూపాల్లో పేర్కొంటుంది; సాంకేతిక పదవిని స్పష్టంగా చెప్పదు. అందువల్ల సంఘపాలనకు సంబంధించిన ఏ ప్రత్యేక సంప్రదాయాన్నీ పాఠ్యంలోకి చేర్చలేదు.
- issue: పంచిపెట్టడంలో ἁπλότης భావం
  choice: ఉదారత
  alternative: నిష్కపటత లేదా సరళత
  rationale: వనరులను పంచిపెట్టే సందర్భం ఉదారత అనే భావానికి బలమిస్తుంది; అయితే గ్రీకు పదంలోని నిజమైన అర్థవిస్తృతిని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. గ్రీకు వాక్యంలోని సంక్షిప్త జాబితా నిర్మాణాన్ని కాపాడుతూ, తెలుగులో భావం సంపూర్ణంగా వినిపించేందుకు ప్రతి భాగంలో తగిన క్రియను పునరుక్తి చేశాం. ‘నాయకత్వం’ అనే పదం ఏ ప్రత్యేక సంఘపదవినీ నిర్దేశించకుండా ఉద్దేశపూర్వకంగా విస్తృతంగా ఉంచబడింది.
