id: ROM.12.12
reference: Romans 12:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/012.yaml
  text: rejoicing in hope[a], enduring in affliction, persisting in prayer[b],
translation:
  language: te
  text: ఆశలో ఆనందించండి; శ్రమలో[a] సహిస్తూ ఉండండి; ప్రార్థనలో పట్టుదలగా ఉండండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శ్రమ’కు ‘తీవ్రమైన బాధ,’ ‘ఇబ్బంది’ లేదా ‘ఒత్తిడి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రార్థనలో పట్టుదలగా ఉండండి’కు ‘ప్రార్థనకు అంకితమై ఉండండి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: నిరీక్షణలో
  rationale: ἐλπίς ఆశతో కూడిన ఎదురుచూపును సూచిస్తుంది. సందర్భంలోని దత్తి రూపాన్ని సహజమైన తెలుగులో ‘నిరీక్షణలో’ అని ఇచ్చాం.
- source_word: χαίροντες
  choice: ఆనందించండి
  rationale: వర్తమాన కర్తరి అసమాపక క్రియ అయినా, ఈ ఉపదేశ సందర్భంలో exhortational force ఉంది. తెలుగులో సహజంగా, స్పష్టంగా ఉండేందుకు ఆజ్ఞార్థక రూపం వాడాం.
- source_word: θλίψει
  choice: శ్రమలో
  rationale: θλῖψις ఒత్తిడి, కష్టం, బాధ లేదా హింసాత్మక ప్రతికూలతను సూచించగలదు. ‘శ్రమ’ సంక్షిప్తంగా ఉండి దాని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ὑπομένοντες
  choice: సహించి నిలబడండి
  rationale: ὑπομένω కష్ట పరిస్థితిలో వెనుదిరగకుండా స్థిరంగా సహించడాన్ని సూచిస్తుంది. ‘సహించి నిలబడండి’ అనే పదబంధం సహనం మరియు నిలకడ అనే రెండు పార్శ్వాలను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: προσευχῇ
  choice: ప్రార్థనలో
  rationale: προσευχή సాధారణంగా ప్రార్థనను సూచిస్తుంది; దత్తి రూపం ఇక్కడ ‘ప్రార్థనలో’ అని సహజంగా అనువదించబడింది.
- source_word: προσκαρτεροῦντες
  choice: పట్టుదలగా కొనసాగండి
  rationale: προσκαρτερέω ఒక కార్యంలో స్థిరంగా కొనసాగడం లేదా దానికి అంకితమై ఉండడాన్ని సూచిస్తుంది. ‘పట్టుదలగా కొనసాగండి’ నిరంతరతను, దృఢ నిబద్ధతను రెండింటినీ తెలియజేస్తుంది.
theological_decisions:
- issue: మూడు గ్రీకు అసమాపక క్రియల exhortational force
  choice: తెలుగులో మూడు సమాంతర ఆజ్ఞలుగా అనువదించడం
  alternative: ‘ఆనందిస్తూ, సహిస్తూ, కొనసాగుతూ’ అనే అసమాపక క్రియా వరుసగా ఉంచడం
  rationale: రోమా 12లోని ఉపదేశ సందర్భం వీటికి ఆజ్ఞాత్మక బలాన్ని ఇస్తుంది. మూడు ఆజ్ఞలు తెలుగులో సహజంగా ఉండి, మూలంలోని సంక్షిప్త త్రిభాగ నిర్మాణాన్ని కాపాడుతాయి; ప్రత్యేక సిద్ధాంతార్థాన్ని జోడించవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన ఉపదేశ శైలి. మూడు సంక్షిప్త సమాంతర వాక్యభాగాలు మూలంలోని లయను నిలుపుతాయి.
