  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: te
  text: చెడిచేత ఓడిపోకు[a]; మంచితో చెడును జయించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెడైనది నిన్ను జయించనివ్వకు; మంచిదానితో చెడైనదానిని జయించు.” గ్రీకులో ఆర్టికల్‌తో కూడిన నపుంసక విశేషణాలు ఉన్నాయి; వాటిని “చెడు, మంచి” అనే భావవాచకాలుగా లేదా “చెడైనది, మంచిదైనది” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: ఓడిపోకు
  rationale: μήతో కూడిన వర్తమానకాల కర్మణి ఆజ్ఞారూపం ఏకవచన నిషేధాన్ని తెలియజేస్తుంది. ‘ఓడిపోకు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; కర్మణి భావాన్ని, νικάωలోని జయాపజయ చిత్రాన్ని కాపాడుతుంది.
- source_word: ὑπὸ τοῦ κακοῦ
  choice: చెడుచేత
  rationale: ὑπό + షష్ఠీ విభక్తి కర్మణి వాక్యంలో కర్తృత్వాన్ని సూచిస్తుంది. ఆర్టికల్‌తో ఉన్న నపుంసక ఏకవచన విశేషణం ‘చెడు’ లేదా ‘చెడైనది’ అని అర్థమవుతుంది; ప్రధాన పాఠ్యంలో సంక్షిప్తమైన సాధారణ నైతిక భావాన్ని ఎంచుకున్నాం.
- source_word: ἀλλὰ νίκα
  choice: జయించు
  rationale: ἀλλά బలమైన వ్యతిరేకతను చూపుతుంది; νίκα వర్తమానకాల కర్తరి ఆజ్ఞారూపం. ‘జయించు’ మొదటి భాగంలోని ఓటమికి స్పష్టమైన ప్రతిపక్షాన్ని ఏర్పరుస్తూ గ్రీకు విజయ-పరాజయ రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐν τῷ ἀγαθῷ
  choice: మంచిచేత
  rationale: ἐν + చతుర్థీ ఇక్కడ సాధనార్థకంగా ఉంది. ‘మంచిచేత’ చెడును జయించే సాధనాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ κακόν
  choice: చెడును
  rationale: ఆర్టికల్‌తో ఉన్న నపుంసక ఏకవచనం సాధారణ నైతిక వర్గాన్ని సూచించగలదు. ‘చెడును’ అనే రూపం వాక్యంలోని సంక్షిప్త వ్యతిరేక సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: κακός/ἀγαθόςలను వ్యక్తులుగా (‘దుష్టుడు’) అనువదించాలా, లేక నైతిక భావాలుగా ఉంచాలా
  choice: ‘చెడు’, ‘మంచి’ అనే నైతిక భావాలు
  alternative: వ్యక్తీకరించి ‘దుష్టుడు’ లేదా ‘దుష్టశక్తి’ అని అనువదించడం
  rationale: గ్రీకులోని నపుంసక రూపాలు సహజంగా ‘చెడు/చెడైనది’, ‘మంచి/మంచిదైనది’ అనే భావాలను ఇస్తాయి. సమీప సందర్భం కూడా అపకారానికి విశ్వాసి ఎలా స్పందించాలో బోధిస్తుంది; అందువల్ల పాఠ్యం స్పష్టంగా చెప్పని వ్యక్తిగత దుష్టసత్త్వాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన ఆజ్ఞారూపాన్ని ఉపయోగించాం. ‘ఓడిపోకు—జయించు’ అనే సహజ వ్యతిరేక జంట గ్రీకు νικάω పదపునరుక్తిలోని జయాపజయ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది; ‘చెడుచేత—మంచిచేత’ సమాంతరత మూలపాఠ్యపు అలంకార సంక్షిప్తతను నిలుపుతుంది.
