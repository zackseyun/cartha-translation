id: ROM.12.14
reference: Romans 12:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εὐλογεῖτε τοὺς ⸀διώκοντας, εὐλογεῖτε καὶ μὴ καταρᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: te
  text: మిమ్మల్ని హింసించేవారిని[a] దీవించండి; దీవించండి, శపించకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిమ్మల్ని వెంటాడేవారిని.’ గ్రీకు క్రియకు ‘వెంటాడడం’ అనే అర్థం కూడా ఉండవచ్చు; అయితే ఇక్కడ అది శత్రుత్వంతో హింసించడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: దీవించండి
  rationale: బహువచన ఆజ్ఞార్థక రూపంలోని εὐλογέωకు సహజమైన, సంక్షిప్తమైన తెలుగు సమానం. ఇతరుల మేలు కోరడం లేదా వారిపై ఆశీర్వాదం పలకడం అనే నైతిక-ఆధ్యాత్మిక భావాన్ని నిలుపుతుంది. పౌలు ఇచ్చిన ఉద్ఘాటనను కాపాడేందుకు పునరుక్తిని అలాగే ఉంచాం.
- source_word: τοὺς διώκοντας
  choice: మిమ్మల్ని హింసించేవారిని
  rationale: ఆర్టికల్‌తో కూడిన వర్తమాన కృదంతం ‘హింసించేవారు’ అనే నామవాచకార్థంలో పనిచేస్తుంది. διώκωకు ‘వెంటాడడం’ అనే విస్తృత అర్థం ఉన్నప్పటికీ, ఈ నైతిక సందర్భంలో శత్రుత్వపూర్వక హింస ప్రధాన భావం. గ్రీకులో సందర్భం ద్వారా అర్థమయ్యే కర్మను సహజమైన తెలుగుకోసం ‘మిమ్మల్ని’ అని స్పష్టంచేశాం.
- source_word: καὶ
  choice: —
  rationale: గ్రీకులోని సాధారణ సంధాన భావాన్ని తెలుగులో విరామచిహ్నం మరియు వరుస ఆజ్ఞల నిర్మాణం సహజంగా వ్యక్తం చేస్తాయి; ‘మరియు’ అని చేర్చితే వాక్యం కొంత కృత్రిమంగా ఉంటుంది.
- source_word: μὴ καταρᾶσθε
  choice: శపించకండి
  rationale: μήతో వచ్చిన ఆజ్ఞార్థక నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘దీవించండి’ అనే సానుకూల ఆజ్ఞతో ఉన్న ప్రత్యక్ష వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో διώκω పదపు పరిధి
  choice: శత్రుత్వపూర్వకంగా హింసించడం
  alternative: వెంటాడడం
  rationale: διώκω అనే పదానికి సాధారణంగా ‘వెంబడించు/వెంటాడు’ అనే అర్థం ఉండగలదు. అయితే పౌలు వాడుకలోను, ఇక్కడ దీవించడం–శపించడం మధ్యనున్న నైతిక వ్యత్యాసంలోను ‘హింసించడం’ అనే భావమే ఎక్కువగా సరిపోతుంది. పదానికి ఉన్న నిజమైన విస్తృతిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆజ్ఞార్థక బహువచన శైలిని వాడాం. మూలంలోని ‘దీవించండి’ అనే పునరుక్తిని ఉద్ఘాటన కోసం నిలిపాం.
