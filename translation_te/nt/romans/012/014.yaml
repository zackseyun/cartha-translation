  source_fidelity: మూల గ్రీకులోని రెండు సార్ల εὐλογεῖτε ఆజ్ఞలను ‘దీవించండి’ అని పునరుక్తితోనే అనువదించారు. τοὺς διώκοντας ను సందర్భానుసారంగా ‘మిమ్మల్ని హింసించేవారిని’గా ఇవ్వడం సముచితం; ‘మిమ్మల్ని’ గ్రీకులో సూచితమైన కర్మను సహజ తెలుగు కోసం స్పష్టం చేస్తుంది. μὴ καταρᾶσθε కు ‘శపించకండి’ ఖచ్చితమైన, ప్రత్యక్షమైన సమానం. రెండవ εὐλογεῖτε తరువాతి καὶ యొక్క సాధారణ అనుసంధానాన్ని విరామచిహ్నం ద్వారా చూపడం అర్థాన్ని కోల్పోనివ్వదు.
