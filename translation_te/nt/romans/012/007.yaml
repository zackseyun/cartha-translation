translation:
  language: te
  text: సేవైతే[a], సేవలో; బోధించేవారైతే, బోధించడంలో[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిచర్య.’ గ్రీకు పదం సందర్భాన్ని బట్టి ‘సేవ’ లేదా ‘పరిచర్య’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బోధకుడైతే, బోధించడంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: అయితే / వారైతే
  rationale: వరాలూ విధుల జాబితాలోని షరతులాంటి సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: διακονίαν
  choice: సేవ
  rationale: ఈ పదం సేవ, పరిచర్య అనే రెండు భావాలను సూచించగలదు. సందర్భం అధికారిక సంఘ పదవిని తప్పనిసరిగా సూచించనందున, విస్తృతమైన ‘సేవ’ను ప్రధాన పాఠంలో ఉంచాం.
- source_word: ἐν τῇ διακονίᾳ
  choice: సేవలోనే
  rationale: గ్రీకులో ఒకే నామవాచకం పునరుక్తమై, ఆ వరం ఉన్నవారు ఆ కార్యంలో నిమగ్నమై ఉండాలనే సంక్షిప్త భావాన్ని ఇస్తుంది. ‘సేవలోనే’ ఆ పునరుక్తినీ దృష్టినీ నిలుపుతుంది.
- source_word: ὁ διδάσκων
  choice: బోధించేవారు
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతం ఒక అధికారిక పదవికన్నా బోధించే కార్యంలో ఉన్న వ్యక్తిని ముందుకు తెస్తుంది.
- source_word: διδασκαλίᾳ
  choice: బోధించడంలోనే
  rationale: ఇక్కడ బోధించే కార్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘సిద్ధాంతం’ వంటి మరింత సాంకేతిక, సంకుచిత అర్థాన్ని రుద్దదు.
theological_decisions:
- issue: διακονίαను సంఘ సంబంధమైన అధికారిక పదంతో అనువదించాలా?
  choice: సేవ
  alternative: పరిచర్య
  rationale: ఈ వాక్యం కృపావరాలు లేదా కార్యాల జాబితాలో ఉంది. ‘సేవ’ అనే పదం అధికారిక సంఘ పరిచర్యకే భావాన్ని పరిమితం చేయకుండా మూలపదపు విస్తృతిని కాపాడుతుంది; ‘పరిచర్య’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
- issue: ὁ διδάσκωνను పదవి పేరుగా చూపాలా?
  choice: బోధించేవారు
  alternative: బోధకుడు
  rationale: గ్రీకు కృదంతం పదవిని స్పష్టంగా పేర్కొనకుండా బోధించే వ్యక్తి లేదా కార్యాన్ని సూచిస్తుంది. అందువల్ల అనువాదం సంఘ నిర్మాణాన్ని మూలపాఠానికి మించి నిర్దిష్టం చేయదు.
- issue: ἐν అనే సంక్షిప్త నిర్మాణంలోని అంతర్నిహిత ఆదేశాన్ని ఎంతవరకు విప్పి చెప్పాలి?
  choice: సేవలోనే … బోధించడంలోనే
  alternative: సేవ చేసేవారు సేవ చేయాలి … బోధించేవారు బోధించాలి
  rationale: మూలంలోని సంక్షిప్తతనూ కొంత అసంపూర్ణంగా వినిపించే సమాంతర నిర్మాణాన్నీ కాపాడేందుకు స్పష్టమైన ఆజ్ఞార్థక క్రియలను చేర్చలేదు. ‘-లోనే’ ఆయా కార్యంపై నిలకడైన దృష్టిని సహజంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని సమాంతరతను ‘అయితే … వారైతే’తో, పునరుక్తి మరియు కార్యంపై దృష్టిని ‘-లోనే’తో నిలిపాం. అధికారిక సంఘ పదవుల భావాన్ని అనవసరంగా చేర్చలేదు.
