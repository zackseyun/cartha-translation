review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents both qualifications: εἰ δυνατόν as a real limitation (''సాధ్యమైతే'') and τὸ ἐξ ὑμῶν as the extent within the readers’ capacity. ''అందరితో'' properly renders the generic πάντων ἀνθρώπων. The exhortative force and continuing relational sense of εἰρηνεύοντες are retained.'
  naturalness: '''సమాధానంగా జీవించండి'' is understandable, but it is less idiomatic for being at peace with other people and can sound like a general description of a tranquil life. ''అందరితో శాంతిగా ఉండండి'' is more natural modern standard Telugu and directly expresses the relational sense required by μετὰ πάντων ἀνθρώπων.'
  terminology: '''శాంతిగా ఉండండి'' is an established, neutral rendering for the relational sense of εἰρηνεύοντες. It does not introduce doctrinal interpretation. ''మీ వల్ల అయ్యేంతవరకు'' naturally conveys what lies within the readers’ own ability or responsibility.'
  issues:
