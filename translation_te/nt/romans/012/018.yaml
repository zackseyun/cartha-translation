  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δυνατόν, τὸ ἐξ ὑμῶν μετὰ πάντων ἀνθρώπων εἰρηνεύοντες·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: te
  text: సాధ్యమైతే[a], మీ వల్ల అయ్యేంతవరకు అందరితో శాంతిగా ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అది సాధ్యమైతే, మీ వంతున అందరితో శాంతిగా ఉండండి.’
    reason: షరతును తెలిపే εἰ δυνατόν మరియు పాఠకుల వంతు లేదా బాధ్యత పరిధిని తెలిపే τὸ ἐξ ὑμῶνకు సహజమైన ప్రత్యామ్నాయ నిర్మాణాన్ని చూపుతుంది.
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: సాధ్యమైతే
  rationale: ఈ షరతుతో కూడిన పదబంధం ఆజ్ఞకు వాస్తవిక పరిమితిని సూచిస్తుంది; అది సంపూర్ణంగా సాధ్యమేనని చెప్పదు.
- source_word: τὸ ἐξ ὑμῶν
  choice: మీ చేతనైనంతవరకు
  rationale: పాఠకుల శక్తి, బాధ్యత పరిధిలో ఉన్నదంతా అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: అందరితో
  rationale: ἄνθρωποι ఇక్కడ పురుషులను మాత్రమే కాక మనుషులందరినీ సూచిస్తుంది; ‘అందరితో’ ఈ సమగ్ర భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: εἰρηνεύοντες
  choice: సమాధానంగా జీవించండి
  rationale: వర్తమాన కృదంతం సందర్భంలో ప్రబోధాత్మక ఆజ్ఞగా పనిచేస్తూ నిరంతర జీవన విధానాన్ని సూచిస్తుంది; ‘జీవించండి’ ఆ కొనసాగుతున్న భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సమాధానంగా జీవించాలనే ప్రబోధపు పరిధి మరియు పరిమితి
  choice: విశ్వాసులు అందరితో సమాధానాన్ని అనుసరించాలి; అయితే వారి బాధ్యత నిజంగా వారి చేతనైనదాని వరకే పరిమితం.
  alternative: విశ్వాసులు సరిగ్గా ప్రవర్తిస్తే సమాధానం తప్పక సాధ్యమవుతుందని, లేదా ఈ ఆజ్ఞకు ఎలాంటి పరిమితీ లేదని అర్థం చేసుకోవడం.
  rationale: εἰ δυνατόν మరియు τὸ ἐξ ὑμῶν అనే రెండు పరిమితి సూచకాలు సమాధానం ఎల్లప్పుడూ సాధ్యమవుతుందనే భావాన్ని నిరోధిస్తాయి. అదే సమయంలో μετὰ πάντων ἀνθρώπων దాని విశ్వవ్యాప్త పరిధిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన ప్రబోధ శైలిలో అనువదించబడింది. ‘సమాధానంగా’ అనే పదం వ్యక్తిగత ప్రశాంతతకన్నా ఇతరులతో శాంతియుత సంబంధాన్ని సూచించేలా ‘అందరితో’తో కలిపి వాడబడింది.
