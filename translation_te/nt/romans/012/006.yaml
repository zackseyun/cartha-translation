id: ROM.12.6
reference: Romans 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: te
  text: మనకు అనుగ్రహించబడిన కృపను బట్టి మనకు వేర్వేరు వరాలు ఉన్నాయి; ప్రవచన వరమైతే, విశ్వాసానికి అనుగుణంగా[a] ప్రవచించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన విశ్వాసం యొక్క పరిమాణానికి అనుగుణంగా’; మరో విధంగా, ‘క్రైస్తవ విశ్వాసానికి అనుగుణంగా.’ ఈ గ్రీకు పదబంధం ప్రవచించే వ్యక్తికి ఇవ్వబడిన విశ్వాసపు పరిమాణాన్ని గానీ, ప్రవచనం క్రైస్తవ విశ్వాసపు విషయానికి అనుగుణంగా ఉండాలని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: మనకు ... ఉన్నాయి
  rationale: నామవిభక్తి బహువచన వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన ప్రధాన వాక్యంగా వ్యక్తం చేశాం. δὲ సూచించే స్వల్ప కొనసాగింపు/మార్పును సందర్భప్రవాహంలో ఉంచి, కృత్రిమమైన వ్యతిరేకార్థక సంధిని చేర్చలేదు.
- source_word: χαρίσματα ... διάφορα
  choice: వేర్వేరు వరాలు
  rationale: χαρίσματαకు పౌలు రచనల్లో సహజమైన ‘వరాలు’ను వాడి, διάφορα తెలిపే వైవిధ్యాన్ని ‘వేర్వేరు’తో స్పష్టంగా తెలిపాం.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: మనకు అనుగ్రహించబడిన కృప ప్రకారం
  rationale: κατά తెలిపే అనుగుణతను ‘ప్రకారం’తో, దేవుని అనుగ్రహపూర్వక ప్రసాదాన్ని δοθεῖσαν‌తో కలిపి ‘అనుగ్రహించబడిన కృప’గా తెలిపాం.
- source_word: εἴτε προφητείαν
  choice: ప్రవచన వరమైతే
  rationale: అసంపూర్ణ జాబితా నిర్మాణాన్ని తెలుగులో సహజంగా చేయడానికి సందర్భంలో అంతర్లీనంగా ఉన్న ‘వరం’ను స్పష్టం చేశాం; προφητεία అర్థాన్ని ‘ప్రవచనం’గా నిలిపాం.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: విశ్వాసానికి తగిన నిష్పత్తిలో
  rationale: ἀναλογίαలోని నిష్పత్తి/అనురూపత భావాన్ని నిలిపి, πίστιςను విస్తృతమైన ‘విశ్వాసం’గానే ఉంచాం; అది వ్యక్తి విశ్వాస పరిమాణమా లేక క్రైస్తవ విశ్వాస విషయంతో ఏకీభావమా అన్నది ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
theological_decisions:
- issue: κατὰ τὴν ἀναλογίαν τῆς πίστεως యొక్క భావం
  choice: ‘విశ్వాసానికి తగిన నిష్పత్తిలో’ అనే విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘తన విశ్వాస పరిమాణానికి తగినట్లు’ లేదా ‘క్రైస్తవ విశ్వాసానికి అనుగుణంగా’
  rationale: గ్రీకు పదబంధం ప్రవచించే వ్యక్తికి ఇవ్వబడిన విశ్వాస పరిమాణాన్ని గానీ, క్రైస్తవ విశ్వాస విషయంతో ప్రవచనం ఏకీభవించడాన్ని గానీ సూచించవచ్చు. ఒక అర్థాన్ని మౌనంగా ఖరారు చేయకుండా అసలు పాఠ్యంలోని సందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. గ్రీకు కృదంత నిర్మాణాన్ని తెలుగులో సహజమైన వాక్యంగా మార్చి, తరువాతి అసంపూర్ణ ఆదేశాన్ని ‘ప్రవచించాలి’తో స్పష్టం చేశాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
