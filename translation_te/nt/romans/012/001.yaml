id: ROM.12.1
reference: Romans 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: te
  text: 'కాబట్టి సహోదరులారా,[a] దేవుని కనికరాలను బట్టి నేను మిమ్మల్ని వేడుకుంటున్నాను: మీ శరీరాలను సజీవమైన, పవిత్రమైన, దేవునికి ప్రీతికరమైన బలిగా సమర్పించండి. ఇదే మీ వివేకయుక్తమైన ఆరాధన.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహోదర సహోదరీలారా’; గ్రీకులో ‘సహోదరులారా’ అనే పుంలింగ రూపం ఉంది, అయితే అది తరచుగా స్త్రీపురుషులతో కూడిన సమూహాన్ని ఉద్దేశించి వాడబడుతుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘ఇదే మీ ఆత్మసంబంధమైన ఆరాధన’ లేదా ‘మీ హేతుబద్ధమైన సేవ’; గ్రీకు పదబంధానికి వివేకంతో కూడిన, తగిన, హేతుబద్ధమైన, లేదా ఆత్మసంబంధమైన ఆరాధనా సేవ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: నేను మిమ్మల్ని వేడుకుంటున్నాను
  rationale: ఇక్కడ παρακαλέω సాధారణ అభ్యర్థనకన్నా గంభీరమైన ప్రోత్సాహపూర్వక విజ్ఞప్తిని తెలియజేస్తుంది. ‘వేడుకుంటున్నాను’ ఆధునిక తెలుగులో ఆ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మొదటి 11 అధ్యాయాల్లోని వాదన ఆధారంగా వచ్చే నిర్ధారణాత్మక విజ్ఞప్తిని సూచిస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పదంలోని పుంలింగ బహువచన సంబోధనను ప్రధాన పాఠ్యంలో నిలుపుతూ, సందర్భంలో స్త్రీపురుషులిద్దరూ ఉద్దేశించబడి ఉండే విషయాన్ని పాదసూచికలో తెలిపింది.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: దేవుని కనికరాలను బట్టి
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ విజ్ఞప్తికి ఆధారాన్ని సూచిస్తుంది. οἰκτιρμῶν యొక్క బహువచన భావాన్ని ‘కనికరాలను’ నిలుపుతుంది.
- source_word: παραστῆσαι
  choice: సమర్పించండి
  rationale: బలి సంబంధ సందర్భంలో παρίστημι అంటే దేవుని ఎదుట అర్పించడం లేదా అందుబాటులో ఉంచడం. ‘సమర్పించండి’ తెలుగులో బలి చిత్రణను స్పష్టంగా నిలుపుతుంది.
- source_word: τὰ σώματα ὑμῶν
  choice: మీ శరీరాలను
  rationale: σώματα అనే స్పష్టమైన దేహసంబంధ పదాన్ని ‘మిమ్మల్ని మీరు’ అని సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: θυσίαν ζῶσαν
  choice: సజీవమైన ... బలిగా
  rationale: చనిపోయే సాధారణ బలికి విరుద్ధమైన పౌలు ఉద్దేశపూర్వక విరోధాభాసాన్ని నిలుపుతుంది.
- source_word: ἁγίαν
  choice: పవిత్రమైన
  rationale: దేవునికోసం ప్రత్యేకపరచబడిన బలి అనే భావాన్ని తెలిపే ప్రామాణిక, గౌరవప్రదమైన పదం.
- source_word: εὐάρεστον τῷ θεῷ
  choice: దేవునికి ప్రీతికరమైన
  rationale: కేవలం అంగీకారయోగ్యమైనది అనే కనిష్ఠ భావం కాకుండా, దేవునికి సంతోషం కలిగించేది అనే εὐάρεστος భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λογικὴν
  choice: వివేకయుక్తమైన
  rationale: λογικός లోని హేతుబద్ధమైన, తగిన, ఆలోచనతో కూడిన అనే భావవ్యాప్తిని అతిగా తాత్త్వికం చేయకుండా తెలుపుతుంది. ‘ఆత్మసంబంధమైన’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: λατρείαν
  choice: ఆరాధన
  rationale: λατρεία దేవునికి చేసే ఆరాధనా సేవను సూచిస్తుంది. బలి సందర్భంలో ‘ఆరాధన’ దేవుని దిశగా ఉన్న కార్యాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మిశ్రమ సమూహాన్ని ఉద్దేశించే ἀδελφοί సంబోధన
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపింది; రోమా విశ్వాసుల సమాజమంతా ఉద్దేశించబడిందనే సందర్భార్థాన్ని పాదసూచికలో స్పష్టం చేసింది.
- issue: λογικὴν λατρείαν అర్థం
  choice: మీ వివేకయుక్తమైన ఆరాధన
  alternative: మీ ఆత్మసంబంధమైన ఆరాధన; మీ హేతుబద్ధమైన సేవ
  rationale: గ్రీకు పదబంధం హేతుబద్ధమైన, తగిన, లేదా ఆత్మసంబంధమైన ఆరాధనా సేవ అనే భావాలను మోయగలదు. ప్రధాన పాఠ్యం సమీపమైన, తక్కువ వ్యాఖ్యానాత్మక రూపాన్ని ఎంచుకొని, ప్రత్యామ్నాయాలను పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనుకూలమైన శైలి. గ్రీకు వాక్యంలోని తార్కిక అనుసంధానం, బహువచన ‘కనికరాలు,’ శరీరాలు, సజీవ బలి అనే చిత్రణ, λογικός యొక్క అర్థసందిగ్ధత అన్నీ నిలుపబడ్డాయి.
