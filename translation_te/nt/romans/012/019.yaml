id: ROM.12.19
reference: Romans 12:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: te
  text: 'ప్రియులారా, మీకు మీరే ప్రతీకారం తీర్చుకోకండి; బదులుగా కోపానికి చోటు ఇవ్వండి[a]. ఎందుకంటే ఇలా వ్రాయబడి ఉంది: “ప్రతీకారం నాది; నేనే ప్రతిఫలం ఇస్తాను[b],” అని ప్రభువు చెబుతున్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కోపానికి అవకాశం ఇవ్వండి.” తరువాతి ఉల్లేఖనాన్ని బట్టి ఇది దేవుని కోపాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేనే తిరిగి చెల్లిస్తాను.”
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: మీకు మీరే ప్రతీకారం తీర్చుకోకండి
  rationale: μήతో వచ్చిన వర్తమాన కృదంతం సందర్భంలో ఆజ్ఞార్థకంగా పనిచేస్తుంది. ఈ అనువాదం ἑαυτούςలోని ఆత్మవాచక భావాన్ని, ἐκδικέωలోని ప్రతీకారం తీర్చుకోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀγαπητοί
  choice: ప్రియులారా
  rationale: ఆప్యాయతగల సంబోధనను గౌరవప్రదంగా, సహజంగా వ్యక్తం చేస్తుంది; కేవలం సామాన్య స్నేహసంబోధనగా పరిమితం చేయదు.
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: బదులుగా ఉగ్రతకు చోటివ్వండి
  rationale: δότε τόπον అనే ‘చోటివ్వండి’ రూపకాన్ని నిలుపుతూ, τῇ ὀργῇను ‘ఉగ్రతకు’ అని అనువదిస్తుంది. మూలంలో దేవుని అని స్పష్టంగా లేకపోవడంతో ప్రధాన పాఠ్యంలో దానిని చేర్చలేదు.
- source_word: γέγραπται γάρ
  choice: ఎందుకంటే ఇలా రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే గ్రీకు సంప్రదాయ సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: ప్రతీకారం నాది
  rationale: సంప్రదాన విభక్తి ద్వారా వ్యక్తమైన స్వామ్యార్థాన్ని సంక్షిప్తంగా, నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἐγὼ ἀνταποδώσω
  choice: నేనే ప్రతిఫలం చెల్లిస్తాను
  rationale: ἐγώలోని ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది; ἀνταποδίδωμι యొక్క న్యాయపరమైన తిరిగి చెల్లింపు భావాన్ని ‘ప్రతిఫలం చెల్లిస్తాను’ వ్యక్తం చేస్తుంది.
- source_word: λέγει κύριος
  choice: అని ప్రభువు చెబుతున్నాడు
  rationale: లేఖన ఉల్లేఖన సూత్రానికి సహజమైన తెలుగు రూపం; κύριοςను ప్రాజెక్టు శైలికి తగినట్లు ‘ప్రభువు’గా అనువదిస్తుంది.
theological_decisions:
- issue: τῇ ὀργῇలో ‘ఉగ్రత’ ఎవరిది?
  choice: ప్రధాన పాఠ్యంలో ‘ఉగ్రతకు’ అనే సంక్షిప్త, అస్పష్ట రూపాన్ని నిలుపడం; సందర్భంలో అది దేవుని ఉగ్రతగా అర్థమయ్యే అవకాశం ఎక్కువ.
  alternative: ‘దేవుని ఉగ్రతకు చోటివ్వండి’ అని ప్రధాన పాఠ్యంలో స్పష్టీకరించడం; లేదా సాధారణ మానవ ఉగ్రతగా గ్రహించడం.
  rationale: తదుపరి ద్వితీయోపదేశకాండము 32:35 ఉల్లేఖనం తీర్పు, ప్రతీకారం దేవుని అధికారమని చూపుతుంది. అయినా గ్రీకు పాఠ్యంలో ‘దేవుని’ అనే పదం లేదు; అందువల్ల మూలంలోని సంక్షిప్తతను, వ్యాఖ్యాన అవకాశాన్ని ప్రధాన పాఠ్యంలో కాపాడి, సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘ప్రియులారా,’ ‘రాయబడి ఉంది,’ ‘ప్రభువు’ వంటి పదాలు లేఖనోచిత గంభీరతను నిలుపుతాయి. మూలంలోని ‘ఉగ్రత’ అనే ఉద్దేశపూర్వక సంక్షిప్తతను వ్యాఖ్యానాత్మకంగా విస్తరించలేదు.
