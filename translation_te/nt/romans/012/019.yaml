revisions:
- from: 'ప్రియులారా, మీకు మీరే ప్రతీకారం తీర్చుకోకండి; బదులుగా ఉగ్రతకు చోటివ్వండి[a]. ఎందుకంటే ఇలా రాయబడి ఉంది: “ప్రతీకారం నాది; నేనే ప్రతిఫలం చెల్లిస్తాను[b] అని ప్రభువు చెబుతున్నాడు.”'
  to: 'ప్రియులారా, మీకు మీరే ప్రతీకారం తీర్చుకోకండి; బదులుగా కోపానికి చోటు ఇవ్వండి[a]. ఎందుకంటే ఇలా వ్రాయబడి ఉంది: “ప్రతీకారం నాది; నేనే ప్రతిఫలం ఇస్తాను[b],” అని ప్రభువు చెబుతున్నాడు.'
  rationale: The revision improves modern Telugu idiom and punctuation without changing the meaning or resolving the source text’s implicit referent for ‘wrath.’ It preserves the footnote anchors and retains the contextual observation that the wrath is likely divine without adding ‘God’s’ to the main text.
