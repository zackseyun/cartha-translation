review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the imperative prohibition, the reflexive force of ἑαυτούς, the deliberately unqualified τῇ ὀργῇ, the Scripture-introduction formula, and the emphatic divine promise of recompense. “ఉగ్రత” is possible, but “కోపం” is the more natural modern Telugu equivalent for ὀργή in this context and retains the source’s ambiguity about whose wrath is meant.
  naturalness: 'The overall register is clear and appropriately respectful. The revised wording uses more idiomatic modern Telugu collocations: “కోపానికి చోటు ఇవ్వండి” and “ప్రతిఫలం ఇస్తాను.” The quotation punctuation is also adjusted so that “అని ప్రభువు చెబుతున్నాడు” correctly stands outside the cited words, corresponding to λέγει κύριος.'
  terminology: “ప్రియులారా,” “ప్రతీకారం,” and “ప్రభువు” are suitable. “కోపం” is preferable to “ఉగ్రత” here because it conveys wrath/anger without suggesting violent ferocity. “ప్రతిఫలం ఇస్తాను” naturally conveys ἀνταποδώσω in a judicial-recompense context.
  issues:
  - severity: low
    issue: ‘ఉగ్రత’ is less natural and can be semantically stronger than the contextual sense of ὀργή.
    rationale: ‘కోపం’ is the ordinary modern Telugu term for wrath/anger and does not over-specify the quality of the wrath.
  - severity: low
    issue: The attribution ‘అని ప్రభువు చెబుతున్నాడు’ is placed within the closing quotation structure.
    rationale: λέγει κύριος is the narrator’s citation attribution and is more naturally rendered outside the quotation, after the closing quotation mark.
  - severity: low
    issue: ‘ప్రతిఫలం చెల్లిస్తాను’ is understandable but less idiomatic than ‘ప్రతిఫలం ఇస్తాను.’
    rationale: The latter is natural Telugu while preserving the sense of divine recompense; the footnote retains ‘తిరిగి చెల్లిస్తాను’ as a closer lexical alternative.
  revised_text: 'ప్రియులారా, మీకు మీరే ప్రతీకారం తీర్చుకోకండి; బదులుగా కోపానికి చోటు ఇవ్వండి[a]. ఎందుకంటే ఇలా వ్రాయబడి ఉంది: “ప్రతీకారం నాది; నేనే ప్రతిఫలం ఇస్తాను[b],” అని ప్రభువు చెబుతున్నాడు.'
