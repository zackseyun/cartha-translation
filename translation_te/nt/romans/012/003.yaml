id: ROM.12.3
reference: Romans 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: te
  text: 'నాకు అనుగ్రహించబడిన కృప ద్వారా నేను మీలో ఉన్న ప్రతి ఒక్కరికీ చెబుతున్నాను: తన గురించి తగినదానికంటే ఎక్కువగా తలంచకూడదు; బదులుగా, దేవుడు ప్రతి ఒక్కరికీ విశ్వాస పరిమాణాన్ని పంచి ఇచ్చిన ప్రకారం సుబుద్ధితో తలంచాలి.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సుబుద్ధితో ఉండేలా తలంచాలి.”
    reason: σωφρονεῖν కు ‘సుబుద్ధితో, నిగ్రహంతో ఉండడం’ అనే ప్రత్యామ్నాయ భావఛాయ ఉంది.
  - marker: b
    text: లేదా, “విశ్వాస ప్రమాణం”; లేదా “నమ్మకం/విశ్వసనీయతకు సంబంధించిన ఒక పరిమాణం.” గ్రీకు పదబంధం విశ్వాసానికి సంబంధించిన దేవుడిచ్చిన పరిమాణాన్ని సూచించవచ్చు; అయితే దాని ఖచ్చితమైన భావాన్ని నిర్దేశించదు.
    reason: μέτρον πίστεως లోని నిర్దిష్టత మరియు πίστις యొక్క భావఛాయ రెండూ సందర్భంలో కొంత అస్పష్టంగా ఉన్నాయి.
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: నాకు అనుగ్రహించబడిన కృపనుబట్టి
  rationale: διά + షష్ఠీ ఇక్కడ పౌలుకు లభించిన కృపను అతని మాటకు ఆధారం లేదా సాధనంగా చూపుతుంది. ‘కృపనుబట్టి’ సహజమైన తెలుగులో ఈ భావాన్ని అతిగా విస్తరించకుండా తెలియజేస్తుంది.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: మీలో ఉన్న ప్రతి ఒక్కరితో
  rationale: సమాజంలోని ప్రతి వ్యక్తిని ఉద్దేశించే విభజనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: తాను తలంచవలసిన దానికంటే తన గురించి ఎక్కువగా తలంచకూడదు
  rationale: ὑπερφρονεῖν మరియు φρονεῖν మధ్యనున్న ఆలోచనకు సంబంధించిన పదప్రయోగాన్ని సాధ్యమైనంతగా నిలుపుతూ, ఇది స్వీయ అంచనా గురించినదని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: బదులుగా ... వివేకంతో తలంచాలి
  rationale: σωφρονεῖν లోని సమతుల్యమైన, నిగ్రహంతో కూడిన సుబుద్ధి భావాన్ని ఆధునిక సహజ తెలుగులో అందిస్తుంది; గ్రీకు పదప్రయోగాన్ని ‘తలంచాలి’ ద్వారా కొంతవరకు నిలుపుతుంది.
- source_word: ἐμέρισεν
  choice: పంచి ఇచ్చిన
  rationale: μερίζω యొక్క పంచడం లేదా భాగం కేటాయించడం అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: μέτρον πίστεως
  choice: విశ్వాస పరిమాణం
  rationale: πίστις ను ‘విశ్వాసం’గా ఉంచి, μέτρον ను ‘పరిమాణం’గా అనువదించడం ద్వారా ఇది విశ్వాసపు మోతాదా, ప్రమాణమా, లేక విశ్వాసానికి సంబంధించిన దేవుడిచ్చిన భాగమా అనే అస్పష్టతను పరిష్కరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: μέτρον πίστεως యొక్క అర్థం
  choice: ‘విశ్వాస పరిమాణం’ అనే విశాలమైన పదబంధాన్ని నిలుపడం
  alternative: ‘విశ్వాస ప్రమాణం’; ‘నమ్మకపు పరిమాణం’; ఆత్మీయ సేవకు దేవుడిచ్చిన సామర్థ్యం
  rationale: తదుపరి వచనాలు విభిన్న వరాల గురించి మాట్లాడుతున్నప్పటికీ, ఈ గ్రీకు పదబంధం రక్షణ విశ్వాసం, సేవా సామర్థ్యం, లేదా ఒక ప్రమాణం అనే ఏ ఒక్క అర్థాన్నీ ఖచ్చితంగా నిర్దేశించదు. అందువల్ల వచనంలోని వేదాంతపరమైన ఉద్వేగాన్ని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. φρονέω పదపునరుక్తిని ‘తలంచు’ ద్వారా వీలైనంతగా నిలిపి, అతిగా గ్రాంథికమైన పదాలను నివారించాం.
