revisions:
- from: 'నాకు అనుగ్రహించబడిన కృపనుబట్టి, మీలో ఉన్న ప్రతి ఒక్కరితో నేను చెప్పేదేమిటంటే: తాను తలంచవలసిన దానికంటే తన గురించి ఎక్కువగా తలంచకూడదు; బదులుగా, దేవుడు ప్రతి ఒక్కరికి పంచి ఇచ్చిన విశ్వాస పరిమాణానుబట్టి వివేకంతో తలంచాలి.[a][b]'
  to: 'నాకు అనుగ్రహించబడిన కృప ద్వారా నేను మీలో ఉన్న ప్రతి ఒక్కరికీ చెబుతున్నాను: తన గురించి తగినదానికంటే ఎక్కువగా తలంచకూడదు; బదులుగా, దేవుడు ప్రతి ఒక్కరికీ విశ్వాస పరిమాణాన్ని పంచి ఇచ్చిన ప్రకారం సుబుద్ధితో తలంచాలి.[a][b]'
