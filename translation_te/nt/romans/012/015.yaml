id: ROM.12.15
reference: Romans 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χαίρειν μετὰ ⸀χαιρόντων, κλαίειν μετὰ κλαιόντων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: te
  text: సంతోషించేవారితో సంతోషించండి; ఏడ్చేవారితో ఏడవండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: సంతోషించండి
  rationale: ఈ ఉపదేశ సందర్భంలో వర్తమాన కర్తరి క్రియావ్యయం ఆజ్ఞార్థక బలాన్ని కలిగి ఉంది. ‘సంతోషించండి’ ఆ ప్రోత్సాహక ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μετὰ
  choice: తో
  rationale: షష్ఠీ విభక్తి రూపంలోని కృదంతంతో వచ్చిన μετά సహవాసాన్ని సూచిస్తుంది; తెలుగులో ‘తో’ దీనిని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: χαιρόντων
  choice: సంతోషించేవారితో
  rationale: వర్తమాన కర్తరి కృదంతం బహువచన వ్యక్తులను సూచిస్తూ నామవాచకంగా పనిచేస్తుంది. ‘సంతోషించేవారు’ సాధారణ, కొనసాగుతున్న లేదా సందర్భానుసారమైన భావాన్ని అనవసరంగా పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: κλαίειν
  choice: ఏడవండి
  rationale: ఇది కూడా ఆజ్ఞార్థక బలమున్న వర్తమాన కర్తరి క్రియావ్యయం. κλαίω సూచించే దుఃఖంతో ఏడవడాన్ని ‘ఏడవండి’ నేరుగా తెలియజేస్తూ మొదటి భాగంతో సమాంతరతను కాపాడుతుంది.
- source_word: κλαιόντων
  choice: ఏడ్చేవారితో
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కర్తరి కృదంతం. ‘ఏడ్చేవారు’ మూలంలోని బహువచన సాధారణ భావాన్ని, మొదటి భాగంతో ఉన్న నిర్మాణ సమాంతరతను నిలుపుతుంది.
theological_decisions:
- issue: ఉపదేశాల పరంపరలో క్రియావ్యయాల ఆజ్ఞార్థక బలం
  choice: రెండు క్రియావ్యయాలనూ ఆజ్ఞార్థక రూపాల్లో (‘సంతోషించండి; ఏడవండి’) అనువదించడం
  alternative: ‘సంతోషించేవారితో సంతోషించడం; ఏడ్చేవారితో ఏడవడం’ అని క్రియానామ రూపాల్లో ఇవ్వడం
  rationale: గ్రీకులో క్రియావ్యయాలు ఉన్నప్పటికీ, రోమా 12:9–21లోని ఉపదేశాల పరంపరలో అవి ఆజ్ఞలు లేదా ప్రోత్సాహాలుగా పనిచేస్తాయి. తెలుగు ఆజ్ఞార్థక రూపాలు ఈ వాక్యప్రయోగ బలాన్ని సహజంగా తెలియజేస్తాయి; అదనపు సిద్ధాంతార్థాన్ని చేర్చవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన బహువచన ఆజ్ఞార్థక రూపాలు వాడబడ్డాయి. రెండు భాగాల సంక్షిప్తత, లయ, సమాంతర నిర్మాణం కాపాడబడ్డాయి.
