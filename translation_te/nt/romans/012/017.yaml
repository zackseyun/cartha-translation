  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: te
  text: ఎవరికీ కీడుకు ప్రతిగా కీడు చేయవద్దు. మనుషులందరి దృష్టిలో మంచివాటిని[a] ముందుగానే పరిగణించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గౌరవప్రదమైనవి” లేక “ఉదాత్తమైనవి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: ఎవరికీ
  rationale: ἀποδιδόντες క్రియతో పరోక్ష కర్మగా ఉన్న దత్తివిభక్తి రూపం; ‘ఎవరికీ’ అనే పదం విశ్వవ్యాప్త నిషేధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: కీడుకు ప్రతిగా కీడు
  rationale: ఇక్కడ ἀντί ప్రతీకారంగా తిరిగి చేయడాన్ని సూచిస్తుంది. ‘కీడు’ నైతిక చెడును కేవలం వ్యక్తిగత హానికే పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: ἀποδιδόντες
  choice: చేయకండి
  rationale: వర్తమాన కృదంతం సందర్భంలో ఆజ్ఞార్థక బలాన్ని కలిగి ఉంది. తెలుగులో ‘కీడు చేయకండి’ సహజంగా ఉండి, ప్రతిగా తిరిగి చేయడమనే భావం ‘ప్రతిగా’ ద్వారా స్పష్టమవుతుంది.
- source_word: προνοούμενοι
  choice: ముందుగానే ఆలోచించండి
  rationale: ప్రణాళికతో ముందుగా ఆలోచించడం, జాగ్రత్తగా పరిగణించడం అనే భావాన్ని వ్యక్తం చేస్తుంది; భౌతిక అవసరాలను సమకూర్చడమనే అర్థానికి అనవసరంగా పరిమితం చేయదు.
- source_word: καλὰ
  choice: మంచిదైనదాన్ని
  rationale: నైతికంగా మంచి, గౌరవప్రదమైన, ఉదాత్తమైన అనే విస్తృత భావపరిధిని ప్రధాన పాఠంలో సహజంగా నిలుపుతుంది.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: మనుషులందరి దృష్టిలో
  rationale: ‘ఎదుట/దృష్టిలో’ అనే మూలభావంతో పాటు బహిరంగంగా కనిపించే ప్రవర్తన, సామాజిక బాధ్యత అనే సూచనను కాపాడుతుంది; ἀνθρώπων ఇక్కడ సమస్త మనుషులను సూచిస్తుంది.
theological_decisions:
- issue: బహిరంగ సందర్భంలో καλά పదంలోని నైతిక, గౌరవప్రద భావాలు
  choice: మంచిదైనదాన్ని
  alternative: గౌరవప్రదమైనదాన్ని; ఉదాత్తమైనదాన్ని
  rationale: ఈ పదబంధం నైతిక మంచితనంతో పాటు ప్రజల దృష్టిలో గౌరవప్రదంగా ఉండటాన్నీ సూచించవచ్చు. ప్రధాన పాఠంలో విస్తృతమైన ‘మంచి’ భావాన్ని ఉంచి, ఇతర నిజమైన భావఛాయలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే ఆజ్ఞార్థక నిర్మాణం వాడబడింది. గ్రీకు కృదంతాల సందర్భానుసార ఆజ్ఞార్థక బలాన్ని సహజమైన తెలుగు వాక్యాలుగా వ్యక్తం చేశాం.
