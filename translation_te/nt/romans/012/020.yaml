id: ROM.12.20
reference: Romans 12:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: te
  text: కాని నీ శత్రువు ఆకలితో ఉంటే, అతనికి ఆహారం పెట్టు; దాహంతో ఉంటే, అతనికి తాగడానికి ఏదైనా ఇవ్వు. ఎందుకంటే, ఇలా చేయడం ద్వారా నీవు మండుతున్న నిప్పులను[a] అతని తలపై కుప్పగా వేస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అగ్ని బొగ్గులు.” ఈ చిత్రం పశ్చాత్తాపానికి నడిపే సిగ్గును, బాధాకరమైన నైతిక మనస్సాక్షి మేల్కొలుపును, లేదా రాబోయే తీర్పును సూచించవచ్చు; గ్రీకు రూపకాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: కాని ... ఉంటే
  rationale: ἀλλά ముందున్న ప్రతీకారం తీర్చుకోవద్దనే ఆదేశానికి వ్యతిరేక మలుపును సూచిస్తుంది; ἐάν షరతును తెలియజేస్తుంది. ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: నీ శత్రువు ఆకలితో ఉంటే
  rationale: ఏకవచనాన్ని నిలుపుతూ, వర్తమాన షరతును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ψώμιζε αὐτόν
  choice: అతనికి ఆహారం పెట్టు
  rationale: ψωμίζω ఆహారం అందించడాన్ని సూచిస్తుంది. ఈ ఆజ్ఞారూపం స్పష్టంగా, సాధారణ వాడుకలో అర్థమయ్యేలా ఉంది.
- source_word: ἐὰν διψᾷ, πότιζε αὐτόν
  choice: దాహంతో ఉంటే, అతనికి తాగడానికి ఇవ్వు
  rationale: ποτίζω తాగడానికి ఇవ్వడాన్ని సూచిస్తుంది. గ్రీకులో లేని ‘నీళ్లు’ వంటి ప్రత్యేక పదార్థాన్ని చేర్చకుండా అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: τοῦτο γὰρ ποιῶν
  choice: ఎందుకంటే, ఇలా చేయడం ద్వారా
  rationale: γάρ ఇచ్చే వివరణాత్మక సంబంధాన్నీ, క్రియావిశేషణాత్మక వర్తమాన కృదంతం సూచించే సాధన భావాన్నీ నిలుపుతుంది.
- source_word: ἄνθρακας πυρὸς
  choice: మండుతున్న నిప్పులను
  rationale: అక్షరార్థ నిర్మాణం ‘అగ్ని నిప్పులు/బొగ్గులు’ అయినప్పటికీ, ‘మండుతున్న నిప్పులు’ రూపక చిత్రాన్ని సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: అతని తలపై కుప్పగా పోస్తావు
  rationale: భవిష్యత్ క్రియారూపాన్నీ, తలపై నిప్పులను పోగుచేసే స్పష్టమైన రూపక చిత్రాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: ‘అతని తలపై మండుతున్న నిప్పులను కుప్పగా పోస్తావు’ అనే రూపకానికి అర్థం
  choice: ప్రధాన పాఠ్యంలో రూపకాన్ని వ్యాఖ్యానించకుండా యథాతథంగా నిలుపడం
  alternative: ఇది పశ్చాత్తాపానికి నడిపే సిగ్గు, బాధాకరమైన నైతిక పశ్చాత్తాప భావం, లేదా రాబోయే తీర్పు అని ప్రధాన పాఠ్యంలో స్పష్టీకరించడం
  rationale: ఈ రూపకానికి వివిధ వ్యాఖ్యానాలు ఉన్నాయి. గ్రీకు పాఠ్యం వాటిలో ఒకదాన్ని స్పష్టంగా నిర్ణయించదు కాబట్టి, దాని ఉద్దేశాన్ని అనువాదంలోనే తేల్చకుండా ఆ theological tension‌ను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ఏకవచన సంబోధనను, ఆజ్ఞల నేరుతనాన్ని, వివాదాస్పద రూపకంలోని అస్పష్టతను నిలుపాం.
