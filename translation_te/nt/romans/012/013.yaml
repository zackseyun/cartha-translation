translation:
  language: te
  text: పరిశుద్ధుల అవసరాలను తీర్చడంలో భాగస్వాములు కండి; అతిథి సత్కారం చేయడానికి అవకాశాలను ఆసక్తిగా వెదకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతిథి సత్కారం’ అనే గ్రీకు పదంలో అపరిచితులను ప్రేమతో స్వాగతించి ఆదరించడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: అవసరాల్లో
  rationale: χρεία ఇక్కడ విశ్వాసుల ఆచరణాత్మక అవసరాలను సూచిస్తుంది. ‘అవసరాలు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, విస్తృత అర్థంతో ఉంది.
- source_word: ἁγίων
  choice: పరిశుద్ధుల
  rationale: పౌలు వాడుకలో ἅγιοι దేవునికి ప్రత్యేకించబడిన విశ్వాసులను సమష్టిగా సూచిస్తుంది. ‘పరిశుద్ధులు’ ఈ పౌలీయ గుర్తింపును నిలుపుతుంది.
- source_word: κοινωνοῦντες
  choice: పాలుపంచుకోండి
  rationale: κοινωνέωలో పాలుపంచుకోవడం, భాగస్వాములు కావడం, సహాయం అందించడం అనే భావాలు ఉన్నాయి. ‘అవసరాల్లో పాలుపంచుకోండి’ అనేది కేవలం ధనసహాయానికే పరిమితం చేయకుండా, వాటిని తీర్చడంలో క్రియాశీల భాగస్వామ్యాన్ని తెలియజేస్తుంది.
- source_word: φιλοξενίαν
  choice: అతిథి సత్కారం
  rationale: φιλοξενία అపరిచితులను కూడా ఆదరించి స్వాగతించే గుణాన్ని సూచిస్తుంది. ‘అతిథి సత్కారం’ తెలుగులో సహజమైన సమానార్థకం; అపరిచితులను ఆదరించే కోణాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: διώκοντες
  choice: ఆసక్తిగా అవకాశాలు వెదకండి
  rationale: διώκωలో వెంబడించడం, పట్టుదలగా సాధించడానికి ప్రయత్నించడం అనే బలమైన భావం ఉంది. ఈ రూపం అతిథి సత్కారాన్ని నిష్క్రియగా ఆచరించడం కాక, దానికి అవకాశాలను చురుకుగా వెదకడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘పరిశుద్ధులు’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: విశ్వాసులు, అంటే దేవునికి ప్రత్యేకించబడిన ప్రజలు
  alternative: తరువాతి సంఘ సంప్రదాయంలో అధికారికంగా పరిశుద్ధులుగా గుర్తించబడిన కొందరు వ్యక్తులు మాత్రమే
  rationale: పౌలు రచనల్లో οἱ ἅγιοι సాధారణంగా క్రైస్తవ విశ్వాసులను సమష్టిగా సూచిస్తుంది; తరువాత ఏర్పడిన పరిమిత వర్గాన్ని కాదు. అందువల్ల మూలంలోని ధార్మిక గుర్తింపును ‘పరిశుద్ధులు’గా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆజ్ఞారూప శైలి. గ్రీకులోని రెండు participles సందర్భానుసారంగా ప్రత్యక్ష ప్రబోధాలుగా అనువదించబడ్డాయి. సెమికోలన్ రెండు సమాంతర ప్రబోధాలను కలుపుతుంది.
