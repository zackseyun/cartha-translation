id: ROM.12.2
reference: Romans 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: te
  text: ఈ యుగానికి[a] అనుగుణంగా మలచబడకండి; కానీ మీ మనస్సు నూతనపరచబడడం ద్వారా రూపాంతరం చెందండి, తద్వారా దేవుని చిత్తం ఏమిటో—మేలైనదీ, ప్రీతికరమైనదీ[c], పరిపూర్ణమైనదీ—మీరు వివేచించగలుగుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఈ లోకానికి.” గ్రీకు αἰών మరింత కచ్చితంగా “యుగం” అని అర్థమిస్తుంది; ఇక్కడ అది ప్రస్తుత కాలవ్యవస్థను సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “దేవుని చిత్తం ఏమిటో మీరు పరిశీలించి ఆమోదించగలుగుతారు.” గ్రీకు క్రియలో పరీక్షించడం, అలాగే యోగ్యమైనదిగా గుర్తించడం అనే రెండు భావాలూ ఉండవచ్చు.'
    reason: lexical_alternative
  - marker: c
    text: “ప్రీతికరమైనది” అంటే దేవునికి ప్రీతికరమైనది కావచ్చు; దీనిని “ఆమోదయోగ్యమైనది” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: అనుగుణంగా మలచబడకండి
  rationale: ఈ వర్తమాన యుగపు బాహ్య నమూనాకు అనుగుణంగా రూపుదిద్దుకోవద్దనే నిషేధాన్ని తెలియజేస్తుంది; μεταμορφοῦσθεతో ఉన్న వ్యత్యాసాన్నీ నిలుపుతుంది.
- source_word: αἰῶνι τούτῳ
  choice: ఈ యుగానికి
  rationale: αἰών సృష్టించబడిన లోకాన్ని కాకుండా ప్రస్తుత కాలవ్యవస్థను లేదా నైతిక క్రమాన్ని సూచిస్తుంది; అందువల్ల ‘లోకానికి’ కంటే ‘యుగానికి’ మూలార్థానికి దగ్గరగా ఉంది.
- source_word: μεταμορφοῦσθε
  choice: రూపాంతరం చెందండి
  rationale: రూపం లేదా స్థితిలో లోతైన మార్పును సూచిస్తుంది; బాహ్య అనుగుణతకు విరుద్ధంగా అంతర్గత మార్పును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀνακαινώσει
  choice: నూతనపరచబడడం ద్వారా
  rationale: దత్తివిభక్తి పదబంధాన్ని సాధనార్థకంగా తీసుకొని, రూపాంతరం మనస్సు నూతనపరచబడడం ద్వారా జరుగుతుందని తెలియజేస్తుంది.
- source_word: νοός
  choice: మీ మనస్సు
  rationale: νοῦς ఇక్కడ నైతిక, ఆత్మీయ వివేచనకు సంబంధించిన మనోవృత్తిని సూచిస్తుంది. గ్రీకులో స్వామ్యసర్వనామం లేకున్నా, బహువచన సంబోధనను తెలుగులో సహజంగా స్పష్టం చేయడానికి ‘మీ’ చేర్చబడింది.
- source_word: εἰς τὸ δοκιμάζειν
  choice: అప్పుడు … మీరు వివేచించగలుగుతారు
  rationale: ఈ నిర్మాణంలోని ఉద్దేశం లేదా ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. δοκιμάζωలో పరిశీలించడం, యోగ్యమైనదిగా గుర్తించడం అనే భావాలు రెండూ ఉండగలవు; ప్రధాన పాఠంలో ‘వివేచించు’ ఆ ఫలితాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: దేవుని చిత్తం ఏమిటో
  rationale: τίలోని ప్రశ్నార్థక భావాన్నీ, τοῦ θεοῦలోని సంబంధాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: ἀγαθὸν
  choice: మేలైనది
  rationale: దేవుని చిత్త స్వభావాన్ని తెలిపే విశేషణంగా ‘మేలైనది’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: εὐάρεστον
  choice: ప్రీతికరమైనది
  rationale: ఎవరికి ప్రీతికరమో ప్రధాన పాఠంలో అదనంగా నిర్ణయించకుండా, ‘pleasing/acceptable’ అనే అర్థపరిధిని నిలుపుతుంది.
- source_word: τέλειον
  choice: పరిపూర్ణమైనది
  rationale: విశేషణ త్రయంలో దేవుని చిత్తాన్ని సంపూర్ణమైనదిగా వర్ణించే భావాన్ని నిలుపుతుంది; ‘పూర్తియైనది’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
theological_decisions:
- issue: నైతిక వ్యత్యాసంలో αἰών అనువాదం
  choice: ఈ యుగానికి
  alternative: ఈ లోకానికి; ఈ ప్రస్తుత లోకవ్యవస్థకు
  rationale: ‘యుగం’ అనే పదం పౌలు సూచించే ప్రస్తుత కాలపు నైతిక వ్యవస్థను కాపాడుతుంది; సృష్టిలోకమే చెడ్డదనే భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- issue: దేవుని చిత్తానికి సంబంధించి δοκιμάζειν భావం
  choice: వివేచించగలుగుతారు
  alternative: పరిశీలించి ఆమోదించగలుగుతారు; పరీక్షించి తెలుసుకోగలుగుతారు
  rationale: మానవులు దేవుని చిత్తానికి తీర్పరులనే భావం రాకుండా, నూతనమైన మనస్సు దానిని పరిశీలించి గుర్తించే భావాన్ని వ్యక్తం చేస్తుంది; పరీక్షించడం మరియు ఆమోదయోగ్యమని గుర్తించడం అనే మూలపద ఉద్వేగాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: εὐάρεστον ఎవరికి ప్రీతికరమో
  choice: ప్రధాన పాఠంలో గ్రహీతను పేర్కొనకుండా ‘ప్రీతికరమైనది’
  alternative: దేవునికి ప్రీతికరమైనది; ఆమోదయోగ్యమైనది
  rationale: సందర్భం ‘దేవునికి ప్రీతికరమైనది’ అనే భావానికి అనుకూలమైనా, విశేషణం స్వయంగా గ్రహీతను పేర్కొనదు. అందువల్ల ప్రధాన పాఠం అస్పష్టతను కాపాడి, సాధ్యమైన వివరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహువచన ఆజ్ఞారూపాలతో గౌరవప్రదమైన మరియు సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యంలోని అనుగుణంగా మలచబడటం/రూపాంతరం చెందటం అనే వ్యత్యాసం నిలుపబడింది. చివరి మూడు విశేషణాలు దేవుని చిత్తానికి సమానాధికార వర్ణనలుగా డాష్‌ల మధ్య ఉంచబడ్డాయి.
