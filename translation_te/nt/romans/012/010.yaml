language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: te
  text: సోదర ప్రేమలో ఒకరిపట్ల ఒకరు ఆప్యాయత చూపండి; ఒకరినొకరు గౌరవించడంలో ముందుండండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: సోదర ప్రేమలో
  rationale: విశ్వాసుల మధ్య కుటుంబసదృశమైన ప్రేమను సూచించే పదానికి సహజమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: φιλόστοργοι
  choice: ఆప్యాయత చూపండి
  rationale: కుటుంబ సభ్యుల మధ్య ఉండే స్నేహపూర్వక అనురాగాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τῇ τιμῇ
  choice: గౌరవించడంలో
  rationale: τιμή ఇక్కడ పరస్పరం గౌరవం ఇవ్వడాన్ని సూచిస్తుంది; క్రియాత్మక తెలుగు రూపం వాక్యసంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: προηγούμενοι
  choice: మించండి
  rationale: ఈ పదం ముందుండడం లేదా ఇతరునికి ప్రాధాన్యం ఇవ్వడం అనే భావసాధ్యతలను కలిగి ఉంది. సందర్భంలో పరస్పరం గౌరవించడంలో పోటీపడి ముందుండాలనే ఉద్బోధను సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: προηγούμενοι యొక్క అర్థసాధ్యత
  choice: గౌరవించడంలో ఒకరిని ఒకరు మించండి
  alternative: ఒకరినొకరు గౌరవించడంలో ముందుండండి / ఒకరికి ఒకరు ప్రాధాన్యం ఇవ్వండి
  rationale: మూలపదంలో ముందుండడం, చొరవ చూపడం అనే భావం ఉంది; ఆంగ్ల సంప్రదింపుపాఠంలోని ‘outdo’ భావాన్ని అనుసరిస్తూనే పరస్పర వినయపూర్వక గౌరవాన్ని తెలుగులో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖనానికి తగిన గౌరవప్రదమైన ఆజ్ఞార్థక శైలి వాడబడింది.
