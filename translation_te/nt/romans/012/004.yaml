source:
  edition: SBLGNT
  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: te
  text: ఎందుకంటే, ఒకే శరీరంలో మనకు అనేక అవయవాలు ఉన్నాయి, కానీ ఆ అవయవాలన్నిటికీ ఒకే పని ఉండనట్లే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ
  choice: చేయనట్లే
  rationale: తరువాతి వచనంలో పూర్తయ్యే పోలికను తెలుగులో సహజంగా కొనసాగించేందుకు ‘ఉన్నట్లే/చేయనట్లే’ నిర్మాణంలో పోలిక భావాన్ని నిలిపింది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశంతో ఉన్న వివరణాత్మక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐν ἑνὶ σώματι
  choice: ఒకే శరీరంలో
  rationale: శరీరం ఒక్కటే అన్న రూపకాన్ని అదనపు సంఘ సంబంధ వివరణ లేకుండా నేరుగా నిలిపింది.
- source_word: πολλὰ μέλη
  choice: అనేక అవయవాలు
  rationale: శరీర రూపకానికి సహజమైన ఆధునిక తెలుగు పదం; శరీర భాగాలు అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔχομεν
  choice: మనకు ... ఉండి
  rationale: గ్రీకు వర్తమానకాల భావాన్ని, కొనసాగుతున్న తెలుగు వాక్య నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ δὲ μέλη πάντα
  choice: ఆ అవయవాలన్నీ
  rationale: ముందు ప్రస్తావించిన అవయవాలను తిరిగి సూచిస్తూ, నిరాకరణ అవన్నీ ఒకే పని చేయవనే భావానికి వర్తించేలా ఉంచింది.
- source_word: οὐ τὴν αὐτὴν ἔχει πρᾶξιν
  choice: ఒకే పనిని చేయవు
  rationale: πρᾶξις సూచించే పని లేదా కార్యనిర్వహణ భావాన్ని శరీర రూపకంలో సాధారణ పాఠకులకు సహజంగా అందిస్తుంది; ‘పాత్ర’ వంటి అధిక వ్యాఖ్యాన పదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: శరీర రూపకంలోని సంఘ సంబంధ భావం
  choice: ‘ఒకే శరీరం,’ ‘అనేక అవయవాలు’ అనే రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: ‘సంఘమనే ఒకే శరీరం’ అని స్పష్టీకరించడం
  rationale: తరువాతి వచనం ఈ రూపకాన్ని విశ్వాసుల సమూహానికి అన్వయిస్తుంది; ఈ వచనం మాత్రం పోలికను మాత్రమే ప్రతిపాదిస్తుంది. అందువల్ల మూలపాఠంలోని ఆలోచనా క్రమాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. తరువాతి వచనంలో పూర్తయ్యే పోలికను సూచించేందుకు వచనాంతంలో కొనసాగింపు నిర్మాణం ఉంచబడింది.
