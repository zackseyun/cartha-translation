id: ROM.12.11
reference: Romans 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: te
  text: కార్యదీక్షలో సోమరులుగా ఉండకండి; ఆత్మలో ఉత్సాహంగా ఉండండి[a]; ప్రభువుకు సేవ చేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్రాత్మలో ఉత్సాహంగా ఉండండి’; ఇక్కడ ‘ఆత్మ’ అనే పదం పవిత్రాత్మను సూచిస్తుందని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδῇ
  choice: పట్టుదలలో
  rationale: σπουδήలోని శ్రద్ధ, ఆసక్తి, కార్యదీక్ష అనే భావాలను సందర్భానుకూలంగా తెలియజేస్తుంది; ὀκνηροίతో ఉన్న వ్యతిరేకతను కూడా సహజంగా నిలుపుతుంది.
- source_word: ὀκνηροί
  choice: అలసత్వం చూపకండి
  rationale: ఇక్కడి మందకొడితనం లేదా వెనుకంజ భావాన్ని ఆధునిక తెలుగులో సహజమైన నిషేధాత్మక ప్రబోధంగా వ్యక్తపరుస్తుంది.
- source_word: πνεύματι
  choice: ఆత్మలో
  rationale: గ్రీకులో ఇది విశ్వాసి ఆత్మను లేదా పవిత్రాత్మను సూచించవచ్చు. ప్రధాన పాఠంలో నిర్దిష్ట విశేషణం చేర్చకుండా మూలంలోని సంక్షిప్తతను, సందిగ్ధతను సాధ్యమైనంతవరకు నిలిపి, ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణిలో ఇచ్చాం.
- source_word: ζέοντες
  choice: ఉత్సాహంతో రగులుతూ ఉండండి
  rationale: అక్షరార్థమైన ‘మరుగుతూ’ అనే రూపకాన్ని తెలుగులో సహజంగా వినిపించే ‘రగులుతూ’తో నిలిపి, దాని అంతరంగ తీవ్రతను ‘ఉత్సాహంతో’ స్పష్టం చేస్తుంది.
- source_word: κυρίῳ
  choice: ప్రభువుకు
  rationale: పౌలు సందర్భంలో κύριος అనే బిరుదుకు సహజమైన, స్థిరమైన తెలుగు సమానార్థకం; అది ఎవరిని సూచిస్తుందో అనవసరంగా విస్తరించదు.
- source_word: δουλεύοντες
  choice: సేవ చేయండి
  rationale: ప్రభువుపట్ల అంకితభావం, విధేయత అనే ఉద్దేశాన్ని ప్రబోధాత్మక సందర్భంలో సహజంగా తెలియజేస్తుంది; బానిసత్వ పదజాలాన్ని యాంత్రికంగా దిగుమతి చేయదు.
theological_decisions:
- issue: τῷ πνεύματι ζέοντεςలో πνεύματι దేనిని సూచిస్తుంది?
  choice: విశ్వాసి ఆత్మ లేదా అంతరంగ స్వభావం అనే భావానికి ప్రధాన పాఠం అనుకూలంగా ఉంది
  alternative: పవిత్రాత్మను సూచిస్తుందని కూడా అర్థం చేసుకోవచ్చు
  rationale: నైతిక ప్రబోధాల వరుసలో విశ్వాసి అంతరంగ ఉత్సాహం అనే భావం సహజంగా సరిపోతుంది. అయితే గ్రీకు పదరూపం పవిత్రాత్మ అనే అవగాహనను పూర్తిగా నిరాకరించదు కాబట్టి దానిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ప్రబోధ శైలిని ఉపయోగించాం. మూడు సమాంతర ఆజ్ఞల లయను అర్ధవిరామాలతో నిలిపాం; అరుదైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
