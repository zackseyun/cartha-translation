id: ROM.1.5
reference: Romans 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: te
  text: ఆయన ద్వారా, ఆయన నామం నిమిత్తం అన్ని జాతుల మధ్య విశ్వాసపు విధేయత కొరకు[a][b], మనం కృపను, అపొస్తలత్వాన్ని పొందాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విశ్వాసం వల్ల కలిగే విధేయత,” లేదా “విశ్వాసమే అయిన విధేయత.”
    reason: alternative_reading
  - marker: b
    text: లేదా “యూదేతరులందరి మధ్య.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: ఆయన ద్వారానే
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ మాధ్యమాన్ని సూచిస్తుంది. ముందున్న యేసు క్రీస్తుతో సంబంధాన్ని సహజమైన తెలుగులో కొనసాగిస్తుంది.
- source_word: ἐλάβομεν
  choice: మనం ... పొందాం
  rationale: గ్రీకులోని ప్రథమ పురుష బహువచనాన్ని అలాగే ఉంచి, అది అలంకారికమా లేదా సమూహార్థకమా అనే ప్రశ్నను అనువాదంలో తీర్చలేదు.
- source_word: χάριν καὶ ἀποστολὴν
  choice: కృపను, అపొస్తలత్వాన్ని
  rationale: రెండు సమన్విత నామవాచకాలను కలిపి ఒకే భావంగా మార్చకుండా వేర్వేరుగా నిలిపింది; ‘అపొస్తలత్వం’ నియమించబడిన అపొస్తలుని బాధ్యతను సూచిస్తుంది.
- source_word: εἰς ὑπακοὴν πίστεως
  choice: విశ్వాసపు విధేయత కలిగేలా
  rationale: εἰς తెలిపే ఉద్దేశం/లక్ష్యాన్ని సహజంగా వ్యక్తం చేస్తూ, ‘విశ్వాసపు విధేయత’ అనే సంబంధంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలిపింది.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: అన్ని జనాల మధ్య
  rationale: ἔθνη యొక్క విస్తృత జాతి-సమూహ భావాన్ని తెలియజేస్తుంది; ‘యూదేతరులు’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: ఆయన నామం నిమిత్తం
  rationale: ὑπέρ తెలిపే ఉద్దేశం/ప్రయోజన భావాన్ని, ఆయన గౌరవం మరియు కీర్తి కోసం అనే బైబిలీయ నుడికారాన్ని నిలిపే విధంగా అందిస్తుంది.
theological_decisions:
- issue: ὑπακοὴν πίστεως యొక్క అర్థం
  choice: విశ్వాసపు విధేయత
  alternative: విశ్వాసం వల్ల కలిగే విధేయత; విశ్వాసమే అయిన విధేయత
  rationale: ఈ షష్ఠీ విభక్తి నిర్మాణం సంక్షిప్తమైనది, అర్థపరంగా వివాదాస్పదమైనది. ప్రధాన పాఠం దానిని ఒకే వ్యాఖ్యానానికి పరిమితం చేయకుండా పౌలు వాడిన భావ ఉద్విగ్నతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. పొడవైన గ్రీకు వాక్యభాగాన్ని పఠనసౌలభ్యం కోసం రెండు తెలుగు వాక్యాలుగా విభజించినా, కారణ-లక్ష్య సంబంధాన్ని నిలిపింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
