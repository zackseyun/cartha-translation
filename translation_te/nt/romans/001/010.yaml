source:
  edition: SBLGNT
  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: te
  text: 'నా ప్రార్థనల్లో ఎల్లప్పుడూ ఇలా వేడుకుంటున్నాను: దేవుని చిత్తం ప్రకారం, ఎలాగైనా ఎట్టకేలకు మీ దగ్గరకు రావడంలో నేను సఫలమవుతానేమో అని.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని చిత్తంలో ఎలాగైనా ఎట్టకేలకు మీ దగ్గరకు రావడానికి నా ప్రయాణం సఫలమవుతుందేమో.”
    reason: εὐοδωθήσομαιను “ప్రయాణం సఫలమవుట/మార్గం సుగమమగుట” అని, ἐν τῷ θελήματι τοῦ θεοῦను “దేవుని చిత్తంలో” అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: πάντοτε ἐπὶ τῶν προσευχῶν μου
  choice: ఎల్లప్పుడూ నా ప్రార్థనల్లో
  rationale: పౌలు క్రమంగా చేసే ప్రార్థనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. వాక్యం ముందు వచనంతో వ్యాకరణపరంగా కొనసాగుతున్నందున తెలుగులో భావసంపూర్ణత కోసం ‘మిమ్మల్ని జ్ఞాపకం చేసుకుంటూ’ అని వ్యక్తీకరించబడింది.
- source_word: δεόμενος
  choice: వేడుకుంటున్నాను
  rationale: సాధారణంగా అడగడం కంటే ప్రార్థనలోని earnest petition భావాన్ని ‘వేడుకొను’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἴ πως
  choice: ఏదో విధంగా ... ఏమో అని
  rationale: కోరికతో కూడిన అనిశ్చితిని పరిష్కరించకుండా సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: ἤδη ποτὲ
  choice: ఇప్పటికైనా
  rationale: ఎన్నాళ్లుగానో ఎదురుచూస్తున్న అవకాశం చివరకు లభించాలనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εὐοδωθήσομαι
  choice: నాకు మార్గం సుగమమవుతుంది
  rationale: క్రియలోని ‘ప్రయాణం/ప్రయత్నం విజయవంతమగుట, మార్గం కలుగుట’ అనే సందర్భోచిత భావాన్ని ఆర్థిక అభివృద్ధి అనే అపార్థం లేకుండా నిలుపుతుంది.
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: దేవుని చిత్తం వల్ల
  rationale: పౌలు ప్రయాణం దేవుని చిత్తం ద్వారా సాధ్యమవుతుందనే సాధన లేదా నియంత్రక పరిస్థితి భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: మీ దగ్గరకు రావడానికి
  rationale: ‘రావడం’ అనే మూలార్థాన్ని నిలుపుతూ, ‘సందర్శించడం’ వంటి అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: ప్రయాణ విజయం మరియు దేవుని చిత్తం మధ్య సంబంధం
  choice: దేవుని చిత్తం వల్ల ... మార్గం సుగమమవుతుంది
  alternative: దేవుని చిత్తంలో ... రావడంలో సఫలమవుతాను
  rationale: ἐν అనే ప్రయోగం దేవుని చిత్తాన్ని సాధనంగా గానీ, పరిధి/నియంత్రక పరిస్థితిగా గానీ సూచించవచ్చు. ప్రధాన పాఠం సహజమైన సాధనార్థాన్ని ఇస్తుంది; ప్రత్యామ్నాయాన్ని పూర్తిగా సిద్ధాంతీకరించకుండా గమనికలో గుర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రార్థనలోని ఆర్తి, దీర్ఘకాల నిరీక్షణ, ఫలితం దేవుని చిత్తంపై ఆధారపడటం నిలుపబడ్డాయి.
