id: ROM.1.12
reference: Romans 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν συμπαρακληθῆναι ἐν ὑμῖν διὰ τῆς ἐν ἀλλήλοις πίστεως ὑμῶν τε καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/012.yaml
  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: te
  text: అంటే, మీ మధ్య, మన మధ్యనున్న విశ్వాసం ద్వారా—మీ విశ్వాసం ద్వారానూ నా విశ్వాసం ద్వారానూ—మనం కలిసి ప్రోత్సాహం పొందాలని.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంటే, మీ మధ్య, మన మధ్యనున్న విశ్వాసం ద్వారా—మీ విశ్వాసం ద్వారానూ నా విశ్వాసం ద్వారానూ—నేను మీతో కలిసి ప్రోత్సాహం పొందాలని.” గ్రీకు అవ్యయక్రియ కర్తను స్పష్టంగా పేర్కొనదు; సందర్భంలో పౌలు తన దృష్టికోణం నుండి మాట్లాడుతున్నాడు, అయినా ఈ ప్రోత్సాహం పరస్పరమైనదే.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: అంటే
  rationale: ముందటి మాటను వివరించి స్పష్టం చేసే ప్రయోగం; ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: συμπαρακληθῆναι
  choice: మనం కలిసి ప్రోత్సాహం పొందాలని
  rationale: συν-/συμ- ఉపసర్గ సూచించే ఉమ్మడి, పరస్పర ప్రోత్సాహాన్ని నిలుపుతుంది. గ్రీకు అవ్యయక్రియలో కర్త స్పష్టంగా లేకపోయినా, తరువాతి ‘మీకూ నాకూ’ అనే మాట పరస్పర భాగస్వామ్యాన్ని చూపుతుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: ఇది రోమా విశ్వాసుల మధ్య జరిగే సామాజిక సందర్భాన్ని సూచిస్తుంది; అంతర్గత అర్థం కాదు.
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: మీకూ నాకూ ఉన్న విశ్వాసం ద్వారా
  rationale: διὰ సాధనాన్ని, ἐν ἀλλήλοις పరస్పర సంబంధాన్ని సూచిస్తాయి. తెలుగులో అసహజమైన పదానువాదాన్ని నివారిస్తూ, తరువాతి సమతుల్య పదబంధంతో కలిపి పరస్పర భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఇక్కడ దేవునిపై నమ్మకంతో కూడిన విశ్వాసమే ప్రధాన భావం; ‘విశ్వసనీయత’ కాదు.
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: మీకూ నాకూ ఉన్న
  rationale: రోమా విశ్వాసుల విశ్వాసానికీ పౌలు విశ్వాసానికీ సమాన ప్రాధాన్యం ఇస్తూ, తెలుగు వాక్యంలో సహజంగా అమరుతుంది.
theological_decisions:
- issue: ఇది పౌలు వారిని మాత్రమే బలపరచడమా, లేక పరస్పర ప్రోత్సాహమా?
  choice: పౌలు మరియు రోమా విశ్వాసులు కలిసి పొందే పరస్పర ప్రోత్సాహం
  alternative: ప్రధానంగా పౌలు వారి మధ్య ప్రోత్సాహం పొందడం
  rationale: συμπαρακληθῆναι లోని ఉమ్మడి భావం, అలాగే ‘మీకూ నాకూ’ అనే ముగింపు, ఒకవైపు సేవకన్నా పరస్పర ప్రోత్సాహాన్నే స్పష్టంగా సూచిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదంగా ఉంది. ‘మనం కలిసి’ అనే రూపం పరస్పరతను సహజంగా తెలియజేస్తుంది; పాదసూచిక పౌలు ఏకవచన దృష్టికోణంతో చదివే అవకాశాన్ని నిలుపుతుంది.
