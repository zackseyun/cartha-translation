id: ROM.1.30
reference: Romans 1:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: te
  text: ఇతరులపై అపనిందలు వేసేవారు, దేవుణ్ణి ద్వేషించేవారు[a], దౌర్జన్యంగా ప్రవర్తించేవారు, గర్విష్ఠులు, గొప్పలు చెప్పుకునేవారు, కొత్త కొత్త చెడు పనులు పన్నేవారు, తల్లిదండ్రులకు అవిధేయులు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవునిచేత ద్వేషించబడినవారు.”
    reason: θεοστυγεῖς అనే గ్రీకు పదానికి సాధ్యమైన కర్మణి అర్థాన్ని భద్రపరచడానికి.
lexical_decisions:
- source_word: καταλάλους
  choice: ఇతరులపై అపనిందలు వేసేవారు
  rationale: ఇతరులు లేనప్పుడు వారికి వ్యతిరేకంగా చెడుగా, పరువు తీసేలా మాట్లాడే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: θεοστυγεῖς
  choice: దేవుణ్ణి ద్వేషించేవారు
  rationale: ఈ దోషాల జాబితాలో మానవుల వైఖరిని సూచించే క్రియాశీల అర్థం సహజంగా సరిపోతుంది; రూపానికి సాధ్యమైన కర్మణి అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὑβριστάς
  choice: దౌర్జన్యంగా ప్రవర్తించేవారు
  rationale: ఇది కేవలం మాటల అవమానాన్నే కాక, అహంకారంతో ఇతరులను కించపరచే లేదా బాధించే ప్రవర్తనను కూడా సూచిస్తుంది.
- source_word: ὑπερηφάνους
  choice: గర్విష్ఠులు
  rationale: తమను తాము ఉన్నతులుగా భావించే అహంకారాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀλαζόνας
  choice: గొప్పలు చెప్పుకునేవారు
  rationale: తమ గురించి డంబంగా చెప్పుకునే, లేనిదాన్ని ఉన్నట్లు ప్రదర్శించే ప్రధాన భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: ἐφευρετὰς κακῶν
  choice: కొత్త కొత్త చెడు పనులు పన్నేవారు
  rationale: చెడును సృజనాత్మకంగా కనిపెట్టి పథకాలు వేసే భావాన్ని సహజమైన తెలుగులో ఉంచుతుంది.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: తల్లిదండ్రులకు అవిధేయులు
  rationale: గ్రీకు దత్తి విభక్తితో ఉన్న విశేషణం సూచించే సంబంధాన్ని దగ్గరగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: θεοστυγεῖς పదం క్రియాశీలమా, కర్మణియా?
  choice: 'క్రియాశీల అర్థం: “దేవుణ్ణి ద్వేషించేవారు”'
  alternative: 'కర్మణి అర్థం: “దేవునిచేత ద్వేషించబడినవారు”'
  rationale: చుట్టూ ఉన్న పదాలన్నీ మానవుల దోషపూరిత వైఖరులు లేదా ప్రవర్తనలను పేర్కొంటున్నందున క్రియాశీల అర్థం సందర్భానికి బాగా సరిపోతుంది. అయితే చారిత్రకంగా చర్చించబడిన కర్మణి అర్థం నిజమైన భాషాపరమైన అవకాశంగా పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దోషాల జాబితి లయను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పదజాలం వాడబడింది. సమీప పదాల మధ్య భావభేదాన్ని నిలుపుకోవడానికి ὑβριστάςను ప్రవర్తనాత్మక పదబంధంగా, ὑπερηφάνουςను ‘గర్విష్ఠులు’గా, ἀλαζόναςను ‘గొప్పలు చెప్పుకునేవారు’గా వేరు చేశాం.
