revisions:
- from: వారు దేవుణ్ణి తమ జ్ఞానంలో ఉంచుకోవడం యోగ్యమని భావించనట్లే[a], దేవుడు వారిని అయోగ్యమైన మనస్సుకు అప్పగించాడు[b]—తగని పనులు చేయడానికి.
  to: వారు దేవుణ్ణి తమ జ్ఞానంలో ఉంచుకోవడం యోగ్యమని భావించనట్లే[a], దేవుడు వారిని అయోగ్యమైన మనస్సుకు విడిచిపెట్టాడు[b], తగనివి చేయడానికి.
  rationale: ప్రధాన పాఠంలో గ్రీకు పదప్రయోగం మరియు ἔχειν ἐν ἐπιγνώσειలోని ఉద్దేశపూర్వకంగా దేవుణ్ణి జ్ఞానంలో ఉంచుకోకపోవడం అనే భావం నిలిపి ఉంచబడింది. παρέδωκενకు ‘విడిచిపెట్టాడు’ వాడటం తెలుగులో సహజంగా ఉండి, సందర్భంలోని దేవుని ‘వారిని వారి స్థితికి అప్పగించడం’ అనే పునరావృత భావాన్ని వ్యక్తం చేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
