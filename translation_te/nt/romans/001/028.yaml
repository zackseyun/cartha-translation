id: ROM.1.28
reference: Romans 1:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: te
  text: వారు దేవుణ్ణి తమ జ్ఞానంలో ఉంచుకోవడం యోగ్యమని భావించనట్లే[a], దేవుడు వారిని అయోగ్యమైన మనస్సుకు విడిచిపెట్టాడు[b], తగనివి చేయడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుణ్ణి గుర్తించి అంగీకరించడం.”
    reason: lexical_alternative
  - marker: b
    text: “యోగ్యమని భావించలేదు,” “అయోగ్యమైన మనస్సు” అనే మాటలు మూలభాషలో పరస్పర సంబంధమున్న పదాలు; “అయోగ్యమైన”కు బదులుగా “భ్రష్టమైన” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: భావించనట్లే
  rationale: ‘ఎలాగైతే/అలాగే’ అనే అనురూప భావాన్ని నిలుపుతుంది; సందర్భంలో ఉన్న కారణసూచనను అతిగా స్పష్టీకరించదు.
- source_word: ἐδοκίμασαν
  choice: యోగ్యమని భావించలేదు
  rationale: పరిశీలించి ఆమోదించడం లేదా సముచితమని ఎంచడం అనే భావాన్ని ఇస్తూ, తరువాతి ἀδόκιμονతో ఉన్న పదసంబంధాన్ని తెలుగులో నిలుపుతుంది.
- source_word: ἔχειν ἐν ἐπιγνώσει
  choice: తమ జ్ఞానంలో ఉంచుకోవడం
  rationale: మూలంలోని ‘జ్ఞానంలో కలిగియుండడం’ అనే కొంత అస్పష్టమైన రూపకాన్ని సాధ్యమైనంత సహజంగా నిలుపుతుంది; కేవలం ‘అంగీకరించడం’ అని భావాన్ని కుదించదు.
- source_word: παρέδωκεν
  choice: అప్పగించాడు
  rationale: దేవుని న్యాయతీర్పులో వారిని వారి స్థితికి వదిలివేయడం అనే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀδόκιμον νοῦν
  choice: అయోగ్యమైన మనస్సు
  rationale: ‘పరీక్షకు నిలవని/ఆమోదయోగ్యం కాని’ అనే ప్రాథమిక భావాన్ని ఇస్తూ, ἐδοκίμασανకు వాడిన ‘యోగ్యమని’తో పౌలు చేసిన పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: ποιεῖν
  choice: చేయడానికి
  rationale: ‘అప్పగించాడు’ అనే క్రియకు అనుసంధానమైన మూలంలోని infinitive నిర్మాణాన్ని ఉద్దేశం లేదా ఫలితం అనే రెండింటికీ వీలుండేలా ఉంచుతుంది.
- source_word: τὰ μὴ καθήκοντα
  choice: తగని పనులు
  rationale: సముచితం కానివి, చేయదగనివి అనే నైతిక భావాన్ని సంక్షిప్తమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀδόκιμον νοῦνను ‘భ్రష్టమైన మనస్సు’ లేదా ‘దుర్బుద్ధి’ వంటి మరింత తీవ్రమైన సిద్ధాంతపరమైన పదాలతో అనువదించాలా?
  choice: అయోగ్యమైన మనస్సు
  alternative: భ్రష్టమైన మనస్సు
  rationale: మూల విశేషణం ‘ఆమోదం పొందని, పరీక్షకు నిలవని’ అనే భావాన్ని కలిగి ఉంది. ‘అయోగ్యమైన’ అనేది దేవుని న్యాయతీర్పును తగ్గించకుండా, మూలంలో లేని అదనపు సిద్ధాంతభారాన్ని మోపకుండా, పదప్రయోగాన్ని కూడా కాపాడుతుంది.
- issue: ἔχειν ἐν ἐπιγνώσειని కేవలం ‘దేవుణ్ణి అంగీకరించడం’గా స్పష్టీకరించాలా?
  choice: దేవుణ్ణి తమ జ్ఞానంలో ఉంచుకోవడం
  alternative: దేవుణ్ణి గుర్తించి అంగీకరించడం
  rationale: మూలంలోని ‘కలిగియుండడం/ఉంచుకోవడం’ మరియు ‘జ్ఞానం’ రెండింటినీ ప్రధాన పాఠంలో ఉంచి, అది గుర్తింపు, అంగీకారం లేదా జ్ఞాపకంలో నిలుపుకోవడం వైపు సూచిస్తుందనే భావతీవ్రతను తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘యోగ్యమని/అయోగ్యమైన’ అనే జత ద్వారా గ్రీకు పదప్రయోగం నిలుపబడింది. వాక్యాంతంలోని infinitiveను ‘చేయడానికి’గా ఉంచి ఉద్దేశం–ఫలితం మధ్య ఉన్న స్వల్ప అస్పష్టతను పరిష్కరించకుండా కాపాడాం.
