- from: ఈ కారణంగా దేవుడు వారిని అవమానకరమైన వాంఛలకు అప్పగించాడు. ఎందుకంటే, వారి స్త్రీలు[a] సైతం సహజమైన లైంగిక సంబంధాన్ని[b] ప్రకృతికి విరుద్ధమైన సంబంధంగా[c] మార్చుకున్నారు.
  to: ఈ కారణంగా దేవుడు వారిని అవమానకరమైన వాంఛలకు అప్పగించాడు; ఎందుకంటే వారి స్త్రీలు[a] సైతం సహజమైన లైంగిక సంబంధాన్ని[b] ప్రకృతికి విరుద్ధమైన దానితో[c] మార్చుకున్నారు.
  rationale: The revision preserves the source's single causal flow and explicitly represents the exchange of the natural use for what is contrary to nature. It retains the draft's modern, non-paraphrastic terminology and corrects the c footnote so that it remains a genuine alternative rendering of παρὰ φύσιν.
