id: ROM.1.26
reference: Romans 1:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: te
  text: ఈ కారణంగా దేవుడు వారిని అవమానకరమైన వాంఛలకు అప్పగించాడు; ఎందుకంటే వారి స్త్రీలు[a] సైతం సహజమైన లైంగిక సంబంధాన్ని[b] ప్రకృతికి విరుద్ధమైన దానితో[c] మార్చుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘వారి ఆడవారు.’
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘సహజమైన వాడుకను.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ప్రకృతికి వ్యతిరేకమైనది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ఈ కారణంగా
  rationale: ముందటి వాదనతో ఈ వాక్యాన్ని కలిపే కారణార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: παρέδωκεν
  choice: అప్పగించాడు
  rationale: దేవుడు వారిని వారి తిరుగుబాటు పరిణామాలకు వదిలివేసిన న్యాయతీర్పు భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: πάθη ἀτιμίας
  choice: అవమానకరమైన వాంఛలు
  rationale: πάθηలోని బలమైన కోరికల భావాన్నీ, ἀτιμίαలోని గౌరవహీనత అనే మూల్యాంకనాన్నీ అనవసరంగా తీవ్రతరం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: θήλειαι
  choice: స్త్రీలు
  rationale: గ్రీకు పదానికి అక్షరార్థంగా ‘ఆడవారు’ అని చెప్పవచ్చు; అయితే మానవులను సూచించే ఈ సందర్భంలో ‘స్త్రీలు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది. అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: μετήλλαξαν
  choice: మార్చుకున్నారు
  rationale: ఒకదాని స్థానంలో మరొకదాన్ని ఎంచుకున్న మార్పిడి భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: సహజమైన లైంగిక సంబంధం
  rationale: χρῆσιςను అక్షరార్థంగా ‘వాడుక’ అనడం తెలుగులో అసహజంగానూ తప్పుదారి పట్టించేదిగానూ ఉండవచ్చు; సందర్భం సూచించే లైంగిక సంబంధ భావాన్ని ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὴν παρὰ φύσιν
  choice: ప్రకృతికి విరుద్ధమైన సంబంధం
  rationale: παρὰ φύσιν అనే గ్రీకు పదబంధంలోని ‘ప్రకృతికి విరుద్ధం’ అనే మూల్యాంకనాన్ని స్పష్టంగా నిలుపుతూ, ముందున్న ‘సంబంధం’తో వ్యాకరణపరంగా జతచేస్తుంది.
theological_decisions:
- issue: పౌలు వాడిన నైతిక మూల్యాంకనాన్ని బలపరచాలా లేక మృదువుచేయాలా
  choice: ‘అవమానకరమైన’, ‘ప్రకృతికి విరుద్ధమైన’ అనే మూల్యాంకన పదాలను అలాగే నిలుపుతూ వివరణాత్మక వ్యాఖ్యను చేర్చలేదు.
  alternative: నైతిక భావాన్ని మృదువుచేసే పదాలు వాడటం, లేదా మూలపాఠంలో లేని ఆధునిక వర్గీకరణలను స్పష్టంగా చేర్చటం.
  rationale: మూలవాక్యంలో నైతిక మూల్యాంకనం ఉంది; అనువాదం దానిని నిలుపుకోవాలి. అదే సమయంలో, పాఠం నేరుగా పేర్కొనని సిద్ధాంతపరమైన లేదా ఆధునిక సామాజిక వర్గాలను అందులోకి దిగుమతి చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని కారణ సంబంధం, నైతిక మూల్యాంకనం, లైంగిక సందర్భం నిలుపబడ్డాయి; కానీ మూలంలో లేని ఆధునిక గుర్తింపులు లేదా మతశాఖాపరమైన వ్యాఖ్యానాలు చేర్చబడలేదు.
