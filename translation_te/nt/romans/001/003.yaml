  edition: SBLGNT
  text: περὶ τοῦ υἱοῦ αὐτοῦ, τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/003.yaml
  text: concerning his Son[a], who was descended from the offspring of David according to the flesh[b],
translation:
  language: te
  text: తన కుమారుని గురించి—ఆయన శరీర సంబంధంగా దావీదు సంతానం నుండి వచ్చినవాడు[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో, ‘దావీదు విత్తనం నుండి’ అని ఉంది; అంటే దావీదు వంశం లేదా సంతానం నుండి.
    reason: lexical_alternative
  - marker: b
    text: ‘శరీర సంబంధంగా’ అనేది ఇక్కడ మానవ వంశాన్ని లేదా మానవ వంశసంబంధాన్ని సూచిస్తుంది; పాప స్వభావాన్ని కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ
  choice: గురించి
  rationale: మునుపటి వాక్యంలో ప్రకటించిన సువార్త యొక్క విషయాన్ని పరిచయం చేసే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: తన కుమారుని
  rationale: ఇది దేవుని కుమారుణ్ణి సూచిస్తుంది. తెలుగు లిపిలో పెద్ద అక్షరాల భేదం లేనందున సందర్భమే ఆ సూచనను స్పష్టం చేస్తుంది.
- source_word: τοῦ γενομένου
  choice: పుట్టినవాడు
  rationale: γίνομαι రూపం ఇక్కడ మానవ జననం, వంశపారంపర్య మూలాన్ని సూచిస్తుంది. ‘పుట్టినవాడు’ దాని క్రియాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; కేవలం ‘చెందినవాడు’ అని చెప్పి దాన్ని పూర్తిగా వంశావళి ప్రకటనగా కుదించదు.
- source_word: ἐκ σπέρματος Δαυὶδ
  choice: దావీదు సంతానంలో
  rationale: σπέρμα అక్షరార్థంగా ‘విత్తనం’ అయినా, ఇక్కడ దావీదు వంశపరంపరను సూచిస్తుంది. ‘సంతానంలో’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి సమూహార్థాన్ని నిలుపుతుంది.
- source_word: κατὰ σάρκα
  choice: శరీర సంబంధంగా
  rationale: σάρξ యొక్క ప్రాముఖ్యాన్ని పూర్తిగా తొలగించకుండా, ఈ సందర్భంలో మానవ వంశసంబంధాన్ని సూచించే సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: దేవుని కుమారత్వానికి, దావీదు వంశంలో ఆయన మానవ జననానికి మధ్య సంబంధం
  choice: ‘తన కుమారుని’ మరియు ‘శరీర సంబంధంగా దావీదు సంతానంలో పుట్టినవాడు’ అనే రెండు అంశాలనూ నేరుగా నిలుపడం
  alternative: ‘మానవ స్వభావం విషయానికొస్తే’ అని తరువాతి సిద్ధాంత భాషలో మరింత వివరణాత్మకంగా అనువదించడం
  rationale: మూలవాక్యం దైవ కుమారత్వాన్నీ నిజమైన మానవ దావీదు వంశాన్నీ కలిపి చెబుతుంది; వాటి తాత్త్విక సంబంధాన్ని వివరించదు. అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: κατὰ σάρκα లో σάρξ యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘శరీర సంబంధంగా’ అని ఉంచి, ఇది మానవ వంశాన్ని సూచిస్తుందని పాదసూచికలో స్పష్టం చేయడం
  alternative: ‘మానవ వంశం ప్రకారం’ అని పూర్తిగా వివరణాత్మకంగా అనువదించడం
  rationale: పౌలు వాడిన శరీర-పదజాలానికి ఉన్న బరువును కొంత నిలుపుతూ, ఇక్కడ అది పాప స్వభావాన్ని సూచిస్తుందనే అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని సంక్షిప్త నిర్మాణాన్ని డాష్ ద్వారా నిలిపి, ఇది రోమా 1:2–4లో కొనసాగుతున్న వాక్యభాగమని సూచించేందుకు చివర కామా ఉంచబడింది.
