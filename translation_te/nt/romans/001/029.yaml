translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దోషాల జాబితాకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలంతోనూ అనువదించబడింది. మూలంలోని πεπληρωμένους/μεστοὺς భేదాన్ని ‘నిండిపోయారు/నిండినవారు’గా ప్రతిబింబించింది; సమీపార్థక దోషపదాలను సాధ్యమైనంతవరకు వేరు చేసింది.
