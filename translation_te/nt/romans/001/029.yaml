id: ROM.1.29
reference: Romans 1:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πεπληρωμένους πάσῃ ⸀ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/029.yaml
  text: filled with every kind of unrighteousness[a], evil, greed, and malice; full of envy, murder, strife, deceit, and maliciousness; whisperers[b],
translation:
  language: te
  text: వారు ప్రతి విధమైన అనీతితో[a], దుష్టత్వంతో, అత్యాశతో, చెడుతనంతో నిండిపోయారు; అసూయ, హత్య, కలహం, మోసం, దుర్భావంతో నిండినవారు; చాటుగా అపనిందలు చెప్పేవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమస్త అనీతితో’; గ్రీకు పదబంధం సమగ్ర పరిధిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: దీనిని ‘గుసగుసలాడేవారు,’ ‘చాడీలు చెప్పేవారు,’ లేదా ‘రహస్యంగా అపనిందలు చెప్పేవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένους
  choice: నిండిపోయారు
  rationale: పరిపూర్ణ కర్మణి కృదంతం సూచించే, గత చర్య ఫలితంగా ఏర్పడిన ప్రస్తుత స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάσῃ ἀδικίᾳ
  choice: అన్నివిధాల అనీతితో
  rationale: πάσῃ యొక్క సమగ్ర పరిధిని చూపుతూ, ἀδικίαలోని విస్తృత నైతిక తప్పుదనాన్ని ‘అనీతి’ నిలుపుతుంది.
- source_word: πονηρίᾳ
  choice: దుష్టత్వంతో
  rationale: సాధారణ నైతిక చెడును సూచించే గంభీరమైన, ప్రస్తుత తెలుగు పదం.
- source_word: πλεονεξίᾳ
  choice: అత్యాశతో
  rationale: మరింత సంపాదించాలనే లేదా స్వాధీనం చేసుకోవాలనే తీరని ఆశను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: κακίᾳ
  choice: దుర్బుద్ధితో
  rationale: πονηρίαకు వాడిన ‘దుష్టత్వం’తో కలిపివేయకుండా, ఇతరులకు కీడు తలపెట్టే వైఖరిని వ్యక్తం చేస్తుంది.
- source_word: μεστοὺς
  choice: నిండినవారు
  rationale: πεπληρωμένουςతో ఉన్న గ్రీకు పదభేదాన్ని కొంతవరకు నిలుపుతూ సహజంగా ఉంటుంది.
- source_word: φθόνου
  choice: అసూయ
  rationale: ఇతరుల మేలు లేదా సంపదను చూసి కలిగే దోషపూరిత భావానికి ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: φόνου
  choice: హత్య
  rationale: దోషాల జాబితాలో ఉద్దేశపూర్వకంగా ప్రాణం తీయడాన్ని సూచించే నైతిక బలాన్ని నిలుపుతుంది.
- source_word: ἔριδος
  choice: కలహం
  rationale: వివాదం, పోరు, విభేదంతో కూడిన సంబంధ వైషమ్యాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: δόλου
  choice: మోసం
  rationale: ఉద్దేశపూర్వక వంచనను ఆధునిక పాఠకులకు నేరుగా తెలియజేస్తుంది.
- source_word: κακοηθείας
  choice: కుయుక్తి
  rationale: చెడుగా తలంచే స్వభావం నుంచి పుట్టే కపటమైన హానికర ఉద్దేశాన్ని చూపుతూ, κακίαకు ఇచ్చిన పదం నుంచి భేదాన్ని నిలుపుతుంది.
- source_word: ψιθυριστάς
  choice: చాటుగా అపనిందలు చెప్పేవారు
  rationale: అక్షరార్థమైన ‘గుసగుసలాడేవారు’ కంటే, ఇతరుల గురించి రహస్యంగా హానికర మాటలు చెప్పే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
