id: ROM.1.7
reference: Romans 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: te
  text: 'రోములో ఉన్న, దేవునికి ప్రియమైన, పరిశుద్ధులుగా పిలువబడిన వారందరికీ: మన తండ్రియైన దేవుని నుండీ, ప్రభువైన యేసు మెస్సీయ[a] నుండీ మీకు కృప, శాంతి కలుగుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తు.” “మెస్సీయ” అంటే అభిషిక్తుడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: రోములో ఉండి ... వారందరికీ
  rationale: దత్తివ విభక్తిలోని సంబోధనను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, స్థలాన్ని మరియు ‘అందరికీ’ అనే సమగ్రతను నిలుపుతుంది.
- source_word: ἀγαπητοῖς θεοῦ
  choice: దేవునికి ప్రియులుగా
  rationale: ἀγαπητοῖς అనే విశేషణ భావాన్ని నిలుపుతూ, దేవునితో ఉన్న ప్రేమసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κλητοῖς ἁγίοις
  choice: పరిశుద్ధులుగా పిలువబడిన
  rationale: రెండు విశేషణాల భావాన్ని తెలుగులో సహజంగా కలుపుతుంది; గ్రీకులో లేని ఉద్దేశార్థక ‘కావడానికి’ అనే భావాన్ని చేర్చదు.
- source_word: χάρις
  choice: కృప
  rationale: పౌలు శుభవచనంలో ఉన్న సాధారణ అర్థాన్నీ, వేదాంతపరమైన ప్రతిధ్వనినీ నిలుపుతుంది.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: శుభాకాంక్ష భావంతో పాటు సంపూర్ణ క్షేమం అనే లోతైన భావాన్నీ మోయగల ప్రామాణిక తెలుగు పదం.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: మన తండ్రియైన దేవుడు
  rationale: గ్రీకు సంబంధాన్ని స్పష్టంగా, గౌరవప్రదమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος యొక్క అధికార మరియు క్రీస్తుసంబంధ బలాన్ని నిలిపే స్థిరమైన తెలుగు సమానార్థకం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστόςను కేవలం ధ్వన్యనువాదంగా కాక, ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావంతో అందిస్తుంది; తెలుగు క్రైస్తవ వాడుకలో గుర్తించదగిన రూపం.
theological_decisions:
- issue: κλητοῖς ἁγίοιςను ఉద్దేశార్థకంగా అనువదించాలా, లేక వర్ణనాత్మకంగా ఉంచాలా
  choice: పరిశుద్ధులుగా పిలువబడిన
  alternative: పరిశుద్ధులు కావడానికి పిలువబడిన
  rationale: మూల గ్రీకులో ‘కావడానికి’కి సమానమైన క్రియారూపం లేదు. ఎంచుకున్న రూపం పిలుపు మరియు పరిశుద్ధ స్థితి మధ్యనున్న సంబంధాన్ని అతిగా నిర్ణయించకుండా ఉంచుతుంది.
- issue: Χριστοῦను సంప్రదాయ ధ్వన్యనువాదంతోనా, బిరుదు అర్థంతోనా ఇవ్వాలి
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός యేసుకు సంబంధించిన బిరుదుగానే వినిపిస్తుంది. ‘మెస్సీయ’ ఆ బిరుదు అర్థాన్ని పాఠకునికి ప్రత్యక్షంగా సూచిస్తుంది; సంప్రదాయ రూపాన్ని పాదసూచనలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పత్రికా శుభవచనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కలుగుగాక’ ఆశీర్వాద/శుభాకాంక్ష స్వరాన్ని సహజంగా వ్యక్తం చేస్తుంది.
