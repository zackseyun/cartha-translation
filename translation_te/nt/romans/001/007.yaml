revisions:
- from: 'రోములో ఉండి, దేవునికి ప్రియులుగా, పరిశుద్ధులుగా పిలువబడిన వారందరికీ: మన తండ్రియైన దేవుని నుండీ, ప్రభువైన యేసు మెస్సీయ[a] నుండీ మీకు కృప, శాంతి కలుగుగాక.'
  to: 'రోములో ఉన్న, దేవునికి ప్రియమైన, పరిశుద్ధులుగా పిలువబడిన వారందరికీ: మన తండ్రియైన దేవుని నుండీ, ప్రభువైన యేసు మెస్సీయ[a] నుండీ మీకు కృప, శాంతి కలుగుగాక.'
  rationale: 'The revision makes only idiomatic and syntactic adjustments: it changes the potentially circumstantial ‘ఉండి’ to attributive ‘ఉన్న’ and smooths ‘ప్రియులుగా’ to ‘ప్రియమైన.’ It does not alter the source’s descriptive, rather than explicitly purposive, sense for κλητοῖς ἁγίοις.'
