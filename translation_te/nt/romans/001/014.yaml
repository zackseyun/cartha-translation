id: ROM.1.14
reference: Romans 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: te
  text: గ్రీకులకూ, గ్రీకేతరులకూ[a], జ్ఞానులకూ, అవివేకులకూ నేను ఋణపడి ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విదేశీయులకు’; గ్రీకు పదం ఇక్కడ సాధారణ గ్రీకు సాంస్కృతిక విభజనలో ‘గ్రీకులు కానివారిని’ సూచిస్తుంది; వారు అనాగరికులు లేదా క్రూరులు అని తప్పనిసరిగా అర్థం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: గ్రీకులకు
  rationale: ఇది దత్తివిభక్తి బహువచనంలో ఉన్న జాతి-సాంస్కృతిక వర్గపేరు; ‘గ్రీకులు’ దాని సూటి, సహజ తెలుగు రూపం.
- source_word: βαρβάροις
  choice: గ్రీకేతరులకు
  rationale: మొదటి శతాబ్దపు గ్రీకు సాంస్కృతిక వాడుకలో ఈ పదం ‘గ్రీకులు’ కానివారిని సూచించే సంప్రదాయ విరుద్ధపదం. తెలుగులో ‘అనాగరికులు’ అంటే నైతికంగా లేదా సామాజికంగా క్రూరులనే అనవసర భావం బలంగా కలగవచ్చు కాబట్టి ‘గ్రీకేతరులు’ను ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: σοφοῖς
  choice: జ్ఞానులకు
  rationale: ἀνοήτοις‌తో ఉన్న సంక్షిప్త విరుద్ధ జతను సహజంగా నిలుపుతుంది.
- source_word: ἀνοήτοις
  choice: అవివేకులకు
  rationale: ‘జ్ఞానులు’ అనే విరుద్ధ పదంతో భావసామ్యాన్ని నిలుపుతూ, కేవలం విద్యలేనివారు అనే సంకుచిత అర్థానికి పరిమితం చేయదు.
- source_word: ὀφειλέτης
  choice: ఋణపడి ఉన్నాను
  rationale: మూలంలోని ‘ఋణస్థుడు’ అనే రూపకాన్ని నిలుపుతూ, ఇక్కడ డబ్బు అప్పు కాక బాధ్యతకు లోబడి ఉండడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: τε ... καὶ / τε ... καὶ
  choice: …కూ, …కూ / …కూ, …కూ
  rationale: గ్రీకు వాక్యంలోని రెండు సమతుల్య జతల లయను తెలుగులో పునరుక్త సముచ్చయ ప్రత్యయంతో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని రెండు సమాంతర విరుద్ధ జతలు నిలుపబడ్డాయి; అపార్థం కలిగించే చారిత్రక పదానికి బదులుగా స్పష్టమైన ‘గ్రీకేతరులు’ను ఎంచుకొని పాదటిప్పణిలో ప్రత్యామ్నాయాన్ని వివరించాం.
