    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: పౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: δοῦλος
  choice: బానిస
  rationale: ఈ సందర్భంలో యజమానికి పూర్తిగా చెందినవాడనే బంధాన్ని స్పష్టంగా నిలుపుతుంది; ‘సేవకుడు’ కంటే మూలపద బలాన్ని మెరుగుగా తెలియజేస్తుంది.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని మెస్సీయ అర్థాన్ని అనువదించి, గ్రీకు పదక్రమాన్ని సాధ్యమైనంతవరకు నిలిపింది.
- source_word: κλητὸς ἀπόστολος
  choice: అపొస్తలునిగా పిలువబడి
  rationale: ‘పిలువబడిన అపొస్తలుడు’ అనే మూల నిర్మాణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘అపొస్తలుడవడానికి’ అనే అదనపు ఉద్దేశార్థాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἀφωρισμένος
  choice: ప్రత్యేకపరచబడిన
  rationale: నిష్క్రియాత్మక కృదంత భావాన్నీ, ఒక నిర్దిష్ట కార్యం కోసం వేరుగా ఉంచబడిన భావాన్నీ నిలుపుతుంది.
- source_word: εἰς εὐαγγέλιον θεοῦ
  choice: దేవుని సువార్త కోసం
  rationale: εἰς యొక్క ప్రయోజన దిశను సహజంగా తెలుపుతూ, θεοῦ అనే సంబంధ విభక్తిని ‘దేవుని’గా నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: δοῦλος యొక్క సంబంధబలం
  choice: బానిస
  alternative: సేవకుడు; దాసుడు
  rationale: పౌలు తనను మెస్సీయ యేసుకు చెందినవాడిగా చెప్పే బలమైన భావాన్ని పలుచన చేయకుండా ఉంచింది. అయితే తెలుగు పాఠకులకు అందుబాటులో ఉన్న సాంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: Χριστόςను బిరుదుగా లేదా స్థిరనామంగా చూపడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ పదానికి ఉన్న అభిషిక్త రాజు/మెస్సీయ బిరుదు భావాన్ని బయటపెడుతుంది; సాంప్రదాయ లిప్యంతరీకరణను పాదసూచికలో గుర్తించింది.
- issue: κλητὸς ἀπόστολοςలో పిలుపు భావం
  choice: అపొస్తలునిగా పిలువబడి
  alternative: పిలువబడిన అపొస్తలుడు; అపొస్తలుడవడానికి పిలువబడి
  rationale: పిలిచినది దేవుడనే అంతర్లీన నిష్క్రియ భావాన్ని నిలుపుతూ, మూలంలో స్పష్టంగా లేని ‘అవడానికి’ అనే ప్రయోజనార్థాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. గ్రీకు వాక్యంలో పౌలును వర్ణించే మూడు సమాంతర భాగాలను తెలుగు కృదంత నిర్మాణాలతో కలిపి ఉంచింది. తదుపరి వచనాలతో వాక్యం కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
