  text: Παῦλος δοῦλος ⸂Χριστοῦ Ἰησοῦ⸃, κλητὸς ἀπόστολος, ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a servant of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: te
  text: మెస్సీయ యేసుకు[b] బానిసనైన[a], పిలువబడిన అపొస్తలుడై[c], దేవుని సువార్త కోసం ప్రత్యేకపరచబడిన పౌలు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బానిస’కు బదులుగా ‘దాసుడు’ లేదా ‘సేవకుడు’ అని కూడా అనువదించవచ్చు; మూలపదం యజమానికి చెందినవాడనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మెస్సీయ యేసు’కు సాంప్రదాయ రూపం ‘క్రీస్తు యేసు’.
