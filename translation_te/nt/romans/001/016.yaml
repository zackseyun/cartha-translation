id: ROM.1.16
reference: Romans 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: te
  text: ఎందుకంటే నేను సువార్తకు[a] సిగ్గుపడను; అది విశ్వసించే ప్రతి ఒక్కరికీ—మొదట యూదునికి, అలాగే గ్రీకునికి[b]—రక్షణ కలిగించే దేవుని శక్తి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మంచి వార్తకు.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘గ్రీకుడు’ అనే పదం విస్తృతంగా యూదేతరుణ్ణి, అంటే యూదుడు కాని వ్యక్తిని, సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: సిగ్గుపడను
  rationale: అవమానంగా భావించి వెనుకంజ వేయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εὐαγγέλιον
  choice: సువార్త
  rationale: ‘మంచి వార్త’ అనే మూలార్థాన్ని మోసే, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన పదం; ప్రత్యక్ష అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: δύναμις
  choice: శక్తి
  rationale: దేవుని ప్రభావవంతమైన రక్షణ కార్యాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς σωτηρίαν
  choice: రక్షణ కలిగించడానికి
  rationale: εἰς యొక్క లక్ష్యార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, దేవుని శక్తి రక్షణ వైపు కార్యసాధకంగా పనిచేస్తుందనే భావాన్ని నిలుపుతుంది.
- source_word: παντὶ τῷ πιστεύοντι
  choice: విశ్వసించే ప్రతి ఒక్కరికీ
  rationale: παντί యొక్క సమగ్ర, వ్యక్తివ్యాప్త భావాన్నీ πιστεύοντι యొక్క క్రియాత్మక భావాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: Ἰουδαίῳ
  choice: యూదునికి
  rationale: Ἕλληνι తో ఉన్న జాతి-మతపరమైన వ్యత్యాసంలో ‘యూదుడు’ అనే అర్థమే సందర్భానికి తగినది.
- source_word: πρῶτον
  choice: మొదట
  rationale: గ్రీకు పాఠంలోని సంక్షిప్త ప్రాధాన్య క్రమాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: Ἕλληνι
  choice: గ్రీకువానికి
  rationale: మూలపాఠంలోని నిర్దిష్ట పదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, పౌలు వాడుకలో ఉండగల విస్తృత యూదేతర అర్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: τε ... καί
  choice: అలాగే
  rationale: మొదటి ప్రాధాన్యం తరువాత చేర్పును సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మొదట యూదునికి’ (Ἰουδαίῳ ... πρῶτον) అనే రక్షణ-చరిత్ర క్రమం
  choice: ‘మొదట’ అనే పదాన్ని వ్యాఖ్యానించకుండా ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: దీనిని కాలక్రమం, ప్రత్యేక హక్కు లేదా మిషన్ క్రమంగా స్పష్టీకరించడం
  rationale: మూలపాఠం ప్రాధాన్య స్వరూపాన్ని ఇక్కడ వివరించదు; అందువల్ల దాని వేదాంతపరమైన ఉద్వేగాన్ని అనువాదం ముందుగానే పరిష్కరించదు.
- issue: ‘యూదునికి ... గ్రీకువానికి’ లో Ἕλληνι యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘గ్రీకువానికి’; విస్తృత యూదేతర భావాన్ని పాదసూచికలో పేర్కొనడం
  alternative: ప్రధాన పాఠ్యంలో ‘యూదేతరునికి’ అని అనువదించడం
  rationale: ఇది గ్రీకు మూలపదాన్ని పారదర్శకంగా నిలుపుతుంది; అదే సమయంలో పౌలు వాడుకలో అది యూదేతరులను విస్తృతంగా సూచించగలదని పాఠకునికి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని రెండు γάρ పదాల తార్కిక సంబంధాన్ని ‘ఎందుకంటే’ మరియు వాక్య విభజన ద్వారా సహజంగా అందించాం. డ్యాష్‌లతో ‘మొదట యూదునికి, అలాగే గ్రీకువానికి’ అనే భాగాన్ని ‘ప్రతి ఒక్కరికీ’తో స్పష్టంగా అనుసంధానించాం.
