  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: te
  text: ఎందుకంటే, మిమ్మల్ని చూడాలని, మీరు బలపరచబడేలా[b] మీకు ఏదైనా ఆత్మీయ వరాన్ని అందజేయాలని[a] నేను ఎంతో ఆశపడుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏదైనా ఆత్మీయ వరాన్ని మీతో పంచుకోవాలని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మిమ్మల్ని బలపరచడానికి.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: ఎంతో ఆశపడుతున్నాను
  rationale: తీవ్రమైన వ్యక్తిగత కోరికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భంతో ఈ వాక్యానికి ఉన్న వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἰδεῖν
  choice: చూడాలని
  rationale: ‘సందర్శించాలని’ అనే భావం సందర్భంలో సూచితమైనా, మూలంలోని ‘చూడడం’ అనే సరళ అర్థాన్ని నిలుపుతుంది.
- source_word: ἵνα
  choice: పంచుకోవాలని
  rationale: తెలుగు వాక్య నిర్మాణంలో కోరికతో కూడిన ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τι
  choice: ఏదైనా
  rationale: గ్రీకు పదంలోని అనిర్దిష్టతను నిలుపుతుంది; నిర్దిష్టమైన ఒక వరాన్ని సూచించదు.
- source_word: μεταδῶ
  choice: మీతో పంచుకోవాలని
  rationale: ఒకరికి ఏదో ఇవ్వడం మాత్రమే కాక, తన వద్ద ఉన్నదానిలో వారిని భాగస్వాములను చేయడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: χάρισμα
  choice: వరం
  rationale: కృపచేత లభించే బహుమతి అనే పదకుటుంబ భావాన్ని అతిగా విస్తరించకుండా, సాధారణంగా అర్థమయ్యే ప్రామాణిక పదాన్ని వాడుతుంది.
- source_word: πνευματικὸν
  choice: ఆత్మసంబంధమైన
  rationale: ఇది పరిశుద్ధాత్మ ఇచ్చే వరమా లేక విస్తృతమైన ఆత్మీయ ప్రయోజనమా అనే మూలంలోని అర్థ విస్తృతిని ముందే సంకుచితం చేయదు.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: మిమ్మల్ని బలపరచడానికి
  rationale: ఉద్దేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మూలంలోని కర్మణి రూపాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆత్మసంబంధమైన వరం’ ఒక నిర్దిష్ట అద్భుత వరాన్నే సూచిస్తుందా, లేక విస్తృతమైన ఆత్మీయ మేలును సూచిస్తుందా?
  choice: ఏదైనా ఆత్మసంబంధమైన వరం
  alternative: పరిశుద్ధాత్మ ఇచ్చే ఏదైనా వరం; ఏదైనా కృపాపూర్వక ఆత్మీయ మేలు
  rationale: గ్రీకు పదబంధం ఒక నిర్దిష్ట రకమైన అద్భుత వరాన్ని తప్పనిసరిగా సూచించదు. అందువల్ల మూలంలోని విస్తృతిని, theological tension‌ను సంకుచితం చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన సంబోధన. భావోద్వేగ తీవ్రతను ‘ఎంతో ఆశపడుతున్నాను’ ద్వారా నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా ఉంచాం. మూలంలోని ఉద్దేశ సంబంధాన్ని అర్థవిరామంతో స్పష్టపరిచాం.
