- from: ఎందుకంటే, మిమ్మల్ని చూడాలని నేను ఎంతో ఆశపడుతున్నాను; మిమ్మల్ని బలపరచడానికి[b] ఏదైనా ఆత్మసంబంధమైన వరాన్ని మీతో పంచుకోవాలని[a] కోరుతున్నాను.
  to: ఎందుకంటే, మిమ్మల్ని చూడాలని, మీరు బలపరచబడేలా[b] మీకు ఏదైనా ఆత్మీయ వరాన్ని అందజేయాలని[a] నేను ఎంతో ఆశపడుతున్నాను.
  rationale: The revision places both infinitival ideas under Paul’s single expression of strong longing, retains the indefinite ‘ఏదైనా,’ uses idiomatic modern Telugu for ‘spiritual gift,’ and gives the passive strengthening purpose in the main text. The footnotes preserve the viable ‘share’ nuance of μεταδίδωμι and the idiomatic active Telugu alternative for the passive infinitive.
