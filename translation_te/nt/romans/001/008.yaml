id: ROM.1.8
reference: Romans 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: te
  text: మొదటగా, మీ అందరి నిమిత్తం అభిషిక్తుడైన యేసు[a] ద్వారా నా దేవునికి కృతజ్ఞతలు చెల్లిస్తున్నాను. ఎందుకంటే మీ విశ్వాసం[b] లోకమంతటా ప్రకటించబడుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, యేసు క్రీస్తు.
    reason: alternative_reading
  - marker: b
    text: లేదా, మీ విశ్వసనీయత; మీ నమ్మకం అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: మొదటగా
  rationale: పౌలు తన మాటలో మొదటి అంశాన్ని ప్రారంభిస్తున్నాడని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; μὲν అనే సంభాషణా కణానికి విడిగా పదం చేర్చలేదు.
- source_word: εὐχαριστῶ
  choice: కృతజ్ఞతలు చెల్లిస్తున్నాను
  rationale: దేవునికి కృతజ్ఞత తెలియజేయడాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; వర్తమాన క్రియారూపాన్ని నిలుపుతుంది.
- source_word: τῷ θεῷ μου
  choice: నా దేవునికి
  rationale: గ్రీకు దత్తివిభక్తినీ పౌలు వ్యక్తిగత భక్తి స్వరాన్నీ నేరుగా నిలుపుతుంది.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: అభిషిక్తుడైన యేసు ద్వారా
  rationale: διά + సంబంధ విభక్తి సూచించే మధ్యవర్తిత్వాన్ని ‘ద్వారా’తో నిలుపుతూ, Χριστός అనే బిరుదు అర్థాన్ని ‘అభిషిక్తుడు’గా అనువదిస్తుంది.
- source_word: περὶ πάντων ὑμῶν
  choice: మీ అందరి నిమిత్తం
  rationale: కృతజ్ఞత సందర్భంలో περί యొక్క భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ ‘అందరి’ అనే సమగ్రతను కాపాడుతుంది.
- source_word: ἡ πίστις ὑμῶν
  choice: మీ విశ్వాసం
  rationale: πίστιςకు సందర్భానుకూలమైన సాధారణ తెలుగు పదం; నమ్మకం లేదా విశ్వసనీయత అనే సాధ్యమైన భావ ఛాయలను పాదటిప్పణిలో ఉంచింది.
- source_word: καταγγέλλεται
  choice: ప్రకటించబడుతోంది
  rationale: వర్తమాన కర్మణి రూపాన్నీ కొనసాగుతున్న బహిరంగ ప్రకటన భావాన్నీ నిలుపుతుంది.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: లోకమంతటా
  rationale: విస్తృతమైన అలంకారిక పరిధిని సంక్షిప్తంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: διὰ Ἰησοῦ Χριστοῦలో Χριστοῦ అనువాదం
  choice: అభిషిక్తుడైన యేసు
  alternative: యేసు క్రీస్తు
  rationale: Χριστόςను కేవలం సంప్రదాయ లిప్యంతరీకరణగా కాక దాని బిరుదు అర్థంతో అనువదించింది; పాఠకులకు సుపరిచితమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
- issue: ἡ πίστις ὑμῶνలో πίστις భావం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత; నమ్మకం
  rationale: ఈ సందర్భంలో రోమా విశ్వాసుల దేవునిపై నమ్మకమే ప్రధాన భావంగా కనిపించినా, గ్రీకు పదంలోని ఇతర నిజమైన భావసాధ్యతలను పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన గ్రంథశైలిని పాటించింది. ప్రధాన వాక్యాన్ని తెలుగులో సహజంగా రెండు వాక్యాలుగా విభజించింది; కారణ సంబంధాన్ని ‘ఎందుకంటే’తో స్పష్టంగా ఉంచింది.
