id: ROM.1.27
reference: Romans 1:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: te
  text: అలాగే మగవారు[a] కూడా స్త్రీతో సహజమైన లైంగిక సంబంధాన్ని[b] విడిచిపెట్టి, ఒకరిపట్ల ఒకరు తమ కోరికతో రగిలిపోయారు[c]. మగవారు మగవారితో సిగ్గుచేటైన పని చేస్తూ[d], తమ భ్రమకు తగిన ప్రతిఫలాన్ని తమలోనే పొందారు[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పురుషులు.” గ్రీకు పదం జీవలింగాన్ని ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “స్త్రీ యొక్క సహజ వినియోగాన్ని.” ఇక్కడ సందర్భం లైంగిక సంబంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఒకరిపట్ల ఒకరు తమ కామావేశంలో మండిపోయారు.”
    reason: lexical_alternative
  - marker: d
    text: లేదా, “అవమానకరమైన కార్యం చేస్తూ.”
    reason: lexical_alternative
  - marker: e
    text: లేదా, “తమ భ్రమకు రావలసిన శిక్షను.” గ్రీకు పదానికి ‘తగిన ప్రతిఫలం’ లేదా ‘అనురూపమైన తిరుగు ఫలం’ అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: మగవారు / స్త్రీ
  rationale: గ్రీకులోని జీవలింగాన్ని సూచించే పదభేదాన్ని నిలిపి ఉంచుతూ, తెలుగులో అవమానకరంగా లేదా అసహజంగా వినిపించని రూపాలను ఎంచుకున్నాం.
- source_word: ἀφέντες
  choice: విడిచిపెట్టి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే భూతకాలిక కృదంత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: φυσικὴν χρῆσιν τῆς θηλείας
  choice: స్త్రీతో సహజమైన లైంగిక సంబంధాన్ని
  rationale: χρῆσις అనే పదానికి అక్షరార్థంగా ‘వినియోగం’ ఉన్నా, సందర్భంలోని లైంగిక భావాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేయడానికి ‘లైంగిక సంబంధం’ అని అనువదించాం; ‘స్త్రీతో’ అనేది తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: తమ కోరికలో రగిలిపోయారు
  rationale: క్రియలోని మండే దృశ్యరూపాన్ని నిలిపి, ὄρεξις‌ను దాని సందర్భానుగుణమైన ‘కోరిక’గా అనువదించాం; ‘కామావేశం’ అనే బలమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: εἰς ἀλλήλους
  choice: ఒకరిపట్ల ఒకరు
  rationale: పరస్పర దిశను సూచించే గ్రీకు ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: మగవారు మగవారితో
  rationale: గ్రీకులో ఉద్దేశపూర్వకంగా పునరుక్తమైన జీవలింగ పదాన్ని తెలుగులోనూ పునరావృతం చేసి వాక్యపు అలంకార బలాన్ని నిలిపాం.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: అవమానకరమైన కార్యం చేస్తూ
  rationale: ἀσχημοσύνηలోని నైతిక అభ్యంతర భావాన్ని ఉంచుతుంది; అయితే మూలంలో లేని ప్రత్యేక కార్యవివరణను చేర్చదు.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: తగిన ప్రతిఫలాన్ని
  rationale: ἀντιμισθία సూచించే అనురూపమైన తిరుగు ఫలాన్ని, ἔδει సూచించే తగినదనాన్ని ఒక సహజమైన తెలుగు పదబంధంలో కలిపి తెలియజేస్తుంది.
- source_word: τῆς πλάνης αὐτῶν
  choice: తమ తప్పుదారికి
  rationale: πλάνηలోని దారితప్పడం లేదా భ్రమ అనే భావాన్ని సందర్భానికి సరిపోయే సంక్షిప్తమైన రూపంలో ఉంచుతుంది.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: తమలోనే పొందారు
  rationale: ἑαυτοῖς‌లోని ప్రతిబింబార్థాన్ని నిలిపి, ఆ ప్రతిఫలం ఎలా లేదా ఏ రూపంలో పొందబడిందో మూలం కంటే ఎక్కువగా నిర్ధారించదు.
theological_decisions:
- issue: జీవలింగాన్ని సూచించే గ్రీకు పదాలను సంబంధపరమైన పదాలుగా మృదువుచేయాలా
  choice: మగవారు … స్త్రీ … మగవారు మగవారితో
  alternative: పురుషులు … స్త్రీ … పురుషులు పురుషులతో
  rationale: ἄρσενες, θηλείας సాధారణ సంబంధపరమైన ‘పురుషుడు/స్త్రీ’ జంటకన్నా జీవలింగాన్ని ముందుకు తెస్తాయి. ‘మగవారు’ ఆ ప్రత్యేకతను నిలుపుతుంది; స్త్రీకి ‘ఆడది’ అనడం ఆధునిక గౌరవప్రద వచనంలో కఠినంగా వినిపించేందున ‘స్త్రీ’ వాడాం.
- issue: ἀσχημοσύνηలోని నైతిక తీర్పును ఎంత స్పష్టంగా చెప్పాలి
  choice: అవమానకరమైన కార్యం
  alternative: సిగ్గుచేటైనది
  rationale: మూలపదంలోని నైతిక ప్రతికూలతను నిలిపాం; అయితే ‘స్వలింగ సంపర్కం’ వంటి మూలంలో లేని వర్గీకరణను చేర్చలేదు.
- issue: తగిన ప్రతిఫలం ఏదో నిర్దిష్టంగా గుర్తించాలా
  choice: తమలోనే తగిన ప్రతిఫలాన్ని పొందారు
  alternative: తమ శరీరాల్లోనే శిక్షను పొందారు
  rationale: గ్రీకు వాక్యం ప్రతిఫలపు స్వరూపాన్ని స్పష్టంగా చెప్పదు. కాబట్టి దానిని వ్యాధి, శారీరక శిక్ష లేదా మరొక నిర్దిష్ట ఫలితంగా నిర్ణయించకుండా అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన శైలిని వాడాం. మూలంలోని జీవలింగ పదాలు, మండే దృశ్యరూపం, నైతిక పదబలం నిలిచేలా చూసి, ప్రతిఫలపు ఖచ్చిత స్వరూపాన్ని అనవసరంగా నిర్ధారించలేదు. ‘సహజ వినియోగం’ అనే అక్షరానువాదం తెలుగులో వస్తువీకరణలా వినిపించగలందున ప్రధాన పాఠ్యంలో సందర్భార్థమైన ‘సహజమైన లైంగిక సంబంధం’ ఉంచి, అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
