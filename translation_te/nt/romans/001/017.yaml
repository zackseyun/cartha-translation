  terminology: “నీతి,” “న్యాయం,” “విశ్వాసం,” and “నీతిమంతుడు” are established, appropriate Telugu biblical terms. The notes preserve the disputed nuances without imposing a theological interpretation. “విశ్వాసం వల్ల” is a natural rendering of ἐκ πίστεως here and is suitably qualified by the alternative-attachment note.
