id: ROM.1.17
reference: Romans 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: te
  text: 'ఎందుకంటే, దానిలో దేవుని నీతి[a] విశ్వాసం నుండి విశ్వాసానికి[b] బయలుపరచబడుతోంది; ఇలా వ్రాయబడి ఉంది: “నీతిమంతుడు విశ్వాసం వల్ల జీవిస్తాడు.”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని న్యాయం.”
    reason: lexical_alternative
  - marker: b
    text: '“విశ్వాసం నుండి విశ్వాసానికి” అనే గ్రీకు పదబంధం అర్థం విషయంలో విభిన్న అభిప్రాయాలు ఉన్నాయి. ఇతర సాధ్యమైన అనువాదాలు: “విశ్వాసం నుండి, విశ్వాసం కొరకు,” “ఆరంభం నుండి అంతం వరకు విశ్వాసం వల్ల,” లేదా “విశ్వాసం ద్వారా, విశ్వాసం కొరకు.”'
    reason: alternative_reading
  - marker: c
    text: లేదా “విశ్వాసం వల్ల నీతిమంతుడైనవాడు జీవిస్తాడు.”
    reason: alternative_reading
  - marker: d
    text: మూలభాషలో ఉద్ధరణ “కాని నీతిమంతుడు…” అని కూడా అనువదించగల ఒక అనుసంధాన పదంతో మొదలవుతుంది.
    reason: source_transparency
lexical_decisions:
- source_word: δικαιοσύνη
  choice: నీతి
  rationale: పౌలు వాడే ఈ ముఖ్యమైన పదానికి ‘నీతి’ సహజమైన, సాంప్రదాయిక తెలుగు సమానం. ఇది నైతిక సదాచారానికి మాత్రమే పరిమితం కాకుండా దేవుని న్యాయసమ్మత స్వభావం లేదా ఆయన అనుగ్రహించే నీతి అనే భావాలకు కూడా చోటిస్తుంది; ‘న్యాయం’ను పాదసూచికలో ఉంచాం.
- source_word: θεοῦ
  choice: దేవుని
  rationale: సంబంధ విభక్తి భావాన్ని వివరణాత్మకంగా పరిష్కరించకుండా ఉంచుతుంది. కాబట్టి ఇది దేవుని స్వంత నీతినా, దేవుని నుండి వచ్చే నీతినా అన్న చర్చనీయాంశాన్ని తెరిచి ఉంచుతుంది.
- source_word: ἐν αὐτῷ
  choice: దానిలో
  rationale: గ్రీకులోని నపుంసక సర్వనామం మునుపటి వచనంలోని ‘సువార్త’ను సూచించడం అత్యంత సహజం. తెలుగులో ‘దానిలో’ ఆ అనుసంధానాన్ని కాపాడుతుంది.
- source_word: ἀποκαλύπτεται
  choice: బయలుపరచబడుతోంది
  rationale: వర్తమానకాల కర్మణి రూపాన్ని స్పష్టంగా నిలుపుతూ, తెలుగులో అర్థమయ్యే విధంగా దేవుని నీతి వెల్లడవుతోందనే భావాన్ని ఇస్తుంది.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: విశ్వాసం నుండి విశ్వాసానికి
  rationale: ἐκ…εἰς అనే రెండు విభక్తి సంబంధాలను, πίστις పదపు పునరుక్తిని సాధ్యమైనంత నేరుగా కాపాడుతుంది. దాని ఖచ్చితమైన భావాన్ని ఒకే వ్యాఖ్యానానికి కుదించదు.
- source_word: δίκαιος
  choice: నీతిమంతుడు
  rationale: ఏకవచనంలో వ్యక్తిని సూచించే విశేషణానికి ఇది సహజమైన తెలుగు రూపం; హబక్కూకు ఉద్ధరణలోని ప్రతినిధి ఏకవచనాన్ని కాపాడుతుంది.
- source_word: ἐκ πίστεως
  choice: విశ్వాసం వల్ల
  rationale: ఉద్ధరణలో జీవించడం విశ్వాసంపై ఆధారపడినదని తెలుగులో సహజంగా తెలుపుతుంది. ‘విశ్వాసం ద్వారా’ కూడా సాధ్యమే, కాని ‘వల్ల’ సంక్షిప్తంగా, సులభంగా ఉంది.
- source_word: ζήσεται
  choice: జీవిస్తాడు
  rationale: గ్రీకు భవిష్యత్ క్రియను సహజమైన తెలుగు భవిష్యత్ రూపంతో తెలియజేస్తుంది; ఉద్ధరణ శైలిలోనూ స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: δικαιοσύνη θεοῦ యొక్క భావం
  choice: దేవుని నీతి
  alternative: దేవుని నుండి వచ్చే నీతి; దేవుని న్యాయం
  rationale: గ్రీకు సంబంధ విభక్తి దేవుని స్వంత నీతిని, దేవునితో సంబంధించిన లేదా ఆయన ఇచ్చే నీతిని సూచించవచ్చు. ప్రధాన పాఠం ఈ ఉద్దేశపూర్వక అస్పష్టతను పరిష్కరించదు.
- issue: ἐκ πίστεως εἰς πίστιν యొక్క భావం
  choice: విశ్వాసం నుండి విశ్వాసానికి
  alternative: విశ్వాసం నుండి, విశ్వాసం కొరకు; ఆరంభం నుండి అంతం వరకు విశ్వాసం వల్ల; విశ్వాసం ద్వారా, విశ్వాసం కొరకు
  rationale: ఇది ప్రసిద్ధమైన క్లిష్ట పదబంధం. ఎవరికి చెందిన విశ్వాసం లేదా విశ్వసనీయత అనే విషయాన్ని, లేక ఆరంభం నుండి అంతం వరకు అనే భావాన్ని ప్రధాన పాఠంలో చేర్చకుండా, గ్రీకు ఉపసర్గలనూ పునరుక్తినీ నిలిపాం.
- issue: హబక్కూకు ఉద్ధరణలో ἐκ πίστεως దేనితో అనుసంధానమవుతుంది
  choice: నీతిమంతుడు విశ్వాసం వల్ల జీవిస్తాడు
  alternative: విశ్వాసం వల్ల నీతిమంతుడైనవాడు జీవిస్తాడు
  rationale: గ్రీకు పదక్రమం రెండు అనుసంధానాలకూ అవకాశం ఇస్తుంది. ప్రధాన పాఠంలో సహజమైన సాంప్రదాయ పఠనాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ఉద్ధరణ ప్రారంభంలోని δὲ
  choice: ప్రధాన పాఠంలో ప్రత్యేకంగా అనువదించలేదు
  alternative: కాని నీతిమంతుడు విశ్వాసం వల్ల జీవిస్తాడు
  rationale: δὲ ను ‘కాని’గా అనువదిస్తే ఇక్కడ పౌలు ఉద్దేశించని బలమైన వ్యతిరేకత వినిపించవచ్చు. ఈ ఉద్ధరణ ముందున్న వాక్యానికి ఆధారం ఇస్తోంది; అయినా మూలంలోని పదాన్ని పాదసూచికలో పారదర్శకంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. ‘నీతి,’ ‘నీతిమంతుడు,’ ‘విశ్వాసం’ వంటి స్థిరపడిన బైబిలు పదాలను నిలిపి, అసహజమైన సంస్కృతీకృత నిర్మాణాలను తగ్గించాం. వాక్యక్రమం గ్రీకు తర్కసంబంధాన్ని కాపాడుతూ తెలుగులో సహజంగా ఉండేలా అమర్చాం.
