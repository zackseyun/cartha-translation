revisions:
- from: వారిలో మీరు కూడా ఉన్నారు—యేసు మెస్సీయకు చెందిన పిలువబడినవారు[a].
  to: యేసు మెస్సీయకు చెందినవారిగా పిలువబడిన మీరు కూడా వారిలో ఉన్నారు[a].
  rationale: 'The revision corrects an awkward Telugu construction while preserving every element of the Greek: inclusion among the previously mentioned peoples, emphatic ‘you also,’ the designation ‘called,’ and the deliberately compact relation to Jesus the Messiah. The footnote preserves the viable agentive reading without treating it as certain.'
  reviewer_model: gpt-5.6-terra
