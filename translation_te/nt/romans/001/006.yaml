translation:
  language: te
  text: యేసు మెస్సీయకు చెందినవారిగా పిలువబడిన మీరు కూడా వారిలో ఉన్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు మెస్సీయ చేత పిలువబడినవారు.” అక్షరార్థంగా, “యేసు మెస్సీయకు చెందిన పిలువబడినవారు.”
    reason: κλητοὶ Ἰησοῦ Χριστοῦలోని షష్ఠీ సంబంధం చెందుదల లేదా సంబంధాన్ని సూచించవచ్చు; కర్తృత్వార్థం కూడా సాధ్యం.
lexical_decisions:
- source_word: ἐν οἷς
  choice: వారిలో
  rationale: ఈ బహువచన సంబంధసర్వనామం ముందటి వచనంలో ప్రస్తావించిన అన్యజనులను సూచిస్తుంది; వారితో కూడిన సమూహంలో రోమా విశ్వాసులు ఉన్నారని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐστε
  choice: మీరు ... ఉన్నారు
  rationale: εἰμί యొక్క వర్తమాన సూచనార్థక రూపాన్ని తెలుగులో స్పష్టంగా నిలిపింది.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: రోమా విశ్వాసులు సైతం ముందుగా చెప్పిన అన్యజనులలో భాగమనే ఉద్ఘాటనను సహజమైన పదక్రమంలో నిలిపింది.
- source_word: κλητοὶ
  choice: పిలువబడినవారు
  rationale: κλητός లోని పిలుపు భావాన్ని నామవాచక విశేషణంగా నిలుపుతూ, ‘ఆహ్వానించబడినవారు’ లేదా ‘రప్పించబడినవారు’ వంటి సందర్భాన్ని సంకుచితం చేసే పదాలను నివారించింది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Ἰησοῦను వ్యక్తినామంగా, Χριστοῦను బిరుదైన ‘మెస్సీయ’గా అనువదించింది.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయకు చెందిన పిలువబడినవారు
  rationale: గ్రీకులోని సంక్షిప్త షష్ఠీ సంబంధాన్ని సహజమైన తెలుగులో సంబంధం లేదా చెందుదలగా వ్యక్తం చేసింది; కర్తృత్వార్థం సాధ్యమనే విషయాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: κλητοὶ Ἰησοῦ Χριστοῦలోని షష్ఠీ విభక్తి సంబంధం
  choice: యేసు మెస్సీయకు చెందిన పిలువబడినవారు
  alternative: యేసు మెస్సీయ చేత పిలువబడినవారు; యేసు మెస్సీయ యొక్క పిలువబడినవారు
  rationale: ఈ పదబంధం యేసు మెస్సీయతో వారి సంబంధం లేదా ఆయనకు చెందడాన్ని సూచించగలదు; అయితే ఆయన పిలిచినవారు అనే కర్తృత్వార్థాన్ని గ్రీకు నిర్మాణం పూర్తిగా నిరాకరించదు. అందుచేత ప్రధాన పాఠ్యంలో చెందుదల భావాన్ని, పాదసూచికలో ఇతర సాధ్యార్థాలను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని సంక్షిప్త నామవాచక నిర్మాణాన్ని దీర్ఘంగా వివరణాత్మకం చేయకుండా డాష్‌తో నిలిపి, అసలు భావంలోని ఉద్వేగాన్నీ అస్పష్టతనూ పాదసూచికతో కాపాడింది.
