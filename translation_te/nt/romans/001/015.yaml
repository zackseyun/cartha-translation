  naturalness: The revised wording is fluent modern standard Telugu. Placing commas around నా వంతుగా improves readability, and the infinitive construction with ప్రకటించడానికి ... సిద్ధంగా ఉన్నాను is idiomatic.
  terminology: సువార్త and ప్రకటించడానికి are appropriate, established, and suitably broad renderings for εὐαγγελίσασθαι. The footnote’s alternative is retained with grammar adjusted to the revised construction.
