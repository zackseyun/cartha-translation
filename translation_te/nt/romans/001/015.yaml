source:
  edition: SBLGNT
  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: te
  text: కాబట్టి, నా వంతుగా, రోములో ఉన్న మీకు కూడా సువార్త ప్రకటించడానికి నేను సిద్ధంగా ఉన్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సువార్త ప్రకటించడానికి” అనే మాటను “సువార్త బోధించడానికి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: కాబట్టి
  rationale: మునుపటి వివరణనుంచి పౌలు తన ఉద్దేశాన్ని తెలిపే ముగింపు లేదా అనుమానార్థక అనుసంధానంగా ఇది పనిచేస్తుంది; ఆధునిక తెలుగులో “కాబట్టి” సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: నా వంతుగా ... నేను ఆసక్తిగా ఉన్నాను
  rationale: గ్రీకు పదబంధం అధ్యాహారంతో కూడిన నుడికారం. “నా వంతుగా” అనేది κατ’ ἐμέ భావాన్ని, “ఆసక్తిగా ఉన్నాను” అనేది πρόθυμονలోని సంసిద్ధతతో కూడిన ఉత్సాహాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: καὶ ὑμῖν
  choice: మీకు కూడా
  rationale: καί ఇక్కడ రోములోని వారిని ఇతర ప్రాంతాల వారితో కలిపి చూపిస్తుంది. “మీకు కూడా” అనే పదక్రమం ఆ చేర్పును స్పష్టంగా ఉంచుతుంది.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: రోములో ఉన్న మీకు
  rationale: ఉపపదంతో కూడిన ఈ పదబంధం స్వీకర్తలను రోములో ఉన్నవారిగా గుర్తిస్తుంది; తెలుగులో ఇది సహజమైన, స్పష్టమైన నిర్మాణం.
- source_word: εὐαγγελίσασθαι
  choice: సువార్త ప్రకటించాలని
  rationale: ఈ క్రియ శుభవార్తను లేదా సువార్తను తెలియజేయడం అనే విస్తృత భావాన్ని కలిగి ఉంది. “ప్రకటించడం” దానిని కేవలం అధికారిక ప్రసంగానికి పరిమితం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకులోని అధ్యాహార పదబంధాన్ని తెలుగులో సహజమైన వ్యక్తిగత ఉద్దేశ ప్రకటనగా విప్పి చెప్పింది; “కూడా”ను స్వీకర్తలైన “మీకు”తో ఉంచింది.
