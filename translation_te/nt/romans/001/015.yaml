    issue: ఆసక్తిగా ఉన్నాను weakens πρόθυμον.
    rationale: ఆసక్తి can mean mere interest or curiosity. In this context πρόθυμον denotes Paul’s readiness and willing zeal to proclaim the good news; సిద్ధంగా ఉన్నాను communicates that core sense more precisely.
  revised_text: కాబట్టి, నా వంతుగా, రోములో ఉన్న మీకు కూడా సువార్త ప్రకటించడానికి నేను సిద్ధంగా ఉన్నాను.[a]
