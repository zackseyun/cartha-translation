- from: ఎందుకంటే, లోకం సృష్టించబడినప్పటి నుంచి ఆయనకు కనిపించని లక్షణాలు[a]—అంటే, ఆయన నిత్య శక్తి, దైవికత[b]—సృష్టించబడిన వాటి ద్వారా మనసుకు గ్రహింపబడి స్పష్టంగా కనిపిస్తున్నాయి. కాబట్టి వారికి సాకు చెప్పడానికి వీలులేదు.
