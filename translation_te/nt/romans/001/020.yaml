id: ROM.1.20
reference: Romans 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: te
  text: ఎందుకంటే, లోకం సృష్టించబడినప్పటి నుంచి ఆయన అదృశ్య లక్షణాలు[a]—అంటే, ఆయన నిత్య శక్తి, దైవికత[b]—సృష్టించబడిన వాటి ద్వారా మనసుతో గ్రహించబడుతూ స్పష్టంగా కనిపిస్తున్నాయి. అందువల్ల వారు సమర్థనలేనివారిగా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన అదృశ్య గుణాలు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దైవ స్వభావం.” ఇక్కడి గ్రీకు పదం θειότης; ఇది మరింత బలమైన θεότης అనే పదం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: ఆయనకు కనిపించని లక్షణాలు
  rationale: దేవుని గురించిన కంటికి కనిపించని వాస్తవాలను సూచించే నపుంసక బహువచనాన్ని సహజమైన ఆధునిక తెలుగులో ‘లక్షణాలు’గా వ్యక్తం చేసింది.
- source_word: ἀπὸ κτίσεως κόσμου
  choice: లోకం సృష్టించబడినప్పటి నుంచి
  rationale: ἀπό యొక్క కాలారంభ భావాన్ని ‘నుంచి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοῖς ποιήμασιν
  choice: సృష్టించబడిన వాటి ద్వారా
  rationale: దత్తివిభక్తిలోని సాధనార్థాన్ని ‘ద్వారా’తో నిలుపుతూ, తయారైన లేదా సృష్టించబడిన వాటిని సూచించే భావాన్ని కాపాడుతుంది.
- source_word: νοούμενα
  choice: మనసుకు గ్రహింపబడి
  rationale: కేవలం కంటితో చూడటం కాక, సృష్టిని పరిశీలించి మనస్సుతో అవగాహన చేసుకోవడమనే జ్ఞాన సంబంధ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: καθορᾶται
  choice: స్పష్టంగా కనిపిస్తున్నాయి
  rationale: క్రియలోని బలమైన ‘స్పష్టంగా చూడబడటం’ అనే భావాన్నీ, వర్తమానంలో కొనసాగుతున్న స్థితినీ నిలుపుతుంది.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: ఆయన నిత్య శక్తి
  rationale: ἀΐδιος యొక్క కాలాతీతంగా నిలిచే భావానికి ‘నిత్య’ సహజమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: θειότης
  choice: దైవికత
  rationale: దైవ సంబంధ గుణం లేదా స్వభావాన్ని సూచిస్తూ, θεότης అనే మరింత బలమైన పదంతో ఉండే భావభేదాన్ని వీలైనంతవరకు కాపాడుతుంది.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: కాబట్టి వారికి సాకు చెప్పడానికి వీలులేదు
  rationale: నిర్మాణంలోని ఫలిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, వారు సమర్థించుకోలేని స్థితిని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: θειότης పదాన్ని అతిశయింపకుండా అనువదించడం
  choice: దైవికత
  alternative: దైవత్వం; దైవ స్వభావం
  rationale: ఈ పదం దేవుని గురించి నిజమైన దైవ సంబంధ వాస్తవాన్ని సూచిస్తుంది; అయితే θεότηςతో ఉండే పదభేదాన్ని చెరపకుండా గుణాత్మక భావాన్ని ముందుంచేందుకు ‘దైవికత’ను ఎంచుకున్నాం.
- issue: εἰς τὸ నిర్మాణంలోని ఉద్దేశం లేదా ఫలితం
  choice: ఫలితంగా ‘కాబట్టి వారికి సాకు చెప్పడానికి వీలులేదు’
  alternative: ‘వారు సాకు చెప్పలేనివారిగా ఉండేలా’ అనే ఉద్దేశార్థ పఠనం
  rationale: సందర్భంలో సృష్టి ద్వారా కలిగిన అవగాహనకు ఏర్పడే పరిణామాన్ని ప్రధానంగా వ్యక్తం చేస్తుంది; గ్రీకు నిర్మాణంలో ఉండగల ఉద్దేశ ఛాయను సిద్ధాంతపరంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని కారణం, వివరణాత్మక సమానాధికార భాగం, మానసిక గ్రహింపు, ఫలితం అన్న క్రమాన్ని నిలుపుతూ, తెలుగులో భారంగా అనిపించకుండా విరామచిహ్నాలు ఉపయోగించబడ్డాయి.
