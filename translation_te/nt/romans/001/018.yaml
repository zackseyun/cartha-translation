revisions:
- from: ఎందుకంటే, అనీతిలో సత్యాన్ని అణచివేసే[a] మనుషుల[b] సమస్త భక్తిహీనత మీదా అనీతి మీదా దేవుని ఉగ్రత పరలోకం నుండి బయలుపరచబడుతోంది.[c][d]
  to: ఎందుకంటే, అనీతిలో సత్యాన్ని అణచివేసే[a] మనుషుల[b] సమస్త భక్తిహీనతకూ అనీతికీ వ్యతిరేకంగా దేవుని కోపం పరలోకం నుండి వెల్లడి అవుతోంది.[c][d]
  rationale: The revision corrects the key theological-lexical term ὀργή from “ఉగ్రత” to “కోపం,” improves the natural Telugu coordination of the two objects governed by ἐπί, and uses a more idiomatic present-passive rendering for ἀποκαλύπτεται. It preserves the Greek repetition of ἀδικία and leaves the syntactic ambiguity of ἐν ἀδικίᾳ intact, noting the instrumental alternative in the footnote. All footnote markers remain present and anchored to their relevant expressions.
  reviewer_model: gpt-5.6-terra
