id: ROM.1.18
reference: Romans 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: te
  text: ఎందుకంటే, అనీతిలో సత్యాన్ని అణచివేసే[a] మనుషుల[b] సమస్త భక్తిహీనతకూ అనీతికీ వ్యతిరేకంగా దేవుని కోపం పరలోకం నుండి వెల్లడి అవుతోంది.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అణచివేసే” అనే మాటను ఈ సందర్భంలో “కింద నొక్కిపెట్టే” లేదా “నిరోధించే” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం పురుషులను మాత్రమే కాక, సాధారణంగా మానవులను సూచిస్తుంది.
    reason: lexical_clarification
  - marker: c
    text: లేదా “వెల్లడి అవుతుంది.”
    reason: lexical_alternative
  - marker: d
    text: “అనీతిలో” అనే మాటను “అనీతి ద్వారా” అని కూడా అనువదించవచ్చు.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: బయలుపరచబడుతోంది
  rationale: వర్తమానకాల కర్మణి రూపాన్ని నిలుపుతూ, దేవుని ఉగ్రత ప్రస్తుతం వెల్లడవుతున్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యానికి కారణం లేదా వివరణను అందించే పౌలు తార్కిక అనుసంధానాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ὀργὴ θεοῦ
  choice: దేవుని ఉగ్రత
  rationale: ఇది దేవుని స్వీయ న్యాయపూర్వక ప్రతిస్పందనను సూచిస్తుంది; దాన్ని కేవలం సహజ పరిణామంగా మృదుపరచదు.
- source_word: ἀπ’ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: వెల్లడి యొక్క పరలోక మూలాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: πᾶσαν ἀσέβειαν
  choice: సమస్త భక్తిహీనత
  rationale: దేవునిపట్ల గౌరవం, భక్తి లేకపోవడమనే ἀσέβεια యొక్క దిశను నిలుపుతుంది.
- source_word: ἀδικίαν
  choice: అనీతి
  rationale: నైతిక తప్పు, న్యాయవిరుద్ధత అనే విస్తృత భావాలను కలిగి ఉండి, పౌలు వాడుకకు తగిన పదం.
- source_word: ἀνθρώπων
  choice: మనుషుల
  rationale: ఇక్కడ పురుషులను మాత్రమే కాక సాధారణంగా మానవులను సూచించే గ్రీకు పదానికి లింగపరంగా సమగ్రంగా సరిపోతుంది.
- source_word: τῶν ... κατεχόντων
  choice: అణచివేసే
  rationale: ఈ సందర్భంలో సత్యాన్ని కేవలం పట్టుకొని ఉండడం కాక, అది ప్రభావం చూపకుండా నిరోధించడం అనే భావాన్ని తెలుపుతుంది.
- source_word: τὴν ἀλήθειαν
  choice: సత్యాన్ని
  rationale: గ్రీకు నిర్దిష్ట పదబంధానికి సూటి, సహజ సమానం.
- source_word: ἐν ἀδικίᾳ
  choice: అనీతిలో
  rationale: గ్రీకు ἐν లోని పరిధి లేదా స్థితి భావాన్ని నిలుపుతూ, సాధనం అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: ὀργὴ θεοῦ వ్యక్తిగతమైన దేవుని న్యాయతీర్పు ఉగ్రతనా, లేక వ్యక్తిరహిత నైతిక పరిణామమా?
  choice: దేవుని ఉగ్రత
  alternative: అనీతి వల్ల కలిగే వ్యక్తిరహిత పరిణామం
  rationale: గ్రీకు షష్ఠీ నిర్మాణం మరియు పౌలు వాదన దేవుని స్వీయ న్యాయపూర్వక ప్రతిస్పందనను సూచిస్తాయి; అనువాదం దానిని మృదుపరచకుండా, అదనపు సిద్ధాంత వివరణను కూడా చేర్చదు.
- issue: ἐν ἀδικίᾳ అనేది పరిధి/స్థితిని సూచిస్తుందా, లేక సాధనాన్ని సూచిస్తుందా?
  choice: అనీతిలో
  alternative: అనీతి ద్వారా
  rationale: రెండు అర్థాలూ వ్యాకరణపరంగా సాధ్యమే. ప్రధాన పాఠంలో మరింత రూపసామ్యమైన, ఉద్దేశపూర్వకంగా కొంత అస్పష్టతను నిలిపే పఠనాన్ని ఉంచి, సాధనార్థాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర శైలి. “భక్తిహీనత,” “అనీతి,” “ఉగ్రత” వంటి పదాలు వాక్యంలోని నైతిక-న్యాయపరమైన బరువును నిలుపుతాయి. గ్రీకు వాక్యంలోని ἀδικία పదపునరుక్తిని ఉద్దేశపూర్వకంగా “అనీతి” అని రెండుసార్లు నిలిపాం.
