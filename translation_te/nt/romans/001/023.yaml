source:
  edition: SBLGNT
  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: te
  text: అవినాశి దేవుని మహిమను నశ్వరమైన మనిషి, పక్షులు, నాలుగు కాళ్ల జంతువులు, నేలపై పాకే జీవుల ప్రతిమ పోలికగా మార్చుకున్నారు[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అక్షయుడైన దేవుని మహిమను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో అక్షరార్థంగా, “నశ్వరమైన మనిషి... ప్రతిమ యొక్క పోలికగా.”
    reason: lexical_alternative
  - marker: c
    text: “నేలపై ప్రాకే జీవులు” లేదా సందర్భానుసారం “సరీసృపాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: మార్చుకున్నారు
  rationale: సందర్భంలో ఒకదాని స్థానంలో మరొకదాన్ని ఉద్దేశపూర్వకంగా స్వీకరించడాన్ని తెలుపుతుంది; తెలుగు వాక్యంలో సహజంగా ఉంది.
- source_word: δόξαν
  choice: మహిమను
  rationale: దేవుని ఘనత, వైభవం అనే భావాన్ని మోసే స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: ἀφθάρτου
  choice: అవినాశియైన
  rationale: క్షయానికి లేదా నాశనానికి లోబడని స్వభావాన్ని తెలియజేస్తూ φθαρτοῦతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: ప్రతిమ పోలికతో
  rationale: మూలంలోని ‘పోలిక’ మరియు ‘ప్రతిమ’ అనే రెండంచెల చిత్రభాషను సంక్షిప్తం చేయకుండా సాధ్యమైనంత సహజంగా నిలుపుతుంది.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: నాశనమయ్యే మనిషి
  rationale: ἀφθάρτουకు ఎదురుగా ఉన్న నశ్వరత్వపు వ్యత్యాసాన్ని స్పష్టంగా ఉంచి, ఏకవచన ἀνθρώπουను అనుసరిస్తుంది.
- source_word: πετεινῶν
  choice: పక్షులు
  rationale: స్పష్టమైన, సాధారణ ఆధునిక తెలుగు సమానార్థకం.
- source_word: τετραπόδων
  choice: నాలుగు కాళ్ల జంతువులు
  rationale: పదం యొక్క అక్షరార్థాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: ἑρπετῶν
  choice: నేలపై పాకే జీవులు
  rationale: ఆధునిక జంతుశాస్త్రంలోని ‘సరీసృపాలు’ కంటే గ్రీకు పదంలోని విస్తృతమైన పాకే జీవుల భావాన్ని మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: ἀφθάρτου మరియు φθαρτοῦ మధ్య వ్యత్యాసం
  choice: అవినాశియైన / నాశనమయ్యే
  alternative: అక్షయుడైన / నశ్వరమైన
  rationale: దేవుని క్షయరహిత స్వభావానికీ సృష్టిజీవుల నశ్వరత్వానికీ మధ్య పౌలు ఉంచిన ఉద్రిక్త వ్యత్యాసాన్ని ఒకే పదకుటుంబానికి దగ్గరైన భాషతో స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ఏకవచన ప్రతిమ నిర్మాణం మరియు అవినాశి–నాశనమయ్యే వ్యత్యాసం నిలుపబడ్డాయి.
