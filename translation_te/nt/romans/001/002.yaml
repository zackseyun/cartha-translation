  text: which he promised beforehand through his prophets in the holy Scriptures,[a]
translation:
  language: te
  text: దానిని ఆయన తన ప్రవక్తల ద్వారా పవిత్ర లేఖనాల్లో ముందుగానే వాగ్దానం చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్ర రచనల్లో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: దానిని
  rationale: ఈ నపుంసక ఏకవచన సంబంధ సర్వనామం రోమా 1:1లోని ‘సువార్త’ను తిరిగి సూచిస్తుంది; తెలుగులో ముందటి వాక్యంతో సహజంగా అనుసంధానించడానికి ‘దానిని’ ఉపయోగించబడింది.
- source_word: προεπηγγείλατο
  choice: ముందుగానే వాగ్దానం చేశాడు
  rationale: క్రియలోని ముందస్తు కాలభావాన్నీ, వాగ్దాన స్వభావాన్నీ రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: διὰ τῶν προφητῶν αὐτοῦ
  choice: తన ప్రవక్తల ద్వారా
  rationale: διά + షష్ఠీ విభక్తి మధ్యవర్తిత్వాన్ని తెలియజేస్తుంది; αὐτοῦ దేవునికి చెందిన ప్రవక్తలని సూచిస్తుంది. తెలుగు ప్రతిబింబ సర్వనామం ‘తన’ కర్తతో సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: ἐν γραφαῖς ἁγίαις
  choice: పవిత్ర లేఖనాల్లో
  rationale: ἐν యొక్క స్థానార్థాన్ని నిలుపుతూ, పౌలు సందర్భంలో γραφαί సాధారణ రచనలకంటే గుర్తింపుపొందిన పవిత్ర లేఖనాలను సూచిస్తుందని తెలియజేస్తుంది.
theological_decisions:
- issue: γραφαῖς ἁγίαιςను ‘పవిత్ర లేఖనాలు’గా లేదా ‘పవిత్ర రచనలు’గా అనువదించడం
  choice: పవిత్ర లేఖనాల్లో
  alternative: పవిత్ర రచనల్లో
  rationale: పౌలు వాడుకలో γραφαί సాధారణ సాహిత్య రచనలను కాక, అధికారికంగా గుర్తింపుపొందిన ధర్మలేఖనాలను సాధారణంగా సూచిస్తుంది. అయితే పదబంధానికి మరింత సాధారణమైన ‘పవిత్ర రచనలు’ అనే భావసాధ్యతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ఇది 1:1లోని ‘సువార్త’తో కొనసాగుతున్న ఉపవాక్యం; ఇచ్చిన వచన భాగం పరిమితిలో తెలుగు సంపూర్ణ వాక్యంలా చదవడానికి కర్తను స్పష్టంగా ఉంచాం.
