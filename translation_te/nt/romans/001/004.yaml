    issue: Footnote b is anchored at the sentence end rather than at ‘పరిశుద్ధత యొక్క ఆత్మ ప్రకారం.’
    rationale: The note concerns that particular phrase; a direct anchor makes the reference unambiguous.
  - severity: low
    issue: 'The final alternative in footnote a is elliptical: ‘నిర్దేశించబడిన’ has no stated complement.'
    rationale: Restating ‘శక్తితో దేవుని కుమారునిగా’ makes the lexical alternative complete and clear without altering the verse’s meaning.
