id: ROM.1.4
reference: Romans 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: te
  text: మృతులలోనుండి పునరుత్థానం ద్వారా, పరిశుద్ధత యొక్క ఆత్మ ప్రకారం[b], శక్తితో దేవుని కుమారుడని ప్రకటించబడిన[a] మన ప్రభువైన యేసు మెస్సీయ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శక్తితో దేవుని కుమారునిగా నియమించబడిన’ లేదా ‘శక్తితో దేవుని కుమారునిగా నిర్దేశించబడిన.’
    reason: lexical_alternative
  - marker: b
    text: ‘పరిశుద్ధత యొక్క ఆత్మ ప్రకారం’ అనే మాటకు ‘పరిశుద్ధాత్మ ప్రకారం’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: ప్రకటించబడిన
  rationale: ὁρίζω ఇక్కడ నిర్ణయించడం, నియమించడం, నిర్దేశించడం లేదా ప్రకటించడం అనే భావాలను కలిగి ఉండవచ్చు. యేసు పునరుత్థానం వరకు దేవుని కుమారుడు కాదనే భావం అనవసరంగా కలగకుండా, ఆయన కుమారత్వం శక్తితో వెల్లడైందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఇతర ప్రధాన సాధ్యార్థాలు పాదటిప్పణిలో ఉంచబడ్డాయి.
- source_word: υἱοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: క్రీస్తు సంబంధమైన ఈ బిరుదును నేరుగా, సుపరిచితంగా నిలుపుతుంది.
- source_word: ἐν δυνάμει
  choice: శక్తితో
  rationale: ‘శక్తిలో’ అనే అక్షరార్థ రూపం తెలుగులో అసహజంగా ఉండవచ్చు. ‘శక్తితో’ కుమారునిగా ఆయన శక్తిమంతమైన ప్రత్యక్షతను తెలియజేస్తూ గ్రీకు పదబంధానికి దగ్గరగా ఉంటుంది.
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: పరిశుద్ధత యొక్క ఆత్మ ప్రకారం
  rationale: అసాధారణమైన గ్రీకు పదబంధాన్ని ఉద్దేశపూర్వకంగా పారదర్శకంగా ఉంచి, ఇది నేరుగా పరిశుద్ధాత్మను సూచిస్తుందా లేక శరీరానికి భిన్నమైన పరిశుద్ధ ఆత్మిక స్థితిని సూచిస్తుందా అన్నది ముందుగానే తేల్చదు.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: మృతులలోనుండి పునరుత్థానం ద్వారా
  rationale: ἐξ సూచించే ఆధారం లేదా సందర్భాన్ని ‘ద్వారా’ తెలియజేస్తుంది; νεκρῶν యొక్క బహువచన భావాన్ని ‘మృతులలోనుండి’ సహజంగా అందిస్తుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστόςను పేరు మాత్రంగా కాక బిరుదుగా గ్రహించి ‘మెస్సీయ’గా అనువదిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘మన ప్రభువైన’తో కలిసి సహజంగా ఉంటుంది.
- source_word: κυρίου ἡμῶν
  choice: మన ప్రభువు
  rationale: κύριος యొక్క క్రీస్తు సంబంధమైన అధికారాన్నీ, పౌలు వాడుకలోని గంభీరతనూ నిలుపుతుంది.
theological_decisions:
- issue: ὁρισθέντος వల్ల యేసు పునరుత్థాన సమయంలోనే మొదటిసారిగా దేవుని కుమారుడయ్యాడనే అర్థం వస్తుందా?
  choice: ‘శక్తితో దేవుని కుమారుడని ప్రకటించబడిన’ అని అనువదించి, కుమారత్వం శక్తితో వెల్లడైనదనే భావానికి చోటిచ్చాం.
  alternative: ‘శక్తితో దేవుని కుమారునిగా నియమించబడిన’ లేదా ‘నిర్దేశించబడిన’.
  rationale: గ్రీకు పదం నియామకం లేదా నిర్దేశం అనే భావాన్ని మోయగలిగినా, వచనం యేసు కుమారత్వం అప్పుడే మొదలైందని స్పష్టంగా చెప్పదు. అనువాదం ఆ వేదాంత ఉద్రిక్తతను అతిగా పరిష్కరించకుండా ఉంచుతుంది.
- issue: πνεῦμα ἁγιωσύνης ప్రత్యేకంగా పరిశుద్ధాత్మనే సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘పరిశుద్ధత యొక్క ఆత్మ’ అనే పారదర్శక రూపాన్ని ఉంచాం.
  alternative: ‘పరిశుద్ధాత్మ ప్రకారం’ లేదా ‘ఆయన పరిశుద్ధ ఆత్మ ప్రకారం’.
  rationale: ఈ గ్రీకు పదబంధం అసాధారణమైనది; 3వ వచనంలోని ‘శరీరం ప్రకారం’ అనే పదబంధానికి సమాంతరంగా కూడా ఉండవచ్చు. అందువల్ల నిర్దిష్ట సూచనను అనువాదంలో బలవంతంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. ఈ వచనం 3వ వచనం నుంచి కొనసాగే వాక్యభాగం కాబట్టి, మూలంలోని సంబంధాన్ని నిలుపుతూ ‘మన ప్రభువైన యేసు మెస్సీయ’తో ముగించాం. అసాధారణమైన ‘పరిశుద్ధత యొక్క ఆత్మ’ పదబంధాన్ని వ్యాఖ్యానాత్మకంగా సులభీకరించలేదు.
