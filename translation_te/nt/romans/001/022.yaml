lexical_decisions:
- source_word: φάσκοντες
  choice: చెప్పుకుంటూ
  rationale: వర్తమాన కృదంతం వారి స్వీయవాదాన్ని సూచిస్తుంది. ‘చెప్పుకుంటూ’ ఆధునిక తెలుగులో సహజంగా ఉండి, వ్యంగ్యభావాన్ని అదనపు అర్థం చేర్చకుండా నిలుపుతుంది.
- source_word: εἶναι
  choice: అని
  rationale: తెలుగులో φάσκοντες‌కు విషయపూరకమైన ‘జ్ఞానులము’ అనే వాదాన్ని సహజమైన ఉద్ధరణ నిర్మాణంతో కలుపుతుంది.
- source_word: σοφοὶ
  choice: జ్ఞానులు
  rationale: విశేషణార్థాన్ని వ్యక్తులను సూచించే సహజ తెలుగు నామరూపంలో సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἐμωράνθησαν
  choice: బుద్ధిహీనులయ్యారు
  rationale: ఈ రూపంలోని ఫలితాత్మక/స్థితిమార్పు భావాన్ని ‘అయ్యారు’ నిలుపుతుంది; ‘జ్ఞానులు—బుద్ధిహీనులు’ అనే పదునైన వ్యక్తివాచక వ్యతిరేకతను కూడా కాపాడుతుంది.
theological_decisions:
- issue: ἐμωράνθησαν‌ను ఒక గుణంగా ‘బుద్ధిహీనంగా మారారు’ అని అనువదించాలా, లేక వ్యక్తులను బలంగా వర్ణిస్తూ ‘బుద్ధిహీనులయ్యారు’ అని అనువదించాలా
  choice: బుద్ధిహీనులయ్యారు
  alternative: బుద్ధిహీనంగా మారారు; బుద్ధిహీనులుగా చేయబడ్డారు
  rationale: 'పౌలు వాడిన వ్యతిరేకత పదునైనది: తాము జ్ఞానులమని చెప్పుకున్నవారే బుద్ధిహీనులయ్యారు. ఈ పఠనం గ్రీకు వాక్యంలోని బలాన్ని నిలుపుతూ, దైవకర్తృత్వాన్ని అనవసరంగా స్పష్టీకరించదు.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. మూలంలోని సంక్షిప్తత, వ్యంగ్యం, ‘జ్ఞానులు—బుద్ధిహీనులు’ అనే వ్యతిరేకత నిలుపబడ్డాయి.
