id: ROM.1.32
reference: Romans 1:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: te
  text: ఇలాంటివాటిని ఆచరించేవారు మరణానికి పాత్రులని తెలిపే దేవుని న్యాయవిధి[a] వారికి తెలిసినా, వారు వాటిని చేయడమే కాక, వాటిని ఆచరించేవారిని కూడా సమర్థిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయమైన తీర్పు,’ ‘నియమం,’ లేదా ‘ఆజ్ఞ.’
    reason: δικαίωμα అనే పదానికి ఈ సందర్భంలో సాధ్యమైన న్యాయపరమైన, నైతికమైన భావ ప్రత్యామ్నాయాలను చూపించడానికి.
lexical_decisions:
- source_word: οἵτινες
  choice: వారు
  rationale: ముందటి సందర్భంలో పేర్కొన్న ప్రజలను గురించి సాపేక్ష వివరణను కొనసాగిస్తుంది; తెలుగులో వాక్యప్రవాహానికి ‘వారు’ సహజంగా ఉంటుంది.
- source_word: δικαίωμα
  choice: న్యాయవిధి
  rationale: దేవుని న్యాయమైన నైతిక-న్యాయ నిర్ణయాన్ని సూచిస్తుంది. వెంట వచ్చే మరణానికి పాత్రులనే వాక్యం దాని న్యాయపరమైన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐπιγνόντες
  choice: వారికి తెలిసినా
  rationale: తెలిసినప్పటికీ విరుద్ధంగా ప్రవర్తిస్తున్నారనే concessive భావాన్ని సందర్భానుసారంగా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: ఇలాంటివాటిని ఆచరించేవారు
  rationale: πράσσω సూచించే అలవాటైన లేదా కొనసాగుతున్న ప్రవర్తనను ‘ఆచరించేవారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄξιοι θανάτου
  choice: మరణానికి పాత్రులు
  rationale: గ్రీకు పదబంధంలోని న్యాయతీర్పు భావాన్ని నేరుగా ఉంచుతుంది; మరణం యొక్క పరిధిని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ποιοῦσιν
  choice: వాటిని చేయడం
  rationale: ముందటి ‘ఆచరించేవారు’తో సహజమైన పదభేదాన్ని ఉంచుతూ క్రియను నిష్కపటంగా అనువదిస్తుంది.
- source_word: συνευδοκοῦσιν
  choice: సమర్థిస్తారు
  rationale: కేవలం అంగీకరించడం కంటే, ఇతరుల చర్యలకు ఆమోదం లేదా మద్దతు ఇవ్వడమనే బలమైన భావాన్ని తెలియజేస్తుంది.
- source_word: τοῖς πράσσουσιν
  choice: వాటిని ఆచరించేవారిని
  rationale: ముందటి πράσσω రూపంతో సమాంతరతను, కొనసాగుతున్న ప్రవర్తన భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘మరణానికి పాత్రులు’ అనే మాట యొక్క అర్థం
  choice: దైవిక న్యాయతీర్పును తెలియజేసే మాటగా అనువదించి, మరణం యొక్క పూర్తి పరిధిని నిర్దిష్టం చేయలేదు.
  alternative: దీనిని కేవలం పౌర మరణశిక్షగా లేదా ప్రత్యేకంగా అంత్యకాల మరణంగా వివరించడం.
  rationale: ఈ వచనం అలాంటి వారు మరణానికి పాత్రులని చెబుతుంది గాని, ఆ మరణం యొక్క పూర్తి స్వరూపం లేదా పరిధిని ఇక్కడ నిర్వచించదు. కాబట్టి మూలంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని న్యాయతీర్పు భావాన్ని నిలిపి, ‘మరణం’ గురించి వచనం చెప్పనిదాన్ని జోడించలేదు.
