id: ROM.1.9
reference: Romans 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: te
  text: ఎందుకంటే, నేను మిమ్మల్ని ఎడతెగకుండా ప్రస్తావిస్తున్నానని, ఆయన కుమారుని సువార్తలో నా ఆత్మతో నేను సేవిస్తున్న దేవుడే నాకు సాక్షి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς
  choice: సాక్షి
  rationale: పౌలు తన మాట నిజమని దేవునికి విజ్ఞప్తి చేస్తున్న సందర్భంలో, సాక్ష్యమిచ్చే వ్యక్తి అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: λατρεύω
  choice: సేవిస్తున్న
  rationale: ఈ క్రియ దేవునికి అంకితమైన ఆరాధనాత్మక సేవను సూచిస్తుంది; ‘సేవిస్తున్న’ అనే పదం మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ πνεύματί μου
  choice: నా ఆత్మతో
  rationale: ἐν ఇక్కడ సాధనం లేదా విధానాన్ని సూచించవచ్చు; ‘నా ఆత్మతో’ అనేది పౌలు చేసే సేవలోని అంతరంగ, వ్యక్తిగత నిబద్ధతను తెలియజేస్తూ మూలంలోని అస్పష్టతను అతిగా పరిష్కరించదు.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: సువార్తలో
  rationale: ‘సువార్త’ ఆధునిక ప్రామాణిక తెలుగులో పరిచితమైనదీ, ‘మంచి వార్త’ అనే మూలార్థాన్ని మోసేదీ; ἐν నిర్మాణాన్ని కూడా నిలుపుతుంది.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: ఆయన కుమారుని
  rationale: గ్రీకు షష్ఠీ విభక్తిని నేరుగా నిలుపుతూ, అది కుమారుని గురించిన సువార్తా లేక కుమారునికి చెందిన సువార్తా అనే సాధ్యమైన భావవ్యాప్తిని కుదించదు.
- source_word: ἀδιαλείπτως
  choice: ఎడతెగకుండా
  rationale: ఆగకుండా కొనసాగుతున్న క్రమబద్ధతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: మిమ్మల్ని ప్రస్తావిస్తున్నాను
  rationale: అక్షరార్థంగా ‘మీ గురించి ప్రస్తావన చేస్తున్నాను’; ప్రార్థనలో వారిని జ్ఞాపకం చేసుకోవడం అనే భావాన్ని నేరుగా చేర్చకుండా, గ్రీకు నుడికారానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: ἐν τῷ πνεύματί μου లోని ἐν ను స్థానం లేదా సాధనంగా అర్థం చేయడం
  choice: నా ఆత్మతో
  alternative: నా ఆత్మలో
  rationale: సందర్భంలో ఇది సేవ చేసే విధానం లేదా సాధనాన్ని సూచించే అవకాశం బలంగా ఉంది. అయినా ‘నా ఆత్మలో’ అనే స్థానార్థం సాధ్యమే; ప్రధాన పాఠంలో సహజమైన తెలుగు కోసం ‘తో’ ఎంచుకోబడింది.
- issue: τοῦ υἱοῦ αὐτοῦ అనే షష్ఠీ సంబంధం
  choice: ఆయన కుమారుని సువార్త
  alternative: ఆయన కుమారుని గురించిన సువార్త
  rationale: మూలంలోని షష్ఠీ సంబంధం స్వభావాన్ని నిర్ణయించకుండా నేరుగా ఉంచడం వలన, కుమారునికి సంబంధించిన లేదా ఆయన గురించిన సువార్త అనే అర్థసాధ్యతలు నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ప్రధాన సాక్ష్య ప్రకటనను స్పష్టంగా ఉంచేందుకు దీర్ఘ విరామచిహ్నం ఉపయోగించబడింది; సంప్రదాయపరమైన అదనపు వ్యాఖ్యానం చేర్చలేదు.
