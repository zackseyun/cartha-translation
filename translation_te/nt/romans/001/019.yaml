  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: te
  text: ఎందుకంటే దేవుని గురించి తెలుసుకోగలిగినది వారి మధ్య స్పష్టంగా ఉంది[a]; దేవుడు దానిని వారికి స్పష్టం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిలో” లేదా “వారి అంతరంగంలో.”
    reason: ἐν αὐτοῖς అనే గ్రీకు పదబంధానికి అంతర్గత స్థానం అనే భావం కూడా సాధ్యమే.
lexical_decisions:
- source_word: διότι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన విషయానికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: దేవుని గురించి తెలుసుకోగలిగినది
  rationale: నపుంసకలింగ విశేషణం నామవాచకంగా వాడబడింది. ఈ సందర్భంలో దేవుని గురించి మానవులకు తెలిసే వీలున్నదనే భావాన్ని ఇది నిలుపుతుంది; కేవలం ఇప్పటికే తెలిసినదని పరిమితం చేయదు.
- source_word: φανερόν
  choice: స్పష్టంగా ఉంది
  rationale: బహిర్గతంగా, గ్రహించదగిన విధంగా ఉన్నదనే భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: ἐν αὐτοῖς
  choice: వారి మధ్య
  rationale: ἐν అనే విభక్తి ప్రయోగం ఇక్కడ సమూహంలో లేదా అంతర్గతంగా అనే రెండు భావాలకు అవకాశం ఇస్తుంది. సృష్టి ద్వారా అందరికీ వెల్లడైన సంగతిని సూచించే సందర్భానికి ‘వారి మధ్య’ సరిపోతుంది; మరో భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: దేవుడే దానిని వారికి స్పష్టం చేశాడు
  rationale: మొదటి భాగంలోని φανερόνతో ఉన్న పదసంబంధాన్ని ‘స్పష్టం’ అనే పదాన్ని మళ్లీ వాడి నిలుపుతుంది. ‘దేవుడే’ అనేది గ్రీకు వాక్యంలో స్పష్టంగా వ్యక్తమైన కర్తను సహజమైన తెలుగులో నొక్కి చెబుతుంది.
theological_decisions:
- issue: ἐν αὐτοῖς అనే పదబంధం యొక్క భావం
  choice: వారి మధ్య
  alternative: వారిలో లేదా వారి అంతరంగంలో
  rationale: గ్రీకు పదబంధం బహిరంగంగా వారి సమూహంలో ఉన్నదని గానీ, వారిలో అంతర్గతంగా ఉన్నదని గానీ అర్థమివ్వగలదు. ప్రధాన పాఠం సమూహపరమైన భావాన్ని ఎంచుకున్నా, అంతర్గత ప్రకటన అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలిపి, వేదాంతపరమైన సందిగ్ధతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘స్పష్టం’ అనే పదపునరుక్తి మూలంలోని φανερόν–ἐφανέρωσεν పదసంబంధాన్ని ప్రతిబింబిస్తుంది.
