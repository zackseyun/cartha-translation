review_pass:
  verdict: revise
  source_fidelity: The main clause accurately represents Διὸ, παρέδωκεν, the heart-desires phrase, and ἀκαθαρσίαν. However, అవమానపరచుకోవడానికి changes the passive infinitive ἀτιμάζεσθαι ('to be dishonored') into a reflexive active ('to dishonor themselves').
  naturalness: The draft is generally clear modern standard Telugu. A passive result construction is both more natural in this context and closer to the Greek.
  terminology: దేవుడు, హృదయాలు, అపవిత్రత, and శరీరాలు are appropriate, consistent biblical terminology. అప్పగించాడు suitably conveys παρέδωκεν without importing a fuller theological explanation.
  issues:
  - severity: medium
    issue: Voice of τοῦ ἀτιμάζεσθαι
    rationale: The Greek infinitive is passive. The draft's అవమానపరచుకోవడానికి is reflexive active and makes the people directly dishonor their own bodies, rather than stating that their bodies are dishonored.
  - severity: low
    issue: Footnote wording for ἐν αὐτοῖς
    rationale: The note appropriately preserves the ambiguity, but the revised main text should not commit to a reflexive active sense merely because one possible rendering is 'among themselves.'
