id: ROM.1.24
reference: Romans 1:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: te
  text: అందువల్ల దేవుడు వారిని వారి హృదయాల కోరికలలో అపవిత్రతకు అప్పగించాడు, తద్వారా వారి శరీరాలు వారిలో[a] అవమానించబడేలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమలో తాము’; బహుశా ‘తమలోనే.’
    reason: ἐν αὐτοῖς అనే సంక్షిప్త గ్రీకు పదబంధాన్ని ‘వారిలో,’ ‘తమలో తాము,’ లేదా ‘తమలోనే’ అని అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: Διὸ
  choice: అందువల్ల
  rationale: ముందటి వాదన నుండి వచ్చే ఫలితాన్ని సూచించే తార్కిక అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: παρέδωκεν
  choice: అప్పగించాడు
  rationale: ఒక శక్తి లేదా స్థితి ఆధీనానికి వదిలివేయడం అనే భావాన్ని, అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా వ్యక్తం చేస్తుంది.
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: వారి హృదయాల కోరికలలో
  rationale: ἐν అనే విభక్తి సూచించే పరిధి లేదా కార్యసందర్భాన్ని నిలుపుతూ, మూలంలోని ‘హృదయాలు’ అనే మానవ అంతరంగ సూచనను కాపాడుతుంది.
- source_word: ἐπιθυμίαις
  choice: కోరికలు
  rationale: ఈ పదాన్ని ముందుగానే కేవలం లైంగిక వాంఛలకే పరిమితం చేయకుండా, గ్రీకు పదంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: ἀκαθαρσίαν
  choice: అపవిత్రత
  rationale: నైతిక అశుద్ధతను ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοῦ ἀτιμάζεσθαι
  choice: అవమానపరచుకోవడానికి
  rationale: ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌లోని ఉద్దేశం/ఫలితం మధ్య ఉన్న భావసాంద్రతను పూర్తిగా ఒకే దిశగా పరిష్కరించకుండా తెలుగులో సహజంగా అందిస్తుంది.
- source_word: τὰ σώματα αὐτῶν
  choice: తమ శరీరాలను
  rationale: పౌలు ఉద్దేశించిన శారీరక అంశాన్ని ప్రత్యక్షంగా నిలుపుతుంది; ‘తమ’ అనేది వాక్యంలోని పరస్పర సంబంధానికి తెలుగులో సహజంగా సరిపోతుంది.
- source_word: ἐν αὐτοῖς
  choice: తమలో తాము
  rationale: సందర్భంలో సాధ్యమైన పరస్పర/సామాజిక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఇతర సాధ్యమైన అర్థాలను పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: παρέδωκεν అనే పదాన్ని ‘దేవుడు పూర్తిగా విడిచిపెట్టాడు’ లేదా ‘తీర్పుగా అప్పగించాడు’ అని విస్తరించాలా
  choice: అప్పగించాడు
  alternative: విడిచిపెట్టాడు; తీర్పుగా అప్పగించాడు
  rationale: మూలపాఠం దేవుని అప్పగింపు చర్యను బలంగా చెబుతుంది; అయితే దాని పూర్తి సిద్ధాంత వివరణను వాక్యంలో చేర్చదు. అందువల్ల వచనంలోని గంభీరతను, theological tension‌ను అలాగే నిలుపుతుంది.
- issue: τοῦ ἀτιμάζεσθαι ను ఖచ్చితంగా ఉద్దేశంగా లేదా ఫలితంగా నిర్ణయించాలా
  choice: అవమానపరచుకోవడానికి
  alternative: దాని ఫలితంగా వారి శరీరాలు అవమానానికి గురయ్యాయి
  rationale: గ్రీకు ఇన్ఫినిటివ్ ఉద్దేశం లేదా ఫలిత ఛాయలను మోయగలదు. తెలుగు రూపం మూల నిర్మాణానికి దగ్గరగా ఉండి ఆ సంబంధాన్ని అతిగా వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా పౌలు వాదనలోని గంభీరతను కాపాడే గౌరవప్రదమైన శైలి. డాష్ చివరి ఇన్ఫినిటివ్ భాగాన్ని ప్రధాన అప్పగింపు చర్యతో స్పష్టంగా అనుసంధానిస్తుంది.
