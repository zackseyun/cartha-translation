id: ROM.1.25
reference: Romans 1:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: te
  text: వారు దేవుని సత్యాన్ని ఆ అబద్ధంతో మార్చివేసి, సృష్టికర్తకు బదులుగా సృష్టిని భక్తితో గౌరవించి సేవించారు. ఆ సృష్టికర్త యుగయుగాలూ స్తుతింపబడువాడు. ఆమేన్.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν
  choice: మార్చివేసి
  rationale: ఒకదాని స్థానంలో మరొకదాన్ని స్వీకరించడం అనే మార్పిడి భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: దేవుని సత్యాన్ని
  rationale: గ్రీకు షష్ఠీ విభక్తిలోని సహజమైన అస్పష్టతను నిలుపుతుంది; ఇది దేవుని గురించిన సత్యమా లేక దేవునికి చెందిన సత్యమా అని అనవసరంగా నిర్ణయించదు.
- source_word: ἐν τῷ ψεύδει
  choice: అబద్ధంతో
  rationale: ἐν ఇక్కడ మార్పిడిలో వచ్చిన ప్రతిస్థాపనను సూచిస్తుంది; నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ తెలుగులో ‘ఆ అబద్ధం’ కంటే ‘అబద్ధం’ సహజంగా ఉంటుంది.
- source_word: ἐσεβάσθησαν
  choice: గౌరవించి
  rationale: σεβάζομαιలోని భక్తిపూర్వక గౌరవ భావాన్ని ‘ఆరాధించి’ అని బలంగా సమానీకరించకుండా తెలియజేస్తుంది.
- source_word: ἐλάτρευσαν
  choice: సేవించారు
  rationale: మతపరమైన సేవ లేదా ఆరాధనా సేవ భావాన్ని సందర్భం ద్వారా మోసే సరళమైన ప్రత్యక్ష సమానం.
- source_word: τῇ κτίσει
  choice: సృష్టిని
  rationale: సృష్టించబడిన సమస్తాన్ని సమూహార్థకంగా సూచించే గ్రీకు పదాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: παρὰ τὸν κτίσαντα
  choice: సృష్టికర్తకు బదులుగా
  rationale: παρά యొక్క పోలిక/ప్రాధాన్య భావాన్ని ఈ విగ్రహారాధన సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; సృష్టిని సృష్టికర్త స్థానంలో ఉంచడాన్ని స్పష్టం చేస్తుంది.
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: యుగయుగాలూ స్తుతింపదగినవాడు
  rationale: దేవునికి వర్తించే εὐλογητόςను ‘ఆశీర్వదించబడినవాడు’ అనే అసహజ రూపం కాకుండా స్తోత్రార్హతగా, εἰς τοὺς αἰῶναςను నిరంతర కాలార్థంతో అందిస్తుంది.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన లిప్యంతరీకరణను అనుసరిస్తుంది.
theological_decisions:
- issue: సృష్టికి చూపిన చర్యల మధ్య భావభేదం
  choice: ‘గౌరవించి సేవించారు’ అని రెండు క్రియలను వేరు చేసి ఉంచడం
  alternative: ‘ఆరాధించి సేవించారు’
  rationale: ἐσεβάσθησαν మరియు ἐλάτρευσαν రెండింటినీ ఒకే ఆరాధనా భావంలో కలపకుండా, గ్రీకు పాఠంలోని రెండు వేర్వేరు చర్యలను నిలుపుతుంది.
- issue: παρά ద్వారా వ్యక్తమయ్యే సృష్టి–సృష్టికర్త వ్యత్యాసం
  choice: ‘సృష్టికర్తకు బదులుగా సృష్టిని’
  alternative: ‘సృష్టికర్త కంటే సృష్టిని ఎక్కువగా’
  rationale: మూలంలో పరిమాణాత్మకంగా ‘ఎక్కువగా’ అనే పదం లేదు; ‘బదులుగా’ అనే రూపం ప్రతిస్థాపన భావాన్ని అతిశయింపకుండా ఇస్తుంది.
- issue: ముగింపు స్తోత్రవాక్యం ఎవరిని సూచిస్తుంది
  choice: ‘ఆ సృష్టికర్త’ అని పూర్వపదాన్ని స్పష్టంగా పునరుద్ఘాటించడం
  alternative: సర్వనామంతో ‘ఆయన’
  rationale: ὅς యొక్క వ్యాకరణ సంబంధం τὸν κτίσανταతో ఉందని తెలుగులో స్పష్టంగా చూపుతుంది; కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా ఉండేలా, అయినప్పటికీ పౌలు వాక్యంలోని గంభీరమైన ఖండన మరియు ముగింపు స్తోత్ర స్వరాన్ని నిలిపే భాష. వాక్యాన్ని తెలుగులో సహజంగా చదవడానికి రెండు వాక్యాలుగా విభజించాం.
