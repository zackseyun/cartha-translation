id: ROM.1.21
reference: Romans 1:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: te
  text: ఎందుకంటే, వారు దేవుణ్ణి తెలిసినప్పటికీ, ఆయనను దేవునిగా మహిమపరచలేదు, ఆయనకు కృతజ్ఞతలు చెల్లించలేదు. బదులుగా, వారి ఆలోచనలు[a] వ్యర్థమయ్యాయి; వివేకంలేని వారి హృదయం[b] చీకటిమయమైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి తర్కాలు,’ ‘వారి తలంపులు,’ లేదా ‘వారి ఊహాగానాలు.’
    reason: διαλογισμοί అనే పదానికి సందర్భానుసారంగా ఆలోచనలు, తర్కాలు, తలంపులు, ఊహాగానాలు అనే భావాలు ఉండవచ్చు.
  - marker: b
    text: గ్రీకులో ‘హృదయం’ ఏకవచనంలో ఉంది.
    reason: మూలపాఠంలోని సమూహార్థక ఏకవచనాన్ని పాఠకునికి తెలియజేస్తుంది.
lexical_decisions:
- source_word: διότι
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి కారణాన్ని వివరిస్తున్న అనుసంధానాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: γνόντες τὸν θεὸν
  choice: వారు దేవుణ్ణి ఎరిగి కూడా
  rationale: క్రియావిశేషణ రూపంలోని సందర్భానుగత concessive భావాన్ని, అంటే దేవుణ్ణి ఎరిగినప్పటికీ తగిన విధంగా స్పందించలేదనే వైరుధ్యాన్ని, స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: ఆయనను దేవునిగా మహిమపరచలేదు
  rationale: దేవునికి తగిన హోదాలో ఆయనను మహిమపరచలేదనే భావాన్ని, δοξάζω యొక్క గంభీరతతో సహా, నిలుపుతుంది.
- source_word: ἢ ηὐχαρίστησαν
  choice: ఆయనకు కృతజ్ఞతలు చెల్లించలేదు
  rationale: కృతజ్ఞతను వ్యక్తం చేయడాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἀλλὰ
  choice: బదులుగా
  rationale: ముందు చెప్పిన వైఫల్యానికి విరుద్ధంగా సంభవించిన ఫలితాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: వారి ఆలోచనలు వ్యర్థమయ్యాయి
  rationale: పదేపదే అనువదిస్తే తెలుగులో అసహజంగా ఉండే నిర్మాణాన్ని సహజీకరిస్తూ, వారి అంతర్గత ఆలోచనా ప్రక్రియ నిష్ఫలమైందనే మూలభావాన్ని కాపాడుతుంది.
- source_word: ἐσκοτίσθη
  choice: చీకటిమయమైంది
  rationale: నైతిక-మానసిక అంధకారాన్ని సూచించే రూపకాన్ని, క్రియలోని నిష్క్రియాత్మక భావాన్ని బలవంతంగా కారణాత్మకంగా మార్చకుండా, నిలుపుతుంది.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: వివేకంలేని వారి హృదయం
  rationale: ἀσύνετοςలోని అవగాహన లేదా వివేచన లోపాన్ని కేవలం తక్కువ తెలివిగా చూపకుండా తెలియజేస్తుంది; ఏకవచనమైన ‘హృదయం’ను అంతరంగానికి సమూహార్థక సూచనగా అలాగే ఉంచుతుంది.
theological_decisions:
- issue: γνόντες యొక్క concessive భావం
  choice: వారు దేవుణ్ణి ఎరిగి కూడా
  alternative: దేవుణ్ణి ఎరిగినవారై / దేవుణ్ణి ఎరిగినప్పుడు
  rationale: సందర్భంలో దేవుని గురించిన జ్ఞానం ఉన్నప్పటికీ ఆయనను మహిమపరచకపోవడమే పౌలు ఉద్ఘాటిస్తున్న వైరుధ్యం. ఇది వ్యాకరణ-సందర్భ ఆధారిత ఎంపిక; ఆ జ్ఞానం స్వరూపం గురించి అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఎరిగి కూడా’ వైరుధ్యాన్ని సహజంగా తెలియజేస్తుంది; ‘వివేకంలేని’ అనే పదం మానసిక, నైతిక అవగాహన లోపం రెండింటినీ అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది. ఆంగ్ల consultation layerలో సూచికల స్థానాలు footnote విషయాలతో సరిపోలకపోవడంతో, మూలపదాలకు అనుగుణంగా [a]ను ‘ఆలోచనలు’ వద్ద, [b]ను ‘హృదయం’ వద్ద ఉంచాం.
