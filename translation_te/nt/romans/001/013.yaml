id: ROM.1.13
reference: Romans 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: te
  text: 'సోదరులారా[a], మీరు ఈ విషయం తెలియకుండా ఉండడం నాకు ఇష్టం లేదు: మీ దగ్గరకు రావాలని నేను చాలాసార్లు ఉద్దేశించాను, కానీ ఇప్పటివరకు అడ్డుకోబడ్డాను—మిగిలిన అన్యజనుల మధ్య ఉన్నట్లే, మీ మధ్య కూడా కొంత ఫలం పొందేందుకు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సోదరులారా’ అనే సంబోధన ఇక్కడ సోదరీమణులను కూడా కలుపుకొని విశ్వాసులందరినీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఫలం’ అనేది వారి మధ్య పౌలు పరిచర్య వల్ల కలిగే ఫలితాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: మీరు ఈ విషయం తెలియకుండా ఉండడం నాకు ఇష్టం లేదు
  rationale: మూలంలోని నిషేధార్థక నిర్మాణాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: సంబోధనలోని పుంలింగ బహువచన రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది; సందర్భంలో స్త్రీ పురుష విశ్వాసులందరూ ఉద్దేశించబడి ఉండవచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: πολλάκις προεθέμην
  choice: చాలాసార్లు సంకల్పించాను
  rationale: పౌలు పదేపదే చేసుకున్న ఉద్దేశాన్ని గౌరవప్రదమైన, సహజ తెలుగు పదబంధంతో తెలియజేస్తుంది.
- source_word: ἐκωλύθην
  choice: నాకు ఆటంకం కలిగింది
  rationale: బయటి కారణాల వల్ల పౌలు రాలేకపోయాడనే కర్మణి భావాన్ని నిలుపుతుంది; ఆటంకం ఏమిటో మూలం పేర్కొననందున దానిని నిర్దిష్టం చేయదు.
- source_word: ἄχρι τοῦ δεῦρο
  choice: ఇప్పటివరకు
  rationale: కాలసూచక గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: కొంత ఫలం పొందాలన్నదే
  rationale: ఫలం అనే వ్యవసాయ రూపకాన్ని నిలుపుతుంది; దాని సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: రోమా విశ్వాసుల సమూహంలో కలిగే పరిచర్య ఫలితాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: మిగిలిన అన్యజనుల మధ్య
  rationale: పౌలు వాడుకలోని అన్యజనుల భావాన్ని, అలాగే λοιποῖς లోని ‘మిగిలిన’ అనే పోలికను నిలుపుతుంది.
theological_decisions:
- issue: καρπός అనే రూపకపు అర్థం
  choice: ప్రధాన వచనంలో ‘ఫలం’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘పరిచర్య ఫలితాలు’ లేదా ‘పంట’ అని స్పష్టీకరించడం
  rationale: మూలంలోని రూపకాన్ని తొలగించకుండా, అది పౌలు పరిచర్య వల్ల కలిగే ఫలితాలను సూచిస్తుందని పాదసూచికలో వివరించడం అర్థాన్నీ సాహిత్య రూపాన్నీ కాపాడుతుంది.
- issue: ἔθνη యొక్క సందర్భార్థం
  choice: అన్యజనులు
  alternative: ఇతర జనాలు / దేశాలు
  rationale: రోమా పత్రికలోని పౌలు అన్యజన పరిచర్య సందర్భంలో వ్యక్తుల సమూహాన్ని సూచించడం సహజం; రాజకీయ దేశాల భావాన్ని అనవసరంగా రానీయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ‘తెలియకుండా ఉండడం నాకు ఇష్టం లేదు’ అనే నిషేధార్థక సూత్రం, ‘ఫలం’ అనే రూపకం, ఆటంకానికి కారణం చెప్పని అస్పష్టత నిలుపబడ్డాయి.
