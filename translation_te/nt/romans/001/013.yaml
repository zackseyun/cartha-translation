revisions:
- from: 'సోదరులారా[a], మీరు ఈ విషయం తెలియకుండా ఉండడం నాకు ఇష్టం లేదు: మీ దగ్గరకు రావాలని నేను చాలాసార్లు సంకల్పించాను. అయితే ఇప్పటివరకు నాకు ఆటంకం కలిగింది. మిగిలిన అన్యజనుల మధ్యలాగే మీ మధ్య కూడా కొంత ఫలం పొందాలన్నదే నా ఉద్దేశం.[b]'
  to: 'సోదరులారా[a], మీరు ఈ విషయం తెలియకుండా ఉండడం నాకు ఇష్టం లేదు: మీ దగ్గరకు రావాలని నేను చాలాసార్లు ఉద్దేశించాను, కానీ ఇప్పటివరకు అడ్డుకోబడ్డాను—మిగిలిన అన్యజనుల మధ్య ఉన్నట్లే, మీ మధ్య కూడా కొంత ఫలం పొందేందుకు.[b]'
  rationale: The revision keeps the source’s conventional negative formula, repeated past intention, unspecified passive hindrance, and the purpose relation expressed by ἵνα. It also retains ‘ఫలం’ as a metaphor and ‘అన్యజనులు’ for the contextual sense of ἔθνη, without specifying the cause of the hindrance or imposing a doctrinal interpretation.
