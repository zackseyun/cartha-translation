translation:
  language: te
  text: వివేచన లేనివారు, మాట నిలబెట్టుకోనివారు[a], సహజమైన ఆప్యాయత లేనివారు[b], కనికరం లేనివారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నమ్మదగనివారు,” “ఒప్పందాలను ఉల్లంఘించేవారు.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ సహజమైన ఆప్యాయత అంటే ముఖ్యంగా కుటుంబ సభ్యుల మధ్య ఉండవలసిన సహజ ప్రేమానురాగం.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσυνέτους
  choice: వివేచన లేనివారు
  rationale: ఈ పదం కేవలం తెలివి తక్కువగా ఉండడాన్ని కాక, అర్థం చేసుకొని సరిగ్గా వివేచించే సామర్థ్యం లేకపోవడాన్ని సూచిస్తుంది. ఈ భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἀσυνθέτους
  choice: మాట నిలబెట్టుకోనివారు
  rationale: ఒప్పుకున్నదానికి కట్టుబడకపోవడం, ఇచ్చిన మాటను లేదా ఒప్పందాన్ని నిలబెట్టుకోకపోవడం అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀστόργους
  choice: సహజమైన ఆప్యాయత లేనివారు
  rationale: στοργήతో సంబంధమున్న సహజ కుటుంబానురాగం లేకపోవడమే ప్రధాన భావం. సంక్షిప్తమైన జాబితా శైలిని కాపాడుతూ ఆ భావాన్ని సూచిస్తుంది.
- source_word: ἀνελεήμονας
  choice: కనికరం లేనివారు
  rationale: ఇతరుల పట్ల దయ లేదా కరుణ చూపకపోవడం అనే గ్రీకు పదపు ప్రత్యక్ష భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, మూలంలోని సంక్షిప్త దోషాల జాబితా లయను నిలబెట్టే సమాంతర పదబంధాలు ఉపయోగించబడ్డాయి. నైతిక-బౌద్ధిక భావం, మాట లేదా ఒప్పందం పట్ల అవిశ్వసనీయత, సహజ కుటుంబానురాగం లేకపోవడం, కనికరం లేకపోవడం అనే నాలుగు ప్రత్యేక భావాలు కలిసిపోకుండా వేరు చేయబడ్డాయి.
