  source_fidelity: 'The four Telugu expressions accurately represent the Greek vice-list terms in sequence: lack of discernment (ἀσυνέτους), unreliability in commitments (ἀσυνθέτους), absence of natural/familial affection (ἀστόργους), and lack of mercy (ἀνελεήμονας). The concise list structure and terminal punctuation are retained.'
