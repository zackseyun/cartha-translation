  terminology: “వివేచన లేనివారు” appropriately avoids reducing the first term to intellectual deficiency alone. “సహజమైన ఆప్యాయత లేనివారు,” clarified by its note, preserves the familial-nature nuance of ἀστόργους without overloading the main text. “కనికరం లేనివారు” is a natural equivalent for ἀνελεήμονας.
