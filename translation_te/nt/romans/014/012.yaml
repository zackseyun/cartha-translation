id: ROM.14.12
reference: Romans 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἄρα ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον ⸀δώσει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: te
  text: కాబట్టి మనలో ప్రతి ఒక్కరూ తన గురించి లెక్క అప్పగిస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρα
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἕκαστος ἡμῶν
  choice: మనలో ప్రతి ఒక్కరూ
  rationale: ἕκαστος యొక్క ఒక్కొక్కరిని సూచించే భావాన్నీ, ἡμῶν యొక్క భాగసూచక భావాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: περὶ ἑαυτοῦ
  choice: తన గురించి తానే
  rationale: περί + షష్ఠీ విభక్తి యొక్క ‘గురించి’ అనే భావాన్ని నిలుపుతూ, ప్రతి వ్యక్తి తన విషయమై వ్యక్తిగతంగా లెక్క అప్పగిస్తాడనే భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: λόγον
  choice: లెక్క
  rationale: λόγον δώσει అనే ప్రయోగంలో న్యాయపరమైన లేదా మూల్యాంకన సందర్భంలో ‘లెక్క అప్పగించడం’ అనే అర్థం వస్తుంది; తెలుగు వాడుకలో ‘లెక్క’ సహజమైన సమానార్థకం.
- source_word: δώσει
  choice: అప్పగిస్తాడు
  rationale: భవిష్యత్ కాల భావాన్ని నిలుపుతుంది; ‘లెక్క అప్పగిస్తాడు’ అనే తెలుగు నుడికారం గ్రీకు λόγον δώσει యొక్క భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: లెక్క ఎవరికీ అప్పగించబడుతుందనే పాఠ్య స్పష్టత
  choice: దేవునికి
  alternative: కర్మకు గ్రహీతను జోడించకుండా ‘లెక్క అప్పగిస్తాడు’
  rationale: ఈ వాక్యంలోని SBLGNT పాఠ్యంలో గ్రహీత ప్రత్యక్షంగా లేకపోయినా, 14:10–11 సమీప సందర్భం దేవుని తీర్పు పీఠం ఎదుట నిలబడటాన్ని సూచిస్తుంది. తెలుగులో ‘లెక్క అప్పగించడం’ సాధారణంగా గ్రహీతను కోరుతుంది; అందుచేత సందర్భం నుంచి ‘దేవునికి’ చేర్చబడింది, అయితే ఇది ఈ వాక్యంలో అంతర్లీనమైన పదం అని పాదటిప్పణి తెలియజేస్తుంది.
- issue: ఏకవచన ప్రతిబింబ సర్వనామం కలిగిన సార్వత్రిక ప్రకటన
  choice: తన గురించి తానే
  alternative: తమ గురించి తామే
  rationale: ἑαυτοῦ ఏకవచన రూపాన్నీ, ἕκαστος వల్ల కలిగే వ్యక్తిగత బాధ్యతనూ తెలుగు ఏకవచన ప్రతిబింబ రూపంతో నిలుపుతుంది; ఇది ప్రతి వ్యక్తికీ వర్తించే సార్వత్రిక ప్రకటన.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే తీర్పు మరియు వ్యక్తిగత జవాబుదారీతనం యొక్క గంభీరతను నిలుపుతూ రూపొందించబడింది.
