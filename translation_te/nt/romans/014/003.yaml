  source_fidelity: The Telugu accurately preserves the two reciprocal prohibitions, the generic eating/not-eating contrast without importing food-specific detail, the explanatory γάρ relation, and the singular pronoun in the final clause. ‘చులకనగా చూడకూడదు’ appropriately conveys ἐξουθενείτω, while ‘తీర్పు చెప్పకూడదు’ retains the broad force of κρινέτω without narrowing it to condemnation. ‘దేవుడు అతణ్ణి చేర్చుకున్నాడు’ communicates προσέλαβετο as a relational receiving/welcoming and does not improperly resolve the pronoun’s rhetorical scope.
  naturalness: The wording is clear, idiomatic modern standard Telugu, with effective parallelism between ‘తినేవాడు/తిననివాడు’ and natural prohibitive forms. The semicolon adequately marks the contrast and reciprocal structure; no explicit connective is required for comprehension.
