id: ROM.14.3
reference: Romans 14:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: te
  text: తినేవాడు తిననివాణ్ణి చులకనగా చూడకూడదు[a]; తిననివాడు తినేవాడిపై తీర్పు చెప్పకూడదు[b]. ఎందుకంటే దేవుడు అతణ్ణి చేర్చుకున్నాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తృణీకరించకూడదు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తీర్పు తీర్చకూడదు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘స్వీకరించాడు.’ ఈ క్రియలో తన సహవాసంలోకి ఆహ్వానించి చేర్చుకోవడం అనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: తినేవాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వర్తమాన కృదంతం ఒక విధమైన వ్యక్తిని సూచిస్తుంది. ‘తినేవాడు’ సహజమైన తెలుగులో ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τὸν μὴ ἐσθίοντα
  choice: తిననివాణ్ణి
  rationale: గ్రీకు వాక్యంలోని తినేవాడు—తిననివాడు అనే సమాంతర వ్యత్యాసాన్ని కాపాడుతుంది; దేనిని తినడం లేదో వచనం చెప్పనందున అదనపు వివరణను చేర్చదు.
- source_word: ἐξουθενείτω
  choice: చులకనగా చూడకూడదు
  rationale: ఎవరినైనా విలువలేనివారిగా ఎంచడం లేదా చిన్నచూపు చూడడం అనే మూలపద భావాన్ని ఆధునిక, సాధారణ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: తిననివాడు
  rationale: δέ సూచించే వ్యత్యాసం రెండు సమాంతర వాక్యభాగాల ద్వారా తెలుగులో స్పష్టంగా ఉంది; అదనపు అనుసంధాన పదం అవసరం లేదు.
- source_word: κρινέτω
  choice: తీర్పు చెప్పకూడదు
  rationale: తోటి వ్యక్తిపై న్యాయనిర్ణయం చేయడం అనే విస్తృత భావాన్ని ఉంచుతుంది; ‘దోషిగా తీర్చడం’ అని అనువదిస్తే భావం అనవసరంగా సంకుచితమవుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న రెండు నిషేధాలకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτὸν
  choice: అతణ్ణి
  rationale: గ్రీకులోని ఏకవచన పుంలింగ సర్వనామాన్ని నిలుపుతుంది; అది ప్రత్యేకంగా తినేవాణ్ణే సూచిస్తుందా లేక పరస్పర వాదంలోని సంబంధిత వ్యక్తిని సూచిస్తుందా అన్నదాన్ని అనువాదంలో నిర్ణయించదు.
- source_word: προσελάβετο
  choice: చేర్చుకున్నాడు
  rationale: కేవలం మానసికంగా అంగీకరించడం కాక, తన సహవాసంలోకి స్వీకరించడం అనే సంబంధాత్మక భావాన్ని తెలియజేస్తుంది; రోమా 14:1, 15:7లోని సమీప ప్రయోగాలతోనూ సరిపోతుంది.
theological_decisions:
- issue: తినడం—తినకపోవడం అనే వ్యత్యాసపు పరిధి
  choice: వచనంలో ఉన్నట్లే సాధారణంగా ‘తినేవాడు’, ‘తిననివాడు’ అని అనువదించడం
  alternative: అన్ని రకాల ఆహారం తినేవాడు, కొన్ని ఆహారాలకు దూరంగా ఉండేవాడు అని స్పష్టీకరించడం
  rationale: సందర్భం ఆహార ఆచారాల వివాదాన్ని సూచించినా, ఈ వచనం దేనిని తింటున్నారో లేదా మానుతున్నారో పేర్కొనదు. అందువల్ల సందర్భ వివరణను మూలవాక్యంలోకి చేర్చలేదు.
- issue: ‘దేవుడు అతణ్ణి చేర్చుకున్నాడు’లో ‘అతణ్ణి’ అనే సర్వనామపు నిర్దేశం
  choice: ఏకవచన సర్వనామాన్ని అలాగే ఉంచి దాని నిర్దేశాన్ని పరిష్కరించకుండా ఉంచడం
  alternative: ‘ఆ వ్యక్తిని’ అని సాధారణీకరించడం లేదా అది ప్రత్యేకంగా తినేవాణ్ణి సూచిస్తుందని స్పష్టీకరించడం
  rationale: దగ్గరి వ్యాకరణ పూర్వపదం తినేవాడే అయినా, దేవుడు స్వీకరించిన తోటి విశ్వాసిని మనిషి తీర్పు తీర్చకూడదనే వాదన రెండు వర్గాలకూ వర్తిస్తుంది. మూలంలోని ఉద్వేగభరిత ఏకవచనాన్ని నిలిపి, అస్పష్టతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి వాడబడింది. ‘చులకనగా చూడడం’, ‘తీర్పు చెప్పడం’ వంటి సహజ ప్రయోగాలతో పరస్పర నిషేధాల సమాంతర నిర్మాణం నిలుపబడింది.
