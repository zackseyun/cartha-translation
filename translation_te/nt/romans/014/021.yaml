id: ROM.14.21
reference: Romans 14:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: te
  text: మాంసం తినకపోవడం, ద్రాక్షామద్యం తాగకపోవడం, లేదా నీ సోదరుడు[a] తడబడటానికైనా, అభ్యంతరపడటానికైనా, బలహీనపడటానికైనా[b] కారణమయ్యే ఏదీ చేయకపోవడం మంచిది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ సందర్భంలో ‘నీ సోదరుడు లేదా సోదరి,’ అంటే తోటి విశ్వాసి అని కూడా భావించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని గ్రీకు ప్రతుల్లో ‘అభ్యంతరపడటానికైనా, బలహీనపడటానికైనా’ అనే మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: καλὸν
  choice: మంచిది
  rationale: ఈ సందర్భంలో నైతికంగా యుక్తమైన, ప్రశంసనీయమైన ప్రవర్తనను సూచిస్తుంది; ఆధునిక తెలుగులో ‘మంచిది’ సహజంగా, విస్తృత భావంతో ఉంది.
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: మాంసం తినకపోవడం
  rationale: ఆహారంగా తీసుకునే మాంసమే సందర్భార్థం; గ్రీకు నామీకృత క్రియారూపాన్ని తెలుగు నామీకృత నిర్మాణంతో నిలిపింది.
- source_word: μηδὲ πιεῖν οἶνον
  choice: ద్రాక్షారసం తాగకపోవడం
  rationale: οἶνος ద్రాక్షతో చేసిన పానీయాన్ని సూచిస్తుంది. ‘ద్రాక్షారసం’ సాధారణ తెలుగు బైబిలు సందర్భంలో సహజంగా ఉండి, మూలపద సూచనను నిలుపుతుంది.
- source_word: μηδὲ ἐν ᾧ
  choice: కారణమయ్యే మరేదీ చేయకపోవడం
  rationale: గ్రీకులో చివరి భాగం సంక్షిప్తంగా ‘దేనివల్లనైనా’ అనే భావంలో ఉంది. తెలుగులో వాక్యం సంపూర్ణంగా, సహజంగా ఉండేందుకు సూచితమైన ‘మరేదీ చేయకపోవడం’ను స్పష్టం చేసింది.
- source_word: ὁ ἀδελφός σου
  choice: నీ సోదరుడు
  rationale: మూలంలో పుంలింగ ఏకవచనం ఉంది. ప్రధాన పాఠం దానిని నిలుపుతుంది; సందర్భంలోని విస్తృత సహవిశ్వాసి భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: προσκόπτει
  choice: తడబడటం
  rationale: నైతిక లేదా ఆత్మీయ నడకలో ఆటంకం కలిగి తడబడటమనే పౌలు వాడే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: σκανδαλίζεται
  choice: పాపంలో పడటం
  rationale: కేవలం మనస్తాపం చెందడం కంటే, ఒకరి చర్యవల్ల నైతికంగా ఉచ్చులో చిక్కి పడిపోవడం అనే సందర్భార్థాన్ని తెలియజేస్తుంది; προσκόπτειతో ఉన్న భావసామీప్యాన్ని పూర్తిగా కలిపివేయదు.
- source_word: ἀσθενεῖ
  choice: బలహీనపడటం
  rationale: ఇక్కడ శారీరక బలహీనత కంటే విశ్వాసం లేదా మనస్సాక్షికి సంబంధించిన బలహీనత సందర్భోచితం; అయితే ప్రధాన పాఠం అదనపు వ్యాఖ్యానాన్ని చేర్చకుండా విస్తృత పదాన్నే ఉంచుతుంది.
theological_decisions:
- issue: ἀδελφός యొక్క ప్రతినిధి ప్రయోగం
  choice: నీ సోదరుడు
  alternative: నీ సోదరుడు లేదా సోదరి; నీ తోటి విశ్వాసి
  rationale: గ్రీకు రూపం పుంలింగ ఏకవచనం కాబట్టి ప్రధాన పాఠంలో దాన్ని నిలిపాం. రోమా 14 సందర్భంలో ఇది ఏ తోటి విశ్వాసికైనా వర్తించగలదనే భావాన్ని పాదసూచికలో ఇచ్చాం.
- issue: మూడు హానికర ఫలితాల మధ్య భావసామీప్యం
  choice: తడబడటం, పాపంలో పడటం, బలహీనపడటం
  alternative: తడబడటం, అభ్యంతరపడటం, బలహీనపడటం
  rationale: ప్రతి గ్రీకు క్రియకు వేరైన తెలుగు వ్యక్తీకరణ ఇచ్చి వాటి పరస్పర భావసామీప్యాన్ని నిలిపాం. σκανδαλίζεταιను కేవలం భావోద్వేగపూరితమైన ‘అభ్యంతరపడటం’గా తగ్గించకుండా నైతిక ప్రమాద భావాన్ని వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నామీకృత వాక్యనిర్మాణం వాడబడింది. గ్రీకులోని వరుస నిరాకరణలను ‘తినకపోవడం … తాగకపోవడం … చేయకపోవడం’గా సమాంతరంగా ఉంచి, చివరి సంక్షిప్త భాగాన్ని సహజమైన తెలుగుకోసం పరిమితంగా విప్పి చెప్పాం.
