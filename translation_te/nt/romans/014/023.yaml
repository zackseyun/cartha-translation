id: ROM.14.23
reference: Romans 14:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: te
  text: అయితే సందేహపడుతున్నవాడు తింటే దోషిగా తీర్పు పొందివున్నాడు[a], ఎందుకంటే అది విశ్వాసం నుండి వచ్చినది కాదు. విశ్వాసం నుండి పుట్టని ప్రతిదీ పాపమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే అది స్థిరమైన నిశ్చయం నుండి వచ్చినది కాదు.” గ్రీకులో “విశ్వాసం నుండి” అని ఉంది; దేవుని ఎదుట స్థిరమైన నిశ్చయంతో వ్యవహరించడం అనే భావం కూడా ఇందులో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: సందేహపడుతున్నవాడు
  rationale: భోజనం విషయంలో ఇతరులతో వాదించడాన్ని కాక, అంతరంగంలో సంశయించడం లేదా తటపటాయించడాన్ని ఈ సందర్భం సూచిస్తుంది.
- source_word: ἐὰν φάγῃ
  choice: తింటే
  rationale: ἐάν తో కూడిన aorist subjunctive షరతును తెలియజేస్తుంది; ‘తింటే’ సహజమైన తెలుగు షరతార్థక రూపం.
- source_word: κατακέκριται
  choice: దోషిగా తీర్పు పొందుతాడు
  rationale: Perfect passive క్రియ ఆ చర్య ఫలితంగా ఏర్పడే దోషనిర్ణయ స్థితిని సూచిస్తుంది. కర్తను పేర్కొనకుండా passive భావాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: ὅτι οὐκ ἐκ πίστεως
  choice: ఎందుకంటే అతడు విశ్వాసంతో తినడం లేదు
  rationale: ὅτι కారణాన్ని తెలియజేస్తుంది. ἐκ πίστεως అనే మూలం/ఆధారం భావాన్ని సహజ తెలుగులో ‘విశ్వాసంతో’ అని వ్యక్తం చేస్తూ, సందర్భానుసారంగా తినే చర్యను స్పష్టం చేసింది.
- source_word: πᾶν δὲ ὃ οὐκ ἐκ πίστεως
  choice: విశ్వాసం నుండి పుట్టని ప్రతిదీ
  rationale: πᾶν ... ὃ యొక్క సమగ్ర భావాన్ని ‘ప్రతిదీ’ నిలుపుతుంది; ἐκ యొక్క మూలం నుండి ఉద్భవించే భావాన్ని ‘నుండి పుట్టని’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἁμαρτία ἐστίν
  choice: పాపమే
  rationale: Predicate noun యొక్క నిర్దిష్టమైన, బలమైన వాక్యాన్ని విశేషణ రూపానికి మార్చకుండా ‘పాపమే’గా అందించింది.
theological_decisions:
- issue: నైతిక సందర్భంలో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: నిశ్చయమైన ఒప్పుదల; నమ్మకం; విశ్వసనీయత
  rationale: ఈ సందర్భంలో దేవుని ఎదుట స్థిరమైన అంతరంగ నిశ్చయం అనే ఛాయ ఉన్నప్పటికీ, ‘విశ్వాసం’ పౌలు వాడే విస్తృత పదజాలాన్ని నిలుపుతుంది; దానిని కేవలం వ్యక్తిగత అభిప్రాయంగా కుదించదు. సందర్భార్థాన్ని పాదసూచికలో తెలిపింది.
- issue: κατακέκριται లోని దోషనిర్ణయ కర్త
  choice: దోషిగా తీర్పు పొందుతాడు
  alternative: తనను తానే దోషిగా తీర్చుకుంటాడు; దేవుని ఎదుట దోషిగా నిలుస్తాడు
  rationale: గ్రీకు passive రూపం తీర్పు ఇచ్చే కర్తను స్పష్టంగా పేర్కొనదు. అందువల్ల అది దేవుని తీర్పా, మనస్సాక్షి తీర్పా, లేక రెండింటినీ సూచిస్తుందా అనే ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పాపమే’ మూలంలోని వర్గీకరణ బలాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
