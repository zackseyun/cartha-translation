review_pass:
  verdict: revise
  source_fidelity: The conditional force of ἐὰν φάγῃ and the inward hesitation of διακρινόμενος are preserved. However, the draft's “తీర్పు పొందుతాడు” is future-oriented, whereas κατακέκριται is a perfect passive denoting an existing resultant state. The causal clause is better kept explicitly tied to the action as “it is not from faith,” rather than recast as an ongoing “he is not eating with faith.”
  naturalness: “దోషిగా తీర్పు పొందివున్నాడు” is formal but clear modern-standard Telugu and suitably conveys the Greek resultant-state passive. “విశ్వాసం నుండి వచ్చినది కాదు” is natural enough in this elevated epistolary register and avoids an unnecessary progressive nuance.
  terminology: “విశ్వాసం” appropriately preserves πίστις. “పాపమే” preserves the emphatic categorical predicate. The footnote should retain the contextual alternative of settled conviction, but its Telugu should use the more idiomatic “నిశ్చయం” rather than “ఒప్పుదల.”
  issues:
  - severity: medium
    issue: The rendering “దోషిగా తీర్పు పొందుతాడు” makes κατακέκριται future-oriented.
    rationale: κατακέκριται is perfect passive, describing condemnation as an attained/resultant state, not merely a future verdict contingent on eating.
  - severity: low
    issue: The phrase “అతడు విశ్వాసంతో తినడం లేదు” introduces an ongoing-progressive framing and makes the implied action explicit.
    rationale: The Greek more compactly states that the relevant action is not “from faith.” Rendering the action with “అది” better preserves the source syntax and avoids suggesting a continuing eating practice.
  - severity: low
    issue: The footnote’s “స్థిరమైన ఒప్పుదల” is less idiomatic for the intended contextual nuance.
    rationale: “స్థిరమైన నిశ్చయం” naturally expresses settled conviction in modern standard Telugu without narrowing πίστις in the main text.
  revised_text: అయితే సందేహపడుతున్నవాడు తింటే దోషిగా తీర్పు పొందివున్నాడు[a], ఎందుకంటే అది విశ్వాసం నుండి వచ్చినది కాదు. విశ్వాసం నుండి పుట్టని ప్రతిదీ పాపమే.
