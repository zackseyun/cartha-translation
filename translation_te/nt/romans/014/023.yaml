revisions:
- from: అయితే సందేహపడుతున్నవాడు తింటే దోషిగా తీర్పు పొందుతాడు[a]; ఎందుకంటే అతడు విశ్వాసంతో తినడం లేదు. విశ్వాసం నుండి పుట్టని ప్రతిదీ పాపమే.
  to: అయితే సందేహపడుతున్నవాడు తింటే దోషిగా తీర్పు పొందివున్నాడు[a], ఎందుకంటే అది విశ్వాసం నుండి వచ్చినది కాదు. విశ్వాసం నుండి పుట్టని ప్రతిదీ పాపమే.
