id: ROM.14.7
reference: Romans 14:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: te
  text: ఎందుకంటే మనలో ఎవరూ తనకోసం జీవించరు[a], మరియు ఎవరూ తనకోసం చనిపోరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనకు.” గ్రీకులోని ఆత్మవాచక దత్తి విభక్తిని మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు; అయితే ఇక్కడ జీవించడంలోనూ చనిపోవడంలోనూ తన సొంత ప్రయోజనం లేదా లక్ష్యాన్ని ఉద్దేశించడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: ఎవడూ ... కాదు
  rationale: రెండు సమాంతర వాక్యభాగాల్లోనూ సార్వత్రిక నిషేధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఈ వచనం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡμῶν
  choice: మనలో
  rationale: οὐδεὶς తో ఉన్న విభాజక షష్ఠీ భావానికి సహజమైన తెలుగు రూపం.
- source_word: ἑαυτῷ
  choice: తనకోసం
  rationale: వ్యక్తి తననే అంతిమ లక్ష్యంగా లేదా ప్రమాణంగా చేసుకొని జీవించడం లేదా చనిపోవడం అనే సందర్భార్థాన్ని తెలియజేస్తూ, మూలంలోని దత్తి విభక్తి భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ζῇ
  choice: జీవించడు
  rationale: పౌలు చెప్పే సాధారణ సత్యానికి తెలుగు సాధారణ వర్తమాన రూపం సరిపోతుంది.
- source_word: καὶ
  choice: ;
  rationale: గ్రీకులోని సమన్వయ సంబంధాన్ని తెలుగులో సమాంతర వాక్య నిర్మాణం మరియు విరామచిహ్నంతో సహజంగా చూపిస్తుంది; ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: ἀποθνῄσκει
  choice: చనిపోడు
  rationale: సాధారణ సత్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ ‘జీవించడు’తో సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: రెండు వాక్యభాగాల్లో ἑαυτῷ అనే ఆత్మవాచక దత్తి విభక్తి భావం
  choice: తనకోసం
  alternative: తనకు
  rationale: తదుపరి వచనంలో స్పష్టమయ్యే ప్రభువు-కేంద్రీకృత దిశకు విరుద్ధంగా, తననే లక్ష్యంగా చేసుకోవడం అనే భావాన్ని సందర్భం సూచిస్తుంది. అయితే ‘తనకు’ అనే మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచి మూలంలోని సాధ్యమైన విస్తృతిని కాపాడాం.
- issue: గ్రీకు ఏకవచన పుంలింగ ఆత్మవాచక రూపం
  choice: ఎవడూ ... తనకోసం
  alternative: ఎవరూ ... తమకోసం
  rationale: మూలంలోని ఏకవచన సాధారణీకరణను నిలబెడుతుంది; ఇది పురుషులకు మాత్రమే పరిమితమని సూచించకుండా తెలుగులో సంప్రదాయ సాధారణార్థక రూపంగా పనిచేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘జీవించడు/చనిపోడు’ అనే జత సాధారణ పాఠకులకు స్పష్టంగా ఉండి గ్రీకు వాక్యంలోని సమాంతరతను నిలబెడుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
