id: ROM.14.1
reference: Romans 14:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: te
  text: విశ్వాసంలో బలహీనంగా ఉన్నవారిని స్వీకరించండి[a]; అభిప్రాయాలపై వాదవివాదాలు చేయడానికి కాదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్వీకరించండి’ అనే మాటకు బదులుగా ‘మీ మధ్యకు చేర్చుకోండి’ లేదా ‘ఆహ్వానించండి’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ ఒకరిని తమ సహవాసంలోకి తీసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ భాగాన్ని ‘వివాదాస్పద ఆలోచనలకు తీర్పు తీర్చడానికి కాదు’ లేదా ‘తర్కాల విషయంలో కలహించడానికి కాదు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: బలహీనంగా ఉన్నవారిని
  rationale: నిశ్చయార్థక ఉపపదంతో వచ్చిన వర్తమాన కృదంతం ఒక వ్యక్తిని సూచిస్తోంది. ‘మనస్సాక్షిలో బలహీనుడు’ అని చెప్పడం సందర్భాధారిత వివరణను మూలపాఠంలోకి చేర్చుతుంది; అందుకే బలహీనత స్వభావాన్ని మరింత నిర్దిష్టం చేయలేదు.
- source_word: τῇ πίστει
  choice: విశ్వాసంలో
  rationale: దత్తివిభక్తి బలహీనత ఏ విషయంలో లేదా ఏ పరిధిలో ఉందో సూచిస్తుంది. ఇక్కడ πίστις‌ను ‘విశ్వాసం’గా అనువదించడం సహజం; ‘విశ్వాస సిద్ధాంతంలో’ అని అర్థాన్ని పరిమితం చేయలేదు.
- source_word: προσλαμβάνεσθε
  choice: స్వీకరించండి
  rationale: ఈ మధ్యమవాచక ఆజ్ఞారూపం ఒకరిని తమ మధ్యకు లేదా సహవాసంలోకి తీసుకోవడాన్ని సూచిస్తుంది. ‘స్వీకరించండి’ అనే పదం వ్యక్తిగత, సమూహ సంబంధ అర్థాలను రెండింటినీ మోయగలదు.
- source_word: μὴ εἰς
  choice: … చేయడానికి కాదు
  rationale: తప్పించవలసిన ఉద్దేశాన్ని ఈ నిర్మాణం తెలియజేస్తుంది. తెలుగులో ఉద్దేశార్థక క్రియారూపంతో కూడిన ‘కాదు’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: διακρίσεις
  choice: వాదించడానికి
  rationale: ఈ సందర్భంలో పదం తటస్థమైన భేదాలను కాక, ఆలోచనలను తీర్పు చేయడం లేదా వాటిపై వివాదపడడం అనే భావాన్ని కలిగి ఉంది. ప్రధాన పాఠంలో సంబంధపరమైన వివాద భావాన్ని స్పష్టంగా తెలిపే రూపాన్ని ఎంచుకున్నాం.
- source_word: διαλογισμῶν
  choice: అభిప్రాయాలపై
  rationale: ఈ బహువచన షష్ఠీవిభక్తి ఆలోచనలు, తర్కాలు లేదా అభిప్రాయాలను సూచించగలదు. సందర్భంలో చర్చనీయమైన వ్యక్తిగత నిశ్చయాలను సూచించడానికి ‘అభిప్రాయాలు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతకన్నా ఉపదేశంలోని మలుపును సూచిస్తుంది. తెలుగులో వాక్యంలోని రెండవ భాగంలో ‘అయితే’ ఉంచడం, స్వీకరించాలనే ఆజ్ఞకు వెంటనే వచ్చే పరిమితిని సహజంగా కలుపుతుంది.
theological_decisions:
- issue: πίστις పదం యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వాస నిష్ఠ
  rationale: సందర్భం వివాదాస్పద ఆచారాల విషయంలో విశ్వాసి కలిగిన నిశ్చయం లేదా ధైర్యంలోని బలహీనతను సూచిస్తుంది. అయినప్పటికీ మూలపదాన్ని ‘మనస్సాక్షి’ లేదా ‘సిద్ధాంత సమాహారం’గా నిర్దిష్టం చేయకుండా ‘విశ్వాసం’ అనే విస్తృత రూపాన్ని నిలిపాం.
- issue: διακρίσεις διαλογισμῶν యొక్క సంబంధం
  choice: వారి అభిప్రాయాలపై వాదించడం
  alternative: ఆలోచనలను తీర్పు చేయడం; తర్కాల విషయంలో కలహించడం
  rationale: ఈ పదబంధం వివాదాలు, తీర్పులు, భేద నిర్ణయాలు అనే పరస్పర సంబంధిత భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠం సందర్భానుకూలమైన వివాద భావాన్ని ఇస్తూ, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా నిర్మించినప్పటికీ, బలహీనతను ‘మనస్సాక్షి’గా విస్తరించలేదు; చివరి గ్రీకు పదబంధంలోని వివాదం/తీర్పు అనే సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
