id: ROM.14.20
reference: Romans 14:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: te
  text: ఆహారం కోసం దేవుని కార్యాన్ని కూల్చివేయకు. అన్నీ నిజంగా శుద్ధమైనవే[a]; అయితే తడబడటానికి కారణమయ్యే విధంగా తినే వ్యక్తికి అలా తినడం చెడ్డది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భం ఆహారాన్ని గురించినది కాబట్టి, ‘అన్ని ఆహార పదార్థాలూ నిజంగా శుద్ధమైనవే’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అడ్డంకి కలిగిస్తూ తినే వ్యక్తికి అలా తినడం చెడ్డది.’ గ్రీకు పదబంధం ఎవరు తడబడతారో స్పష్టంగా చెప్పదు; సందర్భంలో మరొకరికి అడ్డంకి కలిగించడం ప్రధానంగా కనిపిస్తుంది.
    reason: ambiguity
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: ఆహారం కోసం
  rationale: ἕνεκεν + షష్ఠీ విభక్తి కారణం లేదా ఉద్దేశాన్ని సూచిస్తుంది; అల్పమైన ఆహార విషయాన్ని బట్టి దేవుని కార్యానికి హాని చేయవద్దనే వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κατάλυε
  choice: కూల్చివేయకు
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థకం చర్యను నిషేధిస్తుంది; κατάλυεలోని నిర్మాణాన్ని కూల్చే రూపకాన్ని ఈ పదం నిలుపుతుంది.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: దేవుని కార్యాన్ని
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని నేరుగా నిలుపుతూ, తోటి విశ్వాసిలో లేదా సంఘంలో దేవుడు చేస్తున్న కార్యం అనే విస్తృత భావాన్ని పరిమితం చేయదు.
- source_word: πάντα μὲν καθαρά
  choice: అన్నీ నిజంగా శుద్ధమైనవే
  rationale: πάντα యొక్క విస్తృత రూపాన్ని నిలుపుతూ, సందర్భం దానిని ఆహారంతో అనుసంధానించనిస్తుంది; μένను ‘నిజంగా’, καθαράను శుద్ధతకు సంబంధించిన ‘శుద్ధమైనవి’గా వ్యక్తం చేసింది.
- source_word: κακὸν
  choice: చెడ్డది
  rationale: సందర్భంలోని నైతిక ప్రతికూలతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘దుష్టమైనది’ అనడం వ్యక్తిగత దురుద్దేశాన్ని అతిగా సూచించవచ్చు.
- source_word: τῷ ἀνθρώπῳ
  choice: వ్యక్తికి
  rationale: ἄνθρωπος ఇక్కడ ప్రతినిధి ఏకవచనంగా ఏ మనిషినైనా సూచిస్తుంది; ‘వ్యక్తి’ ఆధునిక తెలుగులో సహజంగా, లింగపరంగా సముచితంగా ఉంది.
- source_word: διὰ προσκόμματος ἐσθίοντι
  choice: ఇతరులు తడబడేలా తినే
  rationale: πρόσκομμα యొక్క తడబడే రూపకాన్ని నిలుపుతూ, తినే విధానం మరొకరికి ఆధ్యాత్మిక అడ్డంకి అవుతుందనే సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘శుద్ధమైనవి’ అనే ప్రకటన పరిధి
  choice: ‘అన్నీ నిజంగా శుద్ధమైనవే’ అని విస్తృతంగా అనువదించి, ఆహార సందర్భాన్ని వాక్యమే సూచించేలా ఉంచడం.
  alternative: ‘అన్ని ఆహార పదార్థాలూ శుద్ధమైనవే’ అని స్పష్టం చేయడం.
  rationale: గ్రీకులో πάντα అని ఉంది, ‘అన్ని ఆహారాలు’ అని స్పష్టంగా లేదు. విస్తృత పదప్రయోగం శుద్ధత భాషను, అసలు వాక్యంలోని పరిధిని నిలుపుతుంది; సందర్భం ఆహారాన్ని స్పష్టం చేస్తుంది.
- issue: διὰ προσκόμματος యొక్క అర్థం
  choice: ఆ వ్యక్తి తినడం ఇతరులు తడబడటానికి కారణమయ్యే భావాన్ని ప్రధాన పాఠ్యంలో వ్యక్తం చేయడం.
  alternative: ‘తడబడే మనస్సాక్షితో తినే వ్యక్తికి’ అని, తినే వ్యక్తే తడబడుతున్నట్లు అర్థం చేసుకోవడం.
  rationale: ఈ నిర్మాణం కొంత సంక్షిప్తంగా ఉండి రెండు వివరణలకు అవకాశం ఇస్తుంది. రోమా 14 యొక్క సమీప సందర్భంలో బలవంతుడు తన తినడం ద్వారా సహోదరునికి అడ్డంకి కలిగించడమే ప్రధాన హెచ్చరికగా కనిపిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘కూల్చివేయకు’ మరియు ‘తడబడేలా’ అనే పదాలు మూలంలోని రూపకాలను నిలుపుతాయి; ‘శుద్ధమైనవి’ శుద్ధి/అశుద్ధి భావభాషను కాపాడుతుంది.
