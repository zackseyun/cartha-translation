id: ROM.14.5
reference: Romans 14:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: te
  text: ఒక వ్యక్తి ఒక రోజును మరొక రోజుకంటే ముఖ్యమైనదిగా పరిగణిస్తాడు[a]; మరొక వ్యక్తి ప్రతి రోజునూ సమానంగా పరిగణిస్తాడు[b]. ప్రతి ఒక్కరూ తమ సొంత మనసులో పూర్తి నిశ్చయం కలిగి ఉండాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక రోజు మరొక రోజుకంటే ఎక్కువ ప్రాధాన్యమున్నదని భావిస్తాడు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ప్రతి రోజునూ పరిగణిస్తాడు’; సందర్భంలో అన్ని రోజులనూ ఒకేలా చూడడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘పూర్తి భరోసా కలిగి ఉండాలి’ లేదా ‘పూర్తిగా ఒప్పించబడాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: పరిగణిస్తాడు
  rationale: ఇక్కడ ఈ క్రియ ఖండించడం అనే అర్థంలో కాకుండా, విలువను అంచనా వేసి భేదం చేయడం అనే అర్థంలో ఉంది. ‘పరిగణిస్తాడు’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: ఒక రోజును మరొక రోజుకంటే ముఖ్యమైనదిగా
  rationale: παράతో ఉన్న నిర్మాణం రోజుల మధ్య తులనను సూచిస్తుంది. ఏ ప్రత్యేక దినాలు ఉద్దేశించబడ్డాయో పేర్కొనకుండా ఆ తులనాత్మక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: πᾶσαν ἡμέραν
  choice: ప్రతి రోజునూ సమానంగా
  rationale: గ్రీకులో అక్షరార్థంగా ‘ప్రతి రోజు’ అని ఉన్నా, మొదటి వాక్యభాగంతో ఉన్న వ్యత్యాసం రోజుల మధ్య భేదం చేయకపోవడాన్ని సూచిస్తుంది. ‘సమానంగా’ ఆ అంతర్నిహిత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἕκαστος
  choice: ప్రతి ఒక్కరూ
  rationale: ఏకవచన పంపిణీ భావాన్ని తెలుగులో సహజంగా, అందరినీ చేర్చే విధంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: తమ సొంత మనసులో
  rationale: νοῦς ఇక్కడ ఆలోచన, అవగాహన, అంతర్గత నిర్ణయానికి సంబంధించిన ‘మనసు’ను సూచిస్తుంది. ‘ప్రతి ఒక్కరూ’తో ‘తమ’ వాడటం ఆధునిక తెలుగులో సహజమైన పంపిణీ ప్రయోగం.
- source_word: πληροφορείσθω
  choice: పూర్తి నిశ్చయం కలిగి ఉండాలి
  rationale: ఈ వర్తమాన ఆజ్ఞారూపం స్థిరమైన సంపూర్ణ నమ్మకం లేదా ధృఢనిశ్చయాన్ని సూచిస్తుంది. ఈ అనువాదం కేవలం అభిప్రాయం కాకుండా వ్యక్తిగతంగా పూర్తిగా నిశ్చయించబడిన స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: ఇక్కడ ప్రస్తావించిన ‘రోజులు’ ఏవో నిర్దిష్టంగా చెప్పాలా?
  choice: సాధారణంగా ‘రోజు’ అనే పదాన్నే ఉంచడం
  alternative: విశ్రాంతిదినాలు, యూదుల పండుగ దినాలు, లేదా ఉపవాస దినాలు అని నిర్దిష్టీకరించడం
  rationale: పౌలు ఈ వచనంలో ఏ రకమైన రోజులు ఉద్దేశించాడో స్పష్టంగా చెప్పలేదు. అందువల్ల మూలంలోని సాధారణతను, వ్యాఖ్యానానికి ఉన్న అవకాశాన్ని అనువాదం కాపాడుతుంది.
- issue: ఏకవచన పంపిణీ భావాన్ని తెలుగులో ఎలా వ్యక్తం చేయాలి?
  choice: ‘ప్రతి ఒక్కరూ తమ సొంత మనసులో’ అనే సహజ తెలుగు నిర్మాణం
  alternative: ‘ప్రతి ఒక్కరు తన సొంత మనసులో’ అనే మరింత రూపపరమైన ఏకవచన నిర్మాణం
  rationale: మూలంలోని వ్యక్తిగత బాధ్యతను ‘ప్రతి ఒక్కరూ’ నిలుపుతుంది; ‘తమ’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, ఉద్దేశించిన వారిని అనవసరంగా పురుషులకు మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి వాడబడింది. ‘విశ్రాంతిదినం,’ ‘పండుగ దినం,’ ‘ఉపవాస దినం’ వంటి వ్యాఖ్యానాత్మక నిర్దిష్టీకరణలు చేర్చలేదు. మూలంలోని తులన, వ్యక్తిగత నిశ్చయం, మరియు రోజుల స్వరూపంపై ఉన్న అస్పష్టతను నిలుపుకున్నాం.
