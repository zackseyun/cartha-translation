id: ROM.14.13
reference: Romans 14:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: te
  text: కాబట్టి, ఇకపై మనం ఒకరినొకరం తీర్పు తీర్చకుందాం. బదులుగా, సహోదరుని[a] మార్గంలో తడబడే రాయినిగానీ, ఉచ్చునిగానీ[b] వేయకూడదని నిర్ణయించుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహోదరుని లేదా సహోదరిని’; గ్రీకులో ఏకవచనంగా ‘సహోదరుడు’ ఉంది. ఇక్కడ ఇది తోటి విశ్వాసిని సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘పడిపోవడానికి కారణం’ లేదా ‘అడ్డంకి.’ ఇక్కడ ‘ఉచ్చు’ అనేది కేవలం మనస్తాపం కలిగించేదాన్ని కాదు; మరొకరు పాపంలో పడటానికి లేదా విశ్వాసంలో తడబడటానికి కారణమయ్యేదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: కాబట్టి, ఇకపై
  rationale: οὖν ముందటి వాదననుంచి వచ్చే నిర్ధారణను సూచిస్తుంది; Μηκέτι కొనసాగుతున్న ఆచరణను ఇక మానాలని తెలియజేస్తుంది.
- source_word: ἀλλήλους κρίνωμεν
  choice: మనం ఒకరికి ఒకరం తీర్పు తీర్చకుందాం
  rationale: ప్రోత్సాహార్థక subjunctive భావాన్ని ‘తీర్చకుందాం’ సహజంగా వ్యక్తం చేస్తుంది; κρίνω యొక్క న్యాయనిర్ణయ భావాన్ని నిలుపుతుంది.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: దానికి బదులు ... నిర్ణయించుకోండి
  rationale: మొదటి κρίνωతో ఉన్న పదప్రయోగాన్ని తెలుగులో పూర్తిగా అలాగే ఉంచితే అసహజత లేదా అపార్థం కలగవచ్చు; ఇక్కడ స్వీయ ప్రవర్తనపై దృఢ నిర్ణయం తీసుకోవడం ప్రధాన భావం.
- source_word: τὸ μὴ τιθέναι
  choice: పెట్టకూడదని
  rationale: Articular infinitive, ఏమి నిర్ణయించుకోవాలో తెలిపే విషయవాక్యంగా పనిచేస్తుంది.
- source_word: πρόσκομμα
  choice: అతడు తడబడే అడ్డంకి
  rationale: అడ్డంకి అనే రూపకాన్ని నిలుపుతూ, ఇది సాధారణ అవరోధం మాత్రమే కాక సహోదరుడు తడబడేందుకు కారణమయ్యేదని స్పష్టం చేస్తుంది.
- source_word: τῷ ἀδελφῷ
  choice: ఒక సహోదరుని ఎదుట
  rationale: గ్రీకు పుంలింగ ఏకవచనాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలోని తోటి విశ్వాసి భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: ἢ σκάνδαλον
  choice: పాపంలో పడే ఉచ్చు
  rationale: σκάνδαλον యొక్క మూల రూపకమైన ఉచ్చు/పడగొట్టే కారణాన్ని వ్యక్తం చేసి, ఆధునిక ‘మనస్తాపం’ అనే బలహీన అర్థాన్ని నివారిస్తుంది; ἢను ‘గాని ... గాని’ నిర్మాణంతో కాపాడింది.
theological_decisions:
- issue: ἀδελφῷ యొక్క ప్రతినిధి పుంలింగ ఏకవచనం
  choice: సహోదరుని
  alternative: సహోదరుని లేదా సహోదరిని; తోటి విశ్వాసిని
  rationale: మూలంలోని వ్యాకరణ రూపాన్ని ప్రధాన పాఠ్యంలో కాపాడుతూ, సందర్భంలో ఇది ఏ లింగానికి చెందిన తోటి విశ్వాసినైనా సూచించగలదని పాదటిప్పణి తెలియజేస్తుంది.
- issue: σκάνδαλον యొక్క నైతిక-ఆధ్యాత్మిక భావం
  choice: పాపంలో పడే ఉచ్చు
  alternative: పడిపోవడానికి కారణం; చిక్కు; అభ్యంతరం
  rationale: ఇది కేవలం భావోద్వేగ మనస్తాపం కాదని, మరొకరిని పాపంలో లేదా ఆధ్యాత్మిక పతనంలోకి నడిపించే దానిని సూచిస్తుందని స్పష్టపరుస్తుంది.
- issue: κρίνωμεν / κρίνατε పదపునరుక్తి
  choice: తీర్పు తీర్చకుందాం / నిర్ణయించుకోండి
  alternative: తీర్పు తీర్చకుందాం / దీనికి తీర్పు తీర్చండి
  rationale: గ్రీకులో ఒకే క్రియకు సందర్భానుసారంగా రెండు భావాలు ఉన్నాయి. తెలుగులో ఒకే పదాన్ని బలవంతంగా వాడకుండా, ఇతరులను తీర్పు తీర్చడం మరియు తన ప్రవర్తనపై నిర్ణయం తీసుకోవడం మధ్య ఉద్దేశిత వ్యత్యాసాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘తడబడే అడ్డంకి’ మరియు ‘పాపంలో పడే ఉచ్చు’ ద్వారా గ్రీకు రూపకాలను సహజంగా నిలిపింది; వాక్యంలోని రెండు ఆదేశాల మధ్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచింది.
