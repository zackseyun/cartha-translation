  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ βλασφημείσθω οὖν ὑμῶν τὸ ἀγαθόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: te
  text: కాబట్టి, మీ మేలు గురించి చెడుగా మాట్లాడనివ్వకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ మేలు దూషింపబడనివ్వకండి” లేదా “నిందించబడనివ్వకండి.” గ్రీకు క్రియ అవమానకరమైన లేదా అపకీర్తికరమైన మాటలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: గురికానివ్వకండి
  rationale: వర్తమానకాల కర్మణి ఆజ్ఞార్థక క్రియతో కలిసి నిషేధాన్ని సూచిస్తుంది; తెలుగులో ‘...కానివ్వకండి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: βλασφημείσθω
  choice: దూషణకు గురికానివ్వకండి
  rationale: ఇక్కడ కర్త దేవుడు కాదు, ‘మేలైనది’; అందువల్ల ప్రత్యేకంగా మతపరమైన అర్థం కలిగించగల ‘దైవదూషణ’ కంటే, అవమానకరంగా లేదా అపకీర్తికరంగా మాట్లాడబడటాన్ని సూచించే ‘దూషణకు గురికావడం’ తగినది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది.
- source_word: ὑμῶν
  choice: మీకు
  rationale: ‘మేలైనది’తో వ్యక్తిగత సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘మీ మేలు’ అనే పదబంధంలో కలిగే ‘మీ సంక్షేమం’ అనే సంకుచిత అర్థాన్ని తగ్గిస్తుంది.
- source_word: τὸ ἀγαθόν
  choice: మేలైనది
  rationale: నపుంసకలింగ విశేషణం నామవాచకంగా వాడబడింది. ‘మేలైనది’ దాని విస్తృతత్వాన్ని నిలుపుతూ, దానిని స్వేచ్ఛ, హక్కు లేదా ప్రయోజనం అని ప్రత్యేకంగా నిర్ధారించదు.
theological_decisions:
- issue: τὸ ἀγαθόν (‘మీకు మేలైనది’) దేనిని సూచిస్తుంది?
  choice: సూచనను విస్తృతంగానే ఉంచి ‘మీకు మేలైనది’ అని అనువదించాం.
  alternative: మీ స్వేచ్ఛ; మీ హక్కు; మీ మంచి బోధ లేదా సాక్ష్యం
  rationale: గ్రీకు వాక్యం సంక్షిప్తంగా ఉండి, వివాదాస్పద విషయాల్లో విశ్వాసుల నమ్మకం, స్వేచ్ఛ లేదా దానివల్ల కలిగే మేలును సూచించవచ్చు. ఒకే భావానికి పరిమితం చేయడం మూలపాఠంలో లేని వ్యాఖ్యానాన్ని చేర్చినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దూషణ’ బలమైన ప్రతికూల వాచిక ప్రవర్తనను తెలియజేస్తుంది; ‘మేలైనది’ మూలంలోని ఉద్దేశపూర్వక విస్తృతత్వాన్ని కాపాడుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
