review_pass:
  verdict: approve
  source_fidelity: The Telugu accurately represents the rhetorical challenge, the household-slave relationship in ἀλλότριον οἰκέτην, the accountability expressed by τῷ ἰδίῳ κυρίῳ, the stand/fall contrast, the future passive force of σταθήσεται, and the causal assurance that the Lord is able to make him stand. The final ‘ప్రభువు’ appropriately retains the most likely theological referent while the footnote preserves the alternative analogical reading.
  naturalness: The wording is natural, clear modern standard Telugu with an appropriately serious register. ‘తీర్పు తీర్చడానికి నీవెవరు?’ and the repeated నిలు-/నిలబెట్టు wording communicate the Greek’s rebuke and verbal linkage well. ‘ఎదుటనే’ naturally conveys the accountability sense in context.
  terminology: ‘ఇంటి దాసుడు’ responsibly reflects οἰκέτης in this household and bonded-status context. ‘యజమాని’ is idiomatic for the human master in the analogy, while ‘ప్రభువు’ is appropriate for the likely divine sense of the final ὁ κύριος. Footnote b adequately identifies the Greek lexical connection without forcing unnatural identical Telugu wording.
