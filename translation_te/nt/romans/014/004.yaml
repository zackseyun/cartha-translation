id: ROM.14.4
reference: Romans 14:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: te
  text: వేరొకరి ఇంటి దాసునికి[a] తీర్పు తీర్చడానికి నీవెవరు? తన సొంత యజమాని[b] ఎదుటనే అతడు నిలుస్తాడు లేదా పడిపోతాడు. అయితే అతడు నిలబెట్టబడతాడు; ఎందుకంటే అతణ్ణి నిలబెట్టడానికి ప్రభువు[c] సమర్థుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు οἰκέτης ఇంటి పరివారంలో పనిచేసే సేవకుణ్ణి లేదా దాసుణ్ణి సూచిస్తుంది; ఇక్కడ ఆధీన సంబంధాన్ని నిలుపడానికి ‘ఇంటి దాసుడు’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘యజమాని’ అని, తరువాత ‘ప్రభువు’ అని అనువదించిన రెండు చోట్లా గ్రీకులో κύριος అనే ఒకే పదం ఉంది.
    reason: lexical_connection
  - marker: c
    text: ఇక్కడ ‘ప్రభువు’ దైవిక అర్థంలో ఉన్న ప్రభువును సూచించడం ఎక్కువ సంభావ్యం. అయితే కొందరు దీన్ని ఉపమానంలోని దాసుని యజమానినే సూచిస్తుందని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: తీర్పు తీర్చడానికి నీవెవరు?
  rationale: σὺ అనే ఉద్ఘాటనతో కూడిన ప్రశ్నలోని గద్దింపు స్వరాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ὁ κρίνων ను తెలుగు వాక్యనిర్మాణానికి తగిన ఉద్దేశార్థక రూపంలో ఇచ్చింది.
- source_word: ἀλλότριον οἰκέτην
  choice: వేరొకరి ఇంటి దాసునికి
  rationale: οἰκέτης సాధారణ సేవకుడికంటే ఇంటి పరివారానికి చెందిన దాసుడు లేదా సేవకుణ్ణి సూచిస్తుంది. ‘ఇంటి దాసుడు’ ఆ గృహసంబంధాన్నీ, ఆధీన సామాజిక స్థితినీ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: తన సొంత యజమాని ఎదుటనే
  rationale: దత్తివిభక్తి ఇక్కడ ఎవరి సమక్షంలో లేదా ఎవరికే జవాబుదారిగా నిలవడం, పడిపోవడం జరుగుతుందో సూచిస్తుంది. దాసుని ఉపమానంలో ‘యజమాని’ సహజమైన తెలుగు పదం; ‘ఎదుటనే’ ఆ జవాబుదారీతనాన్ని స్పష్టం చేస్తుంది.
- source_word: στήκει ἢ πίπτει
  choice: అతడు నిలుస్తాడు లేదా పడిపోతాడు
  rationale: మూలంలోని పరస్పర విరుద్ధమైన రెండు క్రియాచిత్రాలను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: σταθήσεται
  choice: అతడు నిలబెట్టబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని స్పష్టంగా కాపాడి, తరువాతి వాక్యంలో వెల్లడయ్యే ప్రభువు కార్యాన్ని ముందుగానే సూచిస్తుంది.
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: ఎందుకంటే అతణ్ణి నిలబెట్టడానికి ప్రభువు సమర్థుడు
  rationale: γάρ ఇచ్చే కారణసంబంధాన్ని, δυνατεῖ తెలిపే సామర్థ్యాన్ని, అలాగే σταθήσεται—στῆσαι మధ్యనున్న ‘నిలబెట్టు’ పదబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: చివరి ὁ κύριος ఎవరిని సూచిస్తుంది?
  choice: దైవిక అర్థంలోని ‘ప్రభువు’
  alternative: ఉపమానంలోని దాసుని మానవ యజమాని
  rationale: ‘అతడు నిలబెట్టబడతాడు’ అనే హామీని ప్రభువు సామర్థ్యంతో ఆధారపరచడం పౌలు వాదనలో దైవిక ప్రభువును సూచించే అవకాశాన్ని బలపరుస్తుంది. అయినా గృహదాసుని ఉపమానం నుంచి అదే κύριος పదం కొనసాగడం వల్ల మానవ యజమాని అనే ప్రతిధ్వని పూర్తిగా తొలగిపోదు; అందుకే దాన్ని పాదసూచికలో ఉంచాం.
- issue: రెండు చోట్ల κύριος పదానికి తెలుగు రూపం
  choice: దాసుని సందర్భంలో ‘యజమాని’, దైవిక సందర్భంలో ‘ప్రభువు’
  alternative: రెండు చోట్లా ‘ప్రభువు’ అని పదరూప ఏకత్వాన్ని నిలపడం
  rationale: తెలుగులో మానవ దాసయజమాని సందర్భంలో ‘యజమాని’ సహజంగా, స్పష్టంగా ఉంటుంది; చివరి దైవిక సూచనకు ‘ప్రభువు’ తగినది. మూలంలోని ఒకే గ్రీకు పదం వాడుకను పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘నిలుస్తాడు—పడిపోతాడు—నిలబెట్టబడతాడు—నిలబెట్టడానికి’ అనే మూలంలోని పదచిత్ర సంబంధాన్ని ఉద్దేశపూర్వకంగా కాపాడింది; మానవ యజమాని మరియు దైవిక ప్రభువు మధ్య ఉన్న మూలపద సంబంధాన్ని పాదసూచికలో వెల్లడించింది.
