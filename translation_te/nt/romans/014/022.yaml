id: ROM.14.22
reference: Romans 14:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: te
  text: నీకు ఉన్న విశ్వాసాన్ని[a] దేవుని ఎదుట, నీకే ఉంచుకో. తాను ఆమోదించే విషయంలో తనను తాను తీర్పు తీర్చుకోనివాడు[b] ధన్యుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు ఉన్న దృఢనమ్మకాన్ని.” ఇక్కడ “విశ్వాసం” అనేది వివాదాస్పద విషయంపై వ్యక్తికి ఉన్న నిశ్చయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తాను ఆమోదించే విషయంలో తనను తాను దోషిగా నిర్ధారించుకోనివాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: πίστις అనే కీలక పదానికి సాధారణ అనువాదమైన ‘విశ్వాసం’ను నిలుపుతుంది. ఈ సందర్భంలో వివాదాస్పద విషయంపై దేవుని ఎదుట వ్యక్తికి ఉన్న స్థిరమైన నమ్మకం అనే భావం సందర్భం ద్వారా వెల్లడవుతుంది.
- source_word: κατὰ σεαυτὸν
  choice: నీలోనే ఉంచుకో
  rationale: తన నమ్మకాన్ని ఇతరులపై రుద్దకుండా వ్యక్తిగతంగా ఉంచుకోవాలనే సందర్భోచిత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని ఎదుట
  rationale: దేవుని సన్నిధిలో, ఆయనకు జవాబుదారిగా ఉండే భావాన్ని సూటిగా నిలుపుతుంది.
- source_word: μακάριος
  choice: ధన్యుడు
  rationale: కేవలం మానసిక సంతోషం కాక, నైతిక-ఆధ్యాత్మిక శ్రేయస్సును సూచించే పదంగా మూలంలోని బరువును నిలుపుతుంది.
- source_word: κρίνων ἑαυτὸν
  choice: తనకు తానే తీర్పు తీర్చుకోనివాడు
  rationale: κρίνω యొక్క ప్రాథమిక ‘తీర్పు తీర్చు’ భావాన్ని నిలిపి, సందర్భంలో ఉండే స్వీయదోషనిర్ణయ ఛాయను పాఠకుడు గ్రహించడానికి వీలు కల్పిస్తుంది.
- source_word: ἐν ᾧ δοκιμάζει
  choice: తాను ఆమోదించే దాని మూలంగా
  rationale: పరిశీలించి సరైనదిగా ఎంచుకున్నదే స్వీయతీర్పుకు కారణం లేదా ఆధారం కావచ్చనే ἐν యొక్క సాధనార్థక ఛాయను స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: వివాదాస్పద ఆచారాల సందర్భంలో πίστις అర్థం
  choice: ఆ విషయంపై దేవుని ఎదుట వ్యక్తికి ఉన్న నమ్మకం అనే సందర్భార్థంతో ‘విశ్వాసం’
  alternative: ‘దృఢనమ్మకం’ లేదా ‘వ్యక్తిగత నిశ్చయం’
  rationale: సమీప సందర్భం ఆహారం, దినాల ఆచరణ, మనస్సాక్షి వంటి వివాదాస్పద విషయాల గురించి ఉంది. అయినప్పటికీ కీలక పదమైన πίστις ను ‘విశ్వాసం’గా ఉంచి, సందర్భార్థాన్ని పాదసూచికలో తెలియజేయడం మూలంలోని పదసంబంధాన్ని కాపాడుతుంది.
- issue: κρίνων ἑαυτὸν లో తీర్పు లేదా దోషనిర్ణయం
  choice: తనకు తానే తీర్పు తీర్చుకోవడం
  alternative: తనను తానే దోషిగా నిర్ధారించుకోవడం
  rationale: ఈ సందర్భంలో ప్రతికూల తీర్పు భావం బలంగా ఉన్నప్పటికీ, ‘దోషిగా నిర్ధారించు’ అని ప్రధాన పాఠంలో పెట్టడం మూలంలోని కొంత విస్తృతమైన κρίνω భావాన్ని సంకుచితం చేస్తుంది. అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సూటిగా, గౌరవప్రదంగా అనువదించబడింది. రెండవ వాక్యంలో లింగనిరపేక్ష ఏకవచనాన్ని సహజంగా వ్యక్తం చేయడం కష్టమైనందున సంప్రదాయ సాధారణార్థక ‘ధన్యుడు’ వాడబడింది. ‘నీలోనే ఉంచుకో’ అనేది రహస్యంగా దేవుని నుండి దాచుకోవడం కాక, దేవుని ఎదుట వ్యక్తిగతంగా ఉంచుకోవడం అనే రెండు మూలపదబంధాల భేదాన్ని కాపాడుతుంది.
