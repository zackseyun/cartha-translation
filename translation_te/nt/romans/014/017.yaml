id: ROM.14.17
reference: Romans 14:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: te
  text: ఎందుకంటే దేవుని రాజ్యం తినడం, తాగడం కాదు; పరిశుద్ధాత్మలో నీతి[a], శాంతి, ఆనందం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయం.’ గ్రీకు δικαιοσύνη అనే పదం నీతిని లేదా న్యాయాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία
  choice: రాజ్యం
  rationale: దేవుని పరిపాలనను, ఆయన రాజ్య వాస్తవాన్ని రెండింటినీ సూచించగల ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: βρῶσις καὶ πόσις
  choice: తినడం, తాగడం
  rationale: రెండు గ్రీకు క్రియానామాల సమాంతర నిర్మాణాన్ని, వివాదాస్పద ఆచారాల సందర్భాన్ని సహజంగా నిలుపుతుంది.
- source_word: δικαιοσύνη
  choice: నీతి
  rationale: పౌలు రచనల్లో ఈ పదానికి సాధారణంగా సరిపోయే తెలుగు పదం; నైతికంగా సరైన స్థితి, ప్రవర్తన అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘న్యాయం’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: εἰρήνη
  choice: సమాధానం
  rationale: వ్యక్తిగత ప్రశాంతతతో పాటు సమాజంలోని సామరస్యాన్ని కూడా తెలిపే స్థిరమైన బైబిలు తెలుగు ప్రయోగం.
- source_word: χαρά
  choice: ఆనందం
  rationale: పౌలు వాడుకలోని లోతైన సంతోష భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: పరిశుద్ధాత్మలో
  rationale: గ్రీకు ἐν లోని పరిధి లేదా సాధన సంబంధమైన ఉద్దేశపూర్వక అస్పష్టతను పరిష్కరించకుండా నిలుపుతుంది; ఈ పదబంధం ఇక్కడ పరిశుద్ధాత్మనే సూచిస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందున్న వాదనకు ఈ వాక్యం ఇచ్చే వివరణాత్మక కారణ సంబంధాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: పౌలు వాడిన δικαιοσύνη పదానికి అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ప్రధాన పాఠ్యంలో పౌలు రచనలకు సాధారణమైన ‘నీతి’ని ఉంచుతూ, పదంలోని సామాజిక న్యాయ భావసాధ్యతను పాదసూచికలో కాపాడాం.
- issue: ἐν πνεύματι ἁγίῳ లో ἐν యొక్క భావం
  choice: పరిశుద్ధాత్మలో
  alternative: పరిశుద్ధాత్మ ద్వారా
  rationale: ‘లో’ అనే రూపం గ్రీకు పదబంధంలోని పరిధి మరియు సాధనం అనే రెండు భావసాధ్యతలను నిలుపుతుంది; ‘ద్వారా’ అని మార్చడం వాటిలో ఒకదానిని మాత్రమే నిర్ణయిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని విరుద్ధ సమాంతర నిర్మాణాన్ని అర్ధవిరామంతో నిలిపాం.
