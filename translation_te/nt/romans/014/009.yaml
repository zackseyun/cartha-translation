  terminology: ‘మెస్సీయ’ appropriately preserves Χριστός as a title. ‘పరిపాలించు’ is a suitable verbal rendering of κυριεύσῃ and does not introduce the noun-title ‘ప్రభువు.’ The footnote appropriately distinguishes the explicit main-text ‘మళ్లీ జీవించాడు’ from the Greek wording ‘జీవించాడు.’
