  rationale: 'The revision explicitly renders γάρ as ‘ఎందుకంటే’ and retains εἰς τοῦτο plus ἵνα as the focused Telugu purpose construction ‘పరిపాలించడానికే.’ It preserves the source''s sequence and its restrained resurrection implication: the main text says ‘మళ్లీ జీవించాడు,’ while the footnote records the less explicit Greek wording and the possible expanded sense. No doctrinally loaded noun-title is added for the verbal κυριεύσῃ.'
