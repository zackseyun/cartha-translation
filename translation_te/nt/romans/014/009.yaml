  source_fidelity: 'The draft accurately renders the purpose expressed by εἰς τοῦτο and ἵνα, the death-and-life sequence, and Messiah''s dominion over the dead and living. However, γάρ is not adequately represented: the emphatic -నే in ‘ఈ ఉద్దేశంతోనే’ does not itself convey the explanatory ‘for/because’ connection to the preceding context.'
