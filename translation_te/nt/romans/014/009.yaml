source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: te
  text: ఎందుకంటే, చనిపోయినవారిపైనా జీవించి ఉన్నవారిపైనా పరిపాలించడానికే మెస్సీయ చనిపోయి మళ్లీ జీవించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జీవించాడు’; సందర్భాన్ని మరింత స్పష్టంగా చెబితే, ‘తిరిగి జీవానికి వచ్చాడు.’ గ్రీకు పాఠం అక్షరార్థంగా ‘చనిపోయి జీవించాడు’ అని చెబుతుంది; ఇక్కడి సందర్భం పునరుత్థాన జీవాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: ఈ ఉద్దేశంతోనే
  rationale: ఈ ప్రయోగం కారణం కంటే లక్ష్యాన్ని లేదా ఉద్దేశాన్ని సూచిస్తుంది; ‘ఉద్దేశంతోనే’ దాని ప్రయోజనార్థక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: γὰρ
  choice: వాక్యంలోని ‘నే’ ద్వారా వివరణాత్మక సంబంధం
  rationale: γάρ మునుపటి వాక్యానికి వివరణాత్మక ఆధారాన్ని ఇస్తుంది. తెలుగులో ప్రత్యేకంగా ‘ఎందుకంటే’ అని చేర్చడం కంటే ‘ఈ ఉద్దేశంతోనే’ అనే నిర్మాణం ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ యేసును సూచించే బిరుదుగా ఉంది; ‘మెస్సీయ’ దాని అభిషిక్త పాలకుడనే బిరుదార్థాన్ని నిలుపుతుంది.
- source_word: ἀπέθανεν
  choice: చనిపోయి
  rationale: సాధారణ భూతకాల క్రియార్థాన్ని నేరుగా వ్యక్తం చేస్తుంది; అనవసర విస్తరణ లేదు.
- source_word: ἔζησεν
  choice: మళ్లీ జీవించాడు
  rationale: ‘చనిపోయాడు’ అనే క్రియతో జతగా ఉండటం వల్ల మరణానంతర జీవాన్ని సందర్భం సూచిస్తుంది. ‘మళ్లీ’ ఆ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; మూలంలోని సరళమైన ‘జీవించాడు’ అనే రూపాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
- source_word: ἵνα
  choice: పరిపాలించేందుకు
  rationale: తెలుగు క్రియార్థక నిర్మాణం ఉద్దేశాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: νεκρῶν
  choice: చనిపోయినవారిపైనా
  rationale: నామవాచకంగా వాడిన బహువచన విశేషణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ζώντων
  choice: జీవించి ఉన్నవారిపైనా
  rationale: νεκρῶνకు వ్యతిరేకంగా ఉన్న వర్తమాన కృదంతాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: κυριεύσῃ
  choice: పరిపాలించేందుకు
  rationale: ఈ క్రియ అధికారం చెలాయించడం, ఏలడం అనే భావాన్ని ఇస్తుంది. ‘పరిపాలించు’ దాన్ని క్రియగానే నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: ἔζησενలోని పునరుత్థాన సంబంధిత భావం
  choice: మళ్లీ జీవించాడు
  alternative: జీవించాడు; తిరిగి జీవానికి వచ్చాడు
  rationale: ‘చనిపోయి జీవించాడు’ అనే జత మరియు చనిపోయినవారిపైనా జీవించి ఉన్నవారిపైనా అధికారం అనే సందర్భం పునరుత్థాన జీవాన్ని సూచిస్తాయి. అయితే మూలక్రియ స్వయంగా ‘లేచాడు’ అని చెప్పదు కాబట్టి దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: κυριεύσῃలోని ప్రభుత్వ భావం
  choice: పరిపాలించేందుకు
  alternative: ప్రభువుగా ఉండేందుకు; ఏలేందుకు
  rationale: మూలంలో ఇది κύριος అనే నామపదం కాక క్రియ. అందువల్ల క్రియాత్మక ఆధిపత్యాన్ని నేరుగా తెలిపే ‘పరిపాలించు’ను ఎంచుకుని, ‘ప్రభువు’ అనే బిరుదును అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలి. ఉద్దేశాన్ని తెలుపడానికి సహజమైన క్రియార్థక నిర్మాణం వాడబడింది; మూలంలోని పునరుత్థాన సూచనను అతిగా విప్పకుండా పాదటిప్పణితో నిజమైన పదార్థ భేదం భద్రపరచబడింది.
