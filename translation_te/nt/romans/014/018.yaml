id: ROM.14.18
reference: Romans 14:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: te
  text: ఎందుకంటే ఈ విధంగా క్రీస్తుకు సేవచేసేవాడు దేవునికి ప్రీతికరుడూ, మనుషులచేత ఆమోదించబడినవాడూ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ఈ విధంగా
  rationale: సమీప సందర్భంలో చెప్పిన నీతి, సమాధానం, పరిశుద్ధాత్మలో ఆనందం ఆధారంగా క్రీస్తుకు సేవచేయడాన్ని సూచించే సహజమైన తెలుగు రూపం; గ్రీకు పదబంధంలోని సూచనాత్మక స్వభావాన్ని నిలుపుతుంది.
- source_word: δουλεύων τῷ Χριστῷ
  choice: క్రీస్తుకు సేవచేసేవాడు
  rationale: δουλεύω యొక్క ప్రభువుకు లోబడి సేవచేయడం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; తెలుగులో అతిగా కఠినంగా వినిపించే ‘దాసత్వం చేసేవాడు’ను నివారిస్తుంది.
- source_word: εὐάρεστος τῷ θεῷ
  choice: దేవునికి ప్రీతికరుడు
  rationale: దేవునికి ఇంపైనవాడు లేదా ఆమోదయోగ్యుడు అనే భావాన్ని గౌరవప్రదమైన, సాధారణ తెలుగు పదంతో వ్యక్తపరుస్తుంది.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: మనుషుల దృష్టిలో యోగ్యుడిగా నిరూపించబడినవాడు
  rationale: δόκιμος లోని పరీక్షించబడి ఆమోదం పొందిన లేదా యోగ్యుడని తేలిన భావాన్ని నిలుపుతుంది; τοῖς ἀνθρώποις ను లింగసమావేశకమైన సాధారణ మానవ సమూహంగా అనువదిస్తుంది.
theological_decisions:
- issue: ἐν τούτῳ యొక్క సూచన
  choice: ఈ విధంగా
  alternative: ఈ విషయంలో
  rationale: గ్రీకు రూపం ‘ఇందులో/దీనివల్ల’ అని కూడా అర్థమివ్వగలదు. సందర్భానుసారంగా జీవించి క్రీస్తుకు సేవచేసే విధానాన్ని సూచించడం సహజం; అయినా ఏకైక నిర్దిష్ట అంశానికి పరిమితం చేయలేదు.
- issue: τοῖς ἀνθρώποις యొక్క పరిధి
  choice: మనుషుల దృష్టిలో
  alternative: పురుషులచేత
  rationale: ἄνθρωποι సాధారణంగా మానవులను లేదా ప్రజలను సూచిస్తుంది; ఇక్కడ పురుష లింగానికి మాత్రమే పరిమితం చేయడానికి పాఠ్య ఆధారం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. మూలంలోని కారణార్థక γάρ ను ‘ఎందుకంటే’తో, దేవుని మరియు మనుషుల అంచనాల సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపాం.
