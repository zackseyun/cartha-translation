id: ROM.14.19
reference: Romans 14:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: te
  text: కాబట్టి, సమాధానానికి తోడ్పడేవాటినీ, ఒకరినొకరిని బలపరిచేవాటినీ మనం అనుసరిద్దాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “కాబట్టి, సమాధానానికి సంబంధించిన వాటినీ, ఒకరినొకరిని బలపరచడానికి సంబంధించిన వాటినీ మనం అనుసరిద్దాం.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: కాబట్టి
  rationale: ఈ రెండు నిర్ధారణార్థక అవ్యయాలు ముందున్న వాదననుంచి తీసిన ముగింపును సూచిస్తున్నాయి; ఆధునిక తెలుగులో ‘కాబట్టి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὰ τῆς εἰρήνης
  choice: సమాధానాన్ని కలిగించే వాటిని
  rationale: అక్షరార్థంగా ‘సమాధానానికి సంబంధించిన వాటిని’ అనే నిర్మాణం; సందర్భంలో సమాధానాన్ని పెంపొందించే సంగతులు లేదా చర్యలు ఉద్దేశించబడ్డాయి.
- source_word: διώκωμεν
  choice: అనుసరిద్దాం
  rationale: వర్తమాన కర్తరి ప్రేరణార్థక సంభావన రూపం సమూహంగా నిరంతరం చురుకుగా ప్రయత్నించాలనే పిలుపునిస్తుంది; ‘అనుసరిద్దాం’ దాని లక్ష్యోద్దేశిత బలాన్ని నిలుపుతుంది.
- source_word: τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους
  choice: ఒకరినొకరు బలపరిచే వాటిని
  rationale: οἰκοδομή యొక్క మూలభావం ‘కట్టడం’; ఇక్కడ అది సంఘ సభ్యులు పరస్పరం ఆత్మీయంగా అభివృద్ధి చెందేలా చేయడాన్ని రూపకాలంకారంగా సూచిస్తుంది. ‘బలపరిచే’ అనేది సాధారణ పాఠకులకు సహజంగా ఉండి పరస్పర భావాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: పరస్పర అభివృద్ధి యొక్క పరిధి
  choice: విశ్వాసులు సమాధానాన్నీ పరస్పర బలపరచడాన్నీ సమూహంగా అనుసరించాలనే ఉద్బోధ
  alternative: కేవలం వ్యక్తిగత నైతిక అభివృద్ధిని సూచించే పఠనం
  rationale: మొదటి పురుష బహువచన ప్రేరణార్థక రూపం, ἀλλήλους అనే పరస్పర సర్వనామం సంఘజీవితంలోని ఉమ్మడి బాధ్యతను సూచిస్తున్నాయి; అనువాదం ఏ ప్రత్యేక మతశాఖ సిద్ధాంతాన్నీ చేర్చకుండా ఆ సామూహిక భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, స్పష్టమైన ఉద్బోధనా శైలి. గ్రీకు వాక్యంలోని రెండు సమాంతర τὰ నిర్మాణాలను తెలుగులో ‘వాటినీ ... వాటినీ’ ద్వారా ప్రతిబింబించాం; ‘బలపరిచే’ అనే సహజ రూపకంతో οἰκοδομή భావాన్ని అందించాం.
