  source_fidelity: 'మూల గ్రీకు వచనంలోని రెండు సమాంతర ప్రకటనలను అనువాదం సరిగ్గా ప్రతిబింబిస్తుంది: పౌలు ప్రభువైన యేసులో తనకు ఉన్న జ్ఞానాన్నీ స్థిర నిశ్చయాన్నీ తెలియజేస్తాడు; ఏదీ స్వతహాగా κοινόν కాదని, అయితే దానిని κοινόν అని పరిగణించే వ్యక్తికి అది అలానే ఉంటుందని చెబుతాడు. “దానంతట అదే,” “భావించే వ్యక్తికి,” మరియు “ఆ వ్యక్తికి మాత్రం” మూలంలోని వ్యక్తిగత అన్వయం, వ్యత్యాసాన్ని తగిన విధంగా కాపాడుతున్నాయి.'
