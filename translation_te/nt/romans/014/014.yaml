id: ROM.14.14
reference: Romans 14:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: te
  text: 'ప్రభువైన యేసులో నాకు తెలుసు, నేను దృఢంగా నమ్ముతున్నాను: ఏదీ దానంతట అదే అపవిత్రమైనది[a] కాదు. అయితే ఏదైనా అపవిత్రమైనదని భావించే వ్యక్తికి మాత్రం అది అపవిత్రమైనదే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సామాన్యమైనది.” ఇక్కడి గ్రీకు పదం సాధారణంగా ఆచారపరంగా కలుషితమైనదిగా లేదా పవిత్ర వినియోగానికి చెందనిదిగా పరిగణించబడేదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: సాధారణ జ్ఞానాన్ని తెలిపే క్రియ; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: πέπεισμαι
  choice: నేను దృఢంగా నమ్ముతున్నాను
  rationale: పూర్తయిన ప్రక్రియ ఫలితంగా కొనసాగుతున్న స్థిర నిశ్చయాన్ని తెలియజేసే perfect రూప బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: ప్రభువైన యేసులో
  rationale: ἐν అనే పూర్వప్రత్యయాన్ని ‘ద్వారా’ అని కారణార్థకంగా నిర్ణయించకుండా, మూలంలోని సంబంధార్థక అస్పష్టతను నిలుపుతుంది.
- source_word: κοινόν
  choice: అపవిత్రమైనది
  rationale: ఈ ఆహార, శుద్ధి సందర్భంలో ‘సామాన్యమైనది’ అనే అక్షరార్థం కంటే ఆచారపరంగా అపవిత్రంగా పరిగణించబడేదనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: δι’ ἑαυτοῦ
  choice: దానంతట అదే
  rationale: ఒక దానికి స్వతహాగా లేదా అంతర్గతంగా ఉన్న స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τῷ λογιζομένῳ
  choice: భావించే వ్యక్తికి
  rationale: ఒక దాన్ని నిర్దిష్ట విధంగా పరిగణించడం అనే λογίζομαι భావాన్ని తెలియజేస్తూ, గ్రీకులో లేని పురుషలింగ పరిమితిని విధించదు.
- source_word: τι
  choice: ఏదైనా
  rationale: సాధారణ సూత్రంలో అనిర్దిష్ట వస్తువును సహజంగా సూచిస్తుంది.
- source_word: ἐκείνῳ κοινόν
  choice: ఆ వ్యక్తికి మాత్రం అది అపవిత్రమైనదే
  rationale: ἐκείνῳ అనే వ్యక్తిగత అన్వయాన్ని, వాక్యంలోని వ్యత్యాస బలాన్ని ‘మాత్రం’, ‘-ఏ’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: ఆహారం, శుద్ధి సందర్భంలో κοινός అర్థం
  choice: అపవిత్రమైనది
  alternative: సామాన్యమైనది
  rationale: పౌలు ఏ వస్తువూ స్వతహాగా అపవిత్రం కాదని చెబుతూ, దానిని అపవిత్రమని భావించే వ్యక్తికి అది అలానే ఉంటుందని పేర్కొంటున్నాడు. ‘అపవిత్రమైనది’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది; ‘సామాన్యమైనది’ అనే అక్షరార్థాన్ని పాదసూచికలో భద్రపరచడం ద్వారా మూలపదపు నుడికారాన్ని కనిపించేలా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ప్రభువైన యేసులో’ అనే రూపం మూలంలోని సంబంధార్థక విస్తృతిని నిలుపుతుంది; ‘దృఢంగా నమ్ముతున్నాను’ స్థిర నిశ్చయాన్ని తెలియజేస్తుంది.
