revisions:
- from: 'ఎందుకంటే ఇలా వ్రాయబడి ఉంది: “నా జీవం తోడు, ప్రభువు చెబుతున్నాడు, ప్రతి మోకాలు నా ఎదుట వంగుతుంది; ప్రతి నాలుక దేవుణ్ణి ఒప్పుకుంటుంది[a].”'
  to: 'ఎందుకంటే వ్రాయబడి ఉంది: “నా జీవం తోడు, ప్రభువు అంటున్నాడు, ప్రతి మోకాలు నా ఎదుట వంగుతుంది; ప్రతి నాలుక దేవునికి అంగీకారం తెలుపుతుంది[a].”'
  rationale: 'The revision retains the source text’s wording and theological tension: the Lord’s first-person declaration says “నా ఎదుట,” while the final clause remains directed “దేవునికి.” It corrects the case relation in the final clause and uses an idiomatic modern Telugu speech formula, without altering the passage’s meaning.'
