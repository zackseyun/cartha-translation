id: ROM.14.11
reference: Romans 14:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: te
  text: 'ఎందుకంటే వ్రాయబడి ఉంది: “నా జీవం తోడు, ప్రభువు అంటున్నాడు, ప్రతి మోకాలు నా ఎదుట వంగుతుంది; ప్రతి నాలుక దేవునికి అంగీకారం తెలుపుతుంది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవునికి ఒప్పుకోలు చేస్తుంది,” లేదా “దేవునికి స్తుతి చెల్లిస్తుంది.” సందర్భాన్ని బట్టి గ్రీకు క్రియకు ఒప్పుకోలు చేయడం, అంగీకారం తెలపడం, లేదా స్తుతించడం అనే భావఛాయలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: ఇలా వ్రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే గ్రీకు పరిపూర్ణ కర్మణి రూపంలోని అధికారిక, కొనసాగుతున్న స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Ζῶ ἐγώ
  choice: నా జీవం తోడు
  rationale: దైవ ప్రమాణ ప్రకటనలోని గంభీరతను తెలుగులో సహజమైన ప్రమాణ పదబంధంతో నిలుపుతుంది; కేవలం ‘నేను జీవిస్తున్నాను’ అని అనువదిస్తే దాని ప్రయోగబలం స్పష్టంగా ఉండదు.
- source_word: κύριος
  choice: ప్రభువు
  rationale: κύριος కు సాధారణమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం; గ్రీకు పాఠంలో ఉన్న పదాన్నే అనుసరిస్తుంది.
- source_word: ἐμοὶ κάμψει πᾶν γόνυ
  choice: ప్రతి మోకాలు నా ఎదుట వంగుతుంది
  rationale: దత్తి విభక్తిలోని ‘నాకు’ అనే సంబంధాన్ని తెలుగు వాడుకలో సహజంగా ‘నా ఎదుట’ అని వ్యక్తం చేస్తూ, మోకాలు వంగే మూల దృశ్యాన్ని నిలుపుతుంది.
- source_word: πᾶσα γλῶσσα
  choice: ప్రతి నాలుక
  rationale: ప్రతి వ్యక్తిని సూచించే శరీరాంగ రూపకాన్ని, అలాగే లేఖన ప్రతిధ్వనిని యథాతథంగా కాపాడుతుంది.
- source_word: ἐξομολογήσεται
  choice: ఒప్పుకుంటుంది
  rationale: బహిరంగంగా ఒప్పుకోవడం లేదా అంగీకరించడం అనే ప్రధాన భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; స్తుతించడం అనే సాధ్యమైన ఛాయను పాదటిప్పణిలో ఉంచింది.
- source_word: τῷ θεῷ
  choice: దేవుణ్ణి
  rationale: తెలుగు క్రియాప్రయోగానికి అనుగుణంగా కర్మరూపాన్ని వాడి, ఒప్పుకోలు దేవునినే లక్ష్యంగా చేసుకున్నాయని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ఉల్లేఖనంలో ‘ప్రభువు’, ‘నా ఎదుట’, ‘దేవుణ్ణి’ అనే సూచనల సంబంధం
  choice: ‘ప్రభువు చెబుతున్నాడు ... నా ఎదుట ... దేవుణ్ణి’ అనే పాఠ్య మార్పును అలాగే నిలుపడం
  alternative: చివరి భాగాన్ని ‘నన్ను ఒప్పుకుంటుంది’ అని సమాంతరంగా మార్చడం, లేదా అనువాదంలోనే ప్రభువును దేవునితో సిద్ధాంతపరంగా స్పష్టంగా సమీకరించడం
  rationale: గ్రీకు పాఠం మొదటి పురుష దైవవాక్యమైన ‘నా ఎదుట’ నుండి ‘దేవుణ్ణి’ అనే రూపానికి మారుతుంది. దానిని సమన్వయం చేయకుండా ఉంచడం మూలపాఠంలోని నిర్మాణాన్ని, దైవశాస్త్ర సంబంధమైన ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన లేఖన శైలి. ‘నా జీవం తోడు’ ప్రమాణ ప్రకటన గంభీరతను సహజంగా అందిస్తుంది; శరీరాంగ రూపకాలైన ‘మోకాలు’, ‘నాలుక’ నిలుపబడ్డాయి.
