id: ROM.14.15
reference: Romans 14:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: te
  text: ఎందుకంటే, ఆహారం వల్ల నీ సోదరుడు[a] దుఃఖపడితే, నీవు ఇక ప్రేమకు అనుగుణంగా నడుచుకోవడం లేదు. నీ ఆహారం వల్ల, ఎవరి కోసం మెస్సీయ[c] చనిపోయాడో ఆ వ్యక్తిని నాశనం చేయకు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సోదరుడు లేదా సోదరి’; గ్రీకులోని ‘సోదరుడు’ అనే పదం సందర్భానుసారం తోటి విశ్వాసిని ప్రతినిధిగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పాడుచేయకు’ లేదా ‘నశింపజేయకు.’ గ్రీకు క్రియ బలమైనది; అది తీవ్రమైన ఆత్మీయ హానిని సూచించవచ్చు. అయితే దాని ఖచ్చితమైన సిద్ధాంతపరమైన ఫలితాన్ని ఈ వచనం నిర్దేశించదు.
    reason: alternative_reading
  - marker: c
    text: గ్రీకు Χριστός అంటే ‘అభిషిక్తుడు’; దీనిని సంప్రదాయంగా ‘క్రీస్తు’ అని, బిరుదు భావాన్ని తెలియజేస్తూ ‘మెస్సీయ’ అని కూడా అంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: ఆహారం / నీ ఆహారంతో
  rationale: ఈ పదం ఇక్కడ ప్రత్యేకంగా మాంసాన్ని మాత్రమే కాక ఆహారాన్ని సాధారణంగా సూచిస్తుంది. దత్తి విభక్తిలోని τῷ βρώματί σου సాధనం లేదా కారణాన్ని సూచించగలదు; అందుకే సహజమైన తెలుగులో ‘నీ ఆహారంతో’ అని ఇచ్చాం.
- source_word: ἀδελφός
  choice: సోదరుడు
  rationale: గ్రీకు పదం పుంలింగ ఏకవచనంలో ఉంది. దాని రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో అది తోటి విశ్వాసిని ప్రతినిధిగా సూచించవచ్చని పాదటిప్పణిలో తెలిపాం.
- source_word: λυπεῖται
  choice: దుఃఖపడుతున్నాడు
  rationale: ఈ క్రియ కలిగే బాధ, మనస్తాపం లేదా దుఃఖాన్ని వ్యక్తం చేస్తుంది. బాధ యొక్క ఖచ్చిత స్వరూపాన్ని మించి వ్యాఖ్యానించకుండా భావోద్వేగ బరువును నిలుపుతుంది.
- source_word: κατὰ ἀγάπην
  choice: ప్రేమకు అనుగుణంగా
  rationale: κατά ఇక్కడ ప్రమాణం లేదా అనుగుణతను సూచిస్తుంది. ‘ప్రేమకు అనుగుణంగా’ అనేది సహజమైన ఆధునిక తెలుగు, అలాగే పౌలు చెప్పే నైతిక ప్రమాణాన్ని కాపాడుతుంది.
- source_word: περιπατεῖς
  choice: నడుచుకోవడం
  rationale: పౌలు ఉపయోగించిన జీవన ప్రవర్తనకు సంబంధించిన ‘నడక’ రూపకాన్ని తెలుగులోనూ నిలుపుతుంది.
- source_word: ἀπόλλυε
  choice: నాశనం చేయకు
  rationale: ἀπόλλυμι బలమైన క్రియ; నాశనం చేయడం, పాడుచేయడం లేదా నశింపజేయడం అనే పరిధి దీనికి ఉంది. ‘నాశనం చేయకు’ హెచ్చరిక తీవ్రతను నిలుపుతూ దాని ఖచ్చిత సిద్ధాంతపరమైన ఫలితాన్ని నిర్ణయించదు.
- source_word: ἐκεῖνον
  choice: ఆ వ్యక్తిని
  rationale: సాధారణ సర్వనామానికి బదులు ఉన్న నిర్దేశక పదంలోని ప్రత్యేక ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὑπὲρ οὗ
  choice: అతని కోసమే
  rationale: ὑπέρ షష్ఠీ విభక్తితో ‘కొరకు’ లేదా ‘పక్షంగా’ అనే భావాన్ని ఇస్తుంది. ‘కోసమే’ త్యాగపూర్వక భావాన్ని, వాక్యంలోని ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ దాని బిరుదు స్వభావాన్ని చూపుతుంది; మూల అర్థమైన ‘అభిషిక్తుడు’ను పాదటిప్పణి వివరిస్తుంది.
- source_word: ἀπέθανεν
  choice: చనిపోయాడు
  rationale: సాధారణ ప్రజలకు స్పష్టమైన, సహజమైన ఆధునిక తెలుగు రూపం; గ్రీకు భూతకాల సంఘటనను నేరుగా తెలియజేస్తుంది.
- source_word: εἰ γὰρ
  choice: ఎందుకంటే ... అంటే
  rationale: γάρ ముందున్న వాదనతో కారణాత్మక సంబంధాన్ని చూపుతుంది; εἰ షరతును చూపుతుంది. తెలుగు వాక్య నిర్మాణంలో ఈ రెండింటినీ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ἀπόλλυε అనే హెచ్చరిక యొక్క పరిధి
  choice: ‘నాశనం చేయకు’ అనే బలమైన, కానీ సిద్ధాంతపరంగా నిర్దిష్టం కాని అనువాదం
  alternative: ‘పాడుచేయకు’ లేదా ‘నశింపజేయకు’
  rationale: వచనం తీవ్రమైన ఆత్మీయ హానిని సూచించవచ్చు; అయితే అది తాత్కాలిక ఆత్మీయ పతనమా, అంతిమ నాశనమా అన్నది ఈ వచనం మాత్రమే ఖచ్చితంగా నిర్ణయించదు. కాబట్టి ఆ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
- issue: ἀδελφός యొక్క ప్రతినిధి పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సోదరుడు’
  alternative: ‘సోదరుడు లేదా సోదరి’ లేదా ‘తోటి విశ్వాసి’
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని నిలిపాం; సంఘంలోని తోటి విశ్వాసులను ప్రతినిధిగా సూచించే అవకాశం పాదటిప్పణిలో ఇచ్చాం.
- issue: Χριστός బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు లేదా అభిషిక్తుడు
  rationale: ఇక్కడ పదం బిరుదుగా ఉంది. ‘మెస్సీయ’ దాని బిరుదు భావాన్ని స్పష్టంగా ఉంచుతుంది; గ్రీకు పదానికి ‘అభిషిక్తుడు’ అనే అర్థముందని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘ప్రేమకు అనుగుణంగా నడుచుకోవడం’ ద్వారా పౌలు ఉపయోగించిన నడక రూపకాన్ని నిలిపాం. మొదటి వాక్యంలో కారణం మరియు షరతు రెండూ సహజమైన తెలుగు క్రమంలో వ్యక్తమయ్యాయి.
