id: ROM.14.10
reference: Romans 14:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: te
  text: అయితే నీవు నీ సోదరునికి[b] ఎందుకు తీర్పు చెబుతున్నావు? లేదా నీవు కూడా నీ సోదరుణ్ణి ఎందుకు తృణీకరిస్తున్నావు? ఎందుకంటే మనమందరం దేవుని న్యాయపీఠం ఎదుట నిలబడతాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “క్రీస్తు న్యాయపీఠం” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా “నీ సోదరునికి లేదా సోదరికి”; గ్రీకులో “నీ సోదరునికి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δὲ
  choice: అయితే నీవు
  rationale: δέ యొక్క వ్యతిరేక భావాన్నీ, ముందుంచబడిన σύ యొక్క నొక్కిచెప్పే భావాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τί κρίνεις
  choice: ఎందుకు తీర్పు తీరుస్తున్నావు
  rationale: ఈ అలంకారిక ప్రశ్నలో τί అంటే ‘ఎందుకు.’ κρίνωను ‘ఖండించు’ అని మరీ సంకుచితం చేయకుండా, మరొక విశ్వాసిపై తీర్పు చెప్పడమనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: τὸν ἀδελφόν σου
  choice: నీ సోదరునికి / నీ సోదరుణ్ణి
  rationale: గ్రీకులో పుంలింగ ఏకవచనం ఉన్నందున ప్రధాన పాఠ్యంలో ‘సోదరుడు’ అని ఉంచబడింది; విస్తృత సందర్భంలో సోదరి కూడా ఉద్దేశించబడవచ్చనే విషయాన్ని పాదసూచిక తెలియజేస్తుంది. తెలుగు విభక్తులకు అనుగుణంగా రెండు చోట్ల రూపం మారింది.
- source_word: ἢ καὶ σὺ
  choice: లేదా నీవు కూడా
  rationale: ἤ యొక్క ప్రత్యామ్నాయ ప్రశ్నను, καί యొక్క ‘కూడా’ భావాన్ని, σύపై ఉన్న నొక్కును నేరుగా కాపాడుతుంది.
- source_word: τί ἐξουθενεῖς
  choice: ఎందుకు తృణీకరిస్తున్నావు
  rationale: ἐξουθενέωలోని ఒకరిని విలువలేనివాడిగా చూడటం లేదా చిన్నచూపు చూడటం అనే బలమైన భావాన్ని ‘తృణీకరించు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πάντες γὰρ
  choice: ఎందుకంటే మనమందరం
  rationale: γάρ యొక్క కారణవివరణ భావాన్ని ‘ఎందుకంటే’ తెలియజేస్తుంది; πάντεςలో పౌలు, పాఠకులు అందరూ ఉన్నందున ‘మనమందరం’ వాడబడింది.
- source_word: παραστησόμεθα
  choice: ఎదుట నిలబడతాం
  rationale: న్యాయస్థాన సందర్భంలో హాజరై నిలబడటమనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῷ βήματι
  choice: న్యాయపీఠం
  rationale: βῆμα సూచించే న్యాయాధికారి ఆసనం లేదా న్యాయవిచారణ వేదిక అనే రూపకాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: SBLGNT పాఠ్యంలో ఉన్న సాధారణ సంబంధవాచక రూపాన్ని నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: అందరూ ఎవరి న్యాయపీఠం ఎదుట నిలబడతారు?
  choice: దేవుని
  alternative: క్రీస్తు న్యాయపీఠం
  rationale: ఇచ్చిన SBLGNT గ్రీకు పాఠ్యం τοῦ θεοῦ (‘దేవుని’) అని ఉంది. కొన్ని ప్రతుల్లో ‘క్రీస్తు’ అనే పాఠాంతరం ఉన్నందున దానిని ప్రధాన పాఠ్యంలో కలపకుండా పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ఏకవచన సంబోధనను, మూలంలోని నొక్కును నిలుపడానికి ‘నీవు’ ఎంచుకోబడింది. పాదసూచిక గుర్తులు వాటి భావసంబంధ పదాల దగ్గర ఉంచబడ్డాయి; ఒకే లింగరూపాన్ని విస్తరించకుండా గ్రీకు రూపం ప్రధాన పాఠ్యంలో నిలుపబడింది.
