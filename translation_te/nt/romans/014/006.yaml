id: ROM.14.6
reference: Romans 14:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: te
  text: ఆ రోజును పాటించేవాడు[a] ప్రభువు కోసమే దాన్ని పాటిస్తాడు. తినేవాడు ప్రభువు కోసమే తింటాడు; ఎందుకంటే అతడు దేవునికి కృతజ్ఞతలు చెల్లిస్తాడు. తిననివాడు ప్రభువు కోసమే తినకుండా ఉంటాడు; అతడూ దేవునికి కృతజ్ఞతలు చెల్లిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ రోజును గౌరవంగా పరిగణించేవాడు” లేదా “ఆ రోజును మనసులో ఉంచుకునేవాడు.” గ్రీకు క్రియ ఏదైనా విషయానికి మనసు పెట్టడం లేదా దానికి ప్రాధాన్యం ఇవ్వడం అనే అర్థాలను కలిగి ఉండగలదు. ఇక్కడ ఒక రోజును పాటించడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: ప్రత్యేకంగా పాటించేవాడు / దాన్ని పాటిస్తాడు
  rationale: φρονέω ఇక్కడ కేవలం మనసులో ఆలోచించడాన్ని కాక, ఒక రోజుకు ప్రత్యేక గౌరవం ఇచ్చి ఆచరణలో పాటించడాన్ని సూచిస్తుంది. ‘ప్రత్యేకంగా’ అనేది సందర్భంలోని ఒక రోజును మరొక రోజుకంటే వేరుగా పరిగణించే భావాన్ని సహజంగా తెలియజేస్తుంది; విస్తృతమైన మూలభావాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὴν ἡμέραν
  choice: ఆ రోజును
  rationale: గ్రీకులోని నిర్దిష్ట ఉపపదాన్ని, ముందరి వచనంలో చర్చకు వచ్చిన రోజును సూచించే సందర్భాన్ని ‘ఆ రోజు’ సహజంగా ప్రతిబింబిస్తుంది. అది ఏ ప్రత్యేక దినమో అనువాదం నిర్ణయించదు.
- source_word: κυρίῳ
  choice: ప్రభువు కోసమే
  rationale: ఈ దత్తివిభక్తి కార్యం ప్రభువును దృష్టిలో ఉంచుకొని, ఆయన కొరకు చేయబడుతున్నదనే దిశ లేదా ఉద్దేశాన్ని తెలుపుతుంది. ‘కోసమే’ వాక్యంలోని ఉద్ఘాటనను, సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ἐσθίων / ἐσθίει
  choice: తినేవాడు / తింటాడు
  rationale: వర్తమాన కృదంతం మరియు క్రియ ఇక్కడ సాధారణ లేదా అలవాటైన ఆచరణను సూచిస్తున్నాయి; తెలుగు సాధారణ వర్తమాన రూపాలు దీనిని సహజంగా తెలియజేస్తాయి.
- source_word: εὐχαριστεῖ
  choice: కృతజ్ఞతలు చెల్లిస్తాడు
  rationale: దేవుని ఉద్దేశించి కృతజ్ఞత వ్యక్తం చేసే క్రియను గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: εὐχαριστεῖతో వచ్చిన దత్తివిభక్తి కృతజ్ఞత ఎవరికి చెల్లించబడుతోందో స్పష్టంగా తెలుపుతుంది.
- source_word: ὁ μὴ ἐσθίων
  choice: తిననివాడు / తినకుండా ఉంటాడు
  rationale: గ్రీకు నిరాకరణ కృదంతాన్ని ప్రత్యక్షంగా ప్రతిబింబిస్తూ, ‘తినేవాడు’ అనే ముందరి పదబంధంతో సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: ‘ఆ రోజు’ను పాటించడం యొక్క అర్థం
  choice: రోమా 14లో వివాదానికి సంబంధించిన ఒక రోజును ప్రత్యేకంగా పరిగణించి పాటించడమనే సాధారణ సూచన
  alternative: ఇది ప్రత్యేకంగా విశ్రాంతిదినం, యూదుల పండుగదినం లేదా ఉపవాసదినం అనే పఠనాలు
  rationale: ఈ వచనంలో పౌలు ఏ రోజో నిర్దిష్టంగా చెప్పలేదు. అందువల్ల అనువాదం ఒక ప్రత్యేక చారిత్రక లేదా సంఘశాఖాపరమైన గుర్తింపును చేర్చకుండా మూలంలోని విస్తృతతను నిలుపుతుంది.
- issue: κύριος ఎవరిని సూచిస్తుంది
  choice: ప్రభువు
  alternative: దేవుడు
  rationale: ఈ సందర్భంలోని పౌలు వాడుకలో κύριος సహజంగా ప్రభువైన యేసును సూచించవచ్చు; కృతజ్ఞత మాత్రం స్పష్టంగా దేవునికి చెల్లించబడుతుంది. మూలపాఠంలోని పదభేదాన్ని అనువాదం అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ప్రభువు కోసమే’ అనే పునరుక్తితో గ్రీకు సమాంతర నిర్మాణం, ఉద్ఘాటన నిలిచాయి. ‘ఆ రోజు’ ఏ దినమో పేర్కొనకుండా మూలంలోని ఉద్దేశపూర్వక సాధారణతను కాపాడాం.
