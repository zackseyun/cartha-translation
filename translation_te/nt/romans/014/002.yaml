  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: te
  text: ఒకరు ఏదైనా తినవచ్చని నమ్ముతారు[a]; అయితే బలహీనంగా ఉన్నవారు[b] కూరగాయలు తింటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అన్నీ తినవచ్చనే నిశ్చయం కలిగి ఉంటారు.”
    reason: lexical_alternative
  - marker: b
    text: సందర్భంలో ‘బలహీనంగా ఉన్నవారు’ అనేది ఆహార ఆచారాల విషయంలో విశ్వాసం లేదా మనస్సాక్షికి సంబంధించిన బలహీనతను సూచిస్తుంది (రోమా 14:1 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: ఒకరు
  rationale: మొదటి వ్యక్తిని ప్రతినిధి ఏకవచనంగా పరిచయం చేస్తూ, తరువాతి విరుద్ధ భాగానికి సహజంగా పునాది వేస్తుంది; అనవసరంగా పురుష లింగాన్ని ముందుకు తేవదు.
- source_word: πιστεύει
  choice: నమ్ముతారు
  rationale: ఇక్కడ ఈ క్రియ రక్షణనిచ్చే విశ్వాసాన్ని కాక, తినే విషయంలో వ్యక్తిగత నమ్మకాన్ని లేదా దృఢాభిప్రాయాన్ని తెలియజేస్తుంది. మూలపదంతో ఉన్న ‘విశ్వాసం/నమ్మకం’ సంబంధాన్ని అనువాదం నిలుపుతుంది.
- source_word: φαγεῖν πάντα
  choice: ఏదైనా తినవచ్చని
  rationale: πάντα ఆహారంపై ఆంక్షలేమీ లేవనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘ఏదైనా తినవచ్చు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; ‘వచ్చు’ అనేది సందర్భంలో సూచితమైన అనుమతిని వ్యక్తం చేస్తుంది.
- source_word: ὁ δὲ
  choice: అయితే
  rationale: వాక్యంలోని రెండవ, విరుద్ధ భాగాన్ని సహజమైన తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ἀσθενῶν
  choice: బలహీనంగా ఉన్న వ్యక్తి
  rationale: ఈ కృదంతం బలహీనత చేత గుర్తింపబడే వ్యక్తిని సూచిస్తుంది. ఈ వచనంలో లేని ‘విశ్వాసంలో’ అనే మాటను ప్రధాన పాఠ్యంలో చేర్చకుండా పౌలు వాడిన మూల్యాంకన పదాన్ని నిలుపుతుంది.
- source_word: λάχανα
  choice: కూరగాయలు
  rationale: తోటలో పండే ఆకుకూరలు లేదా ఇతర కూరగాయలను సూచించే ఈ పదానికి ఆధునిక తెలుగులో స్పష్టమైన, విస్తృతమైన సమానార్థకం.
- source_word: ἐσθίει
  choice: తింటారు
  rationale: క్రియను సూటిగా అనువదిస్తుంది. గ్రీకులో స్పష్టంగా లేని ‘మాత్రమే’ అనే పరిమితిని ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: ἀσθενῶν అనే ‘బలహీనత’ స్వభావం
  choice: ఈ వచనంలో ‘బలహీనంగా ఉన్న వ్యక్తి’ అని మాత్రమే అనువదించడం
  alternative: ‘విశ్వాసంలో బలహీనంగా ఉన్న వ్యక్తి’
  rationale: తక్షణ సందర్భమైన రోమా 14:1 ఈ బలహీనతను ఆహార ఆచారాల విషయంలో విశ్వాసం లేదా మనస్సాక్షితో అనుసంధానిస్తుంది. అయినా 14:2లో ‘విశ్వాసంలో’ అని లేదు కాబట్టి, ప్రధాన పాఠ్యం ఆ వివరణను చేర్చకుండా సందర్భమే భావాన్ని సరఫరా చేయనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ‘ఒకరు/తింటారు’ నిర్మాణం వాడబడింది. మూలంలోని ఏకవచన విరుద్ధతను నిలుపుతూ అనవసర లింగ నిర్దేశాన్ని నివారించింది. వాక్యం సంక్షిప్తంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంది.
