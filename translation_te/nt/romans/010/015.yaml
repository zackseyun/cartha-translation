id: ROM.10.15
reference: Romans 10:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: te
  text: వారు పంపబడకపోతే ఎలా ప్రకటించగలరు? వ్రాయబడి ఉన్నట్లుగా, “మంచి సంగతుల శుభవార్తను తెలియజేసేవారి పాదాలు ఎంత సుందరమైనవి!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సుందరమైనవి” అనే గ్రీకు పదానికి ఇక్కడ “ఎంత ఆహ్వానించదగినవి” లేదా “ఎంత సమయోచితమైనవి” అనే భావఛాయ కూడా ఉండవచ్చు; అది దూత రాక కలిగించే ఆనందాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: ప్రకటిస్తారు
  rationale: ఈ క్రియ బహిరంగంగా సందేశాన్ని చాటడాన్ని సూచిస్తుంది. ‘ప్రకటిస్తారు’ అనే పదం దీనిని అధికారిక ప్రసంగానికి మాత్రమే పరిమితం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: ἀποσταλῶσιν
  choice: పంపబడకపోతే
  rationale: ἀποστέλλω యొక్క కర్మణి రూపం మరొకరి చేత పంపబడటాన్ని సూచిస్తుంది; తెలుగు కర్మణి రూపం పంపేవారిపై ఆధారపడటాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: καθὼς γέγραπται
  choice: వ్రాయబడి ఉన్నట్లుగా
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే స్థిరమైన సూత్రప్రయోగాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: ὡραῖοι
  choice: సుందరమైనవి
  rationale: ప్రధాన అర్థమైన అందం లేదా ఆహ్లాదకరతను నిలుపుతుంది; దూత రాక ఆహ్వానించదగినది, సమయోచితమైనది అనే సాధ్యమైన ఛాయను పాదసూచికలో ఉంచాం.
- source_word: πόδες
  choice: పాదాలు
  rationale: ఉల్లేఖనంలోని దూతల రాకను చిత్రించే శరీరాంగ రూపకాన్ని అనువాదంలో నేరుగా నిలుపుతుంది.
- source_word: εὐαγγελιζομένων
  choice: శుభవార్తగా ప్రకటించేవారి
  rationale: మంచి వార్తను తెలియజేయడం అనే క్రియార్థాన్ని, దూతల చిత్రణకు అనుగుణంగా, ప్రత్యేక సంఘపరమైన పరిభాషను చేర్చకుండా వ్యక్తం చేస్తుంది.
- source_word: τὰ ἀγαθά
  choice: మంచి సంగతులను
  rationale: గ్రీకు పదబంధంలోని ‘మంచి విషయాలు/సంగతులు’ అనే ప్రత్యేక కర్మను నిలుపుతూ, దాన్ని కేవలం ‘శుభవార్త’లో కలిపివేయదు.
theological_decisions:
- issue: దూతల ఉల్లేఖనానికి సువార్త ప్రకటనతో ఉన్న సంబంధం
  choice: పంపబడటం, ప్రకటించడం అనే తర్కశ్రేణిని నిలుపుతూ, మంచి సంగతులను తెలిపే దూతల రాకను వేడుకగా చూపే యెషయా-ఆధారిత చిత్రణను అలాగే ఉంచడం.
  alternative: ‘ప్రసంగిస్తారు,’ ‘సువార్త బోధకులు’ వంటి పదాలతో దీన్ని అధికారిక సంఘ పరిచర్యకు మాత్రమే చెందినదిగా వినిపించడం.
  rationale: పౌలు సందర్భం సువార్త ప్రకటనను సూచించినా, ఈ ఉల్లేఖనం మంచి వార్తను ప్రకటించే దూతలను విస్తృతంగా కొనియాడుతుంది. అందువల్ల ఒక నిర్దిష్ట సంఘ పదవిని పాఠ్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రశ్నారూపం, గౌరవప్రదమైన లేఖన ఉల్లేఖన శైలి వాడబడ్డాయి. ‘మంచి సంగతులను శుభవార్తగా ప్రకటించేవారి’ అనే నిర్మాణం కొద్దిగా సాంద్రమైనదైనా, εὐαγγελιζομένων మరియు τὰ ἀγαθά రెండింటి ప్రత్యేక భావాలను నిలుపుతుంది.
