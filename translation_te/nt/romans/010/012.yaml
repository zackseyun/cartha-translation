id: ROM.10.12
reference: Romans 10:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: te
  text: ఎందుకంటే యూదుడికీ గ్రీకువాడికీ[a] ఎలాంటి భేదమూ లేదు; అందరికీ ప్రభువు ఒక్కడే[b], ఆయనను పిలిచే వారందరికీ ఆయన సమృద్ధిగా దయచూపుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో ‘గ్రీకువాడు’ అని ఉంది. ఇక్కడ ‘యూదుడు—గ్రీకువాడు’ అనే జంట ‘యూదుడు—యూదేతరుడు’ అనే విస్తృత వ్యత్యాసాన్ని సూచిస్తుంది. కొన్ని అనువాదాలు ‘యూదేతరుడు’ అని అనువదిస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అందరిపైనా ఉన్న అదే ప్రభువు.’
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: భేదం
  rationale: ఇక్కడ ఈ పదం రెండు సమూహాల మధ్య తేడా చూపడాన్ని సూచిస్తుంది. ‘భేదం’ సహజమైన ఆధునిక తెలుగు పదం; విలువలో తక్కువ-ఎక్కువ అనే భావాన్ని అదనంగా చేర్చదు.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: యూదుడికీ గ్రీకువాడికీ
  rationale: మూలపాఠంలో విస్తృతార్థకమైన ‘యూదేతరుడు’ కాకుండా ‘గ్రీకువాడు’ అని ఉంది. అందువల్ల మూలపాఠ పారదర్శకత కోసం ప్రధాన వాక్యంలో అదే ఉంచబడింది.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: అందరికీ ప్రభువు ఒక్కడే
  rationale: గ్రీకు నామవాచక వాక్యంలోని భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ‘అందరికీ’ అనేది πάντων యొక్క సమగ్ర పరిధిని నిలుపుతుంది; αὐτός ఇక్కడ అందరికీ ఒకే ప్రభువు అనే భావాన్ని ఇస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: రోమా 10 సందర్భంలో ఇది గౌరవపూర్వకమైన క్రీస్తుసంబంధ బిరుదు. ‘యజమాని’ కంటే ‘ప్రభువు’ దాని సందర్భోచితమైన ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: πλουτῶν εἰς πάντας
  choice: వారందరికీ ఆయన సమృద్ధిగా అనుగ్రహిస్తాడు
  rationale: అక్షరార్థంలోని సంపద రూపకాన్ని ‘సమృద్ధిగా’ నిలుపుతూ, ప్రభువు ఉదారంగా ప్రసాదిస్తాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: తనకు మొరపెట్టుకునే వారు
  rationale: ఇక్కడ ἐπικαλέω ప్రభువును విశ్వాసంతో పిలవడం లేదా ఆయన సహాయం కోరడాన్ని సూచిస్తుంది. ‘మొరపెట్టుకునే’ అనేది ప్రార్థనాత్మక పిలుపును స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ప్రభువు’ ఎవరిని సూచిస్తున్నాడు?
  choice: చుట్టుపక్కల సందర్భంలో ప్రభువుగా ఒప్పుకోబడిన యేసును సూచించేలా ‘ప్రభువు’ అనే బిరుదునే ఉంచడం
  alternative: ఎవరిని ఉద్దేశించిందో నిర్దిష్టం చేయకుండా సాధారణంగా దేవునికి వర్తింపజేయడం
  rationale: రోమా 10:9-13 యేసును ప్రభువుగా ఒప్పుకోవడంపై కేంద్రీకృతమై, తరువాత ప్రభువు నామానికి మొరపెట్టుకోవడం గురించి లేఖనాన్ని ఉదహరిస్తుంది. అనువాదం ‘యేసు’ అని అదనంగా చేర్చకుండా, సందర్భమే ఆ సంబంధాన్ని చూపేలా మూలంలోని బిరుదును నిలుపుతుంది.
- issue: ‘అందరూ/అందరికీ’ అనే పదం యొక్క పరిధి
  choice: అనుగ్రహం పొందే ‘వారందరూ’ అనేది ‘తనకు మొరపెట్టుకునే’ అనే పదబంధంతో పరిమితమవుతుంది
  alternative: ప్రతి వ్యక్తి షరతులేకుండా రక్షణ పొందుతాడనే అర్థం
  rationale: గ్రీకు వాక్యనిర్మాణంలో ‘అందరూ’ అనే పరిధిని తరువాతి కృదంత పదబంధం స్పష్టంగా నిర్దేశిస్తుంది. అనువాదం యూదుడు-గ్రీకువాడు అనే తేడా లేకుండా అందరికీ అందుబాటులో ఉన్న అనుగ్రహాన్నీ, ప్రభువుకు మొరపెట్టుకునేవారు అనే అర్హతనూ రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి ఉపయోగించబడింది. ‘సమృద్ధిగా అనుగ్రహిస్తాడు’ అనే ప్రయోగం πλουτῶν లోని సమృద్ధి రూపకాన్ని సహజమైన తెలుగుతో కలుపుతుంది; ‘మొరపెట్టుకునే’ అనే పదం తరువాతి వచనంతో ఉన్న అనుసంధానాన్ని నిలుపుతుంది.
