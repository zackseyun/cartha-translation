source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: te
  text: సోదరులారా[a], వారు రక్షణ పొందాలనేదే నా హృదయ వాంఛా, వారి కోసం దేవునికి నేను చేసే ప్రార్థనా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సోదర సోదరీమణులారా’; గ్రీకులో పుంలింగ బహువచన రూపం ఉంది, అయితే అది స్త్రీ పురుషులతో కూడిన సమూహాన్ని కూడా ఉద్దేశించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: సోదరులారా
  rationale: ἀδελφός పదం యొక్క సంబోధన బహువచన రూపాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సంఘ సంబోధనగా అనువదించబడింది; మిశ్రమ సమూహాన్ని కూడా ఉద్దేశించగల భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: εὐδοκία τῆς ἐμῆς καρδίας
  choice: నా హృదయ వాంఛ
  rationale: ఈ సందర్భంలో εὐδοκία పౌలు కోరుతున్నదాన్ని సూచిస్తుంది. జనిటివ్ సంబంధాన్ని సహజమైన తెలుగు సమాసంతో వ్యక్తం చేశాం.
- source_word: δέησις
  choice: ప్రార్థన
  rationale: δέησιςలో మనవి లేదా వేడుకోలు అనే ఛాయ ఉన్నప్పటికీ, πρὸς τὸν θεόνతో కలిసి ఇక్కడ ‘ప్రార్థన’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: πρὸς τὸν θεόν
  choice: దేవునికి
  rationale: πρός + accusative ప్రార్థన ఎవరిని ఉద్దేశించి చేయబడుతుందో సూచిస్తుంది; తెలుగులో ‘దేవునికి’ దాని దిశను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὲρ αὐτῶν
  choice: వారి కోసం
  rationale: ὑπέρ ఇక్కడ వారి మేలు నిమిత్తమైన ప్రార్థనను సూచిస్తుంది. αὐτῶν అనే సర్వనామాన్ని అలాగే ఉంచి, ముందటి సందర్భంలోని ఇశ్రాయేలీయులు అనే నిర్దిష్ట నామాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: εἰς σωτηρίαν
  choice: వారు రక్షణ పొందాలన్నదే
  rationale: εἰς ఇక్కడ లక్ష్యాన్ని సూచిస్తుంది. రక్షణ వారికే సంబంధించినదని తెలుగు వాక్యంలో సహజంగా స్పష్టం చేస్తూ, ఫలితం ఖచ్చితమని కాక ప్రార్థన యొక్క లక్ష్యమని వ్యక్తం చేశాం.
- source_word: μέν
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ μέν స్వల్పమైన వాక్యప్రవాహ సూచకంగా ఉంది; ప్రత్యక్ష δέ జత లేకపోవడంతో దాన్ని ప్రత్యేకంగా అనువదిస్తే తెలుగులో కృత్రిమంగా ఉంటుంది.
theological_decisions:
- issue: Ἀδελφοί అనే లింగసూచక సంబోధన
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. ఇది స్త్రీ పురుషులతో కూడిన సంఘాన్ని ఉద్దేశించగల విస్తృత ప్రయోగమని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: εἰς σωτηρίανలో రక్షణ యొక్క సంబంధం మరియు లక్ష్యం
  choice: వారు రక్షణ పొందాలన్నదే
  alternative: రక్షణ కోసం
  rationale: ‘వారు’ అనే సర్వనామంతో రక్షణకు ఉన్న భావసంబంధాన్ని తెలుగులో స్పష్టంగా చేశాం; అదే సమయంలో εἰςను ప్రార్థన యొక్క లక్ష్యంగా చూపించి, రక్షణ ఇప్పటికే సంభవించిందని లేదా తప్పకుండా సంభవిస్తుందని చెప్పలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సంఘ పఠనానికి అనువైన శైలి. ‘హృదయ వాంఛ’ మూలంలోని భావోద్వేగ తీవ్రతను నిలుపుతుంది; వాక్యక్రమాన్ని తెలుగులో సహజంగా ఉండేలా మార్చినా, వాంఛ మరియు ప్రార్థన అనే రెండు సమాంతర అంశాలు అలాగే నిలిచాయి.
