source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: te
  text: అయితే ఇశ్రాయేలు గురించి ఆయన ఇలా అంటున్నాడు:[a] “రోజంతా అవిధేయులైన[b], ఎదిరించి మాట్లాడే[c] ప్రజల వైపు నా చేతులు చాపాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయితే ఇశ్రాయేలుతో ఆయన ఇలా అంటున్నాడు.” గ్రీకు నిర్మాణం ఇశ్రాయేలును ఉద్దేశించి చెప్పడంగానీ, ఇశ్రాయేలు గురించి చెప్పడంగానీ అర్థం కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: “అవిధేయులైన” అనే పదానికి “నమ్మని” లేదా “ఒప్పించబడటానికి నిరాకరించే” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “వ్యతిరేకించే,” “ఖండించే,” లేదా “ఎదురు మాట్లాడే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: అయితే ఇశ్రాయేలు గురించి
  rationale: πρός + λέγει నిర్మాణం ఇశ్రాయేలును ఉద్దేశించి చెప్పడాన్నీ, ఇశ్రాయేలు గురించి చెప్పడాన్నీ సూచించగలదు. ప్రధాన పాఠంలో సహజమైన విషయార్థాన్ని ఉంచి, ప్రత్యక్ష సంబోధన అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: λέγει
  choice: ఆయన ఇలా అంటున్నాడు
  rationale: గ్రీకులో కర్త అంతర్లీనంగా ఉంది; సందర్భంలో అది దేవుణ్ణి సూచిస్తుంది. వర్తమాన కాలంలోని ఉల్లేఖన సూత్రాన్ని నిలిపేందుకు ‘అంటున్నాడు’ వాడాం.
- source_word: Ὅλην τὴν ἡμέραν
  choice: రోజంతా
  rationale: కాలవ్యాప్తిని తెలిపే గ్రీకు ప్రయోగానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: ἐξεπέτασα τὰς χεῖράς μου
  choice: నా చేతులు చాపి ఉంచాను
  rationale: చేతులు చాపడం అనే మూలపాఠంలోని రూపక చిత్రాన్ని నిలిపి, రోజంతా కొనసాగిన దేవుని పిలుపును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸς λαὸν
  choice: ప్రజల వైపు
  rationale: చాపిన చేతులు ఎవరి దిశగా ఉన్నాయో తెలిపే πρός యొక్క దిశార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπειθοῦντα
  choice: విధేయత చూపకుండా
  rationale: ఈ పదంలో అవిధేయతతో పాటు నమ్మకపోవడం లేదా ఒప్పించబడటానికి నిరాకరించడం అనే భావ ఛాయలు ఉన్నాయి. ప్రధాన పాఠంలో నైతిక-సంకల్ప సంబంధమైన ప్రతిఘటనను సహజంగా తెలిపాం.
- source_word: ἀντιλέγοντα
  choice: ఎదిరిస్తూ మాట్లాడే
  rationale: ἀντιλέγω యొక్క ‘వ్యతిరేకంగా మాట్లాడడం/ఎదిరించడం’ అనే క్రియాత్మక భావాన్ని కేవలం ‘వ్యతిరేకించే’ కంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని చొరవకు ఇశ్రాయేలు స్పందన
  choice: ‘విధేయత చూపకుండా ఎదిరిస్తూ మాట్లాడే ప్రజలు’ అని అనువదించడం
  alternative: ‘నమ్మకుండా వ్యతిరేకించే ప్రజలు’
  rationale: ఈ వచనం దేవుడు నిరంతరం చేతులు చాపడం మరియు ప్రజలు తిరస్కరించి ఎదిరించడం అనే ఉద్రిక్తతను కలిపి ఉంచుతుంది. ఇశ్రాయేలు విస్తృత స్థితి గురించి ఈ వచనం చెప్పని సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
- issue: λέγει లో అంతర్లీన కర్త
  choice: ‘ఆయన’ అని ఉంచి దేవుని పేరును నేరుగా చేర్చకపోవడం
  alternative: ‘దేవుడు ఇలా అంటున్నాడు’
  rationale: ఉల్లేఖన సందర్భంలో కర్త దేవుడే అయినప్పటికీ, గ్రీకు వాక్యంలో పేరు ప్రత్యక్షంగా లేదు. అందువల్ల మూలపాఠపు సంక్షిప్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘నా చేతులు చాపి ఉంచాను’ ద్వారా మూలంలోని మానవరూపక చిత్రమూ, రోజంతా కొనసాగిన ఆహ్వాన భావమూ నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
