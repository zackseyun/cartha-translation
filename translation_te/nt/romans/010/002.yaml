id: ROM.10.2
reference: Romans 10:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν· ἀλλ’ οὐ κατ’ ἐπίγνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/002.yaml
  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: te
  text: ఎందుకంటే, వారికి దేవునిపట్ల తపన ఉంది[a] అని వారి గురించి నేను సాక్ష్యమిస్తున్నాను; అయితే ఆ తపన జ్ఞానానికి అనుగుణమైనది కాదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారికి దేవుని తపన ఉంది.’ గ్రీకులోని షష్ఠీ విభక్తిని ఇలా మరింత అక్షరార్థంగా అనువదించవచ్చు; అయితే ఇక్కడ అది దేవునిపట్ల ఉన్న తపననే సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పూర్ణ జ్ఞానంతో కాదు,’ లేదా ‘జ్ఞానం ఆధారంగా కాదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: నేను సాక్ష్యమిస్తున్నాను
  rationale: వర్తమానకాలంలోని ప్రత్యక్ష సాక్ష్య ప్రకటనను స్పష్టంగా, గంభీరంగా నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంతో ఉన్న వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτοῖς
  choice: వారి గురించి
  rationale: ఇక్కడ దత్తి విభక్తి సాక్ష్యం ఎవరికి చెప్పబడుతుందో కాకుండా, సాక్ష్యం ఎవరి విషయమై ఇవ్వబడుతుందో సూచిస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: సాక్ష్యంలోని విషయాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: ζῆλον
  choice: తపన
  rationale: తీవ్రమైన ఆసక్తి, నిబద్ధత అనే భావాలను సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది; కేవలం సాధారణ ‘ఆసక్తి’కన్నా మూలపదంలోని తీవ్రతను మెరుగ్గా నిలుపుతుంది.
- source_word: θεοῦ
  choice: దేవునిపట్ల
  rationale: సందర్భంలో దీనిని దేవుని వైపు మళ్లిన తపనను సూచించే objective genitive‌గా గ్రహిస్తుంది; దేవునికే చెందిన తపన అని తప్పుగా అర్థం కాకుండా చేస్తుంది.
- source_word: ἔχουσιν
  choice: వారికి … ఉంది
  rationale: గ్రీకు సాధారణ వర్తమాన భావాన్ని సహజమైన తెలుగు అస్తిత్వ నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: ἀλλ’
  choice: అయితే
  rationale: వారి తపనను అంగీకరించడానికీ, దానిలోని లోపాన్ని చెప్పడానికీ మధ్యనున్న స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: జ్ఞానానికి అనుగుణమైనది కాదు
  rationale: κατά + accusative నిర్మాణంలోని ‘జ్ఞానానికి అనుగుణంగా’ అనే భావాన్ని కాపాడుతూ, ‘సరైన’ లేదా ‘పూర్ణ’ వంటి వివరణాత్మక విశేషణాలను ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: ఇశ్రాయేలీయుల తపన స్వభావం
  choice: వారి తపన దేవునిపట్ల ఉంది, కాని అది జ్ఞానానికి అనుగుణంగా లేదు
  alternative: వారికి దేవుని సొంత తపన ఉంది; లేదా దాని లక్ష్యాన్ని పేర్కొనని మతపరమైన తపన ఉంది
  rationale: సందర్భంలో ζῆλον θεοῦ ను దేవుని వైపు మళ్లిన తపనగా గ్రహించడం సముచితం. వారి నిజాయితీగల తీవ్రతను పౌలు అంగీకరిస్తూనే, దానికి తగిన జ్ఞానం లేదని విమర్శించే వాక్యంలోని వేదాంతపరమైన ఉద్వేగాన్ని ఇది పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. ‘తపన’ మూలంలోని zeal భావతీవ్రతను నిలుపుతుంది. రెండు పాదాల మధ్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచి, తపన నిజమైనదే అయినా జ్ఞానానికి అనుగుణంగా లేదనే ఉద్వేగాన్ని కాపాడింది.
