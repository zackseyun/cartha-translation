id: ROM.10.18
reference: Romans 10:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: te
  text: 'కాని నేను అడుగుతున్నాను: వారు వినలేదా? నిశ్చయంగా విన్నారు:


    “వారి స్వరం[a] భూమి అంతటా వ్యాపించింది;

    వారి మాటలు మనుషులు నివసించే లోకపు[b] చివరల వరకు చేరాయి.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ధ్వని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, సరళంగా ‘ప్రపంచపు’; గ్రీకు పదం మనుషులు నివసించే లోకాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: పౌలు ఇక్కడ కీర్తన 19:4ను ఉటంకించి, దాని భాషను సందేశం వ్యాపించడానికి అన్వయిస్తున్నాడు.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: వారు వినలేదా?
  rationale: μή οὐκ తో ఉన్న ఈ అలంకారప్రశ్నకు అవుననే సమాధానం ఆశించబడుతుంది. తెలుగులో ‘వారు వినలేదా?’ అనేది ఆ ప్రశ్న బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: μενοῦνγε
  choice: నిశ్చయంగా విన్నారు
  rationale: ఈ పదం ముందున్న ప్రశ్నకు బలమైన సానుకూల సమాధానం ఇస్తుంది. గ్రీకులో సూచితమైన క్రియను తెలుగులో స్పష్టంగా చెప్పడం సహజంగా ఉంటుంది.
- source_word: φθόγγος
  choice: స్వరం
  rationale: ఇది వినిపించే ధ్వని లేదా స్వరాన్ని సూచిస్తుంది. తరువాతి ‘మాటలు’తో ఉన్న కవితాత్మక సమాంతరతను ‘స్వరం’ సహజంగా నిలుపుతుంది; ‘ధ్వని’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: γῆ
  choice: భూమి
  rationale: ఈ విశ్వవ్యాప్త కవితాత్మక సందర్భంలో ఒక ప్రత్యేక ప్రాంతాన్ని కాకుండా సమస్త భూమిని సూచిస్తుంది.
- source_word: ἐξῆλθεν
  choice: వ్యాపించింది
  rationale: అక్షరార్థంగా ‘బయలుదేరింది/వెల్లింది’ అయినా, స్వరం భూమి అంతటికి చేరడాన్ని తెలుగులో ‘వ్యాపించింది’ సహజంగా, భావనకు నమ్మకంగా తెలియజేస్తుంది.
- source_word: πέρατα
  choice: అంచులు
  rationale: దూరమైన చివరి భాగాలను సూచించే కవితాత్మక ప్రయోగాన్ని ‘అంచులు’ స్పష్టంగా నిలుపుతుంది.
- source_word: οἰκουμένης
  choice: నివాసిత లోకపు
  rationale: οἰκουμένη భౌతిక భూగోళాన్ని మాత్రమే కాకుండా మనుషులు నివసించే లోకాన్ని సూచించే సూక్ష్మార్థాన్ని కలిగి ఉంది.
- source_word: ῥήματα
  choice: మాటలు
  rationale: ఇది నేరుగా పదాలు లేదా పలుకులను సూచిస్తుంది; ‘సందేశం’ అని అనువదించడం కంటే గ్రీకు పదానికి దగ్గరగా ఉండి, ‘స్వరం’తో సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: కీర్తన ఉల్లేఖనంలోని ‘వారి’ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ‘వారి’ అనే సర్వనామాన్ని వివరణాత్మక విస్తరణ లేకుండా నిలుపడం
  alternative: దాన్ని కీర్తన 19 సందర్భానుసారం ఆకాశాలను సూచించేదిగా, లేదా పౌలు అన్వయంలో సువార్త ప్రకటకులను సూచించేదిగా స్పష్టీకరించడం
  rationale: పౌలు కీర్తన భాషను తన వాదనలో ఉపయోగిస్తున్నాడు. సర్వనామాన్ని అలాగే ఉంచడం మూలపాఠంలోని అంతర్పాఠ్య అస్పష్టతను, వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ప్రశ్న–సమాధాన నిర్మాణం స్పష్టంగా ఉంచబడింది; ఉల్లేఖనంలోని కవితాత్మక సమాంతరత కోసం రెండు పాదాల రూపం ఉపయోగించబడింది.
