id: ROM.10.3
reference: Romans 10:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: te
  text: ఎందుకంటే, వారు దేవుని నీతిని[a] తెలియక, తమ సొంత నీతిని స్థాపించడానికి ప్రయత్నిస్తూ, దేవుని నీతికి లోబడలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీతి’ అని అనువదించిన గ్రీకు పదానికి ఇక్కడ ‘న్యాయం’ అనే భావం కూడా ఉండవచ్చు. పౌలు వాడుకలో అది దేవుని నీతిస్వభావాన్ని, ఆయన న్యాయమైన కార్యాన్ని, లేదా మనుషులను తనతో సరైన సంబంధంలోకి తెచ్చే విధానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘దేవుని నీతి’ అనే మాటను ‘దేవుని నుండి వచ్చే నీతి’ లేదా ‘దేవునికి చెందిన నీతి’ అని కూడా అర్థం చేసుకోవచ్చు. గ్రీకు పదబంధం ఈ భావ ఛాయలను అనుమతిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: ఎరుగక
  rationale: వర్తమాన అసమాపక క్రియ సూచించే నేపథ్య కారణాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఉద్దేశపూర్వక తిరస్కారమని అతిగా నిర్ధారించదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని ప్రకటనకు ఈ వచనం వివరణాత్మక కారణాన్ని ఇస్తున్న సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: నీతి
  rationale: పౌలు వాడుకలో దేవుని న్యాయస్వభావం, సరిచేసే కార్యం, దేవుని ఎదుట సరైన స్థితి వంటి భావాలను మోయగల సాంప్రదాయికమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదం.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తిలోని స్వామ్య, మూలం, దేవుని కార్యం అనే భావసంభావ్యతలను సాధ్యమైనంతవరకు తెరిచి ఉంచుతుంది.
- source_word: ἰδίαν
  choice: తమ సొంత నీతిని
  rationale: గ్రీకులో ముందు వచ్చిన δικαιοσύνη పదం ఇక్కడ అధ్యాహారంగా ఉంది; తెలుగులో భావస్పష్టత కోసం ‘నీతి’ని పునరుక్తం చేయడం సహజం.
- source_word: ζητοῦντες
  choice: ప్రయత్నిస్తూ
  rationale: తమ నీతిని స్థాపించాలనే కొనసాగుతున్న యత్నాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: στῆσαι
  choice: స్థాపించడానికి
  rationale: ἵστημι ఇక్కడ ‘నిలబెట్టు/ఏర్పరచు’ అనే ప్రయుక్తార్థంలో ఉంది; వాదన సందర్భంలో ‘స్థాపించు’ సరిగ్గా సరిపోతుంది.
- source_word: ὑπετάγησαν
  choice: లోబడలేదు
  rationale: రూపంలో కర్మణి అయినా సందర్భంలో స్వచ్ఛందంగా అధీనపడడం అనే మధ్యమ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘దేవుని నీతి’ అనే పదబంధంలోని పౌలు భావం
  choice: ప్రధాన పాఠ్యంలో ‘దేవుని నీతి’ అని ఉంచి భావాన్ని నిర్బంధించలేదు.
  alternative: ‘దేవుని నుండి వచ్చే నీతి’; ‘దేవునికి చెందిన నీతి’; ‘దేవుని న్యాయమైన రక్షణకార్యం’
  rationale: τοῦ θεοῦ అనే షష్ఠీ విభక్తి స్వామ్యాన్ని, మూలాన్ని లేదా దేవుని నీతిమయమైన రక్షణకార్యాన్ని సూచించవచ్చు. ఒకే సిద్ధాంతార్థాన్ని బలవంతంగా ఎంచుకోకుండా పౌలు మాటలోని అంతర్లీన ఉద్రిక్తతను నిలిపింది.
- issue: δικαιοσύνη యొక్క అర్థ పరిధి
  choice: ‘నీతి’
  alternative: ‘న్యాయం’
  rationale: ఈ సందర్భంలో కేవలం తీర్పు సంబంధ న్యాయం కంటే దేవుని నీతిస్వభావం, నీతికరమైన కార్యం, మనుషులను సరైన స్థితిలో ఉంచడం వంటి విస్తృత భావం సాధ్యమవుతుంది; ‘న్యాయం’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘ఎరుగక’ కొద్దిగా ఉన్నత శైలిలో ఉన్నా బైబిలు గద్యానికి సహజంగా ఉండి, ‘తెలియక’ కంటే గుర్తించకపోవడం అనే భావాన్ని మెరుగ్గా మోస్తుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
