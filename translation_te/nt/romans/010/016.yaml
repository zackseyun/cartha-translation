id: ROM.10.16
reference: Romans 10:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: te
  text: 'అయితే అందరూ శుభవార్తకు[a] లోబడలేదు. ఎందుకంటే యెషయా ఇలా అంటున్నాడు: “ప్రభువా, మా సందేశాన్ని[b] ఎవరు నమ్మారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సువార్తకు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మా వార్తను”; అక్షరార్థంగా, “మా వినికిడిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: అయితే
  rationale: ముందటి వాదనతో ఉన్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: οὐ πάντες
  choice: అందరూ … లేదు
  rationale: గ్రీకులోని పాక్షిక నిరాకరణను కాపాడుతుంది; ఎవరూ స్పందించలేదనే సంపూర్ణ నిరాకరణ భావాన్ని కలిగించదు.
- source_word: ὑπήκουσαν
  choice: లోబడలేదు
  rationale: కేవలం వినడం కాకుండా విధేయతతో స్పందించడం అనే ὑπακούω బలమైన అర్థాన్ని నిలుపుతుంది.
- source_word: τῷ εὐαγγελίῳ
  choice: శుభవార్తకు
  rationale: εὐαγγέλιον యొక్క పారదర్శకమైన అర్థాన్ని సాధారణ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా అందిస్తుంది; సంప్రదాయ పదమైన ‘సువార్త’ను పాదసూచికలో ఉంచింది.
- source_word: Ἠσαΐας
  choice: యెషయా
  rationale: ప్రవక్త పేరుకు తెలుగులో స్థిరపడిన సాధారణ రూపం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు యెషయా వాక్యం ఆధారమని తెలిపే వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: λέγει
  choice: ఇలా అంటున్నాడు
  rationale: మూలంలోని వర్తమాన కాలాన్ని నిలుపుతూ, లేఖన వాక్యం ప్రస్తుతం పలుకుతున్నట్టున్న భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: సంబోధనా విభక్తిని స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: τίς
  choice: ఎవరు
  rationale: మూలంలోని ప్రశ్నార్థక సర్వనామానికి నేరమైన సమానార్థకం.
- source_word: ἐπίστευσεν
  choice: నమ్మారు
  rationale: ఉద్ధరణలోని అలంకారిక ప్రశ్నకు సహజమైన తెలుగు క్రియారూపం; నమ్మకంతో స్పందించే భావాన్ని నిలుపుతుంది.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: మా సందేశాన్ని
  rationale: ἀκοή ఇక్కడ విన్న విషయాన్ని, అంటే ప్రకటించబడిన వార్త లేదా సందేశాన్ని సూచించడం సందర్భానికి అత్యంత సహజం; ఇతర సాధ్యార్థాలను పాదసూచికలో తెలిపింది.
theological_decisions:
- issue: ὑπήκουσαν τῷ εὐαγγελίῳలో శుభవార్త కోరే స్పందన స్వభావం
  choice: ‘శుభవార్తకు లోబడలేదు’ అని అనువదించడం
  alternative: ‘శుభవార్తను వినలేదు’ లేదా ‘శుభవార్తను లక్ష్యపెట్టలేదు’
  rationale: గ్రీకు క్రియ విధేయతను స్పష్టంగా సూచిస్తుంది. అందువల్ల దాన్ని కేవలం వినడంగా తగ్గించకుండా, విశ్వాసం మరియు విధేయ స్పందన మధ్య పౌలు ఉంచిన సంబంధాన్ని కాపాడుతుంది; అయితే రక్షణ విధానం గురించి ఏ ప్రత్యేక మతశాఖ సిద్ధాంతాన్నీ చేర్చదు.
- issue: యెషయా ఉద్ధరణలో ἀκοή అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘సందేశం’
  alternative: ‘వార్త’ లేదా అక్షరార్థమైన ‘వినికిడి’
  rationale: ఈ పదం వినే చర్యను గానీ, వినబడిన విషయాన్ని గానీ సూచించగలదు. ఇక్కడ ప్రకటించబడిన విషయమనే అర్థం సందర్భానికి సహజం; పదంలోని నిజమైన అర్థవిస్తృతిని పాదసూచికలో కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘లోబడలేదు’ అనే రూపం మూలంలోని విధేయత భావాన్ని కాపాడుతుంది. ఉద్ధరణలో సహజమైన తెలుగు పదక్రమాన్ని అనుసరించగా, ἀκοή యొక్క అర్థవిస్తృతిని పాదసూచికలో పారదర్శకంగా ఉంచాం.
