source:
  edition: SBLGNT
  text: Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/013.yaml
  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: te
  text: ఎందుకంటే ప్రభువు నామాన్ని పిలుచుకునే ప్రతి ఒక్కరూ రక్షించబడతారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పౌలు యోవేలు 2:32ను ఉటంకిస్తున్నాడు. యోవేలులో ‘ప్రభువు’ అనేది YHWHను సూచిస్తుంది; ఇక్కడి సందర్భంలో పౌలు ఈ వాక్యాన్ని యేసుకు అన్వయిస్తున్నాడు.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘ప్రభువు నామాన్ని మొరపెట్టుకునే.’ గ్రీకు పదబంధం ప్రభువు నామాన్ని పిలుచుకొని ప్రార్థనతో విన్నవించడం లేదా ఆయనను ఆశ్రయించడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: ప్రతి ఒక్కరూ
  rationale: ఈ నిర్మాణం ఎవరినీ మినహాయించని సాధారణ భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘ప్రతి ఒక్కరూ’ సహజంగా ఉండి స్త్రీపురుషులందరినీ కలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి లేఖనాధారమైన వివరణను పరిచయం చేసే కారణసంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπικαλέσηται
  choice: ప్రార్థిస్తూ పిలిచే
  rationale: ఇక్కడి క్రియ కేవలం పేరు పెట్టి పిలవడం కాకుండా, ప్రభువును పేరునుబట్టి ప్రార్థనతో ఆశ్రయించడం లేదా మొరపెట్టుకోవడం అనే భావాన్ని కలిగి ఉంది. ‘ప్రార్థిస్తూ పిలిచే’ ఆ భావాన్ని సాధారణ పాఠకులకు స్పష్టం చేస్తుంది.
- source_word: τὸ ὄνομα
  choice: నామాన్ని
  rationale: బైబిలు భాషలోని ‘నామం’ అనే వ్యక్తిత్వం, అధికారం, వెల్లడైన గుర్తింపుతో కూడిన భావాన్ని పారాఫ్రేజ్ చేయకుండా నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: గ్రీకు పాఠంలోని κύριοςను నేరుగా ‘ప్రభువు’గా అనువదిస్తూ, ప్రధాన పాఠంలో ‘యేసు’ లేదా ‘యెహోవా’ అని విస్తరించకుండా మూలంలోని రూపాన్ని కాపాడుతుంది.
- source_word: σωθήσεται
  choice: రక్షించబడతారు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని, ఈ సందర్భంలోని పౌలు చెప్పే రక్షణ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యోవేలు ఉల్లేఖనంలో ‘ప్రభువు’ ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘ప్రభువు’ అనే పదాన్నే ఉంచడం; సందర్భంలో పౌలు ఈ వాక్యాన్ని యేసుకు అన్వయిస్తున్నాడని పాదసూచికలో తెలియజేయడం.
  alternative: ‘యెహోవా’ లేదా ‘ప్రభువైన యేసు’ అని ప్రధాన పాఠంలో స్పష్టీకరించడం.
  rationale: SBLGNTలో κυρίου మాత్రమే ఉంది. యోవేలు 2:32లో ఇది YHWHను సూచిస్తుండగా, రోమా 10 సందర్భంలో పౌలు దీనిని యేసుకు అన్వయిస్తున్నాడు. ప్రధాన పాఠాన్ని విస్తరించకుండా ఈ అంతర్పాఠ్య మరియు క్రీస్తుసంబంధ ఉద్వేగాన్ని పాదసూచిక కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ప్రార్థిస్తూ పిలిచే’ అనేది ‘నామాన్ని పిలుచు’ అనే అపార్థసాధ్యమైన పదక్షర రూపం కన్నా invocation/appeal భావాన్ని స్పష్టం చేస్తుంది; పాదసూచికలో ‘మొరపెట్టుకునే’ ప్రత్యామ్నాయం ఇవ్వబడింది.
