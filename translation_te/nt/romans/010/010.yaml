id: ROM.10.10
reference: Romans 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: te
  text: ఎందుకంటే, హృదయంతో విశ్వసించడం నీతికి[a] దారితీస్తుంది; నోటితో ఒప్పుకోవడం రక్షణకు దారితీస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయానికి.’ గ్రీకు δικαιοσύνη అనే పదానికి ‘న్యాయం’ అనే అర్థం కూడా ఉండవచ్చు; అయితే పౌలు రచనల్లో సాధారణంగా ‘నీతి’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίᾳ
  choice: హృదయంతో
  rationale: కరణార్థక దత్తివిభక్తిని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, అంతరంగ విశ్వాసాన్ని సూచిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి ఇది వివరణను అందిస్తున్న అనుసంధానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: πιστεύεται
  choice: విశ్వసించడం
  rationale: సాధారణంగా ప్రతి వ్యక్తికీ వర్తించే భావాన్ని తెలుగులో సహజమైన క్రియానామ రూపంతో తెలియజేస్తుంది; కర్తను అనవసరంగా చేర్చదు.
- source_word: εἰς δικαιοσύνην
  choice: నీతికి దారితీస్తుంది
  rationale: εἰς సూచించే లక్ష్యం లేదా ఫలిత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; సంబంధాన్ని యాంత్రికంగా నిర్వచించదు.
- source_word: δικαιοσύνην
  choice: నీతి
  rationale: పౌలు రచనల్లో δικαιοσύνη యొక్క న్యాయపరమైన, సంబంధపరమైన, నైతిక విస్తృతిని సాధ్యమైనంతగా నిలిపే స్థిరమైన తెలుగు పదం.
- source_word: στόματι
  choice: నోటితో
  rationale: καρδίᾳతో ఉన్న సమాంతర నిర్మాణాన్ని, బాహ్యమైన మాటల వ్యక్తీకరణను సహజంగా నిలుపుతుంది.
- source_word: δὲ
  choice: ;
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతకన్నా పరస్పరపూరకమైన రెండో వాక్యభాగాన్ని పరిచయం చేస్తుంది; తెలుగు విరామచిహ్నం ఈ సమాంతరతను అతిశయింపకుండా చూపుతుంది.
- source_word: ὁμολογεῖται
  choice: ఒప్పుకోవడం
  rationale: 9వ వచన సందర్భంలో యేసును ప్రభువుగా నోటితో అంగీకరించి ప్రకటించడాన్ని సూచిస్తుంది; సాధారణ వర్తనను క్రియానామ రూపం నిలుపుతుంది.
- source_word: εἰς σωτηρίαν
  choice: రక్షణకు దారితీస్తుంది
  rationale: మొదటి εἰς పదబంధంతో సమాంతరంగా లక్ష్యం లేదా ఫలితాన్ని తెలియజేస్తుంది; కారణక్రమాన్ని మించిన వివరణను చేర్చదు.
- source_word: σωτηρίαν
  choice: రక్షణ
  rationale: పౌలు సంబంధమైన ఈ సందర్భంలో వర్తమాన మరియు అంత్యకాలిక కోణాలను కలిగి ఉండగల ప్రామాణిక తెలుగు పదం.
theological_decisions:
- issue: విశ్వాసం/ఒప్పుకోలు మరియు నీతి/రక్షణ మధ్య సంబంధం
  choice: హృదయ విశ్వాసం నీతికి, నోటి ఒప్పుకోలు రక్షణకు దారితీస్తాయని సమాంతరంగా అనువదించడం
  alternative: ఒప్పుకోలు రక్షణకు కేవలం సాక్ష్యమని లేదా రక్షణను సంపాదించే అదనపు కార్యమని స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం రెండు సమాంతర εἰς నిర్మాణాలను ఉంచుతుంది. అనువాదం వాటిని నిలిపి, నీతీకరణ క్రమం లేదా పుణ్యకార్య స్వభావం గురించి వచనం చెప్పనిదాన్ని జోడించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని హృదయం/నోరు సమాంతరతను, నీతి/రక్షణ లక్ష్య-ఫలిత సంబంధాన్ని నిలుపుతూ, ‘దారితీస్తుంది’ ద్వారా కఠినమైన పాతశైలి ‘కొరకు/వరకు’ నిర్మాణాన్ని నివారించింది.
