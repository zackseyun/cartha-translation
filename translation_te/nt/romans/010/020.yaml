id: ROM.10.20
reference: Romans 10:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: te
  text: 'అయితే యెషయా ఎంతో ధైర్యంగా ఇలా అంటున్నాడు: “నన్ను వెదకనివారికి నేను దొరికాను[a]; నన్ను గురించి అడగనివారికి నేను ప్రత్యక్షమయ్యాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను వెదకనివారి మధ్య నేను దొరికాను.”
    reason: ἐν అనే ఉపసర్గకు మరింత రూపసన్నిహితమైన ప్రత్యామ్నాయాన్ని చూపించడం.
  - marker: b
    text: లేదా, “నన్ను గురించి అడగనివారికి వారికి నన్ను నేను తెలియజేశాను.”
    reason: ἐμφανὴς ἐγενόμηνకు సందర్భానుకూలమైన, కాని కొంత భావవ్యాఖ్యాత్మకమైన ప్రత్యామ్నాయాన్ని చూపించడం.
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: మరింత ధైర్యంగా ... అంటున్నాడు
  rationale: క్రియలోని సాహసపూర్వకంగా, బాహాటంగా పలికే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ వర్తమానకాల ప్రవేశాన్ని నిలుపుతుంది.
- source_word: Εὑρέθην
  choice: నేను దొరికాను
  rationale: ప్రథమ పురుష ఏకవచన భూతకాల కర్మణి రూపాన్ని నేరుగా నిలుపుతూ, ఉద్ధరణలో దేవుని స్వీయసూచనను కాపాడుతుంది.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: నన్ను వెదకనివారికి
  rationale: ἐν యొక్క రూపపరమైన ‘మధ్య/లో’ భావం ఉన్నప్పటికీ, εὑρέθηνతో కలిసిన సందర్భార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘మధ్య’ అనే రూపసన్నిహిత ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
- source_word: ζητοῦσιν
  choice: వెదకనివారు
  rationale: ζητέωలోని అన్వేషణ భావాన్నీ వాక్యంలోని బైబిలీయ ప్రతిధ్వనినీ సరళంగా నిలుపుతుంది.
- source_word: ἐμφανὴς ἐγενόμην
  choice: నేను ప్రత్యక్షమయ్యాను
  rationale: ‘కనిపించేవాడనయ్యాను/ప్రత్యక్షుడనయ్యాను’ అనే మూల నిర్మాణ భావాన్ని సహజమైన, గంభీరమైన తెలుగులో ఇస్తుంది; ఉద్దేశపూర్వక స్వీయప్రకటనను అదనంగా నిర్దేశించదు.
- source_word: ἐπερωτῶσιν
  choice: నన్ను గురించి అడగనివారు
  rationale: అడగడం లేదా విచారించడం అనే విస్తృత భావాన్ని నిలుపుతుంది; ‘నాకు మొరపెట్టుకోవడం’ వంటి మరింత నిర్దిష్టమైన ధార్మిక భావాన్ని దిగుమతి చేయదు.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాదనతో ఉన్న వ్యత్యాసాన్ని ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: Ἠσαΐας
  choice: యెషయా
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరు రూపం.
theological_decisions:
- issue: యెషయా ఉద్ధరణలో దేవుని స్వీయప్రత్యక్షతను అనువదించడం
  choice: నన్ను గురించి అడగనివారికి నేను ప్రత్యక్షమయ్యాను
  alternative: నన్ను గురించి అడగనివారికి నన్ను నేను తెలియజేసుకున్నాను
  rationale: గ్రీకు పదబంధం ప్రత్యక్షం కావడాన్ని చెబుతుంది గాని, ‘నన్ను నేను తెలియజేసుకున్నాను’ అని క్రియాశీల స్వీయప్రకటనను స్పష్టంగా చెప్పదు. ప్రధాన పాఠం ఆ ఉద్వేగాన్ని నిలుపుతుంది; భావవ్యాఖ్యాత్మక ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా ప్రవచన ఉద్ధరణకు తగిన గంభీరతతో రూపొందించబడింది. ‘మరింత ధైర్యంగా’ అనేది సందర్భంలోని వ్యత్యాసాన్ని, ἀποτολμᾷ యొక్క బలాన్ని తెలియజేస్తుంది.
