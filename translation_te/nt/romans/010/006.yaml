id: ROM.10.6
reference: Romans 10:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: te
  text: 'అయితే విశ్వాసం నుండి వచ్చే నీతి[a] ఇలా మాట్లాడుతుంది: “నీ హృదయంలో, ‘పరలోకానికి ఎవరు ఎక్కిపోతారు?’ అని అనవద్దు”[b]—అంటే, మెస్సీయను[c] కిందికి తీసుకురావడం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విశ్వాసం నుండి వచ్చే న్యాయం.’ ఇక్కడి గ్రీకు పదం δικαιοσύνη సందర్భానుసారం ‘నీతి,’ ‘న్యాయం’ అనే భావాలను కలిగి ఉండగలదు.
    reason: lexical_alternative
  - marker: b
    text: పౌలు ఇక్కడ ద్వితీయోపదేశకాండం 30:12ను ప్రతిధ్వనింపజేస్తూ, దానిని మెస్సీయకు అన్వయిస్తున్నాడు.
    reason: cross_reference
  - marker: c
    text: గ్రీకులో ‘క్రీస్తు’; ఇక్కడ Χριστός వ్యక్తినామంలా కాక బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοσύνη
  choice: నీతి
  rationale: పౌలు వాడిన పదంలోని నైతిక, న్యాయస్థాన సంబంధిత భావాలను సాధ్యమైనంత విస్తృతంగా నిలుపుతుంది; ‘న్యాయం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἐκ πίστεως
  choice: విశ్వాసం నుండి వచ్చే
  rationale: ἐκ సూచించే మూలాన్ని స్పష్టంగా ఉంచుతూ, ఆధునిక తెలుగులో సహజంగా ఉండేలా అనువదించాం; చుట్టుపక్కల వచనాల్లో ధర్మశాస్త్రం ఆధారమైన నీతితో ఉన్న వ్యత్యాసాన్ని కూడా నిలుపుతుంది.
- source_word: οὕτως λέγει
  choice: ఇలా మాట్లాడుతుంది
  rationale: నీతి మాట్లాడుతున్నట్లుగా గ్రీకులో ఉన్న వ్యక్తీకరణను, వర్తమాన కాల భావాన్ని నిలిపింది.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: నీ హృదయంలో … అని అనవద్దు
  rationale: అంతరంగంలో తనకు తాను చెప్పుకోవడం లేదా తలంచడం అనే హీబ్రూ-గ్రీకు ప్రయోగ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: పరలోకానికి ఎవరు ఎక్కిపోతారు?
  rationale: ἀναβαίνω యొక్క పైకి వెళ్లే భావాన్ని స్పష్టంగా ఉంచి, ప్రశ్న యొక్క అలంకారిక స్వరూపాన్ని కాపాడుతుంది.
- source_word: Χριστόν
  choice: మెస్సీయను
  rationale: ఈ లేఖన వివరణలో Χριστός వ్యక్తినామంలా కాక అభిషిక్తుని బిరుదుగా పనిచేస్తున్నందున దాని బిరుదు భావాన్ని తెలిపాం.
- source_word: καταγαγεῖν
  choice: కిందికి తీసుకురావడం
  rationale: పైకి ఎక్కడం అనే ముందరి క్రియకు విరుద్ధమైన దిశను, వివరణాత్మక క్రియారూపాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ‘విశ్వాసం నుండి వచ్చే నీతి’కి వ్యక్తిత్వారోపణ
  choice: ‘నీతి ఇలా మాట్లాడుతుంది’ అని వ్యక్తిత్వారోపణను నిలిపాం.
  alternative: ‘విశ్వాసం వల్ల కలిగే నీతి చెప్పేది ఇదే’ అని మరింత అమూర్తంగా చెప్పవచ్చు.
  rationale: δικαιοσύνη గ్రీకులో λέγει అనే క్రియకు కర్తగా ఉంది; పౌలు ఉపయోగించిన అలంకారాన్ని, ముందు వచనంతో ఉన్న వ్యత్యాసాన్ని ఇది కాపాడుతుంది.
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ద్వితీయోపదేశకాండంలోని వాక్యాన్ని మెస్సీయకు అన్వయించే ఈ సందర్భంలో ఇది బిరుదుగా పనిచేస్తుంది; అందువల్ల బిరుదు అర్థాన్ని స్పష్టంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘పరలోకం,’ ‘హృదయం,’ ‘మెస్సీయ’ వంటి పరిచిత బైబిలు పదాలను ఉంచి, అతిగా ప్రాచీనమైన క్రియారూపాలను నివారించాం.
