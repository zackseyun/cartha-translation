  text: ἤ· Τίς καταβήσεται εἰς τὴν ἄβυσσον; τοῦτ’ ἔστιν Χριστὸν ἐκ νεκρῶν ἀναγαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: te
  text: లేదా, “అగాధంలోకి[a] దిగిపోవగలవాడు ఎవరు?” (అంటే, మెస్సీయను[b] మృతులలోనుండి పైకి తీసుకురావడమే).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లోతులోకి.” పౌలు ద్వితీయోపదేశకాండం 30:13ను ప్రతిధ్వనింపజేస్తున్నాడు; అయితే ఇక్కడ “అగాధం” అనే పదాన్ని వాడి, ఆ భాషను మెస్సీయను మృతులలోనుండి పైకి తీసుకురావడానికి అన్వయిస్తున్నాడు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “క్రీస్తు”; ఇక్కడ Χριστός ఒక బిరుదుగా పనిచేస్తున్నందున “మెస్సీయ” అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: లేదా
  rationale: మునుపటి ప్రశ్నకు ప్రత్యామ్నాయంగా రెండవ అలంకారిక ప్రశ్నను పరిచయం చేసే సాధారణ, సహజమైన తెలుగు అనుసంధానం.
- source_word: Τίς καταβήσεται
  choice: దిగిపోయేవాడు ఎవరు?
  rationale: భవిష్యత్ క్రియను అలంకారిక ప్రశ్నగా సహజమైన తెలుగులో వ్యక్తం చేస్తూ, కిందికి వెళ్లే దిశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: εἰς τὴν ἄβυσσον
  choice: అగాధంలోకి
  rationale: ἄβυσσος సూచించే అపారమైన లోతును, మృతులలోనుండి పైకి తీసుకురావడం అనే పౌలు వివరణలోని గంభీరమైన దృశ్యాన్ని సంకుచితం చేయకుండా నిలుపుతుంది.
- source_word: τοῦτ’ ἔστιν
  choice: అంటే
  rationale: గ్రీకు వివరణాత్మక సూత్రానికి ఆధునిక తెలుగులో సంక్షిప్తమైన, సహజమైన సమానం.
- source_word: Χριστόν
  choice: మెస్సీయను
  rationale: ఇక్కడ Χριστός అభిషిక్తుని సూచించే బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని బిరుదాత్మక అర్థాన్ని అనువదించడం సముచితం.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: బహువచన గ్రీకు ప్రయోగాన్ని, ‘మృతుల మధ్యనుండి’ అనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀναγαγεῖν
  choice: పైకి తీసుకురావడం
  rationale: ‘అగాధంలోకి దిగిపోవడం’తో ఉన్న స్థలసంబంధ విరుద్ధతను కాపాడుతుంది; క్రియను నేరుగా ‘లేపడం’గా మార్చి భావాన్ని ముందుగానే నిర్ధారించదు.
theological_decisions:
- issue: Χριστός పదం బిరుదా, పేరులా అనువదించాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వివరణలో అభిషిక్త విమోచకుడనే బిరుదాత్మక భావం ప్రధానంగా ఉంది. ‘మెస్సీయ’ ఆ అర్థాన్ని స్పష్టంగా అందిస్తుంది; పాదసూచిక మూల గ్రీకు రూపాన్ని తెలియజేస్తుంది.
- issue: ἄβυσσος యొక్క భావాన్ని ఎలా వ్యక్తం చేయాలి
  choice: అగాధం
  alternative: లోతు; మృతుల లోకం; పాతాళం
  rationale: పౌలు ద్వితీయోపదేశకాండంలోని భాషను అన్వయిస్తూ, మెస్సీయను మృతులలోనుండి పైకి తీసుకురావడాన్ని సూచిస్తున్నాడు. ‘అగాధం’ అనే రూపకాన్ని అలాగే ఉంచడం ద్వారా దాన్ని ‘సమాధి,’ ‘పాతాళం,’ లేదా ఒక నిర్దిష్ట మృతుల లోకంగా సంకుచితం చేయకుండా అసలు వచనంలోని ఉద్వేగం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ప్రశ్నలోని దిగడం–పైకి తీసుకురావడం అనే దిశాత్మక సమాంతరాన్ని నిలిపి, ‘అగాధం’ అనే రూపకాన్ని వ్యాఖ్యానాత్మక పదంతో భర్తీ చేయలేదు.
