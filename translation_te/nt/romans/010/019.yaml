- from: 'అయితే నేను అడుగుతున్నాను: ఇశ్రాయేలుకు తెలియలేదా?[a] మొదట మోషే ఇలా అంటున్నాడు: “జనమే కానిదాని ద్వారా మీకు అసూయ పుట్టిస్తాను; అవివేకమైన జనము ద్వారా మీకు కోపం పుట్టిస్తాను.”[b]'
  to: 'అయితే నేను అడుగుతున్నాను: ఇశ్రాయేలు తెలుసుకోలేదా?[a] మొదట మోషే ఇలా అంటున్నాడు: “జనము కాని వారిచేత మీకు అసూయ కలిగిస్తాను; అవివేకమైన జనము చేత మీకు కోపం కలిగిస్తాను.”[b]'
