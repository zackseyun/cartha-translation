id: ROM.10.19
reference: Romans 10:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: te
  text: 'అయితే నేను అడుగుతున్నాను: ఇశ్రాయేలు తెలుసుకోలేదా?[a] మొదట మోషే ఇలా అంటున్నాడు: “జనము కాని వారిచేత మీకు అసూయ కలిగిస్తాను; అవివేకమైన జనము చేత మీకు కోపం కలిగిస్తాను.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలు అర్థం చేసుకోలేదా?” గ్రీకు క్రియకు ‘తెలుసుకోవడం,’ ‘గ్రహించడం’ అనే రెండు భావాలూ ఉండవచ్చు; ఈ సందర్భంలో విన్న సందేశపు ప్రాముఖ్యతను గ్రహించడం ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ద్వితీయోపదేశకాండము 32:21 నుండి ఉల్లేఖనం. “జనము కాని వారు” అనేది నిజమైన జనంగా పరిగణించబడని ప్రజలను—ఈ సందర్భంలో అన్యజనులను—సూచించవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: ఇశ్రాయేలుకు తెలియలేదా?
  rationale: ἔγνω యొక్క ప్రాథమిక ‘తెలుసుకొను’ భావాన్ని నిలుపుతూ, గ్రీకు వాక్యంలోని అలంకార ప్రశ్నను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది. సందర్భంలో ‘అర్థం చేసుకోలేదా?’ అనే భావసంభావ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: πρῶτος
  choice: మొదట
  rationale: లేఖన సాక్ష్యాల వరుసలో మోషేను మొదటి సాక్షిగా సూచించే క్రియావిశేషణ భావాన్ని కాపాడుతుంది.
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపం.
- source_word: παραζηλώσω
  choice: మీకు అసూయ పుట్టిస్తాను
  rationale: అసూయకు ప్రేరేపించడం అనే causative భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπ’ οὐκ ἔθνει
  choice: జనమే కానిదాని ద్వారా
  rationale: ‘ఒక జనము కానిది’ అనే ఉద్దేశపూర్వక విరోధాభాసాన్ని నిలుపుతుంది; దాని సూచిత వర్గాన్ని ప్రధాన పాఠ్యంలో స్పష్టీకరించదు.
- source_word: ἔθνει ἀσυνέτῳ
  choice: అవివేకమైన జనము ద్వారా
  rationale: ἀσύνετος లోని అవగాహన లేదా వివేకం లేమిని సంక్షిప్తంగా, గౌరవప్రదమైన బైబిలు శైలిలో వ్యక్తపరుస్తుంది.
- source_word: παροργιῶ
  choice: మీకు కోపం పుట్టిస్తాను
  rationale: కోపానికి ప్రేరేపించడం అనే causative భావాన్ని కాపాడి, ముందున్న ‘అసూయ పుట్టిస్తాను’తో సమాంతరతను నిలుపుతుంది.
- source_word: ὑμᾶς
  choice: మీకు
  rationale: గ్రీకులోని బహువచన ద్వితీయ పురుషాన్ని తెలుగులో సందర్భానుగుణంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: మోషే ఉల్లేఖనంలోని ‘జనమే కానిది’ మరియు ‘అవివేకమైన జనము’ ఎవరిని సూచిస్తాయి?
  choice: ప్రధాన పాఠ్యంలో ఉల్లేఖనపు రూపాన్నే నిలుపుతూ, సూచిత వర్గాన్ని ప్రత్యక్షంగా గుర్తించలేదు.
  alternative: అన్యజనులు; లేదా ఇశ్రాయేలు నిజమైన జనంగా పరిగణించని ప్రజలు.
  rationale: ద్వితీయోపదేశకాండము 32:21లోని వాక్యరూపాన్ని పౌలు ఉపయోగిస్తున్నాడు. ‘అన్యజనులు’ అని ప్రధాన పాఠ్యంలో చేర్చడం వ్యాఖ్యానాన్ని అనువాదంలో స్థిరపరుస్తుంది; అందుచేత అసలు పాఠ్యంలోని ధార్మిక ఉద్వేగం, సూచనాత్మకత యథాతథంగా ఉంచబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలితో రూపొందించబడింది. ‘జనము’ అనే రూపం ఉల్లేఖనపు గంభీరత కోసం ఉంచబడింది; వాక్య నిర్మాణం మాత్రం ఆధునికంగా ఉంది.
