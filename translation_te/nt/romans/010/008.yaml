id: ROM.10.8
reference: Romans 10:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: te
  text: అయితే అది ఏమి చెబుతోంది? “వాక్యం నీకు సమీపంలో ఉంది, నీ నోటిలోనూ నీ హృదయంలోనూ ఉంది,” అంటే, మేము ప్రకటించే విశ్వాస వాక్యం[a] ఇదే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విశ్వాస సందేశం.” πίστις అనే గ్రీకు పదాన్ని కొన్ని సందర్భాల్లో “నమ్మకం” లేదా “విశ్వాస్యత” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: పౌలు ద్వితీయోపదేశకాండము 30:14లోని మాటలను ప్రతిధ్వనింపజేస్తూ, వాటిని తాము ప్రకటించే సువార్త సందేశానికి అన్వయిస్తున్నాడు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందటి వాదనతో ఉన్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: τί λέγει
  choice: అది ఏమి చెబుతోంది?
  rationale: గ్రీకులో కర్త స్పష్టంగా చెప్పబడలేదు; సందర్భంలో లేఖనం వ్యక్తీకరించబడినట్లు ఉంది. ‘లేఖనం’ అని ప్రధాన పాఠ్యంలో చేర్చి భావాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: Ἐγγύς σου
  choice: నీకు సమీపంలోనే ఉంది
  rationale: స్థానపరమైన, రూపకాలంకారమైన సమీపత్వాన్ని రెండింటినీ కాపాడుతూ, ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ ῥῆμα
  choice: వాక్యం
  rationale: ఉల్లేఖనంలోని సంక్షిప్త పదాన్ని నిలుపుతూ, తరువాత పౌలు ఇచ్చే వివరణతో దాని సందేశార్థం స్పష్టమయ్యేలా చేస్తుంది.
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: నీ నోటిలోనూ నీ హృదయంలోనూ
  rationale: మూలంలోని శరీర సంబంధ ప్రతీకలను, సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: τοῦτ’ ἔστιν
  choice: అంటే ... ఇదే
  rationale: ఉల్లేఖనానికి పౌలు ఇస్తున్న వివరణను సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: విశ్వాస వాక్యం
  rationale: ముందటి ῥῆμαతో పదబంధ సంబంధాన్ని నిలుపుతుంది; సంక్షిప్త గ్రీకు సమాసంలోని విషయార్థం లేదా లక్షణార్థాన్ని అతిగా నిర్ణయించదు.
- source_word: ὃ κηρύσσομεν
  choice: మేము ప్రకటించే
  rationale: κηρύσσωలోని బహిరంగంగా ప్రకటించే భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
theological_decisions:
- issue: τὸ ῥῆμα τῆς πίστεως అనే పదబంధంలో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ సందర్భంలో ‘విశ్వాసం’ పౌలు వాడుకకు సహజమైన విస్తృత పదం. సందేశం విశ్వాసాన్ని విషయంగా కలిగిందా, విశ్వాసానికి పిలుస్తుందా, లేక విశ్వాసంతో లక్షణీకరించబడిందా అనే సంబంధాన్ని ప్రధాన పాఠ్యం ఖచ్చితంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘అది’ అనే సర్వనామం మూలంలోని అంతర్లీన కర్తను అలాగే ఉంచుతుంది; ‘లేఖనం’ అని వివరణాత్మక పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు. ఉల్లేఖనంలోని ‘నోరు–హృదయం’ ప్రతీకలు యథాతథంగా నిలుపబడ్డాయి.
