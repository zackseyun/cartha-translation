  terminology: “వాక్యం,” “హృదయం,” “విశ్వాసం,” and “ప్రకటించే” are appropriate, consistent renderings. In the lexical footnote, “విశ్వాస్యత” is a more exact equivalent for the alternative ‘faithfulness’ than “విశ్వసనీయత,” which more often denotes reliability/trustworthiness.
