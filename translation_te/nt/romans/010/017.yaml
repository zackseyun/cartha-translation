id: ROM.10.17
reference: Romans 10:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: te
  text: కాబట్టి విశ్వాసం వినడం వల్ల కలుగుతుంది; వినడం మెస్సీయ మాట ద్వారా కలుగుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయను గురించిన మాట ద్వారా” / “మెస్సీయను గురించిన సందేశం ద్వారా.” గ్రీకులోని షష్ఠీ సంబంధాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: కాబట్టి
  rationale: ముందున్న వాదన నుంచి తీసుకున్న నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో ప్రకటించిన సువార్తను విని మనిషి స్పందించే విశ్వాసాన్ని సూచిస్తుంది; ‘నమ్మకత్వం’ అనే భావం ఇక్కడ ప్రధానమైనది కాదు.
- source_word: ἐξ ἀκοῆς
  choice: వినడం వల్ల కలుగుతుంది
  rationale: ἐκ మూలాన్ని లేదా ఉద్భవాన్ని సూచిస్తుంది. క్రియలేని గ్రీకు వాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేయడానికి ‘కలుగుతుంది’ చేర్చబడింది.
- source_word: ἀκοή
  choice: వినడం
  rationale: ఈ పదం వినే చర్యను లేదా విన్న సందేశాన్ని సూచించగలదు. ఇక్కడ సందర్భానుసారం వినే చర్య ప్రధానంగా ఉన్నప్పటికీ, మూలంలోని పదపునరుక్తిని నిలుపుకోవడానికి రెండు చోట్లా ఒకే పదం వాడబడింది.
- source_word: δὲ
  choice: వినడమైతే
  rationale: బలమైన వ్యతిరేకతను కాకుండా రెండో అంశానికి స్వల్ప విషయ-మార్పును సూచించే సహజమైన తెలుగు నిర్మాణం.
- source_word: διὰ
  choice: ద్వారా
  rationale: షష్ఠీ విభక్తితో ఉన్న διά సాధనాన్ని లేదా మాధ్యమాన్ని సూచిస్తుంది.
- source_word: ῥήματος
  choice: మాట
  rationale: ῥῆμα పలికిన మాట లేదా ఉక్తిని సూచిస్తుంది. ‘మాట’ మూలపదానికి దగ్గరగా ఉండి సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉంది. ‘మెస్సీయ మాట’ అనే నిర్మాణం గ్రీకు షష్ఠీ సంబంధాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో πίστις భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; నమ్మకత్వం
  rationale: రోమా 10:14–16లో ప్రకటించిన సందేశానికి మానవ స్పందనే ప్రధానాంశం కాబట్టి ‘విశ్వాసం’ తగినది.
- issue: ῥήματος Χριστοῦలోని షష్ఠీ సంబంధం
  choice: మెస్సీయ మాట
  alternative: మెస్సీయను గురించిన మాట; మెస్సీయను గురించిన సందేశం
  rationale: గ్రీకు నిర్మాణం మెస్సీయ నుంచి వచ్చిన మాటగా గానీ, మెస్సీయను గురించిన మాటగా గానీ అర్థం కావచ్చు. ప్రధాన పాఠం సాపేక్షంగా రూపనిష్ఠంగా ఉండగా, మరో సాధ్యమైన భావం పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో రూపొందించబడింది. మూలంలోని సంక్షిప్త తార్కిక నిర్మాణం, ‘వినడం’ అనే పదపునరుక్తి, Χριστοῦలోని భావసందిగ్ధత నిలుపబడ్డాయి.
