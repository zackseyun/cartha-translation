    issue: The τέλος footnote uses “పరిపూర్ణ ముగింపు.”
    rationale: This phrase is unnatural in modern Telugu and does not clearly express τέλος as culmination or fulfillment. It should be replaced with idiomatic terms that preserve, rather than collapse, the source ambiguity.
  - severity: low
    issue: “నీతి కలిగేలా” is less direct than the Greek purpose/result construction.
    rationale: “నీతి కలగడానికి” is more natural standard Telugu and represents εἰς δικαιοσύνην without specifying whether the emphasis is exclusively purpose or result.
