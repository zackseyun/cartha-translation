id: ROM.10.4
reference: Romans 10:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: te
  text: 'ఎందుకంటే, విశ్వసించే ప్రతి ఒక్కరికీ నీతి కలగడానికి మెస్సీయే ధర్మశాస్త్రానికి అంతం[a][b].


    [a] లేదా “లక్ష్యం,” “పరాకాష్ఠ,” లేదా “నెరవేర్పు.” ఇక్కడ “అంతం” అని అనువదించిన గ్రీకు పదానికి ముగింపు, లక్ష్యం, పరాకాష్ఠ, లేదా నెరవేర్పు అనే అర్థాలు ఉండవచ్చు.


    [b] లేదా “న్యాయం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లక్ష్యం,” “పరాకాష్ఠ,” లేదా “నెరవేర్పు.” ఇక్కడ “అంతం” అని అనువదించిన గ్రీకు పదానికి ముగింపు, లక్ష్యం, పరాకాష్ఠ, లేదా నెరవేర్పు అనే అర్థాలు ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “న్యాయం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: అంతం
  rationale: ఈ పదం ముగింపు, లక్ష్యం, ఫలితం, లేదా పరిపూర్ణ ముగింపు అనే భావాలను సూచించగలదు. ప్రధాన పాఠంలోని “అంతం” సంక్షిప్తతను నిలుపుతూ, మిగిలిన భావసాధ్యతలను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: νόμου
  choice: ధర్మశాస్త్రానికి
  rationale: పౌలు సందర్భంలో ఇది సాధారణంగా నిబంధనల భావనను కాక, ఇశ్రాయేలుకు తెలిసిన మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది.
- source_word: Χριστὸς
  choice: మెస్సీయే
  rationale: ఇక్కడ యేసు ఇశ్రాయేలు ధర్మశాస్త్రంతోను నిబంధనాపరమైన నిరీక్షణలతోను ఉన్న సంబంధం ప్రధానంగా ఉంది; అందువల్ల బిరుదు భావాన్ని తెలిపే “మెస్సీయ” వాడబడింది. “ఏ” ధ్వని ఆయననే విధేయపదమైన “అంతం”తో స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: εἰς δικαιοσύνην
  choice: నీతి కలిగేలా
  rationale: εἰς యొక్క ఉద్దేశం లేదా ఫలిత దిశను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అది ఏ విధంగా కలుగుతుందో అదనంగా నిర్ణయించదు.
- source_word: δικαιοσύνην
  choice: నీతి
  rationale: పౌలు వాడుకలోని విస్తృత నైతిక, నిబంధనాపరమైన భావాలను మోయగల సాధారణ తెలుగు పదం. “న్యాయం” అనే సాధ్యమైన ప్రత్యామ్నాయం పాదటిప్పణిలో నిలుపబడింది.
- source_word: παντὶ τῷ πιστεύοντι
  choice: విశ్వసించే ప్రతి ఒక్కరికీ
  rationale: దత్తివ విభక్తి సూచించే వ్యక్తులను స్పష్టంగా తెలియజేస్తూ, గ్రీకు వర్తమాన కృదంత భావాన్ని మరియు సమగ్రతను నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం ముందున్న వాదనకు కారణం లేదా వివరణ ఇస్తున్నదని సహజ తెలుగులో సూచిస్తుంది.
theological_decisions:
- issue: τέλος νόμου అంటే మోషే ధర్మశాస్త్రంతో మెస్సీయకు ఉన్న సంబంధం
  choice: ప్రధాన పాఠంలో “ధర్మశాస్త్రానికి అంతం”; ముగింపు మరియు లక్ష్యం/పరిపూర్ణ ముగింపు భావాల మధ్య ఉన్న ఉద్రిక్తతను పాదటిప్పణిలో నిలుపడం
  alternative: “ధర్మశాస్త్రపు లక్ష్యం” లేదా “ధర్మశాస్త్రపు పరిపూర్ణ ముగింపు”
  rationale: గ్రీకు τέλος కాలపరమైన లేదా రక్షణచరిత్రపరమైన ముగింపును, అలాగే లక్ష్యం లేదా పరిపూర్ణతను సూచించగలదు. ఒక్క వ్యాఖ్యానాన్ని ఖరారు చేయకుండా నిజమైన సందిగ్ధతను నిలుపాలి.
- issue: Χριστός యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇశ్రాయేలు ధర్మశాస్త్రం మరియు నిబంధన కథతో సంబంధమున్న ఈ సందర్భంలో బిరుదు భావం సజీవంగా ఉంది.
- issue: δικαιοσύνη యొక్క అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: “నీతి” ప్రధాన పౌలు భావవ్యాప్తిని సహజంగా మోస్తుంది; “న్యాయం” కూడా సాధ్యమైన అర్థఛాయ కావడంతో పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలుపుతూ, “కలిగేలా” ద్వారా εἰς యొక్క ఉద్దేశం/ఫలిత సంబంధం సహజంగా వ్యక్తమైంది. ప్రధాన పాఠంలోని ప్రతి పాదటిప్పణి గుర్తు సంబంధిత పదం వద్ద ఉంచబడింది.
