id: ROM.10.5
reference: Romans 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: te
  text: 'ఎందుకంటే, ధర్మశాస్త్రం నుండి వచ్చే నీతి[a] గురించి మోషే ఇలా వ్రాస్తున్నాడు: “దానిని ఆచరించే మనిషి[b] దానిలో జీవిస్తాడు.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “న్యాయం”; గ్రీకు పదం δικαιοσύνη.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “మనిషి” అనే మాట ఈ విధంగా ఆచరించే ఏ వ్యక్తినైనా సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా “దాని ద్వారా జీవిస్తాడు.” పౌలు ఇక్కడ లేవీయకాండము 18:5ను ప్రతిధ్వనింపజేస్తున్నాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న వాదనకు ఈ వాక్యం వివరణను ఇస్తున్న సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది.
- source_word: γράφει
  choice: రాస్తున్నాడు
  rationale: లేఖనాన్ని ఉటంకించే గ్రీకు వర్తమాన కాల ప్రయోగాన్ని నిలుపుతుంది.
- source_word: δικαιοσύνην
  choice: నీతి
  rationale: రోమీయులకు పత్రికలోని న్యాయపరమైన, దేవునితో సరైన సంబంధానికి సంబంధించిన భావభారాన్ని మోయగల ప్రామాణిక తెలుగు పదం.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: ధర్మశాస్త్రం నుండి కలిగే
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని చూపిస్తూ, విశ్వాసం నుండి కలిగే నీతితో పౌలు చేస్తున్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ὁ ποιήσας
  choice: దానిని ఆచరించే
  rationale: సాధారణ సూత్రాన్ని తెలిపే కర్తృవాచక భాగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఒక్క గతకాలపు కార్యంగా పరిమితం చేయదు.
- source_word: ἄνθρωπος
  choice: మనిషి
  rationale: గ్రీకులోని ఏకవచన మానవ సూచనను నిలుపుతూ, సందర్భంలో ఏ వ్యక్తికైనా వర్తించే ప్రతినిధి భావాన్ని కలిగి ఉంటుంది.
- source_word: ζήσεται
  choice: జీవిస్తాడు
  rationale: భవిష్యత్ భావాన్ని నేరుగా అందిస్తూ లేవీయకాండము 18:5 ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: ἐν αὐτῇ
  choice: దాని ద్వారా
  rationale: గ్రీకులోని స్త్రీలింగ ఏకవచన సర్వనామాన్ని గౌరవిస్తూ, ఆచరించడం ద్వారా జీవించడం అనే సాధనార్థక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు చేసే వ్యత్యాసంలో δικαιοσύνη అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఇక్కడ ధర్మశాస్త్రం నుండి కలిగే నీతిని విశ్వాసం నుండి కలిగే నీతితో పోలుస్తున్నందున, ‘నీతి’ చుట్టుపక్కల theological సంబంధాన్ని స్పష్టంగా కాపాడుతుంది; ‘న్యాయం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- issue: ἄνθρωπος యొక్క ప్రతినిధి ప్రయోగం
  choice: మనిషి
  alternative: వ్యక్తి
  rationale: మూలంలోని ఏకవచన మానవ సూచనను నిలుపుతుంది; ఇది పురుషులకు మాత్రమే పరిమితం కాదని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: ἐν αὐτῇ యొక్క ఏకవచన రూపం మరియు లేవీయకాండము ప్రతిధ్వని
  choice: దాని ద్వారా
  alternative: దానిలో
  rationale: పౌలు వాక్యంలో సర్వనామం ఏకవచనంగా ఉంది; అందువల్ల ‘వాటివల్ల’ అని బహువచనం చేయకుండా మూలరూపాన్ని కాపాడాం. అదే సమయంలో లేవీయకాండము 18:5లోని ఆచరణ ద్వారా జీవించడం అనే భావాన్ని తెలుగులో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ధర్మశాస్త్రం’ను మోషే ధర్మశాస్త్రానికి స్థిరమైన పదంగా, ‘నీతి’ను పౌలు వాదనలోని కీలక పదంగా వాడాం. మూలంలోని ἐν αὐτῇ ఏకవచనాన్ని ప్రధాన పాఠ్యంలో కాపాడాం.
