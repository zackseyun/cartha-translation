id: ROM.10.14
reference: Romans 10:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: te
  text: అయితే, తాము నమ్మని ఆయనకు ఎలా మొరపెట్టుకుంటారు? ఆయన గురించి వినని వారు ఆయనను ఎలా నమ్ముతారు?[a] ప్రకటించేవారు లేకుండా వారు ఎలా వింటారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు వినని ఆయనను ఎలా నమ్ముతారు?”
    reason: οὗ అనే గ్రీకు షష్ఠీ సంబంధ సర్వనామం అక్షరార్థంగా ‘ఎవరి గురించి/ఎవరి నుండి విన్నారో’ అనే విస్తృత భావాన్ని కలిగి ఉంది. ప్రధాన పాఠ్యం సందర్భానుసారమైన ‘ఆయన గురించి వినని’ అనే అర్థాన్ని ఇస్తుంది; ఈ ప్రత్యామ్నాయం వ్యక్తి-కేంద్రిత, మరింత అక్షరానువాద రూపాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: Πῶς οὖν
  choice: అయితే, ... ఎలా
  rationale: οὖν యొక్క నిర్ధారణాత్మక భావాన్ని, పౌలు వాడిన అలంకారిక ప్రశ్నల వరుసను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐπικαλέσωνται
  choice: మొరపెడతారు
  rationale: ప్రభువును పిలిచి సహాయం కోరడం లేదా ఆయనను ఆశ్రయించడం అనే సందర్భార్థాన్ని తెలియజేస్తుంది; ముందున్న వచనంలోని ‘ప్రభువు నామానికి మొరపెట్టుకోవడం’తో సంబంధాన్ని నిలుపుతుంది.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: తాము నమ్మని ఆయనకు
  rationale: εἰς ὃν అనే సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, మొరపెట్టే వ్యక్తి మరియు నమ్మే వ్యక్తి ఒకరేనని స్పష్టం చేస్తుంది.
- source_word: πιστεύσωσιν
  choice: నమ్ముతారు
  rationale: πιστεύωకు సాధారణమైన, సహజమైన తెలుగు సమానార్థకం; ఈ వాక్యంలోని నమ్మకం–వినడం అనే తార్కిక క్రమాన్ని నిలుపుతుంది.
- source_word: οὗ οὐκ ἤκουσαν
  choice: తాము వినని ఆయనను
  rationale: గ్రీకు సంబంధ సర్వనామంలోని వ్యక్తి-కేంద్రిత నిర్మాణాన్ని ప్రధాన పాఠ్యంలో సాధ్యమైనంత దగ్గరగా ఉంచుతుంది; ‘ఆయన గురించి వినడం’ అనే భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: χωρὶς κηρύσσοντος
  choice: ప్రకటించేవారు లేకుండా
  rationale: κηρύσσοντοςను ఒక పదవి పేరుగా కాక, ప్రకటించే కార్యం చేసే వ్యక్తిగా చూపుతుంది; తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: πιστεύω అనే విశ్వాస సంబంధ భాష
  choice: నమ్ము
  alternative: విశ్వాసముంచు / నమ్మకముంచు
  rationale: ‘నమ్ము’ సాధారణ పాఠకులకు సహజంగా ఉండి, గ్రీకు క్రియ యొక్క మౌలిక భావాన్ని అనవసరమైన సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- issue: οὗ οὐκ ἤκουσανలో వినబడిన దాని/వ్యక్తి గుర్తింపు
  choice: తాము వినని ఆయనను
  alternative: ఆయన గురించి వినకపోతే
  rationale: గ్రీకు షష్ఠీ సంబంధ సర్వనామం ‘ఆయనను వినడం’ లేదా ‘ఆయన గురించి వినడం’గా అర్థమయ్యే అవకాశముంది. ప్రధాన పాఠ్యం వ్యక్తి-కేంద్రిత నిర్మాణాన్ని నిలుపగా, సందేశాన్ని ఆయన గురించి వినడం అనే భావాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూడు అలంకారిక ప్రశ్నల తార్కిక క్రమం మరియు ‘నమ్మడం—వినడం—ప్రకటించడం’ అనే పదబంధ సంబంధం నిలుపబడ్డాయి.
