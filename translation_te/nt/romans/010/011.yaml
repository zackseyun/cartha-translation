    text: లేదా, “ఆయనపై విశ్వాసం ఉంచేవారు ఎవరైనా సిగ్గుపడరు.”
    reason: καταισχυνθήσεται అనే పదాన్ని అంతర్గత సిగ్గు భావంతోనూ అనువదించవచ్చు; అలాగే Πᾶς ὁ πιστεύων కు ‘ఎవరైనా’ అనే సహజ ప్రత్యామ్నాయం ఉంది.
  revision_rationale: The revision changes only the Telugu expression for faith in a person, clarifying the reliance/trust sense conveyed by πιστεύω with ἐπί. The pronoun, universal scope, citation form, and future passive sense are retained. The footnote is adjusted correspondingly so that its alternative uses the same directed-faith expression.
