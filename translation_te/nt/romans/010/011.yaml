revisions:
- from: 'ఎందుకంటే లేఖనం ఇలా చెబుతోంది: “ఆయనను నమ్మే ప్రతి ఒక్కరూ అవమానానికి గురికారు.”[a]'
  to: 'ఎందుకంటే లేఖనం ఇలా చెబుతోంది: “ఆయనపై విశ్వాసం ఉంచే ప్రతి ఒక్కరూ అవమానానికి గురికారు.”[a]'
  rationale: The revision changes only the Telugu expression for faith in a person, clarifying the reliance/trust sense conveyed by πιστεύω with ἐπί. The pronoun, universal scope, citation form, and future passive sense are retained. The footnote is adjusted correspondingly so that its alternative uses the same directed-faith expression.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:09:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the citation formula, the universal scope of Πᾶς ὁ πιστεύων, the future negated passive force of οὐ καταισχυνθήσεται, and retains the pronoun without importing an explicit title. However, ‘ఆయనను నమ్మే’ can mean simply believing what he says and does not as clearly convey πιστεύω ἐπί, trust/reliance placed in a person.
  naturalness: ‘లేఖనం ఇలా చెబుతోంది’ and ‘అవమానానికి గురికారు’ are natural, modern-standard Telugu in this register. ‘ఆయనపై విశ్వాసం ఉంచే’ is more idiomatic and semantically precise for faith directed toward/reliance upon a person than ‘ఆయనను నమ్మే.’
  terminology: ‘లేఖనం’ appropriately denotes Scripture in a biblical citation, and ‘విశ్వాసం ఉంచే’ is suitable for πιστεύω in this context. ‘అవమానానికి గురికారు’ appropriately preserves the public-vindication/passive nuance without reducing it to an inward feeling of shame.
  issues:
  - severity: medium
    issue: The expression ‘ఆయనను నమ్మే’ is semantically broad.
    rationale: In Telugu it may refer to accepting a person's words as true. Greek πιστεύων ἐπ’ αὐτῷ expresses believing/trusting in or relying upon him. ‘ఆయనపై విశ్వాసం ఉంచే’ better preserves that directed reliance.
  revised_text: 'ఎందుకంటే లేఖనం ఇలా చెబుతోంది: “ఆయనపై విశ్వాసం ఉంచే ప్రతి ఒక్కరూ అవమానానికి గురికారు.”[a]'
  revised_footnotes:
