  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: te
  text: 'ఎందుకంటే లేఖనం ఇలా చెబుతోంది: “ఆయనపై విశ్వాసం ఉంచే ప్రతి ఒక్కరూ అవమానానికి గురికారు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనపై విశ్వాసం ఉంచేవారు ఎవరైనా సిగ్గుపడరు.”
    reason: καταισχυνθήσεται అనే పదాన్ని అంతర్గత సిగ్గు భావంతోనూ అనువదించవచ్చు; అలాగే Πᾶς ὁ πιστεύων కు ‘ఎవరైనా’ అనే సహజ ప్రత్యామ్నాయం ఉంది.
lexical_decisions:
- source_word: λέγει
  choice: చెబుతోంది
  rationale: లేఖన ఉల్లేఖన సూత్రంలో ఉన్న గ్రీకు వర్తమాన కాలాన్ని సహజమైన తెలుగు వర్తమాన కాలంతో వ్యక్తపరుస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఆధారాన్ని తెలిపే పౌలు వాదనా సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἡ γραφή
  choice: లేఖనం
  rationale: ఇక్కడ γραφή సాధారణ రచనను కాక పవిత్ర లేఖనాన్ని సూచిస్తుంది; తెలుగు బైబిలు సందర్భంలో ‘లేఖనం’ సహజమైన, గౌరవప్రదమైన పదం.
- source_word: Πᾶς ὁ πιστεύων
  choice: నమ్మే ప్రతి ఒక్కరూ
  rationale: గ్రీకు నిర్మాణంలోని సార్వత్రిక, లింగనిరపేక్ష భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πιστεύων
  choice: నమ్మే
  rationale: వ్యక్తిపై విశ్వాసం ఉంచడాన్ని సందర్భానుసారంగా నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐπ’ αὐτῷ
  choice: ఆయనను
  rationale: πιστεύωతో కూడిన ἐπί వ్యక్తిపై ఆధారపడి నమ్మడాన్ని సూచిస్తుంది; తెలుగులో ‘ఆయనను నమ్మడం’ సహజమైన ప్రయోగం, సర్వనామాన్ని విస్తరించకుండా ఉంచుతుంది.
- source_word: καταισχυνθήσεται
  choice: అవమానానికి గురికారు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని, బహిరంగ అవమానం లేదా నిరాశకు గురిచేయబడకపోవడమనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Πᾶς ὁ πιστεύων లోని వ్యాకరణపరమైన పుంలింగ ఏకవచనం
  choice: నమ్మే ప్రతి ఒక్కరూ
  alternative: నమ్మే ప్రతివాడూ
  rationale: గ్రీకు పుంలింగ రూపం ఇక్కడ పురుషులకు మాత్రమే పరిమితం కాదు; సార్వత్రిక ప్రతినిధి భావాన్ని ‘ప్రతి ఒక్కరూ’ స్పష్టంగా అందిస్తుంది.
- issue: αὐτῷ యొక్క సూచిత వ్యక్తి
  choice: ఆయనను
  alternative: క్రీస్తును / ప్రభువును
  rationale: సమీప సందర్భంలో సూచితుడు స్పష్టంగా ఉన్నప్పటికీ, మూలంలోని సర్వనామాన్ని విస్తరించకుండా ఉంచడం ఉల్లేఖన రూపాన్ని మరియు దాని సంక్షిప్తతను కాపాడుతుంది.
- issue: καταισχυνθήσεται లో అవమానం యొక్క స్వరూపం
  choice: అవమానానికి గురికారు
  alternative: సిగ్గుపడరు
  rationale: కర్మణి రూపాన్నీ, దేవుని తుదినిర్ణయంలో నిరాశపరచబడక లేదా బహిరంగంగా అవమానింపబడక ఉండడమనే యెషయా నేపథ్యాన్నీ బలవంతంగా సంకుచితం చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినప్పటికీ లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలి. ‘చెబుతోంది’ తెలుగు వ్యాకరణంలో ‘లేఖనం’కు అనుగుణమైన నపుంసక ఏకవచన రూపం; ‘ప్రతి ఒక్కరూ ... గురికారు’ గౌరవ/సార్వత్రిక బహువచన సమన్వయాన్ని అనుసరిస్తుంది.
