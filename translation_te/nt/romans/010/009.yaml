id: ROM.10.9
reference: Romans 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: te
  text: ఎందుకంటే, నీవు నీ నోటితో “యేసు ప్రభువు” అని[a] ఒప్పుకొని, దేవుడు ఆయనను మృతులలోనుండి లేపాడని నీ హృదయంలో నమ్మితే, నీవు రక్షించబడతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసును ప్రభువుగా ఒప్పుకొని.” κύριον Ἰησοῦν అనే గ్రీకు వాక్యభాగాన్ని ఒప్పుకోలు యొక్క విషయంగా (“యేసు ప్రభువు” అని) లేదా “యేసును ప్రభువుగా” అనే సంక్షిప్త నిర్మాణంగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే సందర్భానుసార భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐὰν
  choice: నమ్మితే
  rationale: గ్రీకు షరతును తెలుగులో సహజంగా చివరి క్రియకు ‘-తే’ ప్రత్యయం జోడించి వ్యక్తం చేశాం; ముందు ఉన్న ‘ఒప్పుకొని’ కూడా అదే షరతులో భాగం.
- source_word: ὁμολογήσῃς
  choice: ఒప్పుకొని
  rationale: నోటితో బహిరంగంగా అంగీకరించడం లేదా ప్రకటించడం అనే భావాన్ని ‘ఒప్పుకొను’ సహజంగా నిలుపుతుంది.
- source_word: ἐν τῷ στόματί σου
  choice: నీ నోటితో
  rationale: మాటల ద్వారా చేసే ఒప్పుకోలును సూచించే సహజమైన సాధనార్థక తెలుగు ప్రయోగం.
- source_word: κύριον Ἰησοῦν
  choice: “యేసు ప్రభువు” అని
  rationale: యేసును గురించి ఒప్పుకునే విషయాన్ని స్పష్టంగా తెలియజేస్తూ, κύριος అనే బిరుదును ‘ప్రభువు’గా నిలుపుతుంది.
- source_word: πιστεύσῃς
  choice: నమ్మితే
  rationale: తరువాత వచ్చే విషయవాక్యంతో సహజంగా సరిపోయే ప్రత్యక్ష తెలుగు అనువాదం.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: నీ హృదయంలో
  rationale: అంతరంగ నిశ్చయాన్ని సూచించే బైబిలీయ మానవశాస్త్ర భావాన్ని అతివ్యాఖ్య లేకుండా నిలుపుతుంది.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: దేవుడు ఆయనను ... లేపాడని
  rationale: గ్రీకు ఏకకాల భూతక్రియను సాధారణ భూతకాలంతో వ్యక్తం చేస్తుంది; యేసును సూచించేందుకు గౌరవప్రదమైన సర్వనామం వాడబడింది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: మరణించినవారి మధ్యనుండి పునరుత్థానం చేయబడిన భావాన్ని సంక్షిప్తంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: σωθήσῃ
  choice: నీవు రక్షించబడతావు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, ఈ పౌలు సంబంధిత రక్షణ సందర్భంలోని σῴζω భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఒప్పుకోలు సూత్రంలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ సందర్భంలో ‘ప్రభువు’ అధికారాన్ని, అలాగే పరిసర వాక్యాల్లోని లేఖన ప్రతిధ్వనిని నిలుపుతుంది; ‘యజమాని’ భావాన్ని అనవసరంగా కుదిస్తుంది.
- issue: κύριον Ἰησοῦν వాక్యభాగపు నిర్మాణం
  choice: “యేసు ప్రభువు” అని
  alternative: యేసును ప్రభువుగా
  rationale: ఒప్పుకోలు యొక్క విషయాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా చేస్తుంది; అయితే గ్రీకు సంక్షిప్త నిర్మాణానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- issue: σωθήσῃ యొక్క రక్షణశాస్త్ర భావం
  choice: నీవు రక్షించబడతావు
  alternative: నీవు విడిపించబడతావు
  rationale: సందర్భంలోని రక్షణ భావాన్ని సాధారణ విముక్తిగా పలుచన చేయకుండా నిలుపుతుంది; పాఠ్యంలో లేని అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఏకవచన సంబోధన వాడబడింది. షరతులోని రెండు క్రియలను ‘ఒప్పుకొని ... నమ్మితే’గా అనుసంధానించి, రెండూ కలసి షరతుగా ఉన్నాయని స్పష్టంగా ఉంచాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత ఒప్పుకోలు వాక్యభాగం వెంట ఉంచబడింది.
