id: HEB.2.6
reference: Hebrews 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: te
  text: 'అయితే, ఒకచోట ఎవరో ఇలా సాక్ష్యమిచ్చారు: “మనిషి ఎంతటివాడు, నీవు అతనిని జ్ఞాపకం చేసుకుంటావు? మానవ కుమారుడు ఎంతటివాడు, నీవు అతనిని శ్రద్ధగా చూసుకుంటావు[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు అతనిని సందర్శిస్తావు” లేదా “అతని ఆలనాపాలనా చూస్తావు.” గ్రీకు క్రియ శ్రద్ధతో సందర్శించడం, పట్టించుకోవడం లేదా సంరక్షించడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: సాక్ష్యమిచ్చారు
  rationale: ఈ క్రియ బలంగా సాక్ష్యమివ్వడం లేదా ధృవీకరించడం అనే భావాన్ని ఇస్తుంది. లేఖన వాక్యాన్ని సాక్ష్యంగా పరిచయం చేసే సందర్భంలో ‘సాక్ష్యమిచ్చారు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: δέ
  choice: అయితే
  rationale: మునుపటి వాక్యంతో స్వల్ప వ్యత్యాసం లేదా వాదనలో మలుపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ ఈ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πού τις
  choice: ఒకచోట ఎవరో
  rationale: గ్రీకు పదబంధంలోని అనిర్దిష్ట స్థలం, వ్యక్తి రెండింటినీ నిలుపుతుంది. ఇది రచయితకు మూలం తెలియదని సూచించకుండా, ఉదాహరణ స్థలాన్ని పేరుపెట్టని పరిచయరీతిని ప్రతిబింబిస్తుంది.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: మనిషి ఎంతటివాడు
  rationale: ప్రశ్న మనిషి స్వరూపాన్ని నిర్వచించడం కంటే దేవుని దృష్టిలో అతని అల్పతను ఆశ్చర్యంతో వ్యక్తం చేస్తుంది. ఏకవచన ప్రతినిధి రూపాన్నీ కవితా స్వరాన్నీ ఈ అనువాదం నిలుపుతుంది.
- source_word: ὅτι μιμνῄσκῃ αὐτοῦ
  choice: నీవు అతన్ని జ్ఞాపకం చేసుకోవడానికి
  rationale: μιμνῄσκομαι అంటే జ్ఞాపకం చేసుకోవడం లేదా మనస్సులో ఉంచుకోవడం. ‘జ్ఞాపకం చేసుకోవడం’ మూలానికి దగ్గరగా ఉండి సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: υἱὸς ἀνθρώπου
  choice: మానవ కుమారుడు
  rationale: కీర్తన 8లో ఇది ‘మనిషి’కి సమాంతరమైన కవితా వ్యక్తీకరణ. పదరూపాన్ని నిలుపుతూ, ఈ సందర్భంలోనే దానిని ప్రత్యేక బిరుదుగా నిర్బంధించకుండా ‘మానవ కుమారుడు’ అని అనువదించబడింది.
- source_word: ὅτι ἐπισκέπτῃ αὐτόν
  choice: నీవు అతని పట్ల శ్రద్ధ చూపడానికి
  rationale: ἐπισκέπτομαι సందర్శించడం, పట్టించుకోవడం, సంరక్షించడం వంటి శ్రద్ధగల చర్యను సూచించగలదు. ఇక్కడ ‘శ్రద్ధ చూపడం’ ఆధునిక తెలుగులో ఉద్దేశించిన దైవిక పరామర్శను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: υἱὸς ἀνθρώπου అనే పదబంధాన్ని స్పష్టమైన మెస్సీయ బిరుదుగా చూపాలా?
  choice: ప్రధాన పాఠ్యంలో ‘మానవ కుమారుడు’ అనే రూపాన్ని నిలిపి, దానిని ఇక్కడే ప్రత్యేక మెస్సీయ బిరుదుగా నిర్ధారించలేదు.
  alternative: ‘మానవుడు’ అని పూర్తిగా సాధారణీకరించడం, లేదా ‘మనుష్యకుమారుడు’ను స్పష్టమైన క్రీస్తు బిరుదుగా సూచించడం.
  rationale: కీర్తన 8 మూలసందర్భంలో ఇది మానవజాతిని సూచించే కవితా సమాంతర ప్రయోగం; హెబ్రీయులకు పత్రికలోని తరువాతి సందర్భం దీనికి యేసుతో సంబంధమైన ప్రాధాన్యాన్ని ఇస్తుంది. అందువల్ల మానవత్వం మరియు యేసులో దాని నెరవేర్పు మధ్యనున్న ఉద్దేశపూర్వక ఉద్వేగాన్ని ముందుగానే పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా ఉద్ధరణకు తగిన గౌరవప్రదమైన కవితా ధోరణితో పాటు సాధారణ పాఠకునికి అర్థమయ్యే పదజాలం వాడబడింది. ‘ఒకచోట ఎవరో’ అనే ప్రయోగం మూలంలోని అనిర్దిష్టతను నిలుపుతుంది. ప్రధాన పాఠ్యంలో ఉన్న [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
