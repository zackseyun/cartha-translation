  source_fidelity: 'The Telugu accurately preserves the purpose-continuation from the preceding verse: Christ''s freeing of those whose lifelong condition was subjection to slavery because of fear of death. “మరణభయం వల్ల,” “జీవితమంతా,” and “దాస్యానికి లోబడి ఉన్న” faithfully convey the causal/circumstantial force, duration, and actual subjection expressed by φόβῳ θανάτου, διὰ παντὸς τοῦ ζῆν, and ἔνοχοι ἦσαν δουλείας.'
