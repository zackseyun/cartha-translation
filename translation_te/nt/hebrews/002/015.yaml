id: HEB.2.15
reference: Hebrews 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: te
  text: మరణభయం వల్ల జీవితమంతా దాస్యానికి లోబడి ఉన్న వారందరినీ[a] విడుదల చేయడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాస్యంలో బంధింపబడి ఉన్న వారందరినీ” లేదా “దాస్యంలో ఉన్న వారందరినీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: విడుదల చేయడానికి
  rationale: ఈ క్రియ ఒక స్థితి లేదా బంధం నుంచి విడిపించడాన్ని సూచిస్తుంది. ‘విడుదల చేయడం’ సహజమైన ఆధునిక తెలుగు; సందర్భంలోని దాస్య భావంతోనూ సరిపోతుంది.
- source_word: τούτους, ὅσοι
  choice: వారందరినీ
  rationale: τούτους అనే సూచనార్థక సర్వనామాన్ని, ὅσοι యొక్క సమూహమంతటినీ చేర్చే భావంతో కలిపి సహజంగా వ్యక్తపరుస్తుంది.
- source_word: φόβῳ θανάτου
  choice: మరణభయం వల్ల
  rationale: దత్తివిభక్తి ఇక్కడ కారణం లేదా నియంత్రించే పరిస్థితిని సూచించగలదు. ‘వల్ల’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; కేవలం సాధనార్థానికే పరిమితం చేయదు.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: జీవితమంతా
  rationale: జీవించి ఉన్న మొత్తం కాలవ్యవధిని తెలిపే గ్రీకు నుడికారానికి ఇది సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: దాస్యానికి లోబడి ఉన్న
  rationale: ἔνοχος అనే పదంలోని ‘లోబడి/బద్ధులై ఉండడం’ అనే భావాన్ని, δουλεία యొక్క నిజమైన దాస్య స్థితిని బలహీనపరచకుండా వ్యక్తపరుస్తుంది.
- source_word: δουλείας
  choice: దాస్యం
  rationale: ఈ నామవాచకం బానిసత్వం లేదా దాస్యాన్ని సూచిస్తుంది. ‘దాస్యం’ గంభీరంగా, సహజంగా ఉండి బంధిత స్థితి బలాన్ని నిలుపుతుంది.
- source_word: καὶ
  choice: —
  rationale: ఈ భాగం ముందటి వాక్యంతో ఉద్దేశార్థకంగా కలిసివున్నందున, తెలుగులో వరుసగా వచ్చే ‘చేయడానికి’ నిర్మాణంలో అనుసంధానం సహజంగా అంతర్లీనమైంది; విడిగా ‘మరియు’ చేరిస్తే అసహజంగా ఉంటుంది.
theological_decisions:
- issue: δουλείας సూచించే దాస్య స్వరూపం
  choice: మరణభయం వల్ల కలిగిన నిజమైన దాస్య స్థితిని మాత్రమే పేర్కొనడం
  alternative: దయ్యానికి దాస్యం; పాపానికి దాస్యం; మరణశీలత కింద ఉనికిసంబంధ భయం
  rationale: ముందటి వచనంలో అపవాది మరియు మరణాధికారం ప్రస్తావించబడినా, ఈ ఉపవాక్యం దాస్యాన్ని మరింత సంకుచితమైన సిద్ధాంతపరమైన రీతిలో నిర్వచించదు. అందువల్ల మూలంలోని ఉద్రిక్తతను అలాగే ఉంచి అదనపు వివరణను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ఇది హెబ్రీయులు 2:14లో మొదలైన వాక్యానికి కొనసాగింపు కావడంతో తెలుగులోనూ ఉద్దేశార్థక ఉపవాక్యంగా అనువదించబడింది. [a] గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
