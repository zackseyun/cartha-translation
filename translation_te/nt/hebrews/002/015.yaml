  terminology: “దాస్యం” and “దాస్యానికి లోబడి ఉన్న” retain the force of δουλεία and ἔνοχος without importing a specific doctrinal explanation. “విడుదల చేయడానికి” is an apt rendering of ἀπαλλάξῃ.
