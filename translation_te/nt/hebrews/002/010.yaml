id: HEB.2.10
reference: Hebrews 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: te
  text: ఎందుకంటే, సమస్తమూ ఎవరి కోసమో, ఎవరి ద్వారానో ఉనికిలో ఉందో ఆయనకు, అనేకమంది కుమారులను[a] మహిమలోకి నడిపిస్తూ, వారి రక్షణకు మార్గదర్శకుణ్ణి[b] బాధల ద్వారా పరిపూర్ణునిగా చేయడం[c] సముచితమైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అనేకమంది కుమారులు” అనే మాట మూలంలోని కుమారత్వం, వారసత్వం భావాలను నిలుపుతుంది; ఇక్కడ దేవుని పిల్లలందరూ ఉద్దేశించబడ్డారు, పురుషులు మాత్రమే కాదు.
    reason: lexical_alternative
  - marker: b
    text: “మార్గదర్శకుడు” అనే పదాన్ని “మూలకర్త,” “నాయకుడు,” లేదా “మార్గం తెరిచినవాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ “పరిపూర్ణునిగా చేయడం” అంటే నైతిక లోపాన్ని సరిచేయడం కాదు; బాధల ద్వారా నియోజిత లక్ష్యానికి లేదా సంపూర్ణతకు చేర్చడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπρεπεν
  choice: సముచితమైంది
  rationale: దేవుని ఉద్దేశంలో తగినదిగా, యుక్తమైనదిగా ఉన్నదనే భావాన్ని సహజమైన గౌరవప్రద తెలుగు పదంతో తెలియజేస్తుంది.
- source_word: αὐτῷ
  choice: ఆయన
  rationale: సందర్భంలో ఇది దేవుణ్ణి సూచిస్తుంది; గ్రీకులోని సర్వనామ రూపాన్ని నిలుపుతూ సంబంధ వాక్యాలు ఆ సూచనను స్పష్టం చేస్తాయి.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: సమస్తం ఎవరి కోసమో, ఎవరి ద్వారానో ఉనికిలో ఉందో
  rationale: మొదటి διά అంతిమ లక్ష్యాన్ని, రెండవ διά సాధనకర్తృత్వాన్ని సూచించే వ్యత్యాసాన్ని కాపాడుతుంది; 'ఉనికిలో ఉంది' తెలుగులో అర్థాన్ని సహజంగా పూర్తిచేస్తుంది.
- source_word: πολλοὺς υἱοὺς
  choice: అనేకమంది కుమారులను
  rationale: υἱούς లోని కుమారత్వం, వారసత్వం అనే ప్రతిధ్వనిని నిలుపుతుంది; పరిధి పురుషులకు మాత్రమే పరిమితం కాదని పాదసూచిక వివరిస్తుంది.
- source_word: εἰς δόξαν
  choice: మహిమలోకి
  rationale: εἰς సూచించే గమనం మరియు లక్ష్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀγαγόντα
  choice: నడిపిస్తూ
  rationale: ఆయనే అనేకమంది కుమారులను మహిమలోకి తీసుకువెళ్తున్నాడనే కర్తృత్వాన్ని, ప్రధాన క్రియతో participial సంబంధాన్ని కాపాడుతుంది; దానిని ఉద్దేశార్థక వాక్యంగా మార్చదు.
- source_word: ἀρχηγὸν
  choice: మార్గదర్శకుడు
  rationale: ముందుగా మార్గం తెరిచి ఇతరులను నడిపించే వ్యక్తి అనే ἀρχηγός భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది; 'మూలకర్త', 'నాయకుడు' అనే భావసాధ్యతలను పాదసూచికలో ఉంచుతుంది.
- source_word: τῆς σωτηρίας αὐτῶν
  choice: వారి రక్షణకు
  rationale: తెలుగులో సహజమైన సంబంధ నిర్మాణంతో వారి రక్షణకు సంబంధించిన ἀρχηγός అనే భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: διὰ παθημάτων
  choice: బాధల ద్వారా
  rationale: παθημάτων బహువచనాన్ని నిలుపుతూ, నిర్దిష్టమైన బాధానుభవాల ద్వారా అనే భావాన్ని ఇస్తుంది.
- source_word: τελειῶσαι
  choice: పరిపూర్ణుణ్ణి చేయడం
  rationale: హెబ్రీయులకు పత్రికలోని τελειόω పదసంబంధాన్ని నిలుపుతుంది; ఇది నైతిక లోపాన్ని సరిచేయడం కాదని, నియోజిత లక్ష్యానికి లేదా సంపూర్ణతకు చేర్చడం అని పాదసూచిక స్పష్టం చేస్తుంది.
theological_decisions:
- issue: కుమారుని గురించి τελειῶσαι యొక్క అర్థం
  choice: పరిపూర్ణుణ్ణి చేయడం
  alternative: నియోజిత లక్ష్యానికి చేర్చడం / సంపూర్ణం చేయడం
  rationale: మూలంలోని బలమైన పదబంధాన్ని నిలుపుతూ, నైతిక లోపం తొలగించబడిందనే అర్థాన్ని రుద్దకుండా, బాధల ద్వారా తన రక్షణకార్య లక్ష్యాన్ని పూర్తిగా నెరవేర్చే స్థితికి చేర్చడాన్ని సూచిస్తుంది.
- issue: πολλοὺς υἱοὺς యొక్క పరిధి
  choice: అనేకమంది కుమారులు
  alternative: అనేకమంది పిల్లలు
  rationale: మూలంలోని కుమారత్వం మరియు వారసత్వ ప్రతిధ్వనిని నిలుపుతుంది; ఈ సమూహం పురుషులకు మాత్రమే పరిమితం కాదనే సమగ్ర పరిధిని పాదసూచికలో తెలుపుతుంది.
- issue: ἀγαγόντα మరియు τελειῶσαι మధ్య సంబంధం
  choice: మహిమలోకి నడిపిస్తూ ... పరిపూర్ణుణ్ణి చేయడం
  alternative: మహిమలోకి నడిపించడానికి ... పరిపూర్ణుణ్ణి చేయడం
  rationale: అనిశ్చితిని ఉద్దేశార్థంగా పరిష్కరించకుండా, గ్రీకు participle ప్రధాన infinitive తో కలిగిన సందర్భ/సహచర్య సంబంధాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. గ్రీకు వాక్యంలోని కర్త, సంబంధ వాక్యాలు, participial సంబంధం స్పష్టంగా ఉండేలా స్వల్ప పునర్వ్యవస్థీకరణ చేయబడింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
