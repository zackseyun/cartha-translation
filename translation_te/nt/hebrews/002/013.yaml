id: HEB.2.13
reference: Hebrews 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: te
  text: మరలా, “నేను ఆయనపై నమ్మకం ఉంచుతాను”[a] అని ఉంది. మరలా, “ఇదిగో, నేనూ దేవుడు నాకు ఇచ్చిన పిల్లలూ ఉన్నాం”[b] అని ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నేను ఆయనపై నమ్మకంతో ఉంటాను” లేదా “ఆయనపై ధైర్యంగా ఆధారపడతాను.”
    reason: lexical_alternative
  - marker: b
    text: ఈ వచనంలోని గ్రీకు మాట్లాడుతున్న వ్యక్తిని పేరుతో పేర్కొనదు; సందర్భంలో హెబ్రీయులకు పత్రిక ఈ ఉల్లేఖనాలను కుమారునికి అన్వయిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: మరలా
  rationale: మాట్లాడటాన్ని సూచించే క్రియ గ్రీకులో లేదు; అందువల్ల ఉల్లేఖనాన్ని పరిచయం చేసే సంక్షిప్త సూత్రాన్ని నిలిపి, సహజమైన తెలుగు వాక్య నిర్మాణం కోసం ఉల్లేఖనం తర్వాత ‘అని ఉంది’ చేర్చబడింది.
- source_word: Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ
  choice: నేను ఆయనపై నమ్మకం ఉంచుతాను
  rationale: భవిష్యత్ εἰμίతో కూడిన perfect participle స్థిరమైన నమ్మక వైఖరిని సూచిస్తుంది. ‘ఆయనపై నమ్మకం ఉంచుతాను’ మూలంలోని భవిష్యత్ భావాన్నీ ἐπί సంబంధాన్నీ సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే ఉల్లేఖన శైలినీ గంభీరతనూ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: τὰ παιδία
  choice: పిల్లలు
  rationale: ఇక్కడ సంబంధపరంగా చెప్పబడిన పిల్లలను సూచిస్తుంది; చిన్న వయస్సును అనవసరంగా నొక్కిచెప్పకుండా విస్తృతమైన సాధారణ పదం వాడబడింది.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: దేవుడు నాకు ఇచ్చిన
  rationale: గ్రీకు aoristను సాధారణ భూతకాల సంబంధ వాక్యంగా అనువదించాం. తెలుగు క్రియావిశేషణ నిర్మాణం వ్యక్తులను సూచించడంలో సహజంగా ఉండి, గ్రీకు నపుంసకలింగ సర్వనామానికి ప్రత్యేక రూపభేదం అవసరం లేదు.
theological_decisions:
- issue: ఉల్లేఖనాల్లో మాట్లాడుతున్న వ్యక్తి మరియు క్రీస్తుసంబంధ అన్వయం
  choice: మొదటి పురుష ఉల్లేఖనాలను యథాతథంగా ఉంచి, ప్రధాన పాఠ్యంలో మాట్లాడుతున్న వ్యక్తిని పేరుతో గుర్తించలేదు.
  alternative: ‘ఆయన అంటున్నాడు’ లేదా ‘కుమారుడు అంటున్నాడు’ అని స్పష్టీకరించడం.
  rationale: ఈ వచనంలోని గ్రీకు మాట్లాడుతున్న వ్యక్తిని పేరుతో పేర్కొనదు; సందర్భంలో హెబ్రీయులకు పత్రిక ఈ మాటలను కుమారునికి అన్వయిస్తుంది. అనువాదంలో ఆ సందర్భాన్వయాన్ని ముందుగానే వ్యాఖ్యానంగా చేర్చకుండా మూలంలోని ఉద్వేగాన్ని నిలిపాం.
- issue: ἔδωκεν యొక్క కాలభావం
  choice: ‘ఇచ్చిన’
  alternative: ‘ఇచ్చియున్న’ లేదా ‘నాకు ఇచ్చాడు’
  rationale: గ్రీకులో aorist ఉంది; కాబట్టి ఆంగ్ల consultation layerలోని present relevanceను తప్పనిసరిగా దిగుమతి చేయకుండా, సహజమైన తెలుగు భూతకాల సంబంధ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఉల్లేఖనాలకు తగిన గంభీరతతో పాటు సాధారణ పాఠకునికి స్పష్టంగా ఉండే నిర్మాణం. ‘అని ఉంది’ అనేది గ్రీకులో లేని ప్రత్యేక వక్తను చేర్చకుండా తెలుగులో ఉల్లేఖనాలను సహజంగా అనుసంధానిస్తుంది. రెండో ఉల్లేఖనంలో ‘నేనూ ... పిల్లలూ ఉన్నాం’ అని ఇవ్వడం ద్వారా Ἰδοὺ ἐγὼ καὶ τὰ παιδία అనే క్రియారహిత గ్రీకు నిర్మాణాన్ని సహజ తెలుగులో పూర్తి చేసింది.
