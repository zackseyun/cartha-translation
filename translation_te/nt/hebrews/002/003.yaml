id: HEB.2.3
reference: Hebrews 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: te
  text: ఇంత గొప్ప రక్షణను మనం నిర్లక్ష్యం చేస్తే, ఎలా తప్పించుకుంటాం? ఈ రక్షణ[a] మొదట ప్రభువు ద్వారా పలకబడడం ప్రారంభమై, ఆయనను విన్నవారిచేత మనకు ధృవపరచబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మొదట ప్రభువు ద్వారా పలకబడడం ప్రారంభమైన ఈ రక్షణను, ఆయనను విన్నవారు మనకు ధృవపరిచారు.”'
    reason: గ్రీకులోని సంబంధ వాక్యాన్ని ఒకే వాక్యంగా అనుసంధానించి, కర్మణి నిర్మాణాన్ని తెలుగులో కర్తరి నిర్మాణంగా అనువదించగల ప్రత్యామ్నాయ రూపం.
lexical_decisions:
- source_word: πῶς ἡμεῖς ἐκφευξόμεθα
  choice: మనం ఎలా తప్పించుకుంటాం?
  rationale: భవిష్యదర్థక అలంకారప్రశ్నను ప్రకటనగా మార్చకుండా ఉంచుతుంది; తప్పించుకోవడం అసాధ్యమనే తీవ్రమైన హెచ్చరికను సూచిస్తుంది.
- source_word: τηλικαύτης ... σωτηρίας
  choice: ఇంత గొప్ప రక్షణను
  rationale: τηλικαύτης యొక్క పరిమాణాత్మక ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; σωτηρία యొక్క విమోచనాత్మక, అంత్యకాల సంబంధమైన భావాన్ని ‘రక్షణ’ నిలుపుతుంది.
- source_word: ἀμελήσαντες
  choice: నిర్లక్ష్యం చేస్తే
  rationale: అనిశ్చిత భూతకృదంతానికి ఈ హెచ్చరిక సందర్భంలో సహజంగా ఉన్న షరతు భావాన్ని తెలియజేస్తుంది.
- source_word: ἥτις
  choice: ఈ రక్షణ
  rationale: సంబంధ సర్వనామం తిరిగి ‘రక్షణ’నే సూచిస్తుందని స్పష్టం చేస్తూ, దాని వివరణాత్మక భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: మొదట ... ప్రకటించబడింది
  rationale: ‘మాట్లాడబడటం ఆరంభం పొందింది’ అనే గ్రీకు పదబంధంలోని ఆరంభకాల భావాన్ని సహజంగా అందిస్తుంది; సందేశ సందర్భంలో ‘ప్రకటించబడింది’ స్పష్టంగా ఉంటుంది.
- source_word: διὰ τοῦ κυρίου
  choice: ప్రభువు ద్వారా
  rationale: διά + షష్ఠీ విభక్తిలోని మాధ్యమం లేదా కర్తృత్వ భావాన్ని నిలుపుతుంది; κύριοςకు స్థిరమైన క్రైస్తవ బిరుదైన ‘ప్రభువు’ వాడబడింది.
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: ఆయన మాట విన్నవారు
  rationale: విన్నవారి సూచిత కర్మ ప్రభువేనని సందర్భానుసారంగా స్పష్టం చేస్తుంది; ‘మాట’ను చేర్చడం తెలుగులో సహజంగా ఉండి, వారు ఆయన బోధను విన్నారనే భావాన్ని ఇస్తుంది.
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: దానిని మనకు ధృవపరిచారు
  rationale: గ్రీకులోని కర్మణి నిర్మాణాన్ని తెలుగులో సహజమైన కర్తరి వాక్యంగా మార్చినా, సందేశం మనకు విశ్వసనీయంగా స్థిరపరచబడిందనే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: τοῦ κυρίου అనే పదబంధంలో ‘ప్రభువు’ ఎవరిని సూచిస్తుంది?
  choice: యేసును సూచించే ‘ప్రభువు’
  alternative: సాధారణంగా దేవుణ్ణి సూచించే బిరుదు
  rationale: రక్షణ మొదట ప్రభువు ద్వారా పలకబడిందనీ, ఆయనను విన్నవారు దాన్ని తరువాత ధృవపరిచారనీ చెప్పే క్రమం యేసు భూలోక పరిచర్యను, ప్రత్యక్ష శ్రోతలను బలంగా సూచిస్తుంది; అనువాదం మాత్రం వివరణను మూలపాఠ్యంలో చేర్చదు.
- issue: హెచ్చరిక ప్రశ్న యొక్క బలం
  choice: ‘ఎలా తప్పించుకుంటాం?’ అనే అలంకారప్రశ్నను అలాగే ఉంచడం
  alternative: ‘మనం తప్పించుకోలేం’ అని స్పష్ట ప్రకటనగా మార్చడం
  rationale: గ్రీకు మూలంలోని ప్రశ్నారూపం హెచ్చరిక యొక్క ఉద్వేగాన్ని, దైవశాస్త్ర సంబంధమైన ఉద్రిక్తతను నిలుపుతుంది.
- issue: ἥτις సంబంధ వాక్య నిర్మాణం
  choice: ‘ఈ రక్షణ’ అని కొత్త వాక్యంలో స్పష్టీకరించడం
  alternative: ‘అది మొదట...’ లేదా ఒకే దీర్ఘ సంబంధ వాక్యంగా అనువదించడం
  rationale: సంబంధ సర్వనామం యొక్క పూర్వపదాన్ని స్పష్టం చేస్తూ ఆధునిక తెలుగులో పఠనసౌలభ్యాన్ని ఇస్తుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటిప్పణిలో నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. అలంకారప్రశ్నను నిలిపి, పొడవైన గ్రీకు సంబంధ వాక్యాన్ని పఠనసౌలభ్యం కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం. ప్రధాన పాఠ్యంలో [a] గుర్తు ఉంది.
