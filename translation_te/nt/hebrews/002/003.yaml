revisions:
- from: ఇంత గొప్ప రక్షణను మనం నిర్లక్ష్యం చేస్తే, ఎలా తప్పించుకుంటాం? ఈ రక్షణ[a] మొదట ప్రభువు ద్వారా ప్రకటించబడింది; ఆయన మాట విన్నవారు దానిని మనకు ధృవపరిచారు.
  to: ఇంత గొప్ప రక్షణను మనం నిర్లక్ష్యం చేస్తే, ఎలా తప్పించుకుంటాం? ఈ రక్షణ[a] మొదట ప్రభువు ద్వారా పలకబడడం ప్రారంభమై, ఆయనను విన్నవారిచేత మనకు ధృవపరచబడింది.
  rationale: 'సవరణలు అర్థాన్ని మార్చకుండా రెండు సూక్ష్మ మూలభాషా అంశాలను స్పష్టపరుస్తాయి: రక్షణ సందేశం ప్రభువు ద్వారా పలకబడడం ప్రారంభమైందనే inceptive భావం, అలాగే ప్రభువును ప్రత్యక్షంగా విన్నవారే దానిని మనకు ధృవపరచారనే సందర్భసూచన. అలంకారప్రశ్న, ‘రక్షణ,’ ‘ప్రభువు,’ మరియు మూలంలోని ఉద్వేగం యథాతథంగా ఉంచబడ్డాయి.'
