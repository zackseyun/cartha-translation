source:
  edition: SBLGNT
  text: συνεπιμαρτυροῦντος τοῦ θεοῦ σημείοις τε καὶ τέρασιν καὶ ποικίλαις δυνάμεσιν καὶ πνεύματος ἁγίου μερισμοῖς κατὰ τὴν αὐτοῦ θέλησιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/004.yaml
  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: te
  text: దేవుడు కూడా సూచకకార్యాలతో, అద్భుతాలతో, వివిధ శక్తికార్యాలతో[a], తన చిత్తానుసారంగా పరిశుద్ధాత్మ పంచింపులతో[b] దానికి సాక్ష్యమిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వివిధ శక్తులు” లేదా “వివిధ మహత్కార్యాలు.” గ్రీకు పదం శక్తి వ్యక్తమయ్యే రూపాలను సూచించగలదు; ఈ సందర్భంలో అది అద్భుత కార్యాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “పరిశుద్ధాత్మ యొక్క పంచింపులు” లేదా “పరిశుద్ధాత్మ భాగాలు.” మూలపాఠంలో “వరాలు” అనే పదం స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος τοῦ θεοῦ
  choice: దేవుడు కూడా ... దానికి సాక్ష్యమిచ్చాడు
  rationale: సందర్భంలోని మునుపటి వాక్యానికి అనుసంధానమైన జనిటివ్ పార్టిసిపిల్‌ను సహజమైన తెలుగు వాక్యంగా మార్చాం. συν-లోని అదనపు భావాన్ని ‘కూడా’ నిలుపుతుంది; ‘దానికి’ అనేది ముందటి వచనంలో ప్రభువు ద్వారా ప్రకటించి వినినవారు ధృవీకరించిన రక్షణను సూచిస్తుంది.
- source_word: σημείοις
  choice: సూచకక్రియలతో
  rationale: దేవుని సాక్ష్యానికి సాధనాలుగా పనిచేసే, అర్థసూచకమైన కార్యాలు అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τέρασιν
  choice: అద్భుతాలతో
  rationale: చూసేవారిలో విస్మయం కలిగించే అసాధారణ కార్యాలు అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ποικίλαις δυνάμεσιν
  choice: వివిధ శక్తికార్యాలతో
  rationale: δύναμις పదంలోని ‘శక్తి’ భావాన్నీ, ఈ సందర్భంలో అది సూచించే శక్తివంతమైన కార్యాల భావాన్నీ కాపాడుతుంది; ‘వివిధ’ ποικίλαις‌ను అనువదిస్తుంది.
- source_word: πνεύματος ἁγίου μερισμοῖς
  choice: పరిశుద్ధాత్మను పంచడం ద్వారా
  rationale: μερισμοί యొక్క పంచడం/విభజించడం అనే భావాన్ని తెలియజేస్తూ, మూలపాఠంలో లేని ‘వరాలు’ అనే పదాన్ని చేర్చలేదు. తెలుగు వాక్యనిర్మాణంలో సాధనార్థక సంబంధాన్ని స్పష్టంగా చేస్తుంది.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: తన చిత్తానుసారంగా
  rationale: κατά + accusative తెలిపే అనుగుణతను సహజంగా వ్యక్తం చేస్తుంది. ‘తన’ సందర్భంలోని కర్తయైన దేవునిని అత్యంత సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: ‘తన చిత్తానుసారంగా’లో ‘తన’ ఎవరిని సూచిస్తుంది
  choice: దేవునిని సూచించే ప్రతిబింబ సర్వనామంగా అనువదించాం.
  alternative: పరిశుద్ధాత్మను సూచిస్తుందని భావించే అవకాశం ఉన్నప్పటికీ, వాక్యనిర్మాణపరంగా అది తక్కువ సహజం.
  rationale: పార్టిసిపిల్‌కు కర్త దేవుడే; సూచకక్రియలు మొదలైన వాటి ద్వారా సాక్ష్యమిచ్చేది ఆయనే. అందువల్ల αὐτοῦ దేవునిని సూచించడం సందర్భానికి, వాక్యనిర్మాణానికి అత్యంత సహజం.
- issue: πνεύματος ἁγίου యొక్క అనువాదం
  choice: పరిశుద్ధాత్మ
  alternative: పవిత్రాత్మ
  rationale: ‘పరిశుద్ధాత్మ’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే దైవిక బిరుదు; మూలంలోని భావానికి అదనపు సిద్ధాంత వివరణను జోడించదు.
- issue: μερισμοῖςలో ‘వరాలు’ అనే భావాన్ని చేర్చాలా
  choice: ప్రధాన పాఠంలో ‘వరాలు’ చేర్చలేదు.
  alternative: ‘పరిశుద్ధాత్మ వరాల పంపిణీల ద్వారా’
  rationale: సందర్భం వరాలను సూచించవచ్చుగానీ, గ్రీకు పాఠంలో ‘వరాలు’కు సమానమైన నామవాచకం లేదు. అందువల్ల మూలంలోని విస్తృతతను, సాధ్యమైన అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘సూచకక్రియలు—అద్భుతాలు—శక్తికార్యాలు’ అనే మూడు వేర్వేరు గ్రీకు పదాల భేదాన్ని సాధ్యమైనంతవరకు నిలిపాం. వచనం 3వ వచనానికి వ్యాకరణపరంగా అనుసంధానమైనప్పటికీ, ఇచ్చిన ఏకవచన యూనిట్‌లో సహజంగా చదవడానికి పూర్తి వాక్యంగా సమర్పించాం.
