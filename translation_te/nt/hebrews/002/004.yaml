- from: దేవుడు కూడా సూచకక్రియలతో, అద్భుతాలతో, వివిధ శక్తికార్యాలతో[a], తన చిత్తానుసారంగా పరిశుద్ధాత్మను పంచడం ద్వారా[b] దానికి సాక్ష్యమిచ్చాడు.
