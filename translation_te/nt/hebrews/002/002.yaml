id: HEB.2.2
reference: Hebrews 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: te
  text: ఎందుకంటే, దేవదూతల ద్వారా పలికిన సందేశం స్థిరమైనదిగా నిలిచింది[a]; ప్రతి అతిక్రమమూ, ప్రతి అవిధేయతయూ న్యాయమైన శిక్షను పొందింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది దేవదూతల మధ్యవర్తిత్వం ద్వారా ఇవ్వబడిందని యూద సంప్రదాయం అర్థం చేసుకున్న ధర్మశాస్త్రాన్ని సూచిస్తుండవచ్చు; అపొస్తలుల కార్యాలు 7:53; గలతీయులు 3:19 చూడండి.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘న్యాయమైన ప్రతిచెల్లింపును’ లేదా ‘తగిన ప్రతిఫలాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: దేవదూతల ద్వారా పలికిన సందేశం
  rationale: λόγοςను సందర్భానుసారంగా ‘సందేశం’ అని అనువదించడం దైవిక సమాచారాన్ని సహజంగా తెలియజేస్తుంది. διά + genitiveలోని మధ్యవర్తిత్వ భావాన్ని ‘ద్వారా’ నిలుపుతుంది; λαληθείςను ‘పలికిన’గా అందిస్తుంది.
- source_word: ἀγγέλων
  choice: దేవదూతలు
  rationale: హెబ్రీయులు 2 అధ్యాయ సందర్భంలో మానవ దూతలకన్నా పరలోక దేవదూతలే ఉద్దేశించబడ్డారని స్పష్టంగా ఉంది.
- source_word: ἐγένετο βέβαιος
  choice: స్థిరమైనదిగా నిలిచింది
  rationale: సందేశం చెల్లుబాటు గలదిగా, అమలులో నిలిచిందనే ఫలితార్థాన్ని ఇది సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కేవలం నిజమని నిరూపించబడిందనే భావానికి పరిమితం చేయదు.
- source_word: πᾶσα παράβασις
  choice: ప్రతి అతిక్రమం
  rationale: నిర్దేశించిన హద్దును లేదా ఆజ్ఞను దాటడమనే παράβασις భావాన్ని ‘అతిక్రమం’ సరిగ్గా, గంభీరంగా తెలియజేస్తుంది.
- source_word: παρακοὴ
  choice: అవిధేయత
  rationale: వినకపోవడం నుంచి కలిగే లోబడకపోవడమనే నైతిక-న్యాయ భావాన్ని ‘అవిధేయత’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔλαβεν
  choice: పొందాయి
  rationale: గ్రీకు వాక్యంలో ప్రతి అతిక్రమం, అవిధేయత విషయాలుగా ఉండి తగిన ప్రతిఫలాన్ని పొందినట్లు చెప్పబడింది; తెలుగులో సంయుక్త విషయానికి అనుగుణంగా బహువచనం సహజం.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: న్యాయమైన ప్రతిఫలం
  rationale: ἔνδικοςలోని న్యాయసమ్మతతను, μισθαποδοσίαలోని తగిన తిరిగి చెల్లింపు లేదా ప్రతిఫల భావాన్ని నిలుపుతుంది. సందర్భంలో అది శిక్షాత్మకమైనదైనా, మూలపదంలోని విస్తృత ‘ప్రతిఫలం’ భావాన్ని ప్రధాన పాఠంలో కాపాడుతుంది.
theological_decisions:
- issue: ‘దేవదూతల ద్వారా పలికిన సందేశం’ స్వరూపం
  choice: దేవదూతల మధ్యవర్తిత్వంతో ఇవ్వబడిన ధర్మశాస్త్రానికి సూచనగా భావించినా, ప్రధాన పాఠంలో ‘సందేశం’ అనే మూలపదానుగుణ రూపాన్నే ఉంచడం
  alternative: ప్రధాన పాఠంలోనే ‘దేవదూతల ద్వారా ఇవ్వబడిన ధర్మశాస్త్రం’ అని స్పష్టీకరించడం; లేదా సాధారణంగా దేవదూతలు అందించిన ఏదో దైవిక సందేశంగా తీసుకోవడం
  rationale: సందర్భం మరియు యూద సంప్రదాయం సీనాయి ధర్మశాస్త్రాన్ని బలంగా సూచిస్తాయి; అయితే గ్రీకు పాఠం νόμος కాక λόγος అని మాత్రమే చెబుతుంది. కాబట్టి గుర్తింపును పాఠంలో చేర్చకుండా పాదసూచికలో వివరించడం అసలులోని సూచనాత్మకతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘సందేశం’ మూలంలోని λόγος భావాన్ని సందర్భోచితంగా అందిస్తుంది; ‘స్థిరమైనదిగా నిలిచింది’ చెల్లుబాటు మరియు అమలుశక్తిని సూచిస్తుంది. ‘ప్రతిఫలం’ మూలంలోని ప్రతిచెల్లింపు భావాన్ని నిలుపుతుండగా, శిక్షాత్మక ప్రత్యామ్నాయాన్ని పాదసూచిక వివరిస్తుంది.
