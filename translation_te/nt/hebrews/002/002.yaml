    rationale: తెలుగులో సాధ్యమే అయినప్పటికీ, ‘ప్రతి’తో వేర్వేరుగా సూచించిన రెండు అభావనామాలకు ‘ప్రతి అతిక్రమమూ, ప్రతి అవిధేయతయూ ... పొందింది’ అనే నిర్మాణం మరింత సాఫీగా ఉంది మరియు గ్రీకు ఏకవచన క్రియకు దగ్గరగా ఉంటుంది.
