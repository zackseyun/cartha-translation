- from: ఎందుకంటే, దేవదూతల ద్వారా పలికిన సందేశం స్థిరమైనదిగా నిలిచింది[a]; ప్రతి అతిక్రమమూ అవిధేయతా న్యాయమైన ప్రతిఫలాన్ని పొందాయి[b].
  to: ఎందుకంటే, దేవదూతల ద్వారా పలికిన సందేశం స్థిరమైనదిగా నిలిచింది[a]; ప్రతి అతిక్రమమూ, ప్రతి అవిధేయతయూ న్యాయమైన శిక్షను పొందింది[b].
  rationale: సందేశం యొక్క దేవదూతల-మధ్యవర్తిత్వ సూచనను, అలాగే అది ధర్మశాస్త్రమనే గుర్తింపును ప్రధాన పాఠంలో చేర్చకుండా ఉంచాం. ఉల్లంఘనలకు సంబంధించిన μισθαποδοσία యొక్క సందర్భానుగుణ శిక్షాత్మక భావం స్పష్టంగా ఉండేందుకు ‘న్యాయమైన శిక్ష’ను ప్రధాన పాఠంలో పెట్టాం; విస్తృత ప్రతిచెల్లింపు భావాన్ని పాదసూచికలో భద్రపరిచాం. వాక్యప్రవాహం కోసం ప్రతి నామానికి ‘ప్రతి’ని స్పష్టంగా జోడించి ఏకవచన క్రియను వాడాం.
