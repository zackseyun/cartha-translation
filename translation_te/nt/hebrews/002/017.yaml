id: HEB.2.17
reference: Hebrews 2:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: te
  text: అందువల్ల ఆయన అన్ని విధాలా తన సహోదరులవలె అవవలసి వచ్చింది[a]; తద్వారా ప్రజల పాపాలకు ప్రాయశ్చిత్తం చేయుటకై దేవునికి సంబంధించిన విషయాల్లో కనికరంగల, నమ్మకమైన ప్రధాన యాజకుడు కావడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సహోదర సహోదరీలవలె.” గ్రీకులో “సహోదరులు” అనే పుంలింగ బహువచన కుటుంబ పదం ఉంది; సందర్భంలో అది విశ్వాసుల విస్తృత కుటుంబాన్ని కూడా చేర్చవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: అందువల్ల
  rationale: ముందటి వాదన నుండి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὤφειλεν
  choice: కావలసి వచ్చింది
  rationale: బయటి బలవంతాన్ని అనవసరంగా సూచించకుండా, దేవుని రక్షణ ఉద్దేశం వల్ల ఏర్పడిన నిజమైన అవసరాన్ని వ్యక్తపరుస్తుంది.
- source_word: κατὰ πάντα
  choice: అన్ని విధాలా
  rationale: పోలిక యొక్క సమగ్ర పరిధిని సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς ἀδελφοῖς
  choice: తన సహోదరులు
  rationale: గ్రీకు మూలంలోని పుంలింగ బహువచన కుటుంబ పదాన్ని నిలుపుతుంది; సందర్భంలో ఉండగల విస్తృత సమ్మిళిత భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: ὁμοιωθῆναι
  choice: వలె కావడం
  rationale: మానవ కుటుంబంతో పోలికలోకి రావడాన్ని సహజంగా వ్యక్తపరుస్తుంది; క్రియను అనవసరంగా కర్మణి రూపంలో కఠినతరం చేయదు.
- source_word: ἐλεήμων
  choice: కనికరంగల
  rationale: యాజక సేవ సందర్భంలో కరుణ చూపే గుణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: πιστὸς
  choice: నమ్మకమైన
  rationale: దేవుని సమక్షంలో యాజకుని విశ్వసనీయతను, విధేయతను విస్తరించి నిర్వచించకుండా తెలియజేస్తుంది.
- source_word: ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: ఈ యాజక బిరుదుకు ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: τὰ πρὸς τὸν θεόν
  choice: దేవునికి సంబంధించిన విషయాల్లో
  rationale: దేవుని సమక్షంలో జరిగే యాజక సేవా పరిధిని మూలంలోని కొంత అధికారికమైన భావంతోనే నిలుపుతుంది.
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: ప్రాయశ్చిత్తం చేయడానికి
  rationale: పాపాలతో యాజకపరంగా వ్యవహరించే చర్యను అందుబాటులో ఉన్న బైబిలు తెలుగులో తెలియజేస్తూ, పరిహరణ–ప్రసన్నీకరణ మధ్య ఉన్న భావ ఉద్రిక్తతను పాదటిప్పణిలో నిలుపుతుంది.
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: ప్రజల పాపాలు
  rationale: ప్రాయశ్చిత్త చర్యకు గురయ్యేవి ప్రజల పాపాలేనని మూలానికి నేరుగా అనుగుణంగా తెలుపుతుంది.
theological_decisions:
- issue: ἱλάσκεσθαι అనే పదంలోని పరిహరణ–ప్రసన్నీకరణ భావ ఉద్రిక్తత
  choice: ప్రజల పాపాలకు ప్రాయశ్చిత్తం చేయడం
  alternative: ప్రాయశ్చిత్తం చేసి పాపాలను తొలగించడం; లేదా ప్రాయశ్చిత్తం చేసి దేవుని ప్రసన్నం చేయడం
  rationale: ప్రధాన పాఠంలో ఏ ఒక్క ప్రాయశ్చిత్త సిద్ధాంతానికీ భావాన్ని పరిమితం చేయకుండా యాజక సందర్భాన్ని స్పష్టంగా ఉంచుతుంది; మూలపదంలో చర్చకు లోనయ్యే రెండు భావ దిశలను పాదటిప్పణి తెలియజేస్తుంది.
- issue: ἀδελφοῖς అనే పుంలింగ కుటుంబ పదం యొక్క పరిధి
  choice: తన సహోదరులు
  alternative: తన సహోదర సహోదరీలు
  rationale: మూలంలోని వ్యాకరణ రూపాన్ని ప్రధాన పాఠంలో కాపాడుతూ, సందర్భంలో విశ్వాసుల విస్తృత కుటుంబం ఉద్దేశించబడి ఉండవచ్చనే సమ్మిళిత భావాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. “ప్రధాన యాజకుడు,” “ప్రాయశ్చిత్తం” వంటి సందర్భానికి అవసరమైన బైబిలు పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకుడు అనుసరించగలిగేలా ఉంచాం. ఉద్దేశార్థకమైన ἵνα మరియు εἰς τό నిర్మాణాలను “అలా…చేయగలిగేలా” అనే అనుసంధానంతో ప్రతిబింబించాం.
