- from: అందువల్ల ఆయన అన్ని విధాలా తన సహోదరులవలె కావలసి వచ్చింది[a]; అలా ఆయన దేవునికి సంబంధించిన విషయాల్లో కనికరంగల, నమ్మకమైన ప్రధాన యాజకుడై, ప్రజల పాపాలకు ప్రాయశ్చిత్తం చేయగలిగేలా[b].
