  terminology: ‘దేవదూతలు,’ ‘మహిమ,’ ‘ఘనత,’ మరియు ‘మరణాన్ని రుచి చూడటం’ స్థిరమైన, అర్థమయ్యే బైబిలు పదజాలాన్ని కాపాడతాయి. ‘కిరీటధారిగా చేయబడిన’ అనేది ἐστεφανωμένονలోని నిష్క్రియ కిరీట-రూపకాన్ని స్పష్టంగా ఇస్తుంది.
