review_pass:
  verdict: revise
  source_fidelity: ప్రధాన పాఠం SBLGNTలోని χωρὶς θεοῦను అనుసరిస్తుంది; ‘దేవుని నుండి వేరుగా’ అనేది దాని కఠినమైన, వివాదాస్పదమైన భావాన్ని సిద్ధాంతపరంగా వివరిస్తూ మార్చకుండా నిలుపుతుంది. ὑπὲρ παντόςను ‘ప్రతి ఒక్కరి కొరకు,’ γεύσηται θανάτουను రూపకంతో సహా ‘మరణాన్ని రుచి చూడునట్లు’గా అనువదించాం.
