    rationale: χωρὶς θεοῦలోని ‘apart from/without God’ భావాన్ని నిర్ధిష్టంగా వ్యాఖ్యానించకుండా ‘దేవుని నుండి వేరుగా’ అని చెప్పడం తెలుగులో మరింత సహజంగా ఉంటుంది.
