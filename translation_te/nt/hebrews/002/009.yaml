id: HEB.2.9
reference: Hebrews 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: te
  text: అయితే, కొంతకాలం దేవదూతలకంటే తక్కువవానిగా చేయబడిన యేసును మనం చూస్తున్నాం; మరణ వేదన కారణంగా ఆయన మహిమతోను ఘనతతోను కిరీటధారిగా చేయబడినవాడు. తద్వారా ఆయన దేవుని నుండి వేరుగా[a] ప్రతి ఒక్కరి కొరకు మరణాన్ని రుచి చూడునట్లు జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతులలో “దేవుని కృపవల్ల” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: కొంతకాలం
  rationale: కీర్తన 8 ప్రతిధ్వనించే ఈ సందర్భంలో పరిమాణం కంటే కాలవ్యవధిని సూచించడం సహజం.
- source_word: παρ’ ἀγγέλους
  choice: దేవదూతలకంటే
  rationale: ἐλαττόωతో παρά + ద్వితీయావిభక్తి పోలికను, అంటే ‘కంటే’, సూచిస్తుంది.
- source_word: ἠλαττωμένον
  choice: తక్కువవానిగా చేయబడిన
  rationale: కర్త చేసిన చర్యను సూచించే పరోక్ష రూపాన్నీ, దేవదూతలతో పోలికనూ నిలుపుతుంది.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: మరణ బాధ కారణంగా
  rationale: διά + ద్వితీయావిభక్తి ఇక్కడ కారణాన్ని సూచిస్తుంది; సంక్షిప్తమైన సహజ తెలుగు రూపం మూలంలోని భావాన్ని కాపాడుతుంది.
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: మహిమా ఘనతలతో కిరీటం ధరింపజేయబడ్డాడు
  rationale: στεφανόωలోని కిరీట రూపకాన్ని, మహిమ మరియు ఘనత అనే రెండు అంశాలను నిలుపుతుంది.
- source_word: ὅπως
  choice: తద్వారా
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచించే సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: χωρὶς θεοῦ
  choice: దేవునికి వేరుగా
  rationale: అందించిన SBLGNT పాఠంలోని χωρὶς θεοῦను నేరుగా అనుసరిస్తూ, దాని క్లిష్టమైన భావాన్ని సులభతరం చేసి మార్చకుండా నిలుపుతుంది.
- source_word: ὑπὲρ παντός
  choice: ప్రతి ఒక్కరి కోసం
  rationale: ὑπέρలోని ప్రతినిధిత్వ లేదా ప్రయోజన భావాన్ని, παντόςలోని పంపిణీ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: γεύσηται θανάτου
  choice: మరణాన్ని రుచి చూడాలి
  rationale: మరణాన్ని అనుభవించడం అనే అర్థంతో పాటు γεύομαιలోని స్పష్టమైన రూపకాన్ని కూడా కాపాడుతుంది.
theological_decisions:
- issue: ఉద్దేశ వాక్యంలోని పాఠాంతరం
  choice: దేవునికి వేరుగా
  alternative: దేవుని కృపవల్ల
  rationale: అందించిన మూల పాఠం χωρὶς θεοῦ అని ఉన్నందున ప్రధాన పాఠంలో దానినే అనుసరించాం. χάριτι θεοῦ అనే ప్రాచీన, విస్తృతంగా స్వీకరించబడిన పాఠాంతరాన్ని అడుగుటిప్పణిలో ఉంచి పాఠసంబంధమైన మరియు దైవశాస్త్ర సంబంధమైన ఉద్రిక్తతను బహిరంగంగా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని ‘మరణాన్ని రుచి చూడటం’ మరియు ‘కిరీటం ధరింపజేయబడటం’ అనే రూపకాలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
