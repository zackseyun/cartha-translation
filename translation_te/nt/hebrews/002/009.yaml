  to: అయితే, కొంతకాలం దేవదూతలకంటే తక్కువవానిగా చేయబడిన యేసును మనం చూస్తున్నాం; మరణ వేదన కారణంగా ఆయన మహిమతోను ఘనతతోను కిరీటధారిగా చేయబడినవాడు. తద్వారా ఆయన దేవుని నుండి వేరుగా[a] ప్రతి ఒక్కరి కొరకు మరణాన్ని రుచి చూడునట్లు జరిగింది.
