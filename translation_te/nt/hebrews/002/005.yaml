revisions:
- from: ఎందుకంటే, మనం మాట్లాడుతున్న రాబోయే లోకాన్ని[a] ఆయన దేవదూతల అధికారానికి లోబరచలేదు.
  to: ఎందుకంటే, మనం మాట్లాడుతున్న రాబోయే లోకాన్ని ఆయన దేవదూతలకు లోబరచలేదు.
  rationale: The revision removes a small interpretive expansion from the main text and makes the lexical-alternative footnote natural in modern Telugu. It retains the explanatory force of γάρ, the future sense of μέλλουσαν, and the ongoing-discourse sense of λαλοῦμεν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:03:07Z'
review_pass:
  verdict: revise
  source_fidelity: The main clause accurately conveys Οὐ γὰρ, ὑπέταξεν, τὴν οἰκουμένην τὴν μέλλουσαν, and the ongoing reference in περὶ ἧς λαλοῦμεν. However, ‘దేవదూతల అధికారానికి’ makes explicit an ‘authority’ noun that is not present in the Greek. The dative ἀγγέλοις can be rendered directly as ‘దేవదూతలకు’; the governing/subjection sense remains clear through ‘లోబరచలేదు.’
  naturalness: The revised wording is fluent modern standard Telugu. The existing footnote’s ‘రాబోవుచున్న నివాసిత లోకాన్ని’ is somewhat archaic and unnatural; ‘మానవులు నివసించే రాబోయే లోకం’ communicates the lexical alternative idiomatically.
  terminology: ‘దేవదూతలు,’ ‘లోబరచలేదు,’ and ‘రాబోయే లోకం’ are appropriate and preserve the verse’s formal, theological register without resolving the precise nature of the coming world.
  issues:
  - severity: low
    issue: ‘అధికారానికి’ is an unnecessary explicit expansion of ἀγγέλοις.
    rationale: The Greek names angels in the dative, not their authority. Directly rendering ‘to angels’ is more source-close while still natural in Telugu.
  - severity: low
    issue: Footnote wording is not fully idiomatic modern Telugu.
    rationale: ‘రాబోవుచున్న’ is archaic in this register, and ‘నివాసిత లోకం’ is a calque-like expression. A phrase describing a world inhabited by people better conveys οἰκουμένη.
  revised_text: ఎందుకంటే, మనం మాట్లాడుతున్న రాబోయే లోకాన్ని ఆయన దేవదూతలకు లోబరచలేదు.
  revised_footnotes:
  - marker: a
    text: లేదా, ‘మానవులు నివసించే రాబోయే లోకాన్ని.’
    reason: οἰκουμένη అనే పదం ‘నివసించబడిన/మానవులు నివసించే లోకం’ అనే అర్థాన్నీ కలిగి ఉండవచ్చు.
  revision_rationale: The revision removes a small interpretive expansion from the main text and makes the lexical-alternative footnote natural in modern Telugu. It retains the explanatory force of γάρ, the future sense of μέλλουσαν, and the ongoing-discourse sense of λαλοῦμεν.
