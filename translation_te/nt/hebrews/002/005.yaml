id: HEB.2.5
reference: Hebrews 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: te
  text: ఎందుకంటే, మనం మాట్లాడుతున్న రాబోయే లోకాన్ని ఆయన దేవదూతలకు లోబరచలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: ఎందుకంటే ... లేదు
  rationale: γάρ ముందున్న వాదనకు వివరణాత్మక సంబంధాన్ని చూపుతుంది; Οὐ వాక్యాన్ని నిషేధిస్తుంది.
- source_word: ἀγγέλοις
  choice: దేవదూతల అధికారానికి
  rationale: సందర్భంలో వీరు మానవ సందేశకులు కాక పరలోక దేవదూతలు. గ్రీకు దత్తివిభక్తితో కూడిన ὑποτάσσω సూచించే పాలనాధికార భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ὑπέταξεν
  choice: లోబరచలేదు
  rationale: ఏదైనా ఒకరి అధికారం లేదా పాలన కింద ఉంచడమనే భావాన్ని కాపాడుతుంది.
- source_word: τὴν οἰκουμένην
  choice: లోకాన్ని
  rationale: οἰκουμένη అంటే నివాసిత లోకం లేదా లోకవ్యవస్థ; ప్రధాన పాఠంలో ‘లోకం’ సహజంగా ఉండగా విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὴν μέλλουσαν
  choice: రాబోయే
  rationale: μέλλουσαν భవిష్యత్తులో రానున్నదనే భావాన్ని తెలియజేస్తుంది; అంత్యకాల సంబంధిత సూచనను పరిష్కరించకుండా నిలుపుతుంది.
- source_word: περὶ ἧς λαλοῦμεν
  choice: మనం మాట్లాడుతున్న
  rationale: వర్తమానకాలంలోని కొనసాగుతున్న చర్చను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘రాబోయే లోకం’ యొక్క సూచన
  choice: భవిష్యత్తులో రానున్న లోకం లేదా లోకవ్యవస్థ
  alternative: సాధారణంగా నివాసిత భూమి; ప్రత్యేకంగా సువార్త యుగం
  rationale: τὴν οἰκουμένην τὴν μέλλουσαν సహజంగా రానున్న లోకం/వ్యవస్థను సూచిస్తుంది. అయితే దాని ఖచ్చిత కాలనిర్ణయాన్ని అనువాదంలో సిద్ధాంతపరంగా నిర్ధారించలేదు.
- issue: దేవదూతలకు లోబరచడం
  choice: దేవదూతల పాలనాధికారానికి లోబరచలేదు
  alternative: దేవదూతలకు అప్పగించలేదు
  rationale: ὑποτάσσω అధికారానికి కింద ఉంచడాన్ని సూచిస్తుంది; ‘అప్పగించడం’ కంటే ‘లోబరచడం’ మూలంలోని అధీనత భావాన్ని మెరుగ్గా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘అధికారానికి’ అనేది గ్రీకు దత్తివిభక్తిలో అంతర్లీనంగా ఉన్న పాలన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
