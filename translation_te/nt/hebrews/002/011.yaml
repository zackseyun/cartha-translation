revisions:
- from: పరిశుద్ధపరచేవాడు, పరిశుద్ధపరచబడుతున్నవారు—వీరందరూ ఒకని నుండే వచ్చినవారు[a]. అందువల్ల వారిని సహోదరులు అని పిలవడానికి ఆయన సిగ్గుపడడు[b].
