  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: te
  text: పరిశుద్ధపరచేవాడు, పరిశుద్ధపరచబడుతున్నవారు—వీరందరూ ఒకరి నుండే వచ్చినవారు[a]. అందువల్ల వారిని సహోదరులు అని పిలవడానికి ఆయన సిగ్గుపడడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకే తండ్రి నుండి,’ ‘ఒకే మూలం నుండి,’ లేదా ‘ఒకే పూర్వికుని నుండి.’ గ్రీకు పాఠ్యంలో ఈ ‘ఒకరు/ఒకటి’ ఎవరిని లేదా దేనిని సూచిస్తుందో స్పష్టంగా చెప్పలేదు.
    reason: alternative_reading
  - marker: b
    text: ‘సహోదరులు’ అనే పదం గ్రీకులోని పుంలింగ బహువచనమైన ἀδελφούςకు అనువాదం. సందర్భంలో ఇది స్త్రీలతో సహా విశ్వాసుల విస్తృత కుటుంబాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: పరిశుద్ధపరచేవాడు
  rationale: వర్తమాన కర్తరి కృదంతాన్ని వ్యక్తిని సూచించే సహజమైన తెలుగు రూపంలో ఇచ్చింది; ἁγιάζωకు ఉన్న ‘పరిశుద్ధపరచు’ భావాన్ని నిలుపుతుంది.
- source_word: οἱ ἁγιαζόμενοι
  choice: పరిశుద్ధపరచబడుతున్నవారు
  rationale: వర్తమాన కర్మణి కృదంతంలోని కొనసాగుతున్న ప్రక్రియ లేదా పురోగతిలో ఉన్న స్థితిని వ్యక్తం చేస్తుంది; ముందు పదంతో పదసంబంధ ఏకరూపతను కాపాడుతుంది.
- source_word: ἐξ ἑνὸς
  choice: ఒకని నుండే
  rationale: ἑνός పుంలింగ/నపుంసక ఏకవచన రూపం అయినప్పటికీ దాని ఉద్దేశిత వ్యక్తి లేదా మూలం వాక్యంలో స్పష్టంగా చెప్పబడలేదు. ‘ఒకని నుండే’ అని ఉంచడం ద్వారా ‘తండ్రి’, ‘పూర్వికుడు’ మొదలైన వివరణలను ప్రధాన పాఠ్యంలో చేర్చకుండా అస్పష్టతను నిలుపుతుంది.
- source_word: πάντες
  choice: వీరందరూ
  rationale: పరిశుద్ధపరచేవాడినీ పరిశుద్ధపరచబడుతున్నవారినీ కలిపి అందరినీ సూచించే బలాన్ని సహజ తెలుగులో స్పష్టపరుస్తుంది.
- source_word: δι’ ἣν αἰτίαν
  choice: అందువల్ల
  rationale: ముందున్న ప్రకటననుంచి వచ్చే పర్యవసానాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ἐπαισχύνεται
  choice: సిగ్గుపడడు
  rationale: గౌరవం-అవమానం భావాన్ని పరాభాష చేయకుండా తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: ἀδελφοὺς
  choice: సహోదరులు
  rationale: మూలంలోని పుంలింగ బహువచన కుటుంబపదాన్ని గౌరవప్రదమైన ఆధునిక తెలుగు పదంతో నిలుపుతుంది; సందర్భంలో విశ్వాసుల విస్తృత సమూహం ఉద్దేశించబడవచ్చని పాదసూచిక వివరిస్తుంది.
- source_word: καλεῖν
  choice: అని పిలవడానికి
  rationale: ἐπαισχύνεταιతో కలిసిన క్రియార్థక రూపాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అవ్యక్త కర్త (‘ఆయన’) గుర్తింపు మరియు ἐξ ἑνὸςలోని ‘ఒకని’ సూచన
  choice: సందర్భానుసారం ‘ఆయన’ పరిశుద్ధపరచే కుమారుణ్ణి సూచిస్తుంది; ‘ఒకని నుండే’ అనే మాట ఎవరిని లేదా ఏ మూలాన్ని సూచిస్తుందో ప్రధాన పాఠ్యం నిర్ధారించదు.
  alternative: ‘ఒకే తండ్రి నుండి’; ‘ఒకే మూలం నుండి’; ‘ఒకే పూర్వికుని నుండి’
  rationale: సమీప సందర్భం పరిశుద్ధపరచేవాణ్ణి కుమారుడు/యేసుగా గుర్తించడానికి ఆధారం ఇస్తుంది. అయితే ἐξ ἑνὸςలో ఆ ‘ఒకటి/ఒకడు’ దేవుడా, ఆదామా, అబ్రాహామా, లేక ఉమ్మడి మానవ మూలమా అనేది స్పష్టంగా లేదు; అందువల్ల ఆ ధార్మిక ఉద్వేగాన్ని అనువాదం పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పరిశుద్ధపరచు’ అనే స్థిరమైన ధార్మిక పదాన్ని ఉంచి, కృదంతాల వర్తమాన భావాన్ని సహజంగా వ్యక్తం చేసింది. మూలంలోని ‘ఒకని’ సూచనను ఉద్దేశపూర్వకంగా నిర్ధారించలేదు.
