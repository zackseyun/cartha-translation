id: HEB.2.12
reference: Hebrews 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: te
  text: 'ఇలా చెబుతున్నాడు: “నీ నామాన్ని నా సహోదరులకు[a] ప్రకటిస్తాను; సభ[b] మధ్యలో నిన్ను స్తుతిస్తూ పాడుతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా సహోదర సహోదరీలకు”; గ్రీకులో “సహోదరులకు” అని ఉంది, అయితే సందర్భంలో ఈ కుటుంబపదం తోటి విశ్వాసులందరినీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సమాజం”; “సంఘం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: ఇలా చెబుతున్నాడు
  rationale: ఈ వర్తమాన కృదంతం తరువాతి ఉల్లేఖనాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘ఇలా చెబుతున్నాడు’ సహజంగా ఉండి, మూలంలోని వర్తమాన భావాన్ని నిలుపుతుంది.
- source_word: Ἀπαγγελῶ
  choice: ప్రకటిస్తాను
  rationale: బహిరంగంగా తెలియజేయడం లేదా ప్రకటించడం అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ ὄνομά σου
  choice: నీ నామాన్ని
  rationale: ‘నామం’ అనే మూలరూపాన్ని విస్తరించకుండా నిలిపింది; సందర్భంలో అది వ్యక్తిత్వం, ఖ్యాతి, వెల్లడైన స్వరూపం వంటి విస్తృత భావాలను సూచించగలదు.
- source_word: τοῖς ἀδελφοῖς μου
  choice: నా సహోదరులకు
  rationale: గ్రీకు పదంలోని పుంలింగ బహువచన కుటుంబసంబంధ రూపాన్ని గౌరవంగా, సహజంగా నిలిపింది; సందర్భంలో విశ్వాస కుటుంబంలోని స్త్రీలు కూడా చేర్చబడవచ్చనే విషయాన్ని పాదసూచికలో తెలిపింది.
- source_word: ἐν μέσῳ
  choice: మధ్యలో
  rationale: మూలంలోని స్థానార్థక నుడికారాన్ని స్పష్టంగా, కవితాత్మక గంభీరతతో నిలుపుతుంది.
- source_word: ἐκκλησίας
  choice: సభ
  rationale: ఇక్కడ కీర్తన ఉల్లేఖనంలో కూడివచ్చిన ప్రజలను సూచిస్తుంది. ‘సభ’ ఆ భావాన్ని సహజంగా తెలియజేస్తూ, తరువాతి సంస్థాగత అర్థాలను అనవసరంగా చేర్చదు.
- source_word: ὑμνήσω
  choice: స్తుతిస్తూ పాడుతాను
  rationale: స్తుతిని పాటగా వ్యక్తం చేయడం అనే క్రియ యొక్క సంగీత భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: σε
  choice: నిన్ను
  rationale: સ્તુతి ఎవరికి ఉద్దేశించబడిందో సహజమైన తెలుగు కర్మరూపంలో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ἀδελφοῖς అనే పుంలింగ బహువచన కుటుంబపదం యొక్క ప్రతినిధి ప్రయోగం
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు
  rationale: మూలంలోని పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. అయితే సందర్భంలో మొత్తం విశ్వాస కుటుంబం ఉద్దేశించబడి ఉండవచ్చనే సమగ్ర భావాన్ని పాదసూచికలో సంరక్షించాం.
- issue: పాత నిబంధన ఉల్లేఖనంలో ἐκκλησία అనువాదం
  choice: సభ
  alternative: సమాజం; సంఘం
  rationale: కీర్తన 22:22 నేపథ్యంలోని కూడివచ్చిన దేవుని ప్రజలను ‘సభ’ నేరుగా సూచిస్తుంది; తరువాతి కాలపు సంస్థాగత భావాన్ని పాఠ్యంలోకి ముందుగానే తీసుకురాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. కీర్తన ఉల్లేఖనంలోని కవితాత్మక సమాంతరతను సెమీకోలన్‌తో నిలిపాం; ‘నామం’, ‘సభ’, ‘స్తుతిస్తూ పాడుతాను’ వంటి పదాలు మూలంలోని భావసాంద్రతను అతిగా వివరణ చేయకుండా కాపాడుతున్నాయి.
