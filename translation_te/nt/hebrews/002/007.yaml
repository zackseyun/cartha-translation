source:
  edition: SBLGNT
  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: te
  text: నీవు అతణ్ణి కొంతకాలం దేవదూతలకంటే తక్కువగా చేశావు[a]; మహిమతోను ఘనతతోను అతనికి కిరీటం పెట్టావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు అతణ్ణి దేవదూతలకంటే కొంచెం తక్కువగా చేశావు.” గ్రీకు పదబంధం కాలాన్ని కాక, స్థాయిలో కొంత తక్కువగా ఉండడాన్ని కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: తక్కువవానిగా చేశావు
  rationale: ἐλαττόω యొక్క కారణార్థక, తులనాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτὸν
  choice: అతణ్ణి
  rationale: కీర్తనలోని మానవ ప్రతినిధిని సూచించే పుంలింగ ఏకవచన కర్మ సర్వనామాన్ని నిలుపుతుంది; మూలంలో లేని నామవాచకాన్ని చేర్చదు.
- source_word: βραχύ τι
  choice: కొంతకాలం
  rationale: సందర్భంలో తాత్కాలికంగా తక్కువ స్థితిలో ఉండడాన్ని సూచించే కాలార్థాన్ని ప్రధాన పాఠంలో ఇస్తుంది; సాధ్యమైన పరిమాణార్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: παρ’ ἀγγέλους
  choice: దేవదూతలకంటే
  rationale: తులనాత్మక సందర్భంలో παρά + accusative యొక్క ‘కంటే’ అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: δόξῃ
  choice: మహిమతో
  rationale: కిరీటం పెట్టడానికి సంబంధించిన సాధన/అలంకార దత్తివును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τιμῇ
  choice: ఘనతతో
  rationale: ప్రదానం చేయబడిన గౌరవస్థితిని సూచిస్తుంది; δόξαతో ఉన్న జంట పదబంధానికి తెలుగులో సహజంగా సరిపోతుంది.
- source_word: ἐστεφάνωσας
  choice: కిరీటం పెట్టావు
  rationale: στεφανόω యొక్క ప్రత్యక్ష రూపకాన్ని, గ్రీకు భూతకాల క్రియారూపాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: αὐτόν
  choice: అతనికి
  rationale: తెలుగు వాక్యనిర్మాణంలో ‘కిరీటం పెట్టు’తో సహజంగా వచ్చే సంప్రదాన రూపాన్ని ఉపయోగిస్తూ, పునరుక్త సర్వనామ సూచనను నిలుపుతుంది.
theological_decisions:
- issue: కీర్తన 8 ఉద్ధరణలో βραχύ τι భావం
  choice: 'కాలార్థం: ‘కొంతకాలం’'
  alternative: 'పరిమాణార్థం: ‘కొంచెం తక్కువవానిగా’'
  rationale: గ్రీకు పదబంధం కాలాన్ని లేదా స్థాయి పరిమాణాన్ని సూచించగలదు. హెబ్రీయులు 2 సందర్భంలో కుమారుని తాత్కాలిక దీనస్థితి తరువాత మహిమపరచబడటం వల్ల కాలార్థం బలంగా సరిపోతుంది; అయినా అసలైన ద్వంద్వార్థాన్ని తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖనోచిత గంభీరతతో రూపొందించబడింది. ‘మహిమ’, ‘ఘనత’, ‘దేవదూతలు’ వంటి విస్తృతంగా పరిచయమైన బైబిలు పదజాలాన్ని ఉపయోగించింది.
