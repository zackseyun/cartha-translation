id: HEB.2.14
reference: Hebrews 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: te
  text: కాబట్టి, ఆ పిల్లలు రక్తమాంసాల్లో[a] భాగస్థులై ఉన్నారు గనుక, ఆయన స్వయంగా కూడా అదేవిధంగా వాటిలో పాలుపంచుకున్నాడు; తద్వారా మరణం ద్వారా మరణపు అధికారాన్ని కలిగినవాణ్ణి—అంటే అపవాదిని—నిర్వీర్యం చేయడానికి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాంసరక్తాల్లో.” గ్రీకులో పదక్రమం “రక్తం మరియు మాంసం.”
    reason: తెలుగులో సహజమైన ప్రత్యామ్నాయ పదక్రమాన్ని తెలియజేస్తూ, మూల గ్రీకు పదక్రమాన్ని పారదర్శకంగా చూపడం.
  - marker: b
    text: లేదా, “నాశనం చేయడానికి.” ఇక్కడి గ్రీకు క్రియకు నిర్వీర్యం చేయడం, ప్రభావం లేకుండా చేయడం, లేదా రద్దుచేయడం అనే భావాలు ఉండవచ్చు; అది తప్పనిసరిగా ఉనికినే నిర్మూలించడం అని సూచించదు.
    reason: అర్థపరిధిలోని సాధ్యమైన ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: కాబట్టి, … గనుక
  rationale: οὖν యొక్క నిర్ధారణాత్మక భావాన్నీ, ἐπεί యొక్క కారణార్థాన్నీ సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: τὰ παιδία
  choice: ఆ పిల్లలు
  rationale: ముందటి సందర్భంలో ప్రస్తావించిన పిల్లలను సూచిస్తున్నందున నిర్దేశక భావాన్ని ‘ఆ’ ద్వారా తెలిపింది; అనవసరంగా ‘చిన్నపిల్లలు’ అని సంకుచితం చేయలేదు.
- source_word: κεκοινώνηκεν
  choice: పాలుపంచుకున్నారు
  rationale: వారు రక్తమాంసాలతో నిజంగా భాగస్వాములై ఉన్నారనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αἵματος καὶ σαρκός
  choice: రక్తమాంసాల్లో
  rationale: గ్రీకు పదక్రమమైన ‘రక్తం మరియు మాంసం’ను నిలుపుతూ, తెలుగులో సహజమైన సమాసరూపాన్ని ఉపయోగిస్తుంది; σάρξకు ఇక్కడ రూపకాలంకారమైన ‘పాపస్వభావం’ అనే అర్థాన్ని చేర్చదు.
- source_word: καὶ αὐτὸς παραπλησίως
  choice: ఆయన కూడా తానే అదేవిధంగా
  rationale: αὐτός యొక్క ఉద్ఘాటనను ‘తానే’తో, παραπλησίως సూచించే నిజమైన సాదృశ్యాన్ని ‘అదేవిధంగా’తో వ్యక్తం చేస్తుంది.
- source_word: μετέσχεν τῶν αὐτῶν
  choice: వాటిలో పాలుపొందాడు
  rationale: మొదటి క్రియతో ఉన్న ఉద్దేశపూర్వక సమాంతరాన్ని నిలుపుతూ, వేరే తెలుగు క్రియను వాడి గ్రీకులోని క్రియాభేదాన్ని కొంత ప్రతిబింబిస్తుంది.
- source_word: ἵνα διὰ τοῦ θανάτου
  choice: మరణం ద్వారా … చేయడానికి
  rationale: ἵνα యొక్క ఉద్దేశార్థాన్నీ, διά యొక్క సాధనార్థాన్నీ స్పష్టంగా తెలుపుతుంది.
- source_word: καταργήσῃ
  choice: నిర్వీర్యం చేయడానికి
  rationale: ఉనికినే నిర్మూలించడం కంటే శక్తిని పనిచేయనీయకుండా చేయడం అనే καταργέω భావాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: τὸν τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: మరణపు అధికారాన్ని కలిగినవాణ్ణి
  rationale: κράτοςలోని శక్తి/అధికార భావాన్ని నిలుపుతుంది; ‘మరణంపై సంపూర్ణ అధికారం’ అని విస్తరించి చెప్పదు.
- source_word: τοῦτ’ ἔστι τὸν διάβολον
  choice: అంటే అపవాదిని
  rationale: τοῦτ’ ἔστι ఇచ్చే వివరణాత్మక గుర్తింపును సహజంగా తెలుపుతుంది; διάβολοςకు స్థిరపడిన వ్యక్తిగత బిరుదైన ‘అపవాది’ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: క్రీస్తు మానవ రక్తమాంసాల్లో పాలుపొందడం
  choice: ‘ఆయన కూడా తానే అదేవిధంగా వాటిలో పాలుపొందాడు’ అని అనువదించడం
  alternative: ‘ఆయన కూడా వారిలాగే మానవుడయ్యాడు’
  rationale: మూలంలోని παραπλησίως మరియు వేరైన క్రియను గౌరవిస్తూ నిజమైన భాగస్వామ్యాన్ని చెబుతుంది; అయితే ఈ వచనం స్పష్టంగా చెప్పని తదనంతర సిద్ధాంతపరమైన సూత్రీకరణను అనువాదంలోకి చేర్చదు.
- issue: καταργήσῃ వల్ల అపవాదికి ఏమి జరుగుతుంది
  choice: ‘నిర్వీర్యం చేయడానికి’
  alternative: ‘నాశనం చేయడానికి’
  rationale: అపవాది ఉనికి అంతమైందని తప్పుగా సూచించకుండా, అతని శక్తిని పనికిరాకుండా చేయడం/రద్దుచేయడం అనే క్రియ యొక్క భావపరిధిని వ్యక్తం చేస్తుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని కారణం–ఫలితం–ఉద్దేశం సంబంధాన్ని స్పష్టంగా ఉంచేందుకు తెలుగులో వాక్యాన్ని రెండు భాగాలుగా తీర్చిదిద్దినా భావక్రమాన్ని మార్చలేదు. ‘రక్తమాంసాలు,’ ‘అపవాది,’ ‘నిర్వీర్యం’ వంటి పదాలు సందర్భానికి తగిన గంభీరతతో పాటు స్పష్టతను ఇస్తాయి.
