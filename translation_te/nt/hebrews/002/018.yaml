id: HEB.2.18
reference: Hebrews 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: te
  text: ఎందుకంటే ఆయన తానే శోధించబడినప్పుడు బాధపడ్డాడు; ఎందువల్ల శోధించబడుతున్నవారికి సహాయం చేయగలడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, రెండు చోట్లా “పరీక్షించబడడం”: “ఆయన తానే పరీక్షించబడినప్పుడు బాధపడ్డాడు; ఎందువల్ల పరీక్షించబడుతున్నవారికి సహాయం చేయగలడు.” గ్రీకు క్రియ సందర్భాన్ని బట్టి “శోధించు” లేదా “పరీక్షించు” అని అర్థం కావచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ γὰρ
  choice: ఎందుకంటే ... కాబట్టి
  rationale: ἐν ᾧ యొక్క కారణార్థాన్ని, γὰρ యొక్క వివరణాత్మక అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; రెండింటి బలాన్ని ఒకే కారణ నిర్మాణంలో నిలుపుతుంది.
- source_word: πέπονθεν
  choice: బాధ అనుభవించాడు
  rationale: πάσχω సూచించే నిజమైన బాధానుభవాన్ని స్పష్టంగా తెలియజేస్తుంది; గ్రీకు పరిపూర్ణ కాలంలోని కొనసాగుతున్న ప్రాసంగికతను తరువాతి ‘సహాయం చేయగలడు’ అనే వాక్యభాగం తెలియజేస్తుంది.
- source_word: αὐτὸς
  choice: ఆయన తానే
  rationale: కుమారుడు స్వయంగా ఈ అనుభవాన్ని ఎదుర్కొన్నాడనే emphatic భావాన్ని నిలుపుతుంది.
- source_word: πειρασθείς
  choice: శోధించబడినప్పుడు
  rationale: πειράζωకు ఇక్కడ ‘శోధించు’ అనే సాధారణ నూతన నిబంధన భావాన్ని ఎంచుకుంటుంది; ‘పరీక్షించు’ కూడా సాధ్యమైనందున పాదటిప్పణిలో ఉంచబడింది.
- source_word: δύναται
  choice: సహాయం చేయగలడు
  rationale: సామర్థ్యాన్ని తెలిపే δύναταιను సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς πειραζομένοις
  choice: శోధించబడుతున్నవారికి
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న అనుభవాన్ని ‘బడుతున్న’ రూపం నిలుపుతుంది.
- source_word: βοηθῆσαι
  choice: సహాయం చేయ
  rationale: βοηθέω యొక్క ‘సహాయానికి రావడం’ అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: యేసుకూ విశ్వాసులకూ వర్తించిన πειράζω యొక్క భావం
  choice: శోధించబడిన / శోధించబడుతున్న
  alternative: పరీక్షించబడిన / పరీక్షించబడుతున్న
  rationale: ‘శోధన’ అనేది హెబ్రీయులు 4:15తో ఉన్న సంబంధాన్ని, మానవుల అనుభవంతో కుమారుని ఐక్యతను నిలుపుతుంది; ఇది ఆయన పాపానికి లొంగాడని సూచించదు. గ్రీకు పదానికి ‘పరీక్ష’ అనే భావమూ ఉండగలదు కాబట్టి ఆ నిజమైన సందిగ్ధతను పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని కాపాడే శైలి. ‘ఆయన తానే’ emphatic αὐτόςను నిలుపుతుంది. ప్రధాన వాక్యంలో [a] గుర్తు సంబంధిత ‘శోధించబడుతున్నవారికి’ భాగం తరువాత ఉంచబడింది.
