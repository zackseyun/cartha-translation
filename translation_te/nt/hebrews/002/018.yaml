revisions:
- from: ఎందుకంటే, ఆయన తానే శోధించబడినప్పుడు బాధ అనుభవించాడు కాబట్టి, శోధించబడుతున్నవారికి సహాయం చేయగలడు.[a]
  to: ఎందుకంటే ఆయన తానే శోధించబడినప్పుడు బాధపడ్డాడు; ఎందువల్ల శోధించబడుతున్నవారికి సహాయం చేయగలడు.[a]
  rationale: The revision removes an awkward doubled causal expression while retaining the explanatory “for/because” force and the consequent basis of Christ's ability to help. “బాధపడ్డాడు” is a more direct, natural Telugu expression for πάσχω than “బాధ అనుభవించాడు,” without changing the meaning. The footnote is conformed to the revised sentence and continues to preserve the context-dependent ambiguity of πειράζω.
