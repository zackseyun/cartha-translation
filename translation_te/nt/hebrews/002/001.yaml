id: HEB.2.1
reference: Hebrews 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὰ τοῦτο δεῖ περισσοτέρως ⸂προσέχειν ἡμᾶς⸃ τοῖς ἀκουσθεῖσιν, μήποτε παραρυῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/001.yaml
  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: te
  text: అందుచేత, మనం విన్నవాటికి ఇంకా ఎక్కువ శ్రద్ధ చూపాలి; లేకపోతే మనం వాటి నుండి కొట్టుకుపోవచ్చు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మనం వాటిని దాటి కొట్టుకుపోవచ్చు,” లేదా “మనం వాటిని జారిపోనివ్వవచ్చు.” గ్రీకు క్రియ ప్రవాహంలో కొట్టుకుపోవడం లేదా పక్కగా జారిపోవడం అనే చిత్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: అందుచేత
  rationale: ముందటి వాదన నుండి వచ్చే నిర్ధారణను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: δεῖ
  choice: శ్రద్ధ చూపాలి
  rationale: ఇక్కడి అవసరతను తెలుగులో సహజమైన విధిగా వ్యక్తం చేస్తుంది; ‘మనం’ ἡμᾶς‌ను స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: περισσοτέρως
  choice: మరింత ఎక్కువగా
  rationale: పోలికతో కూడిన తీవ్రతను నిలుపుతూ, శ్రద్ధలో అధిక జాగ్రత్త అవసరమని సూచిస్తుంది.
- source_word: προσέχειν ἡμᾶς
  choice: మనం ... శ్రద్ధ చూపాలి
  rationale: విన్న సందేశం వైపు మనస్సును నిలపడం, దానిని జాగ్రత్తగా పట్టించుకోవడం అనే అర్థాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: τοῖς ἀκουσθεῖσιν
  choice: మనం విన్నవాటికి
  rationale: ‘వినబడిన సంగతులు’ అనే కృత్రిమ నిర్మాణం బదులు, సంపూర్ణ కృదంతంలోని కొనసాగుతున్న ప్రాసంగికతను సహజంగా వ్యక్తం చేస్తుంది; ‘సందేశం’ అని వ్యాఖ్యానాత్మకంగా పరిమితం చేయదు.
- source_word: μήποτε
  choice: లేకపోతే ... ప్రమాదం ఉంది
  rationale: సంభవించగల ప్రతికూల ఫలితంపై హెచ్చరికను తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: παραρυῶμεν
  choice: మనం వాటి నుండి కొట్టుకుపోయే
  rationale: ప్రవాహంలో నెమ్మదిగా దూరంగా కొట్టుకుపోవడం లేదా పక్కగా జారిపోవడం అనే గ్రీకు రూపకాన్ని నిలుపుతుంది; ఉద్దేశపూర్వక విసర్జన అనే భావాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: παραρυῶμεν అనే హెచ్చరిక రూపకంలో ఎవరు లేదా ఏమి జారిపోతుంది?
  choice: విన్నవాటి నుండి ‘మనం ... కొట్టుకుపోయే’ ప్రమాదంగా అనువదించడం
  alternative: మనం వాటిని జారిపోనివ్వడం; లేదా మనం వాటిని దాటి కొట్టుకుపోవడం
  rationale: క్రియకు ప్రథమ పురుష బహువచన కర్త ఉన్నందున వినేవారి ప్రమాదకర కదలికను ప్రధాన పాఠ్యంలో చూపడం సముచితం. అయితే రూపకంలోని ‘దాటి కొట్టుకుపోవడం/వాటిని జారిపోనివ్వడం’ అనే సాధ్యమైన సూక్ష్మార్థాలను పాదసూచికలో ఉంచి, మతశాస్త్ర సంబంధమైన ఉద్రిక్తతను పరిష్కరించకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కొట్టుకుపోవడం’ ద్వారా మూలంలోని ప్రవాహ రూపకం నిలుపబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత హెచ్చరిక తరువాత ఉంచబడింది.
