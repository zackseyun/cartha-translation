revisions:
- from: అందుచేత, మనం విన్నవాటికి మరింత ఎక్కువగా శ్రద్ధ చూపాలి; లేకపోతే మనం వాటి నుండి కొట్టుకుపోయే ప్రమాదం ఉంది.[a]
  to: అందుచేత, మనం విన్నవాటికి ఇంకా ఎక్కువ శ్రద్ధ చూపాలి; లేకపోతే మనం వాటి నుండి కొట్టుకుపోవచ్చు.[a]
  rationale: The revision improves modern Telugu idiom and renders the warning construction more directly, while preserving the source’s comparative emphasis, the ambiguity of παραρυῶμεν, and the lexical-alternative footnote anchor.
