id: HEB.2.16
reference: Hebrews 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ δήπου ἀγγέλων ἐπιλαμβάνεται, ἀλλὰ σπέρματος Ἀβραὰμ ἐπιλαμβάνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: te
  text: ఎందుకంటే, నిశ్చయంగా ఆయన దూతలకు సహాయం చేయడు; అబ్రాహాము సంతానానికే సహాయం చేస్తాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పట్టుకొంటాడు.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘పట్టుకోవడం’ అని అర్థం రావచ్చు; ఇక్కడ అది ‘ఆదుకోవడం’ లేదా ‘సహాయానికి రావడం’ అనే భావాన్ని ఇచ్చే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: నిశ్చయార్థాన్ని వాక్య నిర్మాణం ద్వారా వ్యక్తపరచడం
  rationale: δήπου వాదనలో స్పష్టమైనదిగా భావించే విషయాన్ని నొక్కిచెబుతుంది. తెలుగులో ప్రత్యేకంగా ‘నిశ్చయంగా’ చేర్చడం కంటే ‘దూతలకు... లేదు; ...సంతానానికే’ అనే వ్యతిరేక నిర్మాణం దాని భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀγγέλων
  choice: దూతలకు
  rationale: ఇది దేవదూతలను సూచించే సాధారణ బైబిలు పదం. ἐπιλαμβάνεταιను ‘సహాయం చేయడం’గా తీసుకున్నందున తెలుగు విభక్తి ‘-కు’ సహజంగా సరిపోతుంది.
- source_word: ἐπιλαμβάνεται
  choice: సహాయం చేయడం / సహాయం చేస్తున్నాడు
  rationale: ఈ సందర్భంలో ఈ క్రియ ‘పట్టుకోవడం’ అనే మూలార్థం నుంచి ‘ఆదుకోవడం, సహాయానికి రావడం’ అనే భావాన్ని కలిగిస్తుంది. ప్రధాన పాఠంలో స్పష్టమైన ఆధునిక తెలుగు కోసం ‘సహాయం’ వాడి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: σπέρματος Ἀβραὰμ
  choice: అబ్రాహాము సంతానం
  rationale: σπέρμα ఇక్కడ సమూహార్థక ఏకవచనంగా అబ్రాహాము వంశస్థులను సూచించగలదు. ‘సంతానం’ ఆ ఏకవచన సమూహ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: ఎందుకంటే ... లేదు; ...కే ... చేస్తున్నాడు
  rationale: ఈ నిర్మాణం బలమైన వ్యతిరేకతను చూపుతుంది. తెలుగులో ‘లేదు’ మరియు నొక్కిచెప్పే ‘-కే’ ద్వారా ఆ వ్యతిరేకత సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: క్రీస్తు రక్షణ కార్యానికి సంబంధించి ἐπιλαμβάνεται అర్థం
  choice: కుమారుడు దూతలకు కాక అబ్రాహాము సంతానానికి సహాయం చేస్తున్నాడని ప్రధాన పాఠం చెబుతుంది.
  alternative: కుమారుడు అబ్రాహాము సంతానాన్ని ‘పట్టుకుంటున్నాడు’ లేదా ‘చేపడుతున్నాడు’; దీనిలో మానవ స్వభావాన్ని స్వీకరించే సూచన ఉందని అర్థం చేసుకోవచ్చు.
  rationale: సమీప సందర్భం కుమారుడు మనుషులతో ఐక్యమై వారిని రక్షించడాన్ని వివరిస్తుంది; అందువల్ల ‘సహాయం చేయడం’ సందర్భోచితమైన అర్థం. అయినా గ్రీకు క్రియలోని ‘పట్టుకోవడం’ అనే ప్రత్యక్ష భావం మరియు దాని చారిత్రక వేదాంత ప్రాముఖ్యతను తొలగించకుండా పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘అబ్రాహాము సంతానం’ సమూహార్థక ఏకవచనాన్ని నిలుపుతుంది. δήπου యొక్క నిశ్చయార్థాన్ని భారంగా వినిపించే అదనపు క్రియావిశేషణం కంటే వ్యతిరేక నిర్మాణం మరియు ‘-కే’ ద్వారా తెలిపాం.
