source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: te
  text: “నీవు సమస్తాన్ని అతని పాదాల కింద లోబరచావు.” ఎందుకంటే సమస్తాన్ని అతనికి లోబరచడంలో[a], అతనికి లోబడనిదిగా దేనినీ విడిచిపెట్టలేదు.[b] అయితే ఇప్పుడు సమస్తమూ అతనికి లోబడివున్నట్లు మనం ఇంకా చూడటం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతని,’ ‘అతనికి’ అనే సర్వనామాలు కీర్తన 8ను ప్రతిధ్వనిస్తున్నాయి. సందర్భంలో అవి కీర్తన యొక్క మొదటి భావంలో మానవజాతిని, హెబ్రీయుల పత్రిక అన్వయంలో యేసును సూచించగలవు.
    reason: cross_reference
  - marker: b
    text: లేదా, “సమస్తాన్ని అతనికి లోబరచినప్పుడు.” గ్రీకు వాక్యనిర్మాణాన్ని కాలార్థకంగా కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: సమస్తం
  rationale: నపుంసక బహువచనానికి ఉన్న సమగ్ర పరిధిని సహజమైన, గంభీరమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπέταξας
  choice: లోపరచావు
  rationale: కీర్తన 8 ప్రతిధ్వనిని, అధికారానికి లోబరచడం అనే ὑποτάσσω పదకుటుంబ భావాన్ని నిలుపుతుంది.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: అతని పాదాల కింద
  rationale: ఆధిపత్యం, లోబాటు సూచించే మూలభాషా నుడికారాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: లోపరచడంలో
  rationale: ἐν తో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ యొక్క భావాత్మక నిర్మాణాన్ని నిలుపుతుంది; కాలార్థక అనువాదాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: γὰρ
  choice: (వివరణాత్మక వాక్యసంబంధం ద్వారా వ్యక్తం)
  rationale: ముందున్న ఉల్లేఖనాన్ని వివరించే సంబంధం తెలుగులో తదుపరి వాక్య నిర్మాణం ద్వారా సహజంగా స్పష్టమవుతుంది.
- source_word: οὐδὲν ἀφῆκεν
  choice: దేనినీ విడిచిపెట్టలేదు
  rationale: ఏదీ మినహాయించబడలేదనే సంపూర్ణతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀνυπότακτον
  choice: లోబడకుండా
  rationale: లోబాటు అనే పునరావృత భావాన్ని కాపాడుతూ predicate భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νῦν δὲ
  choice: అయితే ఇప్పుడు
  rationale: ప్రకటిత ఆధిపత్యానికి, ప్రస్తుతం కనిపిస్తున్న స్థితికి మధ్య వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: οὔπω ὁρῶμεν
  choice: మనకు ఇంకా కనిపించడం లేదు
  rationale: ఇంకా నెరవేరినట్లు దర్శనమివ్వని ప్రస్తుత స్థితిని సహజమైన తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: ὑποτεταγμένα
  choice: లోబడి ఉండడం
  rationale: పరిపూర్ణ కర్మణి రూపం సూచించే ఫలితస్థితిని తెలియజేస్తూ ὑποτάσσω పదకుటుంబ అనుసంధానాన్ని కాపాడుతుంది.
theological_decisions:
- issue: αὐτοῦ / αὐτῷ సర్వనామాల సూచిత వ్యక్తి
  choice: అతని / అతనికి అని మాత్రమే అనువదించి, సూచిత వ్యక్తిని ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయలేదు.
  alternative: కీర్తన 8లో మానవజాతి/మనిషి; హెబ్రీయుల పత్రిక అన్వయంలో కుమారుడు/యేసు.
  rationale: కీర్తనలోని మానవార్థాన్ని, హెబ్రీయుల పత్రికలోని క్రీస్తుకేంద్రీయ అన్వయాన్ని ఒకే నిర్ణయంతో తొలగించకుండా మూలపాఠ్యంలోని ఉద్దేశపూర్వక theological tensionను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘లోపరచు/లోబడు’ పదాలతో గ్రీకు ὑποτάσσω పదకుటుంబ పునరావృతాన్ని సాధ్యమైనంతవరకు నిలిపి, సర్వనామాల సూచనలోని అస్పష్టతను ఉద్దేశపూర్వకంగా కాపాడింది.
