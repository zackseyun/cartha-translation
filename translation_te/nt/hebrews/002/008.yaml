revisions:
- from: “సమస్తాన్ని అతని పాదాల కింద లోపరచావు.” సమస్తాన్ని అతనికి లోపరచడంలో[a], అతనికి లోబడకుండా దేనినీ విడిచిపెట్టలేదు.[b] అయితే ఇప్పుడు సమస్తం అతనికి లోబడి ఉండడం మనకు ఇంకా కనిపించడం లేదు.
