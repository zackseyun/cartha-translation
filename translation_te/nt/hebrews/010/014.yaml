source:
  edition: SBLGNT
  text: μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: te
  text: ఎందుకంటే, ఆయన ఒకే అర్పణ ద్వారా పవిత్రపరచబడుతున్నవారిని ఎల్లకాలానికి పరిపూర్ణులుగా చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్రులుగా చేయబడుతున్నవారిని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ
  choice: ఒకే
  rationale: ప్రసφορᾷను విశేషించే ఏకవచన రూపం; సందర్భంలో ఆ అర్పణ యొక్క ఏకైకతను నొక్కిచెప్పడానికి ‘ఒకే’ అని అనువదించాం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు కారణాన్ని లేదా వివరణను కలుపుతుంది; ఆధునిక తెలుగులో ఈ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: προσφορᾷ
  choice: అర్పణ
  rationale: దేవునికి సమర్పించబడేదాన్ని సూచించే విస్తృత పదం; హెబ్రీయులకు పత్రికలోని బలి సందర్భానికి సరిపోతూనే, ‘బలి’ అని మరింత నిర్దిష్టంగా వ్యాఖ్యానించకుండా మూలపద పరిధిని కాపాడుతుంది.
- source_word: τετελείωκεν
  choice: పరిపూర్ణులుగా చేశాడు
  rationale: పూర్తయిన కార్యం మరియు కొనసాగుతున్న ఫలితాన్ని సూచించే గ్రీకు పర్ఫెక్ట్ కాలబలాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; ‘పూర్తికి తెచ్చాడు’ కూడా సాధ్యమే కాని ఇక్కడి θελειόω పదబలానికి ‘పరిపూర్ణులుగా చేశాడు’ దగ్గరగా ఉంటుంది.
- source_word: εἰς τὸ διηνεκές
  choice: ఎల్లకాలానికి
  rationale: ఆ ఒక్క అర్పణ ఫలితపు శాశ్వతమైన, కొనసాగుతున్న చెల్లుబాటును సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς ἁγιαζομένους
  choice: పవిత్రపరచబడుతున్నవారిని
  rationale: వర్తమాన కర్మణి కృదంతంలోని కొనసాగుతున్న భావాన్ని నిలుపుతుంది; వారు పవిత్రత పొందుతున్నారని చూపిస్తూ, దానిని పూర్తయిన స్థితిగా మాత్రమే మార్చదు.
theological_decisions:
- issue: పూర్తయిన పరిపూర్ణతకు, కొనసాగుతున్న పవిత్రపరచబడటానికి మధ్య సంబంధం
  choice: ‘పరిపూర్ణులుగా చేశాడు’ మరియు ‘పవిత్రపరచబడుతున్నవారిని’ అనే రెండు కోణాలనూ కలిపి నిలిపాం.
  alternative: వాక్యాన్ని పూర్తిగా స్థితిగత పవిత్రతగా మార్చడం, లేదా పూర్తయిన ఫలితాన్ని బలహీనపరచి కేవలం క్రమంగా జరిగే ప్రక్రియగా చూపడం.
  rationale: τετελείωκεν పూర్తయి నిలిచే ఫలితాన్ని, ἁγιαζομένους కొనసాగుతున్న ప్రక్రియ లేదా గుర్తింపును ఒకేసారి ఉంచుతుంది. మూలంలోని ఈ ఉద్దేశపూర్వక ఉద్వేగాన్ని ఏ సిద్ధాంత పద్ధతివైపూ పరిష్కరించకుండా అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అర్పణ,’ ‘పరిపూర్ణులుగా,’ ‘పవిత్రపరచబడుతున్నవారు’ అనే పదాలు హెబ్రీయులకు పత్రికలోని ఆరాధనా-ధార్మిక భావాన్ని మరియు గ్రీకు క్రియారూపాల మధ్య ఉన్న కాలభేదాన్ని కాపాడుతాయి.
