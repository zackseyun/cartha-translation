    rationale: సందర్భంలో పరిశుద్ధాత్మ కర్తగా అర్థమయ్యే అవకాశం ఉన్నప్పటికీ, గ్రీకు ఆర్టిక్యులర్ ఇన్ఫినిటివ్ ఇక్కడ కర్తను తిరిగి వ్యక్తపరచదు. తెలుగులో కర్తను వదిలివేయడం మూలంలోని రూపాన్ని మరింత సమీపంగా ప్రతిబింబిస్తుంది.
