  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: te
  text: 'పరిశుద్ధాత్మ కూడా మనకు సాక్ష్యమిస్తున్నాడు; ఎందుకంటే, ఇలా చెప్పిన తర్వాత:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: సాక్ష్యమిస్తున్నాడు
  rationale: వర్తమానకాల క్రియను, సాక్షి ఇచ్చే వాంగ్మూల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. పరిశుద్ధాత్మకు అనుగుణంగా పుంలింగ ఏకవచన క్రియ వాడబడింది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. తెలుగు ప్రవాహంలో ‘కూడా’ మరియు వాక్యక్రమమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తాయి; ‘అయితే’ అనవసరమైన వ్యతిరేక భావాన్ని కలిగించవచ్చు.
- source_word: ἡμῖν
  choice: మనకు
  rationale: μαρτυρέωతో వచ్చిన దత్తివిభక్తి, సాక్ష్యం ఎవరికి అందుతుందో సూచిస్తుంది; ‘మనకు’ దానిని నేరుగా నిలుపుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: పరిశుద్ధాత్మను అదనపు సాక్షిగా చేర్చే καί యొక్క సముచ్చయ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: నిర్దిష్టమైన ‘Holy Spirit’ బిరుదుకు ప్రామాణికమైన ఆధునిక తెలుగు రూపం.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: ఎందుకంటే, ఆయన మొదట ఇలా చెప్పిన తర్వాత
  rationale: μετάతో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ కాలక్రమాన్ని సూచిస్తుంది. గ్రీకులో కర్త అంతర్లీనంగా ఉండగా, తెలుగులో సహజత కోసం ముందున్న ‘పరిశుద్ధాత్మ’ను సూచించే ‘ఆయన’ చేర్చబడింది. తరువాతి వచనంలో మరో ఉల్లేఖనం రావడం వల్ల ‘మొదట’ అనేది నిర్మాణాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: పరిశుద్ధాత్మ సాక్ష్యమిచ్చే వ్యక్తిగత కర్తగా చూపబడటం
  choice: పరిశుద్ధాత్మ కూడా మనకు సాక్ష్యమిస్తున్నాడు
  alternative: పరిశుద్ధాత్మ కూడా మన పక్షంగా సాక్ష్యమిస్తున్నాడు
  rationale: గ్రీకు వాక్యనిర్మాణం పరిశుద్ధాత్మనే క్రియాశీల కర్తగా చూపుతుంది. ἡμῖνను ‘మనకు’గా అనువదించడం, సాక్ష్యం మన పక్షాన ఉందని అవసరానికి మించి నిర్ణయించకుండా మూలంలోని భావాన్ని కాపాడుతుంది.
- issue: εἰρηκέναι అనే ఇన్ఫినిటివ్‌కు అంతర్లీన కర్త
  choice: ఆయన ... చెప్పిన తర్వాత
  alternative: ఇలా చెప్పిన తర్వాత
  rationale: సమీప కర్త పరిశుద్ధాత్మ కావడంతో ‘ఆయన’ సహజమైన సూచన. అయితే గ్రీకు స్వయంగా ఇన్ఫినిటివ్ కర్తను మళ్లీ వ్యక్తపరచదు; అందువల్ల ప్రత్యామ్నాయంలో ఆ అస్పష్టత మరింత నేరుగా నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ఈ వాక్యం తరువాతి ఉల్లేఖనానికి పరిచయం కాబట్టి చివర ద్విబిందువు ఉంచబడింది.
