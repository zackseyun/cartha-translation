source:
  edition: SBLGNT
  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: te
  text: మోషే ధర్మశాస్త్రాన్ని తిరస్కరించినవాడు ఇద్దరు లేదా ముగ్గురు సాక్షుల వాంగ్మూలం ఆధారంగా కనికరం లేకుండా మరణిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరణశిక్ష పొందుతాడు.’ గ్రీకులో అక్షరార్థంగా ‘మరణిస్తాడు’ అని ఉంది; అయితే సందర్భం మోషే ధర్మశాస్త్రం కింద న్యాయపరంగా విధించే మరణశిక్షను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: తిరస్కరించినవాడు
  rationale: ἀθετέω అధికారమున్న దానిని తోసిపుచ్చడం లేదా నిరాకరించడం అనే భావాన్ని ఇస్తుంది. ‘తిరస్కరించినవాడు’ ధర్మశాస్త్ర అధికారాన్ని నిరాకరించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఉల్లంఘించినవాడు’ కేవలం ఒక నియమాన్ని అతిక్రమించడానికే భావాన్ని పరిమితం చేయవచ్చు.
- source_word: τις
  choice: వాడు
  rationale: ఇక్కడ τις సాధారణంగా ఎవరినైనా సూచిస్తుంది. ‘తిరస్కరించినవాడు’ అనే సంబంధార్థక నిర్మాణంలో ‘వాడు’ ఆ సాధారణ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: νόμον Μωϋσέως
  choice: మోషే ధర్మశాస్త్రాన్ని
  rationale: గ్రీకు షష్ఠీ నిర్మాణాన్ని స్పష్టంగా, సాధారణ తెలుగు బైబిలు పరిభాషకు అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: χωρὶς οἰκτιρμῶν
  choice: కనికరం లేకుండా
  rationale: οἰκτιρμοί యొక్క దయ/కనికర భావాన్ని న్యాయసంబంధ సందర్భంలో సహజంగా అందిస్తుంది. గ్రీకులో బహువచనం ఉన్నా తెలుగులో ఏకవచన భావనామ రూపం సహజం.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: ఇద్దరు లేదా ముగ్గురు సాక్షుల సాక్ష్యం ఆధారంగా
  rationale: ἐπί + దత్తివిభక్తి తీర్పుకు ఆధారాన్ని సూచిస్తుంది. ‘సాక్ష్యం ఆధారంగా’ అని చేర్చడం న్యాయపరమైన భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀποθνῄσκει
  choice: మరణిస్తాడు
  rationale: వర్తమాన నిర్దేశక రూపం సాధారణంగా వర్తించే న్యాయపరమైన ఫలితాన్ని చెబుతుంది. ‘మరణిస్తాడు’ గ్రీకు క్రియకు దగ్గరగా ఉండి, శిక్ష అమలు భావాన్ని సందర్భమే తెలియజేయనిస్తుంది.
theological_decisions:
- issue: ἀποθνῄσκειలో న్యాయపరమైన మరణశిక్ష అమలు భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంచేయాలా
  choice: మరణిస్తాడు
  alternative: మరణశిక్ష పొందుతాడు
  rationale: మోషే ధర్మశాస్త్రంలోని న్యాయవిచారణ, మరణశిక్ష నేపథ్యం ఇక్కడ స్పష్టంగా ఉన్నప్పటికీ, గ్రీకు క్రియ అక్షరార్థంగా ‘మరణిస్తాడు’ అని మాత్రమే చెబుతుంది. ప్రధాన పాఠ్యంలో ఆ నియంత్రణను నిలుపుతూ, న్యాయపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ధర్మశాస్త్రం,’ ‘సాక్ష్యం,’ ‘కనికరం’ వంటి స్థిరమైన, సహజమైన పదాలను ఉపయోగించాం. మూలంలోని న్యాయపరమైన సంక్షిప్తతను కాపాడి, ‘మరణశిక్ష’ అనే స్పష్టీకరణను పాదసూచికకే పరిమితం చేశాం.
