id: HEB.10.11
reference: Hebrews 10:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: te
  text: ప్రతి యాజకుడూ రోజు రోజూ నిలబడి యాజక సేవ చేస్తూ, అవే బలులను మళ్లీ మళ్లీ అర్పిస్తుంటాడు; ఆ బలులు పాపాలను ఎన్నటికీ తొలగించలేవు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపాలను తీసివేయలేవు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: ప్రతి యాజకుడూ
  rationale: ఏకవచన నామవాచకంతో ఉన్న πᾶς‌కు గల పంపిణీ భావాన్ని ఇది సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ἱερεύς సాధారణ యాజకుణ్ణి సూచిస్తుంది; ప్రధాన యాజకుణ్ణి కాదు.
- source_word: ἕστηκεν
  choice: నిలబడి
  rationale: క్రియ సూచించే నిలిచియున్న భంగిమను కాపాడుతూ, తదుపరి వచనంలో మెస్సీయ కూర్చోవడంతో ఉన్న సాహిత్యపరమైన వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: καθ’ ἡμέραν
  choice: రోజు రోజూ
  rationale: నిత్యం పునరావృతమయ్యే సేవను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: λειτουργῶν
  choice: యాజక సేవ చేస్తూ
  rationale: ఇది సాధారణ సేవ కాక ఆరాధన సంబంధమైన యాజక పరిచర్య అని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: అవే బలులను
  rationale: అదే విధమైన బలులు పదేపదే అర్పించబడుతున్నాయనే αὐτάς ఉద్ఘాటనను కాపాడుతుంది.
- source_word: πολλάκις
  choice: మళ్లీ మళ్లీ
  rationale: పునరావృతిని బలంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: προσφέρων
  choice: అర్పిస్తూ
  rationale: బలుల సందర్భంలో προσφέρωకు సరైన, ప్రామాణిక తెలుగు సమానం.
- source_word: αἵτινες
  choice: ఆ బలులు
  rationale: ముందు చెప్పిన బలులనే తిరిగి సూచిస్తూ, వివరణాత్మక ఉపవాక్యాన్ని తెలుగులో స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: οὐδέποτε δύνανται
  choice: ఎన్నటికీ ... లేవు
  rationale: ఆ బలుల సంపూర్ణ అసమర్థతను తగ్గించకుండా తెలియజేస్తుంది.
- source_word: περιελεῖν ἁμαρτίας
  choice: పాపాలను ... తొలగించ
  rationale: περιαιρέωలోని తీసివేయడం లేదా తొలగించడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; మరో సముచిత రూపాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: యాజకుల నిలబడే భంగిమకు హెబ్రీయులు 10 వాదనతో ఉన్న సంబంధం
  choice: ἕστηκεν‌ను ‘నిలబడి’ అని అనువదించి యాజకుల నిరంతర సేవను, తదుపరి వచనంలో మెస్సీయ కూర్చోవడంతో ఉన్న వ్యత్యాసాన్ని కాపాడడం
  alternative: భంగిమకు తక్కువ ప్రాధాన్యం ఇస్తూ కేవలం ‘సేవ చేస్తూ ఉంటాడు’ అని అనువదించడం
  rationale: మూలపాఠంలోని భంగిమ వాదనలో భాగం. దానిని నిలుపుకోవడం వ్యాఖ్యానాన్ని చేర్చకుండా సమీప సందర్భంలోని సాహిత్య-దైవశాస్త్ర వ్యత్యాసాన్ని ప్రతిబింబిస్తుంది.
- issue: బలుల అసమర్థత యొక్క పరిధి
  choice: ‘పాపాలను ఎన్నటికీ తొలగించలేవు’ అనే నిరపేక్షమైన వాక్యాన్ని నిలుపుకోవడం
  alternative: ‘పాపాలతో పూర్తిగా వ్యవహరించలేవు’ వంటి మృదువైన రూపం
  rationale: οὐδέποτε δύνανται సంపూర్ణ అసమర్థతను వ్యక్తం చేస్తుంది. పాత బలుల పరిమితి గురించి రచయిత చేసిన ప్రకటనను అనువాదం బలహీనపరచకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘యాజక సేవ’ ఆరాధన సంబంధమైన పరిచర్యను స్పష్టం చేస్తుంది; ‘బలులు’ తెలుగు బైబిలు వాడుకలో సహజమైన పదం.
