- from: అయితే నా నీతిమంతుడు విశ్వాసం ద్వారా జీవిస్తాడు[a]; అతడు వెనక్కి తగ్గితే[c], అతనిలో నా ప్రాణం సంతోషించదు.[b]
  to: అయితే నా నీతిమంతుడు[b] విశ్వాసం వలన జీవిస్తాడు[a]; అతడు వెనక్కి తగ్గితే[c], నా ప్రాణం అతనియందు ప్రసన్నం కాదు.
  rationale: The revision removes an unnatural and potentially locative reading of ‘in him,’ using ‘అతనియందు ప్రసన్నం కాదు’ for the Greek expression ‘my soul takes no pleasure in him.’ It also changes ‘ద్వారా’ to the more natural ‘వలన’ for the faith phrase and moves the textual-variant anchor to the possessive phrase it concerns. No doctrinal interpretation is added, and the singular masculine warning and the lexical ambiguity of πίστις remain preserved.
