  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: te
  text: అయితే నా నీతిమంతుడు[b] విశ్వాసం వలన జీవిస్తాడు[a]; అతడు వెనక్కి తగ్గితే[c], నా ప్రాణం అతనియందు ప్రసన్నం కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నమ్మకం వలన’ లేదా ‘విశ్వసనీయతవల్ల’ అని కూడా అనువదించవచ్చు. గ్రీకు πίστις అనే పదానికి సందర్భానుసారం ఈ భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘నా నీతిమంతుడు’ అనే దానికి బదులు ‘నీతిమంతుడు’ అని మాత్రమే ఉంది.
    reason: textual_variant
  - marker: c
    text: ‘అతడు,’ ‘అతనియందు’ అనే ఏకవచన పుంలింగ రూపాలు గ్రీకు వాక్యనిర్మాణాన్ని ప్రతిబింబిస్తాయి; ఈ మాట పురుషులకు మాత్రమే పరిమితం కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δίκαιός
  choice: నీతిమంతుడు
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తిని సూచించే ‘నీతిమంతుడు’గా అనువదించాం.
- source_word: μου
  choice: నా
  rationale: SBLGNT పాఠంలో ఉన్న స్వామ్యసూచక సర్వనామాన్ని నిలిపి, ‘నా నీతిమంతుడు’గా ఇచ్చాం.
- source_word: ἐκ πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: ἐκ ఇక్కడ ఆధారం లేదా సాధనాన్ని సూచిస్తుంది; πίστις‌కు ప్రధాన పాఠంలో ‘విశ్వాసం’ అని ఇచ్చి, సాధ్యమైన ‘నమ్మకం/విశ్వసనీయత’ భావాలను పాదసూచికలో ఉంచాం.
- source_word: ζήσεται
  choice: జీవిస్తాడు
  rationale: భవిష్యత్ కాలంలోని క్రియను తెలుగులో సహజమైన భవిష్యదర్థ రూపంతో అనువదించాం.
- source_word: ὑποστείληται
  choice: వెనక్కి తగ్గితే
  rationale: ఒత్తిడి లేదా భయంతో వెనుదిరగడం, తగ్గిపోవడం అనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ εὐδοκεῖ
  choice: సంతోషించదు
  rationale: ‘ఇష్టపడదు/ప్రసన్నం కాదు’ అనే భావాన్ని, ‘నా ప్రాణం’ అనే కర్తతో సహజంగా కలిసే విధంగా ఇచ్చాం.
- source_word: ἡ ψυχή μου
  choice: నా ప్రాణం
  rationale: గ్రీకులోని వ్యక్తిగత, లేఖనప్రతిధ్వనిగల ‘నా ψυχή’ వ్యక్తీకరణను కేవలం ‘నేను’గా సరళీకరించకుండా నిలిపాం.
- source_word: ἐν αὐτῷ
  choice: అతనిలో
  rationale: ἐν + దత్తివును నేరుగా నిలిపి, వ్యక్తిపై ప్రసన్నత లేకపోవడాన్ని ‘అతనిలో’ అని వ్యక్తం చేశాం.
theological_decisions:
- issue: ἐκ πίστεως లో πίστις భావం
  choice: విశ్వాసం
  alternative: నమ్మకం లేదా విశ్వసనీయత
  rationale: ప్రధాన పాఠంలో సాధారణమైన ‘విశ్వాసం’ను వాడి, హబక్కూకు ప్రతిధ్వనిలో ఉన్న భావసంభావ్యతను పాదసూచికలో భద్రపరిచాం.
- issue: ‘అతడు వెనక్కి తగ్గితే’ అనే వాక్యంలోని కర్త
  choice: ముందు చెప్పిన అదే ఏకవచన వ్యక్తిని సూచించేలా ఉంచడం
  alternative: నీతిమంతునికి భిన్నమైన అనిర్దిష్ట వ్యక్తిగా అర్థం చేసుకోవడం
  rationale: గ్రీకు పాఠం ఏకవచన ప్రవాహాన్ని కొనసాగిస్తుంది; హెచ్చరికలోని వేదాంతపరమైన ఉద్రిక్తతను సడలించకుండా అదే ప్రవాహాన్ని నిలిపాం.
- issue: వ్యాకరణ లింగం మరియు ప్రతినిధిత్వం
  choice: పుంలింగ ఏకవచనాన్ని ‘అతడు/అతనిలో’గా నిలిపివేయడం
  alternative: లింగనిరపేక్ష బహువచనం లేదా ‘ఆ వ్యక్తి’
  rationale: మూలంలో ఏకవచన పుంలింగ రూపం ఉంది; అది పురుషులకు మాత్రమే పరిమితమని సూచించకుండా ప్రతినిధి ప్రయోగమని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ‘నా ప్రాణం’ అనే వ్యక్తీకరణను, ఏకవచన హెచ్చరికను, విశ్వాసం/విశ్వసనీయత మధ్య ఉన్న భావసంభావ్యతను నిలిపాం.
