    text: ‘యథార్థమైన హృదయంతో’ అన్నదానికి ‘నిష్కపటమైన హృదయంతో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘చెడు మనస్సాక్షి’ అన్నదానికి కొందరు ‘అపరాధభావంతో నిండిన మనస్సాక్షి’ అని అర్థం చేసుకుంటారు; అయితే గ్రీకు పదం మరింత విస్తృతంగా ‘చెడు’ అని చెబుతుంది.
