source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: te
  text: విశ్వాసపు సంపూర్ణ నిశ్చయంతోను యథార్థమైన హృదయంతోను దేవుని సమీపిద్దాం[a]; చెడు మనస్సాక్షి నుండి ప్రోక్షణం పొంది శుద్ధి చేయబడిన మన హృదయాలతోను[b], స్వచ్ఛమైన నీటితో కడగబడిన మన శరీరాలతోను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యథార్థమైన హృదయంతో’ అన్నదానికి ‘నిష్కపటమైన హృదయంతో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘చెడు మనస్సాక్షి’ అన్నదానికి కొందరు ‘అపరాధభావంతో నిండిన మనస్సాక్షి’ అని అర్థం చేసుకుంటారు; అయితే గ్రీకు పదం మరింత విస్తృతంగా ‘చెడు’ అని చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడి ప్రోక్షణం, నీటితో కడగడం ఆచార శుద్ధీకరణ భాషను గుర్తుకు తెస్తాయి. కొందరికి ఇది బాప్తిస్మాన్ని కూడా ప్రతిధ్వనింపజేయవచ్చు; అయితే ఈ వాక్యం ఆ కడగడాన్ని స్పష్టంగా బాప్తిస్మమని గుర్తించదు.
    reason: cultural_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: దేవుని సమీపిద్దాం
  rationale: వర్తమానకాల ప్రథమ పురుష బహువచన ప్రేరణార్థక విధిని సహజమైన తెలుగు పిలుపుగా వ్యక్తం చేస్తుంది. హెబ్రీయులకు పత్రికలోని దేవుని సన్నిధికి ప్రవేశించే సందర్భం వల్ల తెలుగులో సహజంగా అవసరమైన ‘దేవుని’ అనే పూరకం చేర్చబడింది.
- source_word: μετὰ ἀληθινῆς καρδίας
  choice: యథార్థమైన హృదయంతో
  rationale: ἀληθινός లోని నిజమైన, అసలైన, కపటంలేని అనే విస్తృత భావాన్ని ‘యథార్థమైన’ నిలుపుతుంది; దానిని కేవలం వ్యక్తిగత నిజాయితీకి పరిమితం చేయదు.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: విశ్వాసం కలిగించే సంపూర్ణ నిశ్చయంతో
  rationale: πληροφορία సూచించే సంపూర్ణ ధైర్యనిశ్చయాన్ని స్పష్టంగా తెలుపుతూ, πίστεως ను విశ్వాసంతో సంబంధింపజేస్తుంది. గ్రీకు సంబంధం ‘విశ్వాసం వల్ల కలిగే’ లేదా ‘విశ్వాసానికి చెందిన’ నిశ్చయంగా వినిపించగలదనే స్వల్ప విస్తృతిని ఈ రూపం కాపాడుతుంది.
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: మన హృదయాలు … ప్రోక్షణం ద్వారా శుద్ధి చేయబడి
  rationale: పూర్తయిన క్రియ ఫలితంగా కొనసాగుతున్న స్థితిని సూచించే perfect passive participle భావాన్ని నిలుపుతుంది. ‘ప్రోక్షణం’ బలార్పణ/ఆచార శుద్ధీకరణ దృశ్యాన్ని కాపాడుతుంది; ‘శుద్ధి’ సందర్భంలో సూచితమైన ఫలితాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: చెడు మనస్సాక్షి నుండి
  rationale: πονηρός ను ‘చెడు’గా నేరుగా అనువదించి, దానిని ‘అపరాధభావంతో నిండిన’ అనే సన్నని మానసిక అర్థానికి పరిమితం చేయదు.
- source_word: λελουσμένοι τὸ σῶμα
  choice: మన శరీరాలు … కడగబడి ఉన్నాయి
  rationale: గ్రీకులో ఏకవచనం బహువచన కర్తలకు పంపిణీ భావంలో ఉంది; తెలుగులో ‘మన శరీరాలు’ సహజం. perfect participle సూచించే పూర్తయి కొనసాగుతున్న స్థితిని ‘కడగబడి ఉన్నాయి’ తెలియజేస్తుంది.
- source_word: ὕδατι καθαρῷ
  choice: స్వచ్ఛమైన నీటితో
  rationale: καθαρός లోని శుభ్రత, పవిత్రత సూచనలను ‘స్వచ్ఛమైన’ సహజంగా అందిస్తుంది; ఆచార శుద్ధీకరణ సందర్భాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: శరీరాన్ని నీటితో కడగడం క్రైస్తవ బాప్తిస్మాన్ని స్పష్టంగా సూచిస్తుందా?
  choice: ప్రధాన వచనంలో శుద్ధీకరణ చిత్రణను మాత్రమే ఉంచి, బాప్తిస్మమని నిర్దిష్టంగా చెప్పలేదు.
  alternative: దీనిని నేరుగా బాప్తిస్మ స్నానంగా అనువదించడం; లేదా పూర్తిగా అంతరంగ రూపకంగా మాత్రమే చూపడం.
  rationale: వాక్యం బలార్పణ, ఆచార శుద్ధీకరణ భాషను ఉపయోగిస్తుంది; అది బాప్తిస్మాన్ని ప్రతిధ్వనింపజేయవచ్చు, కానీ కడగడాన్ని వాక్యమే స్పష్టంగా గుర్తించదు. అందువల్ల మతశాఖాపరమైన నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
- issue: πονηρᾶς ను ‘చెడు’గా లేదా ‘అపరాధభావం గల’గా అనువదించడం
  choice: చెడు మనస్సాక్షి
  alternative: అపరాధభావంతో నిండిన మనస్సాక్షి
  rationale: మూలపదం ‘చెడు’ అనే విస్తృత నైతిక/శుద్ధీకరణ భావాన్ని కలిగి ఉంది; ‘అపరాధభావం’ దానిని ఒక మానసిక అనుభవానికి మాత్రమే పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘ప్రోక్షణం’ కొంత ఆచారపరమైన పదమైనా మూలంలోని బలార్పణ/శుద్ధీకరణ చిత్రణను కాపాడటానికి ఉపయోగించబడింది; వాక్య నిర్మాణం సహజంగా ఉండేందుకు గ్రీకు participles ను స్థితిని తెలిపే ఉపవాక్యాలుగా తీర్చిదిద్దాం.
