revisions:
- from: విశ్వాసం కలిగించే సంపూర్ణ నిశ్చయంతో, యథార్థమైన హృదయంతో దేవుని సమీపిద్దాం[a]. మన హృదయాలు చెడు మనస్సాక్షి నుండి ప్రోక్షణం ద్వారా శుద్ధి చేయబడి[b], మన శరీరాలు స్వచ్ఛమైన నీటితో కడగబడి ఉన్నాయి[c].
  to: విశ్వాసపు సంపూర్ణ నిశ్చయంతోను యథార్థమైన హృదయంతోను దేవుని సమీపిద్దాం[a]; చెడు మనస్సాక్షి నుండి ప్రోక్షణం పొంది శుద్ధి చేయబడిన మన హృదయాలతోను[b], స్వచ్ఛమైన నీటితో కడగబడిన మన శరీరాలతోను[c].
  rationale: A safe correction is needed because the draft reverses the relationship between faith and assurance. The revised text uses “విశ్వాసపు సంపూర్ణ నిశ్చయం” and joins the parallel perfect participial phrases directly to the exhortation. It preserves the source’s ambiguity concerning the ritual imagery and does not make baptism explicit.
