  edition: SBLGNT
  text: φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: te
  text: సజీవుడైన దేవుని చేతుల్లో పడడం భయంకరమైన విషయం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సజీవుడైన దేవుని చేతుల్లో పడడం భయభ్రాంతులకు గురిచేసే విషయం.”
    reason: φοβερὸν అనే పదంలోని తీవ్ర భీతి భావాన్ని మరింత స్పష్టంగా తెలిపే పదప్రయోగ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: φοβερὸν
  choice: భయంకరమైన విషయం
  rationale: φοβερός భయం, దిగులు లేదా భీతిని కలిగించేదాన్ని సూచిస్తుంది. నామవాచకార్థక క్రియారూపంతో కలిసి ఉన్న నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో గంభీరతను నిలుపుతూ ఇలా వ్యక్తపరచవచ్చు.
- source_word: τὸ ἐμπεσεῖν
  choice: పడడం
  rationale: ఆర్టికల్‌తో కూడిన ఏఓరిస్ట్ ఇన్ఫినిటివ్ నామవాచకార్థంగా పనిచేస్తుంది. εἰς‌తో కలిపి ‘చేతుల్లో పడడం’ అనడం, వేరొకరి అధికారానికి లేదా తీర్పుకు లోనయ్యే బలమైన భావాన్ని నిలుపుతుంది.
- source_word: εἰς χεῖρας
  choice: చేతుల్లో
  rationale: ఇది ఒకరి అధికారానికి లేదా తీర్పుకు లోనవడాన్ని సూచించే నుడికారం. ‘చేతులు’ అనే బైబిలు రూపకాన్ని అనువాదంలో నిలుపుకున్నాం.
- source_word: θεοῦ
  choice: దేవుని
  rationale: ‘చేతులు’పై ఆధారపడిన సంబంధ విభక్తి; తెలుగులో ‘దేవుని చేతుల్లో’ అని సహజంగా వస్తుంది.
- source_word: ζῶντος
  choice: సజీవుడైన
  rationale: ఈ వర్తమాన కృదంతం θεοῦను విశేషిస్తుంది. ‘సజీవుడైన దేవుడు’ అనే రూపం దేవుడు నిజంగా జీవిస్తూ క్రియాశీలంగా ఉన్నాడనే బైబిలు భావాన్ని గౌరవప్రదంగా తెలియజేస్తుంది.
theological_decisions:
- issue: హెచ్చరిక వాక్యపు తీవ్రత
  choice: సజీవుడైన దేవుని అధికారానికి, తీర్పుకు లోనవడంలోని భీతిని తెలిపే సాధారణ గంభీర ప్రకటన
  alternative: ఇది కేవలం ఈ లోకంలో కలిగే శిక్షణకు మాత్రమే సంబంధించిన హెచ్చరిక; లేదా తీర్పు భావం లేని అస్తిత్వ ప్రకటన
  rationale: సందర్భంలో ఇది హెచ్చరిక భాగాన్ని ముగిస్తుంది; ‘చేతుల్లో పడడం’ అనే నుడికారం సాధారణంగా న్యాయతీర్పు భావాన్ని కలిగి ఉంటుంది. అయితే గ్రీకులో ‘తీర్పు’ అనే నామవాచకం నేరుగా లేనందున దాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘చేతుల్లో పడడం’ అనే పరిచిత నుడికారాన్ని నిలిపి, మూలంలోని తీర్పు సూచనను వివరణాత్మక పదాలు చేర్చకుండా సంరక్షించాం.
