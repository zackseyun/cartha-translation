source:
  edition: SBLGNT
  text: μὴ ἀποβάλητε οὖν τὴν παρρησίαν ὑμῶν, ἥτις ἔχει ⸂μεγάλην μισθαποδοσίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: te
  text: కాబట్టి, మీ ధైర్యాన్ని[a] పారవేయకండి; దానికి గొప్ప ప్రతిఫలం ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నమ్మకాన్ని.’ గ్రీకు పదం నిర్భయమైన స్వేచ్ఛను లేదా బహిరంగతను సూచించవచ్చు; ముఖ్యంగా దేవుని సమీపించడంలో.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: పారవేయకండి
  rationale: μήతో కూడిన aorist subjunctive నిషేధాన్ని తెలియజేస్తుంది. ἀποβάλλω ఉద్దేశపూర్వకంగా వదిలివేయడం లేదా విసర్జించడం అనే బలమైన భావాన్ని కలిగి ఉంది; ‘పారవేయకండి’ ఆ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న ఉపదేశం, ఉదాహరణల ఆధారంగా వచ్చే నిర్ధారణను సూచిస్తుంది.
- source_word: παρρησίαν ὑμῶν
  choice: మీ ధైర్యవిశ్వాసాన్ని
  rationale: παρρησία దేవుని సమీపించడంలోను విశ్వాసాన్ని బహిరంగంగా నిలుపుకోవడంలోను ఉండే ధైర్యంతో కూడిన నమ్మకాన్ని సూచించగలదు. ‘ధైర్యవిశ్వాసం’ దాని ధైర్యం, నమ్మకం అనే రెండు పార్శ్వాలను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἥτις ἔχει
  choice: దానికి ... ఉంది
  rationale: గ్రీకు సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ధైర్యవిశ్వాసానికీ ప్రతిఫలానికీ మధ్య ఉన్న సంబంధాన్ని మూలపాఠం చెప్పినంతవరకే ఉంచుతుంది.
- source_word: μεγάλην μισθαποδοσίαν
  choice: గొప్ప ప్రతిఫలం
  rationale: μισθαποδοσία recompense లేదా rewardను సూచిస్తుంది. ఇక్కడ సానుకూల భావంలో ‘ప్రతిఫలం’ స్పష్టంగా, గౌరవప్రదంగా ఉంది; μεγάλην యొక్క బలాన్ని ‘గొప్ప’ నిలుపుతుంది.
theological_decisions:
- issue: హెబ్రీయులు 10:35లో παρρησία యొక్క భావం
  choice: ధైర్యవిశ్వాసం
  alternative: ధైర్యం; నమ్మకం; బాహాటత్వం
  rationale: ఈ పదం కేవలం అంతరంగ నిశ్చయానికే పరిమితం కాకుండా దేవుని సమీపించే స్వేచ్ఛను, విశ్వాసంలో ధైర్యంగా నిలిచే వైఖరిని సూచిస్తుంది. ‘ధైర్యవిశ్వాసం’ ఈ విస్తృతిని సంకుచితం చేయకుండా ఉంచుతుంది.
- issue: ἥτις ἔχει μεγάλην μισθαποδοσίανలో ప్రతిఫల సంబంధం
  choice: దానికి గొప్ప ప్రతిఫలం ఉంది
  alternative: అది గొప్ప ప్రతిఫలాన్ని తెస్తుంది
  rationale: ‘తెస్తుంది’ అని అనువదిస్తే కారణాత్మక భావాన్ని మరింత స్పష్టంగా చేర్చినట్లవుతుంది. మూలంలోని సాధారణ ἔχειను అనుసరించి ‘ఉంది’ అని ఉంచడం theological tensionను అతివ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘పారవేయకండి’ మూలంలోని ఉద్దేశపూర్వక విసర్జన రూపకాన్ని నిలుపుతుంది; ‘ధైర్యవిశ్వాసం’ సహజ పఠనీయతతో పాటు παρρησία యొక్క భావవిస్తృతిని కాపాడుతుంది.
