- from: ఆ చిత్తం వల్ల[a], యేసు మెస్సీయ[b] శరీరం ఒక్కసారే అర్పించబడటం ద్వారా మనం పవిత్రపరచబడి ఉన్నాం.
  to: ఆ చిత్తం వల్ల[a], యేసు మెస్సీయ యొక్క శరీరాన్ని ఒక్కసారే అర్పించడం ద్వారా మనం పవిత్రపరచబడి ఉన్నాం.
  rationale: The revision makes the genitive relationship in “the offering of the body of Jesus the Messiah” explicit and natural in Telugu, while retaining the perfect-result nuance (“పవిత్రపరచబడి ఉన్నాం”), the means expressed by διά (“ద్వారా”), and the unrepeatable force of ἐφάπαξ (“ఒక్కసారే”). Footnote anchors and their content are retained unchanged.
