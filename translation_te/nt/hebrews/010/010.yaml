  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: te
  text: ఆ చిత్తం వల్ల[a], యేసు మెస్సీయ యొక్క శరీరాన్ని ఒక్కసారే అర్పించడం ద్వారా మనం పవిత్రపరచబడి ఉన్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘ఆ చిత్తంలో.’ సందర్భంలో ఇప్పుడే ప్రస్తావించిన దేవుని చిత్తమే ఉద్దేశం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: ఆ చిత్తం వల్ల
  rationale: ఈ పదబంధం ముందున్న సందర్భంలో పేర్కొన్న దేవుని చిత్తాన్ని తిరిగి సూచిస్తుంది. ‘వల్ల’ ఇక్కడ సాధనార్థక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థమైన ‘ఏ చిత్తంలోనైతే’ అనే రూపం తెలుగులో అసహజంగా ఉంటుంది.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: మనం పవిత్రపరచబడి ఉన్నాం
  rationale: పర్ఫెక్ట్ కృదంతం, వర్తమాన సహాయక క్రియ కలిసిన గ్రీకు నిర్మాణం గతంలో పూర్తయిన కార్యాన్నీ ప్రస్తుతం కొనసాగుతున్న ఫలితాన్నీ సూచిస్తుంది. ‘పవిత్రపరచబడి ఉన్నాం’ ఆ రెండు కోణాలనూ నిలుపుతుంది.
- source_word: διὰ τῆς προσφορᾶς
  choice: అర్పించబడటం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనాన్ని సూచిస్తుంది. προσφοράకు ‘అర్పణ’ ప్రాథమిక భావం; తెలుగులో మొత్తం వాక్యం సహజంగా ఉండేందుకు దాన్ని క్రియానామక రూపంలో ఇచ్చాం.
- source_word: τοῦ σώματος
  choice: శరీరం
  rationale: మూలంలో శరీరాన్ని స్పష్టంగా పేర్కొనడం వల్ల యేసు చేసిన అర్పణ యొక్క శారీరక వాస్తవికత నిలుస్తుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ అభిషిక్తుడనే బిరుదు భావాన్ని కలిగి ఉంది. అందువల్ల సాధారణ పేరులా లిప్యంతరీకరించకుండా దాని బిరుదు భావాన్ని తెలిపే ‘మెస్సీయ’ను వాడాం.
- source_word: ἐφάπαξ
  choice: ఒక్కసారే
  rationale: ఈ క్రియావిశేషణం అర్పణ ఒక్కసారి జరిగిందనీ అది పునరావృతం కాదనీ బలంగా సూచిస్తుంది. ‘ఒక్కసారే’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: పవిత్రపరచడం యొక్క కాలభావం, కొనసాగుతున్న ఫలితం
  choice: ‘పవిత్రపరచబడి ఉన్నాం’ అని అనువదించడం
  alternative: ‘పవిత్రపరచబడ్డాం’ లేదా ‘పవిత్రపరచబడుతున్నాం’
  rationale: గ్రీకు రూపం పూర్తయిన కార్యానికి ప్రస్తుతం నిలిచివున్న ఫలితం ఉందని సూచిస్తుంది; అది కొనసాగుతున్న ప్రక్రియను తెలిపే వర్తమాన ప్రగతిశీల రూపం కాదు. ఈ అనువాదం ఏ ప్రత్యేక సంప్రదాయ సిద్ధాంతాన్నీ జోడించకుండా వ్యాకరణ భావాన్ని నిలుపుతుంది.
- issue: Χριστός అనే క్రీస్తు సంబంధ బిరుదు
  choice: ‘మెస్సీయ’ అని అనువదించడం
  alternative: ‘క్రీస్తు’
  rationale: ఈ సందర్భంలో Χριστόςను అర్థవంతమైన బిరుదుగా గ్రహించవచ్చు. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని పాఠకునికి స్పష్టంగా ఉంచుతుంది; ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ἐφάπαξ యొక్క నిర్ణాయకత
  choice: ‘ఒక్కసారే’
  alternative: ‘ఒక్కసారిగా’ లేదా ‘ఒక్కసారే, సర్వకాలానికి’
  rationale: మూలపదం అర్పణ యొక్క ఒక్కసారితనాన్ని, పునరావృతం కాని స్వభావాన్ని సూచిస్తుంది. ‘సర్వకాలానికి’ అని విస్తరించడం భావాన్ని వివరించినప్పటికీ మూలంలో లేని పదాలను ప్రధాన పాఠ్యంలో చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘పవిత్రపరచబడి ఉన్నాం’ కొద్దిగా గంభీరమైన నిర్మాణమైనప్పటికీ గ్రీకు పర్ఫెక్ట్ రూపంలోని పూర్తయిన కార్యం–కొనసాగుతున్న ఫలితం అనే ఉద్రిక్తతను స్పష్టంగా నిలుపుతుంది. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
