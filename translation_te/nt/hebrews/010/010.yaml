review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the instrumental/reference sense of ἐν ᾧ θελήματι, the perfect passive force of ἡγιασμένοι ἐσμέν, the means marked by διά, and the definitive force of ἐφάπαξ. However, “యేసు మెస్సీయ శరీరం ఒక్కసారే అర్పించబడటం” leaves the possessive relationship and the genitive construction τοῦ σώματος Ἰησοῦ Χριστοῦ insufficiently explicit in idiomatic Telugu. A clear genitive construction is warranted.
  naturalness: The register is generally modern and suitably formal. “పవిత్రపరచబడి ఉన్నాం” naturally conveys a completed action with a present state. Revising the offering phrase improves clarity and avoids an awkward noun sequence.
  terminology: “చిత్తం,” “పవిత్రపరచబడి,” “అర్పించడం,” and “మెస్సీయ” are appropriate. “మెస్సీయ” preserves the titular sense of Χριστός; the alternative traditional form “క్రీస్తు” is appropriately retained in the footnote.
  issues:
  - severity: medium
    issue: The phrase identifying whose body was offered is unclear and syntactically awkward.
    rationale: The Greek explicitly has “the offering of the body of Jesus Christ.” Telugu “యేసు మెస్సీయ శరీరం” can be parsed, but in this context it is less clear than an explicit genitive, and the passive nominal expression obscures the relation between the body and the offering.
