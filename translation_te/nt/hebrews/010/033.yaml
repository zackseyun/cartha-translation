review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the correlative construction, public reproach and affliction, public exposure, and solidarity with others. The contextual passive sense of τῶν οὕτως ἀναστρεφομένων is also appropriately retained. However, “ప్రవర్తింపబడినవారు” can naturally suggest people who were made to behave in a certain way, rather than people who were treated in a certain way; it should be replaced with explicit Telugu for being dealt with/treated.
  naturalness: Most of the verse is clear modern standard Telugu. “ఒకవైపు ... మరోవైపు” is possible, but “కొన్నిసార్లు ... మరికొన్నిసార్లు” better conveys the distributive force in this context. “ప్రజల ఎదుట ప్రదర్శనగా నిలబెట్టబడ్డారు” is a more idiomatic and vivid rendering of public spectacle than the prior wording.
  terminology: “నిందలు,” “శ్రమలు,” and “భాగస్వాములయ్యారు” suit the register and preserve the sense. “వ్యవహరించబడినవారు” is required to distinguish the main contextual reading (‘treated’) from the conduct-related alternative in the note.
  issues:
  - severity: medium
    issue: The main text uses “అలా ప్రవర్తింపబడినవారితో.”
    rationale: This expression is semantically awkward in Telugu and risks conveying ‘those made to behave that way.’ The Greek participle, in this persecution context, is best rendered explicitly as those ‘treated/dealt with in that way.’
  - severity: low
    issue: The correlative wording can be made more contextually precise.
    rationale: “కొన్నిసార్లు ... మరికొన్నిసార్లు” naturally expresses the two recurring modes of suffering/solidarity intended by τοῦτο μὲν ... τοῦτο δὲ.
  revised_text: కొన్నిసార్లు మీరు నిందలకూ శ్రమలకూ గురై ప్రజల ఎదుట ప్రదర్శనగా నిలబెట్టబడ్డారు[a]; మరికొన్నిసార్లు, అలా వ్యవహరించబడినవారితో భాగస్వాములయ్యారు[b].
