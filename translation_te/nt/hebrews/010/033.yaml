id: HEB.10.33
reference: Hebrews 10:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο μὲν ὀνειδισμοῖς τε καὶ θλίψεσιν θεατριζόμενοι, τοῦτο δὲ κοινωνοὶ τῶν οὕτως ἀναστρεφομένων γενηθέντες·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: te
  text: కొన్నిసార్లు మీరు నిందలకూ శ్రమలకూ గురై ప్రజల ఎదుట ప్రదర్శనగా నిలబెట్టబడ్డారు[a]; మరికొన్నిసార్లు, అలా వ్యవహరించబడినవారితో భాగస్వాములయ్యారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత చిత్రాత్మకంగా, “ప్రజల ఎదుట ఒక ప్రదర్శనగా చేయబడ్డారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆ విధంగా జీవించినవారితో” లేదా “ప్రవర్తించినవారితో భాగస్వాములయ్యారు.” గ్రీకు పదం కొన్ని సందర్భాల్లో జీవన విధానాన్ని లేదా నడవడిని సూచించగలదు; అయితే ఇక్కడి హింసా సందర్భం “అలా వ్యవహరించబడినవారు” అనే అర్థానికి బలం ఇస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: ఒకవైపు ... మరోవైపు
  rationale: ఈ పరస్పర సంబంధ నిర్మాణం పాఠకులు గతంలో సహించిన రెండు విధాల అనుభవాలను సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండడంతోపాటు గ్రీకు వాక్య సమతుల్యతను కూడా ఇది నిలుపుతుంది.
- source_word: ὀνειδισμοῖς
  choice: నిందలు
  rationale: ఈ పదం అవమానపరిచే మాటలు, దూషణలు, తిరస్కారాన్ని సూచిస్తుంది. ‘నిందలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, శత్రుత్వపూరితమైన మాటల ద్వారా కలిగే అవమానాన్ని తెలియజేస్తుంది.
- source_word: θλίψεσιν
  choice: బాధలు
  rationale: ఇది ఒత్తిడి, కష్టాలు, హింసవల్ల కలిగే వేదన వంటి విస్తృత భావాన్ని కలిగి ఉంది. ‘బాధలు’ సందర్భంలోని తీవ్రతను ఉంచుతూ అర్థాన్ని అనవసరంగా ఒకే రకమైన హింసకు పరిమితం చేయదు.
- source_word: θεατριζόμενοι
  choice: బహిరంగంగా అందరి చూపులపాలయ్యారు
  rationale: ఈ క్రియ రంగస్థలంపై ప్రదర్శించినట్లు ప్రజల ఎదుట అవమానానికి గురిచేయడాన్ని చిత్రిస్తుంది. ఎంచుకున్న రూపం బహిరంగ అవమాన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మరింత చిత్రాత్మకమైన పదప్రయోగం పాదసూచికలో ఉంది.
- source_word: κοινωνοὶ
  choice: భాగస్వాములు
  rationale: ఇది కేవలం స్నేహాన్ని కాక, ఇతరుల అనుభవంలో పాలుపంచుకోవడం మరియు వారికి సంఘీభావంగా నిలవడాన్ని సూచిస్తుంది.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: అలా ప్రవర్తింపబడినవారు
  rationale: ἀναστρέφω సాధారణంగా జీవించడం లేదా ప్రవర్తించడాన్ని సూచించగలిగినా, ఇక్కడ మధ్యమ/కర్మణి భావంలో ఇతరులు వారితో వ్యవహరించిన తీరును సూచించడం సాధ్యమే. సమీపంలోని హింసా సందర్భం ఈ అర్థానికి బలం ఇస్తుంది; నిజమైన ప్రత్యామ్నాయ అర్థం పాదసూచికలో ఉంచబడింది.
- source_word: γενηθέντες
  choice: భాగస్వాములయ్యారు
  rationale: ఆ బాధితులతో సంఘీభావంలోకి ప్రవేశించడాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘అయ్యారు’ ఉపయోగించబడింది.
theological_decisions:
- issue: ἀναστρεφομένων అనే పదానికి ఈ సందర్భంలో ఉన్న అర్థం
  choice: అదే విధంగా ప్రవర్తింపబడినవారిని, అంటే హింసకు గురైనవారిని సూచిస్తున్నట్లు అనువదించడం
  alternative: ఆ విధంగా జీవించినవారు లేదా ప్రవర్తించినవారు
  rationale: సమీప సందర్భం నిందలు, బాధలు, హింసించబడినవారితో సంఘీభావం గురించి మాట్లాడుతుంది. అందువల్ల ఇతరులు వారితో వ్యవహరించిన తీరును సూచించే అర్థం సందర్భానికి ఎక్కువగా సరిపోతుంది. అయినప్పటికీ, నడవడి లేదా జీవన విధానాన్ని సూచించే అర్థం గ్రీకులో సాధ్యమైనందున దాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖనానికి తగిన గంభీరతతో అనువదించబడింది. ‘ఒకవైపు ... మరోవైపు’ నిర్మాణం మూలంలోని సమతుల్యతను నిలుపుతుంది. ప్రధాన పాఠ్యంలో సందర్భపరంగా బలమైన అర్థాన్ని ఉంచి, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో స్పష్టంగా సంరక్షించాం.
