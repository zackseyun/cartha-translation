revisions:
- from: ఒకవైపు మీరు నిందలకూ బాధలకూ గురై బహిరంగంగా అందరి చూపులపాలయ్యారు[a]; మరోవైపు, అలా ప్రవర్తింపబడినవారితో భాగస్వాములయ్యారు[b].
  to: కొన్నిసార్లు మీరు నిందలకూ శ్రమలకూ గురై ప్రజల ఎదుట ప్రదర్శనగా నిలబెట్టబడ్డారు[a]; మరికొన్నిసార్లు, అలా వ్యవహరించబడినవారితో భాగస్వాములయ్యారు[b].
