revisions:
- from: మన నిరీక్షణను ఒప్పుకోవడాన్ని చలించకుండా గట్టిగా పట్టుకుందాం[a]; ఎందుకంటే వాగ్దానం చేసినవాడు నమ్మదగినవాడు.
  to: మన నిరీక్షణ గురించిన ఒప్పుకోలును అచంచలంగా నిలుపుకుందాం[a]; ఎందుకంటే వాగ్దానం చేసినవాడు నమ్మకమైనవాడు.
  rationale: The revision restores a noun for ὁμολογίαν (‘confession/profession’) and uses ‘నిలుపుకుందాం’ for the exhortation to retain it firmly. It preserves the supplied communal possessive only as an idiomatic Telugu clarification, with a correctly anchored footnote giving the alternative without it. The promised one remains implicit, as in the Greek.
