  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: te
  text: మన నిరీక్షణ గురించిన ఒప్పుకోలును అచంచలంగా నిలుపుకుందాం[a]; ఎందుకంటే వాగ్దానం చేసినవాడు నమ్మకమైనవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిరీక్షణ గురించిన ఒప్పుకోలును.” గ్రీకు మూలంలో “మన” అనే పదం స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέχωμεν
  choice: గట్టిగా పట్టుకుందాం
  rationale: వర్తమానకాల ప్రథమ పురుష బహువచన హోర్టేటరీ సబ్జంక్టివ్‌ను సమూహానికి ఇచ్చే ప్రోత్సాహక ఆజ్ఞగా సహజంగా వ్యక్తం చేస్తుంది; దృఢంగా కొనసాగించడమనే భావాన్ని నిలుపుతుంది.
- source_word: ὁμολογίαν
  choice: ఒప్పుకోవడాన్ని
  rationale: ఈ సందర్భంలో విశ్వాసం లేదా నిరీక్షణను బహిరంగంగా అంగీకరించి ప్రకటించడాన్ని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండి, కేవలం అంతరంగ నమ్మకానికి పరిమితం కాదు.
- source_word: τῆς ἐλπίδος
  choice: మన నిరీక్షణను
  rationale: గ్రీకులో స్వామ్యసర్వనామం స్పష్టంగా లేకపోయినా, సమూహాన్ని ఉద్దేశించిన ప్రోత్సాహంలో సంబంధాన్ని సహజ తెలుగులో తెలియజేయడానికి ‘మన’ చేర్చబడింది; మూలంలోని సంక్షిప్త రూపం పాదటిప్పణిలో చూపబడింది.
- source_word: ἀκλινῆ
  choice: చలించకుండా
  rationale: అక్షరార్థంగా వంగని లేదా ఒరిగిపోని స్థిరత్వాన్ని సూచించే విశేషణం. ఇక్కడ ఒప్పుకోలు స్థిరంగా ఉండాలనే భావాన్ని తెలుగులో క్రియావిశేషణ రూపంలో సహజంగా అందిస్తుంది.
- source_word: πιστὸς
  choice: నమ్మదగినవాడు
  rationale: వాగ్దానం చేసినవాడు దానిని నెరవేర్చడంలో విశ్వసనీయుడనే తార్కిక సంబంధాన్ని స్పష్టంగా తెలుపుతుంది; ‘నమ్మకమైనవాడు’ కూడా సాధ్యమే గాని, ఇది సాధారణ ఆధునిక తెలుగులో మరింత సహజం.
- source_word: ὁ ἐπαγγειλάμενος
  choice: వాగ్దానం చేసినవాడు
  rationale: నామవాచకంగా పనిచేసే ఆర్టికల్‌తో కూడిన ఏఒరిస్ట్ మధ్యమ కృదంతాన్ని సహజంగా ప్రతిబింబిస్తుంది; దేవుడు అనే సూచ్యాన్ని మూలంలాగే పరోక్షంగా ఉంచుతుంది.
theological_decisions:
- issue: ‘వాగ్దానం చేసినవాడు’ అనే పదబంధం సూచించే వ్యక్తి
  choice: సందర్భంలో దేవుడని అర్థమైనా, మూలంలాగే పేరును స్పష్టంగా చేర్చలేదు.
  alternative: ‘వాగ్దానం చేసిన దేవుడు’ అని అనువదించడం.
  rationale: గ్రీకు వాక్యం సూచ్యాన్ని ప్రత్యక్షంగా పేర్కొనదు. దేవుడనే సందర్భార్థాన్ని నిలుపుతూ, మూలంలోని పరోక్షతను గౌరవించడం అనవసర వ్యాఖ్యాన విస్తరణను నివారిస్తుంది.
- issue: τῆς ἐλπίδος వద్ద స్వామ్యసర్వనామం
  choice: సహజ తెలుగు కోసం ‘మన నిరీక్షణ’ అని అనువదించి, మూలంలో ‘మన’ స్పష్టంగా లేదని పాదటిప్పణిలో తెలిపింది.
  alternative: ‘నిరీక్షణను ఒప్పుకోవడం’ అని స్వామ్యసర్వనామం లేకుండా అనువదించడం.
  rationale: సమూహాన్ని ఉద్దేశించిన ‘పట్టుకుందాం’ అనే ప్రోత్సాహంతో ‘మన’ సహజంగా సరిపోతుంది; అయితే గ్రీకు రూపంలోని నిజమైన సంక్షిప్తతను పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సమూహ ప్రోత్సాహక శైలి. ‘చలించకుండా’ మూలంలోని స్థిరత్వ రూపకాన్ని నిలుపుతుంది; ‘నమ్మదగినవాడు’ వాగ్దాన నెరవేర్పుపై ఉన్న ఆధారాన్ని సహజంగా తెలియజేస్తుంది.
