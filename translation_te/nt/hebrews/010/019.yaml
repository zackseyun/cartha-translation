  text: Ἔχοντες οὖν, ἀδελφοί, παρρησίαν εἰς τὴν εἴσοδον τῶν ἁγίων ἐν τῷ αἵματι Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: te
  text: కాబట్టి, సహోదరులారా,[a] యేసు రక్తం ద్వారా పరిశుద్ధ స్థలాల్లోకి[b] ప్రవేశించడానికి మనకు ధైర్యం ఉన్నందున,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహోదర సహోదరీలారా’; గ్రీకు మూలంలో ‘సహోదరులారా’ అని ఉంది. ఈ సంబోధన సంఘమంతటినీ ప్రాతినిధ్యంగా ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరిశుద్ధ మందిరంలోకి’; హెబ్రీయులకు పత్రికలోని గుడార సంబంధమైన చిత్రణ నేపథ్యంలో ఈ పదబంధం దేవుని పరిశుద్ధ సన్నిధి స్థలాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: మనకు ఉంది గనుక
  rationale: గ్రీకులో ఇది ‘కలిగివుండి’ అనే కృదంత రూపం. తరువాత వచ్చే ప్రబోధానికి ఇది ఆధారాన్ని తెలియజేస్తున్నందున, ఆధునిక తెలుగులో సహజమైన కారణార్థక నిర్మాణంగా అనువదించాం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదన నుండి వచ్చే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పురుష బహువచన సంబోధనను గౌరవప్రదంగా, సహజమైన తెలుగులో నిలుపుతుంది; ఇది సంఘమంతటినీ ఉద్దేశించి ఉండవచ్చని పాదసూచికలో తెలిపాం.
- source_word: παρρησίαν
  choice: ధైర్యం
  rationale: దేవుని సన్నిధిలోకి సంకోచం లేకుండా, నమ్మకంతో ప్రవేశించగల స్థితిని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: εἰς τὴν εἴσοδον
  choice: ప్రవేశించే
  rationale: ‘ప్రవేశం కోసం’ అనే నామవాచక నిర్మాణాన్ని తెలుగులో సహజమైన క్రియారూపంగా వ్యక్తం చేస్తూ ప్రవేశాధికార భావాన్ని నిలుపుతుంది.
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధ స్థలాల్లోకి
  rationale: హెబ్రీయులకు పత్రికలోని గుడారపు ఆరాధన నేపథ్యానికి అనుగుణంగా దేవుని పరిశుద్ధ సన్నిధి స్థలాలను సూచిస్తుంది; ‘అతిపరిశుద్ధ స్థలం’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: యేసు రక్తం ద్వారా
  rationale: ప్రవేశానికి సాధనం లేదా ఆధారం యేసు బలియర్పణ రక్తమేనని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: τῶν ἁγίων యొక్క పరిధి
  choice: దేవుని సన్నిధికి సంబంధించిన పరిశుద్ధ స్థలాలు
  alternative: పరిశుద్ధ మందిరం; అతిపరిశుద్ధ స్థలం; పరిశుద్ధులు
  rationale: ఈ పత్రికలో కొనసాగుతున్న గుడారపు ఆరాధన చిత్రణ spatial/cultic అర్థాన్ని బలపరుస్తుంది. అయితే గ్రీకు పదబంధం అనుమతించేదానికంటే అర్థాన్ని ‘అతిపరిశుద్ధ స్థలం’కే పరిమితం చేయలేదు.
- issue: ἀδελφοί యొక్క ప్రాతినిధ్య ప్రయోగం
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’ అని ఉంచి, సంఘమంతటినీ సూచించే అవకాశం పాదసూచికలో వివరించడం
  alternative: సహోదర సహోదరీలారా; తోటి విశ్వాసులారా
  rationale: మూలంలోని పురుష బహువచన సంబోధనను నిలుపుతూ, దాని సాధ్యమైన సమగ్ర సంఘార్థాన్ని పాఠకునికి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గౌరవప్రదమైన బైబిలు శైలిలో రూపొందించాం. వాక్యం తరువాతి వచనాల్లో కొనసాగుతున్నందున చివర కామాను నిలిపాం.
