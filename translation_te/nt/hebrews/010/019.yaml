    issue: Awkward placement of the causal clause
    rationale: The draft’s ‘... ధైర్యం మనకు ఉంది గనుక’ is grammatically possible, but ‘మనకు ... ధైర్యం ఉన్నందున’ is more idiomatic and makes the participial/circumstantial basis clearer without changing meaning.
  - severity: low
    issue: Footnote wording for the tabernacle imagery
    rationale: ‘గుడారపు ఆరాధన చిత్రణ’ is understandable, but ‘గుడార సంబంధమైన చిత్రణ’ is more natural Telugu and more directly describes the literary imagery in Hebrews.
