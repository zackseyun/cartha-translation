id: HEB.10.12
reference: Hebrews 10:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: te
  text: కానీ ఈయన[a] పాపాల కోసం శాశ్వతకాలానికి ఒకే బలిని అర్పించి, దేవుని కుడివైపున కూర్చున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈయన పాపాల కోసం ఒకే బలిని అర్పించి, శాశ్వతంగా దేవుని కుడివైపున కూర్చున్నాడు.” గ్రీకులో “శాశ్వతకాలానికి” అనే పదబంధాన్ని కూర్చోవడంతో అనుసంధానించవచ్చు; అయితే ఈ సందర్భంలో అది ఒక్క బలి యొక్క శాశ్వత చెల్లుబాటును నొక్కిచెప్పడం మరింత సహజం.
    reason: alternative_reading
  - marker: b
    text: “దేవుని కుడివైపున” అనే మాట కీర్తన 110:1ను ప్రతిధ్వనిస్తుంది; హెబ్రీయులకు రాసిన పత్రికలో మెస్సీయుని ఉన్నతస్థానాన్ని వివరించడానికి అది కీలకమైన వాక్యం.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: ఈయన
  rationale: ముందటి వచనంలోని పదేపదే బలులు అర్పించే యాజకులతో ఉన్న వ్యత్యాసాన్ని గౌరవపూర్వకమైన తెలుగు నిర్దేశక సర్వనామంతో స్పష్టంగా నిలుపుతుంది.
- source_word: δὲ
  choice: కానీ
  rationale: మునుపటి యాజకుల నిరంతర నిలబడటానికీ ఈయన ఒక్క బలి అర్పించి కూర్చోవడానికీ మధ్య వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: μίαν ... θυσίαν
  choice: ఒకే బలిని
  rationale: అనేకసార్లు అర్పించిన బలులకు విరుద్ధంగా ఈ బలి ఒక్కటే అనే గ్రీకు నొక్కిచెప్పే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: పాపాల కోసం
  rationale: బలి యొక్క ఉద్దేశాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు; గ్రీకులోని బహువచనాన్ని కూడా నిలుపుతుంది.
- source_word: προσενέγκας
  choice: అర్పించి
  rationale: ప్రధాన క్రియకు ముందుగా పూర్తయిన చర్యను తెలుగు సంయోజక క్రియ సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὸ διηνεκές
  choice: శాశ్వతంగా
  rationale: అంతరాయం లేక కొనసాగే లేదా శాశ్వతంగా చెల్లే భావాన్ని సంక్షిప్తంగా ఇస్తుంది; వాక్యనిర్మాణ సంబంధంలోని నిజమైన సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: ἐκάθισεν
  choice: కూర్చున్నాడు
  rationale: పూర్తయిన ప్రధాన చర్యను నేరుగా తెలుపుతూ, ముందటి వచనంలోని నిలబడే యాజకులతో వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: దేవుని కుడివైపున
  rationale: కీర్తన 110:1ను ప్రతిధ్వనించే ఉన్నతస్థాన సూత్రాన్ని తెలుగులో స్పష్టంగా, సంప్రదాయబద్ధంగా అందిస్తుంది.
theological_decisions:
- issue: εἰς τὸ διηνεκές దేనితో అనుసంధానించాలి?
  choice: ప్రధాన పాఠంలో ‘శాశ్వతంగా’ అనే పదాన్ని ‘కూర్చున్నాడు’కు సమీపంగా ఉంచడం
  alternative: ‘పాపాల కోసం శాశ్వతంగా చెల్లే ఒకే బలిని అర్పించి’ అని బలి యొక్క శాశ్వత ప్రభావంతో మరింత స్పష్టంగా అనుసంధానించడం
  rationale: గ్రీకు పదక్రమంలో ఈ పదబంధం అర్పణకూ కూర్చోవడానికీ మధ్య ఉండటం వల్ల రెండింటితో అనుసంధానం సాధ్యమే. ప్రధాన పాఠం గ్రీకు క్రమాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చి బలి యొక్క శాశ్వత సమర్థత అనే సందర్భోచిత భావాన్ని కోల్పోకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవపూర్వకమైన ‘ఈయన’ వాడకం సందర్భంలోని వ్యత్యాసాన్ని నిలుపుతుంది. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా సంక్షిప్తంగా ఉంచబడింది; గ్రీకు వాక్యనిర్మాణంలోని సందిగ్ధత పాదసూచికలో సంరక్షించబడింది.
