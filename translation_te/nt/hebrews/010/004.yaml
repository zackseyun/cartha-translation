id: HEB.10.4
reference: Hebrews 10:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: te
  text: ఎందుకంటే ఎద్దులూ మేకపోతుల రక్తం పాపాలను తొలగించడం అసాధ్యం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పాపాలను తీసివేయడం.’ గ్రీకు క్రియకు తొలగించడం లేదా తీసివేయడం అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: అసాధ్యం
  rationale: క్రియార్థక నామరూపమైన ‘తొలగించడం’తో కలిసి గ్రీకు వాక్యంలోని నిరపేక్షమైన అసాధ్యతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న వాదనకు ఈ వాక్యం కారణాత్మక వివరణ ఇస్తున్నందున ఈ అనుసంధానం ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: αἷμα
  choice: రక్తం
  rationale: బలి సందర్భంలో రచయిత స్పష్టంగా పేర్కొన్న ‘రక్తం’ అనే భావాన్ని ‘బలి’ వంటి వివరణాత్మక పదంతో మార్చకుండా నిలుపుతుంది.
- source_word: ταύρων
  choice: ఎద్దుల
  rationale: జనిటివ్ బహువచనాన్ని సహజమైన తెలుగు సంబంధరూపంలో తెలియజేస్తుంది.
- source_word: τράγων
  choice: మేకపోతుల
  rationale: τράγος ప్రత్యేకంగా మగ మేకను సూచిస్తుంది; ‘మేకపోతులు’ ఆ వివరాన్ని తెలుగులో సహజంగా, ఖచ్చితంగా నిలుపుతుంది.
- source_word: ἀφαιρεῖν
  choice: తొలగించడం
  rationale: పాపాలను తీసివేయడం లేదా దూరం చేయడం అనే గ్రీకు క్రియ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; దాని సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἁμαρτίας
  choice: పాపాలను
  rationale: గ్రీకులోని బహువచన కర్మరూపాన్ని నిలుపుతూ, అమూర్త ఏకవచనంగా మార్చకుండా ఉంచుతుంది.
theological_decisions:
- issue: హెబ్రీయులకు పత్రికలో జంతుబలుల ప్రభావ స్వభావం
  choice: జంతువుల రక్తం పాపాలను తొలగించడం అసాధ్యమని వాక్యం నేరుగా చెప్పే భావాన్నే ఉంచడం
  alternative: అవి పాపాలను తాత్కాలికంగా కప్పాయి లేదా కేవలం ఆచారపరమైన శుద్ధిని కలిగించాయి అని ప్రధాన పాఠ్యంలో వివరించడం
  rationale: గ్రీకు పాఠ్యం ఆ వివరణలను ఈ వాక్యంలో స్వయంగా ఇవ్వదు. అందువల్ల విస్తృత సందర్భంలోని ధార్మిక ఉద్వేగాన్ని పరిష్కరించకుండా, రచయిత చేసిన నిరపేక్ష ప్రకటనను మాత్రమే అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. గ్రీకులో ఒక్కసారి వచ్చిన ‘రక్తం’ తెలుగులో రెండు సమాంతర సంబంధపదాలతో కొంత అస్పష్టంగా వినిపించే అవకాశాన్ని నివారించడానికి పునరుక్తి చేయబడింది; భావం మారలేదు.
