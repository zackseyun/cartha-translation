id: HEB.10.2
reference: Hebrews 10:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: te
  text: అలా కాకపోతే, అవి అర్పించబడడం ఆగిపోయేది కాదా? ఎందుకంటే, ఒక్కసారి శుద్ధి చేయబడిన ఆరాధకులకు ఇక పాపాల గురించిన స్పృహ[a] ఏదీ ఉండేది కాదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పాపాల గురించిన మనస్సాక్షి.’ గ్రీకు పదం మనస్సాక్షి, అవగాహన లేదా స్పృహను సూచించగలదు; ఇక్కడ దేవుని ఎదుట కొనసాగుతున్న పాపభారం లేదా అపరాధభావన ఉద్దేశించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఒక్కసారే శుద్ధి చేయబడిన.’ ‘ఒక్కసారి’ అనే పదం ఈ సందర్భంలో నిర్ణయాత్మకమైన, పునరావృతం కాని శుద్ధిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: అలా కాకపోతే
  rationale: ముందటి వచనంలోని వాదనకు విరుద్ధమైన ఊహాత్మక పరిణామాన్ని పరిచయం చేస్తుంది; తెలుగులో తార్కిక అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: అవి అర్పించబడడం ఆగిపోయేది కాదా?
  rationale: οὐκ ἄν తో కూడిన భూతకాల క్రియ విరుద్ధవాస్తవిక అలంకారప్రశ్నను సూచిస్తుంది; προσφερόμεναι బలులు అర్పించబడడాన్ని సూచిస్తుంది.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: ఎందుకంటే ... ఇక ... ఏదీ ఉండేది కాదు
  rationale: διά తో కూడిన articular infinitive కారణాన్ని తెలియజేస్తుంది; ἔτι ఇక్కడ శుద్ధి తరువాత ఇక కొనసాగని స్థితిని సూచిస్తుంది.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: పాపాల గురించిన స్పృహ
  rationale: συνείδησις కు మనస్సాక్షి, అవగాహన, స్పృహ అనే భావపరిధి ఉంది. ఇక్కడ నైతిక వివేచన పూర్తిగా లేకపోవడం కాక, దేవుని ఎదుట పాపభారం కొనసాగుతున్న స్పృహ ప్రధానంగా ఉద్దేశించబడింది.
- source_word: τοὺς λατρεύοντας
  choice: ఆరాధించేవారు
  rationale: ఆరాధనలో పాల్గొనేవారిని సూచించే substantival participle యొక్క క్రియాత్మక భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἅπαξ
  choice: ఒక్కసారి
  rationale: పదం ప్రాథమికంగా ‘ఒక్కసారి’ అని అర్థమిస్తుంది; సందర్భంలో నిర్ణయాత్మకమైన, పునరావృతం కాని భావం ఉండవచ్చు గాని దానిని ప్రధాన పాఠ్యంలో అతిగా స్పష్టీకరించలేదు.
- source_word: κεκαθαρισμένους
  choice: శుద్ధి చేయబడిన తరువాత
  rationale: perfect passive participle పూర్తయిన శుద్ధి మరియు దాని కొనసాగుతున్న ఫలితాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘తరువాత’ ఆ సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: శుద్ధి పొందిన ఆరాధకులకు συνείδησιν ἁμαρτιῶν లేకపోవడం అంటే ఏమిటి?
  choice: ‘పాపాల గురించిన స్పృహ’ అని అనువదించి, కొనసాగుతున్న పాపభారం లేదా అపరాధ అవగాహనను సూచించడం
  alternative: ‘పాపాల విషయమైన మనస్సాక్షి’
  rationale: వాదన ప్రకారం ప్రభావవంతమైన శుద్ధి పునరావృత బలులను అవసరం లేకుండా చేస్తుంది. ఈ రూపం నైతిక మనస్సాక్షి లేదా పాపాన్ని గుర్తించే సామర్థ్యం పూర్తిగా నశిస్తుందని సూచించకుండా, మూలంలోని భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆరాధన మరియు బలి సందర్భానికి తగిన గౌరవభరిత శైలి. గ్రీకు విరుద్ధవాస్తవిక అలంకారప్రశ్నను నిలిపి, συνείδησις మరియు ἅπαξ పదాల నిజమైన భావసంభావ్యతలను పాదటిప్పణుల్లో ఉంచింది.
