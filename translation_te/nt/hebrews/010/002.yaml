revisions:
- from: అలా కాకపోతే, అవి అర్పించబడడం ఆగిపోయేది కాదా? ఎందుకంటే ఆరాధించేవారు ఒక్కసారి[b] శుద్ధి చేయబడిన తరువాత, వారికి ఇక పాపాల గురించిన స్పృహ[a] ఏదీ ఉండేది కాదు.
  to: అలా కాకపోతే, అవి అర్పించబడడం ఆగిపోయేది కాదా? ఎందుకంటే, ఒక్కసారి శుద్ధి చేయబడిన ఆరాధకులకు ఇక పాపాల గురించిన స్పృహ[a] ఏదీ ఉండేది కాదు.[b]
  rationale: The revision retains the Greek argument and ambiguity while making the cleansed worshipers, rather than merely a subsequent time, the grammatical focus. It also corrects the footnote so that its alternative reflects the contextual force of ἅπαξ without attributing the perfect participle’s abiding-result nuance to that adverb alone.
