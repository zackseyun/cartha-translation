translation:
  language: te
  text: పూర్తిగా దహనం చేయబడే బలులలోనూ, పాపం కోసం అర్పించే బలులలోనూ నీవు సంతోషించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దహనబలులలోనూ, పాపం కోసం అర్పించే బలులలోనూ.’ గ్రీకులోని περὶ ἁμαρτίας అనే పదబంధం బలుల సందర్భంలో పాపం కోసం అర్పించే బలిని సూచించే పారిభాషిక ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: పూర్తిగా దహనం చేసే బలులు
  rationale: ఈ పదం అగ్నిలో పూర్తిగా దహనం చేయబడే బలులను సూచిస్తుంది. సాధారణ పాఠకునికి అర్థమయ్యేలా బలి యొక్క ప్రత్యేక స్వభావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: లోనూ … లోనూ
  rationale: రెండు బలి వర్గాలను సమానంగా కలుపుతున్న సాధారణ సంధానాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: περὶ ἁμαρτίας
  choice: పాపపరిహార బలులు
  rationale: బలుల సందర్భంలో ఇది పాపం నిమిత్తం అర్పించే బలిని సూచించే పారిభాషిక ప్రయోగం. ‘పాపపరిహార బలులు’ ఆ బలి వర్గాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ
  choice: లేదు
  rationale: క్రియను నిషేధిస్తూ గ్రీకు వాక్యంలోని నిరాకరణను పూర్తిగా నిలుపుతుంది.
- source_word: εὐδόκησας
  choice: నీవు సంతోషించలేదు
  rationale: దేవునికి ఏకవచనంలో నేరుగా సంబోధనను నిలుపుతూ, εὐδοκέω పదంలోని ప్రసన్నత లేదా ఇష్టాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కీర్తన 40:6 గ్రీకు పాఠం నుండి తీసుకున్న ఉల్లేఖనంలో బలులకు సంబంధించిన నిర్దిష్ట పదజాలం
  choice: ‘పూర్తిగా దహనం చేసే బలులు’, ‘పాపపరిహార బలులు’ అనే రెండు ప్రత్యేక బలి వర్గాలను స్పష్టంగా ఉంచడం
  alternative: వాటిని సాధారణంగా ‘బలులు’ అని మాత్రమే అనువదించడం లేదా ‘పాపం కోసం అర్పించే బలులు’ అని విస్తరించడం
  rationale: హెబ్రీయులకు పత్రికలోని వాదన నిర్దిష్టమైన బలి వర్గాలను ప్రస్తావిస్తుంది. అందువల్ల వాటిని సాధారణీకరించకుండా ఉంచడం మూలపాఠంలోని ఆరాధనా నేపథ్యాన్నీ, theological tensionనీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే శైలి. సంప్రదాయ ‘దహనబలి’ భావాన్ని వివరణాత్మకంగా ‘పూర్తిగా దహనం చేసే బలి’ అని ప్రధాన పాఠంలో స్పష్టం చేశాం.
