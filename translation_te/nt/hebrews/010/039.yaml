  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: te
  text: కాని మనం నాశనానికి వెనుకంజ వేసేవారిలోనివాళ్లం కాదు[a]; ప్రాణ సంరక్షణకు[c][d] దారితీసే విశ్వాసం గలవారిలోనివాళ్లం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెనక్కి తగ్గేవారిలోనివాళ్లం కాదు.” గ్రీకు పదం వెనుదిరగడం లేదా ఉపసంహరించుకోవడం అని సూచించవచ్చు; కొందరు ఇక్కడ దాన్ని విశ్వాసాన్ని పూర్తిగా విడిచిపెట్టడమనే బలమైన అర్థంలో గ్రహిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “విశ్వాసపాత్రంగా నిలిచేవారిలోనివాళ్లం.” ఇక్కడ “విశ్వాసం” అనే గ్రీకు పదంలో నమ్మకంగా, పట్టుదలతో కొనసాగడం అనే భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా, “ప్రాణాన్ని పొందడానికి” లేదా “ప్రాణాన్ని స్వాధీనపరచుకోవడానికి.” గ్రీకు పదబంధం సంరక్షణను మాత్రమే కాక, పొందడం లేదా స్వాధీనపరచుకోవడం అనే భావాన్ని కూడా సూచించవచ్చు. “ప్రాణం” అంటే ఇక్కడ వ్యక్తి జీవం లేదా సంపూర్ణ స్వరూపం కావచ్చు.
    reason: lexical_alternative
  - marker: d
    text: పదశః భావానికి దగ్గరగా, “ప్రాణ సంరక్షణకు” అని కూడా అనువదించవచ్చు.
    reason: formal_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: కాని మనం
  rationale: ἡμεῖς అనే స్పష్టమైన సర్వనామంలోని ఉద్ఘాటనను నిలుపుతూ, δὲ ముందున్న హెచ్చరికకు చూపే వ్యతిరేకతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἐσμὲν ὑποστολῆς
  choice: వెనుకంజ వేసేవారిలోనివాళ్లం కాదు
  rationale: గ్రీకు షష్ఠీ విభక్తి వర్గానికి చెందడాన్ని సూచిస్తుంది. పదశః నామరూపాన్ని బలవంతంగా ఉంచకుండా, భయంతో వెనక్కి తగ్గడం లేదా ఉపసంహరించుకోవడం అనే అర్థాన్ని సహజమైన తెలుగులో ఇస్తుంది; ‘విశ్వాసభ్రష్టత’ అని మరీ నిర్దిష్టం చేయదు.
- source_word: εἰς ἀπώλειαν
  choice: నాశనానికి
  rationale: εἰς సూచించే అంతిమ ఫలితాన్ని సంక్షిప్తంగా తెలియజేస్తుంది. ἀπώλεια యొక్క తీవ్రమైన భావాన్ని ‘నాశనం’ స్పష్టంగా మోస్తుంది.
- source_word: ἀλλὰ πίστεως
  choice: విశ్వాసం ఉంచేవారిలోనివాళ్లం
  rationale: మొదటి వర్గానికి సమాంతరంగా రెండో వర్గాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. πίστις‌ను ప్రధాన పాఠ్యంలో ‘విశ్వాసం’గా ఉంచి, దానిలో ఉండగల విశ్వాసపాత్రమైన స్థిరత్వపు ఛాయను పాదసూచికలో తెలియజేస్తుంది.
- source_word: εἰς περιποίησιν
  choice: కాపాడుకోవడానికి
  rationale: నాశనానికి వ్యతిరేకంగా నిలిచే సంరక్షణ భావాన్ని సందర్భానుసారంగా అందిస్తుంది. గ్రీకు పదానికి ‘పొందడం/సంపాదించడం’ అనే సాధ్యమైన భావం కూడా ఉన్నందున దానిని పాదసూచికలో నిలుపుతుంది.
- source_word: ψυχῆς
  choice: ప్రాణాన్ని
  rationale: ఇక్కడ ψυχή కేవలం శరీరానికి భిన్నమైన ‘ఆత్మ’ను కాక, వ్యక్తి ప్రాణం లేదా సంపూర్ణ స్వరూపాన్ని సూచించగలదు. ఆధునిక తెలుగులో ‘ప్రాణం’ ఆ విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ὑποστολή యొక్క తీవ్రత
  choice: వెనుకంజ వేయడం
  alternative: విశ్వాసాన్ని పూర్తిగా విడిచిపెట్టడం
  rationale: పదం వెనక్కి తగ్గడం లేదా ఉపసంహరించుకోవడాన్ని సూచిస్తుంది. ఈ సందర్భంలో అది విశ్వాసభ్రష్టతవరకు వెళ్లవచ్చని కొందరు గ్రహించినా, ప్రధాన పాఠ్యం ఆ బలమైన వ్యాఖ్యానాన్ని పదంలోకి చేర్చదు.
- issue: πίστις యొక్క భావం
  choice: విశ్వాసం
  alternative: విశ్వాసపాత్రత / నమ్మకంగా నిలకడగా ఉండడం
  rationale: వెనుకంజ వేయడానికి వ్యతిరేకమైన నమ్మకపు వైఖరిని ‘విశ్వాసం’ నేరుగా వ్యక్తం చేస్తుంది. ప్రబోధాత్మక సందర్భం నిలకడైన విశ్వాసపాత్రతను కూడా సూచించవచ్చు; ఆ ఉద్రిక్తతను పాదసూచికలో ఉంచింది.
- issue: περιποίησις ψυχῆς యొక్క భావం
  choice: ప్రాణాన్ని కాపాడుకోవడం
  alternative: ప్రాణాన్ని పొందడం / తన స్వరూపాన్ని సంపాదించుకోవడం
  rationale: వాక్యంలోని ‘నాశనం’తో ఉన్న ప్రత్యక్ష వ్యతిరేకత సంరక్షణ భావానికి మద్దతిస్తుంది. అయితే περιποίησις పదంలోని పొందడం లేదా స్వాధీనపరచుకోవడం అనే నిజమైన అర్థసాధ్యతను తొలగించకుండా పాదసూచికలో పేర్కొంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. గ్రీకులోని రెండు షష్ఠీ వర్గాల వ్యతిరేకతను ‘వారిలోనివాళ్లం’ అనే సమాంతర నిర్మాణంతో నిలిపింది. ‘ఆత్మ’ అనే సన్నని ద్వైతార్థాన్ని తప్పించి ψυχήకు సందర్భోచితంగా ‘ప్రాణం’ ఎంచుకుంది.
