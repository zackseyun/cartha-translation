  rationale: The revision keeps the Greek’s balanced contrast—retreat leading to destruction versus faith directed toward preservation—while avoiding the self-preserving implication of “కాపాడుకోవడానికి.” It retains all footnote anchors and preserves the lexical ambiguity of ὑποστολή, πίστις, περιποίησις, and ψυχή without resolving disputed interpretive questions in the main text.
