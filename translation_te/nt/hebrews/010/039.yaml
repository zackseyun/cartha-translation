review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the emphatic contrast between two groups, the non-specific sense of ὑποστολή as retreat/shrinking back, and the grave outcome of ἀπώλεια. However, “ప్రాణాన్ని కాపాడుకోవడానికి” can imply that people preserve their own lives and shifts the Greek’s ‘faith unto preservation’ relationship. A revision should retain the directional/resultative relation without adding that reflexive agency.
  naturalness: “వెనుకంజ వేసేవారిలోనివాళ్లం కాదు” is understandable and suitably parallel with the second clause. The revised second clause is more idiomatic and makes the connection between faith and preservation clear without the somewhat awkward “విశ్వాసం ఉంచేవారిలోనివాళ్లం.”
  terminology: “విశ్వాసం” appropriately renders πίστις, while the footnote preserves the possible nuance of persevering faithfulness. “ప్రాణం” is a suitable broad rendering of ψυχή here; its possible reference to life/self rather than a narrowly disembodied soul is retained in the note. “ప్రాణ సంరక్షణ” appropriately reflects περιποίησις in its contextual contrast with destruction.
  issues:
  - severity: medium
    issue: The phrase “ప్రాణాన్ని కాపాడుకోవడానికి” is reflexive and potentially self-agentive.
    rationale: περιποίησις ψυχῆς follows πίστεως and expresses the outcome/end associated with faith. The Greek does not explicitly say that people themselves preserve their own lives/souls. “ప్రాణ సంరక్షణకు దారితీసే” retains the directional relation and avoids importing reflexive agency.
  - severity: low
    issue: “విశ్వాసం ఉంచేవారిలోనివాళ్లం” is less natural than a construction directly identifying the group by its faith.
    rationale: “విశ్వాసం గలవారిలోనివాళ్లం” is idiomatic modern Telugu and preserves the Greek categorizing genitive without adding a stronger interpretive claim.
  revised_text: కాని మనం నాశనానికి వెనుకంజ వేసేవారిలోనివాళ్లం కాదు[a]; ప్రాణ సంరక్షణకు[c][d] దారితీసే విశ్వాసం గలవారిలోనివాళ్లం[b].
