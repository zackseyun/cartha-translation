revisions:
- from: కాని మనం నాశనానికి వెనుకంజ వేసేవారిలోనివాళ్లం కాదు[a]; ప్రాణాన్ని కాపాడుకోవడానికి[c][d] విశ్వాసం ఉంచేవారిలోనివాళ్లం[b].
