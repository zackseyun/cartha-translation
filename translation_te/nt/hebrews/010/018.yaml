translation:
  language: te
  text: వీటి[a] క్షమాపణ ఉన్నచోట, పాపం కోసం అర్పణ ఇక ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వీటి విమోచనం.’ ‘వీటి’ అనేది ముందటి వచనంలో చెప్పబడిన పాపాలను, అక్రమ కార్యాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: ఉన్నచోట
  rationale: ఇది స్థలాన్ని మాత్రమే కాక, క్షమాపణ ఉన్న పరిస్థితిని లేదా పరిధిని సూచిస్తుంది; తెలుగులో ‘ఉన్నచోట’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్పమైన కొనసాగింపు లేదా నిర్ధారణను సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో అదనపు సంధిపదం లేకుండానే ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది; బలమైన వ్యతిరేకార్థాన్ని చేర్చలేదు.
- source_word: ἄφεσις
  choice: క్షమాపణ
  rationale: పాపాలను తొలగించడం లేదా మన్నించడం అనే భావాన్ని ఆధునిక సాధారణ తెలుగులో స్పష్టంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: τούτων
  choice: వీటికి
  rationale: మునుపటి వచనంలోని పాపాలు, అక్రమ క్రియలను సూచించే గ్రీకు సూచనాత్మక సర్వనామంలోని ఉద్దేశపూర్వక సంక్షిప్తతను నిలుపుతుంది.
- source_word: οὐκέτι
  choice: ఇక ఉండదు
  rationale: మునుపటి అవసరం లేదా ఆచరణ ఇక కొనసాగదనే ముగింపు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: προσφορὰ
  choice: అర్పణ
  rationale: బలి సంబంధమైన సాధారణ పదాన్ని నిలుపుతూ, గ్రీకు పదాన్ని ‘బలి’ అని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: περὶ ἁμαρτίας
  choice: పాపం కోసం
  rationale: బలి సందర్భంలోని ‘పాపం నిమిత్తం/పాపం కోసం’ అనే భావాన్ని నిలుపుతుంది; దీనిని తప్పనిసరిగా ‘పాపపరిహార బలి’గా విస్తరించి వ్యాఖ్యానించదు.
theological_decisions:
- issue: క్రీస్తు అర్పణ యొక్క అంతిమతకు సంబంధించిన సూచన
  choice: క్షమాపణ ఉన్నచోట పాపం కోసం మరొక అర్పణ ఇక ఉండదని వచనం చెబుతున్నట్లే అనువదించబడింది.
  alternative: అన్ని రకాల అర్పణలు పూర్తిగా రద్దయ్యాయని విస్తరించడం; లేదా ఇది కేవలం లేవీయ ఆచారాలకే పరిమితమని అనువాదంలోనే నిర్ధారించడం.
  rationale: సమీప సందర్భం పునరావృత బలులను క్రీస్తు ఒక్కసారిగా చేసిన ప్రభావవంతమైన అర్పణతో పోలుస్తుంది. అయితే ఈ వచనం చెప్పిన పరిధిని మించి అనువాదం సిద్ధాంతపరమైన వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని τούτων అనే సూచనను ‘వీటికి’గా నిలుపుతూ, దాని సూచ్యాన్ని వచనంలో విస్తరించలేదు.
