base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/024.yaml
  text: and let us consider one another[a], to stir up love and good works,
translation:
  language: te
  text: ప్రేమను, మంచి కార్యాలను పురికొల్పేలా[a] మనం ఒకరినొకరం శ్రద్ధగా పరిగణిద్దాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలంగా ప్రేరేపించేలా” లేదా “రెచ్చగొట్టేలా.” గ్రీకు నామవాచకం παροξυσμός బలమైన ప్రేరణను లేదా రెచ్చగొట్టడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: మనం ... శ్రద్ధగా ఆలోచిద్దాం
  rationale: వర్తమానకాల ప్రథమ పురుష బహువచన సుబ్జంక్టివ్ ఇక్కడ సమూహాన్ని ఉద్దేశించిన ప్రోత్సాహక ఆజ్ఞగా ఉంది. ‘శ్రద్ధగా ఆలోచిద్దాం’ అనేది ఇతరులపై దృష్టిపెట్టి జాగ్రత్తగా పరిగణించాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀλλήλους
  choice: ఒకరి గురించి ఒకరం
  rationale: పరస్పర సంబంధాన్ని స్పష్టంగా తెలిపే సహజమైన తెలుగు ప్రయోగం; ఆలోచనకు సమాజంలోని ఇతరులే లక్ష్యమని నిలుపుతుంది.
- source_word: εἰς
  choice: -డానికి
  rationale: తదుపరి నామపదబంధం సూచించే ఉద్దేశం లేదా ఫలితాన్ని తెలుగులో ప్రయోజనార్థక క్రియారూపంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παροξυσμὸν
  choice: పురికొల్పడానికి
  rationale: ఈ నామవాచకంలో బలంగా ప్రేరేపించడం లేదా చురుకుగా కదిలించడం అనే భావం ఉంది. సందర్భంలో లక్ష్యాలు సానుకూలమైనవి కాబట్టి ‘పురికొల్పడం’ దాని బలాన్ని నిలుపుతూ అనవసరమైన ప్రతికూల భావాన్ని నివారిస్తుంది.
- source_word: ἀγάπης
  choice: ప్రేమకూ
  rationale: ἀγάπηకు ఆధునిక ప్రామాణిక తెలుగు సమానార్థం ‘ప్రేమ’; ఇక్కడ ఉద్దేశం వైపు దిశను తెలిపేందుకు దత్తివిభక్తి వాడబడింది.
- source_word: καλῶν ἔργων
  choice: మంచి కార్యాలకూ
  rationale: విశేషణం-నామవాచక కలయికను నేరుగా నిలుపుతుంది. ‘కార్యాలు’ అనేది ἔργωνతో ఉన్న పదసంబంధాన్ని కాపాడుతుంది; ఏ ప్రత్యేక పుణ్యసిద్ధాంతాన్నీ చేర్చదు.
- source_word: καὶ
  choice: కూ ... కూ / మరియు భావం
  rationale: వాక్యాన్ని ముందటి సందర్భంతో అనుసంధానించే మొదటి καί తెలుగు వాక్యప్రవాహంలో అంతర్లీనంగా ఉంది; ప్రేమను, మంచి కార్యాలను కలిపే రెండవ καί సముచ్చయార్థక ‘కూ ... కూ’ నిర్మాణంలో వ్యక్తమైంది.
theological_decisions:
- issue: παροξυσμός పదంలోని ప్రతికూలంగా వినిపించగల భావఛాయ
  choice: ప్రధాన పాఠంలో ‘పురికొల్పడానికి’
  alternative: ‘బలంగా ప్రేరేపించడానికి’ లేదా ‘రెచ్చగొట్టడానికి’
  rationale: గ్రీకు పదం తీవ్రమైన ప్రేరణను, కొన్నిసార్లు ప్రతికూలమైన రెచ్చగొట్టడాన్ని కూడా సూచించగలదు. అయితే ఇక్కడ దాని లక్ష్యాలు ప్రేమ, మంచి కార్యాలు. అందువల్ల సానుకూల సందర్భాన్ని గౌరవిస్తూ పదంలోని బలాన్ని ‘పురికొల్పడం’ నిలుపుతుంది; ఇతర సాధ్యమైన భావఛాయలను పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సమూహాన్ని ఉద్దేశించిన ప్రోత్సాహక స్వరం, గౌరవప్రదమైన సరళత, మరియు మూలంలోని పరస్పర బాధ్యత నిలుపబడ్డాయి.
