  text: and a great priest over the house of God[b][a],
translation:
  language: te
  text: మరియు దేవుని ఇంటికి అధిపతిగా ఉన్న గొప్ప యాజకుడు మనకు ఉన్నాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గొప్ప యాజకుడు’ అనే పదబంధాన్ని ‘ప్రధాన యాజకుడు’ అని కూడా అనువదించవచ్చు. హెబ్రీయులకు రాసిన పత్రిక యేసును తరచుగా ప్రధాన యాజకుడిగా చూపిస్తుంది; అయితే ఇక్కడ గ్రీకు మూలంలో అక్షరార్థంగా ‘గొప్ప యాజకుడు’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: ‘దేవుని ఇల్లు’ అనే మాట దేవుని ఇంటివారిని, అంటే ఆయన ప్రజలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: మరియు / సందర్భానుసారంగా వాక్య అనుసంధానం
  rationale: ఇది ముందున్న వాక్యభాగంతో ఈ అంశాన్ని కలిపే సముచ్చయ అవ్యయం. తెలుగు వాక్యప్రవాహంలో ‘మనకు ఉన్నాడు’ అనే నిర్మాణంతో అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
- source_word: ἱερέα
  choice: యాజకుడు
  rationale: ἱερεύς సాధారణంగా ‘యాజకుడు’ అని అర్థం; ఇక్కడ ‘ప్రధాన యాజకుడు’ అనే సాంకేతిక పదమైన ἀρχιερεύς లేదు.
- source_word: μέγαν
  choice: గొప్ప
  rationale: యాజకుని గొప్పతనాన్ని లేదా విశిష్టతను సూచిస్తుంది; దీనిని ‘ప్రధాన’గా మార్చకుండా గ్రీకు పదబంధంలోని భేదాన్ని నిలుపుతుంది.
- source_word: ἐπὶ
  choice: మీద
  rationale: దేవుని ఇంటిపై అధికారం లేదా పర్యవేక్షణ అనే భావాన్ని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: τὸν οἶκον
  choice: ఇంటిని / ఇంటిమీద
  rationale: οἶκος అనే పదంలోని ‘ఇల్లు’ మరియు ‘ఇంటి ప్రజలు, కుటుంబం’ అనే రెండు భావాలనూ ‘ఇల్లు’ రూపకం నిలుపుతుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: ఆ ఇల్లు దేవునికి చెందినదని తెలిపే సహజమైన తెలుగు షష్ఠీ విభక్తి రూపం.
theological_decisions:
- issue: ἱερέα μέγαν అనే పదబంధాన్ని ‘ప్రధాన యాజకుడు’ అనే సాంకేతిక బిరుదుగా అనువదించాలా?
  choice: గొప్ప యాజకుడు
  alternative: ప్రధాన యాజకుడు
  rationale: హెబ్రీయులకు రాసిన పత్రికలో యేసు ప్రధాన యాజకుడిగా స్పష్టంగా వర్ణించబడినప్పటికీ, ఈ వచనంలో ἀρχιερεύς కాకుండా ἱερεύς + μέγας ఉన్నాయి. అందువల్ల మూలంలోని ప్రత్యేక పదప్రయోగాన్ని కాపాడుతూ ‘గొప్ప యాజకుడు’ అని అనువదించాం.
- issue: ‘దేవుని ఇల్లు’ భవనాన్నా లేక దేవుని ప్రజలనూ సూచిస్తుందా?
  choice: దేవుని ఇల్లు అనే రూపకాన్ని నిలుపడం
  alternative: దేవుని కుటుంబం / దేవుని ప్రజలు
  rationale: οἶκος పదానికి ఇల్లు, ఇంటివారు అనే రెండు భావాలు ఉండగలవు; హెబ్రీయులు 3:2–6 నేపథ్యంతో సమాజార్థం వినిపిస్తుంది. ప్రధాన పాఠ్యంలో రూపకాన్ని ఉంచి, అర్థ విస్తృతిని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త పదబంధం ముందరి వచనాలపై వ్యాకరణపరంగా ఆధారపడుతుంది; ఒంటరి వచనంగా స్పష్టంగా చదవడానికి ‘మనకు ఉన్నాడు’ చేర్చబడింది. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
