  text: ⸀καὶ τῶν ἁμαρτιῶν αὐτῶν καὶ τῶν ἀνομιῶν αὐτῶν οὐ μὴ ⸀μνησθήσομαι ἔτι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/017.yaml
  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: te
  text: మరియు వారి పాపాలను, వారి అక్రమ కార్యాలను ఇకపై ఎన్నడూ జ్ఞాపకం చేసుకోను[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుసారంగా: ‘మరియు వారి పాపాలను, వారి అక్రమ కార్యాలను ఇకపై ఎంతమాత్రమూ జ్ఞాపకం చేసుకోను.’'
    reason: lexical_alternative
  - marker: b
    text: ‘అక్రమ కార్యాలు’ గ్రీకు ἀνομίαιను అనువదిస్తుంది; దీనిని ‘ధర్మవిరుద్ధ కార్యాలు’ లేదా సాంప్రదాయికంగా ‘అధర్మాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (తెలుగులో ప్రత్యేకంగా అనువదించలేదు)
  rationale: ఈ వాక్యం ముందున్న ఉల్లేఖనంతో కొనసాగుతున్నప్పటికీ, ఒంటరి వచనంగా సహజమైన తెలుగులో ప్రారంభ ‘మరియు’ అవసరం లేదు; రెండు కర్మపదాల మధ్యనున్న καὶ మాత్రం ‘వారి’ అనే పదాన్ని పునరుక్తి చేసి కామాతో సమన్వయించబడింది.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: వారి పాపాలను
  rationale: ἁμαρτίαι యొక్క సాధారణ, నేరుగా అర్థమయ్యే బహువచన రూపాన్ని నిలుపుతుంది.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: వారి అక్రమ కార్యాలను
  rationale: ἀνομίαιలోని ధర్మవిరుద్ధత భావాన్నీ, ఇక్కడి బహువచన కార్యాల భావాన్నీ ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐ μὴ μνησθήσομαι
  choice: ఎన్నటికీ జ్ఞాపకం చేసుకోను
  rationale: οὐ μή అనే బలమైన నిరాకరణను ‘ఎన్నటికీ ... చేసుకోను’ అని వ్యక్తం చేస్తూ, ‘జ్ఞాపకం చేసుకోవడం’ అనే బైబిలీయ రూపకాన్ని పరాభాష చేయకుండా నిలుపుతుంది.
- source_word: ἔτι
  choice: ఇక
  rationale: ‘ఇకపై/ఇక ఎంతమాత్రమూ’ అనే కాలసంబంధ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; బలమైన నిరాకరణతో కలిసి ‘ఇక ఎన్నటికీ’ అవుతుంది.
theological_decisions:
- issue: దేవుడు పాపాలను జ్ఞాపకం చేసుకోకపోవడం
  choice: ‘ఇక ఎన్నటికీ జ్ఞాపకం చేసుకోను’ అని నేరుగా అనువదించడం
  alternative: ‘ఇక వాటిని వారి మీద మోపను’ అని భావార్థంగా చెప్పడం
  rationale: మూలంలోని జ్ఞాపకానికి సంబంధించిన ఒడంబడిక భాషను నిలుపుతుంది. దీన్ని దేవుడు జ్ఞానాన్ని కోల్పోవడమని గానీ, కేవలం శిక్షించకపోవడమని గానీ అనువాదంలోనే నిర్ణయించకుండా అసలు వాక్యంలోని ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. బలమైన గ్రీకు నిరాకరణను సహజమైన ‘ఇక ఎన్నటికీ’ ద్వారా వ్యక్తం చేసి, ‘జ్ఞాపకం చేసుకోను’ అనే మూల రూపకాన్ని నిలిపింది.
