id: HEB.10.1
reference: Hebrews 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: te
  text: ధర్మశాస్త్రం రాబోయే మేలుల నీడను కలిగి ఉంది గాని, ఆ సంగతుల నిజమైన ప్రతిరూపాన్ని కలిగి లేదు. కాబట్టి, ప్రతి సంవత్సరం వారు అర్పిస్తూనే ఉండే అవే బలుల ద్వారా అది సమీపించేవారిని ఎన్నటికీ పరిపూర్ణులుగా చేయజాలదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σκιὰν
  choice: నీడను
  rationale: ‘నీడ’ అనే ప్రత్యక్ష రూపకాన్ని నిలుపుతూ, తరువాత వచ్చే ‘యథార్థ రూపం’తో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: రాబోయే మేలుల
  rationale: భవిష్యత్తులో రానున్న మంచి సంగతులు లేదా ఆశీర్వాదాలు అనే భావాన్ని కాలాన్ని మరీ నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: ఆ వాస్తవాల యథార్థ రూపాన్ని కలిగి లేదు
  rationale: εἰκώνకు ‘రూపం/ప్రతిరూపం’ అనే అర్థ పరిధి ఉంది; αὐτήν ఇచ్చే ఉద్ఘాటనను ‘యథార్థ’తో చూపిస్తూ, నీడకు ఎదురుగా పూర్తి రూపాన్ని సూచిస్తుంది.
- source_word: κατ’ ἐνιαυτὸν
  choice: ఏటేటా
  rationale: ప్రతి సంవత్సరం పునరావృతమయ్యే బలుల చక్రాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: నిరంతరం అర్పించే అవే బలుల ద్వారా
  rationale: అవే బలులు కొనసాగుతూ అర్పించబడుతున్నాయనే భావాన్ని, కర్తను అనవసరంగా నిర్దిష్టం చేయకుండా తెలుగులో సహజంగా అందిస్తుంది.
- source_word: τοὺς προσερχομένους
  choice: సమీపించేవారిని
  rationale: హెబ్రీయులకు పత్రికలో దేవుని ఆరాధనలో ఆయన దగ్గరకు రావడం అనే ఆచార సంబంధ భావాన్ని నిలుపుతుంది; ‘దేవుని’ని మూలపాఠ్యంలో లేనందున ప్రధాన వాక్యంలో చేర్చలేదు.
- source_word: τελειῶσαι
  choice: పరిపూర్ణులుగా చేయజాలదు
  rationale: హెబ్రీయులకు పత్రికలో లక్ష్యస్థితికి చేర్చడం, దేవుని సమక్షానికి సంపూర్ణ ప్రవేశం కల్పించడం అనే కీలక భావాన్ని నిలుపుతుంది; కేవలం నైతిక పాపరాహిత్యంగా పరిమితం చేయదు.
theological_decisions:
- issue: ధర్మశాస్త్రంలోని నీడకు, రాబోయే వాస్తవాల రూపానికి మధ్య సంబంధం
  choice: ధర్మశాస్త్రం రాబోయే మేలుల నీడను కలిగి ఉంది గాని వాటి యథార్థ రూపాన్ని కలిగి లేదని అనువదించడం
  alternative: ధర్మశాస్త్రం భవిష్యత్తు మేలులకు సంకేతాత్మక ప్రతిరూపమని అనువదించడం
  rationale: మూలపాఠ్యం σκιάను εἰκώνతో స్పష్టంగా వ్యతిరేకిస్తుంది. ఈ అనువాదం ధర్మశాస్త్రం ముందుగా సూచించే పాత్రను నిలుపుతూ, దానినే తుది వాస్తవంగా చేయదు.
- issue: బలులు సమీపించేవారిని τελειῶσαι చేయలేకపోవడం
  choice: ‘పరిపూర్ణులుగా చేయజాలదు’
  alternative: ‘సంపూర్ణ స్థితికి చేర్చజాలదు’
  rationale: ‘పరిపూర్ణులు’ అనే పదం పత్రికలోని కీలక పదసంబంధాన్ని కాపాడుతుంది; పాదసూచిక దాని అర్థం కేవలం నైతిక లోపరాహిత్యం కాదని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ధర్మశాస్త్రం,’ ‘బలులు,’ ‘పరిపూర్ణులు’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సహజమైన రెండు వాక్యాలుగా విభజించాం. మూలపాఠ్యంలో స్పష్టంగా లేని బలులు అర్పించేవారి కర్తను ప్రధాన పాఠ్యంలో చేర్చలేదు.
