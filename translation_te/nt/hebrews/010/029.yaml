id: HEB.10.29
reference: Hebrews 10:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: te
  text: దేవుని కుమారుణ్ణి కాళ్లతో తొక్కి, తాను పవిత్రపరచబడిన నిబంధన రక్తాన్ని సామాన్యమైనదిగా[a][b] భావించి, కృప యొక్క ఆత్మను అవమానించిన[c] వ్యక్తి ఎంత మరింత తీవ్రమైన శిక్షకు పాత్రుడవుతాడని మీరు అనుకుంటున్నారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అపవిత్రమైనదిగా’ లేదా ‘పవిత్రమైనది కానిదిగా.’
    reason: lexical_alternative
  - marker: b
    text: ‘తాను పవిత్రపరచబడిన’ అనే ఉపవాక్యం గ్రీకు వాక్యనిర్మాణంలో ఇక్కడ వర్ణించబడుతున్న వ్యక్తితో సహజంగా అనుసంధానమవుతుంది. అయితే కొందరు దీని సూచ్యాన్ని వేరుగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘తీవ్రంగా ధిక్కరించిన.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ … χείρονος
  choice: ఇంకెంత తీవ్రమైన
  rationale: తులనాత్మక భావంతో కూడిన గ్రీకు అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀξιωθήσεται τιμωρίας
  choice: శిక్షకు పాత్రుడని తీర్పు పొందుతాడు
  rationale: ‘పాత్రుడిగా ఎంచబడతాడు’ అనే కర్మణి, న్యాయనిర్ణయ భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: καταπατήσας
  choice: కాళ్ల కింద తొక్కి
  rationale: ధిక్కారాన్ని సూచించే మూలంలోని బలమైన దృశ్యరూపకాన్ని నిలుపుతుంది.
- source_word: κοινὸν ἡγησάμενος
  choice: సామాన్యమైనదిగా ఎంచి
  rationale: పవిత్రమైనదానికి విరుద్ధంగా ‘సాధారణమైనది/ప్రత్యేకత లేనిది’ అనే ప్రాథమిక భావాన్ని కాపాడుతుంది; అపవిత్రమైనదిగా అనే సందర్భార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: αἷμα τῆς διαθήκης
  choice: నిబంధన రక్తం
  rationale: నిబంధనకు సంబంధించిన బలి-రక్త భావాన్ని సంక్షిప్తంగా, బైబిలు పదజాలానికి తగిన విధంగా నిలుపుతుంది.
- source_word: ἐν ᾧ ἡγιάσθη
  choice: తాను పవిత్రపరచబడిన
  rationale: రక్తం సాధనంగా ఉన్న భావాన్ని సహజమైన తెలుగు సంబంధవాక్యంలో వ్యక్తం చేస్తూ, కర్తను వాక్యంలోని అపరాధితో అనుసంధానించే సాధారణ గ్రీకు పఠనాన్ని అనుసరిస్తుంది.
- source_word: τὸ πνεῦμα τῆς χάριτος
  choice: కృపను అనుగ్రహించే ఆత్మ
  rationale: ‘కృపకు సంబంధించిన ఆత్మ’ అనే సంబంధాన్ని తెలుగులో అర్థవంతంగా వ్యక్తం చేస్తుంది; కృపకు మూలమై దానిని ప్రసాదించే భావం సందర్భానికి సరిపోతుంది.
- source_word: ἐνυβρίσας
  choice: అవమానించిన
  rationale: అహంకారపూర్వకమైన దూషణ, ధిక్కారం కలిగిన చర్యను సాధారణ పాఠకుడికి స్పష్టమైన పదంతో అందిస్తుంది.
theological_decisions:
- issue: ἐν ᾧ ἡγιάσθη లో పవిత్రపరచబడిన వ్యక్తి ఎవరు?
  choice: ప్రధాన వాక్యనిర్మాణాన్ని అనుసరించి అపరాధినే ‘తాను పవిత్రపరచబడిన’ వ్యక్తిగా అనువదించడం
  alternative: పవిత్రపరచబడిన వ్యక్తిని క్రీస్తుగా లేదా మరొక సూచ్యంగా అర్థం చేసుకోవడం
  rationale: పాల్గుణ క్రియలతో వర్ణించబడుతున్న ఏకవచన వ్యక్తే సహజమైన అంతర్లీన కర్త. అయితే భ్రష్టత్వం, నిలకడ వంటి సిద్ధాంత వివాదాలను అనువాదం ద్వారా ముందుగానే పరిష్కరించకుండా ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో గుర్తించింది.
- issue: κοινός యొక్క పవిత్రత-అపవిత్రత వ్యత్యాసం
  choice: సామాన్యమైనది
  alternative: అపవిత్రమైనది లేదా పవిత్ర వినియోగానికి వేరుచేయబడనిది
  rationale: మూలపదపు ప్రాథమిక వ్యత్యాసాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో సాధ్యమైన ఆచారపరమైన భావాన్ని పాదసూచికలో అందించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన హెచ్చరిక స్వరాన్ని నిలుపుతూ సాధారణ పాఠకుడికి అర్థమయ్యే పదజాలం వాడబడింది. ‘నిబంధన,’ ‘పవిత్రపరచబడిన,’ ‘కృప’ వంటి స్థిరమైన బైబిలు పదాలు కొనసాగించబడ్డాయి.
