id: HEB.10.7
reference: Hebrews 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: te
  text: 'అప్పుడు నేను ఇలా అన్నాను: “ఇదిగో, నేను వచ్చాను—గ్రంథపు చుట్టలో నా గురించి వ్రాయబడి ఉంది—దేవా, నీ చిత్తాన్ని చేయడానికి.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “గ్రంథపు చుట్ట” అంటే ఆధునికంగా కట్టిన పుస్తకం కాదు; చుట్టి ఉంచే ప్రాచీన వ్రాతగ్రంథం.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε εἶπον
  choice: అప్పుడు నేను ఇలా అన్నాను
  rationale: కాలక్రమాన్ని సూచించే τότεను ‘అప్పుడు’గా, ఉద్ధరణను సహజంగా పరిచయం చేసే εἶπονను ‘నేను ఇలా అన్నాను’గా అనువదించాం.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే గంభీరమైన శాస్త్రోక్త బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἥκω
  choice: నేను వచ్చాను
  rationale: రాక పూర్తై దాని ఫలితం ప్రస్తుతం కొనసాగుతున్న భావాన్ని ἥκω ఇక్కడ వ్యక్తం చేస్తుంది.
- source_word: ἐν κεφαλίδι βιβλίου
  choice: గ్రంథపు చుట్టలో
  rationale: κεφαλίς ఇక్కడ ఆధునిక పుస్తకంలోని శీర్షికను కాక, వ్రాతగ్రంథపు చుట్టను సూచిస్తుంది; ‘గ్రంథపు చుట్ట’ ఆ చారిత్రక రూపాన్ని స్పష్టం చేస్తుంది.
- source_word: γέγραπται περὶ ἐμοῦ
  choice: నా గురించి వ్రాయబడి ఉంది
  rationale: పరిపూర్ణ కర్మణి రూపం వ్రాయబడినది ఇప్పటికీ నిలిచి ఉందనే భావాన్ని ఇస్తుంది; περί + సంబంధ విభక్తిని సహజంగా ‘గురించి’గా ఇచ్చాం.
- source_word: τοῦ ποιῆσαι
  choice: నెరవేర్చడానికి
  rationale: ఇక్కడ ఉద్దేశాన్ని తెలిపే infinitive; దేవుని చిత్తాన్ని కార్యరూపంలో చేయడాన్ని సహజ తెలుగులో ‘నెరవేర్చడానికి’ వ్యక్తం చేస్తుంది.
- source_word: ὁ θεός
  choice: దేవా
  rationale: రూపంలో nominative అయినప్పటికీ ఇది ప్రత్యక్ష సంబోధన; తెలుగు సంబోధన రూపం దానిని స్పష్టంగా చూపుతుంది.
- source_word: τὸ θέλημά σου
  choice: నీ చిత్తాన్ని
  rationale: θέλημα యొక్క సంకల్పం/ఇష్టం అనే దైవశాస్త్రీయ భావాన్ని ‘చిత్తం’ సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
theological_decisions:
- issue: హెబ్రీయులకు పత్రికలో కీర్తన ఉద్ధరణకు ఉన్న మెస్సీయ సంబంధమైన అన్వయం
  choice: వక్తను ప్రధాన వచనంలో అదనంగా ‘మెస్సీయ’ లేదా ‘క్రీస్తు’ అని గుర్తించకుండా ప్రథమ పురుష ప్రకటనగానే అనువదించడం
  alternative: ప్రధాన వచనంలోనే వక్తను మెస్సీయగా స్పష్టంగా పేర్కొనడం
  rationale: సందర్భం ఈ మాటలను కుమారునికి/క్రీస్తుకు అన్వయిస్తుంది; అయితే ఈ వాక్యపు పదాలు స్వయంగా ప్రథమ పురుష ప్రకటనగానే ఉన్నాయి. సందర్భం చేసే క్రీస్తు సంబంధ అన్వయాన్ని అనువాదంలో అదనంగా చేర్చకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే శాస్త్రోక్త గంభీరతను నిలుపుతూ ‘ఇదిగో,’ ‘దేవా,’ ‘చిత్తం’ వంటి రూపాలు ఉపయోగించాం. ప్రధాన వచనంలోని [a] గుర్తు సంబంధిత పాదటీకతో సరిపోలుతుంది.
