revisions:
- from: 'అప్పుడు నేను ఇలా అన్నాను: “ఇదిగో, నేను వచ్చాను—గ్రంథపు చుట్టలో నా గురించి వ్రాయబడి ఉంది—దేవా, నీ చిత్తాన్ని నెరవేర్చడానికి.”[a]'
  to: 'అప్పుడు నేను ఇలా అన్నాను: “ఇదిగో, నేను వచ్చాను—గ్రంథపు చుట్టలో నా గురించి వ్రాయబడి ఉంది—దేవా, నీ చిత్తాన్ని చేయడానికి.”[a]'
  rationale: The revision replaces a potentially stronger interpretive verb with the direct equivalent ‘చేయడానికి’ for ποιῆσαι. It also refines the footnote’s modern Telugu phrasing while retaining its explanation that κεφαλίς denotes a scroll/roll rather than a bound modern book. No christological identification is added to the quoted first-person speech.
