- from: 'అప్పుడు ఆయన ఇలా అన్నాడు: “ఇదిగో, నీ చిత్తాన్ని నెరవేర్చడానికి నేను వచ్చాను.” మొదటిదాన్ని తొలగించి, రెండవదాన్ని స్థాపించడానికి ఆయన అలా అన్నాడు.[a]'
  to: 'అప్పుడు ఆయన ఇలా అన్నాడు: “ఇదిగో, నీ చిత్తాన్ని నెరవేర్చడానికి నేను వచ్చాను.” ఆయన మొదటిదాన్ని తొలగిస్తాడు, రెండవదాన్ని స్థాపించడానికి.[a]'
  rationale: సవరణ గ్రీకు ప్రధాన క్రియ ἀναιρεῖను స్వతంత్ర వాక్యంగా పునరుద్ధరిస్తుంది; ἵνα + ఉపసర్గ క్రియ ద్వారా వ్యక్తమైన ఉద్దేశాన్ని ‘రెండవదాన్ని స్థాపించడానికి’ అని నిలుపుతుంది. తద్వారా వచనార్థం మారకుండా, ముసాయిదాలో ఏర్పడిన వ్యాకరణపరమైన అర్థవిపరిణామం తొలగించబడింది. పాదసూచికను అసలైన వ్యాఖ్యాత్మక సహాయంగా మార్చి, తప్పుగా సూచించిన ప్రత్యామ్నాయ పఠనాన్ని తొలగించాం.
