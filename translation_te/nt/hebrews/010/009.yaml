id: HEB.10.9
reference: Hebrews 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: te
  text: 'అప్పుడు ఆయన ఇలా అన్నాడు: “ఇదిగో, నీ చిత్తాన్ని నెరవేర్చడానికి నేను వచ్చాను.” ఆయన మొదటిదాన్ని తొలగిస్తాడు, రెండవదాన్ని స్థాపించడానికి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “మొదటిది,” “రెండవది” అనేవి సందర్భంలో బలులు, అర్పణలకు సంబంధించిన మొదటి ఏర్పాటును మరియు దేవుని చిత్తం నెరవేరడాన్ని సూచించవచ్చు. మూలపాఠ్యం వాటిని మరింత స్పష్టంగా నిర్వచించదు.
    reason: ‘మొదటిది/రెండవది’ అనే సంక్షిప్త సూచనల సందర్భానుసారమైన సంభావ్య అర్థాన్ని వివరిస్తూ, ప్రధాన పాఠ్యంలోని అనిశ్చితిని కాపాడుతుంది.
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: ముందున్న ఉల్లేఖనంతో ఈ మాటను క్రమానుసారంగా కలిపే సహజమైన తెలుగు రూపం.
- source_word: εἴρηκεν
  choice: ఆయన ఇలా అన్నాడు
  rationale: గ్రీకు పరిపూర్ణ కాలానికి గతంలో పలికిన మాటకు కొనసాగుతున్న ప్రాముఖ్యత ఉంది; తెలుగులో సహజమైన కథనరూపం ద్వారా దాన్ని సందర్భమే తెలియజేస్తుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: ప్రకటనను ప్రత్యేకంగా ముందుకు తెచ్చే, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే రూపం.
- source_word: ἥκω
  choice: నేను వచ్చాను
  rationale: వచ్చి ఇప్పుడు ఉన్నాననే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τοῦ ποιῆσαι
  choice: నెరవేర్చడానికి
  rationale: ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది; దేవుని చిత్తాన్ని కార్యరూపంలో పెట్టడమనే సందర్భార్థానికి సహజంగా సరిపోతుంది.
- source_word: τὸ θέλημά σου
  choice: నీ చిత్తాన్ని
  rationale: దేవుని సంకల్పం లేదా ఇష్టాన్ని సూచించే స్థిరమైన, గంభీరమైన తెలుగు పదప్రయోగం.
- source_word: ἀναιρεῖ
  choice: తొలగించి
  rationale: మొదటిదాన్ని పక్కన పెట్టడం లేదా తీసివేయడం అనే సందర్భార్థాన్ని, ‘రద్దు చేయడం’ వంటి అధిక వ్యాఖ్యానాన్ని చేర్చకుండా తెలియజేస్తుంది.
- source_word: τὸ πρῶτον
  choice: మొదటిదాన్ని
  rationale: గ్రీకు మూలంలోని సంక్షిప్త, నామవాచకంగా వాడిన విశేషణాన్ని అలాగే ఉంచి, దాని సూచనను సందర్భానికి వదిలేస్తుంది.
- source_word: ἵνα
  choice: స్థాపించడానికి
  rationale: తొలగించడంలోని ఉద్దేశాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: τὸ δεύτερον
  choice: రెండవదాన్ని
  rationale: ‘మొదటిది’తో ఉన్న సమాంతర విరుద్ధతను కాపాడుతూ, సూచనను అనవసరంగా విస్తరించదు.
- source_word: στήσῃ
  choice: స్థాపించడానికి
  rationale: ఏర్పాటు చేయడం లేదా అమలులో నిలపడం అనే భావానికి సరైన, సందర్భోచిత తెలుగు రూపం.
theological_decisions:
- issue: ‘మొదటిది’, ‘రెండవది’ అనే పదాల సూచన
  choice: ప్రధాన పాఠ్యంలో గ్రీకు మూలంలాగే ‘మొదటిది’, ‘రెండవది’ అని సంక్షిప్తంగా ఉంచడం.
  alternative: వాటిని మొదటి బలి వ్యవస్థ మరియు మెస్సీయ అర్పణలో నెరవేరిన దేవుని చిత్తం అని పాఠ్యంలోనే విస్తరించడం; లేదా పాత నిబంధన, కొత్త నిబంధన అని పేర్కొనడం.
  rationale: హెబ్రీయులు 10:8–10 సందర్భం బలులు, అర్పణలు మరియు దేవుని చిత్తం చేయడాన్ని పరస్పరం పోలుస్తుంది. అయినా మూలపాఠ్యం సూచనను పూర్తిగా విప్పి చెప్పదు; అందుచేత వ్యాఖ్యానాన్ని పాదసూచికకు పరిమితం చేసి వేదాంతపరమైన ఉద్వేగాన్ని కాపాడాం.
- issue: చివరి క్రియకు కర్త
  choice: ‘ఆయన అలా అన్నాడు’ అని εἴρηκεν‌ను ప్రధాన క్రియగా తీసుకుని, ‘తొలగించి… స్థాపించడానికి’ అనే ఉద్దేశ సంబంధాన్ని చూపడం.
  alternative: ‘ఆయన మొదటిదాన్ని తొలగించి రెండవదాన్ని స్థాపిస్తాడు’ అని ἀναιρεῖ‌ను స్వతంత్ర ప్రధాన వాక్యంగా అనువదించడం.
  rationale: 'గ్రీకు వాక్యనిర్మాణంలో ἀναιρεῖ‌ను εἴρηκεν‌కు సంబంధించిన వ్యాఖ్యాత్మక క్రియగా గ్రహించడం సాధ్యం: ఆయన మొదటిదాన్ని తొలగించి రెండవదాన్ని స్థాపించే ఉద్దేశంతో అలా అన్నాడు. మరో సాధారణ పఠనాన్ని పాదసూచికలో నిలిపాం.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘ఇదిగో’, ‘చిత్తం’, ‘స్థాపించు’ అనే పదాలు లేఖలోని లేఖనోచిత స్వరాన్ని నిలుపుతాయి; ప్రధాన పాఠ్యం మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
