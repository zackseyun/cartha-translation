    rationale: గ్రీకులో ἀναιρεῖ ప్రధాన వర్తమాన క్రియ; ἵνα στήσῃ దాని ఉద్దేశాన్ని తెలియజేస్తుంది. కనుక ‘మొదటిదాన్ని తొలగించి, రెండవదాన్ని స్థాపించడానికి ఆయన అలా అన్నాడు’ అనే అనువాదం చర్యల వ్యాకరణ సంబంధాన్ని మార్చుతుంది.
