  to: 'కాబట్టి[a], ఆయన లోకంలోకి ప్రవేశిస్తున్నప్పుడు ఇలా అంటున్నాడు: “బలినీ అర్పణనూ నీవు కోరలేదు; కానీ నాకోసం ఒక శరీరాన్ని సిద్ధం చేశావు.”'
