id: HEB.10.5
reference: Hebrews 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: te
  text: 'కాబట్టి[a], ఆయన లోకంలోకి ప్రవేశిస్తున్నప్పుడు ఇలా అంటున్నాడు: “బలినీ అర్పణనూ నీవు కోరలేదు; కానీ నాకోసం ఒక శరీరాన్ని సిద్ధం చేశావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఇక్కడ హెబ్రీయుల పత్రిక కీర్తన 40:6 యొక్క గ్రీకు పాఠాన్ని అనుసరిస్తోంది: “నాకోసం ఒక శరీరాన్ని సిద్ధం చేశావు.” ఆ కీర్తనలోని హీబ్రూ పాఠం ఇలా ఉంది: “నాకోసం చెవులను తెరిచావు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందున్న వాదన నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: ఆయన లోకంలోకి వస్తున్నప్పుడు
  rationale: వర్తమాన అసమాపక క్రియ యొక్క కాలాన్ని అతిగా నిర్దిష్టం చేయకుండా, లేఖన ఉల్లేఖనంలోని సజీవ వర్ణనను నిలుపుతుంది.
- source_word: λέγει
  choice: ఇలా అంటున్నాడు
  rationale: లేఖనాన్ని వర్తమాన కాలంలో పరిచయం చేసే గ్రీకు ప్రయోగాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: బలినీ అర్పణనూ
  rationale: ఆరాధనా సందర్భంలోని రెండు వేర్వేరు పదాలను స్పష్టంగా, సమాంతరంగా ఉంచుతుంది.
- source_word: οὐκ ἠθέλησας
  choice: నీవు కోరలేదు
  rationale: θέλω లోని కోరిక లేదా సంకల్ప భావాన్ని ఈ సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: σῶμα δὲ κατηρτίσω μοι
  choice: కానీ నాకోసం ఒక శరీరాన్ని సిద్ధం చేశావు
  rationale: δὲ యొక్క వ్యతిరేక భావాన్ని, μοι యొక్క ప్రయోజనార్థక భావాన్ని, καταρτίζω యొక్క ‘సిద్ధం చేయడం’ అనే అర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: హెబ్రీయులు 10:5లోని కీర్తన 40:6 ఉల్లేఖనం హీబ్రూ పాఠంతో భిన్నంగా ఉండటం
  choice: గ్రీకు హెబ్రీయుల పాఠం ప్రకారం ‘నాకోసం ఒక శరీరాన్ని సిద్ధం చేశావు’ అని అనువదించడం
  alternative: కీర్తన హీబ్రూ పాఠాన్ని అనుసరించి ‘నా చెవులను తెరిచావు/తవ్వావు’ అని అనువదించడం
  rationale: అనువదిస్తున్న వచనానికి ప్రామాణికమైన SBLGNT గ్రీకు పాఠంలో σῶμα (‘శరీరం’) ఉంది. దాన్ని హీబ్రూ కీర్తన పాఠంతో సమన్వయపరచకుండా, పాఠభేదాన్ని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలి. ‘బలి’ మరియు ‘అర్పణ’ అనే ఆరాధనా పదాల భేదం నిలుపబడింది.
