  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔτι γὰρ μικρὸν ὅσον ὅσον, ὁ ἐρχόμενος ἥξει καὶ οὐ χρονίσει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: te
  text: ఎందుకంటే ఇంకా అతి కొద్దికాలంలోనే రాబోవువాడు[b] వస్తాడు; ఆలస్యం చేయడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, ‘కొద్దిగా—ఎంత కొద్దో అంత కొద్దిగా’; ఇది సమయం అత్యంత స్వల్పమని తెలిపే నానుడి.
    reason: lexical_alternative
  - marker: b
    text: ‘రాబోవువాడు’ అనే మాటను ఈ సందర్భంలో మెస్సీయను సూచించే బిరుదుసదృశమైన పదంగా కూడా అర్థం చేసుకోవచ్చు; లేదా ‘వస్తున్నవాడు’ అని అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: ఎందుకంటే, ఇంకా
  rationale: γάρ ముందున్న ప్రోత్సాహానికి కారణాన్ని సూచిస్తుంది; ἔτι కాలసంబంధమైన ‘ఇంకా’ అనే భావాన్ని ఇస్తుంది.
- source_word: μικρὸν ὅσον ὅσον
  choice: అతి కొద్ది కాలమే ఉంది
  rationale: ὅσον ὅσον పునరుక్తి సమయం అత్యంత స్వల్పమని బలపరుస్తుంది; తెలుగులో ఈ సహజమైన పదబంధం ఆ తీవ్రతను తెలియజేస్తుంది.
- source_word: ὁ ἐρχόμενος
  choice: రాబోవువాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వర్తమాన కృదంతాన్ని నామవాచకంగా అనువదిస్తూ, సందర్భంలో ఉండగల బిరుదుసదృశమైన మెస్సీయ భావాన్ని బలవంతంగా స్పష్టీకరించకుండా నిలుపుతుంది.
- source_word: ἥξει
  choice: వస్తాడు
  rationale: భవిష్యత్ సూచనను నేరుగా తెలియజేస్తూ, ἐρχόμενοςతో ఉన్న రావడం అనే పదప్రతిధ్వనిని కాపాడుతుంది.
- source_word: οὐ χρονίσει
  choice: ఆలస్యం చేయడు
  rationale: χρονίζω ఇక్కడ ఆలస్యం చేయడం అనే అర్థంలో ఉంది; ఈ అనువాదం ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: ὁ ἐρχόμενοςను మెస్సీయ బిరుదుగా అనువదించాలా, లేక సాధారణ కృదంత పదబంధంగా అనువదించాలా
  choice: రాబోవువాడు
  alternative: వస్తున్నవాడు; రానున్నవాడు
  rationale: సందర్భం దీనికి మెస్సీయ సంబంధమైన, బిరుదుసదృశమైన బలం ఉండవచ్చని సూచిస్తుంది. అయితే గ్రీకు వ్యాకరణం స్వయంగా ప్రత్యేక బిరుదును నిర్బంధించదు. ‘రాబోవువాడు’ ఈ రెండు సాధ్యతలనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని వివరణాత్మక సంబంధం, అత్యల్ప కాలంపై ఉన్న ఉద్ఘాటన, ‘రావడం’ అనే పదప్రతిధ్వని కాపాడబడ్డాయి.
