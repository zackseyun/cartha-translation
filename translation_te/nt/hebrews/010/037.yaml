  source_fidelity: ‘అతి కొద్దికాలమే ఉంది’ communicates brevity, but it changes the Greek temporal expression (‘in/after a very little while’) into an existential/remnant-time statement (‘only a very little time remains’). Rendering it as ‘అతి కొద్దికాలంలోనే’ directly preserves the temporal force. ‘రాబోవువాడు వస్తాడు; ఆలస్యం చేయడు’ accurately retains both the substantival participle and the future verb’s deliberate coming-word echo.
  naturalness: The revised wording is natural modern standard Telugu and avoids the slightly indirect ‘కాలమే ఉంది.’ Moving the alternative-reading footnote marker directly after ‘రాబోవువాడు’ makes its reference unambiguous.
  terminology: '‘రాబోవువాడు’ is an appropriate rendering of ὁ ἐρχόμενος: it can retain a titular resonance in context without requiring capitalization or an explicit doctrinal identification. ‘ఆలస్యం చేయడు’ is clear and suitable for χρονίσει.'
