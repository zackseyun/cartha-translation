revisions:
- from: కాని తీర్పు వస్తుందనే భయంకరమైన ఎదురుచూపూ, విరోధులను మింగివేయబోయే అగ్ని ఉగ్రతా[a] మాత్రమే మిగిలి ఉంటాయి.
  to: కాని, భయంకరమైన తీర్పు గురించిన నిరీక్షణా, విరోధులను మింగివేయబోయే అగ్ని ఉగ్రతా మాత్రమే మిగిలి ఉన్నాయి.[a]
  rationale: The revision improves formal Telugu diction and corrects the footnote’s unnatural alternative, while preserving the source’s compressed syntax, warning tone, consuming-fire imagery, and lack of further doctrinal elaboration.
