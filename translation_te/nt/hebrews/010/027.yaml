id: HEB.10.27
reference: Hebrews 10:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: te
  text: కాని, భయంకరమైన తీర్పు గురించిన నిరీక్షణా, విరోధులను మింగివేయబోయే అగ్ని ఉగ్రతా మాత్రమే మిగిలి ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విరోధులను దహించివేయబోయే అగ్ని ఉగ్రత.” ζῆλος అనే పదం ఇక్కడ ఉగ్రత లేదా తీవ్రమైన రోషభావాన్ని సూచిస్తుంది.
    reason: πυρὸς ζῆλος అనే సంక్షిప్త, వ్యక్తీకృత రూపకానికి సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: φοβερὰ
  choice: భయంకరమైన
  rationale: ఇది ἐκδοχήను విశేషిస్తుంది; రాబోయే తీర్పు గురించిన ఎదురుచూపు భయాన్ని పుట్టించేదని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δέ
  choice: కాని
  rationale: మునుపటి వాక్యంలోని నిరాకరణకు విరుద్ధంగా మిగిలిన పరిణామాన్ని సూచించే వ్యతిరేక భావాన్ని నిలుపుతుంది.
- source_word: τις
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ అనిర్దిష్టతను తెలిపే τιςను ‘ఒక విధమైన’ అని వ్యక్తం చేస్తే తెలుగులో కృత్రిమంగా ఉంటుంది; నామబంధం దాని భావాన్ని సహజంగానే అందిస్తుంది.
- source_word: ἐκδοχὴ κρίσεως
  choice: తీర్పు వస్తుందనే ... ఎదురుచూపు
  rationale: ἐκδοχήలోని ఎదురుచూడటం/ఎదురుచూపు భావాన్ని, κρίσιςలోని న్యాయతీర్పు భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘శిక్షావిధి’ అని సంకుచితం చేయదు.
- source_word: πυρὸς ζῆλος
  choice: అగ్ని ఉగ్రత
  rationale: సంక్షిప్తమైన గ్రీకు రూపకంలోని అగ్ని తీవ్రతను, వ్యక్తీకృత శక్తిని నిలుపుతుంది. ζῆλοςకు ఇక్కడ సందర్భానుసారంగా ఉగ్రత/రోషం అనే భావం ఉంది.
- source_word: ἐσθίειν
  choice: మింగివేయడం
  rationale: అక్షరార్థమైన ‘తినడం’ వెనుకనున్న సంపూర్ణంగా నాశనం చేసే సజీవ రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: μέλλοντος
  choice: మింగివేయబోయే
  rationale: రాబోయే చర్యను, దాని సమీప లేదా నిశ్చిత భావాన్ని అతిగా సిద్ధాంతీకరించకుండా తెలియజేస్తుంది.
- source_word: τοὺς ὑπεναντίους
  choice: విరోధులను
  rationale: ఎదురుగా నిలిచినవారనే భావాన్ని గంభీరమైన, సహజమైన తెలుగులో అందిస్తుంది; సాధారణ ‘శత్రువులు’కన్నా మూలపదంలోని ప్రతిఘటన భావాన్ని బాగా నిలుపుతుంది.
theological_decisions:
- issue: తీర్పు అగ్ని స్వభావం
  choice: విరోధులను మింగివేసే అగ్ని అనే తీవ్రమైన చిత్రణను యథాతథంగా నిలుపడం
  alternative: దీనిని ‘నిత్య శిక్ష’గా స్పష్టీకరించడం లేదా కేవలం అలంకారిక భావంగా మృదువుచేయడం
  rationale: ఈ వచనం దైవిక తీర్పును తీవ్రమైన అగ్ని చిత్రంతో ప్రకటిస్తుంది; అయితే ఆ తీర్పుకు సంబంధించిన అన్ని సిద్ధాంత వివరాలను ఇక్కడ నిర్దేశించదు. అందువల్ల మూలంలోని హెచ్చరికను తగ్గించకుండానే దాని వేదాంత ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన హెచ్చరిక ధోరణి. ముందు వచనంతో అనుసంధానమయ్యేలా ‘కాని’తో ప్రారంభించి, తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు ‘మాత్రమే మిగిలి ఉంటాయి’ ఉపయోగించబడింది. ‘మింగివేయబోయే’ అనే రూపం అగ్ని చిత్రంలోని సజీవతను నిలుపుతుంది.
