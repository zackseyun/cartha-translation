id: HEB.10.34
reference: Hebrews 10:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: te
  text: ఎందుకంటే, మీరు ఖైదీల బాధల్లో కూడా పాలుపంచుకున్నారు[a]; మీ ఆస్తులు దోచుకోబడటాన్ని ఆనందంతో అంగీకరించారు. మీకు మరింత శ్రేష్ఠమైన, ఎప్పటికీ నిలిచే సంపద ఉందని మీకు తెలుసు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఖైదీలపై కనికరం చూపించారు.” గ్రీకు క్రియ సానుభూతిని సూచించగలదు; అయితే ఇక్కడ వారి బాధలో పాలుపంచుకోవడం కూడా దానిలో ఉన్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో, “పరలోకంలో మీ కోసం మరింత శ్రేష్ఠమైన, ఎప్పటికీ నిలిచే సంపద ఉందని తెలుసుకొని” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: ఖైదీల
  rationale: δέσμιος అంటే బంధించబడిన లేదా చెరసాలలో ఉన్న వ్యక్తి. ‘ఖైదీలు’ ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: συνεπαθήσατε
  choice: బాధలో పాలుపంచుకున్నారు
  rationale: συμπαθέω కేవలం అంతరంగ సానుభూతినే కాక, ఇతరుల బాధలో వారితో కలసి నిలబడటాన్ని కూడా సూచించగలదు. హింసను అనుభవిస్తున్న విశ్వాసులతో క్రియాశీల ఐక్యతను సందర్భం ముందుకు తెస్తుంది.
- source_word: ἁρπαγήν
  choice: దోచుకోబడటాన్ని
  rationale: ἁρπαγή బలవంతంగా, అన్యాయంగా తీసుకోవడాన్ని సూచిస్తుంది. కేవలం పరిపాలనా ‘జప్తు’ కంటే ‘దోచుకోబడటం’ ఆ తీవ్రతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: మీ ఆస్తులు
  rationale: ὑπάρχοντα ఇక్కడ వ్యక్తికి చెందిన వస్తువులు లేదా ఆస్తిని సూచించే నామవాచకార్థక ప్రయోగం.
- source_word: μετὰ χαρᾶς
  choice: ఆనందంతో
  rationale: గ్రీకు విభక్తి పదబంధంలోని భావాన్నీ, ప్రాధాన్యాన్నీ నేరుగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: προσεδέξασθε
  choice: అంగీకరించారు
  rationale: προσδέχομαι స్వీకరించడం లేదా అంగీకరించడం అని అర్థం. ఇక్కడ అన్యాయాన్ని సమర్థించారనే భావం రాకుండా, ఆ నష్టాన్ని విశ్వాసంతో భరించారని తెలియజేస్తుంది.
- source_word: γινώσκοντες
  choice: తెలుసు
  rationale: తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం కారణసూచక భాగాన్ని ప్రధాన వాక్యంతో కలిపి చెప్పినా, వారి జ్ఞానమే ఆనందపూర్వక అంగీకారానికి నేపథ్యమనే భావం నిలుస్తుంది.
- source_word: ἑαυτοὺς ἔχειν
  choice: మీకు మీ సొంతంగా ... ఉందని
  rationale: ἑαυτούς ఇచ్చే ఆత్మవాచక ఉద్ఘాటనను ‘మీకు మీ సొంతంగా’ అనే సహజమైన తెలుగు పదబంధంతో నిలుపుతుంది.
- source_word: κρείττονα
  choice: మరింత శ్రేష్ఠమైన
  rationale: హెబ్రీయులకు పత్రికలో పునరావృతమయ్యే తులనాత్మక ‘మెరుగైన/శ్రేష్ఠమైన’ అంశాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ὕπαρξιν
  choice: సంపద
  rationale: ὕπαρξις ఇక్కడ ఆస్తి లేదా స్వాస్థ్యాన్ని సూచిస్తుంది. భౌతిక ఆస్తులతో పోల్చబడే విలువైన, నిలిచే స్వాస్థ్యాన్ని తెలుగులో ‘సంపద’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μένουσαν
  choice: ఎప్పటికీ నిలిచే
  rationale: μένω యొక్క స్థిరత్వం, కొనసాగుదల భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: చెరలో ఉన్న విశ్వాసులతో ఐక్యత స్వభావం
  choice: ఖైదీల బాధలో పాలుపంచుకోవడం
  alternative: ఖైదీలపై కనికరం లేదా సానుభూతి చూపడం
  rationale: συμπαθέω అనే క్రియ సానుభూతిని సూచించగలిగినా, σύν- భావం మరియు హెబ్రీయులు 10:32–34లోని హింసా సందర్భం ఖరీదైన, క్రియాశీల ఐక్యతను ముందుకు తెస్తాయి. అయితే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- issue: ‘మరింత శ్రేష్ఠమైన, ఎప్పటికీ నిలిచే సంపద’ స్వభావం
  choice: ఆ సంపదను పరలోకం, రక్షణ లేదా ప్రతిఫలం అని ప్రధాన పాఠ్యంలో ప్రత్యేకంగా నిర్వచించలేదు
  alternative: పరలోకంలో ఉన్న మెరుగైన సంపద లేదా వారసత్వం
  rationale: ఇక్కడ ఇచ్చిన SBLGNT ప్రధాన పాఠ్యంలో ‘పరలోకంలో’ అనే మాట లేదు. అందువల్ల మూలపాఠ్యంలోని విస్తృతతను, అంత్యకాల సంబంధమైన సూచనలోని ఉద్వేగాన్ని నిర్దిష్ట సిద్ధాంత పదాలతో పరిష్కరించకుండా నిలిపాం; పాఠాంతరాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. ‘బాధలో పాలుపంచుకున్నారు’ క్రియాశీల ఐక్యతను, ‘దోచుకోబడటం’ అన్యాయమైన బలవంతపు నష్టాన్ని వ్యక్తపరుస్తాయి. ‘సంపద’ అనే పదం భౌతిక ఆస్తులతో ఉన్న పదసంబంధాన్ని కొంతవరకు నిలుపుతూ, భవిష్యత్తులో నిలిచే స్వాస్థ్యాన్ని అనవసరంగా నిర్దిష్టీకరించదు.
