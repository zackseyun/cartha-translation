id: HEB.10.25
reference: Hebrews 10:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: te
  text: కొందరికి అలవాటైనట్లుగా, మన కూడికను నిర్లక్ష్యం చేయకుండా[a], ఒకరినొకరు ప్రోత్సహించుకుందాం. ఆ దినం[b] సమీపిస్తున్నదని మీరు చూస్తున్న కొద్దీ, అంతకంతకూ మరింతగా ప్రోత్సహించుకుందాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన కూడికను విడిచిపెట్టకుండా” లేదా “వదిలివేయకుండా.”
    reason: lexical_alternative
  - marker: b
    text: “ఆ దినం” అనేది ప్రభువు దినాన్ని లేదా అంతిమ తీర్పు దినాన్ని సూచిస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: నిర్లక్ష్యం చేయకుండా
  rationale: ఈ పదానికి విడిచిపెట్టడం లేదా వదిలివేయడం అనే బలమైన భావం ఉండవచ్చు; అయితే ఈ సందర్భంలో సమాజంగా కూడివచ్చే ఆచరణను కొనసాగించకపోవడాన్ని సహజంగా తెలిపేందుకు ‘నిర్లక్ష్యం చేయకుండా’ అనువైనది. బలమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: మనం కూడి రావడాన్ని
  rationale: విశ్వాసుల సామూహిక సమాగమాన్ని సూచిస్తుంది. ‘ఆరాధన సభ’ వంటి తరువాతి సంస్థాగత భావాన్ని చేర్చకుండా, మూలంలోని కలిసి సమకూరే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: καθὼς ἔθος τισίν
  choice: కొందరికి అలవాటైనట్లు
  rationale: ἔθος అనే పదంలోని అలవాటు లేదా ఆచారం అనే భావాన్ని, రచయిత చెప్పే మృదువైన గద్దింపుతో సహా, స్పష్టంగా అందిస్తుంది.
- source_word: παρακαλοῦντες
  choice: ఒకరినొకరు ప్రోత్సహించుకుందాం
  rationale: ఈ సందర్భంలో పరస్పరం ధైర్యపరచడం, నిలకడకు పురికొల్పడం ప్రధాన భావం. గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా సామూహిక సందర్భం పరస్పర భావాన్ని సూచిస్తుంది.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: చూస్తున్న కొద్దీ, మరింతగా
  rationale: ఆ దినం దగ్గరవుతున్నదనే అవగాహన పెరిగే కొద్దీ ప్రోత్సాహం కూడా అధికం కావాలనే అనుపాత బలాన్ని నిలుపుతుంది.
- source_word: βλέπετε
  choice: మీరు చూస్తున్న
  rationale: వర్తమానకాల ప్రత్యక్ష భావాన్ని ఉంచుతుంది; వారు ఎలా గుర్తిస్తున్నారో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἐγγίζουσαν τὴν ἡμέραν
  choice: ఆ దినం సమీపిస్తున్నదని
  rationale: గ్రీకులోని సమీపిస్తూ ఉన్న కాలగమన భావాన్ని సహజంగా తెలియజేస్తుంది. ‘ఆ దినం’ అనేది సందర్భంలో గుర్తింపబడిన అంత్యకాల దినాన్ని సూచించినా, మూలంలో లేని ‘ప్రభువు దినం’ లేదా ‘తీర్పు దినం’ అనే విస్తరణను ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: ‘ఆ దినం’ యొక్క అంత్యకాల సూచన
  choice: ప్రధాన పాఠ్యంలో ‘ఆ దినం’ అని మాత్రమే ఉంచడం
  alternative: ‘ప్రభువు దినం’ లేదా ‘తీర్పు దినం’
  rationale: సందర్భం అంత్యకాల దినాన్ని సూచించినప్పటికీ, గ్రీకు పాఠ్యంలో కేవలం ‘దినం’ మాత్రమే ఉంది. అందువల్ల నిర్దిష్ట వివరణను పాదసూచికలో ఇచ్చి, ప్రధాన పాఠ్యంలో ఉన్న ఉద్దేశపూర్వక సంక్షిప్తతను కాపాడాం.
- issue: παρακαλοῦντες యొక్క పరస్పర కర్మ
  choice: ‘ఒకరినొకరు’ అని స్పష్టం చేయడం
  alternative: కర్మను చెప్పకుండా ‘ప్రోత్సహిస్తూ’ అని ఉంచడం
  rationale: సొంత సమాగమం అనే సామూహిక సందర్భం పరస్పర ప్రోత్సాహాన్ని బలంగా సూచిస్తుంది. సహజమైన తెలుగుకోసం దీనిని స్పష్టం చేశాం; ఇది కొత్త సిద్ధాంత భావాన్ని చేర్చదు.
- issue: వాక్యంలోని ఆజ్ఞాత్మక బలం
  choice: ‘ప్రోత్సహించుకుందాం… అలా చేద్దాం’
  alternative: ‘ప్రోత్సహిస్తూ’ అనే అసమాపక నిర్మాణం
  rationale: ఈ అసమాపక క్రియలు ముందు వచనంలోని ప్రోత్సాహక ఆజ్ఞను కొనసాగిస్తాయి. ఒక్క వచనంగా చదివినప్పుడు ఆ భావం తెలుగులో స్పష్టంగా ఉండేందుకు సమూహ ప్రోత్సాహక రూపాన్ని ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘సమావేశం’ కంటే ‘కూడి రావడం’ మూలంలోని క్రియాత్మక, సామూహిక భావాన్ని సహజంగా అందిస్తుంది. ప్రధాన పాఠ్యంలోని ప్రతి పాదసూచిక గుర్తు సంబంధిత భావం వెంట ఉంచబడింది.
