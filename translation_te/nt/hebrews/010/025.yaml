revisions:
- from: కొందరికి అలవాటైనట్లు, మనం కూడి రావడాన్ని నిర్లక్ష్యం చేయకుండా[a], ఒకరినొకరు ప్రోత్సహించుకుందాం. ఆ దినం సమీపిస్తున్నదని మీరు చూస్తున్న కొద్దీ, మరింతగా అలా చేద్దాం.[b]
  to: కొందరికి అలవాటైనట్లుగా, మన కూడికను నిర్లక్ష్యం చేయకుండా[a], ఒకరినొకరు ప్రోత్సహించుకుందాం. ఆ దినం[b] సమీపిస్తున్నదని మీరు చూస్తున్న కొద్దీ, అంతకంతకూ మరింతగా ప్రోత్సహించుకుందాం.
  rationale: సవరణలు మూలంలోని సమాజ-సంబంధ కూడిక భావాన్ని మరింత సహజంగా వ్యక్తపరుస్తాయి; ‘మరింతగా’ ఏ చర్యను తీవ్రతరం చేస్తుందో స్పష్టంగా చెబుతాయి; పాదసూచిక గుర్తును అది వివరిస్తున్న ‘ఆ దినం’ వద్ద ఉంచుతాయి. అంత్యకాల సూచనను ప్రధాన పాఠ్యంలో విస్తరించకుండా, పాదసూచికలో సంభావ్య వివరణగా మాత్రమే ఉంచాం.
