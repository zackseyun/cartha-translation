id: HEB.10.36
reference: Hebrews 10:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: te
  text: ఎందుకంటే, దేవుని చిత్తాన్ని నెరవేర్చి వాగ్దానాన్ని[a] పొందేందుకు మీకు సహనం అవసరం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాగ్దానం చేయబడినదాన్ని.”
    reason: ἐπαγγελίαν అనే పదం వాగ్దానాన్ని లేదా వాగ్దానం చేయబడిన దాని నెరవేర్పును సూచించవచ్చు.
lexical_decisions:
- source_word: ὑπομονῆς
  choice: సహనం
  rationale: ఒత్తిడి, శ్రమల మధ్య స్థిరంగా నిలిచి కొనసాగడాన్ని సూచిస్తుంది. ‘సహనం’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని పట్టుదల భావాన్ని మోయగలదు.
- source_word: χρείαν ἔχετε
  choice: మీకు అవసరం
  rationale: ‘అవసరం కలిగి ఉండడం’ అనే గ్రీకు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἵνα
  choice: పొందడానికి
  rationale: గ్రీకులోని ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని తెలుగు క్రియార్థక నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: దేవుని చిత్తాన్ని
  rationale: మూలంలోని సంబంధ విభక్తి నిర్మాణాన్ని గౌరవిస్తూ, సాధారణ బైబిలు తెలుగు వాడుకలో స్పష్టంగా ఉంటుంది.
- source_word: ποιήσαντες
  choice: నెరవేర్చిన తర్వాత
  rationale: ప్రధాన క్రియకు ముందుగా పూర్తయ్యే చర్యను సూచించే గ్రీకు ఏఓరిస్ట్ కృదంతపు కాలసంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది. ‘చిత్తాన్ని చేయడం’ కంటే ‘చిత్తాన్ని నెరవేర్చడం’ తెలుగులో సహజం.
- source_word: κομίσησθε
  choice: పొందడానికి
  rationale: ఈ సందర్భంలో వాగ్దానం చేయబడినదాన్ని స్వీకరించడం లేదా పొందడం అనే భావాన్ని సూటిగా వ్యక్తపరుస్తుంది.
- source_word: τὴν ἐπαγγελίαν
  choice: వాగ్దానాన్ని
  rationale: మూలంలోని పదరూపాన్ని, అలాగే ‘వాగ్దానం’ మరియు ‘వాగ్దానం చేసినది’ మధ్యనున్న భావ ఉద్రిక్తతను ప్రధాన పాఠ్యంలో కాపాడుతుంది.
theological_decisions:
- issue: ἐπαγγελίαν అనేది వాగ్దానాన్నే సూచిస్తుందా, లేక వాగ్దానం చేయబడిన ఫలాన్ని సూచిస్తుందా?
  choice: వాగ్దానాన్ని
  alternative: వాగ్దానం చేయబడినదాన్ని
  rationale: గ్రీకు పదం అక్షరార్థంగా ‘వాగ్దానం’ అని ఉన్నప్పటికీ, κομίσησθεతో కలిసి వాడినప్పుడు వాగ్దానం చేసిన ఫలాన్ని పొందడం అనే భావం కూడా రావచ్చు. సందిగ్ధతను అతిగా పరిష్కరించకుండా ప్రధాన పాఠ్యంలో మూల పదాన్ని ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని కారణార్థక ‘γὰρ’కు సందర్భానుసారంగా ‘ఎందుకంటే’ చేర్చడం సాధ్యమే; అయితే ఒంటరి వచనంగా అనవసర భారాన్ని నివారించేందుకు ఇక్కడ ప్రత్యక్ష ప్రకటనగా ఉంచాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత పదానికి జతచేయబడింది.
