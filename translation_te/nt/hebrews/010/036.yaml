revisions:
- from: మీరు దేవుని చిత్తాన్ని నెరవేర్చిన తర్వాత వాగ్దానాన్ని[a] పొందడానికి సహనం మీకు అవసరం.
  to: ఎందుకంటే, దేవుని చిత్తాన్ని నెరవేర్చి వాగ్దానాన్ని[a] పొందేందుకు మీకు సహనం అవసరం.
  rationale: 'The revision restores the causal force of γάρ and places the Telugu clauses in an order that naturally conveys: endurance is needed so that, after doing God''s will, the readers may receive the promise. It preserves the source''s ambiguity concerning whether ''the promise'' denotes the promise itself or what was promised, with the alternative retained in the footnote.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:04:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents God's will, the antecedent force of the aorist participle, and the deliberate ambiguity of τὴν ἐπαγγελίαν. However, it omits γάρ ('for'), and its word order makes 'after doing God's will' attach less clearly to receiving the promise than in the Greek.
  naturalness: The wording is understandable modern standard Telugu, but placing 'సహనం' at the end after the infinitive purpose phrase is somewhat awkward. A reordered sentence is clearer and more natural.
  terminology: దేవుని చిత్తం and వాగ్దానం are appropriate established biblical terms. సహనం is acceptable for ὑπομονή in this context; the surrounding construction supplies the sense of enduring perseverance without adding interpretation.
  issues:
  - severity: medium
    issue: The causal connective γάρ is not represented.
    rationale: γάρ links this exhortation to the preceding context as a reason ('for'). Telugu can naturally retain this as 'ఎందుకంటే' without undue heaviness.
  - severity: low
    issue: The Telugu clause order weakens the connection between completing God's will and receiving the promise.
    rationale: The Greek aorist participle ποιήσαντες is antecedent to κομίσησθε. Reordering the Telugu clause makes this relationship direct while retaining the purpose/result force of ἵνα.
  revised_text: ఎందుకంటే, దేవుని చిత్తాన్ని నెరవేర్చి వాగ్దానాన్ని[a] పొందేందుకు మీకు సహనం అవసరం.
  revised_footnotes:
  - marker: a
    text: లేదా, “వాగ్దానం చేయబడినదాన్ని.”
    reason: ἐπαγγελίαν అనే పదం వాగ్దానాన్ని లేదా వాగ్దానం చేయబడిన దాని నెరవేర్పును సూచించవచ్చు.
  revision_rationale: 'The revision restores the causal force of γάρ and places the Telugu clauses in an order that naturally conveys: endurance is needed so that, after doing God''s will, the readers may receive the promise. It preserves the source''s ambiguity concerning whether ''the promise'' denotes the promise itself or what was promised, with the alternative retained in the footnote.'
