source:
  edition: SBLGNT
  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: te
  text: కానీ, మీరు వెలుగుపొందిన తరువాత[a][b], బాధలతో కూడిన తీవ్రమైన పోరాటాన్ని[c] సహించిన ఆ మునుపటి రోజులను జ్ఞాపకం చేసుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు వెలుగుపొందినప్పుడు.’ గ్రీకు కృదంతాన్ని ప్రధాన క్రియకు ముందు జరిగిన చర్యగా లేదా అదే సమయంలో జరిగిన చర్యగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వెలుగుపొందడం’ అనేది విస్తృతంగా ఆధ్యాత్మిక వెలుగును పొందడాన్ని సూచించవచ్చు; కొందరు దీన్ని విశ్వాసంలోకి రావడం, బాప్తిస్మం, లేదా విశ్వాస బోధన పొందడంతో అనుసంధానిస్తారు.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘బాధలతో కూడిన కఠిన పోటీని.’ ఇక్కడి గ్రీకు నామవాచకంలో పోరాటం లేదా పోటీ అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: జ్ఞాపకం చేసుకోండి
  rationale: వర్తమానకాల ఆజ్ఞార్థక రూపంలోని పిలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; నిరంతరంగా జ్ఞాపకం ఉంచుకోవాలనే భావాన్ని సందర్భం సూచించగలదు.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న హెచ్చరిక నుంచి గత విశ్వాసస్థైర్యాన్ని జ్ఞాపకం చేసే ప్రోత్సాహానికి వచ్చే స్వల్ప వ్యత్యాసాన్ని, భావమార్పును సూచిస్తుంది.
- source_word: τὰς πρότερον ἡμέρας
  choice: ఆ మునుపటి రోజులను
  rationale: గతంలో వారు అనుభవించిన నిర్దిష్ట కాలాన్ని సహజంగా సూచిస్తూ కాలవ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐν αἷς
  choice: ఆ ... రోజులను
  rationale: అక్షరార్థంగా ‘వాటిలో’ అయినా, తెలుగులో సంబంధవాచక నిర్మాణాన్ని వాక్యమంతటితో వ్యక్తం చేయడం మరింత సహజం.
- source_word: φωτισθέντες
  choice: మీరు వెలుగుపొందిన తరువాత
  rationale: మూలంలోని వెలుగు రూపకాన్ని నిలుపుతూ, ప్రధాన క్రియకు ముందుగా జరిగిన చర్యగా క్రియావిశేషణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: πολλὴν ἄθλησιν
  choice: గొప్ప పోరాటాన్ని
  rationale: ἄθλησιςలోని పోటీ లేదా కఠిన పోరాట భావాన్ని ‘పోరాటం’ నిలుపుతుంది; πολλήν సూచించే తీవ్రతను ‘గొప్ప’ తెలియజేస్తుంది.
- source_word: ὑπεμείνατε
  choice: సహించిన
  rationale: బాధల మధ్య నిలకడగా భరించిన భావాన్ని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: παθημάτων
  choice: బాధలతో కూడిన
  rationale: ఈ షష్ఠీ బహువచనం పోరాటం ఏ విధమైనదో తెలుపుతుంది; ‘బాధలు’ దాని విస్తృత అర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: హెచ్చరిక, ప్రోత్సాహ సందర్భంలో φωτισθέντες అర్థం
  choice: ‘వెలుగుపొందిన’ అనే రూపకాన్నే నిలుపడం
  alternative: ‘మారుమనస్సు పొందిన తరువాత’, ‘బాప్తిస్మం పొందిన తరువాత’, లేదా ‘సువార్త వెలుగును పొందిన తరువాత’
  rationale: ఇది ఆధ్యాత్మిక వెలుగును పొందడాన్ని సూచించినా, మార్పు, బాప్తిస్మం లేదా విశ్వాసబోధలో శిక్షణ అనే నిర్దిష్ట సంఘటనను వచనం తానే నిర్ణయించదు. అందువల్ల సిద్ధాంతపరంగా సంకుచితం చేయకుండా మూలంలోని ఉద్దేశపూర్వక విస్తృతతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘వెలుగుపొందిన’ అనే బైబిలీయ రూపకాన్ని సహజంగా ఉంచి, దాని సిద్ధాంతపరమైన సూచనను ప్రధాన పాఠ్యంలో నిర్దిష్టీకరించలేదు.
