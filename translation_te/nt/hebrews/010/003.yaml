id: HEB.10.3
reference: Hebrews 10:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: te
  text: అయితే, ఈ బలుల్లో సంవత్సరానికొకసారి పాపాల జ్ఞాపకం కలుగుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి సంవత్సరం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: అయితే
  rationale: ముందటి వచనంలోని బలులు ఆరాధించేవారిని పరిపూర్ణులను చేయలేవనే వాదనకు వ్యతిరేక భావసంబంధాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: ἐν αὐταῖς
  choice: ఈ బలుల్లో
  rationale: స్త్రీలింగ బహువచన సర్వనామం ముందటి సందర్భంలోని బలులను సూచిస్తుంది; తెలుగులో సూచ్యాన్ని స్పష్టంగా చెప్పడం పఠనసౌలభ్యాన్ని ఇస్తుంది.
- source_word: ἀνάμνησις
  choice: జ్ఞాపకం
  rationale: పాపాలను తిరిగి మనసుకు తెచ్చే స్మరణ అనే భావాన్ని సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἁμαρτιῶν
  choice: పాపాల
  rationale: ἀνάμνησις మీద ఆధారపడిన షష్ఠీ విభక్తి భావాన్ని ‘పాపాల జ్ఞాపకం’ అని సహజంగా నిలుపుతుంది.
- source_word: κατ’ ἐνιαυτόν
  choice: సంవత్సరానికొకసారి
  rationale: ప్రతి సంవత్సరమూ పునరావృతమయ్యే కాలభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలోని వార్షిక పునరావృతిని నిలుపుతుంది.
theological_decisions:
- issue: αὐταῖς అనే సర్వనామం దేనిని సూచిస్తుంది?
  choice: ముందటి సందర్భంలో చెప్పిన బలులను సూచిస్తున్నందున ‘ఈ బలుల్లో’ అని స్పష్టం చేయడం.
  alternative: ‘వాటిలో’ అని సర్వనామంగానే ఉంచడం.
  rationale: హెబ్రీయులకు 10:1–2లో నిరంతరం అర్పించే బలులే సమీప సూచ్యం. దానిని స్పష్టం చేయడం భావాన్ని మార్చకుండా రచయిత చూపుతున్న వ్యత్యాసాన్ని అర్థమయ్యేలా చేస్తుంది.
- issue: κατ’ ἐνιαυτόν యొక్క కాలభావం
  choice: ‘సంవత్సరానికొకసారి’ అని అనువదించి వార్షిక పునరావృతిని తెలియజేయడం.
  alternative: ‘ప్రతి సంవత్సరం’ లేదా ‘ఏటేటా’.
  rationale: ఈ పదబంధం ఏటా జరిగే పునరావృతిని సూచిస్తుంది. ఎంపిక చేసిన రూపం ఆ వార్షిక క్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ అనువాదమూ అదే ప్రాథమిక భావాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘బలులు,’ ‘పాపాలు,’ ‘జ్ఞాపకం’ వంటి విస్తృతంగా అర్థమయ్యే బైబిలు పదజాలాన్ని ఉపయోగించాం.
