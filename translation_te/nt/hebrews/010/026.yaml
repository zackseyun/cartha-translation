id: HEB.10.26
reference: Hebrews 10:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: te
  text: ఎందుకంటే, సత్యం గురించిన జ్ఞానాన్ని[a] పొందిన తర్వాత మనం ఉద్దేశపూర్వకంగా పాపం చేస్తూనే ఉంటే, పాపాల కొరకు ఇక బలి మిగిలి ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సత్యం గురించిన సంపూర్ణ జ్ఞానాన్ని.’ గ్రీకు పదం మరింత సంపూర్ణమైన లేదా నిర్ణాయకమైన జ్ఞానం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: ఉద్దేశపూర్వకంగా
  rationale: కావాలని, తెలిసి చేసే చర్య అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది; న్యాయపరమైన లేదా ప్రాచీన శైలిని అనవసరంగా కలిగించదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ హెచ్చరిక ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: మనం ... పాపం చేస్తూనే ఉంటే
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న లేదా పట్టుదలతో సాగే చర్య భావాన్ని తెలుగులో సహజమైన షరతు వాక్యంగా వ్యక్తం చేస్తుంది; ఒక్క విడి పాపక్రియగా చూపదు.
- source_word: μετὰ τὸ λαβεῖν
  choice: పొందిన తర్వాత
  rationale: జ్ఞానాన్ని పొందడం ముందుగా జరిగినదని సూచించే కాలక్రమాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐπίγνωσιν
  choice: జ్ఞానాన్ని
  rationale: మూలపదం కొన్నిసార్లు సంపూర్ణమైన లేదా నిర్ణాయకమైన అవగాహనను సూచించగలిగినా, సందర్భం ఆ బలమైన భావాన్ని తప్పనిసరి చేయదు; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: τῆς ἀληθείας
  choice: సత్యాన్ని గూర్చిన
  rationale: జ్ఞానానికి సంబంధించిన విషయాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తూ, సందర్భంలో ఉన్న సువార్త సత్యాన్ని వివరణగా చేర్చకుండా ఉంటుంది.
- source_word: οὐκέτι
  choice: ఇక ... మిగిలి ఉండదు
  rationale: ఆ దశ తర్వాత మరేదీ లేదనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: περὶ ἁμαρτιῶν
  choice: పాపాల కోసం
  rationale: బలి సందర్భంలో περὶ తో షష్ఠీ విభక్తి పాపాలకు సంబంధించిన ప్రాయశ్చిత్త బలి భావాన్ని ఇస్తుంది; 'పాపాల కోసం' ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀπολείπεται
  choice: మిగిలి ఉండదు
  rationale: మిగిలి ఉండటం అనే నిష్క్రియాత్మక భావాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: θυσία
  choice: ఏ బలీ
  rationale: హెబ్రీయులకు పత్రికలోని బలి సంబంధ వాదనకు 'బలి' ప్రామాణికమైన పదం. నిషేధ వాక్యంలో అనిర్దిష్ట భావాన్ని సహజంగా వ్యక్తం చేయడానికి 'ఏ' వాడబడింది.
theological_decisions:
- issue: ἁμαρτανόντων యొక్క క్రియాంశం మరియు హెచ్చరిక స్వభావం
  choice: '''మనం ఉద్దేశపూర్వకంగా పాపం చేస్తూనే ఉంటే'' అని కొనసాగుతున్న చర్యగా అనువదించడం'
  alternative: '''మనం ఉద్దేశపూర్వకంగా పాపం చేస్తే'' అని ఒక్క చర్యకూ వర్తించగల రీతిలో అనువదించడం'
  rationale: వర్తమాన కృదంతం సహజంగా కొనసాగుతున్న లేదా పట్టుదలతో సాగే పాపాన్ని సూచిస్తుంది. దీనివల్ల హెచ్చరిక తీవ్రత నిలుస్తుంది; అదే సమయంలో మారుమనస్సు అనంతరం జరిగిన ఏ ఒక్క ఉద్దేశపూర్వక పాపాన్నే ఈ వాక్యం తప్పనిసరిగా ఉద్దేశిస్తుందని అతిశయంగా చెప్పదు.
- issue: ἐπίγνωσις యొక్క రక్షణశాస్త్ర సంబంధ బలం
  choice: ప్రధాన పాఠ్యంలో 'సత్యాన్ని గూర్చిన జ్ఞానం' అని మాత్రమే ఉంచడం
  alternative: '''సత్యాన్ని గూర్చిన సంపూర్ణ జ్ఞానం'' లేదా ''రక్షణనిచ్చే సత్యజ్ఞానం'' అని పేర్కొనడం'
  rationale: వాక్యం సత్యజ్ఞానాన్ని పొందినట్లు చెబుతుంది గాని, ఆ జ్ఞానం పునర్జన్మను తప్పనిసరిగా సూచిస్తుందా అనే విషయాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల విభిన్న సిద్ధాంతపరమైన నిర్ణయాలను అనువాదంలో చొప్పించకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే హెచ్చరికలోని గంభీరతను నిలిపే గౌరవప్రదమైన శైలి. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
