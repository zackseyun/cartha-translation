source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: te
  text: పైన ఇలా చెప్పిన తరువాత, “బలులను, అర్పణలను, సంపూర్ణ దహనబలులను[a], పాపపరిహార బలులను[b] నీవు కోరలేదు, వాటిని ఇష్టపడలేదు కూడా”—అవి ధర్మశాస్త్రం ప్రకారం[c] అర్పించబడుతున్నవి—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దహనబలులను.” గ్రీకు పదం బలిపీఠంపై పూర్తిగా దహనం చేయబడే అర్పణలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పాపం కోసం అర్పణలను.”
    reason: lexical_alternative
  - marker: c
    text: అంటే, మోషే ధర్మశాస్త్రం ప్రకారం.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: ముందుగా ఆయన ఇలా అన్నాడు
  rationale: ἀνώτερον ఇక్కడ రచయిత ఇప్పుడే పైన ఉదహరించిన మాటను వెనక్కి సూచిస్తుంది. తెలుగులో సహజంగా ఉండేలా, ఆ వాక్యప్రవాహాన్ని నిలుపుతూ అనువదించబడింది.
- source_word: Θυσίας καὶ προσφορὰς
  choice: బలులను, అర్పణలను
  rationale: యాజ్ఞిక సందర్భంలోని రెండు సాధారణ వర్గాలను వేరుగా, స్పష్టంగా ఉంచుతుంది.
- source_word: ὁλοκαυτώματα
  choice: సంపూర్ణ దహనబలులను
  rationale: బలిపీఠంపై పూర్తిగా దహనం చేయబడే బలులు అనే సమాసపద భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: περὶ ἁμαρτίας
  choice: పాపపరిహార బలులను
  rationale: యాజ్ఞిక సందర్భంలో ఇది పాపానికి సంబంధించిన నిర్దిష్ట బలి వర్గాన్ని సూచిస్తుంది; కేవలం పాపం గురించిన సాధారణ మాటగా అనిపించకుండా ఈ రూపం ఎంచుకోబడింది.
- source_word: οὐκ ἠθέλησας οὐδὲ εὐδόκησας
  choice: నీవు కోరలేదు; వాటిలో ఆనందించనూ లేదు
  rationale: 'రెండు గ్రీకు క్రియల మధ్యనున్న భావభేదాన్ని కాపాడుతుంది: కోరడం, అనుకూలంగా సంతోషించడం. తెలుగులో అవసరమైన కర్మసూచకంగా ‘వాటిలో’ చేర్చబడింది.'
- source_word: αἵτινες κατὰ νόμον προσφέρονται
  choice: అవి ధర్మశాస్త్రం ప్రకారం అర్పించబడుతున్నప్పటికీ
  rationale: జాబితాలోని బలులనే తిరిగి సూచిస్తూ, అవి ధర్మశాస్త్ర నిర్దేశాలకు అనుగుణంగా అర్పించబడుతున్నాయనే విరుద్ధతను ‘అప్పటికీ’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుడు బలులను కోరలేదనే మాటకూ అవి ధర్మశాస్త్రం ప్రకారం అర్పించబడతాయనే మాటకూ మధ్యనున్న ఉద్రిక్తత
  choice: రెండు వాక్యాంశాలనూ వ్యాఖ్యానంతో సమన్వయపరచకుండా యథాతథంగా నిలుపుట
  alternative: దేవుడు విధేయతలేని బలులను మాత్రమే కోరలేదు అని విస్తరించి చెప్పడం
  rationale: గ్రీకు పాఠం ఆ పరిమితిని స్పష్టంగా చెప్పదు. రచయిత ఉద్దేశపూర్వకంగా ఉంచిన ధార్మిక ఉద్రిక్తతను అనువాదం ముందుగానే పరిష్కరించకూడదు.
- issue: περὶ ἁμαρτίας యొక్క యాజ్ఞిక అర్థం
  choice: పాపపరిహార బలులు
  alternative: పాపం కోసం అర్పణలు
  rationale: సందర్భం లేవీయ బలి వర్గాల జాబితా. సాంకేతిక యాజ్ఞిక భావాన్ని తెలుగులో స్పష్టంగా ఉంచుతూ, దాని చుట్టూ అదనపు సిద్ధాంత వివరణను జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘బలి,’ ‘అర్పణ,’ ‘ధర్మశాస్త్రం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉపయోగించి, వాక్యాంతంలోని కొనసాగింపు సూచక డాష్‌ను నిలిపాం.
