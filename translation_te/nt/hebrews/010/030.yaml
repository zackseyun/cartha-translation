source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: te
  text: 'ఎందుకంటే, ఇలా చెప్పినవానిని మనం ఎరుగుతాము: “ప్రతీకారం నాది; నేనే తిరిగి చెల్లిస్తాను.”[a] మరల, “ప్రభువు తన ప్రజలకు తీర్పు తీరుస్తాడు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థానికి దగ్గరగా: “నాకు ప్రతీకారం; నేనే తిరిగి చెల్లిస్తాను.”'
    reason: lexical_alternative
  - marker: b
    text: ఈ ఉల్లేఖనం ద్వితీయోపదేశకాండము 32:35–36ను ప్రతిధ్వనిస్తుంది. అక్కడ “తీర్పు తీర్చడం” శిక్షించడాన్నీ సమర్థించడాన్నీ సూచించగలదు; ఇక్కడి హెచ్చరిక సందర్భంలో దైవిక తీర్పు ప్రధానంగా ముందుకు వస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν γὰρ
  choice: ఎందుకంటే ... మనకు తెలుసు
  rationale: οἶδα యొక్క వర్తమానార్థాన్ని సహజమైన తెలుగులో చూపుతూ, γάρ ముందటి వాక్యంతో ఉన్న వివరణాత్మక సంబంధాన్ని నిలుపుతుంది.
- source_word: τὸν εἰπόντα
  choice: ఇలా చెప్పినవాడు
  rationale: దేవుడు లేఖనంలో పలికిన వ్యక్తిగత వక్తగా సూచించబడుతున్నాడు; తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉంది.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: ప్రతీకారం నాది
  rationale: గ్రీకులోని సంక్షిప్త స్వామ్య భావాన్ని ప్రత్యక్షంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: ἐγὼ ἀνταποδώσω
  choice: నేనే ప్రతిఫలం చెల్లిస్తాను
  rationale: ἐγώ యొక్క ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది; ἀνταποδίδωμι లోని తగిన ప్రతిఫలం తిరిగి ఇవ్వడం అనే న్యాయపరమైన భావాన్ని ‘ప్రతిఫలం చెల్లిస్తాను’ తెలియజేస్తుంది.
- source_word: καὶ πάλιν
  choice: మరల
  rationale: రెండవ లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే సూత్రాన్ని అదనపు క్రియను చేర్చకుండా తెలుపుతుంది.
- source_word: Κρινεῖ κύριος
  choice: ప్రభువు ... తీర్పు తీరుస్తాడు
  rationale: κρίνω యొక్క న్యాయనిర్ణయ భావాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతుంది; κύριος ను ‘ప్రభువు’గా అనువదిస్తుంది.
- source_word: τὸν λαὸν αὐτοῦ
  choice: తన ప్రజలకు
  rationale: తెలుగులో ‘తీర్పు తీర్చు’తో సహజంగా వచ్చే చతుర్థీ విభక్తిని ఉపయోగిస్తూ, దేవునికి చెందిన ప్రజలు అనే నిబంధనాత్మక భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ద్వితీయోపదేశకాండ ఉల్లేఖనంలోని κρινεῖ యొక్క పరిధి
  choice: తీర్పు తీరుస్తాడు
  alternative: న్యాయం చేస్తాడు / నిర్దోషులని నిరూపిస్తాడు
  rationale: మూల సందర్భంలో ఈ క్రియ శిక్షనూ సమర్థింపునూ కలిగి ఉండగలదు. హెబ్రీయులు 10లోని హెచ్చరిక సందర్భం దైవిక తీర్పును ముందుకు తెస్తుంది; అయినా ‘తీర్పు తీరుస్తాడు’ అనే విస్తృత న్యాయపరమైన పదబంధం భావాన్ని కేవలం శిక్షకు పరిమితం చేయదు.
- issue: దైవిక ప్రతీకారం
  choice: ప్రతీకారం నాది; నేనే ప్రతిఫలం చెల్లిస్తాను
  alternative: పగ తీర్చుకోవడం నాది; నేనే తిరిగి చెల్లిస్తాను
  rationale: ‘ప్రతీకారం’ వ్యక్తిగత ద్వేషాన్ని సూచించే సాధారణ ‘పగ’కన్నా ఇక్కడి న్యాయపరమైన దైవిక ప్రతిఫల భావాన్ని గౌరవప్రదంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన లేఖన శైలిని ఉపయోగించాం. ‘ప్రతీకారం’, ‘ప్రతిఫలం’, ‘తీర్పు తీరుస్తాడు’ అనే పదాలు న్యాయపరమైన బలాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
