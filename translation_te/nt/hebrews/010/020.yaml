  yaml_path: translation/nt/hebrews/010/020.yaml
  text: which he inaugurated for us as a new and living way through the curtain—that is[a], his flesh[b],
translation:
  language: te
  text: ఆయన మనకొరకు తెర ద్వారా—అంటే, ఆయన శరీరం ద్వారా—కొత్తదైన, సజీవమైన మార్గాన్ని ప్రారంభించి ఇచ్చాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘అనగా’.'
    reason: lexical_alternative
  - marker: b
    text: ‘అంటే, ఆయన శరీరం ద్వారా’ అనే మాట తెర రూపకాన్ని వివరిస్తూ, ఆ తెరను యేసు శరీరంతో గుర్తిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἣν
  choice: దానిని
  rationale: ముందటి వచనంలో చెప్పిన ప్రవేశమార్గంతో సంబంధాన్ని కొనసాగించే సంబంధబోధక సర్వనామం; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు భావసంబంధంగా నిర్మించబడింది.
- source_word: ἐνεκαίνισεν
  choice: ప్రారంభించాడు
  rationale: కొత్తగా ఉపయోగంలోకి తెచ్చి స్థాపించడం లేదా ప్రతిష్ఠించడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡμῖν
  choice: మన కోసం
  rationale: లబ్ధిని సూచించే దత్తివును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁδὸν
  choice: మార్గాన్ని
  rationale: భౌతిక దారి మరియు దేవుని సన్నిధికి ప్రవేశం అనే రూపకాలంకార భావం రెండింటినీ నిలుపుతుంది.
- source_word: πρόσφατον καὶ ζῶσαν
  choice: కొత్తదీ సజీవమైనదీ అయిన
  rationale: మార్గం కొత్తగా స్థాపించబడిందనే భావాన్నీ, అది సజీవమైనదనే అసాధారణమైన మూలభాషా చిత్రాన్నీ వివరణతో చదును చేయకుండా నిలుపుతుంది.
- source_word: διὰ τοῦ καταπετάσματος
  choice: తెర ద్వారా
  rationale: దేవాలయం లేదా ప్రత్యక్ష గుడారంలోని విభజన తెరను ఆధునిక పాఠకుడికి అర్థమయ్యేలా సూచిస్తుంది.
- source_word: τοῦτ’ ἔστιν
  choice: అంటే
  rationale: తర్వాతి పదబంధం ముందున్న తెర రూపకాన్ని వివరిస్తుందని సహజంగా సూచిస్తుంది.
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: ఆయన శరీరమే
  rationale: σάρξ ఇక్కడ యేసు యొక్క భౌతిక మానవత్వాన్ని సూచిస్తుంది. సాధారణ తెలుగులో ‘శరీరం’ సహజంగా ఉండి, తెరతో ఉన్న సమానాధికార వివరణను నిలుపుతుంది.
theological_decisions:
- issue: తెరను యేసు శరీరంతో రూపకాలంకారంగా గుర్తించడం
  choice: ‘అంటే, ఆయన శరీరమే’ అని సమానాధికార వివరణగా అనువదించడం
  alternative: ‘అంటే, ఆయన శరీరం ద్వారా’
  rationale: గ్రీకు τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ ముందున్న ‘తెర’ను వివరిస్తుంది. రెండోసారి ‘ద్వారా’ చేర్చకుండా ఉంచడం గ్రీకు నిర్మాణాన్ని, తెర-శరీరం గుర్తింపులోని ఉద్దేశపూర్వక గాఢతను కాపాడుతుంది.
- issue: σάρξ అనువాదం
  choice: శరీరం
  alternative: మాంసం
  rationale: ఇక్కడ σάρξ పాపస్వభావాన్ని కాక క్రీస్తు యొక్క భౌతిక మానవ దేహాన్ని సూచిస్తుంది. ‘మాంసం’ పదం తెలుగులో అనవసరమైన ఆహార లేదా కేవలం కండర కణజాల భావాన్ని కలిగించవచ్చు; ‘శరీరం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ఇది ముందటి వచనంపై ఆధారపడిన వాక్యఖండం అయినప్పటికీ, అందించిన వచన పరిధిలో సహజంగా చదవడానికి కర్తను స్పష్టంగా ఉంచింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
