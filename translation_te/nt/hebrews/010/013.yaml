  text: τὸ λοιπὸν ἐκδεχόμενος ἕως τεθῶσιν οἱ ἐχθροὶ αὐτοῦ ὑποπόδιον τῶν ποδῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/013.yaml
  text: from then on waiting until his enemies are made a footstool for his feet[b][a],
translation:
  language: te
  text: అప్పటినుంచి, తన శత్రువులు తన పాదాలకు పాదపీఠంగా చేయబడే వరకు ఆయన ఎదురుచూస్తూ ఉన్నాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిరీక్షిస్తూ’ లేదా ‘వేచివుంటూ’ అని కూడా అనువదించవచ్చు. గ్రీకు కృదంతంలో నిరీక్షణతో ఎదురుచూసే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'ఈ మాటలు కీర్తన 110:1ను ప్రతిధ్వనింపజేస్తాయి: “నేను నీ శత్రువులను నీ పాదాలకు పాదపీఠంగా చేసేవరకు నా కుడివైపున కూర్చో.”'
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: అప్పటినుంచి
  rationale: ఈ నపుంసకలింగ పదబంధం క్రియావిశేషణంగా పనిచేసి, ముందటి సందర్భంలో కుమారుడు కూర్చున్నప్పటి నుంచి కొనసాగే కాలాన్ని సూచిస్తుంది.
- source_word: ἐκδεχόμενος
  choice: ఎదురుచూస్తూ ఉన్నాడు
  rationale: ఈ వర్తమాన కృదంతం నిరీక్షణతో కూడిన కొనసాగుతున్న ఎదురుచూపును తెలియజేస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: ἕως
  choice: వరకు
  rationale: ఎదురుచూపు కొనసాగే అంత్యకాలాన్ని పరిచయం చేసే సహజమైన కాలసూచక ప్రయోగం.
- source_word: τεθῶσιν
  choice: చేయబడే
  rationale: τίθημι అనే క్రియ యొక్క కర్మణి ప్రయోగాన్ని నిలుపుతూ, శత్రువులు పాదపీఠంగా చేయబడతారనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: తన శత్రువులు
  rationale: వాక్యంలోని కర్త అయిన ఆయననే సూచించే స్వీయసంబంధ రూపం తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: తన పాదాలకు పాదపీఠంగా
  rationale: కీర్తన 110:1లోని సింహాసనారోహణ చిత్రాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: కీర్తన 110:1లోని మెస్సీయ సింహాసనారోహణ చిత్రం
  choice: శత్రువులు ‘తన పాదాలకు పాదపీఠంగా’ చేయబడతారనే స్పష్టమైన చిత్రాన్ని యథాతథంగా ఉంచడం
  alternative: శత్రువులు ఓడించబడే వరకు / ఆయన పాదాల కింద ఉంచబడే వరకు
  rationale: హెబ్రీయులకు పత్రిక రచయిత ఉద్దేశపూర్వకంగా కీర్తన 110:1ను ప్రతిధ్వనింపజేస్తాడు. దాన్ని కేవలం ఓటమిగా వివరణాత్మకంగా మార్చకుండా ఉంచడం అంతర్గ్రంథ సంబంధాన్నీ, రాజాధికార భావాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా గంభీరమైన వాక్యశైలితో రూపొందించబడింది. ముందటి వచనంతో వ్యాకరణ సంబంధాన్ని కాపాడేందుకు ‘ఆయన’ను స్పష్టంగా చేర్చాం. మూలంలోని కర్మణి రూపాన్నీ పాదపీఠం చిత్రాన్నీ నిలిపాం.
