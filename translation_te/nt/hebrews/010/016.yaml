    text: 'లేదా, తెలుగులో మరింత సరళంగా: “నా నియమాలను వారి హృదయాలపై ఉంచుతాను; వారి మనస్సులపై వాటిని రాస్తాను.”'
    reason: గ్రీకులో మొదటి క్రియ కృదంత రూపంలో ఉంది; ప్రత్యామ్నాయ పఠనం భావాన్ని రెండు సమాపక క్రియలతో సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
