id: HEB.10.16
reference: Hebrews 10:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: te
  text: “ఆ రోజుల తర్వాత నేను వారితో చేయబోయే ఒడంబడిక ఇదే,” అని ప్రభువు చెబుతున్నాడు, “నా నియమాలను వారి హృదయాలపై ఉంచుతూ[a], వారి మనస్సులపై వాటిని రాస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, తెలుగులో మరింత సరళంగా: “నా నియమాలను వారి హృదయాలపై ఉంచుతాను; వారి మనస్సులపై వాటిని రాస్తాను.”'
    reason: గ్రీకులో మొదటి క్రియ కృదంత రూపంలో ఉంది; ప్రత్యామ్నాయ పఠనం భావాన్ని రెండు సమాపక క్రియలతో సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
lexical_decisions:
- source_word: διαθήκη
  choice: ఒడంబడిక
  rationale: యిర్మీయా గ్రంథంలోని నేపథ్యాన్ని, దేవుడు తన ప్రజలతో ఏర్పరచే బంధాన్ని స్పష్టంగా తెలియజేసే సాధారణ బైబిలు పదం.
- source_word: διαθήσομαι
  choice: నేను ... చేసుకునే
  rationale: ఒడంబడికను వ్యక్తులతో చేయడం అనే భావానికి సహజమైన తెలుగు ప్రయోగం; మధ్యమ రూపంలోని సంబంధపరమైన భావాన్ని ‘వారితో ... చేసుకునే’ రూపం వ్యక్తపరుస్తుంది.
- source_word: πρὸς αὐτούς
  choice: వారితో
  rationale: ఒడంబడిక చేసే సందర్భంలో πρὸς వ్యక్తులతో పరస్పర సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘వారితో’ సహజం.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: ఆ రోజుల తర్వాత
  rationale: మూలంలోని కాలసూచక పదబంధాన్ని విస్తరించకుండా సహజంగా నిలుపుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: గ్రీకు κύριοςకు గౌరవప్రదమైన, ఆధునిక ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: διδοὺς
  choice: ఉంచుతూ
  rationale: కృదంత నిర్మాణాన్ని నిలుపుతూ, నియమాలను హృదయాల మీద ఉంచడం అనే రూపకాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: νόμους
  choice: నియమాలను
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతుంది; νόμοςతో ఉన్న న్యాయనియమ సంబంధాన్ని ‘బోధలు’ కంటే స్పష్టంగా కాపాడుతుంది.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: వారి హృదయాల మీద
  rationale: ἐπίలోని ‘మీద’ అనే రూపక దృశ్యాన్ని కాపాడి, తరువాతి ‘మనస్సుల మీద’ అనే సమాంతర నిర్మాణంతో జతచేస్తుంది.
- source_word: διάνοιαν
  choice: మనస్సుల
  rationale: ఆలోచన, అవగాహన జరిగే అంతర్గత సామర్థ్యాన్ని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది; αὐτῶνను బట్టి తెలుగులో పంపిణీ బహువచనం సహజం.
- source_word: ἐπιγράψω
  choice: రాస్తాను
  rationale: ‘మీద’ అనే స్థానసూచనతో కలిపి ἐπιγράφωలోని రాయడం లేదా లిఖించడం అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: αὐτούς
  choice: వాటిని
  rationale: ఈ సర్వనామం ముందున్న ‘నా నియమాలను’ సూచిస్తుందని తెలుగులో లింగ-వచనానుగుణంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యిర్మీయా ఉల్లేఖనంలోని అంతర్గత వాక్యనిర్మాణం
  choice: ‘ఉంచుతూ’ అనే కృదంతాన్ని, తరువాత ‘రాస్తాను’ అనే సమాపక భవిష్యత్ క్రియను నిలుపడం
  alternative: రెండు సమాపక క్రియలుగా ‘ఉంచుతాను ... రాస్తాను’ అని సవరించడం
  rationale: హెబ్రీయులకు రాసిన పత్రికలో లభించే గ్రీకు పాఠం διδοὺς అనే కృదంతాన్ని ఉపయోగిస్తుంది. కొంత అసాధారణంగా అనిపించినా ఆ రూపాన్ని నిలపడం వల్ల యిర్మీయా వాక్యాన్ని సంప్రదాయ అనువాదానికి అనుగుణంగా మౌనంగా సమన్వయపరచకుండా మూలపాఠపు ప్రత్యేకత కాపాడబడుతుంది.
- issue: ‘హృదయాలు’ మరియు ‘మనస్సులు’ అనే అంతర్గత మానవ అంశాల సంబంధం
  choice: రెండింటినీ వేర్వేరు పదాలుగా, సమాంతరంగా ఉంచడం
  alternative: రెండింటినీ కలిపి ‘అంతరంగం’ అని అనువదించడం
  rationale: καρδία మరియు διάνοια వేర్వేరు పదాలు. వాటి మధ్య ఉండగల భావసామీప్యాన్ని అంగీకరిస్తూనే, మూలంలోని ద్వంద్వ రూపకాన్ని చెరపకుండా ఉంచడం అవసరం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఒడంబడిక’, ‘హృదయాలు’, ‘మనస్సులు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉపయోగిస్తూ, గ్రీకు కృదంత నిర్మాణంలోని స్వల్ప అసాధారణతను ఉద్దేశపూర్వకంగా నిలిపింది.
