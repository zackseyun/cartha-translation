id: HEB.6.19
reference: Hebrews 6:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: te
  text: మనకు ఈ నిరీక్షణ మన ప్రాణానికి లంగరువలె ఉంది; అది భద్రమైనదీ స్థిరమైనదీ, తెర వెనుకనున్న అంతర్భాగంలోకి ప్రవేశించేదీ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἣν
  choice: ఈ నిరీక్షణ
  rationale: స్త్రీలింగ సంబంధ సర్వనామం ముందటి వచనంలోని ‘నిరీక్షణ’ను సూచిస్తుంది. తెలుగులో కేవలం ‘దానిని’ అనడం కంటే ‘ఈ నిరీక్షణ’ అని పునరుక్తి చేయడం సూచనను సహజంగా, స్పష్టంగా ఉంచుతుంది.
- source_word: ὡς ἄγκυραν
  choice: లంగరులా
  rationale: ὡς తెలిపే ఉపమానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; నౌకాసంబంధ రూపకం స్పష్టంగా ఉంటుంది.
- source_word: ἔχομεν
  choice: మనకు ... ఉంది
  rationale: వర్తమాన సూచక క్రియను సరళమైన తెలుగు అస్తిత్వ నిర్మాణంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῆς ψυχῆς
  choice: ప్రాణానికి
  rationale: ψυχήను ఇక్కడ మొత్తం అంతరంగ జీవితం/వ్యక్తిని సూచించే అర్థంలో ‘ప్రాణం’గా అనువదించడం రూపకానికి సహజంగా సరిపోతుంది; ‘ఆత్మ’ అనే పదం కలిగించగల నిర్దిష్ట తాత్త్విక విభజనను బలవంతంగా రుద్దదు.
- source_word: ἀσφαλῆ
  choice: సురక్షితమైనది
  rationale: లంగరు రూపకంలో భద్రతనిచ్చే, విఫలం కాని స్వభావాన్ని తెలియజేస్తుంది; తదుపరి విశేషణంతో భేదాన్ని నిలుపుతుంది.
- source_word: τε καὶ
  choice: '...దీ ...దీ'
  rationale: రెండు సమన్విత లక్షణాలనూ తెలుగు సముచ్చయ నిర్మాణంతో స్పష్టంగా కలుపుతుంది.
- source_word: βεβαίαν
  choice: స్థిరమైనది
  rationale: దృఢంగా నిలిచే, ఆధారపడదగిన స్వభావాన్ని సూచిస్తూ ἀσφαλήςతో అర్థభేదాన్ని కాపాడుతుంది.
- source_word: εἰσερχομένην
  choice: ప్రవేశించేదీ అయి ఉంది
  rationale: వర్తమాన కృదంతం లంగరు/నిరీక్షణను ఇంకా వర్ణిస్తోందనే వ్యాకరణ సంబంధాన్ని నిలుపుతుంది; రూపక విస్తరణను వివరణతో మార్చదు.
- source_word: εἰς τὸ ἐσώτερον τοῦ καταπετάσματος
  choice: తెర వెనుకనున్న అంతర్భాగంలోకి
  rationale: ఆలయపు తెరకు అవతల ఉన్న లోపలి స్థలాన్ని ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తూ, మూలంలోని ఆరాధనా స్థల రూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: పరలోక పరిశుద్ధస్థలానికి సంబంధించిన ఆరాధనా రూపకం
  choice: ‘తెర వెనుకనున్న అంతర్భాగం’ అని అనువదించడం
  alternative: ‘తెర లోపలికి’ లేదా ‘తెరకు అవతలికి’
  rationale: καταπέτασμα సూచించే పరిశుద్ధస్థలపు అడ్డుతెరను స్పష్టంగా ఉంచుతుంది; ఆ అంతర్భాగం ఏమిటో ఈ వచనం చెప్పినదానికంటే ఎక్కువగా సిద్ధాంతీకరించదు.
- issue: ψυχή యొక్క భావపరిధి
  choice: ‘ప్రాణం’
  alternative: ‘ఆత్మ’ లేదా ‘జీవితం’
  rationale: ఇక్కడి లంగరు రూపకంలో వ్యక్తి యొక్క జీవమంతటినీ సూచించే విస్తృత భావాన్ని ఉంచుతుంది; శరీరం-ఆత్మ సంబంధంపై ఒక నిర్దిష్ట సిద్ధాంతాన్ని అనువాదంలోకి చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ‘లంగరు,’ ‘తెర,’ ‘అంతర్భాగం’ వంటి స్పష్టమైన పదాలను ఉపయోగించాం. వాక్యాన్ని రెండు భాగాలుగా విభజించడం ద్వారా గ్రీకు వాక్యంలోని దీర్ఘ విశేషణ శ్రేణిని చదవడానికి సులభం చేశాం; రూపకం మరియు దాని వ్యాకరణ సంబంధం మాత్రం నిలుపబడ్డాయి.
