revisions:
- from: మనుషులు తమకంటే గొప్పవాని మీద ఒట్టు పెడతారు; ధ్రువీకరణ కోసం పెట్టే ఆ ఒట్టు వారి ప్రతి వివాదానికీ ముగింపు అవుతుంది.[a]
  to: ఎందుకంటే మనుషులు తమకంటే గొప్పవాని పేరున ప్రమాణం చేస్తారు; ధ్రువీకరణ కోసం ప్రమాణం వారికి ప్రతి వివాదానికీ ముగింపు అవుతుంది.[a]
  rationale: The revision makes the causal connection explicit, replaces an awkward oath idiom with natural modern Telugu, and uses “ప్రమాణం” consistently for the formal oath terminology. It preserves the generic reference, the unspecified superior authority, and the Greek ambiguity in ἀντιλογία through a correctly anchored lexical footnote.
