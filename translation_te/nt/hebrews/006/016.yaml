review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the generic ανθρωποι, the comparative force of κατὰ τοῦ μείζονος, and the dispute-settling function of an oath. However, “గొప్పవాని మీద ఒట్టు పెడతారు” is less idiomatic and can sound spatially literal in modern Telugu. “పేరున ప్రమాణం చేస్తారు” naturally expresses swearing by/invoking a superior authority. The revision also renders γάρ explicitly as “ఎందుకంటే.”
  naturalness: “ప్రమాణం” is more natural than the repeated colloquial “ఒట్టు” in this formal, legal-social maxim. The revised syntax is clear, modern standard Telugu, and preserves the source’s general statement.
  terminology: “మనుషులు” correctly retains the generic human reference. “తమకంటే గొప్పవాని పేరున” preserves the unspecified greater one without importing a referent. “వివాదం,” “ముగింపు,” and “ధ్రువీకరణ” appropriately represent ἀντιλογία, πέρας, and βεβαίωσις.
  issues:
  - severity: medium
    issue: “గొప్పవాని మీద ఒట్టు పెడతారు” is not the most idiomatic modern Telugu expression for swearing by a higher authority.
    rationale: The postposition “మీద” can be understood literally or as an awkward calque. Telugu naturally expresses oath invocation as swearing “పేరున” (in/by the name of).
  - severity: low
    issue: The causal particle γάρ is not represented explicitly.
    rationale: The verse begins with a rationale in its surrounding argument; adding “ఎందుకంటే” preserves this connective without changing meaning.
  - severity: low
    issue: “ఒట్టు” is repeated and is somewhat less formal in this maxim.
    rationale: “ప్రమాణం” retains the oath sense while better matching the elevated legal-social register of the Greek.
  revised_text: ఎందుకంటే మనుషులు తమకంటే గొప్పవాని పేరున ప్రమాణం చేస్తారు; ధ్రువీకరణ కోసం ప్రమాణం వారికి ప్రతి వివాదానికీ ముగింపు అవుతుంది.[a]
