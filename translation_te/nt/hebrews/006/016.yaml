id: HEB.6.16
reference: Hebrews 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: te
  text: ఎందుకంటే మనుషులు తమకంటే గొప్పవాని పేరున ప్రమాణం చేస్తారు; ధ్రువీకరణ కోసం ప్రమాణం వారికి ప్రతి వివాదానికీ ముగింపు అవుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి అభ్యంతరానికీ” లేదా “ప్రతి వ్యతిరేక వాదానికీ”; ἀντιλογία అనే గ్రీకు పదం వివాదం, అభ్యంతరం, లేదా వ్యతిరేక వాదాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωποι
  choice: మనుషులు
  rationale: ఇది పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచించే బహువచనం; ఆధునిక ప్రామాణిక తెలుగులో ‘మనుషులు’ ఆ సాధారణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κατὰ τοῦ μείζονος
  choice: తమకంటే గొప్పవాని మీద
  rationale: ప్రమాణ సందర్భంలో κατά + షష్ఠీ విభక్తి ఎవరినైనా సాక్షిగా లేదా ఉన్నత అధికారంగా ఉద్దేశించి ఒట్టు పెట్టడాన్ని సూచిస్తుంది. ‘తమకంటే’ అనేది తులనాత్మకమైన μείζονος భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ὀμνύουσιν
  choice: ఒట్టు పెడతారు
  rationale: తెలుగులో సాధారణ ప్రమాణ చర్యను నేరుగా, సహజంగా తెలిపే ప్రయోగం.
- source_word: πάσης ... ἀντιλογίας
  choice: ప్రతి వివాదానికీ
  rationale: ἀντιλογία ఇక్కడ కేవలం తార్కిక విరోధం కాక, వాదన లేదా వివాదాన్ని సూచిస్తుంది; ప్రమాణం వివాదాన్ని పరిష్కరించే సందర్భానికి ‘వివాదం’ సరిపోతుంది.
- source_word: πέρας
  choice: ముగింపు
  rationale: మూలంలోని ‘అంతం/ముగింపు’ రూపకాన్ని నిలుపుతూ, వివాదం ఇక కొనసాగకుండా చేయడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς βεβαίωσιν
  choice: ధ్రువీకరణ కోసం
  rationale: εἰς + ద్వితీయా విభక్తి ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; βεβαίωσις‌లోని నిర్ధారణ/స్థిరపరచడం అనే భావాన్ని ‘ధ్రువీకరణ’ కచ్చితంగా అందిస్తుంది.
- source_word: ὁ ὅρκος
  choice: ఆ ఒట్టు
  rationale: గ్రీకులోని నిర్దేశక ఉపపదాన్ని ప్రతిబింబిస్తూ, ముందే ప్రస్తావించిన ఒట్టు పెట్టే చర్యతో అనుసంధానిస్తుంది.
theological_decisions:
- issue: మానవజాతిని సాధారణంగా సూచించే నీతివాక్య స్వరూపం
  choice: మనుషులు
  alternative: పురుషులు
  rationale: ἄνθρωποι ఇక్కడ లింగపరంగా పురుషులకు పరిమితం కాదు; దేవునితో సందర్భానుసారంగా వ్యత్యాసంలో మానవుల సాధారణ ఆచారాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘ఒట్టు పెట్టడం’ సహజ తెలుగు ప్రయోగం; ‘ధ్రువీకరణ’ న్యాయ/సామాజిక సందర్భంలోని βεβαίωσις భావాన్ని నిలుపుతుంది.
