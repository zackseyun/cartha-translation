id: HEB.6.13
reference: Hebrews 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: te
  text: ఎందుకంటే, దేవుడు అబ్రాహాముకు వాగ్దానం చేసినప్పుడు[a], తనకంటే గొప్పవాడైన ఎవరి పేరునూ ప్రమాణం చేయలేకపోవడంతో, తన పేరునే ప్రమాణం చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సరళంగా: ‘దేవుడు అబ్రాహాముకు వాగ్దానం చేశాడు.’'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: ‘ప్రమాణం చేయడానికి తనకంటే గొప్పవాడైన ఎవరూ లేనందున.’'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπαγγειλάμενος
  choice: వాగ్దానం చేసినప్పుడు
  rationale: అయోరిస్ట్ మధ్యమ కృదంతం దేవుడు అబ్రాహాముకు వాగ్దానం చేసిన సందర్భాన్ని ప్రధాన క్రియతో సహజంగా అనుసంధానిస్తుంది; తెలుగులో కాలసూచక ఉపవాక్యం స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἐπεὶ
  choice: కాబట్టి
  rationale: ఇక్కడ ఈ పదం దేవుడు తన మీదనే ప్రమాణం చేయడానికి కారణాన్ని తెలియజేస్తుంది.
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: తనకంటే గొప్పవాడెవరి మీదా
  rationale: ప్రమాణం చేసే సందర్భంలో οὐδενός వ్యక్తిని సూచించడం సహజం; ‘తనకంటే’ అనేది పోలికలో దేవుడే ప్రమాణం చేసే కర్త అని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ὀμόσαι
  choice: ప్రమాణం చేయలేడు
  rationale: εἶχεν‌తో కూడిన అనిర్దిష్ట క్రియారూపం అందుబాటులో ఉన్న అవకాశంలేదనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ఈ నిర్మాణం సహజంగా ఉంటుంది.
- source_word: ὤμοσεν
  choice: ప్రమాణం చేశాడు
  rationale: అయోరిస్ట్ క్రియను నేరుగా అనువదిస్తూ, ὀμόσαιతో ఉన్న పదపునరావృతిని కూడా నిలుపుతుంది.
- source_word: καθ’ ἑαυτοῦ
  choice: తన మీదనే
  rationale: ప్రమాణ భాషలో κατάతో వచ్చిన ఆత్మవాచక సర్వనామం ‘తన మీద’ అనే భావాన్ని ఇస్తుంది; ‘నే’ స్వయంగా దేవునినే ఆధారంగా చేసుకున్నాడనే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ వాక్యం వివరణ లేదా ఆధారం ఇస్తున్న సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: Τῷ ... Ἀβραὰμ
  choice: అబ్రాహాముకు
  rationale: దత్తివిభక్తి వాగ్దానాన్ని అందుకున్న వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘అబ్రాహాముకు’ సూటిగా సరిపోతుంది.
theological_decisions:
- issue: దేవుని ప్రమాణ స్వభావం
  choice: తనకంటే గొప్పవాడెవరి మీదా ప్రమాణం చేయలేక దేవుడు తన మీదనే ప్రమాణం చేశాడు
  alternative: ప్రమాణం చేయడానికి తనకంటే గొప్పవాడు ఎవరూ లేనందున దేవుడు తన మీదనే ప్రమాణం చేశాడు
  rationale: మూలపాఠం దేవుని స్వీయ ప్రమాణాన్ని ఆయనకంటే గొప్పవాడు ఎవరూ లేకపోవడంతో అనుసంధానిస్తుంది. అనువాదం ఈ భావాన్ని నిలుపుతూ, దానిని తరువాతి సిద్ధాంత సూత్రీకరణలతో విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘వాగ్దానం’, ‘ప్రమాణం’ వంటి సాధారణ బైబిలు పదాలు నిలుపబడ్డాయి; మూలంలోని కారణ సంబంధం మరియు ‘ప్రమాణం’ అనే పదపునరావృత్తి సంరక్షించబడ్డాయి.
