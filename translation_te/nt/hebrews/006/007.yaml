id: HEB.6.7
reference: Hebrews 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: te
  text: ఎందుకంటే, తనపై తరచుగా కురిసే వానను తాగి, ఎవరి కోసమైతే అది కూడా సాగు చేయబడుతుందో[b] వారికి ఉపయోగపడే మొక్కలను[a] పండించే భూమి దేవుని నుండి ఆశీర్వాదం పొందుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పచ్చికను,’ ‘వృక్షసంపదను,’ లేదా ‘పంటను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎవరిచేత సాగు చేయబడుతుందో వారికి.’ అయితే ఇక్కడ διά పదం అక్యూసేటివ్ విభక్తితో ఉన్నందున, ‘ఎవరి కోసమైతే సాగు చేయబడుతుందో’ అనే అర్థమే మెరుగ్గా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: భూమి
  rationale: వ్యవసాయ రూపకంలో సాగుచేయబడే నేలను లేదా భూభాగాన్ని సహజంగా సూచిస్తుంది; విశ్వమంతటినీ సూచించే అర్థాన్ని ఇక్కడ రుద్దదు.
- source_word: πιοῦσα
  choice: తాగి
  rationale: భూమి వానను ‘తాగుతుంది’ అనే మూలంలోని సజీవమైన వ్యక్తీకరణను నిలుపుతుంది; ‘పీల్చుకొని’ కంటే రూపకాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: తనపై తరచుగా కురిసే వానను
  rationale: ἐπ’ αὐτῆς మరియు πολλάκις భావాలను సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: τίκτουσα
  choice: పండించే
  rationale: భూమి మొక్కలను ఉత్పత్తి చేయడం అనే వ్యవసాయ సందర్భానికి సహజమైన తెలుగు పదం; మూలంలోని ఫలింపజేసే భావాన్ని తెలియజేస్తుంది.
- source_word: βοτάνην
  choice: మొక్కలను
  rationale: పచ్చిక లేదా పంటతో సహా భూమిపై పెరిగే మొక్కల సమూహాన్ని సాధారణ పాఠకునికి స్పష్టంగా, విస్తృతార్థంతో తెలియజేస్తుంది.
- source_word: εὔθετον
  choice: ఉపయోగపడే
  rationale: అనుకూలమైనది, తగినది అనే భావంతో పాటు వ్యవసాయ ఫలితం ప్రజలకు ప్రయోజనకరమనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: ఎవరి కోసమైతే సాగుచేయబడుతుందో వారికి
  rationale: διά + accusative ఇక్కడ ముఖ్యంగా ఉద్దేశం లేదా ప్రయోజనాన్ని సూచిస్తుంది. καίకి తెలుగులో ప్రత్యేకంగా ‘కూడా’ చేర్చడం అసహజంగా ఉండేందున, ‘కోసమైతే’ నిర్మాణంలోని అనుసంధాన బలంతో భావం వ్యక్తమవుతుంది.
- source_word: γεωργεῖται
  choice: సాగుచేయబడుతుంది
  rationale: వ్యవసాయ పనికి గురయ్యే భూమిని సూచించే passive భావాన్ని విస్తృతంగా, సహజంగా తెలియజేస్తుంది.
- source_word: μεταλαμβάνει
  choice: పొందుతుంది
  rationale: దేవుని నుండి ఆశీర్వాదం అందుకోవడం అనే సందర్భంలో స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: దేవుని నుండి ఆశీర్వాదం
  rationale: మూలంలోని ఆశీర్వాదపు మూలం దేవుడే అనే భావాన్ని, అనవసరమైన నిర్దిష్టతను చేర్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: హెచ్చరిక సందర్భంలోని వ్యవసాయ రూపకం
  choice: వ్యవసాయ రూపకాన్ని ఉన్నదున్నట్లుగా ఉంచి, ఫలించే భూమి దేవుని ఆశీర్వాదం పొందుతుందని మాత్రమే అనువదించడం
  alternative: ఈ భూమి నిజ విశ్వాసులను లేదా ఫలప్రదమైన విశ్వాసులను తప్పనిసరిగా సూచిస్తుందని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: ఈ వచనం వ్యవసాయ ఉపమానంలోని అనుకూల భాగాన్ని చెబుతుంది; పట్టుదల, విశ్వాసత్యాగం లేదా విశ్వాసుల స్థితి గురించి వివాదాస్పద సిద్ధాంత నిర్ణయాన్ని గ్రీకు పాఠం కంటే మించి చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘వానను తాగి’ అనే రూపకం మూలంలోని సజీవతను కాపాడుతుంది. ‘సాగుచేయబడుతుంది’ అనే passive నిర్మాణం కొద్దిగా సాహిత్యబద్ధమైనదైనా మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
