revisions:
- from: కానీ అది ముళ్లను, ముళ్లపొదలను పుట్టిస్తే, అది పనికిరానిది[a], శాపానికి సమీపంగా ఉంది; దాని ముగింపు కాల్చివేయబడడమే.
  to: కానీ అది ముళ్లను, ముళ్ల కలుపు మొక్కలను పుట్టిస్తే, అది పనికిరానిదై[a], శాపానికి దగ్గరగా ఉంది; దాని అంతం దహనానికే.
  rationale: The revision improves modern Telugu syntax and distinguishes the paired agricultural terms while preserving the source’s metaphor, the non-final wording ‘near to a curse,’ and the unexpanded image of burning. The existing footnote anchor remains correctly attached to ἀδόκιμος.
