  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: te
  text: కానీ అది ముళ్లను, ముళ్ల కలుపు మొక్కలను పుట్టిస్తే, అది పనికిరానిదై[a], శాపానికి దగ్గరగా ఉంది; దాని అంతం దహనానికే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తిరస్కరించబడినది.”
    reason: ἀδόκιμοςకు ‘తిరస్కరించబడినది’ అనే బలమైన ప్రత్యామ్నాయ అర్థం కూడా ఉంది.
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: పుట్టిస్తే
  rationale: ముందటి వచనంలోని భూమిని సూచించే వర్తమాన కృదంతం. వ్యవసాయ రూపకంలో భూమి ముళ్లను ఉత్పత్తి చేయడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: కానీ
  rationale: 6:7లోని ఫలవంతమైన భూమికి ఇక్కడ స్పష్టమైన వ్యతిరేకతను సూచిస్తుంది.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: ముళ్లను, ముళ్లపొదలను
  rationale: రెండు వేర్వేరు ముళ్ల మొక్కల పదాలను సాధ్యమైనంతగా వేరుచేస్తూ, ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే వ్యవసాయ చిత్రాన్ని నిలుపుతుంది.
- source_word: ἀδόκιμος
  choice: పనికిరానిది
  rationale: పరీక్షలో నిలవని లేదా ఉపయోగానికి తగని భూమి అనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘తిరస్కరించబడినది’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: κατάρας ἐγγύς
  choice: శాపానికి సమీపంగా ఉంది
  rationale: గ్రీకులోని నామవాచక నిర్మాణాన్ని నిలుపుతూ, శాపం ఇంకా తుదిగా అమలైందని చెప్పకుండా దాని సమీపతను వ్యక్తం చేస్తుంది.
- source_word: ἧς τὸ τέλος
  choice: దాని ముగింపు
  rationale: ముందటి భూమినే సూచిస్తుంది; τέλος లోని ముగింపు లేదా అంతిమ పరిణామ భావాన్ని అతిగా విపులీకరించదు.
- source_word: εἰς καῦσιν
  choice: కాల్చివేయబడడమే
  rationale: దహనానికి అనే ఉద్దేశ్య/ఫలిత భావాన్ని సహజమైన తెలుగులో అందిస్తూ, దీనిని నరకం లేదా అంతిమ తీర్పుగా స్పష్టీకరించకుండా రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ముందటి వచనంలోని భూమిని ఈ వచనంలో మళ్లీ స్పష్టంగా పేర్కొనాలా
  choice: గ్రీకులో నామవాచకం పునరుక్తం కానందున ‘అది’ అని కొనసాగించడం
  alternative: ‘ముళ్లను... పుట్టించే భూమి’ అని స్పష్టీకరించడం
  rationale: స్త్రీలింగ కృదంతం ముందటి భూమిని స్పష్టంగా కొనసాగించినా, మూలంలో లేని నామవాచకాన్ని చేర్చకుండా సందర్భ సంబంధాన్ని నిలుపుతుంది.
- issue: ἀδόκιμοςను బలమైన తీర్పు పదంతో అనువదించాలా
  choice: ప్రధాన పాఠ్యంలో ‘పనికిరానిది’
  alternative: ‘తిరస్కరించబడినది’
  rationale: తక్షణ సందర్భం భూమి ఉపయోగకరతకు సంబంధించినది. అయితే ‘తిరస్కరించబడినది’ అనే గంభీరమైన సాధ్యార్థాన్ని పాదటిప్పణిలో భద్రపరచడం ద్వారా భావ పరిధిని నిలుపుతున్నాం.
- issue: εἰς καῦσινను అంతిమ తీర్పుగా వివరించాలా
  choice: వ్యవసాయ రూపకంలోని కాల్చివేత చిత్రాన్నే ఉంచడం
  alternative: ‘అగ్ని తీర్పుకు’ అని స్పష్టీకరించడం
  rationale: మూల వాక్యం దహనాన్ని చెబుతుంది గాని దాని పూర్తి సిద్ధాంతపరమైన సూచనను స్వయంగా నిర్వచించదు; కాబట్టి ఆ ఉత్కంఠను పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే హెచ్చరిక యొక్క గంభీరతను, వ్యవసాయ రూపకాన్ని నిలుపుతూ గౌరవప్రదమైన శైలి ఉపయోగించబడింది.
