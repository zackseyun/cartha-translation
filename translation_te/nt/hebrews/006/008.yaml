    text: లేదా, “తిరస్కరించబడినది.”
    reason: ἀδόκιμοςకు ‘తిరస్కరించబడినది’ అనే బలమైన ప్రత్యామ్నాయ అర్థం కూడా ఉంది.
  revision_rationale: The revision improves modern Telugu syntax and distinguishes the paired agricultural terms while preserving the source’s metaphor, the non-final wording ‘near to a curse,’ and the unexpanded image of burning. The existing footnote anchor remains correctly attached to ἀδόκιμος.
