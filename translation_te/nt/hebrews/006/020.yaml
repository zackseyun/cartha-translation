id: HEB.6.20
reference: Hebrews 6:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: te
  text: మన తరఫున[a] ముందుగా వెళ్లినవానిగా యేసు అక్కడికి ప్రవేశించాడు; మెల్కీసెదెకు క్రమం ప్రకారం[b] ఆయన శాశ్వతంగా ప్రధాన యాజకుడయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మన కోసం’ అని కూడా అనువదించవచ్చు. గ్రీకు పదబంధం ఇతరుల ప్రయోజనం కోసం లేదా వారి తరఫున చేసే కార్యాన్ని సూచించగలదు; ఇక్కడ యేసు మన ప్రతినిధిగా ప్రవేశించడాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మెల్కీసెదెకు క్రమంలో’ అని కూడా అనువదించవచ్చు. ఇది కీర్తన 110:4ను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: అక్కడ
  rationale: మునుపటి వచనంలో చెప్పిన తెర అవతలి అంతర్భాగాన్ని తిరిగి సూచించే సహజమైన స్థానవాచక అనుసంధానం.
- source_word: πρόδρομος
  choice: ముందుగా వెళ్లినవాడు
  rationale: ఇతరులకు ముందుగా వెళ్లి మార్గం తెరిచే వ్యక్తి అనే రూపక భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπὲρ ἡμῶν
  choice: మన పక్షంగా
  rationale: యేసు మన ప్రయోజనం కోసం, మన ప్రతినిధిగా ప్రవేశించాడనే భావాన్ని ఉంచుతుంది; ‘మన స్థానంలో’ అని అనువదించి ఈ సందర్భంలో స్పష్టంగా లేని బలమైన ప్రతిస్థాపన భావాన్ని చేర్చదు.
- source_word: εἰσῆλθεν
  choice: ప్రవేశించాడు
  rationale: ఒక నిర్దిష్ట స్థలంలోకి వెళ్లడాన్ని తెలిపే గ్రీకు క్రియకు సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: మెల్కీసెదెకు క్రమం ప్రకారం
  rationale: కీర్తన 110:4తో ఉన్న ప్రతిధ్వనిని, అలాగే నమూనా లేదా నియామక క్రమానికి అనుగుణత అనే భావాన్ని కాపాడుతుంది.
- source_word: ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: హెబ్రీయులకు పత్రిక వాదనలో కేంద్రమైన యాజక పదవికి తెలుగులో ప్రామాణికమైన పదబంధం.
- source_word: γενόμενος
  choice: అయ్యాడు
  rationale: యేసు ప్రధాన యాజకుని పదవి, పాత్రను స్వీకరించాడనే క్రియాత్మక భావాన్ని నిలుపుతుంది; ఆయన ఉనికిలోకి వచ్చాడని లేదా స్వభావం మారిందని సూచించదు.
- source_word: εἰς τὸν αἰῶνα
  choice: శాశ్వతంగా
  rationale: నిలిచియుండే శాశ్వతత్వాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: γενόμενος అనే పదానికి క్రీస్తు స్వరూపంతో ఉన్న సంబంధం
  choice: ‘ప్రధాన యాజకుడయ్యాడు’ అని పదవి మరియు పాత్ర స్వీకరణగా అనువదించబడింది.
  alternative: ‘ప్రధాన యాజకునిగా నియమించబడ్డాడు’
  rationale: గ్రీకు క్రియారూపాన్ని తొలగించకుండా ఉంచుతుంది; అదే సమయంలో యేసు అప్పుడే ఉనికిలోకి వచ్చాడని గాని ఆయన దైవిక స్వభావం మారిందని గాని చెప్పదు.
- issue: ὑπὲρ ἡμῶν యొక్క భావం
  choice: ‘మన పక్షంగా’ అని ప్రతినిధిత్వం మరియు ప్రయోజన భావాలతో అనువదించబడింది.
  alternative: ‘మన కోసం’; ‘మన స్థానంలో’
  rationale: ఈ సందర్భంలో యేసు విశ్వాసులకు ముందుగా పరలోక పరిశుద్ధస్థలంలోకి ప్రవేశించడమే ప్రధాన భావం. అందువల్ల వాక్యంలో స్పష్టంగా లేని ప్రత్యేక ప్రాయశ్చిత్త సిద్ధాంతార్థాన్ని బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే ‘ప్రధాన యాజకుడు’, ‘మెల్కీసెదెకు క్రమం’ వంటి పత్రికకు కీలకమైన పదాలను గౌరవప్రదంగా, ఖచ్చితంగా నిలుపుకుంది.
