id: HEB.6.17
reference: Hebrews 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: te
  text: ఈ విధంగా దేవుడు తన సంకల్పపు మార్పులేని స్వభావాన్ని[a] వాగ్దాన వారసులకు మరింత స్పష్టంగా చూపించాలని ఉద్దేశించి, ప్రమాణంతో హామీ ఇచ్చాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన సంకల్పం మార్పులేనిదని.’
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘ప్రమాణంతో జోక్యం చేసుకున్నాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: అందువల్ల
  rationale: ముందటి వచనంలో దేవుడు అబ్రాహాముకు ప్రమాణం చేసిన విషయంతో ఈ వాక్యాన్ని అనుసంధానించే తార్కిక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: περισσότερον
  choice: మరింత స్పష్టంగా
  rationale: ἐπιδεῖξαιతో కలిసి దేవుడు తన సంకల్ప స్థిరత్వాన్ని మరింత స్పష్టంగా చూపించాలనే భావాన్ని ఇస్తుంది.
- source_word: βουλόμενος
  choice: ఉద్దేశించి
  rationale: కేవలం కోరికకన్నా దేవుని ఆలోచితమైన ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: ἐπιδεῖξαι
  choice: చూపాలని
  rationale: ప్రదర్శించడం లేదా స్పష్టపరచడం అనే మూల భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: వాగ్దానానికి వారసులైన వారికి
  rationale: వాగ్దానం ద్వారా లభించేదాన్ని స్వీకరించబోయే వారనే ఒడంబడిక సంబంధిత భావాన్ని నిలుపుతుంది.
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: తన సంకల్పం మార్పులేనిదని
  rationale: దేవుని సంకల్పం మార్చలేనిది లేదా స్థిరమైనది అనే భావాన్ని సూటిగా, సులభంగా తెలియజేస్తుంది; అనవసరమైన తాత్త్విక పరిభాషను నివారిస్తుంది.
- source_word: ἐμεσίτευσεν
  choice: దానికి హామీ ఇచ్చాడు
  rationale: ప్రమాణం ద్వారా దేవుడు అదనపు నిశ్చయత కలిగించాడనే సందర్భోచిత కార్యార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; క్రియలో అంతర్లీనంగా ఉన్న కర్మను ‘దానికి’గా వ్యక్తం చేసింది.
- source_word: ὅρκῳ
  choice: ప్రమాణం చేసి
  rationale: దేవుడు హామీ ఇచ్చిన సాధనం ప్రమాణమేనని స్పష్టంగా తెలియజేసే సహజ తెలుగు ప్రయోగం.
theological_decisions:
- issue: దేవుని βουλή యొక్క మార్పులేని స్వభావం
  choice: తన సంకల్పం మార్పులేనిదని
  alternative: తన ఆలోచన యొక్క మార్పులేని స్వభావాన్ని
  rationale: మూలపాఠం దేవుని సంకల్పం స్థిరమైనదని నొక్కిచెబుతుంది. ‘సంకల్పం’ ఉద్దేశపూర్వక నిర్ణయ భావాన్ని కాపాడుతూ, తరువాతి తాత్త్విక వర్గీకరణలను పాఠ్యంలోకి తీసుకురాదు.
- issue: ἐμεσίτευσεν మరియు ప్రమాణం మధ్య సంబంధం
  choice: ప్రమాణం చేసి దానికి హామీ ఇచ్చాడు
  alternative: ప్రమాణంతో మధ్యవర్తిగా నిలిచాడు
  rationale: ఇక్కడ దేవుడు మరొకరి మధ్యవర్తిగా వ్యవహరించాడని కాక, తన ప్రమాణం ద్వారా వాగ్దాన వారసులకు నిశ్చయత కలిగించాడని సందర్భం సూచిస్తుంది. ప్రత్యామ్నాయంలోని మరింత అక్షరార్థ భావాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని తార్కిక అనుసంధానం, దేవుని ఉద్దేశపూర్వక చర్య, సంకల్ప స్థిరత్వం, ప్రమాణం ఇచ్చే నిశ్చయత అన్నీ నిలుపబడ్డాయి. మూల ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదటిప్పణి సూచికలు వాటి విషయాలతో తారుమారైనట్లు కనిపించినందున, తెలుగు ముసాయిదాలో ప్రతి ప్రత్యామ్నాయాన్ని సంబంధిత పదబంధానికే అనుసంధానించాం.
