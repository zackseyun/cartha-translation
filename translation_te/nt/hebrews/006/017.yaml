revisions:
- from: అందువల్ల దేవుడు తన సంకల్పం మార్పులేనిదని వాగ్దానానికి వారసులైన వారికి మరింత స్పష్టంగా చూపాలని ఉద్దేశించి, ప్రమాణం చేసి దానికి హామీ ఇచ్చాడు.[a][b]
  to: ఈ విధంగా దేవుడు తన సంకల్పపు మార్పులేని స్వభావాన్ని[a] వాగ్దాన వారసులకు మరింత స్పష్టంగా చూపించాలని ఉద్దేశించి, ప్రమాణంతో హామీ ఇచ్చాడు.[b]
  rationale: సవరణ మూల గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుకరించకుండా, దాని ప్రధాన నిర్మాణాలను కాపాడుతుంది. ‘సంకల్పపు మార్పులేని స్వభావం’ ἀμετάθετον τῆς βουλῆς αὐτοῦను స్పష్టంగా ప్రతిబింబిస్తుంది; ‘వాగ్దాన వారసులు’ సహజమైన తెలుగు సమాసం; ‘ప్రమాణంతో హామీ ఇచ్చాడు’ సందర్భంలో ἐμεσίτευσεν ὅρκῳ యొక్క నిశ్చయపరచే కార్యాన్ని తెలియజేస్తుంది. పాదటిప్పణులు మూలంలోని సాధ్యమైన ప్రత్యామ్నాయాన్ని సూచిస్తూ, ప్రధాన పాఠానికి సరైన స్థానాల్లో జతచేయబడ్డాయి.
