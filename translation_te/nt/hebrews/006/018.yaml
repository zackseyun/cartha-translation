  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: te
  text: దేవుడు అబద్ధమాడడం అసాధ్యమైన రెండు మార్పులేని విషయాల ద్వారా, ఆశ్రయం కోసం పారిపోయిన మనకు[b] మన ముందుంచబడిన నిరీక్షణను గట్టిగా పట్టుకోవడానికి[a] బలమైన ప్రోత్సాహం కలగునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గట్టిగా పట్టుకోవడానికి’ అనే గ్రీకు క్రియకు ‘పట్టుకోవడం,’ ‘బలంగా అందుకోవడం,’ లేదా ‘విడువకుండా పట్టుకొని ఉండడం’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆశ్రయం కోసం పారిపోయిన’ అనే మాట రక్షణ కోసం సురక్షిత స్థలానికి పరుగెత్తే చిత్రాన్ని సూచిస్తుంది; ఇది పాత నిబంధనలోని ఆశ్రయ పట్టణాలను కూడా జ్ఞాపకం చేయవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: పొందేలా
  rationale: మునుపటి వాక్యంలోని దేవుని కార్యానికి సంబంధించిన ఉద్దేశం లేదా ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: ఈ రెండు మార్పులేని విషయాల ద్వారా
  rationale: πράγματα అనే విస్తృత పదాన్ని ‘విషయాలు’గా ఉంచి, సందర్భంలో అవి వాగ్దానం మరియు ప్రమాణాన్ని సూచిస్తున్నప్పటికీ వాటిని వచనంలో వివరణాత్మకంగా చేర్చలేదు; ἀμεταθέτων యొక్క మార్పుచెందని భావాన్ని నిలుపుతుంది.
- source_word: ἐν οἷς ἀδύνατον ψεύσασθαι θεόν
  choice: దేవుడు అబద్ధమాడడం అసాధ్యమైన
  rationale: దేవుడు అబద్ధమాడలేడనే గ్రీకు వాక్య నిర్మాణంలోని గంభీరమైన అసాధ్యతను కాపాడుతుంది; దీనిని అదనపు తాత్త్విక వివరణగా విస్తరించదు.
- source_word: ἰσχυρὰν παράκλησιν ἔχωμεν
  choice: బలమైన ప్రోత్సాహం పొందేలా
  rationale: παράκλησις ఇక్కడ ధైర్యం, ఆదరణ, ప్రోత్సాహం వంటి భావాలను కలిగి ఉంది; ‘ప్రోత్సాహం’ సందర్భంలోని బలపరిచే ప్రభావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οἱ καταφυγόντες
  choice: ఆశ్రయం కోసం పారిపోయిన మనం
  rationale: రక్షణస్థలానికి పారిపోవడం అనే స్పష్టమైన ఆశ్రయ రూపకాన్ని నిలుపుతుంది; కేవలం ‘ఆశ్రయించిన’ అని చెప్పి చలన భావాన్ని తగ్గించదు.
- source_word: κρατῆσαι
  choice: గట్టిగా పట్టుకోవడానికి
  rationale: క్రియలోని పట్టుకోవడం, దృఢంగా అంటిపెట్టుకోవడం అనే అర్థ పరిధిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘స్వాధీనం చేసుకోవడం’ అనే అవసరానికి మించిన భావాన్ని నివారిస్తుంది.
- source_word: τῆς προκειμένης ἐλπίδος
  choice: మన ముందుంచబడిన నిరీక్షణను
  rationale: నిరీక్షణ మనకు ప్రతిపాదించబడినదిగా లేదా ఎదుట ఉంచబడినదిగా ఉన్న వస్తుగత రూపాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఆశ్రయం మరియు నిరీక్షణ రూపకాల సంబంధం
  choice: ‘ఆశ్రయం కోసం పారిపోయిన’ మరియు ‘నిరీక్షణను గట్టిగా పట్టుకోవడానికి’ అనే సజీవ రూపకాలను నిలుపడం
  alternative: ‘ఆశ్రయించిన మనం నిరీక్షణలో స్థిరంగా ఉండడానికి’
  rationale: గ్రీకు పాఠంలోని పారిపోవడం మరియు పట్టుకోవడం అనే రెండు క్రియాత్మక చిత్రాలను సిద్ధాంతపరమైన అమూర్త భాషగా మార్చకుండా కాపాడుతుంది.
- issue: దేవుని సత్యనిష్ఠ
  choice: ‘దేవుడు అబద్ధమాడడం అసాధ్యం’
  alternative: ‘దేవుడు అబద్ధమాడలేడు’
  rationale: మూలంలోని ἀδύνατον అనే అసాధ్యతా నిర్మాణాన్ని కాపాడుతూ, పాఠం చెప్పినదానికంటే మించిన తాత్త్విక వ్యవస్థీకరణను చేర్చదు.
- issue: రెండు మార్పులేని విషయాల గుర్తింపు
  choice: వచనంలో వాటిని సాధారణంగా ‘రెండు మార్పులేని విషయాలు’గానే ఉంచడం
  alternative: ‘దేవుని వాగ్దానం మరియు ప్రమాణం’ అని స్పష్టీకరించడం
  rationale: సందర్భం వాగ్దానం మరియు ప్రమాణాన్ని సూచించినా, ఈ వచనం వాటికి మళ్లీ పేర్లు పెట్టదు; అందువల్ల మూలపాఠంలోని సూచనాత్మక నిర్మాణాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని దీర్ఘ ఉద్దేశ్య నిర్మాణాన్ని సహజంగా చేయడానికి ‘ఇలా జరిగింది’ను చివర ఉంచాం. [a], [b] గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి; అవి వరుసగా ‘గట్టిగా పట్టుకోవడానికి’ మరియు ‘ఆశ్రయం కోసం పారిపోయిన’ భాగాలకు సంబంధించినవి.
