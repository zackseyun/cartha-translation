    issue: 'Orthographic and stylistic refinement: “వేచివుండి” and “ఆ విధంగా.”'
    rationale: Modern standard Telugu normally writes the auxiliary construction as “వేచి ఉండి.” “అలా” is a more idiomatic concise rendering of οὕτως in this context; the connective relationship remains clear in Telugu discourse.
  revised_text: అలా, అతడు ఓర్పుతో వేచి ఉండి, వాగ్దానాన్ని పొందాడు.[a]
