- from: ఆ విధంగా, అతడు ఓర్పుతో వేచివుండి, వాగ్దానాన్ని పొందాడు.[a]
  to: అలా, అతడు ఓర్పుతో వేచి ఉండి, వాగ్దానాన్ని పొందాడు.[a]
  rationale: The revision is limited to modern-standard orthography and smoother idiom. It preserves the Greek participial relationship (“having waited patiently”) and leaves ἐπέτυχεν τῆς ἐπαγγελίας as “obtained the promise,” rather than paraphrasing it as complete fulfillment.
