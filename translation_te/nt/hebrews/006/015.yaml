  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: te
  text: అలా, అతడు ఓర్పుతో వేచి ఉండి, వాగ్దానాన్ని పొందాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాగ్దానం చేయబడినదాన్ని పొందాడు.” గ్రీకు పాఠం మరింత అక్షరార్థంగా “వాగ్దానాన్ని పొందాడు” అని చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ οὕτως
  choice: ఆ విధంగా
  rationale: ముందున్న అబ్రాహాము వృత్తాంతంతో సంబంధాన్ని చూపుతూ, జరిగిన విధానాన్ని లేదా ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μακροθυμήσας
  choice: ఓర్పుతో వేచివుండి
  rationale: దీర్ఘకాలం సహనంతో ఎదురుచూడడాన్ని సూచించే క్రియారూప భావాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది; ముందుగా జరిగిన చర్య అనే భావాన్ని కూడా నిలుపుతుంది.
- source_word: ἐπέτυχεν
  choice: పొందాడు
  rationale: ప్రయత్నం లేదా నిరీక్షణ అనంతరం సాధించడం/పొందడం అనే అర్థాన్ని సరళంగా తెలియజేస్తుంది; సంపూర్ణ నెరవేర్పు అని అదనంగా నిర్దేశించదు.
- source_word: τῆς ἐπαγγελίας
  choice: వాగ్దానాన్ని
  rationale: గ్రీకు నామవాచకాన్ని నేరుగా నిలుపుతూ, దేవుడు అబ్రాహాముకు చేసిన నిర్దిష్ట వాగ్దానంతో పరిసర వచనాల పదసంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἐπέτυχεν τῆς ἐπαγγελίας అనేది అబ్రాహాము వాగ్దానపు సంపూర్ణ నెరవేర్పును పొందాడని అర్థమా, లేక వాగ్దానాన్ని పొందాడని అర్థమా?
  choice: వాగ్దానాన్ని పొందాడు
  alternative: వాగ్దానం చేయబడినదాన్ని పొందాడు
  rationale: గ్రీకు పాఠం అక్షరార్థంగా ‘వాగ్దానాన్ని పొందాడు’ అని చెబుతుంది; సంపూర్ణ నెరవేర్పును స్పష్టంగా పేర్కొనదు. అందువల్ల హెబ్రీయుల పత్రికలో ఉన్న భావ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘ఓర్పుతో వేచివుండి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండటంతో పాటు μακροθυμέω యొక్క దీర్ఘసహన భావాన్ని అందిస్తుంది.
