review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys God's justice, the recipients' work, love directed toward God's name, and both past and ongoing service to the saints. However, its Telugu word order allows “మీరు చూపిన” (“you showed”) to modify both “work” and “love,” whereas ἧς (“which”) grammatically refers specifically to “love.” The revision makes this relationship explicit while retaining the participial distinction between completed and continuing service.
  naturalness: The current fronted service clauses followed by “ఆ విధంగా” are understandable but somewhat discontinuous in modern Telugu. Placing the service expression directly with “ప్రేమను” produces a smoother sentence and makes the means by which love was demonstrated clear.
  terminology: “అన్యాయస్థుడు,” “పని,” “ప్రేమ,” and “పరిశుద్ధులు” are suitable. “ఆయన నామం నిమిత్తం” is more idiomatic in this devotional context than “ఆయన నామం పట్ల,” while the latter remains a valid lexical alternative in the footnote. “పరిశుద్ధులు” appropriately retains the established New Testament collective designation.
  issues:
  - severity: medium
    issue: The relative expression “మీరు చూపిన” can be read as modifying both “మీ పనినీ” and “ప్రేమనూ.”
    rationale: In Greek, ἧς is feminine singular and modifies μόνο τῆς ἀγάπης (“the love”), not τοῦ ἔργου (“the work”). The Telugu syntax should clearly attach “you showed” to love alone.
  - severity: low
    issue: “ఆ విధంగా” creates a slightly loose explanatory connection after the independent service clauses.
    rationale: The Greek participles directly explain how the love was shown. Integrating them with the phrase about love is more natural and closer to the source relationship.
  revised_text: ఎందుకంటే, దేవుడు మీ పనిని, అలాగే పరిశుద్ధులకు[b] సేవ చేసి ఇంకా సేవ చేస్తూ ఆయన నామం నిమిత్తం మీరు చూపిన ప్రేమను మరచిపోయేంత అన్యాయస్థుడు కాడు.
  revised_footnotes:
  - marker: a
    text: లేదా, ‘ఆయన నామం పట్ల.’
    reason: lexical_alternative
  - marker: b
