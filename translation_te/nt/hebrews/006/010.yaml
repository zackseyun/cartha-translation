revisions:
- from: ఎందుకంటే, మీరు పరిశుద్ధులకు[b] సేవ చేశారు, ఇంకా సేవ చేస్తూనే ఉన్నారు[c]; ఆ విధంగా ఆయన నామం పట్ల[a] మీరు చూపిన మీ పనినీ ప్రేమనూ మరచిపోయేంత అన్యాయస్థుడు దేవుడు కాడు.
