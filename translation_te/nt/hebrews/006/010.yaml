id: HEB.6.10
reference: Hebrews 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: te
  text: ఎందుకంటే, దేవుడు మీ పనిని, అలాగే పరిశుద్ధులకు[b] సేవ చేసి ఇంకా సేవ చేస్తూ ఆయన నామం నిమిత్తం మీరు చూపిన ప్రేమను మరచిపోయేంత అన్యాయస్థుడు కాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: అంటే, తోటి విశ్వాసులు. ఇక్కడ ‘పరిశుద్ధులు’ అనేది దేవునికి చెందిన పవిత్ర ప్రజలను సూచిస్తుంది; తరువాతి కాలంలో అధికారికంగా గుర్తించబడిన ప్రత్యేక ‘సంతుల’ వర్గాన్ని కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἄδικος
  choice: అన్యాయస్థుడు
  rationale: దేవుడు వారి సేవను విస్మరించడం న్యాయానికి విరుద్ధమని గ్రీకు పదం తెలిపే భావాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐπιλαθέσθαι
  choice: మరచిపోవడం
  rationale: మూలపదపు ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; సందర్భంలో వారి కార్యాలను పరిగణనలోకి తీసుకోకుండా ఉండడం అనే కార్యసంబంధ భావం అంతర్లీనంగా ఉంటుంది.
- source_word: ἔργου
  choice: పని
  rationale: ఏకవచన సమాహార భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἀγάπης
  choice: ప్రేమ
  rationale: ἀγάπηకి సూటిగా సరిపడే సాధారణ పదం; ఇక్కడ అది సేవ ద్వారా వ్యక్తమైన ప్రేమ.
- source_word: ἐνεδείξασθε
  choice: మీరు చూపిన
  rationale: ప్రేమను కార్యరూపంలో వెల్లడించడం లేదా నిరూపించడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: ఆయన నామం పట్ల
  rationale: εἰς యొక్క దిశ, అంకితభావ ఛాయను నిలుపుతూ ‘నామం’ అనే బైబిలు ప్రతీకను వివరణలో కలిపివేయకుండా ఉంచుతుంది.
- source_word: διακονήσαντες
  choice: సేవ చేశారు
  rationale: అఒరిస్ట్ కృదంతం సూచించే గత సేవను సహజ తెలుగు ప్రధాన క్రియగా వ్యక్తపరుస్తుంది.
- source_word: τοῖς ἁγίοις
  choice: పరిశుద్ధులకు
  rationale: కొత్త నిబంధనలో విశ్వాసుల సమూహానికి వాడే పదాన్ని నిలుపుతుంది; తరువాతి కాలపు అధికారిక ‘సంతుల’ వర్గాన్ని సూచించదు.
- source_word: διακονοῦντες
  choice: ఇంకా సేవ చేస్తూనే ఉన్నారు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను, ముందటి గతకాల సేవతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ వాక్యం మానవ కార్యాల వల్ల దేవుని ఎదుట పుణ్యం సంపాదించడాన్ని బోధిస్తుందా, లేక విశ్వాసుల కార్యాలను దేవుడు న్యాయంగా గుర్తుంచుకుంటాడని చెబుతుందా?
  choice: వారి పనినీ ప్రేమనూ దేవుడు మరచిపోడని, ఆయన న్యాయాన్ని ఆధారంగా చేసుకొని వాక్యాన్ని అనువదించాం; ఆ కార్యాలు రక్షణను సంపాదిస్తాయని చేర్చలేదు.
  alternative: మానవ కార్యాల కారణంగా దేవుడు ప్రతిఫలం ఇవ్వడానికి ఋణపడి ఉన్నాడనే మరింత పుణ్యకేంద్రీకృత అర్థం.
  rationale: గ్రీకు పాఠం దేవుడు వారి పనినీ ప్రేమనూ మరచిపోవడానికి అన్యాయస్థుడు కాడని మాత్రమే స్పష్టంగా చెబుతుంది. అందువల్ల దైవ న్యాయం, జ్ఞాపకం అనే ఉద్వేగాన్ని నిలుపుతూ, మూలంలో లేని సంపాదిత రక్షణ భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. గ్రీకులోని గత సేవ (διακονήσαντες), కొనసాగుతున్న సేవ (διακονοῦντες) మధ్య భేదాన్ని ‘సేవ చేశారు, ఇంకా సేవ చేస్తూనే ఉన్నారు’ అని స్పష్టపరచాం. తెలుగు సహజ వాక్యనిర్మాణం కోసం కృదంతాలను స్వతంత్ర క్రియలుగా మార్చి, వాటి వివరణాత్మక సంబంధాన్ని ‘ఆ విధంగా’తో కలిపాం.
