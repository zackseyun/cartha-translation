reference: Hebrews 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: te
  text: మరియు వెనుదిరిగిపోయినవారిని[a] మళ్లీ పశ్చాత్తాపానికి పునరుద్ధరించడం[b]—ఎందుకంటే వారు తమకొరకు దేవుని కుమారుణ్ణి మళ్లీ సిలువ వేస్తూ, ఆయనను బహిరంగంగా అవమానానికి గురిచేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మతభ్రష్టులైనవారిని.’ గ్రీకు క్రియ తీవ్రమైన వెనుదిరుగుదలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారు తమకొరకు దేవుని కుమారుణ్ణి మళ్లీ సిలువ వేస్తూ, ఆయనను బహిరంగంగా అవమానానికి గురిచేస్తున్నంతకాలం.’ గ్రీకు కృదంతాలను వివరణాత్మకంగానే కాక సమకాలికంగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: తొలగిపోయినవారిని
  rationale: ఈ సందర్భంలో తీవ్రమైన వెనుదిరుగుదలను సూచిస్తుంది. ‘తొలగిపోయిన’ అనే పదం హెచ్చరిక తీవ్రతను నిలుపుతూ, తరువాతి కాలపు నిర్దిష్ట సిద్ధాంతపరమైన అర్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ఈ క్రియావిశేషణం సహజంగా ‘నూతనపరచడం’ అనే క్రియను విశేషించి, పునరావృతిని తెలియజేస్తుంది.
- source_word: ἀνακαινίζειν
  choice: నూతనపరచడం
  rationale: మునుపటి స్థితికి తిరిగి నూతనంగా చేయడం లేదా పునరుద్ధరించడం అనే భావాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: εἰς μετάνοιαν
  choice: పశ్చాత్తాపానికి
  rationale: εἰς తెలిపే లక్ష్యం లేదా దిశను ‘-కి’ ద్వారా, μετάνοια యొక్క సాధారణ బైబిలు భావాన్ని ‘పశ్చాత్తాపం’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνασταυροῦντας
  choice: మళ్లీ సిలువ వేస్తూ
  rationale: ἀνά- లోని పునరావృతి భావాన్ని ‘మళ్లీ’ స్పష్టంగా చూపుతుంది; వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను ‘వేస్తూ’ నిలుపుతుంది.
- source_word: ἑαυτοῖς
  choice: తమకు తామే
  rationale: ప్రతిబింబక దత్తివిభక్తి వారి స్వంత బాధ్యతతో, తమ సంబంధంలో చేస్తున్న చర్యను సూచిస్తుంది. ఈ తెలుగు ప్రయోగం దోషభారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: దేవుని కుమారుణ్ణి
  rationale: క్రీస్తును సూచించే బిరుదును నేరుగా, సంపూర్ణంగా అనువదిస్తుంది.
- source_word: παραδειγματίζοντας
  choice: బహిరంగంగా అవమానానికి గురిచేస్తున్నారు
  rationale: ప్రజల ఎదుట అపకీర్తి లేదా అవమానానికి గురిచేయడం అనే సామాజిక భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఈ వచనంలో ముందటి వచనం నుంచి వచ్చిన ‘అసాధ్యం’ అనే భావాన్ని మళ్లీ స్పష్టంగా చేర్చాలా?
  choice: కొత్త సమాపక క్రియను చేర్చకుండా, ‘అలాగే’తో ముందటి వాక్య నిర్మాణాన్నే కొనసాగించడం.
  alternative: ‘వారిని మళ్లీ పశ్చాత్తాపానికి నూతనపరచడం అసాధ్యం’ అని ఈ వచనంలోనే పూర్తిగా చెప్పడం.
  rationale: గ్రీకు వాక్యం హెబ్రీయులు 6:4–6లోని ముందటి వాక్యంపై వ్యాకరణపరంగా ఆధారపడింది. ఆ ఆధారాన్ని, దానితో కూడిన వ్యాఖ్యాన ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
- issue: παραπεσόντας సూచించే తొలగిపోవడం యొక్క సిద్ధాంతపరమైన స్వభావం
  choice: ‘తొలగిపోయినవారు’ అని అనువదించి, రక్షణ కోల్పోవడం, పైకి మాత్రమే ఉన్న విశ్వాసం, లేదా మరొక విధమైన నిబంధనాత్మక మతభ్రష్టత అని నిర్దిష్టీకరించకపోవడం.
  alternative: ‘మతభ్రష్టులైనవారు’ లేదా ‘చివరిగా విశ్వాసాన్ని విడిచినవారు’.
  rationale: గ్రీకు పదం తీవ్రమైన వెనుదిరుగుదలను సూచించినా, తరువాతి సిద్ధాంత వ్యవస్థల మధ్య వివాదాన్ని స్వయంగా పరిష్కరించదు.
- issue: ἀνασταυροῦντας, παραδειγματίζοντας అనే కృదంతాల సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘ఎందుకంటే’ ద్వారా వివరణాత్మక లేదా కారణ సంబంధాన్ని చూపడం.
  alternative: ‘వారు ... సిలువ వేస్తూ ... అవమానానికి గురిచేస్తున్నంతకాలం’ అనే సమకాలిక భావం.
  rationale: ఈ కృదంతాలు నూతనపరచడం గురించిన ప్రకటనకు కారణాన్ని వివరించే అవకాశమే ఎక్కువ; అయినా సమకాలిక భావం కూడా వ్యాకరణపరంగా సాధ్యమైనందున దాన్ని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలి. గ్రీకు వాక్యపు ముందటి వచనంపై ఆధారపడిన నిర్మాణాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. ‘పశ్చాత్తాపం,’ ‘దేవుని కుమారుడు,’ ‘సిలువ వేయడం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సహజమైన తెలుగు వాక్యప్రవాహంతో కలిపాం.
