revisions:
- from: అలాగే తొలగిపోయినవారిని[a] మళ్లీ పశ్చాత్తాపానికి నూతనపరచడం[b]—ఎందుకంటే వారు తమకు తామే దేవుని కుమారుణ్ణి మళ్లీ సిలువ వేస్తూ, ఆయనను బహిరంగంగా అవమానానికి గురిచేస్తున్నారు.
