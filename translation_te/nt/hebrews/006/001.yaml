id: HEB.6.1
reference: Hebrews 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: te
  text: కాబట్టి, మెస్సీయను గురించిన ప్రాథమిక బోధను పక్కనబెట్టి, పరిపక్వత వైపు మనం నడిపించబడుదాం[a], మృత క్రియల నుండి పశ్చాత్తాపం మరియు దేవుని వైపు విశ్వాసం అనే పునాదిని మళ్లీ వేయకుండా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “పరిపక్వత వైపు మనం ముందుకు సాగుదాం.” గ్రీకులో క్రియ కర్మణి రూపంలో ఉంది: “నడిపించబడుదాం” లేదా “తీసుకుపోబడుదాం.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుండి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀφέντες
  choice: వెనుక విడిచి
  rationale: ప్రాథమిక బోధను తిరస్కరించడం కాక, దానినే ప్రస్తుత కేంద్రీకరణగా ఉంచకుండా ముందుకు సాగడాన్ని సూచిస్తుంది.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: మెస్సీయను గురించిన ప్రాథమిక బోధ
  rationale: క్లిష్టమైన గ్రీకు సంబంధపదబంధాన్ని సందర్భానుసారంగా అర్థమయ్యేలా చేసి, ఆరంభ దశ బోధ అనే భావాన్ని నిలుపుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదు భావంలో ఉండటం వల్ల ‘మెస్సీయ’ అని అనువదించబడింది.
- source_word: ἐπὶ τὴν τελειότητα
  choice: పరిపక్వత వైపు
  rationale: మౌలిక బోధ నుండి సంపూర్ణ వికాసం వైపు సాగడమే సందర్భార్థం; పాపరహిత పరిపూర్ణతను అనవసరంగా సూచించదు.
- source_word: φερώμεθα
  choice: మనం నడిపించబడుదాం
  rationale: గ్రీకు క్రియలోని కర్మణి భావాన్ని నిలుపుతూ సహజమైన తెలుగు ప్రయోగాన్ని అందిస్తుంది.
- source_word: θεμέλιον καταβαλλόμενοι
  choice: పునాదిని మళ్లీ వేయకుందాం
  rationale: మూలంలోని నిర్మాణ రూపకాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: మృత క్రియల నుండి పశ్చాత్తాపం
  rationale: μετάνοια యొక్క స్థిరమైన అర్థాన్ని, ‘మృత క్రియలు’ అనే ఉద్దేశపూర్వకంగా విస్తృతమైన రూపకాన్ని నిలుపుతుంది.
- source_word: πίστεως ἐπὶ θεόν
  choice: దేవుని వైపు విశ్వాసం
  rationale: ἐπί తో కూడిన దిశాత్మక ఛాయను కాపాడుతుంది; ‘దేవునిలో విశ్వాసం’ కూడా భావసాధ్యమే.
theological_decisions:
- issue: ప్రాథమిక మెస్సీయ బోధను ‘విడిచిపెట్టడం’ అంటే దానిని తిరస్కరించడమా?
  choice: దానిని తిరస్కరించకుండా, దాని మీద నిలబడి తదుపరి పరిపక్వతకు సాగడం
  alternative: మెస్సీయ బోధనే పూర్తిగా వదిలివేయడం
  rationale: అదే వాక్యంలో పునాదిని మళ్లీ వేయవద్దని చెప్పడం, పునాదిని నిరాకరించడం కాక దానిని దాటి నిర్మాణం కొనసాగించడాన్ని సూచిస్తుంది.
- issue: τελειότης యొక్క భావం
  choice: పరిపక్వత
  alternative: పరిపూర్ణత లేదా సంపూర్ణత
  rationale: ప్రాథమిక బోధతో ఉన్న వ్యత్యాసంలో ఆధ్యాత్మిక వికాసం ప్రధాన భావం; ‘పరిపూర్ణత’ పాపరహిత స్థితి అనే అదనపు అర్థాన్ని కలిగించవచ్చు.
- issue: φερώμεθα లోని కర్మణి భావం
  choice: మనం నడిపించబడుదాం
  alternative: మనం ముందుకు సాగుదాం
  rationale: మూలంలోని కర్మణి రూపాన్ని కాపాడి, పురోగతిని పూర్తిగా స్వయంకృషిగా మాత్రమే చూపకుండా ఉంటుంది; ఆ కర్త ఎవరో వాక్యం స్పష్టంగా చెప్పదు.
- issue: νεκρῶν ἔργων అర్థపరిధి
  choice: మృత క్రియలు
  alternative: మరణానికి నడిపించే క్రియలు లేదా నిర్జీవమైన క్రియలు
  rationale: మూలంలోని సంక్షిప్త రూపకాన్నీ దాని నిజమైన అర్థసందిగ్ధతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘మెస్సీయ’, ‘పశ్చాత్తాపం’, ‘విశ్వాసం’, ‘పునాది’ వంటి బైబిలు పదాలను సహజ వాక్యనిర్మాణంలో ఉపయోగించాం. మూలంలోని కర్మణి భావం మరియు ‘మృత క్రియలు’ అనే రూపకపు అర్థవిస్తృతిని ఉద్దేశపూర్వకంగా నిలిపాం.
