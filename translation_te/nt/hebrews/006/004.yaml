source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: te
  text: 'ఎందుకంటే, ఒకసారి వెలుగు పొందినవారు[a], పరలోకపు వరాన్ని రుచిచూసినవారు[b], పరిశుద్ధాత్మలో భాగస్వాములైనవారి[c] విషయమై ఇది అసాధ్యం:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వెలుగు పొందడం’ అనేది సాధారణంగా ఆత్మీయ వెలుగు లేదా బోధను పొందడాన్ని సూచించవచ్చు; కొందరు దీన్ని మరింత నిర్దిష్టంగా మారుమనస్సు లేదా బాప్తిస్మ సంబంధ ప్రకాశంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘పరలోకపు వరాన్ని అనుభవించినవారు.’ మూల క్రియ అక్షరార్థంగా ‘రుచిచూశారు’ అని ఉంటుంది; అది కేవలం కొద్దిగా ఆస్వాదించడమే కాక నిజమైన అనుభవాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘పరిశుద్ధాత్మకు భాగస్వాములైనవారు,’ ‘పరిశుద్ధాత్మలో పాల్గొన్నవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον
  choice: అసాధ్యం
  rationale: వాక్యారంభంలోని బలమైన విధేయ విశేషణ భావాన్ని నేరుగా నిలుపుతుంది; తెలుగులో వాక్య నిర్మాణం సహజంగా ఉండేందుకు ‘ఇది’ అనుసంధానించబడింది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: ἅπαξ
  choice: ఒకసారి
  rationale: గతంలో జరిగిన నిర్దిష్ట అనుభవాన్ని సూచిస్తుంది; సందర్భం అనుమతించేదానికంటే బలమైన ‘ఒక్కసారిగా శాశ్వతంగా’ అనే భావాన్ని చేర్చదు.
- source_word: φωτισθέντας
  choice: వెలుగు పొందినవారు
  rationale: ఆత్మీయ లేదా జ్ఞానసంబంధ వెలుగు అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతూ, దానిని మారుమనస్సు లేదా బాప్తిస్మం అని ముందుగానే నిర్వచించదు.
- source_word: γευσαμένους
  choice: రుచిచూసినవారు
  rationale: మూలంలోని రుచి చూడడం అనే సజీవ రూపకాన్ని నిలుపుతుంది; అది కేవలం పైపై నమూనానా లేక నిజమైన అనుభవమా అనే వివాదాన్ని ప్రధాన పాఠ్యంలో తీర్చదు.
- source_word: δωρεᾶς τῆς ἐπουρανίου
  choice: పరలోకపు వరం
  rationale: వరానికి పరలోక సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; ఆ వరం ఏమిటో పాఠ్యంలో లేనిది నిర్దిష్టం చేయదు.
- source_word: τε ... καὶ
  choice: వరుస వివరణల సమన్వయం
  rationale: తెలుగులో సమాన నిర్మాణాల వరుస ద్వారా గ్రీకు సంచయాత్మక సమన్వయం సహజంగా వ్యక్తమవుతుంది.
- source_word: μετόχους γενηθέντας
  choice: పాలుపంచుకున్నవారు
  rationale: ఏదో ఒక దానిలో భాగస్వాములు కావడం లేదా పాల్గొనడం అనే బలమైన భావాన్ని ప్రస్తుత తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మలో
  rationale: μετόχους అనే పదంతో ఉన్న సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, పరిశుద్ధాత్మ అనే దైవిక వ్యక్తి సూచనను నిలుపుతుంది.
theological_decisions:
- issue: φωτισθέντας ప్రత్యేకంగా మారుమనస్సునా లేదా బాప్తిస్మ సంబంధ ప్రకాశాన్నా సూచిస్తుందా
  choice: వెలుగు పొందినవారు
  alternative: మారుమనస్సు పొందినవారు; బాప్తిస్మం పొందినవారు
  rationale: గ్రీకు పాఠ్యం వెలుగు అనే విస్తృత రూపకాన్నే ఉపయోగిస్తుంది. ఒక నిర్దిష్ట సంఘపరమైన వ్యాఖ్యానాన్ని అనువాదంలో చేర్చకుండా అసలు అనిశ్చితిని నిలుపుతుంది.
- issue: γευσαμένους కేవలం కొద్దిగా ఆస్వాదించడాన్నా లేక నిజమైన అనుభవాన్నా సూచిస్తుందా
  choice: రుచిచూసినవారు
  alternative: అనుభవించినవారు; పైపైగా మాత్రమే ఆస్వాదించినవారు
  rationale: ఈ క్రియ నిజమైన అనుభవాన్ని కూడా సూచించగలదు, కాని అనుభవపు పరిమాణాన్ని ఈ పదమే ఖచ్చితంగా నిర్ణయించదు. అందువల్ల విశ్వాసభ్రంశం, నిలకడ గురించిన సిద్ధాంత వివాదాన్ని పదస్థాయిలో పరిష్కరించలేదు.
- issue: పరిశుద్ధాత్మలో భాగస్వామ్యం పూర్తి రక్షణాత్మక అంతర్వాసాన్నే తప్పనిసరిగా సూచిస్తుందా
  choice: పరిశుద్ధాత్మలో పాలుపంచుకున్నవారు
  alternative: పరిశుద్ధాత్మకు భాగస్వాములైనవారు; పరిశుద్ధాత్మను పొందినవారు
  rationale: మూలంలోని భాగస్వామ్య భావాన్ని బలంగా ఉంచినా, దాని వ్యవస్థీకృత సిద్ధాంతార్థాన్ని అనువాదం ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూల వాక్యం 6వ వచనంలో పూర్తవుతుందనే విషయాన్ని సూచించేందుకు చివర ద్విబిందువు ఉంచబడింది. భాగవాచక క్రియల వరుసను తెలుగులో సమాంతర నామవాచక నిర్మాణాలుగా ఇచ్చి పఠన సౌలభ్యాన్ని కాపాడింది.
