  language: en
  yaml_path: translation/nt/hebrews/006/014.yaml
  text: saying[a], “Surely I will bless you and surely multiply you.”
translation:
  language: te
  text: 'ఇలా అన్నాడు[a]: “నేను నిన్ను తప్పక ఆశీర్వదిస్తాను మరియు నిన్ను తప్పక విస్తరింపజేస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో అక్షరార్థంగా: “ఆశీర్వదిస్తూ నిన్ను ఆశీర్వదిస్తాను మరియు విస్తరింపజేస్తూ నిన్ను విస్తరింపజేస్తాను.” ఇది ఆదికాండం 22:17ను ప్రతిధ్వనించే బలమైన నొక్కిచెప్పే నిర్మాణం.'
    reason: మూలంలోని ఉద్ఘాటనాత్మక పునరుక్తినీ, ఆదికాండం 22:17తోని అంతర్పాఠ్య సంబంధాన్నీ తెలియజేయడం.
lexical_decisions:
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: వర్తమాన కృదంతం దేవుని ప్రమాణంలోని మాటలను పరిచయం చేస్తోంది. తెలుగు వాక్యప్రవాహంలో ‘ఇలా అన్నాడు’ సహజంగా ఉండి, చెప్పిన మాటలతో నేరుగా అనుసంధానిస్తుంది.
- source_word: Εἰ μὴν
  choice: తప్పక
  rationale: ఇది అక్షరార్థమైన షరతు కాదు; ప్రమాణ భాషలో బలమైన నిశ్చయాన్ని తెలియజేసే ప్రయోగం. ‘తప్పక’ ఆ నిశ్చయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εὐλογῶν εὐλογήσω σε
  choice: నేను నిన్ను తప్పక ఆశీర్వదిస్తాను
  rationale: కృదంతం–క్రియ పునరుక్తి సెమిటిక్ శైలిలోని బలమైన నొక్కిచెప్పడం. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు కోసం ‘తప్పక’ వాడి, మూలంలోని పునరుక్తిని పాదసూచికలో చూపించాం.
- source_word: καὶ
  choice: ;
  rationale: రెండు సమాంతర వాగ్దానాలను కలిపే καὶ భావాన్ని తెలుగులో స్పష్టమైన సమాంతర విభజనతో చూపించడానికి అర్ధవిరామం వాడాం; దాని సమన్వయ భావం చెదరదు.
- source_word: πληθύνων πληθυνῶ σε
  choice: నిన్ను తప్పక విస్తారంగా వృద్ధి చేస్తాను
  rationale: ‘విస్తారంగా వృద్ధి చేస్తాను’ అనేది ఒకరిని ఎంతో అధికం చేయడం అనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. ‘సంతానం’ అని స్పష్టీకరించకుండా గ్రీకు పాఠంలోని నిజమైన విస్తృతిని కాపాడుతుంది; ‘తప్పక’ పునరుక్త నిర్మాణంలోని బలాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: అబ్రాహాముకు చేసిన వాగ్దానంలోని ప్రమాణాత్మక నొక్కిచెప్పే నిర్మాణం
  choice: ప్రధాన పాఠ్యంలో సహజమైన ‘తప్పక’ అనే పదాన్ని రెండు వాగ్దాన భాగాల్లో ఉపయోగించి, గ్రీకు పునరుక్తిని పాదసూచికలో భద్రపరచడం.
  alternative: ‘నిన్ను ఆశీర్వదిస్తూ ఆశీర్వదిస్తాను; నిన్ను వృద్ధి చేస్తూ వృద్ధి చేస్తాను’ అని మరింత రూపసామ్యంతో అనువదించడం.
  rationale: గ్రీకు వాక్యం ఆదికాండం 22:17లోని హెబ్రీయ–సెప్టువజింటు నొక్కిచెప్పే పునరుక్తిని ప్రతిధ్వనింపజేస్తుంది. సహజమైన ఆధునిక తెలుగు ప్రధాన పాఠ్యంతో పాటు, మూల నిర్మాణాన్ని పాదసూచికలో చూపడం చదవదగినతనాన్నీ అంతర్పాఠ్య సంబంధాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘విస్తారంగా వృద్ధి చేస్తాను’ ద్వారా మూలంలోని ప్రత్యక్ష కర్మ ‘నిన్ను’ నిలుపుతూ, పాఠ్యంలో లేని ‘సంతానం’ వంటి వివరణను చేర్చలేదు.
