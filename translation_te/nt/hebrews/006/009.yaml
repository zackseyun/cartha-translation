id: HEB.6.9
reference: Hebrews 6:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: te
  text: అయితే, ప్రియులారా, మేము ఈ విధంగా మాట్లాడుతున్నప్పటికీ, మీ విషయంలో మరింత శ్రేష్ఠమైనవి—రక్షణకు సంబంధించినవి[a]—ఉన్నాయని మాకు నిశ్చయం ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రక్షణతో పాటు ఉండేవి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: నమ్మకంగా ఉన్నాము
  rationale: పరిపూర్ణ కాలం స్థిరపడిన నమ్మకస్థితిని సూచిస్తుంది; ఈ తెలుగు రూపం ప్రస్తుత నిశ్చయాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న తీవ్రమైన హెచ్చరిక నుంచి ఆదరణతో కూడిన విరుద్ధ మలుపును సూచిస్తుంది.
- source_word: περὶ ὑμῶν
  choice: మీ విషయంలో
  rationale: περί + షష్ఠీ విభక్తి యొక్క ‘మీ గురించి/మీ విషయంలో’ అనే భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἀγαπητοί
  choice: ప్రియులారా
  rationale: ఆప్యాయతతో కూడిన సంబోధనను సహజంగా, సంఘసంబంధమైన గంభీరతతో తెలియజేస్తుంది.
- source_word: τὰ κρείσσονα
  choice: మరింత శ్రేష్ఠమైనవాటిని
  rationale: నపుంసక బహువచన విశేషణం నామవాచకంగా వాడబడింది; తులనాత్మక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐχόμενα σωτηρίας
  choice: రక్షణకు సంబంధించినవాటిని
  rationale: ἐχόμενα + షష్ఠీ విభక్తి తెలిపే సంబంధాన్ని, అది సాక్ష్యమా, ఫలితమా, సహచరమా అని నిర్దిష్టం చేయకుండా భద్రపరుస్తుంది.
- source_word: εἰ καὶ
  choice: మాట్లాడుతున్నప్పటికీ
  rationale: సందర్భంలోని concessive భావాన్ని సహజ తెలుగు ఉపవాక్య నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: మునుపటి హెచ్చరిక యొక్క తీరు లేదా విషయాన్ని రెండింటినీ సూచించగల మూలంలోని విస్తృతత్వాన్ని నిలుపుతుంది.
- source_word: λαλοῦμεν
  choice: మాట్లాడుతున్న
  rationale: వర్తమాన క్రియ యొక్క కొనసాగుతున్న/సాధారణ భావాన్ని సందర్భానుగుణంగా సహజంగా అందిస్తుంది.
theological_decisions:
- issue: హెచ్చరిక భాగంలో ἐχόμενα మరియు σωτηρίας మధ్య సంబంధం
  choice: రక్షణకు సంబంధించినవి
  alternative: రక్షణతో పాటు ఉండేవి
  rationale: గ్రీకు పాఠం రక్షణతో సరైన సంబంధం గల వాస్తవాలను సూచిస్తుంది; అయితే అవి రక్షణకు సాక్ష్యాలా, సహచరాలా, ఫలితాలా, లేక కారణాలా అని నిర్ణయించదు. అనువాదం ఆ వేదాంతపరమైన ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, ఆప్యాయమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని విరుద్ధ మలుపు, నిశ్చయభావం, మరియు రక్షణతో ఉన్న సంబంధంలోని ఉద్దేశపూర్వక అస్పష్టత భద్రపరచబడ్డాయి.
