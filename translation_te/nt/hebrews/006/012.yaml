id: HEB.6.12
reference: Hebrews 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: te
  text: మీరు మందకొడిగా మారకుండా, విశ్వాసం[a] మరియు దీర్ఘసహనం ద్వారా వాగ్దానాలను వారసత్వంగా పొందేవారిని అనుకరించేవారిగా ఉండేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నమ్మకం మరియు దీర్ఘసహనం ద్వారా.’ ‘విశ్వాసం’ అని అనువదించిన గ్రీకు పదం కొన్ని సందర్భాల్లో ‘నమ్మకత్వం’ లేదా ‘నమ్మకం’ అనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: మారకుండా … ఉండాలి
  rationale: ముందటి వాక్యంలోని ప్రోత్సాహానికి అనుసంధానమైన ఉద్దేశాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: νωθροὶ
  choice: మందకొడిగా
  rationale: ప్రతిస్పందనలో లేదా ప్రయత్నంలో నెమ్మదిగా, జడంగా ఉండే భావాన్ని తెలియజేస్తుంది; ‘సోమరులుగా’ అనడం వల్ల వచ్చే అతిగా నైతిక నిందాభావాన్ని నివారిస్తుంది.
- source_word: γένησθε
  choice: మారకుండా
  rationale: γίνομαι ఇక్కడ ఒక స్థితిలోకి చేరడాన్ని సూచిస్తుంది; అందువల్ల కేవలం ‘ఉండకుండా’ కంటే ‘మారకుండా’ సరైనది.
- source_word: μιμηταὶ
  choice: అనుకరించేవారిగా
  rationale: ఇతరుల మాదిరిని అనుసరించి ప్రవర్తించాలనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: διὰ πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: πίστις యొక్క విస్తృతమైన అర్థపరిధిని నిలుపుతూ, దేవునిపై నమ్మకాన్ని సూచించే ప్రామాణికమైన ఆధునిక తెలుగు పదాన్ని ఉపయోగిస్తుంది.
- source_word: μακροθυμίας
  choice: దీర్ఘసహనం ద్వారా
  rationale: కాలం గడిచినా ఓర్పుతో నిలిచే భావాన్ని ‘సహనం’ కంటే స్పష్టంగా తెలియజేస్తుంది; ὑπομονήతో పూర్తిగా కలిపివేయదు.
- source_word: κληρονομούντων
  choice: వారసత్వంగా పొందేవారిని
  rationale: వర్తమాన కృదంతంలోని లక్షణాత్మక భావాన్ని సహజమైన తెలుగు సంబంధార్థక రూపంలో వ్యక్తం చేస్తుంది.
- source_word: τὰς ἐπαγγελίας
  choice: వాగ్దానాలను
  rationale: గ్రీకు మూలంలోని బహువచనాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πίστις పదంలోని విశ్వాసం, నమ్మకం, నమ్మకత్వం అనే భావసాధ్యతలు
  choice: విశ్వాసం
  alternative: నమ్మకం; నమ్మకత్వం
  rationale: ఈ సందర్భంలో దేవునిపై ఆధారపడే విశ్వాసమే ప్రధాన భావంగా కనిపిస్తుంది. అయితే గ్రీకు పదం కొన్ని సందర్భాల్లో నమ్మకత్వాన్ని కూడా సూచించగలదు కాబట్టి ఆ సాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని హెచ్చరిక, అనుకరణకు పిలుపు, వాగ్దానాల బహువచనం నిలుపబడ్డాయి.
