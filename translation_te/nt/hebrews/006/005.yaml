lexical_decisions:
- source_word: καλὸν
  choice: మంచి
  rationale: καλός ఇక్కడ ῥῆμαను విశేషిస్తూ మేలైనది, ప్రయోజనకరమైనది అనే మూల్యాంకన భావాన్ని ఇస్తుంది; ‘మంచి వాక్యం’ సహజంగా ఉండి అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: γευσαμένους
  choice: రుచి చూసి … అనుభవించినవారు
  rationale: ‘రుచి చూశారు’ అనే రూపకం యథాతథంగా నిలుస్తుంది. తెలుగులో రెండు కర్మలను ఒకే ‘రుచి చూశారు’తో కలపడం అసహజంగా ఉండవచ్చు కాబట్టి, రెండవ కర్మతో ‘అనుభవించినవారు’ను చేర్చి గ్రీకు participle రెండింటికీ వర్తించే భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: θεοῦ ῥῆμα
  choice: దేవుని వాక్యం
  rationale: ῥῆμα పలికిన మాట లేదా ఉక్తిని సూచించగలిగినా, ‘దేవుని వాక్యం’ ఆధునిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన ప్రయోగం; θεοῦను మూలం/సంబంధంగా సహజంగా తెలియజేస్తుంది.
- source_word: δυνάμεις
  choice: శక్తులు
  rationale: బహువచన δυνάμεις అద్భుత కార్యాలను లేదా శక్తి ప్రత్యక్షతలను సూచించవచ్చు. ‘శక్తులు’ విస్తృత అర్థాన్ని, అసలు వాక్యంలోని సందిగ్ధతను నిలుపుతుంది.
- source_word: τε
  choice: మరియు అనే అనుసంధాన భావం
  rationale: τε ముందున్న కర్మతో δυνάμειςను కలుపుతుంది; తెలుగులో ‘రుచి చూసి … అనుభవించినవారు’ అనే సమన్విత నిర్మాణం ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μέλλοντος αἰῶνος
  choice: రాబోయే యుగపు
  rationale: ఈ షష్ఠీ విభక్తి పదబంధం ‘శక్తులు’ను విశేషిస్తూ భవిష్యత్తులో రానున్న యుగాన్ని సూచిస్తుంది. ‘రాబోయే యుగం’ ఆధునిక తెలుగులో సహజంగా ఉండి అంత్యకాల దిశను నిలుపుతుంది.
theological_decisions:
- issue: హెచ్చరిక సందర్భంలో γευσαμένους భావం
  choice: ‘రుచి చూసి’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘పూర్తిగా అనుభవించి’ లేదా ‘కొద్దిగా మాత్రమే రుచి చూసి’
  rationale: ఈ పదం వారి పాలుపంచుకున్న అనుభవం ఎంత లోతైనదో స్వయంగా నిర్ణయించదు. అందువల్ల దాన్ని పెంచకుండానూ తగ్గించకుండానూ మూల రూపకాన్ని నిలిపాం.
- issue: అంత్యకాల సందర్భంలో δυνάμεις భావం
  choice: ‘శక్తులు’
  alternative: ‘అద్భుతాలు’ లేదా ‘మహత్కార్యాలు’
  rationale: ఇది రాబోయే యుగానికి సంబంధించిన అద్భుత కార్యప్రదర్శనలను సూచించవచ్చు; అయితే భావం వాటికే పరిమితం కాకపోవచ్చు. ‘శక్తులు’ ఆ ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది హెబ్రీయులకు 6:4–6లో కొనసాగుతున్న వాక్యభాగం కాబట్టి చివర కామా ఉంచబడింది. ప్రధాన పాఠ్యంలో ప్రతి పాదసూచిక గుర్తు చేర్చబడింది; ఆంగ్ల సంప్రదింపు పాఠ్యంలోని గుర్తుల క్రమాన్ని అనుసరించి [b][a]గా ఉంచాం.
