revisions:
- from: దేవుని మంచి వాక్యాన్ని రుచి చూసి, రాబోయే యుగపు శక్తులను[b][a] అనుభవించినవారు,
  to: దేవుని మంచి వాక్యాన్ని, రాబోయే యుగపు శక్తులనూ[b][a] రుచి చూసినవారు,
  rationale: The revision restores a single Telugu expression, “రుచి చూసినవారు,” as the governing predicate for both coordinated Greek objects. This preserves the source metaphor and its debated theological force without suggesting either merely superficial participation or a distinct, fuller kind of experience for the powers. The comma is retained because this is a continuing participial phrase in Hebrews 6:4–6, and both footnote anchors remain attached to their respective terms.
