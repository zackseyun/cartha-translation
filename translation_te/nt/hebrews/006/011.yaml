source:
  edition: SBLGNT
  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: te
  text: మరియు, మీలో ప్రతి ఒక్కరూ నిరీక్షణ విషయమై సంపూర్ణ నిశ్చయత కలిగేలా అంతం వరకు అదే శ్రద్ధను చూపాలని మేము కోరుతున్నాం.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిరీక్షణకు సంబంధించిన సంపూర్ణ భరోసా.” గ్రీకు పదం సంపూర్ణ నిశ్చయతను లేదా సంపూర్ణ భరోసాను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “చివరి వరకు.” ఈ పదబంధం పూర్తివరకు పట్టుదలగా కొనసాగడాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: మేము కోరుతున్నాం
  rationale: ఈ క్రియ బలమైన కోరికను సూచిస్తుంది. ఇక్కడ సంఘసంరక్షణతో కూడిన ప్రోత్సాహం ఉన్నందున, సహజమైన ఆధునిక తెలుగులో ‘కోరుతున్నాం’ తగిన గంభీరతను నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి భరోసా నుంచి ప్రస్తుత ప్రోత్సాహానికి సున్నితమైన మలుపును సూచిస్తుంది; బలమైన వ్యతిరేకతను కలిగించకుండా సంధిని చూపుతుంది.
- source_word: ἕκαστον ὑμῶν
  choice: మీలో ప్రతి ఒక్కరూ
  rationale: సమూహంలోని ప్రతి వ్యక్తికీ ఈ ప్రోత్సాహం వర్తిస్తుందనే విభాజక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν αὐτὴν
  choice: అదే
  rationale: మునుపటి సందర్భంలో వారు చూపిన ప్రేమతో కూడిన సేవాశ్రద్ధను వెనక్కి సూచిస్తుంది.
- source_word: ἐνδείκνυσθαι
  choice: చూపాలని
  rationale: ఒక గుణాన్ని క్రియల్లో కనబరచడం లేదా ప్రదర్శించడం అనే భావాన్ని సరళంగా అందిస్తుంది.
- source_word: σπουδὴν
  choice: శ్రద్ధను
  rationale: సందర్భంలో ఉన్న నిరంతరమైన, కార్యశీలమైన ఆసక్తి మరియు పట్టుదలను సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: πρὸς
  choice: కలిగేలా
  rationale: πρός ఇక్కడ లక్ష్యం లేదా ఫలితం వైపు దిశను సూచిస్తుంది. తెలుగు వాక్యంలో ‘కలిగేలా’ ఆ ఉద్దేశ్య సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πληροφορίαν
  choice: సంపూర్ణ నిశ్చయత
  rationale: పూర్ణతకు చేరిన నమ్మకం లేదా భరోసా అనే అర్థాన్ని ఇస్తుంది; కేవలం భావోద్వేగ ధైర్యంగా పరిమితం చేయదు.
- source_word: ἐλπίδος
  choice: నిరీక్షణలో
  rationale: దేవుని వాగ్దానంపై ఆధారపడిన ఎదురుచూపును సూచించే స్థిరమైన బైబిలు తెలుగు పదం; πληροφορίανతో ఉన్న సంబంధాన్ని ‘లో’ ద్వారా సహజంగా కలుపుతుంది.
- source_word: ἄχρι τέλους
  choice: అంతం వరకు
  rationale: కాలపరమైన కొనసాగింపును, పూర్తయ్యే దాకా పట్టుదలగా నిలవడాన్ని నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘నిరీక్షణలో సంపూర్ణ నిశ్చయత’కు పట్టుదలతో ఉన్న సంబంధం
  choice: నిరీక్షణకు సంబంధించిన సంపూర్ణ నిశ్చయతను అంతం వరకు కొనసాగే శ్రద్ధ యొక్క లక్ష్యంగా అనువదించాం.
  alternative: దీనిని పూర్తిగా అంతరంగిక రక్షణ నిశ్చయంగా గానీ, ఆశించిన వాగ్దానం యొక్క సంపూర్ణ సాకారంగా గానీ మాత్రమే అర్థం చేసుకోవచ్చు.
  rationale: గ్రీకు పదబంధం వ్యక్తిగత నిశ్చయతను, నిరీక్షణకు ఆధారమైన స్థిరత్వాన్ని రెండింటినీ సూచించగలదు. అనువాదం ఏకైక సిద్ధాంతపరమైన వివరణకు దాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రోత్సాహక శైలి వాడబడింది. ‘అంతం వరకు’ ప్రధాన వాక్యంలోనే ఉంచి పట్టుదల భావాన్ని నిలిపాం; నిశ్చయత/భరోసా మధ్య ఉన్న భావవ్యాప్తిని పాదటిప్పణిలో సూచించాం.
