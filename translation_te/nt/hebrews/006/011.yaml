revisions:
- from: అయితే, మీలో ప్రతి ఒక్కరూ అంతం వరకు నిరీక్షణలో సంపూర్ణ నిశ్చయత కలిగేలా అదే శ్రద్ధను చూపాలని మేము కోరుతున్నాం.[a]
  to: మరియు, మీలో ప్రతి ఒక్కరూ నిరీక్షణ విషయమై సంపూర్ణ నిశ్చయత కలిగేలా అంతం వరకు అదే శ్రద్ధను చూపాలని మేము కోరుతున్నాం.[a][b]
  rationale: The revision softens the connective to match δέ, represents the genitive ‘of hope’ more directly with ‘నిరీక్షణ విషయమై,’ and retains the lexical alternative for ‘until/to the end’ with a corresponding anchor. It does not resolve the phrase into either a merely subjective assurance or an objective realization of hope.
