revisions:
- from: మనం దీన్ని చేస్తాం—దేవుడు నిజంగా అనుమతిస్తే.[a]
  to: దేవుడు అనుమతిస్తేనే, ఇదీ మనం చేస్తాం.[a]
  rationale: ‘దేవుడు అనుమతిస్తేనే’ ἐάνπερ యొక్క ఉద్ఘాటిత షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఇది దేవుని అనుమతి నిజమైనదా కాదా అనే వేరే భావాన్ని సూచించదు. ‘ఇదీ’ ద్వారా καὶ యొక్క అనుసంధాన భావం నిలుస్తుంది. వాక్యం దేవుని అనుమతికి లోబడిన రచయిత ఉద్దేశాన్ని మాత్రమే చెబుతుంది; ఏ సిద్ధాంతపరమైన వివరణను జోడించదు.
