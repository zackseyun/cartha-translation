translation:
  language: te
  text: దేవుడు అనుమతిస్తేనే, ఇదీ మనం చేస్తాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుడు అనుమతిస్తే, ఇదీ మనం చేస్తాం.’ గ్రీకులోని షరతు పదం షరతును స్వల్పంగా నొక్కి చెబుతుంది.
