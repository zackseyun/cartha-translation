id: HEB.6.2
reference: Hebrews 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: te
  text: ఆచారపరమైన కడుగుదలలను గురించిన బోధ[a], చేతులు ఉంచడం, చనిపోయినవారి పునరుత్థానం, నిత్య తీర్పు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాప్తిస్మాలను గురించిన బోధ.” గ్రీకు బహువచన పదం ప్రత్యేకంగా క్రైస్తవ బాప్తిస్మాన్ని మాత్రమే కాకుండా, విస్తృతంగా ఆచారపరమైన కడుగుదలలను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισμῶν
  choice: ఆచారపరమైన కడుగుదలలు
  rationale: బహువచన రూపం ఇక్కడ క్రైస్తవ బాప్తిస్మానికి మాత్రమే పరిమితం కాకుండా, విస్తృతంగా ఆచారపరమైన శుద్ధీకరణ కడుగుదలలను సూచించగలదు. బహువచన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: διδαχὴν
  choice: బోధ
  rationale: మునుపటి వచనంలో మొదలైన ప్రాథమిక అంశాల జాబితాను కొనసాగించే సహజమైన, సాధారణ తెలుగు పదం; తరువాతి అంశాన్ని ‘గురించిన’ అనే సంబంధంతో అనుసంధానిస్తుంది.
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: చేతులు ఉంచడం
  rationale: గ్రీకు పదబంధానికి సహజమైన తెలుగు రూపం; ఏ ప్రత్యేక ఆచారార్థాన్నీ అదనంగా చేర్చదు.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: చనిపోయినవారి పునరుత్థానం
  rationale: νεκρῶν యొక్క సమూహార్థాన్ని సహజంగా తెలియజేస్తూ, పునరుత్థానం అనే స్థిరమైన భావాన్ని నిలుపుతుంది.
- source_word: κρίματος αἰωνίου
  choice: నిత్య తీర్పు
  rationale: ‘తీర్పు’ అనే మూలపద భావాన్ని ‘శిక్షావిధి’గా కుదించకుండా, αἰωνίου యొక్క కాలాతీత/నిత్య భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τε ... τε καὶ
  choice: విరామచిహ్నాలతో కూడిన జాబితా
  rationale: గ్రీకులోని సమన్వయ కణాల పని తెలుగులో సహజమైన వరుస జాబితా ద్వారా వ్యక్తమవుతుంది.
theological_decisions:
- issue: βαπτισμῶν అనే పదం సూచించే పరిధి
  choice: ఆచారపరమైన కడుగుదలలు
  alternative: బాప్తిస్మాలు
  rationale: బహువచనం మరియు పదప్రయోగ పరిధి కారణంగా ఇది క్రైస్తవ బాప్తిస్మాలను మాత్రమే సూచిస్తుందని నిర్ణయించకుండా విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: κρίματος αἰωνίου యొక్క పరిధి
  choice: నిత్య తీర్పు
  alternative: నిత్య శిక్షావిధి
  rationale: మూలపాఠం తీర్పు అని చెబుతుంది గాని దాన్ని దోషనిర్ణయం లేదా శిక్షకు మాత్రమే పరిమితం చేయదు; అందువల్ల ఆ theological tension ను అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ఈ వాక్యం మునుపటి వచనంలో మొదలైన జాబితాను కొనసాగించే ఖండవాక్యమనే స్వరూపాన్ని నిలిపాం.
