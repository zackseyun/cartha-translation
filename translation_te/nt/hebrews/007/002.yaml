id: HEB.7.2
reference: Hebrews 7:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: te
  text: అబ్రాహాము అన్నిటిలోనుండి పదోవంతును కూడా అతనికి కేటాయించాడు[a]. మొదట అతని పేరు “నీతి రాజు”[b] అని అనువదించబడుతుంది; తరువాత అతను “సాలేము రాజు,” అంటే “శాంతి రాజు” కూడా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దశమభాగాన్ని.” గ్రీకులో అక్షరార్థంగా “పదోవంతు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “న్యాయపు రాజు.” ఇక్కడి గ్రీకు పదానికి “నీతి” లేదా “న్యాయం” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: అతనికి
  rationale: ఈ సంబంధవాచక సర్వనామం మెల్కీసెదెకును సూచిస్తుంది; అబ్రాహాము పదోవంతును అతనికి ఇచ్చాడనే దత్తివాచక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δεκάτην
  choice: పదోవంతు
  rationale: గ్రీకు పదానికి అక్షరార్థం ‘పదవ భాగం’; ‘పదోవంతు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἀπὸ πάντων
  choice: అన్నిటిలో
  rationale: మొత్తం సంపదలో లేదా వస్తువులన్నిటిలోనుండి పదోవంతు కేటాయించాడనే సందర్భార్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐμέρισεν
  choice: కేటాయించాడు
  rationale: విభజించి ఒక భాగాన్ని ప్రత్యేకంగా ఇవ్వడం అనే క్రియాభావాన్ని కేవలం ‘ఇచ్చాడు’ కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: πρῶτον μὲν
  choice: మొదట
  rationale: రెండు దశలుగా వచ్చే పేర్ల వివరణలో మొదటి అంశాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: ἑρμηνευόμενος
  choice: అతని పేరు … అని అనువదించబడుతుంది
  rationale: మెల్కీసెదెకు అనే పేరుకు ఇచ్చే అర్థవివరణను సహజ తెలుగులో స్పష్టం చేయడానికి ‘అతని పేరు’ చేర్చబడింది.
- source_word: βασιλεὺς δικαιοσύνης
  choice: నీతి రాజు
  rationale: δικαιοσύνηకు సందర్భోచితమైన సాధారణ బైబిలు తెలుగు పదం ‘నీతి’; ఇది బిరుదులాంటి పేరువివరణను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἔπειτα δὲ καὶ
  choice: తరువాత … కూడా
  rationale: రెండవ వివరణకు మారే క్రమాన్ని, అలాగే καίలోని ‘కూడా’ భావాన్ని నిలుపుతుంది.
- source_word: βασιλεὺς Σαλήμ
  choice: షాలేము రాజు
  rationale: Σαλήμ అనే స్థలనామాన్ని లిప్యంతరీకరించి, దానితో కూడిన రాజబిరుదును సహజంగా అందిస్తుంది.
- source_word: ὅ ἐστιν
  choice: అంటే
  rationale: షాలేము అనే పేరుకు తరువాత వచ్చే వివరణను తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: βασιλεὺς εἰρήνης
  choice: శాంతి రాజు
  rationale: εἰρήνη యొక్క సాధారణ అర్థమైన ‘శాంతి’ని నిలుపుతూ, షాలేము పేరుకు రచయిత ఇచ్చిన వివరణను తెలియజేస్తుంది.
theological_decisions:
- issue: βασιλεὺς δικαιοσύνηςలో δικαιοσύνη పదం
  choice: నీతి రాజు
  alternative: న్యాయపు రాజు
  rationale: δικαιοσύνη ‘నీతి’ లేదా ‘న్యాయం’ అనే భావాలను ఇవ్వగలదు. ప్రధాన పాఠంలో విస్తృతమైన బైబిలు వాడుకకు అనుగుణంగా ‘నీతి’ని ఎంచుకొని, నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. పేర్ల అర్థవివరణ స్పష్టంగా ఉండేందుకు ఉద్ధరణ చిహ్నాలు వాడబడ్డాయి; మూలంలోని క్రమం మరియు ‘కూడా’ అనే అనుసంధానం నిలుపబడ్డాయి.
