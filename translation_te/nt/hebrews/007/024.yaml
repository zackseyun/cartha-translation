source:
  edition: SBLGNT
  text: ὁ δὲ διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα ἀπαράβατον ἔχει τὴν ἱερωσύνην·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: te
  text: అయితే ఆయన శాశ్వతంగా నిలిచి ఉంటాడు కాబట్టి, మార్పులేని[a] యాజకత్వాన్ని కలిగి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బదలాయించబడని,” అంటే మరొకరికి సంక్రమించని. గ్రీకు పదానికి “మార్పులేని” అనే భావమూ, “బదలాయించబడని” అనే భావమూ ఉండవచ్చు. సందర్భంలో, ఆయన శాశ్వతంగా జీవిస్తాడు కాబట్టి ఆయన యాజకత్వం మరొకరికి సంక్రమించదనేది ప్రధాన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: అయితే ఆయన
  rationale: ముందటి వచనంలోని మరణానికి లోబడిన అనేకమంది యాజకులకు విరుద్ధంగా యేసును సూచించే substantival article మరియు δέ యొక్క వ్యత్యాస భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: ఆయన ... నిలిచి ఉంటాడు కాబట్టి
  rationale: διά తో కూడిన articular infinitive కారణాన్ని సూచిస్తుంది; μένω ఇక్కడ ఉనికిలో కొనసాగడాన్ని తెలియజేస్తుంది.
- source_word: εἰς τὸν αἰῶνα
  choice: శాశ్వతంగా
  rationale: అంతం లేకుండా కొనసాగడాన్ని తెలిపే గ్రీకు కాలసూచక నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: ἀπαράβατον
  choice: మార్పులేని
  rationale: ఈ విశేషణం మార్పుకు లోబడనిది లేదా మరొకరికి బదలాయించబడనిది అనే భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో సహజంగా ఉండే విస్తృత అర్థాన్ని ఉంచి, సందర్భానుగుణమైన బదలాయించబడని భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: యాజకత్వాన్ని కలిగి ఉన్నాడు
  rationale: ἔχω ఇక్కడ యాజక పదవి లేదా స్థితిని కలిగి ఉండడాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ఇది స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἱερωσύνην
  choice: యాజకత్వం
  rationale: యాజకుని పదవి లేదా స్థితిని తెలిపే ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
theological_decisions:
- issue: క్రీస్తు యాజకత్వానికి సంబంధించి ἀπαράβατον యొక్క భావం
  choice: ప్రధాన పాఠంలో ‘మార్పులేని’ అని ఉంచి, ఆయన శాశ్వతంగా జీవించడం వల్ల ఆ యాజకత్వం కొనసాగుతుందనే భావాన్ని నిలిపాం.
  alternative: ‘బదలాయించబడని’ లేదా ‘మరొకరికి సంక్రమించని’ యాజకత్వం
  rationale: గ్రీకు పదంలో మార్పులేనిది, బదలాయించబడనిది అనే రెండు సమీప భావాలకు అవకాశం ఉంది. సందర్భం మరణించి వారసులచేత భర్తీ చేయబడిన యాజకులతో యేసును పోలుస్తుంది; కాబట్టి బదలాయింపులేని భావం ముఖ్యమైనదైనా, పదంలోని నిజమైన భావవ్యాప్తిని పాదటిప్పణితో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘శాశ్వతంగా నిలిచి ఉంటాడు’ అనే రూపం కొనసాగుతున్న ఉనికిని, ‘యాజకత్వం’ పదం పదవిని స్పష్టంగా తెలియజేస్తాయి.
