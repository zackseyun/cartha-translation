  terminology: ‘యాజకత్వం’ ἱερωσύνηకు ప్రామాణికమైన, సందర్భానికి తగిన పదం. ప్రధాన పాఠంలోని ‘మార్పులేని’ పదం ఒక సాధ్యమైన అర్థాన్ని ఇస్తుంది; పాదటిప్పణిలోని ‘బదలాయించబడని/మరొకరికి సంక్రమించని’ ప్రత్యామ్నాయం పదం యొక్క చర్చనీయమైన అర్థవ్యాప్తిని, సందర్భంలోని వారసత్వ-వ్యతిరేకతను సమతుల్యంగా తెలియజేస్తుంది.
