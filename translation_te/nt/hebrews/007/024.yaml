  source_fidelity: ‘అయితే ఆయన’ προηγούμενων అనేక యాజకులతో ఉన్న δέ-వ్యత్యాసాన్ని తగినట్లుగా వ్యక్తం చేస్తుంది. ‘శాశ్వతంగా నిలిచి ఉంటాడు కాబట్టి’ διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα యొక్క కారణార్థక, నిరంతర ఉనికి భావాన్ని కాపాడుతుంది. ‘మార్పులేని యాజకత్వాన్ని కలిగి ఉన్నాడు’ ἔχει τὴν ἱερωσύνην ἀπαράβατον ను సముచితంగా ఇస్తుంది; ἀπαράβατον యొక్క సందర్భానుగుణమైన ‘మరొకరికి సంక్రమించని’ భావాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
