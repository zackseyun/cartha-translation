id: HEB.7.8
reference: Hebrews 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: te
  text: ఇక్కడ మరణించే మనుషులు దశమభాగాలను స్వీకరిస్తారు; అయితే అక్కడ జీవిస్తున్నాడని సాక్ష్యం చెప్పబడినవాడు వాటిని స్వీకరిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడ అతని గురించి, అతడు జీవిస్తున్నాడని సాక్ష్యం చెప్పబడుతోంది.” గ్రీకు వాక్యం మెల్కీసెదెకు అక్షరార్థంగా అమరుడని నేరుగా నిర్ధారించకుండా, విషయాన్ని లేఖన సాక్ష్య రూపంలోనే ఉంచుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε
  choice: ఇక్కడ
  rationale: ἐκεῖ (‘అక్కడ’)తో ఉన్న వాక్చాతుర్యపూర్వక వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది; ప్రస్తుత లేవీయ యాజక వ్యవస్థను సూచిస్తుంది.
- source_word: δεκάτας
  choice: దశమభాగాలు
  rationale: సందర్భంలోని ధార్మిక-న్యాయ ఆచారానికి ఆధునిక ప్రామాణిక తెలుగు పదం.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: చనిపోయే మనుషులు
  rationale: వర్తమాన కృదంతం తెలియజేసే మరణాధీనతను నేరుగా నిలుపుతుంది; సందర్భంలో వీరు లేవీయ యాజకులే అయినా మూలంలోని సాధారణ నామపదాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: λαμβάνουσιν
  choice: స్వీకరిస్తారు
  rationale: దశమభాగాలను పొందడాన్ని అదనపు భావం జోడించకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: ఆదికాండంలోని మెల్కీసెదెకు వృత్తాంతాన్ని సూచిస్తూ ‘ఇక్కడ—అక్కడ’ వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: μαρτυρούμενος
  choice: సాక్ష్యం చెప్పబడుతోంది
  rationale: గ్రీకు నిష్క్రియ రూపాన్నీ, ఇది లేఖన సాక్ష్యంపై ఆధారపడిన ప్రకటన అన్న భావాన్నీ నిలుపుతుంది.
- source_word: ὅτι ζῇ
  choice: అతడు జీవిస్తున్నాడని
  rationale: ὅτι ఉపవాక్యాన్నీ వర్తమాన కాలాన్నీ స్పష్టంగా, సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: లేవీయ యాజకులు మరియు మెల్కీసెదెకు మధ్య వ్యత్యాస స్వభావం
  choice: మరణాధీనులైన లేవీయ యాజకులకు విరుద్ధంగా, మెల్కీసెదెకు జీవిస్తున్నాడని లేఖనం సాక్ష్యమిస్తున్నట్లు వాక్యం చెబుతుంది.
  alternative: మెల్కీసెదెకు స్వతహాగా అక్షరార్థంలో నిరంతరం అమరుడని ఈ వాక్యం నేరుగా బోధిస్తుంది.
  rationale: μαρτυρούμενος అనే నిష్క్రియ సాక్ష్యభాషను నిలుపడం ద్వారా, ఆదికాండ వృత్తాంతంలో అతని మరణం నమోదు కాకపోవడంపై హెబ్రీయుల పత్రిక చేసే వాదనను కాపాడుతుంది; అక్షరార్థ అమరత్వాన్ని అనువాదమే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఇక్కడ—అక్కడ’ వ్యత్యాసం మరియు నిష్క్రియ సాక్ష్యభాష ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
