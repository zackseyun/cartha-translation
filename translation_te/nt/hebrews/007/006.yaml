id: HEB.7.6
reference: Hebrews 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: te
  text: కాని వారి వంశావళిలో లెక్కించబడని ఇతడు అబ్రాహాము నుండి పదోవంతు తీసుకున్నాడు[a]; వాగ్దానాలను కలిగివున్న అబ్రాహామును ఆశీర్వదించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబ్రాహాము నుండి దశమభాగం స్వీకరించాడు.” గ్రీకు క్రియ పదోవంతు తీసుకోవడం లేదా స్వీకరించడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వాగ్దానాలను కలిగిన అబ్రాహామును.” గ్రీకులో ఇక్కడ వర్తమాన కృదంతం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: కాని వారి వంశావళిలో లెక్కించబడని ఇతడు
  rationale: γενεαλογούμενος అనే వర్తమాన కర్మణి కృదంతం వంశావళిలో నమోదు చేయబడడం లేదా లెక్కించబడడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో ‘వారు’ లేవి వంశస్థులను సూచిస్తారు. ఈ రూపం మెల్కీసెదెకు లేవీయ వంశావళికి చెందనివాడనే న్యాయపరమైన/యాజకత్వ సంబంధ వ్యత్యాసాన్ని కాపాడుతుంది; అతని ఉనికి లేదా మూలం గురించి అదనపు ఊహను చేర్చదు.
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: అబ్రాహాము దగ్గర పదోవంతు తీసుకున్నాడు
  rationale: క్రియ అబ్రాహాము నుండి పదోవంతు తీసుకోవడం లేదా స్వీకరించడం అనే భావాన్ని ఇస్తుంది. ‘పదోవంతు’ సాధారణ పాఠకులకు పారదర్శకంగా ఉంటుంది; ‘దశమభాగం స్వీకరించాడు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: వాగ్దానాలను పొందిన అబ్రాహామును
  rationale: ἔχοντα వర్తమాన కృదంతమైనప్పటికీ, ఇక్కడ అది వాగ్దానాల గ్రహీతగా/వాటిని కలిగివున్నవాడిగా అబ్రాహామును వర్ణిస్తుంది. తెలుగులో ‘వాగ్దానాలను పొందిన’ సహజంగా ఉండి సందర్భార్థాన్ని అందిస్తుంది; అక్షరార్థ వర్తమాన రూపం పాదసూచికలో ఉంచబడింది.
- source_word: εὐλόγηκεν
  choice: ఆశీర్వదించాడు
  rationale: గ్రీకు పరిపూర్ణ కాల క్రియ సూచించే పూర్తయిన చారిత్రక కార్యాన్ని సహజమైన తెలుగు భూతకాలంతో తెలిపింది. దాని కొనసాగుతున్న వాదనాత్మక ప్రాముఖ్యత సందర్భం ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: మెల్కీసెదెకు మరియు లేవీయ వంశావళి మధ్య వ్యత్యాసం
  choice: మెల్కీసెదెకు వారి వంశావళిలో లెక్కించబడని వ్యక్తిగా అనువదించడం
  alternative: వారి సంతతికి చెందనివాడు
  rationale: హెబ్రీయులకు రాసిన పత్రికలోని వాదన యాజకత్వ అర్హతను లేవీయ వంశావళితో పోలుస్తుంది. ‘వంశావళిలో లెక్కించబడని’ అనే రూపం ఆ అంశాన్ని నిలుపుతుంది; మెల్కీసెదెకు జీవసంబంధ మూలం లేదా స్వభావం గురించి గ్రంథం చెప్పనిదాన్ని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఇతడు’ సమీప సందర్భంలోని మెల్కీసెదెకును సూచిస్తుంది. ‘అబ్రాహాము దగ్గర’ సాధారణ పాఠకులకు ‘అబ్రాహాము నుండి’ కంటే సహజంగా ఉండగా, మూలంలోని సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
