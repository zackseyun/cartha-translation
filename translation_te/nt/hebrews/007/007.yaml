  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: te
  text: ఎలాంటి వివాదానికీ తావు లేకుండా[a], తక్కువ స్థాయిలో ఉన్నవాడు ఉన్నత స్థాయిలో ఉన్నవాని చేత ఆశీర్వదించబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎలాంటి వివాదం లేకుండా” లేదా “ఎలాంటి ప్రతివాదం లేకుండా.”
    reason: గ్రీకు ἀντιλογία పదానికి వివాదం, ప్రతివాదం, విరోధంగా మాట్లాడడం అనే సమీపార్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: ఎలాంటి వివాదానికీ తావు లేకుండా
  rationale: ఈ గ్రీకు నానుడి తరువాత చెప్పే సూత్రం వివాదానికి అతీతమైనదని సూచిస్తుంది. δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని తెలుగులో ప్రత్యేక పదంతో బలవంతంగా చూపకుండా వాక్యప్రవాహంలో ఉంచాం.
- source_word: τὸ ἔλαττον
  choice: తక్కువ స్థాయిలో ఉన్నవాడు
  rationale: నపుంసకలింగ తులనాత్మక పదం ఇక్కడ సాధారణంగా తక్కువ హోదా లేదా స్థానం గల వ్యక్తిని సూచిస్తుంది. ‘అల్పుడు’ అనే మాట కలిగించగల నైతిక తక్కువతన భావాన్ని నివారిస్తుంది.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: ఉన్నత స్థాయిలో ఉన్నవాని చేత
  rationale: ὑπό + షష్ఠీ విభక్తి కర్తృత్వాన్ని సూచిస్తుంది; κρείττων ఇక్కడ మెరుగైన నైతిక గుణం కంటే ఉన్నత హోదా లేదా స్థానాన్ని సూచిస్తుంది.
- source_word: εὐλογεῖται
  choice: ఆశీర్వదించబడతాడు
  rationale: వర్తమానకాల కర్మణి రూపాన్ని నేరుగా నిలుపుతూ, మెల్కీసెదెకు అబ్రాహామును ఆశీర్వదించిన సందర్భానికి తగిన ధార్మిక భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘తక్కువవాడు’, ‘ఉన్నతవాడు’ అనే పోలిక స్వభావం
  choice: తక్కువ స్థాయి గలవాడు ఉన్నత స్థాయి గలవాని చేత ఆశీర్వదించబడతాడనే సాధారణ సూత్రంగా అనువదించాం.
  alternative: ఇది కేవలం సామాజిక ఆచారాన్ని మాత్రమే సూచిస్తుందని భావించడం.
  rationale: హెబ్రీయులు 7 సందర్భంలో ఈ సూత్రం మెల్కీసెదెకు అబ్రాహాముకంటే ఉన్నతుడని రచయిత చేసే వాదనకు మద్దతిస్తుంది. అయితే ఆ వ్యాఖ్యానాన్ని వచనంలో అదనంగా చేర్చకుండా స్థాయి సంబంధమైన తులనను మాత్రమే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘తక్కువవాడు/గొప్పవాడు’ అనే సంక్షిప్త రూపాలు కలిగించగల విలువతీర్పును తగ్గించేందుకు ‘స్థాయి’ని స్పష్టం చేశాం; మూలంలోని హోదా-ఆధారిత తులనను కాపాడాం.
