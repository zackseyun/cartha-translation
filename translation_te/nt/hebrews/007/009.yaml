  rationale: 'ప్రధాన అనువాదాన్ని మార్చాల్సిన అవసరం లేదు. రెండు పాదటిప్పణులను మాత్రమే సవరించాం: మొదటిదానిలో అసహజమైన తెలుగు ప్రత్యామ్నాయాన్ని సహజమైన రూపంతో మార్చాం; రెండవదానిలో δεδεκάτωται పాసివ్ రూపం లేవి దశమభాగాలు చెల్లించినట్టు పరిగణించబడే సందర్భార్థానికి విరుద్ధంగా అర్థం కాకుండా స్పష్టీకరించాం. ‘మాటవరసకు’ అనే అర్హత వల్ల మూలంలోని వాక్చాతుర్య/ప్రతినిధి-భావపు మృదుత్వం నిలిచివుంది.'
