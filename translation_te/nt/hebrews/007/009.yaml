id: HEB.7.9
reference: Hebrews 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὡς ἔπος εἰπεῖν, δι’ Ἀβραὰμ καὶ Λευὶ ὁ δεκάτας λαμβάνων δεδεκάτωται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/009.yaml
  text: And[a], so to speak, through Abraham even Levi, who receives tithes, has paid tithes[b],
translation:
  language: te
  text: మాటవరసకు[a], దశమభాగాలు స్వీకరించే లేవి కూడా అబ్రాహాము ద్వారా దశమభాగాలు చెల్లించినట్టే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక విధంగా చెప్పాలంటే”; “అలా చెప్పవచ్చంటే.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో పర్ఫెక్ట్ పాసివ్ రూపం ఉంది; అక్షరార్థానికి దగ్గరగా, “దశమభాగాలు చెల్లించినవాడిగా చేయబడ్డాడు” అని చెప్పవచ్చు. అంటే, అబ్రాహాము ద్వారా లేవి దశమభాగాలు చెల్లించినవాడిగా పరిగణించబడ్డాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: మాటవరసకు
  rationale: ఇది చెప్పబోయే విషయాన్ని అక్షరార్థ ప్రకటనగా కాక, ఒక అర్హతతో కూడిన వాక్యంగా పరిచయం చేసే గ్రీకు నుడికారం. ‘మాటవరసకు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ అలంకారిక మృదుత్వాన్ని నిలుపుతుంది.
- source_word: δι’ Ἀβραὰμ
  choice: అబ్రాహాము ద్వారా
  rationale: జనిటివ్‌తో διά మధ్యవర్తిత్వం లేదా సాధనత్వాన్ని సూచిస్తుంది. లేవి అబ్రాహాము చేసిన కార్యంలో ప్రతినిధిగా పరిగణించబడుతున్నాడనే వాదనను అదనంగా వివరించకుండా ఇది కాపాడుతుంది.
- source_word: καὶ Λευὶ
  choice: లేవి కూడా
  rationale: ఇక్కడ καί ఆశ్చర్యకరమైన విస్తరణను నొక్కిచెప్పే సముచ్చయార్థం కలిగి ఉంది. తెలుగులో ‘కూడా’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ὁ δεκάτας λαμβάνων
  choice: దశమభాగాలు స్వీకరించే
  rationale: వర్తమాన కృదంతం లేవి యొక్క యాజక సంబంధమైన లక్షణాత్మక పాత్రను వర్ణిస్తుంది. ‘స్వీకరించే’ అనేది ‘వసూలు చేసే’ కంటే మూలంలోని తటస్థతను బాగా నిలుపుతుంది.
- source_word: δεκάτας
  choice: దశమభాగాలు
  rationale: ఇది సమర్పించబడే పదోవంతును సూచించే ఆరాధనా-ఆర్థిక పదం. ‘దశమభాగాలు’ స్పష్టమైన, ప్రస్తుత ప్రామాణిక తెలుగు రూపం.
- source_word: δεδεκάτωται
  choice: దశమభాగాలు చెల్లించినట్టే
  rationale: గ్రీకులో ఇది పర్ఫెక్ట్ పాసివ్ రూపం (‘దశమభాగం తీసుకోబడినవాడయ్యాడు’ అనే సంక్షిప్త నిర్మాణం); సందర్భంలో లేవి అబ్రాహాము ద్వారా దశమభాగం ఇచ్చినవాడిగా పరిగణించబడుతున్నాడనే భావం. తెలుగులో అక్షరానువాద పాసివ్ అసహజంగా, స్వీకరణార్థంలో అపార్థకంగా ఉంటుంది; ‘చెల్లించినట్టే’ సందర్భార్థాన్ని తెలియజేస్తూ ὡς ἔπος εἰπεῖν వల్ల వచ్చే అర్హతను నిలుపుతుంది.
theological_decisions:
- issue: అబ్రాహాము కార్యంలో లేవి యొక్క ప్రతినిధి భాగస్వామ్యం
  choice: లేవి అబ్రాహాము ద్వారా దశమభాగాలు చెల్లించినట్టుగా పరిగణించబడుతున్నాడనే వాదనను అనువాదం నిలుపుతుంది.
  alternative: దీనిని వంశపరమైన సమష్టి ప్రతినిధిత్వంగా స్పష్టంగా నిర్వచించడం, లేదా కేవలం అలంకారిక మాటగా పరిమితం చేయడం.
  rationale: వాక్యం మెల్కీసెదెకు లేవీయ క్రమంపై ఉన్న ఆధిక్యాన్ని వాదిస్తుంది; అయితే ఆ భాగస్వామ్యం పనిచేసే సిద్ధాంతపరమైన విధానాన్ని వివరించదు. ‘అబ్రాహాము ద్వారా’ మరియు ‘మాటవరసకు’ అనే పదబంధాలు ఈ ఉద్దేశపూర్వక ఉద్రిక్తతను కాపాడుతాయి.
- issue: δεδεκάτωται యొక్క పాసివ్ రూపం మరియు సందర్భార్థం
  choice: ప్రధాన పాఠ్యంలో సహజమైన ‘దశమభాగాలు చెల్లించినట్టే’ అని ఇచ్చి, గ్రీకు పాసివ్ రూపాన్ని పాదటిప్పణిలో తెలియజేయడం.
  alternative: ‘దశమభాగానికి లోనయ్యాడు’ లేదా ‘దశమభాగం తీసుకోబడినవాడయ్యాడు’ వంటి రూపపరంగా దగ్గరైన అనువాదం.
  rationale: అక్షరానువాద పాసివ్ తెలుగులో లేవి నుండి దశమభాగం ఇవ్వబడిందనే దిశను స్పష్టంగా చూపదు. సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మూలరూపంలోని సంక్షిప్తతను పాదటిప్పణిలో సంరక్షించడం రూపం-అర్థం రెండింటికీ న్యాయం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘దశమభాగాలు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి ఆరాధనా సందర్భాన్నీ నిలుపుతుంది. మూలంలోని ఒక్క వాక్య ప్రవాహం, అలంకారిక అర్హత, ప్రతినిధి భావం సంరక్షించబడ్డాయి.
