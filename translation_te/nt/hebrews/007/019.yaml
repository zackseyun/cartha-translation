source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: te
  text: ఎందుకంటే ధర్మశాస్త్రం దేనినీ పరిపూర్ణం చేయలేదు[a]. అయితే, మరింత మేలైన నిరీక్షణకు ప్రవేశం కలిగింది[b]; దాని ద్వారా మనం దేవుని సన్నిధికి చేరుకుంటాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేనినీ సంపూర్ణతకు తీసుకురాలేదు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మరింత మేలైన నిరీక్షణను ప్రవేశపెట్టడం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: దేనినీ
  rationale: క్రియకు కర్మగా ఉన్న సంపూర్ణ నిరాకరణను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను అందించే అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐτελείωσεν
  choice: పరిపూర్ణం చేయలేదు
  rationale: హెబ్రీయులకు పత్రికలో ఉద్దేశిత గమ్యానికి లేదా సంపూర్ణ స్థితికి తీసుకురావడం అనే τελειόω పదంలోని ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: ὁ νόμος
  choice: ధర్మశాస్త్రం
  rationale: సందర్భంలో మోషే ధర్మశాస్త్రాన్నీ దాని యాజక వ్యవస్థనూ సూచించే, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో స్పష్టమైన పదం.
- source_word: ἐπεισαγωγὴ
  choice: ప్రవేశపెట్టబడింది
  rationale: గ్రీకులోని నామవాచక నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరచేందుకు క్రియారూపం వాడబడింది; అదనంగా లేదా దాని స్థానంలో తీసుకురావడం అనే భావం నిలిచింది.
- source_word: δὲ
  choice: అయితే
  rationale: ధర్మశాస్త్రం సాధించలేనిదానికీ మెరుగైన నిరీక్షణ తీసుకురాబడడానికీ మధ్యనున్న వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: κρείττονος ἐλπίδος
  choice: మరింత మేలైన నిరీక్షణ
  rationale: హెబ్రీయులకు పత్రికలో పునరావృతమయ్యే κρείττων అనే తులనాత్మక పదం యొక్క ‘మేలైన’ భావాన్ని నిలుపుతుంది.
- source_word: δι’ ἧς
  choice: దాని ద్వారా
  rationale: స్త్రీలింగ సంబంధ సర్వనామం ‘నిరీక్షణ’ను సూచిస్తుందనే సహజ అన్వయాన్ని, సాధన భావాన్ని నిలుపుతుంది.
- source_word: ἐγγίζομεν
  choice: మనం … సమీపిస్తాం
  rationale: దేవుని సన్నిధికి ప్రవేశం అనే ఆరాధనా సంబంధ భావాన్ని కాపాడుతూ, ఆధునిక తెలుగులో గంభీరంగా మరియు స్పష్టంగా ఉంటుంది.
- source_word: τῷ θεῷ
  choice: దేవుని
  rationale: ‘సమీపించు’ క్రియతో సహజమైన తెలుగు విభక్తి నిర్మాణాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: ధర్మశాస్త్రానికి సంబంధించి τελειόω పదం యొక్క భావం
  choice: ధర్మశాస్త్రం దేనినీ పరిపూర్ణం చేయలేదని అనువదించడం
  alternative: ధర్మశాస్త్రం ఏదీ సాధించలేదు; లేదా ధర్మశాస్త్రం దేనినీ సంపూర్ణతకు తీసుకురాలేదు
  rationale: ‘పరిపూర్ణం చేయలేదు’ అనేది దేవుని ఎదుట ఉద్దేశిత సంపూర్ణ స్థితి, సమాప్తి, ప్రవేశం అనే భావాలను నిలుపుతుంది; ధర్మశాస్త్రం పూర్తిగా పనికిరానిదని అతిగా చెప్పదు.
- issue: ప్రతికూల వాక్యం తరువాత ఉన్న సంక్షిప్త నామవాచక విరోధ నిర్మాణం
  choice: ‘అయితే, మరింత మేలైన నిరీక్షణ ప్రవేశపెట్టబడింది’ అని సహజమైన తెలుగు క్రియారూపంలో వ్యక్తపరచడం
  alternative: అయితే మరింత మేలైన నిరీక్షణను ప్రవేశపెట్టడం జరిగింది
  rationale: గ్రీకులో స్పష్టమైన సమాపక క్రియ లేకున్నా ఉన్న విరోధ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; కాలం లేదా కార్యసాధకుని అనవసరంగా నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ధర్మశాస్త్రం,’ ‘పరిపూర్ణం,’ ‘నిరీక్షణ,’ ‘సమీపిస్తాం’ అనే పదాలు పత్రికలోని న్యాయ, సంపూర్ణత, నిరీక్షణ, దేవుని సన్నిధికి ప్రవేశం అనే ప్రధాన భావసంబంధాలను నిలుపుతాయి.
