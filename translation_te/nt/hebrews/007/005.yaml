- from: లేవి కుమారులలో యాజకత్వాన్ని పొందేవారు ధర్మశాస్త్రం ప్రకారం ప్రజల దగ్గర, అంటే తమ సహోదరుల దగ్గర[a], పదవ వంతు వసూలు చేయాలనే ఆజ్ఞను కలిగి ఉన్నారు. ఆ సహోదరులు కూడా అబ్రాహాము నడుమునుండి వచ్చినవారే[b].
