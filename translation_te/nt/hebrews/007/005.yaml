source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: te
  text: లేవి కుమారులలో యాజకత్వాన్ని పొందేవారికి ధర్మశాస్త్రం ప్రకారం ప్రజల నుండి—అంటే, తమ సహోదరుల నుండి[a]—పదవ వంతు వసూలు చేయమని ఆజ్ఞ ఉంది; అయినప్పటికీ, ఆ సహోదరులు కూడా అబ్రాహాము నడుము నుండి వచ్చినవారే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ తోటి ఇశ్రాయేలీయుల నుండి.” గ్రీకు పాఠంలో “తమ సహోదరుల నుండి” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, “అబ్రాహాము వంశస్థులే.” అక్షరార్థంగా, “అబ్రాహాము నడుము నుండి వచ్చినవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: లేవి కుమారులలో
  rationale: ἐκ యొక్క విభాగార్థాన్ని, υἱῶν యొక్క వంశీయ భాషను నిలుపుతూ, యాజకత్వం పొందిన లేవి వంశస్థులలోని నిర్దిష్ట వర్గాన్ని సూచిస్తుంది.
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: యాజకత్వాన్ని పొందేవారు
  rationale: λαμβάνοντες ను స్వయంగా చేపట్టడం కంటే నియామకంగా లేదా స్వీకరణగా చూపుతుంది; ἱερατείαకు ‘యాజకత్వం’ సహజమైన గౌరవప్రద పదం.
- source_word: ἐντολὴν ἔχουσιν
  choice: ఆజ్ఞను కలిగి ఉన్నారు
  rationale: గ్రీకు నామవాచక నిర్మాణాన్ని నిలిపి, ἐντολήలోని ధర్మశాస్త్ర సంబంధమైన అధికారాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἀποδεκατοῦν
  choice: పదవ వంతు వసూలు చేయాలి
  rationale: ఇది తాము పదవ వంతు ఇవ్వడాన్ని కాక, ఇతరుల దగ్గర నుంచి దాన్ని తీసుకోవడాన్ని సూచిస్తుంది.
- source_word: τὸν λαὸν
  choice: ప్రజల దగ్గర
  rationale: λαόςకు నేరుగా సరిపడే అనువాదం; తరువాతి వివరణ ఇది ఇశ్రాయేలు ప్రజలను సూచిస్తుందని స్పష్టం చేస్తుంది.
- source_word: κατὰ τὸν νόμον
  choice: ధర్మశాస్త్రం ప్రకారం
  rationale: κατά యొక్క ప్రమాణాత్మక భావాన్ని, మోషే ధర్మశాస్త్ర సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τοῦτ’ ἔστιν
  choice: అంటే
  rationale: వివరణాత్మక అనుబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: తమ సహోదరుల దగ్గర
  rationale: గ్రీకులోని పురుషలింగ బంధుత్వ పదాన్ని నిలుపుతూ, సందర్భంలో తోటి ఇశ్రాయేలీయులను సూచించే విస్తృత భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: καίπερ
  choice: అయినప్పటికీ అనే భావాన్ని రెండవ వాక్య నిర్మాణంలో ‘కూడా ... వారే’తో వ్యక్తం చేయడం
  rationale: పంచుకున్న అబ్రాహాము వంశాన్ని వ్యతిరేకతతో నొక్కిచెప్పే concessive భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: అబ్రాహాము నడుమునుండి వచ్చినవారు
  rationale: శారీరక వంశపారంపర్యాన్ని సూచించే గ్రీకు రూపకాన్ని నిలుపుతుంది; సాధారణ అర్థాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు సమాజాన్ని సూచించే బంధుత్వ భాష
  choice: తమ సహోదరులు
  alternative: తమ తోటి ఇశ్రాయేలీయులు
  rationale: ἀδελφούς అనే పురుషలింగ బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, దాని సామూహిక ఇశ్రాయేలీయ భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: శారీరక వంశపారంపర్య రూపకాన్ని నిలుపడం
  choice: అబ్రాహాము నడుమునుండి వచ్చినవారు
  alternative: అబ్రాహాము వంశస్థులు
  rationale: హెబ్రీయులు 7లోని వాదనకు ముఖ్యమైన ఉమ్మడి శారీరక వంశాన్ని తెలిపే స్పష్టమైన గ్రీకు రూపకాన్ని తొలగించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ధర్మశాస్త్రం,’ ‘యాజకత్వం,’ ‘పదవ వంతు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉపయోగించింది. గ్రీకు వాక్యంలోని దీర్ఘ అనుబంధ నిర్మాణాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించినప్పటికీ, తార్కిక సంబంధం మరియు వ్యతిరేక నొక్కింపు నిలిపాయి.
