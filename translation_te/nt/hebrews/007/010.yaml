- from: ఎందుకంటే, మెల్కీసెదెకు అతణ్ణి కలిసినప్పుడు, అతడు ఇంకా తన పితరుని నడుములోనే ఉన్నాడు.[a]
  to: ఎందుకంటే, మెల్కీసెదెకు అబ్రాహామును కలిసినప్పుడు, లేవీ ఇంకా తన తండ్రి నడుములోనే ఉన్నాడు.[a]
  rationale: The revision retains the source’s ‘loins’ metaphor and explanatory force while resolving referents that are clear from the immediate context. It replaces the less current ‘పితరుడు’ with ‘తండ్రి,’ preserving the Greek lexical form, and places the necessary ancestral explanation in the footnote rather than expanding the main text interpretively.
  reviewer_model: gpt-5.6-terra
