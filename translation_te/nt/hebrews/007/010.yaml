source:
  edition: SBLGNT
  text: ἔτι γὰρ ἐν τῇ ὀσφύϊ τοῦ πατρὸς ἦν ὅτε συνήντησεν αὐτῷ ⸀Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: te
  text: ఎందుకంటే, మెల్కీసెదెకు అబ్రాహామును కలిసినప్పుడు, లేవీ ఇంకా తన తండ్రి నడుములోనే ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత భావానువాదంగా, “లేవీ ఇంకా తన పూర్వికుని దేహంలోనే ఉన్నాడు” అని చెప్పవచ్చు. గ్రీకులో అక్షరార్థంగా “తన తండ్రి నడుములో” అని ఉంది; ఇది వంశపారంపర్య ఉద్భవాన్ని సూచించే నుడికారం. ఇక్కడ ‘తండ్రి’ అబ్రాహామును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: ఇంకా
  rationale: సమావేశం జరిగిన సమయంలో కొనసాగుతున్న పూర్వస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν τῇ ὀσφύϊ
  choice: నడుములోనే
  rationale: వంశోత్పత్తిని సూచించే గ్రీకు శరీరరూపకాన్ని వ్యాఖ్యానాత్మకంగా చదును చేయకుండా నిలుపుతుంది; ‘లోనే’ రూపకంలోని స్థితిని నొక్కిచెబుతుంది.
- source_word: τοῦ πατρὸς
  choice: తన పితరుని
  rationale: గ్రీకులోని ‘తండ్రి/పితరుడు’ అనే బంధపదాన్ని నిలుపుతూ, ఇక్కడ దూర వంశపూర్వికుడైన అబ్రాహామును సూచించడానికి ‘పితరుడు’ సహజంగా సరిపోతుంది.
- source_word: ἦν
  choice: ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాలంలోని సాధారణ అస్తిత్వార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὅτε
  choice: కలిసినప్పుడు
  rationale: కాలసంబంధాన్ని తెలుగు ఉపవాక్య నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: συνήντησεν
  choice: కలిసిన
  rationale: ఆదికాండపు సంఘటనకు సరిపోయే సరళమైన ‘కలుసుకొను’ అర్థాన్ని ఇస్తుంది.
- source_word: αὐτῷ
  choice: అతణ్ణి
  rationale: గ్రీకులో ఉన్న సర్వనామాన్ని నిలుపుతుంది; సందర్భం దాని సూచితుడు అబ్రాహాము అని తెలియజేస్తుంది.
- source_word: Μελχισέδεκ
  choice: మెల్కీసెదెకు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తినామాన్ని లిప్యంతరీకరించింది.
theological_decisions:
- issue: లేవి అబ్రాహాము వంశంలో ఉన్నాడనే భావాన్ని రూపకంగా వ్యక్తపరచడం
  choice: ‘తన పితరుని నడుములోనే ఉన్నాడు’ అనే స్పష్టమైన శరీరరూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘తన పూర్వికుని దేహంలోనే ఉన్నాడు’ లేదా ‘తన పితరుని బీజంలో ఉన్నాడు’
  rationale: రచయిత వంశపారంపర్య ప్రతినిధిత్వం ఆధారంగా చేస్తున్న వాదనను కనిపించేలా ఉంచుతుంది; ప్రధాన పాఠ్యంలో సాంకేతిక వేదాంత వివరణను చేర్చదు.
- issue: ‘పితరుడు’ ఎవరో గుర్తించడం
  choice: ప్రధాన పాఠ్యంలో ‘తన పితరుని’ అని ఉంచడం
  alternative: ‘తన పూర్వికుడైన అబ్రాహాము’
  rationale: సూచితుడు అబ్రాహామే అయినా, గ్రీకు పాఠ్యం పేరును కాక బంధపదాన్ని వాడుతుంది. సందర్భం గుర్తింపును అందిస్తుంది; అనువాదం అదనపు నిర్దిష్టతను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజ వాక్యక్రమాన్ని వాడుతూ, గ్రీకు మూలంలోని వంశపారంపర్య శరీరరూపకాన్ని గౌరవప్రదమైన ‘నడుము’ పదంతో నిలిపింది. ‘పితరుడు’ దూర వంశపూర్వికుని భావాన్ని మోయడంతో పాటు మూలంలోని πατήρ పదానికి సమీపంగా ఉంటుంది.
