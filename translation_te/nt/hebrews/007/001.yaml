id: HEB.7.1
reference: Hebrews 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: te
  text: ఎందుకంటే ఈ మెల్కీసెదెకు—షాలేము రాజు, సర్వోన్నతుడైన దేవుని యాజకుడు—రాజుల సంహారం నుండి[a] తిరిగి వస్తున్న అబ్రాహామును కలుసుకొని, అతన్ని ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజులను ఓడించి తిరిగి వస్తున్నప్పుడు.” గ్రీకులో మరింత అక్షరార్థంగా, “రాజుల సంహారం నుండి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ
  choice: ఎందుకంటే ఈ
  rationale: γάρ మునుపటి వాదనకు వివరణాత్మక సంబంధాన్ని చూపుతుంది; Οὗτος లోని నిర్దేశక బలాన్ని ‘ఈ’ నిలుపుతుంది.
- source_word: Μελχισέδεκ
  choice: మెల్కీసెదెకు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: βασιλεὺς Σαλήμ
  choice: షాలేము రాజు
  rationale: βασιλεύς అంటే ‘రాజు’; Σαλήμ పేరును ఆదికాండము 14తో సంబంధం గుర్తించగల విధంగా లిప్యంతరీకరించాం.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: సర్వోన్నతుడైన దేవుని యాజకుడు
  rationale: ὕψιστος దేవుణ్ణి విశేషించే బిరుదుగా ఉండే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: అబ్రాహామును కలుసుకొని
  rationale: సంబంధక కృదంతాన్ని సహజమైన తెలుగు క్రియాక్రమంగా అనువదించాం.
- source_word: ὑποστρέφοντι
  choice: తిరిగి వస్తున్న
  rationale: వర్తమాన కృదంతం సూచించే, కలుసుకోవడంతో సమకాలీనంగా కొనసాగుతున్న చర్యను నిలుపుతుంది.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: రాజులను సంహరించి
  rationale: κοπήలోని ‘నరికి వేయడం/సంహారం’ అనే బలాన్ని నిలుపుతూ, తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ εὐλογήσας αὐτόν
  choice: అతన్ని ఆశీర్వదించాడు
  rationale: రెండవ కృదంత చర్యను తెలుగు ప్రధాన క్రియగా ఇచ్చి, మెల్కీసెదెకు అబ్రాహామును ఆశీర్వదించాడనే భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: τοῦ θεοῦ τοῦ ὑψίστου అనే దైవ బిరుదు
  choice: సర్వోన్నతుడైన దేవుని యాజకుడు
  alternative: సర్వోన్నత దేవుని యాజకుడు
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు. గ్రీకులో ὕψιστος దేవుణ్ణి విశేషిస్తున్న సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా చూపించడానికి ఈ రూపాన్ని ఎంచుకున్నాం.
- issue: κοπή యొక్క యుద్ధసందర్భ భావం
  choice: రాజులను సంహరించి
  alternative: రాజులను ఓడించి
  rationale: ‘ఓడించి’ సందర్భానికి సాధ్యమైన సౌమ్య వ్యాఖ్యానం; అయితే κοπή పదంలోని హింసాత్మకమైన ‘నరికి పడవేయడం/సంహారం’ భావాన్ని ప్రధాన పాఠంలో నిలిపాం. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. దీర్ఘమైన గ్రీకు వాక్యభాగంలోని ఉపపదవివరణను డాష్‌లతో వేరు చేసి పఠనసౌలభ్యం కల్పించాం. వాక్యం తదుపరి వచనంలో కొనసాగుతుందనే మూల నిర్మాణం ఉన్నప్పటికీ, తెలుగు పఠనసౌలభ్యం కోసం ఈ వచనాన్ని సంపూర్ణ వాక్యంగా ఇచ్చాం.
