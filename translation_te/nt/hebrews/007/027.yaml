revisions:
- from: ఇతర ప్రధాన యాజకులవలె, మొదట తమ సొంత పాపాల కోసం, ఆ తరువాత ప్రజల పాపాల కోసం బలులు అర్పించాల్సిన అవసరం ఆయనకు రోజురోజుకూ లేదు. ఎందుకంటే ఆయన తనను తానే అర్పించుకున్నప్పుడు, దీన్ని ఒక్కసారే శాశ్వతంగా చేశాడు.[a]
  to: ఇతర ప్రధాన యాజకులవలె, మొదట తమ సొంత పాపాల కోసం, ఆ తరువాత ప్రజల పాపాల కోసం బలులు అర్పించాల్సిన అవసరం ఆయనకు ప్రతిరోజూ లేదు. ఎందుకంటే తనను తానే అర్పించుకోవడం ద్వారా ఆయన దీన్ని ఒక్కసారిగా చేశాడు.[a]
  rationale: 'The revision replaces an unnatural and potentially misleading expression for ἐφάπαξ with “ఒక్కసారిగా,” and renders the aorist participle as means: “తనను తానే అర్పించుకోవడం ద్వారా.” It retains the draft’s faithful presentation of the high-priestly comparison, the ordered sacrifices, and Christ’s self-offering without suggesting that he offered for his own sins.'
