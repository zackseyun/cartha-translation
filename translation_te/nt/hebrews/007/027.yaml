id: HEB.7.27
reference: Hebrews 7:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: te
  text: ఇతర ప్రధాన యాజకులవలె, మొదట తమ సొంత పాపాల కోసం, ఆ తరువాత ప్రజల పాపాల కోసం బలులు అర్పించాల్సిన అవసరం ఆయనకు ప్రతిరోజూ లేదు. ఎందుకంటే తనను తానే అర్పించుకోవడం ద్వారా ఆయన దీన్ని ఒక్కసారిగా చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒక్కసారే, ఇక మళ్లీ చేయనవసరం లేకుండా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: రోజురోజుకూ
  rationale: ఈ గ్రీకు నుడికారం ప్రతిరోజూ పునరావృతమయ్యే అవసరాన్ని సూచిస్తుంది; ‘రోజురోజుకూ’ దాని పునరావృత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀνάγκην
  choice: అవసరం
  rationale: ἔχει ἀνάγκην అనే నిర్మాణానికి ‘అవసరం ఉంది’ సహజమైన తెలుగు సమానం.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: ఇతర ప్రధాన యాజకులవలె
  rationale: పోలిక లేవీయ ప్రధాన యాజకులతో ఉందని తెలుపుతుంది. తెలుగులో పోలిక స్పష్టంగా ఉండేందుకు ‘ఇతర’ను చేర్చినా, గ్రీకు బహువచనం ‘ప్రధాన యాజకులు’ నిలుపబడింది.
- source_word: πρότερον ... ἔπειτα
  choice: మొదట ... ఆ తరువాత
  rationale: బలుల అర్పణ క్రమాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: తమ సొంత పాపాల కోసం
  rationale: బహువచన ‘ప్రధాన యాజకులు’కు అనుగుణంగా తెలుగు ప్రతిబింబక రూపం వాడబడింది; ὑπέρ యొక్క బలి సంబంధమైన ‘కోసం’ భావం నిలిచింది.
- source_word: θυσίας ἀναφέρειν
  choice: బలులు అర్పించడం
  rationale: బలి ఆచార సందర్భంలో ἀναφέρωకు ‘అర్పించడం’ ప్రామాణికమైన, సహజమైన తెలుగు సమానం.
- source_word: τῶν τοῦ λαοῦ
  choice: ప్రజల పాపాల కోసం
  rationale: గ్రీకులో ‘పాపాలు’ పదం పూర్వపదం నుంచి గ్రహించాల్సిన అధ్యాహారం. తెలుగులో అస్పష్టత రాకుండా దాన్ని పూరించాం.
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: ఎందుకంటే ... దీన్ని ... చేశాడు
  rationale: τοῦτο ముందున్న బలి కార్యాన్ని తిరిగి సూచిస్తుంది; ‘దీన్ని’ ఆ సూచనను ఉంచుతుంది.
- source_word: ἐφάπαξ
  choice: ఒక్కసారే శాశ్వతంగా
  rationale: ఒకేసారి జరిగినదనే భావంతో పాటు దాని నిర్ణాయకమైన, తిరిగి చేయనవసరం లేని స్వభావాన్ని వ్యక్తపరుస్తుంది.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: ఆయన తనను తానే అర్పించుకున్నప్పుడు
  rationale: అవరిస్ట్ కృదంతానికి కాలసంబంధ భావాన్ని ఇచ్చి, క్రీస్తే అర్పించేవాడూ అర్పణయూ అనే బలి సంబంధమైన బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: τοῦτο (‘దీన్ని’) యొక్క పరిధి
  choice: క్రీస్తు తనను తానే అర్పించుకోవడం ద్వారా చేసిన నిర్ణాయక బలి కార్యాన్ని సూచించేలా అనువదించబడింది; ఆయన తన పాపాల కోసం అర్పించాడని చెప్పదు.
  alternative: ‘దీన్ని’ కేవలం ప్రజల పాపాల కోసం అర్పించడానికే వర్తిస్తుందని స్పష్టీకరించడం.
  rationale: వాక్యంలోని పోలికను, సూచనలోని కొంత విస్తృతతను నిలుపుతూ, హెబ్రీయులకు పత్రికలోని పాపరహిత క్రీస్తు సందర్భానికి విరుద్ధమైన భావాన్ని దిగుమతి చేయకుండా ఈ రూపం ఉంటుంది.
- issue: క్రీస్తు స్వీయ అర్పణ
  choice: ‘తనను తానే అర్పించుకున్నప్పుడు’
  alternative: ‘తనను తానే ఇచ్చుకున్నప్పుడు’
  rationale: ἀναφέρω యొక్క యాజక, బలి సంబంధమైన భావాన్ని ‘అర్పించు’ నిలుపుతుంది; సాధారణ స్వీయదానంగా భావాన్ని పలుచన చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి భావసంబంధాన్ని ‘ఎందుకంటే’తో నిలిపాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పదబంధం చివర ఉంచబడింది.
