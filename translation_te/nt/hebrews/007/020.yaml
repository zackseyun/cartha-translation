  text: Καὶ καθ’ ὅσον οὐ χωρὶς ὁρκωμοσίας (οἱ μὲν γὰρ χωρὶς ὁρκωμοσίας εἰσὶν ἱερεῖς γεγονότες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/020.yaml
  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: te
  text: మరియు, ఇది ప్రమాణం లేకుండా జరగనందున (ఎందుకంటే వారు ఒకవైపు ప్రమాణం లేకుండానే యాజకులయ్యారు,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రమాణానికి అతీతంగా.’
    reason: χωρίς అనే పదానికి ‘లేకుండా’తో పాటు ‘వేరుగా/అతీతంగా’ అనే పదార్థ ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: Καὶ
  choice: అంతేకాక
  rationale: మునుపటి వాదనతో ఈ మాటను అనుసంధానిస్తూ, సాధారణ ‘మరియు’ కంటే ఇక్కడి వాదనాత్మక కొనసాగింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καθ’ ὅσον
  choice: ఇది … జరగలేదు
  rationale: ఈ అసంపూర్ణ గ్రీకు నిర్మాణం తరువాతి వచనంలో పూర్తవుతుంది. సందర్భంలోని కారణం/ప్రమాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘ఇది’ మరియు ‘జరగలేదు’ అనేవి పూరకంగా వాడబడ్డాయి; వాదన యొక్క బలాన్ని మార్చలేదు.
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: ప్రమాణం లేకుండా జరగలేదు
  rationale: ద్వినిషేధ భావాన్ని అలాగే నిలుపుతూ, యాజకత్వ నియామకం ప్రమాణంతో జరిగిందనే వాదనను ముందుగానే అతిగా విప్పకుండా తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ὁρκωμοσίας
  choice: ప్రమాణం
  rationale: ప్రమాణం చేయడం లేదా ప్రమాణపూర్వక ధృవీకరణ అనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేసే సాధారణ తెలుగు పదం.
- source_word: οἱ μὲν γὰρ
  choice: ఎందుకంటే, వారు ఒకవైపు
  rationale: γάρ యొక్క వివరణాత్మక భావాన్ని ‘ఎందుకంటే’తో, తరువాతి వచనంలోని δέతో ఏర్పడే μέν…δέ వ్యత్యాసాన్ని ‘ఒకవైపు’తో నిలుపుతుంది.
- source_word: χωρὶς ὁρκωμοσίας
  choice: ప్రమాణం లేకుండానే
  rationale: మొదటి ప్రయోగంతో పదార్థ సారూప్యతను కాపాడుతూ, ‘-నే’ ద్వారా లేవీయ యాజకులతో ఏర్పడే వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: యాజకులయ్యారు
  rationale: పూర్తయిన నియామకం వల్ల ఏర్పడిన స్థితిని తెలుగులో సహజంగా తెలిపే రూపం; ‘యాజకులుగా చేయబడ్డారు’ అనే అవసరంలేని కర్మణి భావాన్ని రుద్దదు.
theological_decisions:
- issue: మునుపటి యాజకులకు మరియు ప్రమాణంతో స్థాపించబడిన యాజకత్వానికి మధ్య వ్యత్యాసం
  choice: ఈ వచనంలో పూర్వపు యాజకులు ప్రమాణం లేకుండా యాజకులయ్యారని మాత్రమే స్పష్టంగా చెప్పి, తరువాతి వచనంలో వచ్చే యేసు యాజకత్వపు ప్రమాణ-వ్యత్యాసానికి ‘ఒకవైపు’ ద్వారా స్థలం ఉంచబడింది.
  alternative: దీనిని పాత నిబంధన యాజకత్వమంతటికీ మరియు మెస్సీయ శాశ్వత యాజకత్వానికీ మధ్య పూర్తి సిద్ధాంతపరమైన వ్యత్యాసంగా ఇక్కడే విస్తరించడం.
  rationale: తక్షణ సందర్భం కీర్తన 110:4 ఆధారంగా యేసు యాజకత్వాన్ని చర్చించినా, ఈ వచనభాగం స్వయంగా ప్రమాణానికి సంబంధించిన వ్యత్యాసాన్ని మాత్రమే ప్రారంభిస్తుంది. అందువల్ల తరువాతి వచనంలోని భావాన్ని ముందుగానే చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే హెబ్రీయులకు పత్రికలోని వాదనాత్మక గంభీరతను నిలుపుతూ రూపొందించబడింది. మూలపాఠం ఈ వచనంలో తెరిచిన కుండలీకరణతో మరియు అసంపూర్ణ వ్యత్యాసంతో ముగుస్తున్నందున, తెలుగు ముసాయిదా కూడా తరువాతి వచనంతో కొనసాగేందుకు తెరిచి ఉంచబడింది.
