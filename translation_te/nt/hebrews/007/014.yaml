revisions:
- from: ఎందుకంటే, మన ప్రభువు యూదా గోత్రం నుండి ఉదయించాడనేది స్పష్టం[a]. ఆ గోత్రానికి సంబంధించి యాజకుల గురించి మోషే ఏమీ చెప్పలేదు.
  to: ఎందుకంటే, మన ప్రభువు యూదా నుండి ఉద్భవించాడని స్పష్టమే[a]; ఆ గోత్రాన్ని గురించి యాజకుల విషయంలో మోషే ఏమీ చెప్పలేదు.
  rationale: 'The revision more closely follows the Greek progression: the Lord is said to be from Judah, and Judah is then identified by the relative clause as the tribe concerning which Moses said nothing about priests. “ఉద్భవించాడు” is idiomatic for origin/descent, and the footnote preserves the metaphorical range of ἀνατέλλω without importing resurrection as the primary meaning.'
