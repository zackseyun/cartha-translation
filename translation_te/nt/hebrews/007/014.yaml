source:
  edition: SBLGNT
  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: te
  text: ఎందుకంటే, మన ప్రభువు యూదా నుండి ఉద్భవించాడని స్పష్టమే[a]; ఆ గోత్రాన్ని గురించి యాజకుల విషయంలో మోషే ఏమీ చెప్పలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదా నుండి ఉదయించాడు’ లేదా ‘పుట్టుకొచ్చాడు.’ గ్రీకు క్రియ ఉదయించడం లేదా చిగురించడం అనే చిత్రాన్ని సూచిస్తుంది. ఇక్కడ అది ప్రధానంగా పునరుత్థానాన్ని కాకుండా, యూదా నుండి వచ్చిన వంశమూలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: స్పష్టం
  rationale: ఈ విశేషణం అందరికీ తెలిసిన స్పష్టమైన వాస్తవాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘స్పష్టం’ సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἐξ Ἰούδα
  choice: యూదా గోత్రం నుండి
  rationale: ἐκ మూలం లేదా వంశసంబంధాన్ని సూచిస్తుంది. తెలుగులో ‘యూదా నుండి’ అనేది వ్యక్తి లేదా ప్రాంతం నుంచి వచ్చినట్టు వినిపించే అవకాశం ఉన్నందున, సందర్భంలో ఉద్దేశించిన గోత్రసంబంధాన్ని స్పష్టం చేయడానికి ‘గోత్రం’ చేర్చబడింది.
- source_word: ἀνατέταλκεν
  choice: ఉదయించాడు
  rationale: ἀνατέλλω యొక్క సంపూర్ణకాల రూపం ఉదయించడం లేదా మొలకెత్తడం అనే రూపకాన్ని కలిగి ఉంది. ఇక్కడ ప్రధానంగా పునరుత్థానం కాక, యూదా గోత్రం నుంచి వచ్చిన వంశమూలాన్ని సూచిస్తుంది; ‘ఉదయించాడు’ ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: ὁ κύριος ἡμῶν
  choice: మన ప్రభువు
  rationale: తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో బిరుదును యథాతథంగా ఉంచుతుంది; సందర్భానుసారం యేసును సూచించినా పేరును పాఠ్యంలో చేర్చదు.
- source_word: εἰς ἣν φυλήν
  choice: ఆ గోత్రానికి సంబంధించి
  rationale: ముందు పేర్కొన్న యూదా గోత్రాన్ని తిరిగి సూచిస్తూ, దాని విషయంగా మోషే చెప్పినదేమిటనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: περὶ ἱερέων οὐδὲν
  choice: యాజకుల గురించి ... ఏమీ
  rationale: గ్రీకు పాఠ్యం అమూర్తమైన ‘యాజకత్వం’ కంటే వ్యక్తులైన ‘యాజకులు’ అని చెబుతుంది; అదే భేదాన్ని నిలుపుతుంది.
- source_word: Μωϋσῆς ἐλάλησεν
  choice: మోషే ... చెప్పలేదు
  rationale: λαλέω ఇక్కడ మాట్లాడటం లేదా చెప్పటం అనే సాధారణ భావంలో ఉంది. ప్రతికూల οὐδὲνతో కలిపి ‘ఏమీ చెప్పలేదు’ సహజమైన తెలుగు.
theological_decisions:
- issue: ‘మన ప్రభువు’ అనే పదబంధం ఎవరిని సూచిస్తుంది
  choice: పాఠ్యంలో ‘మన ప్రభువు’ అనే బిరుదునే ఉంచి, సందర్భంలో దానిని యేసుగా గ్రహించడం
  alternative: ‘మన ప్రభువైన యేసు’ అని పేరును స్పష్టంగా చేర్చడం
  rationale: హెబ్రీయులకు రాసిన పత్రిక సందర్భం యేసు యూదా గోత్రసంబంధి అని, ఆయన యాజకత్వం లేవీయ వంశం నుంచి కాదని వాదిస్తుంది. అయితే మూలవాక్యంలో ‘యేసు’ అనే పేరు లేదు; కాబట్టి దాన్ని పాఠ్యంలో చేర్చకుండా బిరుదును నిలుపడం సముచితం.
- issue: ἀνατέταλκεν యొక్క భావం
  choice: యూదా గోత్రం నుంచి వంశమూలంగా ‘ఉదయించాడు’
  alternative: పునరుత్థానాన్ని ప్రధానంగా సూచించే ‘తిరిగి లేచాడు’
  rationale: తక్షణ సందర్భం గోత్రసంబంధం మరియు యాజక అర్హత గురించి మాట్లాడుతోంది. అందువల్ల క్రియలోని ఉదయించే రూపకాన్ని ఉంచుతూ, దానిని పునరుత్థానంగా మాత్రమే నిర్ధారించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. వాదనాత్మక అనుసంధానాన్ని ‘ఎందుకంటే’తో స్పష్టం చేశాం. ‘ప్రభువు,’ ‘యాజకులు,’ ‘గోత్రం’ వంటి స్థిరమైన బైబిలు పదాలను సాధారణ పాఠకులకు అర్థమయ్యే విధంగా ఉంచాం.
