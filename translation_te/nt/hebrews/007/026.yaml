id: HEB.7.26
reference: Hebrews 7:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: te
  text: ఎందుకంటే, పవిత్రుడు, దోషంలేనివాడు, కల్మషంలేనివాడు, పాపుల నుండి వేరుచేయబడినవాడు[a], ఆకాశాలకంటే ఉన్నతుడైనవాడు[b]—ఇలాంటి ప్రధాన యాజకుడే మనకు నిజంగా తగినవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపుల నుండి ప్రత్యేకంగా ఉంచబడినవాడు.” ఈ మాట ఆయన నైతిక పవిత్రతను, ప్రధాన యాజకునిగా ఆయనకున్న ఉన్నత స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆకాశాలకంటే పైగా హెచ్చించబడినవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιοῦτος
  choice: ఇలాంటి
  rationale: ముందటి వచనాల్లో వివరించిన ప్రధాన యాజకుని లక్షణాలను వెనక్కి సూచించే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనతో ఈ వాక్యానికి ఉన్న వివరణాత్మక సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: మనకు నిజంగా తగినవాడు
  rationale: ἡμῖν‌తో ఉన్న అనుకూలత భావాన్ని ‘మనకు’ తెలియజేస్తుంది; καί యొక్క ఉద్ఘాటనను ‘నిజంగా’ అందిస్తుంది; ἔπρεπεν యొక్క తగినతనాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀρχιερεύς
  choice: ప్రధాన యాజకుడు
  rationale: హెబ్రీయులకు పత్రికలోని యాజక పదవికి ప్రామాణికమైన, స్పష్టమైన తెలుగు పదబంధం.
- source_word: ὅσιος
  choice: పవిత్రుడు
  rationale: నైతిక, ఆరాధనాపరమైన పవిత్రత రెండింటికీ సరిపోయే సాధారణమైన గంభీర పదం.
- source_word: ἄκακος
  choice: దోషంలేనివాడు
  rationale: చెడు లేదా దుష్ట ఉద్దేశం లేని నైతిక నిర్దోషిత్వాన్ని తెలియజేస్తుంది; ‘హాని చేయనివాడు’ అనే బలహీన భావాన్ని నివారిస్తుంది.
- source_word: ἀμίαντος
  choice: కల్మషంలేనివాడు
  rationale: మలినపడని స్థితిని, దానిలోని యాజకసంబంధమైన శుద్ధత ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: పాపుల నుండి వేరుచేయబడినవాడు
  rationale: పూర్తి కృదంతం సూచించే కొనసాగుతున్న వేర్పాటు స్థితిని నేరుగా వ్యక్తం చేస్తుంది; ఆ వేర్పాటు ఎప్పుడు లేదా ఏ విధంగా జరిగిందో వాక్యంలో అదనంగా నిర్ణయించదు.
- source_word: ὑψηλότερος τῶν οὐρανῶν γενόμενος
  choice: ఆకాశాలకంటే ఉన్నతుడైనవాడు
  rationale: తులనాత్మక నిర్మాణాన్ని ‘ఆకాశాలకంటే ఉన్నతుడు’గా నిలుపుతూ, γενόμενος సూచించే ఫలిత స్థితిని తెలుగు ‘అయినవాడు’ ద్వారా సహజంగా అందిస్తుంది; కర్తృత్వాన్ని అదనంగా పేర్కొనదు.
theological_decisions:
- issue: ‘పాపుల నుండి వేరుచేయబడినవాడు’ అనే మాటకు అర్థం
  choice: నైతిక పవిత్రతను, యాజకునిగా ప్రత్యేక స్థితిని సూచించే నేర అనువాదం
  alternative: యేసు భూలోక సేవలో పాపులతో ఎప్పుడూ సంబంధం పెట్టుకోలేదనే కేవలం సామాజిక లేదా భౌతిక వేర్పాటు
  rationale: చుట్టూ ఉన్న విశేషణాలు ఆయన పవిత్రతను, యాజకునిగా తగినతనాన్ని, ఉన్నత స్థితిని వర్ణిస్తున్నాయి. మూలంలోని వేర్పాటు భావాన్ని ఉంచి, అది భూలోక సంబంధాలన్నిటినీ నిరాకరిస్తుందని అనువాదంలో నిర్ణయించలేదు.
- issue: γενόμενος మరియు ఆకాశాలకంటే ఉన్నతమైన స్థితి
  choice: ‘ఉన్నతుడైనవాడు’ అని ఫలితమైన ఉన్నత స్థితిని సూచించడం
  alternative: ‘ఎప్పటినుంచో ఉన్నతుడే’ అనే కేవలం స్థితివాచక అనువాదం; లేదా ‘ఉన్నతునిగా చేయబడినవాడు’ అని కర్తృత్వాన్ని స్పష్టంగా చేర్చడం
  rationale: మూల కృదంతం ఉన్నత స్థితికి వచ్చిన భావాన్ని కలిగి ఉంది, కానీ వ్యాకరణంలో లేని కర్తృత్వాన్ని తెలుగులో చేర్చదు. ఇది క్రీస్తు స్వభావంలో మార్పు అని కూడా అనువాదం నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర శైలిని ఉపయోగించాం. లక్షణాల వరుసను మూల వాక్యానికి అనుగుణంగా ఉంచి, చివరలో ప్రధాన వాక్యభాగాన్ని పెట్టడం ద్వారా తెలుగులో సహజమైన ఉద్ఘాటన సాధించాం. [a], [b] గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
