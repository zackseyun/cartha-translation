id: HEB.7.11
reference: Hebrews 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: te
  text: కాబట్టి లేవీయ యాజకత్వం ద్వారా పరిపూర్ణత లభించి ఉంటే—ఎందుకంటే దాని ఆధారంగానే ప్రజలకు ధర్మశాస్త్రం ఇవ్వబడింది[a]—మెల్కీసెదెకు క్రమం ప్రకారం మరొక యాజకుడు ఉద్భవించి, అహరోను క్రమం ప్రకారం పిలువబడకుండా ఉండవలసిన అవసరం ఇంకెందుకు ఉండేది?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే దాని కిందనే ప్రజలకు ధర్మశాస్త్రం ఇవ్వబడింది.” గ్రీకు పదబంధం లేవీయ యాజకత్వం ఇశ్రాయేలు ధర్మశాస్త్ర వ్యవస్థకు ఆధారంగా లేదా దాని పరిధిగా ఉందని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మెల్కీసెదెకు క్రమంలో మరొక యాజకుడు ఉద్భవించి, అహరోను క్రమంలో పిలువబడకపోవలసిన అవసరం ఇంకెందుకు ఉండేది?”
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: పరిపూర్ణత
  rationale: హెబ్రీయులకు పత్రికలో ఈ పదం కేవలం నైతిక మెరుగుదలకన్నా విస్తృతమైన, దేవుని సమక్షంలో ఉద్దేశిత సంపూర్ణ స్థితికి చేర్చే భావాన్ని కలిగి ఉంది. ‘పరిపూర్ణత’ ఆ భావభారాన్ని సందర్భమే వివరించేలా ఉంచుతుంది.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: లేవీయ యాజకత్వం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనాన్ని సూచిస్తుంది; ‘ద్వారా’ మూల వాదనను సహజంగా నిలుపుతుంది.
- source_word: ἐπ’ αὐτῆς
  choice: దాని ఆధారంగానే
  rationale: స్త్రీలింగ సర్వనామం సమీపంలోని ‘యాజకత్వం’ను సూచించడం అత్యంత సహజం. ἐπί ఇక్కడ ఆధారం లేదా వ్యవస్థాపక సంబంధాన్ని తెలియజేస్తుంది.
- source_word: νενομοθέτηται
  choice: ధర్మశాస్త్రం ఇవ్వబడింది
  rationale: పూర్త భూతకాల నిష్క్రియ రూపం ప్రజలు ధర్మశాస్త్ర వ్యవస్థ కింద ఉంచబడిన స్థితిని సూచిస్తుంది. తెలుగు వాడుకలో ఈ రూపం సహజంగా ఉండి నిష్క్రియ భావాన్ని కాపాడుతుంది.
- source_word: τίς ἔτι χρεία
  choice: అవసరం ఇంకా ఏముంది?
  rationale: ఇది కొనసాగుతున్న లేదా అదనపు అవసరాన్ని ప్రశ్నించే అలంకారిక ప్రశ్న; తెలుగు పదక్రమం దాని బలాన్ని కాపాడుతుంది.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: మెల్కీసెదెకు క్రమం ప్రకారం
  rationale: τάξις ఇక్కడ క్రమం, వర్గం లేదా నియమిత నమూనాను సూచిస్తుంది; ‘క్రమం ప్రకారం’ రూపసామ్యాన్నీ అర్థాన్నీ నిలుపుతుంది.
- source_word: ἕτερον ... ἱερέα
  choice: మరొక యాజకుడు
  rationale: ἕτερον భిన్నమైన మరొకరిని సూచించగలదు; వెంటనే వచ్చే అహరోను క్రమంతో వ్యత్యాసం ఆ భిన్నత్వాన్ని స్పష్టం చేస్తుంది.
- source_word: ἀνίστασθαι
  choice: ఉద్భవించాల్సిన
  rationale: ఈ సందర్భంలో ఒక యాజకుడు ముందుకు రావడం లేదా నియమింపబడడం భావం. ‘ఉద్భవించు’ పునరుత్థాన భావాన్ని బలవంతంగా చేర్చకుండా గంభీర శైలిని నిలుపుతుంది.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: అహరోను క్రమం ప్రకారం ఉన్నవాడని ఎందుకు చెప్పబడలేదు?
  rationale: λέγεσθαι ఇక్కడ యాజకుడు ఎలా వర్ణించబడతాడు లేదా వర్గీకరించబడతాడు అన్నదాన్ని సూచిస్తుంది. తెలుగులో సహజమైన ప్రశ్నగా మలచినా మూలంలోని వ్యతిరేక వర్గీకరణను నిలుపుతుంది.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: మెల్కీసెదెకు / అహరోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలను అనుసరించాం.
theological_decisions:
- issue: యాజకత్వ వాదనలో τελείωσις భావం
  choice: ‘పరిపూర్ణత’గా అనువదించి, దాని ఆరాధనా మరియు రక్షణసంబంధ భావాన్ని సందర్భం నిర్ణయించేలా ఉంచడం
  alternative: ‘సంపూర్ణత’ లేదా ‘దేవుని దగ్గరకు సంపూర్ణ ప్రవేశం’
  rationale: దీనిని కేవలం నైతిక నిర్దోషతగా గానీ, వివరణాత్మక పరాభాషగా గానీ పరిమితం చేయకుండా మూలంలోని theological tensionను నిలుపుతుంది.
- issue: ἐπ’ αὐτῆςలో αὐτῆς దేనిని సూచిస్తుంది?
  choice: లేవీయ యాజకత్వాన్ని సూచిస్తుంది
  alternative: ధర్మశాస్త్రం లేదా విస్తృత నిబంధనా వ్యవస్థ
  rationale: వ్యాకరణపరంగా సరిపోయే సమీప స్త్రీలింగ పూర్వపదం ‘యాజకత్వం’; ప్రజల ధర్మశాస్త్ర వ్యవస్థ దానిపై ఆధారపడిందని మధ్యవాక్యం వివరిస్తుంది.
- issue: καὶ οὐ ... λέγεσθαι యొక్క వాక్య సంబంధం
  choice: అహరోను క్రమం ప్రకారం చెప్పబడకపోవడాన్ని రెండో అలంకారిక ప్రశ్నగా సహజ తెలుగులో వ్యక్తీకరించడం
  alternative: ‘అహరోను క్రమం ప్రకారం అని చెప్పబడకుండా’ అని మొదటి ప్రశ్నలోనే అనుసంధానించడం
  rationale: మూలంలోని సమాంతర వ్యత్యాసాన్ని కాపాడుతూ తెలుగులో పొడవైన, అస్పష్టమైన ప్రశ్నను నివారిస్తుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన బైబిలు శైలిని వాడాం. ‘యాజకత్వం,’ ‘ధర్మశాస్త్రం,’ ‘పరిపూర్ణత’ వంటి విస్తృతంగా తెలిసిన పదాలను నిలిపాం. మూలంలోని οὖνకు ‘కాబట్టి’ అని అనువదించి, అది కాలార్థక ‘ఇప్పుడు’ కాదని స్పష్టం చేశాం.
