  - marker: b
    text: కీర్తన 110:4 నుండి ఉల్లేఖనం.
    reason: cross_reference
  revision_rationale: The revision corrects the only substantive source-fidelity issue by rendering the present passive μαρτυρεῖται with a present impersonal passive Telugu form. It also makes the eternal-priesthood expression more idiomatic, while retaining the citation’s direct address, its ambiguity-free but non-expanded ‘priest,’ and both footnote anchors.
