review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the causal γάρ, the direct scriptural citation, the simple designation ‘priest’ (not ‘high priest’), and the Melchizedek reference. However, ‘సాక్ష్యం ఇవ్వబడింది’ is completed past tense, whereas μαρτυρεῖται is present passive/impersonal (‘it is testified’). The revision preserves this ongoing/scriptural-testimony form.
  naturalness: The revised wording is natural modern standard Telugu. ‘సాక్ష్యమివ్వబడుతోంది’ maintains the impersonal passive without supplying a subject, and ‘ఎప్పటికీ యాజకుడవు’ expresses the enduring force of εἰς τὸν αἰῶνα more idiomatically than using an adverb with the copular predicate.
  terminology: ‘యాజకుడు’ correctly renders ἱερεύς without theological expansion. ‘మెల్కీసెదెకు క్రమం ప్రకారం’ appropriately conveys κατὰ τὴν τάξιν and retains the established Telugu transliteration of the name.
  issues:
  - severity: medium
    issue: The verb tense/aspect in ‘సాక్ష్యం ఇవ్వబడింది’ does not reflect μαρτυρεῖται.
    rationale: The Greek is present passive/impersonal, introducing testimony that is presently borne in Scripture. A completed-past Telugu passive can imply that the act of testimony is merely finished.
  - severity: low
    issue: ‘శాశ్వతంగా యాజకుడవు’ is understandable but less idiomatic in this predicate construction.
    rationale: ‘ఎప్పటికీ యాజకుడవు’ naturally expresses ‘you are a priest forever’ while preserving the source meaning.
  revised_text: 'ఎందుకంటే, ఇలా సాక్ష్యమివ్వబడుతోంది: “నీవు మెల్కీసెదెకు క్రమం ప్రకారం ఎప్పటికీ యాజకుడవు.”[a][b]'
  revised_footnotes:
  - marker: a
    text: లేదా, “మెల్కీసెదెకు పద్ధతి ప్రకారం.”
