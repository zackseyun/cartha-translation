id: HEB.7.17
reference: Hebrews 7:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: te
  text: 'ఎందుకంటే, ఇలా సాక్ష్యమివ్వబడుతోంది: “నీవు మెల్కీసెదెకు క్రమం ప్రకారం ఎప్పటికీ యాజకుడవు.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెల్కీసెదెకు పద్ధతి ప్రకారం.”
    reason: lexical_alternative
  - marker: b
    text: కీర్తన 110:4 నుండి ఉల్లేఖనం.
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: సాక్ష్యం ఇవ్వబడింది
  rationale: ఇది వర్తమానకాల నిష్క్రియార్థక/కర్తలేని ప్రయోగం; లేఖన సాక్ష్యాన్ని పరిచయం చేస్తోంది. కర్తను అనవసరంగా నిర్దిష్టం చేయకుండా నిష్క్రియ భావాన్ని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఆధారం లేదా కారణాన్ని అందించే అనుసంధాన పదం.
- source_word: ὅτι
  choice: ':'
  rationale: సాక్ష్యంలోని విషయాన్ని ప్రత్యక్ష ఉల్లేఖనంగా పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ద్విబిందువు సహజంగా ఉంటుంది.
- source_word: Σὺ
  choice: నీవు
  rationale: ఏకవచన ద్వితీయ పురుష సర్వనామం; మూలంలోని ప్రత్యక్ష సంబోధనను నిలుపుతుంది.
- source_word: ἱερεὺς
  choice: యాజకుడవు
  rationale: సంబోధితుని పాత్రను తెలిపే విధేయ నామవాచకం; ‘ప్రధాన యాజకుడు’ అని విస్తరించకుండా మూలంలోని ‘యాజకుడు’నే ఉంచింది.
- source_word: εἰς τὸν αἰῶνα
  choice: శాశ్వతంగా
  rationale: నిరంతర కాలాన్ని సూచించే నుడికారం; ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: κατὰ τὴν τάξιν
  choice: క్రమం ప్రకారం
  rationale: ఒక క్రమం, నమూనా లేదా వర్గానికి అనుగుణతను సూచిస్తుంది; మూలంలోని భావాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: Μελχισέδεκ
  choice: మెల్కీసెదెకు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: కీర్తన ఉల్లేఖనంలోని యాజక పదవిని తరువాతి సిద్ధాంత వివరణతో విస్తరించాలా
  choice: ‘యాజకుడవు’ అని మాత్రమే అనువదించడం
  alternative: ‘ప్రధాన యాజకుడవు’ అని విస్తరించడం
  rationale: ఈ వచనంలోని గ్రీకు పదం ἱερεύς అంటే ‘యాజకుడు’; హెబ్రీయులకు పత్రిక యేసును ప్రధాన యాజకునిగా వివరించినా, ఇక్కడ ‘ప్రధాన’ అని చేర్చడం మూలపాఠాన్ని మించిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. లేఖన సాక్ష్యాన్ని సూచించే నిష్క్రియ నిర్మాణాన్ని, ప్రత్యక్ష ఉల్లేఖనాన్ని, ‘యాజకుడు’ అనే మూలపాఠ పరిమితిని నిలిపింది.
