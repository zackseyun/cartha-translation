revisions:
- from: 'ఎందుకంటే, ఇలా సాక్ష్యం ఇవ్వబడింది: “నీవు మెల్కీసెదెకు క్రమం ప్రకారం శాశ్వతంగా యాజకుడవు.”[a][b]'
  to: 'ఎందుకంటే, ఇలా సాక్ష్యమివ్వబడుతోంది: “నీవు మెల్కీసెదెకు క్రమం ప్రకారం ఎప్పటికీ యాజకుడవు.”[a][b]'
  rationale: The revision corrects the only substantive source-fidelity issue by rendering the present passive μαρτυρεῖται with a present impersonal passive Telugu form. It also makes the eternal-priesthood expression more idiomatic, while retaining the citation’s direct address, its ambiguity-free but non-expanded ‘priest,’ and both footnote anchors.
  reviewer_model: gpt-5.6-terra
