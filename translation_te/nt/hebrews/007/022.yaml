  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: te
  text: అంత మేరకు యేసు మరింత శ్రేష్ఠమైన నిబంధనకు[a] హామీదారుగా అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వీలునామా.’ గ్రీకు పదానికి ఈ రెండు అర్థాలూ ఉండవచ్చు; అయితే ఇక్కడ యాజకత్వం, ప్రమాణం గురించిన వాదనకు ‘నిబంధన’ బాగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: అంత మేరకు
  rationale: κατά + పరిమాణార్థక accusative ఇక్కడ స్థాయి లేదా పరిమాణాన్ని సూచిస్తుంది. ముందున్న వాదనతో ఈ వాక్యాన్ని అనుసంధానిస్తూ తులనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: κρείττονος
  choice: మరింత శ్రేష్ఠమైన
  rationale: హెబ్రీయులకు పత్రికలో κρείττων కీలకమైన తులనాత్మక పదం. ‘మరింత శ్రేష్ఠమైన’ అనే రూపం దాని తులనాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: διαθήκης
  choice: నిబంధనకు
  rationale: ఈ సందర్భంలోని యాజకత్వం, ప్రమాణం గురించిన వాదన దేవుడు ఏర్పాటు చేసిన నిబంధననే సూచిస్తుంది; అందువల్ల ‘వీలునామా’ కంటే ‘నిబంధన’ సందర్భానికి బాగా సరిపోతుంది.
- source_word: γέγονεν
  choice: అయ్యాడు
  rationale: γίνομαι యొక్క perfect రూపం పూర్తయి కొనసాగుతున్న స్థితిని సూచిస్తుంది. సహజమైన తెలుగులో ‘అయ్యాడు’ ఆ మార్పును నేరుగా వ్యక్తం చేస్తుంది; హామీదారుగా ఆయన స్థానం కొనసాగుతుందనే భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ἔγγυος
  choice: హామీదారు
  rationale: ἔγγυος ఒక బాధ్యత నెరవేరుతుందని హామీగా నిలిచే వ్యక్తిని సూచిస్తుంది. ‘హామీదారు’ ఆధునిక తెలుగులో స్పష్టమైన, సులభంగా అర్థమయ్యే వ్యక్తివాచక పదం.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: గ్రీకు వ్యక్తినామానికి ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: హెబ్రీయులకు 7:22లో διαθήκη అర్థం
  choice: నిబంధన
  alternative: వీలునామా
  rationale: διαθήκη కొన్ని సందర్భాల్లో ‘వీలునామా’ అనే అర్థాన్ని కలిగి ఉండగలిగినా, ఇక్కడ యేసు యాజకత్వం మరియు దేవుని ప్రమాణం గురించిన వాదన నిబంధనాపరమైన ఏర్పాటును సూచిస్తుంది. ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచడం ద్వారా పదంలోని అర్థసాధ్యతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘అంత మేరకు’ మూలంలోని తులనాత్మక అనుసంధానాన్ని నిలుపుతుంది; ‘హామీదారు’ సంప్రదాయ ‘పూచీదారు’ కంటే విస్తృతంగా అర్థమయ్యే ఆధునిక పదం.
