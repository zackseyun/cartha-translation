  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: te
  text: 'ఈయన ఎంత గొప్పవాడో ఆలోచించండి: మూలపురుషుడైన అబ్రాహాము యుద్ధంలో దక్కిన కొల్లసొమ్ములో[b] పదోవంతును[a] ఈయనకు ఇచ్చాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దశమభాగాన్ని.’ గ్రీకు పదానికి అక్షరార్థం ‘పదోవంతు.’
    reason: lexical_alternative
  - marker: b
    text: ఈ గ్రీకు పదం యుద్ధంలో దక్కిన కొల్లసొమ్మును సూచిస్తుంది; బహుశా కొల్లసొమ్ములోని శ్రేష్ఠమైన భాగం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: ఆలోచించండి
  rationale: వర్తమానకాల ఆజ్ఞార్థక రూపం పాఠకులను శ్రద్ధగా పరిశీలించి గ్రహించమని పిలుస్తుంది. ‘ఆలోచించండి’ అనేది ఆధునిక తెలుగులో ఆ ఉద్బోధక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్పమైన వాక్యసంధిని సూచిస్తుంది; తెలుగులో సందర్భప్రవాహం ద్వారానే ఆ సంబంధం స్పష్టమవుతుంది. ‘అయితే’ అని చేరిస్తే మూలంలో లేనంత బలమైన వ్యత్యాసం వినిపించవచ్చు.
- source_word: πηλίκος
  choice: ఎంత గొప్పవాడో
  rationale: ఈ పదం గొప్పతనపు పరిమాణాన్ని తెలియజేస్తుంది; ఆ గొప్పతనం ఏ విధమైనదో తరువాతి వాదనే వివరించేలా అనువాదం దానిని తెరిచి ఉంచుతుంది.
- source_word: οὗτος
  choice: ఈయన
  rationale: ముందటి సందర్భంలోని మెల్కీసెదెకును సూచించే గౌరవప్రదమైన, సహజమైన తెలుగు సర్వనామం.
- source_word: ᾧ
  choice: ఈయనకు
  rationale: ‘ఇచ్చాడు’ అనే క్రియతో వచ్చే దత్తివ సంబంధాన్ని తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: δεκάτην
  choice: పదోవంతును
  rationale: గ్రీకు పదానికి అక్షరార్థమైన ‘పదిలో ఒక వంతు’ను స్పష్టంగా తెలియజేస్తుంది; తరువాతి మతసంస్థాగత భావాలను ప్రధాన పాఠ్యంలో అనవసరంగా మోపదు.
- source_word: Ἀβραὰμ
  choice: అబ్రాహాము
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἔδωκεν
  choice: ఇచ్చాడు
  rationale: δίδωμι క్రియ యొక్క సరళమైన, ఖచ్చితమైన తెలుగు సమానం.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: యుద్ధంలో దక్కిన కొల్లసొమ్ములో
  rationale: ἀκροθίνια యుద్ధంలో స్వాధీనమైన కొల్లసొమ్మును సూచిస్తుంది. దానిలోని అత్యుత్తమ భాగం అనే సాధ్యమైన భావాన్ని అనిశ్చితి కారణంగా పాదసూచికలో ఉంచింది.
- source_word: ὁ πατριάρχης
  choice: మూలపురుషుడైన
  rationale: అబ్రాహాము యొక్క పూర్విక, వంశమూల స్థానాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
theological_decisions:
- issue: మెల్కీసెదెకు గొప్పతనం మరియు అబ్రాహాము చర్యలోని సూచన
  choice: మూలపురుషుడైన అబ్రాహాము మెల్కీసెదెకుకు పదోవంతు ఇచ్చిన సంఘటన ద్వారా మెల్కీసెదెకు గొప్పతనాన్ని చూపించడం
  alternative: పదోవంతు స్వీకరించినందువల్ల మెల్కీసెదెకు అబ్రాహాముకంటే శ్రేష్ఠుడని ప్రధాన పాఠ్యంలోనే స్పష్టంగా చెప్పడం
  rationale: వచనం మెల్కీసెదెకు గొప్పతనంపై ఆలోచించమని చెప్పి అబ్రాహాము చేసిన కార్యాన్ని ఆధారంగా చూపుతుంది. అయితే దానిలోని పూర్తి శ్రేష్ఠతా నిర్ధారణను చుట్టుపక్కల వాదనకే వదిలి, ఈ వచనం నేరుగా చెప్పినదానికంటే ఎక్కువగా అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభగ్రాహ్యమైన శైలి వాడబడింది. మూలవాక్యంలోని ఉద్బోధనను ఆశ్చర్యార్థక వాక్యంతో సహజంగా వ్యక్తం చేసి, ‘గొప్పతనం’ యొక్క స్వరూపాన్ని వివరణలో ముందుగానే నిర్ణయించలేదు.
