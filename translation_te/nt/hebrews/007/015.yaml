id: HEB.7.15
reference: Hebrews 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: te
  text: 'ఇది ఇంకా మరింత స్పష్టమవుతుంది: మెల్కీసెదెకు పోలిక ప్రకారం[b] మరొక యాజకుడు[a] ఉద్భవిస్తే,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భిన్నమైన యాజకుడు.” ἕτερος అనే గ్రీకు పదం కేవలం సంఖ్యాపరంగా మరొక యాజకుడిని మాత్రమే కాక, భిన్నమైన యాజకుడనే భావాన్ని కూడా నొక్కిచెప్పగలదు.
    reason: lexical_alternative
  - marker: b
    text: “మెల్కీసెదెకు పోలిక ప్రకారం” అనే మాట ఈ అధ్యాయంలో కీర్తన 110:4 ఆధారంగా సాగుతున్న వాదనను కొనసాగిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: ఇంకా మరింత
  rationale: ఇప్పటికే చెప్పిన విషయం మరింత బలంగా స్పష్టమవుతుందనే తీవ్రతను ఈ రెండు పదాల సముచ్చయం తెలియజేస్తుంది.
- source_word: κατάδηλόν
  choice: స్పష్టమే
  rationale: ‘సుస్పష్టం/ప్రత్యక్షం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ముందున్న తీవ్రతను అనవసరంగా మళ్లీ పెంచదు.
- source_word: εἰ
  choice: ఉద్భవిస్తే
  rationale: గ్రీకు వాక్యంలోని షరతును ‘-తే’ రూపంలో నిలుపుతుంది; దానిని ‘ఎందుకంటే’ లేదా ‘కాబట్టి’గా వ్యాఖ్యానించి నిర్ణయించదు.
- source_word: κατὰ τὴν ὁμοιότητα
  choice: పోలిక ప్రకారం
  rationale: మెల్కీసెదెకుతో ఉన్న సాదృశ్యాన్ని, అలాగే అధ్యాయంలోని వాదనతో దాని సంబంధాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: Μελχισέδεκ
  choice: మెల్కీసెదెకు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తి పేరును లిప్యంతరీకరించి, విభక్తి కోసం ‘-కు’ జోడించబడింది.
- source_word: ἀνίσταται
  choice: ఉద్భవిస్తే
  rationale: ఇక్కడ ఒక యాజకుడు ముందుకు రావడం లేదా ఏర్పడడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; పునరుత్థాన భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: ἱερεὺς ἕτερος
  choice: మరొక యాజకుడు
  rationale: సంఖ్యాపరంగా మరొకరనే భావాన్ని సహజంగా అందిస్తుంది; ἕτεροςలో ఉండగల భిన్నత్వపు ఛాయను పాదటీపులో ఉంచుతుంది.
theological_decisions:
- issue: ἕτερος అనే పదం యాజకత్వానికి సంబంధించి సూచించే భేదం
  choice: మరొక యాజకుడు
  alternative: భిన్నమైన యాజకుడు
  rationale: ఈ యాజకుడు లేవీయ క్రమానికి చెందిన యాజకుల నుండి వేరైనవాడని సందర్భం సూచించినా, ప్రధాన పాఠంలో భేదాన్ని అతిగా నిర్ధారించకుండా సహజమైన ‘మరొక’ను వాడి, బలమైన ప్రత్యామ్నాయాన్ని పాదటీపులో నిలిపాం.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. గ్రీకు వాక్యంలోని షరతు భావం నిలుపబడింది. ప్రతి పాదటీపు సూచిక సంబంధిత పదబంధం వెంట ప్రధాన పాఠంలో ఉంచబడింది.
