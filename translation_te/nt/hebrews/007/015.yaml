    issue: Main-clause phrasing and word order are somewhat stiff.
    rationale: The Greek says that the matter is even more evident if another priest arises. In Telugu, leading with “ఇది ఇంకా మరింత స్పష్టమవుతుంది” followed by the conditional clause reads more naturally and retains the logical relation.
  - severity: low
    issue: Footnote a explains the lexical alternative as “భిన్నమైన వ్యక్తి.”
    rationale: Since the alternative modifies ἱερεὺς in this context, “భిన్నమైన యాజకుడు” is more precise and avoids broadening the stated lexical alternative.
