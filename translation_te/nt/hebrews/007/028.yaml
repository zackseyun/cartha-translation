id: HEB.7.28
reference: Hebrews 7:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: te
  text: ఎందుకంటే ధర్మశాస్త్రం బలహీనత కలిగిన మనుషులను ప్రధాన యాజకులుగా నియమిస్తుంది. అయితే ధర్మశాస్త్రం తర్వాత వచ్చిన ప్రమాణవాక్యం, శాశ్వతంగా పరిపూర్ణునిగా చేయబడిన[b] కుమారుణ్ణి[a] నియమిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘కుమారుడు’కు ముందు నిర్దిష్ట ఉపపదం లేదు. ఇది ‘మనుషులు’ మరియు ‘కుమారుడు’ మధ్యనున్న వ్యత్యాసాన్ని నొక్కిచెబుతుంది; సందర్భంలో మాత్రం యేసునే సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: ‘పరిపూర్ణునిగా చేయబడిన’ అనే మాటకు ‘సంపూర్ణతకు తీసుకురాబడిన’ లేదా యాజక సందర్భంలో ‘ప్రతిష్ఠించబడిన’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: ధర్మశాస్త్రం
  rationale: సందర్భంలో ఇది మోషే ధర్మశాస్త్రాన్ని, ముఖ్యంగా యాజక వ్యవస్థకు సంబంధించిన దాని నియమాలను సూచిస్తుంది.
- source_word: καθίστησιν
  choice: నియమిస్తుంది
  rationale: యాజక పదవిలో అధికారికంగా ఉంచడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀνθρώπους
  choice: మనుషులను
  rationale: లేవీయ ప్రధాన యాజకుల మానవ స్వభావాన్ని కుమారునితో పోల్చే మూలపాఠ్య వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులుగా
  rationale: వరుసగా ఆ పదవిని చేపట్టినవారిని సూచించే బహువచనాన్ని కాపాడుతుంది.
- source_word: ἔχοντας ἀσθένειαν
  choice: బలహీనతగల
  rationale: ἀσθένεια అనే నామవాచక భావాన్ని కాపాడుతూ, శారీరక అనారోగ్యానికే పరిమితం కాని మానవ దౌర్బల్యాన్ని సూచిస్తుంది.
- source_word: λόγος τῆς ὁρκωμοσίας
  choice: ప్రమాణ వాక్యం
  rationale: దేవుని ప్రమాణంతో కూడిన లేఖన ప్రకటనను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῆς μετὰ τὸν νόμον
  choice: ధర్మశాస్త్రం తర్వాత వచ్చిన
  rationale: కీర్తన 110లోని ప్రమాణ ప్రకటన ధర్మశాస్త్రం తరువాత ఇవ్వబడిందనే కాల సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: υἱόν
  choice: కుమారుణ్ణి
  rationale: తెలుగులో అనిర్దిష్ట సూచక పదం లేకుండానే మూలంలోని anarthrous రూపాన్ని సహజంగా ఉంచి, సందర్భంలోని ఏకైక క్రీస్తు సంబంధ సూచనను నిలుపుతుంది.
- source_word: εἰς τὸν αἰῶνα
  choice: శాశ్వతంగా
  rationale: నిలిచే యాజకత్వ సందర్భంలో ఈ పదబంధానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: τετελειωμένον
  choice: పరిపూర్ణునిగా చేయబడిన
  rationale: perfect passive participle భావాన్ని నిలుపుతూ, ఉద్దేశించిన సంపూర్ణతకు చేర్చబడటం అనే హెబ్రీయులకు పత్రికలోని విస్తృత భావాన్ని తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ἀνθρώπουςతో వ్యత్యాసంగా వ్యాసరహిత υἱόνను అనువదించడం
  choice: కుమారుణ్ణి
  alternative: ఆ కుమారుణ్ణి
  rationale: తెలుగులో ‘ఒక కుమారుణ్ణి’ అనడం అనేక కుమారుల్లో ఒకడనే అనవసర భావాన్ని కలిగించవచ్చు; ‘ఆ కుమారుణ్ణి’ అనడం గ్రీకులో లేని నిర్దిష్టతను అధికంగా చూపవచ్చు. అందువల్ల సందర్భానుసారమైన క్రీస్తు సూచనను ఉంచుతూ వ్యాసరహిత రూపాన్ని సహజంగా అనువదించాం.
- issue: యాజక సంబంధ సందర్భంలో τετελειωμένον అర్థం
  choice: శాశ్వతంగా పరిపూర్ణునిగా చేయబడిన
  alternative: శాశ్వతంగా ప్రతిష్ఠించబడిన
  rationale: ఈ క్రియలో సంపూర్ణతకు తీసుకురావడం, లక్ష్యసిద్ధికి చేర్చడం, యాజక సేవకు సిద్ధపరచడం వంటి భావాలు ఉన్నాయి. ప్రధాన పాఠ్యం ‘పరిపూర్ణునిగా చేయబడిన’ అని ఉంచి ఆ వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడుతుంది; యాజక ప్రతిష్ఠ భావాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని రెండు విరుద్ధ భాగాలను స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత సందిగ్ధతలు, పదార్థ పరిధులను పాదసూచికలతో అనుసంధానిస్తాయి.
