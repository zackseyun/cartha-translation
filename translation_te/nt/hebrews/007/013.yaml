  verdict: revise
  source_fidelity: The main rendering accurately conveys the referential force of ἐφ’ ὃν, the contrast of ‘another tribe,’ and the cultic sense of προσέσχηκεν τῷ θυσιαστηρίῳ. ‘చెందినవాడు’ appropriately expresses settled tribal affiliation without importing the more explicit idea of descent. The footnote alternative for μετέσχηκεν, however, uses an unnatural and imprecise Telugu expression (‘భాగం పంచుకున్నవాడు’), which should be corrected.
