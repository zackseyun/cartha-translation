source:
  edition: SBLGNT
  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: te
  text: ఎందుకంటే, ఈ విషయాలు ఎవరి గురించి చెప్పబడుతున్నాయో, ఆయన వేరొక గోత్రానికి చెందినవాడు[a]; ఆ గోత్రం నుండి ఎవరూ బలిపీఠం వద్ద సేవ చేయలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేరొక గోత్రంతో సంబంధం కలిగినవాడు’ లేదా ‘వేరొక గోత్రం నుండి వచ్చినవాడు.’ గ్రీకు క్రియ భాగస్వామ్యాన్ని లేదా అనుబంధాన్ని సూచించగలదు; ఇక్కడ అది గోత్ర సంబంధాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బలిపీఠం దగ్గర హాజరై సేవ చేయలేదు.’ ఈ గ్రీకు వ్యక్తీకరణ బలిపీఠంతో ముడిపడిన యాజక పరిచర్యను లేదా సేవను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: ఎవరి గురించి
  rationale: λέγεται ταῦτα అనే క్రియతో కలిసి, ἐπί + ద్వితీయా విభక్తి ఇక్కడ ‘ఎవరిని ఉద్దేశించి/ఎవరి గురించి’ అనే సంబంధార్థాన్ని తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణాత్మక ఆధారాన్ని పరిచయం చేస్తుంది; తెలుగు వాదన ప్రవాహంలో ‘ఎందుకంటే’ సహజంగా ఉంటుంది.
- source_word: λέγεται ταῦτα
  choice: ఈ విషయాలు ... చెప్పబడుతున్నాయో
  rationale: వర్తమానకాల కర్మణి ప్రయోగాన్ని, అలాగే ταῦτα అనే బహువచనాన్ని నిలుపుతుంది.
- source_word: φυλῆς ἑτέρας
  choice: వేరొక గోత్రానికి
  rationale: φυλή ఇక్కడ ఇశ్రాయేలు గోత్రాన్ని సూచిస్తుంది; ἑτέρας యాజక గోత్రానికి భిన్నమైన గోత్రాన్ని సూచిస్తుంది.
- source_word: μετέσχηκεν
  choice: చెందినవాడు
  rationale: పరిపూర్ణ కాలరూపం స్థిరమైన గోత్ర సంబంధాన్ని సూచిస్తుంది. తెలుగులో ‘చెందినవాడు’ ఆ అనుబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; క్రియలోని భాగస్వామ్య భావానికి ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: ἀφ’ ἧς
  choice: ఆ గోత్రం నుండి
  rationale: సంబంధ సర్వనామం φυλήను తిరిగి సూచిస్తుంది; తెలుగులో నామవాచకాన్ని పునరుక్తి చేయడం సూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: οὐδεὶς
  choice: ఎవరూ ... చేయలేదు
  rationale: నిరపేక్ష నిషేధాన్ని సహజమైన తెలుగు నిషేధ నిర్మాణంతో తెలియజేస్తుంది.
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: బలిపీఠం వద్ద సేవ చేయలేదు
  rationale: προσέχω యొక్క ప్రాథమిక భావం శ్రద్ధ పెట్టడం లేదా దగ్గరగా ఉండడం అయినా, ఈ ఆరాధనా సందర్భంలో బలిపీఠంతో ముడిపడిన యాజక సేవను సూచిస్తుంది. ‘వద్ద సేవ చేయడం’ ఆ సందర్భార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: θυσιαστηρίῳ
  choice: బలిపీఠం
  rationale: బలి సంబంధిత సందర్భంలో ప్రామాణికమైన, సాధారణ పాఠకులకు స్పష్టమైన పదం.
theological_decisions:
- issue: యాజకత్వ వాదనలో యేసుకు లేవీయేతర గోత్రంతో ఉన్న సంబంధం
  choice: వచనం చెప్పినట్లే వేరొక గోత్రానికి చెందినవాడని అనువదించడం
  alternative: ‘వేరొక గోత్రం నుండి వంశపారంపర్యంగా వచ్చాడు’ అని మరింత వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: సందర్భం యేసు యాజకత్వం లేవీయ వంశం నుండి రాలేదనే వాదనకు తోడ్పడుతుంది. అయితే ఈ వచనంలోని గ్రీకు క్రియ నేరుగా ‘వంశపారంపర్యంగా వచ్చాడు’ అని కాకుండా భాగస్వామ్యం లేదా అనుబంధాన్ని వ్యక్తం చేస్తుంది; అందువల్ల మూలపాఠం కంటే ఎక్కువగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘గోత్రం,’ ‘బలిపీఠం’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సహజమైన తెలుగులో తీర్చిదిద్దాం.
