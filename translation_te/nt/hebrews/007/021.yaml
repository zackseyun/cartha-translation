source:
  edition: SBLGNT
  text: ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν· Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται, Σὺ ἱερεὺς εἰς τὸν ⸀αἰῶνα),
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: te
  text: 'అయితే ఈయన మాత్రం, ఈయనతో ఇలా చెప్పినవాని ద్వారా ప్రమాణంతో యాజకుడయ్యాడు: “ప్రభువు ప్రమాణం చేశాడు, ఆయన తన మనసు మార్చుకోడు: ‘నీవు శాశ్వతంగా యాజకుడివి.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రభువు ప్రమాణం చేశాడు’ అనే మాటను ‘ప్రభువు ప్రమాణం చేసి ఉన్నాడు’ అని కూడా అనువదించవచ్చు. గ్రీకు Ὤμοσεν రూపం సందర్భానుసారం ఈ రెండు విధాలుగా తెలుగులో వ్యక్తం చేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: అయితే ఈయన
  rationale: మునుపటి వచనంలోని యాజకులతో ఈ యాజకుణ్ణి స్పష్టంగా వ్యత్యాసపరుస్తూ, గ్రీకు పదబంధంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: μετὰ ὁρκωμοσίας
  choice: ప్రమాణంతో
  rationale: 20వ వచనంలోని ‘ప్రమాణం లేకుండా’ అనే వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది; సహచర్యం లేదా సాధనం అనే రెండు ఛాయలూ సందర్భానికి సరిపోతాయి.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: తనతో ఇలా చెప్పినవాని ద్వారా
  rationale: διά + షష్ఠీ విభక్తిలోని మాధ్యమం/కర్తృత్వ భావాన్ని నిలుపుతూ, ఉద్ధరణను పలికిన దేవుణ్ణి సూచిస్తుంది.
- source_word: Ὤμοσεν κύριος
  choice: ప్రభువు ప్రమాణం చేశాడు
  rationale: గ్రీకు అనిర్దిష్ట భూతకాలాన్ని నేరుగా ప్రతిబింబిస్తుంది; ఆ ప్రమాణం యొక్క నిలిచివుండే ప్రభావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: οὐ μεταμεληθήσεται
  choice: ఆయన తన మనసు మార్చుకోడు
  rationale: ఇక్కడ నైతిక పశ్చాత్తాపం కంటే ప్రకటించిన సంకల్పాన్ని వెనక్కి తీసుకోకపోవడం ఉద్దేశం; ఈ రూపం ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: Σὺ ἱερεὺς
  choice: నీవు యాజకుడివి
  rationale: గ్రీకులో సూచితంగా ఉన్న సంధాన క్రియను సహజమైన తెలుగులో వ్యక్తం చేసి, సంబోధితుని యాజక స్థితిని తెలియజేస్తుంది.
- source_word: εἰς τὸν αἰῶνα
  choice: శాశ్వతంగా
  rationale: ఈ గ్రీకు నుడికారంలోని నిరంతర కాల భావాన్ని సహజంగా, గంభీరంగా తెలియజేస్తుంది.
theological_decisions:
- issue: కీర్తన 110:4 ఉద్ధరణలో యాజకత్వం దేవుని ప్రమాణం ద్వారా స్థాపించబడినదిగా, శాశ్వతమైనదిగా చూపడం
  choice: దేవుని ప్రమాణాన్నీ, దాని మార్పులేని స్వభావాన్నీ, యాజకత్వపు శాశ్వతత్వాన్నీ ప్రత్యక్షంగా నిలుపడం
  alternative: Ὤμοσεν ను ‘ప్రమాణం చేసి ఉన్నాడు’ అని వర్తమాన-పూర్ణ భావంతో అనువదించడం
  rationale: గ్రీకు అనిర్దిష్ట భూతకాలానికి ‘ప్రమాణం చేశాడు’ దగ్గరగా ఉంటుంది; అయినా దేవుని నిర్ణయం కొనసాగుతుందనే భావం ‘మనసు మార్చుకోడు’ మరియు ‘శాశ్వతంగా’ ద్వారా స్పష్టంగా ఉంటుంది. తరువాతి సిద్ధాంత భాషను వచనంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘యాజకుడు,’ ‘ప్రమాణం,’ ‘ప్రభువు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, అసహజమైన పదానువాదాన్ని నివారించింది.
