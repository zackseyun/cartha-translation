  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: te
  text: ఎందుకంటే యాజకత్వం మారినప్పుడు, ధర్మశాస్త్రంలోనూ తప్పనిసరిగా మార్పు సంభవిస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధర్మశాస్త్రం కూడా మార్చబడుతుంది.” సందర్భంలో లేవీయ యాజకత్వాన్ని నియమించిన మోషే ధర్మశాస్త్రం దృష్టిలో ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: μετατιθεμένης
  choice: మార్చబడినప్పుడు
  rationale: వర్తమాన కర్మణి కృదంతంతో ఏర్పడిన genitive absolute నిర్మాణం. యాజకత్వ వ్యవస్థ ఒక అమరిక నుంచి మరొకదానికి మారడాన్ని, అలాగే వాక్యంలోని సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἱερωσύνης
  choice: యాజకత్వం
  rationale: ఒక వ్యక్తి చేసే యాజక క్రియను కాకుండా, యాజక పదవి లేదా వ్యవస్థను సూచిస్తుంది.
- source_word: ἐξ ἀνάγκης
  choice: తప్పనిసరిగా
  rationale: యాజకత్వ మార్పు వల్ల ధర్మశాస్త్రంలో అనివార్యంగా సంబంధిత మార్పు కలగాలనే తార్కిక అవసరాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: νόμου
  choice: ధర్మశాస్త్రంలో
  rationale: సందర్భంలో యాజకత్వాన్ని నియమించే మోషే ధర్మశాస్త్ర వ్యవస్థను సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో ‘ధర్మశాస్త్రం’ సహజమైనదీ, సందర్భోచితమైనదీ; అధికరణ విభక్తి మార్పు ఆ వ్యవస్థలో కలుగుతుందని స్పష్టం చేస్తుంది.
- source_word: μετάθεσις
  choice: మార్పు
  rationale: ముందున్న μετατιθεμένης‌తో ఉన్న పదసంబంధాన్ని కాపాడుతూ, అతిశయార్థం లేకుండా వ్యవస్థాపరమైన మార్పును తెలుపుతుంది.
- source_word: γίνεται
  choice: కలుగుతుంది
  rationale: ఫలితంగా ఒక మార్పు సంభవిస్తుందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: యాజకత్వ మార్పుకు అనివార్యమైన అనుబంధ ఫలితంగా ధర్మశాస్త్ర మార్పును కలుపుతుంది.
- source_word: γὰρ
  choice: ప్రత్యేక పదంగా అనువదించకుండా సందర్భ సంబంధంలో వ్యక్తీకరించబడింది
  rationale: γάρ ముందటి వాదనకు వివరణను పరిచయం చేస్తుంది. ఒంటరి వచనంలో ‘ఎందుకంటే’ అని మొదలుపెట్టడం తెలుగులో అసంపూర్ణంగా వినిపించవచ్చు; వాక్యంలోని తార్కిక సంబంధం పదక్రమం మరియు నిర్మాణం ద్వారా నిలిచింది.
theological_decisions:
- issue: యాజకత్వానికి సంబంధించి νόμος యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘ధర్మశాస్త్రంలో’ అని అనువదించి, సందర్భంలోని మోషే ధర్మశాస్త్ర వ్యవస్థను సూచించడంతోపాటు మార్పు ముఖ్యంగా యాజకత్వాన్ని నియమించే న్యాయవ్యవస్థకు సంబంధించినదిగా ఉంచబడింది.
  alternative: ‘ధర్మశాస్త్రం కూడా మార్చబడుతుంది’ లేదా మరింత విస్తృతంగా ‘చట్టంలో కూడా మార్పు’
  rationale: గ్రీకులో νόμου నిర్దిష్ట ఉపపదం లేకుండా ఉన్నా, హెబ్రీయులకు పత్రిక సందర్భం లేవీయ యాజకత్వాన్ని స్థాపించిన మోషే ధర్మశాస్త్రాన్ని ముందుకు తెస్తుంది. ‘ధర్మశాస్త్రంలో మార్పు’ అనే రూపం మొత్తం ధర్మశాస్త్రం సరళంగా రద్దయిందని అనవసరంగా నిర్ణయించకుండా అసలు వాక్యంలోని సంబంధాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ‘యాజకత్వం’, ‘ధర్మశాస్త్రం’ అనే స్థిరమైన బైబిలు పదాలను ఉంచి, వాక్యాన్ని సహజమైన తెలుగు క్రమంలో నిర్మించాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
