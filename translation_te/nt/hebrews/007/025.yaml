id: HEB.7.25
reference: Hebrews 7:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: te
  text: కాబట్టి, ఆయన ద్వారా దేవుని సన్నిధికి వచ్చేవారిని పూర్తిగా[a] రక్షించడానికి కూడా ఆయన సమర్థుడు; వారి కొరకు విజ్ఞాపన చేయడానికి ఆయన ఎల్లప్పుడూ జీవిస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎల్లప్పటికీ రక్షించడానికి సమర్థుడు’; సాంప్రదాయికంగా, ‘అంతమువరకు రక్షించడానికి సమర్థుడు.’
    reason: εἰς τὸ παντελές రక్షణ యొక్క సంపూర్ణతను, అలాగే కాలవ్యాప్తిని కూడా సూచించగలదు; ప్రధాన పాఠం సంపూర్ణతను ఎంచుకుంటూ ప్రత్యామ్నాయ కాలార్థాన్ని మరియు సాంప్రదాయిక అనువాదాన్ని భద్రపరుస్తుంది.
lexical_decisions:
- source_word: ὅθεν
  choice: కాబట్టి
  rationale: ముందటి వచనాల్లో చెప్పిన యేసు శాశ్వత యాజకత్వం నుండి వచ్చే నిర్ధారణను సహజంగా సూచిస్తుంది.
- source_word: καὶ
  choice: ఆయన ... రక్షించగలడు
  rationale: గ్రీకులోని జోడింపు భావం సందర్భంలోని నిర్ధారణలో అంతర్లీనంగా ఉంది; తెలుగులో ‘కూడా’ను చేరిస్తే అసహజంగా లేదా అనిశ్చితంగా వినిపించే అవకాశం ఉన్నందున స్పష్టమైన వాక్యప్రవాహానికి దాన్ని ప్రత్యక్షంగా వ్యక్తం చేయలేదు.
- source_word: σῴζειν
  choice: రక్షించగలడు
  rationale: రక్షణ సంబంధమైన సందర్భంలో ప్రామాణికమైన, వేదాంతపరమైన బరువును నిలిపే ఆధునిక తెలుగు ప్రయోగం.
- source_word: εἰς τὸ παντελές
  choice: సంపూర్ణంగా
  rationale: పూర్తిగా, అంతమువరకు అనే విస్తృత భావాన్ని ప్రధాన పాఠంలో సహజంగా అందిస్తుంది; కాలవ్యాప్తి భావాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: τοὺς προσερχομένους
  choice: దేవుని దగ్గరకు వచ్చేవారిని
  rationale: హెబ్రీయులకు పత్రికలో దేవుని సన్నిధికి చేరే ఆరాధనా మరియు సంబంధ భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: δι’ αὐτοῦ
  choice: ఆయన ద్వారా
  rationale: యేసు మధ్యవర్తిత్వం ద్వారానే దేవుని దగ్గరకు చేరడాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πάντοτε ζῶν
  choice: ఎల్లప్పుడూ జీవిస్తూనే ఉన్నాడు
  rationale: ఆయన నిరంతర జీవాన్ని మరియు కొనసాగుతున్న స్థితిని రెండింటినీ తెలియజేస్తుంది.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: విజ్ఞాపన చేయడానికి
  rationale: ప్రయోజనార్థక భావాన్ని నిలిపి, ఇతరుల పక్షంగా దేవుని సమక్షంలో వేడుకొనే యాజక కార్యాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπὲρ αὐτῶν
  choice: వారి పక్షంగా
  rationale: ప్రతినిధిత్వం మరియు వారి మేలు కోసం చేసే కార్యం అనే భావాలను ‘వారి కోసం’ కంటే స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: εἰς τὸ παντελές యొక్క అర్థవ్యాప్తి
  choice: ప్రధాన పాఠంలో ‘సంపూర్ణంగా’
  alternative: ‘ఎల్లప్పటికీ’; సాంప్రదాయికంగా ‘అంతమువరకు’
  rationale: ఈ పదబంధం రక్షణ యొక్క సంపూర్ణతను గానీ కాలాంతర నిలకడను గానీ సూచించగలదు. వెంటనే వచ్చే ఆయన నిరంతర జీవం గురించిన మాట రెండు కోణాలకూ బలం ఇస్తుంది. అందువల్ల ప్రధాన పాఠం సంపూర్ణతను వ్యక్తం చేస్తూ, కాలవ్యాప్తి భావాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: πάντοτε ζῶν అనే కారణాత్మక సంబంధం
  choice: ‘ఎందుకంటే’తో కారణంగా వ్యక్తీకరణ
  alternative: ‘ఎల్లప్పుడూ జీవిస్తూ’ అనే ప్రత్యక్ష కృదంత నిర్మాణం
  rationale: గ్రీకు కృదంతం ఆయన రక్షించగల సామర్థ్యానికి ఆధారాన్ని ఇస్తుంది; తెలుగులో కారణసంబంధాన్ని స్పష్టపరచడం సహజంగా ఉండి భావాన్ని అతిగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దగ్గరకు వచ్చేవారు’ సామాన్య పాఠకులకు సులభంగా ఉండగా, హెబ్రీయులకు పత్రికలోని దేవుని సన్నిధికి చేరే భావాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత పదం వెంట ఉంచబడింది.
