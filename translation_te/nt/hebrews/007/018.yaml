source:
  edition: SBLGNT
  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: te
  text: ఎందుకంటే, మునుపటి ఆజ్ఞ తన బలహీనత, నిష్ప్రయోజకత కారణంగా రద్దు చేయబడుతోంది[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముందున్న ఆజ్ఞ” లేదా “ముందుగా వచ్చిన ఆజ్ఞ.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, సమీప సందర్భంలో చెప్పిన సంపూర్ణతను పొందించడంలో అది అసమర్థమైనది (హెబ్రీయులు 7:19 చూడండి); దేవుని మునుపటి ప్రత్యక్షత స్వతహాగా చెడ్డదని దీని అర్థం కాదు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: రద్దు చేయబడుతోంది
  rationale: ఈ పదం చెల్లుబాటును తొలగించడం లేదా పక్కన పెట్టడాన్ని సూచిస్తుంది. సందర్భంలోని న్యాయపరమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: μὲν γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న వాదనకు వివరణను పరిచయం చేస్తుంది; μέν తరువాతి వచనంలోని వ్యత్యాసానికి పునాది వేస్తుంది. తెలుగులో కృత్రిమంగా ‘ఒకవైపు’ అని చేర్చకుండా సంబంధాన్ని సహజంగా ఉంచాం.
- source_word: γίνεται
  choice: చేయబడుతోంది
  rationale: రద్దు అమలులోకి రావడం అనే సంఘటనను తెలుగు కర్మణి నిర్మాణం స్పష్టంగా తెలియజేస్తుంది.
- source_word: προαγούσης ἐντολῆς
  choice: ముందున్న ఆజ్ఞ
  rationale: ప్రస్తుత వాదనకు ముందు ఉన్న లేదా ముందుగా వచ్చిన ఆజ్ఞ అనే కాలసంబంధ భావాన్ని నిలుపుతుంది; ఇది ‘మునుపటి ఆజ్ఞ’ అని కూడా అనువదించవచ్చు.
- source_word: διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές
  choice: బలహీనమైనదిగా, ప్రయోజనం లేనిదిగా ఉండడం వల్ల
  rationale: διά కారణాన్ని తెలియజేస్తుంది; రెండు విశేషణాల కఠినమైన మూల్యాంకనాన్ని తగ్గించకుండా సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἀσθενές
  choice: బలహీనమైనది
  rationale: కావలసిన ఫలితాన్ని సాధించే శక్తి లేకపోవడాన్ని సూచించే నేరుగా అర్థమయ్యే పదం.
- source_word: ἀνωφελές
  choice: ప్రయోజనం లేనిది
  rationale: ఉపయోగకరమైన ఫలితాన్ని కలిగించలేనిదనే భావాన్ని ఇస్తుంది; సందర్భంలో ఇది సంపూర్ణతకు చేర్చలేని అసమర్థతను సూచిస్తుంది.
theological_decisions:
- issue: ‘ముందున్న ఆజ్ఞ’పై విమర్శ యొక్క పరిధి
  choice: మూలంలోని ‘బలహీనమైనది, ప్రయోజనం లేనిది’ అనే బలమైన భాషను పాఠ్యంలో నిలిపి, సందర్భంలో అది సంపూర్ణతకు చేర్చలేకపోవడాన్ని సూచిస్తుందని పాదసూచికలో వివరించడం.
  alternative: మోషే ధర్మశాస్త్రమంతా అన్ని విధాలా విలువలేనిదని చెప్పడం; లేదా మూలంలోని ప్రతికూల మూల్యాంకనాన్ని మృదువుగా మార్చడం.
  rationale: హెబ్రీయులు 7:11,19 సందర్భం యాజక వ్యవస్థ ద్వారా సంపూర్ణత రాకపోవడంపై కేంద్రీకృతమై ఉంది. అందువల్ల మూలంలోని ఉద్రిక్తతను కాపాడుతూ, దాని సందర్భోచిత పరిధిని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి. ‘రద్దు చేయబడుతోంది’ మూలంలోని ἀθέτησις యొక్క చెల్లుబాటు తొలగింపు భావాన్ని నిలుపుతుంది; పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో [a], [b]గా ఉన్నాయి.
