reference: Hebrews 7:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: te
  text: తండ్రి లేనివాడు, తల్లి లేనివాడు, వంశావళి లేనివాడు[a], దినాల ఆరంభమూ జీవితానికి అంతమూ లేనివాడు, అయితే దేవుని కుమారునికి సాదృశ్యంగా చేయబడినవాడై, నిరంతరం యాజకుడిగా నిలిచి ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమోదైన వంశావళి లేనివాడు.” ఆదికాండంలో మెల్కీసెదెకు వంశవివరాలు నమోదు కాలేదు; హెబ్రీయులకు రాసిన పత్రిక ఆ మౌనాన్ని సాదృశ్యార్థంగా ఉపయోగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నిరంతరం” అనే మాటకు “ఎల్లకాలం” లేదా “ఎప్పటికీ” అని కూడా అనువదించవచ్చు. లేఖనంలో చిత్రించబడిన అతని యాజకత్వపు నిలకడను ఈ పదబంధం నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ
  choice: తండ్రి లేనివాడు
  rationale: గ్రీకు అభావార్థక విశేషణాన్ని నేరుగా ప్రతిబింబిస్తుంది; సందర్భంలో వాస్తవ తండ్రితనాన్ని నిరాకరిస్తున్నదా లేక నమోదైన వంశవివరాల లేమిని సూచిస్తున్నదా అనే ఉద్వేగాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: ἀμήτωρ
  choice: తల్లి లేనివాడు
  rationale: ἀπάτωρతో ఉన్న సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀγενεαλόγητος
  choice: వంశావళి లేనివాడు
  rationale: వంశావళి లేదా దాని నమోదు లేనిదనే మూలార్థాన్ని సంక్షిప్తంగా ఇస్తుంది; ఆదికాండంలోని నమోదుకు సంబంధించిన సందర్భాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: తన దినాలకు ఆరంభమూ తన జీవితానికి అంతమూ లేనివాడు
  rationale: జత నిరాకరణను, ఉన్నతమైన శైలిని కాపాడుతూ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀφωμοιωμένος
  choice: పోలి చేయబడినవాడై
  rationale: పరిపూర్ణ కర్మణి కృదంతంలోని కర్మణి భావాన్ని నిలుపుతుంది; మెల్కీసెదెకు కుమారుడే అని కాక, కుమారునితో పోలిక కలిగినవాడిగా చిత్రించబడ్డాడనే భేదాన్ని కాపాడుతుంది.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: దేవుని కుమారుని
  rationale: ప్రామాణిక క్రీస్తుసంబంధ బిరుదును సహజమైన తెలుగు విభక్తితో అందిస్తుంది.
- source_word: μένει
  choice: నిలిచి ఉంటాడు
  rationale: కొనసాగుతున్న స్థితిని సూచించే వర్తమానకాల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἱερεὺς
  choice: యాజకుడిగా
  rationale: సందర్భానికి తగిన ప్రామాణిక బైబిలు తెలుగు పదం; విధేయపూరక నిర్మాణంలో ‘గా’ సహజంగా ఉంటుంది.
- source_word: εἰς τὸ διηνεκές
  choice: నిరంతరం
  rationale: కొనసాగుదల, స్థిరత్వం అనే కాలవ్యాప్త భావాన్ని ఇస్తుంది; ‘ఎప్పటికీ’ అనే సాధ్యమైన మరింత నిరపేక్ష పఠనాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: మెల్కీసెదెకు నిజంగానే తల్లిదండ్రులు లేనివాడూ నిత్యుడూ అని వచనం చెబుతున్నదా, లేక లేఖన చిత్రణ ఆధారంగా రూపకసాదృశ్యాన్ని నిర్మిస్తున్నదా
  choice: మూలంలోని బలమైన వర్ణనలను ప్రధాన పాఠ్యంలో అలాగే ఉంచి, ‘దేవుని కుమారుని పోలి చేయబడినవాడై’ అనే కర్మణి సాదృశ్యాన్ని స్పష్టంగా అనువదించాం; ఆదికాండంలోని వంశనమోదు లేమిని పాదటిప్పణిలో సూచించాం.
  alternative: మెల్కీసెదెకు కుమారుని అవతారపూర్వ ప్రత్యక్షత అని లేదా స్వభావరీత్యా తల్లిదండ్రులు లేని నిత్యుడని స్పష్టంగా వ్యాఖ్యానించడం.
  rationale: ἀφωμοιωμένος గుర్తింపుకన్నా పోలికను సూచిస్తుంది. అయినా ἀπάτωρ మొదలైన పదాల వాక్యబలాన్ని కేవలం ‘నమోదు లేదు’గా ప్రధాన పాఠ్యంలో కుదించకుండా, గ్రంథంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని నిలిపాం.
- issue: εἰς τὸ διηνεκές యొక్క కాలవ్యాప్తి
  choice: ప్రధాన పాఠ్యంలో ‘నిరంతరం’; పాదటిప్పణిలో ‘ఎల్లకాలం/ఎప్పటికీ’ అనే ప్రత్యామ్నాయాలు.
  alternative: కేవలం ‘ఎప్పటికీ’ అని అనువదించి సంపూర్ణ నిత్యత్వాన్ని ముందుగానే నిర్ణయించడం.
  rationale: ఈ పదబంధం కొనసాగుదలతో కూడిన స్థిర స్వభావాన్ని నొక్కిచెబుతుంది; సందర్భంలోని యాజకత్వ చిత్రణను కాపాడుతూ సాధ్యమైన బలమైన పఠనాన్ని పాదటిప్పణిలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని వరుస అభావవర్ణనల లయను ‘లేనివాడు’ పునరుక్తితో నిలిపాం. పాదటిప్పణి గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో రెండూ ఉంచబడ్డాయి.
