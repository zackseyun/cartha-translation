revisions:
- from: తండ్రి లేనివాడు[a], తల్లి లేనివాడు, వంశావళి లేనివాడు, తన దినాలకు ఆరంభమూ తన జీవితానికి అంతమూ లేనివాడు, అయితే దేవుని కుమారుని పోలి చేయబడినవాడై, నిరంతరం యాజకుడిగా నిలిచి ఉంటాడు.[b]
  to: తండ్రి లేనివాడు, తల్లి లేనివాడు, వంశావళి లేనివాడు[a], దినాల ఆరంభమూ జీవితానికి అంతమూ లేనివాడు, అయితే దేవుని కుమారునికి సాదృశ్యంగా చేయబడినవాడై, నిరంతరం యాజకుడిగా నిలిచి ఉన్నాడు.[b]
  rationale: 'The revision makes only safe linguistic changes: it uses a more natural passive construction for ἀφωμοιωμένος, reflects the present continuing sense of μένει with “నిలిచి ఉన్నాడు,” removes unnecessary possessives from the paired temporal description, and aligns footnote a specifically with the genealogical lexical alternative. The wording continues to preserve the passage’s typological tension and does not identify Melchizedek with the Son of God.'
