source:
  edition: SBLGNT
  text: Καὶ οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς διὰ τὸ θανάτῳ κωλύεσθαι παραμένειν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/023.yaml
  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: te
  text: అంతేకాక, వారు మరణం వల్ల కొనసాగలేకపోవడంతో అనేకమంది యాజకులయ్యారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనేకమంది యాజకులు ఉన్నారు.” అక్షరార్థంగా, “కొనసాగలేకపోవడం వల్ల”; సందర్భంలో యాజక సేవలో కొనసాగలేకపోవడం అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: అంతేకాక
  rationale: ముందటి వాదనతో అనుసంధానాన్ని చూపుతూ, తరువాతి వచనంలోని వ్యత్యాసానికి సహజంగా దారితీస్తుంది.
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: వారు అనేకమంది యాజకులయ్యారు
  rationale: γεγονότες అనే పరిపూర్ణ భావాన్ని, యాజకుల సంఖ్యాబాహుళ్యాన్ని నిలుపుతుంది. μέν సూచించే, తరువాతి వచనంలోని δέతో పూర్తయ్యే వ్యత్యాసాన్ని తెలుగు వాక్యప్రవాహంలో సహజంగా ఉంచుతుంది.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: ఎందుకంటే మరణం వారిని ... అడ్డుకుంటుంది
  rationale: διάతో కూడిన infinitive కారణాన్ని తెలుపుతుంది; θανάτῳ సాధన/కారణ భావాన్ని సహజమైన కర్తృవాచ్య తెలుగు నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: παραμένειν
  choice: కొనసాగకుండా
  rationale: సందర్భంలో యాజక సేవలో కొనసాగడమే భావం. ప్రధాన పాఠంలో సంక్షిప్తతను నిలిపి, స్పష్టీకరణను పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: మరణశీలులైన అనేకమంది యాజకులకు, నిలిచివుండే యేసు యాజకత్వానికి మధ్య వ్యత్యాసం
  choice: ఈ వచనంలో ఉన్న యాజకుల బాహుళ్యాన్నీ, మరణం వల్ల వారు కొనసాగలేకపోవడాన్నీ మాత్రమే స్పష్టంగా అనువదించడం
  alternative: ప్రధాన పాఠంలోనే ‘లేవీయ యాజకులు’ లేదా ‘యాజక పదవిలో’ అని విస్తరించడం
  rationale: సందర్భం లేవీయ యాజకత్వాన్ని సూచించినా, గ్రీకు పాఠం ఈ వచనంలో ‘లేవీయ’ అని చెప్పదు. కాబట్టి తదుపరి వచనంతో ఏర్పడే ధార్మిక వ్యత్యాసాన్ని ముందుగానే విస్తరించి నిర్ధారించకుండా మూలపాఠపు నిర్మాణాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘యాజకులు’ అనే పదం సందర్భానుకూలంగా నిలుపబడింది; మూలంలో లేని ‘లేవీయ’ లేదా ‘పదవి’ ప్రధాన పాఠంలో చేర్చబడలేదు.
