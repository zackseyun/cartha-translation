id: HEB.7.16
reference: Hebrews 7:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: te
  text: ఆయన శరీరసంబంధమైన ఆజ్ఞపై ఆధారపడిన నియమం ప్రకారం కాక, అవినాశి జీవం యొక్క శక్తి ప్రకారం యాజకుడయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: ఆయన
  rationale: మునుపటి వచనంలో ప్రస్తావించిన యాజకునికి సంబంధించిన గ్రీకు సంబంధసర్వనామాన్ని తెలుగులో సహజంగా కొనసాగిస్తుంది.
- source_word: κατὰ νόμον ἐντολῆς σαρκίνης
  choice: శరీరసంబంధమైన ఆజ్ఞతో కూడిన నియమం ప్రకారం
  rationale: κατάను ప్రమాణం లేదా ఆధారాన్ని సూచించే ‘ప్రకారం’గా అనువదించింది. νόμος–ἐντολή మధ్యనున్న సంబంధాన్ని అతిగా నిర్ణయించకుండా, తెలుగులో అర్థమయ్యేలా ‘ఆజ్ఞతో కూడిన నియమం’ అని ఇచ్చింది. σαρκίνηςను నైతికంగా ‘పాపసంబంధమైన’ అని కాక, బాహ్యమైన లేదా శారీరకమైన అర్హతకు సంబంధించినదిగా ఉంచింది.
- source_word: γέγονεν
  choice: యాజకుడయ్యాడు
  rationale: పరిపూర్ణ కాలం వల్ల ఏర్పడిన ప్రస్తుత స్థితిని ‘అయ్యాడు’ సహజంగా తెలియజేస్తుంది. గ్రీకులో సందర్భం ద్వారా గ్రహించబడే ‘యాజకుడు’ అనే విధేయపదాన్ని తెలుగులో స్పష్టత కోసం పూరించింది.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: కాక, ... శక్తి ప్రకారం
  rationale: మొదటి κατὰ పదబంధంతో ఉన్న వ్యతిరేక సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ζωῆς ἀκαταλύτου
  choice: అవినాశి జీవపు
  rationale: ἀκατάλυτοςలోని నాశనం చేయలేని, రద్దు చేయలేని భావాన్ని ‘అవినాశి’ సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది; కేవలం కాలవ్యవధిని మాత్రమే సూచించే ‘అంతం లేని’ కంటే మూలపద విస్తృతిని మెరుగ్గా కాపాడుతుంది.
theological_decisions:
- issue: σαρκίνης అనే పదానికి నైతిక భావమా, శారీరక/వంశసంబంధ భావమా?
  choice: శరీరసంబంధమైన
  alternative: శారీరకమైన; దేహసంబంధమైన
  rationale: ఇక్కడ వ్యత్యాసం పాప స్వభావం మరియు పవిత్రత మధ్య కాదు; బాహ్యమైన, శరీర లేదా వంశ సంబంధ అర్హత మరియు అవినాశి జీవశక్తి మధ్య ఉంది. అందువల్ల మూలంలో లేని నైతిక నిందను చేర్చలేదు.
- issue: ἀκαταλύτου యొక్క విస్తృతి
  choice: అవినాశి
  alternative: అంతం లేని
  rationale: ‘అవినాశి’ అనేది జీవం అంతం లేనిదని మాత్రమే కాక, దాన్ని నిర్మూలించలేమనే బలమైన భావాన్నీ నిలుపుతుంది. పరిచితమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
- issue: గ్రీకులో విడిచిపెట్టబడిన విధేయపదం
  choice: యాజకుడయ్యాడు
  alternative: అటువంటివాడయ్యాడు
  rationale: మునుపటి సందర్భం యాజకత్వాన్ని స్పష్టంగా సూచిస్తుంది. తెలుగులో ‘యాజకుడు’ను పూరించడం సహజంగా ఉండి, కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘అవినాశి’ వంటి బైబిలు పఠనానికి అనువైన పదాన్ని ఉంచినా, వాక్యం సాధారణ పాఠకునికి అర్థమయ్యేలా సరళంగా ఉంది.
