id: HEB.1.6
reference: Hebrews 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: te
  text: 'ఇక ఆయన ప్రథమజాతుణ్ణి మళ్లీ లోకంలోకి తీసుకువచ్చినప్పుడు[a], ఇలా అంటున్నాడు: “దేవుని దూతలందరూ[b] ఆయనను ఆరాధించాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “ఇక మళ్లీ, ఆయన ప్రథమజాతుణ్ణి లోకంలోకి తీసుకువచ్చినప్పుడు, ఇలా అంటున్నాడు: ‘దేవుని దూతలందరూ ఆయనను ఆరాధించాలి.’” గ్రీకులోని “మళ్లీ” అనే క్రియావిశేషణం “తీసుకువచ్చినప్పుడు” అనే మాటను గానీ, “అంటున్నాడు” అనే మాటను గానీ విశేషించవచ్చు.'
    reason: alternative_reading
  - marker: b
    text: లేదా, “దేవుని సమస్త దూతలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ఎప్పుడు / తీసుకువచ్చినప్పుడు
  rationale: ఇది కాలాన్ని సూచించే ఉపవాక్యాన్ని ప్రారంభిస్తుంది. ఈ సందర్భంలో ఒక నిర్దిష్ట కార్యాన్ని సూచిస్తున్నందున, పునరావృత భావమిచ్చే ‘ఎప్పుడెప్పుడైతే’ కంటే ‘తీసుకువచ్చినప్పుడు’ సహజంగా ఉంది.
- source_word: δὲ
  choice: ఇక
  rationale: వాదనను ముందుకు తీసుకెళ్లే మృదువైన అనుసంధాన పదం. ‘కాని’ అనే బలమైన వ్యతిరేక భావాన్ని కలపకుండా తెలుగు ప్రవాహాన్ని నిలుపుతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ప్రధాన పాఠంలో ఇది ‘తీసుకువచ్చినప్పుడు’ అనే క్రియను విశేషిస్తున్నట్లు ఉంచబడింది. అయితే దీనిని ‘ఇలా అంటున్నాడు’తో కలిపి చదివే నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: εἰσαγάγῃ
  choice: లోకంలోకి తీసుకువచ్చినప్పుడు
  rationale: ὅταν తరువాత వచ్చిన ఈ క్రియ ఒకరిని లోపలికి తీసుకురావడం అనే కార్యాన్ని సూచిస్తుంది. ‘పరిచయం చేసినప్పుడు’ కంటే ‘తీసుకువచ్చినప్పుడు’ సందర్భానికి సహజం, గంభీరం.
- source_word: τὸν πρωτότοκον
  choice: ప్రథమజాతుణ్ణి
  rationale: ఇక్కడ ఇది కుమారునికి సంబంధించిన బిరుదుగా వాడబడింది. ‘ప్రథమజాతుడు’ మూలపదంలోని జన్మ, స్థానం, ప్రాధాన్యం సంబంధిత ప్రతిధ్వనులను వ్యాఖ్యానంతో పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: εἰς τὴν οἰκουμένην
  choice: లోకంలోకి
  rationale: οἰκουμένη నివాసిత లోకాన్ని లేదా లోకవ్యవస్థను సూచించగలదు. ‘లోకంలోకి’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఇక్కడి విస్తృత భావాన్ని అందిస్తుంది.
- source_word: λέγει
  choice: ఇలా అంటున్నాడు
  rationale: గ్రీకులో వర్తమానకాల రూపాన్ని నిలుపుతుంది. సందర్భంలో కర్త దేవుడు అని అర్థమైనా, మూలంలో లేని ‘లేఖనంలో’ వంటి మాటను చేర్చలేదు.
- source_word: προσκυνησάτωσαν
  choice: ఆరాధించాలి
  rationale: తృతీయ పురుష ఆజ్ఞార్థక భావాన్ని ఆధునిక, సహజ తెలుగులో వ్యక్తం చేస్తుంది. హెబ్రీయులు 1 సందర్భంలో కుమారునికి దేవదూతలు చూపవలసిన గౌరవానికి ‘ఆరాధించాలి’ తగిన బలాన్ని ఇస్తుంది.
- source_word: αὐτῷ
  choice: ఆయనను
  rationale: προσκυνέωతో వచ్చిన దత్తివిభక్తి కర్మను తెలుగులో సహజంగా ‘ఆయనను ఆరాధించాలి’ అని అనువదించాం.
- source_word: πάντες ἄγγελοι θεοῦ
  choice: దేవుని దూతలందరూ
  rationale: గ్రీకు షష్ఠీవిభక్తి నిర్మాణాన్ని సహజమైన తెలుగు సంబంధ నిర్మాణంతో అందిస్తుంది; ‘అందరూ’ πάντες యొక్క సమగ్రతను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: πάλιν యొక్క వ్యాకరణ పరిధి
  choice: ‘మళ్లీ’ అనేది ‘లోకంలోకి తీసుకువచ్చినప్పుడు’ అనే క్రియను విశేషిస్తుంది.
  alternative: '‘మళ్లీ’ అనేది ‘అంటున్నాడు’తో కలుస్తుంది: ‘ఇక మళ్లీ, ఆయన ప్రథమజాతుణ్ణి లోకంలోకి తీసుకువచ్చినప్పుడు, ఇలా అంటున్నాడు…’'
  rationale: గ్రీకు పదక్రమం రెండు అన్వయాలకూ వీలు ఇస్తుంది. ప్రధాన పాఠంలో క్రియతో అనుసంధానించిన సహజ పఠనాన్ని తీసుకుని, నిజమైన సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
- issue: కుమారుని పట్ల προσκυνέω యొక్క భావబలం
  choice: ఆరాధించాలి
  alternative: నమస్కరించాలి / సాష్టాంగపడాలి
  rationale: హెబ్రీయులు 1లో కుమారుడు దేవదూతలకంటే ఉన్నతుడని చూపించే వాదనలో, దేవుని దూతలందరికీ ఇచ్చిన ఈ ఆజ్ఞకు ‘ఆరాధించాలి’ సందర్భానుగుణమైన బలాన్ని అందిస్తుంది; అదే సమయంలో మూలపాఠానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని, ఆరాధనా పఠనానికి తగిన గౌరవభరిత శైలిని ఉపయోగించాం. ‘ప్రథమజాతుడు’ అనే బిరుదు కొంత సాహిత్య గంభీరత కలిగినదైనా తెలుగు క్రైస్తవ పాఠకులకు సుపరిచితం, మూలపదాన్ని సంక్షిప్తంగా నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
