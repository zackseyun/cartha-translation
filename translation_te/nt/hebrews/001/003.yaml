- issue: ἀπαύγασμα మరియు χαρακτήρ పదాల క్రీస్తు సంబంధ బలం
  choice: మహిమ యొక్క ప్రకాశం; అస్తిత్వానికి ఖచ్చితమైన ముద్ర
  alternative: మహిమ యొక్క ప్రతిబింబం; అస్తిత్వానికి ప్రతిరూపం
  rationale: కుమారుని కేవలం బాహ్య ప్రతినిధిగా బలహీనపరచకుండా, మూలంలోని ప్రకాశం మరియు అచ్చమైన సరిపోలిక అనే బలమైన రూపకాలను నిలుపుతుంది.
- issue: δι’ αὑτοῦ పాఠాంతరం
  choice: ప్రధాన పాఠ్యంలో ‘తన ద్వారానే’ చేర్చడం
  alternative: పదబంధాన్ని విడిచిపెట్టడం / ‘ఆయనే స్వయంగా’ అని అనువదించడం
  rationale: అందించిన SBLGNT పాఠ్యంలో ఈ పదబంధం ఉన్నందున దాన్ని అనువదించాం; ఇతర ప్రతుల సాక్ష్యాన్ని పాదసూచికలో పారదర్శకంగా తెలియజేశాం.
- issue: τῆς μεγαλωσύνης అనే దైవిక పరోక్షోక్తి
  choice: మహామహిమగలవారి
  alternative: మహోన్నతుడైన దేవుని / మహిమ యొక్క
  rationale: దైవిక సూచనను గౌరవప్రదంగా, వ్యక్తిగతంగా వ్యక్తం చేస్తూ, గ్రీకులో లేని ‘దేవుడు’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
