  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గంభీరమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని దీర్ఘ వాక్య ప్రవాహం, వరుస కృదంతాలు, క్రీస్తు సంబంధ బలమైన రూపకాలు నిలుపబడ్డాయి. ‘మహామహిమగలవారి’ అనే గౌరవ బహువచనం దైవిక పరోక్షోక్తికి తగిన తెలుగు మర్యాదను ఇస్తుంది.
