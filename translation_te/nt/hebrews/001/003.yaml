id: HEB.1.3
reference: Hebrews 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: te
  text: ఆయన దేవుని మహిమ యొక్క ప్రకాశమై, ఆయన అస్తిత్వానికి ఖచ్చితమైన ముద్రగా[a] ఉండి, తన శక్తిమంతమైన వాక్కుతో సమస్తాన్ని నిలబెడుతూ, తన ద్వారానే[b] పాపాల శుద్ధీకరణను చేసి, ఉన్నత స్థలాల్లో[c] మహామహిమగలవారి కుడివైపున కూర్చున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన స్వభావానికి/సారానికి ఖచ్చితమైన ప్రతిరూపంగా.”
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో “తన ద్వారానే” అనే మాటలు లేవు. ఇక్కడ SBLGNT పాఠాన్ని అనుసరించి వాటిని చేర్చాం. దీనిని “ఆయనే స్వయంగా” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: textual_variant
  - marker: c
    text: లేదా, “ఉన్నత ప్రదేశాల్లో” లేదా “పరలోకంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: ప్రకాశం
  rationale: ‘ప్రకాశం’ మహిమనుండి వెలువడే తేజస్సు అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం ప్రతిబింబం అనే భావానికి పరిమితం చేయదు.
- source_word: δόξα
  choice: మహిమ
  rationale: దైవిక వైభవం, ఘనత అనే భావాలను మోసే స్థిరమైన మరియు సహజమైన తెలుగు పదం.
- source_word: χαρακτήρ
  choice: ఖచ్చితమైన ముద్ర
  rationale: ముద్ర వేయడం వల్ల ఏర్పడే అచ్చమైన రూపం అనే గ్రీకు పదంలోని సజీవ రూపకాన్ని నిలుపుతుంది.
- source_word: ὑπόστασις
  choice: అస్తిత్వం
  rationale: ఇక్కడ దేవుని అంతర్లీన వాస్తవికతను సూచిస్తుంది; తరువాతి కాలపు సాంకేతిక తాత్త్విక పదజాలాన్ని ప్రధాన పాఠ్యంలోకి అతిగా దిగుమతి చేయదు.
- source_word: φέρων
  choice: నిలబెడుతూ
  rationale: సమస్తాన్ని నిరంతరం మోసి, కొనసాగించి, స్థిరంగా ఉంచే క్రియాశీల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ πάντα
  choice: సమస్తం
  rationale: గ్రీకులోని సమగ్ర పరిధిని భౌతిక విశ్వానికి మాత్రమే పరిమితం చేయకుండా కాపాడుతుంది.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: తన శక్తిగల వాక్కుతో
  rationale: దైవిక పలుకు సాధనంగా పనిచేస్తుందనే భావాన్ని, శక్తితో దాని సంబంధాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: δι’ αὑτοῦ
  choice: తన ద్వారానే
  rationale: SBLGNTలో ఉన్న పాఠాన్ని అనుసరించి διά యొక్క సాధారణ మాధ్యమార్థాన్ని తెలుపుతుంది; ‘ఆయనే స్వయంగా’ అనే సాధ్యమైన భావభేదాన్ని పాదసూచికలో చూపిస్తుంది.
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: పాపాల నుండి శుద్ధి
  rationale: పాపాలతో వ్యవహరించే శుద్ధీకరణ కార్యాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ఆచారపరమైన మరియు బలిసంబంధమైన నేపథ్యాన్ని నిలుపుతుంది.
- source_word: ἐν δεξιᾷ τῆς μεγαλωσύνης
  choice: మహామహిమగలవారి కుడివైపున
  rationale: ‘మహామహిమ’ అనే దైవిక బిరుదు భావాన్ని గౌరవప్రదంగా వ్యక్తం చేస్తుంది; మూలంలో స్పష్టంగా లేని నామాన్ని చేర్చదు.
- source_word: ἐν ὑψηλοῖς
  choice: ఉన్నత లోకాలలో
  rationale: పరలోక ఉన్నత స్థలాలను సూచించే బహువచన భావాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: ὑπόστασις పదానికి క్రీస్తు తత్వశాస్త్రపరమైన ప్రాధాన్యం
