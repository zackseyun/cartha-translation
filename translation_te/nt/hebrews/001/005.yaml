source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: te
  text: 'ఎందుకంటే, దేవదూతలలో ఎవరికైనా ఆయన ఎప్పుడైనా ఇలా చెప్పాడా?[a]


    “నీవు నా కుమారుడివి;

    నేడు నేను నీకు జన్మనిచ్చాను”[b]


    మరియు మళ్లీ,


    “నేను అతనికి తండ్రిగా ఉంటాను,

    అతడు నాకు కుమారుడిగా ఉంటాడు”[c]


    అని చెప్పాడా?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దేవదూతలలో ఎవరికైనా ఆయన ఏ కాలంలోనైనా చెప్పాడా?”
    reason: lexical_alternative
  - marker: b
    text: “నేను నీకు జన్మనిచ్చాను” అనే మాట కీర్తన 2:7ను ప్రతిధ్వనిస్తుంది. దీనిని రాజాభిషేకం, పునరుత్థానం, లేదా తండ్రితో కుమారుని నిత్య సంబంధం నేపథ్యంలో అర్థం చేసుకున్నారు. అనువాదం వీటిలో ఏదో ఒకదానిని నిర్ణయించకుండా మూలపదబంధాన్ని నిలుపుతుంది.
    reason: cross_reference
  - marker: c
    text: ఇది 2 సమూయేలు 7:14 నుండి తీసుకున్న ఉద్ధరణ. మరింత వాడుకగా, “నేను అతని తండ్రిగా ఉంటాను; అతడు నా కుమారుడిగా ఉంటాడు” అని అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι ... τῶν ἀγγέλων
  choice: దేవదూతలలో ఎవరితోనైనా
  rationale: దత్తివిభక్తి ప్రశ్నార్థక సర్వనామంతో కూడిన భాగార్థక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, దేవదూతలలో ఏ ఒక్కరినీ ఉద్దేశించి దేవుడు ఇలా చెప్పలేదనే అలంకారప్రశ్న బలాన్ని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలోని కుమారుని శ్రేష్ఠతకు ఈ వచనం ఆధారాన్ని ఇస్తున్న వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: εἶπέν ποτε
  choice: ఎప్పుడైనా ... అన్నాడా?
  rationale: ποτε సూచించే ‘ఏ సందర్భంలోనైనా’ అనే భావాన్ని, అలంకారప్రశ్నకు సహజమైన ఆధునిక తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ἀγγέλων
  choice: దేవదూతలు
  rationale: హెబ్రీయులు 1 సందర్భంలో మానవ దూతలు కాక పరలోక దేవదూతలే ఉద్దేశించబడ్డారు.
- source_word: Υἱός μου εἶ σύ
  choice: నీవు నా కుమారుడివి
  rationale: ప్రత్యక్ష సంబోధనను, తండ్రి–కుమారుని సంబంధాన్ని స్పష్టంగా మరియు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σήμερον
  choice: నేడు
  rationale: కాలసూచక పదాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా గంభీరమైన సాధారణ తెలుగులో నేరుగా అనువదిస్తుంది.
- source_word: γεγέννηκά σε
  choice: నేను నిన్ను కన్నాను
  rationale: γεννάω యొక్క జనన/తండ్రిత్వ రూపకాన్ని వ్యాఖ్యానంతో పరిమితం చేయకుండా తెలుగులో నేరుగా నిలుపుతుంది; ఈ రూపం రాజాభిషేకం, పునరుత్థానం, లేదా నిత్య సంబంధం వంటి వివరణల్లో ఏదో ఒకదానిని అనువాదంలోనే నిర్ణయించదు.
- source_word: καὶ πάλιν
  choice: మళ్లీ
  rationale: మరొక లేఖన ఉద్ధరణను పరిచయం చేసే సూత్రాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: నేను అతనికి తండ్రిగా ఉంటాను
  rationale: εἰς + accusative నిర్మాణంలోని సంబంధాత్మక భావాన్ని, ‘అతనికి ... గా’ అనే సమతుల్యమైన తెలుగు నిర్మాణంతో పరిరక్షిస్తుంది.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: అతడు నాకు కుమారుడిగా ఉంటాడు
  rationale: మొదటి అర్ధవాక్యానికి సమాంతరతను నిలుపుతూ, ఒడంబడిక సంబంధ భాషను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రెండు పాత నిబంధన ఉద్ధరణలలోని కుమారత్వ భాష
  choice: రెండు చోట్లా ‘కుమారుడు’ అనే పదాన్నే ఉపయోగించి, మొదటి ప్రత్యక్ష సంబోధనకూ రెండవ ఒడంబడిక సూత్రానికీ వాటి వాక్య నిర్మాణాల ద్వారానే తేడా చూపించడం
  alternative: మొదటి చోట ప్రత్యేక క్రీస్తు బిరుదును సూచించే విధంగా అక్షరరూప భేదం చూపించడం
  rationale: తెలుగులో పెద్ద/చిన్న అక్షరాల భేదం లేదు. కాబట్టి మూలంలోని భావాన్ని పదక్రమం, ప్రత్యక్ష సంబోధన, సందర్భం ద్వారా నిలుపుతూ కృత్రిమ గుర్తింపును చేర్చలేదు.
- issue: ‘నేను నిన్ను కన్నాను’ అనే మాట యొక్క అర్థం
  choice: మూలంలోని జనన రూపకాన్ని అలాగే ఉంచి, దాని చారిత్రక లేదా తాత్త్విక సూచనను ప్రధాన పాఠ్యంలో నిర్ణయించకపోవడం
  alternative: దీనిని రాజాభిషేకం, పునరుత్థాన ప్రకటన, అవతారం, లేదా కుమారుని నిత్య సంబంధంగా స్పష్టీకరించడం
  rationale: కీర్తన 2:7 ఉద్ధరణను హెబ్రీయులు క్రీస్తు సంబంధంగా ఉపయోగిస్తుంది; అయితే ఈ ఒక్క పదబంధం దాని అన్వయాన్ని నిర్దిష్టంగా పరిమితం చేయదు. అనువాదం ఆ తాత్త్విక ఉద్రిక్తతను కాపాడాలి.
- issue: 2 సమూయేలు 7:14లోని తండ్రి–కుమారుని ఒడంబడిక సూత్రం
  choice: ‘అతనికి తండ్రిగా... నాకు కుమారుడిగా’ అనే సంబంధాత్మక నిర్మాణాన్ని నిలుపడం
  alternative: ‘నేను అతని తండ్రిని అవుతాను; అతడు నా కుమారుడు అవుతాడు’ అని మరింత నిత్యవాడుక భాషలో చెప్పడం
  rationale: ఎంచుకున్న రూపం మూలంలోని సమాంతర ఒడంబడిక స్వరాన్ని నిలుపుతూ తెలుగులోనూ స్పష్టంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ లేఖన ఉద్ధరణలకు తగిన గంభీరతను నిలిపాం. ‘నేడు,’ ‘కన్నాను,’ ‘తండ్రిగా/కుమారుడిగా ఉంటాడు’ వంటి రూపాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని కవితాత్మక మరియు ఒడంబడిక స్వరాన్ని కాపాడుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
