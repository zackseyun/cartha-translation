source:
  edition: SBLGNT
  text: τοσούτῳ κρείττων γενόμενος τῶν ἀγγέλων ὅσῳ διαφορώτερον παρ’ αὐτοὺς κεκληρονόμηκεν ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/004.yaml
  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: te
  text: ఆయన దేవదూతలకంటే ఎంత ఉన్నతుడయ్యాడో, వారికున్న దానికంటే మరింత విశిష్టమైన నామాన్ని అంతగా వారసత్వంగా పొందాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘దేవదూతలకంటే మరింత శ్రేష్ఠుడయ్యాడు ... వారికున్న దానికంటే మరింత విశిష్టమైన నామం.’'
    reason: lexical_alternative
  - marker: b
    text: తదుపరి సందర్భంలో ఈ ‘నామం’ కుమారుని పుత్రసంబంధ బిరుదు, హోదాతో స్పష్టమవుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: ఎంత ... అంతగా
  rationale: ఈ సహసంబంధ నిర్మాణం రెండు పోలికల మధ్య అనుపాతాన్ని వ్యక్తపరుస్తుంది. తెలుగులో ‘ఎంత ... అంతగా’ సహజంగా ఉండి ఆ అనుపాత సంబంధాన్ని నిలుపుతుంది.
- source_word: κρείττων
  choice: ఉన్నతుడు
  rationale: ఇక్కడ నైతికంగా ‘మంచివాడు’ అనే భావం కంటే దేవదూతలపై హోదా, ఘనతలో ఆధిక్యం ప్రధానంగా ఉంది; అందువల్ల ‘ఉన్నతుడు’ సందర్భానికి తగినది.
- source_word: γενόμενος
  choice: అయ్యాడు
  rationale: గ్రీకు భూతకాల కృదంతంలోని ‘అవడం/కావడం’ భావాన్ని సూటిగా నిలుపుతుంది. ‘చేయబడ్డాడు’ అనడం మూలంలో లేని సృష్టించబడిన భావాన్ని కలిగించే అవకాశం ఉంది.
- source_word: τῶν ἀγγέλων
  choice: దేవదూతలకంటే
  rationale: తులనాత్మక పదం తరువాత వచ్చే షష్ఠీ విభక్తి భావాన్ని తెలుగులో సహజమైన ‘కంటే’ నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: διαφορώτερον
  choice: శ్రేష్ఠమైన
  rationale: సందర్భంలో ఇది కేవలం భిన్నత్వాన్ని కాక, అధిక విశిష్టతను లేదా ఘనతను సూచిస్తుంది. ‘శ్రేష్ఠమైన’ ఆ తులనాత్మక విలువను సహజంగా తెలియజేస్తుంది.
- source_word: παρ’ αὐτοὺς
  choice: వారికంటే
  rationale: నామం దేవదూతలకు సంబంధించిన దానికంటే శ్రేష్ఠమని పోలిక సూచిస్తోంది. ‘వారికంటే’ మూలంలోని సంక్షిప్తతను నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: κεκληρονόμηκεν
  choice: వారసత్వంగా పొందాడు
  rationale: పరిపూర్ణ కాలం గతంలో పొందినదాని ప్రస్తుత ఫలితస్థితిని సూచిస్తుంది. ‘వారసత్వంగా పొందాడు’ వారసత్వ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ὄνομα
  choice: నామాన్ని
  rationale: తదుపరి సందర్భం దాని ప్రత్యేకతను స్పష్టం చేస్తుంది. ‘నామం’ అనే సూటి అనువాదం సాహిత్య ప్రవాహాన్ని కాపాడి, ముందుగానే ‘కుమారుడు అనే బిరుదు’ అని వ్యాఖ్యానించదు.
theological_decisions:
- issue: γενόμενος వల్ల కుమారుని స్థితి గురించి కలిగే క్రీస్తుశాస్త్ర సంబంధ సూచన
  choice: క్రియను ‘ఉన్నతుడయ్యాడు’ అని సూటిగా అనువదించి, దేవదూతలతో పోల్చిన ఆయన ఉన్నత స్థితిని వ్యక్తపరచడం
  alternative: ‘ఉన్నతునిగా చేయబడ్డాడు’ అని అనువదించడం లేదా ఆయన సృష్టించబడ్డాడని సూచించేలా విస్తరించడం
  rationale: మూలంలోని ‘అవడం’ భావాన్ని నిలుపుకోవాలి; అయితే వచనంలో లేని సృష్టి భావాన్ని చేర్చకూడదు. సమీప సందర్భం కుమారుని దేవదూతలకంటే ఉన్నతమైన స్థితి, ఆయన పొందిన నామం గురించి మాట్లాడుతుంది.
- issue: ‘నామం’ యొక్క సందర్భార్థం
  choice: ప్రధాన పాఠ్యంలో ‘నామం’ అనే పదాన్నే ఉంచి, తరువాతి సందర్భం దానిని కుమారుని పుత్రసంబంధ బిరుదు/హోదాగా స్పష్టం చేయనివ్వడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘కుమారుడు అనే బిరుదు’ అని వివరణాత్మకంగా మార్చడం
  rationale: ఈ వచనం స్వయంగా ‘నామం’ అని మాత్రమే చెబుతుంది. తరువాతి వచనాలు దాని భావాన్ని విప్పుతాయి; కనుక ముందస్తు వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా సాహిత్య క్రమాన్ని నిలుపుకోవడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ హెబ్రీయులకు పత్రిక యొక్క గంభీర శైలిని నిలుపుకున్నాం. ‘ఎంత ... అంతగా’ నిర్మాణం గ్రీకు అనుపాత పోలికను కాపాడుతుంది; ‘నామం’ అనే పదం వివరణాత్మక విస్తరణ లేకుండా ఉంచబడింది.
