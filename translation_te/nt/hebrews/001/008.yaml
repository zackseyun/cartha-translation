id: HEB.1.8
reference: Hebrews 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: te
  text: 'కుమారుని గురించి మాత్రం ఆయన ఇలా అంటున్నాడు: “దేవా[a], నీ సింహాసనం యుగయుగాల వరకు ఉంటుంది; న్యాయనిష్ఠగల రాజదండం నీ రాజ్యపు రాజదండం[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరో విధంగా, అయితే తక్కువ సంభావ్యతతో: “దేవుడే యుగయుగాల వరకు నీ సింహాసనం.” గ్రీకు వాక్యనిర్మాణంపై భిన్నాభిప్రాయాలు ఉన్నాయి; అయితే “దేవా, నీ సింహాసనం” అనే ప్రత్యక్ష సంబోధన సందర్భానికీ ఈ ఉద్ధరణ బలానికీ బాగా సరిపోతుంది.'
    reason: alternative_reading
  - marker: b
    text: లేదా “నీతి గల రాజదండం.” గ్రీకు పదం నిటారుతనం, యథార్థత లేదా నీతిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: కుమారుని గురించి మాత్రం ఆయన ఇలా అంటున్నాడు
  rationale: ముందటి వాక్యాల్లో దేవదూతల గురించి చెప్పినదానికి ఇక్కడ కుమారుని గురించిన మాటను వ్యత్యాసంగా చూపిస్తుంది. సందర్భంలో అంతర్లీనంగా ఉన్న ‘అంటున్నాడు’ అనే క్రియను తెలుగులో సహజత కోసం స్పష్టంగా చేర్చాం.
- source_word: υἱόν
  choice: కుమారుని
  rationale: నిర్దిష్టమైన బిరుదుగా ఉన్న ‘కుమారుడు’ అనే భావాన్ని, సందర్భానికి తగిన విభక్తితో నిలిపింది.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: దేవా, నీ సింహాసనం
  rationale: ὁ θεόςను ప్రత్యక్ష సంబోధనగా గ్రహించడం గ్రీకు వాక్యనిర్మాణానికీ, హెబ్రీయులు 1లోని ఉద్ధరణల వాదనకూ బాగా సరిపోతుంది. వ్యాకరణపరంగా సాధ్యమైన మరో పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: యుగయుగాల వరకు నిలుస్తుంది
  rationale: అంతంలేని కాలవ్యాప్తిని సూచించే గ్రీకు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; తెలుగులో వాక్యపూర్ణత కోసం ‘నిలుస్తుంది’ చేర్చబడింది.
- source_word: ῥάβδος
  choice: రాజదండం
  rationale: రాజ్యపాలన సందర్భంలో ఇది సాధారణ కర్రను కాక, రాజాధికారానికి చిహ్నమైన దండాన్ని సూచిస్తుంది.
- source_word: τῆς εὐθύτητος
  choice: న్యాయనిష్ఠ
  rationale: εὐθύτηςలోని నిటారుతనం, యథార్థత, నీతిపరమైన సూటితనం అనే భావాలను రాజపాలన సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: నీ రాజ్యపు రాజదండం
  rationale: βασιλείαలోని రాజ్యం లేదా పాలన భావాన్ని స్పష్టంగా ఉంచి, మూలంలోని పునరుక్త నిర్మాణాన్ని సాధ్యమైనంతవరకు కాపాడుతుంది.
theological_decisions:
- issue: ὁ θεός అనేది కుమారునికి ‘దేవా’ అని ప్రత్యక్ష సంబోధనా, లేక ‘దేవుడే నీ సింహాసనం’ అనే విధేయ నిర్మాణమా?
  choice: 'ప్రత్యక్ష సంబోధన: “దేవా, నీ సింహాసనం”'
  alternative: “దేవుడే యుగయుగాల వరకు నీ సింహాసనం”
  rationale: కీర్తన ఉద్ధరణ యొక్క బలం మరియు హెబ్రీయులు 1లో కుమారుని దేవదూతలకంటే ఉన్నతునిగా చూపించే వాదప్రవాహం ప్రత్యక్ష సంబోధనకు మెరుగ్గా సరిపోతాయి. అయినా గ్రీకు వాక్యనిర్మాణంపై చర్చ ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- issue: εὐθύτηςను ‘న్యాయనిష్ఠ’గా లేదా ‘నీతి’గా అనువదించాలా?
  choice: న్యాయనిష్ఠ
  alternative: నీతి
  rationale: ఈ పదం నిటారుతనం, యథార్థత, సూటితనం అనే లక్షణాన్ని నేరుగా సూచిస్తుంది. రాజ్యపాలన సందర్భంలో ‘న్యాయనిష్ఠ’ సహజంగా ఉండగా, ‘నీతి’ కూడా సాధ్యమైనందున దాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. ‘రాజదండం’ రాజాధికార ప్రతీకను స్పష్టంగా తెలియజేస్తుంది. మూలంలోని ప్రత్యక్ష సంబోధనను, రాజదండం అనే పునరుక్తిని, అలాగే నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదసూచికతో కాపాడాం.
