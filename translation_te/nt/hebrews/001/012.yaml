id: HEB.1.12
reference: Hebrews 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: te
  text: వాటిని పైవస్త్రంలా చుట్టివేస్తావు[a]; వస్త్రంలా అవి మార్చబడతాయి. కాని నీవు మాత్రం ఎప్పుడూ ఒకేలా ఉన్నావు; నీ సంవత్సరాలు ముగిసిపోవు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మడతపెడతావు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అంతం కావు”; “ఎన్నటికీ అంతం కావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: పైవస్త్రంలా
  rationale: చుట్టూ కప్పుకునే వస్త్రాన్ని సూచించే ఉపమానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἑλίξεις
  choice: చుట్టివేస్తావు
  rationale: చుట్టడం లేదా మడతపెట్టడం అనే క్రియాభావాన్ని, సృష్టిని వస్త్రంలా చుట్టివేసే కవితాత్మక చిత్రంతో సహా వ్యక్తం చేస్తుంది.
- source_word: αὐτούς
  choice: వాటిని
  rationale: మునుపటి సందర్భంలోని సృష్టించబడిన ఆకాశాలు, భూమిని తిరిగి సూచించే బహువచన సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: ὡς ἱμάτιον
  choice: వస్త్రంలా
  rationale: περιβόλαιονతో సమాంతరంగా ఉన్న రెండవ వస్త్రోపమానాన్ని సంక్షిప్తంగా, గంభీరంగా ఉంచుతుంది.
- source_word: ἀλλαγήσονται
  choice: అవి మార్చబడతాయి
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, సృష్టి మార్పుకు లోనవుతుందని స్పష్టంగా తెలియజేస్తుంది.
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: కాని నీవు మాత్రం అదేవిధంగా ఉన్నావు
  rationale: మారే సృష్టికీ మారని సంబోధితునికీ మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని కాపాడుతూ, గ్రీకు వర్తమానకాలాన్ని మరియు ‘అదే’ అనే భావాన్ని నిలుపుతుంది.
- source_word: τὰ ἔτη σου οὐκ ἐκλείψουσιν
  choice: నీ సంవత్సరాలు ముగిసిపోవు
  rationale: సంవత్సరాలు నిలిచిపోవు లేదా అంతం కావు అనే కవితాత్మక కాలరూపకాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: క్రీస్తును ఉద్దేశించిన ఉల్లేఖనంలో మార్పులేనితనాన్ని తెలిపే భాష
  choice: కాని నీవు మాత్రం అదేవిధంగా ఉన్నావు
  alternative: కాని నీవు మారనివాడవు
  rationale: ‘మారనివాడవు’ అనే సిద్ధాంతపరమైన సారాంశాన్ని నేరుగా చేర్చకుండా, ὁ αὐτός అనే గ్రీకు వ్యక్తీకరణలోని ‘అదేవిధంగా ఉండడం’ అనే భావాన్ని నిలుపుతుంది; అయినప్పటికీ మారే సృష్టితో ఉన్న వ్యత్యాసం స్పష్టంగానే ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా కవితాత్మక గంభీరతను నిలిపాం. ‘పైవస్త్రం,’ ‘వస్త్రం’ అనే సమాంతర పదాలతో మూలంలోని వస్త్రోపమానాన్ని కాపాడాం; సృష్టి మార్పు మరియు సంబోధితుని స్థిరత్వం మధ్య ఉన్న వ్యత్యాసాన్ని అదనపు సిద్ధాంతపదజాలం లేకుండా వ్యక్తం చేశాం.
