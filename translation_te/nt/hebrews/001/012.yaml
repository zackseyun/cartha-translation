review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two clothing comparisons, the future passive ('they will be changed'), and the contrast with the addressee whose years do not end. However, 'అదేవిధంగా ఉన్నావు' normally means 'you are in that manner/like that,' rather than conveying ὁ αὐτός ('you are the same').
  naturalness: The verse is generally clear and appropriately poetic in modern standard Telugu. Replacing 'అదేవిధంగా ఉన్నావు' with 'ఎప్పుడూ ఒకేలా ఉన్నావు' gives a natural Telugu expression for enduring sameness in this contrast.
  terminology: '''పైవస్త్రం'' and ''వస్త్రం'' suitably maintain the distinct but parallel clothing imagery. The existing alternative ''నిలిచిపోవు'' is unsuitable for οὐκ ἐκλείψουσιν, since it can mean ''will stop,'' the reverse of the intended sense.'
  issues:
  - severity: medium
    issue: Rendering of ὁ αὐτός
    rationale: '''అదేవిధంగా ఉన్నావు'' is not idiomatic Telugu for ''you are the same'' and can be understood merely as ''you are like that.'' ''ఎప్పుడూ ఒకేలా ఉన్నావు'' naturally expresses the intended enduring sameness without importing technical doctrinal terminology.'
  - severity: medium
    issue: Footnote b alternative reverses the sense
    rationale: '''నిలిచిపోవు'' normally means ''will stop/come to a halt.'' In a note introduced by ''లేదా,'' it must not be offered as an alternative to ''will not fail/cease.'' Replace it with a negative expression such as ''ఎన్నటికీ అంతం కావు.'''
  revised_text: వాటిని పైవస్త్రంలా చుట్టివేస్తావు[a]; వస్త్రంలా అవి మార్చబడతాయి. కాని నీవు మాత్రం ఎప్పుడూ ఒకేలా ఉన్నావు; నీ సంవత్సరాలు ముగిసిపోవు[b].
