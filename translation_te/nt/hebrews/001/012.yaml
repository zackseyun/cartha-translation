- from: వాటిని పైవస్త్రంలా చుట్టివేస్తావు[a]; వస్త్రంలా అవి మార్చబడతాయి. కాని నీవు మాత్రం అదేవిధంగా ఉన్నావు; నీ సంవత్సరాలు ముగిసిపోవు[b].
  to: వాటిని పైవస్త్రంలా చుట్టివేస్తావు[a]; వస్త్రంలా అవి మార్చబడతాయి. కాని నీవు మాత్రం ఎప్పుడూ ఒకేలా ఉన్నావు; నీ సంవత్సరాలు ముగిసిపోవు[b].
