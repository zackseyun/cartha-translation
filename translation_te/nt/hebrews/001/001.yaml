  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: te
  text: పూర్వకాలంలో[a] దేవుడు ప్రవక్తల ద్వారా[b] పితరులతో[c] అనేక భాగాలుగా, అనేక విధాలుగా మాట్లాడాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చాలాకాలం క్రితం.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ప్రవక్తలలో”; “ప్రవక్తల చేత” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “పూర్వీకులతో”; గ్రీకులో “పితరులకు” (అక్షరార్థంగా, “పితరులకు/తండ్రులకు”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: అనేక భాగాలుగా
  rationale: ప్రత్యక్షత అనేక భాగాలు లేదా అంశాలుగా ఇవ్వబడిందనే భావాన్ని నిలుపుతూ, తరువాతి πολυτρόπως సూచించే విధవిధమైన పద్ధతుల భావంతో కలిసిపోకుండా చేస్తుంది.
- source_word: πολυτρόπως
  choice: అనేక విధాలుగా
  rationale: మాట్లాడిన పద్ధతుల్లోని వైవిధ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πάλαι
  choice: పూర్వకాలంలో
  rationale: గతంలోని పూర్వ యుగాన్ని గౌరవప్రదమైన, సులభంగా అర్థమయ్యే తెలుగులో సూచిస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: గ్రీకు వాక్యంలోని కర్తను నేరుగా, సహజంగా అందిస్తుంది.
- source_word: λαλήσας
  choice: మాట్లాడాడు
  rationale: గ్రీకులో ఇది భూతకాల క్రియావిశేష రూపమైనప్పటికీ 1:2లోని ప్రధాన క్రియతో అనుసంధానమవుతుంది; విడిగా చదివే 1:1లో సహజత కోసం సమాపక క్రియగా అనువదించబడింది, కాలభేదం మాత్రం నిలిచివుంటుంది.
- source_word: τοῖς πατράσιν
  choice: పితరులతో
  rationale: దత్తివుతో కలిసి λαλέω ఇక్కడ సంభాషణ గ్రహీతలను సూచిస్తుంది. 'పితరులు' మూలంలోని లింగసూచకమైన, నిబంధన-చారిత్రక పదాన్ని నిలుపుతుంది; 'మన' అనే పదాన్ని మూలంలో లేకుండా చేర్చదు.
- source_word: ἐν τοῖς προφήταις
  choice: ప్రవక్తల ద్వారా
  rationale: ἐν యొక్క సాధనార్థక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, దేవుడు వక్తగా మరియు ప్రవక్తలు ఆయన సాధనాలుగా ఉన్నారని తెలియజేస్తుంది.
theological_decisions:
- issue: హెబ్రీయులు 1:2తో సంబంధమున్న క్రియావిశేష నిర్మాణం
  choice: 1:1లో λαλήσαςను 'మాట్లాడాడు' అనే సమాపక క్రియగా ఇవ్వడం
  alternative: '''మాట్లాడిన దేవుడు...'' అని క్రియావిశేష రూపాన్ని యథాతథంగా ఉంచడం'
  rationale: గ్రీకు వాక్య నిర్మాణం 1:2లో పూర్తవుతుంది; అయితే ఒక్క వచనంగా తెలుగులో చదివినప్పుడు అసంపూర్ణత రాకుండా సమాపక క్రియను వాడాం. పూర్వపు ప్రకటనకూ కుమారునిలోని ప్రకటనకూ మధ్యనున్న కాల సంబంధాన్ని ముందుగానే సిద్ధాంతపరంగా విశదీకరించలేదు.
- issue: τοῖς πατράσιν యొక్క గుర్తింపు
  choice: '''పితరులతో'' అని మూలంలోని పదాన్ని నిలుపడం'
  alternative: '''పూర్వీకులతో'' అని లింగసమగ్రంగా అనువదించడం'
  rationale: '''పితరులు'' అనే పదం ఇశ్రాయేలు నిబంధన-చరిత్రతో ఉన్న ప్రత్యేక అనుబంధాన్ని నిలుపుతుంది; అయినా ''పూర్వీకులు'' అనే విస్తృత భావం సాధ్యమని పాదటిప్పణిలో సూచించబడింది.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండు వేర్వేరు క్రియావిశేషాల భావభేదాన్ని 'అనేక భాగాలుగా, అనేక విధాలుగా' అని స్పష్టంగా నిలుపాం. పాదటిప్పణి గుర్తులు వాటికి సంబంధించిన పదబంధాల వెంట ఉంచబడ్డాయి.
