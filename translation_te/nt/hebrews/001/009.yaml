id: HEB.1.9
reference: Hebrews 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: te
  text: నీవు నీతిని[a] ప్రేమించావు, అధర్మాన్ని ద్వేషించావు; అందుచేత దేవుడు, నీ దేవుడు, నీ సహచరులకంటే మిన్నగా ఆనంద తైలంతో నిన్ను అభిషేకించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘న్యాయాన్ని.’ గ్రీకు పదం నీతి లేదా న్యాయం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: ప్రేమించావు
  rationale: గ్రీకు ఏఓరిస్ట్‌ను సహజమైన తెలుగు భూతకాలంతో వ్యక్తం చేస్తూ, తరువాతి సమాంతర క్రియతో నేరుగా జతచేస్తుంది.
- source_word: δικαιοσύνην
  choice: నీతి
  rationale: నైతిక సదాచారం, న్యాయస్వభావం రెండింటినీ మోయగల సహజమైన తెలుగు పదం; ప్రధాన సందర్భంలో ‘righteousness’ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐμίσησας
  choice: ద్వేషించావు
  rationale: ‘ప్రేమించావు’ అనే క్రియకు ఎదురుగా ఉన్న బలమైన నైతిక వ్యతిరేకతను యథాతథంగా నిలుపుతుంది.
- source_word: ἀνομίαν
  choice: అధర్మం
  rationale: చట్టం లేదా దేవుని నైతిక క్రమానికి విరుద్ధమైన ప్రవర్తనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘నియమరాహిత్యం’ కంటే ఈ సందర్భంలో సులభంగా అర్థమవుతుంది.
- source_word: διὰ τοῦτο
  choice: అందుచేత
  rationale: ముందటి నైతిక విరుద్ధతకూ తరువాతి అభిషేకానికీ మధ్యనున్న కారణాత్మక-నిష్కర్షాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἔχρισέν σε
  choice: నిన్ను అభిషేకించాడు
  rationale: రాజసంబంధమైన, మెస్సీయసంబంధమైన అభిషేక చిత్రణను నిలుపుతుంది.
- source_word: ὁ θεός, ὁ θεός σου
  choice: దేవుడు, నీ దేవుడు
  rationale: మూలంలోని పునరుక్తినీ సంబంధ సూచననీ వివరణాత్మక విస్తరణ లేకుండా నేరుగా నిలుపుతుంది.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: ఆనంద తైలం
  rationale: సంతోషోత్సాహంతో కూడిన అభిషేకాన్ని తెలిపే లేఖనీయ రూపకాన్ని గౌరవప్రదమైన, అర్థవంతమైన తెలుగులో కాపాడుతుంది.
- source_word: παρὰ τοὺς μετόχους σου
  choice: నీ సహచరులకంటే మిన్నగా
  rationale: παράతో వ్యక్తమైన తులనాత్మక ఆధిక్యాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: δικαιοσύνη యొక్క నైతిక మరియు న్యాయ సంబంధ భావవ్యాప్తి
  choice: ప్రధాన పాఠంలో ‘నీతి’
  alternative: ‘న్యాయం’
  rationale: ఈ రాజసంబంధమైన ఉద్ధరణలో నైతిక సదాచారం ప్రధానంగా కనిపించినా, న్యాయ భావం కూడా సాధ్యమే; అందువల్ల ప్రత్యామ్నాయాన్ని పాదటీకలో నిలిపాం.
- issue: కుమారుని గురించి ‘దేవుడు, నీ దేవుడు’ అనే పదబంధం
  choice: పదబంధాన్ని వివరణాత్మక మార్పు లేకుండా నిలుపడం
  alternative: త్రిత్వ సంబంధాలను వివరించే వ్యాఖ్యానాత్మక విస్తరణ
  rationale: మూలపాఠంలోని క్రీస్తు సంబంధమైన ఘనతనూ ‘నీ దేవుడు’ అనే సంబంధ సూచననూ రెండింటినీ నిలిపి, వాటి మధ్యనున్న దైవశాస్త్ర ఉద్వేగాన్ని అనువాదంలో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన లేఖన శైలిని ఉపయోగించాం. ‘ఆనంద తైలం,’ ‘అభిషేకించాడు’ వంటి పదాలు మూలంలోని రాజసంబంధమైన, ఆరాధనా చిత్రణను నిలుపుతాయి; వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఉంచాం.
