source:
  edition: SBLGNT
  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: te
  text: 'అయితే దేవదూతల్లో ఎవరికైనా ఆయన ఎప్పుడైనా ఇలా చెప్పాడా? “నేను నీ శత్రువులను నీ పాదాలకు పాదపీఠంగా చేసే వరకు నా కుడివైపున కూర్చో”[a]


    [a] లేదా, “నేను నీ శత్రువులను నీ పాదాల కింద ఉంచే వరకు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నీ శత్రువులను నీ పాదాల కింద ఉంచే వరకు.”
    reason: τίθημι మరియు పాదపీఠం రూపకాన్ని, సంబోధితుని పాదాల కింద శత్రువులను ఉంచడం అనే మరింత ప్రత్యక్షమైన తెలుగులో కూడా వ్యక్తం చేయవచ్చు. ఇది అదే అణచివేత చిత్రణను నిలుపుతుంది.
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: అయితే దేవదూతల్లో ఎవరికైనా
  rationale: πρός with τίνα after a verb of speaking means ‘to whom.’ Telugu idiomatically expresses this with ఎవరికైనా. అయితే preserves the contrastive force of δέ in the ongoing comparison between the Son and angels.
- source_word: εἴρηκέν ποτε
  choice: ఆయన ఎప్పుడైనా ఇలా చెప్పాడా?
  rationale: ఎప్పుడైనా conveys ποτέ, while చెప్పాడా naturally presents the rhetorical question. ఇలా introduces the direct quotation smoothly; the enduring force of the perfect is supplied by the scriptural quotation in context rather than by an unnatural Telugu perfect construction.
- source_word: Κάθου
  choice: కూర్చో
  rationale: A direct, natural singular imperative that preserves the command without adding passivity or excessive formality.
- source_word: ἐκ δεξιῶν μου
  choice: నా కుడివైపున
  rationale: This is the natural modern Telugu locative expression for the honored position at the speaker’s right hand, preserving the enthronement imagery.
- source_word: ἕως ἂν θῶ
  choice: నేను ... చేసే వరకు
  rationale: The construction points to a future endpoint. చేసే వరకు is idiomatic Telugu and allows τίθημι with the predicate ‘footstool’ to be represented naturally.
- source_word: τοὺς ἐχθρούς σου
  choice: నీ శత్రువులను
  rationale: A direct and unambiguous rendering of the plural object.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: నీ పాదాలకు పాదపీఠంగా
  rationale: Preserves the concrete scriptural metaphor of a footstool and the image of enemies’ subjugation, rather than replacing it with an explanatory paraphrase.
theological_decisions:
- issue: కీర్తన 110:1 ఉల్లేఖనంలోని సింహాసనారోహణ మరియు శత్రువుల అణచివేత చిత్రణ
  choice: “నా కుడివైపున కూర్చో ... నీ పాదాలకు పాదపీఠంగా చేసే వరకు” అనే ప్రత్యక్ష రూపక భాషను నిలుపుకోవడం
  alternative: “నీ శత్రువులను పూర్తిగా ఓడించే వరకు” అని భావాన్ని వివరిస్తూ అనువదించడం
  rationale: హెబ్రీయులకు రాసిన పత్రికలోని వాదన కుమారునికి పలికిన ఈ నిర్దిష్ట వాక్యానికీ, దేవదూతలకు అలా పలకకపోవడానికీ మధ్యనున్న వ్యత్యాసంపై ఆధారపడుతుంది. అందువల్ల మూలంలోని రాజసంబంధమైన స్థానాన్నీ అణచివేత రూపకాన్నీ వివరణాత్మకంగా సరళీకరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కుడివైపున,’ ‘పాదపీఠంగా’ అనే పదాలు సామాన్య పాఠకులకు అర్థమయ్యేలా ఉండి, ఉల్లేఖనంలోని రాజసంబంధమైన గంభీరతను నిలుపుతాయి. ప్రశ్నార్థక నిర్మాణం మూలంలోని అలంకారిక ప్రశ్నను స్పష్టంగా తెలియజేస్తుంది.
