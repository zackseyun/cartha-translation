source:
  edition: SBLGNT
  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: te
  text: ఈ చివరి రోజులలో ఆయన కుమారునిలో[a] మనతో మాట్లాడాడు. ఆయనను అన్నిటికీ వారసునిగా నియమించాడు; ఆయన ద్వారా యుగాలను[b] కూడా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక కుమారుని ద్వారా.” గ్రీకులో అక్షరార్థంగా “కుమారునిలో” అని ఉంది; “కుమారుడు” ముందు నిర్దేశక పదం లేదు. దేవుడు మాట్లాడిన విధానాన్నీ, ఆ మాట యొక్క పరాకాష్ఠ స్వభావాన్నీ ఈ రూపం ప్రత్యేకంగా చూపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “విశ్వాన్ని” లేదా “లోకాలను.” గ్రీకు పదం అక్షరార్థంగా “యుగాలు”; అది యుగాలనే కాక, విస్తృతార్థంలో సమస్త సృష్టిక్రమాన్ని కూడా సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: ఈ చివరి రోజులలో
  rationale: కాలాన్ని సూచించే గ్రీకు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, అంత్యకాల భావాన్ని నిలుపుతుంది.
- source_word: ἐλάλησεν ἡμῖν
  choice: మనతో మాట్లాడాడు
  rationale: గ్రీకు భూతకాల క్రియను సహజంగా అనువదిస్తుంది; 1వ వచనంలోని దేవుని మునుపటి మాటతో ఉన్న వ్యత్యాసాన్ని సందర్భం తెలియజేస్తుంది.
- source_word: ἐν υἱῷ
  choice: కుమారునిలో
  rationale: ἐν అనే విభక్త్యర్థంలోని ‘లో’ భావాన్ని, అలాగే గ్రీకులో నిర్దేశక పదం లేకపోవడాన్ని సాధ్యమైనంతవరకు కాపాడుతుంది. తెలుగు సందర్భంలో ఇది ఒక అనిర్దిష్ట కుమారుడని తప్పుగా సూచించకుండా, దేవుని తుదిమాట కుమారునిలో పలికిందనే విధానాత్మక గాఢతను నిలుపుతుంది.
- source_word: ὃν ἔθηκεν κληρονόμον πάντων
  choice: ఆయనను సమస్తానికి వారసునిగా నియమించాడు
  rationale: τίθημι ఇక్కడ ఒక పాత్రలో నియమించడం లేదా స్థాపించడం అనే భావంలో ఉంది; πάντων యొక్క విస్తృత పరిధిని ‘సమస్తానికి’ నిలుపుతుంది.
- source_word: δι’ οὗ
  choice: ఆయన ద్వారానే
  rationale: διά + షష్ఠీ విభక్తి మధ్యవర్తి కార్యసాధకత్వాన్ని సూచిస్తుంది; ‘ద్వారానే’ ఆ భావంతో పాటు సందర్భంలోని ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: ἐποίησεν
  choice: చేశాడు
  rationale: ποιέω యొక్క విస్తృతమైన ‘చేయు/నిర్మించు’ భావాన్ని కాపాడుతుంది; మరింత నిర్దిష్టమైన ‘సృష్టించాడు’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు.
- source_word: τοὺς αἰῶνας
  choice: యుగాలను
  rationale: పదంలోని కాలసంబంధమైన ప్రాథమిక రూపాన్ని నిలుపుతూ, సందర్భంలో సమస్త సృష్టిక్రమాన్ని కూడా సూచించగల విస్తృతిని పాదటిప్పణిలో తెలియజేస్తుంది.
theological_decisions:
- issue: ἐν υἱῷ యొక్క క్రీస్తుసంబంధ గాఢత
  choice: కుమారునిలో
  alternative: కుమారుని ద్వారా; తన కుమారుని ద్వారా
  rationale: గ్రీకు వాక్యంలో నిర్దేశక పదం లేకపోయినా, తెలుగులో ‘ఒక కుమారునిలో’ అనడం అనవసరమైన అనిర్దిష్టతను కలిగిస్తుంది. ‘కుమారునిలో’ అనేది ἐν యొక్క అసాధారణమైన, గాఢమైన రూపాన్ని నిలుపుతూ దేవుని పరాకాష్ఠ ప్రకటన కుమారునిలో వచ్చిందని తెలియజేస్తుంది.
- issue: τοὺς αἰῶνας యొక్క కాలిక-విశ్వవ్యాప్త పరిధి
  choice: యుగాలను
  alternative: విశ్వాన్ని; లోకాలను
  rationale: αἰῶνες యుగాలను నేరుగా సూచించగలదే కాక, వాటితో ముడిపడిన సమస్త సృష్టిక్రమాన్ని కూడా సూచించగలదు. ప్రధాన పాఠ్యం పదరూపాన్ని నిలుపుతుంది; పాదటిప్పణి విశ్వసంబంధ అర్థాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. మూలంలోని ‘కుమారునిలో’ మరియు ‘యుగాలను’ అనే అసాధారణ పదబంధాలు అర్థస్పష్టత కోల్పోకుండా ప్రధాన పాఠ్యంలో నిలుపబడ్డాయి; అవసరమైన ప్రత్యామ్నాయాలు పాదటిప్పణుల్లో ఇవ్వబడ్డాయి.
