  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμένεις· καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/011.yaml
  text: They will perish[a], but you remain; and they all will wear out like a garment[b],
translation:
  language: te
  text: అవి నశించిపోతాయి, కాని నీవు నిలిచి ఉంటావు; అవన్నీ వస్త్రంలా పాతబడిపోతాయి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ రూపకం కీర్తన 102:25–27ను ప్రతిధ్వనింపజేస్తూ, సృష్టి యొక్క నశ్వరతను సంబోధించబడుతున్నవాని నిరంతర స్థిరత్వంతో పోల్చుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: అవి
  rationale: మునుపటి వచనంలోని ఆకాశాలు, భూమిని తిరిగి సూచిస్తుంది. నిర్జీవ సృష్టిని సూచించడానికి ఆధునిక తెలుగులో ‘అవి’ సహజంగా ఉంది.
- source_word: ἀπολοῦνται
  choice: నశించిపోతాయి
  rationale: అంతమైపోవడం లేదా నిలిచిపోకపోవడం అనే బలమైన భావాన్ని నిలుపుతుంది; బాహ్య కర్త చేత ధ్వంసం చేయబడతాయని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: σὺ δὲ
  choice: కాని నీవు
  rationale: సృష్టి నశ్వరతకు, సంబోధించబడుతున్న వ్యక్తి శాశ్వత స్థితికి మధ్య ఉన్న స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: διαμένεις
  choice: నిలిచి ఉంటావు
  rationale: కొనసాగి ఉండడం, నిలిచి ఉండడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάντες
  choice: అవన్నీ
  rationale: ముందు ప్రస్తావించిన సృష్టి అంశాలన్నిటినీ సమష్టిగా సూచిస్తూ πάντες యొక్క సమగ్ర భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ὡς ἱμάτιον
  choice: వస్త్రంలా
  rationale: ἱμάτιον అనే సాధారణ వస్త్రార్థాన్ని ఒక నిర్దిష్ట దుస్తుకు పరిమితం చేయకుండా ఉపమానంగా నిలుపుతుంది.
- source_word: παλαιωθήσονται
  choice: పాతబడిపోతాయి
  rationale: వయస్సుతో పాతదై, అరిగిపోయే వస్త్రం అనే రూపకాన్ని సహజంగా వ్యక్తం చేస్తూ, ‘పాతబడుట’ మరియు ‘అరిగిపోవుట’ మధ్యనున్న భావవ్యాప్తిని అతిగా సంకుచితం చేయదు.
theological_decisions:
- issue: సంబోధించబడుతున్న వ్యక్తి మరియు క్రీస్తుసంబంధ భావం
  choice: ‘నీవు నిలిచి ఉంటావు’ అని కుమారునికి నేరుగా చేసిన సంబోధనను నిలిపాము.
  alternative: సంబోధితుని పేరును వివరణాత్మకంగా వచనంలో చేర్చడం.
  rationale: హెబ్రీయులు 1 సందర్భంలో ఈ కీర్తన వాక్యం కుమారునికి వర్తింపజేయబడింది. మూలంలోని ద్వితీయ పురుష సంబోధనను కాపాడాలి; అయితే మూలంలో లేని సిద్ధాంత వివరణను ప్రధాన పాఠ్యంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరంగా ఉంది. మూలంలోని రెండు భిన్న క్రియలను—‘నశించిపోతాయి’, ‘పాతబడిపోతాయి’—వేరుగా నిలిపి, కవితాత్మక వ్యత్యాసాన్ని కాపాడింది.
