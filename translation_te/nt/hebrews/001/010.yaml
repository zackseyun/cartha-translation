id: HEB.1.10
reference: Hebrews 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: te
  text: మరియు, “ప్రభువా, ఆరంభంలో[a] నీవు భూమికి పునాది వేశావు; ఆకాశాలు నీ చేతుల పనులు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆదిలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: మరియు
  rationale: ఇది వరుసగా ఉన్న మరొక ఉద్ధరణను పరిచయం చేస్తుంది; అదనపు భావాన్ని అతిగా వివరించకుండా సాధారణ అనుసంధానాన్ని నిలుపుతుంది.
- source_word: Σὺ
  choice: నీవు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామానికి ఉద్ఘాటన ఉంది; ప్రత్యక్ష సంబోధనలో దానిని తెలుగులో నిలుపుతుంది.
- source_word: κατ’ ἀρχάς
  choice: ఆరంభంలో
  rationale: సృష్టి ప్రారంభాన్ని సూచించే సహజమైన కాలవాచక ప్రయోగం; ‘ఆది నుండి’ అనే భావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: κύριε
  choice: ప్రభువా
  rationale: κύριος యొక్క సంబోధన రూపాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నేరుగా అందిస్తుంది.
- source_word: τὴν γῆν
  choice: భూమికి
  rationale: ఆకాశాలతో జతగా ఉన్న సృష్టి సందర్భంలో γῆ ఒక ప్రాంతాన్ని కాక భూమిని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘భూమికి పునాది’ అని ఇచ్చాం.
- source_word: ἐθεμελίωσας
  choice: పునాది వేశావు
  rationale: θεμελιόω లోని నిర్మాణ రూపకాన్ని స్పష్టంగా, సహజంగా కాపాడుతుంది.
- source_word: ἔργα
  choice: పనులు
  rationale: చేతులతో చేసినవాటిని సూచించే సాధారణ, పారదర్శక పదం; మూలంలోని బహువచనాన్ని నిలుపుతుంది.
- source_word: τῶν χειρῶν σού
  choice: నీ చేతుల
  rationale: మూలంలోని మానవరూప వర్ణనను ‘నీ హస్తకృతి’ వంటి సాహిత్యపరమైన సంక్షేపం లేకుండా నేరుగా కాపాడుతుంది.
- source_word: οἱ οὐρανοί
  choice: ఆకాశాలు
  rationale: గ్రీకు బహువచనాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, భూమితో ఉన్న సృష్టి సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: కీర్తన 102లో ప్రభువును ఉద్దేశించిన భాషను హెబ్రీయులు 1లో కుమారునికి అన్వయించడం
  choice: ‘ప్రభువా, ... నీవు’ అనే ప్రత్యక్ష సంబోధనను యథాతథంగా నిలుపడం
  alternative: ఉద్ధరణలోని క్రీస్తుసంబంధ బలాన్ని తగ్గించేలా సంబోధనను తటస్థీకరించడం
  rationale: గ్రీకు పాఠంలో κύριε ప్రత్యక్ష సంబోధనగా స్పష్టంగా ఉంది. అదనపు సిద్ధాంత వివరణను చేర్చకుండా హెబ్రీయుల రచయిత చేసిన అన్వయాన్ని అనువాదం నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదప్రయోగం. మూలంలోని సృష్టి రూపకాలు, ప్రత్యక్ష సంబోధన, బహువచనం కాపాడబడ్డాయి.
