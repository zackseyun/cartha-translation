id: HEB.1.14
reference: Hebrews 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: te
  text: వీరందరూ రక్షణను వారసత్వంగా పొందబోయేవారి కోసం సేవ చేయడానికి పంపబడుతున్న పరిచారక ఆత్మలు కారా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రక్షణను వారసత్వంగా పొందేవారి.’ గ్రీకు పదబంధం భవిష్యత్తును సూచించే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: కారా?
  rationale: అవుననే సమాధానాన్ని ఆశించే గ్రీకు అలంకారప్రశ్న బలాన్ని తెలుగులో సహజమైన ప్రతికూల ప్రశ్నారూపంతో నిలుపుతుంది.
- source_word: πάντες
  choice: వీరందరూ
  rationale: మునుపటి సందర్భంలోని దేవదూతలందరినీ సూచించే సమగ్ర బహువచన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: λειτουργικὰ πνεύματα
  choice: పరిచారక ఆత్మలు
  rationale: λειτουργικός లోని సేవాసంబంధమైన, కొంత గౌరవప్రదమైన భావాన్ని నిలుపుతూ, πνεύματα సూచించే దేవదూతల స్వభావాన్ని ‘ఆత్మలు’గా అనువదిస్తుంది; సంఘ పదవిని సూచించదు.
- source_word: εἰς διακονίαν
  choice: సేవ చేయడానికి
  rationale: ఈ పదబంధంలోని ఉద్దేశ భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἀποστελλόμενα
  choice: పంపబడుతున్న
  rationale: వర్తమాన కర్మణి అసమాపక క్రియ యొక్క కొనసాగుతున్న లేదా లక్షణాత్మక భావాన్ని కాపాడుతుంది.
- source_word: διὰ τοὺς
  choice: వారి కోసం
  rationale: అక్క్యూసేటివ్‌తో διά ఇక్కడ తెలిపే ప్రయోజనార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς μέλλοντας
  choice: పొందబోయేవారి
  rationale: μέλλω లోని భవిష్యదభిముఖమైన భావాన్ని నిలుపుతుంది; ముందే నిర్ణయించబడ్డారనే అదనపు భావాన్ని చేర్చదు.
- source_word: κληρονομεῖν
  choice: స్వాస్థ్యంగా పొంద
  rationale: వారసత్వం లేదా హక్కుగా పొందడం అనే రూపకాన్ని తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: σωτηρίαν
  choice: రక్షణను
  rationale: హెబ్రీయులకు పత్రికలోని వర్తమాన మరియు అంత్యకాల సంబంధమైన విస్తృత భావానికి సరిపోయే స్థిరమైన తెలుగు పదం.
theological_decisions:
- issue: μέλλοντας κληρονομεῖν σωτηρίαν యొక్క కాలసంబంధమైన బలం
  choice: రక్షణను స్వాస్థ్యంగా పొందబోయేవారు
  alternative: రక్షణను స్వాస్థ్యంగా పొందేవారు
  rationale: గ్రీకు పదబంధంలోని భవిష్యదభిముఖతను నిలుపుతూ, నిశ్చయత లేదా ముందస్తు నిర్ణయం గురించి ఏ ప్రత్యేక సిద్ధాంతాన్నీ వాక్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బైబిలు శైలిని ఉంచినా సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణం. ‘పరిచారక’ మరియు ‘సేవ’ ద్వారా మూలంలోని λειτουργικός, διακονία అనే వేర్వేరు సేవాసంబంధ పదాల మధ్య స్వల్ప భేదం నిలుపబడింది.
