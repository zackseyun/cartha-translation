id: HEB.1.7
reference: Hebrews 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: te
  text: 'దేవదూతల గురించి ఆయన ఇలా చెబుతున్నాడు: “ఆయన తన దూతలను గాలులుగా[a], తన సేవకులను అగ్నిజ్వాలగా చేస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆత్మలుగా”; ఇక్కడి గ్రీకు పదానికి “గాలులు” లేదా “ఆత్మలు” అనే రెండు అర్థాలు రావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: దేవదూతల గురించి
  rationale: ఇక్కడ πρός అనేది ప్రత్యక్ష సంబోధనకన్నా దేవదూతలను గూర్చిన మాటను సూచిస్తోంది; హెబ్రీయులు 1లోని కుమారునితో వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: λέγει
  choice: చెబుతున్నాడు
  rationale: లేఖన ఉల్లేఖనానికి గ్రీకు వర్తమాన కాలంలో ఉన్న సజీవతను తెలుగులో సహజమైన వర్తమాన రూపంతో నిలిపాం.
- source_word: Ὁ ποιῶν
  choice: చేస్తాడు
  rationale: కర్తృవాచక అసమాపక క్రియను తెలుగులో సహజమైన సమాపక క్రియగా అనువదించి, ‘చేయు’ అనే క్రియాశీల భావాన్ని నిలిపాం.
- source_word: ἀγγέλους
  choice: దూతలను
  rationale: ఉల్లేఖనంలో ‘తన దూతలు’ అని సహజంగా ఉంటుంది; సందర్భం వీరు దేవదూతలని ముందరి పరిచయ పదబంధం స్పష్టం చేస్తుంది.
- source_word: πνεύματα
  choice: గాలులుగా
  rationale: ఈ పదానికి ‘గాలులు’ లేదా ‘ఆత్మలు’ అనే అర్థాలు ఉండవచ్చు. కీర్తన 104:4 నేపథ్యం, ‘అగ్నిజ్వాల’తో కవితాత్మక సమాంతరత కారణంగా ప్రధాన పాఠంలో ‘గాలులు’ ఎంచుకున్నాం.
- source_word: λειτουργοὺς
  choice: సేవకులను
  rationale: దేవుని సేవను నిర్వహించేవారనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రత్యేక సంఘపదవిని అనవసరంగా సూచించదు.
- source_word: πυρὸς φλόγα
  choice: అగ్నిజ్వాలగా
  rationale: గ్రీకులోని ఏకవచన కవితాత్మక చిత్రాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: αὐτοῦ
  choice: తన
  rationale: ఉపవాక్య కర్త అయిన దేవునికే చెందిన దూతలు, సేవకులు అనే స్వామ్యసంబంధాన్ని తెలుగులో ‘తన’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: కీర్తన 104:4 ఉల్లేఖనంలో πνεύματα అర్థం
  choice: గాలులు
  alternative: ఆత్మలు
  rationale: హీబ్రూ నేపథ్యానికి, ‘అగ్నిజ్వాల’ అనే సమాంతర ప్రకృతి చిత్రానికి ‘గాలులు’ బాగా సరిపోతుంది. అయినా గ్రీకు పదంలోని నిజమైన ద్వంద్వార్థాన్ని పరిష్కరించినట్టు చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ఉల్లేఖనంలోని కవితాత్మక సమాంతరతను, ఏకవచన ‘అగ్నిజ్వాల’ను నిలిపాం.
