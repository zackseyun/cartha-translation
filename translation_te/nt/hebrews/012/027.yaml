    text: అక్షరార్థంగా, “నిర్మించబడిన వాటిగా.” “సృష్టించబడినవిగా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “కదిలించలేనివి” లేదా “కదల్చలేనివి” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  revision_rationale: The revision removes the added causal-emphatic sense of “గనుక/వే,” retaining ὡς with “నిర్మించబడినవిగా.” It also joins the purpose clause to the main clause, eliminating the vague pronoun while preserving ἵνα’s purpose/result force and the Greek contrast of passive participles.
