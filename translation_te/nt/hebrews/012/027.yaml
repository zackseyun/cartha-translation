id: HEB.12.27
reference: Hebrews 12:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: te
  text: “మరొకసారి” అనే ఈ మాట, కదిలించబడుతున్నవి నిర్మించబడినవిగా తొలగించబడడాన్ని సూచిస్తుంది[a], తద్వారా కదిలించబడనివి నిలిచి ఉండేలా చేస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిర్మించబడిన వాటిగా.” “సృష్టించబడినవిగా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “కదిలించలేనివి” లేదా “కదల్చలేనివి” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: “మరొకసారి” అనే ఈ మాట
  rationale: నపుంసకలింగ ఆర్టికల్ ఉల్లేఖించిన పదబంధాన్నే సూచిస్తుంది. δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని తెలుగులో సహజమైన వాక్యనిర్మాణం మోస్తుంది; ἔτι ἅπαξ ను ముందు వచనంలోని ఉల్లేఖనానికి ప్రతిధ్వనిగా “మరొకసారి” అని ఇచ్చాం.
- source_word: δηλοῖ
  choice: సూచిస్తుంది
  rationale: ఉల్లేఖించిన మాటనుంచి రచయిత తీసే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῶν σαλευομένων
  choice: కదిలించబడుతున్నవి
  rationale: వర్తమాన కర్మణి కృదంతంలోని కొనసాగుతున్న లేదా లక్షణాత్మక భావాన్ని, అలాగే చివరి పదబంధంతో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: μετάθεσιν
  choice: తొలగింపు
  rationale: సందర్భంలో ఇది కేవలం మార్పు కాక, కదిలించబడే వాటిని తీసివేయడాన్ని సూచిస్తుంది.
- source_word: ὡς πεποιημένων
  choice: నిర్మించబడినవే గనుక
  rationale: పూర్త కర్మణి కృదంతం వాటిని చేయబడిన/నిర్మించబడిన వస్తువుల వర్గంగా చూపుతుంది. ὡς ఇక్కడ వాటి తొలగింపుకు కారణాత్మక వివరణను ఇస్తుందని ఈ సహజ తెలుగు నిర్మాణం తెలియజేస్తుంది; పదక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచాం.
- source_word: ἵνα μείνῃ
  choice: నిలిచి ఉండేలా
  rationale: ἵνα తో కూడిన ఉద్దేశం లేదా ఫలిత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ μὴ σαλευόμενα
  choice: కదిలించబడనివి
  rationale: గ్రీకులోని ‘కదిలించబడుతున్నవి’ / ‘కదిలించబడనివి’ అనే కృదంత విరుద్ధతను నిలుపుతుంది; ‘కదిలించలేనివి’ అని సామర్థ్య భావాన్ని ముందుగానే చేర్చదు.
theological_decisions:
- issue: τὰ μὴ σαλευόμενα ను అసామర్థ్య భావంతో అనువదించాలా, లేక రూపపరమైన నిషేధాన్ని నిలుపాలా
  choice: కదిలించబడనివి
  alternative: కదిలించలేనివి / కదల్చలేనివి
  rationale: మూలపాఠంలో అసామర్థ్యాన్ని తెలిపే ప్రత్యేక పదం కాక μή తో కూడిన కర్మణి కృదంతం ఉంది. అందువల్ల వెంటనే వచ్చే వచనంలోని ‘కదిలించలేని రాజ్యం’ భావంతో తొందరగా సమన్వయం చేయకుండా, ఈ వచనంలోని ఉద్వేగభరిత విరుద్ధతను కాపాడాం.
- issue: ὡς πεποιημένων యొక్క సంబంధం
  choice: నిర్మించబడినవే గనుక
  alternative: నిర్మించబడిన వాటిగా / సృష్టించబడిన వాటిగా
  rationale: ὡς తో కూడిన కృదంతం కదిలించబడే వాటిని ‘చేయబడినవి’గా వర్ణిస్తూ వాటి తొలగింపును వివరిస్తుంది. కారణాత్మక ఛాయ సందర్భానికి సరిపోతుంది; అయితే ‘వాటిగా’ అనే మరింత రూపసన్నిహిత పఠనాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండు కర్మణి కృదంతాల సమాంతరతను ‘కదిలించబడుతున్నవి / కదిలించబడనివి’గా నిలిపాం. ప్రధాన వాక్యం భారంగా కాకుండా ఉండేందుకు ఉద్దేశ/ఫలిత భాగాన్ని రెండవ వాక్యంగా ఇచ్చాం; ‘ఇది’ అనేది ముందటి తొలగింపు ప్రక్రియను సూచిస్తుంది.
