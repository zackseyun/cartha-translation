revisions:
- from: ఎందుకంటే, పాపులు తమకే విరోధంగా చూపిన ఇంతటి వ్యతిరేకతను సహించిన ఆయనను జాగ్రత్తగా ఆలోచించండి[a]. అప్పుడు మీరు మీ ప్రాణాల్లో సొమ్మసిల్లుతూ అలసిపోరు[b].
  to: ఎందుకంటే, పాపుల చేత తమకే వ్యతిరేకంగా జరిగిన అటువంటి విరోధాన్ని సహించిన ఆయనను జాగ్రత్తగా ఆలోచించండి[a]. అప్పుడు మీరు అలసిపోకుండా, మీ అంతరంగాల్లో కుంగిపోకుండా ఉంటారు[b].
  rationale: The revision retains the specified SBLGNT plural reflexive reading in the text and clearly reports the singular variant. It improves the Telugu syntax of the difficult phrase without resolving the textual ambiguity. It also corrects the syntax and sense of the final purpose clause, rendering weariness and inward discouragement as the two outcomes to be avoided.
