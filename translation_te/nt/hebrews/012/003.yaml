id: HEB.12.3
reference: Hebrews 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: te
  text: ఎందుకంటే, పాపుల చేత తమకే వ్యతిరేకంగా జరిగిన అటువంటి విరోధాన్ని సహించిన ఆయనను జాగ్రత్తగా ఆలోచించండి[a]. అప్పుడు మీరు అలసిపోకుండా, మీ అంతరంగాల్లో కుంగిపోకుండా ఉంటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “తనకే వ్యతిరేకంగా” అని ఉంది. SBLGNT పాఠ్యంలో “తమకే వ్యతిరేకంగా” అని ఉంది. సందర్భంలో ఈ వ్యతిరేకత యేసును లక్ష్యంగా చేసుకున్నదని అర్థమవుతుంది.
    reason: textual_variant
  - marker: b
    text: లేదా “మీ అంతరంగాల్లో సొమ్మసిల్లకుండా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: జాగ్రత్తగా ఆలోచించండి
  rationale: ఈ ఆజ్ఞ ఉద్దేశపూర్వకంగా, శ్రద్ధగా పరిశీలించి ఆలోచించడాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు సహజంగా ఉండేలా చేస్తూనే ఆజ్ఞాత్మక బలాన్ని నిలుపుతుంది.
- source_word: τοιαύτην
  choice: ఇంతటి
  rationale: వ్యతిరేకత స్వభావాన్ని లేదా తీవ్రతను నొక్కిచెబుతుంది; గ్రీకు పదం సూచించేదానికంటే భావాన్ని మరీ కుదించకుండా విస్తృతతను నిలుపుతుంది.
- source_word: ὑπομεμενηκότα
  choice: సహించిన
  rationale: ὑπομένω పదం కష్టాన్ని స్థిరంగా భరించడాన్ని సూచిస్తుంది. పరిపూర్ణ కాల భాగధాతువు తెలిపే గత సహనానికి కొనసాగుతున్న ప్రాముఖ్యతను సందర్భం ద్వారా గ్రహించవచ్చు.
- source_word: ἁμαρτωλῶν
  choice: పాపులు
  rationale: పాపస్వభావం కలవారిని సూచించే విశేషణనామాన్ని నేరుగా, ప్రామాణికంగా అనువదిస్తుంది.
- source_word: ἀντιλογίαν
  choice: వ్యతిరేకతను
  rationale: ఈ సందర్భంలో మాటలతో ఎదిరించడం, ప్రతిఘటించడం, విరోధం చూపడం అనే విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς ἑαυτοὺς
  choice: తమకే విరోధంగా
  rationale: SBLGNTలో ఉన్న బహువచన ఆత్మవాచక సర్వనామాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. సందర్భంలో కలిగే కఠినతను సవరించి తొలగించకుండా, ఏకవచన పాఠాంతరాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: κάμητε
  choice: అలసిపోరు
  rationale: శ్రమించి అలసిపోవడం అనే ప్రాథమిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: మీ ప్రాణాల్లో
  rationale: ψυχή అనే మూలపదంలోని మానవ అంతరంగ జీవితం లేదా స్వయం అనే భావాన్ని పూర్తిగా సామెతాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: ἐκλυόμενοι
  choice: సొమ్మసిల్లుతూ
  rationale: బలహీనపడి కుంగిపోవడం లేదా సొమ్మసిల్లడం అనే భావాన్ని ఇస్తూ, κάμητεతో కలిసి కనిపించే రెండు సంబంధిత చిత్రాలను వేరుగా ఉంచుతుంది.
theological_decisions:
- issue: ‘ఆయన’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: మునుపటి వచనంలో పేర్కొన్న యేసును సూచించే ‘ఆయన’ అనే రూపాన్ని ఉంచడం
  alternative: ఈ వచనంలో ‘యేసు’ అనే పేరును మళ్లీ చేర్చడం
  rationale: హెబ్రీయులు 12:2 తక్షణ సందర్భం ఈ వ్యక్తి యేసు అని స్పష్టం చేస్తుంది. మూలంలోని పరోక్ష సూచనను నిలుపుతూ అదనపు పేరును ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: εἰς ἑαυτούς అనే పాఠాంతరం
  choice: SBLGNT పాఠ్యాన్ని అనుసరించి ‘తమకే విరోధంగా’ అని ఇవ్వడం
  alternative: కొన్ని ప్రతుల ప్రకారం ‘ఆయనకే విరోధంగా’ అని ఇవ్వడం
  rationale: మూలంగా నిర్దేశించిన విమర్శాత్మక గ్రీకు పాఠ్యానికి ప్రాధాన్యమిస్తూ దాని నిజమైన కఠినతను నిలిపాం. సందర్భంలో వ్యతిరేకత యేసు ఎదుర్కొన్నదే అయినప్పటికీ, ఏకవచన పాఠాంతరాన్ని ప్రధాన పాఠ్యంలోకి మౌనంగా తీసుకురాకుండా పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘తమకే విరోధంగా’ అనే కొంత కఠినమైన నిర్మాణం SBLGNT పాఠ్యంలోని నిజమైన పాఠభేద ఉద్రిక్తతను కాపాడటానికి ఉద్దేశపూర్వకంగా నిలిపాం; వివరణను పాదసూచికకు పరిమితం చేశాం.
