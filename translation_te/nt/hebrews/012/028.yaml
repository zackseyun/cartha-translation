  to: కాబట్టి, కదిలించలేని రాజ్యాన్ని మనం పొందుతున్నాం గనుక, కృపను కలిగి ఉందాం[a]. ఆ కృప ద్వారా దేవునికి ఆమోదయోగ్యంగా భయభక్తులతో సేవ చేద్దాం.
