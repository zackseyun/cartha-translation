id: HEB.12.28
reference: Hebrews 12:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: te
  text: కాబట్టి, కదిలించలేని రాజ్యాన్ని మనం పొందుతున్నాం గనుక, కృపను కలిగి ఉందాం[a]. ఆ కృప ద్వారా దేవునికి ఆమోదయోగ్యంగా భయభక్తులతో సేవ చేద్దాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కృతజ్ఞులమై ఉందాం.” గ్రీకు పదబంధాన్ని “కృపను కలిగి ఉందాం” అని లేదా నానుడిగా “కృతజ్ఞులమై ఉందాం” అని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందటి వచనాల్లో కదిలించబడేవాటి తొలగింపు గురించి చెప్పిన వాదన నుండి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: βασιλείαν ἀσάλευτον
  choice: కదిలించలేని రాజ్యం
  rationale: సందర్భంలోని కదిలించబడే సృష్టితో ఉన్న వ్యత్యాసాన్ని నిలుపుతూ, ἀσάλευτον అనే పదంలోని ‘కదలని/కదిలించలేని’ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: παραλαμβάνοντες
  choice: మనం పొందుతున్నాం గనుక
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న స్వీకరణ భావాన్ని, తరువాతి ప్రోత్సాహానికి కారణంగా ఉన్న సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἔχωμεν χάριν
  choice: కృపను కలిగి ఉందాం
  rationale: χάρις అనే పదం ‘కృప’ లేదా ‘కృతజ్ఞత’ అనే రెండు భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠంలో ‘కృప’ను ఉంచడం వల్ల తరువాతి δι’ ἧςతో ఉన్న సాధనార్థక సంబంధం స్పష్టంగా నిలుస్తుంది; ప్రత్యామ్నాయ భావం పాదసూచికలో ఉంది.
- source_word: δι’ ἧς
  choice: ఆ కృప ద్వారా
  rationale: స్త్రీలింగ సంబంధ సర్వనామం χάρινను తిరిగి సూచిస్తుందనే అత్యంత సహజమైన వ్యాకరణ సంబంధాన్ని స్పష్టంగా చేసి, διά యొక్క సాధనార్థాన్ని నిలుపుతుంది.
- source_word: λατρεύωμεν
  choice: సేవ చేద్దాం
  rationale: దేవునికి అర్పించే ఆరాధనాత్మక సేవను సూచించే క్రియ యొక్క విస్తృత భావాన్ని నిలుపుతూ, ప్రథమ పురుష బహువచన ప్రోత్సాహక రూపాన్ని సహజంగా అందిస్తుంది.
- source_word: εὐαρέστως
  choice: ఆమోదయోగ్యంగా
  rationale: దేవునికి ఇష్టమైన లేదా అంగీకారమైన విధంగా సేవ చేయాలనే మూలపాఠ భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: భక్తిగౌరవంతోనూ భయంతోనూ
  rationale: εὐλάβεια లోని భక్తిపూర్వక జాగ్రత్త, గౌరవాన్ని మరియు δέος లోని భయభక్తి లేదా గంభీరమైన భయాన్ని వేర్వేరు పదాలతో నిలుపుతుంది; తరువాతి వచనంలోని దేవుని భయంకర పరిశుద్ధతతో సంబంధాన్నీ తగ్గించదు.
theological_decisions:
- issue: ἔχωμεν χάρινలో χάριν యొక్క అర్థం
  choice: కృపను కలిగి ఉందాం
  alternative: కృతజ్ఞులమై ఉందాం
  rationale: తరువాత వచ్చే δι’ ἧς (‘దాని ద్వారా’) అనే పదబంధం కృపను దేవునికి ఆమోదయోగ్యంగా సేవ చేయడానికి సాధనంగా సూచించడానికి సహజంగా సరిపోతుంది. అయితే ‘కృతజ్ఞత కలిగి ఉందాం/కృతజ్ఞులమై ఉందాం’ అనే నానుడి భావం కూడా ప్రాచీనమైన, వ్యాకరణపరంగా సాధ్యమైన పఠనం కాబట్టి దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖ యొక్క గంభీరమైన ప్రోత్సాహక ధోరణిని నిలుపుతూ అనువదించబడింది. ‘కృపను కలిగి ఉందాం’ కొంత అసాధారణంగా వినిపించినా, మూలంలోని నిజమైన అర్థసందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక కలిసి కాపాడుతాయి.
