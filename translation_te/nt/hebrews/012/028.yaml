  terminology: “కదిలించలేని రాజ్యం,” “కృప,” “దేవునికి ఆమోదయోగ్యంగా సేవ చేద్దాం,” and the footnoted alternative for ἔχωμεν χάριν are suitable. The main-text rendering preserves the grace/thankfulness ambiguity through the footnote without imposing an interpretation.
  issues:
