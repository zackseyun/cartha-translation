  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ σάλπιγγος ἤχῳ καὶ φωνῇ ῥημάτων, ἧς οἱ ἀκούσαντες παρῃτήσαντο ⸀μὴ προστεθῆναι αὐτοῖς λόγον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: te
  text: బూర ధ్వనికీ, మాటల స్వరానికీ మీరు రాలేదు; ఆ స్వరాన్ని విన్నవారు, ఇక తమతో ఒక్క మాట కూడా పలకవద్దని వేడుకున్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాన్ని విన్నవారు, ఇక తమతో మాట పలకకూడదని వేడుకున్నారు.” ఇక్కడ సాపేక్ష పదం ప్రత్యేకంగా ‘మాటల స్వరం’నే కాకుండా సీనాయి ప్రత్యక్షత మొత్తాన్ని విస్తృతంగా సూచిస్తుందని తీసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: దేవుని స్వరాన్ని ఇక నేరుగా వినకూడదని ఇశ్రాయేలీయులు చేసిన విన్నపం కోసం నిర్గమకాండము 20:18–19; ద్వితీయోపదేశకాండము 5:23–27 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: బాకా ధ్వనికి
  rationale: ἦχος యొక్క ‘ధ్వని’ భావాన్ని సహజమైన తెలుగులో నిలుపుతూ, సీనాయి సందర్భంలోని శ్రవ్య దృశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: φωνῇ ῥημάτων
  choice: మాటలు పలికే స్వరానికి
  rationale: అర్థరహిత శబ్దం కాకుండా స్పష్టమైన మాటలతో కూడిన స్వరం వినిపించిందనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకు పదబంధంలోని అసాధారణతను పూర్తిగా కఠినంగా అనుకరించదు.
- source_word: ἧς
  choice: ఆ స్వరాన్ని
  rationale: స్త్రీలింగ ఏకవచన సాపేక్ష సర్వనామానికి అతి సమీప పూర్వపదమైన φωνῇ (‘స్వరం’)ను ప్రధాన సూచనగా తీసుకుంటుంది; విస్తృత సూచన సాధ్యతను పాదసూచికలో ఉంచుతుంది.
- source_word: οἱ ἀκούσαντες
  choice: విన్నవారు
  rationale: గ్రీకు నామవాచకసమాన కృదంతాన్ని సంక్షిప్తంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: παρῃτήσαντο
  choice: వేడుకున్నారు
  rationale: ఇక దేవుని ప్రత్యక్ష స్వరం వినకూడదని ఇశ్రాయేలీయులు చేసిన గాఢమైన అభ్యర్థనను తెలియజేస్తుంది; ‘నిరాకరించారు’ కంటే సందర్భానికి తగినది.
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: ఇక తమతో ఏ మాటా పలకవద్దని
  rationale: προστεθῆναι లోని ‘ఇంకా/మరింతగా’ భావాన్ని ‘ఇక’తో, λόγον యొక్క ‘మాట’ భావాన్ని నిలుపుతూ, తెలుగులో సహజమైన అభ్యర్థనగా అందిస్తుంది.
theological_decisions:
- issue: ἧς అనే సాపేక్ష సర్వనామం దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో అది అతి సమీపంలోని ‘స్వరం’ను సూచించేలా అనువదించబడింది.
  alternative: అది బాకా ధ్వని, స్వరం సహా సీనాయి ప్రత్యక్షత మొత్తాన్ని విస్తృతంగా సూచించవచ్చు.
  rationale: స్త్రీలింగ ఏకవచనం మరియు సమీప పూర్వపదం φωνῇ ప్రధాన పఠనానికి మద్దతిస్తాయి; అయితే సందర్భం మొత్తం భయంకరమైన సీనాయి ప్రత్యక్షతను దృష్టిలో ఉంచే విస్తృత పఠనానికీ అవకాశం ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం 12:18లో ప్రారంభమైన ‘మీరు ... దగ్గరకు రాలేదు’ అనే వాక్య నిర్మాణంలో భాగం కాబట్టి, సందర్భ సంబంధాన్ని స్పష్టంచేయడానికి ‘వారు రాలేదు’ బదులు ‘మీరు రాలేదు’ కావాలి; సమర్పిత పాఠ్యంలో అనుకోకుండా ‘వారు’ వచ్చింది.
