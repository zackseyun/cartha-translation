id: HEB.12.1
reference: Hebrews 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: te
  text: కాబట్టి మనం కూడా, ఇంత గొప్ప సాక్షుల మేఘం మన చుట్టూ ఆవరించి ఉండగా, ప్రతి భారాన్నీ, మనల్ని ఎంతో సులభంగా చిక్కుల్లో పడేసే పాపాన్నీ[a] పక్కన పెట్టి, మన ముందుంచబడిన పరుగుపందెంలో సహనంతో పరుగెత్తుదాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గట్టిగా అంటుకునే పాపాన్ని’ లేదా ‘సులభంగా ఉచ్చులో పడేసే పాపాన్ని.’ ఈ గ్రీకు విశేషణం అరుదైనది; చిక్కించడం, ఉచ్చులో పడేయడం, లేదా గట్టిగా అంటుకోవడం అనే భావాల్లో దేనిని ప్రధానంగా సూచిస్తుందో స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: కాబట్టి
  rationale: మునుపటి వాదనను, ముఖ్యంగా 11వ అధ్యాయంలోని విశ్వాస ఉదాహరణలను, ఈ ప్రోత్సాహంతో అనుసంధానించే నిర్ధారణార్థక సంధానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: ఇంత గొప్ప సాక్షుల మేఘం
  rationale: అపారమైన సమూహాన్ని సూచించే ‘మేఘం’ అనే రూపకాన్నీ, τοσοῦτον యొక్క తీవ్రతనూ నిలుపుతుంది.
- source_word: περικείμενον ἡμῖν
  choice: మన చుట్టూ ఆవరించి ఉండగా
  rationale: అన్ని వైపులా ఉండటమనే ప్రాదేశిక చిత్రాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: μάρτυρων
  choice: సాక్షులు
  rationale: సాక్ష్యమిచ్చేవారు అనే మూలార్థాన్ని నిలుపుతుంది; వారిని కేవలం ప్రేక్షకులుగా మాత్రమే నిర్వచించదు.
- source_word: ὄγκον πάντα
  choice: ప్రతి భారాన్నీ
  rationale: పరుగెత్తేవారిని మందగింపజేసే బరువు లేదా ఆటంకం అనే క్రీడా రూపకాన్ని నిలుపుతుంది.
- source_word: ἀποθέμενοι
  choice: పక్కన పెట్టి
  rationale: ప్రధాన ప్రోత్సాహానికి ముందు లేదా దానితోపాటు జరిగే నిర్ణయాత్మక తొలగింపును ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: εὐπερίστατον
  choice: ఎంతో సులభంగా చిక్కుల్లో పడేసే
  rationale: అరుదైన ఈ విశేషణానికి చిక్కించేది, ఉచ్చులో పడేసేది, గట్టిగా అంటుకునేది వంటి భావాలు ఉండవచ్చు. పరుగుపందెం రూపకంలో ఆటంకపరిచే శక్తిని ఈ ఎంపిక స్పష్టంగా తెలియజేస్తుంది; అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: ἁμαρτίαν
  choice: పాపాన్ని
  rationale: గ్రీకు నిర్దిష్ట ఉపపదం పాపాన్ని ఒక నిర్దిష్టమైన వాస్తవిక శక్తి లేదా వర్గంగా చూపుతుంది; ఏ ఒక్క ప్రత్యేక పాపాన్ని పేరుపెట్టి నిర్ధారించదు.
- source_word: δι’ ὑπομονῆς
  choice: సహనంతో
  rationale: కష్టాల మధ్య స్థిరంగా కొనసాగడమనే ὑπομονή భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τρέχωμεν
  choice: పరుగెత్తుదాం
  rationale: ప్రథమ పురుష బహువచన ప్రోత్సాహక సబ్జంక్టివ్‌ను నేరుగా, సమూహ పిలుపుగా వ్యక్తం చేస్తుంది.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: మన ముందుంచబడిన పరుగుపందెంలో
  rationale: ἀγώνకు పోటీ, పోరాటం అనే అర్థాలున్నా, τρέχωμεν అనే పరుగెత్తే క్రియ వల్ల ఇక్కడ ‘పరుగుపందెం’ సందర్భోచితం; προκείμενον నియమించబడిన మార్గం మన ముందుందని సూచిస్తుంది.
theological_decisions:
- issue: హెబ్రీయులు 11తో సంబంధంలో ‘సాక్షులు’ అనే పదం భావం
  choice: విశ్వాసంతో సహించిన తమ జీవితాల ద్వారా సాక్ష్యమిచ్చేవారు; చుట్టూ ఆవరించిన దృశ్యం ప్రోత్సాహాన్ని బలపరుస్తుంది
  alternative: విశ్వాసుల పరుగును పరలోకం నుంచి చూస్తున్న ప్రేక్షకులే ప్రధానంగా ఉద్దేశించబడ్డారు
  rationale: తక్షణ సందర్భం 11వ అధ్యాయంలోని విశ్వాస ఆదర్శాలవైపు చూపుతుంది. ‘సాక్షులు’ అనే అనువాదం వారి సాక్ష్యాన్ని నిలుపుతూ, వారు చురుకుగా వీక్షిస్తున్నారని పాఠ్యంలో లేని నిర్ణయాన్ని చేర్చకుండా వ్యాఖ్యాన సంబంధమైన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సామూహిక ప్రోత్సాహ శైలి వాడబడింది. ‘మేఘం,’ ‘భారం,’ ‘పరుగుపందెం’ అనే పరస్పర సంబంధిత రూపకాలు నిలుపబడ్డాయి; వాక్యం సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా అమర్చబడింది.
