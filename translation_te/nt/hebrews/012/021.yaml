id: HEB.12.21
reference: Hebrews 12:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: te
  text: ఆ దృశ్యం[a] ఎంత భయంకరంగా ఉందంటే మోషే, “నేను ఎంతో భయపడి, వణుకుతున్నాను” అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కనిపించినది.” ఈ గ్రీకు పదబంధం సీనాయి వద్ద కంటికి కనిపించిన ప్రత్యక్షతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాటలు పాత నిబంధనలోని ఏ వాక్యానికీ యథాతథ ఉల్లేఖనం కావు; సీనాయి సంఘటనతో ముడిపడిన మోషే భయ స్పందనను ప్రతిబింబిస్తాయి. ద్వితీయోపదేశకాండము 9:19 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: καί, οὕτω
  choice: ఆ ... ఎంత ... అంటే
  rationale: ముందటి వర్ణనను కొనసాగిస్తూ, భయంకరత తీవ్రతను సహజమైన ఆధునిక తెలుగు ఫలిత నిర్మాణంలో తెలియజేస్తుంది.
- source_word: φοβερὸν
  choice: భయంకరంగా
  rationale: కనిపించిన దృశ్యం కలిగించిన తీవ్రమైన భయాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ φανταζόμενον
  choice: ఆ దృశ్యం
  rationale: సీనాయి వద్ద కంటికి కనిపించిన ప్రత్యక్షతను సూచిస్తుంది; ‘కనిపించినది’ కూడా సాధ్యమే గనుక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: Μωϋσῆς εἶπεν
  choice: మోషే ... అన్నాడు
  rationale: వ్యక్తినామానికి ప్రామాణిక తెలుగు రూపాన్ని, సాధారణ వాక్యక్రియను ఉపయోగిస్తుంది.
- source_word: Ἔκφοβός εἰμι καὶ ἔντρομος
  choice: నేను ఎంతో భయపడి వణుకుతున్నాను
  rationale: ἔκφοβος సూచించే తీవ్రమైన భయాన్నీ, ἔντρομος సూచించే వణుకునూ సహజమైన తెలుగులో రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: ఈ మాటలకు సీనాయి వృత్తాంతంతో ఉన్న సంబంధం
  choice: భయంకరమైన సీనాయి ప్రత్యక్షతకు మోషే స్పందనగా వాక్యాన్ని నేరుగా అనువదించడం
  alternative: ద్వితీయోపదేశకాండము 9:19 ఆధారంగా ఏర్పడిన స్వేచ్ఛా సారాంశమని ప్రధాన పాఠ్యంలో వివరించడం
  rationale: గ్రీకు పాఠ్యం మోషే ఈ మాట అన్నాడని నేరుగా చెబుతుంది; పాత నిబంధనలోని ఖచ్చితమైన మూలానికి సంబంధించిన ఉద్రిక్తతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా పాదటిప్పణిలో సూచించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, వాక్య గంభీరతను నిలుపుకునే విధంగానూ రూపొందించబడింది. రెండు గ్రీకు భావాలైన తీవ్రమైన భయం మరియు వణుకును కలిపి సహజంగా వ్యక్తం చేసింది.
