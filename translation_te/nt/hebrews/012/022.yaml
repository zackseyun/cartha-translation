source:
  edition: SBLGNT
  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: te
  text: కాని మీరు సీయోను పర్వతానికీ, సజీవుడైన దేవుని నగరమైన పరలోక యెరూషలేముకూ, ఆనందోత్సవ సభలో ఉన్న అసంఖ్యాక దేవదూతల[a] దగ్గరకూ వచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అసంఖ్యాక’కు మూలంలోని పదం అక్షరార్థంగా ‘పదివేలలు’ అని, విస్తృతార్థంలో లెక్కలేనంత గొప్ప సమూహం అని అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: ‘అసంఖ్యాక దేవదూతల దగ్గరకూ, ఆనందోత్సవ సభ దగ్గరకూ వచ్చారు.’ గ్రీకు వాక్యనిర్మాణంలో ‘ఆనందోత్సవ సభ’ అనేది దేవదూతలను వర్ణించవచ్చు లేదా జాబితాలో ప్రత్యేక అంశంగా ఉండవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: కాని
  rationale: ముందటి వచనాల్లోని సీనాయి అనుభవానికి బలమైన వ్యతిరేకతను సహజమైన తెలుగు అనుసంధాన పదంతో చూపిస్తుంది.
- source_word: προσεληλύθατε
  choice: మీరు ... దగ్గరకు వచ్చారు
  rationale: పరిపూర్ణ కాలం సూచించే—ఇప్పటికీ కొనసాగుతున్న ఫలితంతో కూడిన—చేరికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Σιὼν ὄρει
  choice: సీయోను పర్వతానికి
  rationale: స్థలనామాన్నీ పర్వత రూపకాన్నీ నేరుగా నిలుపుతుంది.
- source_word: πόλει θεοῦ ζῶντος
  choice: సజీవుడైన దేవుని నగరానికి
  rationale: θεοῦ లోని సంబంధార్థాన్నీ ζῶντος అనే ప్రాముఖ్యమైన విశేషణాన్నీ కాపాడుతుంది.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: పరలోక యెరూషలేము
  rationale: ముందున్న ‘సజీవుడైన దేవుని నగరం’ అనే పదబంధానికి వివరణాత్మక సమానాధికరణంగా సహజంగా నిలుస్తుంది.
- source_word: μυριάσιν ἀγγέλων
  choice: అసంఖ్యాక దేవదూతలు
  rationale: μυριάς అక్షరార్థంగా పదివేల సంఖ్యను సూచించగలిగినా, ఇక్కడ అపారమైన సమూహమనే సాధారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; సంఖ్యాపరమైన పరిధిని పాదసూచనలో నిలిపింది.
- source_word: πανηγύρει
  choice: పండుగ సమూహంగా కూడిన
  rationale: ఆనందోత్సవంతో కూడిన బహిరంగ సమావేశ భావాన్ని తెలియజేస్తూ, ప్రధాన పఠనంలో దీన్ని దేవదూతల సమూహంతో అనుసంధానిస్తుంది.
theological_decisions:
- issue: πανηγύρει యొక్క వాక్యనిర్మాణ సంబంధం
  choice: దీన్ని దేవదూతలతో అనుసంధానించి, ‘పండుగ సమూహంగా కూడిన ... దేవదూతలు’ అని అనువదించడం
  alternative: దీన్ని జాబితాలో మరో ప్రత్యేక అంశంగా తీసుకొని, ‘అసంఖ్యాక దేవదూతల దగ్గరకూ, పండుగ సమూహం దగ్గరకూ’ అని అనువదించడం
  rationale: గ్రీకు విభక్తి క్రమం రెండింటికీ అవకాశం ఇస్తుంది. సమీపంలోని ‘దేవదూతలు’తో అనుసంధానించడం సుసంబద్ధమైన ప్రధాన పఠనం; అయితే నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదసూచనలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘పరలోక యెరూషలేము’ అనే స్థిరమైన బైబిలు పదబంధాన్ని నిలిపి, అధిక ప్రాచీన లేదా సంఘవర్గ ప్రత్యేక పదజాలాన్ని నివారించాం.
