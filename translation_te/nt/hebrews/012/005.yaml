    “నా కుమారుడా,[a] ప్రభువు ఇచ్చే శిక్షణను[b][c] చులకనగా చూడకు;

    ఆయన నిన్ను మందలించినప్పుడు నిరుత్సాహపడకు.”'
  to: 'కుమారులుగా మిమ్మల్ని ఉద్దేశించి పలికే హితబోధను మీరు మరచిపోయారు:


    “నా కుమారుడా,[a] ప్రభువు క్రమశిక్షణను[b][c] తేలికగా తీసుకోకు;


    ఆయన నిన్ను మందలించినప్పుడు నిరుత్సాహపడకు.”'
  rationale: The revision corrects the potentially gender-restrictive syntax of the audience address while retaining the source's explicit son-language. It also removes an added semantic qualifier from παράκλησις and adopts ‘క్రమశిక్షణ’ for παιδεία, with a footnote preserving its full formative range. Footnote markers remain present and correctly anchored.
