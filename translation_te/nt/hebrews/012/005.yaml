id: HEB.12.5
reference: Hebrews 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: te
  text: 'కుమారులుగా మిమ్మల్ని ఉద్దేశించి పలికే హితబోధను మీరు మరచిపోయారు:


    “నా కుమారుడా,[a] ప్రభువు క్రమశిక్షణను[b][c] తేలికగా తీసుకోకు;


    ఆయన నిన్ను మందలించినప్పుడు నిరుత్సాహపడకు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా బిడ్డా’ అని కూడా అనవచ్చు. గ్రీకులో అక్షరార్థంగా ‘నా కుమారుడా’ అని ఉంది; ఇది సామెతల గ్రంథంలోని మాటలను, ఈ భాగంలోని ప్రతినిధి కుమారత్వ భాషను ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘క్రమశిక్షణ’ అనేది బోధన, శిక్షణ, దిద్దుబాటు అనే భావాలను కూడా కలిగి ఉంది; ఇది కేవలం దండనను మాత్రమే సూచించదు.
    reason: lexical_alternative
  - marker: c
    text: ఇది సామెతలు 3:11 నుండి తీసుకున్న ఉల్లేఖనం.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: మీరు మరచిపోయారు
  rationale: పరిపూర్ణ కాలరూపం గతంలో మరచిపోవడం వల్ల ఏర్పడిన ప్రస్తుత స్థితిని సూచిస్తుంది; తెలుగు సహజ ప్రయోగంలో ‘మరచిపోయారు’ ఆ మందలింపు భావాన్ని నిలుపుతుంది.
- source_word: παρακλήσεως
  choice: ప్రోత్సాహకరమైన ఉపదేశాన్ని
  rationale: παράκλησιςలో ప్రోత్సాహం, ఆదరణ, హితబోధ అనే భావాలు ఉన్నాయి. సామెతలలోని హెచ్చరికను పరిచయం చేస్తున్నందున ‘ఉపదేశం’ ప్రధాన భావాన్ని ఇస్తుంది; ‘ప్రోత్సాహకరమైన’ అనే విశేషణం దాని ఆదరణాత్మక కోణాన్ని కూడా నిలుపుతుంది.
- source_word: ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται
  choice: కుమారులైన మిమ్మల్ని ఉద్దేశించి పలికే
  rationale: διαλέγεται ఇక్కడ లేఖనం పాఠకులతో నేరుగా మాట్లాడుతున్న భావాన్ని ఇస్తుంది. ‘ఉద్దేశించి పలికే’ అనేది ఆ వ్యక్తిగత సంబోధనను సహజ తెలుగులో వ్యక్తపరుస్తుంది; υἱοῖςలోని కుమారత్వ భాషను నిలుపుతుంది.
- source_word: Υἱέ μου
  choice: నా కుమారుడా
  rationale: ఏకవచన సంబోధనను, సామెతలు 3:11తో ఉన్న పదబంధ సంబంధాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ὀλιγώρει
  choice: చులకనగా చూడకు
  rationale: ఈ క్రియ దేనినైనా అల్పమైనదిగా ఎంచడం లేదా లెక్కచేయకపోవడం అనే భావాన్ని ఇస్తుంది. ‘చులకనగా చూడకు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ‘ద్వేషించకు’ అనే అతిశయ భావాన్ని రానివ్వదు.
- source_word: παιδείας
  choice: శిక్షణను
  rationale: παιδείαలో బోధన, వ్యక్తిత్వ నిర్మాణం, దిద్దుబాటు, అవసరమైన మందలింపు అన్నీ చేరవచ్చు. ‘శిక్షణ’ దానిని కేవలం శిక్షగా పరిమితం చేయకుండా విస్తృతమైన తల్లిదండ్రి-సంబంధిత నిర్మాణాత్మక భావాన్ని నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు ఇచ్చే
  rationale: మూలంలోని సంబంధార్థక షష్ఠీని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, ఆ శిక్షణకు ప్రభువే మూలమని తెలియజేస్తుంది.
- source_word: ἐκλύου
  choice: నిరుత్సాహపడకు
  rationale: ఈ సందర్భంలో క్రియ మందలింపు కింద అంతరంగంగా కుంగిపోవడం లేదా ధైర్యం కోల్పోవడం అనే భావాన్ని ఇస్తుంది; ‘నిరుత్సాహపడకు’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: ἐλεγχόμενος
  choice: ఆయన నిన్ను మందలించినప్పుడు
  rationale: ἐλέγχω తప్పును బయల్పరచి గద్దించడం లేదా సరిదిద్దడం అనే భావాలను కలిగి ఉంది. ‘మందలించినప్పుడు’ తల్లిదండ్రి శిక్షణ సందర్భానికి సరిపోతూ, కేవలం శిక్ష విధించడం అనే భావానికి పరిమితం కాదు.
theological_decisions:
- issue: ఉపదేశంలోని కుమారత్వ భాష
  choice: ప్రధాన పాఠ్యంలో ‘కుమారులైన’ మరియు ‘నా కుమారుడా’ అని ఉంచడం
  alternative: ‘పిల్లలైన’ మరియు ‘నా బిడ్డా’
  rationale: గ్రీకు పాఠ్యం ఉద్దేశపూర్వకంగా కుమారత్వ భాషను వాడుతుంది; ఇది సామెతల ఉల్లేఖనంతోను హెబ్రీయుల పత్రికలోని పరిసర వాదనతోను ముడిపడి ఉంది. ప్రధాన పాఠ్యం ఆ రూపాన్ని నిలుపుతుంది; పాదసూచిక దాని ప్రతినిధి, సమగ్ర వర్తింపును వివరిస్తుంది.
- issue: దేవుని παιδεία స్వభావం
  choice: ‘శిక్షణ’
  alternative: ‘శిక్ష’, ‘క్రమశిక్షణ’, ‘దిద్దుబాటు’
  rationale: ఈ పదంలో నిర్మాణాత్మక శిక్షణతో పాటు తప్పును సరిదిద్దే మందలింపు కూడా ఉంది. ‘శిక్షణ’ దానిని కేవలం దండనగా గానీ, కేవలం సమాచార బోధనగా గానీ పరిమితం చేయకుండా ఆ భావ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. కవితా ఉల్లేఖనాన్ని ప్రత్యేక పంక్తుల్లో ఉంచి, ‘కుమారుడు’ అనే మూలపాఠ్య రూపాన్ని నిలుపుతూ పాదసూచికలో దాని విస్తృత వర్తింపును వివరించాం. ‘శిక్షణ’ మరియు ‘మందలింపు’ ద్వారా నిర్మాణాత్మక బోధన–దిద్దుబాటు మధ్యనున్న మూలపాఠ్య భావ ఉద్వేగం కాపాడబడింది.
