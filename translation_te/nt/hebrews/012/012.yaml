  source_fidelity: Διὸ is accurately rendered by “కాబట్టి,” and the plural imperative ἀνορθώσατε is correctly conveyed as an exhortation. “వాలిపోయిన చేతులను” faithfully retains the image of hands hanging slack, and “బలహీనపడిన మోకాళ్లను” appropriately conveys παραλελυμένα without importing an unnecessarily clinical sense of paralysis. “బలపరచండి” is somewhat interpretive relative to the more concrete ‘raise/straighten,’ but it is supported by the exhortational context and is transparently documented in the footnote.
  naturalness: The Telugu is clear, idiomatic, and suitably dignified in modern standard Telugu. The paired accusative expressions and respectful plural imperative read naturally.
