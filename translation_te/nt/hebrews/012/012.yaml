  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὸ τὰς παρειμένας χεῖρας καὶ τὰ παραλελυμένα γόνατα ἀνορθώσατε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: te
  text: కాబట్టి, వాలిపోయిన చేతులను, బలహీనపడిన మోకాళ్లను బలపరచండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత అక్షరార్థంగా, “వేలాడుతున్న చేతులను, బలహీనపడిన మోకాళ్లను పైకెత్తండి.” ఈ మాటలు గ్రీకు సంప్రదాయంలోని యెషయా 35:3ను ప్రతిధ్వనిస్తూ, తిరిగి ధైర్యం పొంది సహనంతో కొనసాగడాన్ని శరీర అవయవాల రూపకంతో వ్యక్తం చేస్తాయి.
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: కాబట్టి
  rationale: ముందటి వచనాల్లోని శిక్షణ, సహనం గురించిన వివరణ నుంచి ఈ ప్రోత్సాహక ఆజ్ఞకు వచ్చే తార్కిక ముగింపును సహజంగా తెలియజేస్తుంది.
- source_word: παρειμένας χεῖρας
  choice: వాలిపోయిన చేతులను
  rationale: παρίημι రూపం సడలిపోయి కిందికి వేలాడే స్థితిని సూచిస్తుంది. ‘వాలిపోయిన చేతులు’ అనే మాట శారీరక చిత్రాన్ని, నిరుత్సాహ భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: παραλελυμένα γόνατα
  choice: బలహీనపడిన మోకాళ్లను
  rationale: పరిపూర్ణ కృదంత రూపం బలహీన స్థితికి చేరిన మోకాళ్లను సూచిస్తుంది. ‘పక్షవాతం వచ్చిన’ అనే వైద్యార్థాన్ని అనవసరంగా రానివ్వకుండా, అలసట మరియు శక్తిహీనత చిత్రాన్ని కాపాడుతుంది.
- source_word: ἀνορθώσατε
  choice: బలపరచండి
  rationale: ఈ ఆజ్ఞ నిర్ణయాత్మక చర్యను కోరుతుంది. మూలపదానికి ‘నిటారుగా చేయండి/పైకెత్తండి’ అనే ప్రత్యక్ష భావం ఉన్నప్పటికీ, సందర్భంలో సహనానికి తిరిగి శక్తి పొందే ఉద్దేశాన్ని ‘బలపరచండి’ సహజంగా వ్యక్తం చేస్తుంది; శరీర అవయవాల రూపకం కొనసాగుతుంది.
theological_decisions:
- issue: శారీరక బలహీనత రూపకాన్ని ఎలా అనువదించాలి
  choice: చేతులు, మోకాళ్ల శారీరక చిత్రాన్ని నిలుపుతూ, ఆజ్ఞను ‘బలపరచండి’ అని ఇవ్వడం
  alternative: ‘వేలాడుతున్న చేతులను, బలహీనపడిన మోకాళ్లను పైకెత్తండి’ అని మరింత రూపపరంగా అనువదించడం
  rationale: హెబ్రీయులు 12 సందర్భం సహనం, దేవుని శిక్షణ, ముందుకు సాగడం గురించి ఉంది. యెషయా 35:3 ప్రతిధ్వనించే ఈ శారీరక రూపకం నిరుత్సాహం నుంచి నూతన ధైర్యానికి పిలుపునిస్తుంది. అనువాదం రూపకాన్ని తొలగించకుండా దాని సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. ‘వాలిపోయిన’ మరియు ‘బలహీనపడిన’ అనే పదాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండి మూలంలోని శారీరక రూపకాన్ని కాపాడుతాయి.
