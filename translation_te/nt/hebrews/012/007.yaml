id: HEB.12.7
reference: Hebrews 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: te
  text: శిక్షణ కోసం సహించండి[a]. దేవుడు కుమారులతో వ్యవహరించినట్లే మీతో వ్యవహరిస్తున్నాడు[b]. ఎందుకంటే, తండ్రి శిక్షణ ఇవ్వని కుమారుడు ఎవడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దీనిని శిక్షణగా భావించి సహించండి.” గ్రీకు వాక్యాన్ని శిక్షణ పొందడం కోసం సహించమనే ప్రబోధంగానూ, సహిస్తున్నదాన్ని శిక్షణగా పరిగణించమనే ప్రబోధంగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో “కుమారులు.” ఇక్కడి వాదన తండ్రి–కుమారుల పోలికను ఉపయోగిస్తుంది; దీని అన్వయం మగవారికే పరిమితం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: శిక్షణ కోసం
  rationale: εἰς ను ఇక్కడ ఉద్దేశం లేదా ఫలితాన్ని సూచించేదిగా గ్రహించి, παιδεία లోని తండ్రి ఇచ్చే రూపుదిద్దే మరియు సరిదిద్దే శిక్షణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ‘శిక్షణగా’ అనే అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: ὑπομένετε
  choice: సహించండి
  rationale: ఈ రూపం సూచనార్థకంగానూ ఆజ్ఞార్థకంగానూ ఉండగలిగినా, సందర్భంలో ప్రబోధాత్మక ఆజ్ఞగా సహజంగా పనిచేస్తుంది. గ్రీకులో లేని కర్మను తెలుగులో చేర్చలేదు.
- source_word: ὡς υἱοῖς
  choice: మిమ్మల్ని కుమారులుగా చూసి
  rationale: దేవుడు తండ్రిలా వారితో వ్యవహరిస్తున్నాడనే పోలికను సహజమైన తెలుగులో తెలియజేస్తూ, మూలంలోని తండ్రి–కుమారుల రూపకాన్ని నిలుపుతుంది.
- source_word: προσφέρεται
  choice: మీతో వ్యవహరిస్తున్నాడు
  rationale: ఈ సందర్భంలో క్రియకు ‘మీ పట్ల ఒక విధంగా నడుచుకుంటున్నాడు/వ్యవహరిస్తున్నాడు’ అనే సంబంధాత్మక భావం ఉంది; ‘సమర్పించబడుతున్నాడు’ వంటి పదశః అనువాదం తప్పుదారి పట్టిస్తుంది.
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: ఎందుకంటే, తండ్రి శిక్షణ ఇవ్వని కుమారుడు ఎవడు?
  rationale: మూలంలోని అలంకారిక ప్రశ్నను, సాధారణ తండ్రి–కుమారుని సంబంధాన్ని, అలాగే παιδεία/παιδεύει మధ్యనున్న పదసంబంధాన్ని ‘శిక్షణ’తో నిలుపుతుంది. గ్రీకులో స్పష్టంగా లేని ‘అతని తండ్రి’ని చేర్చలేదు.
theological_decisions:
- issue: తండ్రి–కుమారుల పోలికలో లింగసూచక కుటుంబ భాష
  choice: ప్రధాన పాఠంలో ‘కుమారులు/కుమారుడు’ను నిలుపడం
  alternative: ‘పిల్లలు/బిడ్డ’ అని లింగతటస్థంగా అనువదించడం
  rationale: వాక్యంలోని వాదన తండ్రి–కుమారుల పోలికపై నిర్మించబడింది; అందువల్ల మూలంలోని υἱός పదాన్ని నిలిపాం. అయితే ఈ బోధ మగవారికే పరిమితం కాదని పాదటిప్పణి స్పష్టం చేస్తుంది.
- issue: εἰς παιδείαν ὑπομένετε లోని వ్యాకరణార్థ అనిశ్చితి
  choice: ‘శిక్షణ కోసం సహించండి’ అనే ఉద్దేశార్థక పఠనం
  alternative: ‘దీనిని శిక్షణగా భావించి సహించండి’ అనే పఠనం
  rationale: εἰς ను ఉద్దేశం/ఫలితంగా గ్రహించడం సాధ్యమే; అయితే సహించబడుతున్నదాన్ని శిక్షణగా పరిగణించాలనే పఠనం కూడా గ్రీకులో సాధ్యమైనందున దానిని తొలగించకుండా పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘శిక్షణ’ అనే పదాన్ని నామవాచక, క్రియాత్మక స్థానాల్లో కొనసాగించి παιδεία/παιδεύει పదసంబంధాన్ని కాపాడాం; ‘క్రమశిక్షణ’ అనేది ప్రధానంగా నియమపాలన భావాన్ని ఇవ్వగలదని దాన్ని నివారించాం.
