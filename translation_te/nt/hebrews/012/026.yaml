source:
  edition: SBLGNT
  text: οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε, νῦν δὲ ἐπήγγελται λέγων· Ἔτι ἅπαξ ἐγὼ ⸀σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: te
  text: 'ఆయన స్వరం అప్పుడు భూమిని కదిలించింది; అయితే ఇప్పుడు ఆయన ఇలా వాగ్దానం చేశాడు: “ఇంకా ఒకసారి నేను భూమిని మాత్రమే కాక, ఆకాశాన్ని[a] కూడా కదిలిస్తాను.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకాన్ని.’ గ్రీకులో ఈ పదం నిర్దిష్ట రూపంతో ఏకవచనంలో ఉంది; అక్షరార్థంగా, ‘ఆ ఆకాశాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: హగ్గయి 2:6 నుండి ఉల్లేఖనం.
    reason: cross_reference
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: ఆయన స్వరం
  rationale: సంబంధవాచక సర్వనామం ముందటి సందర్భంలోని దేవుణ్ణి సూచిస్తుంది. తెలుగులో సహజమైన స్వామ్య నిర్మాణం ద్వారా ‘ఆయన స్వరం’ అని ఇచ్చి ఆ అనుసంధానాన్ని నిలిపాం.
- source_word: ἐσάλευσεν
  choice: కంపింపజేసింది
  rationale: భూమిని కదిలించిన దైవస్వర ప్రభావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὴν γῆν
  choice: భూమిని
  rationale: ఆకాశంతో ఉన్న వ్యత్యాసం వల్ల ఇది స్థానిక భూభాగం కాక విస్తృతమైన భూమిని సూచిస్తుంది.
- source_word: τότε ... νῦν δὲ
  choice: అప్పుడు ... అయితే ఇప్పుడు
  rationale: గతంలో జరిగిన కంపనానికి, ఇప్పుడు చెల్లుబాటులో ఉన్న వాగ్దానానికి మధ్యనున్న కాలపరమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐπήγγελται
  choice: వాగ్దానం చేశాడు
  rationale: పరిపూర్ణ కాలరూపం గతంలో చేసిన వాగ్దానం ఇప్పటికీ చెల్లుబాటులో ఉందనే భావాన్ని కలిగిస్తుంది.
- source_word: Ἔτι ἅπαξ
  choice: ఇంకొకసారి
  rationale: మరొకసారి జరగబోయే చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ మూలంలోని కాలపరమైన ఉద్ఘాటనను కాపాడుతుంది.
- source_word: σείσω
  choice: కంపింపజేస్తాను
  rationale: భవిష్యద్వాణి ఉల్లేఖనంలోని విశ్వవ్యాప్త కదలికను బలంగా తెలియజేస్తుంది; ముందటి క్రియతో పదబంధ అనుసరణను కూడా నిలుపుతుంది.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: మాత్రమే కాక ... కూడా
  rationale: మూలంలోని సహసంబంధ వ్యత్యాసాన్ని సహజమైన తెలుగు నిర్మాణంలో ప్రతిబింబిస్తుంది.
- source_word: τὸν οὐρανόν
  choice: ఆకాశాన్ని
  rationale: ఏకవచన రూపాన్ని నిలుపుతూ భూమి–ఆకాశం అనే సమగ్ర సృష్టి జంటను సహజంగా వ్యక్తం చేస్తుంది; ‘పరలోకం’ అనే భావసంభావ్యతను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: సంబంధవాచక సర్వనామం మరియు వాగ్దానం చేసే వ్యక్తి ఎవరనే విషయం
  choice: భూమిని కంపింపజేసిన స్వరం దేవునిదే; ఇప్పుడు వాగ్దానం చేసేవాడూ ఆయనే అని వ్యక్తిగత సర్వనామంతో చూపడం
  alternative: దైవిక కర్తను అస్పష్టంగా ఉంచే అవ్యక్త నిర్మాణం
  rationale: ముందటి సందర్భం మరియు హగ్గయి ఉల్లేఖనం దేవుణ్ణే వక్తగా సూచిస్తున్నాయి; అదనపు సిద్ధాంత వివరణను చేర్చకుండా ఈ అనుసంధానాన్ని స్పష్టంగా ఉంచాం.
- issue: భూమి–ఆకాశం భాష యొక్క పరిధి
  choice: విస్తృతమైన సృష్టి సంబంధ భావంలో ‘భూమి’ మరియు ‘ఆకాశం’
  alternative: స్థానిక భావంలో ‘దేశం’ మరియు ‘ఆకాశమండలం,’ లేదా ప్రత్యేక ఆధ్యాత్మిక భావంలో ‘పరలోకం’
  rationale: మూలంలోని జంట సమగ్ర విశ్వవ్యాప్త కదలికను సూచిస్తుంది. సంఘటన ఎలా జరుగుతుందో అదనంగా నిర్దేశించకుండా ఆ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘కంపింపజేసింది/కంపింపజేస్తాను’ అనే సమాంతర రూపాలు గత సంఘటనకూ రాబోయే వాగ్దానానికీ మధ్య ఉన్న అనుసంధానాన్ని స్పష్టంగా ఉంచుతాయి.
