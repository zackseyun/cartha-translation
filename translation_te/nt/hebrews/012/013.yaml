id: HEB.12.13
reference: Hebrews 12:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: te
  text: మీ పాదాలకు తిన్నని దారులు చేయండి[a], తద్వారా కుంటిగా ఉన్నది దారి తప్పిపోకుండా[b], బదులుగా స్వస్థత పొందేలా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తిన్నని దారులు’ అనే మాట సామెతలు 4:26ను ప్రతిధ్వనింపజేస్తూ, ఈ భాగంలోని క్రమశిక్షణతో నడిచే జీవన చిత్రణను కొనసాగిస్తుంది.
    reason: cross_reference
  - marker: b
    text: లేదా ‘కీలు తప్పిపోకుండా.’ శరీర రూపకంలో ఈ గ్రీకు క్రియకు వైద్యపరమైన భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: దారులు
  rationale: ఈ పదానికి చక్రపు జాడలు లేదా నడిచే బాటలు అనే భావం ఉన్నా, ఇక్కడ జీవన నడతను సూచించే రూపకానికి సహజమైన ఆధునిక తెలుగు పదం ‘దారులు’.
- source_word: ὀρθὰς
  choice: తిన్నని
  rationale: దారి వంకర లేకుండా సరిగా ఉండాలనే భావాన్ని తెలియజేస్తుంది; సామెతలు 4:26 ప్రతిధ్వనించే నడక రూపకాన్ని నిలుపుతుంది.
- source_word: ποιεῖτε
  choice: చేసుకోండి
  rationale: వర్తమాన ఆజ్ఞార్థక క్రియలోని కొనసాగుతున్న బాధ్యతను సహజ తెలుగులో తెలియజేస్తుంది. ‘మీ పాదాల కోసం’ అనే ప్రయోజనార్థక భావంతో ‘చేసుకోండి’ సరిపోతుంది.
- source_word: τοῖς ποσὶν ὑμῶν
  choice: మీ పాదాల కోసం
  rationale: దత్తి విభక్తిని ప్రయోజనార్థకంగా తీసుకొని, దారులు పాదాల కోసం చేయబడాలనే గ్రీకు నిర్మాణాన్ని నిలుపుతుంది.
- source_word: τὸ χωλὸν
  choice: కుంటిగా ఉన్నది
  rationale: నపుంసక ఏకవచన విశేషణం నామవాచకంగా వాడబడింది. తెలుగు అనువాదం దాని నిర్దిష్టీకరించని రూపాన్ని, శారీరక లేదా రూపకాలంకార బలహీనత మధ్య ఉన్న సందిగ్ధతను కాపాడుతుంది.
- source_word: ἐκτραπῇ
  choice: దారి తప్పిపోకుండా
  rationale: ప్రధానంగా ‘పక్కకు మళ్లిపోవడం’ అనే అర్థాన్ని సహజ తెలుగులో ఇస్తుంది; శరీర రూపకంలో సాధ్యమైన ‘కీలు తప్పడం’ అనే వైద్య భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἰαθῇ
  choice: స్వస్థపడుతుంది
  rationale: ἰάομαι యొక్క ‘స్వస్థపరచబడటం’ అనే భావాన్ని, శరీర సంబంధ రూపకాన్ని నిలుపుతూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μᾶλλον
  choice: బదులుగా
  rationale: ముందున్న ప్రతికూల ఫలితానికి విరుద్ధమైన ఆశించిన ఫలితాన్ని స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: శరీర సంబంధ చిత్రణను అక్షరార్థంగా తీసుకోవాలా, రూపకాలంకారంగా తీసుకోవాలా
  choice: ‘కుంటిగా ఉన్నది’, ‘స్వస్థపడుతుంది’ అనే శరీర సంబంధ భాషను ఉంచి, అది శారీరక బలహీనతనో ఆత్మీయ బలహీనతనో స్పష్టంగా నిర్ణయించలేదు.
  alternative: ‘కుంటిగా ఉన్నది’ అంటే బలహీన విశ్వాసులు అని స్పష్టంగా వ్యాఖ్యానించడం.
  rationale: గ్రీకు వాక్యం హితబోధ సందర్భంలో శరీర చిత్రణను వాడుతుంది; దాని ఉద్దేశాన్ని సంకుచితమైన సిద్ధాంతార్థంగా నిర్ణయించకుండా అసలు వాక్యంలోని అర్థ ఉద్రిక్తతను నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన హితబోధ శైలిని వాడాం. గ్రీకు వాక్యంలోని నడక, కుంటితనం, స్వస్థత రూపకాలను అలాగే నిలిపాం.
