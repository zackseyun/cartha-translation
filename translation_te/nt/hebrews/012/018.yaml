id: HEB.12.18
reference: Hebrews 12:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: te
  text: ఎందుకంటే మీరు స్పృశించదగిన దాని దగ్గరకూ[a], మండుతున్న అగ్ని దగ్గరకూ, దట్టమైన చీకటి దగ్గరకూ, గాఢాంధకారం దగ్గరకూ, తుఫాను దగ్గరకూ రాలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్పృశించదగిన కొండ దగ్గరకు.’ చుట్టుపక్కల సందర్భం సీనాయి కొండను సూచిస్తుంది; అయితే ఈ వచనంలోని గ్రీకు పాఠ్యంలో ‘కొండ’ అనే పదం స్పష్టంగా లేదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘మీరు స్పృశించదగిన దాని దగ్గరకు, మండుతున్న అగ్ని దగ్గరకు, దట్టమైన చీకటి దగ్గరకు, గాఢాంధకారం దగ్గరకు, తుఫాను దగ్గరకు రాలేదు.’
    reason: previous_rendering
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: ఎందుకంటే ... రాలేదు
  rationale: γάρ మునుపటి వాదనకు వివరణాత్మక అనుసంధానాన్ని ఇస్తుంది; Οὐ క్రియను నిషేధిస్తుంది.
- source_word: προσεληλύθατε
  choice: మీరు ... దగ్గరకు రాలేదు
  rationale: పరిపూర్ణ కాలం సమీపించిన చర్య ఫలితంగా ఏర్పడిన ప్రస్తుత స్థితిని సూచిస్తుంది. తెలుగులో ‘దగ్గరకు రాలేదు’ సమీపించడం అనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ψηλαφωμένῳ
  choice: తాకగలిగినదాని దగ్గరకు
  rationale: ఈ రూపం తాకదగిన లేదా స్పృశించగల వాస్తవాన్ని సూచిస్తుంది. గ్రీకులో ‘కొండ’ అనే నామవాచకం స్పష్టంగా లేదు కాబట్టి ప్రధాన పాఠ్యంలో దాన్ని చేర్చలేదు.
- source_word: κεκαυμένῳ πυρί
  choice: మండుతున్న అగ్ని దగ్గరకు
  rationale: పరిపూర్ణ కృదంతం అగ్ని మండే స్థితిలో ఉన్నదని తెలియజేస్తుంది; ‘మండుతున్న అగ్ని’ సహజమైన, స్పష్టమైన తెలుగు.
- source_word: γνόφῳ
  choice: కటిక చీకటి
  rationale: γνόφος దట్టమైన చీకటిని సూచిస్తుంది. తరువాతి ζόφοςతో తేడా కనిపించేలా ‘కటిక చీకటి’ అని అనువదించబడింది.
- source_word: ζόφῳ
  choice: గాఢాంధకారం
  rationale: ζόφος మసకగా, భయానకంగా ఉండే గాఢ చీకటిని సూచిస్తుంది; సమీపార్థక పదాల వాక్చాతుర్య సముచ్చయాన్ని నిలుపుతూ γνόφος నుండి స్వల్పంగా వేరు చేస్తుంది.
- source_word: θυέλλῃ
  choice: తుఫాను
  rationale: θύελλα తీవ్రమైన గాలివాన లేదా తుఫానును సూచిస్తుంది; ‘తుఫాను’ ఆధునిక పాఠకులకు స్పష్టమైన పదం.
theological_decisions:
- issue: సమీపించిన వస్తువుగా ‘కొండ’ను ప్రధాన పాఠ్యంలో చేర్చాలా?
  choice: ‘కొండ’ను ప్రధాన పాఠ్యంలో చేర్చకుండా, ‘తాకగలిగినదాని’ అని అనువదించడం.
  alternative: ‘తాకగలిగిన కొండ దగ్గరకు’ అని అనువదించడం.
  rationale: విస్తృత సందర్భంలో సీనాయి కొండ ఉద్దేశించబడినప్పటికీ, ఈ వచనంలోని గ్రీకు పాఠ్యంలో ὄρει (‘కొండ’) లేదు. కాబట్టి మూలపాఠ్యంలోని అనిర్దిష్టతను ప్రధాన పాఠ్యం నిలుపుతుంది; సందర్భార్థాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. గ్రీకు వాక్యంలోని పునరుక్త καί శ్రేణిని తెలుగు జాబితా నిర్మాణంలో సహజంగా ప్రతిబింబించాం; ‘కొండ’ను ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని అనిర్దిష్టతను కాపాడాం.
