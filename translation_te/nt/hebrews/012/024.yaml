id: HEB.12.24
reference: Hebrews 12:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: te
  text: కొత్త నిబంధనకు మధ్యవర్తియైన యేసు దగ్గరకూ, హేబెలు[a] కంటే మేలుగా పలికే చిలకరించబడిన రక్తం[b] దగ్గరకూ వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘హేబెలు రక్తం కంటే’ అని కూడా భావించవచ్చు. గ్రీకులో అక్షరార్థంగా ‘హేబెలు కంటే’ అని మాత్రమే ఉంది; ఇది నేలలోనుండి మొరపెట్టిన హేబెలు రక్తాన్ని సూచిస్తుండవచ్చు (ఆది 4:10).
    reason: alternative_reading
  - marker: b
    text: ‘చిలకరించబడిన రక్తం’ అనేది బలి రక్తాన్ని ఆచారపూర్వకంగా చిలకరించడాన్ని సూచిస్తుంది; ఇది నిబంధనను స్థిరపరచడం, శుద్ధి చేయడం అనే భావాలను జ్ఞాపకం చేస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: διαθήκης νέας
  choice: కొత్త నిబంధనకు
  rationale: διαθήκη ఇక్కడ వీలునామా అనే అర్థంలో కాక, దేవుడు ఏర్పరచిన నిబంధన అనే బైబిలు భావంలో ఉంది. గ్రీకులో నిర్దేశక పదం లేకపోవడాన్ని గౌరవిస్తూ ‘కొత్త నిబంధన’ అని అనువదించాం.
- source_word: μεσίτῃ
  choice: మధ్యవర్తియైన
  rationale: రెండు పక్షాల మధ్య నిలిచి నిబంధన సంబంధాన్ని స్థాపించే వ్యక్తి అనే న్యాయపరమైన, ధార్మికమైన భావాన్ని ‘మధ్యవర్తి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన ప్రామాణిక నామరూపాన్ని ఉపయోగించాం.
- source_word: αἵματι ῥαντισμοῦ
  choice: చిలకరించబడిన రక్తం
  rationale: బలి రక్తాన్ని ఆచారపూర్వకంగా చిలకరించే దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ‘ప్రోక్షణ రక్తం’ కంటే ఇది సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: κρεῖττον
  choice: మేలుగా
  rationale: హెబ్రీయులకు పత్రికలో పునరావృతమయ్యే ‘మరింత మేలైనది’ అనే తులనాత్మక ఇతివృత్తాన్ని సహజంగా నిలుపుతుంది.
- source_word: λαλοῦντι
  choice: పలికే
  rationale: వర్తమాన కృదంతం రక్తాన్ని విశేషిస్తోంది. ‘పలికే’ అనే రూపం దాని సజీవమైన, కొనసాగుతున్న సాక్ష్య భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: παρὰ τὸν Ἅβελ
  choice: హేబెలు కంటే
  rationale: గ్రీకు పాఠం ‘హేబెలు రక్తం కంటే’ అని విస్తరించకుండా నేరుగా ‘హేబెలు కంటే’ అంటుంది. అదే సంక్షిప్తతను ప్రధాన పాఠంలో నిలిపాం.
theological_decisions:
- issue: హేబెలుతో చేయబడిన పోలిక దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో గ్రీకులో ఉన్నట్లే ‘హేబెలు కంటే’ అని ఉంచడం.
  alternative: ‘హేబెలు రక్తం కంటే’ లేదా ‘హేబెలు రక్తం కోరినదానికంటే మేలైనదాన్ని పలికే’ అని విస్తరించడం.
  rationale: ఆదికాండం 4:10లో నేలలోనుండి మొరపెట్టిన హేబెలు రక్తమే నేపథ్య సూచన కావచ్చు. అయినా గ్రీకు వాక్యం ‘రక్తం’ అనే పదాన్ని పోలికలో మళ్లీ చెప్పదు. అందువల్ల ఆ భావసూచనను పాదటిప్పణిలో వివరించి, ప్రధాన పాఠంలోని ఉద్దేశపూర్వక సంక్షిప్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. ముందు వచనాల్లో ప్రారంభమైన ‘దగ్గరకు వచ్చారు’ అనే జాబితా నిర్మాణాన్ని కొనసాగించేందుకు ‘దగ్గరకూ ... వచ్చారు’ అని ఇచ్చాం. ‘ప్రోక్షణ’ వంటి ప్రత్యేక మతపరమైన పరిభాషకు బదులు ‘చిలకరించబడిన’ అనే సాధారణ రూపాన్ని ఎంచుకున్నాం.
