id: HEB.12.9
reference: Hebrews 12:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: te
  text: అంతేకాక, శరీర సంబంధమైన మన తండ్రులు మనలను క్రమశిక్షణ చేసేవారిగా ఉండేవారు; మనం వారిని గౌరవించేవాళ్లం. అలాంటప్పుడు, ఆత్మల తండ్రికి[a] మనం మరెంతగా లోబడి జీవిస్తాం కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆత్మల తండ్రి’ అంటే ప్రత్యేకంగా ‘మన ఆత్మల తండ్రి’ అని కావచ్చు; అయితే గ్రీకు వ్యక్తీకరణ దీనికంటే విస్తృతంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: అంతేకాక
  rationale: ఇది కేవలం కాలక్రమాన్ని కాకుండా, తక్కువదానినుంచి గొప్పదానికి సాగే అదనపు వాదనను పరిచయం చేస్తుంది.
- source_word: τῆς σαρκὸς ἡμῶν πατέρας
  choice: శరీర సంబంధమైన మన తండ్రులు
  rationale: ‘మన శరీరానికి సంబంధించిన తండ్రులు’ అనే మూల భావాన్ని సహజమైన తెలుగులో నిలుపుతూ, ‘ఆత్మల తండ్రి’తో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: παιδευτὰς
  choice: మనకు క్రమశిక్షణ నేర్పేవారిగా
  rationale: ఈ నామవాచకం శిక్షణతో కూడిన క్రమశిక్షణను అమలు చేసేవారిని సూచిస్తుంది; హెబ్రీయులు 12లోని παιδεία పదసంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ἐνετρεπόμεθα
  choice: మనం వారిని గౌరవించేవాళ్లం
  rationale: తల్లిదండ్రుల దిద్దుబాటుకు చూపిన గౌరవభావాన్ని సహజంగా వ్యక్తం చేస్తుంది; అతిగా భయపడటం అనే భావాన్ని చేర్చదు.
- source_word: οὐ πολὺ μᾶλλον
  choice: మనం మరెంతగా ... కదా?
  rationale: గ్రీకు వాక్యంలోని ‘అయితే మరింతగా’ అనే బలమైన తారతమ్య వాదనను అలంకారప్రశ్న రూపంలో సహజంగా అందిస్తుంది.
- source_word: ὑποταγησόμεθα
  choice: లోబడి
  rationale: భవిష్యత్ కర్మణి రూపానికి సందర్భానుసారంగా స్వచ్ఛంద విధేయతను సూచించే సహజ తెలుగు రూపం.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: ఆత్మల తండ్రికి
  rationale: గ్రీకులోని విస్తృత షష్ఠీ నిర్మాణాన్ని యథాతథంగా నిలుపుతుంది; దానిని ‘మన ఆత్మల తండ్రి’గా అనవసరంగా పరిమితం చేయదు.
- source_word: ζήσομεν
  choice: జీవించాలి
  rationale: అలంకారప్రశ్నలో లోబడటానికి కలిగే ఫలితమైన జీవాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘జీవిస్తాం’ అనే అక్షరార్థ భవిష్యత్ భావం ప్రశ్నలో అంతర్లీనంగా ఉంటుంది.
theological_decisions:
- issue: ‘ఆత్మల తండ్రి’ అనే మాట యొక్క పరిధి
  choice: ఆత్మల తండ్రి
  alternative: ప్రత్యేకంగా ‘మన ఆత్మల తండ్రి’ లేదా సాధారణంగా ‘ఆత్మీయ ప్రాణుల తండ్రి’
  rationale: మూల గ్రీకు ‘మన’ అని చెప్పదు. మానవ తండ్రులతో దేవుని వ్యత్యాసం స్పష్టమైనప్పటికీ, ‘ఆత్మలు’ ఎవరిని సూచిస్తుందో ప్రధాన పాఠ్యంలో సంకుచితం చేయకుండా దాని వేదాంతపరమైన విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘శరీర సంబంధమైన’ మరియు ‘ఆత్మల’ అనే పదాలతో మూలంలోని వ్యత్యాసం నిలుపబడింది; క్రమశిక్షణ సందర్భంతో పదసంబంధం కొనసాగించబడింది.
