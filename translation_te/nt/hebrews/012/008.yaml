id: HEB.12.8
reference: Hebrews 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: te
  text: అందరూ పాలుపంచుకున్న ఆ శిక్షణ మీకు లేకపోతే, మీరు అక్రమ సంతానమే గాని కుమారులు కారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: శిక్షణ
  rationale: ఈ సందర్భంలో తండ్రి తన పిల్లలను సరిదిద్ది తీర్చిదిద్దే క్రమశిక్షణను సూచిస్తుంది; కేవలం శిక్ష అనే సంకుచిత భావాన్ని నివారిస్తుంది.
- source_word: μέτοχοι γεγόνασι
  choice: పాలుపంచుకున్నారు
  rationale: ఆ శిక్షణలో అందరికీ భాగస్వామ్యం కలిగిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: νόθοι
  choice: అక్రమ సంతానం
  rationale: చట్టబద్ధంగా గుర్తింపుపొందని సంతానం అనే మూలపద భావాన్ని, అవమానకరమైన వాడుక పదాలను ఉపయోగించకుండా అందిస్తుంది.
- source_word: υἱοί
  choice: కుమారులు
  rationale: రచయిత ఉపయోగించిన కుమారత్వ భాషను, దాని వారసత్వ మరియు కుటుంబ గుర్తింపు సూచనలను నిలుపుతుంది.
theological_decisions:
- issue: దైవిక శిక్షణ మరియు కుమారత్వం మధ్య సంబంధం
  choice: శిక్షణ లేకపోవడాన్ని అక్రమ సంతాన స్థితితో, కుమారులు కాకపోవడంతో నేరుగా అనుసంధానించే మూలవాక్యంలోని ఉద్రిక్తతను నిలిపాం.
  alternative: భావాన్ని మృదువుచేసి ‘నిజమైన దేవుని పిల్లలు కారు’ అని చెప్పడం.
  rationale: మూలంలోని νόθοι మరియు υἱοί మధ్య ఉన్న కఠినమైన వ్యత్యాసాన్ని వ్యాఖ్యానంతో సడలించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్య నిర్మాణం. ‘శిక్షణ’ను సందర్భానుసారంగా పితృసంబంధ సరిదిద్దే ప్రక్రియగా ఉపయోగించాం.
