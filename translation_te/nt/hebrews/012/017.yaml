- from: ఎందుకంటే, ఆ తర్వాత అతడు ఆశీర్వాదాన్ని వారసత్వంగా పొందాలని కోరుకున్నప్పుడు తిరస్కరించబడ్డాడని మీకు తెలుసు. పశ్చాత్తాపానికి అవకాశం అతనికి దొరకలేదు[a]; అతడు కన్నీళ్లతో దానిని వెదికినప్పటికీ[b] దొరకలేదు.
