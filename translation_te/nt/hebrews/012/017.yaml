id: HEB.12.17
reference: Hebrews 12:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: te
  text: ఎందుకంటే, ఆ తర్వాత అతడు ఆశీర్వాదాన్ని వారసత్వంగా పొందాలని కోరుకున్నప్పుడు తిరస్కరించబడ్డాడని మీకు తెలుసు; పశ్చాత్తాపానికి అవకాశం అతనికి దొరకలేదు, అతడు కన్నీళ్లతో దానిని వెదికినప్పటికీ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పశ్చాత్తాపానికి స్థలం దొరకలేదు.” అంటే జరిగిన ఫలితాన్ని మార్చుకునే అవకాశం అతనికి దొరకలేదని, లేదా ఇస్సాకు తన నిర్ణయాన్ని మార్చుకునేలా చేయలేకపోయాడని అర్థం కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: “దానిని” అనేది “ఆశీర్వాదాన్ని” సూచించవచ్చు; లేదా, తక్కువ సంభావ్యతతో, “పశ్చాత్తాపాన్ని” సూచించవచ్చు. గ్రీకు పాఠ్యం దాని సూచనను స్పష్టంగా నిర్ణయించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: మీకు తెలుసు
  rationale: οἶδα యొక్క పరిపూర్ణ రూపం ఇక్కడ వర్తమానార్థాన్ని ఇస్తుంది; రచయిత పాఠకులకు ఇప్పటికే తెలిసిన విషయాన్ని గుర్తుచేస్తున్నాడు.
- source_word: μετέπειτα
  choice: ఆ తర్వాత
  rationale: తరువాతి కాలాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: θέλων
  choice: కోరుకున్నప్పుడు
  rationale: క్రియావిశేషణ రూపాన్ని సందర్భానుసారంగా కాలార్థక ఉపవాక్యంగా ఇచ్చి, అతని సంకల్పాన్ని అతిశయింపకుండా తెలిపింది.
- source_word: κληρονομῆσαι τὴν εὐλογίαν
  choice: ఆశీర్వాదాన్ని వారసత్వంగా పొందాలని
  rationale: ఏశావు కథలోని నిర్దిష్ట పితృ ఆశీర్వాదాన్ని సూచిస్తూ κληρονομέω యొక్క వారసత్వ భావాన్ని నిలుపుతుంది.
- source_word: ἀπεδοκιμάσθη
  choice: తిరస్కరించబడ్డాడు
  rationale: పరిశీలన అనంతరం అంగీకరించకపోవడం అనే నిష్క్రియార్థాన్ని స్పష్టంగా ఇస్తుంది; రక్షణశాస్త్ర సంబంధమైన సాంకేతిక భావాన్ని చేర్చదు.
- source_word: μετανοίας ... τόπον
  choice: పశ్చాత్తాపానికి అవకాశం
  rationale: ‘స్థలం దొరకలేదు’ అనే గ్రీకు నుడికారాన్ని సహజ తెలుగులో ‘అవకాశం దొరకలేదు’గా తెలిపి, μετανοίαకు సాధారణ నూతన నిబంధన పదమైన ‘పశ్చాత్తాపం’ను నిలిపింది.
- source_word: μετὰ δακρύων
  choice: కన్నీళ్లతో
  rationale: వెదికిన తీరును నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκζητήσας αὐτήν
  choice: దానిని వెదికినప్పటికీ
  rationale: ἐκζητέωలోని గాఢమైన అన్వేషణ భావానికి కన్నీళ్ల సందర్భం బలం ఇస్తుంది; లింగభేదం లేని ‘దానిని’ ఆశీర్వాదం లేదా పశ్చాత్తాపం/అవకాశం అనే రెండు సాధ్య పూర్వపదాల మధ్య అస్పష్టతను నిలుపుతుంది.
theological_decisions:
- issue: αὐτήν దేనిని సూచిస్తుంది, అలాగే ‘పశ్చాత్తాపానికి అవకాశం దొరకలేదు’ అనే మాట అర్థం
  choice: ముఖ్య పాఠ్యంలో ‘దానిని’ అని ఉంచి, అది ఆశీర్వాదాన్నా లేక పశ్చాత్తాపం/అవకాశాన్నా సూచిస్తుందో నిర్ణయించలేదు.
  alternative: అది ఆశీర్వాదాన్ని సూచిస్తుందని స్పష్టీకరించడం; లేదా అది ఇస్సాకు మనసు మార్చుకోవడాన్ని సూచిస్తుందని అనువదించడం.
  rationale: గ్రీకులో εὐλογία మరియు μετάνοια రెండూ స్త్రీలింగ నామవాచకాలు; αὐτήν వ్యాకరణపరంగా రెండింటిలో దేనినైనా సూచించవచ్చు. ‘పశ్చాత్తాపానికి స్థలం’ అనే మాటను ఏశావు ఫలితాన్ని మార్చుకోలేకపోవడం గానీ, ఇస్సాకు నిర్ణయాన్ని మార్చించలేకపోవడం గానీ అర్థం చేసుకోవచ్చు. కాబట్టి వ్యాఖ్యానంతో ఉద్రిక్తతను పరిష్కరించకుండా అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘పశ్చాత్తాపం,’ ‘ఆశీర్వాదం,’ ‘వారసత్వంగా పొందడం’ వంటి స్థిర బైబిలు పదాలను సహజ వాక్యనిర్మాణంతో ఉపయోగించాం. గ్రీకు γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో నిలిపాం.
