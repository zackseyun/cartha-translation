  to: 'హెబ్రీయులకు 12:11


    ప్రతి శిక్షణ కూడా ప్రస్తుతానికి ఆనందంగా కాక దుఃఖంగా అనిపిస్తుంది. అయితే తరువాత, దాని ద్వారా శిక్షణ పొందినవారికి అది శాంతిమయమైన నీతి ఫలాన్ని ఇస్తుంది.'
  rationale: The revision corrects the genitive relationship in “peaceful fruit of righteousness,” improves the naturalness of the opening clause, and retains the draft's sound rendering of formative discipline, temporary sorrow, and subsequent training-produced fruit. The footnote remains anchored to “నీతి” and states the lexical alternative without overdetermining the theological sense.
  reviewer_model: gpt-5.6-terra
