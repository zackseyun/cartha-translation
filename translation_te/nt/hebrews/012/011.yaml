id: HEB.12.11
reference: Hebrews 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: te
  text: 'హెబ్రీయులకు 12:11


    ప్రతి శిక్షణ కూడా ప్రస్తుతానికి ఆనందంగా కాక దుఃఖంగా అనిపిస్తుంది. అయితే తరువాత, దాని ద్వారా శిక్షణ పొందినవారికి అది శాంతిమయమైన నీతి ఫలాన్ని ఇస్తుంది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδεία
  choice: శిక్షణ
  rationale: హెబ్రీయులకు 12 అధ్యాయంలోని తండ్రి–పిల్లల సందర్భంలో ఈ పదం దిద్దుబాటు, బోధన, స్వభావ నిర్మాణం అన్నింటినీ కలిగి ఉంది. ‘శిక్ష’ అనడం కేవలం దండన భావాన్ని కలిగించవచ్చు; ‘శిక్షణ’ ఈ విస్తృత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: πρὸς μὲν τὸ παρὸν
  choice: ప్రస్తుతానికి
  rationale: ఇది తాత్కాలికమైన ప్రస్తుత అనుభవాన్ని ὕστερον (‘ఆ తరువాత’)తో వ్యతిరేకిస్తుంది.
- source_word: οὐ δοκεῖ
  choice: అనిపిస్తుంది
  rationale: ఇది సంపూర్ణ వాస్తవ నిర్ధారణకన్నా అనుభవించే వ్యక్తికి కనిపించే లేదా తోచే విధానాన్ని సూచిస్తుంది.
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: ఆనందంగా కాక దుఃఖంగా
  rationale: మూలంలోని ఆనందం–దుఃఖం వ్యత్యాసాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; λύπηని శారీరక నొప్పికే పరిమితం చేయదు.
- source_word: ὕστερον
  choice: ఆ తరువాత
  rationale: ప్రస్తుత దుఃఖం తరువాత కలిగే ఫలితాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: καρπὸν εἰρηνικὸν
  choice: శాంతిమయమైన ఫలం
  rationale: εἰρηνικός అనే విశేషణం ఫలాన్ని నేరుగా వర్ణిస్తుంది. ‘శాంతిమయమైన’ అనేది శాంతి లక్షణం గల ఫలం అనే భావాన్ని కాపాడుతుంది.
- source_word: γεγυμνασμένοις
  choice: సాధన పొందినవారికి
  rationale: పునరావృత అభ్యాసం ద్వారా తీర్చిదిద్దబడిన వారనే పరిపూర్ణ కర్మణి భావాన్ని, అలాగే అంతర్లీనమైన వ్యాయామ రూపకాన్ని తెలియజేస్తుంది.
- source_word: ἀποδίδωσιν
  choice: ఇస్తుంది
  rationale: శిక్షణ తరువాత ఫలాన్ని అందిస్తుందనే ఫలితార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: ఈ సందర్భంలో దేవుని శిక్షణ వల్ల రూపుదిద్దుకునే న్యాయమైన, యథార్థమైన జీవన లక్షణాన్ని ‘నీతి’ విస్తృతంగా సూచిస్తుంది; ‘న్యాయం’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు విశ్వాసుల పట్ల చేసే παιδεία యొక్క భావం
  choice: దిద్దుబాటు, అభ్యాసం, స్వభావ నిర్మాణం కలిగిన శిక్షణ
  alternative: శిక్ష లేదా కేవలం బోధన
  rationale: హెబ్రీయులకు 12:5–10లో ఇది తండ్రి తన పిల్లలను తీర్చిదిద్దే సందర్భంలో ఉంది. ‘శిక్షణ’ ప్రేమతో కూడిన దిద్దుబాటు మరియు ఎదుగుదల మధ్య ఉన్న భావ ఉద్రిక్తతను నిలుపుతుంది; దీనిని ప్రతీకార దండనగా కుదించదు.
- issue: δικαιοσύνης యొక్క అర్థం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ వచనంలో శిక్షణ ద్వారా ఏర్పడే సన్మార్గ జీవితం లేదా యథార్థత ప్రధానంగా కనిపిస్తుంది. అయినా గ్రీకు పదంలో ‘న్యాయం’ అనే భావసాధ్యత కూడా ఉన్నందున దానిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను కాపాడుతూ అనువదించబడింది. గ్రీకులో లేని కాలసూచక ‘ఇప్పుడు’ను ప్రారంభంలో చేర్చలేదు. δὲ యొక్క వ్యత్యాస భావాన్ని రెండవ వాక్యంలోని ‘అయితే’ ద్వారా సహజంగా వ్యక్తం చేశాం.
