source:
  edition: SBLGNT
  text: ὃν γὰρ ἀγαπᾷ κύριος παιδεύει, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: te
  text: ఎందుకంటే ప్రభువు తాను ప్రేమించే వారిని క్రమశిక్షణతో దిద్దుతాడు; తాను స్వీకరించే ప్రతి కుమారుణ్ణి[b] కొరడాతో కొడతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కొరడా దెబ్బలు కొడతాడు.” గ్రీకు క్రియ బలమైనది; అది తీవ్రమైన క్రమశిక్షణను చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ప్రతి కుమారుణ్ణి” అనేది గ్రీకు పదప్రయోగాన్ని ప్రతిబింబిస్తుంది; ఈ సందర్భంలో అది దేవుడు తన పిల్లలుగా అంగీకరించే వారందరినీ ప్రాతినిధ్యంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: తాను ప్రేమించేవానికి … తాను స్వీకరించే
  rationale: రెండు సంబంధవాచక ప్రయోగాల ఏకవచన వ్యక్తిగత సూచనను సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో నిలిపింది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి కారణాన్ని తెలిపే అనుసంధాన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγαπᾷ
  choice: ప్రేమించేవానికి
  rationale: ἀγαπάω యొక్క సాధారణ, సహజమైన తెలుగు అర్థాన్ని ఇస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: దైవిక బిరుదును గౌరవప్రదమైన, విస్తృతంగా అర్థమయ్యే తెలుగు రూపంలో నిలిపింది.
- source_word: παιδεύει
  choice: క్రమశిక్షణ నేర్పుతాడు
  rationale: శిక్షించడం మాత్రమే కాక దిద్దుబాటు, శిక్షణ అనే παιδεύω యొక్క రూపకల్పనాత్మక భావాన్ని కూడా వ్యక్తం చేస్తుంది.
- source_word: μαστιγοῖ
  choice: కొరడాతో కొడతాడు
  rationale: కొరడాతో తీవ్రంగా కొట్టడాన్ని సూచించే బలమైన క్రియను మృదువుచేయకుండా, ఆధునిక పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: δὲ
  choice: ;
  rationale: ఇక్కడ రెండవ సమాంతర వాక్యభాగాన్ని కొనసాగించే భావం ఉంది; తెలుగులో అర్ధవిరామం సహజంగా ఆ అనుసంధానాన్ని చూపుతుంది.
- source_word: πάντα υἱὸν
  choice: ప్రతి కుమారుణ్ణి
  rationale: ఏకవచన పుంలింగ కుమారత్వ రూపకాన్ని నిలుపుతూ, సందర్భంలోని దేవుని పిల్లలందరికీ వర్తించే ప్రాతినిధ్య భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: παραδέχεται
  choice: స్వీకరించే
  rationale: ఆమోదించి తనవానిగా చేర్చుకునే సంబంధాత్మక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవిక క్రమశిక్షణ సందర్భంలో υἱός అనే కుమారత్వ పదం
  choice: ప్రతి కుమారుణ్ణి
  alternative: ప్రతి బిడ్డను
  rationale: మూలపాఠంలోని పుంలింగ ఏకవచనాన్ని, హెబ్రీయులు 12లో ప్రధానమైన కుమారత్వ చిత్రణను నిలిపింది; ఇది దేవుని పిల్లలందరినీ సూచించే ప్రాతినిధ్య ప్రయోగమని పాదసూచిక వివరిస్తుంది.
- issue: దైవిక ప్రేమతో పాటు μαστιγοῖ సూచించే తీవ్రమైన క్రమశిక్షణ
  choice: కొరడాతో కొడతాడు
  alternative: తీవ్రంగా శిక్షిస్తాడు
  rationale: మూలంలోని తీవ్రమైన శారీరక రూపకాన్ని మృదువుచేయకుండా, ప్రేమకూ బాధాకరమైన క్రమశిక్షణకూ మధ్య ఉన్న వేదాంత ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. παιδεύει లోని శిక్షణాత్మక దిద్దుబాటును ‘క్రమశిక్షణ నేర్పుతాడు’గా, μαστιγοῖ లోని తీవ్రతను ‘కొరడాతో కొడతాడు’గా వేరు చేసి నిలిపింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
