  naturalness: ‘తాను ప్రేమించే వారిని క్రమశిక్షణతో దిద్దుతాడు’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, దిద్దుబాటు మరియు శిక్షణ అనే రెండు పార్శ్వాలను వ్యక్తం చేస్తుంది. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదాల వద్ద ఉంచడం పాఠకునికి స్పష్టంగా ఉంటుంది.
