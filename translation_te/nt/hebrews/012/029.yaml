  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: te
  text: ఎందుకంటే మన దేవుడు దహించే అగ్ని[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది ద్వితీయోపదేశకాండము 4:24లో దేవుడు ‘దహించే అగ్ని’గా వర్ణించబడిన మాటను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘దహించివేసే అగ్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే
  rationale: γὰρ ముందున్న హెచ్చరికకు కారణాన్ని తెలియజేస్తుంది; καὶ యొక్క బలపరిచే భావం తెలుగులో ప్రత్యేకంగా అనువదించకుండా సహజమైన కారణార్థక అనుసంధానంలో ఇమిడింది.
- source_word: ὁ θεὸς ἡμῶν
  choice: మన దేవుడు
  rationale: గ్రీకు స్వామ్య సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, సమూహపరమైన నిబంధన సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: πῦρ
  choice: అగ్ని
  rationale: రూపకాన్ని వ్యాఖ్యానించకుండా నేరుగా నిలుపుతుంది; ద్వితీయోపదేశకాండము 4:24తో ఉన్న ప్రతిధ్వనికి కూడా తగిన పదం.
- source_word: καταναλίσκον
  choice: దహించే
  rationale: అగ్ని పూర్తిగా కాల్చివేసే క్రియాశీల స్వభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వర్తమాన కృదంత భావాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: దేవుణ్ణి అగ్నిగా వర్ణించే రూపకం
  choice: మన దేవుడు దహించే అగ్ని
  alternative: మన దేవుడు దహించే అగ్నివంటివాడు
  rationale: గ్రీకులో ఉపమాన సూచకం లేదు; అందువల్ల రూపకాన్ని ఉపమానంగా మృదువుచేయకుండా సమీకరణ వాక్యంగానే నిలిపాం.
- issue: καταναλίσκον యొక్క నిర్మాణం
  choice: దహించే అగ్ని
  alternative: దహించివేసే అగ్ని / దహించే ఒక అగ్ని
  rationale: కృదంతం అగ్ని యొక్క లక్షణాన్ని తెలుపుతుంది. తెలుగు సహజత్వం కోసం అనిశ్చితార్థక ‘ఒక’ను చేర్చలేదు; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన హెచ్చరిక స్వరాన్ని నిలిపాం. ‘దహించే అగ్ని’ అనే ప్రత్యక్ష రూపకం మూలంలోని బలాన్ని, అంతర్గ్రంథ సంబంధాన్ని కాపాడుతుంది.
