source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: te
  text: దేవుని కృపను పొందడంలో ఎవరూ వెనుకబడిపోకుండా, పైకి మొలిచే చేదుతనపు వేరు ఏదైనా కలత కలిగించి, దాని ద్వారా అనేకులు అపవిత్రులు కాకుండా శ్రద్ధగా చూసుకోండి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని కృపను పొందడంలో ఎవరూ విఫలం కాకుండా.” గ్రీకు ప్రయోగం అందించబడినదాన్ని పొందకపోవడం లేదా కృపకు తక్కువగా నిలవడం అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “చేదుతనపు వేరు” అనే మాట ద్వితీయోపదేశకాండము 29:18ను ప్రతిధ్వనింపజేస్తున్నట్లు ఉంది. అక్కడ విషాన్ని, చేదును ఫలించే వేరు దేవుని నుండి తొలగిపోయే సందర్భంతో సంబంధం కలిగి ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: జాగ్రత్తగా చూసుకోండి
  rationale: ఈ వర్తమాన కృదంతం అప్రమత్తంగా పర్యవేక్షించే భావాన్ని ఇస్తుంది. తెలుగు వాక్య నిర్మాణంలో ముందటి సందర్భంలోని ఆజ్ఞను కొనసాగించే విధంగా క్రియారూపంగా అనువదించడం సహజంగా ఉంటుంది.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: దేవుని కృప విషయంలో ఎవరూ వెనుకబడిపోకుండా
  rationale: ὑστερέω ἀπό అనే ప్రయోగంలో అందుకోకపోవడం లేదా వెనుకబడిపోవడం అనే భావాలు రెండూ ఉండవచ్చు. ఈ అనువాదం హెచ్చరిక తీవ్రతను ఉంచుతూ, రక్షణను కోల్పోవడం లేదా కృపను అసలు పొందకపోవడం అనే సిద్ధాంత వివాదాన్ని తేల్చదు.
- source_word: χάριτος
  choice: కృప
  rationale: ఇక్కడ θεοῦతో కలిసి ఉన్న χάριςకు ‘కృప’ సహజమైన ప్రామాణిక బైబిలు పదం; దేవుని అనుగ్రహం అనే ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ῥίζα πικρίας
  choice: చేదుతనపు వేరు
  rationale: జనిటివ్ నిర్మాణాన్ని దగ్గరగా ప్రతిబింబిస్తూ ద్వితీయోపదేశకాండము 29:18తో ఉండే సాధ్యమైన ప్రతిధ్వనిని నిలుపుతుంది. ఇది కేవలం మనసులోని పగను మాత్రమే సూచించేటట్లు అర్థాన్ని కుదించదు.
- source_word: ἄνω φύουσα
  choice: పైకి మొలిచే
  rationale: మొలక పైకి రావడం లేదా పెరగడం అనే సజీవ రూపకాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐνοχλῇ
  choice: కలత కలిగించకుండా
  rationale: ఇబ్బంది పెట్టడం, కలవరపరచడం అనే క్రియ భావాన్ని, సమాజంపై పడే ప్రభావంతో సహజంగా తెలియజేస్తుంది.
- source_word: δι’ αὐτῆς
  choice: దాని ద్వారా
  rationale: స్త్రీలింగ సర్వనామం సహజంగా ‘వేరు’ను సూచిస్తుంది; διά యొక్క సాధనార్థాన్ని ‘ద్వారా’ నిలుపుతుంది.
- source_word: μιανθῶσιν πολλοί
  choice: అనేకులు అపవిత్రులు కాకుండా
  rationale: μιαίνωలోని నైతిక లేదా ఆచారసంబంధ అపవిత్రత బలాన్ని ‘అపవిత్రులు’ నిలుపుతుంది; దాన్ని కేవలం సామాజిక ఇబ్బందిగా మృదుపరచదు.
theological_decisions:
- issue: ‘దేవుని కృప విషయంలో వెనుకబడడం’ అనేది రక్షణను కోల్పోవడమా, కృపను పొందకపోవడమా, లేక సమాజం నుంచి తప్పిపోవడమా?
  choice: దేవుని కృప విషయంలో ఎవరూ వెనుకబడిపోకుండా
  alternative: దేవుని కృపను పొందడంలో ఎవరూ విఫలం కాకుండా
  rationale: గ్రీకు ప్రయోగం పొందవలసినదాన్ని పొందకపోవడం, దానికి తక్కువగా నిలవడం అనే భావాలకు చోటిస్తుంది. వాక్యం తానే తరువాతి సిద్ధాంత వ్యవస్థల మధ్య తీర్పు ఇవ్వనందున అనువాదం ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: μιαίνωను కేవలం సామాజిక కలతగా మృదుపరచాలా?
  choice: అపవిత్రులు
  alternative: చెడిపోవడం
  rationale: మూల క్రియలో నైతిక లేదా ఆచారసంబంధ అపవిత్రతకు సంబంధించిన బలమైన భావం ఉంది; ‘అపవిత్రులు’ దాని గంభీరతను నిలుపుతుంది.
- issue: ‘చేదుతనపు వేరు’ను వ్యక్తిగత ద్వేషం లేదా పగగా మాత్రమే వివరించాలా?
  choice: రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: పగ అనే వేరు
  rationale: ద్వితీయోపదేశకాండము 29:18లోని నేపథ్యం విషఫలమిచ్చే ఒడంబడిక అవిశ్వాసాన్ని సూచించే అవకాశం ఉంది. కాబట్టి దాన్ని వ్యక్తిగత భావోద్వేగమైన పగకు మాత్రమే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన బైబిలు శైలి. వాక్యాంతంలోని ‘జాగ్రత్తగా చూసుకోండి’ గ్రీకు కృదంతాన్ని తెలుగు ఆజ్ఞారూపంగా సహజీకరిస్తుంది. ‘కృప’, ‘అపవిత్రులు’ వంటి పదాలు మూలంలోని ధార్మిక మరియు నైతిక బరువును నిలుపుతాయి.
