  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరమైన హెచ్చరిక స్వరాన్ని నిలిపే శైలి. వ్యక్తి గుర్తింపును సందర్భానికి వదిలి, భూమి–పరలోకం వ్యత్యాసాన్ని స్పష్టంగా ఉంచింది.
