source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: te
  text: మాట్లాడుతున్నవానిని మీరు తిరస్కరించకుండా జాగ్రత్తపడండి. భూమిమీద హెచ్చరించినవానిని తిరస్కరించినవారు తప్పించుకోలేకపోయినట్లయితే, పరలోకం నుండి మాట్లాడుతున్నవానికి మనం విముఖులమైతే, మనం ఎంతమాత్రం తప్పించుకోలేము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పరలోకం నుండి ఉన్నవానికి విముఖులయ్యే మనం మరి ఎంతమాత్రం!” రెండో భాగంలో “తప్పించుకోలేము” అనే క్రియ ముందటి భాగం నుండి గ్రహించబడుతుంది. “హెచ్చరించినవాడు” అని అనువదించిన గ్రీకు పదానికి దైవాధికారంతో సూచించడం లేదా హెచ్చరించడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: జాగ్రత్తపడండి
  rationale: బహువచన ఆజ్ఞ ఇక్కడ హెచ్చరికతో కూడిన ప్రబోధంగా ఉంది; ఆధునిక తెలుగులో ఈ ప్రయోగం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: తిరస్కరించకుండా / తిరస్కరించినవారు
  rationale: రెండు చోట్ల ఉన్న ఒకే గ్రీకు క్రియ యొక్క పదబంధ సంబంధాన్ని నిలుపుతూ, మాట వినడానికి నిరాకరించడం అనే సందర్భార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: τὸν λαλοῦντα
  choice: మాట్లాడుతున్నవాణ్ణి
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న ప్రసంగాన్ని, దాని తక్షణత్వాన్ని నిలుపుతుంది.
- source_word: ἐξέφυγον
  choice: తప్పించుకోలేకపోయారు
  rationale: తీర్పు లేదా దాని పరిణామాల నుండి తప్పించుకోలేదనే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ γῆς
  choice: భూమి మీద
  rationale: ἀπ’ οὐρανῶν అనే ‘పరలోకం నుండి’ అన్న పదబంధంతో ఉన్న భూమి–పరలోకం వ్యత్యాసాన్ని, సీనాయి అని అదనంగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: χρηματίζοντα
  choice: దైవహెచ్చరిక ఇచ్చినవాణ్ణి
  rationale: ఈ క్రియ దైవాధికారంతో ఇచ్చిన సందేశం, ఆదేశం లేదా హెచ్చరికను సూచించగలదు. హెచ్చరిక సందర్భాన్ని చూపుతూ దాని దైవిక స్వభావాన్నీ కాపాడుతుంది.
- source_word: πολὺ μᾶλλον
  choice: ఇంకెంతగా
  rationale: తక్కువదాని నుండి ఎక్కువదానికి సాగే ప్రతికూల తర్కాన్ని సహజ తెలుగు ప్రశ్నోద్ఘాటన రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἀποστρεφόμενοι
  choice: మనం విడిచిపెడితే
  rationale: ముఖం తిప్పడం లేదా వెనుదిరగడం అనే భావాన్ని సహజంగా తెలుపుతూ, ముందున్న వాక్యం నుండి గ్రహించాల్సిన ‘తప్పించుకోలేం’ అనే ఫలితంతో షరతు సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: పరలోకం నుండి మాట్లాడుతున్నవాణ్ణి
  rationale: గ్రీకులో రెండోసారి మాటల క్రియ స్పష్టంగా లేకపోయినా సందర్భం నుండి గ్రహించబడుతుంది; మొదటి భాగంతో పోలికను తెలుగులో స్పష్టం చేస్తూ వ్యక్తి గుర్తింపును నిర్దిష్టంగా చేర్చదు.
theological_decisions:
- issue: మాట్లాడే లేదా హెచ్చరించే వ్యక్తి గుర్తింపు
  choice: ‘మాట్లాడుతున్నవాడు’, ‘దైవహెచ్చరిక ఇచ్చినవాడు’ అని వివరణాత్మకంగానే ఉంచడం
  alternative: ప్రధాన పాఠ్యంలో ‘దేవుడు’ లేదా ‘క్రీస్తు’ అని స్పష్టంగా గుర్తించడం
  rationale: సందర్భం దైవిక ప్రసంగాన్ని సూచించినా, ఈ వచనం స్వయంగా పేరు లేదా బిరుదు వాడదు. అందువల్ల పాఠ్యంలో ఉన్న ఉద్దేశపూర్వక సాధారణతను నిలుపుతుంది.
- issue: గ్రీకు వాక్యంలో రెండో భాగంలోని అధ్యాహృత క్రియ
  choice: ‘తప్పించుకోలేం’ అని స్పష్టంగా చేర్చడం
  alternative: ‘పరలోకం నుండి ఉన్నవాణ్ణి విడిచిపెట్టే మనం ఇంకెంతగా’ అని అధ్యాహారాన్ని అనువదించకుండా ఉంచడం
  rationale: గ్రీకులో ἐξέφυγον భావం రెండో భాగంలో అధ్యాహృతంగా ఉంది. తెలుగులో పూర్తి, సహజ వాక్యం కోసం దాన్ని చేర్చడం భావాన్ని మార్చదు.
- issue: χρηματίζοντα లోని దైవిక సమాచార భావం
  choice: ‘దైవహెచ్చరిక ఇచ్చినవాడు’
  alternative: కేవలం ‘హెచ్చరించినవాడు’ లేదా ‘దైవాదేశం ఇచ్చినవాడు’
  rationale: పదంలో దైవాధికార సమాచార భావం ఉండగలదని తెలియజేస్తూనే, అది కేవలం ఆదేశమా హెచ్చరికా అనే పరిధిని సందర్భానుగుణంగా సమతుల్యం చేస్తుంది.
