revisions:
- from: మాట్లాడుతున్నవాణ్ణి మీరు తిరస్కరించకుండా జాగ్రత్తపడండి. భూమి మీద దైవహెచ్చరిక ఇచ్చినవాణ్ణి తిరస్కరించినవారు తప్పించుకోలేకపోయారంటే, పరలోకం నుండి మాట్లాడుతున్నవాణ్ణి మనం విడిచిపెడితే ఇంకెంతగా తప్పించుకోలేం![a]
  to: మాట్లాడుతున్నవానిని మీరు తిరస్కరించకుండా జాగ్రత్తపడండి. భూమిమీద హెచ్చరించినవానిని తిరస్కరించినవారు తప్పించుకోలేకపోయినట్లయితే, పరలోకం నుండి మాట్లాడుతున్నవానికి మనం విముఖులమైతే, మనం ఎంతమాత్రం తప్పించుకోలేము.[a]
