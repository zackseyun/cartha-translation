id: HEB.12.20
reference: Hebrews 12:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἔφερον γὰρ τὸ διαστελλόμενον· Κἂν θηρίον θίγῃ τοῦ ὄρους, λιθοβοληθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: te
  text: 'ఎందుకంటే, విధించబడిన దానిని వారు సహించలేకపోయారు: “ఒక జంతువైనా ఆ కొండను తాకితే, అది రాళ్లతో కొట్టి చంపబడుతుంది.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, నిర్గమకాండము 19:12–13ను ప్రతిధ్వనిస్తూ, “లేదా బాణంతో చంపబడుతుంది” అని అదనంగా ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: వారు సహించలేకపోయారు
  rationale: ప్రతికూల సందర్భంలో φέρω అంటే భరించడం లేదా సహించడం. ఇక్కడ ఆజ్ఞ యొక్క భయంకరమైన కఠినతను తట్టుకోలేకపోవడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న వాక్యానికి వివరణను పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ తార్కిక సంబంధాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: τὸ διαστελλόμενον
  choice: ఆజ్ఞాపించబడిన దానిని
  rationale: ఈ వర్తమాన కర్మణి కృదంతం అధికారపూర్వకంగా ఆజ్ఞాపించబడుతున్న విషయాన్ని సూచిస్తుంది. నామవాచకంగా కుదించకుండా దాని వాచ్య స్వరూపాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: Κἂν
  choice: ఒక జంతువైనా
  rationale: κἄν లోని షరతు మరియు ఉద్ఘాటన రెండింటినీ ‘-అయినా ... తాకితే’ అనే తెలుగు నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: θηρίον
  choice: జంతువు
  rationale: θηρίον ఇక్కడ సాధారణంగా జంతువును సూచించగలదు; ‘మృగం’ అనడం అడవి జంతువుకే పరిమితం చేస్తున్న భావాన్ని కలిగించవచ్చు.
- source_word: θίγῃ
  choice: తాకితే
  rationale: షరతు వాక్యంలోని aorist subjunctive ను తెలుగులో సహజమైన షరతు రూపమైన ‘తాకితే’ స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: τοῦ ὄρους
  choice: ఆ కొండను
  rationale: సందర్భంలో ఇప్పటికే పేర్కొన్న సీనాయి కొండనే సూచిస్తున్నప్పటికీ, మూలపాఠంలాగే దాని పేరును చేర్చకుండా ‘ఆ కొండ’ అని అనువదించబడింది.
- source_word: λιθοβοληθήσεται
  choice: దాన్ని రాళ్లతో కొట్టి చంపాలి
  rationale: λιθοβολέω అనేది కేవలం రాళ్లు విసరడం కాక, రాళ్లతో కొట్టి మరణశిక్ష అమలు చేయడాన్ని సూచిస్తుంది. తెలుగు బైబిలు సందర్భంలో భావాన్ని స్పష్టంగా తెలిపేందుకు ఈ సహజ రూపం ఉపయోగించబడింది; భవిష్యత్ కర్మణి రూపం ఇక్కడ ఆజ్ఞలోని తప్పనిసరి పరిణామాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: సీనాయి ఆజ్ఞ ఉల్లేఖనపు పరిధి
  choice: అందించిన SBLGNT పాఠంలో ఉన్న ‘దాన్ని రాళ్లతో కొట్టి చంపాలి’ వరకే ప్రధాన పాఠంలో ఉంచడం
  alternative: నిర్గమకాండము 19:12–13ను అనుసరించి ‘లేదా బాణంతో కొట్టాలి’ అని ప్రధాన పాఠంలో చేర్చడం
  rationale: కొన్ని గ్రీకు ప్రతుల్లో అదనపు పదాలు ఉన్నప్పటికీ, అందించిన SBLGNT పాఠం λιθοβοληθήσεται తో ముగుస్తుంది. కాబట్టి ప్రధాన పాఠాన్ని సమన్వయపరచి విస్తరించకుండా, పాఠాంతరాన్ని పాదసూచికలో మాత్రమే తెలియజేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఆ కొండ’ అనే పదప్రయోగం సందర్భంలోని నిర్దిష్ట సూచనను నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠంలో ఉల్లేఖనం ముగిసిన వెంటనే ఉంచబడింది.
