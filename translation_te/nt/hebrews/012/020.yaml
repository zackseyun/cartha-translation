- from: 'ఎందుకంటే, ఆజ్ఞాపించబడిన దానిని వారు సహించలేకపోయారు: “ఒక జంతువైనా ఆ కొండను తాకితే, దాన్ని రాళ్లతో కొట్టి చంపాలి.”[a]'
  to: 'ఎందుకంటే, విధించబడిన దానిని వారు సహించలేకపోయారు: “ఒక జంతువైనా ఆ కొండను తాకితే, అది రాళ్లతో కొట్టి చంపబడుతుంది.”[a]'
  rationale: The revision retains the SBLGNT’s shorter reading and the conditional emphasis that even an animal is included. It replaces an imperative-like Telugu construction with a future passive to represent λιθοβοληθήσεται faithfully, and it makes the variant note grammatically parallel to that variant’s future-passive sense.
