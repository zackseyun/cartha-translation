id: HEB.12.10
reference: Hebrews 12:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: te
  text: వారు కొద్దికాలం పాటు[a] తమకు సరైనదని తోచినట్లు[b] మనకు క్రమశిక్షణ ఇచ్చారు. అయితే ఆయన మన మేలు కోసం, మనం ఆయన పవిత్రతలో పాలుపొందేలా మనకు క్రమశిక్షణ ఇస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక అనువాదం: ‘కొన్ని రోజుల పాటు.’ భూసంబంధమైన తండ్రుల క్రమశిక్షణ పరిమిత కాలానికే సంబంధించినదని గ్రీకు పదబంధం నొక్కి చెబుతుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: ‘తమకు మంచిదని అనిపించిన ప్రకారం.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: కొద్దికాలం పాటు
  rationale: అక్షరార్థంగా ‘కొన్ని రోజుల పాటు’ అని ఉన్నా, ఇక్కడ భూసంబంధమైన తండ్రుల క్రమశిక్షణ పరిమిత కాలాన్ని సూచించే గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: తమకు సరైనదని తోచిన విధంగా
  rationale: వారి నిర్ణయం వారికి సరైనదిగా కనిపించినదనే వ్యక్తిగత అంచనా భావాన్ని కాపాడుతుంది; అది తప్పక సంపూర్ణంగా సరైనదని చెప్పదు.
- source_word: ἐπαίδευον
  choice: క్రమశిక్షణ ఇచ్చారు
  rationale: ఈ సందర్భంలో శిక్షించడం మాత్రమే కాక తల్లిదండ్రుల శిక్షణ, దిద్దుబాటు అనే విస్తృత భావాన్ని తెలియజేస్తుంది.
- source_word: ὁ δὲ
  choice: అయితే ఆయన … క్రమశిక్షణ ఇస్తాడు
  rationale: గ్రీకులో క్రియ లోపించినా, సందర్భంలో దేవుడు భూసంబంధమైన తండ్రులతో పోల్చబడుతున్నాడు. తెలుగులో భావం సహజంగా ఉండేందుకు క్రియను పునరుక్తం చేసి, దేవుడు అనే నామాన్ని చేర్చకుండా సర్వనామాన్ని ఉంచింది.
- source_word: ἐπὶ τὸ συμφέρον
  choice: మన మేలు కోసం
  rationale: దేవుని క్రమశిక్షణ మన ప్రయోజనాన్ని లక్ష్యంగా చేసుకున్నదనే ఉద్దేశ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: పాలుపంచుకునేలా
  rationale: గ్రీకు నిర్మాణంలోని ఉద్దేశం లేదా ఫలితం అనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἁγιότητος αὐτοῦ
  choice: ఆయన పవిత్రతలో
  rationale: దేవునికి చెందిన పవిత్రత అనే గుణంలో విశ్వాసులు పాలుపంచుకోవడాన్ని సూచిస్తుంది; దాని విధానాన్ని అనవసరంగా నిర్వచించదు.
theological_decisions:
- issue: ὁ δὲ అనే ఏకవచన కర్త ఎవరిని సూచిస్తుంది?
  choice: సందర్భానుసారం దేవుణ్ణి సూచిస్తూ ‘ఆయన’ అని అనువదించడం
  alternative: స్పష్టత కోసం ‘దేవుడు’ అని నామాన్ని చేర్చడం
  rationale: హెబ్రీయులు 12:5–11లో భూసంబంధమైన తండ్రులకు దేవుడు తండ్రిగా విరుద్ధంగా చూపబడుతున్నాడు. ‘ఆయన’ గ్రీకు పాఠంలోని అంతర్నిహిత సూచనను కాపాడుతుంది.
- issue: ‘ఆయన పవిత్రతలో పాలుపంచుకోవడం’ అనే మాట భావం
  choice: దేవుని పవిత్రతలో పాలుపంచుకోవడం అని మాత్రమే పేర్కొనడం
  alternative: దీనిని కేవలం స్థితిగత పవిత్రతగా లేదా కేవలం క్రమంగా జరిగే పవిత్రీకరణగా వివరించడం
  rationale: వాక్యం దైవ క్రమశిక్షణ ఉద్దేశాన్ని చెబుతుంది గాని, ఆ భాగస్వామ్యం ఎలా నెరవేరుతుందో సంకుచితంగా నిర్వచించదు. అందువల్ల సిద్ధాంతపరమైన ఉద్వేగాన్ని అలాగే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘క్రమశిక్షణ’ అనే పదం శిక్షకే పరిమితం కాకుండా శిక్షణ, దిద్దుబాటు భావాలను కూడా మోస్తుంది.
