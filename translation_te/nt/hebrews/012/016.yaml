revisions:
- from: ఎవరూ లైంగిక దుర్నీతికి పాల్పడేవారిగా గానీ, ఏశావులా పవిత్రమైనవాటిని లక్ష్యపెట్టనివారిగా గానీ ఉండకుండా చూసుకోండి. అతడు ఒక్క పూట భోజనం కోసం తన జ్యేష్ఠపుత్రుని హక్కులను అమ్మివేశాడు.
  to: ఎవరూ లైంగిక దుర్నీతిపరులుగా గానీ, ఏశావువలె పవిత్రమైన వాటిని గౌరవించని వ్యక్తులుగా గానీ ఉండకుండా జాగ్రత్తపడండి. అతడు ఒక్క భోజనం కోసం తన జ్యేష్ఠత్వ హక్కులను అమ్మివేశాడు.
  rationale: The revision preserves the Greek warning structure and leaves the syntactic association of ‘ఏశావువలె’ with the profane-person warning, without importing a disputed claim about Esau’s sexual conduct. It replaces an unnatural and inaccurate expression for βέβηλος, clarifies that the birthright belonged to Esau himself, and renders ‘one meal’ directly.
  reviewer_model: gpt-5.6-terra
