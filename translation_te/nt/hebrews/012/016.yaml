id: HEB.12.16
reference: Hebrews 12:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: te
  text: ఎవరూ లైంగిక దుర్నీతిపరులుగా గానీ, ఏశావువలె పవిత్రమైన వాటిని గౌరవించని వ్యక్తులుగా గానీ ఉండకుండా జాగ్రత్తపడండి. అతడు ఒక్క భోజనం కోసం తన జ్యేష్ఠత్వ హక్కులను అమ్మివేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: లైంగిక దుర్నీతికి పాల్పడేవాడు
  rationale: లైంగిక అనైతికతకు పాల్పడే వ్యక్తిని సూచించే గ్రీకు పదాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: βέβηλος
  choice: పవిత్రమైనవాటిని లక్ష్యపెట్టనివాడు
  rationale: ఈ పదం సాధారణమైనది, అపవిత్రమైనది, పవిత్ర విషయాలను గౌరవించనిది అనే భావక్షేత్రాన్ని కలిగి ఉంది. సందర్భంలో ఏశావు జ్యేష్ఠత్వ హక్కును తక్కువగా చూడడాన్ని స్పష్టంగా సూచిస్తూ, ‘దేవుడు లేనివాడు’ అనే అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: βρώσεως μιᾶς
  choice: ఒక్క పూట భోజనం
  rationale: అక్షరార్థంగా ‘ఒక భోజనం/తినుబండారం’; ఆదికాండ సందర్భానికి మరియు సహజ తెలుగు వాడుకకు సరిపోతుంది.
- source_word: τὰ πρωτοτόκια ἑαυτοῦ
  choice: తన జ్యేష్ఠపుత్రుని హక్కులు
  rationale: మొదట పుట్టిన కుమారునికి సంబంధించిన హక్కులు, ప్రయోజనాల సమాహారాన్ని బహువచన భావంతో తెలియజేస్తుంది.
- source_word: ἀπέδετο
  choice: అమ్మివేశాడు
  rationale: విక్రయించాడనే సూటి అర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: βέβηλος యొక్క అర్థం
  choice: పవిత్రమైనవాటిని లక్ష్యపెట్టనివాడు
  alternative: దైవభక్తి లేనివాడు / అపవిత్రుడు
  rationale: ‘godless’ కంటే మూలపదంలోని పవిత్ర–సాధారణ విభేదాన్ని మెరుగ్గా నిలుపుతుంది; ఏశావు దేవుని ఉనికిని నిరాకరించాడని వాక్యం చెప్పనిదాన్ని చేర్చదు.
- issue: πόρνος మరియు ఏశావు మధ్య సంబంధం
  choice: రెండు వేర్వేరు హెచ్చరికలుగా, అయితే ‘ఏశావులా’ అన్నది రెండవదానికి సహజంగా అనుసంధానమయ్యేలా అనువదించడం
  alternative: ఏశావునే లైంగిక దుర్నీతిపరుడిగా మరియు అపవిత్రుడిగా రెండింటికీ ఉదాహరణగా చూపించడం
  rationale: గ్రీకు నిర్మాణంలో ὡς Ἠσαῦ సమీపంలోని βέβηλος‌ను విశేషించే అవకాశం బలంగా ఉంది; ఏశావును లైంగిక దుర్నీతితో తప్పనిసరిగా అనుసంధానించే వివాదాస్పద వ్యాఖ్యానాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంఘ పఠనానికి తగిన గౌరవప్రదమైన, స్పష్టమైన శైలి. ‘చూసుకోండి’ అనే రూపం ముందరి వాక్యాల హెచ్చరికాత్మక ప్రవాహానికి సరిపోతుంది. సాంకేతికమైన ‘జన్మహక్కు’ కంటే ‘జ్యేష్ఠపుత్రుని హక్కులు’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
