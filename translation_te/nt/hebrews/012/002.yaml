id: HEB.12.2
reference: Hebrews 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: te
  text: విశ్వాసానికి మార్గం తెరిచినవాడూ దాన్ని పరిపూర్ణతకు చేర్చేవాడూ అయిన యేసుపై మన చూపు నిలుపుతూ ఉండాలి[a]. ఆయన తన ముందు ఉంచబడిన ఆనందం నిమిత్తం సిలువను సహించాడు; దాని అవమానాన్ని లెక్కచేయలేదు[b]. ఇప్పుడు ఆయన దేవుని సింహాసనానికి కుడివైపున కూర్చొని ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వసనీయతకు మార్గం తెరిచి దాన్ని పరిపూర్ణం చేసిన యేసు,” లేదా “మన విశ్వాసానికి మార్గం తెరిచి దాన్ని పరిపూర్ణతకు చేర్చే యేసు.” గ్రీకు పదబంధం సంక్షిప్తంగా ఉంది; πίστις అనే పదానికి “విశ్వాసం,” “విశ్వసనీయత” అనే అర్థాలు ఉండవచ్చు, లేదా అది ప్రత్యేకంగా విశ్వాసుల విశ్వాసాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: 'లేదా, “దాని అవమానాన్ని తృణీకరించాడు.” భావం: సిలువ వల్ల కలిగే అపకీర్తిని ఆయన నిర్ణాయకమైనదిగా పరిగణించలేదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: మన చూపు నిలుపుతూ ఉండాలి
  rationale: ఇతర విషయాలనుంచి దృష్టిని మళ్లించి యేసుపై ఏకాగ్రంగా ఉంచడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. గ్రీకులో ఇది ముందరి వాక్యంలోని పరుగెత్తడాన్ని వివరించే participle అయినందున, తెలుగు పూర్తి వాక్యంగా చదవడానికి ‘ఉండాలి’ చేర్చబడింది.
- source_word: ἀρχηγὸν
  choice: మార్గం తెరిచినవాడు
  rationale: ఈ పదంలోని ఆరంభించేవాడు, ముందుగా వెళ్లి దారి చూపేవాడు అనే రెండు భావాలను ‘ఆద్యుడు’ వంటి అరుదైన పదం లేకుండా స్పష్టంగా అందిస్తుంది.
- source_word: τελειωτὴν
  choice: పరిపూర్ణతకు చేర్చేవాడు
  rationale: కేవలం ముగించడమే కాక ఉద్దేశించిన సంపూర్ణ స్థితికి తీసుకువెళ్లే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τῆς πίστεως
  choice: విశ్వాసానికి
  rationale: గ్రీకులో లేని ‘మన’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, విశ్వాసం అనే ప్రాథమిక అర్థాన్ని నిలుపుతుంది; ఇతర సాధ్యమైన భావాలు పాదసూచికలో ఉన్నాయి.
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: తన ముందు ఉంచబడిన ఆనందం నిమిత్తం
  rationale: ఆయన ఎదుట లక్ష్యంగా ఉన్న ఆనందాన్ని దృష్టిలో ఉంచుకొని బాధను సహించాడనే సందర్భోచిత భావాన్ని, ముందుంచబడినదనే పరుగు రూపకాన్ని నిలుపుతూ తెలుపుతుంది.
- source_word: ὑπέμεινεν σταυρὸν
  choice: సిలువను సహించాడు
  rationale: బాధలో స్థిరంగా నిలిచి భరించడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; సిలువ ఇక్కడ యేసు సిలువ మరణాన్ని సూచిస్తుంది.
- source_word: αἰσχύνης καταφρονήσας
  choice: దాని అవమానాన్ని లెక్కచేయలేదు
  rationale: సిలువ వల్ల కలిగే అపకీర్తిని నిర్ణాయకమైనదిగా పరిగణించలేదనే భావాన్ని స్పష్టంగా ఇస్తుంది; అవమానాన్ని మంచిదిగా భావించాడనే అపార్థాన్ని నివారిస్తుంది.
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: దేవుని సింహాసనం కుడివైపున
  rationale: అత్యున్నత గౌరవం, అధికారం గల స్థానాన్ని సూచించే కుడివైపు రూపకాన్ని మరియు గ్రీకు సంబంధ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: κεκάθικεν
  choice: కూర్చొని ఉన్నాడు
  rationale: కూర్చోవడం పూర్తయి దాని ఫలిత స్థితి కొనసాగుతోందని సూచించే గ్రీకు perfect కాల భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: τῆς πίστεως అనే పదబంధం యొక్క పరిధి
  choice: యేసు ‘విశ్వాసానికి మార్గం తెరిచినవాడూ దాన్ని పరిపూర్ణతకు చేర్చేవాడూ’ అని ప్రధాన పాఠ్యంలో అనువదించబడింది.
  alternative: ‘విశ్వసనీయతకు మార్గం తెరిచి దాన్ని పరిపూర్ణం చేసినవాడు’ లేదా ‘మన విశ్వాసానికి మార్గం తెరిచి దాన్ని పరిపూర్ణతకు చేర్చేవాడు.’
  rationale: πίστις ఇక్కడ విశ్వాసం, విశ్వసనీయత, లేదా విశ్వాసుల విశ్వాసం అనే భావాలను అనుమతించే సంక్షిప్త నిర్మాణంలో ఉంది. ప్రధాన పాఠ్యం గ్రీకులో లేని స్వామ్యాన్ని చేర్చకుండా సాధారణ అర్థాన్ని ఉంచుతుంది; నిజమైన సందిగ్ధత పాదసూచికలో భద్రపరచబడింది.
- issue: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς యొక్క భావం
  choice: తన ముందు ఉన్న ఆనందాన్ని భావి లక్ష్యంగా దృష్టిలో ఉంచుకొని యేసు సిలువను సహించాడు.
  alternative: తన ముందు ఉంచబడిన ఆనందాన్ని స్వీకరించడానికి బదులుగా యేసు సిలువను సహించాడు.
  rationale: ἀντί ‘బదులుగా’ అని కూడా అర్థమివ్వగలిగినా, ముందుంచబడిన లక్ష్యంవైపు సహనంతో పరుగెత్తాలనే విస్తృత సందర్భం భావి ఆనందం ప్రేరణగా ఉందనే పఠనానికి బలం ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘ఆద్యుడు,’ ‘పరిపూర్ణకర్త’ వంటి గాఢమైన మతపరమైన లేదా అరుదైన నామరూపాల బదులు క్రియాత్మక పదబంధాలు ఎంచుకోబడ్డాయి. వచనం ముందరి వాక్యంపై వ్యాకరణపరంగా ఆధారపడినా, విడిగా చదివినప్పుడు సంపూర్ణంగా ఉండేందుకు మొదటి ఉపవాక్యంలో ‘ఉండాలి’ వాడబడింది.
