  naturalness: The register is modern, clear, and suitable for public reading. A small postpositional adjustment in the final clause makes the location idiomatic and unambiguous in Telugu.
  terminology: “విశ్వాసం,” “సిలువ,” “అవమానం,” and “సింహాసనం” are appropriate, intelligible equivalents. The footnotes preserve the real ambiguity of τῆς πίστεως and the lexical nuance of καταφρονήσας without imposing a doctrinal reading.
  issues:
