id: HEB.12.14
reference: Hebrews 12:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: te
  text: అందరితో శాంతిని, పరిశుద్ధతను[a] పట్టుదలగా అనుసరించండి. పరిశుద్ధత లేకుండా ఎవరూ ప్రభువును చూడరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధీకరణ.” గ్రీకు పదం పరిశుద్ధ జీవన లక్షణాన్నిగానీ, పరిశుద్ధపరచబడే స్థితి లేదా ప్రక్రియనుగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: శాంతిగా ఉండేందుకు
  rationale: ఇక్కడ ‘అందరితో’ అనే పదబంధంతో కలిసి ఇది అంతరంగ భావాన్ని మాత్రమే కాకుండా, ఇతరులతో శాంతియుత సంబంధాల్లో జీవించడాన్ని సూచిస్తుంది.
- source_word: διώκετε
  choice: పట్టుదలగా కృషి చేయండి
  rationale: διώκωలో ఉన్న చురుకైన, నిరంతర ప్రయత్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; అక్షరార్థమైన ‘వెంటాడండి’ ఇక్కడ అసహజంగా వినిపిస్తుంది.
- source_word: μετὰ πάντων
  choice: అందరితో
  rationale: వ్యక్తులందరినీ చేర్చే విశ్వవ్యాప్త పరిధిని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: τὸν ἁγιασμόν
  choice: పరిశుద్ధతతో జీవించేందుకు
  rationale: ἁγιασμός పరిశుద్ధత అనే జీవన లక్షణాన్నీ, పరిశుద్ధపరచబడే స్థితి లేదా ప్రక్రియనూ సూచించగలదు. ప్రధాన పాఠ్యంలో ఉపదేశాత్మక సందర్భానికి సహజమైన ‘పరిశుద్ధతతో జీవించడం’ ఎంచుకొని, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: οὗ χωρὶς
  choice: ఆ పరిశుద్ధత లేకుండా
  rationale: సంబంధ సర్వనామం ἁγιασμόςను సూచిస్తుందని స్పష్టంగా తెలియజేస్తూ, మూలంలోని సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὐδεὶς
  choice: ఎవరూ
  rationale: సంపూర్ణ నిషేధాన్ని సహజమైన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: ὄψεται
  choice: చూడరు
  rationale: భవిష్యత్ అర్థాన్ని తెలుగు వాక్యంలోని నిషేధ క్రియారూపం సహజంగా వ్యక్తం చేస్తుంది; మరింత కావ్యాత్మకమైన పదాన్ని అనవసరంగా చేర్చదు.
- source_word: τὸν κύριον
  choice: ప్రభువును
  rationale: κύριος అనే బిరుదును నిలుపుతూ, అది తండ్రియైన దేవుణ్ణా యేసు ప్రభువునా అని అనువాదంలో నిర్ణయించదు.
theological_decisions:
- issue: ఉపదేశ సందర్భంలో ἁγιασμός అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘పరిశుద్ధతతో జీవించేందుకు’
  alternative: ‘పరిశుద్ధపరచబడేందుకు’ లేదా ‘పరిశుద్ధపరచబడడం’
  rationale: ఈ వాక్యం పట్టుదలతో అనుసరించాల్సిన పరిశుద్ధ జీవనాన్ని నొక్కిచెబుతుంది. అయితే మూలపదంలో స్థితి లేదా ప్రక్రియ భావం కూడా ఉండగలదు కాబట్టి దానిని పాదసూచికలో సంరక్షించాం.
- issue: ‘ప్రభువు’ ఎవరిని సూచిస్తుంది
  choice: ‘ప్రభువు’ అనే బిరుదునే నిలుపడం
  alternative: ‘దేవుడు’ లేదా ‘ప్రభువైన యేసు’ అని నిర్దిష్టం చేయడం
  rationale: గ్రీకు పాఠ్యం κύριος అని మాత్రమే చెబుతుంది. సాధ్యమైన సూచనను అనువాదం స్వయంగా పరిమితం చేయకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఉపదేశ శైలిని వాడాం. ‘వెంటాడండి’ అనే అక్షరార్థ రూపానికి బదులుగా διώκετεలోని తీవ్రతను ‘పట్టుదలగా కృషి చేయండి’ ద్వారా తెలిపాం. స్పష్టత కోసం రెండో వాక్యంలో ‘ఆ పరిశుద్ధత’ అని పునరుక్తి చేశాం.
