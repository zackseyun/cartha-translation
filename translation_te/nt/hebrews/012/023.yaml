revisions:
- from: పరలోకాల్లో నమోదు చేయబడిన మొదట పుట్టినవారి సమాజం దగ్గరికి[a], అందరికీ న్యాయాధిపతియైన దేవుని దగ్గరికి, పరిపూర్ణులుగా చేయబడిన నీతిమంతుల ఆత్మల దగ్గరికి మీరు వచ్చారు.
