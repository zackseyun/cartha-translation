id: HEB.12.23
reference: Hebrews 12:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: te
  text: పరలోకాల్లో[a] నమోదు చేయబడిన మొదట పుట్టినవారి సమాజం దగ్గరికి, అందరికీ తీర్పు తీర్చే దేవుని దగ్గరికి, పరిపూర్ణులుగా చేయబడిన నీతిమంతుల ఆత్మల దగ్గరికి మీరు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోకంలో నమోదు చేయబడిన.” గ్రీకులో “పరలోకాల్లో” అని బహువచనం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: సమాజం
  rationale: పరలోక సీయోను సందర్భంలో కూడిన ప్రజాసమూహాన్ని సూచిస్తుంది. ‘సంఘం’ అనే సంస్థాగత భావాన్ని అనవసరంగా ముందుకు తేవకుండా, ఆధునిక తెలుగులో సహజంగా ఉండే ‘సమాజం’ ఎంచుకోబడింది.
- source_word: πρωτοτόκων
  choice: మొదట పుట్టినవారి
  rationale: బహువచనంలోని సమూహార్థాన్ని స్పష్టంగా నిలుపుతుంది. ‘జ్యేష్ఠులు’ ఆధునిక తెలుగులో పెద్దలు లేదా వృద్ధులు అనే అపార్థాన్ని కలిగించవచ్చు; మూలంలో లేని ‘కుమారులు’ అనే లింగ-నిర్దిష్ట పదాన్ని కూడా చేర్చలేదు.
- source_word: ἀπογεγραμμένων
  choice: నమోదు చేయబడిన
  rationale: పూర్తయిన నమోదుతో కొనసాగుతున్న స్థితిని సూచించే పరిపూర్ణ కర్మణి కృదంత భావాన్ని నిలుపుతుంది; పౌర జాబితా లేదా రిజిస్టర్ దృశ్యాన్ని కూడా కాపాడుతుంది.
- source_word: ἐν οὐρανοῖς
  choice: పరలోకాల్లో
  rationale: గ్రీకు బహువచన రూపాన్ని నేరుగా నిలుపుతూ తెలుగులో అర్థమయ్యే విధంగా అనువదించబడింది. సహజమైన ఏకవచన ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: κριτῇ θεῷ πάντων
  choice: అందరికీ న్యాయాధిపతియైన దేవుడు
  rationale: θεῷ మరియు κριτῇ మధ్య ఉన్న సమానాధికార సంబంధాన్ని సహజమైన తెలుగులో చూపుతుంది; దేవుడే అందరి న్యాయాధిపతి అనే భావాన్ని నిలుపుతుంది.
- source_word: πνεύμασι
  choice: ఆత్మలు
  rationale: సాధారణ నిఘంటు అర్థాన్ని నిలుపుతుంది; దేవదూతలు లేదా ఇతర ఆత్మిక ప్రాణులు అని అనవసరంగా విస్తరించదు.
- source_word: δικαίων
  choice: నీతిమంతులు
  rationale: మానవ సమూహాన్ని లింగభేదం లేకుండా సహజంగా సూచిస్తుంది; మూలంలోని విశేషణాన్ని వ్యక్తులను సూచించే నామవాచక రూపంగా తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τετελειωμένων
  choice: పరిపూర్ణులుగా చేయబడిన
  rationale: కర్మణి భావాన్నీ, హెబ్రీయులకు పత్రికలోని పరిపూర్ణత లేదా సంపూర్ణత అంశాన్నీ నిలుపుతుంది. ఈ కృదంతం గ్రీకులో ‘నీతిమంతులు’ అనే పదంతో ఏకీభవిస్తుందనే విషయాన్ని తెలుగు నిర్మాణం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘మొదట పుట్టినవారు’ ఎవరు?
  choice: మొదట పుట్టినవారి హోదా లేదా వారసత్వంలో పాలుపొందే దేవుని ప్రజలను సూచించే సమూహ నామం
  alternative: క్రీస్తును ‘మొదట పుట్టినవాడు’గా సూచిస్తూ, సమాజం ఆయనకు చెందినదని అర్థం చేసుకోవడం
  rationale: πρωτοτόκων బహువచనంలో ఉండటం సమూహార్థాన్ని బలంగా సూచిస్తుంది. అనువాదం ఈ వ్యాకరణ రూపాన్ని అనుసరిస్తుంది; దానికంటే అధికమైన సిద్ధాంత వివరణను చేర్చదు.
- issue: ‘పరిపూర్ణులుగా చేయబడిన నీతిమంతుల ఆత్మలు’ అనే మాటకు సూచితులు
  choice: దేవుని సన్నిధిలో పరిపూర్ణ స్థితికి తీసుకురాబడిన నీతిమంతులైన మానవుల ఆత్మలు
  alternative: శరీరంతో ఉన్నా లేకున్నా నీతిమంతులందరికీ విస్తృత సూచన
  rationale: ‘నీతిమంతుల ఆత్మలు’ అనే పదబంధం మానవులను వారి ఆత్మిక స్థితిలో సూచించడం అత్యంత సహజం. అయితే మధ్యంతర స్థితి గురించి వాక్యం చెప్పనివి అనువాదంలో చేర్చబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ఈ వాక్యం ముందున్న ‘మీరు వచ్చారు’ అనే క్రియకు కొనసాగింపుగా ఉన్నందున, తెలుగులో అర్థసంపూర్ణత కోసం ఆ క్రియను చివర ఉంచాం. ‘దగ్గరికి’ అనే పునరుక్తి గ్రీకు దత్తివిభక్తి జాబితా నిర్మాణాన్ని స్పష్టంగా చూపుతుంది.
