source:
  edition: SBLGNT
  text: οὔπω μέχρις αἵματος ἀντικατέστητε πρὸς τὴν ἁμαρτίαν ἀνταγωνιζόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/004.yaml
  text: You have not yet resisted to the point of shedding blood in your struggle against sin,[a]
translation:
  language: te
  text: పాపానికి వ్యతిరేకంగా పోరాడుతున్న మీరు, రక్తం చిందించేంతవరకు ఇంకా ఎదిరించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఇంకా రక్తం వరకు ఎదిరించలేదు.” గ్రీకులో అక్షరార్థంగా “ఇంకా రక్తం వరకు మీరు ఎదిరించలేదు”; ఇది రక్తస్రావం జరిగేంత స్థాయి వరకు ప్రతిఘటించడాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: ఇంకా ... లేదు
  rationale: వివరించిన హద్దు ఇప్పటివరకు చేరుకోలేదనే కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μέχρις αἵματος
  choice: రక్తం చిందించేంతవరకు
  rationale: అక్షరార్థంగా ‘రక్తం వరకు’ అయిన ఈ గ్రీకు ప్రయోగం, రక్తస్రావం జరిగే స్థాయి వరకు ప్రతిఘటించడాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἀντικατέστητε
  choice: ఎదిరించలేదు
  rationale: రెండవ పురుష బహువచనంలోని క్రియను, వ్యతిరేకంగా నిలిచి ప్రతిఘటించడం అనే భావంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: పాపానికి వ్యతిరేకంగా
  rationale: πρός ఇక్కడ వ్యతిరేకతను సూచిస్తుంది. ‘పాపం’ అనే పదాన్ని నిర్దిష్టంగా మరింత పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἀνταγωνιζόμενοι
  choice: పోరాడుతున్న మీరు
  rationale: కొనసాగుతున్న పోటీ లేదా సంఘర్షణను సూచించే వర్తమాన కృదంత భావాన్ని, ప్రధాన క్రియతో సహజంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: ‘పాపం’ అనే పదం దేనిని సూచిస్తుంది?
  choice: ‘పాపం’ అని సాధారణంగానే అనువదించడం
  alternative: హింసించేవారి పాపపూరిత వ్యతిరేకత; సాధారణ పాపం; విశ్వాసాన్ని విడిచిపెట్టాలనే శోధన
  rationale: సమీప సందర్భంలో శత్రుత్వాన్ని సహించడం, పాపాన్ని తొలగించుకోవడం రెండూ ఉన్నాయి; అయితే ఈ వచనం దాని సూచనను ఒకే అర్థానికి పరిమితం చేయదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక విస్తృతత, ధార్మిక ఉద్వేగం నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పోరాడుతున్న’ అనే పదం సంఘర్షణ చిత్రాన్ని, ‘ఎదిరించలేదు’ ప్రధాన క్రియలోని ప్రతిఘటన భావాన్ని నిలుపుతున్నాయి.
