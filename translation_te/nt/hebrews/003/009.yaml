  text: where your fathers tested me by trial and saw my works[b][a],
translation:
  language: te
  text: అక్కడ మీ పితరులు నన్ను పరీక్షించి చూశారు[a], మరియు నా కార్యాలను చూశారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరీక్షలో నన్ను పరీక్షించారు” లేదా “నన్ను పరీక్షకు పెట్టారు.” ἐν δοκιμασίᾳ అనే గ్రీకు పదబంధం కఠినమైనది; అది పరీక్ష జరిగిన విధానాన్ని లేదా సాధనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని అనువాదాలు సందర్భంలోని విరోధార్థాన్ని స్పష్టం చేస్తూ, “నా కార్యాలను చూసినప్పటికీ” అని అనువదిస్తాయి. గ్రీకులో అక్షరార్థంగా “మరియు చూశారు” అని మాత్రమే ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: అక్కడ
  rationale: ముందటి వచనంలోని అరణ్య ప్రదేశాన్ని సూచించే సంబంధ క్రియావిశేషణం. స్థలార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπείρασαν
  choice: పరీక్షించారు
  rationale: ఇక్కడ దేవుణ్ణి రెచ్చగొట్టే విధంగా పరీక్షకు గురిచేయడాన్ని సూచిస్తుంది; మూలంలోని క్రియను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: οἱ πατέρες ὑμῶν
  choice: మీ పితరులు
  rationale: మూలంలోని పురుష బహువచనాన్ని, చారిత్రక-ఒడంబడిక సంబంధమైన భాషాశైలిని కాపాడుతుంది. ‘మీ పూర్వీకులు’ కూడా సాధ్యమే.
- source_word: ἐν δοκιμασίᾳ
  choice: పరీక్ష ద్వారా
  rationale: ἐν పదబంధానికి ఇక్కడ సాధనార్థం ఉండవచ్చు. మూలంలో ఒకే భావక్షేత్రానికి చెందిన పదాలు పునరుక్తమవుతున్న కఠినతను పూర్తిగా తొలగించకుండా తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ εἶδον
  choice: చూశారు
  rationale: గ్రీకులో ఉన్న సరళ సమన్వయాన్ని నిలుపుతుంది; సందర్భాన్ని బట్టి ‘చూసినప్పటికీ’ అని స్పష్టీకరించదు.
- source_word: τὰ ἔργα μου
  choice: నా కార్యాలను
  rationale: అరణ్యంలో దేవుడు చేసిన క్రియలను సూచించే ἔργα పదానికి గంభీరమైన, సహజమైన సమానార్థకం.
theological_decisions:
- issue: పరీక్షకు గురైన వ్యక్తి
  choice: నన్ను పరీక్షించారు
  alternative: పరీక్షించారు
  rationale: ఈ ఉపవాక్యంలో ‘నన్ను’ అనే కర్మ ప్రత్యక్షంగా లేకపోయినా, కీర్తన 95 ఉల్లేఖన సందర్భంలో మాట్లాడుతున్న దేవుడే సూచిత కర్మ. దాన్ని చేర్చడం తెలుగులో భావాన్ని స్పష్టం చేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని ప్రవేశపెట్టదు.
- issue: కార్యాలను చూసినదానికీ పరీక్షించినదానికీ మధ్య సంబంధం
  choice: నా కార్యాలను చూశారు
  alternative: నా కార్యాలను చూసినప్పటికీ
  rationale: సందర్భం విరోధార్థాన్ని సూచించగలిగినా, గ్రీకు καί కేవలం సమన్వయాన్ని తెలియజేస్తుంది. అందువల్ల ప్రధాన పాఠంలో విరోధార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన లేఖన శైలితో పాటు సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘పరీక్ష ద్వారా నన్ను పరీక్షించారు’ అనే స్వల్ప పునరుక్తి మూలంలోని కఠినమైన పదబంధాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
