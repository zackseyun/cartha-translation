  source_fidelity: గ్రీకు వచనంలోని తార్కిక అనుసంధానం (Διό), ఉద్ధరణ-పరిచయ సూత్రం (καθὼς λέγει), పరిశుద్ధాత్మకు నేరుగా ఆపాదించిన మాట, అలాగే కీర్తన ఉద్ధరణలోని షరతు అన్నీ నమ్మకంగా ప్రతిఫలించాయి. ‘వింటే’ అనేది ἐὰν … ἀκούσητεకు సహజమైన, అతివ్యాఖ్యానం చేయని అనువాదం.
  naturalness: ‘కాబట్టి, పరిశుద్ధాత్మ చెబుతున్నట్లుగా’ ఆధునిక ప్రామాణిక తెలుగులో అర్థవంతమైన ఉద్ధరణ-పరిచయ రూపం. ‘ఈ రోజు మీరు ఆయన స్వరం వింటే’ కూడా సహజంగా ఉంది. ఉద్ధరణ తదుపరి వచనంలో కొనసాగుతున్నందున చివరి కామా సరైనది.
