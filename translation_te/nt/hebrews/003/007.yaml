id: HEB.3.7
reference: Hebrews 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: te
  text: 'కాబట్టి, పరిశుద్ధాత్మ చెబుతున్నట్లుగా:

    “ఈ రోజు మీరు ఆయన స్వరం వింటే,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: καθὼς
  choice: చెబుతున్నట్లుగా
  rationale: ఉద్ధరణను పరిచయం చేసే పోలికా సూత్రాన్ని తెలుగులో సహజంగా నిలుపుతుంది; λέγειతో కలిపి చదివినప్పుడు సులభంగా ప్రవహిస్తుంది.
- source_word: λέγει
  choice: చెబుతున్నాడు
  rationale: గ్రీకు వర్తమాన కాలాన్ని నిలుపుతూ, లేఖన వాక్కు ప్రస్తుతం పలుకుతున్నదనే ఉద్ధరణ సూత్రంలోని సజీవత్వాన్ని వ్యక్తపరుస్తుంది.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: ఈ నిర్దిష్ట గ్రీకు పదబంధానికి స్థిరమైన, ఖచ్చితమైన తెలుగు సమానార్థకం; మూలంలో లేని అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: Σήμερον
  choice: ఈ రోజు
  rationale: కీర్తన ఉద్ధరణలోని కాలవాచక క్రియావిశేషణాన్ని స్పష్టమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: ἐὰν
  choice: వింటే
  rationale: షరతును తెలుగులో సహజమైన క్రియా-షరతు రూపంతో వ్యక్తపరుస్తుంది.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: ఆయన స్వరం
  rationale: ἀκούωతో ఉన్న సంబంధాన్ని సహజంగా అందిస్తూ, వ్యక్తిగత వాక్కు అనే భావాన్ని నిలుపుతుంది.
- source_word: ἀκούσητε
  choice: మీరు ... వింటే
  rationale: అనిశ్చిత షరతులోని aorist subjunctive రూపాన్ని అతివ్యాఖ్యానం చేయకుండా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘లోబడితే’ అని మార్చదు.
theological_decisions:
- issue: కీర్తన ఉద్ధరణ పలికినవారి నిర్దేశం
  choice: ఉద్ధరణను పరిశుద్ధాత్మ ప్రస్తుతం చెబుతున్న మాటగా నేరుగా పరిచయం చేయడం.
  alternative: పరిశుద్ధాత్మ లేఖనం ద్వారా లేదా కీర్తనకర్త ద్వారా చెబుతున్నాడని విస్తరించడం.
  rationale: గ్రీకు పాఠం నేరుగా ‘పరిశుద్ధాత్మ చెబుతున్నాడు’ అంటుంది. అనువాదం ఆ నిర్దేశాన్ని తగ్గించకుండా, ప్రేరణ సిద్ధాంతంపై మూలంలో లేని వివరణను జోడించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘చెబుతున్నట్లుగా’ అనే రూపం వర్తమాన ఉద్ధరణ సూత్రాన్ని సహజంగా అందిస్తుంది. వాక్యం తదుపరి వచనంలో కొనసాగే కీర్తన ఉద్ధరణ కావడంతో చివర కామాను నిలిపాం.
