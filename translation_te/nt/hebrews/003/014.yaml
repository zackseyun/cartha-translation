id: HEB.3.14
reference: Hebrews 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: te
  text: ఎందుకంటే, మన ఆరంభపు ధైర్యవిశ్వాసాన్ని[b] చివరివరకు దృఢంగా నిలుపుకుంటేనే, మనం మెస్సీయలో భాగస్థులమయ్యాం.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయలో పాలుపంచుకునేవారమయ్యాం” లేదా “మెస్సీయతో భాగస్వాములమయ్యాం.”
    reason: lexical_alternative
  - marker: b
    text: “ధైర్యవిశ్వాసం” అని అనువదించిన గ్రీకు పదానికి “నమ్మకం” లేదా “భరోసా” అని కూడా అర్థం రావచ్చు; కొన్ని సందర్భాల్లో “సారం” లేదా “వాస్తవికత” అనే అర్థం కూడా ఉంటుంది.
    reason: lexical_alternative
  - marker: c
    text: మరింత పదబద్ధంగా, “మన ధైర్యవిశ్వాసపు ఆరంభాన్ని చివరివరకు దృఢంగా నిలుపుకుంటేనే.”
    reason: previous_rendering
lexical_decisions:
- source_word: μέτοχοι
  choice: పాలుపంచుకునేవారు
  rationale: క్రీస్తుతో నిజమైన భాగస్వామ్యం లేదా పాలుపొందడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం సహచరులు అనే బలహీన భావాన్ని నివారిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు ఈ వాక్యం కారణం లేదా వివరణను ఇస్తున్న అనుసంధానాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది. μέτοχοι తో ఉన్న జనిటివ్ సంబంధాన్ని సహజ తెలుగులో భాగస్వామ్య భావంతో ‘మెస్సీయలో’ అని వ్యక్తం చేశాం.
- source_word: γεγόναμεν
  choice: అయ్యాం
  rationale: గతంలో సంభవించి ప్రస్తుతం కొనసాగుతున్న స్థితిని సూచించే పరిపూర్ణ కాల భావాన్ని సందర్భంలో తెలియజేస్తుంది.
- source_word: ἐάνπερ
  choice: ఉంటేనే
  rationale: సాధారణ ‘ఉంటే’ కంటే షరతుకు ఉన్న ఉద్ఘాటనను తెలియజేస్తుంది; అయితే దాని సిద్ధాంతపరమైన అర్థాన్ని అదనంగా నిర్ణయించదు.
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: మనకు మొదట ఉన్న నమ్మకాన్ని
  rationale: పదబద్ధమైన ‘నమ్మకం యొక్క ఆరంభం’ తెలుగులో అసహజంగా ఉంటుంది. ఈ పదబంధం ఆరంభంలో కలిగిన దృఢ నమ్మకాన్ని సూచిస్తుందని సహజంగా వ్యక్తం చేశాం; ὑπόστασις యొక్క విస్తృత అర్థపరిధిని పాదటిప్పణిలో నిలిపాం.
- source_word: μέχρι τέλους
  choice: చివరివరకు
  rationale: పూర్తి కాలవ్యాప్తిలో నిలకడగా కొనసాగడాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: βεβαίαν κατάσχωμεν
  choice: స్థిరంగా పట్టుకొని ఉంటే
  rationale: βεβαίαν లోని దృఢత్వాన్ని, κατάσχωμεν లోని నిలుపుకొని ఉండే భావాన్ని కలిపి సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: షరతు మరియు చివరివరకు నిలకడ
  choice: ‘ఉంటేనే’ అనే నిజమైన, ఉద్ఘాటిత షరతును యథాతథంగా ఉంచడం
  alternative: చివరివరకు నిలకడ మొదటి భాగస్వామ్యానికి కేవలం సాక్ష్యమని లేదా భాగస్వామ్యాన్ని కొనసాగించే కారణమని స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం షరతును ఉంచుతుంది గాని, నిలకడ మరియు మెస్సీయలో భాగస్వామ్యం మధ్య ఖచ్చితమైన సిద్ధాంత యాంత్రికతను తేల్చదు. అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
- issue: τοῦ Χριστοῦ తో μέτοχοι సంబంధం
  choice: ‘మెస్సీయలో పాలుపంచుకునేవారు’
  alternative: ‘మెస్సీయను పంచుకునేవారు’ లేదా ‘మెస్సీయకు భాగస్వాములు’
  rationale: జనిటివ్ నిర్మాణం భాగస్వామ్య సంబంధాన్ని సూచించినా దాని సూక్ష్మ స్వరూపంలో కొంత సందిగ్ధత ఉంది. ప్రధాన పాఠం సహజమైన తెలుగు రూపాన్ని ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘క్రీస్తు’కు బదులుగా మూలంలో బిరుదు భావాన్ని చూపించేందుకు ‘మెస్సీయ’ వాడబడింది. ప్రధాన వాక్యంలో మూడు పాదటిప్పణి సూచికలు సంబంధిత భావాల తరువాత ఉంచబడ్డాయి.
