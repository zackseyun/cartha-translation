source:
  edition: SBLGNT
  text: πᾶς γὰρ οἶκος κατασκευάζεται ὑπό τινος, ὁ ⸀δὲ πάντα κατασκευάσας θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: te
  text: ఎందుకంటే, ప్రతి ఇల్లు ఎవరో ఒకరి చేత కట్టబడుతుంది; అయితే అన్నిటినీ కట్టినవాడు దేవుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: ప్రతి
  rationale: ఏకవచనమైన οἶκος‌తో πᾶς విభజనార్థకంగా ఉంది; అందువల్ల ‘ప్రతి ఇల్లు’ సహజంగా, సరిగ్గా ఉంటుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు కారణం లేదా వివరణను పరిచయం చేసే γάρ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἶκος
  choice: ఇల్లు
  rationale: సందర్భంలోని నిర్మాణ రూపకాన్ని నిలుపుతుంది; ‘కుటుంబం’ అని అనువదిస్తే ఇక్కడ రూపకాన్ని ముందుగానే వ్యాఖ్యానించినట్లవుతుంది.
- source_word: κατασκευάζεται
  choice: కట్టబడుతుంది
  rationale: వర్తమాన కర్మణి రూపాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, ఇంటి నిర్మాణ చిత్రాన్ని నిలుపుతుంది.
- source_word: ὑπό τινος
  choice: ఎవరో ఒకరి చేత
  rationale: ὑπό కర్తృత్వాన్ని, τις అనిర్దిష్ట వ్యక్తిని సూచిస్తాయి; ఈ రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ δὲ
  choice: అయితే … వాడు
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; ὁ మరియు కృదంతం కలసిన నామవాచక బలాన్ని ‘వాడు’ నిలుపుతుంది.
- source_word: πάντα
  choice: అన్నిటినీ
  rationale: πάντα యొక్క సమగ్ర పరిధిని అదనపు తాత్త్విక వివరణ లేకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κατασκευάσας
  choice: కట్టిన
  rationale: మొదటి κατασκευάζεται‌తో పదచిత్ర సంబంధాన్ని నిలుపుతూ, నిర్మించిన కర్తను సూచిస్తుంది.
- source_word: θεός
  choice: దేవుడు
  rationale: అన్నిటినీ కట్టినవాడిని దేవుడిగా గుర్తించే గ్రీకు వాక్యంలోని స్పష్టమైన నిర్ధారణను తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో దేవుడు అన్నిటినీ కట్టినవాడని చేసే గుర్తింపు
  choice: అన్నిటినీ కట్టినవాడు దేవుడు
  alternative: దేవుడే అన్నిటినీ కట్టినవాడు
  rationale: గ్రీకు పదక్రమం మరియు విధేయ గుర్తింపును నిలుపుతుంది. ‘దేవుడే’ అనడం సందర్భానికి అనుకూలమైనప్పటికీ, మూలంలో లేని ప్రత్యేక ఉద్ఘాటనను చేర్చే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం. ‘నిర్మించబడుతుంది’ కంటే ‘కట్టబడుతుంది’ ఇంటి రూపకానికి సహజంగా ఉంది. ఈ వచనంలో తెలుగు పాఠానికి అవసరమైన పాఠాంతర గమనిక లేదు; ఇంగ్లీషు ‘someone / everything’ గమనిక తెలుగు అనువాదంలో వర్తించదు.
