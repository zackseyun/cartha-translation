  source_fidelity: ‘ప్రతి ఇల్లు’ πᾶς οἶκος యొక్క విభజనార్థాన్ని, ‘ఎవరో ఒకరి చేత కట్టబడుతుంది’ వర్తమాన కర్మణి క్రియను మరియు ὑπό τινος సూచించే కర్తృత్వాన్ని సరిగ్గా ఇస్తుంది. ‘అయితే అన్నిటినీ కట్టినవాడు దేవుడు’ δέ ద్వారా వచ్చే వాదనాత్మక మలుపును, అలాగే దేవుడే సమస్తాన్ని నిర్మించినవాడని గ్రీకు వాక్యంలోని గుర్తింపును నమ్మకంగా తెలియజేస్తుంది. ‘కట్టిన’ అనే పదం ఇంటి ఉదాహరణకూ, దాని విస్తృత సారూప్యానికీ తగిన పదచిత్ర అనుసంధానాన్ని ఉంచుతుంది.
