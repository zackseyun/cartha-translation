source:
  edition: SBLGNT
  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: te
  text: తిరుగుబాటు సమయంలో చేసినట్లుగా, అరణ్యంలో పరీక్ష జరిగిన రోజున చేసినట్లుగా, మీ హృదయాలను కఠినపరచకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, కీర్తన 95:8 వెనుకనున్న హీబ్రూ స్థలనామాలను అనుసరించి: “మెరీబా వద్ద చేసినట్లుగా, అరణ్యంలో మస్సా రోజున చేసినట్లుగా.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: కఠినపరచుకోకండి
  rationale: μήతో కూడిన ఏఓరిస్ట్ క్రియ ప్రత్యక్ష నిషేధాన్ని వ్యక్తం చేస్తుంది. తెలుగులో ‘కఠినపరచుకోకండి’ సహజంగా ఉండి, శ్రోతల బాధ్యతాయుత స్పందనను సూచిస్తుంది.
- source_word: τὰς καρδίας ὑμῶν
  choice: మీ హృదయాలను
  rationale: బహువచన సమాజాన్ని నేరుగా ఉద్దేశిస్తుంది. ‘హృదయాలు’ భావోద్వేగాలనే కాక ఆలోచన, సంకల్పం, అంతరంగ వైఖరిని సూచించే స్థిరమైన బైబిలు పదం.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: తిరుగుబాటు చేసినప్పుడు చేసినట్లుగా
  rationale: παραπικρασμός దేవునికి విరోధంగా చేసిన రెచ్చగొట్టే తిరుగుబాటును సూచిస్తుంది. సంఘటననామాన్ని తెలుగులో కేవలం ‘తిరుగుబాటులో’ అని కాక, హృదయాలను కఠినపరచే చర్యతో సహజంగా అనుసంధానించేందుకు ఈ నిర్మాణం ఎంచుకోబడింది.
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: పరీక్షించిన రోజున చేసినట్లుగా
  rationale: κατά ఇక్కడ పోలికను కొనసాగిస్తుంది; πειρασμός సందర్భంలో ఇశ్రాయేలీయులు దేవుణ్ణి పరీక్షించిన చారిత్రక సంఘటనను సూచిస్తుంది. ‘పరీక్షించిన రోజు’ సహజమైన తెలుగు, అలాగే ‘శోధన’ వల్ల కలిగే అంతర్గత ప్రలోభ భావాన్ని నివారిస్తుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: ఇశ్రాయేలు సంచారానికి సంబంధించిన బైబిలు నేపథ్యాన్ని ‘అరణ్యం’ స్పష్టంగా, గౌరవప్రదంగా నిలుపుతుంది.
theological_decisions:
- issue: కీర్తన 95లోని చారిత్రక సూచనను ఎలా అనువదించాలి
  choice: గ్రీకు పాఠంలోని సంఘటనార్థక పదాలను ‘తిరుగుబాటు’ మరియు ‘పరీక్షించిన రోజు’గా ప్రధాన పాఠంలో అనువదించడం
  alternative: ‘మెరీబా దగ్గర చేసినట్లుగా, అరణ్యంలో మస్సా రోజున చేసినట్లుగా’ అని హీబ్రూ స్థలనామాలతో ఇవ్వడం
  rationale: హెబ్రీయులకు పత్రికలో ఉన్న గ్రీకు పాఠం హీబ్రూ స్థలనామాలకు బదులుగా వాటి భావాలను తెలిపే నామవాచకాలను ఉపయోగిస్తుంది. అందువల్ల ప్రధాన పాఠం గ్రీకు రూపాన్ని అనుసరిస్తుంది; హీబ్రూ నేపథ్యాన్ని పాదసూచికలో ఉంచడం ద్వారా రెండు స్థాయిల ఆధారాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సమాజాన్ని గౌరవంగా నేరుగా ఉద్దేశించే బహువచన రూపం వాడబడింది. వాక్యంలోని రెండు పోలికా భాగాల సమాంతరతను ‘చేసినట్లుగా’ అనే పునరుక్తితో నిలిపి, శాస్త్రోక్త గంభీరతతో పాటు సాధారణ పాఠకులకు సహజత్వాన్ని కాపాడాం.
