  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: te
  text: కాబట్టి, పవిత్ర సహోదరులారా[a], పరలోక పిలుపులో భాగస్థులైనవారలారా[b], మన ఒప్పుకోలుకు అపొస్తలుడూ ప్రధాన యాజకుడూ అయిన యేసును శ్రద్ధగా ఆలోచించండి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘సహోదరులు’ అనే సంబోధన స్త్రీలతో సహా విశ్వసించే సమాజమంతటినీ ఉద్దేశిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా ‘పరలోక సంబంధమైన పిలుపులో పాలుపంచుకున్నవారలారా.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మనం ఒప్పుకొనే యేసును—అపొస్తలుడూ ప్రధాన యాజకుడూ అయిన ఆయనను—శ్రద్ధగా ఆలోచించండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి, ముఖ్యంగా 2:17–18 నుంచి, తీసుకొనే నిర్ధారణను సూచించే సహజమైన తెలుగు అనుసంధాన పదం.
- source_word: ἀδελφοὶ ἅγιοι
  choice: పవిత్ర సహోదరులారా
  rationale: సంబోధన రూపాన్నీ, దేవునికి ప్రత్యేకించబడిన సమాజమనే భావాన్నీ నిలుపుతుంది. గ్రీకు పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అది స్త్రీలను కూడా కలుపుకొని విశ్వాస సమాజమంతటినీ ఉద్దేశిస్తుందని పాదసూచికలో తెలిపాం.
- source_word: κλήσεως ἐπουρανίου
  choice: పరలోక పిలుపు
  rationale: దేవుని పిలుపు అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘పరలోక’ అనే పదం దాని మూలాన్నీ స్వభావాన్నీ సూచించగల అసలు భావవిస్తృతిని కాపాడుతుంది.
- source_word: μέτοχοι
  choice: భాగస్థులైనవారు
  rationale: ఒక దానిలో నిజంగా భాగం పంచుకోవడం అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατανοήσατε
  choice: శ్రద్ధగా ఆలోచించండి
  rationale: యేసుపై దృష్టి నిలిపి జాగ్రత్తగా పరిశీలించాలనే ఆజ్ఞ యొక్క బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπόστολον
  choice: అపొస్తలుడు
  rationale: దేవునిచేత పంపబడినవాడనే నేపథ్యాన్ని కలిగిన అసలు బిరుదును నిలుపుతుంది; దానిని కేవలం ‘దూత’గా వివరణాత్మకంగా మార్చదు.
- source_word: ἀρχιερέα
  choice: ప్రధాన యాజకుడు
  rationale: యూదుల ఆరాధనా వ్యవస్థలోని పదవికి, హెబ్రీయులకు పత్రికలోని ప్రధాన అంశానికి సరిపడే స్థిరమైన తెలుగు పదబంధం.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: మన విశ్వాస ప్రకటనకు
  rationale: సమాజం బహిరంగంగా ఒప్పుకొని ప్రకటించే విశ్వాసం అనే భావాన్ని అందిస్తుంది. ఈ షష్ఠీ విభక్తి పదబంధాన్ని రెండు బిరుదులతో సంబంధపరుస్తూ, సాధ్యమైన ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో నిలిపాం.
- source_word: Ἰησοῦν
  choice: యేసు
  rationale: Ἰησοῦς అనే వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
theological_decisions:
- issue: ἀδελφοὶ అనే లింగసూచక సంబోధన
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’ అని ఉంచి, సమస్త విశ్వాస సమాజాన్ని ఉద్దేశించే సమగ్ర భావాన్ని పాదసూచికలో వివరించడం.
  alternative: ‘సహోదర సహోదరీలారా’ అని అనువదించడం.
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పురుష బహువచనమైనప్పటికీ, సందర్భంలో స్త్రీలతో సహా విశ్వాసులందరినీ ఉద్దేశిస్తుంది. ప్రధాన పాఠ్యం మూలరూపాన్ని గౌరవిస్తుండగా పాదసూచిక దాని సందర్భానుగుణ విస్తృతిని స్పష్టం చేస్తుంది.
- issue: యేసుకు వర్తింపజేసిన ἀπόστολος
  choice: ‘అపొస్తలుడు’ అనే బిరుదును నిలుపడం.
  alternative: ‘పంపబడినవాడు’ లేదా ‘దూత’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: వాక్యం ఈ బిరుదును యేసుకు ప్రత్యక్షంగా వర్తింపజేస్తుంది. దాన్ని నిలుపడం ద్వారా ఆయనను పంపిన దేవునితో ఉన్న సంబంధమూ, పత్రికలోని ప్రత్యేకమైన సాహిత్య-దైవశాస్త్ర బలమూ కాపాడబడతాయి.
- issue: τῆς ὁμολογίας ἡμῶν యొక్క అన్వయం
  choice: ‘మన విశ్వాస ప్రకటనకు అపొస్తలుడూ ప్రధాన యాజకుడూ’ అని రెండు బిరుదులతో అనుసంధానించడం.
  alternative: ‘మనం ఒప్పుకొనే యేసును—అపొస్తలుడూ ప్రధాన యాజకుడూ అయిన ఆయనను’ అని అర్థం చేసుకోవడం.
  rationale: గ్రీకు నిర్మాణం సహజంగా ὁμολογίαςను రెండు బిరుదులతో అనుసంధానించగలదు; అయితే ‘మనం ఒప్పుకొనే వ్యక్తి’ అనే అర్థసంభావ్యతను పూర్తిగా తొలగించకుండా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సంఘ పఠనానికి అనువైన శైలి. ‘అపొస్తలుడు’, ‘ప్రధాన యాజకుడు’, ‘విశ్వాస ప్రకటన’ వంటి పరిచితమైన బైబిలు పదజాలాన్ని ఉపయోగించినప్పటికీ వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం.
