revisions:
- from: ఎందుకంటే, ఇంటికంటే దాన్ని నిర్మించినవాడికి ఎంత ఎక్కువ గౌరవం ఉంటుందో, అంత ఎక్కువ మహిమకు ఈయన మోషేకంటే అర్హుడిగా ఎంచబడ్డాడు.
  to: ఎందుకంటే, ఇంటికంటే దాన్ని నిర్మించినవాడికి ఎంత ఎక్కువ గౌరవం ఉంటుందో, అంత ఎక్కువ మహిమకు ఈయన మోషేకంటే అర్హుడిగా పరిగణించబడ్డాడు.
  rationale: The sole revision removes the unwarranted “chosen” nuance and renders ἠξίωται as being considered worthy. The source’s anaphoric “ఈయన,” the unstated identity of the builder, the distinction between glory and honor, and the proportional comparison are retained.
