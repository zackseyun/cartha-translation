review_pass:
  verdict: revise
  source_fidelity: 'The comparison and causal logic are accurately represented: this one has greater glory than Moses in proportion to the greater honor of the house''s builder over the house. However, “అర్హుడిగా ఎంచబడ్డాడు” adds the sense of being selected/chosen, which is not conveyed by ἠξίωται (“has been considered/counting worthy”).'
  naturalness: The Telugu is clear and suitably formal. Recasting the perfect passive as “అర్హుడిగా పరిగణించబడ్డాడు” is both natural modern Telugu and closer to the Greek.
  terminology: “మహిమ” for δόξα and “గౌరవం” for τιμή appropriately preserve the source’s lexical distinction. “ఇల్లు/ఇంటికంటే” and “నిర్మించినవాడు” retain the house-and-builder image without prematurely identifying the builder.
  issues:
  - severity: medium
    issue: “అర్హుడిగా ఎంచబడ్డాడు” for ἠξίωται
    rationale: ఎంచబడ్డాడు means “was chosen/selected,” introducing an action not present in the Greek. The perfect passive concerns being regarded or deemed worthy.
  revised_text: ఎందుకంటే, ఇంటికంటే దాన్ని నిర్మించినవాడికి ఎంత ఎక్కువ గౌరవం ఉంటుందో, అంత ఎక్కువ మహిమకు ఈయన మోషేకంటే అర్హుడిగా పరిగణించబడ్డాడు.
  revised_footnotes: []
  revision_rationale: The sole revision removes the unwarranted “chosen” nuance and renders ἠξίωται as being considered worthy. The source’s anaphoric “ఈయన,” the unstated identity of the builder, the distinction between glory and honor, and the proportional comparison are retained.
