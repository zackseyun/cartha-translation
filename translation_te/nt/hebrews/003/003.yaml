id: HEB.3.3
reference: Hebrews 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: te
  text: ఎందుకంటే, ఇంటికంటే దాన్ని నిర్మించినవాడికి ఎంత ఎక్కువ గౌరవం ఉంటుందో, అంత ఎక్కువ మహిమకు ఈయన మోషేకంటే అర్హుడిగా పరిగణించబడ్డాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: ఈయన
  rationale: మునుపటి వాక్యంలో ప్రస్తావించిన యేసును గౌరవప్రదంగా సూచిస్తూ, గ్రీకు సూచన సర్వనామాన్ని స్పష్టీకరించకుండా అలాగే నిలుపుతుంది.
- source_word: δόξης
  choice: మహిమ
  rationale: దైవశాస్త్ర సందర్భంలో సహజమైన పదం; τιμήతో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: ἠξίωται
  choice: అర్హుడిగా ఎంచబడ్డాడు
  rationale: ‘అర్హుడిగా పరిగణించబడ్డాడు/గౌరవించబడ్డాడు’ అనే పరిపూర్ణ కర్మణి భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: καθ’ ὅσον
  choice: ఎంత ... అంత
  rationale: ఇక్కడ ఉన్న పరిమాణానుసార పోలికను తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τιμὴν
  choice: గౌరవం
  rationale: δόξα (‘మహిమ’) నుండి పదార్థ భేదాన్ని నిలుపుతుంది.
- source_word: τοῦ οἴκου
  choice: ఇంటికంటే
  rationale: οἶκος యొక్క రూపక ప్రయోగాన్ని ‘ఇల్లు’ అనే మూలచిత్రంతో కాపాడుతుంది.
- source_word: ὁ κατασκευάσας αὐτόν
  choice: దాన్ని నిర్మించినవాడు
  rationale: κατασκευάζωను సందర్భానుసారంగా ‘నిర్మించు’ అని అనువదించి, కర్తను నిర్దిష్టంగా గుర్తించకుండా మూలంలోని రూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘ఈయన’ ఎవరిని సూచిస్తున్నాడనే విషయం
  choice: పాఠ్యంలో ‘ఈయన’ అని మాత్రమే ఉంచడం
  alternative: ‘యేసు’ లేదా ‘క్రీస్తు’ అని స్పష్టీకరించడం
  rationale: సందర్భం యేసును సూచించినప్పటికీ, మూలపాఠ్యంలో οὗτος మాత్రమే ఉంది; పేరును చేర్చకుండా మూలంలోని అనాఫోరిక సూచనను కాపాడాం.
- issue: నిర్మించినవాడి గుర్తింపు
  choice: ‘దాన్ని నిర్మించినవాడు’ అని అనిర్దిష్టంగా ఉంచడం
  alternative: ‘దేవుడు’ లేదా ‘క్రీస్తు’ అని పేర్కొనడం
  rationale: ఈ వాక్యం స్వయంగా నిర్మించినవాడిని పేరుతో గుర్తించదు; తరువాతి వాక్యంతో ఏర్పడే దైవశాస్త్ర ఉద్వేగాన్ని ముందుగానే పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన లేఖన శైలి. గ్రీకు వాక్యంలోని కారణసూచకతను ‘ఎందుకంటే’తో, పరిమాణ పోలికను ‘ఎంత...అంత’ నిర్మాణంతో సహజంగా అందించింది.
