revisions:
- from: 'ఇలా చెప్పబడుతుండగా: “నేడు మీరు ఆయన స్వరం వింటే, తిరుగుబాటు చేసినప్పుడు చేసినట్లుగా మీ హృదయాలను కఠినపరచుకోకండి.”[a]'
  to: 'ఇలా చెప్పబడుతుండగా: “నేడు మీరు ఆయన స్వరం వింటే, తిరుగుబాటు సమయంలోలాగా మీ హృదయాలను కఠినపరచవద్దు.”[a]'
  rationale: The revision retains the ongoing-citation sense of ἐν τῷ λέγεσθαι, the conditional urgency of “నేడు,” and the biblical metaphor of hardened hearts. It changes the final comparison to an event-based expression corresponding to ὡς ἐν τῷ παραπικρασμῷ, while preserving “provocation” as a lexical alternative in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:03:20Z'
review_pass:
  verdict: revise
  source_fidelity: The conditional exhortation and the Psalm 95 allusion are substantially represented. However, “తిరుగుబాటు చేసినప్పుడు చేసినట్లుగా” recasts ὡς ἐν τῷ παραπικρασμῷ (“as/in the rebellion”) as an explicit action by the hearers and is needlessly repetitive. Rendering the phrase as a temporal/event comparison preserves the Greek construction and allusion more closely.
  naturalness: '“ఇలా చెప్పబడుతుండగా” is understandable and suitably reflects the ongoing passive citation. The revised wording is more idiomatic in the quotation: “తిరుగుబాటు సమయంలోలాగా” avoids the awkward repetition of “చేసినప్పుడు చేసినట్లుగా,” and “కఠినపరచవద్దు” is a direct, natural prohibition.'
  terminology: “హృదయాలు” appropriately retains the biblical inner-person metaphor. “తిరుగుబాటు” is a valid modern rendering of παραπικρασμός; the footnote retains the alternative sense of provoking God without treating it as the sole meaning.
  issues:
  - severity: medium
    issue: The phrase “తిరుగుబాటు చేసినప్పుడు చేసినట్లుగా” does not directly represent “as in the rebellion.”
    rationale: The Greek points to the wilderness event/state (ἐν τῷ παραπικρασμῷ), not explicitly to an action formulated as “when [you] rebelled, as [you] did.” The Telugu is also stylistically redundant.
  revised_text: 'ఇలా చెప్పబడుతుండగా: “నేడు మీరు ఆయన స్వరం వింటే, తిరుగుబాటు సమయంలోలాగా మీ హృదయాలను కఠినపరచవద్దు.”[a]'
  revised_footnotes:
