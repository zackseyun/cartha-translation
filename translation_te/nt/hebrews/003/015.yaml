source:
  edition: SBLGNT
  text: ἐν τῷ λέγεσθαι· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, Μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/015.yaml
  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: te
  text: 'ఇలా చెప్పబడుతుండగా: “నేడు మీరు ఆయన స్వరం వింటే, తిరుగుబాటు సమయంలోలాగా మీ హృదయాలను కఠినపరచవద్దు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుణ్ణి రెచ్చగొట్టిన సమయంలోలాగా.” ఇది కీర్తన 95లోని ఉటంకింపుకు సంప్రదాయంగా ఇచ్చే భావాన్ని ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: ఇలా చెప్పబడుతుండగా
  rationale: ἐν తో కూడిన వర్తమాన కర్మణి infinitive కాలసంబంధమైన, కొనసాగుతున్న ఉటంకింపును సూచిస్తుంది. తెలుగు సహజత్వంతో పాటు ఆ కొనసాగుతున్న భావాన్ని నిలుపుతుంది.
- source_word: Σήμερον
  choice: నేడు
  rationale: ఉటంకించిన కీర్తనలోని తక్షణతను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: మీరు ఆయన స్వరం వింటే
  rationale: షరతును స్పష్టంగా ఉంచి, దేవుని వ్యక్తిగత పిలుపును యథాతథంగా నిలుపుతుంది.
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: మీ హృదయాలను కఠినపరచుకోకండి
  rationale: నిషేధాత్మక ఆజ్ఞను నేరుగా అందిస్తుంది; ‘హృదయాలు’ అంతరంగ వ్యక్తిత్వాన్ని సూచించే బైబిలు రూపకాన్ని కాపాడుతుంది.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: తిరుగుబాటు చేసినప్పుడు చేసినట్లుగా
  rationale: అరణ్యంలో ఇశ్రాయేలు దేవునికి ఎదురుతిరిగిన సందర్భాన్ని ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; పదానికి ఉన్న ‘రెచ్చగొట్టడం/ఆగ్రహం పుట్టించడం’ అనే ప్రత్యామ్నాయ ఛాయను పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: παραπικρασμός పదం ద్వారా కీర్తన 95లోని అరణ్య సంఘటనకు సూచన
  choice: తిరుగుబాటు చేసినప్పుడు
  alternative: రెచ్చగొట్టినప్పుడు / ఆగ్రహం పుట్టించినప్పుడు
  rationale: ఈ పదం కేవలం దేవునిలో ప్రతిస్పందన కలిగించడమే కాక, ఇశ్రాయేలు అవిధేయతతో కూడిన ఎదురుతిరుగుదలను సూచిస్తుంది. ‘తిరుగుబాటు’ ఆధునిక తెలుగులో ఆ నైతిక బలాన్ని స్పష్టంగా అందిస్తుంది; ప్రత్యామ్నాయ పదార్థాన్ని పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వాక్యారంభంలోని కొనసాగుతున్న ఉటంకింపు భావాన్ని, కీర్తన ఉటంకణంలోని తక్షణతను, ‘హృదయాలు’ అనే బైబిలు రూపకాన్ని నిలుపుకుంది. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
