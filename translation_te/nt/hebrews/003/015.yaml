    text: లేదా, “దేవుణ్ణి రెచ్చగొట్టిన సమయంలోలాగా.” ఇది కీర్తన 95లోని ఉటంకింపుకు సంప్రదాయంగా ఇచ్చే భావాన్ని ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision retains the ongoing-citation sense of ἐν τῷ λέγεσθαι, the conditional urgency of “నేడు,” and the biblical metaphor of hardened hearts. It changes the final comparison to an event-based expression corresponding to ὡς ἐν τῷ παραπικρασμῷ, while preserving “provocation” as a lexical alternative in the footnote.
