id: HEB.3.5
reference: Hebrews 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: te
  text: మోషే నిజంగా ఆయన ఇల్లంతటిలో సేవకుడిగా నమ్మకంగా ఉన్నాడు[a]. తరువాత చెప్పబడబోయే సంగతులకు సాక్ష్యంగా అతడు అలా ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన కుటుంబమంతటిలో.” గ్రీకు పాఠ్యం తరువాతి వచనాల్లోనూ కొనసాగించే “ఇల్లు” అనే రూపకాన్ని ఇక్కడ నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “చెప్పబడవలసిన సంగతులకు.” ఈ పదబంధం భవిష్యత్తులో చెప్పబడే విషయాల వైపు చూపుతుంది; వాటిని ఎవరు చెబుతారో ఈ వచనం స్పష్టంగా పేర్కొనదు.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: మరియు అని విడిగా అనువదించకుండా వాక్యసంబంధంలో అంతర్లీనంగా ఉంచడం
  rationale: మునుపటి వచనంతో కొనసాగింపును తెలుగు ప్రవాహంలో సహజంగా ఉంచుతుంది; ‘నిజంగా’తో ప్రారంభించడం μὲν సూచించే తదుపరి వ్యత్యాసాన్ని ముందుకు తెస్తుంది.
- source_word: Μωϋσῆς μὲν
  choice: మోషే నిజంగా
  rationale: μὲν 3:6లోని δέతో పూర్తయ్యే వ్యత్యాసపు మొదటి భాగాన్ని సూచిస్తుంది. ‘నిజంగా’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πιστὸς
  choice: నమ్మకంగా ఉన్నాడు
  rationale: దేవుని సేవలో మోషే విశ్వసనీయతను, విధేయతను సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: ఆయన ఇల్లంతటిలో
  rationale: సంఖ్యాకాండము 12:7తోనూ హెబ్రీయులు 3లో కొనసాగుతున్న ‘ఇల్లు’ రూపకంతోనూ సంబంధాన్ని కాపాడుతుంది. αὐτοῦ ఎవరిని సూచిస్తుందో ప్రధాన పాఠ్యంలో అనవసరంగా మరింత నిర్ధారించకుండా ‘ఆయన’గా ఉంచబడింది.
- source_word: ὡς θεράπων
  choice: సేవకుడిగా
  rationale: θεράπων గౌరవప్రదమైన సేవా పాత్రను సూచిస్తుంది; δοῦλος‌లో ఉండే బానిసత్వ భావాన్ని దిగుమతి చేయదు. 3:6లో కుమారునితో వచ్చే వ్యత్యాసాన్నీ నిలుపుతుంది.
- source_word: εἰς μαρτύριον
  choice: సాక్ష్యంగా
  rationale: మోషే నమ్మకమైన సేవ సాక్ష్యంగా పనిచేసిందనే ఉద్దేశం లేదా ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῶν λαληθησομένων
  choice: తరువాత చెప్పబడబోయే సంగతులకు
  rationale: భవిష్యత్ కర్మణి కృదంతంలోని భావిని స్పష్టంగా నిలుపుతుంది; వక్తను మూలపాఠ్యం చెప్పనందున ‘దేవుడు చెప్పబోయే’ అని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: ‘ఆయన ఇల్లు’ అనే రూపకం
  choice: ‘ఆయన ఇల్లంతటిలో’ అని రూపకాన్ని నిలుపడం
  alternative: ‘ఆయన కుటుంబమంతటిలో’ లేదా ‘ఆయన ఇంటివారందరి మధ్య’
  rationale: ‘ఇల్లు’ అనే పదం దేవుని ప్రజలు లేదా గృహవ్యవస్థను సూచించే సందర్భార్థాన్ని కలిగి ఉండి, తరువాతి వచనాల్లో కొనసాగుతుంది. దాన్ని కేవలం సాధారణ కుటుంబంగా పరిష్కరించడం రూపక సంబంధాన్ని బలహీనపరుస్తుంది.
- issue: θεράπων యొక్క భావం
  choice: ‘సేవకుడు’
  alternative: ‘పరిచారకుడు’ లేదా ‘మంత్రి’
  rationale: ఇది గౌరవం కలిగిన సేవా పాత్రను సూచిస్తుంది; ‘బానిస’ కంటే భిన్నం. అదే సమయంలో తరువాతి వచనంలోని ‘కుమారుడు’ అనే స్థితితో ఉన్న ఉద్రిక్తతను నిలుపుతుంది.
- issue: τῶν λαληθησομένων దేనిని సూచిస్తుంది
  choice: ‘తరువాత చెప్పబడబోయే సంగతులు’ అని విస్తృతంగా ఉంచడం
  alternative: ‘తరువాత దేవుడు వెల్లడించబోయే సంగతులు’
  rationale: ఈ పదబంధం తరువాతి దైవిక ప్రకటన వైపు చూపవచ్చు, కాని మూలపాఠ్యం ఈ వచనంలో వక్తను లేదా విషయవస్తువును స్పష్టంగా పేర్కొనదు. కాబట్టి ప్రధాన పాఠ్యం ఆ అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలు శైలి. మూలంలోని దీర్ఘ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా అమర్చినా భావసంబంధం నిలుపబడింది. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
