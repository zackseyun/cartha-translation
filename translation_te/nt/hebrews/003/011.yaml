  yaml_path: translation/nt/hebrews/003/011.yaml
  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: te
  text: 'నా కోపంలో నేను ప్రమాణం చేసినట్లుగా:


    “వారు నా విశ్రాంతిలో ఎన్నటికీ ప్రవేశించరు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, “వారు నా విశ్రాంతిలో ప్రవేశిస్తే.” ఇది “వారు నా విశ్రాంతిలో ఎన్నటికీ ప్రవేశించరు” అని అర్థమిచ్చే ప్రమాణ సూత్రం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: అందుకే
  rationale: ఈ భాగం ముందున్న వాక్యంతో కలిసి కీర్తన ఉల్లేఖనంలోని ఫలితాన్ని తెలియజేస్తుంది. ఒంటరి వచనంగా సహజమైన తెలుగులో సంబంధాన్ని స్పష్టంగా చూపడానికి ‘అందుకే’ ఎంచుకున్నాం; గ్రీకు ὡς ఇక్కడ ఉల్లేఖన ప్రవాహంలో ‘అట్లు/ఆ విధంగా’ అనే భావాన్ని కలిగి ఉంది.
- source_word: ὤμοσα
  choice: నేను ప్రమాణం చేశాను
  rationale: ὀμνύω యొక్క భూతకాల రూపం ప్రమాణపూర్వక ప్రకటనను సూచిస్తుంది. ‘ప్రమాణం చేశాను’ ఆధునిక ప్రామాణిక తెలుగులో నేరుగా, గంభీరంగా ఉంటుంది.
- source_word: ἐν τῇ ὀργῇ μου
  choice: నా కోపంలో
  rationale: ὀργή దేవుని తీవ్రమైన కోపాన్ని సూచిస్తుంది. ‘నా కోపంలో’ సహజమైన తెలుగు; ‘ఉగ్రతలో’ కంటే సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది, అయితే సందర్భంలోని తీర్పు గంభీరతను నిలుపుతుంది.
- source_word: Εἰ εἰσελεύσονται
  choice: వారు … ఎన్నటికీ ప్రవేశించరు
  rationale: εἰ + భవిష్యత్ క్రియ ఇక్కడ సెమిటిక్ ప్రమాణ సూత్రం; రూపానికి ‘వారు ప్రవేశిస్తే’ అన్నట్టున్నా, వాడుకలో ఇది బలమైన నిరాకరణ. ‘ఎన్నటికీ ప్రవేశించరు’ ఆ ప్రమాణ బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: నా విశ్రాంతిలో
  rationale: κατάπαυσις హెబ్రీయులకు పత్రికలో అభివృద్ధి చెందే ‘విశ్రాంతి’ భావాన్ని నిలుపుతుంది. ‘విశ్రాంతిలో ప్రవేశించడం’ అనే రూపం మూలంలోని εἰς ను, అంతర్వాచక సంబంధాన్ని కూడా కాపాడుతుంది; దానిని స్థలం, పరలోకం లేదా అంతరంగ శాంతి అని ముందుగానే పరిమితం చేయదు.
theological_decisions:
- issue: Εἰ εἰσελεύσονται అనే ప్రమాణ సూత్రం
  choice: “వారు నా విశ్రాంతిలో ఎన్నటికీ ప్రవేశించరు” అనే స్పష్టమైన బలమైన నిరాకరణ
  alternative: రూపపరంగా అక్షరార్థమైన “వారు నా విశ్రాంతిలో ప్రవేశిస్తే”
  rationale: అక్షరార్థ షరతు వాక్యం తెలుగులో అసంపూర్ణంగా, తప్పుదారి పట్టించేలా వినిపిస్తుంది. బలమైన నిరాకరణగా అనువదించడం గ్రీకు-హీబ్రూ ప్రమాణ ప్రయోగపు వాస్తవ అర్థాన్ని తెలియజేస్తుంది; కొత్త సిద్ధాంత భావాన్ని చేర్చదు.
- issue: κατάπαυσις యొక్క భావ పరిధి
  choice: విశ్రాంతి
  alternative: విశ్రాంతి స్థలం
  rationale: ‘విశ్రాంతి’ కీర్తన 95తో ఉన్న అంతర్వాచక సంబంధాన్ని, హెబ్రీయులకు పత్రికలో కొనసాగే దైవిక విశ్రాంతి అంశాన్ని నిలుపుతుంది. ‘విశ్రాంతి స్థలం’ అని అనడం భావాన్ని అనవసరంగా స్థలానికి మాత్రమే పరిమితం చేయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే దైవిక ప్రమాణం మరియు తీర్పుకు తగిన గంభీరతతో రూపొందించబడింది. ‘విశ్రాంతి’ అనే ప్రధాన అంతర్వాచక పదాన్ని స్థిరంగా నిలుపుకుంది.
