  naturalness: The revised wording is natural modern standard Telugu and retains the solemn register appropriate to a divine oath. “నా కోపంలో నేను ప్రమాణం చేసినట్లుగా” is a faithful quotation-formula rendering without the added causal force of “అందుకే.”
  terminology: “కోపం,” “ప్రమాణం చేశాను,” and “విశ్రాంతి” are appropriate, clear, and suitably dignified. “విశ్రాంతి” should remain consistent in Hebrews for κατάπαυσις.
  issues:
