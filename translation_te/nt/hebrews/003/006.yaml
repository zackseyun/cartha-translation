  to: అయితే మెస్సీయ తన ఇంటిపై కుమారునిగా ఉన్నాడు[a]. మనం ఆయన ఇల్లు; మన ధైర్యాన్ని[b], మన నిరీక్షణను బట్టి కలిగే అతిశయాన్ని[c] గట్టిగా పట్టుకుంటే.
