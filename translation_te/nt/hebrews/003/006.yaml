source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: te
  text: అయితే మెస్సీయ తన ఇంటిపై కుమారునిగా ఉన్నాడు[a]. మనం ఆయన ఇల్లు; మన ధైర్యాన్ని[b], మన నిరీక్షణను బట్టి కలిగే అతిశయాన్ని[c] గట్టిగా పట్టుకుంటే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మెస్సీయ’కు బదులు ‘క్రీస్తు.’ గ్రీకు Χριστός బిరుదుగా (‘మెస్సీయ’) గానీ, పేరువంటి సంబోధనగా (‘క్రీస్తు’) గానీ ఉపయోగించబడవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘ధైర్యం’కు బదులు ‘నమ్మకం’ అని కూడా అనువదించవచ్చు. గ్రీకు παρρησία బహిరంగత, సంకోచం లేని మాట, లేదా నమ్మకంతో కూడిన ధైర్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘నిరీక్షణను బట్టి కలిగే అతిశయం’ అనే మాటను ‘నిరీక్షణలోని నమ్మకం’ లేదా ‘నిరీక్షణవల్ల కలిగే ఉల్లాసం’ అని కూడా అనువదించవచ్చు. గ్రీకు καύχημα అతిశయించేది, అతిశయానికి ఆధారం, లేదా ఉల్లాసభరితమైన నమ్మకం అనే భావాలను ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: మోషేతో జరుగుతున్న పోలికలో అభిషిక్తుని బిరుదు భావం స్పష్టంగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించాం; ‘క్రీస్తు’ కూడా సాధ్యమే.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలోని మోషే సేవకత్వానికి, ఇక్కడ కుమారుని స్థానానికి మధ్య ఉన్న వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὡς υἱὸς
  choice: కుమారునిగా
  rationale: ὡς యొక్క పోలిక/హోదా భావాన్ని నిలుపుతూ, తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: తన ఇంటిమీద
  rationale: ἐπί అధికార పర్యవేక్షణ భావాన్ని ‘మీద’ ద్వారా, οἶκος రూపకాన్ని ‘ఇల్లు’ ద్వారా నిలుపుతుంది. αὐτοῦ ఎవరిని సూచిస్తుందో అతిగా పరిష్కరించకుండా ‘తన’ అని ఉంచాం.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: మనమే ఆయన ఇల్లు
  rationale: దేవుని ప్రజలను ఇంటిగా చూపే రూపకాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἐὰν
  choice: …కుంటే
  rationale: నిజమైన షరతును తెలియజేస్తూ, పట్టుదల లేదా భ్రష్టత్వంపై ఏ ప్రత్యేక సిద్ధాంతాన్నీ అనువాదంలో చేర్చదు.
- source_word: παρρησίαν
  choice: ధైర్యం
  rationale: బహిరంగతతో కూడిన నమ్మకమైన ధైర్యం అనే పరిధిని తెలుగులో సంక్షిప్తంగా అందిస్తుంది; ‘నమ్మకం’ కూడా సందర్భానుసార ప్రత్యామ్నాయం.
- source_word: καύχημα
  choice: అతిశయం
  rationale: దేనినిబట్టి ఒకరు గర్వంగా లేదా ఉల్లాసంగా అతిశయిస్తారో అనే καύχημα భావాన్ని నిలుపుతుంది; దానిని కేవలం ‘నమ్మకం’గా సాఫీ చేయదు.
- source_word: τῆς ἐλπίδος
  choice: మన నిరీక్షణనుబట్టి కలిగే
  rationale: జనిటివ్ సంబంధం అనేక విధాలుగా అర్థమయ్యే అవకాశాన్ని సహజ తెలుగులో చూపుతుంది; ‘మన’ అనేది చుట్టూ ఉన్న ప్రథమ పురుష బహువచన సందర్భం నుంచి స్పష్టమవుతుంది.
- source_word: κατάσχωμεν
  choice: గట్టిగా పట్టుకుంటే
  rationale: కొనసాగిస్తూ దృఢంగా నిలుపుకోవాలనే షరతు మరియు ప్రబోధక బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Χριστόςను బిరుదుగా లేదా పేరువంటి రూపంగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: మోషేతో పోలిక జరుగుతున్న రక్షణచరిత్ర సందర్భంలో బిరుదు భావం చురుకుగా ఉంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: ἐὰν … κατάσχωμεν అనే షరతును ఎంత బలంగా వ్యక్తం చేయాలి
  choice: గట్టిగా పట్టుకుంటే
  alternative: గట్టిగా పట్టుకున్న పక్షంలో
  rationale: గ్రీకు వాక్యం పట్టుదలకు సంబంధించిన నిజమైన షరతును ఉంచుతుంది. ఏ సంఘపరమైన పట్టుదల/భ్రష్టత్వ సిద్ధాంతంతోనూ దాన్ని పరిష్కరించకుండా ఆ ఉద్రిక్తతను నిలిపాం.
- issue: αὐτοῦ (‘తన/ఆయన’) ఎవరిని సూచిస్తుంది
  choice: తన ఇంటిమీద
  alternative: దేవుని ఇంటిమీద / తన సొంత ఇంటిమీద
  rationale: సందర్భంలో అది దేవుని ఇంటిని సూచించడం సహజమైనా, వాక్యనిర్మాణం కుమారునితో సంబంధాన్నీ పూర్తిగా నిరాకరించదు. అందువల్ల అసలు పాఠంలోని సర్వనామ అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. οἶκος రూపకాన్ని ‘ఇల్లు’గా నిలిపాం. ప్రధాన పాఠంలో పాదసూచిక గుర్తులన్నీ [a], [b], [c]గా చేర్చబడ్డాయి; సంబంధిత పదబంధాల దగ్గర ఉంచాం.
