review_pass:
  verdict: revise
  source_fidelity: The draft improperly adds ‘నమ్మకంగా’ (‘faithfully’), which is not present in the SBLGNT text of this verse. The Greek states that the Messiah is ‘as a Son over his house’; the preceding verse supplies the contrast with Moses’ faithfulness but does not license importing that predicate here. The conditional relation should remain attached to the statement that believers are the house.
  naturalness: The revised wording is natural modern standard Telugu and keeps the house metaphor comprehensible. ‘తన ఇంటిపై’ more naturally expresses oversight/authority than ‘తన ఇంటిమీద.’
  terminology: ‘మెస్సీయ,’ ‘కుమారునిగా,’ ‘ధైర్యం,’ ‘నిరీక్షణ,’ and ‘అతిశయం’ suitably represent the key terms. ‘నిరీక్షణను బట్టి కలిగే అతిశయం’ retains the genitival connection without reducing καύχημα to mere confidence.
  issues:
  - severity: high
    issue: The main text adds ‘నమ్మకంగా’ (‘faithfully’).
    rationale: Neither Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ nor any other word in v. 6 expresses ‘faithful.’ It must be omitted for source fidelity.
  - severity: medium
    issue: Footnote anchors [b] and [c] are attached to ‘ఇల్లు’ rather than to their respective lexical expressions.
    rationale: '[b] explains παρρησία (‘ధైర్యం’) and [c] explains καύχημα (‘అతిశయం’); anchors should immediately follow those words or phrases.'
  - severity: low
    issue: ‘తన ఇంటిమీద’ is somewhat less idiomatic for authority over a house/household.
    rationale: ‘తన ఇంటిపై’ more naturally conveys ἐπὶ τὸν οἶκον in contemporary Telugu while retaining the metaphor.
