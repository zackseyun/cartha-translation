id: HEB.3.18
reference: Hebrews 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: te
  text: తన విశ్రాంతిలో ప్రవేశించరని ఆయన ఎవరి గురించి ప్రమాణం చేశాడు? అవిధేయత చూపినవారి[a] గురించే కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విధేయత చూపడానికి నిరాకరించినవారు.” గ్రీకు క్రియారూపం విధేయత చూపడానికి నిరాకరించిన చర్యను నొక్కిచెప్పగలదు; ఈ సందర్భంలో ఆ అవిధేయత అవిశ్వాసంతో సన్నిహితంగా ముడిపడి ఉంది (హెబ్రీయులు 3:19 చూడండి).
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: ఎవరి విషయంలో
  rationale: దత్తివ విభక్తిలోని బహువచన ప్రశ్నార్థక సర్వనామం వ్యక్తులను సూచిస్తుంది. తెలుగులో ‘ఎవరి విషయంలో’ అనేది ప్రమాణం ఎవరికి వ్యతిరేకంగా వర్తించిందో స్పష్టంగా తెలియజేస్తూ, ప్రమాణం వారితో చేయబడిందనే అపార్థాన్ని నివారిస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఈ కణం ముందరి వాక్యంతో ప్రశ్నను అనుసంధానిస్తుంది. తెలుగులో వరుస అలంకారిక ప్రశ్నల ప్రవాహమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘మరి’ చేర్చడం సాధ్యమైనప్పటికీ అవసరం లేదు.
- source_word: ὤμοσεν
  choice: ప్రమాణం చేశాడు
  rationale: ὀμνύω యొక్క భూతకాల రూపం గంభీరమైన ప్రమాణం చేయడాన్ని సూచిస్తుంది. ‘ప్రమాణం చేశాడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైనది.
- source_word: μὴ εἰσελεύσεσθαι
  choice: ప్రవేశించరని
  rationale: ప్రమాణంలోని విషయాన్ని తెలిపే నిరాకరణార్థక భవిష్యదర్థక infinitive నిర్మాణాన్ని తెలుగులో సహజమైన పరోక్ష వాక్యంగా అందిస్తుంది.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: తన విశ్రాంతిలో
  rationale: κατάπαυσις హెబ్రీయులకు పత్రికలో దేవుని విశ్రాంతి అనే ప్రధాన భావాన్ని కలిగి ఉంది. ‘తన’ కర్తయైన దేవునినే తిరిగి సూచిస్తుంది; ‘విశ్రాంతిలో ప్రవేశించడం’ తెలుగులో సహజంగా గమ్యభావాన్ని నిలుపుతుంది.
- source_word: εἰ μὴ
  choice: …విషయంలోనే కదా?
  rationale: అలంకారిక ప్రశ్నకు ఆశించబడిన ఏకైక సమాధానాన్ని εἰ μὴ పరిచయం చేస్తుంది. తెలుగు ‘నే కదా?’ నిర్మాణం ‘వారు తప్ప మరెవరు?’ అనే బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς ἀπειθήσασιν
  choice: అవిధేయత చూపినవారి
  rationale: ἀπειθέω యొక్క aorist participle విధేయతను నిరాకరించిన చర్యను సూచిస్తుంది. ఈ సందర్భంలో అవిశ్వాసంతో సన్నిహిత సంబంధం ఉన్నప్పటికీ, పదాన్ని నేరుగా ‘నమ్మనివారు’గా మార్చకుండా దాని ప్రత్యేక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: హెచ్చరిక సందర్భంలో ἀπειθήσασιν అనువాదం
  choice: అవిధేయత చూపినవారు
  alternative: నమ్మనివారు
  rationale: హెబ్రీయులు 3:18 అవిధేయతను, 3:19 అవిశ్వాసాన్ని పరస్పరం దగ్గరగా ఉంచుతుంది. అయినా ఈ వచనం ἀπειθέωనే వాడుతుంది, ἀπιστέωను కాదు. అందువల్ల మూలపద భేదాన్ని, అవిశ్వాసం–అవిధేయత మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్రిక్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే అలంకారిక ప్రశ్నగా రూపొందించబడింది. ‘ఎవరి విషయంలో’ అనే పునరుక్తి మూలంలోని τίσιν / τοῖς సమాంతర నిర్మాణాన్ని స్పష్టంగా ఉంచుతుంది.
