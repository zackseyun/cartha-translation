source:
  edition: SBLGNT
  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: te
  text: మరి, దేవుడు నలభై సంవత్సరాలు ఎవరిపై కోపంగా ఉన్నాడు? పాపం చేసినవారిపైనే కదా—వారి శరీరాలు[a] అరణ్యంలో పడిపోయాయి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి మృతదేహాలు అరణ్యంలో పడిపోయాయి.’
    reason: κῶλα అనే పదంలోని మరింత కఠినమైన, మరణాన్ని స్పష్టంచేసే భావానికి ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: προσώχθισεν
  choice: కోపంగా ఉన్నాడు
  rationale: ఈ క్రియ కోపం లేదా ఆగ్రహాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కోపంగా ఉన్నాడు’ సహజంగా ఉండి, అలంకార ప్రశ్నలోని భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τεσσεράκοντα ἔτη
  choice: నలభై సంవత్సరాలు
  rationale: కాలవ్యవధిని సూచించే గ్రీకు ద్వితీయా విభక్తి ప్రయోగాన్ని తెలుగులో సహజమైన కాలవ్యవధి రూపంలో అనువదించాం.
- source_word: ἁμαρτήσασιν
  choice: పాపం చేసినవారు
  rationale: భూతకాల కృదంతం అరణ్యంలో పాపం చేసిన ఆ ప్రజలను సూచిస్తుంది; ఈ రూపం సరళంగా, సహజంగా ఉంది.
- source_word: κῶλα
  choice: శరీరాలు
  rationale: పదశః అవయవాలు అని అర్థం కావచ్చుగానీ, ఈ సందర్భంలో మరణించి పడిపోయినవారి దేహాలను సూచిస్తుంది. ‘శరీరాలు’ స్పష్టంగా ఉండి, మూలంలోని కఠినమైన ‘మృతదేహాలు/కళేబరాలు’ భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: ἔπεσεν
  choice: పడిపోయాయి
  rationale: మూలంలోని పడటం అనే దృశ్యాన్ని నిలుపుతూ, మరణాన్ని నేరుగా చేర్చకుండా సందర్భం ద్వారా గ్రహించనిస్తుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: ఇశ్రాయేలీయుల అరణ్య సంచార నేపథ్యాన్ని తెలుగులో సుపరిచితమైన బైబిలు పదప్రయోగంతో తెలియజేస్తుంది.
theological_decisions:
- issue: προσώχθισεν క్రియలో అంతర్లీనంగా ఉన్న కర్త
  choice: దేవుడు
  alternative: ఆయన
  rationale: పరిసర సందర్భంలో కర్త దేవుడే. తెలుగులో ప్రశ్న స్పష్టంగా, స్వతంత్రంగా అర్థమయ్యేందుకు ‘దేవుడు’ అని వ్యక్తం చేశాం; ఇది కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్యంలోని అలంకార ప్రశ్న, తీర్పు తీవ్రత, అరణ్య నేపథ్యం నిలిచేలా గౌరవప్రదమైన శైలి వాడబడింది.
