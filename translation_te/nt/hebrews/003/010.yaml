  naturalness: The revision uses modern standard Telugu, with smoother collective reference (“ఈ తరంపట్ల”; “వారి హృదయంలో”) and quotation punctuation appropriate to a cited divine declaration. “తీవ్ర అసంతృప్తి చెందాను” remains a measured rendering of προσώχθισα, avoiding both undue weakening and unwarranted intensification.
  terminology: “మార్గాలు” appropriately preserves the biblical metaphor in τὰς ὁδούς μου. “హృదయం” retains the Greek singular and the footnote explains its likely collective force. No sectarian terminology has been introduced.
