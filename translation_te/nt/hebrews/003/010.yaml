source:
  edition: SBLGNT
  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: te
  text: 'నలభై సంవత్సరాలపాటు, అందుచేత నేను ఈ తరంపట్ల తీవ్ర అసంతృప్తి చెందాను[a], ఇలా అన్నాను: ‘వీరు వారి హృదయంలో[b] ఎప్పుడూ దారితప్పుతారు; నా మార్గాలను వీరు తెలుసుకోలేదు.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ తరంపట్ల కోపపడ్డాను’; గ్రీకు క్రియ బలమైన అసంతృప్తిని, విరక్తిని కూడా వ్యక్తం చేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘హృదయం’ ఏకవచనంలో ఉంది; అది ఈ తరాన్ని ఒక సమష్టిగా సూచిస్తున్నట్లు ఉండవచ్చు. భావానువాదంగా ‘తమ హృదయాల్లో’ అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: నలభై సంవత్సరాలపాటు
  rationale: కాలవ్యాప్తిని తెలిపే accusative భావాన్ని సహజమైన తెలుగులో ‘సంవత్సరాలపాటు’ అని వ్యక్తం చేసింది.
- source_word: διὸ
  choice: అందుచేత
  rationale: ముందటి సందర్భం నుంచి వచ్చే ఫలితార్థక లేదా నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: προσώχθισα
  choice: తీవ్ర అసంతృప్తి చెందాను
  rationale: ఈ క్రియలోని బలమైన అసంతృప్తి, విరక్తి భావాన్ని కేవలం ‘కోపపడ్డాను’ అని పరిమితం చేయకుండా, ‘అసహ్యించుకున్నాను’ అని మరీ తీవ్రం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: ఈ తరంవారిపట్ల
  rationale: దత్తివిభక్తి సంబంధాన్ని సహజ తెలుగులో ‘పట్ల’తో చూపుతూ, సూచించబడిన తరాన్ని వ్యక్తుల సమూహంగా స్పష్టపరుస్తుంది.
- source_word: Ἀεὶ πλανῶνται
  choice: ఎప్పుడూ దారితప్పుతారు
  rationale: నిరంతరంగా జరిగే నైతిక-ఆధ్యాత్మిక తొలగింపును సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో తెలియజేస్తుంది.
- source_word: τῇ καρδίᾳ
  choice: హృదయంలో
  rationale: గ్రీకులోని ఏకవచనాన్ని నిలుపుతూ, ఆ తరాన్ని సమష్టిగా సూచించే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοὶ δὲ οὐκ ἔγνωσαν
  choice: నా మార్గాలను వీరు తెలుసుకోలేదు
  rationale: δέ లోని వ్యత్యాసాన్ని వాక్య విరామం ద్వారా సహజంగా సూచించి, ἔγνωσαν లోని తెలుసుకోవడం లేదా పరిచయం పొందడం అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: τὰς ὁδούς μου
  choice: నా మార్గాలను
  rationale: దేవుని కార్యవిధానాలు, ఆయన నిర్దేశించిన నడవడిని సూచించే మూలభాషా రూపకాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: προσώχθισα లో దేవుని తీవ్రమైన అసంతృప్తి
  choice: తీవ్ర అసంతృప్తి చెందాను
  alternative: కోపపడ్డాను; అసహ్యించుకున్నాను
  rationale: దేవుని నిజమైన నిబంధనాత్మక అసంతృప్తిని తగ్గించకుండా, మూలపదం అనుమతించే భావాల్లో ఒక్కదానిని సిద్ధాంతపరంగా ఖరారు చేయకుండా ఉద్వేగ తీవ్రతను నిలుపుతుంది.
- issue: τῇ καρδίᾳ లో సమష్టి ఏకవచనం
  choice: హృదయంలో
  alternative: తమ హృదయాల్లో
  rationale: తరాన్ని ఒక సమష్టిగా చూపే గ్రీకు ఏకవచనాన్ని నిలుపుతుంది; అదే సమయంలో తెలుగులో అర్థమయ్యే సంక్షిప్త రూపాన్ని ఉపయోగిస్తుంది.
- issue: οὐκ ἔγνωσαν లో జ్ఞానం యొక్క స్వభావం
  choice: తెలుసుకోలేదు
  alternative: అర్థం చేసుకోలేదు; గుర్తించలేదు
  rationale: కేవలం మేధోపరమైన అవగాహనకే భావాన్ని పరిమితం చేయకుండా, దేవుని మార్గాలతో సంబంధిత పరిచయం లేదా అంగీకార భావానికి చోటు ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, స్పష్టమైన వాక్యనిర్మాణం వాడబడింది. కీర్తన ఉల్లేఖనంలోని దైవవాక్య ధోరణిని నిలుపుతూ, అరుదైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించింది. మూలపాఠంలో ‘నలభై సంవత్సరాలు’ తర్వాత ఉన్న విరామాన్ని అర్థవిరామంతో ప్రతిబింబించింది.
