  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: te
  text: తనను నియమించినవానికి ఆయన నమ్మకంగా ఉన్నాడు; మోషే కూడా తనను నియమించినవాని ఇంటిలో నమ్మకంగా ఉన్నట్లే.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తనను చేసినవానికి.’ గ్రీకు క్రియకు ‘చేసిన’ అనే అర్థం ఉండవచ్చు; అయితే ఇక్కడ ‘నియమించిన’ లేదా ‘బాధ్యత అప్పగించిన’ అనే భావం ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో ‘తనను నియమించినవాని ఇంటంతటిలో’ అని ఉంది; ఇది సంఖ్యాకాండము 12:7ను మరింత దగ్గరగా ప్రతిధ్వనిస్తుంది. ‘ఇల్లు’ అనేది సందర్భంలో దేవుని ఇల్లును సూచిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: ఆయన నమ్మకంగా ఉన్నాడు
  rationale: ఈ కృదంత పదబంధం 1వ వచనంలోని యేసును సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు దీనిని ప్రధాన వాక్యంగా అనువదించాం. πιστός ఇక్కడ ‘విశ్వసించినవాడు’ కంటే ‘నమ్మకంగా ఉన్నవాడు’ అనే భావాన్ని ఇస్తుంది.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: తనను నియమించినవానికి
  rationale: ποιέω సాధారణంగా ‘చేయు’ అనే అర్థం ఇవ్వగలిగినా, ఇక్కడ మోషే సేవతో పోలిక మరియు బాధ్యతకు నియామకం అనే సందర్భం వల్ల ‘నియమించిన’ అనేది ఉద్దేశించిన భావాన్ని సహజంగా తెలియజేస్తుంది. ‘చేసిన’ అనే నిఘంటు ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὡς καὶ
  choice: అలాగే ... కూడా
  rationale: యేసు నమ్మకత్వాన్ని మోషే నమ్మకత్వంతో పోల్చే భావాన్ని ప్రస్తుత ప్రామాణిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: ఆయన ఇంటిలో
  rationale: SBLGNT ప్రధాన పాఠంలో ఉన్న పదాలను అనుసరించి ‘అంతటిలో’ అనే పదాన్ని ప్రధాన వాక్యంలో చేర్చలేదు. తరువాతి వచనాల్లో విస్తరించే ‘ఇల్లు’ రూపకాన్ని నిలుపుకోవడానికి ‘కుటుంబంలో’ అని మార్చకుండా ‘ఇంటిలో’ అని అనువదించాం. αὐτοῦలోని సర్వనామాన్ని ‘ఆయన’గానే ఉంచి దాని సూచ్యాన్ని ప్రధాన పాఠంలో అతిగా నిర్ధారించలేదు.
theological_decisions:
- issue: కుమారుని గురించి ποιήσαντι అనే పదం అర్థం
  choice: నియమించిన
  alternative: చేసిన
  rationale: ‘చేసిన’ అనేది పదసాధ్యమైన అర్థమే అయినా, ఈ సందర్భంలో అది కుమారుడు సృష్టించబడ్డాడనే అనవసర భావాన్ని కలిగించవచ్చు. సేవా బాధ్యతలో నమ్మకత్వం, మోషేతో పోలిక అనే సందర్భానికి ‘నియమించిన’ సరిపోతుంది; అసలు పదంలోని ప్రత్యామ్నాయాన్ని పాదసూచికలో వెల్లడించాం.
- issue: ‘ఆయన ఇంటిలో’ అనే మాటలో αὐτοῦ సూచ్యం
  choice: సర్వనామాన్ని ‘ఆయన’గా నిలుపుకోవడం; సందర్భంలో అది దేవుని ఇంటిని సూచించే అవకాశం బలంగా ఉంది
  alternative: మోషే ఇంటి అని స్పష్టీకరించడం
  rationale: సంఖ్యాకాండము 12:7 ప్రతిధ్వని మరియు ‘నియమించినవాడు’ అనే సమీప సూచ్యం వల్ల దేవుని ఇల్లు ప్రధానంగా ఉద్దేశించబడినట్టు కనిపిస్తుంది. అయినా గ్రీకు సర్వనామంలో ఉన్న రూపాన్ని కాపాడుతూ ప్రధాన వాక్యంలో ‘దేవుని’ అని చేర్చి సందిగ్ధతను పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘నమ్మకంగా,’ ‘నియమించిన,’ ‘ఇంటిలో’ వంటి సాధారణ పదాలతో మూలంలోని పోలికను, ఇంటి రూపకాన్ని, సర్వనామంలోని స్వల్ప సందిగ్ధతను నిలిపాం.
