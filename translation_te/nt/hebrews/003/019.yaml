translation:
  language: te
  text: వారు అవిశ్వాసం వల్ల ప్రవేశించలేకపోయారని మనం చూస్తున్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వాసరాహిత్యం.” గ్రీకు పదం కేవలం నమ్మకం లేకపోవడాన్నే కాక, నమ్మడానికి నిరాకరించడం లేదా నమ్మకంగా ఉండకపోవడం అనే భావాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: తెలుగులో ముందున్న వాదనకు సహజమైన ముగింపుగా ఈ వాక్యం నిలుస్తుంది; ‘మరియు’ అని యాంత్రికంగా చేర్చడం అసహజంగా ఉంటుంది. అనుసంధాన భావం వాక్యప్రవాహంలోనే నిలిచింది.
- source_word: βλέπομεν
  choice: మనం చూస్తున్నాం
  rationale: ప్రథమ పురుష బహువచన వర్తమాన క్రియను ప్రత్యక్షంగా, సహజంగా నిలుపుతుంది.
- source_word: ὅτι
  choice: అని
  rationale: చూస్తున్న విషయాన్ని తెలిపే ఉపవాక్యాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: οὐκ ἠδυνήθησαν
  choice: ప్రవేశించలేకపోయారు
  rationale: δύναμαι లోని సామర్థ్యం లేకపోవడమనే భావాన్ని తెలుగు సంయుక్త క్రియ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰσελθεῖν
  choice: ప్రవేశించ
  rationale: వాగ్దాన విశ్రాంతి లేదా దేశంలోకి ప్రవేశించడాన్ని సూచించే గంభీరమైన, సందర్భోచిత పదం.
- source_word: δι’
  choice: కారణంగా
  rationale: అక్యూసేటివ్‌తో వచ్చిన διά ఇక్కడ కారణాన్ని సూచిస్తుంది.
- source_word: ἀπιστίαν
  choice: అవిశ్వాసం
  rationale: దేవుని మాటను నమ్మకపోవడం, ఆయనపై విశ్వాసముంచడానికి నిరాకరించడం అనే ప్రధాన సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἀπιστία పదంలోని నమ్మకలేమి మరియు నమ్మకద్రోహం మధ్య భావవిస్తృతి
  choice: అవిశ్వాసం
  alternative: విశ్వాసరాహిత్యం
  rationale: హెబ్రీయులు 3లో దేవుని వాగ్దానాన్ని నమ్మకపోవడమే ప్రధానంగా ఉంది. అయితే ఈ పదం కేవలం మానసిక అపనమ్మకమే కాక, దేవునిపై నమ్మకంగా ఆధారపడని ధోరణిని కూడా సూచించగలదు; ఆ భావాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని ప్రత్యక్ష నిర్ధారణను నిలుపుతూ, తెలుగులో అసహజంగా ఉండే ఆరంభ సంధిపదాన్ని విడిచిపెట్టాం; [a] గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
