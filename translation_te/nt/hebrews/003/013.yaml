revisions:
- from: కాని, “నేడు” అని పిలువబడే కాలం ఉన్నంతవరకు[a], మీలో ఎవరూ పాపం చేసే మోసం వల్ల కఠినపరచబడకుండా ఉండేందుకు ప్రతిరోజూ ఒకరినొకరు ప్రోత్సహించుకోండి[b].
  to: కాని, “నేడు” అని పిలువబడుతున్నంతకాలం[a], మీలో ఎవరూ పాపపు మోసంతో కఠినపరచబడకుండా ఉండేందుకు ప్రతిరోజూ ఒకరినొకరు ప్రోత్సహించండి[b].
