id: HEB.3.13
reference: Hebrews 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: te
  text: కాని, “నేడు” అని పిలువబడుతున్నంతకాలం[a], మీలో ఎవరూ పాపపు మోసంతో కఠినపరచబడకుండా ఉండేందుకు ప్రతిరోజూ ఒకరినొకరు ప్రోత్సహించండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నేడు” అనే మాట కీర్తన 95ను ప్రతిధ్వనిస్తుంది; దేవుని పిలుపుకు స్పందించవలసిన ప్రస్తుత సమయాన్ని సూచిస్తుంది.
    reason: cross_reference
  - marker: b
    text: లేదా “ఒకరినొకరు పురికొల్పండి.” గ్రీకు క్రియ సందర్భానుసారం ప్రోత్సహించడం, పురికొల్పడం, హెచ్చరించడం లేదా ఓదార్చడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: కాని
  rationale: ముందున్న హెచ్చరికకు విరుద్ధంగా, ఇప్పుడు చేయవలసిన సానుకూల కార్యాన్ని బలంగా సూచిస్తుంది.
- source_word: παρακαλεῖτε
  choice: ప్రోత్సహించుకోండి
  rationale: ఈ సందర్భంలో పరస్పరం ధైర్యపరచడం, హెచ్చరించడం, పట్టుదలగా నిలిపేలా పురికొల్పడం అనే విస్తృత భావం ఉంది; ఆధునిక తెలుగులో ‘ప్రోత్సహించుకోండి’ సహజంగా ఉండి పరస్పర క్రియను తెలియజేస్తుంది.
- source_word: ἑαυτοὺς
  choice: ఒకరినొకరు
  rationale: బహువచన ఆజ్ఞతో కూడిన ఈ ఆత్మవాచక సర్వనామం ఇక్కడ పరస్పరార్థకంగా పనిచేస్తుంది.
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: ప్రతిరోజూ
  rationale: రోజువారీగా పునరావృతమయ్యే కార్యాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄχρις οὗ τὸ Σήμερον καλεῖται
  choice: “నేడు” అని పిలువబడే కాలం ఉన్నంతవరకు
  rationale: ἄχρις οὗ యొక్క కొనసాగింపు భావాన్ని, καλεῖται అనే కర్మణి రూపాన్ని, కీర్తన 95ను ప్రతిధ్వనించే ‘నేడు’ అనే పదం ప్రత్యేకతను కాపాడుతుంది.
- source_word: ἵνα μὴ σκληρυνθῇ τις ἐξ ὑμῶν
  choice: మీలో ఎవరూ ... కఠినపరచబడకుండా ఉండేందుకు
  rationale: ప్రతికూల ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, గ్రీకు కర్మణి రూపాన్నీ సంఘంలోని ప్రతి వ్యక్తికి వర్తించే హెచ్చరికనూ నిలుపుతుంది.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: పాపం చేసే మోసం వల్ల
  rationale: దత్తి విభక్తి సాధనార్థాన్ని ‘వల్ల’తో చూపుతుంది; τῆς ἁμαρτίαςను కర్తృసంబంధంగా తీసుకొని పాపమే మోసగించేదిగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పరస్పర ప్రోత్సాహ భాష
  choice: ఒకరినొకరు
  alternative: మిమ్మల్ని మీరు
  rationale: మూలంలోని బహువచన ఆత్మవాచక రూపం ఈ సందర్భంలో పరస్పర బాధ్యతను సూచిస్తుంది; ‘మిమ్మల్ని మీరు’ వ్యక్తిగత లేదా సమూహ-ఆత్మవాచక భావాన్ని కలిగించవచ్చు.
- issue: τὸ Σήμερον యొక్క అర్థం
  choice: కీర్తన 95ను ప్రతిధ్వనించే ప్రత్యేకమైన “నేడు,” అంటే దేవుని పిలుపుకు స్పందించవలసిన ప్రస్తుత కాలం
  alternative: సాధారణ క్యాలెండర్ దినమైన నేడు
  rationale: హెబ్రీయులు 3 సందర్భంలో ఈ పదం కీర్తన 95 ఉల్లేఖనాన్ని కొనసాగిస్తుంది. ఉద్ధరణ గుర్తులు ఆ అంతర్గ్రంథ సంబంధాన్ని చూపుతాయి; ప్రధాన పాఠ్యంలో దానిని అతిగా వ్యాఖ్యానించలేదు.
- issue: కఠినపరచబడుటలో కార్యసాధకుడు
  choice: కర్మణి రూపాన్ని నిలుపుతూ ‘కఠినపరచబడకుండా’
  alternative: ‘కఠినహృదయులుగా మారకుండా’
  rationale: మూలం కార్యసాధకుడిని స్పష్టంగా పేర్కొనదు. కర్మణి రూపాన్ని ఉంచడం ద్వారా పాపపు మోసం పాత్రను చూపుతూనే, దేవుడు లేదా వ్యక్తి మాత్రమే కార్యసాధకుడని నిర్ణయించకుండా నిజమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘నేడు’కు ఉద్ధరణ గుర్తులు పెట్టి కీర్తన 95 ప్రతిధ్వనిని నిలిపాం. మూలంలోని పొడవైన వాక్య నిర్మాణాన్ని సహజ తెలుగు క్రమంలో అమర్చినా, ప్రతిరోజూ జరిగే పరస్పర ప్రోత్సాహం, ప్రస్తుత అత్యవసర కాలం, పాపపు మోసం ద్వారా కలిగే కఠినత అనే మూడు ప్రధాన భావాలను కాపాడాం.
