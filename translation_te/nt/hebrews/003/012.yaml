id: HEB.3.12
reference: Hebrews 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: te
  text: సోదరులారా[a], మీలో ఎవరిలోనైనా సజీవుడైన దేవుని నుండి దూరమయ్యే[c] అవిశ్వాసపు దుష్ట హృదయం[b] ఉండకుండా జాగ్రత్తపడండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సోదరులారా” అని అనువదించిన ἀδελφοί పుంలింగ బహువచన పదం; ఇది స్త్రీపురుషులతో కూడిన తోటి విశ్వాసుల సమూహాన్ని కూడా సంబోధించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “విశ్వాసరాహిత్యంతో కూడిన దుష్ట హృదయం.”
    reason: alternative_reading
  - marker: c
    text: లేదా “సజీవుడైన దేవుని విడిచిపెట్టే” / “సజీవుడైన దేవుని నుండి తొలగిపోయే.”
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: జాగ్రత్తపడండి
  rationale: వర్తమానకాల బహువచన ఆజ్ఞగా ఇది అప్రమత్తంగా ఉండమనే గట్టి హెచ్చరికను ఇస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పదంలోని పుంలింగ బహువచన సంబోధనను నిలుపుతుంది; సందర్భంలో ఇది తోటి విశ్వాసుల మిశ్రమ సమూహాన్ని కూడా సూచించగలదని పాదసూచిక వివరిస్తుంది.
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: మీలో ఎవరిలోనైనా ... ఉండకుండా
  rationale: శ్రోతల్లో ఏ ఒక్కరిలోనూ ఈ పరిస్థితి తలెత్తకూడదనే హెచ్చరికను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: καρδία
  choice: హృదయం
  rationale: ఆలోచన, సంకల్పం, భావోద్వేగాల అంతరంగ కేంద్రం అనే బైబిలు భావసంపదను నిలుపుతుంది.
- source_word: πονηρὰ
  choice: దుష్ట
  rationale: కేవలం లోపాన్ని కాక నైతిక చెడును సూచించే బలమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: ἀπιστίας
  choice: అవిశ్వాసపు
  rationale: హెబ్రీయులకు 3లో దేవుని మాటను నమ్మకపోవడంపై ఉన్న ప్రధాన దృష్టికి సరిపోతుంది; ‘విశ్వాసరాహిత్యపు’ అనే నైతిక ఛాయను పాదసూచికలో నిలుపుతుంది.
- source_word: ἐν τῷ ἀποστῆναι
  choice: తొలగిపోయే
  rationale: దుష్ట హృదయానికి దేవుని నుండి తొలగిపోవడానికి ఉన్న సన్నిహిత సంబంధాన్ని సంక్షిప్తంగా చూపుతుంది; కారణం, పరిస్థితి, లేదా ఫలితం అనే సూక్ష్మ సంబంధాన్ని సాంకేతికంగా అతిగా నిర్ధారించదు.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: సజీవుడైన దేవుని నుండి
  rationale: నిజంగా జీవించే దేవునిని సూచించే స్థిరమైన బైబిలు భావాన్ని, మూలంలోని విభక్తి సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἀπιστίας ను ‘అవిశ్వాసం’గా లేదా ‘విశ్వాసరాహిత్యం’గా అనువదించడం
  choice: అవిశ్వాసపు
  alternative: విశ్వాసరాహిత్యపు
  rationale: తక్షణ సందర్భం దేవుని స్వరాన్ని నమ్మకపోవడాన్ని ప్రధానంగా చూపుతుంది. అయినా విశ్వాసఘాతకత అనే నైతిక ఛాయ సాధ్యమే కనుక దానిని పాదసూచికలో ఉంచాం.
- issue: ἀποστῆναι కి సాంకేతిక మతత్యాగ భావాన్ని ఇవ్వాలా
  choice: తొలగిపోయే
  alternative: విడిచిపెట్టే / విశ్వాసం నుండి పడిపోయే
  rationale: మూల క్రియలో దూరమవడం, విడిచిపోవడం అనే తీవ్రమైన హెచ్చరిక ఉంది; కానీ తరువాతి కాలపు సాంకేతిక మతత్యాగ వర్గీకరణను ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చకుండా భావ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన హెచ్చరిక శైలిని వాడాం. ‘సోదరులారా,’ ‘హృదయం,’ ‘సజీవుడైన దేవుడు’ వంటి బైబిలు పరంగా పరిచితమైన పదాలను నిలుపుతూ, వాక్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం.
