id: HEB.3.16
reference: Hebrews 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: te
  text: ఎందుకంటే, విని తిరుగుబాటు చేసినవారు ఎవరు?[a] మోషే ద్వారా ఐగుప్తు నుండి బయలుదేరిన వారందరూ కాదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విని కోపపెట్టినవారు” (లేదా “చేదుగా చేసినవారు”). గ్రీకు క్రియను మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు; ఇక్కడ అది అరణ్యంలో ఇశ్రాయేలీయులు తమ తిరుగుబాటుతో దేవుణ్ణి రెచ్చగొట్టడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: ఎవరు
  rationale: నిర్దిష్టంగా తిరుగుబాటు చేసినవారి గుర్తింపును ప్రశ్నించే బహువచన అలంకారిక ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ ప్రశ్న వివరణాత్మక ఆధారాన్ని ఇస్తున్నదనే తార్కిక సంబంధాన్ని నిలుపుతుంది.
- source_word: ἀκούσαντες
  choice: విని
  rationale: ప్రధాన క్రియకు ముందు జరిగిన కార్యాన్ని సూచించే గ్రీకు భూతకాల అసమాపక క్రియారూపాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρεπίκραναν
  choice: తిరుగుబాటు చేసినవారు
  rationale: అరణ్యకాల సందర్భంలో అవిధేయత ద్వారా దేవుణ్ణి రెచ్చగొట్టిన ఇశ్రాయేలీయుల తిరుగుబాటు భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: ἀλλ’ οὐ πάντες
  choice: వారందరూ కాదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్న బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ἀλλά ఇక్కడ ప్రత్యేక విరుద్ధార్థ సంధికన్నా ప్రశ్నకు సమాధానాన్ని ప్రవేశపెడుతుంది.
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: ఐగుప్తు నుండి బయలుదేరిన వారు
  rationale: నామవాచకంగా వాడిన అసమాపక క్రియారూపాన్నీ, ఐగుప్తు నుండి బయటకు వచ్చిన స్థలార్థాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: διὰ Μωϋσέως
  choice: మోషే ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సూచించే సాధనత్వం లేదా మధ్యవర్తిత్వాన్ని అనవసర వివరణ లేకుండా సమీపంగా నిలుపుతుంది.
theological_decisions:
- issue: అరణ్య తరం సందర్భంలో παραπικραίνω పదార్థం
  choice: తిరుగుబాటు చేశారు
  alternative: కోపం పుట్టించారు; తీవ్రంగా బాధపెట్టారు
  rationale: సందర్భంలో ఇది దేవుని మాట విన్న తరువాత అవిధేయతతో ఆయనను రెచ్చగొట్టిన ఇశ్రాయేలు చర్యను సూచిస్తుంది. ‘తిరుగుబాటు చేశారు’ కథనాత్మక, నైతిక బలాన్ని స్పష్టంగా అందిస్తుంది; క్రియలోని మరింత అక్షరార్థ భావాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
- issue: πάντες అనే సమగ్ర పదం
  choice: వారందరూ
  alternative: వారిలోని ప్రజలు
  rationale: గ్రీకు మూలంలోని సమగ్ర అలంకారిక వాక్యాన్ని యథాతథంగా నిలుపుతుంది; ఇతర సందర్భాల ఆధారంగా మినహాయింపులను ఈ వాక్యంలోకి చేర్చి ఉద్రిక్తతను తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారిక ప్రశ్న నిర్మాణం ఉపయోగించబడింది. ‘ఐగుప్తు’ అనే స్థిర బైబిలు భౌగోళిక నామరూపం, అలాగే మూలంలోని సాధనత్వాన్ని నిలిపే ‘మోషే ద్వారా’ అనే పదబంధం ఉంచబడ్డాయి.
