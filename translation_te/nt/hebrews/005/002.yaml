revisions:
- from: తెలియక తప్పుచేసేవారితో, దారితప్పుతున్నవారితో[a] అతడు మృదువుగా వ్యవహరించగలడు; ఎందుకంటే అతడు కూడా బలహీనతచేత ఆవరించబడి ఉన్నాడు[b].
  to: అజ్ఞానంలో ఉన్నవారితోను దారితప్పుతున్నవారితోను అతడు సౌమ్యంగా వ్యవహరించగలడు; ఎందుకంటే అతడూ స్వయంగా బలహీనతతో ఆవరించబడి ఉన్నాడు[b].
  rationale: The revision removes an unwarranted specification of wrongdoing from ‘ignorant,’ corrects the metaphor so weakness is the condition enveloping the high priest rather than the agent of an action, and expresses the προσωπally emphatic ‘he himself also.’ Footnote a is retained as a legitimate lexical alternative, but its anchor must appear in the text.
