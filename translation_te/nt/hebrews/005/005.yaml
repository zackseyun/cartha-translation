id: HEB.5.5
reference: Hebrews 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: te
  text: 'అలాగే మెస్సీయ[a] ప్రధాన యాజకుడు కావడానికి తనను తాను మహిమపరచుకోలేదు[c]. బదులుగా, ఆయనతో ఇలా పలికినవాడే ఆయనను మహిమపరిచాడు:


    “నీవు నా కుమారుడివి;

    నేడు నేను నిన్ను కనాను.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రీస్తు.’ గ్రీకు Χριστός ఇక్కడ పేరుకన్నా బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
  - marker: b
    text: కీర్తన 2:7 నుండి ఉల్లేఖనం.
    reason: cross_reference
  - marker: c
    text: లేదా ‘తనను తాను ఘనపరచుకోలేదు.’ గ్రీకు క్రియకు ‘మహిమపరచు,’ ‘ఘనపరచు’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: అలాగే
  rationale: ముందటి వచనంలో ప్రధాన యాజకుడు దేవునిచేత పిలవబడడం గురించి చెప్పిన విషయంతో పోలికను సహజంగా కొనసాగిస్తుంది.
- source_word: ὁ Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός వ్యక్తిగత పేరులా కాక, దేవునిచేత నియమించబడిన అభిషిక్తుని బిరుదుగా పనిచేస్తోంది.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: తనను తాను మహిమపరచుకోలేదు
  rationale: δοξάζωలోని ‘మహిమపరచు/ఘనపరచు’ భావాన్ని, అలాగే గ్రీకులోని ఆత్మనిర్దేశక నిర్మాణాన్ని నిలుపుతుంది.
- source_word: γενηθῆναι ἀρχιερέα
  choice: ప్రధాన యాజకుడు కావడానికి
  rationale: γενηθῆναι ఒక పదవి లేదా స్థితిలోకి రావడాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ఇది సహజంగా ఉంది.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: బదులుగా, ఆయనతో ఇలా పలికినవాడే ఆయనకు ఆ ఘనత ఇచ్చాడు
  rationale: గ్రీకులో రెండవ భాగంలోని క్రియ భావగర్భితంగా విడిచిపెట్టబడింది. తెలుగులో భావం స్పష్టంగా ఉండేందుకు ముందు ఉన్న ‘మహిమపరచడం’ అనే భావాన్ని ‘ఆ ఘనత ఇచ్చాడు’ అని సహజంగా పూరించింది; మాట్లాడినవాడు దేవుడని పేరుపెట్టి మూలపాఠానికి మించిన స్పష్టీకరణ చేయలేదు.
- source_word: Υἱός μου εἶ σύ
  choice: నీవు నా కుమారుడివి
  rationale: గ్రీకు ప్రకటనను సహజమైన ఆధునిక తెలుగు పదక్రమంలో నేరుగా అందిస్తుంది.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: నేడు నేను నిన్ను కన్నాను
  rationale: γεννάωలోని ‘కను/జన్మనివ్వు’ భావాన్ని వివరణాత్మక సిద్ధాంత పదజాలంతో మార్చకుండా, కీర్తన ఉల్లేఖనంలోని ఉద్దేశపూర్వక theological tensionను నిలుపుతుంది.
theological_decisions:
- issue: Χριστός పదాన్ని బిరుదుగా లేదా పేరులా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ప్రధాన యాజక పదవికి దైవ నియామకం గురించిన ఈ వాదనలో అభిషిక్తుని బిరుదు భావం ముందంజలో ఉంది.
- issue: ‘నేడు నేను నిన్ను కన్నాను’ అనే కీర్తన ఉల్లేఖనానికి క్రీస్తు సంబంధమైన అర్థం
  choice: ఉల్లేఖనాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా యథార్థంగా ఉంచడం
  alternative: దీనిని పట్టాభిషేకం, పునరుత్థానం లేదా నిత్యజననం అని ప్రధాన పాఠంలో నిర్దిష్టంగా వివరించడం
  rationale: కీర్తన 2:7 ఉల్లేఖనం ఏ ప్రత్యేక theological interpretationను బలవంతంగా నిర్ణయించకుండా ఉన్న ఉద్రిక్తతను అనువాదం నిలుపాలి.
- issue: ἀλλ’ తరువాత ఉన్న భావగర్భిత క్రియ
  choice: ‘ఆయనకు ఆ ఘనత ఇచ్చాడు’ అని సందర్భానుసారంగా పూరించడం
  alternative: ‘కాని ఆయనతో పలికినవాడు’ అని అసంపూర్ణ నిర్మాణాన్ని యథాతథంగా ఉంచడం
  rationale: అర్థాన్ని మార్చకుండా తెలుగులో సంపూర్ణమైన, సహజమైన వాక్యాన్ని ఇస్తుంది; ఘనతను ఇచ్చినవాడు దేవుడనే భావం సందర్భం నుంచే వస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. ‘ప్రధాన యాజకుడు,’ ‘మెస్సీయ,’ ‘మహిమపరచు’ వంటి బైబిలు సంబంధ పదాలు సామాన్య పాఠకులకు అర్థమయ్యే రూపంలో నిలుపబడ్డాయి. కవితా ఉల్లేఖనం పంక్తులుగా అమర్చబడింది.
