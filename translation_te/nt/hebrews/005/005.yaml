  naturalness: ‘అలాగే,’ ‘మెస్సీయ,’ ‘ప్రధాన యాజకుడు,’ మరియు ఉల్లేఖనపు పంక్తి విభజన ఆధునిక ప్రామాణిక తెలుగుకు సహజంగా, గంభీరంగా ఉన్నాయి. ‘నేడు నేను నిన్ను కన్నాను’ అర్థమయ్యేదే అయినా, ‘కనాను’ రూపం ఈ అధికారిక కీర్తన ఉల్లేఖనంలో మరింత సహజమైన, లింగనిరపేక్షమైన బైబిలు-శైలిని ఇస్తుంది.
