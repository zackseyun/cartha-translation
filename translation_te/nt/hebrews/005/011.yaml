id: HEB.5.11
reference: Hebrews 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: te
  text: ఈ విషయం గురించి మేము చెప్పవలసినది ఎంతో ఉంది[a], దానిని వివరించడం కష్టం[b]; ఎందుకంటే మీరు వినడంలో మందకొడిగా[c] మారారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన గురించి.” గ్రీకు సంబంధ సర్వనామం మెల్కీసెదెకును వ్యక్తిగతంగా సూచించవచ్చు; అయితే ఇక్కడ అది చర్చలోని విస్తృత విషయాన్ని సూచించే అవకాశమూ ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “అర్థం చెప్పడం కష్టం,” లేదా “విపులంగా బోధించడం కష్టం.”
    reason: lexical_alternative
  - marker: c
    text: “మందకొడిగా” అంటే బోధను వినడంలో నెమ్మదిగా లేదా స్పందనలేనివారిగా ఉండడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: దీని గురించి
  rationale: గ్రీకు సంబంధ సర్వనామం మెల్కీసెదెకును వ్యక్తిగతంగా సూచించవచ్చు; అయితే సందర్భంలో ఇప్పటివరకు చర్చించిన విషయాన్ని మరింత విపులంగా చెప్పబోతున్న భావం ప్రధానంగా ఉంది. తెలుగు వాక్యంలో ‘దీని గురించి’ సహజంగా ఉండి ఆ విస్తృత విషయసూచనను నిలుపుతుంది.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: మేము చెప్పవలసినది ఎంతో ఉంది
  rationale: అక్షరార్థ నిర్మాణాన్ని కృత్రిమంగా అనుసరించకుండా, రచయిత వద్ద చెప్పడానికి విస్తారమైన విషయం ఉందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δυσερμήνευτος λέγειν
  choice: దాన్ని వివరించడం కష్టం
  rationale: δυσερμήνευτος అనేది అర్థం చెప్పడం లేదా వ్యాఖ్యానించడం కష్టమనే భావాన్ని ఇస్తుంది; λέγεινతో కలిపి ఇక్కడ బోధనను మాటల్లో విపులీకరించడం కష్టమని సూచిస్తుంది.
- source_word: ἐπεὶ
  choice: కాబట్టి
  rationale: శ్రోతల మందకొడితనమే వివరించడం కష్టమవడానికి కారణమని చూపే కారణ సంబంధాన్ని సహజమైన తెలుగు వాక్యక్రమంలో తెలియజేస్తుంది.
- source_word: νωθροὶ
  choice: మందకొడిగా
  rationale: ఈ పదం సోమరితనం మాత్రమే కాక, గ్రహించడంలో నెమ్మది మరియు స్పందనలేమిని సూచిస్తుంది. బోధను స్వీకరించే సందర్భంలో ‘మందకొడిగా’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: γεγόνατε
  choice: మారారు
  rationale: పరిపూర్ణ కాలరూపం కాలక్రమంలో ఏర్పడి ఇప్పుడు కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘మారారు’ వారు మొదటి నుంచే అలా లేరనే అభివృద్ధి భావాన్ని కాపాడుతుంది.
- source_word: ταῖς ἀκοαῖς
  choice: వినడంలో
  rationale: శారీరక వినికిడి కంటే బోధను శ్రద్ధగా విని స్వీకరించే సామర్థ్యాన్ని ఇక్కడ సూచిస్తుంది. ‘వినడంలో’ మూలంలోని వినికిడి రూపకాన్ని నిలుపుతూ సహజంగా ఉంటుంది.
theological_decisions:
- issue: Περὶ οὗ యొక్క సూచన
  choice: ప్రధాన పాఠ్యంలో ‘దీని గురించి’ అని, చర్చలోని విషయాన్ని సూచించేలా అనువదించడం
  alternative: ‘ఆయన గురించి’ అని, మెల్కీసెదెకును వ్యక్తిగతంగా సూచించేలా అనువదించడం
  rationale: ముందటి వచనంలో మెల్కీసెదెకు పేరు ఉన్నందున వ్యక్తిగత సూచన వ్యాకరణపరంగా సాధ్యమే. అయినా ‘మేము చెప్పవలసినది ఎంతో ఉంది’ అనే మాట విస్తృతమైన అంశాన్ని పరిచయం చేస్తున్నట్లు సందర్భం సూచిస్తుంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా నిజమైన సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని కారణ సంబంధాన్ని తెలుగులో స్పష్టంగా చూపేందుకు ఉపవాక్య క్రమాన్ని స్వల్పంగా మార్చాం. ‘వినడంలో’ అనే రూపం మూలంలోని వినికిడి రూపకాన్ని కాపాడుతుంది; ‘మారారు’ కాలక్రమంలో ఏర్పడిన ప్రస్తుత స్థితిని తెలియజేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
