id: HEB.5.1
reference: Hebrews 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: te
  text: ఎందుకంటే ప్రతి ప్రధాన యాజకుడు మనుష్యులలో నుండి తీసుకోబడి, దేవునికి సంబంధించిన విషయాల్లో మనుష్యుల పక్షంగా నియమించబడతాడు, పాపాల నిమిత్తం అర్పణలనూ బలులనూ అర్పించేందుకు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς
  choice: ప్రతి
  rationale: ఏకవచనమైన ‘ప్రధాన యాజకుడు’తో పంపిణీ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందరి వాదనకు ఈ వాక్యం వివరణ లేదా ఆధారం ఇస్తున్న సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: యూదుల ఆరాధనా వ్యవస్థలోని ఈ ప్రత్యేక పదవికి ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: మనుష్యులలో నుండి తీసుకోబడి
  rationale: మూలంలోని వర్తమాన కర్మణి కృదంత రూపాన్ని కాపాడుతూ, ఆ యాజకుడు మానవ సమాజం నుండే తీసుకోబడతాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: ὑπὲρ ἀνθρώπων
  choice: మనుష్యుల పక్షంగా
  rationale: ὑπέρ తెలిపే ప్రతినిధిత్వం మరియు మేలు కోసం కార్యం చేయడం అనే భావాలను సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: καθίσταται
  choice: నియమించబడతాడు
  rationale: ఒక వ్యక్తిని యాజక పదవిలో ఉంచడాన్ని సహజంగా, ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: τὰ πρὸς τὸν θεόν
  choice: దేవునికి సంబంధించిన విషయాల్లో
  rationale: దేవుని సమక్షంలో జరిగే ఆరాధన, సేవకు సంబంధించిన విషయాలను సూచించే గ్రీకు నుడికారానికి సహజమైన తెలుగు రూపం.
- source_word: ἵνα προσφέρῃ
  choice: అర్పించడానికి
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని తెలుగులో సహజమైన ప్రయోజనార్థక క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: δῶρά τε καὶ θυσίας
  choice: అర్పణలను, బలులను
  rationale: రెండు వేర్వేరు ఆరాధనా వర్గాలను నిలుపుతుంది; తెలుగులో జాబితా నిర్మాణమే τε καὶ యొక్క సంయుక్త భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: పాపాల నిమిత్తం
  rationale: బలుల సందర్భంలో పాపాలకు సంబంధించి లేదా వాటి పరిహారార్థం అర్పించడం అనే భావాన్ని, పరిహార విధానాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: ἀνθρώπωνలోని ప్రతినిధి లింగ భాష
  choice: రెండు చోట్లా ‘మనుష్యులు’
  alternative: ‘పురుషులు’
  rationale: ἄνθρωπος బహువచనం సందర్భంలో మానవులను సాధారణంగా సూచించగలదు. చారిత్రక ప్రధాన యాజక పదవి పురుషులదైనా, ‘మనుష్యులు’ అనే పదం యాజకుడు మానవులలోనివాడనీ, వారి పక్షంగా సేవచేస్తాడనీ మూలార్థాన్ని సహజంగా నిలుపుతుంది; అనవసరంగా పరిధిని కుదించదు.
- issue: ὑπὲρ ἁμαρτιῶν యొక్క బలిసంబంధ భావం
  choice: ‘పాపాల నిమిత్తం’
  alternative: ‘పాపాల పరిహారం కోసం’
  rationale: మూలం బలులు పాపాలకు సంబంధించి అర్పించబడతాయని చెబుతుంది; ‘పరిహారం’ అని చేర్చడం ఇక్కడ స్పష్టంగా లేని బలిసిద్ధాంత వివరణను ముందుగానే నిర్ణయించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ప్రధాన యాజకుడు,’ ‘అర్పణలు,’ ‘బలులు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచి, వాక్య నిర్మాణాన్ని సహజ తెలుగు క్రమంలో అమర్చాం.
