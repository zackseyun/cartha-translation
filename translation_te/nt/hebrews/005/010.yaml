translation:
  language: te
  text: మెల్కీసెదెకు క్రమానుసారం ప్రధాన యాజకుడని దేవునిచేత పిలువబడినవాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవునిచేత ప్రధాన యాజకుడిగా పేరుపెట్టబడినవాడు’; లేదా, ‘దేవునిచేత ప్రధాన యాజకుడిగా నియమించబడినవాడు.’
    reason: lexical_alternative
  - marker: b
    text: ఇది కీర్తన 110:4ను ప్రతిధ్వనిస్తుంది; అక్కడ యాజకత్వం ‘మెల్కీసెదెకు క్రమానుసారం’ ఉందని చెప్పబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: ప్రకటించబడ్డాడు
  rationale: ఈ సందర్భంలో దేవుడు యేసును ప్రధాన యాజకుడిగా పేరుపెట్టి ప్రకటించిన భావాన్ని వ్యక్తం చేస్తుంది. కర్తరి చర్యకు లోనైన భావాన్ని నిలుపుతూ, ‘నియమించబడ్డాడు’ అనే మరింత బలమైన పదవీ-స్థాపన భావాన్ని ప్రధాన పాఠ్యంలోకి తీసుకురాదు.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: దేవునిచేత
  rationale: ὑπό సహిత షష్ఠీ విభక్తి నిష్క్రియ నిర్మాణంలో వ్యక్తిగత కర్తను సూచిస్తుంది. మూలపాఠ్యంలో లేని ‘తండ్రి’ అనే వివరణను చేర్చలేదు.
- source_word: ἀρχιερεὺς
  choice: ప్రధాన యాజకుడిగా
  rationale: ἀρχιερεύςకు సహజమైన ఆధునిక తెలుగు సమానార్థకం. ‘గా’ విభక్తి ప్రకటించబడిన హోదాను స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατὰ
  choice: ప్రకారం
  rationale: ఇక్కడ κατά అనుగుణత లేదా సరిపోలికను సూచిస్తుంది; ‘ప్రకారం’ తెలుగులో సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: τὴν τάξιν
  choice: క్రమం
  rationale: కేవలం వరుసను కాకుండా యాజకత్వపు విధం, నమూనా లేదా వర్గాన్ని సూచించే స్థిరమైన బైబిలు పదబంధాన్ని నిలుపుతుంది.
- source_word: Μελχισέδεκ
  choice: మెల్కీసెదెకు
  rationale: వ్యక్తి పేరును అనువదించకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించింది.
