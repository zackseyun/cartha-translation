  choice: దేవునిచేత ... ప్రధాన యాజకుడిగా ప్రకటించబడ్డాడు
  alternative: దేవునిచేత ... ప్రధాన యాజకుడిగా పిలువబడ్డాడు; దేవునిచేత ... ప్రధాన యాజకుడిగా నియమించబడ్డాడు
  rationale: ‘ప్రకటించబడ్డాడు’ అనే రూపం దేవుని అధికారపూర్వక నామకరణం/గుర్తింపును తెలియజేస్తుంది; అదే సమయంలో స్వరూప మార్పు లేదా నిర్దిష్ట సంస్థాగత పదవీ స్థాపనను అనవసరంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని నిష్క్రియ భావం, దేవుని కర్తృత్వం, మెల్కీసెదెకు యాజక క్రమంతో ఉన్న సంబంధం నిలుపబడ్డాయి.
