id: HEB.5.14
reference: Hebrews 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: te
  text: కాని గట్టి ఆహారం పరిణతి చెందినవారికే ఉంటుంది. వారు నిరంతర అభ్యాసం వల్ల[a] మంచి చెడులను వివేచించడానికి శిక్షణ పొందిన గ్రహణశక్తులు[b] కలిగినవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అలవాటు వల్ల” లేదా “నిరంతర వినియోగం వల్ల.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “ఇంద్రియాలు”; ఇక్కడ ఒక వ్యక్తి అంతర్గతంగా గ్రహించి వివేచించే సామర్థ్యాలను రూపకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: పరిణతి చెందినవారు
  rationale: మునుపటి వచనంలోని పసిపిల్లలతో ఉన్న వ్యత్యాసాన్ని తెలియజేస్తుంది; పాపరహిత పరిపూర్ణతను సూచించకుండా ఎదిగిన స్థితిని వ్యక్తం చేస్తుంది.
- source_word: στερεὰ τροφή
  choice: గట్టి ఆహారం
  rationale: పాలతో వ్యత్యాసంగా ఉన్న మూల రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: διὰ τὴν ἕξιν
  choice: నిరంతర అభ్యాసం వల్ల
  rationale: ἕξις‌లోని అలవాటు, పునరావృత వినియోగం, అభ్యాసం అనే భావాలను సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ αἰσθητήρια
  choice: గ్రహణశక్తులు
  rationale: అక్షరార్థంగా ఇంద్రియాలు లేదా గ్రహణ సామర్థ్యాలు; ఇక్కడ మంచి చెడులను గుర్తించే అంతర్గత గ్రహణ సామర్థ్యాలకు రూపకంగా వాడబడింది.
- source_word: γεγυμνασμένα ἐχόντων
  choice: శిక్షణ ఇచ్చుకున్నవారు
  rationale: అభ్యాసం ద్వారా వారి గ్రహణశక్తులు శిక్షణ పొందిన స్థిరమైన ఫలితస్థితిని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: πρὸς διάκρισιν
  choice: గుర్తించడానికి
  rationale: πρός‌తో కూడిన διάκρισις ఉద్దేశాన్ని సూచిస్తుంది; మంచి చెడుల మధ్య భేదాన్ని గ్రహించడాన్ని స్పష్టంగా చెబుతుంది.
- source_word: καλοῦ τε καὶ κακοῦ
  choice: మంచి చెడులను
  rationale: τε καὶ కలిపి సూచించే రెండు అంశాలను సంక్షిప్తమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: δέ
  choice: కాని
  rationale: మునుపటి వచనంలోని పాలతో ఇక్కడి గట్టి ఆహారానికి ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ఆత్మీయ ఎదుగుదల సందర్భంలో τελείων భావం
  choice: పరిణతి చెందినవారు
  alternative: పరిపూర్ణులు; పూర్తిగా ఎదిగినవారు
  rationale: సందర్భం నైతికంగా దోషరహితులైన వర్గాన్ని కాక, వివేచనలో ఎదిగినవారిని పసిపిల్లలతో పోలుస్తోంది. అందువల్ల పాఠ్యం చెప్పని పరిపూర్ణతావాద భావాన్ని చేర్చకుండా ఎదుగుదల భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ఆహార రూపకాన్ని నిలిపి, αἰσθητήρια రూపకార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా చేసి అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
