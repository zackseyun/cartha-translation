  to: ఎవ్వరూ ఈ గౌరవాన్ని తనకు తానే స్వీకరించడు[a]; దేవునిచేత పిలువబడితేనే స్వీకరిస్తాడు—అహరోను కూడా అలాగే పిలువబడ్డాడు.
