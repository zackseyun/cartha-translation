id: HEB.5.4
reference: Hebrews 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: te
  text: ఎవ్వరూ ఈ గౌరవాన్ని తనకు తానే స్వీకరించడు[a]; దేవునిచేత పిలువబడితేనే స్వీకరిస్తాడు—అహరోను కూడా అలాగే పిలువబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ గౌరవాన్ని.” గ్రీకు మూలంలో అక్షరార్థంగా “ఆ గౌరవం” ఉంది; సందర్భంలో ఇది యాజక గౌరవం లేదా పదవిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ... τις
  choice: ఎవ్వరూ ... స్వీకరించడు
  rationale: నిషేధంతో కూడిన τιςను ఆధునిక తెలుగులో సహజమైన సార్వత్రిక నిషేధంగా ‘ఎవ్వరూ’ అని అనువదించాం.
- source_word: ἑαυτῷ
  choice: తనంతట తానే
  rationale: ఈ కర్తవ్య గౌరవాన్ని స్వయంగా తనకు తాను తీసుకోవడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: λαμβάνει
  choice: స్వీకరించడు / స్వీకరిస్తాడు
  rationale: λαμβάνει అంటే ‘తీసుకుంటాడు’ లేదా ‘స్వీకరిస్తాడు.’ ఇక్కడ గౌరవాన్ని తనకు తానే దక్కించుకోవడం మరియు దేవుని పిలుపువల్ల దాన్ని స్వీకరించడం మధ్య వ్యత్యాసాన్ని ‘స్వీకరించు’ సహజంగా నిలుపుతుంది.
- source_word: τὴν τιμήν
  choice: ఈ గౌరవాన్ని
  rationale: τιμήకు నేరమైన అర్థం ‘గౌరవం.’ ‘ఈ’ అనేది ముందు సందర్భంలోని ప్రధాన యాజక గౌరవాన్ని సూచిస్తుంది; దాన్ని నేరుగా ‘పదవి’గా మార్చలేదు.
- source_word: καλούμενος ὑπὸ τοῦ θεοῦ
  choice: దేవునిచేత పిలువబడినవాడే
  rationale: వర్తమాన కర్మణి అసమాపక క్రియను నిలుపుతూ, దేవుడే పిలిచే కర్త అని స్పష్టంగా తెలియజేస్తుంది. ‘వాడే’ ప్రతివ్యత్యాసాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: అహరోను కూడా అలాగే పిలువబడ్డాడు
  rationale: καθώσπερ పోలికను, καίలోని ‘కూడా’ భావాన్ని నిలిపి, గ్రీకులో అధ్యాహారంగా ఉన్న ‘పిలువబడ్డాడు’ అనే క్రియను తెలుగులో స్పష్టంగా ఇచ్చాం.
theological_decisions:
- issue: యాజక గౌరవం స్వయంగా చేపట్టేదా, దేవుని పిలుపుపై ఆధారపడేదా
  choice: ఈ గౌరవం స్వయంగా స్వీకరించేది కాదు; దేవునిచేత పిలువబడినవాడే దాన్ని స్వీకరిస్తాడు.
  alternative: దీనిని సాధారణ గౌరవం గురించి చేసిన విస్తృత ప్రకటనగా చదవవచ్చు.
  rationale: హెబ్రీయులు 5:1–5 సందర్భం ప్రధాన యాజకత్వం గురించి మాట్లాడుతుంది. అయినా τιμήను ‘పదవి’గా అతివివరించకుండా ‘గౌరవం’గానే ఉంచి సందర్భ సంబంధాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించాం. ‘తనంతట తానే’ స్వయంగా గౌరవాన్ని చేపట్టే భావాన్ని, ‘పిలువబడినవాడే’ దేవుని నియామకంతో ఉన్న వ్యత్యాసాన్ని సహజంగా తెలియజేస్తాయి.
