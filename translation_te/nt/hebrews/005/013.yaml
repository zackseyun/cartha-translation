  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: te
  text: ఎందుకంటే, పాలు తాగే ప్రతి వ్యక్తి నీతిబోధలో[a][b] అనుభవం లేనివాడు; ఎందుకంటే అతడు పసిబిడ్డ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతి గురించిన సందేశం” లేదా “నీతికి సంబంధించిన వాక్యం.”
    reason: lexical_alternative
  - marker: b
    text: “నీతి”కి బదులుగా “న్యాయం” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ... ὁ μετέχων
  choice: పాలు తీసుకునే ప్రతి వ్యక్తి
  rationale: ఆర్టికల్‌తో ఉన్న కృదంతం ఒక వర్గంలోని ప్రతి వ్యక్తిని సూచిస్తుంది. ‘తీసుకునే’ అనేది పాల రూపకాన్ని సహజంగా నిలుపుతుంది; పాలు మాత్రమే ఆహారంగా తీసుకుంటాడని మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: γάλακτος
  choice: పాలు
  rationale: సందర్భంలో కొనసాగుతున్న బోధనాత్మక రూపకాన్ని యథాతథంగా నిలిపింది.
- source_word: ἄπειρος
  choice: అనుభవం లేనివాడు
  rationale: పూర్తి అజ్ఞానం కన్నా అనుభవం లేదా ప్రావీణ్యం లేకపోవడాన్ని సూచించే పదార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λόγου δικαιοσύνης
  choice: నీతి వాక్యం
  rationale: గ్రీకు సమాససదృశ షష్ఠీ నిర్మాణంలోని సంక్షిప్తతను, అది ‘నీతి సంబంధమైన సందేశం’ లేదా ‘నీతి గురించిన వాక్యం’ కావచ్చనే అర్థవిస్తృతిని ప్రధాన పాఠంలో కొంతవరకు నిలుపుతుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: δικαιοσύνη యొక్క నైతిక, సదాచార, న్యాయ సంబంధ అర్థవిస్తృతికి ‘నీతి’ ఈ సందర్భంలో సరిపోతుంది; ‘న్యాయం’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: νήπιος
  choice: పసిబిడ్డ
  rationale: అపరిపక్వతను బలంగా చూపే పాల రూపకానికి అనుగుణంగా, ఆధునిక తెలుగులో స్పష్టంగా మరియు సహజంగా ఉంది.
- source_word: γάρ ... γάρ
  choice: ఎందుకంటే ... ; ... -ఏ
  rationale: మొదటి γάρను వివరణాత్మక సంధిగా ‘ఎందుకంటే’ అని అనువదించింది. రెండవ γάρ ఇచ్చే కారణబలాన్ని తెలుగులో సహజమైన ‘పసిబిడ్డే’ అనే నిశ్చయార్థక రూపం ద్వారా తెలిపింది.
theological_decisions:
- issue: λόγου δικαιοσύνης యొక్క సంబంధం
  choice: నీతి వాక్యం
  alternative: నీతి గురించిన సందేశం; నీతికి సంబంధించిన వాక్యం
  rationale: షష్ఠీ సంబంధాన్ని ఒకే విధంగా నిర్ణయించకుండా ప్రధాన పాఠంలో సంక్షిప్తంగా ఉంచి, సాధ్యమైన వివరణలను పాదటిప్పణిలో తెలిపింది.
- issue: δικαιοσύνη యొక్క అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఆత్మీయ పరిపక్వత, బోధ సందర్భంలో ‘నీతి’ విస్తృతంగా సరిపోతుంది. అయినా పదానికి ఉన్న న్యాయ సంబంధ భావాన్ని తొలగించకుండా పాదటిప్పణిలో నమోదు చేసింది.
- issue: νήπιος యొక్క వ్యాకరణ లింగం మరియు సాధారణ సూచన
  choice: అతడు పసిబిడ్డే
  alternative: ఆ వ్యక్తి పసిబిడ్డే
  rationale: గ్రీకులోని పుంలింగ ఏకవచన సాధారణ నిర్మాణాన్ని ప్రతిబింబిస్తూ ‘అతడు’ వాడింది; ఇది ఇక్కడ వర్గంలోని ప్రతి వ్యక్తికి సాధారణంగా వర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడింది. ‘నీతి వాక్యం’ అనే కొద్దిగా సాంద్రమైన పదబంధాన్ని ఉద్దేశపూర్వకంగా నిలిపి, దాని నిజమైన అర్థసందిగ్ధతను పాదటిప్పణుల్లో వివరించింది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
