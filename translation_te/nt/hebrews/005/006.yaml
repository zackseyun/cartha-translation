  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: te
  text: 'అలాగే ఆయన మరొక చోట[a] ఇలా అంటున్నాడు: “నీవు మెల్కీసెదెకు యాజకత్వపు క్రమం ప్రకారం[b] శాశ్వతంగా యాజకుడవు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరొక లేఖన భాగంలో.” గ్రీకులో అక్షరార్థంగా “మరొక దానిలో” అని ఉంది; సందర్భాన్ని బట్టి ‘చోటు’ లేదా ‘లేఖన భాగం’ అనే పదం భావించబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మెల్కీసెదెకు క్రమానుసారం.” ఇక్కడ ‘క్రమం’ యాజకత్వపు ఏర్పాటు లేదా వర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: అలాగే
  rationale: ముందటి లేఖన ఉల్లేఖనానికి సమాంతరంగా మరో ఉల్లేఖనాన్ని పరిచయం చేసే తులనాత్మక అనుసంధానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν ἑτέρῳ
  choice: మరొక చోట
  rationale: గ్రీకులో నామవాచకం వ్యక్తంగా లేకపోయినా, మరో లేఖన భాగం అనే భావం సందర్భంలో అంతర్భూతంగా ఉంది; ‘మరొక చోట’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λέγει
  choice: ఆయన ... అంటున్నాడు
  rationale: వర్తమానకాలంలోని వ్యక్తిగత వక్తను నిలుపుతూ, లేఖనం ద్వారా దేవుడు ఇప్పటికీ మాట్లాడుతున్నాడనే హెబ్రీయుల పత్రిక శైలిని ప్రతిబింబిస్తుంది.
- source_word: Σὺ
  choice: నీవు
  rationale: కీర్తన ఉల్లేఖనంలోని ఏకవచన ప్రత్యక్ష సంబోధనను యథాతథంగా ఉంచుతుంది.
- source_word: ἱερεὺς
  choice: యాజకుడవు
  rationale: ἱερεύςకు ప్రామాణికమైన, ఆధునిక తెలుగు బైబిలు సందర్భంలో స్పష్టమైన సమానార్థకం.
- source_word: εἰς τὸν αἰῶνα
  choice: శాశ్వతంగా
  rationale: నిరంతరంగా కొనసాగే కాలాన్ని తెలిపే గ్రీకు ప్రయోగానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: κατὰ τὴν τάξιν
  choice: క్రమం ప్రకారం
  rationale: మెల్కీసెదెకుతో ముడిపడిన యాజకత్వపు ఏర్పాటు లేదా వర్గాన్ని సూచించే τάξις భావాన్ని, కేవలం పోలికగా కుదించకుండా నిలుపుతుంది.
- source_word: Μελχισέδεκ
  choice: మెల్కీసెదెకు
  rationale: వ్యక్తి పేరును అనువదించకుండా, తెలుగులో స్థిరపడిన రూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: ఉల్లేఖన సూత్రంలో వక్త ఎవరు?
  choice: ‘ఆయన ... అంటున్నాడు’ అని వ్యక్తిగత వక్తను అంతర్భూతంగా ఉంచడం
  alternative: ‘అని ఉంది’ లేదా ‘లేఖనం చెబుతోంది’ అని అవ్యక్తంగా అనువదించడం
  rationale: గ్రీకులో కర్త స్పష్టంగా పేర్కొనబడకపోయినా λέγει ఏకవచన వ్యక్తిగత క్రియ. హెబ్రీయుల పత్రికలో లేఖనం ద్వారా దేవుడు వర్తమానంలో మాట్లాడుతున్నట్టుగా చూపే వాక్చాతుర్యాన్ని ఇది కాపాడుతుంది; అయితే ‘దేవుడు’ అనే పదాన్ని మూలంలో లేనందున చేర్చదు.
- issue: మెల్కీసెదెకు సంబంధంగా τάξις అర్థం
  choice: ‘క్రమం’—యాజకత్వపు ఏర్పాటు లేదా వర్గాన్ని సూచించేలా
  alternative: ‘విధానం’ లేదా ‘మాదిరి’
  rationale: హెబ్రీయుల వాదనలో ఇది కేవలం ప్రవర్తనా పోలిక కాదు; మెల్కీసెదెకుతో సంబంధమున్న ప్రత్యేక యాజకత్వ ఏర్పాటును సూచిస్తుంది. ‘క్రమం’ ఈ భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. కీర్తన ఉల్లేఖనానికి తగిన సంక్షిప్తతను కాపాడుతూ, ‘యాజకుడు,’ ‘శాశ్వతంగా,’ ‘క్రమం’ వంటి స్థిరమైన ధార్మిక పదాలను స్పష్టంగా వాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా చేర్చబడ్డాయి.
