id: HEB.5.7
reference: Hebrews 5:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: te
  text: ఆయన శరీరధారిగా ఉన్న రోజులలో, తనను మరణం నుండి రక్షించగలవానికి[a] బలమైన మొరతోను కన్నీళ్లతోను ప్రార్థనలనూ వేడుకోళ్లనూ అర్పించి, తన భయభక్తిని బట్టి ఆలకించబడ్డాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మరణం నుండి రక్షించగలవానికి” అనే మాటను “మరణంలోనుండి బయటకు తీసుకురాగలవానికి,” అంటే పునరుత్థానం ద్వారా విడిపించగలవానికి అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆయన భక్తిపూర్వక గౌరవాన్ని బట్టి”; మరొక సాధ్యమైన భావం, “ఆయన భక్తిపూర్వక విధేయతను బట్టి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: ఆయన శరీరంలో జీవించిన రోజుల్లో
  rationale: σάρξ అనే స్పష్టమైన శరీరార్థాన్ని నిలుపుతూ, యేసు భూలోక శరీర జీవితాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: ప్రార్థనలను, వేడుకోళ్లను
  rationale: రెండు సమీపార్థక పదాల మధ్య స్వల్ప భేదాన్ని నిలుపుతుంది; రెండవది తీవ్రమైన వినతిని సూచిస్తుంది.
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: తనను మరణం నుండి రక్షించగలవానికి
  rationale: దేవుని పేరు మూలంలో లేకపోవడంతో చేర్చలేదు. ἐκ θανάτου అనేది మరణించకుండా కాపాడడం లేదా మరణం నుండి బయటకు తీసుకురావడం అనే రెండు భావాలకూ వీలు కల్పించేలా ఉంచబడింది.
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: బలమైన మొరతోనూ కన్నీళ్లతోనూ
  rationale: ఏకవచన κραυγήని ‘మొర’గా, దాని తీవ్రతను ‘బలమైన’గా సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: προσενέγκας
  choice: అర్పించాడు
  rationale: ప్రార్థనలు సమర్పించాడనే అర్థంతో పాటు హెబ్రీయులకు పత్రికలోని యాజకత్వ సందర్భానికి తగిన అర్పణ ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: εἰσακουσθεὶς
  choice: ఆయన మొర ఆలకించబడింది
  rationale: కేవలం శబ్దం వినబడిందనే కాక అనుకూలంగా ఆలకించబడిందనే భావాన్ని ఇస్తుంది; సమాధానం ఏ రూపంలో వచ్చిందో అదనంగా నిర్ణయించదు.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: ఆయన భయభక్తిని బట్టి
  rationale: εὐλάβεια లోని భక్తిపూర్వక భయం, గౌరవం అనే భావాలను తెలుగులో సంక్షిప్తంగా నిలుపుతుంది; ‘విధేయత’ అనే వివరణను ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు.
theological_decisions:
- issue: ἀπὸ τῆς εὐλαβείας అనే పదబంధం యేసుకు సంబంధించి ఏ భావం ఇస్తుంది
  choice: ఆయన భయభక్తిని బట్టి
  alternative: ఆయన భక్తిపూర్వక గౌరవాన్ని బట్టి; ఆయన భక్తిపూర్వక విధేయతను బట్టి
  rationale: మూలపదం భయభక్తి, గౌరవం, భక్తిపూర్వక జాగ్రత్త వంటి భావాలను కలిగి ఉంది. ‘భయభక్తి’ యేసులో అనుచితమైన భయాన్ని సూచించకుండా ఆ భావ పరిధిని సహజంగా నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ἐκ θανάτου లోని రక్షణ పరిధి
  choice: మరణం నుండి రక్షించగలవానికి
  alternative: మరణించకుండా కాపాడగలవానికి; మరణంలోనుండి బయటకు తీసుకురాగలవానికి
  rationale: ఈ గ్రీకు పదబంధం మరణాన్ని తప్పించడం లేదా పునరుత్థానం ద్వారా మరణం నుండి విడుదల పొందడం—రెండింటికీ వీలు ఇస్తుంది. ప్రధాన పాఠ్యం ఈ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని దీర్ఘ భాగవాక్య నిర్మాణాన్ని రెండు సహజ తెలుగు వాక్యాలుగా విభజించినా, క్రియల సంబంధం మరియు యాజకత్వ సందర్భంలోని ‘అర్పించాడు’ అనే ప్రతిధ్వని నిలుపబడ్డాయి.
