revisions:
- from: ఆయన శరీరంలో జీవించిన రోజుల్లో, తనను మరణం నుండి రక్షించగలవానికి[a] బలమైన మొరతోనూ కన్నీళ్లతోనూ ప్రార్థనలను, వేడుకోళ్లను అర్పించాడు. ఆయన భయభక్తిని బట్టి ఆయన మొర ఆలకించబడింది.[b]
  to: ఆయన శరీరధారిగా ఉన్న రోజులలో, తనను మరణం నుండి రక్షించగలవానికి[a] బలమైన మొరతోను కన్నీళ్లతోను ప్రార్థనలనూ వేడుకోళ్లనూ అర్పించి, తన భయభక్తిని బట్టి ఆలకించబడ్డాడు.[b]
  rationale: The revision corrects the subject of “having been heard” and replaces an unnatural expression for “the days of his flesh.” It retains the source’s ambiguity concerning salvation from/out of death and retains «భయభక్తి» for εὐλάβεια, with lexical alternatives in the footnote. Footnote markers remain attached to the relevant expressions.
