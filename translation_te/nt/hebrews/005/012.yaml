revisions:
- from: ఎందుకంటే, గడిచిన కాలాన్ని బట్టి ఈపాటికి మీరు బోధకులై ఉండాలి. అయినా, మీకు మరొకరు[a] దేవుని వాక్కులకు[b] సంబంధించిన తొలి ప్రాథమిక అంశాలను మళ్లీ బోధించాల్సిన అవసరం ఉంది. మీరు గట్టి ఆహారం కాదు, పాలు అవసరమయ్యే స్థితికి వచ్చారు.
  to: ఎందుకంటే, ఈపాటికి మీరు బోధకులై ఉండవలసినవారైనా, దేవుని వాక్యాల[b] ఆరంభపు మూలాంశాలు ఏమిటో మీకు మళ్లీ బోధించాల్సిన అవసరం ఉంది. మీరు గట్టి ఆహారం కాదు, పాలే అవసరమయ్యే స్థితికి వచ్చారు.
