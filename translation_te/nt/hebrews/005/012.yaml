id: HEB.5.12
reference: Hebrews 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: te
  text: ఎందుకంటే, ఈపాటికి మీరు బోధకులై ఉండవలసినవారైనా, దేవుని వాక్యాల[b] ఆరంభపు మూలాంశాలు ఏమిటో మీకు మళ్లీ బోధించాల్సిన అవసరం ఉంది. మీరు గట్టి ఆహారం కాదు, పాలే అవసరమయ్యే స్థితికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “దేవుని వాక్యాలు” అనే పదానికి దేవుని దైవిక పలుకులు లేదా ప్రకటనలు అనే అర్థం కూడా ఉంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὀφείλοντες εἶναι
  choice: ఉండాలి
  rationale: ఇప్పటికే వారు బోధకులుగా ఉండవలసిన నైతిక, సహజ నిరీక్షణను అతిగా న్యాయపరమైన భాష లేకుండా తెలియజేస్తుంది.
- source_word: διδάσκαλοι
  choice: బోధకులు
  rationale: ఇతరులకు బోధించగలవారిని సూచించే సహజమైన, ప్రామాణిక తెలుగు పదం.
- source_word: διὰ τὸν χρόνον
  choice: గడిచిన కాలాన్ని బట్టి ఈపాటికి
  rationale: కాలం గడిచినందువల్ల వారి నుంచి పరిపక్వత ఆశించబడుతున్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మూలబోధ అవసరమైన పూర్వస్థితికి వారు తిరిగివచ్చినట్లు సూచిస్తుంది.
- source_word: τινὰ
  choice: మరొకరు
  rationale: SBLGNTలో ఇచ్చిన అనిర్దిష్ట సర్వనామ పఠనాన్ని అనుసరించి, బోధించే వ్యక్తిని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; ప్రశ్నార్థక పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὰ στοιχεῖα τῆς ἀρχῆς
  choice: తొలి ప్రాథమిక అంశాలు
  rationale: στοιχεῖα యొక్క మౌలిక భాగాలు అనే భావాన్నీ, τῆς ἀρχῆς యొక్క ఆరంభ దశ అనే భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: దేవుని వాక్కులు
  rationale: λόγιαను సాధారణ మాటలుగా కాక దేవుని నుంచి వచ్చిన ప్రకటనలుగా గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా అందిస్తుంది.
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: అవసరమయ్యే స్థితికి వచ్చారు
  rationale: కాలక్రమంలో ఏర్పడి ప్రస్తుతం కొనసాగుతున్న స్థితిని గ్రీకు పరిపూర్ణ కాలానికి తగినట్లు తెలియజేస్తుంది.
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: గట్టి ఆహారం కాదు, పాలు
  rationale: ఆధ్యాత్మిక అపరిపక్వతను సూచించే మూలంలోని ఆహార రూపకాన్ని వివరణాత్మక సిద్ధాంతంగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: పాలు—గట్టి ఆహారం అనే రూపకాల వ్యత్యాసం
  choice: మూలంలోని రూపకాన్నే యథాతథంగా నిలిపాం.
  alternative: ‘ప్రాథమిక బోధ—ఉన్నత బోధ’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: వచనం నిర్దిష్టమైన సిద్ధాంత పాఠ్యక్రమాన్ని నిర్వచించదు; అందువల్ల రూపకాన్ని నిలపడం రచయిత వాక్చాతుర్యాన్నీ భావ ఉద్రిక్తతనూ కాపాడుతుంది.
- issue: τινὰ పదపు అర్థం
  choice: అనిర్దిష్ట సర్వనామంగా తీసుకొని ‘మరొకరు’ అని అనువదించాం.
  alternative: ప్రశ్నార్థకంగా తీసుకొని ‘ప్రాథమిక అంశాలు ఏమిటో’ అని అనువదించడం.
  rationale: ఇచ్చిన SBLGNT పాఠంలోని τινὰ రూపాన్ని ప్రధాన పాఠంలో అనుసరించి, సాధ్యమైన ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘తొలి ప్రాథమిక అంశాలు’ అనే కొద్దిగా పునరుక్తిగా వినిపించే నిర్మాణం గ్రీకులోని στοιχεῖα మరియు ἀρχή రెండింటి బలాన్ని నిలుపుతుంది.
