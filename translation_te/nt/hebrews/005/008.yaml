translation:
  language: te
  text: ఆయన కుమారుడైనప్పటికీ[a], తాను అనుభవించిన వాటి ద్వారా విధేయతను నేర్చుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ఇక్కడ నిర్దేశక ఉపపదం లేకుండా కేవలం ‘కుమారుడు’ అని ఉంది. సందర్భాన్ని బట్టి ‘కుమారుడు’ లేదా ‘ఆ కుమారుడు’ అనే భావాన్ని ఉద్దేశించినట్లు అర్థం చేసుకోవచ్చు; తెలుగులో ఈ భేదం సహజంగా ప్రత్యేకంగా వ్యక్తం కాదు.
    reason: alternative_reading
  - marker: b
    text: ‘విధేయతను నేర్చుకున్నాడు’ అంటే ఆయన అంతకుముందు అవిధేయుడని కాదు; తాను అనుభవించిన బాధల ద్వారా విధేయతను అనుభవపూర్వకంగా నేర్చుకున్నాడని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: అయినప్పటికీ
  rationale: 'ఈ పదం రాయితీభావంతో కూడిన వ్యతిరేకతను సూచిస్తుంది: ఆయన కుమారుడైనా, బాధల ద్వారా విధేయతను నేర్చుకున్నాడు.'
- source_word: ὢν υἱός
  choice: ఆయన కుమారుడే
  rationale: ὢν అనే వర్తమాన కృదంతాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ‘అయినప్పటికీ’తో కలిపాం. υἱός ముందు గ్రీకులో నిర్దేశక ఉపపదం లేదు; తెలుగులో నిర్దిష్ట–అనిర్దిష్ట ఉపపద భేదం లేకపోవడంతో ‘కుమారుడు’ అని సహజంగా అనువదించాం. ‘ఏ’ విభక్తి కుమారత్వానికీ తరువాతి మాటకీ మధ్యనున్న వ్యతిరేకతను స్పష్టం చేస్తుంది.
- source_word: ἔμαθεν
  choice: నేర్చుకున్నాడు
  rationale: మూలంలోని ప్రత్యక్షమైన ‘నేర్చుకున్నాడు’ అనే భావాన్ని బలహీనపరచకుండా, దానిలోని వేదాంతపరమైన ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
- source_word: ἀφ’ ὧν ἔπαθεν
  choice: తాను అనుభవించిన బాధల ద్వారా
  rationale: ἀπό ఇక్కడ మూలం లేదా సాధనసదృశ ఆధారాన్ని సూచిస్తుంది. పదశః ‘తాను బాధపడిన వాటి నుండి’ కంటే ఈ రూపం సహజమైన ఆధునిక తెలుగులో అదే అనుభవాధారిత భావాన్ని అందిస్తుంది.
- source_word: τὴν ὑπακοήν
  choice: విధేయతను
  rationale: ὑπακοή దేవుని చిత్తానికి లోబడి స్పందించడాన్ని సూచిస్తుంది. తెలుగు ప్రయోగంలో భావవాచక నామానికి అదనపు నిర్దిష్టతా సూచకం అవసరం లేదు.
theological_decisions:
- issue: కుమారుడైన ఆయన విధేయతను నేర్చుకోవడం
  choice: ఆయన కుమారుడే అయినప్పటికీ
  alternative: ఆయన ఆ కుమారుడైనప్పటికీ
  rationale: గ్రీకు మూలంలో υἱόςకు నిర్దేశక ఉపపదం లేదు; అయితే సందర్భం యేసు యొక్క ప్రత్యేక కుమారత్వాన్ని సూచిస్తుంది. తెలుగులో ఉపపద భేదం లేకపోవడం వల్ల ప్రధాన అనువాదం రెండింటినీ బలవంతంగా వేరుచేయకుండా ఉంచుతుంది.
- issue: ‘విధేయతను నేర్చుకున్నాడు’ అనేది మునుపటి అవిధేయతను సూచిస్తుందా?
  choice: ప్రత్యక్ష వాక్యాన్ని అలాగే ఉంచడం
  alternative: విధేయతకు చెల్లించవలసిన మూల్యాన్ని తెలుసుకున్నాడు
  rationale: మూలపాఠం ‘విధేయతను నేర్చుకున్నాడు’ అని నేరుగా చెబుతుంది. దాన్ని వివరణాత్మకంగా మార్చకుండా, బాధను అనుభవించడం ద్వారా నేర్చుకున్నాడనే భావాన్నీ దానిలోని వేదాంతపరమైన ఉద్వేగాన్నీ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని వాడాం. ‘బాధల ద్వారా’ అనేది పదశః రూపం కంటే సహజంగా ఉండి, ἀφ’ ὧν ἔπαθεν యొక్క అనుభవాధారిత భావాన్ని కాపాడుతుంది.
