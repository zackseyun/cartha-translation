revisions:
- from: ఆయన కుమారుడే అయినప్పటికీ[a], తాను అనుభవించిన బాధల ద్వారా విధేయతను నేర్చుకున్నాడు[b].
  to: ఆయన కుమారుడైనప్పటికీ[a], తాను అనుభవించిన వాటి ద్వారా విధేయతను నేర్చుకున్నాడు[b].
  rationale: The revision removes the added emphasis in “కుమారుడే,” brings the suffering clause closer to the Greek relative expression, and adjusts the explanatory note so that it retains the source/basis relation of ἀφ’ ὧν while not resolving the verse’s theological tension in the translation itself.
