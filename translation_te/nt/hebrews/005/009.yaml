id: HEB.5.9
reference: Hebrews 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τελειωθεὶς ἐγένετο ⸂πᾶσιν τοῖς ὑπακούουσιν αὐτῷ⸃ αἴτιος σωτηρίας αἰωνίου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/009.yaml
  text: and[a], having been made perfect, he became the source of eternal salvation to all who obey him[b],
translation:
  language: te
  text: మరియు, సంపూర్ణతకు తీసుకురాబడి[a], ఆయన తనకు విధేయులయ్యే వారందరికీ నిత్య రక్షణకు కారణమయ్యాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిపూర్ణునిగా చేయబడి,” లేక “పూర్తి స్థితికి తీసుకురాబడి.” ఇక్కడ గ్రీకు పదం నైతికంగా మెరుగుపరచబడటాన్ని కాక, ఆయన యాజకత్వపు మరియు విమోచన కార్యపు ఉద్దేశిత సంపూర్ణతకు చేరడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నిత్య రక్షణకు మూలమయ్యాడు,” లేక “నిత్య రక్షణకు మూలకర్త అయ్యాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: తెలుగులో ప్రత్యేక పదంగా అనువదించకుండా వాక్యానుసంధానంలో వ్యక్తీకరించబడింది
  rationale: ఇక్కడ καὶ ముందరి వాక్యంతో భావాన్ని కలుపుతుంది. తెలుగు వాక్యంలో ‘మరియు’ అని ప్రారంభించడం అసహజంగా ఉండేందున, అనుసంధానాన్ని వాక్యప్రవాహంలోనే నిలిపాం.
- source_word: τελειωθεὶς
  choice: సంపూర్ణతకు తీసుకురాబడి
  rationale: ఇది τελειόω యొక్క భూతకాల నిష్క్రియాత్మక కృదంతం. నైతిక లోపం తొలగించబడిందనే భావం కాకుండా, ఉద్దేశించిన లక్ష్యం లేదా యాజక సంబంధమైన కార్యసిద్ధికి తీసుకురాబడిన భావాన్ని ఈ పదబంధం వ్యక్తం చేస్తుంది.
- source_word: ἐγένετο
  choice: అయ్యాడు
  rationale: పూర్తికి తీసుకురాబడిన తరువాత ఏర్పడిన పాత్రను లేదా ఫలితస్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: తనకు విధేయులయ్యే వారందరికీ
  rationale: ὑπακούωలోని వినయపూర్వకంగా విని లోబడే భావాన్ని ‘విధేయులయ్యే’ స్పష్టంగా అందిస్తుంది; వర్తమాన కృదంతంలోని నిరంతర లేదా లక్షణాత్మక భావాన్ని కూడా నిలుపుతుంది.
- source_word: αἴτιος
  choice: కారణం
  rationale: రక్షణ కలగడానికి బాధ్యత వహించే లేదా దానిని కలిగించే వ్యక్తి అనే కారణార్థాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: σωτηρίας
  choice: రక్షణ
  rationale: హెబ్రీయులకు పత్రికలోని స్థిరమైన రక్షణశాస్త్ర సంబంధమైన భావాన్ని ఆధునిక తెలుగు క్రైస్తవ వాడుకలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: αἰωνίου
  choice: నిత్య
  rationale: రక్షణ యొక్క శాశ్వత స్వభావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసుకు సంబంధించి τελειωθεὶς యొక్క భావం
  choice: సంపూర్ణతకు తీసుకురాబడి
  alternative: పరిపూర్ణునిగా చేయబడి
  rationale: మూలపదంలోని లక్ష్యసిద్ధి లేదా కార్యపరిపూర్తి భావాన్ని నిలుపుతూ, యేసు నైతిక లోపం నుండి నైతిక పరిపూర్ణతకు వచ్చాడనే అనవసరమైన అర్థాన్ని కలిగించకుండా ఉంది.
- issue: ‘తనకు విధేయులయ్యే వారందరికీ’ అనే మాటలోని పరిధి మరియు షరతు
  choice: విధేయతను స్పష్టంగానే ఉంచడం
  alternative: తనను విశ్వసించే వారందరికీ / తన మాట వినే వారందరికీ
  rationale: గ్రీకు పాఠం విధేయతను స్పష్టంగా చెబుతుంది. దానిని కేవలం విశ్వాసంగా మార్చకుండా, అలాగే ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థ ప్రకారం విస్తరించకుండా మూలంలోని ఉద్వేగాన్ని నిలిపాం.
- issue: αἴτιος యొక్క కారణార్థం
  choice: కారణం
  alternative: మూలం / మూలకర్త
  rationale: క్రీస్తు నిత్య రక్షణను కలిగించేవాడనే భావాన్ని ఉంచుతుంది; ‘రచయిత’ వంటి సాహిత్యార్థాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘సంపూర్ణతకు తీసుకురాబడి’ అనే రూపం నిష్క్రియాత్మక భావాన్నీ లక్ష్యసిద్ధినీ కాపాడుతుంది; ‘విధేయులయ్యే’ అనేది ఆజ్ఞాపాలనలోని కొనసాగుతున్న స్వభావాన్ని సహజంగా తెలియజేస్తుంది.
