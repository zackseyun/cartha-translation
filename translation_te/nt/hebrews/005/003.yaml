source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: te
  text: ఈ బలహీనత కారణంగా[a], ప్రజల కొరకు అర్పించవలసినట్లే, తన కొరకు కూడా పాపాల నిమిత్తం అర్పించవలసిన బాధ్యత అతనికి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా, “దాని కారణంగా.” ఇది ముందటి వచనంలో చెప్పిన ప్రధానయాజకుని బలహీనతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: ఈ బలహీనత కారణంగా
  rationale: διά + accusative యొక్క కారణార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. స్త్రీలింగ సర్వనామం ముందు వచనంలోని ἀσθένεια (‘బలహీనత’)ను సూచిస్తుంది; తెలుగు పాఠకునికి సంబంధం స్పష్టంగా ఉండేందుకు దానిని ప్రధాన పాఠ్యంలో వ్యక్తం చేశాం.
- source_word: ὀφείλει
  choice: బాధ్యత అతనికి ఉంది
  rationale: ఇది కేవలం సలహా లేదా సముచితతను కాక, యాజకునిపై ఉన్న విధి/కర్తవ్యాన్ని తెలియజేస్తుంది.
- source_word: καθὼς ... οὕτως καὶ
  choice: చేసినట్లే ... కూడా
  rationale: గ్రీకు పరస్పర పోలిక నిర్మాణాన్ని సహజమైన తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
- source_word: τοῦ λαοῦ
  choice: ప్రజల కోసం
  rationale: లేవీయ ప్రధానయాజక సందర్భంలోని నిబంధన ప్రజలను సూచిస్తుంది; మూలంలో లేని ‘ఇశ్రాయేలు’ అనే వివరణను చేర్చలేదు.
- source_word: αὑτοῦ
  choice: తన కోసం
  rationale: ప్రధానయాజకునినే తిరిగి సూచించే ఆత్మవాచక భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: προσφέρειν περὶ ἁμαρτιῶν
  choice: పాపాల నిమిత్తం అర్పించవలసిన
  rationale: ‘అర్పించు’ అనే క్రియను మూలంలోని విధంగానే స్పష్టమైన కర్మ లేకుండా ఉంచి, περὶ ἁμαρτιῶν యొక్క బలియర్పణ సందర్భార్థాన్ని ‘పాపాల నిమిత్తం’గా తెలిపింది; ‘బలులు’ లేదా ‘పాపపరిహార బలి’ అని మూలాన్ని మించి నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: δι’ αὐτὴν యొక్క పూర్వపదం
  choice: ముందటి వచనంలో చెప్పిన ప్రధానయాజకుని బలహీనత
  alternative: ఈ యాజక పదవి లేదా మొత్తం పరిస్థితి
  rationale: వ్యాకరణపరంగా స్త్రీలింగ αὐτήνకు అత్యంత సమీపమైన, భావపరంగా సరిపోయే పూర్వపదం 5:2లోని ἀσθένεια. అందువల్ల తన పాపాల కోసం కూడా అర్పించాల్సిన బాధ్యత అతని బలహీనతతో ముడిపడి ఉంది.
- issue: προσφέρεινకు వ్యక్తమైన కర్మను చేర్చాలా
  choice: ‘అర్పించు’ అని మాత్రమే అనువదించడం
  alternative: ‘బలులు అర్పించు’ లేదా ‘పాపపరిహార బలి అర్పించు’
  rationale: బలియర్పణ సందర్భం స్పష్టమైనప్పటికీ, ఈ వచనంలోని గ్రీకు క్రియకు ప్రత్యక్ష కర్మ లేదు. కాబట్టి ‘బలులు’ అని సరఫరా చేయకుండా మూలంలోని సంక్షిప్తతను, కొంత అనిర్దిష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని పోలికను నిలుపుతూ తెలుగు సహజత్వం కోసం వాక్యక్రమాన్ని మార్చాం. ‘ఈ బలహీనత’ అని పూర్వపదాన్ని స్పష్టం చేసినందున [a] గమనిక అక్షరార్థ రూపాన్ని నమోదు చేస్తుంది.
