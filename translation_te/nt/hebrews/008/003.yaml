id: HEB.8.3
reference: Hebrews 8:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: te
  text: ఎందుకంటే, ప్రతి ప్రధాన యాజకుడు అర్పణలనూ బలులనూ అర్పించడానికి నియమించబడతాడు. కాబట్టి, ఈయన కూడా అర్పించడానికి ఏదో ఒకటి కలిగి ఉండడం అవసరం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈయన కూడా అర్పించడానికి ఏదో ఒకటి కలిగి ఉండాలి.” గ్రీకు వాక్యంలో ‘ఈయన’ ఎవరన్నది పేరుతో చెప్పలేదు; సందర్భంలో అది ప్రధాన యాజకుడైన యేసును సూచిస్తుంది.
    reason: సూచ్యవ్యక్తి అంతర్నిహితంగా ఉండడం మరియు సహజమైన ప్రత్యామ్నాయ వాక్యనిర్మాణం
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: ఎందుకంటే, ప్రతి ప్రధాన యాజకుడు
  rationale: πᾶς ఏకవచన నామవాచకంతో విభజనాత్మకంగా ‘ప్రతి’ అనే భావాన్ని ఇస్తుంది. γάρ ముందు వాక్యానికి వివరణాత్మక సంబంధాన్ని చూపుతుంది. ἀρχιερεύς‌కు ‘ప్రధాన యాజకుడు’ సహజమైన, సందర్భోచితమైన పదం.
- source_word: εἰς τὸ προσφέρειν
  choice: అర్పించడానికి
  rationale: εἰς‌తో కూడిన articular infinitive ఉద్దేశాన్ని సూచిస్తుంది; ‘అర్పించడానికి’ ఆ ప్రయోజన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δῶρά τε καὶ θυσίας
  choice: అర్పణలనూ బలులనూ
  rationale: τε καὶ జతగా ఉన్న రెండు వర్గాలను స్పష్టంగా కలుపుతుంది. δῶρα, θυσίαι అనే వేర్వేరు ఆరాధనా పదాలను ‘అర్పణలు’, ‘బలులు’గా విడిగా నిలుపుతుంది.
- source_word: καθίσταται
  choice: నియమించబడతాడు
  rationale: యాజక పదవికి నియామకం లేదా స్థాపన అనే నిష్క్రియార్థాన్ని ఈ సందర్భంలో ‘నియమించబడతాడు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὅθεν
  choice: కాబట్టి
  rationale: ముందటి ప్రకటననుంచి వచ్చే తార్కిక నిర్ధారణను ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ἀναγκαῖον ἔχειν
  choice: కలిగి ఉండడం అవసరం
  rationale: ఈ నిర్మాణంలోని అవసరత భావాన్ని తెలుగులో సహజమైన అనివార్యతా వ్యక్తీకరణగా నిలుపుతుంది.
- source_word: τι
  choice: ఏదో ఒకటి
  rationale: నిర్దిష్టంగా పేర్కొనని వస్తువును సూచించే τι యొక్క అనిశ్చిత భావాన్ని కాపాడుతుంది.
- source_word: καὶ τοῦτον
  choice: ఈయన కూడా
  rationale: τοῦτον‌లోని సూచనాత్మక బలాన్ని గౌరవప్రదమైన తెలుగు ‘ఈయన’తో నిలుపుతూ, καίని ‘కూడా’గా వ్యక్తం చేస్తుంది; సందర్భంలో ఇది యేసును సూచించినా ఆయన పేరును మూలపాఠ్యంలోకి చేర్చదు.
- source_word: ὃ προσενέγκῃ
  choice: అర్పించడానికి
  rationale: సంబంధవాచక సర్వనామం మరియు aorist subjunctive కలిపి అర్పించదగిన లేదా అర్పించబోయే దాని భావాన్ని ఇస్తాయి. తెలుగులో ‘అర్పించడానికి ఏదో ఒకటి’ సహజంగా ఆ ఉద్దేశ్య/సామర్థ్య భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: τοῦτον (‘ఈయన’) ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ఈయన’ అని ఉంచి, సందర్భానుసారం అది ప్రధాన యాజకుడైన యేసును సూచిస్తుందని పాదటిప్పణిలో వివరణ ఇవ్వడం.
  alternative: ప్రధాన పాఠ్యంలోనే ‘యేసు’ లేదా ‘క్రీస్తు’ అని స్పష్టంగా చేర్చడం.
  rationale: సందర్భం సూచ్యవ్యక్తిని స్పష్టం చేస్తుంది; అయితే గ్రీకు పాఠ్యం పేరుకు బదులు సూచనాత్మక సర్వనామాన్ని వాడుతుంది. అందువల్ల మూలంలోని అంతర్నిహిత సూచనను అలాగే నిలుపుతుంది.
- issue: δῶρα మరియు θυσίαι అనే ఆరాధనా పదాల భేదం
  choice: ‘అర్పణలు’ మరియు ‘బలులు’ అనే రెండు వేర్వేరు వర్గాలుగా నిలుపడం.
  alternative: రెండింటినీ కలిపి ‘బల్యర్పణలు’ వంటి ఒకే పదబంధంగా అనువదించడం.
  rationale: వాక్యం సాధారణ యాజక సూత్రాన్ని తెలియజేస్తుంది; ఇక్కడ క్రీస్తు స్వీయార్పణపై అదనపు సిద్ధాంత వివరణను చేర్చకుండా మూలపాఠ్యంలోని రెండు ఆరాధనా వర్గాలను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యాజక సంబంధిత గౌరవప్రదమైన శైలిని నిలుపుతూ అనువదించబడింది. ‘ఈయన’ గ్రీకు సూచనాత్మక సర్వనామంలోని గౌరవం మరియు సమీప సందర్భ సూచనను సహజంగా అందిస్తుంది.
