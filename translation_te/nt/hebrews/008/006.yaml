id: HEB.8.6
reference: Hebrews 8:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: te
  text: అయితే ఇప్పుడు ఆయన మరింత శ్రేష్ఠమైన పరిచర్యను పొందాడు; ఆయన ఎంత శ్రేష్ఠమైన నిబంధనకు మధ్యవర్తిగా ఉన్నాడో, అంత శ్రేష్ఠమైన పరిచర్యను పొందాడు. ఆ నిబంధన మరింత శ్రేష్ఠమైన వాగ్దానాలపై చట్టబద్ధంగా స్థాపించబడింది.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరింత ఉన్నతమైన సేవను పొందాడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మరింత శ్రేష్ఠమైన వాగ్దానాలపై స్థాపించబడింది.’
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు పదానికి ‘నిబంధన’ లేదా కొన్ని సందర్భాల్లో ‘వీలునామా’ అనే అర్థం రావచ్చు. అయితే తర్వాతి వచనాల్లో ఉటంకించబడే యిర్మీయా నూతన నిబంధన వాగ్దానానికి ఇక్కడ ‘నిబంధన’ సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: అయితే ఇప్పుడు
  rationale: ముందు ప్రస్తావించిన భూలోక యాజకుల పరిచర్యతో ప్రస్తుత వ్యత్యాసాన్ని తెలియజేసే సహజమైన తెలుగు ప్రయోగం.
- source_word: διαφορωτέρας
  choice: మరింత శ్రేష్ఠమైన
  rationale: నాణ్యతలో ఉన్న ఆధిక్యాన్ని తెలిపే తులనాత్మక భావాన్ని, హెబ్రీయులకు పత్రికలోని ఉన్నతమైన శైలిని నిలుపుతుంది.
- source_word: τέτυχεν
  choice: పొందాడు
  rationale: పూర్తయిన కార్యం వల్ల ప్రస్తుతం కలిగివున్న స్థితిని సూచించే గ్రీకు పరిపూర్ణ కాల భావాన్ని సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λειτουργίας
  choice: పరిచర్య
  rationale: సందర్భంలో క్రీస్తు నిర్వహించే పవిత్ర యాజక సేవను సూచిస్తుంది; ‘పరిచర్య’ దానిని అనవసరంగా విస్తరించకుండా తెలియజేస్తుంది.
- source_word: ὅσῳ καὶ
  choice: ఆ నిబంధన ఎంత శ్రేష్ఠమైనదో, ఆయన పరిచర్య కూడా అంత శ్రేష్ఠమైనది
  rationale: క్రీస్తు పరిచర్య ఆధిక్యాన్ని ఆయన మధ్యవర్తిత్వం వహించే నిబంధన ఆధిక్యంతో అనుపాతంగా ముడిపెట్టే గ్రీకు తులనాత్మక నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κρείττονός ... διαθήκης
  choice: మరింత శ్రేష్ఠమైన నిబంధన
  rationale: హెబ్రీయులకు పత్రికలో పునరావృతమయ్యే ‘మెరుగైన/శ్రేష్ఠమైన’ అనే ఆధిక్య భావాన్ని, యిర్మీయా నూతన నిబంధన నేపథ్యాన్ని కాపాడుతుంది.
- source_word: μεσίτης
  choice: మధ్యవర్తి
  rationale: రెండు పక్షాల మధ్య నిలిచి నిబంధన సంబంధాన్ని సాధించే వ్యక్తికి ఖచ్చితమైన, స్థిరమైన తెలుగు పదం.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: మరింత శ్రేష్ఠమైన వాగ్దానాల ఆధారంగా
  rationale: ἐπί ఇక్కడ సూచించే ఆధారం లేదా పునాది భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νενομοθέτηται
  choice: అమలులోకి తీసుకురాబడిన
  rationale: నిబంధన అధికారపూర్వకంగా ఏర్పరచబడి నిరంతరంగా అమలులో ఉన్నదనే పరిపూర్ణ కర్మణి రూపంలోని న్యాయపరమైన భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: హెబ్రీయులకు 8:6లో διαθήκη అనువాదం
  choice: నిబంధన
  alternative: వీలునామా
  rationale: తర్వాతి వచనాల్లో ఉటంకించబడే యిర్మీయా నూతన నిబంధన వాగ్దానం, అలాగే యాజక మధ్యవర్తిత్వం ఈ సందర్భాన్ని నిర్ణయిస్తాయి. ‘వీలునామా’ అనే అర్థం కొన్ని ఇతర సందర్భాల్లో సాధ్యమైనా, ఇక్కడ పాత నిబంధన నేపథ్యాన్ని మరుగుపరుస్తుంది.
- issue: ὅσῳ καὶ యొక్క అనుపాత సంబంధం
  choice: నిబంధన ఆధిక్యానికి అనుగుణంగా పరిచర్య ఆధిక్యాన్ని స్పష్టంగా తులన చేయడం
  alternative: కేవలం ‘ఎందుకంటే’ అని కారణ సంబంధంగా అనువదించడం
  rationale: గ్రీకు నిర్మాణం సాధారణ కారణాన్ని మాత్రమే కాకుండా ‘ఎంత మేరకు... అంత మేరకు’ అనే అనుపాత తులనను వ్యక్తం చేస్తుంది; అందువల్ల ఆ వాదనా బలాన్ని తెలుగులో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూలంలోని తులనాత్మక వాదన స్పష్టంగా ఉండేందుకు మొదటి దీర్ఘ వాక్యాన్ని రెండు వాక్యాలుగా విభజించి, ὅσῳ καὶ యొక్క అనుపాత భావాన్ని చివరి ఉపవాక్యంలో వెలిబుచ్చాం. ‘పరిచర్య,’ ‘నిబంధన,’ ‘మధ్యవర్తి’ వంటి బైబిలు సందర్భానికి సుపరిచితమైన పదాలను ఉంచి, ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చలేదు.
