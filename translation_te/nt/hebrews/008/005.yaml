id: HEB.8.5
reference: Hebrews 8:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: te
  text: 'వీరు పరలోక సంబంధమైన వాటికి ప్రతిరూపంగానూ నీడగానూ ఉన్న దానిలో పవిత్ర సేవ చేస్తారు. మోషే ప్రత్యక్ష గుడారాన్ని నిర్మించబోతున్నప్పుడు దేవునిచేత ఇలా ఆదేశం పొందాడు[a]: ఎందుకంటే ఆయన ఇలా అంటున్నాడు: “కొండ మీద నీకు చూపించిన నమూనా ప్రకారమే సమస్తాన్నీ చేయడానికి జాగ్రత్తపడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవునిచేత హెచ్చరించబడ్డాడు.” గ్రీకు క్రియ దైవిక హెచ్చరికను లేదా గట్టిగా ఇచ్చిన ఉపదేశాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείγματι
  choice: నకలుగా ఉన్నదానిలో
  rationale: పరలోక సంబంధమైన వాటికి అనుగుణంగా ఉన్న భూలోక పవిత్ర స్థలాన్ని సూచిస్తుంది; ‘నకలు’ దాని అనురూపతను, అలాగే అధీన స్థానాన్ని నిలుపుతుంది.
- source_word: σκιᾷ
  choice: నీడగా
  rationale: పరలోకమైన దానితో పోలిస్తే తక్కువ స్థాయి గల అనురూపాన్ని సూచించే హెబ్రీయులకు పత్రికలోని రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: λατρεύουσιν
  choice: పవిత్ర సేవ చేస్తున్నారు
  rationale: సాధారణ సేవకంటే యాజకుల ఆరాధనా సంబంధమైన సేవను సందర్భానుగుణంగా స్పష్టం చేస్తుంది.
- source_word: τῶν ἐπουρανίων
  choice: పరలోక సంబంధమైన వాటికి
  rationale: కేవలం స్థలాన్ని లేదా అమూర్త ‘వాస్తవాలను’ మాత్రమే నిర్దేశించకుండా గ్రీకు పదబంధపు విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: κεχρημάτισται
  choice: దేవుని చేత ఆదేశించబడ్డాడు
  rationale: దైవిక సమాచారమూ నిర్దేశమూ రెండింటినీ తెలుపుతుంది; హెచ్చరిక భావం కూడా సాధ్యమని పాదసూచికలో ఉంచబడింది.
- source_word: ἐπιτελεῖν
  choice: నిర్మించబోతున్నప్పుడు
  rationale: ఈ సందర్భంలో ప్రత్యక్ష గుడారాన్ని కార్యరూపంలో నిర్మించడాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘పూర్తి చేయడం’ అనే విస్తృత అర్థం కూడా సాధ్యం.
- source_word: σκηνήν
  choice: ప్రత్యక్ష గుడారం
  rationale: మోషే కాలపు ఆరాధనా గుడారానికి తెలుగులో స్థిరపడిన, స్పష్టమైన పదబంధం.
- source_word: Ὅρα
  choice: జాగ్రత్తపడు
  rationale: ఉద్ధరణలోని ఆజ్ఞాత్మక, హెచ్చరికతో కూడిన బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ποιήσεις πάντα
  choice: సమస్తాన్నీ చేయడానికి
  rationale: గ్రీకు భవిష్యత్ రూపం ఇక్కడ ఆజ్ఞార్థకంగా పనిచేస్తుంది; తెలుగులో సహజమైన ఆజ్ఞా నిర్మాణంతో అందించబడింది.
theological_decisions:
- issue: భూలోక పవిత్ర స్థలానికి పరలోక సంబంధమైన వాటితో ఉన్న సంబంధం
  choice: ‘పరలోక సంబంధమైన వాటికి నకలుగానూ నీడగానూ’
  alternative: ‘పరలోక వాస్తవాలకు మాదిరిగానూ నీడగానూ’
  rationale: భూలోక సేవకు పరలోకమైన దానితో నిజమైన అనురూపత ఉన్నప్పటికీ అది తక్కువ స్థాయిలో ఉందనే ఉద్రిక్తతను నిలుపుతుంది; దానిని కేవలం ప్రతీకగా పరిమితం చేయదు.
- issue: κεχρημάτισται యొక్క భావబలం
  choice: ‘దేవుని చేత ఆదేశించబడ్డాడు’
  alternative: ‘దేవుని చేత హెచ్చరించబడ్డాడు’
  rationale: క్రియలోని దైవిక సమాచారాన్ని, నిర్దేశాన్ని ప్రధానంగా ఉంచుతుంది; హెచ్చరిక భావాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని మొదటి భాగం స్థానార్థక దత్తివిభక్తిని కలిగి ఉండటంతో ‘నకలుగానూ నీడగానూ ఉన్నదానిలో’ అని అనువదించబడింది. ప్రధాన పాఠంలో ఉన్న ఏకైక పాదసూచిక గుర్తు [a] పాదసూచికతో సరిపోతుంది.
