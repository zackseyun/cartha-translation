id: HEB.8.10
reference: Hebrews 8:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: te
  text: '“ఆ రోజుల తర్వాత నేను ఇశ్రాయేలు ఇంటివారితో చేయబోయే నిబంధన ఇదే,” అని ప్రభువు చెబుతున్నాడు: “నా నియమాలను వారి మనస్సుల్లో ఉంచుతూ[a], వాటిని వారి హృదయాలపై రాస్తాను. నేను వారికి దేవుడిగా ఉంటాను; వారు నాకు ప్రజలుగా ఉంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సహజంగా: “నా నియమాలను వారి మనస్సుల్లో ఉంచుతాను; వాటిని వారి హృదయాలపై రాస్తాను.” గ్రీకులో మొదట కృదంతం (“ఉంచుతూ/ఇస్తూ”), తర్వాత భవిష్యత్ క్రియ (“రాస్తాను”) ఉన్నాయి.'
    reason: మూలంలోని మిశ్రమ క్రియా నిర్మాణాన్ని వివరించి, సహజమైన తెలుగు ప్రత్యామ్నాయాన్ని అందించుట.
lexical_decisions:
- source_word: διαθήκη
  choice: నిబంధన
  rationale: యిర్మీయా 31 నేపథ్యంలోని దేవుడు–ప్రజల ఒడంబడిక భావాన్ని సహజమైన, స్థిరపడిన తెలుగు బైబిలు పదంతో వ్యక్తం చేస్తుంది.
- source_word: διαθήσομαι
  choice: చేయబోయే
  rationale: భవిష్యత్ కాలంలోని ‘చేస్తాను/ఏర్పరుస్తాను’ అనే భావాన్ని సంబంధవాచక నిర్మాణంలో సహజంగా తెలియజేస్తుంది.
- source_word: οἴκῳ Ἰσραήλ
  choice: ఇశ్రాయేలు ఇంటివారితో
  rationale: ప్రవచనాత్మక ‘ఇశ్రాయేలు ఇల్లు’ అనే సమూహార్థాన్ని నిలుపుతూ, ఆధునిక తెలుగులో వ్యక్తుల సముదాయాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: ఆ రోజుల తర్వాత
  rationale: గ్రీకు కాలసూచక ప్రయోగాన్నీ యిర్మీయా గ్రంథంతో ఉన్న అంతర్పాఠ్య అనుసంధానాన్నీ నేరుగా కాపాడుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: గ్రీకు κύριοςను నేరుగా ప్రతిబింబిస్తూ, దేవునికి సంబంధించిన గౌరవప్రదమైన సాధారణ తెలుగు సంబోధనను ఉపయోగిస్తుంది.
- source_word: διδοὺς
  choice: ఉంచుతూ
  rationale: మూలంలోని వర్తమాన కృదంత నిర్మాణాన్ని నిలుపుతుంది; ‘ఇస్తూ’ కంటే నియమాలు మనస్సులో స్థాపించబడే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νόμους
  choice: నియమాలను
  rationale: గ్రీకులోని బహువచనాన్ని కాపాడుతుంది; ‘ధర్మశాస్త్రం’ అనే ఏకవచన సమగ్ర భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: διάνοιαν αὐτῶν
  choice: వారి మనస్సుల్లో
  rationale: అవగాహన, ఆలోచనలకు సంబంధించిన అంతరంగ సామర్థ్యాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; సమూహంలోని వ్యక్తుల భావాన్ని బహువచనంతో స్పష్టం చేస్తుంది.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: వారి హృదయాలపై
  rationale: ἐπίతో కూడిన లిఖన రూపకాన్ని ‘పై’ ద్వారా కాపాడుతూ, అంతరంగ మార్పు భావాన్ని నిలుపుతుంది.
- source_word: ἐπιγράψω
  choice: రాస్తాను
  rationale: ‘లిఖిస్తాను’ కంటే సాధారణ పాఠకులకు సహజంగా ఉండి, హృదయాలపై వ్రాయడం అనే రూపకాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: నేను వారికి దేవుడిగా ఉంటాను
  rationale: గ్రీకు నిర్మాణానికి దగ్గరగా ఉండి, నిబంధన సంబంధ సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: వారు నాకు ప్రజలుగా ఉంటారు
  rationale: ‘వారు నా ప్రజలుగా ఉంటారు’ అనే సహజ ప్రత్యామ్నాయం కంటే μοι (‘నాకు’) మరియు εἰς λαόν నిర్మాణాన్ని మరింత స్పష్టంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: యిర్మీయా నిబంధన వాక్యంతో అంతర్పాఠ్య కొనసాగింపు
  choice: ‘ఇశ్రాయేలు ఇంటివారు,’ ‘నా నియమాలు,’ ‘హృదయాలపై,’ ‘వారికి దేవుడిగా,’ ‘నాకు ప్రజలుగా’ వంటి నిబంధనాత్మక పదబంధాలను నిలుపుట
  alternative: ప్రవచన వాక్యపు రూపాన్ని తగ్గించి మరింత స్వేచ్ఛగా భావానువాదం చేయుట
  rationale: ఈ వచనం యిర్మీయా 31లోని నిబంధన వాగ్దానాన్ని ఉటంకిస్తుంది; దాని పదరూప ప్రతిధ్వని వచనంలోని దైవశాస్త్ర బలానికి ముఖ్యమైనది.
- issue: διδοὺς కృదంతం మరియు ἐπιγράψω భవిష్యత్ క్రియ మధ్య అసమాన నిర్మాణం
  choice: ‘ఉంచుతూ … రాస్తాను’ అని మూలంలోని కృదంత–భవిష్యత్ నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలుపుట
  alternative: ‘ఉంచుతాను … రాస్తాను’ అని రెండు సమాన భవిష్యత్ క్రియలుగా సవరించుట
  rationale: మూల గ్రీకు నిర్మాణంలోని నిజమైన వ్యాకరణ అసమానతను పూర్తిగా తొలగించకుండా, పాఠకుడికి అర్థమయ్యే తెలుగులో అందిస్తుంది; మరింత సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: నిబంధన ప్రజల గుర్తింపును సాధారణీకరించాలా
  choice: ‘ఇశ్రాయేలు ఇంటివారు’ అనే నిర్దిష్ట సూచనను యథాతథంగా ఉంచుట
  alternative: ‘దేవుని ప్రజలు’ లేదా ‘విశ్వాసులు’ అని సాధారణీకరించుట
  rationale: వచనం ప్రత్యక్షంగా ఇశ్రాయేలు ఇంటిని పేర్కొంటుంది; దాని పరిధిని అనువాదంలోనే విస్తరించడం లేదా పునర్నిర్వచించడం దైవశాస్త్ర ఉద్రిక్తతను ముందుగానే పరిష్కరించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రత్యక్ష ఉటంకణ చిహ్నాలతో వక్త మార్పు స్పష్టం చేయబడింది. ‘నిబంధన’ మరియు ‘హృదయాలు’ వంటి స్థిరమైన బైబిలు పదజాలం నిలుపబడింది; అతిగా ప్రాచీనమైన లేదా పాండిత్యభరితమైన రూపాలు నివారించబడ్డాయి.
