id: HEB.8.13
reference: Hebrews 8:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: te
  text: “కొత్తది”[b] అని చెప్పడం ద్వారా[a], ఆయన మొదటిదాన్ని పాతదిగా చేశాడు. పాతబడుతూ ముదిరిపోతున్నది కనుమరుగవడానికి[c] దగ్గరగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అని చెప్పినప్పుడు,” “అని చెప్పడంలో.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పాఠ్యంలో “కొత్తది” అనే మాట మాత్రమే ఉల్లేఖించబడింది; ఇది ముందున్న యిర్మీయా 31:31 ఉల్లేఖనంలోని “కొత్త నిబంధన” అనే మాటను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
  - marker: c
    text: లేదా “అదృశ్యమైపోవడానికి” లేదా “అంతరించిపోవడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: అని చెప్పడం ద్వారా
  rationale: ἐν తో కూడిన articular infinitive సందర్భం లేదా సాధనాన్ని సూచించగలదు. ఇక్కడ “చెప్పడం ద్వారా” అనే రూపం ‘కొత్తది’ అని పలకడమే మొదటిదాన్ని పాతబడినదిగా నిర్ధారిస్తున్న భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Καινὴν
  choice: “కొత్తది”
  rationale: గ్రీకులో నామవాచకం లేకుండా విశేషణం మాత్రమే ఉంది; ఇది ముందున్న యిర్మీయా ఉల్లేఖనంలోని ‘కొత్త నిబంధన’ను సంక్షిప్తంగా ప్రతిధ్వనిస్తుంది. అందువల్ల నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: πεπαλαίωκεν
  choice: పాతబడినదిగా చేశాడు
  rationale: పూర్తయిన చర్యకు కొనసాగుతున్న ఫలితాన్ని సూచించే perfect రూపాన్ని ఇది ప్రతిబింబిస్తుంది. ‘పాతదిగా చేశాడు’ కంటే ‘పాతబడినదిగా చేశాడు’ సందర్భంలోని ఇక ప్రస్తుత ఉపయోగానికి తగనిదిగా చేయబడిన భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: τὴν πρώτην
  choice: మొదటిదాన్ని
  rationale: గ్రీకులో విశేషణమే నామవాచకంగా వాడబడింది. సందర్భం మొదటి నిబంధనను సూచించినా, మూలంలోని సంక్షిప్తతను కాపాడేందుకు ‘నిబంధన’ను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: τὸ ... παλαιούμενον
  choice: పాతబడుతూ
  rationale: వర్తమాన participle కొనసాగుతున్న ప్రక్రియను సూచిస్తుంది; ‘పాతబడుతూ’ ఆ ప్రక్రియాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: γηράσκον
  choice: ముసలిదవుతున్నది
  rationale: మూలంలోని వృద్ధాప్య రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా నేరుగా నిలుపుతుంది.
- source_word: ἐγγὺς
  choice: సమీపంగా ఉంది
  rationale: genitive తో వచ్చిన ἐγγύς ముగింపు దగ్గరలో ఉందనే భావాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: ἀφανισμοῦ
  choice: కనుమరుగవడానికి
  rationale: ἀφανισμός ఇక్కడ కనిపించకుండా పోవడం లేదా అంతరించిపోవడాన్ని సూచిస్తుంది. ‘కనుమరుగవడం’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘నాశనం’ వంటి బలమైన భావాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: ‘కొత్తది’ అని చెప్పేవారి గుర్తింపు
  choice: ‘ఆయన’ అని మాత్రమే పేర్కొనడం
  alternative: ‘దేవుడు’ లేదా ‘లేఖనం’ అని స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యంలో కర్త స్పష్టంగా పేర్కొనబడలేదు; ముందున్న యిర్మీయా ఉల్లేఖనంలోని వక్తకు తిరిగి సూచన ఉంది. ‘ఆయన’ మూలంలోని సంక్షిప్తతను, ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
- issue: మొదటి నిబంధన స్థితి
  choice: ‘మొదటిదాన్ని పాతబడినదిగా చేశాడు’
  alternative: ‘మొదటిదాన్ని పాతదిగా చేశాడు’ లేదా ‘కాలం చెల్లినదిగా ప్రకటించాడు’
  rationale: కొత్త నిబంధనతో పోలిస్తే మొదటిది అధిగమించబడిందనే సందర్భార్థాన్ని ఈ రూపం తెలియజేస్తుంది; అయితే ధర్మశాస్త్రం గురించి వాక్యానికి మించిన సిద్ధాంత నిర్ణయాలను ఇందులో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. ‘కొత్తది,’ ‘మొదటిది’ అనే మూలంలోని ellipsisను అలాగే ఉంచి, వృద్ధాప్య రూపకాన్ని ‘ముసలిదవుతున్నది’గా నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
