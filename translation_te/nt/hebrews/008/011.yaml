id: HEB.8.11
reference: Hebrews 8:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: te
  text: మరియు ప్రతివాడూ తన తోటి పౌరునికి[a], ప్రతివాడూ తన సహోదరునికి, ‘ప్రభువును తెలుసుకో’ అని బోధించనే బోధించడు. ఎందుకంటే వారిలో అల్పుల నుండి గొప్పవారి వరకు అందరూ నన్ను తెలుసుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పొరుగువానికి.’ హెబ్రీయులకు పత్రిక గ్రీకు పాఠంలో ‘తోటి పౌరునికి’ అని ఉంది; దానికి ఆధారమైన యిర్మీయా వాక్యం సాధారణంగా ‘పొరుగువానికి’ అని అనువదించబడుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: బోధించనే బోధించడు
  rationale: οὐ μήతో కూడిన అఓరిస్ట్ సబ్‌జంక్టివ్ బలమైన నిరాకరణను తెలియజేస్తుంది. తెలుగు పునరుక్తి నిర్మాణం ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: ἕκαστος
  choice: ప్రతివాడూ
  rationale: నిబంధన సమాజంలోని వ్యక్తులపై ఉన్న పంపిణీ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πολίτην
  choice: తోటి పౌరునికి
  rationale: హెబ్రీయులకు పత్రికలోని గ్రీకు పాఠం ‘పౌరుడు’ అనే నిర్దిష్ట అర్థాన్నిస్తుంది; యిర్మీయా నేపథ్యంలోని సంప్రదాయ ‘పొరుగువాడు’ కంటే మూలపాఠానికి ప్రాధాన్యం ఇచ్చాం.
- source_word: ἀδελφὸν
  choice: సహోదరునికి
  rationale: మూలంలోని పుంలింగ ఏకవచన కుటుంబ సంబంధ పదాన్ని, దాని నిబంధనాత్మక భావాన్ని నిలుపుతూ అనువదిస్తుంది.
- source_word: Γνῶθι
  choice: తెలుసుకో
  rationale: ఇది ప్రత్యక్ష ఆజ్ఞ; ఆధునిక తెలుగులో ‘తెలుసుకో’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: κύριον
  choice: ప్రభువును
  rationale: κύριοςకు ప్రామాణికమైన ‘ప్రభువు’ను ఉపయోగించడం ద్వారా యిర్మీయా ఉల్లేఖనంలోని నిబంధన ప్రతిధ్వని నిలుస్తుంది.
- source_word: εἰδήσουσίν με
  choice: అందరూ నన్ను తెలుసుకుంటారు
  rationale: πάντες అనే సమగ్రతను, με అనే ప్రత్యక్ష కర్మను రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: వారిలో అత్యల్పుని నుండి అత్యధికుని వరకు
  rationale: వయస్సు లేదా హోదా అనే ఒక్క కోణానికి పరిమితం చేయకుండా, సమూహంలోని మొత్తం పరిధిని సూచించే గ్రీకు నుడికారాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యిర్మీయా 31:34 ఉల్లేఖన నేపథ్యంలో πολίτην అనువాదం
  choice: తోటి పౌరుడు
  alternative: పొరుగువాడు
  rationale: హెబ్రీయులకు పత్రికలో ఉన్న గ్రీకు పాఠం πολίτην కాబట్టి ప్రధాన పాఠంలో ‘తోటి పౌరుడు’ను ఉంచాం; యిర్మీయా వాక్యానికి పరిచితమైన రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ἀδελφόνలోని లింగసూచక కుటుంబ భాష
  choice: సహోదరుడు
  alternative: సహోదరుడు లేదా సహోదరి
  rationale: మూలపాఠంలోని పుంలింగ ఏకవచన రూపాన్ని మార్చకుండా నిలిపాం; వాగ్దానం యొక్క సమగ్ర వర్తింపును సందర్భం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. గ్రీకు emphatic negation కోసం ‘బోధించనే బోధించడు’ అనే సహజ ఉద్ఘాటనను ఉపయోగించాం; మూలంలోని ఏకవచన పంపిణీ నిర్మాణాన్ని నిలిపాం.
