revisions:
- from: అప్పుడు ప్రతివాడూ తన తోటి పౌరునికి[a], ప్రతివాడూ తన సహోదరునికి, ‘ప్రభువును తెలుసుకో’ అని బోధించనే బోధించడు. ఎందుకంటే వారిలో అత్యల్పుని నుండి అత్యధికుని వరకు అందరూ నన్ను తెలుసుకుంటారు.
  to: మరియు ప్రతివాడూ తన తోటి పౌరునికి[a], ప్రతివాడూ తన సహోదరునికి, ‘ప్రభువును తెలుసుకో’ అని బోధించనే బోధించడు. ఎందుకంటే వారిలో అల్పుల నుండి గొప్పవారి వరకు అందరూ నన్ను తెలుసుకుంటారు.
  rationale: The revision removes the unsupported temporal adverb while retaining the Greek connective. It preserves the strong οὐ μή negation through Telugu emphatic repetition, the two distributive ‘each’ expressions, the masculine familial term, and the source-specific ‘fellow citizen.’ The final idiom is adjusted only for natural modern Telugu, without narrowing its broad scope.
