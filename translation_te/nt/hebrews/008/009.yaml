revisions:
- from: నేను వారి పితరులతో చేసిన నిబంధనలాంటిది కాదు. నేను వారి చేతిని పట్టుకొని వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చిన రోజున ఆ నిబంధన చేశాను.[a] ఎందుకంటే వారు నా నిబంధనలో నిలిచి ఉండలేదు; నేనూ వారిని పట్టించుకోలేదు[b] అని ప్రభువు చెబుతున్నాడు.
  to: వారి పితరులతో నేను చేసిన నిబంధనలాంటిది కాదు—వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకురావడానికి వారి చెయ్యి పట్టుకున్న రోజున చేసిన నిబంధనలాంటిది కాదు.[a] ఎందుకంటే వారు నా నిబంధనలో నిలిచి ఉండలేదు; నేనూ వారిని పట్టించుకోలేదు[b] అని ప్రభువు చెబుతున్నాడు.
  rationale: The revision reconnects the comparison to its subject and makes ‘the day’ modify the act of taking them by the hand and bringing them out, as in the Greek. It retains the draft’s established theological vocabulary and its appropriately restrained rendering of ἠμέλησα. Footnote b is adjusted for idiomatic Telugu and for a more exact presentation of the Hebrew-text alternative.
  reviewer_model: gpt-5.6-terra
