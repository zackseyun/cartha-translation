id: HEB.8.9
reference: Hebrews 8:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: te
  text: వారి పితరులతో నేను చేసిన నిబంధనలాంటిది కాదు—వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకురావడానికి వారి చెయ్యి పట్టుకున్న రోజున చేసిన నిబంధనలాంటిది కాదు.[a] ఎందుకంటే వారు నా నిబంధనలో నిలిచి ఉండలేదు; నేనూ వారిని పట్టించుకోలేదు[b] అని ప్రభువు చెబుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత నుడికారంగా, ‘వారిని చెయ్యి పట్టుకొని’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ ఉల్లేఖనం హెబ్రీయులు 8:9లోని గ్రీకు పదప్రయోగాన్ని అనుసరించి, ‘వారిని పట్టించుకోలేదు’ అని చెబుతుంది. యిర్మీయా 31:32 హీబ్రూ పాఠంలో భావం భిన్నంగా ఉంది; దాన్ని తరచుగా ‘నేను వారికి భర్తనైనా’ లేదా ‘నేను వారికి యజమానినైనా’ అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: నిబంధన
  rationale: హెబ్రీయులకు రాసిన పత్రికలో ఈ పదం దేవుడు తన ప్రజలతో ఏర్పరచిన నిబంధనా సంబంధాన్ని సూచిస్తుంది. ‘నిబంధన’ ఈ సందర్భంలో సహజమైనదీ, వేదాంతపరంగా తగినదీ.
- source_word: πατράσιν
  choice: పితరులతో
  rationale: గ్రీకు పదం ఇశ్రాయేలు ప్రజల పూర్వకాలపు పురుష పితరులను స్పష్టంగా సూచిస్తుంది; అందువల్ల లింగసూచనను నిలిపే ‘పితరులు’ ఎంచుకోబడింది.
- source_word: ἐν ἡμέρᾳ
  choice: రోజున
  rationale: ఇది నిర్గమ సంఘటన జరిగిన చారిత్రక సందర్భాన్ని తెలిపే కాలప్రయోగం. ఆధునిక తెలుగులో ‘రోజున’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: నేను వారి చేతిని పట్టుకొని
  rationale: మూలంలోని ఏకవచన ‘చేతి’ రూపకాన్ని నిలుపుతూ, దేవుడు వారిని వ్యక్తిగతంగా నడిపించిన దృశ్యాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐξαγαγεῖν
  choice: బయటకు తీసుకొచ్చిన
  rationale: ἐξάγω అంటే బయటకు నడిపించడం లేదా తీసుకురావడం. ఈ రూపం నిర్గమాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γῆς Αἰγύπτου
  choice: ఐగుప్తు దేశం నుండి
  rationale: మూలంలో γῆς ఉన్నందున ‘ఐగుప్తు’ అని మాత్రమే సంక్షిప్తం చేయకుండా ‘ఐగుప్తు దేశం’ అని అనువదించబడింది.
- source_word: ἐνέμειναν ἐν
  choice: నిలిచి ఉండలేదు
  rationale: నిబంధనకు కట్టుబడి కొనసాగడం అనే ἐμμένω భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἠμέλησα αὐτῶν
  choice: వారిని పట్టించుకోలేదు
  rationale: ἀμελέω లోని శ్రద్ధ చూపకపోవడం, ఉపేక్షించడం అనే భావాన్ని అనవసరంగా ‘తిరస్కరించాను’ అని బలపరచకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λέγει κύριος
  choice: అని ప్రభువు చెబుతున్నాడు
  rationale: ప్రస్తుతకాల ఉల్లేఖన సూత్రాన్ని తెలుగులో సహజంగా నిలుపుతుంది; κύριος కు సందర్భానుగుణంగా ‘ప్రభువు’ వాడబడింది.
theological_decisions:
- issue: యిర్మీయా 31:32లోని హీబ్రూ పాఠంతో పోల్చినప్పుడు ἠμέλησα αὐτῶν అనువాదం
  choice: నేనూ వారిని పట్టించుకోలేదు
  alternative: నేను వారికి భర్తగా ఉన్నప్పటికీ / వారిపై యజమానిగా ఉన్నప్పటికీ
  rationale: హెబ్రీయులు 8:9 గ్రీకు పాఠం స్పష్టంగా ἠμέλησα αὐτῶν అని ఉంది. కాబట్టి ప్రధాన పాఠం గ్రీకును అనుసరిస్తుంది; యిర్మీయా హీబ్రూ పాఠంలోని భిన్న భావం అంతర్పాఠ్య ఉద్వేగాన్ని కాపాడేందుకు పాదసూచికలో ఇవ్వబడింది.
- issue: పితరుల ‘చేతిని’ పట్టుకోవడం అనే ఏకవచన రూపకం
  choice: వారి చేతిని పట్టుకొని
  alternative: వారిని చెయ్యి పట్టుకొని
  rationale: ప్రధాన పాఠం గ్రీకులోని ఏకవచన χειρός రూపాన్ని పారదర్శకంగా నిలుపుతుంది; మరింత నుడికారమైన తెలుగు రూపాన్ని పాదసూచికలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘పితరులు,’ ‘నిబంధన,’ ‘ప్రభువు’ వంటి సందర్భోచిత బైబిలు పదాలను నిలిపి, మిగతా వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; భావసంబంధం మార్చలేదు.
