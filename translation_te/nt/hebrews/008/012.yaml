source:
  edition: SBLGNT
  text: ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν, καὶ τῶν ἁμαρτιῶν ⸀αὐτῶν οὐ μὴ μνησθῶ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: te
  text: ఎందుకంటే వారి అన్యాయాల విషయంలో నేను కనికరం చూపుతాను; వారి పాపాలను ఇక ఎన్నటికీ జ్ఞాపకం చేసుకోను.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి నీతివిరుద్ధ కార్యాల విషయంలో.’ గ్రీకు పదం అన్యాయాన్ని, తప్పుచేయడాన్ని లేదా నీతివిరుద్ధ కార్యాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థ భావం: ‘వారి పాపాలను ఇక ఏమాత్రం జ్ఞాపకం చేసుకోను.’ ఇది బలమైన నిరాకరణ. నిబంధన సందర్భంలో ఈ మాట సంపూర్ణ క్షమాపణను వ్యక్తం చేస్తుంది; ప్రధాన పాఠ్యం మూలంలోని ‘జ్ఞాపకం చేసుకోవడం’ అనే వాక్యరూపాన్ని అలాగే ఉంచుతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న నిబంధన వాగ్దానానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἵλεως ἔσομαι
  choice: నేను కనికరం చూపుతాను
  rationale: అక్షరార్థంగా ‘కనికరంగలవాడనై ఉంటాను’ అనే భావం ఉన్నా, దైవిక క్షమాపూర్వక అనుగ్రహాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేయడానికి ఈ క్రియాత్మక రూపం ఎంచుకోబడింది.
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: వారి అన్యాయాల పట్ల
  rationale: బహువచనమైన ἀδικίαις తప్పులు, అన్యాయ కార్యాలు లేదా నీతివిరుద్ధతలను సూచించగలదు. ‘అన్యాయాలు’ మూలంలోని బహువచనాన్ని, నైతిక భావాన్ని నిలుపుతుంది; దత్తివిభక్తి సంబంధాన్ని ‘పట్ల’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: ;
  rationale: గ్రీకులోని సమన్వయాన్ని తెలుగులో రెండు సన్నిహిత నిబంధన వాగ్దానాలుగా స్పష్టంగా చూపడానికి అర్థవిరామం వాడబడింది; భావసంబంధం యథాతథంగా ఉంది.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: వారి పాపాలను
  rationale: ἁμαρτίαకు సాధారణమైన, సందర్భోచితమైన తెలుగు పదం ‘పాపం’; బహువచనం అలాగే నిలుపబడింది.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: ఇక ఎన్నటికీ జ్ఞాపకం చేసుకోను
  rationale: οὐ μή అనే బలమైన నిరాకరణను ‘ఎన్నటికీ’ తెలియజేస్తుంది; ἔτιలోని ‘ఇకపై కాదు’ అనే భావాన్ని ‘ఇక’ నిలుపుతుంది. బైబిలు సంబంధమైన ‘జ్ఞాపకం చేసుకోవడం’ అనే రూపకం అనువాదంలో అలాగే ఉంచబడింది.
theological_decisions:
- issue: దేవుడు పాపాలను జ్ఞాపకం చేసుకోకపోవడం
  choice: ‘వారి పాపాలను ఇక ఎన్నటికీ జ్ఞాపకం చేసుకోను’ అనే నిబంధన సంబంధమైన వాక్యరూపాన్ని యథాతథంగా ఉంచడం
  alternative: దేవుడు వారి పాపాలను ఇక వారిపై మోపడు అని వివరణాత్మకంగా అనువదించడం
  rationale: ఈ సందర్భంలో వాక్యం సంపూర్ణ క్షమాపణను సూచించినప్పటికీ, మూలంలోని ‘జ్ఞాపకం చేసుకోను’ అనే దైవిక ప్రకటనను ప్రధాన పాఠ్యంలో వివరణతో భర్తీ చేయకుండా దాని రూపకాన్ని, వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ἵλεως యొక్క క్షమాపూర్వక అనుగ్రహ భావం
  choice: కనికరం చూపుతాను
  alternative: అనుకూలంగా ఉంటాను; ప్రసన్నుడనై ఉంటాను
  rationale: ‘కనికరం’ శిక్షార్హమైన అన్యాయాల విషయంలో క్షమాపూర్వక దయను స్పష్టంగా తెలియజేస్తుంది; సాంకేతికమైన ప్రాయశ్చిత్త పదజాలాన్ని మూలం కంటే ఎక్కువగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కనికరం చూపుతాను’ సాధారణ పాఠకునికి స్పష్టంగా ఉండగా, ‘జ్ఞాపకం చేసుకోను’ మూలంలోని నిబంధన సంబంధమైన బైబిలు రూపకాన్ని కాపాడుతుంది. ‘అన్యాయాలు’ అనే బహువచనం మూలంలోని స్పష్టతలేమిని అనవసరంగా ‘కార్యాలు’గా నిర్ణయించకుండా నిలుపుతుంది.
