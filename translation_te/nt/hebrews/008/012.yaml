    issue: The phrase ‘వారి అన్యాయాల పట్ల నేను కనికరం చూపుతాను’ is mildly awkward collocationally.
    rationale: While it can be understood, ‘పట్ల’ with this verb may imply compassion directed at the injustices rather than merciful dealing concerning them. ‘వారి అన్యాయాల విషయంలో’ is more idiomatic Telugu and retains the source’s dative relation without specifying ‘deeds.’
