revisions:
- from: ఎందుకంటే వారి అన్యాయాల[a] పట్ల నేను కనికరం చూపుతాను; వారి పాపాలను ఇక ఎన్నటికీ జ్ఞాపకం చేసుకోను.[b]
  to: ఎందుకంటే వారి అన్యాయాల విషయంలో నేను కనికరం చూపుతాను; వారి పాపాలను ఇక ఎన్నటికీ జ్ఞాపకం చేసుకోను.[a][b]
  rationale: A small idiomatic revision replaces ‘పట్ల’ with ‘విషయంలో’ in both the text and its lexical alternative. This improves modern Telugu usage while preserving the Greek dative construction, the plurality and semantic openness of ἀδικίαις, and the covenantal metaphor of non-remembrance. Footnote anchors are retained and placed after the complete sentence because both notes concern expressions within it.
