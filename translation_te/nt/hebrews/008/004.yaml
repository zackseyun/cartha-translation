source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: te
  text: ఆయన భూమి మీద ఉండి ఉంటే, యాజకుడు కూడా అయి ఉండేవాడు కాదు; ఎందుకంటే ధర్మశాస్త్రం ప్రకారం కానుకలను[a] అర్పించేవారు ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అర్పణలను.’ గ్రీకులో ‘కానుకలను’ అని ఉంది; ఈ సందర్భంలో అది బలికి సంబంధించిన సాధారణ పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν ἦν
  choice: ఆయన ... ఉండి ఉంటే
  rationale: ఈ నిర్మాణం వాస్తవానికి విరుద్ధమైన షరతును సూచిస్తుంది. తెలుగులో ‘ఉండి ఉంటే’ దానిని సహజంగా వ్యక్తం చేస్తుంది; సందర్భం ప్రకారం అంతర్లీన కర్త యేసు/మెస్సీయను సూచిస్తున్నందున ‘ఆయన’ అని స్పష్టం చేయబడింది.
- source_word: ἐπὶ γῆς
  choice: భూమి మీద
  rationale: చుట్టుపక్కల సందర్భంలోని పరలోక సంబంధమైన సేవకు భూలోక స్థానాన్ని వ్యతిరేకంగా చూపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: οὐδ’ ἂν ἦν ἱερεύς
  choice: యాజకుడే అయి ఉండేవాడు కాదు
  rationale: ‘-డే’ అనే ఉద్ఘాటన οὐδέ లోని ‘కూడా కాదు/అసలే కాదు’ భావాన్ని సహజంగా తెలియజేస్తుంది; ἄν తో కూడిన నిర్మాణం షరతు ఫలితాన్ని సూచిస్తుంది.
- source_word: ὄντων τῶν προσφερόντων
  choice: అర్పించేవారు ఉన్నారు
  rationale: జెనిటివ్ అబ్సల్యూట్ ఇక్కడ ముందరి వాక్యానికి కారణాన్ని అందిస్తుంది. ‘ఎందుకంటే ... ఉన్నారు’ ఆ కారణ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; మూలంలో లేని ‘యాజకులు’ అనే నామవాచకాన్ని చేర్చలేదు.
- source_word: κατὰ νόμον
  choice: ధర్మశాస్త్రం ప్రకారం
  rationale: ఇక్కడ νόμος యాజక అర్పణలను నియంత్రించే మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం ప్రకారం’ స్పష్టమైన, స్థిరమైన తెలుగు అనువాదం.
- source_word: τὰ δῶρα
  choice: కానుకలను
  rationale: δῶρα యొక్క ప్రాథమిక ‘కానుకలు’ భావాన్ని నిలుపుతూ, బలి సందర్భాన్నీ సరిపడా వ్యక్తం చేస్తుంది. προσφερόντων ను ‘అర్పించేవారు’గా అనువదించినందున నామవాచకం-క్రియ భేదం కూడా నిలుస్తుంది.
theological_decisions:
- issue: షరతు వాక్యంలోని అంతర్లీన కర్త
  choice: సమీప సందర్భంలోని యేసు/మెస్సీయను సూచిస్తూ ‘ఆయన’ అని అనువదించడం
  alternative: కర్తను తెలుగులోనూ అంతర్లీనంగానే ఉంచడం
  rationale: గ్రీకులో కర్త సందర్భం ద్వారా తెలుస్తుంది. తెలుగులో స్పష్టత కోసం ‘ఆయన’ అని ఉంచడం సందర్భాన్ని మాత్రమే వెల్లడిస్తుంది; అదనపు సిద్ధాంత భావాన్ని చేర్చదు.
- issue: షరతు యొక్క భావం
  choice: వాస్తవానికి విరుద్ధమైన షరతుగా ‘ఉండి ఉంటే ... అయి ఉండేవాడు కాదు’ అని అనువదించడం
  alternative: సాధారణ షరతుగా ‘ఉంటే ... కాదు’ అని అనువదించడం
  rationale: εἰ + imperfect మరియు ἄν + imperfect నిర్మాణం వాస్తవానికి విరుద్ధమైన షరతును సూచిస్తుంది. తెలుగు ఎంపిక ఆ ఉద్వేగాన్ని అతిశయింపకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘యాజకుడు,’ ‘ధర్మశాస్త్రం,’ ‘అర్పించు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం. మూలంలోని తార్కిక కణాలకు తెలుగులో అనవసరమైన ప్రారంభ సంధిపదాన్ని చేర్చలేదు.
