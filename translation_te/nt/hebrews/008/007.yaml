source:
  edition: SBLGNT
  text: Εἰ γὰρ ἡ πρώτη ἐκείνη ἦν ἄμεμπτος, οὐκ ἂν δευτέρας ἐζητεῖτο τόπος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: te
  text: ఎందుకంటే, ఆ మొదటి నిబంధన లోపరహితమైనదై ఉంటే, రెండవ నిబంధనకు చోటు వెదకబడేది కాదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, ‘ఆ మొదటిది’; సందర్భాన్ని బట్టి ‘నిబంధన’ చేర్చబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘రెండవ నిబంధనకు అవకాశం లేదా సందర్భం వెదకబడేది కాదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: ఎందుకంటే ... లేకపోయి ఉంటే
  rationale: γάρ ముందున్న వాదనకు వివరణను కలుపుతుంది; Εἰ షరతును సూచిస్తుంది. తెలుగులో ఈ రెండింటి భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἡ πρώτη ἐκείνη
  choice: ఆ మొదటి నిబంధన
  rationale: గ్రీకులో అక్షరార్థంగా ‘ఆ మొదటిది’ ఉన్నా, స్త్రీలింగ విశేషణ పదబంధం సందర్భంలోని నిబంధనను సూచిస్తుంది; తెలుగులో సూచిత నామవాచకాన్ని స్పష్టంగా చేర్చడం సహజం.
- source_word: ἦν ἄμεμπτος
  choice: ఏ లోపమూ లేకపోయి ఉంటే
  rationale: ἄμεμπτος నిందకు లేదా లోపానికి ఆధారం లేని స్థితిని సూచిస్తుంది. ఈ రూపం అసత్యార్థక షరతును సహజ తెలుగులో వ్యక్తం చేస్తూ, లోపం స్వభావాన్ని వివరించకుండా వదిలేస్తుంది.
- source_word: οὐκ ἂν
  choice: '... వెదకబడేది కాదు'
  rationale: οὐκ ἂν అసత్యార్థక షరతు ఫలితంలోని నిరాకరణను సూచిస్తుంది; తెలుగు సంభావ్య భూతార్థక నిర్మాణం దాని భావాన్ని నిలుపుతుంది.
- source_word: δευτέρας
  choice: రెండవదానికి
  rationale: గ్రీకులో ‘రెండవది’ అనే విశేషణం నామవాచకం లేకుండానే ఉంది. ముందే ‘నిబంధన’ స్పష్టమైనందున తెలుగు కూడా ఈ సంక్షిప్తతను సహజంగా ఉంచగలదు.
- source_word: ἐζητεῖτο τόπος
  choice: చోటు వెదకబడేది
  rationale: మూలంలోని నిష్క్రియ రూపాన్ని, τόπος అనే ‘చోటు’ భావాన్ని దగ్గరగా నిలుపుతుంది; సందర్భంలో ఇది అవకాశం లేదా సందర్భం వెదకడమనే నుడికార భావాన్నీ కలిగి ఉండవచ్చు.
theological_decisions:
- issue: గ్రీకులో మళ్లీ చెప్పని ‘నిబంధన’ను స్పష్టంగా చేర్చాలా
  choice: ‘ఆ మొదటి నిబంధన’ అని స్పష్టంగా చేర్చడం
  alternative: ‘ఆ మొదటిది’ లేదా ‘మొదటిది’
  rationale: తక్షణ సందర్భం మొదటి, రెండవ నిబంధనలను పోలుస్తోంది. ‘నిబంధన’ను చేర్చడం సూచిత అర్థాన్ని మాత్రమే స్పష్టం చేస్తుంది; కొత్త సిద్ధాంత వాదనను జోడించదు.
- issue: మొదటి నిబంధనలోని లోపం దేనికి సంబంధించినదో వివరించాలా
  choice: ‘ఏ లోపమూ లేకపోయి ఉంటే’ అని మాత్రమే అనువదించడం
  alternative: లోపాన్ని నిబంధన నిర్వహణకు లేదా ప్రజలకు పరిమితం చేసి వివరించడం
  rationale: ఈ వచనం లోపం స్వభావాన్ని స్వయంగా నిర్దిష్టం చేయదు. తరువాతి సందర్భం మరింత వివరణ ఇస్తుంది కాబట్టి, ఇక్కడున్న ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వెదకబడేది’ మూలంలోని నిష్క్రియ నిర్మాణాన్ని ఉంచుతుంది; పాదసూచిక నుడికార ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
