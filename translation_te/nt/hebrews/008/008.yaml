id: HEB.8.8
reference: Hebrews 8:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: te
  text: 'ఎందుకంటే, వారిని తప్పుపడుతూ ఆయన ఇలా అంటున్నాడు: “ఇదిగో, రోజులు రాబోతున్నాయి—ప్రభువు చెబుతున్నాడు—అప్పుడు నేను ఇశ్రాయేలు ఇంటితోను, యూదా ఇంటితోను ఒక కొత్త నిబంధనను స్థాపిస్తాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος ... αὐτοὺς
  choice: వారిలో తప్పు ఉందని చూపుతూ
  rationale: μεμφόμενος అనే పదంలోని నిందించడం/లోపాన్ని ఎత్తిచూపడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; αὐτούς ను ‘వారిలో’గా ఉంచి పాఠ్యంలోని వ్యక్తి-సూచనను కాపాడుతుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: ప్రవచన ప్రకటనలో దృష్టిని ఆకర్షించే ఆజ్ఞార్థక ఉద్ఘాటనను గంభీరంగా, సహజంగా నిలుపుతుంది.
- source_word: συντελέσω ... διαθήκην καινήν
  choice: ఒక కొత్త నిబంధనను స్థాపిస్తాను
  rationale: συντελέω ఇక్కడ నిబంధనను అమలులోకి తేవడం/నెరవేర్చడం అనే భావం కలిగి ఉంది; తెలుగులో ‘స్థాపిస్తాను’ స్పష్టంగా, సహజంగా ఆ సంబంధాన్ని వ్యక్తపరుస్తుంది.
- source_word: οἶκον Ἰσραὴλ ... οἶκον Ἰούδα
  choice: ఇశ్రాయేలు ఇంటివారితో, యూదా ఇంటివారితో
  rationale: ‘ఇల్లు’ అనే సామూహిక-వంశ సంబంధ రూపకాన్ని ‘ఇంటివారు’ ద్వారా అర్థమయ్యే తెలుగులో నిలుపుతుంది; ἐπί యొక్క నిబంధనాత్మక సంబంధాన్ని ‘తో’ తెలియజేస్తుంది.
theological_decisions:
- issue: μεμφόμενος ... αὐτοὺς లో తప్పు ఎవరికి ఆపాదించబడుతోంది
  choice: వారిలో తప్పు ఉందని చూపుతూ
  alternative: దానిలో తప్పు ఉందని చూపుతూ
  rationale: SBLGNT ప్రధాన పాఠంలోని αὐτούς పురుష బహువచనాన్ని అనుసరించి వ్యక్తులనే సూచిస్తుంది; నిబంధనకే తప్పు ఆపాదించేలా మార్చలేదు.
- issue: ‘కొత్త నిబంధన’ యొక్క కార్యరూపం
  choice: స్థాపిస్తాను
  alternative: పూర్తి చేస్తాను / కుదుర్చుకుంటాను
  rationale: సందర్భంలో దేవుడు నిబంధనను కార్యరూపంలో స్థిరపరచడం ప్రధాన భావం. ‘కుదుర్చుకుంటాను’ పరస్పర చర్చ భావాన్ని అతిగా సూచించవచ్చు; ‘పూర్తి చేస్తాను’ తెలుగులో అస్పష్టంగా ఉండవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రవచన ఉల్లేఖనానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు స్పష్టంగా ఉంచబడింది. ‘ఇదిగో’ అనే బైబిలు-సంబంధిత కానీ ఇప్పటికీ అర్థమయ్యే దృష్టి-ఆకర్షక పదాన్ని నిలిపాం.
