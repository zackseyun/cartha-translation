source:
  edition: SBLGNT
  text: τῶν ἁγίων λειτουργὸς καὶ τῆς σκηνῆς τῆς ἀληθινῆς, ἣν ἔπηξεν ὁ κύριος, ⸀οὐκ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: te
  text: ఆయన పరిశుద్ధ స్థలాలకును నిజమైన గుడారానికిని పరిచారకుడు; ఆ గుడారాన్ని ప్రభువే నిలబెట్టాడు, మనిషి కాదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధ స్థలాలలో
  rationale: నపుంసక బహువచన విశేషణం నామవాచకంగా వాడబడింది. హెబ్రీయులకు పత్రికలోని యాజకసేవ సందర్భంలో ఇది పరిశుద్ధ ప్రజలను కాక పరలోక పరిశుద్ధ స్థలాలను సూచించడం అత్యంత సహజం; బహువచన భావాన్ని కూడా నిలుపుతుంది.
- source_word: λειτουργὸς
  choice: సేవచేసేవాడు
  rationale: ఈ పదం అధికారికమైన, ముఖ్యంగా ఆరాధన సంబంధమైన సేవను నిర్వర్తించే వ్యక్తిని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు నామవాచకానికి బదులు క్రియాత్మక పదబంధం వాడినా, యాజకసేవ భావం సందర్భం ద్వారా నిలుస్తుంది.
- source_word: σκηνῆς
  choice: గుడారంలో
  rationale: ఈ పదం మోషే కాలపు గుడారాన్ని, దానికి సరితూగే పరలోక వాస్తవాన్ని జ్ఞాపకం చేస్తుంది. ‘గుడారం’ మూలంలోని దృశ్యరూపాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἀληθινῆς
  choice: నిజమైన
  rationale: భూలోకపు నమూనాకు భిన్నమైన అంతిమ వాస్తవాన్ని సూచించే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘వాస్తవమైన’ అని వివరణాత్మకంగా విస్తరించదు.
- source_word: ἔπηξεν
  choice: నిలబెట్టిన
  rationale: గుడారాన్ని బిగించి ఏర్పాటు చేయడం అనే మూలభావాన్ని సహజ తెలుగులో తెలియజేస్తుంది. గుడారపు రూపకాన్ని మరింత స్పష్టంచేసే ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: నిర్దిష్ట కర్తను గౌరవప్రదమైన, ప్రామాణిక తెలుగు బిరుదుతో తెలియజేస్తుంది.
- source_word: οὐκ ἄνθρωπος
  choice: దాన్ని నిలబెట్టింది మనిషి కాదు
  rationale: ప్రభువు చేసిన కార్యానికీ మానవుడు చేసిన కార్యానికీ మధ్యనున్న సంక్షిప్త వ్యత్యాసాన్ని నిలుపుతూ, తెలుగులో అస్పష్టత లేకుండా క్రియను పునరుక్తి చేస్తుంది.
theological_decisions:
- issue: τῶν ἁγίων యొక్క సూచన మరియు పరలోక పరిశుద్ధ స్థలంతో దాని సంబంధం
  choice: పరిశుద్ధ ప్రజలు కాక, ఆరాధనకు సంబంధించిన పరలోక పరిశుద్ధ స్థలాలు
  alternative: పరిశుద్ధులు; లేదా ఏకవచనంగా పరిశుద్ధ స్థలం
  rationale: హెబ్రీయులు 8:1-5లో ప్రధాన యాజకుని పరలోక సేవ, గుడారం, భూలోకపు నమూనా ప్రస్తావించబడుతున్నాయి. అందువల్ల స్థలార్థమే సందర్భానికి సరిపోతుంది; అయితే ఏకవచన సమష్టి భావం సాధ్యమని పాదటిప్పణి తెలియజేస్తుంది.
- issue: ἄνθρωπος యొక్క సాధారణ మానవార్థం
  choice: మనిషి
  alternative: మానవుడు; ఒక మనిషి
  rationale: ఇక్కడ లింగాన్ని ప్రత్యేకంగా బోధించడం కాక, ప్రభువు చేసినదానికి మానవుడు చేసినదాన్ని వ్యతిరేకంగా ఉంచడం ఉద్దేశం. ‘మనిషి’ ఆ సమష్టి, ప్రతినిధి భావాన్ని సహజంగా నిలుపుతుంది.
- issue: λειτουργός ను నామవాచకంగా లేదా క్రియాత్మకంగా అనువదించడం
  choice: సేవచేసేవాడు
  alternative: సేవకుడు; పరిచారకుడు
  rationale: ‘పరిచారకుడు’ కొంత సాంకేతికంగా, ‘సేవకుడు’ కొంత సాధారణంగా వినిపించవచ్చు. స్థాన సూచక విభక్తులతో కూడిన ‘సేవచేసేవాడు’ సాధారణ పాఠకునికి సహజంగా ఉండి, రెండు గ్రీకు షష్ఠీ విభక్తి పదబంధాల సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకునికి అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ముందరి వచనంలోని ప్రధాన యాజకుడే కర్త అని సహజంగా స్పష్టంచేయడానికి ‘ఆయన’ చేర్చబడింది. గ్రీకు నామవాచక నిర్మాణాన్ని తెలుగులో సహజమైన స్థానార్థక క్రియాత్మక నిర్మాణంగా మార్చినా, పరిశుద్ధ స్థలాలు, నిజమైన గుడారం, ప్రభువు-మనిషి వ్యత్యాసం అన్నీ నిలుపబడ్డాయి.
