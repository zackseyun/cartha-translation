source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: te
  text: 'చెప్పబడుతున్న వాటిలో ముఖ్య విషయం[a] ఇదే: మనకు ఇలాంటి ప్రధాన యాజకుడు ఉన్నాడు; ఆయన పరలోకాలలో[b] మహిమామయుని సింహాసనానికి కుడిపార్శ్వంలో కూర్చున్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సారాంశం’ లేదా ‘ప్రధానాంశం’.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరలోకంలో’; గ్రీకులో ‘పరలోకాలలో’ అని బహువచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: ముఖ్య విషయం
  rationale: ఇక్కడ ఇది అక్షరార్థంగా ‘అధ్యాయం’ కాదు; కొనసాగుతున్న వాదనలో ప్రధానాంశాన్ని సూచించే సంభాషణా ప్రయోగం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్పమైన విషయమార్పును సూచిస్తుంది. తెలుగులో వాక్య నిర్మాణమే ఆ మార్పును సహజంగా తెలియజేస్తుంది; మూలంలో లేని కాలార్థక ‘ఇప్పుడు’ను చేర్చలేదు.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: చెప్పబడుతున్న వాటిలో
  rationale: వర్తమాన కర్మణి భావాన్ని నిలుపుతూ, చర్చలో ఉన్న సంగతులను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: τοιοῦτον
  choice: ఇలాంటి
  rationale: ముందుగా వివరించిన విధమైన ప్రధాన యాజకుణ్ణి వెనక్కి సూచిస్తుంది.
- source_word: ἔχομεν
  choice: మనకు ఉన్నాడు
  rationale: తెలుగులో వ్యక్తిని కలిగి ఉండడాన్ని సహజంగా వ్యక్తపరుస్తూ, గ్రీకు వర్తమాన భావాన్ని నిలుపుతుంది.
- source_word: ἀρχιερέα
  choice: ప్రధాన యాజకుడు
  rationale: హెబ్రీయులకు పత్రికలోని యాజక పదవికి స్పష్టమైన, స్థిరమైన తెలుగు పదబంధం.
- source_word: ἐκάθισεν
  choice: కూర్చున్న
  rationale: ఆయన ఆసీనుడైన పూర్తయిన చర్యను తెలియజేస్తుంది; దాని యాజక సంబంధమైన అర్థాన్ని అదనపు వివరణతో విస్తరించదు.
- source_word: ἐν δεξιᾷ
  choice: కుడివైపున
  rationale: గౌరవం, అధికార స్థానం అనే బైబిలీయ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τοῦ θρόνου
  choice: సింహాసనం
  rationale: రాజాధికార చిత్రణను యథాతథంగా ఉంచుతుంది.
- source_word: τῆς μεγαλωσύνης
  choice: మహిమామయుని
  rationale: దేవుని నేరుగా పేరు పెట్టకుండా సూచించే గౌరవపూర్వక పరోక్ష నామాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: పరలోకాలలో
  rationale: గ్రీకులోని బహువచన రూపాన్ని నిలుపుతూ, భౌతిక ఆకాశాలతో గందరగోళం రాకుండా చేస్తుంది.
theological_decisions:
- issue: ‘మహిమ’ అనే పరోక్ష సంబోధనకు దేవుడే సూచ్యుడని నేరుగా చెప్పాలా?
  choice: ‘మహిమామయుడు’ అనే గౌరవపూర్వక పరోక్ష సంబోధనను ఉంచడం
  alternative: ‘దేవుని సింహాసనం’ అని స్పష్టీకరించడం
  rationale: మూలంలో θεός అనే ప్రత్యక్ష నామం లేదు. సూచ్యుడు స్పష్టమైనప్పటికీ, రచయిత ఉపయోగించిన ఉన్నతమైన పరోక్ష శైలిని అనువాదం నిలుపుతుంది.
- issue: ἐκάθισενలో పూర్తయిన యాజక కార్యాన్ని వివరణాత్మకంగా ముందుకు తేవాలా?
  choice: ‘కూర్చున్న’ అని మాత్రమే అనువదించడం
  alternative: ‘కార్యాన్ని పూర్తిచేసి విజయంగా ఆసీనుడైన’ వంటి విస్తరణ
  rationale: సందర్భం ఆ theological భావాన్ని మోస్తుంది; ఈ వాక్యంలో లేని వివరణను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన బైబిలీయ శైలిని పాటించాం. వాక్యాన్ని సహజ తెలుగు క్రమంలో అమర్చి, ‘మహిమామయుడు,’ ‘సింహాసనం,’ ‘ప్రధాన యాజకుడు’ అనే ధార్మిక-రాజస పదచిత్రాలను నిలిపాం.
