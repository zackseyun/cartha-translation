  text: καὶ ἐν τούτῳ πάλιν· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/005.yaml
  text: 'And in this place again: ‘They shall certainly not enter my rest.’[a]'
translation:
  language: te
  text: 'ఈ వాక్యభాగంలో మళ్లీ ఇలా ఉంది: “వారు నా విశ్రాంతిలో ప్రవేశించనే ప్రవేశించరు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, “వారు నా విశ్రాంతిలో ప్రవేశిస్తే.” ఇది “వారు నా విశ్రాంతిలో ఎంతమాత్రమూ ప్రవేశించరు” అనే అర్థమిచ్చే ప్రమాణ వాక్యరీతి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: మరొక చోట
  rationale: ఇక్కడ ἐν τούτῳ మరొక లేఖనస్థలంలోని ఉల్లేఖనాన్ని పరిచయం చేస్తుంది. తెలుగు సందర్భంలో ‘మరొక చోట’ సహజంగా ఉండి, రచయిత వేరొక లేఖనస్థలాన్ని మళ్లీ ఉదహరిస్తున్న భావాన్ని తెలియజేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: లేఖనాన్ని తిరిగి ఉటంకించడం లేదా దానిని మరోసారి ప్రస్తావించడం అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Εἰ εἰσελεύσονται
  choice: వారు ... ప్రవేశించనే ప్రవేశించరు
  rationale: గ్రీకులోని షరతు రూపం హెబ్రీయ oath శైలిని అనుసరించిన బలమైన నిరాకరణ. తెలుగు పునరుక్తి ‘ప్రవేశించనే ప్రవేశించరు’ ఆ నిశ్చయాత్మక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατάπαυσίν
  choice: విశ్రాంతి
  rationale: హెబ్రీయులు 3–4 అధ్యాయాల్లో కొనసాగుతున్న కీలక పదాన్ని నిలుపుతూ, దేవుని విశ్రాంతి అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μου
  choice: నా
  rationale: కీర్తన ఉల్లేఖనంలో దేవుడు స్వయంగా మాట్లాడుతున్న స్వాధీనార్థాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: Εἰ εἰσελεύσονται అనే ప్రమాణసదృశ షరతు వాక్యాన్ని ఎలా అనువదించాలి
  choice: వారు నా విశ్రాంతిలో ప్రవేశించనే ప్రవేశించరు
  alternative: వారు నా విశ్రాంతిలో ప్రవేశిస్తే
  rationale: మూల గ్రీకు రూపం అక్షరార్థంగా షరతును పోలినప్పటికీ, ఇది హెబ్రీయ ప్రమాణ శైలినుంచి వచ్చిన గట్టి నిరాకరణ. అందువల్ల రూపాన్ని యాంత్రికంగా కాక, దాని సందర్భార్థ బలాన్ని తెలుగులో వ్యక్తం చేశాం; పాదసూచికలో అక్షరరూపాన్ని కూడా నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే లేఖన ఉల్లేఖనానికి తగిన గంభీరతతో రూపొందించబడింది. ప్రధాన వాక్యంలో ప్రమాణ నిరాకరణ బలాన్ని పునరుక్తి ద్వారా నిలిపి, మూలంలోని అసాధారణ షరతు రూపాన్ని పాదసూచికలో వెల్లడించాం.
