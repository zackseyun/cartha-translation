id: HEB.4.10
reference: Hebrews 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: te
  text: ఎందుకంటే, ఆయన విశ్రాంతిలో ప్రవేశించినవాడు[a] కూడా దేవుడు తన సొంత కార్యాల నుండి విశ్రమించినట్లే తన కార్యాల నుండి విశ్రమించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని విశ్రాంతిలో ప్రవేశించినవాడు.’ సందర్భంలో ‘ఆయన’ అనే సర్వనామం అత్యంత సంభావ్యంగా దేవుణ్ణే సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘తన కార్యాలను మానుకున్నాడు.’ ఇక్కడి గ్రీకు క్రియ ‘విశ్రాంతి’ అనే నామవాచకానికి సమసంబంధమైనది; అందువల్ల ప్రధాన పాఠం పునరావృతమైన విశ్రాంతి భాషను నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: ప్రవేశించిన వ్యక్తి
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న భూతకాల కృదంతం వ్యక్తిని సూచిస్తుంది; ఈ రూపం సాధారణ ఏకవచన భావాన్నీ, ప్రవేశం పూర్తయిన భావాన్నీ నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే అనుసంధానంగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: κατάπαυσιν
  choice: విశ్రాంతి
  rationale: హెబ్రీయులు 3–4లో ఇది దేవుని విశ్రాంతిని సూచించే ప్రధాన నేపథ్య పదం; స్థలం లేదా కేవలం పని మానడమనే అర్థానికి పరిమితం చేయదు.
- source_word: αὐτοῦ (after κατάπαυσιν)
  choice: ఆయన
  rationale: మూలంలోని సర్వనామాన్ని నిలుపుతూ, సందర్భంలో గౌరవ ఏకవచనంతో సహజంగా వ్యక్తపరుస్తుంది; దాని సూచన దేవుడే కావడం అత్యంత సంభావ్యమైనా ప్రధాన పాఠంలో పేరును చేర్చి అస్పష్టతను పూర్తిగా తొలగించలేదు.
- source_word: καὶ αὐτὸς
  choice: కూడా
  rationale: ప్రవేశించిన వ్యక్తి సైతం విశ్రమించాడనే అదనపు, తులనాత్మక బలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: κατέπαυσεν
  choice: విశ్రమించాడు
  rationale: κατάπαυσιςతో ఉన్న పదసంబంధాన్ని నిలుపుతుంది; ‘మానుకున్నాడు’ కూడా సాధ్యమే గాని, అధ్యాయంలోని పునరావృత విశ్రాంతి భాషను బలహీనపరుస్తుంది.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: తన కార్యాలనుంచి
  rationale: ἔργα యొక్క విస్తృత ‘పనులు/కార్యాలు’ భావాన్ని నిలుపుతుంది; పుణ్యక్రియలు వంటి ప్రత్యేక సిద్ధాంతార్థాన్ని దిగుమతి చేయదు.
- source_word: ὥσπερ
  choice: …విశ్రమించినట్లే
  rationale: వ్యక్తి విశ్రమించడాన్ని దేవుని విశ్రమించడంతో స్పష్టంగా పోల్చే సహజ తెలుగు నిర్మాణం.
- source_word: τῶν ἰδίων
  choice: తన సొంత కార్యాలనుంచి
  rationale: గ్రీకులో ‘కార్యాలు’ అన్న నామవాచకం విడిచిపెట్టబడినా తెలుగులో స్పష్టత కోసం దానిని పూరించి, ἰδίων యొక్క సొంతత్వ బలాన్ని ‘సొంత’తో నిలిపింది.
- source_word: ὁ θεός
  choice: దేవుడు
  rationale: θεόςకు ప్రామాణిక తెలుగు అనువాదం; తులనలో కర్తను స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: αὐτοῦ అనే సర్వనామం సూచించేది ఎవరి విశ్రాంతిని?
  choice: ప్రధాన పాఠంలో ‘ఆయన విశ్రాంతి’; సందర్భానుసారం దేవుని విశ్రాంతి
  alternative: ప్రవేశించిన వ్యక్తి యొక్క స్వీయ విశ్రాంతి
  rationale: హెబ్రీయులు 3–4లో పదేపదే దేవుని విశ్రాంతే అంశం; చివరి భాగంలో దేవుడు తన కార్యాలనుంచి విశ్రమించాడనే పోలిక కూడా ఇదే పఠనానికి మద్దతిస్తుంది. అయినా గ్రీకు సర్వనామాన్ని ‘దేవుని’గా మార్చకుండా ఉంచి మూలంలోని వ్యాకరణ అస్పష్టతను సంరక్షించాం.
- issue: κατέπαυσεν యొక్క భావం
  choice: విశ్రమించాడు
  alternative: తన కార్యాలను మానుకున్నాడు
  rationale: రెండు భావాలూ సాధ్యమే; ‘విశ్రమించాడు’ అనేది κατάπαυσις/καταπαύω పదపునరుక్తిని, ఆదికాండం 2తో ఉన్న అంతర్పాఠ్య సంబంధాన్ని నిలుపుతుంది. ‘మానుకున్నాడు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘కార్యాలు’ అనే పదం ‘పనులు’కన్నా కొద్దిగా గంభీరంగా ఉండి బైబిలు వాదనకు సరిపోతుంది. ‘ఆయన/తన’ రూపాలు సందర్భంలోని సూచనను నిలుపుతూ అనవసర సిద్ధాంత స్పష్టీకరణను నివారిస్తాయి.
