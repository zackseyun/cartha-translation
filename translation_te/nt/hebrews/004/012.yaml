id: HEB.4.12
reference: Hebrews 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: te
  text: ఎందుకంటే దేవుని వాక్యం సజీవమైనది, క్రియాశీలమైనది; రెండంచులుగల ఏ ఖడ్గంకన్నా పదునైనది. అది ప్రాణాన్నీ ఆత్మనూ, కీళ్లనూ మజ్జనూ విభజించేంతవరకు చొచ్చుకుపోతుంది[a]; హృదయంలోని ఆలోచనలను, ఉద్దేశాలను వివేచించగలది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చొచ్చుకుపోతుంది’ అని అనువదించిన గ్రీకు పదం, లోపలికి దాటి అత్యంత లోతువరకు చేరడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రాణం, ఆత్మ’ అనే మాటలు ఇక్కడ మానవుడు తప్పనిసరిగా వేర్వేరు భాగాలతో నిర్మితుడని నిర్ధారించవు; దేవుని వాక్యం అంతరంగపు అత్యంత లోతులకు చేరుతుందనే విషయమే రూపకంలో ప్రధానంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῶν
  choice: సజీవమైనది
  rationale: దేవుని వాక్యం నిరంతరం జీవంతో ఉన్నదనే వర్తమాన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ప్రబోధానికి ఈ వాక్యం కారణం లేదా ఆధారం ఇస్తున్న వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: దేవుని వాక్యం
  rationale: దేవుని పలుకు, సందేశం అనే విస్తృత భావాన్ని నిలుపుతూ, దానిని కేవలం లిఖిత గ్రంథానికో వ్యక్తిగత లోగోసుకో పరిమితం చేయదు.
- source_word: ἐνεργὴς
  choice: కార్యసాధకమైనది
  rationale: కేవలం కదలికలో ఉండటం మాత్రమే కాక, పనిచేసి ఫలితాన్ని కలిగించే సామర్థ్యాన్ని సూచిస్తుంది; ‘శక్తివంతమైనది’ కంటే మూలపదానికి దగ్గరగా ఉంటుంది.
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: రెండంచులుగల ఏ ఖడ్గం కంటే పదునైనది
  rationale: తులనను, రెండు కోసే అంచులున్న ఖడ్గపు రూపకాన్ని స్పష్టంగా సంరక్షిస్తుంది.
- source_word: διϊκνούμενος
  choice: లోతుగా చొచ్చుకుపోతుంది
  rationale: లోపలికి దాటి అత్యంత లోతువరకు చేరే భావాన్ని, ఖడ్గపు రూపకానికి సరిపోయే సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἄχρι μερισμοῦ
  choice: విడదీసేంత
  rationale: ἄχρι సూచించే అంతిమ పరిధిని, μερισμός సూచించే విభజనను కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ψυχῆς καὶ πνεύματος
  choice: ప్రాణాన్నీ ఆత్మనూ
  rationale: రెండు గ్రీకు పదాల భేదాన్ని తెలుగులో నిలుపుతుంది; అయితే మానవ నిర్మాణం గురించి ఒక నిర్దిష్ట సిద్ధాంతాన్ని అనువాదంలో చొప్పించదు.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: కీళ్లనూ మూలుగనూ
  rationale: అత్యంత లోతుగా చొచ్చుకుపోయే రూపకాన్ని కొనసాగిస్తూ, సాధారణ తెలుగు శరీర పదాలను ఉపయోగిస్తుంది.
- source_word: κριτικὸς
  choice: విచారించి తీర్పు చెప్పగలది
  rationale: పరిశీలించి అంచనా వేయడం, తీర్పు చేయడం అనే విశేషణపు సామర్థ్య భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐνθυμήσεων καὶ ἐννοιῶν καρδίας
  choice: హృదయంలోని ఆలోచనలను, ఉద్దేశాలను
  rationale: మొదటి పదాన్ని అంతరంగ ఆలోచనలుగా, రెండవదాన్ని సంకల్పాలు లేదా ఉద్దేశాలుగా వేరు చేసి, ‘హృదయం’ అనే బైబిలీయ అంతరంగ కేంద్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవుని వాక్యం’ దేనిని సూచిస్తుంది?
  choice: ‘దేవుని వాక్యం’ అనే విస్తృత రూపమే ఉంచబడింది.
  alternative: లేఖనం; ప్రకటించబడిన సందేశం; దేవుని వాగ్దానం లేదా తీర్పు; వ్యక్తిగత వాక్యమైన కుమారుడు
  rationale: హెబ్రీయులకు పత్రిక సమీప సందర్భం దేవుడు పలికే మాట యొక్క ప్రభావాన్ని ప్రధానంగా చూపుతుంది. అయినా గ్రీకు పదబంధం సూచనను ఒకే అంశానికి పరిమితం చేయనందున అనువాదం ఆ విస్తృతిని కాపాడుతుంది.
- issue: ‘ప్రాణం, ఆత్మ’ అనే జంటలోని మానవ స్వరూప సంబంధ సూచన
  choice: రెండు పదాలను వేరుగా అనువదించి, వాటిని తప్పనిసరిగా విడిగా ఉన్న మానవ భాగాలుగా వివరించలేదు.
  alternative: మానవుడు రెండు లేదా మూడు వేర్వేరు భాగాలతో నిర్మితుడనే సాంకేతిక వాదన
  rationale: ఈ వాక్యపు ప్రధాన బలం దేవుని వాక్యం అంతరంగపు అత్యంత లోతులకు చేరి విచారించగలదనే రూపకంలో ఉంది. పదాలను నిలుపుకోవాలి గాని, వాక్యం స్పష్టంగా ప్రకటించని మానవ నిర్మాణ సిద్ధాంతాన్ని దానిపై మోపకూడదు.
- issue: ‘విడదీయడం’ అనే రూపకపు ఖచ్చిత సంబంధం
  choice: ప్రాణం–ఆత్మ, కీళ్లు–మూలుగు అనే సమాంతర జంటలను అలాగే ఉంచి, వాక్యం ఎంత లోతుగా చొచ్చుకుపోతుందో ప్రధానంగా వ్యక్తం చేయబడింది.
  alternative: ప్రతి జంటలోని రెండు అంశాల మధ్య ఖచ్చితమైన విభజనను శరీరశాస్త్రీయంగా లేదా తాత్త్వికంగా వివరించడం
  rationale: గ్రీకు వ్యాకరణం విభజన యొక్క పరిధిని బలంగా తెలియజేస్తుంది; దాని ఖచ్చిత యాంత్రిక స్వరూపాన్ని వివరించదు. అందువల్ల మూలంలోని రూపకాత్మక ఉద్వేగం నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ‘దేవుని వాక్యం’, ‘హృదయం’, ‘ఆత్మ’ వంటి స్థిరమైన బైబిలీయ పదాలను నిలుపుతూ, కృత్రిమమైన పాత ప్రయోగాలను నివారించాం. మూలంలోని పొడవైన వాక్య నిర్మాణాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు ప్రధాన వాక్యభాగాలుగా మలిచినా, తార్కిక క్రమం మరియు రూపక సమాంతరతను కాపాడాం.
