id: HEB.4.6
reference: Hebrews 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: te
  text: కాబట్టి, కొంతమంది అందులో ప్రవేశించడం ఇంకా మిగిలి ఉండగా, గతంలో శుభవార్త ప్రకటించబడినవారు అవిధేయత[a] వల్ల ప్రవేశించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అవిశ్వాసం వల్ల.’ గ్రీకు పదం అవిధేయతలో వ్యక్తమయ్యే నమ్మడానికి నిరాకరించడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: కాబట్టి, ... ఉండగా
  rationale: οὖν యొక్క నిర్ధారణాత్మక భావాన్ని ‘కాబట్టి’ తెలియజేస్తుంది; ἐπεί యొక్క కారణాత్మక/పరిస్థితిని ఏర్పరచే భావాన్ని ‘ఉండగా’ సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν
  choice: కొందరు దానిలో ప్రవేశించవలసి ఉండగా
  rationale: ἀπολείπεται యొక్క ‘ఇంకా మిగిలి ఉంది’ అనే కొనసాగుతున్న భావాన్ని, కొందరు ప్రవేశించాల్సిన అవకాశం ఇంకా ఉందనే అర్థంతో తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. αὐτήνను సందర్భంలోని దేవుని విశ్రాంతికి తిరిగి సూచించే ‘దానిలో’గా ఉంచింది.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: ఇంతకు ముందు శుభవార్త ప్రకటించబడినవారు
  rationale: εὐαγγελισθέντεςలోని కర్మణి ప్రయోగాన్ని నిలుపుతూ, మతపరమైన సాంకేతిక పదజాలం లేకుండా శుభవార్త వారికి ప్రకటించబడిందని స్పష్టంగా చెబుతుంది; πρότερονను ‘ఇంతకు ముందు’గా అందిస్తుంది.
- source_word: οὐκ εἰσῆλθον
  choice: ప్రవేశించలేదు
  rationale: అలంకారమో అదనపు కారణభావమో చేర్చకుండా గ్రీకు భూతకాల నిరాకరణను నేరుగా అందిస్తుంది.
- source_word: δι’ ἀπείθειαν
  choice: అవిధేయత వల్ల
  rationale: ἀπείθεια యొక్క ప్రధాన భావమైన దేవుని మాటకు లోబడకపోవడాన్ని ‘అవిధేయత’ స్పష్టంగా తెలియజేస్తుంది; సందర్భంలో ఉన్న అవిశ్వాసపు ఛాయను పాదసూచికలో భద్రపరుస్తుంది.
theological_decisions:
- issue: హెచ్చరిక మరియు విశ్రాంతి సందర్భంలో ἀπείθεια అనువాదం
  choice: అవిధేయత వల్ల
  alternative: అవిశ్వాసం వల్ల
  rationale: ఈ పదం నమ్మడానికి నిరాకరించడం మరియు దాని ద్వారా వ్యక్తమయ్యే అవిధేయత రెండింటినీ సూచించగలదు. ప్రధాన పాఠంలో దాని సాధారణ నైతిక-క్రియాత్మక భావమైన ‘అవిధేయత’ను ఉంచి, నిజమైన అర్థ ఛాయను పాదసూచికలో తెలిపాం; తద్వారా విశ్వాసం-విధేయత మధ్య ఉన్న వేదాంతపరమైన ఉద్రిక్తతను ఒక్క భావానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని దీర్ఘ వాదనాత్మక వాక్యప్రవాహాన్ని నిలుపుతూ, ముందు వచనాల్లోని ‘విశ్రాంతి’కి సూచించే సర్వనామాన్ని ‘దానిలో’గా ఉంచాం.
