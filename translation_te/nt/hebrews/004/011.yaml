revisions:
- from: కాబట్టి, ఆ విశ్రాంతిలో ప్రవేశించడానికి మనం పట్టుదలతో కృషి చేద్దాం; ఎవరూ అదే అవిధేయతా నమూనాను[a] అనుసరించి పడిపోకుండా జాగ్రత్తపడదాం.
  to: కాబట్టి, ఆ విశ్రాంతిలో ప్రవేశించడానికి మనం శ్రద్ధగా కృషి చేద్దాం; అవిధేయతకు సంబంధించిన అదే నమూనాలో ఎవరూ పడిపోకుండా ఉండునట్లు.
  rationale: The revision retains the demonstrative reference to the previously discussed rest and the lexical rendering ‘అవిధేయత,’ while restoring the Greek sentence’s single exhortation plus negative purpose clause. The footnote preserves ‘unbelief’ as a contextual alternative without replacing the more direct lexical sense in the main text.
