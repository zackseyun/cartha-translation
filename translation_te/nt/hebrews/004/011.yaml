id: HEB.4.11
reference: Hebrews 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: te
  text: కాబట్టి, ఆ విశ్రాంతిలో ప్రవేశించడానికి మనం శ్రద్ధగా కృషి చేద్దాం; అవిధేయతకు సంబంధించిన అదే నమూనాలో ఎవరూ పడిపోకుండా ఉండునట్లు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: మనం పట్టుదలతో కృషి చేద్దాం
  rationale: ఈ ప్రథమ పురుష బహువచన ప్రేరణార్థక రూపం సమూహానికి ఇచ్చే ప్రోత్సాహాన్ని తెలియజేస్తుంది. ‘పట్టుదలతో కృషి చేద్దాం’ అనేది శ్రద్ధ, ఆసక్తి, గట్టి ప్రయత్నం అనే భావాలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వచనాల్లో దేవుని విశ్రాంతి గురించి చేసిన వాదన నుండి తీసుకున్న నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: εἰσελθεῖν
  choice: ప్రవేశించడానికి
  rationale: ప్రయత్నం యొక్క లక్ష్యాన్ని తెలిపే మూలభాషా క్రియారూపాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: ఆ విశ్రాంతి
  rationale: ముందుగా చర్చించిన దేవుని వాగ్దాన విశ్రాంతిని సూచించే నిర్దేశక భావాన్ని నిలుపుతుంది; దాని స్వరూపాన్ని అనవసరంగా మరింత నిర్దిష్టం చేయదు.
- source_word: ἵνα μὴ
  choice: పడిపోకుండా జాగ్రత్తపడదాం
  rationale: ప్రతికూల ఉద్దేశం మరియు హెచ్చరిక భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో తెలియజేస్తుంది. ‘జాగ్రత్తపడదాం’ అనేది తెలుగులో ఆధార వాక్యాన్ని పూర్తి చేస్తుంది; పడిపోవడం అనే ఫలితానికి అదనపు అర్థం చేర్చదు.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: అదే ... నమూనాను అనుసరించి
  rationale: అరణ్య తరానికి చెందిన హెచ్చరికాత్మక పూర్వోదాహరణను సూచిస్తుంది. ‘నమూనాను అనుసరించి’ అనేది ἐν యొక్క పరిధి/సాధన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πέσῃ
  choice: పడిపోకుండా
  rationale: హెచ్చరికలోని గంభీరమైన ‘పడిపోవడం’ అనే రూపకాన్ని నిలుపుతుంది; ‘నశించడం’ వంటి వివరణాత్మక భావాన్ని చేర్చదు.
- source_word: τῆς ἀπειθείας
  choice: అవిధేయతా
  rationale: ἀπείθεια అనే పదానికి ప్రత్యక్షమైన అర్థం ‘అవిధేయత.’ హెబ్రీయులకు పత్రిక సందర్భంలో ఇది అవిశ్వాసంతో సన్నిహితంగా ముడిపడి ఉన్నా, ప్రధాన పాఠంలో రెండు భావాలను కలిపివేయకుండా మూలపదానికి దగ్గరైన అర్థాన్ని ఉంచుతుంది.
theological_decisions:
- issue: అరణ్య తరం వైఫల్యంతో ἀπείθεια పదానికి ఉన్న సంబంధం
  choice: ప్రధాన పాఠంలో ‘అవిధేయత’ అని అనువదించడం
  alternative: ‘అవిశ్వాసం’ అని అనువదించడం
  rationale: కీర్తన 95 వివరణలో హెబ్రీయులకు పత్రిక అవిశ్వాసాన్నీ అవిధేయతనూ దగ్గరగా అనుసంధానిస్తుంది. అయినప్పటికీ ἀπείθεια పదం ప్రత్యక్షంగా అవిధేయతను సూచిస్తుంది. అందువల్ల ప్రధాన పాఠం మూలపదాన్ని నిలుపుతూ, సందర్భానుసారమైన ‘అవిశ్వాసం’ భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రేరణాత్మక శైలి ఉపయోగించబడింది. ‘ఆ విశ్రాంతి’ అనే సందర్భబద్ధ పదబంధం ఉద్దేశపూర్వకంగా వివరణ లేకుండా ఉంచబడింది. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘అవిధేయతా నమూనా’ వద్దనే పెట్టబడింది.
