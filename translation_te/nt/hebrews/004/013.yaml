revisions:
- from: ఆయన దృష్టికి కనిపించకుండా దాగి ఉన్న సృష్టి ఏదీ లేదు. అన్నీ ఆయన కళ్ల ఎదుట నగ్నంగా, పూర్తిగా బయటపడినవిగా ఉన్నాయి; మనం లెక్క అప్పగించవలసింది ఆయనకే.[a][b]
  to: ఆయన ఎదుట ఏ సృష్టియూ మరుగై లేదు. అన్నీ ఆయన కళ్ల ఎదుట నగ్నంగా, పూర్తిగా బహిర్గతమైనవిగా[b] ఉన్నాయి; మనం లెక్క చెప్పవలసినవాడు ఆయనే.[a]
  rationale: The revision improves idiomatic Telugu and footnote placement without changing the translation’s source-based interpretation. It preserves the debated imagery of τετραχηλισμένα and the compressed ambiguity of πρὸς ὃν ἡμῖν ὁ λόγος in the footnotes, while the main text gives the contextually well-supported sense of accountability.
