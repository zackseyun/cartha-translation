reference: Hebrews 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: te
  text: ఆయన ఎదుట ఏ సృష్టియూ మరుగై లేదు. అన్నీ ఆయన కళ్ల ఎదుట నగ్నంగా, పూర్తిగా బహిర్గతమైనవిగా[b] ఉన్నాయి; మనం లెక్క చెప్పవలసినవాడు ఆయనే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి మాటలను మరింత అక్షరార్థంగా, “మనకు వ్యవహారం ఉన్నవాడు ఆయనే” అని అనువదించవచ్చు; గ్రీకు పదబంధానికి “మన మాట లేదా విషయం ఎవరి వైపు ఉందో ఆయన” అనే భావం కూడా సాధ్యమే.
    reason: alternative_reading
  - marker: b
    text: “పూర్తిగా బహిర్గతమైనవిగా” అని అనువదించిన పదం అరుదైన గ్రీకు క్రియ నుంచి వచ్చింది. అది మెడను బహిర్గతం చేయడం లేదా వెనక్కి వంచడం అనే చిత్రాన్ని సూచించవచ్చు; ప్రధాన భావం దేవుని ఎదుట సంపూర్ణంగా బహిర్గతం కావడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: సృష్టి
  rationale: ఏ సృష్ట జీవి లేదా సృష్టించబడినది అయినా అనే సాధారణ ఏకవచన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘సృష్టి ఏదీ’ అనే నిర్మాణం పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: ἀφανὴς
  choice: కనిపించకుండా దాగి ఉన్న
  rationale: ఇక్కడ భౌతికంగా అదృశ్యమై ఉండడం కాక, దేవుని పరిశీలన నుంచి మరుగై ఉండడం ప్రధాన భావం; ఈ పదబంధం ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐνώπιον αὐτοῦ
  choice: ఆయన దృష్టికి
  rationale: అక్షరార్థంగా ‘ఆయన ఎదుట’; తరువాత వచ్చే ‘ఆయన కళ్ల ఎదుట’తో భావసంబంధాన్ని ఉంచుతూ తెలుగులో సహజంగా దైవిక దర్శనాన్ని సూచిస్తుంది.
- source_word: πάντα
  choice: అన్నీ
  rationale: నపుంసక బహువచనంలోని సమగ్ర పరిధిని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: γυμνὰ
  choice: నగ్నంగా
  rationale: పూర్తిగా కప్పులేకుండా ఉండే బలమైన రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: τετραχηλισμένα
  choice: పూర్తిగా బయటపడినవిగా
  rationale: అరుదైన క్రియారూపం సూచించే సంపూర్ణ బహిర్గత స్థితిని తెలియజేస్తుంది; వివాదాస్పదమైన మెడను వెనక్కి వంచే చిత్రాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: ఆయన కళ్ల ఎదుట
  rationale: దేవుని చూపుకు సమస్తం బహిర్గతమై ఉందనే సంబంధాన్ని సహజమైన తెలుగు పదబంధంతో నిలుపుతుంది.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: మనం లెక్క అప్పగించవలసింది ఆయనకే
  rationale: సంక్షిప్తమైన గ్రీకు నుడికారాన్ని సందర్భంలోని జవాబుదారీతన భావంతో స్పష్టంగా అందిస్తుంది; ఇతర సాధ్యమైన అర్థాలను పాదసూచనలో ఉంచుతుంది.
theological_decisions:
- issue: πρὸς ὃν ἡμῖν ὁ λόγος అనే చివరి వాక్యభాగం యొక్క అర్థం
  choice: మనం దేవునికి లెక్క అప్పగించాలి అనే జవాబుదారీతన భావం
  alternative: ‘మనకు వ్యవహారం ఉన్నవాడు ఆయనే’ లేదా ‘మన మాట/విషయం ఎవరి వైపు ఉందో ఆయన’
  rationale: సమీప సందర్భం దేవుని అంతర్దృష్టి మరియు తీర్పు హెచ్చరికను నొక్కిచెబుతుంది. ప్రధాన పాఠ్యం ఆ హెచ్చరిక శక్తిని సహజంగా తెలియజేస్తుంది; గ్రీకు నిర్మాణంలోని నిజమైన అస్పష్టతను పాదసూచనలో కాపాడుతుంది.
- issue: τετραχηλισμένα లోని రూపకం
  choice: పూర్తిగా బయటపడిన స్థితి
  alternative: మెడ బహిర్గతం కావడం లేదా వెనక్కి వంచబడడం
  rationale: ఈ అరుదైన పదం యొక్క ఖచ్చిత రూపచిత్రం వివాదాస్పదం. అందువల్ల ప్రధాన పాఠ్యం నిర్ధారితమైన సంపూర్ణ బహిర్గత భావాన్ని ఇస్తూ, సాధ్యమైన మెడ రూపకాన్ని పాదసూచనలో పేర్కొంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘నగ్నంగా’ అనే సజీవ రూపకం నిలుపబడింది; అరుదైన పదంలోని అనిశ్చిత రూపచిత్రం మరియు చివరి గ్రీకు నుడికారంలోని ప్రత్యామ్నాయ అర్థాలు పాదసూచనల్లో భద్రపరచబడ్డాయి. అన్ని పాదసూచన గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
