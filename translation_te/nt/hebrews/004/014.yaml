revisions:
- from: కాబట్టి, ఆకాశమండలాల గుండా వెళ్లిన[a] గొప్ప ప్రధాన యాజకుడు—దేవుని కుమారుడైన యేసు—మనకు ఉన్నాడు గనుక, మన విశ్వాస ప్రకటనను గట్టిగా పట్టుకుందాం.
  to: కాబట్టి, ఆకాశాల గుండా వెళ్లిన[a] గొప్ప ప్రధాన యాజకుడు—దేవుని కుమారుడైన యేసు—మనకు ఉన్నాడు గనుక, మన విశ్వాస ఒప్పుకోలును దృఢంగా నిలుపుకుందాం.
