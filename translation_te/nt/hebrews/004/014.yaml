id: HEB.4.14
reference: Hebrews 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: te
  text: కాబట్టి, ఆకాశాల గుండా వెళ్లిన[a] గొప్ప ప్రధాన యాజకుడు—దేవుని కుమారుడైన యేసు—మనకు ఉన్నాడు గనుక, మన విశ్వాస ఒప్పుకోలును దృఢంగా నిలుపుకుందాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశాల గుండా దాటి వెళ్లిన.” గ్రీకులో “ఆకాశాలు” బహువచనంలో ఉంది.
    reason: ‘గుండా వెళ్లిన’కు సాధ్యమైన ప్రత్యామ్నాయాన్ని సూచిస్తూ, మూలంలోని బహువచనాన్ని స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: కాబట్టి ... మనకు ఉన్నాడు గనుక
  rationale: οὖν ముందరి వాదన నుంచి వచ్చే నిర్ధారణను సూచిస్తుంది; ἔχοντες ప్రోత్సాహానికి ఆధారాన్ని ఇస్తుంది. తెలుగు వాక్యనిర్మాణంలో ఈ రెండింటి తార్కిక సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀρχιερέα μέγαν
  choice: గొప్ప ప్రధాన యాజకుడు
  rationale: యాజక పదవినీ, ఆయన విశిష్టతపై ఉన్న గుణాత్మక ఉద్ఘాటననూ నిలుపుతుంది.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: ఆకాశమండలాల గుండా వెళ్లిన
  rationale: διέρχομαι లోని ‘గుండా వెళ్లడం’ అనే భావాన్నీ, οὐρανούς యొక్క బహువచనాన్నీ నిలుపుతుంది. గ్రీకు పరిపూర్ణ కాలరూపం పూర్తయిన కార్యానికి కొనసాగుతున్న ప్రాముఖ్యత ఉందని సూచిస్తుంది.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: దేవుని కుమారుడైన యేసు
  rationale: వ్యక్తినామాన్ని సహజ తెలుగు రూపంలో ఇస్తూ, క్రీస్తుసంబంధమైన బిరుదును స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: κρατῶμεν
  choice: గట్టిగా పట్టుకుందాం
  rationale: ప్రథమ పురుష బహువచన ప్రోత్సాహక భావాన్నీ, కొనసాగించాల్సిన దృఢ పట్టుదలనూ సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῆς ὁμολογίας
  choice: మన విశ్వాస ప్రకటనను
  rationale: సమాజం బహిరంగంగా అంగీకరించి ప్రకటించే విశ్వాసాన్ని సూచిస్తుంది. గ్రీకులో స్వామ్యసూచక సర్వనామం లేకపోయినా, సమూహాన్ని ఉద్దేశించిన ప్రోత్సాహం వల్ల తెలుగులో ‘మన’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: υἱὸς τοῦ θεοῦ అనే క్రీస్తుసంబంధమైన బిరుదు
  choice: దేవుని కుమారుడు
  alternative: దేవుని పుత్రుడు
  rationale: అర్థాన్ని మార్చకుండా అధికారిక బిరుదును నిలుపుతూ, ఆధునిక సాధారణ తెలుగులో స్పష్టంగా వినిపిస్తుంది.
- issue: τοὺς οὐρανούς లోని బహువచన పరలోక చిత్రణ
  choice: ఆకాశమండలాలు
  alternative: పరలోకం
  rationale: మూలంలోని బహువచనాన్నీ, వాటి గుండా యేసు వెళ్లినట్లు ఉన్న చిత్రణనూ నిలుపుతుంది; వచనం చెప్పనంతగా నిర్దిష్టమైన విశ్వవ్యవస్థను ఇందులో చేర్చదు.
- issue: ὁμολογία యొక్క పరిధి
  choice: మన విశ్వాస ప్రకటన
  alternative: మన ఒప్పుకోలు
  rationale: ఇది కేవలం వ్యక్తిగత అంగీకారం లేదా పాప ఒప్పుకోలు అని సంకుచితం కాకుండా, విశ్వాస సమాజం ప్రకటించే క్రీస్తుసంబంధమైన అంగీకారంగా సందర్భానుసారంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రోత్సాహక శైలి వాడబడింది. మూలంలోని తార్కిక సంబంధం, క్రీస్తుసంబంధమైన బిరుదు, ఆకాశమండలాల బహువచనం నిలుపబడ్డాయి.
