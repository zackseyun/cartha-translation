id: HEB.4.7
reference: Hebrews 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: te
  text: 'ఆయన మళ్లీ ఒక నిర్దిష్ట దినాన్ని, “నేడు” అని, నిర్ణయిస్తున్నాడు; ఎంతో కాలం గడిచిన తర్వాత దావీదు ద్వారా ఇలా చెబుతున్నాడు, ఇంతకుముందే చెప్పబడినట్లుగా:


    “నేడు మీరు ఆయన స్వరం వింటే,

    మీ హృదయాలను కఠినపరచుకోవద్దు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: వాదనలో ముందే చెప్పిన విషయాన్ని తిరిగి చేపట్టి, దేవుడు ఒక రోజును కొత్తగా నిర్దేశిస్తున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τινὰ ἡμέραν
  choice: ఒక నిర్దిష్టమైన రోజును
  rationale: τις సూచించే, ఏదో అస్పష్టమైన రోజు కాక నిర్దేశించబడిన ఒక ప్రత్యేక రోజనే భావాన్ని నిలుపుతుంది.
- source_word: ὁρίζει
  choice: నిర్ణయిస్తున్నాడు
  rationale: ఒక రోజును అధికారపూర్వకంగా నిర్దేశించడం లేదా నిర్ణయించడం అనే భావాన్ని సందర్భానుగుణంగా వ్యక్తపరుస్తుంది.
- source_word: Σήμερον
  choice: నేడు
  rationale: కీర్తన ఉల్లేఖనంలో ప్రతిస్పందించడానికి దేవుడు నిర్దేశించిన ప్రస్తుత అవకాశంగా ఉన్న పదం యొక్క వాక్పటుత్వ బలాన్ని నిలుపుతుంది.
- source_word: ἐν Δαυὶδ λέγων
  choice: దావీదు ద్వారా ఆయన ఇలా అంటున్నాడు
  rationale: దేవుడు దావీదును మాధ్యమంగా చేసుకొని మాట్లాడుతున్నాడనే సహజమైన అర్థాన్ని ఇస్తుంది; పదబద్ధమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి మూలంలోని సందిగ్ధతను కాపాడుతుంది.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: ఎంతో కాలం గడిచిన తర్వాత
  rationale: అరణ్య తరం తర్వాత గడిచిన దీర్ఘకాల విరామాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: καθὼς προείρηται
  choice: మునుపు చెప్పినట్టే
  rationale: ఇంతకుముందు పలికిన మాట ఇప్పటికీ సంబంధం కలిగి ఉందనే పరిపూర్ణ కర్మణి రూప భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: మీరు ఆయన స్వరం వింటే
  rationale: ప్రతిస్పందనతో కూడిన వినికిడిని సూచించే బైబిలు నుడికారాన్ని ‘లోబడితే’ అని వివరణాత్మకంగా మార్చకుండా కాపాడుతుంది.
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: మీ హృదయాలను కఠినపరచుకోకండి
  rationale: మొండితనానికి వ్యతిరేకమైన హెచ్చరికను, అంతరంగం మరియు సంకల్పాన్ని సూచించే ‘హృదయాలు’ అనే రూపకంతో సహా నిలుపుతుంది.
theological_decisions:
- issue: దేవుని విశ్రాంతి గురించిన వాదనలో ‘నేడు’ అనే పదం యొక్క బలం
  choice: ప్రతిస్పందించడానికి దేవుడు నిర్దేశించిన ప్రస్తుత అవకాశంగా ‘నేడు’ను ఉంచడం
  alternative: దాన్ని కేవలం కీర్తనకర్త మాట్లాడిన చారిత్రక రోజుగా గానీ, పూర్తిగా అంత్యకాల దినంగా గానీ పరిమితం చేయడం
  rationale: అరణ్యకాలం తర్వాత ఎంతో కాలానికి కూడా దేవుడు ప్రతిస్పందన కోసం ఒక ‘నేడు’ను నిర్దేశిస్తున్నాడని వచనం వాదిస్తుంది; అనువాదం కాలం గురించి పాఠానికి మించిన సిద్ధాంతాన్ని చేర్చదు.
- issue: ἐν Δαυὶδ యొక్క అర్థం
  choice: దావీదు ద్వారా
  alternative: దావీదులో; అంటే, దావీదుతో సంబంధమున్న కీర్తనలో
  rationale: ప్రధాన పాఠంలో దేవుడు దావీదు ద్వారా మాట్లాడుతున్నాడనే సహజ భావాన్ని ఇస్తూ, పాదసూచికలో గ్రంథస్థానాన్ని సూచించే సాధ్యమైన అర్థాన్ని నిలుపుతుంది; రచయితత్వంపై మూలం కంటే బలమైన నిర్ధారణ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. కీర్తన ఉల్లేఖనాన్ని పంక్తులుగా అమర్చి దాని వాక్పటుత్వ బలాన్ని చూపించాం. ‘ఆయన’ అనే సర్వనామం మూలంలోని అంతర్లీన కర్తను నిలుపుతుంది; సందర్భం దానిని దేవునిగా గుర్తిస్తుంది.
