id: HEB.4.1
reference: Hebrews 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: te
  text: కాబట్టి, ఆయన విశ్రాంతిలో ప్రవేశించే వాగ్దానం ఇంకా మిగిలి ఉండగా[b], మీలో ఎవరైనా దానిని చేరుకోలేకపోయినట్లు కనిపిస్తారేమోనని మనం భయపడుదాం[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం భయపడుదాం.” గ్రీకు క్రియ కేవలం “జాగ్రత్తపడుదాం” అనే మృదువైన భావంకంటే బలమైన హెచ్చరికను ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “ఆయన విశ్రాంతిలో ప్రవేశించడానికి సంబంధించిన వాగ్దానం మిగిలి ఉండగా.” గ్రీకు వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది.
    reason: alternative_reading
  - marker: c
    text: లేదా, “దానిని చేరుకోవడంలో విఫలమైనట్లు కనిపిస్తారేమోనని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: మనం భయపడుదాం
  rationale: హెచ్చరికలోని తీవ్రతను నిలుపుతూ, హోర్టేటరీ సబ్జంక్టివ్‌ను సహజమైన సమష్టి ప్రోత్సాహక రూపంలో వ్యక్తపరుస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వాదననుంచి తీసుకొనే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: μήποτε
  choice: '...కనిపించకుండేలా'
  rationale: ప్రతికూల ఆందోళనతో కూడిన హెచ్చరికను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: వాగ్దానం ఇంకా నిలిచి ఉండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ తెలిపే సమకాలిక పరిస్థితినీ, వాగ్దానం ఇప్పటికీ కొనసాగుతోందనే భావాన్నీ కాపాడుతుంది.
- source_word: ἐπαγγελίας εἰσελθεῖν
  choice: ప్రవేశిస్తామనే వాగ్దానం
  rationale: ప్రవేశించడాన్ని వాగ్దానపు విషయంగా సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: κατάπαυσιν αὐτοῦ
  choice: ఆయన విశ్రాంతి
  rationale: సర్వనామాన్ని అలాగే ఉంచి, సందర్భం అభివృద్ధి చేసే దేవుని విశ్రాంతి భావాన్ని ముందుగానే అతిగా నిర్దిష్టం చేయదు.
- source_word: δοκῇ
  choice: కనిపించు
  rationale: కేవలం తుది వైఫల్యమని నిర్ణయించకుండా, కనిపించడం లేదా అనిపించడం అనే గ్రీకు పదంలోని సూక్ష్మతను నిలుపుతుంది.
- source_word: τις ἐξ ὑμῶν
  choice: మీలో ఎవ్వరైనా
  rationale: సమూహంలోని ఏ ఒక్క వ్యక్తినైనా ఉద్దేశించే హెచ్చరికను సహజంగా అందిస్తుంది.
- source_word: ὑστερηκέναι
  choice: చేరుకోలేకపోయినట్లు
  rationale: వాగ్దానమైన గమ్యాన్ని పొందడంలో విఫలమవడం అనే సందర్భానుగుణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: హెచ్చరికను సాధారణ జాగ్రత్తగా మృదువుచేయాలా, నిజమైన భయంగా ఉంచాలా
  choice: “మనం భయపడుదాం” అనే బలమైన హెచ్చరికను ఉంచడం
  alternative: “మనం జాగ్రత్తపడుదాం”
  rationale: φοβηθῶμεν యొక్క స్పష్టమైన తీవ్రతను కాపాడుతుంది; విశ్వాసంలో నిలకడ లేదా భ్రష్టత్వం గురించి ఏ సిద్ధాంతపరమైన పరిష్కారాన్నీ పాఠ్యంలోకి చేర్చదు.
- issue: “ఆయన విశ్రాంతి”ని ప్రధాన పాఠ్యంలో దేవుని అంత్యకాల విశ్రాంతిగా స్పష్టీకరించాలా
  choice: “ఆయన విశ్రాంతి” అని సర్వనామ రూపాన్నే ఉంచడం
  alternative: “దేవుని విశ్రాంతి” లేదా “ఆయన సబ్బాతు విశ్రాంతి”
  rationale: సందర్భంలో సూచితుడు స్పష్టంగా ఉన్నా, గ్రీకు పాఠ్యంలోని సర్వనామాన్ని నిలుపుతూ అధ్యాయంలో క్రమంగా అభివృద్ధి చెందే అర్థాన్ని ముందుగానే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. “విశ్రాంతి,” “వాగ్దానం” వంటి సందర్భపరంగా కీలకమైన పదాలను స్థిరంగా ఉంచి, హెచ్చరిక తీవ్రతను తగ్గించలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
