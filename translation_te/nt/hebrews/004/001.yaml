- from: కాబట్టి, ఆయన విశ్రాంతిలో ప్రవేశిస్తామనే వాగ్దానం ఇంకా నిలిచి ఉండగా[b], మీలో ఎవ్వరైనా దానిని చేరుకోలేకపోయినట్లు కనిపించకుండేలా మనం భయపడుదాం[a][c].
