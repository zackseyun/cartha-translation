id: HEB.4.2
reference: Hebrews 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: te
  text: నిజానికి, వారిలాగే మనకు కూడా శుభవార్త ప్రకటించబడింది. అయితే వారు విన్న సందేశం వారికి ప్రయోజనం కలిగించలేదు; ఎందుకంటే వారు విశ్వాసం[ఎ] ద్వారా విన్నవారితో ఏకమై ఉండలేదు.[బ]
  philosophy: optimal-equivalence
  footnotes:
  - marker: ఎ
    text: గ్రీకు పదానికి “విశ్వాసం” అని అర్థం; “నమ్మకం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: బ
    text: 'పాఠాంతరాన్ని అనుసరించే సంప్రదాయ అనువాదం: “వారు విన్న సందేశం, దాన్ని విన్నవారిలో విశ్వాసంతో కలిసిపోలేదు.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: మనకు కూడా శుభవార్త ప్రకటించబడింది
  rationale: ἐσμεν‌తో కూడిన ఈ perfect passive participle, గతంలో జరిగిన ప్రకటనకు ఇప్పటికీ ప్రాసంగికత ఉందని సూచిస్తుంది. “శుభవార్త ప్రకటించబడింది” అనే పదబంధం అరణ్య తరంతో పోలికను నిలుపుతూ క్రియాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: καθάπερ κἀκεῖνοι
  choice: వారిలాగే
  rationale: ప్రస్తుత శ్రోతలకు, ముందటి అరణ్య తరానికి దేవుని సందేశం ప్రకటించబడిందనే సమానత్వాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: వారు విన్న సందేశం
  rationale: λόγος‌ను ప్రకటించబడిన విషయం గాను, ἀκοήను వినబడినది గాను గ్రహించి, గ్రీకు షష్ఠీ నిర్మాణాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ὠφέλησεν
  choice: ప్రయోజనం కలిగించలేదు
  rationale: విన్న సందేశం వారికి మేలు చేయకపోవడం లేదా ఆధ్యాత్మిక ఫలితం కలిగించకపోవడం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: συγκεκερασμένους
  choice: ఏకం కాలేదు
  rationale: పదానికి ప్రాథమికంగా కలపడం లేదా మేళవించడం అనే భావం ఉన్నా, ఇక్కడ వ్యక్తులు విశ్వాసం ద్వారా ఇతరులతో కలిసిపోకపోవడాన్ని “ఏకం కాలేదు” సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πίστει
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో సందేశం వినడానికీ దానిని నమ్మకంతో స్వీకరించడానికీ మధ్య వ్యత్యాసం ఉంది. “విశ్వాసం” ప్రధాన భావాన్ని నిలుపుతుంది; “నమ్మకం” కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: τοῖς ἀκούσασιν
  choice: విన్నవారితో
  rationale: ἀκούω అనే క్రియకు దగ్గరగా ఉండి, source textలోని దత్తివు రూపం సూచించే అనుబంధాన్ని “తో” ద్వారా చూపిస్తుంది.
- source_word: μὴ συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν
  choice: విన్నవారితో వారు విశ్వాసం ద్వారా ఏకం కాలేదు
  rationale: SBLGNTలోని పురుషలింగ బహువచన ద్వితీయావిభక్తి participle, ἐκείνους (“వారిని/వారు”)తో అన్వయించడాన్ని ప్రధాన పాఠంలో అనుసరిస్తుంది. వేరే పాఠాంతరం ఇచ్చే సంప్రదాయ అర్థాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: πίστις యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: సందేశాన్ని కేవలం వినడం కాక దానికి నమ్మకంతో స్పందించడం ఈ సందర్భంలోని వ్యత్యాసం. “విశ్వాసం” ఆ భావాన్ని మతశాఖాపరమైన అదనపు నిర్వచనం లేకుండా నిలుపుతుంది.
- issue: చివరి ఉపవాక్యంలోని కర్త, అన్వయం
  choice: వారు విన్నవారితో విశ్వాసం ద్వారా ఏకం కాలేదు
  alternative: విన్న సందేశం, దాన్ని విన్నవారిలో విశ్వాసంతో కలవలేదు
  rationale: ఇచ్చిన SBLGNT పాఠంలోని συγκεκερασμένους రూపం సహజంగా ἐκείνους‌ను సూచిస్తుంది. అయితే ప్రసిద్ధ పాఠాంతరం సందేశాన్ని విశ్వాసంతో కలవని దానిగా గ్రహించడానికి ఆధారం ఇస్తుంది; అందువల్ల ఆ అర్థాన్ని పాదసూచికలో పారదర్శకంగా తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైనప్పటికీ సహజమైన వాక్య నిర్మాణం వాడబడింది. “నిజానికి,” “శుభవార్త ప్రకటించబడింది,” “ప్రయోజనం కలిగించలేదు” వంటి పదబంధాలు మూలంలోని తార్కిక అనుసంధానం, passive proclamation, ఫలితం లేకపోవడం అనే భావాలను నిలుపుతాయి. పాఠాంతరంతో ఏర్పడే నిజమైన సందిగ్ధతను ప్రధాన పాఠంలో పరిష్కరించినట్లు చూపకుండా పాదసూచికలో భద్రపరచబడింది.
