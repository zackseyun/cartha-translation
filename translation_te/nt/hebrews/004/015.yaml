id: HEB.4.15
reference: Hebrews 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: te
  text: ఎందుకంటే, మన బలహీనతల విషయంలో మనతో సహానుభూతి చూపలేని ప్రధాన యాజకుడు మనకు లేడు; బదులుగా, ప్రతి విషయంలో మనలాగే పరీక్షించబడినవాడు[a][b] మనకు ఉన్నాడు—అయినా పాపం లేకుండా ఉన్నవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి విషయంలో మనలాగే శోధించబడినవాడు.”
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “పోలిక ప్రకారం”; అనేక అనువాదాలు సందర్భాన్ని స్పష్టం చేస్తూ “మనలాగే” లేదా “మనకు ఉన్నట్లే” అని అనువదిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερέα
  choice: ప్రధాన యాజకుడు
  rationale: హెబ్రీయులకు పత్రికలో యేసు చేసే యాజక మధ్యవర్తిత్వాన్ని సూచించే ఆరాధనాసంబంధ పదవికి సహజమైన, స్థిరమైన తెలుగు పదం.
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: సహానుభూతి చూపలేని
  rationale: οὐ ... μὴ δυνάμενον అనే ద్వినిషేధ రూపాన్ని ‘చూపలేని ... లేడు’గా నిలిపి, గ్రీకు వాక్యంలోని అలంకార బలాన్ని కాపాడుతుంది. συμπαθέω కేవలం జాలి చూపడమే కాక, ఇతరుల బలహీనతను అనుభూతిపూర్వకంగా పంచుకోవడాన్ని సూచిస్తుంది.
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: మన బలహీనతల విషయంలో
  rationale: ἀσθένεια శారీరక అనారోగ్యానికే పరిమితం కాకుండా మానవ బలహీనతను, దుర్బలతను విస్తృతంగా సూచిస్తుంది; తెలుగులో ఈ సందర్భానికి ‘బలహీనతలు’ స్పష్టంగా ఉంటుంది.
- source_word: πεπειρασμένον
  choice: పరీక్షించబడినవాడు
  rationale: πειράζωకు ‘పరీక్షించు’ మరియు ‘శోధించు/ప్రలోభపెట్టు’ అనే భావాలు రెండూ సాధ్యమే. ప్రధాన పాఠంలో ‘పరీక్షించబడినవాడు’ అనుభవించిన నిజమైన పరీక్షను తెలుపుతూ, అంతర్గత పాపవాంఛను అనవసరంగా సూచించదు; మరో సాధ్య భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: κατὰ πάντα
  choice: ప్రతి విషయంలో
  rationale: పరీక్ష యొక్క సమగ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καθ’ ὁμοιότητα
  choice: మనలాగే
  rationale: అక్షరార్థంగా ‘పోలిక ప్రకారం’ అయినప్పటికీ, సందర్భంలో పోలిక మనతోనే ఉందని సహజంగా వ్యక్తం చేస్తుంది. మూలంలోని సంక్షిప్తతను అతిగా సిద్ధాంతీకరించకుండా అర్థాన్ని అందిస్తుంది.
- source_word: χωρὶς ἁμαρτίας
  choice: అయినా ఆయన పాపం లేనివాడు
  rationale: 'ముందటి పోలికకు నిర్ణాయకమైన మినహాయింపును స్పష్టంగా తెలుపుతుంది: పరీక్ష నిజమైనదే, అయినా ఆయనలో పాపం లేదు.'
theological_decisions:
- issue: క్రీస్తు పాపరాహిత్యంతో సంబంధించి πεπειρασμένον అనువాదం
  choice: పరీక్షించబడినవాడు
  alternative: శోధించబడినవాడు
  rationale: మూలపదంలోని పరీక్ష/శోధన అనే అర్థవిస్తారాన్ని గుర్తిస్తూ, ప్రధాన పాఠం నిజమైన పరీక్షను స్పష్టంగా చెబుతుంది; ‘శోధించబడినవాడు’ అనే సమర్థించదగిన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపి వచనంలోని ఉద్రిక్తతను కాపాడాం.
- issue: καθ’ ὁμοιότητα లో సూచితమైన పోలికను ఎంత స్పష్టంగా చెప్పాలి
  choice: మనలాగే
  alternative: పోలిక ప్రకారం
  rationale: గ్రీకులో పోలికకు సంబంధించిన పదాలు సంక్షిప్తంగా ఉన్నప్పటికీ, సందర్భంలో పోలిక విశ్వాసుల మానవ అనుభవంతో ఉంది. ‘మనలాగే’ సహజమైన తెలుగులో దానిని తెలియజేస్తుంది; అయితే ప్రతి అంశంలో సంపూర్ణ సమానత్వం ఉందనే భావం రాకుండా పాపరాహిత్య మినహాయింపును ప్రత్యేకంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. గ్రీకులోని ద్వినిషేధ నిర్మాణాన్ని ‘చూపలేని ... లేడు’గా నిలిపాం; దీర్ఘ వాక్యాన్ని అర్థస్పష్టత కోసం అర్ధవిరామం మరియు డాష్‌తో విభజించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
