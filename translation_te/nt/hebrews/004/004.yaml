id: HEB.4.4
reference: Hebrews 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: te
  text: 'ఎందుకంటే, ఏడవ రోజు గురించి ఒకచోట ఆయన ఇలా చెప్పాడు: “మరియు దేవుడు ఏడవ రోజున తన పనులన్నిటి నుండి విశ్రమించాడు.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎక్కడో ఒకచోట.” గ్రీకులో “ఎక్కడో” అనే భావం ఉంది. ఇది లేఖనంలోని ఉల్లేఖనం ఉన్న స్థానాన్ని నిర్దిష్టంగా పేర్కొనని పరిచయ విధానం; ఆ లేఖనపు ప్రామాణికత గురించి అనిశ్చితిని సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “పని చేయడం మానుకున్నాడు.” ఈ క్రియ పని నుండి విరమించడాన్ని నొక్కి చెప్పగలదు. ఆదికాండం 2:2తోను హెబ్రీయులు 3–4లోని దేవుని విశ్రాంతి అంశంతోను సంబంధాన్ని నిలపడానికి ఇక్కడ “విశ్రమించాడు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: ఆయన చెప్పాడు
  rationale: గ్రీకు పరిపూర్ణ కాలం గతంలో పలికిన మాటకు ఇప్పటికీ ఉన్న ప్రాముఖ్యతను సూచిస్తుంది. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం సాధారణ భూతకాలాన్ని వాడినా, సందర్భం మరియు లేఖన ఉల్లేఖనం ఆ మాట యొక్క కొనసాగుతున్న ప్రామాణికతను తెలియజేస్తాయి.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఆధారాన్ని లేదా వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: που
  choice: ఒకచోట
  rationale: లేఖనంలోని నిర్దిష్ట స్థానాన్ని పేర్కొనకుండా ఉల్లేఖనాన్ని పరిచయం చేసే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: περὶ τῆς ἑβδόμης
  choice: ఏడవ రోజు గురించి
  rationale: గ్రీకులో సందర్భం వల్ల అంతర్లీనంగా ఉన్న ‘రోజు’ అనే నామవాచకాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οὕτως
  choice: ఇలా
  rationale: తరువాత వచ్చే ఉల్లేఖన పదాలను సహజంగా పరిచయం చేస్తూ గ్రీకు నిర్దేశక భావాన్ని నిలుపుతుంది.
- source_word: Καὶ
  choice: మరియు
  rationale: ఇది ఆదికాండపు ఉల్లేఖనంలో భాగం కాబట్టి, తెలుగులో కొంత అధికారికంగా వినిపించినా ప్రత్యక్షంగా నిలుపబడింది.
- source_word: κατέπαυσεν
  choice: విశ్రమించాడు
  rationale: పని నుండి విరమించడాన్ని సూచిస్తూ, ఆదికాండం 2:2తోను హెబ్రీయులు 3–4లోని దేవుని విశ్రాంతి వాదనతోను ఉన్న పదసంబంధాన్ని కాపాడుతుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: గ్రీకు వాక్యంలోని స్పష్టమైన కర్తకు సహజమైన తెలుగు సమానం.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: ఏడవ రోజున
  rationale: రోజును సూచించే కాలప్రయోగానికి సహజమైన తెలుగు రూపం; నిర్దిష్టమైన ఏడవ రోజును స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: తన పనులన్నిటి నుండి
  rationale: ἀπό సూచించే విరమణ భావాన్ని, ἔργων యొక్క బహువచనాన్ని, αὐτοῦ యొక్క స్వకీయ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: హెబ్రీయుల పత్రికలోని విశ్రాంతి అంశానికి సంబంధించి దేవుడు తన పనిని ఆపినట్లు చెప్పే క్రియ అనువాదం
  choice: విశ్రమించాడు
  alternative: పని చేయడం మానుకున్నాడు; విరమించాడు
  rationale: ‘విశ్రమించాడు’ అనేది ఆదికాండం 2:2 ఉల్లేఖనంతోను హెబ్రీయులు 3–4లో కొనసాగే ‘విశ్రాంతి’ అంశంతోను సంబంధాన్ని నిలుపుతుంది. ఇది దేవుడు అలసిపోయాడని తప్పనిసరిగా సూచించదు; ఆయన తన సృష్టి కార్యాన్ని ముగించి దాని నుండి విరమించాడనే భావాన్ని సందర్భం ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘ఒకచోట’ సహజమైన అస్పష్ట ఉల్లేఖన పరిచయం; ‘విశ్రమించాడు’ మూలపాఠంలోని విరమణ భావాన్ని మరియు పరిసర వాదనలోని కీలక పదసంబంధాన్ని రెండింటినీ కాపాడుతుంది. ఉల్లేఖన ఆరంభంలోని Καὶ ను ‘మరియు’గా నిలుపడం వల్ల వాక్యం కొంత అధికారికంగా వినిపిస్తుంది.
