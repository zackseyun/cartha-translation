id: HEB.4.8
reference: Hebrews 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: te
  text: ఎందుకంటే యెహోషువ[a] వారికి విశ్రాంతినిచ్చి ఉంటే, దేవుడు ఆ తర్వాత మరొక రోజు గురించి చెప్పి ఉండేవాడు కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో: ‘యేసు.’ Ἰησοῦς అనే ఒకే గ్రీకు నామరూపం యేసును గానీ యెహోషువను గానీ సూచించగలదు; ఇక్కడి సందర్భం నూను కుమారుడైన యెహోషువను సూచిస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: యెహోషువ
  rationale: గ్రీకు నామరూపం యేసును గానీ యెహోషువను గానీ సూచించగలదు. అయితే ఇక్కడి సందర్భం కనాను దేశంలోకి ఇశ్రాయేలీయులను నడిపించిన నూను కుమారుడైన యెహోషువను స్పష్టంగా సూచిస్తుంది.
- source_word: κατέπαυσεν
  choice: విశ్రాంతి కలిగించి ఉంటే
  rationale: ఈ క్రియలో ఇతరులకు విశ్రాంతి కలిగించడం లేదా వారిని విశ్రాంతికి చేర్చడం అనే కారణార్థక భావం ఉంది. తెలుగు వాక్యంలో ప్రతివాస్తవిక షరతును సహజంగా తెలియజేయడానికి ‘కలిగించి ఉంటే’ అని అనువదించాం.
- source_word: οὐκ ἂν ... ἐλάλει
  choice: మాట్లాడి ఉండేవాడు కాదు
  rationale: ἄνతో కూడిన అపూర్ణ భూతకాల క్రియ గతానికి సంబంధించిన ప్రతివాస్తవిక ఫలితాన్ని వ్యక్తం చేస్తుంది. ఈ తెలుగు రూపం ఆ షరతార్థక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: మరొక రోజు గురించి
  rationale: యెహోషువ కాలం తర్వాత కూడా దేవుడు ముందుంచిన విశ్రాంతికి సంబంధించిన తదుపరి రోజును ఈ పదబంధం సూచిస్తుంది.
- source_word: μετὰ ταῦτα
  choice: ఆ తర్వాత
  rationale: ఈ పదబంధం యెహోషువ కాలం అనంతరమైన కాలక్రమాన్ని సూచిస్తుంది; ‘ఆ తర్వాత’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు వివరణాత్మక ఆధారాన్ని పరిచయం చేసే γάρ సంబంధాన్ని ఈ పదం స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: హెబ్రీయులు 4:8లో Ἰησοῦς ఎవరిని సూచిస్తుంది?
  choice: నూను కుమారుడైన యెహోషువ
  alternative: యేసు
  rationale: ఈ వాక్యంలోని వాదన ఇశ్రాయేలీయులు యెహోషువ నాయకత్వంలో దేశంలోకి ప్రవేశించిన విషయానికీ, కీర్తన 95లో ఆ తర్వాత ప్రకటించబడిన విశ్రాంతి వాగ్దానానికీ సంబంధించినది. అందువల్ల ప్రధాన పాఠ్యంలో ‘యెహోషువ’ సరైన సందర్భార్థం; గ్రీకు రూపంలోని నిజమైన నామసామ్యాన్ని పాదసూచికలో ఉంచాం.
- issue: ἐλάλει క్రియకు సూచిత కర్త
  choice: తెలుగులో కర్తను ప్రత్యక్షంగా చేర్చకుండా ఉంచడం
  alternative: ‘దేవుడు’ లేదా ‘ఆయన’ అని స్పష్టంగా చేర్చడం
  rationale: గ్రీకు వాక్యంలో ఈ క్రియకు కర్త ప్రత్యేక నామవాచకంగా లేదు; సందర్భం ద్వారా గ్రహించాలి. తెలుగు కర్తలోప వాక్యనిర్మాణం సహజంగా ఉండటంతో, ‘దేవుడు’ అని పాఠ్యంలో అదనంగా చేర్చి అసలు వాక్యాన్ని అవసరానికి మించి స్పష్టీకరించకుండా సూచిత కర్తను అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘విశ్రాంతి’ అనే పదాన్ని సందర్భంలోని ప్రధాన ధార్మిక భావంతో అనుసంధానం నిలిచేలా ఉంచాం; సూచిత కర్తను తెలుగు కర్తలోప నిర్మాణంతో సంరక్షించాం.
