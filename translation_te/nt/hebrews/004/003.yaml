id: HEB.4.3
reference: Hebrews 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: te
  text: 'ఎందుకంటే విశ్వసించిన మనం ఆ విశ్రాంతిలో ప్రవేశిస్తున్నాం. ఆయన చెప్పినట్లుగా:


    “నేను నా కోపంలో ప్రమాణం చేశాను:

    ‘వారు నా విశ్రాంతిలో ఎన్నటికీ ప్రవేశించరు.’”[a]


    అయినప్పటికీ, లోకపు పునాది వేయబడినప్పటి నుంచే ఆయన కార్యాలు పూర్తయ్యాయి.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో పదశః, “వారు నా విశ్రాంతిలో ప్రవేశిస్తే.” ఇది “వారు నా విశ్రాంతిలో తప్పకుండా ప్రవేశించరు” లేదా “ఎన్నటికీ ప్రవేశించరు” అనే అర్థమిచ్చే ప్రమాణ సూత్రం.
    reason: మూలంలోని షరతు రూపాన్ని, దాని నుడికారపరమైన బలమైన నిరాకరణ అర్థాన్ని రెండింటినీ తెలియజేయడం.
  - marker: b
    text: లేదా, “లోకపు పునాది వేయబడినప్పుడే ఆయన కార్యాలు పూర్తయ్యాయి.”
    reason: ἀπὸ καταβολῆς κόσμου మరియు జనేటివ్ అబ్సల్యూట్‌కు సాధ్యమైన సహజ తెలుగు కాలవ్యక్తీకరణను చూపడం.
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: ప్రవేశిస్తున్నాం
  rationale: వర్తమాన కాలంలోని క్రియను సహజమైన తెలుగు వర్తమాన రూపంలో ఇచ్చి, విశ్వాసులు ఇప్పుడు దేవుని విశ్రాంతిలో ప్రవేశిస్తున్నారనే భావాన్ని నిలిపింది; దాన్ని కేవలం భవిష్యత్తుకు పరిమితం చేయలేదు.
- source_word: κατάπαυσιν
  choice: ఆ విశ్రాంతి
  rationale: సందర్భంలో ముందే చర్చలో ఉన్న దేవుని నిర్దిష్ట విశ్రాంతిని సూచించేందుకు ‘ఆ’ వాడబడింది.
- source_word: οἱ πιστεύσαντες
  choice: విశ్వసించిన మనం
  rationale: అయోరిస్ట్ కృదంతంలోని ‘విశ్వసించిన’ భావాన్నీ, మొదటి పురుష బహువచనంలో రచయిత తనను చేర్చుకోవడాన్నీ కాపాడుతుంది.
- source_word: καθὼς εἴρηκεν
  choice: ఆయన చెప్పినట్లుగా
  rationale: పరిపూర్ణ కాలంలోని ఇప్పటికీ వర్తించే ఉక్తి భావం తెలుగులో సహజంగా సందర్భం ద్వారా వ్యక్తమవుతుంది.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: నా కోపంలో నేను ప్రమాణం చేసినట్లుగా
  rationale: ὀργήలోని గంభీరమైన న్యాయతీర్పు సంబంధ భావాన్ని ‘కోపం’ సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రమాణ వాక్య నిర్మాణాన్ని కూడా నిలుపుతుంది.
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: వారు నా విశ్రాంతిలో ఎన్నటికీ ప్రవేశించరు
  rationale: కీర్తన 95 నుండి వచ్చిన సెమిటిక్ ప్రమాణ సూత్రంలో εἰ + భవిష్యత్ క్రియ బలమైన నిరాకరణను సూచిస్తుంది. ప్రధాన పాఠ్యంలో దాని ఉద్దేశిత అర్థం ఇవ్వబడింది; పదశః రూపం పాదటిప్పణిలో ఉంచబడింది.
- source_word: καίτοι
  choice: అయితే
  rationale: ముందటి ప్రమాణ ఉక్తికీ సృష్టి కార్యాలు ఇప్పటికే పూర్తయ్యాయనే విషయానికీ మధ్యనున్న concessive సంబంధాన్ని సహజంగా సూచిస్తుంది.
- source_word: τῶν ἔργων ... γενηθέντων
  choice: ఆయన కార్యాలు ... పూర్తయి ఉన్నాయి
  rationale: కార్యాలు జరిగి పూర్తైన స్థితిని వ్యక్తం చేస్తుంది. ‘ఆయన’ అనేది సందర్భంలో దేవుని కార్యాలనే సూచిస్తున్నందున స్పష్టత కోసం చేర్చబడింది.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: లోకం స్థాపించబడినప్పటి నుంచి
  rationale: లోక సృష్టి/స్థాపన మొదలైన కాలాన్ని సూచించే గ్రీకు నుడికారాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కీర్తన 95 ప్రమాణ వాక్యపు బలం
  choice: ప్రధాన పాఠ్యంలో ‘వారు ... ఎన్నటికీ ప్రవేశించరు’ అనే బలమైన నిరాకరణ
  alternative: ‘వారు నా విశ్రాంతిలో ప్రవేశిస్తే’ అనే పదశః షరతు రూపం
  rationale: గ్రీకు పాఠ్యం హెబ్రీయ ప్రమాణ సూత్రాన్ని అనుసరిస్తుంది; సందర్భంలో అది నిజమైన షరతు కాదు, ప్రవేశం ఉండదనే గట్టి ప్రమాణం. పాఠకుణ్ణి తప్పుదోవ పట్టించకుండా భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, మూల నిర్మాణాన్ని పాదటిప్పణిలో తెలిపింది.
- issue: విశ్వాసులు విశ్రాంతిలో ప్రవేశించే కాలభావం
  choice: ‘ప్రవేశిస్తున్నాం’ అనే వర్తమాన రూపం
  alternative: ‘ప్రవేశిస్తాం’ అనే కేవలం భవిష్యత్ రూపం
  rationale: గ్రీకు వర్తమాన కాలం విశ్వాసుల ప్రస్తుత ప్రవేశాన్ని వ్యక్తం చేస్తుంది; అంతిమ నెరవేర్పును నిరాకరించకుండానే పాఠ్యంలోని ఇప్పటికే/ఇంకా కాదు అనే ఉద్రిక్తతను నిలుపుతుంది.
- issue: సృష్టి కార్యాలు పూర్తవడం మరియు విశ్రాంతి అందుబాటు
  choice: కార్యాలు లోక స్థాపన నుంచే పూర్తయి ఉన్నాయని చెప్పడం
  alternative: కార్యాలు లోకం స్థాపించబడినప్పుడే పూర్తయ్యాయని చెప్పడం
  rationale: ἀπό యొక్క ‘నుంచి’ భావాన్ని ప్రధాన పాఠ్యంలో కాపాడుతూ, పూర్తయిన కార్యాల కొనసాగుతున్న స్థితిని తెలియజేస్తుంది; కాలబిందువును బలపరిచే సహజ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘విశ్రాంతి,’ ‘ప్రమాణం,’ ‘కార్యాలు’ వంటి సందర్భపరంగా ముఖ్యమైన పదాలు స్థిరంగా ఉంచబడ్డాయి. కవితా ఉల్లేఖనం పంక్తులుగా అమర్చబడింది; మూలంలోని ప్రమాణ నుడికారాన్ని పాదటిప్పణితో పారదర్శకంగా చూపించబడింది.
