id: HEB.4.16
reference: Hebrews 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: te
  text: కాబట్టి, మనం ధైర్యంతో[a] కృపా సింహాసనం దగ్గరికి వెళ్లుదాం, తద్వారా కనికరం పొందడానికి, సరైన సమయంలో లభించే సహాయం[b] కోసం కృపను కనుగొనడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నమ్మకంతో.’ గ్రీకు పదం నిర్భయతతో పాటు స్వేచ్ఛగా, నమ్మకంగా సమీపించే భావాన్నీ తెలియజేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అవసర సమయంలో సహాయం కోసం.’ గ్రీకు మాటలు మరింత అక్షరార్థంగా తగిన సమయానికి లభించే సహాయాన్ని సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: దగ్గరికి వెళ్దాం
  rationale: వర్తమానకాల hortatory subjunctive భావాన్ని సహజమైన ఆధునిక తెలుగులో సమూహ ప్రోత్సాహంగా వ్యక్తపరుస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వాక్యాల్లో యేసు ప్రధాన యాజకత్వం గురించి చెప్పిన దానినుంచి వచ్చే తార్కిక నిర్ధారణను స్పష్టంగా చూపుతుంది.
- source_word: μετὰ παρρησίας
  choice: ధైర్యంతో
  rationale: παρρησίαలోని నిర్భయమైన, స్వేచ్ఛగల సమీపింపు భావాన్ని నిలుపుతుంది; ఇది కేవలం అంతర్గత నమ్మకానికి పరిమితం కాదు.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: కృపాసనం
  rationale: ‘కృప యొక్క సింహాసనం’ అనే రూపకాన్ని తెలుగులో సహజంగా, గౌరవప్రదంగా సంక్షిప్త సమాసంతో నిలుపుతుంది.
- source_word: ἵνα
  choice: పొందడానికీ … కనుగొనడానికీ
  rationale: గ్రీకు ఉద్దేశార్థక నిర్మాణాన్ని తెలుగులో సహజమైన ప్రయోజనార్థక క్రియారూపాలతో వ్యక్తపరుస్తుంది.
- source_word: λάβωμεν ἔλεος
  choice: కనికరం పొందడానికి
  rationale: λαμβάνω (‘పొందు’) మరియు ἔλεος (‘కనికరం’) అనే భావాలను నేరుగా, సహజంగా అందిస్తుంది.
- source_word: χάριν εὕρωμεν
  choice: కృపను కనుగొనడానికి
  rationale: మొదటి ఉపవాక్యంలోని ‘పొందు’కు భిన్నంగా εὕρωμενలోని ‘కనుగొను’ పదభేదాన్ని కాపాడుతూ χάριςను కీలక పదమైన ‘కృప’గా ఉంచుతుంది.
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: సరైన సమయంలో సహాయం కోసం
  rationale: εὔκαιρος సూచించే సమయోచితతను సహాయం లభించే సరైన సమయంగా సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని సింహాసనం దగ్గరికి వెళ్లడంలో παρρησία భావం
  choice: ధైర్యంతో
  alternative: నమ్మకంతో
  rationale: యేసు ప్రధాన యాజకత్వం వల్ల కలిగిన స్వేచ్ఛగల, నిర్భయమైన ప్రవేశాన్ని బలంగా నిలుపుతుంది; అయితే దీనిని అహంకారపూరిత సాహసంగా అర్థం చేసుకోకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: χάρις అనువాదం
  choice: కృప
  alternative: అనుగ్రహం
  rationale: హెబ్రీయులకు పత్రికలోని దైవిక దయ అనే వేదాంతపరమైన పదసంబంధాన్ని నిలుపుతూ, మూలంలోని χάριςకు సుపరిచితమైన సమానార్థాన్ని ఇస్తుంది.
- issue: τῷ θρόνῳ τῆς χάριτος లోని genitive సంబంధం
  choice: కృపాసనం
  alternative: కృపగల సింహాసనం
  rationale: genitiveను దాని నిజమైన విస్తృతితోనే ఉంచి, సింహాసనం కృపకు మూలమా లేక కృపచే లక్షణీకరించబడిందా అనే భావాన్ని అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ప్రోత్సాహక బహువచనం, కృపాసన రూపకం, ‘కనికరం పొందు/కృపను కనుగొను’ అనే క్రియాభేదం నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
