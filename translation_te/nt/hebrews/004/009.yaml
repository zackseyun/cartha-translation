translation:
  language: te
  text: కాబట్టి దేవుని ప్రజలకు విశ్రాంతిదిన విశ్రాంతి[a] ఇంకా మిగిలి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్రాంతిదిన ఆచరణ.” గ్రీకులోని σαββατισμός అనే పదం అరుదైనది; అది విశ్రాంతిదిన భావాన్ని స్పష్టంగా ప్రతిధ్వనింపజేస్తుంది. ఇక్కడ అది దేవుని ప్రజలకు ఇంకా మిగిలి ఉన్న, విశ్రాంతిదినాన్ని పోలిన విశ్రాంతిని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπολείπεται
  choice: ఇంకా మిగిలి ఉంది
  rationale: ఈ విశ్రాంతి దేవుని ప్రజలకు కొనసాగుతూ అందుబాటులో ఉందనే వర్తమాన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: σαββατισμός
  choice: విశ్రాంతిదినపు విశ్రాంతి
  rationale: అరుదైన ఈ గ్రీకు పదంలో ఉన్న సబ్బాతు/విశ్రాంతిదిన సంబంధాన్నీ, హెబ్రీయులు 3–4 అధ్యాయాల్లోని విశ్రాంతి భావాన్నీ రెండింటినీ కాపాడుతుంది.
- source_word: τῷ λαῷ
  choice: ప్రజలకు
  rationale: దత్తివిభక్తి ఇక్కడ ఎవరి ప్రయోజనం కోసం లేదా ఎవరికి ఆ విశ్రాంతి మిగిలి ఉందో సహజంగా తెలుపుతుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: దేవునితో చెందిన సంబంధం లేదా స్వామ్యాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: హెబ్రీయులు 4:9లో σαββατισμός అనే పదం అర్థం
  choice: దేవుని ప్రజలకు మిగిలి ఉన్న విశ్రాంతిదినాన్ని పోలిన విశ్రాంతి
  alternative: అక్షరార్థమైన విశ్రాంతిదిన ఆచరణ మాత్రమే; లేదా విశ్రాంతిదిన సంబంధం లేని పూర్తిగా రూపకాలంకారమైన ఆత్మీయ విశ్రాంతి
  rationale: ఈ పదం విశ్రాంతిదినాన్ని స్పష్టంగా ప్రతిధ్వనింపజేస్తుంది; పరిసర వాదన దేవుని విశ్రాంతి, ఏడవ రోజు, వాగ్దానం చేయబడిన విశ్రాంతిని కలుపుతుంది. ‘విశ్రాంతిదినపు విశ్రాంతి’ అనే రూపం ఈ ఉద్వేగాన్ని ఏ ఒక్క వివరణకూ పరిమితం చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ‘సబ్బాతు’ అనే లిప్యంతరీకరణకు బదులుగా సాధారణ పాఠకులకు అర్థమయ్యే ‘విశ్రాంతిదినం’ వాడబడింది; అయితే మూలంలోని ప్రత్యేక విశ్రాంతిదిన ప్రతిధ్వని ‘విశ్రాంతిదినపు విశ్రాంతి’ ద్వారా నిలుపబడింది.
