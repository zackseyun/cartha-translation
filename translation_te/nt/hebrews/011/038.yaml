source:
  edition: SBLGNT
  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: te
  text: —వారికి ఈ లోకం అర్హమైనది కాదు—వారు ఎడారుల్లో[a], కొండల్లో, గుహల్లో, భూమిలోని సందుల్లో[b] సంచరిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిర్జన ప్రదేశాల్లో.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘భూమి రంధ్రాల్లో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: వారికి
  rationale: ముందటి వచనంలో చెప్పబడిన విశ్వాసులను సూచించే సంబంధ సర్వనామం. ‘ఈ లోకం వారికి యోగ్యమైనది కాదు’ అనే సహజమైన తెలుగు నిర్మాణంలో గ్రీకు షష్ఠీ విభక్తి భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἄξιος
  choice: యోగ్యమైనది
  rationale: నైతిక విలువను సూచించే బలమైన అంచనాను నిలుపుతుంది; కేవలం సరిపోలిక లేదా అనుకూలత అనే భావానికి పరిమితం చేయదు.
- source_word: κόσμος
  choice: ఈ లోకం
  rationale: ఆ విశ్వాసులను తిరస్కరించిన మానవ లోకాన్ని లేదా సమాజాన్ని విస్తృతంగా సూచిస్తుంది.
- source_word: ἐπὶ ἐρημίαις
  choice: ఎడారి ప్రదేశాల్లో
  rationale: సంచరించిన స్థలాన్ని సూచించే భావాన్ని స్పష్టంగా, దృశ్యరూపంగా తెలియజేస్తుంది; ‘నిర్జన ప్రదేశాల్లో’ అనే అర్థం కూడా సాధ్యమని పాదసూచికలో ఉంచబడింది.
- source_word: πλανώμενοι
  choice: తిరుగుతూ ఉన్నారు
  rationale: స్థిర నివాసం లేకుండా, కష్టాల్లో ఒక చోటు నుంచి మరో చోటుకు సంచరించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὄρεσι
  choice: కొండల్లో
  rationale: ὄρος సూచించే కొండలు లేదా పర్వత ప్రాంతాలకు సాధారణ పాఠకులకు సులభమైన తెలుగు పదం.
- source_word: σπηλαίοις
  choice: గుహల్లో
  rationale: దాక్కునే సహజ గుహలను స్పష్టంగా సూచించే సాధారణ ఆధునిక పదం.
- source_word: ὀπαῖς τῆς γῆς
  choice: భూమిలోని సందుల్లో
  rationale: భూమిలో ఏర్పడిన రంధ్రాలు, పగుళ్లు లేదా తెరుచుకున్న ప్రదేశాలు అనే దృశ్యాన్ని సహజంగా తెలియజేస్తూ మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘ఈ లోకం వారికి యోగ్యమైనది కాదు’ అనే వాక్యంలోని విలువ నిర్ణయం
  choice: విశ్వాసుల విలువకు విరుద్ధంగా లోకంపై ఉన్న నైతిక తీర్పుగా అనువదించడం
  alternative: విశ్వాసులకు, లోకానికి మధ్య కేవలం అననుకూలతను తెలిపే తటస్థ వాక్యంగా అనువదించడం
  rationale: గ్రీకు వాక్యం కేవలం సామాజిక అననుకూలతను కాక బలమైన విలువ నిర్ణయాన్ని తెలియజేస్తుంది. దానిని అదనపు సిద్ధాంత వివరణ లేకుండా అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని మధ్యలో చొప్పించిన విలువ నిర్ణయాన్ని దీర్ఘ విరామ చిహ్నాలతో నిలిపాం; స్థలాల జాబితాలో గ్రీకు సమాంతర నిర్మాణాన్ని సహజమైన తెలుగు విభక్తులతో వ్యక్తం చేశాం.
