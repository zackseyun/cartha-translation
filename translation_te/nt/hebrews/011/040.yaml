source:
  edition: SBLGNT
  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: te
  text: దేవుడు మన కొరకు ఇంకా మేలైనదేదో ముందుగానే ఏర్పాటు చేశాడు కాబట్టి[a], వారు మనకు విడిగా పరిపూర్ణులుగా చేయబడకుండా ఉండాలని ఆయన ఉద్దేశించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు మన కొరకు ఇంకా మేలైనదేదో ముందుగానే చూశాడు.” గ్రీకు పదం ముందుగా చూడడం లేదా ముందుగానే ఏర్పాటు చేయడం అనే భావాలను సూచించగలదు; సందర్భం దేవుని ఏర్పాటు లేదా సంకల్పాన్ని బలపరుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు మనం లేకుండా పరిపూర్ణులుగా చేయబడకుండా ఉండాలని,” లేదా “మనకు విడిగా పూర్తికి తీసుకురాబడకుండా ఉండాలని.”
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: ముందుగానే ఏర్పాటు చేశాడు
  rationale: ఈ సందర్భంలో ఈ మధ్యమ ప్రయోగంలోని కృదంతం కేవలం ముందుగా చూడడాన్ని కాక, దేవుడు ముందుగానే చేసిన ఏర్పాటు లేదా సంకల్పాన్ని సూచిస్తుంది.
- source_word: κρεῖττόν τι
  choice: ఇంకా మేలైనదేదో
  rationale: హెబ్రీయులకు పత్రికలో κρείττων పునరావృతమయ్యే ముఖ్యమైన తులనాత్మక పదం; ‘మేలైనది’ ఆ భావాన్ని నిలుపుతుంది, τι లోని అనిర్దిష్టతను ‘ఏదో’ కాపాడుతుంది.
- source_word: περὶ ἡμῶν
  choice: మన కోసం
  rationale: προβλεψαμένου తో కలిసినప్పుడు περί ఇక్కడ మనలను దృష్టిలో ఉంచుకొని చేసిన హితకరమైన ఏర్పాటును సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἵνα μὴ
  choice: చేయబడకూడదనేది ఆయన ఉద్దేశం
  rationale: ἵνα μή లోని ఉద్దేశార్థక బలాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: χωρὶς ἡμῶν
  choice: మనకు వేరుగా
  rationale: వారి పరిపూర్ణత మనదానితో సంబంధం లేకుండా, విడిగా జరగదనే సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: τελειωθῶσιν
  choice: పరిపూర్ణులుగా చేయబడటం
  rationale: దైవిక కర్మను సూచించే కర్మణి రూపాన్ని, అలాగే పరిపూర్ణత మరియు పూర్తికి తీసుకురావడం అనే రెండు భావాల మధ్య ఉన్న ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని సహజమైన తెలుగు ప్రధాన ఉపవాక్యంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: హెబ్రీయులకు పత్రికలో τελειωθῶσιν యొక్క రక్షణ-చరిత్ర సంబంధమైన భావం
  choice: పరిపూర్ణులుగా చేయబడటం
  alternative: పూర్తికి తీసుకురాబడటం; సంపూర్ణతకు చేరడం
  rationale: ఈ పదం నైతిక పరిపూర్ణతకే గానీ, కేవలం కాలక్రమపు ముగింపుకే గానీ పరిమితం కాదు. ‘పరిపూర్ణులుగా చేయబడటం’ పూర్తి, నెరవేర్పు, పరిపూర్ణత అనే భావాల మధ్య ఉన్న ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మేలైనది’ ద్వారా హెబ్రీయులకు పత్రికలోని ప్రధాన తులనాత్మక పదబంధం నిలుపబడింది. ప్రధాన పాఠంలో కారణం మరియు ఉద్దేశం స్పష్టంగా ఉండేందుకు గ్రీకు కృదంత నిర్మాణాన్ని రెండు వాక్యాలుగా వ్యక్తం చేశాం; పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠంలో ఉన్నాయి.
