revisions:
- from: విశ్వాసం చేత అతడు పస్కాను, రక్తాన్ని చిలకరించే ఆచారాన్ని[a] పాటించాడు; తద్వారా మొదట పుట్టినవారిని నాశనం చేసేవాడు వారిని తాకకుండా ఉండాలని.
  to: విశ్వాసంతో అతడు పస్కా పండుగను, రక్తాన్ని పూసే కార్యాన్ని[a] ఆచరించాడు; నాశనకర్త వారి తొలిచూలురిని తాకకుండునట్లు చేశాడు.
  rationale: The revised wording corrects the syntax and meaning of the final clause by making the firstborn the object of the destroyer’s action and αὐτῶν the possessive ‘their.’ It also uses a more contextually precise main rendering for πρόσχυσις, preserving the traditional ‘sprinkling’ rendering in the footnote. No theological or denominational interpretation is added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:05:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies Moses as the contextual subject and retains the purposive force of ἵνα μή. However, its final clause does not represent the Greek syntax adequately: αὐτῶν is genitive with θίγῃ and refers to the possessors of τὰ πρωτότοκα, yielding ‘their firstborn,’ not a second accusative ‘them.’ πρόσχυσις more directly denotes the ritual application/pouring of blood; in the Passover setting ‘applying/putting on the blood’ is safer in the main text than ‘sprinkling.’'
  naturalness: ‘విశ్వాసంతో’ is the normal modern Telugu equivalent of ‘by faith.’ The existing ending, ‘మొదట పుట్టినవారిని నాశనం చేసేవాడు వారిని తాకకుండా ఉండాలని,’ is syntactically awkward and has two competing objects. The revision gives the purpose clause a clear, natural Telugu construction.
  terminology: ‘పస్కా పండుగ’ clearly conveys τὸ πάσχα without restricting it to the meal. ‘తొలిచూలురు’ is a natural, inclusive Telugu term for ‘firstborn.’ ‘నాశనకర్త’ renders the substantival participle without adding ‘angel.’
  issues:
  - severity: high
    issue: The final clause renders αὐτῶν as ‘వారిని’ after already making ‘మొదట పుట్టినవారిని’ the object of ‘తాకకుండా.’
    rationale: In Greek, θίγῃ governs αὐτῶν in the genitive (‘touch their firstborn’), while τὰ πρωτότοκα is the direct object. The draft is both syntactically unclear in Telugu and obscures the possessive relationship.
  - severity: medium
    issue: ‘రక్తాన్ని చిలకరించే ఆచారం’ is retained as the main rendering of πρόσχυσις.
    rationale: The term more directly refers to applying or pouring blood. In the Passover narrative, blood is placed on the lintel and doorposts; ‘పూయడం’ better represents that action. ‘చిలకరించడం’ may remain as a traditional lexical alternative in a footnote.
  - severity: low
    issue: ‘విశ్వాసం చేత’ is understandable but less idiomatic than ‘విశ్వాసంతో.’
    rationale: The latter is standard modern Telugu while preserving the instrumental sense and the recurring formula in Hebrews 11.
  revised_text: విశ్వాసంతో అతడు పస్కా పండుగను, రక్తాన్ని పూసే కార్యాన్ని[a] ఆచరించాడు; నాశనకర్త వారి తొలిచూలురిని తాకకుండునట్లు చేశాడు.
