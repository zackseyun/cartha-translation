source:
  edition: SBLGNT
  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: te
  text: విశ్వాసంతో అతడు పస్కా పండుగను, రక్తాన్ని పూసే కార్యాన్ని[a] ఆచరించాడు; నాశనకర్త వారి తొలిచూలురిని తాకకుండునట్లు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రక్తాన్ని చిలకరించే కార్యాన్ని.” గ్రీకు పదం ఆచారపూర్వకంగా రక్తాన్ని పోయడం లేదా పూయడాన్ని సూచిస్తుంది. “చిలకరించడం” సంప్రదాయ ఆరాధనాపరమైన అనువాదం; అయితే పస్కా సందర్భంలో రక్తాన్ని పూయడం మరింత నిర్దిష్టంగా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: విశ్వాసం చేత
  rationale: ఇది సాధనం లేదా మాధ్యమాన్ని సూచించే దత్తివిభక్తి ప్రయోగం. హెబ్రీయులకు 11 అంతటా పునరావృతమయ్యే సూత్రాన్ని నిలుపుతుంది.
- source_word: πεποίηκεν
  choice: పాటించాడు
  rationale: ποιέω యొక్క పరిపూర్ణ క్రియారూపం ఇక్కడ పస్కా ఆచారాన్ని నిర్వహించడాన్ని సూచిస్తుంది. తెలుగు సహజ వాడుకలో ‘ఆచారాన్ని పాటించాడు’ ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τὸ πάσχα
  choice: పస్కాను
  rationale: పస్కా పండుగ, భోజనం లేదా ఆచరణ మొత్తాన్ని సూచించగల విస్తృత పదంగా ఉంచబడింది; ‘భోజనం’ అని పరిమితం చేయలేదు.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: రక్తాన్ని చిలకరించే ఆచారాన్ని
  rationale: πρόσχυσις ఆచారపూర్వకంగా రక్తాన్ని ఉంచడం లేదా పూయడాన్ని సూచిస్తుంది. సంప్రదాయ ఆరాధనాపరమైన భావాన్ని ‘చిలకరించడం’ తెలియజేస్తుంది; పస్కా సందర్భానికి మరింత నిర్దిష్టమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: ἵνα μὴ
  choice: తద్వారా ... తాకకుండా ఉండాలని
  rationale: μήతో కూడిన ఉద్దేశార్థక ఉపవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో ఉద్దేశ భావం చెడకుండా అందిస్తుంది.
- source_word: ὁ ὀλοθρεύων
  choice: నాశనం చేసేవాడు
  rationale: ఇది నామవాచకంగా వాడిన వర్తమాన కృదంతం. గ్రీకులో లేని ‘దూత’ అనే గుర్తింపును చేర్చకుండా మూలంలోని అనిశ్చితిని నిలుపుతుంది.
- source_word: τὰ πρωτότοκα
  choice: మొదట పుట్టినవారిని
  rationale: నామవాచకంగా వాడిన నపుంసక బహువచన విశేషణం. లింగం లేదా వయస్సును అనవసరంగా నిర్దిష్టం చేయకుండా భావాన్ని అందిస్తుంది.
- source_word: θίγῃ
  choice: తాకకుండా
  rationale: θιγγάνω యొక్క ప్రత్యక్ష భావం ‘తాకడం.’ సందర్భంలో అది నాశనకరమైన స్పర్శ అయినప్పటికీ, ‘కొట్టడం’ లేదా ‘హాని చేయడం’ అని విస్తరించకుండా మూలపదాన్ని కాపాడుతుంది.
- source_word: αὐτῶν
  choice: వారిని
  rationale: సందర్భంలో మోషేతో సంబంధమున్న ఇశ్రాయేలీయులను సూచించే సర్వనామం. గ్రీకులో లేని స్పష్ట నామవాచకాన్ని చేర్చలేదు.
theological_decisions:
- issue: ‘పాటించాడు’ అనే క్రియకు అంతర్లీన కర్త ఎవరు?
  choice: మునుపటి సందర్భాన్ని కొనసాగిస్తూ ‘అతడు’ అని ఉంచడం; అది మోషేను సూచిస్తుంది.
  alternative: ‘మోషే’ అని పేరును స్పష్టంగా చేర్చడం.
  rationale: హెబ్రీయులకు 11:23–29 సందర్భం మోషే గురించి చెబుతుంది. అయితే ఈ వచనంలోని గ్రీకు పాఠంలో పేరు లేదు కాబట్టి సర్వనామమే నిలుపబడింది.
- issue: πίστις యొక్క అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: హెబ్రీయులకు 11లో ప్రధాన అంశం విశ్వాసం. ఇక్కడ ‘విశ్వసనీయత’ కంటే ‘విశ్వాసం’ సందర్భానికి, అధ్యాయమంతటా ఉన్న పునరావృత సూత్రానికి సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘నాశనం చేసేవాడు’ అని ఉంచి మూలంలో లేని ‘దూత’ను చేర్చలేదు. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోలుతుంది.
