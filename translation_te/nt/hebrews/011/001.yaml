  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: te
  text: విశ్వాసం అంటే ఆశించబడే వాటి నిశ్చయత[a], కనిపించని వాటి రుజువు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆధారం,’ ‘వాస్తవికత,’ లేదా ‘దృఢ నమ్మకం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సాక్ష్యం’ లేదా ‘దృఢ నమ్మకం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో దేవుని వాగ్దానాలపై ఉంచే నమ్మకాన్ని సూచిస్తుంది. ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజంగా ఉండే, మూలపదానికి విస్తృతంగా సరిపడే పదం.
- source_word: ἐλπιζομένων
  choice: మనం ఆశించేవాటి
  rationale: వర్తమాన కర్మణి కృదంతం ఇక్కడ నామవాచకార్థంగా వాడబడింది. తెలుగు వాక్యంలో కర్త అంతర్లీనంగా ఉండకుండా ‘మనం’ను చేర్చడం భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπόστασις
  choice: నిశ్చయత
  rationale: ఈ పదానికి ‘ఆధారం,’ ‘వాస్తవికత,’ ‘దృఢ నమ్మకం’ వంటి భావాలు ఉండగలవు. ఇక్కడ ‘నిశ్చయత’ విశ్వాసంలోని ధైర్యభరితమైన భరోసాను సహజ తెలుగులో తెలియజేస్తుంది; పదాన్ని తరువాతి తాత్త్విక పరిభాషకు పరిమితం చేయదు.
- source_word: πραγμάτων
  choice: వాటి
  rationale: πρᾶγμα అనే విస్తృత పదం విషయాలు లేదా వాస్తవాలను సూచించగలదు. తెలుగులో పునరుక్తి తగ్గిస్తూ రెండు సమాంతర భాగాలను అనుసంధానించడానికి ‘వాటి’ సహజంగా ఉంది.
- source_word: ἔλεγχος
  choice: రుజువు
  rationale: ఈ పదంలోని సాక్ష్యాధార లేదా నిరూపణ భావాన్ని ‘రుజువు’ స్పష్టంగా తెలియజేస్తుంది. అంతర్గత ‘దృఢ నమ్మకం’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: οὐ βλεπομένων
  choice: మనకు కనిపించనివాటి
  rationale: కనబడని వాస్తవాలను సూచించే వర్తమాన కర్మణి కృదంతాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ‘మనకు’ అనేది దృష్టి పరిమితిని స్పష్టం చేస్తుంది; అవి అసలు లేవనే భావాన్ని ఇవ్వదు.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్పమైన సందర్భ మార్పును సూచిస్తుంది; బలమైన వ్యతిరేకత లేదా కాలార్థం లేదు. తెలుగులో వాక్య ఆరంభంలో ‘ఇప్పుడు’ లేదా ‘అయితే’ చేర్చడం మూలంలో లేని బలాన్ని కలిగించవచ్చు.
theological_decisions:
- issue: హెబ్రీయులకు 11:1లో ὑπόστασις అర్థం
  choice: నిశ్చయత
  alternative: ఆధారం; వాస్తవికత; దృఢ నమ్మకం
  rationale: అధ్యాయం సందర్భంలో విశ్వాసం దేవుని వాగ్దానాల పట్ల కలిగించే స్థిరమైన భరోసా ప్రధానంగా కనిపిస్తుంది. అయినా మూలపదానికి వాస్తవికత లేదా ఆధారం అనే భావం కూడా ఉండగలదని పాదటిప్పణి ద్వారా నిలుపుకున్నాం.
- issue: πίστις యొక్క అర్థం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఇక్కడ పదం విశ్వాసి దేవునిపై ఉంచే నమ్మకాన్ని సూచిస్తుంది; ఎవరి విశ్వసనీయతను వర్ణించే జనిటివ్ నిర్మాణం లేదు. అందువల్ల ‘విశ్వాసం’ సందర్భానికి తగినది.
- issue: ἔλεγχος యొక్క వస్తునిష్ఠ లేదా వ్యక్తినిష్ఠ భావం
  choice: రుజువు
  alternative: సాక్ష్యం; దృఢ నమ్మకం
  rationale: ‘రుజువు’ సాక్ష్యాధార భావాన్ని ముందుకు తెస్తుంది. అయితే పదం ఆ సాక్ష్యం కలిగించే అంతర్గత దృఢ నమ్మకాన్ని కూడా సూచించవచ్చు; ఆ అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘విశ్వాసం అంటే’ అనే నిర్మాణం Ἔστιν δὲ πίστις యొక్క నిర్వచనాత్మక స్వభావాన్ని సహజంగా తెలియజేస్తుంది. δέకు ప్రత్యేక అనుసంధాన పదం చేర్చలేదు.
