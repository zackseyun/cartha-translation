- from: 'ఆయనతో ఇలా చెప్పబడింది: “ఇస్సాకులోనే నీ సంతానం పిలువబడుతుంది.”[a]'
  to: 'ఎవరితోనైతే ఇలా చెప్పబడిందో: “ఇస్సాకు ద్వారా నీ సంతానం పిలువబడుతుంది.”[a]'
  rationale: The revision replaces the potentially misleading “ఆయనతో” with a natural Telugu relative construction corresponding to πρὸς ὃν, removes unsupported explicit emphasis from “ఇస్సాకులోనే,” and renders the citation’s idiomatic lineal sense as “ఇస్సాకు ద్వారా.” The footnote now supplies a genuine more-literal alternative for Ἐν Ἰσαὰκ while retaining “పిలువబడుతుంది” for κληθήσεται.
