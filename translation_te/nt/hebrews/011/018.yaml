  text: to whom it was said[a], “In Isaac your offspring will be called,”
translation:
  language: te
  text: 'ఎవరితోనైతే ఇలా చెప్పబడిందో: “ఇస్సాకు ద్వారా నీ సంతానం పిలువబడుతుంది.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఇస్సాకులో నీ సంతానం పిలువబడుతుంది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὃν
  choice: ఆయనతో
  rationale: πρός + సంబంధ సర్వనామం ఇక్కడ ముందటి సందర్భంలోని అబ్రాహామును ఉద్దేశించి పలికిన మాటను పరిచయం చేస్తుంది; ‘ఆయనతో’ సహజమైన తెలుగు ప్రయోగం.
- source_word: ἐλαλήθη
  choice: చెప్పబడింది
  rationale: λαλέω యొక్క భూతకాల కర్మణి రూపాన్ని స్పష్టమైన కర్తను చేర్చకుండా కర్మణి ప్రయోగంగానే నిలుపుతుంది.
- source_word: ὅτι
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష ఉల్లేఖనంలోని విషయాన్ని సహజమైన తెలుగులో పరిచయం చేస్తుంది.
- source_word: Ἐν Ἰσαὰκ
  choice: ఇస్సాకులోనే
  rationale: ἐν యొక్క రూపాన్ని ‘లో’తో నిలుపుతూ, వాగ్దాన సంతానం ఇస్సాకుతో సంబంధించి గుర్తించబడుతుందనే సందర్భార్థాన్ని ‘నే’ స్పష్టం చేస్తుంది; ‘ఇస్సాకు ద్వారా’ అనే సాధనార్థాన్ని అనవసరంగా ఖరారు చేయదు.
- source_word: κληθήσεταί
  choice: పిలువబడుతుంది
  rationale: καλέω యొక్క భవిష్యత్ కర్మణి రూపానికీ, పిలవడం/పేరు పెట్టడం/గుర్తించడం మధ్య ఉన్న భావ విస్తృతికీ దగ్గరగా ఉంటుంది.
- source_word: σοι
  choice: నీ
  rationale: దత్తి విభక్తి ఇక్కడ స్వామ్యార్థంలో పనిచేస్తుంది; తెలుగులో ‘నీ సంతానం’ సహజం.
- source_word: σπέρμα
  choice: సంతానం
  rationale: సమూహార్థక ఏకవచన భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘విత్తనం’ ఈ సందర్భంలో అసహజం, ‘సంతతివారు’ సంఖ్యా సూక్ష్మతను కోల్పోతుంది.
theological_decisions:
- issue: ఇస్సాకు ద్వారా వాగ్దాన వంశం గుర్తించబడటాన్ని తెలిపే ఆదికాండము ఉల్లేఖనం
  choice: ఇస్సాకులోనే నీ సంతానం పిలువబడుతుంది
  alternative: ఇస్సాకు ద్వారా నీ సంతానం లెక్కించబడుతుంది
  rationale: గ్రీకు ἐν మరియు κληθήσεται పదరూపాలకు దగ్గరగా ఉండి, ‘పిలువబడుతుంది’లోని పేరు పెట్టడం/గుర్తించడం అనే ఉద్దేశపూర్వక సందిగ్ధతను కాపాడుతుంది; వంశపరమైన భావాన్ని పూర్తిగా వివరణాత్మకంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని కర్మణి నిర్మాణం మరియు ఉల్లేఖనంలోని భావసాంద్రత నిలుపబడ్డాయి.
