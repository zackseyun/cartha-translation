source:
  edition: SBLGNT
  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: te
  text: వారు రాళ్లతో కొట్టబడ్డారు, రంపంతో రెండుగా కోయబడ్డారు, ఖడ్గవధకు గురై చనిపోయారు[a]; గొర్రె చర్మాలు, మేక చర్మాలు ధరించి తిరిగారు; లేమితో బాధపడుతూ, పీడింపబడుతూ, దుర్వ్యవహారానికి గురవుతూ ఉన్నారు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఖడ్గంతో చనిపోయారు.” గ్రీకు పదబంధంలో “వధ” (φόνῳ) అనే పదం కూడా ఉంది; అది ఈ మరణం హింసాత్మకమైనదని మరింత బలంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: రాళ్లతో కొట్టబడ్డారు
  rationale: λιθάζω అనే క్రియకు నేరమైన భావం ‘రాళ్లతో కొట్టు/రాళ్లు రువ్వు.’ మూలంలోని కర్మణి రూపాన్ని నిలుపుతూ, వారు తప్పక మరణించారని అదనంగా చెప్పకుండా అనువదించబడింది.
- source_word: ἐπρίσθησαν
  choice: రంపంతో రెండుగా కోయబడ్డారు
  rationale: πρίζω అంటే రంపంతో కోయడం. హతసాక్షుల బాధల జాబితాలో ఉద్దేశించిన ‘రెండుగా కోయడం’ అనే భావాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: ఖడ్గపు వధలో చనిపోయారు
  rationale: ἀπέθανον అనే ‘చనిపోయారు’ రూపాన్ని నిలుపుతూ, φόνοςలోని వధ/హింసాత్మక హత్య భావాన్ని కూడా ప్రధాన పాఠ్యంలో కాపాడుతుంది. సాధారణమైన ‘ఖడ్గంతో చనిపోయారు’ అనే అనువాదం పాదసూచికలో ఇవ్వబడింది.
- source_word: περιῆλθον
  choice: తిరిగారు
  rationale: ఇక్కడ περιέρχομαι ఒక చోటు నుంచి మరొక చోటుకు తిరుగుతూ జీవించడాన్ని సూచిస్తుంది. ‘తిరిగారు’ సంక్షిప్తమైన, సహజమైన తెలుగు.
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: గొర్రె చర్మాలు, మేక చర్మాలు ధరించి
  rationale: μηλωτή గొర్రె చర్మంతో చేసిన వస్త్రాన్ని, αἴγεια δέρματα మేక చర్మాలను సూచిస్తాయి. తెలుగులో ‘చర్మాల్లో’ కంటే ‘చర్మాలు ధరించి’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὑστερούμενοι
  choice: లేమిలో ఉంటూ
  rationale: అవసరమైనవి లేక కొరతలో ఉండే స్థితిని సూచిస్తుంది. ‘లేమిలో’ అనే పదం తీవ్రమైన కొరతను గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: θλιβόμενοι
  choice: పీడింపబడుతూ
  rationale: θλίβω యొక్క కర్మణి వర్తమాన అసమాపక రూపం ఒత్తిడికి, బాధకు, పీడకు గురికావడాన్ని సూచిస్తుంది; ‘పీడింపబడుతూ’ ఆ కొనసాగుతున్న అనుభవాన్ని నిలుపుతుంది.
- source_word: κακουχούμενοι
  choice: దుర్వ్యవహారానికి గురవుతూ
  rationale: κακουχέομαι అంటే చెడుగా చూడబడటం లేదా దుర్వ్యవహారానికి గురికావడం. ముందున్న ‘పీడింపబడుతూ’తో అనవసర పునరుక్తి లేకుండా ప్రత్యేక భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐν φόνῳ μαχαίρηςలోని హింసాత్మక వధ భావాన్ని ఎంత స్పష్టంగా చూపాలి
  choice: ప్రధాన పాఠ్యంలో ‘ఖడ్గపు వధలో చనిపోయారు’ అని ఉంచడం
  alternative: ఖడ్గంతో చనిపోయారు
  rationale: φόνος కేవలం సాధనాన్ని కాకుండా వధ లేదా హింసాత్మక హత్యను కూడా సూచిస్తుంది. ప్రధాన పాఠ్యం ఆ బలాన్ని నిలుపుతుంది; మరింత సహజమైన సంక్షిప్త పఠనం పాదసూచికలో ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. వరుస కర్మణి క్రియలు మరియు కొనసాగుతున్న బాధలను తెలిపే అసమాపక రూపాలు మూలంలోని జాబితా లయను కాపాడుతాయి. చివరి దీర్ఘ విరామచిహ్నం వాక్యం తదుపరి వచనంలో కొనసాగుతుందనే నిర్మాణాన్ని నిలుపుతుంది.
