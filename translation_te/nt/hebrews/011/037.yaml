review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the sequence of the Greek and preserves the force of ἐπρίσθησαν, the skins, and the three concluding participles. However, “ఖడ్గపు వధలో చనిపోయారు” is not idiomatic Telugu and obscures the construction ἐν φόνῳ μαχαίρης ἀπέθανον. “ఖడ్గవధకు గురై చనిపోయారు” naturally conveys death through a sword-killing while retaining the explicit verb ‘died.’
  naturalness: Most of the wording is clear modern standard Telugu. Recasting the final participial series as coordinated participial phrases improves its rhythm and avoids the slightly heavy “లేమిలో ఉంటూ ... ఉన్నారు” construction. “ఖడ్గవధ” is a more natural compact expression than “ఖడ్గపు వధలో.”
  terminology: “రంపంతో రెండుగా కోయబడ్డారు,” “గొర్రె చర్మాలు, మేక చర్మాలు ధరించి,” and “దుర్వ్యవహారానికి గురవుతూ” are suitable. “ఖడ్గవధ” appropriately represents the violent-killing nuance of φόνος without importing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: The phrase “ఖడ్గపు వధలో చనిపోయారు” is unnatural and syntactically opaque in Telugu.
    rationale: It is a literalized genitive construction that does not clearly communicate that they died as victims of sword-killing. The Greek phrase includes both violent killing (φόνῳ) and ‘they died’ (ἀπέθανον), which can be expressed naturally as “ఖడ్గవధకు గురై చనిపోయారు.”
  - severity: low
    issue: The concluding participial chain is more cumbersome than necessary.
    rationale: “లేమిలో ఉంటూ, పీడింపబడుతూ, దుర్వ్యవహారానికి గురవుతూ ఉన్నారు” is comprehensible, but “లేమితో బాధపడుతూ, పీడింపబడుతూ, దుర్వ్యవహారానికి గురవుతూ” better reflects the compact descriptive sequence and reads more smoothly.
  revised_text: వారు రాళ్లతో కొట్టబడ్డారు, రంపంతో రెండుగా కోయబడ్డారు, ఖడ్గవధకు గురై చనిపోయారు[a]; గొర్రె చర్మాలు, మేక చర్మాలు ధరించి తిరిగారు; లేమితో బాధపడుతూ, పీడింపబడుతూ, దుర్వ్యవహారానికి గురవుతూ ఉన్నారు—
  revised_footnotes:
