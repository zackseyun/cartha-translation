id: HEB.11.12
reference: Hebrews 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: te
  text: అందుచేత, ఒక్క మనిషి నుండి[a]—అతడూ మృతప్రాయుడై ఉండగా—ఆకాశంలోని నక్షత్రాల సంఖ్యంతగా, సముద్రతీరాన ఉన్న లెక్కకు అందని ఇసుకంతగా అసంఖ్యాకమైన సంతానం పుట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఒక్కని నుండి.” ఇక్కడ సూచించబడినవాడు అబ్రాహాము.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: అందుచేత
  rationale: ముందటి వచనంలోని విశ్వాసం మరియు వాగ్దాన నెరవేర్పు నుండి వచ్చే ఫలితాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἀφ’ ἑνὸς
  choice: ఒక్క మనిషి నుండి[a]
  rationale: ἑνός పుంలింగంలో ఉంది; సందర్భంలో అబ్రాహామును సూచిస్తుంది. తెలుగులో సూచిత వ్యక్తిని స్పష్టంచేస్తూనే, మూలంలోని సంక్షిప్తతను పాదసూచికలో భద్రపరుస్తుంది.
- source_word: ἐγεννήθησαν
  choice: సంతతి పుట్టింది
  rationale: గ్రీకులో బహువచన కర్తలు సూచితంగా ఉన్నారు; తెలుగులో ‘సంతతి పుట్టింది’ అనేది అనేకమంది వారసులు ఉద్భవించారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: అతడూ మృతప్రాయుడై ఉండగా
  rationale: ఇది అక్షరార్థ మరణాన్ని కాక, అబ్రాహాము వృద్ధాప్యం వల్ల సంతానోత్పత్తి సామర్థ్యం దాదాపు లేకపోవడాన్ని సూచించే బలమైన రూపకం.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: ఆకాశంలోని నక్షత్రాలంత విస్తారమైన
  rationale: τῷ πλήθει లోని సంఖ్యాపరమైన విస్తారతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: సముద్రతీరంలోని లెక్కించలేని ఇసుకంత అసంఖ్యాకమైన
  rationale: χείλος యొక్క అక్షరార్థమైన ‘అంచు/పెదవి’ని తెలుగు సముద్రతీర ప్రయోగంగా అందిస్తూ, ἀναρίθμητος లోని లెక్కకు అందనితనాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘ఒక్కని నుండి’ అనే మాట యొక్క సూచిత వ్యక్తి
  choice: ప్రధాన పాఠ్యంలో ‘ఒక్క మనిషి’ అని ఇచ్చి అబ్రాహామును సూచించడం
  alternative: ‘ఒక్కని నుండి’ అని మాత్రమే ఉంచడం
  rationale: గ్రీకు పుంలింగ రూపం మరియు సమీప సందర్భం అబ్రాహామునే సూచిస్తున్నాయి. పేరు చేర్చకుండా లింగం, వ్యక్తి రెండింటినీ స్పష్టం చేస్తుంది.
- issue: νενεκρωμένου యొక్క భావం
  choice: అబ్రాహాము వృద్ధాప్యంతో సంతానోత్పత్తికి సంబంధించి మృతప్రాయుడై ఉండడం
  alternative: అతడు అక్షరార్థంగా చనిపోయి ఉండడం లేదా పూర్తిగా శారీరకంగా మృతుడవడం
  rationale: సందర్భం వృద్ధాప్యంలో వాగ్దాన సంతానం కలగడం గురించి ఉంది. ‘మృతప్రాయుడు’ అనే రూపకం అద్భుత స్వభావాన్ని, మూలంలోని బలమైన భాషను రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. వాగ్దాన భాషలోని ఆకాశ నక్షత్రాలు, సముద్రతీరపు ఇసుక అనే చిత్రాలను నిలుపుకుంది.
