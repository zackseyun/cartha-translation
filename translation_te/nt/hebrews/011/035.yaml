revisions:
- from: స్త్రీలు తమ మృతులను పునరుత్థానం ద్వారా తిరిగి పొందారు; అయితే మరికొందరు విడుదలను అంగీకరించకుండా తీవ్రంగా హింసించబడ్డారు[a], తద్వారా వారు మరింత శ్రేష్ఠమైన పునరుత్థానాన్ని పొందాలని ఆశించారు[b].
  to: స్త్రీలు పునరుత్థానం ద్వారా తమ మృతులను తిరిగి పొందారు; అయితే మరికొందరు మరింత శ్రేష్ఠమైన పునరుత్థానాన్ని పొందేందుకు విడుదలను అంగీకరించకుండా చిత్రహింసలకు గురయ్యారు.[a][b]
