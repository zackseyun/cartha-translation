source:
  edition: SBLGNT
  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: te
  text: స్త్రీలు పునరుత్థానం ద్వారా తమ మృతులను తిరిగి పొందారు; అయితే మరికొందరు మరింత శ్రేష్ఠమైన పునరుత్థానాన్ని పొందేందుకు విడుదలను అంగీకరించకుండా చిత్రహింసలకు గురయ్యారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చిత్రహింసలకు గురయ్యారు” అని అనువదించిన గ్రీకు క్రియ తీవ్రమైన శారీరక హింసను సూచిస్తుంది; అది బహుశా బల్ల లేదా డోలు వంటి పరికరంపై కొట్టడాన్ని సూచించవచ్చు. అయితే ఖచ్చితమైన పద్ధతి స్పష్టంగా లేదు.
    reason: cultural_note
  - marker: b
    text: “మరింత శ్రేష్ఠమైన పునరుత్థానం” అనేది ఈ వచనం మొదటి భాగంలో చెప్పినట్లుగా మృతులు సాధారణ మర్త్యజీవితానికి తిరిగి రావడానికంటే శ్రేష్ఠమైన, మరణానికి ఆవల ఉన్న పునరుత్థాన నిరీక్షణను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: తిరిగి పొందారు
  rationale: మృతులు పునరుత్థానం ద్వారా స్త్రీలకు మళ్లీ సజీవులుగా లభించిన భావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: γυναῖκες
  choice: స్త్రీలు
  rationale: ఇక్కడ ప్రత్యేకంగా భార్యలు అని కాక, తమ మృతులను తిరిగి పొందిన స్త్రీలను సాధారణంగా సూచిస్తుంది.
- source_word: ἐξ ἀναστάσεως
  choice: పునరుత్థానం ద్వారా
  rationale: ἐξ తెలిపే మూలం లేదా సాధన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: తమ మృతులను
  rationale: వారికి చెందిన మరణించిన ప్రియులను సూచించే సంక్షిప్తమైన, సహజమైన ప్రయోగం.
- source_word: ἄλλοι δὲ
  choice: అయితే మరికొందరు
  rationale: ముందు చెప్పిన విడుదలకు భిన్నంగా, ఈ లోకంలో విడుదల పొందని విశ్వాసుల వైపు ఉన్న వ్యత్యాసాన్ని చూపిస్తుంది.
- source_word: ἐτυμπανίσθησαν
  choice: తీవ్రంగా హింసించబడ్డారు
  rationale: ఈ క్రియ తీవ్రమైన శారీరక చిత్రహింసను సూచిస్తుంది; ఖచ్చితమైన పద్ధతి అనిశ్చితమైనందున దానిని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: οὐ προσδεξάμενοι
  choice: అంగీకరించకుండా
  rationale: తమకు ఇవ్వబడిన విడుదల అవకాశాన్ని వారు నిరాకరించారనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὴν ἀπολύτρωσιν
  choice: విడుదలను
  rationale: ఈ సందర్భంలో రక్షణశాస్త్ర సంబంధమైన విమోచనకన్నా హింస లేదా మరణం నుంచి తప్పించుకోవడమే ప్రధాన భావం.
- source_word: ἵνα
  choice: తద్వారా
  rationale: విడుదలను నిరాకరించిన ఉద్దేశాన్ని ఫలితాభిముఖంగా సహజమైన తెలుగులో కలుపుతుంది.
- source_word: κρείττονος ἀναστάσεως
  choice: మరింత శ్రేష్ఠమైన పునరుత్థానాన్ని
  rationale: ముందటి తాత్కాలిక జీవపునరుద్ధరణతో పోల్చినప్పుడు κρείττων లోని ‘మెరుగైన’ అనే తులనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: τύχωσιν
  choice: పొందాలని ఆశించారు
  rationale: τυγχάνω లోని పొందడం లేదా చేరుకోవడం అనే భావాన్ని తెలుగులో ఉద్దేశంతో సహజంగా వ్యక్తం చేస్తుంది; ‘ఆశించారు’ అనేది ἵνα నిర్మాణంలోని లక్ష్యాభిముఖతను తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో ἀπολύτρωσιν అర్థం
  choice: హింస లేదా మరణం నుంచి తాత్కాలిక విడుదల
  alternative: విస్తృతమైన రక్షణశాస్త్ర భావంలో విమోచన
  rationale: తక్షణ సందర్భం విశ్వాసాన్ని విడిచిపెట్టి తప్పించుకునే అవకాశాన్ని నిరాకరించిన హింసితుల గురించి మాట్లాడుతుంది; ‘విడుదల’ అనడం సందర్భార్థాన్ని కాపాడి, అవసరం లేని సిద్ధాంతార్థాన్ని రుద్దదు.
- issue: ‘మరింత శ్రేష్ఠమైన పునరుత్థానం’ భావం
  choice: మర్త్యజీవితానికి తాత్కాలిక పునరుద్ధరణకన్నా శ్రేష్ఠమైన, మరణానంతర పునరుత్థాన నిరీక్షణ
  alternative: ముందటి ఉదాహరణతో స్పష్టమైన వ్యత్యాసం లేని, కేవలం మరింత అనుకూలమైన పునరుత్థానం
  rationale: వచనపు మొదటి భాగంలో మృతులు ప్రస్తుత మర్త్యజీవితానికి తిరిగి రావడం ఉంది; రెండవ భాగంలో విశ్వాసులు మరణాన్ని అంగీకరించి మరింత శ్రేష్ఠమైన పునరుత్థానాన్ని లక్ష్యంగా పెట్టుకున్నారు. అనువాదం దాని స్వభావాన్ని అతిగా నిర్వచించకుండా ఈ వ్యత్యాసాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘తమ మృతులు,’ ‘విడుదల,’ ‘పునరుత్థానం’ వంటి పదాలు మూలంలోని సంక్షిప్తతను, వ్యత్యాసాన్ని నిలుపుతాయి. చిత్రహింస పద్ధతిని ప్రధాన వచనంలో నిర్దిష్టం చేయకుండా పాదటిప్పణిలో వివరించాం.
