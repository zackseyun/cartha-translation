  verdict: revise
  source_fidelity: The draft accurately conveys the restoration of the dead, the contrast with others who refused an offered release, and the superior resurrection. However, “పొందాలని ఆశించారు” adds an explicit notion of hoping that is not expressed by τύχωσιν; the Greek states the intended result, ‘so that/in order that they might obtain.’
  naturalness: The Telugu is generally modern and clear. Recasting the final clause as a purpose phrase removes the added nuance and produces a more direct, idiomatic sentence.
  terminology: “పునరుత్థానం,” “విడుదల,” and “చిత్రహింసలకు గురయ్యారు” are suitable modern-standard Telugu equivalents. “చిత్రహింసలకు గురయ్యారు” conveys ἐτυμπανίσθησαν without claiming certainty about the precise historical instrument or method.
  issues:
