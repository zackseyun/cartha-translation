source:
  edition: SBLGNT
  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: te
  text: విశ్వాసంతో యాకోబు చనిపోతున్నప్పుడు, యోసేపు కుమారులలో ప్రతి ఒక్కరినీ ఆశీర్వదించాడు, తన చేతికర్ర[a] కొనపై ఆనుకుని ఆరాధించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆదికాండం 47:31లోని హీబ్రూ పాఠాన్ని అనుసరిస్తే, “తన మంచం తలవైపు వంగి ఆరాధించాడు.” అయితే ఇక్కడి గ్రీకు పాఠంలో “చేతికర్ర” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, “తన చేతికర్ర కొనవైపు ఆరాధించాడు.” ఈ పదబంధం బహుశా యాకోబు ఆరాధన లక్ష్యాన్ని కాక, అతని శరీర భంగిమను వివరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: విశ్వాసంతో
  rationale: హెబ్రీయులు 11లో πίστιςకు సహజమైన అర్థం ‘విశ్వాసం.’ విభక్తి రూపం ఇక్కడ యాకోబు చేసిన కార్యాలు విశ్వాసం ద్వారా లేదా విశ్వాసంతో జరిగాయని సూచిస్తుంది.
- source_word: ἀποθνῄσκων
  choice: చనిపోతున్నప్పుడు
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియలు జరిగిన కాలంతో సమకాలికంగా, మరణం సమీపించిన స్థితిని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ కొనసాగుతున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: యోసేపు కుమారుల్లో ప్రతి ఒక్కరినీ
  rationale: ἕκαστονతో కూడిన విభాగార్థక షష్ఠీ విభక్తి, యోసేపు కుమారులు ఇద్దరిలో ఒక్కొక్కరినీ ప్రత్యేకంగా ఆశీర్వదించాడనే పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: εὐλόγησεν
  choice: ఆశీర్వదించాడు
  rationale: ఆదికాండంలోని నేపథ్యానికి, పితృసంబంధ ఆశీర్వాద ప్రాముఖ్యతకు సరిపోయే సహజమైన ప్రామాణిక అనువాదం.
- source_word: προσεκύνησεν
  choice: ఆరాధించాడు
  rationale: ఇక్కడ προσκυνέω కేవలం శారీరకంగా వంగడాన్ని కాక దేవునిపట్ల ఆరాధనను సూచిస్తుంది. అయితే మూలంలో కర్మ స్పష్టంగా లేకపోవడం వల్ల ప్రధాన పాఠంలో ‘దేవుణ్ణి’ అని చేర్చలేదు.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: తన చేతికర్ర కొనపై ఆనుకొని
  rationale: ఈ కఠినమైన గ్రీకు పదబంధానికి సందర్భానుకూలమైన భంగిమార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; చేతికర్రనే ఆరాధనా వస్తువుగా భావించే అపార్థాన్ని తగ్గిస్తుంది. ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: చివరి పదబంధంలో యాకోబు ఆరాధనకు చేతికర్రతో ఉన్న సంబంధం
  choice: యాకోబు తన చేతికర్ర కొనపై ఆనుకొని ఆరాధించాడు.
  alternative: యాకోబు తన చేతికర్ర కొనవైపు ఆరాధించాడు; లేదా ఆదికాండం 47:31 హీబ్రూ పాఠం ప్రకారం తన మంచం తలవైపు వంగి ఆరాధించాడు.
  rationale: హెబ్రీయుల గ్రీకు పాఠంలో ‘చేతికర్ర’ ఉంది; ఇది సెప్టువజింటు రూపాన్ని ప్రతిబింబిస్తుంది. భంగిమను సూచించే అర్థం సందర్భంలో సంభావ్యమైనది, కానీ గ్రీకు విభక్తి పదబంధంలోని నిజమైన సందిగ్ధతను ప్రత్యామ్నాయ పాదసూచికలో నిలిపాం. ఆదికాండం హీబ్రూ పాఠంలోని ‘మంచం’ రూపాన్ని కూడా పాఠాంతర సంబంధం కారణంగా పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకులోని రెండు సమన్విత ప్రధాన క్రియలను తెలుగులో రెండు వాక్యాలుగా విభజించి, ‘ఆ తర్వాత’తో సహజమైన ప్రవాహం కల్పించాం; ఘటనల క్రమాన్ని మార్చలేదు. ‘చేతికర్ర’ సాధారణ పాఠకునికి స్పష్టంగా ఉండగా, ‘కొనపై’ ἄκρον భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
