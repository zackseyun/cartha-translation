source:
  edition: SBLGNT
  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: te
  text: ఈజిప్టు నిధులకంటే మెస్సీయ నిందనే గొప్ప సంపదగా అతడు పరిగణించాడు[a][b]. ఎందుకంటే, అతడు ప్రతిఫలం వైపే చూస్తూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మెస్సీయ నింద’కు బదులుగా ‘క్రీస్తు నింద’ అని కూడా అనువదించవచ్చు. గ్రీకు Χριστοῦ ఒక బిరుదుగా ఉన్నందున ప్రధాన పాఠంలో ‘మెస్సీయ’ అని వాడబడింది.
    reason: alternative_reading
  - marker: b
    text: ‘మెస్సీయ నింద’ అనే పదబంధం మెస్సీయ నిమిత్తం భరించిన నిందను, దేవుని అభిషిక్తునితో పంచుకున్న నిందను, లేదా మెస్సీయలో నెరవేరినదిగా హెబ్రీయులు చూపే నిందను సూచించవచ్చు. గ్రీకు పదబంధాన్ని ఒక్క అర్థానికి పరిమితం చేయకుండా అనువాదంలో అలాగే ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: గొప్ప సంపదగా
  rationale: తులనాత్మక భావాన్ని తరువాతి ‘ఈజిప్టు సంపదలకంటే’తో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡγησάμενος
  choice: ఎంచాడు
  rationale: ఇక్కడ ἡγέομαι విలువను తూచి దేనినో శ్రేష్ఠంగా పరిగణించే భావాన్ని ఇస్తుంది; ‘ఎంచాడు’ సందర్భంలోని మూల్యాంకనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: ఈజిప్టు సంపదలకంటే
  rationale: గ్రీకు తులనాత్మక నిర్మాణాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలుగులో నిలుపుతుంది.
- source_word: τὸν ὀνειδισμὸν
  choice: నిందను
  rationale: ప్రజల ఎదుట కలిగే అవమానం, దూషణ అనే భావాలను మోయగల ప్రస్తుత ప్రామాణిక తెలుగు పదం.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; అందువల్ల ‘మెస్సీయ’ అని అనువదించబడింది. సంబంధాన్ని సూచించే షష్ఠీ విభక్తి ఉద్దేశపూర్వకంగా వ్యాఖ్యానించకుండా నిలుపబడింది.
- source_word: ἀπέβλεπεν
  choice: దృష్టి నిలిపాడు
  rationale: అసంపూర్ణ కాలరూపంలోని నిరంతర దృష్టి లేదా స్థిరమైన అభిముఖతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μισθαποδοσίαν
  choice: ప్రతిఫలం
  rationale: ప్రత్యుపకారం లేదా తగిన బహుమతి అనే భావాన్ని సందర్భానుకూలంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మోషేకు సంబంధించి ‘మెస్సీయ నింద’ అనే పదబంధం అర్థం
  choice: ‘మెస్సీయ నింద’ అనే షష్ఠీ పదబంధాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపడం
  alternative: మెస్సీయ నిమిత్తం భరించిన నింద; దేవుని అభిషిక్తునితో పంచుకున్న నింద; తరువాత మెస్సీయలో నెరవేరిన నింద
  rationale: గ్రీకు షష్ఠీ సంబంధం వీటిలో ఒక్క అర్థానికే పరిమితం చేయదు. అనువాదం ఆ క్రీస్తుసంబంధమైన ఉద్వేగాన్ని, నిజమైన సందిగ్ధతను నిలుపుతుంది.
- issue: Χριστοῦను బిరుదుగా లేదా పేరులా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός అభిషిక్తుడనే బిరుదు భావంతో ఉంది; ‘మెస్సీయ’ ఆ బిరుదు స్వభావాన్ని స్పష్టంగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణం. ‘నింద’ మరియు ‘ప్రతిఫలం’ వంటి విస్తృతంగా గ్రాహ్యమైన బైబిలీయ పదాలు వాడబడ్డాయి. మూలంలోని రెండు భాగాల తార్కిక సంబంధాన్ని ‘ఎందుకంటే’తో స్పష్టంగా ఉంచింది.
