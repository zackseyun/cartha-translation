revisions:
- from: పాపం వల్ల కలిగే తాత్కాలిక ఆనందాన్ని అనుభవించడం కంటే, దేవుని ప్రజలతో కలిసి హింసను అనుభవించడాన్నే అతడు ఎంచుకున్నాడు.[a]
  to: పాపసంబంధమైన తాత్కాలిక ఆనందాన్ని అనుభవించడం కంటే, దేవుని ప్రజలతో కలిసి దుర్వ్యవహారాన్ని అనుభవించడాన్నే అతడు ఎంచుకున్నాడు.[a]
  rationale: The revision avoids narrowing the shared ill-treatment to violence and removes a causal interpretation from the genitive ‘of sin.’ It retains the comparative force, Moses as the carried-forward subject from the preceding verse, the temporary character of the enjoyment, and the footnote’s lexical-alternative function.
