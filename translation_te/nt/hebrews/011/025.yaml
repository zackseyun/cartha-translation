  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: te
  text: పాపసంబంధమైన తాత్కాలిక ఆనందాన్ని అనుభవించడం కంటే, దేవుని ప్రజలతో కలిసి దుర్వ్యవహారాన్ని అనుభవించడాన్నే అతడు ఎంచుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపసంబంధమైన క్షణిక సుఖాన్ని అనుభవించడం కంటే.”
    reason: πρόσκαιρον మరియు ἀπόλαυσις పదాలకు వరుసగా ‘క్షణిక’ మరియు ‘సుఖం’ అనే సహజమైన ప్రత్యామ్నాయ పదాలను సూచిస్తుంది.
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: ఎంచుకున్నాడు
  rationale: ముందటి వచనంలోని మోషేను కర్తగా కొనసాగిస్తూ, రెండు ప్రత్యామ్నాయాల్లో అతడు ఉద్దేశపూర్వకంగా ఒకదానిని ఎంచుకున్నాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; μᾶλλον ... ἢ పోలికను ‘కంటే ... నే’ నిర్మాణం వ్యక్తం చేస్తుంది.
- source_word: συγκακουχεῖσθαι
  choice: కలిసి హింసను అనుభవించడం
  rationale: συν- సూచించే సహభాగితను ‘కలిసి’తో, κακουχέω సూచించే దుర్వ్యవహారం లేదా హింసను అనుభవించే భావాన్ని ‘హింసను అనుభవించడం’తో వ్యక్తం చేసింది.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: దేవుని ప్రజలతో
  rationale: గ్రీకులోని ఒడంబడిక సంబంధమైన సాధారణ అభివ్యక్తిని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: πρόσκαιρον
  choice: తాత్కాలిక
  rationale: కొంతకాలమే నిలిచేదనే కాలపరిమితి భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘క్షణికమైన’ అనే ప్రత్యామ్నాయం కంటే వ్యవధిని అతిశయంగా కుదించదు.
- source_word: ἔχειν ... ἀπόλαυσιν
  choice: ఆనందాన్ని అనుభవించడం
  rationale: తెలుగులో ‘ఆనందాన్ని కలిగి ఉండడం’ కంటే సహజమైన పదబంధం; ἔχειν మరియు ἀπόλαυσις కలిపి తెలిపే ఆనందానుభవ భావాన్ని పునరుక్తి లేకుండా అందిస్తుంది.
- source_word: ἁμαρτίας
  choice: పాపం వల్ల కలిగే
  rationale: పాపంతో సంబంధమున్న లేదా దాని ద్వారా లభించే ఆనందమనే విస్తృత భావాన్ని వ్యక్తం చేస్తుంది; నిర్దిష్ట పాపకార్యాలను అనువాదంలో చేర్చదు.
theological_decisions:
- issue: మోషే తిరస్కరించిన ‘పాపం వల్ల కలిగే ఆనందం’ స్వభావం
  choice: దేవుని ప్రజలతో ఐక్యతకు విరుద్ధంగా ఉన్న, కొంతకాలమే నిలిచే పాపసంబంధ ఆనందంగా విస్తృతంగానే ఉంచబడింది.
  alternative: ఇది ఫరో రాజసభలోని ప్రత్యేక సౌకర్యాలు, రాజీ చర్యలు లేదా ఐగుప్తుతో ముడిపడిన పాపభోగాలను మాత్రమే సూచిస్తుందని నిర్దిష్టీకరించడం.
  rationale: గ్రీకు వాక్యం పాపం ఏమిటో ప్రత్యేకంగా నిర్వచించదు. అందువల్ల అనువాదం దాని నైతిక వ్యత్యాసాన్ని నిలుపుతూ, సందర్భం చెప్పనిదాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ముందటి వచనంతో వ్యాకరణ సంబంధాన్ని తెలుగులో సంపూర్ణ వాక్యంగా స్పష్టం చేసింది.
