  to: విశ్వాసం ద్వారా హేబెలు కయీను కంటే శ్రేష్ఠమైన బలిని[a] దేవునికి అర్పించాడు. దాని ద్వారా అతడు నీతిమంతుడని సాక్ష్యం పొందాడు[b]; దేవుడు అతని అర్పణల గురించి సాక్ష్యమిచ్చాడు. అతడు చనిపోయినా, దాని ద్వారా[c] ఇప్పటికీ మాట్లాడుతున్నాడు.
