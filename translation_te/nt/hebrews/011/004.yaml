source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: te
  text: విశ్వాసం ద్వారా హేబెలు కయీను కంటే శ్రేష్ఠమైన బలిని[a] దేవునికి అర్పించాడు. దాని ద్వారా అతడు నీతిమంతుడని సాక్ష్యం పొందాడు[b]; దేవుడు అతని అర్పణల గురించి సాక్ష్యమిచ్చాడు. అతడు చనిపోయినా, దాని ద్వారా[c] ఇప్పటికీ మాట్లాడుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరింత గొప్ప బలిని.’ ఈ తులన గుణాన్ని (‘శ్రేష్ఠమైన’) లేదా పరిమాణాన్ని (‘మరింత గొప్ప’) సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతడు నీతిమంతుడని ధ్రువీకరించబడ్డాడు.’
    reason: lexical_alternative
  - marker: c
    text: ‘దాని ద్వారా’ అనేది హేబెలు విశ్వాసాన్ని గానీ అతని బలిని గానీ సూచించవచ్చు; గ్రీకు వాక్యం దీనిని పూర్తిగా స్పష్టం చేయదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: విశ్వాసం వల్ల
  rationale: ఇది సాధనార్థక దత్తి విభక్తి. హెబ్రీయులు 11లో విశ్వాసమే ప్రధాన అంశం; ‘వల్ల’ సహజమైన ఆధునిక తెలుగులో సాధన భావాన్ని తెలియజేస్తుంది.
- source_word: πλείονα θυσίαν
  choice: శ్రేష్ఠమైన బలిని
  rationale: πλείων ఇక్కడ కయీను అర్పించిన బలితో పోల్చినప్పుడు గుణపరమైన ఆధిక్యాన్ని సూచించవచ్చు. ‘శ్రేష్ఠమైన’ అనేది ‘అంగీకారయోగ్యమైన’ అని మూలంలో లేని భావాన్ని చేర్చకుండా పోలికను తెలియజేస్తుంది.
- source_word: παρὰ Κάϊν
  choice: కయీను కంటే
  rationale: తులనాత్మక పదంతో వచ్చిన παρά పోలికకు ప్రమాణాన్ని సూచిస్తుంది. తెలుగు ‘కంటే’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: προσήνεγκεν τῷ θεῷ
  choice: దేవునికి అర్పించాడు
  rationale: προσφέρω బలి సందర్భంలో ‘అర్పించు’ అని అనువదించడం సహజమూ ఖచ్చితమూ.
- source_word: δι’ ἧς
  choice: దాని ద్వారా
  rationale: స్త్రీలింగ సంబంధ సర్వనామం సమీపంలోని θυσίαν అనే ‘బలి’ని వ్యాకరణపరంగా సూచిస్తుంది.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: అతడు నీతిమంతుడని సాక్ష్యం పొందాడు
  rationale: μαρτυρέω యొక్క కర్మణి రూపంలోని సాక్ష్య భావాన్ని నిలుపుతూ, తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: దేవుడే అతని అర్పణల గురించి సాక్ష్యమిచ్చాడు
  rationale: τοῦ θεοῦను కర్తగా స్పష్టంగా ఉంచి, ἐπί + దత్తిని ‘గురించి’గా చూపుతుంది. బలి సందర్భంలో δῶραకు ‘అర్పణలు’ సహజమైనది; ‘దేవుడే’ మూలంలోని స్పష్ట కర్తకు తగిన ప్రాధాన్యాన్ని ఇస్తుంది.
- source_word: δι’ αὐτῆς
  choice: దాని ద్వారానే
  rationale: స్త్రీలింగ సర్వనామం విశ్వాసాన్ని గానీ బలిని గానీ సూచించే అవకాశం ఉంది. అస్పష్టమైన ‘దాని’ ఆ సందిగ్ధతను నిలుపుతుంది; ‘ద్వారానే’ మరణానంతరమూ కొనసాగుతున్న మాటను ఉద్ఘాటిస్తుంది.
- source_word: ἀποθανὼν
  choice: అతడు చనిపోయినా
  rationale: తరువాతి ‘ఇప్పటికీ మాట్లాడుతున్నాడు’తో ఉన్న వ్యత్యాసాన్ని సహజమైన అనుమతి భావంతో వ్యక్తం చేస్తుంది.
- source_word: ἔτι λαλεῖ
  choice: ఇప్పటికీ మాట్లాడుతున్నాడు
  rationale: ἔτι మరియు వర్తమాన కాలం కలిసి సూచించే కొనసాగుతున్న ప్రభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి δι’ αὐτῆς దేనిని సూచిస్తుంది?
  choice: ‘దాని ద్వారానే’ అని ఉద్దేశపూర్వకంగా అస్పష్టంగా ఉంచడం
  alternative: ‘విశ్వాసం ద్వారానే’ లేదా ‘బలి ద్వారానే’
  rationale: గ్రీకు స్త్రీలింగ సర్వనామం అధ్యాయపు ప్రధాన అంశమైన విశ్వాసాన్నీ, సమీపంలోని బలినీ సూచించగలదు. ఒక అర్థాన్ని బలవంతంగా నిర్ణయించకుండా మూలంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠ్యంలోనూ పాదసూచికలోనూ నిలిపాం.
- issue: ἐμαρτυρήθη యొక్క భావం
  choice: ‘సాక్ష్యం పొందాడు’ అనే సాక్ష్య భాషను నిలుపడం
  alternative: ‘మెప్పు పొందాడు’ లేదా ‘ఆమోదించబడ్డాడు’
  rationale: హెబ్రీయులు 11లో పునరావృతమయ్యే సాక్ష్య భావాన్ని ఇది కాపాడుతుంది; కేవలం ప్రశంస లేదా ఆమోదం అనే సంకుచిత భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే ‘నీతిమంతుడు,’ ‘సాక్ష్యం,’ ‘బలి,’ ‘అర్పణలు’ వంటి గౌరవప్రదమైన బైబిలు పదజాలం నిలుపబడింది. హేబెలు, కయీను అనే రూపాలు సాధారణ తెలుగు బైబిలు పేర్లకు అనుగుణంగా ఉన్నాయి.
