id: HEB.11.33
reference: Hebrews 11:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: te
  text: విశ్వాసం ద్వారా[a] వారు రాజ్యాలను జయించారు, నీతిని ఆచరించారు[b], వాగ్దానాలను పొందారు, సింహాల నోళ్లు మూశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకం ద్వారా” లేదా “విశ్వాసంతో.” ఇక్కడ ఈ మాట దేవునిపై ఉంచిన విశ్వాసమే వారు కార్యాలు చేయడానికి సాధనమైందని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “న్యాయం చేశారు.” గ్రీకు పదం సందర్భానుసారం నీతిని లేదా న్యాయాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ వారు కార్యాలు చేసిన సాధనాన్ని సూచిస్తుంది. అధ్యాయం అంతటా ఉన్న πίστις అంశాన్ని కొనసాగిస్తూ ‘విశ్వాసం’ను నిలుపుతుంది.
- source_word: κατηγωνίσαντο βασιλείας
  choice: రాజ్యాలను జయించారు
  rationale: καταγωνίζομαι పోరాటంలో పైచేయి సాధించడం లేదా లోబరచడం అనే బలమైన భావాన్ని ఇస్తుంది; βασιλείας ఇక్కడ రాజకీయ రాజ్యాలను సూచిస్తుంది.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: నీతిని ఆచరించారు
  rationale: తెలుగులో సహజంగా ఉండే ఈ ప్రయోగం, వారు న్యాయమైనదీ సరిగ్గా ఉన్నదీ కార్యరూపంలో చేసినట్లు తెలియజేస్తుంది. δικαιοσύνην లోని ‘న్యాయం’ భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: వాగ్దానాలను పొందారు
  rationale: ἐπιτυγχάνω లోని పొందడం లేదా సాధించడం అనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; వాగ్దానాలు ఏ విధంగా లేదా ఎంతవరకు నెరవేరాయో అదనంగా నిర్ణయించదు.
- source_word: ἔφραξαν στόματα λεόντων
  choice: సింహాల నోళ్లు మూశారు
  rationale: మూలంలోని స్పష్టమైన, సజీవమైన రూపకాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: హెబ్రీయులు 11లో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: ఈ అధ్యాయంలో దేవునిపై ఆధారపడి కార్యం చేయడమే ప్రధాన భావం. ‘విశ్వాసం’ ఆ అధ్యాయవ్యాప్త పదసంబంధాన్ని కాపాడుతుంది; ‘నమ్మకం’ సాధ్యమైన భావఛాయగా పాదటిప్పణిలో ఉంది.
- issue: పౌలు రచనలు కాని సందర్భంలో δικαιοσύνη అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఇక్కడ ఈ పదం నైతికంగా సరిగ్గా ప్రవర్తించడం అనే విస్తృత భావాన్ని కలిగి ఉంది. దాన్ని కేవలం న్యాయపరమైన చర్యకు పరిమితం చేయకుండా ‘నీతి’గా ఇచ్చి, ‘న్యాయం’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వరుస క్రియల శైలిని ఉపయోగించాం. మూలంలోని నాలుగు సమాంతర కార్యాలను, వాటి వేగవంతమైన జాబితా లయను కాపాడాం.
