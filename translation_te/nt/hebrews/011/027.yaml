id: HEB.11.27
reference: Hebrews 11:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: te
  text: విశ్వాసంతో అతడు రాజు కోపానికి భయపడకుండా ఐగుప్తును విడిచిపెట్టాడు[a]. ఎందుకంటే, కనిపించని వాణ్ణి[b] చూస్తున్నట్టుగా అతడు స్థిరంగా నిలిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ మాట మోషే ఫరో నుండి పారిపోయిన సందర్భాన్ని (నిర్గమకాండము 2) గానీ, ఇశ్రాయేలీయులతో కలిసి ఐగుప్తు నుండి బయలుదేరిన సందర్భాన్ని (నిర్గమకాండము 12–14) గానీ సూచించవచ్చు; గ్రీకు వాక్యం ఏ సందర్భమో నిర్దిష్టంగా చెప్పదు.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘అదృశ్యుడైన వాణ్ణి.’ గ్రీకు పదాన్ని ‘కంటికి కనిపించని వాణ్ణి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: విశ్వాసంతో
  rationale: ఇక్కడ దత్తివిభక్తి మోషే ఏ విధంగా కార్యం చేశాడో తెలుపుతోంది. హెబ్రీయులు 11 అంతటా ఉన్న పునరావృత నిర్మాణానికి అనుగుణంగా, ఆధునిక తెలుగులో సహజమైన ‘విశ్వాసంతో’ను ఎంచుకున్నాం.
- source_word: κατέλιπεν Αἴγυπτον
  choice: ఐగుప్తును విడిచిపెట్టాడు
  rationale: καταλείπω ఇక్కడ ఒక ప్రదేశాన్ని వదలి వెళ్లడాన్ని సూచిస్తుంది. ‘విడిచిపెట్టాడు’ మూలంలోని సరళతను నిలుపుతూ, అది నిర్గమకాండము 2లోని పారిపోవడమా లేక 12–14లోని నిర్గమనమా అనేది తేల్చదు.
- source_word: μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως
  choice: రాజు కోపానికి భయపడకుండా
  rationale: ప్రధాన క్రియతో ముడిపడిన ప్రతికూల క్రియావిశేషణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. θυμόςలోని బలమైన ఆగ్రహ భావాన్ని ‘కోపం’ అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: τὸν ἀόρατον ὡς ὁρῶν
  choice: కనిపించని వాణ్ణి చూస్తున్నట్టుగా
  rationale: ఆర్టికల్‌తో ఉన్న ἀόρατον‌ను వ్యక్తిని సూచించే రూపంలో అనువదించి, కనిపించని వాణ్ణి చూడటం అనే ఉద్దేశపూర్వక విరోధాభాసాన్ని నిలిపాం. ὡς యొక్క పోలిక భావాన్ని ‘చూస్తున్నట్టుగా’ సహజంగా అందిస్తుంది.
- source_word: ἐκαρτέρησεν
  choice: స్థిరంగా నిలిచాడు
  rationale: καρτερέω సూచించే దృఢమైన సహనం, పట్టుదల భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. కేవలం కష్టాన్ని ‘సహించాడు’ అనే భావానికి పరిమితం చేయకుండా నిలకడను ముందుకు తెస్తుంది.
theological_decisions:
- issue: ‘అతడు ఐగుప్తును విడిచిపెట్టాడు’ అనే మాట సూచించే చారిత్రక సందర్భం
  choice: మోషేను కర్తగా ఉంచి, ఇది నిర్గమకాండము 2లోని అతని పారిపోవడమా లేక నిర్గమకాండము 12–14లో ఇశ్రాయేలుతో చేసిన నిర్గమనమా అనేది ప్రధాన పాఠ్యంలో తేల్చలేదు.
  alternative: ఇది కేవలం ఫరో నుండి మోషే పారిపోయిన సందర్భమని లేదా కేవలం ఇశ్రాయేలు నిర్గమనమని స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం ‘అతడు ఐగుప్తును విడిచిపెట్టాడు’ అని మాత్రమే చెబుతుంది; నిర్దిష్ట ఘట్టాన్ని పేర్కొనదు. అందువల్ల మూలపాఠ్యంలోని వ్యాఖ్యాన సాధ్యతను నిలిపి, వివరాన్ని పాదసూచికలో తెలిపాం.
- issue: τὸν ἀόρατον యొక్క వ్యక్తిగత సూచన
  choice: ‘కనిపించని వాణ్ణి’ అని వ్యక్తిని సూచించే విధంగా అనువదించాం.
  alternative: ‘అదృశ్యమైనదాన్ని’ వంటి అవ్యక్త రూపం.
  rationale: ఆర్టికల్‌తో నామవాచకంగా పనిచేసే పుంలింగ విశేషణం వ్యక్తిగత సూచనను కలిగి ఉంది; సందర్భంలో అది దేవుణ్ణి సూచించినా, మూలంలో లేని ‘దేవుడు’ అనే పేరును ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని అనుసరించాం. ‘కనిపించని వాణ్ణి చూస్తున్నట్టుగా’ అనే పదబంధం మూలంలోని ఉద్దేశపూర్వక విరోధాభాసాన్ని నిలుపుతుంది. పాదసూచిక గుర్తులను వాటి విషయానికి సరిపోయే చోట ఉంచాం: [a] చారిత్రక సందర్భానికి, [b] ἀόρατον యొక్క అనువాద ప్రత్యామ్నాయానికి.'
