id: HEB.11.8
reference: Hebrews 11:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: te
  text: విశ్వాసంతో అబ్రాహాము పిలువబడినప్పుడు విధేయత చూపి, తాను వారసత్వంగా పొందబోయే ఒక ప్రదేశానికి బయలుదేరాడు. తాను ఎక్కడికి వెళ్తున్నాడో తెలియకుండానే అతడు బయలుదేరాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: విశ్వాసంతో
  rationale: ఇది సాధనార్థక దత్తివిభక్తి; అబ్రాహాము దేవుని పిలుపుపై ఆధారపడి స్పందించడాన్ని ‘విశ్వాసంతో’ సహజంగా తెలియజేస్తుంది.
- source_word: καλούμενος
  choice: పిలువబడినప్పుడు
  rationale: వర్తమాన కర్మణి కృదంతంలోని సందర్భకాల భావాన్ని క్రమాన్ని అతిగా నిర్దేశించకుండా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὑπήκουσεν
  choice: విధేయుడై
  rationale: ఆజ్ఞకు లోబడి స్పందించిన భావాన్ని ఇస్తుంది. తరువాతి ‘బయలుదేరాడు’తో కలిపి గ్రీకు క్రియ–క్రియార్థక రూప నిర్మాణాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἐξελθεῖν / ἐξῆλθεν
  choice: బయలుదేరాడు … బయలుదేరాడు
  rationale: మూలంలోని ఒకే ధాతువు పునరుక్తిని వీలైనంతగా నిలుపుతూ, తెలుగులో సహజమైన ప్రయాణారంభ భావాన్ని ఇస్తుంది.
- source_word: τόπον
  choice: ఒక ప్రదేశానికి
  rationale: గమ్యం ఇంకా నిర్దిష్టంగా తెలియని సందర్భాన్ని అనిర్దిష్ట ‘ఒక’ ద్వారా స్పష్టం చేస్తుంది.
- source_word: ἤμελλεν λαμβάνειν εἰς κληρονομίαν
  choice: తాను వారసత్వంగా పొందబోయే
  rationale: μέλλω యొక్క భవిష్యత్ భావాన్ని అతిగా విధినిర్ణయంగా చేయకుండా, కληρονομία యొక్క వారసత్వ భావాన్ని కాపాడుతుంది.
- source_word: μὴ ἐπιστάμενος ποῦ ἔρχεται
  choice: తాను ఎక్కడికి వెళ్తున్నాడో తెలియకుండానే
  rationale: తెలియని గమ్యంతో కూడిన పరిస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ἔρχεται ఇక్కడ గమనం వైపు సూచిస్తుంది.
theological_decisions:
- issue: πίστις పదంలోని విశ్వాసం/నమ్మకం/విశ్వసనీయత భావవ్యాప్తి
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ సందర్భంలో అబ్రాహాము దేవుని పిలుపుకు ఆధారపడి విధేయంగా స్పందించడం ప్రధాన భావం. ‘విశ్వాసం’ ఆ భావాన్ని స్థిరమైన బైబిలు పదజాలంలో అందిస్తుంది; ‘విశ్వసనీయత’ అయితే అబ్రాహాము గుణాన్ని ప్రధానంగా చూపించి సందర్భాన్ని మార్చవచ్చు.
- issue: ὑπήκουσεν ἐξελθεῖν నిర్మాణం
  choice: విధేయుడై … బయలుదేరాడు
  alternative: బయలుదేరడానికి విధేయత చూపాడు
  rationale: ప్రత్యామ్నాయం గ్రీకు క్రియతో కూడిన క్రియార్థక రూపాన్ని మరింత రూపపరంగా అనుసరిస్తుంది, కానీ ఆధునిక తెలుగులో అసహజంగా ఉంటుంది. ఎంచుకున్న రూపం విధేయత మరియు బయలుదేరడం మధ్య సంబంధాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ‘బయలుదేరు’ భావపు పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది. వివరణ అవసరమైన నిజమైన పాఠ్య లేదా అర్థసందిగ్ధత లేకపోవడంతో పాదటిప్పణులు ఇవ్వలేదు.
