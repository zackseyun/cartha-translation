source:
  edition: SBLGNT
  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: te
  text: 'విశ్వాసం ద్వారా మనం గ్రహిస్తున్నాం: యుగాలు[a] దేవుని మాట ద్వారా క్రమబద్ధంగా రూపొందించబడ్డాయి. దీని ఫలితంగా, కనిపించేది కనిపించే వాటినుంచి ఉనికిలోకి రాలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లోకాలు’ లేదా ‘విశ్వం.’ గ్రీకులో ‘యుగాలు’; ఈ పదం కాలమంతటా విస్తరించిన లోక క్రమాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: విశ్వాసం ద్వారా
  rationale: ఇది సాధనార్థక చతుర్థీ విభక్తి; అధ్యాయం అంతటా పునరావృతమయ్యే విశ్వాస సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: νοοῦμεν
  choice: మనం గ్రహిస్తున్నాం
  rationale: ఇక్కడ ఇంద్రియాలతో చూడడం కాకుండా మనస్సుతో అర్థం చేసుకోవడం అనే భావం ఉంది; ‘గ్రహిస్తున్నాం’ ఆ జ్ఞాన సంబంధ ఉద్దేశాన్ని వ్యక్తం చేస్తుంది.
- source_word: κατηρτίσθαι
  choice: క్రమబద్ధంగా రూపొందించబడ్డాయని
  rationale: పూర్ణ కర్మణి రూపం ఏదో సరైన క్రమంలో అమర్చబడి, రూపొందించబడి ఉన్నదనే భావాన్ని ఇస్తుంది. ఈ అనువాదం కేవలం పదార్థ సృష్టి అనే అర్థానికి పరిమితం చేయదు.
- source_word: τοὺς αἰῶνας
  choice: యుగాలు
  rationale: αἰῶνες అనే పదానికి నేరుగా ‘యుగాలు’ అనే అర్థం ఉంది; సందర్భంలో అది కాలవ్యాప్తమైన సృష్టి క్రమాన్ని కూడా సూచించగలదు. మూలంలోని కాలిక-విశ్వ విస్తృతిని కాపాడటానికి ఈ పదాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: ῥήματι θεοῦ
  choice: దేవుని వాక్కువల్ల
  rationale: ῥῆμα దేవుడు పలికిన మాట లేదా ఉచ్చారణను సూచిస్తుంది; సాధనార్థక భావాన్ని ‘వల్ల’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: అందుచేత ... ఉనికిలోకి రాలేదు
  rationale: ఈ నిర్మాణం ఫలితాన్ని సూచిస్తుంది. γίνομαι లోని ‘ఉనికిలోకి రావడం’ అనే భావాన్ని అదనపు తాత్త్విక పదజాలం లేకుండా నిలుపుతుంది.
- source_word: ἐκ φαινομένων
  choice: కనిపించే వాటినుంచి
  rationale: ఈ వర్తమాన కృదంతం కనిపించే లేదా ప్రత్యక్షమయ్యే వస్తువులను సూచిస్తుంది; సంక్షిప్తంగా, సహజంగా అనువదించబడింది.
- source_word: τὸ βλεπόμενον
  choice: కనిపించేది
  rationale: ఏకవచన నామీకృత కృదంతం సమష్టిగా దృశ్య సృష్టిని సూచించగలదు; తెలుగు ఏకవచన సమష్టి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సృష్టికి సంబంధించి αἰῶνες పదపు పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘యుగాలు’ అని అనువదించడం
  alternative: ‘లోకాలు’ లేదా ‘విశ్వం’
  rationale: గ్రీకు పదం కేవలం స్థల సంబంధమైన విశ్వాన్ని కాకుండా కాలం అంతటా ఉన్న లోక క్రమాన్ని సూచించగలదు. ‘యుగాలు’ మూలంలోని ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది; ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో ఇస్తుంది.
- issue: కనిపించని దానినుంచి సృష్టి అనే భావసూచన
  choice: కనిపించేది కనిపించే వాటినుంచి ఉనికిలోకి రాలేదని మాత్రమే చెప్పడం
  alternative: ‘శూన్యం నుంచి సృష్టించబడింది’ అని స్పష్టంగా విస్తరించడం
  rationale: ఈ వాక్యం కనిపించే సృష్టి కనిపించే వస్తువులనుంచి ఉద్భవించలేదని నేరుగా చెబుతుంది. ఇది శూన్యం నుంచి సృష్టి సిద్ధాంతంతో సమ్మతించినా, గ్రీకు పాఠ్యం చెప్పినదానికంటే ఎక్కువగా ప్రధాన పాఠ్యంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘వాక్కు’ అనే పదం ῥῆμα లోని పలికిన మాట భావాన్ని నిలుపుతూ సాధారణ పాఠకుడికి అర్థమయ్యే సాహిత్య గాంభీర్యాన్ని ఇస్తుంది. మూలంలోని కాలిక-విశ్వ సంబంధ అనిశ్చితిని పాదసూచిక ద్వారా కాపాడాం.
