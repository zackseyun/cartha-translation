  source_fidelity: 'ముసాయిదా గ్రీకు పాఠ్యంలోని ప్రధాన భావాలను సరిగ్గా ప్రతిబింబిస్తుంది: πίστει యొక్క సాధనార్థక భావం, νοοῦμεν యొక్క మానసిక గ్రహింపు, αἰῶνες యొక్క కాలిక-విశ్వ విస్తృతి, మరియు కనిపించేది కనిపించే వాటి నుండి ఉనికిలోకి రాలేదనే పరిమిత వాదన అన్నీ నిలిచాయి. అయితే ‘అందుచేత’ సాధారణంగా తార్కిక నిర్ధారణను సూచిస్తుంది; εἰς τὸ నిర్మాణంలోని ఫలిత/పర్యవసాన సంబంధానికి ‘దీని ఫలితంగా’ మరింత సమీపంగా ఉంటుంది.'
