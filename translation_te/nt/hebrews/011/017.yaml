source:
  edition: SBLGNT
  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: te
  text: విశ్వాసం వల్ల అబ్రాహాము పరీక్షించబడుతున్నప్పుడు ఇస్సాకును అర్పించాడు, వాగ్దానాలను స్వీకరించినవాడే తన అద్వితీయ కుమారుణ్ణి[a] అర్పిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏకైక కుమారుడు,’ ‘ప్రత్యేకమైన కుమారుడు.’ గ్రీకు పదం సాటిలేని ప్రత్యేకతను నొక్కిచెబుతుంది; ‘ఏకజనిత కుమారుడు’ అనేది సంప్రదాయ అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: విశ్వాసం వల్ల
  rationale: కరణార్థక చతుర్థీ విభక్తిని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ఈ అధ్యాయంలో పునరావృతమయ్యే సూత్రాన్ని నిలుపుతుంది.
- source_word: προσενήνοχεν
  choice: అర్పించాడు
  rationale: προσφέρω యొక్క బలిపరమైన భావాన్ని నిలుపుతుంది; కథన సారాంశంలో గ్రీకు పరిపూర్ణకాలాన్ని సహజమైన తెలుగు భూతకాలంతో తెలిపింది.
- source_word: πειραζόμενος
  choice: పరీక్షించబడుతున్నప్పుడు
  rationale: వర్తమాన కర్మణి కృదంతంలోని కొనసాగుతున్న పరీక్షను, కాలసంబంధ భావాన్ని స్పష్టంగా నిలుపుతుంది; పాపానికి ప్రలోభపెట్టడం అనే భావాన్ని రానివ్వదు.
- source_word: μονογενῆ
  choice: అద్వితీయ కుమారుణ్ణి
  rationale: ఇస్సాకు అబ్రాహాముకు జీవశాస్త్రీయంగా ఒక్కడే కుమారుడు అని సూచించకుండా, అతని సాటిలేని ప్రత్యేకతను—ముఖ్యంగా వాగ్దాన సంబంధ స్థానాన్ని—వ్యక్తం చేస్తుంది.
- source_word: προσέφερεν
  choice: అర్పిస్తూ ఉన్నాడు
  rationale: అపరిపూర్ణకాల క్రియలోని కొనసాగుతున్న దృశ్యాన్ని నిలుపుతూ, ముందున్న పరిపూర్ణకాల క్రియతో ఉన్న రూపభేదాన్ని తెలుగులో చూపుతుంది.
- source_word: ἀναδεξάμενος
  choice: స్వీకరించిన
  rationale: వాగ్దానాలను అంగీకరించి పొందిన భావాన్ని సహజంగా తెలుపుతుంది; అవసరానికి మించిన వ్యాఖ్యానాన్ని జోడించదు.
- source_word: ἐπαγγελίας
  choice: వాగ్దానాలను
  rationale: గ్రీకులోని బహువచనాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ఇస్సాకు అబ్రాహాముకు జీవశాస్త్రీయంగా ఒక్కడే కుమారుడు కానప్పటికీ μονογενῆ అనే పదాన్ని ఎలా అనువదించాలి
  choice: అద్వితీయ కుమారుడు
  alternative: ఏకైక కుమారుడు; ఒక్కడే కుమారుడు; ఏకజనిత కుమారుడు
  rationale: ఈ పదం ఇస్సాకు యొక్క సాటిలేని, వాగ్దాన సంబంధ ప్రత్యేక స్థానాన్ని నొక్కిచెబుతుంది. ‘ఒక్కడే కుమారుడు’ జీవశాస్త్రీయంగా తప్పుదారి పట్టించవచ్చు; ‘ఏకజనితుడు’ ఈ సందర్భంలో మూలపదం ఉద్దేశించని తరువాతి సిద్ధాంత సంబంధాలను రేకెత్తించవచ్చు.
- issue: προσενήνοχεν మరియు προσέφερεν మధ్య కాల–దృక్కోణ భేదం
  choice: మొదట ‘అర్పించాడు,’ తరువాత ‘అర్పిస్తూ ఉన్నాడు’
  alternative: రెండింటినీ ‘అర్పించాడు’ అని అనువదించడం
  rationale: రెండవ క్రియలోని అపరిపూర్ణ, కొనసాగుతున్న దృశ్యాన్ని నిలుపుతుంది; అయితే అర్పణ పూర్తయిందా అనే కథన ఉద్వేగాన్ని స్వయంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అర్పించాడు/అర్పిస్తూ ఉన్నాడు’ బలిపరమైన భావాన్నీ గ్రీకు క్రియల దృక్కోణ భేదాన్నీ నిలుపుతాయి. పాదసూచిక గుర్తును సంబంధిత పదమైన ‘అద్వితీయ కుమారుణ్ణి’ వెంట ఉంచాం.
