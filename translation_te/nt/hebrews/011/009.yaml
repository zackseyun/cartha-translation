source:
  edition: SBLGNT
  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: te
  text: విశ్వాసం వల్ల అతడు వాగ్దాన దేశంలో పరదేశిగా నివసించాడు, అది తనకు పరాయి దేశమైనట్లుగా; అదే వాగ్దానానికి సహవారసులైన ఇస్సాకు, యాకోబులతో కలిసి గుడారాల్లో నివసించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “విశ్వాసం వల్ల అతడు వాగ్దాన దేశంలో, పరాయి దేశంలో ఉన్నవానిలా, తాత్కాలికంగా నివసించాడు.”'
    reason: పరదేశిగా నివసించడం మరియు దేశాన్ని పరాయిదిగా భావించడం అనే భావాలను ఒకే నిర్మాణంలో వ్యక్తపరచగల ప్రత్యామ్నాయ పదప్రయోగం.
lexical_decisions:
- source_word: πίστει
  choice: విశ్వాసం వల్ల
  rationale: ఇది సాధనార్థక దత్తి విభక్తి; హెబ్రీయులు 11లో పదేపదే కనిపించే విశ్వాసమే కార్యానికి ఆధారమని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: παρῴκησεν
  choice: పరదేశివలె నివసించాడు
  rationale: ఈ క్రియ కేవలం నివసించడమే కాక, ఆ స్థలానికి చెందినవాడు కానివానిగా ఉండడాన్ని సూచిస్తుంది.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: వాగ్దాన దేశంలో
  rationale: నివాసాన్ని సూచించే క్రియతో εἰς ఇక్కడ స్థలార్థంలో సహజంగా అర్థమవుతుంది; τῆς ἐπαγγελίας దేశాన్ని వాగ్దానంతో సన్నిహితంగా అనుసంధానిస్తుంది.
- source_word: ὡς ἀλλοτρίαν
  choice: అది పరాయి దేశమైనట్లు
  rationale: ἀλλοτρίαν అంటే మరొకరికి చెందినది లేదా పరాయిది; ὡς తెలిపే పోలికను స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: గుడారాల్లో నివసిస్తూ
  rationale: కృదంతం ప్రధాన క్రియకు సమకాలికమైన పరిస్థితిని, తాత్కాలిక నివాస జీవనాన్ని వర్ణిస్తుంది.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: ఇస్సాకు, యాకోబులతో కలిసి
  rationale: μετά + షష్ఠీ విభక్తి సహవాసాన్ని సూచిస్తుంది; పేర్లు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
- source_word: τῶν συγκληρονόμων
  choice: తనతోపాటు వారసులైన
  rationale: συγκληρονόμων ఒకే స్వాస్థ్యంలో భాగం పంచుకునే సహవారసులను సూచిస్తుంది; ఈ రూపం తెలుగులో సహజంగా ఆ భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: అదే వాగ్దానానికి
  rationale: αὐτῆς అబ్రాహాము, ఇస్సాకు, యాకోబులు పంచుకున్న వాగ్దానం ఒకటేననే గుర్తింపును బలపరుస్తుంది.
theological_decisions:
- issue: వ్యక్తంగా చెప్పని కర్త ఎవరనే ప్రశ్న
  choice: ముందటి వచనం నుండి కొనసాగుతున్న అబ్రాహామును ‘అతడు’గా సూచించడం
  alternative: పాఠ్యంలో ‘అబ్రాహాము’ పేరును స్పష్టంగా చేర్చడం
  rationale: గ్రీకు పాఠ్యంలో పేరు పునరుక్తం కాలేదు; సందర్భం కర్త అబ్రాహామేనని స్పష్టం చేస్తుంది. ‘అతడు’ అనడం మూలంలోని అనాఫోరాను నిలుపుతుంది.
- issue: వాగ్దాన దేశం మరియు పరాయి దేశం మధ్య ఉద్రిక్తత
  choice: ‘వాగ్దాన దేశంలో… అది పరాయి దేశమైనట్లు’ అని రెండింటినీ నిలుపడం
  alternative: అతనికి ఇంకా స్వాధీనం కాని వాగ్దాన దేశంలో అని వివరణాత్మకంగా చెప్పడం
  rationale: మూలపాఠం దేశం వాగ్దానం చేయబడినదే అయినా అబ్రాహాము అక్కడ పరదేశిగా జీవించాడనే ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘పరదేశి,’ ‘వారసులు,’ ‘వాగ్దానం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచుతూ వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం.
