    rationale: సర్వనామాన్ని ‘అది తనకు పరాయి దేశమైనట్లుగా’గా స్పష్టం చేయడం వల్ల దేశం వాగ్దానమైనదే అయినా అబ్రాహాము దానిని తన స్వదేశంలా స్వాధీనం చేసుకోలేదనే భావం సహజంగా వస్తుంది.
