source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: te
  text: విశ్వాసం[a] లేకుండా ఆయనను సంతోషపరచడం అసాధ్యం. ఎందుకంటే దేవుని సమీపించేవాడు, ఆయన ఉన్నాడని[b], ఆయనను శ్రద్ధగా వెదికేవారికి ఆయన ప్రతిఫలం ఇచ్చేవాడని[c] నమ్మాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నమ్మకం’ అని కూడా అనువదించవచ్చు. πίστις కొన్ని సందర్భాల్లో ‘విశ్వసనీయత’ అనే భావాన్నీ కలిగి ఉంటుంది; ఇక్కడ తరువాతి వివరణ దేవుణ్ణి నమ్మడంపై కేంద్రీకరిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో సంక్షిప్తంగా, ‘ఆయన ఉన్నాడని’ అని ఉంది. సందర్భంలో ఇది దేవుని ఉనికిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: మూలంలో ‘ప్రతిఫలం ఇచ్చేవాడిగా అవుతాడు’ అనే క్రియారూపం ఉంది. సందర్భంలో, తనను వెదికేవారికి దేవుడు ప్రతిఫలం ఇచ్చేవాడిగా వెల్లడవుతాడనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: విశ్వాసం లేకుండా
  rationale: χωρίς యొక్క ‘లేకుండా’ అనే భావాన్ని స్పష్టంగా ఉంచుతుంది. δέ ఇక్కడ స్వల్ప అనుసంధానక పదం; సహజమైన తెలుగు వాక్యప్రవాహంలో దానిని ప్రత్యేక పదంగా చూపాల్సిన అవసరం లేదు. πίστις‌కు సందర్భానుసారంగా ‘విశ్వాసం’ సరిపోతుంది.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: ఆయనను సంతోషపరచడం అసాధ్యం
  rationale: అసాధ్యతను తెలిపే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది. ‘ఆయనను’ అనే కర్మ సందర్భంలోని దేవుణ్ణి సూచిస్తుంది.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: ఎందుకంటే … నమ్మాలి
  rationale: γάρ తెలిపే కారణాన్ని ‘ఎందుకంటే’తో, δεῖ తెలిపే అవసరాన్ని ‘నమ్మాలి’తో నిలుపుతుంది.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: దేవుని సమీపించేవాడు
  rationale: προσέρχομαιలోని దగ్గరకు రావడం లేదా సమీపించడం అనే భావాన్ని నిలుపుతూ, ఆరాధనా సందర్భానికి కూడా అనువైన గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: ὅτι ἔστιν
  choice: ఆయన ఉన్నాడని
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తతను నిలుపుతుంది. సందర్భంలో ఇది దేవుని వాస్తవ ఉనికిని సూచిస్తుంది; ‘ఆయన ఉనికిలో ఉన్నాడని’ కంటే ఈ రూపం సహజమైనది.
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: తనను శ్రద్ధగా వెదికేవారికి
  rationale: ἐκζητέωలోని గాఢంగా లేదా పట్టుదలతో వెదకడం అనే బలమైన భావాన్ని ‘శ్రద్ధగా’ తెలియజేస్తుంది.
- source_word: μισθαποδότης γίνεται
  choice: ఆయన ప్రతిఫలం ఇచ్చేవాడని
  rationale: μισθαποδότης‌ను సాధారణ పాఠకులకు స్పష్టంగా ‘ప్రతిఫలం ఇచ్చేవాడు’గా అందిస్తుంది. γίνεταιను అక్షరార్థంగా ‘అవుతాడు’ అనడం దేవుని స్వభావంలో మార్పు అనే అనవసర భావాన్ని కలిగించవచ్చు; ఇక్కడ వెదికేవారిపట్ల ఆయన ఎలాంటివాడిగా అనుభవంలో వెల్లడవుతాడో ఈ రూపం సహజంగా చెబుతుంది.
theological_decisions:
- issue: πίστις యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: వెంటనే వచ్చే πιστεῦσαι (‘నమ్మాలి’) ఈ సందర్భంలో దేవుణ్ణి నమ్మే స్పందనను ప్రధానంగా చూపుతుంది. అయినా πίστις‌కు ఉండగల ‘నమ్మకం’ అనే సమీప ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచాం.
- issue: ὅτι ἔστιν యొక్క అర్థం
  choice: ఆయన ఉన్నాడని
  alternative: ఆయన ఉనికిలో ఉన్నాడని; ఆయన ‘ఉన్నవాడు’ అని
  rationale: వాక్యం దేవుని ఉనికిని అంగీకరించడాన్ని సూచించగలదు; అయితే గ్రీకు సంక్షిప్తత వల్ల ‘ఆయన ఉన్నాడని’ అనే రూపం మూలంలోని స్వల్ప విస్తృతిని కాపాడుతుంది.
- issue: μισθαποδότης γίνεταιలో γίνεται యొక్క బలం
  choice: ఆయన ప్రతిఫలం ఇచ్చేవాడని
  alternative: ఆయన ప్రతిఫలం ఇచ్చేవాడిగా అవుతాడని; ప్రతిఫలం ఇచ్చేవాడిగా వెల్లడవుతాడని
  rationale: ‘అవుతాడు’ అనేది రూపపరంగా దగ్గరగా ఉన్నప్పటికీ దేవుని స్వభావం మారుతుందనే భావం అవసరం లేదు. సందర్భంలో దేవుణ్ణి వెదికేవారికి ఆయన ప్రతిఫలం ఇచ్చేవాడిగా ఉంటాడనే భావాన్ని ప్రధాన పాఠం సహజంగా అందిస్తుంది; మూల క్రియలోని ప్రత్యేకతను పాదటీపు కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సమీపించేవాడు’ మూలంలోని దగ్గరకు వచ్చే భావాన్ని నిలుపుతుంది; ‘శ్రద్ధగా వెదికేవారు’ ἐκζητέω యొక్క తీవ్రతను తెలియజేస్తుంది. పాదటీపు గుర్తులు [a], [b], [c] అన్నీ ప్రధాన పాఠంలో సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
