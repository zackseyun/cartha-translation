  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: te
  text: విశ్వాసం ద్వారా యెరికో గోడలు ఏడు రోజులపాటు చుట్టుముట్టబడిన తర్వాత కూలిపోయాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వాసం వల్ల.” గ్రీకులోని దత్తివిభక్తి సాధనాన్ని లేదా విధానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: విశ్వాసం వల్ల
  rationale: πίστις యొక్క దత్తివిభక్తి ఇక్కడ సాధనం లేదా విధానాన్ని సూచించవచ్చు. హెబ్రీయులు 11లో పునరావృతమయ్యే సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతూ ‘విశ్వాసం వల్ల’ అని అనువదించాం.
- source_word: τὰ τείχη Ἰεριχὼ
  choice: యెరికో గోడలు
  rationale: τεῖχος నగర ప్రాకారాన్ని సూచిస్తుంది; బహువచనానికి సహజమైన తెలుగు రూపం ‘గోడలు’. Ἰεριχώ స్థలనామాన్ని ‘యెరికో’గా లిప్యంతరీకరించాం.
- source_word: ἔπεσαν
  choice: కూలిపోయాయి
  rationale: πίπτω యొక్క భూతకాల రూపం ‘పడిపోయాయి’ అనే మూలార్థం కలిగినప్పటికీ, గోడల సందర్భంలో ‘కూలిపోయాయి’ సహజంగా ఉండి సంఘటనను అనవసరంగా విస్తరించదు.
- source_word: κυκλωθέντα
  choice: చుట్టుముట్టబడిన తర్వాత
  rationale: κυκλόω యొక్క భూతార్థక కర్మణి అసమాపక క్రియ ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. ఎవరు ఎలా తిరిగారో చేర్చకుండా గ్రీకు వాక్యంలోని కర్మణి దృష్టిని నిలిపాం.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: ఏడు రోజులపాటు
  rationale: ἐπί + ద్వితీయావిభక్తి కాలవ్యాప్తిని సూచిస్తుంది; ‘ఏడు రోజులపాటు’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
theological_decisions:
- issue: హెబ్రీయులు 11:30లో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: హెబ్రీయులు 11 అంతటా కనిపించే పునరావృత సూత్రం మరియు విశ్వాస ఉదాహరణల సందర్భం ‘విశ్వాసం’ అనే ఎంపికకు మద్దతిస్తాయి. ‘విశ్వసనీయత’ ఇక్కడ తక్కువ సంభావ్యమైనది.
- issue: πίστει దత్తివిభక్తి సంబంధం
  choice: విశ్వాసం వల్ల
  alternative: విశ్వాసం ద్వారా
  rationale: దత్తివిభక్తి సాధనం లేదా విధానం అనే రెండు దగ్గరి భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో సహజమైన ‘వల్ల’ను ఉంచి, ‘ద్వారా’ను పాదసూచికలో ఇచ్చి అసలు భాషలోని సూక్ష్మ అనిశ్చితిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘చుట్టుముట్టబడిన’ అనే కర్మణి రూపం కొంత అధికారికమైనదైనా మూలంలోని దృష్టిని ఖచ్చితంగా నిలుపుతుంది; యెహోషువ 6లోని వివరాలను వాక్యంలోకి అదనంగా చేర్చలేదు.
