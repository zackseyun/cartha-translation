id: HEB.11.5
reference: Hebrews 11:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: te
  text: విశ్వాసం ద్వారా హనోకు మరణాన్ని చూడకుండా ఉండేలా తీసుకుపోబడ్డాడు[a]. దేవుడు అతణ్ణి తీసుకుపోయాడు కాబట్టి అతడు కనబడలేదు. ఎందుకంటే, అతడు తీసుకుపోబడక ముందు, అతడు దేవునికి ప్రీతికరంగా ఉన్నాడని అతని గురించి సాక్ష్యం ఇవ్వబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ‘మరణాన్ని అనుభవించకుండా.’ ‘మరణాన్ని చూడటం’ అనేది గ్రీకు నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: విశ్వాసం వల్ల
  rationale: దత్తివు ఇక్కడ హనోకు తీసుకుపోబడటంతో విశ్వాసానికి ఉన్న సాధనాత్మక లేదా సంబంధాత్మక అనుబంధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘విశ్వాసం వల్ల’ సహజంగా ఉండి ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: తీసుకుపోబడ్డాడు / తీసుకుపోయాడు / తీసుకుపోబడక ముందు
  rationale: ఒకే పదకుటుంబాన్ని సాధ్యమైనంతవరకు ఒకే తెలుగు క్రియతో ప్రతిబింబిస్తూ, హనోకును దేవుడు భూలోక జీవితం నుండి తొలగించినట్లు చెబుతుంది. ‘పరలోకానికి ఎత్తుకుపోయాడు’ వంటి మూలంలో స్పష్టంగా లేని వివరాన్ని చేర్చదు.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: మరణాన్ని చూడకుండా ఉండేలా
  rationale: గ్రీకు ‘మరణాన్ని చూడటం’ అనే నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌లోని ఉద్దేశం/ఫలితం మధ్య ఉన్న సూక్ష్మ అనిశ్చితిని ‘ఉండేలా’ పూర్తిగా కుదించకుండా ఉంచుతుంది.
- source_word: οὐχ ηὑρίσκετο
  choice: అతడు కనబడలేదు
  rationale: అపూర్ణ భూతకాల నిష్క్రియ రూపాన్ని సరళంగా ప్రతిబింబిస్తుంది; అతణ్ణి వెదికినవారు ఎవరో మూలం చెప్పనందున తెలుగులోనూ పేర్కొనదు.
- source_word: μεμαρτύρηται
  choice: అతని గురించి సాక్ష్యం ఇవ్వబడింది
  rationale: పరిపూర్ణ నిష్క్రియ భావాన్ని నిలుపుతూ, సాక్ష్యం ఎవరు ఇచ్చారనే విషయాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: అతడు దేవుణ్ణి సంతోషపరిచాడని
  rationale: దేవునికి ప్రీతికరంగా ఉన్నాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; పరిపూర్ణ ఇన్ఫినిటివ్ సూచించే ముందస్తు స్థితి సందర్భం ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: హనోకు తీసుకుపోబడటం యొక్క స్వరూపం
  choice: ‘తీసుకుపోబడ్డాడు’ అని మాత్రమే అనువదించడం
  alternative: ‘పరలోకానికి ఎత్తుకుపోబడ్డాడు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: దేవుడు హనోకును తీసుకుపోయాడనీ అతడు మరణాన్ని చూడలేదనీ వాక్యం చెబుతుంది; అయితే అతడు ఎక్కడికి లేదా ఏ విధంగా తీసుకుపోబడ్డాడో ఈ వాక్యం వివరించదు.
- issue: ‘మరణాన్ని చూడటం’ అనే నుడికారం
  choice: ప్రధాన పాఠ్యంలో నుడికారాన్ని నిలుపడం
  alternative: ‘మరణాన్ని అనుభవించడం’ అని పూర్తిగా భావానువాదం చేయడం
  rationale: నుడికారం తెలుగులో అర్థమయ్యే విధంగానే ఉంది; దాని స్పష్టమైన భావాన్ని పాదసూచికలో ఇస్తే మూలంలోని బైబిలు భాషా రూపం కూడా నిలుస్తుంది.
- issue: μεμαρτύρηταιలో సాక్ష్యదాత
  choice: సాక్ష్యం ఇవ్వబడిందని నిష్క్రియ రూపంలో ఉంచడం
  alternative: దేవుడే అతణ్ణి మెచ్చుకున్నాడని స్పష్టీకరించడం
  rationale: సందర్భం దైవిక లేదా లేఖన సాక్ష్యాన్ని సూచించవచ్చు; అయినా ఈ క్రియలో సాక్ష్యదాతను గ్రీకు పాఠ్యం ప్రత్యక్షంగా పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘హనోకు’ అనే సాధారణ తెలుగు బైబిలు నామరూపం నిలుపబడింది. మూలంలోని క్రియ పునరుక్తిని ‘తీసుకుపో-’ రూపాలతో ఉద్దేశపూర్వకంగా కొనసాగించాం.
