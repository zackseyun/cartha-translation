- from: ఎందుకంటే, పునాదులు గల పట్టణం కోసం అతడు ఎదురుచూస్తూ ఉన్నాడు; దాని రూపకర్త, నిర్మాణకర్త దేవుడే.[a][b]
  to: ఎందుకంటే అతడు పునాదులు గల నగరం[a] కోసం ఎదురుచూస్తూ ఉన్నాడు; దాని రూపకర్త, నిర్మాత[b] దేవుడు.
