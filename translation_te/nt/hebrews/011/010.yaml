source:
  edition: SBLGNT
  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: te
  text: ఎందుకంటే అతడు పునాదులు గల నగరం[a] కోసం ఎదురుచూస్తూ ఉన్నాడు; దాని రూపకర్త, నిర్మాత[b] దేవుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పునాదులను కలిగియున్న నగరం.’ బహువచనం దాని శాశ్వతత్వాన్ని, స్థిరత్వాన్ని నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దాని రూపకల్పనకర్తను, నిర్మాణకర్తను దేవుడని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: ఎదురుచూస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన నిరీక్షణను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కాలవ్యాప్త భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యంలో అబ్రాహాము విశ్వాసంతో పరదేశిగా నివసించిన దానికి ఈ వాక్యం కారణ వివరణ ఇస్తుంది.
- source_word: τοὺς θεμελίους ἔχουσαν πόλιν
  choice: పునాదులు గల పట్టణం
  rationale: గ్రీకు భాగంలోని ‘పునాదులు కలిగిన పట్టణం’ అనే నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తూ, బహువచనమైన ‘పునాదులు’ను నిలుపుతుంది.
- source_word: θεμελίους
  choice: పునాదులు
  rationale: బహువచనాన్ని యథాతథంగా ఉంచుతుంది; సందర్భంలో ఇది గుడారాల తాత్కాలికతకు భిన్నమైన స్థిరత్వాన్ని సూచించవచ్చు.
- source_word: πόλιν
  choice: పట్టణం
  rationale: πόλιςకు సహజమైన ఆధునిక తెలుగు సమానార్థకం; వచనం స్వయంగా చెప్పని అదనపు పరలోక గుర్తింపును చేర్చదు.
- source_word: ἧς
  choice: దాని
  rationale: సంబంధ సర్వనామం ముందున్న పట్టణాన్ని సూచిస్తుంది; తెలుగులో స్వామ్య సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τεχνίτης
  choice: రూపకర్త
  rationale: నైపుణ్యంతో రూపకల్పన చేసే వ్యక్తి అనే భావాన్ని తెలియజేస్తూ, తరువాతి δημιουργόςతో తేడాను నిలుపుతుంది.
- source_word: δημιουργός
  choice: నిర్మాణకర్త
  rationale: పట్టణ సందర్భంలో దానిని ఉనికిలోకి తెచ్చి నిర్మించేవాడు అనే భావాన్ని స్పష్టంగా అందిస్తుంది; ‘రూపకర్త’తో జతగా నిర్మాణ రూపకాన్ని కాపాడుతుంది.
- source_word: ὁ θεός
  choice: దేవుడే
  rationale: వాక్యంలోని కర్త దేవుడని తెలియజేస్తుంది; ‘ఏ’ నొక్కి చెప్పే రూపం గ్రీకు predicate నిర్మాణంలోని కేంద్రీకరణను తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: వాగ్దానం చేయబడిన పట్టణ స్వభావం
  choice: ‘పునాదులు గల పట్టణం’ అని మాత్రమే అనువదించడం
  alternative: ‘పరలోక పట్టణం’ లేదా ‘శాశ్వత పునాదులు గల పట్టణం’
  rationale: ఈ వచనం పట్టణాన్ని ‘పరలోకమైనది’ అని ప్రత్యక్షంగా పేర్కొనదు; దానికి పునాదులు ఉన్నాయని, దేవుడే దాని రూపకర్త మరియు నిర్మాణకర్త అని చెబుతుంది. అందువల్ల సమీప సందర్భం నుంచి పూర్తి గుర్తింపును ప్రధాన పాఠ్యంలోకి దిగుమతి చేయకుండా మూలంలోని భావచిత్రం, భావ ఉద్రిక్తత నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న నిరీక్షణను ‘ఎదురుచూస్తూ ఉన్నాడు’తో నిలిపి, ‘పునాదులు’ అనే బహువచనాన్ని కాపాడాం. ప్రధాన పాఠ్యంలో రెండు పాదసూచిక గుర్తులు సంబంధిత పదబంధాల తరువాత ఉంచబడ్డాయి.
