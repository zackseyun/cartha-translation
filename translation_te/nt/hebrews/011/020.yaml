source:
  edition: SBLGNT
  text: Πίστει ⸀καὶ περὶ μελλόντων εὐλόγησεν Ἰσαὰκ τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: te
  text: విశ్వాసంతో ఇస్సాకు రాబోయే సంగతుల గురించి కూడా యాకోబును, ఏశావును ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: విశ్వాసంతో
  rationale: దత్తివిభక్తిలోని సాధనార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ περὶ μελλόντων
  choice: రాబోయే సంగతుల గురించి కూడా
  rationale: καὶ పదంలోని ‘కూడా/సైతం’ భావాన్ని నిలుపుతూ, μελλόντων అనే భవిష్యత్ సూచనను ఏ నిర్దిష్ట సంఘటనలకూ పరిమితం చేయకుండా అనువదిస్తుంది.
- source_word: εὐλόγησεν
  choice: ఆశీర్వదించాడు
  rationale: బైబిలు సందర్భంలో దీవెన పలకడాన్ని సూచించే సుపరిచితమైన, గౌరవప్రదమైన పదం.
theological_decisions:
- issue: ఇస్సాకు పలికిన దీవెనలకు భవిష్యత్తుతో ఉన్న సంబంధం
  choice: రాబోయే సంగతుల గురించి కూడా
  alternative: భవిష్యత్తులో జరగబోయే వాటిని ముందే ప్రకటిస్తూ
  rationale: మూలంలోని περὶ μελλόντων కేవలం ‘రాబోయే సంగతుల గురించి’ అని చెబుతుంది; దానిని స్పష్టమైన ప్రవచన ప్రకటనగా విస్తరించకుండా అసలు వాక్యంలోని విస్తృతతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని పదక్రమాన్ని బలవంతంగా అనుసరించకుండా, ‘కూడా’ ద్వారా καὶ యొక్క ఉద్ఘాటనను సహజంగా నిలిపాం.
