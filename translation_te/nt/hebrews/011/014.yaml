  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιαῦτα λέγοντες ἐμφανίζουσιν ὅτι πατρίδα ἐπιζητοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/014.yaml
  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: te
  text: ఎందుకంటే ఇలాంటి మాటలు చెప్పేవారు తాము ఒక స్వదేశాన్ని[a] వెదుకుతున్నారని స్పష్టం చేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ సొంత దేశాన్ని,’ ‘జన్మభూమిని.’ తరువాతి వచనం వారు ఆశించిన స్వదేశం అంతిమంగా పరలోక సంబంధమైనదని స్పష్టం చేస్తుంది.
    reason: πατρίς పదానికి ఉన్న సహజమైన ప్రత్యామ్నాయ అర్థాలను తెలుపుతూ, తరువాతి సందర్భం ఇచ్చే వివరణను సూచించడానికి.
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοιαῦτα
  choice: ఇలాంటి మాటలు
  rationale: ముందు సందర్భంలో పలికిన ప్రకటనలను సూచించే నపుంసక బహువచన భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: చెప్పేవారు
  rationale: వర్తమాన కృదంతాన్ని సాధారణంగా లేదా కొనసాగుతూ మాట్లాడేవారిని సూచించే సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: ἐμφανίζουσιν
  choice: స్పష్టం చేస్తున్నారు
  rationale: వారి మాటల ద్వారా ఒక విషయం వెల్లడవుతోందనే భావాన్ని సహజంగా, ప్రత్యక్షంగా తెలియజేస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: స్పష్టమవుతున్న విషయాన్ని పరిచయం చేసే విషయార్థక ఉపవాక్యాన్ని తెలుగులో సహజంగా కలుపుతుంది.
- source_word: πατρίδα
  choice: ఒక స్వదేశాన్ని
  rationale: తమకు చెందిన దేశం లేదా జన్మభూమి అనే అర్థపరిధిని కలిగి ఉండగా, నిర్దిష్టంగా భూసంబంధమైనదో పరలోక సంబంధమైనదో ఈ వచనంలో ముందుగానే నిర్ణయించదు.
- source_word: ἐπιζητοῦσιν
  choice: వెదుకుతున్నామని
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న అన్వేషణ భావాన్ని నిలుపుతుంది; కేవలం ఆశపడటం కన్నా క్రియాశీలంగా వెదకడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: పితరులు కోరిన πατρίς యొక్క స్వరూపం
  choice: ప్రధాన పాఠ్యంలో సాధారణంగా ‘ఒక స్వదేశం’ అని అనువదించడం
  alternative: ‘భూసంబంధమైన స్వదేశం’ లేదా ‘పరలోక స్వదేశం’ అని నిర్దిష్టీకరించడం
  rationale: ఈ వచనం వారు ఒక స్వదేశాన్ని వెదుకుతున్నారని మాత్రమే చెబుతుంది; తరువాతి వచనం అది శ్రేష్ఠమైన, పరలోక సంబంధమైన దేశమని వివరిస్తుంది. అందువల్ల ఇక్కడి అస్పష్టతను ముందుగానే పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ‘ఇలాంటి మాటలు’ అన్నది ముందటి వచనంలోని ప్రకటనలను స్పష్టంగా సూచిస్తుంది.
