  rationale: The revision removes interpretive additions from the main text, avoids unwarranted emphasis, and uses a broader historical designation for οἱ πρεσβύτεροι. The likely faith referent and the favorable-testimony nuance are retained in anchored footnotes without over-resolving what the Greek leaves implicit.
