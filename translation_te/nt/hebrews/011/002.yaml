translation:
  language: te
  text: ఎందుకంటే, దీనివల్ల పూర్వకాలపు వారు ప్రశంస పొందారు[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రశంసింపబడ్డారు’ లేదా ‘మంచి సాక్ష్యం పొందారు.’ గ్రీకు క్రియకు అనుకూలమైన సాక్ష్యం లేదా ప్రశంస పొందడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ముందటి వచనంలో చెప్పబడిన విశ్వాసం ద్వారా అని భావించవచ్చు.
    reason: cross_reference
  - marker: c
    text: లేదా, ‘ప్రాచీనులు’ లేదా ‘పూర్వపు పెద్దలు.’ ఈ సందర్భంలో ఇది సంఘపెద్దల హోదాను కాదు, పూర్వకాలానికి చెందిన వారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: దీనివల్లనే
  rationale: స్త్రీలింగ ఏకవచన సూచక సర్వనామం ముందటి వచనంలోని πίστις (‘విశ్వాసం’)ను సహజంగా సూచిస్తుంది; ἐν ఇక్కడ సాధనార్థాన్ని వ్యక్తం చేస్తుంది. ‘దీనివల్లనే’ మూలంలోని సూచనను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలో విశ్వాసం గురించి చెప్పిన దానికి ఈ వాక్యం వివరణాత్మక ఆధారాన్ని ఇస్తుంది; ‘ఎందుకంటే’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐμαρτυρήθησαν
  choice: దేవుని మెప్పు పొందారు
  rationale: μαρτυρέω యొక్క కర్మణి రూపం అనుకూలమైన సాక్ష్యం లేదా ఆమోదం పొందడాన్ని సూచిస్తుంది. అధ్యాయ సందర్భంలో ఆ అనుకూల సాక్ష్యానికి దేవుడే మూలమని స్పష్టమవుతుంది; ‘మెప్పు పొందారు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది. ‘దేవుని’ అనేది సందర్భాన్ని స్పష్టం చేసే పూరకం.
- source_word: οἱ πρεσβύτεροι
  choice: పూర్వీకులు
  rationale: ఇక్కడ పదం సంఘపెద్దల హోదాను కాక, పూర్వకాలానికి చెందిన విశ్వాసులను సమష్టిగా సూచిస్తుంది. ‘పూర్వీకులు’ ఆ సందర్భార్థాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ταύτῃ దేనిని సూచిస్తుంది?
  choice: ముందటి వచనంలోని విశ్వాసాన్ని సూచించే ‘దీనివల్లనే’
  alternative: 11:1లో వివరించిన వాస్తవాన్ని మరింత విస్తృతంగా సూచించడం
  rationale: స్త్రీలింగ ఏకవచనమైన ταύτῃ, స్త్రీలింగ నామవాచకమైన πίστις‌తో సహజంగా సరిపోతుంది. అయితే ప్రధాన పాఠంలో ‘విశ్వాసం వల్లనే’ అని ప్రత్యక్షంగా చేర్చకుండా ‘దీనివల్లనే’ అని ఉంచడం ద్వారా మూలంలోని సూచనాత్మక రూపం, కొంత విస్తృతమైన అర్థసంభావ్యత రెండూ నిలుస్తాయి.
- issue: అనుకూల సాక్ష్యానికి మూలం
  choice: ‘దేవుని మెప్పు’ అని సందర్భాన్ని స్పష్టం చేయడం
  alternative: ‘మంచి సాక్ష్యం పొందారు’ అని కర్తను పేర్కొనకుండా ఉంచడం
  rationale: హెబ్రీయులకు 11 అధ్యాయంలో, ముఖ్యంగా 11:4-5, 39లో, ఈ సాక్ష్యం దేవుని అనుకూల తీర్పుగా కనిపిస్తుంది. అయినప్పటికీ మూల క్రియలో దేవుడు ప్రత్యక్షంగా పేర్కొనబడలేదనే విషయాన్ని పాదసూచికలో తెలియజేస్తాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పెద్దలు’ అనే పదం నేటి పాఠకులకు సంఘపెద్దలు లేదా వయోవృద్ధులు అనే అపార్థం కలిగించవచ్చు కాబట్టి ప్రధాన పాఠంలో ‘పూర్వీకులు’ వాడి, మూలపదానికి దగ్గరైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
