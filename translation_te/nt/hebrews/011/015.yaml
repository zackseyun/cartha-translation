id: HEB.11.15
reference: Hebrews 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: te
  text: వారు విడిచివచ్చిన ఆ దేశాన్ని[a] తలచుకుంటూ ఉండి ఉంటే, తిరిగి వెళ్లడానికి వారికి అవకాశం ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ దేశం’ లేదా ‘ఆ స్వదేశం.’ గ్రీకు పదబంధం వారు విడిచివచ్చిన భౌమిక స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: తలచుకుంటూ ఉండి ఉంటే
  rationale: వర్తమాన సూచనార్థక రూపం వాస్తవానికి విరుద్ధమైన షరతులో ఉంది. అందువల్ల గతంలో వారి మనస్సు ఆ దేశంపైనే నిలిచి ఉండడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కేవలం జ్ఞాపకం రావడం లేదా వ్యామోహం అనే అదనపు భావాన్ని బలవంతంగా చేర్చదు.
- source_word: ἐκείνης
  choice: ఆ దేశాన్నే
  rationale: స్త్రీలింగ సూచక సర్వనామం 14వ వచనంలోని దేశాన్ని సూచిస్తుంది. తెలుగులో సూచ్యాన్ని స్పష్టం చేయడానికి ‘దేశం’ చేర్చబడింది; ‘-నే’ μέν సూచించే స్వల్ప నిర్మాణాత్మక ఉద్ఘాటనను సహజంగా అందిస్తుంది.
- source_word: ἀφ’ ἧς
  choice: ఆ దేశం నుండి
  rationale: బయలుదేరిన మూలస్థల సంబంధాన్ని నేరుగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐξέβησαν
  choice: బయలుదేరి వచ్చిన
  rationale: ἐκβαίνω లోని బయటకు రావడం/వెళ్లడం అనే భావాన్ని నిలుపుతుంది. తెలుగు సందర్భంలో ‘బయలుదేరి వచ్చిన’ అనేది ప్రస్తుతం ఉన్న దృష్టిబిందువునుంచి వారు విడిచివచ్చిన దేశాన్ని సహజంగా సూచిస్తుంది.
- source_word: εἶχον ἂν
  choice: వారికి ... ఉండేది
  rationale: ἄνతో కూడిన అసంపూర్ణ భూతకాల రూపం వాస్తవానికి విరుద్ధమైన షరతు ఫలితాన్ని సూచిస్తుంది. తెలుగు ‘ఉండేది’ ఆ సంభావ్య ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καιρὸν
  choice: అవకాశం
  rationale: ఇక్కడ కేవలం కాలవ్యవధి కాక, తిరిగి వెళ్లగల అనుకూల సందర్భం లేదా వీలు ఉద్దేశించబడింది.
- source_word: ἀνακάμψαι
  choice: తిరిగి వెళ్లడానికి
  rationale: వెనక్కి మళ్లి పూర్వస్థలానికి చేరే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ εἰ μὲν
  choice: '... ఉండి ఉంటే'
  rationale: షరతు సంబంధం తెలుగు వాక్య నిర్మాణంలో స్పష్టంగా ఉంది. విడిగా ‘మరియు’ చేర్చడం తెలుగులో కృత్రిమంగా ఉండటంతో వదిలివేయబడింది; μέν యొక్క స్వల్ప ఉద్ఘాటన ‘ఆ దేశాన్నే’లో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: వారు తలచుకున్న దేశం స్వభావం
  choice: వారు నిజంగా విడిచివచ్చిన భౌతిక దేశం
  alternative: ఒక నిర్దిష్ట దేశం కాక, వారి పూర్వ జీవన విధానం
  rationale: హెబ్రీయులు 11:13–16 సందర్భం పితరులు విడిచిన భూలోక దేశాన్ని వారు ఆశించిన శ్రేష్ఠమైన పరలోక దేశంతో పోలుస్తుంది. అందుచేత ప్రధాన పాఠం స్థలసంబంధమైన స్పష్టమైన భావాన్ని నిలుపుతుంది; దాన్ని రూపకాలంకారంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. వాస్తవానికి విరుద్ధమైన షరతును ‘ఉండి ఉంటే ... ఉండేది’ నిర్మాణంతో సహజంగా తెలియజేశాం. ‘దేశం’ రాజకీయ రాజ్యాన్ని తప్పనిసరిగా సూచించకుండా సందర్భంలోని స్వదేశం/భూభాగం భావాన్ని మోస్తుంది.
