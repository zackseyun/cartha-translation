  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πίστει Μωϋσῆς μέγας γενόμενος ἠρνήσατο λέγεσθαι υἱὸς θυγατρὸς Φαραώ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/024.yaml
  text: By faith Moses[a], when he had grown up, refused to be called the son of Pharaoh’s daughter,
translation:
  language: te
  text: విశ్వాసం వల్ల మోషే[a] పెద్దవాడైనప్పుడు, ఫరో కుమార్తెకు కుమారుడని పిలవబడటానికి నిరాకరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “విశ్వసనీయత వల్ల,” లేదా “నమ్మకం వల్ల”; గ్రీకు: πίστει. ఇక్కడ ప్రధాన పాఠం ఈ అధ్యాయంలో పునరావృతమయ్యే “విశ్వాసం వల్ల” అనే సూత్రాన్ని అనుసరిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: విశ్వాసం వల్ల
  rationale: ఇది సాధనార్థక దత్తి విభక్తి ప్రయోగం. హెబ్రీయులు 11 అంతటా పునరావృతమయ్యే సూత్రానికి అనుగుణంగా, చర్యకు ప్రేరక సాధనాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: μέγας γενόμενος
  choice: పెద్దవాడైనప్పుడు
  rationale: ఇక్కడ ఈ పదబంధం హోదాలో గొప్పవాడవడం కంటే యౌవనప్రాయానికి లేదా ప్రౌఢత్వానికి చేరడాన్ని సూచిస్తుంది; కాలసంబంధ భావాన్ని కూడా నిలుపుతుంది.
- source_word: ἠρνήσατο
  choice: నిరాకరించాడు
  rationale: తనకు ఆపాదించబడిన గుర్తింపును ఉద్దేశపూర్వకంగా అంగీకరించకపోవడాన్ని సందర్భోచితంగా వ్యక్తం చేస్తుంది.
- source_word: λέγεσθαι
  choice: పిలవబడటానికి
  rationale: గ్రీకులోని కర్మణి క్రియార్థక రూపాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: ఫరో కుమార్తె కుమారుడని
  rationale: మోషేకు ఆపాదించబడిన నిర్దిష్ట రాజకుటుంబ గుర్తింపును సహజమైన తెలుగు సంబంధ నిర్మాణంలో తెలియజేస్తుంది.
- source_word: Φαραώ
  choice: ఫరో
  rationale: ఈజిప్టు పాలకుని బిరుదుకు తెలుగులో సాధారణంగా వాడే రూపం.
theological_decisions:
- issue: హెబ్రీయులు 11లో πίστις పదానికి అనువాదం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత; నమ్మకం
  rationale: ఈ అధ్యాయంలో πίστει పునరావృత సూత్రంగా ఉండి, విశ్వాసంతో చేపట్టిన చర్యలను ప్రధానంగా చూపుతుంది. ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచడం ద్వారా పదంలోని అర్థవిస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని కాలసంబంధ కృదంత భావం, కర్మణి రూపం, రాజకుటుంబ గుర్తింపు నిలుపబడ్డాయి.
