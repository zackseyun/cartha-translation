id: HEB.11.19
reference: Hebrews 11:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός· ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: te
  text: దేవుడు మృతులలోనుండి కూడా లేపగలడని అబ్రాహాము ఆలోచించాడు; అందువల్ల[a] అతడు ఇస్సాకును సాదృశ్యంగా తిరిగి పొందాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడినుండి.” అంటే, ఒక విధంగా అతడు ఇస్సాకును మృతులలోనుండి తిరిగి పొందినట్లైంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενος
  choice: ఆలోచించాడు
  rationale: అబ్రాహాము తనలో తాను తర్కించి ఒక నిర్ధారణకు వచ్చిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ ἐκ νεκρῶν ἐγείρειν
  choice: మృతులలోనుండి కూడా లేపగలడు
  rationale: καί యొక్క ఉద్ఘాటనను ‘కూడా’తో, పునరుత్థానార్థకమైన ἐγείρειν ను ‘లేపు’తో వ్యక్తం చేస్తుంది.
- source_word: δυνατὸς ὁ θεός
  choice: దేవుడు ... లేపగలడు
  rationale: దేవుని సామర్థ్యాన్ని సూచించే గ్రీకు విశేషణ నిర్మాణాన్ని తెలుగులో సహజమైన క్రియారూపంతో అందిస్తుంది.
- source_word: ὅθεν
  choice: అందుచేత
  rationale: ఇక్కడ ముందున్న అబ్రాహాము విశ్వాసపూర్వక ఆలోచననుండి వచ్చిన ఫలితాన్ని అనుసంధానించే అనుమానార్థక/నిష్కర్షాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది; ‘అక్కడినుండి’ అనే సాధ్యమైన సంబంధార్థం సందర్భంలో అసహజంగా ఉంటుంది.
- source_word: ἐν παραβολῇ
  choice: ఉపమానరీతిగా చెప్పాలంటే
  rationale: ఇస్సాకు నిజంగా పునరుత్థానం పొందలేదని అతిగా వివరణ చేయకుండా, అతన్ని తిరిగి పొందడం మరణం నుండి పొందినట్లున్న సాదృశ్యాన్ని కాపాడుతుంది.
- source_word: ἐκομίσατο
  choice: తిరిగి పొందాడు
  rationale: బలి ఇవ్వబోయిన కుమారుణ్ణి కోల్పోకుండా మళ్లీ పొందిన సందర్భార్థాన్ని మధ్యమవాచక రూపానికి తగినట్లు స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ఇస్సాకును ‘తిరిగి పొందడం’ యొక్క స్వభావం
  choice: ఉపమానరీతిగా తిరిగి పొందాడు
  alternative: ఒక ఉపమానంగా తిరిగి పొందాడు; సూచనాత్మకంగా మరణం నుండి తిరిగి పొందాడు
  rationale: ἐν παραβολῇ ఇస్సాకు నిజంగా పునరుత్థానం పొందాడని చెప్పకుండా, జరిగినది పునరుత్థానానికి సాదృశ్యమైనదని సూచిస్తుంది. అనువాదం ఆ సాదృశ్యాన్ని నిలుపుతూ నిర్దిష్టమైన క్రీస్తుసంబంధిత ప్రతిరూప వివరణను బలవంతంగా చేర్చదు.
- issue: ὅθεν యొక్క సంబంధం
  choice: అందుచేత
  alternative: అక్కడినుండి; దానినుండి
  rationale: ఈ పదం మూలం/స్థలాన్ని లేదా నిష్కర్షను సూచించగలదు. సందర్భంలో అబ్రాహాము చేసిన ఆలోచనకు వచ్చిన ఫలితంగా ఇస్సాకును తిరిగి పొందడం ప్రధాన భావం; ఇతర సాధ్యతను పాదటిప్పణిలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘మృతులలోనుండి లేపడం’ అనే స్థిరమైన పునరుత్థాన పదబంధాన్ని, ‘ఉపమానరీతిగా’ అనే మూలంలోని ఉద్దేశపూర్వక సాదృశ్యాన్ని నిలిపాం.
