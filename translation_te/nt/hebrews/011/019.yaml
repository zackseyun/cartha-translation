- from: దేవుడు మృతులలోనుండి కూడా లేపగలడని అబ్రాహాము ఆలోచించాడు. అందుచేత, ఉపమానరీతిగా చెప్పాలంటే, అతడు ఇస్సాకును తిరిగి పొందాడు.[a]
  to: దేవుడు మృతులలోనుండి కూడా లేపగలడని అబ్రాహాము ఆలోచించాడు; అందువల్ల[a] అతడు ఇస్సాకును సాదృశ్యంగా తిరిగి పొందాడు.
