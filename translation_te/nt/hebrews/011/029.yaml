id: HEB.11.29
reference: Hebrews 11:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: te
  text: విశ్వాసంతో వారు ఎర్ర సముద్రాన్ని పొడి నేలగుండా నడిచినట్లుగా దాటారు.[a] ఐగుప్తీయులు అదే మార్గంలో దాటడానికి ప్రయత్నించి మింగివేయబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెల్లుల సముద్రం.” ఇక్కడి గ్రీకు పాఠంలో “ఎర్ర సముద్రం” (Ἐρυθρὰν Θάλασσαν) అని ఉంది; అయితే నిర్గమకాండంలోని మూల హీబ్రూ స్థలనామాన్ని కొందరు “రెల్లుల సముద్రం” అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: విశ్వాసంతో
  rationale: సాధనం లేదా మార్గాన్ని సూచించే దత్తి విభక్తి. హెబ్రీయులకు 11లో పునరావృతమయ్యే ప్రధాన సూత్రాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: διέβησαν
  choice: దాటారు
  rationale: ఒక వైపు నుండి మరొక వైపుకు వెళ్లడాన్ని సూచించే διαβαίνω క్రియకు సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: ఎర్ర సముద్రాన్ని
  rationale: గ్రీకు పాఠంలో ఉన్న పేరును నేరుగా అనుసరిస్తుంది; నిర్గమకాండంలోని హీబ్రూ స్థలనామానికి సంబంధించిన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: పొడి నేల మీద నడిచినట్లుగా
  rationale: ὡς అనే పోలికను నిలుపుతూ, సముద్రాన్ని దాటే సందర్భంలో διὰ యొక్క మార్గార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἧς πεῖραν λαβόντες
  choice: కూడా అలాగే దాటడానికి ప్రయత్నించినప్పుడు
  rationale: πεῖραν λαμβάνειν అనే ప్రయోగం ‘ప్రయత్నించడం’ అని అర్థం. ἧς సూచించే అదే దాటే కార్యంతో సంబంధాన్ని ‘అలాగే’ ద్వారా స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: οἱ Αἰγύπτιοι
  choice: ఐగుప్తీయులు
  rationale: నిర్గమ సంఘటనలో ఇశ్రాయేలీయులను వెంబడించిన ఐగుప్తు పక్షాన్ని సూచించే సాంప్రదాయిక తెలుగు జాతినామం.
- source_word: κατεπόθησαν
  choice: మింగివేయబడ్డారు
  rationale: καταπίνω యొక్క సజీవమైన ‘మింగివేయు’ రూపకాన్ని, అలాగే గ్రీకులోని కర్మణి ప్రయోగాన్ని నిలుపుతుంది; ‘మునిగిపోయారు’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: హెబ్రీయులకు 11లో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ అధ్యాయమంతటా Πίστει అనే పునరావృత సూత్రం విశ్వాసాన్ని ప్రధాన అంశంగా చూపుతుంది. ఈ సందర్భంలో ‘విశ్వసనీయత’ కంటే ‘విశ్వాసం’ అనేది వ్యక్తులు దేవునిపై ఆధారపడటాన్ని బాగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని పోలిక, ప్రయత్నం, కర్మణి రూపకాన్ని సాధ్యమైనంత సహజంగా నిలిపాం.
