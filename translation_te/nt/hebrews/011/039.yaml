  text: ⸀καὶ πάντες μαρτυρηθέντες διὰ τῆς πίστεως οὐκ ἐκομίσαντο τὴν ἐπαγγελίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: te
  text: విశ్వాసం ద్వారా అనుకూల సాక్ష్యం పొందిన వీరందరూ[a] ఆ వాగ్దానాన్ని పొందలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమోదం పొందిన’ లేదా ‘వారి గురించి అనుకూల సాక్ష్యం ఇవ్వబడిన.’ గ్రీకు కృదంతం, విశ్వాసం ద్వారా వీరి గురించి అనుకూల సాక్ష్యం ఇవ్వబడిందనే భావాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ వాగ్దానాన్ని సాధించలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: తెలుగులో ఈ వాక్యం ముందున్న జాబితాకు సహజమైన సారాంశంగా నిలుస్తుంది; తప్పనిసరి కాని ‘మరియు’ను చేర్చకుండా అనుసంధాన భావాన్ని ప్రవాహంలోనే ఉంచాం.
- source_word: πάντες
  choice: వీరందరూ
  rationale: ముందుగా పేర్కొన్న విశ్వాసులందరినీ సూచించే అన్వయార్థాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: μαρτυρηθέντες
  choice: మంచి సాక్ష్యం పొందిన
  rationale: దేవుని అనుకూల సాక్ష్యం లేదా ఆమోదం పొందడమనే కర్మణి భావాన్ని, ఈ అధ్యాయంలోని పునరావృత అంశానికి అనుగుణంగా నిలుపుతుంది.
- source_word: διὰ τῆς πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనార్థాన్ని కాపాడుతుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: హెబ్రీయులకు 11లో ప్రధానంగా ఉన్న నమ్మకం/విశ్వాస భావానికి ఆధునిక ప్రామాణిక తెలుగు పదం.
- source_word: οὐκ ἐκομίσαντο
  choice: పొందలేదు
  rationale: κομίζω మధ్యమ రూపం ఇక్కడ వాగ్దానం చేయబడినదాన్ని పొందడం అనే భావంలో ఉంది; ‘పొందలేదు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: τὴν ἐπαγγελίαν
  choice: ఆ వాగ్దానాన్ని
  rationale: గ్రీకులోని ఏకవచన నిర్దిష్ట పదబంధాన్ని కాపాడి, దాని నెరవేర్పు లేదా వారసత్వమని అనువాదంలోనే విస్తరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ‘వాగ్దానం’ యొక్క సందర్భార్థం
  choice: ఆ వాగ్దానాన్ని
  alternative: వాగ్దానం చేయబడినదాన్ని / వాగ్దాన నెరవేర్పును
  rationale: మూలపాఠం సంక్షిప్తంగా ఉంచిన అంత్యకాల సంబంధమైన భావాన్ని అనువాదంలో పరిష్కరించకుండా, 40వ వచనం దానిని వివరించేందుకు వీలు కల్పిస్తుంది.
- issue: μαρτυρηθέντες మరియు ప్రధాన క్రియ మధ్య సంబంధం
  choice: ‘మంచి సాక్ష్యం పొందిన ... పొందలేదు’ అనే నిర్మాణం
  alternative: ‘మంచి సాక్ష్యం పొందినప్పటికీ ... పొందలేదు’
  rationale: గ్రీకు కృదంతంలో ‘అయినప్పటికీ’ అనే concessive పదం స్పష్టంగా లేదు. సందర్భంలో విరుద్ధత ఉన్నా, దాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చకుండా నిర్మాణం ద్వారానే తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. మూలంలోని సంక్షిప్తతను, ‘వాగ్దానం’ అనే పదంలోని వ్యాఖ్యాన విస్తృతిని కాపాడాం; అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
