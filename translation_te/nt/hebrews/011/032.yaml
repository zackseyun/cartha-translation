id: HEB.11.32
reference: Hebrews 11:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: te
  text: ఇంకా ఏమి చెప్పాలి? గిద్యోను, బారాకు, సంసోను, యెఫ్తా, దావీదు, అలాగే సమూయేలు మరియు ప్రవక్తల గురించి నేను చెప్పుకుంటూ పోతే, నాకు సమయం చాలకపోతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత పదశః: “నేను వివరిస్తుండగా సమయం నాకు చాలకపోతుంది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: ఇంకా ఏమి చెప్పాలి?
  rationale: మరిన్ని ఉదాహరణలను సంక్షిప్తంగా ప్రస్తావించబోతున్న వక్త అడిగే అలంకారప్రశ్నగా సహజమైన ఆధునిక తెలుగు రూపం; గ్రీకు వాక్యంలోని ముందుకు నడిపించే భావాన్ని నిలుపుతుంది.
- source_word: ἐπιλείψει με γὰρ ... ὁ χρόνος
  choice: నాకు సమయం చాలదు
  rationale: ‘సమయం నన్ను విడిచిపెడుతుంది/విఫలపరుస్తుంది’ అనే పదశః నిర్మాణానికి బదులు, సమయం సరిపోదనే గ్రీకు నుడికార భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. సందర్భంలోని అలంకారిక, ఊహాత్మక భావం కూడా నిలుస్తుంది.
- source_word: διηγούμενον
  choice: నేను వివరిస్తూ పోతే
  rationale: కర్తతో ఏకీభవించే వర్తమాన కృదంతంలోని కొనసాగుతున్న కార్యాన్నీ, ఆ కార్యం జరిగితే సమయం చాలదనే సందర్భార్థాన్నీ వ్యక్తం చేస్తుంది.
- source_word: περὶ
  choice: గురించి
  rationale: తరువాత వచ్చే వ్యక్తులు కథనానికి అంశమని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: గిద్యోను, బారాకు, సమ్సోను, యెఫ్తా, దావీదు, సమూయేలు
  rationale: తెలుగు బైబిలు వాడుకలో గుర్తుపట్టదగిన, మూలపేర్లకు సమీపమైన ప్రామాణిక నామరూపాలు.
- source_word: τε καὶ
  choice: అలాగే
  rationale: దావీదుతో తరువాతి ప్రస్తావనను కలిపే స్వల్ప అదనపు భావాన్ని అనవసరమైన వ్యాఖ్యానం లేకుండా సహజంగా చూపిస్తుంది.
- source_word: τῶν προφητῶν
  choice: ప్రవక్తల
  rationale: ప్రవచన పరిచర్య చేసిన వ్యక్తుల సమూహాన్ని సూచించే సూటి బహువచన రూపం.
theological_decisions:
- issue: సమయం చాలదనే వాక్యంలోని అలంకారిక భావం
  choice: రచయితకు అసలు సమయమే లేదనే అక్షరార్థ వాదంగా కాక, అన్ని ఉదాహరణలను వివరించడానికి సమయం సరిపోదనే అలంకారిక ప్రకటనగా అనువదించబడింది.
  alternative: ‘నేను వివరిస్తుండగా సమయం నన్ను విడిచిపెడుతుంది’ వంటి మరింత పదశః భవిష్యత్ రూపం.
  rationale: గ్రీకు భవిష్యత్ క్రియ, కృదంత నిర్మాణం కలిసి ఇక్కడ సంక్షిప్తీకరణను సూచించే వక్తృత్వ ప్రయోగంగా పనిచేస్తాయి; తెలుగు నుడికారం ఆ సంభాషణాత్మక ఉద్దేశాన్ని కాపాడుతుంది.
- issue: చివరి పేర్ల అనుసంధానం
  choice: ‘దావీదు, అలాగే సమూయేలు మరియు ప్రవక్తలు’ అనే స్వల్ప అదనపు అనుసంధానం నిలుపబడింది.
  alternative: ‘దావీదు, సమూయేలు, ప్రవక్తలు’ అని అన్నిటినీ ఒకే వరుసలో ఉంచడం.
  rationale: τε καὶ లోని అదనపు అనుసంధాన భావాన్ని కాపాడుతూ, సమూయేలును ప్రవక్తల సమూహంతో పూర్తిగా సమానం చేయడం గానీ దానినుంచి సిద్ధాంతపరంగా వేరు చేయడం గానీ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. అలంకారప్రశ్నను సంక్షిప్తంగా ఉంచి, పేర్ల జాబితాలో మూలంలోని అనుసంధాన క్రమాన్ని సాధ్యమైనంత సహజంగా కాపాడాం.
