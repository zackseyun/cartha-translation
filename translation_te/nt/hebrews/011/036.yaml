translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. గ్రీకు వాక్యంలోని బాధల క్రమోద్ధృతిని నిలిపి, పెῖραν ἔλαβον అనే ప్రయోగంలోని ‘పరీక్ష/అనుభవం’ భావాన్ని పాదటిప్పణిలో భద్రపరచాం.
