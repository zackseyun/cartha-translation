  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: te
  text: మరికొందరు ఎగతాళులను, కొరడా దెబ్బలను అనుభవించారు[a]; అంతేకాక సంకెళ్లను, చెరను కూడా అనుభవించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎగతాళులు, కొరడా దెబ్బలు, అంతేకాక సంకెళ్లు, చెర అనే పరీక్షను ఎదుర్కొన్నారు.’ గ్రీకు భాషలో మరింత అక్షరార్థంగా ‘... పరీక్షను పొందారు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: మరికొందరు
  rationale: ముందు చెప్పిన విశ్వాసులకంటే భిన్నమైన మరో సమూహాన్ని సూచించే అనిర్దిష్ట బహువచనం; తెలుగులో సహజంగా వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: ἐμπαιγμῶν
  choice: ఎగతాళులను
  rationale: ప్రజల ఎదుట చేసే అపహాస్యం లేదా హేళన అనే భావాన్ని ఆధునిక సాధారణ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: μαστίγων
  choice: కొరడా దెబ్బలను
  rationale: కొరడాలతో కొట్టే శారీరక శిక్షను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πεῖραν ἔλαβον
  choice: అనుభవించారు
  rationale: అక్షరార్థంగా ‘పరీక్షను పొందారు’ అనే గ్రీకు ప్రయోగాన్ని, వారు ఆ బాధలను ఎదుర్కొన్నారనే భావంతో సహజ తెలుగులో అందిస్తుంది.
- source_word: ἔτι δὲ
  choice: అంతేకాక ... కూడా
  rationale: మొదట పేర్కొన్న బాధల నుంచి మరింత తీవ్రమైన నిర్బంధానికి వెళ్లే ఉద్ధృతిని తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: δεσμῶν
  choice: సంకెళ్లను
  rationale: నిర్బంధించడానికి ఉపయోగించే బంధనాలను స్పష్టంగా, దృశ్యమానంగా సూచిస్తుంది.
- source_word: φυλακῆς
  choice: చెరను
  rationale: కారాగారంలో నిర్బంధించబడిన స్థితిని సంక్షిప్తంగా, గంభీరమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
