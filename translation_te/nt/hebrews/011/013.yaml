  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: te
  text: వీరందరూ విశ్వాసంలో మరణించారు; వాగ్దానాలను పొందకుండానే, వాటిని దూరం నుంచి చూసి స్వాగతించి, తాము భూమిమీద పరదేశులమనీ తాత్కాలిక నివాసులమనీ ఒప్పుకున్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వాటిని పలకరించి” లేదా “వాటిని హత్తుకొని.” గ్రీకు క్రియకు పలకరించడం లేదా స్వాగతించడం అనే భావాలు ఉన్నాయి; ఇక్కడ దూరం నుంచి కనిపించిన వాగ్దానాల గురించి ఇది రూపకంగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “పరదేశ నివాసులమనీ.” ఈ గ్రీకు పదం ఒక ప్రాంతంలో నివసిస్తున్నప్పటికీ అక్కడ పూర్తి స్థిరమైన అనుబంధం లేదా హక్కు లేనివారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: విశ్వాసంలోనే
  rationale: κατά + accusative ఇక్కడ విశ్వాసానికి అనుగుణమైన స్థితి లేదా పరిధిని సూచిస్తుంది. ‘విశ్వాసంలోనే’ అనేది వారు మరణించే వరకూ కొనసాగించిన విశ్వాస వైఖరిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπέθανον
  choice: మరణించారు
  rationale: అలంకారరహితంగా గ్రీకు క్రియ యొక్క ప్రత్యక్ష అర్థాన్ని అందిస్తుంది.
- source_word: οὗτοι πάντες
  choice: వీరందరూ
  rationale: ముందుగా ప్రస్తావించిన వారందరినీ సూచించే demonstrative emphasis‌ను సహజంగా నిలుపుతుంది.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: వాగ్దానాలను పొందకపోయినా
  rationale: μήతో కూడిన participle‌ను concessive subordinate clause‌గా తెలుగులో సహజంగా వ్యక్తం చేస్తూ, బహువచనమైన ‘వాగ్దానాలు’ను నిలుపుతుంది.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: వాటిని దూరం నుంచి చూసి
  rationale: దూరం అనే రూపక-స్థల భావాన్ని, participial sequence‌ను స్పష్టంగా ఉంచుతుంది.
- source_word: ἀσπασάμενοι
  choice: వాటికి స్వాగతం పలికి
  rationale: ἀσπάζομαι యొక్క పలకరించడం/స్వాగతించడం అనే భావాన్ని, వాగ్దానాలు object‌గా ఉన్న రూపకప్రయోగంలో సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: ὁμολογήσαντες
  choice: ఒప్పుకుంటూ
  rationale: తాము ఎవరో బహిరంగంగా అంగీకరించి ప్రకటించిన భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ξένοι
  choice: పరదేశులు
  rationale: స్థిరమైన స్వదేశీయ belonging లేనివారు అనే సామాజిక భావాన్ని గౌరవప్రదమైన, బైబిలు సందర్భానికి తగిన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: παρεπίδημοί
  choice: తాత్కాలిక నివాసులు
  rationale: ఒక చోట నివసిస్తున్నప్పటికీ అక్కడ సంపూర్ణమైన స్థిర belonging లేని వారి స్థితిని, ‘ప్రవాసులు’ వంటి బలవంతపు బహిష్కరణ భావాన్ని జోడించకుండా తెలియజేస్తుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: నిర్దిష్ట ప్రాంతం కంటే విస్తృతమైన భూలోక జీవన సందర్భాన్ని ఇక్కడ బాగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: πίστις యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఇక్కడ పితరులు మరణం వరకూ కొనసాగించిన దేవునిపట్ల విశ్వాస వైఖరి ఉద్దేశించబడింది. ‘విశ్వాసం’ మూలపదంలోని సాధారణ ధార్మిక భావాన్ని నిలుపుతూ, ‘విశ్వసనీయత’ అని ప్రత్యేకంగా నిర్ణయించదు.
- issue: ἀσπασάμενοι యొక్క రూపకప్రయోగం
  choice: వాటికి స్వాగతం పలికి
  alternative: వాటిని పలకరించి; వాటిని హత్తుకొని
  rationale: నెరవేరని వాగ్దానాలను దూరం నుంచే సానుకూలంగా స్వీకరించిన భావాన్ని తెలియజేస్తుంది; ‘హత్తుకొని’ అనేది మరింత వ్యాఖ్యాత్మకమైనది.
- issue: παρεπίδημοί యొక్క సామాజిక/తీర్థయాత్రిక భావం
  choice: తాత్కాలిక నివాసులు
  alternative: ప్రవాసులు; పరదేశ నివాసులు
  rationale: ఈ పదం పూర్తి స్థిరత్వం లేదా పౌర belonging లేని నివాసులను సూచిస్తుంది. ‘ప్రవాసులు’ బలవంతపు దేశనిర్బంధాన్ని సూచించే అవకాశం ఉన్నందున ప్రధాన పాఠ్యంలో దాన్ని నివారించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ అనువదించబడింది. గ్రీకు వాక్యంలోని participial వరుసను తెలుగులో సహజమైన ఉపవాక్య క్రమంగా మార్చి, వాగ్దానాలు పొందకపోవడం మరియు విశ్వాసంలో మరణించడం మధ్య ఉన్న ఉద్వేగాన్ని నిలిపింది.
