revisions:
- from: విశ్వాసం వల్ల వేశ్యయైన రాహాబు, అవిధేయులైన వారితోపాటు నశించలేదు[a]; ఎందుకంటే ఆమె గూఢచారులను శాంతితో ఆహ్వానించింది[b].
  to: విశ్వాసం ద్వారా వేశ్యయైన రాహాబు, గూఢచారులను శాంతితో స్వీకరించి, అవిధేయత చూపిన వారితో కలిసి నశించలేదు[a][b].
  rationale: The revision removes the explicit causal “ఎందుకంటే” so that the Greek participle’s relation to the main verb is not over-specified. It also renders ἀπειθήσασιν as “అవిధేయత చూపిన” in the main text, while preserving the adjectival alternative in a footnote. The collective-perishing sense, the direct designation “వేశ్యయైన,” and all footnote anchors are retained.
