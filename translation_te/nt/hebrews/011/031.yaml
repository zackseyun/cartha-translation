  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: te
  text: విశ్వాసం ద్వారా వేశ్యయైన రాహాబు, గూఢచారులను శాంతితో స్వీకరించి, అవిధేయత చూపిన వారితో కలిసి నశించలేదు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అవిధేయులైన వారితోపాటు నశించలేదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “గూఢచారులను శాంతియుతంగా స్వీకరించి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: విశ్వాసం వల్ల
  rationale: సాధనార్థక దత్తివును సహజమైన తెలుగులో తెలియజేస్తూ, హెబ్రీయులు 11లో పునరావృతమయ్యే విశ్వాస ఉదాహరణ సూత్రాన్ని నిలుపుతుంది.
- source_word: Ῥαὰβ
  choice: రాహాబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἡ πόρνη
  choice: వేశ్యయైన
  rationale: πόρνη అనే పదం యొక్క ప్రత్యక్ష సామాజిక, నైతిక భావాన్ని పాతబడిన లేదా మృదూకరించిన పదజాలం లేకుండా తెలియజేస్తుంది.
- source_word: οὐ συναπώλετο
  choice: వారితోపాటు నశించలేదు
  rationale: సంయుక్త క్రియలోని ‘ఇతరులతో కలిసి నశించడం’ అనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τοῖς ἀπειθήσασιν
  choice: అవిధేయులైన వారితోపాటు
  rationale: ἀπειθέωలోని అవిధేయత అనే నైతిక-సంకల్ప భావాన్ని నిలుపుతుంది; ‘అవిశ్వాసులు’ అని మాత్రమే చెప్పి భావాన్ని కుదించదు.
- source_word: δεξαμένη
  choice: ఎందుకంటే ఆమె ... ఆహ్వానించింది
  rationale: ఆమె చేసిన కార్యం మరియు ఆమె నశించకపోవడం మధ్య సందర్భంలో కనిపించే కారణ సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకు కృదంతపు సంబంధానికి ఇతర అర్థసాధ్యతను పాదటిప్పణిలో ఉంచింది.
- source_word: τοὺς κατασκόπους
  choice: గూఢచారులను
  rationale: యెహోషువ సందర్భంలోని రహస్యంగా సమాచారం సేకరించడానికి పంపబడిన వ్యక్తులను సహజంగా సూచిస్తుంది.
- source_word: μετ’ εἰρήνης
  choice: శాంతితో
  rationale: వారిని విరోధం లేకుండా, సురక్షితంగా స్వీకరించిన తీరును తెలియజేస్తూ మూలంలోని ‘శాంతి’ నామవాచక రూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: హెబ్రీయులు 11లో πίστει అనే సూత్రప్రాయ ప్రయోగం
  choice: విశ్వాసం వల్ల
  alternative: నమ్మకం వల్ల; విశ్వసనీయత వల్ల
  rationale: ఈ అధ్యాయంలోని పేరుపొందిన ఉదాహరణల సూత్రంలో πίστις ప్రధానంగా ‘విశ్వాసం’ అనే భావాన్నే సూచిస్తుంది. ‘నమ్మకం’ సంబంధిత భావమైనా ఇక్కడి స్థిర సూత్రానికి తక్కువ అనుకూలం; ‘విశ్వసనీయత’ అని అనువదించడం వ్యక్తి గుణాన్ని అవసరానికి మించి ముందుకు తెస్తుంది.
- issue: ἀπειθήσασιν యొక్క భావం
  choice: అవిధేయులైన వారు
  alternative: అవిశ్వాసులు; అవిధేయత చూపిన వారు
  rationale: పదంలో అవిశ్వాసంతో సంబంధం ఉన్నప్పటికీ, సందర్భంలో దేవుని హెచ్చరికకు లోబడకపోవడం అనే సంకల్పపూర్వక అవిధేయత భావాన్ని ప్రధాన పాఠ్యం నిలుపుతుంది.
- issue: δεξαμένη కృదంతం ప్రధాన వాక్యంతో కలిగిన సంబంధం
  choice: కారణ సంబంధంగా ‘ఎందుకంటే’
  alternative: ‘గూఢచారులను శాంతితో స్వీకరించి’ అనే సందర్భార్థక రూపం
  rationale: రాహాబు చేసిన కార్యాన్ని ఆమె విశ్వాసానికి కనిపించే నిదర్శనంగా, ఆమె నశించకపోవడానికి సంబంధించిన కారణంగా సందర్భం సహజంగా చూపుతుంది. అయితే గ్రీకు కృదంతం సంబంధాన్ని వ్యాకరణపరంగా స్పష్టంగా నిర్దేశించనందున ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వేశ్య’ అనే ప్రత్యక్ష పదాన్ని మృదూకరించకుండా వాడింది. ‘వారితోపాటు’ ద్వారా συναπόλλυμι సంయుక్త భావం, ‘శాంతితో’ ద్వారా μετ’ εἰρήνης యొక్క బైబిలీయ నుడికారం నిలుపబడ్డాయి. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
