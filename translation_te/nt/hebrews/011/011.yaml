  to: విశ్వాసం ద్వారా సారా కూడా స్వయంగా సంతానాన్ని గర్భం ధరించే సామర్థ్యాన్ని పొందింది[a]. ఆమె తగిన వయసు దాటిపోయిన తర్వాత కూడా, వాగ్దానం చేసినవాడు నమ్మకమైనవాడని ఆమె భావించింది కాబట్టి ఇలా జరిగింది.
