  terminology: ‘విశ్వాసం,’ ‘సారా,’ ‘వాగ్దానం చేసినవాడు,’ ‘నమ్మకమైనవాడు’ ఆధునిక ప్రామాణిక తెలుగు మరియు పాఠ్యంలోని మతపరమైన పదజాలానికి తగినవి. పాదటిప్పణిలోని అక్షరార్థ ప్రత్యామ్నాయాన్ని మరింత నిష్పక్షపాతంగా, గ్రీకు పదబంధం అసాధారణతను కాపాడేలా సవరించాం.
