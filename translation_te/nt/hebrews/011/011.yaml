id: HEB.11.11
reference: Hebrews 11:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: te
  text: విశ్వాసం ద్వారా సారా కూడా స్వయంగా సంతానాన్ని గర్భం ధరించే సామర్థ్యాన్ని పొందింది[a]. ఆమె తగిన వయసు దాటిపోయిన తర్వాత కూడా, వాగ్దానం చేసినవాడు నమ్మకమైనవాడని ఆమె భావించింది కాబట్టి ఇలా జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “విత్తనాన్ని ఉంచుటకు శక్తి పొందింది.” గ్రీకు వ్యక్తీకరణ అసాధారణమైన నుడికారం; ఈ సందర్భంలో అది సంతానోత్పత్తి చేయగల సామర్థ్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: విశ్వాసం వల్ల
  rationale: హెబ్రీయులు 11లో పునరావృతమయ్యే ఈ ప్రయోగం సాధనాన్ని లేదా కారణాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘విశ్వాసం వల్ల’ అని అనువదించాం.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: సారా స్వయంగా కూడా
  rationale: καὶ మరియు బలప్రయోగ సర్వనామం సారాను ప్రత్యేకంగా, ఈ జాబితాలో మరొక ముఖ్య ఉదాహరణగా చూపుతున్నాయి.
- source_word: δύναμιν ... ἔλαβεν
  choice: శక్తి పొందింది
  rationale: గ్రీకు పదాల ప్రత్యక్ష భావాన్ని కాపాడుతూ తెలుగులో సహజమైన వ్యక్తీకరణను వాడాం.
- source_word: εἰς καταβολὴν σπέρματος
  choice: సంతానాన్ని గర్భం ధరించే
  rationale: ఈ అసాధారణ గ్రీకు నుడికారం సందర్భంలో సంతానోత్పత్తి సామర్థ్యాన్ని సూచిస్తుంది. సారానే వాక్యంలోని కర్తగా నిలిచేలా సహజంగా అనువదించాం; మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: ఆమె తగిన వయసు దాటిపోయినప్పటికీ
  rationale: సాధారణంగా తగినదిగా భావించే జీవనదశను దాటిపోవడాన్ని సూచిస్తుంది; మూలంలో లేని వివరాలను అధికంగా చేర్చకుండా భావాన్ని స్పష్టంగా తెలిపాం.
- source_word: ἐπεὶ
  choice: ఎందుకంటే అనే భావాన్ని వాక్య నిర్మాణంలో కారణ సంబంధంగా వ్యక్తపరిచాం
  rationale: తెలుగు వాక్య విభజనలో ‘అని భావించింది’ అనే కారణ వాక్యం ముందున్న ప్రకటనకు ఆధారాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πιστὸν
  choice: నమ్మకమైనవాడు
  rationale: వాగ్దానం చేసిన దేవుని విశ్వసనీయ స్వభావాన్ని తెలుగులో స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: ἡγήσατο
  choice: భావించింది
  rationale: పరిశీలించి ఒక నిర్ణయానికి రావడం లేదా ఒక విధంగా ఎంచడం అనే మూలపద భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὸν ἐπαγγειλάμενον
  choice: వాగ్దానం చేసినవాడు
  rationale: దేవుణ్ణి సూచించే ఈ నామీకృత కృదంతాన్ని అదనపు వివరణ లేకుండా మూల నిర్మాణానికి దగ్గరగా ఉంచాం.
theological_decisions:
- issue: వ్యాకరణపరంగా క్లిష్టమైన వాక్యంలో కర్త ఎవరు, సారా చేసినది ఏమిటి
  choice: సారానే కర్త; ఆమె సంతానాన్ని గర్భం ధరించే శక్తి పొందింది.
  alternative: అబ్రాహాము పరోక్షంగా ప్రధాన పాత్రలో ఉన్నాడు; లేదా సారా వంశాన్ని స్థాపించే శక్తి పొందింది.
  rationale: ఈ పాఠరూపంలో αὐτῇ Σάρρᾳ సహజంగా ἔλαβεν క్రియకు సారానే కర్త అని సూచిస్తుంది. καταβολὴ σπέρματος అక్షరార్థంగా పురుష సంబంధమైన భావాన్ని కలిగించగలిగినా, సందర్భం సారా విశ్వాసం మరియు వయసుకు అతీతమైన గర్భధారణను కేంద్రీకరిస్తుంది. అసాధారణ నుడికారాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: దేవుని గురించి πιστός పదం
  choice: నమ్మకమైనవాడు
  alternative: విశ్వసనీయుడు; నమ్మదగినవాడు
  rationale: సారా విశ్వాసానికి ఆధారం దేవుని వాగ్దానపాలనగల స్వభావమేనని ఇది తెలియజేస్తుంది; పాఠానికి మించిన సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని సారా-కర్త పఠనాన్ని నిలిపి, క్లిష్టమైన గ్రీకు సంతానోత్పత్తి నుడికారానికి ప్రధాన పాఠంలో సహజ భావానువాదం, పాదటిప్పణిలో అక్షరార్థ ప్రత్యామ్నాయం ఇచ్చాం.
