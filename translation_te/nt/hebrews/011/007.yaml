id: HEB.11.7
reference: Hebrews 11:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: te
  text: విశ్వాసంతో నోవహు, అప్పటికి ఇంకా కనిపించని సంగతుల గురించి దైవిక హెచ్చరికను పొంది[a], భయభక్తులతో[b] తన ఇంటివారి రక్షణ కోసం ఓడను నిర్మించాడు. దాని ద్వారా[c] అతడు లోకాన్ని దోషిగా తీర్చాడు; విశ్వాసం ప్రకారమైన నీతికి[d] వారసుడయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దైవిక ఉపదేశాన్ని పొంది” లేదా “దైవిక సందేశాన్ని పొంది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దైవభయంతో ప్రేరేపింపబడి.”
    reason: lexical_alternative
  - marker: c
    text: “దాని ద్వారా” అనేది వ్యాకరణపరంగా అత్యంత సహజంగా ఓడను సూచిస్తుంది; కొందరు దీన్ని విస్తృతంగా నోవహు విశ్వాసం లేదా అతని విధేయ స్పందనను సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: d
    text: “నీతి”కి బదులుగా “న్యాయం” అని కూడా అనువదించవచ్చు; అయితే ఇక్కడ విశ్వాసంతో సంబంధమున్న నీతి భావం సందర్భానికి మరింత సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: విశ్వాసంతో
  rationale: సాధనార్థక దత్తివిభక్తిని సహజమైన తెలుగులో చూపిస్తూ, హెబ్రీయులు 11లో పునరావృతమయ్యే నిర్మాణాన్ని నిలుపుతుంది.
- source_word: χρηματισθεὶς
  choice: దైవిక హెచ్చరికను పొంది
  rationale: ఈ దైవకర్మక నిష్పన్న క్రియ దైవసంబంధమైన సందేశం లేదా హెచ్చరిక అందుకోవడాన్ని సూచిస్తుంది; గ్రీకులో దేవుడు ప్రత్యక్షంగా పేర్కొనబడనందున ‘దేవునిచేత’ అని చేర్చకుండా దైవిక మూలాన్ని సూచిస్తుంది.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: అప్పటికి ఇంకా కనిపించని సంగతుల గురించి
  rationale: μηδέπω యొక్క కాలార్థాన్నీ, రాబోయే సంఘటనలు ఇంకా దృశ్యమవకపోవడాన్నీ సహజంగా నిలుపుతుంది.
- source_word: εὐλαβηθεὶς
  choice: భక్తితో కూడిన భయంతో
  rationale: కేవలం భయాందోళన కాకుండా, దైవిక హెచ్చరికకు భక్తిపూర్వకంగా స్పందించిన భావాన్ని కాపాడుతుంది.
- source_word: κατεσκεύασεν κιβωτὸν
  choice: ఓడను నిర్మించాడు
  rationale: నోవహు వృత్తాంతంలో κιβωτόςకు తెలుగులో స్థిరమైన సందర్భోచిత పదం ‘ఓడ’; κατεσκεύασεν ఉద్దేశపూర్వక నిర్మాణాన్ని తెలియజేస్తుంది.
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: తన ఇంటివారి రక్షణ కోసం
  rationale: οἶκοςను భవనం అనే అర్థంలో కాక గృహసమూహంగా చూపుతుంది; σωτηρία ఇక్కడ తక్షణ రక్షణ భావాన్ని కలిగి ఉంది.
- source_word: δι’ ἧς
  choice: దాని ద్వారా
  rationale: స్త్రీలింగ సంబంధసర్వనామానికి సమీప పూర్వపదమైన κιβωτός సహజమైన సూచ్యం; తెలుగు వాక్యంలో అది ఓడను స్పష్టంగా సూచిస్తుంది.
- source_word: κατέκρινεν τὸν κόσμον
  choice: లోకానికి తీర్పు తీర్చాడు
  rationale: నోవహు విశ్వాసపూర్వక విధేయత అవిశ్వాసి లోకాన్ని దోషిగా నిలిపిన భావాన్ని, అతడే అంతిమ న్యాయాధిపతి అన్న అపార్థం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: విశ్వాసానికి అనుగుణమైన నీతి
  rationale: κατά నిర్మాణాన్ని ‘అనుగుణమైన’గా నిలిపి, δικαιοσύνη యొక్క నీతి/న్యాయం మధ్య భావపరిధిని ప్రధాన పాఠంలో సంప్రదాయబద్ధమైన ‘నీతి’తో వ్యక్తం చేస్తుంది.
- source_word: ἐγένετο κληρονόμος
  choice: వారసుడయ్యాడు
  rationale: ఫలితంగా పొందిన స్థితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: χρηματισθεὶςలో దైవిక మూలాన్ని ఎలా చూపాలి
  choice: దైవిక హెచ్చరికను పొంది
  alternative: హెచ్చరించబడి; దేవునిచేత హెచ్చరించబడి
  rationale: క్రియ సాధారణంగా దైవసంబంధ సమాచారాన్ని సూచించినా గ్రీకు పాఠంలో θεός లేదు. అందువల్ల దైవిక స్వభావాన్ని చూపుతూ ‘దేవునిచేత’ అనే స్పష్టీకరణను ప్రధాన పాఠంలో చేర్చలేదు.
- issue: εὐλαβηθεὶς యొక్క భావం
  choice: భక్తితో కూడిన భయంతో
  alternative: భక్తితో; దైవభయంతో ప్రేరేపింపబడి
  rationale: ఈ పదం సాధారణ భయాన్ని మాత్రమే కాక భక్తిపూర్వక జాగ్రత్త, గౌరవభయం కలిసిన స్పందనను సూచిస్తుంది.
- issue: δι’ ἧς యొక్క సూచ్యం
  choice: ఓడను సూచించే ‘దాని ద్వారా’
  alternative: విశ్వాసం ద్వారా; నోవహు విధేయ స్పందన ద్వారా
  rationale: వ్యాకరణపరంగా సమీపంలోని స్త్రీలింగ నామవాచకం κιβωτός అత్యంత సహజమైన పూర్వపదం; అయినా విస్తృత సందర్భం విశ్వాసపూర్వక చర్యను కూడా ముందుకు తెస్తుంది.
- issue: δικαιοσύνη అనువాదం
  choice: నీతి
  alternative: న్యాయం; నీతిమంతత్వం
  rationale: వారసత్వం మరియు విశ్వాసానికి అనుగుణత అనే సందర్భంలో సంబంధాత్మక/నిబంధనాత్మక నీతి భావం ప్రధానంగా ఉంది; ‘న్యాయం’ అనే న్యాయవిచారణ భావం కూడా పదపరిధిలో ఉన్నందున పాదటీపులో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘ఇంటివారు,’ ‘ఓడ,’ ‘నీతి’ వంటి సహజ పదాలను వాడుతూ గ్రీకు వాక్యంలోని కారణ-ఫలిత సంబంధం, అస్పష్టతలు నిలుపబడ్డాయి. అన్ని పాదటీపు గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
