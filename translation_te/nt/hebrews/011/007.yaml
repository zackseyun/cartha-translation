  to: విశ్వాసంతో నోవహు, అప్పటికి ఇంకా కనిపించని సంగతుల గురించి దైవిక హెచ్చరికను పొంది[a], భయభక్తులతో[b] తన ఇంటివారి రక్షణ కోసం ఓడను నిర్మించాడు. దాని ద్వారా[c] అతడు లోకాన్ని దోషిగా తీర్చాడు; విశ్వాసం ప్రకారమైన నీతికి[d] వారసుడయ్యాడు.
