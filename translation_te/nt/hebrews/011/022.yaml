id: HEB.11.22
reference: Hebrews 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: te
  text: విశ్వాసంతో యోసేపు, చనిపోతుండగా[a], ఇశ్రాయేలు కుమారుల నిర్గమనం[b] గురించి ప్రస్తావించాడు; తన ఎముకల విషయమై ఆదేశాలిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన జీవితాంతాన్ని సమీపించినప్పుడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ఇశ్రాయేలు కుమారుల ‘బయలుదేరడం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: విశ్వాసం వల్ల
  rationale: హెబ్రీయులకు 11వ అధ్యాయంలో పునరావృతమయ్యే నిర్మాణానికి అనుగుణంగా, ఇక్కడ దత్తి విభక్తి సాధనార్థక భావాన్ని వ్యక్తం చేస్తుంది; యోసేపు విశ్వాసం ఆధారంగా చేసిన కార్యాన్ని ఈ పదబంధం సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τελευτῶν
  choice: తన జీవితాంతం సమీపించినప్పుడు
  rationale: వర్తమాన కృదంతం యోసేపు మరణానికి సమీపించిన సమయంలో జరిగిన కార్యాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన, గౌరవప్రదమైన వ్యక్తీకరణను ఉంచి, మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: περὶ τῆς ἐξόδου
  choice: నిర్గమనం గురించి
  rationale: ἔξοδος సాధారణంగా బయలుదేరడాన్ని సూచించినా, ఇక్కడ ఐగుప్తు నుండి ఇశ్రాయేలు వంశస్థుల భవిష్యత్తు నిర్గమనాన్ని స్పష్టంగా సూచిస్తుంది. ‘నిర్గమనం’ మూలపదాన్ని, చారిత్రక సందర్భాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: ఇశ్రాయేలు కుమారుల
  rationale: మూలంలోని స్పష్టమైన కుటుంబ సంబంధ పదమైన υἱῶν (‘కుమారులు’)ను సాధారణమైన ‘ఇశ్రాయేలీయులు’గా మార్చకుండా నిలిపింది.
- source_word: ἐμνημόνευσεν
  choice: ప్రస్తావించి
  rationale: περίతో కూడిన ఈ నిర్మాణంలో క్రియ కేవలం మనసులో జ్ఞాపకం చేసుకోవడం కాక, ఒక విషయం గురించి ప్రస్తావించడం లేదా మాట్లాడడం అనే భావం ఇస్తుంది.
- source_word: ἐνετείλατο
  choice: ఆదేశాలు ఇచ్చాడు
  rationale: మధ్యమ రూపంలోని ఈ క్రియ ఆజ్ఞాపించడం లేదా నిర్దేశాలు ఇవ్వడం అనే భావం కలిగి ఉంది. ‘ఆదేశాలు ఇచ్చాడు’ యోసేపు ఉద్దేశపూర్వకంగా ఇచ్చిన నిర్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: తన ఎముకల విషయమై
  rationale: మూలంలో ఉన్న స్పష్టమైన ‘ఎముకలు’ అనే పదాన్ని సాధారణీకరించి ‘అవశేషాలు’గా మార్చకుండా నిలిపింది; ఇది ఆదికాండంలోని యోసేపు అభ్యర్థనను ప్రతిధ్వనిస్తుంది.
theological_decisions:
- issue: హెబ్రీయులకు 11లో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ అధ్యాయమంతటా పునరావృతమయ్యే సూత్రవాక్య నిర్మాణంలో πίστις వ్యక్తి దేవునిపై ఉంచిన విశ్వాసాన్ని సూచిస్తుంది. ‘విశ్వసనీయత’ అనే సాధ్యమైన అర్థాన్ని ఇక్కడ ఎంచుకోవడం సందర్భానుసారం తక్కువ సహజం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని అనుసరించాం. ‘ఇశ్రాయేలు కుమారులు,’ ‘నిర్గమనం,’ ‘ఎముకలు’ అనే స్పష్టమైన మూలభాషా అంశాలను నిలిపి, అవసరమైన పదార్థ ప్రత్యామ్నాయాలను పాదసూచికల్లో ఇచ్చాం.
