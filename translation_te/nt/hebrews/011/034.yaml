id: HEB.11.34
reference: Hebrews 11:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: te
  text: అగ్ని శక్తిని ఆర్పారు; ఖడ్గపు అంచు[a] నుంచి తప్పించుకున్నారు; బలహీనత నుంచి బలం పొందారు; యుద్ధంలో పరాక్రమవంతులయ్యారు; విదేశీయుల సైన్యాలను[b] పారదోలారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఖడ్గపు నోళ్లు”; ఇది ఖడ్గపు పదునైన అంచును సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “శిబిరాలను”; ఇక్కడ ఈ పదం శిబిరమేసిన సైనిక దళాలను, అంటే సైన్యాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν
  choice: ఆర్పారు
  rationale: σβέννυμι యొక్క అగ్నిని ఆర్పడం అనే స్పష్టమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δύναμιν πυρός
  choice: అగ్ని శక్తిని
  rationale: కేవలం ‘అగ్నిని’ అని సరళీకరించకుండా, δύναμις సూచించే అగ్ని శక్తి లేదా ప్రభావాన్ని కాపాడుతుంది.
- source_word: ἔφυγον
  choice: తప్పించుకున్నారు
  rationale: ఈ సందర్భంలో కేవలం పారిపోవడం కాక, ఖడ్గం నుంచి సఫలంగా తప్పించుకోవడమే భావం.
- source_word: στόματα μαχαίρης
  choice: ఖడ్గపు అంచు
  rationale: అక్షరార్థమైన ‘ఖడ్గపు నోళ్లు’ అనే నుడికారానికి తెలుగులో సహజమైన అర్థసమాన రూపం.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: బలహీనత నుంచి బలం పొందారు
  rationale: ἀπό సూచించే ఆరంభ స్థితిని ‘నుంచి’ నిలుపుతుంది; గ్రీకు కర్మణి భావాన్ని తెలుగులో సహజంగా ‘బలం పొందారు’ ద్వారా వ్యక్తపరుస్తుంది.
- source_word: ἐγενήθησαν ἰσχυροὶ
  choice: పరాక్రమవంతులయ్యారు
  rationale: ముందటి వాక్యభాగంలోని ‘బలం’ పదాన్ని అనవసరంగా పునరావృతం చేయకుండా, యుద్ధ సందర్భంలో ἰσχυρός భావాన్ని తెలియజేస్తుంది.
- source_word: ἐν πολέμῳ
  choice: యుద్ధంలో
  rationale: πόλεμος యొక్క సైనిక సందర్భాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: παρεμβολὰς
  choice: సైన్యాలను
  rationale: పదానికి అక్షరార్థం ‘శిబిరాలు’ అయినా, ఇక్కడ అది శిబిరమేసిన సైనిక దళాలను సూచించే లక్షణార్థ ప్రయోగం.
- source_word: ἔκλιναν
  choice: పారదోలారు
  rationale: శత్రు దళాలను వెనుదిరిగి పారిపోయేలా చేయడం అనే సైనిక భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἀλλοτρίων
  choice: విదేశీయుల
  rationale: ఇతరులకు చెందిన లేదా పరాయి వారైన సైనిక బలగాలను సూచిస్తుంది; ‘విదేశీయుల’ అనేది సందర్భోచితమైన ఆధునిక తెలుగు.
theological_decisions:
- issue: విశ్వాసవీరుల విడుదలలు, విజయాల శ్రేణిని ఎంతవరకు అక్షరార్థంగా ఉంచాలి
  choice: అగ్ని, ఖడ్గం, బలహీనత, యుద్ధం, శత్రు సైన్యాలు అనే నిర్దిష్ట చారిత్రక-సైనిక చిత్రణను నిలుపడం
  alternative: వాటిని సాధారణ ఆధ్యాత్మిక ప్రమాదాలు, విజయాలుగా భావానువాదం చేయడం
  rationale: హెబ్రీయులకు 11 ఇశ్రాయేలు చరిత్రతో ముడిపడిన నిర్దిష్ట కార్యాలను వరుసగా ప్రస్తావిస్తుంది. మూలపాఠం చేయని ఆధ్యాత్మికీకరణను అనువాదం చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని వేగవంతమైన కార్యాల వరుసను అర్ధవిరామాలతో నిలిపాం. గ్రీకు ఆధారంగా [a] గుర్తును ఖడ్గపు నుడికారం వద్ద, [b] గుర్తును సైన్యాలు అనే సందర్భార్థ అనువాదం వద్ద ఉంచాం.
