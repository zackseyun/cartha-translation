id: HEB.11.23
reference: Hebrews 11:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: te
  text: విశ్వాసం ద్వారా, మోషే పుట్టినప్పుడు అతని తల్లిదండ్రులు ఆ శిశువు అందంగా ఉందని చూసి, రాజు జారీ చేసిన ఆజ్ఞకు భయపడకుండా అతనిని మూడు నెలలు దాచిపెట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చక్కనిదని” లేదా “విశిష్టమైనదని.” గ్రీకు పదం ἀστεῖον నిర్గమకాండం 2:2; అపొస్తలుల కార్యాలు 7:20ను ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: విశ్వాసం వల్ల
  rationale: సాధనాన్ని సూచించే దత్తివ విభక్తి; హెబ్రీయులు 11లో పునరావృతమయ్యే విశ్వాస మూలభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: γεννηθεὶς ἐκρύβη τρίμηνον
  choice: పుట్టినప్పుడు ... మూడు నెలలు దాచిపెట్టారు
  rationale: కాలార్థక భూతకృదంతాన్ని సహజ తెలుగు ఉపవాక్యంగా మార్చి, కర్తరివాక్య నిర్మాణంలో తల్లిదండ్రుల చర్యను స్పష్టంగా తెలిపింది.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: అతని తల్లిదండ్రులు
  rationale: పదశః ‘అతని తండ్రులు’ అయినా, సందర్భంలో ఈ బహువచనం తల్లిదండ్రులిద్దరినీ సూచిస్తుంది.
- source_word: ἀστεῖον τὸ παιδίον
  choice: ఆ శిశువు అందంగా
  rationale: ἀστεῖον అనే పదానికి అందమైన, చక్కని, విశిష్టమైన అనే భావపరిధి ఉంది; శిశువు సందర్భంలో ‘అందంగా’ సహజంగా ఉండి మూలంలోని అర్థసందిగ్ధతను పాదసూచికలో నిలుపుతుంది.
- source_word: οὐκ ἐφοβήθησαν
  choice: భయపడకుండా
  rationale: విశ్వాసానికి, రాజాజ్ఞ పట్ల భయానికి మధ్య ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగు వాక్యప్రవాహంలో కాపాడుతుంది.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: రాజు జారీచేసిన ఆజ్ఞ
  rationale: διάταγμα అధికారికంగా జారీచేసిన ఆదేశాన్ని సూచిస్తుంది; ఈ ఎంపిక దాని రాజపరమైన అధికార స్వభావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: మోషేను దాచడానికి తల్లిదండ్రుల ప్రేరణ స్వభావం
  choice: వారి చర్యను విశ్వాసం వల్ల చేసినదిగా, శిశువు అందంగా ఉండడం గమనించడానికీ రాజాజ్ఞకు భయపడకపోవడానికీ అనుసంధానించి అనువదించడం
  alternative: శిశువు అందమే ఏకైక ప్రేరణ అని లేదా అతని రూపం ఒక ప్రత్యేక దైవిక సూచన అని స్పష్టీకరించడం
  rationale: వాక్యం మొత్తాన్ని ‘విశ్వాసం వల్ల’ అనే మాట నియంత్రిస్తుంది; అదే సమయంలో శిశువు ἀστεῖονగా కనిపించడం, రాజాజ్ఞకు వారు భయపడకపోవడం రెండింటినీ చెబుతుంది. మూలంలో లేనంతగా అద్భుత సూచన భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని పాటించాం. తెలుగు సహజత్వం కోసం గ్రీకు కర్మణి నిర్మాణాన్ని కర్తరి నిర్మాణంగా మార్చినా, మోషేను దాచినవారు అతని తల్లిదండ్రులేననే భావం యథాతథంగా ఉంది.
