review_pass:
  verdict: revise
  source_fidelity: The draft correctly supplies the implicit feminine noun from the preceding context and accurately conveys the contrast, heavenly qualification, divine naming formula, and prepared city. However, the placement of “వారిని బట్టి” makes the relationship between “not ashamed” and “to be called their God” less direct than in Greek.
  naturalness: “వారి దేవుడని పిలిపించుకోవడానికి దేవుడు వారిని బట్టి సిగ్గుపడడు” is grammatically possible but awkward and needlessly separates the infinitival complement from the verb. Placing “వారి దేవుడని పిలిపించుకోవడానికి” immediately with “సిగ్గుపడడు” is natural modern Telugu.
  terminology: “మేలైన స్వదేశం,” “పరలోకానికి చెందిన,” “వారి దేవుడు,” and “నగరం” are appropriate and preserve the source’s register and theological restraint. “పరలోకానికి చెందిన స్వదేశం” is clearer than the pronoun “దాన్ని,” whose referent is slightly less explicit.
  issues:
  - severity: medium
    issue: Awkward rendering of οὐκ ἐπαισχύνεται ... θεὸς ἐπικαλεῖσθαι αὐτῶν
    rationale: The phrase “వారిని బట్టి సిగ్గుపడడు” foregrounds ‘because/of them’ and places the key expression ‘to be called their God’ at a distance. The Greek’s central assertion is that God is not ashamed to be called their God; Telugu should retain that construction directly.
  - severity: low
    issue: Pronoun in “పరలోకానికి చెందినదాన్ని”
    rationale: Although understandable, the pronoun makes the supplied implicit noun less explicit. Repeating “స్వదేశాన్ని” after the explanatory dash is smoother and more transparent in Telugu.
  revised_text: కాని నిజానికి వారు మేలైన స్వదేశాన్ని[a]—అంటే పరలోకానికి చెందిన స్వదేశాన్ని—ఆకాంక్షిస్తున్నారు. అందువల్ల దేవుడు వారి దేవుడని పిలిపించుకోవడానికి సిగ్గుపడడు, ఎందుకంటే ఆయన వారి కోసం ఒక నగరాన్ని సిద్ధం చేశాడు.
