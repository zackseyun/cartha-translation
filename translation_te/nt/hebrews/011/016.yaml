id: HEB.11.16
reference: Hebrews 11:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: te
  text: కాని నిజానికి వారు మేలైన స్వదేశాన్ని[a]—అంటే పరలోకానికి చెందిన స్వదేశాన్ని—ఆకాంక్షిస్తున్నారు. అందువల్ల దేవుడు వారి దేవుడని పిలిపించుకోవడానికి సిగ్గుపడడు, ఎందుకంటే ఆయన వారి కోసం ఒక నగరాన్ని సిద్ధం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశాన్ని.’ గ్రీకులో ఇక్కడ నామవాచకం స్పష్టంగా లేదు; స్త్రీలింగ విశేషణం సందర్భంలోని ‘స్వదేశం/దేశం’ అనే భావాన్ని తిరిగి సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: కాని నిజానికి
  rationale: ఇది ముందరి వచనంలోని ఊహాత్మక అవకాశానికి భిన్నంగా ప్రస్తుతం ఉన్న వాస్తవాన్ని సూచించే వ్యతిరేకార్థక సంధి. కేవలం కాలార్థకమైన ‘ఇప్పుడు’ కంటే ‘కాని నిజానికి’ తార్కిక వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κρείττονος
  choice: మేలైన
  rationale: ‘మరింత శ్రేష్ఠమైనది/మెరుగైనది’ అనే తులనాత్మక భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; హెబ్రీయులకు పత్రికలోని శ్రేష్ఠతకు సంబంధించిన పునరావృత పదప్రయోగాన్నీ నిలుపుతుంది.
- source_word: ὀρέγονται
  choice: ఆకాంక్షిస్తున్నారు
  rationale: ఈ మధ్యమపద క్రియలో ఉన్న బలమైన కోరిక, దానివైపు సాగాలనే భావాన్ని ‘ఆకాంక్షిస్తున్నారు’ సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: κρείττονος ... ἐπουρανίου
  choice: మేలైన స్వదేశాన్ని—అంటే పరలోకానికి చెందినదాన్ని
  rationale: గ్రీకులో నామవాచకం వెలిబుచ్చకపోయినా, స్త్రీలింగ విశేషణాలు 14వ వచనంలోని πατρίς భావాన్ని తిరిగి సూచిస్తున్నాయి. ‘స్వదేశం’ నివాసం, స్వగృహభూమి అనే సందర్భోచిత భావాన్ని ఇస్తుంది; ‘పరలోకానికి చెందినది’ ἐπουρανίου యొక్క విశేషణ భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: διὸ
  choice: అందువల్ల
  rationale: వారి పరలోక స్వదేశ ఆకాంక్ష నుండి దేవుని స్పందనకు వచ్చే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: οὐκ ἐπαισχύνεται αὐτοὺς
  choice: దేవుడు వారిని బట్టి సిగ్గుపడడు
  rationale: సిగ్గు/గౌరవానికి సంబంధించిన మూలపాఠ భావాన్నీ, αὐτούς అనే వారిని సూచించే కర్మభావాన్నీ తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: వారి దేవుడని పిలిపించుకోవడానికి
  rationale: దేవుడు వారి దేవుడిగా పేర్కొనబడే పాత నిబంధన సంబంధ సూత్రాన్ని విస్తరించకుండా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡτοίμασεν
  choice: సిద్ధం చేశాడు
  rationale: దేవుడు పూర్తి చేసిన ఏర్పాటును స్పష్టంగా తెలియజేసే సహజమైన సమానార్థకం.
- source_word: πόλιν
  choice: ఒక నగరాన్ని
  rationale: అనిర్దిష్ట నామవాచకాన్ని అలాగే ఉంచి, హెబ్రీయులకు పత్రికలో కొనసాగుతున్న స్పష్టమైన అంత్యకాల నగర రూపకాన్ని సంరక్షిస్తుంది.
theological_decisions:
- issue: κρείττονος, ἐπουρανίου అనే స్త్రీలింగ విశేషణాలతో సూచితమైన నామవాచకం
  choice: సమీప సందర్భంలోని πατρίς భావం ఆధారంగా ‘స్వదేశం’ చేర్చడం
  alternative: ‘దేశం’ అని చేర్చడం లేదా ‘మేలైనదాన్ని’ అని నామవాచకాన్ని సూచితంగానే ఉంచడం
  rationale: మూలపాఠంలో ఈ వచనంలో నామవాచకం స్పష్టంగా లేకపోయినా, 14వ వచన సందర్భం స్వదేశం/సొంత భూమి భావాన్ని నియంత్రిస్తుంది. తెలుగులో నామవాచకాన్ని చేర్చడం అర్థాన్ని స్పష్టం చేస్తుంది; పాదసూచిక ‘దేశం’ అనే ప్రత్యామ్నాయాన్ని నమోదు చేస్తుంది.
- issue: ‘వారి దేవుడు’ అనే నిబంధనాత్మక సంబంధ సూత్రం
  choice: ‘వారి దేవుడని పిలిపించుకోవడానికి’ అని యథార్థ సంబంధ భాషను నిలుపడం
  alternative: ‘వారిని తన ప్రజలుగా అంగీకరించడానికి’ అని విస్తరించడం
  rationale: మూలపాఠం దేవుడు వారి దేవుడని పిలువబడటం గురించే చెబుతుంది. ‘తన ప్రజలు’ అని విస్తరించడం సందర్భానికి అనుకూలమైనా, వాక్యంలో స్పష్టంగా లేని భావాన్ని చేర్చుతుంది.
- issue: οὐκ ἐπαισχύνεται αὐτοὺς లో సిగ్గు భావం
  choice: ‘వారిని బట్టి సిగ్గుపడడు’ అని వ్యక్తం చేయడం
  alternative: ‘వారి దేవుడని పిలువబడటానికి వెనుకాడడు’
  rationale: ‘వెనుకాడడు’ సహజంగా ఉన్నా, మూలక్రియలోని సిగ్గు–గౌరవ ఉద్వేగాన్ని బలహీనపరుస్తుంది. ఎంపిక చేసిన రూపం ఆ ఉద్వేగాన్నీ ‘వారిని’ అనే కర్మసూచననూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘ఆకాంక్షిస్తున్నారు,’ ‘పరలోకానికి చెందినది,’ ‘వారిని బట్టి సిగ్గుపడడు’ అనే రూపాలు భావోద్వేగ బలం, మూలపాఠ సంబంధ నిర్మాణం, సహజ తెలుగు—ఈ మూడింటి మధ్య సమతుల్యతను ఉంచుతాయి.
