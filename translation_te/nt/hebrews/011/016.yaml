- from: కాని నిజానికి వారు మేలైన స్వదేశాన్ని[a]—అంటే పరలోకానికి చెందినదాన్ని—ఆకాంక్షిస్తున్నారు. అందువల్ల, వారి దేవుడని పిలిపించుకోవడానికి దేవుడు వారిని బట్టి సిగ్గుపడడు; ఎందుకంటే ఆయన వారి కోసం ఒక నగరాన్ని సిద్ధం చేశాడు.
  to: కాని నిజానికి వారు మేలైన స్వదేశాన్ని[a]—అంటే పరలోకానికి చెందిన స్వదేశాన్ని—ఆకాంక్షిస్తున్నారు. అందువల్ల దేవుడు వారి దేవుడని పిలిపించుకోవడానికి సిగ్గుపడడు, ఎందుకంటే ఆయన వారి కోసం ఒక నగరాన్ని సిద్ధం చేశాడు.
  rationale: The revision preserves the contextual supply of ‘homeland,’ the comparative and heavenly qualities, and the indefinite ‘city.’ It recasts the divine naming clause so that ‘not ashamed’ directly governs ‘to be called their God,’ matching the Greek syntax and yielding idiomatic modern Telugu. No doctrinal expansion has been introduced.
