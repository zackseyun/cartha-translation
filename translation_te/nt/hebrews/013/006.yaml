  terminology: “ప్రభువు” is the appropriate established rendering of Κύριος. “సహాయకుడు” retains the personal sense of βοηθός, while “మనిషి” preserves the singular generic force of ἄνθρωπος. No footnote is required in Telugu for this straightforward generic use.
