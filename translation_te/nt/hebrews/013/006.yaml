id: HEB.13.6
reference: Hebrews 13:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: te
  text: 'కాబట్టి మనం ధైర్యంగా ఇలా చెబుతాం: “ప్రభువు నాకు సహాయకుడు; నేను భయపడను. మనిషి నాకు ఏమి చేయగలడు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాక్యం నుంచి వచ్చే ఫలితాన్ని లేదా నిర్ధారణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: మనం ధైర్యంగా ఇలా చెబుతాం
  rationale: θαρροῦντας లోని ధైర్యం, నమ్మకం భావాన్ని నిలుపుతూ గ్రీకు నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Κύριος
  choice: ప్రభువు
  rationale: దైవిక బిరుదుగా κύριος కు సాధారణమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: ἐμοὶ βοηθός
  choice: నాకు సహాయకుడు
  rationale: దాతృ విభక్తిలోని ‘నాకోసం/నాకు’ అనే భావాన్ని నిలుపుతూ βοηθός యొక్క వ్యక్తిగత సహాయకుడనే అర్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ φοβηθήσομαι
  choice: నేను భయపడను
  rationale: భవిష్యత్ రూపాన్ని తెలుగు సహజ వాడుకలో దృఢమైన నిరాకరణగా అందిస్తుంది.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: మనిషి నాకు ఏమి చేయగలడు?
  rationale: ποιήσει రూపపరంగా భవిష్యత్తును సూచించినా, అలంకారిక ప్రశ్నలో మానవ బెదిరింపుల పరిమితిని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘చేయగలడు’ అనువైనది; ἄνθρωπος ను ఏ మానవుడినైనా ప్రతినిధిగా సూచించే ఏకవచన ‘మనిషి’గా ఉంచింది.
theological_decisions:
- issue: సామాన్యార్థక ἄνθρωπος అనువాదం
  choice: మనిషి
  alternative: ఒక మానవుడు; ఎవరైనా
  rationale: గ్రీకు ఏకవచనం ప్రతినిధి భావంలో మానవ వ్యక్తిని సూచిస్తుంది; ‘మనిషి’ ఆ ఏకవచన రూపాన్నీ సాధారణార్థాన్నీ నిలుపుతుంది.
- issue: అలంకారిక భవిష్యత్ ποιήσει యొక్క భావం
  choice: ఏమి చేయగలడు?
  alternative: ఏమి చేస్తాడు?
  rationale: మూలంలోని భవిష్యత్ రూపాన్ని ‘ఏమి చేస్తాడు?’ అని మరింత రూపనిష్ఠంగా అనువదించవచ్చు; అయితే సందర్భంలోని అలంకారిక ప్రశ్న మానవుడు చివరికి హాని చేయలేడనే ధైర్యాన్ని వ్యక్తం చేస్తుంది, దాన్ని ‘చేయగలడు?’ సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్యంలోని ధైర్య ప్రకటనకు తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది.
