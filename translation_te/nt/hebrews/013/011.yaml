id: HEB.13.11
reference: Hebrews 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: te
  text: ఎందుకంటే, ప్రధాన యాజకుడు పాపం కొరకు ఏ జంతువుల రక్తాన్ని పవిత్ర స్థలాల్లోకి[a] తీసుకువస్తాడో, ఆ జంతువుల శరీరాలు శిబిరం వెలుపల పూర్తిగా కాల్చివేయబడతాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్ర మందిరంలోకి.’ గ్రీకులో అక్షరార్థంగా ‘పవిత్ర స్థలాల్లోకి’ అని ఉంది; ఇది పవిత్ర ఆలయ పరిధిని సూచించే ఆరాధనా పదబంధం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కాల్చివేయబడతాయి.’ ఇక్కడి గ్రీకు క్రియ పూర్తిగా కాల్చివేయడాన్ని నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: ఏ జంతువుల ... వాటి శరీరాలు
  rationale: గ్రీకు సంబంధవాచక–నిర్దేశక నిర్మాణాన్ని సహజమైన తెలుగు సహసంబంధ నిర్మాణంతో వ్యక్తం చేస్తుంది; బలి సందర్భంలో ζῴωνకు ‘జంతువులు’ స్పష్టమైన ఎంపిక.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక ఆధార సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰσφέρεται
  choice: తీసుకువెళ్తాడో
  rationale: గ్రీకులోని కర్మణి రూపాన్ని తెలుగులో ప్రధాన యాజకుని స్పష్టమైన కర్తృత్వంతో సహజంగా వ్యక్తం చేసింది; రక్తాన్ని పవిత్ర స్థలాల్లోకి తీసుకెళ్లే ఆచార చర్యను నిలుపుతుంది.
- source_word: τὸ αἷμα
  choice: రక్తాన్ని
  rationale: బలికి సంబంధించిన ప్రత్యక్ష అర్థాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: περὶ ἁμαρτίας
  choice: పాపాల విషయంగా
  rationale: ‘పాప పరిహారార్థం’ లేదా ‘పాపబలిగా’ అని మరింత నిర్దిష్టంగా వ్యాఖ్యానించకుండా, పాపంతో సంబంధమున్న బలి సందర్భాన్ని విస్తృతంగానే నిలుపుతుంది.
- source_word: εἰς τὰ ἅγια
  choice: పవిత్ర స్థలాల్లోకి
  rationale: గ్రీకు బహువచన రూపాన్నీ, పవిత్ర ఆలయ ప్రదేశాన్ని సూచించే ఆరాధనా భాషనూ నిలుపుతుంది; ‘అతి పరిశుద్ధ స్థలం’ అని అవసరానికి మించి సంకుచితం చేయదు.
- source_word: διὰ τοῦ ἀρχιερέως
  choice: ప్రధాన యాజకుడు
  rationale: διά + genitive తెలిపే కర్తృత్వాన్ని తెలుగులో సహజమైన కర్తరి వాక్య నిర్మాణం ద్వారా తెలియజేస్తుంది.
- source_word: κατακαίεται
  choice: పూర్తిగా కాల్చివేయబడతాయి
  rationale: κατα- ఉపసర్గ సూచించగల సమగ్ర దహన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; సాధారణ ‘కాల్చివేయబడతాయి’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: శిబిరం వెలుపల
  rationale: ఇశ్రాయేలీయుల శిబిరం/గుడార ఆరాధన నేపథ్యాన్ని సహజంగా, ఖచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: εἰς τὰ ἅγια సూచించే పవిత్ర ప్రదేశం
  choice: పవిత్ర స్థలాల్లోకి
  alternative: పవిత్ర మందిరంలోకి; అతి పరిశుద్ధ స్థలంలోకి
  rationale: హెబ్రీయులకు పత్రికలో τὰ ἅγια పవిత్ర ఆలయ పరిధిని కొంత విస్తృతంగా సూచించగలదు. ఈ వచనంలోని గ్రీకు పదబంధం స్వయంగా ‘అతి పరిశుద్ధ స్థలం’ అనే సంకుచిత అర్థాన్ని తప్పనిసరి చేయదు; అందువల్ల అసలు బహువచనాన్నీ భావపరమైన విస్తృతినీ నిలిపాం.
- issue: περὶ ἁμαρτίας యొక్క బలి సంబంధ భావం
  choice: పాపాల విషయంగా
  alternative: పాప పరిహారార్థం; పాపబలిగా
  rationale: ఈ పదబంధానికి బలి సందర్భంలో పాప పరిహార సంబంధం ఉన్నప్పటికీ, దానిని ‘పాపబలి’ అనే నిర్దిష్ట బలి వర్గంగా మార్చకుండా మూలంలోని విస్తృత సంబంధాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ప్రధాన యాజకుడు,’ ‘పవిత్ర స్థలాలు,’ ‘శిబిరం’ వంటి పదాలతో బలి–ఆలయ సందర్భాన్ని నిలిపాం. ప్రధాన వాక్యంలో రెండు పాదసూచిక గుర్తులూ సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
