id: HEB.13.20
reference: Hebrews 13:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: te
  text: శాంతి దేవుడు, నిత్య నిబంధన రక్తం ద్వారా మృతులలోనుండి గొర్రెల గొప్ప కాపరియైన మన ప్రభువైన యేసును తిరిగి తీసుకొచ్చినవాడు[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిత్య నిబంధన రక్తం ద్వారా” అనే మాటలను “మృతులలోనుండి ... తిరిగి తీసుకొచ్చిన” అనే క్రియతో కాక, “గొర్రెల గొప్ప కాపరి” అనే పదబంధంతో అనుసంధానించవచ్చు. గ్రీకు నిర్మాణం ఈ రెండు అనుసంధానాలకు అవకాశం ఇస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: —
  rationale: δέ ఇక్కడ ఉపదేశాల నుంచి ఆశీర్వాద ప్రార్థనకు మార్పును సూచిస్తుంది. తెలుగులో ప్రత్యేక సంధానపదం చేర్చకుండానే వాక్య నిర్మాణం ఆ మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: θεὸς τῆς εἰρήνης
  choice: సమాధానకర్తయైన దేవుడు
  rationale: ‘సమాధానానికి మూలమూ దాతయూ అయిన దేవుడు’ అనే లక్షణార్థక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం దేవుడు శాంత స్వభావుడని మాత్రమే అర్థమయ్యేలా చేయదు.
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: మృతులలోనుండి పైకి తీసుకొచ్చిన
  rationale: ἀνάγω లోని ‘పైకి తీసుకురావడం’ అనే చిత్రాన్ని నిలుపుతూ, పునరుత్థాన సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: గొర్రెల గొప్ప కాపరి
  rationale: ποιμήν, πρόβατα పదాల కాపరి రూపకాన్ని మరియు μέγας ఇచ్చే ‘గొప్ప’ అనే విశేషణాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἐν αἵματι
  choice: రక్తం ద్వారా
  rationale: ἐν యొక్క సాధనార్థక భావాన్ని సహజంగా తెలుపుతుంది; ఆ రక్తం క్రియతో ఎలా సంబంధించిందో అవసరానికి మించి సిద్ధాంతీకరించదు.
- source_word: διαθήκης αἰωνίου
  choice: నిత్యమైన నిబంధన
  rationale: హెబ్రీయులకు పత్రికలో διαθήκη కి ‘నిబంధన’ సందర్భోచితం. గ్రీకులో నిర్దేశక ఉపపదం లేకపోవడాన్ని తెలుగులో సహజంగా ఉంచుతూ ‘నిత్యమైన’ అనే గుణాన్ని నిలుపుతుంది.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: మన ప్రభువు యేసు
  rationale: గ్రీకు పదక్రమంలోని గుర్తింపును గౌరవిస్తూ κύριος ను ‘ప్రభువు’గా అనువదిస్తుంది.
theological_decisions:
- issue: ἐν αἵματι διαθήκης αἰωνίου అనే పదబంధం దేనితో అనుసంధానమవుతుంది?
  choice: ప్రధాన పాఠ్యంలో ఇది దేవుడు యేసును మృతులలోనుండి తీసుకొచ్చిన క్రియతో సాధనార్థకంగా అనుసంధానమయ్యేలా ‘నిత్యమైన నిబంధన రక్తం ద్వారా ... తీసుకొచ్చిన’ అని ఉంచబడింది.
  alternative: దీనిని ‘నిత్యమైన నిబంధన రక్తంతో ఉన్న గొర్రెల గొప్ప కాపరి’ అన్నట్లు కాపరి పదబంధంతో మరింత దగ్గరగా అనుసంధానించవచ్చు; లేదా ‘నిత్య నిబంధన రక్తం మూలంగా’ అని ఇవ్వవచ్చు.
  rationale: గ్రీకు పదస్థానం స్వల్ప నిర్మాణాత్మక సందిగ్ధతను అనుమతిస్తుంది. ప్రధాన పఠనం సందర్భంలో దేవుని క్రియను విశేషించడం సహజమైనదైనా, పాదటిప్పణి ప్రత్యామ్నాయ అనుసంధానాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనాత్మక ఆశీర్వాద వాక్యానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ఈ వచనం 21వ వచనంలో కొనసాగుతుంది కాబట్టి ముగింపులో కామా ఉంచబడింది.
