revisions:
- from: మీ నాయకుల మాటకు ఒప్పించబడండి, వారికి లోబడండి[a]. ఎందుకంటే లెక్క అప్పగించవలసినవారిలా వారు మీ ప్రాణాల కోసం మెలకువగా కాపలా కాస్తున్నారు. వారు ఈ పని మూలుగుతూ కాక ఆనందంతో చేసేలా ఉండండి; వారు మూలుగుతూ చేయడం మీకు ప్రయోజనకరం కాదు.
  to: మీ నాయకుల మాటకు ఒప్పుకోండి, వారికి లోబడండి[a]. ఎందుకంటే, లెక్క చెప్పవలసినవారిగా వారు మీ ప్రాణాల విషయంలో మెలకువగా కాపలా కాస్తున్నారు. వారు ఈ బాధ్యతను మూలుగుతూ కాక ఆనందంతో నిర్వర్తించేలా ఉండండి; వారు దానిని మూలుగుతూ నిర్వర్తిస్తే అది మీకు ప్రయోజనకరం కాదు.
  rationale: The revision corrects the accountability phrase, improves the natural Telugu expression of Πείθεσθε without strengthening it into unquestioning obedience, and clarifies that the final “this” concerns the leaders’ fulfillment of their watchful responsibility. The footnote preserves the common stronger alternative and the literal persuasive nuance.
