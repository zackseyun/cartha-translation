id: HEB.13.17
reference: Hebrews 13:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: te
  text: మీ నాయకుల మాటకు ఒప్పుకోండి, వారికి లోబడండి[a]. ఎందుకంటే, లెక్క చెప్పవలసినవారిగా వారు మీ ప్రాణాల విషయంలో మెలకువగా కాపలా కాస్తున్నారు. వారు ఈ బాధ్యతను మూలుగుతూ కాక ఆనందంతో నిర్వర్తించేలా ఉండండి; వారు దానిని మూలుగుతూ నిర్వర్తిస్తే అది మీకు ప్రయోజనకరం కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మీ నాయకుల మాట వినండి, వారికి లోబడండి.” Πείθεσθε అనే గ్రీకు పదానికి ‘విధేయులవండి/మాట వినండి’ అనే భావం ఉండవచ్చు; మరింత అక్షరార్థంగా అది ఒప్పించబడడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: మాటకు ఒప్పించబడండి
  rationale: మధ్యమ/కర్మణి ఆజ్ఞారూపం ‘ఒప్పించబడండి’ అనే ప్రాథమిక భావాన్నీ, సందర్భంలో విశ్వాసంతో మాట వినడమనే విస్తృత భావాన్నీ మోస్తుంది. కేవలం ఆజ్ఞాపాలనగా కుదించకుండా సంబంధాత్మక స్పందనను నిలుపుతుంది.
- source_word: ἡγουμένοις
  choice: నాయకులు
  rationale: సమాజంలో గుర్తింపు పొందిన నాయకత్వ బాధ్యత వహించేవారిని సూచిస్తుంది; ‘పాలకులు’ కంటే అనవసరమైన అధికార ధ్వనిని నివారిస్తుంది.
- source_word: ὑπείκετε
  choice: లోబడండి
  rationale: దారివ్వడం, తలొగ్గడం, మరొకరి నాయకత్వానికి చోటివ్వడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మొదటి క్రియతో పూర్తిగా కలిపివేయకుండా రెండవ ఆజ్ఞను నిలుపుతుంది.
- source_word: ἀγρυπνοῦσιν
  choice: మెలకువగా కాపలా కాస్తున్నారు
  rationale: నిద్ర మానుకొని అప్రమత్తంగా ఉండే మూలచిత్రాన్ని, శ్రద్ధతో కాపాడే సందర్భార్థాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: ψυχῶν
  choice: ప్రాణాలు
  rationale: ψυχή ఇక్కడ వ్యక్తుల జీవితం/అంతరంగ శ్రేయస్సును సూచిస్తుంది. ‘ప్రాణాలు’ ఆధ్యాత్మిక గంభీరతను ఉంచుతూ తెలుగులో సహజంగా ఉంటుంది; మనిషిని శరీరానికి విరుద్ధమైన భాగంగా మాత్రమే నిర్వచించదు.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: లెక్క అప్పగించవలసినవారిలా
  rationale: భవిష్యత్తులో తమ బాధ్యత గురించి జవాబు చెప్పాల్సిన నాయకుల స్థితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; ఎవరికి లెక్క అప్పగిస్తారో మూలపాఠం స్పష్టంగా చెప్పనందున ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: μετὰ χαρᾶς
  choice: ఆనందంతో
  rationale: గ్రీకు ఉపసర్గ పదబంధాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: στενάζοντες
  choice: మూలుగుతూ
  rationale: విచారాన్ని నైరూప్యంగా మార్చకుండా నిట్టూర్పు/మూలుగు అనే స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: ἀλυσιτελὲς
  choice: ప్రయోజనకరం కాదు
  rationale: ‘లాభకరం కానిది’ అనే అర్థాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది; ‘హానికరం’ అని మూలపదం కంటే బలంగా చెప్పదు.
theological_decisions:
- issue: సంఘ నాయకుల పట్ల ఆజ్ఞ స్వభావం
  choice: గుర్తింపు పొందిన నాయకుల మాటకు స్పందనతో ఒప్పుకొని వారికి లోబడమనే పిలుపు
  alternative: నాయకులకు ప్రశ్నించకుండా సంపూర్ణ విధేయత చూపాలనే బలమైన ఆజ్ఞ
  rationale: Πείθεσθε మరియు ὑπείκετε అనే జంట క్రియలు విశ్వాసపూర్వక స్పందన, దారివ్వడం/లోబడడం రెండింటినీ సూచిస్తాయి. అయితే అవి నిరంకుశ అధికారాన్ని అనువాదంలో చేర్చవు. నాయకులు లెక్క అప్పగించాల్సిన బాధ్యతగల కాపరులనే కారణవాక్యం అధికారానికి జవాబుదారీతనపు పరిమితిని ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. రెండు ఆజ్ఞాక్రియల భేదాన్ని నిలిపి, అధికారవాద భావాన్ని పెంచలేదు. ప్రధాన పాఠ్యంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
