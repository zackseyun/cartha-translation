id: HEB.13.23
reference: Hebrews 13:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γινώσκετε τὸν ἀδελφὸν ⸀ἡμῶν Τιμόθεον ἀπολελυμένον, μεθ’ οὗ ἐὰν τάχιον ἔρχηται ὄψομαι ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: te
  text: మన సహోదరుడు తిమోతి విడుదల పొందాడని[a] తెలుసుకోండి. అతడు త్వరలో వస్తే, అతనితో కలిసి నేను మిమ్మల్ని చూస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విడిపించబడ్డాడు’; బహుశా చెర నుండి విడుదలై ఉండవచ్చు. ఈ క్రియకు ‘పంపివేయబడ్డాడు’ లేదా ‘తొలగించబడ్డాడు’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: తెలుసుకోండి
  rationale: వర్తమాన కర్తరి ఆజ్ఞార్థక బహువచన రూపంలోని సమాచారాత్మక ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: మన సహోదరుడు
  rationale: విశ్వాస సమాజంలోని కుటుంబ సంబంధ భాషను గౌరవప్రదంగా, సహజంగా వ్యక్తం చేస్తుంది; ఇక్కడ అది తిమోతిని సూచిస్తుంది.
- source_word: Τιμόθεον
  choice: తిమోతి
  rationale: వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: ἀπολελυμένον
  choice: విడుదల లభించింది
  rationale: ἀπολύω యొక్క సంపూర్ణ కర్మణి భావాన్ని, పూర్తయిన చర్యకు ప్రస్తుత ఫలితం ఉందనే సూచనతో అందిస్తుంది. నిర్బంధం నుండి విడుదల అన్నది సంభావ్యమైనా, మూలంలో అది స్పష్టంగా చెప్పబడలేదు.
- source_word: μεθ’ οὗ
  choice: అతనితో కలిసి
  rationale: తిమోతి రచయితతో కలిసి రానున్నాడనే సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: అతడు త్వరగా వస్తే
  rationale: షరతును నిలుపుతూ, τάχιον యొక్క సందర్భోచిత భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ὄψομαι ὑμᾶς
  choice: నేను మిమ్మల్ని చూస్తాను
  rationale: ὁράω యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; ‘సందర్శిస్తాను’ అనేది సందర్భార్థాన్ని మరింత వివరిస్తుంది గాని మూలపదం కంటే వ్యాఖ్యాత్మకం.
theological_decisions:
- issue: తిమోతి విడుదల స్వరూపం
  choice: ప్రధాన పాఠ్యంలో సాధారణంగా ‘విడుదల లభించింది’ అని ఉంచడం
  alternative: ‘చెర నుండి విడుదలయ్యాడు’ లేదా ‘పంపివేయబడ్డాడు’
  rationale: సందర్భం నిర్బంధం నుండి విడుదలను సూచించే అవకాశం ఉన్నప్పటికీ, ἀπολύω ‘విడుదల చేయడం,’ ‘పంపివేయడం,’ లేదా ‘వీడ్కోలు ఇవ్వడం’ అనే భావాలను కలిగి ఉండగలదు. అందువల్ల నిర్బంధాన్ని ప్రధాన పాఠ్యంలో ఖచ్చితంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని ఆజ్ఞ, షరతు, భవిష్యత్ ఉద్దేశం నిలుపబడ్డాయి; తిమోతి విడుదలకు సంబంధించిన అస్పష్టత పాదటిప్పణిలో భద్రపరచబడింది.
