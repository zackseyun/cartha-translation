  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: te
  text: మెస్సీయయైన యేసు నిన్నా, నేడూ, యుగయుగాలకూ మారనివాడే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు క్రీస్తు నిన్నా, నేడూ, యుగయుగాలకూ మారనివాడే.” గ్రీకు బిరుదు Χριστόςను “క్రీస్తు” అని లిప్యంతరీకరించవచ్చు లేదా “మెస్సీయ” అని అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగులో స్థిరంగా వాడుకలో ఉన్న రూపం.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ ఇది కేవలం ఇంటిపేరులా కాక యేసు యొక్క అభిషిక్తుని హోదాను సూచిస్తుంది; అందువల్ల మూలపదంలోని బిరుదు భావాన్ని తెలుగులో స్పష్టంగా తెలిపే ‘మెస్సీయ’ వాడబడింది.
- source_word: ἐχθὲς
  choice: నిన్న
  rationale: కాలాన్ని సూచించే ఈ క్రియావిశేషణానికి సహజమైన ప్రత్యక్ష తెలుగు సమానం.
- source_word: σήμερον
  choice: నేడు
  rationale: ‘నిన్న’తో జతగా వచ్చే కాలసూచనను గంభీరమైన ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ αὐτός
  choice: ఒకే విధంగా ఉన్నాడు
  rationale: గ్రీకు విధేయ ప్రయోగం ‘అదే/ఒకే వ్యక్తి’ అనే స్థిరత్వ భావాన్ని ఇస్తుంది; తెలుగులో అవసరమైన వర్తమాన క్రియను చేర్చి సహజంగా అనువదించబడింది.
- source_word: εἰς τοὺς αἰῶνας
  choice: యుగయుగాలకూ అలాగే ఉంటాడు
  rationale: ఈ ప్రయోగం అంతంలేని భవిష్యత్ స్థిరత్వాన్ని సూచిస్తుంది. తెలుగులో ‘యుగయుగాలకూ’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; వాక్యానికి అవసరమైన భవిష్యత్ క్రియను స్పష్టంచేస్తుంది.
- source_word: καὶ ... καὶ ... καὶ
  choice: నిన్న, నేడు ...; యుగయుగాలకూ
  rationale: తెలుగు వాక్యప్రవాహానికి అనుగుణంగా సంధులను విరామచిహ్నాలతో వ్యక్తం చేస్తూనే, మూడు కాల పరిమాణాల క్రమాన్నీ లయనూ నిలుపుతుంది.
theological_decisions:
- issue: యేసు యొక్క కాలాతీత స్థిరత్వం గురించి క్రీస్తుసంబంధ ప్రకటన
  choice: యేసు మెస్సీయ నిన్న, నేడు ఒకే విధంగా ఉన్నాడనీ, యుగయుగాలకూ అలాగే ఉంటాడనీ నేరుగా చెప్పడం
  alternative: ఈ వాక్యాన్ని క్రీస్తు మార్పులేనితనం లేదా దైవత్వం గురించిన విస్తృత సిద్ధాంత వివరణగా విపులీకరించడం
  rationale: మూలవాక్యం యేసు మెస్సీయ యొక్క నిరంతర ఏకత్వం/స్థిరత్వాన్ని ప్రకటిస్తుంది. దాని నుంచి మరిన్ని సిద్ధాంత నిర్ధారణలు చేయవచ్చుగానీ, అనువాదం మూలంలో ఉన్నదానికే పరిమితమై theological tension‌ను విపులీకరణ లేకుండా నిలుపుతుంది.
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: గ్రీకు Χριστός ‘అభిషిక్తుడు’ అనే బిరుదు భావాన్ని కలిగి ఉంది. ప్రధాన పాఠ్యంలో ఆ బిరుదు భావాన్ని ‘మెస్సీయ’గా వ్యక్తం చేసి, సంప్రదాయ లిప్యంతరీకరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘నేడు,’ ‘యుగయుగాలకూ’ అనే రూపాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి వాక్యపు లయను నిలుపుతాయి. గ్రీకులో స్పష్టమైన సంధానక్రియ లేకపోయినా తెలుగులో కాలక్రమాన్ని సహజంగా వ్యక్తం చేయడానికి ‘ఉన్నాడు/ఉంటాడు’ వాడబడ్డాయి.
