source:
  edition: SBLGNT
  text: ἔχομεν θυσιαστήριον ἐξ οὗ φαγεῖν οὐκ ἔχουσιν ἐξουσίαν οἱ τῇ σκηνῇ λατρεύοντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: te
  text: మనకు ఒక బలిపీఠం ఉంది. దాని నుండి తినే హక్కు గుడారంలో సేవ చేసేవారికి లేదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత నిర్దిష్టంగా, “గుడారం వద్ద పరిచర్య చేసేవారు” అని అనువదించవచ్చు. ఈ పదబంధం పాత నిబంధన పవిత్రస్థల సేవలో నిమగ్నమైనవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “బలిపీఠం” అనేది క్రీస్తునే, సిలువను, పరలోక బలిపీఠాన్ని, లేదా క్రీస్తు అర్పణవల్ల కలిగే బలి ప్రయోజనాలను సూచిస్తుందని వివిధ రీతుల్లో అర్థం చేసుకున్నారు. గ్రీకు పాఠ్యం ఇక్కడ ఈ చిత్రణను మరింత నిర్దిష్టంగా వివరించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχομεν
  choice: మనకు ... ఉంది
  rationale: వర్తమానకాల క్రియను సరళంగా ఉంచి, రచయిత తనను మరియు పాఠకులను కలుపుకొని మాట్లాడుతున్న భావాన్ని నిలిపింది.
- source_word: θυσιαστήριον
  choice: బలిపీఠం
  rationale: సాధారణంగా అర్థమయ్యే స్థిరమైన తెలుగు సమానార్థకం. దీనిని ‘బలి’ లేదా ‘సిలువ’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలంలోని రూపకాన్ని నిలిపింది.
- source_word: ἐξ οὗ
  choice: దాని నుండి
  rationale: ἐκ తెలిపే మూలం లేదా ఉద్భవ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేసి, బలిపీఠం నుండి తినడం అనే చిత్రణను కాపాడుతుంది.
- source_word: φαγεῖν
  choice: తినే
  rationale: ‘తినడం’ అనే సరళమైన అర్థాన్ని, ‘హక్కు లేదు’తో సహజంగా కలిసే తెలుగు నిర్మాణంలో ఇచ్చింది.
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: హక్కు ... లేదు
  rationale: ఆరాధనా సేవ సందర్భంలో పాలుపొందడానికి అధీకృత హక్కు లేకపోవడాన్ని ‘హక్కు లేదు’ స్పష్టంగా తెలియజేస్తుంది; కేవలం సామర్థ్యం లేదనే భావాన్ని ఇవ్వదు.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: ప్రత్యక్ష గుడారంలో సేవచేసేవారు
  rationale: λατρεύω ఇక్కడ సాధారణ ఆరాధనకన్నా పవిత్రస్థల సేవను సూచిస్తుంది. σκηνήకు హెబ్రీయులకు పత్రికలోని పాత నిబంధన ఆరాధనా సందర్భాన్ని గుర్తింపజేసే స్థిరమైన తెలుగు పదబంధం ‘ప్రత్యక్ష గుడారం’ను ఎంచుకుంది.
theological_decisions:
- issue: హెబ్రీయులకు 13:10లో ‘బలిపీఠం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘బలిపీఠం’ అనే నిర్దిష్టీకరించని ఆరాధనా చిత్రణను అలాగే ఉంచడం
  alternative: క్రీస్తే; సిలువ; పరలోక బలిపీఠం; క్రీస్తు అర్పణవల్ల కలిగే బలి ప్రయోజనాలు
  rationale: గ్రీకు వాక్యం ఈ బలిపీఠం దేనిని సూచిస్తుందో ఇక్కడ స్పష్టంగా చెప్పదు. ఒక వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని ఉద్దేశపూర్వక theological tensionను నిలిపి, అవకాశాలను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ప్రత్యక్ష గుడారం’ బైబిలు సందర్భానికి పరిచితమైన పదమైనప్పటికీ, సాధారణ పాఠకునికి అర్థం కావడానికి పాదసూచికలో ‘గుడారం’ అనే ప్రత్యామ్నాయం కూడా ఇచ్చబడింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
