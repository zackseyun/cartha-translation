  source_fidelity: 'ముసాయిదా మొత్తం భావాన్ని అనుసరిస్తుంది: περισσοτέρως యొక్క తులనాత్మక తీవ్రత, ప్రార్థనకు వెనుకకు సూచించే τοῦτο ποιῆσαι, మరియు రచయిత పాఠకుల వద్దకు పునరాగమనం/పునఃస్థాపనను ఆశించే ఉద్దేశం ఉన్నాయి. అయితే ‘తిరిగి చేర్చబడేలా’ తెలుగులో సహజంగా వ్యక్తిని ఒక సమూహంలో లేదా వ్యవస్థలో చేర్చడమనే అర్థాన్ని ఇస్తుంది; ఇక్కడ పాఠకుల దగ్గరకు మళ్లీ చేరడాన్ని స్పష్టంగా, కానీ పరిస్థితిని నిర్ణయించకుండా చెప్పాలి.'
  naturalness: ‘మీరు ఇలా చేయాలని ఇంకా ఎక్కువగా వేడుకుంటున్నాను’ అర్థమయ్యేది అయినప్పటికీ, ఉద్దేశార్థక భాగం ముందుకు రావడం మరియు ‘చేర్చబడేలా’ వాడకం వాక్యాన్ని అసహజంగా చేస్తున్నాయి. ‘నేను మళ్లీ మీ దగ్గరకు మరింత త్వరగా చేరడానికి, మీరు ఇలా చేయమని నేను మరింతగా వేడుకుంటున్నాను’ ఆధునిక ప్రామాణిక తెలుగులో ప్రవాహంగా ఉంది.
