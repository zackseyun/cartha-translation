id: HEB.13.12
reference: Hebrews 13:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: te
  text: అందుచేత యేసు కూడా తన సొంత రక్తం ద్వారా ప్రజలను పవిత్రపరచడానికి[a] ద్వారం వెలుపల బాధ అనుభవించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరిశుద్ధులుగా చేయడానికి’ లేదా ‘ప్రతిష్ఠించడానికి.’
    reason: lexical_alternative
  - marker: b
    text: ‘ద్వారం వెలుపల’ అనేది బహుశా యేసు బాధ అనుభవించిన యెరూషలేము వెలుపలి స్థలాన్ని సూచిస్తుంది; అంతకుముందు సందర్భంలో బలి అవశేషాలను శిబిరం వెలుపలికి తీసుకెళ్లే ఆచారాన్ని ఇది ప్రతిధ్వనింపజేస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: అందుచేత
  rationale: ముందున్న వాదన నుండి తీసుకున్న నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా కలుపుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: మునుపటి బలి సంబంధమైన నమూనాతో యేసును పోల్చి కలిపే భావాన్ని అతిశయింపకుండా నిలుపుతుంది.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: తెలుగు బైబిల్ వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἵνα ἁγιάσῃ
  choice: పవిత్రపరచడానికి
  rationale: ἵνα తో కూడిన ఉద్దేశ భావాన్ని సహజంగా వ్యక్తపరుస్తూ, ἁγιάζω యొక్క ఆరాధనా మరియు ఒడంబడిక సంబంధమైన భావాన్ని నిలుపుతుంది.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: తన సొంత రక్తం ద్వారా
  rationale: διά యొక్క సాధనార్థాన్ని, ἰδίου లోని స్వకీయ ఉద్ఘాటనను, హెబ్రీయులకు పత్రికలోని బలి చిత్రణను కాపాడుతుంది.
- source_word: τὸν λαόν
  choice: ప్రజలను
  rationale: మూలంలో ఉన్న నిర్దిష్ట ప్రజల భావాన్ని సందర్భం తెలియజేస్తుంది; ‘దేవుని’ వంటి మూలంలో లేని పదాన్ని చేర్చదు.
- source_word: ἔξω τῆς πύλης
  choice: ద్వారం వెలుపల
  rationale: గ్రీకులోని ఏకవచనాన్ని నిలుపుతూ, మూలంలో లేని ‘పట్టణ’ లేదా ‘యెరూషలేము’ అనే పదాలను ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἔπαθεν
  choice: బాధ అనుభవించాడు
  rationale: πάσχω యొక్క బాధపడటం అనే అర్థాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: బలి సంబంధమైన సందర్భంలో ἁγιάζω అనువాదం
  choice: పవిత్రపరచడానికి
  alternative: పరిశుద్ధులుగా చేయడానికి; ప్రతిష్ఠించడానికి
  rationale: ‘పవిత్రపరచు’ అనే రూపం ఆరాధనా, బలి, ఒడంబడిక సంబంధమైన విస్తృత భావాన్ని నిలుపుతుంది; దానిని కేవలం నైతిక మార్పుగా గానీ, ఏదైనా ప్రత్యేక సంప్రదాయ సిద్ధాంతంగా గానీ పరిమితం చేయదు.
- issue: τὸν λαόν యొక్క పరిధి
  choice: ప్రజలను
  alternative: దేవుని ప్రజలను
  rationale: సందర్భంలో ఒడంబడిక ప్రజలు ఉద్దేశించబడినప్పటికీ, గ్రీకు పాఠ్యం ‘ప్రజలను’ అని మాత్రమే చెబుతుంది; అందువల్ల ప్రధాన పాఠ్యంలో వివరణాత్మక పదాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే హెబ్రీయులకు పత్రికలోని బలి మరియు పవిత్రీకరణ సంబంధమైన గంభీరతను నిలిపే గౌరవప్రదమైన శైలి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
