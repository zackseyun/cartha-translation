id: HEB.13.16
reference: Hebrews 13:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: te
  text: మేలు చేయడాన్నీ, పంచుకోవడాన్నీ[b] నిర్లక్ష్యం చేయకండి[a]; ఎందుకంటే ఇలాంటి బలులతో దేవుడు సంతోషిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరచిపోకండి.’ గ్రీకు క్రియకు ఇది మరింత అక్షరార్థ అనువాదం; ఇక్కడ చేయవలసిన ఈ పనులను విస్మరించవద్దనే ఆచరణాత్మక భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పంచుకోవడం’ అనే మాటను ‘సహవాసం’ లేదా ‘ఉదారంగా ఇవ్వడం’ అని కూడా అనువదించవచ్చు. ఈ సందర్భంలో అది ఇతరులతో తమ వనరులను ఆచరణాత్మకంగా పంచుకోవడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: మేలు చేయడం
  rationale: ఈ నామవాచకం క్రియాశీలంగా మేలు చేయడాన్ని సూచిస్తుంది. ‘మేలు చేయడం’ ఆధునిక తెలుగులో సహజంగా ఉండి, దాని క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: κοινωνίας
  choice: పంచుకోవడం
  rationale: εὐποιΐας‌తో జతగా, ‘ఇలాంటి బలులు’ అనే తరువాతి మాటల వెలుగులో ఇది ఇతరులతో వనరులను ఆచరణాత్మకంగా పంచుకోవడాన్ని సూచిస్తుంది. ‘పంచుకోవడం’ భౌతిక ఉదారతను కలుపుకుంటూనే భావాన్ని అతిగా కుదించదు.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: నిర్లక్ష్యం చేయకండి
  rationale: క్రియకు అక్షరార్థంగా ‘మరచిపోకండి’ అనే భావం ఉన్నా, ఈ ఉపదేశ సందర్భంలో చేయవలసిన పనిని విస్మరించకూడదనే ఆచరణాత్మక బలం ఉంది.
- source_word: τοιαύταις ... θυσίαις
  choice: ఇలాంటి బలులవల్ల
  rationale: మేలు చేయడం, పంచుకోవడం దేవునికి అర్పించే బలుల వంటివని చెప్పే బలి రూపకాన్ని ఇది స్పష్టంగా నిలుపుతుంది. గ్రీకు దత్తి విభక్తిని సహజ తెలుగులో కారణ/సాధన భావంతో ‘వల్ల’గా ఇచ్చాం.
- source_word: εὐαρεστεῖται
  choice: సంతోషిస్తాడు
  rationale: దేవుడు ఇలాంటి బలులను బట్టి ప్రసన్నుడవుతాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ θεός
  choice: దేవుడు
  rationale: నామవిభక్తిలోని కర్తకు ప్రామాణిక తెలుగు అనువాదం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక ముందటి ఉపదేశంతో కొనసాగింపును సూచిస్తుంది. తెలుగులో వాక్యప్రవాహం ద్వారానే ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: ఈ వచనంలోని ‘బలులు’ స్వభావం
  choice: మేలు చేయడం, పంచుకోవడం దేవుణ్ణి సంతోషపరిచే బలులుగా రూపకాత్మకంగా చెప్పబడ్డాయి
  alternative: దీనిని ప్రధానంగా దానధర్మానికి ఆరాధనా ప్రత్యామ్నాయంగా మాత్రమే చూడడం; లేదా బలి భావం లేని సాధారణ నైతిక ప్రవర్తనగా చదవడం
  rationale: గ్రీకు పాఠం θυσίαις అనే బలి పదాన్ని నేరుగా ఉపయోగిస్తుంది. అనువాదం ఆ రూపకాన్ని నిలుపుతూ, దాన్ని కేవలం దానధర్మానికే పరిమితం చేయదు; అలాగే సాధారణ నీతిబోధగా చదును చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా అర్థమయ్యే శైలి. ‘బలులు’ అనే ఆరాధనా రూపకాన్ని యథాతథంగా నిలిపి, ‘పంచుకోవడం’లోని అర్థవిస్తృతిని పాదసూచికలో భద్రపరిచాం.
