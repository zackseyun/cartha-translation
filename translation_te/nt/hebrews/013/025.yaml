lexical_decisions:
- source_word: ἡ χάρις
  choice: కృప
  rationale: ఇది పత్రిక ముగింపులో వచ్చే ఆశీర్వాద సూత్రం. తెలుగు క్రైస్తవ వాడుకలోనూ సాధారణ ఆధునిక భాషలోనూ ‘కృప’ సంక్షిప్తంగా, గౌరవప్రదంగా మూలార్థాన్ని తెలియజేస్తుంది.
- source_word: μετὰ
  choice: తో ఉండుగాక
  rationale: μετά షష్ఠీ విభక్తితో ‘తో’ అనే అర్థమిస్తుంది. గ్రీకులో క్రియ లేకపోయినా ఆశీర్వాద వాక్యంలోని ఆకాంక్షార్థాన్ని సహజమైన తెలుగులో ‘ఉండుగాక’ అని వ్యక్తం చేయడం సముచితం.
- source_word: πάντων ὑμῶν
  choice: మీ అందరితో
  rationale: πάντων ὑμῶν శ్రోతలందరినీ స్పష్టంగా కలుపుతుంది. ‘మీ అందరితో’ దాని సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
