id: HEB.13.7
reference: Hebrews 13:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: te
  text: మీకు దేవుని వాక్యాన్ని మాట్లాడిన మీ నాయకులను జ్ఞాపకం చేసుకోండి. వారి జీవన విధానపు ఫలితాన్ని[a] శ్రద్ధగా పరిశీలిస్తూ, వారి విశ్వాసాన్ని[b] అనుకరించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఫలితం” అనే మాటను “అంతం” అని కూడా అనువదించవచ్చు; కొన్ని వ్యాఖ్యానాల్లో ఇది ప్రత్యేకంగా వారు మరణించిన తీరును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “విశ్వసనీయతను.” గ్రీకు పదానికి “విశ్వాసం” లేదా “విశ్వసనీయత” అనే రెండు అర్థాలు ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημονεύετε
  choice: జ్ఞాపకం చేసుకోండి
  rationale: వర్తమానకాల ఆజ్ఞ నిరంతరంగా జ్ఞాపకం ఉంచుకోవాలనే భావాన్ని కలిగిస్తుంది; ఈ తెలుగు రూపం సహజంగా ఉండి ఆ సందర్భార్థాన్ని మోయగలదు.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: మీ నాయకులను
  rationale: సమాజంలో గుర్తింపు పొందిన నాయకులను సూచిస్తుంది; ‘నాయకులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, రాజకీయ లేదా అతిగా అధికారవాద భావాన్ని రుద్దకుండా వారి నిజమైన అధికారాన్ని తెలియజేస్తుంది.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: మీకు దేవుని వాక్యాన్ని ప్రకటించిన
  rationale: ἐλάλησαν ప్రాథమికంగా ‘మాట్లాడారు’ అని అర్థమైనా, దేవుని వాక్యాన్ని శ్రోతలకు తెలియజేసిన సందర్భంలో ‘ప్రకటించిన’ సహజమైన తెలుగు; ‘దేవుని వాక్యం’ మూలంలోని genitive నిర్మాణాన్ని కాపాడుతుంది.
- source_word: ἀναθεωροῦντες
  choice: శ్రద్ధగా పరిశీలిస్తూ
  rationale: ఈ కృదంతం కేవలం చూడడం కాక, జాగ్రత్తగా గమనించి ఆలోచించడాన్ని సూచిస్తుంది.
- source_word: τὴν ἔκβασιν
  choice: ఫలితాన్ని
  rationale: ἔκβασις ఫలితం, పరిణామం లేదా అంతం అనే పరిధిని కలిగి ఉంది. ‘ఫలితం’ ప్రధాన పాఠంలో మరణాన్ని ప్రత్యేకంగా నిర్ణయించకుండా విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: τῆς ἀναστροφῆς
  choice: వారి జీవన విధానం యొక్క
  rationale: ἀναστροφή ప్రవర్తన లేదా జీవించే తీరును సూచిస్తుంది; ‘జీవన విధానం’ రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μιμεῖσθε
  choice: అనుకరించండి
  rationale: మూలంలోని ప్రత్యక్ష ఆజ్ఞను స్పష్టంగా, సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: τὴν πίστιν
  choice: వారి విశ్వాసాన్ని
  rationale: πίστις ఇక్కడ ‘విశ్వాసం’ లేదా ‘విశ్వసనీయత’ అనే రెండు భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠంలో సాధారణ సమానార్థకమైన ‘విశ్వాసం’ ఉంచి, ప్రత్యామ్నాయాన్ని పాదటీపులో నిలిపాం.
theological_decisions:
- issue: అనుకరించదగిన మానవ లక్షణంగా πίστις యొక్క అర్థం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత
  rationale: నాయకులను ప్రత్యేకంగా నిలిపిన లక్షణాన్ని అనుకరించమని వాక్యం చెబుతోంది. సందర్భంలో రెండు అర్థాలూ సాధ్యమైనందున ప్రధాన పాఠం ‘విశ్వాసం’ను వాడి, ‘విశ్వసనీయత’ను పాదటీపులో ఇచ్చి భావ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- issue: ἔκβασις నాయకుల మరణాన్ని లేదా హతసాక్షి మరణాన్ని ప్రత్యేకంగా సూచిస్తుందా
  choice: ఫలితం
  alternative: అంతం; కొందరి వ్యాఖ్యానంలో వారి మరణించిన తీరు
  rationale: పదం విస్తృతంగా ఫలితం లేదా పరిణామాన్ని సూచించగలదు. వారి మరణం—ముఖ్యంగా హతసాక్షి మరణం—అని ప్రధాన పాఠంలో చెప్పడం మూలంలో స్పష్టంగా లేని చారిత్రక నిర్దిష్టతను చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘శ్రద్ధగా పరిశీలిస్తూ’ మూల కృదంతంలోని గమనింపు-ఆలోచన భావాన్ని నిలుపుతుంది. ప్రధాన పాఠంలో అస్పష్టతను అనవసరంగా పరిష్కరించకుండా, నిజమైన ప్రత్యామ్నాయ అర్థాలను [a], [b] పాదటీపుల్లో ఇచ్చాం.
