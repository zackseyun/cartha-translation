id: HEB.13.22
reference: Hebrews 13:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: te
  text: సోదరులారా[a], ఈ ప్రబోధ వాక్యాన్ని ఓర్చుకోమని మిమ్మల్ని వేడుకుంటున్నాను; ఎందుకంటే నేను మీకు క్లుప్తంగానే రాశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సోదర సోదరీమణులారా’ అని కూడా అనువదించవచ్చు. గ్రీకు పాఠంలో ‘సోదరులారా’ అని ఉన్నా, అది సంఘమంతటినీ సమగ్రంగా ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: వేడుకుంటున్నాను
  rationale: ఇక్కడ రచయిత తన పాఠకులకు వినయపూర్వకంగా, అయితే గంభీరంగా విజ్ఞప్తి చేస్తున్నాడు. ‘వేడుకుంటున్నాను’ ఆ earnest appeal‌ను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది బలమైన వ్యతిరేకతను కాక స్వల్పమైన వాక్యసంధిని సూచిస్తుంది. తెలుగులో వాక్యప్రవాహం ద్వారానే ఆ మార్పు సహజంగా వ్యక్తమవుతుంది; ‘ఇప్పుడు’ అని చేర్చడం మూలంలో లేని కాలసూచనను కలిగించవచ్చు.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: మూలంలోని పుంలింగ బహువచన సంబోధనను నేరుగా నిలుపుతుంది. ఇది సంఘమంతటినీ ఉద్దేశించి ఉండగల సమగ్ర ప్రయోగమని పాదసూచికలో తెలియజేయబడింది.
- source_word: ἀνέχεσθε
  choice: ఓర్పుతో స్వీకరించండి
  rationale: ఈ సందర్భంలో సందేశాన్ని సహనంతో అంగీకరించి వినాలనే భావం ఉంది. కేవలం ‘సహించండి’ అనడం తెలుగులో అనవసరంగా ప్రతికూలంగా వినిపించవచ్చు; ‘ఓర్పుతో స్వీకరించండి’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: ఈ ప్రబోధ వాక్యాన్ని
  rationale: λόγος ఇక్కడ ప్రకటించబడిన సందేశాన్ని, παράκλησις ప్రబోధం, హితవు, ప్రోత్సాహం కలగలిసిన భావాన్ని సూచిస్తాయి. ‘ప్రబోధ వాక్యం’ మూల నిర్మాణాన్ని కొంత నిలుపుతూ గంభీరమైన, అర్థవంతమైన తెలుగును ఇస్తుంది. ‘ఈ’ అనేది ప్రస్తుత రచనను సూచించే సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: καὶ γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న విజ్ఞప్తికి కారణాన్ని తెలిపే వివరణాత్మక బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διὰ βραχέων
  choice: క్లుప్తంగానే
  rationale: ‘కొద్ది మాటల్లో’ లేదా ‘సంక్షిప్తంగా’ అనే మూల జాతీయార్థాన్ని సహజంగా తెలియజేస్తుంది; ‘-గానే’ రచయిత పేర్కొన్న పరిమిత సంక్షిప్తతకు స్వల్ప ఉద్ఘాటన ఇస్తుంది.
- source_word: ἐπέστειλα ὑμῖν
  choice: నేను మీకు ... రాశాను
  rationale: లేఖా సందర్భంలో క్రియ పాఠకులకు వ్రాసి పంపిన రచనను సూచిస్తుంది. తెలుగు భూతకాల రూపం మూలంలోని aorist‌ను సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ἀδελφοί అనే లింగసూచక సంబోధన
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: ప్రధాన పాఠంలో మూలంలోని వ్యాకరణ పుంలింగ రూపాన్ని నిలిపి, అది మిశ్రమ సంఘమంతటినీ సమగ్రంగా ఉద్దేశించి ఉండవచ్చనే భావాన్ని పాదసూచికలో సంరక్షించాం.
- issue: παράκλησις యొక్క ప్రబోధం–ప్రోత్సాహం భావవిస్తృతి
  choice: ప్రబోధం
  alternative: ప్రోత్సాహం
  rationale: సందర్భంలో వినేవారికి హితవు చెప్పి స్పందనకు పిలిచే భావం ప్రధానంగా కనిపిస్తుంది; అయినా ఆదరణ లేదా ప్రోత్సాహం అనే నిజమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలిని వాడాం. ‘సహించండి’ అనే కఠిన పదానికి బదులుగా సందర్భానుగుణమైన ‘ఓర్పుతో స్వీకరించండి’ ఎంచుకున్నాం; మూలంలోని విజ్ఞప్తి ధోరణి, సంక్షిప్తతపై ఉద్ఘాటన నిలుపబడ్డాయి.
