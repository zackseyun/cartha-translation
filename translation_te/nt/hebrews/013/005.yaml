id: HEB.13.5
reference: Hebrews 13:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: te
  text: 'మీ జీవన విధానం డబ్బుపట్ల ప్రేమ లేకుండా ఉండాలి[a]. ప్రస్తుతం మీ వద్ద ఉన్నవాటితో తృప్తిగా ఉండండి. ఎందుకంటే ఆయనే ఇలా చెప్పాడు: “నేను నిన్ను ఎన్నటికీ వదలను[b]; నిన్ను ఎన్నటికీ విడనాడను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధనప్రేమ లేనిదిగా.”
    reason: lexical_alternative
  - marker: b
    text: ఈ మాట పాత నిబంధనలోని నిబంధన వాగ్దానాలను, ముఖ్యంగా ద్వితీయోపదేశకాండము 31:6, 8; యెహోషువ 1:5లను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: ధనాపేక్ష లేనిదిగా
  rationale: ఈ విశేషణం ప్రత్యేకంగా డబ్బుపట్ల ప్రేమ లేదా మోహం లేకపోవడాన్ని సూచిస్తుంది. ‘ధనాపేక్ష లేనిదిగా’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, సాధారణ ‘లోభం’ కంటే మూలపదంలోని ధనసంబంధమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ τρόπος
  choice: మీ జీవన విధానం
  rationale: ఇక్కడ τρόπος వ్యక్తి నడవడి లేదా జీవించే తీరును సూచిస్తుంది. ప్రత్యక్షంగా సంబోధిస్తున్న సందర్భానికి ‘మీ’ని చేర్చడం తెలుగులో సహజం.
- source_word: ἀρκούμενοι
  choice: తృప్తిగా ఉండండి
  rationale: కృదంత రూపానికి ఇక్కడ ప్రబోధాత్మక బలం ఉంది. దాన్ని తెలుగులో సహజమైన ఆజ్ఞార్థక వాక్యంగా వ్యక్తం చేయడం వాక్య సంబంధాన్ని, నిరంతర మనోవైఖరిని నిలుపుతుంది.
- source_word: τοῖς παροῦσιν
  choice: మీకు ప్రస్తుతం ఉన్నవాటితో
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘ప్రస్తుతం ఉన్న వాటితో’ అని సూచిస్తుంది. సందర్భంలో అది వారి వద్ద ఇప్పుడు ఉన్న వస్తువులు లేదా పరిస్థితులను కలుపుకొని ఉండవచ్చు; అనవసరంగా కేవలం ఆస్తులకు మాత్రమే పరిమితం చేయలేదు.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: ఎందుకంటే ఆయన స్వయంగా ఇలా చెప్పారు
  rationale: αὐτός లోని ఉద్ఘాటనను ‘స్వయంగా’ నిలుపుతుంది. మూలంలో దేవుడు అనే నామవాచకం లేకపోవడంతో ‘ఆయన’ అనే సర్వనామాన్నే ఉంచాం. εἴρηκεν పలికిన మాటకు కొనసాగుతున్న ప్రామాణిక బలం ఉందని సందర్భం తెలియజేస్తుంది.
- source_word: Οὐ μή σε ἀνῶ
  choice: నేను నిన్ను ఎన్నటికీ వదలను
  rationale: οὐ μή బలమైన నిరాకరణ. ἀνίημι యొక్క వదలడం లేదా వెళ్లనివ్వడం అనే భావాన్ని ఈ వాగ్దాన సందర్భంలో సహజమైన ‘వదలను’ తెలియజేస్తుంది.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: నిన్ను ఎన్నటికీ విడనాడను
  rationale: ἐγκαταλείπω అంటే వెనుక విడిచిపెట్టడం, పరిత్యజించడం. ‘విడనాడను’ గంభీరమైన నిబంధన వాగ్దాన ధోరణిని నిలుపుతుంది; ‘ఎన్నటికీ’ రెండవ బలమైన నిరాకరణను కూడా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ఉల్లేఖనంలో మాట్లాడుతున్న వ్యక్తి గుర్తింపు
  choice: మూలంలోని సర్వనామాన్ని అనుసరించి ‘ఆయన స్వయంగా’ అని ఉంచడం
  alternative: ‘దేవుడు స్వయంగా’ అని స్పష్టీకరించడం
  rationale: సందర్భం మాట్లాడుతున్నది దేవుడేనని స్పష్టం చేసినా, గ్రీకు మూలంలో θεός కాక αὐτός ఉంది. అందువల్ల మూలంలో లేని నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: ఉల్లేఖనంలోని బలమైన ద్విగుణ నిరాకరణలు
  choice: రెండు వాక్య భాగాల్లోనూ ‘ఎన్నటికీ’ ఉపయోగించడం
  alternative: ‘ఎట్టి పరిస్థితుల్లోనూ ... కాదు’ లేదా ‘ఎన్నడూ ఎన్నటికీ ... కాదు’ అని విస్తరించడం
  rationale: రెండు οὐ μή నిర్మాణాలు వాగ్దాన నిశ్చయాన్ని బలపరుస్తాయి. గ్రీకు రూపాన్ని యాంత్రికంగా అనుకరించకుండా, సహజమైన తెలుగులో రెండు భాగాల ఉద్ఘాటననూ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రబోధ శైలి వాడబడింది. మొదటి గ్రీకు వాక్యంలోని విశేషణాత్మక ప్రబోధాన్ని ‘ఉండాలి’తో, దానితో అనుసంధానమైన కృదంతాన్ని ‘తృప్తిగా ఉండండి’తో వ్యక్తం చేశాం. ఉల్లేఖనంలో ఏకవచన ‘నిన్ను’ను నిలుపుకున్నాం; ఇది మూలంలోని σεకు అనుగుణం.
