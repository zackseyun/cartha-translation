review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the contrast between the absence of a present abiding city and the pursuit of the future city. However, “శాశ్వతంగా నిలిచే” can imply absolute eternity, which is stronger and more specific than μένουσαν (“remaining, abiding, lasting”).
  naturalness: The sentence is generally clear modern Telugu. “నిలిచివుండే నగరం” is more idiomatic and directly conveys the participial sense without adding the stronger connotation of permanence/eternity. Using “రాబోయేదానిని” naturally preserves the Greek’s implied noun in the second clause.
  terminology: “నగరం” appropriately preserves πόλις, and no interpretive identification of the city with heaven or Jerusalem is added. The footnote is adjusted so that it supplies a useful alternative rather than merely repeating the main-text wording.
  issues:
  - severity: medium
    issue: “శాశ్వతంగా” overstates μένουσαν.
    rationale: The Greek participle denotes a city that remains or abides; it does not itself assert that the city is eternal. “శాశ్వతంగా” may unnecessarily introduce an absolute theological sense.
  - severity: low
    issue: The existing footnote largely repeats the main-text phrase and includes “రావలసిన నగరం.”
    rationale: Since the main text already says “రాబోయే నగరం,” the note offers little lexical value. “రావలసిన” can suggest obligation (“must come”) rather than the intended future/coming sense.
  revised_text: ఎందుకంటే ఇక్కడ మనకు నిలిచివుండే నగరం లేదు; రాబోయేదానిని మనం వెదుకుతున్నాం.[a]
  revised_footnotes:
