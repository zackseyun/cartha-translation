source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: te
  text: ఎందుకంటే ఇక్కడ మనకు నిలిచివుండే నగరం లేదు; రాబోయేదానిని మనం వెదుకుతున్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రాబోయే నగరాన్ని” లేదా “రానున్న నగరాన్ని.”
    reason: τὴν μέλλουσαν‌లో స్త్రీలింగ కృదంతం ముందున్న “నగరం”ను సూచిస్తుంది; ప్రధాన పాఠంలో తెలుగుకు సహజంగా నామవాచకం సూచితంగా ఉంచబడింది.
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ఎందుకంటే ... లేదు
  rationale: γάρ ముందున్న సందర్భానికి కారణం లేదా వివరణను కలుపుతుంది; οὐ నిషేధాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ఈ అనుసంధానానికి ‘ఎందుకంటే’ సహజంగా ఉంది.
- source_word: ἔχομεν
  choice: మనకు ... ఉంది
  rationale: సాధారణ వర్తమాన అర్థాన్ని తెలుగులో సహజమైన అస్తిత్వ/స్వామ్య నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: ὧδε
  choice: ఇక్కడ
  rationale: స్థలాన్ని సూచించే మూలపదపు సరళమైన అర్థాన్ని నిలిపింది; ‘భూమిపై’ అని అనువదించడం సందర్భార్థాన్ని మూలపాఠంలోకి చేర్చినట్లవుతుంది.
- source_word: μένουσαν
  choice: శాశ్వతంగా నిలిచే
  rationale: πόλιν‌ను విశేషించే వర్తమాన కృదంతం నగరం నిలిచి ఉండడం, కొనసాగడం అనే భావాన్ని ఇస్తుంది. ‘శాశ్వతంగా నిలిచే’ భవిష్యత్ నగరంతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πόλιν
  choice: నగరం
  rationale: మూలంలోని స్పష్టమైన ‘నగరం’ రూపకాన్ని అలాగే ఉంచింది; ‘స్వదేశం’ వంటి విస్తృత వ్యాఖ్యానాన్ని చేర్చలేదు.
- source_word: ἀλλὰ
  choice: కాని
  rationale: ప్రస్తుత నగరం లేకపోవడానికీ రాబోయే నగరాన్ని వెదకడానికీ మధ్య బలమైన వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὴν μέλλουσαν
  choice: రాబోయే నగరం
  rationale: స్త్రీలింగ కృదంతం ముందున్న πόλιν‌ను సూచిస్తుంది. తెలుగులో నామవాచకాన్ని పునరుక్తి చేయడం సహజంగా ఉండి, భవిష్యదర్థాన్ని కాపాడుతుంది.
- source_word: ἐπιζητοῦμεν
  choice: మనం వెదుకుతున్నాం
  rationale: ἐπιζητέωలో వెదకడం లేదా సాధించడానికి ప్రయత్నించడం అనే భావం ఉంది. కొనసాగుతున్న అన్వేషణను సహజమైన తెలుగు వర్తమాన రూపం వ్యక్తం చేస్తుంది; మూలంలో లేని ‘ఆతురంగా’ వంటి క్రియావిశేషణాన్ని చేర్చలేదు.
theological_decisions:
- issue: ‘నగరం’ అనే రూపక స్వభావం
  choice: ‘నగరం’ అనే మూలపాఠ రూపకాన్నే ప్రధాన పాఠంలో నిలిపివేయడం
  alternative: ‘పరలోకం,’ ‘పరలోక నగరం,’ లేదా ‘పరలోక యెరూషలేము’
  rationale: ఈ వచనం ఇక్కడ నిలిచే నగరం లేదనీ రాబోయే నగరాన్ని వెదుకుతున్నామనీ మాత్రమే చెబుతుంది. హెబ్రీయులకు రాసిన పత్రికలో ఇతరచోట్ల పరలోక నగర భావం ఉన్నా, దానిని ఇక్కడ ప్రధాన పాఠంలో స్పష్టీకరించడం మూలంలోని భావపరమైన విస్తృతిని ముందుగానే నిర్ణయిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘ఇక్కడ’ అనే స్థలసూచకాన్ని వ్యాఖ్యానాత్మకంగా ‘భూమిపై’గా విస్తరించలేదు. ప్రతి పాదంలో ‘మనం/మనకు’ ఉపయోగించి సమూహ స్వరాన్ని స్పష్టంగా ఉంచింది.
