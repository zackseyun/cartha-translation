  rationale: “శాశ్వతంగా నిలిచే” స్థానంలో “నిలిచివుండే” ఉపయోగించడం ద్వారా μένουσαν యొక్క ‘abiding/remaining’ భావం అతిశయోక్తి లేకుండా నిలుస్తుంది. రెండవ భాగంలో సూచితమైన “నగరం”ను “రాబోయేదానిని” ద్వారా సహజంగా వ్యక్తం చేసి, పాదటిప్పణిలో స్పష్టమైన నామవాచకంతో ఉన్న అక్షరార్థ ప్రత్యామ్నాయాన్ని ఇచ్చాం.
