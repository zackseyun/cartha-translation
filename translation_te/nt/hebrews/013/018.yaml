id: HEB.13.18
reference: Hebrews 13:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: te
  text: మా కోసం ప్రార్థించండి; ఎందుకంటే మాకు మంచి మనస్సాక్షి ఉందని మేము నమ్ముతున్నాం[a], అన్ని విషయాల్లో మంచిగా నడుచుకోవాలని కోరుకుంటున్నాం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మాకు నిశ్చయంగా తెలుసు’ లేదా ‘మాకు విశ్వాసం ఉంది.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అన్ని విషయాల్లో గౌరవప్రదంగా నడుచుకోవాలని కోరుకుంటూ.’
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: Προσεύχεσθε περὶ ἡμῶν
  choice: మా కోసం ప్రార్థించండి
  rationale: ప్రార్థన సందర్భంలో περί + genitive సహజంగా ‘కోసం’ అని అర్థమిస్తుంది. వర్తమాన ఆజ్ఞలోని కొనసాగింపు భావాన్ని అవసరానికి మించి స్పష్టం చేయకుండా సహజమైన తెలుగు ఆజ్ఞారూపాన్ని వాడాం.
- source_word: πειθόμεθα
  choice: మేము నమ్ముతున్నాం
  rationale: ఇక్కడ ఈ పదం స్థిరమైన నిశ్చయాన్ని సూచిస్తుంది. ‘నమ్ముతున్నాం’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఆ జ్ఞానసంబంధ బలాన్ని నిలుపుతుంది.
- source_word: καλὴν συνείδησιν ἔχομεν
  choice: మాకు మంచి మనస్సాక్షి ఉంది
  rationale: విశేషణం, నామవాచకం రెండింటినీ నేరుగా నిలుపుతూ, ‘నిర్దోషమైన’ వంటి మరింత నిర్దిష్టమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
- source_word: ἐν πᾶσιν
  choice: అన్ని విషయాల్లో
  rationale: ఈ నపుంసక బహువచన ప్రయోగంలోని సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καλῶς ... ἀναστρέφεσθαι
  choice: సత్ప్రవర్తనతో నడుచుకోవాలని
  rationale: కేవలం విడిగా ‘మంచిగా’ అనడం కంటే, వ్యక్తి జీవనశైలి మరియు నైతిక ప్రవర్తన రెండింటినీ ఈ సహజ తెలుగు ప్రయోగం అందిస్తుంది.
- source_word: θέλοντες
  choice: కోరుకుంటున్నాం
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న సంకల్పం లేదా కోరికను సహజమైన తెలుగు క్రియగా వ్యక్తం చేశాం.
theological_decisions:
- issue: చివరి కృదంత వాక్యభాగానికి ‘మంచి మనస్సాక్షి’ అనే వాదనతో ఉన్న సంబంధం
  choice: ‘ఎందుకంటే ... కోరుకుంటున్నాం’ అని వివరణాత్మక/కారణ సంబంధంగా అనువదించడం
  alternative: ‘అన్ని విషయాల్లో సత్ప్రవర్తనతో నడుచుకోవాలని కోరుకుంటూ’ అని కృదంత సంబంధాన్ని మరింత రూపపరంగా ఉంచడం
  rationale: θέλοντες యొక్క సంబంధం గ్రీకులో కొంత సడలింపుతో ఉంది. కారణ/వివరణ భావం సందర్భానికి సరిపోతుంది; అయినా ఇది పాపరాహిత్యాన్ని ప్రకటిస్తున్నట్లుగా బలపరచకుండా ఉద్దేశాన్ని మాత్రమే తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో రూపొందించాం. ‘మనస్సాక్షి’ అనే స్థిరమైన నైతిక పదాన్ని నిలిపాం; ‘సత్ప్రవర్తనతో నడుచుకోవడం’ జీవన ప్రవర్తన భావాన్ని సహజంగా అందిస్తుంది.
