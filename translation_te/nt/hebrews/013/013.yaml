id: HEB.13.13
reference: Hebrews 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: te
  text: కాబట్టి, ఆయన నిందను భరిస్తూ, శిబిరం వెలుపలికి ఆయన దగ్గరకు వెళ్దాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శిబిరం వెలుపల’ అనే మాట లేవీయకాండము 16లోని బలి దృశ్యాన్ని, అలాగే పట్టణం వెలుపల యేసు అనుభవించిన తిరస్కారాన్ని జ్ఞాపకం చేస్తుంది.
    reason: intertextual_background
lexical_decisions:
- source_word: τοίνυν
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి, ముఖ్యంగా 13:11–12 నుంచి, తీసుకునే ముగింపును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξερχώμεθα
  choice: మనం కూడా ... వెళ్లి ... భరిద్దాం
  rationale: మొదటి పురుష బహువచన వర్తమాన హోర్టేటివ్ సబ్జంక్టివ్ యొక్క సమిష్టి ప్రోత్సాహక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. వాక్యాంతంలోని ‘భరిద్దాం’తో కలిసి ఒకే పిలుపుగా నిర్మించబడింది.
- source_word: πρὸς αὐτὸν
  choice: ఆయన దగ్గరికి
  rationale: వ్యక్తివైపు కదలికను సూచించే πρός భావాన్ని సహజమైన గౌరవప్రద తెలుగు ప్రయోగంతో నిలుపుతుంది; సందర్భం యేసును సూచించినా, మూలంలోని సర్వనామాన్నే ఉంచుతుంది.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: శిబిరం వెలుపలికి
  rationale: παρεμβολή యొక్క ‘శిబిరం/మకాము’ భావంలో, లేవీయ బలి నేపథ్యాన్ని మరియు ముందటి వచనాల రూపకాన్ని ‘శిబిరం’ స్పష్టంగా కాపాడుతుంది.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: ఆయన నిందను
  rationale: ὀνειδισμόςలోని అవమానం, తిరస్కారం, దూషణ అనే సామాజిక భావాలను సంక్షిప్తంగా మోసే సహజమైన తెలుగు పదం; ‘ఆయనకు కలిగిన’ అని విప్పకుండా గ్రీకు సంబంధంలోని కొంత సందిగ్ధతను నిలుపుతుంది.
- source_word: φέροντες
  choice: భరిద్దాం
  rationale: ‘మోస్తూ’ అనే మరింత పదక్షర రూపం తెలుగులో కృత్రిమంగా వినిపించవచ్చు; నిందను స్వీకరించి సహించడం అనే సందర్భోచిత భావాన్ని ‘భరించడం’ సహజంగా అందిస్తుంది. గ్రీకులోని సహచర క్రియాభావం తెలుగు వాక్య నిర్మాణంలో ప్రధాన ప్రోత్సాహక క్రియతో కలిపి వ్యక్తమవుతుంది.
theological_decisions:
- issue: ‘ఆయన’ అనే సర్వనామపు సూచన
  choice: తక్షణ సందర్భంలో ‘ఆయన’ యేసును సూచిస్తుంది; అయినా అనువాదంలో సర్వనామాన్నే ఉంచడం
  alternative: ‘యేసు దగ్గరికి’ అని స్పష్టీకరించడం
  rationale: 13:12 వల్ల సూచన స్పష్టమైనప్పటికీ, గ్రీకు మూలం αὐτόν అనే సర్వనామాన్ని వాడుతుంది. పేరును చేర్చడం మూలం చేసిన దానికంటే ఎక్కువగా అర్థాన్ని పరిష్కరిస్తుంది.
- issue: ‘శిబిరం వెలుపల’ అనే పదబంధపు భావం
  choice: బలి సంబంధమైన/రూపకాత్మక దృశ్యాన్ని యథాతథంగా నిలుపడం
  alternative: ‘మత వ్యవస్థ వెలుపలికి’ లేదా ‘సమాజం వెలుపలికి’ అని వ్యాఖ్యానాత్మకంగా మార్చడం
  rationale: ఈ పదబంధం హెబ్రీయులకు 13:11–13లోని లేవీయ బలి దృశ్యాన్నీ, యేసు అనుభవించిన తిరస్కారాన్నీ ఒకేసారి ప్రతిధ్వనింపజేస్తుంది. నిర్దిష్ట సామాజిక లేదా మత సంస్థగా పారాఫ్రేజ్ చేయడం ఆ బహుస్థాయి భావాన్ని కుదిస్తుంది.
- issue: ‘ఆయన నింద’లో సంబంధం
  choice: గ్రీకు జెనిటివ్‌ను ‘ఆయన నింద’గా సంక్షిప్తంగా నిలుపడం
  alternative: ‘ఆయనకు కలిగిన నింద’ లేదా ‘ఆయన నిమిత్తం వచ్చే నింద’ అని విప్పడం
  rationale: αὐτοῦ అనేది ఆయన అనుభవించిన నిందను, ఆయనతో ఐక్యతవల్ల విశ్వాసులు పంచుకునే నిందను సందర్భంలో సూచించగలదు. ఒకే వివరణకు పరిమితం చేయకుండా మూలంలోని సాంద్రతను కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సమిష్టి ప్రోత్సాహక శైలి. ‘శిబిరం’ అనే బైబిలీయ దృశ్యపదాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా ఉంచాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
