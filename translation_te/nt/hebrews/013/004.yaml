id: HEB.13.4
reference: Hebrews 13:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: te
  text: వివాహాన్ని అందరూ గౌరవించాలి[a][b]; దాంపత్య శయ్య అపవిత్రంగా ఉండకూడదు. ఎందుకంటే లైంగిక దుర్నీతికి పాల్పడేవారికీ వ్యభిచారులకూ దేవుడు తీర్పు తీరుస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వివాహం అందరి మధ్య గౌరవనీయమైనది.” గ్రీకు వాక్యంలోని మొదటి భాగంలో స్పష్టమైన క్రియ లేదు; అందువల్ల దీన్ని ఉపదేశంగా గానీ ప్రకటనగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “అందరిచేత.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: గౌరవించాలి
  rationale: ఈ పదం గౌరవనీయమైనది, విలువైనది అనే భావాన్ని ఇస్తుంది. సందర్భంలోని ఉపదేశ ధోరణికి అనుగుణంగా తెలుగులో సహజమైన విధ్యర్థక రూపాన్ని ఎంచుకున్నాం.
- source_word: ὁ γάμος
  choice: వివాహాన్ని
  rationale: ఇక్కడ వివాహ వేడుక కాకుండా వివాహ వ్యవస్థ లేదా బంధం ఉద్దేశించబడింది.
- source_word: ἐν πᾶσιν
  choice: అందరూ
  rationale: వ్యక్తులను సూచించే అర్థాన్ని అనుసరించి ‘అందరూ గౌరవించాలి’ అని అనువదించాం. ‘అందరి మధ్య’ అనే నిర్మాణం కూడా సాధ్యమని పాదసూచికలో ఉంచాం.
- source_word: ἡ κοίτη
  choice: దాంపత్య శయ్యను
  rationale: అక్షరార్థంగా ‘శయ్య’; వివాహ సందర్భంలో దాంపత్య లైంగిక సంబంధాన్ని సూచించే గౌరవప్రదమైన, స్పష్టమైన తెలుగు ప్రయోగం.
- source_word: ἀμίαντος
  choice: అపవిత్రం చేయకూడదు
  rationale: మలినం కానిది, కలుషితం కానిది అనే నైతిక భావాన్ని నిలుపుతూ సందర్భానుగుణ ఉపదేశ రూపంలో అనువదించాం.
- source_word: πόρνους
  choice: లైంగిక దుర్నీతికి పాల్పడేవారిని
  rationale: పదం సూచించే విస్తృత లైంగిక అనైతికతను ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; దానిని వ్యభిచారంతో మాత్రమే పరిమితం చేయదు.
- source_word: μοιχοὺς
  choice: వ్యభిచారులను
  rationale: వివాహ విశ్వాసాన్ని ఉల్లంఘించేవారిని ప్రత్యేకంగా సూచించే పదంగా, విస్తృతమైన ముందు వర్గం నుండి తేడాను నిలుపుతుంది.
- source_word: κρινεῖ
  choice: తీర్పుతీరుస్తాడు
  rationale: భవిష్యత్ దైవ తీర్పును తెలియజేస్తుంది; మూలపదం చెప్పిన దానికంటే ముందుకు వెళ్లి ‘శిక్షిస్తాడు’ లేదా ‘దోషిగా తీర్పు ఇస్తాడు’ అని నిర్ధారించదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి దైవ తీర్పు కారణంగా ఇవ్వబడుతున్నదనే తార్కిక సంబంధాన్ని సహజ తెలుగులో చూపుతుంది.
theological_decisions:
- issue: మొదటి భాగం ప్రకటననా లేక ఉపదేశమా?
  choice: ‘వివాహాన్ని అందరూ గౌరవించాలి’ అనే ఉపదేశార్థక పఠనం
  alternative: ‘వివాహం అందరి మధ్య గౌరవనీయమైనది’ అనే ప్రకటనార్థక పఠనం
  rationale: గ్రీకులో స్పష్టమైన క్రియ లేదు; కాబట్టి రెండు పఠనాలూ వ్యాకరణపరంగా సాధ్యమే. హెబ్రీయులు 13లో వరుసగా వచ్చే నైతిక ఉపదేశాలకు అనుగుణంగా ప్రధాన పాఠ్యంలో ఉపదేశార్థాన్ని ఎంచుకుని, నిజమైన అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గంభీరతను నిలుపుతూ అనువదించాం. ‘దాంపత్య శయ్య’ గౌరవప్రదమైన బైబిలీయ శైలిని, సందర్భంలోని లైంగిక సూచనను రెండింటినీ కాపాడుతుంది.
