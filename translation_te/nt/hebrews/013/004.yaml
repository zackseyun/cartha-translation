  to: వివాహాన్ని అందరూ గౌరవించాలి[a][b]; దాంపత్య శయ్య అపవిత్రంగా ఉండకూడదు. ఎందుకంటే లైంగిక దుర్నీతికి పాల్పడేవారికీ వ్యభిచారులకూ దేవుడు తీర్పు తీరుస్తాడు.
