source:
  edition: SBLGNT
  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: te
  text: వివిధమైన, వింతైన బోధలచేత కొట్టుకుపోకండి. ఎందుకంటే కృపచేత హృదయం స్థిరపడడం[a] మంచిది, ఆహారాలచేత కాదు. ఆ ఆహారాలను[b] అనుసరించి జీవించినవారు[c] వాటివల్ల ఎలాంటి ప్రయోజనమూ పొందలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బలపరచబడడం,’ ‘దృఢపరచబడడం.’ గ్రీకు క్రియకు బలపరచడం, స్థిరపరచడం, దృఢం చేయడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆహారాలు’ అనేది బహుశా ఆహార సంబంధ ఆచారాలను లేదా నియమాలను సూచిస్తుంది; అయితే గ్రీకు పాఠం నేరుగా ‘ఆహారాలు’ అని మాత్రమే చెబుతుంది.
    reason: cultural_note
  - marker: c
    text: మూల గ్రీకులో అక్షరార్థంగా ‘వాటిలో నడిచినవారు.’ ఇది వాటిని అనుసరించి జీవించినవారు లేదా వాటిలో నిమగ్నమైనవారు అనే భావాన్ని ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: వివిధమైన, పరాయి బోధలు
  rationale: ποικίλαις లోని వైవిధ్య భావాన్ని ‘వివిధమైన’ తెలియజేస్తుంది; ξέναις ను ‘పరాయి’ అని అనువదించడం జాతిపరమైన అర్థాన్ని చేర్చకుండా, స్వీకరించిన సందేశానికి చెందని బోధలనే హెచ్చరిక భావాన్ని నిలుపుతుంది.
- source_word: μὴ παραφέρεσθε
  choice: కొట్టుకుపోకండి
  rationale: వర్తమాన నిషేధంలోని కొనసాగుతున్న హెచ్చరికనూ, బయటి ప్రభావం చేత దారి నుండి మోసుకుపోబడే రూపకాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: χάριτι
  choice: కృపచేత
  rationale: దత్తివిభక్తిని సాధనార్థకంగా తీసుకొని, హృదయం స్థిరపడే సాధనంగా కృపను స్పష్టంగా ఉంచుతుంది.
- source_word: βεβαιοῦσθαι τὴν καρδίαν
  choice: హృదయం స్థిరపడడం
  rationale: βεβαιόω లోని బలపడడం, స్థిరపరచబడడం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; καρδία అనే బైబిలు రూపకాన్ని ‘హృదయం’గా యథాతథంగా ఉంచుతుంది.
- source_word: οὐ βρώμασιν
  choice: ఆహారాలచేత కాదు
  rationale: βρώμασιν ను ‘ఆహార నియమాలు’ అని విస్తరించకుండా దాని ప్రత్యక్ష అర్థమైన ‘ఆహారాలు’గానే అనువదించి, కృపతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: οἱ περιπατοῦντες
  choice: ఆ ఆహారాలను అనుసరించి జీవించినవారు
  rationale: ‘వాటిలో నడిచినవారు’ అనే మూల రూపకంలోని జీవన ప్రవర్తన భావాన్ని తెలుగులో అర్థవంతంగా వ్యక్తం చేస్తుంది; కేవలం తినడం కంటే వాటి చుట్టూ జీవనాచరణను క్రమపరచుకోవడం అనే సూచనను అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: οὐκ ὠφελήθησαν
  choice: ఎలాంటి ప్రయోజనమూ పొందలేదు
  rationale: వారు లాభపడలేదనే రచయిత నిరాకరణను సహజంగా, బలంగా తెలుపుతుంది.
theological_decisions:
- issue: ‘ఆహారాలు’ అనే పదానికి సూచన మరియు కృపతో దాని వ్యత్యాసం
  choice: ప్రధాన పాఠంలో ‘ఆహారాలు’ అనే ప్రత్యక్ష పదాన్నే ఉంచడం
  alternative: ఆహార నియమాలు, బలి భోజనాలు, లేదా యూదుల ఆచార ఆహారాలు అని నిర్దిష్టీకరించడం
  rationale: సందర్భం ఆహార సంబంధ ఆచారాలను సూచించే అవకాశం ఉన్నప్పటికీ, βρώμασιν స్వయంగా ‘ఆహారాలు’ అని మాత్రమే చెబుతుంది. అందువల్ల ప్రధాన పాఠం సాధ్యమైన సంకుచిత లేదా విస్తృత వ్యాఖ్యానాల్లో ఏదో ఒకదాన్ని బలవంతంగా నిర్ణయించదు.
- issue: ‘హృదయం’ అనే రూపకం
  choice: హృదయం
  alternative: మనస్సు లేదా అంతరంగం
  rationale: καρδία ను అలాగే నిలుపడం మూలంలోని మానవ అంతరంగ కేంద్ర భావాన్ని, దాని బైబిలు-వేదాంత బరువును కాపాడుతుంది.
- issue: βεβαιοῦσθαι యొక్క భావ పరిధి
  choice: స్థిరపడడం
  alternative: బలపరచబడడం లేదా స్థిరపరచబడడం
  rationale: ఈ క్రియ బలపరచడం, స్థిరపరచడం అనే రెండు సమీప భావాలను మోయగలదు. ‘స్థిరపడడం’ సహజమైన తెలుగులో ఆ అంతర్గత దృఢత్వాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘కొట్టుకుపోకండి’ మూలంలోని మోసుకుపోయే రూపకాన్ని సాధారణ పాఠకునికి స్పష్టంగా ఉంచుతుంది. ‘కృప,’ ‘హృదయం’ వంటి బైబిలు పరంగా ముఖ్యమైన పదాలను వ్యాఖ్యానాత్మకంగా సరళీకరించలేదు.
