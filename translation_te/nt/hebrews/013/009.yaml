    issue: ‘పరాయి బోధలు’ for ξέναις
    rationale: In modern standard Telugu, ‘పరాయి’ may evoke someone else’s or an outsider’s teaching. ‘వింతైన’ more naturally conveys the contextual sense of strange/alien teachings while avoiding an ethnic or ownership implication.
  - severity: low
    issue: Order of the grace/foods contrast
    rationale: The draft’s meaning is correct, but placing ‘కృపచేత’ before ‘ఆహారాలచేత కాదు’ follows χάριτι ... οὐ βρώμασιν and makes the contrast more direct in Telugu.
