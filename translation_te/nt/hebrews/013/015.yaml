source:
  edition: SBLGNT
  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: te
  text: కాబట్టి, ఆయన ద్వారా మనం దేవునికి ఎల్లప్పుడూ[a] స్తుతి బలిని అర్పిద్దాం—అంటే, ఆయన నామాన్ని ఒప్పుకొనే[c] పెదవుల[b] ఫలాన్ని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిరంతరం,’ ‘అన్ని సమయాల్లో.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘పెదవుల ఫలం.’ కొన్ని అనువాదాలు ‘మన పెదవుల ఫలం’ అంటాయి; అయితే ‘మన’ అనే పదం గ్రీకు మూలంలో స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఆయన నామాన్ని అంగీకరించే.’ గ్రీకు క్రియ బహిరంగంగా ఒప్పుకోవడం లేదా అంగీకరించడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: ఆయన ద్వారానే
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. సందర్భంలో క్రీస్తు ద్వారా దేవునికి అర్పించడం అనే భావాన్ని నిలుపుతూ, గ్రీకులోని సర్వనామాన్ని విస్తరించకుండా ఉంచుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న వాదన నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ἀναφέρωμεν
  choice: మనం ... అర్పిద్దాం
  rationale: ప్రథమ పురుష బహువచన hortatory subjunctive యొక్క సమూహ ప్రోత్సాహక భావాన్ని ‘అర్పిద్దాం’ సహజంగా వ్యక్తపరుస్తుంది; బలి అర్పణ భావమూ నిలుస్తుంది.
- source_word: θυσίαν αἰνέσεως
  choice: స్తుతి బలిని
  rationale: స్తుతిని బలిగా చిత్రించే మూలంలోని బలమైన రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: διὰ παντὸς
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరంగా లేదా అన్ని సమయాల్లో అనే కాలవ్యాప్తిని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: అర్పణను స్వీకరించే వ్యక్తిని సూచించే దత్తి విభక్తిని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τοῦτ’ ἔστιν
  choice: అంటే
  rationale: ముందు చెప్పిన ‘స్తుతి బలి’ ఏమిటో వివరించే పునర్వ్యాఖ్యను సహజంగా పరిచయం చేస్తుంది.
- source_word: καρπὸν χειλέων
  choice: పెదవుల ఫలాన్ని
  rationale: మూలంలోని రూపకాన్నీ, దాని లేఖన నేపథ్యాన్నీ నిలుపుతుంది. గ్రీకులో లేని ‘మన’ అనే పదాన్ని చేర్చదు.
- source_word: ὁμολογούντων
  choice: ఒప్పుకొనే
  rationale: బహిరంగంగా ఒప్పుకోవడం లేదా అంగీకరించడం అనే క్రియ యొక్క పరిధిని నిలుపుతుంది; ‘స్తుతించే’ లేదా ‘కృతజ్ఞత చెప్పే’ అని అర్థాన్ని కుదించదు.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: ఆయన నామాన్ని
  rationale: ὁμολογέω తరువాత గ్రీకులో దత్తి విభక్తి ఉన్నప్పటికీ, తెలుగులో ‘నామాన్ని ఒప్పుకొను’ అనేది సహజమైన కర్మ నిర్మాణం.
theological_decisions:
- issue: δι’ αὐτοῦ లోని ‘ఆయన’ ఎవరిని సూచిస్తుంది?
  choice: సందర్భం ప్రకారం అది క్రీస్తును సూచిస్తుంది; విశ్వాసులు ఆయన ద్వారా దేవునికి స్తుతి బలి అర్పిస్తారు.
  alternative: సూచిత వ్యక్తిని వివరించకుండా సాధారణంగా ‘ఆయన ద్వారా’ అని మాత్రమే గ్రహించడం.
  rationale: ముందున్న వచనాలు యేసు యొక్క బలి మరియు మధ్యవర్తిత్వ నేపథ్యాన్ని ఇస్తాయి. అయినా మూలంలోని సర్వనామాన్ని ‘క్రీస్తు’ అని వివరణాత్మకంగా మార్చకుండా అనువాదం ‘ఆయన’గానే ఉంచుతుంది.
- issue: బలి సంబంధమైన భాష యొక్క బలం
  choice: ‘స్తుతి బలి’ మరియు ‘అర్పిద్దాం’ అనే బలి రూపకాన్ని నిలుపడం.
  alternative: దాన్ని ‘దేవుణ్ణి స్తుతిద్దాం’ అని సరళీకరించడం.
  rationale: వచనం స్తుతిని ఉద్దేశపూర్వకంగా బలి భాషలో వివరిస్తుంది. ఆ రూపకాన్ని తొలగించకుండా ఉంచడం మూలంలోని ధార్మిక ఉద్వేగాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకునికి అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యంలో ‘అర్పిద్దాం’ ఒకసారే ఉన్నా, ‘అంటే’ తరువాతి వివరణ తెలుగులో పూర్తి వాక్యంగా సహజంగా వినిపించేందుకు దానిని రెండోసారి పునరుక్తి చేశాం. ‘పెదవుల ఫలం’ అనే అసాధారణమైనా ఉద్దేశపూర్వకమైన రూపకాన్ని నిలుపుకున్నాం.
