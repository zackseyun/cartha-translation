  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: te
  text: మీ నాయకులందరికీ, పరిశుద్ధులందరికీ వందనాలు తెలపండి. ఇటలీ నుండి వచ్చినవారు[a] మీకు వందనాలు తెలుపుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇటలీలో ఉన్నవారు.” గ్రీకు పదబంధం ఇటలీ నుండి వచ్చినవారిని గానీ, అక్కడ ఉన్నవారిని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: వందనాలు తెలపండి
  rationale: లేఖా సందర్భంలో పలకరింపులు లేదా అభివందనాలు అందజేయమనే ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάντας
  choice: అందరికీ / అందరూ
  rationale: సంబంధిత ప్రతి సమూహమంతటినీ సూచించే గ్రీకు బహువచన సమగ్రతను తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: మీ నాయకులు
  rationale: సమాజాన్ని నడిపించే గుర్తింపు పొందినవారిని సూచిస్తుంది; రాజకీయ పాలకులు అనే తప్పుదారి పట్టించే భావాన్ని నివారిస్తుంది.
- source_word: τοὺς ἁγίους
  choice: పరిశుద్ధులు
  rationale: విశ్వాసులను దేవునికి ప్రత్యేకించబడినవారిగా సూచించే కొత్త నిబంధన పదప్రయోగపు పదార్థ, ధార్మిక బరువును నిలుపుతుంది.
- source_word: ἀσπάζονται
  choice: వందనాలు తెలుపుతున్నారు
  rationale: లేఖా ముగింపులో పలకరింపులు పంపుతున్నారనే వర్తమాన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: ఇటలీ నుండి వచ్చినవారు
  rationale: ἀπό సహజంగా మూలం లేదా వచ్చిన ప్రదేశాన్ని సూచిస్తుంది; అందువల్ల ప్రధాన పాఠ్యంలో ‘ఇటలీ నుండి’ అనే అర్థాన్ని ఉంచింది.
theological_decisions:
- issue: οἱ ἀπὸ τῆς Ἰταλίας అనే పదబంధం ఎవరిని సూచిస్తుంది?
  choice: ఇటలీ నుండి వచ్చినవారు
  alternative: ఇటలీలో ఉన్నవారు
  rationale: ἀπό సాధారణంగా మూలం లేదా వచ్చిన ప్రదేశాన్ని సూచిస్తుంది. అయితే ఈ సందర్భంలో ఇటలీలో ప్రస్తుతం ఉన్నవారిని కూడా సూచించవచ్చనే భాషాపరమైన సందిగ్ధత ఉంది; కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన లేఖా శైలిని ఉపయోగించాం. ‘నాయకులు,’ ‘పరిశుద్ధులు’ అనే పదాలు మూలంలోని సంఘపరమైన మరియు ధార్మిక భావాన్ని స్పష్టంగా నిలుపుతాయి.
