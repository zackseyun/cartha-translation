id: HEB.13.21
reference: Hebrews 13:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: te
  text: ఆయన తన చిత్తాన్ని నెరవేర్చడానికి ప్రతి మంచిదానితో మిమ్మల్ని సిద్ధపరచుగాక; యేసు మెస్సీయ ద్వారా తన దృష్టికి ప్రీతికరమైనదాన్ని మనలో కార్యం చేస్తూ ఉండుగాక. ఆయనకు[a] యుగయుగాల వరకు మహిమ కలుగుగాక. ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆయనకు’ అనేది ప్రత్యేకంగా యేసు మెస్సీయను సూచించవచ్చు; మరికొందరు దీన్ని ఈ ప్రార్థనకు కర్త అయిన సమాధాన దేవుణ్ణి సూచిస్తున్నదిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: సిద్ధపరచుగాక
  rationale: ఈ ఆశీర్వాద ప్రార్థనలో దేవుడు తన చిత్తాన్ని నెరవేర్చేందుకు విశ్వాసులను సమర్థులుగా, అవసరమైనవాటితో సిద్ధం చేయాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν παντὶ ἀγαθῷ
  choice: అవసరమైన ప్రతి మంచిదానితో
  rationale: ἐν ఇక్కడ సాధనం లేదా సమకూర్చబడిన వనరును సూచించగలదు. తెలుగులో ‘సిద్ధపరచు’తో ‘ప్రతి మంచిదానితో’ సహజంగా సరిపోతుంది; ‘అవసరమైన’ అనేది సందర్భంలోని equip భావాన్ని స్పష్టం చేస్తుంది, ‘మంచిపని’ అని పాఠంలో లేని ἔργον‌ను చేర్చదు.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: తన చిత్తాన్ని నెరవేర్చడానికి
  rationale: ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌లోని ఉద్దేశ్య భావాన్ని ‘-డానికి’ నిలుపుతుంది. ‘చిత్తాన్ని నెరవేర్చడం’ ఆధునిక తెలుగులో సహజంగా దేవుని సంకల్పానుసారంగా చేయడాన్ని తెలియజేస్తుంది.
- source_word: ποιῶν ἐν ἡμῖν
  choice: మనలో జరిగిస్తూ ఉండుగాక
  rationale: దేవుని క్రియ మనలో కొనసాగుతుందనే భావాన్ని తెలియజేస్తుంది. గ్రీకులో ఇది participle అయినప్పటికీ, తెలుగులో ప్రార్థనా వాక్యంగా విభజించడం పఠనసౌలభ్యాన్ని ఇస్తూ అదే కర్తను కొనసాగిస్తుంది.
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: తన దృష్టికి ప్రీతికరమైనదాన్ని
  rationale: Substantivized adjective‌ను ‘ప్రీతికరమైనది’గా, దేవుని సమక్షంలో లేదా అంచనాలో అనే భావాన్ని ‘తన దృష్టికి’గా సహజంగా అందిస్తుంది.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ ద్వారా
  rationale: διά యొక్క సాధనార్థాన్ని ‘ద్వారా’ నిలుపుతుంది; Χριστός‌ను ఇక్కడ బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తుంది.
- source_word: ᾧ ἡ δόξα
  choice: ఆయనకే మహిమ కలుగుగాక
  rationale: సంబంధవాచక సర్వనామాన్ని నిర్దిష్ట పూర్వపదంతో మార్చకుండా ‘ఆయనకే’ అని ఉంచడం ద్వారా గ్రీకు వాక్యంలోని సాధ్యమైన ద్వంద్వ సూచన నిలుస్తుంది.
- source_word: εἰς τοὺς αἰῶνας
  choice: యుగయుగాలూ
  rationale: అంతంలేని కాలాన్ని తెలిపే గ్రీకు నుడికారానికి గౌరవప్రదమైన, సుపరిచితమైన తెలుగు సమానార్థకం.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: ప్రార్థనా మరియు ఆరాధనా సందర్భంలో స్థిరపడిన తెలుగు రూపం.
theological_decisions:
- issue: ᾧ (‘ఆయనకే’) అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘ఆయనకే’ అని ఉంచి పూర్వపదాన్ని నిర్దిష్టంగా పేర్కొనలేదు.
  alternative: ఇది సమీపంలో పేర్కొన్న యేసు మెస్సీయను సూచించవచ్చు; లేదా ప్రార్థనకు కర్త అయిన సమాధాన దేవుణ్ణి సూచించవచ్చు.
  rationale: గ్రీకు సంబంధవాచక సర్వనామం వ్యాకరణపరంగా సమీపంలోని యేసు మెస్సీయతో అనుసంధానించవచ్చు; అయితే మొత్తం ప్రార్థనకు కర్తగా ఉన్న దేవునితోనూ అనుసంధానించవచ్చు. అనువాదం ఈ ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ఆశీర్వాద-ప్రార్థనా శైలి. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో రెండు ప్రార్థనా వాక్యాలుగా విభజించి పఠనసౌలభ్యాన్ని పెంచినా, కర్త మరియు భావసంబంధం నిలుపబడ్డాయి. [a] గుర్తు ప్రధాన పాఠంలో సంబంధిత సర్వనామం వెంట ఉంచబడింది.
