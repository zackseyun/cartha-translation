translation:
  language: te
  text: సహోదర ప్రేమ కొనసాగాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తోటి విశ్వాసులపట్ల ప్రేమ.’ గ్రీకు పదం క్రైస్తవ సమాజంలో కుటుంబ సభ్యులవంటి ఆప్యాయతను సూచిస్తుంది; ఇది పురుషులకు మాత్రమే పరిమితం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: సోదర ప్రేమ
  rationale: ఈ పదం అక్షరార్థంగా తోబుట్టువుల మధ్య ఉండే కుటుంబ ఆప్యాయతను సూచిస్తుంది; తొలి క్రైస్తవ వాడుకలో విశ్వాసుల సమాజంలోని కుటుంబసదృశ ప్రేమను తెలియజేస్తుంది. ‘సోదర ప్రేమ’ మూలంలోని కుటుంబ రూపకాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: μενέτω
  choice: కొనసాగాలి
  rationale: μένω యొక్క వర్తమాన ఆజ్ఞార్థక రూపం ఇప్పటికే ఉన్న స్థితి నిలిచి కొనసాగాలని పిలుపునిస్తుంది. ‘కొనసాగాలి’ ఆజ్ఞాత్మక భావాన్నీ, నిరంతరతనూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἡ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: గ్రీకు నిర్దిష్ట ఉపపదం ఈ సుగుణం పాఠకులకు తెలిసినదని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో దానికి ప్రత్యేక సమానపదం అవసరం లేదు.
theological_decisions:
- issue: φιλαδελφία యొక్క పరిధి మరియు లింగసూచక కుటుంబ భాష
  choice: ప్రధాన పాఠంలో ‘సోదర ప్రేమ’ అని ఉంచి కుటుంబ రూపకాన్ని నిలుపడం
  alternative: తోటి విశ్వాసులపట్ల ప్రేమ; పరస్పర ప్రేమ; సహోదర ప్రేమ
  rationale: గ్రీకు పదం కుటుంబ సంబంధ భాషపై నిర్మితమై ఉన్నప్పటికీ, దాని ఉద్దేశం కేవలం పురుషులకు మాత్రమే పరిమితం కాదు; విశ్వాసుల సమాజమంతటిలో ఉండవలసిన కుటుంబ ఆప్యాయతను సూచిస్తుంది. ప్రధాన పాఠం రూపకాన్ని నిలుపుతుంది; పాదటిప్పణి దాని సమగ్ర పరిధిని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ఉపదేశ వాక్యం. ‘కొనసాగాలి’ ద్వారా వర్తమాన ఆజ్ఞార్థకంలోని నిరంతర భావం సహజంగా వ్యక్తమైంది.
