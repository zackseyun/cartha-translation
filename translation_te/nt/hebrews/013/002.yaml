id: HEB.13.2
reference: Hebrews 13:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: te
  text: అపరిచితులకు ఆతిథ్యం ఇవ్వడాన్ని నిర్లక్ష్యం చేయకండి. ఎందుకంటే అలా చేయడం ద్వారా కొందరు తమకు తెలియకుండానే దేవదూతలకు[a] ఆతిథ్యం ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొందరు తమకు తెలియకుండానే దూతలకు ఆతిథ్యం ఇచ్చారు.” గ్రీకు పదానికి ‘దేవదూతలు’ లేదా ‘దూతలు’ అనే రెండు అర్థాలూ ఉండవచ్చు; అయితే ఇక్కడ సంభావ్యంగా సూచించబడిన సంఘటనలకు ‘దేవదూతలు’ అనే అర్థమే బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: అపరిచితులకు ఆతిథ్యం ఇవ్వడం
  rationale: ఈ పదం అక్షరార్థంగా అపరిచితుల పట్ల ప్రేమను, వారిని ఆదరించి స్వాగతించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేయడానికి ఈ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: నిర్లక్ష్యం చేయకండి
  rationale: ఈ సందర్భంలో క్రియ కేవలం మనసులో మరచిపోవడమే కాక, ఆతిథ్యాన్ని ఆచరించకుండా ఉండడాన్ని కూడా సూచిస్తుంది. అందువల్ల ఉపదేశాత్మక భావానికి ‘నిర్లక్ష్యం చేయకండి’ సరిపోతుంది.
- source_word: διὰ ταύτης
  choice: అలా చేయడం ద్వారా
  rationale: స్త్రీలింగ సర్వనామం ముందున్న ఆతిథ్యాన్ని సూచిస్తుంది. తెలుగులో దాని సాధనార్థక భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔλαθόν
  choice: తమకు తెలియకుండానే
  rationale: λανθάνωతో కూడిన కృదంత నిర్మాణం, ఆ పని చేసినవారికి దాని నిజ స్వరూపం తెలియలేదనే భావాన్ని ఇస్తుంది.
- source_word: τινες
  choice: కొందరు
  rationale: నిర్దిష్టంగా పేర్లు చెప్పని బహువచనాన్ని సహజంగా అందిస్తుంది.
- source_word: ξενίσαντες
  choice: ఆతిథ్యం ఇచ్చారు
  rationale: ఈ కృదంతం అతిథులను స్వీకరించి వారికి వసతి, ఆదరణ కల్పించడాన్ని సూచిస్తుంది; తెలుగులో ఈ ప్రయోగం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἀγγέλους
  choice: దేవదూతలకు
  rationale: ἄγγελος అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. అయితే ఆదికాండం 18–19 అధ్యాయాల్లోని పరలోక సందర్శకుల కథలకు ఉండే సంభావ్య సూచన దృష్ట్యా ప్రధాన పాఠంలో ‘దేవదూతలు’ సరిపోతుంది; మరొక అర్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ἀγγέλους అనే పదం సూచించే వారు
  choice: అతీంద్రియమైన దేవదూతలు
  alternative: మానవ దూతలు లేదా వార్తాహరులు
  rationale: పాత నిబంధనలో పరలోక సందర్శకులకు తెలియకుండానే ఆతిథ్యం ఇచ్చిన సంఘటనలతో ఉన్న సంభావ్య సంబంధం ‘దేవదూతలు’ అనే అర్థానికి బలం ఇస్తుంది. అయినప్పటికీ గ్రీకు పదంలోని నిజమైన పదార్థ వైవిధ్యాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఉపదేశ శైలిని ఉపయోగించాం. ‘అపరిచితులకు’ అని స్పష్టపరచడం ద్వారా φιλοξενίαలోని strangers అనే భావాన్ని నిలిపాం; ‘ఆతిథ్యం ఇచ్చారు’ అనే సహజ ప్రయోగంతో ξενίσαντες భావాన్ని అందించాం.
