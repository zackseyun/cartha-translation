source:
  edition: SBLGNT
  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: te
  text: చెరలో ఉన్నవారిని, మీరు వారితోపాటు బంధించబడినవారిలా[a], జ్ఞాపకం చేసుకోండి. దుర్వ్యవహారానికి గురవుతున్నవారిని కూడా జ్ఞాపకం చేసుకోండి; మీరు కూడా శరీరంలో ఉన్నవారే కాబట్టి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారితోపాటు బంధించబడినట్టుగా.’ గ్రీకు పదబంధం చెరలో ఉన్నవారితో కలిసి బంధించబడిన భావాన్ని అక్షరార్థంగా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘శరీరంలో’ అన్నది క్రీస్తు శరీరంలో భాగంగా ఉండడాన్ని సూచించే అవకాశం ఉంది; అయితే సాధారణ మానవ శారీరక దుర్బలతను, బాధకు లోనయ్యే స్థితిని సూచించడమే ఎక్కువ సంభావ్యం.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: జ్ఞాపకం చేసుకోండి
  rationale: వర్తమానకాల ఆజ్ఞ నిరంతర శ్రద్ధతో స్మరించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ పదబంధం సహజంగా ఉండి, సందర్భంలో ఆ కొనసాగింపు భావాన్ని మోయగలదు.
- source_word: τῶν δεσμίων
  choice: చెరలో ఉన్నవారిని
  rationale: δέσμιος అంటే బంధాల్లో ఉన్నవాడు, సాధారణంగా ఖైదీ. ‘చెరలో ఉన్నవారు’ సహజమైన తెలుగు; బంధించబడిన స్థితినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὡς συνδεδεμένοι
  choice: మీరు కూడా వారితోపాటు బంధించబడినట్టుగా
  rationale: συνδέομαι అనే పదం వారితో కలిసి బంధించబడిన భావాన్ని కలిగిస్తుంది. ఈ అనువాదం కేవలం స్మరణకన్నా సహానుభూతితో తమను వారితో ఏకం చేసుకోవాలనే పిలుపును తెలియజేస్తుంది.
- source_word: τῶν κακουχουμένων
  choice: హింసకు గురవుతున్నవారిని
  rationale: κακουχέομαι ఇతరుల చేత దుర్వ్యవహారం, అణచివేత లేదా బాధకు గురికావడాన్ని సూచిస్తుంది. ‘హింసకు గురవుతున్నవారు’ బాధ బయటనుండి కలిగించబడుతోందనే కర్మణి భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: ఎందుకంటే మీరు కూడా శరీరంలో ఉన్నవారే
  rationale: మూలంలోని ‘శరీరంలో’ అనే పదబంధాన్ని అలాగే ఉంచడం ద్వారా సాధారణ మానవ శారీరక దుర్బలత అనే ప్రధాన భావంతోపాటు క్రీస్తు శరీరానికి సంబంధించిన సాధ్యమైన ప్రతిధ్వనిని కూడా మూసివేయకుండా ఉంచుతుంది.
theological_decisions:
- issue: ‘శరీరంలో’ (ἐν σώματι) అనే పదబంధం యొక్క భావం
  choice: అందరికీ సాధారణమైన శారీరక మానవ స్థితి మరియు బాధకు లోనయ్యే దుర్బలత
  alternative: క్రీస్తు శరీరంలో సభ్యత్వం
  rationale: చెరలో ఉన్నవారిపట్ల, హింసకు గురవుతున్నవారిపట్ల సహానుభూతి చూపమనే సందర్భంలో, సాధారణ శారీరక దుర్బలతే ప్రధాన సూచనగా కనిపిస్తుంది. అయినప్పటికీ ‘శరీరంలో’ అనే మూల రూపాన్ని నిలుపుకోవడం ద్వారా సంఘసంబంధమైన సాధ్యమైన భావాన్ని అనువాదం నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సమాంతర ఆజ్ఞ నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం రెండవసారి ‘జ్ఞాపకం చేసుకోండి’ అని వ్యక్తం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
