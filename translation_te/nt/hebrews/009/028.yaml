revisions:
- from: 'అలాగే మెస్సీయ కూడా అనేకుల పాపాలను భరించడానికి ఒక్కసారి అర్పించబడి, తన కోసం ఆతురంగా ఎదురుచూస్తున్నవారికి రక్షణ కలిగించడానికి పాపంతో సంబంధం లేకుండా[a] రెండవసారి ప్రత్యక్షమవుతాడు.


    [a] లేదా, “పాపాన్ని ఉద్దేశించి కాకుండా”; అంటే, మొదటిసారి అర్పించబడినప్పుడు చేసినట్లుగా పాపాన్ని భరించడానికి కాదు.'
  to: 'అలాగే మెస్సీయ కూడా, అనేకుల పాపాలను భరించడానికి ఒక్కసారి అర్పించబడిన తరువాత, ఆయనను ఆతురంగా ఎదురుచూస్తున్నవారికి పాపంతో సంబంధం లేకుండా[a] రక్షణ కొరకు రెండవసారి ప్రత్యక్షమవుతాడు.


    [a] లేదా, “పాపాన్ని ఉద్దేశించి కాకుండా”; అంటే, ఆయన మొదటిసారి అర్పించబడినప్పుడు పాపాలను భరించినట్లుగా కాదు.'
  rationale: The necessary correction changes the reflexive “తన కోసం” to the accusative-object sense “ఆయనను,” restoring the source meaning. The salvation phrase is adjusted to the closer and more neutral “రక్షణ కొరకు.” The main-text ambiguity of χωρὶς ἁμαρτίας is retained, and the footnote is clarified without making its interpretation part of the main translation.
