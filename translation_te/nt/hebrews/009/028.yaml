id: HEB.9.28
reference: Hebrews 9:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: te
  text: 'అలాగే మెస్సీయ కూడా, అనేకుల పాపాలను భరించడానికి ఒక్కసారి అర్పించబడిన తరువాత, ఆయనను ఆతురంగా ఎదురుచూస్తున్నవారికి పాపంతో సంబంధం లేకుండా[a] రక్షణ కొరకు రెండవసారి ప్రత్యక్షమవుతాడు.


    [a] లేదా, “పాపాన్ని ఉద్దేశించి కాకుండా”; అంటే, ఆయన మొదటిసారి అర్పించబడినప్పుడు పాపాలను భరించినట్లుగా కాదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపాన్ని ఉద్దేశించి కాకుండా”; అంటే, ఆయన మొదటిసారి అర్పించబడినప్పుడు పాపాలను భరించినట్లుగా కాదు.
    reason: χωρὶς ἁμαρτίας అనే పదబంధానికి సందర్భానుసారంగా మరింత వివరణాత్మకమైన ప్రత్యామ్నాయాన్ని సంరక్షించడానికి.
lexical_decisions:
- source_word: οὕτως καὶ
  choice: అలాగే … కూడా
  rationale: 27వ వచనంలోని పోలికను కొనసాగించే తులనాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὁ Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός రక్షణ చరిత్రలోని బిరుదుగా పనిచేస్తోంది; అందువల్ల కేవలం పేరులా కాక బిరుదు భావాన్ని వ్యక్తం చేసే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- source_word: ἅπαξ
  choice: ఒక్కసారి
  rationale: గ్రీకు పదంలోని ‘ఒకసారి’ అనే అర్థాన్ని మాత్రమే అందిస్తుంది; మూలంలో స్పష్టంగా లేని ‘ఒక్కసారిగా శాశ్వతంగా’ వంటి విస్తరణను చేర్చదు.
- source_word: προσενεχθεὶς
  choice: అర్పించబడి
  rationale: అనిశ్చిత భూతకాల కర్మణి అసమాపక క్రియ భావాన్ని, భవిష్యత్ ప్రధాన క్రియకు ముందున్న కార్యంగా నిలుపుతుంది; మూలంలో లేని ‘తన్నుతాను’ అనే ప్రతిఫలార్థాన్ని చేర్చదు.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: అనేకుల పాపాలను భరించడానికి
  rationale: ఉద్దేశాన్ని వ్యక్తం చేస్తూ, ἀναφέρωలోని పాపభరణ మరియు బలి సంబంధిత ప్రతిధ్వనులను రెండింటినీ కాపాడుతుంది.
- source_word: πολλῶν
  choice: అనేకుల
  rationale: సంక్షిప్తమైన బహువచనాన్ని, యెషయా 53కు ఉండగల ప్రతిధ్వనిని విస్తరించకుండా నిలుపుతుంది.
- source_word: ἐκ δευτέρου
  choice: రెండవసారి
  rationale: మొదటి అర్పణతో ఉన్న కాలాంతర సంబంధిత వ్యత్యాసాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: χωρὶς ἁμαρτίας
  choice: పాపంతో సంబంధం లేకుండా
  rationale: అక్షరార్థమైన ‘పాపం లేకుండా/పాపానికి వేరుగా’ అనే సంక్షిప్తతను తెలుగులో అర్థవంతంగా ఉంచి, ‘పాపాన్ని భరించడానికి కాదు’ అనే సందర్భానుసార వివరణను ప్రధాన పాఠ్యంలో నేరుగా కలపకుండా పాదసూచికలో ఇస్తుంది.
- source_word: ὀφθήσεται
  choice: ప్రత్యక్షమవుతాడు
  rationale: ὁράω కర్మణి రూపానికి కాలాంతర ప్రత్యక్షత సందర్భంలో సహజమైన తెలుగు; యాంత్రికంగా ‘చూడబడతాడు’ అనడం కంటే భావాన్ని సరిగ్గా అందిస్తుంది.
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: తన కోసం ఆతురంగా ఎదురుచూస్తున్నవారికి
  rationale: ἀπεκδέχομαιలోని ఆశతో కూడిన తీవ్రమైన నిరీక్షణను సాధారణ ‘ఎదురుచూడడం’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς σωτηρίαν
  choice: రక్షణ కలిగించడానికి
  rationale: εἰς సూచించే గమ్యం లేదా ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; రెండవ ప్రత్యక్షత ఫలితాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
theological_decisions:
- issue: రెండవ ప్రత్యక్షతలో χωρὶς ἁμαρτίας అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘పాపంతో సంబంధం లేకుండా’ అని ఉంచడం
  alternative: ‘పాపాన్ని ఉద్దేశించి కాకుండా,’ అంటే మొదటి అర్పణలోలాగా పాపాన్ని భరించడానికి కాదు
  rationale: గ్రీకు పదబంధంలోని సంక్షిప్తతను, దాని వ్యాఖ్యానాత్మక ఉద్వేగాన్ని ప్రధాన పాఠ్యంలో కాపాడుతుంది. మొదటి రాకలోని పాపభరణ కార్యానికి భిన్నంగా రెండవ ప్రత్యక్షత ఉండడాన్ని మరింత స్పష్టంగా చెప్పే పఠనాన్ని పాదసూచికలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. బలి సంబంధిత భాషను ‘అర్పించబడి,’ ‘పాపాలను భరించడానికి’ అనే సుపరిచిత పదాలతో నిలిపాం. పొడవైన గ్రీకు వాక్య నిర్మాణాన్ని తెలుగులో చదవదగిన క్రమంలో అమర్చినా, దాని కాల, ఉద్దేశ, కాలాంతర సంబంధాలను కాపాడాం.
