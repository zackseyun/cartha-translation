id: HEB.9.11
reference: Hebrews 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: te
  text: అయితే, వచ్చిన మేలులకు ప్రధాన యాజకుడిగా మెస్సీయ వచ్చాడు[a]; చేతులతో చేయబడనిదీ—అంటే, ఈ సృష్టికి చెందినది కానిదీ—అయిన మరింత గొప్ప, మరింత పరిపూర్ణమైన గుడారం ద్వారా[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘రాబోయే మేలులకు’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: 'లేదా: ‘అయితే, వచ్చిన మేలులకు ప్రధాన యాజకుడిగా మెస్సీయ ప్రత్యక్షమైనప్పుడు, చేతులతో చేయబడనిదీ—అంటే, ఈ సృష్టికి చెందినది కానిదీ—అయిన మరింత గొప్ప, మరింత పరిపూర్ణమైన గుడారం ద్వారా—’.'
    reason: previous_rendering
lexical_decisions:
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός వ్యక్తిపేరుగా కాక అభిషిక్తుని బిరుదుగా పనిచేస్తోంది; అందువల్ల సాధారణ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా ఉండే ‘మెస్సీయ’ను వాడాం.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న భౌమ గుడారం, యాజక సేవల వివరణకు భిన్నంగా మెస్సీయ సేవను ముందుకు తెచ్చే వ్యత్యాసాన్ని సహజ తెలుగులో సూచిస్తుంది.
- source_word: παραγενόμενος
  choice: వచ్చాడు
  rationale: మెస్సీయ తన ప్రధాన యాజక పాత్రలో వచ్చి ప్రత్యక్షమయ్యాడనే భావాన్ని సూటిగా తెలియజేస్తుంది; గ్రీకు కృదంతాన్ని సహజ తెలుగు సమాపక క్రియగా మార్చాం.
- source_word: ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: హెబ్రీయులకు పత్రికలోని బలిపూజా పదవికి ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదబంధం.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: వచ్చిన మేలులకు
  rationale: SBLGNTలోని γενομένων (‘వచ్చినవి’)ను అనుసరిస్తూ, ఆ మేలులు ఇప్పటికే కలిగాయనే భావాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: διὰ τῆς ... σκηνῆς
  choice: '... గుడారం ద్వారా'
  rationale: σκηνή ఇక్కడ అరణ్యకాల పరిశుద్ధ గుడారాన్ని జ్ఞాపకం చేస్తుంది; ‘గుడారం’ ఆ బైబిలు నేపథ్యాన్ని నిలుపుతుంది. ఈ పదబంధం 12వ వచనంలోని ప్రవేశ క్రియతో అనుసంధానమయ్యేలా వాక్యాన్ని కొనసాగింపులో ఉంచాం.
- source_word: μείζονος
  choice: మరింత గొప్ప
  rationale: కేవలం పరిమాణాన్ని కాక శ్రేష్ఠతను సూచించే తులనాత్మక భావాన్ని తెలియజేస్తుంది.
- source_word: τελειοτέρας
  choice: మరింత పరిపూర్ణమైన
  rationale: హెబ్రీయులకు పత్రికలోని పరిపూర్ణత/పూర్తితనం అనే ముఖ్య భావసంబంధాన్ని నిలుపుతుంది.
- source_word: οὐ χειροποιήτου
  choice: చేతులతో చేయబడనిది
  rationale: మానవులు తయారు చేసిన భౌమ పరిశుద్ధ స్థలానికి విరుద్ధమైనదని చెప్పే బైబిలు నుడికారాన్ని దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: τοῦτ’ ἔστιν
  choice: అంటే
  rationale: తరువాతి వివరణను సహజ ఆధునిక తెలుగులో పరిచయం చేస్తుంది.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: ఈ సృష్టికి చెందినది కానిది
  rationale: గుడారం ప్రస్తుత సృష్టి వ్యవస్థకు చెందదనే భావాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
theological_decisions:
- issue: τῶν γενομένων ἀγαθῶν పాఠభేదం మరియు కాలసూచన
  choice: వచ్చిన మేలులకు
  alternative: రాబోయే మేలులకు
  rationale: ప్రధాన పాఠం SBLGNTలోని γενομένωνను అనుసరిస్తుంది. అనేక ప్రతుల్లో ఉన్న μελλόντων వేరే కాలసూచనను ఇస్తుంది కాబట్టి దాన్ని పాదసూచికలో పారదర్శకంగా నిలిపాం.
- issue: διὰ τῆς ... σκηνῆς యొక్క వాక్యసంబంధం
  choice: ‘వచ్చాడు’ తరువాత అర్ధవిరామం ఉంచి, ‘గుడారం ద్వారా’ అనే పదబంధాన్ని 12వ వచనంలో కొనసాగబోయే ప్రధాన క్రియతో అనుసంధానమయ్యేలా ఉంచడం
  alternative: ‘మెస్సీయ ప్రత్యక్షమైనప్పుడు ... గుడారం ద్వారా’ అని ఒకే అనుసంధాన నిర్మాణంగా చదవడం
  rationale: గ్రీకు వాక్యం 12వ వచనంలో కొనసాగుతుంది; ‘గుడారం ద్వారా’ అనేది మెస్సీయ రావడానికి సాధనమని తప్పుగా అర్థం కాకుండా ఈ నిర్మాణం సహాయపడుతుంది. అయినా గ్రీకు వాక్య నిర్మాణంలోని ప్రత్యామ్నాయ అనుసంధానాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూల గ్రీకు వాక్యం 12వ వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నాన్ని ఉంచాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు రెండూ సంబంధిత పాదసూచికలకు స్పష్టంగా జతచేయబడ్డాయి.
