id: HEB.9.24
reference: Hebrews 9:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: te
  text: ఎందుకంటే మెస్సీయ చేతులతో చేసిన పరిశుద్ధ స్థలాల్లోకి—అవి అసలైనవాటికి ప్రతిరూపాలు[a]—ప్రవేశించలేదు; మన తరఫున ఇప్పుడు దేవుని సన్నిధిలో[b] ప్రత్యక్షమవడానికి పరలోకంలోకే ప్రవేశించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అసలైనవాటికి అనురూపమైనవి.’ గ్రీకు పదం పరలోకంలోని నిజమైన వాస్తవాలకు సరిపోలే భూసంబంధ రూపాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘దేవుని ముఖం ఎదుట.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ యాజకునిగా ప్రవేశించి నెరవేర్చే అభిషిక్తుని పదవిభావం స్పష్టంగా ఉంది; అందువల్ల కేవలం పేరులా వినిపించే రూపం కంటే బిరుదు అర్థాన్ని నిలిపే ‘మెస్సీయ’ ఎంచుకున్నాం.
- source_word: χειροποίητα ἅγια
  choice: చేతులతో చేసిన పరిశుద్ధ స్థలాలు
  rationale: మానవులు నిర్మించిన భూసంబంధ పవిత్ర స్థలాలకు, పరలోక వాస్తవానికి మధ్యనున్న వ్యత్యాసాన్ని నిలిపింది; ἅγια అనే బహువచనాన్ని కూడా కాపాడింది.
- source_word: ἀντίτυπα
  choice: ప్రతిరూపాలు
  rationale: భూసంబంధ పరిశుద్ధ స్థలాలు పరలోకంలోని అసలైన వాటికి అనురూపంగా ఉన్నాయనే భావాన్ని తెలుపుతుంది; ‘నకళ్లు’ అనడం కలిగించగల నకిలీతన భావాన్ని నివారిస్తుంది.
- source_word: τῶν ἀληθινῶν
  choice: అసలైనవాటికి
  rationale: ఇక్కడ ἀληθινός అబద్ధానికి వ్యతిరేకం కంటే అంతిమమైన, నిజమైన పరలోక వాస్తవాన్ని సూచిస్తుంది.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: పరలోకంలోకే
  rationale: αὐτόν ఇచ్చే బలాన్ని తెలుగు ‘-కే’ ద్వారా సహజంగా వ్యక్తం చేసి, భూసంబంధ ప్రతిరూపానికి బదులు పరలోకాన్నే సూచిస్తుంది.
- source_word: ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ
  choice: దేవుని సన్నిధిలో ప్రత్యక్షమవడానికి
  rationale: ‘దేవుని ముఖం ఎదుట’ అనే మూల రూపకానికి సహజమైన తెలుగు సమానార్థకం; దేవుని ఎదుట ప్రత్యక్ష హాజరును తెలియజేస్తుంది.
- source_word: ὑπὲρ ἡμῶν
  choice: మన పక్షంగా
  rationale: యాజక సంబంధమైన ప్రాతినిధ్య భావాన్ని నిలుపుతుంది; ఈ వచనం చెప్పినదానికంటే నిర్దిష్టమైన ప్రాయశ్చిత్త సిద్ధాంతాన్ని జోడించదు.
theological_decisions:
- issue: ἅγια యొక్క ఆరాధనా సంబంధ సంఖ్య, పరిధి
  choice: పరిశుద్ధ స్థలాలు
  alternative: పరిశుద్ధ స్థలం; పరిశుద్ధాలయం
  rationale: గ్రీకు రూపం బహువచనం. దానిని నిలపడం ద్వారా ఒకే ప్రత్యేక గదిగా ముందుగానే సంకుచితం చేయకుండా హెబ్రీయుల పత్రికలోని గుడార సంబంధ నేపథ్యాన్ని కాపాడుతుంది.
- issue: Χριστός అనే క్రీస్తు సంబంధ బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో అభిషిక్తుని పదవి, కార్యం ముందున్నాయి. ‘మెస్సీయ’ బిరుదు భావాన్ని స్పష్టంగా ఉంచుతుంది; వ్యక్తి గుర్తింపులో మార్పు చేయదు.
- issue: ὑπὲρ ἡμῶν యొక్క ప్రాతినిధ్య భావం
  choice: మన పక్షంగా
  alternative: మన కోసం
  rationale: పరలోకంలో దేవుని ఎదుట యాజకునిగా ప్రాతినిధ్యం వహించే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; దాని విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. మూలంలోని కారణసూచక γάρను ‘ఎందుకంటే’గా, బలమైన వ్యత్యాసాన్ని ‘ప్రవేశించలేదు; ... ప్రవేశించాడు’గా వ్యక్తం చేశాం. మధ్యలోని వివరణను డాష్‌లతో ఉంచి ἀντίτυπα τῶν ἀληθινῶν ఏ పదాన్ని వివరిస్తుందో స్పష్టం చేశాం.
