source:
  edition: SBLGNT
  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: te
  text: ఎందుకంటే మొదటి గుడారం సిద్ధం చేయబడింది. అందులో దీపస్తంభం, బల్ల, అమర్చి ఉంచిన రొట్టెలు[a] ఉండేవి. ఆ మొదటి గుడారాన్ని “పరిశుద్ధ స్థలం”[b] అని పిలుస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రొట్టెల అమరిక”; పాత నిబంధన నేపథ్యాన్ని బట్టి వీటిని “సన్నిధి రొట్టెలు” అని కూడా అంటారు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “పరిశుద్ధ స్థలాలు” అనే బహువచన రూపం ఉంది; ఇక్కడ అది గుడారంలోని మొదటి గదిని, అంటే పరిశుద్ధ స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ
  choice: గుడారం
  rationale: మోషే కాలపు ఆరాధనా గుడారంతో ఉన్న సంబంధాన్ని నిలుపుతూ, సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండే పదం. ఈ సందర్భంలో ఇది గుడారంలోని మొదటి విభాగాన్ని కూడా సూచిస్తుంది.
- source_word: κατεσκευάσθη
  choice: సిద్ధం చేయబడింది
  rationale: నిర్మాణాన్ని మాత్రమే కాక పవిత్ర స్థలాన్ని దాని సామగ్రితో సిద్ధపరచడాన్ని కూడా సూచించగల గ్రీకు క్రియ యొక్క విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἡ πρώτη
  choice: మొదటి
  rationale: తదుపరి వచనంలోని రెండవ తెరకు అవతల ఉన్న విభాగంతో వ్యత్యాసాన్ని నిలుపుతుంది; ‘విభాగం’ అనే పదాన్ని మూలపాఠంలో లేనందున ప్రధాన వాక్యంలో చేర్చలేదు.
- source_word: λυχνία
  choice: దీపస్తంభం
  rationale: నూనె దీపాలను మోసే ఆరాధనా సామగ్రిని స్పష్టంగా సూచిస్తుంది; కొవ్వొత్తుల భావాన్ని కలిగించదు.
- source_word: τράπεζα
  choice: బల్ల
  rationale: పవిత్ర స్థలంలోని బల్లకు సరళమైన, సహజమైన తెలుగు పదం.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: అమర్చి ఉంచిన రొట్టెలు
  rationale: అక్షరార్థంగా ఉన్న ‘రొట్టెల అమరిక/ఉంచడం’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; సంప్రదాయపరమైన పేరును మాత్రమే ప్రధాన పాఠంగా పెట్టకుండా గ్రీకు నిర్మాణానికి దగ్గరగా ఉంటుంది.
- source_word: Ἅγια
  choice: పరిశుద్ధ స్థలం
  rationale: గ్రీకులో రూపం బహువచనమైనప్పటికీ, సందర్భంలో గుడారంలోని మొదటి గదిని సూచిస్తుంది. తెలుగులో ‘పరిశుద్ధ స్థలం’ ఆ స్థలభేదాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Ἅγια అనే బహువచన రూపం మరియు గుడారపు విభాగాలు
  choice: పరిశుద్ధ స్థలం
  alternative: పరిశుద్ధ స్థలాలు; పరిశుద్ధాలయం
  rationale: మూలంలోని బహువచన రూపాన్ని పాదటిప్పణిలో తెలియజేస్తూ, తక్షణ సందర్భంలో మొదటి గదినే సూచిస్తున్నందున ప్రధాన పాఠంలో సహజమైన ఏకవచనాన్ని వాడాం. ఇది తరువాతి అంతర్గదితో ఉన్న స్థల వ్యత్యాసాన్ని కాపాడుతుంది.
- issue: σκηνὴ ἡ πρώτη అనేది గుడారమా లేక మొదటి విభాగమా
  choice: మొదటి గుడారం
  alternative: గుడారంలోని మొదటి విభాగం
  rationale: గ్రీకు వాక్య నిర్మాణాన్ని, దానిలోని కొంత భావసందిగ్ధతను ప్రధాన పాఠంలో నిలిపాం; సందర్భం అది మొదటి గదిని సూచిస్తుందని పాఠకుడు గ్రహించగలడు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం మూడు చిన్న వాక్యాలుగా విభజించినా, మూలంలోని కారణసూచక γὰρ ను ‘ఎందుకంటే’తో, సామగ్రి జాబితాను, చివరి నామకరణ వాక్యాన్ని నిలుపుకుంది.
