review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents γάρ, διαθήκη, θάνατον, ἀνάγκη, and the genitive relation in τοῦ διαθεμένου. Its main-text choice ‘నిబంధన’ appropriately retains the broader discourse’s covenantal framing, while the note preserves the well-attested testamentary/legal construal. However, ‘ముందుకు తీసుకురాబడడం’ is an overly literal and unnatural Telugu rendering of the passive φέρεσθαι in this legal-evidentiary construction.
  naturalness: ‘మరణం సమర్పించబడటం’ is more idiomatic modern formal Telugu for a death being produced/presented in a legal or evidentiary context. ‘దానిని చేసినవాని’ is also more compact and natural than ‘దానిని చేసిన వ్యక్తి’ while retaining the intentionally nontechnical wording.
  terminology: ‘నిబంధన’ and ‘వీలునామా’ are suitable modern-standard Telugu terms. The footnote should identify the Greek term in Greek script (with a Telugu pronunciation aid) rather than only a Latin transliteration, and should use ‘న్యాయపరమైన భావంలో’ for natural formal Telugu.
  issues:
  - severity: medium
    issue: ‘ముందుకు తీసుకురాబడడం’ is wooden Telugu.
    rationale: Although it follows the literal image of φέρεσθαι, this passive compound is not natural in modern Telugu and obscures the legal/evidentiary sense of a death being brought or presented. ‘సమర్పించబడటం’ preserves that sense without asserting more than the Greek.
  - severity: low
    issue: The footnote uses only the Latin transliteration ‘diathēkē’.
    rationale: Using διαθήκη, with a Telugu pronunciation in parentheses, is clearer and more appropriate in a Telugu scholarly note.
  revised_text: ఎందుకంటే, నిబంధన[a] ఉన్నచోట, దానిని చేసినవాని మరణం సమర్పించబడటం అవసరం.
