  to: ఎందుకంటే, నిబంధన[a] ఉన్నచోట, దానిని చేసినవాని మరణం సమర్పించబడటం అవసరం.
  rationale: The revision retains the draft’s covenant reading and its footnoted will/testament alternative, thereby preserving the lexical and contextual ambiguity. It only replaces a mechanically literal passive phrase with idiomatic formal Telugu that better conveys the source’s legal-evidentiary passive construction, and improves the scholarly presentation of the footnote.
