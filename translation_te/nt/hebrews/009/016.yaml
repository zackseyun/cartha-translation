id: HEB.9.16
reference: Hebrews 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπου γὰρ διαθήκη, θάνατον ἀνάγκη φέρεσθαι τοῦ διαθεμένου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: te
  text: ఎందుకంటే, నిబంధన[a] ఉన్నచోట, దానిని చేసినవాని మరణం సమర్పించబడటం అవసరం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే, వీలునామా ఉన్నచోట, దానిని చేసినవాని మరణం నిర్ధారించబడటం అవసరం.” గ్రీకు పదమైన διαθήκη (డయథేకే)కు ‘నిబంధన’ లేదా ‘వీలునామా’ అనే రెండు అర్థాలు ఉండవచ్చు. ఇక్కడ 16–17 వచనాలను చాలామంది న్యాయపరమైన భావంలో గ్రహిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: నిబంధన
  rationale: హెబ్రీయులు 8–10 అధ్యాయాల విస్తృత సందర్భంలో యిర్మీయా 31లోని నిబంధన మరియు బలిద్వారా దాని ప్రారంభం ప్రధానంగా ఉన్నాయి. అయితే ఈ పదానికి ‘వీలునామా’ అనే న్యాయపరమైన అర్థం కూడా ఉండగలదు; దానిని పాదసూచికలో నిలిపాం.
- source_word: θάνατον
  choice: మరణం
  rationale: θάνατοςకు సహజమైన, నేరుగా సరిపడే తెలుగు పదం; ఇక్కడ నిజమైన మరణమే చర్చలో ఉంది.
- source_word: ἀνάγκη
  choice: అవసరం
  rationale: అనివార్యతను తెలిపే గ్రీకు నామవాచక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: φέρεσθαι
  choice: ముందుకు తీసుకురాబడడం
  rationale: φέρω యొక్క కర్మణి క్రియారూపంలో ఉన్న ‘తీసుకురావడం/ముందుకు తేవడం’ భావాన్ని నిలుపుతూ, మరణం విషయాన్ని సమర్పించాల్సిన అవసరాన్ని సూచిస్తుంది; ‘నిర్ధారించబడడం’ అని అర్థాన్ని అతిగా నిర్ణయించదు.
- source_word: τοῦ διαθεμένου
  choice: దానిని చేసిన వ్యక్తి
  rationale: διατίθεμαι కృదంతం నిబంధనను చేసిన లేదా ఏర్పరచిన వ్యక్తిని సూచిస్తుంది. ఈ అనువాదం ‘వీలునామా చేసినవాడు’ అనే న్యాయపరమైన అర్థాన్ని ప్రధాన పాఠ్యంలో ముందుగానే రుద్దదు.
- source_word: ὅπου γὰρ
  choice: ఎందుకంటే, ... ఉన్నచోట
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, ὅπου యొక్క స్థాన/పరిస్థితి భావాన్ని ‘ఉన్నచోట’తో సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: హెబ్రీయులు 9:16లో διαθήκηని ‘నిబంధన’గా అనువదించాలా, ‘వీలునామా’గా అనువదించాలా
  choice: ప్రధాన పాఠ్యంలో ‘నిబంధన’; పాదసూచికలో ‘వీలునామా’
  alternative: ప్రధాన పాఠ్యంలో ‘వీలునామా’ లేదా ‘చివరి వీలునామా’
  rationale: తక్షణ సందర్భమైన 16–17 వచనాలను చాలామంది వారసత్వ న్యాయార్థంలో గ్రహించినప్పటికీ, హెబ్రీయులు 8–10 అధ్యాయాల విస్తృత వాదన నిబంధనపై కేంద్రీకృతమై ఉంది. అందువల్ల ప్రధాన పాఠ్యంలో నిబంధనార్థాన్ని ఉంచి, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని న్యాయ/నిబంధన సందిగ్ధతను తొలగించకుండా, ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా పరిరక్షించాం.
