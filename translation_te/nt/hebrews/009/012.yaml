revisions:
- from: మేకపోతుల, దూడల రక్తం ద్వారా కాకుండా, తన సొంత రక్తం ద్వారా ఆయన ఒక్కసారే సర్వకాలానికి పరిశుద్ధ స్థలాల్లోకి[a] ప్రవేశించి, శాశ్వత విమోచనను సంపాదించాడు.
  to: మేకపోతులూ దూడలూ రక్తం ద్వారా కాదు గాని, తన సొంత రక్తం ద్వారా ఆయన ఒక్కసారే పరిశుద్ధ స్థలాల్లోకి[a] ప్రవేశించాడు; శాశ్వత విమోచనను సంపాదించినవాడై ప్రవేశించాడు.
  rationale: The revision makes ‘ప్రవేశించాడు’ the main verb, corresponding to εἰσῆλθεν, and represents εὑράμενος with ‘సంపాదించినవాడై.’ It retains the repeated ‘ద్వారా,’ the decisive ‘ఒక్కసారే,’ the plural ‘పరిశుద్ధ స్థలాలు,’ and the source’s ambiguity about the precise sanctuary referent. The semicolon separates the explanatory participial phrase while retaining its connection to the entry.
