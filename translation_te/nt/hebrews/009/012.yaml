id: HEB.9.12
reference: Hebrews 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: te
  text: మేకపోతులూ దూడలూ రక్తం ద్వారా కాదు గాని, తన సొంత రక్తం ద్వారా ఆయన ఒక్కసారే పరిశుద్ధ స్థలాల్లోకి[a] ప్రవేశించాడు; శాశ్వత విమోచనను సంపాదించినవాడై ప్రవేశించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిశుద్ధ మందిరంలోకి.’ గ్రీకు మూలంలో అక్షరార్థంగా ‘పరిశుద్ధ స్థలాల్లోకి’ అని ఉంది. కొన్ని అనువాదాలు దీన్ని మరింత నిర్దిష్టంగా ‘అతి పరిశుద్ధ స్థలంలోకి’ అని అనువదిస్తాయి; అయితే మూలంలోని పదాలు అంత నిర్దిష్టంగా చెప్పవు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: కాకుండా
  rationale: మునుపటి వాక్యంతో కొనసాగుతున్న ప్రతికూల వ్యత్యాసాన్ని తెలుగులో సహజంగా చూపుతుంది; తరువాతి ‘తన సొంత రక్తం ద్వారా’ అనే సానుకూల వ్యత్యాసంతో నేరుగా కలుస్తుంది.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: మేకపోతుల, దూడల రక్తం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది. ‘ద్వారా’ అనే పదం తరువాత పునరావృతమయ్యే సమాంతర వ్యత్యాసాన్ని కాపాడుతుంది; μόσχωνకు ‘దూడలు’ సహజమైన సమానార్థకం.
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: తన సొంత రక్తం ద్వారా
  rationale: పునరావృతమైన διάను మళ్లీ ‘ద్వారా’గా అనువదించడం మూలంలోని వ్యత్యాసాన్ని నిలుపుతుంది. ἰδίουలోని స్వకీయ ఉద్ఘాటనను ‘తన సొంత’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰσῆλθεν
  choice: ప్రవేశించి ... సంపాదించాడు
  rationale: గ్రీకు ప్రధాన క్రియ పూర్తయిన ప్రవేశాన్ని తెలియజేస్తుంది. తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ప్రవేశాన్ని అసమాపక క్రియగా ఉంచి, ఫలితాన్ని ప్రధాన క్రియగా వ్యక్తం చేశాం; రెండు కార్యాల పూర్తత్వం నిలుస్తుంది.
- source_word: ἐφάπαξ
  choice: ఒక్కసారే సర్వకాలానికి
  rationale: ఒకే ఒక్కసారి జరిగిన, మళ్లీ పునరావృతం కాని నిర్ణాయక కార్యం అనే భావాన్ని తెలియజేస్తుంది; ‘అందరి కోసం’ అనే మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: εἰς τὰ ἅγια
  choice: పరిశుద్ధ స్థలాల్లోకి
  rationale: గ్రీకులోని బహువచన రూపాన్ని నిలుపుతూ ఆరాధనా స్థల సంబంధిత భాషను కాపాడుతుంది. ‘అతి పరిశుద్ధ స్థలం’ అని అనువదిస్తే మూలపాఠం స్పష్టంగా చెప్పనిదాన్ని మరీ నిర్దిష్టం చేసినట్లవుతుంది.
- source_word: αἰωνίαν λύτρωσιν
  choice: శాశ్వత విమోచనను
  rationale: ఎప్పటికీ నిలిచే ఫలితమున్న విడుదల లేదా విముక్తి అనే భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εὑράμενος
  choice: సంపాదించాడు
  rationale: అక్షరార్థంగా ‘కనుగొని’ అయినప్పటికీ, ఈ సందర్భంలో సాధించడం లేదా పొందడం అనే ప్రయోగార్థం ఉంది. ‘సంపాదించాడు’ ఆ ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: క్రీస్తు తన సొంత రక్తం ద్వారా ప్రవేశించడం అనే మాట యొక్క భావం
  choice: జంతువుల రక్తానికి వ్యత్యాసంగా, ఆయన తన సొంత రక్తం ద్వారా పరిశుద్ధ స్థలాల్లోకి ప్రవేశించాడని మాత్రమే అనువదించబడింది.
  alternative: ఆయన తన రక్తాన్ని అక్షరార్థంగా తీసుకెళ్లి అక్కడ సమర్పించాడని చెప్పడం; లేదా రక్తం చిందించిన తరువాత మాత్రమే ప్రవేశించాడనేలా διά యొక్క సాధనార్థాన్ని బలహీనపరచడం.
  rationale: రెండుసార్లు వచ్చిన διά + షష్ఠీ విభక్తిని ‘ద్వారా’గా సమానంగా చూపడం లేవీయ బలులతో ఉన్న రూపక వ్యత్యాసాన్ని నిలుపుతుంది; పరలోక పరిశుద్ధ స్థలంలో రక్తం ఏ విధంగా సంబంధించింది అనే ఊహాత్మక వివరణను చేర్చదు.
- issue: τὰ ἅγια యొక్క పరిధి
  choice: పరిశుద్ధ స్థలాలు
  alternative: పరిశుద్ధ మందిరం; అతి పరిశుద్ధ స్థలం
  rationale: గ్రీకు పదబంధం బహువచనంలో ఉంది, అయితే అది పరిశుద్ధ మందిరానికి ఆరాధనా సంబంధిత నామంగా కూడా వాడవచ్చు. ‘అతి పరిశుద్ధ స్థలం’ అని నిర్దిష్టం చేయకుండా మూలంలోని విస్తృతతను, వ్యాఖ్యాన అవకాశాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ద్వారా’ పునరావృతం మూలంలోని సాధనార్థక వ్యత్యాసాన్ని కాపాడుతుంది. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘పరిశుద్ధ స్థలాల్లోకి’ అన్న పదబంధం వెంట ఉంచాం.
