id: HEB.9.4
reference: Hebrews 9:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: te
  text: బంగారు ధూపవేదికను, అన్ని వైపులా బంగారంతో కప్పబడిన నిబంధన మందసాన్ని కలిగి ఉంది. ఆ మందసంలో మన్నాను ఉంచిన బంగారు పాత్ర, చిగురించిన అహరోను కర్ర, నిబంధన పలకలు ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμιατήριον
  choice: ధూపవేదిక
  rationale: ఈ పదం ధూపం వేసే పాత్రను లేదా ధూపవేదికను సూచించగలదు. గుడారపు సామగ్రిని వర్ణిస్తున్న సందర్భంలో ‘ధూపవేదిక’ సహజమైన ప్రధాన అనువాదం; నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: χρυσοῦν
  choice: బంగారు
  rationale: ‘బంగారంతో చేసిన/బంగారుదైన’ అనే అర్థాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κιβωτὸν τῆς διαθήκης
  choice: నిబంధన మందసం
  rationale: పవిత్రమైన నిబంధన పెట్టెకు తెలుగులో స్థిరపడిన, గౌరవప్రదమైన బైబిలు పదబంధం.
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: అన్ని వైపులా బంగారంతో కప్పబడిన
  rationale: περικεκαλυμμένην మరియు πάντοθεν సూచించే చుట్టూ సంపూర్ణంగా కప్పబడిన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν ᾗ
  choice: ఆ మందసంలో
  rationale: స్త్రీలింగ ఏకవచన సంబంధ సర్వనామం మందసాన్ని సూచిస్తుంది; తెలుగులో సూచ్యాన్ని మళ్లీ పేర్కొనడం జాబితా సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: మన్నాను ఉంచిన బంగారు పాత్ర
  rationale: στάμνος‌ను సాధారణ పాఠకులకు అర్థమయ్యే ‘పాత్ర’గా, ἔχουσα‌ను సహజంగా ‘ఉంచిన’గా అనువదిస్తుంది.
- source_word: ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: చిగురించిన అహరోను కర్ర
  rationale: βλαστήσασα సూచించే చిగురించే సంఘటనను నేరుగా నిలుపుతూ, ῥάβδος‌కు సహజమైన ‘కర్ర’ను ఉపయోగిస్తుంది.
- source_word: πλάκες τῆς διαθήκης
  choice: నిబంధన పలకలు
  rationale: ‘పలకలు’ πλάκες‌కు నేరమైన అనువాదం; మూలంలో లేని ‘రాతి’ అనే విశేషణాన్ని చేర్చలేదు.
- source_word: διαθήκης
  choice: నిబంధన
  rationale: ఈ ఆరాధనా మరియు బైబిలు సందర్భంలో covenant భావాన్ని సరియైన విధంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: θυμιατήριον అనే పదం ధూపవేదికనా, ధూపపాత్రనా
  choice: ధూపవేదిక
  alternative: ధూపపాత్ర
  rationale: పదానికి రెండు అర్థాలూ సాధ్యమే; గుడారపు సామగ్రి వర్ణనలో వేదిక ప్రధాన పాఠానికి తగినదిగా కనిపిస్తుంది. అయితే చారిత్రక-స్థాన సంబంధమైన ఉద్రిక్తతను అనువాదంలోనే తీర్చివేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ఈ వచనం 9:2–5లో కొనసాగుతున్న వాక్యభాగమని గుర్తిస్తూ తెలుగులో సంపూర్ణంగా చదవదగిన నిర్మాణం ఇచ్చాం; ‘అక్కడ ఉన్నాయి’ ద్వారా సంబంధాన్ని సహజీకరించాం.
