source:
  edition: SBLGNT
  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: te
  text: 'అలాగే ఆయన ఆ రక్తంతో పవిత్ర గుడారాన్నీ[a], ఆరాధనా సేవకు సంబంధించిన ఉపకరణాలన్నిటినీ[b] చిలకరించాడు.


    [a] లేదా, “గుడారాన్ని.” గ్రీకు పదానికి “గుడారం” అని అర్థం; ఇక్కడ అది పవిత్ర గుడారాన్ని సూచిస్తుంది.


    [b] లేదా, “సేవకు సంబంధించిన సామగ్రి అంతటినీ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గుడారాన్ని.” గ్రీకు పదానికి “గుడారం” అని అర్థం; ఇక్కడ అది పవిత్ర గుడారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సేవకు సంబంధించిన సామగ్రి అంతటినీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: పవిత్ర గుడారం
  rationale: సాధారణ గుడారం కంటే, ఈ అధ్యాయ సందర్భంలో మోషే కాలపు ఆరాధనా గుడారాన్ని సూచిస్తుంది. ‘పవిత్ర గుడారం’ ఆధునిక పాఠకులకు అర్థమయ్యేలా ఆలయ సంబంధ భావాన్ని నిలుపుతుంది; ‘గుడారం’ అనే అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: σκεύη
  choice: ఉపకరణాలు
  rationale: ఆరాధన సేవలో ఉపయోగించే వివిధ వస్తువులు, పాత్రలు, పనిముట్లు అన్నింటినీ కలుపుకునే సహజమైన విస్తృత పదం.
- source_word: λειτουργία
  choice: ఆరాధన సేవ
  rationale: ఇక్కడ సాధారణ సేవ కాకుండా యాజక సంబంధమైన పవిత్ర సేవ ఉద్దేశించబడింది. ‘ఆరాధన సేవ’ ఆ ప్రత్యేక సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: αἷμα
  choice: రక్తం
  rationale: బలి రక్తానికి అక్షరార్థ సూచన; ముందు సందర్భాన్ని బట్టి గ్రీకు నిర్దిష్ట రూపాన్ని ‘ఆ రక్తంతో’గా వ్యక్తం చేశాం.
- source_word: ὁμοίως
  choice: అలాగే
  rationale: ముందటి వచనంలో చెప్పిన చిలకరింపుతో ఈ చర్యకు ఉన్న పోలికను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐράντισεν
  choice: చిలకరించాడు
  rationale: రక్తాన్ని ఆచారబద్ధంగా చల్లడాన్ని తెలిపే స్పష్టమైన, ప్రస్తుత వాడుకలోని తెలుగు పదం.
- source_word: δὲ
  choice: —
  rationale: ఇక్కడ δέ స్వల్ప అనుసంధానాన్ని ఇస్తుంది; ‘అలాగే’తో ఆ సంబంధం ఇప్పటికే సహజంగా వ్యక్తమవుతున్నందున వేరుగా అనువదించలేదు.
- source_word: πάντα τὰ σκεύη
  choice: ఉపకరణాలన్నిటినీ
  rationale: πάντα యొక్క సమగ్రతను ‘అన్నిటినీ’ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: నిర్గమకాండలోని మోషే ఆచారాలతో ఈ వచనానికి ఉన్న సంబంధం
  choice: మోషే పవిత్ర గుడారాన్నీ దాని ఆరాధనా ఉపకరణాలన్నిటినీ రక్తంతో చిలకరించినట్లు వచనం చెప్పే సారాంశాన్ని నేరుగా అనువదించడం
  alternative: నిర్గమకాండ నేపథ్యాన్ని విస్తరించి వివరించడం లేదా కథనాల మధ్య కనిపించే భేదాలను సమన్వయపరచడం
  rationale: మూల వచనం ఆచార సంబంధ ప్రతిష్ఠాపన లేదా శుద్ధీకరణను సంక్షిప్తంగా చెబుతుంది. అనువాదం దానికంటే ఎక్కువ చారిత్రక వివరణను చేర్చకూడదు; అంతర్వచన ఉద్రిక్తతను పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. గ్రీకులోని జత నిర్మాణాన్ని ‘గుడారాన్నీ … ఉపకరణాలన్నిటినీ’ అనే ద్వితీయావిభక్తి సముచ్చయంతో నిలిపాం. ఆచార సంబంధ పదజాలాన్ని అతి సాంకేతికంగా చేయకుండా స్పష్టంగా ఉంచాం.
