id: HEB.9.13
reference: Hebrews 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: te
  text: ఎందుకంటే, మేకపోతుల, ఎద్దుల రక్తమూ, అపవిత్రులైనవారిపై[a] చల్లబడే ఆడ దూడ బూడిదా[c][d] శరీర శుద్ధి కోసం వారిని పవిత్రపరుస్తే[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆచారపరంగా అపవిత్రులైనవారిపై’. ఇక్కడ గ్రీకు పదం ఆచార సంబంధమైన అపవిత్రతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, పాత నిబంధన ఆచారాల ప్రకారం బాహ్యమైన, శరీర సంబంధమైన శుద్ధి.
    reason: cultural_note
  - marker: c
    text: ఇది ఆడ దూడ బూడిదతో చేసే శుద్ధీకరణ ఆచారాన్ని సూచిస్తుంది; సంఖ్యాకాండము 19 చూడండి.
    reason: cross_reference
  - marker: d
    text: గ్రీకు వాక్య నిర్మాణాన్ని మరింత అక్షరార్థంగా అనువదిస్తే, ‘అపవిత్రులైనవారిపై చల్లే ఆడ దూడ బూడిద’.
    reason: translation_note
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ఎందుకంటే ... పవిత్రపరుస్తే
  rationale: γάρ యొక్క కారణసూచక భావాన్ని ‘ఎందుకంటే’తో, εἰ యొక్క షరతు భావాన్ని క్రియాంతంలోని ‘-తే’తో నిలిపాం. వాక్యం 14వ వచనంలో పూర్తయ్యే షరతు వాక్యంగా ఉండటాన్ని కూడా అలాగే ఉంచాం.
- source_word: αἷμα τράγων καὶ ταύρων
  choice: మేకపోతుల, ఎద్దుల రక్తం
  rationale: బలి ఆచార సందర్భంలోని జంతువుల రక్తాన్ని నేరుగా, సహజమైన తెలుగు పదాలతో అనువదించాం; τράγων లోని మగజంతువు భావాన్ని ‘మేకపోతులు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: σποδὸς δαμάλεως
  choice: ఆడ దూడ బూడిద
  rationale: δαμάλις యౌవన ఆడ పశువును సూచిస్తుంది. సాధారణ పాఠకులకు అర్థమయ్యేలా ‘ఆడ దూడ’ అని ఇచ్చి, సంఖ్యాకాండము 19లోని శుద్ధీకరణ ఆచార సంబంధాన్ని నిలిపాం.
- source_word: ῥαντίζουσα
  choice: చల్లబడే
  rationale: తెలుగులో బూడిదనే చల్లే కర్తగా చెప్పడం అసహజంగా ఉండటంతో ఆచార చర్యను సహజమైన కర్మణి రూపంలో తెలిపాం. గ్రీకు క్రియారూపపు క్రియాశీల నిర్మాణాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: τοὺς κεκοινωμένους
  choice: అపవిత్రులైనవారు
  rationale: ఇక్కడ κοινόω నైతిక భ్రష్టతను కాక ఆచారపరమైన అపవిత్రతను సూచిస్తుంది. ప్రధాన పాఠంలో సంక్షిప్త రూపాన్ని ఉంచి, ఆచార భావాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: ἁγιάζει
  choice: పవిత్రపరుస్తుంది
  rationale: పాత నిబంధన ఆచారాల పరిధిలోని పవిత్రీకరణ భావాన్ని నిలిపే పదం. అంతరంగ నైతిక మార్పు అని అదనంగా వ్యాఖ్యానించలేదు.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: శరీర శుద్ధి కోసం
  rationale: σάρξ ఇక్కడ పాప స్వభావాన్ని కాక బాహ్యమైన, శారీరక ఆచార శుద్ధిని సూచిస్తుంది. ‘శరీర శుద్ధి’ 14వ వచనంలోని మనస్సాక్షి శుద్ధితో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: పాత నిబంధన ఆచారాలు ‘పవిత్రపరచడం’ అనే మాట యొక్క పరిధి
  choice: ఆచారపరమైన, బాహ్య పవిత్రీకరణ
  alternative: అంతరంగ ఆధ్యాత్మిక లేదా నైతిక పరివర్తన
  rationale: ‘శరీర శుద్ధి కోసం’ అనే పరిమితి మరియు తరువాతి వచనంలోని మనస్సాక్షి శుద్ధితో పోలిక ఇక్కడ బాహ్య ఆచారపరమైన ఫలితాన్నే సూచిస్తాయి.
- issue: σάρξ యొక్క భావం
  choice: బాహ్య శరీరం
  alternative: పాప స్వభావం
  rationale: బలి, చల్లడం, అపవిత్రత అనే ఆచార సందర్భం వల్ల ఇక్కడ σάρξ అక్షరార్థమైన శరీర సంబంధ శుద్ధిని సూచిస్తుంది; పాప స్వభావమనే రూపకార్థాన్ని తీసుకురాలేదు.
- issue: ῥαντίζουσα యొక్క సంబంధం మరియు కర్తృత్వం
  choice: బూడిదకు సంబంధించిన చల్లే చర్యను తెలుగులో కర్మణి రూపంగా వ్యక్తీకరించడం
  alternative: ‘అపవిత్రులైనవారిపై చల్లే ఆడ దూడ బూడిద’ అని క్రియాశీలంగా అనువదించడం
  rationale: గ్రీకులో స్త్రీలింగ ఏకవచన కృదంతం σποδός (‘బూడిద’)తో వ్యాకరణపరంగా సరిపోతుంది. అయితే తెలుగులో బూడిదనే ఉద్దేశపూర్వక కర్తగా చెప్పడం కఠినంగా ఉంటుంది; కర్మణి రూపం చర్యను మార్చకుండా సహజతను ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడాం. ‘మేకపోతులు’, ‘ఆడ దూడ’, ‘శరీర శుద్ధి’ వంటి స్పష్టమైన పదాలను ఎంచుకున్నాం. మూలంలో వాక్యం తరువాతి వచనంలో పూర్తవుతుందనే నిర్మాణాన్ని చివరి కామాతో నిలిపాం.
