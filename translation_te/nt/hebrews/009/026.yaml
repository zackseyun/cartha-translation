  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: te
  text: లేకపోతే, లోకం స్థాపించబడినప్పటి నుండి ఆయన అనేకసార్లు బాధ అనుభవించవలసి వచ్చేది. అయితే ఇప్పుడు యుగాల పరిపూర్ణత సమయంలో, పాపాన్ని తొలగించడానికి తనను తానే బలిగా అర్పించడం ద్వారా ఆయన ఒక్కసారే ప్రత్యక్షమయ్యాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యుగాల ముగింపు సమయంలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తన బలి ద్వారా’ అని కూడా అనువదించవచ్చు. గ్రీకులో అక్షరార్థంగా, ‘తన యొక్క బలి ద్వారా’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: లేకపోతే
  rationale: మునుపటి వాదన నిజం కాకపోతే కలిగే పరిణామాన్ని ఈ పదం సూచిస్తుంది; తెలుగులో ‘లేకపోతే’ ఆ తార్కిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἔδει αὐτὸν πολλάκις παθεῖν
  choice: ఆయన అనేకసార్లు బాధ అనుభవించవలసి వచ్చేది
  rationale: అసంభవమైన ఊహాత్మక అవసరాన్ని ἔδει యొక్క భూతకాల రూపం సూచిస్తుంది; πολλάκις‌కు ‘అనేకసార్లు’ అని ఇచ్చి తరువాతి ἅπαξ‌తో ఉన్న వ్యత్యాసాన్ని నిలిపింది.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: లోకం స్థాపించబడినప్పటి నుండి
  rationale: లోకం స్థాపించబడిన కాలం మొదలుకొని అనే కాలార్థాన్ని స్పష్టంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: νυνὶ δὲ
  choice: అయితే ఇప్పుడు
  rationale: ఊహాత్మక పరిస్థితికి వాస్తవ పరిస్థితికి మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: ἅπαξ
  choice: ఒకేసారి, శాశ్వతంగా
  rationale: ‘అనేకసార్లు’ అనే పదానికి వ్యతిరేకంగా ఒకే సంఘటనను, మళ్లీ చేయనవసరం లేని దాని నిర్ణాయక స్వభావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: యుగాల పరిపూర్ణతలో
  rationale: సాధారణ కాలాంతం మాత్రమే కాక యుగాలు తమ లక్ష్యానికి చేరే పరిపూర్తి భావాన్ని, αἰώνων యొక్క బహువచనాన్ని నిలుపుతుంది.
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: పాపాన్ని తొలగించడానికి
  rationale: ἀθέτησις‌లోని పక్కన పెట్టడం, రద్దు చేయడం, ప్రభావరహితం చేయడం అనే నిర్ణాయక భావాన్ని సాధారణ పాఠకునికి అర్థమయ్యే విధంగా అందిస్తుంది.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: తననే బలిగా అర్పించడం ద్వారా
  rationale: మూలంలోని పదబంధం ‘తనను తానే అర్పించిన బలి’ అనే భావానికి వీలిస్తుంది; తెలుగులో ఈ రూపం క్రీస్తే అర్పిత బలి అనే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πεφανέρωται
  choice: ప్రత్యక్షమయ్యాడు
  rationale: సంపూర్ణమైన ప్రత్యక్షతకు కొనసాగుతున్న ప్రాముఖ్యత ఉందనే పరిపూర్ణకాల భావాన్ని సందర్భం మోస్తుండగా, ఈ క్రియ సహజమైన తెలుగు రూపాన్ని ఇస్తుంది.
theological_decisions:
- issue: ἅπαξ ద్వారా క్రీస్తు బలి యొక్క ఒక్కసారితనం
  choice: ‘ఒకేసారి, శాశ్వతంగా’ అని అనువదించడం
  alternative: ‘ఒక్కసారి’
  rationale: πολλάκις (‘అనేకసార్లు’)తో ఉన్న ప్రత్యక్ష వ్యత్యాసం, హెబ్రీయులకు 9లోని వాదన ఈ బలి పునరావృతం కాని నిర్ణాయక కార్యమని సూచిస్తాయి.
- issue: ἁμαρτίας యొక్క ఏకవచన పరిధి
  choice: ‘పాపం’ అనే ఏకవచనాన్ని నిలపడం
  alternative: ‘పాపాలు’
  rationale: గ్రీకు ఏకవచనం పాపాన్ని వ్యక్తిగత కార్యాల జాబితాగా మాత్రమే కాక సమగ్ర వాస్తవంగా చూపుతుంది; అందువల్ల మూలంలోని విస్తృతిని కాపాడుతుంది.
- issue: διὰ τῆς θυσίας αὐτοῦ లో αὐτοῦ సంబంధం
  choice: ‘తననే బలిగా అర్పించడం ద్వారా’
  alternative: ‘తన బలి ద్వారా’
  rationale: సందర్భం క్రీస్తు తనను తానే అర్పించడాన్ని సూచిస్తుంది. అయినా వ్యాకరణపరంగా సంక్షిప్తమైన ‘తన బలి ద్వారా’ కూడా సాధ్యమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘యుగాల పరిపూర్ణత’ వంటి మూలపాఠంలోని గంభీర భావాన్ని నిలిపి, అస్పష్టమైన αὐτοῦ సంబంధాన్ని పాదసూచికతో సూచించింది.
