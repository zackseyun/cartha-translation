  to: లేకపోతే, లోకం స్థాపించబడినప్పటి నుండి ఆయన అనేకసార్లు బాధ అనుభవించవలసి వచ్చేది. అయితే ఇప్పుడు యుగాల పరిపూర్ణత సమయంలో, పాపాన్ని తొలగించడానికి తనను తానే బలిగా అర్పించడం ద్వారా ఆయన ఒక్కసారే ప్రత్యక్షమయ్యాడు.[a][b]
