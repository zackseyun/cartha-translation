revisions:
- from: 'దీని ద్వారా పరిశుద్ధాత్మ ఇలా సూచిస్తున్నాడు: మొదటి గుడారం ఇంకా నిలిచి ఉన్నంతకాలం[b], పరిశుద్ధ స్థలాల్లోకి వెళ్లే మార్గం[a] ఇంకా వెల్లడి కాలేదు.'
