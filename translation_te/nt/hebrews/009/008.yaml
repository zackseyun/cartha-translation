source:
  edition: SBLGNT
  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: te
  text: 'పరిశుద్ధాత్మ ఈ విషయాన్ని సూచిస్తున్నాడు: మొదటి గుడారం ఇంకా నిలిచి ఉన్నంతకాలం[b], పరిశుద్ధ స్థలాల్లోకి ప్రవేశించే మార్గం[a] ఇంకా వెల్లడి కాలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధ మందిరంలోకి ప్రవేశించే మార్గం.” ఈ గ్రీకు పదబంధం పవిత్ర ప్రదేశాలను సాధారణంగా సూచించవచ్చు; కొందరు దీన్ని మరింత నిర్దిష్టంగా “అతి పరిశుద్ధ స్థలంలోకి ప్రవేశించే మార్గం” అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మొదటి గుడారపు వ్యవస్థ ఇంకా కొనసాగుతున్నంతకాలం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: ఇలా సూచిస్తున్నాడు
  rationale: వర్తమాన కృదంతం సందర్భంలో పరిశుద్ధాత్మ కొనసాగిస్తూ తెలియజేస్తున్న భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘సూచిస్తున్నాడు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: πνεύματος τοῦ ἁγίου
  choice: పరిశుద్ధాత్మ
  rationale: కొత్త నిబంధనలోని వ్యక్తిగత దైవిక సూచనను తెలిపే స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: μήπω πεφανερῶσθαι
  choice: ఇంకా వెల్లడి కాలేదు
  rationale: పరిపూర్ణ కర్మణి రూపం ఇప్పటివరకు వెల్లడికాని స్థితిని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ కొనసాగుతున్న ఫలితస్థితిని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: పరిశుద్ధ స్థలాల్లోకి వెళ్లే మార్గం
  rationale: గుడారపు సందర్భంలో τὰ ἅγια పవిత్ర స్థలాలను సూచిస్తుంది. బహువచనాన్ని నిలుపుతూ, ὁδός సూచించే ప్రవేశ భావాన్ని ‘లోకి వెళ్లే’ అని సహజంగా వ్యక్తం చేసింది.
- source_word: πρώτης σκηνῆς
  choice: మొదటి గుడారం
  rationale: మునుపటి వచనాల్లో వివరించిన గుడారంలోని మొదటి విభాగాన్ని సూచిస్తుంది; ‘గుడారం’ ఆరాధనా సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐχούσης στάσιν
  choice: ఇంకా నిలిచి ఉన్నంతకాలం
  rationale: ఈ పదబంధం గుడారం కొనసాగి ఉండటాన్ని లేదా దాని స్థితి కొనసాగటాన్ని సూచించగలదు. ప్రధాన పాఠంలోని రూపం సహజమైన తెలుగులో ప్రాథమిక స్థలార్థాన్ని నిలుపుతుంది.
- source_word: ἔτι
  choice: ఇంకా
  rationale: కొనసాగుతున్న కాలస్థితిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: τῶν ἁγίων అనే పదబంధం దేనిని సూచిస్తుంది
  choice: పరిశుద్ధ స్థలాల్లోకి ప్రవేశం
  alternative: పరిశుద్ధుల మార్గం
  rationale: సమీప సందర్భం గుడారపు నిర్మాణం, యాజకుల ప్రవేశం గురించి ఉంది; అందువల్ల ఇది ప్రజలను కాక ఆరాధనా పవిత్ర స్థలాన్ని సూచిస్తుంది.
- issue: పవిత్ర స్థలం ఎంత నిర్దిష్టమైనది
  choice: పరిశుద్ధ స్థలాలు అనే విస్తృత సూచన
  alternative: అతి పరిశుద్ధ స్థలం మాత్రమే
  rationale: సందర్భం ముఖ్యంగా లోపలి పరిశుద్ధ స్థలాన్ని సూచించే అవకాశం ఉన్నా, గ్రీకు బహువచనం విస్తృతమైన భావాన్ని అనుమతిస్తుంది. ప్రధాన పాఠం ఆ అస్పష్టతను అనవసరంగా కుదించదు.
- issue: మొదటి గుడారం నిలిచి ఉండటం అనే భావం
  choice: భౌతికంగా లేదా వ్యవస్థగా కొనసాగి ఉండగల విస్తృత పదప్రయోగం
  alternative: మొదటి గుడారపు వ్యవస్థ అమలులో ఉండటం
  rationale: στάσις ఉనికి, స్థానం లేదా కొనసాగుతున్న ప్రాముఖ్యతను సూచించగలదు. ప్రధాన పాఠం దృశ్యరూపాన్ని నిలుపుతుండగా, పాదసూచిక సంస్థాగత భావసాధ్యతను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. గుడారపు ఆరాధనా సందర్భం స్పష్టంగా ఉంచబడింది; ‘పరిశుద్ధ స్థలాలు’ అనే బహువచనం ద్వారా మూలంలోని విస్తృతి, ‘నిలిచి ఉన్నంతకాలం’ ద్వారా στάσις లోని స్థితి/కొనసాగింపు ఉద్రిక్తత సంరక్షించబడింది.
