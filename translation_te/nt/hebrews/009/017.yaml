id: HEB.9.17
reference: Hebrews 9:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία, ἐπεὶ ⸀μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: te
  text: ఎందుకంటే, నిబంధన చనిపోయినవారి విషయంలో చెల్లుబాటులో ఉంటుంది[b][a]; దాన్ని చేసినవాడు జీవించి ఉన్నంతకాలం అది ఎన్నడూ అమలులో ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఎందుకంటే, వీలునామా మరణం తరువాతే చెల్లుతుంది; దాన్ని చేసినవాడు జీవించి ఉన్నంతకాలం అది ఎన్నడూ అమలులో ఉండదు.” గ్రీకు పదానికి “నిబంధన” లేదా “వీలునామా” అనే రెండు అర్థాలు రావచ్చు.'
    reason: alternative_reading
  - marker: b
    text: “చనిపోయినవారి విషయంలో” అనే గ్రీకు పదబంధం సంక్షిప్తంగా ఉంది. అది వీలునామా భావంలో చనిపోయిన వ్యక్తులను సూచించవచ్చు; లేదా నిబంధనను స్థాపించడంలో సంభవించిన మరణాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: నిబంధన
  rationale: హెబ్రీయులు 8–10 అధ్యాయాల విస్తృత సందర్భంలో మోషే నిబంధన, కొత్త నిబంధన, రక్తంతో నిబంధన స్థాపన ప్రధానంగా ఉన్నాయి. అయితే ఈ గ్రీకు పదానికి ‘వీలునామా’ అనే అర్థమూ సాధ్యమైనందున దాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἐπὶ νεκροῖς
  choice: చనిపోయినవారి విషయంలోనే
  rationale: గ్రీకులోని సంక్షిప్తమైన ప్రయోగాన్ని సహజమైన తెలుగులో కొంతవరకు తెరిచి ఉంచుతుంది. ఇది మరణించిన వ్యక్తులను సూచించవచ్చు; లేదా నిబంధన స్థాపనలో సంభవించిన మరణాన్ని సూచించవచ్చు.
- source_word: βεβαία
  choice: స్థిరమవుతుంది
  rationale: కేవలం నిశ్చయతను కాకుండా న్యాయపరమైన లేదా నిబంధనాత్మక చెల్లుబాటును, స్థిరత్వాన్ని తెలియజేస్తుంది.
- source_word: ἐπεὶ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని పరిచయం చేసే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μήποτε
  choice: ఎన్నడూ ... ఉండదు
  rationale: ఈ సందర్భంలో ἰσχύειతో కలిసి ‘ఏ సమయంలోనూ కాదు’ అనే భావాన్ని ఇస్తుంది.
- source_word: ἰσχύει
  choice: అమలులో ఉండదు
  rationale: న్యాయపరంగా లేదా నిబంధనాపరంగా కార్యసాధక శక్తి కలిగి ఉండడాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὅτε ζῇ
  choice: జీవించి ఉన్నంతకాలం
  rationale: మరణస్థితికి విరుద్ధంగా కొనసాగుతున్న జీవితకాలాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὁ διαθέμενος
  choice: దాన్ని చేసినవాడు
  rationale: నిబంధన చేసినవాడు లేదా వీలునామా చేసినవాడు అనే రెండు సాధ్యార్థాలనూ ముందుగానే తేల్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: διαθήκηను ‘నిబంధన’గా అనువదించాలా, ‘వీలునామా’గా అనువదించాలా?
  choice: ప్రధాన పాఠంలో ‘నిబంధన’
  alternative: ‘వీలునామా’
  rationale: హెబ్రీయులు 8–10లో నిబంధన ప్రధాన సందర్భం. అయినా 9:16–17లో వీలునామా సంబంధమైన న్యాయార్థం నిజమైన ప్రత్యామ్నాయ పఠనం కాబట్టి దాన్ని పాదటిప్పణిలో స్పష్టంగా భద్రపరిచాం.
- issue: ἐπὶ νεκροῖςలోని అస్పష్టతను ఎంతవరకు పరిష్కరించాలి?
  choice: ‘చనిపోయినవారి విషయంలోనే’ అనే ఉద్దేశపూర్వకంగా తెరిచి ఉన్న అనువాదం
  alternative: ‘మరణం సంభవించిన తరువాత’ లేదా ‘చనిపోయిన బలి ప్రాణుల ఆధారంగా’
  rationale: ఈ పదబంధం మరణించిన వీలునామాదారుని సూచిస్తుందా, లేక నిబంధన స్థాపనలోని బలి మరణాలను సూచిస్తుందా అన్నది వివాదాస్పదం. అందువల్ల ప్రధాన పాఠం ఏ ఒక్క వివరణనూ బలవంతంగా స్థిరపరచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన, సహజమైన శైలి. ‘చనిపోయినవారి విషయంలోనే’ కొద్దిగా అసాధారణంగా వినిపించినా, మూలంలోని నిజమైన సంక్షిప్తతను మరియు ద్వంద్వార్థాన్ని కాపాడేందుకు ఉద్దేశపూర్వకంగా ఎంచుకున్నాం. ప్రధాన పాఠంలోని గుర్తులు ఇచ్చిన పాదటిప్పణులకు అనుగుణంగా [b][a] క్రమంలో ఉన్నాయి.
