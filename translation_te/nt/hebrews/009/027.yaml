id: HEB.9.27
reference: Hebrews 9:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: te
  text: మనుషులకు ఒక్కసారి మరణించడం నియమించబడి ఉన్నట్లే, ఆ తర్వాత తీర్పు ఉంటుంది,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: ఉన్నట్లే
  rationale: ఈ పదబంధం 28వ వచనంలో కొనసాగే పోలికను ప్రవేశపెడుతోంది. తెలుగు వాక్యనిర్మాణంలో ‘ఉన్నట్లే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀπόκειται
  choice: నియమించబడి
  rationale: మూల క్రియకు ‘దాచిపెట్టబడి ఉంది’ అనే అర్థం ఉండగలిగినా, ఇక్కడ దాతృవిభక్తి మరియు క్రియార్థక రూపంతో కలిసి మనుషులకు స్థిరపరచబడిన గతిని సూచిస్తుంది.
- source_word: τοῖς ἀνθρώποις
  choice: మనుషులు
  rationale: గ్రీకు పదం ఇక్కడ పురుషులకు మాత్రమే కాక సమస్త మానవాళికి సాధారణంగా వర్తిస్తుంది; ‘మనుషులు’ ఆధునిక తెలుగులో ఆ సమగ్ర భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: ἅπαξ
  choice: ఒక్కసారి
  rationale: మరణం ఒకసారి సంభవించడాన్ని సూచిస్తుంది. ‘ఒక్కసారిగా’ లేదా ‘శాశ్వతంగా ఒక్కసారే’ వంటి అధిక అర్థాన్ని చేర్చలేదు.
- source_word: ἀποθανεῖν
  choice: చనిపోవడం
  rationale: సాధారణమైన ‘చనిపోవడం’ మూలంలోని సరళమైన క్రియార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: μετὰ δὲ τοῦτο
  choice: ఆ తర్వాత
  rationale: మరణం తరువాత తీర్పు అనే క్రమాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: κρίσις
  choice: తీర్పు
  rationale: న్యాయపరమైన పరిశీలన లేదా తీర్పు అనే విస్తృత అర్థాన్ని నిలుపుతుంది; ‘శిక్ష’ లేదా ‘దోషనిర్ణయం’ అని ఫలితాన్ని ముందుగానే నిర్దేశించదు.
theological_decisions:
- issue: τοῖς ἀνθρώποις యొక్క సాధారణ మానవ సూచన
  choice: ‘మనుషులు’ అని సమస్త మానవాళిని సూచించేలా అనువదించడం
  alternative: ‘పురుషులు’
  rationale: మూలంలోని వ్యాకరణ రూపం పురుష బహువచనమైనప్పటికీ, సందర్భంలో అది లింగపరంగా పురుషులకు మాత్రమే పరిమితం కాదు. ‘మనుషులు’ ఆ ఉద్దేశాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
- issue: మరణం తరువాత κρίσις యొక్క పరిధి
  choice: వివరాలు జోడించకుండా ‘తీర్పు’ అని ఉంచడం
  alternative: ‘దోషశిక్ష’ లేదా ‘అంతిమ తీర్పు’
  rationale: ఈ వచనం మరణం తరువాత తీర్పు ఉంటుందని చెబుతుంది గాని, దాని ఫలితాన్ని లేదా సమగ్ర అంత్యకాల క్రమాన్ని ఇక్కడ వివరించదు.
- issue: 28వ వచనంతో పోలిక సంబంధం
  choice: ‘ఉన్నట్లే’తో వాక్యాన్ని కొనసాగింపుకు తెరిచి ఉంచడం
  alternative: పోలికను తొలగించి స్వతంత్ర ప్రకటనగా అనువదించడం
  rationale: καθ’ ὅσον తరువాతి వచనంలోని పోలికకు మొదటి భాగం. వచనం చివరి విరామచిహ్నం కూడా ఆ కొనసాగింపును సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘మనుషులు’ సమగ్ర మానవ సూచనను సహజంగా తెలియజేస్తుంది. వాక్యం 28వ వచనంలో కొనసాగే పోలికలో మొదటి భాగం కావడంతో చివర కామా ఉంచబడింది.
