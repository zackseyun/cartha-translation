- from: మనుషులు ఒక్కసారి చనిపోవడం నియమించబడి ఉన్నట్లే, ఆ తర్వాత తీర్పు ఉంటుంది,
  to: మనుషులకు ఒక్కసారి మరణించడం నియమించబడి ఉన్నట్లే, ఆ తర్వాత తీర్పు ఉంటుంది,
