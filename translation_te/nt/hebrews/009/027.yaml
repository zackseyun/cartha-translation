review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the comparison introduced by καθ’ ὅσον, the single occurrence denoted by ἅπαξ, and the unqualified postmortem κρίσις. However, τοῖς ἀνθρώποις is dative (‘for/to human beings’), which is more faithfully and idiomatically expressed by ‘మనుషులకు’ rather than the nominative ‘మనుషులు.’
  naturalness: ‘మనుషులు ఒక్కసారి చనిపోవడం నియమించబడి ఉంది’ is understandable but syntactically strained in modern standard Telugu. Using the dative and the noun-form ‘మరణించడం’ makes the construction natural while retaining the source structure and the open comparison with verse 28.
  terminology: ‘మనుషులకు’ appropriately conveys the generic-human reference without a gender-restrictive implication. ‘మరణించడం,’ ‘నియమించబడి ఉంది,’ and ‘తీర్పు’ are clear, suitably dignified, and do not add doctrinal specification.
  issues:
  - severity: medium
    issue: The rendering of τοῖς ἀνθρώποις as ‘మనుషులు’ does not reflect the Greek dative construction and yields an awkward Telugu clause.
    rationale: The phrase is best rendered ‘మనుషులకు ఒక్కసారి మరణించడం నియమించబడి ఉంది,’ preserving both the sense of an appointed human destiny and natural Telugu grammar.
  revised_text: మనుషులకు ఒక్కసారి మరణించడం నియమించబడి ఉన్నట్లే, ఆ తర్వాత తీర్పు ఉంటుంది,
  revised_footnotes: []
  revision_rationale: Changed ‘మనుషులు’ to ‘మనుషులకు’ to represent the source dative and improve idiomatic Telugu. Replaced ‘చనిపోవడం’ with the slightly more formal and natural ‘మరణించడం’ in this elevated register. The comma is retained because the comparison is completed in the following verse.
