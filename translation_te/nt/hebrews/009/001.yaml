  terminology: ‘నిబంధన,’ ‘ఆరాధన,’ and ‘పరిశుద్ధస్థలం’ are suitable established terms. ‘భూమికి చెందిన’ retains the intended earth/heaven contrast. The alternative ‘మొదటి వ్యవస్థ’ is a more natural Telugu expression than ‘మొదటి ఏర్పాటు’ for the broader possible referent.
