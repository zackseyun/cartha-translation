id: HEB.9.1
reference: Hebrews 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἶχε μὲν ⸀οὖν ἡ πρώτη δικαιώματα λατρείας τό τε ἅγιον κοσμικόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: te
  text: మొదటి నిబంధనకూ[a] ఆరాధనకు సంబంధించిన నియమాలూ, భూమికి చెందిన పరిశుద్ధస్థలమూ[b] ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మొదటిదానికి.’ ఇక్కడ దీనిని ‘మొదటి నిబంధన’గా అర్థం చేసుకోవచ్చు; మరికొందరు దీనిని మరింత సాధారణంగా ‘మొదటి వ్యవస్థ’గా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘లోకసంబంధమైన పరిశుద్ధస్థలం.’ ఈ అధ్యాయంలో తరువాత చెప్పబడే పరలోక వాస్తవాలకు భిన్నంగా, ఇక్కడ ‘భూమికి చెందిన’ అనే భావమే ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: ఉండేవి
  rationale: అసంపూర్ణ భూతకాల క్రియ పూర్వపు ఏర్పాటులో కొనసాగిన స్థితిని తెలియజేస్తుంది; తెలుగు వాక్య నిర్మాణంలో చివర ఉంచిన ‘ఉండేవి’ సహజంగా ఉంది.
- source_word: μὲν οὖν
  choice: కూడా
  rationale: ఈ సంయోగంలోని పరివర్తనాత్మక, స్వల్ప ఉద్ఘాటన భావాన్ని సందర్భానుసారంగా ‘కూడా’ సహజంగా వ్యక్తపరుస్తుంది; మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ను చేర్చదు.
- source_word: ἡ πρώτη
  choice: మొదటి నిబంధన
  rationale: గ్రీకులో నామవాచకం అధ్యాహారంగా ఉన్నప్పటికీ, 8:13లోని సమీప సందర్భం మొదటి నిబంధననే సూచిస్తుంది. స్పష్టమైన తెలుగుకోసం ‘నిబంధన’ను పూరించాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: δικαιώματα
  choice: నియమాలు
  rationale: ఆరాధనను క్రమబద్ధం చేసే నిర్దేశిత విధులను సూచించే స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: λατρείας
  choice: ఆరాధనకు సంబంధించిన
  rationale: ఇక్కడి ఆచారపరమైన సేవ లేదా ఆరాధన పరిధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τό τε ἅγιον
  choice: పరిశుద్ధస్థలం
  rationale: తదుపరి వచనాల్లో భాగాలు వివరించబడే పవిత్ర ఆలయ స్థలాన్ని విస్తృతంగా సూచిస్తుంది; ఒకే గదికి పరిమితం చేయదు.
- source_word: κοσμικόν
  choice: భూసంబంధమైన
  rationale: తరువాత చెప్పబడే పరలోక సంబంధమైన వాస్తవాలకు విరుద్ధంగా, భూమికి లేదా ఈ లోక వ్యవస్థకు చెందినదనే భావాన్ని ఇస్తుంది; నైతికంగా చెడ్డదనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: ἡ πρώτη అనే పదబంధంలోని అధ్యాహార నామవాచకం
  choice: మొదటి నిబంధన
  alternative: ‘మొదటిది’ లేదా ‘మొదటి ఏర్పాటు’
  rationale: హెబ్రీయులు 8 చివరలో మొదటి నిబంధన, కొత్త నిబంధనల మధ్య ఉన్న వ్యత్యాసమే సమీప సందర్భం. అయినా గ్రీకులో ‘నిబంధన’ మళ్లీ ప్రత్యక్షంగా లేదు కాబట్టి ఆ అస్పష్టతను పాదసూచికలో నిలిపాం.
- issue: κοσμικόν యొక్క భావం
  choice: భూసంబంధమైన
  alternative: లోకసంబంధమైన
  rationale: ఇక్కడ ప్రధాన వ్యత్యాసం నైతికమైనది కాదు; భూసంబంధమైన పరిశుద్ధస్థలానికి, తరువాతి పరలోక వాస్తవాలకు మధ్యది. ‘భూసంబంధమైన’ ఆ వ్యత్యాసాన్ని అపార్థం లేకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పరిశుద్ధస్థలం’ అనే పదం ఆరాధనా సందర్భపు గంభీరతను కాపాడుతుంది; ‘భూసంబంధమైన’ నైతిక ప్రతికూలార్థం లేకుండా భూమి–పరలోకం వ్యత్యాసాన్ని చూపిస్తుంది.
