revisions:
- from: ఇవి ఆహారపానీయాలకు, వివిధ రకాల శుద్ధీకరణ కడుగులకు మాత్రమే సంబంధించిన శరీర సంబంధమైన నియమాలు; అన్నీ సరిచేయబడే సమయం వచ్చేవరకు ఇవి విధించబడ్డాయి.
  to: ఇవి ఆహారాలు, పానీయాలు, వివిధ ఆచార కడుగులకు మాత్రమే సంబంధించిన శరీర సంబంధమైన నియమాలు; సరిదిద్దే కాలం వచ్చేవరకు విధించబడినవి.
