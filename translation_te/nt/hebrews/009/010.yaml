id: HEB.9.10
reference: Hebrews 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: te
  text: ఇవి ఆహారాలు, పానీయాలు, వివిధ ఆచార కడుగులకు మాత్రమే సంబంధించిన శరీర సంబంధమైన నియమాలు; సరిదిద్దే కాలం వచ్చేవరకు విధించబడినవి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρώμασιν καὶ πόμασιν
  choice: ఆహారపానీయాలకు
  rationale: ఆహారాలు, పానీయాలు అనే భావాన్ని సహజమైన ఆధునిక తెలుగు సమాసంతో వ్యక్తం చేస్తుంది.
- source_word: διαφόροις βαπτισμοῖς
  choice: వివిధ రకాల శుద్ధీకరణ కడుగులకు
  rationale: ఈ సందర్భంలో βαπτισμοί ఆచారపరమైన కడుగులను సూచిస్తుంది; సాధారణ బాప్తిస్మం అనే అర్థాన్ని అనవసరంగా దిగుమతి చేయకుండా శుద్ధీకరణ ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
- source_word: δικαιώματα σαρκὸς
  choice: శరీర సంబంధమైన నియమాలు
  rationale: σαρκός‌ను నైతికంగా పాపస్వభావం అని నిర్ణయించకుండా, బాహ్య శరీర సంబంధమైన ఆచార నియమాలుగా సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: καιροῦ διορθώσεως
  choice: అన్నీ సరిచేయబడే సమయం
  rationale: διορθώσεως‌లోని సరిచేయడం లేదా క్రమంలో పెట్టడం అనే భావాన్ని నిలుపుతూ, నిర్దిష్ట మతవ్యవస్థ పేరును వాక్యంలో చేర్చదు.
- source_word: ἐπικείμενα
  choice: విధించబడ్డాయి
  rationale: నియమాలు ఒక నిర్దిష్ట కాలం వరకు అమలులో ఉంచబడ్డాయనే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: διορθώσεως సూచించే కాలానికి గుర్తింపు
  choice: అన్నీ సరిచేయబడే సమయం
  alternative: కొత్త వ్యవస్థ ఏర్పడే సమయం / సంస్కరణ కాలం
  rationale: మూలపదం సూచించే పునఃక్రమీకరణ భావాన్ని ఉంచి, దానిని వాక్యంలోనే ఒక నిర్దిష్ట సిద్ధాంతపరమైన యుగంగా పూర్తిగా నిర్వచించకుండా genuine ambiguityని కాపాడుతుంది.
- issue: σαρκός యొక్క భావం
  choice: శరీర సంబంధమైన
  alternative: శరీరానికి సంబంధించిన / మాంససంబంధమైన
  rationale: ఇక్కడ ఆహారం, పానీయం, కడుగులు వంటి బాహ్య ఆచారాల సందర్భం ఉంది. ‘మాంససంబంధమైన’ అనడం పాపస్వభావం అనే అదనపు నైతిక భావాన్ని కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ రూపొందించబడింది. వచనం గ్రీకు మూలంలో ముందరి వాక్యంపై ఆధారపడే భాగవాక్యమైనప్పటికీ, తెలుగు ప్రచురణలో స్వతంత్రంగా చదవడానికి ‘ఇవి’ మరియు రెండో వాక్యఖండంలో ‘ఇవి’ చేర్చబడ్డాయి.
