id: HEB.9.15
reference: Hebrews 9:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: te
  text: ఈ కారణంగా ఆయన కొత్త నిబంధనకు[a] మధ్యవర్తిగా ఉన్నాడు; మొదటి నిబంధన కింద జరిగిన అతిక్రమాల నుండి విమోచనం కొరకు మరణం సంభవించినందున, పిలువబడినవారు శాశ్వత స్వాస్థ్యపు వాగ్దానాన్ని పొందేందుకు ఆయన మధ్యవర్తిగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కొత్త వీలునామాకు.’ గ్రీకు διαθήκη అనే పదానికి ‘నిబంధన,’ ‘వీలునామా’ అనే రెండు అర్థాలు రావచ్చు. ఈ వచనంలో మొదటి నిబంధనతో ఉన్న వ్యత్యాసానికి ‘నిబంధన’ బాగా సరిపోతుంది; అయితే హెబ్రీయులకు 9:16–17లో వీలునామా అనే అర్థఛాయ కూడా ముందుకు వస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ఈ కారణంగా
  rationale: ముందటి వాదనతో ఈ వాక్యాన్ని అనుసంధానించే కారణార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: διαθήκης καινῆς
  choice: కొత్త నిబంధనకు
  rationale: ఈ సందర్భంలో మొదటి నిబంధనతో ఉన్న వ్యత్యాసం ప్రధానమైనది; అందువల్ల ఒడంబడిక/వీలునామా అనే అర్థవ్యాప్తిలో నిబంధన భావమే ప్రధాన పాఠ్యంలో తగినది.
- source_word: μεσίτης
  choice: మధ్యవర్తి
  rationale: రెండు పక్షాల మధ్య నిలిచి సంబంధాన్ని కార్యరూపంలోకి తెచ్చే వ్యక్తిని సూచించే ఖచ్చితమైన, సాధారణ తెలుగు పదం.
- source_word: θανάτου γενομένου
  choice: ఒక మరణం సంభవించింది కాబట్టి
  rationale: జరిగిన మరణాన్ని తదుపరి ఫలితానికి ఆధారమైన పూర్తయిన సంఘటనగా చూపే genitive absolute భావాన్ని తెలియజేస్తుంది.
- source_word: ἀπολύτρωσιν
  choice: విమోచన కలిగించడానికి
  rationale: మూల్యం చెల్లించడం ద్వారా అతిక్రమాల బంధం లేదా దోషస్థితి నుంచి విడుదల కలిగే బలియర్పణ సందర్భాన్ని వ్యక్తం చేస్తుంది.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: మొదటి నిబంధన కింద జరిగిన అతిక్రమాల నుంచి
  rationale: ἐπί + dative ఇక్కడ మొదటి నిబంధన అధికార పరిధి లేదా కాలంలో జరిగిన అతిక్రమాలను సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో విమోచనకు సహజంగా ‘నుంచి’ వాడబడింది.
- source_word: τὴν ἐπαγγελίαν ... τῆς αἰωνίου κληρονομίας
  choice: శాశ్వత స్వాస్థ్యాన్ని గురించిన వాగ్దానాన్ని
  rationale: వాగ్దానం అనే ఏకవచన నామవాచకాన్ని నిలిపి, genitive సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది; వాగ్దానం మరియు స్వాస్థ్యాన్ని ఒకటిగా కలిపివేయదు.
- source_word: οἱ κεκλημένοι
  choice: పిలువబడినవారు
  rationale: పిలుపు పొందిన స్థితిలో ఉన్నవారనే perfect passive participle భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: λάβωσιν
  choice: పొందేలా
  rationale: ὅπως తో కూడిన ఉద్దేశం లేదా ఉద్దేశిత ఫలితాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ἐστίν లో అంతర్భూతమైన కర్త
  choice: ‘ఆయన’ అని స్పష్టంగా అనువదించి, తక్షణ సందర్భంలోని క్రీస్తు/యేసును సూచించడం
  alternative: తెలుగులో కర్తను పూర్తిగా వదిలివేయడం
  rationale: మూల గ్రీకులో కర్త సందర్భం ద్వారా స్పష్టమవుతుంది; తెలుగులో ‘ఆయన’ అనడం చదవడానికి సహజంగా ఉండి కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: διαθήκη యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘నిబంధన’
  alternative: ‘వీలునామా’ లేదా ‘మరణశాసనం’
  rationale: ఈ వచనంలో కొత్త నిబంధన–మొదటి నిబంధన వ్యత్యాసమే ప్రధానమైనది. అయితే 9:16–17లో పదానికి వీలునామా సంబంధిత అర్థఛాయ ఉపయోగించబడుతుంది కాబట్టి దానిని పాదటిప్పణిలో నిలిపాం.
- issue: τῆς αἰωνίου κληρονομίας మరియు τὴν ἐπαγγελίαν మధ్య సంబంధం
  choice: ‘శాశ్వత స్వాస్థ్యాన్ని గురించిన వాగ్దానం’
  alternative: ‘వాగ్దానం చేయబడిన శాశ్వత స్వాస్థ్యం’
  rationale: రెండవది భావపరంగా సాధ్యమైనా, మూలంలోని ‘వాగ్దానం’ అనే నామవాచకాన్ని ‘స్వాస్థ్యం’తో పూర్తిగా సమీకరించవచ్చు. ఎంపిక చేసిన రూపం వ్యాకరణ సంబంధాన్నీ స్వల్ప అర్థభేదాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పొడవైన గ్రీకు వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి, చివరి ఉద్దేశ వాక్యంలో ‘ఆయన మధ్యవర్తి అయ్యాడు’ అని పునరుక్తి చేయడం ద్వారా సంబంధాన్ని స్పష్టం చేశాం. ‘శాశ్వత స్వాస్థ్యం,’ ‘విమోచన,’ ‘మధ్యవర్తి’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచినా వాక్యనిర్మాణం సహజంగా ఉండేలా చూశాం.
