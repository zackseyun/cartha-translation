revisions:
- from: ఈ కారణంగా ఆయన కొత్త నిబంధనకు[a] మధ్యవర్తిగా ఉన్నాడు. మొదటి నిబంధన కింద జరిగిన అతిక్రమాల నుంచి విమోచన కలిగించడానికి ఒక మరణం సంభవించింది కాబట్టి, పిలువబడినవారు శాశ్వత స్వాస్థ్యాన్ని గురించిన వాగ్దానాన్ని పొందేలా ఆయన మధ్యవర్తి అయ్యాడు.
  to: ఈ కారణంగా ఆయన కొత్త నిబంధనకు[a] మధ్యవర్తిగా ఉన్నాడు; మొదటి నిబంధన కింద జరిగిన అతిక్రమాల నుండి విమోచనం కొరకు మరణం సంభవించినందున, పిలువబడినవారు శాశ్వత స్వాస్థ్యపు వాగ్దానాన్ని పొందేందుకు ఆయన మధ్యవర్తిగా ఉన్నాడు.
  rationale: మూలంలోని ప్రధాన వాక్యాన్ని మరియు ఉద్దేశ ఉపవాక్యాన్ని స్పష్టంగా వేరు చేయడానికి పునర్నిర్మించబడింది. అయితే తెలుగు వాక్యప్రవాహం కోసం ‘మరణం సంభవించినందున’ అనే కారణార్థక రూపాన్ని ఉంచి, విమోచనం అతిక్రమాల నుండి విడుదలను సూచిస్తుందని స్పష్టం చేశాం. ‘వాగ్దానం’ను నిలిపి, దాని విషయమైన శాశ్వత స్వాస్థ్యంతో ఉన్న సంబంధాన్ని ‘శాశ్వత స్వాస్థ్యపు వాగ్దానం’గా వ్యక్తం చేశాం.
