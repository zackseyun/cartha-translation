    rationale: మూలం విమోచన ఉద్దేశాన్ని పేర్కొంటుంది. ‘అతిక్రమాల నుండి విమోచనం కొరకు’ అని ఉంచితే విమోచనకు సంబంధించిన సంబంధం తెలుగులో మరింత స్పష్టంగా ఉంటుంది.
  revised_text: ఈ కారణంగా ఆయన కొత్త నిబంధనకు[a] మధ్యవర్తిగా ఉన్నాడు; మొదటి నిబంధన కింద జరిగిన అతిక్రమాల నుండి విమోచనం కొరకు మరణం సంభవించినందున, పిలువబడినవారు శాశ్వత స్వాస్థ్యపు వాగ్దానాన్ని పొందేందుకు ఆయన మధ్యవర్తిగా ఉన్నాడు.
