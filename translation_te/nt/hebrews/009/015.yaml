    rationale: గ్రీకులో ‘కొత్త నిబంధనకు మధ్యవర్తి ఉన్నాడు’ అనేది ప్రధాన వాక్యం; ὅπως ఉపవాక్యం పిలువబడినవారు వాగ్దానం పొందే ఉద్దేశాన్ని తెలియజేస్తుంది. ప్రస్తుత పునరుక్తి ఈ సంబంధాన్ని కొద్దిగా అస్పష్టం చేసి తెలుగు శైలిని భారంగా చేస్తుంది.
