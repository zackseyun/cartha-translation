id: HEB.9.14
reference: Hebrews 9:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: te
  text: అయితే, నిత్య పరిశుద్ధాత్మ ద్వారా కళంకంలేనివానిగా తనను తాను దేవునికి అర్పించుకున్న మెస్సీయ రక్తం మృత క్రియల నుండి మన మనస్సాక్షిని సజీవుడైన దేవునికి సేవ చేయడానికి ఎంత ఎక్కువగా శుద్ధి చేస్తుందో!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: ఇంకెంతగా
  rationale: ముందటి వచనంతో ఉన్న అధికతార్కిక పోలికను, దాని ప్రశ్నార్థక వాక్చాతుర్య బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: మెస్సీయ రక్తం
  rationale: αἷμα యొక్క బలియర్పణ ప్రాధాన్యాన్ని యథాతథంగా ఉంచుతూ, Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’గా అనువదించబడింది.
- source_word: διὰ πνεύματος αἰωνίου
  choice: నిత్యుడైన ఆత్మ ద్వారా
  rationale: διά యొక్క సాధనార్థక భావాన్ని ‘ద్వారా’ నిలుపుతుంది. ప్రధాన పాఠంలో వ్యక్తిగత దైవిక ఆత్మను సూచించే పఠనం తీసుకున్నప్పటికీ, గ్రీకులోని అనిర్దిష్టతను పాదటిప్పణిలో ఉంచాం.
- source_word: ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ
  choice: తనను తాను నిర్దోషమైన బలిగా దేవునికి అర్పించుకున్న
  rationale: ప్రతిబింబక భావాన్నీ, యాజకసంబంధమైన ‘అర్పించు’ భావాన్నీ కాపాడుతుంది; ‘బలిగా’ అనేది సందర్భం స్పష్టం చేసే సహజ తెలుగు పూరకం.
- source_word: καθαριεῖ τὴν συνείδησιν ἡμῶν
  choice: మన మనస్సాక్షిని ... శుద్ధి చేస్తుంది
  rationale: భవిష్యత్ సూచక క్రియ యొక్క భావాన్ని తెలుగులో సందర్భోచితంగా వ్యక్తం చేస్తూ, συνείδησιςకు ప్రామాణికమైన ‘మనస్సాక్షి’ని వాడుతుంది.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: మృత క్రియల నుండి
  rationale: హెబ్రీయులకు 6:1తో పదబంధ సంబంధాన్ని, దాని ఉద్దేశపూర్వకమైన ధార్మిక సాంద్రతను వివరణాత్మకంగా విప్పకుండా నిలుపుతుంది.
- source_word: εἰς τὸ λατρεύειν θεῷ ζῶντι
  choice: సజీవుడైన దేవునికి సేవ చేయడానికి
  rationale: ఉద్దేశాన్ని తెలిపే infinitiveను ‘చేయడానికి’గా, λατρεύωలోని ఆరాధన/పవిత్ర సేవ విస్తృతిని ‘సేవ చేయు’గా కాపాడుతుంది.
theological_decisions:
- issue: πνεύματος αἰωνίου యొక్క సూచ్యం
  choice: పరిశుద్ధాత్మను సూచిస్తుందని భావించి ‘నిత్యుడైన ఆత్మ’
  alternative: ‘నిత్యమైన ఆత్మ ద్వారా’—మెస్సీయ యొక్క నిత్య ఆత్మ లేదా నిత్యమైన ఆత్మసంబంధ విధానం
  rationale: వ్యక్తిగత దైవిక ఆత్మ ప్రధానంగా ఉద్దేశించబడ్డాడనే పఠనం సందర్భానికి తగినదైనా, మూలంలోని article లేని పదబంధం ఇతర పఠనానికి కూడా అవకాశం ఇస్తుంది; అందువల్ల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ పదం అభిషిక్తుని బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని తెలియజేసే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: ἄμωμον యొక్క బలియర్పణ భావం
  choice: నిర్దోషమైన బలిగా
  alternative: కళంకంలేనివాడిగా
  rationale: సమీప సందర్భంలోని బలి జంతువుల మచ్చలేని స్థితిని ప్రతిధ్వనింపజేస్తుంది; అదే సమయంలో ఇది మెస్సీయ నైతిక నిర్దోషత్వాన్నీ సూచించగల ధార్మిక ఉద్రిక్తతను తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని దీర్ఘ వాక్య నిర్మాణాన్ని చదవదగిన తెలుగు క్రమంలో ఉంచి, బలి, మనస్సాక్షి, మృత క్రియలు, సేవ అనే కీలక భావాలను నిలుపుకున్నాం.
