    text: లేదా, ‘నిత్యమైన ఆత్మ ద్వారా.’ గ్రీకు పదబంధాన్ని మరింత సాధారణ అర్థంలోనూ చదవవచ్చు; ప్రధాన పాఠంలో అది పరిశుద్ధాత్మను సూచిస్తుందని అర్థం చేసుకున్నాం.
    reason: alternative_reading
