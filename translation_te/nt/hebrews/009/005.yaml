id: HEB.9.5
reference: Hebrews 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: te
  text: దాని పైన మహిమగల కెరూబులు ప్రాయశ్చిత్త మూతను[a] కప్పుతూ ఉండేవి. వీటి గురించి ఇప్పుడు వివరంగా చెప్పడం సాధ్యం కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కరుణాపీఠం”; అంటే నిబంధన మందసం పై మూత. “ప్రాయశ్చిత్త సాధనం” అని కూడా అనువదించవచ్చు.
    reason: ἱλαστήριον ఇక్కడ ఒక నిర్దిష్ట పవిత్ర వస్తువును సూచించినప్పటికీ, ఈ పదానికి కరుణ మరియు ప్రాయశ్చిత్తంతో సంబంధమున్న విస్తృత భావం కూడా ఉంది.
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: దాని పైన
  rationale: మునుపటి వచనంలోని నిబంధన మందసాన్ని αὐτῆς సూచిస్తుంది; ὑπεράνω దాని పైనున్న స్థానాన్ని తెలియజేస్తుంది.
- source_word: Χερουβὶν
  choice: కెరూబులు
  rationale: పరలోక జీవులకు వాడే స్థిరమైన బైబిలు లిప్యంతరీకరణను నిలుపుతుంది.
- source_word: δόξης
  choice: మహిమగల
  rationale: గ్రీకు సంబంధవిభక్తి కెరూబులను దేవుని మహిమతో సంబంధపెట్టి వర్ణిస్తుంది; సహజమైన తెలుగులో విశేషణ రూపం భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: κατασκιάζοντα
  choice: కప్పుతూ ఉండేవి
  rationale: కెరూబులు తమ రెక్కలతో మందసం మూతపై విస్తరించి దానిని కప్పుతున్న స్థితిని సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ ἱλαστήριον
  choice: ప్రాయశ్చిత్త మూతను
  rationale: ఈ ప్రత్యక్ష గుడారపు సామగ్రి సందర్భంలో పదం నిబంధన మందసం పై మూతను సూచిస్తుంది; ‘ప్రాయశ్చిత్త’ అనే బలి-ఆరాధన సంబంధ భావాన్ని కూడా నిలుపుతూ వస్తువును స్పష్టంగా గుర్తిస్తుంది.
- source_word: περὶ ὧν
  choice: వీటి గురించి
  rationale: ఇప్పుడే పేర్కొన్న గుడారపు వస్తువులను సహజమైన తెలుగులో సమష్టిగా సూచిస్తుంది.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: ఇప్పుడు వివరంగా చెప్పడం సాధ్యం కాదు
  rationale: ప్రస్తుతం ఒక్కొక్క అంశాన్ని విపులంగా చర్చించడం సాధ్యం లేదా సముచితం కాదనే గ్రీకు వాక్య భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ἱλαστήριον అనే పదాన్ని మందసం సామగ్రి సందర్భంలో అనువదించడం
  choice: ప్రాయశ్చిత్త మూత
  alternative: కరుణాపీఠం; ప్రాయశ్చిత్త సాధనం
  rationale: హెబ్రీయులు 9:5లో ఇది స్పష్టంగా నిబంధన మందసం పై మూతనే సూచిస్తుంది. అయినప్పటికీ పదానికి ప్రాయశ్చిత్తం/దైవానుగ్రహం కలిగే స్థలం లేదా సాధనం అనే ఆరాధన సంబంధ భావవ్యాప్తి ఉంది. ప్రధాన పాఠంలో వస్తువును, దాని కార్యసంబంధ భావాన్ని రెండింటినీ నిలిపి, సాంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘కెరూబులు’ అనే బైబిలు పదాన్ని నిలిపి, ‘ప్రాయశ్చిత్త మూత’ ద్వారా పురాతన ఆరాధన వస్తువును స్పష్టీకరించాం.
