translation:
  language: te
  text: రెండవ తెరకు అవతల, “అతి పరిశుద్ధ స్థలం” అని పిలువబడే గుడారం[a] ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయబద్ధంగా, “మహా పరిశుద్ధ స్థలం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: రెండవ తెరకు అవతల
  rationale: ఇక్కడ μετά + accusative కాలాన్ని కాకుండా స్థల సంబంధాన్ని సూచిస్తుంది. ఆలయ గుడారపు వర్ణనలో సహజమైన ఆధునిక తెలుగులో ‘తెరకు అవతల’ అనేది స్పష్టంగా ఉంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్య ప్రవాహంలో ప్రతిఫలింపజేయబడింది
  rationale: δέ స్వల్ప అనుసంధాన పదం; తెలుగులో దానిని తప్పనిసరిగా ‘మరియు’ లేదా ‘అయితే’గా వ్యక్తం చేస్తే అవసరంలేని విరోధ భావం లేదా అసహజత కలగవచ్చు.
- source_word: σκηνὴ
  choice: గుడారం
  rationale: σκηνή ప్రత్యక్షంగా గుడారాన్ని సూచిస్తుంది; ఈ సందర్భంలో అది గుడారంలోని అంతర్భాగాన్ని ఉద్దేశించినా, ‘గది’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలంలోని ఆరాధనా-గుడారపు పదచిత్రాన్ని నిలుపుతుంది.
- source_word: ἡ λεγομένη
  choice: అని పిలువబడే
  rationale: గ్రీకు attributive participle భావాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: Ἅγια Ἁγίων
  choice: అతి పరిశుద్ధ స్థలం
  rationale: సెమిటిక్ శైలిలోని genitival superlative (‘పరిశుద్ధమైన వాటిలో పరిశుద్ధమైనది’) భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తూ, అది అంతర్గత పరిశుద్ధ స్థలమని సూచిస్తుంది.
theological_decisions:
- issue: Ἅγια Ἁγίων అనే ఆరాధనా స్థలపు పదబంధం
  choice: అతి పరిశుద్ధ స్థలం
  alternative: పరిశుద్ధాతిపరిశుద్ధ స్థలం
  rationale: ఎంచుకున్న రూపం సాధారణ ఆధునిక పాఠకులకు సులభంగా అర్థమవుతుంది. సంప్రదాయ, మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని బలమైన superlative భావాన్నీ అనువాద పరంపరతో సంబంధాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘తెర’, ‘గుడారం’, ‘అతి పరిశుద్ధ స్థలం’ అనే పదాలు మూలంలోని స్థల నిర్మాణం మరియు ఆరాధనా సందర్భాన్ని నిలుపుతాయి. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
