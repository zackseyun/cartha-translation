id: HEB.9.19
reference: Hebrews 9:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: te
  text: ఎందుకంటే, ధర్మశాస్త్రం ప్రకారం ప్రతి ఆజ్ఞనూ మోషే ప్రజలందరికీ ప్రకటించినప్పుడు, ఆయన దూడల[a] రక్తాన్ని నీటితో, ఎర్రని ఉన్నితో, హిస్సోపుతో తీసుకొని, ఆ గ్రంథపు చుట్టను కూడా, ప్రజలందరినీ కూడా చిలకరించాడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కోడెదూడల.” బలుల సందర్భంలో గ్రీకు పదం దూడలను లేదా చిన్న వయసు ఎద్దులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: ఎందుకంటే ... ప్రతి ఆజ్ఞనూ ... ప్రకటించిన తర్వాత
  rationale: γενitive absolute నిర్మాణాన్ని సహజమైన కాలసూచక ఉపవాక్యంగా అనువదించాం. πάσης యొక్క విభాజక బలాన్ని ‘ప్రతి ఆజ్ఞనూ’ నిలుపుతుంది; γάρ ను ‘ఎందుకంటే’గా స్పష్టంగా ఉంచాం.
- source_word: κατὰ τὸν νόμον
  choice: ధర్మశాస్త్రం ప్రకారం
  rationale: κατά ఇక్కడ అనుగుణతను సూచిస్తుంది. ‘ధర్మశాస్త్రం ప్రకారం’ సహజమైనదీ, మూలానికి సమీపమైనదీ.
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: మోషే ప్రజలందరికీ
  rationale: కర్తను తెలుగులో సహజమైన కర్తృప్రయోగంలో ఉంచి, παντί సూచించే సమగ్రతను ‘ప్రజలందరికీ’గా నిలిపాం.
- source_word: λαβὼν τὸ αἷμα τῶν μόσχων
  choice: ఆయన దూడల రక్తాన్ని ... తీసుకొని
  rationale: కథన క్రమాన్ని తెలిపే aorist participle ను ‘తీసుకొని’గా ఇచ్చాం. μόσχων కు నేరుగా సరిపడే ‘దూడలు’ను ప్రధాన పాఠంలో ఉంచి, బలిసందర్భంలో సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: నీటితో, ఎర్రని ఉన్నితో, హిస్సోపు కొమ్మలతో
  rationale: సహచర్యం/సాధన భావాన్ని ‘తో’ ద్వారా వ్యక్తం చేశాం. ἐρίον ను ‘ఉన్ని’, κοκκίνου ను ‘ఎర్రని’గా అనువదించాం. ὕσσωπος ఆచారంలో ఉపయోగించే మొక్కను సూచిస్తున్నందున సహజ అవగాహన కోసం ‘హిస్సోపు కొమ్మలు’ అన్నాం.
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: గ్రంథపు చుట్టను, ప్రజలందరినీ
  rationale: βιβλίον ప్రాచీన లిఖిత పత్రపు భౌతిక రూపాన్ని సూచించేలా ‘గ్రంథపు చుట్ట’ను ఎంచుకున్నాం. τε ... καί సమన్వయాన్ని రెండు కర్మల వరుసగా సహజ తెలుగులో తెలిపాం; αὐτό యొక్క ఉద్ఘాటనను ప్రత్యేక కర్మపదం ద్వారా సందర్భానుగుణంగా నిలిపాం.
- source_word: ἐράντισεν
  choice: చిలకరించాడు
  rationale: ఆచారపరమైన రక్తప్రోక్షణ చర్యను సాధారణ ఆధునిక తెలుగులో అర్థమయ్యే ‘చిలకరించాడు’గా ఇచ్చాం; అతిసాంకేతిక పదాన్ని నివారించాం.
theological_decisions:
- issue: నిర్గమకాండం 24 కథనంతో ఈ వచనానికి ఉన్న సంబంధం
  choice: హెబ్రీయులకు పత్రికలోని గ్రీకు పాఠం చెప్పిన అంశాలనే అనువదించడం
  alternative: పాత నిబంధన కథనంతో సమన్వయపరచేందుకు అదనపు ఆచార వివరాలను చేర్చడం లేదా ‘కోడెదూడలు’ అని వ్యాఖ్యానాత్మకంగా మార్చడం
  rationale: రచయిత ఇచ్చిన సంక్షిప్త వివరణను విస్తరించకుండా, దానిలోని స్వరూపాన్ని అలాగే ఉంచాం. μόσχων లోని నిజమైన పదార్థ విస్తృతిని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ఈ వచనం తరువాతి వాక్యంతో కొనసాగుతున్నందున చివర కామాను నిలిపాం. అందించిన ఆంగ్ల పాఠంలో [a] గుర్తు ‘ప్రజలు’ తర్వాత ఉన్నా, పాదటిప్పణి μόσχων గురించినది కాబట్టి తెలుగులో దానిని ‘దూడల’ వద్ద ఉంచాం.
