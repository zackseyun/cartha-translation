revisions:
- from: ఇవి ఈ విధంగా సిద్ధపరచబడిన తరువాత, యాజకులు ఆరాధన సేవలను నిర్వహిస్తూ మొదటి గుడారంలోకి[a] నిరంతరం ప్రవేశిస్తారు[b].
  to: ఈ వస్తువులు ఈ విధంగా సిద్ధపరచబడి ఉండగా, యాజకులు ఆరాధనకు సంబంధించిన విధులను నిర్వహిస్తూ మొదటి విభాగంలోకి[a] నిరంతరం ప్రవేశిస్తారు[b].
  rationale: The revision preserves the source's circumstantial construction, identifies the first sanctuary compartment in the main text, and retains the lexical breadth of σκηνή in a properly anchored note. It also improves the natural Telugu expression for the priests' ritual ministrations without adding interpretive doctrine.
