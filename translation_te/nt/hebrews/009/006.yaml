id: HEB.9.6
reference: Hebrews 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: te
  text: ఈ వస్తువులు ఈ విధంగా సిద్ధపరచబడి ఉండగా, యాజకులు ఆరాధనకు సంబంధించిన విధులను నిర్వహిస్తూ మొదటి విభాగంలోకి[a] నిరంతరం ప్రవేశిస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మొదటి గుడారంలోకి” లేదా “మొదటి గదిలోకి.” గ్రీకు పదమైన σκηνή గుడారాన్ని సూచించగలదు; ఈ సందర్భంలో అది దాని మొదటి విభాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నిరంతరం” అంటే ప్రతి క్షణమూ అని కాక, ఆచారం ప్రకారం క్రమంగా, పదేపదే అని భావం.
    reason: lexical_clarification
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: ఇవి ఈ విధంగా సిద్ధపరచబడిన తరువాత
  rationale: ఈ genitive absolute తరువాతి చర్యకు నేపథ్య పరిస్థితిని తెలియజేస్తుంది. సందర్భం గుడారంలోని వస్తువుల అమరిక గురించి కావడంతో, ‘నిర్మించబడిన’ కంటే ‘సిద్ధపరచబడిన’ అనేది అతిగా నిర్దిష్టం చేయకుండా మూల భావాన్ని అందిస్తుంది. δὲ యొక్క స్వల్ప సంధాన భావం తెలుగులో వాక్యప్రవాహం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: మొదటి గుడారంలోకి
  rationale: σκηνή అనేది గుడారాన్ని లేదా సందర్భానుసారం దాని మొదటి విభాగాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో ‘గుడారం’ అని ఉంచి, స్థల విభాగార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: διὰ παντὸς
  choice: నిరంతరం
  rationale: ఇది ప్రతి క్షణం లోపలే ఉంటారని కాక, యాజకులు ఆచారం ప్రకారం పదేపదే ప్రవేశించే కొనసాగుతున్న సేవను సూచిస్తుంది.
- source_word: εἰσίασιν
  choice: ప్రవేశిస్తారు
  rationale: వర్తమాన సూచక క్రియ ఇక్కడ అలవాటుగా పునరావృతమయ్యే చర్యను తెలియజేస్తుంది; తెలుగు సాధారణ వర్తమానం దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ἱερεῖς
  choice: యాజకులు
  rationale: తదుపరి వచనంలోని ప్రధాన యాజకునికి భిన్నంగా, సాధారణ యాజకులను సూచిస్తుంది.
- source_word: τὰς λατρείας ἐπιτελοῦντες
  choice: ఆరాధన సేవలను నిర్వహిస్తూ
  rationale: λατρείας పవిత్రస్థలంలో చేయబడే ఆరాధనా సంబంధమైన విధులను సూచిస్తుంది; ‘ఆరాధన సేవలు’ ఆ భావాన్ని స్పష్టంగా ఉంచుతుంది. ἐπιτελοῦντες ను ‘నిర్వహిస్తూ’ అని అనువదించడం యాజకులు ప్రవేశించి చేసే నిర్దేశిత కార్యాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పవిత్రస్థల సందర్భంలో σκηνή అర్థం
  choice: గుడారం
  alternative: మొదటి విభాగం / మొదటి గది
  rationale: హెబ్రీయులు 9లో మోషే కాలపు ప్రత్యక్ష గుడారం మరియు దాని విభాగాలు చర్చించబడుతున్నాయి. ‘గుడారం’ పాత నిబంధన ఆరాధనా నేపథ్యాన్ని నిలుపుతుంది; అయితే ఇక్కడ మొదటి విభాగం ఉద్దేశించబడవచ్చనే నిజమైన అర్థసంభావ్యతను పాదసూచికలో ఉంచాం.
- issue: యాజక సేవలో διὰ παντὸς బలం
  choice: నిరంతరం
  alternative: క్రమంగా / ఎల్లప్పుడూ
  rationale: సాధారణ యాజకులు మొదటి విభాగంలోకి పునరావృతంగా ప్రవేశించడాన్ని, తదుపరి వచనంలో ప్రధాన యాజకుని పరిమిత ప్రవేశంతో ఈ పదం వ్యత్యాసపరుస్తుంది. ఇది విరామంలేని భౌతిక హాజరును తప్పనిసరిగా సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ప్రత్యక్ష గుడారం’ కంటే సంక్షిప్తమైన ‘గుడారం’ వాడి, సందర్భంలోని విభాగార్థాన్ని పాదసూచికలో నిలిపాం. వాక్యాంత విరామచిహ్నం తెలుగు ప్రచురణ శైలికి అనుగుణంగా పూర్తి వాక్యంగా ఇవ్వబడింది.
