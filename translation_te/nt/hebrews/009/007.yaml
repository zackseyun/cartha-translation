id: HEB.9.7
reference: Hebrews 9:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: te
  text: కాని రెండవ గదిలోకి[a] సంవత్సరానికి ఒక్కసారి ప్రధాన యాజకుడు మాత్రమే ప్రవేశిస్తాడు; రక్తం లేకుండా ప్రవేశించడు. ఆ రక్తాన్ని తన కోసమూ, ప్రజలు తెలియక చేసిన పాపాల కోసమూ[b] అర్పిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెండవ గుడారంలోకి’ లేదా ‘రెండవ విభాగంలోకి’; ఇది సన్నిధి గుడారంలోని లోపలి భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రజలు ఉద్దేశపూర్వకంగా కాకుండా చేసిన పాపాల కోసమూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: కాని రెండవ గదిలోకి
  rationale: సందర్భంలో ప్రత్యక్ష గుడారంలోని మొదటి, రెండవ అంతర్భాగాల మధ్య వ్యత్యాసం ఉంది. గ్రీకులో నామవాచకం అధ్యాహారంగా ఉన్నందున, సహజమైన తెలుగులో ‘గది’ని చేర్చాం; ‘గుడారం’ లేదా ‘విభాగం’ కూడా సాధ్యమే.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: సంవత్సరానికి ఒక్కసారి
  rationale: వార్షికంగా ఒకసారి అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: ప్రధాన యాజకుడు మాత్రమే
  rationale: μόνος సూచించే ప్రత్యేక ప్రవేశ హక్కును స్పష్టంగా నిలుపుతుంది.
- source_word: οὐ χωρὶς αἵματος
  choice: రక్తం లేకుండా ప్రవేశించడు
  rationale: గ్రీకులోని నిషేధాత్మక వాక్యరీతిని నిలుపుతూ, తెలుగులో దాని సంబంధాన్ని స్పష్టం చేయడానికి ‘ప్రవేశించడు’ను పునరుక్తం చేశాం. ‘రక్తం’ అనే బలిసంబంధ చిత్రణను యథాతథంగా ఉంచాం.
- source_word: ὃ προσφέρει
  choice: ఆ రక్తాన్ని ... అర్పిస్తాడు
  rationale: సంబంధ సర్వనామం సూచించే రక్తాన్ని తెలుగులో స్పష్టంగా పేర్కొని, προσφέρει యొక్క బలిసంబంధ అర్థాన్ని ‘అర్పిస్తాడు’తో తెలిపాం.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: తన కోసం
  rationale: బలి సందర్భంలో ὑπέρ తెలిపే ప్రయోజనార్థక లేదా ప్రతినిధిత్వ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: ప్రజలు తెలియక చేసిన పాపాలు
  rationale: ἀγνοήματα కేవలం సమాచారం తెలియకపోవడాన్ని కాక, అజ్ఞానంలో లేదా అనుద్దేశపూర్వకంగా చేసిన అపరాధాలను సూచిస్తుంది. ‘పాపాలు’ నైతిక, బలిసంబంధ బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: బలి సందర్భంలో ἀγνοήματα స్వభావం
  choice: ప్రజలు తెలియక చేసిన పాపాలు
  alternative: ప్రజలు ఉద్దేశపూర్వకంగా కాకుండా చేసిన పాపాలు; ప్రజల అజ్ఞానపు అపరాధాలు
  rationale: మూలపదం అజ్ఞానంతో లక్షణీకరించబడిన దోషకార్యాలను సూచిస్తుంది. ‘తెలియక చేసిన పాపాలు’ దోషభావాన్ని నిలుపుతూ, అవి కేవలం అమాయకమైన సమాచార లోపాలేనని లేదా నిర్దిష్టమైన తరువాతి సిద్ధాంత వర్గమని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే ‘ప్రధాన యాజకుడు’, ‘అర్పిస్తాడు’ వంటి గౌరవప్రదమైన బైబిలు-ఆరాధనా పదజాలాన్ని నిలుపుకుంది. గ్రీకు వాక్యంలోని దీర్ఘ నిర్మాణాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి స్పష్టత పెంచాం.
