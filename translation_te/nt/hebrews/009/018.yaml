  to: కాబట్టి మొదటి నిబంధన కూడా రక్తం లేకుండా అమలులోకి రాలేదు[a].
  rationale: ‘అమలులోకి రాలేదు’ అనేది రక్తంతో జరిగిన నిబంధన ప్రారంభోత్సవం/అమలుపరచడం అనే ἐγκαινίζω భావాన్ని ఆధునిక సహజ తెలుగులో అందిస్తుంది. ఇది గ్రీకు పరిపూర్ణ కర్మణి రూపం సూచించే పూర్తయిన చారిత్రక చర్యను తెలుగు సహజ వాక్యరీతిలో వ్యక్తం చేస్తుంది; ఇతర భావాలను మార్చదు.
