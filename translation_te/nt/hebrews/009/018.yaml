  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/018.yaml
  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: te
  text: కాబట్టి మొదటి నిబంధన కూడా రక్తం లేకుండా అమలులోకి రాలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొదటిది.” గ్రీకులో ఇక్కడ ‘మొదటిది’ అనే స్త్రీలింగ విశేషణమే ఉంది; సందర్భంలో అది మొదటి నిబంధనను సూచిస్తుంది. కొందరు దీనిని మరింత అధికారికంగా “మొదటి వీలునామా” అని అనువదిస్తారు.
    reason: గ్రీకులో నిబంధన అనే నామవాచకం ప్రత్యక్షంగా లేకపోయినా, సందర్భానుసారంగా దాని సూచనను తెలియజేయడానికి; సమీప సందర్భంలో ఉన్న ప్రత్యామ్నాయ ‘వీలునామా’ అర్థాన్ని కూడా నమోదు చేయడానికి.
lexical_decisions:
- source_word: ὅθεν
  choice: కాబట్టి
  rationale: ముందటి వచనాల్లో నిబంధన, మరణం గురించి చేసిన వాదననుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὐδὲ
  choice: కూడా ... లేదు
  rationale: ‘మొదటిది సైతం కాదు’ అనే నొక్కిచెప్పే ప్రతికూల భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: ἡ πρώτη
  choice: మొదటి నిబంధన
  rationale: గ్రీకులో విశేషణం మాత్రమే ఉన్నా, అది సందర్భంలోని మొదటి నిబంధనను సూచిస్తుంది; స్పష్టత కోసం అంతర్లీన నామవాచకాన్ని చేర్చాం.
- source_word: χωρὶς αἵματος
  choice: రక్తం లేకుండా
  rationale: రక్తం లేని స్థితిని నేరుగా తెలిపి, సందర్భంలోని బలి మరియు నిబంధన భావాలను నిలుపుతుంది.
- source_word: ἐγκεκαίνισται
  choice: ప్రారంభించబడలేదు
  rationale: ἐγκαινίζω అనే క్రియలోని అధికారిక ఆరంభం/అమలులోకి తేవడం అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది; కేవలం చట్టపరమైన ‘ధృవీకరణ’కు భావాన్ని పరిమితం చేయదు.
theological_decisions:
- issue: ‘మొదటిది’ దేనిని సూచిస్తుంది?
  choice: మొదటి నిబంధన
  alternative: మొదటిది; మొదటి వీలునామా
  rationale: హెబ్రీయులు 9లోని సమీప సందర్భం, ముఖ్యంగా రక్తంతో నిబంధన ప్రారంభించబడిన నిర్గమకాండము 24 నేపథ్యం, మొదటి నిబంధననే బలంగా సూచిస్తుంది. అయితే గ్రీకులో ‘నిబంధన’ అనే నామవాచకం ఈ వచనంలో ప్రత్యక్షంగా లేదు కాబట్టి పాదసూచికలో ఆ రూపాన్ని తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంది. ‘ప్రతిష్ఠించబడలేదు’ కంటే ‘ప్రారంభించబడలేదు’ విస్తృతమైన ἐγκαινίζω భావాన్ని సహజంగా అందిస్తుంది.
