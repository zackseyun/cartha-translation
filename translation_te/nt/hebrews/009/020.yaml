source:
  edition: SBLGNT
  text: λέγων· Τοῦτο τὸ αἷμα τῆς διαθήκης ἧς ἐνετείλατο πρὸς ὑμᾶς ὁ θεός·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/020.yaml
  text: saying[a], “This is the blood of the covenant that God commanded for you.”
translation:
  language: te
  text: ఇలా అంటూ[a], “ఇది దేవుడు మీకు ఆజ్ఞాపించిన నిబంధన రక్తం.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇలా అన్నాడు:”
    reason: λέγωνను ముందటి వాక్యంతో అనుసంధానమైన కృదంతంగా అనువదించడం రూపసామ్యానికి దగ్గరగా ఉంటుంది; తెలుగులో దాన్ని సమాపక క్రియగా కూడా సహజంగా చెప్పవచ్చు.
lexical_decisions:
- source_word: λέγων
  choice: ఇలా అంటూ
  rationale: వర్తమాన కృదంతం ముందటి వాక్యంతో చర్యను అనుసంధానిస్తూ ఉల్లేఖనాన్ని పరిచయం చేస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘ఇలా అంటూ’ ఆ కృదంత సంబంధాన్ని నిలుపుతుంది.
- source_word: Τοῦτο
  choice: ఇదే
  rationale: గ్రీకులో స్పష్టమైన సంధానక్రియ లేకపోయినా, తెలుగులో వాక్యాంతంలోని ‘ఇదే’ ద్వారా ‘ఇది ... రక్తం’ అనే నిర్దేశక భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: αἷμα
  choice: రక్తం
  rationale: బలి ద్వారా నిబంధన స్థాపన సందర్భంలోనూ మూలంలోని నిర్దిష్టమైన భౌతిక పదాన్ని వివరణాత్మకంగా మార్చకుండా నేరుగా అనువదిస్తుంది.
- source_word: διαθήκης
  choice: నిబంధన
  rationale: నిర్గమకాండము 24:8 నేపథ్యంలోని దేవుడు-ప్రజల ఒడంబడికను సూచిస్తుంది; వీలునామా అనే భావం ఈ సందర్భానికి సరిపోదు.
- source_word: ἧς
  choice: ఆజ్ఞాపించిన నిబంధన
  rationale: షష్ఠీ విభక్తి సంబంధ సర్వనామం ‘నిబంధన’ను సూచిస్తుంది. తెలుగులో సంబంధక్రియా నిర్మాణం ద్వారా ఈ అనుబంధం స్పష్టంగా, సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐνετείλατο
  choice: ఆజ్ఞాపించిన
  rationale: ἐντέλλομαι అనే క్రియలోని ఆజ్ఞ ఇవ్వడం లేదా నిర్దేశించడం అనే సాధారణ అర్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: πρὸς ὑμᾶς
  choice: మీకు
  rationale: ఆ ఆజ్ఞ ప్రజలకు ఉద్దేశించబడిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘మిమ్మల్ని గురించి’ అనే సాధ్యమైన అర్థాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: ὁ θεός
  choice: దేవుడు
  rationale: θεόςకు ప్రామాణిక తెలుగు సమానార్థకం; ఇక్కడ అదనపు బిరుదు అవసరం లేదు.
theological_decisions:
- issue: నిబంధన స్థాపన సందర్భంలో διαθήκη అనువాదం
  choice: నిబంధన
  alternative: వీలునామా
  rationale: ఈ వచనం నిర్గమకాండము 24:8ను ప్రతిధ్వనిస్తూ మోషే నిబంధన రక్తంతో స్థాపించబడటాన్ని సూచిస్తుంది. ‘వీలునామా’ అనే న్యాయపరమైన అర్థం తక్షణ పాత నిబంధన నేపథ్యానికి సరిపోదు.
- issue: Τοῦτο తరువాత అంతర్లీనంగా ఉన్న సంధాన భావం
  choice: నిబంధన రక్తం ఇదే
  alternative: ఇది నిబంధన రక్తం
  rationale: రెండు రూపాలూ గ్రీకులో అంతర్లీనంగా ఉన్న ‘ఉంది/అవుతుంది’ అనే భావాన్ని తెలుగులో వ్యక్తపరుస్తాయి. ‘ఇదే’ ఉల్లేఖనంలోని నిర్దేశక బలాన్ని సహజంగా నిలుపుతూ కొత్త దైవశాస్త్రీయ భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతతో కూడిన సరళమైన శైలి. ‘ఇలా అంటూ’ ముందటి వచనంతో వ్యాకరణ అనుసంధానాన్ని నిలుపుతుంది; ‘దేవుడు మీకు ఆజ్ఞాపించిన నిబంధన’ మూలంలోని సంబంధ నిర్మాణాన్ని అతిగా సవరించకుండా సహజంగా అందిస్తుంది.
