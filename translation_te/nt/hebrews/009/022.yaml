id: HEB.9.22
reference: Hebrews 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: te
  text: ధర్మశాస్త్రం ప్రకారం దాదాపు అన్నీ రక్తంతో శుద్ధి చేయబడతాయి; రక్తం చిందించడం లేకుండా క్షమాపణ[a] కలగదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విడుదల.’ గ్రీకు పదం విడుదల లేదా క్షమాపణ అనే అర్థాలను ఇవ్వగలదు; ఇక్కడ అది పాపాల క్షమాపణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: దాదాపు
  rationale: ఈ క్రియావిశేషణం వాక్యంలోని పరిధిని పరిమితం చేస్తుంది; ధర్మశాస్త్రంలోని ప్రతి శుద్ధీకరణకూ తప్పనిసరిగా రక్తం అవసరమని చెప్పకుండా మూలంలోని మినహాయింపు భావాన్ని నిలుపుతుంది.
- source_word: ἐν αἵματι
  choice: రక్తంతో
  rationale: ἐν ఇక్కడ సాధనార్థకంగా ఉంది; శుద్ధీకరణకు ఉపయోగించే ఆచార సంబంధమైన సాధనాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πάντα
  choice: అన్నీ
  rationale: నపుంసక బహువచనం సందర్భంలోని వస్తువులు, ఆచార సంబంధమైన అంశాలను విస్తృతంగా సూచిస్తుంది; σχεδόνతో కలిసి ‘దాదాపు అన్నీ’ అవుతుంది.
- source_word: καθαρίζεται
  choice: శుద్ధి చేయబడతాయి
  rationale: వర్తమానకాల కర్మణి రూపం ధర్మశాస్త్రం కింద సాధారణంగా జరిగే ఆచార ప్రక్రియను సూచిస్తుంది; ‘శుద్ధి’ ఆచారపరమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: κατὰ τὸν νόμον
  choice: ధర్మశాస్త్రం ప్రకారం
  rationale: κατά ఇక్కడ మోషే ధర్మశాస్త్రానికి అనుగుణతను సూచిస్తుంది; ఈ అనువాదం మూలానికి దగ్గరగా, తెలుగులో సహజంగా ఉంది.
- source_word: χωρὶς
  choice: లేకుండా
  rationale: వేరుగా లేదా లేనప్పుడు అనే నిషేధార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: αἱματεκχυσίας
  choice: రక్తం చిందించబడడం
  rationale: రక్తాన్ని కుమ్మరించడం లేదా చిందించడం అనే బలి సంబంధమైన భావాన్ని నిలుపుతుంది; నామవాచక నిర్మాణాన్ని తెలుగులో సహజమైన క్రియానామంగా అందిస్తుంది.
- source_word: οὐ γίνεται
  choice: కలగదు
  rationale: ἄφεσις సంభవించదు లేదా ఉనికిలోకి రాదు అనే ఫలితార్థాన్ని సంక్షిప్తమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἄφεσις
  choice: క్షమాపణ
  rationale: ఈ సందర్భంలో పాపాల విడుదల లేదా మన్నింపును సూచిస్తుంది; ‘క్షమాపణ’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, మూలపదంలోని విడుదల భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: బలి సంబంధమైన సందర్భంలో ἄφεσις అనువాదం
  choice: క్షమాపణ
  alternative: విడుదల; పాపవిమోచనం
  rationale: హెబ్రీయులకు పత్రిక వాదనలో ఇది పాపాల మన్నింపును సూచిస్తుంది. ‘క్షమాపణ’ స్పష్టమైన ఆధునిక పదం; అయితే గ్రీకు పదంలోని విస్తృతమైన విడుదల భావాన్ని పాదటిప్పణిలో తెలియజేయడం ద్వారా దాని అర్థపరిధిని అతిగా కుదించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ధర్మశాస్త్రం,’ ‘శుద్ధి,’ ‘రక్తం చిందించబడడం’ అనే పదాలు సందర్భంలోని ఆచారపరమైన మరియు బలి సంబంధమైన స్వరాన్ని నిలుపుతాయి. మూలంలోని రెండు సమాంతర వాక్యభాగాలను అర్ధవిరామంతో కలిపాం.
