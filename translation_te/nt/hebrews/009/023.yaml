    rationale: αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύταςలో καθαρίζεσθαι అధ్యాహరించబడింది మరియు Ἀνάγκηతోనే నియంత్రించబడుతుంది. కాబట్టి ‘శుద్ధి చేయబడడం అవసరమైంది’ అని అనువదించాలి; ‘చేయబడాలి’ మూలంలో లేని విధి/ఆజ్ఞ భావాన్ని చేర్చుతుంది.
