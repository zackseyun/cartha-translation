id: HEB.9.23
reference: Hebrews 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: te
  text: కాబట్టి, పరలోకాలలో ఉన్న వాటి ప్రతిరూపాలు[a] వీటితో శుద్ధి చేయబడడం[b] అవసరమైంది; అయితే పరలోక సంబంధమైనవి స్వయంగా వీటికంటే శ్రేష్ఠమైన బలులతో[c] శుద్ధి చేయబడడం అవసరమైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నమూనాలు,’ ‘ప్రాతినిధ్య రూపాలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘శుద్ధీకరించబడడం.’ ఇక్కడి క్రియ ఆచార సంబంధమైన శుద్ధీకరణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు మూలంలో ‘బలులు’ అని బహువచనం ఉంది; అయితే హెబ్రీయులకు పత్రిక సందర్భం మెస్సీయ ఒక్కసారే చేసిన అర్పణపై కేంద్రీకరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη
  choice: అవసరమైంది
  rationale: ఇది వ్యక్తిరహితంగా అవసరాన్ని తెలిపే పదం. ముందున్న గుడార సేవలను వెనుదిరిగి వివరిస్తున్న సందర్భానికి అనుగుణంగా తెలుగులో భూతకాల రూపం సహజంగా ఉంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి తీసుకున్న నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: ὑποδείγματα
  choice: ప్రతిరూపాలు
  rationale: భూమిపై ఉన్న ఆరాధనా ఏర్పాట్లు పరలోకంలోని వాటికి అనురూపమైన సూచక రూపాలని తెలియజేస్తుంది; వెంటనే వచ్చే ‘పరలోక సంబంధమైనవి స్వయంగా’ అనే వ్యత్యాసాన్ని కూడా నిలుపుతుంది.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: పరలోకాలలో ఉన్నవాటి
  rationale: మూలంలోని οὐρανοῖς బహువచనాన్ని ‘పరలోకాలు’గా నిలుపుతూ, ప్రతిరూపాలు దేనికి సంబంధించినవో తెలియజేస్తుంది.
- source_word: τούτοις
  choice: వీటితో
  rationale: ముందు సందర్భంలో ప్రస్తావించిన భౌమిక బలుల ద్వారా శుద్ధి జరిగిందనే సూచనను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: καθαρίζεσθαι
  choice: శుద్ధి చేయబడడం
  rationale: ఆచార సంబంధమైన శుద్ధీకరణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: అయితే పరలోక సంబంధమైనవి స్వయంగా
  rationale: αὐτά ఇచ్చే ‘స్వయంగా’ అనే ఉద్ఘాటనను ఉంచి, ‘పరలోక సంబంధమైనవి’ ఏమిటో వ్యాఖ్యానాత్మకంగా పరిమితం చేయకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: κρείττοσι θυσίαις
  choice: శ్రేష్ఠమైన బలులతో
  rationale: హెబ్రీయులకు పత్రికలో కీలకమైన ‘మెరుగైన/శ్రేష్ఠమైన’ భావాన్ని, అలాగే θυσίαις బహువచనాన్ని నిలుపుతుంది.
- source_word: παρὰ ταύτας
  choice: వీటికంటే
  rationale: తులనార్థకమైన κρείττοσιతో కలిసి παρά తెలిపే ‘వీటికంటే’ అనే పోలికను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పరలోక సంబంధమైనవి శుద్ధి చేయబడటం
  choice: ‘పరలోక సంబంధమైనవి స్వయంగా ... శుద్ధి చేయబడాలి’ అనే ఆచార సంబంధమైన భాషను యథాతథంగా నిలుపడం
  alternative: దీనిని పరలోక పరిశుద్ధస్థలంగా లేదా పరలోక ప్రజలుగా నిర్దిష్టంగా వ్యాఖ్యానించడం; లేక పరలోకం శుద్ధి చేయబడుతుందనే మాటను పరిభాషలో తొలగించడం
  rationale: మూలవాక్యం భౌమిక ప్రతిరూపాలను పరలోక సంబంధమైన వాటితో నేరుగా పోల్చి, రెండింటికీ శుద్ధి భాషను వాడుతుంది. ఆ వేదాంత ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
- issue: మెస్సీయ ఒక్కసారే అర్పించిన అర్పణకు సంబంధించి ‘బలులు’ అనే బహువచనం
  choice: మూలంలోని బహువచనాన్ని ‘బలులతో’గా ఉంచడం
  alternative: భావానువాదంగా ‘బలితో’ అనే ఏకవచనం వాడడం
  rationale: హెబ్రీయులకు పత్రిక ఇతర చోట్ల ఒక్కసారే జరిగిన అర్పణను నొక్కిచెప్పినా, ఇక్కడ θυσίαις బహువచనంలో ఉంది. దానిని ఏకవచనంగా మార్చడం మూలాన్ని ఇతర వాక్యాలకు అనుగుణం చేయడమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ప్రతిరూపాలు,’ ‘శుద్ధి,’ ‘బలులు’ వంటి పదాలు ఆరాధనా-ఆచార సందర్భాన్ని నిలుపుతాయి. రెండో ఉపవాక్యంలో గ్రీకులో అధ్యాహారంగా ఉన్న ‘శుద్ధి చేయబడాలి’ని తెలుగులో స్పష్టత కోసం పునరుక్తి చేశాం.
