id: HEB.9.9
reference: Hebrews 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: te
  text: ఇది ప్రస్తుత కాలానికి ఒక ఉపమానం.[a] ఈ ఉపమానం ప్రకారం అర్పించబడుతున్న అర్పణలూ బలులూ ఆరాధించే వ్యక్తిని మనస్సాక్షి విషయంలో పరిపూర్ణునిగా చేయలేవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రతీకగా” లేదా “సూచక రూపంగా.”
    reason: παραβολή అనే పదానికి ఈ సందర్భంలో సాధ్యమైన ప్రధాన ప్రత్యామ్నాయ అర్థాలను చూపించడానికి.
lexical_decisions:
- source_word: ἥτις
  choice: అది
  rationale: మునుపటి వాక్యంలో చెప్పిన మొదటి గుడారాన్ని సూచిస్తూ, తెలుగు వాక్యంలో సహజమైన వివరణాత్మక అనుసంధానాన్ని ఇస్తుంది.
- source_word: παραβολὴ
  choice: ఉపమానం
  rationale: చిత్రాత్మక సాదృశ్యం లేదా ప్రతీకాత్మక అనురూపత అనే విస్తృత భావాన్ని నిలుపుతుంది; సందర్భానుగుణమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: ప్రస్తుత కాలానికి
  rationale: రచయిత వాదనలో అప్పటికి అమలులో ఉన్న కాలాన్ని సూచించే గ్రీకు పదబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καθ’ ἣν
  choice: దాని ప్రకారం
  rationale: ఆ ఉపమానం లేదా గుడారపు ఏర్పాటుకు, తరువాత చెప్పే ఆరాధనా అర్పణలకు మధ్యనున్న నియంత్రక సంబంధాన్ని నిలుపుతుంది.
- source_word: δῶρά τε καὶ θυσίαι
  choice: అర్పణలూ బలులూ
  rationale: τε καὶ సూచించే జతను నిలుపుతూ, రెండు ఆరాధనా పదాలను వేరుగా ఉంచుతుంది.
- source_word: προσφέρονται
  choice: అర్పించబడుతున్నాయి
  rationale: వర్తమాన కర్మణి రూపంలోని కొనసాగుతున్న ఆరాధనా క్రియను తెలుగులో స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: μὴ δυνάμεναι
  choice: చేయలేవు
  rationale: అర్పణలు, బలులు కలిగిన అసమర్థతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κατὰ συνείδησιν
  choice: మనస్సాక్షి విషయంలో
  rationale: పరిపూర్ణత కలగని పరిధి మనస్సాక్షికి సంబంధించినదని స్పష్టం చేస్తుంది; కేవలం వ్యక్తిగత నిజాయితీ అనే భావానికి పరిమితం చేయదు.
- source_word: τελειῶσαι
  choice: పరిపూర్ణునిగా చేయడం
  rationale: హెబ్రీయులకు పత్రికలో ఉద్దేశించిన సంపూర్ణ స్థితికి లేదా దేవుని సన్నిధిలో తగిన స్థితికి చేర్చడం అనే గంభీర భావాన్ని నిలుపుతుంది.
- source_word: τὸν λατρεύοντα
  choice: ఆరాధించే వ్యక్తి
  rationale: ఆరాధనా సేవలో పాల్గొనే ఏ వ్యక్తినైనా సూచించే ఏకవచన కృదంత భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆరాధనా-మాదిరి సందర్భంలో παραβολή అనువాదం
  choice: ఉపమానం
  alternative: ప్రతీక లేదా సూచక రూపం
  rationale: భౌతిక గుడారపు ఏర్పాటు ప్రస్తుత కాలంతో చిత్రాత్మక అనురూపత కలిగిందనే భావాన్ని ‘ఉపమానం’ నిలుపుతుంది; దానిని కేవలం నైరూప్య ప్రతీకగా కుదించదు. సందర్భంలో సాధ్యమైన ‘ప్రతీక’ భావాన్ని పాదసూచికలో సంరక్షించాం.
- issue: τελειῶσαι యొక్క ధార్మిక బరువు
  choice: పరిపూర్ణునిగా చేయడం
  alternative: సంపూర్ణ స్థితికి చేర్చడం
  rationale: హెబ్రీయులకు పత్రిక అంతటా ఉన్న పరిపూర్ణత/లక్ష్యసిద్ధి భావాన్ని నిలుపుతూ, మనస్సాక్షికి సంబంధించిన పరిమితిని కూడా యథాతథంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అర్పణలు,’ ‘బలులు,’ ‘మనస్సాక్షి,’ ‘పరిపూర్ణుడు’ వంటి హెబ్రీయులకు పత్రికలో ధార్మిక ప్రాధాన్యం గల పదాలను స్థిరంగా ఉంచాం.
