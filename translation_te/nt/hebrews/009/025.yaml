id: HEB.9.25
reference: Hebrews 9:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: te
  text: ప్రధాన యాజకుడు ప్రతి సంవత్సరం తనది కాని రక్తంతో పవిత్ర స్థలాల్లోకి[a] ప్రవేశించినట్లుగా, ఆయన తనను తాను అనేకసార్లు అర్పించడానికి ప్రవేశించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిశుద్ధస్థలంలోకి.’ గ్రీకులో అక్షరార్థంగా ‘పవిత్ర స్థలాలు’ అని ఉంది; ఈ ఆరాధనా సందర్భంలో కొందరు దీనిని మరింత నిర్దిష్టంగా ‘అతి పరిశుద్ధస్థలం’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: ప్రవేశించలేదు
  rationale: మునుపటి వాక్యంలోని క్రీస్తు ప్రవేశాన్ని ఈ నిర్మాణం కొనసాగిస్తూ, ఆ ప్రవేశం దేనికోసం కాదో తెలియజేస్తుంది. సహజమైన తెలుగుకోసం మునుపటి క్రియను ఇక్కడ స్పష్టంగా పునరుక్తి చేశాం.
- source_word: πολλάκις
  choice: అనేకసార్లు
  rationale: ప్రధాన యాజకుని ప్రతి సంవత్సరపు పునరావృత ప్రవేశంతో ఉన్న వ్యత్యాసాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: προσφέρῃ ἑαυτόν
  choice: తనను తాను అర్పించుకోవడానికి
  rationale: προσφέρω యొక్క బలిసంబంధమైన భావాన్నీ, ἑαυτόν యొక్క ఆత్మవాచక బలాన్నీ నిలుపుతుంది.
- source_word: ὥσπερ
  choice: ప్రవేశించినట్లుగా
  rationale: క్రీస్తు ప్రవేశానికి, ప్రధాన యాజకుని ఆచారబద్ధమైన ప్రవేశానికి మధ్య పోలికను స్పష్టంగా సూచిస్తుంది.
- source_word: ὁ ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: యూదుల ఆరాధనా వ్యవస్థలోని ఈ పదవికి ప్రామాణికమైన, స్పష్టమైన తెలుగు పదబంధం.
- source_word: εἰσέρχεται
  choice: ప్రవేశించినట్లుగా
  rationale: గ్రీకు వర్తమాన కాలం అలవాటుగా జరిగే కార్యాన్ని సూచిస్తుంది; తెలుగులో పోలిక నిర్మాణంలో ఈ రూపం సహజంగా ఆ పునరావృత ఆచారాన్ని తెలియజేస్తుంది.
- source_word: εἰς τὰ ἅγια
  choice: పవిత్ర స్థలాల్లోకి
  rationale: గ్రీకులోని బహువచన రూపాన్ని నిలుపుతూ, ఆరాధనా స్థలానికి సంబంధించిన భావాన్ని ఇస్తుంది; సందర్భంలో దీనిని పరిశుద్ధస్థలంగా లేదా అతి పరిశుద్ధస్థలంగా గ్రహించే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: κατ’ ἐνιαυτὸν
  choice: ప్రతి సంవత్సరం
  rationale: ఏటేటా పునరావృతమయ్యే ఆచారాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: తనది కాని రక్తంతో
  rationale: రక్తం ప్రధాన యాజకునిది కాదనే భావాన్నీ, దాని ద్వారా ప్రవేశించాడనే సాధనార్థాన్నీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: క్రీస్తు ప్రవేశానికీ లేవీయ ప్రధాన యాజకుని ప్రవేశానికీ మధ్య పోలిక
  choice: క్రీస్తు తనను తాను పదేపదే అర్పించుకోవడానికి ప్రవేశించలేదని, ప్రధాన యాజకుడు మాత్రం తనది కాని రక్తంతో ప్రతి సంవత్సరం ప్రవేశించేవాడని వ్యత్యాసాన్ని నిలిపాం.
  alternative: ‘పవిత్ర స్థలాలు’ అనే పదబంధాన్ని ప్రత్యేకంగా ‘అతి పరిశుద్ధస్థలం’ అని అనువదించవచ్చు.
  rationale: తక్షణ సందర్భం క్రీస్తు అర్పణ పునరావృతం కానిదని, పాత నిబంధన ప్రధాన యాజకుని సేవ పునరావృతమయ్యేదని చూపిస్తుంది. అయితే τὰ ἅγια సూచించే స్థలాన్ని అనువాదంలో మరీ నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. గ్రీకు వాక్యం మునుపటి వచనంలోని ‘ప్రవేశించాడు’ అనే క్రియను భావార్థంగా కొనసాగిస్తుంది; తెలుగు వాక్యం స్వాభావికంగా ఉండేందుకు ఆ క్రియను చివర స్పష్టంగా చేర్చాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘పవిత్ర స్థలాల్లోకి’ అన్న పదబంధం వద్ద ఉంచాం.
