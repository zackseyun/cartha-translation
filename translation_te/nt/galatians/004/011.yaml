  revision_rationale: The revision retains Paul’s concern for the Galatians, the uncertainty introduced by μή πως, and the force of his completed, strenuous labor. It removes the added exhaustive implication of “కష్టమంతా,” renders the feared possibility more directly, and retains an anchored lexical alternative for the object of φοβοῦμαι.
