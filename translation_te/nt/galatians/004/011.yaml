id: GAL.4.11
reference: Galatians 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: te
  text: మీ విషయంలో నాకు భయం వేస్తోంది[a]—నేను మీ కోసం చేసిన శ్రమ ఏమైనా వృథా అయిందేమోనని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ గురించి నాకు భయం వేస్తోంది.”
    reason: φοβοῦμαι ὑμᾶςలోని accusative గలతీయుల పట్ల/వారి గురించి పౌలుకు ఉన్న ఆందోళనను సూచిస్తుంది. తెలుగులో “మీ విషయంలో” మరియు “మీ గురించి” రెండూ ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తాయి.
lexical_decisions:
- source_word: φοβοῦμαι
  choice: నాకు భయంగా ఉంది
  rationale: వర్తమానంలో పౌలుకు ఉన్న ఆందోళనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑμᾶς
  choice: మీ విషయంలో
  rationale: ఇది గలతీయులకు భయపడడం కాదు, వారి ఆత్మీయ స్థితిని గురించి ఆందోళన చెందడం అనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: μή πως
  choice: ఏ విధంగానైనా ... ఏమో అని
  rationale: పౌలు భయపడుతున్న సంభావ్యతను, దానిలోని అనిశ్చితిని సహజంగా నిలుపుతుంది.
- source_word: εἰκῇ
  choice: వ్యర్థమైపోయిందేమో
  rationale: శ్రమ ఆశించిన ఫలితాన్ని ఇవ్వకపోయి ఉండవచ్చనే ‘ఫలితం లేకుండా’ అనే భావాన్ని అందిస్తుంది.
- source_word: κεκοπίακα
  choice: నేను పడిన కష్టమంతా
  rationale: κοπιάωలోని తీవ్ర శ్రమ భావాన్ని చూపుతుంది; గ్రీకు పరిపూర్ణ కాలం ఇప్పటికే చేసిన శ్రమకు ప్రస్తుతం ఉన్న ప్రాసంగికతను సూచిస్తుంది.
- source_word: εἰς ὑμᾶς
  choice: మీ కోసం
  rationale: పౌలు చేసిన శ్రమ వారివైపు ఉద్దేశించబడిందనే దిశాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు వ్యక్తం చేసిన భయం స్వభావం
  choice: గలతీయుల కోసం తాను చేసిన కఠినమైన పరిచర్య ఫలించకుండా పోయిందేమోనని పౌలు ఆందోళన చెందుతున్నాడు.
  alternative: పౌలు కేవలం వ్యక్తిగత ఆందోళనను మాత్రమే వ్యక్తం చేస్తున్నాడని చదవడం.
  rationale: φοβοῦμαι ... μή πως ... εἰκῇ κεκοπίακα అనే నిర్మాణం సాధారణ ఆందోళనకన్నా, తన శ్రమ వ్యర్థమై ఉండవచ్చనే నిర్దిష్టమైన భయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘పడిన కష్టమంతా’ అనే రూపం శ్రమ తీవ్రతను సహజంగా తెలియజేస్తుంది.
