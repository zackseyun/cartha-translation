lexical_decisions:
- source_word: ὑμεῖς
  choice: మీరు
  rationale: రెండవ పురుష బహువచన సర్వనామాన్ని స్పష్టంగా ఉంచి, పాఠకులనే నేరుగా ఉద్దేశిస్తున్న గ్రీకు వాక్యంలోని ఉద్ఘాటనను సహజమైన తెలుగులో నిలిపింది.
- source_word: δέ
  choice: అయితే
  rationale: ముందటి వాదనతో స్వల్పమైన వ్యత్యాసాన్ని లేదా తదుపరి అన్వయాన్ని సూచించే సంధాన పదం; ‘అయితే’ ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: సంబోధనలో ఉన్న పుంలింగ బహువచన రూపాన్ని గౌరవప్రదమైన ఆధునిక తెలుగు పదంతో నిలిపింది; సంఘంలోని స్త్రీలను కూడా ఇది ప్రతినిధిగా కలుపుకోవచ్చనే విషయాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: κατὰ Ἰσαὰκ
  choice: ఇస్సాకులాగే
  rationale: ఇక్కడ κατά పోలికను లేదా నమూనాకు అనుగుణతను సూచిస్తుంది; ‘ఇస్సాకులాగే’ సహజంగా ఉండి, ఇస్సాకు వాగ్దాన నెరవేర్పులో జన్మించిన విధానంతో పాఠకులను పోలుస్తుంది.
- source_word: ἐπαγγελίας
  choice: వాగ్దానపు
  rationale: τέκναను విశేషించే సంబంధార్థక షష్ఠీ రూపాన్ని ‘వాగ్దానపు పిల్లలు’ అనే పౌలు ప్రయోగానికి సమీపంగా నిలిపింది.
- source_word: τέκνα
  choice: పిల్లలు
  rationale: లింగనిరపేక్షమైన బహువచన నామవాచకం; లైంగిక భేదం కంటే సంతాన సంబంధ స్థితిని తెలియజేస్తుంది.
- source_word: ἐστέ
  choice: అై ఉన్నారు
  rationale: రెండవ పురుష బహువచన వర్తమాన రూపానికి సరళమైన తెలుగు సమానం; పాఠకులను ‘వాగ్దానపు పిల్లలు’ అనే విధేయంతో కలుపుతుంది.
theological_decisions:
- issue: పౌలు రూపకాలంకార వాదనలో విశ్వాసులను ఇస్సాకుతో గుర్తించడం
  choice: ‘ఇస్సాకులాగే వాగ్దానపు పిల్లలై ఉన్నారు’
  alternative: ‘ఇస్సాకులా వాగ్దానం వల్ల పుట్టిన పిల్లలు’
  rationale: గ్రీకు వాక్యనిర్మాణంలో ఇస్సాకు పోలికకు నమూనా; ‘వాగ్దానపు పిల్లలు’ విధేయపదం. ఎంచుకున్న అనువాదం ఈ రెండింటినీ వేరు చేసి నిలుపుతూ, మూలపాఠం చెప్పినదానికంటే బలమైన సిద్ధాంత వివరణను చేర్చదు.
- issue: రెండవ పురుష మరియు మొదటి పురుష బహువచన పాఠాంతరాలు
  choice: SBLGNT ప్రధాన పాఠం ప్రకారం ‘మీరు ... ఉన్నారు’
  alternative: కొన్ని ప్రాచీన ప్రతుల ప్రకారం ‘మనం ... ఉన్నాం’
  rationale: ఇచ్చిన మూలపాఠాన్ని ప్రధాన అనువాదంగా అనుసరించి, గణనీయమైన పాఠాంతరాన్ని పాదసూచికలో పారదర్శకంగా తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంఘ సంబోధన వాడబడింది. ‘వాగ్దానపు పిల్లలు’ అనే పౌలు భావప్రయోగాన్ని వివరణాత్మకంగా విప్పకుండా నిలిపి, మూలంలోని ధార్మిక సాంద్రతను కాపాడింది.
