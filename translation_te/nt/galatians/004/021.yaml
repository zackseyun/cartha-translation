revisions:
- from: 'ధర్మశాస్త్రానికి లోబడి ఉండాలని కోరుకునే మీరే నాకు చెప్పండి: ధర్మశాస్త్రం చెప్పేది మీరు వినడం లేదా?[a]'
  to: 'ధర్మశాస్త్రానికి లోబడి ఉండాలని కోరుకునే మీరు, నాకు చెప్పండి: ధర్మశాస్త్రాన్ని వినరా?[a]'
  rationale: The revision removes unsupported emphasis and restores ‘the law’ as the direct object of ‘hear,’ preserving the Greek wording and Paul’s wordplay between being under the law and hearing the law. The footnote supplies the attentive ‘listen to’ sense and the contextual reference to Scripture.
