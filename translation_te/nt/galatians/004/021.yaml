source:
  edition: SBLGNT
  text: Λέγετέ μοι, οἱ ὑπὸ νόμον θέλοντες εἶναι, τὸν νόμον οὐκ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: te
  text: 'ధర్మశాస్త్రానికి లోబడి ఉండాలని కోరుకునే మీరు, నాకు చెప్పండి: ధర్మశాస్త్రాన్ని వినరా?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధర్మశాస్త్రాన్ని మీరు ఆలకించరా?” గ్రీకు క్రియకు ‘విను,’ ‘ఆలకించు’ అనే రెండు భావాలూ ఉండవచ్చు. ఇక్కడ ‘ధర్మశాస్త్రం’ ప్రధానంగా మోషే ధర్మశాస్త్రాన్నీ, ప్రత్యేకించి పౌలు తరువాత ఉదహరించే లేఖనంలోని వృత్తాంతాన్నీ సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: మీరే నాకు చెప్పండి
  rationale: వర్తమానకాల బహువచన ఆజ్ఞార్థక రూపం నేరుగా సవాలు చేస్తూ జవాబు కోరుతుంది. ‘నాకు చెప్పండి’ సహజమైన ఆధునిక తెలుగు; ‘మీరే’ సంబోధితులపై ఉన్న వాక్యబలాన్ని స్పష్టం చేస్తుంది.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: ధర్మశాస్త్రానికి లోబడి ఉండాలని కోరుకునే మీరు
  rationale: ఆర్టిక్యులర్ పార్టిసిపిల్ ఒక నిర్దిష్ట ఆకాంక్షగల వర్గాన్ని సంబోధిస్తుంది. ὑπὸ νόμον అనే పౌలు వాడే న్యాయ/నిబంధన సంబంధిత భావాన్ని ‘ధర్మశాస్త్రానికి లోబడి’ సహజంగా నిలుపుతుంది.
- source_word: νόμον / τὸν νόμον
  choice: ధర్మశాస్త్రం
  rationale: νόμος అనే పదం ఇక్కడ మోషే ధర్మశాస్త్ర పాలననూ, వెంటనే ఉదహరించబోయే లిఖిత ధర్మశాస్త్ర వృత్తాంతాన్నీ సూచించే పదప్రయోగాన్ని కలిగి ఉంది. రెండు చోట్లా ఒకే తెలుగు పదాన్ని వాడటం ఆ అనుసంధానాన్ని కాపాడుతుంది.
- source_word: οὐκ ἀκούετε
  choice: చెప్పేది మీరు వినడం లేదా?
  rationale: ἀκούω కు ‘విను’ లేదా ‘శ్రద్ధగా ఆలకించు’ అనే భావాలు ఉండవచ్చు. తెలుగు ‘వినడం’ రెండింటికీ చోటిస్తుంది; ‘ధర్మశాస్త్రం చెప్పేది’ అని చేర్చడం, తరువాతి లిఖిత వృత్తాంతాన్ని దృష్టిలో ఉంచుకుని, కేవలం శబ్దం వినడంకన్నా దాని సందేశాన్ని ఆలకించడాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ధర్మశాస్త్రం’ అనే పదం దేనిని సూచిస్తుంది?
  choice: రెండు సందర్భాల్లోనూ ‘ధర్మశాస్త్రం’ అని అనువదించి, దాని పాలనకూ దాని లిఖిత సందేశానికీ మధ్య ఉన్న పౌలు పదప్రయోగాన్ని నిలుపడం.
  alternative: మొదట ‘ధర్మశాస్త్ర పాలన’, తరువాత ‘మోషే గ్రంథాలు’ అని అర్థాన్ని విడదీసి చెప్పడం.
  rationale: మొదటి νόμον ధర్మశాస్త్రానికి లోబడిన స్థితిని, రెండవ τὸν νόμον ముఖ్యంగా పౌలు తరువాత ప్రస్తావించే ధర్మశాస్త్ర గ్రంథంలోని కథనాన్ని సూచించవచ్చు. మూలపాఠం ఉద్దేశపూర్వకంగా ఒకే పదాన్ని వాడుతుంది; అనువాదం ఆ భావతీవ్రతను ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన సంబోధనను వాడాం. ‘ధర్మశాస్త్రం’ అనే స్థిరమైన బైబిలు పదం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది; ‘లోబడి’ అనే రూపం ὑπὸ νόμον యొక్క సంబంధ భావాన్ని నిలుపుతుంది. ప్రధాన వాక్యంలో [a] గుర్తు ఉంచబడింది.
