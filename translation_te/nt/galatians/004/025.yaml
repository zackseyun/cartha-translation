id: GAL.4.25
reference: Galatians 4:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ ⸀δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει ⸀γὰρ μετὰ τῶν τέκνων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: te
  text: హాగరు అరేబియాలోని సీనాయి పర్వతం[a]; ఆమె ప్రస్తుత యెరూషలేముకు అనురూపంగా ఉంది, ఎందుకంటే ఆమె తన పిల్లలతో కలిసి దాస్యంలో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ హాగరు అరేబియాలోని సీనాయి పర్వతం.” గ్రీకులో ‘హాగరు’కు ముందు నిర్దిష్ట ఉపపదం ఉంది; దానివల్ల ఈ వాక్యభాగపు నిర్మాణం కొంత క్లిష్టంగా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: హాగరు
  rationale: δέను స్వల్ప కొనసాగింపు సూచకంగా గ్రహించాం; తెలుగులో అవసరం లేని ‘ఇప్పుడు’ అనే పదాన్ని చేర్చలేదు. Ἁγὰρ ముందు ఉన్న τὸ వల్ల ఏర్పడే అసాధారణ గ్రీకు నిర్మాణాన్ని ప్రధాన వాక్యంలో సహజంగా ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: అరేబియాలోని సీనాయి పర్వతం
  rationale: పౌలు వాడిన ప్రత్యక్ష సమీకరణను ‘సూచిస్తుంది’ అని వివరణాత్మకంగా మార్చకుండా నిలిపాం; Ἀραβίαను భౌగోళిక నామంగా ‘అరేబియా’ అని అనువదించాం.
- source_word: συστοιχεῖ
  choice: సరిపోలుతుంది
  rationale: ఒకే వరుసకు లేదా వర్గానికి చెందిన సమాంతర అనుబంధాన్ని సూచించే క్రియను ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: ప్రస్తుత యెరూషలేము
  rationale: తరువాతి వచనంలోని ‘పైనున్న యెరూషలేము’కు భిన్నంగా, పౌలు కాలంలోని భూసంబంధ యెరూషలేమును νῦν సూచిస్తుంది.
- source_word: δουλεύει
  choice: దాస్యంలో ఉంది
  rationale: సాధారణ సేవను కాకుండా, ఈ సందర్భంలోని దాస్యం–స్వేచ్ఛ వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: తన పిల్లలతో కలిసి
  rationale: μετά సహవాసాన్ని, τέκνα కుటుంబసంబంధమైన మరియు రూపకాలంకారమైన ‘పిల్లలు’ అనే భావాన్ని తెలియజేస్తాయి.
theological_decisions:
- issue: హాగరును సీనాయి పర్వతంతోను ప్రస్తుత యెరూషలేముతోను పౌలు అనుసంధానించడం
  choice: ‘హాగరు ... సీనాయి పర్వతం; ఆమె ప్రస్తుత యెరూషలేముకు సరిపోలుతుంది’ అని ప్రత్యక్షంగా అనువదించాం.
  alternative: ‘హాగరు సీనాయి పర్వతానికి ప్రతీక’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: గ్రీకు పాఠం మొదట ప్రత్యక్ష సమీకరణను, తరువాత అనురూప సంబంధాన్ని తెలిపే క్రియను వాడుతుంది. రూపకాలంకారాన్ని వివరించి భావాన్ని ముందే తేల్చకుండా ఆ వాక్యబలాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. పౌలు ఉద్దేశపూర్వకంగా వాడిన దాస్యం–స్వేచ్ఛ భాషను, అలాగే హాగరు–సీనాయి–ప్రస్తుత యెరూషలేము మధ్య ఉన్న ప్రత్యక్షమైన రూపకాలంకార సంబంధాన్ని మృదువుపరచలేదు.
