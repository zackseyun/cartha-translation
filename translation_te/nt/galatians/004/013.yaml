id: GAL.4.13
reference: Galatians 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: te
  text: అయితే, శారీరక అనారోగ్యం కారణంగా నేను మొదట మీకు శుభవార్త ప్రకటించానని మీకు తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శారీరక బలహీనత కారణంగా.” గ్రీకు పదబంధం అక్షరార్థంగా “శరీర బలహీనత/అనారోగ్యం కారణంగా” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: మీకు తెలుసు
  rationale: οἶδα పరిపూర్ణ రూపంలో ఉన్నప్పటికీ వర్తమాన అర్థాన్ని ఇస్తుంది; పాఠకులకు ఇప్పటికే తెలిసిన విషయాన్ని పౌలు గుర్తుచేస్తున్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాదన నుంచి స్వల్ప వ్యత్యాసంతో కూడిన మార్పును సూచిస్తుంది; తెలుగులో ‘అయితే’ ఈ సంధిని సహజంగా తెలియజేస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: గలతీయులకు తెలిసిన విషయం ఏమిటో పరిచయం చేసే పూరక సంధిగా తెలుగులో ‘అని’ సహజంగా సరిపోతుంది.
- source_word: δι’ ἀσθένειαν
  choice: అనారోగ్యం కారణంగా
  rationale: διά + ద్వితీయా విభక్తి కారణాన్ని సూచిస్తుంది. ἀσθένεια ‘బలహీనత’ లేదా ‘అనారోగ్యం’ అని అర్థమవుతుంది; ఈ సందర్భంలో శారీరక రుగ్మత భావం సంభావ్యమైనందున ప్రధాన పాఠ్యంలో ‘అనారోగ్యం’ ఎంచుకొని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: τῆς σαρκὸς
  choice: శరీర
  rationale: ఇక్కడ σάρξ నైతికమైన ‘పాప స్వభావం’ను కాక పౌలు దేహస్థితిని సూచిస్తుంది. ‘శరీర’ అనేది ఈ భౌతిక భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: εὐηγγελισάμην
  choice: శుభవార్త ప్రకటించాను
  rationale: εὐαγγελίζω సువార్తను తెలియజేయడాన్ని సూచిస్తుంది. ‘శుభవార్త ప్రకటించాను’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: దత్తివ విభక్తిలోని పరోక్ష కర్మను తెలుగులో సహజంగా ‘మీకు’ అని అనువదించాం.
- source_word: τὸ πρότερον
  choice: మొదటిసారి
  rationale: పౌలు వారికి తొలిసారి శుభవార్త ప్రకటించిన సందర్భాన్ని ఈ పదబంధం సూచిస్తుంది; ‘మొదటిసారి’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన రూపం.
theological_decisions:
- issue: ἀσθένειαν τῆς σαρκὸς లో σάρξ అర్థం
  choice: శారీరక అనారోగ్యం
  alternative: శారీరక బలహీనత; రూపకాలంకార బలహీనత; పాప స్వభావం
  rationale: పౌలు గలతీయులకు తన మొదటి ప్రకటన జరిగిన పరిస్థితిని గుర్తుచేస్తున్నాడు. ఈ సందర్భంలో పదబంధం నైతిక అవినీతిని కాక దేహసంబంధమైన అస్వస్థతను సూచించే అవకాశం ఎక్కువ. అయినప్పటికీ ἀσθένεια లోని ‘బలహీనత/అనారోగ్యం’ అర్థవ్యాప్తిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే గౌరవప్రదంగా రూపొందించబడింది. సంఘపరమైన పరిభాషను అనవసరంగా మోపకుండా ‘శుభవార్త ప్రకటించాను’ వాడబడింది; మూలంలోని వైద్యస్థితి గురించిన పరిమిత అస్పష్టత పాదసూచికలో భద్రపరచబడింది.
