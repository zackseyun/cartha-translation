  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: te
  text: కాని అతడు తండ్రి నిర్ణయించిన సమయం వరకు సంరక్షకులూ గృహనిర్వాహకులూ ఆధీనంలో ఉంటాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గృహనిర్వాహకులు’ అనే మాటకు బదులుగా ‘ఆస్తి నిర్వాహకులు’ అని కూడా అనువదించవచ్చు; గ్రీకు పదం ఇల్లు లేదా ఆస్తి వ్యవహారాలను నిర్వహించేవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తండ్రి నిర్ణయించిన గడువు వరకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: కాని
  rationale: మునుపటి వాక్యంలో చెప్పిన బాల వారసుని స్థితికి, ఇప్పుడు చెప్పే అతని ఆచరణాత్మక అధీనతకు మధ్య ఉన్న వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὑπὸ
  choice: ఆధీనంలో
  rationale: అధికారం లేదా పర్యవేక్షణకు లోబడి ఉండే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπιτρόπους
  choice: సంరక్షకులు
  rationale: బాలుడి వ్యక్తిగత సంరక్షణ, పర్యవేక్షణ బాధ్యత పొందినవారిని సూచిస్తుంది.
- source_word: ἐστὶ
  choice: ఉంటాడు
  rationale: మునుపటి వచనంలోని వారసుడే అంతర్నిహిత కర్త; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా పురుష ఏకవచన క్రియను ఉపయోగించాం.
- source_word: καὶ
  choice: సంరక్షకుల, గృహనిర్వాహకుల
  rationale: రెండు వర్గాలను కలిపే సముచ్చయ భావాన్ని తెలుగులో జాబితా నిర్మాణం ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: οἰκονόμους
  choice: గృహనిర్వాహకులు
  rationale: ఇల్లు లేదా కుటుంబ ఆస్తి వ్యవహారాలను నిర్వహించే బాధ్యతగల వ్యక్తులనే చారిత్రక భావాన్ని నిలుపుతుంది.
- source_word: ἄχρι
  choice: వచ్చేవరకు
  rationale: ఈ ఏర్పాటు కొనసాగడానికి ఉన్న కాలపరిమితిని స్పష్టంగా సూచిస్తుంది.
- source_word: τῆς προθεσμίας
  choice: నిర్ణయించిన సమయం
  rationale: ముందుగానే నిర్దేశించబడిన సమయం అనే మూలపద భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τοῦ πατρός
  choice: తండ్రి
  rationale: సందర్భంలోని వారసుని తండ్రినే సూచిస్తూ, సమయాన్ని నిర్ణయించే వ్యక్తిగా సహజంగా అర్థమయ్యేలా ఉంది.
theological_decisions:
- issue: τοῦ πατρός అనే షష్ఠీ విభక్తి పదబంధం యొక్క భావం
  choice: సమయాన్ని నిర్ణయించినవాడు తండ్రి అనే భావంతో ‘తండ్రి నిర్ణయించిన’ అని అనువదించాం.
  alternative: మరింత పదానుసారంగా ‘తండ్రి యొక్క నిర్ణీత సమయం వరకు’ అని ఇవ్వవచ్చు.
  rationale: బాల వారసుని గృహసంబంధ ఉపమానంలో అతడు ఎప్పటివరకు పర్యవేక్షణలో ఉండాలో తండ్రి నిర్ణయిస్తాడనే భావమే సందర్భానికి అత్యంత సహజం. ఇది సందర్భసంబంధ నిర్ణయం; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలిని అనుసరించాం. ‘సంరక్షకులు’ మరియు ‘గృహనిర్వాహకులు’ ద్వారా వ్యక్తిగత పర్యవేక్షణకూ ఆస్తి/గృహ నిర్వహణకూ మధ్యనున్న భేదాన్ని నిలిపాం.
