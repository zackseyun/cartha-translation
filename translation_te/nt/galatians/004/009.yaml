id: GAL.4.9
reference: Galatians 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: te
  text: కానీ ఇప్పుడు మీరు దేవుణ్ణి తెలిసికొన్నవారై—లేదా, మరింత సరిగ్గా చెప్పాలంటే, దేవునిచేత తెలుసుకోబడినవారై—బలహీనమైన, దరిద్రమైన మూలతత్త్వాల[a] వైపుకు మళ్లీ ఎలా తిరుగుతున్నారు, వాటికి మరోసారి కొత్తగా బానిసలుగా ఉండాలని ఎలా కోరుకుంటున్నారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మూలశక్తులు,’ ‘ప్రాథమిక సూత్రాలు,’ లేక ‘మూల అంశాలు.’
    reason: στοιχεῖα అనే గ్రీకు పదానికి ఈ సందర్భంలో ఒకటి కంటే ఎక్కువ సాధ్యమైన అర్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: γνόντες θεόν
  choice: మీరు దేవుణ్ణి తెలుసుకున్నారు
  rationale: అయోరిస్ట్ కృదంతంలోని దేవుణ్ణి తెలుసుకునే స్థితిలోకి వచ్చిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ప్రధాన ప్రశ్నతో దాని సందర్భ సంబంధం నిలిచింది.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: అంతకంటే సరిగ్గా చెప్పాలంటే, దేవుడే మిమ్మల్ని తెలుసుకున్నాడు
  rationale: μᾶλλον δέ లోని సరిదిద్దే బలాన్ని స్పష్టంగా చూపుతుంది. గ్రీకు కర్మణి ప్రయోగాన్ని తెలుగులో సహజమైన కర్తరి వాక్యంగా మార్చినా, ‘దేవుడే’ ద్వారా దేవుని చర్యకున్న ప్రాధాన్యం నిలుపబడింది.
- source_word: πῶς ἐπιστρέφετε πάλιν
  choice: మళ్లీ ఎలా తిరుగుతున్నారు?
  rationale: వర్తమానకాలంలో జరుగుతున్న వెనుదిరుగుదలను, పౌలు వ్యక్తం చేసిన ఆశ్చర్యం మరియు గద్దింపు స్వరాన్ని సహజంగా అందిస్తుంది.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: బలహీనమైన, దరిద్రమైన మూలతత్త్వాలు
  rationale: ἀσθενῆ, πτωχὰ అనే రెండు విశేషణాలను నేరుగా నిలుపుతూ, στοιχεῖα యొక్క వివాదాస్పద అర్థాన్ని ‘మూలతత్త్వాలు’ కొంత తెరిచి ఉంచుతుంది; ప్రత్యామ్నాయ అర్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: πάλιν ἄνωθεν
  choice: మరొకసారి మొదటినుంచి
  rationale: పునరావృతం మరియు తిరిగి మొదటి స్థితికి వెళ్లడం అనే సంయుక్త బలాన్ని నిలుపుతుంది.
- source_word: δουλεύειν θέλετε
  choice: బానిసలుగా ఉండాలని కోరుకుంటున్నారా
  rationale: δουλεύειν లోని బానిసత్వ భావాన్ని ‘సేవచేయడం’గా బలహీనపరచకుండా, θέλετε లోని సంకల్పం లేదా కోరికను స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: గలతీయులకు 4:9లో στοιχεῖα అర్థం
  choice: మూలతత్త్వాలు
  alternative: మూలశక్తులు; ప్రాథమిక సూత్రాలు; మూల అంశాలు
  rationale: ఈ పదం ప్రాథమిక మతసూత్రాలనో, పాత వ్యవస్థకు సంబంధించిన విశ్వశక్తులనో సూచించవచ్చు. ప్రధాన పాఠం ఏ ఒక్క వివరణనూ తుదిగా నిర్ణయించకుండా కొంత అస్పష్టతను నిలుపుతుంది; ప్రత్యామ్నాయాలు పాదసూచికలో ఉన్నాయి.
- issue: ‘దేవునిచేత తెలుసుకోబడడం’ యొక్క బలం
  choice: దేవుడే మిమ్మల్ని తెలుసుకున్నాడు
  alternative: మీరు దేవునిచేత తెలుసుకోబడ్డారు
  rationale: మూలంలోని కర్మణి నిర్మాణాన్ని సహజ తెలుగు కర్తరి నిర్మాణంగా వ్యక్తం చేస్తూ, ‘దేవుడే’ అనే నొక్కిచెప్పడం ద్వారా దేవుని చర్య ప్రథమమని సూచిస్తుంది; అయితే వాక్యానికి మించిన సిద్ధాంత వ్యవస్థను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. పౌలు గద్దింపు మరియు ఆశ్చర్య స్వరం నిలుపబడింది. గ్రీకు వాక్యంలోని దీర్ఘ ప్రశ్నను తెలుగులో స్పష్టత కోసం పరస్పర సంబంధమున్న రెండు ప్రశ్నలుగా విభజించారు.
