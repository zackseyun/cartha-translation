source:
  edition: SBLGNT
  text: ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: te
  text: ధర్మశాస్త్రానికి లోబడి ఉన్నవారిని ఆయన విమోచించడానికి, మనం కుమారులుగా దత్తత[a] పొందడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దత్తత.” గ్రీకు పదం అక్షరార్థంగా కుమారుల హోదాలో దత్తతను సూచిస్తుంది; ఇది సంపూర్ణ కుటుంబ హోదా, వారసత్వ హక్కులను నొక్కిచెబుతుంది. ఇక్కడ స్త్రీ పురుష విశ్వాసులందరూ ఉద్దేశించబడ్డారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: చేయడానికి
  rationale: రెండు ఉపవాక్యాల్లోనూ ఉద్దేశాన్ని సూచించే ἵνα భావాన్ని సహజమైన తెలుగు ప్రయోజనార్థక నిర్మాణంతో నిలుపుతుంది.
- source_word: τοὺς ὑπὸ νόμον
  choice: ధర్మశాస్త్రానికి లోబడి ఉన్నవారిని
  rationale: ఈ పదబంధం ధర్మశాస్త్ర అధికార పరిధిలో ఉన్న వ్యక్తులను సూచిస్తుంది; గలతీయులకు పత్రిక సందర్భంలో ‘ధర్మశాస్త్రం’ ప్రధానంగా మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది.
- source_word: ἐξαγοράσῃ
  choice: విమోచించడానికి
  rationale: వెల చెల్లించి విడిపించడం అనే మూలభావాన్ని, అలాగే ఈ సందర్భంలోని విడుదల భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగు పదంతో వ్యక్తం చేస్తుంది.
- source_word: τὴν υἱοθεσίαν
  choice: కుమారులుగా దత్తత
  rationale: దత్తత అనే కుటుంబంలో చేర్చబడే భావంతో పాటు, కుమారులకు సంబంధించిన సంపూర్ణ హోదా మరియు వారసత్వ హక్కులను సూచించే గ్రీకు పదంలోని పుంలింగ రూపాన్ని నిలుపుతుంది.
- source_word: ἀπολάβωμεν
  choice: మనం … పొందడానికి
  rationale: ఈ సందర్భంలో క్రియకు ఉన్న స్వీకరించడం లేదా పొందడం అనే సాధారణ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘తిరిగి పొందడం’ అనే భావాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: υἱοθεσίαలోని లింగసూచక కుటుంబ హోదా
  choice: కుమారులుగా దత్తత
  alternative: దత్తత; దత్తబిడ్డల హోదా
  rationale: పౌలు వాడిన పదం కుమారుని హోదా మరియు దానితో ముడిపడిన వారసత్వ హక్కులను ముందుకు తెస్తుంది. అందువల్ల మూలంలోని రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అది స్త్రీ పురుష విశ్వాసులందరికీ వర్తిస్తుందని పాదసూచికలో స్పష్టం చేయబడింది.
- issue: ‘ధర్మశాస్త్రానికి లోబడి ఉన్నవారు’ అనే మాట ఎవరిని సూచిస్తుంది
  choice: ప్రధానంగా మోషే ధర్మశాస్త్రానికి లోబడినవారు
  alternative: ఏ విధమైన చట్టానికైనా లోబడిన మానవులందరూ
  rationale: గలతీయులకు 4:4–5లోని సమీప సందర్భం మోషే ధర్మశాస్త్ర వ్యవస్థను ప్రధానంగా సూచిస్తుంది. అయితే వాక్యాన్ని అనువాదంలో మరింత కుదించి ఒకే వర్గానికి పరిమితం చేయకుండా మూలంలోని సాధారణ పదబంధాన్ని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘ధర్మశాస్త్రం,’ ‘విమోచించు’ వంటి స్థిరమైన బైబిలు పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా వాక్య నిర్మాణాన్ని సరళంగా ఉంచాం; రెండు ἵνα ప్రయోజన ఉపవాక్యాల సమాంతరతను నిలిపాం.
