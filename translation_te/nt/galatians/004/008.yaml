id: GAL.4.8
reference: Galatians 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: te
  text: కాని అప్పట్లో[a], మీరు దేవుణ్ణి తెలియనప్పుడు, స్వభావరీత్యా దేవుళ్లు కానివాటికి బానిసలుగా ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాని పూర్వం, దేవుణ్ణి తెలియక, స్వభావరీత్యా నిజంగా దేవుళ్లు కానివాటికి మీరు సేవ చేశారు.”
    reason: తότε μὲν యొక్క ‘పూర్వం’ అనే ప్రత్యామ్నాయాన్ని, అలాగే పదక్రమంలో సాధ్యమైన మార్పును మరియు ἐδουλεύσατεకు ‘సేవ చేశారు’ అనే తక్కువ బలమైన పదార్థ ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: కాని
  rationale: ముందటి వాదనతో ఉన్న వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: τότε μὲν
  choice: అప్పట్లో
  rationale: గలతీయుల గత జీవితకాలాన్ని సూచిస్తూ, తదుపరి వచనంలో వచ్చే వ్యత్యాసానికి పునాది వేస్తుంది.
- source_word: οὐκ εἰδότες θεὸν
  choice: మీరు దేవుణ్ణి ఎరుగనప్పుడు
  rationale: కృదంత ప్రయోగంలోని కాలసంబంధ భావాన్ని చూపుతుంది; ‘ఎరుగుట’ నిజమైన దేవునితో సంబంధపూర్వక పరిచయం అనే భావాన్ని నిలుపుతుంది.
- source_word: ἐδουλεύσατε
  choice: బానిసలుగా సేవ చేశారు
  rationale: కేవలం సేవ చేయడం కంటే బానిసత్వ భావాన్ని స్పష్టంగా నిలుపుతూ, గలతీయుల పత్రికలోని బానిసత్వం–స్వేచ్ఛ ఇతివృత్తానికి అనుగుణంగా ఉంటుంది.
- source_word: τοῖς ... οὖσι θεοῖς
  choice: దేవుళ్లు కానివాటికి
  rationale: మూలపాఠం పేర్కొనని ‘విగ్రహాలు’ లేదా ‘దయ్యాలు’ వంటి నిర్దిష్ట గుర్తింపును చేర్చకుండా, సూచిత వస్తువులు లేదా సత్త్వాలను తటస్థంగా ఉంచుతుంది.
- source_word: φύσει μὴ
  choice: స్వభావరీత్యా ... కాని
  rationale: అవి కేవలం పేరుకు మాత్రమే కాక, వాస్తవ స్వరూపంలోనే దేవుళ్లు కావని తెలిపే అస్తిత్వ సంబంధ నిరాకరణను కాపాడుతుంది.
theological_decisions:
- issue: వారు పూర్వం సేవించిన వాటి స్వరూపం
  choice: ‘స్వభావరీత్యా దేవుళ్లు కానివి’ అని పౌలు చేసిన అస్తిత్వ సంబంధ నిరాకరణను ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘నిజంగా దేవుళ్లు కానివి’ లేదా ‘దేవుళ్లని తప్పుగా పిలువబడేవి’
  rationale: φύσει μὴ οὖσι θεοῖς అనే మాట వాటి నిజ స్వరూపాన్ని నిరాకరిస్తుంది. అవి విగ్రహాలా, దుష్ట ఆత్మశక్తులా అని పౌలు ఇక్కడ నిర్ణయించనందున అనువాదం కూడా ఆ ఉద్రిక్తతను పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘బానిసలుగా సేవ చేశారు’ అనే ప్రయోగం మూలంలోని δουλεύω బంధిత సేవ భావాన్ని బలహీనపరచకుండా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
