revisions:
- from: కాని అప్పట్లో[a], మీరు దేవుణ్ణి ఎరుగనప్పుడు, స్వభావరీత్యా దేవుళ్లు కానివాటికి బానిసలుగా సేవ చేశారు.
  to: కాని అప్పట్లో[a], మీరు దేవుణ్ణి తెలియనప్పుడు, స్వభావరీత్యా దేవుళ్లు కానివాటికి బానిసలుగా ఉండేవారు.
  rationale: The revision updates archaic diction to modern standard Telugu and replaces a redundant slavery/service expression with a natural phrase that still conveys enslavement. It leaves the referents deliberately unspecified and retains Paul’s claim that they are not gods by nature.
