  terminology: ‘కుమారులు’ దత్తపుత్రత్వం–వారసత్వం సందర్భాన్ని కాపాడుతుంది; ‘అబ్బా’ను లిప్యంతరీకరించడం సరైనది; ‘తండ్రీ’ సంబోధనగా సహజమైనది. పాఠాంతర గమనికను ‘హృదయాల్లోకి’ వద్ద ప్రత్యేక గుర్తుతో ఉంచడం పారదర్శకతను, పాదసూచిక-ఆంకర్ స్పష్టతను మెరుగుపరుస్తుంది.
