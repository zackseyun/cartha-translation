id: GAL.4.6
reference: Galatians 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: te
  text: మరియు మీరు కుమారులు[a] కాబట్టి, దేవుడు తన కుమారుని ఆత్మను మన హృదయాల్లోకి[b] పంపించాడు; ఆ ఆత్మ, “అబ్బా[c], తండ్రీ!” అని కేక వేస్తున్నది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కుమారులు’ అనే మాట ఇక్కడ పౌలు ఉపయోగిస్తున్న దత్తపుత్రత్వం, వారసత్వం భాషను నిలుపుతుంది; ఇది పురుషులకు మాత్రమే కాక విశ్వాసులందరికీ వర్తిస్తుంది.
    reason: cultural_note
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘మన హృదయాల్లోకి’ బదులు ‘మీ హృదయాల్లోకి’ అని ఉంది.
    reason: textual_variant
  - marker: c
    text: ‘అబ్బా’ అనేది ‘తండ్రి’ అని సంబోధించే అరామీయ పదం; మూలపాఠంలోని ప్రత్యేకమైన, సన్నిహిత సంబోధనను నిలుపడానికి ఇక్కడ అలాగే ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: మీరు ... కాబట్టి
  rationale: ὅτι కారణాన్ని సూచిస్తుంది; δέ యొక్క స్వల్ప అనుసంధాన భావం తెలుగు వాక్యప్రవాహంలో సహజంగా అంతర్లీనమవుతుంది.
- source_word: υἱοί
  choice: కుమారులు
  rationale: గలతీయులు 3–4లోని దత్తపుత్రత్వం, వారసత్వం అనే న్యాయపరమైన రూపకాన్ని నిలుపుతుంది; సందర్భంలో ఇది పురుషులకు మాత్రమే కాక విశ్వాసులందరికీ వర్తిస్తుంది.
- source_word: ἐξαπέστειλεν
  choice: పంపించాడు
  rationale: పూర్తయిన దైవిక చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: తన కుమారుని ఆత్మను
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని, ఆ పదబంధపు వేదాంతపరమైన బరువును నేరుగా నిలుపుతుంది.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: మన హృదయాల్లోకి
  rationale: SBLGNTలోని ἡμῶνను అనుసరిస్తూ, బైబిలు మానవశాస్త్రంలోని ‘హృదయాలు’ అనే రూపాన్ని వ్యాఖ్యానించి మార్చకుండా ఉంచుతుంది.
- source_word: κρᾶζον
  choice: కేక వేస్తున్నాడు
  rationale: వర్తమాన కృదంతం ఆత్మతో వ్యాకరణపరంగా ఏకీభవిస్తుంది; పిలుపు యొక్క తీవ్రతను ‘కేక వేస్తున్నాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: Αββα
  choice: అబ్బా
  rationale: గ్రీకు పాఠ్యంలో నిలుపబడిన అరామీయ సంబోధనను తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: ὁ πατήρ
  choice: తండ్రీ
  rationale: నిర్దేశకంతో ఉన్న గ్రీకు పదం ఇక్కడ భావపరంగా సంబోధన; ‘తండ్రీ’ సహజమైన, గౌరవప్రదమైన తెలుగు సంబోధన.
theological_decisions:
- issue: దత్తపుత్రత్వం, వారసత్వం సందర్భంలో υἱοί అనువాదం
  choice: కుమారులు
  alternative: పిల్లలు
  rationale: పౌలు వాదనలో కుమారత్వం నుంచి వారసత్వానికి ఉన్న సంబంధాన్ని ‘కుమారులు’ కాపాడుతుంది. ఇందులో స్త్రీ పురుష విశ్వాసులందరూ ఉన్నారని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: ‘హృదయాలు’తో ఉన్న సర్వనామ పాఠాంతరం
  choice: మన హృదయాల్లోకి
  alternative: మీ హృదయాల్లోకి
  rationale: అందించిన SBLGNT పాఠం ἡμῶν (‘మన’) అని ఉంది; అందువల్ల ప్రధాన పాఠంలో దానినే అనుసరించి, మరో పాఠాన్ని పాదసూచికలో నమోదు చేశాం.
- issue: కేక వేస్తున్నది ఎవరు?
  choice: ఆత్మ కేక వేస్తున్నాడు
  alternative: విశ్వాసులు ఆత్మ ద్వారా కేక వేస్తారు
  rationale: κρᾶζον అనే నపుంసక ఏకవచన కృదంతం τὸ πνεῦμαతో వ్యాకరణపరంగా ఏకీభవిస్తుంది; కాబట్టి ఈ వాక్యంలో ప్రత్యక్ష కర్త ఆత్మ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన శైలి. మూలంలోని కుమారత్వం–వారసత్వం పదజాలం, ‘హృదయాలు,’ అరామీయ ‘అబ్బా,’ అలాగే ఆత్మే కేక వేస్తున్నాడనే వ్యాకరణ సంబంధం నిలుపబడ్డాయి.
