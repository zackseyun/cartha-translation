  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: te
  text: కానీ కాలపు పరిపూర్ణత వచ్చినప్పుడు[a], దేవుడు స్త్రీ నుండి జన్మించిన[c], ధర్మశాస్త్రం కింద జన్మించిన[d] తన కుమారుణ్ణి పంపాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కాలం నిండినప్పుడు’; పదశః, ‘కాలపు పరిపూర్ణత వచ్చినప్పుడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘పంపాడు’కు వాడిన గ్రీకు క్రియలో ‘బయటికి పంపాడు’ అనే బలమైన ఛాయ ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘స్త్రీ ద్వారా జన్మించిన.’ ఈ మాట కుమారుని నిజమైన మానవ జననాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: d
    text: అంటే, మోషే ధర్మశాస్త్ర అధికార పరిధి కింద.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: అయితే ... అప్పుడు
  rationale: δέ సూచించే స్వల్ప సందర్భ మార్పును ‘అయితే’తో, ὅτε సూచించే కాల సంబంధాన్ని ‘...అప్పుడు’ నిర్మాణంతో సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; అవసరానికి మించిన బలమైన వ్యతిరేకతను చేర్చదు.
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: కాలం సంపూర్ణమైనప్పుడు
  rationale: పదశః ‘కాలపు సంపూర్ణత వచ్చింది’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. దేవుడు నిర్ణయించిన సమయం అనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టీకరించి అసలులోని భావ విస్తృతిని కుదించదు.
- source_word: ἐξαπέστειλεν
  choice: పంపాడు
  rationale: దేవుడు తన కుమారుణ్ణి కార్యనిమిత్తం పంపాడనే ప్రధాన అర్థాన్ని సహజంగా తెలుపుతుంది. సమాస క్రియలోని ‘బయటికి పంపడం’ అనే ఛాయను పాఠ్యంలో అసహజంగా బలపరచకుండా పాదసూచికలో సూచిస్తుంది.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: తన కుమారుణ్ణి
  rationale: కర్త అయిన దేవునికే αὐτοῦ సంబంధించిందని తెలుగులో సహజమైన ఆత్మార్థక సర్వనామం ‘తన’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: γενόμενον ἐκ γυναικός
  choice: స్త్రీ నుండి జన్మించి
  rationale: ఈ నిర్మాణంలో γίνομαι మానవ జననాన్ని సూచిస్తుంది; ἐκ లోని మూలం లేదా ఉద్భవ భావాన్ని ‘నుండి’ నిలుపుతుంది. ఇది కుమారుని నిజమైన మానవ జననాన్ని తెలుపుతూ, ‘పంపాడు’ సూచించే ముందస్తు ఉనికి భావాన్ని తొలగించదు.
- source_word: γενόμενον ὑπὸ νόμον
  choice: ధర్మశాస్త్రానికి లోబడిన
  rationale: ὑπό + accusative సూచించే అధికార పరిధి లేదా లోబాటు భావాన్ని స్పష్టంగా అందిస్తుంది. ‘ధర్మశాస్త్రం’ గలతీయుల పత్రికలోని మోషే ధర్మశాస్త్ర సందర్భానికి సహజమైన తెలుగు పదం.
theological_decisions:
- issue: γενόμενον ἐκ γυναικόςలో కుమారుని నిజమైన మానవత్వం మరియు ముందస్తు ఉనికి మధ్య ఉద్రిక్తత
  choice: ‘స్త్రీ నుండి జన్మించి’ అని అనువదించి నిజమైన మానవ జననాన్ని తెలిపి, ‘దేవుడు ... తన కుమారుణ్ణి పంపాడు’ అనే వాక్య నిర్మాణాన్ని అలాగే ఉంచడం
  alternative: ‘స్త్రీ ద్వారా ఉనికిలోకి వచ్చిన’ లేదా ‘స్త్రీతో చేయబడిన’
  rationale: సందర్భంలో γενόμενον సహజంగా జననాన్ని సూచిస్తుంది. ‘జన్మించి’ స్పష్టమైనదే అయినా, కుమారుడు అప్పుడే మొదట ఉనికిలోకి వచ్చాడని చెప్పదు; వాక్యంలోని పంపబడిన కుమారుడు అనే భావంతో ఉన్న తాత్త్విక ఉద్రిక్తతను నిలుపుతుంది.
- issue: ὑπὸ νόμονలో νόμος దేనిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘ధర్మశాస్త్రానికి లోబడిన’ అని ఉంచి, పాదసూచికలో మోషే ధర్మశాస్త్ర అధికార పరిధిని వివరించడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘మోషే ధర్మశాస్త్రానికి లోబడిన’ అని విస్తరించడం లేదా సాధారణంగా ‘నియమానికి లోబడిన’ అని అనువదించడం
  rationale: గలతీయుల సందర్భం మోషే ధర్మశాస్త్రాన్ని బలంగా సూచిస్తుంది. అయినా మూలపాఠ్యంలోని సంక్షిప్త νόμοςను ప్రధాన పాఠ్యంలో విస్తరించకుండా ఉంచడం వలన పౌలు మాటతీరును, సందర్భం చేసే నిర్దిష్టీకరణను రెండింటినీ గౌరవిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘కాలం సంపూర్ణమైనప్పుడు’ కొద్దిగా ఉన్నత శైలిలో ఉన్నా మూలంలోని πλήρωμα భావాన్ని నిలుపుతుంది. ‘ధర్మశాస్త్రం’ బైబిలు సందర్భంలో సుపరిచితమైన పదం; పాదసూచిక దాని మోషే సంబంధిత సూచనను వివరిస్తుంది. మూలంలోని ఒక ప్రధాన వాక్య నిర్మాణం, రెండు సమాంతర participial వర్ణనలు సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
