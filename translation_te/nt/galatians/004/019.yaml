id: GAL.4.19
reference: Galatians 4:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀τέκνα μου, οὓς πάλιν ὠδίνω ⸀μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: te
  text: నా పిల్లలారా, మీలో[a] మెస్సీయ[b] రూపుదాల్చే వరకు మీ కోసం నేను మళ్లీ ప్రసవవేదన పడుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ మధ్య.’ ఈ మాటకు సమాజమంతటిని ఉద్దేశించే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘క్రీస్తు.’ గ్రీకు Χριστός అనే బిరుదును ఇక్కడ ‘మెస్సీయ’ అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: τέκνα μου
  choice: నా పిల్లలారా
  rationale: అనురాగంతో సంబోధించే బహువచనాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో స్పష్టంగా లేని ‘చిన్న’ అనే భావాన్ని చేర్చదు.
- source_word: οὓς
  choice: మీ కోసం
  rationale: వ్యాకరణపరంగా ‘ఎవరిని’ అనే సంబంధార్థం ఉన్నప్పటికీ, ప్రసవవేదన రూపకంతో తెలుగులో ‘మీ కోసం ... ప్రసవవేదన పడుతున్నాను’ అనడం సహజంగా ఉండి మూల సంబంధాన్ని కాపాడుతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: పునరావృతిని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὠδίνω
  choice: ప్రసవవేదన పడుతున్నాను
  rationale: ప్రసవ సమయంలో కలిగే వేదన అనే పౌలు వాడిన సజీవమైన మాతృరూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: μέχρις οὗ
  choice: వరకు
  rationale: కాలపరమైన గమ్యాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μορφωθῇ
  choice: రూపుదాల్చే
  rationale: మెస్సీయ వారిలో రూపం పొందడం అనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; దాన్ని సాంకేతిక సిద్ధాంతపదంగా మార్చదు.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστός యొక్క బిరుదు భావాన్ని తెలుగులో తెలియజేస్తుంది; సుపరిచితమైన ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: బహువచన శ్రోతలలో అంతర్గతంగా రూపుదాల్చడం అనే ప్రధాన భావాన్ని అందిస్తుంది; ‘మీ మధ్య’ అనే సమూహార్థ అవకాశాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: ‘మెస్సీయ మీలో రూపుదాల్చడం’ అనే మాట యొక్క భావం
  choice: మెస్సీయ విశ్వాసులలో రూపుదాల్చడం అనే పౌలు రూపకాన్ని వివరణాత్మక సిద్ధాంతభాషగా మార్చకుండా యథాతథంగా ఉంచడం
  alternative: మెస్సీయ సమాజంగా వారి మధ్య రూపుదాల్చడం
  rationale: ἐν ὑμῖν వ్యక్తిగత అంతర్గత భావాన్నీ, సమూహపరమైన భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠంలో ‘మీలో’ సహజంగా ఉండగా, సమూహార్థాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, అనురాగభరితమైనప్పటికీ గౌరవప్రదమైన పౌలు స్వరాన్ని ఉంచాం. ప్రసవవేదన రూపకాన్ని తగ్గించకుండా నేరుగా వ్యక్తం చేశాం; వాక్యనిర్మాణం సాధారణ పాఠకులకు సహజంగా ఉండేలా అమర్చాం.
