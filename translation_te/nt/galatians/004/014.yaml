id: GAL.4.14
reference: Galatians 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: te
  text: 'నా శరీర స్థితి మీకు ఒక పరీక్షగా ఉన్నప్పటికీ[a], మీరు నన్ను తృణీకరించలేదు, అసహ్యంతో తిరస్కరించలేదు[b]. దానికి బదులుగా, దేవదూతను స్వీకరించినట్లు, మెస్సీయ యేసును[c] స్వీకరించినట్లు నన్ను స్వాగతించారు.


    [a] మూలపాఠాన్ని మరింత అక్షరార్థంగా, “నా శరీరంలో మీ పరీక్ష” అని కూడా అనువదించవచ్చు. ఈ పదబంధం వాక్యనిర్మాణపరంగా క్లిష్టంగా ఉంది.


    [b] గ్రీకు పదానికి అక్షరార్థం “ఉమ్మివేయడం”; ఇక్కడ అది తీవ్రమైన అసహ్యంతో తోసిపుచ్చడాన్ని సూచిస్తుంది.


    [c] గ్రీకులో “క్రిస్టోస్ యేసు”; “క్రిస్టోస్” ఇక్కడ బిరుదుగా వాడబడింది కాబట్టి “మెస్సీయ యేసు” అని అనువదించబడింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలపాఠాన్ని మరింత అక్షరార్థంగా, “నా శరీరంలో మీ పరీక్ష” అని కూడా అనువదించవచ్చు. ఈ పదబంధం వాక్యనిర్మాణపరంగా క్లిష్టంగా ఉంది.
    reason: alternative_reading
  - marker: b
    text: గ్రీకు పదానికి అక్షరార్థం “ఉమ్మివేయడం”; ఇక్కడ అది తీవ్రమైన అసహ్యంతో తోసిపుచ్చడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో “క్రిస్టోస్ యేసు”; “క్రిస్టోస్” ఇక్కడ బిరుదుగా వాడబడింది కాబట్టి “మెస్సీయ యేసు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν
  choice: పరీక్ష
  rationale: సందర్భంలో ఇది పాపానికి ప్రలోభాన్ని కాక, పౌలు శారీరక స్థితి వల్ల గలతీయులు ఎదుర్కొన్న కష్టమైన పరీక్షను సూచిస్తుంది.
- source_word: ὑμῶν
  choice: మీకు
  rationale: జనిటివ్ రూపం వాక్యనిర్మాణపరంగా క్లిష్టమైనది. పౌలు శారీరక స్థితి గలతీయులకు పరీక్షగా నిలిచిందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐν τῇ σαρκί μου
  choice: నా శరీర స్థితి
  rationale: ఇక్కడ σάρξ నైతికమైన ‘పాప స్వభావం’ను కాక పౌలు భౌతిక స్థితిని సూచిస్తుంది. ‘శరీర స్థితి’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐξουθενήσατε
  choice: తృణీకరించలేదు
  rationale: ఈ క్రియ చిన్నచూపు చూడడం లేదా విలువలేనిదిగా భావించి తిరస్కరించడం అనే అర్థాన్ని ఇస్తుంది.
- source_word: ἐξεπτύσατε
  choice: అసహ్యంతో తిరస్కరించలేదు
  rationale: అక్షరార్థంగా ‘ఉమ్మివేయడం’ అనే చిత్రాన్ని కలిగిన ఈ క్రియ, ఇక్కడ అసహ్యంతో తోసిపుచ్చడాన్ని సూచిస్తుంది; అక్షరార్థ చిత్రం పాదసూచికలో భద్రపరచబడింది.
- source_word: ἐδέξασθέ
  choice: స్వాగతించారు
  rationale: కేవలం స్వీకరించడం కంటే ఆప్యాయంగా అంగీకరించిన భావాన్ని ఈ సందర్భంలో ‘స్వాగతించారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄγγελον θεοῦ
  choice: దేవుని దూత
  rationale: ἄγγελος దేవదూత లేదా సందేశవాహకుడు అనే రెండు భావాలనూ కలిగి ఉండగలదు. తెలుగు ‘దూత’ ఆ విస్తృతిని కొంతవరకు నిలుపుతూ, ఉన్నతమైన పోలికకు అనుకూలంగా ఉంది.
- source_word: Χριστὸν Ἰησοῦν
  choice: మెస్సీయ యేసు
  rationale: Χριστός ఇక్కడ పేరులో భాగం మాత్రమే కాక బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
theological_decisions:
- issue: “దేవుని దూతను స్వీకరించినట్లు, మెస్సీయ యేసును స్వీకరించినట్లు” అనే పోలిక అర్థం
  choice: గలతీయులు పౌలును అత్యంత గౌరవంగా స్వాగతించిన విధానాన్ని తెలిపే రెండు పోలికలుగా అనువదించాం.
  alternative: రెండవ పోలిక మొదటిదాన్ని అలంకారికంగా మరింత బలపరుస్తుందని ప్రత్యేకంగా వివరణాత్మకంగా అనువదించడం.
  rationale: రెండు ὡς పదాలు స్వీకరణ విధానాన్ని సూచిస్తాయి. పౌలును మెస్సీయతో ఏకరూపం చేయకుండా, మూలంలోని బలమైన పోలికను యథాతథంగా ఉంచాం.
- issue: σάρξ యొక్క భావం
  choice: భౌతిక శరీర స్థితి
  alternative: పాప స్వభావం
  rationale: సమీప సందర్భంలో పౌలు అనారోగ్యం లేదా శారీరక బలహీనత వంటి భౌతిక స్థితి ఉద్దేశించబడింది; నైతిక అర్థాన్ని చేర్చడానికి ఆధారం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని వ్యాకరణ క్లిష్టతను ప్రధాన వాక్యంలో సహజంగా వ్యక్తం చేసి, నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం. ‘తృణీకరించలేదు, అసహ్యంతో తిరస్కరించలేదు’ అనే జత మూలంలోని రెండు బలమైన నిరాకరణ క్రియల వ్యత్యాసాన్ని కాపాడుతుంది.
