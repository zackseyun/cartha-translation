  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: te
  text: అయితే దాసియైన స్త్రీకి పుట్టిన కుమారుడు శరీరానుసారంగా[a] జన్మించాడు; స్వతంత్రురాలైన స్త్రీకి పుట్టిన కుమారుడు వాగ్దానంవల్ల[b] జన్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “సాధారణ మానవ విధానంలో” లేదా “మానవ ప్రయత్నం ప్రకారం.” గ్రీకు మూలంలో: “శరీరానుసారంగా.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వాగ్దానం ద్వారా.” ఇది కేవలం సాధారణ మానవ సంతానోత్పత్తిని కాక, దేవుని వాగ్దానం ఫలితంగా జరిగిన జననాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: దాసియైన స్త్రీ
  rationale: హాగరు దాస్యస్థితిని స్పష్టంగా నిలుపుతూ, స్వతంత్రురాలితో పౌలు చేస్తున్న సామాజిక-వేదాంతపరమైన వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: κατὰ σάρκα
  choice: శరీరానుసారంగా
  rationale: పౌలు వాడిన σάρξ అనే కీలక పదాన్ని నిలుపుతుంది; ఇక్కడ అది పాపస్వభావాన్ని కాక సాధారణ మానవ సంతానోత్పత్తి విధానాన్ని సూచిస్తుంది.
- source_word: γεγέννηται
  choice: పుట్టాడు
  rationale: గ్రీకు పరిపూర్ణ కర్మణి రూపాన్ని సందర్భానికి సహజమైన ఆధునిక తెలుగు కథన రూపంలో అందిస్తుంది.
- source_word: ἐλευθέρα
  choice: స్వతంత్రురాలైన స్త్రీ
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని సహజంగా తెలుగులో వ్యక్తం చేస్తూ, దాసియైన స్త్రీతో ఉన్న ప్రధాన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: δι’ ἐπαγγελίας
  choice: వాగ్దానం ద్వారా
  rationale: దేవుని వాగ్దానం ఫలితంగా ఆ జననం సంభవించిందనే సాధనార్థక భావాన్ని నిలుపుతుంది; మూలంలోని నిర్దేశక పదం లేని నిర్మాణాన్ని అనుసరిస్తుంది.
- source_word: ὁ μὲν ... ὁ δὲ
  choice: పుట్టిన కుమారుడు ... పుట్టిన కుమారుడు
  rationale: గ్రీకులో సందర్భం ద్వారా అర్థమయ్యే 'కుమారుడు' అనే సూచ్యార్థాన్ని తెలుగులో రెండు భాగాల్లో స్పష్టం చేసి పోలికను సహజంగా చేస్తుంది.
theological_decisions:
- issue: κατὰ σάρκα మరియు δι’ ἐπαγγελίας మధ్య వ్యత్యాసం
  choice: సహజ మానవ జనన విధానానికి, దేవుని వాగ్దానం ఫలితంగా జరిగిన జననానికి మధ్య వ్యత్యాసంగా అనువదించడం
  alternative: “సాధారణ మానవ విధానంలో” మరియు “దేవుని వాగ్దానం ఫలితంగా” అని మరింత వివరణాత్మకంగా అనువదించడం
  rationale: ఈ సందర్భంలో పౌలు భౌతిక జననాన్ని పాపమని చెప్పడం లేదు; ఒడంబడిక మరియు వాగ్దానం ఆధారంగా వ్యత్యాసం చూపుతున్నాడు. ప్రధాన పాఠంలో ‘శరీరం’ అనే పౌలు పదజాలాన్ని ఉంచి, సందర్భార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దాసియైన స్త్రీ/స్వతంత్రురాలైన స్త్రీ’ అనే సమాంతర నిర్మాణం మూలంలోని సామాజిక వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది; ‘శరీరానుసారంగా’ పౌలు పదజాలాన్ని కాపాడుతుంది.
