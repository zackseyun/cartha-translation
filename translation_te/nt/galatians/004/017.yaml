review_pass:
  verdict: revise
  source_fidelity: The draft preserves the repeated ζηλόω wording with the same Telugu expression and correctly renders the purpose relationship. However, “మంచి ఉద్దేశంతో కాదు” narrows οὐ καλῶς to inward motive. The Greek more directly evaluates the manner/character of their conduct; their ulterior aim is then supplied by the following clause.
  naturalness: The Telugu is generally fluent and modern. Replacing the motive-specific phrase with “మంచి రీతిలో కాదు” is both more source-precise and natural in this context. The word order in the second sentence remains clear and idiomatic.
  terminology: “ఆసక్తి చూపుతున్నారు / ఆసక్తి చూపేలా” appropriately retains the rhetorical repetition of ζηλόω without importing a romantic sense. “మిమ్మల్ని వేరుచేయాలని” reasonably preserves the unspecified object of ἐκκλεῖσαι, though the footnote rightly supplies “బయట ఉంచడం” as an alternative.
  issues:
  - severity: medium
    issue: “మంచి ఉద్దేశంతో కాదు” renders οὐ καλῶς too specifically as bad motive.
    rationale: While the opponents’ motive is exposed in the next clause, καλῶς itself means ‘well, properly, commendably’ and can assess their manner or character more broadly. “మంచి రీతిలో కాదు” preserves this scope.
