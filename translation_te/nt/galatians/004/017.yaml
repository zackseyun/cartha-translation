source:
  edition: SBLGNT
  text: ζηλοῦσιν ὑμᾶς οὐ καλῶς, ἀλλὰ ἐκκλεῖσαι ὑμᾶς θέλουσιν, ἵνα αὐτοὺς ζηλοῦτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: te
  text: వారు మీపట్ల ఎంతో ఆసక్తి చూపుతున్నారు[a], అయితే మంచి రీతిలో కాదు. మీరు వారిపట్ల ఆసక్తి చూపేలా మిమ్మల్ని వేరుచేయాలని[b] వారు కోరుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు మీ అభిమానం సంపాదించుకోవడానికి తీవ్రంగా ప్రయత్నిస్తున్నారు.” గ్రీకు క్రియకు బలమైన ఆసక్తి చూపడం, ఉత్సాహంగా కోరడం అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మిమ్మల్ని బయట ఉంచాలని.” వారు మిమ్మల్ని పౌలు మరియు అతని సహచరుల నుంచి దూరం చేసి, మీరు తమనే ఆశ్రయించేలా చేయాలనుకుంటున్నారని సందర్భం సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν / ζηλοῦτε (ζηλόω)
  choice: ఆసక్తి చూపుతున్నారు / ఆసక్తి చూపాలి
  rationale: ఈ క్రియ బలమైన ఆసక్తి, ఉత్సాహపూర్వక అనురక్తి, లేదా ఒకరి అభిమానం సంపాదించుకోవడానికి ప్రయత్నించడం అనే భావాలను కలిగి ఉంటుంది. రెండు చోట్ల ఒకే పదబంధాన్ని వాడటం గ్రీకు వాక్యంలోని ఉద్దేశపూర్వక సమాంతరతను నిలుపుతుంది; ప్రేమప్రణయ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: οὐ καλῶς
  choice: మంచి ఉద్దేశంతో కాదు
  rationale: సందర్భంలో ప్రత్యర్థుల ఆసక్తి బయటకు మంచిదిగా కనిపించినా దాని వెనుక ఉద్దేశం సరిగా లేదని పౌలు చెబుతున్నాడు. ఈ తెలుగు రూపం వారి ప్రవర్తనపై ఉన్న నైతిక విమర్శను సహజంగా తెలియజేస్తుంది.
- source_word: ἐκκλεῖσαι
  choice: వేరుచేయాలని
  rationale: మూల క్రియకు బయట ఉంచడం లేదా మినహాయించడం అనే భావం ఉంది. దేనినుంచి వేరుచేయాలనుకుంటున్నారో మూలపాఠం స్పష్టంగా చెప్పనందున, ఆ అస్పష్టతను నిలుపుతూ సంబంధపరమైన దూరాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θέλουσιν
  choice: కోరుతున్నారు
  rationale: సాధారణ సంకల్పాన్ని తెలిపే క్రియకు గౌరవప్రదమైన, ఆధునిక తెలుగు రూపం.
- source_word: ἵνα
  choice: అనే ఉద్దేశంతో
  rationale: ప్రత్యర్థుల చర్య వెనుకనున్న ప్రయోజనాన్ని స్పష్టంగా తెలియజేసే సహజమైన ప్రయోజనార్థక నిర్మాణం.
theological_decisions:
- issue: ἐκκλεῖσαι ὑμᾶςలో గల వేరుచేయడం దేనినుంచి?
  choice: ప్రధాన పాఠంలో దేనినుంచి వేరుచేయాలనుకుంటున్నారో నిర్దిష్టంగా చెప్పకుండా ‘మిమ్మల్ని వేరుచేయాలని’ అని ఉంచడం.
  alternative: పౌలు మరియు అతని సహచరులనుంచి వారిని వేరుచేయాలని ప్రత్యర్థులు కోరుతున్నారని స్పష్టంగా చెప్పడం; లేదా సంఘం/దేవుని ఆశీర్వాదం నుంచి వెలివేయడం అని అర్థం చేసుకోవడం.
  rationale: సమీప సందర్భం పౌలుతో గల సంబంధాన్ని, ప్రత్యర్థి బోధకుల ప్రభావాన్ని సూచించినప్పటికీ, ఈ వచనంలోని గ్రీకు పాఠం వేరుచేయబడే వర్గాన్ని స్పష్టంగా పేర్కొనదు. కాబట్టి ప్రధాన పాఠం అస్పష్టతను కాపాడుతుంది; సాధ్యమైన సందర్భార్థాన్ని పాదసూచికలో మాత్రమే వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ‘ఆసక్తి చూపడం’ అనే పునరుక్తి మూలంలోని ζηλόω క్రియ రెండుసార్లు రావడాన్ని నిలుపుతుంది. ‘వేరుచేయడం’ దేనినుంచో ప్రధాన పాఠంలో పేర్కొనకుండా మూలపాఠంలోని నిజమైన అస్పష్టతను కాపాడింది.
