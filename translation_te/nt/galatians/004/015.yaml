source:
  edition: SBLGNT
  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: te
  text: అయితే, మీ ధన్యత ఇప్పుడు ఏమైంది?[a] ఎందుకంటే, సాధ్యమై ఉంటే, మీరు మీ కళ్లను పెరికి[b] నాకు ఇచ్చేవారని నేను మీకు సాక్ష్యంగా చెబుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీరు ధన్యులమని భావించిన ఆ ఆనందం ఇప్పుడు ఏమైంది?’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం ధన్యస్థితిని లేదా ధన్యులని ప్రకటించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మీ కళ్లను పెరికి నాకు ఇచ్చేవారు.’ ఇది వారి మునుపటి అంకితభావాన్ని తెలిపే అతిశయోక్తి కావచ్చు; పౌలు శారీరక స్థితికి సూచనగా కూడా కొందరు అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: అయితే, ... ఇప్పుడు ఏమైంది?
  rationale: ఇది వారి మునుపటి వైఖరి ఏమైందని ప్రశ్నించే అలంకారిక ప్రశ్న. οὖν యొక్క అన్వయ భావాన్ని ‘అయితే’ తెలియజేస్తుంది; సందర్భానుగుణమైన కాలభావాన్ని ‘ఇప్పుడు’ స్పష్టం చేస్తుంది.
- source_word: μακαρισμὸς ὑμῶν
  choice: మీ ధన్యత
  rationale: μακαρισμός అనే పదం ధన్యస్థితిని లేదా ధన్యులని ప్రకటించడాన్ని సూచించవచ్చు. ‘ధన్యత’ ఆ ద్వంద్వార్థాన్ని సాధ్యమైనంతవరకు నిలుపుతూ గంభీరమైన తెలుగు వాడుకను ఇస్తుంది.
- source_word: μαρτυρῶ γὰρ ὑμῖν ὅτι
  choice: '... అని మీకు సాక్ష్యంగా చెబుతున్నాను'
  rationale: తెలుగులో సహజంగా వినిపించే విధంగా, μαρτυρέω లోని గంభీరమైన సాక్ష్యభావాన్ని నిలుపుతుంది; ὅτι సాక్ష్యంలోని విషయాన్ని పరిచయం చేస్తుంది.
- source_word: εἰ δυνατὸν
  choice: సాధ్యమై ఉంటే
  rationale: గ్రీకులోని సంక్షిప్త షరతును నిలుపుతూ, సందర్భంలో అది జరగని అవకాశమని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες ἐδώκατέ μοι
  choice: మీ కళ్లనే పెరికి తీసి నాకిచ్చేవారు
  rationale: ἐξορύσσω లోని బలమైన, స్పష్టమైన దృశ్యాన్ని ‘పెరికి తీసి’ నిలుపుతుంది. ‘కళ్లనే’ వారి అసాధారణమైన అంకితభావాన్ని నొక్కిచెప్పే అతిశయోక్తిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కళ్లను పెరికి ఇవ్వడం అనే మాటను అక్షరార్థ దృశ్యంగా ఉంచాలా, సాధారణ ఔదార్యంగా మృదువుగా చెప్పాలా
  choice: ‘మీ కళ్లనే పెరికి తీసి నాకిచ్చేవారు’ అనే స్పష్టమైన దృశ్యాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘మీరు నాకోసం ఏదైనా ఇచ్చేవారు’ అని సాధారణీకరించడం
  rationale: గ్రీకు పాఠ్యం కళ్లను స్పష్టంగా పేర్కొని బలమైన క్రియను వాడుతుంది. ఇది అతిశయోక్తి కావచ్చు; పౌలు శారీరక స్థితికి సూచన కావచ్చనే అవకాశమూ ఉంది. అనువాదం ఏ వ్యాఖ్యానాన్నీ ఖరారు చేయకుండా మూలంలోని దృశ్యాన్నీ ఉద్రిక్తతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. అలంకారిక ప్రశ్న యొక్క పదును, సాక్ష్య ప్రకటనలోని గంభీరత, కళ్ల గురించిన బలమైన దృశ్యం నిలుపబడ్డాయి.
