id: GAL.4.12
reference: Galatians 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: te
  text: నాలా అవ్వండి[a]. ఎందుకంటే నేను కూడా మీలా ఉన్నాను[b]. సోదరులారా[c], మిమ్మల్ని వేడుకుంటున్నాను. మీరు నాకు ఏ అన్యాయమూ చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నన్ను పోలి అవ్వండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నేను కూడా మీలా అయ్యాను.’ గ్రీకులో ఇక్కడ క్రియ లేదు; సందర్భాన్ని బట్టి ‘ఉన్నాను’ లేదా ‘అయ్యాను’ అని పూరించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ఇక్కడ ‘సోదరులారా’ అనే సంబోధన విశ్వాస సమాజాన్ని ఉద్దేశిస్తుంది; ఇందులో స్త్రీలు కూడా ఉన్నారని భావించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: Γίνεσθε
  choice: అవ్వండి
  rationale: γίνομαι యొక్క వర్తమాన ఆజ్ఞార్థక రూపం ఒక స్థితి లేదా వైఖరిలోకి రావాలనే పిలుపును సూచిస్తుంది. ఆధునిక తెలుగులో ‘అవ్వండి’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὡς ἐγώ
  choice: నాలా
  rationale: ὡς తో ఉన్న పోలికను సంక్షిప్తంగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; గ్రీకులో క్రియ స్పష్టంగా లేకపోయినా సందర్భంలోని భావం నిలుస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఇక్కడ ὅτι విజ్ఞప్తికి కారణాన్ని పరిచయం చేస్తుంది; అందువల్ల కారణార్థకమైన ‘ఎందుకంటే’ సరిపోతుంది.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: నేను కూడా మీలా ఉన్నాను
  rationale: గ్రీకు వాక్యభాగం క్రియలేకుండా సంక్షిప్తంగా ఉంది. ప్రధాన పాఠంలో వర్తమాన స్థితిని సూచించే సహజమైన పూరణను వాడి, ‘మీలా అయ్యాను’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: పుంలింగ బహువచన సంబోధనను రూపపరంగా నిలుపుతుంది. ఇది విశ్వాస సమాజమంతటికీ వర్తించే అవకాశం పాదసూచికలో వివరించబడింది.
- source_word: δέομαι ὑμῶν
  choice: మిమ్మల్ని వేడుకుంటున్నాను
  rationale: δέομαι లోని హృదయపూర్వకమైన, గాఢమైన విజ్ఞప్తి భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὐδέν με ἠδικήσατε
  choice: మీరు నాకు ఏ అన్యాయమూ చేయలేదు
  rationale: οὐδέν యొక్క సంపూర్ణ నిరాకరణను, με అనే ప్రత్యక్ష సంబంధాన్ని, ἠδικήσατε యొక్క భూతకాల భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: κἀγὼ ὡς ὑμεῖς అనే క్రియలేని గ్రీకు వాక్యభాగం
  choice: నేను కూడా మీలా ఉన్నాను
  alternative: నేను కూడా మీలా అయ్యాను
  rationale: మూలంలో పునరుక్త క్రియ లేదు; కాబట్టి దానిని ఖచ్చితంగా ‘అయ్యాను’ అని మాత్రమే నిర్ణయించకుండా ప్రధాన పాఠంలో స్థితి భావాన్ని ఉంచి, సందర్భం సూచించే గత మార్పు భావాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ἀδελφοί సంబోధనలో సమగ్ర సమాజాన్ని ఉద్దేశించే భావం
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: గ్రీకు రూపం పుంలింగ బహువచనం. అదే రూపాన్ని ప్రధాన పాఠంలో నిలుపుతూ, గలతీయ విశ్వాస సమాజంలోని స్త్రీ పురుషులందరినీ ఇది ఉద్దేశించే అవకాశం ఉందని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన సంబోధనను వాడాం. మూలంలోని విజ్ఞప్తి తీవ్రతను ‘వేడుకుంటున్నాను’ ద్వారా నిలిపాం. గ్రీకు వాక్యభాగంలోని క్రియాపూరణ అస్పష్టతను ప్రధాన పాఠంలో అతిగా పరిష్కరించకుండా పాదసూచికలో ప్రత్యామ్నాయంగా చూపించాం.
