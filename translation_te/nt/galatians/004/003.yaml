id: GAL.4.3
reference: Galatians 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: te
  text: అలాగే మనమూ, బాలలుగా ఉన్నప్పుడు, లోకపు మూలసూత్రాల[a] కింద బానిసలుగా ఉంచబడి ఉండేవారము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోకపు మూల ఆత్మిక శక్తులు”; గ్రీకు పదం ప్రాథమిక సూత్రాలు లేదా అంశాలను గానీ, విశ్వసంబంధ ఆత్మిక శక్తులను గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: అలాగే
  rationale: ముందటి వచనంలోని వారసుని ఉపమానంతో ఉన్న పోలికను సహజమైన తెలుగులో కొనసాగిస్తుంది.
- source_word: ἡμεῖς
  choice: మనమూ
  rationale: గ్రీకులో స్పష్టంగా ఉన్న ప్రథమ పురుష బహువచనాన్ని, καί ఇచ్చే ‘కూడా’ భావంతో కలిపి వ్యక్తం చేస్తుంది.
- source_word: ὅτε ἦμεν νήπιοι
  choice: బాలలుగా ఉన్నప్పుడు
  rationale: νήπιοι ఇక్కడ అక్షరార్థంగా శిశువులను మాత్రమే కాక, ఇంకా పరిపక్వతకు రాని వారసులను సూచిస్తుంది; ‘బాలలు’ ఆ ఉపమానాన్ని అతిగా న్యాయపరమైన పదజాలం లేకుండా నిలుపుతుంది.
- source_word: ὑπὸ
  choice: కింద
  rationale: అధీనతను సూచించే పౌలు ఉపయోగించిన రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: లోకపు మూలసూత్రాలు
  rationale: στοιχεῖα అనే వివాదాస్పద పదానికి ప్రాథమిక అంశాలు లేదా సూత్రాలు అనే భావాన్ని ప్రధాన పాఠ్యంలో ఇస్తూ, దాని సాధ్యమైన ఆత్మసంబంధ భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: ἤμεθα δεδουλωμένοι
  choice: బానిసలుగా ఉండేవాళ్లం
  rationale: గ్రీకు నిష్క్రియాత్మక బానిసత్వ భావాన్ని బలంగా, సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కాలసందర్భంలో కొనసాగిన గత స్థితినీ తెలియజేస్తుంది.
theological_decisions:
- issue: τὰ στοιχεῖα τοῦ κόσμου అనే పదబంధం యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘లోకపు మూలసూత్రాలు’
  alternative: ‘లోకపు మూలశక్తులు’ లేదా ‘లోకానికి చెందిన ఆత్మిక శక్తులు’
  rationale: ఈ పదబంధం ప్రాథమిక సూత్రాలు/అంశాలను గానీ విశ్వసంబంధ ఆత్మిక శక్తులను గానీ సూచించవచ్చు. ప్రధాన పాఠ్యం ముందున్న బాల్యస్థితి, సంరక్షణ కింద ఉండటం అనే సందర్భానికి సరిపడే అర్థాన్ని ఇస్తుంది; పాదటిప్పణి మరొక నిజమైన అవకాశాన్ని నిలుపుతుంది.
translation_notes:
  register: సాధారణ ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. ‘మూలసూత్రాలు’ అనే పదం ప్రధాన అర్థాన్ని స్పష్టంగా ఉంచగా, పాదటిప్పణి మూలంలోని భావసందిగ్ధతను కాపాడుతుంది.
