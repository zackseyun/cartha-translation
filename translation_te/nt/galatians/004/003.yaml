revisions:
- from: అలాగే మనమూ బాలలుగా ఉన్నప్పుడు, లోకపు మూలసూత్రాల[a] కింద బానిసలుగా ఉండేవాళ్లం.
  to: అలాగే మనమూ, బాలలుగా ఉన్నప్పుడు, లోకపు మూలసూత్రాల[a] కింద బానిసలుగా ఉంచబడి ఉండేవారము.
  rationale: The revision retains the draft’s sound contextual rendering of στοιχεῖα while preserving the Greek passive expression with “ఉంచబడి.” It also uses standard literary-modern Telugu and clarifies, without endorsing, the alternative cosmic-spiritual interpretation in the footnote.
  reviewer_model: gpt-5.6-terra
