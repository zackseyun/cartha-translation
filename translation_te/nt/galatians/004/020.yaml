id: GAL.4.20
reference: Galatians 4:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: te
  text: అయితే, ఇప్పుడు మీ దగ్గర ఉండి, మీతో మాట్లాడే నా తీరును మార్చగలిగితే బాగుండునని కోరుకుంటున్నాను; ఎందుకంటే మీ విషయంలో నేను అయోమయంలో ఉన్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελον
  choice: మార్చుకోగలిగితే బాగుండునని కోరుతున్నాను
  rationale: అసంపూర్ణ భూతకాల రూపం సందర్భంలో ప్రస్తుతం నెరవేరని, సౌమ్యంగా వ్యక్తమైన కోరికను సూచిస్తుంది; తెలుగులో ఈ నిర్మాణం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి మాటల నుంచి స్వల్ప వ్యత్యాసాన్ని, భావమార్పును సూచించే సంధానంగా సహజంగా ఉంది.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: మీ దగ్గర ఉండి
  rationale: గలతీయులతో వ్యక్తిగతంగా సమక్షంలో ఉండాలనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἄρτι
  choice: ఇప్పుడే
  rationale: క్షణికమైన తక్షణత్వాన్ని, పౌలు కోరికలోని ఆవశ్యకతను నిలుపుతుంది.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: నా మాట్లాడే తీరును మార్చుకోగలిగితే
  rationale: φωνή అక్షరార్థంగా ‘స్వరం/గొంతు’ అయినా, ఈ సందర్భంలో సంబోధించే తీరు లేదా ధోరణిని సూచిస్తుంది; ప్రధాన పాఠ్యంలో సహజార్థాన్ని ఇచ్చి అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: పౌలు కోరికకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: ἀποροῦμαι
  choice: నాకు ఏమి చేయాలో తోచడం లేదు
  rationale: ఆలోచనలో చిక్కుకొని, ఎలా వ్యవహరించాలో తెలియకపోవడం అనే ἀπορέω భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కేవలం సందేహంగా దాన్ని కుదించదు.
- source_word: ἐν ὑμῖν
  choice: మీ విషయంలో
  rationale: గలతీయులకు సంబంధించిన విషయంలో పౌలు అయోమయంలో ఉన్నాడనే సంబంధార్థాన్ని సహజంగా తెలుపుతుంది; అక్షరార్థమైన ‘మీలో’ తెలుగులో అపార్థానికి దారితీయవచ్చు.
theological_decisions:
- issue: φωνή అనే పదానికి సందర్భంలోని అర్థం
  choice: పౌలు తన సంబోధనా తీరును లేదా ధోరణిని మార్చాలని కోరుతున్నాడు.
  alternative: పౌలు తన భౌతిక గొంతు లేదా స్వరధ్వనిని మార్చాలని కోరుతున్నాడు.
  rationale: తక్షణ సందర్భం మందలింపు, విజ్ఞప్తి, పాస్టరల్ ఆందోళనలకు సంబంధించినది. కాబట్టి ప్రత్యక్షంగా ఉన్నప్పుడు వారితో వేరే రీతిలో మాట్లాడగలననే భావం సహజం; అయినా అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: ἀποροῦμαι యొక్క తీవ్రత
  choice: వారి విషయంలో ఏమి చేయాలో తోచని స్థితి
  alternative: వారి గురించి కేవలం సందేహపడటం లేదా ఆశ్చర్యపడటం
  rationale: ఈ క్రియ అయోమయం, దారి తోచకపోవడం, చిక్కులో పడటం వంటి బలమైన భావాన్ని కలిగి ఉంది. అనవసరమైన సిద్ధాంత నిర్ధారణ లేకుండా ఆ పాస్టరల్ ఉద్విగ్నతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పౌలు యొక్క తక్షణ కోరికను, పాస్టరల్ ఆందోళనను సహజంగా వ్యక్తం చేస్తూ, φωνή లోని అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
