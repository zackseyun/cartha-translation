id: GAL.4.1
reference: Galatians 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: te
  text: నేను చెప్పేదేమిటంటే, వారసుడు బాలుడిగా[a] ఉన్నంతకాలం, అతడు అన్నిటికీ యజమాని అయినప్పటికీ దాసునికి ఏ మాత్రం భిన్నంగా ఉండడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇంకా యుక్తవయస్సు రానివాడిగా.’ గ్రీకు νήπιος చిన్నబిడ్డను సూచించగలదు; ఈ సందర్భంలో అది చట్టపరంగా ఇంకా తగిన వయస్సుకు చేరని వారసుని భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: నేను చెప్పేది ఇదే
  rationale: δέ సూచించే స్వల్ప అనుసంధానాన్ని తెలుగులో సహజంగా ఉంచుతూ, λέγω పరిచయం చేసే వివరణను స్పష్టంగా తెలియజేస్తుంది; మూలంలో లేని కాలార్థక ‘ఇప్పుడు’ను చేర్చదు.
- source_word: ἐφ’ ὅσον χρόνον
  choice: ఉన్నంతకాలం
  rationale: ఒక పరిమితి వరకు కొనసాగే కాలవ్యవధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ὁ κληρονόμος
  choice: వారసుడు
  rationale: ఆస్తి లేదా హక్కును వారసత్వంగా పొందే వ్యక్తికి సాధారణంగా వాడే స్పష్టమైన తెలుగు పదం.
- source_word: νήπιός
  choice: బాలుడిగా
  rationale: νήπιος శిశువును లేదా ఇంకా యుక్తవయస్సు రాని బాలుణ్ణి సూచించగలదు. ఈ వారసత్వ ఉపమానంలో వయస్సు రాని స్థితి ప్రధానమైనా, పాఠ్యంలో అతిగా న్యాయపరమైన పదాన్ని వాడకుండా ‘బాలుడు’ సహజంగా ఉంటుంది.
- source_word: οὐδὲν διαφέρει
  choice: ఏ విషయంలోనూ భిన్నంగా ఉండడు
  rationale: ప్రయోజనాత్మకంగా ఎలాంటి తేడా లేదనే మూల భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: δούλου
  choice: దాసునికంటే
  rationale: δοῦλος ఇక్కడ స్వేచ్ఛలేని, మరొకరి అధికారంలో ఉన్న వ్యక్తిని సూచిస్తుంది. ‘దాసుడు’ ఆ బంధిత స్థితి బలాన్ని ‘సేవకుడు’ కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: κύριος πάντων ὤν
  choice: అన్నిటికీ యజమానియై ఉన్నా
  rationale: ఇక్కడ κύριος దైవ బిరుదు కాక, సొంతదనం లేదా అధికారాన్ని సూచిస్తుంది. ‘ఉన్నా’ కృదంతంలోని వ్యతిరేకతను సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: పౌలు ఉపమానంలో δοῦλος అనువాదం
  choice: దాసుడు
  alternative: సేవకుడు
  rationale: పౌలు చేస్తున్న పోలికలో బంధిత స్థితి, స్వతంత్ర అధికారం లేకపోవడం కీలకం. అందువల్ల ‘దాసుడు’ మూలంలోని సామాజిక-న్యాయ బలాన్ని నిలుపుతుంది; ‘సేవకుడు’ ఆ బలాన్ని తగ్గించవచ్చు.
- issue: κύριος πάντων యొక్క భావం
  choice: అన్నిటికీ యజమాని
  alternative: అన్నిటికీ ప్రభువు
  rationale: సందర్భం వారసత్వ ఆస్తిపై హక్కును గురించి ఉంది; కాబట్టి దైవ బిరుదుగా అపార్థం కానివిధంగా ‘యజమాని’ సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. వారసత్వ ఉపమానంలోని న్యాయపరమైన నేపథ్యాన్ని అతిగా సాంకేతిక పదజాలం లేకుండా వ్యక్తపరచింది.
