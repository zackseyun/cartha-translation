  rationale: ‘మీతో’ను ‘మీకు’గా మార్చి, సత్యవచనానికి గ్రహీతలను సూచించే గ్రీకు దత్తివిభక్తి భావాన్ని స్పష్టంగా ప్రతిఫలింపజేశాం. ప్రత్యామ్నాయ విస్తృత అర్థాన్ని పాదటిప్పణిలో నిలుపుకున్నాం.
