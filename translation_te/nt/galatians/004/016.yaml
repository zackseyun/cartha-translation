  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε ἐχθρὸς ὑμῶν γέγονα ἀληθεύων ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/016.yaml
  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: te
  text: అయితే, మీకు నిజం చెప్పడం వల్ల నేను మీ శత్రువునయ్యానా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: అయితే
  rationale: ముందున్న వాదన నుంచి వెలువడే ఆశ్చర్యభరితమైన ప్రశ్నకు సహజమైన అన్వయాన్ని కల్పిస్తుంది; సందర్భంలో ‘కాబట్టి’ కంటే తెలుగు వాక్చాతుర్యానికి ‘అయితే’ మరింత సహజం.
- source_word: ἐχθρὸς ὑμῶν
  choice: మీకు శత్రువు
  rationale: ἐχθρός‌ను స్పష్టమైన, సాధారణ తెలుగు పదమైన ‘శత్రువు’గా అనువదిస్తూ, సంబంధాన్ని సూచించే ὑμῶν‌ను సహజమైన తెలుగు ప్రయోగంలో ‘మీకు’గా వ్యక్తం చేసింది.
- source_word: γέγονα
  choice: అయ్యానా
  rationale: γίνομαι పరిపూర్ణ కాలరూపం గతంలో సంభవించిన మార్పుతో ఏర్పడిన ప్రస్తుత స్థితిని సూచిస్తుంది; ప్రశ్నలోని ‘అయ్యానా’ ఈ ఫలిత స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: ἀληθεύων ὑμῖν
  choice: మీతో నిజం మాట్లాడడం వల్ల
  rationale: ఈ కృదంతం వారితో సత్యం చెప్పడాన్ని లేదా నిజాయితీగా మాట్లాడడాన్ని సూచించగలదు. ‘మీతో నిజం మాట్లాడడం వల్ల’ సందర్భంలోని సమాచారాత్మక భావాన్ని సహజంగా అందిస్తూ, కారణం/సాధనం అనే సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పౌలు వాడిన ἀληθεύων భావం
  choice: గలతీయులతో నిజం మాట్లాడడం వల్ల తాను వారికి శత్రువుగా మారాడా అని పౌలు ప్రశ్నిస్తున్నాడు.
  alternative: వారి పట్ల సాధారణంగా నిజాయితీగా ఉండడం వల్ల తాను వారికి శత్రువయ్యాడా అని పౌలు ప్రశ్నిస్తున్నాడు.
  rationale: సమీప సందర్భంలో పౌలు వారికి నేరుగా చేసిన హితబోధ, విజ్ఞప్తి ప్రధానంగా ఉన్నాయి. అందువల్ల ‘నిజం మాట్లాడడం’ సందర్భానికి తగినది; అయితే గ్రీకు క్రియలోని ‘నిజాయితీగా మాట్లాడడం’ అనే విస్తృత భావాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపాన్ని వాడాం. ‘శత్రువునయ్యానా’ కంటే సాధారణ పాఠకులకు సులభంగా చదవబడే ‘శత్రువునయ్యానా’ సంధిరూపాన్ని ప్రధాన వాక్యంలో ఉపయోగించాం.
