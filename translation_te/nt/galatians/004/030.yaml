id: GAL.4.30
reference: Galatians 4:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: te
  text: అయితే లేఖనం ఏమి చెబుతోంది? “బానిస స్త్రీని, ఆమె కుమారుణ్ణి వెళ్లగొట్టు.”[a][b] ఎందుకంటే బానిస స్త్రీ కుమారుడు స్వతంత్రురాలి కుమారునితో కలిసి వారసత్వాన్ని ఎంతమాత్రమూ పొందడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బానిస స్త్రీ’ అని అనువదించిన గ్రీకు పదం స్త్రీ బానిసను సూచిస్తుంది. ఈ భాగంలో బానిసత్వం–స్వాతంత్ర్యం మధ్య వ్యత్యాసం ప్రధానమైనది కాబట్టి ఈ పదాన్ని ఉపయోగించాం.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాట ఆదికాండము 21:10ను ప్రతిధ్వనింపజేస్తుంది.
    reason: cross_reference
  - marker: c
    text: ‘ఎంతమాత్రమూ పొందడు’ అనే మాట వెనుక గ్రీకులో బలమైన నిరాకరణ ఉంది; ‘ఎట్టి పరిస్థితిలోనూ పొందడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందటి వాదనకు భిన్నంగా లేఖనపు తీర్పును ప్రవేశపెట్టే వ్యతిరేక సంధానాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τί λέγει ἡ γραφή
  choice: లేఖనం ఏమి చెబుతోంది?
  rationale: వర్తమాన కాలంలోని వ్యక్తీకృత ఉల్లేఖన సూత్రాన్ని నిలుపుతుంది; ‘లేఖనం’ ఇక్కడ అధికారిక పవిత్రలేఖనాన్ని సూచిస్తుంది.
- source_word: Ἔκβαλε
  choice: వెళ్లగొట్టు
  rationale: ἐκβάλλω లోని బలమైన బహిష్కరణ భావాన్ని ‘పంపివేయి’ కంటే స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: παιδίσκην
  choice: దాసిగా ఉన్న స్త్రీని
  rationale: ఈ సందర్భంలో బానిసత్వం–స్వాతంత్ర్యం వ్యత్యాసం ప్రధానమైనందున, ఆమె బద్ధ స్థితిని స్పష్టంగా చూపుతుంది; ‘దాసి’కి ఉండగల సాధారణ సేవకురాలు అనే మృదువైన అర్థాన్ని తగ్గిస్తుంది.
- source_word: υἱὸν αὐτῆς
  choice: ఆమె కుమారుణ్ణి
  rationale: గ్రీకు స్వామ్య నిర్మాణాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: ఎందుకంటే ... వారసత్వాన్ని ఎంతమాత్రమూ పొందడు
  rationale: οὐ μή తో కూడిన బలమైన నిరాకరణను ‘ఎంతమాత్రమూ ... పొందడు’ ద్వారా సమకాలీన తెలుగులో నిలుపుతుంది.
- source_word: μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας
  choice: స్వతంత్రురాలి కుమారునితో కలిసి
  rationale: μετά యొక్క సహభాగిత భావాన్ని ‘తో కలిసి’ తెలియజేస్తుంది; τῆς ἐλευθέρας అనే విశేషణాత్మక నామవాచకాన్ని సహజంగా ‘స్వతంత్రురాలు’గా అందిస్తుంది.
theological_decisions:
- issue: పౌలు ఉపయోగించిన παιδίσκη పదంలో దాస్యస్థితి
  choice: దాసిగా ఉన్న స్త్రీ
  alternative: దాసి / పనిపిల్ల
  rationale: చుట్టుపక్కల భాగంలోని దాస్యం–స్వాతంత్ర్యం వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతూ, ఆధునిక పాఠకునికి ఆ స్త్రీ బద్ధ స్థితిని తెలియజేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: οὐ γὰρ μὴ κληρονομήσει లోని నిర్దిష్టమైన నిరాకరణ
  choice: వారసత్వాన్ని ఎంతమాత్రమూ పొందడు
  alternative: వారసత్వాన్ని పొందడు / ఎన్నటికీ వారసుడు కాడు
  rationale: గ్రీకులోని οὐ μή బలాన్ని కాపాడుతుంది; ‘ఎన్నటికీ’ వల్ల కలగగల కాలసంబంధ విస్తరణను అనవసరంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘లేఖనం,’ ‘వారసత్వం,’ ‘స్వతంత్రురాలు’ వంటి పదాలు సందర్భంలోని న్యాయ–కుటుంబ మరియు దాస్యం–స్వాతంత్ర్యం భావాలను కాపాడుతాయి. ఉల్లేఖనంలోని ఆజ్ఞ యొక్క కఠినతను ‘వెళ్లగొట్టు’ నిలుపుతుంది.
