revisions:
- from: ఎందుకంటే, అబ్రాహాముకు ఇద్దరు కుమారులు ఉన్నారని వ్రాయబడి ఉంది—ఒకడు దాసి ద్వారా, మరొకడు స్వతంత్రురాలి ద్వారా.
  to: 'ఎందుకనగా, అబ్రాహాముకు ఇద్దరు కుమారులు ఉన్నారని వ్రాయబడి ఉంది: వారిలో ఒకడు దాసికి పుట్టినవాడు, మరొకడు స్వతంత్రురాలికి పుట్టినవాడు.'
  rationale: The revision changes only the Telugu expression of ἐκ so that it denotes maternal origin rather than means. It retains the written-Scripture formula, causal connection, two sons, and the slave woman/free woman contrast. No footnote is required, since the principal lexical and contextual contrast is explicit in the translation.
