id: GAL.4.22
reference: Galatians 4:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: te
  text: 'ఎందుకనగా, అబ్రాహాముకు ఇద్దరు కుమారులు ఉన్నారని వ్రాయబడి ఉంది: వారిలో ఒకడు దాసికి పుట్టినవాడు, మరొకడు స్వతంత్రురాలికి పుట్టినవాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: వ్రాయబడి ఉంది
  rationale: లేఖనాన్ని పరిచయం చేసే గ్రీకు పూర్ణ వర్తమాన కర్మణి సూత్రప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, వ్రాత యొక్క కొనసాగుతున్న ప్రామాణికతను నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ వాక్యం ఆధారాన్ని ఇస్తున్న అనుసంధాన భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: వ్రాయబడిన విషయాన్ని పరిచయం చేసే సహజ తెలుగు ఉద్ధరణార్థక రూపం.
- source_word: Ἀβραὰμ
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: δύο υἱοὺς
  choice: ఇద్దరు కుమారులు
  rationale: υἱούς యొక్క పురుషలింగ నిర్దిష్టతను కాపాడుతుంది; వ్యక్తులకు సహజమైన తెలుగు సంఖ్యావాచకాన్ని ఉపయోగిస్తుంది.
- source_word: ἔσχεν
  choice: ఉన్నారు
  rationale: తండ్రి-కుమారుల సంబంధాన్ని సందర్భానుసారంగా సహజంగా తెలియజేస్తుంది; ‘కన్నాడు’ వంటి మరింత వ్యాఖ్యానాత్మక రూపాన్ని నివారిస్తుంది.
- source_word: ἕνα ... καὶ ἕνα
  choice: ఒకడు ... మరొకడు
  rationale: గ్రీకులోని సమతుల్య సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐκ
  choice: ద్వారా
  rationale: ఈ వంశసంబంధ సందర్భంలో మాతృత్వ మూలాన్ని తెలియజేస్తూ, ‘నుండి’ కంటే తెలుగులో సహజంగా ఉంటుంది.
- source_word: παιδίσκης
  choice: దాసి
  rationale: బానిసత్వ లేదా సేవకస్థితిలో ఉన్న స్త్రీని సూచిస్తుంది; తరువాతి వాదనలోని దాసత్వం–స్వాతంత్ర్యం వ్యత్యాసాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ἐλευθέρας
  choice: స్వతంత్రురాలు
  rationale: స్వేచ్ఛా సామాజిక స్థితిగల స్త్రీని సూచించే substantival adjective‌ను ‘దాసి’కి సమాంతరంగా, సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: పౌలు రూపకాల వాదనలో కేంద్రమైన సామాజిక స్థితి వ్యత్యాసం
  choice: παιδίσκη/ἐλευθέραలను ‘దాసి/స్వతంత్రురాలు’గా అనువదించడం
  alternative: ‘పనిపిల్ల/స్వతంత్రురాలు’ లేదా ‘సేవకురాలు/స్వతంత్రురాలు’
  rationale: చుట్టుపక్కల సందర్భంలో పౌలు వాదన దాసత్వం మరియు స్వాతంత్ర్యం మధ్య వ్యత్యాసంపై ఆధారపడుతుంది. ‘దాసి’ మూలపదంలోని సేవకత్వం/బానిసత్వ పరిధిని, అలాగే ఆ వ్యత్యాసాన్ని, అదనపు సిద్ధాంతార్థం చేర్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. మూలంలోని కారణసూచక అనుసంధానం మరియు దాసి–స్వతంత్రురాలి సమాంతర వ్యత్యాసం నిలుపబడ్డాయి.
