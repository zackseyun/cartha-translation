review_pass:
  verdict: revise
  source_fidelity: γέγραπται, γάρ, δύο υἱούς, and the balanced ἕνα … καὶ ἕνα structure are substantially represented. However, ‘దాసి ద్వారా/స్వతంత్రురాలి ద్వారా’ normally means ‘through the slave woman/free woman’ and can suggest agency or means rather than the maternal relationship expressed by ἐκ in this genealogical context. ‘దాసికి/స్వతంత్రురాలికి పుట్టినవాడు’ states that relationship directly.
  naturalness: The draft is clear modern Telugu, but the revised maternal phrasing is more idiomatic and unambiguous. ‘ఎందుకనగా’ suitably retains the connective and scriptural register without becoming archaic.
  terminology: ‘దాసి’ and ‘స్వతంత్రురాలు’ preserve the salient social-status contrast of παιδίσκη and ἐλευθέρα. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: ‘దాసి ద్వారా, మరొకడు స్వతంత్రురాలి ద్వారా’ renders maternal origin as instrumentality/mediation.
    rationale: In Telugu, ద్వారా primarily marks ‘through/by means of.’ The Greek ἐκ here identifies each son in relation to his mother. Recasting as ‘దాసికి/స్వతంత్రురాలికి పుట్టినవాడు’ preserves that relation and the parallel contrast.
  revised_text: 'ఎందుకనగా, అబ్రాహాముకు ఇద్దరు కుమారులు ఉన్నారని వ్రాయబడి ఉంది: వారిలో ఒకడు దాసికి పుట్టినవాడు, మరొకడు స్వతంత్రురాలికి పుట్టినవాడు.'
  revised_footnotes: []
  revision_rationale: The revision changes only the Telugu expression of ἐκ so that it denotes maternal origin rather than means. It retains the written-Scripture formula, causal connection, two sons, and the slave woman/free woman contrast. No footnote is required, since the principal lexical and contextual contrast is explicit in the translation.
