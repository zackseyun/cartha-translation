- from: అయితే, మంచి ఉద్దేశంతో మిమ్మల్ని ఎల్లప్పుడూ ఆసక్తిగా వెదకడం మంచిదే[b][a]; నేను మీతో ఉన్నప్పుడు మాత్రమే కాదు.
  to: అయితే, మంచి ఉద్దేశంతో మిమ్మల్ని ఆసక్తిగా వెదకడం ఎల్లప్పుడూ మంచిదే[b][a]—నేను మీతో ఉన్నప్పుడు మాత్రమే కాదు.
