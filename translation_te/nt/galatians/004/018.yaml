id: GAL.4.18
reference: Galatians 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: te
  text: అయితే, మంచి ఉద్దేశంతో మిమ్మల్ని ఆసక్తిగా వెదకడం ఎల్లప్పుడూ మంచిదే[b][a]—నేను మీతో ఉన్నప్పుడు మాత్రమే కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మంచి విషయంలో ఉత్సాహంగా ఉండడం” / “ఆసక్తి చూపడం.” ζηλοῦσθαι అనే గ్రీకు క్రియారూపాన్ని వేరే విధంగా కూడా అర్థం చేసుకోవచ్చు; అయితే మునుపటి వచనంలో గలతీయులను ఇతరులు ఆసక్తిగా వెదకడమనే భావంతో ఉన్న వ్యత్యాసానికి కర్మణి అర్థం బాగా సరిపోతుంది.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “మంచి [విషయం]లో.” ఈ మాట మంచి ఉద్దేశంతో లేదా మంచి లక్ష్యం కోసం అని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: మంచిదే
  rationale: క్రియార్థక infinitiveతో విధేయ విశేషణంగా ఉన్నందున, తెలుగులో సహజంగా ‘మంచిదే’ అని ఇచ్చాం.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలో చెప్పిన చెడు ఉద్దేశంతో కూడిన ఆసక్తికి వ్యతిరేకమైన మలుపును సూచిస్తుంది.
- source_word: ζηλοῦσθαι
  choice: మిమ్మల్ని ... ఆసక్తిగా వెదకడం
  rationale: ఇది వర్తమాన కర్మణి infinitive. 17వ వచనంలోని ఇతరులు గలతీయులను ఉత్సాహంగా వెదకడమనే భావానికి అనుసంధానంగా కర్మణి అర్థాన్ని నిలిపాం; తెలుగులో సహజత కోసం ఉద్దేశిత కర్మ ‘మిమ్మల్ని’ స్పష్టంగా చేర్చాం.
- source_word: ἐν καλῷ
  choice: మంచి ఉద్దేశంతో
  rationale: అక్షరార్థంగా ‘మంచి [విషయం]లో’; సందర్భంలో చెడు ఉద్దేశానికి విరుద్ధంగా మంచి ప్రేరణ లేదా లక్ష్యాన్ని సూచిస్తుంది.
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: తర్వాతి ‘నేను మీతో ఉన్నప్పుడు మాత్రమే కాదు’ అనే కాలపరమైన పరిమితితో స్పష్టమైన వ్యత్యాసం కలిగిస్తుంది.
- source_word: καὶ μὴ μόνον
  choice: మాత్రమే కాదు
  rationale: గ్రీకు సముచ్చయ-పరిమితి భావాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: నేను మీతో ఉన్నప్పుడు
  rationale: ἐνతో కూడిన articular infinitive కాలాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం పౌలు సన్నిధి–గైర్హాజరు వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ζηλοῦσθαι యొక్క వాచ్యం మరియు అంతర్లీన కర్త/కర్మ
  choice: 'కర్మణి భావం: ఇతరులు గలతీయులను ఆసక్తిగా వెదకడం'
  alternative: ‘ఉత్సాహంగా ఉండడం’ లేదా ‘ఆసక్తి చూపడం’ అనే మధ్యమ/కర్తరి భావం
  rationale: 17–18 వచనాల్లో ζηλόω పదపునరుక్తి ఉంది. 17వ వచనంలో ఇతరులు గలతీయుల పట్ల చూపే ఆసక్తికి ఇది మంచి ఉద్దేశంతో కూడిన సానుకూల ప్రతిరూపంగా సరిపోతుంది. అయినా గ్రీకు రూపానికి వేరొక అవగాహన సాధ్యమైనందున దాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ζηλοῦσθαι యొక్క కర్మణి భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా చూపేందుకు ‘మిమ్మల్ని ... వెదకడం’ వాడాం; అసలు పాఠ్యంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం. పాదటిప్పణి సూచికలు సంప్రదింపుల పాఠ్యంలో ఉన్న క్రమం ప్రకారం [b][a]గా ఉంచబడ్డాయి.
