  text: ⸀διό, ἀδελφοί, οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: te
  text: కాబట్టి సహోదరులారా[a], మనం బానిస స్త్రీ[b] పిల్లలం కాదు, కానీ స్వతంత్ర స్త్రీ పిల్లలం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహోదర సహోదరీలారా’; గ్రీకులో ‘సహోదరులు’ అని ఉంది. ఈ పదం స్త్రీపురుషులు కలిసిన సమూహాన్ని కూడా ఉద్దేశించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దాసి’; గ్రీకు పదం బానిసగా లేదా సేవకురాలిగా ఉన్న స్త్రీని సూచిస్తుంది. ఇక్కడ పౌలు చెప్పిన రూపకాలంకారంలో ఇది హాగరును శారాతో వ్యతిరేకంగా చూపుతుంది (గలతీయులు 4:21–31).
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: కాబట్టి
  rationale: ముందున్న రూపకాలంకార వాదన నుండి తీసుకున్న ముగింపును సహజమైన తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పదంలోని పురుష బహువచన సంబోధనను నిలుపుతూ, సంఘమంతటినీ ఉద్దేశించే ప్రతినిధి ప్రయోగాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: οὐκ ἐσμὲν
  choice: మనం … పిల్లలం కాదు
  rationale: గ్రీకులో ఉన్న వర్తమానకాల నిరాకరణను అదనపు కాలభావం చేర్చకుండా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παιδίσκης
  choice: బానిస స్త్రీ
  rationale: ఈ సందర్భంలో హాగరు యొక్క బానిస స్థితి, స్వతంత్ర స్త్రీతో ఉన్న వ్యత్యాసానికి కేంద్రం; అందువల్ల మృదువైన ‘దాసి’ కంటే ‘బానిస స్త్రీ’ ఆ వ్యత్యాసాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τέκνα
  choice: పిల్లలం
  rationale: లింగ సమావిష్టమైన ‘పిల్లలు/సంతానం’ భావాన్ని సహజమైన ప్రథమ పురుష బహువచన రూపంలో అందిస్తుంది.
- source_word: ἀλλὰ
  choice: కాదు;
  rationale: తెలుగులో ‘కాదు; …’ నిర్మాణం రెండు గుర్తింపుల మధ్య గట్టి వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది; రెండవ భాగంలో భావిత ‘కాని’ని పునరుక్తి చేయాల్సిన అవసరం లేదు.
- source_word: τῆς ἐλευθέρας
  choice: స్వతంత్ర స్త్రీ
  rationale: స్త్రీలింగ విశేషణం నామవాచకంగా వాడబడి శారాను సూచిస్తుంది; ‘స్వతంత్ర స్త్రీ’ స్త్రీ సూచననూ, బానిసత్వానికి వ్యతిరేకమైన స్థితినీ నిలుపుతుంది.
theological_decisions:
- issue: హాగరు–శారా రూపకాలంకారంలోని బానిసత్వం–స్వేచ్ఛ వ్యత్యాసాన్ని ఎంత స్పష్టంగా అనువదించాలి
  choice: ‘బానిస స్త్రీ … స్వతంత్ర స్త్రీ’ అని ప్రధాన పాఠ్యంలో ఇవ్వడం
  alternative: ‘దాసి … స్వతంత్రురాలు’
  rationale: పౌలు వాదనలో బానిసత్వం మరియు స్వేచ్ఛ మధ్య వ్యత్యాసం కీలకం. ఈ అనువాదం పాఠ్యంలో ఉన్న వ్యత్యాసాన్ని పదునుగా నిలుపుతుంది కానీ అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: మిశ్రమ సమూహాన్ని ఉద్దేశించే ἀδελφοίని ఎలా అనువదించాలి
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’ అని ఉంచి, విస్తృత సూచనను పాదటిప్పణిలో తెలియజేయడం
  alternative: ‘సహోదర సహోదరీలారా’
  rationale: గ్రీకు పదంలోని పురుష బహువచన కుటుంబ సంబోధనను నిలుపుతూ, అది స్త్రీలతో సహా విశ్వాసులందరినీ ఉద్దేశించగలదని పాదటిప్పణి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘పిల్లలం’ అనేది సహజమైన వాడుక; అర్థాన్ని కాపాడుతూ అనవసరమైన గ్రాంథికతను నివారించింది.
