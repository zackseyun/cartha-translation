id: GAL.4.27
reference: Galatians 4:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: te
  text: 'ఎందుకంటే ఇలా రాసి ఉంది: “పిల్లలను కనని సంతానహీనురాలా, సంతోషించు[a]; ప్రసవ వేదన పడని దానా, ఉప్పొంగి బిగ్గరగా కేకవేయి[b]. ఎందుకంటే భర్త ఉన్న స్త్రీ పిల్లలకంటే విడిచిపెట్టబడిన స్త్రీ[c] పిల్లలే ఎక్కువమంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యెషయా 54:1 నుండి ఉల్లేఖనం.
    reason: cross_reference
  - marker: b
    text: లేదా “పేలి కేకవేయి.”
    reason: lexical_alternative
  - marker: c
    text: “విడిచిపెట్టబడిన” అని అనువదించిన పదానికి ఈ రూపకాలంకార సందర్భంలో “ఒంటరిగా ఉన్న,” “పరిత్యజించబడిన,” లేదా “నిర్జనమైన” అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: ఇలా రాసి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే పరిపూర్ణ కర్మణి రూపానికి సహజమైన తెలుగు; రాసిన మాట ఇప్పటికీ అమలులో ఉందనే భావాన్ని నిలుపుతుంది.
- source_word: Εὐφράνθητι
  choice: సంతోషించు
  rationale: ఆనందించమనే ఆజ్ఞను స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: στεῖρα ἡ οὐ τίκτουσα
  choice: పిల్లలను కనని సంతానహీనురాలా
  rationale: స్త్రీని నేరుగా సంబోధిస్తున్న substantival adjectiveను, దానిని వివరించే present participleను రెండింటినీ నిలుపుతుంది; అవమానకరంగా వినిపించగల పాత పదాన్ని నివారిస్తుంది.
- source_word: ῥῆξον καὶ βόησον
  choice: ఆనందంతో గొంతెత్తి కేకవేయి
  rationale: ఆకస్మికంగా ఉప్పొంగి బిగ్గరగా పలకడమనే సంయుక్త భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: ప్రసవ వేదన పడని దానా
  rationale: ὠδίνω సూచించే ప్రసవ వేదనను స్పష్టంగా ఉంచి మాతృత్వ రూపకాన్ని కాపాడుతుంది.
- source_word: τῆς ἐρήμου
  choice: విడిచిపెట్టబడిన స్త్రీ
  rationale: ఈ యెషయా ఉల్లేఖనంలోని వ్యక్తీకృత సందర్భంలో ‘నిర్జనమైన’ అనే భౌగోళిక భావం కంటే ఒంటరిగా లేదా పరిత్యజించబడి ఉండడమనే భావాన్ని తెలియజేస్తుంది.
- source_word: πολλὰ τὰ τέκνα ... μᾶλλον ἢ
  choice: పిల్లలే ఎక్కువమంది
  rationale: సంతానం సంఖ్యను గురించిన తులనను సహజమైన తెలుగు వాక్య నిర్మాణంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: భర్త ఉన్న స్త్రీ
  rationale: ἀνήρకు సందర్భానుసారమైన ‘భర్త’ అర్థాన్ని తీసుకొని, మూలంలోని వివరణాత్మక తులన నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: గలతీయులు 4లో పాత నిబంధన ఉల్లేఖనం మరియు రూపకాలంకార సందర్భం
  choice: యెషయా 54:1లోని ప్రవచనాత్మక చిత్రణను నేరుగా అనువదించి, పౌలు సందర్భంలో ఇచ్చే వివరణను ఈ వచన పదాల్లో ముందుగానే చేర్చలేదు.
  alternative: ‘పైనున్న యెరూషలేము’ లేదా శారాను సూచించేలా ఉల్లేఖనంలోనే మరింత స్పష్టత చేర్చడం.
  rationale: ఇది స్పష్టమైన లేఖన ఉల్లేఖనం. దాని స్వంత చిత్రణను నిలిపి, సందర్భంలోని పౌలు వాదనే దాని అన్వయాన్ని తెలియజేయనివ్వడం మూలానికి నమ్మకమైన విధానం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రవచన శైలిని ఉపయోగించాం. ‘గొడ్రాలు’ వంటి కఠినంగా లేదా అవమానకరంగా వినిపించగల పదానికి బదులుగా ‘సంతానహీనురాలు’ ఎంచుకున్నాం; ఉల్లేఖనంలోని సమాంతర నిర్మాణం మరియు మాతృత్వ రూపకం నిలుపబడ్డాయి.
