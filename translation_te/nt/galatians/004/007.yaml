revisions:
- from: కాబట్టి నీవు ఇక బానిసవు కాదు, కుమారుడివి[a]. నీవు కుమారుడివైతే, దేవుని ద్వారా వారసుడివి కూడా[b].
  to: కాబట్టి నీవు ఇక బానిసవు కాదు, కుమారుడివి[a]; కుమారుడివైతే, దేవుని మూలంగా వారసుడివి కూడా[b].
