id: GAL.4.7
reference: Galatians 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: te
  text: కాబట్టి నీవు ఇక బానిసవు కాదు, కుమారుడివి[a]; కుమారుడివైతే, దేవుని మూలంగా వారసుడివి కూడా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బిడ్డ” అని కూడా అనువదించవచ్చు. అయితే గ్రీకులో “కుమారుడు” అని ఉంది; అది ఈ భాగంలోని దత్తత, వారసత్వ తర్కాన్ని నిలుపుతుంది. ఈ హోదా విశ్వాసులందరికీ వర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో “క్రీస్తు ద్వారా దేవుని వారసుడు” (లేదా “మెస్సీయ ద్వారా దేవుని వారసుడు”) అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐκέτι
  choice: ఇక ... కాదు
  rationale: స్థితిలో వచ్చిన మార్పును సూచించే కాలార్థక నిరాకరణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἶ
  choice: నీవు ... వి
  rationale: గ్రీకులోని రెండవ పురుష ఏకవచనాన్ని నేరుగా నిలుపుతుంది.
- source_word: δοῦλος
  choice: బానిస
  rationale: ఇక్కడ స్వేచ్ఛలేని బంధిత స్థితిని కుమారత్వంతో వ్యతిరేకిస్తున్నారు; అందువల్ల సేవకుడు కంటే బానిస మూలపద బలాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: ἀλλὰ
  choice: కాదు, ...
  rationale: తెలుగు ‘కాదు, ...’ నిర్మాణం పూర్వస్థితి మరియు ప్రస్తుత కుమారత్వం మధ్య వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
- source_word: υἱός
  choice: కుమారుడు
  rationale: దత్తత, కుమారత్వం, వారసత్వం అనే సందర్భ తర్కాన్ని నిలుపుతుంది; ఈ హోదా విశ్వాసులందరికీ వర్తిస్తుందనే విషయాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: εἰ δὲ
  choice: '... అయితే'
  rationale: వాదనలో తదుపరి నిర్ధారణకు ఆధారమైన షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: కుమారత్వానికి తోడుగా వారసత్వ హోదా కూడా ఉందని తెలియజేస్తుంది.
- source_word: κληρονόμος
  choice: వారసుడు
  rationale: స్వాస్థ్యాన్ని పొందే వ్యక్తిని సూచించే సాధారణ తెలుగు పదం; పౌలు చెప్పే దత్తత-వారసత్వ భావానికి సరిపోతుంది.
- source_word: διὰ θεοῦ
  choice: దేవుని ద్వారా
  rationale: SBLGNT పాఠంలోని διά + షష్ఠీ విభక్తి నిర్మాణాన్ని నేరుగా నిలుపుతూ, ఈ వారసత్వ హోదా దేవుని ద్వారా కలిగిందని తెలియజేస్తుంది.
theological_decisions:
- issue: υἱός లోని లింగసూచక కుమారత్వ భాష
  choice: కుమారుడు
  alternative: బిడ్డ
  rationale: గ్రీకు పదం పురుష ఏకవచనంలో ఉంది; ఈ సందర్భంలో కుమారునికి సంబంధించిన దత్తత మరియు వారసత్వ హక్కు వాదనలో ప్రధానమైనది. అయినా ఈ హోదా స్త్రీపురుషులైన విశ్వాసులందరికీ వర్తిస్తుందని పాదసూచికలో స్పష్టం చేయబడింది.
- issue: వచనాంతంలోని పాఠాంతరం
  choice: దేవుని ద్వారా
  alternative: క్రీస్తు ద్వారా దేవుని వారసుడు / మెస్సీయ ద్వారా దేవుని వారసుడు
  rationale: ఇచ్చిన SBLGNT మూలపాఠం διὰ θεοῦ అని చదువుతుంది. ప్రధాన పాఠం దానినే అనుసరిస్తుంది; ఇతర ప్రాచీన ప్రతుల పాఠాలను పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఏకవచన సంబోధన వాడబడింది. ‘బానిస’ బంధిత స్థితి యొక్క బలాన్ని, ‘కుమారుడు—వారసుడు’ పదజాలం మూలంలోని న్యాయపరమైన మరియు కుటుంబసంబంధ తర్కాన్ని నిలుపుతాయి.
