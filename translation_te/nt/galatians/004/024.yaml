id: GAL.4.24
reference: Galatians 4:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: te
  text: ఈ సంగతులు రూపకంగా వ్యాఖ్యానించబడుతున్నాయి[a]. ఎందుకంటే ఈ స్త్రీలే రెండు నిబంధనలు. ఒకటి సీనాయి పర్వతం నుండి వచ్చి బానిసత్వంలోకి పిల్లలను కంటుంది[b]; అదే హాగరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంగతులు రూపకంగా చెప్పబడుతున్నాయి,” లేదా “ఈ సంగతులు ఒక రూపకం.” గ్రీకు పదబంధం పౌలు ముందున్న వృత్తాంతాన్ని రూపకంగా ఉపయోగిస్తున్నాడని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బానిసత్వం కోసం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: ఈ సంగతులకు
  rationale: నపుంసక బహువచన సర్వనామం ముందున్న హాగరు–శారా వృత్తాంతంలోని సంగతులను తిరిగి సూచిస్తుంది; తెలుగులో తరువాతి కర్మణి ప్రయోగంతో సహజంగా కలిసేందుకు చతుర్థీ విభక్తి వాడబడింది.
- source_word: ἀλληγορούμενα
  choice: రూపకాలంకారంగా అర్థం చెప్పబడుతోంది
  rationale: ἐστιν‌తో కూడిన వర్తమాన కర్మణి కృదంతం. పౌలు ముందున్న వృత్తాంతాన్ని రూపకాలంకార పద్ధతిలో వివరిస్తున్నాడనే భావాన్ని ఇస్తుంది; ఆ వృత్తాంతం చారిత్రకమైనది కాదని ఈ అనువాదం నిర్ణయించదు.
- source_word: αὗται
  choice: ఈ స్త్రీలే
  rationale: స్త్రీలింగ బహువచన సూచక సర్వనామం ముందుగా ప్రస్తావించిన ఇద్దరు స్త్రీలను సూచిస్తుంది. ‘స్త్రీలు’ అని స్పష్టపరచడం తెలుగులో సహజం; ‘ఏ’ నొక్కిచెప్పే భావాన్ని నిలుపుతుంది.
- source_word: διαθῆκαι
  choice: నిబంధనలు
  rationale: సీనాయి నేపథ్యంలోని రక్షణ-చరిత్ర సంబంధమైన ఒడంబడికలను సూచించే స్థిరమైన తెలుగు బైబిలు పదం.
- source_word: ἀπὸ ὄρους Σινᾶ
  choice: సీనాయి కొండనుండి వచ్చినది
  rationale: ἀπό సూచించే మూలాన్ని స్పష్టంగా తెలియజేస్తూ, తెలుగులో అసంపూర్ణంగా అనిపించకుండా ‘వచ్చినది’ జోడించబడింది.
- source_word: εἰς δουλείαν
  choice: బానిసత్వంలోకి
  rationale: εἰς‌లోని దిశ లేదా ఫలిత భావాన్ని ‘లోకి’ నిలుపుతుంది; δουλεία యొక్క బంధిత స్థితిని ‘బానిసత్వం’ బలంగా తెలియజేస్తుంది.
- source_word: γεννῶσα
  choice: పిల్లలను కంటుంది
  rationale: స్త్రీలింగ ఏకవచన వర్తమాన కృదంతంలోని తల్లి-ప్రసవ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: అదే హాగరు
  rationale: నిబంధనను స్త్రీ అయిన హాగరుతో నేరుగా గుర్తించే రూపకాలంకార సమీకరణను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: హాగరు–శారా వృత్తాంతాన్ని పౌలు రూపకాలంకారంగా ఉపయోగించే స్వభావం
  choice: వృత్తాంతానికి రూపకాలంకారంగా అర్థం చెప్పబడుతోందని అనువదించడం
  alternative: ఈ సంగతులే ఒక రూపకాలంకారం అని సారాంశీకరించడం
  rationale: ἀλληγορούμενα ఒక వివరణా విధానాన్ని లేదా వాక్చాతుర్య ప్రయోగాన్ని సూచించగలదు. ఈ రూపం ఆదికాండ వృత్తాంతం చారిత్రకతను తిరస్కరించదు; అలాగే పౌలు వాడిన రూపకాలంకార పద్ధతిని దాచదు.
- issue: δουλεία యొక్క భావబలం
  choice: బానిసత్వం
  alternative: దాస్యం లేదా బంధకం
  rationale: రెండు నిబంధనల మధ్య పౌలు చూపే వ్యత్యాసంలో బంధిత అధీనస్థితి ప్రధానమైనది; ‘బానిసత్వం’ ఆ బలాన్ని సాధారణ ఆధునిక పాఠకుడికి స్పష్టంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే బైబిలు సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ‘రూపకాలంకారం,’ ‘నిబంధన,’ ‘బానిసత్వం’ వంటి కీలక భావపదాలు స్పష్టంగా నిలుపబడ్డాయి.
