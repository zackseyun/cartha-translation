translation:
  language: te
  text: మీరు దినాలనూ, నెలలనూ, కాలాలనూ, సంవత్సరాలనూ జాగ్రత్తగా పాటిస్తున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు దినాలను, నెలలను, నియమిత కాలాలను, సంవత్సరాలను పాటిస్తున్నారు.” ఈ జాబితా కాలపట్టికకు సంబంధించిన ఆచరణలను సూచిస్తుంది; καιρούς అనే పదాన్ని “నియమిత కాలాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: దినాలను
  rationale: ἡμέρα యొక్క సాధారణ అర్థమైన ‘దినాలు’నే ఉంచుతుంది; అవి ప్రత్యేక మతపరమైన దినాలని మూలపాఠం నామవాచకంలోనే స్పష్టంగా చెప్పదు.
- source_word: παρατηρεῖσθε
  choice: జాగ్రత్తగా పాటిస్తున్నారు
  rationale: వర్తమానకాల క్రియలో ఉన్న నిరంతర ఆచరణ భావాన్నీ, నియమాలను శ్రద్ధగా గమనించి పాటించే సందర్భార్థాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μῆνας
  choice: నెలలను
  rationale: కాలపట్టికలోని ‘నెలలు’ అనే ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది.
- source_word: καιρούς
  choice: కాలాలను
  rationale: καιρός సూచించే కాలాలు లేదా నిర్ణీత సమయాలు అనే విస్తృత భావాన్ని, వాటిని పండుగలుగా మాత్రమే నిర్ధారించకుండా నిలుపుతుంది.
- source_word: ἐνιαυτούς
  choice: సంవత్సరాలను
  rationale: ἐνιαυτός యొక్క ప్రత్యక్ష అర్థాన్ని ఉంచి, కాల ప్రమాణాల జాబితాను సహజంగా పూర్తిచేస్తుంది.
- source_word: καὶ
  choice: -నూ
  rationale: గ్రీకు వాక్యంలో పదేపదే వచ్చిన καὶ యొక్క సంచయ లయను తెలుగులో సహజమైన సముచ్చయ ప్రత్యయంతో నిలుపుతుంది.
theological_decisions:
- issue: ఈ కాలపట్టిక ఆచరణలను యూదులవిగా లేదా మతపరమైనవిగా ప్రధాన పాఠంలో స్పష్టీకరించాలా
  choice: ‘ప్రత్యేక,’ ‘పవిత్ర,’ లేదా ‘పండుగ’ వంటి విశేషణాలు చేర్చకుండా కాల ప్రమాణాలనే ఉంచడం
  alternative: ‘ప్రత్యేక దినాలను, నెలలను, పండుగ కాలాలను, సంవత్సరాలను’ అని అనువదించడం
  rationale: సందర్భం మతపరమైన కాలపట్టిక ఆచరణను సూచించినా, గ్రీకు వాక్యం కాల ప్రమాణాలను విశేషణాలు లేకుండానే పేర్కొంటుంది. అందువల్ల ప్రధాన పాఠం ఆ అనిర్దిష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘దినాలు’ బైబిలు సందర్భానికి తగిన గంభీరతను ఇస్తుంది; ‘జాగ్రత్తగా పాటిస్తున్నారు’ మూలక్రియలోని శ్రద్ధతో ఆచరించే భావాన్ని అతిశయింపకుండా తెలియజేస్తుంది.
