  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: te
  text: అయితే పైనున్న యెరూషలేము స్వతంత్రురాలు; ఆమె మన తల్లి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది మన తల్లి.” గ్రీకు సంబంధవాచక సర్వనామాన్ని మరింత రూపసామ్యంగా ఇలా అనువదించవచ్చు; అయితే ఈ వచనం యెరూషలేమును తల్లిగా వ్యక్తీకరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనంలోని ప్రస్తుత యెరూషలేముతో ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: ἄνω
  choice: పైనున్న
  rationale: స్థానసంబంధమైన మూల రూపకాన్ని నిలుపుతూ, దానిని కేవలం ‘పరలోకపు’ అని ముందుగానే వ్యాఖ్యానించదు.
- source_word: Ἰερουσαλήμ
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన నామరూపాన్ని అనుసరిస్తుంది.
- source_word: ἐλευθέρα
  choice: స్వతంత్రురాలు
  rationale: బానిస–స్వతంత్రురాలు అనే పరిసర సందర్భంలోని వ్యత్యాసాన్ని, యెరూషలేము యొక్క స్త్రీ వ్యక్తీకరణను తెలుగులో స్పష్టంగా నిలుపుతుంది; మూలంలో లేని ‘స్త్రీ’ అనే నామవాచకాన్ని విడిగా చేర్చదు.
- source_word: ἥτις
  choice: ఆమె
  rationale: యెరూషలేమును తల్లిగా వ్యక్తీకరించినందున తెలుగులో స్త్రీలింగ సర్వనామం సహజంగా ఉంటుంది; గ్రీకు సంబంధవాచక నిర్మాణానికి మరింత రూపసామ్యమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: μήτηρ
  choice: తల్లి
  rationale: పౌలు ఉపయోగించిన మాతృరూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἡμῶν
  choice: మన
  rationale: సమావేశకతను నిర్దిష్టంగా నిర్ణయించకుండా గ్రీకు బహువచన స్వామ్యార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘పైనున్న యెరూషలేము’ యొక్క స్త్రీ వ్యక్తీకరణ
  choice: ‘ఆమె మన తల్లి’ అని వ్యక్తీకరించడం
  alternative: ‘అది మన తల్లి’ లేదా ‘మన తల్లి అయినది’ అని మరింత రూపసామ్యంగా అనువదించడం
  rationale: సారా–హాగరు ఉపమాన సందర్భంలో యెరూషలేము మాతృమూర్తిగా వ్యక్తీకరించబడింది. ‘ఆమె’ ఆ రూపకాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; దానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పైనున్న’ మూలంలోని స్థల రూపకాన్ని నిలుపుతుంది; ‘స్వతంత్రురాలు’ పరిసరంలోని బానిసత్వం–స్వాతంత్ర్యం వ్యత్యాసాన్నీ స్త్రీ వ్యక్తీకరణనూ స్పష్టంగా ఉంచుతుంది.
