source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: te
  text: కానీ, అప్పట్లో శరీరం ప్రకారం పుట్టినవాడు[a] ఆత్మ ప్రకారం పుట్టినవాణ్ణి[b] హింసించేవాడో, ఇప్పుడూ అలాగే ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సాధారణ మానవ విధానంలో పుట్టినవాడు”; అక్షరార్థంగా, “శరీరం ప్రకారం పుట్టినవాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆత్మ ప్రకారం ఉన్నవాణ్ణి”; గ్రీకులో రెండవ భాగంలో “పుట్టిన” అనే పదం లేదు. మొదటి భాగంతో ఉన్న సమాంతర భావాన్ని స్పష్టంచేయడానికి దాన్ని చేర్చారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: కానీ
  rationale: ముందటి వివరణతో ఉన్న వ్యత్యాసాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో సూచిస్తుంది.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: అప్పుడు ... చేసినట్లే, ఇప్పుడు కూడా అలాగే జరుగుతోంది
  rationale: గ్రీకులోని అప్పటి–ఇప్పటి పోలిక నిర్మాణాన్ని నిలుపుతూ, చివర ఉన్న వాక్యలోపాన్ని సహజమైన తెలుగులో పూరిస్తుంది.
- source_word: ὁ ... γεννηθεὶς
  choice: పుట్టినవాడు
  rationale: నామవాచకంగా వాడిన భూతకాల కర్మణి కృదంతాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατὰ σάρκα
  choice: శరీరం ప్రకారం
  rationale: సహజ మానవ జననాన్ని సూచించే సందర్భంలోనూ, పౌలు ఉంచిన ‘శరీరం–ఆత్మ’ పదబంధ వ్యత్యాసాన్ని వ్యాఖ్యానించి కుదించకుండా కాపాడుతుంది.
- source_word: ἐδίωκε
  choice: హింసించినట్లే
  rationale: ఇక్కడ διώκω సూచించే విరోధపూర్వక వేధింపును తెలియజేస్తుంది; గ్రీకు అసంపూర్ణ భూతకాల క్రియను సందర్భానుసారమైన గత చర్యగా సహజంగా అందిస్తుంది.
- source_word: τὸν κατὰ πνεῦμα
  choice: ఆత్మ ప్రకారం పుట్టినవాణ్ణి
  rationale: రెండవ భాగంలో గ్రీకులో ‘పుట్టిన’ అనే పదం అధ్యాహారంగా ఉన్నప్పటికీ, సమాంతర భావాన్ని తెలుగులో స్పష్టంచేయడానికి దాన్ని పునరుక్తి చేస్తుంది; ‘ప్రకారం’ అనే రూపం κατά యొక్క విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: గలతీయులకు రాసిన పత్రికలోని వాగ్దానం–ఆత్మ సందర్భం దీనిని పవిత్రాత్మగా అర్థం చేసుకోవడానికి బలమిస్తుంది; తెలుగు బైబిలు శైలిలో ‘ఆత్మ’ ఈ సూచనను సహజంగా మోస్తుంది.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: పూర్వపు సంఘటనను పౌలు కాలంలోని పరిస్థితితో కలిపే కాలసూచక క్రియావిశేషణాన్ని నేరుగా అందిస్తుంది.
theological_decisions:
- issue: ఇష్మాయేలు–ఇస్సాకు వ్యత్యాసంలో κατὰ σάρκα భావం
  choice: సాధారణ మానవ జనన విధానం ప్రకారం పుట్టడం; ప్రత్యేకంగా పాపస్వభావాన్ని సూచించడం కాదు
  alternative: పాపస్వభావం చేత పుట్టడం లేదా లోకరీతిగా పుట్టడం
  rationale: సమీప సందర్భం (గలతీయులు 4:23, 29) సహజ జననాన్ని వాగ్దానం/ఆత్మకు సంబంధించిన జననంతో పోలుస్తుంది. ప్రధాన పాఠంలో ‘శరీరం’ ఉంచడం పౌలు పదబంధాన్ని కాపాడుతుంది; పాదసూచిక దాని సందర్భార్థాన్ని వివరిస్తుంది.
- issue: πνεῦμα యొక్క సూచన
  choice: పవిత్రాత్మ
  alternative: మానవ ఆత్మ లేదా ఆధ్యాత్మిక సూత్రం/రంగం
  rationale: హాగరు–శారా రూపకాల సందర్భంలోనూ, వాగ్దాన సంతానంతో ఉన్న సంబంధంలోనూ, ఇది దేవుని ఆత్మను సూచించడం అత్యంత సంభావ్యం. అయినా ప్రధాన పాఠం గ్రీకు పదబంధానికి దగ్గరగా ‘ఆత్మ ప్రకారం’ అని ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం వాడుతూ, ‘శరీరం ప్రకారం / ఆత్మ ప్రకారం’ అనే పౌలు ఉద్దేశించిన ఉద్విగ్న వ్యత్యాసాన్ని నిలిపింది. భాష గౌరవప్రదంగా, మతశాఖాపరమైన ప్రత్యేక పదజాలం లేకుండా ఉంది.
