translation:
  language: te
  text: ఆయనకు యుగయుగాల వరకు మహిమ కలుగుగాక. ఆమేన్.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: ఆయనకే
  rationale: దత్తివిభక్తిలోని సంబంధ సర్వనామం ముందున్న ‘మన దేవుడూ తండ్రీ’ అనే వ్యక్తిని సూచిస్తుంది. ‘కే’ స్తుతి ఆయనకే చెందుతుందనే గ్రీకు వాక్య బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ δόξα
  choice: మహిమ
  rationale: స్తుతివాక్య సందర్భంలో ‘మహిమ’ అనేది గౌరవం, ఘనత అనే భావాలను మోసే స్థిరమైన, గంభీరమైన తెలుగు పదం.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాల వరకు
  rationale: అంతంలేని కాలాన్ని సూచించే గ్రీకు నుడికారానికి ఇది సహజమైన తెలుగు సమానార్థక ప్రయోగం; మూలంలోని ‘యుగాల యుగాలు’ అనే తీవ్రతను నిలుపుతుంది.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: స్తుతివాక్యాన్ని ముగించే గంభీర సమ్మతి పదంగా తెలుగు బైబిలు వాడుకలో స్థిరపడిన లిప్యంతరీకరణను ఉంచాము.
theological_decisions:
- issue: క్రియ లేని స్తుతివాక్యంలో అంతర్భావిత క్రియార్థం
  choice: మహిమ కలుగుగాక
  alternative: మహిమ ఆయనదే / మహిమ ఆయనకు చెందుతుంది
  rationale: గ్రీకులో సమాపక క్రియ లేకపోయినా, ఈ సందర్భం ఆశీర్వచనాత్మక స్తుతిని వ్యక్తం చేయగలదు. ‘కలుగుగాక’ తెలుగు స్తుతివాక్య శైలిలో సహజంగా ఉండి, మూలంలోని ప్రార్థనాత్మక గంభీరతను నిలుపుతుంది; అధిక సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన స్తుతివాక్య శైలి. సాధారణ పాఠకులకు అర్థమయ్యే సంప్రదాయ బైబిలు పదాలైన ‘మహిమ’, ‘యుగయుగాలు’, ‘ఆమేన్’ ఉపయోగించబడ్డాయి.
