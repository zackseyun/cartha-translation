revisions:
- from: ఆయనకే యుగయుగాల వరకు మహిమ కలుగుగాక. ఆమేన్.
  to: ఆయనకు యుగయుగాల వరకు మహిమ కలుగుగాక. ఆమేన్.
  rationale: The revision removes the added exclusive force of ‘కే’ while preserving the Greek’s implied doxological verbal sense, the unending-duration idiom, and the solemn closing affirmation.
  reviewer_model: gpt-5.6-terra
