revisions:
- from: తన కుమారుణ్ణి నాలో[a] బయలుపరచడానికి—నేను ఆయనను యూదేతర ప్రజల మధ్య సువార్తగా ప్రకటించేలా—దేవుడు ఇష్టపడినప్పుడు, నేను వెంటనే రక్తమాంసాలతో[b] సంప్రదించలేదు.
  to: తన కుమారుణ్ణి నాలో[a] బయలుపరచి, నేను ఆయనను యూదేతర ప్రజల మధ్య సువార్తగా ప్రకటించడానికి, నేను వెంటనే మాంసమూ రక్తమూ గలవారితో[b] సంప్రదించలేదు.
  rationale: The revision removes imported wording from the prior verse while retaining the source text’s continuation-like syntax. It improves the Telugu purpose construction and expresses the “flesh and blood” idiom naturally without resolving it into a mere paraphrase in the main text. The disputed force of ἐν ἐμοὶ remains deliberately open, with the same alternatives anchored to the phrase.
  reviewer_model: gpt-5.6-terra
