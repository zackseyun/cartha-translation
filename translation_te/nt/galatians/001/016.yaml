id: GAL.1.16
reference: Galatians 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: te
  text: తన కుమారుణ్ణి నాలో[a] బయలుపరచి, నేను ఆయనను యూదేతర ప్రజల మధ్య సువార్తగా ప్రకటించడానికి, నేను వెంటనే మాంసమూ రక్తమూ గలవారితో[b] సంప్రదించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నాకు,” లేదా “నా ద్వారా.”
    reason: alternative_reading
  - marker: b
    text: “మాంసమూ రక్తమూ గలవారు” అనేది మనిషిని లేదా మనుషులను సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: బయలుపరచడానికి
  rationale: దేవుడు కుమారుణ్ణి వెల్లడించే కార్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; దైవిక ప్రత్యక్షత భావాన్ని కాపాడుతుంది.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: తన కుమారుణ్ణి
  rationale: గ్రీకులోని సంబంధాన్ని, క్రీస్తుకు సంబంధించిన ‘కుమారుడు’ అనే బిరుదు బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν ἐμοὶ
  choice: నాలో
  rationale: ἐν అనే విభక్త్యర్థాన్ని నేరుగా నిలుపుతూ, అంతరంగ ప్రత్యక్షత, పౌలుకు ప్రత్యక్షత, లేదా పౌలు ద్వారా ప్రత్యక్షత అనే సాధ్యమైన భావాల మధ్య ఉన్న ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: నేను ఆయనను ... సువార్తగా ప్రకటించేలా
  rationale: εὐαγγελίζωμαι లోని సువార్త ప్రకటన భావాన్నీ, αὐτόν అనే ప్రత్యక్ష కర్మ వల్ల కుమారుడే ప్రకటనకు కేంద్రం అనే బలాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: యూదేతర ప్రజల మధ్య
  rationale: ఈ పౌలు పత్రిక సందర్భంలో ἔθνη సాధారణంగా యూదులు కాని ప్రజలను సూచిస్తుంది; ‘యూదేతర ప్రజలు’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: కాలసంబంధమైన తక్షణతను సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ προσανεθέμην
  choice: సంప్రదించలేదు
  rationale: ఇతరులతో ఆలోచన పంచుకోవడం లేదా వారి సలహా కోరడం అనే మధ్యమవాచక క్రియ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: σαρκὶ καὶ αἵματι
  choice: రక్తమాంసాలతో
  rationale: గ్రీకులోని సజీవమైన నుడికార రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; అది మానవులను సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: కుమారుని బయలుపరచడానికి సంబంధించిన ἐν ἐμοὶ భావం
  choice: ప్రధాన పాఠ్యంలో అక్షరార్థానికి దగ్గరగా, అస్పష్టతను నిలిపే ‘నాలో’
  alternative: ‘నాకు’ లేదా ‘నా ద్వారా’
  rationale: ఈ పదబంధం పౌలు అంతరంగంలో జరిగిన ప్రత్యక్షతగా, పౌలుకు కలిగిన ప్రత్యక్షతగా, లేదా పౌలు ద్వారా జరిగిన ప్రత్యక్షతగా అర్థం కావచ్చు. ఒక భావాన్ని సిద్ధాంతపరంగా ఖరారు చేయకుండా ప్రధాన పాఠ్యంలో ఉద్రిక్తతను నిలిపి, ఇతర సాధ్య భావాలను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ఈ వచనం 15వ వచనం నుంచి కొనసాగుతున్నందున భావపూర్ణత కోసం ‘దేవుడు ఇష్టపడినప్పుడు’ అనే ముందరి వాక్య భాగం చేర్చబడింది; మధ్యలోని ఉద్దేశ్య సంబంధాన్ని దీర్ఘ విరామచిహ్నాలతో స్పష్టంచేశారు. ‘రక్తమాంసాలు’ అనే పౌలు నుడికారాన్ని వివరణాత్మక పరామర్శతో మార్చకుండా నిలిపారు.
