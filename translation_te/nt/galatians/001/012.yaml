revisions:
- from: ఎందుకంటే, నేను దానిని ఏ మనిషి నుండీ పొందలేదు; ఎవరూ నాకు దానిని బోధించనూ లేదు. అది యేసు మెస్సీయ చేసిన వెల్లడి ద్వారానే[a] నాకు వచ్చింది.
  to: ఎందుకంటే నేను దానిని ఏ మనిషి నుండి పొందలేదు, నాకు దానిని బోధించలేదు కూడా; కానీ యేసు మెస్సీయ యొక్క వెల్లడి ద్వారా పొందాను[a].
  rationale: The revision restores the Greek contrast by making Paul explicitly say that he received the message through revelation. It also avoids deciding the disputed force of Ἰησοῦ Χριστοῦ in the main text, while retaining both viable readings in the footnote.
  reviewer_model: gpt-5.6-terra
