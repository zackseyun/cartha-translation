id: GAL.1.12
reference: Galatians 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: te
  text: ఎందుకంటే నేను దానిని ఏ మనిషి నుండి పొందలేదు, నాకు దానిని బోధించలేదు కూడా; కానీ యేసు మెస్సీయ యొక్క వెల్లడి ద్వారా పొందాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు మెస్సీయ నుండి వచ్చిన వెల్లడి ద్వారా”; లేదా, “యేసు మెస్సీయను గురించిన వెల్లడి ద్వారా.”
    reason: యేసు మెస్సీయ యొక్క వెల్లడి అనే పదబంధం గ్రీకులో యేసు మెస్సీయ మూలంగా వచ్చిన వెల్లడినిగానీ, ఆయనను గురించిన వెల్లడినిగానీ సూచించవచ్చు.
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: ఏ మనిషి నుండీ
  rationale: ఏదో ఒక నిర్దిష్ట వ్యక్తిని కాకుండా, మానవ మూలాన్ని సాధారణంగా నిరాకరించే ఏకవచన గ్రీకు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: παρέλαβον
  choice: పొందలేదు
  rationale: సంప్రదాయం లేదా సందేశం ఒకరి నుండి మరొకరికి అందే సందర్భంలో ‘పొందడం’ సహజంగా ఉండి, మానవుల ద్వారా సువార్తను స్వీకరించలేదనే పౌలు మాటను నిలుపుతుంది.
- source_word: ἐδιδάχθην
  choice: ఎవరూ నాకు దానిని బోధించనూ లేదు
  rationale: గ్రీకు కర్మణి రూపంలోని బోధన పొందిన భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; మానవ బోధనకూ వెల్లడికీ మధ్యనున్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: δι’ ἀποκαλύψεως
  choice: వెల్లడి ద్వారానే
  rationale: διά ఇక్కడ సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది. ‘వెల్లడి’ దాచబడినది బయలుపరచబడే భావాన్ని ఇస్తుంది; ‘ద్వారానే’ మానవ మార్గాన్ని నిరాకరించే వాక్యబలాన్ని నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ చేసిన
  rationale: సందర్భంలో సందేశపు మూలం ప్రధానంగా ఉన్నందున, యేసు మెస్సీయే వెల్లడిచేసినట్లు ప్రధాన పాఠంలో చూపబడింది. అయితే గ్రీకు షష్ఠీ విభక్తి యేసు మెస్సీయను గురించిన వెల్లడినీ సూచించగలదు కాబట్టి ఆ భావం పాదసూచికలో ఉంచబడింది.
theological_decisions:
- issue: ἀποκαλύψεως Ἰησοῦ Χριστοῦ లోని షష్ఠీ విభక్తి భావం
  choice: 'కర్త/మూలార్థం: యేసు మెస్సీయ చేసిన వెల్లడి'
  alternative: 'కర్మార్థం: యేసు మెస్సీయను గురించిన వెల్లడి'
  rationale: మానవ మూలాన్నీ మానవ బోధననూ నిరాకరించే సమీప సందర్భం, వెల్లడికి యేసు మెస్సీయే మూలమనే అర్థానికి బలం ఇస్తుంది. అయినా గ్రీకు నిర్మాణంలోని నిజమైన సందిగ్ధతను తొలగించకుండా ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదంగా రూపొందించబడింది. Χριστόςను బిరుదుగా ‘మెస్సీయ’ అని అనువదించాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికకు జతచేయబడింది.
