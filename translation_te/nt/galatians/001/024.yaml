base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/024.yaml
  text: And they glorified God because of me[a].
translation:
  language: te
  text: వారు నన్నుబట్టి దేవుణ్ణి మహిమపరిచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘నాలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: ఈ వాక్యం ముందున్న కథనానికి కొనసాగింపు. అయితే స్వతంత్ర వచనంగా సహజమైన ఆధునిక తెలుగులో ప్రారంభ ‘మరియు’ అవసరం లేకుండా భావసంబంధాన్ని కొనసాగించవచ్చు.
- source_word: ἐδόξαζον
  choice: మహిమపరుస్తూ ఉన్నారు
  rationale: δοξάζω అంటే మహిమ లేదా ఘనత చెల్లించడం. అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమైన చర్యను సూచిస్తున్నందున ‘మహిమపరుస్తూ ఉన్నారు’ అని అనువదించబడింది.
- source_word: ἐν ἐμοὶ
  choice: నా కారణంగా
  rationale: ἐν అక్షరార్థంగా ‘నాలో’ అయినప్పటికీ, ఈ సందర్భంలో పౌలుకు సంబంధించి జరిగిన దానివల్ల సంఘాలు దేవుణ్ణి మహిమపరిచాయని తెలిపే కారణార్థం సహజంగా సరిపోతుంది. అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: τὸν θεόν
  choice: దేవుణ్ణి
  rationale: ఇది ἐδόξαζον అనే క్రియకు ప్రత్యక్ష కర్మ; ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రూపం ‘దేవుణ్ణి’.
theological_decisions:
- issue: ἐν ἐμοὶ యొక్క భావం
  choice: 'కారణార్థం: ‘నా కారణంగా’'
  alternative: 'స్థానార్థకంగా లేదా సంబంధార్థకంగా: ‘నాలో’'
  rationale: ముందటి సందర్భంలో పౌలు మారిన సంగతి విని యూదయ సంఘాలు స్పందిస్తున్నాయి. అందువల్ల ‘నా కారణంగా’ ప్రధాన భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అయినా గ్రీకు పదబంధంలోని ‘నాలో’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేసింది.
