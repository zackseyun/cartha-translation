language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἃ δὲ γράφω ὑμῖν, ἰδοὺ ἐνώπιον τοῦ θεοῦ ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/020.yaml
  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: te
  text: నేను మీకు రాస్తున్నది—ఇదిగో[a], దేవుని సన్నిధిలో[b]—నేను అబద్ధం చెప్పడం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇదిగో” అనే గ్రీకు పదం ఇక్కడ గంభీరంగా దృష్టిని ఆకర్షించి, తరువాతి ప్రకటనను నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుని ఎదుట.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: విషయాల గురించి
  rationale: నపుంసక బహువచన సంబంధ సర్వనామం పౌలు రాస్తున్న విషయాలను సూచిస్తుంది; తెలుగులో ముందుకు తెచ్చిన వాక్యభాగంగా సహజంగా ఉండేందుకు ఈ రూపం వాడబడింది.
- source_word: δὲ
  choice: —
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకత కంటే స్వల్పమైన సంభాషణ మలుపును సూచిస్తుంది; తెలుగులో వేరే పదాన్ని చేర్చకుండా వాక్య నిర్మాణం, విరామచిహ్నం ద్వారా ఆ మలుపు వ్యక్తమవుతుంది.
- source_word: γράφω ὑμῖν
  choice: నేను మీకు రాస్తున్న
  rationale: వర్తమాన కాలపు లేఖా సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ὑμῖν లేఖ గ్రహీతలను సూచిస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: గంభీరంగా దృష్టిని ఆకర్షించే ఉద్ఘాటనను ప్రత్యక్షంగా నిలుపుతుంది; దాని కార్యాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని సన్నిధిలో
  rationale: దేవుని సమక్షంలో జవాబుదారీతనంతో చేసే గంభీర ప్రకటన భావాన్ని కాపాడుతుంది; దీన్ని గ్రీకులో లేనంతగా అధికారిక ప్రమాణంగా విస్తరించదు.
- source_word: ὅτι οὐ ψεύδομαι
  choice: నేను అబద్ధం చెప్పడం లేదు
  rationale: ὅτι పరిచయం చేసే ప్రకటన విషయాన్ని కొలన్ తర్వాత సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది; వర్తమాన కాలంలోని పౌలు సత్యవాదనను నిలుపుతుంది.
theological_decisions:
- issue: పౌలు దేవుని సమక్షాన్ని ఆహ్వానిస్తూ చేసే ప్రకటన బలం
  choice: దేవుని సన్నిధిలో చెబుతున్నాను
  alternative: కేవలం ఉద్ఘాటనగా భావించి దేవుని సమక్షంలో జవాబుదారీతన భావాన్ని సడలించడం
  rationale: ἐνώπιον τοῦ θεοῦ పౌలు తన మాట సత్యమని దేవుని సమక్షంలో గంభీరంగా ప్రకటిస్తున్నాడని సూచిస్తుంది. అయితే గ్రీకులో స్పష్టంగా లేని పూర్తి ప్రమాణ సూత్రాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. మూలంలోని సంక్షిప్త ప్రమాణసదృశ నిర్మాణం తెలుగులో పూర్తి భావం వచ్చేలా “చెబుతున్నాను”తో వ్యక్తపరచబడింది; ఇది కొత్త వాదనను చేర్చకుండా మూలంలోని ప్రకటనాత్మక బలాన్ని వెల్లడిస్తుంది.
