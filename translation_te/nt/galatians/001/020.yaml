- from: 'నేను మీకు రాస్తున్న విషయాల గురించి—ఇదిగో[a], దేవుని సన్నిధిలో[b] చెబుతున్నాను: నేను అబద్ధం చెప్పడం లేదు.'
  to: నేను మీకు రాస్తున్నది—ఇదిగో[a], దేవుని సన్నిధిలో[b]—నేను అబద్ధం చెప్పడం లేదు.
  rationale: The relative clause is corrected to a direct-object expression, and the unsupported explicit verb ‘చెబుతున్నాను’ is removed. The emphatic particle, solemn appeal before God, present-tense denial, and existing footnote anchors are retained.
  reviewer_model: gpt-5.6-terra
