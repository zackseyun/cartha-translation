id: GAL.1.15
reference: Galatians 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε δὲ ⸀εὐδόκησεν ὁ ἀφορίσας με ἐκ κοιλίας μητρός μου καὶ καλέσας διὰ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: te
  text: అయితే, నా తల్లి గర్భం నుంచే నన్ను ప్రత్యేకపరచి, తన కృప ద్వారా నన్ను పిలిచినవాడు ఇష్టపడినప్పుడు[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పుట్టినప్పటి నుండే”; యిర్మియా 1:5; యెషయా 49:1లోని ప్రవక్తల పిలుపు భాషతో పోల్చండి.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: అయితే, ... అప్పుడు
  rationale: ὅτε యొక్క కాలసంబంధ భావాన్ని ‘అప్పుడు’తో, δέ యొక్క స్వల్ప వ్యతిరేక/కొనసాగింపు భావాన్ని ‘అయితే’తో సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: εὐδόκησεν
  choice: ఇష్టపడినప్పుడు
  rationale: దైవిక సంతోషపూర్వక సంకల్పం అనే భావాన్ని నిలుపుతూ, దాన్ని కేవలం నిర్ణయంగా పరిమితం చేయదు; తరువాతి వాక్యభాగంతో కలిసే అసంపూర్ణ కాలవాక్య నిర్మాణాన్ని కూడా కాపాడుతుంది.
- source_word: ὁ ἀφορίσας με
  choice: నన్ను ... ప్రత్యేకపరచి ... దేవుడు
  rationale: కర్తగా ఉన్న గ్రీకు నామవాచకసమాన కృదంతాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ‘ప్రత్యేకపరచి’ అనేది ‘ఎన్నుకున్నాడు’ లేదా ‘నియమించాడు’ వంటి అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా, ఒక ఉద్దేశం కోసం వేరుగా ఉంచిన భావాన్ని తెలియజేస్తుంది.
- source_word: ἐκ κοιλίας μητρός μου
  choice: నా తల్లి గర్భం నుండే
  rationale: గ్రీకులోని స్పష్టమైన గర్భసంబంధ రూపకాన్ని, అలాగే ప్రవక్తల పిలుపును గుర్తుచేసే బైబిలు నుడికారాన్ని నిలుపుతుంది.
- source_word: καλέσας
  choice: పిలిచిన
  rationale: దేవుని పిలుపు అనే పౌలు వాడుకలోని విస్తృత భావాన్ని అనవసరంగా వివరించకుండా సహజంగా అందిస్తుంది.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: తన కృప ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సూచించే సాధన/మాధ్యమ భావాన్ని నిలుపుతూ, కృపను పిలుపుకు మాధ్యమంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀφορίσας అనే పదాన్ని ముందే ఎన్నుకోవడం లేదా పూర్వనిర్ణయం అనే నిర్దిష్ట సిద్ధాంతంగా అనువదించాలా?
  choice: ప్రత్యేకపరచి
  alternative: ఎన్నుకొని / నియమించి / వేరుచేసి
  rationale: మూలపాఠం దైవికంగా ఒక ఉద్దేశం కోసం ప్రత్యేకంగా ఉంచడాన్ని సూచిస్తుంది; అయితే అది ఇక్కడ ఏదైనా వ్యవస్థీకృత పూర్వనిర్ణయ సిద్ధాంతాన్ని తప్పనిసరిగా నిర్ధారించదు. అందువల్ల మూలంలోని ఉద్వేగం, విస్తృతి నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది తరువాతి వచనంలో పూర్తయ్యే వాక్యభాగం కాబట్టి, ‘ఇష్టపడినప్పుడు’ అనే అసంపూర్ణ నిర్మాణం ఉద్దేశపూర్వకంగా నిలుపబడింది. గ్రీకులో ‘దేవుడు’ అనే నామవాచకం ప్రత్యక్షంగా లేకపోయినా, నామవాచకసమాన కృదంతానికి సూచిత కర్తను తెలుగులో సహజంగా స్పష్టం చేయడానికి వాడబడింది.
