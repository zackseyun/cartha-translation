  to: అయితే, నా తల్లి గర్భం నుంచే నన్ను ప్రత్యేకపరచి, తన కృప ద్వారా నన్ను పిలిచినవాడు ఇష్టపడినప్పుడు[a]
  rationale: The revision removes the supplied explicit noun “దేవుడు” and uses a Telugu substantival relative form, “పిలిచినవాడు,” to reflect the Greek articular participle. All other core lexical and theological choices are retained, including the incomplete temporal clause and the womb imagery.
