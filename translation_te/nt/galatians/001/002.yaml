lexical_decisions:
- source_word: καὶ οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: మరియు నాతో ఉన్న సహోదరులందరూ
  rationale: καὶ ముందటి వచనంలోని పంపినవారి పరిచయాన్ని కొనసాగిస్తుంది. ἀδελφοί వ్యాకరణపరంగా పుంలింగ బహువచనం; సందర్భంలో అది తోటి విశ్వాసులను సూచిస్తుంది. మూలంలోని రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, స్త్రీపురుషులిద్దరినీ కలుపుకునే సాధ్యతను పాదసూచికలో తెలిపాం.
- source_word: ἐκκλησίαις
  choice: సంఘాలకు
  rationale: పౌలు పత్రికల సంబోధనల్లో ἐκκλησία స్థానిక విశ్వాసుల సమాజాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో సహజమైన, స్థిరమైన పదం ‘సంఘం’.
- source_word: τῆς Γαλατίας
  choice: గలతీయలోని
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని తెలుగులో సహజంగా ప్రాంతస్థితిని తెలిపే ‘గలతీయలోని’ అని వ్యక్తపరచడం భావాన్ని ఖచ్చితంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన పత్రికా శైలిని అనుసరించాం. ఇది 1వ వచనంతో కొనసాగే వాక్యభాగం కావడంతో ‘మరియు’తో ప్రారంభించాం. గ్రహీతలను స్పష్టంగా చూపడానికి తెలుగులో సహజమైన ‘రాస్తున్నది’ను సరఫరా చేశాం; ద్విబిందువును ఉంచి తదుపరి వచనానికి కొనసాగింపును సూచించాం.
