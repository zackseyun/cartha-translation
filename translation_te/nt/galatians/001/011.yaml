source:
  edition: SBLGNT
  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: te
  text: ఎందుకంటే, సోదరులారా,[a] నేను ప్రకటించిన సువార్త మానవ మూలం నుండి వచ్చినది కాదని[b] మీకు తెలియజేస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సోదరులారా’ అనే గ్రీకు సంబోధన ఈ సందర్భంలో సోదర సోదరీమణులందరినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మనిషి ప్రకారం కాదు”; ఈ మాటకు “మానవ ప్రమాణాల ప్రకారం ఉన్నది కాదు” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: మీకు తెలియజేస్తున్నాను
  rationale: క్రియ యొక్క ‘తెలియజేయడం’ అనే భావాన్ని నిలుపుతూ, ముఖ్యమైన వివరణను పరిచయం చేసే సహజమైన ఆధునిక తెలుగు ప్రయోగంగా ఉంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యాలతో ఈ వాక్యానికి ఉన్న కారణాత్మక లేదా వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పదంలోని పుంలింగ బహువచన రూపాన్ని ప్రతిబింబించే గౌరవప్రదమైన సంబోధన; ఇక్కడ అది విశ్వాస సమాజంలోని స్త్రీపురుషులందరినీ ఉద్దేశించి ఉండవచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: εὐαγγέλιον
  choice: సువార్త
  rationale: పౌలు వాడే ప్రత్యేక భావాన్ని అందించే, తెలుగులో స్థిరపడిన సంక్షిప్త పదం.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: నేను మీకు ప్రకటించిన
  rationale: పౌలు సువార్తను బహిరంగంగా ప్రకటించిన కార్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భంలోని శ్రోతలతో సంబంధాన్ని స్పష్టం చేయడానికి ‘మీకు’ను చేర్చింది.
- source_word: κατὰ ἄνθρωπον
  choice: మానవ మూలం నుండి వచ్చినది
  rationale: తరువాతి వచనంలో పౌలు దానిని మనిషి నుండి పొందలేదని చెప్పడం వల్ల, ఇక్కడ మూలం లేదా ఉత్పత్తి భావం సందర్భానికి ఉత్తమంగా సరిపోతుంది.
theological_decisions:
- issue: κατὰ ἄνθρωπον అనేది మానవ మూలాన్ని సూచిస్తుందా, లేక మానవ ప్రమాణాలకు అనుగుణంగా ఉండడాన్ని సూచిస్తుందా?
  choice: మానవ మూలం నుండి వచ్చినది కాదు
  alternative: మానవ ప్రమాణాల ప్రకారం ఉన్నది కాదు; అక్షరార్థంగా ‘మనిషి ప్రకారం కాదు’
  rationale: గలతీయులు 1:12లో పౌలు ఈ సువార్తను మనిషి నుండి పొందలేదనీ, ఎవరూ తనకు బోధించలేదనీ చెప్పడం మూలాన్ని సూచించే భావానికి బలమిస్తుంది. అయినప్పటికీ, గ్రీకు నుడికారంలోని ఇతర సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. వాక్యారంభంలోని ‘ఎందుకంటే’ γὰρ ద్వారా ముందటి సందర్భంతో ఉన్న వివరణాత్మక సంబంధాన్ని నిలుపుతుంది. ప్రధాన పాఠంలో సందర్భానికి తగిన మూల-భావాన్ని ఎంచుకుని, గ్రీకు నుడికారంలోని నిజమైన అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
