id: GAL.1.4
reference: Galatians 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: te
  text: మన దేవుడూ తండ్రియూ అయినవారి చిత్తం ప్రకారం, ప్రస్తుత దుష్ట యుగం[a] నుండి మనలను విడిపించడానికి మన పాపాల కోసం తనను తాను ఇచ్చినవాడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రస్తుత దుష్ట లోకం.’
    reason: αἰών అనే గ్రీకు పదానికి సందర్భానుసారంగా ‘యుగం’ లేదా ‘లోకం’ అనే అర్థాలు రావచ్చు; ఇక్కడ ‘యుగం’ ప్రధాన అర్థం.
lexical_decisions:
- source_word: δόντος ἑαυτόν
  choice: తనను తాను ఇచ్చినవాడు
  rationale: ‘ఇచ్చాడు’ అనే మాట δίδωμι యొక్క సాధారణ అర్థాన్నీ, క్రీస్తు స్వచ్ఛందంగా తనను తాను ఇచ్చుకున్న భావాన్నీ కాపాడుతుంది; ‘అప్పగించుకున్నాడు’ లేదా ‘బలిగా అర్పించుకున్నాడు’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని భావం మరింత నిర్దిష్టమవుతుంది.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: మన పాపాల కోసం
  rationale: ὑπέρ ఇక్కడ పాపాలకు సంబంధించి విమోచనాత్మక భావాన్ని కలిగి ఉంది. ‘కోసం’ సహజమైన తెలుగులో ఆ భావాన్ని నిలుపుతూ, ప్రాయశ్చిత్త విధానాన్ని మూలం చెప్పినదానికంటే ఎక్కువగా నిర్వచించదు.
- source_word: ἐξέληται
  choice: విడిపించడానికి
  rationale: ἐξαιρέω ప్రమాదం లేదా ఆధీనపరిచే స్థితి నుండి బయటకు తీసుకురావడాన్ని సూచిస్తుంది. ‘విడిపించడానికి’ ఆధునిక తెలుగులో ఆ రక్షణాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: αἰῶνος
  choice: యుగం
  rationale: αἰών ప్రధానంగా కాలపరమైన యుగాన్ని సూచిస్తుంది; భౌతిక ప్రపంచాన్ని మాత్రమే కాదు. అందువల్ల ‘లోకం’ కంటే ‘యుగం’ మూలానికి మరింత సమీపం.
- source_word: τοῦ ἐνεστῶτος πονηροῦ
  choice: ప్రస్తుతం ఉన్న ఈ దుష్ట
  rationale: ἐνεστῶτος ఇప్పుడు ఉనికిలో ఉన్నదాన్ని, πονηροῦ దాని నైతిక దుష్టత్వాన్ని సూచిస్తాయి. తెలుగు వాక్య నిర్మాణంలో ‘ఈ’ చేర్చడం ప్రస్తుత యుగాన్ని సహజంగా నిర్దేశిస్తుంది, కొత్త భావాన్ని జోడించదు.
- source_word: κατὰ τὸ θέλημα
  choice: చిత్తం ప్రకారం
  rationale: ఈ పదబంధం దేవుని సంకల్పానికి అనుగుణంగా జరిగిన కార్యాన్ని సూచిస్తుంది. ‘చిత్తం ప్రకారం’ ఖచ్చితమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: మన దేవుడూ తండ్రీ అయినవాని
  rationale: గ్రీకు నిర్మాణం ఇద్దరిని కాక ఒకే వ్యక్తిని—మన దేవుడూ తండ్రీ అయినవానిని—సూచిస్తుంది. ఈ రూపం ఆ ఏక సూచనను తెలుగులో స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν అనే పదబంధం ప్రాయశ్చిత్త స్వరూపాన్ని ఎంతవరకు నిర్దిష్టం చేస్తుంది
  choice: మన పాపాల కోసం
  alternative: మన పాపాల కారణంగా; మన పాపాల నిమిత్తం
  rationale: ఈ పదబంధానికి విమోచనాత్మక, ప్రతినిధిత్వ భావం ఉన్నా, ఈ వాక్యం సంపూర్ణ ప్రాయశ్చిత్త సిద్ధాంతాన్ని నిర్వచించదు. ‘మన పాపాల కోసం’ ఆ వేదాంత బరువును నిలుపుతూ దానిని అనవసరంగా సంకుచితం చేయదు.
- issue: αἰών ను ‘యుగం’గా లేదా ‘లోకం’గా అనువదించడం
  choice: ప్రస్తుతం ఉన్న ఈ దుష్ట యుగం
  alternative: ప్రస్తుతం ఉన్న ఈ దుష్ట లోకం
  rationale: పౌలు వాడిన పదం కేవలం స్థలపరమైన ప్రపంచం కంటే కాలపరమైన-విశ్వపరమైన వ్యవస్థను సూచిస్తుంది. ‘యుగం’ మూలంలోని ప్రధాన భావాన్ని కాపాడుతుంది; సంప్రదాయ ‘లోకం’ పఠనాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ఇది ముందు వచనంలో పేర్కొన్న యేసు క్రీస్తును విశేషించే సంబంధార్థక వాక్యభాగం కాబట్టి ‘ఇచ్చినవాడు’తో ముగించి, తదుపరి వచనంతో కొనసాగేలా కామాను నిలిపాం.
