source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: te
  text: నాకంటే ముందే అపొస్తలులైనవారి దగ్గరకు వెళ్లడానికి నేను యెరూషలేముకు కూడా వెళ్లలేదు. బదులుగా, అరేబియాకు వెళ్లి, తిరిగి దమస్కుకు వచ్చాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: కూడా ... వెళ్లలేదు
  rationale: మునుపటి వాక్యంలోని నిరాకరణను కొనసాగిస్తూ, తెలుగులో సహజంగా ఈ వాక్యాన్ని దానితో అనుసంధానిస్తుంది.
- source_word: ἀνῆλθον
  choice: వెళ్లలేదు
  rationale: యెరూషలేముకు ప్రయాణించడాన్ని సూచిస్తుంది. మూలంలోని ‘పైకి వెళ్లడం’ అనే సంప్రదాయ భౌగోళిక భావం తెలుగులో ‘యెరూషలేముకు వెళ్లడం’ అనే సహజ ప్రయోగంలో సందర్భానుసారంగా సరిపోతుంది.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: నాకంటే ముందు అపొస్తలులైనవారి దగ్గరికి
  rationale: వారు పౌలుకంటే ముందే అపొస్తలులయ్యారనే కాలపరమైన ప్రాధాన్యాన్ని తెలియజేస్తుంది; హోదాలో ఉన్నతులని భావింపజేయదు.
- source_word: ἀλλὰ
  choice: బదులుగా
  rationale: యెరూషలేముకు వెళ్లకపోవడం, అరేబియాకు వెళ్లడం అనే రెండు చర్యల మధ్య బలమైన వ్యత్యాసాన్ని సహజంగా చూపిస్తుంది.
- source_word: ἀπῆλθον
  choice: వెళ్లి
  rationale: అక్కడి నుంచి బయలుదేరి అరేబియాకు వెళ్లిన భావాన్ని సందర్భం స్పష్టం చేస్తుంది; తెలుగు వాక్యప్రవాహంలో సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: Ἀραβίαν
  choice: అరేబియాకు
  rationale: ప్రాంతనామానికి ప్రామాణిక తెలుగు రూపం; ఆ ప్రాంతపు ఖచ్చితమైన చారిత్రక సరిహద్దులను వాక్యం నిర్ణయించదు.
- source_word: πάλιν ὑπέστρεψα
  choice: ఆ తర్వాత తిరిగి ... వచ్చాను
  rationale: πάλιν లోని పునరాగమన భావాన్ని ‘తిరిగి’ నిలుపుతుంది; ‘ఆ తర్వాత’ సంఘటనల క్రమాన్ని తెలుగులో సహజంగా కలుపుతుంది.
- source_word: Δαμασκόν
  choice: దమస్కుకు
  rationale: నగరనామానికి విస్తృతంగా వాడే తెలుగు బైబిలు రూపం.
theological_decisions:
- issue: ‘నాకంటే ముందు’ అని అపొస్తలులను పేర్కొనడంలోని భావం
  choice: పౌలుకంటే ముందే అపొస్తలులైనవారు అనే కాలపరమైన అర్థం
  alternative: హోదాలో పౌలుకంటే ఉన్నతులైనవారు
  rationale: πρὸ ἐμοῦ సహజంగా కాలపరమైన ముందుదనాన్ని సూచిస్తుంది. అధికార క్రమం లేదా హోదా గురించి మూలపాఠం చెప్పని భావాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. ‘అపొస్తలులు,’ ‘యెరూషలేము,’ ‘దమస్కు’ అనే స్థిరపడిన బైబిలు పదరూపాలను ఉంచి, వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా తీర్చిదిద్దాం.
