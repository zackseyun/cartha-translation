  terminology: '''శుభవార్త,'' ''దేవదూత,'' and ''శాపగ్రస్తుడవుగాక'' are suitable, accessible terms. The footnotes retain the lexical alternatives without imposing later ecclesiastical meaning on ἀνάθεμα.'
