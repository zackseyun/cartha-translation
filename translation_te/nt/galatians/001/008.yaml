id: GAL.1.8
reference: Galatians 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ ⸀εὐαγγελίζηται ⸀ὑμῖν παρ’ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: te
  text: కానీ మేమైనా, పరలోకం నుండి ఒక దేవదూతైనా, మేము మీకు ప్రకటించిన శుభవార్తకు విరుద్ధంగా మీకు శుభవార్త ప్రకటిస్తే[a][b], అతడు శాపగ్రస్తుడవుగాక[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీకు సువార్త ప్రకటిస్తే.’ గ్రీకు మూలంలో ‘శుభవార్త ప్రకటించు’ అనే క్రియ ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘విరుద్ధంగా’ అనే మాటను ‘మేము మీకు ప్రకటించిన దానికంటే భిన్నంగా’ లేదా ‘దానిని మించి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అతడు శాపం కింద ఉండుగాక’; మరొక రూపం, ‘అతడు అనాథెమా అవుగాక.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: కానీ … అయినా
  rationale: ἀλλά లోని బలమైన వ్యతిరేక భావాన్ని ‘కానీ’ తెలియజేస్తుంది; καί, ἐάν కలిగించే ‘అయినా సరే’ అనే ఉద్ఘాటనను సహజమైన తెలుగు షరతు నిర్మాణంలో నిలుపుతుంది.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: మేమైనా, పరలోకం నుంచి వచ్చిన దేవదూతైనా
  rationale: పౌలు తనను, తన సహచరులను కూడా మినహాయించకుండా చెప్పిన ఉద్ఘాటనను నిలుపుతూ, పరలోక దూతతో ఉన్న తీవ్ర వ్యత్యాసాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: εὐαγγελίζηται
  choice: మీకు శుభవార్తగా ప్రకటిస్తే
  rationale: మూలంలో నామవాచకం కాక క్రియ ఉండటాన్ని ప్రతిబింబిస్తూ, ఆధునిక తెలుగులో అర్థమయ్యే రీతిలో ‘శుభవార్తగా ప్రకటించు’ అని అనువదించబడింది.
- source_word: παρ’ ὃ
  choice: …కు విరుద్ధమైన
  rationale: ఈ వాదనాత్మక సందర్భంలో మునుపు ప్రకటించిన సందేశం నుంచి వైదొలగడాన్ని ‘విరుద్ధమైన’ బలంగా తెలియజేస్తుంది; ‘భిన్నమైన’ లేదా ‘మించిన’ అనే సాధ్యమైన భావాలను పాదసూచికలో ఉంచాం.
- source_word: εὐηγγελισάμεθα
  choice: మేము మీకు ప్రకటించిన శుభవార్త
  rationale: ముందటి క్రియతో ఉన్న పదసంబంధాన్ని నిలుపుతూ, తెలుగులో అసహజమైన పునరుక్తిని తగ్గిస్తుంది.
- source_word: ἀνάθεμα ἔστω
  choice: అతడు శాపగ్రస్తుడవుగాక
  rationale: తీవ్రమైన శాపతీర్పును గంభీరంగా, స్పష్టంగా తెలియజేస్తుంది; తరువాతి సంఘపరమైన సాంకేతిక అర్థాన్ని చేర్చదు.
theological_decisions:
- issue: పౌలు పలికిన శాపవాక్యం యొక్క భావం
  choice: అపొస్తలులు ప్రకటించిన శుభవార్తకు విరుద్ధమైన సందేశాన్ని ప్రకటించే ఎవరి మీదైనా నిజమైన శాపతీర్పును ‘అతడు శాపగ్రస్తుడవుగాక’ అని వ్యక్తపరచడం.
  alternative: దీనిని అధికారిక సంఘబహిష్కరణగా ‘అతడు అనాథెమా అవుగాక’ అని లేదా విస్తృత దైవిక ఖండనగా ‘అతడు శాపం కింద ఉండుగాక’ అని అనువదించడం.
  rationale: వాక్యం బలమైన న్యాయతీర్పు స్వరాన్ని కలిగి ఉంది. ఎంచుకున్న రూపం ఆ తీవ్రతను నిలుపుతూ, తరువాత ఏర్పడిన నిర్దిష్ట సంఘపరమైన భావాన్ని పాఠ్యంలోకి తీసుకురాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ప్రవచనాత్మక స్వరం నిలుపబడింది. ‘దేవదూత,’ ‘శుభవార్త,’ ‘శాపగ్రస్తుడు’ వంటి విస్తృతంగా అర్థమయ్యే పదాలను వాడాం; denominational సాంకేతిక పదజాలాన్ని ప్రధాన పాఠ్యంలో నివారించాం.
