  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: te
  text: అది మరొక సువార్త కాదు; మిమ్మల్ని కలవరపెట్టి, మెస్సీయ[a] సువార్తను వక్రీకరించాలని[b] కోరుకునే కొందరు ఉన్నారు, అంతే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘భ్రష్టుపట్టించాలని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: మరొక సువార్త
  rationale: ἄλλοతో నామవాచకం వ్యక్తంగా లేకపోయినా, 6వ వచనంలోని సందర్భం వల్ల ‘సువార్త’ అనే పదం భావంలో ఉంది. తెలుగులో స్పష్టత కోసం దానిని చేర్చాం.
- source_word: εἰ μή
  choice: అయితే
  rationale: ఇక్కడ εἰ μή కఠినమైన షరతును కాక, ముందటి మాటకు వివరణాత్మక మినహాయింపును పరిచయం చేస్తుంది. ‘అయితే’ ఆధునిక తెలుగులో ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ταράσσοντες
  choice: కలవరపెడుతూ
  rationale: ఈ వర్తమాన అసమాపక క్రియ వారి నిరంతర కలవరపరిచే చర్యను చూపుతుంది; ‘కలవరపెడుతూ’ భావోద్వేగ అశాంతి మరియు గందరగోళం రెండింటినీ సహజంగా సూచిస్తుంది.
- source_word: θέλοντες
  choice: కోరుకునే
  rationale: వారు కేవలం అలా చేస్తున్నారని కాక, అలా చేయాలనే ఉద్దేశం కలిగి ఉన్నారని ఈ పదం తెలియజేస్తుంది.
- source_word: μεταστρέψαι
  choice: వక్రీకరించాలని
  rationale: సువార్తను దాని నిజ స్వరూపానికి విరుద్ధంగా మార్చే భావాన్ని ‘వక్రీకరించడం’ స్పష్టంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: εὐαγγέλιον
  choice: సువార్త
  rationale: పౌలు రచనల సందర్భంలో εὐαγγέλιονకు ‘సువార్త’ స్థిరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός యేసు యొక్క అభిషిక్త రాజు అనే బిరుదు భావాన్ని నిలుపుతుంది; అందువల్ల ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ను వాడాం.
theological_decisions:
- issue: τοῦ Χριστοῦను బిరుదుగా అనువదించాలా, పేరు వలె అనువదించాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో సువార్త మెస్సీయకు చెందినది లేదా ఆయనను గూర్చినది అనే భావం ఉంది. మూలంలోని బిరుదు భావాన్ని ‘మెస్సీయ’ స్పష్టంగా నిలుపుతుంది; సుపరిచితమైన ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చాం.
- issue: τοῦ Χριστοῦలోని షష్ఠీ విభక్తి సంబంధం
  choice: ‘మెస్సీయ సువార్త’ అనే సంక్షిప్త నిర్మాణం
  alternative: మెస్సీయను గూర్చిన సువార్త / మెస్సీయకు చెందిన సువార్త
  rationale: గ్రీకు షష్ఠీ విభక్తి సువార్త మెస్సీయను గూర్చినదా, ఆయనకు చెందినదా అనే సంబంధాన్ని పూర్తిగా నిర్దిష్టం చేయదు. తెలుగు సంక్షిప్త నిర్మాణం ఆ సహజ అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా పౌలు వాక్యంలోని గంభీరత నిలిచేలా అనువదించాం. రెండు వాక్యాలుగా విభజించడం తెలుగు పఠన సౌలభ్యాన్ని పెంచుతుంది; ‘అయితే’ మూలంలోని వివరణాత్మక మినహాయింపును కలుపుతుంది.
