source:
  edition: SBLGNT
  text: ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: te
  text: అయితే ఇతర అపొస్తలుల్లో ప్రభువు సహోదరుడైన యాకోబును తప్ప మరెవరినీ నేను చూడలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరో అపొస్తలుని నేను చూడలేదు—ప్రభువు సహోదరుడైన యాకోబును మాత్రమే చూశాను.” ఈ పదప్రయోగం యాకోబును అపొస్తలునిగా వర్గీకరించడం లేదని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: ఇతర... మరెవరినీ
  rationale: τῶν ἀποστόλων అనే భాగసూచక నిర్మాణంలో ἕτερον ‘వారిలో మరొకరిని/ఇతర వ్యక్తిని’ అని సూచిస్తుంది. తెలుగు వాక్యంలో ‘ఇతర అపొస్తలుల్లో... మరెవరినీ’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: δέ ముందరి వాక్యంతో స్వల్ప వ్యత్యాసాన్ని లేదా కథన పురోగతిని సూచిస్తుంది; ‘అయితే’ ఆధునిక ప్రామాణిక తెలుగులో తగిన అనుసంధానం.
- source_word: ἀποστόλων
  choice: అపొస్తలుల్లో
  rationale: పౌలు సందర్భంలో గుర్తింపు పొందిన అపొస్తలులను సూచించే స్థిరమైన బైబిలు పదం ‘అపొస్తలులు’; లో విభక్తి భాగసూచక గ్రీకు నిర్మాణాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὐκ εἶδον
  choice: మరెవరినీ నేను చూడలేదు
  rationale: గ్రీకు భూతకాల నిషేధాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ఇక్కడ εἰ μή షరతును కాక మినహాయింపును పరిచయం చేస్తుంది; ‘తప్ప’ సంక్షిప్తమైన, సహజమైన సమానార్థకం.
- source_word: Ἰάκωβον
  choice: యాకోబును
  rationale: Ἰάκωβος పేరుకు తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన రూపం ‘యాకోబు’; కర్మవిభక్తితో ‘యాకోబును’.
- source_word: ἀδελφὸν
  choice: సహోదరుడైన
  rationale: ἀδελφός యొక్క సాధారణ ప్రత్యక్ష అర్థమైన ‘సోదరుడు/సహోదరుడు’ను బలహీనపరచకుండా నిలుపుతుంది; గౌరవప్రదమైన వాక్యశైలికి ‘సహోదరుడు’ సరిపోతుంది.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: κύριος అనే బిరుదుకు స్థిరమైన తెలుగు రూపం ‘ప్రభువు’; ‘ప్రభువు సహోదరుడు’ అనే సంబంధ నిర్మాణం మూలార్థాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: ఈ నిర్మాణంలో యాకోబు ‘అపొస్తలుల్లో’ ఒకరిగా లెక్కించబడుతున్నాడా?
  choice: ప్రధాన పాఠం సహజమైన వాక్యనిర్మాణాన్ని అనుసరిస్తూ, ఇతర అపొస్తలుల్లో యాకోబును తప్ప మరెవరినీ పౌలు చూడలేదని చెబుతుంది; అందువల్ల మినహాయింపులో యాకోబు ఆ వర్గంలో చేర్చబడినట్లు వినిపిస్తుంది.
  alternative: కొంతమంది దీన్ని, పేతురు తప్ప మరో అపొస్తలుని పౌలు చూడలేదని, అదనంగా యాకోబును చూశాడని—కాని యాకోబును తప్పనిసరిగా అపొస్తలునిగా వర్గీకరించకుండా—అర్థం చేసుకుంటారు.
  rationale: εἰ μή సాధారణంగా ముందున్న నిషేధ వాక్యానికి మినహాయింపును పరిచయం చేస్తుంది. ప్రధాన అనువాదం ఆ సహజ వ్యాకరణ సంబంధాన్ని కాపాడుతుంది; ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో ఉంచి నిజమైన సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన బైబిలు శైలి. [a] సూచిక ప్రధాన పాఠంలో స్పష్టంగా చేర్చబడింది.
