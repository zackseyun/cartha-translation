lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు లేఖల అభివందనాల్లోని అనుగ్రహ భావాన్నీ, ఈ పదానికి ఉన్న ఆధ్యాత్మిక లోతునూ నిలుపుతుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: దీవెన ఎవరికి ఉద్దేశించబడిందో తెలిపే దత్తివిభక్తికి సహజమైన తెలుగు సమానం.
- source_word: εἰρήνη
  choice: సమాధానం
  rationale: యూదుల అభివందన నేపథ్యంతో పాటు సంపూర్ణ క్షేమం, దేవునితో సఖ్యత అనే విస్తృత భావాన్ని మోసే స్థిరమైన బైబిలు పదం.
- source_word: ἀπό
  choice: నుండీ
  rationale: కృప, సమాధానాలకు మూలాన్ని సూచించే గ్రీకు విభక్త్యర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: θεοῦ πατρὸς
  choice: తండ్రియైన దేవుడు
  rationale: మూలపాఠంలో πατρός‌కు ప్రత్యేక నిర్దేశక పదం లేకపోయినా, దేవుణ్ణి తండ్రిగా గుర్తించే సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఈ పాఠక్రమంలో ἡμῶν నేరుగా κυρίου‌తో కలుస్తుంది కాబట్టి ‘మన తండ్రియైన దేవుడు’ అని చేర్చలేదు.
- source_word: κυρίου ἡμῶν
  choice: మన ప్రభువు
  rationale: κύριος యొక్క క్రీస్తుసంబంధమైన బిరుదు బలాన్ని ‘ప్రభువు’ నిలుపుతుంది; ἡμῶν‌ను దాని ప్రత్యక్ష స్థానానుసారం ‘మన’గా దీనితో కలిపాం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉన్నందున దాని అర్థాన్ని ‘మెస్సీయ’గా అనువదించాం; సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: Χριστοῦను అర్థానువాదమైన బిరుదుగా ఇవ్వాలా, సంప్రదాయ నామరూపంగా ఇవ్వాలా
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: ఈ అభివందనలో Χριστός క్రీస్తుసంబంధమైన బిరుదు బలాన్ని ఇంకా కలిగి ఉంది. అందువల్ల ప్రధాన పాఠంలో ‘మెస్సీయ’ను ఉంచి, తెలుగు పాఠకులకు సుపరిచితమైన ‘క్రీస్తు’ను పాదసూచికలో నిలిపాం.
- issue: ἡμῶν (‘మన’)ను ‘తండ్రి’తోనా ‘ప్రభువు’తోనా కలపాలి
  choice: మన ప్రభువు
  alternative: మన తండ్రియైన దేవుడు
  rationale: ఇచ్చిన SBLGNT పాఠక్రమంలో ἡμῶν అనేది κυρίου వెంటనే వస్తుంది; కాబట్టి దాన్ని ‘ప్రభువు’తో కలపడం మూలపాఠానికి అత్యంత నేరుగా సరిపోతుంది. ‘దేవుడు మన తండ్రి’ అనే పౌలు బోధను తిరస్కరించడం కాదు; ఈ వాక్యంలోని వ్యాకరణ సంబంధాన్ని మాత్రమే అనుసరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన లేఖా-దీవెన శైలిని వాడాం. గ్రీకులో క్రియ లేకపోయినా, తెలుగు అభివందన సహజత్వం కోసం ‘కలుగుగాక’ను పూరించాం. ‘నుండీ ... నుండీ’ అనే పునరుక్తి కృప, సమాధానం తండ్రియైన దేవుని నుండీ ప్రభువైన యేసు నుండీ వస్తాయని స్పష్టంగా ఉంచుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోలుతుంది.
