translation:
  language: te
  text: మన తండ్రియైన దేవుని నుండీ, మన ప్రభువైన యేసు మెస్సీయ నుండీ మీకు కృప, సమాధానం కలుగుగాక.[a]
  philosophy: optimal-equivalence
