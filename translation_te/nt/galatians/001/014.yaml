source:
  edition: SBLGNT
  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: te
  text: నా ప్రజలలో నా వయసువారైన అనేకులకంటే నేను యూదమతంలో[a] మరింత పురోగమిస్తూ, నా పితరుల సంప్రదాయాల పట్ల మరింత ఉత్సాహం కలిగినవాణ్ణి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదుల మతంలో”; సందర్భానుసారం ఈ గ్రీకు పదం “యూదుల జీవన విధానం” అనే విస్తృత అర్థాన్నీ ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: ముందుకు సాగుతూ
  rationale: అసంపూర్ణ భూతకాల క్రియ ongoing past progressను సూచిస్తుంది; సందర్భంలోని పోలికను అతిశయింపకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰουδαϊσμῷ
  choice: యూదా మతాచారంలో
  rationale: Ἰουδαϊσμός మతవ్యవస్థతో పాటు యూదుల జీవనాచారాన్ని కూడా సూచించగలదు; ‘మతాచారం’ ఆ విస్తృతిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: నా వయసువారైన అనేకులకంటే
  rationale: ὑπέρ ఇక్కడ పోలికను, συνηλικιώτας సమవయస్కులను సూచిస్తాయి.
- source_word: ἐν τῷ γένει μου
  choice: నా ప్రజల్లో
  rationale: γένος ఇక్కడ పౌలు చెందిన జాతి/ప్రజాసమూహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో అపార్థం లేకుండా సహజంగా ఉంటుంది.
- source_word: περισσοτέρως ζηλωτὴς ὑπάρχων
  choice: మరింత అత్యుత్సాహం చూపించేవాణ్ణి
  rationale: ζηλωτής యొక్క బలమైన ఆసక్తి, నిబద్ధతను సహజమైన తెలుగు క్రియారూపంలో అందిస్తుంది; περισσοτέρως యొక్క పోలిక బలాన్ని ‘మరింత’ నిలుపుతుంది.
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: నా పూర్వీకుల సంప్రదాయాల విషయంలో
  rationale: πατρικός పితరులనుండి లేదా పూర్వీకులనుండి సంక్రమించినదాన్ని సూచిస్తుంది; ఈ రూపం వారసత్వ భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: Ἰουδαϊσμός యొక్క పరిధి
  choice: యూదా మతాచారం
  alternative: యూదా మతం; యూదుల జీవన విధానం
  rationale: పదాన్ని కేవలం సిద్ధాంతవ్యవస్థగా లేదా కేవలం సామాజిక జీవనశైలిగా పరిమితం చేయకుండా, మతం మరియు ఆచరణ రెండింటినీ సూచించే విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని రెండు పోలికలను—సమవయస్కులకంటే పురోగతి, సంప్రదాయాల పట్ల అధిక ఉత్సాహం—వేరువేరుగా నిలిపింది.
