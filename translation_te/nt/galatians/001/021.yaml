translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని బహువచన భౌగోళిక భావాన్ని ‘ప్రాంతాలు’తో నిలిపి, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా రెండు స్థలనామాల తరువాత ఒకే విభక్తి రూపాన్ని ఉపయోగించాం.
