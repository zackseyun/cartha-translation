id: GAL.1.9
reference: Galatians 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: te
  text: 'మేము ఇంతకుముందు చెప్పినట్లే, ఇప్పుడు మళ్లీ చెబుతున్నాను: మీరు స్వీకరించిన సువార్తకు విరుద్ధమైన సువార్తను ఎవరైనా మీకు ప్రకటిస్తే[a], అతడు శాపగ్రస్తుడై ఉండాలి[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు స్వీకరించిన దానికి భిన్నమైన సువార్తను” లేదా “దానిని మించిన సువార్తను.” ఈ గ్రీకు పదబంధం స్వీకరించిన సందేశం నుండి వైదొలగడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా, “అతడు శాపానికి లోనై ఉండాలి.” గ్రీకు: అనాథెమా ఎస్తో.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: మేము ఇంతకుముందు చెప్పినట్లే
  rationale: ముందుగా చెప్పిన మాట ఇప్పటికీ వర్తిస్తోందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἄρτι πάλιν λέγω
  choice: ఇప్పుడు మళ్లీ చెబుతున్నాను
  rationale: ἄρτι లోని ప్రస్తుతకాల సూచనను, πάλιν లోని పునరుక్తిని రెండింటినీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: ఎవరైనా మీకు ... సువార్తను ప్రకటిస్తే
  rationale: εὐαγγελίζομαι యొక్క ప్రకటనా భావాన్ని నిలుపుతూ, గలతీయులకు పత్రికలోని సువార్త సందేశ సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: παρ’ ὃ
  choice: '...కు విరుద్ధమైన'
  rationale: παρά ఇక్కడ స్వీకరించిన సందేశం నుండి పక్కకు తొలగడాన్ని లేదా దానికి విరుద్ధతను సూచిస్తుంది; ప్రధాన వాక్యంలో సందర్భానుగుణమైన బలాన్ని నిలుపుతుంది.
- source_word: παρελάβετε
  choice: మీరు స్వీకరించిన
  rationale: παραλαμβάνω ఇక్కడ బోధను లేదా సంప్రదింపబడిన సందేశాన్ని పొందడం అనే అర్థంలో ఉంది; ‘స్వీకరించిన’ అనేది స్పష్టమైన సాధారణ తెలుగు.
- source_word: ἀνάθεμα ἔστω
  choice: అతడు శాపగ్రస్తుడై ఉండాలి
  rationale: దైవిక శాపానికి లోనైన స్థితిని గంభీరంగా వ్యక్తం చేస్తుంది; ‘అనాథెమా’ వంటి అపారదర్శక లిప్యంతరీకరణను నివారిస్తుంది.
theological_decisions:
- issue: ἀνάθεμα ἔστω లోని ఖండన బలం
  choice: అతడు శాపగ్రస్తుడై ఉండాలి
  alternative: అతడు శాపానికి లోనై ఉండాలి
  rationale: గ్రీకు వాక్యంలోని తీవ్రమైన శాప ప్రకటనను నిలుపుతూ, శాపం యొక్క విధానం లేదా అంతిమ ఫలితం గురించి మూలంలో లేని సిద్ధాంత వివరణను చేర్చదు.
- issue: παρ’ ὃ సూచించే సంబంధం
  choice: మీరు స్వీకరించిన సువార్తకు విరుద్ధమైన
  alternative: మీరు స్వీకరించిన దానికి భిన్నమైన / దానిని మించిన
  rationale: సందర్భంలో అపొస్తలిక సువార్త నుండి వైదొలగడమే ప్రధాన భావం; అయితే παρά యొక్క ‘భిన్నంగా/దాటి’ అనే సాధ్యమైన విస్తృతిని పాదటిప్పణిలో ఉంచి నిజమైన అర్థ ఛాయను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పౌలు హెచ్చరికలోని తీవ్రతను తగ్గించకుండా, అనవసరమైన మతశాఖాపర పదజాలాన్ని నివారించాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
