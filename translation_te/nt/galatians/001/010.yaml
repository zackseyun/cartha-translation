id: GAL.1.10
reference: Galatians 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: te
  text: ఎందుకంటే, ఇప్పుడు నేను మనుష్యులను ఒప్పించడానికి చూస్తున్నానా, లేక దేవుణ్ణా?[a] లేదా మనుష్యులను మెప్పించడానికి ప్రయత్నిస్తున్నానా? నేను ఇంకా మనుష్యులను మెప్పిస్తూ ఉంటే, నేను మెస్సీయకు దాసుణ్ణి కాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇప్పుడు నేను మనుష్యుల ఆమోదాన్ని సంపాదించడానికి చూస్తున్నానా, లేక దేవుని ఆమోదాన్నా?”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “క్రీస్తు సేవకుణ్ణి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: ఇప్పుడు
  rationale: పౌలు ప్రస్తుత వైఖరిని గత జీవన ధోరణితో వ్యత్యాసపరుస్తున్న సందర్భానికి సహజమైన, సంక్షిప్తమైన అనువాదం.
- source_word: πείθω
  choice: ఒప్పించడానికి చూస్తున్నానా
  rationale: ‘ఒప్పించడం’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, వర్తమాన ప్రయత్నాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; దేవుని విషయంలో వినిపించే ఉద్దేశపూర్వక అసౌకర్యాన్ని తొలగించకుండా మూలంలోని ప్రశ్నను కాపాడుతుంది.
- source_word: ἀνθρώπους
  choice: మనుష్యులను
  rationale: ఇక్కడ పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో సందర్భానికి తగిన రూపం.
- source_word: θεόν
  choice: దేవుణ్ణి
  rationale: ప్రశ్నలో మనుష్యులతో ప్రత్యక్ష వ్యత్యాసంగా ఉన్న కర్మపదానికి ప్రామాణిక తెలుగు రూపం.
- source_word: ζητῶ
  choice: ప్రయత్నిస్తున్నానా
  rationale: వర్తమాన కాలంలోని నిరంతర ప్రయత్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀρέσκειν / ἤρεσκον
  choice: సంతోషపెట్టడానికి / సంతోషపెడుతూ
  rationale: ఇతరుల మెప్పును లక్ష్యంగా పెట్టుకోవడం అనే సందర్భార్థాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰ ἔτι
  choice: నేను ఇంకా ... ఉంటే
  rationale: షరతుతో పాటు గతంలో ఉండి ఉండగల ధోరణి కొనసాగుతున్నదనే ἔτι భావాన్ని కాపాడుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయకు
  rationale: Χριστόςలోని అభిషిక్త రాజు అనే బిరుదు భావాన్ని నిలుపుతుంది; తెలుగు వాక్యనిర్మాణంలో సహజమైన సంబంధ రూపం.
- source_word: δοῦλος
  choice: దాసుణ్ణి
  rationale: పూర్తి విధేయత, యాజమాన్యానికి లోబడిన స్థితి అనే బలమైన భావాన్ని ‘సేవకుడు’ కంటే మెరుగ్గా నిలుపుతూ, గౌరవప్రదమైన బైబిలు తెలుగు వాడుకకు సరిపోతుంది.
theological_decisions:
- issue: πείθω యొక్క ఉద్దేశ్యార్థం
  choice: మనుష్యులను ఒప్పించడానికి చూస్తున్నానా, లేక దేవుణ్ణా?
  alternative: మనుష్యుల ఆమోదాన్ని సంపాదించడానికి చూస్తున్నానా, లేక దేవుని ఆమోదాన్నా?
  rationale: మూలంలోని ‘ఒప్పించు/మనసు మార్చు’ అనే పదార్థాన్ని ప్రధాన పాఠంలో నిలుపుతుంది. అయితే తరువాతి ‘సంతోషపెట్టడం’తో ఉన్న సంబంధం వల్ల ‘ఆమోదం పొందడం’ అనే సందర్భార్థం సాధ్యమని పాదసూచిక తెలియజేస్తుంది.
- issue: Χριστοῦ δοῦλος అనువాదం
  choice: మెస్సీయకు దాసుడు
  alternative: క్రీస్తు సేవకుడు
  rationale: ఈ వాక్యంలో మనుష్యుల మెప్పుకు విరుద్ధంగా మెస్సీయకు సంపూర్ణంగా చెందిన విధేయత ప్రధానంగా ఉంది. అందువల్ల Χριστόςను బిరుదుగా, δοῦλοςను బలమైన బంధిత విధేయతను సూచించే ‘దాసుడు’గా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. వరుస అలంకారిక ప్రశ్నలను, మూలంలోని ఉద్దేశపూర్వక పదార్థ అసౌకర్యాన్ని, చివరి షరతు వాక్యంలోని విధేయత-మనుష్యమెప్పు ఉద్రిక్తతను నిలుపుకుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
