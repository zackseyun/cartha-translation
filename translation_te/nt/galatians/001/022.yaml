id: GAL.1.22
reference: Galatians 1:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ ταῖς ἐκκλησίαις τῆς Ἰουδαίας ταῖς ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: te
  text: అయితే, యూదయలోని మెస్సీయలో ఉన్న సంఘాలకు నేను వ్యక్తిగతంగా పరిచయం లేనివాడిని[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి నేను ముఖాముఖిగా తెలియనివాడిని” లేదా “వారు నన్ను చూసి గుర్తుపట్టేవారు కాదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యంతో ఉన్న స్వల్పమైన మార్పు లేదా వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀγνοούμενος τῷ προσώπῳ
  choice: ముఖపరిచయం లేనివాడిగా
  rationale: కేవలం తెలియనివాడని కాకుండా, ముఖాముఖి లేదా వ్యక్తిగత పరిచయం లేదనే గ్రీకు నుడికార భావాన్ని కాపాడుతుంది.
- source_word: ἐκκλησίαις
  choice: సంఘాలకు
  rationale: ఇక్కడ పౌలు సూచిస్తున్న విశ్వాసుల స్థానిక సమాజాలకు ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజమైన పదం.
- source_word: Ἰουδαίας
  choice: యూదయ
  rationale: భౌగోళిక నామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ అభిషిక్తుడనే బిరుదు భావాన్ని కలిగి ఉంది; ‘మెస్సీయ’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ἐν Χριστῷ లో Χριστῷ పదాన్ని ఎలా అనువదించాలి
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: ఈ సందర్భంలో Χριστός కేవలం పేరులా కాక అభిషిక్తుడనే బిరుదుగా వినిపిస్తుంది. అందువల్ల ‘మెస్సీయ’ మూలంలోని బిరుదు భావాన్ని కాపాడుతుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ముఖపరిచయం’ ద్వారా τῷ προσώπῳ యొక్క నుడికార భావాన్ని అతిగా వివరణాత్మకంగా చేయకుండా నిలిపాం; ἤμην యొక్క భూతకాల స్థితిని ‘ఉన్నాను’ అనే కథనసందర్భానికి సహజమైన రూపంతో వ్యక్తం చేశాం.
