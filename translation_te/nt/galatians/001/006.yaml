id: GAL.1.6
reference: Galatians 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: te
  text: మెస్సీయ[b] కృపలో[a] మిమ్మల్ని పిలిచినవానిని మీరు ఇంత త్వరగా విడిచి, భిన్నమైన సువార్త[c] వైపు మళ్లిపోతున్నందుకు నాకు ఆశ్చర్యం కలుగుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మెస్సీయ కృప ద్వారా.’ ఇక్కడి గ్రీకు విభక్తి కృప యొక్క పరిధినిగానీ, కృపను సాధనంగానిగానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో ‘క్రీస్తు’; ఈ పదం ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మరొక సువార్త వైపు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: నాకు ఆశ్చర్యం కలిగిస్తోంది
  rationale: పౌలు వ్యక్తం చేస్తున్న తీవ్ర ఆశ్చర్యాన్నీ అసంతృప్తినీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὕτως ταχέως
  choice: ఇంత త్వరగా
  rationale: వారు మారిపోతున్న వేగంపై ఉన్న ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: μετατίθεσθε
  choice: విడిచిపెట్టి … మళ్లిపోతుండడం
  rationale: ఇది కేవలం అభిప్రాయ మార్పు కాక, పిలిచిన వ్యక్తిని విడిచి మరో సందేశం వైపు వెళ్లడమని సందర్భం సూచిస్తుంది; వర్తమాన క్రియ కొనసాగుతున్న ప్రక్రియను తెలియజేస్తుంది.
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: మిమ్మల్ని పిలిచినవాణ్ణి
  rationale: పిలిచిన వ్యక్తి ఎవరో మూలపాఠం ఈ వాక్యంలో స్పష్టంగా చెప్పనందున ‘దేవుడు’ లేదా ‘క్రీస్తు’ అని చేర్చకుండా ఉంచుతుంది.
- source_word: ἐν χάριτι Χριστοῦ
  choice: మెస్సీయ కృపలో
  rationale: ἐν అనే విభక్తి సూచించే పరిధి భావాన్ని ప్రధాన పాఠంలో నిలుపుతూ, సాధనార్థక భావం కూడా సాధ్యమని పాదటిప్పణిలో సూచిస్తుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని భావార్థమైన ‘మెస్సీయ’ను ఉపయోగిస్తుంది.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: భిన్నమైన సువార్త వైపు
  rationale: εἰς లోని దిశా భావాన్ని ‘వైపు’ నిలుపుతుంది; ἕτερον తరువాతి వచనంలోని వ్యత్యాసానికి అనుగుణంగా ‘భిన్నమైన’గా అనువదించబడింది.
theological_decisions:
- issue: ‘మిమ్మల్ని పిలిచినవాడు’ ఎవరు?
  choice: పిలిచినవాణ్ణి అని మాత్రమే ఉంచడం
  alternative: మిమ్మల్ని పిలిచిన దేవుణ్ణి / మిమ్మల్ని పిలిచిన క్రీస్తును
  rationale: గ్రీకు వాక్యంలో కర్త పరోక్షంగా ఉన్నాడు; అందువల్ల ప్రధాన పాఠం అతణ్ణి స్పష్టంగా గుర్తించి వేదాంతపరమైన అనిశ్చితిని తొలగించదు.
- issue: ἐν χάριτι యొక్క భావం
  choice: కృపలో
  alternative: కృప ద్వారా
  rationale: ἐν పరిధిని లేదా సాధనాన్ని సూచించగలదు. ప్రధాన పాఠం పరిధి భావాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘విడిచిపెట్టి … మళ్లిపోతుండడం’ అనే నిర్మాణం వ్యక్తిని విడిచిపోవడం, మరో సందేశం వైపు కదలడం అనే రెండు సంబంధిత భావాలను సహజంగా కలుపుతుంది.
