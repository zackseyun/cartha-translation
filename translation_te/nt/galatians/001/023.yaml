source:
  edition: SBLGNT
  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: te
  text: 'వారు వింటూ ఉండేది మాత్రం ఇదే: “ఒకప్పుడు మమ్మల్ని హింసించినవాడు ఇప్పుడు తాను ఒకప్పుడు నాశనం చేయడానికి ప్రయత్నించిన విశ్వాసాన్ని ప్రకటిస్తున్నాడు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సువార్తను.” గ్రీకులో “విశ్వాసాన్ని”; ఇక్కడ అది పౌలు ఒకప్పుడు నాశనం చేయడానికి ప్రయత్నించిన క్రైస్తవ విశ్వాసం లేదా సందేశాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: మాత్రం
  rationale: వారి సమాచారం ఈ ఒక్క నివేదికకే పరిమితమైందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀκούοντες ἦσαν
  choice: వింటూ ఉన్నది
  rationale: ఈ పరిధీయ అపూర్ణ భూతకాల నిర్మాణం కొనసాగుతూ లేదా పదేపదే ఆ వార్త వినడాన్ని సూచిస్తుంది.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: ఒకప్పుడు మనలను హింసించినవాడు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతాన్ని, ποτέ సూచించే గతకాల భావంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νῦν εὐαγγελίζεται
  choice: ఇప్పుడు సువార్తగా ప్రకటిస్తున్నాడు
  rationale: εὐαγγελίζομαι లోని శుభవార్త ప్రకటన భావాన్ని నిలుపుతూ, దాని కర్మగా వచ్చే ‘విశ్వాసాన్ని’ తెలుగులో సహజంగా అనుసంధానిస్తుంది.
- source_word: τὴν πίστιν
  choice: విశ్వాసాన్ని
  rationale: ఇక్కడ వ్యక్తిగతంగా నమ్మే క్రియకన్నా క్రైస్తవ విశ్వాస సందేశం లేదా విశ్వాస సారాన్ని సూచించే వస్తుగత భావాన్ని నిలుపుతుంది.
- source_word: ἣν ποτε ἐπόρθει
  choice: తాను ఒకప్పుడు నాశనం చేయడానికి ప్రయత్నించిన
  rationale: πορθέω లోని ధ్వంసం చేయడం లేదా పాడుచేయడం అనే బలమైన భావాన్ని, పౌలు చేసిన శత్రుత్వపూరిత ప్రయత్నంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: τὴν πίστιν యొక్క అర్థం
  choice: ‘విశ్వాసం’ అంటే పౌలు ఇప్పుడు ప్రకటిస్తున్న క్రైస్తవ విశ్వాస సందేశం
  alternative: వ్యక్తిగతంగా నమ్మే క్రియ; లేదా సందర్భానుసారంగా ‘సువార్త’
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న πίστις, పౌలు గతంలో హింసించినదానికీ ఇప్పుడు ప్రకటిస్తున్నదానికీ మధ్య వ్యత్యాసంలో, అంతరంగ నమ్మకంకన్నా విశ్వాస సందేశం లేదా అంగీకరించిన విశ్వాస సారాన్ని సూచించడం సహజం. అయితే ‘విశ్వాసం’ అనే మూలార్థాన్ని అనువాదంలో ఉంచి, సందర్భార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన బైబిలు శైలిని నిలిపింది. గ్రీకు అపూర్ణ భూతకాలపు కొనసాగింపు భావాన్ని ‘వింటూ ఉన్నది’ ద్వారా, μόνον యొక్క పరిమితిని ‘మాత్రం ఇదే’ ద్వారా తెలిపింది.
