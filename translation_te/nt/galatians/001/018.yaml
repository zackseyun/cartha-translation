translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. అరుదైన ἱστορῆσαι క్రియలోని భావవ్యాప్తిని ప్రధాన పాఠంలో అతిగా నిర్ధారించకుండా, ప్రత్యామ్నాయ సూక్ష్మార్థాన్ని పాదసూచికలో ఇచ్చాం.
