id: GAL.1.18
reference: Galatians 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: te
  text: తర్వాత, మూడు సంవత్సరాల అనంతరం నేను కేఫాను[a] కలుసుకోవడానికి[b] యెరూషలేముకు వెళ్లి, అతనితో పదిహేను రోజులు ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కేఫా అనేది పేతురుకు ఉన్న అరామిక్ పేరు.
    reason: name_clarification
  - marker: b
    text: లేదా “కేఫాతో వ్యక్తిగతంగా పరిచయం చేసుకోవడానికి”; ఇక్కడి గ్రీకు క్రియలో వ్యక్తిగతంగా కలిసి ఒకరిని తెలుసుకోవడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπειτα
  choice: తర్వాత
  rationale: పౌలు వివరిస్తున్న సంఘటనల క్రమంలో తదుపరి ఘట్టాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: μετὰ ἔτη τρία
  choice: మూడు సంవత్సరాల అనంతరం
  rationale: కాలవ్యవధిని స్పష్టంగా తెలియజేస్తూ గ్రీకు పదబంధానికి దగ్గరగా ఉంటుంది.
- source_word: ἀνῆλθον
  choice: వెళ్లి
  rationale: యెరూషలేముకు ప్రయాణించడాన్ని సహజమైన తెలుగులో తెలుపుతుంది; గ్రీకులోని ‘పైకి వెళ్లడం’ అనే భౌగోళిక లేదా సంప్రదాయ ప్రయోగాన్ని తెలుగులో అక్షరార్థంగా ఉంచితే అసహజంగా ఉంటుంది.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: స్థలనామానికి ప్రాచుర్యంలో ఉన్న తెలుగు రూపాన్ని ఉపయోగిస్తుంది.
- source_word: ἱστορῆσαι
  choice: కలుసుకోవడానికి
  rationale: వ్యక్తిగతంగా వెళ్లి కలవడం అనే ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది; పరిచయం చేసుకోవడం అనే సాధ్యమైన అదనపు భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: Κηφᾶν
  choice: కేఫాను
  rationale: పౌలు ఇక్కడ ఉపయోగించిన కేఫా అనే అరామిక్ పేరునే ఉంచి, దానిని పేతురుగా సమన్వయపరచదు.
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: అతనితో ... ఉన్నాను
  rationale: కేఫాతో కలిసి నిర్దిష్ట కాలం ఉండిపోయాడనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡμέρας δεκαπέντε
  choice: పదిహేను రోజులు
  rationale: కాలవ్యవధిని సూచించే గ్రీకు ద్వితీయా విభక్తి ప్రయోగాన్ని నేరుగా, స్పష్టంగా అందిస్తుంది.
