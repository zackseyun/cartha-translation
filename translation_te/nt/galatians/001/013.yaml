source:
  edition: SBLGNT
  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: te
  text: ఎందుకంటే, యూదా మతంలో నా పూర్వ జీవన విధానం[a] గురించి మీరు విన్నారు కదా; ఎలాగంటే, నేను దేవుని సంఘాన్ని మితిమీరి హింసిస్తూ, దానిని విధ్వంసం చేస్తూ ఉండేవాడిని.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా పూర్వ ప్రవర్తన” లేదా “నా పూర్వ జీవనరీతి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “దానిని నాశనం చేస్తూ ఉండేవాడిని”; సందర్భానుసారం “దానిని నాశనం చేయడానికి ప్రయత్నిస్తూ ఉండేవాడిని” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: నా పూర్వ జీవన విధానం
  rationale: ἀναστροφή విస్తృతంగా ప్రవర్తన లేదా జీవించే విధానాన్ని సూచిస్తుంది; ποτε ఇక్కడ పౌలు గతకాల జీవితాన్ని సూచిస్తుంది. ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేశాం.
- source_word: Ἰουδαϊσμῷ
  choice: యూదా మతంలో
  rationale: ఈ పదం పౌలు గతంలో అనుసరించిన యూదా మతపరమైన జీవితం, గుర్తింపు, ఆచరణలను సూచిస్తుంది. ‘యూదా మతం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: καθ’ ὑπερβολὴν
  choice: మితిమీరి
  rationale: హింస అసాధారణమైన తీవ్రతతో జరిగిందనే గ్రీకు పదబంధపు బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐδίωκον
  choice: హింసిస్తూ ... ఉండేవాడిని
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న గత చర్యను తెలుగు క్రియా నిర్మాణం ప్రతిబింబిస్తుంది.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: దేవుని సంఘాన్ని
  rationale: ఇక్కడ ἐκκλησία మెస్సీయను అనుసరించే గుర్తించదగిన విశ్వాసుల సమాజాన్ని సూచిస్తుంది. తెలుగు క్రైస్తవ వాడుకలో ‘సంఘం’ సహజమైనదీ, ‘సభ’ కంటే సందర్భానికి తగినదీ.
- source_word: ἐπόρθουν
  choice: దాన్ని నాశనం చేయడానికి ప్రయత్నిస్తూ ఉండేవాడిని
  rationale: ఈ బలమైన క్రియ విధ్వంసం చేయడం లేదా విధ్వంసానికి ప్రయత్నించడం అనే భావాన్ని కలిగిస్తుంది. అసంపూర్ణ భూతకాల రూపం ప్రయత్నాత్మక భావానికి వీలు కల్పిస్తున్నందున ప్రధాన పాఠ్యంలో దాన్ని స్పష్టంగా ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: ἐκκλησίαను ‘సంఘం’గా లేదా ‘సభ’గా అనువదించడం
  choice: దేవుని సంఘం
  alternative: దేవుని సభ
  rationale: సందర్భంలో పౌలు హింసించిన దేవునికి చెందిన మెస్సీయ విశ్వాసుల సమాజమే ఉద్దేశం. ‘సంఘం’ ఈ నిర్దిష్ట సమాజాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; అదనపు సంఘశాస్త్ర సిద్ధాంతాన్ని చేర్చదు.
- issue: ἐπόρθουν క్రియలో సాధించిన విధ్వంసమా, విధ్వంస ప్రయత్నమా
  choice: నాశనం చేయడానికి ప్రయత్నిస్తూ ఉండేవాడిని
  alternative: నాశనం చేస్తూ ఉండేవాడిని
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న విధ్వంసక చర్యను సూచించినప్పటికీ, సంఘం నిజంగా పూర్తిగా నాశనమైందని తప్పనిసరిగా చెప్పదు. అందువల్ల ప్రధాన పాఠ్యంలో ప్రయత్న భావాన్ని ఉంచి, మరింత ప్రత్యక్షమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘మీరు విన్నారు కదా’ గ్రీకులోని γάρ ఇచ్చే పూర్వ వాదనతో సంబంధాన్ని సహజంగా సూచిస్తుంది. ప్రధాన పాఠ్యంలో కొనసాగుతున్న గత చర్యను ‘హింసిస్తూ ... ప్రయత్నిస్తూ ఉండేవాడిని’ అనే సమాంతర నిర్మాణంతో నిలిపాం.
