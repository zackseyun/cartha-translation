revisions:
- from: యూదా మతంలో నా పూర్వ జీవన విధానం[a] గురించి మీరు విన్నారు కదా—నేను దేవుని సంఘాన్ని మితిమీరి హింసిస్తూ, దాన్ని నాశనం చేయడానికి ప్రయత్నిస్తూ ఉండేవాడిని.[b]
  to: ఎందుకంటే, యూదా మతంలో నా పూర్వ జీవన విధానం[a] గురించి మీరు విన్నారు కదా; ఎలాగంటే, నేను దేవుని సంఘాన్ని మితిమీరి హింసిస్తూ, దానిని విధ్వంసం చేస్తూ ఉండేవాడిని.[b]
  rationale: The revision retains the draft’s accurate choices for Paul’s former way of life, Judaism, excessive persecution, and God’s church. It replaces the main-text attempt formulation with an ongoing direct devastation formulation for ἐπόρθουν, preserving both its lexical severity and imperfect aspect. The more interpretive attempt sense is moved to the footnote. It also makes the Greek causal and explanatory connections explicit.
