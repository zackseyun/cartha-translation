id: GAL.1.1
reference: Galatians 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: te
  text: మనుషుల నుండి గానీ, ఒక మనిషి ద్వారా గానీ కాకుండా, యేసు మెస్సీయ ద్వారా మరియు ఆయనను మృతులలోనుండి లేపిన తండ్రియైన దేవుని ద్వారా అపొస్తలుడైన పౌలు,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: అపొస్తలుడు
  rationale: ఇది పౌలు తనను తాను పరిచయం చేసుకునే అధికారిక నియామక బిరుదు. సాధారణమైన ‘దూత’ కంటే ‘అపొస్తలుడు’ ఆ పాత్రకున్న ప్రత్యేకతను, వేదాంతపరమైన బరువును నిలుపుతుంది.
- source_word: ἀπ’ ἀνθρώπων
  choice: మనుషుల నుండి
  rationale: ἀπό + షష్ఠీ విభక్తి మూలాన్ని సూచిస్తుంది. ‘మనుషుల నుండి’ అనే రూపం తరువాతి ఏకవచనమైన ‘ఒక మనిషి ద్వారా’తో ఉన్న అలంకారిక వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: δι’ ἀνθρώπου
  choice: ఒక మనిషి ద్వారా
  rationale: διά + షష్ఠీ విభక్తి మధ్యవర్తిత్వాన్ని లేదా సాధనాన్ని సూచిస్తుంది. గ్రీకులోని ఏకవచనాన్ని సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ ద్వారా
  rationale: పునరుక్తమైన διά, నిరాకరించబడిన మానవ మధ్యవర్తిత్వానికి విరుద్ధంగా పౌలు అపొస్తలత్వంలోని నిజమైన మధ్యవర్తిత్వాన్ని చూపుతుంది. Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉన్నందున ‘మెస్సీయ’గా అనువదించబడింది.
- source_word: θεοῦ πατρὸς
  choice: తండ్రియైన దేవుడు
  rationale: ఈ బిరుదు నిర్మాణాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తూ, యేసు మెస్సీయతో సమన్వయంగా పేర్కొన్న దైవిక మూలాన్ని నిలుపుతుంది.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: ఆయనను మృతులలో నుండి లేపిన
  rationale: ఈ విశేషణీయ కృదంత పదబంధం తండ్రియైన దేవుణ్ణి విశేషిస్తుంది. ‘మృతులలో నుండి’ అనేది ἐκ νεκρῶν యొక్క సమూహార్థాన్ని, పునరుత్థాన ప్రకటనను కాపాడుతుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ లో Χριστοῦ అనువాదం
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: ఈ అభివాదంలో Χριστός కేవలం పేరులో భాగంలా కాక బిరుదు భావాన్ని ఇంకా మోస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ ఉంచి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఇచ్చాం.
- issue: పౌలు అపొస్తలత్వానికి మానవ మూలం, మానవ మధ్యవర్తిత్వం నిరాకరణ
  choice: మనుషుల నుండి గానీ, ఒక మనిషి ద్వారా గానీ కాకుండా
  alternative: మనుషులవల్ల గానీ, మనిషివల్ల గానీ కాదు
  rationale: మొదటి పదబంధంలోని మూలం (ἀπό), రెండవదానిలోని మధ్యవర్తిత్వం (διά) మధ్య వ్యత్యాసాన్ని కలపకుండా నిలుపుతూ, బహువచనం-ఏకవచనం మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్వేగాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని దీర్ఘ అభివాద వాక్య నిర్మాణం, ‘నుండి/ద్వారా’ వ్యత్యాసం, చివరనున్న అల్పవిరామంతో తరువాతి వచనానికి కొనసాగే స్వభావం నిలుపబడ్డాయి.
