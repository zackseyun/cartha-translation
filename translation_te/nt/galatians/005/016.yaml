id: GAL.5.16
reference: Galatians 5:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: te
  text: 'కాని నేను చెప్పేది ఇదే: ఆత్మచేత నడుచుకోండి; అప్పుడు శరీరపు కోరికను ఎంతమాత్రమూ నెరవేర్చరు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శరీరం’ అనగా ఇక్కడ కేవలం భౌతిక దేహం కాదు; ఆత్మకు విరోధంగా ఉన్న మానవ స్వభావాన్ని సూచించవచ్చు. దీన్ని ‘పాపస్వభావం’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω δέ
  choice: కాని నేను చెప్పేది ఇదే
  rationale: δέ ఇక్కడ స్వల్పమైన వ్యత్యాసాన్ని లేదా వాక్యమలుపును సూచిస్తుంది. ఈ తెలుగు రూపం పౌలు ఇస్తున్న తదుపరి ఉపదేశాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: πνεύματι
  choice: ఆత్మచేత
  rationale: దత్తివిభక్తి ఇక్కడ సాధనం లేదా నియంత్రించే పరిధిని సూచించవచ్చు. సమీప సందర్భంలో పరిశుద్ధాత్మ ఉద్దేశించబడ్డందున, ‘ఆత్మచేత’ ఆయన కార్యసాధక పాత్రను స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: περιπατεῖτε
  choice: నడుచుకోండి
  rationale: పౌలు ఉపయోగించిన ‘నడవడం’ అనే జీవన ప్రవర్తన రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన ఆజ్ఞారూపాన్ని వాడింది.
- source_word: ἐπιθυμίαν
  choice: ఆశను
  rationale: ἐπιθυμία సందర్భానుసారంగా మంచి లేదా చెడు కోరికను సూచించగలదు. ఇక్కడ ‘శరీర’ అనే సంబంధపదమే దాని ప్రతికూల భావాన్ని నిర్దేశిస్తుంది; ‘దురాశ’ అని ముందుగానే వ్యాఖ్యానించకుండా ‘ఆశ’ మూలపద విస్తృతిని కాపాడుతుంది.
- source_word: σαρκὸς
  choice: శరీర
  rationale: ‘పాపస్వభావం’ అని భావాన్ని పూర్తిగా వ్యాఖ్యానించకుండా, పౌలు వాడిన σάρξ అనే పదరూపాన్ని ‘శరీరం’ ద్వారా నిలుపుతుంది. ఇక్కడ ఇది ఆత్మకు విరోధంగా ఉన్న పతిత మానవ ప్రవృత్తిని సూచిస్తుంది.
- source_word: οὐ μὴ τελέσητε
  choice: ఎంతమాత్రమూ నెరవేర్చరు
  rationale: οὐ μή తో కూడిన aorist subjunctive బలమైన నిరాకరణను వ్యక్తం చేస్తుంది. ‘ఎంతమాత్రమూ’ ఆ ఉద్ఘాటనను తెలియజేస్తుంది; ‘నెరవేర్చరు’ కోరికను కార్యరూపంలో పూర్తిచేయడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: πνεύματι ఎవరిని సూచిస్తుంది?
  choice: పరిశుద్ధాత్మ
  alternative: మానవ ఆత్మ లేదా సాధారణ ఆధ్యాత్మిక సూత్రం
  rationale: గలతీయులు 5లో ఆత్మకూ శరీరానికీ మధ్య ఉన్న ప్రత్యక్ష వ్యత్యాసం పరిశుద్ధాత్మను సూచిస్తుంది. తెలుగులో ‘ఆత్మ’కు పెద్ద అక్షర భేదం సాధ్యం కానందున, ప్రధాన పాఠంలో అదనపు పదం చేర్చకుండా సందర్భాన్నే అర్థనిర్ణయానికి ఆధారంగా ఉంచింది.
- issue: σάρξ పదార్థం
  choice: శరీరం
  alternative: పాపస్వభావం
  rationale: ఈ సందర్భంలో నైతికంగా ప్రతికూలమైన మానవ ప్రవృత్తి భావం ఉన్నప్పటికీ, ‘శరీరం’ పౌలు పదప్రయోగాన్నీ దానిలోని దైవశాస్త్రీయ ఉద్రిక్తతనూ కాపాడుతుంది. వివరణాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: ఆజ్ఞ మరియు బలమైన నిరాకరణ మధ్య సంబంధం
  choice: ‘నడుచుకోండి; అప్పుడు ... ఎంతమాత్రమూ నెరవేర్చరు’
  alternative: ‘నడుచుకోండి, ... నెరవేర్చకండి’
  rationale: οὐ μὴ τελέσητε రెండవ ఆజ్ఞగా కాకుండా, ఆత్మచేత నడవడం వల్ల శరీరాశను కార్యరూపంలో పెట్టబోరనే ఉద్ఘాటిత ఫలితంగా చదవడం వ్యాకరణానికి అనుకూలం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. ‘నడుచుకోండి’ అనే రూపకం మూలపాఠాన్ని కాపాడుతుంది. ‘శరీరాశ’ అనే సమాసం సంక్షిప్తంగా, సహజంగా ఉండి ‘శరీరం కోరేది’ అనే భావాన్ని ఇస్తుంది; పాదసూచిక దాని పౌలీయ ప్రత్యేకార్థాన్ని వివరిస్తుంది.
