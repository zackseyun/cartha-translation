id: GAL.5.15
reference: Galatians 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: te
  text: అయితే మీరు ఒకరినొకరు కొరుకుతూ మింగివేస్తూ ఉంటే, ఒకరి వల్ల ఒకరు నాశనమైపోకుండా జాగ్రత్తగా ఉండండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: అయితే ... -తుంటే
  rationale: εἰ యొక్క షరతును, δέ యొక్క స్వల్ప వ్యతిరేక మలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀλλήλους
  choice: ఒకరినొకరు
  rationale: సమాజంలోని పరస్పర చర్యను తెలిపే గ్రీకు అన్యోన్య సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: δάκνετε
  choice: కరచుకొని
  rationale: ‘కొరుకు’ అనే అక్షరార్థ జంతు రూపకాన్ని నిలుపుతూ, వ్యక్తులు ఒకరిపై ఒకరు చేసే దాడికి గౌరవప్రదమైన వచనశైలిలో సరిపోతుంది.
- source_word: κατεσθίετε
  choice: మింగివేస్తుంటే
  rationale: సాధారణంగా తినడం కంటే తీవ్రమైన, పూర్తిగా కబళించే చర్యను సూచిస్తూ మూలంలోని హింసాత్మక రూపకాన్ని కొనసాగిస్తుంది.
- source_word: βλέπετε
  choice: జాగ్రత్తపడండి
  rationale: ఆజ్ఞారూపంలోని అప్రమత్తతను సహజమైన, తక్షణ హెచ్చరికగా తెలియజేస్తుంది.
- source_word: μὴ ... ἀναλωθῆτε
  choice: నాశనమైపోకుండా
  rationale: μή తో కూడిన సంభావ్య ప్రతికూల ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ἀναλίσκω ఇక్కడ సూచించే పూర్తిగా క్షీణించి పాడైపోవడాన్ని వ్యక్తం చేస్తుంది.
- source_word: ὑπ’ ἀλλήλων
  choice: ఒకరిచేత ఒకరు
  rationale: నిష్క్రియ నిర్మాణంలోని కర్తృత్వాన్నీ, పరస్పర వినాశంలోని వ్యంగ్యాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: విశ్వాస సమాజంలో రూపకాత్మక హింస
  choice: ‘కరచుకొని మింగివేయడం’ అనే జంతుసంబంధమైన రూపకాన్ని ప్రత్యక్షంగా నిలుపడం
  alternative: ‘ఒకరికి ఒకరు హాని చేసుకొని నాశనం చేసుకుంటే’ అని సాధారణ ఘర్షణ భాషలో చెప్పడం
  rationale: పౌలు ఉపయోగించిన చిత్రం ఉద్దేశపూర్వకంగా తీవ్రంగా ఉంది. దానిని సాధారణ హాని భాషగా మార్చితే సమాజం తనను తానే నాశనం చేసుకునే ప్రమాదం గురించిన హెచ్చరిక బలహీనమవుతుంది.
- issue: ἀναλωθῆτε లో రూపక కొనసాగింపు మరియు ఫలితార్థం
  choice: ‘నాశనమైపోకుండా’
  alternative: ‘మింగివేయబడకుండా’ లేదా ‘కబళించబడకుండా’
  rationale: ఈ క్రియ సంపూర్ణ క్షయం లేదా వినాశాన్ని సూచించగలదు. ‘నాశనమైపోకుండా’ అనే పదప్రయోగం ముందరి భక్షణ రూపకం కలిగించే ఫలితాన్ని స్పష్టంగా తెలియజేస్తూ, κατεσθίετε మరియు ἀναλωθῆτε అనే వేర్వేరు గ్రీకు క్రియలను ఒకే తెలుగు క్రియగా కలపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్యంలోని తీవ్రతకు తగిన గౌరవప్రదమైన శైలిలో ఉంది. గ్రీకు వర్తమాన క్రియల కొనసాగుతున్న లేదా అలవాటైన చర్య భావాన్ని ‘-తుంటే’ ద్వారా మితంగా వ్యక్తం చేసింది.
