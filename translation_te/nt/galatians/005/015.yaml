- from: అయితే మీరు ఒకరినొకరు కరచుకొని మింగివేస్తుంటే, ఒకరిచేత ఒకరు నాశనమైపోకుండా జాగ్రత్తపడండి.
  to: అయితే మీరు ఒకరినొకరు కొరుకుతూ మింగివేస్తూ ఉంటే, ఒకరి వల్ల ఒకరు నాశనమైపోకుండా జాగ్రత్తగా ఉండండి.
