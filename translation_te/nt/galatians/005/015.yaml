review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the conditional-adversative opening, the reciprocal actions, the vivid paired imagery of biting and devouring, and the warning against reciprocal ruin. Its final passive/result sense is substantially correct.
  naturalness: ‘కరచుకొని’ is literary and less idiomatic in modern standard Telugu, while the converb can make the two present actions sound unnecessarily sequential. ‘ఒకరిచేత ఒకరు’ is intelligible but less natural than ‘ఒకరి వల్ల ఒకరు’ in this warning. The revision preserves the force and ongoing conditional sense in more current Telugu.
  terminology: ‘కొరుకుతూ’ and ‘మింగివేస్తూ’ preserve the distinct animalistic metaphors of δάκνετε and κατεσθίετε. ‘నాశనమైపోకుండా’ appropriately renders the resulting ruin denoted by ἀναλωθῆτε without conflating it with the preceding ‘devour.’
  issues:
  - severity: low
    issue: కరచుకొని is less natural and may suggest a completed preliminary action.
    rationale: The Greek has coordinated present verbs (‘bite and devour’), not a sequential converb construction. ‘కొరుకుతూ మింగివేస్తూ’ is idiomatic modern Telugu and better maintains the coordinated, ongoing imagery.
  - severity: low
    issue: ఒకరిచేత ఒకరు is awkward in contemporary Telugu.
    rationale: ‘ఒకరి వల్ల ఒకరు’ naturally conveys the reciprocal agency of ὑπ’ ἀλλήλων in a passive/result warning.
  revised_text: అయితే మీరు ఒకరినొకరు కొరుకుతూ మింగివేస్తూ ఉంటే, ఒకరి వల్ల ఒకరు నాశనమైపోకుండా జాగ్రత్తగా ఉండండి.
