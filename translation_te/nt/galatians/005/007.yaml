  text: Ἐτρέχετε καλῶς· τίς ὑμᾶς ἐνέκοψεν ⸀τῇ ἀληθείᾳ μὴ πείθεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/007.yaml
  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: te
  text: మీరు బాగా పరుగెత్తుతూ ఉండేవారు. సత్యానికి లోబడకుండా ఉండేలా మిమ్మల్ని ఎవరు అడ్డుకున్నారు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సత్యం వల్ల ఒప్పించబడకుండా ఉండేలా మిమ్మల్ని ఎవరు అడ్డుకున్నారు?” గ్రీకు క్రియకు ‘లోబడడం’ లేదా ‘ఒప్పించబడడం’ అనే రెండు భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: మీరు ... పరుగెత్తుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతూ వచ్చిన గత చర్యను సూచిస్తుంది; ‘పరుగెత్తడం’ అనే రూపకం మూలంలో ఉన్నట్లే నిలుపబడింది, స్పష్టంగా లేని ‘పందెంలో’ అనే మాటను చేర్చలేదు.
- source_word: καλῶς
  choice: బాగా
  rationale: ఇది పరుగెత్తడాన్ని విశేషించే క్రియావిశేషణం; ఆధునిక తెలుగులో సహజంగా ఉండి, సరిగ్గా ముందుకు సాగుతున్న భావాన్ని ఇస్తుంది.
- source_word: τίς
  choice: ఎవరు
  rationale: అడ్డగించిన వ్యక్తిని ప్రశ్నించే వ్యక్తివాచక ప్రశ్నార్థక సర్వనామం.
- source_word: ἐνέκοψεν
  choice: అడ్డగించినది
  rationale: దారి కత్తిరించడం లేదా పరుగులో ఆటంకం కలిగించడం అనే ఛాయను కలిగిన క్రియ; ‘అడ్డగించడం’ తెలుగులో సందర్భానికి సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῇ ἀληθείᾳ
  choice: సత్యానికి
  rationale: దత్తివిభక్తి πείθεσθαι క్రియతో అనుసంధానమై ఉంది; ‘సత్యానికి’ అనేది స్వీకరించిన సువార్త సత్యాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: μὴ πείθεσθαι
  choice: లోబడకుండా
  rationale: πείθομαι ఇక్కడ ‘లోబడడం/విధేయత చూపడం’ అనే భావాన్ని ఇవ్వగలదు. అయితే ‘ఒప్పించబడడం’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో నిలుపబడింది.
theological_decisions:
- issue: ἀληθείᾳ తో πείθεσθαι యొక్క భావం
  choice: సత్యానికి లోబడడం
  alternative: సత్యం చేత ఒప్పించబడడం
  rationale: సందర్భం గలతీయులు సువార్తకు చూపుతున్న ఆచరణాత్మక స్పందనను, దాని నుండి వారి మళ్లింపును గూర్చి ఉంది. ‘లోబడడం’ నైతిక స్పందనను తెలియజేస్తుంది; క్రియలోని ‘ఒప్పించబడడం’ అనే భావసాధ్యతను తొలగించకుండా పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. పరుగెత్తడం అనే క్రీడా రూపకాన్ని నిలుపుతూ, మూలంలో స్పష్టంగా లేని ‘పందెం’ను చేర్చలేదు. ప్రధాన పఠనం మరియు పాదటిప్పణి మధ్య πείθεσθαι యొక్క నిజమైన అర్థసందిగ్ధతను కాపాడాం.
