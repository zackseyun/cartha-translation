revisions:
- from: మీరు బాగా పరుగెత్తుతూ ఉన్నారు. సత్యానికి లోబడకుండా మిమ్మల్ని అడ్డగించినది ఎవరు?[a]
  to: మీరు బాగా పరుగెత్తుతూ ఉండేవారు. సత్యానికి లోబడకుండా ఉండేలా మిమ్మల్ని ఎవరు అడ్డుకున్నారు?[a]
  rationale: The revision makes the Greek imperfect explicit in natural Telugu and removes a consequential ambiguity in the negated infinitive construction that could invert the verse’s meaning. It retains the athletic metaphor, the interrogative agent, ‘the truth,’ the main rendering ‘obey,’ and the lexical alternative in the footnote without resolving the semantic tension beyond the source.
  reviewer_model: gpt-5.6-terra
