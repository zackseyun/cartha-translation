id: GAL.5.14
reference: Galatians 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: te
  text: 'ఎందుకంటే ధర్మశాస్త్రమంతా ఒకే వాక్యంలో నెరవేర్చబడింది[a][b]: “నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువానిని ప్రేమించాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, అక్షరార్థంగా, “ఒక్క మాటలో.” గ్రీకులోని పదం ఇక్కడ ఒకే సూక్తిని లేదా ఆజ్ఞను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నెరవేరింది”; వ్యాఖ్యానాత్మకంగా “సంగ్రహించబడింది.” గ్రీకు క్రియ ప్రధానంగా “నెరవేర్చబడింది” అనే భావాన్ని ఇస్తుంది; ఈ ఆజ్ఞలో ధర్మశాస్త్ర ఉద్దేశం పరిపూర్ణతకు చేరుతుందనే భావమూ దీనిలో ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న ఉపదేశానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఈ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πᾶς νόμος
  choice: ధర్మశాస్త్రమంతా
  rationale: ఏకవచనంలోని νόμος‌ను సమగ్రంగా సూచించే πᾶς బలాన్ని ఇది సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν ἑνὶ λόγῳ
  choice: ఈ ఒక్క మాటలో
  rationale: λόγος ఇక్కడ ఒకే పదాన్ని కాక, తరువాత ఉటంకించిన ఒక వాక్యాన్ని లేదా ఆజ్ఞను సూచిస్తుంది. తెలుగులో ‘ఒక్క మాట’ అనేది ఒక సంక్షిప్త వాక్కు లేదా ఆజ్ఞ అనే భావాన్నీ సహజంగా మోయగలదు.
- source_word: πεπλήρωται
  choice: నెరవేరింది
  rationale: పర్ఫెక్ట్ పాసివ్ రూపంలోని నెరవేర్పు భావాన్ని కాపాడుతుంది; కేవలం ‘సంగ్రహించబడింది’ అనే వ్యాఖ్యాత్మక అర్థానికి పరిమితం చేయదు.
- source_word: ἐν τῷ
  choice: 'ఈ ఒక్క మాటలో … :'
  rationale: గ్రీకు నిర్మాణం నెరవేర్పు ఏ వాక్యంలో ఉందో పరిచయం చేస్తుంది; తెలుగులో సూచనాత్మక ‘ఈ’ మరియు ద్విబిందువు దీనిని సహజంగా వ్యక్తం చేస్తాయి.
- source_word: Ἀγαπήσεις
  choice: ప్రేమించాలి
  rationale: లేవీయకాండము 19:18 నుండి వచ్చిన భవిష్యత్ సూచక క్రియ ఇక్కడ ఆజ్ఞార్థకంగా పనిచేస్తుంది; ఆధునిక తెలుగులో ‘ప్రేమించాలి’ స్పష్టమైన, గౌరవప్రదమైన ఆజ్ఞారూపం.
- source_word: τὸν πλησίον σου
  choice: నీ పొరుగువానిని
  rationale: నైతిక సందర్భంలో πλησίον‌కు సంప్రదాయబద్ధమైన ‘పొరుగువాడు’ సరైన సమానార్థకం; మూలంలోని ఏకవచనాన్ని నిలుపుతుంది.
- source_word: ὡς σεαυτόν
  choice: నిన్ను నీవు ప్రేమించుకున్నట్లే
  rationale: తెలుగులో కేవలం ‘నీవలె’ అన్నదానికంటే పోలికలో అంతర్లీనంగా ఉన్న ప్రేమ క్రియను స్పష్టంగా పునరుద్ఘాటించడం సహజంగా, అర్థవంతంగా ఉంటుంది.
theological_decisions:
- issue: ప్రేమ ఆజ్ఞతో ధర్మశాస్త్రానికి ఉన్న సంబంధం
  choice: ధర్మశాస్త్రమంతా ఈ ఆజ్ఞలో నెరవేరిందని అనువదించడం
  alternative: ధర్మశాస్త్రమంతా ఈ ఆజ్ఞలో సంగ్రహించబడిందని అనువదించడం
  rationale: πληρόω ప్రధానంగా నెరవేర్పును సూచిస్తుంది. ‘నెరవేరింది’ అనే పదం పౌలు వాడిన బలమైన భావాన్ని నిలుపుతూ, ధర్మశాస్త్రం రద్దయిందని గానీ అది కేవలం నైతిక భాగానికే పరిమితమని గానీ అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా లేఖనోచిత గౌరవభావంతో రూపొందించబడింది. ‘ధర్మశాస్త్రం,’ ‘పొరుగువాడు’ వంటి స్థిరపడిన బైబిలు పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సహజంగా ఉంచింది.
