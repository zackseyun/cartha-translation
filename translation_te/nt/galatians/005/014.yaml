revisions:
- from: 'ఎందుకంటే ధర్మశాస్త్రమంతా ఈ ఒక్క మాటలో నెరవేరింది[a][b]: “నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువానిని ప్రేమించాలి.”'
  to: 'ఎందుకంటే ధర్మశాస్త్రమంతా ఒకే వాక్యంలో నెరవేర్చబడింది[a][b]: “నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువానిని ప్రేమించాలి.”'
  rationale: The revision explicitly reflects the perfect passive πεπλήρωται with «నెరవేర్చబడింది» and uses «ఒకే వాక్యంలో» to communicate the contextual sense of λόγος as a saying or command. It preserves the Greek ambiguity regarding the precise implications of fulfillment and retains both audit-trail footnote anchors.
