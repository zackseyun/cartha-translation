id: GAL.5.11
reference: Galatians 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: te
  text: అయితే సహోదరులారా[a], నేను ఇంకా సున్నతిని ప్రకటిస్తున్నట్లయితే, ఇంకా ఎందుకు హింసకు గురవుతున్నాను? అలాగైతే సిలువ కలిగించే అభ్యంతరం[b] తొలగిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహోదర సహోదరీలారా”; గ్రీకులోని “సహోదరులు” అనే పదం స్త్రీపురుషులు కలిసిన సమూహాన్ని కూడా ఉద్దేశించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సిలువ అనే అడ్డంకి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: పుంలింగ బహువచన సంబోధనను నేరుగా, గౌరవప్రదంగా అందిస్తుంది; సందర్భంలో స్త్రీపురుషులిద్దరూ కలిసిన విశ్వాసుల సమూహాన్ని ఉద్దేశించవచ్చని పాదటిప్పణిలో తెలియజేయబడింది.
- source_word: περιτομήν
  choice: సున్నతిని
  rationale: యూద ధర్మాచరణకు గుర్తుగా ఉన్న ఆచారాన్ని సూచించే స్థిరమైన, నేరుగా అర్థమయ్యే తెలుగు పదం.
- source_word: ἔτι
  choice: ఇప్పటికీ / ఇంకా
  rationale: మూలంలో రెండుసార్లు వచ్చిన కాలసూచక భావాన్ని తెలుగులో ఆయా వాక్యాలకు సహజంగా ఉండే రెండు సమానార్థక రూపాలతో నిలుపుతుంది.
- source_word: κηρύσσω
  choice: ప్రకటిస్తున్నాను
  rationale: బహిరంగంగా సందేశాన్ని ప్రకటించే వర్తమానకాల క్రియాభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διώκομαι
  choice: హింసకు గురవుతున్నాను
  rationale: వర్తమాన కర్మణి రూపాన్నీ, సువార్త కారణంగా ఎదురయ్యే శత్రుత్వపూర్వక హింసనూ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄρα
  choice: అలాగైతే
  rationale: ముందున్న ఊహాత్మక ప్రశ్ననుంచి వచ్చే తార్కిక నిర్ధారణను సహజంగా కలుపుతుంది.
- source_word: κατήργηται
  choice: తొలగిపోయినట్టే
  rationale: పరిపూర్ణ కర్మణి రూపంలోని ఫలితస్థితిని, ఊహాత్మక వాదనలో పౌలు తీసుకొచ్చే నిర్ధారణతో కలిపి తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σκάνδαλον
  choice: అభ్యంతరం
  rationale: సిలువ సందేశం ప్రజల్లో కలిగించే అభ్యంతరాన్నీ తిరస్కారాన్నీ సూచిస్తుంది; ‘అడ్డంకి’ అనే మరింత రూపకాలంకారపూర్వక ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: σταυροῦ
  choice: సిలువ
  rationale: పౌలు వాడిన θεολογిక సందర్భంలో σταυρόςకు స్థిరమైన, నేరుగా అర్థమయ్యే తెలుగు సమానం.
theological_decisions:
- issue: మిశ్రమ శ్రోతల సమూహాన్ని ఉద్దేశించే ἀδελφοί
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: మూలంలోని పుంలింగ బహువచన సంబోధనను ప్రధాన పాఠ్యంలో నిలిపి, అది మిశ్రమ సమూహాన్ని కూడా ఉద్దేశించగలదనే భావాన్ని పాదటిప్పణిలో తెలిపింది.
- issue: σκάνδαλον τοῦ σταυροῦ యొక్క భావం
  choice: సిలువ కలిగించే అభ్యంతరం
  alternative: సిలువ అనే అడ్డంకి
  rationale: సున్నతిని తప్పనిసరి చేయని సిలువ సందేశం కలిగించే వ్యతిరేకతను ‘అభ్యంతరం’ సహజంగా తెలియజేస్తుంది; మూలంలోని తడబడేలా చేసే అడ్డంకి రూపకాన్ని ప్రత్యామ్నాయంగా పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా సంబోధనను, పౌలు వేసిన పదునైన అలంకారిక ప్రశ్నను నిలిపాం. మూలంలోని ఊహాత్మక తర్కాన్ని ‘అంటే … అలాగైతే’ నిర్మాణంతో సహజంగా వ్యక్తం చేశాం.
