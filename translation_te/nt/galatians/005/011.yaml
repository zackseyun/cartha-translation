revisions:
- from: అయితే సహోదరులారా[a], నేను ఇప్పటికీ సున్నతిని ప్రకటిస్తున్నానంటే, ఇంకా ఎందుకు హింసకు గురవుతున్నాను? అలాగైతే సిలువ కలిగించే అభ్యంతరం[b] తొలగిపోయినట్టే.
