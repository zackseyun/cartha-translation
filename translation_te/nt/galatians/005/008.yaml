  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: te
  text: ఈ ప్రేరేపణ మిమ్మల్ని పిలుస్తున్నవాని నుండి వచ్చినది కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ఒప్పింపు మిమ్మల్ని పిలుస్తున్నవాని నుండి వచ్చినది కాదు.”
    reason: πεισμονὴ అనే అరుదైన పదం ఒప్పింపు, ఒప్పించబడిన స్థితి, లేదా ప్రేరేపించే ప్రభావం అనే భావాలను సూచించవచ్చు.
lexical_decisions:
- source_word: πεισμονὴ
  choice: ఒప్పింపు
  rationale: అరుదైన ఈ నామవాచకం ఒప్పించే చర్యను లేదా ఒప్పించబడిన స్థితి/ఫలితాన్ని సూచించగలదు. ‘ఒప్పింపు’ మూలంలోని భావసారాన్ని అతిగా వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: ἐκ
  choice: నుండి వచ్చినది
  rationale: ἐκ మూలాన్ని లేదా ఉద్భవస్థానాన్ని సూచిస్తుంది. తెలుగులో ‘నుండి వచ్చినది’ ఆ సంబంధాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: మిమ్మల్ని పిలుస్తున్నవాని
  rationale: వర్తమాన కర్తరి కృదంతం నామవాచకంగా పనిచేస్తోంది. ‘పిలుస్తున్నవాని’ అనే రూపం కొనసాగుతున్న క్రియాభావాన్ని ఉంచుతూ, ఆ వ్యక్తిని ‘దేవుడు’ అని అనువాదంలో స్పష్టంగా చేర్చదు.
- source_word: οὐκ
  choice: కాదు
  rationale: పౌలు చేస్తున్న నిరాకరణను తెలుగులో నేరుగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మిమ్మల్ని పిలుస్తున్నవాని’ గుర్తింపు
  choice: మూలంలో ఉన్నట్లే వ్యక్తిని పేరుతో పేర్కొనకుండా ‘మిమ్మల్ని పిలుస్తున్నవాని’ అని అనువదించబడింది.
  alternative: ‘మిమ్మల్ని పిలుస్తున్న దేవుని’ అని వివరణాత్మకంగా విస్తరించడం.
  rationale: విస్తృత సందర్భంలో ఇది దేవుణ్ణి సూచించడం అత్యంత సహజమైనప్పటికీ, గ్రీకు వాక్యంలో ‘దేవుడు’ అనే నామవాచకం లేదు. అందువల్ల పాఠకుడు సందర్భం నుంచి సూచిత వ్యక్తిని గ్రహించేలా మూలంలోని వ్యక్తీకరణను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. అరుదైన గ్రీకు నామవాచకంలోని అస్పష్టతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా నిలిపాం.
