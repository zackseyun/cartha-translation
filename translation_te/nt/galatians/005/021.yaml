source:
  edition: SBLGNT
  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: te
  text: అసూయలు, మద్యపాన మత్తులు, విచ్చలవిడి విందులు[a], ఇంకా ఇలాంటివి. వీటి గురించి నేను మిమ్మల్ని హెచ్చరిస్తున్నాను; ఇంతకుముందు కూడా హెచ్చరించినట్లే, ఇలాంటి పనులు చేసేవారు దేవుని రాజ్యాన్ని వారసత్వంగా పొందరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అల్లరి ఉత్సవాలు’ లేదా ‘అదుపులేని విందులు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం తరచూ మద్యపానంతో ముడిపడిన అదుపులేని ఉత్సవాన్ని, మితిమీరిన అల్లరిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνοι
  choice: అసూయలు
  rationale: ఇతరులకు ఉన్న మేలును చూసి కలిగే కుళ్లు లేదా అసూయను సూచించే బహువచన నామవాచకం; మూలంలోని బహువచన రూపాన్ని నిలిపింది.
- source_word: μέθαι
  choice: మద్యమత్తులు
  rationale: మద్యం వల్ల కలిగే మత్తు స్థితులు లేదా తాగుబోతుతనపు సందర్భాలను సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κῶμοι
  choice: విచ్చలవిడి విందులు
  rationale: మద్యపానంతో తరచూ ముడిపడిన అదుపులేని ఉత్సవాలు, అల్లరి విందుల భావాన్ని తెలియజేస్తుంది; కేవలం లైంగిక అర్థానికి పరిమితం చేయదు.
- source_word: τὰ ὅμοια τούτοις
  choice: ఇంకా ఇలాంటివి
  rationale: జాబితా పేర్కొన్న దుష్కార్యాలకే పరిమితం కాదనే తెరచిన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἃ προλέγω ὑμῖν … καθὼς προεῖπον
  choice: వీటి గురించి నేను ఇంతకుముందు మిమ్మల్ని హెచ్చరించినట్లే ఇప్పుడు కూడా హెచ్చరిస్తున్నాను
  rationale: προλέγω యొక్క ‘ముందుగా చెప్పడం/హెచ్చరించడం’ అనే ఉపదేశాత్మక బలాన్ని, గత హెచ్చరికతో ప్రస్తుత హెచ్చరికకు ఉన్న సంబంధాన్ని సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: ఇలాంటి పనులు చేస్తూ ఉండేవారు
  rationale: ప్రస్తుత కాల అసమాపక క్రియ సూచించే లక్షణాత్మక లేదా కొనసాగుతున్న ప్రవర్తనను తెలియజేస్తుంది; ఒక్కసారి జరిగిన చర్యగా పరిమితం చేయదు.
- source_word: βασιλείαν θεοῦ οὐ κληρονομήσουσιν
  choice: దేవుని రాజ్యాన్ని వారసత్వంగా పొందరు
  rationale: రాజ్యం మరియు వారసత్వం అనే మూలపాఠంలోని భావచిత్రాన్నీ, భవిష్యత్తుకు సంబంధించిన హెచ్చరిక బలాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: ఈ హెచ్చరిక ఒక్కొక్క విడి చర్యను సూచిస్తుందా, లేక అలవాటైన జీవన ప్రవర్తనను సూచిస్తుందా?
  choice: ఇలాంటి పనులు చేస్తూ ఉండేవారు
  alternative: ఇలాంటి పనులు చేసేవారు
  rationale: πράσσοντες అనే ప్రస్తుత కాల అసమాపక క్రియ లక్షణాత్మకంగా లేదా కొనసాగింపుగా చేసే ప్రవర్తనను సహజంగా సూచిస్తుంది. అయితే ప్రతి ఒక్క విడి తప్పిదం గురించి పాఠానికి మించిన సిద్ధాంత నిర్ణయం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. దుష్కార్యాల జాబితాలోని బహువచన ధోరణిని సాధ్యమైనంతవరకు నిలిపి, పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం.
