    text: ‘అల్లరి ఉత్సవాలు’ లేదా ‘అదుపులేని విందులు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం తరచూ మద్యపానంతో ముడిపడిన అదుపులేని ఉత్సవాన్ని, మితిమీరిన అల్లరిని సూచిస్తుంది.
    reason: lexical_alternative
