  naturalness: వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, జాబితా ముగింపుకు తగిన గంభీరతతో ఉంది. «ఏ ధర్మశాస్త్రమూ లేదు» ఇక్కడ ‘ఏ ధర్మశాస్త్రమూ ఈ గుణాలకు విరోధం కాదు’ అనే సూక్తిరూప భావాన్ని స్పష్టంగా ఇస్తుంది.
