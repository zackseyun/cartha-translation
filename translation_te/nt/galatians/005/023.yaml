translation:
  language: te
  text: సౌమ్యత, ఆత్మనిగ్రహం; ఇలాంటివాటికి[a] వ్యతిరేకంగా ఏ ధర్మశాస్త్రమూ లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇలాంటి వారికి వ్యతిరేకంగా ఏ ధర్మశాస్త్రమూ లేదు.” గ్రీకు పదం ఇక్కడ లక్షణాలను గానీ, ఆ లక్షణాలు గల వ్యక్తులను గానీ సూచించగలదు; సందర్భంలో లక్షణాలనే సూచించడం ఎక్కువ సంభావ్యం.
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτης
  choice: సౌమ్యత
  rationale: కఠినత్వం లేని, వినయంతో కూడిన మృదుస్వభావాన్ని తెలిపే ఈ పదానికి ఆధునిక ప్రామాణిక తెలుగులో ‘సౌమ్యత’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: ἐγκράτεια
  choice: ఆత్మనిగ్రహం
  rationale: కోరికలు, ప్రేరణలు, ప్రవర్తనపై అదుపును సూచించే పదానికి ‘ఆత్మనిగ్రహం’ విస్తృతంగా అర్థమయ్యే సముచితమైన తెలుగు పదం.
- source_word: κατὰ τῶν τοιούτων
  choice: ఇలాంటివాటికి వ్యతిరేకంగా
  rationale: τοιούτων వ్యాకరణపరంగా వ్యక్తులను లేదా విషయాలను సూచించగలిగినా, సందర్భంలో ముందుగా పేర్కొన్న ఆత్మఫల లక్షణాలను సూచించడం ఎక్కువ సహజం; κατὰ లోని వ్యతిరేక భావాన్ని స్పష్టంగా ఉంచాం.
- source_word: νόμος
  choice: ఏ ధర్మశాస్త్రమూ
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం లేకపోవడంతో కేవలం మోషే ధర్మశాస్త్రానికే పరిమితం చేయకుండా విస్తృతమైన, సూక్తిరూప భావాన్ని నిలిపాం; గలతీయుల పత్రికలోని ధర్మశాస్త్ర నేపథ్యమూ ‘ధర్మశాస్త్రం’ అనే పదంలో నిలుస్తుంది.
theological_decisions:
- issue: νόμος యొక్క పరిధి
  choice: ‘ఏ ధర్మశాస్త్రమూ’ అని విస్తృతంగా అనువదించడం
  alternative: మోషే ధర్మశాస్త్రాన్ని నిర్దిష్టంగా సూచిస్తూ ‘ఆ ధర్మశాస్త్రం’ అని అనువదించడం
  rationale: ఈ పత్రికలో మోషే ధర్మశాస్త్ర నేపథ్యం స్పష్టంగా ఉన్నా, ఇక్కడ νόμος నిర్దిష్ట ఉపపదం లేకుండా ఉంది. అందువల్ల ఏ ధర్మశాస్త్రమూ ఇలాంటి సద్గుణాలకు విరోధం కాదనే విస్తృత భావాన్ని ఉంచుతూ, నిర్దిష్ట సూచనను బలవంతంగా చేర్చలేదు.
- issue: τοιούτων సూచించేది లక్షణాలనా, వ్యక్తులనా
  choice: ముందు చెప్పిన లక్షణాలను సూచించే ‘ఇలాంటివాటికి’
  alternative: ఆ లక్షణాలు గల వ్యక్తులను సూచించే ‘ఇలాంటి వారికి’
  rationale: నపుంసక/పుంలింగ రూపం ఇక్కడ రూపపరంగా ఒకేలా ఉండటంతో రెండూ సాధ్యమే; అయితే సమీప సందర్భంలోని ఆత్మఫల లక్షణాల జాబితా కారణంగా విషయాలనే సూచించడం ఎక్కువ సంభావ్యం. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యంలోని నైతిక గంభీరతను నిలిపే పదజాలం. జాబితా కొనసాగింపును సూచించేందుకు అల్పవిరామం, ముగింపు వ్యాఖ్యకు ముందు అర్ధవిరామం వాడాం.
