revisions:
- from: మనం అహంకారులుగా మారకుండా, ఒకరినొకరు రెచ్చగొట్టకుండా, ఒకరిపై ఒకరు అసూయపడకుండా ఉందాం.[a]
  to: మనం వ్యర్థగర్వులుగా[a] మారవద్దు; ఒకరినొకరు రెచ్చగొడుతూ, ఒకరిపట్ల ఒకరు అసూయపడుతూ ఉండవద్దు.
  rationale: The revision preserves the first-person plural prohibition (‘మారవద్దు’), gives κενόδοξοι its empty-glory nuance, and represents the final two forms as participial descriptions. The semicolon and the repeated Telugu negative verb make the sentence idiomatic without deciding more precisely than the Greek does how the participles relate logically to conceit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:01:46Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the hortatory prohibition in μὴ γινώμεθα and the reciprocal actions. However, rendering all three elements with -కుండా makes the participles look like independently coordinated prohibitions and weakens their descriptive participial form. κενόδοξοι is more specifically empty or groundless glory than generic ‘అహంకారం.’
  naturalness: The proposed revision uses natural modern standard Telugu. A semicolon permits the two participial behaviors to remain attendant descriptions without forcing an overly specific causal relation.
  terminology: ‘వ్యర్థగర్వులు’ directly represents κενόδοξοι (‘people characterized by empty glory’) while remaining understandable. ‘రెచ్చగొడుతూ’ suitably retains the broad provoking/challenging sense of προκαλούμενοι; ‘ఒకరిపట్ల ఒకరు అసూయపడుతూ’ naturally renders φθονοῦντες.
  issues:
  - severity: medium
    issue: The draft uses three parallel negative -కుండా clauses.
    rationale: The Greek has one prohibitive hortatory verb, followed by κενόδοξοι and two present participles. The Telugu construction can be read as three equally independent prohibitions rather than preserving the participial description.
  - severity: medium
    issue: ‘అహంకారులుగా’ is broader than κενόδοξοι.
    rationale: While not wrong in context, it can denote pride generally. ‘వ్యర్థగర్వులు’ retains the lexical element of empty, groundless glory.
  - severity: low
    issue: The footnote marker is placed at the end of the sentence rather than following its lexical referent.
    rationale: The footnote explains κενόδοξοι, so its anchor should immediately follow the Telugu expression that renders that word.
  revised_text: మనం వ్యర్థగర్వులుగా[a] మారవద్దు; ఒకరినొకరు రెచ్చగొడుతూ, ఒకరిపట్ల ఒకరు అసూయపడుతూ ఉండవద్దు.
  revised_footnotes:
  - marker: a
    text: ‘వ్యర్థగర్వులు’ అనే పదం మూల గ్రీకులో వ్యర్థమైన కీర్తిని కోరుకోవడం లేదా ఆధారంలేని స్వప్రాముఖ్యత కలిగి ఉండడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision preserves the first-person plural prohibition (‘మారవద్దు’), gives κενόδοξοι its empty-glory nuance, and represents the final two forms as participial descriptions. The semicolon and the repeated Telugu negative verb make the sentence idiomatic without deciding more precisely than the Greek does how the participles relate logically to conceit.
