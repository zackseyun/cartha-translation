base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/026.yaml
  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: te
  text: మనం వ్యర్థగర్వులుగా[a] మారవద్దు; ఒకరినొకరు రెచ్చగొడుతూ, ఒకరిపట్ల ఒకరు అసూయపడుతూ ఉండవద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వ్యర్థగర్వులు’ అనే పదం మూల గ్రీకులో వ్యర్థమైన కీర్తిని కోరుకోవడం లేదా ఆధారంలేని స్వప్రాముఖ్యత కలిగి ఉండడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: మనం … మారకుండా … ఉందాం
  rationale: మొదటి పురుష బహువచన వర్తమాన సుబ్జంక్టివ్‌తో కూడిన μή సమష్టి నిషేధాత్మక ప్రోత్సాహాన్ని తెలియజేస్తుంది. ‘మారకుండా … ఉందాం’ అనే రూపం ఆహ్వానాత్మక భావంతో పాటు γίνομαι లోని స్థితిలోకి రావడం అనే ఛాయను నిలుపుతుంది.
- source_word: κενόδοξοι
  choice: అహంకారులుగా
  rationale: κενόδοξος వ్యర్థమైన కీర్తి లేదా ఆధారంలేని స్వప్రాముఖ్యతతో నిండిన స్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అహంకారులు’ సహజంగా, స్పష్టంగా ఉంది; పదంలోని ‘వ్యర్థ కీర్తి’ వ్యుత్పత్తి భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: ἀλλήλους / ἀλλήλοις
  choice: ఒకరినొకరు / ఒకరిపై ఒకరు
  rationale: పరస్పర చర్యను తెలుగులో సహజంగా తెలియజేయడానికి, ఆయా క్రియల విభక్తి అవసరాలకు అనుగుణంగా ఈ రూపాలు వాడబడ్డాయి.
- source_word: προκαλούμενοι
  choice: రెచ్చగొట్టకుండా
  rationale: ఈ కృదంతం ఇతరులను పోటీకి లేదా ఘర్షణకు ప్రేరేపించడం, సవాలు చేయడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘రెచ్చగొట్టడం’ కేవలం చిరాకు పెట్టడం కంటే ఆ భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: φθονοῦντες
  choice: అసూయపడకుండా
  rationale: φθονέω మరొకరి పట్ల అసూయ కలిగి ఉండడాన్ని సూచిస్తుంది. ఈ ఎంపిక ఆధునిక తెలుగులో సహజమైనది, అలాగే ముందున్న కృదంతంతో సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రధాన ప్రోత్సాహంతో కృదంతాల సంబంధం
  choice: తెలుగులో మూడు నిషేధాత్మక అంశాలను సమాంతరంగా ఉంచి, రెచ్చగొట్టడం మరియు అసూయపడడం అహంకారంతో కలిసి కనిపించే ప్రవర్తనలని సూచించాం.
  alternative: ‘ఒకరినొకరు రెచ్చగొడుతూ, ఒకరిపై ఒకరు అసూయపడుతూ’ అని కృదంత రూపంలో మరింత పదానుసారంగా ఇవ్వవచ్చు.
  rationale: గ్రీకులో κενόδοξοι ప్రధాన విధేయపదం; తరువాతి కృదంతాలు దానితో కూడిన ప్రవర్తనలను వివరిస్తాయి. సహజమైన తెలుగుకోసం సమాంతర నిషేధ నిర్మాణం వాడినా, వాటి మధ్య ఖచ్చితమైన కారణ సంబంధాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన సమష్టి ప్రోత్సాహ శైలి వాడబడింది. ప్రధాన వాక్యంలో [a] గుర్తు సంబంధిత పదం తరువాత కాక వాక్యాంతంలో ఉంచడం కంటే, ప్రచురణ స్పష్టత కోసం తుది సవరణలో ‘అహంకారులుగా[a]’ వద్ద ఉంచడం ఉత్తమం; సమర్పిత పాఠ్యంలో మాత్రం అవసరమైన గుర్తు ఉంది.
