id: GAL.5.3
reference: Galatians 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: te
  text: 'సున్నతి చేయించుకునే ప్రతి మనిషికీ[a][b] నేను మళ్లీ సాక్ష్యమిస్తున్నాను: అతడు ధర్మశాస్త్రమంతటినీ పాటించడానికి బాధ్యుడు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రతి వ్యక్తికీ.’ గ్రీకులో ‘ప్రతి మనిషికీ’ అని ఉన్నా, అది ప్రతినిధి లేదా సాధారణ అర్థంలో వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సున్నతి పొందే’ లేదా ‘తనకు సున్నతి చేయించుకునే.’ గ్రీకు కృదంతాన్ని ఈ దగ్గరి అర్థాలతో అనువదించవచ్చు; ఈ వివాద సందర్భం సున్నతికి లోబడే వ్యక్తిని సూచిస్తుంది.
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థంగా ‘రుణస్థుడు’; అంటే, అతడు దానిని పాటించవలసిన బాధ్యతలో ఉన్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: సాక్ష్యమిస్తున్నాను
  rationale: ఈ క్రియ వ్యక్తిగతమైన గంభీర ధృవీకరణను సూచిస్తుంది. ‘సాక్ష్యమిస్తున్నాను’ దాని అధికారిక బలాన్ని నిలుపుతుంది; ‘హెచ్చరిస్తున్నాను’ సందర్భార్థాన్ని మాత్రమే ముందుకు తెచ్చి మూలంలోని సాక్ష్యభావాన్ని తగ్గిస్తుంది.
- source_word: δὲ
  choice: తెలుగులో ప్రత్యేక సంధాయక పదం లేకుండా వాక్యసంబంధం ద్వారా వ్యక్తీకరణ
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక, ముందటి వాక్యంతో స్వల్ప కొనసాగింపును సూచిస్తుంది. తెలుగులో ‘అయితే’ అనడం అనవసరమైన వ్యతిరేక భావాన్ని కలిగించవచ్చు; వాక్యక్రమమే సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: పునరుక్తి లేదా మరొకసారి గట్టిగా చెప్పడాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παντὶ ἀνθρώπῳ
  choice: ప్రతి మనిషికీ
  rationale: గ్రీకు ఏకవచన పంపిణీ భావాన్ని నిలుపుతూ, సందర్భంలో ప్రతినిధి/సాధారణ అర్థాన్ని కలిగిస్తుంది. ‘ప్రతి వ్యక్తికీ’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: περιτεμνομένῳ
  choice: సున్నతి చేయించుకునే
  rationale: వర్తమాన కృదంతం ఈ వివాద సందర్భంలో సున్నతికి లోబడుతున్న వ్యక్తిని సూచిస్తుంది. ఈ తెలుగు రూపం పుట్టుకతోనే సున్నతి పొందిన ప్రతి పురుషుణ్ణి సాధారణంగా ఉద్దేశిస్తున్నట్టు చెప్పకుండా, ఆ చర్యకు లోబడడాన్ని తెలియజేస్తుంది.
- source_word: ὀφειλέτης
  choice: బాధ్యుడు
  rationale: మూల నామవాచకం ‘రుణపడి ఉన్నవాడు’ అనే రూపకం ద్వారా విధిబద్ధతను సూచిస్తుంది. ఆధునిక తెలుగులో ‘బాధ్యుడు’ ఆ న్యాయ/మతపరమైన బద్ధతను సహజంగా తెలియజేస్తుంది; ఆర్థిక రుణంగా అపార్థం కాకుండా అక్షరార్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ὅλον τὸν νόμον
  choice: ధర్మశాస్త్రమంతటినీ
  rationale: ὅλον తెలిపే సంపూర్ణతను స్పష్టంగా నిలుపుతుంది. νόμος ఇక్కడ మోషే ధర్మశాస్త్రాన్ని సూచించే సందర్భోచిత బైబిలు పదంగా ‘ధర్మశాస్త్రం’ అని అనువదించబడింది.
- source_word: ποιῆσαι
  choice: పాటించడానికి
  rationale: అక్షరార్థం ‘చేయడానికి’ అయినప్పటికీ, ధర్మశాస్త్రంతో కలిసినప్పుడు విధేయతతో ఆచరించడాన్ని తెలుగులో ‘పాటించడం’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సున్నతి మరియు ధర్మశాస్త్రబద్ధత గురించి పౌలు మాటల పరిధి
  choice: గలతీయుల వివాద సందర్భంలో సున్నతి చేయించుకోవడానికి లోబడే వ్యక్తి ధర్మశాస్త్రమంతటినీ పాటించవలసిన బాధ్యతలోకి వస్తాడని వాక్యం చెబుతుంది.
  alternative: పసితనంలో సున్నతి పొందిన యూదులతో సహా సున్నతి పొందిన ప్రతి పురుషుని గురించి సాధారణ ప్రకటనగా అర్థం చేసుకోవడం.
  rationale: 5:2 తరువాత వచ్చే περιτεμνομένῳ అనే వర్తమాన కృదంతం, ఈ వివాదంలో సున్నతి చేయించుకోవాలని చూస్తున్న వారిని సందర్భానుసారంగా సూచిస్తుంది. ‘సున్నతి చేయించుకునే’ అనే అనువాదం మూలంలో స్పష్టంగా చెప్పని ఉద్దేశాన్ని జోడించకుండా ఈ సందర్భబలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన శైలి వాడబడింది. ‘సాక్ష్యమిస్తున్నాను,’ ‘ధర్మశాస్త్రమంతటినీ,’ ‘బాధ్యుడు’ అనే పదాలు పౌలు ప్రకటనలోని అధికారికతను నిలుపుతాయి. మూలంలోని సాధారణ లింగప్రయోగం, కృదంతపు భావపరిధి, ‘రుణస్థుడు’ అనే రూపకాన్ని పాదసూచికల్లో సంరక్షించాం.
