  to: 'ప్రభువులో మీ విషయమై నాకు నమ్మకం ఉంది: మీరు మరే అభిప్రాయాన్ని కలిగి ఉండరు[a]. అయితే మిమ్మల్ని కలవరపెడుతున్నవాడు, అతడు ఎవరో అయినా[b], తీర్పును మోస్తాడు.'
