id: GAL.5.10
reference: Galatians 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: te
  text: 'ప్రభువులో మీ విషయమై నాకు నమ్మకం ఉంది: మీరు మరే అభిప్రాయాన్ని కలిగి ఉండరు[a]. అయితే మిమ్మల్ని కలవరపెడుతున్నవాడు, అతడు ఎవరో అయినా[b], తీర్పును మోస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు వేరే విధంగా ఆలోచించరు.” గ్రీకు క్రియ సాధారణంగా ఆలోచించడమే కాకుండా ఒక నిర్దిష్ట దృక్పథం లేదా అభిప్రాయం కలిగి ఉండడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతడు ఎవరై ఉన్నా” లేదా “అతడు ఎవడైనా.”
    reason: alternative_reading
lexical_decisions:
- source_word: πέποιθα
  choice: నాకు నమ్మకం ఉంది
  rationale: పరిపూర్ణ కాల క్రియ ఇక్కడ స్థిరంగా కొనసాగుతున్న నమ్మకాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς ὑμᾶς
  choice: మీ విషయంలో
  rationale: గలతీయుల ప్రతిస్పందనను గురించి పౌలుకు ఉన్న నమ్మకాన్ని తెలియజేస్తుంది; ‘మీలో’ అనడం వల్ల కలిగే అసహజతను నివారిస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు నమ్మకానికి ప్రభువే పరిధి లేదా ఆధారం అనే సంబంధపూర్వక, వేదాంతపరమైన భావాన్ని నిలుపుతుంది.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: మీరు వేరే విధంగా ఆలోచించరు
  rationale: φρονέω సూచించే ఆలోచనా ధోరణి లేదా అభిప్రాయం అనే పరిధిని అతిగా నిర్దిష్టం చేయకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: ὁ δὲ ταράσσων ὑμᾶς
  choice: అయితే మిమ్మల్ని కలవరపెడుతున్నవాడు
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న కలవరపరిచే చర్యను స్పష్టంగా నిలుపుతుంది.
- source_word: βαστάσει
  choice: మోస్తాడు
  rationale: తీర్పును భరించడం అనే మూల రూపకాన్ని నిలుపుతుంది; దాని ఫలితాన్ని ముందుగానే శిక్షగా మాత్రమే నిర్దిష్టం చేయదు.
- source_word: τὸ κρίμα
  choice: ఆ తీర్పును
  rationale: κρίμαలోని తీర్పు, నిర్ణయం లేదా దాని పర్యవసానం అనే అర్థవిస్తృతిని కాపాడుతుంది; ‘శాశ్వత ఖండన’ అని అతిగా వ్యాఖ్యానించదు.
- source_word: ὅστις ἐὰν ᾖ
  choice: అతడు ఎవరైనా సరే
  rationale: వ్యక్తి గుర్తింపు లేదా హోదా ఏదైనా ఫలితం మారదనే అనిర్దిష్ట-అనుమతార్థక బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: గలతీయుల గురించి పౌలు వ్యక్తం చేసిన నమ్మకం స్వభావం
  choice: వారి భవిష్యత్తు ఆలోచనా ధోరణి గురించి పౌలుకు ఉన్న నమ్మకం ప్రభువులో ఆధారపడినదిగా అనువదించడం
  alternative: అందరూ తప్పక నిలిచిపోతారనే షరతులేని హామీగా లేదా కేవలం వ్యక్తిగత ఆశాభావంగా అనువదించడం
  rationale: పాఠ్యం వ్యక్తిగత నమ్మకాన్ని, ‘ప్రభువులో’ అనే దాని ఆధారాన్ని, భవిష్యత్తుపై నిరీక్షణను కలిపి ఉంచుతుంది; అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: τὸ κρίμα స్వభావం
  choice: కలవరపెట్టేవాడు ‘ఆ తీర్పును మోస్తాడు’ అని సాధారణ న్యాయతీర్పు భావాన్ని నిలుపడం
  alternative: దీనిని ప్రత్యేకంగా శాశ్వత ఖండనగా లేదా కేవలం సంఘశిక్షగా పేర్కొనడం
  rationale: ఈ వచనం తీర్పు యొక్క ఖచ్చిత రూపాన్ని నిర్వచించదు; అందువల్ల హెచ్చరిక తీవ్రతను నిలుపుతూ సిద్ధాంతపరమైన అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. మూలంలోని ‘ప్రభువులో’ మరియు ‘తీర్పును మోస్తాడు’ అనే సంబంధపూర్వక, రూపకాల భాషను నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
