revisions:
- from: అయితే మీరు ఆత్మ చేత నడిపించబడుతున్నట్లయితే,[a] ధర్మశాస్త్రానికి లోబడి ఉండరు.[b]
  to: కానీ మీరు ఆత్మచేత నడిపించబడుతున్నట్లయితే,[a] ధర్మశాస్త్రం అధీనంలో ఉండరు.[b]
  rationale: The revision removes redundant conditional phrasing and replaces a potentially compliance-oriented expression with ‘ధర్మశాస్త్రం అధీనంలో,’ which directly represents being under the law’s authority or jurisdiction. It retains the source’s passive, present-tense verbal sense and the contextual reference to the Spirit without adding interpretive material to the main text.
