id: GAL.5.18
reference: Galatians 5:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: te
  text: కానీ మీరు ఆత్మచేత నడిపించబడుతున్నట్లయితే,[a] ధర్మశాస్త్రం అధీనంలో ఉండరు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఆత్మచేత నడిపించబడితే.” వర్తమానకాల రూపం కొనసాగుతున్న నడిపింపును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ధర్మశాస్త్రం అధీనంలో” అంటే ధర్మశాస్త్రపు అధికారం లేదా అధికార పరిధి కింద ఉండడం; గలతీయులు 5:23తో పోల్చండి.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ
  choice: అయితే ...ట్లయితే
  rationale: షరతును సూచించే εἰ భావాన్ని సహజమైన తెలుగు షరతు నిర్మాణంతో తెలిపింది.
- source_word: δὲ
  choice: అయితే
  rationale: శరీర సంబంధమైన కోరికలకు, ఆత్మ నడిపింపుకు మధ్య ఉన్న స్వల్ప వ్యతిరేకతను సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: πνεύματι
  choice: ఆత్మ చేత
  rationale: దత్తివిభక్తి ఇక్కడ క్రియాశీల కర్తను సూచిస్తుంది; గలతీయులు 5:16–25 సందర్భంలో ఇది దేవుని ఆత్మను సూచిస్తుంది. తెలుగులో గౌరవసూచక పెద్ద అక్షర భేదం లేనందున సందర్భమే ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἄγεσθε
  choice: నడిపించబడుతున్నట్లయితే
  rationale: వర్తమానకాల నిష్క్రియార్థాన్ని, కొనసాగుతున్న నడిపింపును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὐκ ἐστὲ
  choice: ఉండరు
  rationale: రెండవ పురుష బహువచనంలోని నిరాకరణను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὑπὸ νόμον
  choice: ధర్మశాస్త్రానికి లోబడి
  rationale: ὑπό యొక్క అధీనత లేదా అధికార పరిధి భావాన్ని ‘లోబడి’ స్పష్టంగా తెలియజేస్తుంది; νόμος ఇక్కడ గలతీయుల సందర్భంలో మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది.
theological_decisions:
- issue: πνεύματι యొక్క సూచన
  choice: దేవుని ఆత్మ
  alternative: మానవ ఆత్మ
  rationale: గలతీయులు 5:16–25లో శరీర స్వభావం మరియు ఆత్మ మధ్య కొనసాగుతున్న వ్యత్యాసం, విశ్వాసులను నడిపించే దైవిక ఆత్మనే సూచిస్తుంది. ప్రధాన పాఠంలో మూలంలోని సంక్షిప్తతను కాపాడుతూ ‘ఆత్మ’ అని మాత్రమే ఉంచబడింది.
- issue: ὑπὸ νόμον యొక్క భావం
  choice: ధర్మశాస్త్రపు అధికారం లేదా అధికార పరిధికి లోబడి ఉండకపోవడం
  alternative: ఏ నియమానికీ లోబడి ఉండకపోవడం
  rationale: గలతీయుల పత్రికలో νόμος సాధారణ నియమాన్ని కాక మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది. అయినప్పటికీ వాక్యాన్ని విస్తృత సిద్ధాంత ప్రకటనగా మార్చకుండా మూలంలోని సంక్షిప్త వ్యత్యాసాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ధర్మశాస్త్రం’ అనే పదం పౌలు సందర్భంలోని మోషే ధర్మశాస్త్రాన్ని సాధారణ పాఠకునికి గుర్తించదగిన విధంగా తెలియజేస్తుంది. ప్రధాన వాక్యంలో ప్రతి పాదటిప్పణి గుర్తు [a], [b] చేర్చబడింది.
