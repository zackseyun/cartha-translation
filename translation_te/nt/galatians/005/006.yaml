id: GAL.5.6
reference: Galatians 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: te
  text: ఎందుకంటే మెస్సీయ యేసులో[a] సున్నతి పొందడం గానీ సున్నతి పొందకపోవడం గానీ దేనికీ విలువ లేదు; కానీ ప్రేమ ద్వారా పనిచేసే[c] విశ్వాసం[b] ప్రభావవంతంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు యేసులో.’ గ్రీకు Χριστός అంటే ‘మెస్సీయ’ లేదా ‘అభిషిక్తుడు’ అనే బిరుదు.
    reason: alternative_reading
  - marker: b
    text: గ్రీకు πίστις ను సందర్భానుసారం ‘నమ్మకం’ లేదా ‘విశ్వసనీయత’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ప్రేమ ద్వారా క్రియాశీలంగా ఉండే,’ ‘ప్రేమలో వ్యక్తమయ్యే,’ లేదా ‘ప్రేమ ద్వారా ప్రభావవంతమయ్యే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ అయిన యేసులో
  rationale: ἐν ను ‘లో’ అని ఉంచి, పౌలు చెప్పే క్రీస్తుతో ఐక్యత భావాన్ని కాపాడాం. Χριστός ఇక్కడ బిరుదుగా ఉన్నందున దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను వాడి, సహజమైన తెలుగు కోసం ‘అయిన’ను చేర్చాం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు కారణం లేదా వివరణను పరిచయం చేసే అనుసంధాన పదంగా సహజమైన ఆధునిక తెలుగును వాడాం.
- source_word: περιτομή / ἀκροβυστία
  choice: సున్నతి పొందడం / సున్నతి పొందకపోవడం
  rationale: మూలంలోని సమాంతర వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలిపే క్రియాత్మక నామరూపాలను ఎంచుకున్నాం.
- source_word: τι ἰσχύει
  choice: దేనికీ విలువ లేదు
  rationale: ఇక్కడ ἰσχύει శారీరక బలం కంటే ప్రాముఖ్యత, ప్రయోజనం లేదా ప్రభావాన్ని సూచిస్తుంది. ‘విలువ లేదు’ అనే ప్రయోగం ఆ భావాన్ని సాధారణ పాఠకునికి సహజంగా అందిస్తుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: πίστις కు ప్రధాన అనువాదంగా స్థిరమైన, విస్తృతంగా అర్థమయ్యే ‘విశ్వాసం’ను వాడాం; ‘నమ్మకం,’ ‘విశ్వసనీయత’ అనే సాధ్యమైన భావాలను పాదసూచికలో ఉంచాం.
- source_word: δι’ ἀγάπης
  choice: ప్రేమ ద్వారా
  rationale: జనిటివ్‌తో ఉన్న διά సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది; ‘ద్వారా’ ఆ సంబంధాన్ని అతిగా వివరించకుండా కాపాడుతుంది.
- source_word: ἐνεργουμένη
  choice: పనిచేసే
  rationale: వర్తమాన మధ్యమ/కర్మణి కృదంతంలోని క్రియాశీలత లేదా ప్రభావవంతంగా పనిచేయడం అనే భావాన్ని సరళంగా తెలుపుతుంది; మధ్యమ, కర్మణి మధ్యనున్న అస్పష్టతను పాదసూచికలో కాపాడాం.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ అయిన
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός యేసుకు బిరుదుగా పనిచేస్తుంది. ప్రధాన పాఠంలో బిరుదు అర్థాన్ని తెలిపి, తెలుగు క్రైస్తవ వాడుకలో స్థిరమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: πίστις యొక్క భావపరిధి
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ సందర్భంలో విశ్వాసి యొక్క విశ్వాసం ప్రేమ ద్వారా పనిచేస్తుందనే పఠనం సహజమైనది. అయినా మూలపదానికి ఉన్న ‘నమ్మకం,’ ‘విశ్వసనీయత’ భావాలను తొలగించకుండా పాదసూచికలో నమోదు చేశాం.
- issue: ἐνεργουμένη లోని మధ్యమ/కర్మణి అస్పష్టత
  choice: పనిచేసే
  alternative: క్రియాశీలంగా ఉండే; ప్రేమలో వ్యక్తమయ్యే; ప్రేమ ద్వారా ప్రభావవంతమయ్యే
  rationale: ‘పనిచేసే’ అనేది విశ్వాసం క్రియాశీలంగా ఉండటాన్ని తెలియజేస్తూ, అది స్వయంగా వ్యక్తమవుతోందా లేక ప్రభావవంతం చేయబడుతోందా అనే వ్యాకరణ సంబంధమైన ఉద్రిక్తతను ప్రధాన పాఠంలో బలవంతంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘సున్నతి పొందడం/పొందకపోవడం’ అనే సమాంతర నిర్మాణం మూలంలోని గుర్తింపు-వర్గాల వ్యత్యాసాన్ని నిలుపుతుంది. చివరి భాగంలో సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ‘విలువైనది’ని పూరించాం; ఇది ἀλλά తరువాత మూలంలో అధ్యాహారంగా ఉన్న ἰσχύει భావాన్ని స్పష్టం చేస్తుంది.
