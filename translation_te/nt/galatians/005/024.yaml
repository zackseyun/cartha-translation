  terminology: “మెస్సీయ” appropriately preserves Χριστός as a title, with “క్రీస్తు” supplied as a legitimate alternative. “శరీరం” preserves Paul’s metaphorical vocabulary rather than prematurely replacing it with the more interpretive “పాప స్వభావం.” Both footnotes are correctly anchored and useful.
