id: GAL.5.24
reference: Galatians 5:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ τοῦ ⸀Χριστοῦ τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: te
  text: అయితే మెస్సీయకు చెందినవారు[a] శరీరాన్ని[b] దాని ఉద్రేకాలతో, కోరికలతో సహా సిలువ వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తుకు చెందినవారు.’
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ ‘శరీరం’ అంటే కేవలం భౌతిక దేహం కాదు; ఆత్మకు విరుద్ధంగా ఉన్న పతిత మానవ స్వభావాన్ని సూచిస్తుంది. కొన్ని అనువాదాలు దీనిని ‘పాప స్వభావం’ అని అనువదిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... τοῦ Χριστοῦ
  choice: మెస్సీయకు చెందినవారు
  rationale: ఈ గ్రీకు నిర్మాణం మెస్సీయతో చెందిన సంబంధాన్ని సూచిస్తుంది. ‘చెందినవారు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, స్వామ్య/సంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ ఇక్కడ ముందున్న వాక్యాలతో స్వల్ప వ్యత్యాసాన్ని లేదా భావమార్పును సూచిస్తుంది. ‘అయితే’ ఆ అనుసంధానాన్ని అతిగా బలపరచకుండా తెలియజేస్తుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ యేసు యొక్క అభిషిక్తుని బిరుదును సూచించగలదు. అందువల్ల ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ను ఉంచి, పేరు వలె వాడుకలో ఉన్న ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చాం.
- source_word: σάρκα
  choice: శరీరాన్ని
  rationale: పౌలు వాడే ‘శరీరం’ అనే రూపక పదాన్ని నిలుపుకోవడం ద్వారా ఆత్మకు విరుద్ధంగా ఉన్న మానవ స్వభావం అనే భావంలోని వేదాంత ఉద్రిక్తతను కాపాడాం; వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: ἐσταύρωσαν
  choice: సిలువ వేశారు
  rationale: ఈ క్రియ నిర్ణయాత్మకంగా జరిగిన కార్యాన్ని సూచిస్తూ సిలువను స్పష్టంగా జ్ఞాపకం చేస్తుంది. దాని రూపక బలాన్ని తగ్గించి ‘చంపారు’ అని అనువదించలేదు.
- source_word: σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις
  choice: దాని ఉద్రేకాలతో, కోరికలతో సహా
  rationale: σύν సహచర్యాన్ని సూచిస్తుంది. πάθημα ఈ నైతిక సందర్భంలో శ్రమలను కాకుండా భావోద్వేగ ప్రేరణలను సూచిస్తుంది; ἐπιθυμία బలమైన కోరికలను సూచిస్తుంది. ‘దాని’ అనేది ఇవి శరీరానికి చెందినవని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: Χριστοῦ పదాన్ని బిరుదుగా లేదా పేరు వలె అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: మూలపదం ‘అభిషిక్తుడు’ అనే బిరుదును కలిగి ఉంది. ఆ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; పేరు వలె స్థిరపడిన రూపాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఇచ్చాం.
- issue: పౌలు నైతిక సందర్భంలో σάρξ అర్థం
  choice: శరీరం
  alternative: పాప స్వభావం
  rationale: ‘పాప స్వభావం’ సందర్భార్థాన్ని వివరిస్తుంది గాని, మూలంలోని రూపకాన్ని ముందుగానే పరిష్కరిస్తుంది. అందువల్ల ‘శరీరం’ను పాఠ్యంలో ఉంచి, భావాన్ని పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘సిలువ వేశారు’ అనే స్పష్టమైన రూపకాన్ని, ‘శరీరం’ అనే పౌలు పదజాలాన్ని నిలుపుకున్నాం. పాదసూచిక గుర్తులను అవి వివరించే పదాల వెంట ఉంచాం.
