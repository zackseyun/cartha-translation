  source_fidelity: 'The Telugu accurately represents the Greek: οἱ δὲ τοῦ Χριστοῦ is conveyed as “అయితే మెస్సీయకు చెందినవారు”; σάρκα remains “శరీరాన్ని”; ἐσταύρωσαν retains the explicit crucifixion image in “సిలువ వేశారు”; and σύν with πάθημασιν and ἐπιθυμίαις is naturally expressed by “దాని ఉద్రేకాలతో, కోరికలతో సహా.” The mild connective force of δέ is adequately conveyed by “అయితే,” without introducing a temporal sense.'
