id: GAL.5.19
reference: Galatians 5:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ⸀ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: te
  text: 'అయితే శరీర[a] క్రియలు స్పష్టంగా ఉన్నాయి: లైంగిక అనైతికత, అపవిత్రత, సిగ్గులేని విచ్చలవిడితనం,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పాప స్వభావపు క్రియలు.’ గ్రీకు పదానికి అక్షరార్థం ‘శరీరం’ (σάρξ); ఇక్కడ పౌలు దానిని పాపానికి లోనైన మానవ కోరికలు మరియు ధోరణిని సూచించే రూపకంగా ఉపయోగిస్తున్నాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: స్పష్టంగా కనిపిస్తాయి
  rationale: క్రియలు బహిరంగంగా గుర్తించదగినవని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: δέ
  choice: అయితే
  rationale: ముందటి వచనాల్లోని ఆత్మ–శరీర వ్యత్యాసాన్ని అతిశయింపజేయకుండా, స్వల్ప మార్పు లేదా వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: τὰ ἔργα
  choice: క్రియలు
  rationale: చేసే పనులు లేదా కార్యాలు అనే భావాన్ని సంక్షిప్తంగా తెలుపుతూ, తరువాత వచ్చే జాబితాతో సహజంగా సరిపోతుంది.
- source_word: τῆς σαρκός
  choice: శరీరపు
  rationale: పౌలు ఉపయోగించిన ‘శరీరం’ అనే రూపకాన్ని అలాగే ఉంచి, దానిని నేరుగా ‘పాప స్వభావం’గా వ్యాఖ్యానించి తేల్చివేయదు.
- source_word: ἅτινά ἐστιν
  choice: ': అవి'
  rationale: తదుపరి జాబితాను సహజమైన తెలుగు వాక్య నిర్మాణంలో పరిచయం చేస్తుంది.
- source_word: πορνεία
  choice: లైంగిక అనైతికత
  rationale: అనుచితమైన లైంగిక ప్రవర్తనను విస్తృతంగా సూచించే స్పష్టమైన ఆధునిక పదబంధం.
- source_word: ἀκαθαρσία
  choice: అపవిత్రత
  rationale: నైతిక అశుద్ధత భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἀσέλγεια
  choice: సిగ్గులేని విచ్చలవిడితనం
  rationale: హద్దులులేని, సిగ్గును విడిచిన స్వైర ప్రవర్తన అనే పదంలోని బలాన్ని కేవలం ఇంద్రియాసక్తికి పరిమితం చేయకుండా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: పౌలు నైతిక సందర్భంలో ఉపయోగించిన σάρξ అనువాదం
  choice: శరీరం
  alternative: పాప స్వభావం
  rationale: ఈ సందర్భంలో పదం రూపకంగా పతనమైన మానవ కోరికలు, దిశను సూచించినప్పటికీ, ‘శరీరం’ అని అనువదించడం పౌలు ఉద్దేశపూర్వకంగా ఉంచిన శరీరం–ఆత్మ వ్యత్యాసాన్ని, దాని వ్యాఖ్యాన సంబంధ ఉద్రిక్తతను కాపాడుతుంది. ప్రత్యామ్నాయ వివరణను పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో ఉంది. వచనం తరువాతి జాబితాలో కొనసాగుతున్నందున చివర కామాను ఉంచాం.
