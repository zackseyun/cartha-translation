  to: 'అయితే శరీర[a] క్రియలు స్పష్టంగా ఉన్నాయి: లైంగిక అనైతికత, అపవిత్రత, సిగ్గులేని విచ్చలవిడితనం,'
  rationale: The revision improves idiomatic Telugu and directly reflects the Greek predicate while preserving the source’s metaphorical “flesh” in the main text. The list remains open-ended, so the final comma is retained. The footnote remains an alternative interpretive rendering and is anchored to the word it explains.
