id: GAL.5.1
reference: Galatians 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: te
  text: స్వాతంత్ర్యం కోసం మెస్సీయ మనలను స్వతంత్రులుగా చేశాడు[a]. కాబట్టి స్థిరంగా నిలబడండి; మళ్లీ బానిసత్వపు కాడికి లోబడకండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్వాతంత్ర్యంలో మెస్సీయ మనలను స్వతంత్రులుగా చేశాడు.” ఆరంభంలోని దత్తివ్ పదబంధం సంక్షిప్తంగా ఉంది; దాన్ని దగ్గరి సంబంధమున్న ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మళ్లీ బానిసత్వపు కాడిలో చిక్కుకోకండి.” గ్రీకు క్రియ ఏదో ఒక దానికి లోబడడం లేదా దాని పట్టులో చిక్కుకోవడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: స్వాతంత్ర్యం కోసమే
  rationale: ఆరంభంలోని దత్తివు ప్రయోజనం లేదా ఫలితాన్ని సూచించే సంక్షిప్త నిర్మాణంగా గ్రహించవచ్చు. ‘కోసమే’ వాక్యంలోని ప్రధాన ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ అని ఇవ్వడం దాని యూదీయ అభిషిక్త-రాజు నేపథ్యాన్ని నిలుపుతుంది.
- source_word: ἠλευθέρωσεν
  choice: మనలను స్వతంత్రులుగా చేశాడు
  rationale: ἐλευθερόω అంటే విముక్తి కలిగించడం లేదా స్వతంత్రులను చేయడం. ఈ రూపం ముందున్న ἐλευθερίαతో ఉన్న పదసంబంధాన్ని తెలుగులో సాధ్యమైనంతగా ప్రతిబింబిస్తుంది.
- source_word: στήκετε
  choice: స్థిరంగా నిలబడండి
  rationale: వర్తమాన ఆజ్ఞారూపం కొనసాగుతున్న దృఢత్వాన్ని కోరుతుంది. ఈ తెలుగు ప్రయోగం ఆ ఉపదేశాత్మక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి ప్రకటననుంచి వచ్చే నిర్ధారణను సూచిస్తుంది.
- source_word: ζυγῷ δουλείας
  choice: బానిసత్వపు కాడికి
  rationale: ζυγός యొక్క కాడి రూపకాన్ని, δουλεία యొక్క బలమైన బానిసత్వ భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: ἐνέχεσθε
  choice: లోబడకండి
  rationale: ఈ సందర్భంలో క్రియ ఏదో ఒక దానికి లోబడి ఉండడం లేదా దాని పట్టులో చిక్కుకోవడం అనే భావాన్ని ఇస్తుంది. ‘కాడికి లోబడడం’ తెలుగులో రూపకానికి సహజంగా సరిపోతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మునుపటి స్థితికి తిరిగి వెళ్లడాన్ని నేరుగా సూచిస్తుంది.
theological_decisions:
- issue: Χριστόςను బిరుదుగా అనువదించాలా, సంప్రదాయ నామరూపంగా ఇవ్వాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: మూలంలో అభిషిక్తుడనే బిరుదు భావం ఉంది; ‘మెస్సీయ’ ఆ భావాన్ని, యూదీయ నేపథ్యాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: δουλεία యొక్క బలాన్ని ఎలా తెలియజేయాలి
  choice: బానిసత్వం
  alternative: దాస్యం / బంధనం
  rationale: స్వాతంత్ర్యానికి పూర్తి విరుద్ధమైన ఆధీన స్థితిని ‘బానిసత్వం’ అత్యంత స్పష్టంగా తెలియజేస్తుంది; ‘బంధనం’ కంటే మూలపదంలోని సామాజిక, వ్యక్తిగత ఆధీనతను బలంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘కాడి’ అనే సజీవ రూపకాన్ని నిలిపి, ‘స్థిరంగా నిలబడండి’ ద్వారా ఆజ్ఞ యొక్క కొనసాగుతున్న దృఢత్వాన్ని వ్యక్తం చేశాం.
