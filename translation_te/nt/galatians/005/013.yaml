id: GAL.5.13
reference: Galatians 5:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: te
  text: సోదరులారా[a], ఎందుకంటే మీరు స్వేచ్ఛకు పిలువబడ్డారు. అయితే మీ స్వేచ్ఛను శరీరానికి[b] అవకాశంగా[c] చేసుకోవద్దు; బదులుగా ప్రేమ ద్వారా ఒకరికొకరు సేవ చేయండి[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సోదరులారా” అని అనువదించిన గ్రీకు పుంలింగ బహువచన పదం ఇక్కడ స్త్రీలతో సహా విశ్వాస సమాజమంతటినీ ఉద్దేశిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “శరీరం” ఇక్కడ కేవలం భౌతిక దేహాన్ని కాక, దేవునికి విరుద్ధంగా మొగ్గుచూపే పతిత మానవ ప్రవృత్తులను సూచిస్తుంది. కొందరు దీనిని “పాప స్వభావం” అని అనువదిస్తారు.
    reason: alternative_reading
  - marker: c
    text: లేదా “శరీరానికి ఒక ఆధారంగా”; అంటే స్వార్థపూరితమైన పాప కోరికలు పనిచేయడానికి స్వేచ్ఛను ప్రారంభ స్థానంగా చేసుకోవద్దు.
    reason: lexical_alternative
  - marker: d
    text: “సేవ చేయండి” అని అనువదించిన గ్రీకు క్రియ “దాసుడు” అనే పదంతో సంబంధమున్నది; ఇతరుల సేవకు తనను తాను అర్పించుకోవడం అనే బలమైన భావం దీనిలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: మీరు
  rationale: స్పష్టంగా ఉన్న ద్వితీయ పురుష బహువచన సర్వనామాన్ని సహజమైన తెలుగులో నిలిపింది; ప్రత్యేకంగా ‘మీరే’ అనడం గ్రీకు ఉద్ఘాటనను అతిశయింపజేయవచ్చు.
- source_word: γὰρ
  choice: వాక్యసంబంధం ద్వారా వివరణాత్మక భావం
  rationale: ఇది ముందున్న వాదనకు వివరణాత్మక ఆధారం ఇస్తుంది. తెలుగులో ‘ఎందుకంటే’తో వాక్యం ప్రారంభిస్తే ఈ స్వతంత్ర పద్యంలో అసహజంగా ఉండవచ్చు; సందర్భ సంబంధాన్ని వాక్యక్రమం ద్వారా నిలిపాం.
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: స్వేచ్ఛ కోసం
  rationale: పిలుపు యొక్క లక్ష్యం లేదా ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది. రాజకీయ స్వాతంత్ర్యాన్ని సూచించగల ‘స్వాతంత్ర్యం’ కంటే ‘స్వేచ్ఛ’ ఈ సందర్భానికి సరిపోతుంది.
- source_word: ἐκλήθητε
  choice: పిలువబడ్డారు
  rationale: దైవిక పిలుపును సూచించే కర్మణి రూపాన్ని ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థనూ చొప్పించకుండా నేరుగా నిలిపింది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పుంలింగ బహువచన సంబోధనను నిలిపి, ఇది స్త్రీలతో సహా విశ్వాస సమాజమంతటికీ వర్తిస్తుందని పాదసూచికలో స్పష్టం చేసింది.
- source_word: μόνον
  choice: అయితే
  rationale: స్వేచ్ఛ ప్రకటనకు వెంటనే వచ్చే కీలక పరిమితి లేదా హెచ్చరికను సహజమైన తెలుగు విరుద్ధసంబంధంతో తెలియజేస్తుంది.
- source_word: μὴ...εἰς ἀφορμὴν
  choice: అవకాశంగా చేసుకోవద్దు
  rationale: ἀφορμήలోని సందర్భం, ఆధారం, ప్రారంభ స్థానం అనే భావాల్లో ఈ నైతిక హెచ్చరికకు ‘అవకాశం’ స్పష్టంగా, సహజంగా సరిపోతుంది.
- source_word: σάρξ
  choice: శరీర స్వభావం
  rationale: కేవలం భౌతిక దేహం అనే అపార్థాన్ని తగ్గిస్తూ, పౌలు వాడిన ‘శరీరం’ రూపకాన్ని పూర్తిగా ‘పాప స్వభావం’గా మార్చకుండా నిలిపింది.
- source_word: διὰ τῆς ἀγάπης
  choice: ప్రేమ ద్వారా
  rationale: διά + షష్ఠీ విభక్తిలోని సాధనార్థక భావాన్ని స్పష్టంగా నిలిపింది.
- source_word: δουλεύετε
  choice: సేవ చేయండి
  rationale: పరస్పర నైతిక ఆజ్ఞగా సహజంగా వినిపిస్తుంది; దాసునిగా సేవచేయడం అనే బలమైన మూలభావాన్ని పాదసూచికలో తెలిపింది.
- source_word: ἀλλήλοις
  choice: ఒకరికొకరు
  rationale: పరస్పర సర్వనామానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: మిశ్రమ విశ్వాస సమాజాన్ని ఉద్దేశించిన ἀδελφοί
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: వ్యాకరణపరమైన పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సందర్భానుసార సమగ్ర వర్తింపును పాదసూచికలో వివరిస్తుంది.
- issue: పౌలు నైతిక సందర్భంలో σάρξ
  choice: శరీర స్వభావం
  alternative: పాప స్వభావం
  rationale: ఇది కేవలం భౌతిక శరీరాన్ని సూచించదు; అయినా ‘పాప స్వభావం’ అని మాత్రమే అనువదిస్తే పౌలు పదంలోని రూపకం మరియు అర్థ ఉద్రిక్తత కనుమరుగవుతాయి.
- issue: δουλεύετεలోని దాస్య-సేవ భావం
  choice: సేవ చేయండి
  alternative: దాసులుగా ఉండండి
  rationale: తెలుగులో పరస్పర సేవ ఆజ్ఞను స్పష్టంగా ఇస్తూ, దాసునిలా తనను అర్పించుకునే బలమైన భావాన్ని పాదసూచిక ద్వారా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘స్వాతంత్ర్యం’కు బదులు రాజకీయ అర్థభారం తక్కువగా ఉన్న ‘స్వేచ్ఛ’ను వాడాం. ‘శరీర స్వభావం’ అనే పదబంధం పౌలు రూపకాన్ని నిలిపి, అది భౌతిక దేహం మాత్రమే కాదని సూచిస్తుంది.
