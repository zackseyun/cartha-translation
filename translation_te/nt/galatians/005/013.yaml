  to: సోదరులారా[a], ఎందుకంటే మీరు స్వేచ్ఛకు పిలువబడ్డారు. అయితే మీ స్వేచ్ఛను శరీరానికి[b] అవకాశంగా[c] చేసుకోవద్దు; బదులుగా ప్రేమ ద్వారా ఒకరికొకరు సేవ చేయండి[d].
