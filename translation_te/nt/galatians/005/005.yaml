  text: ἡμεῖς γὰρ πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/005.yaml
  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: te
  text: ఎందుకంటే మనం ఆత్మ ద్వారా[a], విశ్వాసం ఆధారంగా[b], నీతి గురించిన నిరీక్షణను[c] ఆతృతగా ఎదురుచూస్తున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆత్మలో.’ గ్రీకు దత్తివిభక్తి ఇక్కడ సాధనాన్ని (‘ఆత్మ ద్వారా’) లేదా పరిధిని (‘ఆత్మలో’) సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘విశ్వాసం నుండి.’ πίστις అనే గ్రీకు పదానికి సందర్భాన్ని బట్టి ‘విశ్వాసం,’ ‘నమ్మకం,’ లేదా ‘విశ్వసనీయత’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఈ గ్రీకు పదబంధాన్ని ‘ఎదురుచూస్తున్న నీతి’ అని కూడా అర్థం చేసుకోవచ్చు. ‘నీతి’కి ‘న్యాయం’ అనే భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: మనం
  rationale: మొదటి పురుష బహువచన సర్వనామం. గ్రీకులో కొంత ఉద్ఘాటన ఉన్నప్పటికీ, ఆధునిక తెలుగులో సహజమైన ‘మనం’ దానిని సందర్భానుసారంగా సరిపడా తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందరి వాక్యానికి కారణం లేదా వివరణను అనుసంధానించే పదం; పౌలు వాదనలోని సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: πνεύματι
  choice: ఆత్మ ద్వారా
  rationale: దత్తివిభక్తి సాధనం లేదా పరిధిని సూచించవచ్చు. గలతీయులు 5 సందర్భంలో పరిశుద్ధాత్మ ఉద్దేశించబడే అవకాశం బలంగా ఉంది; ప్రధాన పాఠంలో సాధనార్థక భావాన్ని తీసుకున్నాం.
- source_word: ἐκ πίστεως
  choice: విశ్వాసం ఆధారంగా
  rationale: ἐκ మూలం లేదా ఆధారాన్ని సూచిస్తుంది. ‘విశ్వాసం ఆధారంగా’ అనేది తెలుగులో సహజంగా ఉండి, కేవలం సాధనార్థక భావానికి పరిమితం చేయకుండా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐλπίδα
  choice: నిరీక్షణ
  rationale: ἀπεκδεχόμεθα క్రియకు కర్మ. ఇక్కడ భవిష్యత్తులో లభించబోయేదానిపై ఆశతో కూడిన ఎదురుచూపును సూచిస్తుంది.
- source_word: δικαιοσύνης
  choice: నీతి విషయమైన
  rationale: δικαιοσύνηకి పౌలు రచనల సందర్భంలో ‘నీతి’ ప్రధాన అనువాదం. షష్ఠీవిభక్తి సంబంధాన్ని ఒకే విధంగా ఖరారు చేయకుండా ‘విషయమైన’ అని ఉంచాం.
- source_word: ἀπεκδεχόμεθα
  choice: ఆతృతగా ఎదురుచూస్తున్నాం
  rationale: ఈ క్రియలో బలమైన, సహనంతో కూడిన ఎదురుచూపు ఉంది. ‘ఆతృతగా ఎదురుచూస్తున్నాం’ దాని తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: πνεύματι ఎవరిని లేదా దేనిని సూచిస్తుంది
  choice: పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: మానవ ఆత్మ
  rationale: ధర్మశాస్త్రం, శరీరం, ఆత్మ మధ్య గలతీయులు 5లో ఉన్న వ్యత్యాసం పరిశుద్ధాత్మనే సూచిస్తుందని బలపరుస్తుంది. అయినా తెలుగు ప్రధాన పాఠంలో వివరణాత్మకంగా ‘పరిశుద్ధ’ అనే పదాన్ని చేర్చకుండా మూలంలోని సంక్షిప్త రూపాన్ని నిలిపాం.
- issue: πνεύματι దత్తివిభక్తి భావం
  choice: 'సాధనం: ‘ఆత్మ ద్వారా’'
  alternative: 'పరిధి: ‘ఆత్మలో’'
  rationale: రెండు వ్యాకరణ భావాలూ సాధ్యమే. ప్రధాన పాఠంలో సాధనార్థక భావాన్ని ఎంచుకొని, పరిధి భావాన్ని పాదసూచికలో ఉంచాం.
- issue: ἐλπίδα δικαιοσύνης సంబంధం
  choice: ‘నీతి విషయమైన నిరీక్షణ’ అని సంబంధాన్ని విస్తృతంగా ఉంచడం
  alternative: ‘రాబోయే నీతి’ లేదా ‘నీతి కలిగించే నిరీక్షణ’
  rationale: ఇది ఎదురుచూస్తున్న నీతిని సూచించవచ్చు; లేదా నీతితో మరో సంబంధాన్ని కలిగి ఉండవచ్చు. ప్రధాన పాఠం ఆ షష్ఠీవిభక్తి సంబంధాన్ని పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే వాక్యనిర్మాణం వాడబడింది. ‘నీతి విషయమైన నిరీక్షణ’ కొద్దిగా సాంద్రమైన పదబంధమే అయినా, మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను అతిగా వివరణ చేయకుండా కాపాడుతుంది.
