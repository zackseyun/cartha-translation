id: GAL.5.2
reference: Galatians 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: te
  text: 'ఇదిగో—పౌలునైన నేను మీకు చెబుతున్నాను: మీరు సున్నతి చేయించుకుంటే[a], మెస్సీయ[b] మీకు ఏమాత్రం ప్రయోజనం కలిగించడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు సున్నతి జరిగితే”; లేదా, “మీరు సున్నతి చేయించుకోవడానికి ఒప్పుకుంటే.”
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు: “క్రీస్తు”; Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున “మెస్సీయ” అని అనువదించబడింది.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: చూడండి
  rationale: ఇది దృష్టిని ఆకర్షించి, వెంట వచ్చే హెచ్చరికను నొక్కిచెప్పే ప్రయోగం. ఆధునిక తెలుగులో ‘చూడండి’ సహజంగా ఉండి ఆ బలాన్ని నిలుపుతుంది.
- source_word: ἐγὼ Παῦλος
  choice: పౌలునైన నేను
  rationale: గ్రీకులో సర్వనామంతో పాటు పేరును స్పష్టంగా వాడటం వల్ల కలిగే స్వీయ గుర్తింపు, ఉద్ఘాటన తెలుగులోనూ నిలిచేలా అనువదించబడింది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: పౌలు నేరుగా పాఠకులను ఉద్దేశించి చెప్పే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐὰν περιτέμνησθε
  choice: మీరు సున్నతి చేయించుకుంటే
  rationale: వర్తమాన కర్మణి సంభావనార్థక రూపం సున్నతి క్రియకు లోబడటాన్ని సూచిస్తుంది. ‘చేయించుకుంటే’ అనేది ఆ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; సందర్భం ప్రకారం ఇది ధార్మిక నిబంధనగా సున్నతిని స్వీకరించడాన్ని సూచిస్తుంది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός యేసు యొక్క అభిషిక్తుడు/మెస్సీయ అనే బిరుదు భావంతో పనిచేస్తుంది; అందువల్ల బిరుదు అర్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οὐδὲν ὠφελήσει
  choice: మీకు ఏమాత్రం ప్రయోజనం కలిగించడు
  rationale: οὐδέν తెలిపే సంపూర్ణ నిరాకరణను ‘ఏమాత్రం’ స్పష్టంగా తెలియజేస్తుంది; భవిష్యత్ క్రియ భావం కూడా నిలిచింది.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాక్యంలో బిరుదు భావం సజీవంగా ఉంది. ‘మెస్సీయ’ అనడం దానిని అనవసరంగా వ్యక్తినామంలా మార్చకుండా మూలార్థాన్ని నిలుపుతుంది.
- issue: సున్నతి గురించి పౌలు చేసిన హెచ్చరిక పరిధి
  choice: వాక్యాన్ని సందర్భానుసారమైన ధార్మిక హెచ్చరికగా ఉంచడం
  alternative: వైద్య, జాతి, లేదా ఇతర కారణాలతో జరిగే ప్రతి సున్నతినీ సార్వత్రికంగా ఖండిస్తున్నట్లు విస్తరించడం
  rationale: గలతీయులకు రాసిన పత్రికలోని తక్షణ సందర్భం నీతిమంతులుగా తీర్చబడటానికి ధర్మశాస్త్ర సంబంధమైన బాధ్యతగా సున్నతిని స్వీకరించడం గురించి. ప్రధాన పాఠం గ్రీకు వాక్యానికి దగ్గరగా ఉండి, పౌలు మాటకు మించిన వివరణను అందులో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. దీర్ఘమైన వివరణను ప్రధాన పాఠంలో చేర్చకుండా, పౌలు హెచ్చరికలోని నేరుతనాన్ని డాష్ మరియు ద్విబిందువుతో నిలిపాం. ‘పౌలునైన నేను’ అనే రూపం గ్రీకు స్వీయ ఉద్ఘాటనను సహజంగా మోస్తుంది.
