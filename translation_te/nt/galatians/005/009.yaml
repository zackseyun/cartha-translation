lexical_decisions:
- source_word: μικρὰ
  choice: కొంచెం
  rationale: ఇక్కడ పరిమాణం కొద్దిగా ఉండడాన్ని సూచిస్తుంది; సామెత ధోరణిలో సహజంగా ఉంటుంది.
- source_word: ζύμη
  choice: పులిసిన పిండి
  rationale: ప్రాచీన పిండిని పులియబెట్టే పదార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, పులియబెట్టే రూపకాన్ని నిలుపుతుంది.
- source_word: ὅλον
  choice: అంతటినీ
  rationale: దాని ప్రభావం మొత్తం పిండి ముద్దపై ఉంటుందనే సంపూర్ణతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: φύραμα
  choice: పిండి ముద్ద
  rationale: కలిపి ముద్దగా చేసిన పిండిని సూచించే స్పష్టమైన, సహజమైన తెలుగు పదబంధం.
- source_word: ζυμοῖ
  choice: పులియజేస్తుంది
  rationale: పులిసేలా చేయడం అనే causative అర్థాన్ని నేరుగా అందించి, సామెత యొక్క సంక్షిప్త బలాన్ని కాపాడుతుంది.
theological_decisions:
- issue: సామెతలోని రూపకార్థం
  choice: పులిసిన పిండి, పిండి ముద్ద అనే దృశ్యరూపాన్ని అలాగే ఉంచడం
  alternative: కొద్దిపాటి తప్పుడు బోధ సంఘమంతటా వ్యాపిస్తుంది
  rationale: సందర్భంలో ఇది చెడు ప్రభావం వ్యాపించడాన్ని హెచ్చరిస్తున్నప్పటికీ, ఈ వచనం ఆ అన్వయాన్ని వివరించకుండా సామెతనే చెబుతుంది. అందువల్ల వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన సామెత ధోరణి. ‘పులిసిన పిండి’ సాధారణ పాఠకునికి సహజంగా ఉండి, మూలంలోని పులియబెట్టే పదార్థం–పిండి ముద్ద దృశ్యాన్ని నిలుపుతుంది.
