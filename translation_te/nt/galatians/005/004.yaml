  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατηργήθητε ⸀ἀπὸ Χριστοῦ οἵτινες ἐν νόμῳ δικαιοῦσθε, τῆς χάριτος ἐξεπέσατε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: te
  text: ధర్మశాస్త్రం ద్వారా నీతిమంతులుగా తీర్చబడాలని కోరుతున్న మీరు మెస్సీయ నుండి వేరైపోయారు[a]; కృప నుండి పడిపోయారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మెస్సీయతో సంబంధం తెగిపోయింది’ లేదా ‘మెస్సీయ నుండి వేరుచేయబడ్డారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కృప నుండి తప్పిపోయారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθητε
  choice: వేరైపోయారు
  rationale: καταργέω అనే క్రియ ἀπὸ Χριστοῦతో కలిసి ఇక్కడ మెస్సీయతో ఉన్న సంబంధం నుండి వేరుపడడాన్ని సూచిస్తుంది. ‘వేరైపోయారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, గ్రీకు వాక్యంలోని తీవ్రమైన సంబంధార్థాన్ని నిలుపుతుంది.
- source_word: ἀπὸ Χριστοῦ
  choice: మెస్సీయ నుండి
  rationale: ἀπό వేరుపడటాన్ని సూచిస్తుంది; Χριστός ఇక్కడ అభిషిక్త రక్షకుని బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
- source_word: οἵτινες
  choice: మీరంతా
  rationale: ధర్మశాస్త్రం ద్వారా నీతిమంతులుగా తీర్చబడాలని కోరుతున్న శ్రోతల వర్గాన్ని నేరుగా సంబోధించే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν νόμῳ
  choice: ధర్మశాస్త్రం ద్వారా
  rationale: ἐν ఇక్కడ సాధనం లేదా ఆధారాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం ద్వారా’ అనేది ధర్మశాస్త్ర ఆచరణ ఆధారంగా నీతిమంతులుగా తీర్చబడటమనే పౌలు వాదనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: δικαιοῦσθε
  choice: నీతిమంతులుగా తీర్చబడాలని కోరుతున్నారు
  rationale: రూపపరంగా ఇది వర్తమాన కర్మణి ప్రయోగం. అయితే సందర్భంలో పౌలు నిజంగా వారు నీతిమంతులుగా తీర్చబడుతున్నారని ధృవీకరించడం కాక, ధర్మశాస్త్రం ఆధారంగా అలా తీర్చబడాలని ప్రయత్నిస్తున్న వారిని ఉద్దేశిస్తున్నాడు. ఈ ఎంపిక ఆ వాదనాత్మక భావాన్ని వ్యక్తం చేస్తూ కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: τῆς χάριτος
  choice: కృప నుండి
  rationale: ἐκπίπτωతో వచ్చే షష్ఠీ విభక్తి వేరుపడిన దానిని సూచిస్తుంది; తెలుగులో ‘కృప నుండి’ సహజమైన రూపం.
- source_word: ἐξεπέσατε
  choice: తొలగిపోయారు
  rationale: ἐκπίπτωలోని ఏదో స్థానం లేదా పరిధి నుండి పడిపోవడం/బయటపడడం అనే రూపకాన్ని ‘తొలగిపోయారు’ సహజంగా తెలియజేస్తుంది; ఇది హెచ్చరిక తీవ్రతను తగ్గించదు.
theological_decisions:
- issue: ఈ వాక్యం రక్షణను కోల్పోవడాన్ని బోధిస్తుందా, లేక కృప అనే ఆధారాన్ని విడిచిపెట్టడాన్ని మాత్రమే సూచిస్తుందా?
  choice: ‘మెస్సీయ నుండి వేరైపోయారు; కృప నుండి తొలగిపోయారు’ అనే ప్రత్యక్ష హెచ్చరికను నిలుపడం
  alternative: ‘కృప మార్గాన్ని విడిచిపెట్టారు’ అని భావవ్యాఖ్యాత్మకంగా లేదా ‘మెస్సీయతో సంబంధం బలహీనపడింది’ అని మృదువుగా అనువదించడం
  rationale: గ్రీకు పాఠం తీవ్రమైన వేరుపాటు భాషను ఉపయోగిస్తుంది, కానీ దాని వ్యవస్థీకృత సిద్ధాంతపరమైన పరిణామాన్ని వివరించదు. అందువల్ల అనువాదం హెచ్చరిక తీవ్రతను నిలుపుతూ, రక్షణ కోల్పోవడం గురించిన సంప్రదాయాల మధ్య వివాదాన్ని తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధన వాడబడింది. ‘నీతిమంతులుగా తీర్చబడడం’ న్యాయస్థాన సంబంధమైన δικαιόω భావాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా నిలుపుతుంది. ‘మెస్సీయ’ను బిరుదుగా ఉపయోగించాం; వాక్యంలోని తీవ్రతను మృదువుపరచలేదు.
