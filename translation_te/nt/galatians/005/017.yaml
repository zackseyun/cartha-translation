id: GAL.5.17
reference: Galatians 5:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: te
  text: ఎందుకంటే శరీరం ఆత్మకు విరుద్ధమైనదాన్ని కోరుతుంది; ఆత్మ శరీరానికి విరుద్ధమైనదాన్ని కోరుతుంది.[a] ఎందుకంటే ఇవి పరస్పరం విరోధంగా ఉన్నాయి, మీరు చేయాలని కోరుకునేవాటిని చేయకుండా ఉండేలా.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఆత్మ’ అనేది సందర్భానుసారం పరిశుద్ధాత్మను సూచించే అవకాశం బలంగా ఉంది; లేదా మానవ ఆత్మ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఫలితంగా మీరు చేయాలని కోరుకునేవాటిని చేయరు.’ గ్రీకు వాక్య నిర్మాణాన్ని ఉద్దేశార్థంగా లేదా ఫలితార్థంగా గ్రహించవచ్చు.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: σὰρξ
  choice: శరీరం
  rationale: పౌలు ఉపయోగించిన రూపకాన్ని నిలుపుతూ, దానిని ముందుగానే ‘పాప స్వభావం’ అనే వ్యాఖ్యానంగా పరిమితం చేయకుండా ఉండేందుకు ‘శరీరం’ ఎంచుకున్నాం. ఇక్కడ ఇది కేవలం భౌతిక దేహం కంటే విస్తృతమైన నైతిక భావాన్ని కలిగి ఉంది.
- source_word: ἐπιθυμεῖ
  choice: కోరుతుంది
  rationale: తీవ్రమైన అభిలాషను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వ్యతిరేక దిశను κατά నిర్మాణం తెలిపేందున అదనపు భావాన్ని చేర్చదు.
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: ఆత్మకు విరుద్ధమైనదాన్ని / శరీరానికి విరుద్ధమైనదాన్ని
  rationale: κατά + షష్ఠీ విభక్తి తెలిపే వ్యతిరేకతను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ἐπιθυμεῖతో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: సందర్భం పరిశుద్ధాత్మను బలంగా సూచించినా, తెలుగులో అక్షరాల పెద్ద/చిన్న రూపంతో ఆ భేదాన్ని చూపలేము. అందుచేత మూలంలోని పదాన్ని ‘ఆత్మ’గా ఉంచి, సాధ్యమైన సూచనను పాదటీకలో తెలిపాం.
- source_word: ἀλλήλοις ἀντίκειται
  choice: ఒకదానినొకటి ఎదిరిస్తాయి
  rationale: పరస్పర విరోధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα μὴ
  choice: అందువల్ల ... చేయలేరు
  rationale: ఈ సందర్భంలో పరస్పర విరోధం వల్ల కలిగే ఆచరణాత్మక ఫలితాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకు నిర్మాణంలో ఉద్దేశం/ఫలితం మధ్య ఉన్న స్వల్ప అనిశ్చితిని పాదటీకలో నిలిపాం.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: మీరు చేయాలనుకునేవాటిని చేయలేరు
  rationale: అనిర్దిష్ట సంబంధవాచక నిర్మాణాన్ని తెలుగులో స్పష్టంగా అందిస్తూ, ποιέωకు మించిన అలవాటు లేదా నిరంతర ఆచరణ భావాన్ని చేర్చదు.
theological_decisions:
- issue: పౌలు నైతిక సందర్భంలో σάρξ అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘శరీరం’ అని ఉంచడం
  alternative: ‘పాప స్వభావం’
  rationale: ఇక్కడ నైతిక భావం స్పష్టమైనప్పటికీ, ‘శరీరం’ పౌలు రూపకాన్నీ దాని విస్తృత భావ పరిధినీ కాపాడుతుంది; ‘పాప స్వభావం’ ఒక సాధ్యమైన వ్యాఖ్యాన వివరణ మాత్రమే.
- issue: πνεῦμα దేనిని సూచిస్తుంది
  choice: ‘ఆత్మ’ అని అనువదించి, సందర్భంలో పరిశుద్ధాత్మ అనే అర్థాన్ని పాదటీకలో సూచించడం
  alternative: మానవ ఆత్మ
  rationale: గలతీయులు 5 పరిసర సందర్భం పరిశుద్ధాత్మను సూచిస్తుంది. అయితే మూల గ్రీకులో అక్షరాల ద్వారా ఈ భేదం నిర్ధారించబడదు; తెలుగులోనూ పెద్ద అక్షరంతో సూచించే వీలు లేదు. కాబట్టి నిజమైన వ్యాఖ్యాన ప్రత్యామ్నాయాన్ని పాదటీకలో నిలిపాం.
- issue: ἵνα μὴ యొక్క ఉద్దేశం లేదా ఫలితం
  choice: ‘అందువల్ల ... చేయలేరు’ అనే ఫలితార్థ అనువాదం
  alternative: ‘మీరు కోరినవి చేయకుండా ఉండేందుకు’ అనే ఉద్దేశార్థ అనువాదం
  rationale: ఈ వాక్యంలో శరీరం–ఆత్మ పరస్పర విరోధం విశ్వాసి సంకల్పాన్ని అడ్డుకునే ఫలితమే ప్రధానంగా కనిపిస్తుంది. అయినప్పటికీ ἵνα నిర్మాణం ఉద్దేశార్థంగా కూడా గ్రహించవచ్చు; అందువల్ల ప్రత్యామ్నాయాన్ని పాదటీకలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘శరీరం’ అనే పౌలు రూపకాన్ని నిలిపి, అది కేవలం భౌతిక దేహాన్ని సూచిస్తుందనే అపార్థాన్ని నివారించేందుకు వివరణాత్మక నిర్ణయాన్ని నమోదు చేశాం. ప్రధాన పాఠ్యంలో రెండు విరుద్ధ కోరికల సమాంతర నిర్మాణాన్ని కాపాడాం.
