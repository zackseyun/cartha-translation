revisions:
- from: ఎందుకంటే శరీరం ఆత్మకు విరుద్ధమైనదాన్ని కోరుతుంది; ఆత్మ శరీరానికి విరుద్ధమైనదాన్ని కోరుతుంది.[a] ఇవి ఒకదానినొకటి ఎదిరిస్తాయి. అందువల్ల మీరు చేయాలనుకునేవాటిని చేయలేరు.[b]
  to: ఎందుకంటే శరీరం ఆత్మకు విరుద్ధమైనదాన్ని కోరుతుంది; ఆత్మ శరీరానికి విరుద్ధమైనదాన్ని కోరుతుంది.[a] ఎందుకంటే ఇవి పరస్పరం విరోధంగా ఉన్నాయి, మీరు చేయాలని కోరుకునేవాటిని చేయకుండా ఉండేలా.[b]
  rationale: The revision preserves the repeated causal connection (γάρ), expresses the mutual and ongoing opposition of flesh and Spirit naturally, and replaces the overly restrictive inability wording with a construction that reflects the Greek ἵνα μὴ purpose/result ambiguity. Footnote anchors remain attached to the relevant clauses.
