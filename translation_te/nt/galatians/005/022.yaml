source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: te
  text: అయితే పరిశుద్ధాత్మ ఫలం ప్రేమ, ఆనందం, శాంతి, సహనం, దయ, మంచితనం, విశ్వాసం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకత్వం.” గ్రీకు పదమైన πίστις విశ్వాసం, నమ్మకం లేదా నమ్మకత్వం అనే అర్థాలను ఇవ్వగలదు. ఈ సద్గుణాల జాబితాలో నమ్మదగిన, విశ్వసనీయమైన స్వభావం అనే భావం కూడా సాధ్యమే.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి శరీర కార్యాల జాబితాతో ఉన్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది.
- source_word: καρπὸς
  choice: ఫలం
  rationale: పౌలు ఉపయోగించిన రూపకాన్ని, అలాగే ఏకవచనాన్ని నిలుపుతుంది.
- source_word: τοῦ πνεύματός
  choice: ఆత్మ
  rationale: సందర్భంలో పరిశుద్ధాత్మను సూచిస్తుంది; తెలుగు బైబిలు శైలిలో గౌరవార్థక నిర్దిష్ట సూచనగా సహజంగా ఉంటుంది.
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: ἀγάπηకి స్పష్టమైన, సాధారణ ఆధునిక తెలుగు సమానార్థకం.
- source_word: χαρά
  choice: ఆనందం
  rationale: సద్గుణాల జాబితాలో సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: εἰρήνη
  choice: సమాధానం
  rationale: అంతరంగ ప్రశాంతతను, సంబంధాలలో శాంతిని రెండింటినీ అతిగా నిర్దిష్టం చేయకుండా సూచించగల స్థిరమైన తెలుగు ప్రయోగం.
- source_word: μακροθυμία
  choice: దీర్ఘశాంతం
  rationale: కేవలం వేచి ఉండడమే కాక, రెచ్చగొట్టబడినా కోపాన్ని నిగ్రహిస్తూ సహించే భావాన్ని నిలుపుతుంది.
- source_word: χρηστότης
  choice: దయ
  rationale: ఇతరులపట్ల మృదువైన మేలుచేసే స్వభావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: ἀγαθωσύνη
  choice: మంచితనం
  rationale: విస్తృత నైతిక మేలును సూచిస్తూ χρηστότηςతో భేదాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: పదానికి సాధారణ ప్రాథమిక తెలుగు అనువాదం; ఈ సద్గుణాల జాబితాలో 'నమ్మకత్వం' అనే అర్థమూ సాధ్యమైనందున దానిని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: πνεῦμα యొక్క సూచన
  choice: పరిశుద్ధాత్మ
  alternative: మానవ ఆత్మ
  rationale: గలతీయులు 5లో శరీరంతో ఉన్న తక్షణ వ్యత్యాసం, పౌలు వాదనలోని విస్తృత సందర్భం—ఇవి విశ్వాసుల్లో పనిచేసే పరిశుద్ధాత్మను సూచిస్తున్నాయి.
- issue: సద్గుణాల జాబితాలో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకత్వం
  rationale: πίστιςకు విశ్వాసం, నమ్మకం, నమ్మకత్వం అనే భావాలు ఉండగలవు. ప్రధాన పాఠ్యంలో సాధారణ అనువాదాన్ని ఉంచి, ఈ సందర్భంలో సమర్థించదగిన గుణార్థాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సంక్షిప్త జాబితా శైలిని పాటించాం. మూలంలోని ఏకవచనమైన ‘ఫలం’ను నిలిపాం. ‘దీర్ఘశాంతం’ కొంత బైబిలు-సాహిత్య పదమైనప్పటికీ μακροθυμίαలోని దీర్ఘకాల సహనాన్ని ‘సహనం’కన్నా స్పష్టంగా కాపాడుతుంది.
