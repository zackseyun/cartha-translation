  text: విగ్రహారాధన, మంత్రతంత్రాలు[a], వైరాలు, కలహం, అసూయ, కోపావేశాలు, స్వార్థపూరిత ఆశయాలు, విభేదాలు, వర్గాలు[b],
  philosophy: optimal-equivalence
