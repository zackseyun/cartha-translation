revisions:
- from: అయితే, ఏదో గొప్పవారిగా పరిగణించబడినవారి విషయానికొస్తే[a]—వారు పూర్వం ఎటువంటివారై ఉన్నా అది నాకు ఏమాత్రం తేడా కలిగించదు; దేవుడు మనుషుల ముఖం చూసి పక్షపాతం చూపడు[b]—ఆ ప్రముఖులు నాకు అదనంగా ఏమీ జోడించలేదు[c].
