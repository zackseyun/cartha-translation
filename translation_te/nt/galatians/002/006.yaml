id: GAL.2.6
reference: Galatians 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: te
  text: అయితే, ఏదో గొప్పవారిగా పరిగణించబడినవారి విషయానికొస్తే[a]—వారు పూర్వం ఎటువంటివారై ఉన్నా, అది నాకు ఏమాత్రం తేడా కలిగించదు; దేవుడు మనుషుల ముఖం చూసి పక్షపాతం చూపడు[b]—ఎందుకంటే, అటువారే నాకు అదనంగా ఏమీ జోడించలేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏదో గొప్పవారిగా కనిపించినవారు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “దేవుడు ఒక మనిషి ముఖాన్ని స్వీకరించడు”; ఇది పక్షపాతం చూపకపోవడాన్ని తెలిపే నానుడి.
    reason: cultural_note
  - marker: c
    text: లేదా, “నాపై అదనంగా ఏమీ విధించలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: ఏదో గొప్పవారిగా పరిగణించబడినవారు / ఆ ప్రముఖులు
  rationale: δοκέω ఇక్కడ కేవలం కనిపించడాన్ని కాక, ఇతరుల దృష్టిలో ఉన్న పేరు, స్థానం, ప్రాముఖ్యతను సూచిస్తుంది. ఈ పదప్రయోగం వారి నాయకత్వాన్ని తిరస్కరించకుండా పౌలు చూపుతున్న స్వల్ప దూరాన్ని నిలుపుతుంది.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: వారు పూర్వం ఎటువంటివారై ఉన్నా
  rationale: ποτεలోని గతకాల సూచనను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, వారి మునుపటి స్థానం తన వాదనకు సంబంధం లేదని పౌలు చెప్పే భావాన్ని నిలుపుతుంది.
- source_word: οὐδέν μοι διαφέρει
  choice: అది నాకు ఏమాత్రం తేడా కలిగించదు
  rationale: వారి హోదా తన అంచనాను ప్రభావితం చేయదనే గ్రీకు నానుడి భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: దేవుడు మనుషుల ముఖం చూసి పక్షపాతం చూపడు
  rationale: మూలంలోని ‘ముఖాన్ని స్వీకరించడం’ అనే సెమిటిక్ నానుడిని కొంత ప్రతిబింబిస్తూనే, దాని ఉద్దేశమైన పక్షపాతం చూపకపోవడాన్ని ఆధునిక పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: ἐμοὶ γὰρ
  choice: నాకు
  rationale: దత్తివాచకమైన ἐμοίని స్పష్టంగా ఉంచింది. γάρ ఇక్కడ పౌలు వ్యక్తిగత అనుభవంతో ముందరి మాటను సమర్థిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ప్రత్యేక అనుసంధాన పదం లేకుండానే ఆ సంబంధం సహజంగా తెలుస్తుంది.
- source_word: οὐδὲν προσανέθεντο
  choice: అదనంగా ఏమీ జోడించలేదు
  rationale: προσανατίθημιలోని ‘ఇంకేదైనా చేర్చడం’ అనే భావాన్ని ఉంచుతూ, అది బోధకు చేసిన చేర్పా లేక విధించిన అదనపు ఆదేశమా అనే సందర్భసిద్ధమైన స్వల్ప సందిగ్ధతను పూర్తిగా తొలగించదు.
theological_decisions:
- issue: యెరూషలేము నాయకుల పట్ల పౌలు ధిక్కారం చూపుతున్నాడా, లేక వారి హోదాపై తన స్వతంత్రతను మాత్రమే ప్రకటిస్తున్నాడా?
  choice: వారి ప్రాముఖ్యతను అంగీకరిస్తూనే, వారి హోదా సువార్త సత్యాన్ని నిర్ణయించదనే పౌలు స్వల్ప దూరాన్ని నిలుపడం
  alternative: ‘గొప్పవారమని కనిపించినవారు’ వంటి మరింత వ్యంగ్యభరితమైన అనువాదం; లేదా ‘గుర్తింపు పొందిన నాయకులు’ వంటి మరింత మృదువైన అనువాదం
  rationale: పౌలు వారి నాయకత్వం చెల్లదని తప్పనిసరిగా చెప్పడం లేదు; వారి పేరు లేదా గత స్థానం తన సువార్తకు అధికార మూలం కాదని చెబుతున్నాడు. ఎంపిక చేసిన పదాలు ఈ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచుతాయి.
- issue: οὐδὲν προσανέθεντο అనేది పౌలు సందేశానికి ఏమీ చేర్చలేదని అంటుందా, లేక అతనిపై అదనపు నిబంధనలు విధించలేదని అంటుందా?
  choice: ‘అదనంగా ఏమీ జోడించలేదు’ అని విస్తృతంగా అనువదించడం
  alternative: ‘నాపై అదనంగా ఏమీ విధించలేదు’
  rationale: గ్రీకు క్రియ రెండు భావాలకు సందర్భంలో అవకాశం ఇస్తుంది. ప్రధాన పాఠం దానిని ఒకే సిద్ధాంతపరమైన అర్థానికి పరిమితం చేయకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని మధ్యలో చొప్పించిన వ్యాఖ్యలను దీర్ఘ విరామచిహ్నాలతో నిలిపి, పౌలు వాదనలోని స్వల్ప వ్యంగ్యాన్ని అతిశయింపకుండా కాపాడింది.
