- from: 'అయితే, వారు సువార్త సత్యానికి అనుగుణంగా సూటిగా నడుచుకోవడం లేదని నేను చూసినప్పుడు[a], అందరి ఎదుట కేఫాతో ఇలా అన్నాను: “నువ్వు యూదుడివై ఉండి కూడా యూదుడిలా కాకుండా అన్యజనుడిలా జీవిస్తున్నావే; అలాంటప్పుడు అన్యజనులు యూదుల ఆచారాల ప్రకారం జీవించాలని వారిని ఎలా బలవంతం చేస్తున్నావు?[b]”'
  to: 'అయితే, వారు సువార్త సత్యానికి అనుగుణంగా సూటిగా నడుచుకోవడం లేదని నేను చూసినప్పుడు[a], అందరి ఎదుట కేఫాతో ఇలా అన్నాను: “నీవు యూదుడివై ఉండి కూడా యూదుడిలా కాకుండా అన్యజనుడిలా జీవిస్తున్నావు; అలాంటప్పుడు అన్యజనులు యూదుల్లా జీవించాలని వారిని ఎలా బలవంతం చేస్తున్నావు?[b]”'
  rationale: సవరణ Ἰουδαΐζεινకు మూలానికి మరింత సమాంతరమైన, తక్కువగా నిర్దిష్టీకరించే ‘యూదుల్లా జీవించడం’ను ప్రధాన పాఠంలో ఉంచుతుంది. ‘యూదా ఆచారాలను అవలంబించడం’ అనే వివరణను అడుగుటిప్పణికి పరిమితం చేసింది. మొదటి అడుగుటిప్పణిని అక్షరార్థ ప్రత్యామ్నాయంగా సరిచేసి, భాషా స్థాయిని ఆధునిక ప్రామాణిక తెలుగుకు స్వల్పంగా మెరుగుపరిచింది.
