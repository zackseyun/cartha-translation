id: GAL.2.14
reference: Galatians 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: te
  text: 'అయితే, వారు సువార్త సత్యానికి అనుగుణంగా సూటిగా నడుచుకోవడం లేదని నేను చూసినప్పుడు[a], అందరి ఎదుట కేఫాతో ఇలా అన్నాను: “నీవు యూదుడివై ఉండి కూడా యూదుడిలా కాకుండా అన్యజనుడిలా జీవిస్తున్నావు; అలాంటప్పుడు అన్యజనులు యూదుల్లా జీవించాలని వారిని ఎలా బలవంతం చేస్తున్నావు?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “సువార్త సత్యానికి అనుగుణంగా సూటిగా నడవడం లేదని.”'
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ సాంకేతిక పదంతో: “అన్యజనులను యూదీకరించడానికి.” లేదా: “అన్యజనులు యూదా ఆచారాలను అవలంబించాలని.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: సూటిగా నడుచుకోవడం
  rationale: మూల క్రియలోని ‘సూటిగా నడవడం’ అనే రూపకాన్ని నిలుపుతూ, ప్రవర్తన సువార్త సత్యానికి అనుగుణంగా లేకపోవడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: సువార్త సత్యానికి అనుగుణంగా
  rationale: ఇక్కడ πρός సాధారణ దిశను కాక, సువార్త సత్యం అనే ప్రమాణానికి ప్రవర్తన సరిపోవడాన్ని సూచిస్తుంది.
- source_word: Κηφᾷ
  choice: కేఫాతో
  rationale: పౌలు ఉపయోగించిన కేఫా అనే పేరునే లిప్యంతరీకరించి నిలుపుతుంది; దాని స్థానంలో పేతురు అని మార్చదు.
- source_word: ἐθνικῶς
  choice: అన్యజనుడిలా
  rationale: జీవన విధానాన్ని సూచించే క్రియావిశేషణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, యూదుడిలా అనే విరుద్ధ పదబంధంతో సమాంతరతను నిలుపుతుంది.
- source_word: Ἰουδαϊκῶς
  choice: యూదుడిలా
  rationale: ἐθνικῶςతో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని ‘అన్యజనుడిలా ... యూదుడిలా’ అనే సమాంతర నిర్మాణంలో నిలుపుతుంది.
- source_word: ἀναγκάζεις
  choice: బలవంతం చేస్తున్నావు
  rationale: క్రియలోని ఒత్తిడి లేదా నిర్బంధ భావాన్ని స్పష్టంగా, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Ἰουδαΐζειν
  choice: యూదుల ఆచారాల ప్రకారం జీవించడం
  rationale: యూదుల ప్రత్యేక జీవనాచారాలను అనుసరించడాన్ని స్పష్టంగా తెలియజేస్తూ, తరువాతి కాలపు సాంకేతిక లేదా వివాదాత్మక భావాలను అనవసరంగా చేర్చదు.
- source_word: πῶς
  choice: ఎలా
  rationale: సామర్థ్యాన్ని సూచించే ‘ఎలా చేయగలవు?’ అనే భావం చేర్చకుండా, మూలంలోని నేరమైన ప్రశ్నను నిలుపుతుంది.
theological_decisions:
- issue: Ἰουδαΐζειν పదాన్ని తరువాతి సిద్ధాంత వివాదాల భావం చేర్చకుండా అనువదించడం
  choice: యూదుల ఆచారాల ప్రకారం జీవించడం
  alternative: యూదుల్లా జీవించడం; యూదా ఆచారాలను అవలంబించడం
  rationale: తక్షణ సందర్భం భోజన సహవాసం మరియు జాతి-మత సరిహద్దు ఆచారాలకు సంబంధించినది. ఎంపిక చేసిన రూపం ఆ సామాజిక-మతపరమైన ఒత్తిడిని స్పష్టపరుస్తుంది కానీ తరువాత ఏర్పడిన సిద్ధాంతపరమైన సాంకేతిక అర్థాన్ని రుద్దదు.
- issue: ὀρθοποδοῦσινలోని రూపకాన్ని నిలపాలా లేదా భావానువాదం చేయాలా
  choice: సూటిగా నడుచుకోవడం
  alternative: అనుగుణంగా ప్రవర్తించడం
  rationale: ‘నడవడం’ అనే మూల రూపకాన్ని నిలుపుతూ, ‘సువార్త సత్యానికి అనుగుణంగా’ అనే పదబంధం ద్వారా దాని నైతిక-ప్రవర్తనా భావాన్ని పాఠకునికి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘సూటిగా నడుచుకోవడం’ అనే మూల రూపకం నిలుపబడింది; ‘కేఫా’ అనే మూలపేరు మార్చలేదు. ‘అన్యజనుడు’ మరియు ‘యూదుడు’ పదాలు సందర్భంలోని జాతి-మత వ్యత్యాసాన్ని సూచిస్తాయి.
