  terminology: ‘కేఫా,’ ‘అన్యజనులు,’ ‘యూదులు,’ ‘సువార్త సత్యం,’ ‘బలవంతం’ తగినవే. Ἰουδαΐζεινకు ‘యూదుల్లా జీవించడం’ అని సమాంతరంగా అనువదించడం ἐθνικῶς/Ἰουδαϊκῶς వ్యత్యాసాన్నీ, పదం యొక్క సందర్భానుసార విస్తృతతనూ మెరుగ్గా కాపాడుతుంది.
