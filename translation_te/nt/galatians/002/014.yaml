  source_fidelity: మూలంలోని ὀρθοποδοῦσιν రూపకాన్ని, సువార్త సత్యానికి అనుగుణతను, కేఫా పేరును, అలాగే ప్రశ్నలోని నేరమైన πῶςను ముసాయిదా మొత్తంగా బాగా నిలుపుతుంది. అయితే Ἰουδαΐζεινకు ప్రధాన పాఠంలో ‘యూదుల ఆచారాల ప్రకారం’ అని చెప్పడం మూలంలోని విస్తృతమైన ‘యూదుల్లా జీవించడం’ కంటే కొద్దిగా నిర్దిష్టీకరిస్తుంది.
