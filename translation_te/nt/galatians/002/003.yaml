  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: te
  text: అయితే నాతో ఉన్న తీతు గ్రీకువాడైనప్పటికీ[a][b], సున్నతి చేయించుకోవాలని అతణ్ణి సైతం బలవంతం చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గ్రీకువాడై ఉండి.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “గ్రీకువాడు” అనే మాట తీతు సున్నతి పొందనివాడని సందర్భానుసారంగా సూచిస్తుంది. అయితే మూలపాఠం సాధారణంగా “యూదేతరుడు” అని కాక నిర్దిష్టంగా “గ్రీకువాడు” అని చెబుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλ’
  choice: అయితే
  rationale: ముందటి సందర్భంతో ఉన్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: οὐδὲ
  choice: అతణ్ణి సైతం … చేయలేదు
  rationale: తీతుపై కేంద్రీకృతమైన ‘not even’ అనే బలమైన నిరాకరణను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Τίτος
  choice: తీతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ὁ σὺν ἐμοί
  choice: నాతో ఉన్న
  rationale: తీతును గుర్తించే గ్రీకు వివరణను అదనపు భావం చేర్చకుండా సంక్షిప్తంగా అందిస్తుంది.
- source_word: Ἕλλην ὤν
  choice: గ్రీకువాడైనప్పటికీ
  rationale: సందర్భంలో ఈ కృదంత పదబంధానికి ఉన్న concessive భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదటీకలో ఉంచింది.
- source_word: Ἕλλην
  choice: గ్రీకువాడు
  rationale: విస్తృతమైన ‘యూదేతరుడు’ అనే వ్యాఖ్యాన పదానికి బదులు మూలంలోని నిర్దిష్ట జాతి-సాంస్కృతిక పదాన్ని నిలుపుతుంది.
- source_word: ἠναγκάσθη
  choice: బలవంతం చేయలేదు
  rationale: బయటి ఒత్తిడి లేదా నిర్బంధం అనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకు కర్మణి భావం ‘అతణ్ణి’ ద్వారా నిలుస్తుంది.
- source_word: περιτμηθῆναι
  choice: సున్నతి చేయించుకోవడానికి
  rationale: సున్నతికి లోబడడం అనే భావాన్ని స్పష్టమైన ప్రస్తుత తెలుగు ప్రయోగంలో అందిస్తుంది.
theological_decisions:
- issue: Ἕλλην అనే పదాన్ని నిర్దిష్ట జాతి-సాంస్కృతిక పదంగా ఉంచాలా, వ్యాఖ్యానాత్మక మతవర్గ పదంగా మార్చాలా
  choice: గ్రీకువాడు
  alternative: యూదేతరుడు
  rationale: సందర్భంలో ఈ పదం సున్నతి పొందని యూదేతర స్థితిని సూచించినప్పటికీ, మూలపాఠం సాధారణంగా ‘యూదేతరుడు’ అని కాక నిర్దిష్టంగా ‘గ్రీకువాడు’ అని చెబుతుంది.
- issue: Ἕλλην ὤν అనే కృదంత పదబంధంలోని సంబంధాన్ని స్పష్టంగా concessiveగా చూపాలా
  choice: గ్రీకువాడైనప్పటికీ
  alternative: గ్రీకువాడై ఉండి
  rationale: సందర్భం ‘అతడు గ్రీకువాడైనా బలవంతం చేయబడలేదు’ అనే వ్యత్యాసాన్ని బలంగా సూచిస్తుంది; అయినా గ్రీకు కృదంతం స్వయంగా concessive సంధిపదాన్ని ఉపయోగించనందున అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటీకలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘సైతం’ οὐδὲ యొక్క ఉద్ఘాటనను నిలుపుతుంది. కఠినమైన కర్మణి నిర్మాణాన్ని తప్పించి, ‘అతణ్ణి … బలవంతం చేయలేదు’ అనే సహజ తెలుగు నిర్మాణంతో గ్రీకు కర్మణి భావాన్ని కాపాడాం.
