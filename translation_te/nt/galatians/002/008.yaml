id: GAL.2.8
reference: Galatians 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: te
  text: ఎందుకంటే, సున్నతి పొందినవారి కోసం అపొస్తల సేవలో పేతురు ద్వారా కార్యం చేసినవాడు[a] అన్యజనుల కోసం[b] నా ద్వారా కూడా కార్యం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సున్నతి యొక్క అపొస్తల సేవ కోసం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “జనాల కోసం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: కార్యం చేసినవాడే ... కార్యం చేశాడు
  rationale: మూలంలోని ఒకే క్రియకు చెందిన రెండు రూపాల పునరుక్తిని, పేతురు–పౌలు సేవల సమాంతరతను నిలుపుతుంది; దైవ కార్యం ఏ విధంగా జరిగిందో అదనంగా నిర్వచించదు.
- source_word: Πέτρῳ / ἐμοὶ
  choice: పేతురులో / నాలో
  rationale: దత్తివిభక్తి ఇక్కడ ‘లో’ లేదా ‘ద్వారా’ అనే భావాలను అనుమతిస్తుంది. తెలుగు ‘లో కార్యం చేయడం’ మూలరూపానికి దగ్గరగా ఉండి, అంతర్గత శక్తినివ్వడం మరియు వ్యక్తి ద్వారా పనిచేయడం అనే భావాలను ముందుగానే ఒక్కదానికి పరిమితం చేయదు.
- source_word: εἰς ἀποστολὴν
  choice: అపొస్తలుడిగా సేవ చేయడానికి
  rationale: ἀποστολή యొక్క అపొస్తల సేవ/నియామక భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τῆς περιτομῆς
  choice: సున్నతి పొందినవారికి
  rationale: అక్షరార్థమైన ‘సున్నతి యొక్క’ అనే నిర్మాణం ఇక్కడ సున్నతి పొందిన యూదులను సూచించే లక్షణార్థ ప్రయోగం; యూదులు–అన్యజనులు అనే వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τὰ ἔθνη
  choice: అన్యజనులు
  rationale: పౌలు సందర్భంలో సున్నతి పొందిన యూదులకు విరుద్ధంగా యూదేతర ప్రజలను సూచిస్తుంది; ‘జనాలు/దేశాలు’ కూడా సాధ్యమైన అక్షరార్థ ప్రత్యామ్నాయం.
theological_decisions:
- issue: క్రియకు కర్తను ‘దేవుడు’ అని స్పష్టంగా చేర్చాలా
  choice: కార్యం చేసినవాడే
  alternative: దేవుడే కార్యం చేసి
  rationale: గ్రీకులో ὁ ἐνεργήσας అంటే అక్షరార్థంగా ‘కార్యం చేసినవాడు’; సందర్భంలో దైవిక కర్త సూచితమైనా, లేని ‘దేవుడు’ అనే నామవాచకాన్ని చేర్చకుండా మూలంలోని పరోక్షతను నిలిపాం.
- issue: Πέτρῳ మరియు ἐμοὶ దత్తివిభక్తులను సాధనార్థకంగా మాత్రమే నిర్ధారించాలా
  choice: పేతురులో ... నాలో
  alternative: పేతురు ద్వారా ... నా ద్వారా
  rationale: ‘ద్వారా’ సందర్భోచితమైన అర్థమే అయినా, ‘లో’ మూలంలోని విభక్తి విస్తృతిని ఎక్కువగా కాపాడి, దేవుడు వారిలో కార్యం చేశాడా లేదా వారి ద్వారా చేశాడా అనే సున్నితమైన భావభేదాన్ని పూర్తిగా మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణం. మూలంలోని పేతురు–పౌలు సమాంతరతను ‘కార్యం చేసినవాడే ... కార్యం చేశాడు’ ద్వారా నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
