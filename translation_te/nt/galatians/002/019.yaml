  text: ἐγὼ γὰρ διὰ νόμου νόμῳ ἀπέθανον ἵνα θεῷ ζήσω· Χριστῷ συνεσταύρωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: te
  text: ఎందుకంటే ధర్మశాస్త్రం ద్వారా నేను ధర్మశాస్త్రానికి చనిపోయాను—దేవునికై జీవించడానికి. నేను మెస్సీయతో కలిసి సిలువవేయబడి ఉన్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను అనుసంధానించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: διὰ νόμου
  choice: ధర్మశాస్త్రం ద్వారానే
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ సాధనార్థక భావాన్ని ఇస్తుంది. సందర్భంలో νόμος మోషే ధర్మశాస్త్రాన్ని సూచిస్తున్నందున ‘ధర్మశాస్త్రం’ ఎంచుకోబడింది; ‘ద్వారానే’ మూలంలోని విరోధాభాసపూరిత ఉద్ఘాటనను స్పష్టంగా ఉంచుతుంది.
- source_word: νόμῳ
  choice: ధర్మశాస్త్రానికి
  rationale: దత్తివిభక్తి భావాన్ని నేరుగా నిలుపుతూ, ధర్మశాస్త్రంతో ఉన్న అధికార సంబంధం ముగిసిందనే సూచనను వివరణాత్మకంగా విస్తరించకుండా ఉంచుతుంది.
- source_word: ἀπέθανον
  choice: చనిపోయాను
  rationale: ఏకకాలికంగా జరిగిన నిర్ణాయక సంఘటనను సూచించే గ్రీకు అఓరిస్టును సహజమైన తెలుగు భూతకాలంతో అందిస్తుంది.
- source_word: ἵνα
  choice: జీవించడానికి
  rationale: ఉద్దేశాన్ని తెలిపే ἵνα భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: θεῷ ζήσω
  choice: దేవునికి జీవించడానికి
  rationale: θεῷ లోని దత్తివిభక్తి యొక్క సంబంధాత్మక, దిశాత్మక భావాన్ని ‘దేవుని కోసం’ అని ప్రయోజనార్థకంగా మాత్రమే పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: Χριστῷ
  choice: మెస్సీయతో
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉన్నందున ‘మెస్సీయ’గా అనువదించబడింది; దత్తివిభక్తి సహభాగితను ‘తో’ తెలియజేస్తుంది.
- source_word: συνεσταύρωμαι
  choice: కలిసి సిలువ వేయబడి ఉన్నాను
  rationale: గతంలో జరిగిన సిలువవేయబడటం మరియు దాని కొనసాగుతున్న ఫలితస్థితి రెండింటినీ గ్రీకు పరిపూర్ణ కాలానికి అనుగుణంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ధర్మశాస్త్రం ద్వారానే ధర్మశాస్త్రానికి చనిపోవడం అనే సంక్షిప్త వాక్యాన్ని వివరణాత్మకంగా విస్తరించాలా
  choice: ‘ధర్మశాస్త్రం ద్వారానే నేను ధర్మశాస్త్రానికి చనిపోయాను’ అనే ఉద్విగ్నమైన, సంక్షిప్త రూపాన్ని నిలుపడం
  alternative: ‘ధర్మశాస్త్రపు తీర్పు ద్వారా నేను దాని అధికారానికి చనిపోయాను’ అని అర్థాన్ని విస్తరించడం
  rationale: గ్రీకు వాక్యం ఉద్దేశపూర్వకంగా సంక్షిప్తమై, ధార్మికంగా బహుళార్థసాధ్యంగా ఉంది. ‘తీర్పు’ లేదా ‘ఆచరణ’ వంటి వివరణను చేర్చడం మూలంలో లేని నిర్దిష్ట వ్యాఖ్యానాన్ని దిగుమతి చేస్తుంది.
- issue: συνεσταύρωμαι లోని పరిపూర్ణ కాల బలాన్ని ఎలా తెలియజేయాలి
  choice: గత సంఘటనతో పాటు కొనసాగుతున్న స్థితిని ‘సిలువ వేయబడి ఉన్నాను’ ద్వారా నిలుపడం
  alternative: కేవలం ‘సిలువ వేయబడ్డాను’ అని సాధారణ భూతకాలంలో అనువదించడం
  rationale: పరిపూర్ణ కాలం పూర్తయిన సంఘటన యొక్క ప్రస్తుత ఫలితాన్ని సూచిస్తుంది; తెలుగు సంయుక్త నిర్మాణం ఆ రెండు కోణాలనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ధర్మశాస్త్రం’ పౌలు సందర్భంలోని νόμος‌కు స్థిరమైన బైబిలు పదం; వాక్యంలోని ఉద్దేశపూర్వక ధార్మిక ఉద్విగ్నతను సరళీకరించలేదు. ఎలాంటి పాదటిప్పణులు అవసరం లేదు.
