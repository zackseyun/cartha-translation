id: GAL.2.17
reference: Galatians 2:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: te
  text: అయితే, మెస్సీయలో నీతిమంతులమని తీర్చబడాలని వెదుకుతున్నప్పుడు మనమూ పాపులమని తేలితే, మెస్సీయ పాపానికి సేవకుడా? ఎంతమాత్రమూ కాదు!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: వెదుకుతూ ఉన్న
  rationale: ప్రధాన క్రియతో సమకాలంగా జరుగుతున్న ప్రయత్నాన్ని తెలిపే వర్తమాన కృదంత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δικαιωθῆναι
  choice: నీతిమంతులుగా తీర్చబడాలని
  rationale: కర్తరి కాని రూపాన్ని, దేవుని తీర్పులో నీతిమంతులుగా ప్రకటించబడే పౌలు వాడుకను తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది; ‘నీతిమంతులుగా చేయబడాలని’ అనే మార్పు భావాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός యొక్క బిరుదు భావాన్ని నిలుపుతూ, ἐν యొక్క సంబంధం/ఐక్యతకు సంబంధించిన ఉద్దేశపూర్వక విస్తృతిని ‘లో’ ద్వారా కాపాడుతుంది.
- source_word: εὑρέθημεν
  choice: మనం ... అని తేలితే
  rationale: ‘కనుగొనబడ్డాము’ అనే అక్షరానువాదం తెలుగులో అసహజంగా ఉండగా, ‘తేలితే’ పరీక్షలో అలా కనబడినామనే నిష్క్రియాత్మక ఫలిత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: మనం కూడా పాపులమని
  rationale: καί యొక్క ‘కూడా’ భావాన్ని, αὐτοί యొక్క స్వీయ ఉద్ఘాటనను ‘మనం’ ద్వారా సందర్భానుగుణంగా అందిస్తుంది; ‘పాపులు’ అనే నేరుగా ఉన్న విధేయ పదాన్ని నిలుపుతుంది.
- source_word: ἁμαρτίας διάκονος
  choice: పాపానికి సేవకుడు
  rationale: διάκονοςను అధికారిక మతపదవిగా కాక, పాపం పక్షాన పనిచేసే వ్యక్తి అనే ఆరోపణాత్మక భావంలో సహజంగా అనువదిస్తుంది.
- source_word: μὴ γένοιτο
  choice: ఎంతమాత్రమూ కాదు!
  rationale: పౌలు పలికే బలమైన నిరాకరణను ఆధునిక, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది; అక్షరార్థమైన ఆశీర్వచన రూపం తెలుగులో కలిగించే అసహజతను నివారిస్తుంది.
theological_decisions:
- issue: మెస్సీయ పాపానికి కారణమవుతాడని వాక్యం బోధిస్తున్నట్టుగా అనువాదం వినిపించే ప్రమాదం
  choice: మెస్సీయ పాపానికి సేవకుడా?
  alternative: మెస్సీయ పాపాన్ని ప్రోత్సహించేవాడా?
  rationale: గ్రీకు వాక్యం ఒక తిరస్కారార్థక ప్రశ్నగా ఆరోపణను ముందుంచి వెంటనే ఖండిస్తుంది. ‘సేవకుడు’ διάκονοςను నేరుగా నిలుపుతుంది; ‘ప్రోత్సహించేవాడు’ కారణత్వాన్ని లేదా ఉద్దేశాన్ని అధికంగా వివరిస్తుంది.
- issue: δικαιωθῆναιలోని న్యాయస్థాన సంబంధమైన మరియు స్థితి సంబంధమైన భావాల మధ్య ఉద్రిక్తత
  choice: నీతిమంతులుగా తీర్చబడాలని
  alternative: నీతిమంతులుగా చేయబడాలని
  rationale: ‘తీర్చబడడం’ తీర్పు/ప్రకటన భావాన్ని ముందుకు తెస్తూనే, వాక్యంలో లేనంత వ్యవస్థాత్మక వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. గ్రీకు వాక్యంలోని షరతు, వ్యంగ్యార్థక ప్రశ్న, తీవ్ర నిరాకరణ యథావిధిగా నిలుపబడ్డాయి.
