revisions:
- from: అయితే, మెస్సీయలో నీతిమంతులుగా తీర్చబడాలని వెదుకుతూ ఉన్న మనం కూడా పాపులమని తేలితే, మెస్సీయ పాపానికి సేవకుడా? ఎంతమాత్రమూ కాదు!
  to: అయితే, మెస్సీయలో నీతిమంతులమని తీర్చబడాలని వెదుకుతున్నప్పుడు మనమూ పాపులమని తేలితే, మెస్సీయ పాపానికి సేవకుడా? ఎంతమాత్రమూ కాదు!
  rationale: 'The revision preserves the Greek ambiguity and rhetorical force while improving Telugu idiom and making the forensic sense of δικαιωθῆναι clearer. No footnote is necessary: ‘మెస్సీయ’ is consistently used according to the supplied project policy, and the verse contains no textual or lexical ambiguity requiring an anchor.'
