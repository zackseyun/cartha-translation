id: GAL.2.16
reference: Galatians 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: te
  text: అయితే, ధర్మశాస్త్ర క్రియల వల్ల కాక యేసు మెస్సీయపై విశ్వాసం ద్వారానే ఒక వ్యక్తి నీతిమంతుడిగా తీర్చబడతాడని తెలిసి, మనం కూడా మెస్సీయ యేసుపై విశ్వాసముంచాం. తద్వారా మనం ధర్మశాస్త్ర క్రియల వల్ల కాక మెస్సీయపై విశ్వాసం ద్వారా నీతిమంతులుగా తీర్చబడటానికి ఇలా చేశాం. ఎందుకంటే ధర్మశాస్త్ర క్రియల వల్ల ఏ మానవుడూ నీతిమంతుడిగా తీర్చబడడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: నీతిమంతుడిగా / నీతిమంతులుగా తీర్చబడతాడు / తీర్చబడడానికి / తీర్చబడడు
  rationale: న్యాయస్థాన సంబంధమైన పౌలు వాడుకను నిలుపుతూ, దేవుడు ఒకరిని నీతిమంతునిగా ప్రకటించే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἄνθρωπος
  choice: ఒక వ్యక్తి
  rationale: ఇక్కడ ఏ మానవునికైనా వర్తించే ఏకవచన ప్రతినిధి భావం ఉంది; ఆధునిక తెలుగులో ‘ఒక వ్యక్తి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐξ ἔργων νόμου
  choice: ధర్మశాస్త్ర క్రియల వల్ల
  rationale: పౌలు ఉపయోగించిన ప్రత్యేక పదబంధాన్ని ‘మంచి పనులు’ అని విస్తరించకుండా, ధర్మశాస్త్రంతో దాని సంబంధాన్ని నిలుపుతుంది.
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయపై విశ్వాసం ద్వారా
  rationale: ప్రధాన పాఠంలో objective-genitive అర్థాన్ని తీసుకుంది; గ్రీకు జనిటివ్‌లో సాధ్యమైన ‘యేసు మెస్సీయ విశ్వసనీయత’ అనే అర్థాన్ని పాదసూచికలో నిలిపింది.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: మెస్సీయ యేసుపై విశ్వాసముంచాం
  rationale: πιστεύω εἰς అనే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, సమూహంగా చేసిన విశ్వాస చర్యను నిలుపుతుంది.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: మెస్సీయపై విశ్వాసం ద్వారా
  rationale: మొదటి πίστις Χριστοῦ నిర్మాణంతో ప్రధాన పాఠంలో ఏకరీతిని పాటిస్తూ, ప్రత్యామ్నాయ subjective-genitive అర్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: Χριστοῦ / Χριστόν
  choice: మెస్సీయ
  rationale: Χριστός అనే బిరుదు అర్థాన్ని కేవలం లిప్యంతరీకరించకుండా అనువదిస్తుంది.
- source_word: πᾶσα σάρξ
  choice: ఏ మానవుడూ
  rationale: తెలుగులో ఉద్దేశించిన విశ్వవ్యాప్త మానవ భావాన్ని స్పష్టంగా అందిస్తుంది; అక్షరార్థమైన శరీర-నుడికారాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: εἰδότες δὲ
  choice: అయితే ... మనకు తెలుసు
  rationale: δέ యొక్క స్వల్ప వ్యతిరేక భావాన్ని, participial construction యొక్క సందర్భ సంబంధాన్ని సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: ἐὰν μὴ
  choice: కాక ... ద్వారానే
  rationale: ‘కాదు—ద్వారానే’ అనే మినహాయింపు/వ్యతిరేక నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది; విశ్వాసం ధర్మశాస్త్ర క్రియలకు మరో జోడింపు మాత్రమే కాదని సూచిస్తుంది.
theological_decisions:
- issue: πίστις Χριστοῦ / πίστεως Ἰησοῦ Χριστοῦ యొక్క అర్థం
  choice: 'objective genitive: ‘యేసు మెస్సీయపై విశ్వాసం’ / ‘మెస్సీయపై విశ్వాసం’'
  alternative: 'subjective genitive: ‘యేసు మెస్సీయ విశ్వసనీయత’ / ‘మెస్సీయ విశ్వసనీయత’'
  rationale: ఈ గ్రీకు నిర్మాణం నిజంగా వివాదాస్పదమైనది. ప్రధాన పాఠంలో సాధారణంగా అర్థమయ్యే objective-genitive పఠనాన్ని ఉంచి, వేరొక సాధ్యమైన పఠనాన్ని పాదసూచికల్లో సంరక్షించింది.
- issue: δικαιόω యొక్క న్యాయస్థాన సంబంధమైన భావం
  choice: ‘నీతిమంతుడిగా తీర్చడం’
  alternative: ‘నీతిమంతుడిగా ప్రకటించడం’ లేదా ‘నీతిమంతుడిగా ఎంచడం’
  rationale: ‘తీర్చడం’ న్యాయనిర్ణయ భావాన్ని కలిగి ఉండి, కేవలం నైతికంగా మార్చడం అనే అర్థానికి పరిమితం చేయదు; అయినా క్రియ యొక్క పూర్తి ధార్మిక ఉద్రిక్తతను అతిగా వివరణ చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. ‘ధర్మశాస్త్ర క్రియలు,’ ‘నీతిమంతుడిగా తీర్చడం,’ ‘మెస్సీయ’ వంటి పౌలు భావనలకు ముఖ్యమైన పదబంధాలు స్థిరంగా ఉంచబడ్డాయి. పొడవైన గ్రీకు వాక్యం తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించబడింది; వాదన క్రమం మాత్రం మారలేదు.
