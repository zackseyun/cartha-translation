revisions:
- from: అయితే, ధర్మశాస్త్ర క్రియల వల్ల కాక, యేసు మెస్సీయపై విశ్వాసం ద్వారానే[a] ఒక వ్యక్తి నీతిమంతుడిగా తీర్చబడతాడని మనకు తెలుసు. అందుకే మనం కూడా ధర్మశాస్త్ర క్రియల వల్ల కాక, మెస్సీయపై విశ్వాసం ద్వారా[b] నీతిమంతులుగా తీర్చబడడానికి మెస్సీయ యేసుపై విశ్వాసముంచాం. ఎందుకంటే ధర్మశాస్త్ర క్రియల వల్ల ఏ మానవుడూ[c] నీతిమంతుడిగా తీర్చబడడు.
  to: అయితే, ధర్మశాస్త్ర క్రియల వల్ల కాక యేసు మెస్సీయపై విశ్వాసం ద్వారానే ఒక వ్యక్తి నీతిమంతుడిగా తీర్చబడతాడని తెలిసి, మనం కూడా మెస్సీయ యేసుపై విశ్వాసముంచాం. తద్వారా మనం ధర్మశాస్త్ర క్రియల వల్ల కాక మెస్సీయపై విశ్వాసం ద్వారా నీతిమంతులుగా తీర్చబడటానికి ఇలా చేశాం. ఎందుకంటే ధర్మశాస్త్ర క్రియల వల్ల ఏ మానవుడూ నీతిమంతుడిగా తీర్చబడడు.
