  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: te
  text: ఎందుకంటే, నేను కూలగొట్టిన వాటినే మళ్లీ కడుతున్నానంటే, నన్ను నేనే అతిక్రమణకారునిగా చూపించుకుంటాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను నేనే అతిక్రమణకారునిగా నిరూపించుకుంటాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ఎందుకంటే, ... కడితే
  rationale: γάρ ముందటి వాదనతో వివరణాత్మక సంబంధాన్ని చూపుతుంది; εἰ షరతును సూచిస్తుంది. ఈ రెండింటినీ సహజమైన తెలుగులో ఈ నిర్మాణం నిలుపుతుంది.
- source_word: ἃ ... ταῦτα
  choice: నేను కూలగొట్టినవాటినే
  rationale: గ్రీకు పరస్పర సంబంధ నిర్మాణంలోని బహువచన భావాన్ని నిలుపుతూ, ταῦτα ఇచ్చే నిర్దిష్టతను ‘-నే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατέλυσα
  choice: కూలగొట్టిన
  rationale: οἰκοδομῶతో ఉన్న నిర్మాణ రూపకాన్ని స్పష్టంగా నిలుపుతుంది; ‘రద్దుచేసిన’ అనడం సందర్భాన్ని ముందుగానే వ్యాఖ్యానించినట్లవుతుంది.
- source_word: πάλιν οἰκοδομῶ
  choice: మళ్లీ కడితే
  rationale: πάλιν యొక్క పునరావృత భావాన్నీ, οἰκοδομέω యొక్క నిర్మాణ రూపకాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παραβάτην
  choice: అతిక్రమించే వాడిగా
  rationale: ఈ పదంలోని నైతిక-న్యాయపరమైన హద్దు మీరే భావాన్ని నిలుపుతుంది; ‘ధర్మశాస్త్రాన్ని ఉల్లంఘించే వాడు’ అని అనడం మూలంలో స్పష్టంగా లేని కర్మను చేర్చుతుంది.
- source_word: ἐμαυτὸν συνιστάνω
  choice: నన్ను నేనే ... చూపించుకుంటాను
  rationale: ప్రతిబింబ సర్వనామం ఇచ్చే స్వీయ-నిరూపణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; క్రియకు ‘నిరూపించుకుంటాను’ అనే బలమైన ప్రత్యామ్నాయం కూడా సాధ్యమే.
theological_decisions:
- issue: ‘కూలగొట్టినవి’ దేనిని సూచిస్తాయి?
  choice: వచనంలో కర్మను ‘వాటిని’ అనే సాధారణ రూపంలోనే ఉంచడం
  alternative: ‘ధర్మశాస్త్రపు ఆచారాలను’ లేదా ‘ధర్మశాస్త్రాన్ని’ అని స్పష్టీకరించడం
  rationale: మూల గ్రీకులో సూచిత విషయాలు ఈ వచనంలో పేరుపెట్టి చెప్పబడలేదు. వాటిని నిర్దిష్టంగా గుర్తించడం వ్యాఖ్యానం అవుతుంది; అందువల్ల పౌలు వాదనలోని సూచనాత్మకతను అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పౌలు ఉపయోగించిన కూలగొట్టడం–మళ్లీ కట్టడం అనే రూపకాన్నీ నైతిక-న్యాయపరమైన ఉద్వేగాన్నీ నిలిపే గౌరవప్రదమైన శైలి.
