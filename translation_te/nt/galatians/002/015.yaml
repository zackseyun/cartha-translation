lexical_decisions:
- source_word: Ἡμεῖς
  choice: మనం
  rationale: స్పష్టంగా ఉన్న గ్రీకు సర్వనామంలోని స్వల్ప ఉద్ఘాటనను నిలుపుతూ, సందర్భానికి సహజమైన సమ్మిళిత బహువచన రూపాన్ని ఉపయోగించాం.
- source_word: φύσει
  choice: పుట్టుకతో
  rationale: ఇక్కడ ఇది అంతర్గత నైతిక స్వభావాన్ని కాక, సహజమైన జాతి మూలాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పుట్టుకతో’ ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἰουδαῖοι
  choice: యూదులం
  rationale: యూదుల జాతిగత గుర్తింపును, అన్యజనులతో ఉన్న వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐξ ἐθνῶν
  choice: అన్యజనుల్లోనుంచి వచ్చిన
  rationale: ἐξ అనే విభక్తి సంబంధాన్ని స్పష్టంగా ఉంచుతూ, పౌలు వాడుకలో ἔθνηకి సందర్భోచితమైన ‘అన్యజనులు’ అనే అర్థాన్ని ఇస్తుంది.
- source_word: ἁμαρτωλοί
  choice: పాపులం
  rationale: గ్రీకులోని సూటి పదాన్ని మెత్తబరచకుండా, యూదులు–అన్యజనులు అనే అప్పటి వర్గీకరణలోని ఉద్రిక్తతను నిలుపుతుంది.
theological_decisions:
- issue: పౌలు అన్యజనులకంటే యూదులు నైతికంగా శ్రేష్ఠులని సమర్థిస్తున్నట్లు ఈ వాక్యం వినిపించాలా?
  choice: గ్రీకులో ఉన్న సంక్షిప్తమైన జాతిగత వ్యత్యాసాన్ని వ్యాఖ్యానాత్మకంగా మెత్తబరచకుండా అలాగే ఉంచాం.
  alternative: ‘అన్యజనులవలె పాపులుగా ఎంచబడినవాళ్లం కాదు’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: మూలవాక్యం వ్యత్యాసాన్ని నేరుగా చెబుతుంది. తరువాతి సందర్భం దానిని సవరిస్తుంది గాని, ఆ వివరణను ఈ ఒక్క వచనంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలిని వాడాం. ‘అన్యజనులు,’ ‘పాపులు’ వంటి బైబిలు సందర్భంలో పరిచితమైన పదాలను నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా నిర్మించాం.
