revisions:
- from: మనం పుట్టుకతో యూదులం; అన్యజనుల్లోనుంచి వచ్చిన పాపులం కాదు.[a][b]
  to: మేము పుట్టుకతో యూదులము; అన్యజనులలోని పాపులము కాదు.[a][b]
  rationale: The revision removes the unsupported idea of ‘coming from’ the Gentiles and uses a direct Telugu construction for ‘sinners from among the Gentiles.’ It also changes the pronoun to the contextually appropriate exclusive ‘మేము.’ The source’s potentially sharp ethnic contrast is retained without interpretive expansion or doctrinal softening.
  reviewer_model: gpt-5.6-terra
