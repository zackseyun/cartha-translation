source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: te
  text: నేను దేవుని కృపను నిరర్థకం చేయను. ఎందుకంటే ధర్మశాస్త్రం ద్వారా నీతి కలుగుతుందంటే, మెస్సీయ[a] వ్యర్థంగా[b] మరణించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు ‘క్రిస్టోస్’; ‘అభిషిక్తుడు’ అని అర్థం. లేదా ‘క్రీస్తు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఏ కారణం లేకుండా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: నిరర్థకం చేయను
  rationale: దేవుని కృపను పక్కన పెట్టడం మాత్రమే కాకుండా, దానిని ఫలితం లేనిదిగా చేయడమనే పౌలు వాదనలోని బలాన్ని తెలియజేస్తుంది.
- source_word: χάριν
  choice: కృప
  rationale: దేవుడు అనుగ్రహించే అయాచిత అనుకూలతను సూచించే సహజమైన, స్థిరమైన తెలుగు పదం.
- source_word: διὰ νόμου
  choice: ధర్మశాస్త్రం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనం లేదా మార్గం అనే భావాన్ని సహజంగా నిలుపుతుంది; గ్రీకులో క్రియ లేకపోయినా తెలుగులో వాక్యార్థం కోసం ‘కలుగుతుంది’ చేర్చబడింది.
- source_word: δικαιοσύνη
  choice: నీతి
  rationale: దేవుని ఎదుట సరైన స్థితి మరియు న్యాయసంబంధమైన సరిచేయడం రెండింటినీ పూర్తిగా సంకుచితం చేయకుండా మోయగల తెలుగు పదం.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός వ్యక్తినామంలా కాక అభిషిక్తుడనే బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
- source_word: δωρεὰν
  choice: వ్యర్థంగానే
  rationale: ఈ షరతుతో కూడిన వాదనలో మెస్సీయ మరణం ప్రయోజనం లేనిదైపోతుందనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘ఏ కారణం లేకుండా’ అనే భావఛాయను పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: ధర్మశాస్త్రం ద్వారా δικαιοσύνη కలగడం గురించి పౌలు చేస్తున్న వాదన
  choice: ధర్మశాస్త్రం ద్వారా నీతి కలుగుతుందనే ఊహ నిజమైతే, మెస్సీయ మరణం వ్యర్థమవుతుందని వాక్యం చెబుతుంది.
  alternative: ‘నీతి’ని ప్రధానంగా న్యాయం లేదా ఒడంబడిక సంబంధాల సరిచేయడంగా వినవచ్చు.
  rationale: అసలు వాక్యంలోని సంక్షిప్తమైన షరతును విస్తరించి ఏ ప్రత్యేక సిద్ధాంత పద్ధతినీ రుద్దకుండా, నీతి మరియు ధర్మశాస్త్రం మధ్య ఉన్న వేదాంతపరమైన ఉద్రిక్తతను అలాగే ఉంచింది.
- issue: Χριστός బిరుదా లేక పేరులా అనువదించాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో ‘అభిషిక్తుడు’ అనే బిరుదు భావాన్ని ముందుకు తెస్తుంది; అయితే ప్రాచుర్యంలో ఉన్న ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను, సాధారణ పాఠకుడికి స్పష్టతను కలిపిన శైలి. గ్రీకు వాక్యంలోని సంక్షిప్త షరతును తెలుగులో సహజంగా చేయడానికి ‘కలుగుతుందంటే’ మరియు ‘మరణించినట్టే’ ఉపయోగించబడ్డాయి.
