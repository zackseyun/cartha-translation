id: GAL.2.12
reference: Galatians 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: te
  text: ఎందుకంటే, కొందరు[a] యాకోబు దగ్గరనుంచి[b] రాకముందు అతడు యూదేతరులతో కలిసి భోజనం చేస్తూ ఉండేవాడు. అయితే వారు వచ్చినప్పుడు, సున్నతి వర్గానికి చెందినవారికి[c] భయపడి, వెనక్కి తగ్గడం, తనను తాను వేరుచేసుకోవడం మొదలుపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొంతమంది.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యాకోబుతో సంబంధమున్నవారి మధ్యనుంచి’; గ్రీకు మాట మాత్రమే ఆధారంగా యాకోబు వారిని అధికారికంగా పంపాడని చెప్పలేం.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘సున్నతి పొందినవారి వర్గానికి చెందినవారికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ ἐλθεῖν
  choice: రాకముందు
  rationale: πρόతో కూడిన articular infinitive యొక్క కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τινας
  choice: కొందరు
  rationale: నిర్దిష్టంగా పేర్లు చెప్పని వ్యక్తులను సూచించే masculine plural భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀπὸ Ἰακώβου
  choice: యాకోబు దగ్గరనుంచి
  rationale: యాకోబుతో మూలం లేదా సంబంధం ఉందనే భావాన్ని తెలుపుతుంది; ఆయన వారిని అధికారికంగా పంపాడని అదనంగా నిర్ధారించదు.
- source_word: μετὰ τῶν ἐθνῶν
  choice: యూదేతరులతో కలిసి
  rationale: పౌలు వాడుకలో ἔθνη సూచించే అన్యజనుల భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది; ‘విశ్వాసులు’ అనే పదాన్ని చేర్చదు.
- source_word: συνήσθιεν
  choice: భోజనం చేస్తూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని అలవాటుగా కొనసాగిన చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπέστελλεν
  choice: వెనక్కి తగ్గి
  rationale: సామాజిక ఒత్తిడివల్ల వెనుదీయడం లేదా ఉపసంహరించుకోవడం అనే క్రియాభావాన్ని ఇస్తుంది.
- source_word: ἀφώριζεν ἑαυτόν
  choice: తనను తాను వేరుచేసుకోవడం మొదలుపెట్టాడు
  rationale: reflexive భావాన్నీ, ఇతరులతో భోజన సహవాసం నుంచి విడిపోవడాన్నీ నిలుపుతూ imperfect సందర్భంలో మొదలైన ప్రక్రియను వ్యక్తం చేస్తుంది.
- source_word: φοβούμενος
  choice: భయపడి
  rationale: participial రూపంలోని కారణార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς ἐκ περιτομῆς
  choice: సున్నతి పొందినవారికి
  rationale: గ్రీకు పదబంధం ఆ గుంపును సున్నతి ఆధారంగా గుర్తిస్తుందనే భావాన్ని ఉంచుతుంది; ప్రధాన పాఠ్యంలో ‘పక్షం’ లేదా ‘వర్గం’ అని అదనంగా నిర్ణయించదు.
theological_decisions:
- issue: ἀπὸ Ἰακώβου అనే మాట యాకోబు ఆ వ్యక్తులను అధికారికంగా పంపాడని సూచిస్తుందా?
  choice: యాకోబు దగ్గరనుంచి
  alternative: యాకోబు పంపినవారు
  rationale: గ్రీకు మూలం లేదా అనుబంధాన్ని సూచిస్తుంది గాని అధికారిక అనుమతిని లేదా వారి వైఖరికి యాకోబు మద్దతును స్పష్టంగా చెప్పదు; అందువల్ల ఆ సందిగ్ధతను నిలిపాం.
- issue: τοὺς ἐκ περιτομῆς ను ఒక నిర్దిష్ట ‘సున్నతి పక్షం’గా పేర్కొనాలా?
  choice: సున్నతి పొందినవారు
  alternative: సున్నతి వర్గానికి చెందినవారు
  rationale: మూలపాఠ్యం వారిని సున్నతితో గుర్తిస్తుంది; అది తప్పనిసరిగా ఒక అధికారిక ముఠా లేదా పక్షం అని చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘ఎందుకంటే’ ద్వారా γάρను నిలిపి, గతంలో అలవాటుగా సాగిన సహభోజనాన్ని ‘చేస్తూ ఉండేవాడు’తో వ్యక్తం చేశాం. యాకోబు ప్రమేయం మరియు సున్నతి గుంపు స్వరూపం విషయంలో మూలంలోని సందిగ్ధతను పరిష్కరించకుండా ఉంచాం.
