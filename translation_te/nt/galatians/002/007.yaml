source:
  edition: SBLGNT
  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: te
  text: అయితే, అందుకు విరుద్ధంగా, సున్నతి లేనివారి కోసం సువార్త నాకు అప్పగించబడిందని వారు చూసినప్పుడు—సున్నతి పొందినవారి కోసం పేతురుకు అప్పగించబడినట్లే—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: అయితే అందుకు విరుద్ధంగా
  rationale: రెండు పదాలు కలిసి ముందున్న భావానికి బలమైన వ్యతిరేకతను సూచిస్తున్నాయి; ఈ తెలుగు ప్రయోగం ఆ బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἰδόντες
  choice: వారు గ్రహించారు
  rationale: ఇక్కడ ‘చూశారు’ అనేది కేవలం దృష్టితో చూడడం కంటే పరిస్థితిని గుర్తించడం లేదా గ్రహించడం అనే భావంలో ఉంది.
- source_word: πεπίστευμαι
  choice: నాకు అప్పగించబడిందని
  rationale: πιστεύω యొక్క పరిపూర్ణ కర్మణి రూపం ఇక్కడ ఒక బాధ్యత లేదా సేవను నమ్మి అప్పగించడాన్ని సూచిస్తుంది; కర్మణి భావాన్ని నిలిపింది.
- source_word: τὸ εὐαγγέλιον
  choice: సువార్త
  rationale: పౌలు సందర్భంలో εὐαγγέλιονకు స్థిరమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: τῆς ἀκροβυστίας
  choice: సున్నతి లేనివారి కోసం
  rationale: గ్రీకు పదంలోని సున్నతి-స్థితి సూచనను కాపాడుతూ, ఈ షష్ఠీ విభక్తి ఉద్దేశిత ప్రజలను సూచిస్తుందని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: καθὼς
  choice: అలాగే
  rationale: పౌలు, పేతురు పొందిన బాధ్యతల మధ్య సమాంతర పోలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Πέτρος
  choice: పేతురు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: τῆς περιτομῆς
  choice: సున్నతి పొందినవారి కోసం
  rationale: ముందున్న ‘సున్నతి లేనివారి కోసం’ అనే పదబంధంతో సమతూకాన్ని ఉంచి, గ్రీకులోని ఒడంబడిక-సాంస్కృతిక గుర్తింపును నిలుపుతుంది.
- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: అది పేతురుకు అప్పగించబడిందని
  rationale: గ్రీకులో ముందరి క్రియాభావం రెండవ భాగంలో అధ్యాహారంగా ఉంది; స్పష్టమైన, సహజ తెలుగు వాక్యానికి దానిని పునరుక్తం చేసింది.
theological_decisions:
- issue: ἀκροβυστία / περιτομή పదాలను జాతిపరంగా అనువదించాలా, లేక గ్రీకులోని సున్నతి గుర్తింపునే నిలపాలా?
  choice: సున్నతి లేనివారు / సున్నతి పొందినవారు
  alternative: యూదేతరులు / యూదులు; సున్నతిలేమి / సున్నతి
  rationale: మూలపాఠం జాతుల పేర్లను నేరుగా వాడకుండా సున్నతి స్థితి ఆధారిత ఒడంబడిక-సామాజిక గుర్తింపులను వాడుతుంది. ప్రధాన పాఠంలో వాటిని నిలపడం పౌలు మాటతీరును అతిగా వ్యాఖ్యానించకుండా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సువార్త’, ‘సున్నతి’, ‘పేతురు’ వంటి స్థిర బైబిలు పదాలను ఉంచుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దింది.
