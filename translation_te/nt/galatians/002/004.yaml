revisions:
- from: అయితే, రహస్యంగా లోపలికి తీసుకురాబడిన అబద్ధ సహోదరుల[a] కారణంగా—వారు మెస్సీయ యేసులో[b] మనకున్న స్వేచ్ఛపై గూఢచర్యం చేసి, మనలను బానిసలుగా చేసుకోవడానికి చొరబడ్డారు—
  to: అయితే, రహస్యంగా లోపలికి చేర్చబడిన కపట సహోదరుల[a] కారణంగా—వారు మెస్సీయ యేసులో[b] మనకున్న స్వేచ్ఛను రహస్యంగా పరిశీలించడానికి, మనలను బానిసలుగా చేయడానికి చొరబడ్డారు—
  rationale: 'The revision improves idiomatic modern Telugu while retaining the source’s deliberate repetition of covert action: these people were secretly introduced and themselves infiltrated. It renders κατασκοπῆσαι as covert examination of the believers’ freedom, retains the purpose clause concerning enslavement, and preserves the source’s unfinished, continuing syntax with the final dash. Footnote anchors remain attached to the relevant terms.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:00:08Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two distinct covert-entry expressions (παρεισάκτους and παρεισῆλθον), the purpose of spying on the believers’ freedom, and the intended enslavement. However, “స్వేచ్ఛపై గూఢచర్యం చేసి” is not idiomatic Telugu for κατασκοπῆσαι and slightly obscures that the freedom itself is the object being investigated.
  naturalness: “రహస్యంగా లోపలికి తీసుకురాబడిన” is understandable but cumbersome, and “అబద్ధ సహోదరులు” is less natural than the established modern Telugu expression “కపట సహోదరులు.” “స్వేచ్ఛను రహస్యంగా పరిశీలించడానికి” communicates the hostile covert investigation naturally without weakening it.
  terminology: “మెస్సీయ యేసు,” “స్వేచ్ఛ,” and “బానిసలుగా చేయడానికి” appropriately preserve the source’s title, freedom language, and slavery metaphor. “కపట సహోదరులు” retains Paul’s familial term while naturally conveying people falsely presenting themselves as fellow believers.
  issues:
  - severity: medium
    issue: The rendering “స్వేచ్ఛపై గూఢచర్యం చేసి” is awkward and imprecise.
    rationale: 'κατασκοπῆσαι takes “our freedom” as its object: the intruders entered in order to inspect/spy out that freedom. Telugu “పై గూఢచర్యం” is not a natural construction here and can sound as though the freedom itself performs or receives intelligence activity.'
  - severity: low
    issue: “అబద్ధ సహోదరులు” is a literal but less idiomatic designation.
    rationale: “కపట సహోదరులు” is natural modern Telugu and conveys ψευδαδέλφους as persons who claim fellow-believer status falsely, while retaining “సహోదరులు.”
  - severity: low
    issue: “లోపలికి తీసుకురాబడిన” is heavier than necessary.
    rationale: “రహస్యంగా లోపలికి చేర్చబడిన” preserves the passive sense of παρεισάκτους and reads more smoothly.
  revised_text: అయితే, రహస్యంగా లోపలికి చేర్చబడిన కపట సహోదరుల[a] కారణంగా—వారు మెస్సీయ యేసులో[b] మనకున్న స్వేచ్ఛను రహస్యంగా పరిశీలించడానికి, మనలను బానిసలుగా చేయడానికి చొరబడ్డారు—
  revised_footnotes:
  - marker: a
    text: ‘కపట సహోదరులు’ అనే మాట పౌలు వాడిన కుటుంబ సంబంధ పదాన్ని నిలుపుతుంది; వీరు తమను తోటి విశ్వాసులుగా చూపించుకున్నవారని ఈ పదబంధం సూచిస్తుంది.
    reason: cultural_note
