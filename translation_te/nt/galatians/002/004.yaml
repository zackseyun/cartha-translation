id: GAL.2.4
reference: Galatians 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: te
  text: అయితే, రహస్యంగా లోపలికి చేర్చబడిన కపట సహోదరుల[a] కారణంగా—వారు మెస్సీయ యేసులో[b] మనకున్న స్వేచ్ఛను రహస్యంగా పరిశీలించడానికి, మనలను బానిసలుగా చేయడానికి చొరబడ్డారు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కపట సహోదరులు’ అనే మాట పౌలు వాడిన కుటుంబ సంబంధ పదాన్ని నిలుపుతుంది; వీరు తమను తోటి విశ్వాసులుగా చూపించుకున్నవారని ఈ పదబంధం సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా ‘క్రీస్తు యేసులో.’
    reason: alternative_reading
lexical_decisions:
- source_word: παρεισάκτους
  choice: రహస్యంగా లోపలికి తీసుకురాబడిన
  rationale: బయటివారిని ఎవరో రహస్యంగా లోపలికి ప్రవేశపెట్టారనే విశేషణార్థాన్ని నిలుపుతుంది; వెంటనే వచ్చే παρεισῆλθον అనే క్రియతో దీన్ని కలిపివేయదు.
- source_word: ψευδαδέλφους
  choice: అబద్ధ సహోదరులు
  rationale: పౌలు ఉపయోగించిన కుటుంబ సంబంధ పదచిత్రాన్ని, అలాగే అతని తీవ్ర విమర్శను నిలుపుతుంది. ఇది నిజమైన సహోదరులు కాదని సూచిస్తుంది.
- source_word: παρεισῆλθον
  choice: చొరబడ్డారు
  rationale: రహస్యంగా, అనుమతి లేకుండా లోపలికి వచ్చిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατασκοπῆσαι
  choice: గూఢచర్యం చేసి
  rationale: కేవలం గమనించడం కాకుండా శత్రుత్వపూర్వకంగా రహస్యంగా పరిశీలించడమనే బలమైన భావాన్ని తెలియజేస్తుంది.
- source_word: ἐλευθερίαν
  choice: స్వేచ్ఛ
  rationale: పదంలోని సామాజిక, ఆధ్యాత్మిక బలాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: Χριστός యొక్క బిరుదు భావాన్ని వినిపించేలా ‘మెస్సీయ’ అని అనువదిస్తూ, ἐν అనే సంబంధాన్ని ‘లో’తో నిలుపుతుంది.
- source_word: καταδουλώσουσιν
  choice: బానిసలుగా చేసుకోవడానికి
  rationale: ఒకరిని బానిసత్వంలోకి తగ్గించడమనే క్రియ యొక్క ప్రత్యక్షమైన, బలమైన భావాన్ని కాపాడుతుంది.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: మనలను బానిసలుగా చేసుకోవడానికి
  rationale: ἵνα సూచించే ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకులో అసాధారణంగా ఉన్న భవిష్యత్ సూచక క్రియారూపాన్ని తెలుగులో కృత్రిమంగా అనుకరించదు.
theological_decisions:
- issue: Χριστῷను బిరుదుగా అనువదించాలా, పేరు వలె ఉంచాలా
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఈ సందర్భంలో Χριστόςకు అభిషిక్త రాజు అనే బిరుదు భావం ఇంకా స్పష్టంగా ఉండగలదు. అందువల్ల దాన్ని కేవలం పేరు వలె కాకుండా ‘మెస్సీయ’గా అనువదించాం; సుపరిచితమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: అసంపూర్ణ వాక్య నిర్మాణాన్ని ఎలా నిర్వహించాలి
  choice: వచనం చివర దీర్ఘ విరామచిహ్నాన్ని నిలుపడం
  alternative: తదుపరి వచనంలోని భావాన్ని చేర్చి పూర్తి వాక్యంగా మార్చడం
  rationale: గ్రీకు మూలంలో ఈ వచనం వాక్య నిర్మాణ ఉద్వేగంతో మధ్యలోనే కొనసాగుతుంది. దాన్ని నిశ్శబ్దంగా పూర్తి చేయకుండా అసంపూర్ణతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘చొరబడ్డారు,’ ‘గూఢచర్యం,’ ‘బానిసలుగా’ వంటి పదాలు మూలంలోని రహస్య ప్రవేశం, శత్రుత్వం, బలవంతం అనే తీవ్రతను నిలుపుతాయి. మూలంలోని అసంపూర్ణ వాక్య ప్రవాహాన్ని చివరి దీర్ఘ విరామచిహ్నంతో కాపాడాం.
