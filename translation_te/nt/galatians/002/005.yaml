id: GAL.2.5
reference: Galatians 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: te
  text: వారికి మేము క్షణకాలమైనా లొంగలేదు, తద్వారా సువార్త యొక్క సత్యం మీ కొరకు నిలిచి ఉండాలని.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సువార్త యొక్క సత్యం మీతో నిలిచి ఉండాలని.” “క్షణకాలమైనా” అనే మాటకు అక్షరార్థం “ఒక గంటసేపు కూడా కాదు”; ఇది “ఒక్క క్షణమైనా కాదు” అనే భావమిచ్చే నానుడి.
    reason: πρὸς ὑμᾶςకు ‘మీ కొరకు’తో పాటు ‘మీతో’ అనే సంబంధార్థక ప్రత్యామ్నాయాన్ని, అలాగే πρὸς ὥραν నానుడి యొక్క అక్షరార్థాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: οἷς
  choice: వారికి
  rationale: ఈ సంబంధ సర్వనామం ముందటి వచనంలో ప్రస్తావించిన వ్యక్తులను సూచిస్తుంది; తెలుగులో ‘వారికి’ సహజంగా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: οὐδὲ πρὸς ὥραν
  choice: క్షణకాలమైనా ... లేదు
  rationale: అక్షరార్థంగా ‘ఒక గంటసేపైనా కాదు’; సందర్భంలో కొద్దిసేపు కూడా కాదనే నానుడి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἴξαμεν τῇ ὑποταγῇ
  choice: లొంగలేదు
  rationale: εἴκωలోని తలొగ్గడం, ὑποταγήలోని అధీనత భావాలను తెలుగులో ఒక సహజమైన క్రియతో తెలియజేస్తుంది; వ్యక్తిగత లేదా సంస్థాగత విధేయతగా అతిగా నిర్దిష్టం చేయదు.
- source_word: ἵνα
  choice: '... ఉండాలని'
  rationale: గ్రీకు పదబంధంలోని ఉద్దేశ్య భావాన్ని తెలుగులో సహజమైన ఉద్దేశ్య నిర్మాణంతో నిలుపుతుంది.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: సువార్త సత్యం
  rationale: పౌలు ఉపయోగించిన ప్రధాన భావబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా కాపాడుతుంది.
- source_word: διαμείνῃ
  choice: నిలిచి ఉండాలని
  rationale: కొనసాగి ఉండడం లేదా కాపాడబడి ఉండడం అనే క్రియాభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πρὸς ὑμᾶς
  choice: మీ కోసం
  rationale: గలతీయుల ప్రయోజనం లేదా వారిపట్ల దిశను సూచించే సాధ్యమైన భావాన్ని తెలియజేస్తుంది; ‘మీ దగ్గర’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: వ్యతిరేకుల ఎదుట పౌలు చేసిన నిరాకరణ స్వరూపం
  choice: వారికి అసలు లొంగలేదని విస్తృతంగానే చెప్పడం
  alternative: వ్యక్తిగతంగా తనను తాను లోబరచుకోలేదు; లేదా సంస్థాగత రాయితీ ఇవ్వలేదు
  rationale: గ్రీకు వాక్యం ‘లొంగడం’ అనే భావాన్ని విస్తృతంగా ఉంచుతుంది; దాన్ని కేవలం వ్యక్తిగత లేదా కేవలం సంస్థాగత అంశంగా పరిమితం చేయదు.
- issue: πρὸς ὑμᾶς యొక్క సంబంధ భావం
  choice: మీ కోసం
  alternative: మీ దగ్గర / మీ మధ్య
  rationale: ఈ విభక్తి ప్రయోగం గలతీయుల ప్రయోజనాన్ని లేదా వారితో కొనసాగిన సంబంధాన్ని సూచించవచ్చు; ప్రధాన పాఠ్యంలో ప్రయోజనార్థాన్ని తీసుకొని, నిజమైన అస్పష్టతను పాదటిప్పణిలో కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. ‘సువార్త’ వంటి స్థిరమైన బైబిలు పదాన్ని ఉంచి, వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దింది.
