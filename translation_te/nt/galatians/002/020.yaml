id: GAL.2.20
reference: Galatians 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: te
  text: ఇక జీవించేది నేను కాదు; మెస్సీయే నాలో జీవిస్తున్నాడు. ఇప్పుడు నేను శరీరంలో జీవిస్తున్న ఈ జీవితాన్ని, నన్ను ప్రేమించి నా కోసం తనను తాను అప్పగించిన దేవుని కుమారునిపై విశ్వాసంతో[a] జీవిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని కుమారుని నమ్మకత్వం ద్వారా జీవిస్తున్నాను.”
    reason: πίστις మరియు తదనంతర జనిటివ్ నిర్మాణం ‘కుమారునిపై విశ్వాసం’ లేదా ‘కుమారుని విశ్వాసం/నమ్మకత్వం’ అనే రెండు అర్థాలకు అవకాశం ఇస్తుంది.
lexical_decisions:
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: Χριστόςను వ్యక్తిపేరుగా కాక అభిషిక్తుని సూచించే బిరుదుగా ప్రతిబింబించేందుకు ‘మెస్సీయ’ అని అనువదించాం.
- source_word: ὃ δὲ νῦν ζῶ
  choice: ఇప్పుడు నేను ... జీవిస్తున్న ఈ జీవితాన్ని
  rationale: గ్రీకు భాషలోని సంక్షిప్త నపుంసక సంబంధవాచక నిర్మాణంలో అంతర్లీనంగా ఉన్న ‘జీవితం’ అనే భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ἐν σαρκί
  choice: శరీరంలో
  rationale: ఇక్కడ σάρξ పాపస్వభావాన్ని తప్పనిసరిగా సూచించకుండా ప్రస్తుత దేహసంబంధమైన మానవ ఉనికిని సూచిస్తుంది; ‘శరీరంలో’ అనేది ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πίστει
  choice: విశ్వాసంతో
  rationale: πίστιςకు సాధారణ అర్థమైన ‘విశ్వాసం’ను ప్రధాన పాఠంలో ఉంచాం; ‘విశ్వసనీయత’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: దేవుని కుమారునిపై
  rationale: πίστιςతో ఉన్న సంబంధాన్ని ప్రధాన పాఠంలో కర్మార్థక సంబంధంగా, అంటే కుమారునిపై ఉంచిన విశ్వాసంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: నా కోసం తనను తాను అప్పగించిన
  rationale: παραδίδωμι యొక్క స్వీయ సమర్పణ భావాన్ని, ὑπέρలోని ‘నా కోసం’ అనే ప్రయోజన/ప్రాతినిధ్య భావాన్ని సముచితంగా నిలుపుతుంది.
theological_decisions:
- issue: τῇ τοῦ υἱοῦ τοῦ θεοῦలో πίστιςతో జనిటివ్ సంబంధం
  choice: దేవుని కుమారునిపై విశ్వాసంతో
  alternative: దేవుని కుమారుని విశ్వసనీయతవల్ల
  rationale: గ్రీకు నిర్మాణం కర్మార్థక జనిటివ్ (‘కుమారునిపై విశ్వాసం’) లేదా కర్తార్థక జనిటివ్ (‘కుమారుని విశ్వాసం/విశ్వసనీయత’)గా అర్థమయ్యే అవకాశం ఉంది. ప్రధాన పాఠంలో విస్తృతంగా అర్థమయ్యే మొదటి పఠనాన్ని ఉంచి, రెండవదాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ‘నేను కాదు—మెస్సీయ’ అనే వ్యతిరేకతను బలంగా నిలిపి, ‘శరీరం’ను ‘పాపస్వభావం’గా వ్యాఖ్యానించకుండా నివారించాం.
