  yaml_path: translation/nt/galatians/002/010.yaml
  text: only that we should remember the poor, which was exactly what I was eager to do.
translation:
  language: te
  text: పేదలను జ్ఞాపకం ఉంచుకోవాలని మాత్రమే వారు కోరారు. ఆ పనినే చేయడానికి నేను కూడా ఎంతో శ్రద్ధపడ్డాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: మాత్రమే
  rationale: ఒప్పందానికి జతచేసిన ఏకైక అభ్యర్థనను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: τῶν πτωχῶν
  choice: పేదలను
  rationale: πτωχός ఇక్కడ ఆర్థికంగా పేదవారిని సూచిస్తుంది; ‘పేదలు’ సాధారణమైన, స్థిరమైన తెలుగు పదం.
- source_word: ἵνα μνημονεύωμεν
  choice: జ్ఞాపకం ఉంచుకోవాలని
  rationale: ἵνα ఈ ఒక్క అభ్యర్థనలోని విషయాన్ని పరిచయం చేస్తుంది. ‘జ్ఞాపకం ఉంచుకోవడం’ మూలపదాన్ని నిలుపుతూ, సందర్భంలో వారి పట్ల క్రియాశీల శ్రద్ధను సూచిస్తుంది.
- source_word: ὃ
  choice: ఇదే
  rationale: సంబంధ సర్వనామం ముందున్న అభ్యర్థన మొత్తాన్ని తిరిగి సూచిస్తుంది; తెలుగులో వాక్యసంధిని సహజంగా చేయడానికి సూచనాత్మక రూపం వాడబడింది.
- source_word: ἐσπούδασα
  choice: ఆసక్తిగా ఉన్నాను
  rationale: ఈ క్రియలో ఉత్సాహపూర్వక సిద్ధత, కార్యాచరణ ఉద్దేశం రెండూ ఉన్నాయి; ఈ ఎంపిక వాటిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: సరిగ్గా ఇదే చేయడానికి
  rationale: αὐτὸ τοῦτο లోని బలమైన నిర్దేశాన్ని ‘సరిగ్గా ఇదే’ నిలుపుతుంది; ποιῆσαι లోని కార్యభావం కూడా స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: ‘జ్ఞాపకం ఉంచుకోవడం’ కేవలం మానసిక స్మరణనా, లేక ఆచరణాత్మక సహాయమా?
  choice: మూలంలోని ‘జ్ఞాపకం ఉంచుకోవడం’ అనే వ్యక్తీకరణను నిలుపుట
  alternative: ‘పేదలకు సహాయం చేయడం’ అని స్పష్టీకరించడం
  rationale: సందర్భం ఆచరణాత్మక శ్రద్ధను సూచించినా, మూలపాఠం దానిని నేరుగా ‘సహాయం’గా వివరించదు. అందువల్ల మూలంలోని విస్తృత భావాన్ని, దాని సహజ అంతర్భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని సంక్షిప్తతను నిలుపుతూ, తెలుగులో స్పష్టత కోసం అంతర్భూతమైన ‘వారు కోరారు’ చేర్చబడింది.
