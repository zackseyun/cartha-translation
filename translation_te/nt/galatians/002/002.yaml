  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: te
  text: అయితే, ఒక ప్రత్యక్షతను బట్టి నేను పైకి వెళ్లాను.[a] నేను అన్యజనుల మధ్య ప్రకటిస్తున్న సువార్తను వారి ముందు ఉంచాను; అయితే ప్రాముఖ్యులుగా పరిగణించబడినవారి ముందు మాత్రం వ్యక్తిగతంగా ఉంచాను.[b] ఎక్కడైనా నేను వ్యర్థంగా పరుగెత్తుతున్నానేమో, లేదా పరుగెత్తానేమో అనే ఉద్దేశంతో అలా చేశాను.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక ప్రత్యక్షతకు ప్రతిస్పందనగా నేను పైకి వెళ్లాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రముఖులుగా కనిపించినవారి ముందు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఎక్కడైనా నేను వ్యర్థంగా పరుగెత్తుతున్నానేమో లేదా పరుగెత్తానేమో అన్న ఆందోళనతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: నేను పైకి వెళ్లాను
  rationale: గమ్యస్థానం ఈ వచనంలో స్పష్టంగా చెప్పబడలేదు; అందువల్ల సందర్భం నుంచి ‘యెరూషలేముకు’ అని చేర్చకుండా ἀναβαίνω యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: κατὰ ἀποκάλυψιν
  choice: ఒక ప్రత్యక్షతకు అనుగుణంగా
  rationale: ప్రయాణానికి ప్రత్యక్షత ఆధారంగా లేదా ప్రేరణగా ఉన్నదనే భావాన్ని ఇస్తుంది; కారణార్థక భావం కూడా సాధ్యమని పాదటిప్పణిలో ఉంచబడింది.
- source_word: ἀνεθέμην
  choice: వివరించి ఉంచాను
  rationale: ఇతరుల పరిశీలనకు విషయాన్ని వారి ముందుంచడాన్ని తెలుపుతుంది; అధికారిక ఆమోదం కోసం లోబడినట్టు అనవసరంగా సూచించదు.
- source_word: τὸ εὐαγγέλιον
  choice: సువార్త
  rationale: పౌలు వాడుకలో εὐαγγέλιονకు సహజమైన, స్థిరపడిన తెలుగు పదం.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: అన్యజనుల మధ్య
  rationale: ఇక్కడ ἔθνη భౌగోళిక దేశాలకన్నా యూదేతర ప్రజలను సూచిస్తుంది.
- source_word: κατ’ ἰδίαν
  choice: ఏకాంతంగా
  rationale: విస్తృత సమూహానికి భిన్నంగా జరిగిన వ్యక్తిగత సమావేశ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς δοκοῦσιν
  choice: పేరున్నవారికి
  rationale: వారు ప్రముఖులుగా పరిగణించబడుతున్నారనే భావాన్ని ఉంచుతూ, పౌలు వారి హోదాను పూర్తిగా సమర్థించాడా లేక స్వల్పంగా దూరం పాటించాడా అనే సందిగ్ధతను పరిష్కరించదు.
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: నేను ఇప్పుడు చేస్తున్న పరుగు గానీ, ఇంతవరకు చేసిన పరుగు గానీ వ్యర్థం కాకూడదని
  rationale: τρέχω మరియు ἔδραμον మధ్య వర్తమాన–గత కాల వ్యత్యాసాన్ని స్పష్టమైన తెలుగులో నిలుపుతూ, పరిచర్యకు రూపకమైన ‘పరుగు’ను అలాగే ఉంచుతుంది.
theological_decisions:
- issue: పౌలు తన సువార్తను అపొస్తలుల సవరణ లేదా ఆమోదానికి లోబరచాడా?
  choice: ‘వివరించి ఉంచాను’ అనే తటస్థ పదబంధం
  alternative: ‘ఆమోదం కోసం సమర్పించాను’ లేదా ‘కేవలం తెలియజేశాను’
  rationale: ἀνεθέμην పరిశీలనార్థం ముందుంచడాన్ని సూచించగలదు; అయితే అధికారిక అధీనతనో, అసలు మూల్యాంకనం లేని సమాచారమాత్రాన్నో తప్పనిసరిగా సూచించదు. అందువల్ల మూలంలోని ఉద్రిక్తతను తటస్థంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పైకి వెళ్లాను’ ద్వారా మూలంలో చెప్పని గమ్యాన్ని చేర్చలేదు. ‘పేరున్నవారు’ ద్వారా δοκοῦσινలోని ఉద్దేశపూర్వక అస్పష్టతను నిలిపాం. గ్రీకులోని దీర్ఘ వాక్యాన్ని తెలుగులో చదవడానికి సులభంగా మూడు వాక్యాలుగా విభజించినా, తార్కిక సంబంధాలను అలాగే ఉంచాం.
