revisions:
- from: అయితే, ఒక ప్రత్యక్షతకు అనుగుణంగా నేను పైకి వెళ్లాను.[a] అన్యజనుల మధ్య నేను ప్రకటిస్తున్న సువార్తను వారికి వివరించి ఉంచాను; అయితే, పేరున్నవారికి మాత్రం ఏకాంతంగా వివరించాను.[b] నేను ఇప్పుడు చేస్తున్న పరుగు గానీ, ఇంతవరకు చేసిన పరుగు గానీ వ్యర్థం కాకూడదని అలా చేశాను.[c]
