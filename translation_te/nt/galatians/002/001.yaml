  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: te
  text: తర్వాత, పద్నాలుగు సంవత్సరాల తర్వాత నేను బర్నబాతో కలిసి, తీతును కూడా వెంట తీసుకొని, మళ్లీ యెరూషలేముకు వెళ్లాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: తర్వాత
  rationale: పౌలు చెబుతున్న సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగు అనుసంధాన పదంతో తెలియజేస్తుంది.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: పద్నాలుగు సంవత్సరాల అనంతరం
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ గడిచిన కాలం తరువాత జరిగిన సంఘటనను సూచిస్తుంది; ఈ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: యెరూషలేముకు వెళ్లడం పునరావృతమైనదని మూలపాఠంలోని భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἀνέβην
  choice: వెళ్లాను
  rationale: గ్రీకులోని ‘పైకి వెళ్లాను’ అనే యెరూషలేము ప్రయాణ వాడుకను తెలుగులో అక్షరార్థంగా ‘ఎక్కి వెళ్లాను’ అనడం అసహజం; గమ్యస్థాన ప్రయాణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: εἰς సూచించే గమ్యాన్ని తెలుగు చతుర్థీ ప్రత్యయంతో సహజంగా తెలియజేస్తుంది.
- source_word: μετὰ Βαρναβᾶ
  choice: బర్నబాతో కలిసి
  rationale: సహవాసం లేదా తోడుగా ప్రయాణించిన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: తీతును కూడా వెంట తీసుకెళ్లాను
  rationale: సమకాలిక కృదంత భావాన్ని తెలుగులో సహజమైన సమాపక క్రియగా అందిస్తూ, καί యొక్క అదనపు భావాన్ని ‘కూడా’తో నిలుపుతుంది.
