    reason: lexical_alternative
  revision_rationale: The revision replaces the costume-oriented “వేషధారణ” with modern standard Telugu expressions for hypocritical conduct, while retaining the shared action with Peter, the contrastive “remaining Jews,” and Barnabas's passive being swept along by their conduct. The lexical alternative footnotes remain correctly anchored and reflect viable alternatives without changing the verse's meaning.
