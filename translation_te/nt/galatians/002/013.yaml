translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘వేషధారణ’ను పునరావృతం చేసి మూలంలోని ὑπόκρισις పదబంధ ప్రాధాన్యాన్ని నిలిపాము; ‘వారితోపాటు కొట్టుకుపోయాడు’ సామాజిక ఒత్తిడి మరియు కర్మణి భావం రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
