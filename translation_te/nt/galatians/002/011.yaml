    reason: lexical_alternative
  revision_rationale: The revised text restores the source sequence and replaces a potentially judicially specific expression with wording that represents the Greek perfect passive and its continuing-result sense. The existing name and lexical-alternative footnotes remain correctly anchored and useful.
