revisions:
- from: అయితే కేఫా[a] అంతియొకయకు వచ్చినప్పుడు, అతడు దోషిగా తేలాడు[b] కాబట్టి నేను అతనిని ముఖాముఖిగా ఎదిరించాను.
  to: అయితే కేఫా[a] అంతియొకయకు వచ్చినప్పుడు, నేను అతనిని ముఖాముఖిగా ఎదిరించాను, ఎందుకంటే అతడు ఖండనకు గురైనవాడై ఉన్నాడు.[b]
