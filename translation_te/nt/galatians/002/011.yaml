  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: te
  text: అయితే కేఫా[a] అంతియొకయకు వచ్చినప్పుడు, నేను అతనిని ముఖాముఖిగా ఎదిరించాను, ఎందుకంటే అతడు ఖండనకు గురైనవాడై ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కేఫా అనేది పేతురుకు ఉన్న అరామీయ పేరు.
    reason: cross_reference
  - marker: b
    text: లేదా, “అతడు స్పష్టంగా తప్పులో ఉన్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: అయితే ... వచ్చినప్పుడు
  rationale: δέలోని స్వల్ప వ్యత్యాసాన్ని, ὅτεలోని కాలసూచనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Κηφᾶς
  choice: కేఫా
  rationale: మూల గ్రీకు పాఠంలో ఉన్న అరామీయ పేరు రూపాన్ని పేరుగానే లిప్యంతరీకరించింది; పరిచితమైన ‘పేతురు’ అనే గుర్తింపును పాదసూచికలో తెలిపింది.
- source_word: εἰς Ἀντιόχειαν
  choice: అంతియొకయకు
  rationale: ఒక పట్టణం వైపు వచ్చిన కదలికను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: అతనిని ముఖాముఖిగా
  rationale: పరోక్షంగా కాక నేరుగా అతని సమక్షంలో ఎదుర్కొన్నాడనే గ్రీకు నుడికార బలాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἀντέστην
  choice: ఎదిరించాను
  rationale: పౌలు బహిరంగంగా ప్రతిఘటించిన భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: కేఫాను ఎదిరించడానికి గల కారణాన్ని తెలుగులో స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: κατεγνωσμένος ἦν
  choice: అతడు దోషిగా తేలాడు
  rationale: పరిణామస్థితిని సూచించే గ్రీకు పరిభాషాత్మక నిష్క్రియ నిర్మాణాన్ని చదవదగిన తెలుగులో అందిస్తూ, కేవలం ‘అతడు తప్పు చేశాడు’ అని వ్యాఖ్యానాత్మకంగా కుదించదు.
theological_decisions:
- issue: Κηφᾶς అనే వ్యక్తి పేరు మరియు గుర్తింపు
  choice: ప్రధాన పాఠంలో ‘కేఫా’ను ఉంచడం
  alternative: పాఠకులకు పరిచితమైన ‘పేతురు’ అని అనువదించడం
  rationale: మూలపాఠంలోని పేరు రూపాన్ని కాపాడుతుంది; కేఫా పేతురే అనే గుర్తింపును పాదసూచిక ద్వారా స్పష్టం చేస్తుంది.
- issue: κατεγνωσμένος ἦν యొక్క భావం
  choice: ‘దోషిగా తేలాడు’
  alternative: ‘అతడు స్పష్టంగా తప్పులో ఉన్నాడు’
  rationale: ప్రధాన పాఠం నిష్క్రియ మరియు పరిణామస్థితి భావాన్ని వీలైనంతగా నిలుపుతుంది; ప్రత్యామ్నాయ పఠనం అతని తప్పు స్పష్టమైందనే సందర్భార్థాన్ని ముందుకు తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ రచించబడింది. ‘ముఖాముఖిగా’ అనే పదం నేరమైన ఎదిరింపును సహజంగా తెలియజేస్తుంది; ‘దోషిగా తేలాడు’ మూలంలోని తీర్పు/ఖండన భావాన్ని అతిగా వివరణ చేయకుండా ఉంచుతుంది.
