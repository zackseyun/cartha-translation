id: GAL.2.9
reference: Galatians 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: te
  text: నాకు అనుగ్రహించబడిన కృపను వారు గుర్తించినప్పుడు, స్తంభాలుగా గుర్తింపు పొందిన యాకోబు, కేఫా, యోహాను బర్నబాకు, నాకు సహభాగితకు చిహ్నంగా కుడిచేతులు ఇచ్చారు[a]. మేము యూదేతరుల మధ్యకు, వారు సున్నతి పొందినవారి మధ్యకు వెళ్లాలని వారు అలా చేశారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సహభాగితకు చెందిన కుడిచేతులు ఇచ్చారు.” ఇది పరస్పర అంగీకారం, భాగస్వామ్యానికి సూచన.
    reason: మూలభాషలోని సంజ్ఞాత్మక పదబంధాన్ని వివరిస్తుంది.
  - marker: b
    text: అక్షరార్థంగా, “వారు సున్నతి దగ్గరికి”; అంటే యూదుల దగ్గరికి.
    reason: ‘సున్నతి’ అనే పదం యూదు ప్రజలకు ప్రతీకగా వాడబడినట్లు వివరిస్తుంది.
lexical_decisions:
- source_word: γνόντες
  choice: గుర్తించిన
  rationale: ఇది కేవలం తెలుసుకోవడమే కాక, పౌలుకు ఇవ్వబడిన కృపను గుర్తించి అంగీకరించడాన్ని కూడా వ్యక్తం చేస్తుంది.
- source_word: χάριν τὴν δοθεῖσάν μοι
  choice: నాకు అనుగ్రహించబడిన కృపను
  rationale: పౌలు పొందిన దేవుని అనుగ్రహాన్ని విస్తృతంగానే ఉంచుతుంది; దానిని కేవలం ఒక నియామకంగా పరిమితం చేయదు.
- source_word: Κηφᾶς
  choice: కేఫా
  rationale: మూలపాఠంలోని పేరును ‘పేతురు’గా మార్చకుండా లిప్యంతరీకరించింది.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: స్తంభాలుగా గుర్తింపు పొందిన
  rationale: వారి బహిరంగ స్థానం, గౌరవాన్ని తెలియజేస్తూ, పౌలు వారిని తక్కువచేసినట్లు అనవసరమైన భావాన్ని కలిగించదు.
- source_word: δεξιὰς ... κοινωνίας
  choice: సహభాగితకు సూచనగా ... కుడిచేతులు అందించారు
  rationale: బహువచనమైన ‘కుడిచేతులు’ను నిలుపుతూ, ఈ సంజ్ఞలోని అంగీకారం మరియు ఉమ్మడి సేవాభాగస్వామ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἔθνη
  choice: యూదేతరులు
  rationale: ఈ సందర్భంలో ఇది రాజకీయ దేశాలను కాక యూదులు కాని ప్రజలను సూచిస్తుంది.
- source_word: περιτομήν
  choice: సున్నతి పొందినవారు
  rationale: ‘సున్నతి’ అనే నామవాచకం ఇక్కడ యూదు ప్రజలకు ప్రతీకగా వాడబడింది; అనువాదం ఆ సూచనను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: κοινωνία అనేది సాధారణ సహవాసాన్నా, సేవలో భాగస్వామ్యాన్నా సూచిస్తుంది?
  choice: సహభాగిత
  alternative: సహవాసం
  rationale: సందర్భం అపొస్తలుల పరస్పర అంగీకారం మరియు సేవాక్షేత్రాల విభజన గురించి ఉంది. ‘సహభాగిత’ సంబంధాన్ని, ఉమ్మడి కార్యాన్ని రెండింటినీ సూచిస్తూ పదార్థాన్ని అతిగా సంకుచితం చేయదు.
- issue: δοκοῦντες అనే పదబంధంలో వ్యంగ్యం లేదా తక్కువచేసే భావం ఉందా?
  choice: స్తంభాలుగా గుర్తింపు పొందిన
  alternative: స్తంభాలుగా కనిపించిన
  rationale: మూలపదం వారి గుర్తింపు పొందిన స్థానాన్ని సూచించగలదు; సందర్భం స్పష్టంగా నిర్దేశించని వ్యంగ్యాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వచనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని పేర్ల క్రమం, ‘కుడిచేతులు’ అనే బహువచనం, యూదేతరులు–సున్నతి పొందినవారు అనే వ్యత్యాసం నిలుపబడ్డాయి.
