revisions:
- from: నాకు అనుగ్రహించబడిన కృపను గుర్తించిన స్తంభాలుగా గుర్తింపు పొందిన యాకోబు, కేఫా, యోహాను, సహభాగితకు సూచనగా బర్నబాకు, నాకు కుడిచేతులు అందించారు[a]. మేము యూదేతరుల దగ్గరికి వెళ్లాలని, వారు సున్నతి పొందినవారి దగ్గరికి వెళ్లాలని[b] అలా చేశారు.
  to: నాకు అనుగ్రహించబడిన కృపను వారు గుర్తించినప్పుడు, స్తంభాలుగా గుర్తింపు పొందిన యాకోబు, కేఫా, యోహాను బర్నబాకు, నాకు సహభాగితకు చిహ్నంగా కుడిచేతులు ఇచ్చారు[a]. మేము యూదేతరుల మధ్యకు, వారు సున్నతి పొందినవారి మధ్యకు వెళ్లాలని వారు అలా చేశారు[b].
  rationale: వాక్యంలోని మొదటి participle యాకోబు, కేఫా, యోహానులు కృపను గుర్తించడాన్ని స్పష్టంగా తెలిపేలా పునర్నిర్మించబడింది. సేవా దిశను సూచించే రెండు పదబంధాలకు ‘మధ్యకు’ వాడబడింది. అర్థం, పేర్లు, బహువచన ‘కుడిచేతులు,’ మరియు వివరణాత్మక పాదటిప్పణి-ఆధారాలు మార్చబడలేదు.
