source:
  edition: SBLGNT
  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: te
  text: అలాగే అబ్రాహాము దేవుణ్ణి నమ్మాడు; అది అతనికి నీతిగా లెక్కించబడింది,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయంగా.”
    reason: δικαιοσύνη పదానికి ‘నీతి’తో పాటు ‘న్యాయం’ అనే పదార్థ ప్రత్యామ్నాయం కూడా ఉంది.
lexical_decisions:
- source_word: καθὼς
  choice: అలాగే
  rationale: అబ్రాహాము ఉదాహరణతో ముందున్న వాదనను పోల్చి బలపరచే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Ἀβραὰμ
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἐπίστευσεν
  choice: నమ్మాడు
  rationale: πιστεύω యొక్క ఏకకాల భూతరూపాన్ని నేరుగా అందిస్తుంది; ‘విశ్వాసముంచాడు’ కంటే సాధారణ పాఠకులకు సహజంగా ఉండి, దేవుడు చెప్పినదాన్ని నమ్మాడనే భావాన్ని నిలుపుతుంది.
- source_word: τῷ θεῷ
  choice: దేవుణ్ణి
  rationale: πιστεύωతో వచ్చిన దత్తివిభక్తి ఇక్కడ దేవుడు చెప్పిన మాటను నమ్మడాన్ని సూచిస్తుంది; ‘దేవునిలో నమ్మకం ఉంచాడు’ అనే మరింత వ్యాఖ్యానాత్మక భావాన్ని చేర్చదు.
- source_word: ἐλογίσθη
  choice: ఎంచబడింది
  rationale: λογίζομαι యొక్క కర్మణి రూపంలో ఉన్న లెక్కించబడటం లేదా ఖాతాలో చేర్చబడటం అనే భావాన్ని గౌరవప్రదమైన, స్థిరపడిన తెలుగులో నిలుపుతుంది.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: ఎవరికి అది నీతిగా ఎంచబడిందో తెలిపే దత్తివిభక్తి భావాన్ని నేరుగా అందిస్తుంది.
- source_word: εἰς δικαιοσύνην
  choice: నీతిగా
  rationale: ఫలితం లేదా హోదాను సూచించే εἰς భావాన్ని సంక్షిప్తంగా అందిస్తూ, పౌలు వాడే δικαιοσύνη యొక్క న్యాయ/సంబంధపరమైన ఉద్వేగాన్ని పూర్తిగా పరిష్కరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: పౌలు ఉటంకించిన δικαιοσύνη పదం అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ సందర్భంలో దేవుని ఎదుట లెక్కింపబడిన స్థితిని ‘నీతి’ సహజంగా తెలియజేస్తుంది. అయితే δικαιοσύνηకు ‘న్యాయం’ అనే నిజమైన పదార్థ పరిధి కూడా ఉన్నందున దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గ్రంథోచిత గౌరవాన్ని నిలుపుతూ అనువదించబడింది. గ్రీకులో వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
