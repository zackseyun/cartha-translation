- from: కాబట్టి, విశ్వాసానికి చెందినవారు విశ్వాసియైన[a] అబ్రాహాముతో పాటు ఆశీర్వదించబడుతున్నారు.
  to: కాబట్టి, విశ్వాసం గలవారు విశ్వాసముగల అబ్రాహాముతో పాటు ఆశీర్వదించబడుతున్నారు.
  rationale: 'The revision improves modern Telugu idiom while preserving every relevant Greek feature: inference, faith-defined identity, present passive blessing, shared participation with Abraham, and the contextual yet disputed nuance of πιστός. The footnote remains anchored to ‘విశ్వాసముగల’ and documents the viable alternative.'
