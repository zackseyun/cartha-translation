  revision_rationale: 'The revision improves modern Telugu idiom while preserving every relevant Greek feature: inference, faith-defined identity, present passive blessing, shared participation with Abraham, and the contextual yet disputed nuance of πιστός. The footnote remains anchored to ‘విశ్వాసముగల’ and documents the viable alternative.'
