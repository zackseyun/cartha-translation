review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the inferential ὥστε, the identity-marking phrase οἱ ἐκ πίστεως, the present passive εὐλογοῦνται, and the shared association denoted by σὺν. Its principal rendering of πιστός as ‘believing’ is defensible in this immediate context, and the alternative ‘faithful’ sense is properly retained in a footnote.
  naturalness: ‘విశ్వాసానికి చెందినవారు’ is intelligible but somewhat calqued and less natural than ‘విశ్వాసం గలవారు.’ Likewise, ‘విశ్వాసియైన అబ్రాహాము’ is grammatical but stiff in modern standard Telugu; ‘విశ్వాసముగల అబ్రాహాము’ is smoother while retaining the intended sense.
  terminology: ‘విశ్వాసం’ appropriately renders πίστις. ‘ఆశీర్వదించబడుతున్నారు’ preserves the present passive. The revision retains the deliberate πιστός ambiguity through the footnote without imposing a theological conclusion.
  issues:
