id: GAL.3.9
reference: Galatians 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: te
  text: కాబట్టి, విశ్వాసం గలవారు విశ్వాసముగల అబ్రాహాముతో పాటు ఆశీర్వదించబడుతున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οἱ ἐκ πίστεως
  choice: విశ్వాసానికి చెందినవారు
  rationale: విశ్వాసం చేత లక్షణీకరించబడిన సమూహం అనే గ్రీకు నిర్మాణంలోని గుర్తింపు భావాన్ని కాపాడుతుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో పౌలు విశ్వాసం చేత లక్షణీకరించబడినవారి గురించి మాట్లాడుతున్నాడు; ఇక్కడ ‘విశ్వసనీయత’ కంటే ‘విశ్వాసం’ తగినది.
- source_word: εὐλογοῦνται
  choice: ఆశీర్వదించబడుతున్నారు
  rationale: వర్తమానకాల నిష్క్రియార్థాన్ని నిలుపుతూ, ఆశీర్వాదం సంపాదించేది కాక పొందేది అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: σὺν
  choice: తో పాటు
  rationale: అబ్రాహాముతో కలిసి అదే ఆశీర్వాదంలో పాలుపొందడం అనే సహచర్య భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: విశ్వాసియైన అబ్రాహాము
  rationale: విశ్వాసమే ప్రధానాంశమైన తక్షణ సందర్భంలో πιστός అనే పదానికి ‘విశ్వసించే వ్యక్తి’ అనే భావాన్ని సహజంగా అందిస్తుంది; ‘నమ్మకమైన’ అనే మరో సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: విశ్వాసం ప్రధానాంశంగా ఉన్న సందర్భంలో అబ్రాహాముకు వర్తించిన πιστός పదాన్ని ఎలా అనువదించాలి
  choice: విశ్వాసియైన అబ్రాహాము
  alternative: నమ్మకమైన అబ్రాహాము
  rationale: πιστός అనే విశేషణం విశ్వసించే వ్యక్తిని గానీ నమ్మకమైన వ్యక్తిని గానీ సూచించగలదు. గలతీయులు 3లోని తక్షణ వాదన అబ్రాహాము విశ్వసించడంపై కేంద్రీకృతమైనందున ప్రధాన పాఠంలో ‘విశ్వాసియైన’ అని ఉంచి, నిజమైన భావసందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. గ్రీకు వాక్యంలోని నిర్ధారణ, సమూహ-గుర్తింపు, నిష్క్రియార్థం, అబ్రాహాముతో కూడిన భాగస్వామ్యం నిలుపబడ్డాయి.
