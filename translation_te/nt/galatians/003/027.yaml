id: GAL.3.27
reference: Galatians 3:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅσοι γὰρ εἰς Χριστὸν ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/027.yaml
  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: te
  text: ఎందుకంటే, మీలో మెస్సీయలోనికి బాప్తిస్మం పొందినవారందరూ మెస్సీయను ధరించుకున్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండు చోట్లా “మెస్సీయ”కు బదులుగా “క్రీస్తు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మెస్సీయను వస్త్రంలా ధరించుకున్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: మీలో ... వారందరూ
  rationale: ὅσοι యొక్క సమగ్ర భావాన్ని, గలతీయులకు ఉన్న ప్రత్యక్ష సంబోధనను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంతో ఉన్న వివరణాత్మక సంబంధాన్ని నిలుపుతుంది.
- source_word: εἰς
  choice: లోనికి
  rationale: బాప్తిస్మ సంబంధమైన పదబంధంలో ఐక్యత లేదా చేర్చబడటం అనే భావాన్ని సిద్ధాంతపరంగా విపులీకరించకుండా కాపాడుతుంది.
- source_word: Χριστόν
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున, అభిషిక్తుడు అనే బిరుదు భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐβαπτίσθητε
  choice: బాప్తిస్మం పొందిన
  rationale: గ్రీకు కర్మణి రూపాన్ని నిలుపుతూ, బాప్తిస్మ విధానాన్ని ప్రత్యేకంగా నిర్ణయించని సాధారణ తెలుగు పదప్రయోగం.
- source_word: ἐνεδύσασθε
  choice: ధరించుకున్నారు
  rationale: వస్త్రం ధరించే రూపకాన్ని సహజంగా నిలుపుతూ, గ్రీకు మధ్యమ వాచ్యంలోని స్వీయ-సంబంధ భావాన్ని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: బాప్తిస్మ పదప్రయోగం ఒక నిర్దిష్ట సంస్కార సిద్ధాంతాన్ని లేదా బాప్తిస్మ విధానాన్ని సూచించాలా?
  choice: మెస్సీయలోనికి బాప్తిస్మం పొందిన
  alternative: మెస్సీయలో ముంచబడిన; మెస్సీయకు సంబంధించి బాప్తిస్మం పొందిన
  rationale: గ్రీకు వాక్యం మెస్సీయలోనికి చేర్చబడే భావాన్ని చెబుతుంది; అయితే బాప్తిస్మ ప్రభావం లేదా భౌతిక విధానంపై తరువాతి సిద్ధాంత వివాదాలను తేల్చదు. అందువల్ల మూలంలోని ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
- issue: ἐνεδύσασθε అనే వస్త్రధారణ రూపకాన్ని ఎలా వ్యక్తపరచాలి?
  choice: మెస్సీయను ధరించుకున్నారు
  alternative: మెస్సీయను వస్త్రంలా కప్పుకున్నారు
  rationale: మూలంలోని సజీవ రూపకాన్ని వివరణగా మార్చకుండా నిలుపుతుంది; దాని ఆధ్యాత్మిక అర్థాన్ని ఏకైక సిద్ధాంత దిశలో పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. ‘బాప్తిస్మం’ అనే విస్తృతంగా గుర్తించబడే పదాన్ని ఉపయోగించి, దాని విధానంపై ఏ సంప్రదాయానికీ ప్రత్యేక మద్దతు ఇవ్వలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
