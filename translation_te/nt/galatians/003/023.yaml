revisions:
- from: అయితే విశ్వాసం[a][d] రాకముందు, బయలుపరచబడబోయే ఆ విశ్వాసం వచ్చేవరకు మనం ధర్మశాస్త్రం కింద కాపాడబడుతూ[b], నిర్బంధించబడి[c] ఉన్నాం.
  to: అయితే విశ్వాసం[a][d] రాకముందు, బయలుపరచబడబోయే ఆ విశ్వాసం వరకు మనం ధర్మశాస్త్రం కింద కాపలాలో ఉంచబడి[b], నిర్బంధించబడి[c] ఉన్నాం.
  rationale: The revision removes the added notion that the second ‘faith’ itself would come, retaining instead its stated impending revelation. It also gives ἐφρουρούμεθα a more contextually precise custodial rendering while preserving the distinct restrictive force of συγκλειόμενοι. All footnote markers remain anchored in the text, and the article note is fully Telugu.
