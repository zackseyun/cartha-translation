id: GAL.3.23
reference: Galatians 3:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: te
  text: అయితే విశ్వాసం[a][d] రాకముందు, బయలుపరచబడబోయే ఆ విశ్వాసం వరకు మనం ధర్మశాస్త్రం కింద కాపలాలో ఉంచబడి[b], నిర్బంధించబడి[c] ఉన్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ విశ్వాసం రాకముందు.’ గ్రీకులో నిర్దిష్ట ఉపపదం ఉంది; అది క్రీస్తుతో ప్రారంభమైన విశ్వాస యుగాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘అదుపులో ఉంచబడి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మూసివేయబడి’ లేదా ‘చెరలో ఉంచబడి.’
    reason: lexical_alternative
  - marker: d
    text: గ్రీకు πίστις పదానికి ‘విశ్వసనీయత’ లేదా ‘నమ్మకం’ అనే అర్థాలు కూడా ఉండవచ్చు; అయితే ఇక్కడి సందర్భానికి ‘విశ్వాసం’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ ... ἐλθεῖν
  choice: '... రాకముందు'
  rationale: πρό తో కూడిన articular infinitive కాలార్థాన్ని వ్యక్తం చేస్తుంది; ఈ తెలుగు రూపం సహజంగా ‘రాకముందు’ అనే భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాదనతో ఉన్న స్వల్ప వ్యత్యాసాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: τὴν πίστιν
  choice: విశ్వాసం
  rationale: సందర్భంలో πίστις‌కు ‘విశ్వాసం’ ప్రధాన అర్థం. గ్రీకు definite article సూచించగల రక్షణ-చరిత్రాత్మక భావాన్ని రెండవ ప్రస్తావనలో ‘ఆ విశ్వాసం’ ద్వారా కొంత నిలిపాం; మొదటి చోట సహజ తెలుగు కోసం article‌ను బలవంతంగా వ్యక్తం చేయలేదు.
- source_word: ὑπὸ νόμον
  choice: ధర్మశాస్త్రం కింద
  rationale: మోషే ధర్మశాస్త్రపు అధికారానికి లేదా పాలనకు లోబడి ఉండడాన్ని సూచించే పౌలు వాడుకకు ఇది స్పష్టమైన, సుపరిచితమైన తెలుగు రూపం.
- source_word: ἐφρουρούμεθα
  choice: కాపాడబడుతూ ... ఉన్నాం
  rationale: అసంపూర్ణ భూతకాల passive యొక్క కొనసాగుతున్న గత చర్యను నిలుపుతుంది. ‘కాపాడబడుతూ’ అనే పదం రక్షణ మరియు కావలి అనే రెండు సంభావ్య ఛాయలను పూర్తిగా మూసివేయదు.
- source_word: συγκλειόμενοι
  choice: నిర్బంధించబడి
  rationale: చుట్టుముట్టి మూసివేయడం లేదా స్వేచ్ఛను పరిమితం చేయడం అనే participle భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς
  choice: '... వచ్చేవరకు'
  rationale: ఈ సందర్భంలో రాబోయే విశ్వాస ప్రకటన వైపు సాగిన కాల పరిమితి/దిశను ‘వరకు’ సహజంగా తెలియజేస్తుంది.
- source_word: τὴν μέλλουσαν πίστιν
  choice: బయలుపరచబడబోయే ఆ విశ్వాసం
  rationale: μέλλουσαν యొక్క భవిష్యదభిముఖ భావాన్ని ‘బోయే’తో, article‌ను ‘ఆ’తో నిలుపుతూ పునరుక్త πίστις‌ను అదే పదంతో అనువదిస్తుంది.
- source_word: ἀποκαλυφθῆναι
  choice: బయలుపరచబడబోయే
  rationale: passive రూపాన్నీ, పౌలు ప్రకటన సంబంధ పదజాలాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: πίστις వ్యక్తిగత విశ్వాసాన్నా, క్రీస్తుతో ప్రారంభమైన రక్షణ-చరిత్రాత్మక విశ్వాస యుగాన్నా సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘విశ్వాసం’ అని ఉంచి, రెండవ ప్రస్తావనలో ‘ఆ విశ్వాసం’ ద్వారా రక్షణ-చరిత్రాత్మక ఛాయను నిలిపాం.
  alternative: ‘ఆ విశ్వాసం’ లేదా ‘విశ్వాస యుగం’; అలాగే సందర్భానుసారం ‘విశ్వసనీయత’ లేదా ‘నమ్మకం’.
  rationale: గలతీయులు 3లో క్రీస్తు రాకకు ముందు-తర్వాత కాలాల వ్యత్యాసం ఉంది; అయినా ‘విశ్వాస యుగం’ అని విస్తరించడం మూలపాఠ్యాన్ని అతిగా నిర్దిష్టం చేస్తుంది. కాబట్టి అసలు వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
- issue: ἐφρουρούμεθα రక్షణాత్మక కాపుదలనో, నిర్బంధ కావలినో సూచిస్తుందా?
  choice: ‘కాపాడబడుతూ’ అని అనువదించి, తరువాతి ‘నిర్బంధించబడి’తో పరిమితి భావాన్ని వ్యక్తం చేశాం.
  alternative: ‘కావలిలో ఉంచబడి’ లేదా ‘అదుపులో ఉంచబడి’.
  rationale: φρουρέωలో కాపాడటం మరియు కావలిలో ఉంచటం రెండింటి ఛాయలు ఉండవచ్చు; వెంట వచ్చే συγκλειόμενοι నిర్బంధ భావాన్ని బలపరుస్తుంది. రెండు పదాల వేర్వేరు పాత్రలను ప్రధాన పాఠ్యం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ధర్మశాస్త్రం,’ ‘విశ్వాసం,’ ‘బయలుపరచబడటం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సహజ వాక్యప్రవాహంతో ఉపయోగించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
