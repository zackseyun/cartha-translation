id: GAL.3.8
reference: Galatians 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: te
  text: లేఖనం, దేవుడు విశ్వాసం ఆధారంగా జనాంగాలను[a] నీతిమంతులుగా ప్రకటిస్తాడని ముందుగానే గ్రహించి, “నీలో అన్ని జనాంగాలు ఆశీర్వదించబడతాయి” అని అబ్రాహాముకు ముందుగానే శుభవార్త ప్రకటించింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అన్యజనులను”; గ్రీకు పదం ἔθνηకు “జనాంగాలు” లేదా “అన్యజనులు” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అబ్రాహాముకు ముందుగానే సువార్త ప్రకటించింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: ముందుగానే చూసి
  rationale: మూలంలోని ముందస్తు గ్రహింపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; లేఖనాన్ని వ్యక్తిగా చిత్రించే వాక్యరీతినీ నిలుపుతుంది.
- source_word: ἡ γραφή
  choice: లేఖనం
  rationale: ఇక్కడ ఇది సాధారణ రచనను కాక, పౌలు వ్యక్తిగా చిత్రిస్తున్న అధికారిక లేఖనాన్ని సూచిస్తుంది. ఏకవచనాన్ని నిలిపింది.
- source_word: ἐκ πίστεως
  choice: విశ్వాసం ఆధారంగా
  rationale: ἐκ సూచించే ఆధారం లేదా ప్రాతిపదికను స్పష్టంగా తెలియజేస్తుంది; ‘విశ్వాసం మాత్రమే’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: δικαιοῖ
  choice: నీతిమంతులుగా తీరుస్తాడు
  rationale: పౌలు వాడిన న్యాయపరమైన భావానికి అనుకూలమైన, తెలుగు బైబిలు భాషలో సుపరిచితమైన రూపం; ‘చేస్తాడు’ లేదా ‘ప్రకటిస్తాడు’ అనే ఒక్క వ్యాఖ్యానానికే భావాన్ని పరిమితం చేయదు.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: జనాలను ... జనాలన్నీ
  rationale: రెండు చోట్లా ఒకే మూలపదానికి సంబంధించిన పదబంధాన్ని ఉంచి, పౌలు మాటకూ అబ్రాహాము వాగ్దానానికీ ఉన్న సంబంధాన్ని స్పష్టంగా చూపుతుంది. ‘అన్యజనులు’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: προευηγγελίσατο
  choice: ముందుగానే శుభవార్త ప్రకటించింది
  rationale: క్రియలోని ‘శుభవార్త ప్రకటించడం’ అనే భావాన్నీ, అది ముందుగా జరిగిందనే కాలసూచననూ రెండింటినీ నిలుపుతుంది.
- source_word: τῷ Ἀβραὰμ
  choice: అబ్రాహాముకు
  rationale: దత్తివిభక్తి పరోక్ష కర్మను సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: Ἐνευλογηθήσονται
  choice: ఆశీర్వదించబడతాయి
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నేరుగా నిలుపుతూ, వాగ్దాన స్వరూపాన్ని కాపాడుతుంది.
- source_word: ἐν σοὶ
  choice: నీలో
  rationale: గ్రీకు విభక్తి సంబంధాన్నీ ఆదికాండపు వాగ్దాన రూపాన్నీ దగ్గరగా అనుసరిస్తుంది; ‘నీ ద్వారా’ వంటి వ్యాఖ్యానాత్మక పరిష్కారాన్ని రుద్దదు.
theological_decisions:
- issue: ἔθνη అనే పదాన్ని ‘జనాలు’గా లేదా ‘అన్యజనులు’గా అనువదించడం
  choice: రెండు సందర్భాల్లోనూ ‘జనాలు’
  alternative: మొదటి సందర్భంలో ‘అన్యజనులు’, ఉద్ధరణలో ‘జనాలు’
  rationale: పౌలు వాడుకలో ‘అన్యజనులు’ అనే భావం సాధ్యమే అయినా, రెండు సందర్భాల్లో ‘జనాలు’ అని ఉంచడం ద్వారా గ్రీకులోని పదపునరుక్తినీ అబ్రాహాము వాగ్దానంతో ఉన్న సంబంధాన్నీ కాపాడుతుంది.
- issue: δικαιόω యొక్క న్యాయపరమైన మరియు ఫలితపరమైన భావవ్యాప్తి
  choice: నీతిమంతులుగా తీరుస్తాడు
  alternative: నీతిమంతులుగా ప్రకటిస్తాడు
  rationale: ‘ప్రకటిస్తాడు’ న్యాయపరమైన భావాన్ని స్పష్టంచేసినా, మూలపదంలోని సంపూర్ణ భావవ్యాప్తిని ముందుగానే ఒకే సిద్ధాంతపరమైన వివరణకు కుదించే అవకాశం ఉంది. ఎంపిక చేసిన రూపం తెలుగు పాఠకులకు సుపరిచితంగా ఉండి ఆ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘లేఖనం’ అనే ఏకవచన వ్యక్తీకరణను, ‘ముందుగానే’ అనే పునరుక్తిని, ఉద్ధరణలోని కర్మణి వాగ్దాన రూపాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. ‘జనములు,’ ‘తీర్చును’ వంటి ప్రాచీన రూపాల బదులు ప్రస్తుత వాడుక రూపాలు ఎంచుకున్నాం.
