id: GAL.3.13
reference: Galatians 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: te
  text: 'మెస్సీయ[a] మన కోసం[b] శాపంగా మారడం ద్వారా ధర్మశాస్త్రపు శాపం నుండి మనలను విమోచించాడు. ఎందుకంటే ఇలా రాయబడి ఉంది[c]: “చెట్టు మీద[d] వేలాడే ప్రతివాడూ శాపగ్రస్తుడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మన పక్షంగా”; “మన స్థానంలో” అనే భావం కూడా సాధ్యమే.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఎందుకనగా.”
    reason: alternative_reading
  - marker: d
    text: ξύλον అనే గ్రీకు పదానికి అక్షరార్థంగా “కలప” లేదా “చెట్టు” అని అర్థం; “చెట్టు” అనే అనువాదం లేఖన ఉద్ధరణలోని పదప్రయోగాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదు భావాన్ని వ్యక్తం చేస్తుంది; అందువల్ల లిప్యంతరీకరించిన “క్రీస్తు”కు బదులు దాని బిరుదు అర్థాన్ని తెలిపే “మెస్సీయ”ను ప్రధాన పాఠ్యంలో వాడాం.
- source_word: ἐξηγόρασεν
  choice: విమోచించాడు
  rationale: వెల చెల్లించి బంధం నుండి విడిపించడం అనే వాణిజ్య నేపథ్యాన్నీ, పౌలు వాడుకలోని రక్షణ భావాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κατάρας / κατάρα
  choice: శాపం / శాపంగా
  rationale: గ్రీకు నామవాచకంలోని న్యాయపరమైన, నిబంధనాపరమైన బలాన్ని తగ్గించకుండా, రెండవ ప్రయోగంలోనూ పౌలు ఉద్దేశపూర్వకంగా వాడిన నామవాచక రూపాన్ని నిలిపాం.
- source_word: νόμου
  choice: ధర్మశాస్త్రపు
  rationale: సందర్భంలో మోషే ధర్మశాస్త్రం ఉద్దేశించబడింది; ఆధునిక తెలుగు బైబిలు వాడుకలో సహజంగా, స్పష్టంగా ఉండే రూపం ఇది.
- source_word: γενόμενος
  choice: మారడం ద్వారా
  rationale: క్రియావిశేషణ కృదంతం విమోచన జరిగిన సాధనాన్ని సూచిస్తున్నదనే సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὲρ ἡμῶν
  choice: మన కోసం
  rationale: మన మేలుకోసం, మన పక్షంగా అనే విస్తృత భావాన్ని నిలుపుతుంది; ప్రధాన పాఠ్యంలోనే “మన స్థానంలో” అనే మరింత నిర్దిష్టమైన ప్రాయశ్చిత్త వివరణను బలవంతంగా చేర్చదు.
- source_word: ὅτι γέγραπται
  choice: ఎందుకంటే … అని రాయబడి ఉంది
  rationale: తరువాతి లేఖన ఉద్ధరణ ముందరి వాక్యానికి ఆధారాన్ని ఇస్తున్న కారణార్థక సంబంధాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: Ἐπικατάρατος
  choice: శాపగ్రస్తుడు
  rationale: ఉద్ధరణలోని బలమైన శాపస్థితిని తెలుగు పాఠకులకు సహజంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: κρεμάμενος
  choice: వేలాడే
  rationale: లేఖన ఉద్ధరణలోని సాధారణ, సూత్రప్రాయ వర్తమాన భావాన్ని నిలుపుతుంది.
- source_word: ξύλου
  choice: చెట్టు
  rationale: ξύλονకు “కలప” అనే అర్థమూ ఉన్నప్పటికీ, ద్వితీయోపదేశకాండపు ఉద్ధరణతో ఉన్న అంతర్పాఠ్య సంబంధాన్ని “చెట్టు” స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రాయశ్చిత్త భాషలో ὑπὲρ ἡμῶν పరిధి
  choice: మన కోసం
  alternative: మన పక్షంగా; మన స్థానంలో
  rationale: ఈ పదబంధం క్రీస్తు చేసిన కార్యం మన మేలుకోసమని స్పష్టంగా చెబుతుంది. అయితే ὑπέρ అనే విభక్త్యర్థక పదం ఒక్కటే నిర్దిష్టమైన ప్రాయశ్చిత్త సిద్ధాంత నమూనాను తప్పనిసరి చేయదు; కాబట్టి ప్రధాన పాఠ్యం దాని విస్తృతిని నిలుపుతుంది.
- issue: γενόμενος κατάραలోని బలమైన నామవాచక వాక్యం
  choice: శాపంగా మారడం
  alternative: శాపగ్రస్తుడవడం
  rationale: పౌలు “శాపగ్రస్తుడు” అనే విశేషణ భావంతో మృదువుగా చెప్పకుండా, క్రీస్తు “శాపం” అయ్యాడనే దిగ్భ్రాంతికరమైన నామవాచక రూపాన్ని వాడాడు; అనువాదం ఆ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. “ధర్మశాస్త్రం,” “విమోచించాడు,” “శాపగ్రస్తుడు” వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచుతూ, వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం.
