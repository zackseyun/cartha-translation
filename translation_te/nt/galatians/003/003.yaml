  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: te
  text: మీరు ఇంత అవివేకులా ఉన్నారు? పరిశుద్ధాత్మ ద్వారా[a] ప్రారంభించి, ఇప్పుడు శరీరం ద్వారా[b] పరిపూర్ణులుగా చేయబడుతున్నారా?[c]
  philosophy: optimal-equivalence
  footnotes:
