    text: లేదా, ‘పరిశుద్ధాత్మలో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మానవ ప్రయత్నం ద్వారా’; ‘పాప స్వభావం ద్వారా’ అనే భావం కూడా సాధ్యమే.
    reason: lexical_alternative
  - marker: c
