  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: te
  text: మధ్యవర్తి ఒక్కరికి చెందినవాడు కాదు[a]; అయితే దేవుడు ఒక్కడే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “మధ్యవర్తి ఒకరివాడు కాదు” లేదా “మధ్యవర్తి ఒక్కరికి చెందినవాడు కాదు.” దీని భావం “ఒక్కరి తరఫున మాత్రమే వ్యవహరించడు” లేదా “ఒక పక్షానికే మధ్యవర్తి కాడు” కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: “దేవుడు ఒక్కడే” అనే మాట ఇశ్రాయేలు ఏకదైవ విశ్వాస ప్రకటనను ప్రతిధ్వనింపజేస్తుండవచ్చు; ద్వితీయోపదేశకాండము 6:4 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: మధ్యవర్తి
  rationale: రెండు పక్షాల మధ్య నిలిచి వ్యవహరించే వ్యక్తిని సూచించే సహజమైన, ఖచ్చితమైన తెలుగు పదం; వాక్యంలోని ఒడంబడిక/న్యాయ సంబంధ భావాన్ని కాపాడుతుంది.
- source_word: ἑνὸς
  choice: ఒక్కడికి చెందినవాడు
  rationale: గ్రీకులోని ‘ఒకనివాడు/ఒక్కడికి చెందినవాడు’ అనే సంక్షిప్తమైన, సందిగ్ధమైన షష్ఠీ విభక్తి నిర్మాణాన్ని సాధ్యమైనంత దగ్గరగా ఉంచుతుంది; ‘ఒక పక్షానికే’ అని అర్థాన్ని పూర్తిగా నిర్ణయించదు.
- source_word: οὐκ ἔστιν
  choice: కాడు
  rationale: ‘కాదు/ఉండడు’ అనే నేర భావాన్ని సహజమైన తెలుగు నామవాక్య నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: రెండవ వాక్యభాగంలోని వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది; మొదటి δέకు ప్రత్యేక కాలసూచక పదాన్ని జోడించలేదు.
- source_word: ὁ δὲ θεὸς εἷς ἐστιν
  choice: అయితే దేవుడు ఒక్కడే
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తమైన ఏకత్వ ప్రకటనను, దాని ఉద్ఘాటనను సహజ తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: మొదటి వాక్యభాగంలోని సంక్షిప్తమైన, ప్రసిద్ధ సందిగ్ధత
  choice: ‘మధ్యవర్తి ఒక్కడికి చెందినవాడు కాడు’ అని సన్నిహితంగా అనువదించడం
  alternative: ‘మధ్యవర్తి ఒక పక్షానికే మధ్యవర్తి కాడు’ లేదా ‘ఒక్కడి తరఫున మాత్రమే వ్యవహరించడు’
  rationale: మధ్యవర్తిత్వానికి సాధారణంగా ఒకటి కంటే ఎక్కువ పక్షాలు ఉంటాయనే భావం ఉండవచ్చు; అయినా గ్రీకు వాక్యం దాన్ని స్పష్టంగా విప్పి చెప్పదు. అందువల్ల మోషే, ధర్మశాస్త్రం, క్రీస్తు లేదా ఒడంబడిక గురించి ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చకుండా ఉద్వేగాన్ని నిలిపింది.
- issue: ‘దేవుడు ఒక్కడే’ అనే ప్రకటన
  choice: ఏకత్వ ప్రకటనను నేరుగా ఉంచడం
  alternative: ‘దేవుడు ఒకే దేవుడు’
  rationale: ఈ రూపం మూలంలోని సరళతను కాపాడుతుంది; ఇశ్రాయేలు ఏకదైవ విశ్వాస ప్రకటనకు ఉండగల ప్రతిధ్వనిని పాదటిప్పణిలో సూచిస్తుంది, కానీ పాఠ్యంలో అదనపు వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని కుదించిన వాదనను అతిగా విప్పకుండా, సహజ తెలుగు కోసం కనీస వ్యాకరణ సర్దుబాటు మాత్రమే చేయబడింది. పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత వాక్యభాగాల వెంట ఉంచబడ్డాయి.
