id: GAL.3.15
reference: Galatians 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: te
  text: 'సోదరులారా[a], నేను మానవుల పద్ధతిలో చెబుతున్నాను: ఒక మనిషి ధ్రువీకరించిన నిబంధనను కూడా ఎవరూ రద్దు చేయరు, దానికి ఎవరూ ఏదీ జోడించరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సోదరులారా’ అనేది గ్రీకులోని పుంలింగ బహువచనమైన అడెల్ఫోయ్ అనే పదానికి అనువాదం. పౌలు తోటి విశ్వాసులను సంబోధిస్తున్నాడు; వారిలో స్త్రీలు కూడా ఉండి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀδελφοί
  choice: సోదరులారా
  rationale: పుంలింగ బహువచన సంబోధనను ప్రధాన పాఠంలో నేరుగా నిలుపుతుంది; ఈ సంబోధనలో స్త్రీ విశ్వాసులు కూడా ఉండే అవకాశం పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: నేను మానవ పద్ధతిలో మాట్లాడుతున్నాను
  rationale: ఇది సాధారణ మానవ వ్యవహారాల నుంచి ఒక ఉదాహరణ చెబుతున్నాననే గ్రీకు నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὅμως
  choice: కూడా
  rationale: సాధారణ మానవ సందర్భంలో సైతం ఈ నియమం వర్తిస్తుందనే వాదనాత్మక బలాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνθρώπου
  choice: ఒక మనిషి
  rationale: గ్రీకులోని ఏకవచన మానవ సూచనను అమూర్తీకరించకుండా నిలుపుతుంది.
- source_word: κεκυρωμένην
  choice: ధ్రువీకరించిన
  rationale: చట్టబద్ధంగా స్థిరపరచబడి అమలులో ఉన్నదనే పరిపూర్ణ కర్మణి భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: διαθήκην
  choice: నిబంధనను
  rationale: అబ్రాహాముతో దేవుని నిబంధన అనే సమీప సందర్భంతో అనుసంధానాన్ని నిలుపుతుంది; వీలునామా అనే నిజమైన ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἀθετεῖ
  choice: రద్దు చేయరు
  rationale: చెల్లకుండా చేయడం లేదా అధికారాన్ని తొలగించడం అనే న్యాయపరమైన భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπιδιατάσσεται
  choice: దానికి ఏదీ చేర్చరు
  rationale: ఇప్పటికే ధ్రువీకరించిన పత్రానికి అదనపు షరతులు లేదా నిబంధనలు జోడించరనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: διαθήκηను ‘నిబంధన’గా అనువదించాలా, ‘వీలునామా’గా అనువదించాలా
  choice: నిబంధన
  alternative: వీలునామా / మరణశాసనం
  rationale: గలతీయులు 3లో పౌలు అబ్రాహాముకు ఇచ్చిన వాగ్దానం, దేవుని నిబంధన గురించి వాదిస్తున్నందున ‘నిబంధన’ సందర్భానుసారంగా అనుసంధానాన్ని మెరుగ్గా నిలుపుతుంది. అయితే గ్రీకు పదానికి న్యాయపరంగా ‘వీలునామా’ అనే అర్థం కూడా ఉండగలదు; దానిని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. న్యాయపరమైన ఉపమాన స్వరాన్ని ‘ధ్రువీకరించిన’, ‘రద్దు’, ‘చేర్చరు’ అనే పదాలతో నిలుపుతూ, అతిగా సాంకేతికమైన భాషను నివారించాం.
