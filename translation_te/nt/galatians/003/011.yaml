  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: te
  text: ధర్మశాస్త్రం ద్వారా దేవుని ఎదుట ఎవరూ నీతిమంతులుగా తీర్చబడరనేది స్పష్టం. ఎందుకంటే, “నీతిమంతుడు విశ్వాసం వలన[a] జీవిస్తాడు.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతిమంతుడు నమ్మకత్వం వలన జీవిస్తాడు.”
    reason: lexical_alternative
  - marker: b
    text: పౌలు హబక్కూకు 2:4ను ఉటంకిస్తున్నాడు.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι δὲ
  choice: అయితే ... ఎందుకంటే
  rationale: δὲ పౌలు వాదనలో స్వల్ప మార్పును సూచిస్తుంది; ‘అయితే’ దానిని అతిశయమైన వ్యతిరేకతగా చూపకుండా సహజంగా వ్యక్తం చేస్తుంది. రెండో ὅτι కారణాన్ని పరిచయం చేస్తున్నందున ‘ఎందుకంటే’గా అనువదించబడింది.
- source_word: ἐν νόμῳ
  choice: ధర్మశాస్త్రం ద్వారా
  rationale: ఈ న్యాయపరమైన సందర్భంలో ἐν సాధనాన్ని సూచిస్తుంది. ‘ద్వారా’ అనే రూపం ధర్మశాస్త్రం నీతిమంతునిగా తీర్చడానికి సాధనం కాదనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: οὐδεὶς
  choice: ఎవరూ ... కాదు
  rationale: సార్వత్రిక నిరాకరణను సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: δικαιοῦται
  choice: నీతిమంతులుగా తీర్చబడరు
  rationale: క్రియ యొక్క న్యాయస్థాన సంబంధమైన, కర్మణి భావాన్ని నిలుపుతూ దేవుని తీర్పులో నీతిమంతులని ప్రకటించబడడాన్ని సూచిస్తుంది.
- source_word: παρὰ τῷ θεῷ
  choice: దేవుని ఎదుట
  rationale: దేవుని తీర్పుకు సంబంధించిన వ్యక్తి స్థితిని, మూలంలోని సంబంధార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: δῆλον
  choice: స్పష్టం
  rationale: పౌలు వాదనలోని నిర్ధారక స్వరాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ὁ δίκαιος
  choice: నీతిమంతుడు
  rationale: విశేషణాన్ని వ్యక్తిని సూచించే నామవాచకంగా వాడిన గ్రీకు రూపాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἐκ πίστεως
  choice: విశ్వాసం మూలంగా
  rationale: ἐκ యొక్క మూలం లేదా ఆధారం అనే భావాన్ని ‘మూలంగా’ నిలుపుతుంది; πίστιςకు ప్రధాన పాఠంలో సాధారణమైన ‘విశ్వాసం’ వాడబడింది. ‘నమ్మకత్వం’ అనే సాధ్యార్థం పాదసూచికలో ఉంచబడింది.
- source_word: ζήσεται
  choice: జీవిస్తాడు
  rationale: గ్రీకు భవిష్యత్ క్రియను తెలుగు సాధారణ భవిష్యదర్థ రూపంతో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Ὁ δίκαιος ἐκ πίστεως ζήσεται అనే ఉల్లేఖనంలోని ἐκ πίστεως భావం
  choice: “నీతిమంతుడు విశ్వాసం మూలంగా జీవిస్తాడు”
  alternative: “నీతిమంతుడు నమ్మకత్వం మూలంగా జీవిస్తాడు”; లేదా “విశ్వాసం మూలంగా నీతిమంతుడైనవాడు జీవిస్తాడు”
  rationale: ప్రధాన పాఠం గ్రీకు పదక్రమానికి దగ్గరగా ఉండి πίστιςను ‘విశ్వాసం’గా ఇస్తుంది. అది ‘నమ్మకత్వం’ అని కూడా అర్థం కావచ్చు; అలాగే ἐκ πίστεωςను ‘నీతిమంతుడు’తో కలిపి చదివే అవకాశం ఉంది. ప్రధాన పాఠం ఆ రెండో నిర్మాణాన్ని నిర్బంధించకుండా ఉంచుతుంది; ప్రధానమైన పదార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే న్యాయపరమైన మరియు ధార్మిక గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘ధర్మశాస్త్రం’, ‘నీతిమంతుడు’, ‘విశ్వాసం’ వంటి సుపరిచిత బైబిలు పదాలను సహజ వాక్యనిర్మాణంలో వాడింది.
