revisions:
- from: అయితే, ధర్మశాస్త్రం ద్వారా దేవుని ఎదుట ఎవరూ నీతిమంతులుగా తీర్చబడరనేది స్పష్టం. ఎందుకంటే, “నీతిమంతుడు విశ్వాసం మూలంగా[a] జీవిస్తాడు.”[b]
  to: ధర్మశాస్త్రం ద్వారా దేవుని ఎదుట ఎవరూ నీతిమంతులుగా తీర్చబడరనేది స్పష్టం. ఎందుకంటే, “నీతిమంతుడు విశ్వాసం వలన[a] జీవిస్తాడు.”[b]
  rationale: The revision removes an unnecessarily contrastive discourse marker and substitutes a more idiomatic Telugu expression for ἐκ πίστεως. It retains the forensic sense of justification, the source’s future assertion, the main rendering “విశ్వాసం,” and the lexical alternative in a correctly anchored footnote.
