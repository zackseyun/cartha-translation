id: GAL.3.7
reference: Galatians 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: te
  text: కాబట్టి విశ్వాసం ఆధారంగా ఉన్నవారే అబ్రాహాము కుమారులని తెలుసుకోండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: తెలుసుకోండి
  rationale: ఈ రూపం సూచనార్థకంగానూ ఆజ్ఞార్థకంగానూ ఉండగలదు. సందర్భంలోని తార్కిక నిర్ధారణను పాఠకులు గుర్తించాలని పౌలు కోరుతున్న భావాన్ని సహజమైన తెలుగు ఆజ్ఞారూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἄρα
  choice: కాబట్టి
  rationale: ముందటి వచనంలో అబ్రాహాము విశ్వాసాన్ని ప్రస్తావించిన దాని నుంచి వచ్చే నిర్ధారణను సూచిస్తుంది.
- source_word: οἱ ἐκ πίστεως
  choice: విశ్వాసం ఆధారంగా ఉన్నవారు
  rationale: ἐκ యొక్క మూలం/ఆధారం అనే భావాన్ని నిలుపుతూ, కేవలం ‘విశ్వసించేవారు’ అని సరళీకరించకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὗτοι υἱοί εἰσιν Ἀβραάμ
  choice: వారే అబ్రాహాము కుమారులు
  rationale: οὗτοι అనే ఉద్ఘాటనను ‘వారే’ నిలుపుతుంది; υἱοί అనే బంధుత్వ రూపకాన్ని లింగతటస్థ పదంతో మార్చకుండా ‘కుమారులు’గా ఉంచుతుంది.
theological_decisions:
- issue: అబ్రాహాము కుటుంబానికి చెందినవారిని నిర్ణయించే ఆధారం
  choice: ‘విశ్వాసం ఆధారంగా ఉన్నవారే’ అని ఉద్ఘాటించడం
  alternative: ‘విశ్వసించేవారు అబ్రాహాము సంతానం’
  rationale: గ్రీకు వాక్యంలోని ἐκ πίστεως మరియు οὗτοι యొక్క ఉద్ఘాటనను నిలుపుతుంది; జీవసంబంధ వంశం, క్రియలు మొదలైన వాటితో పోలికను అనువాదంలో అదనంగా వివరించదు.
- issue: υἱοί యొక్క రూపకం
  choice: ‘అబ్రాహాము కుమారులు’
  alternative: ‘అబ్రాహాము పిల్లలు’ లేదా ‘సంతానం’
  rationale: మూలంలోని కుమారత్వ భాషను, దాని వారసత్వ సంబంధ సూచనను కాపాడుతుంది; అదే సమయంలో వచనం వర్తించే పరిధిపై అదనపు సిద్ధాంత నిర్ణయాన్ని చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన బోధనా శైలి. ‘వారే’ ద్వారా గ్రీకు οὗτοι యొక్క ఉద్ఘాటన సహజంగా నిలుపబడింది.
