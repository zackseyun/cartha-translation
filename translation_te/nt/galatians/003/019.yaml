- from: అయితే ధర్మశాస్త్రం ఎందుకు? అతిక్రమాల కారణంగా అది చేర్చబడింది[b]—వాగ్దానం ఎవరికి చేయబడిందో ఆ సంతానం[a] వచ్చే వరకు. అది దేవదూతల ద్వారా ఒక మధ్యవర్తి చేత నియమించబడింది[c].
  to: అయితే ధర్మశాస్త్రం ఎందుకు? అతిక్రమాల కారణంగా అది చేర్చబడింది[b]—వాగ్దానం ఎవరికి చేయబడిందో ఆ సంతానం[a] వచ్చే వరకు. అది దేవదూతల ద్వారా ఒక మధ్యవర్తి చేత ఏర్పాటు చేయబడింది[c].
