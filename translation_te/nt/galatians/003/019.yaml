id: GAL.3.19
reference: Galatians 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: te
  text: అయితే ధర్మశాస్త్రం ఎందుకు? అతిక్రమాల కారణంగా అది చేర్చబడింది[b]—వాగ్దానం ఎవరికి చేయబడిందో ఆ సంతానం[a] వచ్చే వరకు. అది దేవదూతల ద్వారా ఒక మధ్యవర్తి చేత ఏర్పాటు చేయబడింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వంశసంతానం,” “వంశజుడు.”
    reason: lexical_alternative
  - marker: b
    text: “అతిక్రమాల కారణంగా” అంటే వాటిని అదుపుచేయడానికి, బయటపెట్టడానికి లేదా వాటితో సంబంధించి ధర్మశాస్త్రం ఇవ్వబడిందని అర్థం కావచ్చు; గ్రీకు పదబంధం మరింత నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
  - marker: c
    text: లేదా “నియమించబడింది,” “విధించబడింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: అయితే ధర్మశాస్త్రం ఎందుకు?
  rationale: గ్రీకు వాక్యం సంక్షిప్త ప్రశ్న. సందర్భంలో ధర్మశాస్త్రం ఏమిటని నిర్వచనం అడగడం కంటే, దాని ఉద్దేశం ఏమిటని అడుగుతోంది; సహజమైన ఆధునిక తెలుగులో దీనిని ప్రశ్నారూపంగానే ఉంచాం.
- source_word: νόμος
  choice: ధర్మశాస్త్రం
  rationale: ఇక్కడ పౌలు మోషే ధర్మశాస్త్రాన్ని గుర్తించదగిన వ్యవస్థగా సూచిస్తున్నాడు. తెలుగు బైబిలు వాడుకలో సహజంగా అర్థమయ్యే స్థిర పదాన్ని ఎంచుకున్నాం.
- source_word: τῶν παραβάσεων χάριν
  choice: అతిక్రమాల కారణంగా
  rationale: χάριν తో జనిటివ్ కారణం లేదా ఉద్దేశాన్ని సూచించగలదు. ఈ ఎంపిక ధర్మశాస్త్రం అతిక్రమాలను అరికట్టడానికా, వెల్లడించడానికా, వాటితో మరేదైనా విధంగా సంబంధించిందా అనే విషయాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: προσετέθη
  choice: చేర్చబడింది
  rationale: ప్రస్తావనలో ధర్మశాస్త్రం వాగ్దానానికి తరువాత జోడించబడిందనే సాధారణ పాసివ్ భావాన్ని నిలుపుతుంది.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: వచ్చే వరకు
  rationale: ధర్మశాస్త్రం చేర్చబడిన కాలానికి హద్దుగా ఎదురుచూసిన సంఘటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ σπέρμα
  choice: సంతానం
  rationale: σπέρμα వంశసంతానాన్ని లేదా వాగ్దాన సంబంధమైన వారసుణ్ణి సూచిస్తుంది. తెలుగులో ‘సంతానం’ సహజంగా ఉండి ఏకవచన సమూహార్థ సాధ్యతను కూడా పూర్తిగా మూసివేయదు; ‘విత్తనం’ ఇక్కడ సాధారణ పాఠకునికి జీవశాస్త్రీయ అర్థం కలిగించే ప్రమాదం ఉంది.
- source_word: ᾧ ἐπήγγελται
  choice: వాగ్దానం ఎవరికి చేయబడిందో
  rationale: పర్ఫెక్ట్ పాసివ్ భావాన్ని, అలాగే ముందే చేయబడి ఇప్పటికీ ప్రాముఖ్యత కలిగిన వాగ్దానాన్ని నిలుపుతుంది; కర్తను గ్రీకు చెప్పనందున తెలుగులోనూ చేర్చలేదు.
- source_word: διαταγεὶς
  choice: నియమించబడింది
  rationale: ధర్మశాస్త్రం క్రమబద్ధంగా ఏర్పాటుచేయబడింది లేదా అధికారికంగా విధించబడింది అనే διατάσσω భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: δι’ ἀγγέλων
  choice: దేవదూతల ద్వారా
  rationale: διά తో జనిటివ్ మధ్యవర్తిత్వం లేదా సాధనాన్ని సూచిస్తుంది; ‘ద్వారా’ దాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν χειρὶ μεσίτου
  choice: ఒక మధ్యవర్తి చేత
  rationale: గ్రీకు ‘చేతిలో’ అనే సెమిటిక్ శైలీప్రయోగాన్ని తెలుగులో అర్థవంతమైన కర్తృసాధన ప్రయోగంగా అందిస్తుంది; μεσίτου అనిర్దిష్టంగా ఉన్నందున ‘ఒక’ అని ఉంచాం.
theological_decisions:
- issue: ‘అతిక్రమాల కారణంగా’ అనే పదబంధపు ఉద్దేశం
  choice: అతిక్రమాల కారణంగా
  alternative: అతిక్రమాలను అరికట్టడానికి / బయటపెట్టడానికి / పెంపొందించడానికి
  rationale: గ్రీకు పదబంధం విస్తృతమైనది; ధర్మశాస్త్రం అతిక్రమాలతో ఏ నిర్దిష్ట విధంగా వ్యవహరించిందో వచనం తానే చెప్పదు. అందువల్ల వివాదాస్పద వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: σπέρμα యొక్క పౌలు వాడుక
  choice: సంతానం
  alternative: విత్తనం / వారసుడు / సంతతివాడు
  rationale: అబ్రాహాముకు చేసిన వాగ్దానంతో సంబంధాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా చదివే పదాన్ని వాడాం. పౌలు సమీప సందర్భంలో ఏకవచనాన్ని ప్రాధాన్యపరుస్తున్నప్పటికీ, ఇక్కడ అనువాదంలోనే ‘వారసుడు’ అని అర్థాన్ని కుదించలేదు.
- issue: ధర్మశాస్త్రం ఇవ్వడంలో మధ్యవర్తిత్వం
  choice: దేవదూతల ద్వారా ఒక మధ్యవర్తి చేత నియమించబడింది
  alternative: దేవదూతలచే మధ్యవర్తి చేతిలో ఏర్పాటు చేయబడింది
  rationale: దేవదూతలు మరియు మధ్యవర్తి రెండింటి పాత్రలను గ్రీకు వలే వేరుగా ఉంచాం; మధ్యవర్తి ఎవరో పాఠ్యంలో గుర్తింపుచేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభమైన వాక్యనిర్మాణం. పొడవైన గ్రీకు వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి సంబంధాలను స్పష్టపరిచాం. కీలకమైన భావసందిగ్ధతలను ప్రధాన పాఠ్యం మరియు పాదటిప్పణుల్లో నిలుపుకున్నాం.
