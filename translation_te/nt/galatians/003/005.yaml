id: GAL.3.5
reference: Galatians 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: te
  text: కాబట్టి మీకు ఆత్మను సమృద్ధిగా అనుగ్రహిస్తూ, మీ మధ్య[a] అద్భుత కార్యాలు చేస్తున్నవాడు—ధర్మశాస్త్ర క్రియల మూలంగా అలా చేస్తున్నాడా, లేక విశ్వాసంతో వినడం మూలంగానా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీలో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “విశ్వాసానికి సంబంధించిన వినికిడి మూలంగానా?” లేదా “విశ్వాసంతో విన్న సందేశం మూలంగానా?”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: సమృద్ధిగా అనుగ్రహిస్తూ
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న అనుగ్రహాన్ని, అలాగే సమకూర్చడం/ఉదారంగా అందించడం అనే పదంలోని బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మను
  rationale: గ్రీకు పాఠంలోని నిర్దిష్ట సూచనను కాపాడుతుంది; సందర్భంలో దేవుని ఆత్మ అని స్పష్టంగా ఉన్నందున మూలంలో లేని ‘పరిశుద్ధ’ అనే విశేషణాన్ని చేర్చలేదు.
- source_word: ἐνεργῶν δυνάμεις
  choice: అద్భుత కార్యాలు చేస్తున్నవాడు
  rationale: శక్తివంతమైన దైవకార్యాలు అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది; ‘శక్తులను పనిచేయిస్తున్నాడు’ అనే అక్షరార్థ రూపం అసహజంగా ఉంటుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: గలతీయ సంఘాలలో ప్రత్యక్షమవుతున్న అద్భుత కార్యాలను సూచించడానికి ఇది సహజమైన అర్థం. ‘మీలో’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐξ ἔργων νόμου
  choice: ధర్మశాస్త్ర క్రియల మూలంగా
  rationale: ἐξ యొక్క మూలం/ఆధారం భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, పౌలు వాడే ‘ధర్మశాస్త్ర క్రియలు’ అనే సంక్షిప్త పదబంధాన్ని కాపాడుతుంది.
- source_word: νόμου
  choice: ధర్మశాస్త్రం
  rationale: ఈ వాదన సందర్భంలో మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వినియోగంలో ‘ధర్మశాస్త్రం’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: ἀκοῆς πίστεως
  choice: విశ్వాసంతో వినడం
  rationale: విశ్వాసంతో కూడిన వినికిడి అనే ప్రధాన భావాన్ని సహజంగా అందిస్తూ, ధర్మశాస్త్ర క్రియలతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది. గ్రీకు షష్ఠీ విభక్తి నిర్మాణంలోని ఇతర సాధ్యమైన సంబంధాలను పాదసూచికలో ఇచ్చాం.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో πίστις కు ‘విశ్వాసం’ సహజమైన అర్థం; ‘నమ్మకత్వం’ కంటే పౌలు చూపిస్తున్న వినికిడి-ప్రతిస్పందన వ్యత్యాసానికి ఇది బాగా సరిపోతుంది.
theological_decisions:
- issue: ἀκοῆς πίστεως అనే సంక్షిప్త షష్ఠీ విభక్తి పదబంధం అనేక సమీప అర్థాలకు అవకాశం ఇస్తుంది.
  choice: విశ్వాసంతో వినడం
  alternative: విశ్వాసానికి సంబంధించిన వినికిడి; విశ్వాసంతో విన్న సందేశం
  rationale: ధర్మశాస్త్ర క్రియలు మరియు విశ్వాసంతో కూడిన వినికిడి మధ్య పౌలు ఉంచిన అలంకారిక వ్యత్యాసాన్ని ప్రధాన పాఠం స్పష్టంగా చూపిస్తుంది; అయితే వ్యాకరణపరమైన అస్పష్టతను పాదసూచికలో కాపాడుతుంది.
- issue: ἐν ὑμῖν సమూహం మధ్య జరిగే కార్యాలనో, వ్యక్తులలో జరిగే కార్యాలనో సూచించవచ్చు.
  choice: మీ మధ్య
  alternative: మీలో
  rationale: సంఘాలలో కనిపించే అద్భుత కార్యాలు ఈ సందర్భానికి అనుకూలంగా ఉన్నాయి; అయినప్పటికీ అంతర్గత కార్యం అనే సాధ్యమైన అర్థాన్ని నిరాకరించకుండా పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని కొనసాగుతున్న క్రియలను ‘అనుగ్రహిస్తూ… చేస్తున్నవాడు’గా ఉంచి ప్రశ్న యొక్క అలంకారిక బలాన్ని కాపాడాం. పాదసూచిక గుర్తులన్నీ ప్రధాన పాఠంలో చేర్చబడ్డాయి.
