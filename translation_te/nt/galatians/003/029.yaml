id: GAL.3.29
reference: Galatians 3:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: te
  text: మీరు మెస్సీయకు చెందినవారైతే[a], అప్పుడు మీరు అబ్రాహాము సంతానం[b], వాగ్దానం ప్రకారం వారసులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు క్రీస్తుకు చెందినవారైతే.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘విత్తనం’ లేదా ‘సంతతివారు.’ ఇక్కడి గ్రీకు పదం ఏకవచనంలో ఉంది; ఈ అధ్యాయంలో పౌలు ఇంతకుముందు ఉపయోగించిన పదాన్నే ఇది ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: మెస్సీయకు చెందినవారు
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉంది; షష్ఠీ విభక్తి తెలియజేసే చెందినతనాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: σπέρμα
  choice: సంతానం
  rationale: ఏకవచన సమూహార్థాన్ని ఉంచుతూ అబ్రాహాము సంతానాన్ని సూచించడానికి సహజమైన తెలుగు పదం. గ్రీకు పదానికి అక్షరార్థమైన ‘విత్తనం’ను పాదసూచికలో తెలియజేసి, ఈ అధ్యాయంలోని పూర్వపు వాదనతో ఉన్న పదసంబంధాన్ని కాపాడాం.
- source_word: κληρονόμοι
  choice: వారసులు
  rationale: కుటుంబ, నిబంధన సందర్భాల్లో κληρονόμοιకి సహజమైన మరియు ఖచ్చితమైన తెలుగు సమానం.
- source_word: κατ’ ἐπαγγελίαν
  choice: వాగ్దానం ప్రకారం
  rationale: వాగ్దానం ఆధారమా, ప్రమాణమా, లేక దానికి అనుగుణమైన స్థితియా అన్నదాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా గ్రీకు పదబంధాన్ని ప్రతిబింబిస్తుంది.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: మీరు ... అయితే, అప్పుడు
  rationale: δέను తెలుగులో తప్పనిసరిగా ప్రత్యేక సంధానపదంతో భారంగా చేయకుండా, షరతు–నిర్ధారణ తర్కాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: σπέρμα అనే ఏకవచన సమూహపదాన్ని అక్షరార్థంగా ‘విత్తనం’ అని అనువదించాలా, సహజమైన ‘సంతానం’ అని అనువదించాలా
  choice: సంతానం
  alternative: విత్తనం; సంతతివారు
  rationale: ‘సంతానం’ తెలుగులో ఏకవచన సమూహార్థాన్ని సహజంగా అందిస్తుంది. అదే సమయంలో పాదసూచిక గ్రీకు ‘విత్తనం’ అనే రూపాన్ని, గలతీయులు 3లోని పూర్వపు వాదనతో దాని అనుసంధానాన్ని వెల్లడిస్తుంది.
- issue: Χριστοῦను పేరులా ‘క్రీస్తు’ అని ఇవ్వాలా, బిరుదుగా ‘మెస్సీయ’ అని ఇవ్వాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός బిరుదుగా గ్రహించవచ్చు; ‘మెస్సీయ’ ఆ బిరుదు స్వభావాన్ని స్పష్టంగా ఉంచుతుంది. సుపరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయినా పౌలు వాదనలోని షరతు–నిర్ధారణ నిర్మాణం మరియు ‘వాగ్దానం ప్రకారం’ అనే ఉద్దేశపూర్వక అనిర్దిష్టత నిలుపబడ్డాయి.
