  terminology: ‘మెస్సీయ’ appropriately renders Χριστός as a title, with ‘క్రీస్తు’ supplied as a lexical alternative. ‘వారసులు’ and ‘వాగ్దానం ప్రకారం’ are accurate, idiomatic choices that do not over-specify Paul’s meaning.
