  source_fidelity: The Telugu accurately preserves the conditional-inferential structure of εἰ δὲ ... ἄρα, the belonging expressed by Χριστοῦ, Abrahamic σπέρμα, and κληρονόμοι qualified by κατ’ ἐπαγγελίαν. ‘సంతానం’ is a natural collective singular and the footnote responsibly preserves the Greek ‘seed’ wording and its chapter-level echo.
