id: GAL.3.17
reference: Galatians 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: te
  text: 'నేను చెప్పేది ఇదే: దేవుడు అంతకుముందే ధ్రువీకరించిన నిబంధనను నాలుగు వందల ముప్పై సంవత్సరాల తరువాత వచ్చిన ధర్మశాస్త్రం రద్దు చేయదు[a]; తద్వారా వాగ్దానాన్ని నిరర్థకం చేయదు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చెల్లకుండా చేయదు.’
    reason: ἀκυρόω అనే పదంలోని న్యాయపరమైన ‘చెల్లుబాటును తొలగించడం’ అనే ప్రత్యామ్నాయ భావవ్యక్తీకరణ.
  - marker: b
    text: లేదా ‘ప్రభావం లేకుండా చేయదు’ లేదా ‘పక్కన పెట్టదు.’
    reason: καταργέω అనే పదం ఏదైనా పనిచేయకుండా లేదా ప్రభావం లేకుండా చేయడాన్ని సూచించగలదు.
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: నేను చెప్పేది ఇదే
  rationale: పౌలు తన వివరణను పరిచయం చేస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని కాలార్థకమైన ‘ఇప్పుడు’ అనే పదాన్ని చేర్చదు.
- source_word: διαθήκην
  choice: నిబంధనను
  rationale: గలతీయులు 3లో అబ్రాహాముకు దేవుడు చేసిన వాగ్దానంతో ముడిపడిన ఒడంబడిక భావాన్ని ‘నిబంధన’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: προκεκυρωμένην
  choice: అంతకుముందే ధ్రువీకరించిన
  rationale: దేవుడు నిబంధనను ముందుగానే స్థిరపరిచాడనే కాలసంబంధమైన, న్యాయపరమైన బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: దేవుడు
  rationale: కర్తరి ప్రయోగంలో సహజమైన తెలుగుగా మార్చి, నిబంధనను ధ్రువీకరించిన కర్త దేవుడేనని నిలుపుతుంది.
- source_word: ὁ ... γεγονὼς νόμος
  choice: వచ్చిన ధర్మశాస్త్రం
  rationale: చరిత్రలో ధర్మశాస్త్రం తరువాత వచ్చిందనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: నాలుగు వందల ముప్పై సంవత్సరాల తరువాత
  rationale: కాలవ్యవధిని మూలానికి అనుగుణంగా స్పష్టంగా తెలుపుతుంది.
- source_word: οὐκ ἀκυροῖ
  choice: రద్దు చేయదు
  rationale: ముందుగా ధ్రువీకరించబడిన నిబంధనను తరువాతి ధర్మశాస్త్రం చెల్లకుండా చేయలేదనే న్యాయపరమైన భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా అందిస్తుంది.
- source_word: εἰς τὸ καταργῆσαι
  choice: అలా ... నిరర్థకం చేయదు
  rationale: నిబంధనను రద్దు చేయడం వల్ల వాగ్దానం ప్రభావం కోల్పోయే ఉద్దేశం లేదా ఫలితం ఏర్పడదనే సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὴν ἐπαγγελίαν
  choice: వాగ్దానాన్ని
  rationale: అబ్రాహాముకు దేవుడు చేసిన వాగ్దానాన్ని సూచించే పౌలు వాడుకకు సరైన, స్థిరమైన తెలుగు పదం.
theological_decisions:
- issue: పౌలు వాదనలో διαθήκη అర్థం
  choice: నిబంధన
  alternative: వీలునామా; ఒప్పందం
  rationale: సందర్భం అబ్రాహాముకు దేవుడు ముందుగా చేసిన వాగ్దానం మరియు దాని స్థిరత్వంపై కేంద్రీకృతమై ఉంది. అందువల్ల ‘నిబంధన’ రక్షణచరిత్ర సంబంధమైన భావాన్ని నిలుపుతుంది; ‘వీలునామా’ అని అనువదించడం ఈ వచనంలో అవసరానికి మించిన నిర్దిష్టతను చేర్చుతుంది.
- issue: εἰς τὸ καταργῆσαι లో ఉద్దేశం–ఫలితం మధ్య భావసంభావ్యత
  choice: అలా ... నిరర్థకం చేయదు
  alternative: వాగ్దానాన్ని నిరర్థకం చేయడానికి కాదు
  rationale: ఈ నిర్మాణం ఉద్దేశం లేదా ఫలిత ఛాయను కలిగి ఉండవచ్చు. ‘అలా’ అనే రూపం ఒకదానిని మాత్రమే ఖచ్చితంగా నిర్ణయించకుండా, నిబంధన రద్దు కావడం మరియు వాగ్దానం ప్రభావం కోల్పోవడం మధ్య సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ధర్మశాస్త్రం,’ ‘నిబంధన,’ ‘వాగ్దానం’ అనే సందర్భోచిత బైబిలు పదజాలాన్ని కొనసాగిస్తూ, వాక్య నిర్మాణాన్ని సహజమైన తెలుగుకు అనుగుణంగా మార్చాం. మూలంలోని δέకు ప్రత్యేకంగా ‘ఇప్పుడు’ అని చేర్చలేదు.
