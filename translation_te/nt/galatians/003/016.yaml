id: GAL.3.16
reference: Galatians 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: te
  text: వాగ్దానాలు అబ్రాహాముకూ అతని సంతానానికీ[a] చెప్పబడ్డాయి. అనేకమందిని సూచిస్తున్నట్లుగా, “సంతానాలకు”[b] అని లేఖనం చెప్పడం లేదు; కానీ ఒక్కరిని సూచిస్తున్నట్లుగా, “నీ సంతానానికి” అని చెబుతోంది. అది మెస్సీయ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనమంతటా ‘విత్తనం’ అని కూడా అనువదించవచ్చు. గ్రీకులో పౌలు వాదనకు కేంద్రంగా ఉన్న ఏకవచన సమూహార్థక పదం వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “విత్తనాలకు.” పౌలు పదంలోని బహువచన–ఏకవచన భేదాన్ని ఎత్తిచూపుతున్నాడు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘క్రీస్తు.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: చెప్పబడ్డాయి
  rationale: λέγω యొక్క కర్మణి రూపాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; మూలంలో లేని వక్తను చేర్చదు.
- source_word: ἐπαγγελίαι
  choice: వాగ్దానాలు
  rationale: దేవుని వాగ్దానాలను సూచించే ప్రామాణికమైన, స్పష్టమైన పౌలు వాడుక.
- source_word: σπέρμα / σπέρματι
  choice: సంతానం / సంతానానికి
  rationale: ఒక వ్యక్తినీ, సమిష్టిగా వంశస్థులనూ సూచించగల ఏకవచన సమూహార్థాన్ని నిలుపుతుంది; పౌలు వాదనకు అవసరమైన రూపభేదం కూడా తెలుగులో కనిపిస్తుంది.
- source_word: τοῖς σπέρμασιν
  choice: సంతానాలకు
  rationale: పౌలు స్పష్టంగా చూపిస్తున్న బహువచన రూపాన్ని తెలుగులోనూ ప్రత్యక్షంగా ఉంచుతుంది.
- source_word: ὡς ἐπὶ πολλῶν / ἀλλ’ ὡς ἐφ’ ἑνός
  choice: అనేకమందిని సూచిస్తున్నట్లుగా / ఒక్కరిని సూచిస్తున్నట్లుగా
  rationale: గ్రీకు విరుద్ధ జోడీని సహజమైన తెలుగులో సమాంతరంగా, స్పష్టంగా అందిస్తుంది.
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ అభిషిక్తుడనే బిరుదు భావం క్రియాశీలంగా ఉంది; అందువల్ల దాని అర్థాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: పౌలు ఏకవచన ‘సంతానం’ను మెస్సీయతో గుర్తించడం
  choice: ఆ సంతానం మెస్సీయ
  alternative: ఆ సంతానం క్రీస్తు
  rationale: మూలంలోని గుర్తింపు వాక్యాన్ని నేరుగా నిలుపుతూ, Χριστόςను ఇక్కడ బిరుదుగా అనువదిస్తుంది; పౌలు వాదనలోని సమిష్టి పదం–ఒక్క వ్యక్తి మధ్య ఉన్న ఉద్రిక్తతను వివరణతో తొలగించదు.
- issue: ἐρρέθησαν అనే కర్మణి క్రియలో వక్త
  choice: చెప్పబడ్డాయి
  alternative: దేవుడు చెప్పాడు
  rationale: సందర్భంలో దేవుడే వక్త అయినప్పటికీ, ఈ వాక్యంలో మూలం కర్మణి రూపాన్ని వాడుతుంది; అందువల్ల వక్తను ప్రధాన పాఠ్యంలో స్పష్టంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకునికి సులభమైన శైలి. ‘సంతానం/సంతానాలు’ అనే రూపజోడీ ద్వారా మూలంలోని ఏకవచన–బహువచన పదప్రయోగం కనిపించేలా ఉంచబడింది. గ్రీకు δέను ప్రత్యేక కాలసూచక పదంగా మార్చకుండా, తెలుగు వాక్యప్రవాహంలో సహజంగా విడిచిపెట్టాం.
