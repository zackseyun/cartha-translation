id: GAL.3.25
reference: Galatians 3:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: te
  text: కాని విశ్వాసం వచ్చిన తర్వాత[a], మనం ఇక సంరక్షకుని[b] ఆధీనంలో లేము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ విశ్వాసం వచ్చిన తర్వాత.”
    reason: alternative_reading
  - marker: b
    text: గ్రీకు పదం παιδαγωγός ప్రధానంగా తరగతి గదిలో బోధించే ఉపాధ్యాయుణ్ణి కాదు; బాలుణ్ణి పర్యవేక్షించే గృహ సంరక్షకుణ్ణి సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: వచ్చినందున
  rationale: జనిటివ్ అబ్సల్యూట్‌లోని ఏఒరిస్ట్ పార్టిసిపిల్‌ను సహజమైన తెలుగు కాల–కారణ సంబంధ ఉపవాక్యంగా అందిస్తుంది; సంభవించిన రాకకు ప్రస్తుత ప్రాసంగికతను నిలుపుతుంది.
- source_word: δὲ
  choice: కాని ఇప్పుడు
  rationale: మునుపటి సంరక్షణ కాలం నుంచి ప్రస్తుత స్థితికి ఉన్న స్వల్ప వ్యత్యాసాన్ని, సందర్భంలోని మార్పును సహజంగా సూచిస్తుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: πίστις యొక్క సాధారణ అర్థమైన ‘విశ్వాసం’ను ఉంచి, ఇక్కడ విశ్వాసం వచ్చిన కాలమార్పును సందర్భం ద్వారా వ్యక్తం చేస్తుంది; ‘విశ్వాస వ్యవస్థ’ అని విపులీకరించి భావాన్ని నిర్బంధించదు.
- source_word: οὐκέτι
  choice: ఇక ... లేము
  rationale: మునుపటి స్థితి ముగిసిందనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: ὑπὸ
  choice: ఆధీనంలో
  rationale: పర్యవేక్షణకు లోబడి ఉండడమనే పౌలు రూపకాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: παιδαγωγόν
  choice: సంరక్షకుని
  rationale: ప్రాచీన గృహంలో బాలుణ్ణి పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది; ప్రధానంగా తరగతి బోధకుడనే తప్పుదారిని నివారిస్తుంది.
- source_word: ἐσμεν
  choice: మనం ... లేము
  rationale: గ్రీకు వర్తమానకాల సంధాన క్రియను తెలుగు నిషేధ వాక్య నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘విశ్వాసం రావడం’ యొక్క సందర్భార్థం
  choice: ‘విశ్వాసం వచ్చినందున’ అని, రక్షణ చరిత్రలో పౌలు వర్ణిస్తున్న మార్పును సూచించేలా అనువదించబడింది.
  alternative: ‘ఆ విశ్వాసం వచ్చినందున’ అని అనువదించి, మెస్సీయతో ఆరంభమైన విశ్వాస యుగాన్ని మరింత స్పష్టంగా సూచించడం.
  rationale: πίστιςకు సందర్భపరంగా నిర్దిష్టమైన, రక్షణ-చారిత్రక బలం ఉండవచ్చు; అయితే తెలుగులో ‘ఆ విశ్వాసం’ అనడం అనవసరంగా ఒక నిర్దిష్ట విశ్వాస వ్యవస్థ భావాన్ని బలపరచవచ్చు. ప్రధాన పాఠంలో ‘విశ్వాసం’ అని ఉంచి, నిజమైన సందిగ్ధతను పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త వ్యత్యాసాన్ని నిలుపుతూ, παιδαγωγός యొక్క సాంస్కృతిక అర్థాన్ని ప్రధాన పాఠంలో ‘సంరక్షకుడు’తో మరియు పాదటిప్పణిలో వివరణతో స్పష్టం చేసింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
