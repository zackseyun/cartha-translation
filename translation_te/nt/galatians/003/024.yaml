  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: te
  text: కాబట్టి, ధర్మశాస్త్రం మెస్సీయ వరకు[b] మన సంరక్షకునిగా[a] మారింది, తద్వారా మనం విశ్వాసం ద్వారా నీతిమంతులుగా తీర్చబడటానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పర్యవేక్షకుడు”; సంప్రదాయంగా “బోధకుడు.” గ్రీకు παιδαγωγός ప్రధానంగా తరగతి గది ఉపాధ్యాయుణ్ణి కాక, బాలుణ్ణి పర్యవేక్షించే గృహ సంరక్షకుణ్ణి సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “మెస్సీయ వరకు” అని అనువదించిన మాటకు అక్షరార్థంగా “మెస్సీయ వైపుకు” అని భావం రావచ్చు; “మెస్సీయ దగ్గరకు నడిపించేదిగా” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
