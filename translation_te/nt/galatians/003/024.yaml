- source_word: ἐκ πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: పౌలు వాడుకలో సాధనం లేదా ఆధారాన్ని సూచించే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: δικαιωθῶμεν
  choice: నీతిమంతులుగా తీర్చబడాలి
  rationale: దైవకర్తృక న్యాయపరమైన భావాన్ని, గ్రీకు కర్మణి ప్రయోగాన్ని నిలుపుతూ ఉద్దేశ్య ఉపవాక్యానికి సహజమైన తెలుగు రూపాన్ని ఇస్తుంది.
theological_decisions:
- issue: ధర్మశాస్త్రపు పాత్రకు సంబంధించి εἰς Χριστόνను ఎలా అర్థం చేయాలి
  choice: మెస్సీయ వరకు
  alternative: మెస్సీయ వైపుకు; మెస్సీయ దగ్గరకు నడిపించేదిగా
  rationale: సమీప సందర్భం ధర్మశాస్త్రపు తాత్కాలిక పాత్రను నొక్కిచెబుతుంది. అయినా εἰςలోని దిశ లేదా గమ్య భావాన్ని ప్రధాన పాఠం ఒక్క అర్థానికే పరిమితం చేయకుండా పాదసూచికలో భద్రపరచింది.
