id: GAL.3.10
reference: Galatians 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: te
  text: 'ఎందుకంటే, ధర్మశాస్త్ర క్రియలను ప్రాతిపదికగా చేసుకున్నవారందరూ శాపానికి లోబడి ఉన్నారు[a]. ఎందుకంటే, ఇలా వ్రాయబడి ఉంది: “ధర్మశాస్త్ర గ్రంథంలో వ్రాయబడి ఉన్న వాటన్నిటినీ ఆచరించడంలో నిలకడగా ఉండని ప్రతి ఒక్కరూ శాపగ్రస్తులే.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధర్మశాస్త్ర క్రియలపై ఆధారపడే వారందరూ.”
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “ధర్మశాస్త్ర గ్రంథంలో వ్రాయబడి ఉన్న వాటన్నిటిలో, వాటిని చేయడానికి, నిలిచి ఉండని ప్రతి ఒక్కరూ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: ఎందుకంటే, … వారందరూ
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని, ὅσοι యొక్క సమూహవ్యాప్తిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐξ ἔργων νόμου
  choice: ధర్మశాస్త్ర క్రియల ప్రాతిపదికన ఉన్నవారు
  rationale: ἐξ యొక్క మూలం/ప్రాతిపదిక భావాన్ని నిలుపుతూ, ‘ఆధారపడేవారు’ అనే మరింత వ్యాఖ్యానాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో ఖరారు చేయకుండా ఉంచుతుంది.
- source_word: ὑπὸ κατάραν
  choice: శాపానికి లోబడి ఉన్నారు
  rationale: శాపం కింద ఉండటం అనే అధీనస్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది; గ్రీకులో నిర్దిష్ట ఉపపదం లేనందున ఒక నిర్దిష్టమైన ‘ఆ శాపం’ అని అతిగా నిర్దేశించదు.
- source_word: γέγραπται
  choice: ఇలా రాసి ఉంది
  rationale: లేఖన ఉల్లేఖనానికి వాడే స్థిరమైన సూత్రాన్ని, పరిపూర్ణ కర్మణి భావంలోని నిలకడను స్పష్టంగా అందిస్తుంది.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: ప్రతి ఒక్కరూ శాపగ్రస్తులే
  rationale: సార్వత్రిక పరిధిని లింగనిరపేక్షంగా, గంభీరమైన లేఖన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: ἐμμένει
  choice: నిలిచి ఉండని
  rationale: కొనసాగుతూ కట్టుబడి ఉండటం అనే కాలవ్యాప్త భావాన్ని సన్నిహితంగా నిలుపుతుంది.
- source_word: πᾶσιν τοῖς γεγραμμένοις
  choice: రాసి ఉన్న వాటన్నిటిలో
  rationale: πᾶσιν యొక్క సంపూర్ణ వ్యాప్తిని, ἐμμένειతో ఉన్న దత్తివిభక్తి సంబంధాన్ని కాపాడుతుంది.
- source_word: ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: ధర్మశాస్త్ర గ్రంథంలో
  rationale: చారిత్రకంగా ‘చుట్ట’ సాధ్యమైనా, ఆధునిక తెలుగు బైబిల్ వాడుకలో ‘గ్రంథం’ సహజంగా ఉండి మూల భావాన్ని అందిస్తుంది.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: వాటన్నిటినీ చేయడానికి
  rationale: ποιέω యొక్క కార్యరూప విధేయతను, గ్రీకు ఉద్దేశ/ఫలిత సంబంధాన్ని దగ్గరగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ἐξ ἔργων νόμου యొక్క వ్యాఖ్యానం
  choice: ‘ధర్మశాస్త్ర క్రియల ప్రాతిపదికన ఉన్నవారు’ అని సాపేక్షంగా మూలరూపానికి దగ్గరగా అనువదించడం
  alternative: ‘ధర్మశాస్త్ర క్రియలపై ఆధారపడేవారు’
  rationale: పౌలు వాడిన ఈ వేదాంతపరంగా భారితమైన పదబంధాన్ని కేవలం మానసిక ఆధారపడటంగా ముందుగానే నిర్ణయించకుండా, స్థితి/ప్రాతిపదికకు సంబంధించిన అస్పష్టతను నిలుపుతుంది.
- issue: శాపం యొక్క నిర్దిష్టత
  choice: ‘శాపానికి లోబడి’
  alternative: ‘ఆ శాపానికి లోబడి’
  rationale: κατάραν గ్రీకులో నిర్దిష్ట ఉపపదం లేకుండా ఉంది; అందువల్ల అనవసరంగా ఒక ముందే నిర్వచిత శాపాన్ని సూచించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన లేఖన శైలి. ‘ధర్మశాస్త్రం,’ ‘శాపగ్రస్తులు’ వంటి స్థిరమైన బైబిల్ పదజాలాన్ని ఉంచి, వాక్య నిర్మాణాన్ని తెలుగు సహజ క్రమానికి అనుగుణంగా మార్చాం. ప్రధాన పాఠ్యంలో [a], [b] సూచికలు రెండూ చేర్చబడ్డాయి.
