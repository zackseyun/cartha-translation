- from: ఎందుకంటే, మెస్సీయ యేసులో విశ్వాసం ద్వారా మీరందరూ దేవుని కుమారులు[a][b].
  to: ఎందుకంటే, మీరు అందరూ విశ్వాసం ద్వారా మెస్సీయ యేసులో దేవుని కుమారులై ఉన్నారు.[a][b]
  rationale: 'The revision restores the assertion expressed by ἐστε with “కుమారులై ఉన్నారు,” while retaining all key lexical choices: “మీరందరూ/మీరు అందరూ” for πάντες, “ఎందుకంటే” for γάρ, “విశ్వాసం ద్వారా” for διὰ τῆς πίστεως, “మెస్సీయ యేసులో” for ἐν Χριστῷ Ἰησοῦ, and “దేవుని కుమారులు” for υἱοὶ θεοῦ. Footnote markers and content remain structurally valid and semantically appropriate.'
