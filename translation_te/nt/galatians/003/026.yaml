  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: te
  text: ఎందుకంటే, మీరు అందరూ విశ్వాసం ద్వారా మెస్సీయ యేసులో దేవుని కుమారులై ఉన్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని పిల్లలు.” గ్రీకులో “కుమారులు” అని ఉంది; ఈ పదం పుత్రస్థానం, వారసత్వ హోదా అనే భావాలను కలిగి ఉంది, సందర్భంలో స్త్రీపురుషులందరినీ కలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ రూపం: “క్రీస్తు యేసు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: మీరందరూ
  rationale: ἐστε అనే ద్వితీయ పురుష బహువచన క్రియతో కలిసి, సంబోధించబడిన వారందరినీ సమగ్రంగా సూచిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా ఆధారం తెలుపుతున్న అనుసంధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: υἱοὶ θεοῦ
  choice: దేవుని కుమారులు
  rationale: υἱοί అనే పురుషలింగ బహువచన పదాన్ని నేరుగా ప్రతిబింబిస్తూ, పౌలు వాడుకలోని పుత్రస్థానం మరియు వారసత్వ భావాన్ని కాపాడుతుంది.
- source_word: διὰ τῆς πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది; πίστις‌కు ‘విశ్వాసం’ సహజమైన, స్థిరమైన సమానార్థకం.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: ἐν యొక్క ‘లో’ భావాన్ని నిలుపుతూ, Χριστός‌ను పేరుగా కాక అభిషిక్త రాజును సూచించే బిరుదుగా అనువదిస్తుంది.
theological_decisions:
- issue: లింగసూచక పుత్రత్వ భాష
  choice: దేవుని కుమారులు
  alternative: దేవుని పిల్లలు
  rationale: మూలంలో υἱοί ఉంది; ‘కుమారులు’ అనడం వ్యాకరణ రూపంతో పాటు పుత్రస్థానం, వారసత్వ హోదా అనే పౌలు భావాన్ని నిలుపుతుంది. సందర్భంలో ఇది విశ్వసించే స్త్రీపురుషులందరినీ కలుపుతుందని పాదటిప్పణి స్పష్టం చేస్తుంది.
- issue: Χριστός బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ దాని అభిషిక్తుడు అనే అర్థసారాన్ని తెలియజేస్తుంది; సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: ἐν Χριστῷ Ἰησοῦ అన్వయం
  choice: మెస్సీయ యేసులో విశ్వాసం ద్వారా
  alternative: మెస్సీయ యేసులో ఉండి, విశ్వాసం ద్వారా
  rationale: గ్రీకు పదక్రమాన్ని సమీపంగా ఉంచడం వల్ల ‘మెస్సీయ యేసులో విశ్వాసం’ మరియు ‘మెస్సీయ యేసులో ఉన్నవారిగా, విశ్వాసం ద్వారా’ అనే సంబంధాల మధ్యనున్న నిజమైన అన్వయ సాంద్రతను ముందుగానే పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పత్రికా శైలికి తగిన గౌరవభరిత స్వరంతో రూపొందించబడింది. ‘మీరందరూ’ సమూహ సమగ్రతను స్పష్టం చేస్తుంది; మూలంలోని సంక్షిప్త వాక్య నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడింది.
