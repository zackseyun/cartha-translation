    text: లేదా, “వాటిలో జీవిస్తాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేవీయకాండము 18:5 నుండి ఉల్లేఖనం.
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: ధర్మశాస్త్రం
  rationale: పౌలు ఉద్దేశిస్తున్న మోషే ధర్మశాస్త్రాన్ని సందర్భానుసారంగా స్పష్టంగా సూచిస్తూ, తెలుగు బైబిలు వాడుకలో సహజంగా ఉండే పదాన్ని ఎంచుకున్నాం.
- source_word: ἐκ πίστεως
  choice: విశ్వాసం నుండి కలిగినది
  rationale: ἐκ అనే మూలం లేదా ఆధారాన్ని సూచించే భావాన్ని నేరుగా నిలుపుతూ, ధర్మశాస్త్రం–విశ్వాసం మధ్య పౌలు ఉంచిన వ్యత్యాసాన్ని వివరణాత్మకంగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: ἀλλ’
  choice: దానికి బదులుగా
  rationale: ముందటి వాక్యానికి విరుద్ధంగా లేఖన వాక్యాన్ని ప్రవేశపెట్టే బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ ποιήσας αὐτά
  choice: వాటిని ఆచరించేవాడు
  rationale: ఆజ్ఞలను చేయడం అనే సాధారణ ఏకవచన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; గ్రీకులో స్పష్టంగా చెప్పని ‘ఆజ్ఞలు’ అనే నామవాచకాన్ని మూలపాఠ్యంలో చేర్చలేదు.
- source_word: ζήσεται
  choice: జీవిస్తాడు
  rationale: సాధారణ సూత్రాన్ని తెలిపే గ్రీకు భవిష్యత్తు క్రియను తెలుగులో సహజమైన విధంగా అందిస్తుంది.
- source_word: ἐν αὐτοῖς
  choice: వాటి ద్వారా
  rationale: ఈ ఉల్లేఖనంలో ఆచరణ జీవానికి సాధనం లేదా ఆధారం అనే భావాన్ని తెలియజేస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ధర్మశాస్త్రం మరియు విశ్వాసం మధ్య పౌలు చూపిన వ్యత్యాసం
  choice: “ధర్మశాస్త్రం విశ్వాసం నుండి కలిగినది కాదు” అని మూలంలోని వ్యత్యాసాన్ని అలాగే ఉంచడం
  alternative: “ధర్మశాస్త్రం విశ్వాసంపై ఆధారపడదు” లేదా “ధర్మశాస్త్రం విశ్వాస సూత్రం ప్రకారం పనిచేయదు”
  rationale: మూలంలోని ἐκ భావాన్ని అతిగా వివరించకుండా, ధర్మశాస్త్రం చేయడాన్ని గురించి పలుకుతుందనే తరువాతి ఉల్లేఖనంతో ఉన్న తాత్త్విక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ధర్మశాస్త్రం,’ ‘విశ్వాసం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచి, అనవసరమైన ప్రాచీన క్రియారూపాలను నివారించాం.
