translation:
  language: te
  text: కాని ధర్మశాస్త్రం విశ్వాసం నుండి వచ్చినది కాదు; “వాటిని ఆచరించేవాడు వాటి ద్వారా జీవిస్తాడు”[a][b].
  philosophy: optimal-equivalence
  footnotes:
