id: GAL.3.28
reference: Galatians 3:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: te
  text: యూదుడుగానీ గ్రీకువాడుగానీ లేడు; దాసుడుగానీ స్వతంత్రుడుగానీ లేడు; మగవాడూ ఆడదీ లేరు; ఎందుకంటే మీరందరూ మెస్సీయ యేసులో ఒక్కటిగా ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: …అని …అని లేదు
  rationale: ఉనికిని నిరాకరించే గ్రీకు పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, మూడు భాగాల్లోనూ పౌలు చేసిన పునరుక్తిని నిలుపుతుంది.
- source_word: Ἰουδαῖος / Ἕλλην
  choice: యూదుడు / గ్రీకువాడు
  rationale: ఇక్కడ జాతి-మత గుర్తింపుల జోడీ ఉద్దేశించబడింది. Ἕλλην అనే నిర్దిష్ట పదాన్ని విస్తరించి ‘యూదేతరుడు’గా మార్చకుండా ‘గ్రీకువాడు’గా ఉంచాం.
- source_word: δοῦλος / ἐλεύθερος
  choice: దాసుడు / స్వతంత్రుడు
  rationale: సేవకత్వాన్ని మాత్రమే కాక బానిస సామాజిక స్థితిని సూచించే δοῦλος‌కు ‘దాసుడు’ను, దానికి వ్యతిరేకమైన స్వేచ్ఛా స్థితికి ‘స్వతంత్రుడు’ను ఎంచుకున్నాం.
- source_word: ἄρσεν καὶ θῆλυ
  choice: మగ, ఆడ
  rationale: ఇవి వయోజన పురుషుడు, స్త్రీ అనే పదాలకన్నా లింగాన్ని సూచించే పదాలు. సంక్షిప్తమైన ‘మగ, ఆడ’ మూలంలోని భావాన్ని, ఆదికాండము 1:27 ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: πάντες ὑμεῖς
  choice: మీరందరూ
  rationale: రెండవ పురుష బహువచన సంబోధనను, ‘అందరూ’ అనే సమగ్ర ఉద్ఘాటనను స్పష్టంగా నిలుపుతుంది.
- source_word: εἷς ἐστε
  choice: ఒకటే
  rationale: సమూహ ఐక్యతను తెలిపే ఏకవచన విధేయాన్ని సంక్షిప్తంగా ఉంచుతుంది; ‘ఒక వ్యక్తి’ లేదా కేవలం ‘ఐక్యంగా’ అని వివరణాత్మకంగా విస్తరించదు.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉన్నందున ‘మెస్సీయ’గా అనువదించాం; ἐν అనే సంబంధాన్ని ‘లో’తో నిలిపాం.
theological_decisions:
- issue: ἄρσεν καὶ θῆλυలోని καὶను ఎలా ప్రతిబింబించాలి
  choice: మగ, ఆడ
  alternative: మగవాడు గానీ ఆడది గానీ లేడు
  rationale: మొదటి రెండు జోడీలలో οὐδὲ ఉండగా, మూడవ జోడీలో καὶ (‘మరియు’) ఉంది. సహజ తెలుగు కోసం విరామచిహ్నాన్ని వాడినా, దాన్ని ‘గానీ…గానీ’గా మార్చకుండా ఆదికాండము 1:27కు ఉండగల ప్రతిధ్వనిని కాపాడాం.
- issue: εἷς ἐστεను వివరణాత్మకంగా విస్తరించాలా
  choice: మీరందరూ … ఒకటే
  alternative: మీరందరూ ఒకే వ్యక్తి / మీరందరూ ఐక్యంగా ఉన్నారు
  rationale: వచనం మెస్సీయలోని ఐక్యతను ప్రకటిస్తుంది; సృష్టిలోని అన్ని భేదాలు రద్దయ్యాయని గానీ, కేవలం పరస్పర సమ్మతి ఉందని గానీ అదనంగా చెప్పదు. సంక్షిప్త రూపం ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: Χριστόςను పేరులా లేదా బిరుదుగా అనువదించాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావాన్ని పాఠకునికి ప్రత్యక్షంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన శైలిని వాడాం. మూలంలోని మూడు సమాంతర నిరాకరణలను అర్ధవిరామాలతో స్పష్టంగా చూపించాం. ‘ఒకటే’ సాధారణ పాఠకునికి సహజంగా ఉండి, మూలంలోని ఏకత్వ వాదనను అతిగా వ్యాఖ్యానించదు.
