id: GAL.3.1
reference: Galatians 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: te
  text: ఓ అవివేకులైన గలతీయులారా, మీ కళ్ల ఎదుట యేసు మెస్సీయుడు సిలువ వేయబడినవాడిగా స్పష్టంగా చిత్రించబడగా, మిమ్మల్ని ఎవరు మంత్ర ముగ్ధులను చేశారు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνόητοι
  choice: అవివేకులైన
  rationale: అర్థం చేసుకోకుండా ప్రవర్తించినందుకు పౌలు చేస్తున్న గద్దింపును తెలియజేస్తుంది; మూలపదంలో లేని అధిక నైతిక దూషణను చేర్చదు.
- source_word: Γαλάται
  choice: గలతీయులారా
  rationale: ఆ ప్రాంత ప్రజలను సంబోధించే పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: ἐβάσκανεν
  choice: మంత్రించారు
  rationale: హానికరమైన మాయా ప్రభావానికి లోనుచేయడం అనే సజీవ రూపకాన్ని నిలుపుతుంది; కేవలం ‘మోసగించారు’ అనడం దాని వాక్చాతుర్య బలాన్ని తగ్గిస్తుంది.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: మీ కళ్ల ఎదుటే
  rationale: ప్రత్యక్షంగా, స్పష్టంగా వారి ముందు ఉంచబడిన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: Ἰησοῦς Χριστός
  choice: యేసు మెస్సీయ
  rationale: Ἰησοῦς‌ను పేరుగా, Χριστός‌ను అభిషిక్తుడనే భావమున్న బిరుదుగా ప్రతిబింబిస్తుంది.
- source_word: προεγράφη
  choice: స్పష్టంగా చిత్రించబడ్డాడు
  rationale: బహిరంగంగా లేదా సజీవంగా కళ్లముందు ఉంచబడడం అనే సందర్భోచిత భావాన్ని అందిస్తుంది; ‘ముందుగానే వ్రాయబడ్డాడు’ అనే మరో సాధ్యమైన పదార్థాన్ని ఈ సందర్భంలో ఎంచుకోదు.
- source_word: ἐσταυρωμένος
  choice: సిలువ వేయబడినవాడిగా
  rationale: పరిపూర్ణ కర్మణి కృదంతం సూచించే, సిలువ వేయబడిన స్థితిలో చూపబడిన భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: Ἰησοῦς Χριστόςలో Χριστόςను ఎలా అందించాలి
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: Χριστός యొక్క బిరుదాత్మక అర్థాన్ని వినిపించేందుకు ‘మెస్సీయ’ను ఉపయోగించాం; సంప్రదాయ లిప్యంతరీకరణ ‘క్రీస్తు’ కూడా సాధ్యమే.
- issue: ప్రకటన ద్వారా క్రీస్తు సిలువ మరణం వారి కళ్ల ఎదుట ఉంచబడిన విధానం
  choice: స్పష్టంగా చిత్రించబడ్డాడు
  alternative: బహిరంగంగా ప్రకటించబడ్డాడు / ప్రకటనపత్రంలా ప్రదర్శించబడ్డాడు
  rationale: ఈ మాట నిజమైన దృశ్యాన్ని చూశారని తప్పనిసరిగా చెప్పకుండా, పౌలు ప్రకటించిన సందేశం వారి ముందు సజీవంగా ఉంచబడిందనే రూపక బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే సంబోధన. గ్రీకు వాక్యంలోని ఒకే ప్రశ్నగా ఉన్న నిర్మాణం తెలుగులో సహజత్వం, వాక్చాతుర్య బలం కోసం ప్రశ్నతో పాటు ‘కదా’ ఉన్న నిర్ధారణాత్మక వాక్యంగా విభజించబడింది.
