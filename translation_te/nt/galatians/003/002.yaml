id: GAL.3.2
reference: Galatians 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: te
  text: 'నేను మీ నుండి ఈ ఒక్క విషయం మాత్రమే తెలుసుకోవాలనుకుంటున్నాను: మీరు ధర్మశాస్త్ర క్రియల ద్వారా ఆత్మను పొందారా, లేక విశ్వాసంతో వినడం ద్వారా పొందారా?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వాసపు వినికిడి ద్వారా”; ఈ పదబంధానికి “సందేశాన్ని విశ్వాసంతో వినడం ద్వారా” అనే అర్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ “విశ్వాసం” అనే అర్థమే ఎక్కువ సంభావ్యం; అయితే గ్రీకు నిర్మాణం సంక్షిప్తంగా ఉండడం వల్ల “విశ్వసనీయత” అనే భావాన్ని కూడా కొందరు పరిశీలిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: ఈ ఒక్క విషయం మాత్రమే
  rationale: గ్రీకు వాక్యంలోని ముందుంచిన నొక్కిచెప్పే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: θέλω μαθεῖν
  choice: తెలుసుకోవాలనుకుంటున్నాను
  rationale: θέλω + μαθεῖν యొక్క వ్యక్తిగత, ప్రశ్నార్థక స్వరాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ఇక్కడ ‘నేర్చుకోవడం’ కంటే ‘తెలుసుకోవడం’ సందర్భోచితం.
- source_word: ἀφ’ ὑμῶν
  choice: మీ నుండి
  rationale: విభక్తి సంబంధాన్ని నేరుగా చూపుతుంది; ‘మీ’ ద్వారా గ్రీకులోని బహువచనం సందర్భానుసారంగా వ్యక్తమవుతుంది.
- source_word: ἐξ ἔργων νόμου
  choice: ధర్మశాస్త్ర క్రియల వల్ల
  rationale: పౌలు వాడే సంక్షిప్త పదబంధాన్ని కాపాడుతూ, ἐξ సూచించే ఆధారం లేదా సాధన భావాన్ని ‘వల్ల’ సహజంగా తెలియజేస్తుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మను
  rationale: సందర్భంలో దేవుని ఆత్మ ఉద్దేశించబడింది; మూలంలో లేని ‘పరిశుద్ధ’ అనే విశేషణాన్ని చేర్చలేదు.
- source_word: ἐλάβετε
  choice: పొందారా
  rationale: అయోరిస్టును గతంలో జరిగిన స్వీకరణను ప్రశ్నించే సరళ రూపంగా అందిస్తుంది.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: విశ్వాసంతో వినడం వల్ల
  rationale: ధర్మశాస్త్ర క్రియలకు వ్యతిరేకంగా విశ్వాసంతో వినడాన్ని సాధనం లేదా విధానంగా చూపుతుంది; అయితే గ్రీకు షష్ఠీ నిర్మాణంలోని సంక్షిప్తతను పాదసూచికలో భద్రపరుస్తుంది.
- source_word: πίστεως
  choice: విశ్వాసంతో
  rationale: πίστιςకు సాధారణమైన ‘విశ్వాసం’ అర్థాన్ని ఉంచుతుంది; ‘విశ్వాస్యత’ అనే తక్కువ సంభావ్య భావాన్ని పాదసూచికలో సూచిస్తుంది.
theological_decisions:
- issue: ‘ఆత్మ’ యొక్క సూచన
  choice: విశ్వాసులు పొందిన దేవుని ఆత్మ
  alternative: సాధారణ ఆధ్యాత్మిక అనుభవం లేదా ఆధ్యాత్మిక శక్తి
  rationale: గలతీయులు 3 యొక్క సమీప సందర్భం దేవుని ఆత్మను వారు పొందిన విషయాన్ని చర్చిస్తుంది; అందువల్ల వ్యక్తిగత దైవిక సూచనే అత్యంత సంభావ్యం.
- issue: ἀκοῆς πίστεως అనే సంక్షిప్త నిర్మాణం
  choice: విశ్వాసంతో వినడం
  alternative: విశ్వాసం గురించిన సందేశాన్ని వినడం; విశ్వాసం పుట్టించే వినికిడి
  rationale: ఈ షష్ఠీ సంబంధం ఒక్క విధంగా మాత్రమే నిర్ధారించలేనిది. ప్రధాన పాఠం సాధనం/విధాన భావాన్ని సహజంగా ఇస్తూ, ఇతర సాధ్య భావాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా ప్రశ్నించే శైలి. పౌలు వాక్యంలోని నొక్కిచెప్పే స్వరం మరియు రెండు మార్గాల మధ్య వ్యతిరేకత నిలుపబడ్డాయి. ‘ధర్మశాస్త్ర క్రియలు’ అనే పౌలీయ పదబంధం వివరణాత్మక విస్తరణ లేకుండా భద్రపరచబడింది.
