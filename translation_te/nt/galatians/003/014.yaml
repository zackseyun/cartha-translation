id: GAL.3.14
reference: Galatians 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: te
  text: అబ్రాహాము ఆశీర్వాదం మెస్సీయ యేసులో అన్యజనులకు చేరునట్లుగా, మనం విశ్వాసం ద్వారా ఆత్మ వాగ్దానాన్ని పొందునట్లుగా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα … ἵνα
  choice: … అందాలనీ, … పొందాలనీ
  rationale: రెండు ἵνα ఉపవాక్యాల ప్రయోజన భావాన్నీ, వాటి సమాంతర నిర్మాణాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εἰς τὰ ἔθνη
  choice: అన్యజనులకు
  rationale: ఈ సందర్భంలోని యూదులు–అన్యజనులు భేదాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది; ‘జనాలకు’ అనే విస్తృత పదార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: అబ్రాహాము ఆశీర్వాదం
  rationale: అబ్రాహాముతో ముడిపడిన ఆశీర్వాదాన్ని సూచించే గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: γένηται
  choice: అందాలి
  rationale: εἰς τὰ ἔθνηతో కలిసి ఆశీర్వాదం అన్యజనులకు చేరడం అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ అయిన యేసులో
  rationale: Χριστόςలోని బిరుదు భావాన్ని అనువదిస్తూ, తెలుగులో సహజమైన రూపంలో పౌలు ఉపయోగించే ‘లో’ ఐక్యతా నిర్మాణాన్ని నిలుపుతుంది.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: ఆత్మ వాగ్దానాన్ని
  rationale: గ్రీకు షష్ఠీ విభక్తిని అతిగా వివరణ చేయకుండా సంక్షిప్తంగా ఉంచుతుంది; ‘వాగ్దానం చేయబడిన ఆత్మ’ అనే సందర్భోచిత అర్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: λάβωμεν
  choice: మనం … పొందాలి
  rationale: ἵνα ఆధీనంలోని సమూహ ప్రథమ పురుష ప్రయోజన భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: διὰ τῆς πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: πίστιςకు సాధారణమైన ‘విశ్వాసం’ అనే పదాన్ని, సాధనార్థక διά భావంతో కలిపి నిలుపుతుంది.
theological_decisions:
- issue: Χριστῷను బిరుదుగా అనువదించాలా, సంప్రదాయ రూపంలో ఉంచాలా
  choice: మెస్సీయ అయిన యేసులో
  alternative: క్రీస్తు యేసులో
  rationale: అబ్రాహాము వాగ్దానం గురించిన ఈ వాదనలో Χριστόςకు బిరుదు భావం సజీవంగా ఉంది; అందువల్ల దాని అర్థాన్ని ప్రధాన పాఠ్యంలో వ్యక్తపరచి, సంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచాం.
- issue: τοῦ πνεύματος అనే షష్ఠీ విభక్తి సంబంధం
  choice: ఆత్మ వాగ్దానం
  alternative: వాగ్దానం చేయబడిన ఆత్మ
  rationale: ప్రధాన పాఠ్యం గ్రీకు నిర్మాణంలోని సంక్షిప్తతను, సాధ్యమైన భావ విస్తృతిని నిలుపుతుంది; సందర్భంలో బలమైన ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగాను, పౌలు వాదనకు తగిన గౌరవప్రదమైన శైలిలోనూ ఉంది. ముందరి వాక్యంపై ఆధారపడే రెండు ప్రయోజన ఉపవాక్యాలకు స్వతంత్ర వచనంగా స్వల్ప సంపూర్ణత ఇవ్వడానికి ‘ఇలా జరిగింది’ చేర్చబడింది.
