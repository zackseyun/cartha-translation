id: GAL.3.21
reference: Galatians 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: te
  text: అయితే ధర్మశాస్త్రం దేవుని వాగ్దానాలకు విరోధమా? ఎంతమాత్రమూ కాదు! జీవాన్ని ఇవ్వగలిగే ధర్మశాస్త్రం ఇవ్వబడి ఉంటే, నీతి నిజంగానే ధర్మశాస్త్రం నుంచే వచ్చి ఉండేది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయం.”
    reason: δικαιοσύνηకి సందర్భానుసారంగా సాధ్యమైన పదార్థ ప్రత్యామ్నాయాన్ని నిలుపుట.
lexical_decisions:
- source_word: νόμος
  choice: ధర్మశాస్త్రం
  rationale: ఇక్కడ νόμος సాధారణంగా ‘చట్టం’ అనే భావాన్ని కలిగి ఉన్నప్పటికీ, సందర్భంలో మోషే ధర్మశాస్త్రం స్పష్టంగా దృష్టిలో ఉంది. తెలుగు బైబిలు పరిభాషలో సహజమైన ‘ధర్మశాస్త్రం’ ఆ రెండు పరిమాణాలనూ తగినంతగా నిలుపుతుంది.
- source_word: κατὰ
  choice: విరోధమా
  rationale: Genitiveతో వచ్చిన κατά వ్యతిరేకతను సూచిస్తుంది. ప్రశ్నలో ‘విరోధమా?’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἐπαγγελιῶν
  choice: వాగ్దానాలకు
  rationale: గ్రీకు మూలంలోని బహువచనాన్ని నిలుపుతూ, ముందు సందర్భంలో చెప్పిన దేవుని వాగ్దానాలను సూచిస్తుంది.
- source_word: μὴ γένοιτο
  choice: ఎంతమాత్రమూ కాదు!
  rationale: పౌలు ఉపయోగించే బలమైన నిరాకరణను ఆధునిక తెలుగులో సహజంగా, దృఢంగా వ్యక్తం చేస్తుంది.
- source_word: ἐδόθη
  choice: ఇవ్వబడి ఉంటే
  rationale: అసంభవ లేదా వాస్తవానికి విరుద్ధమైన షరతును తెలిపే గ్రీకు నిర్మాణాన్ని తెలుగులో సహజమైన షరతు రూపంతో వ్యక్తం చేస్తుంది.
- source_word: δυνάμενος
  choice: ఇవ్వగల
  rationale: ధర్మశాస్త్రానికి జీవం ప్రసాదించే సామర్థ్యం ఉందనే ఊహాత్మక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ζῳοποιῆσαι
  choice: జీవాన్ని ఇవ్వగల
  rationale: ‘జీవింపజేయు’ కూడా సాధ్యమే; అయితే ‘జీవాన్ని ఇవ్వు’ సాధారణ పాఠకులకు సహజంగా ఉండి, జీవప్రదాన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὄντως
  choice: నిజంగానే
  rationale: షరతు ఫలితాన్ని బలపరిచే గ్రీకు అవ్యయానికి సహజమైన తెలుగు సమానం.
- source_word: ἐκ νόμου
  choice: ధర్మశాస్త్రం నుంచే
  rationale: ἐκ సూచించే మూలం లేదా ఆధార భావాన్ని ‘నుంచి’ నిలుపుతుంది; ‘-ఏ’ నిశ్చయార్థక బలం ὄντωςతో కలిసి వాక్యంలోని ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: δικαιοσύνη
  choice: నీతి
  rationale: పౌలు వాదనలో దేవుని ఎదుట సరైన స్థితి మరియు న్యాయసంబంధ భావాల మధ్య ఉన్న విస్తృతతను పూర్తిగా సంకుచితం చేయకుండా, తెలుగు బైబిలు వాడుకలో స్థిరమైన పదాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: పౌలు వాదనలో δικαιοσύνη అర్థం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ సందర్భంలో ధర్మశాస్త్రం ద్వారా కలిగేదిగా ఊహాత్మకంగా చెప్పబడినది దేవుని ఎదుట నీతి అనే భావానికి ప్రధానంగా సరిపోతుంది. అయినప్పటికీ δικαιοσύνηలోని న్యాయ పరిమాణం కోల్పోకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: νόμος సాధారణ చట్టమా లేక మోషే ధర్మశాస్త్రమా
  choice: ధర్మశాస్త్రం
  alternative: చట్టం
  rationale: ‘ఒక జీవప్రదమైన ధర్మశాస్త్రం ఇవ్వబడి ఉంటే’ అనే ఊహాత్మక నిర్మాణంలో νόμος ఒక వర్గాన్ని సూచించగలదు; అయినా గలతీయులకు 3వ అధ్యాయ సందర్భం మోషే ధర్మశాస్త్రాన్ని ప్రధానంగా ఉద్దేశిస్తుంది. ‘ధర్మశాస్త్రం’ ఈ సందర్భసంబంధాన్ని నిలుపుతూ వాదనను అనవసరంగా ఒక సాధారణ పౌరచట్టానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. పౌలు అడిగే వాక్చాతుర్య ప్రశ్న, దానికి ఇచ్చే బలమైన నిరాకరణ, తరువాతి ఊహాత్మక షరతు—ఈ మూడు దశల ప్రవాహాన్ని నిలుపుకున్నాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
