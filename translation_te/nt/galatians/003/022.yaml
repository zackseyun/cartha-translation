id: GAL.3.22
reference: Galatians 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: te
  text: అయితే, యేసు మెస్సీయపై విశ్వాసం ద్వారా[b] వాగ్దానం విశ్వసించేవారికి ఇవ్వబడేలా లేఖనం అన్నిటినీ పాపం కింద నిర్బంధించింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అన్నిటినీ పాపం కింద నిర్బంధించింది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యేసు మెస్సీయ విశ్వసనీయత ద్వారా.”
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: బంధించింది
  rationale: చుట్టూ మూసి నిర్బంధంలో ఉంచడం అనే గ్రీకు పదబలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ γραφή
  choice: లేఖనం
  rationale: ఏకవచనంలో వ్యక్తీకరించబడిన పరిశుద్ధ లేఖన సాక్ష్యాన్ని గ్రీకు రూపానికి దగ్గరగా నిలుపుతుంది; దీనిని ‘ధర్మశాస్త్రం’గా పరిమితం చేయదు.
- source_word: τὰ πάντα
  choice: సమస్తాన్నీ
  rationale: నపుంసక బహువచనంలోని విస్తృత, సమగ్ర పరిధిని కేవలం మనుషులకు మాత్రమే పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: ὑπὸ ἁμαρτίαν
  choice: పాపం కింద
  rationale: పాపానికి లోబడిన స్థితి అనే పౌలు రూపకాన్ని వివరణాత్మక పదాలు చేర్చకుండా పారదర్శకంగా ఉంచుతుంది.
- source_word: ἡ ἐπαγγελία
  choice: వాగ్దానం
  rationale: మూల నామవాచకానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయపై విశ్వాసం ద్వారా
  rationale: వివాదాస్పదమైన pistis Christou నిర్మాణాన్ని ప్రధాన పాఠ్యంలో సాధారణ objective-genitive అర్థంలో అందిస్తుంది; subjective-genitive అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός యేసుతో కలసి బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
- source_word: δοθῇ
  choice: ఇవ్వబడేలా
  rationale: ἵνα తరువాతి aorist passive subjunctive తెలిపే ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῖς πιστεύουσιν
  choice: విశ్వసించేవారికి
  rationale: గ్రీకు వర్తమాన కృదంతంలోని క్రియాశీల ప్రతిస్పందనను కేవలం ఒక వర్గనామంగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ అనే genitive నిర్మాణం
  choice: యేసు మెస్సీయపై విశ్వాసం
  alternative: యేసు మెస్సీయ యొక్క విశ్వసనీయత ద్వారా
  rationale: ఈ నిర్మాణం objective genitive గానా subjective genitive గానా అన్నది నిజమైన వ్యాఖ్యాన వివాదం. ప్రధాన పాఠ్యం సాధారణ objective-genitive అర్థాన్ని తీసుకుంటుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి theological tension‌ను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పాపం కింద’ అనే పౌలు రూపకం, ‘సమస్తాన్నీ’ అనే విస్తృత పరిధి, pistis Christou నిర్మాణంలోని అస్పష్టత జాగ్రత్తగా నిలుపబడ్డాయి. చివరి వాక్యంలో ‘అలా చేసింది’ అనేది గ్రీకులోని ἵνα ఉద్దేశ సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా కలుపుతుంది.
