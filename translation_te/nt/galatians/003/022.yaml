    reason: alternative_reading
  revision_rationale: The revision restores the Greek purpose construction in one sentence, chooses a Telugu verb that more closely conveys the confinement force of συνέκλεισεν, and uses broad, natural wording for τὰ πάντα. It preserves both the main objective-genitive reading and the disputed subjective-genitive alternative without imposing a theological conclusion.
