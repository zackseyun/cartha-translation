revisions:
- from: కాని లేఖనం సమస్తాన్నీ పాపం కింద బంధించింది[a]. యేసు మెస్సీయపై విశ్వాసం ద్వారా[b] వాగ్దానం విశ్వసించేవారికి ఇవ్వబడేలా అలా చేసింది.
  to: అయితే, యేసు మెస్సీయపై విశ్వాసం ద్వారా[b] వాగ్దానం విశ్వసించేవారికి ఇవ్వబడేలా లేఖనం అన్నిటినీ పాపం కింద నిర్బంధించింది[a].
  rationale: The revision restores the Greek purpose construction in one sentence, chooses a Telugu verb that more closely conveys the confinement force of συνέκλεισεν, and uses broad, natural wording for τὰ πάντα. It preserves both the main objective-genitive reading and the disputed subjective-genitive alternative without imposing a theological conclusion.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:00:49Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Scripture as the acting subject, the comprehensive neuter plural τὰ πάντα, subjection under sin, and the purpose of the promise being given to those who believe. However, separating “అలా చేసింది” into a second sentence weakens and somewhat redundantly paraphrases the Greek ἵνα purpose clause. Bringing the purpose clause into the same sentence more directly reflects the syntax.
  naturalness: “నిర్బంధించింది” naturally conveys συνέκλεισεν ('imprisoned/confined') more precisely than the comparatively broad “బంధించింది.” A single Telugu sentence with the purpose clause preceding the main clause is clear and idiomatic. “అన్నిటినీ” is a more natural modern rendering than “సమస్తాన్నీ” while retaining the deliberately broad scope.
  terminology: “లేఖనం,” “పాపం కింద,” “వాగ్దానం,” and “యేసు మెస్సీయ” are suitable. The contested πίστις Ἰησοῦ Χριστοῦ construction remains objective-genitive in the main text, with the subjective-genitive alternative retained in a footnote. The alternative footnote is phrased as “యేసు మెస్సీయ విశ్వసనీయత ద్వారా,” which is natural Telugu and does not over-resolve the debated construction.
  issues:
  - severity: medium
    issue: The purpose clause is split off as “అలా చేసింది.”
    rationale: The Greek has a direct ἵνα clause dependent on συνέκλεισεν. The added anaphoric paraphrase is not wrong, but it is less exact and less economical than retaining the purpose relation within one sentence.
  - severity: low
    issue: “బంధించింది” understates the enclosing/confining force of συνέκλεισεν.
    rationale: “నిర్బంధించింది” better communicates the imprisonment metaphor while remaining natural modern Telugu.
  - severity: low
    issue: Footnote a uses “సమస్త వస్తువులనూ.”
    rationale: This can sound more concretely object-focused than the broad τὰ πάντα. “అన్నిటినీ” preserves the inclusive, unspecified scope.
  revised_text: అయితే, యేసు మెస్సీయపై విశ్వాసం ద్వారా[b] వాగ్దానం విశ్వసించేవారికి ఇవ్వబడేలా లేఖనం అన్నిటినీ పాపం కింద నిర్బంధించింది[a].
  revised_footnotes:
