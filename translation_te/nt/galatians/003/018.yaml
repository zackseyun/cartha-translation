id: GAL.3.18
reference: Galatians 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: te
  text: ఎందుకంటే, వారసత్వం ధర్మశాస్త్రం నుండి లభిస్తే, అది ఇక వాగ్దానం నుండి లభించదు. అయితే దేవుడు అబ్రాహాముకు వాగ్దానం ద్వారా దానిని అనుగ్రహించి ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు అబ్రాహాముకు వాగ్దానం ద్వారా దానిని కృపతో ఇచ్చాడు.”
    reason: χαρίζομαι అనే క్రియలో ఉన్న కృపాపూర్వకంగా/ఉచితంగా ఇవ్వడం అనే భావాన్ని స్పష్టంగా చూపే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: κληρονομία
  choice: వారసత్వం
  rationale: వారసునిగా పొందేదాన్ని సూచించే పౌలు వాడుకకు ఇది సహజమైన, ప్రామాణిక తెలుగు పదం; ధర్మశాస్త్రం–వాగ్దానం మధ్యనున్న వాదనకు సరిపోతుంది.
- source_word: ἐκ νόμου
  choice: ధర్మశాస్త్రం మూలంగా
  rationale: ἐκ సూచించే మూలం లేదా ఆధార భావాన్ని నిలుపుతూ, తరువాతి ἐξ ἐπαγγελίαςతో ఉన్న సమాంతర వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: οὐκέτι ἐξ ἐπαγγελίας
  choice: ఇక వాగ్దానం మూలంగా వచ్చేది కాదు
  rationale: οὐκέτιలోని ‘ఇక కాదు’ అనే మినహాయింపు భావాన్ని, ἐκతో ఉన్న మూలసంబంధ వ్యత్యాసాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: δι’ ἐπαγγελίας
  choice: వాగ్దానం ద్వారా
  rationale: διά యొక్క సాధనార్థక భావాన్ని నేరుగా తెలియజేసి, ధర్మశాస్త్రం మూలంగా అనే ముందరి పదబంధంతో వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: κεχάρισται
  choice: అనుగ్రహించాడు
  rationale: χαρίζομαιలోని ఉచితంగా, కృపతో ఇవ్వడం అనే భావాన్ని ఒక సహజమైన తెలుగు క్రియలో వ్యక్తం చేస్తుంది; గ్రీకు పరిపూర్ణ కాలం సూచించే నిలిచివున్న ఫలితాన్ని తెలుగు సందర్భం సహజంగా తెలియజేస్తుంది.
- source_word: τῷ Ἀβραὰμ
  choice: అబ్రాహాముకు
  rationale: దత్తివిభక్తిలోని స్వీకర్తను తెలుగులో సహజంగా, స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: χαρίζομαιలోని కృపాభావాన్ని ఎంత స్పష్టంగా వ్యక్తం చేయాలి
  choice: అనుగ్రహించాడు
  alternative: కృపతో ఇచ్చాడు
  rationale: ‘అనుగ్రహించాడు’ అనే పదం కేవలం ‘ఇచ్చాడు’ అని భావాన్ని పలుచన చేయకుండా, దేవుడు వాగ్దానం ద్వారా ఉచితంగా ఇచ్చాడనే కృపాభావాన్ని కాపాడుతుంది; అదే సమయంలో అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: వారసత్వానికి ధర్మశాస్త్రమా, వాగ్దానమా మూలం అనే వ్యత్యాసం
  choice: రెండు చోట్లా ‘మూలంగా’ అనే సమాంతర నిర్మాణం
  alternative: ‘ధర్మశాస్త్రాన్ని పాటించడం వల్ల ... వాగ్దానం వల్ల’
  rationale: మూలపాఠంలోని ἐκ ... ἐξ ... నిర్మాణాన్ని నిలుపుతుంది; ‘పాటించడం’ వంటి మూలంలో లేని వివరణను చేర్చకుండా పౌలు ఉంచిన సంక్షిప్త theological tensionను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘ధర్మశాస్త్రం’ మరియు ‘వారసత్వం’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సహజంగా చేశాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత క్రియ తరువాత ఉంచబడింది.
