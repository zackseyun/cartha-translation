id: GAL.6.10
reference: Galatians 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: te
  text: కాబట్టి, మనకు అవకాశం ఉన్నంతవరకు[a] అందరికీ మేలు చేద్దాం; ముఖ్యంగా విశ్వాస కుటుంబానికి చెందినవారికి[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మనకు సమయం ఉన్నంతవరకు.’ గ్రీకు καιρός సాధారణ కాలం కంటే, తగిన లేదా అనుకూలమైన సమయాన్ని ప్రధానంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘విశ్వాసుల కుటుంబానికి చెందినవారికి.’ గ్రీకు పదం విశ్వసించే సమాజానికి చెందినవారిని కుటుంబ భాషలో వర్ణిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘విశ్వాసం’ అనేది క్రైస్తవులు ఉమ్మడిగా అంగీకరించే ‘విశ్వాస సిద్ధాంతం’ అనే భావంలో కూడా అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: కాబట్టి
  rationale: ఈ రెండు నిర్ధారణార్థక అవ్యయాలు ముందున్న వాదన నుంచి వచ్చే ముగింపును సూచిస్తున్నాయి. ‘కాబట్టి’ ఆధునిక తెలుగులో సహజంగా ఆ తార్కిక సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ὡς καιρὸν ἔχομεν
  choice: మనకు అవకాశం ఉన్నప్పుడు
  rationale: καιρός సాధారణ కాలాన్ని మాత్రమే కాక, ఏదైనా చేయడానికి తగిన లేదా అనుకూలమైన సమయాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ అవకాశ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐργαζώμεθα
  choice: చేద్దాం
  rationale: ఇది సమాజాన్నంతటినీ కలుపుకొని ఇచ్చిన ప్రోత్సాహక ఆజ్ఞ. τὸ ἀγαθόν‌తో కలిపి ‘మేలు చేద్దాం’ అనడం తెలుగులో సహజంగా ఉండి, కొనసాగుతూ ఉండవలసిన కార్యాన్ని సూచిస్తుంది.
- source_word: τὸ ἀγαθὸν
  choice: మేలు
  rationale: నామవాచకంగా వాడిన ఈ నపుంసకలింగ విశేషణం మంచిదైన కార్యాన్ని సూచిస్తుంది. ‘మేలు’ సంక్షిప్తంగా, స్పష్టంగా ఆ నైతిక భావాన్ని అందిస్తుంది.
- source_word: πρὸς πάντας
  choice: అందరికీ
  rationale: πρός ఇక్కడ కార్యం ఎవరిని ఉద్దేశించి చేయబడుతుందో తెలియజేస్తుంది. ‘అందరికీ’ ఏ వర్గాన్నీ మినహాయించకుండా సమస్త ప్రజలను సూచిస్తుంది.
- source_word: μάλιστα δὲ
  choice: ముఖ్యంగా
  rationale: ఇది అందరికీ మేలు చేయాలనే ఆజ్ఞను పరిమితం చేయకుండా, ఒక వర్గానికి ప్రత్యేక ప్రాధాన్యం ఇస్తుంది. ‘ముఖ్యంగా’ ఈ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: విశ్వాస కుటుంబానికి చెందినవారు
  rationale: οἰκεῖοι ఒక ఇంటివారిని లేదా కుటుంబానికి చెందినవారిని సూచిస్తుంది. ఈ అనువాదం విశ్వాసుల సమాజానికి సంబంధించిన కుటుంబ రూపకాన్ని నిలుపుతుంది.
- source_word: πίστεως
  choice: విశ్వాస
  rationale: πίστις‌కు ప్రాథమికంగా ‘విశ్వాసం’ అనే భావాన్ని ఉంచుతూ, ఇక్కడ కుటుంబాన్ని గుర్తించే లక్షణంగా ‘విశ్వాస కుటుంబం’ అని అనువదించబడింది; ‘విశ్వాస సిద్ధాంతం’ అనే భావం కూడా సాధ్యమని పాదటిప్పణి తెలియజేస్తుంది.
theological_decisions:
- issue: మేలు చేయవలసినవారి పరిధి మరియు ప్రాధాన్యం
  choice: అందరికీ మేలు చేయాలి; విశ్వాస సమాజానికి చెందినవారికి ప్రత్యేక ప్రాధాన్యం ఇవ్వాలి.
  alternative: ఈ ఆజ్ఞ విశ్వాసులకు మాత్రమే వర్తిస్తుంది; లేదా విశ్వాసులకు ఎలాంటి ప్రత్యేక ప్రాధాన్యమూ లేదు.
  rationale: πρὸς πάντας విశ్వవ్యాప్త పరిధిని స్పష్టంగా చెబుతుండగా, μάλιστα ప్రత్యేక ప్రాధాన్యాన్ని జోడిస్తుంది. అనువాదం ఈ రెండింటినీ తగ్గించకుండా నిలుపుతుంది.
- issue: τῆς πίστεως భావం
  choice: కుటుంబాన్ని గుర్తించే లక్షణంగా ‘విశ్వాసం’ అనే భావాన్ని ప్రధాన పాఠ్యంలో ఉంచడం.
  alternative: సామూహిక క్రైస్తవ విశ్వాస సిద్ధాంతం అనే అర్థంలో ‘ఆ విశ్వాసం’; లేదా గుణంగా ‘విశ్వసనీయత’.
  rationale: ఈ సందర్భంలో πίστις విశ్వాసుల సమాజాన్ని గుర్తించే ఆధారంగా ఉంది. అయితే అది వ్యక్తిగత విశ్వాసాన్నా, పంచుకున్న ‘విశ్వాస సిద్ధాంతాన్నా’ సూచిస్తుందనే స్వల్ప సందిగ్ధతను పాదటిప్పణిలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘విశ్వాస కుటుంబం’ అనే రూపం మూలంలోని కుటుంబ రూపకాన్ని నిలుపుతుంది. సార్వత్రిక బాధ్యతతో పాటు విశ్వాస సమాజం పట్ల ప్రత్యేక ప్రాధాన్యాన్ని కూడా సమతుల్యంగా వ్యక్తం చేసింది.
