  yaml_path: translation/nt/galatians/006/006.yaml
  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: te
  text: వాక్యంలో బోధన పొందుతున్నవాడు తనకు బోధిస్తున్నవానితో సమస్త మంచి విషయాల్లో పాలుపంచుకోవాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనకు బోధిస్తున్నవానితో మంచి వాటన్నిటినీ పంచుకోవాలి.” ఇందులో భౌతిక సహాయం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κοινωνείτω
  choice: పాలుపంచుకోవాలి
  rationale: వర్తమానకాల ఆజ్ఞార్థక రూపం నిరంతరంగా ఆచరించాల్సిన బాధ్యతను సూచిస్తుంది. ‘పాలుపంచుకోవాలి’ అనేది సహవాసం అనే భావానికే పరిమితం కాకుండా ఆచరణాత్మకంగా, భౌతికంగా పంచుకోవడాన్నీ కలిగివుంచుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక స్వల్ప సంధిని సూచిస్తుంది. తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే వాక్యం సహజంగా సందర్భంతో అనుసంధానమవుతుంది.
- source_word: ὁ κατηχούμενος
  choice: ఉపదేశం పొందుతున్నవాడు
  rationale: వర్తమాన కర్మణి అసమాపక క్రియ ఉపదేశాన్ని స్వీకరిస్తున్న వ్యక్తిని సూచిస్తుంది. తరువాతి క్రియాశీల రూపంతో ఉన్న సమాంతరతనూ ఈ పదబంధం కాపాడుతుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: ఇక్కడ λόγος బోధించబడుతున్న క్రైస్తవ సందేశాన్ని సూచిస్తుంది. ‘వాక్యం’ పౌలు వాడుకకు సుపరిచితమైనదిగా ఉండి, మూలపదంతో పారదర్శక సంబంధాన్ని కాపాడుతుంది.
- source_word: τῷ κατηχοῦντι
  choice: తనకు ఉపదేశం చేస్తున్నవాడితో
  rationale: వర్తమాన కర్తరి అసమాపక క్రియ ఉపదేశం చేస్తున్న వ్యక్తిని సూచిస్తుంది. దత్తివిభక్తి κοινωνέωతో కలిసి పంచుకోవడంలో భాగస్వామి లేదా స్వీకర్తను తెలియజేస్తుంది.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: అన్ని మంచి వాటిలో
  rationale: గ్రీకు పదబంధపు విస్తృతిని నిలుపుతూ భౌతిక, ఆచరణాత్మక సహాయం సహా వివిధ మంచి వాటిని సూచించేందుకు వీలు కల్పిస్తుంది; దానిని కేవలం ధనసహాయంగా కుదించదు.
theological_decisions:
- issue: ఆదేశించబడిన పంచుకోవడం యొక్క స్వభావం
  choice: ఉపదేశం పొందేవాడు ఉపదేశకునితో అన్ని మంచి వాటిలో పాలుపంచుకోవాలి; ఇందులో భౌతిక సహాయం ఉండే అవకాశం బలంగా ఉంది.
  alternative: ఇది భౌతిక సహాయాన్ని సూచించకుండా కేవలం సాధారణ ఆత్మీయ సహవాసాన్ని మాత్రమే సూచిస్తుంది.
  rationale: κοινωνέωకు దత్తివిభక్తిలో వ్యక్తి జతకావడం, అలాగే ‘అన్ని మంచి వాటిలో’ అనే పదబంధం ఉండడం ఆచరణాత్మకమైన పంచుకోవడాన్ని సూచిస్తాయి. అయినప్పటికీ మూలవాక్యం దానిని డబ్బుకే పరిమితం చేయదు; అనువాదం ఆ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఉపదేశం పొందుతున్నవాడు / ఉపదేశం చేస్తున్నవాడు’ అనే సమాంతర నిర్మాణం గ్రీకు రూపాల సంబంధాన్ని స్పష్టంగా ఉంచుతుంది. ‘పాలుపంచుకోవాలి’ నిరంతర ఆచరణగా ఉన్న ఆజ్ఞను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
