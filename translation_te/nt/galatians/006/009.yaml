source:
  edition: SBLGNT
  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: te
  text: మనం మేలు చేయడంలో నిరుత్సాహపడకుందాం[a]. ఎందుకంటే మనం వదిలిపెట్టకుండా ఉంటే[c], తగిన సమయంలో[b] పంట కోస్తాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మేలు చేయడంలో అలసిపోకుందాం’ లేదా ‘మంచిదాన్ని చేస్తూ ధైర్యం కోల్పోకుందాం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దానికి తగిన సమయంలో’ లేదా ‘దాని సొంత సమయంలో.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘అలసిపోకుండా’ లేదా ‘సొమ్మసిల్లకుండా.’
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: మేలు చేయడంలో
  rationale: τὸ καλὸν అనే నపుంసకలింగ విశేషణం ποιέωతో కలిసి ‘మంచిదాన్ని/మేలును చేయడం’ అనే నైతిక భావాన్ని ఇస్తుంది. ‘మేలు చేయడంలో’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; వర్తమాన కృదంతంలోని కొనసాగుతున్న కార్యభావాన్ని కూడా నిలుపుతుంది.
- source_word: μὴ ἐγκακῶμεν
  choice: నిరుత్సాహపడకుందాం
  rationale: ఈ క్రియ అలసిపోయి ధైర్యం కోల్పోవడం లేదా వెనుకంజ వేయడం అనే భావాన్ని కలిగి ఉంది. ‘నిరుత్సాహపడకుందాం’ సమూహ ప్రబోధాన్ని సహజంగా వ్యక్తపరుస్తూ, చివరి μὴ ἐκλυόμενοιతో పదబంధ భేదాన్ని కాపాడుతుంది.
- source_word: καιρῷ ... ἰδίῳ
  choice: తగిన సమయంలో
  rationale: καιρός తగిన లేదా నిర్ణీత సమయాన్ని సూచిస్తుంది; ἴδιος దానికి ‘దానికి తగిన/సొంత’ అనే భావాన్ని జోడిస్తుంది. ‘తగిన సమయంలో’ మూలంలోని సహజమైన సమయభావాన్ని మతపరమైన అదనపు వివరణ లేకుండా అందిస్తుంది.
- source_word: θερίσομεν
  choice: పంట కోస్తాం
  rationale: ఈ భవిష్యత్ క్రియ చుట్టుపక్కల సందర్భంలోని వ్యవసాయ రూపకాన్ని కొనసాగిస్తుంది. తెలుగులో ‘పంట కోయడం’ ఆ రూపకాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: μὴ ἐκλυόμενοι
  choice: వదిలిపెట్టకుండా ఉంటే
  rationale: కృదంతం అలసిపోవడం, సడలిపోవడం లేదా చేతులెత్తేయడం అనే భావాన్ని ఇస్తుంది. ఇక్కడ దాని షరతు భావాన్ని ‘ఉంటే’ స్పష్టం చేస్తుంది; ‘వదిలిపెట్టకుండా’ ముందటి ‘నిరుత్సాహపడకుందాం’తో సంబంధాన్ని ఉంచినా రెండింటినీ ఒకే పదంగా కలపదు.
theological_decisions:
- issue: ἐγκακῶμεν మరియు ἐκλυόμενοι అనే రెండు పట్టుదల వ్యక్తీకరణల పరస్పర సంబంధం
  choice: వాటిని సంబంధమున్నా భిన్నమైన పదాలతో ‘నిరుత్సాహపడకుందాం’ మరియు ‘వదిలిపెట్టకుండా ఉంటే’ అని అనువదించడం.
  alternative: ‘అలసిపోకుందాం ... సొమ్మసిల్లకుండా’ లేదా ‘ధైర్యం కోల్పోకుందాం ... అలసిపోకుండా’.
  rationale: పౌలు దగ్గర సంబంధమున్న రెండు వేర్వేరు వ్యక్తీకరణలు వాడాడు. వాటి మధ్య భేదాన్ని నిలుపడం వాక్యంలోని అలంకారబలాన్ని కాపాడుతుంది; అదే సమయంలో పాఠ్యంలో ఉన్న పట్టుదల పిలుపుకు మించిన సిద్ధాంతపరమైన నిర్ణయాన్ని జోడించదు.
- issue: μὴ ἐκλυόμενοι యొక్క వ్యాకరణ సంబంధం
  choice: ‘వదిలిపెట్టకుండా ఉంటే’ అని షరతు భావంతో వ్యక్తపరచడం.
  alternative: ‘వదిలిపెట్టకుండానే’ లేదా ‘అలసిపోకుండా’ అని విధానార్థకంగా అనువదించడం.
  rationale: గ్రీకు కృదంతం వ్యాకరణపరంగా షరతు లేదా విధాన భావాలకు వీలు ఇస్తుంది. సందర్భంలో పంట కోయడానికి కొనసాగింపు అవసరమనే భావం బలంగా ఉన్నందున షరతు రూపం సహజంగా ఉంటుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని కొంత అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘మనం ... -కుందాం’ సమూహ ప్రబోధాన్ని సహజంగా తెలియజేస్తుంది. వ్యవసాయ రూపకాన్ని ‘పంట కోస్తాం’తో స్పష్టంగా నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
