id: GAL.6.7
reference: Galatians 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: te
  text: 'మోసపోవద్దు: దేవుణ్ణి ఎగతాళి చేయలేరు. ఎందుకంటే మనిషి[a] ఏది విత్తుతాడో, దానినే కోస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘మనిషి’ అనే ఏకవచన పదం సాధారణంగా ప్రతి మానవుణ్ణీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: మోసపోవద్దు
  rationale: వర్తమానకాల నిషేధార్థక కర్మణి ఆజ్ఞ యొక్క హెచ్చరిక ధ్వనిని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: θεὸς
  choice: దేవుడు
  rationale: ఇక్కడ ఏకైక దేవుణ్ణి సూచించే θεός‌కు ప్రామాణికమైన తెలుగు రూపం.
- source_word: οὐ μυκτηρίζεται
  choice: ఎగతాళికి గురికాడు
  rationale: μυκτηρίζωలో ఉన్న ఎగతాళి చేయడం, తిరస్కారంగా చూడడం అనే భావాన్ని ఉంచుతూ, గ్రీకు కర్మణి రూపాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; దేవుణ్ణి అవహేళన చేసి దాని ఫలితం నుంచి తప్పించుకోవచ్చనే భావాన్ని ఈ వాక్యం నిరాకరిస్తుంది.
- source_word: ὃ γὰρ ἐὰν
  choice: ఎందుకంటే … ఏది
  rationale: సాధారణంగా వర్తించే అనిశ్చిత సంబంధార్థక షరతును తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: σπείρῃ
  choice: విత్తుతాడో
  rationale: వ్యవసాయ రూపకాన్ని అనువదించకుండా యథాతథంగా నిలుపుతుంది; తరువాతి ‘కోస్తాడు’తో ఉన్న జతను కాపాడుతుంది.
- source_word: ἄνθρωπος
  choice: మనిషి
  rationale: ఏకవచన ప్రతినిధి రూపాన్ని నిలుపుతూ, తెలుగులో మానవుని సాధారణంగా సూచించే సహజ పదాన్ని ఉపయోగిస్తుంది.
- source_word: τοῦτο καὶ θερίσει
  choice: దానినే కోస్తాడు
  rationale: τοῦτο యొక్క సూచనార్థాన్నీ καί వల్ల వచ్చే తత్సంబంధ ఉద్ఘాటననూ ‘దానినే’ ద్వారా స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ἄνθρωπος అనే ప్రతినిధి ఏకవచనం
  choice: మనిషి
  alternative: ఒక వ్యక్తి / ఎవరైనా
  rationale: గ్రీకు పదం వ్యాకరణపరంగా ఏకవచనమైనప్పటికీ, ఇక్కడ స్త్రీపురుషులందరికీ వర్తించే సాధారణ సూత్రాన్ని తెలియజేస్తుంది. ‘మనిషి’ ఆ ప్రతినిధి ఏకవచనాన్ని సహజంగా నిలుపుతుంది; దాని విస్తృత అర్థాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
- issue: θεὸς οὐ μυκτηρίζεται అనే కర్మణి ప్రకటన
  choice: దేవుడు ఎగతాళికి గురికాడు
  alternative: దేవుణ్ణి ఎగతాళి చేయలేరు
  rationale: ప్రత్యామ్నాయం సామర్థ్యలేమి అనే భావాన్ని మరింత బలంగా చేర్చవచ్చు. ఎంపిక చేసిన రూపం గ్రీకు కర్మణి ప్రకటనలోని గంభీరతను, దాని సామెతసదృశమైన ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన హెచ్చరిక శైలిని ఉపయోగించాం. విత్తడం–కోయడం అనే మూల వ్యవసాయ రూపకాన్ని అలాగే నిలిపాం.
