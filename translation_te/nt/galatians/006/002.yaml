id: GAL.6.2
reference: Galatians 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: te
  text: ఒకరి భారాలను మరొకరు మోయండి. ఈ విధంగా మీరు మెస్సీయ[a] ధర్మశాస్త్రాన్ని నెరవేరుస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రీస్తు.”'
    reason: Χριστός అనే బిరుదుకు సంప్రదాయ తెలుగు రూపాంతరాన్ని ప్రత్యామ్నాయంగా సూచిస్తుంది.
lexical_decisions:
- source_word: ἀλλήλων
  choice: ఒకరి… మరొకరు
  rationale: సమాజంలోని పరస్పర బాధ్యతను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: τὰ βάρη
  choice: భారాలను
  rationale: ఇది అక్షరార్థంలోని బరువును, రూపకార్థంలోని కష్టాలు లేదా ఒత్తిళ్లను రెండింటినీ నిలుపుతుంది.
- source_word: βαστάζετε
  choice: మోయండి
  rationale: వర్తమాన ఆజ్ఞార్థక బహువచనంలోని కొనసాగుతున్న కార్యానికి పిలుపును సహజంగా తెలియజేస్తుంది.
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: ముందున్న ఆజ్ఞను దాని ఫలితంతో స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: ἀναπληρώσετε
  choice: మీరు … నెరవేరుస్తారు
  rationale: భవిష్యత్ సూచనార్థక రూపాన్ని నిలుపుతూ, ఆజ్ఞకు విధేయత చూపడం వల్ల కలిగే ఫలితాన్ని వ్యక్తపరుస్తుంది.
- source_word: νόμον
  choice: ధర్మశాస్త్రాన్ని
  rationale: νόμος అనే ‘ధర్మశాస్త్రం/చట్టం’ భావాన్ని నిలుపుతూ, పౌలు వాడుకలోని ధార్మిక-నైతిక ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ ధర్మశాస్త్రాన్ని విశేషించే బిరుదుగా ఉంది; అందువల్ల దాని యూద మెస్సీయ సంబంధిత అర్థాన్ని అనువదించి నిలిపింది.
theological_decisions:
- issue: Χριστοῦ పదాన్ని ఎలా అందించాలి
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός పేరు వలె కాక బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ దాని అర్థాన్ని స్పష్టంగా నిలుపుతుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- issue: τὸν νόμον τοῦ Χριστοῦ లోని షష్ఠీ విభక్తి సంబంధం
  choice: మెస్సీయ ధర్మశాస్త్రం
  alternative: మెస్సీయకు చెందిన ధర్మశాస్త్రం / మెస్సీయ బోధించిన ధర్మశాస్త్రం
  rationale: గ్రీకు పదబంధం స్వామ్యాన్ని, మూలాన్ని లేదా లక్షణాన్ని సూచించవచ్చు. అదనపు వివరణను చేర్చకుండా తెలుగు సమాసం ఆ విస్తృత సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘ఒకరి… మరొకరు’ పరస్పరతను సహజంగా చూపుతుంది; ‘ధర్మశాస్త్రం’ పౌలు వాక్యంలోని ఉద్దేశపూర్వక ధార్మిక ఉద్వేగాన్ని తగ్గించకుండా నిలుపుతుంది.
