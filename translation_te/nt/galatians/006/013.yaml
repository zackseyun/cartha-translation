id: GAL.6.13
reference: Galatians 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: te
  text: ఎందుకంటే, సున్నతి పొందినవారు తామే కూడా ధర్మశాస్త్రాన్ని పాటించరు; అయితే మీ శరీరంలో గొప్పలు చెప్పుకోవడానికి మీరు సున్నతి పొందాలని వారు కోరుతున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: ఎందుకంటే ... కూడా ... పాటించరు
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, οὐδέ యొక్క ‘కూడా కాదు’ భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంతో నిలుపుతుంది.
- source_word: οἱ περιτεμνόμενοι
  choice: సున్నతి పొందినవారు
  rationale: ఆర్టికల్‌తో కూడిన వర్తమాన కృదంతాన్ని ఒక వర్గాన్ని సూచించే నామవాచక పదబంధంగా అనువదిస్తుంది; ‘సున్నతిని ప్రోత్సహించేవారు’ అని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
- source_word: αὐτοὶ
  choice: తామే
  rationale: వాక్యంలోని కర్తపై ఉన్న గ్రీకు ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νόμον φυλάσσουσιν
  choice: ధర్మశాస్త్రాన్ని పాటించరు
  rationale: ఇక్కడ φυλάσσω ధర్మశాస్త్ర ఆజ్ఞలను ఆచరించడం/పాటించడం అనే భావంలో ఉంది; ‘కాపాడడం’ కంటే ‘పాటించడం’ సందర్భోచితం.
- source_word: ἀλλὰ θέλουσιν
  choice: అయితే ... వారు కోరుతున్నారు
  rationale: ἀλλά సూచించే వ్యతిరేకతను, θέλω యొక్క సంకల్పార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: మీరు సున్నతి పొందాలని
  rationale: గ్రీకు infinitive నిర్మాణంలోని భావాన్ని సహజమైన తెలుగు అనుబంధ వాక్యంగా, కార్యానికి లోనయ్యే భావాన్ని కాపాడుతూ అందిస్తుంది.
- source_word: ἵνα
  choice: '...కోవడానికి'
  rationale: ఈ సందర్భంలోని ఉద్దేశార్థాన్ని తెలుగు ప్రయోజనార్థక నిర్మాణంతో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: మీ శరీరంలో
  rationale: సున్నతి సందర్భంలో σάρξ భౌతిక దేహాన్ని సూచిస్తుంది. తెలుగులో ‘మీ మాంసంలో’ అపార్థకంగా లేదా అసహజంగా ఉండవచ్చు కాబట్టి, అర్థాన్ని అతిగా వ్యాఖ్యానించకుండా ‘శరీరం’ వాడబడింది.
- source_word: καυχήσωνται
  choice: గొప్పలు చెప్పుకోవడానికి
  rationale: ప్రతికూల సందర్భంలోని καυχάομαι భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో σάρξ యొక్క అర్థం
  choice: సున్నతి గుర్తుకు సంబంధించిన భౌతిక శరీరం
  alternative: పాప స్వభావం
  rationale: తక్షణ సందర్భం సున్నతి కావడంతో, ఇక్కడ σάρξ రూపకాలంకారంగా ‘పాప స్వభావం’ను కాక శారీరక గుర్తు కనిపించే దేహాన్ని సూచిస్తుంది.
- issue: περιτεμνόμενοι కృదంతం యొక్క భావం
  choice: సున్నతి పొందినవారు
  alternative: సున్నతిని ప్రోత్సహించేవారు
  rationale: మూలపాఠం వారిని సున్నతితో గుర్తిస్తుంది. సందర్భంలో వారు సున్నతిని ఒత్తిడి చేస్తున్నప్పటికీ, అనువాదంలో ఆ వ్యాఖ్యానాన్ని పదంలోనే కలపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ధర్మశాస్త్రం,’ ‘సున్నతి’ వంటి స్థిరమైన బైబిలు పదాలను నిలుపుతూ, అసహజమైన పదక్షర అనువాదాన్ని నివారించింది.
