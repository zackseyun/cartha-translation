review_pass:
  verdict: approve
  source_fidelity: The rendering accurately conveys the temporal force of Τοῦ λοιποῦ (“ఇకమీదట”), the prohibitive imperative (“ఎవరూ ... పెట్టవద్దు”), the idiomatic sense of κόπους παρέχειν (“ఇబ్బంది పెట్టవద్దు”), and Paul’s bearing of Jesus’ στίγματα on his body. “శరీరంపై” is idiomatic Telugu for visible bodily marks while adequately representing the Greek locative expression.
  naturalness: The Telugu is clear, modern, and appropriately firm in this concluding apostolic statement. “ఇకమీదట ఎవరూ నన్ను ఇబ్బంది పెట్టవద్దు” is natural standard usage, and the second sentence maintains a suitably serious register.
  terminology: “యేసు గుర్తులు” preserves the deliberately open force of στίγματα without deciding between scars, brands, or metaphorical signs. The footnote appropriately supplies “ముద్రలను” as a lexical alternative and notes the ownership/allegiance association without making it the main-text interpretation.
