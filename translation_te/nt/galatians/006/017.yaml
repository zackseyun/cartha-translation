id: GAL.6.17
reference: Galatians 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: te
  text: ఇకమీదట ఎవరూ నన్ను ఇబ్బంది పెట్టవద్దు. ఎందుకంటే నేను నా శరీరంపై యేసు గుర్తులను[a] మోస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ముద్రలను’; ఈ పదం శరీరంపై యాజమాన్యాన్ని లేదా విధేయతను గుర్తించే ముద్రలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: ఇకమీదట
  rationale: ఇది ‘ఇప్పటినుంచి’ లేదా ‘ఇకపై’ అనే కాలార్థక నుడికారం. ముగింపు హెచ్చరికలో ‘ఇకమీదట’ సహజంగా, గంభీరంగా ఉంది.
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: ఎవరూ నన్ను ఇబ్బంది పెట్టవద్దు
  rationale: κόπους παρέχειν అనే నుడికారం శ్రమను ఇవ్వడం అనే అక్షరార్థం కంటే ఇబ్బంది లేదా చికాకు కలిగించడం అని అర్థం. గ్రీకు మూడవ పురుష ఆజ్ఞార్థక నిషేధాన్ని తెలుగులో సహజమైన నిషేధాజ్ఞగా వ్యక్తం చేసింది.
- source_word: στίγματα
  choice: గుర్తులను
  rationale: ఈ పదం శరీరంపై ఉన్న ముద్రలు, వాతలు లేదా యాజమాన్యం/విధేయతను తెలిపే గుర్తులను సూచించవచ్చు. ‘గుర్తులు’ ప్రధాన పాఠ్యంలో విస్తృతార్థాన్ని నిలుపుతుంది; మరింత నిర్దిష్టమైన భావం పాదసూచికలో ఉంది.
- source_word: τοῦ Ἰησοῦ
  choice: యేసు గుర్తులను
  rationale: సంబంధార్థక షష్ఠీ విభక్తిని సరళంగా నిలిపి, అవి యేసుకు చెందినవా, యేసునిమిత్తమైనవా, యేసుతో అనుబంధాన్ని చూపేవా అనే సంబంధాన్ని అనవసరంగా నిర్దిష్టం చేయలేదు.
- source_word: ἐν τῷ σώματί μου
  choice: నా శరీరంపై
  rationale: కనిపించే శారీరక గుర్తుల స్థానం తెలుగులో సహజంగా ‘శరీరంపై’ అని చెప్పబడుతుంది.
- source_word: βαστάζω
  choice: మోస్తున్నాను
  rationale: βαστάζω అంటే మోయడం లేదా భరించడం. వర్తమాన క్రియ యొక్క కొనసాగుతున్న భావాన్ని ‘మోస్తున్నాను’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పౌలు చెప్పిన στίγματα స్వభావం
  choice: ‘యేసు గుర్తులు’ అని తటస్థంగా అనువదించడం
  alternative: హింసవల్ల కలిగిన వాతలు; యేసుకు చెందినవాడని తెలిపే దాసముద్రలు; అపొస్తలిక బాధకు రూపకం
  rationale: ఈ పదం పౌలు అనుభవించిన శారీరక బాధల గుర్తులను, అవే యేసుతో అతని అనుబంధం లేదా విధేయతను తెలిపే చిహ్నాలనే భావాన్ని ఒకేసారి రేకెత్తించవచ్చు. వాక్యం ఒక్క అర్థాన్నే నిర్బంధించదు కాబట్టి ప్రధాన పాఠ్యం ఆ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన ముగింపు హెచ్చరిక. ‘ఇబ్బంది పెట్టవద్దు’ నుడికారార్థాన్ని సహజంగా అందిస్తుంది; ‘గుర్తులు’ ఉద్దేశపూర్వకంగా వ్యాఖ్యానాత్మక విస్తృతిని నిలుపుతుంది.
