id: GAL.6.16
reference: Galatians 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: te
  text: ఈ నియమం ప్రకారం నడిచే వారందరిపై[a] శాంతి, కరుణ కలుగుగాక; మరియు[c] దేవుని ఇశ్రాయేలుపై[b] కూడా కలుగుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ప్రమాణాన్ని అనుసరించే వారందరు.” ఇక్కడి క్రియ ఒక నియమానికి అనుగుణంగా వరుసలో నడవడం లేదా అడుగు కలిపి సాగడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: '“దేవుని ఇశ్రాయేలు” ఎవరిని సూచిస్తుందో వివాదాస్పదం: విశ్వాసులైన యూదులను, సంఘమంతటిని, లేదా మరింత విస్తృతంగా దేవుని ప్రజలను సూచించవచ్చు. గ్రీకు పదబంధంలోని అనిశ్చితిని అనువాదం అలాగే ఉంచుతుంది.'
    reason: alternative_reading
  - marker: c
    text: చివరి “మరియు”ను మరో వర్గాన్ని జోడించేదిగా (“మరియు దేవుని ఇశ్రాయేలుపై”) లేదా ముందుగా చెప్పిన వారినే మళ్లీ వివరించేదిగా (“అనగా దేవుని ఇశ్రాయేలుపై”) అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: వారందరు
  rationale: గ్రీకు సంబంధవాచకంలోని సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κανόνι
  choice: నియమం
  rationale: ప్రవర్తనను నిర్దేశించే కొలమానం లేదా ప్రమాణం అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది; ‘ప్రమాణం’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: στοιχήσουσιν
  choice: ప్రకారం నడిచే
  rationale: ఒక నియమానికి అనుగుణంగా వరుసలో నడవడం లేదా అడుగు కలిపి సాగడం అనే రూపకభావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: ఆశీర్వాద వాక్యంలో εἰρήνηకి సాధారణమైన, స్థిరమైన తెలుగు సమానం.
- source_word: ἔλεος
  choice: కనికరం
  rationale: దేవుని దయాపూర్వక కరుణను తెలిపే సహజమైన తెలుగు పదం.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: వారందరిమీద ... అలాగే ... మీద కూడా
  rationale: ἐπί పునరుక్తిని ‘మీద’ ద్వారా నిలుపుతూ, ఆశీర్వాద భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: దేవుని ఇశ్రాయేలు
  rationale: గ్రీకు షష్ఠీ నిర్మాణాన్ని పారదర్శకంగా ఉంచి, ఈ పదబంధం ఎవరిని సూచిస్తుందనే వివాదాన్ని అనువాదంలో పరిష్కరించదు.
theological_decisions:
- issue: ‘దేవుని ఇశ్రాయేలు’ ఎవరిని సూచిస్తుంది?
  choice: పదబంధాన్ని ‘దేవుని ఇశ్రాయేలు’ అని యథాతథంగా ఉంచడం
  alternative: విశ్వాసులైన యూదులు మాత్రమే; సంఘమంతా; లేదా యూదులు, అన్యజనులు కలిసిన దేవుని ప్రజలందరు
  rationale: గ్రీకు వాక్యం ఒక్క అర్థాన్నే నిర్బంధించదు. అందువల్ల ఏ సిద్ధాంతపరమైన గుర్తింపునూ ప్రధాన పాఠ్యంలో చేర్చకుండా అస్పష్టతను నిలుపుతుంది.
- issue: ‘దేవుని ఇశ్రాయేలుమీద’కు ముందున్న చివరి καί భావం
  choice: ‘అలాగే ... మీద కూడా’ అని సంకలనార్థాన్ని నిలుపడం
  alternative: అదనపు వర్గాన్ని సూచించే ‘మరియు’; లేదా ముందటి వర్గాన్నే మళ్లీ వివరించే ‘అనగా/అంటే’
  rationale: καί ఇక్కడ వేరొక వర్గాన్ని జోడించవచ్చు లేదా అదే వర్గాన్ని పునర్వివరించవచ్చు. ప్రధాన పాఠ్యం ఈ వివాదాన్ని నిర్ణయించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆశీర్వాద శైలి. ‘కలుగుగాక’ బైబిలు ఆశీర్వాద స్వరాన్ని నిలుపుతుంది; పాఠ్యంలోని నిజమైన వ్యాకరణ, ధార్మిక అనిశ్చితులను పాదటిప్పణుల్లో స్పష్టంగా సూచించాం.
