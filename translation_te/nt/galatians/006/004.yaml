revisions:
- from: అయితే ప్రతివాడూ తన సొంత పనిని పరీక్షించుకోవాలి. అప్పుడు అతనికి మరొకరిని బట్టి కాక, తనను మాత్రమే బట్టి అతిశయించడానికి ఆధారం[a] ఉంటుంది[b].
  to: అయితే ప్రతివాడూ తన సొంత పనిని పరీక్షించుకోవాలి. అప్పుడు అతనికి తన విషయములో మాత్రమే అతిశయించడానికి ఆధారం ఉంటుంది, మరొకరి విషయములో కాదు[a][b].
  rationale: The revision retains the draft’s sound lexical choices but corrects the directional contrast introduced by εἰς. It renders Paul’s point as a non-comparative reference to one’s own work, without implying that a person is himself the ground of boasting. Footnote b is also corrected to reflect the full Greek phrase.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:01:48Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the imperative to test one’s own work and preserves καύχημα as a possible basis for boasting. However, ‘తనను మాత్రమే బట్టి / మరొకరిని బట్టి కాక’ makes the contrast sound like the basis or criterion of boasting (‘based on oneself rather than another’). The Greek εἰς ἑαυτὸν μόνον … οὐκ εἰς τὸν ἕτερον more directly marks the sphere or reference: with regard to oneself alone, not with regard to the other person.'
  naturalness: ‘పరీక్షించుకోవాలి’ and ‘అతిశయించడానికి ఆధారం’ are clear modern-standard Telugu. Recasting the final contrast as ‘తన విషయములో మాత్రమే … మరొకరి విషయములో కాదు’ is both more idiomatic and closer to the Greek construction.
  terminology: ‘పని’ suitably renders ἔργον in its broad sense. ‘అతిశయించడానికి ఆధారం’ appropriately preserves the ‘ground/reason for boasting’ sense of καύχημα without forcing a positive or negative theological evaluation. ‘ప్రతివాడూ’ naturally represents the generic singular.
  issues:
  - severity: medium
    issue: The main-text wording ‘మరొకరిని బట్టి కాక, తనను మాత్రమే బట్టి’ shifts the force of εἰς.
    rationale: This wording presents the self and the other as alternative grounds for boasting, whereas the Greek contrasts the reference/sphere in which the καύχημα is held. A ‘తన విషయములో ... మరొకరి విషయములో కాదు’ formulation retains the contrast without adding the evaluative notion of being based on someone.
  - severity: low
    issue: Footnote b calls ‘మరొకరిని కాదు’ the literal Greek.
    rationale: 'The Greek includes εἰς (‘with reference to/regarding’) as well as the article: ‘not with reference to the other [person].’ The note should not omit this element when characterizing the Greek.'
  revised_text: అయితే ప్రతివాడూ తన సొంత పనిని పరీక్షించుకోవాలి. అప్పుడు అతనికి తన విషయములో మాత్రమే అతిశయించడానికి ఆధారం ఉంటుంది, మరొకరి విషయములో కాదు[a][b].
