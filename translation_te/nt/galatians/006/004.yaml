source:
  edition: SBLGNT
  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: te
  text: అయితే ప్రతివాడూ తన సొంత పనిని పరీక్షించుకోవాలి. అప్పుడు అతనికి తన విషయములో మాత్రమే అతిశయించడానికి ఆధారం ఉంటుంది, మరొకరి విషయములో కాదు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతిశయం.’ గ్రీకు పదం అతిశయించే చర్యను గానీ, దానికి ఆధారమైన విషయాన్ని గానీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘మరొకరి విషయములో కాదు’; అంటే తనతో వ్యత్యాసంలో ఉన్న మరో వ్యక్తి విషయములో కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργον
  choice: పని
  rationale: ఈ పదం ఇక్కడ ఒక వ్యక్తి చేసిన ఒక్క క్రియకే పరిమితం కాకుండా అతని ప్రవర్తనను, కార్యాచరణను విస్తృతంగా సూచిస్తుంది; అందువల్ల సాధారణంగా అర్థమయ్యే ‘పని’ని ఎంచుకున్నాం.
- source_word: δοκιμαζέτω
  choice: పరీక్షించుకోవాలి
  rationale: తన పని ఎలాంటిదో పరిశీలించి దాని నాణ్యతను నిర్ధారించుకోవాలనే ఆజ్ఞార్థాన్ని ఇది సహజమైన తెలుగులో తెలియజేస్తుంది; పరీక్ష ఫలితం తప్పక అనుకూలమేనని ముందుగా నిర్ణయించదు.
- source_word: ἕκαστος
  choice: ప్రతివాడూ
  rationale: గ్రీకు పదంలోని ఒక్కొక్క వ్యక్తికి వర్తించే విభాజక భావాన్ని, తరువాత వచ్చే ఏకవచన నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ἑαυτοῦ
  choice: తన సొంత
  rationale: కర్త ఇతరుల పనిని కాక తన పనినే పరీక్షించాలనే ప్రతిబింబక బలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς ἑαυτὸν μόνον
  choice: తనను మాత్రమే బట్టి
  rationale: ఇతరునితో పోలికకు విరుద్ధంగా, తన విషయానికే పరిమితమైన మూల్యాంకనాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καύχημα
  choice: అతిశయించడానికి ఆధారం
  rationale: ఈ పదం అతిశయించే చర్యను గానీ, దానికి ఉన్న ఆధారాన్ని గానీ సూచించగలదు. సందర్భంలో ‘ఆధారం’ అనడం ఫలితంగా లభించే కారణం లేదా విషయం అనే భావాన్ని స్పష్టపరుస్తుంది.
- source_word: ἕξει
  choice: ఉంటుంది
  rationale: పరీక్షించుకోవడం వల్ల కలిగే ఫలితాన్ని తెలిపే గ్రీకు భవిష్యత్ కాల భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో అందిస్తుంది.
- source_word: τὸν ἕτερον
  choice: మరొకరిని
  rationale: తనకు భిన్నమైన మరో వ్యక్తిని సూచించే గ్రీకు భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: ముందటి సందర్భంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని, కొత్త ఉపదేశానికి మార్పును అతిగా బలపరచకుండా సూచిస్తుంది.
theological_decisions:
- issue: పౌలు వాడిన καύχημα పద భావం
  choice: ‘అతిశయించడానికి ఆధారం’ అని అనువదించాం.
  alternative: ‘అతిశయం’ లేదా ‘గర్వించడానికి కారణం’
  rationale: ఇది ఆధునిక తెలుగు ‘గర్వం’లోని తప్పనిసరి ప్రతికూల భావాన్ని చొప్పించకుండా, అతిశయించే చర్యకూ దాని ఆధారానికీ మధ్య ఉన్న మూలపాఠపు భావవిస్తృతిని నిలుపుతుంది. ఈ అతిశయం ప్రశంసనీయమైనదా కాదా అని వచనం చెప్పినదానికంటే ఎక్కువగా నిర్ణయించదు.
- issue: ఏకవచన సాధారణ పురుష సూచన
  choice: ‘ప్రతివాడూ’, ‘తన’ అనే ఏకవచన రూపాలు వాడాం.
  alternative: బహువచన లింగతటస్థ నిర్మాణం
  rationale: గ్రీకు మూలంలోని వ్యాకరణపరమైన పురుష ఏకవచన సాధారణ సూచనను తెలుగులో సహజంగా నిలుపుతూ, ఇది ప్రతి వ్యక్తికీ వర్తించే ఉపదేశమని సందర్భం తెలియజేసేలా చేశాం.
- issue: εἰς పదబంధాల్లో పోలిక భావం
  choice: ‘మరొకరిని బట్టి కాక, తనను మాత్రమే బట్టి’ అని ఇచ్చాం.
  alternative: ‘తన విషయంలోనే, మరొకరి విషయంలో కాదు’ అనే మరింత పదానువాద రూపం
  rationale: మూలంలోని తనవైపు/మరొకరివైపు అనే వ్యత్యాసాన్ని నిలుపుతూ, ఇతరునితో పోల్చుకొని అతిశయించకూడదనే సందర్భార్థాన్ని తెలుగులో గ్రాహ్యంగా వ్యక్తం చేస్తుంది; దేవుని తీర్పు వంటి అదనపు భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘పరీక్షించుకోవాలి’ వ్యక్తిగత స్వపరిశీలనను సహజంగా తెలియజేస్తుంది. ‘అతిశయించడానికి ఆధారం’ పౌలు వాడిన పదంలోని భావవిస్తృతిని, దానిలోని theological tension‌ను ముందుగానే సానుకూలం లేదా ప్రతికూలం అని తేల్చకుండా నిలుపుతుంది.
