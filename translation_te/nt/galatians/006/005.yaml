  source_fidelity: ‘ఎందుకంటే ప్రతి ఒక్కరూ తమ సొంత మోతను మోస్తారు’ faithfully represents the explanatory γάρ, distributive ἕκαστος, emphatic personal possession in τὸ ἴδιον, φορτίον as a carried load, and the future-form βαστάσει. The plural form with ‘ప్రతి ఒక్కరూ’ is idiomatic Telugu while retaining the distributive sense.
