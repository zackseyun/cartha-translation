  text: ἕκαστος γὰρ τὸ ἴδιον φορτίον βαστάσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: te
  text: ఎందుకంటే ప్రతి ఒక్కరూ తమ సొంత మోతను మోస్తారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ సొంత భారాన్ని భరిస్తారు.’ ఇక్కడి గ్రీకు పదం φορτίον (‘మోత/లోడు’); ఇది 2వ వచనంలోని βάρη (‘భారాలు’) అనే పదానికి భిన్నమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ప్రతి ఒక్కరూ
  rationale: విభజనాత్మక ఏకవచన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేసి, ఒక్కొక్క వ్యక్తిపై ఉన్న దృష్టిని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὸ ἴδιον
  choice: తమ సొంత
  rationale: ఒక్కొక్కరికి ప్రత్యేకంగా చెందినదనే ἴδιος భావాన్ని నిలుపుతుంది. తెలుగులో ‘ప్రతి ఒక్కరూ ... తమ’ అనేది సహజమైన గౌరవ/లింగతటస్థ అన్వయం.
- source_word: φορτίον
  choice: మోత
  rationale: మోయవలసిన లోడు అనే స్పష్టమైన భావాన్ని ఇస్తూ, 2వ వచనంలోని βάρηకు సాధారణంగా వాడే ‘భారాలు’ అనే పదం నుండి పదభేదాన్ని నిలుపుతుంది.
- source_word: βαστάσει
  choice: మోస్తారు
  rationale: భవిష్యత్ క్రియారూప భావాన్ని సందర్భానుసారంగా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘మోత’తో స్పష్టమైన క్రియాసంబంధాన్ని ఏర్పరుస్తుంది.
theological_decisions:
- issue: గలతీయులు 6:5కు 6:2తో ఉన్న సంబంధం
  choice: 6:2లోని ‘భారాలు’కు భిన్నంగా ఇక్కడ ‘మోత’ అని అనువదించి గ్రీకు పదభేదాన్ని నిలిపి, ప్రతి వ్యక్తి తనకు చెందినదాన్ని మోయాల్సి ఉంటుందనే వాక్యాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా ఉంచడం.
  alternative: రెండు వచనాల్లోనూ ‘భారం’ అని అనువదించడం; లేదా దీనిని ప్రత్యేకంగా అంత్యకాల తీర్పులో వ్యక్తిగత జవాబుదారీతనంగా ప్రధాన పాఠ్యంలో వివరించడం.
  rationale: సమీప సందర్భంలో పౌలు వేర్వేరు నామవాచకాలు—βάρη, φορτίον—వాడాడు. ఇతరుల భారాలను మోయడం మరియు ప్రతి ఒక్కరూ తమ సొంత మోతను మోయడం మధ్యనున్న నిజమైన ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘మోత’ ద్వారా మోయవలసిన లోడు అనే concrete భావాన్నీ, 6:2తోనున్న మూలపద భేదాన్నీ కాపాడాం.
