id: GAL.6.15
reference: Galatians 6:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: te
  text: ఎందుకంటే సున్నతికీ, సున్నతి లేని స్థితికీ ఏ ప్రాముఖ్యతా లేదు; కానీ కొత్త సృష్టికే ప్రాముఖ్యత ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొత్తగా సృష్టించబడిన వ్యక్తి.” అయితే ఈ సందర్భంలో “కొత్త సృష్టి” అనే అర్థమే ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: ఎందుకంటే ... లేదు; ... లోనూ ... లేదు
  rationale: γάρ ముందున్న వాదనకు వివరణాత్మక సంబంధాన్ని చూపుతుంది; οὔτε...οὔτε అనే జంట నిరాకరణను సహజమైన ఆధునిక తెలుగులో రెండు సమాంతర భాగాలుగా వ్యక్తం చేశాం.
- source_word: περιτομή
  choice: సున్నతి పొందడం
  rationale: ఇది శారీరక ఆచారాన్నీ, ఆ ఆచారం సూచించే స్థితినీ నిలుపుతుంది; తెలుగులో వాక్య నిర్మాణానికి క్రియానామ రూపం సహజంగా ఉంటుంది.
- source_word: τί ἐστιν
  choice: ఏ ప్రాముఖ్యతా లేదు
  rationale: ఈ సందర్భంలో గ్రీకు నుడికారం నిర్ణాయక విలువ లేదా ప్రాముఖ్యత లేకపోవడాన్ని సూచిస్తుంది. అక్షరార్థమైన ‘ఏమీ కాదు’ కంటే ఈ రూపం సహజంగా, స్పష్టంగా ఉంది.
- source_word: οὔτε ἀκροβυστία
  choice: సున్నతి పొందకపోవడంలోనూ ఏ ప్రాముఖ్యతా లేదు
  rationale: ἀκροβυστία ఇక్కడ శరీర భాగాన్ని కాక సున్నతి లేని స్థితిని సూచిస్తుంది; ఎదురెదురు నిర్మాణాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
- source_word: ἀλλὰ
  choice: ప్రాముఖ్యమైనది ... ఏ
  rationale: రెండు స్థితులకు విరుద్ధంగా నిజంగా నిర్ణాయకమైనదాన్ని బలంగా చూపించడానికి సహజ తెలుగు ప్రతివ్యత్యాస నిర్మాణాన్ని వాడాం.
- source_word: καινὴ κτίσις
  choice: కొత్త సృష్టి
  rationale: κτίσις ‘సృష్టి’ లేదా ‘సృష్టింపబడిన జీవి’ అనే అర్థాలు ఇవ్వగలదు. పౌలు సందర్భంలో విస్తృతమైన నూతన సృష్టి భావాన్ని ‘కొత్త సృష్టి’ బాగా నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: సున్నతి/సున్నతి లేని స్థితికి, కొత్త సృష్టికి మధ్య పౌలు చూపే వ్యత్యాసం
  choice: ఆ రెండు స్థితులకూ నిర్ణాయక ప్రాముఖ్యత లేదని చెప్పి, కొత్త సృష్టినే ప్రాముఖ్యమైనదిగా చూపడం
  alternative: ఇది కేవలం సామాజిక గుర్తింపుల గురించే చెప్పడం; లేదా రెండు స్థితులూ సమానమైన మార్గాలని భావించడం
  rationale: గ్రీకు పాఠం రెండు స్థితులనూ సమానంగా నిరాకరించి καινὴ κτίσις‌తో బలమైన వ్యత్యాసం చూపుతుంది. అనువాదం ఆ ఉద్వేగాన్ని నిలుపుతుంది; పాఠంలో లేని మతశాఖాపరమైన వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకులోని సంక్షిప్త నామవాక్యాన్ని తెలుగులో స్పష్టమైన ప్రతివ్యత్యాసంగా మలిచినా, దాని అర్థపరమైన ఉద్వేగాన్ని కాపాడాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
