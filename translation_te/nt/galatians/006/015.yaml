revisions:
- from: ఎందుకంటే సున్నతి పొందడంలో ఏ ప్రాముఖ్యతా లేదు; సున్నతి పొందకపోవడంలోనూ ఏ ప్రాముఖ్యతా లేదు. ప్రాముఖ్యమైనది కొత్త సృష్టే.[a]
  to: ఎందుకంటే సున్నతికీ, సున్నతి లేని స్థితికీ ఏ ప్రాముఖ్యతా లేదు; కానీ కొత్త సృష్టికే ప్రాముఖ్యత ఉంది.[a]
  rationale: The revision avoids reducing ‘circumcision’ to the act of being circumcised, preserves the neither/nor contrast as two corresponding statuses, and expresses the Greek adversative contrast naturally without adding doctrinal interpretation. The footnote continues to mark the less likely individual sense of κτίσις.
