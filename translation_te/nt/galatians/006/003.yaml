revisions:
- from: ఎందుకంటే, తాను ఏదో గొప్పవాడినని ఎవరైనా అనుకుంటే, నిజానికి తాను ఏమీ కానప్పుడు, తనను తానే మోసం చేసుకుంటున్నాడు.[a]
  to: ఎందుకంటే, ఎవరైనా తాను ఏదో ఒకడినని అనుకుంటూ, ఏమీ కానివాడై ఉంటే, తనను తానే మోసగించుకుంటాడు.[a]
  rationale: The revision removes the interpretive intensification ‘గొప్ప’ and the added qualifier ‘నిజానికి,’ preserving Paul’s concise contrast between regarding oneself as ‘something’ and being ‘nothing.’ It also uses a natural generic-result verb form while retaining the conditional and reflexive force.
  reviewer_model: gpt-5.6-terra
