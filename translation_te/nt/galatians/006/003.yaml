id: GAL.6.3
reference: Galatians 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: te
  text: ఎందుకంటే, ఎవరైనా తాను ఏదో ఒకడినని అనుకుంటూ, ఏమీ కానివాడై ఉంటే, తనను తానే మోసగించుకుంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనను తానే భ్రమపరచుకుంటాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ఎందుకంటే, ... ఎవరైనా ... అనుకుంటే
  rationale: γάρ యొక్క వివరణాత్మక భావాన్ని ‘ఎందుకంటే’తో, εἰ యొక్క షరతు భావాన్ని ‘అనుకుంటే’తో సహజమైన తెలుగులో నిలిపింది.
- source_word: δοκεῖ
  choice: అనుకుంటే
  rationale: ఇక్కడ ఈ క్రియ ఇతరులకు ఎలా కనిపిస్తాడో కాక, వ్యక్తి తన గురించి తాను చేసుకునే అంచనాను సూచిస్తుంది.
- source_word: τις
  choice: ఎవరైనా
  rationale: అనిర్దిష్టమైన, అందరికీ వర్తించే వ్యక్తిని సహజంగా సూచిస్తుంది.
- source_word: εἶναί τι
  choice: తాను ఏదో గొప్పవాడినని
  rationale: ‘ఏదో ఒకటిగా ఉండడం’ అనే గ్రీకు నుడికారం ఇక్కడ తనకు ప్రాముఖ్యత ఉందని భావించడాన్ని సూచిస్తుంది; ‘గొప్పవాడినని’ సాధారణ తెలుగు పాఠకునికి ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: μηδὲν ὤν
  choice: నిజానికి తాను ఏమీ కానప్పుడు
  rationale: ‘ఏమీ కాకపోవడం’ అనే సంక్షిప్త వ్యత్యాసాన్ని నిలుపుతూ, participial సంబంధాన్ని అతిగా concessiveగా మార్చకుండా ‘కానప్పుడు’తో తెలిపింది.
- source_word: φρεναπατᾷ
  choice: మోసం చేసుకుంటున్నాడు
  rationale: మనస్సులో తనను తాను తప్పుదారి పట్టించుకోవడం లేదా భ్రమపరచుకోవడం అనే భావానికి ఇది స్పష్టమైన సాధారణ తెలుగు సమానం.
- source_word: ἑαυτόν
  choice: తనను తానే
  rationale: కర్తవైపు తిరిగి సూచించే గ్రీకు ఆత్మార్థక సర్వనామంలోని బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: సాధారణ ప్రతినిధి పుంలింగ ఏకవచనం
  choice: ఎవరైనా ... తాను ... గొప్పవాడినని ... తనను తానే ... చేసుకుంటున్నాడు
  alternative: ఎవరైనా ... వారు ... తమను తాము
  rationale: గ్రీకు పాఠం వ్యాకరణపరంగా పుంలింగ ఏకవచనాన్ని సాధారణ ప్రతినిధి భావంలో వాడుతుంది. తెలుగు వాక్యంలోనూ ఏకవచన నిర్మాణాన్ని నిలిపి, ఇది ఎవరికైనా వర్తిస్తుందని ‘ఎవరైనా’ స్పష్టం చేస్తుంది.
- issue: τι యొక్క భావవ్యాప్తి
  choice: ఏదో గొప్పవాడినని
  alternative: ఏదో ఒకడినని / ప్రాముఖ్యమైనవాడినని
  rationale: పౌలు చెప్పే ‘something/nothing’ వ్యత్యాసంలో స్వీయ-ప్రాముఖ్యత భావం ఉంది. ‘గొప్పవాడు’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది; అయితే ఇది పదశః ‘ఏదో’ కంటే కొంత వివరణాత్మకం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. మూలంలోని వివరణాత్మక షరతు, స్వీయ-అంచనా, ‘ఏదో/ఏమీ కాదు’ అనే ఉద్దేశిత వ్యత్యాసం సాధ్యమైనంత సహజంగా ఉంచబడ్డాయి.
