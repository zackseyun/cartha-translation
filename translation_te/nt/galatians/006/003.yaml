review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the explanatory conditional, self-directed deception, and the reflexive object. However, “గొప్పవాడినని” narrows and intensifies εἶναί τι (“to be something”), while “నిజానికి” adds an explicit adversative/evaluative qualification not present in the Greek. The revision retains the deliberate ‘something/nothing’ contrast more closely.
  naturalness: The revised wording is idiomatic modern standard Telugu and expresses the generic conditional naturally without the progressive-result form “చేసుకుంటున్నాడు,” which is less fitting for this general maxim.
  terminology: “ఏదో ఒకడినని / ఏమీ కానివాడై” preserves the compact rhetorical contrast of τι and μηδέν without importing a stronger claim of greatness. “మోసగించుకుంటాడు” is an appropriate rendering of φρεναπατᾷ ἑαυτόν.
  issues:
  - severity: medium
    issue: “ఏదో గొప్పవాడినని” is more specific and stronger than εἶναί τι.
    rationale: The Greek idiom denotes thinking oneself ‘something’ or significant; ‘great’ can overstate the assertion and weakens the source’s intentionally matched something/nothing wording.
  - severity: low
    issue: “నిజానికి” is not represented in the Greek text.
    rationale: μηδὲν ὤν states ‘being nothing’; the added ‘in reality’ makes the contrast more explicitly interpretive than the source syntax requires.
  - severity: low
    issue: The result clause uses progressive aspect (“మోసం చేసుకుంటున్నాడు”) in a generic conditional.
    rationale: A habitual/general-result form (“మోసగించుకుంటాడు”) is more natural for the conditional maxim.
  revised_text: ఎందుకంటే, ఎవరైనా తాను ఏదో ఒకడినని అనుకుంటూ, ఏమీ కానివాడై ఉంటే, తనను తానే మోసగించుకుంటాడు.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, “తనను తానే భ్రమపరచుకుంటాడు.”
