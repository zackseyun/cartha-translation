id: GAL.6.12
reference: Galatians 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: te
  text: శరీర సంబంధమైన విషయాల్లో మంచి కనిపింపు పొందాలని కోరుకునేవారంతా[a] మిమ్మల్ని సున్నతి చేయించుకోవాలని బలవంతం చేస్తున్నారు; మెస్సీయ[b] సిలువ కారణంగా[c] తాము హింసించబడకుండా ఉండడానికే వారే ఇలా చేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బయటికి మంచి అభిప్రాయం కలిగించాలని కోరుకునేవారంతా.”
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ అనువాదం: “క్రీస్తు.”'
    reason: alternative_rendering
  - marker: c
    text: లేదా, “మెస్సీయ సిలువను బట్టి” లేదా “మెస్సీయ సిలువ విషయంలో.”
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ὅσοι θέλουσιν
  choice: కోరుకునేవారంతా
  rationale: ὅσοι యొక్క సమగ్ర వర్గసూచనను, θέλουσιν యొక్క సంకల్ప భావాన్ని సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: εὐπροσωπῆσαι ἐν σαρκί
  choice: శరీరపరంగా మంచి ప్రదర్శన చేయాలని
  rationale: εὐπροσωπῆσαιలోని ఇతరుల ముందు ఆకర్షణీయంగా కనిపించాలనే భావాన్ని తెలియజేస్తూ, ἐν σαρκίలోని ‘శరీరం/బాహ్యత్వం’ అనే పౌలు వాడుకను పూర్తిగా కరిగించకుండా ఉంచుతుంది.
- source_word: οὗτοι
  choice: వీళ్లే
  rationale: సాధారణ ‘వారు’ కంటే మూలంలోని నిర్దేశక, ఉద్ఘాటనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι
  choice: మీరు సున్నతి చేయించుకోవాలని మిమ్మల్ని బలవంతం చేస్తున్నారు
  rationale: కొనసాగుతున్న ఒత్తిడిని, περιτέμνεσθαι యొక్క కర్మణి భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: μόνον ἵνα
  choice: ఉద్దేశంతో మాత్రమే
  rationale: మూలంలో పౌలు వారికి ఆపాదిస్తున్న ఏకైక ఉద్దేశాన్ని సూచించే పరిమితి మరియు ప్రయోజన భావాలను సహజంగా అందిస్తుంది.
- source_word: τῷ σταυρῷ
  choice: సిలువ కారణంగా
  rationale: διώκωνταιతో ఉన్న దత్తి విభక్తిని కారణార్థకంగా గ్రహించి సహజమైన తెలుగులో ఇస్తుంది; సంబంధార్థక సాధ్యతను పాదసూచికలో ఉంచింది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός వ్యక్తిపేరులా కాక బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని అనువదిస్తుంది.
- source_word: μὴ διώκωνται
  choice: తాము హింసకు గురికాకుండా
  rationale: ἵνα తరువాతి కర్మణి సంభావనార్థక క్రియలోని ఉద్దేశపూర్వక హింస-నివారణ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἐν σαρκί యొక్క భావం
  choice: శరీరపరంగా
  alternative: బయటికి; బాహ్య విషయాల్లో
  rationale: సందర్భం సున్నతి వంటి బాహ్య శరీర గుర్తును సూచించినప్పటికీ, పౌలు వాడే σάρξ పదంలోని విస్తృతమైన ధార్మిక ఉద్వేగాన్ని పూర్తిగా ‘బయటికి’ అని పరిష్కరించకుండా నిలుపుతుంది.
- issue: τοῦ Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ షష్ఠీ విభక్తి పదబంధంలో బిరుదు భావం సజీవంగా ఉంది; సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చింది.
- issue: τῷ σταυρῷ యొక్క దత్తి విభక్తి సంబంధం
  choice: సిలువ కారణంగా
  alternative: సిలువ విషయంలో; సిలువను బట్టి
  rationale: కారణార్థం సందర్భానికి బాగా సరిపోతుంది, అయితే గ్రీకు దత్తి విభక్తి కారణం లేదా సంబంధాన్ని సూచించగల స్వల్ప సందిగ్ధతను పాదసూచికలో కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా అనువదించబడింది. మూలంలోని οὗτοι ఉద్ఘాటనను ‘వీళ్లే’తో నిలిపి, పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం. ‘శరీరపరంగా’ అనే రూపం సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉండి, ‘శరీరం’ అనే పౌలు పదప్రయోగాన్ని కూడా నిలుపుతుంది.
