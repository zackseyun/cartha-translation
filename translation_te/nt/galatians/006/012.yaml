  terminology: “సున్నతి,” “మెస్సీయ,” “సిలువ,” and “హింసించబడడం” are suitable. “శరీర సంబంధమైన విషయాల్లో” retains the semantic connection to σάρξ without reducing it simply to ‘outwardly.’
  issues:
