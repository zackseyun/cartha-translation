review_pass:
  verdict: revise
  source_fidelity: The draft preserves the explanatory force of ὅτι, the reciprocal sowing/reaping imagery, the reflexive emphasis in ‘తన సొంత,’ the source sense of ἐκ (‘నుంచి’), and the flesh/Spirit contrast. However, rendering φθορά as ‘నాశనం’ in the main text narrows the Greek, which can encompass corruption, decay, and ruin. ‘క్షయం’ better retains the term’s breadth without specifying the final nature of the outcome.
  naturalness: The wording is clear, modern, and suitably proverbial in Telugu. ‘విత్తేవాడు … కోస్తాడు’ preserves the agricultural metaphor naturally. ‘శరీర స్వభావం కోసం’ is understandable and responsibly signals the ethical force of σάρξ, though it is somewhat interpretive; the footnote appropriately retains the more literal alternative.
  terminology: ‘శరీర స్వభావం’ and ‘ఆత్మ’ form a coherent contrast in modern Telugu. The footnote correctly identifies the likely reference of πνεῦμα as the Holy Spirit while not treating that capitalization-based distinction as available in Telugu. ‘నిత్యజీవం’ is an established equivalent for ζωὴ αἰώνιος.
  issues:
  - severity: medium
    issue: φθοράν is rendered ‘నాశనాన్ని’ in the main text.
    rationale: ‘నాశనం’ can suggest a more definite destruction than the Greek φθορά requires. Since φθορά includes decay, corruption, and ruin, ‘క్షయాన్ని’ is a broader and less doctrinally narrowing Telugu rendering. The footnote can retain ‘నాశనం’ as an alternative.
  revised_text: ఎందుకంటే, తన సొంత శరీర స్వభావం కోసం విత్తేవాడు ఆ శరీర స్వభావం నుంచే క్షయాన్ని కోస్తాడు[a][b]; అయితే ఆత్మ కోసం విత్తేవాడు ఆత్మ నుంచే నిత్యజీవాన్ని కోస్తాడు.[c]
