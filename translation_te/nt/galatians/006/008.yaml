source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: te
  text: ఎందుకంటే, తన సొంత శరీర స్వభావం కోసం విత్తేవాడు ఆ శరీర స్వభావం నుంచే క్షయాన్ని కోస్తాడు[a][b]; అయితే ఆత్మ కోసం విత్తేవాడు ఆత్మ నుంచే నిత్యజీవాన్ని కోస్తాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శరీర స్వభావం’ అని అనువదించిన గ్రీకు పదం అక్షరార్థంగా ‘శరీరం’ అని కూడా అర్థమవుతుంది; పౌలు నైతిక వ్యత్యాసాల్లో అది ఆత్మకు విరోధమైన మానవ ప్రవృత్తిని సూచించవచ్చు. కొందరు దీనిని ‘పాప స్వభావం’ అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నాశనాన్ని’ లేదా ‘పతనాన్ని’. గ్రీకు పదం క్షయం, పతనం లేదా నాశనాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘ఆత్మ’ అంటే పరిశుద్ధాత్మ అని సందర్భం సూచిస్తోంది; అయితే గ్రీకు పదం సందర్భానుసారం ‘ఆత్మ’ లేదా ‘మానవ ఆత్మ’ అనే అర్థం కూడా ఇవ్వగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి ఈ వాక్యం కారణాన్ని వివరిస్తోంది; తెలుగు సందర్భంలో ‘ఎందుకంటే’ ఆ వివరణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ σπείρων
  choice: విత్తేవాడు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతం యొక్క సాధారణ, సామెతలాంటి భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: తన సొంత శరీర స్వభావం కోసం
  rationale: εἰς ఇక్కడ దిశ లేదా ప్రయోజనాన్ని సూచిస్తుంది. ‘తన సొంత’ అనేది ἑαυτοῦ ఇచ్చే స్వీయ ప్రాధాన్యాన్ని నిలుపుతుంది; ‘శరీర స్వభావం’ అనేది కేవలం భౌతిక దేహం అనే అపార్థాన్ని తగ్గిస్తూ పౌలు వాడిన σάρξ పదబంధంలోని నైతిక భావాన్ని ఉంచుతుంది.
- source_word: ἐκ τῆς σαρκὸς
  choice: ఆ శరీర స్వభావం నుంచే
  rationale: ἐκ మూలాన్ని సూచిస్తుంది; ‘నుంచే’ మొదటి, రెండవ భాగాల సమాంతరతతో పాటు ఫలితం ఉద్భవించే మూలాన్ని బలంగా తెలియజేస్తుంది.
- source_word: θερίσει
  choice: కోస్తాడు
  rationale: విత్తడం–కోయడం అనే వ్యవసాయ రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: φθοράν
  choice: నాశనాన్ని
  rationale: φθορά సూచించగల పతనం, క్షయం, వినాశం అనే విస్తృత భావాలలో సందర్భానుకూలమైన ఫలితాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయంగా ‘క్షయం’ను పాదసూచికలో ఉంచాం.
- source_word: εἰς τὸ πνεῦμα
  choice: ఆత్మ కోసం
  rationale: గలతీయుల పత్రికలో శరీర స్వభావం–ఆత్మ వ్యత్యాసం సాధారణంగా దేవుని పరిశుద్ధాత్మను సూచిస్తుంది; ‘కోసం’ విత్తడం యొక్క దిశ/ప్రయోజనాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἐκ τοῦ πνεύματος
  choice: ఆత్మ నుంచే
  rationale: ἐκ యొక్క మూలార్థాన్ని నిలుపుతూ మొదటి భాగంలోని ‘నుంచే’తో సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవాన్ని
  rationale: ఈ స్థిరమైన గ్రీకు పదబంధానికి సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు సమానార్థకం.
theological_decisions:
- issue: పౌలు నైతిక వ్యత్యాసంలో σάρξ పదం
  choice: శరీర స్వభావం
  alternative: శరీరం; పాప స్వభావం
  rationale: కేవలం ‘శరీరం’ అంటే భౌతిక దేహమే చెడ్డదన్న అపార్థం రావచ్చు; ‘పాప స్వభావం’ అయితే వ్యాఖ్యానాన్ని మరీ నిర్దిష్టం చేస్తుంది. ‘శరీర స్వభావం’ పౌలు పదజాలంతో సంబంధాన్ని ఉంచి, దాని నైతిక దిశను సూచిస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
- issue: πνεῦμα యొక్క సూచ్యార్థం
  choice: ఆత్మ (పరిశుద్ధాత్మను సూచిస్తూ)
  alternative: మానవ ఆత్మ
  rationale: గలతీయుల పత్రికలో ఈ శరీర స్వభావం–ఆత్మ వ్యత్యాసం దేవుని ఆత్మను సూచించడం అత్యంత సహజం. తెలుగు లిపిలో పెద్ద/చిన్న అక్షర భేదం లేనందున పాదసూచికలో సూచ్యార్థాన్ని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. మూలంలోని విత్తడం–కోయడం రూపకం, రెండు భాగాల సమాంతరత, ‘తన సొంత’ అనే ఉద్ఘాటన నిలుపబడ్డాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
