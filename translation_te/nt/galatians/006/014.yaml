id: GAL.6.14
reference: Galatians 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: te
  text: అయితే, మన ప్రభువైన యేసు మెస్సీయ యొక్క సిలువలో తప్ప మరి దేనిలోనూ గొప్పగా చెప్పుకోవడం నాకు ఎన్నటికీ కలగకూడదు. దాని ద్వారా[b] లోకం నాకు సిలువ వేయబడింది; నేనూ లోకానికి సిలువ వేయబడ్డాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా ‘ఆయన ద్వారా’; సంబంధవాచక సర్వనామం ‘సిలువ’ను కాక ప్రభువైన యేసు మెస్సీయను సూచిస్తుందని తీసుకుంటే.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: నాకు ఎన్నటికీ కలగకూడదు
  rationale: తీవ్రమైన వ్యక్తిగత నిరాకరణను తెలిపే గ్రీకు ప్రయోగం. తెలుగులో సహజంగా ఉంటూనే పౌలు వ్యక్తపరచిన బలమైన తిరస్కారాన్ని నిలుపుతుంది.
- source_word: καυχᾶσθαι
  choice: గొప్పగా చెప్పుకోవడం
  rationale: సందర్భంలో తన ఘనతకు ఆధారంగా ఏదో ఒకదాన్ని ప్రదర్శించుకోవడం అనే భావం ఉంది. ‘గర్వించడం’ కంటే ఇది పదంలోని సానుకూల లేదా ప్రతికూల సందర్భార్థాలకు ఎక్కువ విస్తృతి ఇస్తుంది.
- source_word: εἰ μὴ
  choice: తప్ప మరి దేనిలోనూ
  rationale: సిలువ ఒక్కటే గొప్పగా చెప్పుకోవడానికి ఆధారమని తెలిపే మినహాయింపు భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: σταυρῷ
  choice: సిలువ
  rationale: పౌలు వాడిన సిలువ మరణ సంబంధమైన రూపకాన్నీ, ప్రాచుర్యంలో ఉన్న నూతన నిబంధన పదప్రయోగాన్నీ నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు సందర్భోచితమైన, గౌరవప్రదమైన ప్రామాణిక తెలుగు సమానం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστόςను కేవలం పేరుగా కాక ‘అభిషిక్తుడు’ అనే బిరుదుగా ప్రతిబింబిస్తుంది; ఆధునిక తెలుగు క్రైస్తవ వాడుకలో ‘మెస్సీయ’ గుర్తించదగిన రూపం.
- source_word: δι’ οὗ
  choice: దాని ద్వారానే
  rationale: సమీప పూర్వపదమైన ‘సిలువ’ను సూచించే సాధనార్థక భావాన్ని ప్రధాన పాఠ్యంలో అనుసరిస్తుంది; ‘ద్వారా’ను బలపరచే ‘నే’ గ్రీకు వాక్యంలోని కేంద్రీకరణకు సరిపోతుంది.
- source_word: κόσμος
  choice: లోకం
  rationale: దేవునికి విరోధంగా ఉన్న ప్రస్తుత లోక వ్యవస్థను సందర్భం సూచించినప్పటికీ, గ్రీకు పదంలోని విస్తృతతను వ్యాఖ్యానంతో కుదించకుండా నిలుపుతుంది.
- source_word: ἐσταύρωται
  choice: సిలువ వేయబడింది
  rationale: పూర్తయిన చర్యకు కొనసాగుతున్న ఫలితం ఉందని తెలిపే గ్రీకు పర్ఫెక్ట్ పాసివ్ భావాన్ని సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κἀγὼ κόσμῳ
  choice: నేనూ లోకానికి సిలువ వేయబడ్డాను
  rationale: గ్రీకులో రెండో భాగంలో క్రియ లోపించినా ముందటి భాగం నుంచి దాన్ని పూరించాలి. తెలుగులో స్పష్టత కోసం క్రియను పునరుక్తి చేస్తూ సమాంతరతను నిలిపింది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστοῦను ఎలా అందించాలి
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: ఇక్కడ Χριστός బిరుదు-పేరు కలయికలో ఉంది. ‘మెస్సీయ’ దాని బిరుదు భావాన్ని నిలుపుతుంది; ‘క్రీస్తు’ అనే సంప్రదాయ రూపాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: δι’ οὗకు పూర్వపదం
  choice: సిలువను సూచిస్తూ ‘దాని ద్వారా’
  alternative: యేసు మెస్సీయను సూచిస్తూ ‘ఆయన ద్వారా’
  rationale: ‘సిలువ’ అత్యంత సమీపంలోని వ్యాకరణపరంగా సరిపడే పూర్వపదం కాబట్టి ప్రధాన పాఠ్యంలో దానినే అనుసరించాం. అయితే గ్రీకులో ‘సిలువ’, ‘ప్రభువు’ రెండూ పుంలింగ ఏకవచన రూపాల్లో ఉండటంతో వ్యక్తిని సూచించే అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన శైలి. ‘అతిశయించడం’ వంటి తక్కువ సాధారణమైన పదానికి బదులు ‘గొప్పగా చెప్పుకోవడం’ వాడాం. గ్రీకు వాక్యంలోని సంక్షిప్త సమాంతరతను నిలుపుతూ, తెలుగులో అస్పష్టత రాకుండా రెండో భాగంలో ‘సిలువ వేయబడ్డాను’ అనే క్రియను పూరించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
