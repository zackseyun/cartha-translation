source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: te
  text: మన ప్రభువైన యేసు మెస్సీయ కృప మీ ఆత్మతో ఉండుగాక, సహోదరులారా.[a] ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“సహోదరులారా” అనే పిలుపు ఇక్కడ విశ్వాస సమాజమంతటినీ ఉద్దేశించి, పురుషులతో పాటు స్త్రీలను కూడా చేర్చవచ్చు; మరో అనువాదం: “సహోదర సహోదరీలారా.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు ఆశీర్వాద వాక్యాల్లో వాడే ప్రామాణిక పదం; దేవుని అనుగ్రహాన్ని సూచించే వేదాంతపరమైన బరువును, తెలుగు క్రైస్తవ వాడుకలోని సహజత్వాన్ని కాపాడుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος అనే బిరుదుకు సహజమైన, గౌరవప్రదమైన తెలుగు సమానం; ఆదిక్రైస్తవ విశ్వాస ప్రకటనలోని భావాన్ని నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు క్రీస్తు
  rationale: Χριστός మూలంగా ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదే అయినా, ‘యేసు క్రీస్తు’ ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా అర్థమయ్యే స్థిర రూపం; పేరుగా పూర్తిగా చదివిపోకుండా దాని బిరుదు నేపథ్యాన్ని నిర్ణయ వివరణలో గుర్తిస్తున్నాం.
- source_word: μετὰ
  choice: తో ఉండుగాక
  rationale: గ్రీకులో క్రియ లేని ఆశీర్వాద నిర్మాణాన్ని సహజ తెలుగులో కోరిక/ఆశీర్వాద భావంతో వ్యక్తం చేస్తుంది.
- source_word: πνεύματος ὑμῶν
  choice: మీ ఆత్మతో
  rationale: సమూహాన్ని ఉద్దేశించిన బహువచన ‘మీ’తో కూడిన ఏకవచన ‘ఆత్మ’ అనే గ్రీకు నిర్మాణాన్ని అలాగే కాపాడి, దాన్ని సాధారణ ‘మీతో’గా సరళీకరించదు.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: పిలుపు విభక్తిని సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు పురుష బహువచన రూపాన్ని నిలుపుతూ, సందర్భంలో విశ్వాస సమాజమంతా ఉద్దేశించబడవచ్చని పాదటిప్పణి వివరిస్తుంది.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: ఆరాధనా ముగింపు సూత్రానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστόςను అనువదించాలా, సంప్రదాయ రూపంలో ఉంచాలా
  choice: యేసు క్రీస్తు
  alternative: యేసు మెస్సీయ / యేసు అభిషిక్తుడు
  rationale: Χριστόςకు బిరుదు భావం ఉన్నప్పటికీ, ఈ సంక్షిప్త ముగింపు ఆశీర్వాదంలో ‘యేసు క్రీస్తు’ తెలుగు పాఠకులకు సహజమైన, గౌరవప్రదమైన స్థిర రూపం. మూలంలోని క్రీస్తు-బిరుదు భావాన్ని నిరాకరించకుండా, అసహజతను నివారిస్తుంది.
- issue: ἀδελφοί మిశ్రమ విశ్వాస సమాజాన్ని ఉద్దేశించే అవకాశం
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా పురుష బహువచనం; ప్రధాన పాఠం దానిని కాపాడుతుంది. అయితే సందర్భానుసారం స్త్రీలను కూడా కలుపుకొని సంఘమంతటినీ ఉద్దేశించవచ్చనే అర్థాన్ని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
- issue: πνεύματος ὑμῶνలో ఏకవచన ‘ఆత్మ’ యొక్క భావం
  choice: మీ ఆత్మతో
  alternative: మీతో / మీ అంతరంగంతో
  rationale: ‘ఆత్మ’ను వ్యక్తిగత అంతరంగమా, సమాజపు సామూహిక జీవనమా అని ఖచ్చితంగా నిర్ణయించకుండా, గ్రీకు వాక్యంలోని ఉద్దేశపూర్వక పదప్రయోగం మరియు అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన పౌలీయ ఆశీర్వాద ధోరణిని గౌరవప్రదంగా నిలుపుతూ, ‘ఉండుగాక’తో ఆశీర్వాద భావాన్ని సహజంగా వ్యక్తం చేసింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
