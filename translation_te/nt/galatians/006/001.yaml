revisions:
- from: సోదరులారా[a], ఒక వ్యక్తి ఏదైనా అపరాధంలో చిక్కుకున్నా[b], ఆత్మసంబంధులైన మీరు అలాంటి వ్యక్తిని సాత్విక భావంతో[c] తిరిగి సరిదిద్దండి. అయితే నీవు కూడా శోధనకు గురికాకుండా నీ విషయంలో నీవు జాగ్రత్తగా ఉండు.
  to: సోదరులారా[a], ఒక వ్యక్తి ఏదైనా అపరాధంలో చిక్కుకున్నా[b], ఆత్మసంబంధులైన మీరు అలాంటి వ్యక్తిని సాత్విక భావంతో[c] పునరుద్ధరించండి. నీవు కూడా శోధనకు గురికాకుండా నిన్ను నీవు జాగ్రత్తగా గమనించుకో.
  rationale: The revision removes an unsupported contrastive particle, renders the restorative force of καταρτίζετε more fully, and makes the reflexive self-watch explicit. It preserves the Greek’s singular personal warning after the plural address and command, as well as the interpretive openness of πνεύματι πραΰτητος.
  reviewer_model: gpt-5.6-terra
