id: GAL.6.1
reference: Galatians 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: te
  text: సోదరులారా[a], ఒక వ్యక్తి ఏదైనా అపరాధంలో చిక్కుకున్నా[b], ఆత్మసంబంధులైన మీరు అలాంటి వ్యక్తిని సాత్విక భావంతో[c] పునరుద్ధరించండి. నీవు కూడా శోధనకు గురికాకుండా నిన్ను నీవు జాగ్రత్తగా గమనించుకో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సోదరులారా’ అని అనువదించిన గ్రీకు పుంలింగ బహువచన సంబోధన, సందర్భానుసారంగా సోదరీమణులతో సహా తోటి విశ్వాసుల సమూహాన్ని ఉద్దేశించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఏదైనా అపరాధం చేత లోబడిపోయినా,’ లేదా ‘అకస్మాత్తుగా ఏదైనా అపరాధంలో చిక్కుకున్నా.’
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థంగా ‘సాత్వికతగల ఆత్మతో.’ ఇది సాత్వికమైన అంతరంగ వైఖరిని సూచించవచ్చు; దేవుని ఆత్మ కలిగించే సాత్వికతను కూడా ప్రతిధ్వనింపజేయవచ్చు.
    reason: theological_ambiguity
lexical_decisions:
- source_word: Ἀδελφοί
  choice: సోదరులారా
  rationale: సంబోధనలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతూ, సందర్భంలో తోటి విశ్వాసుల సమూహాన్ని సూచించే సహజమైన తెలుగు పదాన్ని ఉపయోగించాం.
- source_word: ἐὰν καὶ
  choice: …చిక్కుకున్నా
  rationale: షరతుతో కూడిన concessive భావాన్ని తెలుగులో సహజంగా తెలిపే ‘-న్నా’ నిర్మాణం ‘even if’ భావాన్ని అందిస్తుంది.
- source_word: προλημφθῇ
  choice: చిక్కుకున్నా
  rationale: అపరాధంలో పట్టుబడడం లేదా దాని చేత అకస్మాత్తుగా లోబడిపోవడం అనే సాధ్యమైన భావాలను ప్రధాన పాఠంలో సంక్షిప్తంగా ఉంచి, ప్రత్యామ్నాయ సూక్ష్మార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἄνθρωπος
  choice: ఒక వ్యక్తి
  rationale: ἄνθρωπος ఇక్కడ సాధారణ మానవ వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఒక వ్యక్తి’ సహజంగా ఉండి లింగాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: ἔν τινι παραπτώματι
  choice: ఏదైనా అపరాధంలో
  rationale: παράπτωμα యొక్క నైతిక తప్పిదం లేదా అతిక్రమం అనే గంభీరతను ‘అపరాధం’ తెలియజేస్తుంది; τινι యొక్క అనిర్దిష్టతను ‘ఏదైనా’ నిలుపుతుంది.
- source_word: οἱ πνευματικοὶ
  choice: ఆత్మసంబంధులైన మీరు
  rationale: ఆత్మచేత లక్షణీకరించబడినవారు అనే పౌలు మాటలోని విస్తృత భావాన్ని నిలుపుతుంది; ‘ఆత్మచేత నడిపించబడేవారు’ అని విపులీకరించి భావాన్ని పరిమితం చేయలేదు.
- source_word: καταρτίζετε
  choice: తిరిగి సరిదిద్దండి
  rationale: పాడైన లేదా తప్పిన దానిని సరైన స్థితికి పునరుద్ధరించడం అనే క్రియ యొక్క భావాన్ని, ఆజ్ఞారూపంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸν τοιοῦτον
  choice: అలాంటి వ్యక్తిని
  rationale: ముందు పేర్కొన్న వ్యక్తినే సూచించే ఏకవచన నిర్దేశాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν πνεύματι πραΰτητος
  choice: సాత్విక భావంతో
  rationale: మృదుత్వం, వినయం కలిగిన వైఖరిని సహజమైన తెలుగులో తెలియజేస్తుంది; πνεῦμα మానవ అంతరంగ వైఖరినా, దేవుని ఆత్మతో సంబంధమున్న భావమా అనే ప్రతిధ్వనిని పాదసూచికలో నిలిపాం.
- source_word: σκοπῶν σεαυτόν
  choice: నీ విషయంలో నీవు జాగ్రత్తగా ఉండు
  rationale: బహువచన సంబోధన నుంచి ఏకవచన వ్యక్తిగత హెచ్చరికకు గ్రీకు పాఠంలో వచ్చే మార్పును నిలుపుతూ, స్వీయ పర్యవేక్షణ భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: నీవు కూడా శోధనకు గురికాకుండా
  rationale: ప్రతికూల ఉద్దేశం/ఫలిత హెచ్చరికను, అలాగే పునరుద్ధరించే వ్యక్తికీ అదే బలహీనత ఉందనే καὶ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: οἱ πνευματικοὶ ఎవరిని సూచిస్తుంది
  choice: ‘ఆత్మసంబంధులైన మీరు’ అని విస్తృతంగానే ఉంచడం
  alternative: ‘పరిశుద్ధాత్మచేత నడిపించబడే మీరు’ లేదా ‘ఆధ్యాత్మికంగా పరిణతి చెందిన మీరు’
  rationale: ఈ విశేషణం ఆత్మచేత జీవించేవారినీ లేదా ఆధ్యాత్మిక పరిపక్వతగలవారినీ సూచించవచ్చు. ఒక భావానికే పరిమితం చేయకుండా మూలంలోని విస్తృతతను నిలిపాం.
- issue: ἐν πνεύματι πραΰτητος లో πνεῦμα భావం
  choice: ప్రధాన పాఠంలో ‘సాత్విక భావంతో’; పాదసూచికలో సాధ్యమైన ద్వంద్వ ప్రతిధ్వని
  alternative: ‘సాత్వికతగల ఆత్మతో’ లేదా ‘ఆత్మ కలిగించే సాత్వికతతో’
  rationale: ఇది వ్యక్తి అంతరంగ వైఖరిని నేరుగా సూచించవచ్చు; అదే సమయంలో గలతీయులు 5లో ఆత్మ ఫలమైన సాత్వికతను ప్రతిధ్వనింపజేయవచ్చు. దేవుని ఆత్మను నేరుగా ఉద్దేశించిందని నిర్ధారించలేదు.
- issue: πειρασθῇς యొక్క నైతిక భావం
  choice: ‘శోధనకు గురికాకుండా’
  alternative: ‘పరీక్షకు గురికాకుండా’
  rationale: అపరాధంలో పడే ప్రమాదం గురించిన సందర్భంలో ‘శోధన’ నైతిక ప్రలోభాన్ని బాగా తెలియజేస్తుంది; ‘పరీక్ష’ అనే సాధారణ అర్థం సాధ్యమైనప్పటికీ ఇక్కడ తక్కువ సంభావ్యమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సంఘంలో బహిరంగంగా చదవడానికి అనువైన శైలిని పాటించాం. ‘సోదరులారా,’ ‘అపరాధం,’ ‘శోధన’ వంటి పరిచిత బైబిలీయ పదాలను ఉంచినా, వాక్యనిర్మాణాన్ని సహజంగా చేశాం. చివరి భాగంలో గ్రీకు పాఠంలోని బహువచనం నుంచి ఏకవచనానికి మార్పును ఉద్దేశపూర్వకంగా నిలిపాం.
