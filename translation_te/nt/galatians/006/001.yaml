review_pass:
  verdict: revise
  source_fidelity: The draft conveys the conditional case, the moral failure, the call for spiritually characterized people to restore the person gently, and the warning of personal temptation. However, ‘అయితే’ (“however”) introduces a contrast not present in Greek. ‘తిరిగి సరిదిద్దండి’ can suggest merely correcting/rebuking someone rather than restoring that person to a proper condition, the central force of καταρτίζετε.
  naturalness: The Telugu is generally clear and suitable for public reading. Removing the unsupported connective also produces a smoother progression. ‘నిన్ను నీవు జాగ్రత్తగా గమనించుకో’ expresses σκοπῶν σεαυτόν more directly than ‘నీ విషయంలో నీవు జాగ్రత్తగా ఉండు.’
  terminology: ‘సోదరులారా,’ appropriately retains the masculine plural address, with a clarifying footnote. ‘ఆత్మసంబంధులైన,’ ‘అపరాధం,’ and ‘శోధనకు గురికాకుండా’ are acceptable modern-standard Telugu renderings. ‘సాత్విక భావంతో’ is a viable rendering of the gentleness disposition, while its possible Spirit-related resonance is appropriately retained in a note.
  issues:
  - severity: medium
    issue: The connective ‘అయితే’ is not represented in the Greek text.
    rationale: The source moves directly from the restoration command to the participial self-warning; it does not mark this as a contrast. The added connective subtly alters the discourse relation.
  - severity: medium
    issue: ‘తిరిగి సరిదిద్దండి’ does not fully convey καταρτίζετε.
    rationale: καταρτίζω means restore, mend, or set back into proper condition. ‘సరిదిద్దండి’ may focus on correcting a person's fault; ‘పునరుద్ధరించండి’ more clearly expresses restorative action.
  - severity: low
    issue: ‘నీ విషయంలో నీవు జాగ్రత్తగా ఉండు’ is less direct than the reflexive wording of σκοπῶν σεαυτόν.
    rationale: The Greek specifically calls the restorer to watch himself. ‘నిన్ను నీవు జాగ్రత్తగా గమనించుకో’ retains this self-directed warning naturally.
  revised_text: సోదరులారా[a], ఒక వ్యక్తి ఏదైనా అపరాధంలో చిక్కుకున్నా[b], ఆత్మసంబంధులైన మీరు అలాంటి వ్యక్తిని సాత్విక భావంతో[c] పునరుద్ధరించండి. నీవు కూడా శోధనకు గురికాకుండా నిన్ను నీవు జాగ్రత్తగా గమనించుకో.
  revised_footnotes:
  - marker: a
    text: ‘సోదరులారా’ అని అనువదించిన గ్రీకు పుంలింగ బహువచన సంబోధన, సందర్భానుసారంగా సోదరీమణులతో సహా తోటి విశ్వాసుల సమూహాన్ని ఉద్దేశించవచ్చు.
