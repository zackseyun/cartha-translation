id: 1CO.8.12
reference: 1 Corinthians 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: te
  text: ఈ విధంగా సహోదరులకు[a] విరోధంగా పాపం చేస్తూ, వారి బలహీనమైన మనస్సాక్షిని గాయపరుస్తూ, మీరు మెస్సీయకు[b] విరోధంగా పాపం చేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘సహోదరులు’ అంటే తోటి విశ్వాసులు; సందర్భంలో పురుషులతోపాటు స్త్రీలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘క్రీస్తుకు.’ గ్రీకు బిరుదు Χριστός.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: ఈ విధంగా
  rationale: οὕτως ముందున్న సందర్భంలో వివరించిన విధానాన్ని సూచిస్తుంది; δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక, వాక్యాన్ని ముందటి వాదనతో సున్నితంగా కలుపుతుంది. తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: సహోదరులకు విరోధంగా పాపం చేస్తూ
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియ జరిగే విధానాన్ని తెలియజేస్తుంది. ἁμαρτάνωతో వచ్చిన εἰς వ్యక్తులపై దిశించిన అపరాధ భావాన్ని కలిగిస్తుంది; అందువల్ల ‘విరోధంగా’ అని అనువదించబడింది.
- source_word: τύπτοντες
  choice: గాయపరుస్తూ
  rationale: τύπτω యొక్క అక్షరార్థం ‘కొట్టడం’; ఇక్కడ మనస్సాక్షికి సంబంధించిన రూపకాలంకార ప్రయోగం. ‘గాయపరుస్తూ’ ఆ బలమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: బలహీనమైన వారి మనస్సాక్షిని
  rationale: గ్రీకులో ఏకవచనమైన ‘మనస్సాక్షి’ బహువచన సమూహంలోని ప్రతి వ్యక్తికి పంపిణీ భావంతో వర్తిస్తుంది. తెలుగు ఏకవచనం మూలంలోని సంఖ్యను, సహజమైన అర్థాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: మీరు మెస్సీయకు విరోధంగా పాపం చేస్తున్నారు
  rationale: రెండవ εἰς కూడా పాపం ఎవరికి విరోధంగా జరుగుతుందో సూచిస్తుంది. వర్తమాన కాలాన్ని కొనసాగుతున్న చర్యగా తెలుగులో సహజంగా వ్యక్తం చేశాం; Χριστόςను బిరుదు భావంతో ‘మెస్సీయ’గా ఉంచాం.
theological_decisions:
- issue: సంఘ సందర్భంలో ἀδελφοὺς అర్థం
  choice: సహోదరులు
  alternative: తోటి విశ్వాసులు; సహోదర సహోదరీలు
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం; అయితే ఈ సందర్భంలో అది స్త్రీపురుషులైన తోటి విశ్వాసులందరినీ సూచించవచ్చు. ప్రధాన పాఠంలో మూల రూపానికి దగ్గరగా ఉండి, విస్తృత సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός అభిషిక్తుడైన ప్రభువును సూచించే బిరుదు భావాన్ని నిలుపుకుంటుంది. సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, అయితే పత్రికా శైలికి తగిన గౌరవప్రదమైన భాషలో అనువదించబడింది. ‘గాయపరుస్తూ’ అనే రూపకం మూలంలోని తీవ్రతను సహజంగా నిలుపుతుంది; ‘విరోధంగా’ అనే పదం రెండు εἰς ప్రయోగాల సమాంతరతను స్పష్టంగా ఉంచుతుంది.
