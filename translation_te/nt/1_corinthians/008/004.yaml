id: 1CO.8.4
reference: 1 Corinthians 8:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: te
  text: కాబట్టి, విగ్రహాలకు అర్పించిన ఆహారాన్ని తినడం విషయమై, లోకంలో విగ్రహం ఏమీ కాదనీ[a], ఒక్క దేవుడు తప్ప మరే దేవుడూ లేడనీ[b] మనకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోకంలో విగ్రహానికి నిజమైన ఉనికి లేదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒక్క దేవుడు తప్ప మరే దేవుడూ లేడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: తినడం
  rationale: ఈ నామవాచకం ఆహారాన్ని కాక తినే క్రియను సూచిస్తుంది; περὶ నిర్మాణంలో సహజమైన తెలుగుగా క్రియార్థాన్ని నిలుపుతుంది.
- source_word: εἰδωλοθύτων
  choice: విగ్రహాలకు అర్పించిన ఆహారం
  rationale: విగ్రహారాధన బలులతో సంబంధమున్న ఆహారాన్ని సూచిస్తుంది; కేవలం మాంసానికే పరిమితం చేయకుండా మూలపద విస్తృతిని కాపాడుతుంది.
- source_word: οἴδαμεν
  choice: మనకు తెలుసు
  rationale: వర్తమాన భావమున్న క్రియను, పౌలు తనకూ కొరింథీయులకూ ఉమ్మడిగా ఉన్న జ్ఞానాన్ని ప్రస్తావిస్తున్న రీతిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐδὲν εἴδωλον
  choice: విగ్రహం ఏమీ కాదు
  rationale: విగ్రహం యొక్క వాస్తవికతలేమి లేదా శూన్యతను తెలిపే గ్రీకు వాక్యపు సంక్షిప్త బలాన్ని నిలుపుతుంది.
- source_word: ἐν κόσμῳ
  choice: లోకంలో
  rationale: సృష్టిలోని వాస్తవ ప్రపంచ పరిధిని సహజమైన ఆధునిక తెలుగు పదంతో తెలియజేస్తుంది.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: ఒక్కడు తప్ప మరే దేవుడూ లేడు
  rationale: ఒకే దేవుడు ఉన్నాడనే ఏకదైవ ప్రకటనను స్పష్టంగా ఉంచుతూ, θεός పదాన్ని అనవసరంగా సిద్ధాంతపరంగా విస్తరించదు.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి చర్చనుంచి వచ్చే తార్కిక అన్వయాన్ని స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: విగ్రహాల శూన్యత మరియు దేవుని ఏకత్వం
  choice: విగ్రహం ఏమీ కాదనీ, ఒక్కడు తప్ప మరే దేవుడూ లేడనీ బలమైన ప్రకటనగా అనువదించడం
  alternative: విగ్రహానికి లోకంలో నిజమైన ఉనికి లేదనీ, ఒక్క దేవుడు తప్ప మరే దేవుడూ లేడనీ మరింత వివరణాత్మకంగా అనువదించడం
  rationale: మూలంలోని రెండు ప్రకటనల బలాన్ని నిలుపుతూ, విగ్రహం 'ఏమీ కాదు' అనే మాటలోని భావసంభావ్యతను పాదసూచికలో చూపిస్తుంది; తరువాతి సిద్ధాంత సూత్రీకరణలను వచనంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘విగ్రహం ఏమీ కాదు’ అనే సంక్షిప్త నిర్మాణం మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను నిలుపుతుంది; ‘ఆహారం’ అనేది పదాన్ని మాంసానికే పరిమితం చేయదు.
