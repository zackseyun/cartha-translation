  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: te
  text: 'విగ్రహాలకు బలిగా అర్పించిన ఆహారం[a] గురించి: మనందరికీ జ్ఞానం ఉందని మనకు తెలుసు.[b] జ్ఞానం గర్వంతో ఉబ్బిపోయేలా చేస్తుంది; ప్రేమ మాత్రం నిర్మిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విగ్రహాలకు అర్పించిన మాంసం,’ లేదా ‘విగ్రహాలకు బలిగా అర్పించినవి.’
    reason: lexical_alternative
  - marker: b
    text: ‘మనందరికీ జ్ఞానం ఉంది’ అనే మాటలో పౌలు కొరింథీయులు వాడిన ఒక నినాదాన్ని ప్రతిధ్వనింపజేస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: గురించి
  rationale: కొత్త అంశాన్ని పరిచయం చేసే పత్రికా-శైలి సంధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలో లేని కాలార్థకమైన ‘ఇప్పుడు’ను చేర్చదు.
- source_word: τῶν εἰδωλοθύτων
  choice: విగ్రహాలకు అర్పించిన ఆహారం
  rationale: విగ్రహారాధనలో అర్పించిన పదార్థాలను, ఈ సందర్భంలో ముఖ్యంగా ఆహారాన్ని సూచిస్తుంది. ‘మాంసం’ అని అనవసరంగా కుదించకుండా భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: οἴδαμεν
  choice: మనకు తెలుసు
  rationale: వర్తమాన భావంతో పనిచేసే గ్రీకు పరిపూర్ణ రూపాన్ని సహజంగా, నేరుగా అనువదిస్తుంది.
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: మనందరికీ జ్ఞానం ఉందని
  rationale: πάντες యొక్క సమూహార్థాన్ని నిలుపుతూ, ఈ మాట పౌలు మాటా లేక కొరింథీయుల వాదన ప్రతిధ్వనియా అన్న విషయాన్ని ప్రధాన పాఠ్యంలో తేల్చదు.
- source_word: ἡ γνῶσις
  choice: జ్ఞానం
  rationale: ముందటి γνῶσιν‌తో పదబంధ సంబంధాన్ని నిలుపుతుంది; సాధారణ భావంలోని భావవాచక నామవాచకంగా సహజంగా ఉంటుంది.
- source_word: φυσιοῖ
  choice: గర్వంతో ఉబ్బిపోయేలా చేస్తుంది
  rationale: ‘ఉబ్బించడం’ అనే పౌలు వాడిన సజీవ రూపకాన్ని నిలుపుతూ, తెలుగులో అది అహంకారాన్ని సూచిస్తోందని స్పష్టపరుస్తుంది.
- source_word: ἡ δὲ ἀγάπη
  choice: ప్రేమ మాత్రం
  rationale: δὲ సూచించే వ్యత్యాసాన్ని ‘మాత్రం’ సహజంగా వ్యక్తం చేస్తుంది; ἀγάπηకి సాధారణమైన, విస్తృతమైన ‘ప్రేమ’ను వాడుతుంది.
- source_word: οἰκοδομεῖ
  choice: నిర్మిస్తుంది
  rationale: వ్యక్తులను లేదా సమాజాన్ని కట్టడంలా అభివృద్ధి చేయడం అనే మూల రూపకాన్ని, వివరణాత్మక పదాలు జోడించకుండా నిలుపుతుంది.
theological_decisions:
- issue: πάντες (‘అందరూ’) అనే మాటను నిబంధనలేని సార్వత్రిక ప్రకటనగా తీసుకోవాలా, లేక కొరింథీయుల నినాదాన్ని పౌలు ప్రతిధ్వనింపజేస్తున్నాడా
  choice: ప్రధాన పాఠ్యంలో ‘మనందరికీ జ్ఞానం ఉంది’ అనే వాక్యాన్ని వ్యాఖ్యానాత్మక ఉద్ధరణ చిహ్నాలు లేకుండా ఉంచడం
  alternative: దీనిని కొరింథీయుల నినాదంగా ఉద్ధరణ చిహ్నాల్లో చూపించడం
  rationale: గ్రీకు పాఠ్యంలో స్పష్టమైన దూరీకరణ చిహ్నాలు లేవు. అందువల్ల వాక్యాన్ని యథాతథంగా ఉంచి, సాధ్యమైన నినాద ప్రతిధ్వనిని పాదటిప్పణిలో తెలియజేయడం అసలు పాఠ్యంలోని ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘గర్వంతో ఉబ్బిపోయేలా చేస్తుంది’ మరియు ‘నిర్మిస్తుంది’ అనే పదాలతో మూలంలోని పరస్పర విరుద్ధ రూపకాలను నిలుపుతూ, రెండవ రూపకానికి మూలంలో లేని కర్మను చేర్చలేదు.
