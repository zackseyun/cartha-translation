review_pass:
  verdict: revise
  source_fidelity: ‘విగ్రహాలకు అర్పించిన ఆహారం’ generally conveys the contextual referent, but it does not explicitly express the sacrificial/cultic force inherent in εἰδωλοθύτων. Adding ‘బలిగా’ safely preserves that element. The remaining clauses accurately retain the inclusive ‘we all,’ the knowledge/love contrast, and the two metaphors.
  naturalness: The Telugu is clear and modern. ‘గర్వంతో ఉబ్బిపోయేలా చేస్తుంది’ is understandable and preserves the image; ‘నిర్మిస్తుంది’ is slightly elliptical but acceptable in this compact metaphorical contrast, and it intentionally retains the building imagery.
  terminology: ‘జ్ఞానం’ and ‘ప్రేమ’ appropriately preserve the repeated Greek terms. ‘విగ్రహాలకు బలిగా అర్పించిన ఆహారం’ is more precise than the draft’s opening phrase while remaining natural in modern standard Telugu.
