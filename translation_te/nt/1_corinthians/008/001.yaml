  to: 'విగ్రహాలకు బలిగా అర్పించిన ఆహారం[a] గురించి: మనందరికీ జ్ఞానం ఉందని మనకు తెలుసు.[b] జ్ఞానం గర్వంతో ఉబ్బిపోయేలా చేస్తుంది; ప్రేమ మాత్రం నిర్మిస్తుంది.'
  rationale: The sole change adds ‘బలిగా’ to represent the sacrificial force of εἰδωλοθύτων. It retains ‘ఆహారం’ as the contextually appropriate broad referent, leaves the possible slogan reading in a footnote rather than resolving it in the text, and preserves Paul’s knowledge/building metaphors.
