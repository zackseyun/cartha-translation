id: 1CO.8.7
reference: 1 Corinthians 8:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: te
  text: అయితే ఈ జ్ఞానం అందరిలో లేదు. కొందరు విగ్రహంతో ఇప్పటివరకు ఉన్న తమ పరిచయం వల్ల[a][b], దానిని విగ్రహానికి అర్పించిన ఆహారంగా భావించి తింటారు. వారి మనస్సాక్షి బలహీనంగా ఉండి కలుషితమవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘విగ్రహంతో ఇప్పటివరకు ఉన్న పరిచయం/అలవాటు వల్ల.’ గ్రీకు పదబంధం అర్థనిర్ణయానికి కష్టమైనది; కొందరు విగ్రహారాధనతో తమకు ఉన్న పూర్వ సంబంధం ప్రభావంలో ఇంకా ఉన్నారని సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో ఇక్కడ ‘విగ్రహంతో ఉన్న పరిచయం’ స్థానంలో ‘విగ్రహం గురించిన మనస్సాక్షి’ అనే భావాన్నిచ్చే పాఠాంతరం ఉంది. ప్రధాన పాఠం SBLGNT పాఠాన్ని అనుసరిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: జ్ఞానం
  rationale: ముందటి సందర్భంలో విగ్రహం ఏమీ కాదని ‘తెలిసిన’ విషయంతో ఉన్న సంబంధాన్ని నిలుపుతుంది; పౌలు ఉపయోగించిన భావానికి సహజమైన తెలుగు సమానం.
- source_word: συνήθεια
  choice: అలవాటు సంబంధం
  rationale: కేవలం ఒక సాధారణ అలవాటు కాకుండా, విగ్రహంతో కొనసాగిన మునుపటి పరిచయం మరియు దాని ప్రభావం రెండింటినీ సూచించేందుకు ఈ పదబంధం ఎంచుకోబడింది.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: ఇప్పటివరకు విగ్రహంతో తమకున్న
  rationale: ἕως ἄρτι అనే కాలసూచనను స్పష్టంగా నిలుపుతూ, కష్టమైన గ్రీకు నిర్మాణాన్ని తెలుగులో అర్థమయ్యేలా συνήθεια అనే పదంతో కలిపి అనువదిస్తుంది.
- source_word: εἰδωλόθυτον
  choice: విగ్రహానికి అర్పించిన ఆహారం
  rationale: విగ్రహానికి బలిగా అర్పించడంతో సంబంధమున్న మాంసం లేదా ఆహారాన్ని సూచిస్తుంది; సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: συνείδησις
  choice: మనస్సాక్షి
  rationale: నైతిక అవగాహనను సూచించే పౌలు వాడుకకు ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: ἀσθενής
  choice: బలహీనంగా
  rationale: ఈ అధ్యాయంలో స్థిరత్వం లేదా దృఢత లేని మనస్సాక్షిని సూచించే పౌలు పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: μολύνεται
  choice: కలుషితమవుతుంది
  rationale: మనస్సాక్షి నైతికంగా అపవిత్రం కావడాన్ని తెలిపే కర్మణి భావాన్ని, తగిన నైతిక తీవ్రతతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: విగ్రహార్పిత ఆహారం యొక్క స్థితిని, విగ్రహాలు నిజమైన దేవుళ్లని సూచించకుండా ఎలా వ్యక్తం చేయాలి
  choice: దానిని విగ్రహానికి అర్పించిన ఆహారంగా భావించి తింటారు
  alternative: విగ్రహానికి అర్పించిన ఆహారాన్ని తింటారు
  rationale: ‘భావించి’ అనే పదం ఆ ఆహారానికి వారు ఆరాధనా ప్రాముఖ్యతను ఇంకా ఆపాదిస్తున్నారనే గ్రహింపును తెలియజేస్తుంది; విగ్రహం నిజమైన దేవుడని పౌలు అంగీకరించినట్టు చెప్పదు. అదే సమయంలో విగ్రహం ఏమీ కాదనే జ్ఞానానికి, మనస్సాక్షి గాయపడగలదనే హెచ్చరికకు మధ్య ఉన్న ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. కష్టమైన గ్రీకు నిర్మాణాన్ని పూర్తిగా సులభీకరించకుండా ‘ఇప్పటివరకు’ అనే కాలసూచనను నిలిపి, అవసరమైన వివరణను పాదసూచికలో ఇచ్చాం.
