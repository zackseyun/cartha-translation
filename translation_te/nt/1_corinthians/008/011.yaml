source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: te
  text: ఎందుకంటే, నీ జ్ఞానం వల్ల బలహీనుడైనవాడు నాశనమవుతున్నాడు[a]—మెస్సీయ ఎవరి కొరకు చనిపోయాడో ఆ సహోదరుడు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాడైపోతున్నాడు,’ ‘నశిస్తున్నాడు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం తీవ్రమైన పతనం లేదా నాశనాన్ని సూచించగలదు; ఇది ప్రస్తుత ఆత్మీయ విధ్వంసాన్నా, అంతిమ నాశనాన్నా, లేక రెండింటినీనా సూచిస్తుందో ఇక్కడ పూర్తిగా తేల్చబడలేదు.
    reason: alternative_reading
  - marker: b
    text: ‘సహోదరుడు’ అంటే ఇక్కడ తోటి విశ్వాసి; సందర్భానుసారంగా ఇది విశ్వాసంలోని సహోదరునికైనా సహోదరికైనా వర్తించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'గ్రీకు: ‘క్రీస్తు’; Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ అని అనువదించబడింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: నాశనమవుతున్నాడు
  rationale: వర్తమానకాల రూపం జరుగుతున్న లేదా ఫలితానికి దారితీస్తున్న తీవ్రమైన నాశనాన్ని సూచిస్తుంది. ఈ పదం తాత్కాలిక ఆత్మీయ పతనాన్నా, అంతిమ నాశనాన్నా, రెండింటినీనా సూచిస్తుందో వచనమే పూర్తిగా తేల్చదు; అందువల్ల ఆ తీవ్రతను, అస్పష్టతను నిలిపింది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి హెచ్చరికకు కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజమైన అనుసంధానం.
- source_word: ὁ ἀσθενῶν
  choice: బలహీనుడైనవాడు
  rationale: ‘బలహీనంగా ఉన్నవాడు’ అనే నామవాచకార్థక వర్తమాన కృదంత భావాన్ని, ఏకవచన దృష్టిని నిలుపుతుంది; ఇక్కడే ‘సహోదరుడు’ అనే పదాన్ని ముందుగా కలపదు.
- source_word: ἐν τῇ σῇ γνώσει
  choice: నీ జ్ఞానం వల్ల
  rationale: ἐν ఇక్కడ జ్ఞానం పనిచేసే సాధనాత్మక లేదా కారణ సంబంధాన్ని వ్యక్తం చేస్తుంది. ‘నీ జ్ఞానంలో’ కంటే ‘నీ జ్ఞానం వల్ల’ తెలుగులో భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: γνῶσις
  choice: జ్ఞానం
  rationale: ఈ అధ్యాయంలోని పౌలు పదప్రయోగాన్ని, జ్ఞానం ప్రేమ లేకుండా హాని చేస్తుందనే వ్యంగ్య ఉద్వేగాన్ని నిలుపుతుంది.
- source_word: ὁ ἀδελφός
  choice: ఆ సహోదరుడు
  rationale: గ్రీకు పుంలింగ ఏకవచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపింది. సందర్భంలో ఇది తోటి విశ్వాసిని సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
- source_word: δι’ ὃν
  choice: అతడు ... చనిపోయిన
  rationale: తెలుగు సంబంధ వాక్య నిర్మాణంలో ‘ఎవరి కోసం’ అనే ప్రయోజనార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని అభిషిక్తుడనే బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
- source_word: ἀπέθανεν
  choice: చనిపోయిన
  rationale: అయోరిస్టు సూచించే పూర్తయిన గత సంఘటనను తెలుగు సంబంధ వాక్యంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀπόλλυται నిజమైన విశ్వాసి యొక్క అంతిమ నిత్యనాశనాన్ని తప్పనిసరిగా సూచిస్తుందా
  choice: ప్రధాన పాఠ్యంలో ‘నాశనమవుతున్నాడు’ అని అనువదించి, దాని పరిధిని నిర్దిష్టంగా పరిమితం చేయలేదు.
  alternative: ‘పాడైపోతున్నాడు’ లేదా ‘నశిస్తున్నాడు’
  rationale: క్రియ తీవ్రమైన నాశనం లేదా పతనాన్ని సూచిస్తుంది; అయితే సందర్భం దానిని కేవలం తాత్కాలిక ఆత్మీయ హానికిగానీ, తప్పనిసరిగా అంతిమ నాశనానికిగానీ పరిమితం చేయదు. అనువాదం ఆ వేదాంత ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ἀδελφός ను ప్రధాన పాఠ్యంలో లింగతటస్థంగా చేయాలా
  choice: ‘సహోదరుడు’ అనే పుంలింగ ఏకవచనాన్ని నిలిపింది.
  alternative: ‘తోటి విశ్వాసి’ లేదా ‘సహోదరుడు లేదా సహోదరి’
  rationale: మూలంలోని వ్యాకరణ లింగం, ఏకవచనం ప్రధాన పాఠ్యంలో ప్రతిబింబించాయి; సందర్భానుసార విస్తృత అన్వయాన్ని పాదటిప్పణిలో తెలిపింది.
- issue: Χριστός ను ‘క్రీస్తు’గా లేదా ‘మెస్సీయ’గా అనువదించాలా
  choice: బిరుదు భావాన్ని చూపేందుకు ‘మెస్సీయ’ అని అనువదించింది.
  alternative: ‘క్రీస్తు’
  rationale: ఈ వాక్యంలో Χριστός వ్యక్తినామంలా కాక రక్షణకార్య ప్రాధాన్యమున్న బిరుదుగా పనిచేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘నీ’ అనే ఏకవచన సంబోధన σῇ యొక్క ఏకవచనాన్ని నిలుపుతుంది. డాష్ తరువాతి భాగం మొదటి వ్యక్తిని ‘సహోదరుడు’గా భావోద్వేగ బలంతో తిరిగి గుర్తిస్తుంది; అన్ని [a], [b], [c] సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
