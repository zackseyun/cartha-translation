id: 1CO.8.5
reference: 1 Corinthians 8:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: te
  text: ఎందుకంటే, ఆకాశంలోనైనా భూమిమీదనైనా ‘దేవుళ్లు’ అనబడేవారు[a] ఉన్నప్పటికీ—నిజానికి దేవుళ్లు అనేకులు, ప్రభువులు[b] అనేకులు ఉన్నారు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుళ్లు అని పిలువబడేవారు.” గ్రీకు పదానికి “పిలువబడేవారు” లేదా సందర్భానుసారం “‘దేవుళ్లు’ అనబడేవారు” అనే అర్థం రావచ్చు; రెండవ రూపం ఈ దైవాల విషయంలో పౌలు చూపే దూరాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “ప్రభువులు” అనే పదం, 6వ వచనంలో తరచుగా “ప్రభువు” అని అనువదించే అదే గ్రీకు పదానికి బహువచనం. ఇక్కడ అది ఒక్క నిజమైన ప్రభువును కాకుండా, ప్రజలు ఆ బిరుదుతో గుర్తించే అనేక సత్తలను లేదా అధికారాలను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; καί ఇచ్చే స్వల్ప ఉద్ఘాటన తరువాతి concessive నిర్మాణంలో ప్రతిఫలిస్తుంది.
- source_word: εἴπερ
  choice: ఉన్నప్పటికీ
  rationale: పౌలు వాదన నిమిత్తం అంగీకరిస్తున్న concessive భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది; ఇది వారి నిజమైన దైవత్వాన్ని నిర్ధారించదు.
- source_word: λεγόμενοι θεοὶ
  choice: ‘దేవుళ్లు’ అనబడేవారు
  rationale: λεγόμενοι designationను సూచిస్తుంది. ఉద్ధరణ చిహ్నాలతో కూడిన ‘అనబడేవారు’ వారి దైవత్వాన్ని పౌలు స్వయంగా అంగీకరిస్తున్నాడనే భావం రాకుండా, మూలంలోని దూరాన్ని నిలుపుతుంది.
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: ఆకాశంలోనైనా భూమిమీదనైనా
  rationale: రెండు రంగాలను సూచించే సమాంతర నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: ὥσπερ
  choice: నిజానికి
  rationale: మనుషులు దేవుళ్లుగా, ప్రభువులుగా గుర్తించే వారు అనేకులు ఉన్నారనే సందర్భోచిత అంగీకారాన్ని ధృవీకరణ భావంతో తెలియజేస్తుంది.
- source_word: θεοὶ πολλοὶ καὶ κύριοι πολλοί
  choice: దేవుళ్లు అనేకులు, ప్రభువులు అనేకులు
  rationale: మూలంలోని పునరుక్త సమాంతరతను నిలుపుతూ θεοί, κύριοι మధ్య పదభేదాన్ని కాపాడుతుంది.
- source_word: κύριοι
  choice: ప్రభువులు
  rationale: κύριος అనే పదంతో 6వ వచనానికి ఉన్న పదసంబంధాన్ని నిలుపుతుంది; ఇక్కడ బహువచనం ప్రజలు ఆ బిరుదుతో గుర్తించే అనేక శక్తులు లేదా సత్తలను సూచిస్తుంది.
theological_decisions:
- issue: అన్యదేవతల పట్ల పౌలు చూపే వాక్చాతుర్యపూర్వక దూరం
  choice: λεγόμενοι θεοὶ ను ఉద్ధరణ చిహ్నాలతో ‘దేవుళ్లు’ అనబడేవారు అని అనువదించడం
  alternative: దేవుళ్లు అని పిలువబడేవారు
  rationale: 4–6 వచనాల ఏకదేవవాద సందర్భంలో పౌలు వారి నిజమైన దైవత్వాన్ని అంగీకరించడం లేదు. అదే సమయంలో λεγόμενοι లోని designation భావాన్ని మించి వాక్యాన్ని కఠినంగా మార్చకుండా ఈ రూపం ఆ దూరాన్ని నిలుపుతుంది.
- issue: అనేక κύριοι మరియు 6వ వచనంలోని ఒక్క ప్రభువు మధ్య వ్యత్యాసం
  choice: κύριοι కు ‘ప్రభువులు’ అనే బహువచనాన్ని వాడడం
  alternative: యజమానులు
  rationale: ‘ప్రభువులు’ మూలపద సంబంధాన్ని నిలుపుతుంది. ఇవి ప్రజలు ఆ బిరుదుతో గుర్తించే సత్తలు లేదా అధికారాలు; 6వ వచనంలో ఒప్పుకోబడే ఒక్క ప్రభువుతో వీరిని సమానంగా చూడకూడదని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. వాక్యం తదుపరి వచనంలో పూర్తయ్యే నిర్మాణం కావడంతో చివర దీర్ఘవిరామ సూచిక ఉంచబడింది. ‘దేవుళ్లు’ చుట్టూ ఉద్ధరణ చిహ్నాలు పౌలు చూపే దూరాన్ని స్పష్టం చేస్తాయి; తెలుగు లిపిలో పెద్ద/చిన్న అక్షర భేదం లేకపోవడంతో ‘ప్రభువులు’ అనే బహువచనానికి సంబంధించిన తాత్త్విక భేదం పాదసూచికలో వివరించబడింది.
