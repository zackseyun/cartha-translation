revisions:
- from: అయితే ఆహారం మనలను దేవుని ఎదుట నిలబెట్టదు[a]. ఎందుకంటే తింటే మనకు అధికం కలగదు; తినకపోతే మనకు కొదువ కలగదు[b].
  to: అయితే ఆహారం మనలను దేవుని దగ్గరకు చేర్చదు[a]. ఎందుకంటే మనం తిన్నా మనకు అధికమేమీ ఉండదు; తినకపోయినా మనకు కొదువేమీ ఉండదు[b].
  rationale: The revision replaces an unnaturally literal expression with a Telugu idiom that conveys the contextual force of παραστήσει τῷ θεῷ while retaining the footnoted alternative. It also makes the conditional clauses more fluent and explicitly parallel, preserving the source contrast between abundance and lack.
