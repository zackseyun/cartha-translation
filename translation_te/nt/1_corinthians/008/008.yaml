id: 1CO.8.8
reference: 1 Corinthians 8:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: te
  text: అయితే ఆహారం మనలను దేవుని దగ్గరకు చేర్చదు[a]. ఎందుకంటే మనం తిన్నా మనకు అధికమేమీ ఉండదు; తినకపోయినా మనకు కొదువేమీ ఉండదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆహారం మనలను దేవునికి ఆమోదయోగ్యులుగా చేయదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మనం తిన్నా మన స్థితి మెరుగుపడదు; తినకపోయినా మన స్థితి దిగజారదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: ఆహారం
  rationale: ఇది మాంసం లేదా ఒక ప్రత్యేక భోజనం మాత్రమే కాకుండా సాధారణంగా తినే ఆహారాన్ని సూచించే విస్తృత పదం.
- source_word: παραστήσει
  choice: ఎదుట నిలబెట్టదు
  rationale: παρίστημι యొక్క ప్రాథమిక ‘ఎదుట ఉంచడం/నిలబెట్టడం’ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; దేవుని ఆమోదం పొందించడం అనే సందర్భార్థం సాధ్యమైనా దానినే ఏకైక భావంగా నిర్ణయించదు.
- source_word: τῷ θεῷ
  choice: దేవుని ఎదుట
  rationale: παραστήσειతో కలిపి దైవసన్నిధిలో ఉంచడం లేదా నిలబెట్టడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὔτε γὰρ ἐὰν φάγωμεν, περισσεύομεν
  choice: ఎందుకంటే తింటే మనకు అధికం కలగదు
  rationale: περισσεύωలోని అధికంగా ఉండడం లేదా ప్రయోజనం కలగడం అనే భావాన్ని, తదుపరి ‘కొదువ’తో ఉన్న వ్యతిరేక సమాంతరతను కాపాడుతూ అందిస్తుంది.
- source_word: οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα
  choice: తినకపోతే మనకు కొదువ కలగదు
  rationale: ὑστερέωలోని లోటు లేదా కొరత భావాన్ని స్పష్టంగా తెలిపి, ముందటి ‘అధికం’తో సహజమైన వ్యతిరేక జోడీని ఏర్పరుస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి ఆలోచనతో ఉన్న స్వల్ప వ్యత్యాసాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మొదటి వాక్యానికి తరువాతి రెండు వాక్యభాగాలు వివరణ ఇస్తున్న తార్కిక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: ఆహారం దేవుని ఎదుట వ్యక్తి స్థితిని ప్రభావితం చేస్తుందా, లేక కేవలం మతపరమైన ప్రయోజనం ఇవ్వదా?
  choice: ఆహారం స్వయంగా మనలను దేవుని ఎదుట నిలబెట్టదని అనువదించబడింది.
  alternative: ఆహారం మనలను దేవునికి ఆమోదయోగ్యులుగా చేయదు.
  rationale: ‘ఎదుట నిలబెట్టదు’ అనే రూపం మూలక్రియ చిత్రాన్ని కాపాడుతూ, ఆమోదం లేదా ఆధ్యాత్మిక స్థితి అనే సందర్భార్థాలకు అవకాశం ఇస్తుంది; ఏ ఒక్క సిద్ధాంతపరమైన వివరణనూ బలవంతంగా విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. మూలంలోని అధికం–కొదువ వ్యతిరేక సమాంతరతను నిలుపుతూ, παραστήσειలోని నిజమైన అర్థవిస్తృతిని పాదటిప్పణిలో చూపించాం.
