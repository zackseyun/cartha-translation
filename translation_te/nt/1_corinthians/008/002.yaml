id: 1CO.8.2
reference: 1 Corinthians 8:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀εἴ τις δοκεῖ ⸀ἐγνωκέναι τι, ⸀οὔπω ⸀ἔγνω καθὼς δεῖ γνῶναι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: te
  text: ఎవరైనా తనకు ఏదో తెలుసని అనుకుంటే,[a] తాను తెలుసుకోవలసిన విధంగా ఇంకా తెలుసుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఎవరైనా తాను ఏదైనా తెలుసుకున్నానని అనుకుంటే, తాను తెలుసుకోవలసిన విధంగా ఇంకా తెలుసుకోలేదు.”'
    reason: ἐγνωκέναι అనే పరిపూర్ణకాల రూపంలోని ‘తెలుసుకుని ఉన్నాడు/తెలుసుకున్నాడు’ అనే సాధనభావాన్ని, అలాగే τι ను ‘ఏదైనా’గా అనువదించే అవకాశాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: εἴ τις
  choice: ఎవరైనా ... అనుకుంటే
  rationale: షరతుతో కూడిన సాధారణ వ్యక్తి సూచనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δοκεῖ
  choice: అనుకుంటే
  rationale: ఇక్కడ బాహ్యంగా కనిపించడం కంటే వ్యక్తి తన జ్ఞానం గురించి చేసుకునే స్వీయ అంచనాను సూచిస్తుంది.
- source_word: ἐγνωκέναι τι
  choice: తనకు ఏదో తెలుసని
  rationale: పరిపూర్ణకాల క్రియ సూచించే జ్ఞానం సంపాదించి ఉన్నాననే భావాన్ని సహజ తెలుగు స్థితివాచక రూపంలో అందిస్తుంది; τι యొక్క అనిర్దిష్టతను ‘ఏదో’ నిలుపుతుంది.
- source_word: οὔπω ἔγνω
  choice: ఇంకా తెలుసుకోలేదు
  rationale: οὔπω లోని ‘ఇంకా కాదు’ అనే అసంపూర్ణ స్థితిని, ἔγνω యొక్క జ్ఞానార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: καθὼς δεῖ γνῶναι
  choice: తెలుసుకోవలసిన విధంగా
  rationale: καθὼς సూచించే విధానం లేదా ప్రమాణాన్ని, δεῖ లోని అవసరత/సముచితతను రెండింటినీ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సాధారణ ఏకవచన వ్యక్తి సూచన
  choice: ఎవరైనా ... తాను
  alternative: ఎవరైనా ... అతడు
  rationale: τις లింగనిరపేక్షమైన సాధారణ సూచన. ‘తాను’ ఏకవచన సంబంధాన్ని నిలుపుతూ పురుషులకు మాత్రమే పరిమితం చేయదు.
- issue: పౌలు చేస్తున్న విమర్శ స్వభావం
  choice: తెలుసుకోవలసిన విధంగా ఇంకా తెలుసుకోలేదు
  alternative: అసలు ఏమీ తెలియదు
  rationale: వాక్యం సమస్త మానవ జ్ఞానాన్ని నిరాకరించదు; తన జ్ఞానంపై అతిశయమైన నమ్మకాన్ని మందలిస్తూ, తెలుసుకునే విధానం లేదా ప్రమాణంలో లోపాన్ని చూపుతుంది.
- issue: γινώσκω రూపాల కాలభేదం
  choice: ప్రధాన పాఠ్యంలో సహజ తెలుగు జ్ఞానరూపాలు; పాదటిప్పణిలో ‘తెలుసుకున్నానని’ అనే సాధనభావం
  alternative: ప్రతి రూపాన్ని కఠినంగా కాలభేదంతో అనువదించడం
  rationale: గ్రీకు పరిపూర్ణకాల ἐγνωκέναι జ్ఞానం సంపాదించి ఉన్న స్థితిని సూచించగలదు. ప్రధాన పాఠ్యంలో సహజతను కాపాడి, నిజమైన భావవ్యత్యాసాన్ని పాదటిప్పణిలో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘తాను’ ద్వారా లింగనిరపేక్ష సాధారణ ఏకవచనం నిలుపబడింది. ప్రధాన పాఠ్యంలో జ్ఞానంపై అహంకారపూరిత స్వీయ అంచనా మరియు తగిన విధంగా తెలుసుకోవడం మధ్యనున్న ఉద్వేగం పరిష్కరించకుండా ఉంచబడింది.
