  source_fidelity: ‘అయితే ఎవరైనా దేవుణ్ణి ప్రేమిస్తే’ accurately retains the mild contrast and conditional force of εἰ δέ τις ἀγαπᾷ τὸν θεόν. ‘ఆ వ్యక్తి ఆయనకు తెలిసినవాడు’ appropriately renders the emphatic referent οὗτος and the perfect passive ἔγνωσται, while preserving the relational breadth of divine knowing without narrowing it to approval or salvation.
