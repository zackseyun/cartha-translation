  text: But if anyone loves God[a], this one is known by him.
translation:
  language: te
  text: అయితే ఎవరైనా దేవుణ్ణి ప్రేమిస్తే, ఆ వ్యక్తి ఆయనకు తెలిసినవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన చేత గుర్తించబడినవాడు,” లేదా “ఆయనకు తెలిసివున్నవాడు.” గ్రీకులోని పరిపూర్ణ కర్మణి రూపం, దేవునికి తెలిసిన స్థితి కొనసాగుతుండడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: అయితే … ప్రేమిస్తే
  rationale: εἰ యొక్క షరతును ‘-తే’ రూపం తెలియజేస్తుంది; δέ ముందున్న జ్ఞానం–ప్రేమ చర్చతో ఉన్న స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ సహజంగా నిలుపుతుంది.
- source_word: τις
  choice: ఎవరైనా
  rationale: నిర్దిష్టతలేని, అందరినీ వర్తింపజేసే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγαπᾷ
  choice: ప్రేమిస్తే
  rationale: ἀγαπάω వర్తమాన క్రియ యొక్క సూటి అర్థమైన ‘ప్రేమించు’ను షరతు వాక్య నిర్మాణానికి తగిన రూపంలో ఇచ్చింది.
- source_word: τὸν θεόν
  choice: దేవుణ్ణి
  rationale: కర్మగా ఉన్న θεόνను సహజమైన తెలుగు ద్వితీయా విభక్తితో అనువదించింది.
- source_word: οὗτος
  choice: ఆ వ్యక్తి
  rationale: ముందు చెప్పిన వ్యక్తినే ప్రత్యేకంగా సూచించే గ్రీకు నిర్దేశక సర్వనామ బలాన్ని, లింగనిరపేక్షంగా మరియు సహజంగా నిలుపుతుంది.
- source_word: ἔγνωσται
  choice: తెలిసినవాడు
  rationale: γινώσκω యొక్క పరిపూర్ణ కర్మణి రూపం సూచించే, గత చర్య ఫలితంగా కొనసాగుతున్న ‘తెలియబడిన స్థితి’ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπ’ αὐτοῦ
  choice: ఆయనకు
  rationale: కర్మణి భావాన్ని తెలుగు వాడుకలో సహజమైన ‘ఆయనకు తెలిసినవాడు’ నిర్మాణంతో తెలిపింది; ‘ఆయన’ వెంటనే ముందు ఉన్న దేవుణ్ణి సూచిస్తుంది.
theological_decisions:
- issue: దేవుడు తెలుసుకోవడం అనే మాటలోని భావం
  choice: ‘ఆయనకు తెలిసినవాడు’ అని విస్తృతంగా ఉంచడం
  alternative: ఆయన ఆమోదించినవాడు / ఆయన గుర్తించినవాడు / రక్షణ సంబంధంగా ఆయనకు తెలిసినవాడు
  rationale: ఇక్కడ γινώσκω కేవలం సమాచారపరమైన ఎరుకకన్నా సంబంధపూర్వక గుర్తింపు లేదా ఆమోదాన్ని సూచించవచ్చు; అయితే గ్రీకు వాక్యం వాటిలో ఒక్క భావాన్నే నిర్బంధించదు. కాబట్టి సిద్ధాంతపరంగా భావాన్ని కుదించకుండా మూలంలోని విస్తృతతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా గౌరవప్రదంగా ఉంచబడింది. ‘తెలిసినవాడు’లో వ్యాకరణపరమైన పుంలింగ రూపం ఉన్నప్పటికీ, ‘ఎవరైనా/ఆ వ్యక్తి’ సందర్భంలో అది సాధారణ వ్యక్తిని సూచిస్తుంది.
