  terminology: ‘దేవుణ్ణి ప్రేమిస్తే’ is direct and appropriate. ‘తెలిసినవాడు’ retains the broad semantic range of γινώσκω in this context. The footnote responsibly supplies ‘గుర్తించబడినవాడు’ and a perfect-aspect alternative without imposing a doctrinal interpretation.
