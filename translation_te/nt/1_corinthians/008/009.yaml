  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: te
  text: అయితే, మీకున్న ఈ హక్కు[a] బలహీనులకు[b] తడబడటానికి కారణమవుతుందేమోనని జాగ్రత్తపడండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీకున్న ఈ స్వేచ్ఛ.’ గ్రీకు పదానికి ‘అధికారం,’ ‘హక్కు,’ లేదా ‘స్వేచ్ఛ’ అనే అర్థాలు రావచ్చు; ఇక్కడ అది విగ్రహాలకు అర్పించిన ఆహారం తినే విషయంలో కొందరు విశ్వాసులు తమకు ఉందని చెప్పుకున్న స్వేచ్ఛను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘బలహీనులు’ అంటే ఈ విషయంలో మనస్సాక్షి బలహీనంగా ఉన్నవారు.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: జాగ్రత్తపడండి
  rationale: ఇది అప్రమత్తతను కోరే ఆజ్ఞారూపం. ఆధునిక తెలుగులో సహజంగా ఉండి హెచ్చరిక బలాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాదన నుంచి హెచ్చరిక వైపు వచ్చే స్వల్ప వ్యతిరేకతను లేదా మలుపును సూచిస్తుంది.
- source_word: μή πως
  choice: ఏ విధంగానూ ... మారకుండా
  rationale: సంభవించగల ప్రతికూల ఫలితాన్ని నివారించాలనే హెచ్చరికను సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: మీకున్న ఈ హక్కు
  rationale: ఈ సందర్భంలో విగ్రహాలకు అర్పించిన ఆహారం తినే విషయంలో కొందరు విశ్వాసులు తమకు ఉందని భావించిన స్వేచ్ఛ లేదా హక్కును సూచిస్తుంది; ‘అధికారం’ కంటే ‘హక్కు’ సందర్భానికి మరింత సహజం.
- source_word: πρόσκομμα
  choice: అడ్డంకి
  rationale: ఎవరైనా నైతికంగా లేదా ఆత్మీయంగా తడబడేలా చేసే దానిని సూచించే రూపక భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: γένηται
  choice: మారకుండా
  rationale: ప్రతికూల జాగ్రత్త వాక్య నిర్మాణంలో ‘కాకుండా/మారకుండా’ అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς ἀσθενέσιν
  choice: బలహీనులకు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తతను నిలుపుతుంది; ఈ అధ్యాయం సందర్భం ఇది మనస్సాక్షి విషయంలో బలహీనులైన వారిని సూచిస్తుందని తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో ἐξουσία అర్థం
  choice: విగ్రహాలకు అర్పించిన ఆహారం విషయంలో కొరింథీయులు తమకు ఉందని చెప్పుకున్న హక్కు లేదా స్వేచ్ఛ
  alternative: సాధారణమైన అధికారం లేదా శక్తి
  rationale: 1 కొరింథీయులు 8 అధ్యాయం తక్షణ సందర్భం ఆ ఆహారాన్ని తినే స్వేచ్ఛ గురించే. ‘హక్కు’ అనేది సంస్థాగత అధికార భావాన్ని చొప్పించకుండా ఆ నైతిక ప్రశ్నను తెలియజేస్తుంది.
- issue: τοῖς ἀσθενέσιν ఎవరిని సూచిస్తుంది
  choice: ఈ విషయంలో మనస్సాక్షి బలహీనంగా ఉన్న తోటి విశ్వాసులు
  alternative: సాధారణ అర్థంలో బలహీనులైన ప్రజలు
  rationale: ఈ అధ్యాయంలో ‘బలహీనులు’ అనే పదం సున్నితమైన మనస్సాక్షి ఉన్నవారిని సూచిస్తుంది. ప్రధాన వాక్యంలో సంక్షిప్తతను నిలిపి, పాదసూచికలో సందర్భార్థాన్ని వివరిస్తాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘హక్కు’ ప్రధాన పాఠ్యంలో సందర్భానుకూలంగా ఉంది; ‘స్వేచ్ఛ’ అనే నిజమైన పదార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది. ‘అడ్డంకి’ πρόσκομμα యొక్క తడబాటు కలిగించే రూపకాన్ని సహజ తెలుగులో అందిస్తుంది.
