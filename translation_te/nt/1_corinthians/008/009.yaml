revisions:
- from: అయితే, మీకున్న ఈ హక్కు బలహీనులకు ఏ విధంగానూ అడ్డంకిగా మారకుండా జాగ్రత్తపడండి.[a][b]
  to: అయితే, మీకున్న ఈ హక్కు[a] బలహీనులకు[b] తడబడటానికి కారణమవుతుందేమోనని జాగ్రత్తపడండి.
  rationale: The revision corrects the modal force of μή πως by expressing apprehension that the right may become a cause of stumbling. It also renders πρόσκομμα with a clear Telugu expression for causing someone to stumble, while retaining the draft’s sound contextual choice ‘హక్కు’ for ἐξουσία and preserving both footnotes with clearer anchors.
