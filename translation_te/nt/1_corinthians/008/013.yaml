id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: te
  text: కాబట్టి, ఆహారం నా సహోదరుణ్ణి తొట్రుపడేలా చేస్తే, నా సహోదరుణ్ణి తొట్రుపడేలా చేయకుండా ఉండడానికి నేను ఎన్నటికీ మాంసం తినను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: ఆహారం
  rationale: ఇది సాధారణంగా తినే పదార్థాన్ని సూచిస్తుంది; తరువాత వచ్చే κρέα అనే ప్రత్యేక పదం నుండి భేదాన్ని నిలుపుతుంది.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: పాపంలో పడటానికి కారణమైతే / కారణం కాకుండా
  rationale: ఈ సందర్భంలో ఇది కేవలం బాధపెట్టడం కాదు, తోటి విశ్వాసిని అతని మనస్సాక్షికి విరుద్ధంగా ప్రవర్తించి పాపంలో పడేలా చేయడాన్ని సూచిస్తుంది. రెండు రూపాల్లోనూ ఒకే భావాన్ని నిలిపాం.
- source_word: ἀδελφόν
  choice: సహోదరుడు
  rationale: విశ్వాస సమాజంలోని తోటి సభ్యుడిని సూచించే బంధుత్వ రూపకాన్ని నిలుపుతుంది.
- source_word: οὐ μὴ φάγω
  choice: నేను ... తినను
  rationale: οὐ μή బలమైన నిరాకరణ. తెలుగులో ‘ఎన్నటికీ’తో కలిసి దాని దృఢత్వం సహజంగా వ్యక్తమవుతుంది.
- source_word: κρέα
  choice: మాంసం
  rationale: జంతు మాంసాన్ని సూచించే సాధారణ, సహజ తెలుగు పదం.
- source_word: εἰς τὸν αἰῶνα
  choice: ఎన్నటికీ
  rationale: అక్షరార్థమైన ‘యుగం వరకు’ కంటే సందర్భంలోని శాశ్వత నిరాకరణను సహజంగా, దృఢంగా తెలియజేస్తుంది.
theological_decisions:
- issue: σκανδαλίζω యొక్క భావం
  choice: పాపంలో పడటానికి కారణమవడం
  alternative: తొట్రుపడేలా చేయడం / అభ్యంతరపడేలా చేయడం
  rationale: 1 కొరింథీయులు 8 సందర్భంలో బలహీన మనస్సాక్షిగల సహోదరుడు అపవిత్రమై పాపం చేయడం ప్రధాన భావం. ‘తొట్రుపడడం’ రూపకాన్ని నిలిపినా ఆధునిక పాఠకునికి ఉద్దేశం అస్పష్టంగా ఉండవచ్చు.
- issue: మాంసం తినననే ప్రతిజ్ఞ కాలవ్యాప్తి
  choice: ఎన్నటికీ మాంసం తినను
  alternative: ఇక ఎన్నడూ మాంసం తినను
  rationale: εἰς τὸν αἰῶνα మరియు οὐ μή కలయికలోని బలమైన, నిరవధిక నిరాకరణను నిలుపుతుంది; పౌలు తన స్వేచ్ఛను ప్రేమ నిమిత్తం పూర్తిగా విడిచిపెట్టే సిద్ధతను తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని కారణ–ఫలిత పునరుక్తిని సాధ్యమైనంతవరకు నిలిపాం.
