review_pass:
  verdict: revise
  source_fidelity: The draft accurately distinguishes βρῶμα (‘food’) from κρέα (‘meat’) and conveys the emphatic, enduring refusal of οὐ μὴ … εἰς τὸν αἰῶνα. However, rendering σκανδαλίζω in both occurrences as ‘cause to fall into sin’ makes explicit a consequence supplied by the wider context rather than stated in this verse. The Greek’s broader ‘cause to stumble’ wording should be retained.
  naturalness: The revised wording is natural modern standard Telugu, preserves the source’s repeated ‘brother’ and ‘stumble’ language, and follows the Greek clause progression clearly.
  terminology: ఆహారం and మాంసం appropriately preserve the lexical distinction. సహోదరుడు suitably retains the familial/community term without over-specifying it. తొట్రుపడేలా చేయడం is a clear, suitably broad rendering of σκανδαλίζω.
  issues:
  - severity: medium
    issue: σκανδαλίζω is rendered as ‘పాపంలో పడటానికి కారణమవడం.’
    rationale: In this context causing sin is a likely contextual implication, but the verse itself uses the broader stumbling expression. Explicitly inserting ‘sin’ narrows the Greek and removes its rhetorical ambiguity.
  revised_text: కాబట్టి, ఆహారం నా సహోదరుణ్ణి తొట్రుపడేలా చేస్తే, నా సహోదరుణ్ణి తొట్రుపడేలా చేయకుండా ఉండడానికి నేను ఎన్నటికీ మాంసం తినను.
  revised_footnotes: []
  revision_rationale: Replaced the interpretively narrowed ‘పాపంలో పడటానికి కారణమవడం’ with ‘తొట్రుపడేలా చేయడం’ to preserve the semantic breadth and repetition of σκανδαλίζω. The emphatic permanent abstention and the food/meat distinction remain intact.
