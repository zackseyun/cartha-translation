  source_fidelity: The draft accurately preserves the conditional argument, the contrast between the knowledgeable person and the weak observer, idol-sacrificed food, and the rhetorical question. However, “భోజనానికి కూర్చుని ఉండడం” weakens κατακείμενον, which specifically evokes reclining at a meal. The revision makes that dining posture explicit without requiring a historical excursus.
