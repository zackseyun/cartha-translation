id: 1CO.8.10
reference: 1 Corinthians 8:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: te
  text: ఎందుకంటే, జ్ఞానం ఉన్న నీవు విగ్రహాలయంలో భోజనం చేస్తూ ఆనుకొని ఉండడాన్ని బలహీనుడైన ఎవరైనా చూస్తే, విగ్రహాలకు బలి అర్పించిన ఆహారాన్ని తినేలా అతని మనస్సాక్షి కట్టబడదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధైర్యం తెచ్చుకోదా?” గ్రీకులో అక్షరార్థంగా “కట్టబడదా” అని ఉంది. పౌలు సాధారణంగా క్షేమాభివృద్ధిని సూచించడానికి వాడే భాషను ఇక్కడ బహుశా వ్యంగ్యంగా ఉపయోగిస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి హెచ్చరికకు కారణాన్ని లేదా వివరణాత్మక ఉదాహరణను జోడించే తార్కిక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: జ్ఞానం ఉన్న నీవు
  rationale: సంబోధించబడుతున్న వ్యక్తిని ‘జ్ఞానం’ కలవాడిగా గుర్తించే గ్రీకు నిర్మాణాన్ని సహజంగా తెలుపుతూ, ఈ అధ్యాయమంతటా ఉన్న ‘జ్ఞానం’ అనే ముఖ్య పదాన్ని నిలుపుతుంది.
- source_word: ἐν εἰδωλείῳ
  choice: విగ్రహాలయంలో
  rationale: విగ్రహారాధనకు సంబంధించిన ఆలయం అనే ఆరాధనా స్థల భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατακείμενον
  choice: భోజనానికి కూర్చుని ఉండడం
  rationale: ప్రాచీన భోజన పద్ధతిలో బల్ల దగ్గర ఆనుకొని పడుకోవడాన్ని సూచించే క్రియను, ఆధునిక తెలుగు పాఠకునికి సహజంగా అర్థమయ్యే భోజన సందర్భంతో అందిస్తుంది.
- source_word: ἀσθενοῦς ὄντος
  choice: బలహీనుడైన
  rationale: చూసే వ్యక్తి ఆత్మసంబంధంగా లేదా మనస్సాక్షి విషయంలో బలహీన స్థితిలో ఉన్నాడనే participial భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: οἰκοδομηθήσεται
  choice: కట్టబడదా
  rationale: అక్షరార్థమైన నిర్మాణ రూపకాన్ని, పౌలు సాధారణంగా ఉపయోగించే క్షేమాభివృద్ధి భాషతో ఉన్న వ్యంగ్య ఉద్వేగాన్ని నిలుపుతుంది; సందర్భానుసార భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: విగ్రహాలకు బలి అర్పించిన ఆహారాన్ని తినేలా
  rationale: ఈ నిర్మాణంలోని ఫలితం లేదా దిశ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, ఆ ఆహారం విగ్రహాలకు బలిగా అర్పించబడిందని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: హానికరమైన అనుకరణ సందర్భంలో οἰκοδομηθήσεται పదాన్ని అనువదించడం
  choice: కట్టబడదా
  alternative: ధైర్యం తెచ్చుకోదా / ప్రేరేపించబడదా
  rationale: సందర్భంలో ఈ క్రియ బలహీన మనస్సాక్షి తప్పు కార్యానికి ధైర్యపడటాన్ని సూచించినా, గ్రీకులో పౌలు సాధారణంగా క్షేమాభివృద్ధికి వాడే ‘కట్టడం’ అనే పదమే ఉంది. దానిని పాఠ్యంలో నిలిపి, సందర్భానుసార అర్థాన్ని పాదటిప్పణిలో ఇవ్వడం ద్వారా వ్యంగ్యాన్ని లేదా ధార్మిక ఉద్వేగాన్ని ముందుగానే పరిష్కరించకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘కట్టబడదా’ సందర్భంలో ఉద్దేశపూర్వకంగా కొంత అసాధారణంగా వినిపిస్తుంది; ఇది మూలంలోని నిర్మాణ రూపకాన్నీ వ్యంగ్యాన్నీ నిలుపుతుంది, పాదటిప్పణి దాని సహజ సందర్భార్థాన్ని తెలియజేస్తుంది.
