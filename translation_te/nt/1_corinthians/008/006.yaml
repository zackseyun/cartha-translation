source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: te
  text: అయితే మనకు ఒక్కడే దేవుడు—తండ్రి; సమస్తమూ ఆయన నుంచే, మనం ఆయన కోసమే ఉన్నాం.[a] మరియు ఒక్కడే ప్రభువు—యేసు మెస్సీయ[b]; సమస్తమూ ఆయన ద్వారానే, మనమూ ఆయన ద్వారానే ఉన్నాం.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం ఆయన వైపుకే ఉన్నాం.” ఇక్కడి గ్రీకు పదబంధం దిశను, గమ్యాన్ని లేదా ఉద్దేశాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యేసు క్రీస్తు.” గ్రీకు Χριστός బిరుదుగానూ, కొన్ని సందర్భాల్లో పేరులాంటి రూపంగానూ వాడబడుతుంది.
    reason: alternative_reading
  - marker: c
    text: “సమస్తమూ ఆయన నుంచే” మరియు “సమస్తమూ ఆయన ద్వారానే” అనే జత పదబంధాలు తండ్రిని మూలంగా, యేసు మెస్సీయను మధ్యవర్తిగా చూపే భేదాన్ని నిలుపుతున్నాయి.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: అయినా
  rationale: ముందటి వచనాల్లో చెప్పిన ‘దేవుళ్లు,’ ‘ప్రభువులు’ అనే పేర్లకు విరుద్ధంగా విశ్వాసుల ఒప్పుకోలును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἡμῖν
  choice: మనకు
  rationale: ఇది సంబంధార్థక చతుర్థీ విభక్తి; పౌలు మాట్లాడుతున్న సమూహపు దృష్టికోణాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: εἷς θεὸς ὁ πατήρ
  choice: ఒక్కడే దేవుడు—తండ్రి
  rationale: ఏకత్వ ప్రకటనను, ‘తండ్రి’ అనే నిర్దిష్ట గుర్తింపును నిలుపుతుంది.
- source_word: ἐξ οὗ τὰ πάντα
  choice: సమస్తమూ ఆయన నుంచే కలిగాయి
  rationale: ἐξ మూలాన్ని సూచిస్తుంది. తెలుగు వాక్యం సహజంగా ఉండేందుకు గ్రీకులో అధ్యాహారంగా ఉన్న ఉనికి/కలుగుట భావాన్ని ‘కలిగాయి’ అని వ్యక్తం చేసింది.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: మనం ఆయన కోసమే ఉన్నాం
  rationale: εἰς‌లోని దిశ, గమ్యం, ఉద్దేశం అనే భావాల్లో దేవుడే మన ఉనికి యొక్క గమ్యం అనే భావాన్ని సహజంగా అందిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: καὶ εἷς κύριος
  choice: అలాగే ఒక్కడే ప్రభువు
  rationale: ‘ఒక్కడే దేవుడు’ అనే సమాంతర నిర్మాణాన్ని నిలుపుతూ κύριος యొక్క బలమైన బిరుదార్థాన్ని ‘ప్రభువు’గా అందిస్తుంది.
- source_word: Ἰησοῦς Χριστός
  choice: యేసు మెస్సీయ
  rationale: ఇక్కడ Χριστός ఒప్పుకోలు రూపంలోని బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించింది; ‘క్రీస్తు’ అనే పేరులాంటి రూపం కూడా సాధ్యమే.
- source_word: δι’ οὗ τὰ πάντα
  choice: సమస్తమూ ఆయన ద్వారానే కలిగాయి
  rationale: διά + షష్ఠీ విభక్తి మధ్యవర్తిత్వం లేదా సాధనత్వాన్ని సూచిస్తుంది; ‘ద్వారా’ ఆ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: మనం కూడా ఆయన ద్వారానే ఉన్నాం
  rationale: గ్రీకులోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలుపుతూ, మన ఉనికి లేదా జీవితం ఆయన ద్వారా అనే భావాన్ని ‘ఉన్నాం’తో వ్యక్తం చేస్తుంది; రక్షణ వంటి మరింత నిర్దిష్ట భావాన్ని చేర్చదు.
theological_decisions:
- issue: ‘ఒక్కడే దేవుడు’ మరియు ‘ఒక్కడే ప్రభువు’ మధ్య సంబంధం
  choice: ‘ఒక్కడే దేవుడు—తండ్రి ... అలాగే ఒక్కడే ప్రభువు—యేసు మెస్సీయ’ అనే సమాంతర ఒప్పుకోలును యథాతథంగా నిలిపింది.
  alternative: ‘ప్రభువు’ అనే పదబలాన్ని తగ్గించడం, లేదా తరువాతి త్రిత్వ పరిభాషను వచనంలోనే స్పష్టంగా చేర్చడం.
  rationale: గ్రీకు పాఠం తండ్రిని, యేసు మెస్సీయను వేరుగా గుర్తిస్తూ కూడా ఇద్దరినీ ఏకదైవ ఒప్పుకోలు నిర్మాణంలో ఉంచుతుంది. అనువాదం ఈ ఉద్రిక్తతను తగ్గించదు, అదనపు సిద్ధాంత పదజాలంతో పరిష్కరించదు.
- issue: తండ్రి మరియు కుమారునికి సంబంధించిన పూర్వప్రత్యయ భేదాలు
  choice: ἐξ‌ను ‘నుంచి,’ εἰς‌ను ‘కోసం,’ διάను ‘ద్వారా’గా వేరు చేసింది.
  alternative: εἰς‌ను ‘వైపు/ఆయనకు’గా, διάను ‘వలన’గా అనువదించడం.
  rationale: తండ్రిని సమస్తానికి మూలం మరియు మన గమ్యంగా, యేసు మెస్సీయను సమస్తం మరియు మన ఉనికికి మధ్యవర్తిగా చూపే సంబంధ భేదాలను ఈ ఎంపికలు కాపాడుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ఒప్పుకోలు రూపంలోని గంభీరతను నిలుపుతూ రూపొందించబడింది. సమాంతర నిర్మాణాన్ని స్పష్టపరచడానికి విరామచిహ్నాలు వాడబడ్డాయి; గ్రీకు అధ్యాహార క్రియను తెలుగులో సహజత్వం కోసం ‘కలిగాయి/ఉన్నాం’గా వ్యక్తం చేసింది.
