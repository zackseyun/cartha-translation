- from: అయినా మనకు ఒక్కడే దేవుడు—తండ్రి. సమస్తమూ ఆయన నుంచే కలిగాయి; మనం ఆయన కోసమే ఉన్నాం.[a] అలాగే ఒక్కడే ప్రభువు—యేసు మెస్సీయ. సమస్తమూ ఆయన ద్వారానే కలిగాయి; మనం కూడా ఆయన ద్వారానే ఉన్నాం.[b]
