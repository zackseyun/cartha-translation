id: 1CO.11.13
reference: 1 Corinthians 11:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ὑμῖν αὐτοῖς κρίνατε· πρέπον ἐστὶν γυναῖκα ἀκατακάλυπτον τῷ θεῷ προσεύχεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: te
  text: 'మీ అంతట మీరే నిర్ణయించండి: ఒక స్త్రీ తల కప్పుకోకుండా దేవునికి ప్రార్థించడం తగినదేనా?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ భాగంలోని విస్తృత సందర్భంలో γυνή అనే పదాన్ని వైవాహిక అర్థంలో తీసుకుంటే, ‘ఒక భార్య’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: మీలో మీరే
  rationale: కొరింథీయులు తమంతట తామే ఆలోచించి నిర్ణయించాలనే భావాన్ని సహజమైన తెలుగులో బలంగా వ్యక్తపరుస్తుంది.
- source_word: κρίνατε
  choice: తీర్పు చెప్పండి
  rationale: ఇది నేరుగా మూల్యాంకనం చేయమని కోరే ఆజ్ఞ; ‘తీర్పు చెప్పండి’ దాని ప్రత్యక్ష బలాన్ని నిలుపుతుంది.
- source_word: πρέπον ἐστὶν
  choice: తగినదేనా
  rationale: సామాజికంగా లేదా నైతికంగా సముచితమైనదా అనే ప్రశ్నను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: γυναῖκα
  choice: ఒక స్త్రీ
  rationale: γυνή అంటే ‘స్త్రీ’ లేదా ‘భార్య’ కావచ్చు. ఈ వాక్యంలో భర్తను స్పష్టంగా ప్రస్తావించక సాధారణ ప్రశ్నగా ఉంచినందున ‘స్త్రీ’ని ప్రధాన పాఠంలో ఎంచుకున్నాం; వైవాహిక అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: ἀκατακάλυπτον
  choice: తల కప్పుకోకుండా
  rationale: పదానికి ‘కప్పబడని’ అని అర్థం; సమీప సందర్భం తల కప్పుకోవడం గురించి కాబట్టి సూచితమైన ‘తల’ను స్పష్టం చేయడం తెలుగులో సహజం.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: προσεύχομαιతో వచ్చిన దత్తివిభక్తి ప్రార్థన ఎవరిని ఉద్దేశించిందో సూచిస్తుంది; తెలుగులో ‘దేవునికి’ నేరమైన సమానార్థకం.
- source_word: προσεύχεσθαι
  choice: ప్రార్థించడం
  rationale: ‘ప్రార్థించుట’ అనే సాధారణ అర్థాన్ని సహజమైన ఆధునిక తెలుగు క్రియానామ రూపంలో అందిస్తుంది.
theological_decisions:
- issue: తల కప్పుకోవడం గురించిన చర్చలో γυνή అర్థం
  choice: ఒక స్త్రీ
  alternative: ఒక భార్య
  rationale: ఈ వచనం భర్తను స్పష్టంగా ప్రస్తావించదు; ప్రార్థనలో స్త్రీకి తగిన ప్రవర్తన గురించి ప్రశ్నను సాధారణ రూపంలో ఉంచుతుంది. కాబట్టి ప్రధాన పాఠంలో విస్తృతమైన అర్థాన్ని ఉంచి, సందర్భపరంగా సాధ్యమైన వైవాహిక అర్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని అలంకారిక ప్రశ్నను, నేరమైన ఆజ్ఞను నిలిపింది.
