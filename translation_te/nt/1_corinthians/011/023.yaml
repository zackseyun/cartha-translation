id: 1CO.11.23
reference: 1 Corinthians 11:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: te
  text: 'ఎందుకంటే, నేను ప్రభువు నుండి పొందినదాన్నే మీకూ అందించాను: ప్రభువైన యేసు ఆయన అప్పగించబడుతున్న ఆ రాత్రి[a] రొట్టె తీసుకున్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సంప్రదాయ అనువాదం: “ఆయన ద్రోహానికి గురైన రాత్రి.”'
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβον
  choice: పొందాను
  rationale: ప్రభువు నుండి పౌలు స్వీకరించిన బోధ లేదా సంప్రదాయాన్ని సూచిస్తుంది; παρέδωκαతో ఉన్న స్వీకరించడం–అందించడం సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀπὸ τοῦ κυρίου
  choice: ప్రభువు నుండి
  rationale: మూలాన్ని సూచించే గ్రీకు పదబంధాన్ని విస్తరించకుండా అనువదిస్తుంది; వెంటనే వచ్చే వాక్యం ప్రభువును యేసుగా గుర్తిస్తుంది.
- source_word: παρέδωκα
  choice: అందించాను
  rationale: పౌలు తాను పొందినదాన్ని కొరింథీయులకు చేరవేశాడనే సంప్రదాయ ప్రసార భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ఇదే వచనంలోని παρεδίδετοకు వేరైన తెలుగు రూపాన్ని వాడటం ద్వారా రెండు సందర్భాల భేదాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ὅτι
  choice: అని సూచించే ద్విబిందువు
  rationale: పౌలు అందించిన విషయాన్ని తరువాతి వాక్యం వివరిస్తుంది; తెలుగులో ద్విబిందువు ఈ విషయపూరక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ κύριος Ἰησοῦς
  choice: ప్రభువైన యేసు
  rationale: κύριος యొక్క గౌరవార్థక, క్రీస్తుసంబంధ బలాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజమైన నిర్మాణాన్ని ఇస్తుంది.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: రాత్రి
  rationale: సంబంధవాచక కాల నిర్మాణాన్ని తరువాతి క్రియావిశేషణ ఉపవాక్యంతో కలిపి సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παρεδίδετο
  choice: తాను అప్పగించబడుతున్న
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపంలోని కొనసాగుతున్న చర్యను, అలాగే ‘అప్పగించడం/ద్రోహం చేయడం’ అనే విస్తృత అర్థసంభావ్యతను నిలుపుతుంది.
- source_word: ἔλαβεν ἄρτον
  choice: రొట్టె తీసుకున్నాడు
  rationale: గ్రీకు క్రియ–కర్మ నిర్మాణాన్ని స్పష్టమైన, ఆరాధనా సందర్భంలో సుపరిచితమైన తెలుగులో అందిస్తుంది; ἄρτονకు అనవసరంగా ‘ఒక’ లేదా ‘రొట్టె ముద్ద’ చేర్చదు.
theological_decisions:
- issue: భోజన స్థాపన వర్ణనలో παρεδίδετο అనువాదం
  choice: తాను అప్పగించబడుతున్న
  alternative: తాను ద్రోహానికి గురైన
  rationale: παραδίδωμι సందర్భానుసారంగా అప్పగించడం, అధికారులకు అందించడం, లేదా ద్రోహం చేయడం అని అర్థమవుతుంది. ప్రధాన పాఠంలో విస్తృతమైన ‘అప్పగించబడుతున్న’ను ఉంచడం మానవ ద్రోహంతో పాటు యేసు అప్పగించబడిన శ్రమసందర్భపు విస్తృత భావాన్ని నిలుపుతుంది; సంప్రదాయ ‘ద్రోహం’ అర్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం. παρέλαβον/παρέδωκα మధ్య భావసంబంధాన్ని ‘పొందాను/అందించాను’తో చూపించి, అదే సమయంలో παρεδίδετο యొక్క శ్రమకథా భావాన్ని ‘అప్పగించబడుతున్న’గా వేరుచేశారు. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
