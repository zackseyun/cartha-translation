  source_fidelity: The draft accurately renders δεῖ as strong but unexplained necessity, αἱρέσεις as internal communal factions, the repeated ἐν ὑμῖν as “మీ మధ్య,” and δόκιμοι as persons proven through testing. “తద్వారా” appropriately preserves the purpose/result breadth of ἵνα without assigning a cause for the necessity.
