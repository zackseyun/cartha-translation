id: 1CO.11.19
reference: 1 Corinthians 11:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: te
  text: ఎందుకంటే, మీ మధ్య వర్గాలు కూడా ఉండవలసిందే[a]; తద్వారా మీ మధ్య పరీక్షకు నిలిచినవారు కూడా స్పష్టమవుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వర్గాలు’ అనే పదాన్ని ‘విభేదాలు,’ ‘పక్షాలు,’ లేదా ‘శాఖలు’ అని కూడా అనువదించవచ్చు; తరువాతి వాడుకలో దీనికి ‘మతవిరోధ బోధలు’ అనే అర్థం వచ్చింది. ఇక్కడ ఇది సంఘంలోని వర్గాలను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: ‘పరీక్షకు నిలిచినవారు’ అనే మాటను ‘ఆమోదం పొందినవారు’ లేదా ‘నిజమైనవారిగా తేలినవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: ఉండవలసిందే
  rationale: ఇది బలమైన ఆవశ్యకతను తెలియజేస్తుంది; అయితే ఆ ఆవశ్యకత దైవ సంకల్పమా, పరిస్థితులవల్ల అనివార్యమైనదా అనే విషయాన్ని అనువాదం నిర్ణయించదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఈ వచనం ఇచ్చే వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది.
- source_word: καὶ αἱρέσεις
  choice: వర్గాలు కూడా
  rationale: ఈ సందర్భంలో αἱρέσεις అనేది సంఘం లోపల ఏర్పడే పక్షాలు లేదా వర్గాలను సూచిస్తుంది; తరువాతి కాలంలో వచ్చిన సిద్ధాంతపరమైన ‘మతవిరోధ బోధలు’ అనే అర్థాన్ని ఇక్కడికి దిగుమతి చేయదు.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: సమాజం లేదా సంఘం అంతర్గతంగా ఉన్న పరిస్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది; గ్రీకులోని రెండు సందర్భాల పునరుక్తిని నిలుపుతుంది.
- source_word: ἵνα
  choice: తద్వారా
  rationale: ఉద్దేశం లేదా ఫలితం అనే రెండు సంభావ్య ఛాయలను కఠినంగా విడదీయకుండా ఉంచుతుంది.
- source_word: καὶ οἱ δόκιμοι
  choice: పరీక్షకు నిలిచినవారు కూడా
  rationale: δόκιμοι అనే పదంలోని పరీక్షింపబడి నిజమైనవారిగా లేదా యోగ్యులుగా తేలినవారు అనే భావాన్ని వ్యక్తం చేస్తుంది; καί యొక్క ‘కూడా’ అనే బలాన్ని నిలుపుతుంది.
- source_word: φανεροὶ γένωνται
  choice: ఎవరో కూడా స్పష్టమవుతుంది
  rationale: మునుపు స్పష్టంగా తెలియనిది బహిర్గతమై గుర్తించబడే ప్రక్రియను సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: αἱρέσεις పదానికి అనువాదం
  choice: వర్గాలు
  alternative: విభేదాలు; పక్షాలు; శాఖలు; తరువాతి వాడుకలో మతవిరోధ బోధలు
  rationale: తక్షణ సందర్భం ప్రభుభోజన సమయంలో కొరింథు సంఘంలో కనిపించిన సామాజిక, సామూహిక చీలికలను గురించి చెబుతోంది. ‘వర్గాలు’ అనే పదం తరువాతి సిద్ధాంతపరమైన ‘heresy’ భావాన్ని అనవసరంగా చేర్చదు.
- issue: δεῖ అనే ఆవశ్యకత యొక్క స్వభావం
  choice: ఉండవలసిందే అని బలంగా ఉంచడం, కానీ దాని మూలాన్ని నిర్దిష్టం చేయకపోవడం
  alternative: దైవిక ఆవశ్యకత; ఆచరణాత్మక అనివార్యత
  rationale: మూలపాఠం ఆవశ్యకతను చెబుతుంది గాని అది దేవుని సంకల్పం వల్లనా, మానవ సమాజాల్లోని పరిస్థితుల వల్ల అనివార్యమా, లేక రెండింటి సంబంధమా అని వివరించదు. ఆ ఉద్రిక్తతను అలాగే ఉంచాం.
- issue: ἵνα యొక్క ఉద్దేశం/ఫలితం సంబంధం
  choice: తద్వారా
  alternative: అందుకోసం; దాని ఫలితంగా
  rationale: వర్గాలు దేవునిచేత నేరుగా ఉద్దేశించబడ్డాయని గానీ, అవి కేవలం యాదృచ్ఛిక ఫలితాన్నే కలిగిస్తాయని గానీ అనువాదం ముందుగానే తీర్మానించకుండా, గ్రీకు నిర్మాణంలోని ఉద్దేశం-ఫలితం మధ్య భావవిస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘ఉండవలసిందే’ మూలంలోని బలాన్ని నిలుపుతుంది; ‘తద్వారా’ ఉద్దేశం మరియు ఫలితం మధ్య ఉన్న అర్థసంభావ్యతను తెరిచి ఉంచుతుంది. రెండు పాదాల్లోనూ ‘మీ మధ్య’ అని ఉంచి మూలపాఠంలోని అలంకారాత్మక పునరుక్తిని కాపాడాం.
