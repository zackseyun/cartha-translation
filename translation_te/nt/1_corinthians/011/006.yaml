id: 1CO.11.6
reference: 1 Corinthians 11:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: te
  text: ఎందుకంటే, ఒక స్త్రీ తన తలను కప్పుకోకపోతే[a], ఆమె తన జుట్టును కూడా కత్తిరించుకోవాలి; కానీ స్త్రీకి జుట్టును కత్తిరించుకోవడం గానీ, తలను గొరిగించుకోవడం గానీ అవమానకరమైతే, ఆమె తన తలను కప్పుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భార్య’; గ్రీకు పదమైన γυνή సందర్భాన్ని బట్టి ‘స్త్రీ’ లేదా ‘భార్య’ అని అర్థమివ్వగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: తన తలను కప్పుకోకపోతే / తన తలను కప్పుకోవాలి
  rationale: క్రియకు ‘కప్పుకోవడం’ లేదా ‘ముసుగు వేసుకోవడం’ అనే భావం ఉంది. సందర్భం తల కప్పుకోవడం గురించి కావడంతో, గ్రీకులో సూచితంగా ఉన్న ‘తలను’ తెలుగులో స్పష్టంగా చేర్చడం సహజంగా ఉంటుంది; ఏ ప్రత్యేక వస్త్రాన్నీ నిర్దేశించదు.
- source_word: γυνή
  choice: స్త్రీ
  rationale: γυνή అనే పదానికి సందర్భాన్ని బట్టి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థం రావచ్చు. ఈ వాక్యం భర్తను స్పష్టంగా ప్రస్తావించకుండా సాధారణంగా చెప్పబడినందున ‘స్త్రీ’ తక్కువ పరిమితిగల అనువాదం.
- source_word: κειράσθω / τὸ κείρασθαι
  choice: తన జుట్టును కత్తిరించుకోవాలి / జుట్టును కత్తిరించుకోవడం
  rationale: ఈ పదం జుట్టును చిన్నగా కత్తిరించడం లేదా కత్తిరింపజేసుకోవడాన్ని సూచిస్తుంది. తరువాత వచ్చే ‘గొరిగించుకోవడం’తో ఉన్న తేడాను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే విధంగా అనువదించబడింది.
- source_word: ξυρᾶσθαι
  choice: తలను గొరిగించుకోవడం
  rationale: ఈ క్రియ గొరుగుటను సూచిస్తుంది. తెలుగులో కేవలం ‘గొరిగించుకోవడం’ కంటే ‘తలను గొరిగించుకోవడం’ సందర్భాన్ని స్పష్టపరుస్తుంది.
- source_word: αἰσχρόν
  choice: అవమానకరం
  rationale: ఈ సందర్భంలోని సామాజిక గౌరవం–అవమానం భావాన్ని ‘అవమానకరం’ సహజంగా తెలియజేస్తుంది.
- source_word: γὰρ ... δὲ
  choice: ఎందుకంటే ... అయితే
  rationale: పౌలు ఇచ్చే కారణాన్ని, ఆ తరువాత వచ్చే వ్యతిరేక షరతును ఆధునిక తెలుగులో స్పష్టంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: γυνή అనే పదాన్ని ‘స్త్రీ’గా అనువదించాలా, ‘భార్య’గా అనువదించాలా
  choice: స్త్రీ
  alternative: భార్య
  rationale: ఈ వచనంలో భర్తను స్పష్టంగా పేర్కొనలేదు; అందువల్ల సాధారణ అర్థమైన ‘స్త్రీ’ని ప్రధాన పాఠంలో ఉంచడం పరిధిని అనవసరంగా కుదించదు. ‘భార్య’ అనే సందర్భసాధ్యమైన అర్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- issue: κατακαλύπτεσθαι ఒక నిర్దిష్ట ముసుగును సూచిస్తుందా
  choice: తలను కప్పుకోవడం
  alternative: ముసుగు వేసుకోవడం
  rationale: గ్రీకు క్రియ కప్పబడటాన్ని చెబుతుంది; ఈ సందర్భంలో తల సూచితమై ఉంది. ‘తలను కప్పుకోవడం’ అనేది ఏ నిర్దిష్ట వస్త్రాన్ని లేదా ఆచారరూపాన్ని పాఠ్యంలోకి దిగుమతి చేయకుండా భావాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘జుట్టును కత్తిరించుకోవడం’ మరియు ‘తలను గొరిగించుకోవడం’ మధ్య గ్రీకు పాఠంలోని తేడా నిలుపబడింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
