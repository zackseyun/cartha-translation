  terminology: ‘స్త్రీ’ అనేది γυνήకు ఈ సందర్భంలో తగిన ప్రధాన అనువాదం; ‘భార్య’ అనే సాధ్యమైన ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది. ‘తలను కప్పుకోవడం’ సందర్భసూచితమైన అర్థాన్ని స్పష్టం చేస్తుంది గాని నిర్దిష్టమైన ముసుగు లేదా వస్త్రాన్ని నిర్బంధించదు. ‘అవమానకరం’ αἰσχρόνలోని సామాజిక అవమాన భావానికి తగినది.
