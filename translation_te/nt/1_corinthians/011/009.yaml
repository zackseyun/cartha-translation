id: 1CO.11.9
reference: 1 Corinthians 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: te
  text: ఎందుకంటే, పురుషుడు స్త్రీ కోసం సృష్టించబడలేదు, కానీ స్త్రీ పురుషుని కోసం సృష్టించబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్త్రీ కారణంగా పురుషుడు సృష్టించబడలేదు, కానీ పురుషుని కారణంగా స్త్రీ సృష్టించబడింది.” ఇక్కడ గ్రీకులోని διά అనే అవ్యయం కారణాన్ని లేదా ఉద్దేశాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందటి వాదనకు కారణాన్ని సూచిస్తుంది; καί ఇచ్చే స్వల్ప బలాన్ని తెలుగులో సహజమైన వాక్యప్రవాహం మరియు వ్యతిరేక నిర్మాణం వ్యక్తం చేస్తాయి.
- source_word: ἐκτίσθη
  choice: సృష్టించబడలేదు / సృష్టించబడింది
  rationale: κτίζωకు నేరమైన అర్థం ‘సృష్టించు’; కర్తరి అర్థాన్ని మార్చకుండా గ్రీకు కర్మణి రూపాన్ని నిలిపింది.
- source_word: ἀνὴρ / γυνὴ
  choice: పురుషుడు / స్త్రీ
  rationale: సృష్టి వృత్తాంతాన్ని ఆధారంగా చేసుకున్న సందర్భంలో ఇవి భర్త/భార్యలకే పరిమితం కాకుండా పురుషుడు/స్త్రీని సూచిస్తాయి.
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: స్త్రీ కోసం / పురుషుని కోసం
  rationale: διά + ద్వితీయా విభక్తి కారణం లేదా ఉద్దేశాన్ని సూచించగలదు; ఇక్కడ ‘కోసం’ సృష్టి-ఆధారిత ఉద్దేశ సంబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: ἀλλὰ
  choice: అయితే విరుద్ధార్థాన్ని సెమికోలన్ తరువాతి నిర్మాణంతో వ్యక్తం చేసింది
  rationale: తెలుగులో ‘కాని’ని తప్పనిసరిగా చేర్చకుండానే ‘లేదు; ... జరిగింది’ అనే సమతుల్య వ్యతిరేక నిర్మాణం ἀλλά భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ἀνήρ/γυνήలను ‘పురుషుడు/స్త్రీ’గా లేదా ‘భర్త/భార్య’గా అనువదించడం
  choice: పురుషుడు/స్త్రీ
  alternative: భర్త/భార్య
  rationale: ‘సృష్టించబడింది’ అనే సృష్టి వృత్తాంత సూచన కారణంగా ఈ మాట వైవాహిక సంబంధానికే పరిమితం కాదు. ‘పురుషుడు/స్త్రీ’ అనువాదం ఆ విస్తృతిని కాపాడుతుంది.
- issue: διάను ఉద్దేశంగా లేదా కారణంగా వ్యక్తం చేయడం
  choice: కోసం
  alternative: కారణంగా / నిమిత్తంగా
  rationale: గ్రీకు ప్రయోగం కారణం, ఉద్దేశం రెండింటికీ అవకాశం ఇస్తుంది. ప్రధాన పాఠంలో ‘కోసం’ సృష్టి సంబంధిత ఉద్దేశ భావాన్ని సహజంగా ఇస్తుంది; ప్రత్యామ్నాయ కారణార్థాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సమాంతర వ్యతిరేక నిర్మాణాన్ని నిలిపి, అర్థాన్ని మతశాఖాపరంగా విస్తరించలేదు.
