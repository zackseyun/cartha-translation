id: 1CO.11.18
reference: 1 Corinthians 11:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: te
  text: ఎందుకంటే, మొదటగా, మీరు సంఘంగా[a] కూడివచ్చినప్పుడు మీ మధ్య విభేదాలు ఉన్నాయని వింటున్నాను; ఆ మాటను కొంతవరకు నమ్ముతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సభగా’ లేదా ‘సంఘంలో’; ఇక్కడి గ్రీకు పదం ప్రత్యేకంగా ఒక భవనాన్ని కాక, కూడివచ్చిన విశ్వాసుల సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν
  choice: మొదటగా
  rationale: వాదనలో మొదటి అంశాన్ని పరిచయం చేసే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాత స్పష్టమైన μέν...δέ జత లేకపోవడాన్ని కృత్రిమంగా పూరించదు.
- source_word: συνερχομένων ὑμῶν
  choice: మీరు ... కూడివచ్చినప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని కాలసంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ఈ అధ్యాయంలో పదేపదే వచ్చే సమాజ కూడిక సందర్భాన్నీ నిలుపుతుంది.
- source_word: ἐν ἐκκλησίᾳ
  choice: సంఘంగా[a]
  rationale: ఇక్కడ భవనాన్ని కాక, కూడివచ్చిన విశ్వాసుల సమాజాన్ని సూచిస్తుంది. ‘సంఘంగా’ అనే రూపం సామూహిక కూడిక భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἀκούω
  choice: వింటున్నాను
  rationale: పౌలు ఇతరుల ద్వారా అందుకున్న సమాచారాన్ని సూచించే వర్తమాన కాల భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: σχίσματα
  choice: విభేదాలు
  rationale: సమాజంలో ఏర్పడిన చీలికలు లేదా విభజనలను సూచిస్తుంది. ‘విభేదాలు’ సాధారణ పాఠకులకు సహజంగా ఉండి, ఈ వచనం చెప్పేదానికంటే ఎక్కువగా స్థిరపడిన వర్గాలను సూచించదు.
- source_word: ὑπάρχειν
  choice: ఉన్నాయని
  rationale: విభేదాలు వారి మధ్య ఉనికిలో ఉన్నాయనే నివేదిత విషయాన్ని సరళంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ μέρος τι
  choice: కొంతవరకు
  rationale: పౌలు ఆ నివేదికను పూర్తిగా కాక పరిమితంగా అంగీకరిస్తున్నాడనే భావాన్ని కాపాడుతుంది.
- source_word: πιστεύω
  choice: ఆ మాటను ... నమ్ముతున్నాను
  rationale: గ్రీకులో సందర్భం ద్వారా అర్థమయ్యే కర్మను ‘ఆ మాటను’ అని తెలుగులో స్పష్టపరుస్తుంది; కొత్త సమాచారాన్ని జోడించదు.
theological_decisions:
- issue: ఈ సందర్భంలో ἐκκλησία అర్థం
  choice: కూడివచ్చిన విశ్వాసుల సమాజం—‘సంఘంగా’
  alternative: ‘సంఘంలో’ లేదా ‘సభగా’; ప్రత్యేకమైన ఆరాధనా భవనం
  rationale: సందర్భం కొరింథీయులు ప్రభువు భోజనం కోసం సామూహికంగా కూడివచ్చే విషయాన్ని వివరిస్తోంది. అందువల్ల తరువాతి కాలపు భవనకేంద్రీకృత భావాన్ని చేర్చకుండా, కూడిన సమాజాన్నే అనువాదం సూచిస్తుంది.
- issue: పౌలు నివేదికను ఎంతవరకు నమ్ముతున్నాడు
  choice: ‘కొంతవరకు’ అని పరిమిత అంగీకారాన్ని అలాగే ఉంచడం
  alternative: నివేదిక పూర్తిగా నిజమని పౌలు నిర్ధారిస్తున్నట్లు అనువదించడం
  rationale: μέρος τι అనే మాట పౌలు నమ్మకానికి కొంత పరిమితి లేదా సంకోచం ఉందని సూచిస్తుంది; దానిని తీర్చివేయకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘ఎందుకంటే, మొదటగా’ మూలంలోని కారణసూచక γάρ మరియు వాదనలో మొదటి అంశాన్ని సూచించే πρῶτον μὲν రెండింటినీ నిలుపుతుంది.
