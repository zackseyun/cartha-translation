id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: te
  text: ఎందుకంటే, స్త్రీ పురుషుని నుండి వచ్చినట్లే, పురుషుడు కూడా స్త్రీ ద్వారా జన్మిస్తాడు; అయితే సమస్తమూ దేవుని నుండి కలుగుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ సందర్భాన్ని సాధారణ స్త్రీ–పురుష సంబంధంగా కాక, మరింత సంకుచితంగా వైవాహిక సంబంధంగా గ్రహిస్తే, ‘స్త్రీ, పురుషుడు’ అనే పదాలకు ‘భార్య, భర్త’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ఎందుకంటే, ... వచ్చినట్లే
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, ὥσπερ యొక్క పోలికను ‘వచ్చినట్లే’తో సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἡ γυνὴ
  choice: స్త్రీ
  rationale: γυνήకు ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు. సృష్టి మరియు మానవ జననం రెండింటినీ ప్రస్తావించే ఈ సందర్భంలో సాధారణ లింగార్థమైన ‘స్త్రీ’ అనుకూలం.
- source_word: ἐκ τοῦ ἀνδρός
  choice: పురుషుని నుండి
  rationale: ἐκ మూలం లేదా ఉద్భవాన్ని సూచిస్తుంది; ఇది స్త్రీ పురుషుని నుండి చేయబడిన సృష్టి సూచనను కాపాడుతుంది.
- source_word: ὁ ἀνὴρ
  choice: పురుషుడు
  rationale: ἀνήρకు ‘పురుషుడు’ లేదా ‘భర్త’ అనే అర్థాలు సాధ్యమైనా, ఇక్కడ γυνήతో పరస్పర సమాంతరంగా ఉన్న సాధారణ అర్థం సరిపోతుంది.
- source_word: διὰ τῆς γυναικός
  choice: స్త్రీ ద్వారా
  rationale: Genitiveతో διά సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. ‘స్త్రీ ద్వారా’ అనేది పురుషుడు స్త్రీ ద్వారా జన్మించడాన్ని తెలియజేస్తూ, ἐκ మరియు διά మధ్య వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: τὰ δὲ πάντα
  choice: అయితే సమస్తమూ
  rationale: δέలోని స్వల్ప వ్యత్యాసం లేదా మలుపును ‘అయితే’ తెలియజేస్తుంది; τὰ πάνταను ‘సమస్తమూ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ θεοῦ
  choice: దేవుని నుండే వస్తాయి
  rationale: ἐκ దేవుడే సమస్తానికి అంతిమ మూలమని సూచిస్తుంది. ‘నుండే’ ఉద్ఘాటనను సహజంగా ఇస్తుంది; ‘వస్తాయి’ తెలుగులో వాక్యాన్ని సంపూర్ణం చేస్తుంది.
theological_decisions:
- issue: γυνή / ἀνήρ పదాల భావం
  choice: సాధారణంగా ‘స్త్రీ’ మరియు ‘పురుషుడు’
  alternative: ‘భార్య’ మరియు ‘భర్త’
  rationale: ఈ వాక్యం సృష్టిలో స్త్రీ పురుషుని నుండి రావడాన్నీ, సాధారణ మానవ జననంలో పురుషుడు స్త్రీ ద్వారా రావడాన్నీ కలిపి చెబుతుంది. అందువల్ల వివాహ సంబంధానికే పరిమితం చేయని సాధారణ పదాలు ప్రధాన పాఠానికి తగినవి; సంకుచిత వైవాహిక భావాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: స్త్రీ పురుషుల ఉద్భవ సంబంధం
  choice: ἐκకు ‘నుండి’, διάకు ‘ద్వారా’ అని వ్యత్యాసాన్ని కాపాడటం
  alternative: రెండింటినీ ‘నుండి’గా అనువదించడం
  rationale: పౌలు స్త్రీ సృష్టిలో పురుషుని నుండి వచ్చినదానికీ, పురుషుడు జననంలో స్త్రీ ద్వారా వచ్చేదానికీ ఉద్దేశపూర్వకంగా భిన్న సంబంధపదాలను వాడాడు. ఆ పరస్పరతను సమతలీకరించకుండా నిలుపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పురుషుని నుండి’ మరియు ‘స్త్రీ ద్వారా’ అనే భిన్న నిర్మాణాలు మూలంలోని ἐκ/διά వ్యత్యాసాన్ని స్పష్టంగా కాపాడుతాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో చేర్చబడింది.
