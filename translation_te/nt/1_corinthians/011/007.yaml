  - severity: low
    issue: Overly marked predicative expression in the final clause
    rationale: ‘స్త్రీ పురుషుని మహిమగా ఉంది’ is understandable, but the zero-copula nominal clause ‘స్త్రీ పురుషుని మహిమ’ is more idiomatic and more directly reflects ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
