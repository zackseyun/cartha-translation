id: 1CO.11.7
reference: 1 Corinthians 11:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: te
  text: పురుషుడు దేవుని స్వరూపమూ మహిమయూ కాబట్టి, తన తలను కప్పుకోకూడదు[b]. అయితే స్త్రీ పురుషుని మహిమ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనమంతటా ‘పురుషుడు/స్త్రీ’ అనే పదాలకు ‘భర్త/భార్య’ అని కూడా అనువదించవచ్చు; గ్రీకు పదాలు ἀνήρ, γυνή సందర్భాన్ని బట్టి ఈ రెండు అర్థాలనూ కలిగి ఉంటాయి.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘తన తలకు ముసుగు వేసుకోకూడదు’; గ్రీకు మూలం మరింత సాధారణంగా ‘తన తలను కప్పుకోవడం’ అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: పురుషుడు
  rationale: సందర్భంలో ఆరాధనలోని స్త్రీ–పురుష భేదం మరియు సృష్టి సంబంధమైన వాదన కనిపిస్తున్నందున సాధారణ పురుషార్థాన్ని ఎంచుకున్నాం; ‘భర్త’ అనే అర్థం కూడా పదపరంగా సాధ్యమే.
- source_word: ὀφείλει
  choice: కూడదు
  rationale: οὐκ ὀφείλει అనే నైతిక/నియమాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘కప్పుకోకూడదు’గా వ్యక్తం చేశాం.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: తన తలను కప్పుకోవడం
  rationale: కప్పుకునే వస్తువు లేదా విధానాన్ని ప్రత్యేకంగా నిర్ణయించకుండా గ్రీకు పదబంధంలోని సాధారణ అర్థాన్ని నిలిపాం.
- source_word: εἰκὼν
  choice: స్వరూపం
  rationale: సృష్టి వృత్తాంతపు ప్రతిధ్వనిని, దేవునితో ప్రతినిధిత్వ సంబంధాన్ని తెలుగులో సహజంగా నిలిపే స్థిరమైన బైబిలు పదం.
- source_word: δόξα
  choice: మహిమ
  rationale: రెండు సందర్భాల్లోనూ ఒకే పదాన్ని వాడి వాక్యంలోని సమాంతరతను, పదంలోని ధార్మిక మరియు సంబంధాత్మక బరువును నిలిపాం.
- source_word: θεοῦ
  choice: దేవుని
  rationale: సాధారణ సంబంధ విభక్తిగా నేరుగా అనువదించాం.
- source_word: ὑπάρχων
  choice: అయి ఉన్నాడు కాబట్టి
  rationale: కృదంతం ముందున్న ఆదేశానికి కారణాన్ని తెలియజేస్తున్నందున దాని కారణార్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేశాం.
- source_word: ἡ γυνὴ
  choice: స్త్రీ
  rationale: ఇక్కడ విస్తృతమైన స్త్రీ–పురుష వ్యత్యాసం ప్రధానంగా ఉన్నందున ‘స్త్రీ’ని ఎంచుకున్నాం; ‘భార్య’ కూడా సందర్భానుసారం సాధ్యమే.
- source_word: ἀνδρός
  choice: పురుషుని
  rationale: మొదటి భాగంలోని సాధారణ పురుషార్థంతో సమాంతరతను నిలిపాం; ‘భర్త యొక్క’ అని అనువదించడం సంబంధాన్ని అవసరానికి మించి నిర్దిష్టం చేస్తుంది.
theological_decisions:
- issue: ἀνήρ/γυνήలను పురుషుడు/స్త్రీగా అనువదించాలా, భర్త/భార్యగా అనువదించాలా
  choice: పురుషుడు/స్త్రీ
  alternative: భర్త/భార్య
  rationale: తల కప్పుకోవడం, సృష్టి, దేవుని స్వరూపం మరియు మహిమ అనే తక్షణ సందర్భం కేవలం దాంపత్య సంబంధం కంటే విస్తృతమైన స్త్రీ–పురుష వ్యత్యాసాన్ని సూచిస్తుంది; అయినప్పటికీ గ్రీకు పదాల దాంపత్యార్థాన్ని పాదసూచికలో ఉంచాం.
- issue: ‘స్త్రీ పురుషుని మహిమ’ అనే అసమాన ధార్మిక వాక్యాన్ని ఎలా అందించాలి
  choice: స్త్రీ పురుషుని మహిమగా ఉంది
  alternative: స్త్రీ పురుషుని మహిమను ప్రతిబింబిస్తుంది / స్త్రీ పురుషునికి ఘనత
  rationale: గ్రీకు మూలంలో δόξα మరియు ἐστιν నేరుగా ఉన్నందున వాక్యంలోని ఉద్రిక్తతను మృదువుచేయకుండా నిలిపాం; ప్రత్యామ్నాయాలు భావాన్ని సంకుచితం చేయవచ్చు లేదా వ్యాఖ్యానాన్ని చేర్చవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. సృష్టి సంబంధమైన ‘స్వరూపం’, ‘మహిమ’ పదాలను నిలిపి, మూలంలోని కారణ సంబంధాన్ని ‘కాబట్టి’తో స్పష్టం చేశాం. పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో రెండూ చేర్చబడ్డాయి.
