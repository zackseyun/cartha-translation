id: 1CO.11.15
reference: 1 Corinthians 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γυνὴ δὲ ἐὰν κομᾷ, δόξα αὐτῇ ἐστιν; ὅτι ἡ κόμη ἀντὶ περιβολαίου ⸀δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: te
  text: అయితే ఒక స్త్రీ[b] పొడవైన జుట్టు కలిగి ఉంటే, అది ఆమెకు మహిమగా ఉంటుంది; ఎందుకంటే ఆమె జుట్టు కప్పుదానికి బదులుగా[a] ఆమెకు ఇవ్వబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కప్పుదానిగా.’ గ్రీకు ఉపసర్గ అనురూప సంబంధాన్ని లేదా ప్రత్యామ్నాయాన్ని వ్యక్తపరచగలదు. జుట్టే కప్పుదానిగా పనిచేస్తుందని పౌలు అంటున్నాడా, లేక అది ఒక కప్పుదానితో సంబంధంలో ఇవ్వబడిందని అంటున్నాడా అనేది ఈ పదబంధం మాత్రమే తేల్చదు.
    reason: lexical_alternative
  - marker: b
    text: ‘స్త్రీ’ అని అనువదించిన గ్రీకు పదానికి సందర్భాన్ని బట్టి ‘భార్య’ అనే అర్థం కూడా రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: స్త్రీ
  rationale: సందర్భంలో ఇది ఒక నిర్దిష్ట భార్యను కాక సాధారణంగా స్త్రీని సూచిస్తున్నట్లు ఉంది; అందువల్ల ‘స్త్రీ’ సహజమైన ఎంపిక.
- source_word: κομᾷ
  choice: పొడవైన జుట్టు కలిగి ఉంటే
  rationale: ఈ క్రియ కేవలం జుట్టు ఉండటాన్ని కాక, జుట్టును పొడవుగా ఉంచుకోవడం లేదా పొడవైన జుట్టు కలిగి ఉండటాన్ని సూచిస్తుంది.
- source_word: δόξα
  choice: మహిమ
  rationale: ‘మహిమ’ మూలపదంలోని గౌరవం, ఘనత అనే భావాలతో పాటు పౌలు వాడిన బలమైన అలంకారిక పదాన్ని కాపాడుతుంది.
- source_word: κόμη
  choice: జుట్టు
  rationale: ముందున్న క్రియలో పొడవు భావం ఇప్పటికే వ్యక్తమైంది కాబట్టి ఇక్కడ సహజంగా ‘జుట్టు’ అని అనువదించడం పునరుక్తిని నివారిస్తుంది.
- source_word: ἀντί
  choice: బదులుగా
  rationale: ఈ విభక్త్యర్థక పదం సాధారణంగా ప్రత్యామ్నాయం లేదా అనురూప సంబంధాన్ని వ్యక్తపరుస్తుంది; ప్రధాన పాఠంలో ‘బదులుగా’ దాని సాధారణ బలాన్ని నిలుపుతుంది.
- source_word: περιβολαίου
  choice: ముసుగు
  rationale: ఇది చుట్టుకునే లేదా కప్పే దానిని సాధారణంగా సూచిస్తుంది. తెలుగులో ‘ముసుగు’ సందర్భానికి సహజంగా ఉన్నా, నిర్దిష్ట రకమైన వస్త్రాన్ని నిర్బంధించదు.
- source_word: δέδοται
  choice: ఇవ్వబడింది
  rationale: పూర్తయిన క్రియ ఫలితంగా కొనసాగుతున్న స్థితిని సూచించే పరిపూర్ణ కర్మణి రూపాన్ని తెలుగు సందర్భంలో ‘ఇవ్వబడింది’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: జుట్టే తలపై ధరించాల్సిన ముసుగని ఈ వాక్యం తేల్చి చెబుతుందా?
  choice: ప్రధాన పాఠంలో ‘ముసుగుకు బదులుగా’ అని ఉంచి, ἀντί పదంలోని ప్రత్యామ్నాయ భావాన్ని ప్రతిబింబించడం.
  alternative: ‘ముసుగుగా’ లేదా ‘ముసుగుకు అనురూపంగా’
  rationale: ἀντί ప్రత్యామ్నాయాన్ని లేదా అనురూప సంబంధాన్ని వ్యక్తపరచగలదు. ఈ ఒక్క పదబంధం ఆధారంగా జుట్టే ముసుగా, లేక వేరొక ముసుగుతో సంబంధంలో ఇవ్వబడిందా అనే విస్తృత వ్యాఖ్యాన వివాదాన్ని తీర్చకూడదు.
- issue: γυνή అనే పదం ‘స్త్రీ’నా, ‘భార్య’నా?
  choice: స్త్రీ
  alternative: భార్య
  rationale: ఈ వాక్యం సాధారణ సూత్రంలా చెప్పబడింది; నిర్దిష్ట దాంపత్య సంబంధాన్ని ప్రత్యక్షంగా పేర్కొనదు. అయినా గ్రీకు పదానికి ‘భార్య’ అనే అర్థం కూడా సందర్భానుసారం సాధ్యమని పాదటిప్పణిలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మహిమ’ మూలంలోని బలమైన ధార్మిక-అలంకారిక భావాన్ని నిలుపుతుంది. పాదటిప్పణి గుర్తులు సంబంధిత పదబంధాల దగ్గర ప్రధాన పాఠంలో ఉంచబడ్డాయి.
