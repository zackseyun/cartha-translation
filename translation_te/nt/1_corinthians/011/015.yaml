  source_fidelity: ప్రధాన అనువాదం గ్రీకు వాక్యనిర్మాణాన్నీ, κομᾷ యొక్క ‘పొడవైన జుట్టు కలిగి ఉండటం’ అనే భావాన్నీ, δέδοται యొక్క కర్మణి భావాన్నీ సరిగ్గా ప్రతిబింబిస్తుంది. అయితే περιβόλαιον సాధారణమైన ‘కప్పుదానం/ఆవరణం’ అనే పదం కాగా, ‘ముసుగు’ తెలుగులో ముఖముసుగు లేదా నిర్దిష్ట వస్త్రం అనే సంకుచిత భావాన్ని కలిగించవచ్చు.
