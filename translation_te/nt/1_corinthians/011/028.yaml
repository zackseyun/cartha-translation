id: 1CO.11.28
reference: 1 Corinthians 11:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: te
  text: అయితే ప్రతి వ్యక్తి తనను తాను పరీక్షించుకోవాలి; ఆ విధంగా ఆ రొట్టెను తిని, ఆ పాత్రలోనిది తాగాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: పరీక్షించుకోవాలి
  rationale: తన స్థితిని పరిశీలించి నిజమైనదో తగినదో నిర్ధారించుకోవడం అనే గ్రీకు క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἄνθρωπος
  choice: ప్రతి మనిషి
  rationale: ἄνθρωπος ఇక్కడ సాధారణంగా వ్యక్తిని సూచిస్తుంది; లింగ పరిమితి విధించకుండా, ఆత్మపరిశీలన ప్రతి పాల్గొనేవారికీ వర్తిస్తుందని తెలుగు సహజంగా తెలియజేస్తుంది.
- source_word: οὕτως
  choice: ఆ విధంగా
  rationale: ముందు చెప్పిన స్వపరీక్షను అనుసరించి భుజించి తాగాలని సూచించే విధానార్థాన్ని నిలుపుతుంది.
- source_word: ἐκ τοῦ ἄρτου
  choice: ఆ రొట్టెలో నుంచి
  rationale: ἐκ అనే విభక్తి ప్రయోగంలోని ‘నుంచి’ భావాన్ని, నిర్దిష్టమైన ప్రభుభోజనపు రొట్టెను సూచించే άρθροతో సహా నిలుపుతుంది.
- source_word: ἐκ τοῦ ποτηρίου
  choice: ఆ పాత్రలో నుంచి
  rationale: ποτήριον యొక్క పాత్ర/కప్పు భావాన్ని, దానిలోనిది తాగడం అనే మూలపాఠ నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఆత్మపరిశీలన తరువాత భోజనంలో పాల్గొనాలా లేక దూరంగా ఉండాలా
  choice: ‘పరీక్షించుకోవాలి; ఆ విధంగా ... తిని ... తాగాలి’ అని అనువదించడం
  alternative: అయోగ్యుడిగా తేలితే పాల్గొనకూడదనే భావాన్ని చేర్చడం
  rationale: మూలపాఠం స్వపరీక్ష తరువాత తినడం, తాగడం అని సానుకూలంగా ఆదేశిస్తుంది; పాల్గొనకుండా ఉండాలనే అదనపు నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ఆజ్ఞాత్మక గంభీరతను నిలుపుతూ అనువదించబడింది. గ్రీకు వాక్యంలోని మూడవ పురుష ఆజ్ఞారూపాలను తెలుగులో సహజమైన ‘చుకోవాలి/తాగాలి’ రూపాలతో వ్యక్తం చేశాం.
