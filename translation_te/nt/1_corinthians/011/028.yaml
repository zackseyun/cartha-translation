revisions:
- from: అయితే ప్రతి మనిషి తనను తాను పరీక్షించుకోవాలి; ఆ విధంగా ఆ రొట్టెలో నుంచి తిని, ఆ పాత్రలో నుంచి తాగాలి.
  to: అయితే ప్రతి వ్యక్తి తనను తాను పరీక్షించుకోవాలి; ఆ విధంగా ఆ రొట్టెను తిని, ఆ పాత్రలోనిది తాగాలి.
  rationale: The revision corrects the unnatural rendering of eating ‘from inside the bread.’ It keeps the source sequence, the self-examination requirement, and the instruction to eat and drink after such examination. No footnote is required.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:04:11Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the imperative to self-examination and the consequent eating and drinking. However, Telugu “ఆ రొట్టెలో నుంచి తిని” is not idiomatic, since a loaf is not normally conceived as a container; it can misleadingly suggest eating something located inside the bread. The Greek partitive ἐκ with bread is naturally rendered by the direct object in Telugu. For the cup, “పాత్రలోనిది తాగాలి” naturally preserves drinking what is in the cup.
  naturalness: “ప్రతి వ్యక్తి” is clear modern standard Telugu for the generic ἄνθρωπος and avoids an unnecessary male-specific implication. The revised wording is fluent while retaining the formal instructional register.
  terminology: “పరీక్షించుకోవాలి” suitably renders δοκιμαζέτω in this context. “రొట్టె” and “పాత్ర” retain the established concrete terms without adding sacramental interpretation.
  issues:
  - severity: medium
    issue: ఆ రొట్టెలో నుంచి తిని
    rationale: This is structurally too literal and unnatural in Telugu. It can imply that something is inside the bread. Telugu idiom uses “రొట్టెను తిని”; this accurately communicates the Greek idiomatic partitive expression without adding meaning.
  revised_text: అయితే ప్రతి వ్యక్తి తనను తాను పరీక్షించుకోవాలి; ఆ విధంగా ఆ రొట్టెను తిని, ఆ పాత్రలోనిది తాగాలి.
  revised_footnotes: []
  revision_rationale: The revision corrects the unnatural rendering of eating ‘from inside the bread.’ It keeps the source sequence, the self-examination requirement, and the instruction to eat and drink after such examination. No footnote is required.
