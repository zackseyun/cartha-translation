  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: te
  text: ఎందుకంటే, శరీరాన్ని[a] వివేచించకుండా[b] తిని తాగేవాడు తన మీదకు తీర్పును తెచ్చుకుంటూ తిని తాగుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘శరీరాన్ని’ బదులు ‘ప్రభువు శరీరాన్ని’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘శరీరాన్ని ప్రత్యేకంగా గుర్తించకుండా.’ ఇది ప్రభువు భోజనం యొక్క ప్రాముఖ్యతను గుర్తించడాన్ని గానీ, సమకూడిన విశ్వాసుల సమూహాన్ని శరీరంగా గుర్తించడాన్ని గానీ, లేదా రెండింటినీ గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: తీర్పు
  rationale: ఈ పదం న్యాయపరమైన నిర్ణయాన్ని లేదా తీర్పును సూచిస్తుంది. తరువాతి వచనాల్లో దేవుని శిక్షణ గురించి చెప్పబడుతున్నందున, అంతిమ దండన అనే భావాన్ని అతిగా సూచించకుండా ‘తీర్పు’ అని అనువదించాం.
- source_word: ἑαυτῷ
  choice: తన మీదికి
  rationale: కర్త చేసే తినడం, తాగడం వల్ల ప్రతికూలమైన తీర్పు అతనికే కలుగుతుందని ఆత్మార్థక చతుర్థీ విభక్తి సూచిస్తుంది. ‘తన మీదికి’ అనేది తెలుగులో సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: διακρίνων
  choice: వివేచించకుండా
  rationale: ఈ క్రియకు సరైన భేదాన్ని గుర్తించడం లేదా సరిగ్గా అంచనా వేయడం అనే భావం ఉంది. ‘వివేచించడం’ దాని జ్ఞానపరమైన, నైతికమైన బరువును నిలుపుతూ, ఉద్దేశించిన అర్థాన్ని ముందుగానే తేల్చదు.
- source_word: τὸ σῶμα
  choice: శరీరాన్ని
  rationale: గ్రంథపాఠం కేవలం ‘శరీరం’ అని మాత్రమే చెబుతుంది. ఇది క్రీస్తు శరీరాన్నా, విశ్వాసుల సమూహమనే శరీరాన్నా, లేక రెండింటినీ సూచిస్తుందా అనే సందర్భంలోని ఉద్దేశపూర్వక అనిశ్చితిని అనువాదం నిలుపుతుంది.
- source_word: ὁ … ἐσθίων καὶ πίνων
  choice: తిని తాగేవాడు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతాన్ని సాధారణ ఏకవచనంగా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μὴ διακρίνων
  choice: వివేచించకుండా
  rationale: గ్రీకులోని ప్రతిషేధార్థక కృదంత నిర్మాణాన్ని తెలుగులో సహజమైన అసమాపక క్రియారూపంతో నిలిపి, తీర్పుకు దారితీసే వైఫల్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘శరీరం’ అనే పదం ప్రభువు భోజన సందర్భంలో దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘శరీరం’ అనే అనిశ్చిత పదాన్నే ఉంచడం
  alternative: ‘ప్రభువు శరీరం’ లేదా ‘విశ్వాసుల సమూహమనే శరీరం’ అని నిర్దిష్టంగా చెప్పడం
  rationale: గ్రీకు పాఠం కేవలం ‘శరీరం’ అని చెబుతుంది. సందర్భం యేసు శరీరానికీ, కొరింథీయులు తోటి విశ్వాసులతో వ్యవహరించిన తీరుకీ సంబంధించినందున, అనువాదం ఈ వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: κρίμα పదం యొక్క తీవ్రత
  choice: తీర్పు
  alternative: దండన లేదా శాశ్వత ఖండన
  rationale: 32వ వచనంలో లోకంతో పాటు ఖండించబడకుండా ఉండేందుకు ప్రభువు ఇచ్చే శిక్షణను పౌలు ప్రస్తావిస్తాడు. కాబట్టి ఇక్కడ అంతిమ నాశనాన్ని తప్పనిసరిగా సూచించని ‘తీర్పు’ సరైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని ‘తిని తాగేవాడు … తిని తాగుతున్నాడు’ అనే పునరుక్తిని భావబలంతో సహా నిలిపాం; అయితే ‘తీర్పును తిని తాగుతున్నాడు’ అనే తెలుగులో అసహజమైన అక్షరానువాదాన్ని నివారించి ‘తన మీదికి తీర్పు తెచ్చుకునేలా’ అని వ్యక్తం చేశాం.
