review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the verse’s sequence of rhetorical questions, the contrast between private houses and God’s assembly, contempt for the assembly, shaming those lacking, and the repeated refusal to praise. A small syntactic revision better reflects that the second question contains two coordinated finite verbs (καταφρονεῖτε, καταισχύνετε), rather than making the first action merely a participial accompaniment to the second.
  naturalness: The Telugu is modern and readily understandable. Recasting “తృణీకరించి, ... అవమానపరుస్తున్నారా?” as two coordinated questions/actions is smoother and more faithful to the Greek rhetorical parallelism. “మీరేమి చెప్పమంటారు?” is a natural rendering of Paul’s deliberative rhetorical question addressed to the readers.
  terminology: “దేవుని సంఘం,” “తృణీకరించు,” and “అవమానపరచు” are appropriate in a modern standard Telugu biblical register. “ఏమీ లేనివారు” suitably preserves the broad Greek expression; the footnote responsibly records contextually plausible narrower senses without imposing one.
  issues:
  - severity: low
    issue: The phrase “తృణీకరించి, ఏమీ లేనివారిని అవమానపరుస్తున్నారా?” uses a conjunctive participle for καταφρονεῖτε.
    rationale: 'The Greek has two coordinated present indicative verbs: “do you despise ... and shame ...?” Coordinating the Telugu verbs more directly preserves the parallel accusation and rhetorical force.'
  - severity: low
    issue: “మీతో ఏమనాలి?” can sound as though Paul is asking what he should say in conversation with them.
    rationale: The Greek τί εἴπω ὑμῖν is a deliberative rhetorical question, “What am I to say to you?” “మీరేమి చెప్పమంటారు?” preserves this conventional rhetorical force naturally.
  revised_text: తినడానికి, తాగడానికి మీకు ఇళ్లు లేవా? లేక మీరు దేవుని సంఘాన్ని తృణీకరిస్తూ, ఏమీ లేనివారిని అవమానపరుస్తున్నారా? మీరేమి చెప్పమంటారు? మిమ్మల్ని మెచ్చుకోవాలా? ఈ విషయంలో నేను మిమ్మల్ని మెచ్చుకోను.[a]
