id: 1CO.11.22
reference: 1 Corinthians 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: te
  text: తినడానికి, తాగడానికి మీకు ఇళ్లు లేవా? లేక మీరు దేవుని సంఘాన్ని తృణీకరిస్తూ, ఏమీ లేనివారిని అవమానపరుస్తున్నారా? మీరేమి చెప్పమంటారు? మిమ్మల్ని మెచ్చుకోవాలా? ఈ విషయంలో నేను మిమ్మల్ని మెచ్చుకోను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పేదవారిని’ లేదా ‘తినడానికి ఆహారం లేనివారిని’; గ్రీకులో అక్షరార్థంగా ‘లేనివారిని.’
    reason: τοὺς μὴ ἔχοντας అనే గ్రీకు పదబంధం విస్తృతంగా ఉండగా, సందర్భం పేదరికం లేదా ఆహారలేమిని సూచించవచ్చు కాబట్టి ప్రత్యామ్నాయాలను నమోదు చేయడం.
lexical_decisions:
- source_word: οἰκίας
  choice: ఇళ్లు
  rationale: సమకూడిన దేవుని సంఘానికి భిన్నంగా, తినడానికి తాగడానికి ఉపయోగించే వ్యక్తిగత గృహాలను సూచించే బహువచన రూపాన్ని సహజంగా నిలుపుతుంది.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: తినడానికి, తాగడానికి
  rationale: ఆర్టికల్‌తో కూడిన క్రియానామ రూపాలు తెలిపే ఉద్దేశాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: దేవుని సంఘాన్ని
  rationale: దేవునికి చెందిన సమకూడిన విశ్వాసుల సమాజాన్ని సూచించే పౌలు వాడుకకు ‘సంఘం’ స్థిరమైన, అతిగా సంస్థాగతం కాని పదం.
- source_word: καταφρονεῖτε
  choice: తృణీకరించి
  rationale: తక్కువగా ఎంచడం, విలువలేనిదిగా చూడడం అనే బలమైన నైతిక నిందను నిలుపుతుంది.
- source_word: καταισχύνετε
  choice: అవమానపరుస్తున్నారా
  rationale: ఇతరులకు సిగ్గు కలిగించడం లేదా వారిని అవమానానికి గురిచేయడం అనే క్రియార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοὺς μὴ ἔχοντας
  choice: ఏమీ లేనివారిని
  rationale: అక్షరార్థంగా ‘లేనివారు’ అనే విస్తృత గ్రీకు వ్యక్తీకరణను నిలుపుతూ, సందర్భంలోని ఆహార లేదా ఆర్థిక కొరతను ప్రధాన వచనంలో అతిగా నిర్దిష్టం చేయదు.
- source_word: τί εἴπω ὑμῖν;
  choice: మీతో ఏమనాలి?
  rationale: ఆలోచనాత్మక అలంకారప్రశ్నను సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: మిమ్మల్ని మెచ్చుకోవాలా?
  rationale: ప్రతికూల సమాధానాన్ని ఆశించే పౌలు వ్యంగ్య అలంకారప్రశ్నను స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν τούτῳ
  choice: ఈ విషయంలో
  rationale: చర్చలో ఉన్న నిర్దిష్ట ప్రవర్తనను సూచించే పదబంధాన్ని తెలుగులో స్పష్టంగా చేస్తుంది.
- source_word: οὐκ ἐπαινῶ
  choice: నేను మిమ్మల్ని మెచ్చుకోను
  rationale: ముందటి ἐπαινέσωతో పదపునరుక్తిని నిలుపుతూ పౌలు నిరాకరణను నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రభువు భోజన సందర్భంలో ‘ఏమీ లేనివారు’ ఎవరిని సూచిస్తారు?
  choice: ప్రధాన వచనంలో ‘ఏమీ లేనివారు’ అని విస్తృతంగా అనువదించడం.
  alternative: ‘పేదవారు’ లేదా ‘తినడానికి ఆహారం లేనివారు’ అని నిర్దిష్టంగా అనువదించడం.
  rationale: తక్షణ సందర్భం ఆర్థికంగా లేదా ఆహారపరంగా కొరతలో ఉన్న విశ్వాసులను బలంగా సూచించినా, గ్రీకు మాట అక్షరార్థంగా ‘లేనివారు’ అనే విస్తృత భావాన్ని కలిగి ఉంది. అందువల్ల ప్రధాన వచనం ఆ విస్తృతతను నిలుపుతుంది; సందర్భానుగుణ ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రశ్నల వరుసలోని పౌలు గద్దింపు, వ్యంగ్యం నిలుపబడ్డాయి; ‘సంఘం’ అనే పదం సమకూడిన దేవుని ప్రజలను సూచిస్తుంది.
