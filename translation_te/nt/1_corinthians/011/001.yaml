id: 1CO.11.1
reference: 1 Corinthians 11:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: te
  text: నేను కూడా మెస్సీయను[a] అనుకరిస్తున్నట్లే, మీరు నన్ను అనుకరించేవారిగా అవ్వండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రీస్తును.”'
    reason: Χριστόςకు సంప్రదాయంగా వాడే ప్రత్యామ్నాయ రూపం.
lexical_decisions:
- source_word: μιμηταί
  choice: అనుకరించేవారిగా
  rationale: ఈ నామవాచకం ఒకరి మాదిరిని అనుసరించి ప్రవర్తించేవారిని సూచిస్తుంది. ‘అనుకరించేవారు’ అనే పదం మూలంలోని imitation భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: μου
  choice: నన్ను
  rationale: తెలుగులో ‘నన్ను అనుకరించేవారు’ అనడం సహజం; ఇది గ్రీకులోని సంబంధార్థక షష్ఠీ విభక్తి భావాన్ని సరిగ్గా తెలియజేస్తుంది.
- source_word: γίνεσθε
  choice: అవ్వండి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపంలోని ‘అవడం/అలా మారడం’ అనే చలన భావాన్ని నిలుపుతుంది; కేవలం ‘ఉండండి’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: καθὼς
  choice: అనుకరిస్తున్నట్లే
  rationale: ‘ఎలాగైతే/అలాగే’ అనే స్పష్టమైన పోలికను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: κἀγὼ
  choice: నేను … అనుకరిస్తున్నట్లే
  rationale: καί + ἐγώ లోని ‘నేను కూడా’ అనే భావం పోలిక నిర్మాణం ద్వారా తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయను
  rationale: Χριστός ఇక్కడ యేసుకు సంబంధించిన బిరుదుగా ఉంది. అందువల్ల దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో వాడి, సంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: Χριστοῦ పదానికి అనువాదం
  choice: మెస్సీయను
  alternative: క్రీస్తును
  rationale: ఈ సందర్భంలో Χριστός బిరుదు భావాన్ని కలిగి ఉంది. ‘మెస్సీయ’ ఆ బిరుదు అర్థాన్ని వెల్లడిస్తుంది; పాఠకులకు సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఇచ్చాం.
- issue: చివరి భాగంలోని గ్రీకు అధ్యాహారం
  choice: ‘అనుకరిస్తున్న’ అనే భావాన్ని తెలుగులో స్పష్టంగా పూరించడం
  alternative: ‘నేను కూడా మెస్సీయకు చెందినవాడిగా ఉన్నట్లే’ వంటి పదానువాద నిర్మాణం
  rationale: κἀγὼ Χριστοῦలో μιμητής భావం ముందటి భాగం నుంచి అధ్యాహారంగా వస్తుంది. తెలుగులో దాన్ని పూరించకపోతే వాక్యం అసంపూర్ణంగా లేదా ‘చెందినవాడు’ అనే భిన్నార్థంతో వినిపిస్తుంది. కాబట్టి మూలంలోని ఉద్దేశిత పోలికను సహజంగా స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. గ్రీకులోని అధ్యాహారాన్ని తెలుగులో సహజంగా పూరించాం; పౌలు తనను అనుకరించమని చెప్పడం, తాను మెస్సీయను అనుకరించే పరిమితిలోనే అర్థమయ్యేలా పోలికను నిలిపాం.
