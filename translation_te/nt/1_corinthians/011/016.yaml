id: 1CO.11.16
reference: 1 Corinthians 11:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: te
  text: అయితే ఎవరైనా వివాదప్రియుడిగా కనిపిస్తే[a], మాకు అలాంటి ఆచారం లేదు[b]; దేవుని సంఘాలకు కూడా లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను వివాదప్రియుడినని అనుకుంటే.” “వివాదప్రియుడు”ను “కలహప్రియుడు” లేదా “వాదనలకు మొగ్గుచూపేవాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అలాంటి ఆచారం” అనేది వివాదప్రియతను గానీ, ముందరి వచనాల్లో చర్చించిన వివాదాస్పద ఆచారాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: అనుకుంటే
  rationale: δοκεῖ అనే క్రియకు ‘అనిపించు’ లేదా ‘తలంచు/అనుకో’ అనే భావాలు ఉన్నాయి. ఇక్కడ వ్యక్తి తనను తాను వివాదానికి మొగ్గుచూపేవాడిగా భావించడం లేదా అలా ఉండాలని పట్టుబట్టడం అనే గ్రీకు నిర్మాణంలోని భావవిస్తృతిని ‘అనుకుంటే’ సహజంగా అందిస్తుంది.
- source_word: φιλόνεικος
  choice: వివాదప్రియుడు
  rationale: ఈ విశేషణం కలహం లేదా వాదన పట్ల మొగ్గుగల వ్యక్తిని సూచిస్తుంది. ‘వివాదప్రియుడు’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉండి, పోట్లాటకు సిద్ధపడే స్వభావాన్ని తెలియజేస్తుంది.
- source_word: τοιαύτην
  choice: అలాంటి
  rationale: ఇది ముందున్న విషయానికి తిరిగి సూచిస్తూ, దాని రకాన్ని నిర్దిష్టంగా తేల్చకుండా ఉంచుతుంది.
- source_word: συνήθειαν
  choice: ఆచారం
  rationale: ఈ నామవాచకం అలవాటుగా లేదా సమాజంలో స్థిరపడిన ఆచరణగా ఉన్న పద్ధతిని సూచించగలదు. ‘ఆచారం’ సంఘపరమైన స్థిర వాడుకను సహజంగా తెలియజేస్తూ, దాని వివాదాస్పద సూచనను తెరిచి ఉంచుతుంది.
- source_word: οὐκ ἔχομεν
  choice: మాకు ... లేదు
  rationale: గ్రీకు పదబంధానికి సూటిగా, సహజమైన తెలుగు రూపం. ‘మేము పాటించము’ వంటి మరింత వ్యాఖ్యానాత్మక భావాన్ని చేర్చదు.
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: దేవుని సంఘాలు
  rationale: దేవునికి చెందిన సమాజాలనే జనిటివ్ సంబంధాన్ని నిలుపుతూ, ఆధునిక తెలుగు బైబిలు వాడుకలో సహజంగా ఉంటుంది.
theological_decisions:
- issue: ‘అలాంటి ఆచారం లేదు’ అనే మాట దేనిని సూచిస్తుంది?
  choice: ‘అలాంటి ఆచారం’ అని విస్తృతంగానే ఉంచి, అది వివాదప్రియతను సూచిస్తుందా లేక ముందరి వచనాల్లో చర్చించిన ఆచారాన్ని సూచిస్తుందా అని అనువాదంలో తేల్చలేదు.
  alternative: వివాదపడే ఆచారం మాకు లేదు; లేదా ముందరి వచనాల్లో చర్చించిన తల కప్పుకునే/కప్పుకోని పద్ధతికి భిన్నమైన ఆచారం మాకు లేదు.
  rationale: τοιαύτην συνήθειαν సంక్షిప్తమైన నిర్మాణం; సందర్భంలో దాని పూర్వాపర సూచనపై భిన్న అవగాహనలు సాధ్యమే. మూలంలోని నిజమైన అస్పష్టతను నిలుపుటకు సాధారణ వ్యక్తీకరణను వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సంఘాలు,’ ‘ఆచారం’ వంటి పరిచితమైన బైబిలు పదాలను ఉపయోగించాం; మూలంలోని సంక్షిప్తత మరియు సూచనాస్పష్టతను కాపాడాం.
