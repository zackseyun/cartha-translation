source:
  edition: SBLGNT
  text: ἕκαστος γὰρ τὸ ἴδιον δεῖπνον προλαμβάνει ἐν τῷ φαγεῖν, καὶ ὃς μὲν πεινᾷ, ὃς δὲ μεθύει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: te
  text: ఎందుకంటే, భోజనం చేసేటప్పుడు ప్రతి ఒక్కరూ తమ సొంత భోజనాన్ని ముందే తీసుకుంటారు[a]; ఒకరు ఆకలితో ఉంటారు, మరొకరు మత్తెక్కుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ సొంత భోజనాన్ని ఇతరులకంటే ముందుగా తీసుకుంటారు.” గ్రీకు క్రియ ముందుగా తీసుకోవడాన్నిగానీ, ఇతరుల కోసం వేచి ఉండకుండా ముందుకు సాగడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒకరు ఆకలితో ఉంటారు, మరొకరు మత్తులో ఉంటారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ప్రతి ఒక్కరూ
  rationale: పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలో సమూహంలోని ఒక్కొక్కరి ప్రవర్తనను సూచిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని గద్దింపుకు ఈ వచనం కారణాన్ని వివరిస్తున్న సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: τὸ ἴδιον δεῖπνον
  choice: తమ సొంత భోజనాన్ని
  rationale: ἴδιον లోని వ్యక్తిగత స్వామ్య భావాన్ని, సమూహంగా పంచుకోవలసిన భోజనానికి ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది; δεῖπνον కు సహజమైన సందర్భోచిత పదం ‘భోజనం’.
- source_word: προλαμβάνει
  choice: ఇతరుల కోసం వేచి ఉండకుండా ... ముందే తింటున్నారు
  rationale: క్రియలో సాధ్యమైన ‘ముందుగా తీసుకోవడం’ మరియు ‘ఇతరులను వేచి చూడకుండా కొనసాగడం’ అనే రెండు సందర్భోచిత ఛాయలను సహజంగా అందిస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: ἐν τῷ φαγεῖν
  choice: భోజనం చేసేటప్పుడు
  rationale: ἐν తో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ యొక్క కాలసూచక భావాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: ఒకరు ... మరొకరు
  rationale: పాల్గొనేవారిలోని విరుద్ధ పరిస్థితులను సంక్షిప్తంగా, సహజంగా చూపుతుంది.
- source_word: πεινᾷ
  choice: ఆకలితో ఉంటే
  rationale: వర్తమాన స్థితిని నేరుగా తెలియజేస్తుంది; ‘ఆకలితో మిగిలిపోతే’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: μεθύει
  choice: మత్తెక్కుతున్నారు
  rationale: వాస్తవ మద్యమత్తును మృదువుచేయకుండా, être/become intoxicated అనే క్రియాభావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పంపిణీ ఏకవచనంలోని లింగ సూచన
  choice: ప్రతి ఒక్కరూ ... తమ సొంత భోజనాన్ని
  alternative: ప్రతి పురుషుడు తన సొంత భోజనాన్ని
  rationale: గ్రీకు వ్యాకరణ రూపం పుంలింగ ఏకవచనమైనా, ἕκαστος ఇక్కడ సమూహంలోని ఒక్కొక్కరిని పంపిణీ భావంతో సూచిస్తుంది. తెలుగు సహజ ప్రయోగం ఆ భావాన్ని ‘ప్రతి ఒక్కరూ ... తమ’ ద్వారా నిలుపుతుంది; పాల్గొనేవారు పురుషులే అని అనవసరంగా పరిమితం చేయదు.
- issue: ప్రభువు భోజన సందర్భంలోని దుర్వినియోగ స్వభావం
  choice: మత్తెక్కుతున్నారు
  alternative: మత్తులో ఉన్నారు
  rationale: μεθύει నిజమైన మద్యమత్తును సూచిస్తుంది; దాన్ని కేవలం అతిగా తినడం లేదా తాగడంగా మృదువుచేయలేదు. క్రియలో స్థితి లేదా ఆ స్థితికి చేరడం రెండూ సాధ్యమైనందున ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘దాంతో’ అనేది καί ద్వారా కలిపిన ఫలితసదృశ వ్యత్యాసాన్ని సహజంగా చూపుతుంది; అయితే గ్రీకులోని విరుద్ధ పరిస్థితులను అతిగా సిద్ధాంతీకరించదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
