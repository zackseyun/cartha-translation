revisions:
- from: ఎందుకంటే, భోజనం చేసేటప్పుడు ప్రతి ఒక్కరూ ఇతరుల కోసం వేచి ఉండకుండా తమ సొంత భోజనాన్ని ముందే తింటున్నారు[a]. దాంతో ఒకరు ఆకలితో ఉంటే, మరొకరు మత్తెక్కుతున్నారు[b].
  to: ఎందుకంటే, భోజనం చేసేటప్పుడు ప్రతి ఒక్కరూ తమ సొంత భోజనాన్ని ముందే తీసుకుంటారు[a]; ఒకరు ఆకలితో ఉంటారు, మరొకరు మత్తెక్కుతారు[b].
  rationale: The revision removes the unsupported conditional and avoids strengthening coordination into explicit causation. It renders προλαμβάνει directly as “ముందే తీసుకుంటారు,” while preserving its contextually possible ‘without waiting for others’ sense in the anchored footnote. No disputed textual or doctrinal interpretation has been imposed.
