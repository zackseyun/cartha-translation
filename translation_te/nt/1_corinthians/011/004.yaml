id: 1CO.11.4
reference: 1 Corinthians 11:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: te
  text: తలపై ఏదో ధరించి ప్రార్థించే లేదా ప్రవచించే ప్రతి పురుషుడు తన తలను అవమానపరుస్తాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయబద్ధంగా, “తన తలను కప్పుకొని.” గ్రీకు పదబంధం అక్షరార్థంగా “తలపై లేదా తల నుండి కిందికి ఏదో ఉండగా” అని చెబుతుంది; అది ఏ విధమైన కప్పుదలయో స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: “తన తల” అనేది అక్షరార్థంగా అతని స్వంత తలను సూచించవచ్చు; అదే సమయంలో పరిసర సందర్భంలో “తల” అనే పదానికి ఉన్న సంబంధార్థక వాడుకను కూడా ప్రతిధ్వనింపజేయవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: ప్రతి పురుషుడు
  rationale: ἀνήρ సందర్భానుసారం ‘పురుషుడు’ లేదా ‘భర్త’ అని అర్థం కావచ్చు. ఇక్కడ 5వ వచనంలోని ‘ప్రతి స్త్రీ’కి సమాంతరంగా సాధారణ పురుష సూచన ఉండటం వల్ల, ‘ప్రతి పురుషుడు’ తక్కువ వ్యాఖ్యానభారం గల ఎంపిక.
- source_word: προσευχόμενος ἢ προφητεύων
  choice: ప్రార్థించే లేదా ప్రవచించే
  rationale: వర్తమాన కృదంతాల సమాంతర క్రియను సహజమైన ఆధునిక తెలుగులో సంబంధార్థక రూపంతో వ్యక్తం చేస్తుంది; ప్రవచన క్రియను పారదర్శకంగా నిలుపుతుంది.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: తన తలమీద ఏదైనా ఉంచుకొని ఉంటే
  rationale: గ్రీకు నుడికారం అక్షరార్థంగా తలపై లేదా తల నుండి కిందికి ఏదో కలిగి ఉండడాన్ని సూచిస్తుంది; నిర్దిష్టంగా ముసుగు లేదా వస్త్రం అని చెప్పదు. ఈ అనువాదం ఆ అనిర్దిష్టతను కాపాడుతుంది.
- source_word: καταισχύνει
  choice: అవమానపరుస్తాడు
  rationale: ఈ క్రియ అవమానం లేదా అగౌరవం కలిగించడాన్ని సూచిస్తుంది. గౌరవం–అవమానం నేపథ్యానికి ‘అవమానపరుస్తాడు’ సహజంగా సరిపోతుంది.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: తన తలను
  rationale: భౌతిక తలకూ, పరిసర సందర్భంలోని సంబంధార్థక ‘తల’కూ వీలున్న పదప్రయోగాన్ని వ్యాఖ్యానంతో పరిష్కరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: చివరి భాగంలోని κεφαλή భౌతిక తలా లేక సంబంధార్థక తలా
  choice: ‘తన తలను’ అని ఉంచి అనిశ్చితిని కాపాడటం
  alternative: ‘తన భౌతిక తలను’ లేదా ‘తనకు తలగా ఉన్నవానిని’ అని స్పష్టం చేయడం
  rationale: పౌలు మాటల్లో భౌతిక తలకూ, 3వ వచనంలోని సంబంధార్థక ‘తల’కూ మధ్య ఉద్దేశపూర్వక ప్రతిధ్వని ఉండవచ్చు. ప్రధాన పాఠంలో దానిని ఒకే అర్థానికి పరిమితం చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలి. మూలంలోని పురుష సూచన, తలకప్పుదల గురించిన అనిర్దిష్టత, చివరి ‘తల’లోని భావద్వంద్వం కాపాడబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
