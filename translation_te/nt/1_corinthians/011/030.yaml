id: 1CO.11.30
reference: 1 Corinthians 11:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: te
  text: ఈ కారణంగా మీలో చాలామంది బలహీనులుగాను రోగులుగాను ఉన్నారు; గణనీయమైన సంఖ్యలో ఉన్నవారు నిద్రించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, మరింత స్పష్టంగా, ‘చనిపోయారు.’ ఇక్కడ పౌలు ‘నిద్రించారు’ అన్నది మరణానికి సాధారణ క్రైస్తవ రూపకంగా ఉపయోగించినట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ఈ కారణంగా
  rationale: ముందటి వచనాల్లో చెప్పిన ప్రభువు భోజన దుర్వినియోగానికి దీనిని ఫలితంగా అనుసంధానించే స్పష్టమైన కారణార్థక ప్రయోగం.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: వ్యక్తుల అంతర్గత స్థితిని కాక, కొరింథు సంఘ సమాజంలో ఉన్న పరిస్థితిని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: వ్యక్తులను సూచించే పరిమాణార్థక విశేషణానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἀσθενεῖς
  choice: బలహీనులుగా
  rationale: శారీరక దౌర్బల్యాన్ని సూచిస్తూ, తరువాతి ἄρρωστοι అనే రోగస్థితి పదంతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: ἄρρωστοι
  choice: రోగులుగా
  rationale: అనారోగ్యాన్ని స్పష్టంగా తెలియజేస్తూ ἀσθενεῖς (‘బలహీనులు’) నుండి భావభేదాన్ని కాపాడుతుంది.
- source_word: κοιμῶνται
  choice: నిద్రించారు
  rationale: ఇక్కడ మరణానికి రూపకంగా వాడిన ‘నిద్ర’ భాషను వ్యాఖ్యానించి తొలగించకుండా ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: ἱκανοί
  choice: చాలామంది
  rationale: గణనీయమైన సంఖ్యను సహజంగా తెలియజేస్తుంది; గ్రీకు పదం ఖచ్చిత సంఖ్యను ఇవ్వదు.
theological_decisions:
- issue: κοιμῶνται అక్షరార్థ నిద్రనా, మరణానికి రూపకమా
  choice: మరణాన్ని సూచించే రూపకంగా భావించి, ప్రధాన పాఠ్యంలో ‘నిద్రించారు’ అని రూపకాన్నే నిలిపాం
  alternative: ‘చనిపోయారు’ అని భావాన్ని నేరుగా వ్యక్తపరచడం; లేదా అక్షరార్థంగా నిద్రపోతున్నారు అనుకోవడం
  rationale: బలహీనత–రోగం–నిద్ర అనే పెరుగుతున్న తీవ్రత క్రమం మరియు దైవ తీర్పు సందర్భం మరణార్థాన్ని బలంగా సూచిస్తాయి. అయినా పౌలు వాడిన రూపకాన్ని పాఠ్యంలో కాపాడడం మూలంలోని ధార్మిక స్వరాన్ని, స్వల్ప అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘బలహీనులు/రోగులు’ అనే మూలంలోని పదభేదం, ‘నిద్రించారు’ అనే మరణ రూపకం రెండూ నిలుపబడ్డాయి; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
