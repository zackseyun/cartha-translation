  terminology: బలహీనులు and రోగులు appropriately retain the distinction between ἀσθενεῖς and ἄρρωστοι. ‘గణనీయమైన సంఖ్యలో ఉన్నవారు’ distinguishes ἱκανοί from the preceding πολλοὶ without imposing a precise count.
  issues:
