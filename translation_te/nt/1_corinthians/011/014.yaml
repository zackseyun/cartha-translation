id: 1CO.11.14
reference: 1 Corinthians 11:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: te
  text: పురుషుడు జుట్టును పొడవుగా పెంచుకుంటే[a], అది అతనికి అవమానమని ప్రకృతి స్వయంగా కూడా మీకు బోధించదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జుట్టును పొడవుగా ఉంచుకుంటే” లేదా “పొడవైన జుట్టు కలిగి ఉంటే.” గ్రీకు క్రియ జుట్టును పొడవుగా పెంచుకోవడం, ఉంచుకోవడం లేదా కలిగి ఉండడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: బోధించడం లేదా?
  rationale: ముందటి వాదనను కొనసాగించే ప్రతికూల అలంకారప్రశ్నగా అనువదించబడింది; ‘ప్రకృతే’లోని ఏకారాంతం ‘కూడా/సైతం’ అనే ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: ἡ φύσις αὐτὴ
  choice: ప్రకృతే
  rationale: αὐτή ఇచ్చే ఉద్ఘాటనను తెలుగు ఏకారంతో నిలిపి, φύσις ఏ అర్థపరిధిని సూచిస్తుందో అనువాదంలో సంకుచితం చేయలేదు.
- source_word: διδάσκει ὑμᾶς
  choice: మీకు బోధించడం
  rationale: వర్తమానకాల బోధనా భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: ప్రకృతి బోధించే విషయాన్ని పరిచయం చేసే గ్రీకు సంధాయకాన్ని సహజమైన తెలుగు ఉద్ధరణార్థక రూపంతో వ్యక్తపరుస్తుంది.
- source_word: ἀνὴρ
  choice: పురుషుడు
  rationale: ఇక్కడ భర్తను ప్రత్యేకంగా కాక, స్త్రీకి భిన్నంగా పురుషుణ్ణి సూచిస్తున్నందున ‘పురుషుడు’ స్పష్టమైన ఎంపిక.
- source_word: μέν
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: తదుపరి వచనంలోని వ్యత్యాసానికి మొదటి భాగాన్ని సూచించే ఈ అవ్యయాన్ని తెలుగులో విడిగా చేరిస్తే వాక్యం కృత్రిమంగా ఉంటుంది; వ్యత్యాసం వాక్య నిర్మాణంలో కొనసాగుతుంది.
- source_word: ἐὰν κομᾷ
  choice: జుట్టును పొడవుగా పెంచుకుంటే
  rationale: κομάω జుట్టును పొడవుగా ఉంచడం లేదా పెంచుకోవడం అనే భావాన్ని ఇస్తుంది; తెలుగు వాడుకలో ఈ రూపం సహజంగా ఉండి ఉద్దేశించిన ప్రదర్శనను తెలియజేస్తుంది.
- source_word: ἀτιμία
  choice: అవమానం
  rationale: గౌరవం–అవమానం సందర్భానికి సరిపోయే పదం; ‘అపకీర్తి’ కంటే సాధారణ పాఠకునికి సహజంగా ఉంటుంది.
- source_word: αὐτῷ ἐστιν
  choice: అది అతనికి
  rationale: గ్రీకు దత్తి సంబంధాన్ని తెలుగులో సహజమైన ‘అతనికి’ రూపంతో నిలిపింది.
theological_decisions:
- issue: పౌలు వాదనలో φύσις (‘ప్రకృతి’) అర్థం
  choice: ‘ప్రకృతే’ అని విస్తృతార్థంలో ఉంచడం
  alternative: సృష్టి క్రమం; సాధారణ మానవ గ్రహింపు; సహజంగా తగినదని ఒక సంస్కృతి భావించేది
  rationale: ఈ సందర్భంలో గ్రీకు పదం వీటిలో ఏ ఒక్క అర్థానికే పరిమితమని స్పష్టంగా చెప్పదు. అందువల్ల అనువాదం వ్యాఖ్యానపరంగా ఒక నిర్ణయాన్ని రుద్దకుండా అసలు వాక్యంలోని అర్థవిస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారప్రశ్నగా రూపొందించబడింది. ‘ప్రకృతే’ అనే రూపం αὐτή యొక్క ఉద్ఘాటనను సంక్షిప్తంగా నిలుపుతుంది; వాక్యం స్వతంత్ర వచనంగా స్పష్టంగా ఉండేందుకు ప్రశ్నార్థకం వాడబడింది.
