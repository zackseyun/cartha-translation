id: 1CO.11.27
reference: 1 Corinthians 11:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: te
  text: కాబట్టి, ఎవరైనా ప్రభువు రొట్టెను తగని రీతిలో తిన్నా, లేదా ప్రభువు పాత్రలోనిది తగని రీతిలో తాగినా, వారు ప్రభువు శరీరం మరియు రక్తం విషయంలో దోషులవుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తగని రీతిలో” అనేది తినే లేదా తాగే విధానాన్ని వర్ణిస్తుంది; పాల్గొనే వ్యక్తి స్వతహాగా తగనివాడని చెప్పడం కాదు. మరింత అక్షరార్థంగా, “ప్రభువు శరీరానికి మరియు రక్తానికి దోషులవుతారు” అని అనువదించవచ్చు. గ్రీకు నిర్మాణం ప్రభువు శరీరం, రక్తం విషయంలో కలిగే దోషబాధ్యతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: కాబట్టి
  rationale: ముందటి ప్రభుభోజన చర్చనుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὃς ἂν
  choice: ఎవరైనా
  rationale: గ్రీకు అనిర్దిష్ట, సాధారణీకరణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: రొట్టెను ... తిన్నా
  rationale: నిర్దిష్ట ఉపవాక్యంలో సాధారణ షరతు భావాన్ని తెలుగులో సహజంగా ఇస్తుంది; రొట్టె ప్రభుభోజన సందర్భంలో ముందే ప్రస్తావించబడింది.
- source_word: ἢ
  choice: లేక
  rationale: మూలంలోని వియోజక సంయోజకాన్ని నిలుపుతూ, ఈ రెండు చర్యలలో దేనికైనా హెచ్చరిక వర్తిస్తుందని చూపుతుంది.
- source_word: πίνῃ τὸ ποτήριον
  choice: పాత్రలోనిది తాగినా
  rationale: గ్రీకులో పాత్ర దానిలోని పానీయానికి లక్షణార్థకంగా వాడబడింది; తెలుగులో అపార్థం లేకుండా అదే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: κύριος అనే బిరుదుకు సాధారణమైన, గౌరవప్రదమైన తెలుగు సమానం; ఇక్కడ రొట్టె, పాత్ర రెండింటికీ ప్రభువుతో ఉన్న సంబంధాన్ని సహజ వాక్యనిర్మాణంలో వర్తింపజేస్తుంది.
- source_word: ἀναξίως
  choice: తగని రీతిలో
  rationale: ఇది వ్యక్తి అంతర్గత అర్హతను వర్ణించే విశేషణం కాదు; తినడం లేదా తాగడం జరిగే విధానాన్ని వర్ణించే క్రియావిశేషణం.
- source_word: ἔνοχος ἔσται
  choice: దోషులవుతారు
  rationale: అపరాధ బాధ్యత లేదా జవాబుదారితనాన్ని గంభీరంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: ప్రభువు శరీరం మరియు రక్తం విషయంలో
  rationale: ἔνοχος తో వచ్చే షష్ఠీ విభక్తి సూచించే సంబంధిత దోషబాధ్యతను అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ἀναξίως అనే పదం ప్రభుభోజనంలో పాల్గొనేవారికి ఎలా వర్తిస్తుంది
  choice: తినడం లేదా తాగడం జరిగే తగని విధానాన్ని ఖండిస్తుంది
  alternative: పాల్గొనే వ్యక్తే స్వతహాగా అనర్హుడని చెబుతుంది
  rationale: ἀναξίως క్రియావిశేషణంగా ἐσθίῃ, πίνῃ అనే క్రియలను విశేషిస్తుంది; వ్యక్తిగత అర్హతపై తరువాతి సిద్ధాంత నిర్ణయాన్ని వచనంలోకి చేర్చకూడదు.
- issue: తినడం, తాగడం మధ్య ἢ యొక్క భావం
  choice: ‘లేక’ అని వియోజక భావాన్ని నిలుపడం
  alternative: ఆచారబద్ధ జంటగా భావించి ‘మరియు’ అని అనువదించడం
  rationale: మూల గ్రీకు ἢ అని స్పష్టంగా వియోజక సంయోజకాన్ని వాడుతుంది; అందువల్ల చర్యల్లో దేనినైనా తగని రీతిలో చేయడంపై హెచ్చరిక వర్తిస్తుంది.
- issue: ἔνοχος తో షష్ఠీ విభక్తి యొక్క న్యాయసంబంధ భావం
  choice: ‘విషయంలో దోషులు’
  alternative: ‘శరీరానికి, రక్తానికి దోషులు’
  rationale: గ్రీకు నిర్మాణంలోని గంభీరమైన దోషబాధ్యతను నిలుపుతూ, ఆ బాధ్యత యొక్క ఖచ్చిత న్యాయ స్వరూపాన్ని అనువాదం ద్వారా అతిగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘తగని రీతిలో’ క్రియావిశేషణ భావాన్ని స్పష్టం చేస్తుంది. ఏకవచన లింగనిరపేక్ష ‘ఎవరైనా’కు అనుగుణంగా గౌరవ/సాధారణ బహువచన క్రియారూపం ‘వారు ... దోషులవుతారు’ ఉపయోగించబడింది.
