id: 1CO.11.24
reference: 1 Corinthians 11:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: te
  text: ఆయన కృతజ్ఞతలు చెల్లించి, దానిని విరిచి, “ఇది మీ కోసం ఉన్న నా శరీరం.[a][b] నన్ను జ్ఞాపకం చేసుకోవడానికి దీన్ని చేస్తూ ఉండండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ పక్షంగా ఉన్న’ లేక ‘మీ నిమిత్తం ఉన్న.’
    reason: lexical_alternative
  - marker: b
    text: 'కొన్ని ప్రతుల్లో ‘మీ కోసం’ తరువాత ‘విరిచబడిన’ అనే పదం ఉంది: ‘ఇది మీ కోసం విరిచబడిన నా శరీరం.’'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: కృతజ్ఞతలు చెల్లించి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన కృతజ్ఞతాస్తుతిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔκλασεν
  choice: దానిని విరిచి
  rationale: క్రియకు సందర్భంలో రొట్టె కర్మగా ఉంది; ‘దానిని’ అని చెప్పడం తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: ఇది ... నా శరీరం
  rationale: గ్రీకు సంధాయక వాక్యాన్ని నేరుగా ఉంచి, ‘సూచిస్తుంది’ వంటి సిద్ధాంతపరమైన వివరణను చేర్చదు.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: మీ కోసం ఉన్న
  rationale: ὑπέρ యొక్క లబ్ధిదాయక/ప్రాతినిధ్య భావాన్ని నిలుపుతూ, ప్రాయశ్చిత్త స్వరూపాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: τοῦτο ποιεῖτε
  choice: దీన్ని చేస్తూ ఉండండి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపంలోని పునరావృత లేదా కొనసాగింపు భావాన్ని ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: నన్ను జ్ఞాపకం చేసుకోవడానికి
  rationale: క్రియాశీల జ్ఞాపకాచరణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఇది నా శరీరం’ అనే ప్రభుభోజన వాక్యపు భావం
  choice: ‘ఇది నా శరీరం’ అనే నేరమైన నిర్మాణాన్ని నిలిపాం.
  alternative: ‘ఇది నా శరీరాన్ని సూచిస్తుంది’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: మూల గ్రీకు తరువాతి కాలపు సాక్రమెంటల్ లేదా ప్రతీకాత్మక వివాదాన్ని తానే పరిష్కరించదు; అందువల్ల ఆ ఉద్రిక్తతను అనువాదంలో నిలిపాం.
- issue: ὑπὲρ ὑμῶν యొక్క భావబలం
  choice: మీ కోసం ఉన్న
  alternative: మీ పక్షంగా ఉన్న / మీ నిమిత్తం ఉన్న
  rationale: స్వీకర్తల ప్రయోజనం లేదా వారి పక్షంగా ఉండే భావాన్ని కాపాడుతూ, నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. మూలంలోని క్రమం, పునరావృత ఆజ్ఞ, ప్రభుభోజన సంబంధిత సిద్ధాంతపరమైన అనిశ్చితి నిలుపబడ్డాయి.
