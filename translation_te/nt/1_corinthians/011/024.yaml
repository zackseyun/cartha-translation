    rationale: The note says that some manuscripts add “broken” after “for you”; its anchor must occur at that phrase so readers can identify the relevant textual location.
  - severity: low
    issue: The variant quotation uses “విరువబడిన.”
    rationale: “విరిచబడిన” is clearer modern standard Telugu for the passive participial sense of the variant κλώμενον (“broken”).
