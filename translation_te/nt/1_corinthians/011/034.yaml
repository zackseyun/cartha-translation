  verdict: revise
  source_fidelity: The draft preserves the conditional singular subject (εἴ τις), the imperative to eat at home, the plural reference to the congregation's assembling (συνέρχησθε), and the future promise of further directions. Its rendering of κρίμα as ‘తీర్పు’ appropriately avoids deciding that the term necessarily means final condemnation.
  naturalness: The placement of ‘మీరు తీర్పుకు గురయ్యేలా సమకూడకుండా’ before ‘అతడు ఇంట్లోనే భోజనం చేయాలి’ is syntactically heavy and temporarily obscures the main imperative. Reordering the purpose clause produces natural modern Telugu while retaining the Greek sense.
  terminology: ‘తీర్పు,’ ‘సమకూడడం,’ and ‘ఆదేశాలు ఇస్తాను’ are appropriate. ‘తినాలి’ is slightly more direct and natural than ‘భోజనం చేయాలి’ here, while retaining the third-person imperative force.
  issues:
  - severity: low
    issue: Awkward scope and word order in the purpose clause
