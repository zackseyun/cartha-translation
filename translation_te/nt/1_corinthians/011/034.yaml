  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: te
  text: ఎవరైనా ఆకలితో ఉంటే, అతడు ఇంట్లోనే తినాలి, మీరు తీర్పుకు గురికాకుండా సమకూడేందుకు. మిగిలిన విషయాల గురించి నేను వచ్చినప్పుడు ఆదేశాలు ఇస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శిక్షావిధికి గురికాకుండా.’ గ్రీకు పదమైన κρίμαకు ‘తీర్పు’ లేదా ‘శిక్షావిధి’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ 29–32 వచనాల్లో పౌలు అంతిమ శిక్షావిధి కంటే ప్రభువు ప్రస్తుత క్రమశిక్షణ గురించి మాట్లాడుతున్నందున, ‘తీర్పు’ సందర్భానికి బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: ఆకలితో ఉంటే
  rationale: వర్తమాన స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν οἴκῳ
  choice: ఇంట్లోనే
  rationale: సంఘ కూడికలో తినడానికి విరుద్ధంగా వ్యక్తి తన ఇంటి వాతావరణంలో తినాలని సూచిస్తుంది; ‘నే’ సందర్భంలోని వ్యత్యాసాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: ἐσθιέτω
  choice: భోజనం చేయాలి
  rationale: తృతీయ పురుష ఏకవచన ఆజ్ఞార్థక బలాన్ని సహజమైన తెలుగు విధ్యర్థక రూపంలో నిలుపుతుంది.
- source_word: εἰς κρίμα
  choice: తీర్పుకు గురయ్యేలా
  rationale: κρίμαలోని న్యాయతీర్పు భావాన్ని నిలుపుతూ, దానిని అంతిమ శిక్షగా ముందే నిర్ణయించదు.
- source_word: συνέρχησθε
  choice: సమకూడకుండా
  rationale: ఈ భాగమంతటా సంఘంగా కూడివచ్చే భావాన్ని తెలిపే క్రియాసంబంధాన్ని నిలుపుతుంది.
- source_word: Τὰ δὲ λοιπὰ
  choice: మిగిలిన విషయాల గురించి
  rationale: ఇంకా పరిష్కరించవలసిన అంశాలకు సహజమైన మార్పుసూచక ప్రయోగం.
- source_word: ὡς ἂν ἔλθω
  choice: నేను వచ్చినప్పుడు
  rationale: పౌలు ఎదురుచూస్తున్న భవిష్యత్ రాకను సహజంగా వ్యక్తపరుస్తుంది; సమయానికి ఉన్న స్వల్ప అనిర్దిష్టతను అతిగా ముందుకు తేవదు.
- source_word: διατάξομαι
  choice: ఆదేశాలు ఇస్తాను
  rationale: ఏం చేయాలో క్రమపరచి నిర్దేశించే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ప్రభుభోజన కూడికకు సంబంధించిన హెచ్చరికలో κρίμα అర్థం
  choice: తీర్పు
  alternative: శిక్షావిధి; దోషిగా తీర్పు
  rationale: తక్షణ సందర్భం (29–32 వచనాలు) ప్రభువు ప్రస్తుత తీర్పు/క్రమశిక్షణను లోకంతో కలిగే అంతిమ శిక్షావిధి నుండి వేరుచేస్తుంది. ‘తీర్పు’ అనే పదం ఈ భేదాన్ని నిలుపుతూ మూలపాఠం చెప్పేదానికంటే బలమైన సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
- issue: τις అనే అనిర్దిష్ట ఏకవచన కర్తతో ఉన్న ఆజ్ఞ
  choice: ఎవరైనా ... అతడు ... చేయాలి
  alternative: ఎవరైనా ... వారు ... చేయాలి; ఆ వ్యక్తి ... చేయాలి
  rationale: గ్రీకు పాఠంలోని అనిర్దిష్ట ఏకవచనాన్ని, తృతీయ పురుష ఏకవచన ఆజ్ఞను తెలుగులో స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘సమకూడడం’ అనే పదం సంఘ కూడికతో ఉన్న సందర్భ సంబంధాన్ని నిలుపుతుంది.
