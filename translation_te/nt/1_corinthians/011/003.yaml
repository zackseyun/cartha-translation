source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: te
  text: 'అయితే, మీరు తెలుసుకోవాలని నేను కోరుతున్నాను: ప్రతి పురుషునికి శిరస్సు మెస్సీయే[a]; స్త్రీకి శిరస్సు పురుషుడు[b]; మెస్సీయకు శిరస్సు దేవుడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శిరస్సు’ అనే గ్రీకు రూపకాన్ని ‘మూలం’ లేదా ‘అధికారమున్నవాడు’ అనే అర్థాల్లో కూడా అర్థం చేసుకోవచ్చు; ప్రధాన పాఠ్యంలో రూపకాన్నే ఉంచాం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘స్త్రీ’, ‘పురుషుడు’ అనే పదాలను ‘భార్య’, ‘భర్త’ అని కూడా చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: అయితే, మీరు ఇది తెలుసుకోవాలని నేను కోరుతున్నాను
  rationale: పౌలు తన ఉద్దేశాన్ని ప్రత్యక్షంగా తెలియజేసే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; δὲ సూచించే స్వల్ప మలుపును ‘అయితే’ తెలియజేస్తుంది.
- source_word: παντὸς ἀνδρὸς
  choice: ప్రతి పురుషునికి
  rationale: ἀνήρ ఇక్కడ సాధారణంగా పురుషుణ్ని సూచించగలదు; మొదటి సమాంతర వాక్యభాగంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: κεφαλή
  choice: శిరస్సు
  rationale: మూలంలోని రూపకాన్ని అలాగే ఉంచి, ‘మూలం’ లేదా ‘అధికారం కలవాడు’ అనే వివాదాస్పద అర్థాల్లో ఏదో ఒకదాన్ని ప్రధాన పాఠ్యంలో ఖరారు చేయదు.
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστόςను ఇక్కడ బిరుదుగా గ్రహించి ‘మెస్సీయ’గా అనువదించడం రెండు సందర్భాల్లోనూ సారూప్యతను కాపాడుతుంది.
- source_word: γυναικὸς
  choice: స్త్రీకి
  rationale: γυνήకు ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు సాధ్యమైనా, ప్రధాన పాఠ్యంలో విస్తృతమైన స్త్రీ అర్థాన్ని ఉంచి వైవాహిక పఠనాన్ని పాదటీపులో తెలియజేస్తుంది.
- source_word: ὁ ἀνήρ
  choice: పురుషుడు
  rationale: γυνήతో సమాంతరంగా సాధారణ ‘పురుషుడు’ అనే అర్థాన్ని నిలుపుతుంది; ‘భర్త’ అనే సాధ్యమైన అర్థాన్ని పాదటీపులో ఉంచుతుంది.
- source_word: ὁ θεός
  choice: దేవుడు
  rationale: θεόςకు ప్రామాణికమైన, సహజమైన తెలుగు అనువాదం.
theological_decisions:
- issue: మూడు సమాంతర వాక్యభాగాల్లో κεφαλή అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘శిరస్సు’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘మూలం’ లేదా ‘అధికారం కలవాడు’ అని స్పష్టీకరించడం
  rationale: గ్రీకు పదంలోని నిజమైన వ్యాఖ్యాన భేదాన్ని అనువాదం ముందుగానే పరిష్కరించకుండా రూపకాన్నే నిలుపుతుంది.
- issue: ἀνήρ / γυνήలను పురుషుడు/స్త్రీగా లేదా భర్త/భార్యగా చదవడం
  choice: ప్రధాన పాఠ్యంలో ‘పురుషుడు/స్త్రీ’
  alternative: ‘భర్త/భార్య’
  rationale: సమాంతర నిర్మాణం విస్తృత పఠనానికి అనుకూలమైనప్పటికీ, పదాల వైవాహిక అర్థం మరియు పరిసర సందర్భం కారణంగా ప్రత్యామ్నాయాన్ని పాదటీపులో నిలుపుతుంది.
- issue: ‘మెస్సీయకు శిరస్సు దేవుడు’ అనే చివరి వాక్యభాగం
  choice: వివరణాత్మక విస్తరణ లేకుండా మూల నిర్మాణాన్ని నేరుగా అనువదించడం
  alternative: కేవలం కార్యపరమైన క్రమాన్ని పేర్కొనే వ్యాఖ్యానాత్మక పరామర్శ
  rationale: వాక్యంలోని ధార్మిక ఉద్వేగాన్ని బలహీనపరచకుండా, అలాగే మూలంలో లేని సిద్ధాంత వివరణను చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూడు సమాంతర వాక్యభాగాలను అర్ధవిరామాలతో చూపించి మూలంలోని వాక్య నిర్మాణాన్ని స్పష్టంగా నిలిపాం. ‘శిరస్సు’ రూపకం సాధారణ ‘తల’ కంటే ఈ ధార్మిక సందర్భంలో మర్యాదగాను స్థిరంగాను వినిపిస్తుంది.
