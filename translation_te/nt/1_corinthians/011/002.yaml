id: 1CO.11.2
reference: 1 Corinthians 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: te
  text: మీరు అన్ని విషయాల్లో నన్ను గుర్తుంచుకొని, నేను మీకు అప్పగించినట్లుగానే సంప్రదాయాలను[a] దృఢంగా నిలుపుకుంటున్నందుకు మిమ్మల్ని మెచ్చుకుంటున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బోధనలను’ లేదా ‘ఉపదేశాలను’; గ్రీకులో ‘సంప్రదాయాలను,’ అంటే అప్పగించబడిన వాటిని.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: మెచ్చుకుంటున్నాను
  rationale: ప్రశంసించడం లేదా అభినందించడం అనే భావాన్ని సందర్భానుకూలంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప విషయాంతర సూచకం; తెలుగులో వాక్యప్రవాహమే ఆ మార్పును సహజంగా తెలియజేస్తుంది. బలమైన వ్యతిరేకతను చేర్చలేదు.
- source_word: ὅτι
  choice: ఉన్నందుకు
  rationale: పౌలు వారిని మెచ్చుకోవడానికి గల కారణాన్ని సహజమైన తెలుగు కారణార్థక నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: πάντα μου μέμνησθε
  choice: మీరు అన్ని విషయాల్లో నన్ను జ్ఞాపకం చేసుకుంటూ
  rationale: πάντα యొక్క విస్తృత పరిధినీ, μέμνησθε సూచించే కొనసాగుతున్న జ్ఞాపకభావాన్నీ కాపాడుతుంది.
- source_word: καθὼς παρέδωκα ὑμῖν
  choice: నేను మీకు అప్పగించినట్లుగానే
  rationale: బోధన లేదా ఆచారాన్ని స్వీకర్తలకు అందించి అప్పగించే భావాన్ని, అలాగే καθὼς లోని సరిపోలికను నిలుపుతుంది.
- source_word: τὰς παραδόσεις
  choice: సంప్రదాయాలను
  rationale: చేతికి అందించబడిన లేదా తరలించబడిన విషయాలు అనే మూలపద భావాన్ని కాపాడుతుంది; దానిని కేవలం సాధారణ బోధనలుగా కుదించదు.
- source_word: κατέχετε
  choice: గట్టిగా పట్టుకొని ఉన్న
  rationale: కేవలం కలిగి ఉండటం కాక, వాటిని నిలకడగా పాటిస్తూ అంటిపెట్టుకొని ఉండే భావాన్ని ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: సంఘ సందర్భంలో παραδόσεις అనువాదం
  choice: సంప్రదాయాలు
  alternative: బోధనలు; ఉపదేశాలు
  rationale: ఇక్కడ పౌలు కొరింథీయులకు అప్పగించిన విషయాలనే వచనం ప్రశంసిస్తోంది. ‘సంప్రదాయాలు’ అనేది అప్పగించబడినదనే మూలభావాన్ని నిలుపుతూ, తరువాతి ఏ ప్రత్యేక మతశాఖ సిద్ధాంతాన్నీ వచనంలోకి తీసుకురాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. రెండవ పురుష బహువచనం సందర్భం ద్వారా స్పష్టమవుతుంది. మూలంలోని δὲ ను అనవసరమైన ‘ఇప్పుడు’తో వ్యక్తపరచలేదు.
