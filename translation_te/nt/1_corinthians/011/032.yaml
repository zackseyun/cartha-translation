id: 1CO.11.32
reference: 1 Corinthians 11:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κρινόμενοι δὲ ⸀ὑπὸ κυρίου παιδευόμεθα, ἵνα μὴ σὺν τῷ κόσμῳ κατακριθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: te
  text: అయితే, ప్రభువు చేత మనం తీర్పు పొందుతున్నప్పుడు, క్రమశిక్షణ పొందుతున్నాం; లోకంతో పాటు మనం శిక్షావిధికి గురికాకుండునట్లు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρινόμενοι
  choice: తీర్పు పొందుతున్నప్పుడు
  rationale: వర్తమాన కర్మణి అసమాపక క్రియను సందర్భానుసారంగా కాలార్థకంగా తీసుకుని, కొనసాగుతున్న చర్య భావాన్ని నిలిపింది. κρίνω యొక్క న్యాయనిర్ణయ భావాన్ని కాపాడుతూ, దాన్ని అంతిమ శిక్షావిధితో కలపలేదు.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనంలోని హెచ్చరికతో ఉన్న స్వల్ప వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ὑπὸ κυρίου
  choice: ప్రభువు చేత
  rationale: ὑπό + షష్ఠీ విభక్తి తెలిపే కర్తృత్వాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘యేసు’ అనే విస్తరణను చేర్చలేదు.
- source_word: παιδευόμεθα
  choice: మనం శిక్షణ పొందుతున్నాం
  rationale: παιδεύω లోని దిద్దుబాటు, క్రమశిక్షణ, బోధనాత్మక శిక్షణ భావాలను కలిపి ఉంచుతుంది; కేవలం శిక్షించడం అనే ప్రతీకార భావానికి పరిమితం చేయదు.
- source_word: ἵνα μὴ
  choice: కలగకుండా ఉండేందుకే
  rationale: ప్రయోజనార్థక భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: σὺν τῷ κόσμῳ
  choice: లోకంతో పాటు
  rationale: σύν తెలిపే సహభాగితను, ఒకే గతి పొందే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: κατακριθῶμεν
  choice: మనకు శిక్షావిధి కలగకుండా
  rationale: κατακρίνω యొక్క ప్రతికూల న్యాయతీర్పు లేదా దోషిగా తీర్చి శిక్ష విధించే భావాన్ని తెలియజేస్తూ, ముందున్న κρίνω (‘తీర్పు పొందడం’)తో వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ప్రస్తుత దైవిక తీర్పుకు, లోకంతో కలిగే శిక్షావిధికి మధ్య సంబంధం
  choice: ప్రభువు ఇచ్చే ప్రస్తుత తీర్పు దిద్దుబాటు చేసే శిక్షణగా ఉండి, లోకంతో పాటు శిక్షావిధి పొందకుండా చేసే ఉద్దేశాన్ని కలిగి ఉందని వచనం చెబుతున్నట్లుగా అనువదించబడింది.
  alternative: ఇది విశ్వాసులు-అవిశ్వాసులు అనే విభజనను సూచించకుండా, సాధారణంగా ప్రస్తుతకాల శిక్షను మాత్రమే సూచిస్తుందని చదవవచ్చు.
  rationale: κρινόμενοι, παιδευόμεθα, κατακριθῶμεν మధ్యనున్న పదార్థ వ్యత్యాసాన్ని నిలిపి, అంతిమ తీర్పు, నిలకడ, లేదా సంస్కార ఫలితాల గురించి సంపూర్ణ సిద్ధాంతాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘తీర్పు’ మరియు ‘శిక్షావిధి’ అనే వేర్వేరు పదాలతో κρίνω–κατακρίνω వ్యత్యాసాన్ని నిలిపాం; παιδεύω కోసం దిద్దుబాటు లక్ష్యాన్ని సూచించే ‘శిక్షణ’ను ఎంచుకున్నాం.
