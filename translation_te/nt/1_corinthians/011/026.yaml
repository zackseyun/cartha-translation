id: 1CO.11.26
reference: 1 Corinthians 11:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: te
  text: ఎందుకంటే, మీరు ఈ రొట్టెను తిని, పాత్రలోనిది తాగినప్పుడల్లా[a][b], ప్రభువు వచ్చేవరకు ఆయన మరణాన్ని ప్రకటిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఈ రొట్టెను తిని, పాత్రలోనిది తాగే ప్రతిసారీ.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ఇక్కడ “ఈ పాత్ర” అని కాకుండా నిర్దిష్టమైన “పాత్ర” అని ఉంది; అయితే ఏ పాత్ర ఉద్దేశించబడిందో ముందున్న సందర్భం స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: తాగినప్పుడల్లా
  rationale: ఈ నిర్మాణం ఒక పని జరిగిన ప్రతిసారీ అనే అనిశ్చిత పునరావృత భావాన్ని వ్యక్తం చేస్తుంది. ‘అప్పుడల్లా’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి వివరణాత్మక ఆధారాన్ని కలుపుతున్న γάρ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐσθίητε
  choice: తిని
  rationale: కాలసూచక ఉపవాక్యంలో ఉన్న వర్తమాన సుబ్జంక్టివ్‌ను తెలుగులో పునరావృత చర్యగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄρτον τοῦτον
  choice: ఈ రొట్టెను
  rationale: ἄρτος‌కు సాధారణ అర్థమైన ‘రొట్టె’ను, τοῦτον‌లోని సూచనార్థంతో కలిపి నేరుగా ప్రతిబింబిస్తుంది.
- source_word: τὸ ποτήριον πίνητε
  choice: ఆ పాత్రలోనిది తాగినప్పుడు
  rationale: గ్రీకులో అక్షరార్థంగా ‘పాత్రను తాగడం’ అనే సంక్షిప్త ప్రయోగం ఉంది. తెలుగులో పాత్రలో ఉన్నదాన్ని తాగడం అనే ఉద్దేశాన్ని సహజంగా తెలిపి, మూలంలోని నిర్దిష్ట పాత్ర సూచనను ‘ఆ’తో నిలుపుతుంది.
- source_word: καταγγέλλετε
  choice: ప్రకటిస్తారు
  rationale: బహిరంగంగా తెలియజేయడం లేదా ప్రకటించడం అనే క్రియ యొక్క గంభీరమైన, ప్రకటనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: ఆయన మరణాన్ని
  rationale: ముందున్న ‘ప్రభువు’నే సూచించే సహజ తెలుగు సర్వనామంతో సంబంధాన్ని స్పష్టంగా ఉంచుతూ, మరణమే ప్రకటన యొక్క కర్మ అని నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: పౌలు వాడుకలోని κύριος‌కు సరైన, గౌరవప్రదమైన సాధారణ తెలుగు సమానార్థకం.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: ప్రభువు వచ్చేవరకు
  rationale: రాక వరకు కొనసాగే కాలపరిమితిని సహజంగా తెలుపుతుంది; గ్రీకులో అంతర్లీనంగా ఉన్న కర్తను సమీప సందర్భం ప్రకారం ప్రభువుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἄχρι οὗ ἔλθῃలో అంతర్లీన కర్త
  choice: వచ్చేవాడు ప్రభువే అని ‘ప్రభువు వచ్చేవరకు’గా వ్యక్తం చేయడం
  alternative: ‘ఆయన వచ్చేవరకు’
  rationale: ముందున్న ‘ప్రభువు’ సహజమైన పూర్వపదం; ఈ పునరుక్తి తెలుగులో సందిగ్ధతను నివారిస్తుంది. ఇది బయటి సిద్ధాంతాన్ని చేర్చడం కాదు, గ్రీకు సందర్భంలోని అంతర్లీన కర్తను వెల్లడించడం.
- issue: ప్రభువు భోజనానికి సంబంధించిన భాష
  choice: రొట్టె తినడం, పాత్రలోనిది తాగడం, ప్రభువు మరణాన్ని ప్రకటించడం అనే వాక్యంలోని చర్యలను మాత్రమే నేరుగా అనువదించడం
  alternative: సంస్కారపరమైన లేదా కేవలం జ్ఞాపకార్థమైన వివరణను అనువాదంలో చేర్చడం
  rationale: ఈ వచనం ఆ చర్య ప్రభువు మరణాన్ని ప్రకటిస్తుందని చెబుతుంది; దాని పూర్తి దైవశాస్త్ర వివరణను నిర్ణయించదు. అందువల్ల ఏ సంప్రదాయానికీ ప్రత్యేకమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గ్రీకు పాత్ర-విషయ సూచక ప్రయోగాన్ని తెలుగులో సహజం చేయడానికి ‘ఆ పాత్రలోనిది’ అని ఇచ్చాం. మూలంలోని పునరావృత భావం, ప్రకటనాత్మక గంభీరత, ప్రభువు రాక వరకు కొనసాగే కాలపరిమితి నిలుపబడ్డాయి.
