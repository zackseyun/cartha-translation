id: 1CO.11.25
reference: 1 Corinthians 11:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: te
  text: 'అదే విధంగా, భోజనం చేసిన తర్వాత ఆయన పాత్రను కూడా తీసుకొని ఇలా అన్నాడు: “ఈ పాత్ర నా రక్తములోని కొత్త ఒడంబడిక[a]. మీరు దీనిని తాగినప్పుడల్లా[b], నన్ను జ్ఞాపకం చేసుకోవడానికి ఇది చేస్తూ ఉండండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ పాత్ర నా రక్తములోని కొత్త వీలునామా.” గ్రీకు పదానికి ‘ఒడంబడిక’ లేదా ‘వీలునామా’ అనే అర్థాలు రావచ్చు; ఇక్కడి బైబిలు నేపథ్యానికి ‘ఒడంబడిక’ బాగా సరిపోతుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మీరు దీనిని ఎన్నిసార్లు తాగితే అన్నిసార్లు.” గ్రీకు పదబంధం పునరావృతమయ్యే సందర్భాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: అదే విధంగా… కూడా
  rationale: ముందు రొట్టె విషయంలో జరిగిన దానికి దీనితో ఉన్న సమాంతరతను, అలాగే καί భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸ ποτήριον
  choice: పాత్రను
  rationale: ఇక్కడ తాగే పాత్ర ఉద్దేశించబడింది. ‘పాత్ర’ సాధారణమైన, గౌరవప్రదమైన తెలుగు; మూలంలో లేని ప్రత్యేక ఆరాధనా పదప్రయోగాన్ని ఇది చేర్చదు.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: భోజనం చేసిన తర్వాత
  rationale: μετάతో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ తెలిపే కాలసంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λέγων
  choice: తీసుకొని ఇలా అన్నాడు
  rationale: λέγων అంటే ‘అంటూ/ఇలా అన్నాడు.’ ముందు వాక్యంలోని సమాంతర చర్య వల్ల గ్రీకులో సూచితమైన ‘తీసుకొని’ అనే క్రియను తెలుగులో వాక్యపూర్తి కోసం స్పష్టం చేసింది; దీనిని స్వతంత్ర కొత్త సమాచారంగా చేర్చలేదు.
- source_word: ἡ καινὴ διαθήκη
  choice: కొత్త ఒడంబడిక
  rationale: διαθήκη ఇక్కడ పాత నిబంధనలోని ఒడంబడిక నేపథ్యాన్ని సూచిస్తుంది. ‘ఒడంబడిక’ దాని సంబంధాత్మక, బైబిలు భావాన్ని ‘వీలునామా’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: నా రక్తంలో ఉన్న
  rationale: ἐν అనే విభక్తి సంబంధాన్ని ‘లో’ అనే రూపంతో దగ్గరగా నిలుపుతూ, ‘నా రక్తం ద్వారా స్థాపించబడిన’ వంటి వివరణాత్మక విస్తరణను నివారిస్తుంది.
- source_word: τοῦτο ποιεῖτε
  choice: ఇలా చేస్తూ ఉండండి
  rationale: వర్తమాన ఆజ్ఞారూపం సూచించే కొనసాగింపు లేదా పునరావృత ఆచరణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: మీరు దీనిని తాగినప్పుడల్లా
  rationale: ఈ నిర్మాణం పునరావృతమయ్యే సందర్భాలను సూచిస్తుంది. ‘దీనిని’ అనే కర్మ పాత్రను సూచిస్తూ తెలుగులో వాక్యాన్ని సహజంగా చేస్తుంది.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: నన్ను జ్ఞాపకం చేసుకోవడానికి
  rationale: ἀνάμνησις సూచించే క్రియాశీల జ్ఞాపకాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం మానసిక స్మరణకే పరిమితం చేసే అదనపు వివరణను చేర్చదు.
theological_decisions:
- issue: ప్రభుభోజన సందర్భంలో διαθήκη అర్థం
  choice: ఒడంబడిక
  alternative: వీలునామా
  rationale: రక్తంతో స్థాపితమయ్యే ఒడంబడిక అనే పాత నిబంధన నేపథ్యానికి ‘ఒడంబడిక’ బాగా సరిపోతుంది. అయినా గ్రీకు పదానికి న్యాయపరమైన ‘వీలునామా’ అనే అర్థం కూడా ఉండగలదని పాదసూచికలో నిలిపాం.
- issue: పాత్రకు, ఒడంబడికకు మధ్య ఉన్న సంబంధం
  choice: ‘ఈ పాత్ర నా రక్తంలో ఉన్న కొత్త ఒడంబడిక’ అనే ప్రత్యక్ష గుర్తింపును నిలుపడం
  alternative: ‘ఈ పాత్ర నా రక్తం ద్వారా స్థాపించబడిన కొత్త ఒడంబడికకు ప్రతీక’
  rationale: గ్రీకు వాక్యం ప్రత్యక్షంగా గుర్తింపును ప్రకటిస్తుంది; అది ‘ప్రతీక’ అని గానీ, నిర్దిష్ట సాక్రమెంటు సిద్ధాంతం ప్రకారం గానీ వివరించదు. అందువల్ల మూలంలోని theological tensionను పరిష్కరించకుండా నిలిపాం.
- issue: ఆజ్ఞ పునరావృత స్వభావం
  choice: ‘ఇలా చేస్తూ ఉండండి’
  alternative: ‘ఇలా చేయండి’
  rationale: ποιεῖτε అనే వర్తమాన ఆజ్ఞారూపం, దాని వెంట వచ్చే ‘తాగినప్పుడల్లా’ అనే మాటతో కలిసి, పునరావృత ఆచరణను సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘పాత్ర,’ ‘భోజనం,’ ‘జ్ఞాపకం చేసుకోవడం’ వంటి సాధారణ పదాలతో పాఠ్యాన్ని అందుబాటులో ఉంచుతూ, ‘ఒడంబడిక’ అనే అవసరమైన బైబిలు పదాన్ని సందర్భానుగుణంగా నిలిపాం. మూలంలోని ప్రత్యక్ష వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు కాపాడి, ఏ ప్రత్యేక సంఘ సంప్రదాయానికీ అనుకూలంగా అర్థాన్ని విస్తరించలేదు.
