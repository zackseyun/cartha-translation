revisions:
- from: 'అదే విధంగా, భోజనం చేసిన తర్వాత ఆయన పాత్రను కూడా తీసుకొని ఇలా అన్నాడు: “ఈ పాత్ర నా రక్తంలో ఉన్న కొత్త ఒడంబడిక[a]. మీరు దీనిని తాగినప్పుడల్లా[b], నన్ను జ్ఞాపకం చేసుకోవడానికి ఇలా చేస్తూ ఉండండి.”'
  to: 'అదే విధంగా, భోజనం చేసిన తర్వాత ఆయన పాత్రను కూడా తీసుకొని ఇలా అన్నాడు: “ఈ పాత్ర నా రక్తములోని కొత్త ఒడంబడిక[a]. మీరు దీనిని తాగినప్పుడల్లా[b], నన్ను జ్ఞాపకం చేసుకోవడానికి ఇది చేస్తూ ఉండండి.”'
  rationale: The revision makes only two controlled changes. “నా రక్తములోని” preserves the Greek prepositional expression without importing an interpretive causal phrase (“through/by my blood”) or suggesting that the covenant is physically located in the blood. “ఇది చేస్తూ ఉండండి” more explicitly carries τοῦτο ποιεῖτε while retaining the present imperative’s continuing or repeated sense. The footnote is conformed to the revised syntax.
