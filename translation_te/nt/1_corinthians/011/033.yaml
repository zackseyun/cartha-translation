id: 1CO.11.33
reference: 1 Corinthians 11:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: te
  text: కాబట్టి, నా సోదరులారా,[a] మీరు భోజనం చేయడానికి కూడివచ్చినప్పుడు, ఒకరి కోసం ఒకరు వేచి ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా సోదర సోదరీమణులారా”; గ్రీకులో “సోదరులారా” అని ఉంది. మిశ్రమ సంఘాన్ని సంబోధించడానికి గ్రీకు తరచుగా పురుషరూపాన్ని ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: కాబట్టి
  rationale: ముందు చెప్పిన ప్రభువు భోజన దుర్వినియోగాల సవరణనుంచి తీయబడిన ముగింపును సూచించే సహజమైన తెలుగు అన్వయపదం.
- source_word: ἀδελφοί μου
  choice: నా సోదరులారా
  rationale: సంబోధనలో ఉన్న బహువచన పురుషరూపాన్నీ, μου అనే స్వత్వ భావాన్నీ నేరుగా నిలుపుతుంది; సంఘమంతటికీ వర్తించే ప్రతినిధి ప్రయోగాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: συνερχόμενοι
  choice: మీరు ... కూడివచ్చినప్పుడు
  rationale: ఆజ్ఞ వర్తించే సందర్భాన్ని తెలిపే క్రియావిశేషణాత్మక అసమాపక క్రియను సహజమైన తెలుగు కాలవాక్యంగా అందిస్తుంది.
- source_word: εἰς τὸ φαγεῖν
  choice: భోజనం చేయడానికి
  rationale: ఉద్దేశాన్ని తెలిపే ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌ను సహజంగా వ్యక్తపరుస్తుంది; భోజనం స్వరూపాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: ἀλλήλους
  choice: ఒకరి కోసం ఒకరు
  rationale: పరస్పర సర్వనామ భావాన్ని సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: ἐκδέχεσθε
  choice: వేచి ఉండండి
  rationale: కొంతమంది ఇతరులకంటే ముందే తినడం గురించిన సమీప సందర్భంలో, కలిసి భోజనం ప్రారంభించే ముందు ఇతరుల కోసం వేచి ఉండాలనే ఆచరణాత్మక ఆజ్ఞే అత్యంత సహజమైన భావం.
theological_decisions:
- issue: ἀδελφοί లోని ప్రతినిధి పురుష సంబోధన
  choice: ప్రధాన పాఠ్యంలో ‘సోదరులారా’ అని ఉంచి, అది సోదరీమణులను కూడా కలుపుకొని సంఘాన్ని సంబోధించగలదని పాదసూచికలో తెలపడం.
  alternative: ‘సోదర సోదరీమణులారా’
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పురుష బహువచనం; అయితే మిశ్రమ సంఘమంతటినీ సంబోధించడానికి తరచుగా వాడబడుతుంది. ప్రధాన పాఠ్యం మూలరూపాన్ని నిలుపుతుండగా పాదసూచిక దాని సంభావ్య సమగ్ర పరిధిని స్పష్టం చేస్తుంది.
- issue: ἐκδέχεσθε యొక్క భావ పరిధి
  choice: ‘వేచి ఉండండి’
  alternative: ‘స్వీకరించండి’ లేదా ‘ఆహ్వానించండి’
  rationale: ఈ క్రియకు స్వీకరించడం అనే భావం ఉండగలిగినా, కొందరు ముందుగా తినడం వల్ల ఏర్పడిన సమస్యను సరిచేసే 21, 33 వచనాల సందర్భం ‘వేచి ఉండండి’ అనే భావాన్ని బలపరుస్తుంది; ప్రత్యామ్నాయ భావాన్ని సిద్ధాంతపరంగా బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంఘ సంబోధనను ఉపయోగించాం. ‘కూడివచ్చినప్పుడు’ ఈ అధ్యాయంలో కనిపించే సమూహ సమావేశ భావాన్ని నిలుపుతుంది; వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
