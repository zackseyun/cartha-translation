language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνερχομένων οὖν ὑμῶν ἐπὶ τὸ αὐτὸ οὐκ ἔστιν κυριακὸν δεῖπνον φαγεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: te
  text: కాబట్టి మీరు ఒకేచోట కూడివచ్చినప్పుడు, ప్రభువు భోజనం తినడమనే మాటే లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ప్రభువు భోజనం తినడం లేదు.” అంటే, వారి ప్రవర్తనవల్ల వారు తినేది ఇక ప్రభువు భోజనంగా పరిగణించబడదు.
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: మీరు ... సమావేశమైనప్పుడు
  rationale: ὑμῶνతో కూడిన షష్ఠీ విభక్తి కృదంతం కాలార్థాన్ని ఇస్తుంది. ‘సమావేశమైనప్పుడు’ సామూహికంగా కూడడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వచనాల్లో ప్రస్తావించిన విభేదాలనుబట్టి తీసే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: ἐπὶ τὸ αὐτό
  choice: ఒకేచోట
  rationale: ఒకే స్థలంలో లేదా ఒకే సభగా కూడడమనే స్థానార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: తినడానికైతే కాదు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తమైన, కొంత అస్పష్టమైన నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, వారి కూడిక ప్రభువు భోజనం తినడంగా నిజంగా పరిగణించబడదనే సందర్భార్థాన్ని సూచిస్తుంది.
- source_word: κυριακὸν
  choice: ప్రభువు
  rationale: ‘ప్రభువుకు చెందిన’ అనే విశేషణార్థాన్ని తెలుగులో సహజమైన సంబంధ రూపంతో వ్యక్తం చేస్తుంది.
- source_word: δεῖπνον
  choice: భోజనం
  rationale: సందర్భంలోని సామూహిక ఆహారాన్ని సహజంగా సూచిస్తుంది; ‘విందు’ కంటే తటస్థంగా, విస్తృతంగా అర్థమవుతుంది.
- source_word: κυριακὸν δεῖπνον
  choice: ప్రభువు భోజనం
  rationale: గ్రీకు విశేషణం-నామవాచక సంబంధాన్ని కాపాడుతూ, తెలుగు క్రైస్తవ వాడుకలో స్పష్టంగా అర్థమయ్యే రూపం.
theological_decisions:
- issue: వారు ఆ భోజనం తినడం అసాధ్యమని పౌలు చెబుతున్నాడా, లేక వారి ప్రవర్తనవల్ల అది ప్రభువు భోజనంగా పరిగణించబడదని చెబుతున్నాడా?
  choice: ప్రధాన పాఠంలో ‘తినడానికైతే కాదు’ అని ఉంచి, మూలంలోని సంక్షిప్తతను మరియు మూల్యాంకన భావాన్ని నిలుపడం.
  alternative: ‘మీరు ప్రభువు భోజనం తినడం లేదు’ అని నేరుగా అనువదించడం.
  rationale: తదుపరి వచనాలు వారి విభజనాత్మక ప్రవర్తనను గద్దిస్తున్నాయి. అయినా మూలపాఠం నేరుగా ‘మీరు తినడం లేదు’ అని చెప్పదు; అందువల్ల ప్రధాన పాఠం ఉద్వేగాన్ని నిలుపుతుంది, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ప్రభువు భోజనం’ అనే పరిచిత పదబంధాన్ని ఉంచి, గ్రీకు వాక్యంలోని నిజమైన అస్పష్టతను పాదసూచికతో సంరక్షించాం.
