- from: అయితే తల కప్పుకోకుండా[b] ప్రార్థించే లేదా ప్రవచించే ప్రతి స్త్రీ తన తలను అవమానపరుస్తుంది[a]. ఎందుకంటే అలా ఉండడం, తల గొరిగించుకున్నట్లే—రెండూ ఒకటే.
