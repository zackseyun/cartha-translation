id: 1CO.11.5
reference: 1 Corinthians 11:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: te
  text: అయితే తల కప్పుకోకుండా[b] ప్రార్థించే లేదా ప్రవచించే ప్రతి స్త్రీ తన తలను అవమానపరుస్తుంది[a]. ఎందుకంటే తల కప్పుకోకుండా ఉండడం తల గొరిగించబడిన స్త్రీతో ఒకటే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రార్థించే లేదా ప్రవచించే ప్రతి భార్య … తన శిరస్సును అవమానపరుస్తుంది.’ గ్రీకు γυνή అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు. ‘తల/శిరస్సు’ను అక్షరార్థంగా భౌతిక తలగా, లేదా సందర్భాన్ని బట్టి సంబంధపరమైన రూపకంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘కప్పుకోకుండా’ అనే మాట కప్పుదల యొక్క ఖచ్చితమైన రూపాన్ని చెప్పదు; ఇది ప్రత్యేకంగా ముసుగును సూచిస్తుందా, లేక సాధారణంగా తల కప్పుకోని స్థితిని సూచిస్తుందా అనే విషయంలో భిన్న అభిప్రాయాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: స్త్రీ
  rationale: γυνή అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ‘ప్రార్థించే లేదా ప్రవచించే ప్రతి స్త్రీ’ అనే సాధారణ భావం సహజంగా ఉంది; వైవాహిక స్థితిని అనవసరంగా నిర్దేశించకుండా ‘స్త్రీ’ అని అనువదించి, ‘భార్య’ అనే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: ప్రార్థించే లేదా ప్రవచించే
  rationale: వర్తమాన కృదంతాలు ఆ కార్యాల్లో పాల్గొంటున్న స్త్రీని వర్ణిస్తున్నాయి. తెలుగు సహజ వాక్యనిర్మాణంలో సంబంధార్థక రూపం చర్యల భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: తల కప్పుకోకుండా
  rationale: ఈ పదబంధం తల కప్పబడని స్థితిని తెలుపుతుంది; అది ముసుగా, మరొక వస్త్రంగా, లేక వేరే విధమైన కప్పుదలగా ఉందో మూలపదమే నిర్దేశించదు.
- source_word: καταισχύνει
  choice: అవమానపరుస్తుంది
  rationale: ఈ క్రియ బహిరంగ అపకీర్తి లేదా అవమానం కలిగించడాన్ని సూచిస్తుంది. ‘అవమానపరుస్తుంది’ ఆధునిక తెలుగులో సహజంగా ఉండి, గౌరవం–అవమానం నేపథ్యాన్ని నిలుపుతుంది.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: తన తలను
  rationale: మూలంలో అక్షరార్థంగా ‘ఆమె తలను’ ఉంది. ఇది భౌతిక తలను సూచించవచ్చు; విస్తృత సందర్భంలో సంబంధపరమైన ‘శిరస్సు’ను కూడా సూచించే అవకాశం ఉంది. ప్రధాన పాఠం ఆ సందిగ్ధతను పరిష్కరించదు.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: రెండూ ఒకటే
  rationale: ఈ గ్రీకు నుడికారం రెండు స్థితుల సమానత్వాన్ని బలంగా చెబుతుంది. ‘రెండూ ఒకటే’ తెలుగులో సహజంగా ఆ ఉద్ఘాటనను అందిస్తుంది.
- source_word: τῇ ἐξυρημένῃ
  choice: తల గొరిగించుకున్నట్లే
  rationale: పరిపూర్ణ కృదంతం గొరిగించడం పూర్తయిన తరువాతి స్థితిని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ ఫలితస్థితిని సహజంగా తెలియజేస్తుంది; సందర్భానుసారంగా కర్త చేయించుకున్న భావం ఉన్నా, మూలంలోని స్థితిపైనే ప్రధాన దృష్టి ఉంటుంది.
theological_decisions:
- issue: ‘తన తలను అవమానపరుస్తుంది’లో రెండవ κεφαλή భావం
  choice: ప్రధాన పాఠంలో ‘తన తలను’ అని ఉంచి, భౌతిక తలా లేక సంబంధపరమైన శిరస్సా అనే దాన్ని నిర్దేశించలేదు.
  alternative: ‘తన శిరస్సైన భర్తను/పురుషుణ్ణి అవమానపరుస్తుంది’ అని స్పష్టీకరించడం.
  rationale: వాక్యంలోని గ్రీకు పదబంధం అక్షరార్థ పఠనాన్ని అనుమతిస్తుంది; చుట్టుపక్కల వాదన రూపకాలంకార పఠనానికీ అవకాశం ఇస్తుంది. ఒక భావాన్ని మాత్రమే ప్రధాన పాఠంలో స్థిరపరచడం మూలంలోని వ్యాఖ్యాన ఉద్రిక్తతను తొలగిస్తుంది.
- issue: కప్పుదల స్వరూపం
  choice: ‘తల కప్పుకోకుండా’ అని సాధారణంగా అనువదించాం.
  alternative: ‘ముసుగు లేకుండా’ లేదా జుట్టునే కప్పుదలగా నిర్దేశించడం.
  rationale: ἀκατακάλυπτος కప్పబడని స్థితిని చెబుతుంది గాని, కప్పే వస్తువు లేదా విధానం ఏమిటో స్వయంగా నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడాం. ‘ప్రవచించే’ అనే పదం బైబిలు సందర్భానికి తగినదిగా ఉండి నేటి తెలుగులోనూ స్పష్టమే. మూలంలోని ‘స్త్రీ/భార్య,’ ‘భౌతిక తల/సంబంధపరమైన శిరస్సు,’ అలాగే కప్పుదల స్వరూపం గురించిన సందిగ్ధతలను ప్రధాన పాఠం లేదా పాదసూచికల ద్వారా నిలుపుకున్నాం.
