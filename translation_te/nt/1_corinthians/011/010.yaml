id: 1CO.11.10
reference: 1 Corinthians 11:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο ὀφείλει ἡ γυνὴ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς διὰ τοὺς ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: te
  text: ఈ కారణంగా స్త్రీ తన తలపై అధికారం కలిగి ఉండాలి[a]—దేవదూతల కారణంగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత వ్యాఖ్యానాత్మకంగా, “తన తలపై అధికార సూచనను ధరించాలి.” గ్రీకు పాఠ్యంలో “అధికారం” అని ఉంది; “సూచన” లేదా “ముసుగు” అనే మాటలు స్పష్టంగా లేవు.
    reason: alternative_reading
  - marker: b
    text: లేదా “సందేశకుల కారణంగా”; అయితే ఇక్కడ “దేవదూతలు” అనే అర్థమే ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ఈ కారణంగా
  rationale: ముందటి వాదన నుంచి వచ్చే కారణాత్మక-నిగమన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὀφείλει
  choice: కలిగి ఉండాలి
  rationale: నైతిక బాధ్యత లేదా తగిన కర్తవ్యాన్ని తెలియజేస్తుంది; దానిని కఠినమైన చట్టాజ్ఞగా అతిశయింపదు.
- source_word: ἡ γυνὴ
  choice: స్త్రీ
  rationale: ఇక్కడి ఏకవచనం ప్రతినిధ్య లేదా సాధారణ అర్థంలో ఉంది; ‘భార్య’ అని పరిమితం చేయడానికి సందర్భం బలవంతం చేయదు.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: గ్రీకు పదానికి ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది. మూలంలో ‘గుర్తు’ లేదా ‘ముసుగు’ అనే పదాలు లేవు.
- source_word: ἔχειν
  choice: కలిగి
  rationale: క్రియ యొక్క సాధారణ అర్థమైన ‘కలిగి ఉండడం’ను అనువదిస్తుంది; ‘ధరించడం’ అనే సందర్భాధారిత వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: తన తలపై
  rationale: గ్రీకు స్థానసూచక పదబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, దాని ఖచ్చిత భావాన్ని విప్పి చెప్పకుండా ఉంచుతుంది.
- source_word: διὰ τοὺς ἀγγέλους
  choice: దేవదూతల కారణంగా
  rationale: διά + ద్వితీయా విభక్తి కారణాన్ని సూచిస్తుంది; ἄγγελοιకి ఈ సందర్భంలో ‘దేవదూతలు’ సాధారణంగా మరింత సంభావ్యమైన అర్థం.
theological_decisions:
- issue: ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς అనే పదబంధం అర్థం
  choice: ‘తన తలపై అధికారం కలిగి ఉండాలి’ అనే మూలానికి దగ్గరైన, ఉద్దేశపూర్వకంగా వ్యాఖ్యానించని రూపం
  alternative: ‘తన తలపై అధికార సూచనను ధరించాలి’ లేదా ‘అధికార సూచనగా తల ముసుగు ధరించాలి’
  rationale: గ్రీకు పాఠ్యంలో ‘సూచన’ లేదా ‘ముసుగు’ అనే పదాలు లేవు. వివాదాస్పదమైన ఈ పదబంధాన్ని ప్రధాన పాఠ్యంలో పరిష్కరించకుండా, సాధారణ వ్యాఖ్యానాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: ἀγγέλους యొక్క సూచితార్థం
  choice: దేవదూతలు
  alternative: సందేశకులు
  rationale: ἄγγελος అనే పదానికి రెండు అర్థాలూ సాధ్యమే అయినా, విశేషణం లేని ఈ బహువచనం పౌలు రచనల్లో సాధారణంగా పరలోక జీవులను సూచిస్తుంది. దేవదూతలను ఎందుకు ప్రస్తావించాడనే ప్రత్యేక సిద్ధాంతాన్ని అనువాదం చేర్చదు.
- issue: γυνή యొక్క పరిధి
  choice: స్త్రీ
  alternative: భార్య
  rationale: సమీప సందర్భం పురుషుడు-స్త్రీ గురించి విస్తృతంగా చర్చిస్తుంది; అందువల్ల వివాహ సంబంధానికే పరిమితం చేయకుండా సాధారణ ‘స్త్రీ’ని ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని అసాధారణమైన ‘తలపై అధికారం’ అనే భావాన్ని సులభీకరించి తలముసుగుగా మార్చకుండా నిలిపి, అవసరమైన వివరణను పాదటిప్పణిలో ఉంచింది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంది.
