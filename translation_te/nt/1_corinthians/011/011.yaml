id: 1CO.11.11
reference: 1 Corinthians 11:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πλὴν οὔτε ⸂γυνὴ χωρὶς ἀνδρὸς οὔτε ἀνὴρ χωρὶς γυναικὸς⸃ ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: te
  text: అయినప్పటికీ[a], ప్రభువులో స్త్రీ పురుషుని నుండి వేరుగా లేదు; పురుషుడు కూడా స్త్రీ నుండి వేరుగా లేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భార్య భర్త నుండి వేరుగా లేదు; భర్త కూడా భార్య నుండి వేరుగా లేడు.” గ్రీకు పదాలు స్త్రీ/పురుషుడు లేదా భార్య/భర్త అనే రెండు అర్థాల్లోనూ వాడవచ్చు. ఇక్కడి ప్రకటన వివాహానికి మాత్రమే పరిమితం కాకుండా సాధారణంగా ఉన్నట్లు కనిపించడం వల్ల ప్రధాన పాఠంలో విస్తృత అర్థాన్ని ఎంచుకున్నాం.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: అయినప్పటికీ
  rationale: ముందటి వాదనను రద్దు చేయకుండా దానికి సమతూకం కలిగించే మలుపును సూచిస్తుంది.
- source_word: γυνή
  choice: స్త్రీ
  rationale: ఈ పదానికి ‘భార్య’ అనే అర్థం కూడా సాధ్యమే; అయితే సృష్టి, ఆరాధన సందర్భంలో సాధారణ స్త్రీ–పురుష పరస్పర సంబంధమే ఇక్కడ ప్రధానంగా కనిపిస్తుంది.
- source_word: ἀνήρ
  choice: పురుషుడు
  rationale: ఈ పదానికి ‘భర్త’ అనే అర్థం కూడా ఉండవచ్చు; ఇక్కడ γυνήతో సమాంతరంగా విస్తృతమైన అర్థాన్ని నిలుపుతుంది.
- source_word: χωρὶς
  choice: వేరుగా
  rationale: విడిగా ఉండడం లేదా స్వతంత్రంగా ఉండడం అనే సంబంధార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘లేకుండా’ కంటే మూలంలోని నిర్మాణానికి దగ్గరగా ఉంటుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: ప్రభువుతో ఉన్న సంబంధం లేదా ఆయనలోని జీవన పరిధిని సూచించే పౌలు వాడే సంక్షిప్త పదబంధాన్ని నిలుపుతుంది.
- source_word: οὔτε ... οὔτε
  choice: లేదు; ... కూడా ... లేడు
  rationale: రెండు సమతూకమైన నిరాకరణలను స్పష్టమైన, సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: γυνή / ἀνήρ పదాలను ‘స్త్రీ/పురుషుడు’గా లేదా ‘భార్య/భర్త’గా అనువదించాలా
  choice: స్త్రీ/పురుషుడు
  alternative: భార్య/భర్త
  rationale: తక్షణ సందర్భం సృష్టి మరియు ఆరాధనలో స్త్రీ–పురుషుల గురించి మాట్లాడుతుంది. ఈ వచనం వారి పరస్పర సంబంధాన్ని సమతూకంగా చెప్పే సాధారణ ప్రకటనగా కనిపిస్తుంది. అయినా గ్రీకు పదాల వైవాహిక అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
- issue: χωρὶς ద్వారా సూచించబడే సంబంధ స్వభావం
  choice: వేరుగా లేదు
  alternative: స్వతంత్రంగా లేదు / లేకుండా లేదు
  rationale: ‘స్వతంత్రంగా లేదు’ అనేది పరస్పర ఆధారితత్వాన్ని మరింత స్పష్టంగా వ్యాఖ్యానిస్తుంది; ‘వేరుగా లేదు’ మాత్రం మూలంలోని విడిపాటు భావాన్ని అతిగా తీర్మానించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. రెండు భాగాల సమాంతరతను నిలిపేందుకు రెండవ భాగంలో ‘కూడా’ వాడాం. ‘ప్రభువులో’ అనే పౌలు వాడే ధార్మిక పదబంధాన్ని వివరణాత్మకంగా విస్తరించకుండా అలాగే ఉంచాం.
