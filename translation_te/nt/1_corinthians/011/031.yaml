  text: εἰ ⸀δὲ ἑαυτοὺς διεκρίνομεν, οὐκ ἂν ἐκρινόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/031.yaml
  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: te
  text: అయితే మనల్ని మనమే తీర్పు చెప్పుకొని ఉంటే[a], మనం తీర్పు పొందేవాళ్లం కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనల్ని మనమే పరిశీలించుకుని ఉంటే” లేదా “మనల్ని మనమే వివేచించి ఉంటే.” గ్రీకు క్రియకు పరిశీలించి అంచనా వేయడం లేదా భేదాన్ని గుర్తించడం అనే భావాలు ఉండవచ్చు. అయితే తరువాతి ఉపవాక్యంలోని “తీర్పు”తో పదసంబంధాన్ని నిలుపుకోవడానికి ప్రధాన పాఠంలో “తీర్పు చెప్పుకొని ఉంటే” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: అయితే, …తే
  rationale: εἰ యొక్క షరతును తెలుగు క్రియాంతంలోని ‘తే’ తెలియజేస్తుంది; δέ సూచించే స్వల్ప వ్యత్యాసం లేదా మార్పును ‘అయితే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἑαυτοὺς
  choice: మనల్ని మనమే
  rationale: కర్త తననే క్రియకు గురిచేసుకోవడాన్ని తెలుగులో సహజంగా, స్పష్టంగా తెలిపే పరావర్తన రూపం.
- source_word: διεκρίνομεν
  choice: తీర్పు తీర్చుకుంటే
  rationale: ఇక్కడ διακρίνω స్వీయ పరిశీలనతో కూడిన వివేచనాత్మక అంచనాను సూచించగలదు. రెండవ ఉపవాక్యంలోని κρίνωతో ఉన్న పదసంబంధాన్ని నిలుపుకోవడానికి ‘తీర్పు’ పదాన్ని ఉపయోగించాం; ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: οὐκ ἂν
  choice: …జరిగేది కాదు
  rationale: అసంభవిత లేదా వాస్తవానికి విరుద్ధమైన షరతు ఫలితాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపే నిర్మాణం.
- source_word: ἐκρινόμεθα
  choice: మనకు తీర్పు జరిగేది
  rationale: క్రియ యొక్క కర్మణి భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, ‘శిక్షావిధి’ లేదా ‘ఖండన’ అనే మరింత బలమైన భావాన్ని ముందుగానే చేర్చకుండా κρίνω యొక్క విస్తృత ‘తీర్పు’ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: రెండవ ఉపవాక్యం అంతిమ ఖండనను సూచిస్తుందా, లేక ప్రభువు చేసే ప్రస్తుత/క్రమశిక్షణాత్మక తీర్పునా?
  choice: ‘మనకు తీర్పు జరిగేది కాదు’ అని తటస్థంగా అనువదించడం
  alternative: ‘మనము ఖండించబడము’ లేదా ‘మనకు శిక్ష విధించబడదు’
  rationale: తదుపరి వచనం ప్రభువు తీర్పు/శిక్షణను లోకంతో కూడిన ఖండన నుండి వేరు చేస్తుంది. కాబట్టి ఈ వచనంలో ἐκρινόμεθαను ‘ఖండించబడటం’గా తీవ్రతరం చేయకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘మనల్ని మనమే తీర్పు తీర్చుకోవడం’ అనే నిర్మాణం కొద్దిగా గంభీరంగా ఉన్నా, గ్రీకు మూలంలోని స్వీయ-తీర్పు మరియు దేవుని తీర్పు మధ్య పదప్రయోగ సంబంధాన్ని కాపాడుతుంది.
