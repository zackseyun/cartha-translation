- from: అయితే, ఈ ఆదేశం ఇస్తూ[a] నేను మిమ్మల్ని మెచ్చుకోవడం లేదు. ఎందుకంటే మీరు కూడివచ్చేది మేలు కలగడానికి కాదు, కీడు కలగడానికే.
  to: అయితే, ఈ ఆదేశం ఇస్తూ[a] నేను మిమ్మల్ని మెచ్చుకోవడం లేదు; ఎందుకంటే మీరు కూడివచ్చేది మేలు కంటే కీడు కలగడానికే.
