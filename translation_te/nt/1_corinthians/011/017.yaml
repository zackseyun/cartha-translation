id: 1CO.11.17
reference: 1 Corinthians 11:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: te
  text: అయితే, ఈ ఆదేశం ఇస్తూ[a] నేను మిమ్మల్ని మెచ్చుకోవడం లేదు; ఎందుకంటే మీరు కూడివచ్చేది మేలు కంటే కీడు కలగడానికే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ఆజ్ఞ ఇస్తూ.” గ్రీకు కృదంతానికి ఆదేశించడం, నిర్దేశించడం లేదా ఆజ్ఞాపించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δὲ
  choice: అయితే, ఈ
  rationale: δὲ సూచించే స్వల్ప వ్యతిరేక మలుపును ‘అయితే’ సహజంగా వ్యక్తపరుస్తుంది; Τοῦτο ముందుకు వచ్చే ఆదేశాన్ని సూచించే ‘ఈ’గా నిలుస్తుంది.
- source_word: παραγγέλλων
  choice: ఆదేశం ఇస్తూ
  rationale: వర్తమాన కృదంతం; బోధించడం, దిశానిర్దేశం చేయడం, ఆజ్ఞాపించడం అనే అధికారపూర్వక భావపరిధిని ‘ఆదేశం ఇస్తూ’ సహజంగా మోస్తుంది.
- source_word: οὐκ ἐπαινῶ
  choice: నేను మిమ్మల్ని మెచ్చుకోవడం లేదు
  rationale: ἐπαινέω యొక్క ప్రశంసించడం/మెచ్చుకోవడం అనే సరళ భావాన్ని నిలుపుతుంది; 11:2లోని ప్రశంసతో ఉన్న వ్యత్యాసాన్నీ ప్రతిబింబిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: పౌలు ఎందుకు మెచ్చుకోవడం లేదో తెలిపే కారణార్థాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον
  choice: మేలు కలగడానికి కాదు, కీడు కలగడానికే
  rationale: ‘మంచిదాని వైపు కాదు, అధమమైనదాని వైపు’ అనే తులనాత్మక ఫలిత వ్యత్యాసాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; ‘కలగడానికి’ సందర్భంలోని ఫలిత భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: συνέρχεσθε
  choice: మీరు కూడివచ్చేది
  rationale: సమాజంగా ఒకచోట సమావేశమవడాన్ని సూచించే క్రియను సహజమైన తెలుగు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: παραγγέλλων యొక్క అధికార స్వరం
  choice: ఆదేశం
  alternative: ఆజ్ఞ
  rationale: మూలక్రియలో ఆజ్ఞాపన భావం ఉండగలిగినా, ఇక్కడ సమాజ సమావేశాల గురించి పౌలు ఇచ్చే అధికారపూర్వక దిశానిర్దేశాన్ని ‘ఆదేశం’ అతిగా కఠినం చేయకుండా నిలుపుతుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరచాం.
- issue: εἰς τὸ κρεῖσσον / εἰς τὸ ἧσσον లో ఉద్దేశం లేదా ఫలితం
  choice: మేలు కలగడానికి / కీడు కలగడానికి
  alternative: మంచి వైపుకు / చెడు వైపుకు
  rationale: εἰς నిర్మాణం ఉద్దేశం లేదా ఫలితం రెండింటి ఛాయనూ కలిగి ఉండవచ్చు. తెలుగు అనువాదం సమావేశాల వాస్తవ పరిణామాన్ని ముందుకు తెస్తుంది గాని, ఉద్దేశపూర్వక హాని అనే అదనపు ఆరోపణను స్పష్టంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే శైలి. ‘కూడివచ్చేది’ సంఘ సమావేశ సందర్భాన్ని సహజంగా తెలియజేస్తుంది; ‘మేలు/కీడు’ వ్యత్యాసం మూలంలోని తులనాత్మక నిర్మాణాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
