id: 1CO.7.4
reference: 1 Corinthians 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: te
  text: భార్యకు తన శరీరంపై అధికారం లేదు; ఆమె శరీరంపై భర్తకు అధికారం ఉంది. అదే విధంగా, భర్తకు తన శరీరంపై అధికారం లేదు; అతని శరీరంపై భార్యకు అధికారం ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అధికారం చలాయించదు.” గ్రీకు క్రియ అధికారాన్ని కలిగి ఉండడం లేదా దాన్ని చలాయించడం అనే భావాలను సూచించగలదు; ఇక్కడ భార్యాభర్తల మధ్య పరస్పర దాంపత్య అధికారమే సందర్భం.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: భార్య
  rationale: వివాహం, దాంపత్య బాధ్యతల సందర్భంలో γυνή అంటే సాధారణంగా ‘స్త్రీ’ కాక ‘భార్య’.
- source_word: ἀνήρ
  choice: భర్త
  rationale: γυνήతో జతగా ఉన్న వివాహ సందర్భంలో ἀνήρ అంటే ‘పురుషుడు’ కాక ‘భర్త’.
- source_word: ἰδίου σώματος
  choice: తన సొంత శరీరంపై
  rationale: ἴδιος వ్యక్తికి స్వంతమైనదనే భావాన్ని నొక్కిచెబుతుంది; ‘తన సొంత శరీరం’ ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐξουσιάζει
  choice: అధికారం ఉంది
  rationale: ఈ క్రియ అధికారాన్ని కలిగి ఉండడం లేదా చలాయించడం అనే భావాన్ని ఇస్తుంది. ‘అధికారం ఉంది’ పరస్పర దాంపత్య సంబంధాన్ని ప్రత్యక్షంగా తెలుపుతూ, బలవంతపు ఆధిపత్య భావాన్ని అదనంగా చేర్చదు.
- source_word: ἀλλά
  choice: ; ...కే ఉంది
  rationale: గ్రీకు వాక్యంలోని బలమైన వ్యత్యాసాన్ని తెలుగులో సహజంగా చూపడానికి ‘లేదు; ...కే ఉంది’ అనే నిర్మాణం వాడబడింది.
- source_word: ὁμοίως δὲ καὶ
  choice: అదే విధంగా
  rationale: రెండవ వాక్యం మొదటి వాక్యానికి సరిగ్గా సమాంతరమని, అధికారం పరస్పరమైనదని ఈ పదబంధం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దాంపత్య అధికార స్వభావం
  choice: భార్యాభర్తలిద్దరికీ ఒకరిపై మరొకరికి ఉన్న పరస్పర అధికారంగా అనువదించడం
  alternative: శరీరం జీవిత భాగస్వామికి ‘చెందుతుంది’ అని బలహీనంగా చెప్పడం, లేదా ఒకరు మరొకరి శరీరాన్ని ‘నియంత్రిస్తారు’ అని మరింత బలంగా చెప్పడం
  rationale: 'గ్రీకు వాక్య నిర్మాణం ఉద్దేశపూర్వకంగా సమాంతరంగా ఉంది: భార్య గురించి చెప్పినదే భర్త గురించి కూడా చెబుతుంది. కాబట్టి ఏకపక్ష ఆధిపత్యాన్నిగానీ, కేవలం చెందినదనే భావాన్నిగానీ చేర్చకుండా పరస్పర అధికారాన్ని నిలుపుతుంది.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు మూలంలోని సమాంతర నిర్మాణం, పరస్పరత, వ్యత్యాసం నిలుపబడ్డాయి.
