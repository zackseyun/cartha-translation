revisions:
- from: భార్యకు తన సొంత శరీరంపై అధికారం లేదు; భర్తకే ఉంది. అదే విధంగా, భర్తకు తన సొంత శరీరంపై అధికారం లేదు; భార్యకే ఉంది.[a]
  to: భార్యకు తన శరీరంపై అధికారం లేదు; ఆమె శరీరంపై భర్తకు అధికారం ఉంది. అదే విధంగా, భర్తకు తన శరీరంపై అధికారం లేదు; అతని శరీరంపై భార్యకు అధికారం ఉంది.[a]
  rationale: The revision preserves the Greek’s balanced reciprocal assertion and direct contrast while avoiding the added exclusivity implied by Telugu ‘-కే.’ It retains neutral, non-coercive authority language and keeps the lexical alternative anchored to ἐξουσιάζει.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:02:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies γυνή/ἀνήρ as ‘భార్య/భర్త,’ preserves ἰδίου (‘తన సొంత’), and retains the reciprocal contrast and parallelism. However, ‘భర్తకే ఉంది/భార్యకే ఉంది’ introduces the restrictive emphasis ‘only the husband/wife,’ whereas Greek ἀλλά marks contrast but does not itself contain an exclusive particle. A direct possessive construction better represents that the spouse, rather than the person, has authority over that person’s body.
  naturalness: The proposed revision is fluent, modern standard Telugu and makes the reciprocal relation explicit without awkward repetition or an unintended exclusivist nuance.
  terminology: ‘అధికారం’ is an appropriate rendering for ἐξουσιάζει in this context. ‘తన శరీరంపై’ naturally conveys authority over one’s own body; ‘సొంత’ is not required since ‘తన’ already supplies the possessive force. The footnote’s alternative should match the finite verb and reciprocal subject structure.
  issues:
  - severity: medium
    issue: The clitic ‘-కే’ in ‘భర్తకే ఉంది’ and ‘భార్యకే ఉంది’ adds exclusivity.
    rationale: The Greek says ‘but the husband/wife [has authority]’ in contrast to the person’s lack of authority over their own body. It does not explicitly say ‘the husband/wife alone.’ Recasting the sentence as ‘ఆమె/అతని శరీరంపై భర్తకు/భార్యకు అధికారం ఉంది’ preserves the contrast without adding restriction.
  - severity: low
    issue: The footnote alternative ‘అధికారం చలాయించదు’ lacks the corresponding object and does not mirror the clause’s relational sense.
    rationale: For clarity and lexical fidelity, state the alternative as ‘అధికారం చలాయించదు’ over one’s own body, with the spouse as the contrasting authority-holder.
  revised_text: భార్యకు తన శరీరంపై అధికారం లేదు; ఆమె శరీరంపై భర్తకు అధికారం ఉంది. అదే విధంగా, భర్తకు తన శరీరంపై అధికారం లేదు; అతని శరీరంపై భార్యకు అధికారం ఉంది.[a]
