id: 1CO.7.22
reference: 1 Corinthians 7:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: te
  text: ఎందుకంటే ప్రభువులో పిలుపు పొందిన బానిస ప్రభువుకు చెందిన విముక్తుడు[a]; అలాగే స్వతంత్రుడిగా ఉండగా పిలుపు పొందినవాడు మెస్సీయకు చెందిన బానిస.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, బానిసత్వం నుండి విడుదల పొందినవాడు. గ్రీకు పదం సాధారణంగా స్వతంత్రుడైన వ్యక్తిని కాక, ప్రత్యేకంగా బానిసత్వం నుండి విడుదల పొందిన వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: బానిస
  rationale: ఈ వచనంలోని సామాజిక స్థితి–ఆధ్యాత్మిక స్థితి వ్యతిరేకతకు బానిసత్వ భావం కీలకం. అందువల్ల మృదువైన ‘సేవకుడు’ కంటే ‘బానిస’ మూలపద బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు వాడుకలోని సంబంధం లేదా ఐక్యత అనే భావాన్ని ముందుగానే ఒకే అర్థానికి పరిమితం చేయకుండా మూలంలోని రూపాన్ని నిలుపుతుంది.
- source_word: κληθεὶς
  choice: పిలుపు పొందిన
  rationale: దైవిక పిలుపును సూచించే పరోక్ష క్రియాభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπελεύθερος
  choice: విముక్తుడు
  rationale: బానిసత్వం నుండి విడుదల పొందిన వ్యక్తిని సూచించే ప్రత్యేక భావాన్ని సంక్షిప్తంగా తెలిపి, ‘బానిస’తో ఉన్న పదవ్యతిరేకతను కాపాడుతుంది.
- source_word: ἐλεύθερος
  choice: స్వతంత్రుడై ఉండి
  rationale: బానిస కాని సామాజిక స్థితిని సూచిస్తుంది; పిలుపు పొందినప్పుడు అతడు స్వతంత్ర స్థితిలో ఉన్నాడనే సమాంతర భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయకు చెందిన
  rationale: Χριστός ఇక్కడ అభిషిక్త రాజు అనే బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: ఇక్కడ యేసుకు సంబంధించిన గంభీరమైన బిరుదును సూచిస్తుంది; కేవలం సామాజిక యజమాని అనే భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: సామాజిక స్థితి మరియు మెస్సీయతో సంబంధం మధ్య ఉన్న విరుద్ధ సమాంతరత
  choice: బానిస ప్రభువుకు చెందిన విముక్తుడు; స్వతంత్రుడు మెస్సీయకు చెందిన బానిస
  alternative: ‘బానిస’ను ‘సేవకుడు’గా, ‘విముక్తుడు’ను సాధారణంగా ‘స్వతంత్రుడు’గా మృదువుగా అనువదించడం
  rationale: 'పౌలు ఉద్దేశపూర్వకంగా నిర్మించిన తలక్రిందుల సమాంతరతను పదునుగా నిలుపుతుంది: లోకరీత్యా బానిస అయినవాడు ప్రభువులో విముక్తుడు; లోకరీత్యా స్వతంత్రుడైనవాడు మెస్సీయకు బద్ధుడు.'
- issue: κυρίου అనే సంబంధవాచక రూపం
  choice: ప్రభువుకు చెందిన
  alternative: ప్రభువు విడుదల చేసిన
  rationale: ‘ప్రభువు విడుదల చేసిన’ అని అనువదిస్తే మూలంలోని సంబంధవాచకాన్ని కార్యనిర్వాహక భావంగా నిర్దిష్టం చేసినట్లవుతుంది. ‘చెందిన’ అనేది యాజమాన్య/సంబంధ భావాన్ని కాపాడుతూ, ఎవరు విడుదల చేశారనే అంశాన్ని అనవసరంగా నిర్ణయించదు.
- issue: Χριστοῦ బిరుదు భావం
  choice: మెస్సీయకు చెందిన
  alternative: క్రీస్తుకు చెందిన
  rationale: ఇక్కడ Χριστός అభిషిక్తుడు అనే బిరుదుగా సజీవంగా ఉంది; ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘బానిస’ అనే పదం మూలంలోని కఠినమైన సామాజిక వాస్తవాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది. ‘మెస్సీయ’ను పేరుగా కాక బిరుదుగా ఉపయోగించాం.
