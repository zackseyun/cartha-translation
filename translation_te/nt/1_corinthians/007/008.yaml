source:
  edition: SBLGNT
  text: Λέγω δὲ τοῖς ἀγάμοις καὶ ταῖς χήραις, καλὸν ⸀αὐτοῖς ἐὰν μείνωσιν ὡς κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: te
  text: 'అవివాహితులతోను విధవరాళ్లతోను నేను చెప్పేది ఇదే: వారు నేనూ ఉన్నట్లుగానే ఉండిపోతే వారికి మంచిది.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అవివాహిత పురుషులతో’; గ్రీకులో ఈ రూపం పుంలింగ బహువచనం, అయితే సందర్భంలో అది ప్రతినిధికంగా వాడబడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నేను కూడా ఉన్నట్లే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: నేను చెప్పేది ఇదే
  rationale: δέలోని స్వల్ప సంధాన భావాన్ని తెలుగులో సహజమైన వాక్య మార్పుతో తెలియజేస్తుంది; స్పష్టమైన కాలార్థక ‘ఇప్పుడు’ను చేర్చదు.
- source_word: τοῖς ἀγάμοις
  choice: అవివాహితులతో
  rationale: ἄγαμος అంటే వివాహం కానివారు. గ్రీకు రూపం పుంలింగ బహువచనమైనా, సందర్భంలో అది ప్రతినిధికంగా వాడబడి ఉండవచ్చు; ఈ సందిగ్ధతను పాదటిప్పణి తెలియజేస్తుంది.
- source_word: ταῖς χήραις
  choice: విధవరాళ్లతో
  rationale: χήρα ప్రత్యేకంగా భర్తను కోల్పోయిన స్త్రీని సూచిస్తుంది; సాధారణ అవివాహిత స్త్రీలందరినీ కాదు.
- source_word: καλὸν αὐτοῖς
  choice: వారికి మంచిది
  rationale: καλόν ఇక్కడ ‘మంచిది/తగినది’ అనే విస్తృత భావాన్ని ఇస్తుంది; ‘మరింత మంచిది’ అనే తులనార్థాన్ని మూలపాఠం వ్యక్తం చేయదు.
- source_word: ἐὰν μείνωσιν
  choice: ఉండిపోతే
  rationale: μένω అంటే అలాగే నిలిచి ఉండడం లేదా కొనసాగడం; ఇక్కడ ప్రస్తుత అవివాహిత స్థితిలో కొనసాగడాన్ని సూచిస్తుంది.
- source_word: ὡς κἀγώ
  choice: కూడా నాలాగే
  rationale: κἀγώ అనేది καὶ ἐγώ యొక్క సంక్షిప్త రూపం; ‘నేను కూడా’ అనే అదనపు భావాన్ని తెలుగులో సహజంగా ఉంచుతుంది.
theological_decisions:
- issue: ἀγάμοις అనే పదం ఎవరిని సూచిస్తుంది?
  choice: ‘అవివాహితులు’ అనే విస్తృత పదాన్ని వాడడం
  alternative: ‘అవివాహిత పురుషులు’ అని అనువదించడం
  rationale: రూపం పుంలింగ బహువచనమైనప్పటికీ, అది పురుషులకే పరిమితమా లేక ప్రతినిధిక వాడుకా అన్నది పూర్తిగా నిశ్చితం కాదు. ప్రధాన పాఠం విస్తృత సాధ్యతను ఉంచి, రూప సంబంధమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలుపుతుంది.
- issue: καλὸν యొక్క మూల్యాంకన బలం
  choice: ‘మంచిది’
  alternative: ‘మరింత మంచిది’ లేదా ‘శ్రేష్ఠమైనది’
  rationale: గ్రీకు విశేషణం ఇక్కడ తులనాత్మక రూపంలో లేదు; కాబట్టి పౌలు మాటకు మూలపాఠంలో లేని అధిక తులనాత్మక బలాన్ని చేర్చలేదు.
- issue: ὡς κἀγώలో పౌలు స్థితి
  choice: పౌలు తన ప్రస్తుత స్థితిని సూచిస్తున్నట్లుగా ‘నాలాగే’ అని ఉంచడం
  alternative: ఆ స్థితిని వివరణాత్మకంగా ‘అవివాహితుడిగా’ అని చేర్చడం
  rationale: మూలపాఠం స్థితిని ప్రత్యక్షంగా పేరు పెట్టకుండా సందర్భానికి వదిలేస్తుంది; అనువాదం కూడా ఆ సూచనాత్మకతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘వారు కూడా నాలాగే ఉండిపోతే’ అనే నిర్మాణం అవివాహిత స్థితిలో కొనసాగడాన్ని సందర్భం ద్వారా తెలియజేస్తూ, మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
