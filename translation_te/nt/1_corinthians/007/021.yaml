id: 1CO.7.21
reference: 1 Corinthians 7:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: te
  text: నీవు బానిసగా ఉన్నప్పుడు పిలువబడ్డావా? దాని గురించి కలతపడకు. అయితే నీవు స్వతంత్రుడు కాగలిగితే, ఆ అవకాశాన్ని ఉపయోగించుకోవడం మేలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ప్రస్తుత స్థితినే ఉపయోగించుకో,” అంటే నీవున్న స్థితిలోనే ఉండు. గ్రీకులో “అయితే మరింతగా ఉపయోగించుకో” అనే పదబంధం దేనిని ఉపయోగించుకోవాలో స్పష్టంగా చెప్పదు; అందువల్ల దీనిని ఈ రెండు విధాలుగా అర్థం చేసుకున్నారు.
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: దాసుడు
  rationale: ఈ సందర్భంలో బంధిత సామాజిక స్థితి మరియు దాని నుండి స్వతంత్రుడు కావడం స్పష్టంగా ఉన్నందున, కేవలం సేవకుడు అనే అర్థం కాకుండా బానిసత్వ స్థితిని సూచించే ‘దాసుడు’ ఎంచుకున్నాం.
- source_word: ἐκλήθης
  choice: పిలువబడ్డావు
  rationale: దేవుని పిలుపు అనే పౌలు వాడుక సందర్భంలో సూచితమైనప్పటికీ, మూలంలో లేని వివరణను చేర్చకుండా కర్మణి రూపాన్ని నిలిపాం.
- source_word: μή σοι μελέτω
  choice: దాని గురించి కలతపడకు
  rationale: ఈ నుడికారం ఆందోళన చెందవద్దనే కాపరి ధోరణి గల భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐλεύθερος γενέσθαι
  choice: స్వతంత్రుడివి కాగలిగితే
  rationale: దాసత్వ స్థితి నుండి స్వేచ్ఛగల సామాజిక స్థితికి మారడాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: μᾶλλον χρῆσαι
  choice: ఆ అవకాశాన్ని సద్వినియోగం చేసుకో
  rationale: χρῆσαι యొక్క కర్మ మూలంలో చెప్పబడలేదు. ప్రధాన పాఠంలో ముందున్న స్వతంత్రుడు కాగల అవకాశం సూచిత కర్మగా తీసుకున్నాం; మరో ప్రాచీన వ్యాఖ్యానాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: μᾶλλον χρῆσαι అనే పదబంధంలోని వ్యాఖ్యాన సందిగ్ధత
  choice: స్వతంత్రుడు అయ్యే అవకాశం ఉంటే దానిని వినియోగించుకోవాలని పౌలు ప్రోత్సహిస్తున్నాడు.
  alternative: తన ప్రస్తుత దాసత్వ స్థితినే ఉపయోగించుకుంటూ అలాగే ఉండాలని పౌలు చెబుతున్నాడు.
  rationale: తక్షణ వాక్యనిర్మాణంలో ‘స్వతంత్రుడివి కాగలిగితే’ అనే భావంలో సూచితమైన అవకాశమే χρῆσαιకు సహజమైన కర్మగా కనిపిస్తుంది. అయినప్పటికీ గ్రీకు కర్మను స్పష్టంగా చెప్పకపోవడం వల్ల మరో పఠనానికి కూడా చారిత్రక ఆధారం ఉంది; అందుకే దానిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. ప్రశ్నారూపాన్ని, కాపరి ధోరణిని, అలాగే మూలంలోని వ్యాఖ్యాన సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా నిలిపాం.
