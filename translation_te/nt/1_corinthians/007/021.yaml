    text: లేదా, “నీ ప్రస్తుత స్థితినే ఉపయోగించుకో,” అంటే నీవున్న స్థితిలోనే ఉండు. గ్రీకులో “అయితే మరింతగా ఉపయోగించుకో” అనే పదబంధం దేనిని ఉపయోగించుకోవాలో స్పష్టంగా చెప్పదు; అందువల్ల దీనిని ఈ రెండు విధాలుగా అర్థం చేసుకున్నారు.
    reason: alternative_reading
  revision_rationale: The revision makes the enslaved status explicit, improves the idiom for becoming free, and expresses the force of μᾶλλον as “మేలు” (“better/rather”). The main text follows the reading that the available freedom is to be used, while the footnote retains the alternative longstanding interpretation because the Greek leaves the object of χρῆσαι unstated.
