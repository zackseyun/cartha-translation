id: 1CO.7.31
reference: 1 Corinthians 7:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: te
  text: లోకాన్ని వినియోగించేవారు దానిని పూర్తిగా వినియోగించనివారిలా ఉండాలి[a]; ఎందుకంటే ఈ లోకపు ప్రస్తుత రూపం గతించిపోతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిని పూర్తిగా వినియోగించనివారిలా’; ఈ క్రియకు ‘దానిని దుర్వినియోగం చేయనివారిలా’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఈ లోకపు బాహ్య రూపం’ లేదా ‘ఈ లోకపు తీరు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι
  choice: ఉపయోగించుకునేవారు
  rationale: χράομαι అనే క్రియకు ఇక్కడ ‘ఉపయోగించు/వినియోగించు’ అనే సాధారణ అర్థం ఉంది; తెలుగు వాక్యంలో సహజంగా ఉండేందుకు ‘ఉపయోగించుకునేవారు’ అని ఇచ్చాం.
- source_word: τὸν κόσμον
  choice: లోకాన్ని
  rationale: ఇక్కడ κόσμος సృష్టి విశ్వాన్ని మాత్రమే కాక ప్రస్తుత సామాజిక-భౌతిక లోకవ్యవస్థను సూచిస్తుంది; ‘లోకం’ మూలపదానికి నేరమైన, సందర్భోచితమైన రూపం.
- source_word: ὡς μὴ καταχρώμενοι
  choice: దాన్ని పూర్తిగా ఉపయోగించుకోనివారిలా
  rationale: καταχράομαι, χράομαι కంటే తీవ్రతను సూచిస్తూ ‘పూర్తిగా వినియోగించు’ లేదా కొన్ని సందర్భాల్లో ‘దుర్వినియోగం చేయు’ అనే భావం కలిగివుండవచ్చు. ప్రధాన పాఠ్యంలో పదజాలపు జతను నిలుపుతూ ‘పూర్తిగా ఉపయోగించుకోని’ అని ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: παράγει
  choice: గతించిపోతోంది
  rationale: వర్తమానకాల రూపం కొనసాగుతున్న ప్రక్రియను సూచిస్తుంది; ‘గతించిపోతోంది’ ఈ లోకపు తాత్కాలికత్వాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ σχῆμα τοῦ κόσμου τούτου
  choice: ఈ లోకం ప్రస్తుతమున్న రూపం
  rationale: σχῆμα అనేది రూపం, బాహ్య ఆకృతి లేదా ప్రస్తుత ఏర్పాటు అనే భావాలను కలిగి ఉంది. ‘ప్రస్తుతమున్న రూపం’ దాని తాత్కాలిక స్థితిని సూచిస్తూ, ‘ఈ’ ద్వారా τούτουను నిలుపుతుంది.
theological_decisions:
- issue: χρώμενοι / καταχρώμενοι మధ్య భావసంబంధం
  choice: లోకాన్ని ఉపయోగిస్తూనే దాన్ని పూర్తిగా ఉపయోగించుకోవడంలో మునిగిపోకుండా ఉండటం
  alternative: లోకాన్ని దుర్వినియోగం చేయకపోవడం; లేదా దాన్ని ఉపయోగించనట్టుగా ఉండటం
  rationale: రెండు సంబంధిత క్రియల మధ్యనున్న పదప్రయోగాన్ని ప్రధాన పాఠ్యం నిలుపుతుంది. సందర్భం కేవలం నైతిక దుర్వినియోగాన్ని ఖండించడానికే పరిమితం కాదు; అయినా ఆ సాధ్యమైన భావాన్ని పాదసూచికలో కాపాడాం.
- issue: σχῆμα యొక్క భావం
  choice: లోకపు తాత్కాలిక ప్రస్తుత రూపం లేదా ఏర్పాటు
  alternative: కేవలం లోకపు బాహ్య రూపం; లేదా లోకపు మౌలిక స్వభావం
  rationale: ఈ సందర్భంలో σχῆμα లోకపు సారాన్ని కాక దాని ప్రస్తుత ఆకృతి లేదా వ్యవస్థను సూచిస్తుంది. అందువల్ల ‘ప్రస్తుతమున్న రూపం’ అని అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. χρώμενοι/καταχρώμενοι పదజతను ‘ఉపయోగించుకునేవారు/పూర్తిగా ఉపయోగించుకోనివారు’ ద్వారా సాధ్యమైనంతవరకు నిలిపాం. పాదసూచిక గుర్తులన్నీ ప్రధాన పాఠ్యంలో పొందుపరచబడ్డాయి.
