- from: లోకాన్ని ఉపయోగించుకునేవారు దాన్ని పూర్తిగా ఉపయోగించుకోనివారిలా ఉండాలి[a]; ఎందుకంటే ఈ లోకం ప్రస్తుతమున్న రూపం గతించిపోతోంది[b].
  to: లోకాన్ని వినియోగించేవారు దానిని పూర్తిగా వినియోగించనివారిలా ఉండాలి[a]; ఎందుకంటే ఈ లోకపు ప్రస్తుత రూపం గతించిపోతుంది[b].
