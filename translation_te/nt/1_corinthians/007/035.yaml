id: 1CO.7.35
reference: 1 Corinthians 7:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: te
  text: ఇది మీ సొంత మేలు కోసమే చెబుతున్నాను; మీపై ఉచ్చు వేయడానికి కాదు, సముచితమైన దానికోసమూ, ఎలాంటి పరధ్యానం లేకుండా ప్రభువుకు అంకితమై ఉండడానికోసమూ చెబుతున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: మేలు
  rationale: సందర్భంలో వ్యక్తిగత ప్రయోజనం లేదా శ్రేయస్సును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: βρόχον
  choice: మెడకు ఉరి
  rationale: పదానికి ప్రాథమికంగా ఉచ్చు లేదా ఉరితాడు అనే బలమైన రూపకం ఉంది; దాన్ని సాధారణమైన ‘నిర్బంధం’గా సడలించకుండా మూల రూపకాన్ని నిలుపుతుంది.
- source_word: εὔσχημον
  choice: మర్యాదకరమైన ప్రవర్తన
  rationale: సందర్భోచితమైన, శోభనమైన లేదా సముచితమైన నడవడిని సూచించే పదాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εὐπάρεδρον
  choice: అంటిపెట్టుకొని ఉండడం
  rationale: ప్రభువు దగ్గర స్థిరంగా ఉండి సేవించడమనే భావాన్ని సహజ తెలుగులో అందిస్తుంది; కేవలం మనోభావపూర్వక ‘భక్తి’కి పరిమితం చేయదు.
- source_word: ἀπερισπάστως
  choice: పరధ్యానం లేకుండా
  rationale: ఇతర దిశలకు లాగబడక, అవిభక్త శ్రద్ధతో ఉండడాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు ఉద్దేశం—ఆజ్ఞాత్మక నిర్బంధమా లేక శ్రేయస్సుకోసం సలహానా
  choice: ‘మీ సొంత మేలు కోసమే... మీ మెడకు ఉరి వేయడానికి కాదు’ అని ఉంచడం
  alternative: ‘మీపై ఆంక్ష విధించడానికి కాదు’
  rationale: వివాహం లేదా అవివాహిత స్థితిపై బలవంతపు నియమం పెడుతున్నానని పౌలు చెప్పడం లేదనే ఉద్వేగాన్ని మూలంలోని ఉరి రూపకంతోనే నిలుపుతుంది.
- issue: εὐπάρεδρον యొక్క భక్తి/సేవ భావపరిధి
  choice: ‘ప్రభువును అంటిపెట్టుకొని ఉండడం’
  alternative: ‘ప్రభువుకు భక్తి చూపడం’
  rationale: మూలపదంలో ప్రభువు దగ్గర స్థిరంగా హాజరై ఉండడమనే భావం ఉంది; ‘భక్తి’ మాత్రమే అని అనువదిస్తే ఆ కార్యాత్మక, సంబంధాత్మక విస్తృతి తగ్గవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ‘కాదు... కానీ’ విరుద్ధ నిర్మాణాన్ని నిలిపి, చివరి ఉద్దేశ్యాలను సహజ తెలుగు వాక్యక్రమంలో అమర్చింది.
