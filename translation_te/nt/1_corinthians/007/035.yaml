- from: మీ సొంత మేలు కోసమే ఇది చెబుతున్నాను; మీ మెడకు ఉరి వేయడానికి కాదు, మర్యాదకరమైన ప్రవర్తన కోసమూ, పరధ్యానం లేకుండా ప్రభువును అంటిపెట్టుకొని ఉండడం కోసమూ చెబుతున్నాను.
  to: ఇది మీ సొంత మేలు కోసమే చెబుతున్నాను; మీపై ఉచ్చు వేయడానికి కాదు, సముచితమైన దానికోసమూ, ఎలాంటి పరధ్యానం లేకుండా ప్రభువుకు అంకితమై ఉండడానికోసమూ చెబుతున్నాను.
  rationale: The revision preserves the source’s ‘not ... but’ contrast, retains βρόχος as an image of a noose/snare without implying execution, renders εὔσχημον broadly as ‘what is proper,’ and expresses εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως as undistracted commitment to the Lord. No textual-critical ambiguity requiring a footnote arises here.
  reviewer_model: gpt-5.6-terra
