id: 1CO.7.32
reference: 1 Corinthians 7:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: te
  text: అయితే మీరు చింతలు లేనివారిగా ఉండాలని నేను కోరుతున్నాను. పెళ్లి కాని పురుషుడు ప్రభువుకు సంబంధించిన వాటి గురించి, ప్రభువును ఎలా సంతోషపెట్టాలో శ్రద్ధ వహిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పెళ్లి కాని వ్యక్తి.’ గ్రీకులో ఇది పుంలింగ ఏకవచనం (‘పెళ్లి కాని పురుషుడు’); అయితే చుట్టుపక్కల సందర్భంలో పౌలు పెళ్లి కాని, పెళ్లయిన స్థితులను పురుషులు మరియు స్త్రీలు—ఇద్దరికీ సంబంధించి చర్చిస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: అయితే ... నేను కోరుతున్నాను
  rationale: θέλω యొక్క సంకల్పార్థాన్ని ‘కోరుతున్నాను’ సహజంగా తెలియజేస్తుంది. δέ మునుపటి చర్చతో స్వల్ప వ్యత్యాసం లేదా మార్పును సూచిస్తున్నందున ‘అయితే’ ఎంచుకున్నాం.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: మీరు చింతలు లేనివారిగా ఉండాలని
  rationale: ἀμέριμνος అనవసరమైన ఆందోళన లేదా చింత నుండి విముక్తిగా ఉండడాన్ని సూచిస్తుంది; ‘చింతలు లేనివారిగా’ అనేది నిర్లక్ష్యాన్ని సూచించకుండా ఈ భావాన్ని అందిస్తుంది.
- source_word: ὁ ἄγαμος
  choice: పెళ్లి కాని పురుషుడు
  rationale: గ్రీకు పదబంధం పుంలింగ ఏకవచనంలో ఉంది. సమీప వచనాల్లో పురుషుల, స్త్రీల పరిస్థితులను వేరుగా ప్రస్తావిస్తున్నందున మూలంలోని లింగాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: μεριμνᾷ
  choice: గురించి ... శ్రద్ధ వహిస్తాడు
  rationale: μεριμνάωకు సందర్భానుసారం ‘చింతించు’ లేదా ‘శ్రద్ధ వహించు’ అనే భావాలున్నాయి. ప్రభువుకు సంబంధించిన విషయాల పట్ల సానుకూల శ్రద్ధను తెలిపేందుకు ఈ ఎంపిక సహజంగా ఉంది; అదే సమయంలో ముందున్న ἀμερίμνουςతో భావసంబంధాన్ని నిలుపుతుంది.
- source_word: τὰ τοῦ κυρίου
  choice: ప్రభువుకు సంబంధించిన వాటి
  rationale: ఈ గ్రీకు నుడికారం ప్రభువుకు చెందిన లేదా ఆయనకు సంబంధించిన విషయాలను విస్తృతంగా సూచిస్తుంది. అనవసరంగా భావాన్ని కుదించకుండా ‘సంబంధించిన వాటి’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: κυρίου / κυρίῳ
  choice: ప్రభువు / ప్రభువును
  rationale: క్రైస్తవ సందర్భంలో κύριος అనే బిరుదుకు ఆధునిక ప్రామాణిక తెలుగు రూపం ‘ప్రభువు’; మూలంలోని బిరుదు సంబంధిత ధార్మిక బలాన్ని ఇది నిలుపుతుంది.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: ప్రభువును ఎలా సంతోషపెట్టాలో
  rationale: πῶς పద్ధతి లేదా లక్ష్యాన్ని సూచిస్తుంది; subjunctive ἀρέσῃ ఇక్కడ ఆలోచనలో ఉన్న లక్ష్యాన్ని తెలియజేస్తుంది. తెలుగు పరోక్ష ప్రశ్న నిర్మాణమైన ‘ఎలా ... పెట్టాలో’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అవివాహిత స్థితిని సూచించే పుంలింగ ఏకవచనం
  choice: ప్రధాన పాఠ్యంలో ‘పెళ్లి కాని పురుషుడు’ అని పుంలింగ ఏకవచనాన్ని నిలుపడం
  alternative: ‘పెళ్లి కాని వ్యక్తి’ లేదా ‘అవివాహితుడు’
  rationale: ὁ ἄγαμος వ్యాకరణపరంగా పుంలింగ ఏకవచనం; తరువాతి వచనాల్లో పౌలు పురుషుని, స్త్రీని వేర్వేరుగా చర్చిస్తాడు. అందువల్ల ప్రధాన పాఠ్యంలో మూలరూపాన్ని నిలిపి, విస్తృత సందర్భాన్ని పాదసూచికలో వివరించాం.
- issue: ἀμέριμνος మరియు μεριμνάω మధ్య భావసంబంధం
  choice: మొదట ‘చింతలు లేనివారిగా,’ తరువాత ‘శ్రద్ధ వహిస్తాడు’
  alternative: రెండు చోట్లా ‘చింత’ అనే పదాన్ని ఉపయోగించడం
  rationale: ఒకే పదకుటుంబం ఉండటం మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను సూచిస్తుంది; అయితే సందర్భంలో రెండవ వాడుక సానుకూల శ్రద్ధను కూడా వ్యక్తం చేస్తుంది. తెలుగు సహజత్వం కోసం వేర్వేరు పదాలను వాడినా భావసంబంధం వాక్య నిర్మాణంలో నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి. ‘పెళ్లి కాని’ అనే ప్రస్తుత వాడుకను ఎంచుకొని, ‘ప్రభువు’ అనే స్థిరమైన నూతన నిబంధన బిరుదును నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
