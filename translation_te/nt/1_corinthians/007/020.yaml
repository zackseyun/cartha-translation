  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἕκαστος ἐν τῇ κλήσει ᾗ ἐκλήθη ἐν ταύτῃ μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/020.yaml
  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: te
  text: ప్రతి ఒక్కడూ ఏ పిలుపులో పిలువబడ్డాడో, ఆ పిలుపులోనే నిలిచి ఉండాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరిస్థితిలో,” “స్థితిలో,” లేక “జీవిత స్థానంలో.” గ్రీకులో “పిలుపు” అనే పదమే ఉంది; అదే వాక్యంలో ఉన్న “పిలువబడ్డాడు” అనే మాటతో ఇది ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో పురుషలింగ ఏకవచన రూపం ప్రతినిధిగా వాడబడింది; ఈ ఆదేశం ప్రతి విశ్వాసికీ వర్తిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: ప్రతి ఒక్కడూ
  rationale: విభజనాత్మక ఏకవచన భావాన్ని నిలుపుతూ, ఆదేశం ఒక్కొక్క విశ్వాసికి వర్తిస్తుందని స్పష్టంగా తెలియజేస్తుంది.
- source_word: κλήσει
  choice: పిలుపులో
  rationale: సందర్భంలో జీవన పరిస్థితి లేదా సామాజిక స్థితి భావం ఉన్నప్పటికీ, మూలంలోని ‘పిలుపు’ అనే పదాన్ని నిలిపి, ἐκλήθη (‘పిలువబడ్డాడు’)తో ఉన్న ఉద్దేశపూర్వక పదబంధ సంబంధాన్ని కాపాడుతుంది.
- source_word: ᾗ ἐκλήθη
  choice: ఏ పిలుపులో పిలువబడ్డాడో
  rationale: ἐν భావాన్ని ‘లో’తో నిలుపుతుంది; కర్తను దేవుడని అనువాదంలో అదనంగా పేర్కొనకుండా మూలంలోని దైవకర్మణి అవకాశాన్ని కాపాడుతుంది.
- source_word: ἐν ταύτῃ
  choice: ఆ పిలుపులోనే
  rationale: దర్శక సర్వనామం ముందున్న పిలుపునే సూచిస్తుందని సహజమైన తెలుగులో స్పష్టం చేస్తూ, ‘నే’ ద్వారా అదే స్థితిలో కొనసాగాలనే బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: μενέτω
  choice: నిలిచి ఉండాలి
  rationale: వర్తమాన ఆజ్ఞార్థకంలోని కొనసాగింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘తప్పక’ వంటి అతిగా నిరపేక్షమైన బలాన్ని చేర్చదు.
theological_decisions:
- issue: κλῆσις పదానికి సందర్భంలోని అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘పిలుపు’ను నిలుపడం
  alternative: పరిస్థితి; స్థితి; జీవిత స్థానం
  rationale: సమీప సందర్భం సున్నతి, దాసత్వం వంటి జీవన పరిస్థితులను చర్చించినా, κλήσει మరియు ἐκλήθη మధ్య ఉన్న పదప్రయోగ సంబంధం దేవుని పిలుపు మరియు పిలువబడినప్పటి పరిస్థితి మధ్య ఉద్దేశపూర్వక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: పురుషలింగ ఏకవచన రూపాల ప్రతినిధి ప్రయోగం
  choice: ‘ప్రతి ఒక్కడూ ... పిలువబడ్డాడో’ అనే పురుషలింగ ఏకవచనాన్ని ఉంచడం
  alternative: ప్రతి ఒక్కరూ ... పిలువబడ్డారో; ప్రతి వ్యక్తీ
  rationale: గ్రీకు వ్యాకరణ రూపాన్ని ప్రతిబింబిస్తూ, అది ప్రతి విశ్వాసికీ వర్తించే ప్రతినిధి ప్రయోగమని పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘పిలుపు/పిలువబడ్డాడు’ పదసంబంధాన్ని ఉద్దేశపూర్వకంగా నిలిపి, సామాజిక పరిస్థితి మరియు దైవ పిలుపు మధ్య మూలపాఠ్యంలోని అర్థ ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచింది.
