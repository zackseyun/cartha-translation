id: 1CO.7.18
reference: 1 Corinthians 7:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: te
  text: ఎవరైనా సున్నతి పొందిన స్థితిలో పిలువబడ్డాడా? అతడు సున్నతి గుర్తులను కప్పిపుచ్చుకోవడానికి ప్రయత్నించకూడదు.[a] ఎవరైనా సున్నతి పొందని స్థితిలో పిలువబడ్డాడా? అతడు సున్నతి చేయించుకోకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ముందుచర్మాన్ని తిరిగి లాగకూడదు.” గ్రీకు క్రియ సున్నతి గుర్తులను దాచడానికి చేసే ప్రయత్నాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: సున్నతి పొందిన స్థితిలో
  rationale: పూర్తయిన క్రియ ఫలితంగా కొనసాగుతున్న స్థితిని గ్రీకు పర్ఫెక్ట్ పార్టిసిపిల్ సూచిస్తుంది. ఈ తెలుగు రూపం పిలుపు వచ్చినప్పుడు ఉన్న స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: ἐκλήθη / κέκληταί
  choice: పిలువబడ్డాడా
  rationale: సందర్భంలో ఇది దేవుని పిలుపును సూచిస్తుంది. గ్రీకులో కాలరూపాలు వేరైనా, ఇక్కడ భావపరమైన వ్యత్యాసాన్ని బలవంతంగా చూపకుండా రెండు ప్రశ్నల్లో సహజమైన ఒకే తెలుగు రూపాన్ని వాడాం.
- source_word: ἐπισπάσθω
  choice: దాన్ని కనబడకుండా చేసుకోవడానికి ప్రయత్నించకూడదు
  rationale: ఈ క్రియ సున్నతి గుర్తులను కప్పిపుచ్చడం లేదా తొలగించినట్లు కనిపింపజేయడం అనే ప్రాచీన ఆచారాన్ని సూచిస్తుంది. అస్పష్టమైన పదశః రూపం కంటే ఆధునిక పాఠకునికి చర్య ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది; మరింత పదశః అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐν ἀκροβυστίᾳ
  choice: సున్నతి పొందని స్థితిలో
  rationale: ఈ పదబంధం పిలువబడినప్పుడు వ్యక్తి ఉన్న స్థితిని సూచిస్తుంది. 'సున్నతి లేమిలో' వంటి కృత్రిమ పదశః రూపం కంటే ఇది సహజమైన ఆధునిక తెలుగు.
- source_word: περιτεμνέσθω
  choice: సున్నతి చేయించుకోకూడదు
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థకం నిషేధాన్ని వ్యక్తం చేస్తుంది. మధ్యమ/కర్మణి రూపానికి తెలుగులో సహజంగా 'చేయించుకోకూడదు' సరిపోతుంది.
theological_decisions:
- issue: రెండు వాక్యాల్లో 'పిలువబడడం' అనే మాట అర్థం
  choice: ఒక నిర్దిష్ట మతసామాజిక స్థితిలో ఉన్నప్పుడు దేవునిచేత క్రైస్తవ జీవితం వైపు పిలువబడడం
  alternative: సాధారణంగా ఎవరైనా పిలవడం
  rationale: 1 కొరింథీయులు 7 అధ్యాయం తక్షణ సందర్భంలో పౌలు, దేవుని పిలుపు వచ్చినప్పుడు విశ్వాసి ఉన్న స్థితి గురించి మాట్లాడుతున్నాడు. అయితే భావాన్ని 'మారుమనస్సు పొందడం' అని విస్తరించకుండా, మూలంలోని 'పిలువబడడం' అనే భావాన్నే అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని రెండు ప్రశ్నలు, రెండు నిషేధాలు సమాంతరంగా నిలుపబడ్డాయి; ప్రాచీన వైద్య/శరీర సంబంధ చర్యను ప్రధాన వచనంలో మర్యాదగా స్పష్టం చేసి, పదశః భావాన్ని పాదసూచికలో ఇచ్చాం.
