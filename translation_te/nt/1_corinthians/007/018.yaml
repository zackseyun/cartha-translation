  naturalness: ‘సున్నతి పొందిన/పొందని స్థితిలో పిలువబడ్డాడా?’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సమాంతరంగా ఉంది. మొదటి నిషేధంలో ‘దాన్ని’ అనే సర్వనామానికి బదులు ‘సున్నతి గుర్తులను’ అని చెప్పడం సూచనను మరింత స్పష్టం చేస్తుంది.
