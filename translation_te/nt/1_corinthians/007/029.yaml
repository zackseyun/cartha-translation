id: 1CO.7.29
reference: 1 Corinthians 7:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: te
  text: 'సహోదరులారా[a], నేను చెప్పేది ఇదే: కాలం కుదించబడింది[b]; ఇకనుంచి భార్యలు ఉన్నవారు కూడా భార్యలు లేనివారిలా ఉండాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరులారా’ అని అనువదించిన ἀδελφοί గ్రీకు పదం పుంలింగ బహువచనం; సందర్భాన్ని బట్టి అది తోటి విశ్వాసులైన స్త్రీపురుషులిద్దరినీ ఉద్దేశించవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘నిర్ణీత కాలం స్వల్పమైంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: అయితే నేను చెప్పేది ఇదే
  rationale: పౌలు తాను వివరించబోయే విషయాన్ని పరిచయం చేసే మాటగా సహజమైన ఆధునిక తెలుగులో అనువదించబడింది; δέ యొక్క సంధాన భావాన్ని ‘అయితే’ తెలియజేస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పుంలింగ బహువచన సంబోధనను రూపపరంగా నిలుపుతూ, గౌరవప్రదమైన తెలుగు సంఘ సంబోధనను ఉపయోగించింది; సందర్భంలో ఇది స్త్రీపురుషులిద్దరినీ ఉద్దేశించి ఉండవచ్చని పాదసూచిక వివరిస్తుంది.
- source_word: ὁ καιρός
  choice: కాలం
  rationale: ఇక్కడ καιρός కేవలం గడియార కాలం కాక నిర్ణాయకమైన లేదా నిర్దిష్టమైన కాలాన్ని సూచించగలదు. ‘కాలం’ సంక్షిప్తంగా, సహజంగా ఉండి సందర్భార్థాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: συνεσταλμένος ἐστίν
  choice: కుదించబడింది
  rationale: పరిణామంగా ఏర్పడి ప్రస్తుతం కొనసాగుతున్న స్థితిని సూచించే గ్రీకు పరిపూర్ణ పరిభాషాత్మక నిర్మాణాన్ని నిలుపుతుంది. కర్త ఎవరో వాక్యంలో చెప్పనందున తెలుగులోనూ చెప్పలేదు.
- source_word: τὸ λοιπὸν
  choice: ఇకనుంచి
  rationale: మిగిలిన కాలానికి వర్తించే ఆచరణాత్మక పరిణామాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἵνα
  choice: కాబట్టి
  rationale: కాలం కుదించబడిన స్థితికి తరువాతి జీవన విధానానికి మధ్యనున్న ఫలితాత్మక/ఉద్దేశాత్మక సంబంధాన్ని తెలుగులో సహజంగా కలుపుతుంది; ఖచ్చితంగా ఉద్దేశమా ఫలితమా అని అతిగా నిర్ణయించదు.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: భార్యలు ఉన్నవారు
  rationale: γυναῖκας ఈ సందర్భంలో ‘స్త్రీలు’ అని సాధారణంగా కాక ‘భార్యలు’ అని సూచిస్తుంది; గ్రీకు పదబంధానికి సన్నిహితంగా ఉంటుంది.
- source_word: ὡς μὴ ἔχοντες
  choice: భార్యలు లేనివారిలా
  rationale: తులనాత్మక భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తూ మూలంలోని ఉద్దేశపూర్వకమైన కఠినతను తగ్గించదు.
theological_decisions:
- issue: వివాహం గురించి పౌలు ఇచ్చిన ఆదేశం యొక్క కాపరి సంబంధమైన మరియు దైవశాస్త్ర సంబంధమైన భావం
  choice: ‘భార్యలు ఉన్నవారు భార్యలు లేనివారిలా ఉండాలి’ అని నేరుగా అనువదించి, మూలంలోని ఉద్వేగభరితమైన భావాన్ని నిలుపడం.
  alternative: ‘వివాహబంధంపై అతిగా ఆధారపడకుండా జీవించాలి’ అని వివరణాత్మకంగా మృదువు చేయడం.
  rationale: ఈ వాక్యం కాలపు అత్యవసరత దృష్ట్యా సాధారణ సామాజిక పరిస్థితులకు సాపేక్ష ప్రాధాన్యం ఇస్తుంది. ఇది వైవాహిక బాధ్యతలను రద్దు చేస్తుందని గానీ కేవలం భావోద్వేగ నిరాసక్తతను సూచిస్తుందని గానీ అనువాదమే నిర్ణయించకూడదు.
- issue: సమయం కుదించబడటానికి మరియు తరువాతి ఆదేశానికి మధ్య ἵνα సంబంధం
  choice: తెలుగులో ‘కాబట్టి’ అని ఇచ్చి ఆచరణాత్మక ఫలితాన్ని స్పష్టంగా చూపడం.
  alternative: ‘అందుకోసం’ అని ఇచ్చి కేవలం ఉద్దేశార్థంగా నిర్ణయించడం.
  rationale: ἵνα ఉద్దేశం లేదా ఫలితం రెండింటి ఛాయలను కలిగి ఉండగలదు. సందర్భంలో వచ్చే ఆదేశానికి సహజమైన అనుసంధానం అవసరం, కానీ దేవుని ఉద్దేశ నిర్మాణాన్ని అనువాదంలో అతిగా నిర్ధారించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. ‘సహోదరులారా’ సంఘ సంబోధనకు తగిన గంభీరతను ఇస్తుంది. మూలంలోని వివాహ సంబంధమైన కఠినమైన వాక్యాన్ని వివరణాత్మకంగా మృదువు చేయలేదు. పాదసూచిక గుర్తులు సంబంధిత పదాల వెంటనే ఉంచబడ్డాయి.
