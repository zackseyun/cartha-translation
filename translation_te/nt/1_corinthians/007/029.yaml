  terminology: ‘సహోదరులారా’ is a suitable formal congregational address, with an appropriate inclusive-audience footnote. ‘భార్యలు’ correctly reflects γυναῖκας in this context. ‘కాలం కుదించబడింది’ is understandable and adequately reflects the resulting state of the perfect periphrastic expression.
  issues:
