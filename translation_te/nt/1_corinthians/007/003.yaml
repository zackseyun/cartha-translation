source:
  edition: SBLGNT
  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: te
  text: భర్త తన భార్యకు చెల్లించవలసిన దాంపత్య బాధ్యతను నెరవేర్చాలి[a]; అలాగే భార్య కూడా తన భర్తకు చెల్లించవలసిన దాంపత్య బాధ్యతను నెరవేర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమెకు బాకీ ఉన్నదాన్ని’; మరింత అక్షరార్థంగా, ‘అప్పు/బాధ్యతను.’ ఈ సందర్భంలో ఇది భార్యాభర్తలు ఒకరికొకరు నెరవేర్చవలసిన దాంపత్య బాధ్యతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναικί
  choice: భార్యకు
  rationale: వివాహ సంబంధమైన తక్షణ సందర్భంలో γυνή సాధారణంగా ‘స్త్రీ’ అని కాకుండా ‘భార్య’ అని అర్థమవుతుంది.
- source_word: ἀνήρ / ἀνδρί
  choice: భర్త / భర్తకు
  rationale: γυνήతో సమాంతరంగా ఉన్న వివాహ సందర్భంలో ἀνήρ అంటే సాధారణ ‘పురుషుడు’ కంటే ‘భర్త’.
- source_word: ὀφειλήν
  choice: చెల్లించవలసిన దాంపత్య బాధ్యత
  rationale: ὀφειλή అక్షరార్థంగా అప్పు లేదా చెల్లించవలసిన బాధ్యతను సూచిస్తుంది; చుట్టుపక్కల వచనాల ప్రకారం ఇది భార్యాభర్తలు పరస్పరం నెరవేర్చవలసిన దాంపత్య బాధ్యత. ఈ పదబంధం మూలపదంలోని బాకీ భావాన్నీ సందర్భంలోని దాంపత్య భావాన్నీ నిలుపుతుంది.
- source_word: ἀποδιδότω
  choice: నెరవేర్చాలి
  rationale: వర్తమాన కాల ఆజ్ఞారూపం నిరంతర బాధ్యతను తెలియజేస్తుంది. తెలుగులో ‘నెరవేర్చాలి’ సహజంగా ఆజ్ఞాత్మక భావాన్ని వ్యక్తం చేస్తుంది; ‘చెల్లించవలసిన’ అనే విశేషణంతో కలిసి ἀποδίδωμι లోని తిరిగి చెల్లించే భావమూ ప్రతిఫలిస్తుంది.
- source_word: ὁμοίως δὲ καὶ
  choice: అలాగే ... కూడా
  rationale: ఈ నిర్మాణం భార్యాభర్తల బాధ్యత పరస్పరమైనదనీ సమానంగా వర్తిస్తుందనీ సూచిస్తుంది; తెలుగు సమాంతర నిర్మాణం దానిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ὀφειλή సూచించే దాంపత్య బాధ్యతను ఎంత స్పష్టంగా అనువదించాలి
  choice: ప్రధాన పాఠంలో ‘చెల్లించవలసిన దాంపత్య బాధ్యత’ అని అనువదించడం
  alternative: ‘ఆమెకు చెందవలసినది’; ‘ఆమెకు బాకీ ఉన్న బాధ్యత’; ‘దాంపత్య హక్కు’
  rationale: సందర్భం లైంగిక/దాంపత్య బాధ్యతను సూచించినప్పటికీ, మూల నామవాచకం స్వతహాగా విస్తృతమైన ‘బాకీ/బాధ్యత’ భావం కలది. ఎటువంటి శారీరక లేదా న్యాయపరమైన వివరణను అతిగా చేర్చకుండా సందర్భార్థాన్ని స్పష్టం చేసి, పరస్పర నైతిక బాధ్యతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దాంపత్య బాధ్యత’ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘చెల్లించవలసిన’ మూలంలోని ఋణబాధ్యత భావాన్ని కాపాడుతుంది. రెండవ భాగంలో క్రియను సహజ తెలుగు సమాంతర నిర్మాణంలో పునరుక్తి చేసి పరస్పరతను స్పష్టం చేశాం.
