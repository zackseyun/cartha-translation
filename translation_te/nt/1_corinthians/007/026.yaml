id: 1CO.7.26
reference: 1 Corinthians 7:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: te
  text: 'కాబట్టి, ప్రస్తుతం ఉన్న సంకటస్థితి కారణంగా[a] ఇది మంచిదని నేను భావిస్తున్నాను: ఒక మనిషికి[b] తాను ఉన్న స్థితిలోనే ఉండడం మంచిది.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రస్తుత అవసరం కారణంగా’; లేదా, ‘సమీపిస్తున్న సంకటం కారణంగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఒక వ్యక్తికి.’ గ్రీకులో ‘మనిషి’ అనే పదం ఇక్కడ సాధారణంగా ఏ వ్యక్తినైనా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘అలా ఉండడం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: నేను భావిస్తున్నాను
  rationale: పౌలు వ్యక్తపరుస్తున్న ఆలోచించి చేసిన వ్యక్తిగత నిర్ణయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; దీన్ని నిరపేక్ష ఆజ్ఞగా మార్చదు.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి చర్చనుంచి తీసుకున్న నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: ఇది మంచిదని
  rationale: గ్రీకు క్రియారూప నిర్మాణాన్ని సహజమైన తెలుగు పరోక్ష వాక్యంగా అందిస్తుంది; καλός అనే పదంలోని ‘మంచిది/తగినది’ అనే మూల్యాంకన భావాన్ని కాపాడుతుంది.
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: ప్రస్తుతం ఉన్న కష్టకాలాన్ని బట్టి
  rationale: ἐνεστῶσαν లోని ప్రస్తుత భావాన్నీ, ἀνάγκη లోని ఒత్తిడి లేదా సంకట పరిస్థితి భావాన్నీ సందర్భానుగుణంగా తెలియజేస్తుంది; సాధారణ ‘అవసరం’గా మాత్రమే పరిమితం చేయదు.
- source_word: ὅτι
  choice: ':'
  rationale: ఇక్కడ పౌలు చేసిన మూల్యాంకనం ఏమిటో వివరించే వాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేయడానికి ద్విబిందువు ఉపయోగించబడింది; కారణార్థాన్ని బలవంతంగా రుద్దదు.
- source_word: καλὸν
  choice: మంచిది
  rationale: వచనంలో పునరావృతమైన καλός పదాన్ని అదే తెలుగు పదంతో పునరావృతం చేసి మూలంలోని శబ్ద సంబంధాన్ని కాపాడుతుంది.
- source_word: ἀνθρώπῳ
  choice: మనిషి
  rationale: గ్రీకు ఏకవచన ἄνθρωπος ను నేరుగా ప్రతిబింబిస్తుంది. సందర్భంలో ఇది సాధారణంగా వ్యక్తిని సూచించే అవకాశం ఉన్నందున ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: τὸ οὕτως εἶναι
  choice: ఉన్న స్థితిలోనే ఉండడం
  rationale: అక్షరార్థమైన ‘అలా ఉండడం’ను సందర్భానికి తగిన సహజ తెలుగులో వ్యక్తపరుస్తుంది; ప్రస్తుతం ఉన్న పరిస్థితిని కొనసాగించడం అనే సూచనను తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు మాట స్వభావం
  choice: ప్రస్తుత కష్టకాలాన్ని బట్టి పౌలు ఇస్తున్న సందర్భానుగుణమైన ఆలోచిత సలహాగా అనువదించడం
  alternative: వివాహానికి వ్యతిరేకమైన సర్వకాలిక నైతిక ఆజ్ఞగా అనువదించడం
  rationale: ‘నేను భావిస్తున్నాను’ అనే మాట, ‘ప్రస్తుతం ఉన్న కష్టకాలాన్ని బట్టి’ అనే ఆధారం—ఇవి నిరపేక్షమైన వివాహ నిషేధం కంటే పరిస్థితికి అనుగుణమైన సలహాను సూచిస్తాయి. అయితే వచనం చెప్పేదానికంటే అధికంగా వ్యాఖ్యానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని రెండుసార్లు వచ్చే ‘మంచిది’ అనే పదాన్ని కాపాడి, పౌలు మాటను ఆజ్ఞగా కాక ఆలోచిత నిర్ణయంగా ఉంచింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
