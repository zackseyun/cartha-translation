id: 1CO.7.19
reference: 1 Corinthians 7:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: te
  text: సున్నతి ఏమీ కాదు[a], సున్నతి లేకపోవడమూ ఏమీ కాదు; కానీ దేవుని ఆజ్ఞలను పాటించడమే ముఖ్యం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లెక్కలోకి రాదు”; “ఏమీ కాదు” అనే రెండు సందర్భాలకూ ఇది వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: సున్నతి
  rationale: తెలుగులో ప్రామాణికమైన నామవాచక రూపం; క్రియకన్నా నిబంధన-గుర్తింపుకు సంబంధించిన స్థితిని సూచించే గ్రీకు నామవాచకాన్ని నిలుపుతుంది.
- source_word: οὐδέν ἐστιν
  choice: ఏమీ కాదు
  rationale: పౌలు రెండుసార్లు ఉపయోగించిన సూటియైన, బలమైన మూల నిర్మాణాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది; ‘లెక్కలోకి రాదు’ అనే భావం కూడా సందర్భంలో సాధ్యమే.
- source_word: ἀκροβυστία
  choice: సున్నతి లేకపోవడం
  rationale: ‘సున్నతి’కి ప్రత్యక్ష వ్యతిరేక స్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేసి, వాక్యంలోని సమాంతరతను నిలుపుతుంది.
- source_word: ἀλλά
  choice: ; …ముఖ్యం
  rationale: మొదటి రెండు స్థితులకు, నిజంగా ప్రాధాన్యమున్న దానికి మధ్య ఉన్న బలమైన వ్యతిరేకతను తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: τήρησις
  choice: పాటించడం
  rationale: ఆజ్ఞల విషయంలో ‘కాపాడడం’ కంటే ఆధునిక తెలుగులో సహజంగా ఉండి, ఆచరణలో అనుసరించడం అనే భావాన్ని అందిస్తుంది.
- source_word: ἐντολῶν θεοῦ
  choice: దేవుని ఆజ్ఞలను
  rationale: గ్రీకు బహువచనంలోని నిర్దిష్టమైన ‘ఆజ్ఞలు’ అనే భావాన్నీ, దేవునితో గల సంబంధాన్నీ నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: సున్నతి, సున్నతి లేకపోవడం గురించి పౌలు ఇచ్చే విలువ నిర్ణయం
  choice: రెండు స్థితులూ స్వతహాగా నిర్ణాయకమైనవి కావని, వాటికి విరుద్ధంగా దేవుని ఆజ్ఞలను పాటించడమే ముఖ్యమని అనువదించబడింది.
  alternative: సున్నతికి ప్రతి సందర్భంలోనూ ఎలాంటి నైతిక ప్రాముఖ్యత లేదని విస్తృతంగా వ్యాఖ్యానించడం.
  rationale: మూల వాక్యం రెండింటినీ ‘ఏమీ కాదు’ అని సమాంతరంగా పేర్కొని, ఆజ్ఞలను పాటించడాన్ని వాటితో వ్యతిరేకిస్తుంది. సందర్భానికి మించిన సిద్ధాంత నిర్ణయాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకునికి అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలు శైలి. మూలంలోని పునరుక్తి, సమాంతరత నిలుపబడ్డాయి. చివరి విరుద్ధ భాగం తెలుగులో అసంపూర్ణంగా వినిపించకుండా ‘ముఖ్యం’ చేర్చి భావాన్ని స్పష్టం చేసింది.
