  text: But I say this as a concession[a], not as a command.
translation:
  language: te
  text: అయితే, నేను దీనిని వెసులుబాటుగా చెబుతున్నాను; ఆజ్ఞగా కాదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: దీనిని
  rationale: ఈ సూచన సర్వనామం సందర్భంలో వెంటనే ప్రస్తావించిన విషయాన్ని సూచిస్తుంది; అది ముందున్న మాటనా, తరువాతి మాటనా అని అనవసరంగా నిర్ధారించకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ ఇక్కడ స్వల్ప వ్యత్యాసాన్ని లేదా విషయమార్పును సూచిస్తుంది; ‘అయితే’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: λέγω
  choice: చెబుతున్నాను
  rationale: గ్రీకు వర్తమాన సూచక క్రియకు సహజమైన తెలుగు సమానార్థకం.
- source_word: κατὰ συγγνώμην
  choice: అనుమతిగా
  rationale: ఈ సందర్భంలో ఈ పదబంధం తప్పనిసరి ఆజ్ఞకు భిన్నంగా ఇచ్చే అనుమతిని లేదా వెసులుబాటును సూచిస్తుంది.
- source_word: οὐ κατ’ ἐπιταγήν
  choice: ఆజ్ఞగా కాదు
  rationale: అధికారపూర్వకంగా తప్పనిసరి చేసే ఆదేశం కాదనే స్పష్టమైన వ్యత్యాసాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: పౌలు చెప్పేది వ్యక్తిగత అనుమతా, లేక తక్కువ స్థాయి దైవాజ్ఞా అన్న ప్రశ్న
  choice: ఈ మాటను బద్ధమైన ఆజ్ఞగా కాక అనుమతిగా పౌలు స్పష్టంగా పేర్కొంటున్నట్లు అనువదించాం.
  alternative: ఇది ప్రత్యక్ష ఆజ్ఞ కాకపోయినా అపొస్తలుని సలహాగా అధికారాన్ని కలిగి ఉండవచ్చు.
  rationale: మూలవాక్యం అనుమతికీ ఆజ్ఞకీ మధ్య స్పష్టమైన వ్యత్యాసం చూపుతుంది; ఆ వ్యత్యాసాన్ని నిలుపుతూ, పౌలు అధికార స్వరూపం గురించి వాక్యం చెప్పనిదాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘అనుమతిగా’–‘ఆజ్ఞగా కాదు’ అనే జత మూలంలోని వ్యత్యాసాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచుతుంది.
