id: 1CO.7.9
reference: 1 Corinthians 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ οὐκ ἐγκρατεύονται, γαμησάτωσαν, κρεῖττον γάρ ἐστιν ⸀γαμῆσαι ἢ πυροῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: te
  text: అయితే వారు నిగ్రహం పాటించలేకపోతే, వివాహం చేసుకోవాలి; ఎందుకంటే మండిపోవడం[a] కంటే వివాహం చేసుకోవడం మేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘మండిపోవడం’ అని ఉంది. ఈ సందర్భంలో అది లైంగిక కోరికతో మండిపోవడాన్ని సూచించే అవకాశం అత్యధికం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: నిగ్రహం పాటించలేకపోతే
  rationale: ఈ సందర్భంలో లైంగిక కోరికల విషయంలో స్వీయనిగ్రహాన్ని పాటించడాన్ని సూచిస్తుంది. గ్రీకు రూపం నేరుగా ‘సాధించలేకపోవడం’ అని చెప్పకపోయినా, షరతుతో కూడిన ఈ ఉపదేశంలో తెలుగు సహజ ప్రయోగంగా ఈ భావం సరిపోతుంది.
- source_word: γαμησάτωσαν
  choice: వివాహం చేసుకోవాలి
  rationale: మూడవ పురుష బహువచన ఆజ్ఞార్థక భావాన్ని ఆధునిక తెలుగులో సహజమైన ఉపదేశ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: κρεῖττον
  choice: మేలు
  rationale: రెండు ప్రత్యామ్నాయాలను పోల్చే గ్రీకు తులనాత్మక పదానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: γαμῆσαι
  choice: వివాహం చేసుకోవడం
  rationale: గ్రీకు క్రియారూపాన్ని నేరుగా, సహజంగా అనువదిస్తుంది; తరువాతి క్రియారూపంతో ఉన్న సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: πυροῦσθαι
  choice: మండిపోవడం
  rationale: గ్రీకులోని అగ్ని రూపకాన్ని నిలుపుతూ, దాని సూచిత భావాన్ని ప్రధాన వాక్యంలో పూర్తిగా విప్పి చెప్పకుండా అసలు పాఠంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని లేదా మలుపును సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో πυροῦσθαι అర్థం
  choice: ప్రధాన పాఠంలో ‘మండిపోవడం’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘లైంగిక కోరికతో మండిపోవడం’ అని స్పష్టీకరించడం; లేదా తీర్పులో కాలిపోవడంగా గ్రహించడం
  rationale: వివాహం, అవివాహిత జీవితం, నిగ్రహం అనే తక్షణ సందర్భం లైంగిక కోరికను బలంగా సూచిస్తుంది. అయినా గ్రీకు పాఠం కోరికను స్పష్టంగా పేర్కొననందున ప్రధాన వాక్యంలో రూపకాన్ని నిలిపి, సందర్భానుగుణ భావాన్ని పాదటిప్పణిలో తెలియజేయడం అసలు పాఠంలోని కొంత అంతర్లీనతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఉపదేశ శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలోని వ్యత్యాసం, ఆజ్ఞార్థక బలం, తులనాత్మక నిర్మాణం, అగ్ని రూపకం వీలైనంత సహజంగా నిలుపబడ్డాయి.
