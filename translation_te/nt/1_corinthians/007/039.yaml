revisions:
- from: భార్య తన భర్త జీవించి ఉన్నంతకాలం అతనికి బంధించబడి ఉంటుంది. అయితే ఆమె భర్త నిద్రిస్తే[a], తాను కోరుకున్న వ్యక్తిని వివాహం చేసుకోవడానికి ఆమెకు స్వేచ్ఛ ఉంది—కాని ప్రభువులో మాత్రమే.[b]
