id: 1CO.7.39
reference: 1 Corinthians 7:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: te
  text: భార్య తన భర్త జీవించి ఉన్నంతకాలం బంధించబడి ఉంటుంది. అయితే ఆమె భర్త నిద్రిస్తే[a], తాను కోరుకున్న వ్యక్తిని వివాహం చేసుకోవడానికి ఆమెకు స్వేచ్ఛ ఉంది—కాని ప్రభువులో మాత్రమే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, చనిపోతే. గ్రీకులో మరణానికి సాధారణ సౌమ్యోక్తిగా ‘నిద్రించడం’ అనే మాట వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రభువులో మాత్రమే’ అంటే సాధారణంగా ప్రభువుకు చెందిన వ్యక్తిని, అంటే తోటి విశ్వాసిని మాత్రమే వివాహం చేసుకోవాలని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: భార్య
  rationale: వివాహ సందర్భంలో γυνή సాధారణంగా ‘స్త్రీ’ కంటే నిర్దిష్టంగా ‘భార్య’ను సూచిస్తుంది; వెంటనే ‘ఆమె భర్త’ అని రావడం దీనిని నిర్ధారిస్తుంది.
- source_word: δέδεται
  choice: బంధించబడి ఉంటుంది
  rationale: పూర్త భూతకాల నిష్క్రియ రూపం కొనసాగుతున్న బంధస్థితిని తెలియజేస్తుంది. మూలంలో లేని ‘ధర్మశాస్త్రం చేత’ వంటి వివరణను జోడించకుండా సంబంధపరమైన, నియమపరమైన భావాన్ని నిలుపుతుంది.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: జీవించి ఉన్నంతకాలం
  rationale: కాలవ్యవధిని తెలిపే గ్రీకు నుడికారానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἀνήρ
  choice: భర్త
  rationale: వివాహ సందర్భంలో ἀνήρ అంటే కేవలం ‘పురుషుడు’ కాదు, ‘భర్త’.
- source_word: κοιμηθῇ
  choice: నిద్రిస్తే
  rationale: మరణానికి వాడిన గ్రీకు సౌమ్యోక్తి రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, దాని ప్రత్యక్ష అర్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: ἐλευθέρα ἐστίν
  choice: ఆమెకు స్వేచ్ఛ ఉంది
  rationale: మునుపటి వివాహబంధం నుంచి విడుదలైన స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ᾧ θέλει
  choice: తాను కోరుకున్న వ్యక్తిని
  rationale: కొత్త జీవిత భాగస్వామిని ఎన్నుకునే స్వేచ్ఛను స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది; గ్రీకులో లేని లింగ నిర్దేశాన్ని జోడించదు.
- source_word: γαμηθῆναι
  choice: వివాహం చేసుకోవడానికి
  rationale: తెలుగులో నిష్క్రియ రూపమైన ‘వివాహం చేయబడడానికి’ అసహజంగా ఉంటుంది; ఈ సహజ రూపం వివాహం చేసుకునే భావాన్ని ఖచ్చితంగా అందిస్తుంది.
- source_word: μόνον
  choice: కాని ... మాత్రమే
  rationale: ఇప్పుడే పేర్కొన్న స్వేచ్ఛపై ఉన్న పరిమితిని స్పష్టంగా చూపిస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు వాడిన సంక్షిప్తమైన, ధార్మికంగా ప్రాధాన్యమున్న పదబంధాన్ని వ్యాఖ్యానించి విస్తరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: పునర్వివాహ సూచనలో ‘ప్రభువులో’ అనే మాట అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ప్రభువులో మాత్రమే’ అని యథాతథంగా ఉంచడం
  alternative: ప్రభువుకు చెందిన విశ్వాసిని మాత్రమే వివాహం చేసుకోవాలి; లేదా ప్రభువుపట్ల భక్తికి అనుగుణంగా మాత్రమే వివాహం చేసుకోవాలి
  rationale: ἐν κυρίῳ సంక్షిప్తంగా ఉండి కొంత వ్యాఖ్యాన విస్తృతిని కలిగిస్తుంది. ‘తోటి విశ్వాసిని మాత్రమే’ అనేది సాధారణ అవగాహన అయినా, దానిని ప్రధాన పాఠ్యంలో పెట్టడం గ్రీకు మాటను అవసరానికి మించి నిర్దిష్టం చేస్తుంది.
- issue: మరణానికి వాడిన నిద్ర రూపకం
  choice: ‘నిద్రిస్తే’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: చనిపోతే
  rationale: కోయిమావొమై ఇక్కడ మరణాన్ని సూచించే సౌమ్యోక్తి. రూపకాన్ని నిలుపడం మూలపాఠ్య ధ్వనిని కాపాడుతుంది; పాదసూచిక పాఠకునికి ప్రత్యక్ష అర్థాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘బంధించబడి’, ‘ప్రభువులో’ వంటి మూలపాఠ్యానికి ధార్మికంగా ముఖ్యమైన పదబంధాలు నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
