source:
  edition: SBLGNT
  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: te
  text: అయితే, మనుషులందరూ నాలాగే ఉండాలని నేను కోరుకుంటున్నాను. అయినా ప్రతి ఒక్కరికీ దేవుని నుండి తనదైన కృపావరం ఉంది—ఒకరికి ఒక విధంగా, మరొకరికి మరొక విధంగా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: కోరుకుంటున్నాను
  rationale: వర్తమానకాల వ్యక్తిగత కోరికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దీనిని ఆజ్ఞగా మార్చదు.
- source_word: πάντας ἀνθρώπους
  choice: మనుషులందరూ
  rationale: ἄνθρωπος ఇక్కడ సాధారణంగా మానవులను సూచిస్తుంది; సందర్భంలో పౌలు వివాహస్థితి గురించి పురుషులు, స్త్రీలు ఇద్దరినీ ఉద్దేశిస్తున్నందున సమగ్ర అర్థాన్ని నిలుపుతుంది.
- source_word: ὡς καὶ ἐμαυτόν
  choice: నాలాగే
  rationale: పౌలు తన ప్రస్తుత స్థితిని సూచిస్తున్నాడనే భావాన్ని ఉంచుతూ, అది అవివాహితత్వమా లేక లైంగిక నియమనిష్ఠా అనే విషయాన్ని వచనంలో అనవసరంగా నిర్ధారించదు.
- source_word: χάρισμα
  choice: కృపావరం
  rationale: దేవుడు అనుగ్రహించే వరం అనే పౌలు వాడే భావాన్ని తెలుగులో స్థిరంగా, దైవశాస్త్రపరంగా తటస్థంగా తెలియజేస్తుంది.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: ఒకరికి ఒక విధంగా, మరొకరికి మరొక విధంగా
  rationale: మూలంలోని సమాంతరమైన, ఉద్దేశపూర్వకంగా అస్పష్టమైన భేదాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘నాలాగే’ అనే మాట యొక్క నిర్దిష్ట భావం
  choice: మూలవచనంలోని సంక్షిప్తతను, అస్పష్టతను నిలుపడం
  alternative: ‘నాలాగే అవివాహితులుగా’ లేదా ‘నాలాగే నియమనిష్ఠతో’ అని స్పష్టీకరించడం
  rationale: గ్రీకు వచనం ఆ స్థితిని ఇక్కడ పేరుపెట్టి చెప్పదు; సందర్భం వివరణకు సహాయపడినా, అనువాదంలో ఒక్క వ్యాఖ్యానాన్ని బలవంతంగా చేర్చకూడదు.
- issue: కృపావరాల మధ్య భేదం
  choice: ‘ఒకరికి ఒక విధంగా, మరొకరికి మరొక విధంగా’
  alternative: ‘ఒకరికి బ్రహ్మచర్య వరం, మరొకరికి వివాహ వరం’
  rationale: విస్తృత సందర్భం ఆ దిశగా సూచించినా, ఈ వచనం రెండు వరాలను పేర్లతో నిర్వచించదు; మూలంలోని దైవశాస్త్రపరమైన విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించబడింది. గ్రీకు δέ యొక్క రెండు సందర్భాలను ‘అయితే’, ‘అయినా’గా సందర్భానుగుణంగా చూపించి వాక్యంలోని మృదువైన వ్యత్యాసాన్ని నిలిపింది.
