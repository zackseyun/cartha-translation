  source_fidelity: 'గ్రీకు మూలాన్ని నమ్మకంగా ప్రతిబింబిస్తుంది: θέλω యొక్క వ్యక్తిగత కోరికను ‘కోరుకుంటున్నాను’గా, πάντας ἀνθρώπους యొక్క సాధారణ/సమగ్ర సూచనను ‘మనుషులందరూ’గా, అలాగే ὡς καὶ ἐμαυτόν యొక్క ఉద్దేశపూర్వక అస్పష్టతను ‘నాలాగే’గా నిలుపుతుంది. ἕκαστος ἴδιον ἔχει χάρισμα ἐκ θεοῦ కూడా ‘ప్రతి ఒక్కరికీ దేవుని నుండి తనదైన కృపావరం ఉంది’లో సముచితంగా ఉంది. చివరి సమాంతర నిర్మాణం మూలంలోని అస్పష్ట భేదాన్ని కాపాడుతుంది.'
