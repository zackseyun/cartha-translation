id: 1CO.7.27
reference: 1 Corinthians 7:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δέδεσαι γυναικί; μὴ ζήτει λύσιν· λέλυσαι ἀπὸ γυναικός; μὴ ζήτει γυναῖκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: te
  text: నీవు భార్యతో బంధించబడి ఉన్నావా? విడుదల కోసం వెదకకు.[a] భార్య నుండి విడుదలై ఉన్నావా? ఒక భార్యను వెదకకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, భావాన్ని మరింత స్పష్టంగా చెబితే: “నీవు వివాహితుడివా? విడాకులు కోరకు. నీవు విడాకులు పొందావా? ఒక భార్యను వెదకకు.” గ్రీకు పాఠ్యం అక్షరార్థంగా “బంధించబడి ఉండడం,” “విడుదలై ఉండడం” గురించి చెబుతుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: బంధించబడి ఉన్నావా
  rationale: పరిపూర్ణ కర్మణి/మధ్యమ రూపంలోని ‘బంధింపబడి ఉండడం’ అనే భావాన్ని నిలుపుతూ, λύσιν/λέλυσαιతో ఉన్న వ్యతిరేక సమాంతరతను కాపాడుతుంది.
- source_word: γυναικί
  choice: భార్యకు
  rationale: వివాహ సందర్భంలో γυνή అంటే సాధారణంగా స్త్రీ కాక ‘భార్య’; చతుర్థీ విభక్తి బంధ సంబంధాన్ని సూచిస్తుంది.
- source_word: ζήτει
  choice: కోరకు
  rationale: ζητέω యొక్క ఆజ్ఞార్థక బలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λύσιν
  choice: విడుదలను
  rationale: ‘విప్పడం/విడుదల’ అనే మూల భావాన్ని, అలాగే తరువాతి λέλυσαιతో పదసంబంధాన్ని నిలుపుతుంది; ‘విడాకులు’ అని సంకుచితం చేయదు.
- source_word: λέλυσαι
  choice: విడుదల పొందివున్నావా
  rationale: పరిపూర్ణ రూపంలోని ప్రస్తుత ఫలిత స్థితిని తెలియజేస్తూ, δέδεσαιతో సమాంతరతను కాపాడుతుంది; విడాకులు, విధురత్వం లేదా ఇతర అవివాహిత స్థితి అని ముందుగానే నిర్ణయించదు.
- source_word: ἀπὸ γυναικός
  choice: భార్య నుండి
  rationale: ἀπό యొక్క ‘నుండి’ భావాన్ని నేరుగా ఇస్తుంది; వివాహ సందర్భం వల్ల γυνήను ‘భార్య’గా అనువదిస్తుంది.
- source_word: γυναῖκα
  choice: భార్యను
  rationale: చివరి నిషేధం వివాహాన్ని ఉద్దేశిస్తున్నందున ‘స్త్రీని’ కంటే ‘భార్యను’ సందర్భోచితంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: వచనాన్ని స్పష్టమైన ‘వివాహం/విడాకులు’ పదజాలంతో అనువదించాలా, లేక బంధం/విడుదల అనే పౌలు రూపకాన్ని నిలుపాలా?
  choice: ప్రధాన పాఠ్యంలో ‘బంధించబడి’ మరియు ‘విడుదల’ అనే రూపకాన్ని నిలిపాం.
  alternative: ‘నీకు వివాహమైందా? విడాకులు కోరకు. నీకు విడాకులయ్యాయా? భార్యను కోరకు.’
  rationale: గ్రీకు పాఠ్యం వివాహం/విడాకులకు మరింత స్పష్టమైన పదాలను కాక δέω/λύω పదజాలాన్ని వాడుతుంది. రూపకాన్ని నిలపడం మూలపాఠ్యానికి పారదర్శకంగా ఉండి, ‘విడుదల’ను కేవలం విడాకులకే పరిమితం చేయకుండా అసలైన అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే మూలంలోని బంధం–విడుదల సమాంతర రూపకాన్ని గౌరవప్రదమైన శైలిలో నిలిపింది. ‘కోరకు’ బైబిలు పఠనానికి తగిన సంక్షిప్త నిషేధార్థక రూపం.
