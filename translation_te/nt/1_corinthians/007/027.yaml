  naturalness: ‘విడుదల పొందివున్నావా’ కొంత భారంగా, అసహజంగా వినిపిస్తుంది. ‘విడుదలై ఉన్నావా’ సంక్షిప్తంగా, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి పరిపూర్ణ ఫలితస్థితిని తగినంతగా సూచిస్తుంది. రెండు నిషేధాల్లో ‘వెదకకు’ వాడటం మూలంలోని ζητέω పునరుక్తిని కూడా నిలుపుతుంది.
  terminology: ‘బంధించబడి’ మరియు ‘విడుదల’ ప్రధాన పాఠ్యంలో ఉంచడం సరైనది; ‘వివాహం/విడాకులు’ను ప్రత్యామ్నాయ వ్యాఖ్యానంగా పాదటిప్పణికే పరిమితం చేయాలి. పాదటిప్పణిలో ‘నీకు విడాకులయ్యాయా?’ కంటే ‘నీవు విడాకులు పొందావా?’ స్పష్టమైన, సహజమైన వాడుక.
