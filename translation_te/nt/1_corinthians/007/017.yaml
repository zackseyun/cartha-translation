source:
  edition: SBLGNT
  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: te
  text: అయితే, ప్రభువు ప్రతి ఒక్కరికి కేటాయించిన దానికి అనుగుణంగా, దేవుడు ప్రతి ఒక్కరిని పిలిచిన విధంగా, ప్రతి ఒక్కరూ అలాగే నడుచుకోవాలి[b]. అన్ని సంఘాలలో నేను ఇలాగే ఆదేశిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘నడుచుకోవడం’ అనేది ఒకరి జీవన విధానాన్ని సూచించే సాధారణ బైబిలు రూపకం; ‘జీవించాలి’ లేదా ‘తన జీవితాన్ని గడపాలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: అయితే
  rationale: ఇక్కడ ఇది కఠినమైన షరతుగా కాక, ముందటి చర్చనుంచి సాధారణ నియమానికి మళ్లించే వ్యతిరేకార్థక సంధిగా పనిచేస్తుంది. ‘అయితే’ ఆధునిక తెలుగులో సహజంగా ఆ సంధిని తెలియజేస్తుంది.
- source_word: ἑκάστῳ / ἕκαστον
  choice: ప్రతి ఒక్కరికి / ప్రతి ఒక్కరిని / ప్రతి ఒక్కరూ
  rationale: మూలంలోని పునరుక్తి, వ్యక్తివ్యాప్తి బలాన్ని తెలుగులోనూ సాధ్యమైనంతగా నిలుపుతుంది; విభక్తులు వాక్యంలోని ఆయా పాత్రలకు అనుగుణంగా మారాయి.
- source_word: ἐμέρισεν
  choice: పంచిపెట్టిన
  rationale: μερίζω పదంలోని పంచడం లేదా వాటా నియమించడం అనే భావాన్ని నిలుపుతుంది. సందర్భంలో ఇది ప్రతి వ్యక్తికి ప్రభువు ఇచ్చిన జీవన పరిస్థితి లేదా భాగాన్ని సూచించవచ్చు; దానిని మరీ నిర్దిష్టంగా చేయలేదు.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: పౌలు వాడిన κύριοςకు స్థిరమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: κέκληκεν
  choice: పిలిచిన
  rationale: దేవుని పిలుపును నేరుగా తెలియజేస్తుంది. గ్రీకు పరిపూర్ణ కాలంలోని కొనసాగుతున్న ఫలితాన్ని తెలుగు సందర్భం సహజంగా మోస్తుంది.
- source_word: ὁ θεός
  choice: దేవుడు
  rationale: θεόςకు ప్రామాణిక తెలుగు అనువాదం.
- source_word: οὕτως
  choice: అలాగే / ఇలాగే
  rationale: మొదటి సందర్భంలో జీవన విధానాన్ని, రెండవ సందర్భంలో అన్ని సంఘాలకు వర్తించే అదే ఆదేశాన్ని సహజ తెలుగులో సూచిస్తుంది.
- source_word: περιπατείτω
  choice: నడుచుకోవాలి
  rationale: జీవన విధానాన్ని సూచించే పౌలు రూపకాన్ని నిలుపుతూ, తెలుగులో కూడా సహజంగా నైతిక లేదా ప్రవర్తనా అర్థాన్ని అందిస్తుంది.
- source_word: διατάσσομαι
  choice: ఆదేశిస్తున్నాను
  rationale: పౌలు అధికారపూర్వకంగా ఏర్పాటు చేస్తున్న నియమాన్ని స్పష్టంగా తెలియజేస్తుంది; అనవసరంగా కఠిన స్వరాన్ని జోడించదు.
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: సంఘాలన్నిటిలోనూ
  rationale: స్థానిక క్రైస్తవ సమాజాలను సూచించే పౌలు వాడుకకు ‘సంఘాలు’ స్పష్టమైన, స్థిరమైన తెలుగు పదం.
theological_decisions:
- issue: ‘ప్రభువు’ మరియు ‘దేవుడు’ అనే సంబోధనల మధ్య భేదం
  choice: 'రెండు సంబోధనలనూ వేర్వేరుగా నిలుపడం: ‘ప్రభువు ... దేవుడు ...’'
  alternative: రెండింటినీ ఒకే దైవిక సంబోధనగా సమానీకరించడం
  rationale: గ్రీకు పాఠం సమాంతర భాగాల్లో రెండు వేర్వేరు దైవిక సంబోధనలను ఉపయోగిస్తుంది. వాటి సంబంధాన్ని అనువాదంలో ముందుగానే పరిష్కరించకుండా మూలంలోని భేదాన్ని నిలిపాం.
- issue: περιπατείτωలోని జీవన రూపకం
  choice: ‘నడుచుకోవాలి’ అని రూపకాన్ని నిలుపడం
  alternative: ‘జీవించాలి’ అని భావానువాదం చేయడం
  rationale: ‘నడుచుకోవడం’ తెలుగులో జీవన ప్రవర్తనకు అర్థమయ్యే రూపకం. ఇది మూల చిత్రాన్ని నిలుపుతూ దాని భావాన్ని సంకుచితం చేయదు.
- issue: పిలుపు మరియు వ్యక్తికి పంచబడిన పరిస్థితి మధ్య సంబంధం
  choice: సమాంతర వాక్య నిర్మాణాన్ని నిలుపుతూ సంబంధాన్ని వివరణాత్మకంగా విస్తరించకపోవడం
  alternative: ‘ఏ స్థితిలో పిలిచాడో ఆ స్థితిలోనే’ అని సందర్భార్థాన్ని స్పష్టంగా చేర్చడం
  rationale: సందర్భం జీవన పరిస్థితిని సూచించినప్పటికీ, ఈ వాక్యంలో ‘స్థితి’ అనే నామవాచకం ప్రత్యక్షంగా లేదు. అందువల్ల భావాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా గ్రీకు సమాంతరతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘ప్రతి ఒక్కరూ’ ద్వారా సాధారణ మానవ వర్తనను సహజంగా తెలియజేశాం; మూలంలోని వ్యక్తివ్యాప్తి పునరుక్తిని నిలిపాం. ‘నడుచుకోవాలి’ బైబిలు రూపకాన్ని కాపాడుతుంది; ‘నేనిలాగే ఆదేశిస్తున్నాను’ చివరి καὶ οὕτωςను అదనపు వివరణ లేకుండా ప్రతిబింబిస్తుంది.
