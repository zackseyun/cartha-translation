  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: te
  text: 'మిగిలినవారికి నేను చెబుతున్నాను—ప్రభువు కాదు, నేనే: ఏ సహోదరునికైనా విశ్వసించని భార్య ఉండి, ఆమె అతనితో కలిసి నివసించడానికి సమ్మతిస్తే, అతడు ఆమెకు విడాకులు ఇవ్వకూడదు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతడు ఆమెను విడిచిపెట్టకూడదు,” లేదా “అతడు ఆమెను పంపివేయకూడదు.” గ్రీకు క్రియను అక్షరార్థంగా “విడిచిపెట్టు” లేదా “పంపివేయు” అని అనువదించవచ్చు; ఇక్కడ అది వివాహబంధాన్ని ముగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: అయితే మిగిలినవారితో
  rationale: λοιποί ఇంతకుముందు చెప్పిన వర్గానికి చెందని మిగిలినవారిని సూచిస్తుంది; δέ ఇక్కడ సున్నితమైన మార్పు లేదా వ్యత్యాసాన్ని చూపుతుంది.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: ప్రభువు కాదు, నేనే చెబుతున్నది
  rationale: ἐγώ యొక్క ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది. ఇది ప్రభువు ప్రత్యక్షంగా చెప్పిన మాటకూ పౌలు ఇప్పుడు ఇస్తున్న సూచనకూ మధ్యనున్న భేదాన్ని పరిష్కరించకుండా వ్యక్తం చేస్తుంది.
- source_word: ἀδελφὸς
  choice: సహోదరుడు
  rationale: ఇక్కడ భార్యకు వ్యతిరేకంగా ఏకవచన పుంలింగంలో క్రీస్తును విశ్వసించే పురుషుణ్ణి ప్రత్యేకంగా సూచిస్తోంది.
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: విశ్వసించని భార్య ఉండి
  rationale: ἔχει γυναῖκα వివాహబంధాన్ని సూచించే సహజ ప్రయోగం; ἄπιστον ఇక్కడ వైవాహిక అవిశ్వాసం కాక క్రైస్తవ విశ్వాసం లేనిదాన్ని సూచిస్తుంది.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: ఆమె ... సమ్మతిస్తే
  rationale: సహజీవన ఏర్పాటుకు ఆమె ఇష్టపూర్వక అంగీకారాన్ని συνευδοκεῖ తెలియజేస్తుంది.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: అతనితో కలిసి జీవించడానికి
  rationale: ఇది ఒకే ఇంటిలో కొనసాగే దాంపత్య జీవనాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: అతడు ఆమెకు విడాకులు ఇవ్వకూడదు
  rationale: వివాహ సందర్భంలో ἀφίημι భార్యను విడిచిపెట్టడం లేదా పంపివేయడం ద్వారా వివాహబంధాన్ని ముగించడాన్ని సూచిస్తుంది; ప్రధాన పాఠంలో ‘విడాకులు’ ఆధునిక పాఠకునికి భావాన్ని స్పష్టం చేస్తుంది, కాగా పదసహజ ప్రత్యామ్నాయాలు పాదటిప్పణిలో నిలుపబడ్డాయి.
theological_decisions:
- issue: ‘ప్రభువు కాదు, నేనే’ అనే పౌలు మాట
  choice: యేసు భూలోక పరిచర్యలో ప్రత్యక్షంగా ఇచ్చిన బోధకూ పౌలు ఇప్పుడు చెప్పే సూచనకూ మధ్య భేదాన్ని పాఠ్యంలో నిలుపడం
  alternative: ఇది అధికారంలేని పౌలు వ్యక్తిగత అభిప్రాయం అని అర్థం చేసుకోవడం
  rationale: మూలపాఠం ‘నేను’ మరియు ‘ప్రభువు’ మధ్య ఉన్న ఉద్రిక్తతను స్పష్టంగా ఉంచుతుంది. అనువాదం దాని ప్రేరణ లేదా అధికారంపై అదనపు వ్యాఖ్యను ప్రధాన పాఠంలో చేర్చకుండా ఆ భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సహోదరుడు’ లింగసూచనను కాపాడుతుంది; ‘విశ్వసించని’ అనే పదం ἄπιστος‌ను వైవాహిక నమ్మకద్రోహంగా అపార్థం కాకుండా సందర్భానుసారంగా తెలియజేస్తుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో ఉంది.
