revisions:
- from: 'అయితే మిగిలినవారితో ప్రభువు కాదు, నేనే చెబుతున్నది ఏమిటంటే: ఏ సహోదరునికైనా విశ్వసించని భార్య ఉండి, ఆమె అతనితో కలిసి జీవించడానికి సమ్మతిస్తే, అతడు ఆమెకు విడాకులు ఇవ్వకూడదు.[a]'
  to: 'మిగిలినవారికి నేను చెబుతున్నాను—ప్రభువు కాదు, నేనే: ఏ సహోదరునికైనా విశ్వసించని భార్య ఉండి, ఆమె అతనితో కలిసి నివసించడానికి సమ్మతిస్తే, అతడు ఆమెకు విడాకులు ఇవ్వకూడదు[a].'
  rationale: The revision improves the Telugu syntax and preserves the emphatic parenthetical distinction between Paul’s statement and a saying of the Lord, without implying that Paul’s instruction lacks authority. It also uses a more precise domestic verb for οἰκεῖν. The footnote remains anchored to the divorce expression and continues to supply the literal lexical alternatives.
