review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the addressees, the emphatic contrast ‘I, not the Lord,’ the male believer with an unbelieving wife, her willing consent to cohabit, and the prohibition against ending the marriage. ‘విడాకులు ఇవ్వకూడదు’ appropriately conveys the marital force of ἀφιέτω, while the note preserves the more literal alternatives.
  naturalness: The opening clause is understandable but its current order, ‘ప్రభువు కాదు, నేనే చెబుతున్నది,’ is somewhat awkward and can momentarily sound as though the Lord is being denied rather than contrasted as speaker. Recasting it with dashes makes the parenthetical contrast natural and clear in modern standard Telugu.
  terminology: ‘సహోదరుడు’ correctly preserves the masculine singular reference. ‘విశ్వసించని భార్య’ adequately conveys ἄπιστος in this context without importing marital unfaithfulness. ‘కలిసి నివసించడానికి’ is a more direct, idiomatic rendering of οἰκεῖν μετ’ αὐτοῦ than the broader ‘కలిసి జీవించడానికి.’
  issues:
  - severity: medium
    issue: Opening speaker contrast is awkwardly ordered.
    rationale: The Greek means ‘I say—I, not the Lord.’ The draft’s ‘ప్రభువు కాదు, నేనే చెబుతున్నది’ is not the most natural Telugu phrasing and may obscure the intended parenthetical contrast. ‘నేను చెబుతున్నాను—ప్రభువు కాదు, నేనే’ retains the emphatic ἐγώ and the source ambiguity without a doctrinal gloss.
  - severity: low
    issue: ‘కలిసి జీవించడానికి’ is slightly broader than the domestic sense of οἰκεῖν.
    rationale: ‘కలిసి నివసించడానికి’ more specifically expresses living together/maintaining a shared household while remaining natural Telugu.
  revised_text: 'మిగిలినవారికి నేను చెబుతున్నాను—ప్రభువు కాదు, నేనే: ఏ సహోదరునికైనా విశ్వసించని భార్య ఉండి, ఆమె అతనితో కలిసి నివసించడానికి సమ్మతిస్తే, అతడు ఆమెకు విడాకులు ఇవ్వకూడదు[a].'
