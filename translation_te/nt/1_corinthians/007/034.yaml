  rationale: The revision keeps the draft's sound treatment of the disputed phrase and all major theological vocabulary. It adjusts only the opening clause to reflect the singular, contextually masculine continuation from the previous verse without supplying plural ‘interests,’ and replaces the stronger connective ‘అలాగే’ with a neutral sequence.
