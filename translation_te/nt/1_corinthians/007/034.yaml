revisions:
- from: అతని ఆసక్తులు విభజించబడి ఉంటాయి. అలాగే పెళ్లికాని స్త్రీ, అంటే కన్య[a], శరీరంలోనూ ఆత్మలోనూ పవిత్రురాలిగా ఉండటానికి ప్రభువు విషయాల గురించి శ్రద్ధ వహిస్తుంది. అయితే పెళ్లైన స్త్రీ తన భర్తను ఎలా సంతోషపెట్టాలా అని లోక విషయాల గురించి శ్రద్ధ వహిస్తుంది.
