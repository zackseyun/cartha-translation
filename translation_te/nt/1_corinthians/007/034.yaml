id: 1CO.7.34
reference: 1 Corinthians 7:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: te
  text: అతని మనస్సు విభజించబడి ఉంది. పెళ్లికాని స్త్రీ, అంటే కన్య[a], శరీరంలోనూ ఆత్మలోనూ పవిత్రురాలిగా ఉండటానికి ప్రభువు విషయాల గురించి శ్రద్ధ వహిస్తుంది. అయితే పెళ్లైన స్త్రీ తన భర్తను ఎలా సంతోషపెట్టాలా అని లోక విషయాల గురించి శ్రద్ధ వహిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పెళ్లికాని స్త్రీ, కన్య—వీరిద్దరూ ప్రభువు విషయాల గురించి శ్రద్ధ వహిస్తారు.” గ్రీకు వాక్యాన్ని, ‘పెళ్లికాని స్త్రీ’కి ‘కన్య’ వివరణగా కాకుండా రెండు వర్గాల జాబితాగా కూడా చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: అతని ఆసక్తులు విభజించబడి ఉంటాయి
  rationale: గ్రీకు పరిపూర్ణ కర్మణి రూపంలోని ఫలితస్థితిని, మునుపటి వాక్యంతో ఉన్న అనుసంధానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. గ్రీకులో స్పష్టంగా లేని కర్తను సందర్భానుసారం పూర్వ వాక్యంలోని పెళ్లైన పురుషునిగా సూచిస్తుంది; ‘ఆసక్తులు’ అనేది విభజన రూపకాన్ని తెలుగులో అర్థవంతం చేస్తుంది.
- source_word: γυνὴ ἡ ἄγαμος
  choice: పెళ్లికాని స్త్రీ
  rationale: వివాహిత స్త్రీతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా, ఆధునిక ప్రామాణిక తెలుగులో తెలియజేస్తుంది.
- source_word: παρθένος
  choice: కన్య
  rationale: పార్తెనోస్‌లోని కన్యత్వానికి సంబంధించిన నిర్దిష్ట భావాన్ని నిలుపుతుంది.
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: పెళ్లికాని స్త్రీ, అంటే కన్య
  rationale: ఏకవచన క్రియకు అనుగుణంగా రెండవ పదాన్ని వివరణాత్మక సమానాధికార పదంగా తీసుకుంటుంది; సమన్వయ పఠనాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: μεριμνᾷ
  choice: శ్రద్ధ వహిస్తుంది
  rationale: ఇక్కడ తప్పనిసరిగా పాపభరితమైన ఆందోళన కాకుండా, దృష్టి పెట్టిన శ్రద్ధ లేదా ఆసక్తిని సూచిస్తుంది.
- source_word: τὰ τοῦ κυρίου
  choice: ప్రభువు విషయాలు
  rationale: ‘ప్రభువుకు సంబంధించినవి’ అనే విస్తృత భావాన్ని, లోక విషయాలతో ఉన్న సమాంతర వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἵνα ᾖ ἁγία
  choice: పవిత్రురాలిగా ఉండటానికి
  rationale: ἵνα ఉపవాక్యంలోని ఉద్దేశ్య భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ పవిత్రత అనే స్పష్టమైన భాషను నిలుపుతుంది.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: శరీరంలోనూ ఆత్మలోనూ
  rationale: రెండు అంశాల్లో పవిత్రతను సూచించే దత్తివ విభక్తి భావాన్ని, καὶ ... καὶ సమన్వయాన్ని సహజంగా అందిస్తుంది.
- source_word: ἡ δὲ γαμήσασα
  choice: అయితే పెళ్లైన స్త్రీ
  rationale: వివాహ స్థితిలో ఉన్న స్త్రీని సులభంగా అర్థమయ్యే ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὰ τοῦ κόσμου
  choice: లోక విషయాలు
  rationale: ప్రభువు విషయాలతో ఉన్న నిర్మాణాత్మక వ్యత్యాసాన్ని నిలుపుతూ, అనవసరంగా నైతిక ప్రతికూల భావాన్ని జోడించదు.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: తన భర్తను ఎలా సంతోషపెట్టాలా అని
  rationale: వివాహ సందర్భంలో ἀνήρ‌ను ‘భర్త’గా స్పష్టం చేసి, ఆలోచనతో కూడిన శ్రద్ధ భావాన్ని సహజమైన తెలుగు పరోక్ష ప్రశ్నగా అందిస్తుంది.
theological_decisions:
- issue: పెళ్లికాని స్త్రీ మరియు కన్య రెండు వేర్వేరు వర్గాలా, లేక రెండవది మొదటిదానికి వివరణా?
  choice: 'వివరణాత్మకంగా: ‘పెళ్లికాని స్త్రీ, అంటే కన్య’'
  alternative: 'సమన్వయంగా: ‘పెళ్లికాని స్త్రీ, కన్య—వీరిద్దరూ’'
  rationale: గ్రీకు వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి రెండు విధాలుగా చదవవచ్చు. ఏకవచన μεριμνᾷ వివరణాత్మక పఠనానికి మద్దతిస్తుంది; అయినా సమన్వయ పఠనం సాధ్యమే కాబట్టి దానిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ‘పెళ్లికాని/పెళ్లైన’ వాడబడింది. శైలి గౌరవప్రదంగా, వాక్య నిర్మాణం సహజంగా ఉంచబడింది. మొదటి చిన్న వాక్యాన్ని పూర్వ వచనంతో అనుసంధానించేందుకు సందర్భంలోని కర్తను స్పష్టం చేశాం.
