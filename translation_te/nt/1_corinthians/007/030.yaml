id: 1CO.7.30
reference: 1 Corinthians 7:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: te
  text: ఏడ్చేవారు ఏడవనివారిలా[a], సంతోషించేవారు సంతోషించనివారిలా, కొనేవారు సొంతంగా కలిగి ఉండనివారిలా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏడవనట్టుగా … సంతోషించనట్టుగా … సొంతంగా కలిగి ఉండనట్టుగా.’ గ్రీకులో మళ్లీ మళ్లీ వచ్చే ‘...కానివారిలా’ అనే నిర్మాణం ఈ అనుభవాలు అసలు జరగవని చెప్పడం కాదు; వాటి మధ్య ఎలా జీవించాలో సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: ఏడ్చేవారు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వర్తమాన కృదంతం ‘ఏడ్చేవారు’ అనే నామవాచక భావాన్ని ఇస్తుంది. ఇది భావోద్వేగ క్రియను వ్యాఖ్యానం చేయకుండా నేరుగా తెలియజేస్తుంది.
- source_word: ὡς μὴ κλαίοντες
  choice: ఏడవనివారిలా
  rationale: ὡς μή + కృదంతం వాస్తవంగా ఏడవడం లేదని నిరాకరించకుండా, ఏ విధమైన వైఖరితో జీవించాలో సూచిస్తుంది. సంక్షిప్తమైన గ్రీకు సమాంతర నిర్మాణాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: χαίροντες
  choice: సంతోషించేవారు
  rationale: χαίρω ఇక్కడ ఆనందించడాన్ని సూచిస్తుంది. ‘సంతోషించేవారు’ ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండి, ‘ఏడ్చేవారు’తో క్రియాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: ὡς μὴ χαίροντες
  choice: సంతోషించనివారిలా
  rationale: ముందటి ὡς μή నిర్మాణంతో ఉన్న పునరుక్త సమాంతరతను కాపాడుతూ, సంతోషాన్ని పూర్తిగా నిషేధిస్తున్న భావం రాకుండా వైఖరిని సూచిస్తుంది.
- source_word: ἀγοράζοντες
  choice: కొనేవారు
  rationale: సాధారణ వస్తు కొనుగోలును సూచించే నేరమైన, సహజమైన ఆధునిక తెలుగు పదం.
- source_word: κατέχοντες
  choice: సొంతంగా కలిగివుండనివారు
  rationale: κατέχω కు పట్టుకొను, ఉంచుకొను, స్వాధీనంగా కలిగివుండు అనే అర్థాలు ఉన్నాయి. కొనుగోలుతో ఉన్న వ్యత్యాసంలో, కొన్నదాన్ని దృఢమైన సొత్తుగా భావించే స్వాధీనతను ఈ పదబంధం తెలియజేస్తుంది.
- source_word: καὶ
  choice: సమాంతర వరుస (తెలుగులో విరామచిహ్నాలతో అనుసంధానం)
  rationale: గ్రీకులో పునరావృతమైన καὶ మూడు వర్గాలను లయబద్ధంగా కలుపుతుంది. తెలుగులో ప్రతి ఖండానికి ‘మరియు’ చేర్చడం అసహజంగా ఉండేందున, కామాలతో కూడిన సమాంతర నిర్మాణం అదే సంచిత ప్రభావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: పునరావృతమైన ὡς μή (‘...నివారిలా’) నిర్మాణాల భావం
  choice: ఏడుపు, సంతోషం, కొనుగోలు నిజంగా జరుగుతున్నప్పటికీ, వాటిచేత పూర్తిగా బంధింపబడనట్టు జీవించే వైఖరిని వ్యక్తపరచడం
  alternative: ఈ క్రియలన్నీ స్వతహాగా అనుచితమైనవని చెప్పే కఠిన త్యాగవాద పఠనం; లేదా సమీప అంత్యకాల సందర్భాన్ని పక్కనపెట్టే కేవలం మానసిక పఠనం
  rationale: 1 కొరింథీయులు 7:26,31లోని ‘ప్రస్తుత కష్టం’ మరియు లోకపు రూపం గతించిపోతున్నదనే సందర్భంలో, ὡς μή + కృదంతం సంపూర్ణ నిరాకరణకన్నా జీవన విధానాన్ని లేదా వైఖరిని సూచిస్తుంది. అనువాదం ఈ ఉద్రిక్తతను వ్యాఖ్యానంతో పూర్తిగా పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని సంక్షిప్త మూడు భాగాల సమాంతరతను నిలుపుతూ, సందర్భం నుంచి గ్రహించాల్సిన ‘ఉండాలి’ని చివర చేర్చి తెలుగులో వాక్యాన్ని సంపూర్ణంగా చేశాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
