  text: Περὶ δὲ ὧν ⸀ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: te
  text: 'మీరు రాసిన విషయాల గురించి: పురుషుడు స్త్రీని తాకకుండా ఉండడం మంచిది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “తాకడం” అనేది లైంగిక సంబంధాన్ని సూచించే సౌమ్యోక్తి కావచ్చు. “స్త్రీ” అనే గ్రీకు పదానికి సందర్భానుసారం “భార్య” అనే అర్థం కూడా రావచ్చు.
    reason: మూలంలోని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, దాని సాధ్యమైన లైంగిక భావాన్ని మరియు γυνή పదంలోని నిజమైన అర్థసందిగ్ధతను తెలియజేస్తుంది.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: మీరు రాసిన విషయాల విషయానికొస్తే
  rationale: περὶ δέ అనే విషయమార్పు నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తూ, మూలంలో ప్రత్యేకమైన ‘ఇప్పుడు’ అనే కాలసూచక పదం లేనందున దానిని చేర్చలేదు.
- source_word: καλὸν
  choice: మంచిది
  rationale: నైతికంగా లేదా ఆచరణాత్మకంగా శ్రేయస్కరమైనదనే విస్తృత భావాన్ని, అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: ἀνθρώπῳ
  choice: పురుషుడు
  rationale: తదనంతర γυναικός‌తో ఉన్న లింగ వ్యత్యాసం మరియు సందర్భం ఇక్కడ ‘పురుషుడు’ అనే అర్థాన్ని సమర్థిస్తాయి.
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: స్త్రీని తాకకుండా ఉండడం
  rationale: మూలంలోని ‘తాకడం’ అనే రూపకప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని లైంగిక భావసూచనను పాదసూచికలో వివరిస్తుంది; γυνήకి సందర్భానుసారం ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థం రావచ్చనే విస్తృతిని అనవసరంగా కుదించదు.
theological_decisions:
- issue: ‘పురుషుడు స్త్రీని తాకకుండా ఉండడం మంచిది’ అన్నది పౌలు స్వయంగా చెప్పిన మాటా, కొరింథీయులు రాసిన నినాదాన్ని ఆయన ఉదహరించాడా?
  choice: ఉద్ధరణ చిహ్నాలు లేకుండా వాక్యాన్ని అందించడం
  alternative: దీనిని కొరింథీయుల మాటగా ఉద్ధరణ చిహ్నాల్లో పెట్టడం
  rationale: గ్రీకు ప్రతిలో ఉద్ధరణ చిహ్నాలు లేవు; ఇది కొరింథీయుల వాదనకు ప్రతిధ్వని కావచ్చని కొందరు భావించినా, వాక్యనిర్మాణం మాత్రమే ఆ నిర్ణయాన్ని నిర్బంధించదు. కాబట్టి అనిశ్చితిని వ్యాఖ్యానాత్మక విరామచిహ్నాలతో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వాక్యం సంక్షిప్తంగా ఉంచబడింది; మూలంలోని రూపకం మరియు వ్యాఖ్యానాత్మక అనిశ్చితి రెండూ సంరక్షించబడ్డాయి.
