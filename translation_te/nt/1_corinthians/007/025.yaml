source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: te
  text: కన్యల విషయానికి వస్తే,[a] ప్రభువు నుండి నాకు ఎలాంటి ఆజ్ఞా లేదు. అయితే, ప్రభువు కనికరం పొంది నమ్మదగినవాడిగా ఉన్న నేను నా అభిప్రాయాన్ని[b] ఇస్తున్నాను.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పెళ్లికాని స్త్రీలు”; సందర్భాన్ని కొందరు అర్థం చేసుకునే విధానంలో, “కన్యలైన కుమార్తెలు.” గ్రీకు మూలంలో “కన్యలు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా ఆలోచనను,” “నా సలహాను.” ఇక్కడ పౌలు తాను ఆలోచించి చెప్పే అభిప్రాయాన్ని ప్రభువు ఇచ్చిన ప్రత్యక్ష ఆజ్ఞతో వేరుచేస్తున్నాడు.
    reason: alternative_reading
  - marker: c
    text: లేదా “నమ్మకమైనవాడిగా.” గ్రీకు పదానికి “నమ్మకమైనవాడు” లేదా “నమ్మదగినవాడు” అనే అర్థాలు రావచ్చు. ఇక్కడ ప్రభువు కనికరం వల్ల పౌలు నమ్మదగిన మార్గదర్శిగా ఉన్నాడనే భావం సందర్భానికి తగినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: విషయానికి వస్తే
  rationale: కొత్త అంశాన్ని పరిచయం చేసే పౌలు వాడే సంభాషణా మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలో లేని కాలార్థకమైన “ఇప్పుడు”ను చేర్చదు.
- source_word: τῶν παρθένων
  choice: కన్యల
  rationale: παρθένος యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతుంది. సందర్భంలో ఖచ్చితమైన సూచిత వర్గం వివాదాస్పదం కాబట్టి “పెళ్లికాని స్త్రీలు” లేదా “కన్యలైన కుమార్తెలు” అనే సన్నని వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో పెట్టలేదు.
- source_word: ἐπιταγὴν κυρίου
  choice: ప్రభువు నుండి ... ఆజ్ఞ
  rationale: ἐπιταγήలోని ఆదేశం లేదా అధికారపూర్వక ఆజ్ఞ అనే భావాన్నీ, κυρίουలోని మూలాధార భావాన్నీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: γνώμην
  choice: నా అభిప్రాయాన్ని
  rationale: ఆలోచించి ఏర్పరచుకున్న నిర్ణయం లేదా సలహా అనే భావాన్ని ఇస్తుంది; దాన్ని ప్రభువు ప్రత్యక్ష ఆజ్ఞతో సమానం చేయదు.
- source_word: δίδωμι
  choice: చెబుతున్నాను
  rationale: తెలుగులో “అభిప్రాయాన్ని చెబుతున్నాను” సహజమైన ప్రయోగం; గ్రీకులోని వర్తమాన క్రియార్థాన్ని నిలుపుతుంది.
- source_word: ὡς
  choice: '... పొందినవాడిగా'
  rationale: పౌలు ఏ స్థితిలో లేదా హోదాలో తన అభిప్రాయం చెబుతున్నాడో తెలిపే పోలిక/స్థితి భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἠλεημένος ὑπὸ κυρίου
  choice: ప్రభువు కనికరం పొందినవాడిగా
  rationale: పూర్త భూతకాల కర్మణి కృదంతంలోని ‘కనికరం చూపబడినవాడు’ అనే భావాన్నీ, ఆ కనికరానికి ప్రభువే కర్త అనే విషయాన్నీ నిలుపుతుంది.
- source_word: πιστὸς εἶναι
  choice: నమ్మదగినవాడిగా ఉండేందుకు
  rationale: πιστόςలోని ‘నమ్మకమైన/నమ్మదగిన’ ద్వంద్వార్థాన్ని గమనిస్తూ, ఈ సందర్భంలో పౌలు ఇచ్చే తీర్పు విశ్వసనీయతపై ఉన్న దృష్టిని ప్రధాన పాఠ్యంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రభువు ప్రత్యక్ష ఆజ్ఞకూ పౌలు ఇచ్చే అపొస్తలిక అభిప్రాయానికీ ఉన్న సంబంధం
  choice: ఈ విషయంలో ప్రభువు నుండి ప్రత్యక్ష ఆజ్ఞ తనకు లేదని పౌలు చెబుతూనే, ప్రభువు కనికరం పొందిన నమ్మదగినవాడిగా తన ఆలోచించి ఏర్పరచుకున్న అభిప్రాయాన్ని ఇస్తున్నాడు.
  alternative: ఇది ఎలాంటి అధికారమూ లేని పౌలు వ్యక్తిగత అభిప్రాయం మాత్రమే; లేదా పౌలు యేసు చెప్పిన, మరెక్కడా నమోదు కాని ఆజ్ఞను పరోక్షంగా ఉదహరిస్తున్నాడు.
  rationale: ἐπιταγή మరియు γνώμη మధ్య ఉన్న వ్యత్యాసం ప్రత్యక్ష ప్రభు ఆజ్ఞ లేకపోవడాన్ని చూపుతుంది; అదే సమయంలో ἠλεημένος ... πιστός అనే మాటలు పౌలు మాట విశ్వసనీయతను నిలుపుతాయి. అనువాదం ఈ ఉద్వేగాన్ని తగ్గించకుండా ఉంచుతుంది.
- issue: πιστός యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో “నమ్మదగినవాడు”
  alternative: “నమ్మకమైనవాడు”
  rationale: రెండు అర్థాలూ గ్రీకు పదానికి సాధ్యమే. ఈ సందర్భంలో తన అభిప్రాయాన్ని చెప్పే పౌలు విశ్వసనీయత ప్రధానంగా కనిపిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా నిజమైన సందిగ్ధతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గౌరవప్రదంగా రూపొందించబడింది. “కనికరం,” “ఆజ్ఞ,” “అభిప్రాయం” వంటి విస్తృతంగా అర్థమయ్యే పదాలు వాడబడ్డాయి. మూలంలోని భావసందిగ్ధతలను పాదసూచికల్లో నిలుపుతూ, ఏ మతశాఖకు ప్రత్యేకమైన వ్యాఖ్యానాన్నీ ప్రధాన పాఠ్యంలో చేర్చలేదు.
