review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that marriage is not sin, retains ‘కన్య’ for παρθένος, and understands τῇ σαρκί non-ethically. However, ‘పెళ్లి చేసుకున్నా’ is naturally concessive or retrospective in Telugu (‘even though/if [one] has married’) rather than the straightforward future-oriented condition of ἐὰν ... γαμήσῃς. ‘ఈ’ in ‘ఈ శరీర జీవితంలో’ adds a deictic element absent from the Greek, and ‘ఆ కష్టాల నుంచి’ makes explicit a relationship that the text leaves more compressed. The revised wording preserves the Greek’s directness and ambiguity more closely.
  naturalness: ‘పెళ్లి చేసుకుంటే’ is idiomatic modern standard Telugu for both conditional clauses. ‘శరీరంలో కష్టాలు’ is natural enough in this formal biblical register; the footnote explains that this does not mean ‘sinful nature.’ ‘నేను మిమ్మల్ని కాపాడాలనుకుంటున్నాను’ communicates Paul’s beneficent pastoral purpose naturally without specifying unexpressed details.
  terminology: ‘కన్య’ appropriately preserves παρθένος rather than generalizing it to an unmarried woman. ‘కష్టాలు’ is a suitable modern rendering of θλῖψις in this context. ‘శరీరంలో’ retains the lexical image of σάρξ without importing the theological expression ‘పాప స్వభావం.’
  issues:
  - severity: medium
    issue: The conditional verbs are rendered as ‘పెళ్లి చేసుకున్నా.’
    rationale: This form can suggest a completed marriage or concessive sense. The Greek ἐὰν with aorist subjunctive expresses a prospective condition, better represented by ‘పెళ్లి చేసుకుంటే.’
  - severity: low
    issue: ‘ఈ శరీర జీవితంలో’ and ‘ఆ కష్టాల నుంచి’ add interpretive specification.
    rationale: The Greek says literally that such people will have trouble ‘in the flesh’ and then ‘I spare you.’ The additions are plausible but unnecessarily narrow the concise source expression.
  revised_text: అయితే నువ్వు పెళ్లి చేసుకుంటే, పాపం చేయలేదు. కన్య పెళ్లి చేసుకుంటే, ఆమె పాపం చేయలేదు. కానీ అలాంటివారికి శరీరంలో కష్టాలు కలుగుతాయి[a]. నేను మాత్రం మిమ్మల్ని కాపాడాలనుకుంటున్నాను[b].
