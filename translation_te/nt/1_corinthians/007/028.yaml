id: 1CO.7.28
reference: 1 Corinthians 7:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: te
  text: అయితే నువ్వు పెళ్లి చేసుకుంటే, పాపం చేయలేదు. కన్య పెళ్లి చేసుకుంటే, ఆమె పాపం చేయలేదు. కానీ అలాంటివారికి శరీరంలో కష్టాలు కలుగుతాయి[a]. నేను మాత్రం మిమ్మల్ని కాపాడాలనుకుంటున్నాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘శరీరంలో కష్టాలు.’ ఇది ప్రత్యేకంగా ‘పాప స్వభావం’ను సూచించదు; వివాహంతో సంబంధమున్న భౌతిక లేదా ఈ లోక జీవితపు ఇబ్బందులను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నేను మిమ్మల్ని విడిచిపెడుతున్నాను/మినహాయిస్తున్నాను’ లేదా ‘నేను మిమ్మల్ని కాపాడుతున్నాను.’ ఇలాంటి కష్టాల గురించి హెచ్చరించడంలో పౌలు తన శ్రేయోభిలాషమైన ఉద్దేశాన్ని తెలియజేస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: నువ్వు పెళ్లి చేసుకున్నా
  rationale: ἐάνతో కూడిన aorist subjunctive భవిష్యత్ సంభావ్యతగల షరతును సూచిస్తుంది. ఆధునిక తెలుగులో ‘పెళ్లి చేసుకున్నా’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἥμαρτες
  choice: పాపం చేయలేదు
  rationale: వివాహం చేసుకోవడమే పాపకార్యం కాదని aorist indicative స్పష్టంగా నిరాకరిస్తుంది. తెలుగులో సరళ భూతకాల రూపం సహజంగా ఈ నైతిక నిర్ధారణను వ్యక్తం చేస్తుంది.
- source_word: ἡ παρθένος
  choice: కన్య
  rationale: παρθένος యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతూ, దానిని సాధారణంగా ‘పెళ్లికాని స్త్రీ’ అని విస్తరించలేదు. సందర్భంలో ప్రస్తావించబడుతున్న వివాహయోగ్యమైన కన్యను సూచిస్తుంది.
- source_word: γήμῃ
  choice: పెళ్లి చేసుకున్నా
  rationale: మొదటి షరతుతో సమాంతరతను కాపాడుతూ, మూడవ పురుష ఏకవచన షరతును సహజ తెలుగులో అందిస్తుంది.
- source_word: θλῖψιν
  choice: కష్టాలు
  rationale: θλῖψις ఒత్తిడి, బాధ, ఇబ్బంది అనే అర్థాలను కలిగి ఉంది. ఇక్కడ వివాహితులు ఎదుర్కొనే ప్రాపంచిక లేదా శారీరక జీవితపు ఇబ్బందులను సూచించడానికి ‘కష్టాలు’ స్పష్టమైన ఆధునిక పదం.
- source_word: τῇ σαρκὶ
  choice: ఈ శరీర జీవితంలో
  rationale: σάρξను ఇక్కడ ‘పాప స్వభావం’గా కాక, భౌతికమైన మానవ జీవితం లేదా శరీర సంబంధ పరిస్థితుల పరిధిగా గ్రహించాం. ‘ఈ శరీర జీవితంలో’ అనే రూపం భావాన్ని సహజంగా తెలుపుతుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఇస్తున్నాం.
- source_word: οἱ τοιοῦτοι
  choice: అలాంటివారు
  rationale: ఇప్పుడే ప్రస్తావించిన పెళ్లి చేసుకునే వ్యక్తులవంటి వారిని సాధారణంగా సూచించే సహజ తెలుగు రూపం.
- source_word: φείδομαι
  choice: మిమ్మల్ని ఆ కష్టాల నుంచి తప్పించాలని చూస్తున్నాను
  rationale: φείδομαι ఎవరినైనా బాధ లేదా భారంనుంచి కాపాడడం, మినహాయించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో పౌలు హెచ్చరిక వెనుకనున్న కాపరి ఉద్దేశాన్ని ఈ రూపం సహజంగా వ్యక్తం చేస్తుంది; మరింత ప్రత్యక్ష ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: τῇ σαρκὶలో σάρξ అర్థం
  choice: భౌతికమైన లేదా శరీర సంబంధమైన ఈ జీవితపు పరిస్థితులు
  alternative: పాప స్వభావం; లేదా విస్తృతమైన ప్రాపంచిక అస్తిత్వం
  rationale: ఇక్కడ పౌలు మానవ పాప స్వభావం గురించి సిద్ధాంతపరమైన ప్రకటన చేయడం లేదు; వివాహంతో పాటు వచ్చే జీవిత కష్టాల గురించి హెచ్చరిస్తున్నాడు. అందువల్ల ‘ఈ శరీర జీవితంలో’ అని అనువదించి, అసలు పదబంధపు అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- issue: φείδομαιలో ప్రకటన మరియు ఉద్దేశం మధ్య భావభేదం
  choice: మిమ్మల్ని ఆ కష్టాల నుంచి తప్పించాలని చూస్తున్నాను
  alternative: నేను మిమ్మల్ని తప్పిస్తున్నాను; నేను మిమ్మల్ని తప్పించాలనుకుంటున్నాను
  rationale: గ్రీకు వర్తమాన రూపం ‘నేను కాపాడుతున్నాను/మినహాయిస్తున్నాను’ అని ప్రత్యక్షంగా చెప్పవచ్చు; సందర్భం మాత్రం పౌలు ఇచ్చే హెచ్చరికలోని కాపరి ఉద్దేశాన్ని కూడా సూచిస్తుంది. ప్రధాన పాఠం సహజ తెలుగులో ఆ ఉద్దేశాన్ని వ్యక్తం చేస్తుండగా, పాదసూచిక ప్రత్యామ్నాయాలను భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ఏకవచన రెండవ పురుషానికి సందర్భానుగుణంగా ‘నువ్వు,’ సమూహానికి ‘మిమ్మల్ని’ ఉంచి గ్రీకు సంఖ్యాభేదాన్ని కాపాడాం. ‘కన్య’ అనే పదం మూలంలోని లైంగిక/వివాహ స్థితి సూచనను నిలుపుతుంది. ‘శరీర జీవితం’ ద్వారా σάρξ యొక్క ఇక్కడి భౌతిక భావాన్ని స్పష్టం చేస్తూనే పాదసూచికలో అక్షరార్థాన్ని భద్రపరిచాం.
