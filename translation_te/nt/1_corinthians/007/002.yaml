id: 1CO.7.2
reference: 1 Corinthians 7:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: te
  text: అయితే లైంగిక అనైతికతల కారణంగా[a], ప్రతి పురుషుడు తన సొంత భార్యను కలిగి ఉండాలి; అలాగే ప్రతి స్త్రీ తన సొంత భర్తను కలిగి ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘లైంగిక అనైతికత’ (ఏకవచనం). గ్రీకు మూలంలో ‘లైంగిక అనైతికతలు’ అనే బహువచన రూపం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: అయితే ... కారణంగా
  rationale: διά + accusative కారణాన్ని సూచిస్తుంది; δέ మృదువైన వ్యత్యాసాన్ని లేదా విషయవికాసాన్ని సూచిస్తుంది. ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τὰς πορνείας
  choice: లైంగిక అనైతిక క్రియల
  rationale: πορνεία లైంగికంగా అనైతికమైన ప్రవర్తనను సూచిస్తుంది. మూలంలో బహువచనం ఉన్నందున ‘క్రియల’ అని అనువదించి ఆ సంఖ్యాభేదాన్ని నిలిపాం.
- source_word: ἕκαστος
  choice: ప్రతి పురుషుడు
  rationale: ἑκάστηతో ఉన్న సమాంతర నిర్మాణం, అలాగే భార్య/భర్త పదజంట, ఇక్కడ పురుష సూచనను స్పష్టం చేస్తాయి.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: తన సొంత భార్యను
  rationale: వివాహ సందర్భంలో γυνή అంటే ‘భార్య’; ἑαυτοῦలోని స్వకీయ భావాన్ని ‘తన సొంత’ తెలియజేస్తుంది.
- source_word: ἐχέτω
  choice: కలిగి ఉండాలి
  rationale: మూడవ పురుష ఏకవచన వర్తమాన ఆజ్ఞార్థక రూపంలోని ఆదేశ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘పెళ్లి చేసుకోవాలి’ లేదా దాంపత్య సంబంధాలను నేరుగా సూచించే భావాన్ని అదనంగా చేర్చదు.
- source_word: καὶ ἑκάστη
  choice: అలాగే ప్రతి స్త్రీ
  rationale: మొదటి వాక్యభాగానికి సమాంతరంగా స్త్రీని ఒక్కొక్కరిగా సూచించే పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: τὸν ἴδιον ἄνδρα
  choice: తన సొంత భర్తను
  rationale: ఈ వివాహ సందర్భంలో ἀνήρ అంటే ‘భర్త’; ἴδιονలోని స్వకీయ ఉద్ఘాటనను ‘తన సొంత’ నిలుపుతుంది.
theological_decisions:
- issue: ఈ వాక్యాన్ని లైంగిక పాపాన్ని నివారించేందుకు వివాహానికి ఇచ్చిన అనుమతిగా అనువదించాలా, లేక వివాహ సంబంధాల గురించిన ఆదేశంగా అనువదించాలా
  choice: లైంగిక అనైతిక క్రియల కారణంగా ప్రతి పురుషుడు తన భార్యను, ప్రతి స్త్రీ తన భర్తను ‘కలిగి ఉండాలి’ అనే ఆదేశంగా మూలపదాలను నేరుగా నిలపడం.
  alternative: ‘పెళ్లి చేసుకోవాలి’ లేదా ‘దాంపత్య బాధ్యతలను నెరవేర్చాలి’ అని మరింత వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: గ్రీకులో ἐχέτω (‘కలిగి ఉండాలి’) ఉంది; వివాహం చేసుకోవడం లేదా దాంపత్య సంబంధాలను నెరవేర్చడం అనే నిర్దిష్ట క్రియ లేదు. అందువల్ల విస్తృత సిద్ధాంతపరమైన నిర్ణయాన్ని అనువాదంలో చేర్చకుండా అసలు వాక్యంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘కలిగి ఉండాలి’ అనే రూపం మూలంలోని ఆజ్ఞార్థక భావాన్ని నిలుపుతూ, వివాహం చేసుకోవడం లేదా దాంపత్య కలయిక అనే వ్యాఖ్యానాన్ని అనవసరంగా చేర్చదు.
