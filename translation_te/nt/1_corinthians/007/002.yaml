- from: అయితే లైంగిక అనైతిక క్రియల కారణంగా[a], ప్రతి పురుషుడు తన సొంత భార్యను కలిగి ఉండాలి; అలాగే ప్రతి స్త్రీ తన సొంత భర్తను కలిగి ఉండాలి.
  to: అయితే లైంగిక అనైతికతల కారణంగా[a], ప్రతి పురుషుడు తన సొంత భార్యను కలిగి ఉండాలి; అలాగే ప్రతి స్త్రీ తన సొంత భర్తను కలిగి ఉండాలి.
