review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the causal force of διὰ, the mild contrast/development of δέ, the distributive masculine and feminine subjects, the reflexive/possessive emphasis in ἑαυτοῦ and ἴδιον, and the two present imperatives. The plural of πορνείας should be retained, but the current expanded expression ‘లైంగిక అనైతిక క్రియలు’ is less direct than the Greek noun and sounds cumbersome.
  naturalness: ‘లైంగిక అనైతిక క్రియల’ is awkward in modern standard Telugu, since ‘క్రియలు’ unnecessarily turns the abstract plural noun into an explicit set of acts. ‘లైంగిక అనైతికతల’ preserves the Greek plural while reading more naturally. The remainder is clear and appropriately formal.
  terminology: ‘భార్య’ and ‘భర్త’ correctly render γυνή and ἀνήρ in this marital context. ‘తన సొంత’ appropriately conveys the emphatic possessive forms without adding interpretation. ‘కలిగి ఉండాలి’ remains a suitably direct rendering of ἐχέτω and does not substitute ‘marry’ or a reference to conjugal duties.
  issues:
  - severity: low
    issue: ‘లైంగిక అనైతిక క్రియల’ is an overexpanded and somewhat unnatural rendering of τὰς πορνείας.
    rationale: πορνείας is a plural noun. Telugu ‘లైంగిక అనైతికతల’ preserves its plurality directly; adding ‘క్రియలు’ is not required by the source and makes the phrasing heavier.
  revised_text: అయితే లైంగిక అనైతికతల కారణంగా[a], ప్రతి పురుషుడు తన సొంత భార్యను కలిగి ఉండాలి; అలాగే ప్రతి స్త్రీ తన సొంత భర్తను కలిగి ఉండాలి.
