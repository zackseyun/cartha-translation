id: 1CO.7.24
reference: 1 Corinthians 7:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: te
  text: సోదరులారా[b], ప్రతి ఒక్కరూ ఏ స్థితిలో పిలువబడ్డారో, ఆ స్థితిలోనే దేవునితో[a] నిలిచి ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుని ఎదుట,’ లేదా ‘దేవుని సన్నిధిలో.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘సోదరులారా’ అనే సంబోధన స్త్రీలతో సహా సంఘమంతటినీ ఉద్దేశిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: ప్రతి ఒక్కరూ
  rationale: విభాజక ఏకవచన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తిగత అన్వయంతో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: ఏ స్థితిలో ... ఆ స్థితిలోనే
  rationale: పునరుక్తమైన ἐν నిర్మాణాన్ని నిలుపుతూ, పరిసర సందర్భంలో జీవన పరిస్థితి లేదా సామాజిక స్థితిని సూచిస్తుంది.
- source_word: ἐκλήθη
  choice: పిలువబడ్డారో
  rationale: దేవుడే పిలిచాడని సందర్భం సూచించినా, మూలపాఠంలో కర్త స్పష్టంగా లేదు; అందువల్ల కర్మణి రూపాన్ని అలాగే ఉంచుతుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: సభను ఉద్దేశించిన పుంలింగ సంబోధనను నేరుగా కాపాడుతుంది; ఇందులో స్త్రీలు కూడా ఉద్దేశించబడ్డారని పాదసూచిక వివరిస్తుంది.
- source_word: μενέτω
  choice: నిలిచి ఉండాలి
  rationale: ప్రస్తుత స్థితిలో కొనసాగాలనే ఆజ్ఞార్థక భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: παρὰ θεῷ
  choice: దేవునితో
  rationale: παρά + దత్తి విభక్తి తెలిపే సాన్నిహిత్యం లేదా సంబంధాన్ని సంక్షిప్తంగా వ్యక్తపరుస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: ἐκλήθηలో పిలిచిన కర్తగా దేవుణ్ణి స్పష్టంగా చేర్చాలా
  choice: కర్తను చేర్చకుండా ‘పిలువబడ్డారో’ అని కర్మణి రూపాన్ని నిలుపడం
  alternative: ‘దేవునిచేత పిలువబడ్డారో’
  rationale: పౌలు సందర్భంలో దేవుని పిలుపు బలంగా సూచించబడినా, గ్రీకు వాక్యంలో కర్త వ్యక్తంగా లేదు; కాబట్టి మూలంలోని సంక్షిప్తతను కాపాడింది.
- issue: మిశ్రమ లింగాలున్న సంఘాన్ని ఉద్దేశించిన ἀδελφοί అనువాదం
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ సంబోధనను ప్రధాన పాఠంలో ఉంచి, దాని సమగ్ర సంఘార్థాన్ని పాదసూచికలో స్పష్టం చేసింది.
- issue: παρὰ θεῷ యొక్క సంబంధ లేదా సన్నిధి భావం
  choice: దేవునితో
  alternative: దేవుని ఎదుట / దేవుని సన్నిధిలో
  rationale: పదబంధంలోని నిజమైన భావవిస్తృతిని ఒకే వ్యాఖ్యానానికి పరిమితం చేయకుండా, ప్రధాన పాఠంలో సంక్షిప్త సంబంధార్థాన్ని ఇచ్చి ప్రత్యామ్నాయాలను పాదసూచికలో కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్యానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. గ్రీకులోని సంబంధ–సూచక నిర్మాణం ‘ఏ స్థితిలో ... ఆ స్థితిలోనే’ ద్వారా నిలుపబడింది.
