id: 1CO.7.36
reference: 1 Corinthians 7:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: te
  text: కానీ ఎవరైనా తన కన్య[a] పట్ల తాను తగని విధంగా ప్రవర్తిస్తున్నానని భావిస్తే, ఆమె యౌవన దశను దాటిపోయి ఉండి, అలాగే జరగాల్సి ఉంటే, అతడు తనకు ఇష్టమైనది చేయాలి; అతడు పాపం చేయడం లేదు. వారు పెళ్లి చేసుకోనివ్వండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన నిశ్చితార్థురాలైన కన్య పట్ల.’ సంప్రదాయంగా దీనిని ‘తన కన్య కుమార్తె పట్ల’ అని కూడా అర్థం చేసుకున్నారు. గ్రీకు పదబంధం సందిగ్ధంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: తగని విధంగా ప్రవర్తించడం
  rationale: మర్యాదకు లేదా సందర్భానికి తగని ప్రవర్తన అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; లైంగిక లేదా తీవ్రమైన నైతిక అపచారాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: తన కన్య పట్ల
  rationale: παρθένος యొక్క ప్రాథమిక అర్థమైన ‘కన్య’ను ఉంచి, αὐτοῦ సూచించే సంబంధం నిశ్చితార్థురాలా లేక కుమార్తెనా అనే గ్రీకు మూలంలోని సందిగ్ధతను ప్రధాన పాఠ్యంలో కాపాడుతుంది.
- source_word: ὑπέρακμος
  choice: యౌవన ప్రాయం దాటిపోయి
  rationale: యౌవన వికాసపు ప్రధాన దశను దాటడం అనే వయస్సుసంబంధ భావాన్ని తెలియజేస్తుంది; నిర్దిష్టమైన ఆధునిక వివాహ వయస్సును మూలంలోకి చేర్చదు.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: అలాగే జరగాల్సి ఉంటే
  rationale: ὀφείλει లోని అవసర భావాన్ని, γίνεσθαι లోని సాధారణ ‘జరగడం’ భావాన్ని కాపాడుతూ, ఆ అవసరానికి కారణం ఏమిటో అనవసరంగా నిర్ధారించదు.
- source_word: ὃ θέλει ποιείτω
  choice: అతడు తనకు ఇష్టమైనది చేయాలి
  rationale: అనుమతినిచ్చే ఆజ్ఞార్థక భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: οὐχ ἁμαρτάνει
  choice: అతడు పాపం చేయడం లేదు
  rationale: ఇక్కడ పేర్కొన్న చర్య పాపం కాదనే నైతిక అనుమతిని వర్తమాన రూపంలో నేరుగా తెలియజేస్తుంది.
- source_word: γαμείτωσαν
  choice: వారు పెళ్లి చేసుకోనివ్వండి
  rationale: ఇద్దరూ వివాహం చేసుకోవాలనే మూడవ పురుష బహువచన ఆజ్ఞార్థక భావాన్ని ‘వారు పెళ్లి చేసుకోవాలి’ అనే కర్తవ్యార్థంగా మార్చకుండా సాధ్యమైనంతవరకు కాపాడుతుంది.
theological_decisions:
- issue: ‘తన కన్య’ (παρθένον αὐτοῦ) ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘తన కన్య’ అని ఉంచి సంబంధాన్ని నిర్దిష్టం చేయలేదు.
  alternative: ఆ వ్యక్తి నిశ్చితార్థురాలు/వివాహానికి నిశ్చయించబడిన కన్య; లేదా అతని సంరక్షణలోని కన్య కుమార్తె.
  rationale: గ్రీకు పదబంధం నిజంగా సందిగ్ధమైనది; సందర్భాన్ని క్రైస్తవ సంప్రదాయంలో ఈ రెండు ప్రధాన విధాలుగా అర్థం చేసుకున్నారు. అందువల్ల ఒక వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా స్థిరపరచకుండా, ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. ‘పెళ్లి’ సాధారణ పాఠకులకు సులభమైన పదం; వాక్య నిర్మాణం మూలంలోని షరతు, అనుమతి, చివరి ఆజ్ఞ అనే క్రమాన్ని కాపాడుతుంది.
