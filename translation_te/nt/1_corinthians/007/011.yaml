revisions:
- from: అయితే ఆమె విడిపోయినా[a], పెళ్లి చేసుకోకుండా ఉండాలి, లేదా తన భర్తతో సయోధ్య కుదుర్చుకోవాలి. అలాగే భర్త తన భార్యకు విడాకులు ఇవ్వకూడదు[b].
  to: అయితే ఆమె విడిపోయినట్లయితే[a], పెళ్లి చేసుకోకుండా ఉండాలి, లేదా తన భర్తతో సయోధ్య కుదుర్చుకోవాలి. అలాగే భర్త తన భార్యకు విడాకులు ఇవ్వకూడదు[b].
  rationale: The revision makes the conditional force of ἐὰν explicit without deciding whether χωρισθῇ denotes voluntary separation or being separated. It retains the draft’s sound distinction between separation and divorce, preserves the reconciliation instruction, and improves footnote a’s Telugu usage.
