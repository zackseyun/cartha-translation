review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the distinction between χωρισθῇ ('separate') and ἀφιέναι ('divorce/send away'), and accurately renders the instruction to remain unmarried or be reconciled. However, 'ఆమె విడిపోయినా' can sound concessive ('although/even though she separated') rather than clearly conditional. The Greek ἐὰν requires a clear 'if' condition; καί may add a concessive nuance but need not do so in the main text.
  naturalness: The register is modern, clear Telugu. 'పెళ్లి చేసుకోకుండా ఉండాలి' naturally conveys remaining unmarried in this context, and 'తన భర్తతో సయోధ్య కుదుర్చుకోవాలి' is idiomatic and suitably reflects reconciliation. A small adjustment to the first conditional makes the syntax more precise and natural.
  terminology: ‘విడిపోవడం’ appropriately avoids importing legal-divorce specificity into χωρισθῇ; ‘విడాకులు ఇవ్వడం’ appropriately conveys ἀφιέναι in this marital context. ‘సయోధ్య’ is a good rendering of καταλλαγήτω. The footnotes should use fully Telugu wording for the concessive nuance.
  issues:
  - severity: medium
    issue: The opening conditional is not explicit enough.
    rationale: ‘అయితే ఆమె విడిపోయినా’ may be heard as concessive rather than conditional. Since ἐὰν explicitly introduces a condition, ‘ఆమె విడిపోయినట్లయితే’ more faithfully communicates ‘if she separates/is separated,’ while the possible ‘even if’ nuance can remain in the footnote.
  - severity: low
    issue: Footnote a includes the untranslated technical English word ‘concessive.’
    rationale: For natural modern Telugu, ‘రాయితీ భావం’ or a plain Telugu explanation is preferable.
  revised_text: అయితే ఆమె విడిపోయినట్లయితే[a], పెళ్లి చేసుకోకుండా ఉండాలి, లేదా తన భర్తతో సయోధ్య కుదుర్చుకోవాలి. అలాగే భర్త తన భార్యకు విడాకులు ఇవ్వకూడదు[b].
