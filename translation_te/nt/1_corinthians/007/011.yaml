id: 1CO.7.11
reference: 1 Corinthians 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: te
  text: అయితే ఆమె విడిపోయినట్లయితే[a], పెళ్లి చేసుకోకుండా ఉండాలి, లేదా తన భర్తతో సయోధ్య కుదుర్చుకోవాలి. అలాగే భర్త తన భార్యకు విడాకులు ఇవ్వకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అయితే ఆమె విడిపోయినప్పటికీ.’ గ్రీకు పదబంధంలో ‘అయినప్పటికీ’ అనే స్వల్ప రాయితీ భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘తన భార్యను పంపివేయకూడదు’ అని కూడా అనువదించవచ్చు. అయితే ఈ దాంపత్య సందర్భంలో ఆ క్రియ సాధారణంగా విడాకులు ఇవ్వడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: అయితే … విడిపోయినా
  rationale: ఈ నిర్మాణంలోని షరతుతో కూడిన concessive భావాన్ని సహజమైన తెలుగులో ‘అయితే … అయినా’ ద్వారా వ్యక్తం చేసింది; καί వల్ల వచ్చే ‘ఒకవేళ నిజంగానే/అయినా’ అనే స్వల్ప భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: χωρισθῇ
  choice: విడిపోయినా
  rationale: χωρίζω ఇక్కడ దాంపత్య భాగస్వామి నుండి వేరుపడడాన్ని సూచిస్తుంది. ‘విడాకులు తీసుకున్నా’ అని అనడం న్యాయపరమైన అర్థాన్ని అతిగా నిర్దిష్టం చేస్తుంది; ‘విడిపోయినా’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: μενέτω ἄγαμος
  choice: పెళ్లి చేసుకోకుండా ఉండాలి
  rationale: μένω యొక్క కొనసాగింపు భావాన్నీ ἄγαμος యొక్క వివాహం కాని స్థితినీ సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది. ‘అవివాహితగా’ అనేది ఇంతకుముందు పెళ్లి కాని వ్యక్తి అనే అపార్థం కలిగించవచ్చు.
- source_word: καταλλαγήτω
  choice: సయోధ్య కుదుర్చుకోవాలి
  rationale: నిష్క్రియ ఆజ్ఞారూపంలోని సమాధానపడటం/సంబంధాన్ని పునరుద్ధరించుకోవటం అనే భావాన్ని తెలిపి, పునరేకీకరణకు మించిన వివరాలను చేర్చదు.
- source_word: τῷ ἀνδρί
  choice: తన భర్తతో
  rationale: దాంపత్య సందర్భంలో ἀνήρ అంటే ‘భర్త’; తెలుగు వాక్యంలో సంబంధాన్ని స్పష్టంగా, సహజంగా చూపడానికి ‘తన’ ఉపయోగించింది.
- source_word: ἄνδρα
  choice: భర్త
  rationale: ఇక్కడ ἀνήρ సాధారణంగా భర్తను సూచిస్తుంది; తెలుగు సాధారణ వాక్యనిర్మాణంలో అనిర్దిష్ట ఆర్టికల్ అవసరం లేదు.
- source_word: γυναῖκα
  choice: తన భార్యకు
  rationale: దాంపత్య సందర్భంలో γυνή అంటే ‘భార్య’. ἀφιέναιతో తెలుగులో సహజమైన ‘భార్యకు విడాకులు ఇవ్వడం’ నిర్మాణాన్ని వాడింది.
- source_word: μὴ ἀφιέναι
  choice: విడాకులు ఇవ్వకూడదు
  rationale: ఈ దాంపత్య సందర్భంలో ἀφίημι భార్యను పంపివేయడం లేదా విడిచిపెట్టడం ద్వారా వివాహబంధాన్ని ముగించడాన్ని సూచిస్తుంది. నిషేధాత్మక బలాన్ని ‘కూడదు’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: χωρισθῇ మరియు ἀφιέναι అనే రెండు క్రియలను ఒకే పదంతో అనువదించాలా?
  choice: χωρισθῇను ‘విడిపోయినా’ అని, ἀφιέναιను ‘విడాకులు ఇవ్వకూడదు’ అని వేర్వేరుగా అనువదించడం
  alternative: రెండింటినీ ‘విడాకులు’ అని లేదా రెండింటినీ సాధారణంగా ‘విడిపోవడం/వదిలివేయడం’ అని అనువదించడం
  rationale: పౌలు రెండు వేర్వేరు గ్రీకు క్రియలను ఉపయోగించాడు. ఆ తేడాను నిలుపుకోవడం వల్ల χωρισθῇలో లేని నిర్దిష్ట న్యాయపరమైన భావాన్ని దానిలోకి చేర్చకుండా, ἀφιέναιలోని దాంపత్య విసర్జన భావాన్ని స్పష్టంగా తెలియజేయవచ్చు.
- issue: మొదటి ఉపవాక్యంలోని స్త్రీ కర్తను తెలుగులో స్పష్టంగా చెప్పాలా?
  choice: ‘ఆమె’ మరియు ‘తన భర్తతో’ అని స్పష్టంగా చెప్పడం
  alternative: కర్తను విడిచిపెట్టడం లేదా అంతటా ‘భార్య’ అని పునరుక్తి చేయడం
  rationale: ముందటి సందర్భం భార్యను ఉద్దేశిస్తుంది. తెలుగులో ‘ఆమె’ అని చెప్పడం సంభాషణ ప్రవాహాన్ని స్పష్టంగా ఉంచి, పౌలు ఇచ్చిన భార్య-భర్త జత సూచనల లింగ నిర్మాణాన్ని నిలుపుతుంది.
- issue: καταλλαγήτωలోని సయోధ్య భావాన్ని ఎలా వ్యక్తం చేయాలి?
  choice: ‘తన భర్తతో సయోధ్య కుదుర్చుకోవాలి’
  alternative: ‘తన భర్త దగ్గరకు తిరిగి వెళ్లాలి’
  rationale: మూల క్రియ సంబంధపరమైన సయోధ్యను సూచిస్తుంది; కేవలం భౌతికంగా తిరిగి వెళ్లడమని లేదా నిర్దిష్ట ప్రక్రియను అది చెప్పదు. ఎంపిక చేసిన పదబంధం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘అవివాహితగా’ అనే సాంకేతికంగా వినిపించే పదానికి బదులుగా ‘పెళ్లి చేసుకోకుండా’ అన్న సహజమైన రూపాన్ని ఎంచుకుంది. ఇంగ్లీషు consultation textలో [b] గుర్తు ‘unmarried’ తరువాత కనిపించినా, దాని పాదసూచిక ἀφιέναι (‘send away/divorce’) గురించినది కాబట్టి, మూలపదానికి సరైన స్థానమైన ‘విడాకులు ఇవ్వకూడదు’ తరువాత గుర్తును ఉంచింది.
