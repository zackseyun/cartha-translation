  terminology: 'Marital terms are handled consistently: ‘భర్త’ correctly renders ἀνήρ in this context, and ‘విశ్వాసి కాని’ is accessible and theologically neutral. The footnote’s ‘విడాకులు ఇవ్వకూడదు’ is a valid contextual alternative, while the main text avoids making the Greek verb more legally specific than necessary.'
