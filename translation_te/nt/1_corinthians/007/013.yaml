id: 1CO.7.13
reference: 1 Corinthians 7:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: te
  text: అలాగే, ఒక స్త్రీకి విశ్వాసి కాని భర్త ఉండి, అతడు ఆమెతో కలిసి జీవించడానికి సమ్మతిస్తే, ఆమె తన భర్తను విడిచిపెట్టకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన భర్తకు విడాకులు ఇవ్వకూడదు’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియకు మరింత అక్షరార్థంగా ‘విడిచిపెట్టు’ లేదా ‘పంపివేయు’ అనే అర్థాలు ఉన్నాయి; ఇక్కడ అది వివాహ సంబంధాన్ని ముగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: ఒక స్త్రీ
  rationale: γυνή అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ἔχει ἄνδρα అనే వైవాహిక సందర్భం వల్ల వివాహిత స్త్రీ ఉద్దేశించబడింది; ‘ఒక స్త్రీకి ... భర్త’ అనేది సహజమైన తెలుగు.
- source_word: εἴ τις
  choice: ఒక స్త్రీకి ... ఉండి
  rationale: ఈ షరతు సాధారణంగా వర్తించే ఒక సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఒక స్త్రీకి ... ఉండి’ అని చెప్పడం దాని అనిర్దిష్ట, సాధారణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἄνδρα ἄπιστον
  choice: విశ్వాసి కాని భర్త
  rationale: ἀνήρ ఇక్కడ వైవాహిక సందర్భంలో ‘భర్త’; ἄπιστος క్రైస్తవ విశ్వాసాన్ని పంచుకోని వ్యక్తిని సూచిస్తుంది. ‘అవిశ్వాసి’ కంటే ‘విశ్వాసి కాని’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; ఇది వైవాహిక అపనమ్మకాన్ని సూచించదు.
- source_word: οὗτος
  choice: అతడు
  rationale: ఈ సర్వనామం ముందుగా పేర్కొన్న భర్తను తిరిగి సూచిస్తుంది; ‘అతడు’ సహజమైన తెలుగు రూపం.
- source_word: συνευδοκεῖ
  choice: సమ్మతిస్తే
  rationale: ఈ క్రియ ఇష్టపూర్వకమైన అంగీకారాన్ని తెలియజేస్తుంది. ‘సమ్మతిస్తే’ దాని ఉద్దేశపూర్వక అంగీకార భావాన్ని కాపాడుతుంది.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: ఆమెతో కలిసి జీవించడానికి
  rationale: ఈ పదబంధం ఒకే గృహంలో వైవాహిక జీవితం కొనసాగించడాన్ని సూచిస్తుంది. ‘కలిసి జీవించడానికి’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: ఆమె తన భర్తను విడిచిపెట్టకూడదు
  rationale: ἀφίημι అనే క్రియకు ‘విడిచిపెట్టు’ లేదా ‘పంపివేయు’ అనే భావాలు ఉన్నాయి; ఇక్కడ వివాహ సంబంధాన్ని ముగించడం సందర్భార్థం. ‘విడిచిపెట్టకూడదు’ మూలంలోని పదార్థాన్ని కాపాడుతూ ‘విడాకులు ఇవ్వకూడదు’ కంటే క్రియ యొక్క పరిధిని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: మిశ్ర విశ్వాస వివాహంలో ἀφιέτω అనే ఆదేశాన్ని ఎలా అనువదించాలి
  choice: ఆమె తన భర్తను విడిచిపెట్టకూడదు
  alternative: ఆమె తన భర్తకు విడాకులు ఇవ్వకూడదు
  rationale: మూల క్రియ వివాహ సంబంధాన్ని రద్దు చేయడాన్ని సందర్భంలో సూచించినప్పటికీ, అది స్వయంగా ఒకే చట్టపరమైన విధానాన్ని నిర్దిష్టంగా చెప్పదు. కాబట్టి ‘విడిచిపెట్టకూడదు’ నిజమైన పదార్థ విస్తృతిని, వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది; పాదసూచిక వైవాహిక సందర్భాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అలాగే’ అనే అనుసంధానం καί యొక్క సందర్భానుసార కొనసాగింపును తెలియజేస్తుంది. ఆజ్ఞను ‘కూడదు’ రూపంలో స్పష్టంగా ఉంచి, మూలంలోని వైవాహిక-చట్టపరమైన అనిశ్చితిని పాదసూచికతో కాపాడాం.
