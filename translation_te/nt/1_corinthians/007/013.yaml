  source_fidelity: 'The Telugu accurately represents the conditional case: a woman has an unbelieving husband, he willingly agrees to continue living with her, and she is instructed not to leave him. ‘విశ్వాసి కాని భర్త’ appropriately conveys ἄνδρα ἄπιστον without suggesting marital unfaithfulness. ‘విడిచిపెట్టకూడదు’ preserves the lexical breadth of μὴ ἀφιέτω while the footnote properly identifies the marital-relational sense.'
