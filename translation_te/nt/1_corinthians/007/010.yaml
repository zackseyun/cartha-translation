id: 1CO.7.10
reference: 1 Corinthians 7:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: te
  text: 'వివాహితులకు నేను ఈ ఆజ్ఞ ఇస్తున్నాను—నేను కాదు, ప్రభువే: భార్య తన భర్త నుండి విడిపోకూడదు[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన భర్తతో విడాకులు తీసుకోకూడదు.” ఇక్కడి గ్రీకు క్రియ వివాహితులు వేరుపడడాన్ని సూచిస్తుంది; ఈ సందర్భంలో దానిలో విడాకులు తీసుకోవడం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: వివాహితులకు
  rationale: γεγαμηκόσιν అనే పరిపూర్ణ కృదంతం వివాహస్థితిలో ఉన్నవారిని సూచిస్తుంది; దత్తివిభక్తి సంబోధిత వర్గాన్ని తెలియజేస్తుంది. δέ ఇక్కడ స్వల్ప విషయమార్పును సూచించినా, తెలుగులో అదనపు సంధిపదం లేకుండానే సహజంగా ప్రవాహం నిలుస్తుంది.
- source_word: παραγγέλλω
  choice: నేను ఈ ఆజ్ఞ ఇస్తున్నాను
  rationale: ఈ క్రియ అధికారపూర్వకమైన నిర్దేశాన్ని తెలియజేస్తుంది. ఈ రూపం దాని బలాన్ని కాపాడుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: నేను కాదు, ప్రభువే
  rationale: గ్రీకు వాక్యంలోని ఉద్ఘాటనతో కూడిన వ్యత్యాసాన్ని సంక్షిప్తంగా, వ్యాఖ్యానాన్ని జోడించకుండా కాపాడుతుంది.
- source_word: γυναῖκα
  choice: భార్య
  rationale: γυνή అనే పదానికి ‘స్త్రీ’ అనే అర్థం కూడా ఉన్నా, వివాహ సందర్భం మరియు ἀνήρతో ఉన్న జత ఇక్కడ ‘భార్య’ అనే అర్థాన్ని స్పష్టం చేస్తాయి.
- source_word: ἀπὸ ἀνδρὸς
  choice: తన భర్త నుండి
  rationale: వివాహ సందర్భంలో ἀνήρ అంటే ‘భర్త.’ తెలుగు సంబంధాన్ని సహజంగా తెలియజేయడానికి ‘తన’ చేర్చబడింది.
- source_word: μὴ χωρισθῆναι
  choice: విడిపోకూడదు
  rationale: χωρίζω వివాహ సంబంధంలో వేరుపడడాన్ని సూచిస్తుంది; వెంటనే ‘విడాకులు’ అని సంకుచితం చేయకుండా మూలపదంలోని విస్తృతిని ఇది నిలుపుతుంది. గ్రీకు నిష్క్రియారూపాన్ని తెలుగులో సహజమైన కర్తరి నిర్మాణంతో వ్యక్తం చేశాం.
theological_decisions:
- issue: ‘నేను కాదు, ప్రభువే’ అనే మాట భావం
  choice: మూలంలోని వ్యత్యాసాన్ని వివరణ జోడించకుండా ‘నేను కాదు, ప్రభువే’ అని నిలిపివేయడం
  alternative: పౌలు తన మాటలకు అధికారం లేదని చెబుతున్నట్లు విస్తరించి అనువదించడం
  rationale: ఈ వాక్యం ప్రభువు ఇప్పటికే ఇచ్చిన బోధకు, తరువాత పౌలు వర్తింపజేసే నిర్దేశానికి మధ్య వ్యత్యాసాన్ని సూచించవచ్చు. అయితే అనువాదంలో ఆ వ్యాఖ్యానాన్ని ఖరారు చేయకుండా మూలంలోని ఉద్వేగాన్ని అలాగే ఉంచడం సముచితం.
- issue: వివాహ సందర్భంలో χωρισθῆναι పరిధి
  choice: విడిపోకూడదు
  alternative: విడాకులు ఇవ్వకూడదు
  rationale: ఈ పదం వేరుపడడాన్ని సూచిస్తుంది; సందర్భంలో అది విడాకులను కూడా కలిగి ఉండవచ్చు. ‘విడిపోకూడదు’ అనే అనువాదం ఆధునిక చట్టపరమైన అర్థానికే పరిమితం చేయకుండా మూలంలోని భావపరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన మరియు సంక్షిప్తమైన శైలిని ఉపయోగించాం. మూలంలోని అసంపూర్ణ కొనసాగింపును చివరి దీర్ఘవిరామంతో నిలిపాం.
