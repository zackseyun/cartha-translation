id: 1CO.7.38
reference: 1 Corinthians 7:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: te
  text: కాబట్టి, తన కన్యను పెళ్లికి ఇచ్చేవాడు మంచి పని చేస్తున్నాడు; ఆమెను పెళ్లికి ఇవ్వనివాడు ఇంకా మేలైన పని చేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కన్యకైన తన నిశ్చితార్థురాలిని వివాహం చేసుకునేవాడు మంచి పని చేస్తున్నాడు; ఆమెను వివాహం చేసుకోనివాడు ఇంకా మేలైన పని చేస్తాడు.” మరొక సాధారణ వ్యాఖ్యానం ప్రకారం ఇక్కడ “తన కన్య కుమార్తె” ఉద్దేశించబడింది. ఇక్కడి గ్రీకు క్రియకు “పెళ్లికి ఇవ్వడం” అనే అర్థమే మరింత సహజం; అందువల్ల ప్రధాన పాఠ్యం ఆ అర్థాన్ని ఉంచి, ఆ కన్యతో అతనికున్న ఖచ్చితమైన సంబంధాన్ని నిర్దిష్టంగా చెప్పలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే ముగింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γαμίζων
  choice: పెళ్లికి ఇచ్చేవాడు
  rationale: γαμίζω అనే కారక క్రియకు సాధారణంగా ‘పెళ్లికి ఇవ్వడం’ అనే అర్థం ఉంది; దాన్ని కేవలం ‘పెళ్లి చేసుకోవడం’గా మార్చకుండా గ్రీకు రూపంలోని భేదాన్ని నిలుపుతుంది.
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: తన కన్యను
  rationale: παρθένος అంటే ‘కన్య’; ἑαυτοῦ తనతో గల సంబంధాన్ని సూచిస్తుంది. ఆ కన్య కుమార్తెనా, సంరక్షణలో ఉన్నవారా, నిశ్చితార్థ వధువా అనే వివాదాన్ని ప్రధాన పాఠ్యంలో పరిష్కరించకుండా ఈ సంక్షిప్త రూపం కొంతవరకు అస్పష్టతను నిలుపుతుంది.
- source_word: καλῶς ποιεῖ
  choice: మంచిపని చేస్తున్నాడు
  rationale: ఇది ఆ చర్య మంచిదని చెప్పే మూలపాఠ్యంలోని మూల్యాంకనాన్ని సహజంగా వ్యక్తం చేస్తుంది; దానిని సంపూర్ణ నైతిక ఆజ్ఞగా అతిశయింపజేయదు.
- source_word: μὴ γαμίζων
  choice: ఆమెను పెళ్లికి ఇవ్వనివాడు
  rationale: మొదటి γαμίζωνతో ఒకే కారక అర్థాన్ని కొనసాగిస్తుంది. తెలుగులో స్పష్టత కోసం ముందున్న కర్మను ‘ఆమెను’ అని పునరుద్ధరించింది.
- source_word: κρεῖσσον ποιήσει
  choice: ఇంకా మేలైన పని చేస్తాడు
  rationale: κρεῖσσον తులనాత్మక రూపం; ‘అత్యుత్తమం’ అని కాకుండా, ఒక చర్య మరొకదానికంటే మేలని మాత్రమే తెలియజేస్తుంది. ποιήσειలోని భవిష్యత్ భావాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: ‘తన కన్య’ ఎవరిని సూచిస్తుంది, γαμίζωకు ఇక్కడ ఏ అర్థం ఉంది?
  choice: ప్రధాన పాఠ్యంలో ‘పెళ్లికి ఇచ్చేవాడు’ అనే కారక అర్థాన్ని ఉంచి, కన్యతో అతనికున్న ఖచ్చితమైన సంబంధాన్ని నిర్దిష్టంగా చెప్పలేదు.
  alternative: ‘తన కన్య అయిన నిశ్చితార్థ వధువును పెళ్లి చేసుకునేవాడు మంచిపని చేస్తున్నాడు; ఆమెను పెళ్లి చేసుకోనివాడు ఇంకా మేలైన పని చేస్తాడు’ లేదా ‘తన కన్య కుమార్తెను పెళ్లికి ఇచ్చేవాడు...’
  rationale: 1 కొరింథీయులు 7:36–38లోని ఈ పదబంధానికి పలు వ్యాఖ్యానాలు ఉన్నాయి. γαμίζω ‘పెళ్లికి ఇవ్వడం’ అనే కారక అర్థానికే ఎక్కువ సహజంగా సరిపోతుంది; అయితే ఆ కన్య కుమార్తెనా, సంరక్షణలో ఉన్నవారా, లేక వేరొక వ్యాఖ్యానం ప్రకారం నిశ్చితార్థ వధువా అనేది నిర్ధారించడం కష్టం. అందువల్ల ప్రధాన పాఠ్యం గ్రీకు క్రియకు దగ్గరగా ఉండి, సామాజిక సంబంధాన్ని పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘తన కన్య’ సాధారణ సంభాషణలో కొంత అసాధారణంగా వినిపించినా, మూలంలోని నిజమైన అస్పష్టతను కుమార్తె లేదా నిశ్చితార్థ వధువు అని ముందే నిర్ణయించకుండా నిలుపుతుంది.
