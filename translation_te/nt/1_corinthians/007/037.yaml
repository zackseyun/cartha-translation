id: 1CO.7.37
reference: 1 Corinthians 7:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: te
  text: అయితే, తన హృదయంలో స్థిరంగా నిలిచి, తప్పనిసరి పరిస్థితి ఏదీ లేకుండా[a], తన సొంత సంకల్పంపై అధికారం కలిగి, తన కన్యను[b] అలాగే ఉంచాలని తన హృదయంలో నిర్ణయించుకున్నవాడు మంచిపనే చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏ నిర్బంధానికీ లోబడకుండా.”
    reason: ἀνάγκη అనే పదానికి అవసరం, అనివార్యతతో పాటు నిర్బంధం అనే భావమూ ఉండవచ్చు.
  - marker: b
    text: “తన కన్య” అనేది అతని కన్యకుమార్తెను గానీ, అతనికి నిశ్చయించబడిన కన్యను గానీ సూచించవచ్చు; గ్రీకు పదబంధం గురించి భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: కన్యతో పురుషుని సంబంధం మూల పాఠంలో స్పష్టంగా లేదు; రెండు ప్రధాన పఠనాలనూ నిలిపి ఉంచాలి.
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: తన హృదయంలో స్థిరంగా నిలిచి
  rationale: పరిపూర్ణ కాలంలోని ἕστηκεν, ἑδραῖοςతో కలిసి, అప్పటికే ఏర్పడిన దృఢమైన అంతరంగ నిర్ణయాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ స్థిరత్వాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μὴ ἔχων ἀνάγκην
  choice: తప్పనిసరి పరిస్థితి ఏదీ లేకుండా
  rationale: ἀνάγκηలో అవసరం, అనివార్యత, నిర్బంధం అనే భావాలు ఉన్నాయి. ప్రధాన పాఠం అనివార్యతను ఉంచుతుంది; ‘నిర్బంధం’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: తన సొంత సంకల్పంపై అధికారం కలిగి
  rationale: ἐξουσία అధికారాన్ని లేదా నిర్ణయాధికారాన్ని, θέλημα సంకల్పాన్ని లేదా ఉద్దేశాన్ని సూచిస్తాయి. ఈ అనువాదం స్వీయ నిర్ణయాధికారాన్ని తెలియజేస్తూ అనవసరమైన లైంగిక అర్థాన్ని చేర్చదు.
- source_word: κέκρικεν ἐν τῇ ἰδίᾳ καρδίᾳ
  choice: తన హృదయంలో నిర్ణయించుకున్నవాడు
  rationale: పరిపూర్ణ కాలం ఇప్పటికే తీసుకొని కొనసాగిస్తున్న స్థిర నిర్ణయాన్ని సూచిస్తుంది. ‘నిర్ణయించుకున్న’ అనేది ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: τηρεῖν τὴν ἑαυτοῦ παρθένον
  choice: తన కన్యను అలాగే ఉంచాలని
  rationale: τηρεῖν అంటే ఉంచడం, కాపాడడం, ఒక స్థితిలో కొనసాగించడం. ‘అలాగే ఉంచడం’ వివాహం గురించిన సందర్భార్థాన్ని సూచించినా, మూలంలో లేని ‘అవివాహితగా’ అనే పదాన్ని నేరుగా చేర్చదు. ‘తన కన్య’ అనే రూపం వివాదాస్పదమైన సంబంధాన్ని ప్రధాన పాఠంలో నిర్ణయించకుండా ఉంచుతుంది.
- source_word: καλῶς ποιήσει
  choice: మంచిపనే చేస్తాడు
  rationale: ఈ గ్రీకు నుడికారం ప్రశంసార్హంగా లేదా సరిగా ప్రవర్తించడాన్ని సూచిస్తుంది. ‘మంచిపనే చేస్తాడు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: τὴν ἑαυτοῦ παρθένον అనే పదబంధంలో కన్యతో పురుషుని సంబంధం
  choice: ప్రధాన పాఠంలో ‘తన కన్య’ అని ఉంచి సంబంధాన్ని నిర్దిష్టం చేయలేదు.
  alternative: ‘తన కన్యకుమార్తె’ లేదా ‘తనకు నిశ్చయించబడిన కన్య’
  rationale: ఈ సందర్భంలో παρθένος కుమార్తెను సూచిస్తుందా, వివాహ నిశ్చయం జరిగిన కన్యను సూచిస్తుందా అన్నది వివాదాస్పదం. మూల గ్రీకు ఈ విషయాన్ని స్పష్టంగా తేల్చదు కాబట్టి, ప్రధాన పాఠం అస్పష్టతను నిలిపి ప్రత్యామ్నాయాలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యంలోని పునరుక్త ‘హృదయం’ భావాన్ని నిలిపి, తెలుగు వాక్య నిర్మాణం సహజంగా ఉండేలా క్రమం అమర్చబడింది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల దగ్గర ఉంచబడ్డాయి.
