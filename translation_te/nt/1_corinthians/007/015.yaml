id: 1CO.7.15
reference: 1 Corinthians 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: te
  text: అయితే అవిశ్వాసి వేరైపోతే[a], వేరైపోనివ్వండి. అటువంటి పరిస్థితుల్లో సహోదరుడైనా సహోదరియైనా దాసత్వంలో లేరు[b]. కాని దేవుడు మనలను[c] సమాధానంలో పిలిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘అవిశ్వాసి’ అంటే సందర్భానుసారంగా విశ్వసించని జీవిత భాగస్వామి. ‘వేరైపోతే’ అనే మాటను ‘విడిచి వెళ్తే’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘బంధింపబడలేదు.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘దాసునిగా చేయడం’ అనే భావం ఉంది; అది సాధారణంగా ‘బంధించడం’ అనే అర్థమిచ్చే క్రియ కాదు.
    reason: lexical_alternative
  - marker: c
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘మనలను’ అనే పదానికి బదులుగా ‘మిమ్మల్ని’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: అవిశ్వాసి
  rationale: ఈ విశేషణం నామవాచకంగా వాడబడింది. వివాహ సందర్భంలో ఇది విశ్వసించని జీవిత భాగస్వామిని సూచించినా, మూలపాఠంలో లేని ‘జీవిత భాగస్వామి’ని ప్రధాన వాక్యంలో చేర్చలేదు.
- source_word: χωρίζεται / χωριζέσθω
  choice: వేరైపోతే / వేరైపోనివ్వండి
  rationale: రెండు గ్రీకు క్రియారూపాల పదపునరుక్తిని తెలుగులోనూ నిలిపి, ఇది చట్టపరమైన విడాకులా లేక భౌతికంగా విడిచి వెళ్లడమా అనే విషయాన్ని అనవసరంగా నిర్ధారించలేదు. ఆజ్ఞారూపం విడిపోవాలని ఆదేశించడం కంటే దాన్ని అనుమతించడం లేదా అంగీకరించడం సూచిస్తుంది.
- source_word: οὐ δεδούλωται
  choice: దాసత్వంలో లేరు
  rationale: δουλόω అనే క్రియలోని దాసత్వ భావాన్ని నిలిపింది; సాధారణంగా ‘బంధించు’ అని అర్థమిచ్చే వేరొక గ్రీకు క్రియను దీనిలోకి తీసుకురాలేదు. గ్రీకు పరిపూర్ణ కాలం సూచించే కొనసాగుతున్న స్థితి తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: సహోదరుడైనా సహోదరియైనా
  rationale: విశ్వాసులను సూచించే సహోదర భాషను, అలాగే రెండు లింగాలనూ స్పష్టంగా నిలిపింది.
- source_word: ἐν τοῖς τοιούτοις
  choice: అటువంటి పరిస్థితుల్లో
  rationale: ఇప్పుడే వివరించినలాంటి సందర్భాలను సూచించే గ్రీకు బహువచన నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἐν δὲ εἰρήνῃ
  choice: అయితే ... సమాధానంలో
  rationale: ἐν అనే విభక్తి సూచించే పరిధి లేదా స్థితిని ‘సమాధానంలో’ అని నేరుగా నిలిపి, ‘సమాధానం కోసం’ అనే లక్ష్యార్థాన్ని బలవంతంగా చేర్చలేదు.
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: దేవుడు మనలను ... పిలిచాడు
  rationale: SBLGNTలోని ἡμᾶς (‘మనలను’) పాఠాన్ని అనుసరించింది. గ్రీకు పరిపూర్ణ కాలంలోని పూర్తయిన పిలుపు తెలుగులో సందర్భానుకూలంగా ‘పిలిచాడు’ అని సహజంగా వ్యక్తమైంది.
theological_decisions:
- issue: οὐ δεδούλωται వివాహ రద్దు లేదా పునర్వివాహానికి సంబంధించిన పూర్తి పరిధి
  choice: ‘దాసత్వంలో లేరు’ అని మూలపదానికి దగ్గరగా అనువదించి, ఆ స్వేచ్ఛ పునర్వివాహాన్ని అనుమతిస్తుందా అనే అంశాన్ని వాక్యం ద్వారా నిర్ణయించలేదు.
  alternative: ‘బంధింపబడలేదు’ అని సాంకేతిక వివాహబంధ పదంగా అనువదించి పునర్వివాహానికి స్పష్టమైన అనుమతిగా గ్రహించడం.
  rationale: ఈ వచనం విశ్వాసి దాసత్వంలో లేడని చెబుతుంది; అయితే ఆ స్వేచ్ఛ యొక్క పూర్తి పరిధిని స్పష్టంగా నిర్వచించదు. అందువల్ల వ్యాఖ్యాన సంప్రదాయాల మధ్య ఉన్న ఉద్రిక్తతను అనువాదం పరిష్కరించదు.
- issue: ὁ ἄπιστος యొక్క సూచిత వ్యక్తి
  choice: ప్రధాన పాఠంలో ‘అవిశ్వాసి’; సందర్భార్థాన్ని పాదసూచికలో ‘విశ్వసించని జీవిత భాగస్వామి’గా వివరించడం.
  alternative: ప్రధాన పాఠంలోనే ‘విశ్వసించని జీవిత భాగస్వామి’ అని స్పష్టీకరించడం.
  rationale: వివాహ సందర్భం జీవిత భాగస్వామిని సూచిస్తుంది, కాని గ్రీకు వ్యక్తీకరణలో ‘జీవిత భాగస్వామి’ అనే నామవాచకం లేదు.
- issue: ἐν εἰρήνῃ లో సమాధానానికి పిలుపు యొక్క స్వభావం
  choice: ‘సమాధానంలో పిలిచాడు’ అని పరిధి లేదా స్థితి భావాన్ని నిలిపివేయడం.
  alternative: ‘సమాధానం కోసం పిలిచాడు’ అని లక్ష్యార్థంగా అనువదించడం.
  rationale: ἐν సాధారణంగా పరిధి లేదా స్థితిని సూచిస్తుంది; లక్ష్యార్థం సాధ్యమైన వ్యాఖ్యానమైనా దానిని ప్రధాన పాఠంలో నిర్బంధించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిల్ శైలిలో రూపొందించబడింది. ‘వేరైపోతే / వేరైపోనివ్వండి’ అనే పునరుక్తి ఉద్దేశపూర్వకంగా మూలపాఠంలోని క్రియాపునరుక్తిని నిలుపుతుంది. ‘దాసత్వంలో లేరు’ అనే రూపం సహజమైన తెలుగుతో పాటు మూలంలోని బలమైన దాసత్వ పదాన్ని కాపాడుతుంది.
