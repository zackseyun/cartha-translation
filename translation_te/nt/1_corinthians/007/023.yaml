  edition: SBLGNT
  text: τιμῆς ἠγοράσθητε· μὴ γίνεσθε δοῦλοι ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: te
  text: మీరు వెల చెల్లించి కొనబడినవారు; మనుషులకు బానిసలు కావద్దు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιμῆς
  choice: వెల చెల్లించి
  rationale: ἀγοράζωతో వచ్చిన ఈ సంబంధ విభక్తి కొనుగోలుకు చెల్లించిన వెలను సూచిస్తుంది. తెలుగు సహజ వాడుకలో ‘వెల చెల్లించి’ అనే రూపం ఖరీదైన కొనుగోలు భావాన్ని నిలుపుతుంది; వెల ఎంతనేది పేర్కొనదు.
- source_word: ἠγοράσθητε
  choice: మీరు ... కొనబడ్డారు
  rationale: ఇది భూతకాల నిష్క్రియార్థక, రెండవ పురుష బహువచన రూపం. ‘కొనబడ్డారు’ వాణిజ్యపరమైన కొనుగోలు రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: μὴ γίνεσθε
  choice: కావద్దు
  rationale: γίνομαι యొక్క ‘అవడం/కావడం’ భావాన్ని ‘కావద్దు’ సహజమైన తెలుగు నిషేధాజ్ఞగా తెలియజేస్తుంది; కేవలం ‘ఉండవద్దు’ అని స్థితిని మాత్రమే చెప్పదు.
- source_word: δοῦλοι
  choice: బానిసలు
  rationale: ఈ సందర్భంలో యాజమాన్యం, అధీనత అనే భావాలు ప్రధానమైనవి. అందువల్ల మృదువైన ‘సేవకులు’ కంటే ‘బానిసలు’ మూలపద బలాన్ని, కొనుగోలు రూపకంతో దాని సంబంధాన్ని కాపాడుతుంది.
- source_word: ἀνθρώπων
  choice: మనుషులకు
  rationale: ఇక్కడ ἀνθρώπων మానవులను సాధారణంగా సూచిస్తుంది, కేవలం పురుషులను కాదు. ‘మనుషులకు బానిసలు’ అనేది ప్రభువుకు చెందినవారిగా ఉండటానికి విరుద్ధమైన మానవ అధీనతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: δοῦλοι ἀνθρώπωνలోని యాజమాన్యం మరియు విధేయత భావాన్ని ఎలా వ్యక్తం చేయాలి
  choice: మనుషులకు బానిసలు
  alternative: మనుషులకు సేవకులు
  rationale: ఈ వాక్యంలో ‘కొనబడ్డారు’ అనే రూపకంతో బానిసత్వపు యాజమాన్య భావం ముడిపడి ఉంది. ‘బానిసలు’ ఆ ఉద్వేగాన్ని కాపాడుతుంది. ‘మనుషులు’ లింగభేదం లేకుండా మానవ యజమానులను లేదా మానవుల పరమాధికారాన్ని సూచిస్తుంది; ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన ఆజ్ఞారూపం. మూలంలోని రెండు వాక్యభాగాల సమాంతరతను సెమికోలన్‌తో నిలిపాం. పాఠ్యంలో పాదటిప్పణి గుర్తులు లేవు, ఎందుకంటే తెలుగు ‘మనుషులు’ స్వయంగా సమగ్ర మానవ సూచనను స్పష్టంగా ఇస్తుంది.
