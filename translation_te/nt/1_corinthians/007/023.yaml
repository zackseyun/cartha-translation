revisions:
- from: మీరు వెల చెల్లించి కొనబడ్డారు; మనుషులకు బానిసలు కావద్దు.
  to: మీరు వెల చెల్లించి కొనబడినవారు; మనుషులకు బానిసలు కావద్దు.
  rationale: The revision retains the Greek's commercial-redemptive metaphor, passive voice, plural address, and prohibition against entering human slavery, while improving Telugu idiom and avoiding an unintended implication that the readers paid the purchase price. The semicolon preserves the concise two-part structure of the source.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:03:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the aorist passive "you were bought" and the prohibition against becoming slaves of human beings. However, "మీరు వెల చెల్లించి కొనబడ్డారు" can momentarily imply that the readers themselves paid the price; recasting it as "వెల చెల్లించి కొనబడినవారు" makes the passive purchase relation clearer while retaining the unspecified purchaser and price.
  naturalness: '"వెల చెల్లించి కొనబడినవారు" is a more idiomatic and clear modern-standard Telugu expression than the finite passive construction following the conjunctive phrase. "మనుషులకు బానిసలు కావద్దు" is concise, natural, and appropriately forceful.'
  terminology: '"బానిసలు" rightly represents δοῦλοι, preserving the ownership/subjection force in this context. "మనుషులు" appropriately includes all human beings and does not introduce a male-only meaning. No footnote is necessary in Telugu because the inclusive sense is explicit.'
  issues:
  - severity: low
    issue: The participial phrase "వెల చెల్లించి" followed by "కొనబడ్డారు" has a potentially unclear agent relation.
    rationale: Since the readers are the grammatical subject, the present phrasing can be read as though they paid the price. "వెల చెల్లించి కొనబడినవారు" more naturally presents them as those who were purchased at a price, without adding who paid it.
  revised_text: మీరు వెల చెల్లించి కొనబడినవారు; మనుషులకు బానిసలు కావద్దు.
  revised_footnotes: []
  revision_rationale: The revision retains the Greek's commercial-redemptive metaphor, passive voice, plural address, and prohibition against entering human slavery, while improving Telugu idiom and avoiding an unintended implication that the readers paid the purchase price. The semicolon preserves the concise two-part structure of the source.
