id: 1CO.7.14
reference: 1 Corinthians 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: te
  text: ఎందుకంటే, అవిశ్వాసియైన భర్త తన భార్య ద్వారా పవిత్రపరచబడ్డాడు; అలాగే అవిశ్వాసియైన భార్య సహోదరుని ద్వారా పవిత్రపరచబడింది.[a] అలా కాకపోతే మీ పిల్లలు అపవిత్రులు; కాని వాస్తవానికి వారు పవిత్రులు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వాసియైన భర్త ద్వారా.” గ్రీకులో “సహోదరుని ద్వారా” అని ఉంది; పౌలు సాధారణంగా తోటి విశ్వాసిని “సహోదరుడు” అని పిలిచే వాడుక ప్రకారం, ఇక్కడ ఇది విశ్వాసియైన భర్తను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “పవిత్రపరచబడటం” అనేది విశ్వాసియైన జీవిత భాగస్వామితోను కుటుంబంతోను ఉన్న సంబంధంలో ప్రత్యేకపరచబడిన స్థితిని సూచిస్తుంది; అది తప్పనిసరిగా వ్యక్తిగత రక్షణను సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: పవిత్రపరచబడ్డాడు / పవిత్రపరచబడింది
  rationale: పరిపూర్ణ కర్మణి రూపం గతంలో జరిగిన కార్యం వల్ల ఏర్పడిన ప్రస్తుత స్థితిని సూచిస్తుంది. ఈ పదప్రయోగం మూలంలోని ‘పవిత్రం’ అనే భావాన్ని నిలుపుతూ, వ్యక్తిగత రక్షణ అని ముందే నిర్ణయించదు.
- source_word: ἄπιστος
  choice: అవిశ్వాసియైన
  rationale: వివాహ సందర్భంలో ఇది నమ్మకద్రోహిని కాక, విశ్వసించని వ్యక్తిని సూచిస్తుంది.
- source_word: ἐν
  choice: ద్వారా
  rationale: ఇక్కడ సంబంధాత్మక లేదా సాధనార్థక భావం సహజంగా ఉంది; విశ్వాసి జీవిత భాగస్వామితో ఉన్న సంబంధం ద్వారా కలిగే స్థితిని సూచిస్తుంది.
- source_word: ἀνήρ / γυνή
  choice: భర్త / భార్య
  rationale: సమీప సందర్భం వివాహానికి సంబంధించినది కాబట్టి సాధారణ ‘పురుషుడు / స్త్రీ’ కంటే ఇవే సందర్భోచితమైన పదాలు.
- source_word: ἀδελφῷ
  choice: ఆ సహోదరుని
  rationale: మూలంలో ‘భర్త’ కాక ‘సహోదరుడు’ ఉంది. పౌలు తోటి విశ్వాసిని ఈ పదంతో పిలిచే వాడుకను పారదర్శకంగా నిలుపుతుంది.
- source_word: ἐπεὶ ἄρα
  choice: అలా కాకపోతే
  rationale: ముందటి ప్రకటన నిజం కాని పక్షంలో వచ్చే పర్యవసానాన్ని ఈ పదబంధం పరిచయం చేస్తుంది.
- source_word: ἀκάθαρτα
  choice: అపవిత్రులు
  rationale: శుద్ధి, ఒడంబడిక సంబంధిత ప్రతిధ్వనిని ‘అపవిత్రులు’ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: νῦν δὲ
  choice: కాని వాస్తవానికి
  rationale: ఊహాత్మక పరిస్థితికి భిన్నంగా ఉన్న నిజ స్థితిని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ఇక్కడ νῦν కేవలం కాలార్థకమైన ‘ఇప్పుడు’ కాదు.
- source_word: ἅγια
  choice: పవిత్రులు
  rationale: ἡγίασταιతో పదార్థ సంబంధాన్ని నిలుపుతుంది; ‘ప్రత్యేకపరచబడినవారు’ అని వివరించి మూలంలోని వేదాంతపరమైన విస్తృతిని కుదించదు.
theological_decisions:
- issue: అవిశ్వాసి జీవిత భాగస్వామి ‘పవిత్రపరచబడటం’ యొక్క అర్థం
  choice: వివాహం, కుటుంబ సంబంధంలో ఏర్పడిన పవిత్రమైన లేదా ప్రత్యేకపరచబడిన స్థితిని సూచించేలా మూల పదాన్ని నిలుపడం
  alternative: విశ్వాసితో వివాహం వల్ల అవిశ్వాసి స్వయంచాలకంగా రక్షించబడ్డాడని అనువదించడం; లేదా ఇది వివాహ సంబంధపు చట్టబద్ధతను మాత్రమే సూచిస్తుందని కుదించడం
  rationale: వాక్యం వ్యక్తిగత రక్షణను స్పష్టంగా ప్రకటించదు; దాంపత్యం మరియు పిల్లల స్థితిని ఆధారంగా వాదిస్తుంది. కాబట్టి అర్థాన్ని సిద్ధాంతపరంగా అతిగా నిర్ణయించకుండా ఉద్వేగాన్ని నిలిపాం.
- issue: ἀδελφῷ పదానికి సూచిత వ్యక్తి
  choice: ప్రధాన పాఠ్యంలో ‘ఆ సహోదరుని’ అని ఉంచి, పాదసూచికలో విశ్వాసియైన భర్త అని వివరించడం
  alternative: సమాంతర నిర్మాణం కోసం నేరుగా ‘భర్త’ లేదా ‘విశ్వాసియైన జీవిత భాగస్వామి’ అని మార్చడం
  rationale: గ్రీకు పాఠ్యం ἀνήρ బదులు ἀδελφόςను వాడింది. మూలంలోని పదభేదాన్ని నిలుపుతూ పాఠకునికి దాని సందర్భార్థాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పవిత్రపరచబడింది,’ ‘అపవిత్రులు,’ ‘పవిత్రులు’ అనే పదాలతో మూలంలోని పవిత్రత–అపవిత్రత వ్యత్యాసం మరియు పదసంబంధం నిలుపబడ్డాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
