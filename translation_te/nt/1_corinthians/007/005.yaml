revisions:
- from: ఒకరికొకరు దాంపత్య హక్కును నిరాకరించకండి.[a] అయితే, ప్రార్థనకు మిమ్మల్ని మీరు అంకితం చేసుకోవడానికి పరస్పర అంగీకారంతో కొంతకాలం విడిగా ఉండవచ్చు. ఆ తర్వాత మళ్లీ ఒక్కటిగా ఉండండి;[b] మీకు ఆత్మనిగ్రహం లేకపోవడం వల్ల సాతాను మిమ్మల్ని శోధించకుండా ఉండేందుకు ఇలా చేయండి.
  to: ఒకరికొకరు ఇవ్వవలసినదాన్ని నిలిపివేయకండి.[a] అయితే, ప్రార్థనకు మిమ్మల్ని మీరు అంకితం చేసుకోవడానికి పరస్పర సమ్మతితో కొంతకాలం మాత్రమే అలా చేయవచ్చు. ఆ తర్వాత మళ్లీ కలిసి ఉండండి;[b] మీకు ఆత్మనిగ్రహం లేకపోవడం వల్ల సాతాను మిమ్మల్ని శోధించకుండా ఉండేందుకు.
  rationale: సవరణ మూలపాఠంలోని పరోక్ష దాంపత్య భాషను కాపాడుతూ, ‘హక్కు’ వంటి మూలంలో లేని భావాన్ని మరియు ‘విడిగా ఉండడం’ వంటి అతిగా నిర్దిష్టమైన అర్థాన్ని తొలగిస్తుంది. చివరి ఉద్దేశ్య వాక్యాన్ని మళ్లీ కలిసి ఉండాలనే ఆజ్ఞతో నేరుగా అనుసంధానించింది.
