id: 1CO.7.5
reference: 1 Corinthians 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: te
  text: ఒకరికొకరు ఇవ్వవలసినదాన్ని నిలిపివేయకండి.[a] అయితే, ప్రార్థనకు మిమ్మల్ని మీరు అంకితం చేసుకోవడానికి పరస్పర సమ్మతితో కొంతకాలం మాత్రమే అలా చేయవచ్చు. ఆ తర్వాత మళ్లీ కలిసి ఉండండి;[b] మీకు ఆత్మనిగ్రహం లేకపోవడం వల్ల సాతాను మిమ్మల్ని శోధించకుండా ఉండేందుకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకరికొకరు చెందవలసినదాన్ని ఎగ్గొట్టకండి.”
    reason: ἀποστερεῖτεకు ‘ఎగ్గొట్టడం/నిలిపివేయడం’ అనే భావం ఉంది; దాంపత్య సందర్భంలో ఒక జీవిత భాగస్వామి మరొకరికి ఇవ్వవలసినదాన్ని నిలిపివేయడాన్ని సూచిస్తుంది.
  - marker: b
    text: అక్షరార్థంగా, “మళ్లీ కలిసి ఉండండి”; ఇది భార్యాభర్తలుగా దాంపత్య జీవితం తిరిగి కొనసాగించడాన్ని సూచిస్తుంది.
    reason: గ్రీకు పదబంధంలోని పరోక్షతను నిలుపుతూ సందర్భార్థాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: దాంపత్య హక్కును నిరాకరించకండి
  rationale: ఈ సందర్భంలో జీవిత భాగస్వామికి చెందవలసిన దాంపత్య సంబంధాన్ని నిలిపివేయడాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు భావం స్పష్టంగా ఉండేందుకు సందర్భార్థాన్ని తెలిపే ‘దాంపత్య హక్కు’ను ఉపయోగించాం.
- source_word: ἀλλήλους
  choice: ఒకరికొకరు
  rationale: ఆజ్ఞ భార్యాభర్తలిద్దరికీ పరస్పరంగా వర్తిస్తుందనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: εἰ μήτι ἂν ἐκ συμφώνου
  choice: అయితే ... పరస్పర అంగీకారంతో ... ఉండవచ్చు
  rationale: ఇది కఠినమైన మినహాయింపుకన్నా, ఇద్దరి సమ్మతితో సాధ్యమయ్యే పరిమిత మినహాయింపును సూచిస్తుంది. ‘ఉండవచ్చు’ ఆ అర్హతతో కూడిన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸς καιρόν
  choice: కొంతకాలం
  rationale: కాలపరిమితి ఉన్న తాత్కాలిక విరామాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: σχολάσητε τῇ προσευχῇ
  choice: ప్రార్థనకు మిమ్మల్ని మీరు అంకితం చేసుకోవడానికి
  rationale: ప్రార్థన కోసం ఉద్దేశపూర్వకంగా సమయం, శ్రద్ధ కేటాయించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: ఆ తర్వాత మళ్లీ ఒక్కటిగా ఉండండి
  rationale: గ్రీకు వాక్యంలోని వినయపూర్వక పరోక్షతను నిలుపుతూ, దాంపత్య సహజీవనాన్ని తిరిగి కొనసాగించాలనే సందర్భార్థాన్ని అందిస్తుంది.
- source_word: πειράζῃ
  choice: శోధించకుండా
  rationale: సాతాను పాపానికి ప్రలోభపెట్టే భావంలో ఈ క్రియ వాడబడింది; తెలుగు బైబిలు శైలిలో ‘శోధించు’ ఆ భావాన్ని గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: Σατανᾶς
  choice: సాతాను
  rationale: వ్యక్తిగత నామాన్ని తెలుగులో స్థిరపడిన రూపంలో లిప్యంతరీకరించాం.
- source_word: ἀκρασίαν
  choice: ఆత్మనిగ్రహం లేకపోవడం
  rationale: తన కోరికలను అదుపులో ఉంచుకోలేని స్థితిని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πάλιν ἐπὶ τὸ αὐτὸ ἦτε దాంపత్య శారీరక సంబంధాన్ని స్పష్టంగా చెప్పాలా, లేక పరోక్షంగా ఉంచాలా?
  choice: ‘మళ్లీ ఒక్కటిగా ఉండండి’ అని పరోక్షంగా అనువదించాం.
  alternative: ‘మళ్లీ దాంపత్య సంబంధం కలిగి ఉండండి’ అని స్పష్టంగా చెప్పడం.
  rationale: సందర్భం శారీరక దాంపత్య సంబంధాన్ని సూచించినప్పటికీ, మూలపాఠం దానిని వినయపూర్వకంగా పరోక్షంగా చెబుతుంది. అనువాదంలో కూడా ఆ పరోక్షతను నిలిపాం.
- issue: ὁ Σατανᾶς వ్యక్తిగత నామమా, సాధారణంగా ‘విరోధి’ అనే బిరుదా?
  choice: వ్యక్తిగత నామంగా ‘సాతాను’ అని అనువదించాం.
  alternative: ‘విరోధి’ అని సాధారణీకరించడం.
  rationale: ఇక్కడ పౌలు ఒక వ్యక్తిగత దుష్ట సత్తాను సూచిస్తున్నాడు; నామాన్ని లిప్యంతరీకరించడం మూలార్థాన్ని నేరుగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే దాంపత్య పదజాలం వాడబడింది. మూలంలోని పరస్పరత్వం, తాత్కాలికత, వినయపూర్వక పరోక్షత నిలుపబడ్డాయి.
