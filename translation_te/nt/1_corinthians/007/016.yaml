  to: ఎందుకంటే, భార్యా, నీవు నీ భర్తను రక్షిస్తావో లేదో నీకెలా తెలుసు[a]? లేదా, భర్తా, నీవు నీ భార్యను రక్షిస్తావో లేదో నీకెలా తెలుసు?
