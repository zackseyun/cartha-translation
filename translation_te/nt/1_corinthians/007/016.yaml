id: 1CO.7.16
reference: 1 Corinthians 7:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: te
  text: ఎందుకంటే, భార్యా, నీవు నీ భర్తను రక్షిస్తావో లేదో నీకెలా తెలుసు[a]? లేదా, భర్తా, నీవు నీ భార్యను రక్షిస్తావో లేదో నీకెలా తెలుసు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత వాడుక తెలుగులో: “నీవు నీ భర్తను రక్షించగలవో లేదో నీకెలా తెలుస్తుంది?” గ్రీకులో పరోక్ష ప్రశ్నలో భవిష్యత్ కాల క్రియారూపం (“రక్షిస్తావు”) ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: ఎందుకంటే ... నీకెలా తెలుసు?
  rationale: τί + οἶδας అనే అలంకారిక ప్రశ్నను సహజమైన తెలుగులో ‘నీకెలా తెలుసు?’ అని ఇచ్చాం; γάρ యొక్క ముందటి సందర్భాన్ని ఆధారపరిచే భావాన్ని ‘ఎందుకంటే’ నిలుపుతుంది.
- source_word: γύναι
  choice: భార్యా
  rationale: γυνή అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు; వివాహ సందర్భం వల్ల ఇక్కడ ‘భార్యా’ సముచితం.
- source_word: ἄνερ
  choice: భర్తా
  rationale: ἀνήρ అనే పదానికి ‘పురుషుడు’ లేదా ‘భర్త’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ సంబోధనతో కూడిన వివాహ సందర్భం ‘భర్తా’ను కోరుతుంది.
- source_word: σώσεις
  choice: రక్షిస్తావు
  rationale: భవిష్యత్ సూచక క్రియారూపాన్ని నేరుగా నిలిపాం. ‘రక్షిస్తావో లేదో’ అనే పరోక్ష ప్రశ్న దీనిని ఖచ్చితమైన ప్రవచనంగా కాక, పరిశీలనలో ఉన్న సాధ్యతగా వ్యక్తపరుస్తుంది.
- source_word: τὸν ἄνδρα / τὴν γυναῖκα
  choice: నీ భర్తను / నీ భార్యను
  rationale: గ్రీకు నిర్దిష్ట ఉపపదం సందర్భంలోని జీవిత భాగస్వామిని సూచిస్తుంది; సహజమైన తెలుగులో సంబంధాన్ని ‘నీ’ అనే స్వామ్యరూపంతో స్పష్టం చేశాం.
- source_word: ἢ
  choice: అలాగే
  rationale: రెండు సమాంతర అలంకారిక ప్రశ్నలలో రెండవదాన్ని సహజంగా అనుసంధానిస్తుంది; గ్రీకు ἢ యొక్క ప్రత్యామ్నాయ/సమాంతర బంధాన్ని తెలుగులో కఠినంగా కాక ప్రవాహవంతంగా అందిస్తుంది.
theological_decisions:
- issue: వివాహ సందర్భంలో ‘రక్షించు’ అనే పదం అర్థం
  choice: ‘రక్షిస్తావు’ అనే పదాన్నే నిలుపుకోవడం
  alternative: విశ్వాసంలోకి నడిపిస్తావు; వివాహాన్ని కాపాడతావు; ఆధ్యాత్మికంగా మేలు చేస్తావు
  rationale: σῴζω అనే పదంలోని రక్షణ సంబంధమైన బలాన్ని తగ్గించకుండా నిలిపాం. దానిని వివాహ పరిరక్షణకో, విశ్వాసంలోకి నడిపించడానికో మాత్రమే పరిమితం చేయకుండా, పాఠంలోని వేదాంతపరమైన ఉద్వేగాన్ని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే ఏకవచన సంబోధనను వాడాం. సమాంతర వాక్య నిర్మాణాన్ని కాపాడాం; ‘రక్షించు’ అనే మూలపదాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించలేదు.
