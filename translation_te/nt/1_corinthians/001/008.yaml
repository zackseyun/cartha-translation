  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: te
  text: మన ప్రభువైన యేసు మెస్సీయ[c] యొక్క దినాన మీరు నిందారహితులుగా[b] ఉండేలా, ఆయన మిమ్మల్ని అంతం వరకు స్థిరపరుస్తాడు కూడా[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దృఢపరుస్తాడు’ లేదా ‘బలపరుస్తాడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నిందారోపణకు తావులేనివారుగా’ లేదా ‘అభియోగం లేనివారుగా.’
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో ‘క్రీస్తు’; ఆ బిరుదు అర్థాన్ని నిలుపడానికి ఇక్కడ ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: స్థిరపరుస్తాడు
  rationale: ఎవరినైనా దృఢంగా, స్థిరంగా నిలిపే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ‘ధృవపరుస్తాడు’ అనే ప్రత్యామ్నాయం సాక్ష్యంతో నిజమని నిరూపించే భావాన్ని సూచించవచ్చు.
- source_word: ἕως τέλους
  choice: అంతం వరకు
  rationale: కాలవ్యవధి అంతిమ బిందువు వరకు కొనసాగుతుందనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀνεγκλήτους
  choice: నిందారహితులుగా
  rationale: ఆరోపణకు లేదా అభియోగానికి తావులేని స్థితిని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది; న్యాయపరమైన సూక్ష్మభావం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: దినంలో
  rationale: అంతిమ తీర్పుతో సంబంధం ఉన్న ‘దినం’ అనే బైబిలు ప్రయోగాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος బిరుదుకు ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός అనే బిరుదులోని ‘అభిషిక్తుడు/మెస్సీయ’ భావాన్ని ఇంటిపేరులా కాకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: καί
  choice: అంతేకాక
  rationale: ముందటి వాక్యంతో ఉన్న అదనపు సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ὃς (‘ఆయన’) ఎవరిని సూచిస్తుంది?
  choice: 7వ వచనంలోని ‘మన ప్రభువైన యేసు మెస్సీయ’ను సూచించే ‘ఆయన’
  alternative: ముందటి సందర్భంలో ప్రస్తావించబడిన దేవుణ్ణి విస్తృతంగా సూచించవచ్చు
  rationale: వ్యాకరణపరంగా అత్యంత సమీపంలోని పుంలింగ ఏకవచన పూర్వపదం ‘మన ప్రభువైన యేసు మెస్సీయ’; అందువల్ల ప్రధాన పాఠ్యంలో ‘ఆయన’ అని అనువదించబడింది.
- issue: ἀνεγκλήτους యొక్క భావం
  choice: నిందారహితులుగా
  alternative: నిందారోపణకు తావులేనివారుగా / అభియోగం లేనివారుగా
  rationale: ఈ పదంలో నైతిక నిర్దోషిత్వంతో పాటు అభియోగానికి గురికాని న్యాయపరమైన ఛాయ కూడా ఉంది; ప్రధాన పాఠ్యం సంక్షిప్తంగా ఉండేందుకు ‘నిందారహితులుగా’ ఎంచుకుని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ఫలితసంబంధాన్ని సహజంగా తెలియజేయడానికి ‘ఉండేలా’ వాడబడింది; ‘అంతేకాక’ ద్వారా καί యొక్క సందర్భసంబంధం నిలుపబడింది.
