  to: జ్ఞాని ఎక్కడ? శాస్త్రి ఎక్కడ? ఈ యుగపు వాదకుడు ఎక్కడ?[a] దేవుడు లోకపు జ్ఞానాన్ని మూర్ఖత్వంగా చేయలేదా?[b]
