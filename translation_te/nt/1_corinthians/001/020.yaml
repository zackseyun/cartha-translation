id: 1CO.1.20
reference: 1 Corinthians 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: te
  text: జ్ఞాని ఎక్కడ? శాస్త్రి ఎక్కడ? ఈ యుగపు వాదకుడు ఎక్కడ?[a] దేవుడు లోకపు జ్ఞానాన్ని మూర్ఖత్వంగా చేయలేదా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈ యుగపు’ అని అనువదించిన గ్రీకు పదం, తరువాత ‘లోకపు’ అని అనువదించిన పదానికి భిన్నమైనది.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘లోకపు జ్ఞానం మూర్ఖత్వమని దేవుడు చూపించలేదా?’
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: ఎక్కడ?
  rationale: తరువాతి నామవాచకాలతో కలిసి సవాలు చేసే అలంకారిక ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σοφός
  choice: జ్ఞాని
  rationale: పుంలింగ ఏకవచన రూపాన్ని సంక్షిప్తంగా నిలుపుతూ, ఒక వర్గానికి ప్రాతినిధ్యంగా కూడా సహజంగా అర్థమవుతుంది.
- source_word: γραμματεύς
  choice: శాస్త్రి
  rationale: చారిత్రకంగా ధర్మశాస్త్ర పరిజ్ఞానం గల లేఖకుడు లేదా బోధకుడు అనే భావాన్ని నిలుపుతుంది; కేవలం ఆధునిక ‘పండితుడు’గా విస్తరించదు.
- source_word: συζητητής
  choice: వాదకుడు
  rationale: చర్చలో వాదించే వ్యక్తి అనే భావాన్ని ఆధునిక, స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: τοῦ αἰῶνος τούτου
  choice: ఈ యుగపు
  rationale: αἰώνను ‘యుగం’గా అనువదించి, తరువాతి κόσμος (‘లోకం’) నుండి పదభేదాన్ని కాపాడుతుంది.
- source_word: οὐχὶ
  choice: చేయలేదా?
  rationale: అవును అనే సమాధానాన్ని ఆశించే గ్రీకు అలంకారిక ప్రశ్న స్వరాన్ని తెలుగులో నిలుపుతుంది.
- source_word: ἐμώρανεν
  choice: వెర్రితనంగా చేశాడు
  rationale: క్రియలోని కారణార్థక బలాన్ని నేరుగా నిలుపుతుంది; ‘వెర్రితనమని చూపించాడు’ అనే అర్థసంభావ్యతను పాదసూచికలో ఇస్తుంది.
- source_word: σοφίαν
  choice: జ్ఞానాన్ని
  rationale: ఇక్కడ లోకం తనదిగా చెప్పుకునే జ్ఞానాన్ని సూచించే ప్రామాణిక సమానార్థకం.
- source_word: κόσμου
  choice: లోక
  rationale: κόσμοςకు సహజమైన తెలుగు రూపం; αἰώνకు వాడిన ‘యుగం’తో కలపకుండా మూలంలోని భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఒకే వచనంలో αἰών మరియు κόσμος మధ్య భేదం
  choice: αἰώνను ‘యుగం’గా, κόσμοςను ‘లోకం’గా అనువదించడం
  alternative: రెండింటినీ ‘లోకం/ప్రపంచం’గా అనువదించడం
  rationale: పౌలు రెండు వేర్వేరు గ్రీకు పదాలను వాడాడు. ప్రస్తుత యుగానికీ లోక జ్ఞానానికీ మధ్య మూలపాఠంలోని భావభేదాన్ని అనువాదం కాపాడుతుంది.
- issue: ἐμώρανεν యొక్క కారణార్థకత మరియు ప్రకటనార్థక అవకాశము
  choice: ‘వెర్రితనంగా చేశాడు’ అనే నేర కారణార్థక అనువాదం
  alternative: ‘వెర్రితనమని చూపించాడు’
  rationale: మూల క్రియ యొక్క సాధారణ కారణార్థక బలాన్ని ప్రధాన పాఠంలో ఉంచి, దేవుడు లోక జ్ఞానం నిజంగా ఏమిటో బయలుపరచాడనే సాధ్యమైన భావాన్ని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; అలంకారిక ప్రశ్నల సంక్షిప్తతను, గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. ‘శాస్త్రి’ చారిత్రక పదాన్ని నిలుపుతుంది; ‘వాదకుడు’ సహజమైన ఆధునిక రూపం.
