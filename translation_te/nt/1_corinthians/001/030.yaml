id: 1CO.1.30
reference: 1 Corinthians 1:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: te
  text: కానీ, ఆయన నుండే మీరు మెస్సీయ యేసులో ఉన్నారు; ఆయన దేవుని నుండి మనకు జ్ఞానంగా, నీతిగా[a], పరిశుద్ధీకరణగా, విమోచనగా అయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘న్యాయం’ అని కూడా అనువదించవచ్చు.
    reason: δικαιοσύνηకు సందర్భానుసారం ‘నీతి’తో పాటు ‘న్యాయం’ అనే అర్థం కూడా ఉండగలదని తెలియజేయడానికి.
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: ఆయన మూలంగానే
  rationale: ἐξ మూలాన్ని లేదా ఉద్భవాన్ని సూచిస్తుంది. ‘మూలంగానే’ అనే రూపం విశ్వాసులు మెస్సీయ యేసులో ఉండడం దేవుని నుండే కలిగిందనే పౌలు ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: ἐν యొక్క పౌలీయ ‘లో’ భాషను అతిగా వివరణ చేయకుండా నిలుపుతూ, Χριστόςను దాని బిరుదు భావంతో ‘మెస్సీయ’గా అనువదిస్తుంది.
- source_word: ἐγενήθη
  choice: అయ్యారు
  rationale: γίνομαιకు సహజమైన తెలుగు సమానార్థకం; మెస్సీయ మన కోసం ఏమిగా అయ్యారో తెలిపే భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: σοφία
  choice: జ్ఞానం
  rationale: లోక జ్ఞానానికి దేవుని జ్ఞానాన్ని ఎదురుగా ఉంచే సమీప సందర్భానికి సరిపోయే నేర అనువాదం.
- source_word: ἀπὸ θεοῦ
  choice: దేవుని నుండి
  rationale: దేవుడే మూలమనే భావాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: δικαιοσύνη
  choice: నీతి
  rationale: పౌలు రక్షణ సంబంధ వాదనలో సహజంగా సరిపడే ప్రధాన తెలుగు పదం; ‘న్యాయం’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἁγιασμός
  choice: పరిశుద్ధీకరణ
  rationale: పరిశుద్ధంగా చేయబడడం లేదా దేవునికి ప్రత్యేకపరచబడడం అనే ప్రక్రియ/స్థితి భావాన్ని నిలుపుతుంది.
- source_word: ἀπολύτρωσις
  choice: విమోచనం
  rationale: బంధం నుండి విడుదల మరియు రక్షణ అనే పదంలోని భావపరిధిని సహజమైన ఆధునిక తెలుగు ధార్మిక పదంతో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘దేవుని నుండి జ్ఞానం’ అనే పదబంధానికి తరువాతి మూడు నామవాచకాలతో ఉన్న సంబంధం
  choice: ‘దేవుని నుండి’ అన్నదాన్ని ‘జ్ఞానం’తో నేరుగా ఉంచి, నీతి, పరిశుద్ధీకరణ, విమోచనం అనే పదాలను అదే వరుసలో కొనసాగించాం.
  alternative: ‘దేవుని నుండి’ అన్నది నాలుగు అంశాలన్నిటినీ సమానంగా విశేషిస్తుందని స్పష్టంగా పునర్నిర్మించడం; లేదా తరువాతి మూడు పదాలను జ్ఞానానికి వివరణగా విరామచిహ్నాలతో చూపించడం.
  rationale: గ్రీకు వాక్య నిర్మాణం ఈ సంబంధాన్ని పూర్తిగా నిర్ధారించదు. తెలుగు పదక్రమం ‘దేవుని నుండి’ అనే మాటను జ్ఞానంతో సన్నిహితంగా ఉంచుతూనే, మొత్తం జాబితాపై దాని విస్తృత వర్తింపును కూడా నిరోధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన క్రియారూపాలు ఉపయోగించాం. వాక్యాన్ని సులభంగా చదవడానికి రెండు వాక్యాలుగా విభజించినా, మూలంలోని కారణ-సంబంధం మరియు సమాంతర నామవాచకాల వరుసను నిలిపాం.
