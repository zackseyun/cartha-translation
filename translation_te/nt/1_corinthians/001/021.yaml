  naturalness: ‘ఎందుకంటే … కాబట్టి’ స్థానంలో ‘ఎందుకంటే … కాబట్టి’లోని రెండవ కారణసూచకాన్ని తొలగించడం ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యాన్ని ఇస్తుంది. ‘ప్రకటనలోని మూర్ఖత్వం’ κηρύγματος యొక్క ప్రకటిత-సందేశ భావాన్ని నిలుపుతూనే, ప్రకటనా కార్యంతో ఉన్న సంభావ్య ప్రతిధ్వనిని మూసివేయదు.
