id: 1CO.1.21
reference: 1 Corinthians 1:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: te
  text: ఎందుకంటే, దేవుని జ్ఞానంలో లోకం జ్ఞానం ద్వారా దేవుణ్ణి తెలుసుకోనందున, ప్రకటనలోని[a] మూర్ఖత్వం[b] ద్వారా విశ్వసించేవారిని రక్షించడం దేవునికి ఇష్టమైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బోధించడం అనే మూర్ఖత్వం ద్వారా.”
    reason: κήρυγμα ప్రధానంగా ప్రకటించబడిన సందేశాన్ని సూచించవచ్చు; ప్రకటించే కార్యం అనే అర్థం కూడా సాధ్యమే.
  - marker: b
    text: అంటే, ప్రకటించబడిన సందేశంలో లోకం మూర్ఖత్వంగా భావించేది.
    reason: ‘మూర్ఖత్వం’ అనేది దేవుని తీర్పు కాదని, లోకపు దృష్టిని ప్రతిబింబించే పౌలు వ్యంగ్య ప్రయోగమని స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: ఎందుకంటే ... కాబట్టి
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని, ἐπειδή యొక్క కారణార్థాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో కలిపి వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: దేవుని జ్ఞానంలో
  rationale: ἐν అనే విభక్తి సూచించే పరిధి లేదా ఏర్పాటు అనే భావాన్ని నిలుపుతూ, ‘దేవుని జ్ఞానం వల్ల’ అని సాధనార్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: οὐκ ἔγνω
  choice: తెలుసుకోలేదు
  rationale: γινώσκωలోని జ్ఞాన సంబంధమైనదీ, వ్యక్తిగత సంబంధమైనదీ అయిన విస్తృతిని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ὁ κόσμος
  choice: లోకం
  rationale: పౌలు వాడుకలో మానవాళిని దాని లోకసంబంధ వ్యవస్థతో సహా సూచించే ప్రామాణికమైన, సంక్షిప్త పదం.
- source_word: διὰ τῆς σοφίας
  choice: జ్ఞానం ద్వారా
  rationale: διάతో కూడిన షష్ఠీ విభక్తి తెలిపే సాధన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘తన జ్ఞానం’ అని మూలంలో లేని స్వామ్య భావాన్ని చేర్చదు.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: దేవునికి ఇష్టమైంది
  rationale: కేవలం ‘నిర్ణయించాడు’ అనే భావం కంటే దేవుని సంతోషపూర్వక సంకల్పాన్ని నిలుపుతూ సహజమైన తెలుగులో ఉంది.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: ప్రకటనలోని వెర్రితనం ద్వారా
  rationale: κήρυγμα ప్రధానంగా ప్రకటించబడిన సందేశాన్ని సూచించినా, ప్రకటించే కార్యాన్ని కూడా సూచించగల ఉద్రిక్తతను ‘ప్రకటన’ నిలుపుతుంది. μωρία యొక్క ఉద్దేశపూర్వకంగా కఠినమైన వ్యంగ్యాన్ని ‘వెర్రితనం’ వ్యక్తం చేస్తుంది.
- source_word: σῶσαι
  choice: రక్షించడం
  rationale: σῴζωకు ప్రామాణికమైన రక్షణార్థక అనువాదం; పౌలు వాడే ధార్మిక విస్తృతిని నిలుపుతుంది.
- source_word: τοὺς πιστεύοντας
  choice: విశ్వసించేవారిని
  rationale: వర్తమాన కృదంతం యొక్క నామవాచక ప్రయోగాన్ని సహజంగా తెలుపుతుంది; మూలం కంటే బలమైన సిద్ధాంతార్థాన్ని చేర్చదు.
theological_decisions:
- issue: διὰ τῆς μωρίας τοῦ κηρύγματος యొక్క అర్థం
  choice: ప్రధానంగా వెర్రితనంగా పరిగణించబడే ప్రకటిత సందేశం; అయితే ప్రకటించే కార్యం అనే భావాన్నీ పూర్తిగా తొలగించలేదు
  alternative: వెర్రితనంగా కనిపించే బోధనా కార్యం లేదా పద్ధతి మాత్రమే
  rationale: κήρυγμα సాధారణంగా ప్రకటించబడిన విషయాన్ని సూచిస్తుంది; అయినా ఈ సందర్భంలో బహిరంగ ప్రకటన కార్యం కూడా ప్రతిధ్వనించవచ్చు. ‘ప్రకటన’ అనే పదం ఈ రెండు కోణాలను కొంతవరకు నిలుపుతుంది. వెర్రితనం దేవుని దృష్టిలోనిదని కాక, లోకపు అంచనాలోనిదని గమనిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని దీర్ఘ కారణ వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా చేయడానికి ‘ఎందుకంటే ... కాబట్టి’ నిర్మాణం వాడబడింది. ‘దేవుని జ్ఞానంలో’ అనే కొద్దిగా అసాధారణమైన పదబంధం ἐν యొక్క నిజమైన భావసందిగ్ధతను కాపాడటానికి ఉద్దేశపూర్వకంగా నిలుపబడింది.
