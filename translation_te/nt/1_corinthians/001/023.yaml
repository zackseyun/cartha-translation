  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ κηρύσσομεν Χριστὸν ἐσταυρωμένον, Ἰουδαίοις μὲν σκάνδαλον ⸀ἔθνεσιν δὲ μωρίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: te
  text: కాని మేము సిలువవేయబడిన మెస్సీయను[a] ప్రకటిస్తున్నాము—ఆయన యూదులకు తడబడే రాయి, యూదేతరులకు మూర్ఖత్వం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సిలువవేయబడిన క్రీస్తును.”
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో “జనాలకు”; ఇక్కడ యూదులకు భిన్నంగా యూదేతరులను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: ప్రకటిస్తున్నాం
  rationale: బహిరంగంగా సందేశాన్ని చాటే దూతసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: Χριστόν
  choice: మెస్సీయను
  rationale: ఇక్కడ ఇది కేవలం పేరులా కాక, ప్రకటించబడుతున్న యేసు యొక్క బిరుదుగా పనిచేస్తుంది.
- source_word: ἐσταυρωμένον
  choice: సిలువ వేయబడిన
  rationale: పరిపూర్ణ కర్మణి అసమాపక క్రియ భావాన్ని సంక్షిప్తంగా నిలుపుతూ, సిలువ మరణం మరియు దాని కొనసాగుతున్న ప్రాముఖ్యతను సూచిస్తుంది.
- source_word: Ἰουδαίοις
  choice: యూదులకు
  rationale: యూదులు–యూదేతరులు అనే వాక్యంలోని జాతి-మతపరమైన వ్యత్యాసాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: σκάνδαλον
  choice: అడ్డురాయి
  rationale: పడిపోవడానికి కారణమయ్యే దాని రూపకాన్ని ‘అభ్యంతరం’ వంటి సారాంశ పదం కంటే స్పష్టంగా కాపాడుతుంది.
- source_word: ἔθνεσιν
  choice: యూదేతరులకు
  rationale: మూలపదానికి ‘జనాలు/దేశాలు’ అనే విస్తృత అర్థం ఉన్నప్పటికీ, ఇక్కడ యూదులతో ఉన్న ప్రత్యక్ష వ్యత్యాసాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μωρίαν
  choice: వెర్రితనం
  rationale: ఈ అధ్యాయంలో లోకం దేవుని సందేశాన్ని బుద్ధిహీనమైనదిగా భావించే అంశాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Χριστόςను బిరుదుగా అనువదించాలా, పేరులా లిప్యంతరీకరించాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: అపొస్తలుల ప్రకటనలో యేసు యొక్క మెస్సీయ గుర్తింపే ఇక్కడ ప్రధానంగా ఉండటం వల్ల బిరుదు భావాన్ని ముందుకు తెచ్చాం; సంప్రదాయ రూపాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రకటన శైలి. మూలంలోని సంక్షిప్త విరుద్ధ నిర్మాణాన్ని డాష్ ద్వారా స్పష్టపరిచాం; ‘అడ్డురాయి’ రూపకాన్ని, మెస్సీయ బిరుదును నిలిపాం.
