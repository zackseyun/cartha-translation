  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: te
  text: దేవుని చిత్తప్రకారం మెస్సీయ యేసు[a] అపొస్తలునిగా పిలువబడిన పౌలు, మరియు మన సహోదరుడు సోస్తెనేసు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు యేసు.”
    reason: Χριστός అనే గ్రీకు బిరుదుకు తెలుగులో స్థిరపడిన ప్రత్యామ్నాయ రూపం.
lexical_decisions:
- source_word: Παῦλος
  choice: పౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: κλητὸς ἀπόστολος
  choice: అపొస్తలునిగా పిలువబడిన
  rationale: κλητός పౌలు అపొస్తలుడిగా పొందిన పిలుపును సూచిస్తుంది; తెలుగులో సహజంగా ఉండేందుకు సంబంధాన్ని క్రియాత్మకంగా వ్యక్తం చేశాం.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστός ఇక్కడ యేసు యొక్క అభిషిక్త రాజు అనే బిరుదు భావాన్ని కలిగి ఉంది; పదక్రమాన్ని కూడా నిలిపాం.
- source_word: διὰ θελήματος θεοῦ
  choice: దేవుని చిత్తప్రకారం
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ పౌలు పొందిన పిలుపుకు దేవుని చిత్తమే ఆధారమని తెలియజేస్తుంది; ఇది సహజమైన తెలుగు రూపం.
- source_word: Σωσθένης
  choice: సోస్తెనేసు
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: ὁ ἀδελφὸς
  choice: మన సహోదరుడు
  rationale: మూలంలో స్వామ్యసర్వనామం లేకపోయినా, పత్రికా పరిచయంలోని నిర్దిష్ట పదబంధం సమాజ సంబంధాన్ని సూచిస్తుంది; ‘మన సహోదరుడు’ తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: పౌలు పరిచయంలో Χριστός అనువాదం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఇక్కడ Χριστός కేవలం పేరులో భాగంలా కాక యేసు యొక్క మెస్సీయ పదవిని సూచించే బిరుదుగా చదవవచ్చు. స్థిరపడిన ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: κλητὸς మరియు అపొస్తలత్వం మధ్య సంబంధం
  choice: అపొస్తలునిగా పిలువబడిన
  alternative: పిలువబడిన అపొస్తలుడు
  rationale: ‘అపొస్తలునిగా’ అనే రూపం పిలుపు ఆయన అపొస్తలత్వానికి సంబంధించినదని స్పష్టం చేస్తుంది; మూలంలో లేని కాలసూచన లేదా అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే పత్రికా శైలిని వాడాం. వాక్యం తదుపరి వచనంలో కొనసాగుతుంది కాబట్టి చివర కామాను నిలిపాం.
