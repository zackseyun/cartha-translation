id: 1CO.1.3
reference: 1 Corinthians 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: te
  text: మన తండ్రియైన దేవుని నుండీ, ప్రభువైన యేసు మెస్సీయ[a] నుండీ మీకు కృప, శాంతి కలుగుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ప్రభువైన యేసు క్రీస్తు.”'
    reason: Χριστός అనే గ్రీకు బిరుదుకు సుపరిచితమైన సంప్రదాయ తెలుగు రూపాంతరాన్ని సూచించే పదప్రత్యామ్నాయం.
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు పత్రికల అభివందనంలో ఉన్న దైవానుగ్రహ భావాన్ని, దాని స్థిరమైన ధార్మిక ప్రాధాన్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: ఆశీర్వాదపూర్వక పత్రికా శైలిలోని దత్తివిభక్తిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: సంబంధపరమైన సమాధానాన్నీ సంపూర్ణ క్షేమాన్నీ సూచించగల స్థిరమైన తెలుగు పదం.
- source_word: ἀπὸ
  choice: నుండీ
  rationale: కృపకూ శాంతికీ మూలాన్ని స్పష్టంగా సూచిస్తుంది; రెండు సమన్విత నామపదబంధాలతో తెలుగు వాక్యంలో సహజంగా పునరుక్తి చేయబడింది.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: మన తండ్రియైన దేవుడు
  rationale: గ్రీకు పదబంధంలోని అన్వయాన్ని ‘మన తండ్రియైన దేవుడు’ అనే సహజమైన తెలుగు నిర్మాణంతో నిలుపుతుంది; ‘మన దేవుడూ తండ్రీ’ అనే భిన్న నిర్మాణాన్ని సూచించదు.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος అనే బిరుదు యొక్క అధికారాన్నీ ధార్మిక బలాన్నీ కాపాడే ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్న భావాన్ని ‘మెస్సీయ’ ద్వారా అనువదిస్తుంది; సుపరిచితమైన ‘యేసు క్రీస్తు’ రూపాన్ని పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
theological_decisions:
- issue: కృప, శాంతి రెండూ తండ్రియైన దేవుని నుండీ యేసు ప్రభువు నుండీ వస్తున్నాయని తెలిపే ఉమ్మడి మూలసంబంధాన్ని ఎలా నిలుపాలి?
  choice: రెండు సమన్విత పదబంధాలకూ ‘నుండీ’ వాడి, అవి రెండూ ఒకే ఆశీర్వాదానికి మూలాలని స్పష్టపరచడం.
  alternative: గ్రీకులో ఉన్న ఒక్క ἀπόకు అనుగుణంగా మొదటి పదబంధం ముందు మాత్రమే ‘నుండి’ ఉంచడం.
  rationale: గ్రీకులో ఒక్క ἀπό రెండు వ్యక్తులను ఒకే సమన్వయంలో ఉంచుతుంది. తెలుగులో ‘నుండీ ... నుండీ’ అనే నిర్మాణం ఆ ఉమ్మడి సంబంధాన్ని సహజంగా, సిద్ధాంతపరమైన అదనపు వివరణ లేకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా-ఆశీర్వాద శైలి. మూలంలో వ్యక్తమైన ఆశీర్వాద భావాన్ని తెలుగులో పూర్తిచేయడానికి ‘కలుగుగాక’ చేర్చబడింది. ‘నుండీ’ రూపం సమన్విత మూలాలను సహజంగా కలుపుతుంది.
