revisions:
- from: 'కొరింథులో ఉన్న దేవుని సంఘానికి—అంటే, మెస్సీయ అయిన యేసులో పవిత్రపరచబడి[a], పరిశుద్ధులుగా ఉండడానికి పిలువబడినవారికి[b]—ప్రతి స్థలంలో మన ప్రభువైన యేసు మెస్సీయ[c] నామాన్ని ప్రార్థనలో పిలిచే వారందరితో పాటు, వారిదీ మనదీ అయిన ప్రతి స్థలంలో[d]:'
  to: 'కొరింథులో ఉన్న దేవుని సంఘానికి, అనగా మెస్సీయ అయిన యేసులో పరిశుద్ధపరచబడినవారై పరిశుద్ధులుగా పిలువబడినవారికి, వారికీ మనకూ చెందిన ప్రతి స్థలంలో మన ప్రభువైన యేసు మెస్సీయ నామాన్ని పిలుచుకునే వారందరితో కలిసి:'
  rationale: 'The verse is recast so that the single Greek locative phrase is represented once: ‘వారికీ మనకూ చెందిన ప్రతి స్థలంలో.’ The added specification ‘ప్రార్థనలో’ is removed to avoid overtranslation. The source’s appositional descriptions and its compressed ambiguity at αὐτῶν καὶ ἡμῶν are retained, with the latter explicitly documented in footnote d.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:11:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the principal elements of the Greek: God’s church in Corinth, sanctification in Messiah Jesus, the calling as holy people, invocation of the Lord Jesus Messiah’s name, and the compressed final genitives. However, repeating ‘ప్రతి స్థలంలో’ produces an unnecessary duplication, and ‘ప్రార్థనలో’ makes explicit a devotional nuance that is plausible but not lexically required by ἐπικαλουμένοις. The revision removes both problems while retaining the syntactic ambiguity in footnote d.'
  naturalness: The revised Telugu uses a smoother epistolary address and avoids the awkward sequence ‘ప్రతి స్థలంలో … వారిదీ మనదీ అయిన ప్రతి స్థలంలో.’ ‘పరిశుద్ధులుగా పిలువబడినవారు’ is natural modern Telugu and adequately represents κλητοῖς ἁγίοις without adding an infinitival purpose.
  terminology: ‘సంఘం,’ ‘పరిశుద్ధపరచబడిన,’ ‘పరిశుద్ధులు,’ and ‘ప్రభువు’ are appropriate standard biblical Telugu. ‘మెస్సీయ’ consistently renders Χριστός as a title; the established alternative ‘క్రీస్తు’ remains available in the relevant footnotes.
  issues:
  - severity: medium
    issue: The main text duplicates ‘ప్రతి స్థలంలో.’
    rationale: The Greek has one occurrence of ἐν παντὶ τόπῳ. The draft first translates it directly and then repeats it within ‘వారిదీ మనదీ అయిన ప్రతి స్థలంలో,’ making the Telugu cumbersome and potentially suggesting two separate locative phrases.
  - severity: low
    issue: ‘ప్రార్థనలో’ is more explicit than the Greek wording.
    rationale: Calling on the Lord’s name has an invocation/worship nuance, but ἐπικαλουμένοις itself does not specify the manner ‘in prayer.’ ‘నామాన్ని పిలుచుకునే’ preserves the biblical idiom without narrowing or expanding it.
  revised_text: 'కొరింథులో ఉన్న దేవుని సంఘానికి, అనగా మెస్సీయ అయిన యేసులో పరిశుద్ధపరచబడినవారై పరిశుద్ధులుగా పిలువబడినవారికి, వారికీ మనకూ చెందిన ప్రతి స్థలంలో మన ప్రభువైన యేసు మెస్సీయ నామాన్ని పిలుచుకునే వారందరితో కలిసి:'
  revised_footnotes:
