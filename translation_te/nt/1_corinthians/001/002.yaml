id: 1CO.1.2
reference: 1 Corinthians 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: te
  text: 'కొరింథులో ఉన్న దేవుని సంఘానికి, అనగా మెస్సీయ అయిన యేసులో పరిశుద్ధపరచబడినవారై పరిశుద్ధులుగా పిలువబడినవారికి, వారికీ మనకూ చెందిన ప్రతి స్థలంలో మన ప్రభువైన యేసు మెస్సీయ నామాన్ని పిలుచుకునే వారందరితో కలిసి:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: సంఘానికి
  rationale: దేవునికి చెందిన విశ్వాసుల సమాజాన్ని సూచించే సహజమైన, ప్రామాణిక తెలుగు పదం; ఇక్కడ కేవలం భవనాన్ని సూచించదు.
- source_word: ἡγιασμένοις
  choice: పవిత్రపరచబడి
  rationale: పూర్తయిన దైవిక కార్యం కొనసాగుతున్న ఫలితాన్ని కలిగి ఉందనే పరిపూర్ణ కర్మణి రూప భావాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ అయిన యేసులో
  rationale: ἐν అనే సంబంధాన్ని ‘లో’తో నిలుపుతూ, Χριστόςను వ్యక్తిపేరుగా మాత్రమే కాక అభిషిక్త రాజు అనే బిరుదుగా వ్యక్తపరుస్తుంది.
- source_word: κλητοῖς ἁγίοις
  choice: పరిశుద్ధులుగా ఉండడానికి పిలువబడినవారికి
  rationale: దేవుని పిలుపు మరియు ఆయనకు ప్రత్యేకించబడిన ప్రజల గుర్తింపు రెండింటినీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: నామాన్ని ప్రార్థనలో పిలిచే
  rationale: కేవలం పేరు ఉచ్చరించడం కాక, ఆరాధనతో ప్రభువును ఆశ్రయించి ప్రార్థించే గ్రీకు నుడికార భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: యేసుపట్ల అధికారాన్నీ ఆరాధనా ఒప్పుకోలునూ తెలియజేసే స్థిరమైన తెలుగు సమానార్థకం.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: వారిదీ మనదీ అయిన ప్రతి స్థలంలో
  rationale: సంక్షిప్తమైన గ్రీకు నిర్మాణాన్ని చదవదగిన తెలుగులో ఇస్తూ, దాని వాక్యనిర్మాణ అనిశ్చితిని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: Χριστός పదం బిరుదా, స్థిరనామ రూపమా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ అభివాదంలో యేసు అభిషిక్తుడు అనే బిరుదు భావం సజీవంగా ఉంది; అయినప్పటికీ సంప్రదాయ తెలుగు రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో అందించాం.
- issue: κλητοῖς ἁγίοις యొక్క సంబంధం
  choice: పరిశుద్ధులుగా ఉండడానికి పిలువబడినవారు
  alternative: పిలువబడిన పరిశుద్ధులు
  rationale: ప్రధాన పాఠం దేవుని పిలుపు భావాన్ని సహజంగా తెలియజేస్తుంది; గ్రీకులోని రెండు విశేషణాల మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచి ఉద్రిక్తతను నిలిపాం.
- issue: αὐτῶν καὶ ἡμῶν దేనిని విశేషిస్తుంది
  choice: ‘ప్రతి స్థలం’తో అనుసంధానం
  alternative: ‘ప్రభువు’తో అనుసంధానం—‘వారికీ మనకూ ప్రభువైన’
  rationale: ఈ పదాలు ‘ప్రతి స్థలం’ తర్వాత వెంటనే రావడం వల్ల ప్రధాన పాఠంలో స్థలంతో అనుసంధానించాం; అయితే గ్రీకు నిర్మాణం సంక్షిప్తంగా ఉండి మరో అనుసంధానానికి అవకాశం ఇస్తుంది కాబట్టి దాన్ని పాదటిప్పణిలో స్పష్టంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. సంఘం, ప్రభువు, పరిశుద్ధులు వంటి సుపరిచిత బైబిలు పదాలను నిలిపి, కఠినమైన గ్రీకు అన్వయాన్ని విరామచిహ్నాలు మరియు సంక్షిప్త పాదటిప్పణులతో వివరించాం.
