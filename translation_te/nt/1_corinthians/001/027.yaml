  - severity: low
    issue: ‘సిగ్గుపరచడానికి’ is somewhat less natural in modern standard Telugu.
    rationale: ‘సిగ్గుపడేలా చేయడానికి’ clearly and idiomatically expresses the purposive sense of καταισχύνῃ without intensifying it to ‘disgrace.’
