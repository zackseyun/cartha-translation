source:
  edition: SBLGNT
  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: te
  text: కాని లోకంలోని మూర్ఖమైనవాటిని[a] జ్ఞానులు సిగ్గుపడేలా చేయడానికి[b] దేవుడు ఎన్నుకున్నాడు; లోకంలోని బలహీనమైనవాటిని[c] శక్తిమంతమైనవాటిని సిగ్గుపడేలా చేయడానికి దేవుడు ఎన్నుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోకంలో మూర్ఖమైనవిగా ఉన్నవాటిని.” గ్రీకులో నపుంసకలింగ బహువచన విశేషణం నామవాచకంగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అవమానానికి గురిచేయడానికి” లేదా “సిగ్గుపరచడానికి.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “లోకంలో బలహీనమైనవిగా ఉన్నవాటిని.” ఇక్కడ కూడా గ్రీకులో నపుంసకలింగ బహువచన విశేషణం నామవాచకంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందటి వాక్యంతో ఉన్న బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: లోకంలోని మూర్ఖమైనవాటిని
  rationale: μωρά అనేది నపుంసకలింగ బహువచన విశేషణం నామవాచకంగా వాడబడింది. ‘వాటిని’ అనే రూపం దాని వ్యాకరణ స్వరూపాన్ని నిలుపుతూ, సూచనను కేవలం వ్యక్తులకే పరిమితం చేయదు.
- source_word: ἐξελέξατο
  choice: ఎన్నుకున్నాడు
  rationale: దేవుని ఉద్దేశపూర్వకమైన ఎంపికను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα
  choice: -డానికి
  rationale: గ్రీకు ఉద్దేశార్థక ఉపవాక్యాన్ని తెలుగులో సహజమైన ప్రయోజనార్థక నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: καταισχύνῃ
  choice: సిగ్గుపరచడానికి
  rationale: సిగ్గుకు గురిచేయడం అనే క్రియ యొక్క ప్రాథమిక భావాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: τοὺς σοφούς
  choice: జ్ఞానులను
  rationale: పుంలింగ బహువచన నామవాచకార్థ విశేషణాన్ని సహజంగా వ్యక్తులుగా అనువదించి, పౌలు ఉపయోగించిన వ్యతిరేకతను నిలుపుతుంది.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: లోకంలోని బలహీనమైనవాటిని
  rationale: నపుంసకలింగ బహువచన రూపాన్ని నిలుపుతూ, అది వస్తువులనో వ్యక్తులనో సూచిస్తుందనే ప్రశ్నను ముందుగానే పరిష్కరించదు.
- source_word: τὰ ἰσχυρά
  choice: బలమైనవాటిని
  rationale: గ్రీకులోని నపుంసకలింగ బహువచనాన్ని అలాగే ప్రతిబింబించి, ‘బలహీనమైనవాటిని’ అనే పదబంధంతో సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: ‘మూర్ఖమైనవి’, ‘బలహీనమైనవి’ అనే నపుంసకలింగ బహువచనాల సూచన
  choice: వాటిని
  alternative: మూర్ఖులైనవారిని; బలహీనులైనవారిని
  rationale: సందర్భం వ్యక్తులను కూడా కలుపుకోవచ్చు; అయినా మూలంలోని నపుంసకలింగ రూపాన్ని వ్యక్తులకు మాత్రమే పరిమితం చేయకుండా ఉంచడం దాని ఉద్దేశపూర్వక విస్తృతిని, అలంకారిక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండు సమాంతర భాగాలు, ‘దేవుడు ఎన్నుకున్నాడు’ అనే పునరుక్తి, అలాగే నపుంసకలింగ రూపాలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
