lexical_decisions:
- source_word: ἵνα
  choice: చెప్పకుండా ఉండటానికే
  rationale: ἵνα μή నిర్మాణం ఇక్కడ నివారించదలచిన ఉద్దేశాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేలా ప్రతికూల ప్రయోజనార్థక నిర్మాణంగా అనువదించబడింది.
- source_word: μή τις
  choice: ఎవరూ ... చెప్పకుండా
  rationale: నిషేధార్థక అనిర్దిష్ట కర్తను తెలుగులో సహజంగా ‘ఎవరూ’ అనే రూపంతో వ్యక్తం చేస్తుంది.
- source_word: εἴπῃ
  choice: చెప్పకుండా
  rationale: ἵνα μή తరువాతి అయోరిస్ట్ సబ్జంక్టివ్‌లోని భావి అవకాశాన్ని తెలుగు ప్రయోజనార్థక ప్రతికూల నిర్మాణం సహజంగా అందిస్తుంది.
- source_word: εἰς
  choice: పేరులోనికి
  rationale: εἰς యొక్క ప్రాథమిక దిశాత్మక భావమైన ‘లోనికి’ని నిలుపుతూ, బాప్తిస్మానికి పేరుతో ఉన్న సంబంధాన్ని ముందుగానే వ్యాఖ్యానించి పరిష్కరించకుండా ఉంచుతుంది.
- source_word: τὸ ἐμὸν ὄνομα
  choice: నా పేరు
  rationale: సహజమైన, నేరుగా అర్థమయ్యే తెలుగు స్వామ్య నిర్మాణం.
- source_word: ἐβαπτίσθητε
  choice: మీరు ... బాప్తిస్మం పొందారని
  rationale: గ్రీకు క్రియలోని కర్మణి భావాన్ని నిలుపుతుంది. ‘బాప్తిస్మం’ సాధారణ క్రైస్తవ పరిభాష; ఒక నిర్దిష్ట ఆచరణరీతిని అనువాదంలోకి దిగుమతి చేయదు.
theological_decisions:
- issue: బాప్తిస్మ సందర్భంలో εἰς τὸ ἐμὸν ὄνομα అనువాదం
  choice: నా పేరులోనికి
  alternative: నా పేరులో
  rationale: εἰς లోని ‘లోనికి’ భావం పౌలు వాడిన సంబంధాత్మక, గుర్తింపు సంబంధమైన భాషను నిలుపుతుంది. ‘నా పేరులో’ సహజమైన ప్రత్యామ్నాయం అయినప్పటికీ, అది దిశాత్మక నుడికారాన్ని కొంత సున్నితంగా మార్చగలదు; అందువల్ల దానిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ఈ వాక్యం ముందరి వచనంతో వ్యాకరణపరంగా అనుసంధానమై ఉన్నందున చివర ‘ఉండటానికే’ అనే ప్రయోజనార్థక రూపం వాడబడింది; మూలంలోని εἰς భావాన్ని ‘పేరులోనికి’ ద్వారా ఉద్దేశపూర్వకంగా నిలిపాం.
