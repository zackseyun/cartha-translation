id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: te
  text: 'సోదరులారా,[a] మన ప్రభువైన యేసు మెస్సీయ[b] పేరున మిమ్మల్ని విజ్ఞప్తి చేస్తున్నాను: మీరందరూ ఒకే మాట మాట్లాడాలి; మీ మధ్య విభజనలు ఉండకూడదు; అయితే ఒకే మనస్సులోను, ఒకే అభిప్రాయంలోను మీరు ఒక్కటిగా కలిసియుండాలి.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం అక్షరార్థంగా “సోదరులు”; అయితే ఇక్కడ అది విశ్వాస సమాజంలోని స్త్రీపురుషులందరినీ ఉద్దేశించి ఉండవచ్చు.
    reason: cultural_note
  - marker: b
    text: “మెస్సీయ”ను సంప్రదాయంగా “క్రీస్తు” అని అంటారు.
    reason: lexical_alternative
  - marker: c
    text: “ఒక్కటిగా కలిసియుండాలి” అనే మాటకు “సరిచేయబడి ఏకమై ఉండాలి” లేదా “మళ్లీ చక్కగా జతచేయబడాలి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: వేడుకుంటున్నాను
  rationale: ఇది కేవలం ఆజ్ఞ కాకుండా గంభీరమైన పాస్టరల్ విజ్ఞప్తి; ఆధునిక తెలుగులో “వేడుకుంటున్నాను” ఆ ఆతురతను సహజంగా తెలియజేస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు రూపం పుంలింగ బహువచనం. ప్రధాన పాఠ్యంలో దానిని నిలిపి, మొత్తం విశ్వాస సమాజాన్ని ఉద్దేశించే విస్తృత ప్రయోగాన్ని పాదసూచికలో తెలిపాం.
- source_word: διὰ τοῦ ὀνόματος
  choice: పేరున
  rationale: διά + షష్ఠీ ఇక్కడ ఆధారం లేదా అధికారాన్ని సూచిస్తుంది; “పేరున” తెలుగు వాడుకలో ఆ అధికారపూర్వక విజ్ఞప్తిని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός యొక్క బిరుదు భావాన్ని అనువదిస్తూ, సంప్రదాయ ధ్వన్యనువాదమైన “క్రీస్తు”కు బదులుగా “మెస్సీయ”ను ఉంచాం.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: మీరందరూ ఒకే మాట మాట్లాడాలి
  rationale: పౌలు వాడిన మాటల సమానత్వాన్ని స్పష్టంగా నిలుపుతుంది; కేవలం “ఏకీభవించాలి” అని భావాన్ని సారాంశం చేయదు.
- source_word: σχίσματα
  choice: విభేదాలు
  rationale: సంఘంలో ఏర్పడే చీలికలు లేదా వర్గ విభజనలను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατηρτισμένοι
  choice: పూర్తిగా ఒక్కటిగా కలిసివుండాలి
  rationale: సరిచేయడం, తిరిగి జతచేయడం, సముచితంగా అమర్చడం అనే ఫలితార్థక భావాలను సందర్భానుసారంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ ఛాయలను పాదసూచికలో ఉంచాం.
- source_word: νοῒ
  choice: మనసులో
  rationale: νοῦς ఇక్కడ ఆలోచనా విధానం లేదా అవగాహనను సూచిస్తుంది; సహజమైన తెలుగులో “మనసు” ఆ భావాన్ని మోస్తుంది.
- source_word: γνώμῃ
  choice: అభిప్రాయంలో
  rationale: γνώμη తీర్పు, అభిప్రాయం, నిశ్చయం అనే పరిధిని కలిగి ఉంది. νοῦς నుండి భేదాన్ని నిలుపుతూ “అభిప్రాయం” సహజంగా ఉంటుంది.
theological_decisions:
- issue: Χριστός అనే క్రీస్తుసంబంధ బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదానికి బిరుదు భావం స్పష్టంగా ఉంది; “మెస్సీయ” ఆ అర్థాన్ని తెలియజేస్తుంది, వ్యక్తి సూచనను మార్చదు.
- issue: ἀδελφοί అనే లింగసూచక సంబోధన
  choice: ప్రధాన పాఠ్యంలో “సోదరులారా”; సమగ్ర సమాజ సూచన పాదసూచికలో
  alternative: సోదర సోదరీమణులారా
  rationale: మూలంలోని పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో కాపాడుతూ, సందర్భంలో స్త్రీపురుషులందరూ ఉద్దేశింపబడే అవకాశాన్ని స్పష్టంగా గమనికలో తెలిపాం.
- issue: κατηρτισμένοι యొక్క ఏకత్వ భావం
  choice: పూర్తిగా ఒక్కటిగా కలిసివుండాలి
  alternative: సరిచేయబడి ఏకమై ఉండాలి
  rationale: విభజనల సందర్భంలో తిరిగి సరిగా జతచేయబడిన ఏకత్వాన్ని చూపుతుంది; అయితే పునరుద్ధరణ/మరమ్మత్తు ఛాయను పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని విజ్ఞప్తి, పునరుక్త ఏకత్వ భాష, νοῦς–γνώμη మధ్య భేదం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
