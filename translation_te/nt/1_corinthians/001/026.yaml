id: 1CO.1.26
reference: 1 Corinthians 1:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: te
  text: 'ఎందుకంటే, సోదరులారా,[a] మీ పిలుపును గమనించండి: మానవ ప్రమాణాల ప్రకారం జ్ఞానులైనవారు మీలో అనేకులు లేరు; శక్తిమంతులు అనేకులు లేరు; ఉన్నత వంశంలో పుట్టినవారు అనేకులు లేరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “సోదరులారా” అనే సంబోధన సంఘమంతటినీ ఉద్దేశిస్తుంది; విశ్వాసులైన స్త్రీలు కూడా ఇందులో ఉన్నారు.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: గమనించండి
  rationale: ఈ రూపాన్ని ఆజ్ఞార్థకంగానూ సూచనార్థకంగానూ చదవవచ్చు. సందర్భంలో పౌలు పాఠకులు తమ పరిస్థితిని పరిశీలించమని కోరుతున్నందున, ‘గమనించండి’ సహజమైన ఆజ్ఞార్థక భావాన్ని ఇస్తూ మూలంలోని అలంకార బలాన్ని నిలుపుతుంది.
- source_word: κλῆσιν
  choice: పిలుపును
  rationale: ఇది వృత్తి లేదా సామాజిక స్థానాన్ని కాక, విశ్వాసుల స్థితిని నిర్ణయించే దేవుని పిలుపును సూచించే పౌలు వాడుకకు సరిపోతుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం. ప్రధాన పాఠ్యంలో దానిని నేరుగా నిలిపి, సంఘమంతటినీ—స్త్రీలను కూడా—ఉద్దేశించిన సమిష్టి ప్రయోగమని పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: οὐ πολλοὶ ... σοφοὶ
  choice: జ్ఞానులు మీలో అనేకులు లేరు
  rationale: మూలంలో కొరింథీయులను సూచించే భావం అంతర్లీనంగా ఉంది. తెలుగులో స్పష్టత, సహజత్వం కోసం ‘మీలో’ చేర్చబడింది.
- source_word: κατὰ σάρκα
  choice: మానవ ప్రమాణాల ప్రకారం
  rationale: ఇక్కడ పదబద్ధమైన ‘శరీరం ప్రకారం’ కంటే, మానవుల అంచనా లేదా లోకసంబంధ ప్రమాణాలను సూచించే నుడికార భావమే సందర్భోచితం. ఈ అనువాదం పాపస్వభావం అనే వేరొక పౌలు భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: δυνατοί
  choice: శక్తిమంతులు
  rationale: సామాజిక లేదా రాజకీయ బలం కలవారనే విస్తృత భావాన్ని, అధికార స్వరూపాన్ని అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: εὐγενεῖς
  choice: ఉన్నత వంశంలో పుట్టినవారు
  rationale: ఈ పదం ఉన్నత సామాజిక వంశపారంపర్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ రూపం ‘కులీనులు’ కంటే స్పష్టంగా, తక్కువ అస్పష్టతతో ఉంది.
theological_decisions:
- issue: κατὰ σάρκα అనే పదబంధంలోని భావం
  choice: మానవ ప్రమాణాల ప్రకారం
  alternative: శరీరం ప్రకారం
  rationale: ఈ సందర్భంలో జ్ఞానంపై మానవ సమాజపు అంచనానే ఉద్దేశ్యం. పదబద్ధ రూపం తెలుగులో శారీరకత లేదా పాపస్వభావాన్ని సూచించినట్లు తప్పుగా అర్థమయ్యే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని మూడు సమాంతర ‘అనేకులు లేరు’ వాక్యభాగాలను నిలిపి పౌలు వాక్యంలోని లయను కాపాడాం.
