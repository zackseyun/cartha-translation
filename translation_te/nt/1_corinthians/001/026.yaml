  terminology: “పిలుపు,” “సోదరులారా,” “మానవ ప్రమాణాల ప్రకారం,” “శక్తిమంతులు,” and “ఉన్నత వంశంలో పుట్టినవారు” are suitable modern-standard Telugu renderings. The footnote appropriately explains the congregational inclusive reference of the masculine plural address.
