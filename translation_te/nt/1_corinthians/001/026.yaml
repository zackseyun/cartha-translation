  source_fidelity: The draft accurately conveys the imperative force of Βλέπετε, the divine-call sense of κλῆσις, the social senses of σοφοί, δυνατοί, and εὐγενεῖς, and the contextual force of κατὰ σάρκα. However, γὰρ (“for/because”) is not represented. The revision supplies this connective while retaining the source’s rhetorical progression and threefold parallelism.
