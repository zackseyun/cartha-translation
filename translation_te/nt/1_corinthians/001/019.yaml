id: 1CO.1.19
reference: 1 Corinthians 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ἀπολῶ τὴν σοφίαν τῶν σοφῶν, καὶ τὴν σύνεσιν τῶν συνετῶν ἀθετήσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: te
  text: 'ఎందుకంటే లేఖనంలో ఇలా వ్రాయబడి ఉంది: “జ్ఞానుల జ్ఞానాన్ని నేను నాశనం చేస్తాను; వివేకుల అవగాహనను నేను కొట్టివేస్తాను”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వివేకుల అవగాహనను నేను తిరస్కరిస్తాను” లేదా “అమాన్యం చేస్తాను.”
    reason: ἀθετήσωకు ‘తిరస్కరించడం,’ ‘పక్కన పెట్టడం/అమాన్యం చేయడం’ అనే సమీపార్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: γέγραπται
  choice: రాసి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే పరిపూర్ణ కర్మణి రూపంలోని ప్రస్తుత ఫలిత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఈ లేఖన వాక్యం ఆధారమని చూపే వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Ἀπολῶ
  choice: నేను నాశనం చేస్తాను
  rationale: ἀπόλλυμι యొక్క భవిష్యత్ క్రియారూపంలో ఉన్న నాశనం చేయడం లేదా అంతమొందించడం అనే బలమైన భావాన్ని అదనపు తీవ్రత చేర్చకుండా నేరుగా వ్యక్తం చేస్తుంది.
- source_word: σοφίαν τῶν σοφῶν
  choice: జ్ఞానుల జ్ఞానాన్ని
  rationale: మూలంలోని ఒకే ధాతువుతో ఏర్పడిన పదాల పునరుక్తిని, జననీవిభక్తి నిర్మాణాన్ని, వాక్చాతుర్యాన్ని తెలుగులో నిలుపుతుంది.
- source_word: σύνεσιν
  choice: అవగాహనను
  rationale: గ్రహణశక్తి, అంతర్దృష్టి లేదా వివేచన అనే అర్థపరిధిని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: τῶν συνετῶν
  choice: వివేకుల
  rationale: అర్థం చేసుకొని వివేచించగల వ్యక్తులను సూచిస్తుంది; ‘జ్ఞానుల’తో ఉన్న సమాంతర నిర్మాణాన్ని కూడా నిలుపుతుంది.
- source_word: ἀθετήσω
  choice: నేను కొట్టివేస్తాను
  rationale: తిరస్కరించడం, పక్కన పెట్టడం లేదా అమాన్యం చేయడం అనే పదార్థాన్ని సహజమైన, నిర్ణయాత్మకమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యెషయా ఉల్లేఖనంలో దేవుని చర్యను మరియు మానవ జ్ఞానంతో ఉన్న వ్యత్యాసాన్ని ఎలా వ్యక్తం చేయాలి
  choice: భవిష్యత్ క్రియలను ‘నాశనం చేస్తాను’ మరియు ‘కొట్టివేస్తాను’ అని నేరుగా అనువదించడం
  alternative: ‘వ్యర్థం చేస్తాను’ లేదా ‘భగ్నం చేస్తాను’ వంటి మరింత వ్యాఖ్యానాత్మక పదాలను వాడడం
  rationale: గ్రీకు పాఠంలోని రెండు భవిష్యత్ క్రియల బలాన్ని నిలుపుతూ, మానవ జ్ఞానంపై దేవుని చర్యకు అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని సమాంతర నిర్మాణం మరియు లేఖన ఉల్లేఖన స్వరం నిలుపబడ్డాయి.
