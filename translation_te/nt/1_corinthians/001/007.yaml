  revised_text: అందువల్ల, మీరు ఏ వరంలోనూ కొదువ లేకుండా, మన ప్రభువైన యేసు క్రీస్తు[c] ప్రత్యక్షత[b] కోసం ఆత్రంగా ఎదురుచూస్తున్నారు.
