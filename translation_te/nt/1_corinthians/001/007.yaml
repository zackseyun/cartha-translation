  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: te
  text: అందువల్ల, మీరు ఏ వరంలోనూ కొదువ లేకుండా, మన ప్రభువైన యేసు క్రీస్తు[c] ప్రత్యక్షత[b] కోసం ఆత్రంగా ఎదురుచూస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, “మన ప్రభువైన యేసు క్రీస్తు ప్రత్యక్షమవడం.”
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో “యేసు క్రీస్తు”; బిరుదు భావాన్ని స్పష్టంగా చూపాలంటే, “మెస్సీయ అయిన యేసు” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: అందువల్ల
  rationale: ముందటి వచనాల్లో చెప్పిన దేవుని కృప ఫలితాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఫలిత భావాన్ని తెలియజేస్తుంది.
- source_word: ὑμᾶς μὴ ὑστερεῖσθαι
  choice: మీరు ... కొదువగా లేరు
  rationale: ఏ విషయంలోనూ లోటు లేకపోవడాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: ఏ వరంలోనూ
  rationale: χάρισμα దేవుని కృపచేత అనుగ్రహించబడిన వరాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సంక్షిప్తమైన ‘వరం’ను ఉంచి, దాని కృపా/ఆత్మ సంబంధమైన భావాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἀπεκδεχομένους
  choice: ఆత్రంగా ఎదురుచూస్తూ
  rationale: కొనసాగుతున్న, బలమైన నిరీక్షణ భావాన్ని కాపాడుతుంది.
- source_word: ἀποκάλυψιν
  choice: ప్రత్యక్షత
  rationale: దాచబడినది బయలుపడడమనే మూలభావాన్నీ, ప్రభువు రాకకు సంబంధించిన సందర్భాన్నీ తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: కొత్త నిబంధనలో κύριοςకు సాధారణమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు క్రీస్తు
  rationale: ఇక్కడ Χριστός యేసుతో కలిసి స్థిరమైన నామసదృశ సంబోధనగా ఉంది; అందువల్ల ప్రామాణిక తెలుగు రూపమైన ‘యేసు క్రీస్తు’ను ఉపయోగించాం.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστοῦను ఎలా అనువదించాలి
  choice: యేసు క్రీస్తు
  alternative: మెస్సీయ అయిన యేసు
  rationale: ఈ సందర్భంలో ఈ పదబంధం ప్రత్యేకంగా మెస్సీయ బిరుదును నొక్కిచెప్పడం కంటే స్థిరమైన నామసదృశ రూపంగా పనిచేస్తుంది. అయినా ‘మెస్సీయ’ అనే బిరుదు భావాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: ἀποκάλυψις యొక్క అంత్యకాల సంబంధ భావం
  choice: ప్రత్యక్షత
  alternative: బయలుపరచబడడం / ప్రత్యక్షమవడం
  rationale: ‘ప్రత్యక్షత’ మూలపదంలోని బయలుపరచడం అనే భావాన్ని కాపాడుతూ, యేసు క్రీస్తు భవిష్యత్తులో ప్రత్యక్షమయ్యే సందర్భానికీ సహజంగా సరిపోతుంది; ‘రాక’ అని మాత్రమే అనువదించి భావాన్ని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ఫలిత భావం, కొనసాగుతున్న ఆత్ర నిరీక్షణ, ‘ప్రత్యక్షత’లోని అంత్యకాల ఉద్వేగం నిలిపబడ్డాయి. ఈ వచనం ముందు సందర్భంపై ఆధారపడే వాక్యభాగం కావడంతో ‘అందువల్ల’తో అనుసంధానం చేయబడింది.
