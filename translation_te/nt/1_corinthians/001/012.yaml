  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: te
  text: 'నేను చెప్పేదేమిటంటే: మీలో ప్రతి ఒక్కరూ, “నేను పౌలుకు చెందిన వ్యక్తిని,” “నేను అపొల్లోకు చెందిన వ్యక్తిని,” “నేను కేఫాకు చెందిన వ్యక్తిని,” “నేను మెస్సీయకు చెందిన వ్యక్తిని[a]” అని అంటున్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను క్రీస్తుకు చెందిన వ్యక్తిని.”
    reason: Χριστός అనే బిరుదుకు వాడుకలో ఉన్న సంప్రదాయ లిప్యంతరీకరణ.
lexical_decisions:
- source_word: λέγω δὲ τοῦτο
  choice: నేను చెప్పేది ఇదే
  rationale: పౌలు తాను ఉద్దేశిస్తున్న విషయాన్ని వివరిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἕκαστος ὑμῶν λέγει
  choice: మీలో ప్రతి ఒక్కరూ ... అని అంటున్నారు
  rationale: ἕκαστος యొక్క వ్యక్తివ్యాప్తిని నిలుపుతూ, సమూహంలో కొనసాగుతున్న మాటతీరును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰμι + genitive
  choice: చెందినవాణ్ణి
  rationale: ఇక్కడ షష్ఠీ విభక్తి సూచించే అనుబంధం లేదా పక్ష విధేయతను, ‘అనుసరిస్తాను’ అని అతిగా వ్యాఖ్యానించకుండా స్పష్టంగా అందిస్తుంది.
- source_word: Παύλου / Ἀπολλῶ / Κηφᾶ
  choice: పౌలుకు / అపొల్లోకు / కేఫాకు
  rationale: వ్యక్తుల పేర్లను మూలరూపాలకు అనుగుణంగా లిప్యంతరీకరించి, చెందిన భావానికి తగిన చతుర్థీ విభక్తిని వాడింది; Κηφᾶను ‘పేతురు’గా మార్చలేదు.
- source_word: Χριστοῦ
  choice: మెస్సీయకు
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున దాని అర్థాన్ని అనువదిస్తూ ‘మెస్సీయ’ అని ఇచ్చింది; సంప్రదాయ లిప్యంతరీకరణను పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: వర్గ నినాదంలో Χριστοῦ అనువాదం
  choice: మెస్సీయకు
  alternative: క్రీస్తుకు
  rationale: మూలపదం బిరుదును సూచిస్తుంది. ‘మెస్సీయ’ దాని భావాన్ని వెల్లడిస్తుంది; ‘క్రీస్తు’ అదే గ్రీకు పదానికి సంప్రదాయ లిప్యంతరీకరణ. వాక్యంలోని వర్గపరమైన ఉద్రిక్తతను ఏ రూపమూ తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. నాలుగు నినాదాల సమాంతర నిర్మాణాన్ని నిలిపింది. ఉటంకించిన మాటలోని ‘వాణ్ణి’ సాధారణ పురుష ఏకవచన వక్తరూపం; మూలంలో వక్తల లింగం నిర్దిష్టం కాదు.
