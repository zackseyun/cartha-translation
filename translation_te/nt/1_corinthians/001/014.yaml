translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా వాక్య గౌరవాన్ని కాపాడుతూ అనువదించబడింది. మూలంలోని మినహాయింపు నిర్మాణం యథాతథంగా నిలుపబడింది.
