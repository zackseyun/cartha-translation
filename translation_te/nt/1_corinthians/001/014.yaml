  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: te
  text: క్రిస్పుకు, గాయికి తప్ప మీలో ఎవరికీ నేను బాప్తిస్మం ఇవ్వలేదు కాబట్టి కృతజ్ఞతలు తెలుపుతున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: కృతజ్ఞతలు చెల్లిస్తున్నాను
  rationale: వర్తమాన కాలంలోని కృతజ్ఞతాభావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: …ఇవ్వనందుకు
  rationale: ఇక్కడ పౌలు కృతజ్ఞతకు సంబంధించిన విషయాన్ని/కారణాన్ని తెలుగులో సహజమైన కారణార్థక నిర్మాణంతో తెలియజేస్తుంది.
- source_word: οὐδένα ὑμῶν
  choice: మీలో మరెవరికీ
  rationale: మినహాయింపుగా పేర్కొన్న ఇద్దరిని తప్ప శ్రోతలలో ఇంకెవరికీ కాదనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐβάπτισα
  choice: నేను బాప్తిస్మం ఇవ్వనందుకు
  rationale: క్రైస్తవ సందర్భంలో βαπτίζωకు ప్రామాణికమైన తెలుగు సమానార్థాన్ని వాడి, ఆచరణ విధానంపై ఏ ప్రత్యేక శాఖాపరమైన అర్థాన్నీ చేర్చదు.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: గ్రీకు మినహాయింపు నిర్మాణాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Κρίσπον
  choice: క్రిస్పుకు
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగులో ధ్వన్యనుసారంగా రాసి, వాక్యంలోని కర్మార్థక ప్రయోగానికి తగిన విభక్తిని జోడించింది.
- source_word: Γάϊον
  choice: గాయికి
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగులో ధ్వన్యనుసారంగా రాసి, వాక్యంలోని కర్మార్థక ప్రయోగానికి తగిన విభక్తిని జోడించింది.
