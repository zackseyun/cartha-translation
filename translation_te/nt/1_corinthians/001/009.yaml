id: 1CO.1.9
reference: 1 Corinthians 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: te
  text: దేవుడు నమ్మకమైనవాడు; ఆయన ద్వారా మీరు తన కుమారుడైన, మన ప్రభువైన యేసు మెస్సీయతో సహవాసంలోకి పిలువబడ్డారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయనచేత.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “భాగస్వామ్యంలోకి” లేదా “పాలుపంచుకోవడంలోకి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: నమ్మకమైనవాడు
  rationale: దేవుని విశ్వసనీయమైన, స్థిరమైన స్వభావాన్ని తెలిపే విధంగా సహజమైన ఆధునిక తెలుగు పదాన్ని ఎంచుకున్నాం.
- source_word: δι’ οὗ
  choice: దేవుడే … పిలిచింది
  rationale: διά + షష్ఠీ విభక్తి దేవుడు ఈ పిలుపుకు మధ్యవర్తి లేదా కార్యసాధకుడు అని సూచిస్తుంది. తెలుగులో కర్తను స్పష్టంగా ఉంచడం సహజంగా ఉండడంతో ఈ నిర్మాణాన్ని వాడాం; ‘ఆయన ద్వారా’ అనే రూపాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: ἐκλήθητε
  choice: మిమ్మల్ని పిలిచింది
  rationale: దైవిక పిలుపు అనే పౌలు వాడుకను నిలుపుతూ, కేవలం ఆహ్వానించారని లేదా బలవంతంగా రప్పించారని భావాన్ని సంకుచితం చేయకుండా ‘పిలిచింది’ అని అనువదించాం.
- source_word: κοινωνίαν
  choice: సహవాసంలోకి
  rationale: సంబంధం, భాగస్వామ్యం, పాలుపంచుకోవడం అనే κοινωνία యొక్క విస్తృత భావాన్ని తెలుగులో స్థిరంగా, సులభంగా వినిపించే ‘సహవాసం’తో తెలిపాం.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: తన కుమారుడైన … తో
  rationale: κοινωνίαకు అనుసంధానమైన గ్రీకు షష్ఠీ విభక్తిని తెలుగులో వ్యక్తితో సహవాసం అనే సహజ నిర్మాణం ప్రకారం ‘తో’ అని వ్యక్తం చేశాం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ యేసుకు సంబంధించిన బిరుదుగా అర్థవంతంగా ఉంది; అందువల్ల దానిని కేవలం పేరులో భాగంలా ‘క్రీస్తు’ అని కాక, బిరుదును స్పష్టపరిచే ‘మెస్సీయ’గా ఇచ్చాం.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος అనే క్రీస్తుసంబంధ బిరుదుకు గౌరవప్రదమైన, సాధారణ తెలుగు సమానార్థకం.
theological_decisions:
- issue: Χριστοῦను పేరులో భాగంలా ‘క్రీస్తు’ అని ఇవ్వాలా, బిరుదుగా ‘మెస్సీయ’ అని ఇవ్వాలా?
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Ἰησοῦ Χριστοῦ అనే సుపరిచిత పదబంధంలో ఉన్నప్పటికీ Χριστός యొక్క బిరుదార్థం ఇక్కడ నిలిచి ఉంది. అందువల్ల దాని అర్థాన్ని మరుగుపరచకుండా ‘మెస్సీయ’ అని ఇచ్చాం.
- issue: κοινωνίαను ప్రధానంగా సంబంధ సహవాసంగా లేదా పాలుపంచుకోవడంగా వ్యక్తం చేయాలా?
  choice: సహవాసం
  alternative: భాగస్వామ్యం / పాలుపంచుకోవడం
  rationale: ఈ పదంలో సంబంధం మరియు భాగస్వామ్యం రెండూ ఉన్నాయి. ప్రధాన పాఠ్యంలో సహజమైన ‘సహవాసం’ను ఉంచి, ఇతర భావఛాయలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలో ముందున్న ‘దేవుడు నమ్మకమైనవాడు’ అనే ఉద్ఘాటనను తెలుగులో సహజంగా ముగింపులో ఉంచి, ‘దేవుడే’ ద్వారా కేంద్రీకరణను నిలిపాం.
