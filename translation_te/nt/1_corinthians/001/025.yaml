id: 1CO.1.25
reference: 1 Corinthians 1:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: te
  text: ఎందుకంటే దేవుని మూర్ఖత్వం మనుషులకంటే జ్ఞానమైనది, దేవుని బలహీనత మనుషులకంటే బలమైనది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంతో ఉన్న కారణసంబంధాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: దేవుని వెర్రితనం
  rationale: గ్రీకు పదబంధంలోని ఉద్దేశపూర్వక విరోధాభాసాన్ని మెత్తబరచకుండా నిలుపుతుంది; ఇది దేవుడు నిజంగా వెర్రివాడని కాక, మనుషులకు వెర్రితనంగా కనిపించే దేవుని కార్యాన్ని సూచించే సందర్భోచిత ప్రయోగం.
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: మనుషుల జ్ఞానం కంటే జ్ఞానవంతమైనది
  rationale: గ్రీకులో పోలిక సంక్షిప్తంగా ఉన్నా, తెలుగులో పోల్చబడుతున్న భావాన్ని సహజంగా స్పష్టం చేస్తుంది; ἀνθρώπωνను లింగసమావేషకంగా ‘మనుషులు’ అని అందిస్తుంది.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: దేవుని బలహీనత
  rationale: మొదటి అర్ధవాక్యానికి సమాంతరంగా మూలంలోని ఆశ్చర్యకరమైన భాషను నిలుపుతుంది.
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: మనుషుల బలం కంటే బలమైనది
  rationale: తెలుగులో అసంపూర్ణంగా వినిపించకుండా పోలికను స్పష్టం చేస్తూ, మూలార్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘దేవుని వెర్రితనం’ మరియు ‘దేవుని బలహీనత’ అనే విరోధాభాసాలు
  choice: రెండు వ్యక్తీకరణలనూ నేరుగా నిలుపడం
  alternative: ‘మనుషులకు వెర్రితనంగా/బలహీనంగా కనిపించేది’ అని వివరణాత్మకంగా మార్చడం
  rationale: పౌలు ఉద్దేశపూర్వకంగా వాడిన కఠినమైన వాక్చాతుర్యాన్ని మూలంలో ఉన్నట్టే ఉంచడం అవసరం; వివరణను ప్రధాన పాఠ్యంలో చేరిస్తే నిజమైన వాక్య ఉద్వేగం తగ్గుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణం. రెండు సమాంతర అర్ధవాక్యాల లయను కాపాడేందుకు ‘జ్ఞానం కంటే జ్ఞానవంతమైనది / బలం కంటే బలమైనది’ అనే సమరూప నిర్మాణం ఉపయోగించబడింది.
