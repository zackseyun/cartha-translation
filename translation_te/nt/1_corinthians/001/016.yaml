base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: te
  text: స్తెఫనా ఇంటివారికి కూడా నేను బాప్తిస్మమిచ్చాను[a]. అంతకు మించి, మరెవరికైనా నేను బాప్తిస్మమిచ్చానో లేదో నాకు తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్తెఫనా ఇంటికి.” ఇక్కడి గ్రీకు పదం కేవలం భవనాన్ని మాత్రమే కాక, ఆ ఇంటికి చెందిన కుటుంబం లేదా గృహసమూహాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: బాప్తిస్మమిచ్చాను
  rationale: క్రియ బాప్తిస్మం నిర్వహించడాన్ని నేరుగా సూచిస్తుంది. విధానాన్ని ప్రత్యేకంగా నిర్ణయించకుండా, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో స్పష్టంగా ఉండే రూపం ఇది.
- source_word: δὲ καὶ
  choice: కూడా
  rationale: ఇది ముందుగా పేర్కొన్నవారికి స్తెఫనా ఇంటివారిని అదనంగా కలుపుతుంది; తెలుగులో ‘కూడా’ ఆ సున్నితమైన అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: స్తెఫనా ఇంటివారికి
  rationale: οἶκος ఇక్కడ భవనాన్ని మాత్రమే కాక ఒక ఇంటికి చెందిన కుటుంబం లేదా గృహసమూహాన్ని సూచిస్తుంది. ‘ఇంటివారు’ ఆ సామాజిక విస్తృతిని సహజంగా నిలుపుతుంది.
- source_word: λοιπὸν
  choice: అది తప్ప
  rationale: ఇప్పుడే చెప్పిన మినహాయింపుకు మించి మిగిలిన విషయాన్ని సూచిస్తుంది; సందర్భంలో ‘అది తప్ప’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: οὐκ οἶδα
  choice: నాకు తెలియదు
  rationale: మూలపాఠం జ్ఞాపకం లేదని వివరణాత్మకంగా చెప్పకుండా, తెలియదనే భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: మరెవరికైనా నేను బాప్తిస్మమిచ్చానో లేదో
  rationale: εἰ ప్రవేశపెట్టే అనిశ్చిత పరోక్ష ప్రశ్నను తెలుగులో ‘-ఆనో లేదో’ సహజంగా, ఖచ్చితంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ‘ఇంటివారు’ అనే పదం οἶκος యొక్క సామాజిక భావాన్ని కాపాడుతుంది; ‘బాప్తిస్మమిచ్చాను’ విధానపరమైన అర్థాన్ని అదనంగా రుద్దదు.
