id: 1CO.1.18
reference: 1 Corinthians 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: te
  text: ఎందుకంటే, సిలువ సందేశం[a] నశించిపోతున్నవారికి మూర్ఖత్వం; అయితే రక్షించబడుతున్న మనకు అది దేవుని శక్తి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సిలువ వాక్యం.”
    reason: lexical_alternative
  - marker: b
    text: “రక్షించబడుతున్న” అనే గ్రీకు రూపం రక్షణను ఇక్కడ కొనసాగుతున్న వాస్తవంగా చూపుతుంది.
    reason: aspect_clarification
lexical_decisions:
- source_word: λόγος
  choice: సందేశం
  rationale: ఇక్కడ λόγος ఒకే మాటను కాకుండా సిలువను గురించిన ప్రకటిత విషయాన్ని సూచిస్తుంది. అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘సందేశం’ స్పష్టంగా ఉంటుంది; ‘వాక్యం’ అనే దగ్గరి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: σταυροῦ
  choice: సిలువ
  rationale: గ్రీకు పదానికి నేరుగా సరిపడే ‘సిలువ’ను ఉంచడం ద్వారా పౌలు వాడిన సంక్షిప్తమైన, బలమైన రూపకం నిలుస్తుంది.
- source_word: ἀπολλυμένοις
  choice: నశించిపోతున్నవారికి
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘నశించినవారు’ కంటే ‘నశించిపోతున్నవారు’ ఆ గమనాన్ని బాగా నిలుపుతుంది.
- source_word: μωρία
  choice: వెర్రితనం
  rationale: దేవుని శక్తితో పౌలు ఉద్దేశించిన తీవ్రమైన వ్యత్యాసాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: σῳζομένοις
  choice: రక్షించబడుతున్న మనకు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న భావాన్ని నిలుపుతూ, స్పష్టంగా ఉన్న ἡμῖν (‘మనకు’)ను కూడా ప్రతిబింబిస్తుంది.
- source_word: δύναμις θεοῦ
  choice: దేవుని శక్తి
  rationale: గ్రీకు సంబంధపద నిర్మాణాన్ని సహజమైన తెలుగులో దగ్గరగా, దాని వేదాంతపరమైన బరువును కోల్పోకుండా అందిస్తుంది.
theological_decisions:
- issue: σῳζομένοιςలో రక్షణ యొక్క కాలాంశం
  choice: రక్షించబడుతున్న మనకు
  alternative: రక్షించబడిన మనకు
  rationale: గ్రీకు వర్తమాన కృదంతం రక్షణను ఇక్కడ కొనసాగుతున్న లేదా ప్రస్తుతం అనుభవిస్తున్న వాస్తవంగా చూపుతుంది. దానిని కేవలం గతంలో పూర్తయిన సంఘటనగా మార్చకుండా పౌలు చెప్పిన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. వాక్యంలోని రెండు వర్గాల మధ్య సమాంతర వ్యత్యాసాన్ని, అలాగే నశించడం మరియు రక్షించబడడం అనే కొనసాగుతున్న భావాన్ని నిలిపాం.
