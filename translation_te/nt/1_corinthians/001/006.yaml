lexical_decisions:
- source_word: καθὼς
  choice: అలాగే
  rationale: ముందటి వాక్యంతో పోలికను, అనురూపతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μαρτύριον
  choice: సాక్ష్యం
  rationale: ప్రకటించబడిన విషయానికీ దాని సాక్ష్యపూర్వక స్వభావానికీ చోటిస్తూ, మూలపదంలోని evidentiary భావాన్ని నిలుపుతుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయను గురించిన
  rationale: సందర్భంలో ఇది మెస్సీయకు సంబంధించిన అపొస్తలుల సాక్ష్యంగా అర్థమయ్యే objective genitive‌ను ప్రధాన పాఠ్యంలో ప్రతిబింబిస్తుంది; genitive అస్పష్టతను పాదసూచికలో నిలుపుతుంది.
- source_word: ἐβεβαιώθη
  choice: స్థిరపరచబడింది
  rationale: క్రియలోని passive రూపాన్నీ, దృఢపరచడం లేదా నిర్ధారించడం అనే భావాన్నీ కాపాడుతుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: బహువచన సమాజాన్ని ఉద్దేశించిన సందర్భంలో కొరింథీయుల సమూహంలో సాక్ష్యం స్థిరపడిందనే సహజమైన అర్థాన్ని ఇస్తుంది; అంతర్గత భావాన్ని పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: τοῦ Χριστοῦ లోని genitive సంబంధం
  choice: మెస్సీయను గురించిన సాక్ష్యం
  alternative: మెస్సీయ యొక్క సాక్ష్యం
  rationale: సందర్భం యేసును గురించిన అపొస్తల సాక్ష్యం కొరింథీయులలో ధృవపడటాన్ని సూచిస్తుంది. అయినా subjective genitive సాధ్యత నిజమైన వ్యాకరణ అస్పష్టత కాబట్టి పాదసూచికలో భద్రపరచబడింది.
- issue: ἐν ὑμῖν యొక్క సమూహ లేదా అంతర్గత భావం
  choice: మీ మధ్య
  alternative: మీలో
  rationale: బహువచన సంబోధనలో సంఘ సమాజం మధ్య అనే భావం సందర్భానుకూలం; అయితే 'మీలో' అనే మరింత అక్షరార్థ అనువాదం కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరతను మరియు గ్రీకు వాక్యంలోని passive నిర్మాణాన్ని నిలుపుతూ అనువదించబడింది.
