id: 1CO.1.4
reference: 1 Corinthians 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὐχαριστῶ τῷ θεῷ ⸀μου πάντοτε περὶ ὑμῶν ἐπὶ τῇ χάριτι τοῦ θεοῦ τῇ δοθείσῃ ὑμῖν ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: te
  text: మెస్సీయ అయిన యేసులో[b] మీకు అనుగ్రహించబడిన దేవుని కృపను బట్టి, మీ విషయమై[a] నేను ఎల్లప్పుడూ నా దేవునికి కృతజ్ఞతలు చెల్లిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ నిమిత్తం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “క్రీస్తు యేసులో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: కృతజ్ఞతలు చెల్లిస్తున్నాను
  rationale: వర్తమానకాల క్రియలోని కొనసాగుతున్న కృతజ్ఞతాభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῷ θεῷ μου
  choice: నా దేవునికి
  rationale: గ్రీకులోని దత్తి విభక్తిని, స్పష్టంగా ఉన్న వ్యక్తిగత స్వామ్యసూచక సర్వనామాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: కాలవ్యాప్తిని నేరుగా, గౌరవప్రదమైన సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: περὶ ὑμῶν
  choice: మీ విషయమై
  rationale: περί యొక్క ‘మిమ్మల్ని గురించి/మీ నిమిత్తం’ అనే విస్తృత సంబంధార్థాన్ని అనవసరంగా ఒకే భావానికి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: ἐπὶ τῇ χάριτι
  choice: కృపను బట్టి
  rationale: పౌలు కృతజ్ఞతకు ఆధారం లేదా కారణం దేవుని కృపేనని సహజంగా తెలియజేస్తుంది.
- source_word: χάριτι
  choice: కృప
  rationale: పౌలు రచనల్లో దేవుని ఉదార అనుగ్రహాన్ని సూచించే χάριςకు స్థిరమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తిని నిలిపి, కృప దేవునికి చెందినదీ ఆయననుండి వచ్చేదీ అనే భావవ్యాప్తిని తెరిచి ఉంచుతుంది.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: మీకు అనుగ్రహించబడిన
  rationale: దైవిక వరం సందర్భంలో δίδωμι యొక్క కర్మణి భావాన్ని సహజంగా తెలుపుతూ, దేవుడే అంతర్లీనంగా ఇచ్చేవాడని నిలుపుతుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ అయిన యేసులో
  rationale: Χριστός యొక్క బిరుదాత్మక అర్థాన్ని ‘మెస్సీయ’గా వ్యక్తం చేసి, తెలుగు వాక్యనిర్మాణంలో యేసుతో దాని సంబంధాన్ని ‘అయిన’ ద్వారా స్పష్టం చేస్తుంది; ἐν యొక్క ఐక్యత/పరిధి భావాన్ని ‘లో’ నిలుపుతుంది.
theological_decisions:
- issue: Χριστόςను అర్థానువాదమా లేక లిప్యంతరీకరణమా చేయాలి
  choice: మెస్సీయ అయిన యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఈ బిరుదులోని ‘అభిషిక్తుడు/మెస్సీయ’ అనే సజీవ అర్థాన్ని ప్రధాన పాఠ్యంలో చూపుతుంది; సంప్రదాయ లిప్యంతరీకరణను పాదసూచికలో అందిస్తుంది.
- issue: περὶ ὑμῶν యొక్క సంబంధార్థం
  choice: మీ విషయమై
  alternative: మీ నిమిత్తం
  rationale: కృతజ్ఞత వారి తరఫునా, వారిని గురించా అన్న భావసూక్ష్మతను పూర్తిగా పరిష్కరించకుండా గ్రీకు నిర్మాణంలోని విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు సులభంగా ఉండేలా రూపొందించబడింది. తెలుగు సహజ పదక్రమం కోసం కారణవాచక భాగాన్ని ముందుంచినా, మూలంలోని అన్ని భావసంబంధాలు నిలుపబడ్డాయి.
