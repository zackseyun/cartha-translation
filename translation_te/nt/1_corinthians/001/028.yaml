id: 1CO.1.28
reference: 1 Corinthians 1:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: te
  text: దేవుడు లోకంలో అల్పస్థాయిలో ఉన్నవాటిని, తృణీకరించబడినవాటిని[a], లేనివాటిని ఎంచుకున్నాడు, ఉన్నవాటిని నిర్వీర్యం చేయడానికి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏమీ కానివిగా పరిగణించబడినవాటిని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఏమీ కాకుండా చేయడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: నీచకులుగా ఎంచబడినవాటిని
  rationale: ఈ పదం ఉన్నత జన్మ లేదా సామాజిక హోదా లేనివాటిని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా అర్థమయ్యేలా సామాజిక అల్పస్థితిని వ్యక్తం చేస్తుంది; ఇది నైతిక నీచత్వమని అపార్థం కాకుండా ‘ఎంచబడిన’ అనే పదంతో స్థితి/గణన భావాన్ని సూచిస్తుంది.
- source_word: ἐξουθενημένα
  choice: తృణీకరించబడినవాటిని
  rationale: పనికిరానివిగా లేదా విలువలేనివిగా చూసి తిరస్కరించబడిన స్థితిని సంపూర్ణ కృదంతం సూచిస్తుంది. ‘తృణీకరించబడినవి’ ఆ అవమానకరమైన సామాజిక తీర్పును సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τὰ μὴ ὄντα
  choice: లేనివాటిని
  rationale: గ్రీకు వాక్యంలోని ఉద్దేశపూర్వకమైన విస్తృత, విరుద్ధ భావాన్ని నిలుపుతుంది. సందర్భంలో సామాజికంగా ‘ఏమీ కానివారు’ అనే సూచన ఉన్నప్పటికీ, ప్రధాన పాఠంలో దానికే పరిమితం చేయదు.
- source_word: τὰ ὄντα
  choice: ఉన్నవాటిని
  rationale: ‘లేనివాటిని’ అనే పదబంధంతో పౌలు నిర్మించిన సమతుల్యమైన వ్యతిరేకతను నేరుగా కాపాడుతుంది.
- source_word: καταργήσῃ
  choice: నిర్వీర్యం చేయడానికి
  rationale: అంతం చేయడం లేదా నాశనం చేయడం కంటే, ప్రభావం లేకుండా లేదా పనికిరాకుండా చేయడం అనే క్రియార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξελέξατο
  choice: ఎంచుకున్నాడు
  rationale: దేవుని ఉద్దేశపూర్వక ఎంపికను సహజమైన, ప్రామాణిక తెలుగు పదంతో తెలియజేస్తుంది.
theological_decisions:
- issue: τὰ μὴ ὄντα / τὰ ὄντα అనే పదబంధాలను సామాజిక వర్గాలుగా మాత్రమే వివరించాలా, లేక వాటి అక్షరార్థ వ్యతిరేకతను నిలుపాలా?
  choice: ‘లేనివాటిని / ఉన్నవాటిని’ అనే అక్షరార్థ వ్యతిరేకతను ప్రధాన పాఠంలో నిలిపాం.
  alternative: ‘ఏమీ కానివారిగా ఎంచబడినవారిని / గొప్పవారిగా ఎంచబడినవారిని’ అని సామాజిక భావాన్ని స్పష్టంగా చెప్పడం.
  rationale: సందర్భం లోకంలోని సామాజిక హోదాను సూచించినా, పౌలు వాడిన మాటలు మరింత విస్తృతమైనవి, గాఢమైనవి. అక్షరార్థ రూపం అలంకార తీవ్రతను, సామాజిక సూచనను రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని నపుంసక బహువచన రూపాన్ని ‘వాటిని’తో, అలాగే ‘లేనివి/ఉన్నవి’ అనే ప్రభావవంతమైన వ్యతిరేకతను కాపాడాం. వాక్య నిర్మాణంలో లక్ష్యాన్ని స్పష్టపరచడానికి దీర్ఘ విరామచిహ్నం వాడాం.
