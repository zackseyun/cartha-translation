id: 1CO.1.17
reference: 1 Corinthians 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: te
  text: ఎందుకంటే, మెస్సీయ నన్ను బాప్తిస్మం ఇవ్వడానికి కాదు, సువార్తను ప్రకటించడానికి పంపాడు—వాక్చాతుర్యంతో కాదు[a]—మెస్సీయ యొక్క సిలువ వ్యర్థం కాకుండేందుకు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాట యొక్క జ్ఞానంతో కాదు”; అంటే, “మాటలలోని జ్ఞానంతో కాదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నిష్ఫలం కాకుండేందుకు” లేదా “ఖాళీ చేయబడకుండేందుకు”; భావార్థంగా, “దాని శక్తిని కోల్పోకుండేందుకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: మెస్సీయ / మెస్సీయ సిలువ
  rationale: Χριστόςను అర్థవంతమైన బిరుదుగా అనువదించి, వచనంలోని రెండు సందర్భాల్లోనూ ఒకే విధంగా ఉంచాం.
- source_word: βαπτίζειν
  choice: బాప్తిస్మం ఇవ్వడానికి
  rationale: తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన, సందర్భానికి సహజమైన పదబంధం; ‘ముంచడానికి’ అనే సంకుచిత వివరణను ప్రధాన పాఠ్యంలోకి తేవదు.
- source_word: εὐαγγελίζεσθαι
  choice: సువార్త ప్రకటించడానికి
  rationale: శుభవార్తను తెలియజేయడం అనే క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: σοφίᾳ λόγου
  choice: మాటల జ్ఞానంతో
  rationale: λόγοςను ఇక్కడ మాట లేదా ప్రసంగంగా గ్రహిస్తూ, గ్రీకు పదబంధంలోని సంక్షిప్తతను మరియు కొంత అస్పష్టతను నిలుపుతుంది.
- source_word: κενωθῇ
  choice: వ్యర్థం చేయబడకుండటానికి
  rationale: క్రియ యొక్క కర్మణి రూపాన్ని నిలుపుతూ, సిలువ తన ప్రభావాన్ని కోల్పోయే భావాన్ని అదనపు సిద్ధాంత వివరణ లేకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σταυρὸς
  choice: సిలువ
  rationale: పౌలు వాడుకలోని ప్రామాణికమైన, ప్రత్యక్ష తెలుగు సమానార్థకం.
theological_decisions:
- issue: Χριστόςను అనువదించిన బిరుదుగా ఇవ్వాలా, సంప్రదాయ రూపమైన ‘క్రీస్తు’గా ఉంచాలా?
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ పదంలోని అభిషిక్త రాజు అనే బిరుదు భావాన్ని పాఠకుడికి స్పష్టంగా అందించడానికి ‘మెస్సీయ’ను ఎంచుకున్నాం; రెండు సందర్భాల్లోనూ ఏకరీతిగా వాడాం.
- issue: κενωθῇలో సిలువ ‘వ్యర్థం’ కావడం అంటే దాని శక్తి తొలగిపోవడమని స్పష్టంగా చేర్చాలా?
  choice: వ్యర్థం చేయబడకుండటానికి
  alternative: దాని శక్తి లేకుండా చేయబడకుండటానికి
  rationale: మూలంలో ‘శక్తి’ అనే నామవాచకం లేదు. అందువల్ల భావాన్ని అతిగా వివరిచకుండా, గ్రీకు రూపకంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు οὐ…ἀλλὰ విరోధాన్ని ‘పంపలేదు; … పంపాడు’తో సహజంగా వ్యక్తం చేశాం. చివరి ఉద్దేశ్య వాక్యంలో కర్తను తెలుగులో స్పష్టపరచడానికి ‘అలా ప్రకటిస్తే’ చేర్చాం; ఇది మాటల జ్ఞానాన్ని ఆశ్రయించిన ప్రకటన సిలువను వ్యర్థం చేయకూడదనే సంబంధాన్ని తెలియజేస్తుంది.
