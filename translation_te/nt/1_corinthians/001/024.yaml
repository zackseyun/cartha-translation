id: 1CO.1.24
reference: 1 Corinthians 1:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: te
  text: అయితే పిలువబడినవారికి—యూదులకూ గ్రీకులకూ—మెస్సీయ[a] దేవుని శక్తి, దేవుని జ్ఞానం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రీస్తు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: పిలువబడినవారికి
  rationale: నామవాచకంగా పనిచేస్తున్న విశేషణానికి ఉన్న దైవిక పిలుపు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ἰουδαίοις
  choice: యూదులకు
  rationale: గ్రీకులతో ఉన్న ఈ పౌలు వాడుకలో జాతి-మత సమూహాన్ని సూచిస్తుంది.
- source_word: Ἕλλησιν
  choice: గ్రీకులకు
  rationale: ‘అన్యజనులు’ అనే విస్తృత వ్యాఖ్యానానికి బదులు మూలంలోని నిర్దిష్ట పదాన్ని నిలుపుతుంది.
- source_word: Χριστόν
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός పేరు కంటే బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను వాడాం.
- source_word: θεοῦ δύναμιν
  choice: దేవుని శక్తి
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: θεοῦ σοφίαν
  choice: దేవుని జ్ఞానం
  rationale: మూలంలోని సమాంతర నిర్మాణాన్ని, ‘దేవుని’ అనే పునరుక్తిని నిలుపుతుంది.
- source_word: implicit copula / verbless predicate relation
  choice: మెస్సీయ దేవుని శక్తి, దేవుని జ్ఞానం
  rationale: గ్రీకులో క్రియలేని విధేయ నిర్మాణాన్ని తెలుగులో కూడా సహజంగా నిలిపి, ముందరి వచనంపై ఆధారపడే వాక్య సంబంధాన్ని అతిగా వివరించదు.
theological_decisions:
- issue: క్రీస్తు సంబంధమైన బిరుదుగా Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో బిరుదు భావం సజీవంగా ఉంది; ‘మెస్సీయ’ గ్రీకు బిరుదు యొక్క అర్థాన్ని తెలియజేస్తుంది. సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. యూదులు–గ్రీకులు అనే సమాంతరతను డాష్‌లతో స్పష్టంచేశాం; మూలంలోని ‘దేవుని’ పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
