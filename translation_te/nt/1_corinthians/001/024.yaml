revisions:
- from: అయితే పిలువబడినవారికి—యూదులకైనా గ్రీకులకైనా—మెస్సీయ[a] దేవుని శక్తి, దేవుని జ్ఞానం.
  to: అయితే పిలువబడినవారికి—యూదులకూ గ్రీకులకూ—మెస్సీయ[a] దేవుని శక్తి, దేవుని జ్ఞానం.
  rationale: A minimal correction replaces the potentially disjunctive/concessive కైనా construction with inclusive dative coordination, matching τε καὶ (‘both … and’). All other wording, including the title rendering, the Greek ellipsis, and the repeated ‘దేవుని,’ is retained.
  reviewer_model: gpt-5.6-terra
