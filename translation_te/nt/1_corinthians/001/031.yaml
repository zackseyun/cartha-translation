id: 1CO.1.31
reference: 1 Corinthians 1:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα καθὼς γέγραπται· Ὁ καυχώμενος ἐν κυρίῳ καυχάσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/031.yaml
  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: te
  text: 'దీనివల్ల, వ్రాయబడి ఉన్నట్లుగా: “గర్వించేవాడు ప్రభువులో గర్వించాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: కాబట్టి
  rationale: ముందటి వాక్యంలో చెప్పిన దేవుని కార్యానికి అనుసరించే ఫలితాన్ని తెలుగులో సహజంగా సూచిస్తుంది. ఈ సందర్భంలో గ్రీకు ἵνα ఉద్దేశం–ఫలితం మధ్యనున్న భావాన్ని కలిగి ఉంది.
- source_word: καθὼς γέγραπται
  choice: వ్రాయబడి ఉన్నట్లుగా
  rationale: లేఖన ఉల్లేఖన సూత్రాన్ని, అలాగే వ్రాయబడిన మాటకు కొనసాగుతున్న ప్రామాణికతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ὁ καυχώμενος
  choice: గర్వించేవాడు
  rationale: నామవాచకంగా పనిచేసే గ్రీకు కృదంతాన్ని సంక్షిప్తమైన తెలుగు వ్యక్తీకరణతో అందిస్తుంది. ఇక్కడ καυχάομαι తన ఆధారం లేదా అతిశయాన్ని ప్రకటించడాన్ని సూచిస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులోనే
  rationale: ἐν అనే సంబంధాన్ని ‘లో’తో నిలిపి, వాక్యంలోని విరుద్ధ దృష్ట్యా ‘నే’ ద్వారా గర్వానికి సరైన ఆధారం ప్రభువు మాత్రమేనని సందర్భబద్ధంగా వ్యక్తపరుస్తుంది.
- source_word: καυχάσθω
  choice: గర్వించాలి
  rationale: మూడవ పురుష ఆజ్ఞార్థక రూపంలోని నియమాత్మక బలాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఉల్లేఖనంలోని ఆజ్ఞార్థక బలం
  choice: గర్వించాలి
  alternative: గర్వించనివ్వండి
  rationale: ‘గర్వించాలి’ అనేది ఆజ్ఞ లేదా నియమాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయం తెలుగులో అనుమతి ఇస్తున్న భావాన్ని కలిగించే అవకాశం ఉంది.
- issue: κύριος పదం మరియు గర్వానికి ఆధారం
  choice: ప్రభువులోనే
  alternative: ప్రభువులో
  rationale: ‘ప్రభువు’ κύριοςకు సాంప్రదాయబద్ధమైన, సహజమైన అనువాదం. ‘నే’ సందర్భంలోని స్వీయగర్వం–ప్రభువులో గర్వం అనే వ్యత్యాసాన్ని స్పష్టం చేస్తుంది; కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనదైనా గౌరవప్రదమైన లేఖన శైలి. ‘అతిశయించు’ కంటే సాధారణ పాఠకులకు స్పష్టమైన ‘గర్వించు’ ఎంచుకోబడింది.
