revisions:
- from: 'కాబట్టి, వ్రాయబడి ఉన్నట్లుగా: “గర్వించేవాడు ప్రభువులోనే గర్వించాలి.”[a]'
  to: 'దీనివల్ల, వ్రాయబడి ఉన్నట్లుగా: “గర్వించేవాడు ప్రభువులో గర్వించాలి.”'
  rationale: The revision replaces the inferential connector with a result-oriented expression for ἵνα and removes the unsupported restrictive "నే." It retains the scriptural-citation formula, the modern standard term "ప్రభువు," and the imperative force of the final verb.
  reviewer_model: gpt-5.6-terra
