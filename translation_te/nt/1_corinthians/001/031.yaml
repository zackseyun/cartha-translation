review_pass:
  verdict: revise
  source_fidelity: The opening "కాబట్టి" means “therefore” and does not adequately represent ἵνα, which introduces the purpose/result clause. The added restrictive "నే" in "ప్రభువులోనే" is not explicit in ἐν κυρίῳ, even though it may be contextually inferable. The imperative sense of καυχάσθω is otherwise conveyed well by "గర్వించాలి."
  naturalness: '"వ్రాయబడి ఉన్నట్లుగా" is natural modern Telugu, and the citation reads smoothly. "దీనివల్ల" gives a clear, idiomatic connection to the preceding statement while retaining the result-oriented force of ἵνα.'
  terminology: '"ప్రభువు" appropriately renders κυρίῳ. "గర్వించు" is understandable modern Telugu for καυχάομαι in this context, though it can have a negative sense outside context; the explicit contrast in the verse sufficiently directs its meaning to boasting/glorying. No lexical footnote is needed for the removed non-source restrictive particle.'
  issues:
  - severity: medium
    issue: ἵνα is rendered as "కాబట్టి."
    rationale: '"కాబట్టి" is inferential (“therefore”), whereas ἵνα introduces the purpose/result for what precedes. A result-oriented Telugu connector is required.'
  - severity: low
    issue: '"ప్రభువులోనే" adds an explicit restrictive particle.'
    rationale: The Greek reads ἐν κυρίῳ (“in the Lord”) without a particle corresponding to “only.” The contextual contrast should not be converted into an added lexical restriction, and the associated footnote becomes unnecessary.
  revised_text: 'దీనివల్ల, వ్రాయబడి ఉన్నట్లుగా: “గర్వించేవాడు ప్రభువులో గర్వించాలి.”'
  revised_footnotes: []
  revision_rationale: The revision replaces the inferential connector with a result-oriented expression for ἵνα and removes the unsupported restrictive "నే." It retains the scriptural-citation formula, the modern standard term "ప్రభువు," and the imperative force of the final verb.
