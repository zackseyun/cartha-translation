id: 1CO.1.13
reference: 1 Corinthians 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: te
  text: మెస్సీయ[a] విభజించబడ్డాడా? మీ కోసం పౌలు సిలువ వేయబడ్డాడా? లేక పౌలు నామంలోకి[b] మీరు బాప్తిస్మం పొందారా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పౌలు నామంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: విభజించబడ్డాడా
  rationale: గ్రీకు పరిపూర్ణ కర్మణి రూపం విభజన జరిగి ఏర్పడిన స్థితిని సూచిస్తుంది. తెలుగు ప్రశ్నలో ఈ కర్మణి రూపం పౌలు గద్దింపును సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ὁ Χριστός
  choice: మెస్సీయ
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న Χριστός ఇక్కడ బిరుదుగా స్పష్టంగా పనిచేస్తుంది; అందువల్ల దాని భావాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠంలో ఉంచాం.
- source_word: μὴ
  choice: ప్రశ్నారూపంలో అంతర్భావం
  rationale: μή ప్రతికూల సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను సూచిస్తుంది. తెలుగులో అదనంగా ‘కాదుగదా’ వంటి వివరణాత్మక పదం చేర్చకుండా ప్రశ్నారూపమే ఆ అంచనాను సహజంగా తెలియజేస్తుంది.
- source_word: ἐσταυρώθη
  choice: సిలువ వేయబడ్డాడా
  rationale: గ్రీకు భూతకాల కర్మణి రూపాన్ని నేరుగా, సాధారణ తెలుగు బైబిలు పదజాలంలో ప్రతిబింబిస్తుంది.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ కోసం
  rationale: ‘మీ పక్షంగా/మీ నిమిత్తం’ అనే పరిధిని అతిగా నిర్దిష్టం చేయకుండా ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὸ ὄνομα
  choice: నామంలోకి
  rationale: εἰς లోని దిశాత్మక, అనుబంధ భావాన్ని ‘లోకి’ నిలుపుతుంది; కేవలం ‘నామంలో’ అని మార్చి ఆ సూక్ష్మతను తొలగించలేదు.
- source_word: ἐβαπτίσθητε
  choice: మీరు బాప్తిస్మం పొందారా
  rationale: కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగు వాడుకలో తెలియజేస్తూ, బాప్తిస్మ విధానాన్ని అదనంగా నిర్దేశించదు.
theological_decisions:
- issue: పౌలు అలంకారిక ప్రశ్నలో Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ὁ Χριστός ఇక్కడ బిరుదు భావాన్ని ముందుకు తెస్తుంది. ‘మెస్సీయ’ ఆ బిరుదు యొక్క అర్థాన్ని వ్యక్తం చేస్తుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఉంచి ప్రత్యామ్నాయాన్ని కనిపించేలా చేశాం.
- issue: εἰς τὸ ὄνομα లో బాప్తిస్మ సంబంధం
  choice: నామంలోకి
  alternative: నామంలో
  rationale: ‘నామంలోకి’ అనేది అనుబంధం లేదా విధేయత వైపు దిశను సూచించగల గ్రీకు నిర్మాణాన్ని భద్రపరుస్తుంది; దాని ఖచ్చితమైన ధార్మిక స్వభావాన్ని వివరణతో నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే ప్రశ్నారూపాన్ని వాడాం. మూడు అలంకారిక ప్రశ్నల పదునును నిలిపి, సమాధానం ‘కాదు’ అని పాఠ్యంలో అదనంగా చేర్చలేదు. ‘నామంలోకి’ కొంత అసాధారణంగా వినిపించినా మూలంలోని εἰς దిశాత్మకతను కాపాడుతుంది; సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
