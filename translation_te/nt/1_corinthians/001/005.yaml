  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἐν παντὶ ἐπλουτίσθητε ἐν αὐτῷ, ἐν παντὶ λόγῳ καὶ πάσῃ γνώσει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/005.yaml
  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: te
  text: ఎందుకంటే ఆయనలో మీరు ప్రతి విధంగానూ, ప్రతి రకమైన మాటలోను సమస్త జ్ఞానంలోను సమృద్ధులుగా చేయబడ్డారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని పౌలు కృతజ్ఞతకు ఈ వాక్యం కారణాన్ని తెలియజేస్తోంది; అందువల్ల కారణార్థకమైన ‘ఎందుకంటే’ సహజంగా ఉంది.
- source_word: ἐν παντὶ
  choice: ప్రతి విషయంలోనూ
  rationale: ఈ నపుంసక ఏకవచన ప్రయోగం సమగ్రతను సూచిస్తుంది; ‘ప్రతి విషయంలోనూ’ ఆధునిక తెలుగులో విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐπλουτίσθητε
  choice: సంపన్నులుగా చేయబడ్డారు
  rationale: అన్యునిచేత పొందిన సమృద్ధిని సూచించే కర్మణి రూపాన్ని, భౌతిక ధనానికే పరిమితం చేయకుండా, ఈ అనువాదం నిలుపుతుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: ἐν ఇక్కడ క్రీస్తుతో సంబంధం లేదా ఆయనలోని పరిధిని సూచిస్తుంది; ‘ఆయనలో’ అనే రూపం పౌలు వాడే క్రీస్తుతో ఐక్యత భావాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ἐν παντὶ λόγῳ
  choice: మాటలోను
  rationale: γνῶσιςతో జతగా ఉన్న λόγος ఇక్కడ మాట లేదా వాచిక వ్యక్తీకరణను సూచించే అవకాశం ఎక్కువ; ‘మాటలోను’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: πάσῃ γνώσει
  choice: సమస్త జ్ఞానంలోను
  rationale: γνῶσις యొక్క విస్తృత భావాన్ని నిలుపుతూ, λόγοςతో ఉన్న సమాంతర నిర్మాణాన్ని ఈ రూపం ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ἐν αὐτῷలోని ἐν యొక్క భావం
  choice: ఆయనలో
  alternative: ఆయనచేత / ఆయన ద్వారా
  rationale: కర్తృత్వం లేదా సాధనార్థాన్ని స్పష్టీకరించి మూలంలోని సంబంధాత్మక పరిధిని తగ్గించకుండా, గ్రీకు పదబంధంలోని నిజమైన భావవిస్తృతిని ‘ఆయనలో’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు కర్మణి నిర్మాణం, ‘ఆయనలో’ అనే పౌలు సంబంధాత్మక భాష, అలాగే మాట–జ్ఞానం సమాంతరతను నిలిపాం.
