translation:
  language: te
  text: దేవుని ఎదుట ఏ మానవుడూ గొప్పలు చెప్పుకోకుండునట్లు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని ఎదుట ఏ మనిషీ గొప్పలు చెప్పుకోకుండునట్లు.” అక్షరార్థంగా, “ఏ శరీరమూ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως μὴ
  choice: చెప్పుకోకుండా ఉండేందుకే
  rationale: ὅπως ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; μὴ తో కలిసి వచ్చే ఉపవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో ప్రతికూల ఉద్దేశంగా వ్యక్తం చేస్తుంది. ముందున్న వాక్యంతో ఈ వచనం కొనసాగుతున్నందున ‘ఉండేందుకే’ అనుసంధానాన్ని నిలుపుతుంది.
- source_word: καυχήσηται
  choice: గొప్పలు చెప్పుకోకుండా
  rationale: ఈ సందర్భంలో తన గురించి గర్వంగా అతిశయించడాన్ని సూచిస్తుంది. ‘గొప్పలు చెప్పుకోవడం’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతూ మధ్యమప్రయోగంలోని స్వీయసంబంధ ఛాయను కూడా తెలియజేస్తుంది.
- source_word: πᾶσα σὰρξ
  choice: ఏ శరీరమూ
  rationale: మూలంలోని ‘సమస్త శరీరం’ అనే హెబ్రీయ ప్రభావిత వ్యక్తీకరణ ప్రతికూల వాక్యంలో ‘ఏ శరీరమూ’గా సహజంగా వస్తుంది. ఇది మానవులందరినీ సూచిస్తూనే σάρξ యొక్క రూపక-వేదగ్రంథీయ పదచిత్రాన్ని నిలుపుతుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని ఎదుట
  rationale: దేవుని సన్నిధిలో లేదా ఆయన సమక్షంలో అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేసే ప్రామాణిక తెలుగు ప్రయోగం.
theological_decisions:
- issue: పౌలు వాడిన σάρξ పదానికి అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘శరీరం’ అని ఉంచడం
  alternative: ‘మనిషి’ లేదా ‘మానవుడు’
  rationale: ఇక్కడ σάρξ అంతర్గతమైన ‘పాప స్వభావం’ను సూచించదు; దేవుని ఎదుట బలహీనమైన సృష్టిజీవులైన మానవాళిని సూచిస్తుంది. ‘శరీరం’ మూలంలోని వేదగ్రంథీయ పదచిత్రాన్ని, ఉద్దేశపూర్వకమైన ఉద్వేగాన్ని కాపాడుతుంది; పాదసూచిక భావాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ఇది ముందున్న వాక్యాన్ని ముగించే ఉద్దేశ ఉపవాక్యం కావడంతో వాక్యఖండ స్వరూపాన్ని నిలిపింది.
