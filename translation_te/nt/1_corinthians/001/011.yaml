  terminology: “నా సహోదరులారా” appropriately reflects the masculine-plural vocative ἀδελφοί; the footnote responsibly notes its likely inclusive communal reference. “కలహాలు” is a suitable equivalent for ἔριδες. The revised Chloe phrase does not over-specify a household.
