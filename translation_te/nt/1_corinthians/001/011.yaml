id: 1CO.1.11
reference: 1 Corinthians 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: te
  text: 'ఎందుకంటే, నా సహోదరులారా[a], మీ గురించి క్లోయేకు సంబంధించినవారి[b] ద్వారా నాకు తెలియజేయబడింది: మీ మధ్య కలహాలు ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా సహోదర సహోదరీలారా.’ గ్రీకులో ‘సహోదరులు’ అని ఉంది; ఈ సంబోధన విశ్వాసుల సమాజమంతటినీ సమగ్రంగా ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, క్లోయేతో సంబంధమున్నవారు; బహుశా ఆమె ఇంటివారు కావచ్చు.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐδηλώθη
  choice: నాకు తెలిసింది
  rationale: కర్త తెలియని కర్మణి ప్రయోగం ద్వారా పౌలుకు సమాచారం తెలియజేయబడిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఎవరు తెలియజేశారో తరువాతి పదబంధం సూచిస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని విజ్ఞప్తికి ఈ వాక్యం కారణం లేదా వివరణను ఇస్తున్న సంబంధాన్ని నిలుపుతుంది.
- source_word: περὶ ὑμῶν
  choice: మీ గురించి
  rationale: గ్రీకు సంబంధార్థక పదబంధానికి సహజమైన, నేరమైన తెలుగు సమానం.
- source_word: ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: గ్రీకులోని పురుష బహువచన సంబోధనను యథాతథంగా ఉంచుతుంది; అది విశ్వాసుల సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చనే విషయాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: ὑπὸ τῶν Χλόης
  choice: క్లోయేకు చెందినవారి ద్వారా
  rationale: ఈ పదబంధం క్లోయేతో సంబంధమున్న వ్యక్తులను సూచిస్తుంది. ‘ఇంటివారు’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని కుటుంబ లేదా గృహ సంబంధాన్ని నిర్దిష్టం చేసినట్లవుతుంది.
- source_word: ἔριδες
  choice: కలహాలు
  rationale: వ్యక్తుల మధ్య ఉన్న ఘర్షణలు, వాదవివాదాలను సూచించే సహజమైన ఆధునిక తెలుగు పదం; సందర్భంలోని విస్తృతమైన ‘విభేదాలు’ అనే భావంతో దీనిని కలిపివేయదు.
- source_word: ἐν ὑμῖν εἰσιν
  choice: మీ మధ్య ... ఉన్నాయి
  rationale: ఉనికిని తెలిపే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో అందిస్తుంది.
theological_decisions:
- issue: మిశ్ర లింగ విశ్వాసుల సమాజాన్ని ఉద్దేశించే ἀδελφοί పదం
  choice: నా సహోదరులారా
  alternative: నా సహోదర సహోదరీలారా
  rationale: మూల గ్రీకులో పురుష బహువచనం ఉన్నందున ప్రధాన పాఠ్యంలో దానిని నిలుపుతూ, అది సంఘంలోని స్త్రీపురుషులందరినీ సమగ్రంగా ఉద్దేశించి ఉండవచ్చనే భావాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. వాక్య సంబంధాన్ని స్పష్టంగా ఉంచేందుకు ‘ఎందుకంటే’ నిలుపబడింది; గ్రీకు మూలంలో లేని ‘ఇంటివారు’ అనే నిర్దిష్టతను ప్రధాన పాఠ్యంలో చేర్చలేదు.
