review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the rhetorical question, the future judgment of the world by the saints, and the contextual force of ἐν ὑμῖν. However, κριτηρίων can refer to judicial cases/matters as well as courts, and the Telugu main rendering ‘న్యాయవిచారణలకు ... తగరా’ is less precise and idiomatic for Paul’s point about competence to handle minor disputes.
  naturalness: '‘మీరు అతి చిన్న న్యాయవిచారణలకు కూడా తగరా?’ is awkward in modern standard Telugu: persons are not normally described as ‘fit for proceedings.’ ‘అతి చిన్న న్యాయవిషయాలను పరిష్కరించడానికి కూడా మీరు అర్హులు కారా?’ naturally expresses the rhetorical challenge without adding a particular mechanism of adjudication.'
  terminology: ‘పరిశుద్ధులు,’ ‘లోకం,’ and ‘తీర్పు తీరుస్తారు’ are suitable and retain the register and theological restraint of the Greek. ‘న్యాయవిషయాలు’ is a broad, natural equivalent that preserves the semantic range of κριτήρια; the court sense remains available in the footnote.
  issues:
  - severity: medium
    issue: The rendering of κριτηρίων ἐλαχίστων is syntactically awkward and may obscure the intended comparison.
    rationale: The phrase concerns the least judicial matters/cases, with ‘courts’ also possible. Revising the Telugu to speak of being qualified to settle such matters makes the rhetorical force clear while retaining the lexical ambiguity in a footnote.
  - severity: low
    issue: The footnote’s wording ‘మరింత పదబద్ధంగా’ is not the most natural way to introduce a literal alternative.
    rationale: ‘మరింత అక్షరార్థంగా’ is clearer modern Telugu and accurately signals that ‘మీ మధ్య’ reflects the more literal sense of ἐν ὑμῖν.
