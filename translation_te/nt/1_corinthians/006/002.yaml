  to: లేక, పరిశుద్ధులు లోకానికి తీర్పు తీరుస్తారని మీకు తెలియదా? లోకం మీ ద్వారా[a] తీర్పు పొందబోతే, అతి చిన్న న్యాయవిషయాలను పరిష్కరించడానికి కూడా మీరు అర్హులు కారా?[b]
  rationale: The revision preserves the Greek’s rhetorical structure and eschatological claim while making the final question idiomatic Telugu. It adopts the contextually natural ‘minor judicial matters’ sense for κριτηρίων and retains the alternate ‘courts’ sense in the footnote. No doctrinal claim about the mode of the saints’ future judgment has been added.
