id: 1CO.6.2
reference: 1 Corinthians 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: te
  text: లేక, పరిశుద్ధులు లోకానికి తీర్పు తీరుస్తారని మీకు తెలియదా? లోకం మీ ద్వారా[a] తీర్పు పొందబోతే, అతి చిన్న న్యాయవిషయాలను పరిష్కరించడానికి కూడా మీరు అర్హులు కారా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ మధ్య.’ గ్రీకు పదబంధాన్ని మరింత అక్షరార్థంగా ‘లోకం మీ మధ్య తీర్పు పొందితే’ అని అనువదించవచ్చు; సందర్భంలో పరిశుద్ధులు లోకానికి తీర్పు తీర్చడంలో భాగం వహిస్తారనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతి చిన్న న్యాయస్థానాలకు.’ ఈ గ్రీకు పదబంధం అతి తక్కువ ప్రాధాన్యమున్న న్యాయవిషయాలు లేదా వాటిని విచారించే న్యాయస్థానాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: లేక
  rationale: మునుపటి వాదనను కొనసాగిస్తూ మరో స్పష్టమైన తార్కిక ప్రత్యామ్నాయాన్ని పరిచయం చేసే పదంగా సహజంగా ఉంది.
- source_word: οὐκ οἴδατε
  choice: మీకు తెలియదా
  rationale: పౌలు ఉపయోగించే పదునైన అలంకారప్రశ్నను, οἶδα యొక్క ‘తెలుసు’ అనే మూలార్థాన్ని నిలుపుతుంది.
- source_word: οἱ ἅγιοι
  choice: పరిశుద్ధులు
  rationale: దేవునికోసం ప్రత్యేకపరచబడిన విశ్వాసుల సమూహాన్ని సూచించే పౌలు వాడుకకు తగిన, పరిచితమైన పదం.
- source_word: τὸν κόσμον
  choice: లోకానికి
  rationale: κόσμος యొక్క విస్తృతమైన లోకార్థాన్ని నిలుపుతూ, ‘తీర్పు తీర్చు’తో సహజమైన తెలుగు విభక్తిని ఉపయోగిస్తుంది.
- source_word: κρινοῦσιν
  choice: తీర్పు తీరుస్తారు
  rationale: భవిష్యత్తులో జరిగే నిజమైన తీర్పులో పరిశుద్ధుల భాగస్వామ్యాన్ని తెలియజేస్తుంది; అది ఏ విధంగా జరుగుతుందో అదనంగా నిర్దేశించదు.
- source_word: ἐν ὑμῖν
  choice: మీ ద్వారా
  rationale: పదబద్ధంగా ‘మీలో/మీ మధ్య’ అనగల గ్రీకు ప్రయోగాన్ని, ఈ న్యాయసందర్భంలో విశ్వాసుల భాగస్వామ్యాన్ని సూచించే సాధనార్థక భావంతో సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: κρίνεται
  choice: తీర్పు పొందబోతే
  rationale: షరతు వాక్యంలో ఉన్న వర్తమాన కర్మణి రూపానికి సందర్భానుగుణమైన భవిష్యదర్థాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνάξιοί ἐστε
  choice: మీరు తగరా
  rationale: ‘అర్హతలేని/తగని’ అనే మూల్యాంకన భావాన్ని సహజమైన అలంకారప్రశ్నగా నిలుపుతుంది.
- source_word: κριτηρίων ἐλαχίστων
  choice: అతి చిన్న న్యాయవిచారణలకు
  rationale: న్యాయస్థానాలు లేదా విచారణకు వచ్చే విషయాలు అనే భావపరిధిలో, సందర్భానికి సహజమైన ‘న్యాయవిచారణలు’ను ఎంచుకుని ἐλαχίστων యొక్క అతిశయార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘పరిశుద్ధులు’ ఎవరు
  choice: దేవుని ప్రజలైన విశ్వాసులు సమూహంగా
  alternative: అసాధారణ పవిత్రత కలిగిన కొద్దిమంది విశ్వాసులు మాత్రమే
  rationale: పౌలు రచనల్లో οἱ ἅγιοι సాధారణంగా క్రైస్తవ విశ్వాసుల సమూహాన్నే సూచిస్తుంది; అనువాదం ప్రత్యేకమైన ఉన్నత వర్గాన్ని సూచించదు.
- issue: పరిశుద్ధులు లోకానికి తీర్పు తీర్చడం
  choice: భవిష్యత్తు తీర్పులో నిజమైన భాగస్వామ్యం; దాని విధానం నిర్దేశించబడలేదు
  alternative: కేవలం రూపకాలంకారమైన నైతిక అంచనా, లేదా స్వతంత్రమైన సంపూర్ణ న్యాయాధికారం
  rationale: వాక్యం తీర్పులో వారి భాగస్వామ్యాన్ని స్పష్టంగా చెబుతుంది గాని, అది ఎలా అమలవుతుందో వివరించదు; ఆ ఉద్రిక్తతను అనువాదం అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. పౌలు అలంకారప్రశ్నల పదును నిలిపి, న్యాయసంబంధ పదజాలాన్ని అతిగా సాంకేతికంగా చేయలేదు.
