source:
  edition: SBLGNT
  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: te
  text: లేక, మీలో ఉన్న, దేవుని నుండి మీకు లభించిన పవిత్రాత్మకు మీ దేహం ఆలయమని మీకు తెలియదా?[a] అలాగే, మీరు మీకు మీరే సొంతం కారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీలో ఉన్న పవిత్రాత్మ యొక్క ఆలయం.”
    reason: గ్రీకు పదబంధాన్ని ‘మీలో ఉన్న పవిత్రాత్మకు ఆలయం’ అని సహజమైన సంబంధనిర్మాణంతోనూ, ‘మీలో ఉన్న పవిత్రాత్మ యొక్క ఆలయం’ అని షష్ఠీ సంబంధాన్ని మరింత స్పష్టంగా చూపిస్తూ అనువదించవచ్చు.
  - marker: b
    text: గ్రీకులో “మీ” అనేది బహువచనం, “దేహం” అనేది ఏకవచనం. ఇది “మీలో ప్రతి ఒక్కరి దేహం” అనే పంపిణీ భావంలోనైనా, సమూహానికి ప్రాతినిధ్యంగా అయినా అర్థం కావచ్చు.
    reason: మూలంలోని ఏకవచన–బహువచన నిర్మాణం కలిగించే రెండు భావసాధ్యతలను పాఠకునికి తెలియజేస్తుంది.
lexical_decisions:
- source_word: ἢ
  choice: లేక
  rationale: ముందటి వాదనకు కొనసాగింపుగా మరొక గట్టి అలంకారప్రశ్నను ప్రవేశపెడుతుంది; గ్రీకు సంధానబలాన్ని నిలుపుతుంది.
- source_word: οὐκ οἴδατε
  choice: మీకు తెలియదా
  rationale: పౌలు తరచుగా వాడే అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ σῶμα ὑμῶν
  choice: మీ దేహం
  rationale: గ్రీకులో బహువచన ‘మీ’తో ఏకవచన ‘దేహం’ ఉంది. తెలుగులోనూ ఏకవచనాన్ని నిలిపి, ప్రతి వ్యక్తిని ఉద్దేశించిందా లేక సమూహానికి ప్రాతినిధ్యంగా చెప్పిందా అనే భావసాధ్యతను తెరిచి ఉంచుతుంది.
- source_word: ναὸς
  choice: ఆలయం
  rationale: ναός సూచించే పవిత్ర ఆలయస్థల భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: మీలో ఉన్న పవిత్రాత్మకు
  rationale: పవిత్రాత్మ వారిలో ఉన్నాడనే ἐν ὑμῖν భావాన్నీ, దేహం ఆయనకు చెందిన లేదా ఆయనతో లక్షణీకరించబడిన ఆలయమనే షష్ఠీ సంబంధాన్నీ సహజ తెలుగులో నిలుపుతుంది.
- source_word: οὗ ἔχετε ἀπὸ θεοῦ
  choice: ఆయనను మీరు దేవుని నుండి పొందారు
  rationale: సంబంధసర్వనామం పవిత్రాత్మనే సూచిస్తుందని వ్యక్తిగత సూచనతో స్పష్టం చేస్తుంది. ἔχετε అక్షరార్థంగా ‘కలిగి ఉన్నారు’ అయినా, ἀπὸ θεοῦతో కలిసిన భావాన్ని తెలుగులో సహజంగా ‘దేవుని నుండి పొందారు’ అని వ్యక్తం చేస్తుంది.
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: అంతేకాక, మీరు మీ సొంతం కారు
  rationale: వారు తమకే చెందినవారు కారనే గ్రీకు ప్రతిబింబక షష్ఠీ నిర్మాణపు భావాన్ని సంక్షిప్తంగా, సహజంగా ఇస్తుంది; తరువాతి వచనంలోని కారణానికి మార్గం సిద్ధం చేస్తుంది.
theological_decisions:
- issue: οὗ అనే సంబంధసర్వనామం దేనిని సూచిస్తుంది, దాన్ని వ్యక్తిగతంగా ఎలా అనువదించాలి
  choice: అది పవిత్రాత్మను సూచిస్తుందని ‘ఆయనను’ అని అనువదించబడింది.
  alternative: వ్యక్తిగత సర్వనామం లేకుండా వాక్యాన్ని ‘దేవుని నుండి పొందిన పవిత్రాత్మ’ అని పునర్నిర్మించడం.
  rationale: గ్రీకు వ్యాకరణంలో οὗ అనేది ἁγίου πνεύματόςను తిరిగి సూచిస్తుంది. ‘ఆయనను’ అనడం ఆ సంబంధాన్ని కాపాడుతుంది; అదనపు సిద్ధాంతపదజాలాన్ని చేర్చదు.
- issue: బహువచన శ్రోతలతో ఏకవచన ‘దేహం’
  choice: ‘మీ దేహం’ అనే ఏకవచన రూపం నిలుపబడింది.
  alternative: ‘మీ దేహాలు’ అని బహువచనం చేయడం.
  rationale: τὸ σῶμα ఏకవచనం, ὑμῶν బహువచనం. మూలంలోని ఈ ఉద్రిక్తతను నిలిపితే అది ప్రతి విశ్వాసికి విడివిడిగా వర్తిస్తుందా లేక సమూహాన్ని ప్రాతినిధ్యంగా సూచిస్తుందా అనే ప్రశ్నను అనువాదం ముందుగానే తీర్చదు.
- issue: దేహం ‘పవిత్రాత్మ ఆలయం’ అనే షష్ఠీ సంబంధం
  choice: ‘పవిత్రాత్మకు ఆలయం’ అని అనువదించబడింది.
  alternative: ‘పవిత్రాత్మ యొక్క ఆలయం’ లేదా ‘పవిత్రాత్మ ఆలయం’.
  rationale: తెలుగులో ‘కు ఆలయం’ అనే నిర్మాణం దేహం పవిత్రాత్మకు చెందిన పవిత్ర నివాసస్థలమనే భావాన్ని సహజంగా తెలుపుతుంది; సంబంధాన్ని అతిగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే వాక్యంలోని పవిత్రతాభావం మరియు పౌలు అలంకారప్రశ్న యొక్క గంభీరత నిలిచేలా రూపొందించబడింది. ‘దేహం,’ ‘పవిత్రాత్మ,’ ‘ఆలయం’ వంటి విస్తృతంగా అర్థమయ్యే గౌరవప్రద పదాలు వాడబడ్డాయి.
