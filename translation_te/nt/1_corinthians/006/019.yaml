revisions:
- from: లేక, మీ దేహం మీలో ఉన్న పవిత్రాత్మకు ఆలయమని, ఆయనను మీరు దేవుని నుండి పొందారని మీకు తెలియదా?[a] అంతేకాక, మీరు మీ సొంతం కారు.[b]
  to: లేక, మీలో ఉన్న, దేవుని నుండి మీకు లభించిన పవిత్రాత్మకు మీ దేహం ఆలయమని మీకు తెలియదా?[a] అలాగే, మీరు మీకు మీరే సొంతం కారు.[b]
  rationale: The revision retains the source’s rhetorical force and ambiguity while improving Telugu syntax. ‘దేవుని నుండి మీకు లభించిన’ expresses the Spirit’s present possession as one given from God, without the draft’s explicit past-tense main assertion. The revised footnote a is grammatically unambiguous and continues to mark the same alternative phrasing.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:03:43Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the rhetorical question, singular ‘body’ with plural ‘your,’ the temple metaphor, and the concluding assertion. However, ‘ఆయనను మీరు దేవుని నుండి పొందారని’ shifts the present ἔχετε (‘you have’) to a completed past acquisition and makes the Telugu syntax unnecessarily discontinuous. Recasting the Holy Spirit phrase as a unified modifier preserves both the referent and the source relation more naturally.
  naturalness: ‘మీలో ఉన్న, దేవుని నుండి మీకు లభించిన పవిత్రాత్మకు మీ దేహం ఆలయమని’ is clear modern standard Telugu and avoids the awkward sequence in which ‘ఆయనను’ is separated from its antecedent. ‘మీకు మీరే సొంతం కారు’ idiomatically conveys that they do not belong to themselves.
  terminology: ‘దేహం,’ ‘పవిత్రాత్మ,’ and ‘ఆలయం’ are appropriate, widely understood, and suitably dignified. ‘పవిత్రాత్మకు ఆలయం’ naturally expresses the genitive relationship without imposing a theological interpretation beyond the Greek.
  issues:
  - severity: medium
    issue: The rendering ‘ఆయనను మీరు దేవుని నుండి పొందారని’ uses a completed-past verb.
    rationale: ἔχετε is present (‘you have’). Although receiving from God is implied, the translation should not explicitly recast the assertion as solely a past event.
  - severity: low
    issue: Footnote a’s alternative, ‘మీలోని పవిత్రాత్మ ఆలయం,’ is structurally ambiguous in Telugu.
    rationale: It can be read as a predicate identifying the temple with the Holy Spirit rather than clearly as ‘a temple of the Holy Spirit.’ The alternative should retain an explicit relational construction.
  revised_text: లేక, మీలో ఉన్న, దేవుని నుండి మీకు లభించిన పవిత్రాత్మకు మీ దేహం ఆలయమని మీకు తెలియదా?[a] అలాగే, మీరు మీకు మీరే సొంతం కారు.[b]
