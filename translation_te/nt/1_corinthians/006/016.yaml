revisions:
- from: లేక, వేశ్యతో కలిసేవాడు ఆమెతో ఒకే శరీరమవుతాడని మీకు తెలియదా? ఎందుకంటే, ఆయన చెప్పినట్లుగా[a], “ఆ ఇద్దరూ ఒకే శరీరమవుతారు.”
  to: 'లేక, వేశ్యతో కలిసేవాడు ఆమెతో ఒకే శరీరమవుతాడని మీకు తెలియదా? ఎందుకంటే, ఆయన ఇలా చెబుతున్నాడు[a]: “ఆ ఇద్దరూ ఒకే మాంసమవుతారు.”'
  rationale: The revision preserves the draft’s clear modern Telugu while restoring the source-text distinction between σώμα (“శరీరం”) and σάρξ (“మాంసం”). It also renders φησίν with a direct present-tense citation formula. No additional doctrinal interpretation is introduced.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:03:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the rhetorical question, the generic reference to a prostitute, and Paul’s appeal to Genesis. However, it renders both σώμα and σάρξ as “శరీరం,” erasing the Greek’s deliberate lexical distinction: the first clause says “one body,” whereas the citation says “one flesh.”'
  naturalness: “వేశ్యతో కలిసేవాడు” and “మీకు తెలియదా?” are natural modern standard Telugu. “ఆయన చెప్పినట్లుగా” is somewhat less direct than the present-tense citation formula in Greek; “ఆయన ఇలా చెబుతున్నాడు” is clear and natural in this context.
  terminology: “వేశ్య” correctly represents πόρνη. “శరీరం” is suitable for σώμα; “మాంసం” is required in the Genesis quotation for σάρξ, despite the more literal phrasing, because the established “one flesh” expression is both theologically and textually significant. The footnote properly identifies the citation and explains the Greek singular verb.
  issues:
  - severity: medium
    issue: The Genesis quotation translates εἰς σάρκα μίαν as “ఒకే శరీరమవుతారు.”
    rationale: This conflates σάρξ (“flesh”) in the quotation with σώμα (“body”) in the preceding clause. Paul’s wording retains these distinct terms, and a translation should preserve the distinction rather than harmonize them.
  - severity: low
    issue: “ఆయన చెప్పినట్లుగా” renders φησίν less directly than necessary.
    rationale: φησίν is present tense, “he says.” Using “ఆయన ఇలా చెబుతున్నాడు” retains the form and introduces the quotation naturally without identifying the speaker beyond the Greek.
  revised_text: 'లేక, వేశ్యతో కలిసేవాడు ఆమెతో ఒకే శరీరమవుతాడని మీకు తెలియదా? ఎందుకంటే, ఆయన ఇలా చెబుతున్నాడు[a]: “ఆ ఇద్దరూ ఒకే మాంసమవుతారు.”'
  revised_footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, ‘ఆయన చెబుతున్నాడు’; ఈ ఉల్లేఖనం ఆదికాండం 2:24 నుండి వచ్చింది.
    reason: cross_reference
  revision_rationale: The revision preserves the draft’s clear modern Telugu while restoring the source-text distinction between σώμα (“శరీరం”) and σάρξ (“మాంసం”). It also renders φησίν with a direct present-tense citation formula. No additional doctrinal interpretation is introduced.
