id: 1CO.6.16
reference: 1 Corinthians 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: te
  text: 'లేక, వేశ్యతో కలిసేవాడు ఆమెతో ఒకే శరీరమవుతాడని మీకు తెలియదా? ఎందుకంటే, ఆయన ఇలా చెబుతున్నాడు[a]: “ఆ ఇద్దరూ ఒకే మాంసమవుతారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, ‘ఆయన చెబుతున్నాడు’; ఈ ఉల్లేఖనం ఆదికాండం 2:24 నుండి వచ్చింది.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: లేక
  rationale: ముందటి వాదనకు కొనసాగింపుగా మరో అలంకారప్రశ్నను ప్రవేశపెడుతుంది.
- source_word: οὐκ οἴδατε
  choice: మీకు తెలియదా?
  rationale: పౌలు తరచుగా ఉపయోగించే అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὁ κολλώμενος
  choice: కలిసేవాడు
  rationale: κολλάομαι తెలిపే ‘అంటుకొని/కలిసి ఒక్కటవడం’ అనే భావాన్ని ఈ లైంగిక సందర్భంలో స్పష్టంగా, అతిగా వివరణ జోడించకుండా వ్యక్తం చేస్తుంది.
- source_word: τῇ πόρνῃ
  choice: వేశ్యతో
  rationale: πόρνη అనే నిర్దిష్ట అర్థాన్ని కాపాడుతుంది; గ్రీకు నిర్దేశక పదం ఇక్కడ వర్గసూచకంగా ఉంది.
- source_word: ἓν σῶμά ἐστιν
  choice: ఆమెతో ఒకే శరీరమవుతాడు
  rationale: గ్రీకులోని ‘ఒక శరీరంగా ఉన్నాడు’ అనే ఫలితస్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, సంబంధాన్ని స్పష్టం చేయడానికి ‘ఆమెతో’ అని ఉంచుతుంది.
- source_word: Ἔσονται γάρ
  choice: ఎందుకంటే ... అవుతారు
  rationale: పౌలు చెప్పిన దానికి ఆదికాండపు ఉల్లేఖనం ఆధారమని γάρ చూపుతుంది; εἰς‌తో కూడిన భవిష్యత్ రూపం ‘అవుతారు’ అనే భావాన్ని ఇస్తుంది.
- source_word: φησίν
  choice: ఆయన చెప్పినట్లుగా
  rationale: గ్రీకులోని ఏకవచన ‘ఆయన చెబుతున్నాడు’ను అలాగే నిలుపుతూ, ప్రధాన పాఠ్యంలో వక్తను అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: οἱ δύο
  choice: ఆ ఇద్దరూ
  rationale: ఉల్లేఖనంలోని ఇద్దరినీ సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: εἰς σάρκα μίαν
  choice: ఒకే శరీరమవుతారు
  rationale: ‘ఒకే మాంసం’ అనే అక్షరార్థ పదబంధం తెలుగులో అసహజంగా ఉండగలందున, ఇక్కడి శారీరక-సంబంధ ఐక్యతను ‘ఒకే శరీరం’గా వ్యక్తం చేస్తుంది; అదే పదప్రయోగం వాక్యపు మొదటి భాగంతో అనుసంధానాన్ని కాపాడుతుంది.
theological_decisions:
- issue: వివాహానికి వెలుపల లైంగిక కలయికకు ఆదికాండం 2:24 ఉల్లేఖనం వర్తించే విధానం
  choice: వేశ్యతో లైంగిక కలయిక నిజమైన శారీరక ‘ఒకే శరీరం’ ఐక్యతను కలిగిస్తుందనే పౌలు వాదనకు ఉల్లేఖనాన్ని నేరుగా ఆధారంగా చూపించడం.
  alternative: ఈ ఉల్లేఖనాన్ని వివాహానికి మాత్రమే పరిమితం చేయడం, లేదా వచనంలో లేని విస్తృత వివాహ సిద్ధాంతాన్నీ నైతిక నిర్ధారణలనూ అనువాదంలో చేర్చడం.
  rationale: పౌలు ఆదికాండం 2:24ను వేశ్యతో కలయికకు సాదృశ్యంగా వర్తింపజేస్తున్నాడు. ఆ ఉద్రిక్తతను నిలుపుతూ, గ్రీకు పాఠ్యం చెప్పిన దానికంటే ఎక్కువగా వివరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వేశ్య’ మూలపదంలోని నిర్దిష్ట అర్థాన్ని ఉంచుతుంది. ‘ఒకే శరీరం’ అనే పదబంధాన్ని వచనంలోని రెండు భాగాల్లోనూ వాడి పౌలు వాదనలోని పదసంబంధాన్ని నిలిపాం.
