id: 1CO.6.12
reference: 1 Corinthians 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: te
  text: “అన్నీ నాకు అనుమతించబడ్డాయి”[a]—కాని అన్నీ మేలు కలిగించవు.[b] “అన్నీ నాకు అనుమతించబడ్డాయి”—కాని నేను దేనికీ లోబడను.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ఉల్లేఖన చిహ్నాలు లేకుండా: అన్నీ నాకు అనుమతించబడ్డాయి. ఇది కొరింథీయులు వాడిన నినాదమని, పౌలు దాన్ని ఉటంకించి పరిమితం చేస్తున్నాడని చాలామంది అర్థం చేసుకుంటారు.'
    reason: alternative_reading
  - marker: b
    text: లేదా ప్రయోజనకరంగా ఉండవు; సహాయకరంగా ఉండవు.
    reason: lexical_alternative
  - marker: c
    text: లేదా దేనినీ నాపై అధికారం చెలాయించనివ్వను.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: అన్నీ
  rationale: నపుంసక బహువచనం సమగ్ర భావాన్ని తెలియజేస్తుంది. తెలుగులో ‘అన్నీ’ సహజంగా ఉండి, రెండుసార్లు వచ్చే నినాదసదృశ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: μοι
  choice: నాకు
  rationale: ἔξεστιν‌తో వచ్చిన చతుర్థీ విభక్తి, ఎవరికి అనుమతి ఉందో సూచిస్తుంది; ‘నాకు’ సహజమైన తెలుగు రూపం.
- source_word: ἔξεστιν
  choice: అనుమతించబడ్డాయి
  rationale: ఈ క్రియ అనుమతించబడినదాన్ని లేదా చేయడానికి అధికారం ఉన్నదాన్ని సూచిస్తుంది. ‘ధర్మసమ్మతమైనవి’ కంటే ఇది ఆధునిక పాఠకులకు సహజంగా ఉంటుంది; చట్టపరమైన భావానికే పరిమితం చేయదు.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: కాని అన్నీ మేలు కలిగించవు
  rationale: συμφέρει ఇక్కడ ప్రయోజనకరంగా లేదా మేలుకరంగా ఉండడాన్ని సూచిస్తుంది. ‘మేలు కలిగించవు’ వాణిజ్యార్థాన్ని కలిగించే ‘లాభకరం’ కంటే విస్తృత నైతిక, ప్రాయోగిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: కాని నేను ... లోబడను
  rationale: భవిష్యత్ కర్మణి రూపం ఏదో ఒకటి తనపై అధికారం చెలాయించనివ్వకపోవడాన్ని సూచిస్తుంది. స్పష్టంగా ఉన్న ἐγώ యొక్క ఉద్ఘాటనను ‘నేను’ నిలుపుతుంది.
- source_word: ὑπό τινος
  choice: దేనికీ
  rationale: τινος వ్యాకరణపరంగా వ్యక్తిని గానీ వస్తువును గానీ సూచించగలదు. ప్రస్తుత సందర్భంలో క్రియలు, కోరికలు, విషయాలు ప్రధానంగా ఉన్నందున ‘దేనికీ’ సరిపోతుంది; మూలంలోని విస్తృత సూత్రాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: Πάντα μοι ἔξεστιν అనే మాటను కొరింథీయుల నినాదంగా గుర్తించాలా?
  choice: రెండుసార్లు వచ్చే వాక్యాన్ని ఉల్లేఖన చిహ్నాలలో ఉంచడం
  alternative: ఉల్లేఖన చిహ్నాలు లేకుండా, పౌలు స్వయంగా చెప్పి వెంటనే పరిమితం చేసిన మాటగా అనువదించడం
  rationale: చాలామంది దీన్ని కొరింథీయుల నినాదాన్ని పౌలు ఉటంకించి సరిదిద్దినట్లు అర్థం చేసుకుంటారు. అయితే గ్రీకు ప్రతుల్లో ఉల్లేఖన చిహ్నాలు లేవు; కాబట్టి ఇది పాఠ్యపరమైన నిర్ధారణ కాదు, వ్యాఖ్యాన నిర్ణయం. ప్రధాన పాఠ్యంలో ఉల్లేఖన చిహ్నాలు ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదటీపులో స్పష్టంగా ఉంచాం.
- issue: ἐξουσιασθήσομαι లోని అధికార/ఆధిపత్య భావాన్ని ఎలా వ్యక్తీకరించాలి?
  choice: దేనికీ లోబడను
  alternative: దేనినీ నాపై అధికారం చెలాయించనివ్వను
  rationale: ‘లోబడను’ సంక్షిప్తంగా, సహజంగా ఉండి నియంత్రణకు లేదా ఆధిపత్యానికి గురికాననే భావాన్ని అందిస్తుంది. దీర్ఘమైన ప్రత్యామ్నాయం మూలంలోని అధికార భావాన్ని మరింత స్పష్టంగా చూపుతుంది; అందుకే పాదటీపులో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని పునరుక్తి, వ్యతిరేక నిర్మాణం, నినాదసదృశ బలం నిలుపబడ్డాయి. ‘అనుమతించబడ్డాయి’ ద్వారా ἔξεστιν యొక్క అనుమతి భావం, ‘లోబడను’ ద్వారా ἐξουσιάζω యొక్క ఆధిపత్య భావం వ్యక్తమయ్యాయి.
