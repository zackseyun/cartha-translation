id: 1CO.6.3
reference: 1 Corinthians 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ἀγγέλους κρινοῦμεν, μήτιγε βιωτικά;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/003.yaml
  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: te
  text: మనం దేవదూతలకు తీర్పు తీరుస్తామని మీకు తెలియదా? మరి ఈ జీవితానికి సంబంధించిన విషయాల సంగతి ఇంకెంత ఎక్కువగా![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ జీవితానికి సంబంధించిన విషయాల సంగతి చెప్పనక్కర్లేదు.’
    reason: μήτιγε గొప్పదాని నుండి తక్కువదానికి సాగే వాదనను బలపరుస్తుంది. సందర్భానుసారం దీనిని ‘ఇంకెంత ఎక్కువగా’ లేదా ‘చెప్పనక్కర్లేదు’ అని వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: మీకు తెలియదా
  rationale: పౌలు తరచుగా ఉపయోగించే అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులోనూ, దాని ప్రశ్నార్థక బలాన్ని నిలుపుకుంటూనూ వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: ‘తెలియదా’ అనే క్రియకు సంబంధించిన విషయవాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: ἀγγέλους
  choice: దేవదూతలకు
  rationale: ఈ అంత్యకాల న్యాయసంబంధ సందర్భంలో మానవ దూతలు కాక పరలోక జీవులే ఉద్దేశించబడ్డారు; ‘తీర్పు తీర్చు’తో తెలుగు ప్రయోగంలో చతుర్థీ విభక్తి సహజం.
- source_word: κρινοῦμεν
  choice: మనం ... తీర్పు తీరుస్తామని
  rationale: భవిష్యత్ సూచనను ‘తీరుస్తామని’ నిలుపుతుంది; κρίνω యొక్క న్యాయనిర్ణయ భావాన్ని అనవసరంగా ‘పాలించడం’గా విస్తరించదు.
- source_word: μήτιγε
  choice: అలాంటప్పుడు ... మరెంతగా
  rationale: గొప్పదాని నుండి తక్కువదానికి చేసే వాదనలోని తీవ్రతను తెలుగులో సహజంగా తెలియజేస్తుంది; దీనికి ప్రత్యామ్నాయ భావవ్యక్తీకరణలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: βιωτικά
  choice: ఈ జీవితానికి సంబంధించిన విషయాలు
  rationale: సాధారణ భౌతిక జీవితానికి చెందిన వ్యవహారాలను విస్తృతంగా సూచిస్తుంది; సందర్భంలోని న్యాయవివాదాలకు మాత్రమే భావాన్ని అనవసరంగా కుదించదు.
theological_decisions:
- issue: విశ్వాసులు ‘దేవదూతలకు తీర్పు తీర్చడం’ యొక్క స్వభావం
  choice: ‘మనం దేవదూతలకు తీర్పు తీరుస్తాం’ అనే ప్రత్యక్ష పదప్రయోగాన్ని నిలుపడం
  alternative: ‘మనం దేవదూతలను పరిపాలిస్తాం’ లేదా ‘పతనమైన దేవదూతలకు తీర్పు తీరుస్తాం’
  rationale: మూలపాఠం భవిష్యత్ కార్యాన్ని చెబుతుంది గాని, దాని విధానాన్ని, పరిధిని, లేదా పతనమైన దేవదూతలు మాత్రమే ఉద్దేశించబడ్డారా అనేదాన్ని నిర్దిష్టం చేయదు. అందువల్ల వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘తీర్పు తీర్చడం’ అనే సుపరిచిత న్యాయపదప్రయోగాన్ని, ‘ఈ జీవితానికి సంబంధించిన విషయాలు’ అనే ఉద్దేశపూర్వకంగా విస్తృతమైన పదబంధాన్ని ఉపయోగించింది.
