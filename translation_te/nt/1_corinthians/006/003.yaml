  naturalness: ‘ఈ జీవితానికి సంబంధించిన విషయాలకు మరెంతగా!’ అనే ముగింపు తెలుగులో అసంపూర్ణంగా, కొంత అసహజంగా వినిపిస్తుంది. ‘విషయాల సంగతి ఇంకెంత ఎక్కువగా!’ అనే రూపం మూలంలోని సూచిత క్రియను అనవసరంగా చేర్చకుండా సహజమైన ప్రశ్నార్థక-ఉద్ఘాటనను ఇస్తుంది.
