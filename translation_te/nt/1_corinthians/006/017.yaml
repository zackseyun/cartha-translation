translation:
  language: te
  text: అయితే ప్రభువుతో కలిసివున్నవాడు ఆయనతో ఒకే ఆత్మగా ఉన్నాడు.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువుతో కలపబడినవాడు.” గ్రీకు క్రియను “ప్రభువుతో కలిసివున్నవాడు” అని గానీ, “ప్రభువుతో కలపబడినవాడు” అని గానీ అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒకే ఆత్మగా ఉన్నాడు.” “ఆయనతో” అనే మాట గ్రీకులో ప్రత్యక్షంగా లేదు; సందర్భంలో అంతర్లీనంగా ఉన్న సంబంధాన్ని స్పష్టం చేయడానికి చేర్చబడింది.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ “ఆత్మ”ను కొందరు పరిశుద్ధాత్మకు సూచనగా అర్థం చేసుకోవచ్చు. అయితే ఈ పదబంధం అత్యంత సహజంగా, విశ్వాసి ప్రభువుతో ఆత్మసంబంధమైన ఐక్యతలో ఉన్నాడని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος (κολλάομαι)
  choice: కలిసేవాడు
  rationale: ఈ పదం దగ్గరగా అంటిపెట్టుకోవడం లేదా ఒకరితో ఏకమవడం అనే భావాన్ని ఇస్తుంది. మునుపటి వచనంలోని శారీరక కలయికకు, ఇక్కడ ప్రభువుతో కలయికకు ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది; గ్రీకు మధ్యమ/కర్మణి రూపంలోని కొంత అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: κυρίῳ (κύριος)
  choice: ప్రభువుతో
  rationale: పౌలు వాడుకలో ఇది యేసును సూచిస్తూ కేవలం అధికారాన్ని మించిన ధార్మిక ప్రాముఖ్యతను కలిగి ఉంది. గ్రీకు దత్తివిభక్తి ఇక్కడ సంబంధాన్ని సూచిస్తున్నందున ‘తో’ సహజంగా సరిపోతుంది.
- source_word: ἓν
  choice: ఒక్క
  rationale: ఐక్యతను బలంగా వ్యక్తం చేసే సంఖ్యార్థాన్ని నిలుపుతుంది.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: ఈ సందర్భంలో విశ్వాసి ప్రభువుతో ఆత్మసంబంధమైన ఐక్యతలో ఉన్నాడనే అర్థం అత్యంత సహజం. తెలుగులో పెద్ద/చిన్న అక్షరాల భేదం లేకపోవడం వల్ల పరిశుద్ధాత్మను సూచించే అవకాశాన్ని అక్షరరూపంతో నిర్ణయించకుండా పాదసూచికలో వివరించాం.
- source_word: ὁ δὲ ... ἐστιν
  choice: అయితే ... వాడు ... ఉన్నాడు
  rationale: సుబstantival participle యొక్క ‘ఆ వ్యక్తి’ అనే ప్రతినిధి ఏకవచన భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; δέ యొక్క వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఒక్క ఆత్మ’ అనే మాటలోని ఐక్యత స్వభావం
  choice: విశ్వాసి మరియు ప్రభువు మధ్య నిజమైన ఆత్మసంబంధమైన ఐక్యతను బలంగా వ్యక్తం చేయడం, అయితే వారిద్దరి మధ్య భేదాన్ని చెరపకపోవడం
  alternative: పూర్తి తాత్త్విక కలయికగా లేదా కేవలం ఒకే మనోభావం/ఉద్దేశంగా అర్థం చేసుకోవడం
  rationale: 16వ వచనంలోని శారీరక కలయికకు భిన్నంగా పౌలు ఇక్కడ ప్రభువుతో ఆత్మసంబంధమైన ఐక్యతను చెబుతున్నాడు. ‘ఆయనతో ఒక్క ఆత్మగా’ అనేది ఐక్యత బలాన్ని ఉంచుతూ వ్యక్తుల అభేదాన్ని బలవంతంగా సూచించదు.
- issue: గ్రీకులో అంతర్లీనంగా ఉన్న సంబంధాన్ని ‘ఆయనతో’ అని స్పష్టపరచడం
  choice: స్పష్టత కోసం ‘ఆయనతో’ చేర్చడం
  alternative: ‘ఒక్క ఆత్మగా ఉన్నాడు’ అని మాత్రమే అనువదించడం
  rationale: గ్రీకు వాక్యంలో సంబంధిత పూరకం సందర్భం ద్వారా అర్థమవుతుంది. తెలుగులో ‘ఆయనతో’ అనడం ఐక్యత విశ్వాసి మరియు ప్రభువు మధ్యనని స్పష్టపరుస్తుంది; దీన్ని పాదసూచికలో పారదర్శకంగా తెలిపాం.
- issue: πνεῦμα పరిశుద్ధాత్మను నేరుగా సూచిస్తుందా అనే ప్రశ్న
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మ’ అని ఉంచి, విశ్వాసి ప్రభువుతో ఒక్క ఆత్మగా ఉండే ఐక్యతనే సహజ పఠనంగా సూచించడం
  alternative: ‘పరిశుద్ధాత్మ’ అని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠం πνεῦμα మాత్రమే అంటుంది; ‘పరిశుద్ధ’ అనే పదాన్ని చేర్చడం మూలంలో లేని ఒక వ్యాఖ్యానాన్ని నిర్ణయాత్మకంగా దిగుమతి చేస్తుంది. అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని వాడాం. ‘కలిసిపోయేవాడు’ అనే రూపం వ్యక్తిత్వాలు లీనమయ్యాయనే అపార్థం కలిగించవచ్చని దాన్ని నివారించి, ‘కలిసేవాడు’ అని ఎంచుకున్నాం. ‘ఆత్మ’ విషయంలో తెలుగులో capitalization లేకపోవడం వల్ల ఏర్పడే వ్యాఖ్యాన ప్రశ్నను పాదసూచికలో స్పష్టంచేశాం.
