- from: అయితే ప్రభువుతో కలిసేవాడు[a] ఆయనతో ఒక్క ఆత్మగా ఉన్నాడు.[b][c]
  to: అయితే ప్రభువుతో కలిసివున్నవాడు ఆయనతో ఒకే ఆత్మగా ఉన్నాడు.[a][b][c]
  rationale: The revision strengthens lexical fidelity for κολλώμενος without prematurely deciding between middle/reflexive and passive-like force. It also uses the more natural Telugu expression “ఒకే ఆత్మగా” for “one spirit.” The footnotes retain the English audit trail’s lexical and interpretive alternatives, and their anchors remain valid.
