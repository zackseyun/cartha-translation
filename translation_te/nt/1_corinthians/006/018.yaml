id: 1CO.6.18
reference: 1 Corinthians 6:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: te
  text: లైంగిక దుర్నీతి నుండి పారిపోండి. మనిషి[a] చేసే ప్రతి పాపమూ శరీరానికి వెలుపల ఉంటుంది; కానీ లైంగిక దుర్నీతికి పాల్పడేవాడు తన సొంత శరీరానికే పాపం చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘మనిషి’ (ἄνθρωπος) అని ఉంది; ఇక్కడ అది సాధారణంగా మానవులను సూచిస్తుంది.
    reason: ἄνθρωπος యొక్క వ్యాకరణపరంగా పుంలింగమైనా ప్రతినిధి/సాధారణమైన భావాన్ని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: φεύγετε
  choice: దూరంగా పారిపోండి
  rationale: వర్తమానకాల ఆజ్ఞారూపం నిరంతరంగా తప్పించుకోవాలనే అత్యవసర పిలుపును ఇస్తుంది. ఈ తెలుగు ప్రయోగం ఆ బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: πορνείαν
  choice: లైంగిక దుర్నీతి
  rationale: ఈ పదం వివాహానికి ముందరి లైంగిక సంబంధాలకే పరిమితం కాకుండా, అనుచితమైన లైంగిక ప్రవర్తనను విస్తృతంగా సూచిస్తుంది.
- source_word: πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: మనిషి చేసే ప్రతి పాపమూ
  rationale: ἄνθρωπος ఇక్కడ మానవుని సాధారణ ప్రతినిధిగా వాడబడింది. ‘మనిషి’ ఆధునిక తెలుగులో సహజంగా ఆ సాధారణ భావాన్ని వ్యక్తం చేస్తుంది; ‘ప్రతి పాపమూ’ πᾶν ἁμάρτημα యొక్క సమగ్రతను నిలుపుతుంది.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: శరీరానికి వెలుపల ఉంటుంది
  rationale: గ్రీకు వాక్యంలోని స్థలసంబంధ రూపకాన్ని నేరుగా నిలుపుతూ, తరువాతి వాక్యభాగంతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ὁ δὲ πορνεύων
  choice: అయితే లైంగిక దుర్నీతికి పాల్పడేవాడు
  rationale: వర్తమాన కృదంతంలోని క్రియాత్మక భావాన్ని నిలుపుతూ, మొదటి ఆజ్ఞలోని పదంతో స్పష్టమైన సంబంధాన్ని ఉంచుతుంది.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: తన సొంత శరీరానికి విరోధంగా పాపం చేస్తాడు
  rationale: εἰς అక్షరార్థంగా ‘లోనికి’ అయినప్పటికీ, ఈ సందర్భంలో పాపం దేనికి వ్యతిరేకంగా మళ్లిందో తెలిపే భావాన్ని ‘విరోధంగా’ సహజంగా వ్యక్తం చేస్తుంది. ‘తన సొంత’ అనేది ἴδιον యొక్క వ్యక్తిగత ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: ἄνθρωπος అనే పదం సాధారణ ప్రతినిధి భావంలో వాడబడటం
  choice: మనిషి
  alternative: ఒక వ్యక్తి
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా ఇక్కడ సాధారణ మానవ ప్రతినిధి భావం ఉంది. తెలుగులో ‘మనిషి’ ఆ రెండు లక్షణాలను సహజంగా మోయగలదు.
- issue: ‘ప్రతి పాపమూ శరీరానికి వెలుపల ఉంటుంది’ అనే వాక్యంలోని వ్యాఖ్యానపరమైన ఉద్రిక్తత
  choice: వాక్యాన్ని నేరుగా అనువదించి దాని ఉద్రిక్తతను అలాగే ఉంచడం
  alternative: దీనిని కొరింథీయుల నినాదంగా చూపడం లేదా సిద్ధాంతపరమైన వివరణను వాక్యంలో చేర్చడం
  rationale: గ్రీకు పాఠం ఈ మాటను ప్రత్యక్ష ప్రకటనగా ఇస్తుంది. అది నినాదమా, సంపూర్ణ ప్రకటననా అనే వివాదాన్ని అనువాదంలోనే పరిష్కరించడం తగదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ఆజ్ఞ యొక్క అత్యవసరతను, ‘వెలుపల/తన సొంత శరీరానికి విరోధంగా’ అనే వ్యత్యాసాన్ని స్పష్టంగా నిలిపింది.
