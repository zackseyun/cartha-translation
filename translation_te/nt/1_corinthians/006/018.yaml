revisions:
- from: లైంగిక దుర్నీతికి దూరంగా పారిపోండి. మనిషి చేసే ప్రతి పాపమూ శరీరానికి వెలుపల ఉంటుంది; అయితే లైంగిక దుర్నీతికి పాల్పడేవాడు తన సొంత శరీరానికి విరోధంగా పాపం చేస్తాడు.
  to: లైంగిక దుర్నీతి నుండి పారిపోండి. మనిషి[a] చేసే ప్రతి పాపమూ శరీరానికి వెలుపల ఉంటుంది; కానీ లైంగిక దుర్నీతికి పాల్పడేవాడు తన సొంత శరీరానికే పాపం చేస్తాడు.
  rationale: This revision makes two small idiomatic corrections while retaining the source text’s scope and ambiguity. It neither construes the middle clause as a Corinthian slogan nor qualifies its difficult assertion. The footnote is retained in Telugu and anchored to the generic noun it explains.
