review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the imperative, the broad sense of πορνεία, the generic use of ἄνθρωπος, and the deliberately unqualified contrast between sins 'outside the body' and sexual immorality. However, 'దూరంగా పారిపోండి' is somewhat redundant and does not explicitly express the object from which one is to flee. The closing 'శరీరానికి విరోధంగా పాపం చేస్తాడు' is intelligible, but Telugu more naturally conveys the Greek's directed sense with 'తన సొంత శరీరానికే పాపం చేస్తాడు.'
  naturalness: The revision uses idiomatic modern standard Telugu while retaining the urgent command and the terse, unresolved wording of the Greek. 'నుండి పారిపోండి' is more natural than 'దూరంగా పారిపోండి,' and 'కానీ' provides an appropriately direct rendering of δέ.
  terminology: ‘లైంగిక దుర్నీతి’ is a suitable broad, modern rendering of πορνεία. ‘మనిషి’ appropriately reflects the representative generic force of ἄνθρωπος. ‘తన సొంత శరీరానికే’ preserves the emphasis of ἴδιον; the enclitic ‘-ఏ’ naturally marks the contrast without adding interpretation.
  issues:
  - severity: low
    issue: The opening command is phrased redundantly.
    rationale: ‘దూరంగా పారిపోండి’ combines two overlapping notions and leaves the object implicit. ‘లైంగిక దుర్నీతి నుండి పారిపోండి’ is more idiomatic and directly reflects φεύγετε τὴν πορνείαν.
  - severity: low
    issue: The final prepositional sense is rendered less naturally than necessary.
    rationale: ‘తన సొంత శరీరానికి విరోధంగా పాపం చేస్తాడు’ is understandable, but ‘తన సొంత శరీరానికే పాపం చేస్తాడు’ is standard Telugu and communicates the sin's direction toward one’s own body without overexplaining εἰς.
  - severity: low
    issue: The generic-sense note lacks an anchor in the Telugu text.
    rationale: Adding an anchor immediately after ‘మనిషి’ correctly locates the note at the word it explains and maintains the audit-trail clarification.
