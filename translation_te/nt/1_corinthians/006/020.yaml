revisions:
- from: ఎందుకంటే, మీరు వెల చెల్లించి కొనబడ్డారు[a]. కాబట్టి మీ శరీరంలో దేవుణ్ణి మహిమపరచండి[b].
  to: ఎందుకంటే, మీరు మూల్యం చెల్లించి కొనుగోలు చేయబడ్డారు.[a] కాబట్టి[b] మీ శరీరంలో దేవుణ్ణి మహిమపరచండి.
  rationale: The revision replaces “వెల” with the more apt “మూల్యం” and makes the passive purchase construction clearer and more natural without supplying a purchaser or a doctrinal interpretation. It also relocates footnote b to the specific word that renders δή. The singular “శరీరంలో” is retained, reflecting the Greek singular σῶμα with plural possessive ὑμῶν.
