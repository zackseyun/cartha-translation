review_pass:
  verdict: revise
  source_fidelity: The draft preserves the causal γάρ, the purchase metaphor of ἠγοράσθητε, the price/cost expressed by τιμῆς, the imperative force of δοξάσατε, and the concrete reference to the body. However, “వెల చెల్లించి కొనబడ్డారు” is less natural and can momentarily suggest that the addressees paid the price. “మూల్యం చెల్లించి కొనుగోలు చేయబడ్డారు” more clearly expresses a price having been paid while retaining the Greek passive purchase imagery.
  naturalness: “మహిమపరచండి” and “మీ శరీరంలో” are natural in a modern standard, reverent Telugu register. Moving footnote b directly after “కాబట్టి” gives its anchor a precise and readable location.
  terminology: “మూల్యం” is preferable to “వెల” here for a price/cost paid. “కొనుగోలు చేయబడ్డారు” retains the commercial metaphor without importing an interpretive term such as “విమోచించబడ్డారు.” “మహిమపరచండి” accurately retains the theological force of δοξάσατε.
  issues:
  - severity: low
    issue: “వెల చెల్లించి కొనబడ్డారు” is potentially ambiguous and somewhat less idiomatic.
    rationale: The wording may be read as though “you” paid the price. A passive formulation in which the payment is expressed impersonally is clearer in Telugu while faithfully retaining the source's passive purchase image.
  - severity: low
    issue: Footnote marker b is placed after the whole command rather than immediately at the rendering of δή.
    rationale: The note specifically explains “కాబట్టి”; placing its marker directly after that word improves anchor precision.
