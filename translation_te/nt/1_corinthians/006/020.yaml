  edition: SBLGNT
  text: ἠγοράσθητε γὰρ τιμῆς· δοξάσατε δὴ τὸν θεὸν ἐν τῷ σώματι ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: te
  text: ఎందుకంటే, మీరు మూల్యం చెల్లించి కొనుగోలు చేయబడ్డారు.[a] కాబట్టి[b] మీ శరీరంలో దేవుణ్ణి మహిమపరచండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు ఒక మూల్యానికి కొనబడారు.’ గ్రీకు వాక్యం కొనుగోలుకు మూల్యం చెల్లించబడిన రూపకాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కాబట్టి’ అని అనువదించిన పదం ఆజ్ఞకు ప్రేరేపణాత్మక బలాన్ని జోడిస్తుంది; దీనిని ‘అయితే’ అని కూడా అనువదించవచ్చు లేదా తెలుగులో ప్రత్యేక పదం లేకుండానే భావాన్ని వ్యక్తం చేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: కొనబడ్డారు
  rationale: ἀγοράζω యొక్క భూతకాల కర్మణి రూపం. రక్షణను కొనుగోలు అనే రూపకంతో చెప్పిన మూలభాషను నేరుగా నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి కారణాన్ని తెలిపే అనుసంధాన పదంగా సహజమైన ఆధునిక తెలుగు.
- source_word: τιμῆς
  choice: వెల చెల్లించి
  rationale: కొనుగోలుకు చెల్లించిన మూల్యాన్ని సూచించే ధరార్థక షష్ఠిని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, కొనుగోలు రూపకాన్ని నిలుపుతుంది.
- source_word: δοξάσατε
  choice: మహిమపరచండి
  rationale: దేవునికి మహిమ కలిగేలా ప్రవర్తించమనే ఆజ్ఞను, δοξάζω పదానికున్న ధార్మిక బరువుతో సహా నిలుపుతుంది.
- source_word: δὴ
  choice: కాబట్టి
  rationale: ఇప్పుడే చెప్పిన కారణం నుంచి ఆజ్ఞకు వచ్చే నిర్ధారణాత్మక, ప్రేరేపణాత్మక బలాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: మీ శరీరంలో
  rationale: ἐν యొక్క స్థలార్థక/సాధనార్థక విస్తృతిని అనవసరంగా కుదించకుండా, సందర్భంలోని శారీరక ప్రవర్తనపై దృష్టిని నిలుపుతుంది.
theological_decisions:
- issue: కొనుగోలు రూపకంలోని విమోచన భావం
  choice: వెల చెల్లించి కొనబడ్డారు
  alternative: మూల్యం చెల్లించి విమోచించబడ్డారు
  rationale: మూలంలోని వ్యాపార సంబంధమైన కొనుగోలు రూపకాన్ని నిలిపి, నిర్దిష్ట సిద్ధాంతపరమైన వివరణను వాక్యంలోకి చేర్చకుండా ఉంటుంది.
- issue: శరీర సంబంధ నైతికత
  choice: మీ శరీరంలో
  alternative: మీ జీవితంలో
  rationale: తక్షణ సందర్భం శారీరక లైంగిక ప్రవర్తనను గూర్చినది; అందువల్ల σῶμα అనే నిర్దిష్ట పదాన్ని విస్తృతమైన ‘జీవితం’గా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కొనబడ్డారు’ మరియు ‘శరీరంలో’ అనే పదాలతో మూలంలోని కొనుగోలు రూపకాన్నీ, శరీరంపై దృష్టినీ స్పష్టంగా నిలిపింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
