id: 1CO.6.11
reference: 1 Corinthians 6:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: te
  text: మీలో కొందరు అలాంటివారే ఉండేవారు. కానీ మీరు కడుగబడ్డారు[a]; కానీ మీరు పవిత్రపరచబడ్డారు; కానీ మీరు నీతిమంతులుగా తీర్చబడ్డారు—ప్రభువైన యేసు నామంలో, మన దేవుని ఆత్మలో[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీరు మిమ్మల్ని మీరు కడుగుకున్నారు’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ మధ్యమ వాచకంలో ఉంది; అయితే ఇక్కడ అనేకులు దానిని తరువాతి రెండు కర్మణి క్రియలతో కలిసి దేవుని రక్షణకార్యాల వరుసగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘మన దేవుని ఆత్మ ద్వారా.’ గ్రీకులోని ἐν అనే పదం ఇక్కడ ‘లో’ అనే పరిధి భావాన్నీ, ‘ద్వారా’ అనే సాధన భావాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: మీలో కొందరు అలాంటివారే ఉండేవారు
  rationale: ταῦτα ముందున్న దురాచారుల జాబితాను సూచిస్తుంది. తెలుగులో ‘ఆ విషయాలే’ అనే అక్షరార్థ రూపం అసహజంగా ఉండటంతో, పూర్వస్థితిని సహజంగా తెలియజేసే ‘అలాంటివారే ఉండేవారు’ ఎంచుకోబడింది.
- source_word: ἀλλὰ … ἀλλὰ … ἀλλὰ
  choice: అయితే … అయితే … అయితే
  rationale: పౌలు ఉద్దేశపూర్వకంగా మూడుసార్లు వాడిన బలమైన వ్యత్యాసాన్ని, వాక్యలయాన్ని నిలుపుతుంది.
- source_word: ἀπελούσασθε
  choice: మీరు కడుగబడ్డారు
  rationale: మధ్యమ వాచక రూపమైనప్పటికీ, తరువాతి రెండు కర్మణి క్రియలతో కూడిన రక్షణకార్యాల వరుసలో ఇది కర్మణి భావాన్ని సహజంగా ఇస్తుంది. స్వయంగా కడుగుకున్నారనే సాధ్యమైన అర్థం పాదసూచికలో ఉంచబడింది.
- source_word: ἡγιάσθητε
  choice: మీరు పవిత్రపరచబడ్డారు
  rationale: దేవునికి ప్రత్యేకించబడి పవిత్రులుగా చేయబడిన భావాన్ని స్పష్టంగా, కర్మణి రూపంలో తెలియజేస్తుంది.
- source_word: ἐδικαιώθητε
  choice: మీరు నీతిమంతులుగా తీర్చబడ్డారు
  rationale: δικαιόω యొక్క న్యాయస్థాన సంబంధమైన భావాన్ని తెలుగులో అర్థమయ్యే విధంగా తెలియజేస్తుంది; కేవలం నైతికంగా మంచివారయ్యారనే భావాన్ని కలిగించదు.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు నామంలో
  rationale: ἐν లోని పరిధి, ఆధారం, సాధనం వంటి భావసాధ్యతలను ముందుగానే ఒకటిగా నిర్ణయించకుండా సంప్రదాయబద్ధమైన సహజ తెలుగు రూపాన్ని ఉంచుతుంది.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: మన దేవుని ఆత్మలో
  rationale: మూలంలోని రెండవ ἐν నిర్మాణాన్ని నిలుపుతూ, దేవుని ఆత్మ యొక్క పరిధి లేదా కార్యసాధన అనే భావసాధ్యతను తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ἀπελούσασθεలో వాచకం మరియు కార్యసాధకత్వం
  choice: ‘కడుగబడ్డారు’ అనే కర్మణి భావంతో అనువదించడం
  alternative: ‘మిమ్మల్ని మీరు కడుగుకున్నారు’ అనే ప్రతిఫలార్థక అనువాదం
  rationale: రూపం మధ్యమ వాచకమైనప్పటికీ, వెంట వచ్చే ‘పవిత్రపరచబడ్డారు’, ‘నీతిమంతులుగా తీర్చబడ్డారు’ అనే కర్మణి క్రియలు దేవుని రక్షణకార్యాల వరుసను సూచిస్తాయి. అయినా రూపంలోని ప్రతిఫలార్థక సాధ్యతను పాదసూచికలో భద్రపరచాం.
- issue: ἐν τῷ πνεύματιలో ἐν యొక్క భావం
  choice: ‘మన దేవుని ఆత్మలో’ అని అనువదించడం
  alternative: ‘మన దేవుని ఆత్మ ద్వారా’ అని సాధనార్థకంగా అనువదించడం
  rationale: దేవుని ఆత్మ కార్యసాధకుడని సందర్భం సూచించగలిగినా, ‘లో’ అనే రూపం మూలంలోని పరిధి/సాధనం మధ్య ఉన్న స్వల్ప అస్పష్టతను నిలుపుతుంది.
- issue: πνεύματι యొక్క సూచన
  choice: దేవుని పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: సాధారణ ఆధ్యాత్మిక పరిధి
  rationale: ‘మన దేవుని ఆత్మ’ అనే పౌలు ప్రయోగం సహజంగా దేవుని పరిశుద్ధాత్మనే సూచిస్తుంది; అనువాదం మూలంలో లేని ‘పరిశుద్ధ’ అనే విశేషణాన్ని మాత్రం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పౌలు వాడిన మూడు వరుస వ్యత్యాసాలను ‘అయితే’ అనే పునరుక్తితో నిలిపాం. రక్షణ సంబంధ పదాలకు స్పష్టమైన కర్మణి రూపాలు వాడి, మూలంలోని వాచక మరియు ἐν సంబంధ అస్పష్టతలను పాదసూచికలతో భద్రపరచాం.
