id: 1CO.6.9
reference: 1 Corinthians 6:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: te
  text: లేక, అనీతిమంతులు దేవుని రాజ్యాన్ని వారసత్వంగా పొందరని మీకు తెలియదా? మోసపోవద్దు. లైంగిక దుర్నీతికి పాల్పడేవారైనా, విగ్రహారాధకులైనా, వ్యభిచారులైనా, స్త్రీలవలె ప్రవర్తించే పురుషులైనా[a], పురుషులతో లైంగిక సంబంధాలు పెట్టుకునే పురుషులైనా[b]—వీరిలో ఎవరూ దేవుని రాజ్యాన్ని వారసత్వంగా పొందరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం μαλακοί అక్షరార్థంగా ‘మృదువైనవారు.’ ఇది స్త్రీలవలె ప్రవర్తించే పురుషులను, నైతికంగా బలహీనులైనవారిని, లేదా ఈ సందర్భంలో పురుషుల మధ్య లైంగిక సంబంధంలో నిష్క్రియ పాత్ర వహించేవారిని—బహుశా పురుష వేశ్యలను—సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం ἀρσενοκοῖται అరుదైనది; దాని ఖచ్చితమైన పరిధి వివాదాస్పదం. దీన్ని ‘పురుషులతో శయనించే పురుషులు’ లేదా ‘పురుషులతో నిషిద్ధ లైంగిక సంబంధాలు పెట్టుకునేవారు’ అని అనువదించవచ్చు; సంప్రదాయ అనువాదాల్లో దీనికి ‘సొదొమీయులు’ అనే పదమూ కనిపిస్తుంది. చాలామంది దీన్ని గ్రీకు లేవీయకాండంలోని పదజాలంతో అనుసంధానిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: లేక
  rationale: ముందటి వాదనను కొనసాగిస్తూ గట్టిగా ప్రశ్నించే సంధానాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὐκ οἴδατε
  choice: మీకు తెలియదా?
  rationale: పౌలు తరచుగా ఉపయోగించే అలంకారిక ప్రశ్నను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄδικοι
  choice: అనీతిమంతులు
  rationale: కేవలం కొన్ని తప్పు పనులకే పరిమితం చేయకుండా, నైతికంగా అన్యాయమైనవారనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: θεοῦ βασιλείαν
  choice: దేవుని రాజ్యాన్ని
  rationale: గ్రీకు షష్ఠీ నిర్మాణానికీ స్థిరమైన బైబిలు వాడుకకీ పారదర్శకమైన సమానం.
- source_word: κληρονομήσουσιν
  choice: స్వాస్థ్యంగా పొందరు
  rationale: κληρονομέω లోని వారసత్వ, నిబంధనాత్మక, భవిష్యత్ భావాలను సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: μὴ πλανᾶσθε
  choice: మోసపోవద్దు
  rationale: హెచ్చరికలోని కర్మణి/మధ్యార్థపు విస్తృతిని అనవసరంగా 'మిమ్మల్ని మీరే మోసం చేసుకోవద్దు' అని కుదించదు.
- source_word: πόρνοι
  choice: లైంగిక దుర్నీతికి పాల్పడేవారు
  rationale: పదంలోని విస్తృత లైంగిక అనైతికతను తెలుపుతూ, పాతదైన లేదా అతిగా సంకుచితమైన పదజాలాన్ని నివారిస్తుంది.
- source_word: εἰδωλολάτραι
  choice: విగ్రహారాధకులు
  rationale: సంక్షిప్తమైన, సుపరిచితమైన ప్రత్యక్ష సమానం.
- source_word: μοιχοὶ
  choice: వ్యభిచారులు
  rationale: వివాహ బంధాన్ని అతిక్రమించే నిర్దిష్ట భావాన్ని నిలుపుతుంది.
- source_word: μαλακοὶ
  choice: మృదువైన పురుషులు[a]
  rationale: పదం యొక్క ప్రాథమిక 'మృదువైన' భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, ఈ సందర్భంలో ఉండగల లైంగిక భావాన్ని పాదసూచికలో వివరిస్తుంది; వివాదాస్పద అర్థాన్ని నిశ్చితంగా ప్రకటించదు.
- source_word: ἀρσενοκοῖται
  choice: పురుషులతో లైంగిక సంబంధాలు పెట్టుకునే పురుషులు[b]
  rationale: ఆధునిక లైంగిక-గుర్తింపు వర్గాన్ని మోపకుండా, పద నిర్మాణం మరియు సంభావ్య లేవీయకాండ గ్రీకు నేపథ్యం సూచించే పురుషుల మధ్య లైంగిక క్రియను వివరణాత్మకంగా తెలుపుతుంది.
theological_decisions:
- issue: μαλακοὶ మరియు ἀρσενοκοῖται అనే వివాదాస్పద పదాల సంబంధం, పరిధి
  choice: రెండు పదాలను వేర్వేరుగా ఉంచి, మొదటిదాన్ని అక్షరార్థానికి దగ్గరగా 'మృదువైన పురుషులు' అని, రెండవదాన్ని క్రియను సూచించే వివరణాత్మక పదబంధంగా అనువదించడం
  alternative: వాటిని వరుసగా 'నిష్క్రియ భాగస్వాములు' మరియు 'పురుషులతో శయనించేవారు' అని పరస్పరపూరక జంటగా స్పష్టంగా నిర్వచించడం; లేదా 'స్త్రీ స్వభావం గలవారు' మరియు 'సొదొమీయులు' వంటి సంప్రదాయ పదాలు వాడడం
  rationale: మొదటి పదం మృదుత్వం, స్త్రీత్వంగా భావించిన ప్రవర్తన, నైతిక బలహీనత, లేదా ఈ సందర్భంలో పురుష-పురుష సంభోగంలోని నిష్క్రియ భాగస్వామిని సూచించవచ్చు. రెండవ పదం అరుదైనదీ, పరిధి వివాదాస్పదమైనదీ అయినప్పటికీ పురుషులతో లైంగిక క్రియకు బలమైన సూచన కలిగి ఉంది. ప్రధాన పాఠ్యం మరియు పాదసూచికలు ఈ ఉద్రిక్తతను పరిష్కరించినట్టు నటించకుండా కాపాడుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర శైలి. జాబితా తరువాత ఉన్న క్రియను తెలుగులో చివర మళ్లీ వ్యక్తం చేసి వాక్యాన్ని సహజంగా పూర్తి చేశాం. వివాదాస్పద గ్రీకు పదాలకు ఆధునిక గుర్తింపు-ఆధారిత ముద్రలను మోపకుండా, పాదసూచికల ద్వారా నిజమైన అర్థసందిగ్ధతను నిలిపాం.
