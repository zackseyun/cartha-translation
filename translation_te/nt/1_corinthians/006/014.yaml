review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents God as subject, 'the Lord' as the object of the past resurrection verb, and the future raising of 'us' by God's power. However, 'మృతులలోనుండి' ('from among the dead') is not stated in this verse. Though resurrection is clear from context and the verbs, this added wording exceeds the verse's explicit Greek formulation.
  naturalness: The revised wording is natural modern standard Telugu and retains a dignified biblical register. The semicolon clearly marks the coordinated past and future divine actions.
  terminology: ‘దేవుడు,’ ‘ప్రభువు,’ ‘లేపాడు,’ and ‘లేపుతాడు’ are appropriate and consistent terms. ‘తన శక్తి ద్వారా’ accurately conveys διά with the genitive as means.
  issues:
  - severity: medium
    issue: The phrase ‘మృతులలోనుండి’ has been added after ‘ప్రభువును.’
    rationale: SBLGNT reads simply ‘God raised the Lord’; it does not include an explicit equivalent of ‘from the dead.’ The addition is contextually true but should not be inserted into an optimal-equivalence translation of this verse.
  revised_text: దేవుడు ప్రభువును లేపాడు; తన శక్తి ద్వారా మనలను కూడా లేపుతాడు.
