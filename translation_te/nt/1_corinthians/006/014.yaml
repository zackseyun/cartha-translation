id: 1CO.6.14
reference: 1 Corinthians 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: te
  text: దేవుడు ప్రభువును లేపాడు; తన శక్తి ద్వారా మనలను కూడా లేపుతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అంతర్లీన మృదు అనుసంధానం
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక వాదన కొనసాగింపును సూచిస్తుంది. తెలుగులో ప్రత్యేక అనుసంధాన పదం లేకుండానే సహజంగా ఆ సంబంధం వ్యక్తమవుతుంది.
- source_word: θεὸς
  choice: దేవుడు
  rationale: θεός కు ప్రామాణికమైన తెలుగు సమానం; పునరుత్థాన కార్యాన్ని చేసేవాడు దేవుడే అని వాక్యం స్పష్టంగా చెబుతుంది.
- source_word: τὸν κύριον
  choice: ప్రభువును
  rationale: κύριος ఇక్కడ యేసును సూచించే క్రీస్తుసంబంధ బిరుదు; ‘ప్రభువు’ సహజమైన, స్థిరమైన అనువాదం.
- source_word: ἤγειρεν
  choice: మృతులలోనుండి లేపాడు
  rationale: ἐγείρω ఇక్కడ దేవుడు యేసును పునరుత్థానపరచిన గత కార్యాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు పునరుత్థాన భావం స్పష్టంగా ఉండేందుకు సందర్భార్థమైన ‘మృతులలోనుండి’ చేర్చబడింది.
- source_word: ἡμᾶς
  choice: మనలను
  rationale: విశ్వాసులను కలుపుకొని చెప్పే ప్రథమ పురుష బహువచన కర్మరూపం.
- source_word: ἐξεγερεῖ
  choice: లేపుతాడు
  rationale: భవిష్యత్తులో దేవుడు మనలను లేపుతాడనే భావాన్ని తెలియజేస్తుంది; ముందు వచ్చిన ἤγειρεν తో ఉన్న పునరుత్థాన సమాంతరతను నిలుపుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: ప్రభువును లేపిన దేవుడు మనలను సైతం లేపుతాడనే సమాంతర అనుసంధానాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: తన శక్తి ద్వారా
  rationale: షష్ఠీ విభక్తితో διά సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది; ‘తన శక్తి ద్వారా’ దేవుని శక్తియే మన పునరుత్థానానికి సాధనమని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: భవిష్యత్ క్రియలోని పునరుత్థాన సూచన
  choice: విశ్వాసుల భవిష్యత్ శారీరక పునరుత్థానాన్ని సూచించే ‘మనలను కూడా లేపుతాడు’
  alternative: సాధారణ దైవిక సమర్థన లేదా రూపకాలంకారమైన ఆత్మీయ లేపడం
  rationale: తక్షణ సందర్భం శరీరాన్ని గురించి మాట్లాడుతుంది (1 కొరింథీయులు 6:13–20); ‘ప్రభువును ... లేపాడు’ అనే గత కార్యంతో ఉన్న సమాంతరత విశ్వాసుల వాస్తవ భవిష్యత్ పునరుత్థానాన్ని బలంగా సూచిస్తుంది. అయితే అనువాదం వివరణాత్మక సిద్ధాంత పదజాలాన్ని చేర్చకుండా మూలంలోని సరళ రూపాన్ని ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అదే సమయంలో గౌరవప్రదంగా రూపొందించబడింది. δέ కోసం కృత్రిమంగా ‘అయితే’ లేదా ‘మరియు’ చేర్చకుండా తెలుగు వాక్యప్రవాహంలో మృదు అనుసంధానం నిలుపబడింది.
