id: 1CO.6.13
reference: 1 Corinthians 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: te
  text: ఆహారాలు కడుపు కోసం, కడుపు ఆహారాల కోసం; అయితే దేవుడు దానినీ వాటినీ అంతం చేస్తాడు.[a] కానీ శరీరం లైంగిక దుర్నీతి కోసం కాదు, ప్రభువు కోసం; ప్రభువు శరీరం కోసం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అంతం చేస్తాడు’ అనే మాటను ‘నాశనం చేస్తాడు,’ ‘రద్దు చేస్తాడు,’ లేదా ‘పనిచేయకుండా చేస్తాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆహారాలు కడుపు కోసం, కడుపు ఆహారాల కోసం’ అనేది పౌలు ఉటంకిస్తున్న కొరింథీయుల నినాదమని చాలామంది వ్యాఖ్యాతలు భావిస్తారు; అయితే గ్రీకు పాఠంలో అది ఉద్ధరణ అని స్పష్టంగా గుర్తించబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: βρώματα
  choice: ఆహారాలు
  rationale: గ్రీకు పదం బహువచనంలో ఉంది. తెలుగులో ‘ఆహారాలు’ సహజంగానే ఉండి మూలంలోని సంఖ్యను కూడా నిలుపుతుంది.
- source_word: κοιλίᾳ / κοιλία
  choice: కడుపు
  rationale: ఈ సందర్భంలో ఆహారం, జీర్ణక్రియకు సంబంధించిన శరీరావయవమే ఉద్దేశం; ఆధునిక తెలుగులో ‘కడుపు’ స్పష్టమైన సహజ సమానం.
- source_word: καταργήσει
  choice: లేకుండా చేస్తాడు
  rationale: ఈ క్రియ నిర్మూలనను తప్పనిసరిగా సూచించకుండా, వాటి ఉనికి లేదా కార్యాన్ని అంతం చేయడం అనే విస్తృత భావాన్ని ఇస్తుంది.
- source_word: ταύτην καὶ ταῦτα
  choice: దానినీ వాటినీ
  rationale: ఏకవచన స్త్రీలింగ సర్వనామం ‘కడుపు’ను, బహువచన నపుంసక సర్వనామం ‘ఆహారాలు’ను తిరిగి సూచిస్తున్నాయి; తెలుగు రూపాలు ఈ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: σῶμα
  choice: శరీరం
  rationale: పౌలు వాడే ఈ పదానికి ప్రామాణిక తెలుగు సమానం; ఇక్కడ భౌతిక శరీరం దైవశాస్త్రీయ ప్రాముఖ్యంతో ప్రస్తావించబడింది.
- source_word: πορνείᾳ
  choice: లైంగిక దుర్నీతి
  rationale: πορνεία సూచించే విస్తృతమైన అనైతిక లైంగిక ప్రవర్తనను ఆధునిక పాఠకులకు స్పష్టంగా తెలిపే గౌరవప్రదమైన పదబంధం.
- source_word: κυρίῳ / κύριος
  choice: ప్రభువు
  rationale: ఇక్కడ యేసును సూచించే κύριος పదానికి దాని క్రైస్తవ దైవశాస్త్రీయ బరువును నిలిపే ప్రామాణిక తెలుగు రూపం.
- source_word: δὲ
  choice: అయితే / కానీ
  rationale: మొదటిది ఆహారం-కడుపు సంబంధానికి దేవుడు పెట్టే ముగింపును, రెండవది శరీరం గురించి వచ్చే ప్రధాన వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా సూచిస్తాయి.
theological_decisions:
- issue: ప్రారంభ వాక్యం కొరింథీయుల నినాదమా, లేక పౌలు స్వయంగా చెప్పిన మాటా
  choice: ఉద్ధరణ చిహ్నాలు లేదా ‘మీరు అంటున్నారు’ వంటి వివరణ లేకుండా నేరుగా అనువదించడం
  alternative: దీనిని కొరింథీయుల నినాదంగా ఉద్ధరణ చిహ్నాల్లో చూపించడం
  rationale: గ్రీకు మూలపాఠంలో ఉద్ధరణకు బాహ్య సంకేతం లేదు. ఇది నినాదమని చాలామంది భావించినా, ప్రధాన పాఠంలో అలా నిర్ణయించడం మూలంలోని నిజమైన అస్పష్టతను తొలగిస్తుంది.
- issue: καταργήσει పదం ఆహారాలు, కడుపుకు సంబంధించి ఇచ్చే భావం
  choice: వాటి ముగింపును సూచించే ‘లేకుండా చేస్తాడు’
  alternative: ‘నాశనం చేస్తాడు’ లేదా ‘రద్దు చేస్తాడు’
  rationale: ఈ క్రియ వాటి కార్యం లేదా ప్రస్తుత వ్యవస్థకు ముగింపు కలిగించడాన్ని సూచించగలదు; ‘నాశనం’ అనే రూపం భౌతిక నిర్మూలన భావాన్ని అవసరానికి మించి బలపరచవచ్చు.
- issue: ‘ప్రభువు శరీరం కోసం’ అనే మాట యొక్క భావబలం
  choice: మూలంలోని సంక్షిప్త పరస్పర సమాంతరతను యథాతథంగా ఉంచడం
  alternative: ‘ప్రభువు శరీరాన్ని సంరక్షిస్తాడు’ లేదా ‘శరీర మేలు కోసం ప్రభువు ఉన్నాడు’ అని విస్తరించడం
  rationale: గ్రీకు వాక్యం ఉద్దేశపూర్వకంగా సంక్షిప్తంగా ఉంది. దానిని విస్తరిస్తే ప్రభువుకు శరీరంతో ఉన్న సంబంధ స్వరూపాన్ని మూలపాఠం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించినట్లు అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని సమాంతర నిర్మాణాన్ని, సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపాం. ‘ఆహారాలు’ అనే బహువచనం మూలంలోని τὰ βρώματα రూపాన్ని ప్రతిబింబిస్తుంది.
