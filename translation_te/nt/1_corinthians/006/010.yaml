  source_fidelity: 'The Telugu faithfully represents every Greek vice-list term and the future negation: κλέπται = దొంగలు, πλεονέκται = అత్యాశపరులు, μέθυσοι = తాగుబోతులు, λοίδοροι = దుర్భాషలాడేవారు, ἅρπαγες = ఇతరులను దోచుకునేవారు, and βασιλείαν θεοῦ κληρονομήσουσιν = దేవుని రాజ్యాన్ని వారసత్వంగా పొందరు. The rendering of ἅρπαγες appropriately distinguishes predatory seizure/exploitation from κλέπται without artificially narrowing it to only extortion or physical robbery.'
