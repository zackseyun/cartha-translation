id: 1CO.6.10
reference: 1 Corinthians 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὔτε ⸂κλέπται οὔτε πλεονέκται⸃, ⸀οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν ⸀θεοῦ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: te
  text: దొంగలు గానీ, అత్యాశపరులు[a] గానీ, తాగుబోతులు గానీ, దుర్భాషలాడేవారు[b] గానీ, ఇతరులను దోచుకునేవారు[c] గానీ దేవుని రాజ్యాన్ని వారసత్వంగా పొందరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అత్యాశపరులు’ అనే మాటకు ‘లోభులు’ అని కూడా అనువదించవచ్చు (πλεονέκται).
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఇతరులను తిట్టి అవమానించే మాటలు మాట్లాడేవారు (λοίδοροι).
    reason: lexical_clarification
  - marker: c
    text: ‘ఇతరులను దోచుకునేవారు’ అనే మాటకు ‘బలవంతంగా లాక్కునేవారు’ లేదా ‘దోపిడీ చేసేవారు’ అని కూడా అనువదించవచ్చు (ἅρπαγες).
    reason: lexical_alternative
lexical_decisions:
- source_word: κλέπται
  choice: దొంగలు
  rationale: దొంగతనం చేసేవారిని సూచించే సహజమైన ఆధునిక తెలుగు పదం; పాపాల జాబితాలోని వ్యక్తివాచక బహువచన రూపాన్ని నిలుపుతుంది.
- source_word: πλεονέκται
  choice: అత్యాశపరులు
  rationale: మరింత సంపాదించాలనే తీరని ఆశతో లక్షణీకరించబడినవారిని సూచిస్తుంది; ‘లోభులు’ కంటే సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: μέθυσοι
  choice: తాగుబోతులు
  rationale: ఎప్పుడో ఒకసారి మద్యం సేవించినవారిని కాకుండా, మత్తుకు అలవాటుపడినవారిని సూచించే వ్యక్తివాచక నామం.
- source_word: λοίδοροι
  choice: దుర్భాషలాడేవారు
  rationale: కేవలం అబద్ధ నిందలు మోపేవారనే సంకుచిత భావం కాకుండా, ఇతరులను తిట్టి అవమానించే మాటల ప్రవర్తనను తెలియజేస్తుంది.
- source_word: ἅρπαγες
  choice: ఇతరులను దోచుకునేవారు
  rationale: బలవంతం, బెదిరింపు లేదా అన్యాయ ప్రయోజనం ద్వారా ఇతరులది కాజేసే విస్తృత భావాన్ని అందిస్తుంది; ముందున్న ‘దొంగలు’తో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: βασιλείαν θεοῦ
  choice: దేవుని రాజ్యం
  rationale: దేవుని పరిపాలన మరియు రాజ్యాన్ని సూచించే స్థిరమైన, వేదాంతపరమైన ప్రతిధ్వని గల తెలుగు రూపం.
- source_word: κληρονομήσουσιν
  choice: వారసత్వంగా పొందరు
  rationale: భవిష్యత్తులో వారసునిగా వాటా పొందడం అనే క్రియ యొక్క భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: పాపాల జాబితాలోని వ్యక్తివాచక పదాలు మరియు రాజ్యాన్ని వారసత్వంగా పొందడం
  choice: మూలంలోని వ్యక్తుల వర్గాలను నేరుగా పేర్కొని, వారు దేవుని రాజ్యాన్ని వారసత్వంగా పొందరని చెప్పడం
  alternative: ఇవి జీవితాన్ని లక్షణీకరించే పశ్చాత్తాపంలేని అలవాట్లని లేదా ఒక్కొక్క చర్యలని ప్రధాన వాక్యంలోనే వివరించడం
  rationale: గ్రీకు బహువచన వ్యక్తివాచక పదాలు ఈ ప్రవర్తనలతో గుర్తింపబడే వ్యక్తుల వర్గాలను సూచిస్తాయి. అయితే పశ్చాత్తాపం, అలవాటు లేదా ఒక్కొక్క చర్య అనే వ్యాఖ్యానాన్ని వాక్యంలో చేర్చకుండా మూలంలోని గంభీరతను, వేదాంతపరమైన ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘గానీ’ పునరుక్తి గ్రీకు οὔτε/οὐ వరుసలోని జాబితా లయను సహజ తెలుగులో ప్రతిబింబిస్తుంది.
