id: 1CO.6.4
reference: 1 Corinthians 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: te
  text: కాబట్టి, ఈ జీవితానికి సంబంధించిన న్యాయవ్యవహారాలు మీకు ఉంటే,[a] సంఘంలో తృణీకరించబడినవారినే న్యాయనిర్ణేతలుగా నియమిస్తారా?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దైనందిన జీవిత వ్యవహారాలు.” గ్రీకు పదం సాధారణ భౌతిక లేదా పౌర జీవితానికి చెందిన విషయాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సంఘంలో తృణీకరించబడినవారిని.” ఈ గ్రీకు మాట సంఘంలో అల్పులుగా ఎంచబడేవారిని గానీ, సంఘం దృష్టిలో స్థానం లేనివారిని గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: కొందరు ఈ వాక్యాన్ని వ్యంగ్య ఆజ్ఞగా, “సంఘంలో తృణీకరించబడినవారినే న్యాయనిర్ణేతలుగా నియమించండి” అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: ఈ జీవితానికి సంబంధించిన విషయాలు
  rationale: సాధారణ భౌతిక, దైనందిన లేదా పౌర జీవిత వ్యవహారాలను సూచిస్తుంది; నైతికంగా ప్రతికూల భావం కలిగించగల ‘లోకసంబంధమైన’ అనే పదాన్ని నివారిస్తుంది.
- source_word: κριτήρια
  choice: తీర్పు చెప్పవలసి వచ్చినప్పుడు
  rationale: ఈ సందర్భంలో న్యాయవిచారణకు వచ్చే వ్యవహారాలు లేదా వాటిపై తీర్పు చెప్పే ప్రక్రియను సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు భావాన్ని క్రియారూపంలో వ్యక్తం చేసింది.
- source_word: ἐὰν ἔχητε
  choice: వచ్చినప్పుడు
  rationale: గ్రీకు షరతును తెలుగులో సందర్భానుకూలమైన షరతు-కాల నిర్మాణంతో అందిస్తుంది; అటువంటి వ్యవహారాలు ఎదురైతే అనే భావం నిలుస్తుంది.
- source_word: τοὺς ἐξουθενημένους
  choice: ఏమాత్రం గౌరవం లేనివారు
  rationale: తృణీకరించబడినవారు, అల్పులుగా ఎంచబడినవారు, లేదా సంఘం దృష్టిలో స్థానం లేనివారు అనే పరిధిని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: సంఘంలో
  rationale: సంఘ సమాజంలో లేదా సంఘం దృష్టిలో అనే రెండు సమీప భావాలకు అవకాశం ఉంచే ప్రత్యక్ష అనువాదం.
- source_word: τούτους καθίζετε
  choice: వారినే న్యాయనిర్ణేతలుగా నియమిస్తారా?
  rationale: న్యాయ సందర్భంలో ‘కూర్చోబెట్టడం’ అంటే తీర్పు చెప్పే స్థానంలో నియమించడం. ప్రశ్నార్థక పఠనాన్నీ గ్రీకు వాక్యంలోని వ్యంగ్య గద్దింపునూ స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: వాక్యం ప్రశ్నా, వ్యంగ్య ఆజ్ఞా; ‘గౌరవం లేనివారు’ ఎవరు?
  choice: గద్దింపుతో కూడిన ప్రశ్నగా అనువదించి, వారి గుర్తింపును నిర్దిష్టంగా తేల్చకుండా ఉంచడం
  alternative: ‘సంఘంలో తృణీకరించబడినవారినే న్యాయనిర్ణేతలుగా నియమించండి’ అనే వ్యంగ్య ఆజ్ఞగా చదవడం; లేదా ఈ వ్యక్తులను సంఘానికి వెలుపలివారిగా నిర్దిష్టీకరించడం
  rationale: SBLGNT విరామచిహ్నం ప్రశ్నార్థక పఠనానికి మద్దతిస్తుంది; 6:1–6లోని గద్దింపు సందర్భానికీ ఇది సరిపోతుంది. అయినా గ్రీకు వాక్యనిర్మాణం క్లిష్టమైనది కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచనలో ఉంచి, ‘ἐξουθενημένους’ ఎవరనే ఉద్రిక్తతను పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. న్యాయసందర్భాన్ని స్పష్టం చేయడానికి ‘న్యాయనిర్ణేతలు’ వాడినా, క్లిష్టమైన గ్రీకు వాక్యనిర్మాణంలోని ప్రశ్న/ఆజ్ఞ సందిగ్ధతను పాదసూచనలో నిలిపింది.
