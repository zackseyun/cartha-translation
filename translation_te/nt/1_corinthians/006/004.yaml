revisions:
- from: కాబట్టి, ఈ జీవితానికి సంబంధించిన విషయాలపై తీర్పు చెప్పవలసి వచ్చినప్పుడు,[a] సంఘంలో ఏమాత్రం గౌరవం లేనివారినే న్యాయనిర్ణేతలుగా నియమిస్తారా?[b][c]
  to: కాబట్టి, ఈ జీవితానికి సంబంధించిన న్యాయవ్యవహారాలు మీకు ఉంటే,[a] సంఘంలో తృణీకరించబడినవారినే న్యాయనిర్ణేతలుగా నియమిస్తారా?[b][c]
  rationale: The revision restores the source’s conditional formulation and its reference to ordinary-life legal matters, while retaining the interrogative reading supported by the supplied SBLGNT punctuation. It also replaces an absolute social description with wording that more closely represents ἐξουθενημένους and preserves the referential ambiguity documented in the audit trail. All three footnote anchors and their functions are retained.
  reviewer_model: gpt-5.6-terra
