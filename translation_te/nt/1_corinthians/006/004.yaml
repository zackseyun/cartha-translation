review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the rhetorical-question reading and judicial sense of καθίζετε, but it recasts βιωτικὰ κριτήρια ἐὰν ἔχητε ('if you have life-related judicial matters/cases') as 'when it becomes necessary to give judgment concerning matters of this life.' This shifts the Greek conditional possession of disputes/cases into a circumstance requiring adjudication. A more direct rendering should retain 'if you have ... legal disputes.'
  naturalness: The Telugu is generally clear and appropriately formal. 'న్యాయవ్యవహారాలు మీకు ఉంటే' is more idiomatic and closer to the source than 'తీర్పు చెప్పవలసి వచ్చినప్పుడు.'
  terminology: '''సంఘం'' and ''న్యాయనిర్ణేతలుగా నియమిస్తారా?'' are suitable. ''ఏమాత్రం గౌరవం లేనివారు'' is overly absolute for ἐξουθενημένους; ''తృణీకరించబడినవారు'' better conveys persons treated with contempt while preserving the contextual ambiguity. ''ఈ జీవితానికి సంబంధించిన'' appropriately avoids an unnecessarily moralized sense of βιωτικά.'
  issues:
  - severity: medium
    issue: The conditional clause does not directly render κριτήρια ἐὰν ἔχητε.
    rationale: The Greek says, literally, 'if you have life-related judicial matters/cases.' The draft's 'తీర్పు చెప్పవలసి వచ్చినప్పుడు' introduces the need to pronounce judgment and omits the explicit notion that such cases are present.
  - severity: low
    issue: ‘ఏమాత్రం గౌరవం లేనివారు’ overstates the participle ἐξουθενημένους.
    rationale: The word denotes people regarded with contempt or as insignificant, not necessarily people having absolutely no honor. A passive expression such as ‘తృణీకరించబడినవారు’ is more accurate and leaves their identity open.
  revised_text: కాబట్టి, ఈ జీవితానికి సంబంధించిన న్యాయవ్యవహారాలు మీకు ఉంటే,[a] సంఘంలో తృణీకరించబడినవారినే న్యాయనిర్ణేతలుగా నియమిస్తారా?[b][c]
