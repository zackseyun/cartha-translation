    rationale: సందర్భానికి సరైనదే అయినా, κρίματα ἔχετε μεθ’ ἑαυτῶν అక్షరార్థంగా ‘మీ మధ్య న్యాయవ్యాజ్యాలు ఉండడం’ అని చెబుతుంది. సవరించిన రూపం మూలానికి కొంత దగ్గరగా ఉంటుంది.
