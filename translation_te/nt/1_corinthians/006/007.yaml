id: 1CO.6.7
reference: 1 Corinthians 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: te
  text: కాబట్టి, మీ మధ్య న్యాయవ్యాజ్యాలు[a] ఉండడమే మీకు ఇప్పటికే పూర్తిగా ఓటమి[b]. దానికి బదులుగా ఎందుకు అన్యాయానికి గురికారు? దానికి బదులుగా ఎందుకు మోసపోరు[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయస్థాన కేసులు.’ ఇక్కడ గ్రీకు κρίματα అనేది న్యాయస్థానానికి తీసుకెళ్లిన వివాదాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నష్టం’ లేదా ‘వైఫల్యం.’ గ్రీకు ἥττημα ఓటమి, నష్టం లేదా వైఫల్యాన్ని సూచించగలదు; పౌలు మాటలోని బలాన్ని తెలియజేయడానికి ‘ఓటమి’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మీకు చెందింది పోగొట్టుకోవడం.’ గ్రీకు ἀποστερεῖσθε మోసపోవడం, దోచుకోబడడం లేదా తమకు చెందింది కోల్పోవడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: ఇప్పటికే
  rationale: న్యాయవ్యాజ్యాల ఫలితం రాకముందే వారి ఓటమి సంభవించిందనే వర్తమాన స్థితిని సూచిస్తుంది.
- source_word: μὲν οὖν
  choice: కాబట్టి
  rationale: ముందటి గద్దింపు నుంచి పౌలు తీస్తున్న నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు పదజంటలోని స్వల్ప ఉద్ఘాటన వాక్య నిర్మాణం ద్వారా వ్యక్తమవుతుంది.
- source_word: ὅλως
  choice: పూర్తిగా
  rationale: వారి పరిస్థితి మొత్తంగా ఓటమేనని బలంగా అంచనా వేసే క్రియావిశేషణ భావాన్ని నిలుపుతుంది.
- source_word: ἥττημα
  choice: ఓటమి
  rationale: న్యాయస్థాన తీర్పు ఏదైనా, పరస్పరం వ్యాజ్యాలు పెట్టుకోవడమే సమాజానికి నైతిక పరాజయమని పౌలు చెప్పే పదునైన భావాన్ని తెలియజేస్తుంది.
- source_word: κρίματα
  choice: న్యాయవ్యాజ్యాలు
  rationale: ఈ సందర్భంలో విశ్వాసులు తమ వివాదాలను న్యాయస్థానానికి తీసుకెళ్లడాన్ని సూచిస్తుంది; సాధారణమైన ‘తీర్పులు’ కంటే సందర్భార్థం స్పష్టంగా ఉంటుంది.
- source_word: μεθ’ ἑαυτῶν
  choice: మీలో ఒకరిపై ఒకరు
  rationale: సమాజంలోని సభ్యులు పరస్పరం న్యాయపోరాటం చేస్తున్నారనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: అంతకంటే ... మేలు కాదా?
  rationale: ‘బదులుగా ఎందుకు కాదు?’ అనే పౌలు అలంకార ప్రశ్నను సహజమైన తెలుగు ప్రశ్నారూపంలో, తులనాత్మక బలంతో నిలుపుతుంది.
- source_word: ἀδικεῖσθε
  choice: అన్యాయానికి గురికావడం
  rationale: క్రియలోని కర్మణి భావాన్ని, అన్యాయమైన ప్రవర్తనను భరించాల్సి రావడమనే నైతిక కోణాన్ని నిలుపుతుంది.
- source_word: ἀποστερεῖσθε
  choice: మోసానికి గురికావడం
  rationale: ఇతరుల చేత మోసపోయి తమకు చెందింది కోల్పోవడాన్ని సూచించే కర్మణి భావాన్ని సందర్భానుగుణంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: విశ్వాసుల మధ్య న్యాయవ్యాజ్యాలపై పౌలు ఇచ్చిన అంచనా
  choice: ἥττημα అనే పదాన్ని ‘ఓటమి’గా అనువదించడం
  alternative: ‘నష్టం’ లేదా ‘వైఫల్యం’
  rationale: వ్యాజ్యం ఎవరు గెలిచారనే దానితో సంబంధం లేకుండా, అలాంటి వ్యాజ్యాలు ఉండడమే సమాజానికి ఓటమి అని వచనం బలంగా చెబుతుంది. వచనంలో లేని ప్రత్యేక సిద్ధాంత వర్గాన్ని జోడించదు.
- issue: అన్యాయాన్ని లేదా మోసాన్ని స్వీకరించాలనే అలంకార ప్రశ్నల బలం
  choice: ‘అంతకంటే ... మేలు కాదా?’ అనే సమాంతర ప్రశ్నలు
  alternative: ‘ఎందుకు అన్యాయాన్ని సహించకూడదు?’
  rationale: గ్రీకులోని రెండు సమాంతర కర్మణి ప్రశ్నలను నిలుపుతూ, ‘సహించు’ వంటి మూలంలో లేని సంకల్పార్థక క్రియను చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మొదటి వాక్యంలో పౌలు నిర్ధారణలోని తీవ్రతను, చివరి రెండు వాక్యాల్లోని సమాంతర అలంకార ప్రశ్నలను నిలుపుకుంది. ‘మీకు ఇప్పటికే పూర్తిగా ఓటమి’ అనే నిర్మాణం ὑμῖν ἐστιν అనే సంబంధ దత్తివును అదనపు ‘అవమానం’ భావం చేర్చకుండా ప్రతిబింబిస్తుంది.
