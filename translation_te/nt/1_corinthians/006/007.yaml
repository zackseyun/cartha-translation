revisions:
- from: కాబట్టి, మీలో ఒకరిపై ఒకరు న్యాయవ్యాజ్యాలు[a] పెట్టుకోవడమే మీకు ఇప్పటికే పూర్తిగా ఓటమి[b]. అంతకంటే అన్యాయానికి గురికావడమే మేలు కాదా? అంతకంటే మోసానికి గురికావడమే[c] మేలు కాదా?
  to: కాబట్టి, మీ మధ్య న్యాయవ్యాజ్యాలు[a] ఉండడమే మీకు ఇప్పటికే పూర్తిగా ఓటమి[b]. దానికి బదులుగా ఎందుకు అన్యాయానికి గురికారు? దానికి బదులుగా ఎందుకు మోసపోరు[c]?
  rationale: సవరణ మూలంలోని రెండు సమాంతరమైన διὰ τί οὐχὶ μᾶλλον ప్రశ్నలను ‘దానికి బదులుగా ఎందుకు ...?’ అనే రూపంలో నిలుపుతుంది; ‘మేలు కాదా?’ ద్వారా కలిగిన స్వల్ప అర్థమార్పును తొలగిస్తుంది. అలాగే ‘న్యాయవ్యాజ్యాలు ఉండడమే’ అనేది κρίματα ἔχετε μεθ’ ἑαυτῶν యొక్క భావాన్ని అదనపు క్రియను ప్రవేశపెట్టకుండా సహజంగా వ్యక్తపరుస్తుంది. పాదటిప్పణి గుర్తులు తమకు సంబంధించిన పదాల వద్దనే ఉన్నాయి.
