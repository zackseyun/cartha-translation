id: 1CO.6.5
reference: 1 Corinthians 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: te
  text: మీకు సిగ్గు కలిగించడానికే ఇలా చెబుతున్నాను. నిజంగానే, తన సహోదరుల[b] మధ్య తీర్పు చెప్పగల జ్ఞానవంతుడు[a] ఒక్కడైనా మీలో లేడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జ్ఞానమున్న వ్యక్తి.” గ్రీకులో ఇది పుంలింగ ఏకవచనం; అయితే పౌలు మొత్తం సంఘాన్ని ఉద్దేశించి మాట్లాడుతున్నాడు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “సహోదరులు” అంటే తోటి విశ్వాసులు; సందర్భంలో ఇది సంఘంలోని సహోదరులనూ సహోదరీలనూ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν λέγω
  choice: మీకు సిగ్గు కలిగించడానికే ఇలా చెబుతున్నాను
  rationale: πρός + accusative ఇక్కడ ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. ఈ అనువాదం పౌలు పలికిన గద్దింపు బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὕτως
  choice: నిజంగానే
  rationale: ముందటి వాదననుంచి వచ్చే ఆశ్చర్యంతో కూడిన అలంకారప్రశ్నను ఇది సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἔνι ἐν ὑμῖν οὐδεὶς σοφὸς
  choice: జ్ఞానవంతుడు ఒక్కడైనా మీలో లేడా
  rationale: బలమైన నిషేధాన్ని అలంకారప్రశ్నగా తెలుగులో సహజంగా చూపుతూ, σοφός యొక్క పుంలింగ ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: δυνήσεται διακρῖναι
  choice: తీర్పు చెప్పగల
  rationale: సంఘంలోని వివాదాల న్యాయపరమైన సందర్భంలో διακρίνω అంటే పక్షాల మధ్య నిర్ణయం చేయడం; δυνήσεται తెలిపే సామర్థ్య భావాన్ని ‘చెప్పగల’ అందిస్తుంది.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: తన సహోదరుల మధ్య
  rationale: గ్రీకు వాక్యం ‘తన సహోదరుని మధ్య’ అనే సంక్షిప్త న్యాయవివాద ప్రయోగాన్ని కలిగి ఉంది; తెలుగులో రెండు పక్షాల భావాన్ని సహజంగా తెలియజేయడానికి బహువచన ప్రయోగం వాడబడింది, అదనపు పక్షాన్ని ప్రత్యేకంగా చేర్చలేదు.
theological_decisions:
- issue: మిశ్రమ సంఘాన్ని ఉద్దేశించిన పుంలింగ ప్రతినిధి భాష
  choice: జ్ఞానవంతుడు ... సహోదరులు
  alternative: జ్ఞానమున్న వ్యక్తి ... తోటి విశ్వాసులు
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపం మరియు కుటుంబసంబంధ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అవి సంఘంలోని స్త్రీపురుష విశ్వాసులందరికీ వర్తించగలవని పాదసూచికల్లో స్పష్టం చేశాం.
- issue: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ లోని సంక్షిప్తత
  choice: తన సహోదరుల మధ్య
  alternative: తన సహోదరునికీ మరొకరికీ మధ్య
  rationale: ‘మరొకరు’ అని మూలంలో లేని పదాన్ని స్పష్టంగా చేర్చకుండా, వివాదంలోని పక్షాల మధ్య తీర్పు అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, నేరుగా గద్దించే శైలి వాడబడింది. వాక్యాన్ని సహజమైన తెలుగు అలంకారప్రశ్నగా నిర్మించాం; మూలంలోని సంఘపరమైన కుటుంబభాషను నిలిపాం.
