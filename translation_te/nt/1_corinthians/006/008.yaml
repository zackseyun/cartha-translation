revisions:
- from: కాని మీరే అన్యాయం చేస్తున్నారు, మోసం చేస్తున్నారు—అదీ సహోదరులనే[a].
  to: కాని మీరే అన్యాయం చేస్తున్నారు, మోసం చేస్తున్నారు—అదీ మీ సహోదరులకే[a].
  rationale: '‘మీ సహోదరులకే’ corrects the Telugu case relation and makes the climactic accusation natural: they commit these acts against their own fellow believers. ‘కే’ preserves the emphasis of καὶ τοῦτο, and the footnote remains anchored to the relevant expression while preserving the Greek masculine plural and its broader ecclesial reference.'
  reviewer_model: gpt-5.6-terra
