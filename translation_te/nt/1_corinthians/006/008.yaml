review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast (ἀλλά), the emphatic explicit subject (ὑμεῖς), wrongdoing and defrauding, and the climactic force of καὶ τοῦτο. However, ‘సహోదరులనే’ is not the natural Telugu form for those who receive the wrongdoing/defrauding; the Greek accusative functions as the direct object, which Telugu idiom normally expresses with a dative recipient/victim form.
  naturalness: ‘అదీ సహోదరులనే’ is syntactically and idiomatically awkward in modern standard Telugu. ‘అదీ మీ సహోదరులకే’ naturally expresses ‘and this [you do] to your brothers,’ while retaining the rhetorical emphasis.
  terminology: ‘సహోదరులు’ is a suitable form-sensitive rendering of ἀδελφοί in the main text. The note appropriately records that the word may refer more broadly to fellow believers, including women. ‘అన్యాయం చేస్తున్నారు’ and ‘మోసం చేస్తున్నారు’ are clear contemporary equivalents in this legal-economic context.
  issues:
  - severity: medium
    issue: The phrase ‘సహోదరులనే’ uses an unsuitable case/form after ‘అదీ’.
    rationale: The verse says that the Corinthians wrong and defraud fellow believers. Telugu normally marks the persons harmed with ‘-కు/-లకే’; ‘సహోదరులనే’ instead reads awkwardly and can suggest an object-focus not supported by natural Telugu syntax.
  revised_text: కాని మీరే అన్యాయం చేస్తున్నారు, మోసం చేస్తున్నారు—అదీ మీ సహోదరులకే[a].
