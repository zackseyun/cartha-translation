  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: te
  text: కాని మీరే అన్యాయం చేస్తున్నారు, మోసం చేస్తున్నారు—అదీ మీ సహోదరులకే[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహోదర సహోదరీలకే’; గ్రీకులో ‘సహోదరులు’ అని ఉంది; ఈ పదం విస్తృతంగా తోటి విశ్వాసులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: కాని
  rationale: ముందటి వాక్యంతో ఉన్న బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑμεῖς
  choice: మీరే
  rationale: గ్రీకులో స్పష్టంగా ఉన్న కర్తృసర్వనామపు నొక్కిచెప్పడాన్ని ‘ఏ’ ప్రత్యయం ద్వారా నిలుపుతుంది.
- source_word: ἀδικεῖτε
  choice: అన్యాయం చేస్తున్నారు
  rationale: ఇతరులకు అన్యాయం చేయడం అనే విస్తృత నైతిక భావాన్ని, అవసరానికి మించి నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: ἀποστερεῖτε
  choice: మోసం చేస్తున్నారు
  rationale: ఎవరికైనా చెందవలసినదాన్ని దక్కనివ్వకుండా మోసగించడం అనే భావాన్ని న్యాయపరమైన, ఆర్థిక సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ τοῦτο
  choice: —అదీ
  rationale: తాము చేసే తప్పు సహోదరులకే చేయబడుతోందనే అపరాధ తీవ్రతను తెలుగులో సహజమైన వాక్చాతుర్యంతో నొక్కిచెబుతుంది.
- source_word: ἀδελφούς
  choice: సహోదరులనే
  rationale: గ్రీకు పదంలోని పురుష బహువచన రూపాన్ని నిలుపుతూ, సందర్భంలో తోటి విశ్వాసులను సూచించగల విస్తృత ప్రయోగాన్ని పాదటిప్పణిలో వివరిస్తుంది.
theological_decisions:
- issue: మిశ్రలింగ విశ్వాసుల సమాజంలో ἀδελφούς పదం అనువాదం
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు; తోటి విశ్వాసులు
  rationale: మూలపదం వ్యాకరణపరంగా పురుష బహువచనం; అయితే పౌలు వాడుకలో అది విశ్వాసుల సమాజాన్ని విస్తృతంగా సూచించవచ్చు. అందువల్ల ప్రధాన పాఠ్యంలో మూలరూపానికి దగ్గరగా ఉంచి, సమావేషక సందర్భార్థాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘మీరే’ మరియు ‘అదీ ... అనే’ రూపాలు గ్రీకు వాక్యంలోని రెండు నొక్కిచెప్పే అంశాలను సహజంగా నిలుపుతున్నాయి.
