id: 1CO.6.6
reference: 1 Corinthians 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: te
  text: కానీ ఒక సోదరుడు[b] మరో సోదరునిపై న్యాయవివాదం చేస్తున్నాడు; అదీ అవిశ్వాసుల ఎదుటనా[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ అవిశ్వాసుల ఎదుటనా?’ ఈ పదబంధం సంఘానికి వెలుపలివారు నిర్వహించే లౌకిక న్యాయస్థానాలను సూచించే అవకాశం ఉంది; అయితే గ్రీకు పాఠ్యం కేవలం ‘అవిశ్వాసుల ఎదుట’ అని చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సోదరుడు’ అనే పదం ఇక్కడ క్రైస్తవ సమాజంలోని తోటి సభ్యుణ్ణి సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: మునుపటి వచనంలో సంఘంలోనే వివాదాన్ని తీర్చగలగాలి అన్న భావానికి, ఇక్కడి వాస్తవ పరిస్థితికి ఉన్న బలమైన వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: ఒక సోదరుడు మరో సోదరునిపై
  rationale: గ్రీకులోని పునరుక్త ఏకవచన కుటుంబపదాన్ని నిలుపుతూ, ఇద్దరు తోటి విశ్వాసుల మధ్య వివాదమని తెలుగులో స్పష్టంగా, సహజంగా చెబుతుంది.
- source_word: μετὰ
  choice: పై
  rationale: న్యాయవివాద సందర్భంలో μετά ఇక్కడ సహవాసాన్ని కాకుండా ప్రత్యర్థి పక్షాల మధ్య వ్యతిరేక సంబంధాన్ని సూచిస్తుంది.
- source_word: κρίνεται
  choice: న్యాయస్థానానికి వెళ్తున్నాడు
  rationale: ఈ సందర్భంలో పదానికి న్యాయవ్యవహారంలో తలపడటం అనే భావం ఉంది; కేవలం ‘తీర్పు పొందుతున్నాడు’ అనడం కన్నా ఈ అనువాదం సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: καὶ τοῦτο
  choice: అదీ
  rationale: విశ్వాసుల మధ్య వ్యాజ్యం ఉండటమే కాక అది అవిశ్వాసుల ఎదుట జరగడంపై పౌలు వ్యక్తం చేస్తున్న ఆశ్చర్యం, మందలింపు రెండింటినీ సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: ἐπὶ ἀπίστων
  choice: అవిశ్వాసుల ఎదుట
  rationale: ἐπί + షష్ఠీ విభక్తి ఇక్కడ కేసు ఎవరి ఎదుట విచారించబడుతోందో సూచిస్తుంది; గ్రీకు పాఠ్యంలో లేని ‘న్యాయాధిపతులు’ అనే పరిమితిని చేర్చకుండా అసలు విస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: సంఘసభ్యులను సూచించే ἀδελφός పదం
  choice: సోదరుడు
  alternative: తోటి విశ్వాసి; సోదరుడు లేదా సోదరి
  rationale: గ్రీకులోని పుంలింగ ఏకవచన కుటుంబపదాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. సందర్భంలో ఇది క్రైస్తవ సమాజ సభ్యులను ప్రతినిధిగా సూచిస్తుందనే విషయాన్ని పాదసూచికలో వివరించాం.
- issue: ἀπίστων పదపు పరిధి
  choice: అవిశ్వాసులు
  alternative: అవిశ్వాసులైన న్యాయాధిపతులు; సంఘానికి వెలుపలివారు
  rationale: పౌలు విశ్వాసుల సమాజానికి, విశ్వసించనివారికి మధ్య చేస్తున్న వ్యత్యాసాన్ని ఇది నిలుపుతుంది; గ్రీకు స్పష్టంగా చెప్పనంతగా వారి పాత్రను సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయపర భాషను వాడాం. ‘అదీ ... ఎదుటనా?’ అనే ప్రశ్నారూపం పౌలు వ్యక్తం చేసే ఆశ్చర్యభరిత మందలింపును నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులను సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచాం.
