id: 1CO.6.1
reference: 1 Corinthians 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: te
  text: మీలో ఎవడైనా మరొకనిపై ఒక వ్యవహారం ఉండగా, పరిశుద్ధుల[b] ఎదుట కాక అన్యాయుల[a] ఎదుట తీర్పు పొందడానికి తెగిస్తాడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అన్యాయులు” అనే పదాన్ని “అనీతిమంతులు” అని కూడా అనువదించవచ్చు. కొందరు దీనిని భావార్థంగా “అవిశ్వాసులు” అని అనువదిస్తారు; అయితే గ్రీకులో “అన్యాయులు/అనీతిమంతులు” అనే అర్థమే ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “పరిశుద్ధులు” అంటే దేవునికి చెందిన పరిశుద్ధ ప్రజలు, అంటే విశ్వాసులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: తెగిస్తాడా?
  rationale: పౌలు అడిగిన గద్దింపు ధ్వనిగల అలంకారిక ప్రశ్నను, సందర్భంలో ధైర్యం హద్దుమీరిన సాహసంగా కనిపించే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τις ὑμῶν
  choice: మీలో ఎవడైనా
  rationale: అనిర్దిష్ట ఏకవచనమైన τις మరియు భాగార్థక ὑμῶνను నేరుగా సంబోధించే ఏకవచన రూపంలో నిలుపుతుంది.
- source_word: πρᾶγμα ἔχων
  choice: వివాదం ఉన్నప్పుడు
  rationale: న్యాయసంబంధ సందర్భంలో πρᾶγμα ఒక వ్యవహారం లేదా వివాదాన్ని సూచిస్తుంది; 'వివాదం' దావా అని అతిగా నిర్దిష్టం చేయకుండా అర్థాన్ని తెలియజేస్తుంది.
- source_word: πρὸς τὸν ἕτερον
  choice: మరొకనిపై
  rationale: వివాద సందర్భంలో πρός తెలిపే ప్రతిపక్ష సంబంధాన్ని సహజమైన తెలుగు న్యాయవ్యవహార శైలిలో వ్యక్తం చేస్తుంది.
- source_word: κρίνεσθαι
  choice: తీర్పు పొందడానికి
  rationale: క్రియలోని నిష్క్రియాత్మక న్యాయార్థాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἐπὶ τῶν ἀδίκων
  choice: అనీతిమంతుల ఎదుట
  rationale: ἀδίκων అనే నైతికంగా విలువనిర్ణయించే పదాన్ని 'అవిశ్వాసులు' అని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది; న్యాయసందర్భంలోని ἐπίని 'ఎదుట'గా అందిస్తుంది.
- source_word: καὶ οὐχὶ
  choice: కాకుండా
  rationale: తెలుగు ప్రశ్న నిర్మాణంలో రెండు వర్గాల మధ్యనున్న స్పష్టమైన వ్యతిరేకతను సహజంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τῶν ἁγίων
  choice: పరిశుద్ధుల ఎదుట
  rationale: ἁγίωνకు పౌలు వాడే స్థిరమైన 'పరిశుద్ధులు' అనే పదాన్ని నిలుపుతూ, న్యాయసంబంధ ἐπίని 'ఎదుట'గా అనువదిస్తుంది.
theological_decisions:
- issue: ἀδίκων మరియు ἁγίων మధ్య వ్యతిరేకత
  choice: అనీతిమంతులు ... పరిశుద్ధులు
  alternative: అవిశ్వాసులు ... విశ్వాసులు
  rationale: గ్రీకు పాఠం అవిశ్వాసం/విశ్వాసం అనే వివరణాత్మక పదాల బదులు నైతిక-వేదాంతపరమైన పదాలను వాడుతుంది. ఆ ఉద్రిక్తతను పరిష్కరించకుండా మూలపాఠపు పదబంధాన్ని నిలిపాం.
- issue: ἔχων యొక్క ప్రతినిధి పుంలింగ ఏకవచనం
  choice: ఎవడైనా ... ఉన్నప్పుడు ... తెగిస్తాడా
  alternative: ఎవరైనా ... ఉన్నప్పుడు ... తెగిస్తారా
  rationale: మూలంలోని వ్యాకరణ ఏకవచన ప్రతినిధి రూపాన్ని స్పష్టంగా నిలిపింది; ఆధునిక తెలుగులో ఇది కొంత పుంలింగ సూచన కలిగినప్పటికీ మూలరూపానికి సన్నిహితంగా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, నేరుగా గద్దించే అలంకారిక ప్రశ్న. న్యాయసంబంధ భావాన్ని స్పష్టంగా ఉంచుతూ, మూలంలోని నైతిక-వేదాంత పదజాలాన్ని వ్యాఖ్యానాత్మకంగా సరళీకరించలేదు.
