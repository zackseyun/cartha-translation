id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: te
  text: మీ శరీరాలు మెస్సీయకు చెందిన అవయవాలని మీకు తెలియదా? అలాంటప్పుడు నేను మెస్సీయకు చెందిన అవయవాలను తీసుకొని, వాటిని ఒక వేశ్యకు చెందిన అవయవాలుగా చేస్తానా? అలా ఎన్నటికీ జరగకూడదు![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మెస్సీయ’కు బదులు ‘క్రీస్తు’ అని కూడా అనువదించవచ్చు. గ్రీకు Χριστός అనే పదం ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదుగానూ, ‘క్రీస్తు’ అనే పేరువంటి రూపంగానూ వాడబడుతుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఎట్టి పరిస్థితిలోనూ కాదు!’ లేదా ‘ఎంతమాత్రమూ కాదు!’ గ్రీకు μὴ γένοιτο బలమైన తిరస్కారాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: శరీరాలు
  rationale: ఈ బహువచనం విశ్వాసుల వాస్తవమైన దేహసహిత ఉనికిని సూచిస్తుంది; కేవలం శరీర భాగాలను కాదు.
- source_word: μέλη
  choice: అవయవాలు
  rationale: శరీరంలోని భాగాలు ఒక సంపూర్ణ దేహానికి చెందినవనే పౌలు రూపకాన్ని ఇది సహజంగా నిలుపుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయకు చెందిన
  rationale: Χριστός ఇక్కడ అభిషిక్తుడనే బిరుదుగా పనిచేస్తుంది. గ్రీకు సంబంధవిభక్తిని తెలుగులో సహజంగా తెలియజేయడానికి ‘కు చెందిన’ వాడబడింది.
- source_word: ἄρας
  choice: తీసుకొని
  rationale: తలపెట్టిన చర్యను పరిచయం చేసే ఈ కృదంతం, తదుపరి ‘చేస్తానా?’ అనే అలంకారప్రశ్నతో సహజంగా కలుస్తుంది.
- source_word: ποιήσω
  choice: చేస్తానా
  rationale: ‘అవయవాలుగా చేయడం’ అనే దిగ్భ్రాంతికరమైన అలంకారప్రశ్నను నేరుగా నిలుపుతుంది.
- source_word: πόρνης
  choice: ఒక వేశ్యకు చెందిన
  rationale: πόρνη ఈ సందర్భంలో ప్రత్యేకంగా వేశ్యను సూచిస్తుంది; సాధారణ లైంగిక అనైతికతను కాదు.
- source_word: μὴ γένοιτο
  choice: అలా ఎన్నటికీ జరగకూడదు!
  rationale: ఇది సాధారణ నిరాకరణకంటే బలమైన, విస్మయపూర్వక తిరస్కారాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ οἴδατε
  choice: మీకు తెలియదా?
  rationale: శ్రోతలకు ఇప్పటికే తెలిసి ఉండవలసిన విషయాన్ని గుర్తుచేసే అలంకారప్రశ్న స్వరాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పౌలు వాడిన Χριστός అనే బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ ఈ పదం అభిషిక్తుడనే బిరుదు భావాన్ని కలిగి ఉంది; ‘మెస్సీయ’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది, అయితే ‘క్రీస్తు’ అనే సంప్రదాయ రూపం కూడా సాధ్యమే.
- issue: μὴ γένοιτο యొక్క బలమైన తిరస్కారం
  choice: అలా ఎన్నటికీ జరగకూడదు!
  alternative: ఎట్టి పరిస్థితిలోనూ కాదు! / ఎంతమాత్రమూ కాదు!
  rationale: పౌలు కేవలం ‘కాదు’ అని చెప్పడం లేదు; ఆ ఆలోచనే జరగరానిదని తీవ్రంగా తిరస్కరిస్తున్నాడు. ఎంపిక చేసిన రూపం ఆ బలాన్నీ, ఆకాంక్షార్థక ఛాయనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘అవయవాలు’ అనే పదాన్ని రెండు చోట్లా పునరావృతం చేసి పౌలు ఉద్దేశించిన శరీర రూపకాన్నీ, ప్రశ్నలోని దిగ్భ్రాంతికరమైన సమాంతరతనూ నిలుపుకున్నాం.
