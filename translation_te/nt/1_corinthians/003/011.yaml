id: 1CO.3.11
reference: 1 Corinthians 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: te
  text: ఎందుకంటే, ఇప్పటికే వేయబడిన పునాది తప్ప మరొక పునాదిని ఎవరూ వేయలేరు; ఆ పునాది మెస్సీయ అయిన యేసే[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “యేసు క్రీస్తే.”'
    reason: Χριστός అనే బిరుదుకు సంప్రదాయబద్ధమైన లిప్యంతరీకరణతో కూడిన ప్రత్యామ్నాయ తెలుగు రూపం.
lexical_decisions:
- source_word: θεμέλιον
  choice: పునాది
  rationale: నిర్మాణానికి సంబంధించిన పౌలు ఉపయోగించిన రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఈ వాక్యం కారణం లేదా వివరణ ఇస్తున్న సంబంధాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ἄλλον
  choice: మరొక
  rationale: ఇప్పటికే ఉన్న పునాదికి అదనంగా లేదా దానికి భిన్నంగా ఉండే పునాదిని సూచిస్తుంది.
- source_word: οὐδεὶς δύναται θεῖναι
  choice: ఎవరూ వేయలేరు
  rationale: సార్వత్రిక నిరాకరణను, సామర్థ్యాన్ని, పునాది వేయడమనే నిర్మాణ ప్రయోగాన్ని సంక్షిప్తంగా మరియు సహజంగా అందిస్తుంది.
- source_word: παρὰ τὸν κείμενον
  choice: ఇప్పటికే వేయబడిన పునాది తప్ప
  rationale: παρά యొక్క మినహాయింపు భావాన్ని ‘తప్ప’ తెలియజేస్తుంది; κείμενον సూచించే పునాది ముందే స్థాపించబడి ఉన్న స్థితిని ‘ఇప్పటికే వేయబడిన’ స్పష్టం చేస్తుంది.
- source_word: ὅς ἐστιν
  choice: ఆ పునాది … యేసే
  rationale: సంబంధసర్వనామం తిరిగి పునాదినే సూచిస్తోందని స్పష్టంగా ఉంచుతూ, పునాదిని యేసుతో బలంగా గుర్తిస్తుంది.
- source_word: Ἰησοῦς Χριστός
  choice: మెస్సీయ అయిన యేసు
  rationale: Ἰησοῦς అనే పేరును యేసుగా ఉంచి, Χριστός యొక్క బిరుదు భావాన్ని ‘మెస్సీయ’గా అనువదిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘మెస్సీయ అయిన యేసు’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: Ἰησοῦς Χριστόςలో Χριστόςను ఎలా అందించాలి
  choice: మెస్సీయ అయిన యేసు
  alternative: యేసు క్రీస్తు
  rationale: Χριστόςలోని అభిషిక్తుడు/మెస్సీయ అనే బిరుదు భావాన్ని ప్రధాన పాఠ్యంలో వ్యక్తం చేశాం. సంప్రదాయబద్ధంగా విస్తృతంగా వినిపించే ‘యేసు క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో ఉంచాం; దీనివల్ల ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చకుండా రెండు సహజ రూపాలూ అందుబాటులో ఉంటాయి.
- issue: పునాది మరియు యేసు మధ్య గుర్తింపు
  choice: ఆ పునాది మెస్సీయ అయిన యేసే
  alternative: అది మెస్సీయ అయిన యేసు
  rationale: ὅς అనే సంబంధసర్వనామం వ్యాకరణపరంగా ‘పునాది’ని తిరిగి సూచిస్తుంది. ‘ఆ పునాది’ అని పునరుక్తి చేయడం ఆ సంబంధాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది; ‘యేసే’ అనే నిశ్చయార్థక రూపం గ్రీకు గుర్తింపు వాక్యంలోని బలాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖన పఠనానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. పౌలు ఉపయోగించిన నిర్మాణ రూపకం ‘పునాది’, ‘వేయడం’ అనే పదాలతో నిలుపబడింది. [a] గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
