  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: te
  text: ఎవరైనా దానిమీద కట్టిన పని నిలిచి ఉంటే[a], అతడు ప్రతిఫలం[b] పొందుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిలబడితే.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కూలి” లేదా “చెల్లింపు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τινος
  choice: ఎవరైనా … ఉంటే
  rationale: గ్రీకు వాక్యంలోని సాధారణ షరతును, అనిర్దిష్ట వ్యక్తిని సహజమైన తెలుగు షరతు నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: τὸ ἔργον
  choice: పని
  rationale: నిర్మాణ రూపకానికి సరిపోతూ, కార్యం లేదా పరిచర్య ఫలితం అని అతిగా నిర్దిష్టం చేయకుండా గ్రీకు పదపు విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: μενεῖ
  choice: నిలిచి ఉంటే
  rationale: ‘మిగిలి ఉండడం, కొనసాగడం’ అనే మూలభావాన్ని నేరుగా తెలియజేస్తుంది; అగ్ని పరీక్షను ముందుగానే పదంలో చేర్చదు.
- source_word: ὃ ἐποικοδόμησεν
  choice: దానిపై కట్టిన
  rationale: ἐποικοδομέωలోని పునాదిపై కట్టడం అనే భావాన్ని కాపాడుతుంది. ‘దానిపై’ అనేది ముందటి వచనాల సందర్భంలోని పునాదిని సూచిస్తుంది; గ్రీకులో ఇక్కడ పునాది అనే నామవాచకం మళ్లీ లేదు.
- source_word: μισθὸν
  choice: ప్రతిఫలం
  rationale: దైవిక మదింపు సందర్భంలో సహజంగా ఉండి, ప్రతిఫల చెల్లింపు భావాన్ని నిలుపుతుంది; ‘కూలి’ లేదా ‘చెల్లింపు’ అనే ప్రత్యామ్నాయాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
- source_word: λήμψεται
  choice: పొందుతాడు
  rationale: భవిష్యత్ కాలంలోని ‘స్వీకరిస్తాడు/పొందుతాడు’ అనే భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: μισθόςలోని ప్రతిఫలం–కూలి భావవ్యాప్తి
  choice: ప్రతిఫలం
  alternative: కూలి లేదా చెల్లింపు
  rationale: ఈ సందర్భంలో ‘ప్రతిఫలం’ సహజమైనదైనా, మూలపదంలోని పారితోషిక భావాన్ని పూర్తిగా తొలగించకుండా ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
- issue: కట్టబడిన ఆధారం ఇక్కడ స్పష్టంగా పేరుపెట్టబడకపోవడం
  choice: దానిపై
  alternative: పునాదిపై
  rationale: సందర్భం పునాదిని సూచించినప్పటికీ, ఈ వచనంలోని గ్రీకు పాఠ్యంలో ఆ నామవాచకాన్ని మళ్లీ చేర్చలేదు; అందువల్ల అనవసర స్పష్టీకరణను నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘అతడు’ అనే ఏకవచన పురుష సూచనను ప్రతినిధి వ్యక్తిని సూచించే గ్రీకు–సందర్భ నిర్మాణానికి అనుగుణంగా ఉంచాం.
