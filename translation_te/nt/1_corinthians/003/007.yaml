id: 1CO.3.7
reference: 1 Corinthians 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε οὔτε ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων, ἀλλ’ ὁ αὐξάνων θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: te
  text: కాబట్టి నాటేవాడూ ఏమీ కాదు, నీళ్లు పోసేవాడూ ఏమీ కాదు; కానీ ఎదుగుదలను కలిగించేవాడు దేవుడే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎదుగుదలను ఇచ్చేవాడు దేవుడే.” సంప్రదాయంగా, “వృద్ధిని ఇచ్చేవాడు దేవుడే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ φυτεύων
  choice: నాటేవాడు
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతాన్ని సహజంగా వ్యక్తపరుస్తూ, నీళ్లు పోసేవాడితో ఉన్న సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ἐστίν τι
  choice: ఏమీ కాదు
  rationale: మానవ సేవకునికి స్వతంత్ర ప్రాముఖ్యత లేదనే సందర్భార్థాన్ని, గ్రీకు వాక్యంలోని బలమైన నిరాకరణను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ὁ ποτίζων
  choice: నీళ్లు పోసేవాడు
  rationale: వ్యవసాయ సందర్భంలో ποτίζων అర్థాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తూ, మొదటి కృదంతంతో సమాంతరతను కాపాడుతుంది.
- source_word: ἀλλ’
  choice: కాని అనే భావాన్ని సూచించే సెమికోలన్ తరువాతి వ్యతిరేక నిర్మాణం
  rationale: తెలుగు వాక్యంలో ‘ఏమీ కాదు’ అనే పునరుక్తి తరువాత సెమికోలన్ ద్వారా మానవ పనివారికీ దేవునికీ మధ్య బలమైన వ్యత్యాసం సహజంగా వ్యక్తమవుతుంది; ‘కాని’ని స్పష్టంగా చేర్చకపోయినా విరోధ భావం నిలుస్తుంది.
- source_word: ὁ αὐξάνων
  choice: ఎదుగుదల కలిగించేవాడు
  rationale: దేవుడే ఎదుగుదలను ఉత్పత్తి చేస్తున్నాడనే causative భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది; గ్రీకులో లేని నిర్దిష్ట కర్మను చేర్చదు.
- source_word: θεός
  choice: దేవుడే
  rationale: వాక్యాంతంలో ఉన్న θεός యొక్క ఉద్ఘాటనను తెలుగు ‘ఏ’ ప్రత్యయంతో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: మానవ సేవకుల పాత్రకూ దేవుని కార్యానికీ మధ్య వ్యత్యాసం
  choice: ‘నాటేవాడూ ఏమీ కాదు, నీళ్లు పోసేవాడూ ఏమీ కాదు; ... దేవుడే’
  alternative: ‘నాటేవాడు గానీ నీళ్లు పోసేవాడు గానీ ప్రాముఖ్యమైనవారు కారు’
  rationale: గ్రీకులోని తీవ్ర వాక్యరూపాన్ని మృదువుగా మార్చకుండా నిలిపింది; అదే సమయంలో ఈ వచనం మానవ సేవ అసలు విలువలేనిదని సిద్ధాంతపరంగా విస్తరించి చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే వ్యవసాయ పదజాలంతో, పౌలు ఉపయోగించిన సమాంతరతను మరియు దేవునిపై ఉన్న ఉద్ఘాటనను నిలిపిన గౌరవప్రదమైన శైలి.
