id: 1CO.3.1
reference: 1 Corinthians 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: te
  text: సోదరులారా[a], నేను కూడా మిమ్మల్ని ఆత్మీయులుగా భావించి మీతో మాట్లాడలేకపోయాను; శరీరసంబంధులైనవారిగా, అంటే మెస్సీయలో[b] పసిబిడ్డలుగా భావించి మాట్లాడాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సోదర సోదరీమణులారా’; గ్రీకులో అక్షరార్థంగా ‘సోదరులారా’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘క్రీస్తులో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: నేను కూడా
  rationale: καί యొక్క అనుసంధాన భావాన్నీ, ἐγώ వల్ల వచ్చే పౌలు వ్యక్తిగత ప్రాధాన్యాన్నీ అతిగా బలపరచకుండా నిలుపుతుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు సంబోధన బహువచనం వ్యాకరణపరంగా పుంలింగంలో ఉంది. సంఘంలోని స్త్రీలను కూడా ఉద్దేశించి ఉండవచ్చనే భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: οὐκ ἠδυνήθην
  choice: మాట్లాడలేకపోయాను
  rationale: గత సందర్భంలో పౌలుకు అలా మాట్లాడే సామర్థ్యం లేదా అవకాశం లేకపోయిందనే అసమర్థత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: λαλῆσαι ὑμῖν
  choice: మీతో ... మాట్లాడినట్లు మాట్లాడడం
  rationale: λαλέω మరియు దత్తివాచక సర్వనామం యొక్క సూటి భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πνευματικοῖς
  choice: ఆత్మ సంబంధులైనవారు
  rationale: ఇది నామవాచకంగా వాడిన విశేషణం. ‘ఆధ్యాత్మికులు’ అనే విస్తృత భావం కన్నా πνεῦμαతో ఉన్న పదసంబంధాన్ని నిలుపుతుంది; అయితే వారు పరిపక్వులని ప్రత్యేకంగా చేర్చదు.
- source_word: σαρκίνοις
  choice: శరీర సంబంధులైనవారు
  rationale: ‘ఆత్మ సంబంధులు’ అనే పదబంధంతో ఉన్న వ్యత్యాసాన్నీ, σάρξతో పదసంబంధాన్నీ నిలుపుతూ ‘లోకసంబంధులు’ లేదా ‘పాపస్వభావులు’ వంటి అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: νηπίοις
  choice: పసిబిడ్డలు
  rationale: ఆత్మీయ అపరిపక్వతకు ఉపయోగించిన శిశు రూపకాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός యొక్క బిరుదు భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; పౌలు రచనల్లో సుపరిచితమైన ‘క్రీస్తులో’ రూపాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: πνευματικοῖς మరియు σαρκίνοις మధ్య వ్యత్యాసం
  choice: ఆత్మ సంబంధులైనవారు / శరీర సంబంధులైనవారు
  alternative: ఆధ్యాత్మికులు / లోకసంబంధులు
  rationale: గ్రీకు పదాల పరస్పర వ్యత్యాసాన్ని నిలుపుతూ, σαρκίνοιςను నైతికంగా మరింత తీవ్రమైన ‘లోకసంబంధులు’గా ముందుగానే నిర్ణయించదు.
- issue: Χριστῷ అనువాదం
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: ఈ రూపాన్ని కేవలం పేరుగా కాక బిరుదుగా చదవగల అవకాశాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. తెలుగు క్రైస్తవ వాడుకలో సాధారణమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని పోలికలను స్పష్టంచేయడానికి రెండవ వాక్యంలో గ్రీకులో అంతర్లీనంగా ఉన్న ‘మాట్లాడాను’ను పునరుద్ధరించాం. ‘ఆత్మ సంబంధులు/శరీర సంబంధులు’ అనే సమాంతర నిర్మాణం మూలంలోని ఉద్దేశపూర్వక వ్యత్యాసాన్ని కాపాడుతుంది.
