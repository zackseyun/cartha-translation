id: 1CO.3.15
reference: 1 Corinthians 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: te
  text: ఎవరి పని కాలిపోయినా, అతడు నష్టపోతాడు; అయితే అతడు మాత్రం రక్షించబడతాడు—కానీ అగ్ని గుండా వెళ్లినట్లే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కానీ అగ్ని గుండా మాత్రమే”; లేదా, “అగ్ని గుండా తప్పించుకున్నవాడిలా.”
    reason: చివరి గ్రీకు పదబంధం అగ్ని గుండా వెళ్లడాన్ని సూచిస్తుంది; దాని ఖచ్చితమైన రూపక భావం—కష్టంగా దాటడమా లేక తృటిలో తప్పించుకోవడమా—తెరిచి ఉంది.
lexical_decisions:
- source_word: εἴ τινος
  choice: ఎవరి … అయినా
  rationale: నిజమైన సంభావ్యతను సూచించే షరతును, అనిర్దిష్ట వ్యక్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ ἔργον
  choice: పని
  rationale: సందర్భంలోని నిర్మాణ రూపకానికి సంబంధించిన వ్యక్తి శ్రమ ఫలితాన్ని సూచిస్తూ, గ్రీకు పదంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: κατακαήσεται
  choice: కాలిపోయినా
  rationale: పూర్తిగా దహనమై నాశనం కావడం అనే బలమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ζημιωθήσεται
  choice: నష్టపోతాడు
  rationale: ఎలాంటి నిర్దిష్ట శిక్షనో లేదా బహుమతి కోల్పోవడమో అదనంగా నిర్ణయించకుండా, నష్టాన్ని అనుభవించడం అనే అర్థాన్ని నిలుపుతుంది.
- source_word: αὐτὸς δὲ
  choice: అయితే అతడు మాత్రం
  rationale: పని నశించడానికీ వ్యక్తి రక్షించబడడానికీ మధ్య ఉన్న వ్యత్యాసాన్ని, αὐτός లోని ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: σωθήσεται
  choice: రక్షించబడతాడు
  rationale: పౌలు వాడుకలోని ధార్మిక బరువును కాపాడుతూ σῴζω కు తగిన సాధారణ తెలుగు పదాన్ని ఉపయోగిస్తుంది.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: అదీ అగ్ని గుండా వచ్చినట్టుగా
  rationale: అగ్ని గుండా వెళ్లే సజీవ రూపకాన్ని నిలుపుతూ, అది కేవలం తృటిలో తప్పించుకోవడమా లేక మరేదైనా ప్రక్రియనా అన్నది తేల్చదు.
theological_decisions:
- issue: చివరి పదబంధం ఒక నిర్దిష్ట సిద్ధాంతాన్ని—ఉదాహరణకు శుద్ధీకరణ ప్రక్రియను లేదా కేవలం తృటిలో తప్పించుకోవడాన్ని—సమర్థించేలా అనువదించాలా?
  choice: అదీ అగ్ని గుండా వచ్చినట్టుగా
  alternative: అయితే అగ్ని నుండి తృటిలో తప్పించుకున్నవాడిలా మాత్రమే
  rationale: గ్రీకు రూపకం ఉద్దేశపూర్వకంగా సంక్షిప్తంగా, కొంత అనిశ్చితంగా ఉంది. అనువాదం ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ చేర్చకుండా ఆ ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘అతడు మాత్రం’ ద్వారా వ్యక్తిపై ఉన్న ఉద్ఘాటనను, దీర్ఘ విరామ చిహ్నం ద్వారా చివరి రూపకంలోని మలుపును నిలిపాం.
