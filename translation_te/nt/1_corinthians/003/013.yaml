id: 1CO.3.13
reference: 1 Corinthians 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: te
  text: ప్రతి ఒక్కరి పని వెల్లడవుతుంది. ఎందుకంటే ఆ దినం[a] దానిని స్పష్టం చేస్తుంది; ఆ దినం అగ్నిలో[b] బయలుపడుతుంది, ప్రతి ఒక్కరి పని ఎలాంటిదో ఆ అగ్నే పరీక్షిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆ దినం’ అంటే భవిష్యత్తులో జరిగే దైవిక పరిశీలన లేదా తీర్పు దినం కావచ్చు.
    reason: cross_reference
  - marker: b
    text: ‘అగ్నిలో’ అని అనువదించిన గ్రీకు పదబంధాన్ని ‘అగ్ని ద్వారా’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου
  choice: ప్రతి ఒక్కరి
  rationale: విభజనాత్మక ఏకవచన షష్ఠీ నిర్మాణం ప్రతి వ్యక్తినీ విడివిడిగా సూచిస్తుంది; ఈ రూపం లింగాన్ని చేర్చకుండా ఆ భావాన్ని నిలుపుతుంది.
- source_word: τὸ ἔργον
  choice: పని
  rationale: ఇక్కడ నిర్మించేవారి సేవా ఫలితాన్ని లేదా వారు చేసిన కార్యాన్ని విస్తృతంగా సూచిస్తుంది; ‘పని’ సహజమైనదీ సందర్భానికి తగినంత విస్తృతమైనదీ.
- source_word: φανερὸν γενήσεται
  choice: వెల్లడవుతుంది
  rationale: భవిష్యత్తులో పని స్పష్టంగా తెలిసే స్థితికి వస్తుందనే ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡ ἡμέρα
  choice: ఆ దినం
  rationale: నిర్దిష్టమైన భవిష్య దైవిక పరిశీలన దినాన్ని సందర్భం సూచిస్తుంది; తెలుగు లిపిలో పెద్ద అక్షర భేదం లేనందున ‘ఆ’ నిర్దిష్టతను తెలియజేస్తుంది.
- source_word: δηλώσει
  choice: స్పష్టం చేస్తుంది
  rationale: ఏది ఎలాంటిదో బహిర్గతం చేసి స్పష్టపరచే భావాన్ని ఇస్తూ, తరువాతి ἀποκαλύπτεταιకు వాడిన పదంతో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: ἐν πυρὶ
  choice: అగ్నిలో
  rationale: గ్రీకు విభక్తి ప్రయోగాన్ని నేరుగా నిలుపుతూ, ‘అగ్నిలో’ అనే స్థానార్థానికీ ‘అగ్ని ద్వారా’ అనే సాధనార్థానికీ మధ్య ఉన్న భావసాధ్యతను పాదసూచికలో తెలియజేస్తుంది.
- source_word: ἀποκαλύπτεται
  choice: బయలుపరచబడుతుంది
  rationale: దైవికంగా తెరతీయబడి వెల్లడయ్యే నిష్క్రియార్థాన్ని నిలుపుతుంది; ‘అది’ అనే సర్వనామం మూలంలోని సూచనాత్మక అస్పష్టతను బలవంతంగా పరిష్కరించదు.
- source_word: ὁποῖόν ἐστιν
  choice: ఎలాంటిదో
  rationale: పని యొక్క స్వభావం లేదా నాణ్యతను పరీక్షించడమే ఉద్దేశమని సహజంగా తెలియజేస్తుంది.
- source_word: τὸ πῦρ αὐτὸ
  choice: ఆ అగ్నే
  rationale: 'αὐτό ఇచ్చే బలాన్ని తెలుగు నిశ్చయార్థక ‘ఏ’ నిలుపుతుంది: పరీక్షించేది అగ్నియే.'
- source_word: δοκιμάσει
  choice: పరీక్షిస్తుంది
  rationale: పని యొక్క నిజ స్వభావం లేదా నాణ్యతను నిర్ధారించేందుకు చేసే పరీక్షను స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἡ ἡμέρα సాధారణ దినమా, భవిష్య దైవిక పరిశీలన లేదా తీర్పు దినమా?
  choice: నిర్దిష్టతను సూచిస్తూ ‘ఆ దినం’ అని అనువదించబడింది.
  alternative: ‘ఆ రోజు’ లేదా సాధారణంగా ‘దినం’
  rationale: సందర్భం దేవుని సమక్షంలో ప్రతి వ్యక్తి పనిని భవిష్యత్తులో పరిశీలించే దినాన్ని సూచిస్తుంది. ‘ఆ దినం’ అదనపు సిద్ధాంత వివరాలను చేర్చకుండా ఆ నిర్దిష్ట భావాన్ని అందిస్తుంది.
- issue: ἀποκαλύπτεται యొక్క వ్యాకరణ కర్త ‘దినం’నా లేక ‘పని’నా?
  choice: ‘అది’ అనే సర్వనామంతో మూలంలోని సూచనాత్మక ఉద్రిక్తతను నిలుపబడింది.
  alternative: ‘ఆ దినం అగ్నిలో బయలుపడుతుంది’ లేదా ‘ఆ పని అగ్నిలో బయలుపరచబడుతుంది’ అని స్పష్టీకరించడం
  rationale: గ్రీకు వ్యాకరణంలో సమీప కర్తగా ‘దినం’ బలమైన సాధ్యత అయినప్పటికీ, వాక్యప్రవాహంలో ‘పని’తో సంబంధం కూడా పాఠకునికి వినిపించవచ్చు. తెలుగు ‘అది’ అనవసరంగా ఒక వ్యాఖ్యానాన్ని ఖరారు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా ఉండే శైలి వాడబడింది. ‘దినం,’ ‘అగ్ని’ వంటి పదాలు సందర్భపు గంభీరతను నిలుపుతాయి; వాక్య నిర్మాణం మాత్రం సహజంగా ఉంచబడింది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
