revisions:
- from: ప్రతి ఒక్కరి పని వెల్లడవుతుంది. ఎందుకంటే ఆ దినం[a] దానిని స్పష్టం చేస్తుంది; అది అగ్నిలో[b] బయలుపరచబడుతుంది, ప్రతి ఒక్కరి పని ఎలాంటిదో ఆ అగ్నే పరీక్షిస్తుంది.
  to: ప్రతి ఒక్కరి పని వెల్లడవుతుంది. ఎందుకంటే ఆ దినం[a] దానిని స్పష్టం చేస్తుంది; ఆ దినం అగ్నిలో[b] బయలుపడుతుంది, ప్రతి ఒక్కరి పని ఎలాంటిదో ఆ అగ్నే పరీక్షిస్తుంది.
  rationale: The revision identifies ‘ఆ దినం’ as the subject of ‘అగ్నిలో బయలుపడుతుంది,’ following the Greek syntax, while retaining the source’s ambiguity concerning whether ἐν πυρί is locative (‘in fire’) or instrumental (‘by fire’) through the footnote. No doctrinal interpretation has been added.
