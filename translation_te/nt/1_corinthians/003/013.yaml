review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the distributive force of ἑκάστου, the future disclosure of the work, and the fire's testing function. However, in ἀποκαλύπτεται the grammatically natural subject is ἡ ἡμέρα ('the Day'), not the work. The Telugu pronoun ‘అది’ creates avoidable ambiguity where the Greek syntax identifies the Day; explicitly repeating ‘ఆ దినం’ is both faithful and clear.
  naturalness: The register is modern and suitably solemn. ‘బయలుపరచబడుతుంది’ is somewhat stiff in this context; ‘బయలుపడుతుంది’ is more idiomatic while retaining the passive/revelatory sense. Repeating ‘ఆ దినం’ makes the two linked clauses clearer in Telugu.
  terminology: '‘ప్రతి ఒక్కరి పని,’ ‘ఆ దినం,’ ‘అగ్ని,’ and ‘పరీక్షిస్తుంది’ are appropriate, natural equivalents. The footnote markers are correctly attached in the Telugu text to the terms they explain: a to ‘ఆ దినం’ and b to ‘అగ్నిలో.’'
  issues:
  - severity: medium
    issue: The referent of ‘అది’ in ‘అది అగ్నిలో బయలుపరచబడుతుంది’ is left ambiguous.
    rationale: The closest and grammatically expected Greek subject of ἀποκαλύπτεται is ἡ ἡμέρα. The translation should not introduce ambiguity by allowing the pronoun to refer equally to the work, especially when Telugu can naturally repeat the noun.
  - severity: low
    issue: ‘బయలుపరచబడుతుంది’ is needlessly heavy in this passive clause.
    rationale: ‘బయలుపడుతుంది’ is natural modern Telugu for something being revealed, without changing the source meaning.
  revised_text: ప్రతి ఒక్కరి పని వెల్లడవుతుంది. ఎందుకంటే ఆ దినం[a] దానిని స్పష్టం చేస్తుంది; ఆ దినం అగ్నిలో[b] బయలుపడుతుంది, ప్రతి ఒక్కరి పని ఎలాంటిదో ఆ అగ్నే పరీక్షిస్తుంది.
