source:
  edition: SBLGNT
  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: te
  text: అయితే అపొల్లో ఏమిటి?[a] పౌలు ఏమిటి? మీరు ఎవరి ద్వారా విశ్వసించారో వారు సేవకులు,[b] ప్రభువు ఒక్కొక్కరికి ఇచ్చినట్లుగా.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అపొల్లో ఎవరు? పౌలు ఎవరు?’ అని కూడా అనువదించవచ్చు. గ్రీకులో ‘ఎవరు’ కాక ‘ఏమిటి’ అనే రూపం ఉంది; అది వారి వ్యక్తిగత గుర్తింపుకంటే వారి పాత్రపై దృష్టి పెడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పరిచారకులు’ అని కూడా అనువదించవచ్చు. ఇక్కడి గ్రీకు పదం సేవచేసేవారిని లేదా సేవలో పనిచేసేవారిని సూచిస్తుంది; సంఘంలోని అధికారిక ‘డీకన్’ పదవిని తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
  - marker: c
    text: ‘ప్రభువు ఒక్కొక్కరికి నియమించినట్లుగా’ అని కూడా అనువదించవచ్చు. గ్రీకులో ‘ఇచ్చాడు’ అనే క్రియకు కర్మ చెప్పబడలేదు; అనువాదం దానిని నిర్దిష్టంగా చెప్పకుండా వదిలివేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: ఏమిటి
  rationale: గ్రీకు నపుంసకలింగ ప్రశ్నార్థకం వారి వ్యక్తిగత గుర్తింపుకంటే వారి పాత్ర లేదా స్థితిని ప్రశ్నిస్తోంది. అందువల్ల ‘ఎవరు?’ కంటే ‘ఏమిటి?’ మూలంలోని వాక్చాతుర్యాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: οὖν
  choice: అయితే
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణాత్మకమైన, అదే సమయంలో సంభాషణాత్మకమైన మార్పును ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: δέ
  choice: ప్రత్యేక సంధాయక పదం లేకుండా రెండవ ప్రశ్న
  rationale: ఇక్కడ δέ స్వల్పమైన కొనసాగింపును లేదా పోలికను సూచిస్తుంది. తెలుగులో ‘పౌలు ఏమిటి?’ అని నేరుగా ఉంచడం ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘కాని’ అనవసరమైన గట్టి వ్యతిరేకతను కలిగిస్తుంది.
- source_word: διάκονοι
  choice: సేవకులు
  rationale: సందర్భంలో ఇది సేవచేసే వ్యక్తులు లేదా సాధనాల భావాన్ని ఇస్తుంది; సంఘంలోని అధికారిక ‘డీకన్’ పదవిని తప్పనిసరిగా సూచించదు.
- source_word: δι’ ὧν
  choice: ఎవరి ద్వారా
  rationale: διά + సంబంధవాచక సర్వనామం ఇక్కడ సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. ‘ద్వారా’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπιστεύσατε
  choice: విశ్వసించారు
  rationale: విశ్వాసానికి వచ్చిన నిర్ణాయక చర్యను విస్తరించకుండా సూటిగా వ్యక్తం చేస్తుంది.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: ప్రభువు ఒక్కొక్కరికి ఇచ్చిన ప్రకారం
  rationale: గ్రీకులో ‘ఇచ్చాడు’ అనే క్రియకు కర్మ స్పష్టంగా చెప్పబడలేదు. ‘పని,’ ‘పాత్ర,’ లేదా ‘వరము’ అని చేర్చకుండా తెలుగు వాక్యంలోనూ ఆ సంక్షిప్తతను, అనిశ్చితిని నిలుపుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: κύριοςకు సహజమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం; ప్రధాన పాఠ్యంలో దాని నిర్దిష్ట సూచ్యాన్ని అదనంగా వివరించదు.
theological_decisions:
- issue: ‘ప్రభువు’ (κύριος) ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ప్రభువు’ అని మాత్రమే ఉంచడం
  alternative: ఇది ప్రభువైన యేసును సూచిస్తుందని పాఠ్యంలో స్పష్టీకరించడం; లేదా సాధారణంగా దేవుణ్ణి సూచించడం
  rationale: సమీప పౌలు సందర్భంలో సేవను పంచేవాడు ప్రభువైన క్రీస్తు అని గ్రహించవచ్చు. అయినా మూలపాఠ్యం కేవలం κύριος అని ఉన్నందున అనువాదంలో సూచ్యాన్ని అదనంగా నిర్దిష్టం చేయలేదు.
- issue: ‘ప్రభువు ఇచ్చిన ప్రకారం’ అనే వాక్యభాగంలోని అధ్యాహారం
  choice: కర్మను సరఫరా చేయకుండా అధ్యాహారాన్ని నిలుపడం
  alternative: ‘ప్రభువు ఒక్కొక్కరికి పని నియమించిన ప్రకారం’ లేదా ‘ఒక్కొక్కరికి పాత్ర ఇచ్చిన ప్రకారం’
  rationale: ‘పని,’ ‘పాత్ర,’ లేదా ‘వరము’ అని చేర్చడం మూలపాఠ్యం తెరిచి ఉంచిన భావాన్ని ఒక దిశలో నిర్ణయిస్తుంది. అందువల్ల ప్రధాన పాఠ్యం ఆ ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘ఏమిటి?’ అనే అసాధారణంగా వినిపించగల ప్రశ్నను ఉద్దేశపూర్వకంగా నిలిపి, నాయకుల హోదాను తగ్గించే పౌలు వాక్చాతుర్యాన్ని కాపాడాం. చివరి వాక్యభాగంలోని మూల గ్రీకు అధ్యాహారాన్ని కూడా వివరణాత్మక పదాలు చేర్చకుండా నిలిపాం.
