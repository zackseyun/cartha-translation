  source_fidelity: కాబట్టి అనే పదం ὥστε యొక్క నిర్ధారణాత్మక బలాన్ని సరిగ్గా ఇస్తుంది. “ఎవ్వరూ మనుషులను బట్టి గొప్పలు చెప్పుకోకూడదు” అనేది μηδεὶς καυχάσθω ἐν ἀνθρώποις అనే సాధారణ నిషేధాన్ని, ἀνθρώποις యొక్క విస్తృతమైన (లింగనిరపేక్ష) అర్థాన్ని కాపాడుతూ తెలియజేస్తుంది. “ఎందుకంటే సమస్తమూ మీవే” πάντα γὰρ ὑμῶν ἐστιν‌కు విశ్వసనీయమైన అనువాదం.
