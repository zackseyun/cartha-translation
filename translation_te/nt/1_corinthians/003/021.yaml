  edition: SBLGNT
  text: ὥστε μηδεὶς καυχάσθω ἐν ἀνθρώποις· πάντα γὰρ ὑμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/021.yaml
  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: te
  text: కాబట్టి, ఎవ్వరూ మనుషులను బట్టి గొప్పలు చెప్పుకోకూడదు[a]. ఎందుకంటే సమస్తమూ మీవే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భాన్ని బట్టి, “మానవ నాయకులను బట్టి గొప్పలు చెప్పుకోకూడదు” అని కూడా అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: μηδεὶς
  choice: ఎవ్వరూ ... కూడదు
  rationale: అందరికీ వర్తించే నిషేధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καυχάσθω
  choice: గొప్పలు చెప్పుకోకూడదు
  rationale: గర్వంగా అతిశయించడాన్ని సూచించే క్రియాబలాన్ని సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో నిలుపుతుంది.
- source_word: ἐν ἀνθρώποις
  choice: మనుషులను బట్టి
  rationale: ἐν ఇక్కడ గొప్పలు చెప్పుకోవడానికి ఆధారం లేదా సందర్భాన్ని సూచిస్తుంది; ἀνθρώποις లింగనిరపేక్షంగా మానవులను సూచిస్తుంది.
- source_word: πάντα
  choice: సమస్తమూ
  rationale: నపుంసక బహువచనంలోని సమగ్ర విస్తృతిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న నిషేధానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: ὑμῶν ἐστιν
  choice: మీవే
  rationale: స్వామ్య భావాన్ని సహజమైన, బలమైన తెలుగు రూపంలో నేరుగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ἐν ἀνθρώποις యొక్క సందర్భార్థం
  choice: మనుషులను బట్టి
  alternative: మానవ నాయకులను బట్టి
  rationale: సందర్భంలో అపొల్లో, పౌలు, కేఫా వంటి నాయకులు ఉద్దేశంలో ఉన్నా, గ్రీకు పదం విస్తృతంగా ‘మనుషులు’ అని ఉంది. ప్రధాన పాఠంలో ఆ విస్తృతిని కాపాడి, సందర్భానుసార ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని తార్కిక సంబంధం, సాధారణ నిషేధం, ‘సమస్తమూ మీవే’ అనే విస్తృత ప్రకటన కాపాడబడ్డాయి.
