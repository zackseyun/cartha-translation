id: 1CO.3.4
reference: 1 Corinthians 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: te
  text: ఎందుకంటే, ఒకడు “నేను పౌలువాడిని” అని, మరొకడు “నేను అపొల్లోవాడిని” అని చెప్పినప్పుడల్లా, మీరు కేవలం మనుషులే కాదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు మనుషులు కాదా?” లేదా “మీరు మానవ స్వభావానుసారం ప్రవర్తిస్తున్నవారే కాదా?”
    reason: ‘మనుషులు’ అనే గ్రీకు పదాన్ని అక్షరార్థంగా లేదా సందర్భానుసారంగా మానవ స్వభావానుసారమైన ప్రవర్తనను సూచించేలా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: ὅταν
  choice: చెప్పినప్పుడల్లా
  rationale: ఇది ఒక్క సందర్భాన్ని కాకుండా, ఎప్పుడెప్పుడు ఇలా చెబుతారో అటువంటి పునరావృతమైన లేదా నిర్దిష్టం కాని సందర్భాన్ని సూచిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: λέγῃ τις
  choice: ఒకడు … అని చెప్పినప్పుడల్లా
  rationale: అనిర్దిష్ట ఏకవచన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ఇక్కడ ఉదహరించిన మాటల సందర్భంలో పురుషవాచక రూపం సులభంగా అర్థమవుతుంది.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: నేను పౌలువాడిని
  rationale: గ్రీకు షష్ఠీ విభక్తిలోని సంక్షిప్త పక్షపాత అనుబంధ భావాన్ని, సంబంధాన్ని అతిగా నిర్ధారించకుండా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἕτερος δέ
  choice: మరొకడు
  rationale: μέν … δέ నిర్మాణంలోని జతపరచిన వ్యత్యాసాన్ని తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: Ἐγὼ Ἀπολλῶ
  choice: నేను అపొల్లోవాడిని
  rationale: ముందటి వాక్యభాగంలో ఉన్న క్రియను ఇక్కడ భావపూర్వకంగా పూరించి, సమాంతరమైన పక్షానుబంధ ప్రకటనను నిలుపుతుంది.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: మీరు కేవలం మనుషులే కాదా?
  rationale: ప్రశ్నలోని గద్దింపు బలాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘కేవలం’ చేర్చబడింది; అసలు పదంలోని ‘మనుషులు’ భావం నిలుపబడింది.
theological_decisions:
- issue: ‘మనుషులు’ అనే పదం సాధారణ మానవ స్వభావాన్నా, లేక లోకరీతిలో ప్రవర్తించడాన్నా సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘కేవలం మనుషులే’
  alternative: ‘సాధారణ మనుషుల్లా ప్రవర్తించడం లేదా?’
  rationale: ప్రధాన పాఠ్యం గ్రీకు పదరూపాన్ని దగ్గరగా ఉంచుతూ వాక్యంలోని గద్దింపును తెలియజేస్తుంది; ప్రవర్తనపై ఉన్న సందర్భార్థాన్ని పాదసూచికలో ఇస్తుంది, తద్వారా భావాన్ని ఏకపక్షంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘పౌలువాడిని / అపొల్లోవాడిని’ అనే రూపాలు పక్షానుబంధాన్ని సంక్షిప్తంగా తెలియజేస్తాయి. పాదసూచిక గుర్తు సంబంధిత ప్రశ్న తర్వాత ఉంచబడింది.
