id: 1CO.3.18
reference: 1 Corinthians 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: te
  text: ఎవరూ తమను తాము మోసగించుకోవద్దు. మీలో ఎవరైనా ఈ యుగంలో తాను జ్ఞాని అని భావిస్తే,[a] అతడు జ్ఞాని కావడానికి మూర్ఖుడిగా మారాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ యుగపు ప్రమాణాల ప్రకారం తాను జ్ఞాని అని భావిస్తే.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మూర్ఖుడు కావాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: ఎవరూ తమను తాము మోసగించుకోవద్దు
  rationale: సార్వత్రిక నిషేధాన్ని, గ్రీకులో స్పష్టంగా ఉన్న ఆత్మవాచక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δοκεῖ σοφὸς εἶναι
  choice: తాను జ్ఞాని అని భావిస్తే
  rationale: ఇక్కడ δοκεῖ వ్యక్తి తన గురించి చేసుకునే అంచనాను సూచిస్తుంది; ‘భావిస్తే’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: కొరింథు విశ్వాసుల సమాజంలో ఉన్న వ్యక్తిని సూచించే సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: ఈ యుగంలో
  rationale: αἰών లోని కాలపరమైన భావాన్ని కాపాడుతూ, ప్రస్తుత యుగపు జ్ఞానానికీ దేవుని జ్ఞానానికీ పౌలు చూపుతున్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: μωρὸς γενέσθω
  choice: మూర్ఖుడిగా మారాలి
  rationale: γενέσθω లోని ‘కావడం/మారడం’ భావాన్నీ, పౌలు ఉద్దేశపూర్వకంగా చెప్పిన విరోధాభాసాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα γένηται σοφός
  choice: అతడు జ్ఞాని కావడానికి
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని నిలుపుతూ, నిజమైన జ్ఞానం పొందడమే ఈ మార్పు లక్ష్యమని తెలియజేస్తుంది.
theological_decisions:
- issue: αἰών యొక్క భావం
  choice: ‘ఈ యుగంలో’ అని అనువదించబడింది.
  alternative: ‘ఈ లోకంలో’ లేదా ‘ఈ యుగపు ప్రమాణాల ప్రకారం’
  rationale: ‘యుగం’ అనే రూపం గ్రీకు పదంలోని కాలపరమైన భావాన్ని, ప్రస్తుత యుగపు జ్ఞానంతో దేవుని జ్ఞానానికి ఉన్న వ్యత్యాసాన్ని మెరుగ్గా కాపాడుతుంది; ప్రమాణాల భావాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచాం.
- issue: మూర్ఖుడవడం ద్వారా జ్ఞాని కావడం అనే విరోధాభాసం
  choice: విరోధాభాసాన్ని వివరణతో సడలించకుండా యథాతథంగా నిలిపాం.
  alternative: ‘లోక దృష్టిలో మూర్ఖుడిగా మారాలి’ అని వివరణను ప్రధాన వాక్యంలో చేర్చడం
  rationale: మూలపాఠం ‘ఎవరి దృష్టిలో’ అని ఇక్కడ స్పష్టంగా చెప్పదు. అందువల్ల భావాన్ని సిద్ధాంతపరంగా ముందే పరిష్కరించకుండా పౌలు వాడిన ఉద్వేగభరితమైన విరోధాభాసాన్ని నిలిపాం.
- issue: ఏకవచన పురుష సూచన
  choice: ‘అతడు’ అనే ఏకవచన రూపం వాడబడింది.
  alternative: ‘ఆ వ్యక్తి’ అనే లింగనిరపేక్ష పునర్నిర్మాణం
  rationale: గ్రీకు వాక్యం వ్యాకరణపరంగా ఏకవచన పురుష రూపంలో ఉండి ప్రతినిధి భావాన్ని కలిగి ఉంది; తెలుగు రూపం ఆ నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన గ్రంథశైలిని నిలుపుతూ అనువదించబడింది. మూలంలోని సంక్షిప్త నిషేధం, షరతు, ఉద్దేశ వాక్యం, అలాగే ‘మూర్ఖుడు—జ్ఞాని’ అనే పదవిరోధం కాపాడబడ్డాయి.
