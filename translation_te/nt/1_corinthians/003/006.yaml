  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: te
  text: నేను నాటాను, అపొల్లో నీళ్లు పోశాడు, కానీ దేవుడు పెరుగుదలను కలిగించేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “కానీ దేవుడు పెరుగుదలను కలిగించాడు” / “కానీ దేవుడు పెరిగేలా చేశాడు.”'
    reason: ηὔξανεν అనే పదాన్ని తెలుగులో వ్యక్తపరచగల ప్రత్యామ్నాయ రూపాలు; ప్రధాన పాఠం గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న భావాన్ని ప్రతిబింబిస్తుంది.
lexical_decisions:
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకు వాక్యంలో కర్త సర్వనామం స్పష్టంగా ఉండి పౌలు చేసిన పనిని అపొల్లో చేసిన పనితో పోలుస్తుంది. తెలుగులో ‘నేను’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: ἐφύτευσα
  choice: నాటాను
  rationale: φυτεύω యొక్క సాధారణ అర్థమైన ‘నాటు’ వ్యవసాయ రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: Ἀπολλῶς
  choice: అపొల్లో
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణ ప్రకారం ఇచ్చాం.
- source_word: ἐπότισεν
  choice: నీళ్లు పోశాడు
  rationale: ποτίζω ఇక్కడ మొక్కకు నీరు పెట్టడాన్ని సూచిస్తుంది. ‘నీళ్లు పోశాడు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి వ్యవసాయ దృశ్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἀλλὰ
  choice: కానీ
  rationale: ἀλλά మానవ సేవకుల పనికి, వృద్ధిని కలిగించే దేవుని కార్యానికి మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని చూపుతుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: వృద్ధిని కలిగించే అసలైన కార్యసాధకుడు దేవుడని గ్రీకు వాక్యంలోని కర్త తెలియజేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా సాధారణ తెలుగు రూపాన్ని వాడాం.
- source_word: ηὔξανεν
  choice: దాన్ని పెరిగేలా చేస్తూ ఉన్నాడు
  rationale: αὐξάνω ఇక్కడ ‘పెరిగేలా చేయడం’ అనే కారణార్థాన్ని కలిగి ఉంది. అసంపూర్ణ భూతకాల రూపం సూచించే కొనసాగుతున్న కార్యాన్ని ‘చేస్తూ ఉన్నాడు’ ద్వారా నిలుపుతూ, తెలుగులో అవసరమైన సూచనార్థక కర్మగా ‘దాన్ని’ చేర్చాం.
theological_decisions:
- issue: మానవ పరిచర్యకు మరియు దేవుని కార్యసాధకత్వానికి మధ్య సంబంధం
  choice: పౌలు నాటాడు, అపొల్లో నీళ్లు పోశాడు; అయితే పెరుగుదలను కలిగిస్తూ ఉన్నది దేవుడని వాక్యం చెబుతుంది.
  alternative: ‘దేవుడు పెరుగుదల కలిగించాడు’ లేదా ‘దేవుడు దాన్ని పెంచాడు.’
  rationale: మానవుల పని నిజమైనదే అయినా ఫలితాన్ని కలిగించే నిర్ణాయక కార్యం దేవునిదనే గ్రీకు వాక్యంలోని వ్యత్యాసాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. వ్యవసాయ రూపకాన్ని యథాతథంగా ఉంచి, మొదటి రెండు క్రియలతో పోలిస్తే దేవుని కార్యం కొనసాగుతూ ఉన్నదనే గ్రీకు అసంపూర్ణ భూతకాల భావాన్ని ప్రధాన పాఠ్యంలో ప్రతిబింబించాం.
