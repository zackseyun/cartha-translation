- from: నేను నాటాను, అపొల్లో నీళ్లు పోశాడు; కానీ దేవుడు దాన్ని పెరిగేలా చేస్తూ ఉన్నాడు.[a]
  to: నేను నాటాను, అపొల్లో నీళ్లు పోశాడు, కానీ దేవుడు పెరుగుదలను కలిగించేవాడు.[a]
