id: 1CO.3.8
reference: 1 Corinthians 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: te
  text: నాటేవాడూ, నీళ్లు పోసేవాడూ ఒకటిగా ఉన్నారు[a]; అయితే ప్రతి ఒక్కరూ తమ సొంత ప్రతిఫలాన్ని తమ సొంత శ్రమను బట్టి పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఐక్యంగా ఉన్నారు”; లేదా “ఒకే ఉద్దేశంతో ఉన్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: నాటేవాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వర్తమాన అసమాపక క్రియను పని చేసే వ్యక్తిని సూచించే సహజమైన తెలుగు నామవాచక రూపంగా అనువదించింది; వ్యవసాయ రూపకాన్ని నిలుపుతుంది.
- source_word: ποτίζων
  choice: నీళ్లు పోసేవాడు
  rationale: మొక్కలకు నీరు పోసే పనిని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా చెబుతూ వ్యవసాయ రూపకాన్ని నిలుపుతుంది.
- source_word: ἕν
  choice: ఒక్కటే
  rationale: వ్యక్తులు ఒకరే అనే భావం కాకుండా వారి ఐక్యతను సూచించే గ్రీకు నపుంసక ఏకవచనంలోని సంక్షిప్తతను నిలుపుతుంది; సాధ్యమైన భావ వివరణలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: μισθὸν
  choice: ప్రతిఫలం
  rationale: కేవలం ద్రవ్య వేతనానికి పరిమితం చేయకుండా చేసిన పనికి లభించే ఫలితం లేదా బహుమానమనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది.
- source_word: λήμψεται
  choice: పొందుతారు
  rationale: గ్రీకు భవిష్యత్తు కాలాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘ప్రతి ఒక్కరూ’తో గౌరవార్థక/లింగనిరపేక్ష బహువచన క్రియ సహజంగా సరిపోతుంది.
- source_word: κατὰ
  choice: తగిన
  rationale: ప్రతిఫలం శ్రమను బట్టి లేదా దానికి అనుగుణంగా ఉంటుందనే సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κόπον
  choice: శ్రమ
  rationale: ప్రయాసతో కూడిన పనిని సూచించే గ్రీకు పదబలాన్ని స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదంతో అందిస్తుంది.
- source_word: ἴδιον
  choice: తమ తమ
  rationale: గ్రీకులో రెండుసార్లు కనిపించే వ్యక్తిగత ప్రాధాన్యాన్ని తెలుగులో సంక్షిప్తంగా తెలియజేస్తూ, ప్రతి వ్యక్తి శ్రమ మరియు ప్రతిఫలం వేరుగా లెక్కించబడతాయని సూచిస్తుంది.
theological_decisions:
- issue: ἕν εἰσιν అనే మాటలోని ‘ఒక్కటే’ భావం
  choice: నాటేవాడు, నీళ్లు పోసేవాడు వేర్వేరు పనులు చేసినా సేవలో ఐక్యంగా ఉన్నారని సూచించే సంక్షిప్త రూపాన్ని ప్రధాన పాఠంలో ఉంచడం.
  alternative: వారు ఐక్యంగా ఉన్నారు; లేదా వారికి ఒకే ఉద్దేశం ఉంది.
  rationale: నపుంసక ఏకవచనమైన ἕν వ్యక్తిగత గుర్తింపు ఒకటేనని కాక ఐక్యతను సూచిస్తుంది. సందర్భం సేవకుల మధ్య పక్షపాతాన్ని తగ్గించినప్పటికీ, అది కేవలం సమాన హోదానా, బృంద ఐక్యతనా, ఒకే ఉద్దేశమా అన్న భావాన్ని ప్రధాన పాఠంలో అతిగా నిర్ధారించకుండా పాదసూచికలో ప్రత్యామ్నాయాలను ఉంచడం సముచితం.
translation_notes:
  register: సాధారణ ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. వ్యవసాయ రూపకం యథాతథంగా నిలుపబడింది. ‘ప్రతి ఒక్కరూ తమ తమ’ అనే నిర్మాణం లింగనిరపేక్షంగా ఉండి, గ్రీకులోని వ్యక్తిగత బాధ్యత మరియు ప్రతిఫల ప్రాధాన్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
