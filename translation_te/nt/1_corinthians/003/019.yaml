id: 1CO.3.19
reference: 1 Corinthians 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: te
  text: 'ఎందుకంటే ఈ లోకపు జ్ఞానం దేవుని దృష్టిలో మూర్ఖత్వం. ఎందుకంటే ఇలా వ్రాయబడి ఉంది: “జ్ఞానులను వారి కుయుక్తిలో ఆయన పట్టుకుంటాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφία
  choice: జ్ఞానం
  rationale: పౌలు ఈ సందర్భంలో లోకం జ్ఞానమని చెప్పుకునేదాన్ని సూచిస్తున్నాడు; ‘జ్ఞానం’ సహజమైన, స్థిరమైన అనువాదం.
- source_word: κόσμου τούτου
  choice: ఈ లోకపు
  rationale: κόσμος ఇక్కడ ప్రస్తుత లోకవ్యవస్థను సూచిస్తుంది; ‘ఈ లోకపు’ మూలంలోని వ్యతిరేకతను సహజంగా నిలుపుతుంది.
- source_word: μωρία
  choice: వెర్రితనం
  rationale: మానవ జ్ఞానంపై దేవుని ప్రతికూల తీర్పును బలంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా వ్యక్తపరుస్తుంది.
- source_word: παρὰ τῷ θεῷ
  choice: దేవుని దృష్టిలో
  rationale: παρά + దత్తి ఇక్కడ దేవుని అంచనా లేదా తీర్పు కోణాన్ని సూచిస్తుంది; పదశః అసహజమైన ‘దేవునితో’ కంటే ఈ భావానువాదం తెలుగులో స్పష్టం.
- source_word: γέγραπται
  choice: వ్రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే గ్రీకు పూర్ణకర్మణి సూత్రానికి తెలుగులో ప్రామాణికమైన రూపం.
- source_word: δρασσόμενος
  choice: పట్టుకుంటాడు
  rationale: పట్టుకోవడం లేదా చిక్కించుకోవడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: σοφοὺς
  choice: జ్ఞానులను
  rationale: లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా జ్ఞానులైన వ్యక్తులను సూచిస్తుంది.
- source_word: πανουργίᾳ
  choice: కుయుక్తి
  rationale: తెలివిని దురుద్దేశంతో వాడే ప్రతికూల నైతిక ఛాయను ‘కుయుక్తి’ స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: యోబు 5:13 ఉల్లేఖనంలోని కర్తను తెలుగులో వ్యక్తీకరించడం
  choice: “జ్ఞానులను వారి కుయుక్తిలోనే ఆయన పట్టుకుంటాడు”
  alternative: “జ్ఞానులను వారి కుయుక్తిలో పట్టుకునేవాడు”
  rationale: గ్రీకులో ఆర్టికల్‌తో ఉన్న కృదంతం దేవుణ్ణి సూచిస్తుంది. ‘ఆయన’ అని స్పష్టపరచడం కొత్త సిద్ధాంతార్థాన్ని చేర్చకుండా తెలుగులో సంపూర్ణమైన, సహజమైన వాక్యాన్ని ఇస్తుంది.
- issue: παρὰ τῷ θεῷ లోని మూలభాషా రూపం మరియు అర్థం
  choice: దేవుని దృష్టిలో
  alternative: దేవుని ఎదుట / దేవునితో
  rationale: ఇక్కడ ప్రధాన భావం దేవుని అంచనా లేదా తీర్పు. ‘దేవుని దృష్టిలో’ ఆ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; అస్పష్టమైన పదశః రూపాన్ని బలవంతంగా నిలుపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, గౌరవప్రదమైన లేఖన శైలి పాటించబడింది. మూలంలోని ‘ఎందుకంటే’ పునరావృతాన్ని తెలుగులో భారంగా కాకుండా చూపేందుకు రెండవ γάρ ను ‘ఇలా’ అనే సహజ లేఖన-పరిచయ నిర్మాణంలో వ్యక్తపరచాం.
