revisions:
- from: 'ఎందుకంటే ఈ లోకపు జ్ఞానం దేవుని దృష్టిలో వెర్రితనం. ఇలా వ్రాయబడి ఉంది: “జ్ఞానులను వారి కుయుక్తిలోనే ఆయన పట్టుకుంటాడు.”'
  to: 'ఎందుకంటే ఈ లోకపు జ్ఞానం దేవుని దృష్టిలో మూర్ఖత్వం. ఎందుకంటే ఇలా వ్రాయబడి ఉంది: “జ్ఞానులను వారి కుయుక్తిలో ఆయన పట్టుకుంటాడు.”'
  rationale: The revision changes only the rendering of μωρία to ‘మూర్ఖత్వం’ and retains the explicit second ‘ఎందుకంటే’ to represent the second γάρ without making the Telugu unnatural. The quotation remains faithful to the Greek while using idiomatic Telugu word order.
  reviewer_model: gpt-5.6-terra
