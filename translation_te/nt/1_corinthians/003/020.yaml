  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: te
  text: 'మరలా ఇలా ఉంది: “జ్ఞానుల ఆలోచనలు వ్యర్థమైనవని ప్రభువుకు తెలుసు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కీర్తన 94:11 నుండి ఉల్లేఖనం (గ్రీకు పాత నిబంధనలో కీర్తన 93:11). “ఆలోచనలు” అనే పదాన్ని “తర్కాలు” అని కూడా, “వ్యర్థమైనవి” అనే పదాన్ని “నిష్ఫలమైనవి” లేదా “శూన్యమైనవి” అని కూడా అనువదించవచ్చు.
    reason: cross_reference_and_lexical_alternatives
lexical_decisions:
- source_word: καὶ πάλιν
  choice: మరియు మళ్లీ
  rationale: ఇది ముందున్న ఉల్లేఖనానికి తోడుగా రెండవ ఆధార వాక్యాన్ని పరిచయం చేస్తుంది; గ్రీకు పదబంధంలోని కొనసాగింపు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: Κύριος
  choice: ప్రభువు
  rationale: κύριοςకు సందర్భానుకూలమైన, గౌరవప్రదమైన సాధారణ తెలుగు సమానార్థకం.
- source_word: γινώσκει
  choice: ఎరుగును
  rationale: ప్రభువు సంపూర్ణంగా తెలిసికొని ఉన్నాడనే సూటి భావాన్ని గౌరవప్రదమైన బైబిలు శైలిలో తెలియజేస్తుంది.
- source_word: διαλογισμοὺς
  choice: ఆలోచనలు
  rationale: మనస్సులోని తలంపులు, తర్కనలు రెండింటినీ సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేసే సహజ పదం.
- source_word: τῶν σοφῶν
  choice: జ్ఞానుల
  rationale: σοφῶν అనే నామవాచకార్థక విశేషణాన్ని లింగపరంగా అనవసరంగా పరిమితం చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: ప్రభువుకు తెలిసిన విషయం ఏమిటో తెలిపే content clauseను తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: μάταιοι
  choice: వ్యర్థమైనవి
  rationale: ఆ ఆలోచనలు వెలితిగలవి, ఫలప్రదం కానివి అనే భావాన్ని సంక్షిప్తంగా, ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టతను కాపాడుతూ, లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని ఒకే వాక్య నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో నిలిపాం.
