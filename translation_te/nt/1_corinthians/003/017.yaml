id: 1CO.3.17
reference: 1 Corinthians 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: te
  text: ఎవరైనా దేవుని ఆలయాన్ని నాశనం చేస్తే[a], దేవుడు ఆ వ్యక్తిని నాశనం చేస్తాడు. ఎందుకంటే దేవుని ఆలయం పవిత్రమైనది; ఆ ఆలయం మీరే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చెడగొడితే” లేదా “అపవిత్రం చేస్తే” అని కూడా అనువదించవచ్చు; ఈ వాక్యంలో ఈ క్రియ రెండు చోట్లా ఒకటే.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “మీరు” బహువచనం. పౌలు సంఘాన్ని సమష్టిగా దేవుని ఆలయమని గుర్తిస్తున్నాడు.
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: ఆలయం
  rationale: దేవుడు నివసించే పవిత్ర స్థలాన్ని సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం; సాధారణ భవనం అనే భావానికి పరిమితం కాదు.
- source_word: φθείρει / φθερεῖ
  choice: నాశనం చేస్తే / నాశనం చేస్తాడు
  rationale: ఒకే గ్రీకు క్రియ రెండు చోట్ల రావడాన్ని ఒకే తెలుగు క్రియతో నిలుపుతూ హెచ్చరిక తీవ్రతను కాపాడుతుంది. ‘చెడగొట్టు’ లేదా ‘అపవిత్రం చేయు’ అనే అర్థాలు కూడా సందర్భానుసారం సాధ్యమే.
- source_word: τοῦτον
  choice: ఆ వ్యక్తిని
  rationale: τις అనే ఏకవచన అనిశ్చిత వ్యక్తిని తిరిగి సూచిస్తుంది; ఆధునిక తెలుగులో లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా స్పష్టంగా ఉంటుంది.
- source_word: ἅγιος
  choice: పవిత్రమైనది
  rationale: పవిత్రతతోపాటు దేవునికి ప్రత్యేకించబడిన స్థితిని సహజంగా తెలియజేసే ప్రామాణిక తెలుగు పదం.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: ఆ ఆలయం మీరే
  rationale: గ్రీకులోని సంబంధవాక్యాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, పాఠకుల సమూహమే ఆ ఆలయం అనే గుర్తింపును స్పష్టంగా నిలుపుతుంది.
- source_word: ὑμεῖς
  choice: మీరు
  rationale: ఇది బహువచనం; ఏకవచనమైన ‘ఆలయం’తో సమాజాన్ని సమష్టిగా గుర్తిస్తుంది.
theological_decisions:
- issue: దేవుని ఆలయం అనే మాట ప్రధానంగా వ్యక్తిగత విశ్వాసిని సూచిస్తుందా, లేక సంఘాన్ని సమష్టిగా సూచిస్తుందా?
  choice: 'ప్రధాన భావం సమష్టిగతమైనది: బహువచన ‘మీరు’ అనే సంబోధన సంఘమంతటినీ ఏకవచన ‘ఆలయం’గా గుర్తిస్తుంది.'
  alternative: విస్తృత బైబిలు బోధ ఆధారంగా దీనిని వ్యక్తిగత విశ్వాసికి కూడా అన్వయించవచ్చు.
  rationale: ఈ వాక్యంలోని వ్యాకరణ నిర్మాణం—ఏకవచన ‘ఆలయం’, బహువచన ‘మీరు’—ప్రస్తుత సందర్భంలో సంఘాన్ని దేవుని సమష్టిగత నివాసంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఒకే క్రియ పునరావృతిని నిలిపి, హెచ్చరిక తీవ్రతను కాపాడాం. సమష్టిగత భావాన్ని ప్రధాన వాక్యంలో సహజంగా ఉంచి, బహువచన వివరాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
