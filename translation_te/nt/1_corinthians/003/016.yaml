id: 1CO.3.16
reference: 1 Corinthians 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: te
  text: మీరు దేవుని ఆలయమని, దేవుని ఆత్మ మీలో నివసిస్తుందని మీకు తెలియదా?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని పరిశుద్ధస్థలం.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘మీరు’ బహువచనం; పౌలు సమాజాన్ని సమష్టిగా ఉద్దేశిస్తున్నాడు.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘మీ మధ్య.’
    reason: alternative_reading
lexical_decisions:
- source_word: ναὸς
  choice: ఆలయం
  rationale: ναός సాధారణ ఆలయ ప్రాంగణం కంటే దేవుని సన్నిధికి ప్రత్యేకమైన పవిత్ర ఆలయాన్ని సూచిస్తుంది. ‘ఆలయం’ సహజమైన ఆధునిక తెలుగు పదంగా ఈ పవిత్ర స్థల రూపకాన్ని నిలుపుతుంది.
- source_word: θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని తెలుగులో సహజంగా ‘దేవుని ఆలయం’, ‘దేవుని ఆత్మ’ అని వ్యక్తపరచడం జరిగింది.
- source_word: ἐστε
  choice: మీరు ... అయి ఉన్నారు
  rationale: ఇది ద్వితీయ పురుష బహువచనం. ‘మీరు’ బహువచన సమాజాన్ని ఉద్దేశించిన మాటను నిలుపుతుంది; ఏకవచన వ్యక్తీకరణను చేర్చదు.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: దేవుని ఆత్మ
  rationale: మూలంలోని సంబంధాన్ని నేరుగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οἰκεῖ
  choice: నివసిస్తున్నాడు
  rationale: οἰκέω నిరంతర నివాస భావాన్ని తెలియజేస్తుంది; ‘నివసిస్తున్నాడు’ ఆలయ రూపకానికి సరిపోతూ ప్రస్తుతకాల కొనసాగింపును నిలుపుతుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: ἐν ὑμῖνను నేరుగా ‘మీలో’ అని అనువదించాం. బహువచన సంబోధన వల్ల సమాజంలో/సమాజం మధ్య అనే భావానికి కూడా అవకాశం ఉంటుంది.
- source_word: Οὐκ οἴδατε
  choice: మీకు తెలియదా?
  rationale: నిరాకార ప్రశ్నలోని పౌలు గద్దింపు కలిగిన వాక్చాతుర్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ఈ వాక్యం ప్రధానంగా వ్యక్తిగత విశ్వాసులను సూచిస్తుందా, లేక సంఘాన్ని సమష్టిగా సూచిస్తుందా?
  choice: ప్రధాన పాఠంలో బహువచన ‘మీరు/మీలో’ను ఉంచి, సమష్టి భావాన్ని పాదసూచికలో స్పష్టం చేయడం.
  alternative: ‘మీరందరూ కలిసి దేవుని ఆలయం’ అని ప్రధాన పాఠంలో స్పష్టంగా సమష్టీకరించడం, లేదా ‘మీలో ప్రతి ఒక్కరూ’ అని వ్యక్తిగతీకరించడం.
  rationale: గ్రీకులో ద్వితీయ పురుష బహువచనం ఉంది; సందర్భం కొరింథు సమాజాన్ని సమష్టిగా ఉద్దేశిస్తుంది. అయితే మూలంలో ‘కలిసి’ లేదా ‘ప్రతి ఒక్కరూ’ అనే అదనపు పదం లేదు. అందువల్ల మూలంలోని భావ ఉద్రిక్తతను పరిష్కరించకుండా బహువచన రూపాన్నే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘ఆలయం’, ‘నివసిస్తున్నాడు’ అనే పదాలు పవిత్ర స్థల రూపకాన్నీ నిరంతర నివాస భావాన్నీ నిలుపుతాయి. ప్రధాన పాఠం మూలంలోని సంక్షిప్త వాక్చాతుర్య ప్రశ్నను అనుసరిస్తుంది.
