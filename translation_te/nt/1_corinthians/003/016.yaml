revisions:
- from: మీరు దేవుని ఆలయమై ఉన్నారని, దేవుని ఆత్మ మీలో నివసిస్తున్నాడని మీకు తెలియదా?[a][b][c]
  to: మీరు దేవుని ఆలయమని, దేవుని ఆత్మ మీలో నివసిస్తుందని మీకు తెలియదా?[a][b][c]
  rationale: The revision retains every source-level meaning and the existing footnote anchors while using direct, idiomatic Telugu for the two clauses. It preserves the plural corporate implication without inserting ‘కలిసి’ into the main text and leaves the ‘in/among you’ ambiguity available in the footnote.
