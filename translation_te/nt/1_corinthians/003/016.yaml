review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the rhetorical question, ναός as ‘ఆలయం,’ the plural addressees, and the possible corporate sense of ἐν ὑμῖν. However, ‘మీరు దేవుని ఆలయమై ఉన్నారని’ unnecessarily recasts the Greek predicate ‘you are God’s temple’ into an awkward Telugu construction. A direct predicate form more closely reflects ἐστε.
  naturalness: ‘మీరు దేవుని ఆలయమని’ is idiomatic modern standard Telugu and makes the two coordinated content clauses balanced. With ‘ఆత్మ,’ the non-masculine verbal form ‘నివసిస్తుందని’ is grammatically smoother and does not add gender not expressed by the Greek neuter noun.
  terminology: ‘దేవుని ఆలయం’ and ‘దేవుని ఆత్మ’ are established, natural biblical Telugu terms. The sanctuary alternative and the corporate-plural and ‘among you’ notes are appropriate.
  issues:
  - severity: medium
    issue: The phrase ‘దేవుని ఆలయమై ఉన్నారని’ is an awkward and slightly expanded rendering of ἐστε.
    rationale: The source simply predicates ‘God’s temple’ of the plural addressees. ‘మీరు దేవుని ఆలయమని’ is both more direct and more natural in Telugu.
  - severity: low
    issue: ‘నివసిస్తున్నాడని’ assigns masculine grammatical agreement to ‘ఆత్మ.’
    rationale: The Greek wording does not mark personal gender here, and Telugu ‘ఆత్మ’ is more smoothly handled in this sentence with ‘నివసిస్తుందని,’ avoiding an unnecessary grammatical addition.
  revised_text: మీరు దేవుని ఆలయమని, దేవుని ఆత్మ మీలో నివసిస్తుందని మీకు తెలియదా?[a][b][c]
