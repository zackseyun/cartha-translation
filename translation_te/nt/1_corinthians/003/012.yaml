id: 1CO.3.12
reference: 1 Corinthians 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δέ τις ἐποικοδομεῖ ἐπὶ τὸν ⸀θεμέλιον ⸂χρυσόν, ἄργυρον⸃, λίθους τιμίους, ξύλα, χόρτον, καλάμην,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/012.yaml
  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: te
  text: ఎవరైనా ఆ పునాది మీద బంగారం, వెండి, విలువైన రాళ్లు, కలప, ఎండుగడ్డి, గడ్డిపరకలతో కడితే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: ఎవరైనా ... కడితే
  rationale: εἰ షరతును ‘-తే’ రూపం సహజంగా తెలియజేస్తుంది; τις అనిర్దిష్టమైన, అందరికీ వర్తించే భావాన్ని ‘ఎవరైనా’గా నిలుపుతుంది. δέ ఇక్కడ స్వల్ప వాదనాభివృద్ధిని సూచిస్తుంది; తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే సందర్భం ఆ సంబంధాన్ని సహజంగా మోస్తుంది.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: ఆ పునాది మీద ... కడితే
  rationale: ἐποικοδομεῖ మరియు ἐπί కలిసి ఇప్పటికే ఉంచిన పునాది మీద నిర్మించడాన్ని సూచిస్తాయి. ముందరి సందర్భంలోని నిర్దిష్ట పునాదిని సూచించేందుకు ‘ఆ’ వాడబడింది.
- source_word: χρυσόν
  choice: బంగారం
  rationale: నిర్మాణ సామగ్రి జాబితాలోని పదార్థానికి నేరమైన, సహజమైన తెలుగు పదం.
- source_word: ἄργυρον
  choice: వెండి
  rationale: బంగారంతో జతగా వచ్చిన పదార్థపదానికి నేరమైన అనువాదం.
- source_word: λίθους τιμίους
  choice: విలువైన రాళ్లు
  rationale: τιμίους యొక్క ‘విలువైన/ఖరీదైన’ భావాన్ని నిలుపుతూ, నిర్మాణ సందర్భానికి సరిపోయే విస్తృత అర్థాన్ని ఇస్తుంది; దానిని కేవలం రత్నాలుగా పరిమితం చేయదు.
- source_word: ξύλα
  choice: కలప
  rationale: బహువచన గ్రీకు రూపం ఇక్కడ పదార్థాన్ని సూచిస్తుంది; తెలుగులో ‘కలప’ సహజమైన ద్రవ్యనామం.
- source_word: χόρτον
  choice: ఎండుగడ్డి
  rationale: ఈ నిర్మాణ సామగ్రి జాబితాలో ఎండిన గడ్డిని సూచించే ‘ఎండుగడ్డి’ χόρτον యొక్క సందర్భోచిత భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: καλάμην
  choice: గడ్డిపరకలు
  rationale: καλάμην కు కాడలు, పరకలు, గడ్డి వంటి అర్థాలు ఉండవచ్చు. ‘గడ్డిపరకలు’ ఈ నిర్మాణ రూపకంలో సహజంగా ఉండి, ముందున్న ‘ఎండుగడ్డి’తో తేడాను కొంత నిలుపుతుంది.
