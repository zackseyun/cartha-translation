translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం. గ్రీకులోని షరతు వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
