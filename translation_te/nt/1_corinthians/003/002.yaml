source:
  edition: SBLGNT
  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: te
  text: నేను మీకు పాలు తాగించాను[a], ఘనాహారం ఇవ్వలేదు; ఎందుకంటే అప్పటికి మీరు దాన్ని తీసుకోలేకపోయారు. కానీ ఇప్పటికీ కూడా మీరు దాన్ని తీసుకోలేరు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను మీకు తాగడానికి పాలు ఇచ్చాను.”
    reason: lexical_alternative
  - marker: b
    text: “ఘనాహారం” అని అనువదించిన గ్రీకు పదానికి సాధారణంగా “ఆహారం” అని అర్థం; ఇక్కడ పాలతో ఉన్న వ్యత్యాసం కారణంగా “ఘనాహారం” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: పాలు
  rationale: పోషణ రూపకంలోని ప్రత్యక్ష కర్మ; తెలుగులో సహజమైన, మూలానికి నేరమైన సమానార్థకం.
- source_word: ἐπότισα
  choice: తాగించాను
  rationale: క్రియకు అక్షరార్థంగా ‘త్రాగడానికి ఇచ్చాను’ అనే భావం ఉంది. ‘పాలు తాగించాను’ తెలుగులో సహజంగా ఉండి, మూలంలోని త్రాగించే భావాన్ని నిలుపుతుంది.
- source_word: βρῶμα
  choice: ఘనాహారం
  rationale: ఈ పదం సాధారణంగా ‘ఆహారం’ అని అర్థమైనా, పాలతో ఉన్న వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘ఘనాహారం’ అనేది సందర్భోచితమైన ఎంపిక.
- source_word: οὔπω
  choice: అప్పటికి ... లేరు
  rationale: గతకాల క్రియతో కలిసిన ‘ఇంకా కాదు’ అనే కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐδύνασθε
  choice: స్వీకరించగల స్థితిలో లేరు
  rationale: δύναμαι సూచించే సామర్థ్యాన్ని తెలియజేస్తుంది; సందర్భంలో ఘనాహారాన్ని స్వీకరించే సామర్థ్యమే ఉద్దేశమని స్పష్టమవుతుంది.
- source_word: οὐδὲ ἔτι νῦν
  choice: నిజానికి, ఇప్పటికీ ... లేరు
  rationale: ప్రస్తుతకాలంలోనూ కొనసాగుతున్న అసమర్థతపై గ్రీకు పదబంధం పెట్టే బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δύνασθε
  choice: ఆ స్థితిలో లేరు
  rationale: ముందటి సామర్థ్య భావాన్ని పునరుక్తి లేకుండా సహజంగా కొనసాగిస్తుంది; కాలభేదం ‘అప్పటికి/ఇప్పటికీ’ ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: పౌలు ఉపయోగించిన పోషణ రూపకానికి వివరణ
  choice: పాలు, ఘనాహారం అనే రూపకాన్ని అనువాదంలోనే నిలుపుతూ, అది ఏ బోధాంశాలను సూచిస్తుందో విస్తరించకుండా ఉంచడం.
  alternative: ‘నేను మీకు ప్రాథమిక విషయాలనే బోధించాను’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: గ్రీకు మూలం నేరుగా వివరణ ఇవ్వకుండా రూపకాన్ని ఉపయోగిస్తుంది. దానిని అలాగే ఉంచడం మూలంలోని అర్థ విస్తృతిని, ధార్మిక ఉద్రిక్తతను కాపాడుతుంది.
- issue: δύνασθε అనే సామర్థ్య పదానికి కర్మ
  choice: ‘దాన్ని’ మరియు ‘ఆ స్థితి’ ద్వారా ఘనాహారాన్ని స్వీకరించే సామర్థ్యాన్ని సందర్భానుసారంగా సూచించడం.
  alternative: ‘భరించలేకపోయారు/భరించలేరు’ అని అనువదించడం.
  rationale: మూలంలో ‘భరించడం’ అనే ప్రత్యేక భావం లేదు; సాధారణ సామర్థ్య భావమే ఉంది. అందువల్ల అధిక వ్యాఖ్యానాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని పోషణ రూపకాన్ని కాపాడుతూ, ‘పెట్టలేదు’ అనే సహజ తెలుగు ప్రయోగంతో పాలకు-ఘనాహారానికి మధ్య వ్యత్యాసాన్ని తెలిపింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
