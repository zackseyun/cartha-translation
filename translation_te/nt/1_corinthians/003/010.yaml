id: 1CO.3.10
reference: 1 Corinthians 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: te
  text: నాకు అనుగ్రహించబడిన దేవుని కృప ప్రకారం, వివేకవంతుడైన ప్రధాన నిర్మాణకుడిలా[a] నేను పునాది వేశాను; మరొకరు దానిపై నిర్మిస్తున్నారు. అయితే తాము దానిపై ఎలా నిర్మిస్తున్నారో ప్రతి ఒక్కరూ జాగ్రత్తగా చూసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వివేకవంతుడైన వాస్తుశిల్పిలా.” గ్రీకు పదం నిర్మాణాన్ని రూపొందించడమే కాక దానిని పర్యవేక్షించే ప్రధాన నిర్మాణకుడిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ
  choice: ప్రకారం
  rationale: ఇది దేవుడు అనుగ్రహించిన కృపకు అనుగుణంగా పౌలు పనిచేశాడనే భావాన్ని సహజంగా తెలియజేస్తుంది; కేవలం సాధనార్థక భావానికి పరిమితం చేయదు.
- source_word: χάριν
  choice: కృప
  rationale: పౌలు వాడుకలోని దేవుని అనుగ్రహాన్నీ, ఆయన ఇచ్చే సామర్థ్యాన్నీ మితిమీరిన వివరణ లేకుండా నిలుపుతుంది.
- source_word: τὴν δοθεῖσάν μοι
  choice: నాకు అనుగ్రహించబడిన
  rationale: కృప పౌలుకు దేవునిచేత ప్రసాదించబడిందని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὡς σοφὸς ἀρχιτέκτων
  choice: వివేకవంతుడైన ప్రధాన నిర్మాణకుడిలా
  rationale: ὡς లోని పోలికను ‘లా’ నిలుపుతుంది; σοφός లోని వివేక భావాన్నీ, ἀρχιτέκτων సూచించే నిర్మాణాన్ని పర్యవేక్షించే ప్రధాన కర్త పాత్రనూ వ్యక్తం చేస్తుంది.
- source_word: θεμέλιον ἔθηκα
  choice: పునాది వేశాను
  rationale: తెలుగులో సహజమైన పదబంధం; గ్రీకు క్రియకు, నిర్మాణ రూపకానికి నేరుగా సరిపోతుంది.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: మరొకరు దానిపై నిర్మిస్తున్నారు
  rationale: వేరొక పనివాడు ఇప్పటికే వేసిన పునాదిపై నిర్మిస్తున్నాడనే సమాస క్రియ భావాన్ని స్పష్టంగా తెలియజేస్తుంది. వర్తమాన కాల చర్యను కూడా నిలుపుతుంది.
- source_word: ἕκαστος δὲ βλεπέτω
  choice: అయితే ప్రతి ఒక్కరూ ... జాగ్రత్తగా చూసుకోవాలి
  rationale: ἕκαστος లోని ఒక్కొక్కరికి వర్తించే భావాన్నీ, βλεπέτω లోని అప్రమత్తతతో కూడిన ఆజ్ఞనూ సహజ తెలుగులో అందిస్తుంది.
- source_word: πῶς ἐποικοδομεῖ
  choice: దానిపై ఎలా నిర్మిస్తున్నారో
  rationale: నిర్మాణ విధానమే పరిశీలనకు లోబడుతుందని స్పష్టం చేస్తూ, ἐποικοδομεῖ లోని ‘పైన నిర్మించు’ భావాన్ని పునరావృతం చేస్తుంది.
theological_decisions:
- issue: ἕκαστος లోని వ్యాకరణపరమైన పుంలింగ ఏకవచనం
  choice: ప్రతి ఒక్కరూ ... నిర్మిస్తున్నారో
  alternative: ప్రతి పురుషుడు ... నిర్మిస్తున్నాడో
  rationale: ఇక్కడ గ్రీకు పుంలింగ ఏకవచనం కేవలం పురుషులను కాక, ఒక్కొక్క వ్యక్తిని ప్రతినిధిగా సూచిస్తుంది. తెలుగు గౌరవ/సామాన్య బహువచన నిర్మాణం లింగ పరిమితిని అనవసరంగా చేర్చకుండా ఆ పంపిణీ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- issue: σοφός యొక్క భావ పరిధి
  choice: వివేకవంతుడైన
  alternative: నైపుణ్యంగల
  rationale: నిర్మాణ సందర్భంలో నైపుణ్య భావం సాధ్యమైనప్పటికీ, గ్రీకు పదంలోని జ్ఞానం/వివేకం అనే విలువ నిర్ణయాన్ని ప్రధాన పాఠంలో నిలిపి, దానిని కేవలం సాంకేతిక నైపుణ్యంగా కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. నిర్మాణ రూపకం, వర్తమాన కాల చర్య, చివరి హెచ్చరికలోని అప్రమత్తత నిలుపబడ్డాయి. ‘ప్రతి ఒక్కరూ’ సాధారణ తెలుగు వ్యాకరణంలో లింగాన్ని నిర్దిష్టం చేయకుండా ఒక్కొక్క వ్యక్తికి వర్తించే భావాన్ని ఇస్తుంది.
