id: 1CO.3.22
reference: 1 Corinthians 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: te
  text: పౌలు అయినా, అపొల్లో అయినా, కేఫా అయినా, లోకం అయినా, జీవం అయినా, మరణం అయినా, ప్రస్తుతం ఉన్నవి అయినా, రాబోయేవి అయినా—అన్నీ మీవే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: … అయినా, … అయినా
  rationale: ప్రతి అంశాన్ని సమానంగా వరుసలో నిలిపే గ్రీకు పునరుక్తి నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Παῦλος
  choice: పౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: Ἀπολλῶς
  choice: అపొల్లో
  rationale: మూలంలోని వ్యక్తినామాన్ని సహజమైన తెలుగు లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: Κηφᾶς
  choice: కేఫా
  rationale: మూలపాఠంలోని సెమిటిక్ పేరురూపాన్నే నిలుపుతుంది; దాన్ని సమానార్థకమైన ‘పేతురు’గా మార్చదు.
- source_word: κόσμος
  choice: లోకం
  rationale: సృష్టిలోని ప్రపంచం లేదా లోకవ్యవస్థ అనే విస్తృత భావాన్ని సందర్భానికి తగిన సంక్షిప్త రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ζωή
  choice: జీవం
  rationale: జీవించి ఉండే స్థితి లేదా జీవితం అనే భావాన్ని, ‘మరణం’తో ఉన్న జతను స్పష్టంగా ఉంచుతూ తెలుపుతుంది.
- source_word: θάνατος
  choice: మరణం
  rationale: మూలపదానికి నేరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: ἐνεστῶτα
  choice: ప్రస్తుతం ఉన్నవి
  rationale: నామవాచకంగా పనిచేసే బహువచన కృదంతం ప్రస్తుత వాస్తవాలన్నిటినీ సూచిస్తుంది.
- source_word: μέλλοντα
  choice: రాబోయేవి
  rationale: భవిష్యత్తులో సంభవించబోయే వాస్తవాలను సూచించే నామవాచక బహువచన కృదంతాన్ని సహజంగా అందిస్తుంది.
- source_word: πάντα
  choice: అన్నీ
  rationale: ముందున్న వ్యక్తులు, పరిస్థితులు, వాస్తవాలు అన్నిటినీ సమగ్రంగా చేర్చే నపుంసక బహువచనపు సంపూర్ణ భావాన్ని నిలుపుతుంది.
- source_word: ὑμῶν
  choice: మీవే
  rationale: స్వామ్యాన్ని సూచించే గ్రీకు షష్ఠీ విభక్తిని, వాక్యపు శిఖర ప్రకటనకు తగిన బలంతో తెలుపుతుంది.
theological_decisions:
- issue: ‘అన్నీ మీవే’ అనే స్వామ్య ప్రకటన యొక్క పరిధి
  choice: మూలంలోని సంక్షిప్త స్వామ్యభాషను యథాతథంగా ఉంచడం
  alternative: ‘అన్నీ మీ మేలు కోసమే’ లేదా ‘అన్నీ మీకు లోబడి ఉన్నాయి’ అని వివరణ చేర్చడం
  rationale: ఈ వచనం స్వామ్యం ఎలా పనిచేస్తుందో స్వయంగా వివరించదు. సందర్భం దాని భావాన్ని నియంత్రించినప్పటికీ, అనువాదంలో నిర్దిష్టమైన తాత్త్విక వివరణను చొప్పించడం మూలంలోని సంక్షిప్తతను, ఉద్వేగాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని వరుస పునరుక్తి, చివరి సమగ్ర ప్రకటనకు వచ్చే వాక్చాతుర్య బలం నిలుపబడ్డాయి.
