id: 1CO.3.3
reference: 1 Corinthians 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: te
  text: ఎందుకంటే మీరు ఇంకా శరీరానుసారులే. మీ మధ్య అసూయా కలహమూ ఉన్నప్పుడు, మీరు శరీరానుసారులూ మనిషి ప్రకారం నడుచుకుంటున్నవారూ కారా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కేవలం మానవరీతిలో నడుచుకుంటున్నవారూ కారా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: ఇంకా
  rationale: వారి పరిస్థితి కొనసాగుతూనే ఉందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: పౌలు ముందటి మాటకు ఇస్తున్న వివరణాత్మక కారణ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; రెండవ γὰρ భావం తెలుగు వాక్యనిర్మాణంలో సహజంగా అంతర్లీనమవుతుంది.
- source_word: σαρκικοί
  choice: శరీర సంబంధులు
  rationale: σάρξతో ఉన్న పదసంబంధాన్ని నిలుపుతూ, ‘పాప స్వభావం చేత నియంత్రించబడినవారు’ వంటి విస్తృత సిద్ధాంతాత్మక వివరణను మూలపాఠ్యంలోకి చేర్చదు.
- source_word: ὅπου
  choice: ఉన్నప్పుడు
  rationale: అక్షరార్థమైన ‘ఎక్కడ’ కంటే సందర్భంలో అసూయ, కలహం వారి మధ్య ఉండటం వారి స్థితికి నిదర్శనమనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ζῆλος
  choice: అసూయ
  rationale: కలహంతో జతైన ప్రతికూల సందర్భంలో ζῆλοςకు సరిపోయే సాధారణ తెలుగు పదం.
- source_word: ἔρις
  choice: కలహం
  rationale: వాగ్వాదానికే పరిమితం కాకుండా విభేదం, పోరాటం అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: οὐχὶ
  choice: కారా? ... కదా?
  rationale: అంగీకార సమాధానాన్ని ఆశించే గ్రీకు అలంకారప్రశ్న స్వరాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατὰ ἄνθρωπον
  choice: మనిషి ప్రకారం
  rationale: గ్రీకులోని ఏకవచన రూపాన్నీ, కేవలం మానవ పద్ధతికి అనుగుణమైన ప్రవర్తన అనే ఉద్విగ్న భావాన్నీ వ్యాఖ్యానంతో పూర్తిగా పరిష్కరించకుండా నిలుపుతుంది.
- source_word: περιπατεῖτε
  choice: నడుచుకుంటున్నారు
  rationale: పౌలు ఉపయోగించే నడక అనే నైతిక జీవన రూపకాన్ని ‘జీవిస్తున్నారు’ అని చదును చేయకుండా తెలుగులో అర్థమయ్యేలా నిలుపుతుంది.
theological_decisions:
- issue: σαρκικοίలోని σάρξ సంబంధిత భాష
  choice: శరీర సంబంధులు
  alternative: లోకసంబంధులు / పాప స్వభావం గలవారు
  rationale: పౌలు విశ్వాసుల ప్రవర్తనను శరీరంతో ముడిపెట్టి మందలిస్తున్నాడు. మూలపద రూపకాన్ని ఉంచడం వల్ల ‘పాప స్వభావం’ వంటి నిర్దిష్ట సిద్ధాంత వివరణను అనవసరంగా చేర్చకుండా భావ ఉద్విగ్నత నిలుస్తుంది.
- issue: κατὰ ἄνθρωπον యొక్క భావం
  choice: మనిషి ప్రకారం
  alternative: కేవలం మానవరీతిలో
  rationale: మూలంలోని ఏకవచన ‘మనిషి’ని ప్రధాన పాఠ్యంలో పారదర్శకంగా ఉంచి, మరింత వివరణాత్మకమైన సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘శరీర సంబంధులు,’ ‘నడుచుకుంటున్నారు’ అనే పదాలతో పౌలు ఉపయోగించిన శరీరం-నడక రూపకాలు నిలుపబడ్డాయి. పాదసూచిక గుర్తు దానికి సంబంధించిన κατὰ ἄνθρωπον పదబంధం తరువాత ఉంచబడింది.
