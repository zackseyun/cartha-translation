  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: te
  text: పరిశుద్ధుల కొరకు సేకరణ[a] విషయానికి వస్తే, గలతీయ సంఘాలకు నేను ఆదేశించినట్లే మీరు కూడా అలాగే చేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని ప్రజల కొరకు సేకరణ.”
    reason: ἅγιοι అనే పదాన్ని దాని సమూహార్థాన్ని స్పష్టంచేస్తూ “దేవుని ప్రజలు” అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: Περὶ δὲ
  choice: విషయానికి వస్తే
  rationale: కొత్త అంశాన్ని పరిచయం చేసే పౌలు పత్రికా సంధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలో లేని కాలార్థకమైన ‘ఇప్పుడు’ను చేర్చదు.
- source_word: λογείας
  choice: సేకరించే విరాళం
  rationale: ఆర్థిక సహాయం కోసం జరిగే సేకరణను స్పష్టంగా తెలియజేస్తుంది; ఆరాధనా క్రతువుకు చెందిన ‘అర్పణ’ అనే భావాన్ని అనవసరంగా మోపదు.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: పరిశుద్ధుల కోసం
  rationale: సేకరణ లబ్ధిదారులను సూచిస్తూ, పౌలు విశ్వాసులను పిలిచే ἅγιοι అనే కీలక పదానికి అనుగుణమైన రూపాన్ని నిలుపుతుంది.
- source_word: διέταξα
  choice: నేను ఆదేశించినట్లే
  rationale: అపొస్తలుని అధికారంతో ఇచ్చిన నిర్దేశాన్ని తెలియజేస్తుంది; తెలుగులో సందర్భానికి తగిన దృఢతను కలిగి ఉంది.
- source_word: ἐκκλησίαις
  choice: సంఘాలకు
  rationale: పౌలు వాడుకలోని స్థానిక క్రైస్తవ సమాజాలను ఆధునిక తెలుగు బైబిలు భాషలో సహజంగా సూచిస్తుంది.
- source_word: Γαλατίας
  choice: గలతీయ
  rationale: గలతియా ప్రాంతానికి చెందిన సంఘాలను సూచించే సహజమైన తెలుగు విశేషణ రూపం.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: అట్లే మీరూ చేయండి
  rationale: పోలికతో కూడిన ఆజ్ఞార్థక బలాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ఆర్థిక సహాయ సందర్భంలో ἅγιοι పదానికి అనువాదం
  choice: పరిశుద్ధులు
  alternative: దేవుని ప్రజలు
  rationale: పౌలు విశ్వాసుల సమూహాన్ని సాధారణంగా ἅγιοι అని పిలుస్తాడు. ‘పరిశుద్ధులు’ ఆ పదబంధపు లాక్షణిక, ధార్మిక అనుసంధానాన్ని నిలుపుతుంది; తరువాతి కాలపు అధికారిక పరిశుద్ధుల ప్రకటన భావాన్ని స్వయంగా మోపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘విరాళం’ ఆర్థిక సహాయాన్ని స్పష్టం చేస్తుంది; ‘పరిశుద్ధులు’ పౌలు పదప్రయోగాన్ని నిలుపుతుంది.
