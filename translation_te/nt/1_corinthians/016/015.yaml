id: 1CO.16.15
reference: 1 Corinthians 16:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: te
  text: 'సోదరులారా,[a] నేను మిమ్మల్ని వేడుకుంటున్నాను: స్తెఫనాసు ఇంటివారు అఖయలో ప్రథమఫలమని[b], వారు పరిశుద్ధులకు సేవ చేయడానికి తమను తాము అంకితం చేసుకున్నారని మీకు తెలుసు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సోదర సోదరీమణులారా.” గ్రీకులో “సోదరులారా” అని ఉంది; ఈ సాధారణ సంబోధన సంఘమంతటినీ కలుపుకొని ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ప్రథమఫలం” ఇక్కడ అఖయలోని తొలి విశ్వాసులను సూచించే అవకాశం ఉంది; అదే సమయంలో దేవునికి ప్రత్యేకింపబడిన తొలి భాగం అనే రూపకాన్ని కూడా నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: నేను మిమ్మల్ని వేడుకుంటున్నాను
  rationale: ఇది సాధారణ అభ్యర్థనకన్నా హృదయపూర్వకమైన, బలమైన విజ్ఞప్తిని తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజంగానూ గౌరవప్రదంగానూ ఉంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప విషయాంతరాన్ని సూచిస్తుంది. తెలుగులో వాక్యప్రవాహమే ఆ మార్పును సహజంగా తెలియజేస్తుంది; ‘ఇప్పుడు’ అని చేర్చితే మూలంలో లేని కాలార్థం వినిపించవచ్చు.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పుంలింగ సంబోధనను ప్రధాన పాఠ్యంలో నిలుపుతూ, సంఘమంతటినీ—స్త్రీలను కూడా—సూచించగల వాడుకను పాదటిప్పణిలో వివరిస్తుంది.
- source_word: οἰκίαν Στεφανᾶ
  choice: స్తెఫనా ఇంటివారు
  rationale: οἰκία ఇక్కడ భవనాన్ని కాక గృహసమూహాన్ని సూచిస్తుంది. ‘ఇంటివారు’ ఆధునిక తెలుగులో కుటుంబ సభ్యులు మరియు ఆ ఇంటికి చెందిన విస్తృత గృహసమూహం రెండింటినీ సహజంగా సూచించగలదు.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: అకయలో ప్రథమఫలం
  rationale: ‘ప్రథమఫలం’ అనే రూపకం దేవునికి ప్రత్యేకింపబడిన తొలి భాగం అనే భావసూచనను కాపాడుతుంది; సందర్భంలో తొలి విశ్వాసులనే సూచించే అవకాశాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: పరిశుద్ధులకు సేవ చేయడానికి
  rationale: διακονία యొక్క విస్తృత సేవాభావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది; తరువాతి కాలపు అధికారిక సంఘపదవిని అనవసరంగా సూచించదు.
- source_word: ἔταξαν ἑαυτούς
  choice: తమను తాము అంకితం చేసుకున్నారు
  rationale: ఒక పనికి స్వచ్ఛందంగా, స్థిరంగా తమను నియోగించుకున్న భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; అధికారిక నియామకం అనే అర్థాన్ని రుద్దదు.
theological_decisions:
- issue: సంఘాన్ని ఉద్దేశించిన ἀδελφοί యొక్క పరిధి
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: మూలంలోని పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో కాపాడి, అది మిశ్రిత సంఘమంతటినీ కలుపుకోగల సంబోధన అని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
- issue: ἀπαρχή రూపకాన్ని ఎలా అందించాలి
  choice: ప్రథమఫలం
  alternative: మొట్టమొదటి విశ్వాసులు
  rationale: కేవలం కాలక్రమార్థానికి పరిమితం చేయకుండా, తొలి భాగం మరియు దేవునికి ప్రత్యేకింపబడిన భాగం అనే రూపకసూచనలను నిలుపుతుంది.
- issue: ‘గృహం’కు సంబంధించిన ఏకవచనం మరియు సభ్యులకు సంబంధించిన బహువచనం
  choice: ‘ఇంటివారు ... ప్రథమఫలం’; తరువాత ‘వారు’
  alternative: ‘స్తెఫనా కుటుంబం ... ప్రథమఫలం; అది తనను అంకితం చేసుకుంది’
  rationale: గ్రీకులో οἰκία ఏకవచనంగా ఉన్నప్పటికీ, తరువాతి ἑαυτούς బహువచనం ఆ గృహంలోని వ్యక్తులను దృష్టిలో ఉంచుతుంది. తెలుగు ‘ఇంటివారు’ ఈ సమూహార్థాన్ని సహజంగా మోస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంఘపఠన శైలి. ‘వేడుకుంటున్నాను’ విజ్ఞప్తి బలాన్ని, ‘ఇంటివారు’ గృహసమూహ భావాన్ని, ‘ప్రథమఫలం’ పౌలు ఉపయోగించిన రూపకాన్ని కాపాడుతాయి.
