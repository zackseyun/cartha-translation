  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς οἱ ἀδελφοὶ πάντες. ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: te
  text: సోదరులందరూ మీకు వందనాలు చెబుతున్నారు.[a] పవిత్రమైన ముద్దుతో ఒకరినొకరు అభివందనం చేసుకోండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సోదర సోదరీమణులందరూ మీకు వందనాలు చెబుతున్నారు.” ఇక్కడ “సోదరులు” అనే పదం తోటి విశ్వాసులందరినీ సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పవిత్రమైన ముద్దు” విశ్వాసుల మధ్య పరస్పర సహవాసాన్నీ పవిత్రతనూ వ్యక్తపరిచే ఆ కాలపు ఆచారబద్ధమైన పలకరింపు.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: వందనాలు చెబుతున్నారు
  rationale: పత్రికా సందర్భంలో శుభాకాంక్షలతో పలకరించడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: సోదరులందరూ
  rationale: గ్రీకు పదబంధంలోని వ్యాకరణపరమైన పుంలింగ బహువచన రూపాన్ని నిలుపుతూ, అది తోటి విశ్వాసుల సమూహాన్ని సూచించగలదనే విస్తృత భావాన్ని పాదటిప్పణిలో పేర్కొంటుంది.
- source_word: ἀσπάσασθε
  choice: అభివందనం చేసుకోండి
  rationale: ఇది పరస్పర పలకరింపును ఆజ్ఞారూపంలో సహజంగా తెలియజేస్తుంది; మొదటి వాక్యంలోని వందన భావంతో పదార్థ సంబంధాన్ని నిలుపుతుంది.
- source_word: ἀλλήλους
  choice: ఒకరినొకరు
  rationale: పరస్పర చర్యను తెలిపే సహజమైన ప్రామాణిక తెలుగు ప్రయోగం.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: పవిత్రమైన ముద్దుతో
  rationale: ἐν యొక్క విధానం లేదా సాధన భావాన్నీ, φίλημα యొక్క భౌతిక పలకరింపునూ, ἅγιος యొక్క పవిత్రత భావాన్నీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: సంఘ సందర్భంలో ἀδελφοί పద ప్రయోగం
  choice: సోదరులు
  alternative: సోదర సోదరీమణులు; తోటి విశ్వాసులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. అయితే ఈ పదం మిశ్రమ లింగాల విశ్వాసుల సమూహాన్ని సమష్టిగా సూచించగలందున ఆ సాధ్యార్థాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పత్రికా శైలిని వాడాం. మొదటి ἀσπάζονταιకు “వందనాలు చెబుతున్నారు,” ఆజ్ఞారూపమైన ἀσπάσασθεకు “అభివందనం చేసుకోండి” అని ఇచ్చి, తెలుగులో అనవసర పునరుక్తిని తగ్గిస్తూ ఒకే మూలపదంలోని పలకరింపు భావాన్ని నిలిపాం. పాదటిప్పణి గుర్తులు సంబంధిత వాక్యభాగాల వెంట ఉంచబడ్డాయి.
