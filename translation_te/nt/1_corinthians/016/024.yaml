  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ ἀγάπη μου μετὰ πάντων ὑμῶν ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: te
  text: మెస్సీయ యేసులో[a] నా ప్రేమ మీ అందరితో ఉండుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రీస్తు యేసులో.” గ్రీకు బిరుదైన Χριστόςను “మెస్సీయ” అని లేదా సంప్రదాయ తెలుగు రూపంలో “క్రీస్తు” అని అందించవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ ἀγάπη μου
  choice: నా ప్రేమ
  rationale: పౌలు వ్యక్తిగతంగా చూపే ఆప్యాయమైన, స్వార్థరహిత ప్రేమను సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: μετὰ πάντων ὑμῶν
  choice: మీ అందరితో ఉండుగాక
  rationale: μετάతో కూడిన బహువచన ప్రయోగం సంఘంలోని వారందరినీ కలుపుతుంది. గ్రీకులో క్రియ లేకపోయినా, ముగింపు ఆశీర్వచన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘ఉండుగాక’ చేర్చబడింది.
- source_word: ἐν
  choice: లో
  rationale: క్రీస్తుతో సంబంధం లేదా ఆయనలో ఉన్న పరిధి అనే పౌలు ప్రయోగంలోని భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστόςను బిరుదుగా గ్రహించి ‘మెస్సీయ’గా, Ἰησοῦను ‘యేసు’గా అందిస్తుంది; మూలంలోని పదక్రమాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦలో Χριστόςను ఎలా అందించాలి
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఇక్కడ Χριστόςకు ఉన్న బిరుదు భావాన్ని స్పష్టంగా ఉంచడానికి ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో వాడాం. తెలుగు క్రైస్తవ వాడుకలో సంప్రదాయమైన ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- issue: క్రియలేని ముగింపు వాక్యానికి క్రియను సరఫరా చేయడం
  choice: ఉండుగాక
  alternative: ఉంది
  rationale: గ్రీకు వాక్యంలో స్పష్టమైన క్రియ లేదు. ఉత్తర ముగింపులో ఇది ఆశీర్వచనాత్మక ఆకాంక్షగా పనిచేస్తున్నందున ‘ఉండుగాక’ ఆ స్వరాన్ని సహజంగా తెలియజేస్తుంది; ‘ఉంది’ దాన్ని కేవలం వాస్తవ ప్రకటనగా మార్చవచ్చు.
- issue: ἐν Χριστῷ Ἰησοῦ ఏ భాగంతో అనుసంధానమవుతుందనే స్వల్ప సందిగ్ధత
  choice: మెస్సీయ యేసులో నా ప్రేమ మీ అందరితో ఉండుగాక
  alternative: మెస్సీయ యేసులో ఉన్న నా ప్రేమ మీ అందరితో ఉండుగాక
  rationale: ‘ఉన్న నా ప్రేమ’ అని విస్తరించడం ఈ పదబంధాన్ని కేవలం ‘ప్రేమ’కే విశేషణంగా కట్టిపడేస్తుంది. మూలంలోని విస్తృత అనుసంధాన అవకాశాన్ని నిలుపుకోవడానికి ఆ విస్తరణను నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సహజమైన ఉత్తర ముగింపు శైలి. ‘మీ అందరితో’ ద్వారా సమస్త సంఘాన్ని కలుపుకునే భావం స్పష్టంగా నిలుపబడింది.
