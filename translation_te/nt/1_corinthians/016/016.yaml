  source_fidelity: ‘మీరు కూడా’ accurately represents καὶ ὑμεῖς, ‘అలాంటివారికి’ appropriately retains the class-reference of τοῖς τοιούτοις, and ‘లోబడి ఉండాలని’ conveys the present middle/passive force of ὑποτάσσησθε without overstating the command. ‘కలిసి పనిచేస్తూ కష్టపడే ప్రతి ఒక్కరికీ’ faithfully reflects the coordinated participles συνεργοῦντι καὶ κοπιῶντι. The added ‘కోరుతున్నాను’ is a legitimate Telugu completion of the appeal begun in the preceding verse and does not add a new meaning.
