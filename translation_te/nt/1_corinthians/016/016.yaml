  yaml_path: translation/nt/1_corinthians/016/016.yaml
  text: that you also submit yourselves to such people[b][a], and to everyone who works and labors.
translation:
  language: te
  text: మీరు కూడా అలాంటివారికి, అలాగే కలిసి పనిచేస్తూ కష్టపడే ప్రతి ఒక్కరికీ లోబడి ఉండాలని కోరుతున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: లోబడి ఉండాలని కోరుతున్నాను
  rationale: ముందటి వచనంలో ప్రారంభమైన పౌలు విజ్ఞప్తి యొక్క విషయాన్ని ఈ వాక్యం కొనసాగిస్తుంది. తెలుగులో స్వతంత్రంగా చదివినప్పుడు సహజంగా ఉండేందుకు ఆ విజ్ఞప్తి భావాన్ని స్పష్టంగా వ్యక్తం చేశాం.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: కొరింథీయులు కూడా ఇదే విధంగా స్పందించాలనే చేర్పు మరియు ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ὑποτάσσησθε
  choice: లోబడి ఉండాలని
  rationale: గుర్తింపు పొందిన సేవకుల నాయకత్వానికి స్వచ్ఛందంగా లోబడే భావాన్ని తెలియజేస్తుంది; సంపూర్ణమైన లేదా నిర్బంధ విధేయతను అదనంగా చేర్చదు.
- source_word: τοῖς τοιούτοις
  choice: అలాంటివారికి
  rationale: ముందు ప్రస్తావించిన స్తెఫను ఇంటివారివంటి సేవాభావం గల వ్యక్తుల వర్గాన్ని సహజంగా సూచిస్తుంది; లింగాన్ని అనవసరంగా పరిమితం చేయదు.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: కలిసి పనిచేస్తూ ... ప్రతి ఒక్కరికీ
  rationale: συνεργέω లోని ఇతరులతో కలిసి పనిచేసే క్రియాత్మక, సహకార భావాన్ని కాపాడుతుంది.
- source_word: καὶ κοπιῶντι
  choice: కష్టపడే
  rationale: κοπιάω సూచించే శ్రమతో కూడిన కఠిన కృషిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆదేశించిన లోబడుట స్వభావం
  choice: ముందు ప్రస్తావించినవారివంటి క్రైస్తవ సేవకులకు స్వచ్ఛందంగా లోబడాలని చేసిన విజ్ఞప్తి
  alternative: అపరిమితమైన అధికార క్రమానికి విధేయత చూపాలనే విస్తృత ఆదేశం
  rationale: తక్షణ సందర్భం స్తెఫను ఇంటివారినీ వారితో కలిసి శ్రమించేవారినీ గురించి ఉంది. ‘లోబడి ఉండాలని’ అనే అనువాదం వాక్య బలాన్ని నిలుపుతూ, వచనం చెప్పనంత సంపూర్ణమైన లేదా సంస్థాగత అధికార భావాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యం ముందటి వచనంపై వాక్యనిర్మాణ పరంగా ఆధారపడినందున, విడిగా ఇచ్చిన వచనం స్పష్టంగా ఉండేందుకు ‘కోరుతున్నాను’ అని పూరించబడింది. ‘కలిసి పనిచేస్తూ కష్టపడే’ అనే సమన్వయం రెండు వర్తమాన కృదంతాల నిరంతర సేవాభావాన్ని నిలుపుతుంది.
