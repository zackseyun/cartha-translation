  text: εἴ τις οὐ φιλεῖ τὸν ⸀κύριον, ἤτω ἀνάθεμα. ⸂Μαράνα θά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: te
  text: ఎవరైనా ప్రభువును ప్రేమించకపోతే, ఆ వ్యక్తి శాపగ్రస్తుడై ఉండుగాక[a]. మారానా థా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా సంప్రదాయ పదప్రయోగం: ‘అనాథెమా’; అంటే, శాపానికి లోనైన వ్యక్తి.'
    reason: lexical_alternative
  - marker: b
    text: అరామీయ భాష. బహుశా ‘మా ప్రభువా, రమ్ము!’ లేదా ‘మా ప్రభువు వచ్చాడు.’
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: ప్రేమించకపోతే
  rationale: φιλέω ఇక్కడ ప్రభువు పట్ల వ్యక్తిగత ప్రేమను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రేమించు’ సహజంగా ఉండి, భావాన్ని అనవసరంగా కేవలం మమకారానికి లేదా స్నేహానికి పరిమితం చేయదు.
- source_word: κύριον
  choice: ప్రభువును
  rationale: పౌలు వాడిన ఈ సందర్భంలో κύριος యేసును సూచించే బిరుదు. ‘ప్రభువు’ నూతన నిబంధన వాడుకను, క్రీస్తుసంబంధమైన గంభీరతను నిలుపుతుంది.
- source_word: ἤτω
  choice: ఉండుగాక
  rationale: εἰμί యొక్క వర్తమాన ఆజ్ఞార్థక రూపం ఇక్కడ విధింపు లేదా న్యాయతీర్పు భావంతో ఉంది. ‘ఉండుగాక’ ఆ గంభీరమైన ఆజ్ఞార్థక బలాన్ని తెలుగులో నిలుపుతుంది.
- source_word: ἀνάθεμα
  choice: శాపగ్రస్తుడై
  rationale: ἀνάθεμα శాపానికి లోనైన లేదా నాశనానికి అప్పగించబడిన వ్యక్తిని సూచిస్తుంది. ‘శాపగ్రస్తుడై’ సాధారణ పాఠకులకు అర్థమయ్యేలా దాని గంభీరమైన న్యాయతీర్పు భావాన్ని తెలియజేస్తుంది.
- source_word: Μαράνα θά
  choice: మారానా థా
  rationale: ఇది గ్రీకు అక్షరాల్లో భద్రపరచబడిన అరామీయ వ్యక్తీకరణ. దాని పదవిభజన, అర్థం వివాదాస్పదమైనందున ప్రధాన పాఠ్యంలో లిప్యంతరీకరణ చేసి, సాధ్యమైన అర్థాలను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: Μαράνα θά అనే అరామీయ వ్యక్తీకరణ అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘మారానా థా’ అని లిప్యంతరీకరించడం
  alternative: ‘మా ప్రభువా, రమ్ము!’ లేదా ‘మా ప్రభువు వచ్చాడు.’
  rationale: ఈ పదబంధపు పాఠం స్థిరంగా ఉన్నా, అరామీయ పదాలను ఎలా విభజించి అర్థం చేసుకోవాలన్నది అనిశ్చితం. లిప్యంతరీకరణ దాని ఆరాధనాత్మక లేదా ఉద్ఘాటనాత్మక స్వభావాన్ని కాపాడుతూ, నిజమైన అర్థసందిగ్ధతను ముందుగానే పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. τις లింగనిర్దిష్టం కానందున ‘అతడు’కు బదులుగా ‘ఆ వ్యక్తి’ అని అనువదించాం. ‘ఉండుగాక’ వాక్యంలోని గంభీరమైన విధింపు భావాన్ని నిలుపుతుంది.
