  terminology: “ప్రభువు” properly preserves κύριος as the established New Testament title. “శాపగ్రస్తుడు” communicates ἀνάθεμα accessibly without obscuring its solemn force. The transliteration “మారానా థా” is appropriate, and both footnotes are natural Telugu and preserve the relevant lexical and interpretive alternatives.
