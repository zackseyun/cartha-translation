translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఉత్తర ముగింపుకు తగిన గౌరవప్రదమైన మరియు సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో అవసరమైన అధ్యాహార క్రియను చేర్చాం.
