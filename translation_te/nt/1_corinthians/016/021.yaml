  source_fidelity: 'The draft correctly conveys that Paul personally writes the greeting, but its finite progressive verb (''రాస్తున్నాను,'' ‘I am writing’) is more explicit than the Greek nominal subscription. The Greek is a concise signature formula: ‘The greeting [in] my own hand—Paul.’'
