id: 1CO.16.5
reference: 1 Corinthians 16:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐλεύσομαι δὲ πρὸς ὑμᾶς ὅταν Μακεδονίαν διέλθω, Μακεδονίαν γὰρ διέρχομαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/005.yaml
  text: But I will come to you when I have gone through Macedonia[a], for I am going through Macedonia.
translation:
  language: te
  text: అయితే నేను మాసిదోనియా గుండా వెళ్లిన తర్వాత మీ దగ్గరికి వస్తాను[a]; ఎందుకంటే నేను మాసిదోనియా గుండా వెళ్లబోతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాసిదోనియా గుండా వెళ్లినప్పుడు.” గ్రీకు క్రియారూపం భవిష్యత్తులో జరిగే కార్యాన్ని సూచిస్తుంది; సందర్భంలో పౌలు వారి దగ్గరికి రాకముందే ఆ ప్రయాణం పూర్తవుతుందనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: వస్తాను
  rationale: భవిష్యత్ ఉద్దేశాన్ని తెలియజేస్తుంది; πρὸς ὑμᾶςతో కలిసి కొరింథీయుల వైపు రాకను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి ప్రయాణ ప్రణాళిక నుండి స్వల్ప మార్పు లేదా వ్యత్యాసాన్ని సూచిస్తుంది; బలమైన విరోధార్థం లేకుండా ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: πρὸς ὑμᾶς
  choice: మీ దగ్గరికి
  rationale: వ్యక్తుల వైపు కదలికను సూచించే πρός భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὅταν ... διέλθω
  choice: గుండా వెళ్లిన తర్వాత
  rationale: భవిష్యత్తులో మాసిదోనియా ప్రయాణం పూర్తైన తరువాత పౌలు వారి దగ్గరికి వస్తాడనే కాలక్రమాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: Μακεδονίαν
  choice: మాసిదోనియా
  rationale: రోమా ప్రావిన్సు పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: పౌలు తన సందర్శన సమయానికి ఇచ్చే కారణాన్ని స్పష్టంగా కలుపుతుంది.
- source_word: διέρχομαι
  choice: గుండా వెళ్లబోతున్నాను
  rationale: ప్రస్తుతం నిశ్చయించుకున్న సమీప భవిష్యత్ ప్రయాణ ప్రణాళికను తెలుగులో సహజంగా వ్యక్తపరుస్తూ, ముందున్న పూర్తయిన చర్యతో తేడాను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన ప్రయాణ భాష. ‘వెళ్లిన తర్వాత’ ద్వారా ముందుగా పూర్తయ్యే చర్యను కాపాడి, ‘వెళ్లబోతున్నాను’ ద్వారా స్థిరమైన ప్రయాణ ఉద్దేశాన్ని తెలిపింది.
