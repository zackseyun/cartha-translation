- from: నేను వచ్చినప్పుడు, మీరు ఆమోదించినవారిని పత్రాలతో పంపిస్తాను; వారు మీ కానుకను[a] యెరూషలేముకు తీసుకెళ్తారు.[b]
  to: నేను వచ్చినప్పుడు, మీరు పత్రాల ద్వారా ఎవరిని ఆమోదిస్తారో, వారినే మీ కానుకను[a] యెరూషలేముకు తీసుకెళ్లడానికి పంపిస్తాను.[b]
  rationale: The revision restores the direct purpose relationship between ‘send’ and ‘carry,’ represents the prospective selection of delegates, and handles the syntactically uncertain placement of δι’ ἐπιστολῶν without imposing one interpretation silently. The footnote retains the alternative reflected in the English POB audit trail while the text follows the Greek’s immediate syntactic connection.
