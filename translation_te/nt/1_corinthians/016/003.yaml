  text: ὅταν δὲ παραγένωμαι, οὓς ⸀ἐὰν δοκιμάσητε δι’ ἐπιστολῶν, τούτους πέμψω ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: te
  text: నేను వచ్చినప్పుడు, మీరు పత్రాల ద్వారా ఎవరిని ఆమోదిస్తారో, వారినే మీ కానుకను[a] యెరూషలేముకు తీసుకెళ్లడానికి పంపిస్తాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ కృపాపూర్వకమైన కానుకను.’ గ్రీకు పదానికి ‘కృప’ అనే అర్థం కూడా ఉంది; ఇక్కడ అది యెరూషలేముకు పంపే సహాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: '‘పత్రాల ద్వారా’ అనే పదబంధాన్ని ‘పంపిస్తాను’తో కూడా కలపవచ్చు: ‘మీరు ఎవరిని ఆమోదిస్తారో, వారిని పత్రాలతో మీ కానుకను యెరూషలేముకు తీసుకెళ్లడానికి పంపిస్తాను.’'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: నేను వచ్చినప్పుడు
  rationale: ὅταν తో కూడిన aorist subjunctive భవిష్యత్తులో జరిగే సందర్భాన్ని సూచిస్తుంది. δέ ఇక్కడ స్వల్ప అనుసంధానకంగా ఉంది; తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే సహజంగా భావం వ్యక్తమవుతుంది.
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: మీరు ఆమోదించినవారిని
  rationale: δοκιμάζω పరిశీలించి యోగ్యులుగా గుర్తించడం లేదా ఆమోదించడం అనే భావాన్ని కలిగి ఉంది. ప్రతినిధుల ఎంపిక సందర్భంలో ‘ఆమోదించినవారు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: δι’ ἐπιστολῶν
  choice: పత్రాలతో
  rationale: διά + genitive సాధనం లేదా తోడ్పాటును సూచిస్తుంది. ఇక్కడ ఎంపికైనవారు పత్రాలను వెంట తీసుకొని పంపబడతారని సహజంగా తెలియజేస్తుంది; అవి ‘సిఫారసు పత్రాలు’ అని మూలపాఠం స్పష్టంగా చెప్పదు.
- source_word: τούτους πέμψω
  choice: వారిని ... పంపిస్తాను
  rationale: τούτους ముందుగా పేర్కొన్న ఆమోదిత వ్యక్తులను మళ్లీ సూచించే బలమైన సర్వనామం. తెలుగులో ‘వారిని’తో ఆ సూచన స్పష్టంగా నిలుస్తుంది.
- source_word: ἀπενεγκεῖν
  choice: తీసుకెళ్తారు
  rationale: ఈ infinitive పంపడం యొక్క ఉద్దేశాన్ని సూచిస్తుంది—వారు కానుకను యెరూషలేముకు తీసుకెళ్లాలి. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం ఉద్దేశార్థాన్ని రెండవ ఉపవాక్యంగా వ్యక్తం చేశాం.
- source_word: τὴν χάριν ὑμῶν
  choice: మీ కానుకను
  rationale: ఈ సేకరణ సందర్భంలో χάρις యెరూషలేముకు పంపే ద్రవ్య సహాయాన్ని సూచిస్తుంది. ‘కానుక’ స్పష్టమైనది; అయినా ‘కృపాపూర్వకమైన కానుక’ అనే పదసూక్ష్మతను పాదటిప్పణిలో ఉంచాం.
- source_word: εἰς Ἰερουσαλήμ
  choice: యెరూషలేముకు
  rationale: εἰς నగరపేరుతో గమ్యాన్ని సూచిస్తుంది; తెలుగులో ‘యెరూషలేముకు’ సహజమైన రూపం.
theological_decisions:
- issue: సేకరణ సందర్భంలో χάρις అర్థం
  choice: యెరూషలేములోని విశ్వాసుల కోసం ఇచ్చే భౌతిక కానుక లేదా సహాయం
  alternative: కృప; కృపాపూర్వకమైన కార్యం
  rationale: 1 కొరింథీయులు 16 అధ్యాయ సందర్భం పరిశుద్ధుల కోసం సేకరించే విరాళాన్ని గురించినది. కాబట్టి ఇక్కడ χάρις స్పష్టంగా కానుకను సూచిస్తుంది; అయితే ఉదార కృప అనే అంతర్భావాన్ని పూర్తిగా తొలగించకుండా పాదటిప్పణిలో ప్రత్యామ్నాయం ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని సంబంధాలను కాపాడుతూ తెలుగు సహజత్వం కోసం చివరి purpose infinitive‌ను సమన్వయ ఉపవాక్యంగా అందించాం. ‘పత్రాలు’ అనే పదం వాటి ఖచ్చిత స్వరూపాన్ని నిర్ణయించకుండా మూలపాఠంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
