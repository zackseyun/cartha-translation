review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the arrival, the selection of delegates, the gift, and Jerusalem. However, it treats the purpose infinitive ἀπενεγκεῖν as an independent future assertion ('వారు ... తీసుకెళ్తారు'), rather than directly expressing Paul’s purpose in sending them. More importantly, δι’ ἐπιστολῶν immediately follows δοκιμάσητε and can naturally mean that the Corinthians approve the persons by letters; the draft adopts the alternative attachment ('with letters' accompanying those sent) as the sole text. The Greek attachment is syntactically debated, so the translation should retain the closer reading in the text and note the other possibility.
  naturalness: The revised sentence is fluent modern standard Telugu and retains the Greek conditional/indefinite sense through 'ఎవరిని ... ఆమోదిస్తారో, వారినే.' Expressing the infinitive as 'తీసుకెళ్లడానికి పంపిస్తాను' is both idiomatic and more precise than a semicolon followed by an independent clause.
  terminology: ‘కానుక’ appropriately conveys χάρις in this collection context, while the lexical note responsibly preserves the ‘gracious gift/grace’ resonance. ‘పత్రాలు’ is suitably noncommittal about the kind of letters. ‘యెరూషలేము’ is consistent and standard.
  issues:
  - severity: medium
    issue: The purpose infinitive is rendered as an independent future clause.
    rationale: ἀπενεγκεῖν depends on πέμψω and states why Paul will send the approved persons. ‘తీసుకెళ్లడానికి పంపిస్తాను’ preserves this relationship directly.
  - severity: medium
    issue: The text fixes δι’ ἐπιστολῶν exclusively with πέμψω (‘పత్రాలతో పంపిస్తాను’).
    rationale: Its immediate placement after δοκιμάσητε permits, and likely favors, ‘approve by/through letters.’ Since attachment remains open, the main text should use this close syntactic reading and a footnote should preserve the alternative that the delegates are sent with letters.
  - severity: low
    issue: ‘మీరు ఆమోదించినవారిని’ loses the future-contingent/indefinite force of οὓς ἐὰν δοκιμάσητε.
    rationale: ‘మీరు ... ఎవరిని ఆమోదిస్తారో’ more naturally represents the prospective selection without adding meaning.
  revised_text: నేను వచ్చినప్పుడు, మీరు పత్రాల ద్వారా ఎవరిని ఆమోదిస్తారో, వారినే మీ కానుకను[a] యెరూషలేముకు తీసుకెళ్లడానికి పంపిస్తాను.[b]
