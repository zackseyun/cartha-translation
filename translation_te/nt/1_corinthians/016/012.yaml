id: 1CO.16.12
reference: 1 Corinthians 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: te
  text: అపొల్లో అనే సహోదరుని విషయానికి వస్తే, అతడు సహోదరులతో కలిసి మీ దగ్గరికి రావాలని నేను అతణ్ణి ఎంతో కోరాను. అయితే ఇప్పుడు రావడం అతనికి ఎంతమాత్రమూ ఇష్టం లేకపోయింది.[a] అవకాశం దొరికినప్పుడు అతడు వస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: “అయితే ఇప్పుడు రావడానికి అతడు ఎంతమాత్రమూ ఇష్టపడలేదు.” గ్రీకు వాక్యం మరింత అక్షరార్థంగా, “అయితే ఇప్పుడు రావడం అతని ఇష్టం ఎంతమాత్రమూ కాదు” అని ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: అపొల్లో అనే సహోదరుని విషయానికి వస్తే
  rationale: కొత్త అంశాన్ని పరిచయం చేసే Περὶ δὲను సహజమైన తెలుగు సంధిగా అనువదించాం. τοῦ ἀδελφοῦలో స్పష్టమైన స్వామ్య సర్వనామం లేకపోవడంతో ‘మన సహోదరుడు’ అని చేర్చకుండా ‘సహోదరుడు’గా ఉంచాం.
- source_word: πολλὰ παρεκάλεσα αὐτόν
  choice: నేను అతణ్ణి ఎంతో బతిమాలాను
  rationale: πολλὰ విజ్ఞప్తి తీవ్రతను తెలియజేస్తుంది; సందర్భంలో παρακαλέω బలమైన వ్యక్తిగత విజ్ఞప్తిని సూచిస్తుంది. ‘ఎంతో బతిమాలాను’ సాధారణ ఆధునిక తెలుగులో ఆ బలాన్ని సహజంగా అందిస్తుంది.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν
  choice: అతడు సహోదరులతో కలిసి మీ దగ్గరికి రావాలని
  rationale: ἵνα ఉపవాక్యాన్ని విజ్ఞప్తి విషయంగా ‘రావాలని’తో సహజంగా వ్యక్తం చేశాం; μετὰ τῶν ἀδελφῶνను నిర్దిష్ట పురుష సహప్రయాణికులను సూచించే ‘సహోదరులతో కలిసి’గా ఉంచాం.
- source_word: καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ
  choice: అయితే ఇప్పుడు రావడం అతనికి ఎంతమాత్రమూ ఇష్టం లేదు
  rationale: πάντωςతో బలపడిన నిరాకరణను ‘ఎంతమాత్రమూ ... లేదు’గా వ్యక్తం చేశాం. θέλημα అనే నామవాచక భావాన్ని తెలుగులో సహజంగా ‘ఇష్టం’తో అందించాం; సందర్భానుసారం దాని కర్త అపొల్లోనే.
- source_word: ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ
  choice: అవకాశం దొరికినప్పుడు అతడు వస్తాడు
  rationale: εὐκαιρέω అనుకూలమైన సమయం లేదా అవకాశం లభించడాన్ని సూచిస్తుంది; కేవలం వ్యక్తిగత సౌకర్యం అనే భావం రాకుండా ‘అవకాశం దొరికినప్పుడు’ అని అనువదించాం.
theological_decisions:
- issue: οὐκ ἦν θέλημαలోని సంకల్పం లేదా ఇష్టం ఎవరిది?
  choice: అది అపొల్లో ఇష్టం అని సందర్భానుసారంగా స్పష్టం చేయడం
  alternative: ఇప్పుడు రావడం దేవుని చిత్తం కాదు అని అర్థం చేసుకోవడం
  rationale: సమీప సూచిత వ్యక్తి అపొల్లో; దేవుని చిత్తానికి మారినట్లు మూలపాఠంలో ఎలాంటి సంకేతమూ లేదు. అందువల్ల పాఠంలో లేని దైవ నిషేధాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘అపొల్లో’ ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణ. మూలంలోని ‘సహోదరుడు’ ముందు స్వామ్యసూచక పదం లేకపోవడాన్ని ప్రధాన పాఠంలో కాపాడాం.
