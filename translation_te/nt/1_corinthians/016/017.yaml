revisions:
- from: స్తెఫను, ఫొర్తునాతు, అకాయికు వచ్చినందుకు నేను సంతోషిస్తున్నాను. ఎందుకంటే మీ వైపు లోటుగా ఉన్నదాన్ని[a] వీరు పూరించారు.
  to: స్తెఫనాసు, ఫొర్తునాతు, అకాయికు రాకను బట్టి నేను సంతోషిస్తున్నాను; ఎందుకంటే మీ కొరతను వీరు పూరించారు.[a]
  rationale: The revision corrects the transliteration of Stephanas, renders παρουσία as “రాకను,” and replaces an unnatural calque with “మీ కొరతను.” The main text remains formally close to the Greek and does not decide whether the lack was specifically the church's personal absence; that contextual possibility remains in the footnote.
