  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: te
  text: స్తెఫనాసు, ఫొర్తునాతు, అకాయికు రాకను బట్టి నేను సంతోషిస్తున్నాను; ఎందుకంటే మీ కొరతను వీరు పూరించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు లేకపోవడం వల్ల కలిగిన లోటును వీరు పూరించారు.” పౌలు కొరింథీయుల నైతిక లోపాన్ని కాక, వారు స్వయంగా తన దగ్గర ఉండలేకపోవడం వల్ల ఏర్పడిన లోటును ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: నేను సంతోషిస్తున్నాను
  rationale: వర్తమానకాలంలోని వ్యక్తిగత ఆనందాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతను కాక స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: వచ్చినందుకు
  rationale: ఈ సందర్భంలో παρουσία వారి వ్యక్తిగత రాకను లేదా సమక్షతను సూచిస్తుంది; అంత్యకాల సంబంధమైన సాంకేతిక భావం కాదు.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: స్తెఫను, ఫొర్తునాతు, అకాయికు
  rationale: వ్యక్తుల పేర్లను తెలుగులో ప్రాచుర్యంలో ఉన్న రూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: పౌలు సంతోషించడానికి గల కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: మీ వైపు లోటుగా ఉన్నదాన్ని
  rationale: ὑστέρημα అనే పదంలోని ‘లోటు/కొరత’ భావాన్ని నిలుపుతూ, అది కొరింథీయుల గైర్హాజరునే తప్పనిసరిగా సూచిస్తుందని ప్రధాన పాఠ్యంలో నిర్ణయించదు.
- source_word: οὗτοι
  choice: వీరు
  rationale: ముందు పేర్కొన్న ముగ్గురిని సూచించే ఉద్ఘాటిత నిర్దేశక సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: ἀνεπλήρωσαν
  choice: పూరించారు
  rationale: లోటుగా ఉన్నదాన్ని నింపడం లేదా సమకూర్చడం అనే మూల భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τὸ ὑμέτερον ὑστέρημα యొక్క సందర్భార్థం
  choice: ప్రధాన పాఠ్యంలో ‘మీ వైపు లోటుగా ఉన్నదాన్ని’ అని అర్థవిస్తృతిని నిలిపాం.
  alternative: ‘మీరు లేకపోవడం వల్ల కలిగిన లోటును’ అని వారి వ్యక్తిగత గైర్హాజరును స్పష్టంగా పేర్కొనవచ్చు.
  rationale: గ్రీకు పదబంధం కొరింథీయుల గైర్హాజరును సూచించవచ్చు; అయితే పదశః అది వారి వైపు ఉన్న లోటు లేదా కొరతను మాత్రమే చెబుతుంది. అందువల్ల ప్రధాన పాఠ్యం ఆ అస్పష్టతను కాపాడి, సాధ్యమైన సందర్భార్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించాం. ‘మీ వైపు లోటుగా ఉన్నదాన్ని’ అనే స్వల్పంగా సాంద్రమైన పదబంధం మూలంలోని నిజమైన అర్థసందిగ్ధతను కాపాడుతుంది.
