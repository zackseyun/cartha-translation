  to: తిమోతి వస్తే, అతడు మీ మధ్య భయం లేకుండా ఉండేలా చూసుకోండి[a], ఎందుకంటే అతడు కూడా నాలాగే ప్రభువు పనిని చేస్తున్నాడు[b].
