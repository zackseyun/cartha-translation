id: 1CO.16.10
reference: 1 Corinthians 16:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: te
  text: తిమోతి వస్తే, అతడు మీ మధ్య భయం లేకుండా ఉండేలా చూసుకోండి[a], ఎందుకంటే అతడు కూడా నాలాగే ప్రభువు పనిని చేస్తున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు మీతో భయం లేకుండా ఉండేలా చూసుకోండి.” గ్రీకు పదబంధం అతడు వారి దగ్గర ఉన్నప్పుడు భయరహిత స్థితిలో ఉండడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎందుకంటే అతడు ప్రభువు పనిని చేస్తాడు, నేను కూడా అలాగే చేస్తాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ ἔλθῃ Τιμόθεος
  choice: తిమోతి వస్తే
  rationale: ἐάνతో కూడిన aorist subjunctive భవిష్యత్తులో సంభవించగల పరిస్థితిని సూచిస్తుంది. δέ ఇక్కడ స్వల్ప సందర్భ మార్పును సూచించినా, తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: βλέπετε ἵνα
  choice: ఉండేలా చూసుకోండి
  rationale: βλέπετε అనే బహువచన ఆజ్ఞ, తరువాతి ἵνα వాక్యంతో కలిసి, వారు చురుకుగా జాగ్రత్త తీసుకోవాలని తెలియజేస్తుంది.
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: అతడు మీ మధ్య భయం లేకుండా ఉండేలా
  rationale: γένηται πρὸς ὑμᾶς తిమోతి వారితో ఉన్నప్పుడు అతని స్థితిని సూచిస్తుంది. ‘మీ మధ్య’ సంబంధపూర్వక సన్నిధిని, ‘భయం లేకుండా’ ἀφόβως అర్థాన్ని సహజ తెలుగులో నిలుపుతాయి.
- source_word: τὸ ἔργον κυρίου ἐργάζεται
  choice: అతడు ప్రభువు పనిని చేస్తున్నాడు
  rationale: సమాన మూలంతో ఉన్న ἔργον/ἐργάζεται భావాన్ని సహజ తెలుగులో ‘పనిని చేస్తున్నాడు’గా అందించి, కొనసాగుతున్న కార్యాన్ని వ్యక్తం చేసింది.
- source_word: ὡς κἀγώ
  choice: నాలాగే అతడు కూడా
  rationale: κἀγώ = καὶ ἐγώ (‘నేను కూడా’). తెలుగులో పోలికను ముందుకు తెచ్చి, పౌలు మరియు తిమోతి ఒకే ప్రభువు పనిలో ఉన్నారనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: κυρίουలో ‘ప్రభువు’ ఎవరిని సూచిస్తాడు
  choice: మూలపాఠంలాగే ‘ప్రభువు’ అని మాత్రమే ఉంచడం
  alternative: ‘ప్రభువైన యేసు’ అని స్పష్టీకరించడం
  rationale: పౌలు వాడుకలో ఇది యేసును సూచించే అవకాశం బలంగా ఉన్నప్పటికీ, గ్రీకు పాఠం కేవలం κυρίου అని చెబుతుంది. అనువాదం ఆ స్పష్టీకరించని రూపాన్నే కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. బహువచన ఆజ్ఞకు ‘చూసుకోండి’ వాడబడింది; ‘ప్రభువు’ అనే సంప్రదాయమైనప్పటికీ ప్రస్తుత వాడుకలో సహజమైన పదం నిలుపబడింది.
