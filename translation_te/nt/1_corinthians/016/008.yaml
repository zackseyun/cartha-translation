  yaml_path: translation/nt/1_corinthians/016/008.yaml
  text: But I will stay in Ephesus until Pentecost[a].
translation:
  language: te
  text: అయితే పెంతెకొస్తు పండుగ వరకు నేను ఎఫెసులో ఉంటాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారాల పండుగ వరకు నేను ఎఫెసులో ఉంటాను.’
    reason: πεντηκοστή అనే గ్రీకు పేరు యూదుల ‘వారాల పండుగ’ను సూచిస్తుంది; ఇది స్థిరపడిన ‘పెంతెకొస్తు’ అనే పేరుకు ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: ἐπιμενῶ
  choice: ఉంటాను
  rationale: ἐπιμένω భవిష్యత్ కాల రూపం; ప్రయాణ ప్రణాళిక సందర్భంలో కొంతకాలం ఒకే చోట ఉండడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఉంటాను’ సహజంగా, స్పష్టంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ ముందున్న ప్రయాణ చర్చతో స్వల్ప వ్యత్యాసాన్ని లేదా మార్పును సూచిస్తుంది. ‘అయితే’ ఆ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν Ἐφέσῳ
  choice: ఎఫెసులోనే
  rationale: ἐν + దత్తివిభక్తి స్థలార్థాన్ని ఇస్తుంది. ‘లో’ స్థలాన్ని వ్యక్తం చేస్తుండగా, తెలుగు వాక్య ప్రవాహంలో ‘నే’ అక్కడే కొనసాగి ఉండే భావాన్ని సహజంగా బలపరుస్తుంది.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: పెంతెకొస్తు పండుగ వరకు
  rationale: ἕως + షష్ఠీవిభక్తి ఒక నిర్దిష్ట సమయం వరకు కొనసాగే వ్యవధిని సూచిస్తుంది. πεντηκοστήకి నూతన నిబంధన వాడుకలో స్థిరపడిన పేరు ‘పెంతెకొస్తు’; ‘పండుగ’ అని చేర్చడం సాధారణ పాఠకుడికి అది పండుగ దినమని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. స్థలనామం ‘ఎఫెసు’, పండుగ పేరు ‘పెంతెకొస్తు’గా సాధారణ తెలుగు బైబిలు పరిచయానికి అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
