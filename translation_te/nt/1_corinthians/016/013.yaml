  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γρηγορεῖτε, στήκετε ἐν τῇ πίστει, ἀνδρίζεσθε, κραταιοῦσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/013.yaml
  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: te
  text: మెలకువగా ఉండండి; విశ్వాసంలో స్థిరంగా నిలబడండి; ధైర్యంగా ప్రవర్తించండి[a]; బలంగా ఉండండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పురుషుల్లా ప్రవర్తించండి”; ఈ గ్రీకు క్రియ సందర్భంలో “ధైర్యంగా ఉండండి” లేదా “సాహసంగా ప్రవర్తించండి” అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బలపరచబడండి” లేదా “బలాన్ని పొందండి.” గ్రీకు క్రియ కర్మణి రూపంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: మెలకువగా ఉండండి
  rationale: వర్తమానకాల ఆజ్ఞారూపం నిరంతర అప్రమత్తతను సూచిస్తుంది; ఈ తెలుగు ప్రయోగం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: στήκετε
  choice: స్థిరంగా నిలబడండి
  rationale: ఇది కేవలం శారీరకంగా నిలబడటాన్ని కాక దృఢంగా, నిలకడగా ఉండటాన్ని సూచిస్తుంది.
- source_word: ἐν τῇ πίστει
  choice: విశ్వాసంలో
  rationale: ఆర్టికల్‌తో ఉన్న ఈ పదబంధం క్రైస్తవ విశ్వాసం అనే పరిధి లేదా దాని విషయసారాన్ని సూచించవచ్చు; తెలుగు సందర్భంలో ‘విశ్వాసంలో’ ఆ అర్థాన్ని సహజంగా మోస్తుంది.
- source_word: ἀνδρίζεσθε
  choice: ధైర్యంగా ప్రవర్తించండి
  rationale: క్రియ అక్షరార్థంగా పురుషునిలా ప్రవర్తించడమనే లింగసూచక రూపకం కలిగివున్నా, సందర్భానుసారమైన ఆజ్ఞ ధైర్యంగా వ్యవహరించమనే భావాన్ని ఇస్తుంది; మూల రూపకాన్ని పాదసూచికలో ఉంచాం.
- source_word: κραταιοῦσθε
  choice: బలపరచబడండి
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా కర్మణి ఆజ్ఞార్థకం; అందువల్ల సహజమైన తెలుగు కర్మణి రూపంతో దాని అస్పష్టతను కాపాడాం.
theological_decisions:
- issue: πίστις పదబంధపు భావం
  choice: విశ్వాసంలో
  alternative: ఆ విశ్వాసంలో
  rationale: ఆర్టికల్ క్రైస్తవ విశ్వాసపు విషయసారాన్ని సూచించగలదు. అయితే తెలుగులో ‘ఆ విశ్వాసంలో’ అనడం అనవసరంగా నిర్దిష్టంగా వినిపించవచ్చు; ‘విశ్వాసంలో’ సహజంగా ఉండి మూల భావాన్ని పరిమితం చేయదు.
- issue: ἀνδρίζεσθε లోని లింగసూచక రూపకం
  choice: ధైర్యంగా ప్రవర్తించండి
  alternative: పురుషుల్లా ప్రవర్తించండి
  rationale: ఈ గ్రీకు నానుడి యొక్క సందర్భార్థం ధైర్యంగా వ్యవహరించడం. అక్షరానువాదం ఆధునిక తెలుగులో స్త్రీలను మినహాయిస్తున్నట్టు లేదా పురుషత్వాన్నే నైతిక ప్రమాణంగా చేస్తున్నట్టు అపార్థం కలిగించవచ్చు; అయినా మూలంలోని పురుషసూచక రూపకాన్ని పాదసూచికలో స్పష్టంగా తెలియజేశాం.
- issue: κραταιοῦσθε యొక్క కర్మణి రూపం
  choice: బలపరచబడండి
  alternative: బలంగా ఉండండి
  rationale: కర్మణి రూపం బలం పొందడాన్ని లేదా బలపరచబడడాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో దానిని కాపాడి, సహజమైన కర్తరి భావానువాదాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, చిన్న చిన్న ఆజ్ఞల లయను నిలుపుతూ గౌరవబహువచన రూపాలు వాడబడ్డాయి. మూలంలోని కర్మణి భావం మరియు లింగసూచక నానుడి పాదసూచికలతో స్పష్టం చేయబడ్డాయి.
