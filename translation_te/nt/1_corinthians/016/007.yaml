revisions:
- from: ఎందుకంటే, ఇప్పుడు దారిలో వెళ్తూ మిమ్మల్ని కేవలం చూసిపోవాలని నేను కోరుకోవడం లేదు.[a] ప్రభువు అనుమతిస్తే, కొంతకాలం మీతో ఉండాలని ఆశిస్తున్నాను.
  to: ఎందుకంటే, నేను మిమ్మల్ని ఇప్పుడు ప్రయాణమధ్యలో మాత్రమే చూడాలని కోరుకోవడం లేదు; ప్రభువు అనుమతిస్తే, కొంతకాలం మీతో ఉండాలని ఆశిస్తున్నాను.[a]
