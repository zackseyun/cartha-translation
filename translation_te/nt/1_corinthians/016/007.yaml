id: 1CO.16.7
reference: 1 Corinthians 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: te
  text: ఎందుకంటే, నేను మిమ్మల్ని ఇప్పుడు ప్రయాణమధ్యలో మాత్రమే చూడాలని కోరుకోవడం లేదు; ప్రభువు అనుమతిస్తే, కొంతకాలం మీతో ఉండాలని ఆశిస్తున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దారిలో వెళ్తూ” లేదా “వెళ్తున్న మార్గంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω
  choice: నేను కోరుకోవడం లేదు
  rationale: ఇక్కడ θέλω బలమైన నిరాకరణకన్నా పౌలు కోరిక లేదా ఉద్దేశాన్ని తెలియజేస్తుంది; ఈ తెలుగు ప్రయోగం ఆ వ్యక్తిగత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἄρτι
  choice: ఇప్పుడు
  rationale: ప్రస్తుత సమయాన్ని లేదా ప్రస్తుత పరిస్థితిని సూచించే ἄρτιకి ఇది సంక్షిప్తమైన, సహజమైన సమానం.
- source_word: ἐν παρόδῳ
  choice: దారిలో వెళ్తూ ... కేవలం చూసిపోవాలని
  rationale: ఈ పదబంధం ప్రయాణమధ్యలో చేసే స్వల్పకాలిక సందర్శనను సూచిస్తుంది. తెలుగులో ‘దారిలో వెళ్తూ ... చూసిపోవడం’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘కేవలం’ దాని తాత్కాలిక స్వభావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἰδεῖν
  choice: చూసిపోవాలని
  rationale: మూలార్థం ‘చూడడం’; సందర్భంలో సందర్శించడం అనే భావం ఉంది. ‘చూసిపోవడం’ దారిమధ్య స్వల్పంగా కలుసుకోవడం అనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: ἐλπίζω
  choice: ఆశిస్తున్నాను
  rationale: నిశ్చయాన్ని ప్రకటించకుండా కోరికతో కూడిన నిరీక్షణను తెలియజేస్తుంది.
- source_word: χρόνον τινά
  choice: కొంతకాలం
  rationale: నిర్దిష్టంగా చెప్పని, అయితే గణనీయమైన కాలవ్యవధిని సహజంగా సూచిస్తుంది.
- source_word: ἐπιμεῖναι
  choice: ఉండాలని
  rationale: ἐπιμένωలోని కొనసాగి ఉండడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: πρὸς ὑμᾶς
  choice: మీతో
  rationale: ఉండడాన్ని సూచించే క్రియతో πρὸς వ్యక్తుల సహవాసం లేదా సన్నిధిని తెలియజేస్తుంది; ‘మీతో’ అత్యంత సహజమైన తెలుగు రూపం.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: ప్రభువు అనుమతిస్తే
  rationale: ప్రభువు చిత్తం లేదా అనుమతిపై ఆధారపడటాన్ని షరతుతో వ్యక్తం చేస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: మూలంలో సూచిత వ్యక్తిని మరింత నిర్దిష్టం చేయకుండా κύριοςకు సాధారణ గౌరవపూర్వక దైవసంబంధ తెలుగు సమానాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: ‘ప్రభువు’ ఎవరిని సూచిస్తున్నాడు?
  choice: ‘ప్రభువు’ అని మాత్రమే అనువదించడం
  alternative: ‘ప్రభువైన యేసు’ లేదా ‘దేవుడు’ అని నిర్దిష్టం చేయడం
  rationale: గ్రీకు పాఠంలో κύριος మాత్రమే ఉంది; యేసునా, తండ్రియైన దేవుడా అని ఈ వాక్యం స్పష్టంగా పేర్కొనదు. అందువల్ల మూలంలోని తెరచిన భావాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దారిలో వెళ్తూ ... చూసిపోవడం’ అనే ప్రయోగం స్వల్పకాలిక ప్రయాణమధ్య సందర్శన భావాన్ని సామాన్య పాఠకునికి స్పష్టంగా అందిస్తుంది. మూలంలోని రెండు γάρలను తెలుగులో యాంత్రికంగా రెండుసార్లు ‘ఎందుకంటే’ అని పెట్టకుండా, మొదటిదాన్ని స్పష్టంగా వ్యక్తం చేసి రెండవ వాక్యాన్ని సహజమైన వివరణాత్మక క్రమంలో ఉంచాం.
