id: 1CO.16.19
reference: 1 Corinthians 16:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: te
  text: ఆసియాలోని సంఘాలు మీకు వందనాలు తెలియజేస్తున్నాయి.[a] అకులా, ప్రిస్కా తమ ఇంటిలోని సంఘంతో కలిసి ప్రభువులో మీకు హృదయపూర్వక వందనాలు తెలియజేస్తున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఆసియా” అనేది పశ్చిమ ఆసియా మైనరులోని రోమా పాలిత ఆసియా ప్రావిన్సును సూచిస్తుంది; నేటి ఆసియా ఖండాన్ని కాదు.
    reason: cultural_note
  - marker: b
    text: గ్రీకు పాఠంలో పేరు “ప్రిస్కా.” ఇతర చోట్ల ఆమెను “ప్రిస్కిల్లా” అని కూడా పిలిచారు (ఉదా. అపొస్తలుల కార్యములు 18:2, 18, 26; రోమీయులకు 16:3).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: శుభాలు తెలియజేస్తున్నాయి / శుభాలు తెలియజేస్తున్నారు
  rationale: ἀσπάζομαι ఇక్కడ వ్యక్తిగతంగా పలకరించడం కంటే దూరంలో ఉన్నవారికి అభివందనాలు పంపే భావంలో ఉంది. ఆధునిక ప్రామాణిక తెలుగులో ‘శుభాలు తెలియజేయడం’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: αἱ ἐκκλησίαι
  choice: సంఘాలు
  rationale: పౌలు వాడుకలో ἐκκλησία సాధారణంగా స్థానిక క్రైస్తవ విశ్వాసుల సమాజాన్ని సూచిస్తుంది. ‘సంఘాలు’ తెలుగులో స్పష్టమైన, సాధారణ పదం.
- source_word: τῆς Ἀσίας
  choice: ఆసియలోని
  rationale: గ్రీకు రూపాన్ని సంక్షిప్తంగా నిలుపుతూ ప్రాంత సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది. ఇది ఆధునిక ఖండం కాదని పాదటిప్పణిలో స్పష్టం చేయబడింది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు రచనలలోని సంబంధాత్మక, విశ్వాసపరమైన భావాన్ని అతిగా వివరించకుండా కాపాడుతుంది.
- source_word: πολλὰ
  choice: హృదయపూర్వకంగా
  rationale: ἀσπάζεταιను బలపరచే క్రియావిశేషణ ప్రయోగం. అక్షరార్థమైన ‘ఎక్కువగా’ తెలుగులో అసహజం; ‘హృదయపూర్వకంగా’ ఆప్యాయతతో కూడిన తీవ్రతను సహజంగా అందిస్తుంది.
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: అకుల, ప్రిస్క
  rationale: మూలపాఠంలోని వ్యక్తినామాలను తెలుగు ధ్వని వ్యవస్థకు అనుగుణంగా లిప్యంతరీకరించింది. Πρίσκα అనే సంక్షిప్త రూపాన్ని ప్రధాన పాఠంలో నిలిపింది.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: వారి ఇంటిలోని సంఘంతో కలిసి
  rationale: ఇంటిలో కూడే స్థానిక విశ్వాసుల సమాజాన్ని సూచించే గ్రీకు ప్రయోగాన్ని దగ్గరగా, సహజంగా అనువదిస్తుంది; మూలంలో ప్రత్యక్షంగా లేని ‘కూడే’ అనే క్రియను ప్రధాన పాఠంలో చేర్చలేదు.
theological_decisions:
- issue: ఇంటి సందర్భంలో ἐκκλησία భావం
  choice: వారి ఇంటిలోని సంఘం—అకుల, ప్రిస్క ఇంటిలో కూడే స్థానిక క్రైస్తవ విశ్వాసుల సమాజం
  alternative: వారి కుటుంబం లేదా సంస్థాగత ‘గృహసంఘం’ అనే సంకుచిత అర్థం
  rationale: κατ’ οἶκον ἐκκλησία అనే పదబంధం కుటుంబ సభ్యులను మాత్రమే కాక, ఆ ఇంటిలో సమావేశమయ్యే సంఘాన్ని సహజంగా సూచిస్తుంది; ప్రధాన అనువాదం మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- issue: κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ἐν κυρίῳ అనే పౌలు ప్రయోగంలో ‘ప్రభువు’ క్రీస్తుతో సంబంధమైన విశ్వాస సహవాస భావాన్ని నిలుపుతుంది; ‘యజమాని’ ఇక్కడ తగినది కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘సంఘం,’ ‘ప్రభువులో’ వంటి స్థిరమైన బైబిలు పదప్రయోగాలను నిలిపి, అసహజమైన అక్షరానువాదాలను నివారించింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉంచబడ్డాయి.
