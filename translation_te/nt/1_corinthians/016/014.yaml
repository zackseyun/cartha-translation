translation:
  language: te
  text: మీరు చేసేదంతా ప్రేమతో జరగాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “మీకు సంబంధించినవన్నీ ప్రేమలో జరగాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: చేసేదంతా
  rationale: నపుంసక బహువచన రూపం సమస్తాన్ని సమగ్రంగా సూచిస్తుంది. సందర్భంలో ‘చేసేదంతా’ సహజమైన ఆధునిక తెలుగు వాడుకలో దాని విశ్వవ్యాప్త పరిధిని నిలుపుతుంది.
- source_word: ὑμῶν
  choice: మీరు చేసే
  rationale: πάντα ὑμῶν అనే గ్రీకు నిర్మాణం అక్షరార్థంగా ‘మీకు సంబంధించినవన్నీ’ అనే భావాన్ని ఇస్తుంది. ఇక్కడ కొరింథీయుల కార్యాలు ఉద్దేశించబడినందున ‘మీరు చేసే’ అని అంతర్లీన క్రియాభావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: ἐν ἀγάπῃ
  choice: ప్రేమతో
  rationale: ἐν అనే ఉపసర్గ ఇక్కడ విధానాన్ని లేదా పరిధిని సూచించగలదు. ‘ప్రేమతో’ ఆధునిక తెలుగులో కార్యం జరిగే విధానాన్ని సహజంగా తెలియజేస్తుంది; ‘ప్రేమలో’ అనే మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: γινέσθω
  choice: జరగాలి
  rationale: γίνομαι క్రియ యొక్క వర్తమాన మధ్యమ/కర్మణి మూడవ పురుష ఏకవచన ఆజ్ఞార్థక రూపం ఇది. ‘జరగాలి’ ఉపదేశాత్మక ఆజ్ఞను, కార్యాలు ఆ విధంగా చోటుచేసుకోవాలనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, సంక్షిప్తమైన, గౌరవప్రదమైన ఉపదేశ శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని సమగ్ర పరిధిని నిలుపుతూ, అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో భద్రపరిచాం.
