id: 1CO.16.11
reference: 1 Corinthians 16:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: te
  text: కాబట్టి ఎవరూ అతణ్ణి చిన్నచూపు చూడకూడదు. అతడు నా వద్దకు వచ్చేలా అతణ్ణి శాంతితో సాగనంపండి. ఎందుకంటే నేను సోదరులతో పాటు[a] అతని కోసం ఎదురుచూస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సోదరులతో పాటు” అనేది విస్తృతమైన సహవిశ్వాసుల లేదా సహచరుల సమూహాన్ని సూచిస్తే, “సోదరులు, సోదరీమణులతో పాటు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις οὖν
  choice: కాబట్టి ఎవరూ ... చూడకూడదు
  rationale: οὖν ముందున్న విషయంతో తార్కిక సంబంధాన్ని చూపుతుంది; μή తో కూడిన aorist subjunctive నిషేధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξουθενήσῃ
  choice: చిన్నచూపు చూడకూడదు
  rationale: ఎవరినైనా విలువలేనివాడిగా పరిగణించడం లేదా తృణీకరించడం అనే భావాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా అందిస్తుంది.
- source_word: προπέμψατε
  choice: సాగనంపండి
  rationale: ముందుకు పంపడమే కాక ప్రయాణానికి తగిన సహాయం చేసి పంపే భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν εἰρήνῃ
  choice: శాంతితో
  rationale: విరోధం లేదా ఆటంకం లేకుండా, సత్సంబంధంతో పంపాలనే సందర్భోచిత భావాన్ని నిలుపుతుంది.
- source_word: ἵνα ἔλθῃ πρός με
  choice: అతడు నా దగ్గరికి వచ్చేలా
  rationale: ἵνα తో ఉన్న ఉద్దేశార్థాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἐκδέχομαι
  choice: ఎదురుచూస్తున్నాను
  rationale: కొనసాగుతున్న నిరీక్షణను సూచించే present రూపాన్ని సహజంగా అందిస్తుంది.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: సోదరులతో పాటు
  rationale: గ్రీకు masculine plural రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది విస్తృత సహవిశ్వాసుల లేదా సహచరుల సమూహాన్ని సూచించే అవకాశాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: μετὰ τῶν ἀδελφῶν యొక్క అన్వయం మరియు పరిధి
  choice: నేను సోదరులతో పాటు అతని కోసం ఎదురుచూస్తున్నాను
  alternative: సోదరులు అతనితో కలిసి వస్తారని నేను ఎదురుచూస్తున్నాను; లేదా ‘సోదరులు, సోదరీమణులతో పాటు’
  rationale: గ్రీకు పదక్రమంలో μετὰ τῶν ἀδελφῶν వ్యాకరణపరంగా ἐκδέχομαι తో సహజంగా అనుసంధానమవుతుంది—పౌలు సోదరులతో కలిసి తిమోతికోసం ఎదురుచూస్తున్నాడు. అయితే దాన్ని తిమోతితో వచ్చే సహచరులుగా అన్వయించే అవకాశం, అలాగే ἀδελφοί మిశ్రమ విశ్వాసుల సమూహాన్ని సూచించే అవకాశం ఉన్నాయి; అందువల్ల ఆ సందిగ్ధతను పాదటిప్పణిలో పేర్కొంటాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘చిన్నచూపు చూడకూడదు,’ ‘సాగనంపండి,’ ‘ఎదురుచూస్తున్నాను’ వంటి సహజ ప్రయోగాలతో మూలంలోని నిషేధం, ప్రయాణ సహాయం, కొనసాగుతున్న నిరీక్షణ నిలుపబడ్డాయి.
