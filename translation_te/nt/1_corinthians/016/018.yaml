translation:
  language: te
  text: ఎందుకంటే వారు నా ఆత్మను, మీ ఆత్మను సేదదీర్చారు. కాబట్టి ఇలాంటి వారిని తగినవారిగా గుర్తించండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గుర్తించండి,’ ‘విలువనివ్వండి,’ లేదా ‘తగిన గౌరవం ఇవ్వండి’ అని కూడా అనువదించవచ్చు. గ్రీకులో ఈ మాట పుంలింగంలో ఉంది; ఇక్కడ అది కాస్త ముందే ప్రస్తావించిన పురుషులను ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: సేదదీర్చారు
  rationale: ఇక్కడ క్రియ అక్షరార్థమైన విశ్రాంతిని కాకుండా అంతరంగ ఉపశమనాన్ని, నూతన బలాన్ని సూచిస్తుంది. ‘సేదదీర్చారు’ ఆధునిక తెలుగులో ఈ రూపకాలంకార భావాన్ని సహజంగా అందిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి మాటకు కారణాన్ని తెలియజేసే సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: ఇక్కడ పరిశుద్ధాత్మను కాకుండా వ్యక్తి అంతరంగ స్థితిని సూచిస్తుంది. అయినా పౌలు వాడిన ‘ఆత్మ’ అనే పదాన్ని నిలుపుకోవడం మూలంలోని భావవిస్తృతిని కాపాడుతుంది.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: నా ఆత్మకు, మీ ఆత్మకు
  rationale: రెండవ పదబంధంలో విడిచిపెట్టబడిన ‘ఆత్మ’ను తెలుగులో స్పష్టత కోసం పునరుక్తి చేస్తూ, పౌలు మరియు కొరింథీయులు ఇద్దరూ పొందిన సేదను తెలియజేస్తుంది.
- source_word: ἐπιγινώσκετε
  choice: గుర్తించి ఆదరించండి
  rationale: ఈ సందర్భంలో కేవలం గుర్తుపట్టడం కాకుండా అలాంటి వారికి తగిన గుర్తింపు, విలువ ఇవ్వడం ఉద్దేశం. సంయుక్త పదబంధం ఈ రెండు ఛాయలను అతిశయింపకుండా వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాక్యం ఆధారంగా వచ్చే ఆచరణాత్మక నిర్ధారణను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: τοὺς τοιούτους
  choice: ఇలాంటివారిని
  rationale: ఈ పదబంధం తక్షణ సందర్భంలో ముందుగా ప్రస్తావించిన స్తెఫనా, ఫొర్తునాతు, అకాయికు అనే పురుషులను సూచిస్తుంది; తెలుగు రూపం సహజంగా ఉండి, సూచిత వ్యక్తులను సందర్భమే నిర్దేశించనిస్తుంది.
theological_decisions:
- issue: τοὺς τοιούτους లో లింగ సూచన
  choice: ఇలాంటివారిని
  alternative: ఇలాంటి పురుషులను
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా పుంలింగంలో ఉండి, సందర్భంలో పేరుపెట్టబడిన ముగ్గురు పురుషులను సూచిస్తుంది. అయితే తెలుగులో ‘ఇలాంటి పురుషులను’ అనడం అనవసరంగా భారంగా ఉంటుంది; ‘ఇలాంటివారిని’ సహజంగా ఉండగా నిర్దిష్ట పురుష సూచనను పాదసూచికలో స్పష్టం చేస్తుంది.
- issue: πνεῦμα యొక్క సూచన
  choice: ఆత్మ
  alternative: అంతరంగం
  rationale: ఇక్కడ పరిశుద్ధాత్మ కాకుండా మానవుని అంతరంగ స్థితి ఉద్దేశించబడింది. ‘ఆత్మ’ మూలపదాన్ని, పౌలు భాషలోని భావతీవ్రతను నిలుపుతుంది; దాని సందర్భార్థాన్ని అనువాదం మౌనంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సేదదీర్చారు’ రూపకాలంకార అంతరంగ ఉపశమనాన్ని వ్యక్తం చేస్తుంది. ఆజ్ఞార్థక బహువచనానికి ‘గుర్తించి ఆదరించండి’ వాడబడింది.
