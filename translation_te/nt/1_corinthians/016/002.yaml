review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the weekly, individual instruction, the proportionate character of the setting aside, and the purpose of avoiding collections at Paul's arrival. The final clause, however, says that there will be no need to make collections rather than directly stating that collections should not take place, and it redundantly uses both “then” and “when I come.”
  naturalness: Most of the Telugu is modern and clear. Recasting the purpose clause makes it more idiomatic and removes the redundant temporal phrasing.
  terminology: “సొమ్ము,” “పక్కన పెట్టి కూడబెట్టుకోవాలి,” and “సేకరణలు” are appropriate. “సమృద్ధికి తగిన మేరకు” expresses εὐοδῶται more naturally than “వర్ధిల్లిన మేరకు,” without making the amount more specific than the Greek does.
  issues:
  - severity: low
    issue: The purpose clause is indirect and temporally redundant.
    rationale: “అప్పుడు నేను వచ్చినప్పుడు ... అవసరం ఉండదు” adds an unnecessary double temporal expression and changes λογεῖαι γίνωνται (“collections may occur/be made”) into “there is no need.” A direct purpose expression better follows ἵνα μὴ ... λογεῖαι γίνωνται.
  revised_text: ప్రతి వారం మొదటి రోజున[a], మీలో ప్రతి ఒక్కరూ తమకు కలిగిన సమృద్ధికి తగిన మేరకు[c] కొంత సొమ్మును తమ దగ్గర[b] పక్కన పెట్టి కూడబెట్టుకోవాలి; నేను వచ్చినప్పుడు సేకరణలు జరగకుండా ఉండేందుకు ఇలా చేయాలి.
