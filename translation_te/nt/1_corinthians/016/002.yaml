source:
  edition: SBLGNT
  text: κατὰ μίαν ⸀σαββάτου ἕκαστος ὑμῶν παρ’ ἑαυτῷ τιθέτω θησαυρίζων ὅ τι ⸀ἐὰν εὐοδῶται, ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: te
  text: ప్రతి వారం మొదటి రోజున[a], మీలో ప్రతి ఒక్కరూ తమకు కలిగిన సమృద్ధికి తగిన మేరకు[c] కొంత సొమ్మును తమ దగ్గర[b] పక్కన పెట్టి కూడబెట్టుకోవాలి; నేను వచ్చినప్పుడు సేకరణలు జరగకుండా ఉండేందుకు ఇలా చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారం మొదటి రోజున.’ ఇక్కడి గ్రీకు ప్రయోగం ప్రతి వారం క్రమంగా చేయాల్సిన ఆచరణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తన దగ్గర’ లేదా ‘తన వద్ద.’ ప్రతి ఒక్కరూ సొమ్మును వ్యక్తిగతంగా, బహుశా ఇంటివద్ద, పక్కన పెట్టాలని దీని భావం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘తమకు కలిగిన వర్ధిల్లుదలకు తగినట్లుగా.’ ప్రతి ఒక్కరూ తమకు కలిగిన సమృద్ధికి అనుగుణంగా పక్కన పెట్టాలనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: ప్రతి వారం మొదటి రోజున
  rationale: κατάతో కూడిన ఈ ప్రయోగం పునరావృతమయ్యే వారపు ఆచరణను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా దీనిని ఇలా వ్యక్తం చేయవచ్చు.
- source_word: ἕκαστος ὑμῶν
  choice: మీలో ప్రతి ఒక్కరూ
  rationale: ఆదేశం సమూహంలోని ప్రతివ్యక్తికీ వర్తిస్తుందనే విభజనాత్మక భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: παρ’ ἑαυτῷ
  choice: తమ దగ్గర
  rationale: అక్షరార్థంగా ‘తన వద్ద/తనతో’ అని అర్థం. ఇది వ్యక్తిగతంగా, బహుశా ఇంటివద్ద, సొమ్మును పక్కన పెట్టడాన్ని సూచించవచ్చు; అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: τιθέτω θησαυρίζων
  choice: పక్కన పెట్టి కూడబెట్టుకోవాలి
  rationale: వర్తమాన ఆజ్ఞతో పాటు ఉన్న కృదంతం, క్రమంగా సొమ్మును వేరుగా పెట్టి పోగుచేసే కొనసాగుతున్న చర్యను సూచిస్తుంది.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: తాము వర్ధిల్లిన మేరకు
  rationale: వ్యక్తికి కలిగిన ఆర్థిక వర్ధిల్లుదలకు అనుగుణమైన మొత్తాన్ని సూచించే అనిర్దిష్ట-షరతార్థ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: అప్పుడు నేను వచ్చినప్పుడు విరాళాల సేకరణలు చేయాల్సిన అవసరం ఉండదు
  rationale: పౌలు వచ్చిన సమయంలో హడావిడిగా సేకరణలు జరగకుండా ఉండటమే వారానికొకసారి పక్కన పెట్టడం యొక్క ఉద్దేశమని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: παρ’ ἑαυτῷ సొమ్మును ఎక్కడ ఉంచాలని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘తమ దగ్గర’ అని ఉంచడం
  alternative: ‘ఇంటివద్ద’ లేదా సంఘపు సామూహిక నిధిలో ఉంచడం
  rationale: గ్రీకు పదబంధం వ్యక్తిగతంగా తన వద్ద ఉంచడాన్ని సూచించినా, ఖచ్చితమైన ప్రదేశాన్ని నిర్దేశించదు. అందువల్ల ప్రధాన పాఠం అస్పష్టతను కాపాడుతుంది; ‘ఇంటివద్ద’ అనేది పాదసూచికలో సాధ్యతగా మాత్రమే ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సొమ్ము’ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘వర్ధిల్లిన మేరకు’ εὐοδῶται యొక్క సమృద్ధి/అభివృద్ధి భావాన్ని కాపాడుతుంది. మూలంలోని వ్యక్తిగత నిల్వ స్థలం గురించిన అస్పష్టత పాదసూచికతో సంరక్షించబడింది.
