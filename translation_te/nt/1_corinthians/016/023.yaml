  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/023.yaml
  text: The grace of the Lord Jesus be with you.
translation:
  language: te
  text: ప్రభువైన యేసు కృప మీతో ఉండుగాక.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు ఆశీర్వచనాలలో దేవుని అనుగ్రహాన్ని, దయాపూర్వక మేలును సూచించే స్థిరమైన పదం; ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: కొత్త నిబంధనలోని బిరుదు భావాన్నీ క్రీస్తుకు సంబంధించిన గౌరవాన్నీ నిలుపుతుంది; ‘యజమాని’ కంటే ఈ ఆశీర్వచన సందర్భంలో సహజం.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: μεθ’ ὑμῶν
  choice: మీతో ఉండుగాక
  rationale: గ్రీకులో అక్షరార్థంగా ‘మీతో’ మాత్రమే ఉన్నప్పటికీ, క్రియలేని ఆశీర్వచన వాక్యంలోని ఆకాంక్షార్థాన్ని సహజమైన తెలుగులో ‘ఉండుగాక’ వ్యక్తం చేస్తుంది.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని ‘కృప’తో నిలుపుతూ, κύριος అనే బిరుదును యేసుతో సహజమైన తెలుగులో అనుసంధానిస్తుంది.
theological_decisions:
- issue: స్పష్టమైన క్రియ లేని ఆశీర్వచన సూత్రం
  choice: ‘ఉండుగాక’ అనే ఆకాంక్షార్థక క్రియను సరఫరా చేయడం
  alternative: ‘ప్రభువైన యేసు కృప మీతో.’
  rationale: మూల గ్రీకులో క్రియ లేకపోయినా ఇది ముగింపు ఆశీర్వచనం. ‘ఉండుగాక’ దాని సహజ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: τοῦ κυρίου Ἰησοῦ లోని షష్ఠీ సంబంధం
  choice: ‘ప్రభువైన యేసు కృప’
  alternative: ‘ప్రభువైన యేసు నుండి కృప’
  rationale: మూలంలోని నామవాచక సంబంధాన్ని, దానిలో ఉండగల స్వామ్య/మూల భావ విస్తృతిని కాపాడుతుంది; ‘నుండి’ అని పెట్టి మూలాన్ని మాత్రమే స్పష్టంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ఆశీర్వచన శైలి. ‘ఉండుగాక’ సాధారణ సంభాషణకన్నా కొద్దిగా ఉన్నతమైనదైనా ప్రార్థన/ఆశీర్వచన సందర్భంలో సహజం. పాదటిప్పణులు అవసరం లేదు.
