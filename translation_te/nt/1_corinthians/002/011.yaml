id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: te
  text: ఎందుకంటే, ఒక వ్యక్తికి సంబంధించిన సంగతులు, ఆ వ్యక్తిలోనున్న ఆ వ్యక్తి ఆత్మకు తప్ప, మనుష్యులలో మరెవరికీ తెలుసు? అలాగే, దేవునికి సంబంధించిన సంగతులు దేవుని ఆత్మకు తప్ప మరెవరికీ తెలియవు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: మనుష్యులలో / ఒక వ్యక్తికి
  rationale: ఇక్కడ పురుషులను మాత్రమే కాక మానవులందరినీ సూచించే సాధారణ అర్థం ఉంది. ‘మనుష్యులలో’ మరియు ‘ఒక వ్యక్తికి’ అనే పదాలు ఆ విస్తృత అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తాయి.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: ఒక వ్యక్తికి సంబంధించిన సంగతులు
  rationale: ఈ గ్రీకు పదబంధం కేవలం ఆలోచనలకు మాత్రమే పరిమితం కాకుండా ఆ వ్యక్తికి చెందిన అంతరంగ విషయాలను విస్తృతంగా సూచిస్తుంది. ఈ అనువాదం తరువాతి ‘దేవునికి సంబంధించిన సంగతులు’ అనే సమాంతర నిర్మాణాన్ని కూడా నిలుపుతుంది.
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: ఆ వ్యక్తిలో ఉన్న ఆ వ్యక్తి ఆత్మ
  rationale: ‘ఆ వ్యక్తి ఆత్మ’ అనే స్వామ్య సంబంధాన్నీ, ‘ఆ వ్యక్తిలో ఉన్న’ అనే మూలపాఠంలోని విశేషణాత్మక భాగాన్నీ వ్యాఖ్యానాత్మక విస్తరణ లేకుండా స్పష్టంగా ఉంచుతుంది.
- source_word: οὕτως καὶ
  choice: అలాగే
  rationale: మానవ వ్యక్తి గురించిన మొదటి వాక్యానికి, దేవుని గురించిన రెండవ వాక్యానికి మధ్యనున్న సన్నిహిత పోలికను సహజంగా తెలియజేస్తుంది.
- source_word: ἔγνωκεν
  choice: ఎరిగి ఉండరు
  rationale: గ్రీకు పరిపూర్ణ కాలంలోని గతంలో తెలిసికొని ప్రస్తుతం తెలిసి ఉండే భావాన్ని తెలుగులో ప్రతిబింబిస్తూ, మొదటి వాక్యంలోని సాధారణ వర్తమాన ‘తెలుసు’తో ఉన్న స్వల్ప కాలభేదాన్ని కాపాడుతుంది.
- source_word: τὰ τοῦ θεοῦ
  choice: దేవునికి సంబంధించిన సంగతులు
  rationale: ‘దేవుని ఆలోచనలు’ అని అర్థాన్ని కుదించకుండా మూలంలోని విస్తృత పరిధిని, మొదటి అర్ధవాక్యంతో ఉన్న సమాంతరతను నిలుపుతుంది.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: దేవుని ఆత్మ
  rationale: ఈ సందర్భంలో దేవుని లోతైన సంగతులను తెలిసి వెల్లడించే దేవుని స్వంత ఆత్మను సూచించే పదబంధాన్ని నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: πνεῦμα τοῦ θεοῦ అనేది దేవుని వ్యక్తిగత ఆత్మను సూచిస్తుందా, లేక సాధారణంగా దేవునికి చెందిన ఆత్మను సూచిస్తుందా?
  choice: దేవుని ఆత్మ
  alternative: దేవునికి చెందిన ఆత్మ
  rationale: తక్షణ సందర్భంలో దేవుని లోతైన సంగతులను పరిశోధించి వెల్లడించే దేవుని స్వంత ఆత్మే ఉద్దేశించబడింది. ‘దేవుని ఆత్మ’ అనేది అదనపు సిద్ధాంత వివరాలను చేర్చకుండా ఆ సూచనను సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని మానవ–దైవ సమాంతర నిర్మాణం, οἶδεν మరియు ἔγνωκεν మధ్యనున్న కాలభేదం, అలాగే ‘సంగతులు’ అనే విస్తృత భావం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
