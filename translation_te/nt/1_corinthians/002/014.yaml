revisions:
- from: అయితే సహజసంబంధమైన వ్యక్తి దేవుని ఆత్మకు సంబంధించినవాటిని అంగీకరించడు[a]. అవి అతనికి వెర్రితనంగా అనిపిస్తాయి; అతడు వాటిని తెలుసుకోలేడు, ఎందుకంటే అవి ఆత్మసంబంధంగా విచారించబడతాయి[b].
  to: కాని సహజమైన వ్యక్తి దేవుని ఆత్మకు సంబంధించిన వాటిని[a] అంగీకరించడు; అవి అతనికి మూర్ఖత్వంగా ఉంటాయి. అతడు వాటిని తెలుసుకోలేడు, ఎందుకంటే అవి ఆత్మీయంగా వివేచించబడతాయి[b].
  rationale: The revision uses idiomatic modern Telugu while maintaining the source’s representative ‘person,’ the broad expression ‘the things of the Spirit of God,’ and the contrast between ψυχικός and πνευματικῶς. It avoids making the adverb explicitly instrumental (‘by the Spirit’) and retains the semantic alternatives for ἀνακρίνεται in the footnote. Both footnote anchors are placed directly after the terms they explain.
