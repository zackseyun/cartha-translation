id: 1CO.2.14
reference: 1 Corinthians 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: te
  text: కాని సహజమైన వ్యక్తి దేవుని ఆత్మకు సంబంధించిన వాటిని[a] అంగీకరించడు; అవి అతనికి మూర్ఖత్వంగా ఉంటాయి. అతడు వాటిని తెలుసుకోలేడు, ఎందుకంటే అవి ఆత్మీయంగా వివేచించబడతాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆత్మసంబంధం లేని వ్యక్తి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పరిశీలించబడతాయి” లేదా “మూల్యాంకనం చేయబడతాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: సహజసంబంధమైన
  rationale: ψυχικός ఇక్కడ πνευματικόςకు వ్యతిరేకంగా ఉంది. ‘సహజసంబంధమైన’ అనేది కేవలం మానవ సహజ జీవన పరిధిలో ఉన్న భావాన్ని ఉంచుతుంది; ‘ఆత్మలేని’ అని గ్రీకు పదం కంటే ఎక్కువగా స్పష్టం చేయదు.
- source_word: ἄνθρωπος
  choice: వ్యక్తి
  rationale: వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా, ఇక్కడ భావం పురుషునికే పరిమితం కాక సాధారణ మానవ వ్యక్తిని సూచిస్తుంది.
- source_word: δέχεται
  choice: అంగీకరించడు
  rationale: కేవలం స్వీకరించడం మాత్రమే కాక, వాటిని సత్యమైనవిగా ఒప్పుకోవడం లేదా ఆదరించడం అనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: దేవుని ఆత్మకు సంబంధించినవాటిని
  rationale: ఈ విస్తృత గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో ఉంచి, అవి ఆత్మ నుండి వచ్చేవా లేక ఆత్మకు చెందినవా అనే భావాన్ని అతిగా కుదించదు.
- source_word: μωρία
  choice: వెర్రితనం
  rationale: 1 కొరింథీయులలో దేవుని జ్ఞానానికీ మానవ తీర్పుకూ మధ్య పౌలు చూపే వైరుధ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: γνῶναι
  choice: తెలుసుకోలేడు
  rationale: γινώσκω యొక్క నేరమైన ‘తెలుసుకోవడం’ భావాన్ని కాపాడుతుంది; ఈ సందర్భంలో గ్రహించడం అనే భావం అంతర్భూతంగా ఉన్నప్పటికీ దానిని అనువాదంలోనే నిర్ణయించదు.
- source_word: πνευματικῶς
  choice: ఆత్మసంబంధంగా
  rationale: విచారణ జరిగే విధానాన్ని లేదా పరిధిని సూచించే గ్రీకు క్రియావిశేషణాన్ని నేరుగా ప్రతిబింబిస్తుంది; ‘ఆత్మచేత’ అని కారణాన్ని మరింత స్పష్టీకరించదు.
- source_word: ἀνακρίνεται
  choice: విచారించబడతాయి
  rationale: ἀνακρίνωలోని పరిశీలించడం, మూల్యాంకనం చేయడం, వివేచించడం అనే పరిధిని ‘విచారించు’ నిలుపుతుంది; కర్మణి రూపాన్ని కూడా కాపాడుతుంది.
theological_decisions:
- issue: ψυχικὸς ἄνθρωπος మరియు ఆత్మసంబంధమైన విచారణ మధ్య వైరుధ్యం
  choice: సహజసంబంధమైన వ్యక్తి
  alternative: ఆత్మసంబంధం లేని వ్యక్తి
  rationale: ఎంచుకున్న రూపం సహజ మానవ స్థితికీ ఆత్మసంబంధమైన గ్రహింపుకూ మధ్యనున్న ఉద్రిక్తతను ఉంచుతుంది; ఆ వ్యక్తికి ఆత్మ లేదని మూలపాఠం కంటే స్పష్టంగా ప్రకటించదు.
- issue: πνευματικῶς యొక్క కర్తృత్వం లేదా విధానం
  choice: ఆత్మసంబంధంగా
  alternative: దేవుని ఆత్మచేత
  rationale: గ్రీకు క్రియావిశేషణం విధానం లేదా పరిధిని సూచించగలదు. ‘దేవుని ఆత్మచేత’ అనడం సాధ్యమైన అర్థాన్ని నిర్దిష్ట కర్తృత్వంగా మార్చుతుంది కాబట్టి ప్రధాన పాఠంలో అస్పష్టతను కాపాడాం.
- issue: ἀνακρίνεται యొక్క అర్థ పరిధి
  choice: విచారించబడతాయి
  alternative: వివేచించబడతాయి / పరిశీలించబడతాయి / మూల్యాంకనం చేయబడతాయి
  rationale: ఈ క్రియకు పరిశీలన, మూల్యాంకనం, వివేచన అనే పరస్పర సంబంధిత అర్థాలు ఉన్నాయి. ప్రధాన పాఠం ఒకే వ్యాఖ్యానానికి కుదించకుండా ఉండేలా, ప్రత్యామ్నాయాలను పాదటీకలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూలంలోని δέ వల్ల వచ్చే స్వల్ప వ్యత్యాసాన్ని ‘అయితే’తో చూపించాం. γὰρను సహజ వాక్యప్రవాహంలో ‘ఎందుకంటే’ భావంగా రెండు వాక్యాల సంబంధంలో వ్యక్తం చేశాం. ప్రధాన పాఠంలోని ప్రతి పాదటీక గుర్తు [a], [b] స్పష్టంగా ఉంచబడింది.
