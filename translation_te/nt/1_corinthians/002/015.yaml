source:
  edition: SBLGNT
  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: te
  text: అయితే ఆత్మిక వ్యక్తి[b] అన్నిటినీ అంచనా వేస్తాడు[a]; ఆ వ్యక్తిని మాత్రం ఎవరూ అంచనా వేయరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరిశీలించు,’ ‘వివేచించు,’ లేదా ‘తీర్పు తీర్చు’; ἀνακρίνω అనే క్రియ వచ్చిన రెండు చోట్లకూ ఈ ప్రత్యామ్నాయాలు వర్తిస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆత్మిక వ్యక్తి’ అని అనువదించిన గ్రీకు పదం పుంలింగ ఏకవచన విశేషణం నామవాచకంగా వాడబడిన రూపం; అది దేవుని ఆత్మచేత లక్షణీకరించబడిన వ్యక్తిని సాధారణంగా సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: πνευματικὸς
  choice: ఆత్మిక వ్యక్తి
  rationale: ఈ విశేషణం నామవాచకంగా వాడబడి, దేవుని ఆత్మచేత లక్షణీకరించబడిన వ్యక్తిని సూచిస్తుంది. ‘వ్యక్తి’ అనే పదం గ్రీకు పుంలింగ రూపాన్ని కేవలం పురుషునికే పరిమితం చేయకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: అంచనా వేస్తాడు / అంచనా వేయరు
  rationale: ఇక్కడ క్రియ జాగ్రత్తగా పరిశీలించి విలువ కట్టడం లేదా వివేచించడం అనే భావాన్ని ఇస్తుంది. రెండు చోట్లా ఒకే తెలుగు వ్యక్తీకరణను వాడడం ద్వారా గ్రీకులోని పదపునరుక్తి నిలుపబడింది.
- source_word: τὰ πάντα
  choice: అన్నిటినీ
  rationale: గ్రీకు పదబంధంలోని సమగ్రతను ఎలాంటి వివరణాత్మక పరిమితి చేర్చకుండా నేరుగా నిలుపుతుంది.
- source_word: αὐτὸς
  choice: ఆ వ్యక్తిని మాత్రం
  rationale: తెలుగు వాక్య నిర్మాణంలో కర్మ రూపం అవసరమైనందున ఇలా ఇచ్చి, ‘మాత్రం’ ద్వారా గ్రీకులోని నొక్కిచెప్పే భావాన్ని నిలిపాం.
- source_word: ὑπ’ οὐδενὸς
  choice: ఎవరూ
  rationale: కర్తరిలో వ్యక్తమయ్యే తెలుగు నిషేధ వాక్య నిర్మాణంలో ఇది సహజంగా ఉండి, ‘ఏ ఒక్కరిచేతనూ కాదు’ అనే సంపూర్ణ నిరాకరణను కాపాడుతుంది.
theological_decisions:
- issue: ఆత్మిక వ్యక్తి గురించిన పౌలు వాక్యపు పరిధి
  choice: ‘అన్నిటినీ,’ ‘ఎవరూ’ అనే ఎలాంటి పరిమితి లేని పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో అలాగే ఉంచడం
  alternative: ప్రధాన పాఠ్యంలోనే దీనిని ఆత్మసంబంధమైన విషయాలకు మాత్రమే పరిమితం చేయడం
  rationale: వచనం స్వయంగా ఈ మాటను పరిమితి లేకుండా చెబుతుంది; దాని తక్షణ సందర్భం వ్యాఖ్యాన పరిధిని అందిస్తుంది. ప్రధాన పాఠ్యంలో పరిమితిని చేరిస్తే గ్రీకు పాఠ్యంలో ఉన్న ఉద్వేగాన్ని అనవసరంగా పరిష్కరించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలిని అనుసరించాం. ‘ఆత్మిక వ్యక్తి’ అనే రూపం లింగపరంగా అనవసరమైన పరిమితిని నివారిస్తుంది. ‘అంచనా వేయడం’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండటంతో పాటు గ్రీకు క్రియలోని పరిశీలనాత్మక మూల్యాంకన భావాన్ని ఇస్తుంది.
