lexical_decisions:
- source_word: ἔκρινά
  choice: నిర్ణయించుకున్నాను
  rationale: ఇక్కడ κρίνω న్యాయతీర్పును కాక, పౌలు ఉద్దేశపూర్వకంగా చేసుకున్న స్థిర నిర్ణయాన్ని సూచిస్తుంది.
- source_word: τι εἰδέναι
  choice: మరేదీ ఎరుగకూడదని
  rationale: οὐ ... εἰ μὴ నిర్మాణంతో కలిసి ఇది ‘పేర్కొన్నది తప్ప మరేదీ ఎరుగకూడదు’ అనే పరిమితార్థాన్ని ఇస్తుంది; ‘ఎరుగుట’ సందర్భంలోని లోతైన పరిచయం, ప్రకటనకేంద్రిత భావాన్ని నిలుపుతుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: కొరింథీయుల మధ్య పౌలు ఉన్న మరియు పరిచర్య చేసిన సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: గ్రీకు exceptive construction‌ను తెలుగులో సంక్షిప్తంగా, స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: Ἰησοῦν Χριστόν
  choice: యేసు మెస్సీయను
  rationale: Χριστός ఇక్కడ యేసు యొక్క మెస్సీయ సంబంధమైన హోదాను ముందుకు తెస్తున్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
- source_word: καὶ τοῦτον ἐσταυρωμένον
  choice: అదీ సిలువ వేయబడిన ఆయనను
  rationale: τοῦτον ఇచ్చే ప్రత్యేక ఉద్ఘాటనను ‘అదీ’ నిలుపుతుంది; perfect passive participle యేసును సిలువ వేయబడినవానిగా కేంద్రీకరిస్తుంది.
theological_decisions:
- issue: Χριστός పదాన్ని బిరుదుగా లేదా సంప్రదాయ నామరూపంగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాక్యంలో యేసు యొక్క మెస్సీయ గుర్తింపును, సిలువ మరణాన్ని పౌలు తన ప్రకటనకు కేంద్రంగా ఉంచుతున్నాడు. అందువల్ల బిరుదు భావాన్ని స్పష్టంచేసే ‘మెస్సీయ’ ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయ ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అదీ’ అనే రూపం గ్రీకులోని emphatic τοῦτον భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా అందిస్తుంది; డాష్‌లు మూలంలోని కుదించిన ఉద్ఘాటనను చూపిస్తాయి.
