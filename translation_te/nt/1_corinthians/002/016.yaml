id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: te
  text: ఎందుకంటే, “ప్రభువు[b] మనస్సును తెలిసి ఆయనకు ఉపదేశించగలవాడు ఎవరు?” కానీ మనకు మెస్సీయ[a] మనస్సు ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు మనస్సు.”
    reason: lexical_alternative
  - marker: b
    text: పౌలు యెషయా 40:13ను ప్రతిధ్వనింపజేస్తున్నాడు.
    reason: cross_reference
lexical_decisions:
- source_word: τίς γὰρ
  choice: ఎందుకంటే ... ఎవరు?
  rationale: γὰρ ముందటి వాదనతో వివరణాత్మక సంబంధాన్ని చూపుతుంది; τίς అలంకారప్రశ్నను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἔγνω νοῦν κυρίου
  choice: ప్రభువు మనసును తెలుసుకొని
  rationale: νοῦς‌లోని ఆలోచన, అవగాహన, దృక్పథం అనే విస్తృత భావాన్ని ‘మనసు’ సహజంగా నిలుపుతుంది; ἔγνωను ఈ అలంకారప్రశ్నలో సంపూర్ణంగా తెలుసుకోవడం అనే భావంతో అందిస్తుంది.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: ఆయనకు ఉపదేశించగలవాడు
  rationale: గ్రీకు సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజంగా ముందటి క్రియతో కలిపి, ప్రభువును నిర్దేశించగల అర్హత ఎవరికీ లేదనే ప్రశ్నార్థక భావాన్ని నిలుపుతుంది.
- source_word: ἡμεῖς δὲ
  choice: అయితే మనకు
  rationale: δὲ సూచించే బలమైన వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; ἡμεῖςకు తగిన సమూహార్థాన్ని ‘మనకు’ ఇస్తుంది.
- source_word: νοῦν Χριστοῦ ἔχομεν
  choice: మనకు మెస్సీయ మనసు ఉంది
  rationale: ἔχομενను సహజ తెలుగు స్వామ్య నిర్మాణంతో అనువదించింది. Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉండటంతో ‘మెస్సీయ’ను ఉపయోగించింది.
theological_decisions:
- issue: νοῦν Χριστοῦలో Χριστοῦ అనువాదం
  choice: మెస్సీయ మనసు
  alternative: క్రీస్తు మనసు
  rationale: Χριστόςను ఇక్కడ అభిషిక్తుడనే బిరుదుగా చదవవచ్చు; అందువల్ల ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని స్పష్టంగా ఉంచుతుంది. సాంప్రదాయక ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇచ్చి భావసాధ్యతను దాచలేదు.
- issue: ὃς συμβιβάσει αὐτόν యొక్క భావం
  choice: ఆయనకు ఉపదేశించగలవాడు
  alternative: ఆయనకు ఉపదేశించేవాడు
  rationale: ఇది ప్రభువుకు బోధించడానికి లేదా దిశానిర్దేశం చేయడానికి ఎవరు అర్హులు అనే అలంకారప్రశ్న. ‘గలవాడు’ ఆ అర్హత/సామర్థ్య భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. గ్రీకు సంబంధవాచక నిర్మాణాన్ని పదేపదే అనుకరించకుండా సహజ తెలుగు అలంకారప్రశ్నగా మలిచింది; అయినా దాని తార్కిక సంబంధం మరియు దేవునికి ఉపదేశించగల మనిషి ఎవరూ లేరనే ఉద్వేగం నిలుపబడింది.
