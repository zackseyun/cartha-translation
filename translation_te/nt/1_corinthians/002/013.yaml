id: 1CO.2.13
reference: 1 Corinthians 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: te
  text: ఈ సంగతులను కూడా మేము చెబుతున్నాం—మానవ జ్ఞానం నేర్పిన మాటలతో కాదు, పరిశుద్ధాత్మ నేర్పిన మాటలతో; ఆత్మసంబంధమైన సంగతులను ఆత్మసంబంధమైన మాటలతో వివరిస్తున్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆత్మసంబంధమైన సంగతులను ఆత్మసంబంధమైనవారికి వివరిస్తున్నాం.” గ్రీకు పదబంధంలో “ఆత్మసంబంధమైన” అనే పదాన్ని పుంలింగంగా (‘ఆత్మసంబంధమైనవారికి’) లేదా నపుంసకంగా, సూచిత ‘మాటలతో’ అనే అర్థంలో గ్రహించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: వాటినే
  rationale: ముందటి వచనాల్లో ప్రస్తావించిన దేవుడు బయలుపరచిన సంగతులను తిరిగి సూచిస్తుంది; καίతో కలిసి ఉన్న బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: λαλοῦμεν
  choice: మేము మాట్లాడుతున్నాం
  rationale: λαλέωలోని పలకడం/బోధించడం అనే మౌఖిక భావాన్ని నిలుపుతూ, తరువాత వచ్చే ‘మాటలు’ అనే వ్యత్యాసానికి సరిపోతుంది.
- source_word: διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: మానవ జ్ఞానం నేర్పిన మాటలతో
  rationale: ἐν యొక్క సాధనార్థాన్ని తెలుగులో సహజమైన ‘తో’ ద్వారా వ్యక్తం చేసి, ఆ మాటల బోధనా మూలం మానవ జ్ఞానమని స్పష్టం చేస్తుంది.
- source_word: διδακτοῖς πνεύματος
  choice: ఆత్మ నేర్పిన మాటలతో
  rationale: ముందున్న λόγοις‌ను సహజంగా పునరుద్ధరిస్తుంది. సమీప సందర్భంలో πνεῦμα దేవుని పరిశుద్ధాత్మను సూచిస్తుంది.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: ఆత్మసంబంధమైన సంగతులను ఆత్మసంబంధమైన మాటలతో వివరిస్తున్నాం
  rationale: మాటల స్వభావంపై ఉన్న తక్షణ వ్యత్యాసానికి అనుగుణంగా πνευματικοῖς‌ను నపుంసక దత్తివాచకంగా, సూచిత ‘మాటలతో’ అనే భావంలో తీసుకుంది. συγκρίνωకు సందర్భానుకూలంగా ‘వివరించడం/వ్యక్తపరచడం’ అనే భావాన్ని ఇస్తుంది; వాక్యంలోని నిజమైన సందిగ్ధతను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: πνεύματος యొక్క సూచ్యార్థం
  choice: పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: సాధారణంగా ఒక ఆత్మసంబంధ మూలం
  rationale: 1 కొరింథీయులు 2 యొక్క సమీప సందర్భంలో దేవుని ఆత్మ మానవ జ్ఞానానికి వ్యతిరేకంగా స్పష్టంగా ప్రస్తావించబడుతున్నాడు.
- issue: πνευματικοῖς యొక్క వ్యాకరణ లింగం మరియు సూచ్యార్థం
  choice: 'నపుంసకంగా: సూచిత ‘ఆత్మసంబంధమైన మాటలతో’'
  alternative: 'పుంలింగంగా: ‘ఆత్మసంబంధమైనవారికి’'
  rationale: ముందున్న ‘మాటలతో’ అనే వ్యత్యాసం ప్రధాన పఠనానికి బలం ఇస్తుంది; అయితే రూపం పుంలింగంగానూ నపుంసకంగానూ ఉండగలదు కాబట్టి ప్రత్యామ్నాయాన్ని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘ఆత్మ’ను పెద్ద అక్షరంతో వేరు చేయడం తెలుగులో సాధ్యం కానందున సందర్భమే పరిశుద్ధాత్మ సూచనను స్పష్టం చేస్తుంది. గ్రీకు చివరి పదబంధంలోని వ్యాకరణ సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
