id: 1CO.2.12
reference: 1 Corinthians 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: te
  text: 'కానీ మనం లోకపు ఆత్మను పొందలేదు; దేవుని నుండి వచ్చిన ఆత్మను పొందాము, తద్వారా దేవుడు మనకు అనుగ్రహించిన వాటిని[b] తెలుసుకోవడానికి[a].


    [a] లేదా, “గ్రహించడానికి.”


    [b] లేదా, “దేవుడు మనకు కృపగా ఇచ్చిన వాటిని” లేదా “దేవుడు మనకు బహుమానంగా ఇచ్చిన వాటిని.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గ్రహించడానికి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుడు మనకు కృపగా ఇచ్చిన వాటిని” లేదా “దేవుడు మనకు బహుమానంగా ఇచ్చిన వాటిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: మొదటి ప్రయోగం లోకాన్ని నడిపించే ప్రభావాన్ని, రెండవది దేవుని నుండి వచ్చిన ఆత్మను సూచిస్తుంది. తెలుగులో పెద్ద అక్షరాల భేదం లేనందున రెండింటికీ సహజమైన ‘ఆత్మ’ అనే పదాన్నే వాడి, సందర్భమే భేదాన్ని తెలియజేసేలా ఉంచాం.
- source_word: κόσμου
  choice: లోకపు
  rationale: దేవునికి విరుద్ధంగా ఉన్న ప్రస్తుత మానవ వ్యవస్థను సూచించే సాధారణమైన, స్పష్టమైన అనువాదం.
- source_word: ἐλάβομεν
  choice: పొందాం
  rationale: గతంలో పొందిన కార్యం ప్రస్తుత వాదనకు సంబంధించినదిగా ఉండే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: దేవుని నుండి వచ్చిన
  rationale: ἐκ సూచించే మూలాన్ని స్పష్టంగా ఉంచుతూ తెలుగులో సహజంగా పలికే రూపం.
- source_word: ἵνα εἰδῶμεν
  choice: తెలుసుకోవడానికి
  rationale: ఉద్దేశాన్ని తెలిపే ἵνα ఉపవాక్యాన్ని స్పష్టంగా నిలుపుతూ οἶδα యొక్క జ్ఞానార్థాన్ని కాపాడుతుంది; ‘గ్రహించడానికి’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చాం.
- source_word: χαρισθέντα
  choice: అనుగ్రహించినవాటిని
  rationale: χαρίζομαι లోని కృపతో, వరంగా ఇవ్వడం అనే భావాన్ని కేవలం ‘ఇచ్చిన’ కంటే మెరుగ్గా వ్యక్తం చేస్తుంది.
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: దేవుడు మనకు అనుగ్రహించినవాటిని
  rationale: నపుంసక బహువచనంలోని విస్తృత పరిధిని నిలుపుతుంది; దీనిని నిర్దిష్ట ఆత్మీయ వరాలకు మాత్రమే పరిమితం చేయదు.
theological_decisions:
- issue: πνεῦμα τὸ ἐκ τοῦ θεοῦ ప్రత్యేకంగా పరిశుద్ధాత్మను సూచిస్తుందా?
  choice: ‘దేవుని నుండి వచ్చిన ఆత్మ’ అని అనువదించడం
  alternative: ‘దేవుని నుండి వచ్చిన శక్తి/మనోభావం’ అని భావానువాదం చేయడం
  rationale: సమీప సందర్భంలో ఇది విశ్వాసులకు దేవుడు ఇచ్చిన పరిశుద్ధాత్మను సహజంగా సూచిస్తుంది. అయినా మూలంలోని పదబంధాన్ని అలాగే ఉంచి, అనువాదంలో వివరణాత్మక పదాలను చేర్చి భావాన్ని అతిగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని ప్రధాన వ్యతిరేకతను నిలుపుతూ, ఉద్దేశ ఉపవాక్యం తెలుగులో ఏ క్రియకు సంబంధించిందో స్పష్టంగా ఉండేలా పదక్రమాన్ని స్వల్పంగా మార్చాం. ‘అనుగ్రహించినవాటిని’ అనే రూపం కృపతో ఇవ్వబడినదనే భావాన్ని సహజంగా అందిస్తుంది.
