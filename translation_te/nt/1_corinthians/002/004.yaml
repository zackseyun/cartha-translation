revisions:
- from: నా మాటా, నా ప్రకటన కూడా ఒప్పించే జ్ఞానంతో[b] కాక, ఆత్మ[a] మరియు శక్తి నిరూపణతో ఉన్నాయి.
  to: నా ప్రసంగమూ నా ప్రకటనయూ ఒప్పించే జ్ఞానంతో[b] కాకుండా, దేవుని ఆత్మ[a] మరియు శక్తి యొక్క నిరూపణతో ఉండేవి.
  rationale: The revision corrects the source verb’s past imperfect sense, improves modern Telugu coordination, and makes the selected Spirit reading explicit while preserving the lexical alternative in a concise footnote. It retains the source’s parallel contrast and does not add a denominational identification.
