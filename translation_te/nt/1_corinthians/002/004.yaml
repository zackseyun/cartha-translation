id: 1CO.2.4
reference: 1 Corinthians 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: te
  text: నా ప్రసంగమూ నా ప్రకటనయూ ఒప్పించే జ్ఞానంతో[b] కాకుండా, దేవుని ఆత్మ[a] మరియు శక్తి యొక్క నిరూపణతో ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆత్మ.”
    reason: πνεύματος ను సందర్భానుసారంగా దేవుని ఆత్మగా అనువదించాం; అయితే పదం సాధారణంగా “ఆత్మ” అనే అర్థాన్నీ కలిగి ఉండవచ్చు.
  - marker: b
    text: లేదా, “జ్ఞానంతో కూడిన ఒప్పించే మాటలతో.”
    reason: πειθοῖ σοφίας అనే సంక్షిప్త పదబంధాన్ని ‘జ్ఞానవంతమైన ఒప్పించే మాటలు’ అనే భావంతో కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: λόγος
  choice: మాట
  rationale: ఇక్కడ పౌలు తాను మాట్లాడిన విధానాన్ని సూచిస్తున్నాడు. ‘మాట’ సహజమైన తెలుగు పదం; ఇది κήρυγμα నుండి భేదాన్ని కూడా నిలుపుతుంది.
- source_word: κήρυγμα
  choice: ప్రకటన
  rationale: బహిరంగంగా ప్రకటించే సందేశం అనే భావాన్ని ‘ప్రకటన’ తెలియజేస్తుంది; λόγος కు వాడిన ‘మాట’తో దీనిని కలిపివేయదు.
- source_word: πειθοῖ σοφίας
  choice: ఒప్పించే జ్ఞానంతో
  rationale: గ్రీకు పాఠంలో ‘వాక్కులు’ అనే నామవాచకం స్పష్టంగా లేదు. అందువల్ల దానిని ప్రధాన పాఠంలో చేర్చకుండా, ప్రభావితం చేసి ఒప్పించే జ్ఞానం అనే భావాన్ని నిలిపాం.
- source_word: ἀποδείξει
  choice: నిరూపణతో
  rationale: కేవలం వాగ్ధాటి ద్వారా ఒప్పించడానికి విరుద్ధంగా, స్పష్టంగా చూపించడం లేదా రుజువు చేయడం అనే భావాన్ని ‘నిరూపణ’ అందిస్తుంది.
- source_word: πνεύματος
  choice: ఆత్మ
  rationale: సమీప సందర్భంలో ఇది దేవుని ఆత్మను సూచించే అవకాశం బలంగా ఉంది. తెలుగులో ప్రత్యేక నామార్థాన్ని అక్షరరూపంతో చూపడం సాధ్యం కానందున, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: δυνάμεως
  choice: శక్తి
  rationale: దైవిక సామర్థ్యం లేదా ప్రభావాన్ని స్పష్టంగా, సహజంగా తెలియజేసే సాధారణ తెలుగు పదం.
theological_decisions:
- issue: πνεύματος అనేది దేవుని ఆత్మను సూచిస్తుందా, లేక ఆత్మ/ఆత్మిక స్వభావాన్ని సూచిస్తుందా?
  choice: దేవుని ఆత్మ అనే భావం ప్రధాన పాఠంలో
  alternative: ఆత్మ లేదా ఆత్మిక స్వభావం
  rationale: 1 కొరింథీయులు 2 అధ్యాయం విస్తృత సందర్భం దేవుని ఆత్మ కార్యాన్ని ముందుకు తెస్తుంది. అయినా గ్రీకు రూపం స్వయంగా ఈ అర్థాన్ని పూర్తిగా నిర్బంధించదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. λόγος మరియు κήρυγμα మధ్య తేడాను ‘మాట’, ‘ప్రకటన’గా నిలిపాం. మూలంలోని రెండు ἐν పదబంధాల సమాంతర విరుద్ధతను రెండుసార్లు ‘తో’ వాడి ప్రతిబింబించాం.
