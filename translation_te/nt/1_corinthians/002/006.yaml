    issue: The phrase ‘అంతరించిపోతున్న[b] ఈ యుగపు పాలకుల[c]’ grammatically presents the age as perishing.
    rationale: τῶν καταργουμένων is a genitive plural participle agreeing with τῶν ἀρχόντων (‘rulers’), not with τοῦ αἰῶνος (‘age’), which is genitive singular. The main text must make the rulers, rather than the age, the ones being brought to nothing.
