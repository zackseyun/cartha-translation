- from: అయితే, పరిణతి చెందినవారి[a] మధ్య మేము జ్ఞానాన్ని పలుకుతున్నాం. కానీ అది ఈ యుగానికి చెందిన జ్ఞానం కాదు; అంతరించిపోతున్న[b] ఈ యుగపు పాలకుల[c] జ్ఞానమూ కాదు.
  to: అయితే, పరిణతి చెందినవారి[a] మధ్య మేము జ్ఞానాన్ని పలుకుతున్నాం. కానీ అది ఈ యుగానికి చెందిన జ్ఞానం కాదు; ఈ యుగపు పాలకుల[c] జ్ఞానమూ కాదు; వారు అంతరించిపోతున్నారు[b].
  rationale: The final clause is recast as an independent Telugu clause, ‘వారు అంతరించిపోతున్నారు,’ so that its plural subject unambiguously refers to ‘పాలకులు.’ This restores the Greek agreement and preserves the ongoing force of καταργουμένων. The footnote marker b is moved with that clause; marker c remains directly attached to ‘పాలకులు.’
