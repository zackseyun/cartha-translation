id: 1CO.2.6
reference: 1 Corinthians 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: te
  text: అయితే, పరిణతి చెందినవారి[a] మధ్య మేము జ్ఞానాన్ని పలుకుతున్నాం. కానీ అది ఈ యుగానికి చెందిన జ్ఞానం కాదు; ఈ యుగపు పాలకుల[c] జ్ఞానమూ కాదు; వారు అంతరించిపోతున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిపూర్ణుల మధ్య”; ఇక్కడ బహుశా ఆధ్యాత్మికంగా పరిణతి చెందినవారు ఉద్దేశించబడ్డారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “గతించిపోతున్నారు,” “నిర్మూలించబడుతున్నారు,” లేదా “నిర్వీర్యం చేయబడుతున్నారు.”
    reason: lexical_alternative
  - marker: c
    text: “ఈ యుగపు పాలకులు” అనేది మానవ అధికారులను, ఆత్మసంబంధ అధికార శక్తులను, లేదా రెండింటినీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Σοφίαν
  choice: జ్ఞానం
  rationale: σοφίαకు సహజమైన ప్రామాణిక తెలుగు పదం. మూలంలోని పునరుక్తిని భావపరంగా నిలుపుతూ రెండో ప్రస్తావనను కూడా ‘జ్ఞానం’గానే వ్యక్తం చేశాం.
- source_word: δὲ
  choice: అయితే / కానీ
  rationale: సందర్భంలోని వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది. వాక్య నిర్మాణం స్పష్టంగా ఉండేందుకు మొదటి δὲకు ‘అయితే’, రెండవదానికి ‘కానీ’ వాడాం.
- source_word: λαλοῦμεν
  choice: మేము ... పలుకుతున్నాం
  rationale: λαλέω యొక్క ప్రాథమిక అర్థమైన ‘మాట్లాడు/పలుకు’ను నిలుపుతుంది; ‘ప్రకటిస్తున్నాం’ అని బలపరచదు.
- source_word: ἐν τοῖς τελείοις
  choice: పరిణతి చెందినవారి మధ్య
  rationale: τέλειοι ఇక్కడ పాపరహిత పరిపూర్ణతకన్నా ఎదిగిన లేదా పరిపక్వ స్థితిని సూచించే అవకాశం ఎక్కువ. ἐν అనే ప్రయోగానికి సందర్భానుసారంగా ‘మధ్య’ సహజం.
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: ఈ యుగానికి చెందిన ... కాదు
  rationale: αἰώνను κόσμοςతో కలపకుండా దాని కాల-వ్యవస్థ భావాన్ని ‘యుగం’ ద్వారా నిలుపుతుంది.
- source_word: ἀρχόντων
  choice: పాలకులు
  rationale: మానవ అధికారులనో ఆత్మసంబంధ శక్తులనో లేదా రెండింటినో సూచించగల విస్తృతతను ఉంచే ప్రత్యక్ష పదం.
- source_word: τῶν καταργουμένων
  choice: అంతరించిపోతున్న
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న ప్రక్రియను సహజమైన తెలుగులో చూపుతుంది; నిర్మూలించబడటం, నిర్వీర్యం కావటం, గతించిపోవటం వంటి అర్థ ఛాయలను పూర్తిగా ఒకే విధంగా నిర్బంధించదు.
theological_decisions:
- issue: ‘ఈ యుగపు పాలకులు’ ఎవరిని సూచిస్తారు?
  choice: ‘పాలకులు’ అని విస్తృతంగానే అనువదించడం
  alternative: మానవ రాజకీయ/మత నాయకులు; ఆత్మసంబంధ అధికార శక్తులు; లేదా రెండూ
  rationale: గ్రీకు పదబంధం ఒక్క నిర్దిష్ట సూచనను తప్పనిసరి చేయదు. అందువల్ల వివాదాస్పదమైన దైవశాస్త్ర నిర్ణయాన్ని ప్రధాన పాఠ్యంలో రుద్దకుండా అస్పష్టతను నిలిపాం.
- issue: τέλειοι యొక్క భావం
  choice: ‘పరిణతి చెందినవారు’
  alternative: ‘పరిపూర్ణులు’
  rationale: సందర్భంలో ఆధ్యాత్మిక పరిపక్వత భావం సహజంగా ఉన్నప్పటికీ, ‘పరిపూర్ణులు’ అనే పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి మూలపదపు అర్థ విస్తృతిని సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండు వ్యతిరేక సంధులను సహజమైన తెలుగు వాక్య విభజనతో వ్యక్తం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
