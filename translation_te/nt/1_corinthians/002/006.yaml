  source_fidelity: The draft correctly renders the repeated σοφίαν as ‘జ్ఞానం,’ preserves αἰών as ‘యుగం,’ and leaves ἀρχόντων appropriately broad as ‘పాలకులు.’ However, the present participle τῶν καταργουμένων modifies ‘the rulers,’ not ‘this age.’ In the current Telugu word order, ‘అంతరించిపోతున్న’ instead qualifies ‘ఈ యుగం,’ changing the Greek syntactic relation.
  naturalness: The Telugu is modern, clear, and appropriately restrained. A small restructuring makes the participial clause unambiguously refer to the rulers while retaining natural Telugu flow.
  terminology: ‘పరిణతి చెందినవారు,’ ‘జ్ఞానం,’ ‘యుగం,’ and ‘పాలకులు’ are suitable standard Telugu choices. The footnotes preserve the lexical and referential alternatives without imposing an interpretation.
