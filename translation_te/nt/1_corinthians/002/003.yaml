    reason: ἐγενόμην πρὸς ὑμᾶς అనే గ్రీకు పదబంధం వారి మధ్య ఉండడాన్ని లేదా వారి దగ్గరకు రావడాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: κἀγώ
  choice: నేను
  rationale: καί యొక్క అనుసంధాన భావం తెలుగు వాక్యప్రవాహంలో సహజంగా అంతర్లీనంగా ఉంటుంది; ἐγώను స్పష్టంగా ఉంచుతూ అవసరం లేని ప్రత్యేక ఉద్ఘాటనను జోడించలేదు.
- source_word: ἐν ἀσθενείᾳ
  choice: బలహీనతతో
  rationale: ἀσθένεια శారీరక, వ్యక్తిగత లేదా పరిస్థితిగత బలహీనతను సూచించగల విస్తృత పదం; దాని అర్థపరిధిని సంకుచితం చేయకుండా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἐν φόβῳ
  choice: భయంతో
  rationale: φόβοςను ‘భక్తి’ లేదా ‘జాగ్రత్త’గా మృదువుపరచకుండా, పౌలు పేర్కొన్న భయస్థితిని నేరుగా నిలుపుతుంది.
- source_word: ἐν τρόμῳ πολλῷ
  choice: ఎంతో వణుకుతో
  rationale: τρόμος యొక్క ‘వణుకు’ భావాన్ని, πολλῷ ఇచ్చే తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: మీ మధ్య ఉన్నాను
  rationale: కొరింథీయుల సమక్షంలో పౌలు ఉన్న స్థితిని సహజంగా తెలియజేస్తుంది; ‘మీ దగ్గరకు వచ్చాను’ అనే ఆగమనార్థం కూడా సాధ్యమైనందున దానిని పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘బలహీనత’, ‘భయం’, ‘వణుకు’ అనే మూడు అంశాల సమాంతర క్రమాన్ని నిలిపి, మూలంలోని తీవ్రతను మృదువుపరచలేదు.
