id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: te
  text: ఎందుకంటే దేవుడు వాటిని మనకు ఆత్మ ద్వారా బయలుపరిచాడు[a]. ఆ ఆత్మ అన్నిటినీ, దేవుని లోతులను సైతం పరిశోధిస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘వాటిని’ అనే ప్రత్యక్ష కర్మ వ్యక్తంగా లేదు; అది ముందరి సందర్భం నుండి అర్థమవుతుంది. ‘ఈ సంగతులను’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘దేవుని లోతైన సంగతులను సైతం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκάλυψεν
  choice: బయలుపరిచాడు
  rationale: గ్రీకు ఏయోరిస్ట్ క్రియను సహజమైన తెలుగు భూతకాలంతో అనువదించాం; దేవుడు దాచబడినదాన్ని వెల్లడించాడనే భావాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡμῖν
  choice: మనకు
  rationale: ఈ దత్తి విభక్తి ప్రకటనను పొందినవారిని సూచిస్తుంది; తెలుగులో పరోక్ష కర్మగా ‘మనకు’ సహజంగా ఉంది.
- source_word: '[implicit object of ἀπεκάλυψεν]'
  choice: వాటిని
  rationale: గ్రీకులో ప్రత్యక్ష కర్మ వ్యక్తంగా లేదు; ముందరి సందర్భంలో చెప్పిన సంగతులను సూచించేలా ‘వాటిని’ చేర్చాం, కానీ దాని సూచనను మరీ నిర్దిష్టం చేయలేదు.
- source_word: διὰ τοῦ πνεύματος
  choice: ఆత్మ ద్వారా
  rationale: జెనిటివ్‌తో వచ్చిన διά సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది; ‘ద్వారా’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: దైవిక ప్రకటనను కలిగించి దేవుని లోతులను తెలిసికొనే వ్యక్తిగా సందర్భం పరిశుద్ధాత్మను సూచిస్తుంది.
- source_word: ἐραυνᾷ
  choice: పరిశోధిస్తాడు
  rationale: క్రియలోని చురుకైన, లోతుగా వెదికే భావాన్ని ‘పరిశోధిస్తాడు’ తెలియజేస్తుంది; ఇది కేవలం తెలియక వెదకడాన్ని తప్పనిసరిగా సూచించదు.
- source_word: πάντα
  choice: అన్నిటినీ
  rationale: మూలంలోని విస్తృత పరిధిని సంక్షిప్తంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: καὶ
  choice: సైతం
  rationale: 'ఇక్కడ καί శిఖరస్థాయి ఉద్ఘాటనగా పనిచేస్తుంది: ఆత్మ అన్నిటినే కాక దేవుని లోతులను కూడా పరిశోధిస్తాడు.'
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: దేవుని లోతులు
  rationale: ‘లోతులు’ అనే మూల రూపకాన్ని వివరణతో తొలగించకుండా యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: πνεῦμα పరిశుద్ధాత్మను సూచిస్తుందా, సాధారణ మానవ ఆత్మను సూచిస్తుందా?
  choice: రెండు సందర్భాల్లోనూ పరిశుద్ధాత్మ
  alternative: సాధారణ అర్థంలో మానవ ఆత్మ
  rationale: ఆత్మ ద్వారా దేవుడు బయలుపరచడం, ఆ ఆత్మ దేవుని లోతులను పరిశోధించడం అనే సమీప సందర్భం పరిశుద్ధాత్మనే బలంగా సూచిస్తుంది.
- issue: ‘పరిశోధిస్తాడు’ అనే మాట ఆత్మకు ముందుగా తెలియదనే భావాన్ని కలిగిస్తుందా?
  choice: మూలంలోని ἐραυνᾷ క్రియను ‘పరిశోధిస్తాడు’గా నిలుపడం
  alternative: ‘పూర్తిగా ఎరిగి ఉంటాడు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: మూలపాఠం జ్ఞానం ఎలా లభించిందనే తాత్త్విక వివరణ ఇవ్వకుండా చురుకైన పరిశోధన భాషను వాడుతుంది; ఆ ఉద్రిక్తతను అనువాదంలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యంలోని గంభీరతను మరియు ‘లోతులు’ అనే రూపకాన్ని నిలుపుతూ అనువదించాం. పరిశుద్ధాత్మ వ్యక్తిత్వాన్ని సందర్భానుసారంగా చూపేందుకు ‘పరిశోధిస్తాడు’ అనే వ్యక్తివాచక క్రియారూపం వాడాం.
