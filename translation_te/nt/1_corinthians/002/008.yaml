revisions:
- from: దానిని ఈ యుగపు పాలకుల్లో ఎవ్వరూ తెలుసుకోలేదు.[a] ఎందుకంటే వారు దానిని తెలుసుకొని ఉంటే, మహిమకు ప్రభువును సిలువ వేసేవారు కాదు.
  to: దానిని ఈ యుగపు పాలకుల్లో ఎవ్వరూ[a] తెలుసుకోలేదు; ఎందుకంటే వారు దానిని తెలుసుకుని ఉండి ఉంటే, మహిమగల ప్రభువును సిలువ వేయకపోయేవారు.
