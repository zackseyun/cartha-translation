id: 1CO.2.8
reference: 1 Corinthians 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: te
  text: దానిని ఈ యుగపు పాలకుల్లో ఎవ్వరూ[a] తెలుసుకోలేదు; ఎందుకంటే వారు దానిని తెలుసుకుని ఉండి ఉంటే, మహిమగల ప్రభువును సిలువ వేయకపోయేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఈ యుగపు పాలకులు” అనే మాట మానవ అధికారులను, ఆధ్యాత్మిక శక్తులను, లేదా ఈ రెండింటినీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: దానిని
  rationale: స్త్రీలింగ ఏకవచన సంబంధ సర్వనామం ముందు వచనంలో చెప్పబడిన దేవుని జ్ఞానాన్ని సూచిస్తుంది; తెలుగులో సహజమైన అనుసంధానంగా ‘దానిని’ వాడబడింది.
- source_word: ἀρχόντων
  choice: పాలకులు
  rationale: అధికారం చెలాయించేవారనే విస్తృత భావాన్ని నిలుపుతుంది; మానవ పాలకులా, ఆత్మసంబంధ శక్తులా అనే విషయాన్ని ముందుగానే నిర్ణయించదు.
- source_word: αἰῶνος τούτου
  choice: ఈ యుగపు
  rationale: αἰών యొక్క కాలసంబంధ భావాన్ని ‘లోకం’ కంటే నేరుగా తెలియజేస్తుంది.
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: తెలుసుకోలేదు / తెలుసుకొని ఉంటే
  rationale: γινώσκωను నేరుగా ప్రతిబింబిస్తూ, నిజానికి విరుద్ధమైన షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κύριον τῆς δόξης
  choice: మహిమకు ప్రభువు
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతూ, ఆ బిరుదులోని ఘనతను కాపాడుతుంది.
- source_word: ἐσταύρωσαν
  choice: సిలువ వేసేవారు
  rationale: సిలువ మరణానికి గురిచేయడమనే చారిత్రకంగా నిర్దిష్టమైన క్రియను సాధారణ ఆధునిక తెలుగు వాడుకలో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఈ యుగపు పాలకులు’ ఎవరు?
  choice: ‘ఈ యుగపు పాలకులు’ అని తటస్థంగా అనువదించబడింది.
  alternative: మానవ రాజకీయ లేదా మతపరమైన పాలకులు; ఆత్మసంబంధ దుష్టశక్తులు; లేదా ఈ రెండింటినీ కలిపిన సూచన.
  rationale: గ్రీకు పదబంధం ఈ అర్థాల్లో ఒకటి కంటే ఎక్కువ అర్థాలకు అవకాశం ఇస్తుంది. వచనం స్పష్టంగా తేల్చని విషయాన్ని అనువాదం తేల్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి పాటించబడింది. ‘మహిమకు ప్రభువు’ అనే కొంచెం ఉన్నతమైన పదబంధం మూలంలోని κύριον τῆς δόξης నిర్మాణాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
