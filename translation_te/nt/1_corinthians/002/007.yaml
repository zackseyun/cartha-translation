review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast, God's wisdom, its hidden character, God's prior determination, the temporal phrase before the ages, and the purpose for our glory. A small syntactic revision better preserves the Greek's single appositional construction, in which “the hidden [wisdom]” directly qualifies “God's wisdom.”
  naturalness: “ఒక మర్మంగా” is understandable modern Telugu, though it retains some productive ambiguity between a divine mystery and mysterious manner of speaking. Keeping it with an explanatory apposition produces a smoother, more coherent sentence than separating it into two sentences.
  terminology: దేవుని జ్ఞానం, మర్మం, మహిమ, and ముందే నిర్ణయించాడు are suitable modern-standard Telugu renderings. “మర్మం” appropriately retains the Pauline theological term without reducing it to mere secrecy. “దాచబడిన” is more natural than “దాచివుంచబడిన” here.
  issues:
  - severity: low
    issue: The apposition is broken into a separate sentence.
    rationale: Greek τὴν ἀποκεκρυμμένην directly resumes and qualifies σοφίαν. The draft’s “అది దాచివుంచబడిన జ్ఞానం.” is intelligible, but a comma-linked apposition is closer to the source and reads more naturally.
  - severity: low
    issue: “దాచివుంచబడిన” is somewhat heavy and less idiomatic in this context.
    rationale: The perfect passive participle ἀποκεκρυμμένην is naturally conveyed by “దాచబడిన”; the shorter form retains the hidden-state sense without adding unnecessary verbal weight.
  revised_text: కాని మేము దేవుని జ్ఞానాన్ని ఒక మర్మంగా[a], అంటే దాచబడిన జ్ఞానంగా చెబుతున్నాం. దేవుడు దానిని యుగాలకు ముందు[c] మన మహిమ కోసం ముందే నిర్ణయించాడు[b].
