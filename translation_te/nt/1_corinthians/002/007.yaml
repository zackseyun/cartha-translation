source:
  edition: SBLGNT
  text: ἀλλὰ λαλοῦμεν ⸂θεοῦ σοφίαν⸃ ἐν μυστηρίῳ, τὴν ἀποκεκρυμμένην, ἣν προώρισεν ὁ θεὸς πρὸ τῶν αἰώνων εἰς δόξαν ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: te
  text: కాని మేము దేవుని జ్ఞానాన్ని ఒక మర్మంగా[a], అంటే దాచబడిన జ్ఞానంగా చెబుతున్నాం. దేవుడు దానిని యుగాలకు ముందు[c] మన మహిమ కోసం ముందే నిర్ణయించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రహస్యంగా’. గ్రీకులో ‘మర్మం’ అనే పదం ఉంది; పౌలు ఈ పదాన్ని ఒకప్పుడు దాచబడి, ఇప్పుడు వెల్లడైన దేవుని ప్రణాళికకు తరచుగా వాడుతాడు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ముందే నియమించాడు’, ‘ముందుగానే నిర్ణయించాడు’.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘సమస్త యుగాలకు ముందు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: చెబుతున్నాం
  rationale: λαλέω యొక్క సాధారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; దీనిని ‘ప్రకటిస్తున్నాం’ అని అనువదించి అధికారిక ప్రకటన భావాన్ని అదనంగా చేర్చదు.
- source_word: θεοῦ σοφίαν
  choice: దేవుని జ్ఞానాన్ని
  rationale: సంబంధ విభక్తిని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో వ్యక్తపరుస్తూ, ఈ జ్ఞానం దేవునికి చెందినదనే భావాన్ని నిలుపుతుంది.
- source_word: ἐν μυστηρίῳ
  choice: ఒక మర్మంగా
  rationale: పౌలు వాడే μυστήριον దేవుని ఒకప్పుడు దాచబడి ఇప్పుడు వెల్లడైన ఉద్దేశాన్ని సూచించగలదు. ‘మర్మంగా’ అనే పదం ఆ భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది; ‘రహస్యంగా’ అంటే కేవలం గోప్యంగా మాట్లాడడం అనే అపార్థం కలగవచ్చు.
- source_word: τὴν ἀποκεκρυμμένην
  choice: అది దాచివుంచబడిన జ్ఞానం
  rationale: స్త్రీలింగ ఏకవచన కృదంతం ‘జ్ఞానం’ అనే పదాన్నే తిరిగి సూచిస్తుంది. తెలుగులో దాని సూచ్యాన్ని స్పష్టంగా పునరుద్ఘాటించడం వాక్యాన్ని సులభంగా అర్థమయ్యేలా చేస్తుంది; సంపూర్ణ క్రియారూపం గతం నుంచి కొనసాగిన దాచబడిన స్థితిని సూచిస్తుంది.
- source_word: προώρισεν
  choice: ముందే నిర్ణయించాడు
  rationale: దేవుని పూర్వ నిర్ణయమనే క్రియ యొక్క బలాన్ని నిలుపుతుంది; అదే సమయంలో ఒక ప్రత్యేక మతసిద్ధాంత వ్యవస్థకు మాత్రమే చెందిన సాంకేతిక పదాన్ని ప్రధాన పాఠ్యంలో రుద్దదు.
- source_word: πρὸ τῶν αἰώνων
  choice: యుగాలకు ముందు
  rationale: αἰῶνες యొక్క కాల–విశ్వ సంబంధమైన బహువచన రూపాన్ని నేరుగా నిలుపుతుంది; ‘లోకం పుట్టకముందు’ అనే మరింత వ్యాఖ్యాత్మక రూపాన్ని ఎంచుకోదు.
- source_word: εἰς δόξαν ἡμῶν
  choice: మన మహిమ కోసం
  rationale: εἰς యొక్క లక్ష్య భావాన్నీ δόξα యొక్క బలమైన భావాన్నీ సూటిగా నిలుపుతుంది; ‘మన మహిమపరచబడుట కోసం’ అని వ్యాఖ్యాత్మకంగా విస్తరించదు.
theological_decisions:
- issue: పౌలు సందర్భంలో సిద్ధాంతపరమైన ప్రాముఖ్యత కలిగిన προώρισεν పదం
  choice: ముందే నిర్ణయించాడు
  alternative: ముందే నియమించాడు; ముందే గమ్యాన్ని నిర్ణయించాడు
  rationale: గ్రీకు క్రియ దేవుడు ముందుగానే నిర్ణయించాడనే భావాన్ని స్పష్టంగా ఇస్తుంది. ప్రధాన పాఠ్యం ఆ బలాన్ని నిలుపుతుంది; అయితే వ్యక్తుల రక్షణకు సంబంధించిన ఏదైనా సంకుచిత సిద్ధాంత వ్యవస్థను ఈ వాక్యంలోకి దిగుమతి చేయదు.
- issue: ἐν μυστηρίῳ యొక్క భావం
  choice: ఒక మర్మంగా
  alternative: రహస్యంగా; మర్మంలో
  rationale: ఇది మాట్లాడే విధానం గోప్యమని మాత్రమే సూచించవచ్చు అనే భాషాత్మక అవకాశాన్ని పూర్తిగా చెరపకుండా, పౌలు వాడుకలో దేవుని దాచబడిన ప్రణాళిక అనే ప్రధాన భావాన్ని ముందుకు తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘జ్ఞానం’, ‘మర్మం’, ‘మహిమ’ వంటి పౌలు భావభారం కలిగిన పదాలను నిలుపుతూ, పాతకాలపు క్రియాంతాలు మరియు అధిక సంస్కృతీకృత నిర్మాణాలను నివారించాం. గ్రీకు అనుప్రయోగాన్ని స్పష్టీకరించడానికి రెండు వాక్యాలుగా విభజించాం; భావసంబంధాన్ని డ్యాష్ ద్వారా నిలిపాం.
