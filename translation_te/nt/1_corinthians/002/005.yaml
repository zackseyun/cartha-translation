  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: te
  text: మీ విశ్వాసం మానవ జ్ఞానంపై[a] కాకుండా దేవుని శక్తిపై ఆధారపడి ఉండేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుషుల జ్ఞానంపై.” ఇక్కడ “మనుషులు” అంటే మానవులందరూ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ఉండేలా
  rationale: ఇది ఉద్దేశాన్ని తెలిపే ἵνα ఉపవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ముందున్న వాక్యంతో దీని అనుసంధానాన్ని కూడా నిలుపుతుంది.
- source_word: ἡ πίστις ὑμῶν
  choice: మీ విశ్వాసం
  rationale: ఇక్కడ πίστις కొరింథీయుల నమ్మక స్పందనను సూచిస్తుంది. అందువల్ల ‘విశ్వాసం’ సందర్భానికి సరైన, స్థిరమైన పదం.
- source_word: ἐν σοφίᾳ ἀνθρώπων
  choice: మానవ జ్ఞానంపై
  rationale: ἀνθρώπων ఇక్కడ స్త్రీపురుషులందరినీ కలుపుకున్న మానవాళిని సాధారణంగా సూచిస్తుంది. ‘పై ఆధారపడి’ అనే తెలుగు నిర్మాణంలో ‘మానవ జ్ఞానంపై’ సహజంగా ఉండి, విశ్వాసానికి ఆధారం అనే భావాన్ని తెలియజేస్తుంది.
- source_word: ἀλλ’ ἐν δυνάμει θεοῦ
  choice: కాకుండా దేవుని శక్తిపై ఆధారపడి
  rationale: ἀλλά సూచించే బలమైన వ్యత్యాసాన్ని ‘కాకుండా’ నిలుపుతుంది. ‘దేవుని శక్తిపై ఆధారపడి’ అనేది ἐν యొక్క ఆధారం/స్థానం భావాన్ని ఈ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐν పదబంధాలు విశ్వాసానికి ఆధారాన్నా లేక అది ఉండే పరిధినినా సూచిస్తున్నాయనే భావసూక్ష్మత
  choice: ‘పై ఆధారపడి’ అని అనువదించడం
  alternative: ‘లో ఉండడం’ అని అక్షరార్థంగా అనువదించడం
  rationale: సందర్భంలో పౌలు మానవ జ్ఞానానికి, దేవుని శక్తికి మధ్య విశ్వాసపు ఆధారాన్ని వ్యత్యాసపరుస్తున్నాడు. ‘ఆధారపడి’ సహజమైన తెలుగులో ఈ సంబంధాన్ని స్పష్టం చేస్తుంది; రెండు పదబంధాలకు సమానంగా వర్తించడం వల్ల సమాంతర నిర్మాణం నిలుస్తుంది.
- issue: ἀνθρώπων యొక్క లింగవ్యాప్తి
  choice: ‘మానవ’ అని అనువదించడం
  alternative: ‘మనుషుల’ అని అనువదించడం
  rationale: గ్రీకు బహువచనం ఇక్కడ పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది. ‘మానవ’ ఆ వ్యాప్తిని తెలుగులో ఖచ్చితంగా, సంక్షిప్తంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలి వాడబడింది. ఈ వచనం ముందున్న వాక్యాన్ని కొనసాగించే ఉద్దేశ ఉపవాక్యం కాబట్టి, మూలంలోని వాక్యనిర్మాణ సంబంధాన్ని నిలుపుతూ ‘ఉండేలా’తో ముగించబడింది.
