id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: te
  text: సోదరులారా,[a] నేను కూడా మీ దగ్గరికి వచ్చినప్పుడు, గొప్ప వాక్చాతుర్యంతోగానీ జ్ఞానంతోగానీ దేవుని సాక్ష్యాన్ని[b] మీకు ప్రకటిస్తూ రాలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సోదరులు” అనే పదం సంఘంలోని స్త్రీలతో సహా తోటి విశ్వాసులందరినీ సాధారణంగా సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో “దేవుని మర్మాన్ని” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: నేను
  rationale: καί యొక్క అనుసంధాన భావం సందర్భప్రవాహంలో సహజంగా ప్రతిఫలిస్తుంది; ప్రత్యేక సర్వనామమైన ἐγώలోని స్వల్ప ఉద్ఘాటనను తెలుగు కర్త స్పష్టీకరిస్తుంది, అయితే అనవసరంగా ‘నేనే’ అని అతిశయింపదు.
- source_word: ἐλθὼν … ἦλθον
  choice: నేను మీ దగ్గరికి వచ్చినప్పుడు … రాలేదు; … ప్రకటిస్తూ వచ్చాను
  rationale: కృదంతం మరియు ప్రధాన క్రియల పునరుక్తిని సహజమైన తెలుగు కాలవాచక నిర్మాణంలో నిలుపుతూ, ప్రకటించడం అతని రాకతో ముడిపడి ఉందని తెలియజేస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పురుషలింగ సంబోధనను ప్రధాన పాఠ్యంలో నిలుపుతుంది; సంఘంలోని స్త్రీలతో సహా తోటి విశ్వాసులను సూచించే విస్తృత ప్రయోగాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: గొప్ప వాక్చాతుర్యంతోగానీ జ్ఞానంతోగానీ
  rationale: ὑπεροχή సూచించే శ్రేష్ఠత లేదా ఆకట్టుకునే ఉన్నతతను, λόγος యొక్క సందర్భానుగుణ వాక్ప్రయోగ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καταγγέλλων
  choice: ప్రకటిస్తూ
  rationale: ప్రజల ఎదుట తెలియజేయడం లేదా ప్రకటించడం అనే కృదంత భావాన్ని నిలుపుతుంది.
- source_word: μαρτύριον
  choice: సాక్ష్యం
  rationale: SBLGNTలోని ముద్రిత పాఠం μαρτύριονకు తగిన గంభీరమైన పదం; ‘మర్మం’ అనే పాఠాంతరాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: ఈ షష్ఠీ విభక్తి దేవుని నుండి వచ్చిన సాక్ష్యమా, దేవుని గురించిన సాక్ష్యమా అనే అర్థసంభావ్యతను నిర్దిష్టంగా తీర్మానించకుండా నిలుపుతుంది.
theological_decisions:
- issue: μαρτύριον వద్ద పాఠాంతరం
  choice: దేవుని సాక్ష్యం
  alternative: దేవుని మర్మం
  rationale: SBLGNT మూలపాఠంలో μαρτύριον (‘సాక్ష్యం’) ఉంది. ముఖ్యమైన μυστήριον (‘మర్మం’) పాఠాంతరాన్ని ప్రధాన పాఠ్యంలో కలపకుండా పాదసూచికలో తెలియజేస్తుంది.
- issue: τοῦ θεοῦ అనే షష్ఠీ విభక్తి భావం
  choice: దేవుని సాక్ష్యం
  alternative: దేవుని నుండి వచ్చిన సాక్ష్యం / దేవుని గురించిన సాక్ష్యం
  rationale: మూలంలోని సంబంధం ఉద్దేశపూర్వకంగా విస్తృతంగా ఉండవచ్చు; ‘దేవుని’ అనే రూపం దాని నిజమైన సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘వాక్చాతుర్యం’ సందర్భంలోని ప్రభావవంతమైన ప్రసంగ నైపుణ్యాన్ని సహజంగా తెలియజేస్తుంది; ‘దేవుని సాక్ష్యం’ మూలంలోని ధార్మిక మరియు వ్యాకరణ సంబంధ సందిగ్ధతను నిలుపుతుంది.
