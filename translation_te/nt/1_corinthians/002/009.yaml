id: 1CO.2.9
reference: 1 Corinthians 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: te
  text: 'అయితే, వ్రాయబడి ఉన్నట్టుగా:

    “కన్ను చూడనివి,

    చెవి విననివి,

    మనిషి[b] హృదయంలో తలెత్తనివి[a]—

    తనను ప్రేమించేవారి కోసం దేవుడు సిద్ధపరచినవన్నీ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మనిషి హృదయంలో తలెత్తనివి” అనే మాటను “ఏ మనిషికీ తోచనివి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “మనిషి” అనే పదం మానవులందరినీ సాధారణంగా సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందరి భావానికి వ్యత్యాసాన్ని సూచిస్తూ, ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: καθὼς γέγραπται
  choice: వ్రాయబడి ఉన్నట్టుగా
  rationale: లేఖన ఉల్లేఖన సూత్రాన్నీ, గ్రీకు పరిపూర్ణ కాలంలోని కొనసాగుతున్న స్థితినీ నిలుపుతుంది.
- source_word: Ἃ ... ὅσα
  choice: …నివి … సిద్ధపరచినవన్నీ
  rationale: మొదటి సంబంధవాచకాన్ని, తరువాత దానిని తిరిగి సమగ్రంగా సూచించే బహువచన రూపాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ὀφθαλμὸς
  choice: కన్ను
  rationale: గ్రీకులోని ఏకవచన సాధారణ ప్రయోగాన్ని నిలుపుతుంది.
- source_word: οὖς
  choice: చెవి
  rationale: ‘కన్ను’తో ఉన్న ఏకవచన సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: మనిషి హృదయంలో తలెత్తనివి
  rationale: ‘హృదయం మీదికి ఎక్కలేదు’ అనే మూల రూపకాన్ని సహజమైన తెలుగులో ‘తలెత్తలేదు’గా అందిస్తూ, ‘హృదయం’ అనే బైబిలీయ భావపదాన్ని నిలుపుతుంది.
- source_word: ἡτοίμασεν
  choice: సిద్ధపరచిన
  rationale: దేవుడు పూర్తి చేసిన సిద్ధపరచే కార్యాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: తనను ప్రేమించేవారి కోసం
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న లక్షణాన్ని సహజమైన తెలుగు వాక్యరూపంలో అందిస్తుంది.
theological_decisions:
- issue: ἀνθρώπου అనే ఏకవచన సాధారణ పదం
  choice: మనిషి
  alternative: మానవుని / ఎవరి
  rationale: మూలంలోని ఏకవచన రూపాన్ని ఉంచుతూ, అది పురుషులకు మాత్రమే పరిమితం కాదని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
- issue: καρδία యొక్క భావపరిధి
  choice: హృదయం
  alternative: మనసు
  rationale: దీనిని కేవలం బుద్ధి లేదా ఆలోచనకు పరిమితం చేయకుండా, మూలంలోని బైబిలీయ మానవ అంతరంగ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సమాంతర నిర్మాణాన్ని నిలుపుతూ గౌరవప్రదమైన సాధారణ భాష వాడబడింది. మూలంలోని ‘కన్ను—చెవి—హృదయం’ క్రమం మరియు చివరి పునరుక్త సమగ్ర భావం కాపాడబడ్డాయి.
