- from: అయితే నేను వీటిలో దేనినీ[a] ఉపయోగించుకోలేదు. నా విషయంలో ఇలా జరగాలనే ఉద్దేశంతో నేను ఇవి రాయలేదు. ఎందుకంటే నేను చనిపోవడమే నాకు మేలు, అంతేగాని—[b] నేను అతిశయించే కారణాన్ని ఎవరూ వ్యర్థం చేయరు.
  to: అయితే నేను వీటిలో దేనినీ[a] ఉపయోగించుకోలేదు. నా విషయంలో ఇలా జరగాలనే ఉద్దేశంతో నేను ఇవి రాయలేదు. ఎందుకంటే నేను చనిపోవడమే నాకు మరింత మేలు, కంటే—[b] నేను అతిశయించే కారణాన్ని ఎవరూ వ్యర్థం చేయరు.
  rationale: ἤ యొక్క పోలికాత్మక అర్థాన్ని ‘కంటే—’గా సరిచేసి, μᾶλλον యొక్క ఉద్ఘాటనను ‘మరింత’తో సూచించాము. వాక్యాన్ని పూర్తి చేసి మూలంలోని ఆకస్మిక విరామాన్ని తొలగించలేదు; అందువల్ల పౌలు మాటలలోని తీవ్రత, అసంపూర్ణ పోలిక, తదనంతర స్వతంత్ర ప్రకటన అన్నీ నిలిచాయి. ఇతర పదప్రయోగాలు మూలార్థానికీ ఆధునిక ప్రామాణిక తెలుగు వినియోగానికీ తగినవే కాబట్టి మార్చలేదు.
