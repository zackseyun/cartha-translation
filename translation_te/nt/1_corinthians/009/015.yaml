id: 1CO.9.15
reference: 1 Corinthians 9:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: te
  text: అయితే నేను వీటిలో దేనినీ[a] ఉపయోగించుకోలేదు. నా విషయంలో ఇలా జరగాలనే ఉద్దేశంతో నేను ఇవి రాయలేదు. ఎందుకంటే నేను చనిపోవడమే నాకు మరింత మేలు, కంటే—[b] నేను అతిశయించే కారణాన్ని ఎవరూ వ్యర్థం చేయరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సందర్భాన్ని మరింత స్పష్టంగా తెలుపుతూ: ‘ఈ హక్కుల్లో దేనినీ.’'
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు వాక్యం ‘కంటే—’ అనే పోలిక-సూచక పదం తరువాత అకస్మాత్తుగా ఆగి, ‘నేను అతిశయించే కారణాన్ని ఎవరూ వ్యర్థం చేయరు’ అని కొత్త వాక్య నిర్మాణంతో కొనసాగుతుంది. అనేక అనువాదాలు భావాన్ని సాఫీ చేస్తూ, ‘ఎవరైనా నేను అతిశయించే కారణాన్ని వ్యర్థం చేయనివ్వడం కంటే’ అని అనువదిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: ఉపయోగించుకోలేదు
  rationale: పౌలు ఇంతకుముందు చెప్పిన హక్కులను తన ప్రయోజనం కోసం వినియోగించుకోలేదనే పరిపూర్ణ మధ్యమ క్రియ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὐδενὶ τούτων
  choice: వీటిలో దేనినీ
  rationale: గ్రీకు పదబంధంలోని సాధారణ సూచనను నిలుపుతూ, సందర్భంలో చెప్పబడిన పోషణ పొందే హక్కులను పాఠకుడు గ్రహించడానికి వీలు కల్పిస్తుంది.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: నా విషయంలో ఇలా జరగాలనే ఉద్దేశంతో
  rationale: ἵνα యొక్క ఉద్దేశ భావాన్నీ, ἐν ἐμοί యొక్క ‘నా విషయంలో’ అనే సందర్భార్థాన్నీ సహజంగా అందిస్తుంది; పౌలు తనకు అలాంటి ఏర్పాటును పొందాలని రాయలేదని స్పష్టం చేస్తుంది.
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: నేను చనిపోవడమే నాకు మేలు
  rationale: గ్రీకు పోలికాత్మక వాక్య నిర్మాణాన్ని నిలుపుతూ పౌలు వ్యక్తం చేసిన తీవ్రమైన ప్రాధాన్యాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ καύχημά μου
  choice: నేను అతిశయించే కారణాన్ని
  rationale: καύχημα ఇక్కడ కేవలం అతిశయించే చర్యనే కాక దానికి ఆధారమైన కారణాన్ని కూడా సూచిస్తుంది; ఉచితంగా సువార్త ప్రకటించడమే సందర్భంలోని భావం.
- source_word: κενώσει
  choice: వ్యర్థం చేయరు
  rationale: ‘ఖాళీ చేయడం’ అనే మూల రూపకానికి సందర్భానుసారంగా ‘ఫలితం లేకుండా చేయడం, రద్దు చేయడం’ అనే భావం ఉంది; ‘వ్యర్థం చేయరు’ తెలుగులో సహజంగా ఉండి ఆ రూపకార్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: ἤ తరువాత ఉన్న ఆకస్మిక వాక్య విరామం
  choice: ‘అంతేగాని—’ తరువాత దీర్ఘ విరామచిహ్నంతో అసంపూర్ణ పోలికను నిలుపడం
  alternative: ‘ఎవరైనా నేను అతిశయించే కారణాన్ని వ్యర్థం చేయనివ్వడం కంటే నేను చనిపోవడమే మేలు’ అని వాక్యాన్ని పూర్తిగా సవరించడం
  rationale: గ్రీకు పాఠం ἤ (‘కంటే/అంతేగాని’) తరువాత అకస్మాత్తుగా ఆగి, కొత్త వాక్య నిర్మాణంతో కొనసాగుతుంది. దాన్ని సాఫీగా పూర్తి చేయకుండా నిలపడం పౌలు మాటల తీవ్రతను, మూలంలోని అసంపూర్ణ నిర్మాణాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఉపయోగించుకోలేదు,’ ‘నా విషయంలో,’ ‘వ్యర్థం చేయరు’ వంటి సాధారణ పదాలతో భావం అందించబడింది; మూలంలోని భావోద్వేగపూరిత వాక్య విరామం ఉద్దేశపూర్వకంగా నిలుపబడింది.
