  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ τοίνυν οὕτως τρέχω ὡς οὐκ ἀδήλως, οὕτως πυκτεύω ὡς οὐκ ἀέρα δέρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/026.yaml
  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: te
  text: 'కాబట్టి నేను ఇలా పరుగెత్తుతున్నాను: లక్ష్యం లేకుండా కాదు[a]; ఇలా ముష్టియుద్ధం చేస్తున్నాను: గాలిని కొట్టేవాడిలా కాదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనిశ్చితంగా కాదు.” గ్రీకు క్రియావిశేషణం స్పష్టత లేకపోవడాన్ని లేదా నిర్దిష్ట లక్ష్యం లేకపోవడాన్ని సూచించవచ్చు; పరుగుపందెం రూపకంలో “లక్ష్యం లేకుండా కాదు” అనే అనువాదం స్పష్టమైన గమ్యం లేకుండా పరుగెత్తే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: కాబట్టి
  rationale: ముందున్న క్రీడా ఉపమానం నుంచి పౌలు తన వ్యక్తిగత అన్వయానికి చేసే తార్కిక మార్పును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: οὕτως
  choice: ఇలా
  rationale: రెండుసార్లు వచ్చిన మూలపదాన్ని రెండుచోట్లా ఒకే విధంగా ఉంచి, చర్య చేసే తీరుపై ఉన్న ఉద్ఘాటనను కాపాడుతుంది.
- source_word: τρέχω
  choice: పరుగెత్తుతున్నాను
  rationale: ముందరి సందర్భంలోని పరుగుపందెం రూపకాన్ని నిలుపుతూ వర్తమానకాల క్రియను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀδήλως
  choice: లక్ష్యం లేనివాడిలా
  rationale: పరుగుపందెం సందర్భంలో స్పష్టమైన గమ్యం లేదా నిర్దిష్ట లక్ష్యం లేకుండా పరుగెత్తడమనే భావాన్ని అందిస్తుంది; మూలపదంలోని ‘అనిశ్చితంగా’ అనే సాధ్యమైన ఛాయను పాదసూచికలో ఉంచాం.
- source_word: πυκτεύω
  choice: ముష్టియుద్ధం చేస్తున్నాను
  rationale: సాధారణ పోరాటం కాక, ప్రత్యేకంగా గుద్దులతో చేసే క్రీడను సూచించే గ్రీకు క్రియకు గౌరవప్రదమైన, స్పష్టమైన తెలుగు సమానం.
- source_word: ἀέρα δέρων
  choice: గాలిని కొట్టేవాడిలా
  rationale: దెబ్బ లక్ష్యాన్ని తాకకుండా గాలిలోనే పోవడమనే మూలచిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకులోని సమాంతర నిర్మాణం—రెండుసార్లు వచ్చిన οὕτως మరియు రెండుసార్లు వచ్చిన ὡς οὐκ నిర్మాణం—తెలుగులో ‘ఇలా ... కాదు; ఇలా ... కాదు’ రూపంలో సాధ్యమైనంతవరకు నిలుపబడింది.
