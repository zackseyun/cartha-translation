  to: 'లేక ఆయన నిశ్చయంగా మన కోసమే ఇలా చెబుతున్నాడా?[a] ఎందుకంటే, మన కోసమే ఇది రాయబడింది: ఆశతో దున్నేవాడు దున్నాలి, భాగం పొందాలనే ఆశతో నూర్చేవాడు నూర్చాలి.[b]'
  rationale: ‘నిశ్చయంగా’ సందర్భానుగుణంగా πάντως యొక్క ఉద్ఘాటనను ఇస్తుంది, ‘పూర్తిగా’ వల్ల కలిగే ప్రత్యేకత/సంపూర్ణత భావాన్ని నివారిస్తుంది. వాక్యక్రమాన్ని సవరించి γάρ (‘ఎందుకంటే’)ను ‘మన కోసమే ఇది రాయబడింది’తో నేరుగా కలిపాం; కోలన్ ὅτι తరువాత వచ్చే విషయాన్ని స్పష్టంగా సూచిస్తుంది. వ్యవసాయ ఉపవాక్యాల సమాంతరత, కర్మణి ‘రాయబడింది,’ మరియు μετέχειν యొక్క అవ్యక్త కర్మను కాపాడాం.
