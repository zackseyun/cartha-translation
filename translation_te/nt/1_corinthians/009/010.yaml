reference: 1 Corinthians 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: te
  text: 'లేక ఆయన నిశ్చయంగా మన కోసమే ఇలా చెబుతున్నాడా?[a] ఎందుకంటే, మన కోసమే ఇది రాయబడింది: ఆశతో దున్నేవాడు దున్నాలి, భాగం పొందాలనే ఆశతో నూర్చేవాడు నూర్చాలి.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిశ్చయంగా’ అనే మాటకు ‘పూర్తిగా’ లేదా ‘సర్వతోముఖంగా’ అని కూడా అర్థం ఉండవచ్చు. గ్రీకు క్రియావిశేషణం ఈ అలంకారప్రశ్నను బలపరుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో దేనిలో భాగం పొందాలన్నది స్పష్టంగా చెప్పబడలేదు; వ్యవసాయ సందర్భాన్ని బట్టి పంటలో లేదా దిగుబడిలో భాగం పొందడం అని అర్థం.
    reason: implicit_object
lexical_decisions:
- source_word: πάντως
  choice: పూర్తిగా
  rationale: ఈ క్రియావిశేషణం అలంకారప్రశ్నలో మాటను బలపరుస్తుంది. ‘పూర్తిగా’ దాని సమగ్రత భావాన్ని నిలుపుతుంది; ‘నిశ్చయంగా’ అనే భావం కూడా సందర్భంలో సాధ్యమే కాబట్టి పాదసూచికలో ఇచ్చాం.
- source_word: δι’ ἡμᾶς
  choice: మన కోసమే
  rationale: διά + accusative ఇక్కడ ప్రయోజనం లేదా ఉద్దేశాన్ని సూచిస్తుంది. ‘మన కోసమే’ అనేది ఆ భావాన్నీ, వాక్యంలోని ఉద్ఘాటననూ సహజంగా తెలియజేస్తుంది.
- source_word: ἐγράφη
  choice: రాయబడింది
  rationale: Aorist passive రూపాన్ని సహజమైన తెలుగు కర్మణి ప్రయోగంతో అనువదించాం.
- source_word: ὀφείλει
  choice: దున్నాలి / నూర్చాలి
  rationale: ఇది బాధ్యత లేదా సముచితతను సూచిస్తుంది. తెలుగులో ‘చేయాలి’ రూపం సందర్భానుసారంగా ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπ’ ἐλπίδι
  choice: ఆశతో / ఆశతోనే
  rationale: శ్రమకు తోడైన నిరీక్షణను సూచించే ఈ పదబంధాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: దున్నేవాడు ఆశతో దున్నాలి
  rationale: Articular participle యొక్క సాధారణ వ్యక్తి సూచనను ‘దున్నేవాడు’గా, infinitive నిర్మాణాన్ని ‘దున్నాలి’గా అందించి మూలంలోని పునరుక్తిని నిలిపాం.
- source_word: ὁ ἀλοῶν
  choice: నూర్చేవాడు
  rationale: ధాన్యాన్ని తొక్కించి గింజలను వేరుచేసే వ్యవసాయ పనిని ఆధునిక ప్రామాణిక తెలుగులో ‘నూర్చడం’గా వ్యక్తం చేశాం; ముందరి ఉపవాక్యంతో సమాంతరతను నిలిపాం.
- source_word: τοῦ μετέχειν
  choice: భాగం పొందడం
  rationale: μετέχω లోని పాలుపంచుకోవడం లేదా వాటా పొందడం అనే భావాన్ని వ్యక్తం చేస్తూ, గ్రీకులో చెప్పని ‘పంట’ వంటి కర్మను ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: πάντως యొక్క పరిధి మరియు భావం
  choice: ప్రశ్నలో ‘పూర్తిగా’
  alternative: ‘నిశ్చయంగా’ లేదా ‘ఖచ్చితంగా’
  rationale: ఈ పదం సమగ్రతను సూచించవచ్చు లేదా అలంకారప్రశ్నకు నిశ్చయార్థక బలాన్ని ఇవ్వవచ్చు. ప్రధాన పాఠ్యం మొదటి అవకాశాన్ని ఉంచగా, పాదసూచిక నిజమైన అర్థసందిగ్ధతను తెలియజేస్తుంది.
- issue: τοῦ μετέχειν కు అవ్యక్తంగా ఉన్న కర్మ
  choice: కర్మను చేర్చకుండా ‘భాగం పొందడం’
  alternative: ‘పంటలో భాగం పొందడం’
  rationale: వ్యవసాయ సందర్భం పంటలో వాటాను సూచించినా, గ్రీకు వాక్యంలో కర్మ స్పష్టంగా లేదు. అందువల్ల ప్రధాన పాఠ్యంలో దానిని నింపకుండా మూలంలోని సంక్షిప్తతను నిలిపాం.
- issue: γάρ ముందు స్పష్టమైన సమ్మతి పదం
  choice: ‘అవును’ అనే పదాన్ని చేర్చలేదు
  alternative: ‘అవును, మన కోసమే…’
  rationale: అలంకారప్రశ్నకు సమాధానం భావంలో స్పష్టమైనప్పటికీ, గ్రీకులో ప్రత్యేకమైన ‘అవును’ పదం లేదు. ‘మన కోసమే’ అనే ఉద్ఘాటన సమాధాన భావాన్ని తగినంతగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువాదం. రెండు వ్యవసాయ ఉపవాక్యాల సమాంతర నిర్మాణం నిలుపబడింది. ప్రధాన పాఠ్యంలో మూలంలో లేని ‘పంట’ను చేర్చకుండా అర్థసందిగ్ధతను పాదసూచికలో వివరించాం.
