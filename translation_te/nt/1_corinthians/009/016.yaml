id: 1CO.9.16
reference: 1 Corinthians 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: te
  text: ఎందుకంటే, ఒకవేళ నేను సువార్త ప్రకటిస్తే, గొప్పగా చెప్పుకోవడానికి నాకు ఆధారం లేదు; ఎందుకంటే ప్రకటించవలసిన అవసరం నాపై మోపబడి ఉంది.[a] నేను సువార్త ప్రకటించకపోతే నాకు అయ్యో!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రకటించాల్సిన నిర్బంధం నాపై ఉంది.”
    reason: ‘ἀνάγκη’లోని తప్పనిసరితనం లేదా నిర్బంధ భావాన్ని మరింత బలంగా వ్యక్తం చేసే అనువాద ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: సువార్త ప్రకటిస్తున్నాను / సువార్త ప్రకటించకపోతే
  rationale: ఈ క్రియ శుభవార్తను బహిరంగంగా తెలియజేయడాన్ని సూచిస్తుంది. పౌలు వాడుకలో సందేశం స్పష్టంగా సువార్తే కాబట్టి, ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ‘సువార్త ప్రకటించు’ను రెండు చోట్లా నిలకడగా వాడాం.
- source_word: καύχημα
  choice: గొప్పగా చెప్పుకోవడానికి ... ఆధారం
  rationale: ఇది కేవలం గొప్పలు చెప్పే చర్యను కాక, అలా చెప్పుకోవడానికి ఉండే కారణం లేదా ఆధారాన్ని సూచిస్తుంది. అందువల్ల ‘ఆధారం’ అనే పదం భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνάγκη
  choice: అవసరం
  rationale: ఈ పదంలో తప్పనిసరితనం లేదా నిర్బంధం అనే భావం ఉంది. దాని మూలం ఏమిటో వాక్యం ప్రత్యేకంగా చెప్పనందున, ‘అవసరం’ ఆ అస్పష్టతను నిలుపుతుంది.
- source_word: ἐπίκειται
  choice: నాపై మోపబడింది
  rationale: పౌలుపై భారంగా లేదా బాధ్యతగా ఉంచబడినదనే క్రియాభావాన్ని ఇది సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐαί
  choice: నాకు అయ్యో!
  rationale: తీవ్రమైన దుస్థితి లేదా రాబోయే అపాయాన్ని తెలిపే గంభీరమైన ఆశ్చర్యోక్తిని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἐὰν μὴ
  choice: ప్రకటించకపోతే
  rationale: ప్రతికూల షరతును సూటిగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: సువార్త ప్రకటించాల్సిన పౌలు బాధ్యత స్వభావం
  choice: ‘ప్రకటించవలసిన అవసరం నాపై మోపబడింది’ అని, దాని మూలాన్ని నిర్దిష్టం చేయకుండా అనువదించాం.
  alternative: ‘దేవుడు ఈ బాధ్యతను నాకు అప్పగించాడు’ లేదా ‘నేను బలవంతం చేయబడ్డాను’ అని మరింత వ్యాఖ్యానాత్మకంగా చెప్పడం.
  rationale: ఈ వచనం ఆ అవసరం పౌలుపై ఉందని చెబుతుంది గాని, అది దైవిక నియామకమా, అంతరంగ ప్రేరణా, లేక మరేదైనా ఒత్తిడా అని ఇక్కడే స్పష్టీకరించదు. కాబట్టి మూలంలోని theological tension‌ను అనువాదం పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పౌలు మాటల గంభీరతను నిలుపుతూ రచించబడింది. మొదటి షరతు వాక్యాన్ని తెలుగులో సహజమైన కారణార్థక నిర్మాణంగా ఇచ్చాం; చివరి ఆశ్చర్యోక్తి సంక్షిప్తతను కాపాడాం.
