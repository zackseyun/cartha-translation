id: 1CO.9.13
reference: 1 Corinthians 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: te
  text: పవిత్ర కార్యాలు నిర్వహించేవారు దేవాలయం నుండి వచ్చే వాటిని తింటారని[a], బలిపీఠం వద్ద సేవచేసేవారు బలిపీఠంపై అర్పించబడిన వాటిలో వాటా పొందుతారని[b] మీకు తెలియదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “పవిత్రమైన వాటికి సంబంధించిన పని చేసేవారు దేవాలయం నుండి వచ్చే వాటిని తింటారు.”
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “బలిపీఠం వద్ద సేవచేసేవారు బలిపీఠంతో వాటా పంచుకుంటారు”; అంటే బలిపీఠంపై అర్పించిన బలుల నుండి వారికి ఒక భాగం లభిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: మీకు తెలియదా?
  rationale: పౌలు తరచుగా ఉపయోగించే అలంకారిక ప్రశ్న రూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: పవిత్ర సేవలు చేసేవారు
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘పవిత్రమైన వాటికి సంబంధించిన పని చేసేవారు’ అని సూచిస్తుంది; సందర్భంలో దేవాలయ సంబంధమైన పవిత్ర సేవలను తెలిపేలా, ‘దేవాలయంలో పనిచేసేవారు’ కంటే మూలంలోని τὰ ἱερά భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: దేవాలయం నుండి వచ్చే వాటిని తింటారు
  rationale: మూలంలోని ‘తినడం’ అనే స్పష్టమైన రూపకాన్ని, అలాగే వస్తువులకు సంబంధించిన బహువచన సూచనను నిలుపుతుంది; వారి పోషణ దేవాలయ ఏర్పాట్ల నుండి వస్తుందనే భావం సందర్భం ద్వారా తెలుస్తుంది.
- source_word: ἱεροῦ
  choice: దేవాలయం
  rationale: ἱερόν సాధారణంగా అంతర్గత పరిశుద్ధ స్థలాన్ని మాత్రమే కాక దేవాలయ ప్రాంగణం లేదా సముదాయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేవాలయం’ స్పష్టమైన సాధారణ పదం.
- source_word: παρεδρεύοντες
  choice: దగ్గర సేవచేసేవారు
  rationale: బలిపీఠం పక్కన నియమితులై సేవ చేయడాన్ని సూచించే క్రియాభావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: θυσιαστηρίῳ
  choice: బలిపీఠం
  rationale: బలులు అర్పించే altar కు ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: συμμερίζονται
  choice: చెందిన వాటిలో పాలుపంచుకుంటారు
  rationale: కలిసి ఒక వాటా పొందడం అనే క్రియార్థాన్ని తెలుపుతుంది; ‘బలిపీఠంతో పంచుకుంటారు’ అనే అక్షర రూపంలోని అస్పష్టతను పాదసూచికలో ఉంచుతూ, ప్రధాన పాఠ్యంలో సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పవిత్ర సేవ ద్వారా జీవనపోషణ పొందడం అనే సాదృశ్యం
  choice: దేవాలయ సేవకులు దేవాలయం నుండి వచ్చే వాటిని తింటారని, బలిపీఠ సేవకులు దానికి చెందిన వాటిలో వాటా పొందుతారని అనువదించడం
  alternative: చివరి భాగాన్ని అక్షరార్థానికి దగ్గరగా ‘బలిపీఠంతో పాలుపంచుకుంటారు’ అని అనువదించడం
  rationale: పవిత్ర సేవలో ఉన్నవారు ఆ సేవకు సంబంధించిన సమర్పణల నుండి పోషణ పొందుతారనే పౌలు వాదనను ఇది నిలుపుతుంది; తరువాతి సంఘ వ్యవస్థలను లేదా నిర్దిష్ట మతశాఖల భావాలను పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి. ‘పవిత్ర సేవలు’, ‘దేవాలయం’, ‘బలిపీఠం’, ‘పాలుపంచుకుంటారు’ అనే పదాలు ఆరాధనా సందర్భాన్ని స్పష్టంగా ఉంచుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
