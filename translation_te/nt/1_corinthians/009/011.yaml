id: 1CO.9.11
reference: 1 Corinthians 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: te
  text: మేము మీ మధ్య ఆత్మసంబంధమైన వాటిని విత్తి ఉంటే, మీ నుండి భౌతికమైన వాటిని మేము కోయబోతే అది మరీ ఎక్కువా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భౌమికమైన వాటిని.’ గ్రీకులో ఈ పదం ‘ఆత్మసంబంధమైన వాటిని’ అనే పదానికి విరుద్ధంగా, సాధారణ శారీరక లేదా భౌతిక జీవితానికి సంబంధించిన వాటిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: ఆత్మసంబంధమైన వాటిని
  rationale: నపుంసక బహువచన విశేషణం నామవాచకంగా వాడబడింది; ఆత్మసంబంధమైన మేలు లేదా సేవను విస్తృతంగా సూచిస్తుంది. ఈ అనువాదం గ్రీకు పదబంధంలోని విస్తృతిని కాపాడుతుంది.
- source_word: ἐσπείραμεν
  choice: విత్తితే
  rationale: పౌలు ఇప్పటికే చేసిన సేవను విత్తనాలు విత్తడంతో పోల్చుతున్నాడు. తెలుగు షరతు వాక్యంలో ఈ రూపం సహజంగా ఉండి, వ్యవసాయ రూపకాన్ని నిలుపుతుంది.
- source_word: μέγα
  choice: మరీ ఎక్కువా?
  rationale: ఈ అలంకారిక ప్రశ్నలో అది అతిగా లేదా అసమంజసంగా ఉందా అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὰ σαρκικὰ
  choice: భౌతికమైన వాటిని
  rationale: ఇక్కడ ఈ పదం పాపసంబంధమైన శరీరాశలను కాకుండా, సాధారణ శారీరక-లౌకిక జీవితానికి అవసరమైన ఆర్థిక లేదా వస్తురూప సహాయాన్ని సూచిస్తుంది.
- source_word: θερίσομεν
  choice: కోయడం
  rationale: భవిష్యత్ క్రియ విత్తడం-కోయడం రూపకాన్ని కొనసాగిస్తూ, కొరింథీయుల నుండి సహాయం పొందడాన్ని సూచిస్తుంది. తెలుగు అలంకారిక ప్రశ్నలో క్రియానామ రూపం సహజంగా వినిపిస్తుంది.
- source_word: ὑμῶν
  choice: మీ నుండి
  rationale: θερίζωతో ఉన్న జనిటివ్‌ను తెలుగులో మూలాన్ని సూచించే ‘మీ నుండి’గా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡμεῖς
  choice: మేము
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామం అపొస్తలుల సేవను, వారికి లభించగల సహాయంతో పోల్చి నొక్కిచెబుతుంది.
theological_decisions:
- issue: πνευματικὰ మరియు σαρκικὰ మధ్య వ్యత్యాసం
  choice: ఆత్మసంబంధమైన సేవ/మేలు మరియు భౌతిక సహాయం మధ్య వ్యత్యాసంగా అనువదించడం
  alternative: ‘శరీరసంబంధమైన వాటిని’ అని అనువదించి నైతికంగా ప్రతికూలమైన అర్థం కలిగించడం
  rationale: సందర్భంలో పౌలు సేవకులు జీవనాధార సహాయం పొందే హక్కును సమర్థిస్తున్నాడు. కాబట్టి ఇది పవిత్రత-పాపం మధ్య వ్యత్యాసం కాదు; ఆత్మసంబంధమైన సేవకు ప్రతిగా భౌతిక పోషణ పొందడం గురించినది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘విత్తడం—కోయడం’ అనే వ్యవసాయ రూపకం నిలుపబడింది; ‘భౌతికమైనవి’ అనేది నైతికంగా ప్రతికూలమైన ‘శరీరాశలు’ అనే అపార్థాన్ని నివారిస్తుంది.
