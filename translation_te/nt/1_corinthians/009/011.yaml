  naturalness: ‘మేము మీ మధ్య ... విత్తి ఉంటే, మేము ... కోయబోతే అది మరీ ఎక్కువా?’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజమైన అలంకారిక ప్రశ్నగా ఉంటుంది; అలాగే రెండు చోట్ల ఉన్న గ్రీకు ἡμεῖς యొక్క ఉద్దేశపూర్వక నొక్కుదలను నిలుపుతుంది.
