- from: ఎవడు ఎప్పుడైనా తన సొంత ఖర్చుతో సైనికునిగా సేవ చేస్తాడు?[a] ఎవడు ద్రాక్షతోట నాటి, దాని పండ్లు తినడు? ఎవడు మందను మేపుతూ, ఆ మంద ఇచ్చే పాలలో కొంత తాగడు?[b]
