id: 1CO.9.7
reference: 1 Corinthians 9:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: te
  text: ఎవరైనా తమ సొంత ఖర్చుతో ఎప్పుడైనా సైనిక సేవ చేస్తారా?[a] ఎవరైనా ద్రాక్షతోటను నాటి దాని ఫలాన్ని తినరా? లేదా ఎవరైనా మందను కాస్తూ ఆ మంద పాలను తాగరా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ సొంత జీతంతో/భత్యంతో.” గ్రీకు పదం సైనికునికి ఇచ్చే జీతాన్ని లేదా ఆహార భత్యాన్ని సూచించవచ్చు; సైనిక సేవకు అయ్యే ఖర్చును సైనికుడు తానే భరించడు అనేది భావం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మంద పాలలోనుండి తినరా.” పాల విషయంలో తెలుగులో సహజంగా “తాగరా” అంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: సైనికునిగా సేవ చేస్తాడు
  rationale: సైనిక సేవ చేయడాన్ని సూచించే క్రియ; తప్పనిసరిగా ప్రత్యక్ష యుద్ధాన్ని మాత్రమే సూచించకుండా వృత్తి సంబంధమైన ఉపమానాన్ని నిలుపుతుంది.
- source_word: ἰδίοις ὀψωνίοις
  choice: తన సొంత ఖర్చుతో
  rationale: ὀψώνιον సైనికుని జీతం లేదా ఆహార సరఫరాను సూచించగలదు; ఇక్కడ సైనికుడు తన సేవకు అయ్యే వ్యయాన్ని తానే భరించడు అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ποτέ
  choice: ఎప్పుడైనా
  rationale: అలంకారిక ప్రశ్నలో ‘ఎప్పుడైనా’ అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: φυτεύει ἀμπελῶνα
  choice: ద్రాక్షతోట నాటి
  rationale: వ్యవసాయ దృశ్యాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: దాని పండ్లు
  rationale: ద్రాక్షతోట ఇచ్చే ఫలాన్ని సూచిస్తుంది; తెలుగులో సహజమైన బహువచన ప్రయోగం.
- source_word: ποιμαίνει ποίμνην
  choice: మందను మేపుతూ
  rationale: కాపరి మందను పోషిస్తూ నడిపించే పనిని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: ఆ మంద ఇచ్చే పాలలో కొంత
  rationale: ἐκ యొక్క భాగార్థక/మూలార్థక భావాన్ని నిలుపుతూ, మంద నుండి లభించే పాలలో భాగం పొందడాన్ని స్పష్టంగా చెబుతుంది.
- source_word: ἐσθίει
  choice: తినడు / తాగడు
  rationale: గ్రీకులో రెండు చోట్లా అక్షరార్థంగా ‘తిను’ అనే క్రియే ఉంది; పాలతో తెలుగులో సహజంగా ‘తాగు’ అంటారు.
theological_decisions:
- issue: పునరావృత τίς వాక్యాల్లో సాధారణ పురుష ఏకవచనం
  choice: ‘ఎవడు’, ‘తన’ అనే ప్రతినిధి పురుష ఏకవచనం
  alternative: ‘ఎవరు’, ‘తమ’ అనే లింగనిరపేక్ష గౌరవ/బహువచన రూపం
  rationale: గ్రీకు వాక్యాలు పురుష ఏకవచన ఉదాహరణలుగా ఉన్నాయి. తెలుగు అలంకారిక ప్రశ్నలో ‘ఎవడు’ మూలంలోని ఏకవచన రూపాన్ని నిలుపుతుంది; ఇది పురుషులకు మాత్రమే వర్తిస్తుందని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వరుస అలంకారిక ప్రశ్నల లయను కాపాడుతూ, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘మంద’ అనే పదం సందర్భంలో పశువుల/గొర్రెల మందను సూచిస్తుంది; మూలం జంతువుల రకాన్ని ప్రత్యేకంగా నిర్దేశించదు.
