  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: te
  text: అయితే శుభవార్త[a] కోసం నేను అన్నీ చేస్తున్నాను; నేను కూడా దానిలో పాలుపంచుకునేవాడిని కావాలని.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సువార్త.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నేను కూడా దానిలో భాగస్వామిని కావాలని’; లేదా ‘నేను కూడా దానిలో పాలు పొందాలని.’
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: ఇవన్నీ
  rationale: నపుంసక బహువచనమైన πάντα ఇక్కడ సమగ్ర భావాన్ని ఇస్తుంది. ముందున్న సందర్భంలో పౌలు చెప్పిన వివిధ అనుసరణలను సూచించడానికి సహజమైన తెలుగులో ‘ఇవన్నీ’ అనడం స్పష్టంగా ఉంటుంది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ ముందున్న మాటకు స్వల్ప వ్యత్యాసాన్ని లేదా భావమలుపును సూచిస్తుంది. ‘అయితే’ ఈ సందర్భంలో ఆ మృదువైన వ్యతిరేక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ποιῶ
  choice: నేను ... చేస్తున్నాను
  rationale: ποιέω వర్తమానకాల రూపం పౌలు అలవాటుగా, కొనసాగిస్తూ చేస్తున్న కార్యాన్ని సూచిస్తుంది. తెలుగులో ‘చేస్తున్నాను’ ఆ కొనసాగుతున్న భావాన్ని సహజంగా అందిస్తుంది.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: శుభవార్త కోసం
  rationale: కర్మకారకంతో వచ్చిన διά కారణం, ఉద్దేశం లేదా ప్రయోజనాన్ని సూచించగలదు. ఇక్కడ ‘కోసం’ పౌలు శుభవార్త నిమిత్తం తన ప్రవర్తనను మార్చుకుంటున్నాడనే విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: ἵνα
  choice: అలా ... కావాలని
  rationale: ἵνα ఉద్దేశాన్ని తెలిపే ఉపవాక్యాన్ని ప్రవేశపెడుతుంది. ‘అలా ... కావాలని’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ ఉద్దేశ భావాన్ని నిలుపుతుంది.
- source_word: συγκοινωνὸς
  choice: కూడా ... పాలుపంచుకునేవాడిని
  rationale: ఈ పదం ఇతరులతో కలిసి ఏదో ఒకదానిలో పాలు పొందే లేదా భాగస్వామ్యమయ్యే వ్యక్తిని సూచిస్తుంది. ‘కూడా ... పాలుపంచుకునేవాడిని’ συν- ఉపసర్గలోని సహభాగిత భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοῦ
  choice: దానిలో
  rationale: ఈ సర్వనామం సమీపంలోని నపుంసక నామవాచకమైన εὐαγγέλιονను సూచించడం అత్యంత సహజం. ‘పాలుపంచుకోవడం’తో తెలుగులో ‘దానిలో’ అనే రూపం సరిపోతుంది.
- source_word: γένωμαι
  choice: కావాలని
  rationale: γίνομαι యొక్క భూతసంపూర్ణ మధ్యమ సంభావనార్థక రూపం ἵνα తరువాత వచ్చింది. ‘కావాలని’ కేవలం స్థితిలో ఉండడంకన్నా ఆ స్థితిలోకి రావడం అనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: శుభవార్తకు సంబంధించి పౌలు ‘పాలుపంచుకోవడం’ అనే మాట యొక్క పరిధి
  choice: శుభవార్తలో ఇతరులతో కలిసి పాలుపంచుకోవడం అనే విస్తృత భావాన్ని ఉంచడం
  alternative: దాని ఆశీర్వాదాల్లో పాలుపొందడం; దాని వ్యాప్తిలో భాగస్వామి కావడం; శుభవార్త పరిచర్యలో భాగస్వామి కావడం
  rationale: συγκοινωνός అనే పదం శుభవార్త వల్ల కలిగే మేలుల్లో పాలుపొందడం, దాని వ్యాప్తిలో పాల్గొనడం, లేదా దానికి సంబంధించిన భాగస్వామ్యం వంటి భావాలను కలిగి ఉండగలదు. ప్రధాన అనువాదం వాటిలో ఒక్కదానికే భావాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘శుభవార్త’ను ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయ క్రైస్తవ పదమైన ‘సువార్త’ను పాదటిప్పణిలో ఇచ్చాం. ‘పాలుపంచుకునేవాడిని’ అనే పదబంధం మూలంలోని సహభాగిత భావాన్ని నిలుపుతూ, దానిని కేవలం పరిచర్యకో లేదా ఆశీర్వాదాలకో పరిమితం చేయదు.
