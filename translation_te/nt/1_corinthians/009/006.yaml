  text: ἢ μόνος ἐγὼ καὶ Βαρναβᾶς οὐκ ἔχομεν ἐξουσίαν ⸀μὴ ἐργάζεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/006.yaml
  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: te
  text: లేక నేను, బర్నబా మాత్రమే పని చేయకుండా ఉండే హక్కు లేనివారమా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ‘పని చేయకుండా ఉండే అధికారం’ లేదా ‘శ్రమించకుండా ఉండే స్వేచ్ఛ’ అని కూడా అనవచ్చు. ఇక్కడ భావం: పరిచర్యలో పోషణ పొందుతూ, స్వపోషణ కోసం శారీరక పని చేయకుండా ఉండే హక్కు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: లేకపోతే
  rationale: పౌలు వాదనలో తదుపరి అలంకారప్రశ్నను అనుసంధానిస్తుంది; ఆధునిక తెలుగులో సహజమైన ప్రశ్నారంభం.
- source_word: μόνος
  choice: మాత్రమే
  rationale: ‘నాకు, బర్నబాకు’ అనే ఉమ్మడి కర్తకు మాత్రమే ఈ మినహాయింపు వర్తిస్తుందా అనే ప్రత్యేకతను తెలియజేస్తుంది.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: నాకు, బర్నబాకు
  rationale: గ్రీకు క్రమంలోని ఇద్దరినీ నిలుపుతూ, తెలుగు వాక్యనిర్మాణానికి సహజంగా దత్తివిభక్తిలో అందిస్తుంది.
- source_word: οὐκ ἔχομεν
  choice: లేదా?
  rationale: ‘మాకు లేదు’ అనే నిరాకరణను ‘హక్కు ... లేదా?’ అనే సహజమైన తెలుగు అలంకారప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: ἐξουσίαν
  choice: హక్కు
  rationale: ఇక్కడ పరిపాలనా అధికారం కంటే అపొస్తలులకు న్యాయంగా ఉన్న అర్హత లేదా స్వేచ్ఛ ఉద్దేశించబడింది.
- source_word: μὴ ἐργάζεσθαι
  choice: పని చేయకుండా ఉండే
  rationale: స్వపోషణ కోసం శారీరక పని చేయకుండ ఉండటాన్ని సూచించే గ్రీకు భావాన్ని, వాక్యంలో లేనిదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో ἐξουσίαν మరియు μὴ ἐργάζεσθαι యొక్క భావం
  choice: పని చేయకుండా ఉండే హక్కు
  alternative: సేవలో పోషణ పొందేందుకు స్వపోషణ పని మానుకునే హక్కు
  rationale: తక్షణ సందర్భం అపొస్తలుల భౌతిక పోషణ హక్కును సూచించినా, మూల వాక్యం దానిని సంక్షిప్తంగా ఉంచుతుంది. అందువల్ల ప్రధాన పాఠ్యంలో అస్పష్టతను నిలిపి, సందర్భార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే అలంకారప్రశ్న. ‘హక్కు’ సమకాలీన సందర్భంలో ἐξουσία యొక్క అర్థాన్ని స్పష్టంగా అందిస్తుంది.
