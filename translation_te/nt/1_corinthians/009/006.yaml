- from: లేకపోతే, పని చేయకుండా ఉండే హక్కు నాకు, బర్నబాకు మాత్రమే లేదా?[a]
  to: లేక నేను, బర్నబా మాత్రమే పని చేయకుండా ఉండే హక్కు లేనివారమా?[a]
  rationale: The revision replaces the conditional-sounding connective with the direct disjunctive ‘లేక’ and restores ‘I and Barnabas’ as an explicit coordinated plural subject. It retains the draft’s suitably concise rendering of the right not to work and preserves the contextual explanation in the footnote.
