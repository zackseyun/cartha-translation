revisions:
- from: అయితే నేను నా శరీరాన్ని కఠినంగా అదుపుచేసి[a], దాన్ని బానిసగా చేసుకుంటాను[b]. ఇతరులకు ప్రకటించిన తర్వాత నేనే అనర్హుణ్ణి కాకుండా ఉండేందుకు ఇలా చేస్తాను[c].
  to: అయితే నేను నా శరీరాన్ని కఠినంగా శాసించి[a], దాన్ని బానిసగా చేసుకుంటాను[b]. ఇతరులకు ప్రకటించిన తర్వాత నేనే ఏమైనా అనర్హుడనై పోకూడదనే భయంతో ఇలా చేస్తాను[c].
  rationale: సవరణ μή πως యొక్క ‘ఏమైనా ... పోకూడదనే భయం’ అనే ఆశంకను స్పష్టపరుస్తుంది. ‘అనర్హుడు’ పదాన్ని అలాగే ఉంచడం ద్వారా ἀδόκιμος యొక్క క్రీడా/పరీక్ష సందర్భం నిలిచి, అంతిమ రక్షణ, సేవ, లేదా బహుమతి గురించి ఏ నిర్దిష్ట సిద్ధాంత వివరణను రుద్దదు. పాదసూచన గుర్తులు మరియు వాటి విషయాలు సరైన స్థానాల్లో, మూలపదాల ప్రత్యామ్నాయ అర్థాలకు అనుగుణంగా ఉన్నాయి.
