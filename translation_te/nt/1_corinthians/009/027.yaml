id: 1CO.9.27
reference: 1 Corinthians 9:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: te
  text: అయితే నేను నా శరీరాన్ని కఠినంగా శాసించి[a], దాన్ని బానిసగా చేసుకుంటాను[b]. ఇతరులకు ప్రకటించిన తర్వాత నేనే ఏమైనా అనర్హుడనై పోకూడదనే భయంతో ఇలా చేస్తాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా శరీరాన్ని బలంగా కొడతాను.’ గ్రీకు క్రియ అక్షరార్థంగా కంటి కింద కొట్టడాన్ని సూచిస్తుంది; ఇక్కడ తీవ్రమైన స్వీయక్రమశిక్షణకు రూపకంగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దాన్ని బానిసత్వంలోకి తెస్తాను’ లేదా ‘దాన్ని బానిసగా చేసుకుంటాను.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘తిరస్కరించబడినవాణ్ణి’ లేదా ‘పరీక్షలో ఆమోదం పొందనివాణ్ణి.’ ‘అనర్హుడు’ అనే పదం సందర్భంలోని క్రీడా రూపకానికి సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: కఠినంగా అదుపుచేసి
  rationale: ఈ క్రియ అక్షరార్థంగా కంటి కింద కొట్టడాన్ని సూచించగలదు; ఇక్కడ క్రీడా రూపకంలో తీవ్రమైన శారీరక స్వీయక్రమశిక్షణను సూచిస్తుంది. సహజమైన తెలుగులో రూపక బలాన్ని నిలుపుతూ, స్వహాని అనే అపార్థాన్ని ప్రధాన పాఠ్యంలో నివారిస్తుంది.
- source_word: σῶμα
  choice: శరీరాన్ని
  rationale: పౌలు స్పష్టంగా శరీరాన్నే క్రియకు కర్మగా పేర్కొన్నందున సాధారణీకరించకుండా concrete పదాన్ని నిలిపింది.
- source_word: δουλαγωγῶ
  choice: దాన్ని బానిసగా చేసుకుంటాను
  rationale: ఈ క్రియ బానిసత్వంలోకి తేవడం లేదా బానిసగా చేసుకోవడం అనే బలమైన భావాన్ని ఇస్తుంది; ‘అదుపులో ఉంచుతాను’ కంటే మూలంలోని రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: μή πως
  choice: కాకుండా ఉండేందుకు
  rationale: ప్రతికూల ఉద్దేశం/ఆశంకను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సంభావ్యతను పూర్తిగా తొలగించకుండా వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: ἄλλοις
  choice: ఇతరులకు
  rationale: κηρύξας‌తో వచ్చిన దత్తివిభక్తి తెలుగులో సహజంగా ‘ఇతరులకు’ అవుతుంది.
- source_word: κηρύξας
  choice: ప్రకటించిన తర్వాత
  rationale: అయోరిస్ట్ పార్టిసిపిల్ ప్రధాన క్రియకంటే ముందుగా జరిగిన చర్యను సూచిస్తుంది; ‘తర్వాత’ ఆ కాల సంబంధాన్ని స్పష్టంగా తెలుపుతుంది. κηρύσσω యొక్క బహిరంగ ప్రకటన భావాన్ని ‘ప్రకటించడం’ నిలుపుతుంది.
- source_word: ἀδόκιμος
  choice: అనర్హుణ్ణి
  rationale: పరీక్షలో ఆమోదం పొందని లేదా ప్రమాణానికి సరిపోని భావాన్ని తెలుపుతుంది. సందర్భంలోని క్రీడా రూపకానికి సరిపోతూ, రక్షణ కోల్పోవడం లేదా కేవలం బహుమతి కోల్పోవడం అనే ఏ ఒక్క సిద్ధాంతాన్నీ నిర్ణయించదు.
- source_word: γένωμαι
  choice: కాకుండా ఉండేందుకు
  rationale: భయపడుతున్న భవిష్యత్ ఫలితాన్ని తెలుగులో ఉద్దేశార్థక నిర్మాణంతో సహజంగా వ్యక్తం చేస్తుంది; ‘అనర్హుణ్ణి అవడం’ అనే prospective భావం అంతర్భూతంగా ఉంది.
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందటి వాక్యాలతో ఉన్న బలమైన వ్యత్యాసాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: పౌలు ἀδόκιμος కావచ్చనే భయానికి అర్థం
  choice: ‘అనర్హుడు’గా అనువదించి హెచ్చరిక యొక్క తీవ్రతను, పరీక్ష/క్రీడా సందర్భాన్ని నిలిపింది.
  alternative: దేవునిచేత అంతిమంగా తిరస్కరించబడటం; లేదా సేవకు/బహుమతికి మాత్రమే అనర్హుడవటం.
  rationale: గ్రీకు పదం ఈ వివాదాస్పద సిద్ధాంత ప్రశ్నను స్వయంగా తేల్చదు. అందువల్ల రక్షణ కోల్పోవడమో, కేవలం సేవా బహుమతి కోల్పోవడమో అని పరిమితం చేయకుండా theological tension‌ను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. శరీర నియంత్రణకు సంబంధించిన రెండు బలమైన గ్రీకు రూపకాలను ప్రధాన పాఠ్యం మరియు పాదసూచనల ద్వారా నిలిపింది. అన్ని పాదసూచన గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
