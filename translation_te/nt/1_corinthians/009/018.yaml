id: 1CO.9.18
reference: 1 Corinthians 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: te
  text: అయితే నా ప్రతిఫలం ఏమిటి? నేను శుభవార్తను[a] ప్రకటిస్తున్నప్పుడు దాన్ని ఉచితంగా అందించడమే—తద్వారా శుభవార్త విషయంలో నాకు ఉన్న హక్కును పూర్తిగా వినియోగించుకోకుండా ఉండడమే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సువార్త”; ఈ వచనమంతటా.
    reason: lexical_alternative
  - marker: b
    text: లేదా “శుభవార్త సేవలో నాకు ఉన్న హక్కును పూర్తిగా వినియోగించుకోకుండా ఉండడమే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: ప్రతిఫలం
  rationale: ఇక్కడ ఇది కేవలం జీతాన్ని కాక, పౌలు తన సేవలో పొందే ఫలాన్ని సూచిస్తుంది; ఉచితంగా ప్రకటించడమే తన ‘ప్రతిఫలం’ అని చెప్పే భావాన్ని నిలుపుతుంది.
- source_word: εὐαγγελιζόμενος
  choice: శుభవార్తను ప్రకటిస్తున్నప్పుడు
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలీనమైన చర్యను సూచిస్తుంది; ఈ రూపం దాని క్రియాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀδάπανον
  choice: ఉచితంగా
  rationale: ఖర్చు లేదా రుసుము లేకుండా అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: దాన్ని … అందించడమే
  rationale: అక్షరార్థంగా ‘శుభవార్తను ఉంచడం’ అయినా, సందర్భంలో దాన్ని ప్రజల ముందుంచడం లేదా అందించడం అనే నుడికార భావం ఉంది.
- source_word: εὐαγγέλιον
  choice: శుభవార్త
  rationale: గ్రీకు పదపు సాధారణ అర్థాన్ని పారదర్శకంగా, ఆధునిక పాఠకులకు సులభంగా తెలియజేస్తుంది; సంప్రదాయ రూపమైన ‘సువార్త’ను పాదసూచికలో ఉంచాం.
- source_word: καταχρήσασθαι
  choice: పూర్తిగా వినియోగించుకోకుండా
  rationale: ఈ సందర్భంలో తనకు న్యాయంగా ఉన్న హక్కును పూర్తిగా ఉపయోగించకపోవడమే భావం; దుర్వినియోగం చేశాడనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: ἐξουσίᾳ
  choice: హక్కు
  rationale: 1 కొరింథీయులు 9 సందర్భంలో సేవకు భౌతిక సహాయం పొందే న్యాయమైన అర్హత ప్రధానంగా ఉద్దేశించబడింది; ‘హక్కు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: శుభవార్త విషయంలో
  rationale: గ్రీకు పదబంధంలోని సంక్షిప్తతను, శుభవార్తకు సంబంధించిన హక్కు అనే విస్తృత భావాన్ని కాపాడుతుంది; ‘శుభవార్త సేవలో’ అనే సందర్భానుగుణ ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
theological_decisions:
- issue: ఈ సందర్భంలో పౌలుకు ఉన్న ἐξουσία స్వభావం
  choice: శుభవార్త సేవలో సహాయం పొందేందుకు పౌలుకు ఉన్న న్యాయమైన హక్కు; దాన్ని అతడు స్వచ్ఛందంగా పూర్తిగా వినియోగించుకోలేదు.
  alternative: సాధారణ అపొస్తల అధికారమని తీసుకోవడం; లేదా అధికారాన్ని దుర్వినియోగం చేయడమనే భావంగా తీసుకోవడం.
  rationale: 1 కొరింథీయులు 9 పరిసర సందర్భం సేవకునికి భౌతిక సహాయం పొందే హక్కును పదేపదే చర్చిస్తుంది. అందుకే ‘హక్కు’, ‘పూర్తిగా వినియోగించుకోకుండా’ అని అనువదించాం; అక్రమమైన అధికార వినియోగాన్ని సూచించే భాషను చేర్చలేదు.
- issue: εὐαγγέλιον పదానికి అనువాదం
  choice: శుభవార్త
  alternative: సువార్త
  rationale: ‘శుభవార్త’ మూలపదపు అర్థాన్ని నేరుగా, సులభంగా తెలియజేస్తుంది. విస్తృతంగా వాడుకలో ఉన్న సంప్రదాయ రూపం ‘సువార్త’ను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రతిఫలం’, ‘హక్కు’ వంటి పదాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండి, సందర్భంలోని అలంకారిక ఉద్వేగాన్ని మరియు న్యాయమైన హక్కును స్వచ్ఛందంగా వదులుకునే భావాన్ని నిలుపుతాయి.
