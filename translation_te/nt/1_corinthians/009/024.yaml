id: 1CO.9.24
reference: 1 Corinthians 9:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: te
  text: పందెపు మైదానంలో పరుగెత్తేవారందరూ పరుగెత్తుతారు గాని, బహుమానం పొందేది ఒక్కరేనని మీకు తెలియదా? అలాగే మీరు దానిని పొందేలా పరుగెత్తండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు దానిని పట్టుకునేలా అలాగే పరుగెత్తండి.” καταλάβητε అనే గ్రీకు పదానికి ‘పొందడం,’ ‘పట్టుకోవడం,’ లేదా ‘చేరుకోవడం’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: మీకు తెలియదా?
  rationale: పౌలు వాడే అలంకారిక ప్రశ్న రూపాన్ని, οἶδα యొక్క సాధారణ ‘తెలుసు’ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν σταδίῳ
  choice: పందెపు మైదానంలో
  rationale: στάδιον సూచించే పరుగు పోటీ జరిగే నిర్దిష్ట స్థలాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘పందెంలో’ అని సాధారణీకరించదు.
- source_word: τρέχοντες ... τρέχουσιν
  choice: పరుగెత్తేవారందరూ పరుగెత్తుతారు
  rationale: మూలంలోని τρέχω పద పునరుక్తిని, సజీవమైన క్రీడా రూపకాన్ని నిలుపుతుంది.
- source_word: πάντες μὲν ... εἷς δὲ
  choice: అందరూ ... గాని ... ఒక్కరే
  rationale: μέν...δέ వ్యత్యాసాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: λαμβάνει
  choice: పొందుతారు
  rationale: ‘గెలుచుకుంటారు’ అనే మరింత వ్యాఖ్యానాత్మక క్రీడా పదానికి బదులు λαμβάνει యొక్క ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: τὸ βραβεῖον
  choice: బహుమానం
  rationale: పోటీలో విజేతకు ఇచ్చే బహుమతిని సూచించే సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: οὕτως τρέχετε
  choice: అలాగే పరుగెత్తండి
  rationale: ముందున్న పందెపు దృష్టాంతానికి అనుసంధానం చేస్తూ, వర్తమాన ఆజ్ఞ యొక్క బలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἵνα καταλάβητε
  choice: మీరు దానిని పొందేలా
  rationale: καταλαμβάνω లోని ‘పొందు/చేరుకొను/పట్టుకొను’ భావ పరిధిలో, బహుమాన రూపకానికి సహజంగా సరిపోతుంది; ‘దానిని’ అనేది ముందున్న బహుమానాన్ని సూచిస్తుంది.
theological_decisions:
- issue: క్రైస్తవ పట్టుదలకు వర్తింపజేసిన క్రీడా రూపకం
  choice: పోటీ పరుగు రూపకాన్ని నిలుపుతూ, బహుమానం పొందాలనే లక్ష్యంతో పరుగెత్తమనే ప్రబోధంగా అనువదించడం
  alternative: ‘గెలవడానికి పరుగెత్తండి’ అని మరింత వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: వాక్యం పట్టుదలతో, లక్ష్యపూర్వకంగా సాగాలని ప్రోత్సహిస్తుంది; అయితే రక్షణ, ప్రతిఫలం, యోగ్యతల గురించిన ప్రత్యేక సిద్ధాంతాన్ని మూలపాఠం కంటే అధికంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని అలంకారిక ప్రశ్న, పద పునరుక్తి, పందెపు రూపకం నిలుపబడ్డాయి. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
