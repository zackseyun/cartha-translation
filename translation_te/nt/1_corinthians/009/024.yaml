- from: పందెపు మైదానంలో పరుగెత్తేవారందరూ పరుగెత్తుతారు గాని, బహుమానం ఒక్కరే పొందుతారని మీకు తెలియదా? మీరు దానిని పొందేలా అలాగే పరుగెత్తండి.[a]
  to: పందెపు మైదానంలో పరుగెత్తేవారందరూ పరుగెత్తుతారు గాని, బహుమానం పొందేది ఒక్కరేనని మీకు తెలియదా? అలాగే మీరు దానిని పొందేలా పరుగెత్తండి.[a]
