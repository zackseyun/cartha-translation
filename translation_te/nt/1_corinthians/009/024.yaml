  - severity: low
    issue: 'Footnote alternative has redundant/awkward ordering: “పట్టుకునేలా అలా పరుగెత్తండి.”'
    rationale: The lexical alternative is valid, but “దానిని పట్టుకునేలా అలాగే పరుగెత్తండి” is more idiomatic and directly parallels the main text.
