review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys ἐξουσίαν as “హక్కు,” περιάγειν as taking a wife along, and retains Κηφᾶς as “కేఫా.” The meaning of ἀδελφὴν γυναῖκα is correctly understood as a wife who is a fellow believer. “ఇతర అపొస్తలులు” is acceptable, though “మిగిలిన అపొస్తలులు” more exactly reflects οἱ λοιποί (“the rest”).
  naturalness: The verse is generally clear and modern. Replacing “విశ్వాసినియైన భార్య” with “విశ్వాసి అయిన భార్య” is more idiomatic modern standard Telugu and avoids the somewhat stiff compounded form. The revised ordering maintains a natural Telugu rhetorical question.
  terminology: “హక్కు,” “ప్రభువు సహోదరులు,” and “కేఫా” are appropriate. “ప్రభువు సహోదరులు” properly leaves the precise familial relationship unresolved. The footnote preserves the literal paired expression without imposing a doctrinal interpretation.
  issues:
  - severity: low
    issue: “ఇతర అపొస్తలులు” is less precise than the Greek οἱ λοιποί.
    rationale: οἱ λοιποί denotes the remaining/rest of a defined group. “మిగిలిన అపొస్తలులు” conveys this nuance more directly.
  - severity: low
    issue: “విశ్వాసినియైన భార్య” is stylistically less natural in contemporary standard Telugu.
    rationale: “విశ్వాసి అయిన భార్య” communicates a wife who is a fellow believer more smoothly while preserving the intended sense of ἀδελφὴν γυναῖκα.
  revised_text: మిగిలిన అపొస్తలులకు, ప్రభువు సహోదరులకు, కేఫాకు ఉన్నట్లే, విశ్వాసి అయిన భార్యను[a] వెంట తీసుకువెళ్లే హక్కు మాకు లేదా?
  revised_footnotes:
