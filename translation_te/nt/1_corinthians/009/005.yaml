  to: మిగిలిన అపొస్తలులకు, ప్రభువు సహోదరులకు, కేఫాకు ఉన్నట్లే, విశ్వాసి అయిన భార్యను[a] వెంట తీసుకువెళ్లే హక్కు మాకు లేదా?
  rationale: 'Two small wording adjustments improve source precision and contemporary Telugu idiom: “మిగిలిన” reflects οἱ λοιποί more closely, and “విశ్వాసి అయిన భార్య” is a natural expression for a wife who is also a sister in the faith. The wording continues to avoid resolving debates concerning “the brothers of the Lord.”'
