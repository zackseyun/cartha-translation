id: 1CO.9.5
reference: 1 Corinthians 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: te
  text: మిగిలిన అపొస్తలులకు, ప్రభువు సహోదరులకు, కేఫాకు ఉన్నట్లే, విశ్వాసి అయిన భార్యను[a] వెంట తీసుకువెళ్లే హక్కు మాకు లేదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒక సహోదరిని, భార్యను”—అంటే, తోటి విశ్వాసి అయిన భార్యను.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: హక్కు
  rationale: ఈ సందర్భంలో పౌలు సాధారణ అధికారాన్ని కాక, అపొస్తలునికి న్యాయంగా ఉన్న అర్హతను గురించి మాట్లాడుతున్నాడు; అందువల్ల ‘హక్కు’ సహజంగా, సందర్భానుగుణంగా ఉంది.
- source_word: ἀδελφὴν γυναῖκα
  choice: విశ్వాసినియైన భార్యను
  rationale: ఈ జత పదాలు ‘విశ్వాసంలో సహోదరి అయిన భార్య’ను సూచిస్తాయి. తెలుగులో అపార్థం కలగకుండా భార్య అనే భావాన్నీ, తోటి విశ్వాసి అనే భావాన్నీ ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: περιάγειν
  choice: వెంట తీసుకువెళ్లే
  rationale: పరిచర్య ప్రయాణాల్లో తనతో కూడ తీసుకువెళ్లడాన్ని ఈ క్రియ సూచిస్తుంది; ‘వెంట తీసుకువెళ్లే’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ὡς καὶ
  choice: ఉన్నట్లే
  rationale: ఇతరులకు కూడా ఇదే హక్కు ఉందనే తులనాత్మక, సంకలన భావాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: ఇతర అపొస్తలులు
  rationale: λοιποί ఇక్కడ అదే వర్గంలోని మిగిలినవారిని సూచిస్తుంది; ‘ఇతర అపొస్తలులు’ స్పష్టమైన సహజ తెలుగు.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: ప్రభువు సహోదరులు
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని నేరుగా నిలుపుతుంది; వారి కుటుంబ సంబంధం స్వరూపాన్ని అనువాదమే నిర్ణయించదు.
- source_word: Κηφᾶς
  choice: కేఫా
  rationale: మూలపాఠంలో ఉన్న Κηφᾶς అనే నామరూపాన్నే ‘పేతురు’గా మార్చకుండా లిప్యంతరీకరించింది.
theological_decisions:
- issue: ‘ప్రభువు సహోదరులు’ అనే పదబంధం యొక్క అర్థం
  choice: పదబంధాన్ని నేరుగా ‘ప్రభువు సహోదరులు’ అని అనువదించడం
  alternative: యేసు యొక్క సొంత తమ్ముళ్లు/అన్నదమ్ములు; సవతి సహోదరులు; సమీప బంధువులు
  rationale: గ్రీకు పదబంధం వారిని ప్రభువు సహోదరులని పేర్కొంటుంది గాని, వారి ఖచ్చితమైన కుటుంబ సంబంధంపై తరువాతి సిద్ధాంత వివాదాలను తానే పరిష్కరించదు.
- issue: ἀδελφὴν γυναῖκα యొక్క భావం
  choice: ‘విశ్వాసినియైన భార్య’ అని ప్రధాన పాఠంలో ఇవ్వడం
  alternative: ‘సహోదరిని భార్యగా’; ‘విశ్వాసంలో సహోదరి అయిన భార్య’
  rationale: ఈ పదబంధం కేవలం ఒక స్త్రీ సహచరిని కాక, విశ్వాసంలో సహోదరి కూడా అయిన భార్యను సూచించడం అత్యంత సహజం. గ్రీకు పదాల అక్షరరూపాన్ని పాదసూచికలో నిలిపి ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. గ్రీకు ప్రశ్నలోని ప్రతికూల నిర్మాణాన్ని ‘మాకు లేదా?’గా సహజంగా నిలిపాం; జాబితాను ముందుంచి తెలుగు వాక్యప్రవాహాన్ని మెరుగుపరిచాం.
