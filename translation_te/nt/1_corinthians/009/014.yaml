id: 1CO.9.14
reference: 1 Corinthians 9:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ κύριος διέταξεν τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν ἐκ τοῦ εὐαγγελίου ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: te
  text: అదే విధంగా, సువార్తను ప్రకటించేవారు[a] సువార్త ద్వారా జీవించాలని[b] ప్రభువు కూడా ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సువార్తను బోధించేవారు.’
    reason: lexical_alternative
  - marker: b
    text: అంటే, ‘సువార్త సేవ ద్వారా తమ జీవనోపాధి పొందాలని.’
    reason: lexical_clarification
lexical_decisions:
- source_word: οὕτως
  choice: అదే విధంగా
  rationale: ముందున్న ఉదాహరణలతో పోలికను స్పష్టంగా తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: καὶ
  choice: కూడా
  rationale: ముందు పేర్కొన్న ఆధారాలకు తోడు ప్రభువు ఇచ్చిన ఆజ్ఞను సూచించే సంకలిత భావాన్ని నిలుపుతుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: κύριοςకు స్థిరమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం; మూలంలో లేని ‘యేసు’ అనే వివరణను వాక్యంలో చేర్చదు.
- source_word: διέταξεν
  choice: ఆజ్ఞాపించాడు
  rationale: ఇక్కడ అధికారపూర్వకమైన నిర్దేశాన్ని తెలియజేస్తుంది; కేవలం ఏర్పాటు చేశాడనే భావం కాదు.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: ప్రకటించేవారు
  rationale: నామవాచకార్థంలో వాడిన కృదంతాన్ని సహజమైన తెలుగు రూపంలో ఇస్తూ, బహిరంగంగా తెలియజేయడం అనే καταγγέλλω భావాన్ని నిలుపుతుంది.
- source_word: τὸ εὐαγγέλιον
  choice: సువార్త
  rationale: పౌలు పత్రికల సందర్భంలో స్థిరమైనదీ సాధారణ పాఠకులకు అర్థమయ్యేదీ అయిన పదం.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: సువార్త ద్వారా
  rationale: ἐκ సూచించే జీవనాధార మూలాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; సందర్భం దీనిని సువార్త సేవ ద్వారా లభించే పోషణగా స్పష్టం చేస్తుంది.
- source_word: ζῆν
  choice: జీవించాలని
  rationale: διέταξενపై ఆధారపడిన infinitiveలోని ఆజ్ఞాత్మక భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, మూలంలోని ‘జీవించు’ రూపకల్పనను నిలుపుతుంది.
theological_decisions:
- issue: ‘ప్రభువు’ ఎవరిని సూచిస్తుంది
  choice: వాక్యంలో ‘ప్రభువు’ అనే మూల పదాన్నే నిలుపడం; సందర్భంలో ఇది సహజంగా యేసును సూచిస్తుంది
  alternative: సాధారణ దైవసూచనగా గ్రహించడం లేదా వాక్యంలోనే ‘ప్రభువైన యేసు’ అని విస్తరించడం
  rationale: పౌలు వాదనలో ఇది యేసు బోధకు సూచన కావడం అత్యంత సహజం. అయితే మూలపాఠం ‘యేసు’ అని స్పష్టంగా చేర్చనందున అనువాదం కూడా దానిని విస్తరించదు.
- issue: ‘సువార్త ద్వారా జీవించడం’ అనే మాటలోని సహాయం స్వభావం
  choice: సువార్త ప్రకటించే సేవ ద్వారా జీవనోపాధి పొందడం
  alternative: సువార్త వల్ల ఆధ్యాత్మిక జీవం పొందడం
  rationale: చుట్టుపక్కల సందర్భం సేవకులు భౌతిక పోషణ పొందే హక్కును చర్చిస్తుంది. ప్రధాన పాఠం మూలంలోని ‘జీవించు’ భాషను నిలుపుతూ, పాదసూచిక ఉద్దేశించిన జీవనోపాధి భావాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సువార్త’, ‘ప్రభువు’, ‘ఆజ్ఞాపించాడు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణంతో ఉపయోగించాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
