id: 1CO.9.2
reference: 1 Corinthians 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: te
  text: ఇతరులకు నేను అపొస్తలుణ్ణి కాకపోయినా, మీకు మాత్రం తప్పకుండా అపొస్తలుణ్ణే. ఎందుకంటే ప్రభువులో నా అపొస్తలత్వానికి ముద్ర[a] మీరే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రుజువు,’ ‘ప్రామాణికతను నిర్ధారించేది.’ గ్రీకు మూలంలో ‘ముద్ర’ అనే పదం ఉంది; ఏదైనా నిజమైనదని ధ్రువీకరించే ముద్ర రూపకాన్ని అది నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: అపొస్తలుడు
  rationale: పౌలు తన అధికారిక పిలుపు, నియామకం గురించి మాట్లాడుతున్నందున సాధారణ ‘దూత’ అనే అర్థం కాకుండా స్థిరపడిన సాంకేతిక పదాన్ని వాడాం.
- source_word: ἀλλά γε
  choice: మీకు మాత్రం తప్పకుండా ... అపొస్తలుణ్ణే
  rationale: ἀλλά తెలిపే వ్యత్యాసాన్ని ‘మాత్రం’తో, γε ఇచ్చే నొక్కిచెప్పే భావాన్ని ‘తప్పకుండా’ మరియు ‘-ణ్ణే’తో సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: σφραγίς
  choice: ముద్ర
  rationale: పౌలు అపొస్తలత్వం నిజమైనదని ధ్రువీకరించే ముద్ర అనే మూలభాష రూపకాన్ని నిలిపాం; సందర్భంలో దీనికి రుజువు లేదా ప్రామాణికతను నిర్ధారించేది అనే భావం ఉంది.
- source_word: ἀποστολή
  choice: అపొస్తలత్వం
  rationale: ఇక్కడ ఈ పదం పౌలు అపొస్తలునిగా పొందిన నియామకం, హోదా, సేవను సూచిస్తుంది; ‘అపొస్తలత్వం’ ఆ సాంకేతిక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు వాడే సంబంధాత్మక పదబంధాన్ని యథాతథంగా నిలిపాం. కొరింథీయులు ప్రభువుతో ఉన్న సంబంధంలోనే పౌలు అపొస్తలత్వాన్ని ధ్రువీకరిస్తున్నారనే భావాన్ని ఇది తెరిచి ఉంచుతుంది.
- source_word: ἄλλοις
  choice: ఇతరులకు
  rationale: దత్తి విభక్తి తెలిపే సంబంధాన్ని తెలుగులో సహజంగా ‘ఇతరులకు’ అని అనువదించాం.
theological_decisions:
- issue: పౌలు తన అపొస్తలత్వం గురించి చేస్తున్న వాదన పరిధి
  choice: ఇతరుల విషయంలో తన అపొస్తలత్వాన్ని ఎవరైనా అంగీకరించకపోయినా, కొరింథీయుల విషయంలో అది నిశ్చయమని పౌలు బలంగా చెబుతున్నాడు; ప్రభువులో వారి ఉనికే దానికి ధ్రువీకరణ.
  alternative: పౌలు అసలు ఇతరులకు అపొస్తలుడు కాదనీ, కొరింథీయులకు మాత్రమే పరిమితమైన అర్థంలో అపొస్తలుడనీ చెబుతున్నాడు.
  rationale: షరతుతో కూడిన వాక్య నిర్మాణం మరియు సందర్భంలోని సమర్థనాత్మక వాదన పౌలు సేవను అక్షరార్థంగా ఒక సంఘానికే పరిమితం చేయవు. అయినప్పటికీ ‘ఇతరులకు ... కాకపోయినా’ అనే మూలంలోని వాక్చాతుర్యపూర్వక ఉద్రిక్తతను అనువాదంలో తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచనశైలిలో అనువదించాం. ‘అపొస్తలుడు,’ ‘అపొస్తలత్వం’ వంటి స్థిరపడిన క్రైస్తవ సాంకేతిక పదాలను ఉంచి, మిగతా వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం. మూలంలోని ‘ముద్ర’ రూపకాన్ని ప్రధాన వచనంలో నిలిపి, దాని ధ్రువీకరణ భావాన్ని పాదసూచికలో వివరించాం.
