id: 1CO.9.9
reference: 1 Corinthians 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: te
  text: 'ఎందుకంటే మోషే ధర్మశాస్త్రంలో ఇలా వ్రాయబడి ఉంది: “నూర్పిడి చేస్తున్న[a] ఎద్దు మూతికి చిక్కం వేయకూడదు.” దేవునికి ఎద్దుల పట్ల శ్రద్ధ ఉందా?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధాన్యాన్ని తొక్కుతున్న.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: ఎందుకంటే మోషే ధర్మశాస్త్రంలో
  rationale: ἐν అనే విభక్తి సంబంధాన్ని సహజమైన తెలుగులో ‘లో’తో చూపిస్తూ, Μωϋσέως νόμῳను సుపరిచితమైన ‘మోషే ధర్మశాస్త్రం’గా అందిస్తుంది. γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ నిలుపుతుంది.
- source_word: γέγραπται
  choice: ఇలా వ్రాయబడి ఉంది
  rationale: లేఖనాన్ని ఉదహరించే పరిపూర్ణ కర్మణి సూత్రాన్ని తెలుగులో సహజంగా, అధికారభావం చెడకుండా వ్యక్తం చేస్తుంది.
- source_word: Οὐ κημώσεις
  choice: మూతికి చిక్కం వేయకూడదు
  rationale: భవిష్యత్ సూచక రూపంలో ఉన్న నిషేధాన్ని తెలుగు న్యాయశైలి నిషేధంగా ‘వేయకూడదు’ అని అందిస్తుంది. κημόω సూచించే తినకుండా అడ్డుకునే muzzleను ‘మూతికి చిక్కం వేయడం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: βοῦν
  choice: ఎద్దు
  rationale: ఈ వ్యవసాయ పనిలో ఉపయోగించే ఏకవచన bovine పనిజంతువుకు ‘ఎద్దు’ ఖచ్చితమైన, సాధారణ తెలుగు పదం.
- source_word: ἀλοῶντα
  choice: నూర్పిడి చేస్తున్న
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను నిలుపుతూ, ధాన్యాన్ని గింజలుగా వేరుచేసే పనిని సహజంగా వ్యక్తం చేస్తుంది. ఎద్దు ధాన్యాన్ని తొక్కే విధానాన్ని ప్రత్యామ్నాయంగా పాదటీకలో ఇస్తుంది.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: దేవునికి ఎద్దుల పట్ల శ్రద్ధ ఉందా?
  rationale: μή సూచించే ప్రతికూల సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను ప్రశ్నగానే ఉంచుతుంది. గ్రీకులో లేని ‘మాత్రమే/గురించే’ అనే భావాన్ని చేర్చకుండా, μέλει యొక్క శ్రద్ధ/పట్టింపు భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: జంతువుల పట్ల దేవుని శ్రద్ధ గురించి పౌలు వేసిన అలంకారిక ప్రశ్న
  choice: దేవునికి ఎద్దుల పట్ల శ్రద్ధ ఉందా?
  alternative: దేవుడు ఎద్దుల గురించే శ్రద్ధ చూపుతున్నాడా?
  rationale: మూలపాఠంలో μήతో నేరుగా అలంకారిక ప్రశ్న ఉంది. ‘గురించే’ లేదా ‘మాత్రమే’ అని చేరిస్తే ప్రశ్నను తులనాత్మక భావంగా ముందే వ్యాఖ్యానించినట్టవుతుంది. అందువల్ల దేవుని జంతు సంరక్షణను సంపూర్ణంగా నిరాకరిస్తున్నాడా లేక ధర్మశాస్త్రపు విస్తృత ఉద్దేశాన్ని చెబుతున్నాడా అనే ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘చిక్కం’ వ్యవసాయ సందర్భంలోని muzzleను సంక్షిప్తంగా తెలియజేస్తుంది; అవసరమైన చర్యను ‘మూతికి’ అనే పదంతో స్పష్టం చేసింది. పాదటీక గుర్తును అది వివరిస్తున్న ‘నూర్పిడి చేస్తున్న’ పదబంధం దగ్గరే ఉంచబడింది.
