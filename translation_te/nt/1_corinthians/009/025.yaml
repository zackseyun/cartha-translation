  source_fidelity: 'గ్రీకు వచనంలోని సమగ్రార్థం సరిగ్గా ప్రతిఫలించింది: పోటీదారుల సమస్త విషయాలలోని స్వీయనిగ్రహం, నశించే στέφανος పొందాలనే ఉద్దేశం, అలాగే ‘మనము’ పొందబోయే నశించనిది అనే వ్యతిరేకత అన్నీ నిలిచాయి. చివరి భాగంలో గ్రీకులో లోపించిన ‘పొందడం/అలా చేయడం’ భావాన్ని తెలుగులో సహజంగా పూరించడం సముచితం; ‘నశించనిదాన్ని’కు ముందరి ‘కిరీటం’ స్పష్టమైన పూర్వసూచకం.'
