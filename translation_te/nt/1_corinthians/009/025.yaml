source:
  edition: SBLGNT
  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: te
  text: పోటీలో పాల్గొనే ప్రతి ఒక్కరూ అన్ని విషయాల్లో ఆత్మనిగ్రహం పాటిస్తారు. వారు నశించిపోయే కిరీటాన్ని[a] పొందడానికి అలా చేస్తారు; మనమైతే నశించనిదాన్ని పొందడానికి అలా చేస్తాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విజయమాల’; ఇక్కడి గ్రీకు పదం క్రీడా పోటీల్లో విజేతకు బహూకరించే పూల లేదా ఆకుల దండను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀγωνιζόμενος
  choice: పోటీలో పాల్గొనే ప్రతి ఒక్కరూ
  rationale: అథ్లెటిక్స్ సందర్భంలోని పోటీ భావాన్ని, సాధారణంగా అందరికీ వర్తించే ఏకవచన నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάντα ἐγκρατεύεται
  choice: అన్ని విషయాల్లో ఆత్మనిగ్రహం పాటిస్తారు
  rationale: πάντα సూచించే విస్తృత పరిధిని కాపాడుతూ, ἐγκρατεύεταιలోని అలవాటైన స్వీయనియంత్రణ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐκεῖνοι μὲν οὖν ἵνα ... λάβωσιν
  choice: వారు ... పొందడానికి అలా చేస్తారు
  rationale: ముందు పేర్కొన్న పోటీదారులను తిరిగి సూచిస్తూ, ἵνα యొక్క ఉద్దేశ భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: φθαρτὸν στέφανον
  choice: నశించిపోయే కిరీటాన్ని
  rationale: φθαρτός–ἄφθαρτος వ్యతిరేకతను నిలుపుతుంది; στέφανοςను సంక్షిప్తంగా ‘కిరీటం’గా ఇచ్చి దాని క్రీడా సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: మనమైతే నశించనిదాన్ని పొందడానికి అలా చేస్తాం
  rationale: గ్రీకులో రెండో భాగంలో లోపింపబడిన ‘కిరీటం పొందడం’ అనే భావాన్ని తెలుగులో స్పష్టత కోసం క్రియతో పూరిస్తూ, కిరీటం అనే నామవాచకాన్ని మళ్లీ చెప్పకుండా మూలంలోని సంక్షిప్తతను కొంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: బహుమతి రూపకం యొక్క స్వభావం
  choice: తాత్కాలికమైన క్రీడా కిరీటానికీ నశించని బహుమతికీ మధ్య ఉన్న రూపకాత్మక వ్యతిరేకతను అలాగే ఉంచడం
  alternative: దీనిని నేరుగా నిత్యజీవం లేదా పరలోక బహుమతులు అని నిర్వచించడం
  rationale: ఈ వచనం నశించని బహుమతి యొక్క సిద్ధాంతపరమైన స్వరూపాన్ని నిర్దిష్టంగా చెప్పదు; కాబట్టి పౌలు ఉపయోగించిన రూపకాన్ని సంకుచితం చేయకుండా కాపాడడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. మూలంలో లేని కాలసూచక లేదా ప్రసంగసంధాన పదాన్ని ఆరంభంలో చేర్చలేదు.
