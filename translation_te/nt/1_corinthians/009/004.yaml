  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν φαγεῖν καὶ ⸀πεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/004.yaml
  text: Do we not have the right to eat and drink?[a]
translation:
  language: te
  text: తినడానికి, తాగడానికి మాకు హక్కు లేదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తినడానికి, తాగడానికి మాకు అధికారం లేదా?’ ఇక్కడ ‘హక్కు’ అనేది న్యాయబద్ధమైన అర్హతను లేదా స్వేచ్ఛను సూచిస్తుంది; పౌలు వాదన సందర్భంలో, ఇది బహుశా భౌతిక పోషణ పొందడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὐκ
  choice: మాకు ... లేదా?
  rationale: ఈ గ్రీకు నిషేధార్థక పదాల కలయిక సానుకూల సమాధానాన్ని ఆశించే అలంకారప్రశ్నను సూచిస్తుంది. తెలుగులో ‘లేదా?’ అనే ప్రశ్నారూపం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἔχομεν
  choice: మాకు ... హక్కు
  rationale: గ్రీకులోని ‘కలిగి ఉన్నాము’ అనే భావాన్ని తెలుగులో సహజమైన స్వామ్య నిర్మాణమైన ‘మాకు ... హక్కు’ ద్వారా వ్యక్తం చేశాం.
- source_word: ἐξουσίαν
  choice: హక్కు
  rationale: ఇక్కడ ఇది పాలనా అధికారం లేదా ముడి శక్తిని కాక, అపొస్తలులకు న్యాయంగా ఉన్న స్వేచ్ఛ లేదా అర్హమైన దావాను సూచిస్తుంది. అందువల్ల ‘హక్కు’ సందర్భానికి తగిన సాధారణ తెలుగు పదం.
- source_word: φαγεῖν
  choice: తినడానికి
  rationale: ἐξουσίανతో ఉన్న క్రియార్థక అనిర్దిష్ట రూపాన్ని తెలుగులో ప్రయోజనార్థక క్రియారూపంతో సహజంగా అనువదించాం.
- source_word: καὶ πεῖν
  choice: తాగడానికి
  rationale: సమన్వయించబడిన రెండవ క్రియను మొదటి క్రియకు సమాంతరంగా ఉంచడం తెలుగు వాక్యంలో స్పష్టతను, లయను కాపాడుతుంది.
theological_decisions:
- issue: అపొస్తలుల హక్కు పరిధి
  choice: ప్రధాన పాఠంలో ‘తినడానికి, తాగడానికి ... హక్కు’ అని మాత్రమే ఉంచి, సంఘాల నుంచి భౌతిక పోషణ పొందే హక్కు అనే సందర్భార్థాన్ని పాదటిప్పణిలో సూచించడం
  alternative: సాధారణంగా ఎవరికైనా తిని తాగే స్వేచ్ఛను సూచించే మాటగా తీసుకోవడం
  rationale: 1 కొరింథీయులు 9వ అధ్యాయం తక్షణ సందర్భం అపొస్తలుడైన పౌలు మరియు ఇతర సేవకుల పోషణ హక్కుల గురించి మాట్లాడుతుంది. అయితే మూల వాక్యం ‘పోషణ పొందడం’ అని నేరుగా చెప్పదు; కాబట్టి ప్రధాన పాఠంలో దాన్ని చేర్చకుండా సందర్భార్థాన్ని పాదటిప్పణిలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారప్రశ్నగా రూపొందించాం. ‘అధికారం’ కంటే సాధారణ పాఠకులకు సందర్భార్థాన్ని స్పష్టంగా అందించే ‘హక్కు’ను ప్రధాన పాఠంలో ఎంచుకున్నాం; మూలంలోని సంక్షిప్తతను నిలుపుతూ సందర్భ వివరణను పాదటిప్పణికి పరిమితం చేశాం.
