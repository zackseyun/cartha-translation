id: 1CO.9.22
reference: 1 Corinthians 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: te
  text: బలహీనులకు బలహీనుడినయ్యాను[a], బలహీనులను గెలుచుకోవాలని. అందరికీ అన్నీ అయ్యాను, ఏ విధంగానైనా[b] కొందరిని రక్షించాలని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మనస్సాక్షి విషయంలో బలహీనులు’; 1 కొరింథీయులలో ఈ పదం ప్రత్యేకంగా సున్నితమైన మనస్సాక్షి గలవారిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రతి విధంగానూ’ లేదా ‘ఎలాగైనా’; లక్ష్యాన్ని సాధించడానికి సాధ్యమైన ప్రతి మార్గాన్ని ఉపయోగించడం అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: అయ్యాను
  rationale: γίνομαι యొక్క భూతకాల రూపం పౌలు పరిచర్యలో ఆయా వ్యక్తుల స్థితికి అనుగుణంగా మెలిగిన చర్యను సూచిస్తుంది; ‘అయ్యాను’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: బలహీనులకు / బలహీనుడిని / బలహీనులను
  rationale: మూలంలోని పదపునరుక్తిని నిలుపుతూ వాక్యపు అలంకార బలాన్ని కాపాడుతుంది. ఈ పదం మనస్సాక్షి విషయంలో బలహీనులను సూచించగలిగినా, ప్రధాన పాఠంలో అర్థాన్ని అనవసరంగా కుదించదు.
- source_word: κερδήσω
  choice: సంపాదించుకోవాలని
  rationale: κερδαίνω ఇక్కడ వ్యక్తులను సువార్తవైపు గెలుచుకోవడం అనే భావంలో ఉంది. తెలుగు బైబిలు శైలిలో ‘సంపాదించుకోవడం’ ఆ రూపకాన్ని సహజంగా నిలుపుతుంది; వ్యక్తులను స్వార్థలాభంగా పొందడం అనే ఉద్దేశం సందర్భంలో లేదు.
- source_word: τοῖς πᾶσιν
  choice: అందరికీ
  rationale: గ్రీకులోని దత్తివిభక్తి వ్యక్తుల సమూహాలను సూచిస్తుంది; తెలుగులో ‘అందరికీ’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: γέγονα
  choice: అయ్యాను
  rationale: పరిపూర్ణ కాలం గతంలో ఏర్పడి కొనసాగుతున్న పరిచర్య ధోరణిని సూచిస్తుంది. తెలుగులో సహజమైన ‘అయ్యాను’ సందర్భంలో ఆ స్థిరమైన ధోరణిని మోయగలదు.
- source_word: πάντα
  choice: అన్నీ
  rationale: ‘అందరికీ అన్నీ’ అనే సంక్షిప్త నిర్మాణం మూలంలోని విస్తృతతను, వాక్చాతుర్యాన్ని నిలుపుతుంది.
- source_word: πάντως
  choice: ఏ విధంగానైనా
  rationale: లక్ష్యసాధనకు సాధ్యమైన ప్రతి విధానాన్ని ఉపయోగించడం అనే భావాన్ని ఇస్తుంది; అనైతిక రాజీని తప్పనిసరిగా సూచించదు.
- source_word: τινὰς
  choice: కొందరిని
  rationale: పౌలు అందరూ తప్పక రక్షింపబడతారని చెప్పకుండా ఉద్దేశపూర్వకంగా పరిమితమైన ఆశను వ్యక్తం చేస్తున్నాడు.
- source_word: σώσω
  choice: రక్షించాలని
  rationale: σῴζω యొక్క రక్షణసంబంధమైన బలాన్ని నేరుగా నిలుపుతుంది. సందర్భం పౌలును అంతిమ రక్షకునిగా కాక, పరిచర్యలో సాధనంగా చూపుతుంది.
theological_decisions:
- issue: ‘బలహీనులు’ అనే పదం యొక్క పరిధి
  choice: ప్రధాన పాఠంలో విస్తృతంగా ‘బలహీనులు’ అని ఉంచడం
  alternative: ‘మనస్సాక్షి విషయంలో బలహీనులు’ లేదా ‘శక్తిలేనివారు’
  rationale: 1 కొరింథీయులు 8–10 అధ్యాయాల్లో ఈ పదం ముఖ్యంగా సున్నితమైన మనస్సాక్షి గలవారిని సూచించగలదు. అయినా ఈ వచనం పదాన్ని విస్తృతంగా ఉంచి, చుట్టూ పేర్కొన్న వివిధ వర్గాలతో సమాంతరంగా వాడుతుంది; అందువల్ల ప్రధాన పాఠంలో అర్థాన్ని కుదించలేదు.
- issue: ‘రక్షించాలని’లో పౌలు పాత్ర
  choice: మూలంలోని ప్రత్యక్ష రక్షణ భాషను నిలుపుతూ ‘రక్షించాలని’ అని అనువదించడం
  alternative: ‘రక్షణకు నడిపించాలని’ లేదా ‘రక్షింపబడటానికి సహాయపడాలని’
  rationale: σῴζω నిజమైన రక్షణ భాషను కలిగి ఉంది. దాన్ని బలహీనపరచడం మూలార్థాన్ని తగ్గిస్తుంది; అదే సమయంలో సందర్భం పౌలు సేవను సాధనాత్మక పాత్రగా అర్థం చేసుకునేలా చేస్తుంది, అంతిమ రక్షకునిగా కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ‘బలహీన’ పదపునరుక్తి, ‘అందరికీ అన్నీ’ అనే సంక్షిప్త వాక్చాతుర్యం నిలుపబడ్డాయి. ప్రతి పాదంలోని ἵνα ను తెలుగులో సహజమైన ఉద్దేశార్థక ‘-ాలని’ నిర్మాణంతో వ్యక్తం చేశాం.
