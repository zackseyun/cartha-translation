id: 1CO.9.21
reference: 1 Corinthians 9:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: te
  text: ధర్మశాస్త్రానికి వెలుపల ఉన్నవారికి[a], ధర్మశాస్త్రానికి వెలుపల ఉన్నవాడిలా అయ్యాను—నేను దేవుని ధర్మశాస్త్రానికి వెలుపల ఉన్నవాడిని కాక, మెస్సీయ ధర్మశాస్త్రానికి లోబడినవాడినైనప్పటికీ[b]—ధర్మశాస్త్రానికి వెలుపల ఉన్నవారిని గెలుచుకోవడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ధర్మశాస్త్రం లేనివారు.’ ఇక్కడ ఈ మాట మోషే ధర్మశాస్త్రం కింద లేనివారిని సూచిస్తుంది; తప్పనిసరిగా నైతికంగా ధర్మరహితులని కాదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థానికి దగ్గరగా, ‘మెస్సీయ ధర్మశాస్త్రం పరిధిలో ఉన్నవాడిని’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: ధర్మశాస్త్రానికి వెలుపల ఉన్నవారికి / ఉన్నవాడిలా / ఉన్నవారిని
  rationale: ఈ సందర్భంలో పదం నైతికంగా దుర్మార్గులని కాక, మోషే ధర్మశాస్త్రం కింద లేనివారిని సూచిస్తుంది. పౌలు చేసిన పునరుక్తిని తెలుగులోనూ నిలిపి, తప్పుదారి పట్టించే ‘ధర్మరహితులు’ అనే భావాన్ని నివారించాం.
- source_word: ὡς
  choice: ఉన్నవాడిలా
  rationale: పౌలు సంపూర్ణంగా అటువంటివాడయ్యాడని కాక, వారి స్థితికి తగిన విధంగా తన ప్రవర్తనను సర్దుబాటు చేసుకున్నాడనే భావాన్ని ఇస్తుంది.
- source_word: μὴ ὢν
  choice: అయితే నేను ... ఉన్నవాడిని కాదు
  rationale: ముందటి మాటను పరిమితం చేసే concessive భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἔννομος
  choice: లోబడినవాడిని
  rationale: ధర్మశాస్త్ర పరిధిలో లేదా దానికి బాధ్యుడిగా ఉండటాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ἄνομος‌తో ఉన్న వ్యత్యాసాన్నీ కాపాడుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తోంది; అందువల్ల ‘క్రీస్తు’ అనే పేరు-వంటి రూపం కంటే ‘మెస్సీయ’ మూలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἵνα κερδάνω
  choice: గెలుచుకోవడానికి
  rationale: ἵνα ఉద్దేశాన్ని సూచిస్తుంది; κερδαίνω ఇక్కడ ఆర్థిక లాభం కాక, ప్రజలను సువార్తవైపు గెలుచుకోవడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో ἄνομος అర్థం
  choice: మోషే ధర్మశాస్త్రానికి వెలుపల ఉన్నవారు
  alternative: నైతికంగా ధర్మరహితులు లేదా దుర్మార్గులు
  rationale: 9:20–21 సందర్భం ధర్మశాస్త్రం కింద ఉన్నవారిని, దానికి వెలుపల ఉన్నవారితో పోలుస్తుంది. దేవుని ధర్మశాస్త్రానికి తాను వెలుపల లేనని పౌలు వెంటనే చెప్పడం వల్ల ఇది ప్రధానంగా నిబంధనాత్మక స్థితిని సూచిస్తుంది.
- issue: ἔννομος Χριστοῦ భావం
  choice: మెస్సీయ ధర్మశాస్త్రానికి లోబడినవాడు
  alternative: మెస్సీయ ధర్మశాస్త్రం లోపల ఉన్నవాడు
  rationale: పౌలు నైతిక బాధ్యతలేనివాడని నిరాకరిస్తూ, మెస్సీయతో సంబంధంలో ధర్మానికి లోబడినవాడినని చెబుతున్నాడు. ‘లోబడినవాడు’ తెలుగులో సహజమైనప్పటికీ, ‘లోపల’ అనే స్థానిక రూపకం కూడా సాధ్యమే; దానిని పాదటిప్పణిలో నిలిపాం.
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ పదం బిరుదు భావంతో ఉండి, సంబంధాన్ని సూచించే షష్ఠీ రూపంలో ఉంది; అందువల్ల ‘మెస్సీయ’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన సాధారణ వాడుక. ‘ధర్మశాస్త్రం’ అనే బైబిలు పదాన్ని నిలిపి, ‘ధర్మరహితులు’ వల్ల కలిగే నైతిక అపార్థాన్ని నివారించాం. మూలంలోని పునరుక్తిని భావపరమైన ప్రాధాన్యం వల్ల ఉంచాం; ముందరి వాక్యం నుంచి ఊహింపబడే ἐγενόμην భావాన్ని ‘అయ్యాను’గా స్పష్టం చేశాం.
