id: 1CO.9.17
reference: 1 Corinthians 9:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: te
  text: ఎందుకంటే నేను దీన్ని ఇష్టపూర్వకంగా చేస్తే, నాకు ప్రతిఫలం లభిస్తుంది; కానీ ఇష్టం లేకుండా చేస్తే, నాకు ఒక నిర్వహణ బాధ్యత[a] అప్పగించబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక నియోగం.”
    reason: οἰκονομία అనే పదం అప్పగించబడిన నిర్వహణ బాధ్యతతో పాటు సందర్భానుసారంగా ‘నియోగం’ అనే భావాన్నీ ఇవ్వగలదు.
lexical_decisions:
- source_word: ἑκὼν
  choice: ఇష్టపూర్వకంగా
  rationale: తన ఇష్టంతో, స్వచ్ఛందంగా చేయడాన్ని సూచిస్తుంది; ἄκωνతో ఉన్న ప్రత్యక్ష వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τοῦτο πράσσω
  choice: నేను దీన్ని చేస్తే
  rationale: సందర్భంలో చెప్పబడుతున్న సువార్త పరిచర్యను అతిగా నిర్దిష్టం చేయకుండా, గ్రీకు పదబంధపు విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: μισθὸν
  choice: ప్రతిఫలం
  rationale: ఈ సందర్భంలో కేవలం జీతం అనే భావం కాకుండా సేవకు లభించే ఫలాన్ని సూచించేందుకు ‘ప్రతిఫలం’ సరిపోతుంది.
- source_word: ἄκων
  choice: ఇష్టం లేకుండా
  rationale: ἑκὼνకు వ్యతిరేక భావాన్ని నిలుపుతూ, ‘అయిష్టంగా’ అనే పదం సూచించగల అదనపు భావోద్వేగ తీవ్రతను చేర్చదు.
- source_word: οἰκονομίαν
  choice: ఒక నిర్వహణ బాధ్యత
  rationale: అప్పగించబడిన వ్యవహారాన్ని బాధ్యతగా నిర్వహించాలనే గృహనిర్వాహకత్వ రూపకాన్ని ఆధునిక పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: πεπίστευμαι
  choice: నాకు ... అప్పగించబడింది
  rationale: పరిపూర్ణ కర్మణి రూపంలోని అప్పగింతను, దాని కొనసాగుతున్న ఫలితస్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రెండవ ఉపవాక్యంలో పౌలు పరిచర్య స్వభావం
  choice: పౌలు ఇష్టపూర్వకంగా చేయకపోయినా, తనకు అప్పగించబడిన నిర్వహణ బాధ్యత కిందనే ఉన్నానని చెబుతున్నాడు.
  alternative: ఇష్టం లేకుండా చేస్తే ప్రతిఫలం కాకుండా కేవలం విధి మాత్రమే ఉంటుందని పౌలు చెబుతున్నాడు.
  rationale: మొదటి భాగంలోని ‘ప్రతిఫలం’కు రెండవ భాగంలోని ‘అప్పగించబడిన నిర్వహణ బాధ్యత’ ఎదురుగా నిలుస్తుంది. అనువాదం స్వచ్ఛంద సేవకూ తప్పనిసరి బాధ్యతకూ మధ్య ఉన్న ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఇష్టపూర్వకంగా / ఇష్టం లేకుండా’ అనే జంట ద్వారా గ్రీకు వ్యత్యాసం స్పష్టంగా నిలుపబడింది.
