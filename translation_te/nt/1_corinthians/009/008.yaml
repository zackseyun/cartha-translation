id: 1CO.9.8
reference: 1 Corinthians 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: te
  text: నేను ఈ మాటలను కేవలం మానవ దృక్కోణం నుంచే[a] చెబుతున్నానా? లేక ధర్మశాస్త్రం కూడా ఈ మాటలను చెప్పడం లేదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మానవ ప్రమాణం ప్రకారం’ / ‘మనిషి దృష్టితో.’
    reason: ‘κατὰ ἄνθρωπον’ అనే గ్రీకు పదబంధం మానవ దృక్కోణం, ప్రమాణం లేదా ఆధారాన్ని సూచించగలదు; ఈ భావ విస్తృతిని చూపడానికి.
lexical_decisions:
- source_word: Μὴ
  choice: చెబుతున్నానా?
  rationale: మొదటి ప్రశ్న ప్రతికూల సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్న. తెలుగులో ‘కేవలం... నుంచే ... చెబుతున్నానా?’ అనే నిర్మాణం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κατὰ ἄνθρωπον
  choice: కేవలం మానవ దృక్కోణం నుంచే
  rationale: ఇది ‘మనిషిగా’ అని కాక, కేవలం మానవ ప్రమాణం లేదా దృక్కోణం ఆధారంగా మాట్లాడడాన్ని సూచిస్తుంది; తరువాతి ధర్మశాస్త్ర సాక్ష్యంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ταῦτα
  choice: ఈ మాటలను
  rationale: గ్రీకు బహువచనాన్ని, పౌలు ముందుగా చేసిన వాదనకు ఉన్న సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: λαλῶ
  choice: చెబుతున్నానా
  rationale: వర్తమాన కాలంలో పౌలు ప్రస్తుతం చేస్తున్న వాదనను సూచిస్తుంది; తెలుగులో ప్రత్యక్ష అలంకారిక ప్రశ్నకు ఇది సహజం.
- source_word: ἢ
  choice: '[రెండవ ప్రశ్నగా]'
  rationale: గ్రీకులోని ప్రత్యామ్నాయ ప్రశ్నను తెలుగులో వరుసగా వచ్చే రెండవ ప్రశ్న ద్వారా సహజంగా వ్యక్తం చేశాం; ‘లేక’ అని చేరిస్తే వాక్యం కృత్రిమంగా వినిపించే అవకాశం ఉంది.
- source_word: καὶ
  choice: కూడా
  rationale: మానవ పరిశీలనతో పాటు ధర్మశాస్త్రం అదనపు సాక్ష్యమిస్తుందనే భావాన్ని నిలుపుతుంది.
- source_word: ὁ νόμος
  choice: ధర్మశాస్త్రం
  rationale: తదుపరి వచనంలో ఉల్లేఖించబడే ద్వితీయోపదేశకాండంలోని మోషే ధర్మశాస్త్రాన్ని సూచించే, తెలుగు బైబిలు వాడుకలో స్థిరపడిన పదం.
- source_word: οὐ λέγει
  choice: చెప్పడం లేదా?
  rationale: అవును అనే సమాధానాన్ని ఆశించే గ్రీకు ప్రతికూల అలంకారిక ప్రశ్న నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘ὁ νόμος’ యొక్క సూచన
  choice: మోషే ధర్మశాస్త్రాన్ని సూచించే ‘ధర్మశాస్త్రం’
  alternative: సాధారణ అర్థంలోని చట్టం లేదా నియమసూత్రం
  rationale: తక్షణ సందర్భంలో 1 కొరింథీయులు 9:9 ద్వితీయోపదేశకాండము 25:4ను ఉల్లేఖిస్తుంది. అందువల్ల సాధారణ నియమం అనే భావం కాక, లేఖనంలోని ధర్మశాస్త్ర సూచనను అనువాదం నిలుపుతుంది.
- issue: మొదటి ప్రశ్నలోని ప్రతికూల నిరీక్షణ
  choice: ‘కేవలం... నుంచే ... చెబుతున్నానా?’ అనే అలంకారిక ప్రశ్న
  alternative: ‘నేను ... చెప్పడం లేదా?’ అనే పదానుసార ప్రతికూల నిర్మాణం
  rationale: గ్రీకు Μὴ ప్రతికూల సమాధానాన్ని ఆశిస్తుంది. తెలుగులో ఎంచుకున్న నిర్మాణం ‘లేదు’ అనే ఆశించిన సమాధానాన్ని సహజంగా సూచిస్తూ, పౌలు మానవ తర్కాన్ని పూర్తిగా తిరస్కరిస్తున్నాడని అతిశయంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపాన్ని ఉపయోగించాం. ‘ధర్మశాస్త్రం’ అనే పరిచిత బైబిలు పదం సందర్భంలోని మోషే ధర్మశాస్త్ర సూచనను స్పష్టంగా ఉంచుతుంది; [a] గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
