id: 1CO.9.1
reference: 1 Corinthians 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: te
  text: నేను స్వతంత్రుణ్ణి కానా? నేను అపొస్తలుణ్ణి కానా? మన ప్రభువైన యేసును నేను చూశాను కదా? ప్రభువులో మీరు నా పని కారా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύθερος
  choice: స్వతంత్రుడు
  rationale: ఈ సందర్భంలో పౌలు తన స్వేచ్ఛను, దానితో ముడిపడిన హక్కులను నొక్కిచెబుతున్నాడు. ఆధునిక తెలుగులో ‘స్వతంత్రుడు’ నేరుగా, సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἀπόστολος
  choice: అపొస్తలుడు
  rationale: ఇక్కడ సాధారణ దూతను కాక, పౌలు తన ప్రత్యేక అపొస్తల సేవాస్థానాన్ని సూచిస్తున్నాడు; అందువల్ల కొత్త నిబంధనలో స్థిరపడిన సాంకేతిక పదాన్ని ఉంచాం.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: మన ప్రభువైన యేసు
  rationale: గ్రీకు పదక్రమంలో ‘యేసు’ ముందున్నప్పటికీ, ‘మన ప్రభువైన యేసు’ ఆధునిక తెలుగులో సహజంగా ఉండి, యేసే మన ప్రభువు అనే సంబంధాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ἑόρακα
  choice: చూడలేదు
  rationale: గ్రీకు పరిపూర్ణ కాలం గతంలో జరిగిన దర్శనానికి ప్రస్తుతం నిలిచే ప్రాముఖ్యతను సూచిస్తుంది. తెలుగు ప్రతికూల అలంకారప్రశ్నలో ‘నేను చూడలేదా?’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔργον
  choice: పని
  rationale: కొరింథీయ విశ్వాసులు పౌలు అపొస్తల శ్రమ ఫలితమని సూచించే మూల రూపకాన్ని ‘పని’ నేరుగా నిలుపుతుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు తరచుగా వాడే ఈ సంబంధాత్మక, పరిధి సూచక పదబంధంలోని ఉద్దేశపూర్వక సాంద్రతను పరిష్కరించకుండా కాపాడుతుంది.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: కానా? / చూడలేదా? / కారా?
  rationale: ఈ ప్రతికూల ప్రశ్నలన్నీ సానుకూల సమాధానాన్ని ఆశించే అలంకారప్రశ్నలు; తెలుగు ప్రతికూల ప్రశ్నారూపాలు వాటి వాదనాత్మక బలాన్ని సహజంగా నిలుపుతాయి.
theological_decisions:
- issue: పౌలు యేసును చూశానని చెప్పడంలోని భావం
  choice: అపొస్తలత్వానికి ఆధారంగా యేసును చూసిన సంగతిని సరళంగా పేర్కొనడం
  alternative: పునరుత్థానుడైన యేసును చూశానని ప్రధాన వాక్యంలో స్పష్టీకరించడం
  rationale: సందర్భం పునరుత్థానుడైన యేసు దర్శనాన్ని సూచించినప్పటికీ, గ్రీకు వాక్యంలో ‘పునరుత్థానుడైన’ అనే పదం లేదు. కాబట్టి ఆ సందర్భార్థాన్ని అనువాదంలో అదనంగా చేర్చకుండా మూలంలోని సరళతను, theological tensionను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వరుస అలంకారప్రశ్నల లయను నిలిపాం; ‘ప్రభువులో’ అనే పౌలీయ పదబంధాన్ని వివరణాత్మకంగా విస్తరించలేదు.
