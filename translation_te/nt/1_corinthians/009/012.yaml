id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: te
  text: ఇతరులు మీపై ఈ హక్కును కలిగి ఉంటే,[a] మరి మాకు ఇంకా ఎక్కువగా ఉండకూడదా? అయినా మేము ఈ హక్కును ఉపయోగించుకోలేదు. బదులుగా, మెస్సీయ సువార్తకు ఏ అడ్డంకీ కలిగించకూడదని అన్నిటినీ సహిస్తున్నాం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ విషయంలో ఉన్న ఈ హక్కు,’ ‘మీపై ఉన్న ఈ దావా.’ ఇక్కడ అపొస్తలులు కొరింథీయుల నుండి భౌతిక పోషణ పొందే హక్కు ఉద్దేశించబడినట్లు సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘క్రీస్తు సువార్త.’ ఇక్కడ Χριστός బిరుదుగా ఉన్నందున ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: హక్కు
  rationale: ఈ సందర్భంలో అపొస్తలులు కొరింథీయుల నుండి భౌతిక పోషణ పొందడానికి కలిగిన న్యాయమైన అర్హతను సూచిస్తుంది. ఆధునిక తెలుగులో ‘అధికారం’ కంటే ‘హక్కు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: మీపై ఉన్న ఈ హక్కు
  rationale: ὑμῶν అనే సంబంధ విభక్తి హక్కు కొరింథీయులకు చెందినదని కాక, వారితో సంబంధమున్న దావాను—ప్రత్యేకంగా వారి నుండి పోషణ పొందే హక్కును—సూచిస్తుంది.
- source_word: μετέχουσιν
  choice: పాలుపంచుకుంటే
  rationale: ఒక హక్కులో భాగం కలిగి దాని ప్రయోజనాన్ని పొందడం అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: మాకు మరింతగా ఆ హక్కు లేదా?
  rationale: మూలంలోని అలంకారిక ప్రశ్నను, μᾶλλον యొక్క ‘మరింతగా’ అనే తులనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: ἐχρησάμεθα
  choice: ఉపయోగించుకోలేదు
  rationale: తమకు ఉన్న హక్కును వినియోగించుకోవడం అనే χράομαι భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: πάντα
  choice: అన్నిటినీ
  rationale: పౌలు భరిస్తున్న కష్టాల సమగ్రతను మూలంలోని విస్తృత భావంతోనే ఉంచుతుంది.
- source_word: στέγομεν
  choice: సహిస్తున్నాం
  rationale: ఇక్కడ ‘కప్పడం’ కంటే కష్టాలను భరించడం, ఓర్చుకోవడం అనే సందర్భోచిత భావం ప్రధానమైనది.
- source_word: τινα ἐγκοπὴν
  choice: ఏ అడ్డంకీ
  rationale: ἐγκοπή సూచించే ఆటంకం లేదా ప్రతిబంధకాన్ని సంక్షిప్తమైన, సాధారణ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δῶμεν
  choice: కలిగించకూడదని
  rationale: తెలుగులో ‘అడ్డంకిని ఇవ్వడం’ అసహజం; ἵνα μή తో ఉన్న ఉద్దేశార్థాన్ని ‘కలిగించకూడదని’ సహజంగా తెలియజేస్తుంది.
- source_word: εὐαγγελίῳ
  choice: సువార్తకు
  rationale: పౌలు వాడుకలోని ‘శుభవార్త’ భావానికి స్థిరమైన, గౌరవప్రదమైన తెలుగు బైబిలు పదం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని అభిషిక్త రాజు అనే బిరుదార్థాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
theological_decisions:
- issue: Χριστοῦ పదాన్ని ఎలా అనువదించాలి
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో ఈ పదం పేరులా కాక బిరుదుగా పనిచేస్తోంది. అందువల్ల మెస్సీయ సంబంధిత భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంచాం; సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: అపొస్తలుల ἐξουσία స్వభావం
  choice: కొరింథీయుల నుండి పోషణ పొందే హక్కు
  alternative: కొరింథీయులపై సాధారణ అధికారం
  rationale: ముందరి వచనాల సందర్భం ఆహారం, జీవనోపాధి, సేవకులకు లభించవలసిన భౌతిక పోషణ గురించి ఉంది. అయినప్పటికీ ‘హక్కు’ అనే పదం ద్వారా వాక్యంలోని సాధారణ న్యాయదావా భావాన్ని కూడా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘మరింతగా’ ద్వారా అలంకారిక ప్రశ్న బలం, ‘అన్నిటినీ సహిస్తున్నాం’ ద్వారా పౌలు మాటలోని విస్తృతి నిలుపబడ్డాయి. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
