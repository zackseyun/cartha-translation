id: 1CO.9.19
reference: 1 Corinthians 9:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: te
  text: ఎందుకంటే నేను అందరి నుండి స్వతంత్రుడినైనా, ఎక్కువమందిని గెలుచుకోవడానికి నన్ను నేను అందరికీ బానిసగా చేసుకున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను నేను అందరికీ సేవకునిగా చేసుకున్నాను.” గ్రీకు పదం బానిసత్వ భాషను ఉపయోగిస్తుంది; “స్వతంత్రుడు” అనే మాటతో ఉన్న వ్యత్యాసాన్ని నిలుపడానికి ప్రధాన పాఠంలో “బానిస” అని అనువదించబడింది.
    reason: ‘సేవకుడు’ అనే మృదువైన ప్రత్యామ్నాయాన్ని తెలియజేస్తూనే గ్రీకు రూపకంలోని బలాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: స్వతంత్రుడనై
  rationale: ఎవరికి బానిసగా లేదా వారి అధికారానికి లోబడి లేని స్థితిని సూచిస్తుంది; తరువాతి ‘బానిసగా’ అనే పదంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐκ πάντων
  choice: అందరి నుండి
  rationale: ప్రజలందరితో సంబంధంలో పౌలు స్వతంత్రుడని గ్రీకు వాక్యంలోని సంక్షిప్త భావాన్ని నిలుపుతుంది.
- source_word: πᾶσιν
  choice: అందరికీ
  rationale: పౌలు తనను తాను ఎవరికీ బానిసగా చేసుకున్నాడో సూచిస్తూ, ‘అందరి నుండి—అందరికీ’ అనే అలంకార సమాంతరతను కాపాడుతుంది.
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: నన్ను నేను ... బానిసగా చేసుకున్నాను
  rationale: δουλόω లోని బానిసత్వ భాషను, అలాగే పౌలు స్వచ్ఛందంగా తనను తాను లోబరచుకున్న భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἵνα
  choice: '... అని'
  rationale: తెలుగులో సహజమైన ఉద్దేశార్థక నిర్మాణంతో గ్రీకు ప్రయోజన భావాన్ని తెలియజేస్తుంది.
- source_word: τοὺς πλείονας
  choice: మరి ఎక్కువమందిని
  rationale: πλείονας సూచించే తులనాత్మక ‘ఎక్కువ సంఖ్యలోని ప్రజలు’ అనే భావాన్ని అతిశయింపకుండా వ్యక్తం చేస్తుంది.
- source_word: κερδήσω
  choice: సంపాదించుకోవాలని
  rationale: ప్రజలను తన ప్రయోజనం కోసం సొంతం చేసుకోవడం కాదు, సువార్త పరిచర్యలో వారిని గెలుచుకోవడం అనే రూపకార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: δουλόω అనే బానిసత్వ భాష అనువాదం
  choice: బానిసగా చేసుకున్నాను
  alternative: సేవకునిగా చేసుకున్నాను
  rationale: ‘స్వతంత్రుడు’ అనే పదంతో పౌలు ఉద్దేశపూర్వకంగా నిర్మించిన బలమైన వ్యత్యాసానికి బానిసత్వ రూపకం కేంద్రం. ‘సేవకుడు’ అనడం ఆ తీవ్రతను తగ్గిస్తుంది; అయినా ఇది బలవంతపు బానిసత్వం కాదని ‘నన్ను నేను’ స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. ‘అందరి నుండి—అందరికీ’ అనే మూలపాఠ సమాంతరతను, ‘స్వతంత్రుడు—బానిస’ అనే ప్రధాన వ్యత్యాసాన్ని కాపాడింది. మూలంలో లేని ‘వారిలో’ వంటి వివరణాత్మక పదాన్ని చేర్చలేదు.
