source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: te
  text: యూదులను గెలుచుకోవడానికి యూదులకు యూదునిలా అయ్యాను[a]; ధర్మశాస్త్రానికి లోబడినవారిని[b] గెలుచుకోవడానికి, నేనే ధర్మశాస్త్రానికి లోబడినవాడిని కానప్పటికీ, ధర్మశాస్త్రానికి లోబడినవారికి ధర్మశాస్త్రానికి లోబడినవాడిలా అయ్యాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సంపాదించడానికి’; ఇక్కడి క్రియకు సంపాదించడం లేదా గెలుచుకోవడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ధర్మశాస్త్రం’ అనేది బహుశా మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: అయ్యాను
  rationale: γίνομαι యొక్క సహజమైన అర్థాన్ని నిలుపుతూ, వేర్వేరు గుంపులతో వ్యవహరించేటప్పుడు పౌలు వారి స్థితికి తగిన విధంగా ప్రవర్తించాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: యూదులకు యూదునిలా
  rationale: ὡς లోని పోలిక భావాన్ని స్పష్టంగా నిలుపుతుంది; పౌలు జాతిపరంగా యూదుడు కాదని సూచించకుండా, అతని అనుకూల ప్రవర్తనను వ్యక్తం చేస్తుంది.
- source_word: ἵνα ... κερδήσω
  choice: సంపాదించుకోవడానికి
  rationale: κερδαίνω యొక్క ప్రాథమిక ‘లాభంగా పొందడం/సంపాదించడం’ భావాన్ని నిలుపుతుంది. ఇక్కడ వ్యక్తులను తనవైపు గెలుచుకోవడం అనే మిషనరీ సందర్భార్థం సహజంగా గ్రహించబడుతుంది.
- source_word: τοῖς ὑπὸ νόμον
  choice: ధర్మశాస్త్రానికి లోబడినవారికి
  rationale: ὑπό + νόμον సూచించే అధికారానికి లేదా నియంత్రణకు లోనైన స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὡς ὑπὸ νόμον
  choice: లోబడినవాడిలా
  rationale: ముందున్న ‘యూదునిలా’ అనే పోలిక నిర్మాణాన్ని కొనసాగిస్తూ, పౌలు నిజంగా ఆ స్థితిలో ఉన్నాడని చెప్పకుండా అనుకూల ప్రవర్తనను సూచిస్తుంది.
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: నేనే ధర్మశాస్త్రానికి లోబడినవాడిని కాకపోయినా
  rationale: వర్తమాన స్థితిని తెలిపే participial qualification ను సహజంగా అందించి, αὐτός లోని వ్యక్తిగత ఉద్ఘాటనను ‘నేనే’ ద్వారా నిలుపుతుంది.
- source_word: νόμος
  choice: ధర్మశాస్త్రం
  rationale: ఈ యూదు సందర్భంలో νόμος ప్రధానంగా మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది; అయితే ప్రధాన పాఠ్యంలో మరింత నిర్దిష్టంగా విస్తరించకుండా మూలంలోని సాధారణ పదప్రయోగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పౌలు ‘ధర్మశాస్త్రానికి లోబడినవాడిని కాను’ అని చెప్పడంలోని భావం
  choice: ‘నేనే ధర్మశాస్త్రానికి లోబడినవాడిని కాకపోయినా’ అని ఎలాంటి వివరణాత్మక పరిమితులు చేర్చకుండా నేరుగా అనువదించడం.
  alternative: ‘నేనే మోషే ధర్మశాస్త్రానికి లోబడినవాడిని కాకపోయినా’ లేదా తదుపరి వచనంలోని ‘క్రీస్తు ధర్మశాస్త్రం’ భావంతో సమన్వయపరచడం.
  rationale: ఈ వచనంలోని గ్రీకు పాఠ్యం పౌలు ధర్మశాస్త్రానికి లోబడలేదని మాత్రమే చెబుతుంది. తదుపరి వచనంలోని భాషను ఇక్కడికి తీసుకురాకుండా దాని వాక్చాతుర్య విరుద్ధతను, theological tension ను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, పౌలు చెప్పిన పోలికల సమాంతర నిర్మాణాన్ని కాపాడాం.
