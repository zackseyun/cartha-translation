  edition: SBLGNT
  text: ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/022.yaml
  text: On the contrary[a], the parts of the body that seem to be weaker are necessary[c][b],
translation:
  language: te
  text: దానికి విరుద్ధంగా, శరీరంలోని మరింత బలహీనమైనవిగా కనిపించే అవయవాలు[a] మరెంతో అవసరమైనవి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “భాగాలు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “అనివార్యమైనవి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అందుకు విరుద్ధంగా
  rationale: ముందున్న వాదనకు బలమైన వ్యతిరేకతను, దిద్దుబాటు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πολλῷ μᾶλλον
  choice: మరెంతో
  rationale: ‘చాలా ఎక్కువగా/మరింతగా’ అనే స్పష్టమైన బలపరిచే భావాన్ని విడిచిపెట్టకుండా సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ δοκοῦντα
  choice: కనిపించే
  rationale: ఇది వాస్తవ స్థితిని నిర్ధారించకుండా, మనుషుల దృష్టికి అలా అనిపించడాన్ని సూచిస్తుంది.
- source_word: μέλη
  choice: అవయవాలు
  rationale: శరీర రూపకాన్ని స్పష్టంగా నిలుపుతుంది; ‘సభ్యులు’ అని అనువదించి సంఘానికి సంబంధించిన భావాన్ని ముందుగానే చొప్పించదు.
- source_word: τοῦ σώματος
  choice: శరీరంలో
  rationale: అవయవాలు శరీరానికి చెందినవని సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ἀσθενέστερα
  choice: బలహీనమైనవిగా
  rationale: సందర్భంలోని తులనాత్మక భావం ముందున్న అవయవాలతో పోలికలో స్పష్టమవుతుంది; తెలుగు వాక్యంలో అనవసరమైన భారాన్ని నివారించేందుకు ‘మరింత’ను పునరుక్తి చేయలేదు.
- source_word: ὑπάρχειν
  choice: గా
  rationale: δοκοῦνταతో కలిసి ‘బలహీనమైనవిగా కనిపించే’ అనే సహజ నిర్మాణాన్ని ఇస్తుంది.
- source_word: ἀναγκαῖά ἐστιν
  choice: అవసరమైనవి
  rationale: అవి కావలసినవే అనే మూలపాఠంలోని అవసరతను నేరుగా తెలియజేస్తుంది; ‘అనివార్యమైనవి’ కూడా సాధ్యమైన బలమైన ప్రత్యామ్నాయం.
theological_decisions:
- issue: సంఘ సందర్భంలో శరీర రూపకపు అర్థం
  choice: వచనంలో ఉన్న శరీరం–అవయవాల రూపకాన్నే నిలుపడం
  alternative: ‘సంఘ సభ్యులు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: సందర్భంలో పౌలు ఈ రూపకాన్ని సంఘానికి వర్తింపజేస్తున్నా, ఈ వచనం నేరుగా శరీర అవయవాలనే ప్రస్తావిస్తుంది. వివరణను వచనంలో కలపకుండా రూపకాన్ని యథాతథంగా ఉంచడం మూలానికి నిబద్ధమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మరెంతో’ ద్వారా πολλῷ μᾶλλον అనే బలపరిచే పదబంధాన్ని ప్రధాన పాఠంలోనే స్పష్టంగా అనువదించాం.
