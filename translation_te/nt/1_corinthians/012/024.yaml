id: 1CO.12.24
reference: 1 Corinthians 12:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ⸀ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ⸀ὑστεροῦντι περισσοτέραν δοὺς τιμήν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: te
  text: అయితే మన శరీరంలోని మర్యాదగా కనిపించే భాగాలకు అవసరం లేదు. కానీ దేవుడు గౌరవం కొరవడిన భాగానికి మరింత గౌరవం ఇచ్చి, శరీరాన్ని కలిపి అమర్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శరీరాన్ని ఒకటిగా కలిపాడు.” గ్రీకు క్రియ వేర్వేరు భాగాలను కలిపి ఒక సమగ్ర ఏకత్వంగా చేయడాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: మర్యాదగా కనిపించే భాగాలు
  rationale: మునుపటి వచనంలోని తక్కువ మర్యాదగా భావించే భాగాలకు విరుద్ధంగా, బయటకు సముచితంగా లేదా మర్యాదగా కనిపించే శరీర భాగాలను సూచిస్తుంది. సందర్భం వల్ల ‘భాగాలు’ అని స్పష్టపరచబడింది.
- source_word: χρείαν ἔχει
  choice: ఆ అవసరం లేదు
  rationale: గ్రీకు జాతీయార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘ఆ’ అనేది ముందు వచనంలో చెప్పిన ప్రత్యేక శ్రద్ధను సందర్భానుసారంగా సూచిస్తుంది.
- source_word: συνεκέρασεν
  choice: సమన్వయపరచి
  rationale: వేర్వేరు భాగాలను ఒక సమగ్ర ఏకత్వంగా కలిపి అమర్చడం అనే భావాన్ని, అతిగా యాంత్రికంగా కాకుండా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σῶμα
  choice: శరీరం
  rationale: పౌలు ఉపయోగిస్తున్న ప్రధాన శరీర రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: τῷ ὑστεροῦντι
  choice: గౌరవం కొరవడిన భాగానికి
  rationale: కొరవడింది అంతర్గత విలువ కాదని, తరువాత వచ్చే τιμήν ప్రకారం గౌరవమేనని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: περισσοτέραν τιμήν
  choice: మరింత గౌరవం
  rationale: తులనాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δοὺς
  choice: ఇచ్చాడు
  rationale: ప్రధాన క్రియతో సాధనాత్మకంగా అనుసంధానమైన కృదంత భావాన్ని తెలుగులో సహజమైన సమాపక క్రియగా అందిస్తుంది.
theological_decisions:
- issue: శరీరాన్ని దేవుడు సమన్వయపరచిన చర్యకు సంబంధించిన అర్థం
  choice: గౌరవం కొరవడిన భాగానికి మరింత గౌరవం ఇస్తూ దేవుడు శరీరాన్ని ఉద్దేశపూర్వకంగా సమన్వయపరచాడు.
  alternative: ఇది కేవలం శరీర భాగాలను భౌతికంగా కలపడాన్ని లేదా సహజ మానవ శరీర నిర్మాణాన్ని మాత్రమే సూచిస్తుంది.
  rationale: సమీప సందర్భం సంఘాన్ని క్రీస్తు శరీరంగా చూపే విస్తృత రూపకం. అన్వయాన్ని అతిగా నిర్దిష్టం చేయకుండా దేవుని ఉద్దేశపూర్వకమైన అమరికను, గౌరవం ఇవ్వడాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలి. శరీర రూపకం నిలుపబడింది; సందర్భం అవసరమైన చోట మాత్రమే ‘భాగాలు,’ ‘గౌరవం’ స్పష్టీకరించబడ్డాయి.
