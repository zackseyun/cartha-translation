id: 1CO.12.19
reference: 1 Corinthians 12:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ἦν τὰ πάντα ἓν μέλος, ποῦ τὸ σῶμα;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/019.yaml
  text: If all were one member, where would the body be?
translation:
  language: te
  text: అవన్నీ ఒకే అవయవమైతే, ఇక శరీరం ఎక్కడ ఉంటుంది?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: అయితే
  rationale: ఊహాత్మక షరతును సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘మైతే’ రూపంలో ἦνతో కలిసి షరతును తెలియజేస్తుంది.
- source_word: δὲ
  choice: ఇక
  rationale: δέ ఇక్కడ స్వల్పమైన అనుసంధానాన్ని, తార్కిక మలుపును సూచిస్తుంది. ‘ఇక’ ప్రశ్నకు సహజమైన మార్పును ఇస్తుంది; బలమైన వ్యతిరేకార్థాన్ని చేర్చదు.
- source_word: ἦν
  choice: అయితే
  rationale: ఊహాత్మక పరిస్థితిని తెలుగులో ‘మైతే’ అనే షరతు నిర్మాణంతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὰ πάντα
  choice: అవన్నీ
  rationale: సందర్భంలోని శరీర అవయవాలన్నిటినీ సమష్టిగా సూచిస్తుంది; నైరూప్యమైన ‘సమస్తం’ కంటే ‘అవన్నీ’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἓν
  choice: ఒకే
  rationale: అన్నీ భిన్న అవయవాలు కాక ఒకే అవయవంగా ఉండే ఊహను, ఏకత్వంపై ఉన్న ఉద్ఘాటనను నిలుపుతుంది.
- source_word: μέλος
  choice: అవయవం
  rationale: శరీర రూపకంలో μέλοςకు ఆధునిక ప్రామాణిక తెలుగులో ‘అవయవం’ సహజమైనది; ‘సభ్యుడు’ అనే సంఘసంబంధ అర్థాన్ని ముందుగానే చేర్చకుండా శరీర రూపకాన్ని కాపాడుతుంది.
- source_word: ποῦ
  choice: ఎక్కడ ఉంటుంది?
  rationale: ఊహాత్మక పరిస్థితిలో శరీరం ఉనికిలోనే ఉండదనే భావాన్ని అలంకారిక ప్రశ్నగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ σῶμα
  choice: శరీరం
  rationale: గ్రీకు పాఠంలోని శరీర రూపకాన్ని నేరుగా నిలుపుతుంది; ఈ వాక్యంలో లేని ‘క్రీస్తు శరీరం’ అనే వివరణను చేర్చదు.
theological_decisions:
- issue: శరీర రూపకం యొక్క పరిధి
  choice: వైవిధ్యమైన అవయవాలు లేకుండా శరీరం ఉండదనే అలంకారిక ప్రశ్నగా అనువదించడం
  alternative: ‘క్రీస్తు శరీరం’ లేదా ‘సంఘం’ అని స్పష్టంగా చేర్చడం
  rationale: విస్తృత సందర్భం సంఘాన్ని క్రీస్తు శరీరంగా వివరిస్తున్నా, ఈ వాక్యంలో τὸ σῶμα మాత్రమే ఉంది. అందువల్ల మూలంలోని రూపకాన్ని అలాగే ఉంచి, ఇక్కడ లేని సంఘశాస్త్ర వివరణను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో. ‘అవయవం’–‘శరీరం’ పదజాలం పౌలు ఉపయోగించిన శరీర రూపకాన్ని స్పష్టంగా నిలుపుతుంది. పాదటిప్పణులు అవసరం లేదు.
