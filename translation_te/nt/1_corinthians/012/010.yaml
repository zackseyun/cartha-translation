revisions:
- from: మరొకరికి శక్తికార్యాలు[a], మరొకరికి ప్రవచనం, మరొకరికి ఆత్మలను వివేచించే సామర్థ్యాలు, వేరొకరికి వివిధ రకాల భాషలు[b], మరొకరికి ఆ భాషల అర్థవివరణ అనుగ్రహించబడుతున్నాయి.
  to: మరొకరికి అద్భుత కార్యాలను చేయుట, మరొకరికి ప్రవచనం, మరొకరికి ఆత్మలను వివేచించే సామర్థ్యం, వేరొకరికి వివిధ రకాల భాషలు[b], మరొకరికి భాషల అర్థవివరణ.
  rationale: మొదటి అంశాన్ని మరింత సహజమైన తెలుగులో సవరించాం; ἐνεργήματα δυνάμεων యొక్క ప్రత్యక్షమైన ‘కార్యసాధనలు/శక్తుల కార్యాలు’ భావాన్ని పాదటిప్పణిలో నిలిపాం. మూలంలో లేని ప్రగతిశీల క్రియను, అలాగే అవసరం లేని సూచక సర్వనామాన్ని తొలగించాం. γλωσσῶν మరియు πνευμάτων కు సంబంధించిన వ్యాఖ్యానాత్మక అస్పష్టతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణి రెండింటిలోనూ కాపాడాం.
