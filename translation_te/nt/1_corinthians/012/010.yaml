id: 1CO.12.10
reference: 1 Corinthians 12:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: te
  text: మరొకరికి అద్భుత కార్యాలను చేయుట, మరొకరికి ప్రవచనం, మరొకరికి ఆత్మలను వివేచించే సామర్థ్యం, వేరొకరికి వివిధ రకాల భాషలు[b], మరొకరికి భాషల అర్థవివరణ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: గ్రీకు పదానికి ‘నాలుకలు’ లేదా ‘భాషలు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడి ఆత్మీయ వరం యొక్క స్వరూపాన్ని అనవసరంగా నిర్ణయించకుండా ఉండేందుకు ‘భాషలు’ అనే అనువాదంతో పాటు ఈ ప్రత్యామ్నాయాన్ని గమనించాలి.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: శక్తికార్యాలు
  rationale: ἐνεργήματα అనే పదంలోని కార్యసాధన/ఫలిత భావాన్ని, δυνάμεων అనే పదంలోని శక్తి మరియు అద్భుత కార్యాల భావపరిధిని కలిపి సంక్షిప్తంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
- source_word: προφητεία
  choice: ప్రవచనం
  rationale: ఇక్కడ పేర్కొన్న ఆత్మీయ వరానికి సహజమైన, విస్తృతార్థాన్ని కాపాడే ప్రామాణిక తెలుగు పదం.
- source_word: διακρίσεις πνευμάτων
  choice: ఆత్మలను వివేచించే సామర్థ్యాలు
  rationale: διακρίσεις యొక్క బహువచన భావాన్ని ‘సామర్థ్యాలు’ ద్వారా నిలుపుతూ, πνευμάτων ను ఏ ప్రత్యేక రకమైన ఆత్మలుగా పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: γένη γλωσσῶν
  choice: వివిధ రకాల భాషలు
  rationale: γένη లోని రకాల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. γλῶσσα కు భాషలు/నాలుకలు అనే భావసాధ్యత ఉన్నందున పాదటిప్పణి ద్వారా అస్పష్టతను నిలిపాం.
- source_word: ἑρμηνεία γλωσσῶν
  choice: ఆ భాషల అర్థవివరణ
  rationale: ἑρμηνεία ఇక్కడ పలికిన విషయాన్ని అర్థమయ్యేలా తెలియజేయడాన్ని సూచిస్తుంది; ‘అర్థవివరణ’ అనేది అనువాదం లేదా వివరణ అనే రెండు సాధ్య భావాలను అనవసరంగా కుదించదు.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: మరొకరికి / వేరొకరికి
  rationale: వరాలు వేర్వేరు వ్యక్తులకు పంచబడుతున్న దత్తివాచక నిర్మాణాన్ని చూపుతుంది; గ్రీకులోని స్వల్ప పదమార్పును సహజంగా ప్రతిబింబించేందుకు ఒకచోట ‘వేరొకరికి’ వాడాం.
theological_decisions:
- issue: δυνάμεων యొక్క స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘శక్తికార్యాలు’
  alternative: అద్భుత కార్యాలు; శక్తి ప్రదర్శనలు
  rationale: ‘అద్భుతాలు’ అని మాత్రమే అనువదిస్తే δυνάμεων లోని ‘శక్తులు’ అనే మూలభావం కుదించబడవచ్చు. ‘శక్తికార్యాలు’ శక్తి ద్వారా జరిగే అసాధారణ కార్యాల భావాన్ని ఉంచుతుంది.
- issue: γλωσσῶν యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘భాషలు’
  alternative: నాలుకలు; అన్యభాషలు
  rationale: గ్రీకు పదం నాలుకలకూ భాషలకూ వాడబడుతుంది. ఆధునిక తెలుగులో ‘భాషలు’ సహజంగా ఉన్నా, ఈ వరం తెలిసిన మానవ భాషలకే పరిమితమని నిర్ణయించకుండా పాదటిప్పణిలో ప్రత్యామ్నాయం సూచించాం.
- issue: πνευμάτων యొక్క నిర్దిష్ట సూచన
  choice: ‘ఆత్మలు’ అని విస్తృతంగా ఉంచడం
  alternative: ఆత్మీయ పలుకులు; పలుకుల వెనుకనున్న ఆత్మలు; మానవ లేదా దుష్ట ఆత్మలు
  rationale: మూలపాఠం ఏ రకమైన ఆత్మలను ఉద్దేశించిందో స్పష్టం చేయదు; అందువల్ల వ్యాఖ్యానాత్మక పరిమితిని ప్రవేశపెట్టలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ముందరి వాక్యం నుంచి కొనసాగుతున్న అపూర్ణ జాబితాను తెలుగులో సహజంగా పూర్తి చేయడానికి ‘అనుగ్రహించబడుతున్నాయి’ చేర్చబడింది. బహువచనాలు మరియు ఆత్మలు/భాషల విషయంలోని మూలపాఠ్య అస్పష్టత సాధ్యమైనంతవరకు నిలుపబడింది.
