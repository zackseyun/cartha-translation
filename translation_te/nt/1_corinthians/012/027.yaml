id: 1CO.12.27
reference: 1 Corinthians 12:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ ἐστε σῶμα Χριστοῦ καὶ μέλη ἐκ μέρους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/027.yaml
  text: You are the body of Messiah[c][b][a], and members individually.
translation:
  language: te
  text: అయితే, మీరే మెస్సీయ శరీరం[a]; మీలో ప్రతి ఒక్కరూ దానిలో ఒక అవయవం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తు శరీరం.” గ్రీకు Χριστός అనే బిరుదును “మెస్సీయ” అని లేదా “క్రీస్తు” అని అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: 'మూలానికి మరింత అక్షరార్థంగా, “తమ తమ వంతుగా అవయవాలు.” భావం: మీరంతా కలిసి ఒకే శరీరం; మీలో ఒక్కొక్కరు ఆ శరీరంలోని ఒక అవయవం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: మీరే
  rationale: బహువచన సంబోధనను, మూలంలో సర్వనామం స్పష్టంగా ఉండడం వల్ల కలిగే ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: ముందు వివరించిన శరీర రూపకం నుంచి కొరింథీయులకు దాని అన్వయానికి మారుతున్న సంధిని సూచిస్తుంది; ఇక్కడ ఇది తప్పనిసరిగా బలమైన వ్యతిరేకార్థకం కాదు.
- source_word: σῶμα Χριστοῦ
  choice: మెస్సీయ శరీరం
  rationale: శరీర రూపకాన్ని నిలుపుతూ, Χριστόςను ఇక్కడ అభిషిక్తుని బిరుదుగా అనువదిస్తుంది.
- source_word: μέλη
  choice: అవయవం
  rationale: శరీర రూపకంలో భాగమైన అంగాన్ని స్పష్టంగా తెలియజేస్తుంది; ప్రతి వ్యక్తిని ఉద్దేశించిన వాక్య నిర్మాణం వల్ల ఏకవచనం సహజంగా ఉంది.
- source_word: ἐκ μέρους
  choice: మీలో ప్రతి ఒక్కరూ దానిలో
  rationale: ఈ సందర్భంలోని పంపిణీయ భావాన్ని—సమష్టిగా ఒక శరీరం, వ్యక్తిగతంగా ఒక్కొక్కరు దాని అవయవం—సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: పౌలు సంఘాన్ని వర్ణించే ఈ వాక్యంలో Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός అభిషిక్తుని బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ దాని బిరుదార్థాన్ని స్పష్టంగా ఉంచుతుంది; సుపరిచితమైన ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
- issue: ἐκ μέρους యొక్క భావం
  choice: 'పంపిణీయ భావం: మీలో ప్రతి ఒక్కరూ దానిలో ఒక అవయవం'
  alternative: ఒక్కొక్కరుగా అవయవాలు; తమ తమ వంతుగా అవయవాలు
  rationale: తక్షణ సందర్భం ఒకే శరీరానికీ అనేక అవయవాలకీ మధ్య ఉన్న సంబంధాన్ని చూపుతుంది. ఈ అనువాదం సమష్టి ఐక్యతను, వ్యక్తిగత భాగస్వామ్యాన్ని రెండింటినీ నిలుపుతుంది; ‘కొంతవరకు’ అనే అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘మీరే’ మూలంలోని ఉద్ఘాటనను, ‘మీలో ప్రతి ఒక్కరూ’ బహువచన సమూహంలోని వ్యక్తిగత సభ్యత్వాన్ని తెలియజేస్తాయి.
