- from: అలాగే చెవి, “నేను కన్ను కాను కాబట్టి శరీరానికి చెందను” అని అంటే[a], ఆ కారణం చేత అది శరీరానికి చెందకుండా పోదు.
  to: మరియు ఒకవేళ చెవి, “నేను కన్ను కాను కాబట్టి శరీరానికి చెందను” అని అంటే[a], అందువల్ల అది శరీరానికి చెందనిది కాదు.
