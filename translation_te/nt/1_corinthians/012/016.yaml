id: 1CO.12.16
reference: 1 Corinthians 12:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: te
  text: మరియు ఒకవేళ చెవి, “నేను కన్ను కాను కాబట్టి శరీరానికి చెందను” అని అంటే[a], అందువల్ల అది శరీరానికి చెందనిది కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత వాడుక భాషలో: “నేను శరీరంలో భాగం కాను” … “అయినంత మాత్రాన అది శరీరంలో భాగం కాకుండా పోదు.” గ్రీకు మూలంలో “శరీరానికి చెందడం” అనే భావం వాక్యంలోని రెండు చోట్లా పునరావృతమవుతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అలాగే
  rationale: మునుపటి శరీర భాగపు ఉదాహరణతో ఈ సమాంతర ఉదాహరణను సహజంగా కలుపుతుంది.
- source_word: ἐὰν εἴπῃ
  choice: అని అంటే
  rationale: ἐὰνతో కూడిన aorist subjunctive సూచించే ఊహాత్మక పరిస్థితిని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὸ οὖς
  choice: చెవి
  rationale: ఉపమానంలో వ్యక్తీకరించబడిన సాధారణ శరీర భాగానికి నేరమైన తెలుగు పదం.
- source_word: Ὅτι
  choice: కాబట్టి
  rationale: చెవి చెప్పే మాటలోని కారణ సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὀφθαλμός
  choice: కన్ను
  rationale: మూలంలోని సాధారణ శరీర భాగపు పదానికి నేరమైన సమానార్థకం.
- source_word: ἐκ τοῦ σώματος
  choice: శరీరానికి చెందను / శరీరానికి చెందకుండా
  rationale: ఈ సందర్భంలో ἐκ τοῦ σώματος శరీరంలో భాగంగా ఉండడాన్ని సూచిస్తుంది. ‘చెందు’ అనే పదం మూలంలోని రెండు పునరావృతాలనూ నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: οὐ παρὰ τοῦτο
  choice: ఆ కారణం చేత ... పోదు
  rationale: ముందు చెప్పిన కారణం వల్ల ఆ నిర్ణయం నిజం కాదని వాదనాత్మకంగా తిరస్కరిస్తుంది.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: శరీరానికి చెందకుండా పోదు
  rationale: మూలంలోని ప్రతికూల నిర్మాణాన్ని, చెవి శరీరానికి చెందుతుందనే నిర్ధారణను రెండింటినీ సహజమైన తెలుగు ద్వినిషేధ రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: పౌలు ఉపయోగించిన శరీర రూపకంలోని పునరుక్తి
  choice: ‘శరీరానికి చెందు’ అనే భావాన్ని వాక్యంలోని రెండు చోట్లా పునరావృతం చేయడం
  alternative: ‘శరీరంలో భాగం కాను … అయినంత మాత్రాన అది శరీరంలో భాగం కాకుండా పోదు’
  rationale: సంఘంలో భాగస్వామ్యాన్ని వివరించే అదనపు సిద్ధాంత భాషను చేర్చకుండా, మూలంలోని వాదనా రూపాన్ని మరియు పునరుక్తిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘శరీరానికి చెందు’ అనే పదబంధం మూలంలోని పునరుక్తిని నిలుపుతుంది; చివరి ద్వినిషేధం పౌలు చేసిన వాదనాత్మక తిరస్కారాన్ని సహజంగా వ్యక్తపరుస్తుంది.
