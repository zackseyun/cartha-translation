id: 1CO.12.29
reference: 1 Corinthians 12:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: te
  text: అందరూ అపొస్తలులు కారు కదా? అందరూ ప్రవక్తలు కారు కదా? అందరూ బోధకులు కారు కదా? అందరూ అద్భుత కార్యాలు చేసేవారు కారు కదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో చివరి పదం అక్షరార్థంగా “శక్తులు”; సందర్భంలో అది అద్భుత కార్యాలను, లేదా వాటిని చేసేవారిని సంక్షిప్తంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: …లేనా? / …వారేనా?
  rationale: ప్రశ్నకు ‘కాదు’ అనే సమాధానం ఆశించబడుతున్నదని μή సూచిస్తుంది. తెలుగులో ‘ఏనా?’తో కూడిన పునరుక్త ప్రశ్నలు ఈ అలంకారిక ప్రశ్నల భావాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: πάντες
  choice: అందరూ
  rationale: సంఘంలోని వారందరికీ ఒకే పరిచర్య లేదా వరం ఉండదనే ఉద్దేశాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు వాక్యంలోని పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: ἀπόστολοι
  choice: అపొస్తలులు
  rationale: ఇక్కడ సాధారణ దూతలను కాక, సంఘ పరిచర్యలో గుర్తించబడిన పాత్రను సూచిస్తుంది.
- source_word: προφῆται
  choice: ప్రవక్తలు
  rationale: ప్రవచించే వారిని సూచించే స్థిరమైన, సందర్భోచిత తెలుగు పదం.
- source_word: διδάσκαλοι
  choice: బోధకులు
  rationale: సంఘంలో బోధించే వారి పాత్రను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δυνάμεις
  choice: అద్భుత కార్యాలు చేసేవారు
  rationale: గ్రీకులో అక్షరార్థంగా ‘శక్తులు/అద్భుత కార్యాలు’ అనే నామవాచకం ఉన్నా, ఈ జాబితాలో అది అద్భుత కార్యాలు జరిగేలా సేవచేసేవారిని సంక్షిప్తంగా సూచిస్తుంది. తెలుగు వాక్యంలో వ్యక్తుల గురించిన సమాంతర నిర్మాణాన్ని సహజంగా నిలుపడానికి ఈ రూపం వాడబడింది.
theological_decisions:
- issue: పాత్రలు, వరాల జాబితాలో δυνάμειςను ఎలా అనువదించాలి
  choice: అందరూ అద్భుత కార్యాలు చేసేవారేనా?
  alternative: అందరూ శక్తులేనా? / అందరికీ అద్భుత శక్తులు ఉన్నాయా?
  rationale: వ్యక్తులు అక్షరార్థంగా ‘శక్తులు’ అని చెప్పకుండా, గ్రీకు సంక్షిప్త ప్రయోగం సూచించే కార్యాన్ని తెలుగులో వెల్లడిస్తుంది. అదే సమయంలో ప్రతి విశ్వాసి ఒకే కార్యాన్ని నిర్వహించడు అనే పౌలు వాదనను మాత్రమే తెలియజేస్తుంది; అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకులోని నాలుగు సమాంతర అలంకారిక ప్రశ్నలను ‘అందరూ…ఏనా?’ అనే పునరుక్తితో నిలిపాం. వివరణకు సంబంధించిన పాదసూచిక గుర్తును ఆఖరి అంశమైన δυνάμεις దగ్గర ఉంచాం.
