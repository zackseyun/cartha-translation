id: 1CO.12.17
reference: 1 Corinthians 12:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: te
  text: శరీరమంతా కన్నే అయితే[a], వినికిడి ఎక్కడ ఉంటుంది? అంతా వినికిడే అయితే, వాసన గ్రహించే శక్తి ఎక్కడ ఉంటుంది?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెవి ఎక్కడ ఉంటుంది? … ముక్కు ఎక్కడ ఉంటుంది?’ గ్రీకు మూలపాఠం మరింత అక్షరార్థంగా వినికిడి, వాసన గ్రహించే శక్తి అనే ఇంద్రియ సామర్థ్యాలను ప్రస్తావిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: శరీరమంతా
  rationale: ‘మొత్తం శరీరం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, శరీరమంతా ఒకే అవయవంగా ఉంటే అనే పౌలు ఊహాత్మక చిత్రాన్ని నిలుపుతుంది.
- source_word: ὀφθαλμός
  choice: కన్ను
  rationale: ఏకవచన శరీరావయవ రూపకాన్ని స్పష్టంగా నిలుపుతుంది; విధేయ స్థానంలో ‘కన్నే’ అని చెప్పడం తెలుగు షరతు వాక్యంలో సహజం.
- source_word: ποῦ
  choice: ఎక్కడ ఉంటుంది?
  rationale: ‘ఎక్కడ?’ అనే మూలార్థాన్ని కాపాడుతూ, ఊహాత్మక షరతుకు తగిన విధంగా తెలుగులో ‘ఉంటుంది’ అని వ్యక్తం చేస్తుంది.
- source_word: ἀκοή
  choice: వినికిడి
  rationale: ఈ పదం శారీరక అవయవమైన చెవిని కాక, వినే సామర్థ్యాన్ని సూచిస్తుంది. ‘వినికిడి’ రెండు సందర్భాల్లోనూ ఆ కార్యాత్మక భావాన్ని కాపాడుతుంది.
- source_word: ὅλον
  choice: అంతా
  rationale: రెండవ షరతు వాక్యంలో గ్రీకులో ‘శరీరం’ అనే నామవాచకం లోపించిన నిర్మాణాన్ని సహజమైన తెలుగు సంక్షిప్తతతో నిలుపుతుంది.
- source_word: ὄσφρησις
  choice: వాసన గ్రహించే శక్తి
  rationale: ముక్కు అనే అవయవం కంటే వాసనను గ్రహించే ఇంద్రియ సామర్థ్యాన్నే మూలపదం సూచిస్తుంది; ఈ పదబంధం ఆధునిక పాఠకునికి స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: శరీరావయవ రూపకంలో ఇంద్రియ సామర్థ్యాలా, శారీరక అవయవాలా అనే వ్యక్తీకరణ
  choice: ἀκοή, ὄσφρησις పదాలను ‘వినికిడి,’ ‘వాసన గ్రహించే శక్తి’ అనే ఇంద్రియ సామర్థ్యాలుగా అనువదించడం
  alternative: సులభమైన అవయవ సమాంతరత కోసం ‘చెవి,’ ‘ముక్కు’ అని అనువదించడం
  rationale: గ్రీకు పాఠం చెవి, ముక్కు అనే అవయవాల పేర్లను కాక వినడం, వాసన గ్రహించడం అనే సామర్థ్యాలను సూచించే నామవాచకాలను ఉపయోగిస్తుంది. వాటిని అలాగే నిలపడం మూలపాఠానికి దగ్గరగా ఉండి, పౌలు చెప్పినదానికంటే మరింత నిర్దిష్టమైన శరీర నిర్మాణ చిత్రాన్ని చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకునికి అర్థమయ్యేలా గౌరవప్రదమైన సరళ శైలి వాడబడింది. ‘శరీరమంతా కన్నే అయితే’ అనే రూపం ఊహాత్మక ప్రశ్నకు సహజత్వాన్ని ఇస్తుంది; రెండవ వాక్యంలో మూలంలోని సంక్షిప్తతను ‘అంతా’ ద్వారా నిలిపాం.
