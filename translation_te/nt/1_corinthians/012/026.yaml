id: 1CO.12.26
reference: 1 Corinthians 12:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: te
  text: ఒక అవయవం బాధపడితే, అవయవాలన్నీ దానితో కలిసి బాధపడతాయి; ఒక అవయవం గౌరవం పొందితే[a], అవయవాలన్నీ దానితో కలిసి సంతోషిస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మహిమపరచబడితే.” ఈ సందర్భంలో ఒక అవయవం గౌరవం పొందడం అనే భావమే ప్రధానంగా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: …తే …తే
  rationale: ఈ పరస్పర సంబంధిత నిర్మాణం రెండు సాధ్య పరిస్థితులను చూపుతుంది. తెలుగులో రెండు క్రియలకూ షరతును సూచించే ‘తే’ రూపాన్ని వాడటం సహజంగా ఉండి, మూలంలోని సమాంతరతను నిలుపుతుంది.
- source_word: πάσχει
  choice: బాధపడితే
  rationale: ఈ పదం శారీరక వేదనకే పరిమితం కాకుండా విస్తృతమైన బాధను సూచించగలదు; ‘బాధపడు’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: ἓν μέλος / μέλος
  choice: ఒక అవయవం
  rationale: సందర్భంలోని శరీర రూపకాన్ని స్పష్టంగా నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే పదం ‘అవయవం.’ రెండవ వాక్యభాగంలో సంఖ్యావాచకం లేకపోయినా, తెలుగు అనిర్దిష్ట ప్రయోగంలో ‘ఒక’ సహజంగా పనిచేస్తుంది.
- source_word: συμπάσχει
  choice: దానితో కలిసి బాధపడతాయి
  rationale: συν- ఉపసర్గలోని సహభాగిత భావాన్ని ‘దానితో కలిసి’ స్పష్టంగా వ్యక్తం చేస్తుంది; ఏకవచన అవయవంతో మిగతా అవయవాల సంఘీభావాన్ని నిలుపుతుంది.
- source_word: πάντα τὰ μέλη
  choice: అవయవాలన్నీ
  rationale: మూలంలోని సమస్తత్వాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు రూపంలో తెలియజేస్తుంది. రెండు వాక్యభాగాల్లో ఇదే రూపాన్ని పునరావృతం చేసి అలంకార సమాంతరతను కాపాడింది.
- source_word: δοξάζεται
  choice: ఘనపరచబడితే
  rationale: ఈ శరీర-సమాజ సందర్భంలో గౌరవం పొందడం ప్రధాన భావం. ‘ఘనపరచబడితే’ కర్మణి రూపాన్ని, అలాగే δοξάζω పదంలో ఉండగల ‘మహిమ’ భావ ఛాయను పూర్తిగా తొలగించకుండా ఉంచుతుంది.
- source_word: συγχαίρει
  choice: దానితో కలిసి సంతోషిస్తాయి
  rationale: సహ ఆనందాన్ని సూచించే συν- భావాన్ని ‘దానితో కలిసి’ వ్యక్తం చేస్తుంది. ‘సంతోషిస్తాయి’ సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉంటుంది.
theological_decisions:
- issue: సంఘ శరీర రూపకంలో δοξάζεται అర్థం
  choice: ఘనపరచబడితే
  alternative: మహిమపరచబడితే
  rationale: తక్షణ సందర్భం శరీరంలోని అవయవాల పరస్పర శ్రద్ధ, గౌరవం, సహభాగిత గురించి ఉంది. అందువల్ల సామాజిక గౌరవ భావం ముందుంటుంది; అయితే ‘మహిమపరచబడితే’ అనే సాధ్యమైన విస్తృత అర్థాన్ని పాదసూచికలో ఉంచి మూలపదంలోని భావ ఉద్రిక్తతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా అనువదించబడింది. ‘అవయవం’ అనే పదంతో పౌలు ఉపయోగించిన శరీర రూపకం నిలుపబడింది; ‘దానితో కలిసి’ అనే పునరుక్తితో రెండు వాక్యభాగాల సమాంతరత, పరస్పర సహభాగిత స్పష్టమయ్యాయి.
