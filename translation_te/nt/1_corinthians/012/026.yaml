revisions:
- from: ఒక అవయవం బాధపడితే, అవయవాలన్నీ దానితో కలిసి బాధపడతాయి; ఒక అవయవం ఘనపరచబడితే[a], అవయవాలన్నీ దానితో కలిసి సంతోషిస్తాయి.
  to: ఒక అవయవం బాధపడితే, అవయవాలన్నీ దానితో కలిసి బాధపడతాయి; ఒక అవయవం గౌరవం పొందితే[a], అవయవాలన్నీ దానితో కలిసి సంతోషిస్తాయి.
