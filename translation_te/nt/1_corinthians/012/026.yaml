review_pass:
  verdict: revise
  source_fidelity: 'The verse is conveyed accurately: the conditional parallelism, the body-member metaphor, shared suffering, and shared joy are all preserved. However, δοξάζεται is passive (''is honored/receives honor''); the draft''s ''ఘనపరచబడితే'' can mean ''is glorified'' and is less idiomatic for the contextual sense of receiving honor.'
  naturalness: ‘అవయవం’ and the repeated ‘దానితో కలిసి’ are natural and clear in modern standard Telugu. ‘గౌరవం పొందితే’ is more idiomatic and direct than ‘ఘనపరచబడితే’ in this social-body context.
  terminology: ‘అవయవం’ appropriately retains the σώμα/μέλος body metaphor. ‘బాధపడతాయి’ and ‘సంతోషిస్తాయి’ faithfully express συμπάσχει and συγχαίρει. ‘గౌరవం పొందితే’ best represents δοξάζεται here, while the lexical alternative ‘మహిమపరచబడితే’ should remain in the footnote.
  issues:
  - severity: medium
    issue: ‘ఘనపరచబడితే’ is not the clearest contextual rendering of δοξάζεται.
    rationale: Though it can express being glorified or honored, it is comparatively formal and may foreground ‘glorification.’ In this immediate context of mutual care and social recognition among body members, ‘గౌరవం పొందితే’ naturally conveys the passive sense ‘is honored’ without adding theological specificity.
  revised_text: ఒక అవయవం బాధపడితే, అవయవాలన్నీ దానితో కలిసి బాధపడతాయి; ఒక అవయవం గౌరవం పొందితే[a], అవయవాలన్నీ దానితో కలిసి సంతోషిస్తాయి.
  revised_footnotes:
  - marker: a
    text: లేదా, “మహిమపరచబడితే.” ఈ సందర్భంలో ఒక అవయవం గౌరవం పొందడం అనే భావమే ప్రధానంగా కనిపిస్తుంది.
