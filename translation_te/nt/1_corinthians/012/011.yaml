source:
  edition: SBLGNT
  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: te
  text: అయితే ఈవన్నీ కార్యరూపంలోకి తెచ్చేది[a] ఒకే ఆత్మ[b]. ఆయన తన చిత్తప్రకారం[d] ప్రతి ఒక్కరికీ విడివిడిగా పంచి ఇస్తాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈవన్నీ జరిగించేది,” “ఈవన్నీ కార్యసాధనం చేసేది.”
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో “ఒకే మరియు అదే ఆత్మ”; విభిన్నమైన వరాలు ఒకే మూలం నుండి వస్తాయని ఈ పదబంధం నొక్కిచెబుతుంది.
    reason: cross_reference
  - marker: c
    text: లేదా, “ప్రతి ఒక్కరికీ కేటాయిస్తూ.”
    reason: lexical_alternative
  - marker: d
    text: లేదా, “తాను ఎంచుకున్న ప్రకారం.” మూలభాషలోని క్రియ కోరడం, ఎంచుకోవడం, సంకల్పించడం అనే భావాలను తెలియజేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: అయితే ఈ కార్యాలన్నిటినీ
  rationale: πάντα ταῦτα ముందుగా పేర్కొన్న ఆత్మీయ ప్రత్యక్షీకరణలన్నిటినీ సమష్టిగా సూచిస్తుంది. δέ ఇక్కడ స్వల్ప మలుపును చూపుతున్నందున ‘అయితే’ అని అనువదించబడింది.
- source_word: ἐνεργεῖ
  choice: జరిగించేది
  rationale: ఈ క్రియ కేవలం పనిచేయడమే కాక కార్యసాధకంగా కలుగజేయడం అనే భావాన్ని ఇస్తుంది. ‘జరిగించేది’ ఆత్మ యొక్క క్రియాశీల కారణత్వాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: ఒక్కరే, అదే ఆత్మ
  rationale: మూలంలోని ἓν καὶ τὸ αὐτό వైవిధ్యమైన వరాలకు మూలం ఒక్కటేనని బలంగా నొక్కిచెబుతుంది. వ్యక్తిగత కార్యసాధకత్వం కారణంగా ‘ఒక్కరే’ అనే వ్యక్తివాచక రూపం వాడబడింది.
- source_word: διαιροῦν
  choice: పంచి ఇస్తాడు
  rationale: వరాలను వ్యక్తులకు కేటాయించి అందించడం అనే సందర్భోచిత భావాన్ని ఇది తెలియజేస్తుంది. గ్రీకులో ఇది ప్రధాన క్రియతో సమకాలికమైన అసమాపక క్రియారూపమైనా, సహజమైన తెలుగుకోసం సమన్విత సమాపక క్రియగా ఇవ్వబడింది.
- source_word: ἰδίᾳ ἑκάστῳ
  choice: ఒక్కొక్కరికి ప్రత్యేకంగా
  rationale: ἑκάστῳ ప్రతి వ్యక్తిని విడివిడిగా సూచిస్తే, ἰδίᾳ ఆ వ్యక్తిగత పంపిణీని బలపరుస్తుంది. ఈ తెలుగు పదబంధం రెండు భావాలనూ స్పష్టంగా ఉంచుతుంది.
- source_word: καθὼς βούλεται
  choice: తాను కోరిన ప్రకారం
  rationale: βούλομαι సంకల్పించడం, కోరడం లేదా ఎంచుకోవడం అనే పరిధి కలిగిన క్రియ. ‘తాను కోరిన ప్రకారం’ ఆత్మ యొక్క ఉద్దేశపూర్వక స్వతంత్ర కార్యాన్ని తెలియజేస్తూ, ఇతర సాధ్యమైన భావాలను పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: πνεῦμα మరియు βούλεταιలో ఆత్మ యొక్క వ్యక్తిగత కార్యసాధకత్వం
  choice: ‘ఆత్మ’ను పరిశుద్ధాత్మగా గ్రహించి, ‘ఆయన’, ‘తాను కోరిన’ అనే వ్యక్తివాచక రూపాలతో అనువదించడం
  alternative: గ్రీకు πνεῦμα వ్యాకరణపరంగా నపుంసకలింగం కాబట్టి వ్యక్తిని సూచించని నిర్మాణాన్ని వాడడం
  rationale: గ్రీకు పదం వ్యాకరణపరంగా నపుంసకలింగమైనా, βούλεται ఆత్మకు సంకల్పాన్ని ఆపాదిస్తుంది. ఈ సందర్భంలో ఆత్మ వరాలను ఉద్దేశపూర్వకంగా పంచే వ్యక్తిగత కార్యసాధకుడిగా చిత్రించబడుతున్నాడు. తెలుగు సహజ ప్రయోగంలో ‘ఆయన’ ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; వ్యాకరణలింగాన్ని సిద్ధాంతపరంగా అతిగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘వరాలు’ అనే పదాన్ని మూలవాక్యంలో ప్రత్యక్షంగా చేర్చకుండా, ‘ఈ కార్యాలన్నీ’ అనే విస్తృతమైన గ్రీకు వ్యక్తీకరణ నిలుపబడింది.
