reference: 1 Corinthians 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ διαιρέσεις διακονιῶν εἰσιν, καὶ ὁ αὐτὸς κύριος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/005.yaml
  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: te
  text: సేవలలో భిన్న రకాలు ఉన్నాయి[a], మరియు ప్రభువు ఒక్కరే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిచర్యలు’ లేదా ‘సేవా రూపాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: విధాలు వేర్వేరుగా
  rationale: ఈ సందర్భంలో భేదాలు ఉన్నా ఐక్యత కొనసాగుతుందనే భావం ఉంది; ‘విభజనలు’ అంటే కలహాలు లేదా వర్గభేదాలు అనే తప్పుదారి పట్టించే భావం రావచ్చు.
- source_word: διακονιῶν
  choice: సేవా
  rationale: ఈ పదం సేవలను, పరిచర్యలను, సేవా బాధ్యతలను సూచించగలదు. సాధారణ ఆధునిక తెలుగులో ‘సేవా విధాలు’ సహజంగా ఉండి విభిన్న సేవాకార్యాలను సూచిస్తుంది.
- source_word: ὁ αὐτὸς
  choice: ఒక్కరే
  rationale: విభిన్న సేవల మధ్య ప్రభువు ఏకత్వాన్ని తెలుగులో సహజంగా నొక్కిచెబుతుంది; మూలంలోని ‘అదే ప్రభువు’ భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: క్రొత్త నిబంధనలో κύριοςకు గౌరవభరితమైన ప్రామాణిక తెలుగు సమానార్థకం; ఇక్కడ దాని సూచిత వ్యక్తిని వివరణాత్మకంగా విస్తరించలేదు.
- source_word: καὶ
  choice: కానీ
  rationale: గ్రీకు καί సాధారణంగా ‘మరియు’ అయినా, ఇక్కడ విభిన్న సేవా విధాలు–ఒక్క ప్రభువు అనే భావసంబంధాన్ని సహజ తెలుగులో ‘కానీ’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰσιν
  choice: ఉన్నాయి
  rationale: బహువచన అస్తిత్వ క్రియను సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: 1 కొరింథీయులు 12:4–6లోని త్రివిధ నిర్మాణంలో ‘ప్రభువు’ ఎవరిని సూచిస్తుంది?
  choice: వచనంలో ‘ప్రభువు’ అనే బిరుదునే ఉంచడం; సందర్భపరంగా ఇది ఎక్కువగా ప్రభువైన యేసును సూచిస్తుంది.
  alternative: ప్రభువు/దేవునికి సాధారణ సూచనగా అర్థం చేసుకోవడం.
  rationale: సమీప సందర్భంలో ‘ఆత్మ’, ‘ప్రభువు’, ‘దేవుడు’ అనే సమాంతర నిర్మాణం ఉంది. మూలపాఠం వ్యక్తిని పేరుతో విస్తరించనందున అనువాదమూ ఆ వ్యాఖ్యానాత్మక ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవభరితమైన శైలి. ‘సేవా విధాలు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా, పాదసూచిక διακονιῶν పదంలోని ‘పరిచర్యలు/సేవలు’ అనే ప్రత్యామ్నాయాలను నిలుపుతుంది.
