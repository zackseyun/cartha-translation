  to: కృపావరాల్లో వైవిధ్యాలు ఉన్నాయి[a], అయితే అదే ఆత్మ.
  rationale: The sole revision replaces ‘ఆత్మ ఒక్కడే’ with ‘అదే ఆత్మ’ to represent the Greek emphasis on the same Spirit, rather than on the Spirit being the only one. The wording, terminology, contrastive connective, and footnote otherwise faithfully and naturally convey the source text.
