id: 1CO.12.4
reference: 1 Corinthians 12:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διαιρέσεις δὲ χαρισμάτων εἰσίν, τὸ δὲ αὐτὸ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: te
  text: కృపావరాల్లో వైవిధ్యాలు ఉన్నాయి[a], అయితే అదే ఆత్మ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కృపావరాల పంపిణీలు’ లేదా ‘కృపావరాల్లో తేడాలు.’ గ్రీకు పదం సంఘంలో విభజనను కాకుండా, కృపావరాల్లోని వైవిధ్యాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: వైవిధ్యాలు
  rationale: ఇక్కడ ఈ పదం సంఘంలోని విభేదాలను కాకుండా, కృపావరాల్లో ఉన్న భిన్న రకాలను లేదా తేడాలను సూచిస్తుంది. ‘వైవిధ్యాలు’ ఆ సానుకూల భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ ... δὲ
  choice: అయితే
  rationale: మొదటి δὲ స్వల్ప సంధాన/మార్పు సూచకంగా తెలుగులో ప్రత్యేక పదం లేకుండానే సహజంగా వ్యక్తమవుతుంది; రెండవ δὲ కృపావరాల వైవిధ్యానికీ ఆత్మ ఏకత్వానికీ మధ్య వ్యత్యాసాన్ని చూపడానికి ‘అయితే’గా అనువదించబడింది.
- source_word: χαρισμάτων
  choice: కృపావరాల్లో
  rationale: χάρισμα కృపచేత అనుగ్రహించబడిన వరాన్ని సూచిస్తుంది. సంఘ సందర్భంలో స్థిరపడిన, సంక్షిప్తమైన ‘కృపావరాలు’ అనే పదం ఆ భావాన్ని ‘వరాలు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: τὸ ... αὐτὸ
  choice: ఒక్కడే
  rationale: ఈ నిర్మాణం భిన్న కృపావరాలకు మూలమైన ఆత్మ యొక్క ఏకత్వం, అదే వ్యక్తిత్వం అనే నొక్కిచెప్పే భావాన్ని ఇస్తుంది. వ్యక్తిగా సూచించబడుతున్న ఆత్మకు తెలుగులో ‘ఒక్కడే’ సహజంగా, బలంగా ఉంటుంది.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: సమీప సందర్భం పరిశుద్ధాత్మనే కృపావరాల మూలంగా గుర్తిస్తుంది. అందువల్ల ‘ఆత్మ’ అని గౌరవార్థక సూచనతో అనువదించబడింది.
theological_decisions:
- issue: πνεῦμα యొక్క సూచిత వ్యక్తి
  choice: పరిశుద్ధాత్మ
  alternative: మానవ ఆత్మ లేదా ఒక ఆధ్యాత్మిక శక్తి/సూత్రం
  rationale: 1 కొరింథీయులు 12:3-11 సందర్భంలో వరాలను పంచే దైవిక ఆత్మ గురించే పౌలు మాట్లాడుతున్నాడు. ప్రధాన పాఠ్యంలో ‘పరిశుద్ధ’ అని విస్తరించకుండా ‘ఆత్మ’ అనడం మూలపాఠ్య సంక్షిప్తతను కాపాడుతుంది.
- issue: τὸ αὐτὸ πνεῦμα లో ఏకత్వ భావం
  choice: ఆత్మ ఒక్కడే
  alternative: అదే ఆత్మ
  rationale: ‘అదే ఆత్మ’ మూల నిర్మాణానికి దగ్గరగా ఉన్నప్పటికీ, తెలుగు వాక్యంలో ‘ఆత్మ ఒక్కడే’ వైవిధ్యానికి ఎదురుగా ఉన్న ఏకత్వాన్ని సహజంగా తెలియజేస్తుంది; అనేక ఆత్మలు ఉన్నాయనే భావాన్ని కూడా కలిగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘ పఠనానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతోనూ అనువదించబడింది. ‘కృపావరాలు’ క్రైస్తవ సందర్భంలో పరిచితమైన పదమైనప్పటికీ, పాదసూచిక ప్రత్యామ్నాయ అర్థాలను స్పష్టపరుస్తుంది.
