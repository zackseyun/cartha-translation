  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: te
  text: అయితే, అందరి మేలు కోసం ఆత్మ యొక్క ప్రత్యక్షత ప్రతి ఒక్కరికీ ఇవ్వబడుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రయోజనకరమైన దాని కోసం’; లేదా, ‘అందరి ప్రయోజనం కోసం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστῳ
  choice: ప్రతి ఒక్కరికీ
  rationale: దత్తివ ఏకవచన రూపం సంఘంలోని ప్రతి వ్యక్తికి విడివిడిగా ఇవ్వబడటాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ పంపిణీ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న వివరణతో స్వల్ప వ్యత్యాసాన్ని లేదా భావమార్పును సూచిస్తుంది; ‘అయితే’ దాని అనుసంధాన బలాన్ని అతిశయింపకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δίδοται
  choice: అనుగ్రహించబడుతుంది
  rationale: వర్తమానకాల కర్మణి రూపాన్ని నిలుపుతూ, ఇది వరంగా ఇవ్వబడుతున్నదనే సందర్భార్థాన్ని సహజమైన గౌరవప్రద తెలుగు భాషలో తెలియజేస్తుంది.
- source_word: φανέρωσις
  choice: ప్రత్యక్షత
  rationale: ఆత్మ కార్యం కనిపించేలా లేదా స్పష్టమయ్యేలా వ్యక్తమవడాన్ని సూచిస్తుంది; ‘ప్రత్యక్షత’ మూలపదంలోని బయలుపరచబడే భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: τοῦ πνεύματος
  choice: ఆత్మ
  rationale: ఈ అధ్యాయం సందర్భంలో పరిశుద్ధాత్మను సూచిస్తుంది. అయితే మూలంలో ‘పరిశుద్ధ’ అనే విశేషణం లేనందున దాన్ని చేర్చకుండా ‘ఆత్మ’గా ఉంచబడింది.
- source_word: πρὸς τὸ συμφέρον
  choice: అందరి మేలు కోసం
  rationale: συμφέρον ప్రయోజనం లేదా మేలును సూచిస్తుంది. శరీరంలోని సభ్యుల పరస్పర మేలుపై అధ్యాయం ఉంచే దృష్టిని ఈ సహజ తెలుగు ప్రయోగం తెలియజేస్తుంది; సాధారణ ప్రయోజనం అనే విస్తృత అర్థాన్ని పాదటిప్పణి నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆత్మ’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: సాధారణ అర్థంలోని ‘ఆత్మ’ లేదా ‘ఆధ్యాత్మిక శక్తి’
  rationale: 12వ అధ్యాయం 4, 8–11 వచనాల్లో వరాలకు మూలమైన ఒకే ఆత్మను పదేపదే ప్రస్తావించడం వల్ల పరిశుద్ధాత్మే స్పష్టమైన సూచ్యుడు. అయినా గ్రీకులో ఉన్నదానికంటే ఎక్కువ స్పష్టతను చేర్చకుండా ‘ఆత్మ’ అనే రూపమే ఉంచబడింది.
- issue: συμφέρον యొక్క ప్రయోజన పరిధి
  choice: సమాజంలోని అందరి మేలు
  alternative: సాధారణంగా ప్రయోజనకరమైనది లేదా వ్యక్తిగత మేలు
  rationale: పదానికి సాధారణ ప్రయోజనం అనే అర్థం ఉండగలిగినా, ఈ అధ్యాయంలోని శరీరం మరియు పరస్పర క్షేమం అనే సందర్భం సామూహిక దిశను బలపరుస్తుంది. పాదటిప్పణి పదబంధంలోని విస్తృత సాధ్యతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రద శైలి. ‘ఆత్మ ప్రత్యక్షత’ అనే పదబంధం మూలంలోని సంబంధాన్ని నిలుపుతుంది; ‘అందరి మేలు కోసం’ సందర్భంలోని సామూహిక దిశను సహజంగా వ్యక్తం చేస్తుంది.
