id: 1CO.12.15
reference: 1 Corinthians 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: te
  text: ఒకవేళ పాదం, “నేను చెయ్యి కాను కాబట్టి శరీరానికి చెందినదాన్ని కాను” అని అంటే,[a] ఆ కారణంగా అది శరీరానికి చెందకుండా పోదు కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత వ్యవహారికంగా: “నేను శరీరంలో భాగం కాను ... అందువల్ల అది శరీరంలో భాగం కాకుండా పోదు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: ఒకవేళ ... అని అంటే
  rationale: ἐὰν తో కూడిన aorist subjunctive సాధారణ ఊహాత్మక పరిస్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉండి ఆ ఊహాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ὁ πούς
  choice: పాదం
  rationale: పౌలు ఉపయోగించిన శరీర అవయవాల రూపకానికి ఆధారమైన స్పష్టమైన అవయవ చిత్రణను యథాతథంగా ఉంచుతుంది.
- source_word: Ὅτι
  choice: '... కాబట్టి'
  rationale: ఇక్కడ ὅτι పాదం చెప్పే మాటను పరిచయం చేస్తూనే కారణార్థాన్ని తెలియజేస్తుంది; తెలుగులో వాక్యాంతంలోని ‘కాబట్టి’ ఆ తర్కాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: χείρ
  choice: చెయ్యి
  rationale: పాదంతో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని, శరీర రూపకాన్ని కాపాడుతుంది; ‘చెయ్యి’ సాధారణ ఆధునిక తెలుగు పదం.
- source_word: ἐκ τοῦ σώματος
  choice: శరీరానికి చెందినది
  rationale: ఈ సందర్భంలో ἐκ τοῦ σώματος అనేది శరీరంలో సభ్యత్వం లేదా భాగసంబంధాన్ని సూచిస్తుంది. పదశః ‘శరీరం నుండి’ అనడం తెలుగులో మూలం/విడిపోవడం అనే తప్పు భావాన్ని కలిగించవచ్చు; ‘చెందినది’ సంబంధార్థాన్ని సహజంగా ఇస్తుంది.
- source_word: οὐ παρὰ τοῦτο
  choice: ఆ కారణంగా ... కాదు
  rationale: పాదం పేర్కొన్న కారణం వల్ల ఆ నిర్ధారణ నిజం కాదని ఈ పదబంధం ఖండిస్తుంది.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: అది శరీరానికి చెందకుండా పోదు కదా?
  rationale: గ్రీకులోని ప్రతికూల అలంకార ప్రశ్నను తెలుగులో సహజమైన ‘పోదు కదా?’ రూపంలో నిలుపుతూ, పాదం చేసిన వాదనను తిరస్కరిస్తుంది.
theological_decisions:
- issue: పౌలు శరీర రూపకంలోని పునరుక్తి మరియు ద్వినిషేధాన్ని ఎంతవరకు సహజీకరించాలి
  choice: ‘శరీరానికి చెందినది’ అనే సంబంధార్థాన్ని రెండుసార్లు నిలిపి, చివరి ద్వినిషేధాన్ని సహజ తెలుగు అలంకార ప్రశ్నగా ‘చెందకుండా పోదు కదా?’ అని ఇవ్వడం
  alternative: ‘శరీరంలోని భాగాన్ని కాను ... అందువల్ల అది శరీరంలోని భాగం కాకుండా పోదు’
  rationale: ఇక్కడ ప్రత్యేక మతపరమైన సిద్ధాంత వివాదం లేదు. మూలంలోని పునరుక్తి, వాదనా ఉద్రిక్తత నిలవాలి; అయితే ‘శరీరం నుండి’ అనే పదశః రూపం తెలుగులో అనుచిత అర్థాన్ని కలిగిస్తుంది. ఎంపిక చేసిన రూపం సభ్యత్వ భావాన్నీ అలంకార ప్రశ్ననూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘కాలు’ కంటే అవయవ నామంగా స్పష్టమైన ‘పాదం’, ‘చేయి’ కంటే సాధారణ ఉచ్చారణకు దగ్గరైన ‘చెయ్యి’ వాడబడ్డాయి. [a] సూచిక ప్రధాన పాఠ్యంలో ఉంది.
