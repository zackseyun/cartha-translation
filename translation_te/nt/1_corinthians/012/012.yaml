id: 1CO.12.12
reference: 1 Corinthians 12:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: te
  text: ఎందుకంటే, శరీరం ఒకటే అయినప్పటికీ అనేక అవయవాలను కలిగి ఉంది; శరీరంలోని అవయవాలన్నీ అనేకమైనప్పటికీ అవి ఒకే శరీరం. మెస్సీయ[a] కూడా అలాగే ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు.’ గ్రీకు పదమైన Χριστός ఒక బిరుదు; దాని అర్థాన్ని స్పష్టంగా నిలుపడానికి ఇక్కడ ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా, ‘అలాగే మెస్సీయ కూడా’ అని సంక్షిప్తంగా ఉంది. ‘శరీరం’ లేదా ‘సంఘం’ అనే పదాలను మూలం ఇక్కడ చేర్చదు; తరువాతి వచనాలు ఈ పోలికను విప్పి చెబుతాయి.
    reason: cross_reference
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: ఎందుకంటే, … ఉన్నట్లే
  rationale: γάρ యొక్క వివరణాత్మక అనుసంధానాన్ని ‘ఎందుకంటే’తో, καθάπερ యొక్క బలమైన పోలికను ‘ఉన్నట్లే’తో సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపింది.
- source_word: τὸ σῶμα
  choice: శరీరం
  rationale: పౌలు ఉపయోగించిన శరీర రూపకానికి నేరుగా సరిపోయే ప్రామాణిక తెలుగు పదం.
- source_word: ἕν
  choice: ఒక్కటి / ఒక్క
  rationale: సంఖ్యాపరమైన ఏకత్వాన్నీ, అనేక అవయవాలు కలిసి ఒకే శరీరంగా ఉండటాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: μέλη
  choice: అవయవాలు
  rationale: శరీర రూపకంలో తెలుగు పాఠకులకు ‘సభ్యులు’ కంటే ‘అవయవాలు’ సహజంగా, స్పష్టంగా ఉంటుంది; తరువాతి సందర్భంలో సమూహ అన్వయానికి కూడా పునాది వేస్తుంది.
- source_word: πολλὰ ὄντα
  choice: అనేకంగా ఉన్నా
  rationale: గ్రీకు కృదంత పదబంధంలోని concessive భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἕν ἐστιν σῶμα
  choice: ఒక్క శరీరంగా ఉన్నట్లే
  rationale: అవయవాలు అనేకమైనప్పటికీ అవి కలసి ఒకే శరీరం అనే భావాన్ని, తెలుగు వ్యాకరణానికి అనుగుణంగా నిలుపుతుంది.
- source_word: οὕτως καὶ
  choice: కూడా అలాగే
  rationale: పోలిక యొక్క ముగింపును సంక్షిప్తంగా ఉంచి, మూలంలోని ఉద్దేశపూర్వక సంకోచాన్ని కాపాడుతుంది.
- source_word: ὁ Χριστός
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉపయోగించబడింది; ‘మెస్సీయ’ అభిషిక్తుడు అనే బిరుదు భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ὁ Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός కేవలం పేరులా కాక బిరుదుగా నిలుస్తుంది. అందువల్ల దాని బిరుదు స్వభావాన్ని ‘మెస్సీయ’ స్పష్టంగా కాపాడుతుంది.
- issue: ‘οὕτως καὶ ὁ Χριστός’ అనే సంక్షిప్త వాక్యభాగం
  choice: ‘మెస్సీయ కూడా అలాగే’ అని సంక్షిప్తంగానే ఉంచడం
  alternative: ‘మెస్సీయ శరీరం కూడా అలాగే ఉంది’ లేదా ‘సంఘం కూడా అలాగే ఉంది’ అని విస్తరించడం
  rationale: మూలపాఠం ‘శరీరం’ లేదా ‘సంఘం’ అనే పదాలను ఈ ముగింపులో చేర్చదు. తరువాతి వచనాలు భావాన్ని విప్పి చెబుతాయి; ఇక్కడ వివరణను అనువాదంలోకి చేర్చకుండా పౌలు మాటలోని ఆశ్చర్యకరమైన గుర్తింపును, ధార్మిక ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. శరీర రూపకానికి ‘అవయవాలు’ వాడబడింది. చివరి భాగాన్ని ఉద్దేశపూర్వకంగా సంక్షిప్తంగా ఉంచి, మూలంలోని theological tension‌ను వివరణతో తొలగించలేదు.
