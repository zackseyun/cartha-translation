id: 1CO.12.6
reference: 1 Corinthians 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: te
  text: కార్యాల్లో వైవిధ్యాలు ఉన్నాయి; అయితే అందరిలో అన్నిటినీ జరిగించేవాడు అదే దేవుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అందరిలో.” గ్రీకులో ఇక్కడ ఎవరిని సూచిస్తున్నదో స్పష్టంగా చెప్పలేదు; సందర్భం ప్రకారం సంఘంలోని సభ్యులను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: వేర్వేరుగా
  rationale: సందర్భంలో విభేదం లేదా చీలిక కాకుండా, ఒకే మూలం నుంచి కనిపించే భిన్న విధాలను సూచిస్తుంది.
- source_word: ἐνεργημάτων
  choice: కార్యాలు జరిగే విధానాలు
  rationale: దైవిక క్రియాశీలత యొక్క కార్యరూపాలు లేదా ఫలితాలను సహజమైన తెలుగులో తెలియజేస్తుంది; తరువాతి ἐνεργῶνతో ఉన్న భావసంబంధాన్ని ‘కార్యసిద్ధి’ నిలుపుతుంది.
- source_word: ὁ δὲ αὐτὸς θεός
  choice: అయితే ... అదే దేవుడు
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని, αὐτός నొక్కిచెప్పే ఒకే గుర్తింపును నిలుపుతుంది.
- source_word: ὁ ἐνεργῶν
  choice: కార్యసిద్ధి చేసేది
  rationale: దేవుడే క్రియాశీలంగా అన్నిటినీ జరిగించేవాడనే భావాన్ని తెలియజేస్తూ, ἐνεργημάτωνతో పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: τὰ πάντα
  choice: అన్నిటినీ
  rationale: గ్రీకు పదబంధంలోని విస్తృత సమగ్రతను అనవసరంగా ‘ఈ కార్యాలన్నిటినీ’ అని కుదించకుండా ఉంచుతుంది.
- source_word: ἐν πᾶσιν
  choice: అందరిలో
  rationale: మూలంలో నామవాచకం స్పష్టంగా లేకపోయినా, ఈ సందర్భంలో సంఘ సభ్యులనే సూచించే సహజమైన వ్యక్తివాచక తెలుగు రూపం; ‘లో’ అనే అంతర్గత కార్యభావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: τὰ πάντα ἐν πᾶσιν లో దేవుని కార్య పరిధి
  choice: అందరిలో అన్నిటినీ కార్యసిద్ధి చేసేది
  alternative: అన్నిటిలో అన్నిటినీ కార్యసిద్ధి చేసేది / అందరి మధ్య ఈ కార్యాలన్నిటినీ జరిగించేది
  rationale: τὰ πάντα యొక్క విస్తృతతను నిలుపుతూ, ἐν πᾶσινను సందర్భానుసారం సంఘంలోని వ్యక్తులకు వర్తింపజేస్తుంది. అదే సమయంలో మూలంలోని నామవాచక లుప్తతను పాదటిప్పణిలో తెలియజేసి భావాన్ని సిద్ధాంతపరంగా అతిగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా పౌలు వాక్యంలోని గంభీరతను మరియు ‘వేర్వేరు కార్యాలు—అదే దేవుడు’ అనే వ్యత్యాసాన్ని నిలుపుతూ రూపొందించబడింది.
