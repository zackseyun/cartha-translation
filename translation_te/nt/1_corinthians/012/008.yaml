revisions:
- from: ఒకరికి ఆత్మ ద్వారా జ్ఞానవాక్యం[a] ఇవ్వబడుతుంది; మరొకరికి అదే ఆత్మ ప్రకారం తెలివికి సంబంధించిన వాక్యం[b][c] ఇవ్వబడుతుంది.
  to: ఒకరికి ఆత్మ ద్వారా వివేక సందేశం[a] ఇవ్వబడుతుంది; మరొకరికి అదే ఆత్మ ప్రకారం పరిజ్ఞాన సందేశం[b][c] ఇవ్వబడుతుంది.
  rationale: The revision retains the Greek present passive, distributive parallelism, and the meaningful prepositional distinction between διὰ τοῦ πνεύματος and κατὰ τὸ αὐτὸ πνεῦμα. It replaces an inaccurate/intuitively misleading knowledge term and uses matched Telugu expressions for the two parallel λόγος phrases. The wording does not attempt to specify the nature of either gift beyond Paul’s terminology.
