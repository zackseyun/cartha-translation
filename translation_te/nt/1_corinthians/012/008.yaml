id: 1CO.12.8
reference: 1 Corinthians 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: te
  text: ఒకరికి ఆత్మ ద్వారా వివేక సందేశం[a] ఇవ్వబడుతుంది; మరొకరికి అదే ఆత్మ ప్రకారం పరిజ్ఞాన సందేశం[b][c] ఇవ్వబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వివేక వాక్యం’; ‘వివేకపు మాట.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరిజ్ఞాన వాక్యం’; ‘పరిజ్ఞానపు మాట.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అదే ఆత్మచేత.’ ఇక్కడ గ్రీకులో వాడిన ఉపసర్గ, ముందున్న ‘ఆత్మ ద్వారా’లోని ఉపసర్గకు భిన్నమైనది; ఇది అదే ఆత్మకు అనుగుణంగా ఇవ్వబడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν ... ἄλλῳ δὲ
  choice: ఒకరికి ... మరొకరికి
  rationale: గ్రీకు వాక్యంలోని వ్యక్తులవారీ పంపిణీని, పరస్పర భేదాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διὰ τοῦ πνεύματος
  choice: ఆత్మ ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనం లేదా మధ్యవర్తిత్వ భావాన్ని నిలుపుతుంది.
- source_word: δίδοται
  choice: ఇవ్వబడుతుంది
  rationale: వర్తమానకాల కర్మణి రూపాన్ని నిలిపి, ఇది వ్యక్తి స్వయంగా సంపాదించేది కాక ప్రసాదించబడేదని తెలియజేస్తుంది.
- source_word: λόγος σοφίας
  choice: జ్ఞానవాక్యం
  rationale: λόγοςను కేవలం ఒక పదంగా కాక పలికే వాక్యం లేదా సందేశంగా అర్థం చేసుకునే వీలును ఉంచుతుంది; σοφίαకు సందర్భోచితంగా ‘జ్ఞానం’ వాడబడింది.
- source_word: λόγος γνώσεως
  choice: తెలివికి సంబంధించిన వాక్యం
  rationale: σοφία, γνῶσις రెండింటినీ ఒకే తెలుగు పదంతో కలిపివేయకుండా γνῶσις యొక్క తెలిసికొనడం/అవగాహన భావాన్ని ‘తెలివి’తో వేరు చేసింది; λόγοςకు సమాంతరంగా ‘వాక్యం’ నిలుపబడింది.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: అదే ఆత్మ ప్రకారం
  rationale: κατά తెలిపే అనుగుణత భావాన్ని కాపాడుతూ, ముందున్న διά (‘ద్వారా’)తో గ్రీకులోని ఉపసర్గ భేదాన్ని తెలుగులోనూ నిలుపుతుంది.
- source_word: πνεύματος / πνεῦμα
  choice: ఆత్మ
  rationale: 1 కొరింథీయులు 12 సందర్భంలో దైవిక పరిశుద్ధాత్మే ఉద్దేశించబడ్డాడు; తెలుగులో ‘ఆత్మ’ అనే పదం సందర్భానుసారం ఈ సూచనను సహజంగా మోస్తుంది.
theological_decisions:
- issue: ‘ఆత్మ’ ఎవరిని సూచిస్తుంది?
  choice: పరిశుద్ధాత్మ
  alternative: మానవ ఆత్మ
  rationale: అదే అధ్యాయంలోని వరాల పంపిణీ మరియు ‘ఒకే ఆత్మ’ గురించిన తక్షణ సందర్భం దైవిక ఆత్మను సూచిస్తుంది; వచనంలో సందర్భానికి మించి ‘పరిశుద్ధ’ అనే పదాన్ని చేర్చలేదు.
- issue: λόγος అనే పదం వరాల సందర్భంలో
  choice: వాక్యం
  alternative: సందేశం; ఉచ్చారణ; మాట
  rationale: గ్రీకు పదంలోని పలికిన మాట/సందేశం అనే విస్తృతిని ‘వాక్యం’ గౌరవప్రదంగా నిలుపుతుంది; అది తప్పనిసరిగా ఒక్క పదమేనని నిర్ధారించదు.
- issue: σοφία మరియు γνῶσις మధ్య భేదం
  choice: జ్ఞానం మరియు తెలివి
  alternative: జ్ఞానం మరియు పరిజ్ఞానం
  rationale: రెండు గ్రీకు పదాల మధ్య ఉన్న భేదాన్ని తెలుగులో కనబడేలా చేసింది. అయితే వాటి ప్రత్యేక వరాల ఖచ్చిత స్వభావాన్ని ఈ వచనం వివరించనందున దానిని సిద్ధాంతపరంగా నిర్వచించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన సాధారణ శైలి. గ్రీకులోని సమాంతర నిర్మాణం, కర్మణి ప్రయోగం, διά మరియు κατά మధ్య భేదం నిలుపబడ్డాయి. ‘జ్ఞానవాక్యం’ కొంత సంప్రదాయబద్ధంగా వినిపించినా సాధారణ క్రైస్తవ పాఠకులకు గ్రాహ్యమైనది; ప్రత్యామ్నాయ అర్థాలను పాదసూచికల్లో ఇచ్చాం.
