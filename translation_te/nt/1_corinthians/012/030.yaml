id: 1CO.12.30
reference: 1 Corinthians 12:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: te
  text: అందరికీ స్వస్థతనిచ్చే వరాలు[a] ఉండవు కదా? అందరూ భాషల్లో[b] మాట్లాడరు కదా? అందరూ అర్థం చెప్పరు కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్వస్థపరిచే వరాలు.’ గ్రీకులో అక్షరార్థంగా ‘స్వస్థతల వరాలు’ అని బహువచనంలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ సందర్భంలో ‘భాషలు’ అనే పదం సాధారణంగా ‘భాషల వరం’ అని పిలిచే ఆత్మీయ వరాన్ని సూచిస్తుంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: μὴ πάντες
  choice: అందరికీ/అందరూ ... ఉండరు/చేయరు కదా?
  rationale: μήతో మొదలయ్యే ఈ ప్రశ్నలు ప్రతికూల సమాధానాన్ని ఆశిస్తున్నాయి. తెలుగులో ‘... కదా?’ అనే నిర్మాణం పౌలు నొక్కిచెప్పే వరాల వైవిధ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: χαρίσματα
  choice: వరాలు
  rationale: χάρισμα దేవుని కృపచేత అనుగ్రహించబడిన సామర్థ్యాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘వరాలు’ సహజమైన, స్థిరపడిన తెలుగు పదం.
- source_word: ἰαμάτων
  choice: స్వస్థతల
  rationale: గ్రీకులో ఈ నామవాచకం బహువచనంలో ఉంది. ‘స్వస్థతల వరాలు’ అని అనువదించడం మూలంలోని అసాధారణమైన బహువచన భావాన్ని నిలుపుతుంది.
- source_word: γλώσσαις
  choice: భాషల్లో
  rationale: γλῶσσα ప్రాథమికంగా ‘భాష’ అని అర్థం; ఇక్కడ అది ఆత్మీయ వరంగా పలికే భాషలను సూచిస్తుంది. ‘భాషల్లో’ అనే పదం మూలపద భావాన్ని నిలుపుతూ సందర్భానికీ సరిపోతుంది.
- source_word: λαλοῦσιν
  choice: మాట్లాడరు
  rationale: వరాన్ని సాధారణంగా వినియోగించడాన్ని వర్తమానకాల రూపం సూచిస్తుంది; తెలుగులో సాధారణ వర్తమాన రూపం సహజంగా ఉంటుంది.
- source_word: διερμηνεύουσιν
  choice: అర్థం చెప్పరు
  rationale: ఈ సందర్భంలో పలికిన భాషను ఇతరులకు అర్థమయ్యేలా తెలియజేయడం భావం. ‘అర్థం చెప్పడం’ సాధారణ పాఠకులకు ‘వ్యాఖ్యానించడం’ కంటే స్పష్టంగా ఉంటుంది; ‘అనువదించడం’ అని మాత్రమే చెప్పి భావాన్ని అతిగా పరిమితం చేయదు.
theological_decisions:
- issue: μήతో ఉన్న అలంకారిక ప్రశ్నల స్వభావం
  choice: ప్రతికూల సమాధానాన్ని ఆశించే ‘... కదా?’ ప్రశ్నలుగా అనువదించడం
  alternative: ఆశించే సమాధానాన్ని సూచించని సాధారణ ప్రశ్నలుగా అనువదించడం
  rationale: గ్రీకు వాక్యనిర్మాణం ప్రతి విశ్వాసికీ ప్రతి వరం ఉండదనే సమాధానాన్ని ఆశిస్తుంది. ఈ రూపం ఒకే శరీరంలో వరాల వైవిధ్యంపై పౌలు ఉంచిన ప్రాధాన్యాన్ని కాపాడుతుంది.
- issue: γλώσσαις యొక్క స్వభావం
  choice: భాషల్లో
  alternative: అన్యభాషల్లో
  rationale: మూలపదం స్వయంగా ‘అన్య’ అనే విశేషణాన్ని కలిగి లేదు. ‘భాషల్లో’ అని ఉంచడం ద్వారా ఈ వరం యొక్క ఖచ్చిత స్వభావంపై మూలంలోని విస్తృతతను అనవసరంగా కుదించకుండా ఉంటాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూడు సమాంతర ప్రశ్నల లయను నిలిపి, ‘కదా?’ ద్వారా ప్రతికూల సమాధాన నిరీక్షణను స్పష్టం చేశాము. ఆంగ్ల సంప్రదింపు పాఠంలో [b] గుర్తు ‘interpret’ తర్వాత ఉన్నప్పటికీ, దాని గమనిక γλώσσαις గురించినది కాబట్టి తెలుగు ప్రధాన పాఠంలో ఆ గుర్తును ‘భాషల్లో’ తర్వాత ఉంచాము.
