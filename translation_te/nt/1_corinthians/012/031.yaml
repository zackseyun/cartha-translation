id: 1CO.12.31
reference: 1 Corinthians 12:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: te
  text: అయితే, మరింత గొప్ప వరాలను ఆసక్తితో కోరుకోండి.[a] ఇంకా ఎంతో శ్రేష్ఠమైన మార్గాన్ని నేను మీకు చూపిస్తాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయితే, మీరు మరింత గొప్ప వరాలను ఆసక్తితో కోరుకుంటున్నారు.” ఇక్కడి గ్రీకు క్రియారూపాన్ని ఆజ్ఞగా గానీ, ఒక వాస్తవాన్ని తెలిపేదిగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థానికి దగ్గరగా, “ఇంకా మించిన మార్గాన్ని.” సంప్రదాయంగా, “మరింత శ్రేష్ఠమైన మార్గాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: ఆసక్తితో కోరుకోండి
  rationale: ζηλόω బలమైన కోరికను లేదా ఉత్సాహపూర్వకమైన ఆశను సూచిస్తుంది. సందర్భంలో ఆజ్ఞార్థక భావాన్ని ప్రధాన పాఠంలో ఉంచుతూ, దాని తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: χαρίσματα
  choice: వరాలను
  rationale: χάρισμα కృపచేత లభించే వరాన్ని సూచిస్తుంది. ఈ అధ్యాయం సందర్భం అవి ఆత్మసంబంధమైన వరాలని స్పష్టం చేస్తుంది; మూలపాఠంలో లేని విశేషణాన్ని చేర్చకుండా ‘వరాలు’ అని అనువదించబడింది.
- source_word: μείζονα
  choice: మరింత గొప్ప
  rationale: తులనాత్మక భావమైన ‘greater’ లేదా ‘more important’ను నిలుపుతుంది; ఏ విధంగా గొప్పవో అనువాదంలో ముందుగానే నిర్ణయించదు.
- source_word: καὶ ἔτι
  choice: ఇంకా
  rationale: మునుపటి అంశంతో కొనసాగింపునూ, తరువాత చెప్పబోయేదానిలో అధికతనూ సూచిస్తుంది.
- source_word: καθ’ ὑπερβολὴν
  choice: ఎంతో శ్రేష్ఠమైన
  rationale: హద్దులను మించిన అధికత అనే గ్రీకు భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది. అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: ὁδὸν
  choice: మార్గాన్ని
  rationale: ὁδός ఇక్కడ జీవన విధానం లేదా అనుసరించవలసిన పద్ధతిని సూచించే రూపకం; ‘మార్గం’ ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: δείκνυμι
  choice: నేను మీకు చూపిస్తాను
  rationale: గ్రీకులో వర్తమాన రూపం ఉన్నప్పటికీ, వెంటనే తరువాతి భాగంలో వివరించబోయే విషయాన్ని తెలుగులో సహజంగా సూచించడానికి సమీప భవిష్యత్ భావం వాడబడింది.
theological_decisions:
- issue: ζηλοῦτε రూపం యొక్క భావం
  choice: 'ఆజ్ఞార్థకం: ‘ఆసక్తితో కోరుకోండి’'
  alternative: 'సూచనార్థకం: ‘మీరు మరింత గొప్ప వరాలను ఆసక్తితో కోరుకుంటున్నారు’'
  rationale: ζηλοῦτε రూపం ఈ సందర్భంలో ఆజ్ఞార్థకంగానూ సూచనార్థకంగానూ చదవవచ్చు. అధ్యాయం యొక్క ఉపదేశాత్మక ప్రవాహానికి ఆజ్ఞార్థకం బాగా సరిపోతుంది; అయితే నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వాక్యంలోని వ్యాకరణ సందిగ్ధతను పాదసూచికలో స్పష్టంగా ఉంచి, 13వ అధ్యాయానికి దారితీసే ‘మార్గం’ రూపకాన్ని నిలిపాం.
