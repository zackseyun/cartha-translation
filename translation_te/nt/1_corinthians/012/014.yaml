id: 1CO.12.14
reference: 1 Corinthians 12:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ γὰρ τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/014.yaml
  text: For the body is not one member, but many.
translation:
  language: te
  text: ఎందుకంటే శరీరం ఒకే అవయవం కాదు; అది అనేక అవయవాలతో కూడి ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు వివరణను జోడించే అన్వయార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; రెండు గ్రీకు అవ్యయాలను విడివిడిగా కృత్రిమంగా అనువదించదు.
- source_word: τὸ σῶμα
  choice: శరీరం
  rationale: ఇది నామవాచక కర్తకు ప్రత్యక్ష సమానార్థకం. సందర్భంలో సంఘాన్ని సూచించే రూపకం అయినా, మూలపాఠంలోని శరీర రూపకాన్నే ప్రధాన పాఠంలో నిలుపుతుంది.
- source_word: οὐκ ἔστιν
  choice: కాదు
  rationale: నిరాకరణతో కూడిన సాధారణ అస్తిత్వ క్రియను సంక్షిప్తంగా, నేరుగా వ్యక్తం చేస్తుంది; ‘కూడి ఉన్నది’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: ἓν μέλος
  choice: ఒకే అవయవం
  rationale: μέλοςకు సందర్భోచితమైన ‘అవయవం’ శరీర రూపకాన్ని నిలుపుతుంది. ‘ఒకే’ ఏకత్వంపై ఉన్న ఉద్ఘాటనను సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ἀλλὰ πολλά
  choice: అనేక అవయవాలు
  rationale: πολλά విశేషణం ఇక్కడ నామవాచకార్థంలో వాడబడింది; ముందున్న μέλοςను తెలుగులో పునరుక్తి చేయడం వాక్యాన్ని స్పష్టంగా, సహజంగా చేస్తుంది.
theological_decisions:
- issue: ‘శరీరం’ అనే రూపకపు సూచన
  choice: ప్రధాన పాఠంలో ‘శరీరం’ అనే రూపకాన్నే ఉంచడం
  alternative: ‘క్రీస్తు శరీరం’ అని విస్తరించడం
  rationale: విస్తృత సందర్భం సంఘాన్ని క్రీస్తు శరీరంగా చూపించినా, ఈ వచనంలో τὸ σῶμα మాత్రమే ఉంది. ‘క్రీస్తు’ అని చేర్చడం మూలపాఠంలో లేని సందర్భార్థాన్ని ప్రధాన పాఠంలోకి తీసుకువస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘అవయవం’ అనే పదం పౌలు ఉపయోగించిన శరీర రూపకాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
