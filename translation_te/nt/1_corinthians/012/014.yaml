revisions:
- from: ఎందుకంటే శరీరం ఒకే అవయవం కాదు, అనేక అవయవాలు.
  to: ఎందుకంటే శరీరం ఒకే అవయవం కాదు; అది అనేక అవయవాలతో కూడి ఉంది.
  rationale: The revision retains the explanatory connection and Paul’s body/member imagery while supplying the predicate needed for fluent modern Telugu. The phrase ‘అనేక అవయవాలతో కూడి ఉంది’ makes explicit only what is syntactically understood from the Greek contrast and does not identify the body as Christ’s body or otherwise interpret the metaphor.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:04:18Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the explanatory γάρ, the body metaphor, the contrast between one member and many, and does not import “Christ” into the text. However, the final Telugu predicate is elliptic in a way that leaves the sentence structurally incomplete.
  naturalness: ‘ఎందుకంటే శరీరం ఒకే అవయవం కాదు, అనేక అవయవాలు’ is understandable, but ‘అనేక అవయవాలు’ lacks a completing predicate in standard Telugu prose. A semicolon and an explicit natural predicate make the contrast clear.
  terminology: ‘శరీరం’ and ‘అవయవం’ appropriately preserve the bodily metaphor and are suitable for modern standard Telugu. No theological expansion is introduced.
  issues:
  - severity: medium
    issue: The second half of the sentence lacks a natural Telugu predicate.
    rationale: Greek can leave πολλά substantival by ellipsis, but reproducing that ellipsis as ‘అనేక అవయవాలు’ after ‘కాదు’ is not fully idiomatic Telugu. ‘అనేక అవయవాలతో కూడి ఉంది’ expresses the intended one-versus-many composition without changing the metaphor.
  revised_text: ఎందుకంటే శరీరం ఒకే అవయవం కాదు; అది అనేక అవయవాలతో కూడి ఉంది.
  revised_footnotes: []
  revision_rationale: The revision retains the explanatory connection and Paul’s body/member imagery while supplying the predicate needed for fluent modern Telugu. The phrase ‘అనేక అవయవాలతో కూడి ఉంది’ makes explicit only what is syntactically understood from the Greek contrast and does not identify the body as Christ’s body or otherwise interpret the metaphor.
