source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: te
  text: 'దేవుడు సంఘంలో మొదట అపొస్తలులను, రెండవదిగా ప్రవక్తలను, మూడవదిగా బోధకులను, ఆ తరువాత అద్భుత కార్యాలను[a], ఆ తరువాత స్వస్థపరిచే వరాలను, సహాయక సేవలను, నిర్వహణ సామర్థ్యాలను[b], వివిధ రకాల భాషల వరాలను[c] నియమించాడు.


    [a] మూలభాషలోని పదాన్ని మరింత అక్షరార్థంగా “శక్తికార్యాలు” అని కూడా అనువదించవచ్చు.


    [b] లేదా “మార్గనిర్దేశ సామర్థ్యాలు” లేదా “నాయకత్వ విధానాలు.” ఈ పదం నడిపించడం, దిశానిర్దేశం చేయడం అనే భావాన్ని కలిగి ఉంది.


    [c] మూలభాషలోని పదాన్ని “నాలుకలు” లేదా “భాషలు” అని అనువదించవచ్చు. ఈ సందర్భంలో పౌలు ఉద్దేశించిన దృగ్విషయం ఏ స్వరూపమైనదో నిర్ధారించకుండా, ప్రధాన పాఠంలో “భాషల వరాలు” అనే సంప్రదాయబద్ధమైన పదప్రయోగం వాడబడింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని పదాన్ని మరింత అక్షరార్థంగా “శక్తికార్యాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మార్గనిర్దేశ సామర్థ్యాలు” లేదా “నాయకత్వ విధానాలు.” ఈ పదం నడిపించడం, దిశానిర్దేశం చేయడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: c
    text: మూలభాషలోని పదాన్ని “నాలుకలు” లేదా “భాషలు” అని అనువదించవచ్చు. ఈ సందర్భంలో పౌలు ఉద్దేశించిన దృగ్విషయం ఏ స్వరూపమైనదో నిర్ధారించకుండా, ప్రధాన పాఠంలో “భాషల వరాలు” అనే సంప్రదాయబద్ధమైన పదప్రయోగం వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: నియమించాడు
  rationale: సంఘంలో వ్యక్తులకు పాత్రలను, కార్యాలను దేవుడు ఏర్పాటు చేసిన భావాన్ని సహజంగా తెలియజేస్తుంది; కేవలం స్థలంలో ‘ఉంచాడు’ అనే అర్థానికి పరిమితం కాదు.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: సంఘంలో
  rationale: పౌలు వాడుకలో దేవుని ప్రజల సమూహాన్ని సూచించే సహజమైన, స్థిరపడిన తెలుగు పదం.
- source_word: πρῶτον ... δεύτερον ... τρίτον
  choice: మొదట ... రెండవదిగా ... మూడవదిగా
  rationale: మూలంలోని స్పష్టమైన క్రమాన్ని నిలుపుతూ, ఆ క్రమం యొక్క ఉద్దేశాన్ని అదనంగా వ్యాఖ్యానించదు.
- source_word: ἀποστόλους
  choice: అపొస్తలులను
  rationale: ఇక్కడ సాధారణ దూతలను కాక, గుర్తింపు పొందిన అపొస్తల కార్యాన్ని సూచించే స్థిరపడిన పదం.
- source_word: προφήτας
  choice: ప్రవక్తలను
  rationale: ప్రవచనాత్మక ప్రకటనను పలికేవారికి సహజమైన ప్రామాణిక అనువాదం.
- source_word: διδασκάλους
  choice: బోధకులను
  rationale: సంఘంలో బోధించే పాత్రను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: δυνάμεις
  choice: అద్భుత కార్యాలను
  rationale: పదానికి అక్షరార్థంగా ‘శక్తులు’ అనే భావం ఉన్నా, ఈ వరాల జాబితాలో శక్తివంతమైన అద్భుత కార్యాలను సూచిస్తుంది; అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: χαρίσματα ἰαμάτων
  choice: స్వస్థపరిచే వరాలను
  rationale: రెండు గ్రీకు నామవాచకాలూ బహువచనంలో ఉన్న భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀντιλήμψεις
  choice: సహాయక సేవలను
  rationale: ఇతరులకు తోడ్పడే కార్యాలు లేదా సామర్థ్యాలు అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: κυβερνήσεις
  choice: నిర్వహణ సామర్థ్యాలను
  rationale: నడిపించడం, దిశానిర్దేశం చేయడం, వ్యవహారాలను నిర్వహించడం అనే భావాలను తెలియజేస్తూ, నిర్దిష్ట హోదాను అనవసరంగా రుద్దదు.
- source_word: γένη γλωσσῶν
  choice: వివిధ రకాల భాషలను
  rationale: γένη లోని రకాలు అనే భావాన్ని నిలుపుతుంది. γλῶσσαι యొక్క స్వరూపాన్ని పూర్తిగా నిర్ణయించకుండా దాని భాషలు/నాలుకలు అనే భావ విస్తృతిని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: ఈ క్రమం శాశ్వత అధికార హోదానా, కాలక్రమమా, లేక కార్యప్రాముఖ్యతనా?
  choice: మొదట ... రెండవదిగా ... మూడవదిగా ... ఆ తరువాత అనే క్రమాన్ని యథాతథంగా చూపించడం
  alternative: దీనిని అధికార శ్రేణిగా, కాలక్రమంగా, లేదా సాపేక్ష ప్రాముఖ్యతగా స్పష్టీకరించడం
  rationale: వచనం క్రమాన్ని ఇస్తుంది గాని దాని స్వరూపాన్ని వివరించదు. అందువల్ల అనువాదం వ్యాఖ్యానాత్మక నిర్ణయాన్ని చేర్చదు.
- issue: γλῶσσαι యొక్క ఖచ్చితమైన అర్థం
  choice: ప్రధాన పాఠంలో ‘భాషలు’ అని ఉంచి, పదంలోని విస్తృతిని పాదసూచికలో తెలియజేయడం
  alternative: దీనిని కేవలం తెలిసిన మానవ భాషలుగా లేదా కేవలం పరవశ వాక్కుగా నిర్ణయించడం
  rationale: ఈ సందర్భంలోని దృగ్విషయం గురించి ఉన్న నిజమైన వ్యాఖ్యాన భేదాన్ని అనువాదం ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. సంఘ సంబంధిత స్థిరపదాలైన ‘అపొస్తలులు,’ ‘ప్రవక్తలు,’ ‘బోధకులు,’ ‘వరాలు’ వాడబడ్డాయి. గ్రీకు జాబితిలో వ్యక్తుల నుంచి కార్యాలు/సామర్థ్యాలకు జరిగే మార్పును సున్నితంగా నిలుపడానికి చివర ‘నియమించాడు’ పునరుక్తి చేయబడింది.
