    rationale: The explanatory claim should be adjusted so that the note itself, rather than an overstated description of the main text, preserves the lexical ambiguity.
  revised_text: 'దేవుడు సంఘంలో మొదట అపొస్తలులను, రెండవదిగా ప్రవక్తలను, మూడవదిగా బోధకులను, ఆ తరువాత అద్భుత కార్యాలను[a], ఆ తరువాత స్వస్థపరిచే వరాలను, సహాయక సేవలను, నిర్వహణ సామర్థ్యాలను[b], వివిధ రకాల భాషల వరాలను[c] నియమించాడు.


