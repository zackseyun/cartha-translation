  edition: SBLGNT
  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: te
  text: ఆత్మసంబంధమైన వరాల[a] విషయానికి వస్తే, సహోదరులారా[b], మీరు తెలియకుండ ఉండాలని నేను కోరను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆత్మసంబంధమైన విషయాలు.” గ్రీకు పదబంధం “వరాలు” కంటే విస్తృతమైనది; అయితే ఈ అధ్యాయ సందర్భం ఆత్మ ఇచ్చే వరాలపై ప్రధానంగా దృష్టి పెడుతుంది.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ “సహోదరులు” అనేది పౌలు సంఘాన్ని సంబోధించే విధానం; ఇందులో స్త్రీలు కూడా ఉద్దేశించబడి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: విషయానికి వస్తే
  rationale: περί కొత్త అంశాన్ని సూచిస్తుంది; δέ స్వల్ప విషయమార్పును తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘విషయానికి వస్తే’ ఈ రెండింటి సంభాషణాత్మక ప్రవాహాన్ని సహజంగా అందిస్తుంది; మూలంలో లేని కాలార్థక ‘ఇప్పుడు’ను చేర్చదు.
- source_word: τῶν πνευματικῶν
  choice: ఆత్మసంబంధమైన వరాల
  rationale: ఈ విశేషణం నామవాచకంగా వాడబడింది; అక్షరార్థంగా ‘ఆత్మసంబంధమైన వాటి’ అనే విస్తృత భావం సాధ్యం. అయితే 12:4–11లో ఆత్మ ఇచ్చే వరాలు, ప్రత్యక్షతలు ప్రధానంగా ఉండటం వల్ల సందర్భానుసారంగా ‘వరాలు’ స్పష్టమైన పఠనం. మూలంలోని విస్తృతతను పాదసూచికలో నిలుపుతున్నాం.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: పుంలింగ బహువచన సంబోధనను గౌరవప్రదమైన, సహజమైన తెలుగులో నేరుగా అందిస్తుంది. పౌలు సంఘమంతటినీ—స్త్రీలను కూడా—ఉద్దేశించే అవకాశం పాదసూచికలో తెలియజేయబడింది.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: మీరు తెలియనివారిగా ఉండడం నాకు ఇష్టం లేదు
  rationale: తెలియకపోవడం లేదా అవగాహన లేకపోవడం అనే భావాన్ని నిందార్థం లేకుండా ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ముఖ్యమైన బోధను పరిచయం చేసే పౌలు వాడుకను నిలుపుతుంది.
theological_decisions:
- issue: τῶν πνευματικῶν యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మసంబంధమైన వరాలు’
  alternative: ‘ఆత్మసంబంధమైన విషయాలు’; వ్యాకరణపరంగా ‘ఆత్మసంబంధమైన వ్యక్తులు’ కూడా సాధ్యమే
  rationale: గ్రీకు పదబంధంలో ‘వరాలు’ అనే నామవాచకం ప్రత్యక్షంగా లేదు; అందువల్ల అది విస్తృతంగా ఉంటుంది. అయినా వెంటనే వచ్చే సందర్భం ఆత్మ ఇచ్చే వరాలు, ప్రత్యక్షతలపై కేంద్రీకృతమై ఉంది. స్పష్టత కోసం సందర్భోచిత పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచి, నిజమైన అస్పష్టతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, లేఖన పఠనానికి తగిన గౌరవభరిత శైలిలోనూ ఉంది. మూలంలోని విషయమార్పు, వ్యాకరణ అస్పష్టత, పుంలింగ సంబోధన అన్నీ పాఠ్యం మరియు పాదసూచికల సమన్వయంతో నిలుపబడ్డాయి.
