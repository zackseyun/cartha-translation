id: 1CO.12.21
reference: 1 Corinthians 12:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: te
  text: అయితే కన్ను చేతికి, “నాకు నీ అవసరం లేదు,” అని చెప్పలేడు; లేదా తల పాదాలకు, “నాకు మీ అవసరం లేదు,” అని చెప్పలేడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: చెప్పలేదు
  rationale: తెలుగులో సామర్థ్యలేమిని సహజంగా వ్యక్తం చేస్తూ, ఇది కేవలం చెప్పకూడదనే భావం కాదని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న శరీర భాగాల పరస్పర ఆధారితత్వ చర్చతో ఉన్న వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: ὁ ὀφθαλμός
  choice: కన్ను
  rationale: పౌలు కొనసాగిస్తున్న శరీర రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: τῇ χειρί
  choice: చేతితో
  rationale: దత్తివాచక పరోక్ష కర్మను తెలుగులో సహజమైన ‘తో’ రూపంతో వ్యక్తం చేస్తుంది.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: నువ్వు నాకు అవసరం లేదు
  rationale: χρεία అనే ‘అవసరం’ భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది; ఏకవచన σουను ‘నువ్వు’గా స్పష్టంగా చూపుతుంది.
- source_word: ἢ πάλιν
  choice: అలాగే
  rationale: రెండవ సదృశ ఉదాహరణను సహజంగా పరిచయం చేస్తుంది.
- source_word: ἡ κεφαλή
  choice: తల
  rationale: శరీర రూపకాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా కాపాడుతుంది.
- source_word: τοῖς ποσίν
  choice: పాదాలతో
  rationale: మూలంలోని బహువచన శరీర భాగాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὑμῶν
  choice: మీరు
  rationale: మూల గ్రీకులోని బహువచనాన్ని తెలుగులో నేరుగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సంఘ పరస్పర ఆధారితత్వానికి శరీర రూపకం
  choice: శరీర భాగాల చిత్రణను అక్షరార్థంగా నిలుపడం
  alternative: ప్రధాన పాఠ్యంలోనే సంఘ సభ్యులని వివరణాత్మకంగా చెప్పడం
  rationale: పౌలు ఉద్దేశించిన ధార్మిక బోధ రూపకంపైనే ఆధారపడి ఉంది; దానిని ప్రధాన పాఠ్యంలో వివరించడం అనువాదాన్ని మించి వ్యాఖ్యానమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘నువ్వు’–‘మీరు’ భేదం ద్వారా మూలంలోని ఏకవచన σου మరియు బహువచన ὑμῶν రెండూ స్పష్టంగా నిలిచాయి; అందువల్ల ఆంగ్ల ముసాయిదాలోని బహువచన సూచనకు తెలుగు పాఠ్యంలో పాదటిప్పణి అవసరం లేదు.
