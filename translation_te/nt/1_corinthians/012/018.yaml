id: 1CO.12.18
reference: 1 Corinthians 12:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: te
  text: కాని వాస్తవానికి, దేవుడు అవయవాలను, వాటిలో ప్రతి ఒక్కదానిని, తాను కోరినట్లుగా శరీరంలో అమర్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అమర్చాడు’ అనే పదానికి ‘ఉంచాడు’ లేదా ‘నిలిపాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: కాని వాస్తవానికి
  rationale: ముందున్న ఊహాత్మక వాక్యాలకు వ్యతిరేకంగా వాస్తవ పరిస్థితిని చూపే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం కాలసూచకమైన ‘కాని ఇప్పుడు’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: గ్రీకు కర్తకు నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: ἔθετο
  choice: అమర్చాడు
  rationale: τίθημι యొక్క ‘ఉంచు/నిలుపు’ భావంతోపాటు, శరీరంలో అవయవాలను ఉద్దేశపూర్వకంగా తగిన స్థానాల్లో ఏర్పాటు చేసిన సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: τὰ μέλη
  choice: అవయవాలలో
  rationale: శరీర రూపకంలో μέλη అనేది శరీరంలోని భాగాలను సూచిస్తుంది; ‘అవయవాలు’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: ἓν ἕκαστον αὐτῶν
  choice: ప్రతి ఒక్కదానిని
  rationale: ప్రతి అవయవాన్ని విడివిడిగా నొక్కిచెప్పే గ్రీకు విభాజక భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ σώματι
  choice: శరీరంలో
  rationale: మూలంలోని స్థానార్థాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καθὼς ἠθέλησεν
  choice: తనకు ఇష్టమైన విధంగా
  rationale: దేవుని సంకల్పం లేదా అభిలాష ప్రకారమే అమరిక జరిగిందనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; అతి సాంకేతికమైన సిద్ధాంత పదజాలాన్ని నివారిస్తుంది.
theological_decisions:
- issue: శరీరంలోని ప్రతి అవయవం ఏర్పాటులో దేవుని ఉద్దేశపూర్వక సంకల్పం
  choice: ప్రతి అవయవాన్ని దేవుడు తనకు ఇష్టమైన విధంగా శరీరంలో అమర్చాడని అనువదించడం
  alternative: దేవుడు ప్రతి అవయవాన్ని శరీరంలో కేవలం ఉంచాడని బలహీనంగా అనువదించడం
  rationale: ἔθετο మరియు καθὼς ἠθέλησεν కలిసి వైవిధ్యం యాదృచ్ఛికం కాదని, దేవుని ఉద్దేశానికి అనుగుణంగా ఉందని సూచిస్తాయి. ‘అమర్చాడు’ ఈ ఉద్దేశపూర్వకతను చూపుతుంది; అయితే వచనానికి మించిన విస్తృత సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా గౌరవప్రదమైన బైబిలు శైలిలో రూపొందించబడింది. గ్రీకు వాక్యంలోని వ్యతిరేకత, ప్రతి అవయవంపై ఉన్న వ్యక్తిగత నొక్కిచెప్పడం, దేవుని సంకల్ప భావం నిలుపబడ్డాయి.
