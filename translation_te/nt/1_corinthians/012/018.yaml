revisions:
- from: కాని వాస్తవానికి, దేవుడు అవయవాలలో ప్రతి ఒక్కదానిని తనకు ఇష్టమైన విధంగా శరీరంలో అమర్చాడు.[a]
  to: కాని వాస్తవానికి, దేవుడు అవయవాలను, వాటిలో ప్రతి ఒక్కదానిని, తాను కోరినట్లుగా శరీరంలో అమర్చాడు.[a]
  rationale: The revision preserves the Greek's appositional distributive expression (“the members, each one of them”), its contrast with the preceding hypothetical argument, and God's purposive volition. It also places the lexical footnote anchor directly on the relevant verb.
