    text: ‘అమర్చాడు’ అనే పదానికి ‘ఉంచాడు’ లేదా ‘నిలిపాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek's appositional distributive expression (“the members, each one of them”), its contrast with the preceding hypothetical argument, and God's purposive volition. It also places the lexical footnote anchor directly on the relevant verb.
