  edition: SBLGNT
  text: νῦν δὲ πολλὰ ⸀μὲν μέλη, ἓν δὲ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/020.yaml
  text: But as it is[a], there are many parts, yet one body.
translation:
  language: te
  text: కాని వాస్తవానికి, అవయవాలు అనేకం, శరీరం మాత్రం ఒక్కటే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν
  choice: వాస్తవానికి
  rationale: ముందటి వచనంలోని ఊహాత్మక పరిస్థితికి భిన్నంగా ప్రస్తుతం ఉన్న వాస్తవ స్థితిని సూచించే సందర్భోచిత ప్రయోగం.
- source_word: δὲ
  choice: కాని
  rationale: ముందటి వాక్యంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని, వాదనలోని మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: πολλὰ ... μέλη
  choice: అవయవాలు అనేకం
  rationale: శరీర రూపకంలో μέλη అంటే శరీరాన్ని నిర్మించే అవయవాలు; తెలుగు పాఠకులకు ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: μὲν ... δὲ
  choice: అనేకం ... మాత్రం ఒక్కటే
  rationale: అనేక అవయవాలు—ఒకే శరీరం అనే సమతుల్య వ్యత్యాసాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἓν
  choice: ఒక్కటే
  rationale: బహుత్వానికి ఎదురుగా శరీర ఏకత్వాన్ని నొక్కి చెబుతుంది.
- source_word: σῶμα
  choice: శరీరం
  rationale: పౌలు కొనసాగిస్తున్న శరీర రూపకాన్నీ, భిన్నత్వంలో ఏకత్వం అనే భావాన్నీ కాపాడుతుంది.
theological_decisions:
- issue: శరీర రూపకంలో μέλη పదం అనువాదం
  choice: అవయవాలు
  alternative: భాగాలు; సభ్యులు
  rationale: ఇక్కడ శరీర రూపకం ప్రత్యక్షంగా ఉన్నందున ‘అవయవాలు’ అనేది శరీర సంబంధ అర్థాన్ని స్పష్టంగా కాపాడుతుంది. ‘సభ్యులు’ సంఘ సంబంధ భావాన్ని ముందుగానే చొప్పించే అవకాశం ఉంది; ‘భాగాలు’ సాధ్యమైనా రూపకానికి కొంత తక్కువ నిర్దిష్టం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్తతను, అనేకత్వం–ఏకత్వం మధ్య వ్యత్యాసాన్ని నిలుపుకుంది.
