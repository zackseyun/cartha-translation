  edition: SBLGNT
  text: ἵνα μὴ ᾖ ⸀σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσι τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/025.yaml
  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: te
  text: శరీరంలో విభజన[a] ఉండకూడదనీ, అవయవాలు ఒకదానికొకటి ఒకే శ్రద్ధ[b] చూపాలనీ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చీలిక.’ గ్రీకు పదం చీలికను లేదా విభజనను సూచించగలదు; ఇక్కడ అది శరీరంలో ఏర్పడే విభజనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఒకదానికొకటి సమానంగా శ్రద్ధ చూపాలని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ ᾖ
  choice: ఉండకుండా
  rationale: సందర్భంలోని ఉద్దేశం/ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ముందరి వాక్యంలోని దేవుని ఏర్పాటుతో ఈ ఉపవాక్యం అనుసంధానమవుతుంది.
- source_word: σχίσμα
  choice: విభేదం
  rationale: చీలిక లేదా విభజన అనే భావాన్ని తెలియజేస్తూ, తరువాతి కాలపు సాంకేతిక మతపరమైన అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: σῶμα
  choice: శరీరం
  rationale: పౌలు ఉపయోగించిన శరీర రూపకాన్ని నేరుగా కాపాడుతుంది.
- source_word: τὸ αὐτό
  choice: సమాన శ్రద్ధ
  rationale: అవయవాలు పరస్పరం చూపే శ్రద్ధలో సమానత్వం లేదా ఒకే విధమైన శ్రద్ధ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑπὲρ ἀλλήλων
  choice: ఒకదానిపట్ల ఒకటి
  rationale: శరీర అవయవాలు పరస్పరం ఒకదానికొకటి శ్రద్ధ చూపుతాయనే అన్యోన్య భావాన్ని తెలుగులో సహజంగా ఇస్తుంది.
- source_word: μεριμνῶσι
  choice: శ్రద్ధ చూపేలా
  rationale: ఇక్కడ ఆందోళన కాకుండా సానుకూలమైన పరస్పర సంరక్షణ, పట్టింపు అనే భావం ఉంది.
- source_word: μέλη
  choice: అవయవాలు
  rationale: శరీర రూపకంలో గ్రీకు పదానికి సహజమైన, స్పష్టమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: శరీర రూపకంలో σχίσμα పదం
  choice: విభేదం
  alternative: చీలిక
  rationale: సంఘంలోని ఐక్యతకు భంగం కలగడాన్ని సూచిస్తుంది; అయితే తరువాత ఏర్పడిన సాంకేతిక సంఘవిభజన భావాన్ని పాఠ్యంలోకి చేర్చదు.
- issue: మూలంలో స్పష్టంగా లేని కర్తను సందర్భం నుంచి పూరించడం
  choice: దేవుడు దానిని అమర్చాడు
  alternative: కర్తను పేర్కొనకుండా ఉపవాక్యంగా ఉంచడం
  rationale: గ్రీకు వచనం 12:24 చివర ప్రారంభమైన దేవుని చర్యకు ఉద్దేశాన్ని తెలిపే ఆధీన ఉపవాక్యం. తెలుగు వచనాన్ని స్వతంత్రంగా చదవగలిగేలా ముందరి సందర్భాన్ని సంక్షిప్తంగా పూరించింది; కొత్త దైవశాస్త్ర భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంది. శరీరం–అవయవాలు అనే రూపకం యథాతథంగా నిలుపబడింది. మూల వచనం ముందరి వాక్యంపై ఆధారపడినందున, స్వతంత్ర వచనంగా పఠనయోగ్యత కోసం సందర్భంలోని కర్త మరియు క్రియను సంక్షిప్తంగా పూరించాం.
