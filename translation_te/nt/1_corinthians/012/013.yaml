id: 1CO.12.13
reference: 1 Corinthians 12:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: te
  text: ఎందుకంటే, ఒకే ఆత్మలో[a] మనమందరం ఒకే శరీరంలోకి బాప్తిస్మం పొందాం—యూదులమైనా గ్రీకులమైనా, బానిసలమైనా స్వతంత్రులమైనా—మనమందరికీ ఒకే ఆత్మను త్రాగడానికి ఇవ్వబడింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకే ఆత్మ ద్వారా.” గ్రీకు ἐν అనే విభక్తిపూర్వక పదం పరిధిని (“లో”) గానీ, సాధనం లేదా కర్తృత్వాన్ని (“ద్వారా”) గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మనమందరం ఒకే ఆత్మను త్రాగించబడ్డాం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు వివరణ ఇచ్చే γὰρ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; καί ఇచ్చే ఉద్ఘాటనను వాక్య సమగ్ర భావంలో మిళితం చేస్తుంది.
- source_word: ἐν ἑνὶ πνεύματι
  choice: ఒకే ఆత్మలో
  rationale: ἐν పదంలోని పరిధి/స్థితి భావాన్ని నేరుగా నిలుపుతూ, సాధనం లేదా కర్తృత్వం అనే భావాన్ని తేల్చివేయకుండా ఉంచుతుంది.
- source_word: ἡμεῖς πάντες
  choice: మనమందరం
  rationale: స్పష్టంగా ఉన్న సర్వసమావేషక ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς ἓν σῶμα ἐβαπτίσθημεν
  choice: ఒకే శరీరంలోకి బాప్తిస్మం పొందాం
  rationale: εἰς సూచించే చేర్చబడే దిశ/ఫలితాన్ని, అలాగే పౌలు ఉపయోగించిన ఒకే శరీరం అనే రూపకాన్ని కాపాడుతుంది. బాప్తిస్మం పొందాం అనేది సంఘసంబంధ సందర్భంలో ప్రామాణిక పదప్రయోగం.
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: యూదులమైనా గ్రీకులమైనా
  rationale: ఇక్కడి జాతి-మత విభేద జంటను నిర్దిష్టంగా నిలుపుతుంది; Ἕλληνες ను విస్తరించి అన్యజనులు అని మార్చదు.
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: బానిసలమైనా స్వతంత్రులమైనా
  rationale: చట్టపరమైన/సామాజిక బంధిత స్థితి మరియు స్వేచ్ఛా స్థితి మధ్య ఉన్న స్పష్టమైన వ్యత్యాసాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: πάντες ἓν πνεῦμα ἐποτίσθημεν
  choice: మనమందరం ఒకే ఆత్మను పానం చేయడానికి ఇవ్వబడ్డాం
  rationale: ποτίζω కర్మణి రూపంలోని ‘త్రాగడానికి ఇవ్వడం’ అనే భావాన్ని, పంచుకున్న ఆత్మీయ భాగస్వామ్య రూపకాన్ని సాధ్యమైనంత సమీపంగా కాపాడుతుంది.
theological_decisions:
- issue: ἐν ἑνὶ πνεύματι లో ἐν ను పరిధిగా అర్థం చేసుకోవాలా, సాధనం/కర్తృత్వంగా అర్థం చేసుకోవాలా
  choice: ఒకే ఆత్మలో
  alternative: ఒకే ఆత్మ ద్వారా
  rationale: గ్రీకు నిర్మాణం రెండు భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠం రూపానికి సమీపమైన ‘ఆత్మలో’ అని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇవ్వడం ద్వారా నిజమైన వేదాంత అనిశ్చితిని పరిష్కరించకుండా కాపాడాం.
- issue: రెండవ ἓν πνεῦμα పరిశుద్ధాత్మను సూచిస్తుందా లేక పంచుకున్న ఆత్మీయ వాస్తవాన్ని సూచిస్తుందా
  choice: ఒకే ఆత్మ
  alternative: ఒకే ఆత్మీయ పానీయం/ఒకే ఆత్మ
  rationale: తక్షణ సందర్భంలో పరిశుద్ధాత్మ యొక్క ఏకీకరణ కార్యమే బలమైన సూచన. తెలుగులో అక్షరాల పెద్ద/చిన్న భేదం లేకపోవడం వల్ల ఆంగ్లంలోని capitalization సమస్య సహజంగానే కనిపించదు; ప్రధాన పదాన్ని అదనపు వివరణ లేకుండా ఉంచాం.
- issue: δοῦλοι అనే సామాజిక స్థితి పదం
  choice: బానిసలు
  alternative: సేవకులు
  rationale: ‘స్వతంత్రులు’తో ఉన్న ప్రత్యక్ష వ్యత్యాసం బంధిత సామాజిక/చట్టపరమైన స్థితినే సూచిస్తుంది; ‘సేవకులు’ ఆ తీవ్రతను తగ్గిస్తుంది.
- issue: ἐποτίσθημεν యొక్క కర్మణి రూపం మరియు వాక్య నిర్మాణం
  choice: ఒకే ఆత్మను పానం చేయడానికి ఇవ్వబడ్డాం
  alternative: ఒకే ఆత్మ మనకు పానంగా ఇవ్వబడింది
  rationale: మొదటి రూపం గ్రీకు కర్మణి క్రియకు దగ్గరగా ఉండి పాన రూపకాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ తెలుగు నిర్మాణం మరింత సహజమైనదైనా వ్యాకరణ దృష్టిని కొద్దిగా మార్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘బాప్తిస్మం’, ‘ఆత్మ’, ‘శరీరం’ వంటి పౌలు సంబంధిత ప్రధాన రూపక పదాలను నిలిపాం. ‘పానం’ కొద్దిగా ఉన్నత శైలిలో ఉన్నప్పటికీ, ఇక్కడి రూపక గంభీరతను మరియు ‘త్రాగడం’ అనే మూలభావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
