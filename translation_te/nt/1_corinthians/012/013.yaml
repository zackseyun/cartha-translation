review_pass:
  verdict: revise
  source_fidelity: The verse accurately retains the explanatory force of καὶ γάρ, the deliberately noncommittal ‘in one Spirit’ sense of ἐν ἑνὶ πνεύματι, incorporation into one body, both social pairings, and the passive drinking metaphor. However, the final Telugu clause in the draft (‘పానం చేయడానికి ఇవ్వబడ్డాం’) is not idiomatic Telugu and obscures the passive sense of ἐποτίσθημεν.
  naturalness: The wording is generally modern and clear. Recasting the final clause as ‘మనమందరికీ ఒకే ఆత్మను త్రాగడానికి ఇవ్వబడింది’ is substantially more natural while retaining the shared passive-bestowal/drinking sense. ‘త్రాగడం’ is more current and transparent than the elevated nominal expression ‘పానం చేయడం.’
  terminology: ‘ఆత్మ,’ ‘బాప్తిస్మం,’ ‘శరీరం,’ ‘యూదులు,’ ‘గ్రీకులు,’ ‘బానిసలు,’ and ‘స్వతంత్రులు’ are appropriate modern-standard Telugu equivalents. ‘బానిసలు ... స్వతంత్రులు’ correctly preserves the κοινωνικο-legal contrast of δοῦλοι ... ἐλεύθεροι.
  issues:
  - severity: medium
    issue: The final clause ‘మనమందరం ఒకే ఆత్మను పానం చేయడానికి ఇవ్వబడ్డాం’ is grammatically awkward and unnatural in modern Telugu.
    rationale: It appears to calque English ‘were given to drink’ rather than expressing Telugu’s natural impersonal/passive construction. This may distract readers and makes the passive force of ἐποτίσθημεν less clear.
  revised_text: ఎందుకంటే, ఒకే ఆత్మలో[a] మనమందరం ఒకే శరీరంలోకి బాప్తిస్మం పొందాం—యూదులమైనా గ్రీకులమైనా, బానిసలమైనా స్వతంత్రులమైనా—మనమందరికీ ఒకే ఆత్మను త్రాగడానికి ఇవ్వబడింది.[b]
