revisions:
- from: ఎందుకంటే, ఒకే ఆత్మలో[a] మనమందరం ఒకే శరీరంలోకి బాప్తిస్మం పొందాం—యూదులమైనా గ్రీకులమైనా, బానిసలమైనా స్వతంత్రులమైనా—మనమందరం ఒకే ఆత్మను పానం చేయడానికి ఇవ్వబడ్డాం.[b]
  to: ఎందుకంటే, ఒకే ఆత్మలో[a] మనమందరం ఒకే శరీరంలోకి బాప్తిస్మం పొందాం—యూదులమైనా గ్రీకులమైనా, బానిసలమైనా స్వతంత్రులమైనా—మనమందరికీ ఒకే ఆత్మను త్రాగడానికి ఇవ్వబడింది.[b]
  rationale: The revision changes only the final clause and its corresponding footnote. The new wording is idiomatic Telugu and preserves the sense that all received one Spirit to drink. The footnote supplies a closer, though less idiomatic, rendering that foregrounds the Greek passive verb’s causative sense. The ambiguity concerning ‘in/by one Spirit’ remains explicitly preserved.
