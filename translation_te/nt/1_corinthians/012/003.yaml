id: 1CO.12.3
reference: 1 Corinthians 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: te
  text: అందుచేత, దేవుని ఆత్మ ద్వారా మాట్లాడే ఎవరూ, “యేసు శాపగ్రస్తుడు”[a] అని చెప్పరనీ, పరిశుద్ధాత్మ ద్వారా తప్ప ఎవరూ, “యేసు ప్రభువు”[b] అని చెప్పలేరనీ మీకు తెలియజేస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు శపింపబడుగాక.” గ్రీకు పదబంధం క్రియలేని ఉద్గారం; అది స్థితిని తెలిపేదిగానూ శాపోక్తిగానూ అర్థమవవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో పదక్రమం అక్షరార్థంగా, “ప్రభువు యేసు”; ఈ సందర్భంలో అది “యేసు ప్రభువు” అనే ఒప్పుకోలు భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: అందుచేత
  rationale: ముందున్న చర్చనుంచి వచ్చే నిర్ధారణను సహజంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: γνωρίζω ὑμῖν
  choice: మీకు తెలియజేస్తున్నాను
  rationale: ‘తెలియజేయడం’ అనే క్రియ యొక్క కారక భావాన్ని కాపాడుతుంది; మూలంలో లేని ‘మీరు తెలుసుకోవాలని కోరుతున్నాను’ అనే సంకల్ప భావాన్ని చేర్చదు.
- source_word: ἐν πνεύματι θεοῦ
  choice: దేవుని ఆత్మ ద్వారా
  rationale: ఇక్కడ ἐν అనేది సాధనం లేదా కార్యశక్తిని సూచించవచ్చు; తెలుగు వాక్యంలో ఆత్మ కార్యాన్ని స్పష్టంగా తెలియజేయడానికి ‘ద్వారా’ సహజంగా ఉంది.
- source_word: λαλῶν
  choice: మాట్లాడే
  rationale: ప్రేరిత పలుకులో నిమగ్నమైన వ్యక్తిని సూచించే వర్తమాన కృదంత భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: యేసు శాపగ్రస్తుడు
  rationale: క్రియలేని గ్రీకు ఉద్గారంలో అంతర్లీనంగా ఉన్న ‘ఉన్నాడు’ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; స్పష్టమైన ఆజ్ఞార్థక భావాన్ని అనవసరంగా చేర్చదు.
- source_word: δύναται εἰπεῖν
  choice: చెప్పలేరు
  rationale: οὐδεὶς‌తో కలిసి సామర్థ్యం లేదా సాధ్యతను నిరాకరించే భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: Κύριος Ἰησοῦς
  choice: యేసే ప్రభువు
  rationale: ఇది సంబోధన లేదా కేవలం బిరుదు కాక, ఒప్పుకోలు అనే సందర్భార్థాన్ని తెలియజేస్తుంది; ‘ఏ’ నొక్కు యేసే ప్రభువు అనే విధేయ భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ముందున్న సార్వత్రిక నిరాకరణకు ఏకైక మినహాయింపును సహజంగా సూచిస్తుంది.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: పరిశుద్ధాత్మ ద్వారా
  rationale: మొదటి సమాంతర పదబంధంలాగే పరిశుద్ధాత్మ కార్యం లేదా సాధనాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: Κύριος Ἰησοῦς అనే ఒప్పుకోలు పదబంధంలో κύριος అనువాదం
  choice: యేసే ప్రభువు
  alternative: యేసు యజమాని; ప్రభువైన యేసు
  rationale: ‘ప్రభువు’ సాధారణ అర్థాన్నీ పౌలు సందర్భంలోని ఉన్నత క్రీస్తు సంబంధిత ప్రాధాన్యాన్నీ కాపాడుతుంది. వాక్యాన్ని ఒప్పుకోలుగా చూపుతుంది గాని దాని తాత్త్విక పరిధిని అనువాదంలో మరింత విస్తరించదు.
- issue: ‘పరిశుద్ధాత్మ ద్వారా తప్ప’ అనే ఆత్మీయ సామర్థ్య వాక్యపు పరిధి
  choice: మూల వాక్యం చెప్పిన సంబంధాన్ని యథాతథంగా ఉంచడం
  alternative: కేవలం నిజాయితీగల ఒప్పుకోలుగా పరిమితం చేయడం; పునర్జన్మ సిద్ధాంతానికి సమగ్ర ప్రకటనగా విస్తరించడం
  rationale: యేసు ప్రభుత్వాన్ని ఒప్పుకోవడాన్ని పరిశుద్ధాత్మ కార్యంతో వచనం అనుసంధానిస్తుంది. అది కేవలం నోటి పలుకేనా లేదా మరింత విస్తృతమైన రక్షణ అనుభవమా అనే విషయాన్ని అనువాదం స్వయంగా తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. సమాంతర గ్రీకు నిర్మాణాలను వీలైనంతవరకు నిలిపి, తెలుగులో సహజమైన వాక్యక్రమాన్ని ఉపయోగించాం. ‘ఆత్మలో’ అనే అక్షరానువాదానికి బదులు సందర్భానుసారంగా ‘ఆత్మ ద్వారా’ వాడినా, ఆత్మ కార్యాన్ని ఏ నిర్దిష్ట సిద్ధాంత వ్యవస్థకు పరిమితం చేయలేదు.
