id: 1CO.12.2
reference: 1 Corinthians 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἴδατε ὅτι ὅτε ἔθνη ἦτε πρὸς τὰ εἴδωλα τὰ ἄφωνα ὡς ἂν ἤγεσθε ἀπαγόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: te
  text: మీరు అన్యజనులుగా ఉన్నప్పుడు, ఎలాగైతే నడిపించబడేవారో అలా మాటలేని విగ్రహాలవైపు తీసుకుపోబడుతూ ఉండేవారని మీకు తెలుసు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἴδατε
  choice: మీకు తెలుసు
  rationale: పౌలు పాఠకులకు తెలిసిన వారి గత అనుభవాన్ని నేరుగా గుర్తుచేస్తున్నాడు; ఆధునిక తెలుగులో ఇది సహజమైన, సరళమైన ప్రయోగం.
- source_word: ἔθνη
  choice: అన్యజనులుగా
  rationale: ఇక్కడ యూదేతరులైన వారి పూర్వ మతపరమైన స్థితిని సూచిస్తుంది. ‘అన్యజనులు’ పౌలు వాడుకలోని జాతి-మత భావాన్ని కాపాడుతుంది; ‘విగ్రహారాధకులు’ అని అనువదిస్తే మూలపదంలో లేని వివరణను చేర్చినట్లవుతుంది.
- source_word: πρὸς τὰ εἴδωλα
  choice: విగ్రహాలవైపు
  rationale: πρός దిశను సూచిస్తుంది; ‘వైపు’ విగ్రహాల దిశగా నడిపించబడిన భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τὰ ἄφωνα
  choice: మాటలేని
  rationale: విగ్రహాలు మాట్లాడలేవనే భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, పరిసర వాక్యాల్లోని ఆత్మప్రేరిత మాటలతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ὡς ἂν ἤγεσθε
  choice: ఎలా నడిపించబడితే అలా
  rationale: ὡς ἂν యొక్క అనిర్దిష్ట విధాన భావాన్ని, ἤγεσθε యొక్క అసంపూర్ణ భూతకాల నిష్క్రియ భావాన్ని కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπαγόμενοι
  choice: కొట్టుకుపోయేవారని
  rationale: నిష్క్రియగా దారి మళ్లించబడి తీసుకుపోబడుతున్న బలమైన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ἤγεσθε–ἀπαγόμενοι పదపునరుక్తిని కృత్రిమంగా అనిపించకుండా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ἔθνη ద్వారా కొరింథీయుల పూర్వ స్థితి
  choice: ‘అన్యజనులుగా’ అని ఉంచడం
  alternative: ‘విగ్రహారాధకులుగా’ లేదా ‘జనాంగాలుగా’
  rationale: ‘అన్యజనులు’ వారి యూదేతర జాతి-మత నేపథ్యాన్ని కాపాడుతుంది. ‘విగ్రహారాధకులు’ సందర్భార్థాన్ని నేరుగా పదంలోకి చేర్చుతుంది; ‘జనాంగాలు’ ఇక్కడ అసహజంగా, అస్పష్టంగా ఉంటుంది.
- issue: మాటలేని విగ్రహాలకు నడిపించబడిన నిష్క్రియ స్థితి
  choice: ‘ఎలా నడిపించబడితే అలా ... కొట్టుకుపోయేవారు’ అనే భావాన్ని కాపాడడం
  alternative: ‘విగ్రహాలను ఆరాధించేవారు’
  rationale: మూలంలోని రెండు నిష్క్రియ క్రియారూపాలు వారి పూర్వ ప్రభావాధీనతను బలంగా చూపుతాయి. కేవలం ‘ఆరాధించేవారు’ అనడం ఆ అలంకారిక ఒత్తిడిని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని నిష్క్రియ కదలికను సహజంగా చూపేందుకు ‘నడిపించబడితే అలా ... కొట్టుకుపోయేవారు’ వాడబడింది. పాదసూచిక గుర్తు ప్రధాన వాక్యంలో [a]గా చేర్చబడింది.
