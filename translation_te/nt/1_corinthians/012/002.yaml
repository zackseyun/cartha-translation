    rationale: ప్రధాన వాక్యంలో నిష్క్రియ పునరుక్తి ఇప్పటికే తగినంతగా ప్రతిఫలించింది; అవసరం లేని పాదసూచికను తొలగించడం పాఠ్యాన్ని శుభ్రంగా ఉంచుతుంది.
  revised_text: మీరు అన్యజనులుగా ఉన్నప్పుడు, ఎలాగైతే నడిపించబడేవారో అలా మాటలేని విగ్రహాలవైపు తీసుకుపోబడుతూ ఉండేవారని మీకు తెలుసు.
