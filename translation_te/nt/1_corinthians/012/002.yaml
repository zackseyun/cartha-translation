- from: మీరు అన్యజనులుగా ఉన్నప్పుడు, ఎలా నడిపించబడితే అలా మాటలేని విగ్రహాలవైపు కొట్టుకుపోయేవారని మీకు తెలుసు.[a]
  to: మీరు అన్యజనులుగా ఉన్నప్పుడు, ఎలాగైతే నడిపించబడేవారో అలా మాటలేని విగ్రహాలవైపు తీసుకుపోబడుతూ ఉండేవారని మీకు తెలుసు.
  rationale: సవరణ ἤγεσθε యొక్క అసంపూర్ణ భూతకాల నిష్క్రియ భావాన్ని ‘నడిపించబడేవారో’తో, ἀπαγόμενοι యొక్క కొనసాగుతున్న నిష్క్రియ తీసుకుపోవడాన్ని ‘తీసుకుపోబడుతూ ఉండేవారు’తో వ్యక్తం చేస్తుంది. ὡς ἄν యొక్క విధాన-అనిర్దిష్టతను ‘ఎలాగైతే ... అలా’ కాపాడుతుంది; అదనపు అలంకారిక ‘కొట్టుకుపోవడం’ భావాన్ని చేర్చదు. పాదసూచికలో అవసరమైన పాఠ్య-వైవిధ్యం లేదా ప్రత్యామ్నాయ పఠనం లేదు కాబట్టి అది తొలగించబడింది.
