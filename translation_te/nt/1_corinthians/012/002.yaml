    rationale: ὡς ἄν ఇక్కడ ‘ఎలాగైతే/ఏ విధంగా నడిపించబడేవారో అలా’ అనే అనిర్దిష్ట విధానాన్ని సూచిస్తుంది; సాపేక్ష రూపం దీనికి తెలుగులో మరింత సమీపంగా ఉంటుంది.
