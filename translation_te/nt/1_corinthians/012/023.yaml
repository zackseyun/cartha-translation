source:
  edition: SBLGNT
  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: te
  text: మరియు శరీరంలోని ఏ భాగాలను మనం తక్కువ గౌరవనీయమైనవిగా భావిస్తామో, వాటికి మరింత గౌరవం అందిస్తాం; బహిరంగంగా చూపడానికి తగనివైన మన భాగాలకు మరింత మర్యాదకరత ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మన అనుచితమైన భాగాలకు మరింత తగిన రూపం ఉంటుంది.’ మూలభాషలోని పదాలు బహిరంగ ప్రదర్శనకు తగని వాటికి కలిగే ఎక్కువ మర్యాదకరతను లేదా తగిన రూపాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: ఏ భాగాలను మనం ... భావిస్తామో
  rationale: δοκέω ఇక్కడ వాస్తవ స్థితిని కాక మనుషుల అంచనాను సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో సహజంగా ఉండేలా సంబంధార్థక రూపం వాడబడింది.
- source_word: ἀτιμότερα
  choice: తక్కువ గౌరవం కలవిగా
  rationale: తులనాత్మక భావాన్ని నిలుపుతూ, తరువాతి τιμή (‘గౌరవం’)తో ఉన్న గౌరవం–అగౌరవం వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τοῦ σώματος
  choice: శరీరంలోని ... భాగాలు
  rationale: మొత్తంలో భాగాలు అనే సంబంధాన్ని సహజ తెలుగులో వ్యక్తపరుస్తూ, పౌలు ఉపయోగించిన శరీర రూపకాన్ని నిలుపుతుంది.
- source_word: τιμὴν περισσοτέραν περιτίθεμεν
  choice: వాటికి మరింత గౌరవం ఇస్తాం
  rationale: περιτίθημι యొక్క అక్షరార్థం ‘చుట్టూ/మీద ఉంచడం’; ఇక్కడ వస్త్రధారణ లేదా అలంకరణ ద్వారా గౌరవం ఇవ్వడం అనే సందర్భోచిత భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: చూడటానికి తగనివిగా భావించే మన భాగాలు
  rationale: ἀσχήμων బహిరంగంగా ప్రదర్శించడానికి అనుచితమైన లేదా మర్యాదకరంగా కనిపించని వాటిని సూచించగలదు; నైతిక అశ్లీలతను అతిగా రుద్దకుండా శరీర సంబంధ భావాన్ని కాపాడుతుంది.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: మరింత మర్యాదకరమైన రూపం కలుగుతుంది
  rationale: εὐσχημοσύνη బాహ్యమైన మర్యాదయుక్త రూపం, తగిన ప్రదర్శన, శోభ అనే భావ పరిధిని కలిగి ఉంది. తెలుగు ప్రయోగంలో కప్పడం వల్ల కలిగే ఫలితాన్ని సహజంగా తెలియజేయడానికి ‘కలుగుతుంది’ వాడబడింది; మూలంలోని ἔχει అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: శరీర రూపకం మరియు సామాజిక గౌరవం
  choice: శరీర భాగాల గురించిన స్పష్టమైన భాషను అలాగే ఉంచడం
  alternative: దీన్ని నేరుగా సంఘంలోని బలహీన సభ్యుల గురించిన అమూర్త వ్యాఖ్యగా మార్చడం
  rationale: పౌలు వాదన నిజమైన శరీర భాగాలకు మనం చూపే శ్రద్ధను క్రీస్తు శరీరమైన సంఘంతో పోల్చడంపై ఆధారపడింది. అన్వయాన్ని అనువాదంలో ముందుగానే చేర్చకుండా రూపకమే దానిని వెల్లడించేలా ఉంచబడింది.
- issue: ἀσχήμονα మరియు εὐσχημοσύνην మధ్య వ్యత్యాసం
  choice: ‘చూడటానికి తగనివి’ మరియు ‘మర్యాదకరమైన రూపం’
  alternative: ‘అశ్లీలమైనవి’ మరియు ‘ఎక్కువ మర్యాద’
  rationale: మూలపదాలు సామాజికంగా తగిన బాహ్య రూపం లేదా ప్రదర్శనను ప్రధానంగా సూచిస్తాయి; నైతిక అపవిత్రత లేదా లైంగిక అశ్లీలతను అనవసరంగా దిగుమతి చేయకుండా వ్యత్యాసాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘చూడటానికి తగనివి’ అనే పదబంధం శరీర భాగాల బహిరంగ ప్రదర్శనకు సంబంధించిన సామాజిక భావాన్ని సున్నితంగా తెలియజేస్తుంది; వాక్యంలోని గౌరవం మరియు మర్యాదకర రూపం మధ్య తేడా నిలుపబడింది.
