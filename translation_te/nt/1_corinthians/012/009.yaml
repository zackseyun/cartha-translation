id: 1CO.12.9
reference: 1 Corinthians 12:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἑτέρῳ πίστις ἐν τῷ αὐτῷ πνεύματι, ⸀ἄλλῳ χαρίσματα ἰαμάτων ἐν τῷ ⸀ἑνὶ πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: te
  text: మరొకరికి అదే ఆత్మ ద్వారా విశ్వాసం ఇవ్వబడుతుంది[a]; ఇంకొకరికి ఒకే ఆత్మ ద్వారా స్వస్థతల వరాలు ఇవ్వబడతాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విశ్వాసం” అనే పదానికి “నమ్మకం” లేదా “విశ్వసనీయత” అనే అర్థాలు కూడా సాధ్యమే (πίστις).
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “వరాలు,” “స్వస్థతలు” అనే రెండు నామవాచకాలూ బహువచనంలో ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: మరొకరికి
  rationale: మునుపటి వచనంలో మొదలైన పంపిణీ నిర్మాణాన్ని సహజమైన తెలుగులో కొనసాగిస్తుంది; ἑτέρῳ మరియు ἄλλῳ మధ్య సందర్భం నిర్ధారించని కఠిన వ్యత్యాసాన్ని మోపదు.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: పౌలు వాడుకకు, ఈ వరాల సందర్భానికి సరిపోయే సాధారణ తెలుగు పదం; ‘నమ్మకం,’ ‘విశ్వసనీయత’ అనే సాధ్యమైన భావాలను పాదసూచికలో ఉంచాం.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: అదే ఆత్మ ద్వారా
  rationale: ἐν + దత్తివును ఇక్కడ సాధనార్థకంగా గ్రహించి, వరం ప్రసాదించడంలో ఆత్మ యొక్క కార్యసాధక పాత్రను సహజంగా తెలియజేస్తుంది; αὐτῷను ‘అదే’గా నిలుపుతుంది.
- source_word: ἄλλῳ
  choice: ఇంకొకరికి
  rationale: వరాలు వేర్వేరు వ్యక్తులకు పంచబడుతున్న పంపిణీ భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: χαρίσματα
  choice: వరాలు
  rationale: కృపచేత అనుగ్రహించబడిన బహువచన బహుమతులను సూచించే, సందర్భానికి తగిన స్థిరమైన తెలుగు పదం.
- source_word: ἰαμάτων
  choice: స్వస్థతల
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ వివిధ స్వస్థపరిచే కార్యాలు లేదా సందర్భాల సాధ్యతను ముందుగానే కుదించదు.
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: ఆ ఒక్క ఆత్మ ద్వారా
  rationale: ἑνίలోని ‘ఒక్క’ అనే ఐక్యత ప్రాధాన్యాన్ని నిలుపుతుంది; ముందు ఉన్న ‘అదే’ అనే పదంతో గ్రీకు వైవిధ్యాన్ని సమతలీకరించదు.
theological_decisions:
- issue: వరాల సందర్భంలో πίστις యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకం లేదా విశ్వసనీయత
  rationale: మూలపదం ఈ భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠంలో విస్తృతంగా అర్థమయ్యే ‘విశ్వాసం’ ఉంచి, ఇది రక్షణ విశ్వాసమేనని గానీ ఏదైనా ప్రత్యేక సంఘ సిద్ధాంతంలోని అద్భుత విశ్వాసమని గానీ అదనంగా నిర్ధారించలేదు.
- issue: πνεύματι యొక్క సూచ్యం
  choice: ఆత్మ—పరిశుద్ధాత్మను సూచిస్తూ
  alternative: ఆత్మ/ప్రాణశక్తి అనే సాధారణ భావం
  rationale: 1 కొరింథీయులు 12లోని సమీప సందర్భం వరాలను పంచే పరిశుద్ధాత్మను స్పష్టంగా సూచిస్తుంది; అందువల్ల గౌరవార్థక వాడుకలో ‘ఆత్మ’గా ఇచ్చాం.
- issue: చివరి క్రియ యొక్క పూరణ
  choice: ‘ఇవ్వబడుతున్నాయి’ అని అంతర్భావ క్రియను వ్యక్తం చేయడం
  alternative: గ్రీకు మాదిరిగా క్రియ లేకుండా ఖండవాక్యంగా ఉంచడం
  rationale: ఈ వచనం ముందటి వాక్య నిర్మాణాన్ని కొనసాగిస్తుంది. స్వతంత్రంగా చదివినప్పుడు సహజమైన తెలుగుకోసం అంతర్భావ పంపిణీ క్రియను చేర్చాం; ఇది వరాల మూలం లేదా స్వభావంపై అదనపు సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘స్వస్థతల వరాలు’ కొద్దిగా అసాధారణంగా వినిపించినా మూలంలోని ద్విబహువచనాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
