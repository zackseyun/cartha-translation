id: 1CO.10.29
reference: 1 Corinthians 10:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: te
  text: నేను చెప్పేది నీ సొంత మనస్సాక్షిని గురించి కాదు, అవతలి వ్యక్తి మనస్సాక్షిని గురించి[a]. ఎందుకంటే, వేరొకరి మనస్సాక్షి నా స్వేచ్ఛను ఎందుకు తీర్పు తీరుస్తుంది?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “అతని సొంతదాన్ని కాదు, అవతలి వ్యక్తిదాన్ని.” సందర్భం “నీ సొంత మనస్సాక్షిని కాదు, అవతలి వ్యక్తి మనస్సాక్షిని” అనే భావానికి మద్దతిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: ఈ అలంకారిక ప్రశ్నను పౌలు స్వయంగా వేసిన ప్రశ్నగా గానీ, గ్రీకులో స్పష్టమైన ఉల్లేఖన సూచికలు లేకుండా అతడు ప్రస్తావిస్తున్న ఒక అభ్యంతరంగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: మనస్సాక్షి
  rationale: నైతికంగా చర్యలను అంచనా వేసే అంతరంగ అవగాహనను సూచించే పౌలు వాడుకకు ‘మనస్సాక్షి’ సహజమైన, స్థిరమైన తెలుగు సమానం.
- source_word: δὲ λέγω
  choice: నేను చెప్పేది
  rationale: ఇది కొత్త అంశాన్ని మొదలుపెట్టకుండా ముందరి మాటలో ఉద్దేశించిన మనస్సాక్షి ఎవరిదో వివరిస్తోంది; అందువల్ల స్పష్టీకరణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: నీ సొంత మనస్సాక్షిని గురించి కాదు, అవతలి వ్యక్తి మనస్సాక్షిని గురించి
  rationale: గ్రీకు రూపం అక్షరార్థంగా మూడవ పురుష ఏకవచనాన్ని కలిగివున్నా, సంభాషణ సందర్భంలో పాఠకుని మనస్సాక్షికి అవతలి వ్యక్తి మనస్సాక్షిని వ్యతిరేకంగా చూపుతోంది. తెలుగు వాక్యనిర్మాణంలో రెండింటినీ స్పష్టంగా చెప్పడం సహజం.
- source_word: ἱνατί γὰρ
  choice: ఎందుకంటే ... ఎందుకు
  rationale: γάρ తెలిపే పూర్వవాక్య సంబంధాన్నీ, ἱνατί తెలిపే అలంకారిక ప్రశ్ననూ రెండింటినీ నిలుపుతుంది.
- source_word: ἐλευθερία
  choice: స్వేచ్ఛ
  rationale: అనుమతించబడిన చర్యల విషయంలో వ్యక్తికి ఉన్న స్వాతంత్ర్యాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: κρίνεται
  choice: తీర్పు తీర్చాలి
  rationale: κρίνω యొక్క విస్తృతమైన ‘తీర్పు చేయడం/అంచనా వేయడం’ భావాన్ని ఉంచి, ‘దోషిగా తీర్చడం’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: వేరొకరి మనస్సాక్షి
  rationale: తీర్పు చేసే సాధకాన్ని తెలుగులో సహజంగా వ్యక్తీకరిస్తుంది; గ్రీకులోని ‘మరొక మనస్సాక్షి’ భావాన్ని వ్యక్తిసంబంధంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: మొదటి వాక్యంలోని స్వత్వ సూచన ఎవరికో సంబంధించినది
  choice: పాఠకుని సొంత మనస్సాక్షి కాదు, అవతలి వ్యక్తి మనస్సాక్షి అని పౌలు స్పష్టం చేస్తున్నట్లు ప్రధాన పాఠంలో అనువదించబడింది.
  alternative: అక్షరార్థ రూపాన్ని అనుసరించి ‘అతని సొంతది కాదు, అవతలి వ్యక్తిదే’ అని అనువదించడం.
  rationale: ἑαυτοῦ రూపం మూడవ పురుష ఏకవచనమైనప్పటికీ, ముందరి సందర్భంలో పౌలు కొరింథీయులను ఉద్దేశించి అవతలి వ్యక్తి మనస్సాక్షి గురించి సూచిస్తున్నాడు. సందర్భానుసార అర్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, రూపపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: రెండవ వాక్యంలోని అలంకారిక ప్రశ్నకు వక్త ఎవరు
  choice: ప్రధాన పాఠంలో వక్తను అదనంగా గుర్తించకుండా ప్రశ్నను యథాతథంగా ఉంచాం.
  alternative: ఇది పౌలు స్వయంగా వేసిన సవాలు; లేదా కొరింథీయుల అభ్యంతరాన్ని పౌలు ఉటంకిస్తున్నాడు.
  rationale: గ్రీకు పాఠంలో వక్త మారినట్లు ఉల్లేఖన సూచికలు లేవు. కాబట్టి రెండు సాధ్యాలను అనువాదంలో పరిష్కరించకుండా, పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అవతలి వ్యక్తి’ సందర్భంలోని ఇతర వ్యక్తిని సహజంగా సూచిస్తుంది. మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ను చేర్చలేదు; ప్రధాన పాఠంలో రెండు పాదసూచిక గుర్తులూ [a], [b] ఉంచబడ్డాయి.
