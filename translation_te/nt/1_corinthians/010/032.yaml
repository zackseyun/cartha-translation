id: 1CO.10.32
reference: 1 Corinthians 10:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: te
  text: యూదులకైనా, గ్రీకులకైనా[b], దేవుని సంఘానికైనా అభ్యంతరం కలిగించకండి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఎవరికీ తొట్రుపాటు కలిగించనివారిగా ఉండండి,” లేదా “అభ్యంతరకరంగా ఉండకండి.”'
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “గ్రీకులు” అనే మాట పౌలు కాలపు సందర్భంలో సాధారణంగా యూదులు కానివారిని విస్తృతంగా సూచించి ఉండవచ్చు; అయితే గ్రీకు మూలపాఠంలో ప్రత్యేకంగా “గ్రీకులు” అనే ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: అభ్యంతరం కలిగించకండి
  rationale: ఈ సందర్భంలో ఇతరులు తొట్రుపడేలా చేయడం లేదా వారికి అభ్యంతరం కలిగించడం అనే సంబంధాత్మక భావం ప్రధానమైనది. తెలుగు ఆజ్ఞారూపంలో ఈ అనువాదం సహజంగా ఉండి, ‘నిర్దోషులు’ అనే అస్పష్టమైన భావానికి పరిమితం కాదు.
- source_word: γίνεσθε
  choice: కలిగించకండి అనే ఆజ్ఞారూపంలో వ్యక్తీకరించబడింది
  rationale: γίνεσθε వర్తమాన ఆజ్ఞారూపం నిరంతర ప్రవర్తనను సూచిస్తుంది. ἀπρόσκοποιతో కలిపి తెలుగులో సహజమైన నిషేధాత్మక ఆజ్ఞగా అనువదించబడింది.
- source_word: Ἰουδαίοις
  choice: యూదులకు
  rationale: ఇక్కడ యూదయ నివాసులను మాత్రమే కాక, యూదు మత-జాతి సమూహాన్ని సూచిస్తుంది.
- source_word: Ἕλλησιν
  choice: గ్రీకులకు
  rationale: మూలపాఠంలో నేరుగా ‘గ్రీకులు’ అని ఉంది. సందర్భంలో ఇది యూదులు కానివారిని విస్తృతంగా సూచించే అవకాశం ఉన్నా, ప్రధాన పాఠంలో మూలపదాన్ని నిలుపుకున్నాం.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: దేవుని సంఘానికి
  rationale: పౌలు వాడుకలో ἐκκλησία విశ్వాసుల సమాజాన్ని సూచిస్తుంది. ‘దేవుని సంఘం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, స్థిరమైన అనువాదం.
theological_decisions:
- issue: పౌలు పేర్కొన్న సమూహాల విభజన
  choice: యూదులు, గ్రీకులు, దేవుని సంఘం అనే మూడు సమూహాలను వచనంలో ప్రత్యేకంగా నిలుపుకోవడం
  alternative: ‘గ్రీకులు’ను ప్రధాన పాఠంలోనే ‘యూదులు కానివారు’ అని విస్తరించడం; లేదా ఈ మాటను ప్రధానంగా సువార్త వ్యూహంగా మాత్రమే వివరించడం
  rationale: మూలవచనం మూడు సమూహాలను స్పష్టంగా పేర్కొంటుంది. అనువాదం వాటిని విస్తరించకుండా లేదా కుదించకుండా నిలుపుతుంది; ‘గ్రీకులు’ అనే పదం సందర్భంలో కలిగే విస్తృత భావాన్ని పాదటీపులో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. ‘అభ్యంతరం కలిగించకండి’ సాధారణ పాఠకులకు సహజంగా ఉండి, సందర్భంలోని ఇతరులను తొట్రుపడేలా చేయకూడదనే భావాన్ని అందిస్తుంది. ప్రతి పాదటీపు సూచిక సంబంధిత పదబంధం వెంట ప్రధాన పాఠంలో ఉంచబడింది.
