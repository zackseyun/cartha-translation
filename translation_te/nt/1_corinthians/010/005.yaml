id: 1CO.10.5
reference: 1 Corinthians 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός, κατεστρώθησαν γὰρ ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: te
  text: అయినప్పటికీ, వారిలో ఎక్కువమందిపట్ల దేవుడు సంతోషించలేదు; ఎందుకంటే వారు అరణ్యంలో పడగొట్టబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేలకొరిగారు,’ ‘అరణ్యంలో పరచబడ్డారు.’
    reason: κατεστρώθησανకు ‘పడగొట్టబడ్డారు’తో పాటు నేలకొరగడం లేదా నేలపై పరచబడి ఉండడం అనే భావసూచనలు కూడా ఉన్నాయి.
lexical_decisions:
- source_word: ἀλλ’
  choice: అయినప్పటికీ
  rationale: ముందటి వచనాల్లో పేర్కొన్న ఇశ్రాయేలీయులందరి ఆధిక్యతలకు, ఇప్పుడు చెప్పే ప్రతికూల ఫలితానికి మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: వారిలో చాలామందిపట్ల ... సంతోషించలేదు
  rationale: గ్రీకు నుడికారంలోని పరిమాణ భావాన్ని ‘చాలామంది’ అని నిలుపుతూ, εὐδοκέωతో కూడిన ἐν సంబంధాన్ని తెలుగులో సహజంగా ‘పట్ల’తో వ్యక్తం చేస్తుంది.
- source_word: ηὐδόκησεν
  choice: సంతోషించలేదు
  rationale: εὐδοκέωలోని ‘ఇష్టపడడం, సంతోషించడం’ అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా, అదనపు సిద్ధాంతార్థం చేర్చకుండా అందిస్తుంది.
- source_word: ὁ θεός
  choice: దేవుడు
  rationale: గ్రీకు వాక్యంలోని కర్తకు నేరమైన, ప్రామాణిక తెలుగు సమానం.
- source_word: κατεστρώθησαν
  choice: పడగొట్టబడ్డారు
  rationale: అరణ్యంలో వారు తీర్పు ఫలితంగా కూలిపోయిన భావాన్ని, గ్రీకు క్రియలోని కర్మణి రూపాన్ని నిలుపుతూ తెలియజేస్తుంది. క్రియలోని ‘నేలపై పరచబడ్డారు/నేలకొరిగారు’ అనే చిత్రాన్ని పాదసూచికలో ఉంచింది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: దేవుడు వారిపట్ల సంతోషించకపోవడానికి తరువాతి మాట కారణాన్ని వివరిస్తోందని స్పష్టంగా చూపుతుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: నిర్గమ ప్రయాణ నేపథ్యంలోని ἔρημοςకు సహజమైన, లేఖన సంప్రదాయానికి అనుగుణమైన ఆధునిక తెలుగు పదం.
theological_decisions:
- issue: κατεστρώθησαν సూచించే తీర్పు స్వభావం
  choice: అరణ్య సంచారకాలంలో ఇశ్రాయేలీయులు పడగొట్టబడడం దేవుని తీర్పు ఫలితమని సందర్భానుసారంగా వ్యక్తం చేయడం
  alternative: తీర్పు భావాన్ని ముందుకు తేవకుండా, వారు అరణ్యంలో నేలకొరిగారు లేదా వారి శరీరాలు అక్కడ పరచబడ్డాయి అనే తటస్థ చిత్రంగా అనువదించడం
  rationale: పౌలు ఇశ్రాయేలు వైఫల్యాలను, వాటి ఫలితాలను కొరింథీయులకు హెచ్చరికగా ఉపయోగిస్తున్నాడు. ‘పడగొట్టబడ్డారు’ ఆ హెచ్చరిక బలాన్ని, గ్రీకు కర్మణి రూపాన్ని నిలుపుతుంది; అయితే క్రియలో లేని కర్తను వాక్యంలో స్పష్టంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరంగా ఉంది. ‘పడగొట్టబడ్డారు’ తీర్పు సందర్భాన్ని తెలియజేస్తూ కర్తను ఊహించి చేర్చదు. పాదసూచిక గుర్తు సంబంధిత క్రియ తర్వాతే ఉంచబడింది.
