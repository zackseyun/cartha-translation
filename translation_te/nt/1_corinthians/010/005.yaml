revisions:
- from: అయినప్పటికీ, వారిలో చాలామందిపట్ల దేవుడు సంతోషించలేదు; ఎందుకంటే వారు అరణ్యంలో పడగొట్టబడ్డారు.[a]
  to: అయినప్పటికీ, వారిలో ఎక్కువమందిపట్ల దేవుడు సంతోషించలేదు; ఎందుకంటే వారు అరణ్యంలో పడగొట్టబడ్డారు.[a]
  rationale: The sole textual revision strengthens “many” to “most,” preserving the quantitative meaning of τοῖς πλείοσιν. The footnote is lightly streamlined while retaining the lexical alternatives and its anchor remains immediately after the translated verb.
