id: 1CO.10.20
reference: 1 Corinthians 10:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: te
  text: కాదు; వారు బలి అర్పించేది దయ్యాలకే గాని దేవునికి కాదు. మీరు దయ్యాలతో భాగస్వాములుగా మారడం నేను కోరను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దయ్యాలతో పాలుపంచుకునేవారిగా” లేదా “దయ్యాలతో సహభాగులుగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: అలా కాదు
  rationale: మునుపటి వాక్యంపై కలగగల అపార్థాన్ని సరిదిద్దే వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἃ θύουσιν
  choice: వారు బలి అర్పించేవాటిని
  rationale: నపుంసకలింగ సంబంధ సర్వనామం సూచించే బలి వస్తువులను అతిగా నిర్దిష్టీకరించకుండా నిలుపుతుంది.
- source_word: δαιμονίοις καὶ οὐ θεῷ θύουσιν
  choice: దేవునికి కాదు, దయ్యాలకే అర్పిస్తున్నారు
  rationale: గ్రీకు వాక్యంలోని దేవుడు–దయ్యాలు వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది; ‘కే’ నిజమైన గమ్యం గురించిన దిద్దుబాటు బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὐ θέλω δὲ
  choice: నాకు ఇష్టం లేదు
  rationale: పౌలు కోరని విషయాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κοινωνοὺς τῶν δαιμονίων
  choice: దయ్యాలతో పాలుపంచుకునేవారిగా
  rationale: కేవలం సామాజిక సహవాసమని తగ్గించకుండా, అలాగే సంపూర్ణ విధేయత అని అతిశయింపకుండా, భాగస్వామ్యం/సహభాగిత అనే సంబంధాత్మక భావాన్ని నిలుపుతుంది.
- source_word: γίνεσθαι
  choice: మారడం
  rationale: ఇప్పటికే ఉన్న స్థితికన్నా ఒక స్థితిలోకి ప్రవేశించడాన్ని సూచించే γίνομαι భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: అన్యదేవతారాధనలో అర్పించే బలుల స్వభావం
  choice: ఆ బలులు దేవునికి కాక దయ్యాలకు అర్పించబడుతున్నాయని పౌలు చెబుతున్నాడు.
  alternative: ఇది కేవలం విగ్రహ విందుల సామాజిక అర్థాన్ని గురించి చెప్పిన అలంకారిక వ్యాఖ్య మాత్రమే.
  rationale: ‘దయ్యాలకు, దేవునికి కాదు’ అనే స్పష్టమైన వ్యత్యాసాన్ని మెత్తబరచకుండా, వచనం చెప్పినదానికంటే మించి ఊహించకుండా అనువదించబడింది.
- issue: κοινωνοὺς τῶν δαιμονίων యొక్క బలం
  choice: దయ్యాలతో నిజమైన భాగస్వామ్య సహభాగిత
  alternative: విగ్రహారాధకులతో కేవలం సామాజిక సంబంధం, లేదా దయ్యాలకు సంపూర్ణ ఆరాధనాత్మక విధేయత
  rationale: సందర్భంలోని κοινωνία భావం నిజమైన పాలుపంచుకోవడాన్ని సూచిస్తుంది; అనువాదం దాని గంభీరతను నిలుపుతూ సంపూర్ణ విధేయతగా అతిశయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘బలి అర్పించడం’ ఆరాధనా సందర్భాన్ని స్పష్టంగా ఉంచుతుంది; ‘పాలుపంచుకునేవారు’ κοινωνός యొక్క సంబంధాత్మక-సహభాగిత భావాన్ని సహజంగా అందిస్తుంది.
