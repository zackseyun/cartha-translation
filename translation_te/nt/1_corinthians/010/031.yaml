id: 1CO.10.31
reference: 1 Corinthians 10:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: te
  text: కాబట్టి మీరు తిన్నా, తాగినా, మరేదైనా చేసినా, సమస్తాన్ని దేవుని మహిమ కోసం చేయండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: తిన్నా, తాగినా, మరేదైనా చేసినా
  rationale: గ్రీకు సహసంబంధ అవ్యయాలు ప్రత్యామ్నాయ సందర్భాలను వరుసగా చూపిస్తాయి. ‘-ఇన్నా/-ఇనా’ నిర్మాణం ఆధునిక తెలుగులో ‘whether ... or ...’ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి చర్చనుంచి వచ్చే నిర్ధారణను సూచిస్తుంది; ‘కాబట్టి’ ఆ తార్కిక సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐσθίετε
  choice: మీరు తిన్నా
  rationale: వర్తమాన కాలరూపం ఇక్కడ సాధారణంగా జరిగే క్రియను సూచిస్తుంది. తెలుగు షరతు-ప్రత్యామ్నాయ నిర్మాణంలో ‘తిన్నా’ కాలపరంగా అనవసరమైన పరిమితి విధించకుండా సాధారణ భావాన్ని ఇస్తుంది.
- source_word: πίνετε
  choice: తాగినా
  rationale: ఇది కూడా సాధారణ క్రియను సూచిస్తుంది; ‘తాగినా’ ముందున్న ‘మీరు’ అనే కర్తను సహజంగా కొనసాగిస్తుంది.
- source_word: τι
  choice: మరేదైనా
  rationale: తినడం, తాగడం దాటి పరిధిని విస్తరించే అనిర్దిష్ట భావాన్ని ‘మరేదైనా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ποιεῖτε
  choice: చేసినా / చేయండి
  rationale: ποιέω విస్తృతార్థకమైన ‘చేయు’ క్రియ. మొదటి చోట ప్రత్యామ్నాయ సందర్భాన్ని, రెండవ చోట ఆజ్ఞాత్మక ప్రబోధాన్ని తెలుగు రూపాలు సహజంగా ప్రతిబింబిస్తాయి.
- source_word: πάντα
  choice: సమస్తాన్ని
  rationale: సర్వసమగ్ర పరిధిని నిలుపుతుంది. ‘అన్నిటినీ’ కూడా సాధ్యమే అయినా, ‘సమస్తాన్ని’ సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక శైలిలో సరిపోతుంది.
- source_word: εἰς δόξαν
  choice: మహిమ కోసం
  rationale: εἰς ఇక్కడ ఉద్దేశం లేదా లక్ష్యాన్ని సూచిస్తుంది. ‘కోసం’ ఆ లక్ష్యభావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని తెలుగు ‘దేవుని మహిమ’ సహజంగా, నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: పౌలు ఇచ్చిన ప్రబోధపు పరిధి
  choice: తినడం, తాగడం సహా ప్రతి కార్యమూ దేవుని మహిమను లక్ష్యంగా చేసుకోవాలనే సమగ్ర నైతిక సూత్రం
  alternative: ఈ ఉపదేశం ఆహారం, పానీయం గురించిన తక్షణ వివాదానికే పరిమితం
  rationale: తినడం, తాగడం అనే ప్రత్యేక ఉదాహరణల నుంచి ‘మరేదైనా’ మరియు ‘సమస్తం’ అనే సమగ్ర పదాలకు వాక్యం విస్తరిస్తుంది. అందువల్ల తక్షణ సందర్భాన్ని నిలుపుతూనే విస్తృత అన్వయాన్ని అనుమతిస్తుంది.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యపు ప్రబోధాత్మక గౌరవాన్ని నిలుపుతూ అనువదించబడింది. ‘కాబట్టి’తో సందర్భ సంబంధం, ‘తిన్నా... తాగినా... చేసినా’తో గ్రీకు వాక్య నిర్మాణపు లయ సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
