id: 1CO.10.17
reference: 1 Corinthians 10:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: te
  text: రొట్టె ఒకటే ఉంది కాబట్టి, అనేకులమైన మనం ఒక్క శరీరమే; ఎందుకంటే మనమందరం ఆ ఒక్క రొట్టె నుండి వాటా పొందుతున్నాం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: కాబట్టి
  rationale: ముందటి వాక్యానికి కారణాన్ని సూచించే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἷς ἄρτος
  choice: రొట్టె ఒక్కటే
  rationale: ἄρτος అనేది రొట్టెను లేదా ఒక రొట్టె ముద్దను సూచించగలదు. ప్రధాన పాఠంలో ‘రొట్టె’ సందర్భంలోని భోజన, ప్రభుభోజన ప్రతిధ్వనులను నిలుపుతుంది; ఏకత్వాన్ని ‘ఒక్కటే’ స్పష్టంగా చూపుతుంది.
- source_word: ἓν σῶμα
  choice: ఒక్క శరీరం
  rationale: సామూహిక ఏకత్వాన్నీ సందర్భంలోని గాఢమైన దైవశాస్త్ర సంబంధాన్నీ అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: οἱ πολλοί ἐσμεν
  choice: అనేకులమైన మనం ... ఉన్నాం
  rationale: అనేకత్వం మరియు ఏకత్వం మధ్య ఉన్న వ్యత్యాసాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: తరువాతి ఉపవాక్యం ముందటి ప్రకటనకు ఇచ్చే వివరణాత్మక కారణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἱ πάντες
  choice: మనమందరం
  rationale: సమూహంలోని వారందరి ఉమ్మడి భాగస్వామ్యాన్ని నొక్కి చెబుతుంది.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: ఆ ఒక్క రొట్టెలో
  rationale: ἐκ మూలాన్ని లేదా దానినుంచి పొందే భాగాన్ని సూచిస్తుంది. ‘రొట్టెలో పాలుపంచుకోవడం’ తెలుగులో సహజంగా ఉండి, ఒకే రొట్టెతో అందరి భాగస్వామ్యాన్ని నిలుపుతుంది.
- source_word: μετέχομεν
  choice: పాలుపంచుకుంటున్నాం
  rationale: μετέχω తెలిపే వాస్తవమైన ఉమ్మడి భాగస్వామ్యాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఒక్క రొట్టెకు ఒక్క శరీరానికి మధ్య సంబంధం
  choice: అందరూ ఒక్క రొట్టెలో పాలుపంచుకోవడం మరియు విశ్వాసుల ఏకశరీరత్వం మధ్య పౌలు ఉంచిన సంబంధాన్ని యథాతథంగా నిలుపడం
  alternative: రొట్టెను కేవలం ప్రతీకాత్మక ఐక్యతగా వివరించడం, లేదా రొట్టె ద్వారా ఐక్యత కలుగుతుందని మరింత బలమైన సంస్కారార్థాన్ని అనువాదంలోనే నిర్ధారించడం
  rationale: గ్రీకు పాఠం ఉమ్మడి రొట్టె భాగస్వామ్యాన్ని అనేకులు ఒక్క శరీరంగా ఉండటానికి కారణంగా అనుసంధానిస్తుంది; అయితే తరువాతి ప్రభుభోజన సిద్ధాంత వివాదాలను అది ఇక్కడ తేల్చదు. అనువాదం ఆ సంబంధాన్ని కాపాడుతూ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘పాలుపంచుకుంటున్నాం’ సాధారణ పాఠకులకు సహజంగా ఉండి, భోజన సంబంధమైన మరియు దైవశాస్త్ర సంబంధమైన భావాలను అతిగా నిర్ధారించకుండా నిలుపుతుంది.
