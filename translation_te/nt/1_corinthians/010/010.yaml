id: 1CO.10.10
reference: 1 Corinthians 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: te
  text: మీరు గొణగకండి; వారిలో కొందరు గొణగి నాశకుని చేత నాశనమైనట్లుగా చేయకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాశనం చేసే దూత చేత.’ గ్రీకులో ‘నాశకుడు’ అని ఉంది; ఇది అరణ్యంలో ఇశ్రాయేలీయులపై వచ్చిన తీర్పులలో నాశనం చేసిన కార్యనిర్వాహకుణ్ణి సూచిస్తూ ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: మీరు ... సణగకండి
  rationale: μηδέ ముందున్న హెచ్చరికల వరుసలో ఈ నిషేధాన్ని కలుపుతుంది. తెలుగులో వాక్యప్రవాహానికి సహజంగా ఉండేలా ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా నిషేధరూపంలో అందించబడింది.
- source_word: γογγύζετε / ἐγόγγυσαν
  choice: సణగకండి / సణిగినట్లుగా
  rationale: γογγύζω అసంతృప్తితో గొణుగుతూ ఫిర్యాదు చేయడాన్ని సూచిస్తుంది. ‘సణగు’ ఆధునిక తెలుగులో ఈ భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తూ రెండు క్రియారూపాల మధ్య పదసామ్యాన్ని నిలుపుతుంది.
- source_word: καθάπερ τινὲς αὐτῶν
  choice: వారిలో కొందరు ... నట్లుగా
  rationale: καθάπερ యొక్క పోలికను ‘నట్లుగా’ స్పష్టంగా చూపుతుంది; τινὲς αὐτῶν అనే భాగార్థక భావాన్ని ‘వారిలో కొందరు’ సహజంగా అందిస్తుంది.
- source_word: ἀπώλοντο
  choice: నాశనమయ్యారు
  rationale: తరువాతి ὑπό కర్తృవాచక పదబంధంతో కలిసి బాహ్య నాశక చర్యను తెలియజేస్తుంది. ‘చనిపోయారు’ కంటే మూలంలోని నాశన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: నాశకుని చేత
  rationale: గ్రీకు పాఠం వ్యక్తిని ‘నాశకుడు’ అనే బిరుదుతో మాత్రమే పేర్కొంటుంది. ‘నాశనం చేసే దూత’ అని ప్రధాన పాఠంలో విశదీకరించకుండా మూలంలోని అనిశ్చితిని కాపాడుతుంది.
theological_decisions:
- issue: ὁ ὀλοθρευτής యొక్క గుర్తింపు
  choice: నాశకుడు
  alternative: నాశనం చేసే దూత
  rationale: మూలపాఠం ఆ నాశక కార్యనిర్వాహకుణ్ణి ‘నాశకుడు’ అని మాత్రమే పేర్కొంటుంది; అతడు దూత అని స్పష్టంగా చెప్పదు. కాబట్టి ప్రధాన పాఠం ఆ ఉద్విగ్నతను నిలుపుతుంది; సాధ్యమైన వివరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని పునరుక్తి, పోలిక, నాశకుని గుర్తింపులోని ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
