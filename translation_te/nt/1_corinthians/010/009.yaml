revisions:
- from: మనము మెస్సీయను[a] పరీక్షకు పెట్టకూడదు; వారిలో కొందరు ఆయనను పరీక్షించి, పాముల[b]వల్ల నశిస్తూ ఉన్నారు.
  to: మనమూ మెస్సీయను[a] పరీక్షకు పెట్టకూడదు, వారిలో కొందరు ఆయనను పరీక్షించి పాముల[b]వల్ల నశిస్తూ ఉన్నట్లే.
  rationale: An explicit comparative expression (‘...ఉన్నట్లే’) has been supplied for καθώς, correcting the principal source-fidelity omission while retaining the draft’s treatment of the imperfect and its key terminology. The footnote wording now distinguishes the manuscript variant (‘ప్రభువు’) from the translation alternative (‘క్రీస్తు’).
