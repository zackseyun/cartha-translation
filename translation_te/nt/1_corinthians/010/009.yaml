id: 1CO.10.9
reference: 1 Corinthians 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: te
  text: మనమూ మెస్సీయను[a] పరీక్షకు పెట్టకూడదు, వారిలో కొందరు ఆయనను పరీక్షించి పాముల[b]వల్ల నశిస్తూ ఉన్నట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘మెస్సీయ’కు బదులుగా ‘ప్రభువు’ అని ఉంది. ‘మెస్సీయ’ను ‘క్రీస్తు’ అని కూడా అనువదించవచ్చు.
    reason: textual_variant
  - marker: b
    text: లేదా ‘సర్పాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: మనము ... కూడదు
  rationale: ముందున్న నిషేధాల వరుసను కొనసాగించే భావాన్ని తెలుగులో సహజమైన నిషేధాత్మక ప్రబోధంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκπειράζωμεν
  choice: పరీక్షకు పెట్టకూడదు
  rationale: ఎవరినైనా అనుచితంగా పరీక్షించడం అనే ప్రతికూల భావాన్ని నిలుపుతుంది; ‘శోధించడం’ అని అనువదిస్తే ప్రలోభపెట్టడం అనే తప్పుదారి భావం కలగవచ్చు.
- source_word: τὸν Χριστόν
  choice: మెస్సీయను
  rationale: Χριστός ఇక్కడ బిరుదుగా వాడబడింది; అందువల్ల ఆధునిక తెలుగులో బిరుదు భావాన్ని స్పష్టంగా తెలిపే ‘మెస్సీయ’ ఎంచుకోబడింది.
- source_word: καθώς
  choice: ; వారిలో కొందరు ...
  rationale: గ్రీకు పోలికను తెలుగులో సహజంగా, ముందు నిషేధం తరువాత హెచ్చరికాత్మక ఉదాహరణగా చూపేందుకు అర్ధవిరామంతో అనుసంధానించబడింది.
- source_word: τινες αὐτῶν
  choice: వారిలో కొందరు
  rationale: అరణ్యకాల ఇశ్రాయేలీయులలో కొందరిని సహజంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: ἐπείρασαν
  choice: ఆయనను పరీక్షించి
  rationale: గతంలో వారు చేసిన పరీక్షించే క్రియను తెలియజేస్తూ, ముందటి భాగం నుంచి అర్థమయ్యే కర్మను ‘ఆయనను’ అని స్పష్టం చేస్తుంది.
- source_word: ὑπὸ τῶν ὄφεων
  choice: పాములవల్ల
  rationale: ὄφιςకు ఆధునిక సాధారణ తెలుగు పదం ‘పాము’; ‘వల్ల’ నాశనానికి వాటి కారకత్వాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀπώλλυντο
  choice: నశిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న నాశన ప్రక్రియను సాధ్యమైనంత సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: τὸν Χριστόν యొక్క పాఠభేదం మరియు సూచిత వ్యక్తి
  choice: మెస్సీయను
  alternative: ప్రభువును; క్రీస్తును
  rationale: SBLGNT ప్రధాన పాఠంలో Χριστόν ఉంది; దానిని బిరుదుగా ‘మెస్సీయ’ అని అనువదించాం. కొన్ని ప్రతుల్లో κύριον (‘ప్రభువు’) ఉన్న ప్రాముఖ్యమైన పాఠభేదాన్ని పాదసూచికలో నిలిపాం; తద్వారా అరణ్యంలో పరీక్షించబడిన వ్యక్తి గురించిన పాఠ్య, దైవశాస్త్రీయ ఉద్వేగాన్ని మౌనంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి వాడబడింది. ‘పరీక్షకు పెట్టడం’ అనేది అనుచితంగా పరీక్షించడం అనే భావాన్ని సహజంగా అందిస్తుంది; ‘నశిస్తూ ఉన్నారు’ అసంపూర్ణ భూతకాల దృక్కోణాన్ని నిలుపుతుంది.
