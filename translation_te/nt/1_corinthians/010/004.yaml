  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: te
  text: వారందరూ ఒకే ఆత్మసంబంధమైన పానీయం తాగారు. ఎందుకంటే, తమ వెంట వస్తూ ఉన్న[a] ఆత్మసంబంధమైన బండ నుంచి వారు తాగుతూ ఉండేవారు; ఆ బండ మెస్సీయా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తమ వెంట వచ్చిన ఆత్మసంబంధమైన బండ నుంచి’ అని కూడా అనువదించవచ్చు. గ్రీకు వర్తమాన కృదంతం కొనసాగుతున్న భావాన్ని సూచించగలదు; అందుకే ప్రధాన పాఠ్యంలో ‘వస్తూ ఉన్న’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘క్రీస్తు.’ ఇక్కడ ఆ పదం వ్యక్తిపేరులా కాక ‘మెస్సీయా’ అనే బిరుదుగా పనిచేస్తోంది.
    reason: alternative_reading
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: ఆత్మసంబంధమైన పానీయం
  rationale: πνευματικός అనే పదాన్ని కేవలం ‘అద్భుతమైన’ లేదా ‘సంకేతాత్మకమైన’ అని పరిమితం చేయకుండా, ఆత్మకు లేదా దేవుని అనుగ్రహానికి సంబంధించినదనే విస్తృత భావంతో నిలిపింది; ముందరి వచనంలోని ఆత్మసంబంధమైన ఆహారంతో ఉన్న సమాంతరతను కూడా కాపాడుతుంది.
- source_word: ἔπιον
  choice: తాగారు
  rationale: అరణ్య తరం అంతా పాలుపంచుకున్న అనుభవాన్ని సంగ్రహంగా తెలిపే aorist క్రియకు సహజమైన భూతకాల రూపం.
- source_word: ἔπινον
  choice: తాగుతూ ఉండేవారు
  rationale: గ్రీకు imperfect సూచించే కొనసాగిన లేదా పునరావృతమైన చర్యను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ముందున్న ‘తాగారు’ అనే aorist రూపం నుంచి తేడాను నిలుపుతుంది.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: తమ వెంట వస్తూ ఉన్న ఆత్మసంబంధమైన బండ నుంచి
  rationale: ἀκολουθούσης అనే వర్తమాన కృదంతంలోని కొనసాగుతున్న భావాన్ని ‘వస్తూ ఉన్న’ నిలుపుతుంది. πέτραకు ఈ పదబంధంలో article లేకపోయినా, తెలుగులో అనిశ్చిత article అవసరం లేదు; తరువాత ‘ఆ బండ’ అని దానిని గుర్తిస్తుంది.
- source_word: πέτρα
  choice: బండ
  rationale: πέτρα చిన్న రాయిని కాక పెద్ద రాతిబండను సూచిస్తుంది; తెలుగు సందర్భంలో ‘బండ’ ఆ దృశ్యాన్నీ రూపక బలాన్నీ సహజంగా నిలుపుతుంది.
- source_word: ἡ πέτρα δὲ ἦν
  choice: ఆ బండ ...
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానాన్ని ఇస్తుంది. తెలుగు అర్ధవిరామం తరువాత ‘ఆ బండ’ అని చెప్పడం ప్రవాహాన్ని సహజంగా ఉంచి గుర్తింపును స్పష్టం చేస్తుంది.
- source_word: ὁ Χριστός
  choice: మెస్సీయా
  rationale: ఇక్కడ Χριστός వ్యక్తిపేరులా కాక బిరుదుగా, విధేయపదంగా వాడబడింది. ‘మెస్సీయా’ ఆ బిరుదు భావాన్ని నిలుపుతుంది; పాదసూచికలో గ్రీకు పదం ‘క్రీస్తు’ అని తెలియజేస్తుంది.
- source_word: πάντες τὸ αὐτὸ
  choice: వారందరూ ఒకే
  rationale: సమూహమంతటికీ ఒకే అనుభవం కలిగిందనే పౌలు ఉద్ఘాటనను నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆ బండ మెస్సీయా’ అనే గుర్తింపు వాక్యం
  choice: గ్రీకు సమీకరణ వాక్యంలోని ప్రత్యక్ష బలాన్ని అలాగే ఉంచడం
  alternative: ‘ఆ బండ మెస్సీయాను సూచించింది’ అని కేవలం ప్రతీకాత్మకంగా వివరించడం
  rationale: ἡ πέτρα δὲ ἦν ὁ Χριστός నేరుగా ‘ఆ బండ మెస్సీయా’ అని చెబుతుంది. భౌతిక బండకూ వ్యక్తికీ మధ్య సంబంధాన్ని తాత్వికంగా వివరించకుండా, పౌలు ఉంచిన క్రీస్తుసంబంధమైన రూపక ఉద్వేగాన్ని అనువాదం నిలుపుతుంది.
- issue: పానీయం, బండల విషయంలో πνευματικός భావం
  choice: ‘ఆత్మసంబంధమైన’ అని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘అద్భుతమైన’ లేదా ‘సంకేతాత్మకమైన’
  rationale: ఈ సందర్భంలో పదానికి దైవిక అనుగ్రహం, ఆత్మకు సంబంధించిన పరిధి, రూపసూచక ప్రాముఖ్యత వంటి భావాలు ఉండవచ్చు. ఒకే వివరణకు కుదించకుండా మూలంలోని విస్తృతతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘ఆత్మసంబంధమైన’ కొంత శాస్త్రీయంగా వినిపించినా πνευματικός యొక్క theological breadth‌ను ‘అద్భుతమైన’ లేదా ‘సంకేతాత్మకమైన’ అని సంకుచితం చేయకుండా నిలుపుతుంది. కొనసాగుతున్న క్రియలను ‘వస్తూ ఉన్న,’ ‘తాగుతూ ఉండేవారు’ అనే రూపాలతో స్పష్టంగా వేరు చేసింది.
