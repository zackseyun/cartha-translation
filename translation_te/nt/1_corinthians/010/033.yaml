source:
  edition: SBLGNT
  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: te
  text: అలాగే నేను కూడా అన్ని విషయాల్లో అందరినీ సంతోషపరుస్తున్నాను,[a] నా సొంత ప్రయోజనాన్ని వెదకకుండా అనేకుల ప్రయోజనాన్ని వెదుకుతూ,[b] వారు రక్షించబడాలని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అందరి విషయంలో అన్ని విధాలా.’ గ్రీకులో అక్షరార్థంగా ‘అందరినీ అన్ని విషయాల్లో’ అని ఉంది; ఇతరుల మేలు కోసం పౌలు విస్తృతంగా అనుకూలించడాన్ని ఇది వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా సొంత మేలు ... అనేకుల మేలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: అలాగే నేను కూడా
  rationale: ముందున్న ఉపదేశంతో పౌలు చూపుతున్న తన మాదిరిని పోల్చే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πάντα πᾶσιν
  choice: అన్ని విషయాల్లో అందరినీ
  rationale: గ్రీకు పదబంధంలోని విస్తృత పరిధిని నిలుపుతూ, 9:22లోని వేరే పదప్రయోగాన్ని ఇక్కడికి దిగుమతి చేయకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀρέσκω
  choice: సంతోషపరుస్తున్నాను
  rationale: ‘ఇష్టపడేలా ఉండటం/సంతోషపరచడం’ అనే ప్రాథమిక భావాన్ని నిలుపుతుంది; తరువాతి ప్రయోజనవాక్యం ఇది స్వార్థపూరితంగా మనుషుల మెప్పు కోరడం కాదని స్పష్టం చేస్తుంది.
- source_word: μὴ ζητῶν
  choice: వెదకకుండా
  rationale: వర్తమాన కృదంతం తెలిపే సహవర్తి వైఖరిని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: నా సొంత ప్రయోజనాన్ని
  rationale: σύμφορον లోని మేలు/ప్రయోజనం అనే భావాన్ని మరియు తరువాతి వ్యతిరేక సమాంతరతను నిలుపుతుంది.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: అనేకుల ప్రయోజనాన్ని
  rationale: గ్రీకులో ముందున్న σύμφορον అధ్యాహారంగా ఉన్నందున తెలుగులో దానిని మళ్లీ వ్యక్తం చేసి వాక్యాన్ని స్పష్టంగా చేస్తుంది; ‘అనేకులు’ అనే పరిధిని అలాగే ఉంచుతుంది.
- source_word: ἵνα σωθῶσιν
  choice: వారు రక్షించబడాలని
  rationale: ἵνα ప్రయోజనార్థక భావాన్ని, σωθῶσιν యొక్క కర్మణి రూపాన్ని, పౌలు వాడే రక్షణార్థక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: σωθῶσιν యొక్క పరిధి, అర్థం
  choice: వారు రక్షించబడాలని
  alternative: వారు కాపాడబడాలని / వారికి సహాయం కలగాలని
  rationale: ఈ సందర్భంలోని సువార్త సంబంధ లక్ష్యం మరియు 1 కొరింథీయులలో σῴζω వాడుక రక్షణార్థక భావాన్ని సమర్థిస్తాయి. కర్మణి రూపాన్ని నిలిపి, కార్యసాధకుడు ఎవరో అనువాదంలో అదనంగా పేర్కొనలేదు.
- issue: పౌలు అందరినీ ‘సంతోషపరచడం’ అనే మాట భావం
  choice: ఇతరుల రక్షణకరమైన మేలు కోసం వారికి అనుకూలంగా నడుచుకోవడం
  alternative: మనుషుల ఆమోదం కోసం రాజీపడడం
  rationale: ‘నా సొంత ప్రయోజనం కాదు, అనేకుల ప్రయోజనం’ మరియు ‘వారు రక్షించబడాలని’ అనే పరిమితులు ἀρέσκω భావాన్ని నియంత్రిస్తాయి; అందువల్ల ఇది స్వార్థపూరిత మెప్పుకోలు కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని విస్తృతత, ప్రయోజన వ్యత్యాసం, రక్షణార్థక లక్ష్యం నిలుపబడ్డాయి. రెండు పాదసూచిక గుర్తులూ ప్రధాన వచనంలో చేర్చబడ్డాయి.
