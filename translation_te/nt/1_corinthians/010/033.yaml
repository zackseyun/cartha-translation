    rationale: '[a] అనేది πάντα πᾶσιν/‘అన్ని విషయాల్లో అందరినీ’కి, [b] అనేది వ్యక్తిగత మరియు అనేకుల ప్రయోజనాల వ్యతిరేకతకు సంబంధించినవి. రెండింటినీ వాక్యాంతంలో కలిపి ఉంచడం కంటే సంబంధిత పదబంధాల వద్ద ఉంచడం ఖచ్చితమైన అనుసంధానాన్ని ఇస్తుంది.'
