revisions:
- from: అలాగే నేను కూడా, నా సొంత ప్రయోజనాన్ని వెదకకుండా అనేకుల ప్రయోజనాన్ని వెదుకుతూ—వారు రక్షించబడాలని—అన్ని విషయాల్లో అందరినీ సంతోషపరుస్తున్నాను.[a][b]
  to: అలాగే నేను కూడా అన్ని విషయాల్లో అందరినీ సంతోషపరుస్తున్నాను,[a] నా సొంత ప్రయోజనాన్ని వెదకకుండా అనేకుల ప్రయోజనాన్ని వెదుకుతూ,[b] వారు రక్షించబడాలని.
  rationale: 'అనువాదార్థాన్ని మార్చకుండా, గ్రీకు వాక్య నిర్మాణంలోని ప్రవాహాన్ని తెలుగులో స్పష్టంగా చేశాము: అందరినీ అన్ని విషయాల్లో సంతోషపరచడం ప్రధాన ప్రకటనగా, స్వప్రయోజనాన్ని విడిచి అనేకుల ప్రయోజనాన్ని కోరడం దాని విధానంగా, వారి రక్షణ చివరి ఉద్దేశంగా కనిపిస్తుంది. పాదసూచిక గుర్తులను వాటి సంబంధిత పదబంధాల వద్దకు తరలించాము.'
