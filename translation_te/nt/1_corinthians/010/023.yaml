  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Πάντα ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. ⸁πάντα ἔξεστιν· ἀλλ’ οὐ πάντα οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: te
  text: “అన్నీ అనుమతించబడ్డాయి,” కానీ అన్నీ మేలు కలిగించవు.[a] “అన్నీ అనుమతించబడ్డాయి,” కానీ అన్నీ అభివృద్ధికి తోడ్పడవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అన్నీ ధర్మసమ్మతమైనవి.” గ్రీకు పదబంధం అనుమతించబడినవి లేదా ధర్మసమ్మతమైనవి అనే రెండు భావాలనూ సూచించగలదు. ఉద్ధరణ చిహ్నాలు, పౌలు పరిమితం చేస్తున్న ఈ మాట బహుశా కొరింథీయుల నినాదమని సూచిస్తాయి.
    reason: lexical_alternative_and_interpretive_punctuation
lexical_decisions:
- source_word: Πάντα
  choice: అన్నీ
  rationale: నపుంసక బహువచన విశేషణం నామవాచకంగా వాడబడింది. ‘అన్నీ’ దాని విస్తృతమైన, నిర్దిష్ట పరిమితిలేని భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔξεστιν
  choice: అనుమతించబడ్డాయి
  rationale: ఈ పదం అనుమతి ఉండడం లేదా ధర్మసమ్మతంగా ఉండడం అనే భావాలను సూచించగలదు. ‘అనుమతించబడ్డాయి’ ఆధునిక తెలుగులో అనుమతి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀλλ’
  choice: కానీ
  rationale: గ్రీకులోని సంక్షిప్త వ్యతిరేక సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: συμφέρει
  choice: మేలు కలిగించవు
  rationale: ప్రయోజనకరంగా లేదా హితకరంగా ఉండడం అనే భావాన్ని వాణిజ్యార్థం రాకుండా సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: οἰκοδομεῖ
  choice: క్షేమాభివృద్ధి కలిగించవు
  rationale: అక్షరార్థంగా ‘కడుతుంది’; పౌలు వాడుకలో ఇది వ్యక్తులను లేదా సమాజాన్ని బలపరచి అభివృద్ధి చేయడాన్ని సూచిస్తుంది. ‘క్షేమాభివృద్ధి కలిగించవు’ ఆ సామూహిక, రూపకాలంకార భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: Πάντα ἔξεστιν అనే మాటను కొరింథీయుల నినాదంగా సూచించాలా?
  choice: “అన్నీ అనుమతించబడ్డాయి” అని ఉద్ధరణ చిహ్నాలతో ఇవ్వడం
  alternative: ఉద్ధరణ చిహ్నాలు లేకుండా పౌలు స్వయంగా చేసిన ప్రకటనగా ఇవ్వడం
  rationale: పునరావృతమయ్యే ఈ మాటను పౌలు సరిదిద్దుతున్న కొరింథీయుల నినాదంగా అనేకులు అర్థం చేసుకుంటారు. ప్రాచీన గ్రీకు ప్రతుల్లో ఆధునిక ఉద్ధరణ చిహ్నాలు లేవు; అందువల్ల ఇది పాఠభేదం కాక వ్యాఖ్యానాత్మక విరామచిహ్న నిర్ణయం. అస్పష్టతను పాదసూచికలో తెలియజేస్తూ ప్రధాన పాఠంలో వాక్య నిర్మాణాన్ని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. పునరావృత నినాద నిర్మాణాన్ని అలాగే ఉంచి, συμφέρει మరియు οἰκοδομεῖ మధ్యనున్న ‘మేలు’–‘సమాజ క్షేమాభివృద్ధి’ భేదాన్ని చూపించాం.
