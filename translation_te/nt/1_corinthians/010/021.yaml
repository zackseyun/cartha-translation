revisions:
- from: మీరు ప్రభువు పాత్రలోనిదీ దయ్యాల పాత్రలోనిదీ తాగలేరు; ప్రభువు బల్లలోనూ దయ్యాల బల్లలోనూ పాలుపంచుకోలేరు.
  to: మీరు ప్రభువు యొక్క పాత్రలోనిదీ, దయ్యాల యొక్క పాత్రలోనిదీ తాగలేరు; ప్రభువు బల్లలోనూ దయ్యాల బల్లలోనూ పాలుపంచుకోలేరు.
  rationale: A small syntactic revision makes the cup idiom clear and natural in modern Telugu while preserving the source's twofold categorical negation, its parallelism, and its non-explanatory cultic imagery. No footnote is required because the revised wording does not introduce a disputed or additional interpretation.
  reviewer_model: gpt-5.6-terra
