review_pass:
  verdict: revise
  source_fidelity: The repeated οὐ δύνασθε is correctly conveyed by తాగలేరు / పాలుపంచుకోలేరు, preserving the categorical incompatibility. The paired references to the Lord and demons and the parallel two-clause structure are retained. However, the first clause needs an explicit possessive construction and punctuation so that it naturally denotes what is drunk from each cup rather than reading as an incomplete or awkward phrase.
  naturalness: ప్రభువు పాత్రలోనిదీ దయ్యాల పాత్రలోనిదీ requires punctuation and is more natural with the possessive form ప్రభువు యొక్క / దయ్యాల యొక్క. The second clause is understandable, but the revised wording preserves the established participatory metaphor while reading smoothly in modern standard Telugu.
  terminology: ప్రభువు appropriately renders κυρίου; దయ్యాలు is a suitable modern equivalent for δαιμονίων; పాత్ర and బల్ల retain the source imagery without importing altar terminology. పాలుపంచుకోవడం is an appropriate natural rendering of μετέχειν.
  issues:
  - severity: medium
    issue: The first paired expression lacks punctuation and uses compressed genitives that can impede comprehension.
    rationale: Adding commas and explicit possessives clarifies that the phrase refers to what is in the Lord's cup and in demons' cup, an idiomatic Telugu way to retain the Greek metonymy of drinking a cup.
  revised_text: మీరు ప్రభువు యొక్క పాత్రలోనిదీ, దయ్యాల యొక్క పాత్రలోనిదీ తాగలేరు; ప్రభువు బల్లలోనూ దయ్యాల బల్లలోనూ పాలుపంచుకోలేరు.
  revised_footnotes: []
