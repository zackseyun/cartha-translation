id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: te
  text: మీరు ప్రభువు యొక్క పాత్రలోనిదీ, దయ్యాల యొక్క పాత్రలోనిదీ తాగలేరు; ప్రభువు బల్లలోనూ దయ్యాల బల్లలోనూ పాలుపంచుకోలేరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: మీరు ... తాగలేరు / పాలుపంచుకోలేరు
  rationale: వర్తమాన కాలంలోని అసాధ్యతను, పరస్పర విరుద్ధతను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; గ్రీకులోని పునరుక్తిని రెండు ఖండాల్లోనూ నిలుపుతుంది.
- source_word: ποτήριον
  choice: పాత్ర
  rationale: త్రాగే పాత్రను సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం; సందర్భంలోని ఆచారపరమైన భావాన్ని వివరణతో విస్తరించదు.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు స్థిరమైన తెలుగు సమానార్థకం. సంబంధాన్ని ‘ప్రభువు పాత్రలోనిది’, ‘ప్రభువు బల్లలో’ అనే సహజ నిర్మాణాలతో వ్యక్తం చేసింది.
- source_word: πίνειν
  choice: తాగడం
  rationale: δύνασθεతో కూడిన సాధారణ క్రియార్థాన్ని అదనపు కాలభావం లేకుండా సహజంగా అందిస్తుంది.
- source_word: δαιμονίων
  choice: దయ్యాలు
  rationale: δαιμόνιαలోని వ్యక్తిగత దుష్ట ఆత్మసంబంధ భావాన్ని సాధారణ పాఠకుడికి నేరుగా తెలియజేసే ప్రామాణిక ఆధునిక తెలుగు పదం.
- source_word: τραπέζης
  choice: బల్ల
  rationale: భోజన సహవాసం మరియు ఆరాధనా సందర్భం రెండింటినీ మోయగల నేరమైన సమానార్థకం; ‘బలిపీఠం’ వంటి వివరణాత్మక భావాన్ని చేర్చదు.
- source_word: μετέχειν
  choice: పాలుపంచుకోవడం
  rationale: నిజమైన భాగస్వామ్యం లేదా పాల్గొనడాన్ని సహజంగా తెలియజేస్తుంది; కేవలం తినడం అనే భావానికి పరిమితం చేయదు.
- source_word: καὶ
  choice: '...దీ ...దీ / ...లోనూ ...లోనూ'
  rationale: తెలుగులో సహజమైన జత నిర్మాణాల ద్వారా గ్రీకు వాక్యంలోని రెండు విరుద్ధ భాగాల అనుసంధానాన్ని, సమాంతరతను నిలుపుతుంది.
theological_decisions:
- issue: ప్రభువు బల్లలో భాగస్వామ్యానికీ దయ్యాలకు సంబంధించిన ఆరాధనలో భాగస్వామ్యానికీ మధ్య సంబంధం
  choice: రెండింటిలోనూ పాల్గొనడం పరస్పరం అసంగతమని తెలిపే నిర్దిష్ట అసాధ్యత
  alternative: ఇది నిజమైన అసంగతతను కాక కేవలం బలమైన హితవును మాత్రమే సూచిస్తుంది
  rationale: రెండుసార్లు వచ్చిన οὐ δύνασθε సంపూర్ణ అసంగతతను బలంగా వ్యక్తం చేస్తుంది. ‘లేరు’ అనే రూపం ఆ బలాన్ని నిలుపుతుంది; అయితే దాని వెనుకనున్న సిద్ధాంతపరమైన విధానాన్ని అదనంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో నేరమైన, గౌరవప్రదమైన శైలి. గ్రీకు మూలంలోని రెండు సమాంతర ఖండాలు, వాటి కఠినమైన నిరాకరణ నిలుపబడ్డాయి. అవసరం లేని వివరణాత్మక లేదా సంప్రదాయ-ప్రత్యేక పదజాలం చేర్చలేదు.
