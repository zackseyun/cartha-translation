source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: te
  text: వారిలో కొందరు లైంగిక దుర్నీతికి పాల్పడినట్లుగా మనం కూడా లైంగిక దుర్నీతికి పాల్పడకూడదు; మరియు ఒక్క రోజులో ఇరవై మూడు వేలమంది పడిపోయారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చనిపోయారు,” “హతమయ్యారు.” గ్రీకు మూలంలో అక్షరార్థంగా “పడిపోయారు” అని ఉంది; తీర్పువల్ల సంభవించిన మరణాన్ని సూచించడానికి ఈ మాట సాధారణంగా వాడబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: సంఖ్యాకాండము 25:9లో ఇరవై నాలుగు వేలమంది చనిపోయారని ఉంది. ఇక్కడ పౌలు “ఒక్క రోజులో” ఇరవై మూడు వేలమంది పడిపోయారని చెప్పడం, ఆ రోజు చనిపోయినవారి సంఖ్యను మొత్తం సంఖ్య నుండి వేరు చేసి ఉండవచ్చు. అయితే అనువాదం ఈ సంఖ్యాభేదాన్ని సమన్వయపరచకుండా పౌలు చెప్పిన సంఖ్యనే నిలుపుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: కూడా ... పాల్పడకూడదు
  rationale: ముందటి హెచ్చరికల వరుసతో సంబంధాన్ని నిలుపుతూ, వర్తమానకాల ప్రోత్సాహక నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: లైంగిక దుర్నీతికి పాల్పడకూడదు / పాల్పడినట్లుగా
  rationale: πορνεύω అనే క్రియ సూచించే విస్తృతమైన అనైతిక లైంగిక ప్రవర్తనను అనవసరంగా ఒకే రకమైన పాపానికి పరిమితం చేయకుండా, రెండు చోట్లా ఒకే పదబంధంతో పునరుక్తిని నిలుపుతుంది.
- source_word: καθώς
  choice: అట్లుగా
  rationale: ఇశ్రాయేలీయుల ఉదాహరణతో చేసిన పోలికను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τινες αὐτῶν
  choice: వారిలో కొందరు
  rationale: అరణ్యకాల ఇశ్రాయేలీయులలో కొందరిని నేరుగా సూచిస్తుంది.
- source_word: ἔπεσαν
  choice: నేలకొరిగారు
  rationale: πίπτω యొక్క ‘పడిపోవడం’ అనే చిత్రాన్ని నిలుపుతూ, తీర్పువల్ల మరణించారనే సందర్భార్థాన్ని సహజమైన తెలుగు నుడికారంలో తెలియజేస్తుంది; మరింత స్పష్టమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: μιᾷ ἡμέρᾳ
  choice: ఒక్క రోజులోనే
  rationale: కాలపరిమితిని, తీర్పు ఒక్క రోజులో సంభవించిన తీవ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: ఇరవై మూడు వేలమంది
  rationale: గ్రీకు పాఠంలోని సంఖ్యను యథాతథంగా, తెలుగు వాక్యప్రవాహానికి తగిన వ్యక్తివాచక రూపంతో అందిస్తుంది.
theological_decisions:
- issue: సంఖ్యాకాండము 25:9లోని సంఖ్యతో సంబంధం
  choice: ప్రధాన పాఠంలో పౌలు చెప్పిన ‘ఇరవై మూడు వేలమంది’ అనే సంఖ్యనే నిలుపుట
  alternative: ‘ఇరవై నాలుగు వేలమంది’ అని సంఖ్యాకాండముతో సమన్వయపరచుట, లేదా ఒక సంఖ్యను ఆ రోజు మృతుల సంఖ్యగా మరొకదాన్ని మొత్తం సంఖ్యగా ప్రధాన పాఠంలో వివరించుట
  rationale: 1 కొరింథీయులు గ్రీకు పాఠం స్పష్టంగా ఇరవై మూడు వేలని చెబుతుంది. కనిపించే సంఖ్యాభేదాన్ని అనువాదంలో తొలగించకుండా, సాధ్యమైన వివరణను పాదసూచికకే పరిమితం చేయడం మూలపాఠానికి న్యాయం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘లైంగిక దుర్నీతి’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది; ‘నేలకొరిగారు’ మరణాన్ని సూచించే గ్రీకు రూపకాన్ని సహజమైన తెలుగు నుడికారంతో ప్రతిబింబిస్తుంది.
