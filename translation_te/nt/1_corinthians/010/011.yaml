source:
  edition: SBLGNT
  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: te
  text: ఈ సంగతులు వారికి మాదిరులుగా[a] జరిగాయి; యుగాల అంతాలు వచ్చి చేరిన మనకు హెచ్చరికగా[b] అవి వ్రాయబడ్డాయి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నమూనాలుగా,” “ప్రతిరూపాలుగా”; ఈ సంఘటనలు తరువాతి విశ్వాసులకు బోధనాత్మక ప్రాముఖ్యతగల నమూనాలని పౌలు చూపిస్తున్నాడు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మనకు ఉపదేశంగా,” “మనలను హెచ్చరించడానికి”; గ్రీకు పదంలో బోధ, దిద్దుబాటు, హెచ్చరిక భావాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “యుగాల అంతాలు”; గ్రీకులో “అంతాలు,” “యుగాలు” రెండూ బహువచనంలో ఉన్నాయి. “యుగాల అంతం వచ్చి చేరిన” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: మాదిరులుగా
  rationale: ఈ సంఘటనలు తరువాతి విశ్వాసులకు బోధనాత్మక నమూనాలుగా పనిచేస్తాయని సూచిస్తుంది. ‘మాదిరులుగా’ సహజంగా, స్పష్టంగా ఉంది; సాంకేతికమైన ‘ప్రతిరూపాత్మకంగా’ కంటే సామాన్య పాఠకులకు సులభం.
- source_word: συνέβαινεν
  choice: జరిగాయి
  rationale: అరణ్యకాలంలో జరిగిన అనేక సంగతులను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు అసంపూర్ణ భూతకాల రూపంలోని గత సంఘటన భావాన్ని సందర్భం సరిపడా మోస్తుంది.
- source_word: ἐκείνοις
  choice: వారికి
  rationale: ముందు ప్రస్తావించిన అరణ్య తరం ప్రజలను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: ἐγράφη
  choice: అవి వ్రాయబడ్డాయి
  rationale: గ్రీకులో క్రియ ఏకవచనంలో ఉన్నా, భావపరంగా ముందున్న సంఘటనల లిఖిత వృత్తాంతాన్ని సూచిస్తుంది. తెలుగులో ‘అవి’ అని బహువచన సంబంధం పెట్టడం సహజం.
- source_word: πρὸς νουθεσίαν ἡμῶν
  choice: మనకు బుద్ధి చెప్పడానికి
  rationale: νουθεσίαలో బోధనతో పాటు దిద్దుబాటు, హెచ్చరిక భావాలున్నాయి. ‘బుద్ధి చెప్పడానికి’ ఈ సమ్మిళిత భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: εἰς οὓς
  choice: వచ్చి చేరిన మనకు
  rationale: యుగాల అంతాలు ఎవరి మీదికి వచ్చాయో తెలిపే గ్రీకు దిశాత్మక భావాన్ని తెలుగులో సహజమైన సంబంధ వాక్య నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: యుగాల అంతాలు
  rationale: τέλη, αἰώνων రెండింటి బహువచనాన్ని నిలుపుతూ పౌలు ఉపయోగించిన రక్షణ-చరిత్ర సంబంధమైన ఉద్విగ్నతను సరళీకరించకుండా కాపాడుతుంది.
- source_word: κατήντηκεν
  choice: వచ్చి చేరిన
  rationale: పూర్తయిన రాకకు ప్రస్తుత ప్రాసంగికత ఉందనే గ్రీకు పరిపూర్ణ కాల భావాన్ని ‘వచ్చి చేరిన’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: τὰ τέλη τῶν αἰώνων అనే పౌలు రక్షణ-చరిత్ర సంబంధమైన వ్యక్తీకరణ
  choice: యుగాల అంతాలు వచ్చి చేరిన
  alternative: యుగాల అంతం వచ్చి చేరిన; యుగాల పరిపూర్తి వచ్చిన
  rationale: గ్రీకులోని బహువచన రూపాలను అలాగే నిలుపుతుంది. వాటిని ఒకే ‘అంతం’గా లేదా వ్యాఖ్యానాత్మకమైన ‘పరిపూర్తి’గా మార్చకుండా, పౌలు మాటల్లోని అంత్యకాల ఉద్విగ్నతను సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వాక్యశైలి. ‘మాదిరులు,’ ‘బుద్ధి చెప్పడం’ వంటి సహజ పదాలతో బోధనాత్మక స్వరాన్ని నిలిపి, ‘యుగాల అంతాలు’ అనే అసాధారణ బహువచనాన్ని మూలంలోని ఉద్దేశపూర్వక ఉద్విగ్నత కోసం కాపాడింది.
