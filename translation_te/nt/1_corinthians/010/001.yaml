revisions:
- from: ఎందుకంటే సహోదరులారా,[a] మన పితరులందరూ మేఘం కింద ఉన్నారని, అందరూ సముద్రం గుండా వెళ్లారని మీరు తెలియకుండా ఉండడం నాకు ఇష్టం లేదు.
  to: 'ఎందుకంటే, సహోదరులారా,[a] మీరు ఈ విషయం తెలియక ఉండకూడదని నేను కోరుతున్నాను: మన పితరులందరూ మేఘం కింద ఉన్నారు, అందరూ సముద్రం గుండా వెళ్లారు.'
  rationale: The revision renders the Pauline negative-desire idiom in fluent modern Telugu while retaining its negative force (‘తెలియక ఉండకూడదని’), preserves the explanatory connection (‘ఎందుకంటే’), and keeps the repeated ‘అందరూ,’ the familial ‘మన పితరులు,’ and the Exodus imagery. The footnote anchor and content remain valid.
  reviewer_model: gpt-5.6-terra
