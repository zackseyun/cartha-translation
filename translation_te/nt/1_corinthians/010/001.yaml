id: 1CO.10.1
reference: 1 Corinthians 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: te
  text: 'ఎందుకంటే, సహోదరులారా,[a] మీరు ఈ విషయం తెలియక ఉండకూడదని నేను కోరుతున్నాను: మన పితరులందరూ మేఘం కింద ఉన్నారు, అందరూ సముద్రం గుండా వెళ్లారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహోదర సహోదరీలారా”; గ్రీకులోని “సహోదరులు” అనే పదం స్త్రీపురుషులు కలిసిన సంఘాన్ని ఉద్దేశించి వాడవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: మీరు తెలియకుండా ఉండడం నాకు ఇష్టం లేదు
  rationale: గ్రీకులోని నిషేధార్థక నిర్మాణాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా పౌలు వాడే సూత్రప్రాయమైన మాటను వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనతో ఉన్న వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: సంబోధనలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది; మొత్తం సంఘాన్ని ఉద్దేశించిన విస్తృత సందర్భార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: οἱ πατέρες ἡμῶν
  choice: మన పితరులు
  rationale: ఇశ్రాయేలు చరిత్రతో పాఠకులను పౌలు కుటుంబపరంగా అనుసంధానించే మూలంలోని మాటను నిలుపుతుంది; సాధారణమైన ‘పూర్వీకులు’ కంటే సంబంధబంధాన్ని బలంగా వ్యక్తం చేస్తుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: ఈ వచనంలో రెండుసార్లు వచ్చే πάντες యొక్క అలంకారిక పునరుక్తిని రెండుచోట్లా నిలుపుతుంది.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: మేఘం కింద ఉన్నారు
  rationale: నిర్గమకాలంలోని మార్గదర్శక మేఘాన్ని సూచించే రూపకాన్ని సహజమైన, సమీపార్థక తెలుగులో అందిస్తుంది.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: సముద్రం గుండా వెళ్లారు
  rationale: διάతో కూడిన διέρχομαι సూచించే ‘గుండా కదలడం’ అనే భావాన్ని, నిర్గమ చిత్రణను అతిగా వివరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: మిశ్రలింగ సంఘాన్ని ఉద్దేశించిన ἀδελφοί సంబోధన
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: ప్రధాన పాఠ్యంలో గ్రీకు పుంలింగ బహువచన రూపాన్ని నిలుపుతూ, మొత్తం సంఘాన్ని ఉద్దేశించగల దాని సందర్భార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: ‘మన పితరులు’లో అన్యజనులను కూడా కలిగిన సంఘం ఇశ్రాయేలుతో సమూహపరంగా గుర్తించబడడం
  choice: మన పితరులు
  alternative: మన పూర్వీకులు
  rationale: కొరింథు విశ్వాసులను ఇశ్రాయేలు కథలో చేర్చే పౌలు కుటుంబపరమైన, ఒడంబడికసంబంధమైన వాక్చాతుర్యాన్ని నిలుపుతుంది; ‘పూర్వీకులు’ అని మార్చి ఉద్రిక్తతను సడలించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన సంఘ సంబోధనను వాడింది. మూలంలోని ప్రతికూల సూత్రప్రయోగం, ‘అందరూ’ అనే పునరుక్తి, ‘మన పితరులు’ అనే కుటుంబపరమైన భాష నిలుపబడ్డాయి.
