  to: 'వారిలో కొందరు విగ్రహారాధకులైనట్లుగా, మీరు విగ్రహారాధకులు కావద్దు. ఇలా వ్రాయబడి ఉంది: “ప్రజలు తినడానికి, తాగడానికి కూర్చున్నారు; ఆడుకోవడానికి[a] లేచారు.”'
