id: 1CO.10.7
reference: 1 Corinthians 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: te
  text: 'వారిలో కొందరు విగ్రహారాధకులైనట్లుగా, మీరు విగ్రహారాధకులు కావద్దు. ఇలా వ్రాయబడి ఉంది: “ప్రజలు తినడానికి, తాగడానికి కూర్చున్నారు; ఆడుకోవడానికి[a] లేచారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఉల్లాసంగా వేడుక చేసుకోవడానికి.” ఇది నిర్గమకాండము 32:6 నుండి తీసుకున్న మాట; అక్కడ ఈ ‘ఆట’ బంగారు దూడ చుట్టూ ఇశ్రాయేలీయులు చేసిన విగ్రహారాధన విందుతో ముడిపడి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: కావద్దు
  rationale: ముందటి హెచ్చరికలను కొనసాగించే నిషేధార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ప్రత్యేకంగా ‘మరియు’ లేదా ‘అలాగే’ చేర్చకుండానే సందర్భానుసంధానం నిలుస్తుంది.
- source_word: εἰδωλολάτραι
  choice: విగ్రహారాధకులు
  rationale: విగ్రహాలను ఆరాధించేవారిని సూచించే సంక్షిప్తమైన, ప్రామాణిక తెలుగు పదం.
- source_word: γίνεσθε
  choice: కావద్దు
  rationale: కేవలం ఒక స్థితిలో ఉండకూడదనే భావం కంటే, అలాంటి వారిగా మారకూడదనే γίνομαι భావాన్ని నిలుపుతుంది.
- source_word: καθώς τινες αὐτῶν
  choice: వారిలో కొందరిలా
  rationale: అరణ్యకాల ఇశ్రాయేలీయులలో కొందరి ఉదాహరణతో చేసిన పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὥσπερ γέγραπται
  choice: ఇలా వ్రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే స్థిరమైన సూత్రాన్ని, వ్రాతగా కొనసాగి ఉన్నదనే పరిపూర్ణకాల భావంతో తెలుగులో సహజంగా అందిస్తుంది.
- source_word: Ἐκάθισεν ὁ λαὸς
  choice: ప్రజలు … కూర్చున్నారు
  rationale: సమూహవాచకమైన ὁ λαόςను తెలుగులో సహజమైన బహువచన క్రియతో అందిస్తుంది.
- source_word: φαγεῖν καὶ πεῖν
  choice: తినడానికి, తాగడానికి
  rationale: జతగా ఉన్న రెండు ఉద్దేశార్థక క్రియారూపాలను నేరుగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: ἀνέστησαν
  choice: లేచారు
  rationale: కూర్చోవడం నుంచి లేవడాన్ని సూచించే కథన కదలికను సహజంగా నిలుపుతుంది.
- source_word: παίζειν
  choice: ఆటలాడడానికి
  rationale: ప్రాథమికంగా ‘ఆడడం’ అనే అర్థాన్ని నిలుపుతూ, విగ్రహారాధన విందుతో ముడిపడిన ఉల్లాసవేడుక భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
theological_decisions:
- issue: నిర్గమకాండము 32:6 ఉల్లేఖనంలోని παίζεινను ఎంత స్పష్టంగా వ్యాఖ్యానించాలి
  choice: ప్రధాన పాఠ్యంలో ‘ఆటలాడడానికి’ అని ఉంచి, సందర్భంలోని ఉల్లాసవేడుక భావాన్ని పాదసూచికలో ఇవ్వడం
  alternative: ‘ఉల్లాసంగా వేడుక చేసుకోవడానికి’ లేదా ‘విచ్చలవిడిగా సంబరపడడానికి’
  rationale: ఈ పదం మూలార్థంగా ఆటను సూచించినా, బంగారు దూడ చుట్టూ జరిగిన విగ్రహారాధన విందు సందర్భంలో ఉల్లాసవేడుక భావాన్ని కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యం ఉల్లేఖనంలోని పదసంబంధ అస్పష్టతను కాపాడుతుంది; పాదసూచిక సందర్భబలాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. లేఖన ఉల్లేఖనానికి స్వల్పమైన గంభీరతను ఉంచుతూ, అసహజమైన పదశః నిర్మాణాలను నివారించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘ఆటలాడడానికి’ అన్న పదానికే జతచేశాం.
