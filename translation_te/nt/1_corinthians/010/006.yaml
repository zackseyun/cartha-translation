  revision_rationale: ‘అయ్యాయి’ ἐγενήθησαν యొక్క ‘మాదిరులుగా మారాయి/అయ్యాయి’ అనే భావాన్ని కాపాడుతుంది. ‘మనము ... ఉండకుండుటకు’ εἰς τὸ μὴ εἶναι యొక్క ఉద్దేశాత్మక హెచ్చరికను సహజంగా వ్యక్తం చేస్తుంది; ‘వారు ... ఆశించినట్లే’ అనేది పోలికను స్పష్టంగా కలుపుతుంది. ‘చెడ్డవాటిని ఆశించేవారిగా’ ద్వారా వ్యక్తివాచక నామరూపం, అలాగే గ్రీకులోని పదపునరుక్తి నిలుస్తాయి.
