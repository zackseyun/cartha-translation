id: 1CO.10.6
reference: 1 Corinthians 10:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: te
  text: ఈ సంగతులు మనకు మాదిరులుగా[a] అయ్యాయి; వారు చెడ్డవాటిని ఆశించినట్లే, మనం చెడ్డవాటిని ఆశించేవారిగా ఉండకుండుటకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతిరూపాలుగా”; లేదా, “నమూనాలుగా.”
    reason: τύποι అనే గ్రీకు పదానికి సందర్భంలో సాధ్యమైన ఇతర అర్థాలను తెలియజేయడం.
lexical_decisions:
- source_word: Ταῦτα
  choice: ఈ సంగతులు
  rationale: అరణ్యంలో ఇంతకుముందు వివరించిన సంఘటనలను సూచించే నపుంసక బహువచన సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప మార్పు లేదా వివరణను సూచిస్తుంది; తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని తెలియజేస్తుంది. స్పష్టమైన కాలార్థక ‘ఇప్పుడు’ను చేర్చలేదు.
- source_word: τύποι ἡμῶν
  choice: మనకు మాదిరులుగా
  rationale: ఇక్కడ గత సంఘటనలు విశ్వాస సమాజానికి హెచ్చరికనిచ్చే నమూనాలు. ‘మాదిరులు’ నైతిక బోధనార్థాన్ని సహజంగా తెలియజేస్తుంది; ‘ప్రతిరూపాలు’ అనే సాంకేతిక భావాన్ని బలవంతంగా మోపదు.
- source_word: ἐγενήθησαν
  choice: జరిగాయి
  rationale: ఈ సంగతులు సంభవించి మనకు మాదిరులుగా పనిచేశాయనే భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: εἰς τὸ μὴ εἶναι ἡμᾶς
  choice: మనం ... ఉండకూడదని ఇలా జరిగింది
  rationale: గ్రీకు నిర్మాణంలోని ఉద్దేశం/ఫలితం మధ్యనున్న స్వల్ప అస్పష్టతను పూర్తిగా ఒక వైపుకు తేల్చకుండా, హెచ్చరిక ఉద్దేశాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπιθυμητὰς κακῶν
  choice: చెడ్డవాటిని ఆశించేవారిగా
  rationale: వ్యక్తులను సూచించే నామవాచక రూపాన్ని నిలుపుతూ, κακῶνను ఆశకు గురైన చెడ్డ విషయాలుగా చూపిస్తుంది. ‘కామించు’ అనడం అర్థాన్ని లైంగిక కోరికకు అనవసరంగా కుదిస్తుంది.
- source_word: καθὼς κἀκεῖνοι ἐπεθύμησαν
  choice: వారు ... ఆశించినట్లుగా
  rationale: అరణ్య తరానికి, ప్రస్తుత పాఠకులకు మధ్య పోలికను మరియు ἐπιθυμητάς–ἐπεθύμησαν మధ్య పదబంధ సంబంధాన్ని ‘ఆశించు’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: τύποι అనే పదం ఇశ్రాయేలు అరణ్య అనుభవాలకు సంబంధించిన అర్థం
  choice: నైతిక హెచ్చరికను ఇచ్చే ‘మాదిరులు’
  alternative: ప్రతిరూపాలు; నమూనాలు
  rationale: సమీప సందర్భం సంఘానికి హెచ్చరికను ప్రధానంగా ఉంచుతుంది. సాంకేతికమైన సిద్ధాంతపరమైన ప్రతిరూపార్థాన్ని మాత్రమే నిర్బంధించకుండా గ్రీకు పదపు విస్తృతిని కాపాడుతుంది.
- issue: ἐπιθυμία పదకుటుంబపు తీవ్రత మరియు పరిధి
  choice: ఆశించు
  alternative: అత్యాశపడు; కామించు
  rationale: ఇక్కడ పాపపూరిత కోరిక విస్తృతార్థంలో ఉంది; అది లైంగిక కోరికకే పరిమితం కాదు. ఒకే తెలుగు మూలపదాన్ని వాడటం గ్రీకులోని పదపునరుక్తిని కూడా నిలుపుతుంది.
- issue: εἰς τὸ నిర్మాణంలో ఉద్దేశం లేదా ఫలితం
  choice: ఉద్దేశం/ఫలితం రెండింటికీ వీలున్న హెచ్చరికాత్మక నిర్మాణం
  alternative: కేవలం ‘మనము ... కాకుండుటకు’ అనే స్పష్ట ఉద్దేశార్థం
  rationale: గ్రీకు నిర్మాణం ఉద్దేశం మరియు ఫలితం రెండింటినీ సూచించగలదు; తెలుగు వాక్యం హెచ్చరికాత్మక ఉద్దేశాన్ని స్పష్టంగా ఉంచినా ఆ ఉద్రిక్తతను పూర్తిగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలి. గ్రీకు వ్యక్తివాచక నామరూపాన్ని ‘ఆశించేవారిగా’ అని నిలుపుతూ, అతిగా కఠినమైన పదశః రూపాన్ని నివారించింది.
