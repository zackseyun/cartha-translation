- from: ఈ సంగతులు మనకు మాదిరులుగా[a] జరిగాయి; వారు చెడ్డవాటిని ఆశించినట్లుగా మనం వాటిని ఆశించేవారిగా ఉండకూడదని ఇలా జరిగింది.
