- from: అయితే ఎవరైనా మీతో, “ఇది బలిగా అర్పించబడినది[a]” అని చెబితే, ఆ విషయం తెలిపిన వ్యక్తిని బట్టి, మనస్సాక్షిని బట్టి దాన్ని తినకండి.[b]
