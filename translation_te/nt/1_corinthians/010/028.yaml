id: 1CO.10.28
reference: 1 Corinthians 10:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: te
  text: అయితే ఎవరైనా మీతో, “ఇది బలిగా అర్పించబడింది[a]” అని చెబితే, ఆ విషయం తెలిపిన వ్యక్తి కోసం, మనస్సాక్షి కోసం దానిని తినకండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది బలి మాంసం.” గ్రీకు విశేషణం బలిలో అర్పించబడిన దానిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, మీ సొంత మనస్సాక్షిని కాదు, ఆ ఇతర వ్యక్తి మనస్సాక్షిని బట్టి; తరువాతి వచనం చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: అయితే ఎవరైనా మీతో ... అని చెబితే
  rationale: ἐὰνతో కూడిన subjunctive షరతును సహజమైన తెలుగు షరతు నిర్మాణంతో వ్యక్తం చేశాం. δέ మునుపటి సందర్భానికి వ్యత్యాసాన్ని సూచించేందుకే ‘అయితే’; τις యొక్క అనిర్దిష్ట భావానికి ‘ఎవరైనా’ సరిపోతుంది.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: ఇది బలిగా అర్పించబడినది
  rationale: ἱερόθυτος బలిలో అర్పించబడిన దానిని సూచిస్తుంది. మూలపదంలో లేని ‘విగ్రహానికి’ అనే వివరాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, ఆహారాన్ని సూచించే తెలుగు ఏకవచన రూపాన్ని వాడాం.
- source_word: μὴ ἐσθίετε
  choice: దాన్ని తినకండి
  rationale: μήతో ఉన్న వర్తమాన ఆజ్ఞార్థక నిషేధాన్ని మర్యాదపూర్వక బహువచన నిషేధంగా ఇచ్చాం; సందర్భంలోని ఆహారాన్ని సూచించేందుకు ‘దాన్ని’ చేర్చాం.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: ఆ విషయం తెలిపిన వ్యక్తిని బట్టి
  rationale: διά + accusative ఇక్కడ ఆ వ్యక్తిపట్ల పరిగణన లేదా అతని నిమిత్తం అనే భావాన్ని ఇస్తుంది. μηνύσαντα యొక్క ‘తెలియజేసిన’ భావాన్ని సహజంగా ‘తెలిపిన వ్యక్తి’ అని వ్యక్తం చేశాం.
- source_word: καὶ τὴν συνείδησιν
  choice: మనస్సాక్షిని బట్టి
  rationale: సమాంతర సంబంధాన్ని కొనసాగిస్తూ συνείδησιςను సాధారణ ఆధునిక తెలుగు పదమైన ‘మనస్సాక్షి’గా అనువదించాం. అది ఎవరి మనస్సాక్షో ప్రధాన పాఠ్యంలో ముందుగానే నిర్ధారించకుండా ఉంచాం.
theological_decisions:
- issue: τὴν συνείδησιν ఎవరి మనస్సాక్షిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘మనస్సాక్షి’ అని మాత్రమే ఉంచి, అది సమాచారం తెలిపిన ఇతర వ్యక్తిదని పాదసూచికలో వివరించడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘ఆ వ్యక్తి మనస్సాక్షిని బట్టి’ అని స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం ఈ వచనంలో యజమానిని పేర్కొనదు; తదుపరి వచనం అది తన మనస్సాక్షి కాదు, ఇతరునిదని వివరిస్తుంది. కాబట్టి పౌలు వాక్యప్రవాహంలోని తాత్కాలిక అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, సమీప సందర్భపు వివరణను పాదసూచికలో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘బలిగా అర్పించబడినది’ మూలంలోని ఆరాధనా సందర్భాన్ని నిలుపుతూ, మూలపదంలో ప్రత్యక్షంగా లేని ‘విగ్రహం’ అనే పదాన్ని చేర్చదు. [a], [b] గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
