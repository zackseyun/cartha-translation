id: 1CO.10.27
reference: 1 Corinthians 10:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: te
  text: అవిశ్వాసులలో ఎవరైనా మిమ్మల్ని ఆహ్వానిస్తే, మీరు వెళ్లాలని అనుకుంటే, మనస్సాక్షి నిమిత్తం[b] ఏమీ విచారించకుండా[a] మీ ముందు వడ్డించినదంతా తినండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏదీ పరిశీలించకుండా” లేదా “ఏమీ అడగకుండా.” ఇక్కడ భావం ఆహారం ఎక్కడి నుంచి వచ్చిందో విచారణ చేయకపోవడం.
    reason: lexical_alternative
  - marker: b
    text: ‘మనస్సాక్షి’ ఎవరిదనే విషయాన్ని తరువాతి వచనం స్పష్టం చేస్తుంది; అక్కడ పౌలు ఎదుటి వ్యక్తి మనస్సాక్షిని మీ సొంత మనస్సాక్షి నుంచి వేరుచేస్తాడు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: అవిశ్వాసుల్లో
  rationale: ఈ బహువచన రూపం ఇక్కడ క్రైస్తవ విశ్వాసానికి వెలుపల ఉన్న వ్యక్తులను సూచిస్తుంది. ‘అవిశ్వాసులు’ సంక్షిప్తంగా ఉండి, మూలంలోని అంతర్గతులు–బాహ్యులు అనే భేదాన్ని అనవసరమైన ప్రతికూలత లేకుండా నిలుపుతుంది.
- source_word: καλεῖ
  choice: ఆహ్వానిస్తే
  rationale: భోజన సందర్భంలో καλέω అంటే కేవలం ‘పిలుచుట’ కాక, భోజనానికి ఆహ్వానించుట.
- source_word: θέλετε πορεύεσθαι
  choice: మీరు వెళ్లాలని అనుకుంటే
  rationale: ఆహ్వానాన్ని అంగీకరించి వెళ్లే ఇష్టాన్ని, షరతుతో కూడిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: మీ ముందు వడ్డించినదంతా
  rationale: భోజనంలో వారికి అందించే ఆహారమంతటినీ సూచిస్తుంది; ‘వడ్డించినది’ సందర్భాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: ἐσθίετε
  choice: తినండి
  rationale: వర్తమాన ఆజ్ఞారూపంలోని సాధారణ నిర్దేశాన్ని తెలుగులో సహజమైన గౌరవ బహువచన ఆజ్ఞగా అందిస్తుంది.
- source_word: μηδὲν ἀνακρίνοντες
  choice: ఏమీ విచారించకుండా
  rationale: ἀνακρίνωకు పరిశీలించుట, విచారించుట, ప్రశ్నించుట అనే భావాలు ఉన్నాయి. ఇక్కడ ఆహారం ఎక్కడి నుంచి వచ్చిందో దర్యాప్తు చేయవద్దనే ఆచరణాత్మక భావాన్ని ‘విచారించకుండా’ నిలుపుతుంది.
- source_word: διὰ τὴν συνείδησιν
  choice: మనస్సాక్షి నిమిత్తం
  rationale: διά + accusative ఇక్కడ కారణం లేదా పరిగణనను సూచిస్తుంది. ఈ పదబంధం తదుపరి వచనంలోని వివరణను ముందుగానే నిర్ణయించకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో συνείδησις ఎవరి మనస్సాక్షిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘మనస్సాక్షి’ అని మాత్రమే ఉంచి, అది ఎవరిదో ఈ వచనంలో నిర్ధారించలేదు.
  alternative: విశ్వాసి సొంత మనస్సాక్షి అని లేదా ఆహ్వానించిన/తెలియజేసిన మరొకరి మనస్సాక్షి అని స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం ఇక్కడ మనస్సాక్షి ఎవరిదో చెప్పదు; తరువాతి వచనం దాన్ని మరింత వివరిస్తుంది. అందువల్ల ఈ వచనంలోని ఉద్దేశపూర్వక సంక్షిప్తతను, వ్యాఖ్యాన ఉద్రిక్తతను అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బహువచన సంబోధన వాడబడింది. వాక్య ప్రవాహం కోసం కారణసూచక పదబంధాన్ని ఆజ్ఞకు ముందు ఉంచినా, అది ‘విచారించకుండా’ అనే నిర్దేశంతో సంబంధం కలిగి ఉండేలా నిర్మాణం ఉంచబడింది.
