source:
  edition: SBLGNT
  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: te
  text: మాంసపు అంగడిలో అమ్మే దేనినైనా తినండి; మనస్సాక్షి నిమిత్తం ఏమీ ఆరా తీయకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఏ విచారణా చేయకండి,’ ‘ఏమీ పరిశీలించకండి’; మాంసం నేపథ్యం గురించి దర్యాప్తు చేయవద్దన్నది భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: అమ్మే దేనినైనా
  rationale: నపుంసకలింగ విశేషణార్థక పదబంధంలోని సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν μακέλλῳ
  choice: మాంసపు అంగడిలో
  rationale: μάκελλον సాధారణ బజారును కాక ప్రత్యేకంగా మాంసం అమ్మే అంగడిని సూచిస్తుంది; సందర్భంలోని విగ్రహార్పిత మాంసం ప్రశ్నకు ఈ నిర్దిష్టత ముఖ్యమైనది.
- source_word: ἐσθίετε
  choice: తినండి
  rationale: వర్తమానకాల క్రియాత్మక ఆజ్ఞార్థక బహువచన రూపాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: μηδὲν ἀνακρίνοντες
  choice: ఏమీ ఆరా తీయకండి
  rationale: ఇక్కడ ἀνακρίνω మాంసం ఎక్కడి నుంచి వచ్చిందో విచారించడం లేదా ప్రశ్నించడం అనే ఆచరణాత్మక భావాన్ని ఇస్తుంది.
- source_word: διὰ τὴν συνείδησιν
  choice: మనస్సాక్షి నిమిత్తం
  rationale: διά + ద్వితీయా విభక్తి తెలిపే కారణం లేదా ఉద్దేశ సంబంధాన్ని వ్యక్తం చేస్తూ, అది ఎవరి మనస్సాక్షో ఈ వచనంలోనే నిర్ధారించదు.
theological_decisions:
- issue: ‘మనస్సాక్షి’ ఎవరిని సూచిస్తుంది?
  choice: ‘మనస్సాక్షి’ అని సాధారణంగానే ఉంచడం
  alternative: ‘మీ మనస్సాక్షి’ లేదా ‘ఇతరుని మనస్సాక్షి’ అని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠంలో ‘మనస్సాక్షి’ అని మాత్రమే ఉంది. తరువాతి సందర్భం వివరించే వరకు దాని సూచనను అనువాదంలో ముందుగానే నిర్ణయించకుండా మూలంలోని అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన శైలి. ‘మాంసపు అంగడి’ నిర్దిష్ట ప్రదేశాన్ని, ‘ఆరా తీయకండి’ సందర్భానుకూలమైన విచారణ భావాన్ని సహజంగా తెలియజేస్తాయి.
