source:
  edition: SBLGNT
  text: καὶ πάντες εἰς τὸν Μωϋσῆν ⸀ἐβαπτίσαντο ἐν τῇ νεφέλῃ καὶ ἐν τῇ θαλάσσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/002.yaml
  text: and all were baptized into Moses in the cloud and in the sea[b][a],
translation:
  language: te
  text: అందరూ మోషేలోనికి[a] మేఘంలోనూ సముద్రంలోనూ[b] బాప్తిస్మం పొందారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మోషేతో తమను తాము ఐక్యం చేసుకున్నారు,’ లేక ‘మోషేకు విధేయతలోకి వచ్చారు.’ గ్రీకులో అక్షరార్థంగా ‘మోషేలోనికి’ అని ఉంది; ఇది బాప్తిస్మంతో పౌలు చూపే రూపకసూచక సాదృశ్యాన్ని నిలుపుతుంది.
    reason: alternative_reading
  - marker: b
    text: పౌలు ‘సముద్రంలో’ అంటున్నాడు, ‘సముద్రం గుండా’ అని కాదు; ఆ విధంగా ‘మేఘంలో’ అనే మాటతో ఉన్న సమాంతరత నిలుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: అందరూ
  rationale: ఇక్కడ దృష్టిలో ఉన్న ఇశ్రాయేలీయులందరినీ సమష్టిగా సూచిస్తుంది; పరిసర వచనాల్లో పౌలు పదేపదే నొక్కిచెప్పే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: εἰς τὸν Μωϋσῆν
  choice: మోషేలోనికి
  rationale: అసాధారణమైన గ్రీకు నిర్మాణాన్ని, బాప్తిస్మ భాషతో పౌలు ఏర్పరచిన సాదృశ్యాన్ని వ్యాఖ్యానించి పరిష్కరించకుండా నిలుపుతుంది.
- source_word: ἐβαπτίσαντο
  choice: బాప్తిస్మం పొందారు
  rationale: గ్రీకు మధ్యమ రూపాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ఈ సందర్భంలోని స్థిరమైన బాప్తిస్మ సంబంధిత అర్థాన్ని కాపాడుతుంది; ‘తమకు తామే బాప్తిస్మం చేసుకున్నారు’ అని మధ్యమ వాచ్యాన్ని అతిగా నొక్కదు.
- source_word: ἐν τῇ νεφέλῃ
  choice: మేఘంలోనూ
  rationale: ἐν అనే విభక్త్యర్థాన్ని, నిర్గమకాండ దృశ్యాన్ని నిలుపుతూ, పరిధి/సాధనం/సహవాసం అనే సంభావ్య భావాలను ముందే నిర్ణయించదు.
- source_word: ἐν τῇ θαλάσσῃ
  choice: సముద్రంలోనూ
  rationale: గ్రీకులో διά కాక ἐν ఉన్నందున ‘సముద్రం గుండా’ అని మార్చకుండా, ‘మేఘంలో’ అనే సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలీయులు ‘మోషేలోనికి బాప్తిస్మం పొందారు’ అనే మాట అర్థం
  choice: రూపకసూచకమైన, ప్రాతినిధ్య సంబంధమైన భాషను వివరణతో ఒకే అర్థానికి పరిమితం చేయకుండా యథాతథంగా నిలుపడం.
  alternative: ‘మోషేతో ఏకీభవించారు’ లేదా ‘మోషేకు విధేయతలోకి వచ్చారు.’
  rationale: పౌలు ఇశ్రాయేలీయుల నిర్గమన అనుభవానికీ క్రైస్తవ బాప్తిస్మానికీ సాదృశ్యం చూపుతున్నాడు. అనువాదం ఈ ధార్మిక ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మోషేలోనికి’ ఉద్దేశపూర్వకంగా అసాధారణంగానే ఉంచి మూలంలోని ధార్మిక, రూపకసూచక ఉద్వేగాన్ని కాపాడాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
