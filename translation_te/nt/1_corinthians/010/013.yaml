id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: te
  text: మానవులకు సాధారణమైనదే తప్ప ఏ శోధన కూడా మీకు ఎదురుకాలేదు.[a] అయితే దేవుడు నమ్మకమైనవాడు. మీరు భరించగలిగినదానికంటే మించి శోధించబడటానికి ఆయన మిమ్మల్ని అనుమతించడు. మీరు దానిని భరించగలిగేలా, ఆ శోధనతోపాటే బయటపడే మార్గాన్నీ ఆయన సమకూరుస్తాడు.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవ సంబంధమైనదే తప్ప” లేదా “మానవులందరికీ సాధారణమైనదే తప్ప.”
    reason: lexical_alternative
  - marker: b
    text: ఈ వాక్యంలో “శోధన,” “శోధించబడటం” అనే పదాలను “పరీక్ష,” “పరీక్షించబడటం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “తప్పించుకునే దారిని” లేదా “పరిణామాన్ని.” దేవుడు సమకూర్చేది శోధనను భరించడానికి వీలు కలిగిస్తుందని ఈ పదబంధం నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: శోధన / శోధించబడటం
  rationale: ఈ పదాలు పాపం వైపు లాగే శోధనను, అలాగే పరీక్ష లేదా కష్టస్థితిని సూచించగలవు. ముందున్న విగ్రహారాధన, దుష్ట కోరికల హెచ్చరికల దృష్ట్యా ప్రధాన పాఠంలో ‘శోధన’ ఎంచుకున్నాం; విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: εἴληφεν
  choice: పట్టుకోలేదు
  rationale: పరిపూర్ణ కాలరూపం వారిపై వచ్చి పట్టుకున్న అనుభవాన్ని సూచిస్తుంది; ‘పట్టుకోలేదు’ సహజమైన తెలుగులో ఆ భావాన్ని నిలుపుతుంది.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: మానవులకు సాధారణంగా కలిగేదే తప్ప
  rationale: ἀνθρώπινος అంటే మానవ సంబంధమైనది లేదా మానవులకు సాధారణమైనది; శోధన అసాధారణమైనదో మానవాతీతమైనదో కాదనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πιστός
  choice: నమ్మదగినవాడు
  rationale: దేవుని విశ్వసనీయతను తెలిపే πιστόςను ఆధునిక సహజ తెలుగులో ‘నమ్మదగినవాడు’గా ఇచ్చాం; ‘నమ్మకమైనవాడు’ కూడా సాధ్యమే.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: మీరు తట్టుకోగలిగినదానికంటే మించి
  rationale: సామర్థ్యపు హద్దును సూచించే గ్రీకు భావాన్ని, సందర్భంలో భరించే సామర్థ్యంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ποιήσει
  choice: కలిగిస్తాడు
  rationale: ποιέω అక్షరార్థంగా ‘చేస్తాడు/కలుగజేస్తాడు’; ἔκβασιςతో కలిసి దేవుడు మార్గాన్ని సమకూర్చే క్రియాశీలతను ‘కలిగిస్తాడు’ తెలియజేస్తుంది.
- source_word: ἔκβασιν
  choice: బయటపడే మార్గం
  rationale: ἔκβασις బయటికి వెళ్లే దారి, తప్పించుకునే మార్గం, లేదా పరిణామం అని అర్థమవుతుంది. సహించడమే లక్ష్యమని తరువాతి పదబంధం చూపుతున్నందున, కేవలం వెంటనే తొలగింపును సూచించని ‘బయటపడే మార్గం’ ఎంచుకున్నాం.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: మీరు దానిని సహించగలిగేలా
  rationale: ఆర్టిక్యులర్ ఇన్ఫినిటివ్ ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; ὑποφέρω అంటే భారాన్ని మోస్తూ నిలవడం, సహించడం.
theological_decisions:
- issue: πειρασμός పదానికి నైతిక శోధన లేదా విస్తృత పరీక్ష అనే అర్థం
  choice: ప్రధాన పాఠంలో ‘శోధన’
  alternative: ‘పరీక్ష’ లేదా ‘కష్టం’
  rationale: తక్షణ సందర్భంలో పాపపు కోరికలు, విగ్రహారాధనపై హెచ్చరికలు ఉన్నందున నైతిక శోధన భావం ముందుంటుంది. అయినా గ్రీకు పదంలోని పరీక్ష అనే విస్తృత అర్థాన్ని పాదసూచికలో నిలిపాం; దేవుడే పాపానికి ప్రేరేపిస్తాడనే నిర్ణయాన్ని పాఠంలో చేర్చలేదు.
- issue: ἔκβασις దేవుని సమకూర్పు ఎలా పనిచేస్తుందనే భావం
  choice: ‘బయటపడే మార్గం’ అని అనువదించి, అది సహించడానికి తోడ్పడుతుందని వాక్య నిర్మాణంలో నిలిపాం
  alternative: ‘తప్పించుకునే దారి’ లేదా ‘పరిణామం’
  rationale: వాక్యం శోధన వెంటనే తొలగిపోతుందని కాక, దేవుని సమకూర్పువల్ల దానిని సహించగలరని చెబుతుంది. అందువల్ల బయటపడటం మరియు సహించడం మధ్యనున్న ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘శోధన’ బైబిలు సందర్భంలో పరిచితమైనదైనా ఇప్పటికీ అర్థవంతమైన పదం. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం; భావసంబంధాన్ని ‘అయితే,’ ‘తోపాటు,’ ‘గలిగేలా’ ద్వారా నిలిపాం.
