revisions:
- from: మానవులకు సాధారణంగా కలిగేదే తప్ప మరే శోధనా మిమ్మల్ని పట్టుకోలేదు.[a] అయితే దేవుడు నమ్మదగినవాడు. మీరు తట్టుకోగలిగినదానికంటే మించి శోధించబడటానికి ఆయన మిమ్మల్ని అనుమతించడు. మీరు దానిని సహించగలిగేలా, ఆ శోధనతోపాటు బయటపడే మార్గాన్ని కూడా ఆయన కలిగిస్తాడు.[b][c]
  to: మానవులకు సాధారణమైనదే తప్ప ఏ శోధన కూడా మీకు ఎదురుకాలేదు.[a] అయితే దేవుడు నమ్మకమైనవాడు. మీరు భరించగలిగినదానికంటే మించి శోధించబడటానికి ఆయన మిమ్మల్ని అనుమతించడు. మీరు దానిని భరించగలిగేలా, ఆ శోధనతోపాటే బయటపడే మార్గాన్నీ ఆయన సమకూరుస్తాడు.[b][c]
  rationale: The revision keeps the draft’s meaning and its appropriately cautious treatment of πειρασμός while improving natural modern Telugu and closer semantic links within the verse. ‘నమ్మకమైనవాడు’ represents God’s πιστός as faithful/reliable; ‘సమకూరుస్తాడు’ naturally renders God’s active provision of ἔκβασις; and ‘భరించగలిగిన/భరించగలిగేలా’ preserves the relation of ability to endurance. Footnote markers and all three corresponding notes are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:03:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the verse’s central assertions: the experience is human/common to humanity, God is faithful, God does not permit it beyond the readers’ capacity, and God provides an accompanying way out so they can endure. A few wording adjustments improve the rendering of ἀνθρώπινος, πιστός, and ποιήσει/ἔκβασις without narrowing the lexical ambiguity of πειρασμός.'
  naturalness: The draft is generally clear modern Telugu. ‘మానవులకు సాధారణంగా కలిగేదే’ is somewhat heavier than necessary, and ‘బయటపడే మార్గాన్ని ... కలిగిస్తాడు’ is less idiomatic than ‘బయటపడే మార్గాన్నీ సమకూరుస్తాడు.’ ‘నమ్మకమైనవాడు’ is also the more established natural biblical-register equivalent for πιστός.
  terminology: ‘శోధన’ appropriately preserves the moral-temptation sense in context, while footnote b correctly retains ‘పరీక్ష’ as an alternative. ‘భరించగలిగిన’ and ‘భరించగలిగేలా’ better maintain the deliberate verbal connection between δύνασθε and ὑπενεγκεῖν. No doctrinal conclusion beyond the Greek is introduced.
  issues:
  - severity: low
    issue: The opening expression is slightly cumbersome.
    rationale: ‘మానవులకు సాధారణంగా కలిగేదే’ is understandable, but ‘మానవులకు సాధారణమైనదే’ more directly reflects ἀνθρώπινος and reads more naturally.
  - severity: low
    issue: The verb for God’s provision of the way out is not fully idiomatic.
    rationale: In this collocation, ‘మార్గాన్ని కలిగిస్తాడు’ is less natural Telugu than ‘మార్గాన్నీ సమకూరుస్తాడు,’ which clearly expresses ποιήσει without asserting that the trial is removed.
  - severity: low
    issue: The capacity/endurance wording can be made more internally coherent.
    rationale: Using ‘భరించగలిగిన’ for the capacity limit and ‘భరించగలిగేలా’ for the purpose retains the Greek’s relation between δύνασθε and ὑπενεγκεῖν more clearly.
  revised_text: మానవులకు సాధారణమైనదే తప్ప ఏ శోధన కూడా మీకు ఎదురుకాలేదు.[a] అయితే దేవుడు నమ్మకమైనవాడు. మీరు భరించగలిగినదానికంటే మించి శోధించబడటానికి ఆయన మిమ్మల్ని అనుమతించడు. మీరు దానిని భరించగలిగేలా, ఆ శోధనతోపాటే బయటపడే మార్గాన్నీ ఆయన సమకూరుస్తాడు.[b][c]
