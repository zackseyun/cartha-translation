revisions:
- from: శరీర సంబంధమైన ఇశ్రాయేలును గమనించండి:[a] బలులను తినేవారు బలిపీఠంలో భాగస్వాములు కారా?[b]
  to: శరీరానుసారమైన ఇశ్రాయేలును గమనించండి:[a] బలులను తినేవారు బలిపీఠంతో భాగస్వామ్యం కలిగినవారు కారా?[b]
  rationale: The revision preserves Paul’s marked κατὰ σάρκα wording in the text, with contextual alternatives in the footnote. It also replaces a potentially misleading locative expression for κοινωνοὶ τοῦ θυσιαστηρίου with an idiomatic Telugu relational expression, while the footnote records closer alternate renderings. No doctrinal conclusion beyond the verse’s sacrificial analogy is added.
  reviewer_model: gpt-5.6-terra
