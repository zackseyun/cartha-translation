id: 1CO.10.18
reference: 1 Corinthians 10:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βλέπετε τὸν Ἰσραὴλ κατὰ σάρκα· ⸀οὐχ οἱ ἐσθίοντες τὰς θυσίας κοινωνοὶ τοῦ θυσιαστηρίου εἰσίν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: te
  text: శరీరానుసారమైన ఇశ్రాయేలును గమనించండి:[a] బలులను తినేవారు బలిపీఠంతో భాగస్వామ్యం కలిగినవారు కారా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహజ వంశసంబంధమైన ఇశ్రాయేలు’ లేదా ‘జాతిపరమైన ఇశ్రాయేలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బలిపీఠపు భాగస్వాములు’ లేదా ‘బలిపీఠంలో పాలుపొందేవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: గమనించండి
  rationale: ఇది బహువచన ఆజ్ఞారూపం. కేవలం కళ్లతో చూడమని కాక, పౌలు చేస్తున్న వాదనలోని ఉదాహరణను ఆలోచనతో పరిశీలించమనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: శరీర సంబంధమైన ఇశ్రాయేలు
  rationale: κατὰ σάρκα అనే పౌలు వాడిన స్పష్టమైన ‘శరీర’ భాషను నిలుపుతూ, ఇక్కడ సహజ వంశసంబంధమైన ఇశ్రాయేలును సూచిస్తుందని తెలియజేస్తుంది; దానిని ‘పాప స్వభావం’గా అర్థం చేసుకోకుండా ఉంటుంది.
- source_word: οἱ ἐσθίοντες τὰς θυσίας
  choice: బలులను తినేవారు
  rationale: సుబంతంగా వాడిన వర్తమాన కృదంతాన్ని సహజంగా అనువదిస్తూ, ‘తినడం’ అనే నిర్దిష్ట క్రియను అలాగే నిలుపుతుంది.
- source_word: κοινωνοὶ τοῦ θυσιαστηρίου
  choice: బలిపీఠంలో భాగస్వాములు
  rationale: κοινωνοί తెలియజేసే నిజమైన భాగస్వామ్యాన్ని, బలిపీఠానికి సంబంధించిన బలి ఆచారంలో పాలుపొందడాన్ని వ్యక్తం చేస్తుంది. గ్రీకు షష్ఠీ విభక్తి సంబంధంలోని కొంత అస్పష్టతను ప్రత్యామ్నాయాలతో పాదసూచికలో ఉంచింది.
- source_word: οὐχ ... εἰσίν;
  choice: కారా?
  rationale: οὐχ ఆశించే సమ్మతిసూచక జవాబును తెలుగులో సహజమైన అలంకారప్రశ్న రూపంలో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘శరీర సంబంధమైన ఇశ్రాయేలు’ అనే మాట యొక్క అర్థం
  choice: సహజ వంశసంబంధమైన లేదా జాతిపరమైన ఇశ్రాయేలు
  alternative: కేవలం బాహ్య దృష్టిలో కనిపించే ఇశ్రాయేలు
  rationale: ఈ సందర్భంలో ఈ పదబంధం బలి ఆచారాన్ని ఉదాహరణగా చూపుతూ సహజ వంశసంబంధమైన ఇశ్రాయేలును సూచిస్తుంది. అయితే ఇశ్రాయేలు, సంఘం మధ్య విస్తృతమైన సిద్ధాంత సంబంధాన్ని అనువాదం స్వయంగా నిర్ణయించదు.
- issue: బలిపీఠంతో భాగస్వామ్య స్వభావం
  choice: బలిపీఠానికి సంబంధించిన బలి ఆచారంలో నిజంగా పాలుపొందడం
  alternative: బలిపీఠమే ఒక వ్యక్తిలా ఉండి దానితో భాగస్వామ్యం కలిగి ఉండడం
  rationale: κοινωνοί మరియు షష్ఠీ విభక్తి బలిపీఠంతో గాఢమైన సంబంధం లేదా దాని పరిధిలో భాగస్వామ్యాన్ని సూచిస్తాయి. వ్యక్తీకరణను అతిగా విస్తరించకుండా మూలంలోని సంబంధాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘శరీర సంబంధమైన’ అనే రూపం పౌలు వాడిన σάρξ భాషను నిలుపుతుంది; పాదసూచిక దాని సందర్భార్థాన్ని స్పష్టం చేస్తుంది. అలంకారప్రశ్నకు ఆశించబడే సమ్మతిసూచక భావం ‘కారా?’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
