  text: and all ate the same spiritual food[a]
translation:
  language: te
  text: మరియు అందరూ ఒకే ఆధ్యాత్మిక ఆహారాన్ని తిన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతీంద్రియ ఆహారం’; ఈ పదబంధం బహుశా అరణ్యంలోని మన్నాను సూచిస్తుంది; సందర్భంలో దీనికి మాదిరి లేదా ప్రతిరూప సంబంధమైన ప్రాధాన్యం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అలాగే
  rationale: ముందటి వాక్యంతో ఈ వాక్యాన్ని అనుసంధానించే సముచ్చయార్థం సందర్భంలో ఉంది; అయితే స్వతంత్ర వచనంగా సహజంగా చదవడానికి దాని భావాన్ని వాక్యప్రవాహంలో అంతర్లీనంగా ఉంచి ప్రధాన పాఠంలో ప్రత్యేకంగా వ్యక్తం చేయలేదు.
- source_word: πάντες
  choice: అందరూ
  rationale: ఇశ్రాయేలు సమూహమంతటినీ సూచించే బహువచన రూపం; సంపూర్ణతపై ఉన్న ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸ αὐτὸ
  choice: ఒకే
  rationale: ఆహారం అందరికీ ఒకటే అనే సమానత్వం/ఏకత్వ భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πνευματικὸν
  choice: ఆత్మసంబంధమైన
  rationale: పౌలు వాడిన πνευματικός పదంలోని ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది; కేవలం ‘అద్భుతమైనది’ అని గానీ, నేరుగా ‘ఆత్మ ఇచ్చినది’ అని గానీ భావాన్ని కుదించదు.
- source_word: βρῶμα
  choice: ఆహారం
  rationale: సాధారణంగా తినే ఆహారాన్ని సూచించే నేరమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: ἔφαγον
  choice: తిన్నారు
  rationale: గతంలో జరిగిన చర్యను తెలిపే aorist indicative రూపానికి సహజమైన తెలుగు భూతకాల అనువాదం.
theological_decisions:
- issue: అరణ్య సందర్భంలో ‘ఆత్మసంబంధమైన ఆహారం’ అనే పదబంధం యొక్క అర్థం
  choice: ప్రధాన పాఠంలో ‘ఆత్మసంబంధమైన ఆహారం’ అని ఉంచడం
  alternative: దేవుడు ఇచ్చిన మన్నా; ఆత్మ ఇచ్చిన ఆహారం; ప్రభువు భోజనానికి పూర్వసూచన
  rationale: సందర్భం అరణ్యంలో లభించిన మన్నాను సూచించే అవకాశం ఉన్నప్పటికీ, పౌలు ఉపయోగించిన భాషకు రూపకాలంకార/పూర్వసూచక బలం కూడా ఉండవచ్చు. ఏ ఒక్క వివరణనూ పాఠ్యంలో ఖరారు చేయకుండా మూలంలోని వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆత్మీయమైన’ అనే పదం వ్యక్తిగత భక్తి లేదా సన్నిహితత్వం అనే ఆధునిక అర్థాన్ని కలిగించగలదు కాబట్టి, మూలంలోని πνευματικός భావానికి మరింత కచ్చితంగా ‘ఆత్మసంబంధమైన’ ఎంచుకోబడింది. వచనాంతంలో పాదటిప్పణి సూచిక [a] స్పష్టంగా ఉంచబడింది.
