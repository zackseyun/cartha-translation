translation:
  language: te
  text: వివేకం గలవారితో మాట్లాడినట్లు నేను మీతో మాట్లాడుతున్నాను; నేను చెప్పేదాన్ని మీరే నిర్ణయించండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: …వారితో మాట్లాడినట్లు
  rationale: పౌలు తన శ్రోతలను ఏ విధంగా సంబోధిస్తున్నాడో సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: φρονίμοις
  choice: వివేకం గలవారు
  rationale: ఆచరణాత్మక జ్ఞానం, మంచి నిర్ణయశక్తి అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘జ్ఞానులు’ కంటే అతిశయింపకుండా ఉంటుంది.
- source_word: λέγω
  choice: నేను మాట్లాడుతున్నాను
  rationale: సంబోధించి మాట్లాడుతున్న భావాన్ని ఈ సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: κρίνατε
  choice: నిర్ణయించండి
  rationale: విన్న విషయాన్ని పరిశీలించి ఒక నిర్ధారణకు రావాలనే ఆజ్ఞార్థక పిలుపును తెలియజేస్తుంది.
- source_word: ὑμεῖς
  choice: మీరే
  rationale: మూలంలోని స్పష్టమైన, ఉద్ఘాటనాత్మక సర్వనామాన్ని తెలుగులో ‘ఏ’ నొక్కుతో నిలుపుతుంది.
- source_word: ὅ
  choice: దాన్ని
  rationale: ‘నేను చెప్పేది’ మొత్తాన్ని నిర్ణయించవలసిన అంశంగా సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: φημι
  choice: నేను చెప్పేది
  rationale: λέγωతో ఉన్న పదభేదాన్ని సాధ్యమైనంతవరకు ‘మాట్లాడు/చెప్పు’ అనే భేదంతో నిలుపుతుంది.
theological_decisions:
- issue: శ్రోతల వివేకాన్ని గురించి పౌలు చేసిన సంబోధన
  choice: కొరింథీయులు వివేచించి నిర్ణయించగలవారిగా పౌలు వారిని సంబోధిస్తున్నట్లు అనువదించబడింది.
  alternative: ఇది వ్యంగ్యంగా ‘జ్ఞానులు’ అని చెప్పడం కావచ్చు; లేదా వారిని నేరుగా జ్ఞానులుగా ప్రశంసించడం కావచ్చు.
  rationale: మూల వాక్యం వ్యంగ్యమా, సంపూర్ణ ప్రశంసా అని స్పష్టంగా తేల్చదు. ‘వివేకం గలవారు’ సానుకూలమైనదే అయినా మితమైన పదప్రయోగం; అందువల్ల ఆ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. మూలంలోని రెండు వాక్య భాగాలు మరియు ὑμεῖς యొక్క ఉద్ఘాటన నిలుపబడ్డాయి.
