id: 1CO.10.22
reference: 1 Corinthians 10:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ παραζηλοῦμεν τὸν κύριον; μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/022.yaml
  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: te
  text: లేక మనం ప్రభువుకు అసూయ కలిగిస్తున్నామా? మనం ఆయనకంటే బలవంతులం కాదు కదా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: రోషం పుట్టిస్తున్నామా
  rationale: ఈ క్రియలో మరొకరితో సంబంధం పెట్టుకోవడం ద్వారా అసూయతో కూడిన రోషాన్ని రేపడం అనే భావం ఉంది. సందర్భంలో విగ్రహారాధన ద్వారా ప్రభువును రెచ్చగొట్టడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸν κύριον
  choice: ప్రభువుకు
  rationale: κύριος అనే సాధారణ నూతన నిబంధన సంబోధనను సందర్భానుగుణ దత్తి నిర్మాణంతో అనువదించింది; మూలంలో లేని ప్రత్యేక నామాన్ని చేర్చలేదు.
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: ఆయనకంటే బలవంతులం
  rationale: తులనాత్మక విశేషణం మరియు αὐτοῦ యొక్క తులనార్థక సంబంధాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రభువు పట్ల παραζηλόω యొక్క భావం
  choice: రోషం పుట్టించడం
  alternative: అసూయ పుట్టించడం
  rationale: దైవిక అసూయ అనే భావాన్ని తొలగించకుండా, తెలుగులో తప్పుగా చిన్నమనసుతో కూడిన ఈర్ష్యగా వినిపించే అవకాశాన్ని తగ్గిస్తూ నిబంధన విశ్వాసభంగంపై కలిగే రోషాన్ని వ్యక్తం చేస్తుంది.
- issue: రెండవ ప్రశ్న యొక్క ఊహిత సమాధానం
  choice: మనం ఆయనకంటే బలవంతులం కాము కదా?
  alternative: నిశ్చయంగా మనం ఆయనకంటే బలవంతులం కాదు, అవునా?
  rationale: μή తో ప్రారంభమైన గ్రీకు ప్రశ్న ఆశించే ప్రతికూల సమాధానాన్ని తెలుగు ప్రశ్నార్థక నిర్మాణంలో సహజంగా, కానీ వాక్యంలోని వాక్చాతుర్యాన్ని ప్రకటనగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన వాక్యరచన. రెండు అలంకారిక ప్రశ్నలనూ అలాగే ఉంచి, సాధారణ పాఠకునికి సహజంగా వినిపించే రూపాలు ఎంచుకున్నాం.
