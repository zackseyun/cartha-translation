  edition: SBLGNT
  text: μηδεὶς τὸ ἑαυτοῦ ζητείτω ἀλλὰ τὸ τοῦ ⸀ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: te
  text: ఎవరూ తన సొంత మేలును వెదకకూడదు, కాని మరొకరి మేలును వెదకాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఎవరూ తన సొంతదాన్ని వెదకకూడదు, కాని మరొకరిదాన్ని వెదకాలి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς
  choice: ఎవరూ ... కూడదు
  rationale: నిషేధార్థక సాధారణ కర్తను, మూడవ పురుష ఆజ్ఞార్థక క్రియతో కలిపి, సహజమైన ఆధునిక తెలుగులో సాధారణ నిషేధంగా వ్యక్తపరుస్తుంది.
- source_word: ζητείτω
  choice: వెదకాలి / వెదకకూడదు
  rationale: ζητέω యొక్క ‘వెదుకు, సాధించడానికి ప్రయత్నించు’ అనే విస్తృత భావాన్ని నిలుపుతుంది; తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా నిషేధ భాగంలో ‘వెదకకూడదు,’ వ్యతిరేక భాగంలో అంతర్నిహిత క్రియను ‘వెదకాలి’గా స్పష్టం చేశాం.
- source_word: τὸ ἑαυτοῦ
  choice: తన సొంత మేలును
  rationale: గ్రీకులోని ‘తనది’ అనే సంక్షిప్త ప్రయోగంలో కర్మ అంతర్నిహితంగా ఉంది. సందర్భం ఇతరుల ప్రయోజనాన్ని కోరడాన్ని సూచిస్తున్నందున ‘మేలు’ అని పూరించడం భావాన్ని సహజంగా తెలియజేస్తుంది; పాదటిప్పణిలో అక్షరార్థాన్ని ఉంచాం.
- source_word: ἀλλὰ
  choice: ; ...
  rationale: తెలుగులో వ్యతిరేకతను రెండవ విధేయ ఆజ్ఞతో సహజంగా వ్యక్తపరచేందుకు సెమీకోలన్‌తో నిర్మాణాత్మక విరుద్ధతను చూపాం; ‘కాని’ అనీ అనువదించవచ్చు.
- source_word: τὸ τοῦ ἑτέρου
  choice: ఎదుటివారి మేలును
  rationale: ἕτερος ఇక్కడ తనకు భిన్నమైన ‘మరొక వ్యక్తి’ని సూచిస్తుంది. ‘ఎదుటివారు’ సాధారణ ఆధునిక తెలుగులో ఆ ఇతర వ్యక్తిని స్పష్టంగా, లింగనిరపేక్షంగా సూచిస్తుంది.
theological_decisions:
- issue: τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου అనే సంక్షిప్త పదబంధాల్లో అంతర్నిహిత కర్మను పూరించడం
  choice: ప్రధాన పాఠ్యంలో ‘తన సొంత మేలు ... ఎదుటివారి మేలు’ అని వ్యక్తపరచడం
  alternative: ‘తన సొంతదాన్ని ... ఎదుటివారిదాన్ని’ అని మరింత అక్షరార్థంగా అనువదించడం
  rationale: మూల గ్రీకు కర్మను స్పష్టంగా చెప్పకపోయినా, 1 కొరింథీయులు 10:23–33 సందర్భం తన ప్రయోజనంకన్నా ఇతరుని ప్రయోజనాన్ని కోరడాన్ని సూచిస్తుంది. ‘మేలు’ అని పూరించడం నైతిక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; అయితే మూలంలోని నిజమైన సంక్షిప్తతను పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనా గౌరవప్రదమైన శైలి. ‘ఎదుటివారి’ అనే రూపం లింగనిరపేక్షంగా మరొక వ్యక్తిని సూచిస్తుంది.
