revisions:
- from: ఎవరూ తన సొంత మేలును వెదకకూడదు; ఎదుటివారి మేలును వెదకాలి.[a]
  to: ఎవరూ తన సొంత మేలును వెదకకూడదు, కాని మరొకరి మేలును వెదకాలి.[a]
  rationale: The revision explicitly translates ἀλλά with ‘కాని’ and replaces the potentially spatial/plural ‘ఎదుటివారి’ with singular ‘మరొకరి,’ which more closely reflects τοῦ ἑτέρου. It retains ‘మేలు’ as a contextually warranted supplementation while preserving the source’s ellipsis in the footnote.
