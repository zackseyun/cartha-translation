  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: te
  text: ఎందుకంటే భూమి మరియు దానిలోని సమస్తమూ ప్రభువివే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కీర్తన 24:1 నుండి ఉల్లేఖనం. ‘దానిలో ఉన్న సమస్తమూ’ అనే మాటలను మరింత అక్షరార్థంగా ‘దాని సంపూర్ణత’ అని కూడా అనువదించవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: ప్రభువివే
  rationale: τοῦ κυρίου అనే సంబంధ విభక్తి ఇక్కడ యాజమాన్యాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘ప్రభువివే’ అని చెప్పడం ‘ప్రభువుకు చెందినవే’ అనే భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ లేఖన వాక్యం ఆధారాన్ని ఇస్తున్నందున, కారణసంబంధాన్ని సహజంగా చూపడానికి ‘ఎందుకంటే’ ఉపయోగించబడింది.
- source_word: γῆ
  choice: భూమి
  rationale: కీర్తన ఉల్లేఖనంలో πλήρωμα αὐτῆςతో కలిసి ఇది ఒక ప్రాంతాన్ని మాత్రమే కాక మొత్తం భూమిని సూచిస్తుంది.
- source_word: πλήρωμα
  choice: దానిలో ఉన్న సమస్తమూ
  rationale: ఇక్కడ πλήρωμα అనేది భూమిని నింపినదంతా లేదా దానిలో ఉన్న సమస్తాన్ని సూచిస్తుంది. ‘సంపూర్ణత’ కంటే ఈ రూపం ఆధునిక తెలుగు పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది; అయినా మూలంలోని సమగ్రతను నిలుపుతుంది.
- source_word: αὐτῆς
  choice: దానిలో
  rationale: స్త్రీలింగ సర్వనామం γῆను తిరిగి సూచిస్తుంది. πλήρωμα భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి స్థానార్థకమైన ‘దానిలో’ ఉపయోగించబడింది.
theological_decisions:
- issue: లేఖన ఉల్లేఖనంలో κύριοςకు దైవసంబంధమైన బరువు ఉంది
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: పౌలు వాడిన గ్రీకు పాఠంలో κύριος ఉంది. అందువల్ల పాత నిబంధనలోని దైవనామాన్ని నేరుగా చేర్చకుండా, కొత్త నిబంధన గ్రీకు రూపాన్ని అనుసరించి ‘ప్రభువు’ అని అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని యాజమాన్య భావాన్ని సహజ తెలుగు బహువచన సమన్వయంతో ‘ప్రభువివే’గా వ్యక్తం చేసింది.
