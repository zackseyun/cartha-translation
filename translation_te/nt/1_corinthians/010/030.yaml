id: 1CO.10.30
reference: 1 Corinthians 10:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ἐγὼ χάριτι μετέχω, τί βλασφημοῦμαι ὑπὲρ οὗ ἐγὼ εὐχαριστῶ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/030.yaml
  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: te
  text: నేను కృతజ్ఞతతో భుజిస్తే[a], దేనికోసం నేను కృతజ్ఞతలు చెల్లిస్తున్నానో, దాని కారణంగా నన్నెందుకు దూషిస్తున్నారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను కృపవల్ల భుజిస్తే, దేనికోసం నేను కృతజ్ఞతలు చెల్లిస్తున్నానో, దాని కారణంగా నన్నెందుకు దూషిస్తున్నారు?” గ్రీకు పదం χάριτιకి “కృపవల్ల” అనే అర్థం కూడా ఉండవచ్చు. అయితే తర్వాత వచ్చే “కృతజ్ఞతలు చెల్లిస్తున్నాను” అనే మాటను బట్టి, ఈ సందర్భంలో చాలామంది దాన్ని “కృతజ్ఞతతో” అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: కృతజ్ఞతతో
  rationale: భోజన సందర్భం మరియు వెంటనే వచ్చే εὐχαριστῶ (‘కృతజ్ఞతలు చెల్లిస్తున్నాను’) అనే పదం దృష్ట్యా, ఇక్కడ కృతజ్ఞతతో భుజించడం అనే భావం సహజంగా వ్యక్తమవుతుంది. అయితే ‘కృపవల్ల’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: μετέχω
  choice: భుజిస్తే
  rationale: క్రియకు ప్రాథమికంగా ‘పాలుపంచుకోవడం’ అనే భావం ఉన్నప్పటికీ, తక్షణ సందర్భం ఆహారం తినడం గురించినది కాబట్టి ఆధునిక తెలుగులో ‘భుజిస్తే’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: βλασφημοῦμαι
  choice: నన్నెందుకు దూషిస్తున్నారు
  rationale: ఇక్కడ దేవదూషణ భావం కాకుండా, పౌలు భుజించే ఆహారం కారణంగా అతనికి వ్యతిరేకంగా అవమానకరంగా మాట్లాడడమే ఉద్దేశం. తెలుగులో కర్తను పేర్కొనని బహువచన ప్రయోగం గ్రీకు కర్మణి భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὑπὲρ οὗ
  choice: దాని కారణంగా
  rationale: నిందకు ఆధారం లేదా కారణాన్ని సూచించే సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εὐχαριστῶ
  choice: కృతజ్ఞతలు చెల్లిస్తున్న
  rationale: గ్రీకులో కృతజ్ఞత ఎవరికి చెల్లించబడుతుందో స్పష్టంగా పేర్కొనలేదు; కాబట్టి ‘దేవునికి’ అని పాఠ్యంలో చేర్చకుండా మూలంలోని సూచితత్వాన్ని నిలిపాం.
- source_word: ἐγὼ ... ἐγὼ
  choice: నేను ... నేను
  rationale: రెండుసార్లు స్పష్టంగా వచ్చిన గ్రీకు సర్వనామంలోని ఉద్ఘాటనను తెలుగులోనూ నిలిపాం.
- source_word: τί
  choice: ఎందుకు
  rationale: ఈ అలంకార ప్రశ్నలో τί కారణాన్ని ప్రశ్నిస్తూ ‘ఎందుకు?’ అనే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: భోజనం మరియు కృతజ్ఞతతో సంబంధించి χάριτι పద భావం
  choice: కృతజ్ఞతతో
  alternative: కృపవల్ల
  rationale: తర్వాత వచ్చే ‘కృతజ్ఞతలు చెల్లిస్తున్నాను’ అనే మాట తక్షణ సందర్భంలో కృతజ్ఞత అనే భావానికి బలమిస్తుంది. ‘కృపవల్ల’ అని ప్రధాన పాఠ్యంలో పెడితే రక్షణ సంబంధమైన ప్రత్యేక వేదాంత భావాన్ని అనవసరంగా సూచించే అవకాశం ఉంది; అయినా ఆ నిజమైన పదార్థ అవకాశాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ఆహార సందర్భంలో ‘పాలుపంచుకుంటే’ కంటే ‘భుజిస్తే’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది. ‘నన్నెందుకు దూషిస్తున్నారు?’ అనే కర్తలేని బహువచన నిర్మాణం గ్రీకు కర్మణి ప్రయోగాన్ని సహజ తెలుగులో అందిస్తుంది.
