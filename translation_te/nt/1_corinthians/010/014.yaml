  edition: SBLGNT
  text: Διόπερ, ἀγαπητοί μου, φεύγετε ἀπὸ τῆς εἰδωλολατρίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: te
  text: కాబట్టి, నా ప్రియులారా, విగ్రహారాధన నుండి పారిపోండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విగ్రహపూజ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διόπερ
  choice: కాబట్టి
  rationale: ముందటి వాదన నుండి తీసుకున్న ముగింపును సూచించే అనుమానార్థక సంధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀγαπητοί μου
  choice: నా ప్రియులారా
  rationale: ఆప్యాయమైన ప్రత్యక్ష సంబోధనను, పౌలు వాడే సన్నిహితమైన గౌరవభావాన్ని నిలుపుతుంది.
- source_word: φεύγετε
  choice: పారిపోండి
  rationale: వర్తమానకాల ఆజ్ఞారూపంలోని అత్యవసరతను, ప్రమాదం నుండి పూర్తిగా దూరమవ్వాలనే బలమైన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ
  choice: నుండి
  rationale: తప్పించుకోవలసిన దాని నుండి వేరుపడటాన్ని సూచించే సహజమైన తెలుగు విభక్తి రూపం.
- source_word: τῆς εἰδωλολατρίας
  choice: విగ్రహారాధన
  rationale: విగ్రహాలను పూజించడం లేదా సేవించడం అనే గ్రీకు పదార్థాన్ని సంక్షిప్తంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
theological_decisions:
- issue: నిషేధం యొక్క పరిధి
  choice: విగ్రహారాధనలోను దానితో ముడిపడిన ఆచారాలలోను పాల్గొనకుండా ఉండాలనే ప్రత్యక్ష ఆజ్ఞ
  alternative: విగ్రహాల పట్ల అంతరంగ భక్తిని మాత్రమే విడిచిపెట్టాలనే సంకుచిత హెచ్చరిక
  rationale: సమీప సందర్భంలో పౌలు అన్యదేవతా ఆరాధనకు సంబంధించిన భోజనాలు, ఆచారాలలో పాల్గొనడం గురించి హెచ్చరిస్తున్నాడు. εἰδωλολατρία అనే పదం కేవలం అంతరంగ వైఖరిని కాక విగ్రహపూజ అనే విస్తృత భావాన్ని సూచిస్తుంది; అందువల్ల అనువాదం దాని పరిధిని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆప్యాయతతో కూడిన గౌరవప్రద సంబోధన, అలాగే ఆజ్ఞలోని అత్యవసరత నిలుపబడ్డాయి.
