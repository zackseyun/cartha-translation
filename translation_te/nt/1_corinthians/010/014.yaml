  verdict: revise
  source_fidelity: The main text accurately represents Διόπερ as an inference, preserves the affectionate plural vocative ἀγαπητοί μου, and renders the urgent plural imperative φεύγετε with appropriate force. “విగ్రహారాధన” faithfully conveys εἰδωλολατρία without artificially narrowing the warning.
  naturalness: The verse is clear and idiomatic in modern standard Telugu. “విగ్రహారాధన నుండి పారిపోండి” is suitably forceful for the imperative. The current footnote, however, is awkward and redundantly adds both “నుండి” and “దూరంగా” to an alternative that is meant to identify the lexical alternative.
  terminology: “విగ్రహారాధన” is an established and comprehensible equivalent for idolatry. The lexical alternative should be “విగ్రహపూజ,” corresponding directly to the English audit trail’s “idol worship.”
  issues:
  - severity: low
    issue: Footnote a does not cleanly give the intended lexical alternative.
    rationale: “విగ్రహపూజ నుండి దూరంగా పారిపోండి” is a paraphrastic restatement, not simply the alternate rendering of εἰδωλολατρία; it is also stylistically redundant. Replacing it with “విగ్రహపూజ” preserves the stated lexical-alternative function.
  revised_text: కాబట్టి, నా ప్రియులారా, విగ్రహారాధన నుండి పారిపోండి.[a]
