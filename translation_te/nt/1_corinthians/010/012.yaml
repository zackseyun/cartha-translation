lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందున్న హెచ్చరికాత్మక ఉదాహరణల నుంచి తీసుకున్న నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ δοκῶν
  choice: తాను ... అని అనుకునేవాడు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతంలోని ఏకవచన ప్రతినిధి భావాన్ని నిలుపుతుంది.
- source_word: ἑστάναι
  choice: నిలిచివున్నానని
  rationale: పరిపూర్ణ కాల క్రియారూపం సూచించే, నిలిచి ఉన్న స్థితిని వ్యక్తం చేస్తుంది; మూలంలో స్పష్టంగా లేని ‘స్థిరంగా’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: βλεπέτω
  choice: జాగ్రత్తపడాలి
  rationale: హెచ్చరికతో కూడిన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; నిరంతర అప్రమత్తత భావాన్నీ అందిస్తుంది.
- source_word: μὴ πέσῃ
  choice: పడిపోకుండా
  rationale: ఆజ్ఞ తరువాత వచ్చే ప్రతికూల ఉద్దేశం లేదా హెచ్చరికను సంక్షిప్తంగా తెలియజేస్తూ, ‘పడిపోవడం’ అనే మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘పడిపోవడం’ యొక్క స్వభావం
  choice: అర్థాన్ని నిర్దిష్టం చేయకుండా సాధారణంగా ‘పడిపోవడం’ అని ఉంచడం
  alternative: పాపంలో పడిపోవడం / తీర్పుకు గురికావడం / విశ్వాసం నుంచి తొలగిపోవడం
  rationale: సందర్భం ఇశ్రాయేలీయుల వైఫల్యాల వెలుగులో అతివిశ్వాసాన్ని హెచ్చరిస్తున్నా, πέσῃ అనే పదం ఏ ఒక్క నిర్దిష్ట అర్థానికీ పరిమితం కాదు. అందువల్ల మూలంలోని వేదాంతపరమైన ఉద్వేగాన్ని నిలిపాం.
- issue: ప్రతినిధి పుంలింగ ఏకవచనం
  choice: ‘అనుకునేవాడు’ అనే పుంలింగ ఏకవచన రూపం
  alternative: అనుకునేవారు / తాము నిలిచివున్నామని అనుకునే వ్యక్తి
  rationale: గ్రీకు వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉండి ప్రతినిధి భావంతో వాడబడింది; తెలుగు రూపం దానిని సహజంగా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గంభీరమైన హెచ్చరిక ధోరణిని నిలిపాం. ‘నిలిచివున్నాను’ మరియు ‘పడిపోవడం’ మధ్యనున్న రూపక సంబంధాన్ని కాపాడాం.
