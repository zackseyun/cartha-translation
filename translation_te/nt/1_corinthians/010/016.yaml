id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: te
  text: మనం ఆశీర్వదించే ఆశీర్వాదపు పానపాత్ర—అది మెస్సీయ రక్తంలో పాలుపంచుకోవడం కాదా? మనం విరిచే రొట్టె—అది మెస్సీయ శరీరంలో పాలుపంచుకోవడం కాదా?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాలుపొందడం”; సంప్రదాయంగా, “సహవాసం.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో క్రిస్టౌ (Christou), అంటే “అభిషిక్తుని”; ఇక్కడ “మెస్సీయ” అని అనువదించాం. సంప్రదాయంగా, “క్రీస్తు.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ποτήριον
  choice: పాత్ర
  rationale: సందర్భంలో పానపాత్రను సూచించే సహజమైన ఆధునిక తెలుగు పదం; ప్రత్యేకమైన తరువాతి ఆరాధనా సాంకేతిక పదజాలాన్ని రుద్దదు.
- source_word: τῆς εὐλογίας / ὃ εὐλογοῦμεν
  choice: దీవెన / దీవించే
  rationale: నామవాచకం, క్రియ మధ్యనున్న గ్రీకు పదపునరుక్తిని తెలుగులోనూ సాధ్యమైనంత స్పష్టంగా నిలుపుతుంది; కేవలం కృతజ్ఞత చెల్లించడం అనే అర్థానికి పరిమితం చేయదు.
- source_word: οὐχὶ
  choice: కాదా?
  rationale: అవును అనే సమాధానాన్ని ఆశించే అలంకారప్రశ్న రూపాన్నీ దాని బలాన్నీ సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: κοινωνία
  choice: పాలుపంచుకోవడం
  rationale: కేవలం సామాజిక సహవాసం కాకుండా నిజమైన భాగస్వామ్యం లేదా పాలుపొందడాన్ని తెలియజేస్తుంది; ప్రభుభోజన స్వరూపంపై తరువాతి సంప్రదాయాల ప్రత్యేక వివరణను ముందుగానే నిర్ణయించదు.
- source_word: τοῦ αἵματος
  choice: రక్తంలో
  rationale: సంబంధవిభక్తితో ఉన్న κοινωνία భావాన్ని తెలుగులో సహజంగా ‘రక్తంలో పాలుపంచుకోవడం’గా వ్యక్తం చేస్తూ, రక్తం అనే బలియాగ-నిబంధనాత్మక పదాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ అభిషిక్తుడనే బిరుదు భావాన్ని కలిగి ఉంది; అందువల్ల ‘మెస్సీయ’ అని అనువదించబడింది. పరిచితమైన ‘క్రీస్తు’ రూపం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: τὸν ἄρτον
  choice: రొట్టె
  rationale: ἄρτοςకు సాధారణమైన, సులభంగా అర్థమయ్యే తెలుగు సమానం; ఈ వచనం స్వయంగా ఒకే రొట్టెముద్ద అని నిర్దిష్టం చేయదు.
- source_word: ὃν κλῶμεν
  choice: మనం విరిచే
  rationale: ఆచరణలోని స్పష్టమైన క్రియను అదనపు వ్యాఖ్యానం లేకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τοῦ σώματος
  choice: శరీరంలో
  rationale: గ్రీకు పదంలోని క్రీస్తుశాస్త్రీయ, ప్రభుభోజన సంబంధమైన బరువును సిద్ధాంతపరంగా సంకుచితం చేయకుండా నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రభుభోజన సందర్భంలో κοινωνία అర్థం
  choice: పాలుపంచుకోవడం
  alternative: పాలుపొందడం; సహవాసం
  rationale: ఈ పదం మెస్సీయ రక్తం, శరీరంతో నిజమైన భాగస్వామ్యాన్ని సూచిస్తుంది. అయితే ఆ భాగస్వామ్యం ఏ విధంగా సంభవిస్తుందో అనువాదం నిర్ణయించదు; కేవలం ప్రతీకగా తగ్గించడాన్నీ, ఏదైనా తరువాతి సాంకేతిక సిద్ధాంతాన్ని చేర్చడాన్నీ నివారిస్తుంది.
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ ‘అభిషిక్తుడు’ అనే బిరుదు భావం సజీవంగా ఉన్నందున ‘మెస్సీయ’ ఎంచుకోబడింది; తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన ‘క్రీస్తు’ను ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గ్రీకులోని రెండు సమాంతర అలంకారప్రశ్నలను డాష్‌తో స్పష్టంగా చూపించాం. ‘దీవెన/దీవించే’ పదపునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, ప్రభుభోజనంపై ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ వాక్యంలో చేర్చలేదు.
