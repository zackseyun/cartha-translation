  to: దాని ద్వారా మీరు కూడా రక్షించబడుతూ ఉన్నారు[a]—నేను మీకు ఏ సందేశాన్ని సువార్తగా ప్రకటించానో, దానిని మీరు గట్టిగా పట్టుకొని ఉంటే[b]—మీరు వ్యర్థంగా విశ్వసించి ఉంటే తప్ప.
