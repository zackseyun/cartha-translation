  source_fidelity: 'సవరణ అవసరం ఉంది: ‘దాని ద్వారానే’లోని ‘నే’ గ్రీకులో లేని ‘మాత్రమే/కేవలం’ అనే పరిమితి భావాన్ని కలిగిస్తుంది. καὶకి తగిన ‘కూడా’ను స్పష్టంగా చేర్చాలి. అలాగే ἐκτὸς εἰ μὴను ‘...అయితే తప్ప’గా ఇవ్వడం మూలంలోని మినహాయింపు-హెచ్చరికను మరింత నేరుగా నిలుపుతుంది.'
