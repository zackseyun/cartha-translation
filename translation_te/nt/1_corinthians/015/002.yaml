id: 1CO.15.2
reference: 1 Corinthians 15:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ σῴζεσθε, τίνι λόγῳ εὐηγγελισάμην ὑμῖν, εἰ κατέχετε, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: te
  text: దాని ద్వారా మీరు కూడా రక్షించబడుతూ ఉన్నారు[a]—నేను మీకు ఏ సందేశాన్ని సువార్తగా ప్రకటించానో, దానిని మీరు గట్టిగా పట్టుకొని ఉంటే[b]—మీరు వ్యర్థంగా విశ్వసించి ఉంటే తప్ప.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రక్షించబడుతున్నారు.’ గ్రీకు వర్తమానకాలాన్ని కొనసాగుతున్న ప్రక్రియగా లేదా సాధారణ వర్తమానంగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నేను మీకు ఏ సందేశాన్ని సువార్తగా ప్రకటించానో దానిని మీరు గట్టిగా పట్టుకొని ఉంటే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: దాని ద్వారానే
  rationale: διά + షష్ఠీ విభక్తి సాధనాన్ని సూచిస్తుంది; ఇది 1వ వచనంలోని సువార్తను తిరిగి సూచిస్తుంది. ‘ద్వారానే’లోని ‘ఏ’ καί యొక్క బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σῴζεσθε
  choice: రక్షించబడుతూ ఉన్నారు
  rationale: వర్తమానకాల కర్మణి రూపం కొనసాగుతున్న ప్రక్రియను సూచించగలదు. ఈ అనువాదం ఆ భావాన్ని నిలుపుతూ, సంపూర్ణ సిద్ధాంత వ్యవస్థను వాక్యంలోకి చేర్చదు.
- source_word: τίνι λόγῳ
  choice: సందేశాన్ని
  rationale: λόγος ఇక్కడ పౌలు ప్రకటించిన సువార్తా విషయాన్ని సూచిస్తుంది. κατέχετεతో కలిసి ఉన్న దత్తివిభక్తి పదబంధాన్ని తెలుగులో సహజంగా కర్మవిభక్తితో వ్యక్తం చేశాం; ‘మాట’ కంటే ‘సందేశం’ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: εὐηγγελισάμην
  choice: సువార్తగా ప్రకటించిన
  rationale: ఈ క్రియ శుభవార్తను ప్రకటించడం అనే భావాన్ని కలిగివుంది. ‘సువార్తగా ప్రకటించిన’ మూలపదంలోని శుభవార్త భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: κατέχετε
  choice: గట్టిగా పట్టుకొని ఉంటే
  rationale: కొనసాగిస్తూ నిలుపుకోవడం లేదా దృఢంగా అంటిపెట్టుకోవడం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐκτὸς εἰ μὴ
  choice: లేకపోతే
  rationale: ఈ గ్రీకు నుడికారం మినహాయింపు లేదా ప్రతికూల ప్రత్యామ్నాయాన్ని ప్రవేశపెడుతుంది. తెలుగులో ఈ వాక్య నిర్మాణంలో ‘లేకపోతే’ సహజంగా ఉంటుంది.
- source_word: εἰκῇ
  choice: వ్యర్థంగానే
  rationale: ఫలితం లేకుండా, నిష్ఫలంగా అనే హెచ్చరికను సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιστεύσατε
  choice: విశ్వసించినట్టే
  rationale: అవిశ్వాసం నుండి విశ్వాసానికి వచ్చిన గత చర్యను సూచించే అఓరిస్ట్ భావాన్ని నిలుపుతుంది; ‘లేకపోతే’తో అనుసంధానించేందుకు తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా రూపాంతరం చేశాం.
theological_decisions:
- issue: σῴζεσθεలో రక్షణ యొక్క కాలాంశం
  choice: కొనసాగుతున్న భావంతో ‘రక్షించబడుతూ ఉన్నారు’
  alternative: సాధారణ వర్తమానంగా ‘రక్షించబడుతున్నారు’ లేదా ‘రక్షణ పొందుతున్నారు’
  rationale: గ్రీకు వర్తమాన కర్మణి రూపంలోని కొనసాగింపు అవకాశాన్ని స్పష్టంగా నిలుపుతుంది; రక్షణ, భరోసా, పట్టుదల గురించి ఏ ప్రత్యేక సిద్ధాంత నిర్ణయాన్నీ బలవంతంగా చేర్చదు.
- issue: εἰ κατέχετε అనే షరతు
  choice: నిజమైన షరతుగా ‘మీరు ... గట్టిగా పట్టుకొని ఉంటే’
  alternative: నిజ విశ్వాసానికి సాక్ష్యంగా వివరణాత్మకంగా మార్చడం లేదా షరతు నెరవేరిందని ముందే ఊహించడం
  rationale: పౌలు వాడిన షరతు రూపాన్ని యథాతథంగా నిలుపుతుంది; పట్టుదల గురించి మతశాఖాపరమైన వివరణను వాక్యంలోకి దిగుమతి చేయదు.
- issue: ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε యొక్క హెచ్చరిక
  choice: ‘లేకపోతే మీరు వ్యర్థంగానే విశ్వసించినట్టే’
  alternative: ‘మీ విశ్వాసం అసలైనది కాకపోతే’ అని సిద్ధాంతపరంగా వివరించడం
  rationale: మూలంలోని నిష్ఫల విశ్వాస హెచ్చరికను నిలుపుతూ, ఆ నిష్ఫలత స్వభావాన్ని అనువాదకుడు ముందుగానే నిర్ణయించడు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. కొనసాగుతున్న రక్షణ భావాన్నీ నిజమైన షరతునీ నిలిపి, మతశాఖాపరమైన వివరణలను నివారించాం.
