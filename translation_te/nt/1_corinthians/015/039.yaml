revisions:
- from: అన్ని జీవుల మాంసం ఒకే విధమైనది కాదు. మనుష్యుల మాంసం ఒక విధమైనది, జంతువులది మరొక విధమైనది, పక్షులది మరొక విధమైనది, చేపలది మరొక విధమైనది.
  to: అన్ని రకాల మాంసం ఒకే రకమైనది కాదు; మనుష్యుల మాంసం ఒక రకం, జంతువుల మాంసం మరో రకం, పక్షుల మాంసం మరో రకం, చేపలది మరో రకం.
  rationale: This revision removes an unstated interpretive addition, maintains the literal sense and rhetorical repetition of σάρξ, and preserves the Greek’s final ellipsis by rendering the last item as ‘చేపలది.’
