id: 1CO.15.39
reference: 1 Corinthians 15:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: te
  text: అన్ని రకాల మాంసం ఒకే రకమైనది కాదు; మనుష్యుల మాంసం ఒక రకం, జంతువుల మాంసం మరో రకం, పక్షుల మాంసం మరో రకం, చేపలది మరో రకం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὰρξ
  choice: మాంసం
  rationale: ఇక్కడ ఈ పదం పాప స్వభావాన్ని సూచించే రూపకాలంకార ప్రయోగం కాదు; మనుష్యులు, జంతువులు, పక్షులు, చేపలు అనే సృష్టిలోని జీవుల భౌతిక మాంసాన్ని సూచిస్తుంది. అందువల్ల ‘మాంసం’ మూలపదానికి ప్రత్యక్షమైన, సందర్భోచితమైన అనువాదం.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: అన్ని జీవుల మాంసం ఒకే విధమైనది కాదు
  rationale: గ్రీకు వాక్యంలోని వర్గభేదాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ‘జీవుల’ అనే పదం సందర్భం ద్వారా అంతర్లీనంగా ఉన్న పరిధిని స్పష్టం చేస్తుంది; ‘ఒకే విధమైనది కాదు’ అన్నది మాంసపు రకాల మధ్య భేదాన్ని కాపాడుతుంది.
- source_word: ἄλλη ... ἄλλη ... ἄλλη ... ἄλλη
  choice: ఒక విధమైనది ... మరొక విధమైనది ... మరొక విధమైనది ... మరొక విధమైనది
  rationale: ప్రతి జీవవర్గం మధ్య ఉన్న వ్యత్యాసాన్ని, అలాగే పౌలు వాడిన పునరుక్త లయను తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ἀνθρώπων
  choice: మనుష్యుల
  rationale: ఇది పురుషులను మాత్రమే కాక మానవులందరినీ సూచిస్తుంది.
- source_word: κτηνῶν
  choice: జంతువుల
  rationale: ఈ జాబితాలో భూమిమీద సంచరించే జంతువుల వర్గాన్ని సహజంగా సూచిస్తుంది; ‘పశువులు’ అని అనువదిస్తే పెంపుడు జంతువులకే పరిమితమైన భావం కలగవచ్చు.
- source_word: πτηνῶν
  choice: పక్షుల
  rationale: ఎగిరే జీవులను సూచించే గ్రీకు పదానికి ఈ సందర్భంలో సహజమైన వర్గనామం.
- source_word: ἰχθύων
  choice: చేపల
  rationale: గ్రీకు బహువచన వర్గార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పౌలు రచనలో σάρξ పదానికి అనువాదం
  choice: మాంసం
  alternative: శరీరం / స్వభావం
  rationale: పునరుత్థానం గురించిన విస్తృత సందర్భంలోనూ, ఈ వాక్యంలో పౌలు వివిధ జీవుల భౌతిక మాంసాన్ని పోలుస్తున్నాడు. కాబట్టి ‘పాప స్వభావం’ వంటి రూపకాలంకార భావాన్ని చేర్చకుండా ప్రత్యక్ష అర్థాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా వాక్య నిర్మాణం సహజీకరించబడింది. మూలంలోని వర్గాల వరుస, పునరుక్తి, భౌతిక ‘మాంసం’ అనే భావం నిలుపబడ్డాయి.
