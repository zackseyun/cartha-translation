revisions:
- from: కాబట్టి నేనైనా వారైనా, మేము ప్రకటించేది ఇదే; మీరు నమ్మిందీ ఇదే.[a]
  to: కాబట్టి, నేనైనా వారైనా, మేము ఇలాగే ప్రకటిస్తున్నాం, మీరు ఇలాగే నమ్మారు.[a]
  rationale: 'The revision preserves εἴτε … εἴτε, the inferential connector οὖν, and the repeated adverbial οὕτως in a direct parallel Telugu form. It also retains the Greek verbal tenses: present “మేము ... ప్రకటిస్తున్నాం” and past “మీరు ... నమ్మారు.” The context-based “ఇదే” interpretation is preserved in the footnote without making it the sole sense of the main text.'
