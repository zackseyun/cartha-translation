id: 1CO.15.11
reference: 1 Corinthians 15:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: te
  text: కాబట్టి, నేనైనా వారైనా, మేము ఇలాగే ప్రకటిస్తున్నాం, మీరు ఇలాగే నమ్మారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సందర్భంలోని సందేశాన్ని సూచిస్తూ: “మేము ప్రకటించేది ఇదే; మీరు నమ్మిందీ ఇదే.”'
    reason: οὕτως అనే పదం ప్రత్యక్షంగా “ఇలాగే/ఈ విధంగా” అని అర్థం ఇస్తుంది; అయితే సందర్భంలో ముందుగా సంగ్రహించిన సందేశాన్ని సూచించే భావం కూడా సాధ్యమే.
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: నేనైనా వారైనా
  rationale: పరస్పర ప్రత్యామ్నాయాలను చూపే గ్రీకు నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వచనాల్లోని పునరుత్థాన సాక్షుల చర్చనుంచి తీసుకున్న నిర్ధారణను సూచిస్తుంది.
- source_word: ἐκεῖνοι
  choice: వారు
  rationale: సందర్భంలో ముందుగా ప్రస్తావించబడిన ఇతర అపొస్తలులు లేదా సాక్షులను సూచిస్తుంది; అంతకంటే నిర్దిష్టమైన గుర్తింపును పాఠ్యంలో చేర్చదు.
- source_word: οὕτως ... οὕτως
  choice: ఇదే ... ఇదే
  rationale: ఇక్కడ ఈ పదాలు ప్రధానంగా ఇప్పుడే సంగ్రహించిన ప్రకటన విషయాన్ని తిరిగి సూచిస్తున్నట్లు సహజ తెలుగులో తెలియజేస్తూ, వాటి పునరుక్తిని కూడా నిలుపుతుంది; విధానార్థం కూడా సాధ్యమేనని పాదసూచిక తెలియజేస్తుంది.
- source_word: κηρύσσομεν
  choice: మేము ప్రకటించేది
  rationale: κηρύσσω లోని బహిరంగ ప్రకటన భావాన్ని తెలుగులో స్పష్టంగా ఇస్తుంది; ‘మేము’ పౌలును మరియు ఇతర ప్రకటకులను కలిపి సూచిస్తుంది.
- source_word: ἐπιστεύσατε
  choice: మీరు నమ్మిందీ
  rationale: కొరింథీయులు గతంలో ప్రకటిత సందేశాన్ని నమ్మిన చర్యను నేరుగా వ్యక్తం చేస్తుంది; మూలంలో లేని వివరణను జోడించదు.
theological_decisions:
- issue: అపొస్తలుల ప్రకటనలో ఏకత్వం
  choice: పౌలు ప్రకటించినా ఇతరులు ప్రకటించినా, ప్రకటిత సందేశం ఇదేననీ కొరింథీయులు నమ్మింది కూడా ఇదేననీ వాక్యం చెబుతున్నట్లు అనువదించబడింది.
  alternative: οὕτως ను విషయసూచకంగా కాక విధానసూచకంగా తీసుకొని, ‘మేము ఇలాగే ప్రకటిస్తున్నాం; మీరు ఇలాగే నమ్మారు’ అని అనువదించడం.
  rationale: పునరుక్తమైన οὕτως ముందటి సందర్భంలోని సువార్త విషయంతో ప్రకటనను, విశ్వాసాన్ని అనుసంధానిస్తుంది. అయితే దాని విధానార్థాన్ని పూర్తిగా తొలగించకుండా పాదసూచికలో ఉంచాం; పాఠ్యానికి మించిన సంఘశాస్త్ర సంబంధమైన వాదనను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘నేనైనా వారైనా’ అనే సంక్షిప్త నిర్మాణం గ్రీకు విరుద్ధ జంటను సహజంగా నిలుపుతుంది; సమాంతరమైన ‘ఇదే ... ఇదే’ మూలంలోని పునరుక్తిని ప్రతిబింబిస్తుంది.
