revisions:
- from: ఒక్క క్షణంలో, రెప్పపాటులో, చివరి బూర మోగినప్పుడు—బూర మోగుతుంది; అప్పుడు మృతులు నశించనివారిగా లేపబడతారు, మనం మార్చబడతాం.
  to: ఒక్క క్షణంలో[a], రెప్పపాటులో, చివరి బూర సమయంలో. ఎందుకంటే బూర మోగుతుంది; మృతులు క్షయరహితులుగా లేపబడతారు, మనం మార్చబడతాం.
  rationale: The revision separates the temporal reference to the last trumpet from the subsequent assertion that the trumpet will sound, preserving the Greek syntax and rhetorical sequence. It also replaces a broader expression for non-perishing with a term that specifically conveys freedom from decay. A translated lexical-alternative footnote is supplied and anchored to correspond with the English POB audit trail.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:05:51Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two suddenness expressions, the future passive resurrection, the explicit contrastive ‘we,’ and the final trumpet imagery. However, ‘చివరి బూర మోగినప్పుడు’ folds the following explanatory clause (‘for the trumpet will sound’) into the preceding temporal phrase. The Greek first says ‘at the last trumpet’ and then separately states that it will sound. ‘నశించనివారిగా’ is understandable but can suggest people who will not perish rather than the intended state of freedom from decay/corruption; ‘క్షయరహితులుగా’ more precisely represents ἄφθαρτοι.
  naturalness: ‘ఒక్క క్షణంలో’ and ‘రెప్పపాటులో’ are idiomatic modern Telugu. ‘చివరి బూర సమయంలో’ retains the source’s compact temporal phrase without prematurely making the trumpet sound. The revised wording remains dignified and readily intelligible.
  terminology: ‘బూర’ is an appropriate established rendering for σάλπιγξ. ‘మృతులు ... లేపబడతారు’ correctly preserves the passive resurrection expression without supplying an agent. ‘క్షయరహితులుగా’ is a natural, theologically non-sectarian rendering of ἄφθαρτοι. The footnote preserves the audit-trail lexical alternative for ἐν ἀτόμῳ.
  issues:
  - severity: medium
    issue: The phrase ‘చివరి బూర మోగినప్పుడు’ anticipates σαλπίσει in the prior clause.
    rationale: ἐν τῇ ἐσχάτῃ σάλπιγγι is followed by a distinct explanatory clause, σαλπίσει γάρ (‘for it/the trumpet will sound’). Rendering the first phrase as ‘when the last trumpet sounds’ obscures that clause boundary and creates unnecessary repetition.
  - severity: medium
    issue: ‘నశించనివారిగా’ is less exact for ἄφθαρτοι.
    rationale: The adjective denotes imperishability/incorruptibility, specifically freedom from decay. ‘క్షయరహితులుగా’ expresses this quality more directly in Telugu.
  revised_text: ఒక్క క్షణంలో[a], రెప్పపాటులో, చివరి బూర సమయంలో. ఎందుకంటే బూర మోగుతుంది; మృతులు క్షయరహితులుగా లేపబడతారు, మనం మార్చబడతాం.
  revised_footnotes:
