id: 1CO.15.52
reference: 1 Corinthians 15:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: te
  text: ఒక్క క్షణంలో[a], రెప్పపాటులో, చివరి బూర సమయంలో. ఎందుకంటే బూర మోగుతుంది; మృతులు క్షయరహితులుగా లేపబడతారు, మనం మార్చబడతాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కన్ను రెప్పపాటులో.” గ్రీకు నుడికారం అత్యంత ఆకస్మికతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: ఒక్క క్షణంలో
  rationale: ἄτομος అక్షరార్థంగా ‘విభజించలేనిది’ అని సూచించినా, ఇక్కడ అత్యంత స్వల్పమైన కాలాన్ని తెలియజేస్తుంది. ‘ఒక్క క్షణంలో’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: రెప్పపాటులో
  rationale: కంటి అత్యంత వేగమైన కదలికను సూచించే ఈ గ్రీకు నుడికారానికి ‘రెప్పపాటులో’ సహజమైన తెలుగు సమానార్థక నుడికారం; ఇది అకస్మాత్తుతనాన్నీ వేగాన్నీ నిలుపుతుంది.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: చివరి బూర మోగినప్పుడు
  rationale: ἐν ఇక్కడ కాలసంబంధ భావాన్ని కలిగి ఉంది. ‘చివరి’ ἐσχάτῃను నేరుగా ప్రతిబింబిస్తుంది; ‘బూర మోగినప్పుడు’ తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: σαλπίσει
  choice: బూర మోగుతుంది
  rationale: ఈ క్రియ బూర ఊదబడటం లేదా మోగటాన్ని సూచిస్తుంది. ముందున్న σάλπιγγι ఆధారంగా తెలుగులో కర్తను స్పష్టంగా చెప్పడం సహజం.
- source_word: οἱ νεκροὶ
  choice: మృతులు
  rationale: చనిపోయిన ప్రజలను సమూహంగా సూచించే substantival adjectiveకు ‘మృతులు’ సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: ἐγερθήσονται
  choice: లేపబడతారు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, పునరుత్థాన సందర్భంలోని ‘లేపబడటం’ అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἄφθαρτοι
  choice: నశించనివారిగా
  rationale: ἄφθαρτος క్షయం, చెడిపోవడం, నాశనం నుండి విముక్తమైన స్థితిని సూచిస్తుంది. వ్యక్తులను వర్ణించే ఈ సందర్భంలో ‘నశించనివారిగా’ సహజంగా సరిపోతుంది.
- source_word: ἡμεῖς
  choice: మనం
  rationale: గ్రీకులో స్పష్టంగా ఉన్న ప్రథమ పురుష బహువచన సర్వనామాన్ని ఉంచి, ‘మృతులు’తో ఉన్న వ్యత్యాసాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా కాపాడుతుంది.
- source_word: ἀλλαγησόμεθα
  choice: మార్చబడతాం
  rationale: ἀλλάσσω యొక్క భవిష్యత్ కర్మణి రూపాన్ని నేరుగా ప్రతిబింబిస్తూ, మార్పు స్వభావాన్ని అనవసరంగా వివరించదు.
theological_decisions:
- issue: చివరి బూరకు సంబంధించిన అంత్యకాల సూచన
  choice: చివరి బూర మోగినప్పుడు
  alternative: అంతిమ బూర మోగినప్పుడు
  rationale: గ్రీకు పాఠం ‘చివరి బూర’ అని మాత్రమే చెబుతుంది. ఏ ప్రత్యేక అంత్యకాల వ్యవస్థనూ అనువాదంలో చేర్చకుండా ఆ సూచనను యథాతథంగా ఉంచుతుంది.
- issue: పునరుత్థానంలో ‘మనం’ అనే పదం యొక్క పరిధి
  choice: మనం మార్చబడతాం
  alternative: అప్పుడు జీవించి ఉన్న మనం మార్చబడతాం
  rationale: గ్రీకులోని స్పష్టమైన ‘మనం’ అనే సర్వనామాన్ని నిలుపుతూ, దాని పరిధిని ఈ వాక్యంలోనే వ్యాఖ్యానాత్మకంగా విస్తరించకుండా ఉంచుతుంది.
- issue: పునరుత్థాన క్రియలోని కర్మణి భావం
  choice: మృతులు ... లేపబడతారు
  alternative: మృతులు లేస్తారు
  rationale: కర్మణి క్రియారూపాన్ని కాపాడుతుంది; అయితే వారిని ఎవరు లేపుతారో ఈ వాక్యం స్వయంగా స్పష్టంగా చెప్పనందున అనువాదం కూడా కర్తను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘రెప్పపాటులో’ సాధారణ పాఠకులకు వెంటనే అర్థమయ్యే నుడికారం. గ్రీకు వాక్యంలోని వేగవంతమైన క్రమాన్ని నిలుపేందుకు మొదటి మూడు కాలపదబంధాలను వరుసగా ఉంచి, తరువాతి వివరణకు దీర్ఘ విరామచిహ్నం వాడబడింది.
