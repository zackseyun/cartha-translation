  text: The last enemy to be abolished is death[a].
translation:
  language: te
  text: చివరిగా నిర్వీర్యం చేయబడే శత్రువు మరణం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చివరిగా నాశనం చేయబడే శత్రువు మరణం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατος
  choice: చివరిగా
  rationale: ఈ పదం వరుసలో చివరి స్థానాన్ని సూచిస్తుంది. పౌలు పేర్కొంటున్న శత్రువుల ఓటమి క్రమాన్ని సహజమైన తెలుగులో ‘చివరిగా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐχθρὸς
  choice: శత్రువు
  rationale: ఇది విరోధిని లేదా ప్రతికూల శక్తిని సూచిస్తుంది. మరణాన్ని వ్యక్తీకరించి చెప్పే సందర్భానికి ‘శత్రువు’ సహజంగా సరిపోతుంది.
- source_word: καταργεῖται
  choice: నిర్వీర్యం చేయబడే
  rationale: వర్తమాన కర్మణి రూపమైన ఈ క్రియ ఇక్కడ మరణం ప్రభావశూన్యం చేయబడటం లేదా దాని అధికారం అంతం చేయబడటాన్ని సూచిస్తుంది. ‘నిర్వీర్యం చేయబడే’ అనే అనువాదం పూర్తిగా ఉనికిలో లేకుండా చేయబడటం అనే భావాన్ని అనవసరంగా బలపరచకుండా మూలపద పరిధిని కాపాడుతుంది.
- source_word: ὁ θάνατος
  choice: మరణం
  rationale: నిర్దిష్టమైన, వ్యక్తీకరించబడిన చివరి శత్రువుగా మరణాన్ని సూచిస్తుంది; తెలుగులో ‘మరణం’ సహజమైన రూపం.
theological_decisions:
- issue: మరణం ఓడించబడటానికి సంబంధించి καταργεῖται అనువాదం
  choice: నిర్వీర్యం చేయబడే
  alternative: నాశనం చేయబడే
  rationale: పౌలు మరణం అనే శత్రువు అంతిమంగా ప్రభావరహితం కావడం గురించి చెబుతున్నాడు. ‘నిర్వీర్యం చేయబడే’ అనేది దాని అధికారం, కార్యశక్తి అంతం కావడాన్ని తెలియజేస్తూ, క్రియ సూచించేదానికంటే నిర్దిష్టమైన తాత్త్విక నిర్ణయాన్ని వాక్యంలోకి తేవదు. సాంప్రదాయబద్ధమైన ‘నాశనం చేయబడే’ కూడా సాధ్యమైన అనువాదం కనుక పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన శైలి. మూలంలోని సంక్షిప్తతను, మరణాన్ని శత్రువుగా వ్యక్తీకరించడాన్ని కాపాడింది.
