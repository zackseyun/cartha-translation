id: 1CO.15.19
reference: 1 Corinthians 15:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: te
  text: ఈ జీవితంలో మాత్రమే[a] మెస్సీయలో[b] నిరీక్షణ ఉంచుకున్నవారమైతే, మనుషులందరికన్నా మరింత జాలికి పాత్రులం[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ జీవితానికే.”
    reason: మూలంలోని ἐν τῇ ζωῇ ταύτῃను “ఈ జీవితానికే” అని కూడా అనువదించవచ్చు; μόνον యొక్క పరిధికి సంబంధించిన స్వల్ప నిర్మాణాత్మక భేదాన్ని ఇది ప్రతిబింబిస్తుంది.
  - marker: b
    text: లేదా, “క్రీస్తులో.” గ్రీకు బిరుదైన Χριστόςను “క్రీస్తు” లేదా “మెస్సీయ” అని అనువదించవచ్చు.
    reason: బిరుదుకు ప్రాచుర్యంలో ఉన్న ప్రత్యామ్నాయ అనువాదం.
  - marker: c
    text: లేదా, “మనుషులందరిలో అత్యంత జాలికి పాత్రులం.”
    reason: గ్రీకు తులనాత్మక రూపాన్ని తెలుగులో సందర్భానుసారంగా అత్యుత్తమార్థంతో కూడా వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: εἰ
  choice: …వారమైతే
  rationale: షరతును సూచించే εἰకి సహజమైన తెలుగు షరతార్థక క్రియారూపం.
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: ఈ జీవితానికే
  rationale: మόνονతో కలిసిన భావాన్ని సహజంగా వ్యక్తం చేస్తూ, నిరీక్షణ ఈ ప్రస్తుత జీవితానికే పరిమితమనే సందర్భార్థాన్ని తెలియజేస్తుంది; మరింత రూపసామ్యమైన ‘ఈ జీవితంలో మాత్రమే’ను పాదటిప్పణిలో ఉంచాం.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: ἐν అనే పౌలు వాడే సంబంధార్థక ప్రయోగాన్ని ‘లో’తో నిలిపి, Χριστός యొక్క బిరుదార్థాన్ని ‘మెస్సీయ’గా అనువదించాం.
- source_word: ἠλπικότες ἐσμὲν
  choice: నిరీక్షణ పెట్టుకున్నవారమైతే
  rationale: ఈ పరిభాషాత్మక పరిపూర్ణ కాలరూపం గతంలో ఉంచి ఇప్పటికీ కొనసాగుతున్న స్థిరమైన నిరీక్షణను సూచిస్తుంది; ‘పెట్టుకున్న’ ఆ కొనసాగుతున్న స్థితిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μόνον
  choice: ఏ
  rationale: ‘జీవితానికే’లోని ‘ఏ’ పరిమితిని—ఈ జీవితం మాత్రమే—స్పష్టంగా సూచిస్తుంది.
- source_word: ἐλεεινότεροι
  choice: ఎక్కువగా జాలికి పాత్రులం
  rationale: జాలిపడదగిన స్థితిని సూచించే తులనాత్మక విశేషణ భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: πάντων ἀνθρώπων
  choice: మనుషులందరికన్నా
  rationale: లింగభేదం లేకుండా మానవులందరినీ సూచిస్తూ గ్రీకు తులనాత్మక నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పౌలు వాడిన ἐν Χριστῷ అనే సూత్రప్రాయ ప్రయోగం
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: Χριστόςను పేరులా కాక బిరుదుగా అర్థం చేసుకునే వీలు ఇక్కడ ఉంది; అదే సమయంలో ἐνను తొలగించకుండా పౌలు వాక్యంలోని సంబంధార్థక, దైవశాస్త్రపరమైన ఉద్వేగాన్ని నిలిపాం.
- issue: క్రైస్తవ నిరీక్షణ పరిధి
  choice: నిరీక్షణ ఈ జీవితానికే పరిమితమనే షరతుగా అనువదించడం
  alternative: ఈ జీవితంలో మాత్రమే మనం మెస్సీయలో నిరీక్షణ పెట్టుకున్నవారమైతే
  rationale: పునరుత్థానం నిజం కాకపోతే నిరీక్షణ ప్రస్తుత జీవితానికే పరిమితమవుతుందనే వాదనను మాత్రమే తెలుపుతుంది; పరలోకం లేదా మరణానంతర జీవితం గురించి మూలంలో లేని వివరణను చేర్చదు.
- issue: ἐλεεινότεροι యొక్క తులనాత్మక బలం
  choice: మనుషులందరికన్నా ఎక్కువగా జాలికి పాత్రులం
  alternative: మనుషులందరిలో అత్యంత జాలికి పాత్రులం
  rationale: గ్రీకులోని తులనాత్మక రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; సందర్భానుసారమైన అత్యుత్తమార్థక వ్యక్తీకరణను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే పౌలు వాక్యంలోని గంభీరతను నిలిపే శైలి. ‘జాలికి పాత్రులం’ అనేది ‘దయనీయులం’ కంటే మూలంలోని ‘జాలిపడదగిన’ భావాన్ని నేరుగా తెలియజేస్తుంది.
