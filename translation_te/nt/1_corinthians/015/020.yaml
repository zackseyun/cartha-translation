  text: Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, ἀπαρχὴ τῶν ⸀κεκοιμημένων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: te
  text: కానీ ఇప్పుడు మెస్సీయ[a] మృతులలోనుండి లేపబడ్డాడు, నిద్రించినవారి[c] ప్రథమఫలముగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మెస్సీయ” అనే బిరుదును సంప్రదాయంగా “క్రీస్తు” అని కూడా అనువదిస్తారు.
    reason: alternative_reading
  - marker: b
    text: “ప్రథమఫలం” అంటే పంటలో మొదట దేవునికి అర్పించే భాగం; అది తరువాత వచ్చే పూర్తి పంటను ముందుగా సూచిస్తూ, దానికి హామీ ఇస్తుంది.
    reason: cultural_note
  - marker: c
    text: “నిద్రించినవారు” అనేది చనిపోయినవారిని సూచించే రూపకం, ముఖ్యంగా పునరుత్థాన సందర్భంలో.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: అయితే ఇప్పుడు
  rationale: ముందటి ఊహాత్మక వాదనకు విరుద్ధంగా, ఇప్పుడు నిజంగా ఉన్న పరిస్థితిని బలంగా తెలియజేస్తుంది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ అభిషిక్తుని సూచించే బిరుదుగా ఉంది; అందువల్ల అర్థాన్ని అనువదిస్తూ ‘మెస్సీయ’ అని ఇచ్చాం.
- source_word: ἐγήγερται
  choice: లేపబడ్డాడు
  rationale: గ్రీకు పరిపూర్ణకాల కర్మణి రూపం పూర్తయిన కార్యాన్నీ దాని కొనసాగుతున్న ఫలితాన్నీ సూచిస్తుంది; కర్తను ప్రత్యేకంగా పేర్కొనకుండా కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: బహువచనంలోని ‘చనిపోయినవారి మధ్యనుండి’ అనే పునరుత్థాన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀπαρχὴ
  choice: ప్రథమఫలం
  rationale: పంటలో మొదట దేవునికి అర్పించే భాగాన్ని సూచించే రూపకాన్ని నిలుపుతుంది; తరువాత వచ్చే సంపూర్ణ పంటకు ఇది ఆరంభం మరియు హామీ అనే భావం ఉంది.
- source_word: τῶν κεκοιμημένων
  choice: నిద్రించినవారికి
  rationale: మరణించినవారిని సూచించే గ్రీకు నిద్ర రూపకాన్ని, ముఖ్యంగా పునరుత్థాన సందర్భంలోని దాని భావాన్ని, నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: పునరుత్థానంలోని వాచ్యం మరియు కార్యసాధకుడు
  choice: లేపబడ్డాడు
  alternative: లేచాడు
  rationale: గ్రీకు కర్మణి రూపాన్ని నిలిపి, దేవుని కార్యాన్ని అస్పష్టం చేయకుండా అదే సమయంలో కార్యసాధకుణ్ణి వాక్యంలో అదనంగా చేర్చలేదు.
- issue: Χριστός అనే బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ ప్రతినిధిత్వ మరియు అంత్యకాల వాదనలో ఇది పేరులా కాక అభిషిక్తుని బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని అర్థాన్ని తెలిపే రూపాన్ని ఎంచుకున్నాం.
- issue: ἀπαρχή యొక్క ప్రతినిధిత్వ భావం
  choice: ప్రథమఫలం
  alternative: మొదటి భాగం
  rationale: కేవలం కాలక్రమంలో మొదటివాడు అనే భావానికే పరిమితం కాకుండా, తరువాతి పంటను ముందుగా సూచించే ఆరాధనా-పంట రూపకాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా అనువదించబడింది. ‘మృతులలోనుండి’ అనే రూపం మూలంలోని బహువచన భావాన్ని, ‘నిద్రించినవారు’ అనే పదబంధం మూల రూపకాన్ని, ‘లేపబడ్డాడు’ కర్మణి వాచ్యాన్ని నిలుపుతున్నాయి.
