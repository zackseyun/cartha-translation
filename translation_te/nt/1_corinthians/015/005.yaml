  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: te
  text: ఆయన కేఫాకు[a][b] కనిపించాడనీ, తరువాత పన్నెండుగురైన వారికి[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కేఫా ఆయనను చూశాడు.’ గ్రీకు క్రియ రూపరీత్యా కర్మణి ప్రయోగంలో ఉంది; అయితే పునరుత్థాన దర్శనాల సందర్భంలో దాన్ని సాధారణంగా ‘కనిపించాడు’ అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: కేఫా అనేది పేతురుకు సంబంధించిన అరామిక్ పేరు.
    reason: cross_reference
  - marker: c
    text: ‘పన్నెండుగురు’ అనేది యేసు అపొస్తలుల వర్గానికి స్థిరపడిన పేరు; ఆ వర్గంలో ప్రతి సమయంలోనూ సరిగ్గా పన్నెండుమంది లేకపోయినా ఈ పేరు వాడబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: ὤφθη
  choice: కనిపించాడు
  rationale: ὁράω క్రియ యొక్క భూతకాల కర్మణి రూపమైనప్పటికీ, పునరుత్థాన దర్శనాల సందర్భంలో ‘కనిపించాడు’ అనేది సహజమైన తెలుగు ప్రయోగం. ఇది యేసు వారికి దర్శనమిచ్చాడనే భావాన్ని వ్యక్తం చేస్తుంది; దర్శనం ఏ విధంగా జరిగిందో అదనంగా నిర్ధారించదు.
- source_word: Κηφᾷ
  choice: కేఫాకు
  rationale: Κηφᾶς అనే పేరుకు చతుర్థీ విభక్తి రూపం. గ్రీకు పాఠంలోని పేరును ‘పేతురు’గా మార్చకుండా ‘కేఫా’గా లిప్యంతరీకరించి, సందర్భానుసారం ‘కు’ విభక్తి చేర్చబడింది.
- source_word: εἶτα
  choice: తరువాత
  rationale: సాక్షుల క్రమాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: τοῖς δώδεκα
  choice: పన్నెండుగురికి
  rationale: యేసు అపొస్తలుల వర్గానికి స్థిరపడిన సమూహనామాన్ని యథాతథంగా నిలుపుతుంది. ఇతర వచనాలతో సమన్వయం చేయడానికి దీనిని ‘పదకొండుగురు’ లేదా ‘అపొస్తలులు’గా మార్చలేదు.
- source_word: καὶ ὅτι
  choice: అనీ
  rationale: మునుపటి వచనాల్లో మొదలైన విషయవాక్యాల వరుసను తెలుగులో సహజంగా కొనసాగించే ఉద్ధరణాంత రూపం. ఈ వచనం ముందు వాక్యంతో వ్యాకరణపరంగా అనుసంధానమై ఉందని సూచిస్తుంది.
theological_decisions:
- issue: పునరుత్థాన దర్శనాన్ని తెలిపే ὤφθη
  choice: కనిపించాడు
  alternative: ఆయనను చూశారు / ఆయన కనబడ్డాడు
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా కర్మణి అయినా, ఈ సందర్భంలో ‘కనిపించాడు’ అనే ప్రయోగం దర్శన సంఘటనను సహజంగా తెలియజేస్తుంది. దర్శనం జరిగిన విధానాన్ని లేదా స్వభావాన్ని అనవసరంగా వివరించదు.
- issue: యూదా లేని సమయంలో ‘పన్నెండుగురు’ అనే ప్రస్తావన
  choice: పన్నెండుగురు
  alternative: పదకొండుగురు / అపొస్తలులు
  rationale: τοῖς δώδεκα అనేది అపొస్తలుల వర్గానికి స్థిరమైన సమూహనామం. చారిత్రక సమన్వయం కోసం మూలపాఠంలోని సంఖ్యను మార్చకుండా దాని ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘అనీ’ రూపం ఈ వచనం 3–4 వచనాల్లోని పరంపరాగత ప్రకటనను కొనసాగిస్తోందని నిలుపుతుంది. రెండో భాగంలో గ్రీకులో విడిచిపెట్టబడిన క్రియను తెలుగులో స్పష్టత, సహజత్వం కోసం పునరుక్తి చేశాం.
