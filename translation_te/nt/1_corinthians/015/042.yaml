id: 1CO.15.42
reference: 1 Corinthians 15:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὕτως καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: te
  text: 'మృతుల పునరుత్థానం కూడా ఇలాగే ఉంటుంది: క్షయానికి లోనయ్యేదిగా[a] విత్తబడుతుంది; క్షయానికి లోనుకానిదిగా లేపబడుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్షయస్థితిలో ... అక్షయస్థితిలో.”
    reason: φθορά, ἀφθαρσία పదాలను స్థితిని సూచించే మరింత రూపసామ్యమైన పదాలతో అనువదించే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: కూడా ఇలాగే ఉంటుంది
  rationale: ముందున్న విత్తనపు ఉపమానాన్ని మృతుల పునరుత్థానానికి వర్తింపజేసే పోలికను, నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: మృతుల పునరుత్థానం
  rationale: గ్రీకు షష్ఠీవిభక్తి నిర్మాణాన్ని, శరీర పునరుత్థానంపై పౌలు చేస్తున్న వాదనను సంక్షిప్తంగా, ఖచ్చితంగా ప్రతిబింబిస్తుంది.
- source_word: σπείρεται
  choice: విత్తబడుతుంది
  rationale: విత్తనపు వ్యవసాయ రూపకాన్ని, అలాగే గ్రీకులోని కర్మణి ప్రయోగాన్ని నిలుపుతుంది; దానిని కేవలం ‘పాతిపెట్టబడుతుంది’ అని వివరణాత్మకంగా మార్చదు.
- source_word: ἐν φθορᾷ
  choice: క్షయానికి లోనయ్యేదిగా
  rationale: ఈ సందర్భంలో φθορά సూచించే నశ్వరతను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తూ, ఎదురుగా వచ్చే ἀφθαρσίαతో పదబంధ సమాంతరతను నిలుపుతుంది.
- source_word: ἐγείρεται
  choice: లేపబడుతుంది
  rationale: పునరుత్థాన సందర్భంలో గ్రీకు కర్మణి రూపాన్ని నిలుపుతూ, శరీరం లేపబడుతున్నదనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ἀφθαρσίᾳ
  choice: క్షయానికి లోనుకానిదిగా
  rationale: ἀφθαρσία యొక్క అక్షయత లేదా నశించనితనాన్ని తెలియజేస్తూ, ‘క్షయానికి లోనయ్యేదిగా’ అనే ముందరి పదబంధంతో ప్రత్యక్ష వ్యతిరేకతను కాపాడుతుంది.
theological_decisions:
- issue: పునరుత్థాన శరీర స్వభావంపై పౌలు చూపే వ్యత్యాసం
  choice: ‘విత్తబడుతుంది ... లేపబడుతుంది’ అనే శరీర సంబంధ రూపకాన్ని, కర్మణి క్రియలను యథాతథంగా నిలుపడం
  alternative: ‘శరీరం పాతిపెట్టబడుతుంది ... నశించనిదిగా తిరిగి బ్రతుకుతుంది’ అని మరింత వివరణాత్మకంగా అనువదించడం
  rationale: సందర్భంలో పౌలు విత్తనపు ఉపమానం ద్వారా శరీర పునరుత్థానాన్ని సమర్థిస్తున్నాడు. శరీరపు కొనసాగింపుతోపాటు దాని మార్పును కూడా ఈ రూపకం ఉద్వేగాన్ని తొలగించకుండా నిలుపుతుంది; పాఠాన్ని కేవలం ఆధ్యాత్మిక లేదా నైతిక పునరుజ్జీవనంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పునరుత్థానం’ అనే స్థిరమైన బైబిలు పదాన్ని ఉంచి, అరుదుగా వినిపించే ‘క్షయత్వం/అక్షయత్వం’ కంటే సహజమైన సమాంతర పదబంధాలను ప్రధాన పాఠంలో ఉపయోగించాం.
