review_pass:
  verdict: approve
  source_fidelity: The translation accurately retains the comparative transition (Οὕτως καὶ), the genitive expression “resurrection of the dead,” and the paired passive agricultural/resurrection verbs. “క్షయానికి లోనయ్యేదిగా ... క్షయానికి లోనుకానిదిగా” communicates the intended contrast of φθορά and ἀφθαρσία without reducing it to moral corruption or making the sowing metaphor into an explicit burial paraphrase.
  naturalness: The Telugu is clear, modern, and suitably dignified. “మృతుల పునరుత్థానం కూడా ఇలాగే ఉంటుంది” naturally connects this statement with the preceding seed analogy. The parallel phrasing in the two clauses is readily understandable.
  terminology: “పునరుత్థానం” and “లేపబడుతుంది” are appropriate established Telugu biblical terms. The main-text wording for perishability and imperishability is accessible while preserving the contrast, and the footnote provides a more formally state-oriented alternative.
