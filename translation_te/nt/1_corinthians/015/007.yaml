  source_fidelity: గ్రీకు క్రమసూచక అవ్యయాలైన ἔπειτα, εἶτα రెండింటినీ ‘ఆ తరువాత’గా సరిగ్గా ప్రతిఫలించింది. ὤφθη యొక్క పునరుత్థాన-దర్శన సంబంధమైన ప్రయోగాన్ని ‘కనిపించాడు’గా సహజంగా అనువదించింది; యాకోబుకు మరియు అపొస్తలులందరికీ అనే సంప్రదాన సంబంధాలు, అలాగే πᾶσιν యొక్క సమగ్రత, యథాతథంగా ఉన్నాయి.
