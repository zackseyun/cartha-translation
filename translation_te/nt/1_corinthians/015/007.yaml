  edition: SBLGNT
  text: ἔπειτα ὤφθη Ἰακώβῳ, εἶτα τοῖς ἀποστόλοις πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/007.yaml
  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: te
  text: ఆ తరువాత ఆయన యాకోబుకు[a] కనిపించాడు; ఆ తరువాత అపొస్తలులందరికీ కనిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఆయన యాకోబుచేత చూడబడ్డాడు; ... అపొస్తలులందరిచేత చూడబడ్డాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: ఆ తరువాత
  rationale: పునరుత్థాన దర్శనాల వరుసలో తదుపరి సంఘటనను సూచించే కాలక్రమ అవ్యయం; ఆధునిక తెలుగులో సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: ὤφθη
  choice: ఆయన ... కనిపించాడు
  rationale: ὁράω క్రియ యొక్క భూతకాల కర్మణి రూపం ఇక్కడ దర్శనమివ్వడం అనే అర్థంలో వాడబడింది. ‘కనిపించాడు’ అనేది తెలుగులో సహజంగా ఉండి, మరింత అక్షరార్థమైన ‘చూడబడ్డాడు’ అనే భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: Ἰακώβῳ
  choice: యాకోబుకు
  rationale: ὤφθηతో వచ్చిన సంప్రదాన విభక్తి; గ్రీకు వ్యక్తినామానికి తెలుగు బైబిలు వాడుకలో స్థిరమైన రూపాన్ని ఉపయోగించింది.
- source_word: εἶτα
  choice: ఆ తరువాత
  rationale: మరొక క్రమసూచక అవ్యయం. పౌలు పేర్కొన్న వరుసను స్పష్టంగా కొనసాగించడానికి మొదటి అవ్యయంతో సమానంగా అనువదించబడింది.
- source_word: ἀποστόλοις
  choice: అపొస్తలులకు
  rationale: ఈ సందర్భంలో సాధారణ దూతలను కాక, నియమించబడిన సాక్షులుగా గుర్తింపుపొందిన వారిని సూచిస్తుంది; స్థిరమైన సాంకేతిక పదాన్ని నిలుపుతుంది.
- source_word: πᾶσιν
  choice: అందరికీ
  rationale: అపొస్తలుల సమూహమంతటినీ నేరుగా నొక్కిచెబుతుంది.
theological_decisions:
- issue: యాకోబుతో పోలిస్తే ‘అపొస్తలులందరు’ అనే మాట ఎవరిని, ఎంత విస్తృతమైన సమూహాన్ని సూచిస్తుంది?
  choice: సమూహాన్ని పరిమితం చేయకుండా ‘అపొస్తలులందరికీ’ అని నేరుగా అనువదించడం.
  alternative: ఇది ప్రత్యేకంగా పన్నెండుగురినో, లేక వారికంటే విస్తృతమైన నియమిత సాక్షుల సమూహాన్నో సూచిస్తుందని స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం ఈ సమూహ సభ్యత్వాన్ని నిర్వచించదు. కాబట్టి యాకోబుకు కలిగిన దర్శనానికి, తరువాత ‘అపొస్తలులందరికీ’ కలిగిన దర్శనానికి మధ్య పౌలు ఉంచిన భేదాన్ని అలాగే నిలుపుతూ, సమన్వయ వ్యాఖ్యానాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కనిపించాడు’ పునరుత్థాన దర్శన సందర్భంలో స్పష్టంగా ఉంటుంది; గ్రీకు కర్మణి నిర్మాణం పాదటిప్పణిలో భద్రపరచబడింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
