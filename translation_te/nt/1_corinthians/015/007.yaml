  terminology: ‘యాకోబు’ మరియు ‘అపొస్తలులు’ స్థిరమైన తెలుగు బైబిలు పదప్రయోగాలకు అనుగుణంగా ఉన్నాయి. ‘అపొస్తలులందరు’ అనే పదాన్ని పన్నెండుగురికి మాత్రమే పరిమితం చేయకుండా మూలపాఠంలోని అనిశ్చిత పరిధిని కాపాడింది. పాదటిప్పణి ὤφθη యొక్క అక్షరార్థ కర్మణి ప్రత్యామ్నాయాన్ని సముచితంగా అందిస్తుంది.
