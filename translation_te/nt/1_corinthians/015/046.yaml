id: 1CO.15.46
reference: 1 Corinthians 15:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πρῶτον τὸ πνευματικὸν ἀλλὰ τὸ ψυχικόν, ἔπειτα τὸ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: te
  text: అయితే మొదట ఆత్మసంబంధమైనది కాదు[a], సహజమైనదే[b]; ఆ తరువాత ఆత్మసంబంధమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహజ శరీరం ... ఆత్మసంబంధమైన శరీరం.’ పౌలు ఇక్కడ ‘శరీరం’ అనే పదాన్ని వాడలేదు; అయితే చుట్టుపక్కల సందర్భంలో అది స్పష్టంగా ఉంది.
    reason: alternative_reading
  - marker: b
    text: ‘సహజమైనది’ అని అనువదించిన గ్రీకు పదం psychikon; ఇది సాధారణ జీవప్రాణానికి చెందినదాన్ని సూచిస్తుంది. మరింత అక్షరార్థంగా, ‘ప్రాణసంబంధమైనది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: మొదట
  rationale: ఇది క్రమాన్ని సూచించే క్రియావిశేషణ ప్రయోగం. పౌలు చెప్పే ముందు–తరువాత క్రమాన్ని ‘మొదట’ సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: πνευματικόν
  choice: ఆత్మసంబంధమైనది
  rationale: మూలంలో ఇది నపుంసక ఏకవచన విశేషణం అయినా నామవాచకంగా వాడబడింది. ‘శరీరం’ అనే పదాన్ని చేర్చకుండా ఉంచడం ద్వారా గ్రీకు వాక్యంలోని సంక్షిప్తతను, సందర్భపరమైన విస్తృతిని కాపాడుతుంది.
- source_word: ψυχικόν
  choice: సహజమైనది
  rationale: ఇది సాధారణ జీవప్రాణానికి చెందిన ఉనికిని సూచిస్తూ πνευματικόνతో వ్యత్యాసంగా ఉంది. ‘శారీరకమైనది’ అనడం భావాన్ని అతిగా కుదిస్తుంది; ‘ఆత్మలేనిది’ అనడం అవసరం లేని నైతిక ప్రతికూల భావాన్ని కలిగించవచ్చు.
- source_word: ἔπειτα
  choice: ఆ తరువాత
  rationale: తదుపరి క్రమాన్ని స్పష్టంగా సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: అయితే ... కాదు, ... ఏ
  rationale: ఊహించబడిన క్రమాన్ని సరిదిద్దే మూలంలోని జత వ్యత్యాస నిర్మాణాన్ని తెలుగులో ‘కాదు ... ఏ’ అనే నొక్కిచెప్పే రూపంతో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ψυχικόν మరియు πνευματικόν మధ్య వ్యత్యాసం
  choice: 'పునరుత్థానం గురించిన పౌలు వాదనలో మానవ ఉనికి యొక్క వరుస స్థితులు లేదా విధానాల మధ్య వ్యత్యాసంగా అనువదించడం: మొదట సహజమైనది, తరువాత ఆత్మసంబంధమైనది.'
  alternative: ప్రత్యేకంగా ‘సహజ శరీరం’ మరియు ‘ఆత్మసంబంధమైన శరీరం’ మధ్య వ్యత్యాసంగా అనువదించడం; లేదా ఆత్మసంబంధం లేని వ్యక్తులు మరియు ఆత్మసంబంధమైన వ్యక్తుల మధ్య వ్యత్యాసంగా అర్థం చేయడం.
  rationale: 44వ వచనంలో ‘శరీరం’ స్పష్టంగా ఉన్నప్పటికీ, 46వ వచనంలో ఆ పదం లేదు. అందువల్ల ‘శరీరం’ను ప్రధాన పాఠ్యంలో చేర్చకుండా, నామవాచకాలుగా పనిచేసే విశేషణాలను నిలుపుతూ సందర్భంలోని నిజమైన భావవిస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే సంక్షిప్త శైలి. మూలంలోని సమాంతర వ్యత్యాసాన్ని, ‘శరీరం’ అనే పదం లేకపోవడాన్ని నిలుపుకుంది.
