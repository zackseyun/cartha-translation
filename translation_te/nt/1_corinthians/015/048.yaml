id: 1CO.15.48
reference: 1 Corinthians 15:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: te
  text: మట్టికి చెందిన మనిషి[a] ఎలాంటివాడో, మట్టికి చెందినవారూ అలాంటివారే; పరలోకానికి చెందిన మనిషి ఎలాంటివాడో, పరలోకానికి చెందినవారూ అలాంటివారే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మట్టితో చేయబడిన మనిషి.”
    reason: χοϊκός అనే విశేషణం ‘మట్టికి చెందిన’ అనే అర్థంతో పాటు, ఆదాము మట్టినుండి ఏర్పడిన సందర్భాన్ని సూచించే ‘మట్టితో చేయబడిన’ అనే భావాన్ని కూడా సందర్భానుసారంగా తెలియజేయవచ్చు.
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: ఎలాంటివాడో ... అలాంటివారే
  rationale: ఈ పరస్పర సంబంధ నిర్మాణం ప్రతినిధిగా ఉన్న వ్యక్తికీ, అతనికి సంబంధించినవారికీ మధ్య పోలికను తెలియజేస్తుంది. ఈ తెలుగు నిర్మాణం సహజంగా ఉండి, మూలంలోని సమాంతరతను కాపాడుతుంది.
- source_word: χοϊκός
  choice: మట్టితో చేయబడిన
  rationale: ఈ విశేషణం మట్టితో చేయబడిన లేదా మట్టి స్వభావం గలదాన్ని సూచిస్తూ, ఆదాము ఆవిర్భావాన్ని జ్ఞాపకం చేస్తుంది. ‘మట్టితో చేయబడిన’ అనే పదబంధం ఆ సూచనను స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: ὁ χοϊκός
  choice: మట్టితో చేయబడిన మనిషి
  rationale: సమీప సందర్భంలో ఆదాముకు, పరలోకపు మనిషికి మధ్య ఉన్న ప్రతినిధి-వ్యక్తుల వ్యత్యాసం ఉద్దేశించబడింది. తెలుగులో వ్యక్తిని స్పష్టంగా సూచించడానికి ‘మనిషి’ని చేర్చడం సహజం.
- source_word: οἱ χοϊκοί
  choice: మట్టితో చేయబడినవారు
  rationale: ఈ బహువచనం మట్టితో చేయబడిన మనిషి స్వభావాన్ని పంచుకునే మానవులను సూచిస్తుంది. ఏకవచనంతో ఉన్న పదసంబంధాన్ని ఈ రూపం కాపాడుతుంది.
- source_word: ἐπουράνιος
  choice: పరలోకపు / పరలోకానికి చెందిన
  rationale: ఈ విశేషణం పరలోక సంబంధాన్ని లేదా పరలోకానికి చెందడాన్ని సూచిస్తుంది. ఏకవచనంలో ‘పరలోకపు మనిషి’, బహువచనంలో సహజమైన ‘పరలోకానికి చెందినవారు’ అని అనువదించాం.
- source_word: ὁ ἐπουράνιος
  choice: పరలోకపు మనిషి
  rationale: సందర్భంలో ఇది ఆదాముకు వ్యతిరేకంగా క్రీస్తును సూచిస్తుంది. ‘మనిషి’ని చేర్చడం మూలంలోని పురుష ఏకవచన వ్యక్తిగత వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: οἱ ἐπουράνιοι
  choice: పరలోకానికి చెందినవారు
  rationale: ఇది పరలోకపు మనిషికి అనుగుణంగా ఉన్న మానవులను సూచిస్తుంది; దేవదూతలను సూచిస్తున్నట్లు అపార్థం రాకుండా, విశేషణార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఏకవచన భాగాల్లో ఆదాము–క్రీస్తు వ్యత్యాసాన్ని ‘మనిషి’ అనే చేర్చిన పదంతో స్పష్టం చేయాలా?
  choice: ‘మట్టితో చేయబడిన మనిషి’, ‘పరలోకపు మనిషి’ అని అనువదించడం
  alternative: ‘మట్టితో చేయబడినవాడు’, ‘పరలోకానికి చెందినవాడు’ అని అనువదించడం
  rationale: 15:45–49 సందర్భం ఆదాము, క్రీస్తు అనే ప్రతినిధి వ్యక్తులను పోలుస్తుంది. ‘మనిషి’ అనే పదం సందర్భం సూచించే వ్యక్తిగత వ్యత్యాసాన్ని స్పష్టం చేస్తుంది గాని అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: οἱ ἐπουράνιοι పరలోక జీవులనో, పరలోకపు మనిషికి అనుగుణమైన మనుషులనో సూచిస్తుందా?
  choice: మానవులను సూచించేలా ‘పరలోకానికి చెందినవారు’ అని అనువదించడం
  alternative: ‘పరలోకవాసులు’ లేదా ‘పరలోక సంబంధులు’
  rationale: ఈ సందర్భం మానవ పునరుత్థానం గురించీ, పరలోకపు మనిషి రూపానికి అనుగుణమయ్యే వారి గురించీ మాట్లాడుతోంది; దేవదూతల గురించి కాదు. ఎంపిక చేసిన రూపం ఈ మానవ సందర్భాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. రెండు భాగాల సమాంతర నిర్మాణాన్ని, ‘మట్టి–పరలోకం’ వ్యత్యాసాన్ని స్పష్టంగా నిలిపాం.
