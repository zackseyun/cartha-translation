id: 1CO.15.27
reference: 1 Corinthians 15:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: te
  text: ఎందుకంటే, “ఆయన తన పాదాల కింద సమస్తాన్ని లోబరచాడు.” అయితే, “సమస్తం లోబరచబడింది” అని చెప్పినప్పుడు[a], సమస్తాన్ని ఆయనకు లోబరచినవాడు మాత్రం ఆ “సమస్తం”లో చేర్చబడలేదని స్పష్టమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఆయన “సమస్తం లోబరచబడింది” అని చెప్పినప్పుడు.
    reason: గ్రీకు క్రియకు కర్త వ్యక్తంగా లేదు; సందర్భానుసారం దాన్ని ‘ఆయన’ అని కూడా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: సమస్తం
  rationale: నపుంసక బహువచనం వ్యక్తులను మాత్రమే కాకుండా సమస్త సృష్టిపై విస్తరించిన భావాన్ని ఇస్తుంది. ‘సమస్తం’ ఆ సమగ్ర పరిధినీ, కీర్తన 8 ప్రతిధ్వనినీ కాపాడుతుంది.
- source_word: ὑπέταξεν / ὑποτέτακται
  choice: లోపరచాడు / లోపరచబడింది
  rationale: ὑποτάσσω అధీన సంబంధంలో ఉంచడాన్ని సూచిస్తుంది. తెలుగు క్రియారూపాలు మొదటి చోట నిర్ణాయక క్రియను, రెండవ చోట పూర్తయి కొనసాగుతున్న స్థితిని మరియు కర్మణి ప్రయోగాన్ని నిలుపుతాయి.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: ఆయన పాదాల కింద
  rationale: ఇది ఆధిపత్యం లేదా అధీనతను తెలిపే లేఖనపరమైన రూపకం. మూలగ్రంథ ప్రతిధ్వని నిలిచేలా అక్షరార్థ రూపాన్ని ఉంచాం.
- source_word: ὅταν δὲ εἴπῃ
  choice: అయితే, … అని చెప్పినప్పుడు
  rationale: గ్రీకులో కర్త వ్యక్తంగా లేదు. తెలుగు ఉద్ధరణ నిర్మాణం దాన్ని సహజంగా అనిర్దిష్టంగా ఉంచి, లేఖనం చెబుతోందా లేక దేవుడు చెబుతున్నాడా అన్న అంశాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: δῆλον
  choice: స్పష్టమే
  rationale: పాఠకుడు గుర్తించాల్సిన తార్కిక నిర్ధారణను సరళమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: సమస్తాన్ని ఆయనకు లోపరచినవాడు మాత్రం ఆ ‘సమస్తం’లో చేర్చబడలేదు
  rationale: ἐκτός తెలిపే మినహాయింపును తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది. లోపరచినవాడు తానే లోపరచబడిన ‘సమస్తం’లో భాగం కాదనే పౌలు తర్కాన్ని కాపాడుతుంది.
- source_word: αὐτῷ
  choice: ఆయనకు
  rationale: సందర్భంలో సమస్తం ఎవరికి లోపరచబడిందో, అంటే కుమారుడు/మెస్సీయను, ప్రత్యక్ష దత్తివ రూపంతో సూచిస్తుంది.
theological_decisions:
- issue: కుమారునికీ సమస్తాన్ని లోపరచినవానికీ మధ్య సంబంధం
  choice: సమస్తాన్ని కుమారునికి లోపరచినవాడు ‘సమస్తం’లో చేర్చబడలేదని వాక్యం స్పష్టంగా చెబుతుంది.
  alternative: ‘సమస్తాన్ని ఆయనకు లోపరచినవాడు మినహా’ అని మరింత అక్షరార్థంగా అనువదించవచ్చు.
  rationale: పాఠ్యం కుమారుని మహిమను తగ్గించకుండా, కుమారునికీ సమస్తాన్ని ఆయనకు లోపరచిన దేవునికీ మధ్య ఉన్న భేదాన్ని మరియు తార్కిక మినహాయింపును నిలుపుతుంది.
- issue: εἴπῃ యొక్క అవ్యక్త కర్త
  choice: తెలుగులో కర్తను పేర్కొనకుండా ‘అని చెప్పినప్పుడు’ అని ఉంచాం.
  alternative: ‘ఆయన చెప్పినప్పుడు’ లేదా ‘లేఖనం చెప్పినప్పుడు’ అని కర్తను స్పష్టీకరించవచ్చు.
  rationale: మూల గ్రీకులో కర్త వ్యక్తంగా లేనందున, అనువాదం దానిని దేవుడిగా గానీ లేఖనంగా గానీ ఏకపక్షంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడాం. ‘లోపరచు’ అనే పదం ఆధిపత్యం/అధీనత భావాన్ని నిలుపుతూ సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉంది. ఉద్ధరణ గుర్తులు కీర్తన 8 ఆధారిత ప్రకటనను మరియు తరువాతి పునరుద్ధరణను స్పష్టంగా చూపిస్తాయి.
