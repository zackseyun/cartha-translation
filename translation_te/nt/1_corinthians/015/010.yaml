revisions:
- from: అయితే దేవుని కృపవల్లనే నేను ఇలా ఉన్నాను. నా పట్ల ఆయన చూపిన కృప వ్యర్థం కాలేదు.[a] దానికి భిన్నంగా, వారందరికంటే నేను ఎక్కువగా కష్టపడ్డాను. అయినా కష్టపడింది నేను కాదు, నాతో ఉన్న దేవుని కృపే.
  to: అయితే నేను ఏమై ఉన్నానో అది దేవుని కృపవల్లనే. నా పట్ల ఆయన కృప వృథా కాలేదు.[a] అదికాక, వారందరికంటే నేను ఎక్కువగా కష్టపడ్డాను. అయితే నేను కాదు, నాతో ఉన్న దేవుని కృపే.
  rationale: The revision more closely represents the Greek’s emphatic “I am what I am,” uses natural Telugu discourse linkage, and preserves the deliberate tension between Paul’s real labor and the agency of God’s grace without resolving it in a doctrinal direction. The footnote remains correctly anchored to “వృథా కాలేదు” and gives the principal lexical alternatives.
