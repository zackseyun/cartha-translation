id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: te
  text: అయితే మెస్సీయ లేపబడి ఉండకపోతే[a], మీ విశ్వాసం నిష్ఫలమే[b]; మీరు మీ పాపాల్లోనే ఇంకా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు లేపబడి ఉండకపోతే.”
    reason: Χριστόςకు సంప్రదాయ తెలుగు రూపమైన ‘క్రీస్తు’ అనే అనువాద ప్రత్యామ్నాయాన్ని తెలియజేయడానికి.
  - marker: b
    text: లేదా, “మీ విశ్వాసం వ్యర్థమే.”
    reason: ματαίαకు సమీపమైన మరో సహజ తెలుగు పదప్రయోగాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός అభిషిక్తుడనే బిరుదు భావంతో ఉంది; అందువల్ల సంప్రదాయ నామరూపమైన ‘క్రీస్తు’కు బదులుగా ‘మెస్సీయ’ అని అనువదించాం.
- source_word: ἐγήγερται
  choice: లేపబడకపోతే
  rationale: గ్రీకు పరిపూర్ణ కర్మణి రూపం పునరుత్థాన సంఘటనకు ప్రస్తుతం కొనసాగుతున్న ఫలితాన్ని సూచిస్తుంది. కర్తను స్పష్టంగా చేర్చకుండా కర్మణి భావాన్ని నిలిపాం.
- source_word: ματαία
  choice: నిష్ఫలమే
  rationale: విశ్వాసం ఆశించిన ఫలితాన్ని ఇవ్వలేనిదిగా, ప్రయోజనం లేనిదిగా అవుతుందనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఇక్కడ కొరింథీయులు నమ్మిన విశ్వాస స్పందనను సూచిస్తోంది; ‘విశ్వసనీయత’ అనే భావం ప్రధానంగా లేదు.
- source_word: ἔτι
  choice: ఇంకా
  rationale: పాపాల్లో ఉన్న స్థితి కొనసాగుతూనే ఉందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: మీ పాపాల్లోనే
  rationale: గ్రీకు విభక్తి సంబంధాన్ని సమీపంగా నిలుపుతూ, పాపానికి సంబంధించిన స్థితి మరియు దాని ప్రభావంలో ఇంకా ఉండటాన్ని తెలిపే సహజ తెలుగు ప్రయోగం.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాదనతో ఉన్న వ్యతిరేక సంబంధాన్ని తెలుగులో సహజంగా చూపిస్తుంది.
theological_decisions:
- issue: పునరుత్థాన పదప్రయోగం మరియు కార్యనిర్వాహకుడు
  choice: లేపబడకపోతే
  alternative: తిరిగి లేచి ఉండకపోతే
  rationale: కర్మణి రూపం దేవుని కార్యాన్ని సూచించే పౌలు సాధారణ పదప్రయోగాన్ని నిలుపుతుంది; అయితే గ్రీకులో స్పష్టంగా లేని కార్యనిర్వాహకుడిని అనువాదంలో చేర్చదు.
- issue: Χριστός పదానికి అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదం అభిషిక్తుడనే బిరుదు భావంతో ధార్మిక వాదనలో ఉపయోగించబడింది; అందువల్ల ‘మెస్సీయ’ మూలార్థాన్ని మరింత ప్రత్యక్షంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి పాటించబడింది. ‘పాపాల్లోనే’ అనే రూపం మూలంలోని బలాన్ని నిలుపుతుంది; ‘నిష్ఫలమే’ వాక్యంలోని నిర్ధారణాత్మక ఒత్తిడిని వ్యక్తం చేస్తుంది.
