id: 1CO.15.9
reference: 1 Corinthians 15:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: te
  text: ఎందుకంటే అపొస్తలులందరిలో నేనే అతి అల్పుడిని; దేవుని సంఘాన్ని హింసించినందువల్ల, అపొస్తలుడని పిలవబడటానికి నేను అర్హుణ్ణి కాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తగినవాణ్ణి కాను,” లేదా “యోగ్యతగలవాణ్ణి కాను.”
    reason: ἱκανός అనే పదానికి అర్హత, తగినతనం, సామర్థ్యం అనే భావవిస్తృతి ఉంది.
lexical_decisions:
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంతో ఉన్న వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐλάχιστος
  choice: అత్యల్పుణ్ణి
  rationale: శారీరక పరిమాణాన్ని కాక, అపొస్తలులలో తన స్థానాన్ని పౌలు తగ్గించుకొని చెప్పడాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἀπόστολος / ἀποστόλων
  choice: అపొస్తలుడు / అపొస్తలులు
  rationale: ఇక్కడ సాధారణ దూతలను కాక, గుర్తింపు పొందిన అపొస్తలుల సమూహాన్ని సూచించే పారిభాషిక భావాన్ని నిలుపుతుంది.
- source_word: ἱκανός
  choice: అర్హుణ్ణి
  rationale: తాను గతంలో సంఘాన్ని హింసించినందువల్ల ఈ పేరుకు అర్హుడు కాదని పౌలు వినయంగా చెప్పే సందర్భానికి సరిపోతుంది; సామర్థ్యం లేదా యోగ్యత అనే భావసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: καλεῖσθαι
  choice: పిలవబడటానికి
  rationale: గ్రీకు కర్మణి క్రియారూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: διότι
  choice: కాబట్టి
  rationale: పౌలు తనను అర్హుడు కాదని భావించడానికి గల స్పష్టమైన కారణాన్ని తెలియజేస్తుంది.
- source_word: ἐδίωξα
  choice: హింసించాను
  rationale: విశ్వాసులపై పౌలు గతంలో చేసిన శత్రుత్వపూర్వక చర్యలను సందర్భానుసారంగా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: దేవుని సంఘాన్ని
  rationale: దేవునికి చెందిన విశ్వాసుల సమాజాన్ని సూచిస్తూ, గ్రీకు షష్ఠీ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: ὃς
  choice: నేను … కాను
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని తెలుగులో స్వతంత్ర వాక్యంగా సహజీకరించినా, అది పౌలు తన గురించే చేస్తున్న కొనసాగింపు ప్రకటన అనే సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పౌలు తన అపొస్తలత్వం గురించి చేసిన ప్రకటన స్వభావం
  choice: తాను అపొస్తలులలో ఒకడినని అంగీకరిస్తూనే, ఆ పేరుకు అర్హుడు కాదని వినయంగా చెబుతున్నాడు.
  alternative: పౌలు తన అపొస్తలత్వాన్నే పూర్తిగా నిరాకరిస్తున్నాడు; లేదా నైతిక అనర్హతను కాక కేవలం తక్కువ సామాజిక స్థానాన్ని మాత్రమే సూచిస్తున్నాడు.
  rationale: “అపొస్తలులందరిలో” అనే మాట అతన్ని ఆ సమూహంలో చేర్చుతుంది; “అర్హుణ్ణి కాను” అనే మాట సంఘాన్ని హింసించిన తన గతాన్ని బట్టి కలిగిన వినయాన్ని తెలియజేస్తుంది. అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజమైన రెండు వాక్యాలుగా ఇచ్చాం; కారణసంబంధాన్ని స్పష్టంగా నిలిపాం.
