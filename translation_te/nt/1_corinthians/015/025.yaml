id: 1CO.15.25
reference: 1 Corinthians 15:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δεῖ γὰρ αὐτὸν βασιλεύειν ἄχρι ⸀οὗ θῇ πάντας τοὺς ἐχθροὺς ὑπὸ τοὺς πόδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: te
  text: ఎందుకంటే, ఆయన రాజుగా పరిపాలించాలి, తన శత్రువులందరినీ తన పాదాల కింద ఉంచేవరకు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన శత్రువులందరినీ తన పాదాల కింద ఉంచి పూర్తిచేసేవరకు.” గ్రీకు పదప్రయోగం చర్యను కొనసాగుతున్నట్లుగా లేదా పూర్తయినట్లుగా చూపే ఈ తెలుగు క్రియారూపాల మధ్య తేడాను తప్పనిసరిగా నిర్దేశించదు.
    reason: lexical_alternative
  - marker: b
    text: శత్రువులను “తన పాదాల కింద” ఉంచడం పూర్తి లోబడుదలను సూచించే బైబిలీయ రూపకం; కీర్తన 110:1తో పోల్చండి.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: పరిపాలించాలి
  rationale: ఇక్కడ δεῖ తెలిపే అవసరతను తెలుగు విధ్యర్థక రూపమైన ‘-ాలి’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది; సందర్భంలో దైవ సంకల్పపు అనివార్యత భావం నిలుస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను అనుసంధానించే γὰρ భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: αὐτὸν
  choice: ఆయన
  rationale: గ్రీకులో infinitive construction‌కు కర్తగా accusative రూపం ఉన్నప్పటికీ, తెలుగులో గౌరవార్థక కర్తతో finite clause సహజంగా ఉంటుంది.
- source_word: βασιλεύειν
  choice: రాజుగా పరిపాలించాలి
  rationale: βασιλεύωలోని రాజత్వ భావాన్ని ‘పరిపాలించాలి’ మాత్రమే కంటే ‘రాజుగా పరిపాలించాలి’ మరింత స్పష్టంగా నిలుపుతుంది.
- source_word: ἄχρι οὗ
  choice: ఉంచేవరకు
  rationale: కాలపరమైన హద్దును తెలిపే ‘వరకు’ సహజమైన సమానార్థకం; ఆ హద్దు తర్వాత పరిపాలన ముగుస్తుందని ఈ రూపం స్వతహాగా చెప్పదు.
- source_word: θῇ
  choice: ఉంచే
  rationale: τίθημι యొక్క ‘ఉంచు/పెట్టు’ భావాన్ని, ‘పాదాల కింద ఉంచు’ అనే తెలుగు బైబిలీయ రూపకంలో సహజంగా వ్యక్తం చేస్తుంది. గ్రీకు రూపం వల్ల తెలుగులో పూర్తిక్రియను తప్పనిసరిగా ప్రత్యేకంగా గుర్తించాల్సిన అవసరం లేదు.
- source_word: πάντας τοὺς ἐχθροὺς
  choice: తన శత్రువులందరినీ
  rationale: πάντας యొక్క సమగ్రతను ‘అందరినీ’ నిలుపుతుంది; αὐτοῦతో ఉన్న సంబంధాన్ని తెలుగు reflexive possessive ‘తన’ స్పష్టంగా చూపుతుంది.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: తన పాదాల కింద
  rationale: సంపూర్ణంగా లోబరచడాన్ని సూచించే బైబిలీయ రూపకాన్ని మార్చకుండా నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ἄχρι οὗ (‘వరకు’) యొక్క కాలపరమైన భావం
  choice: ‘ఉంచేవరకు’ అని అనువదించి, ఆ తర్వాత మెస్సీయ పరిపాలన ముగుస్తుందని చెప్పలేదు.
  alternative: శత్రువులు లోబడిన వెంటనే ఆయన పరిపాలన ముగుస్తుందని సూచించే అనువాదం.
  rationale: గ్రీకు నిర్మాణం దృష్టిలో ఉన్న కాలహద్దును తెలుపుతుంది; ఆ హద్దు తర్వాత చర్య తప్పక ఆగిపోతుందని స్వయంగా నిర్ధారించదు. అందువల్ల వచనంలోని theological tension‌ను పరిష్కరించకుండా నిలిపాం.
- issue: శత్రువులను పాదాల కింద ఉంచడం
  choice: రూపకాన్ని యథాతథంగా ఉంచి, పాదసూచికలో సంపూర్ణ లోబరచడం అని వివరించాం.
  alternative: ప్రధాన వచనంలోనే ‘పూర్తిగా లోబరచేవరకు’ అని రూపకాన్ని వివరణాత్మకంగా మార్చడం.
  rationale: మూలంలోని బైబిలీయ ప్రతిమను కాపాడటం, అదే సమయంలో సాధారణ పాఠకునికి దాని భావాన్ని పాదసూచికలో అందించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘రాజుగా పరిపాలించాలి’ మరియు ‘పాదాల కింద’ వంటి గంభీరమైన బైబిలీయ పదప్రయోగాలు నిలుపబడ్డాయి. ప్రధాన పాఠంలోని [a], [b] సూచికలు సంబంధిత పాదసూచికలకు సరిపోతాయి.
