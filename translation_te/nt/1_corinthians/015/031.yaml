  source_fidelity: The draft accurately retains the daily, vivid present of ἀποθνῄσκω, the oath-like force of νὴ, Paul’s possession of the boasting, the Pauline ἐν relation, and “Messiah” for Χριστός. However, “చెబుతున్నాను” (“I say”) is not represented in the Greek; the oath-like construction can be expressed without adding this speech verb.
