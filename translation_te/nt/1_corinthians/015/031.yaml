  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: te
  text: మీ గురించి నాకు ఉన్న అతిశయాన్ని సాక్షిగా పెట్టుకొని, మన ప్రభువైన మెస్సీయ యేసులో నేను ప్రతిరోజూ చనిపోతున్నాను.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “రోజూ నేను చనిపోతున్నాను.”
    reason: lexical_alternative
  - marker: b
    text: “మీ గురించి నాకు ఉన్న అతిశయం ఎంత నిశ్చయమో అంత నిశ్చయంగా” లేదా “మీ అతిశయాన్ని సాక్షిగా పెట్టుకొని” అని కూడా అనువదించవచ్చు. గ్రీకు మాట ప్రమాణం చేసే విధంగా ఉంది; ‘అతిశయం’ ఎవరికి చెందినదో తెలిపే పదబంధం వ్యాకరణపరంగా చర్చనీయాంశం.
    reason: alternative_reading
  - marker: c
    text: 'సంప్రదాయ అనువాదం: “క్రీస్తు యేసులో.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: ప్రతిరోజూ
  rationale: ‘ప్రతి రోజు’ లేదా ‘రోజూ’ అనే పునరావృత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀποθνῄσκω
  choice: నేను ... చనిపోతున్నాను
  rationale: వర్తమానకాలంలోని పౌలు వాడిన సజీవమైన, బలమైన రూపకాన్ని నిలుపుతుంది; ‘నేను మరణాన్ని ఎదుర్కొంటున్నాను’ అని వివరణాత్మకంగా మార్చలేదు.
- source_word: νὴ
  choice: సాక్షిగా పెట్టుకొని చెబుతున్నాను
  rationale: ఇది ప్రమాణం లేదా దృఢ ప్రకటనలో వాడే అవ్యయం. తెలుగులో సహజంగా వినిపించేందుకు, దేనిని ఆధారంగా చేసుకొని ఆ మాట చెబుతున్నాడో తెలిపే ప్రమాణసదృశ రూపాన్ని వాడింది.
- source_word: τὴν ὑμετέραν καύχησιν
  choice: మీ గురించి నాకు ఉన్న అతిశయం
  rationale: తరువాతి ‘నాకు ఉన్న’ అనే సంబంధ వాక్యం దృష్ట్యా, పౌలు కొరింథీయుల గురించి కలిగివున్న అతిశయంగా ప్రధాన పాఠంలో ఇచ్చింది. అయితే గ్రీకు పదబంధం ‘మీ అతిశయం’ అని కూడా అర్థమయ్యే వ్యాకరణ సందిగ్ధతను పాదసూచికలో నిలిపింది.
- source_word: ἣν ἔχω
  choice: నాకు ఉన్న
  rationale: సంబంధ వాక్యాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: ἐν అనే పౌలు రచనలకు ముఖ్యమైన సంబంధ భాషను ‘లో’తో నిలిపి, Χριστόςను ఇక్కడ బిరుదుగా ‘మెస్సీయ’ అని అనువదించింది.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: మన ప్రభువైన
  rationale: యేసును విశేషించే బిరుదును, ‘మన’ అనే సమూహ సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: Χριστῷను బిరుదుగా అనువదించాలా, సంప్రదాయ నామరూపంగా ఉంచాలా
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఈ సందర్భంలో Χριστόςకు బిరుదు భావం స్పష్టంగా ఉండటంతో అర్థానువాదాన్ని ప్రధాన పాఠంలో ఇచ్చింది; సంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచింది.
- issue: ὑμετέραν καύχησιν ఎవరికి చెందిన అతిశయాన్ని సూచిస్తుంది
  choice: కొరింథీయుల గురించి పౌలుకు ఉన్న అతిశయం
  alternative: కొరింథీయుల సొంత అతిశయం
  rationale: ‘నాకు ఉన్న’ అనే సంబంధ వాక్యం ప్రధాన ఎంపికకు బలం ఇస్తుంది. అయినా ὑμετέραν అనే రూపం వల్ల మిగిలే నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో స్పష్టంగా తెలిపింది.
- issue: νὴతో కూడిన వాక్యభాగం యొక్క ప్రమాణసదృశ బలం
  choice: అతిశయాన్ని సాక్షిగా పెట్టుకొని చేసే దృఢ ప్రకటన
  alternative: ‘నిశ్చయంగా’ అనే సాధారణ బలపరిచే మాట
  rationale: మూలంలోని ప్రమాణసదృశ నిర్మాణాన్నీ, దానికి అనుసంధానమైన καύχησις పదబంధాన్నీ విడదీయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించింది. ‘చనిపోతున్నాను’ అనే సజీవమైన మాటను మృదువుచేయకుండా నిలిపింది. ‘అతిశయం’ పౌలు వాడే ‘గొప్పగా చెప్పుకోవడం/అతిశయించడం’ అనే భావానికి తగిన గంభీర నామరూపం; దాని సాధ్యమైన ప్రతికూల ఛాయను సందర్భం మరియు పాదసూచిక సమతుల్యం చేస్తాయి.
