  terminology: “మెస్సీయ యేసు,” “మన ప్రభువు,” and “అతిశయం” are suitable in this formal Pauline register. “మీ గురించి నాకు ఉన్న అతిశయం” appropriately gives the preferred sense while the footnote preserves the syntactic alternative.
