language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐρεῖ τις· Πῶς ἐγείρονται οἱ νεκροί, ποίῳ δὲ σώματι ἔρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: te
  text: 'అయితే ఎవరైనా ఇలా అంటారు: “చనిపోయినవారు ఎలా లేపబడతారు?[a] వారు ఎలాంటి శరీరంతో వస్తారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చనిపోయినవారు ఎలా లేస్తారు?” గ్రీకు క్రియ కర్మణి ప్రయోగంలో ఉంది; అక్షరార్థంగా, “లేపబడతారు.” ఇది దేవుని కార్యాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: అయితే
  rationale: ముందటి వాదనకు భిన్నంగా ఊహాత్మక ప్రశ్నను ప్రవేశపెట్టే వ్యతిరేక సంధిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἐρεῖ τις
  choice: ఎవరైనా ఇలా అడగవచ్చు
  rationale: రూపపరంగా ‘ఎవరైనా అంటారు’ అయినప్పటికీ, వెంట వచ్చే ప్రత్యక్ష ప్రశ్నను తెలుగులో సహజంగా ప్రవేశపెట్టడానికి ‘అడగవచ్చు’ ఉపయోగించబడింది; ఇది ఊహాత్మక సంభాషణకర్త భావాన్ని నిలుపుతుంది.
- source_word: Πῶς ἐγείρονται οἱ νεκροί
  choice: చనిపోయినవారు ఎలా లేపబడతారు?
  rationale: ἐγείρονται లోని కర్మణి ప్రయోగాన్ని ‘లేపబడతారు’గా నిలిపి, పునరుత్థాన కార్యానికి సూచితమైనప్పటికీ పేరుచెప్పని కర్తను స్పష్టీకరించకుండా ఉంచుతుంది.
- source_word: ποίῳ ... σώματι
  choice: ఎలాంటి శరీరంతో
  rationale: ποίῳ లోని గుణం లేదా రకం గురించి అడిగే భావాన్ని ‘ఎలాంటి’ స్పష్టంగా తెలియజేస్తుంది; దత్తివును సహజంగా ‘శరీరంతో’గా అందిస్తుంది.
- source_word: δὲ
  choice: '?'
  rationale: తెలుగులో రెండు వరుస ప్రశ్నలను వేరుగా ఉంచడం సహజం; ప్రత్యేక సంధిపదం చేర్చకుండానే δέ యొక్క స్వల్ప అనుసంధాన భావం సందర్భంలో వ్యక్తమవుతుంది.
- source_word: ἔρχονται
  choice: వారు ... వస్తారు
  rationale: ‘వస్తారు’ అనే ప్రాథమిక అర్థాన్ని నిలిపి, దాన్ని ‘కనిపిస్తారు’ లేదా మరోసారి ‘లేపబడతారు’గా వ్యాఖ్యానాత్మకంగా మార్చదు.
theological_decisions:
- issue: పునరుత్థాన పదప్రయోగం మరియు కార్యనిర్వాహకుడు
  choice: చనిపోయినవారు ఎలా లేపబడతారు?
  alternative: చనిపోయినవారు ఎలా లేస్తారు?
  rationale: గ్రీకు కర్మణి రూపాన్ని ప్రధాన పాఠంలో నిలిపి, దేవుని కార్యాన్ని సూచించే అవకాశం ఉన్నప్పటికీ ఈ వచనం చెప్పినదానికంటే దానిని మరింత స్పష్టంగా చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు సులభంగా ఉండే ప్రశ్నారూపం. ప్రధాన పాఠంలో గ్రీకు కర్మణి ప్రయోగం మరియు రెండవ ప్రశ్నలోని ‘వస్తారు’ అనే ప్రత్యేక పదప్రయోగం సంరక్షించబడ్డాయి.
