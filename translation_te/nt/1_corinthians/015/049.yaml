source:
  edition: SBLGNT
  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: te
  text: మనం మట్టితో చేయబడిన మనిషి స్వరూపాన్ని ధరించినట్లే, పరలోకానికి చెందిన మనిషి స్వరూపాన్ని కూడా ధరిస్తాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “పరలోకానికి చెందిన మనిషి స్వరూపాన్ని కూడా ధరిద్దాం” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: ధరించినట్లే
  rationale: రెండు మానవ స్థితుల మధ్య ఉన్న సాదృశ్య సంబంధాన్ని ‘అట్లే’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐφορέσαμεν
  choice: ధరించిన
  rationale: φορέω అనే పదానికి ఇక్కడ ‘స్వరూపాన్ని ధరించడం’ అనే రూపకాలంకార భావం ఉంది. తెలుగు సందర్భంలో ఇది గత అనుభవంతో కొనసాగుతున్న మానవ స్థితిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἰκόνα
  choice: స్వరూపం
  rationale: εἰκών సూచించే ప్రతిరూపం/పోలిక భావాన్ని కాపాడుతూ, ఆదాము–క్రీస్తు సమాంతరతలో ‘స్వరూపం’ సహజమైన తెలుగు పదం.
- source_word: τοῦ χοϊκοῦ
  choice: మట్టితో చేయబడిన మనిషి
  rationale: χοϊκός యొక్క ‘మట్టితో చేసిన’ భావాన్ని, ఆదికాండపు ప్రతిధ్వనిని నిలుపుతుంది. ముందు సందర్భంలోని మొదటి మనిషిని స్పష్టంచేయడానికి ‘మనిషి’ని పూరించాం.
- source_word: φορέσομεν
  choice: ధరిస్తాం
  rationale: SBLGNTలోని భవిష్యత్ సూచక క్రియను అనుసరించి, పునరుత్థానంలో కలిగే భవిష్యత్ రూపాంతరాన్ని వాగ్దానంగా తెలియజేస్తుంది.
- source_word: τοῦ ἐπουρανίου
  choice: పరలోక సంబంధమైన మనిషి
  rationale: ἐπουράνιος అనే విశేషణంలోని ‘పరలోకానికి చెందిన’ భావాన్ని తెలియజేస్తూ, ‘మట్టితో చేయబడిన మనిషి’తో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: రెండో భాగంలో ఉన్న జోడింపు భావాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: రెండో క్రియలో భవిష్యత్ సూచక రూపమా, ప్రోత్సాహక సంభావనార్థక రూపమా
  choice: ధరిస్తాం
  alternative: ధరిద్దాం
  rationale: ముద్రిత SBLGNT పాఠం φορέσομεν అనే భవిష్యత్ సూచక రూపాన్ని కలిగి ఉంది; ఇది భవిష్యత్ పునరుత్థాన రూపాంతర నిశ్చయానికి సరిపోతుంది. ప్రాముఖ్యమైన ప్రత్యామ్నాయ పాఠాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ఆదాము–క్రీస్తు సమాంతరతను స్పష్టంగా ఉంచుతూ, మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడాం.
