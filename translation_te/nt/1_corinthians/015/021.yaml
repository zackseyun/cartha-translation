  text: ἐπειδὴ γὰρ δι’ ἀνθρώπου ⸀θάνατος, καὶ δι’ ἀνθρώπου ἀνάστασις νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: te
  text: ఎందుకంటే, ఒక మనిషి ద్వారా మరణం వచ్చింది[a][b]; ఒక మనిషి ద్వారా మృతుల పునరుత్థానం కూడా వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండు చోట్లా ‘ఒక మనిషి వలన’ అని కూడా అనువదించవచ్చు; గ్రీకు ఉపసర్గం కర్తృత్వాన్ని, సాధనాన్ని రెండింటినీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఈ సందర్భంలో ఆ ఇద్దరు మనుషులు ఆదాము మరియు మెస్సీయ అని పౌలు గుర్తిస్తున్నాడు (15:22, 45 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: ఎందుకంటే
  rationale: ఈ పదసముదాయం ముందున్న వాదనకు కారణాన్ని వివరిస్తుంది. ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఈ వివరణాత్మక-కారణార్థ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δι’ ἀνθρώπου
  choice: ఒక మనిషి ద్వారా
  rationale: διά + షష్ఠీ విభక్తి కర్తృత్వాన్ని లేదా సాధనాన్ని సూచించగలదు. ‘ద్వారా’ ఆ రెండింటి మధ్య ఉన్న భావవిస్తృతిని నిలుపుతూ, నిర్దిష్ట ఉపపదం లేని ఏకవచన ἀνθρώπουను ‘ఒక మనిషి’గా సహజంగా అందిస్తుంది.
- source_word: θάνατος
  choice: మరణం వచ్చింది
  rationale: గ్రీకు వాక్యంలో క్రియ లేకపోయినా, తెలుగులో భావం సంపూర్ణంగా ఉండేందుకు ‘వచ్చింది’ చేర్చబడింది. ఇది మరణం ఒక మనిషి ద్వారా ప్రవేశించిందనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: రెండవ అంశం మొదటిదానికి సమాంతరంగా ఉందని ‘కూడా’ స్పష్టంగా చూపిస్తుంది.
- source_word: ἀνάστασις νεκρῶν
  choice: మృతుల పునరుత్థానం
  rationale: ఈ పదబంధం చనిపోయినవారి నిజమైన లేపబడటాన్ని సూచిస్తుంది. ‘మృతుల పునరుత్థానం’ పౌలు వాదిస్తున్న భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: δι’ ἀνθρώπου
  choice: ఒక మనిషి ద్వారా
  rationale: ఆదాము-మెస్సీయ సమాంతరతను నిలుపేందుకు మొదటి భాగంలోని పదబంధమే మార్పులేకుండా పునరావృతమైంది.
theological_decisions:
- issue: ఆదాము మరియు క్రీస్తు మధ్య ప్రతినిధిత్వ సమాంతరత
  choice: రెండు భాగాల్లోనూ ‘ఒక మనిషి’ అని ఉంచి, వారి పేర్లను ప్రధాన పాఠ్యంలో చేర్చలేదు.
  alternative: ‘ఒక్క మనిషి ద్వారా’; లేదా ‘ఆదాము ద్వారా ... క్రీస్తు ద్వారా’
  rationale: సమీప సందర్భం ఆ ఇద్దరిని ఆదాము మరియు మెస్సీయగా గుర్తించినా, ఈ వచనంలో పేర్లు లేవు. మూలంలోని సంక్షిప్త సమాంతర నిర్మాణాన్ని, ఏకవచనాన్ని నిలుపుకోవడం ద్వారా వ్యాఖ్యానాన్ని పాఠ్యంలో కలపకుండా నివారించబడింది.
- issue: పునరుత్థానం యొక్క స్వభావం
  choice: ἀνάστασις νεκρῶνను ‘మృతుల పునరుత్థానం’గా అనువదించాం.
  alternative: ‘మరణానంతర జీవితం’; లేదా ‘ఆత్మీయ పునరుత్థానం’
  rationale: 1 కొరింథీయులు 15లో పౌలు మృతుల వాస్తవ పునరుత్థానాన్ని సమర్థిస్తున్నాడు. అందువల్ల దానిని అస్పష్టమైన మరణానంతర జీవితం గానీ, కేవలం ఆత్మీయ అనుభవం గానీ మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని రెండు సమాంతర భాగాలను ఒకే పదక్రమంతో సాధ్యమైనంతవరకు నిలిపి, గ్రీకులో అంతర్లీనంగా ఉన్న క్రియను తెలుగులో ‘వచ్చింది’గా స్పష్టం చేశాం.
