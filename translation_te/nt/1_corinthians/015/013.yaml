  verdict: revise
  source_fidelity: The draft accurately reflects the conditional argument, the existential denial of resurrection, the inclusive force of οὐδέ, and the passive perfect sense of ἐγήγερται. Adding a resultative expression in Telugu better represents the Greek perfect without identifying the unstated agent.
  naturalness: The wording is clear modern standard Telugu. Removing the unnecessary comma after అయితే and using ‘లేపబడి ఉండలేదు’ makes the completed event’s continuing relevance more explicit, while retaining natural formal-register usage.
  terminology: ‘పునరుత్థానం’ is appropriate for ἀνάστασις, and ‘మెస్సీయ’ correctly preserves Χριστός as a meaningful title. The alternative ‘క్రీస్తు’ belongs in a footnote. A second footnote supplies the legitimate active-style alternative without replacing the passive main-text rendering.
  issues:
  - severity: low
    issue: The main verb ‘లేపబడలేదు’ can be read simply as a past passive and does not explicitly convey the Greek perfect’s present-result force.
    rationale: ἐγήγερται is perfect passive. ‘లేపబడి ఉండలేదు’ more clearly expresses that the Messiah has not come to stand in the state of having been raised, while preserving passive voice.
  - severity: low
    issue: The draft provides only the title alternative footnote and omits the lexical alternative for the passive verb represented in the English audit trail.
    rationale: A separately anchored note at the verb can acknowledge ‘లేచి ఉండలేదు’ as an alternative while explaining that the Greek is passive. This preserves the main translation’s source-faithful passive form.
