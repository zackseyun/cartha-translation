language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ἀνάστασις νεκρῶν οὐκ ἔστιν, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/013.yaml
  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: te
  text: అయితే చనిపోయినవారి పునరుత్థానం లేకపోతే, మెస్సీయ కూడా లేపబడి ఉండలేదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు కూడా లేపబడి ఉండలేదు.” గ్రీకు Χριστός అనే బిరుదును “క్రీస్తు” లేదా “మెస్సీయ” అని అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “లేచి ఉండలేదు.” గ్రీకు క్రియ నిష్క్రియ రూపంలో ఉంది (“లేపబడి ఉండలేదు”); కార్యనిర్వాహకుడు స్పష్టంగా చెప్పబడకపోయినా, ఈ రూపం దేవుని కార్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: అయితే, … లేకపోతే
  rationale: εἰ షరతును, δέ స్వల్పమైన వాదనాత్మక మలుపును సూచిస్తాయి; ఈ తెలుగు నిర్మాణం రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνάστασις νεκρῶν
  choice: చనిపోయినవారి పునరుత్థానం
  rationale: ఇది చనిపోయిన వ్యక్తుల సమూహానికి సంబంధించిన పునరుత్థానాన్ని సూచిస్తుంది; ‘మృతులలోనుండి’ అని అనువదిస్తే గ్రీకు షష్ఠీ విభక్తి సంబంధం మూలం/స్థానం వైపు మారుతుంది.
- source_word: οὐκ ἔστιν
  choice: లేకపోతే
  rationale: పునరుత్థానం ఉనికి లేదా వాస్తవికతను నిరాకరించే భావాన్ని షరతుతో కలిపి సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὐδὲ
  choice: కూడా … లేదు
  rationale: షరతు ఫలితంగా ‘మెస్సీయ సైతం కాదు’ అనే బలమైన తార్కిక నిర్ధారణను సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός అభిషిక్తుని బిరుదుగా పనిచేస్తోంది; ‘మెస్సీయ’ దాని బిరుదార్థాన్ని నిలుపుతుంది.
- source_word: ἐγήγερται
  choice: లేపబడలేదు
  rationale: పూర్తయిన కార్యానికి వర్తమాన ప్రాసంగికత ఉన్న గ్రీకు పరిపూర్ణ నిష్క్రియార్థాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది; కార్యనిర్వాహకుడు దేవుడని వచనంలో చేర్చదు.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో ఇది కేవలం పేరులా కాక అభిషిక్తుని బిరుదుగా ఉంది; అందువల్ల అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచి, సుపరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తున్నాం.
- issue: ἐγήγερται క్రియ యొక్క ప్రయోగం
  choice: లేపబడలేదు
  alternative: లేవలేదు
  rationale: గ్రీకులోని నిష్క్రియ రూపాన్ని నిలుపుతూ, ఎవరు లేపారో స్పష్టంగా చేర్చకుండా మూలపాఠ్యంలోని సూచిత కార్యనిర్వాహకత్వాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘పునరుత్థానం’ స్థిరపడిన ధార్మిక పదం; ‘లేపబడలేదు’ గ్రీకు నిష్క్రియను కాపాడుతుంది.
