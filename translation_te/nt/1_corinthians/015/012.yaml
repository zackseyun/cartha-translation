id: 1CO.15.12
reference: 1 Corinthians 15:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: te
  text: మెస్సీయ[a] మృతులలోనుండి లేపబడ్డాడని ప్రకటించబడుతుంటే, మృతుల పునరుత్థానం లేదని మీలో కొందరు ఎలా అంటున్నారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తు.” గ్రీకు Χριστός అనే పదాన్ని “మెస్సీయ” అని గానీ “క్రీస్తు” అని గానీ అనువదించవచ్చు; ప్రధాన పాఠ్యంలో దాని బిరుదు భావాన్ని నిలిపాం.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ ఇది వ్యక్తినామం కంటే అభిషిక్తుడనే బిరుదు భావాన్ని కలిగి ఉంది; అందువల్ల ఆ బిరుదు అర్థాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: κηρύσσεται
  choice: ప్రకటించబడుతుంటే
  rationale: వర్తమానకాల కర్మణి రూపం కొనసాగుతున్న బహిరంగ ప్రకటనను సూచిస్తుంది; షరతు వాక్యంతో సహజంగా కలిసేలా అనువదించాం.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: మృతుల సమూహం మధ్యనుండి లేపబడడాన్ని సహజమైన తెలుగు పునరుత్థాన పదబంధంతో వ్యక్తం చేస్తుంది.
- source_word: ἐγήγερται
  choice: లేపబడ్డాడని
  rationale: గ్రీకు సంపూర్ణ కర్మణి రూపంలోని పూర్తయిన క్రియను, కొనసాగుతున్న ఫలితాన్ని, కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: πῶς
  choice: ఎలా
  rationale: పౌలు వ్యక్తం చేస్తున్న తార్కిక అసంగతిని అలంకారప్రశ్న రూపంలో సహజంగా నిలుపుతుంది.
- source_word: ἐν ὑμῖν τινες
  choice: మీలో కొందరు
  rationale: కొరింథు సంఘంలోనే ఉన్న ఒక ఉపవర్గాన్ని స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: ἀνάστασις νεκρῶν
  choice: మృతుల పునరుత్థానం
  rationale: ఇక్కడ ఉద్దేశించిన సాధారణ మృతుల పునరుత్థానాన్ని సూచించే స్థిరమైన, అర్థవంతమైన తెలుగు పదబంధం.
- source_word: οὐκ ἔστιν
  choice: లేదు
  rationale: అస్తిత్వాన్ని నిరాకరించే గ్రీకు నిర్మాణాన్ని సంక్షిప్తమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పౌలు వాడిన Χριστός పదానికి అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాదనలో పదం అభిషిక్తుడనే క్రీస్తుశాస్త్ర సంబంధమైన బిరుదుగా పనిచేస్తోంది. ప్రధాన పాఠ్యంలో బిరుదు భావాన్ని చూపిస్తూ, సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ἐγήγερται లోని కర్మణి భావం
  choice: లేపబడ్డాడు
  alternative: లేచాడు
  rationale: కర్మణి రూపాన్ని నిలిపి, దేవుని కార్యాన్ని సూచించే అవకాశం ఉన్న మూలపాఠ్య భావాన్ని స్పష్టీకరించకుండా సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘ పఠనానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. వాక్యంలోని అలంకారప్రశ్న బలాన్ని సహజంగా నిలిపాం; మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ వంటి పదాన్ని చేర్చలేదు.
