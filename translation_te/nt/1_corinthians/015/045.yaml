id: 1CO.15.45
reference: 1 Corinthians 15:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: te
  text: 'ఇలా కూడా వ్రాయబడి ఉంది: “మొదటి మనిషి ఆదాము సజీవ ప్రాణి[a] అయ్యాడు”; చివరి ఆదాము జీవింపజేసే ఆత్మ అయ్యాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జీవాత్మ.” ఇది ఆదికాండము 2:7లోని సంప్రదాయ అనువాదాన్ని ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “జీవాన్ని ఇచ్చే ఆత్మ అయ్యాడు.” ఈ మాట మొదటి ఆదాముకు భిన్నంగా చివరి ఆదామును వర్ణిస్తుంది. గ్రీకు పదబంధం గుణాత్మకమైనది; ఇది క్రీస్తును పరిశుద్ధాత్మతో నేరుగా సమీకరించినట్లు తప్పనిసరిగా అర్థం కాదు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: అలాగే ఇలా వ్రాయబడి ఉంది
  rationale: οὕτως καί ముందున్న వాదనకు లేఖనాధారాన్ని అనుసంధానిస్తుంది. ఈ తెలుగు రూపం ఆ సంబంధాన్ని, అలాగే లేఖన ఉల్లేఖన సూత్రాన్ని సహజంగా నిలుపుతుంది.
- source_word: Ἐγένετο
  choice: అయ్యాడు
  rationale: γίνομαι ఇక్కడ ఏర్పడిన స్థితిని సూచిస్తుంది. ‘అయ్యాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘సృష్టించబడ్డాడు’ వంటి మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: మొదటి మనిషి
  rationale: ἄνθρωπος సాధారణంగా మానవుణ్ణి సూచించగలిగినా, ఇక్కడ ‘చివరి ఆదాము’తో ఉన్న ప్రతినిధిత్వ, ప్రతిరూప సంబంధమైన వ్యత్యాసం వల్ల ‘మొదటి మనిషి’ సరైనది.
- source_word: Ἀδὰμ
  choice: ఆదాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: సజీవ ప్రాణి
  rationale: ఇది ఆదికాండము 2:7ను ప్రతిధ్వనిస్తుంది. ψυχή ఇక్కడ వేరుగా ఉండే అభౌతిక భాగాన్ని మాత్రమే కాక, జీవంతో ఉన్న సంపూర్ణ ప్రాణిని సూచిస్తుంది. ‘సజీవ ప్రాణి’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: చివరి ఆదాము
  rationale: ἔσχατος‌లోని అంతిమ, ప్రతిరూప సంబంధమైన భావాన్ని ‘చివరి ఆదాము’ స్థిరంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: జీవింపజేసే ఆత్మ
  rationale: ζῳοποιοῦν అంటే జీవింపజేయడం లేదా సజీవం చేయడం. πνεῦμα నిర్దిష్ట ఉపపదం లేకుండా గుణాత్మకంగా ఉంది; అందువల్ల ‘జీవింపజేసే ఆత్మ’ మూలంలోని సంక్షిప్తతను, ఉద్దేశపూర్వక ఉద్రిక్తతను కాపాడుతుంది.
theological_decisions:
- issue: ఆదికాండము ఉల్లేఖనంలో ψυχή యొక్క మానవశాస్త్ర సంబంధమైన భావం
  choice: ψυχὴν ζῶσανను ‘సజీవ ప్రాణి’గా అనువదించడం
  alternative: ‘జీవాత్మ’
  rationale: ఈ సందర్భంలో ఆదాము జీవంతో ఉన్న సంపూర్ణ ప్రాణిగా అయ్యాడనే భావం ప్రధానమైనది; వేరుగా ఉండే అభౌతిక ఆత్మ గురించి వచనం స్పష్టంగా నిర్వచించడం లేదు. సంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచడం ద్వారా దాని పరిచయాన్ని కూడా కాపాడాం.
- issue: ‘చివరి ఆదాము జీవింపజేసే ఆత్మ అయ్యాడు’ అనే మాట యొక్క అర్థం
  choice: ప్రతిరూప సంబంధమైన వ్యత్యాసాన్ని వివరణాత్మక విస్తరణ లేకుండా యథాతథంగా ఉంచడం
  alternative: ‘చివరి ఆదాము జీవాన్ని ఇచ్చే ఆత్మ అయ్యాడు’ లేదా ‘జీవింపజేసే పరిశుద్ధాత్మ అయ్యాడు’
  rationale: πνεῦμα ముందు నిర్దిష్ట ఉపపదం లేదు; వాక్యభాగం గుణాత్మకంగా ఉంది. కాబట్టి దాన్ని పరిశుద్ధాత్మ అనే ప్రత్యేక వ్యక్తితో స్పష్టమైన సమీకరణగా మార్చకుండా, క్రీస్తును గూర్చిన పౌలు మాటలోని భావసాంద్రతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘సజీవ ప్రాణి’ సాధారణ పాఠకునికి స్పష్టంగా ఉండగా, ‘జీవాత్మ’ను సంప్రదాయ ప్రత్యామ్నాయంగా పాదసూచికలో నిలిపాం. ‘జీవింపజేసే ఆత్మ’ మూలంలోని క్రీస్తు–ఆదాము వ్యత్యాసాన్ని సిద్ధాంతపరమైన అదనపు వివరణ లేకుండా కాపాడుతుంది.
