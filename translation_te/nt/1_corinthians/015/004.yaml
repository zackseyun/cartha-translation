lexical_decisions:
- source_word: ἐτάφη
  choice: సమాధి చేయబడ్డాడు
  rationale: θάπτω అనే క్రియ యొక్క భూతకాల కర్మణి రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; మూలంలో లేని సమాధి స్థల వివరాలను చేర్చదు.
- source_word: ἐγήγερται
  choice: లేపబడ్డాడు
  rationale: ἐγείρω యొక్క కర్మణి ప్రయోగాన్ని నిలుపుతుంది. తెలుగు ప్రధాన వాక్యంలో సహజత్వం కోసం ఈ రూపాన్ని వాడి, గ్రీకు సంపూర్ణ కాలంలోని కొనసాగుతున్న ప్రాముఖ్యతను పాదసూచికలో తెలిపాం.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: మూడవ రోజున
  rationale: కాలాన్ని సూచించే దత్తి విభక్తి పదబంధానికి సహజమైన తెలుగు సమానార్థకం; మూలంలో లేని ‘తర్వాత’ అనే మాటను చేర్చదు.
- source_word: κατὰ τὰς γραφάς
  choice: లేఖనాల ప్రకారం
  rationale: లేఖన సాక్ష్యానికి అనుగుణంగా ఈ సంఘటన జరిగిందనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: γραϕάς
  choice: లేఖనాలు
  rationale: సాధారణ రచనలను కాక, గుర్తింపుపొందిన పవిత్ర లేఖనాలను సూచించే పౌలు వాడుకను ప్రతిబింబిస్తుంది.
- source_word: ὅτι
  choice: అనీ
  rationale: విశ్వాస ప్రకటనలో వరుసగా వచ్చే విషయవాక్యాల నిర్మాణాన్ని తెలుగులో నిలుపుతుంది.
- source_word: καὶ
  choice: —నీ, … —నీ
  rationale: గ్రీకులో పునరావృతమయ్యే అనుసంధానాన్ని తెలుగులో సహజమైన సముచ్చయ నిర్మాణంతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: పునరుత్థాన క్రియలో కాలదృష్టి మరియు కర్మణి ప్రయోగం
  choice: లేపబడ్డాడు
  alternative: లేపబడి ఉన్నాడు
  rationale: కర్మణి ప్రయోగాన్ని స్పష్టంగా నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది. గ్రీకు సంపూర్ణ కాలం గతంలో జరిగిన కార్యంతో పాటు దాని కొనసాగుతున్న ఫలితాన్ని సూచించగలదనే అంశాన్ని పాదసూచికలో ఉంచి, ప్రధాన పాఠాన్ని అసహజంగా చేయలేదు.
- issue: ‘లేఖనాలు’ అనే పదం సూచించే గ్రంథసమూహం
  choice: లేఖనాలు
  alternative: పవిత్ర లేఖనాలు
  rationale: మూలపాఠంలో ప్రత్యేకణం లేకుండానే గుర్తింపుపొందిన లేఖనాలను సూచిస్తుంది. ‘పవిత్ర’ అని చేర్చడం భావాన్ని వివరించినా, మూలంలో లేని పదాన్ని ప్రధాన పాఠంలో చేర్చుతుంది.
- issue: ‘లేఖనాల ప్రకారం’ అనే పదబంధం అనుసంధానం
  choice: పునరుత్థాన ప్రకటనతో నేరుగా అనుసంధానించడం
  alternative: సమాధి మరియు పునరుత్థానం రెండింటికీ వర్తింపజేయడం
  rationale: గ్రీకు వాక్యనిర్మాణంలో ఈ పదబంధం మూడవ రోజున లేపబడటాన్ని వెంటనే అనుసరిస్తుంది. అయినప్పటికీ విస్తృత సందర్భంలో పునరావృత సూత్రబద్ధ నిర్మాణం ఉన్నందున దాని భావపరిధిని అనవసరంగా మరింత కుదించలేదు.
