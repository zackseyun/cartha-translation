  register: ఆధునిక ప్రామాణిక తెలుగు; విశ్వాస ప్రకటనకు తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం. ముందరి వచనంతో కొనసాగే జాబితా నిర్మాణాన్ని చూపేందుకు చివర కామాను నిలిపాం.
