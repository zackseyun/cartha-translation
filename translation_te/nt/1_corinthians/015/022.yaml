id: 1CO.15.22
reference: 1 Corinthians 15:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: te
  text: ఎందుకంటే, ఆదాములో అందరూ మరణిస్తున్నట్లే, మెస్సీయలో అందరూ సజీవులుగా చేయబడతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మెస్సీయలో’కు బదులుగా ‘క్రీస్తులో’ అని కూడా అనువదించవచ్చు. గ్రీకు Χριστός అనే బిరుదును ‘మెస్సీయ’ అని అనువదించవచ్చు లేదా ‘క్రీస్తు’ అని లిప్యంతరీకరించవచ్చు.
    reason: alternative_rendering
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ఎందుకంటే, ...ట్లే
  rationale: γάρ యొక్క వివరణాత్మక అనుసంధానాన్ని ‘ఎందుకంటే’తో, ὥσπερ యొక్క పోలికను ‘ట్లే’తో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ Ἀδὰμ
  choice: ఆదాములో
  rationale: ἐν యొక్క సంక్షిప్తమైన సంబంధార్థాన్ని అతిగా వివరించకుండా, ఆదాముతో ఉన్న ప్రతినిధిత్వ/సామూహిక సంబంధంలోని అస్పష్టతను నిలుపుతుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: రెండు చోట్లా ఉన్న πάντες యొక్క విస్తృతమైన, పరిమితం చేయని భావాన్ని మరియు వాక్య సమాంతరతను కాపాడుతుంది.
- source_word: ἀποθνῄσκουσιν
  choice: చనిపోతున్నారు
  rationale: వర్తమాన కాలంలోని సాధారణంగా కొనసాగుతున్న వాస్తవాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οὕτως καὶ
  choice: అలాగే
  rationale: మొదటి భాగంతో ఉన్న సహసంబంధ పోలికను, καί యొక్క అదనపు బలాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐν τῷ Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; సంప్రదాయ లిప్యంతరీకరణకన్నా దాని అర్థాన్ని తెలుగులో తెలియజేస్తూ ‘ఆదాములో’ అనే సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ζῳοποιηθήσονται
  choice: సజీవులుగా చేయబడతారు
  rationale: భవిష్యత్ కాలాన్నీ కర్మణి ప్రయోగాన్నీ నిలుపుతూ, జీవింపజేసే కార్యం వారిపై జరుగుతుందని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: రెండు భాగాల్లోని ‘అందరూ’ అనే పదం యొక్క పరిధి
  choice: రెండు చోట్లా ‘అందరూ’ అని ఎలాంటి పరిమితి చేర్చకుండా ఉంచడం
  alternative: రెండవ ‘అందరూ’ను కేవలం విశ్వాసులకే పరిమితం చేయడం, లేదా రెండు సందర్భాలూ ప్రతి విషయంలో ఒకే పరిధిని సూచిస్తున్నాయని అనువాదంలోనే నిర్ణయించడం
  rationale: గ్రీకు వాక్యం πάντες... πάντες అనే ఉద్దేశపూర్వక సమాంతరతను ఇస్తుంది; దాని ఖచ్చితమైన ధార్మిక పరిధిని ఈ వాక్యంలో వివరించదు. అందువల్ల అనువాదం ఆ ఉద్వేగాన్ని పరిష్కరించదు.
- issue: ἐν అనే పదంలోని సంబంధ భావం
  choice: ‘ఆదాములో’, ‘మెస్సీయలో’ అనే సమాంతర రూపాలను ఉంచడం
  alternative: ‘ఆదాము ద్వారా’, ‘మెస్సీయతో ఐక్యంలో’ అని వివరణాత్మకంగా అనువదించడం
  rationale: ‘ద్వారా’ అనేది సాధనార్థాన్ని, ‘ఐక్యంలో’ అనేది ఒక నిర్దిష్ట ధార్మిక వివరణను ముందుకు తెస్తాయి. మూలంలోని సంక్షిప్తత, అస్పష్టతను ‘లో’ మెరుగ్గా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘ఆదాములో ... మెస్సీయలో’ అనే పౌలు వాడిన సంక్షిప్త సమాంతర నిర్మాణాన్ని నిలిపి, వివరణాత్మక పదాలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
