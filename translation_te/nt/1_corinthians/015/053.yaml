review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the necessity expressed by δεῖ, the explanatory γάρ, the repeated clothing metaphor (ἐνδύσασθαι), and the parallel contrast between perishable/imperishable and mortal/immortal. Supplying “శరీరం” is contextually justified, provided the footnote retains the Greek’s more compact wording. However, “నశించిపోయే” can suggest something that has already been destroyed or is in the process of vanishing, rather than φθαρτόν, which denotes what is subject to decay/perishing. “క్షయమయ్యే” more closely preserves the lexical contrast with ἀφθαρσία.
  naturalness: The sentence structure and use of “ధరించుకోవాలి” are natural modern Telugu and retain the metaphor. “క్షయమయ్యే / అక్షయత్వం” is a more idiomatic and readily recognizable paired expression than “నశించిపోయే / నాశరహితత్వం.”
  terminology: Use “క్షయమయ్యే” for φθαρτόν and “అక్షయత్వం” for ἀφθαρσία, preserving Paul’s deliberate lexical antithesis. “మరణానికి లోబడిన” and “అమరత్వం” accurately and naturally render θνητόν and ἀθανασίαν. No doctrinal expansion is introduced by the supplied “శరీరం,” and the footnote appropriately identifies it as contextual.
  issues:
  - severity: medium
    issue: “నశించిపోయే” for φθαρτόν
    rationale: This wording may imply completed destruction (“has perished”) or imminent disappearance, whereas the Greek describes the present perishable/decay-prone condition. “క్షయమయ్యే” conveys susceptibility to decay and forms a clear contrast with “అక్షయత్వం.”
  - severity: low
    issue: “నాశరహితత్వం” for ἀφθαρσίαν
    rationale: Though understandable, it is less natural and less established in modern Telugu than “అక్షయత్వం.” The latter also makes the intended contrast with “క్షయమయ్యే” transparent.
  revised_text: ఎందుకంటే ఈ క్షయమయ్యే శరీరం అక్షయత్వాన్ని ధరించుకోవాలి; మరణానికి లోబడిన ఈ శరీరం అమరత్వాన్ని ధరించుకోవాలి.[a]
