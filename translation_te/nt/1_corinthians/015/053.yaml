  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: te
  text: ఎందుకంటే ఈ క్షయమయ్యే శరీరం అక్షయత్వాన్ని ధరించుకోవాలి; మరణానికి లోబడిన ఈ శరీరం అమరత్వాన్ని ధరించుకోవాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఈ క్షయమయ్యేది అక్షయత్వాన్ని ధరించుకోవాలి; ఈ మరణానికి లోబడినది అమరత్వాన్ని ధరించుకోవాలి.” ఈ వచనంలోని గ్రీకు పాఠ్యంలో “శరీరం” అనే పదం ప్రత్యక్షంగా లేదు; అయితే సందర్భం శరీరాన్నే సూచిస్తున్నట్లు స్పష్టంగా ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: ధరించుకోవాలి
  rationale: గ్రీకు పదంలోని అవసరతను తెలుగులో సహజంగా తెలిపేందుకు క్రియకు ‘-ాలి’ రూపం వాడబడింది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యానికి ఈ వచనం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: నశించిపోయే ఈ శరీరం
  rationale: φθαρτός క్షయం లేదా నాశనానికి లోబడేదాన్ని సూచిస్తుంది. ‘శరీరం’ గ్రీకులో ప్రత్యక్షంగా లేకపోయినా, శరీర పునరుత్థానాన్ని చర్చిస్తున్న సందర్భం దాని సూచ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐνδύσασθαι
  choice: ధరించుకోవాలి
  rationale: వస్త్రాన్ని ధరించే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀφθαρσίαν
  choice: నాశరహితత్వాన్ని
  rationale: నాశనానికి లేదా క్షయానికి లోబడని స్థితిని తెలుపుతూ φθαρτόςతో ఉన్న వ్యతిరేకతను నిలుపుతుంది.
- source_word: καὶ
  choice: మరియు భావాన్ని విరామచిహ్నంతో అనుసంధానం
  rationale: రెండు సమాంతర వాక్యభాగాలను తెలుగులో సహజంగా సెమికోలన్‌తో కలిపింది; సమన్వయ భావం యథాతథంగా ఉంది.
- source_word: τὸ θνητὸν τοῦτο
  choice: మరణానికి లోబడిన ఈ శరీరం
  rationale: θνητός అంటే మరణించగల లేదా మరణానికి లోబడినది. ‘మర్త్యమైన’ కంటే ఈ రూపం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: ἀθανασίαν
  choice: అమరత్వాన్ని
  rationale: మరణానికి లోబడని స్థితికి ప్రామాణికమైన, సహజమైన తెలుగు పదం.
theological_decisions:
- issue: ఈ వచనంలో σώμα లేకపోయినా ‘శరీరం’ అని స్పష్టీకరించడం
  choice: రెండు వాక్యభాగాల్లోనూ ‘ఈ శరీరం’ అని ఇచ్చింది
  alternative: ‘నశించిపోయేది నాశరహితత్వాన్ని ధరించుకోవాలి; మరణానికి లోబడినది అమరత్వాన్ని ధరించుకోవాలి’
  rationale: 15:42–54 సందర్భం శరీర పునరుత్థానం మరియు రూపాంతరాన్ని స్పష్టంగా చర్చిస్తుంది. కాబట్టి సూచ్యాన్ని స్పష్టం చేయడం కొత్త సిద్ధాంతార్థాన్ని చేర్చదు; అయితే మూలంలోని సంక్షిప్త రూపాన్ని పాదటిప్పణిలో తెలియజేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని వస్త్రధారణ రూపకం మరియు నశించడం/నాశరహితత్వం, మరణం/అమరత్వం అనే సమాంతర వ్యతిరేకతలు నిలుపబడ్డాయి.
