- from: ఎందుకంటే, నశించిపోయే ఈ శరీరం నాశరహితత్వాన్ని ధరించుకోవాలి; మరణానికి లోబడిన ఈ శరీరం అమరత్వాన్ని ధరించుకోవాలి.[a]
  to: ఎందుకంటే ఈ క్షయమయ్యే శరీరం అక్షయత్వాన్ని ధరించుకోవాలి; మరణానికి లోబడిన ఈ శరీరం అమరత్వాన్ని ధరించుకోవాలి.[a]
