id: 1CO.15.57
reference: 1 Corinthians 15:57
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: te
  text: అయితే మన ప్రభువైన యేసు మెస్సీయ ద్వారా మనకు విజయాన్ని ఇస్తున్న దేవునికి కృతజ్ఞతలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మరణంపై విజయాన్ని గురించి ముందున్న మాటల నుంచి కృతజ్ఞతాస్తుతికి వచ్చే స్వల్ప వ్యత్యాసాన్ని, మార్పును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τῷ θεῷ χάρις
  choice: దేవునికి కృతజ్ఞతలు
  rationale: ఇక్కడ χάρις ‘కృప’ అనే అర్థంలో కాక, దేవునికి కృతజ్ఞత చెల్లించే స్థిరమైన గ్రీకు ప్రయోగంలో ఉంది.
- source_word: τῷ διδόντι
  choice: అనుగ్రహిస్తున్న
  rationale: దేవుడు విజయాన్ని ఇచ్చేవాడని తెలిపే వర్తమానకాల కృదంతపు కొనసాగుతున్న లేదా సాధారణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡμῖν
  choice: మనకు
  rationale: విజయాన్ని పొందేవారిని సూచించే దత్తివాచక సర్వనామానికి ప్రత్యక్ష సమానం.
- source_word: τὸ νῖκος
  choice: విజయాన్ని
  rationale: ముందు ప్రస్తావించిన మరణంపై నిర్దిష్టమైన అంతిమ విజయాన్ని సూచిస్తుంది.
- source_word: διὰ
  choice: ద్వారా
  rationale: షష్ఠీ విభక్తితో ఉన్న διά సాధనాన్ని లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది.
- source_word: τοῦ κυρίου ἡμῶν
  choice: మన ప్రభువైన
  rationale: క్రీస్తుకు వర్తించే κύριος బిరుదును ‘ప్రభువు’గా, ἡμῶνను ‘మన’గా సహజ తెలుగు నిర్మాణంలో అందిస్తుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Ἰησοῦను పేరుగా లిప్యంతరీకరించి, Χριστοῦలోని బిరుదు భావాన్ని ‘మెస్సీయ’గా అనువదిస్తుంది; సంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστοῦను ఎలా అందించాలి
  choice: ప్రధాన పాఠ్యంలో ‘యేసు మెస్సీయ’
  alternative: ‘యేసు క్రీస్తు’
  rationale: Χριστός ఇక్కడ పేరు వంటి స్థిర ప్రయోగంగా వినిపించగలిగినా, దాని ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావం సజీవంగానే ఉంది. అందువల్ల ప్రధాన పాఠ్యం అర్థాన్ని అనువదిస్తుంది; సంప్రదాయ రూపాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కృతజ్ఞతాస్తుతి శైలి. గ్రీకు వాక్యంలోని దృష్టి దేవునిపై నిలిచేలా తెలుగు వాక్యాంతంలో ‘దేవునికి కృతజ్ఞతలు’ ఉంచబడింది.
