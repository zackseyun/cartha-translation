id: 1CO.15.14
reference: 1 Corinthians 15:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: te
  text: కానీ మెస్సీయ[a] లేపబడి ఉండకపోతే, అయితే మా ప్రకటన శూన్యమే[b]; మీ విశ్వాసమూ[c] శూన్యమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “క్రీస్తు” (గ్రీకు: క్రిస్టోస్).'
    reason: alternative_reading
  - marker: b
    text: “శూన్యమే” అనే రెండు సందర్భాల్లోనూ “వ్యర్థమే” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “మీ నమ్మకమూ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστός యొక్క బిరుదు భావాన్ని స్పష్టంగా నిలుపుతుంది; ఈ పునరుత్థాన వాదనలో మెస్సీయ పదవి సందర్భోచితంగా ఉంది.
- source_word: ἐγήγερται
  choice: లేపబడకపోయి ఉంటే
  rationale: పరిపూర్ణకాల కర్మణి రూపాన్ని నిలుపుతూ, లేపబడిన చర్యకు కొనసాగుతున్న ఫలితస్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἄρα
  choice: అయితే … శూన్యమే
  rationale: షరతు నుండి వచ్చే తార్కిక నిర్ధారణను తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κήρυγμα
  choice: ప్రకటన
  rationale: కేవలం ప్రసంగించే చర్యకు పరిమితం కాకుండా, బహిరంగంగా ప్రకటించబడే సందేశం అనే భావాన్ని అందిస్తుంది.
- source_word: κενὸν / κενὴ
  choice: శూన్యమే
  rationale: విషయసారం లేదా చెల్లుబాటు లేనిదనే భావాన్ని నిలుపుతుంది; రెండు చోట్ల ఒకే పదాన్ని వాడి పౌలు సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఇక్కడ కొరింథీయుల నమ్మక స్పందనను సూచించే సహజమైన, స్థిరమైన తెలుగు పదం.
theological_decisions:
- issue: పునరుత్థాన క్రియలో కర్తృత్వం
  choice: లేపబడకపోయి ఉంటే
  alternative: తిరిగి లేచి ఉండకపోతే
  rationale: గ్రీకు కర్మణి రూపాన్ని కాపాడి, దేవుడు మెస్సీయను లేపాడనే అంతర్నిహిత భావాన్ని చెరపకుండా ఉంచుతుంది; అదే సమయంలో వచనం చెప్పనిదాన్ని అదనంగా నిర్ధారించదు.
- issue: Χριστός బిరుదా లేక పేరులాంటి రూపమా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో అభిషిక్తుడనే బిరుదు భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంచుతుంది; సంప్రదాయ రూపాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని షరతు, తార్కిక ఫలితం, ‘ప్రకటన—విశ్వాసం’ సమాంతరత, అలాగే κενός పదపునరుక్తి నిలుపబడ్డాయి.
