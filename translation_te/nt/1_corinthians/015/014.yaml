- from: అయితే మెస్సీయ[a] లేపబడకపోయి ఉంటే, మా ప్రకటన శూన్యమే[b]; మీ విశ్వాసమూ[c] శూన్యమే.
  to: కానీ మెస్సీయ[a] లేపబడి ఉండకపోతే, అయితే మా ప్రకటన శూన్యమే[b]; మీ విశ్వాసమూ[c] శూన్యమే.
  rationale: The revision explicitly renders both the mild contrast (δέ, 'కానీ') and the inference (ἄρα, 'అయితే'). It also replaces an awkward passive conditional with a natural Telugu form that retains the source's perfect passive. All lexical choices and footnote anchors remain intact.
