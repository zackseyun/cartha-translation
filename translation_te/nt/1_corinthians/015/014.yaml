review_pass:
  verdict: revise
  source_fidelity: The draft preserves the conditional argument, the passive resurrection verb, the proclamation/faith parallelism, and the repeated κενός wording. However, ἄρα ('then/therefore') is not explicitly represented; the initial అయితే chiefly renders the conditional/contrastive opening and should not carry the inference alone.
  naturalness: మెస్సీయ లేపబడకపోయి ఉంటే is understandable but somewhat cumbersome in modern standard Telugu. మెస్సీయ లేపబడి ఉండకపోతే is a more natural conditional perfect-passive expression. Adding అయితే before the result makes Paul's inference clear and idiomatic.
  terminology: మెస్సీయ appropriately preserves the titular force of Χριστός, with క్రీస్తు supplied as an alternative. లేపబడి ఉండకపోతే retains the passive voice without specifying the agent. ప్రకటన, విశ్వాసం, and the repeated శూన్యమే are suitable and preserve the rhetorical parallelism.
  issues:
  - severity: medium
    issue: The logical particle ἄρα is not explicitly translated.
    rationale: The opening అయితే can introduce the condition ('if/however'), but the Greek also marks the consequent with ἄρα ('then/therefore'). Adding అయితే before the main clause preserves the logical structure without adding interpretation.
  - severity: low
    issue: లేపబడకపోయి ఉంటే is less idiomatic than a perfect-passive conditional form.
    rationale: లేపబడి ఉండకపోతే naturally expresses 'has not been raised' in a conditional while retaining the Greek passive and perfect-result sense.
  revised_text: కానీ మెస్సీయ[a] లేపబడి ఉండకపోతే, అయితే మా ప్రకటన శూన్యమే[b]; మీ విశ్వాసమూ[c] శూన్యమే.
