id: 1CO.15.15
reference: 1 Corinthians 15:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: te
  text: అప్పుడు మేము దేవుని గురించి అబద్ధసాక్షులమని కూడా తేలుతాము; ఎందుకంటే దేవుడు మెస్సీయను లేపాడని మేము దేవునికి విరోధంగా[a] సాక్ష్యమిచ్చాము. నిజంగా మృతులు లేపబడకపోతే, ఆయన మెస్సీయను లేపలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని గురించి సాక్ష్యమిచ్చాము.” ఇక్కడ గ్రీకు κατὰ τοῦ θεοῦ అనే పదబంధానికి సాధారణంగా “దేవునికి విరోధంగా” అనే అర్థం ఉంటుంది; అయితే ఈ సందర్భంలో దీనిని “దేవుని గురించి” అనే సంబంధార్థంలో కూడా కొందరు అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρισκόμεθα δὲ καὶ
  choice: అప్పుడు ... అని కూడా తేలుతుంది
  rationale: ముందటి వాదన నుంచి వచ్చే తార్కిక పరిణామాన్ని ‘అప్పుడు’ తెలియజేస్తుంది; καὶ యొక్క ఉద్ఘాటనను ‘కూడా’ నిలుపుతుంది. వర్తమాన కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘తేలుతుంది’ వ్యక్తం చేస్తుంది.
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: దేవుని గురించి అబద్ధసాక్షులు
  rationale: ψευδομάρτυρες కు ‘అబద్ధసాక్షులు’ న్యాయస్థాన/సాక్ష్యార్థాన్ని కాపాడుతుంది. జనిటివ్ τοῦ θεοῦ ను ఇక్కడ సాక్ష్యపు విషయంగా గ్రహించడం సహజం; తరువాతి κατὰ τοῦ θεοῦ తో ఉన్న భేదాన్ని కూడా నిలుపుతుంది.
- source_word: ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ
  choice: మేము దేవునికి విరోధంగా సాక్ష్యమిచ్చాము
  rationale: κατά + జనిటివ్ సాధారణంగా ‘విరోధంగా/ఎదురుగా’ అనే బలమైన అర్థాన్ని ఇస్తుంది. దేవుడు చేయని కార్యాన్ని ఆయనకు ఆపాదించినట్లయితే అపొస్తలుల సాక్ష్యం దేవునికి విరోధంగా నిలుస్తుందనే వాదన తీవ్రతను ఇది కాపాడుతుంది.
- source_word: ἤγειρεν τὸν Χριστόν
  choice: మెస్సీయను లేపాడు
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించబడింది. ἐγείρω కు ‘లేపు’ పునరుత్థాన సందర్భంలో సహజంగా ఉండి, దేవుడు చేసిన కార్యాన్ని సూచిస్తుంది.
- source_word: εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται
  choice: మృతులు నిజంగా లేపబడకపోతే
  rationale: εἴπερ ἄρα యొక్క వాదనాత్మక షరతును ‘నిజంగా ... కాకపోతే’ తెలియజేస్తుంది. కర్మణి రూపమైన ἐγείρονται ను ‘లేపబడటం’గా ఉంచి, మృతులపై జరిగే కార్యం అనే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: Χριστός యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: నిర్దిష్ట ఆర్టికల్‌తో వచ్చిన τὸν Χριστόν ఈ పునరుత్థాన వాదనలో బిరుదు భావాన్ని కలిగి ఉంది; అందువల్ల లిప్యంతరీకరణకన్నా బిరుదు అర్థాన్ని అనువదించడం సముచితం.
- issue: κατὰ τοῦ θεοῦ యొక్క భావం
  choice: దేవునికి విరోధంగా
  alternative: దేవుని గురించి
  rationale: 'κατά + జనిటివ్ యొక్క సాధారణ ప్రతికూల భావాన్ని ఎంచుకోవడం ద్వారా పౌలు వాదనలోని తీవ్రత నిలుస్తుంది: దేవుడు చేయని పనిని ఆయన చేశాడని చెప్పడం ఆయనకు విరోధమైన అబద్ధసాక్ష్యమవుతుంది. అయితే ‘దేవుని గురించి’ అనే సంబంధార్థ పఠనం సాధ్యమని పాదసూచనలో గుర్తించబడింది.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని పొడవైన నిర్మాణాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; షరతు వాక్యాన్ని చివరి వాక్యానికి ముందు ఉంచి సహజ తెలుగు క్రమాన్ని అనుసరించాం. ప్రధాన పాఠంలో ‘దేవుని గురించి’ (τοῦ θεοῦ) మరియు ‘దేవునికి విరోధంగా’ (κατὰ τοῦ θεοῦ) మధ్య భావభేదాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
