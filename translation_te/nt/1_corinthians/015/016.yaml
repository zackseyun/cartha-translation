  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: te
  text: ఎందుకంటే, చనిపోయినవారు లేపబడకపోతే, మెస్సీయ[a] కూడా లేపబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రీస్తు.” గ్రీకు బిరుదైన Χριστόςను “మెస్సీయ” అని లేదా దీర్ఘకాలిక సంప్రదాయం ప్రకారం “క్రీస్తు” అని అనువదించవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ఎందుకంటే, … కాకపోతే
  rationale: γάρ సూచించే వివరణాత్మక వాదనను ‘ఎందుకంటే’తో, εἰ షరతును ‘కాకపోతే’తో సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: νεκροὶ
  choice: చనిపోయినవారు
  rationale: నామవాచకంగా వాడిన బహువచన విశేషణం సాధారణంగా మృతులైన వ్యక్తులను సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: οὐκ ἐγείρονται
  choice: లేపబడకపోతే
  rationale: పునరుత్థాన సందర్భంలోని వర్తమాన కర్మణి రూపాన్ని నిలుపుతూ, ‘తామే లేస్తారు’ అనే అకర్మక భావాన్ని చేర్చకుండా ఉంటుంది.
- source_word: οὐδὲ
  choice: కూడా … లేదు
  rationale: 'షరతు వల్ల కలిగే బలమైన పర్యవసానాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది: మృతులు లేపబడకపోతే మెస్సీయ సైతం లేపబడలేదు.'
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్న భావాన్ని అనువదించి, అభిషిక్తుడైన వాని గురించిన పౌలు వాదనను పారదర్శకంగా ఉంచుతుంది.
- source_word: ἐγήγερται
  choice: లేపబడలేదు
  rationale: పూర్తయిన కార్యాన్ని, దాని నిలిచివున్న ఫలితాన్ని సూచించే పరిపూర్ణ కర్మణి భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తం చేస్తూ కర్మణి రూపాన్ని కాపాడుతుంది.
theological_decisions:
- issue: పునరుత్థాన వాదనలో Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός కేవలం పేరులా కాక బిరుదుగా అర్థవంతంగా ఉంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని స్పష్టపరుస్తుంది; దీర్ఘకాలిక సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, పౌలు వాదనలోని కారణ–షరతు సంబంధాన్ని మరియు రెండు కర్మణి క్రియల అనుసంధానాన్ని నిలిపిన గౌరవప్రదమైన శైలి.
