revisions:
- from: 'సోదరులారా[a], నేను చెప్పేది ఇదే: శరీర రక్తాలు దేవుని రాజ్యాన్ని వారసత్వంగా పొందలేవు[b]; అలాగే క్షయమయ్యేది అక్షయమైనదాన్ని వారసత్వంగా పొందదు.'
  to: 'సోదరులారా[a], నేను ఇది చెబుతున్నాను: మాంసమూ రక్తమూ దేవుని రాజ్యాన్ని వారసత్వంగా పొందలేవు[b]; అలాగే క్షయానికి లోనైనది అక్షయత్వాన్ని వారసత్వంగా పొందదు.'
  rationale: 'The revision replaces an unnatural literalism with the normal Telugu equivalent for “flesh and blood,” while the footnote preserves its contextual sense. It also restores the Greek abstract noun contrast in the final clause: that which is subject to decay cannot inherit imperishability. The source’s parallelism, inability language, inheritance motif, and theological restraint are retained.'
