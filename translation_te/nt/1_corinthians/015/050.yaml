id: 1CO.15.50
reference: 1 Corinthians 15:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: te
  text: 'సోదరులారా[a], నేను ఇది చెబుతున్నాను: మాంసమూ రక్తమూ దేవుని రాజ్యాన్ని వారసత్వంగా పొందలేవు[b]; అలాగే క్షయానికి లోనైనది అక్షయత్వాన్ని వారసత్వంగా పొందదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సోదర సోదరీమణులారా.” గ్రీకులో “సోదరులు” అని ఉంది; అది సంఘంలోని వారందరినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మాంసమూ రక్తమూ” అనేది ప్రస్తుత స్థితిలోని మర్త్య మానవ జీవితాన్ని సూచించే నుడికారం; ఇది శరీర పునరుత్థానాన్ని నిరాకరించడం కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: నేను చెప్పేది ఇదే
  rationale: δέ యొక్క సంధాన భావాన్ని తెలుగు వాక్యప్రవాహంలో సహజంగా ఉంచుతూ, φημι యొక్క ప్రత్యక్ష వివరణాత్మక శైలిని కాపాడుతుంది; మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ను చేర్చదు.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పుంలింగ బహువచన సంబోధనను ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భంలో సంఘమంతటినీ ఉద్దేశించే అవకాశం పాదటిప్పణిలో తెలియజేయబడింది.
- source_word: σὰρξ καὶ αἷμα
  choice: శరీర రక్తాలు
  rationale: ప్రస్తుత మర్త్య మానవ స్థితిని సూచించే మూలభాషా నుడికారంలోని రెండు అంశాలను సూటిగా నిలుపుతుంది.
- source_word: βασιλείαν θεοῦ
  choice: దేవుని రాజ్యాన్ని
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని, స్థిరమైన వేదాంత పదబంధాన్ని సహజ తెలుగులో కాపాడుతుంది.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: వారసత్వంగా పొందలేవు / వారసత్వంగా పొందదు
  rationale: κληρονομέω లోని వారసత్వ భావాన్ని రెండు సమాంతర భాగాల్లోనూ స్పష్టంగా నిలుపుతుంది.
- source_word: ἡ φθορά
  choice: క్షయమయ్యేది
  rationale: పునరుత్థాన సందర్భంలో నశ్వరతకు, క్షయానికి లోబడిన స్థితిని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὴν ἀφθαρσίαν
  choice: అక్షయమైనదాన్ని
  rationale: φθοράతో ఉన్న పదబంధ విరుద్ధతను కాపాడుతూ, ἀθανασίαకు సరిపోయే ‘అమరత్వం’ అనే వేరే భావాన్ని ఇక్కడ కలపదు.
theological_decisions:
- issue: పునరుత్థానానికి సంబంధించి ‘శరీర రక్తాలు’ అనే మాట అర్థం
  choice: ప్రస్తుత క్షయశీలమైన మర్త్య మానవ జీవస్థితిని సూచించే నుడికారంగా ఉంచడం
  alternative: భౌతిక శరీరత్వమే దేవుని రాజ్యంలో ప్రవేశించదని అర్థం చేయడం
  rationale: సమీప సందర్భంలో పౌలు శరీరాన్ని విడిచిపెట్టడం గురించి కాక, క్షయశీలమైనది అక్షయమైనదిగా మారడం గురించి వాదిస్తున్నాడు. అందువల్ల నుడికారాన్ని అనువాదంలో నిలిపి, దాని సందర్భార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- issue: ἀδελφοί సంబోధనలో ఉద్దేశించిన శ్రోతలు
  choice: ప్రధాన పాఠ్యంలో ‘సోదరులారా’ అని ఉంచి, సంఘంలోని స్త్రీపురుషులందరినీ ఉద్దేశించి ఉండవచ్చని పాదటిప్పణిలో పేర్కొనడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘సోదర సోదరీమణులారా’ అని విస్తరించడం
  rationale: మూలంలోని వ్యాకరణ పుంలింగ రూపాన్ని కాపాడుతూ, సందర్భానుసారమైన సమ్మిళిత సూచనను దాచకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని సమాంతర నిర్మాణం, ‘వారసత్వం’ భావం, క్షయం–అక్షయం విరుద్ధత కాపాడబడ్డాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
