id: 1CO.15.1
reference: 1 Corinthians 15:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: te
  text: సోదరులారా,[a] నేను మీకు ప్రకటించిన శుభవార్తను మీకు తెలియజేస్తున్నాను; దానిని మీరు కూడా స్వీకరించారు, దానిలో మీరు కూడా నిలిచి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సోదర సోదరీమణులారా”; గ్రీకులో “సోదరులు” అనే పుంలింగ రూపం ఉంది; అది తరచుగా విశ్వాసుల సమాజమంతటినీ ఉద్దేశించి వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: తెలియజేస్తున్నాను
  rationale: వర్తమాన క్రియకు ప్రాథమిక అర్థం ‘తెలియజేయడం’. పౌలు ఇప్పటికే ప్రకటించిన విషయాన్ని మళ్లీ ముందుకు తెస్తున్నప్పటికీ, ‘జ్ఞాపకం చేస్తున్నాను’ అని అనువదించడం మూలపదంలో లేని ప్రత్యేక భావాన్ని చేర్చవచ్చు.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప విషయాంతరాన్ని సూచిస్తుంది. తెలుగులో వాక్య నిర్మాణమే ఆ మార్పును సహజంగా తెలియజేస్తుంది; ‘ఇప్పుడు’ అనడం మూలంలో లేని కాలసూచనను బలపరచవచ్చు.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పదంలోని పుంలింగ సంబోధనను మూలరూపానికి దగ్గరగా ఉంచాం. ఇక్కడ అది విశ్వాసుల సమాజమంతటినీ ఉద్దేశించే అవకాశం ఉన్నందున పాదటిప్పణి ఇచ్చాం.
- source_word: τὸ εὐαγγέλιον
  choice: శుభవార్తను
  rationale: పదానికి నేరమైన, సాధారణ పాఠకులకు స్పష్టమైన అర్థం ‘శుభవార్త’. ఇది ‘సువార్త’ అనే పరిచిత ప్రత్యామ్నాయానికంటే మూలపద భావాన్ని పారదర్శకంగా వ్యక్తపరుస్తుంది.
- source_word: εὐηγγελισάμην
  choice: ప్రకటించిన
  rationale: ఈ క్రియ శుభవార్తను తెలియజేయడం లేదా ప్రకటించడం సూచిస్తుంది. ‘ప్రకటించిన’ సహజమైన తెలుగు; నామవాచకంతో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: παρελάβετε
  choice: స్వీకరించారు
  rationale: సందేశాన్ని లేదా అందజేయబడిన బోధను పొందడాన్ని సూచిస్తుంది. ‘అంగీకరించారు’ కంటే ‘స్వీకరించారు’ విస్తృతమైన మూలభావాన్ని కాపాడుతుంది.
- source_word: ἐν ᾧ
  choice: దానిలోనే
  rationale: సంబంధవాచకం ముందున్న శుభవార్తను సూచిస్తుంది. ἐν యొక్క ‘లో’ భావాన్ని కాపాడుతూ, తెలుగులో సహజంగా ఉండేందుకు ‘దానిలోనే’ అని ఇచ్చాం.
- source_word: ἑστήκατε
  choice: నిలిచి ఉన్నారు
  rationale: పరిపూర్ణ కాలరూపం గతంలో ఏర్పడి ప్రస్తుతం కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘నిలిచి ఉన్నారు’ ఆ కొనసాగుతున్న స్థిరస్థితిని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: మిశ్రమ విశ్వాసుల సమాజాన్ని ఉద్దేశించిన ἀδελφοί
  choice: ప్రధాన పాఠ్యంలో ‘సోదరులారా’, సమగ్ర ఉద్దేశాన్ని పాదటిప్పణిలో స్పష్టం చేయడం
  alternative: ‘సోదర సోదరీమణులారా’
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ సంబోధనను ప్రధాన పాఠ్యంలో నిలుపుతూ, పౌలు వాడుకలో అది మొత్తం విశ్వాసుల సమాజాన్ని ఉద్దేశించగలదనే అంశాన్ని పాదటిప్పణి ద్వారా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. పొడవైన గ్రీకు వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం; సంబంధాలు, పునరుక్తి, భావక్రమం మాత్రం నిలిపాం.
