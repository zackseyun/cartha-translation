id: 1CO.15.3
reference: 1 Corinthians 15:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: te
  text: 'ఎందుకంటే, నేను స్వీకరించినదాన్నే అన్నిటికన్నా ముఖ్యమైన విషయంగా మీకు అందజేశాను: మెస్సీయ[a] మన పాపాల కోసం లేఖనాల ప్రకారం[b] మరణించాడు,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు.’ గ్రీకు Χριστός ఇక్కడ బిరుదు భావంతో ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘లేఖనాలకు అనుగుణంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: అందజేశాను
  rationale: ఇక్కడ ఈ క్రియ తాను స్వీకరించిన బోధను అధికారపూర్వకంగా ఇతరులకు అందించడాన్ని సూచిస్తుంది; ‘అందజేశాను’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ ప్రసార భావాన్ని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణను కలిపే కారణార్థక అనుసంధానాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν πρώτοις
  choice: అన్నిటికన్నా ముఖ్యమైనదిగా
  rationale: ఈ సందర్భంలో కాలక్రమంలోని మొదటి అంశాలకన్నా ప్రాధాన్యక్రమాన్ని సూచించే భావమే బలంగా ఉంది.
- source_word: ὃ καὶ παρέλαβον
  choice: నేను కూడా స్వీకరించినదానినే
  rationale: పౌలు అందజేసిన సందేశాన్ని తానూ ముందుగా స్వీకరించాడనే సమాంతర భావాన్ని ‘నే’ నొక్కిచెబుతుంది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: విశ్వాససారాన్ని తెలిపే ఈ వాక్యంలో పదానికి బిరుదు భావం స్పష్టంగా ఉంది; ‘మెస్సీయ’ దాని యూదా అభిషిక్త-రాజు నేపథ్యాన్ని నిలుపుతుంది.
- source_word: ἀπέθανεν
  choice: చనిపోయాడు
  rationale: అయోరిస్ట్ సూచించే పూర్తయిన గత సంఘటనను సరళమైన, సాధారణ తెలుగు గతకాలంతో వ్యక్తం చేస్తుంది.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: మన పాపాల కోసం
  rationale: ὑπέρ యొక్క ‘కొరకు/సంబంధంగా’ అనే విస్తృత రక్షణార్థ భావాన్ని నిలుపుతూ, నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతాన్ని వాక్యంలోకి చేర్చదు.
- source_word: κατὰ τὰς γραφάς
  choice: లేఖనాల ప్రకారం
  rationale: లేఖనాలతో అనుగుణత లేదా వాటిలో చెప్పబడినదాని ప్రకారం జరగడాన్ని సహజంగా తెలియజేస్తూ γραφάς యొక్క బహువచన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Χριστός పదానికి అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ అది వ్యక్తినామంలా కాక విశ్వాస ప్రకటనలో బిరుదుగా పనిచేస్తోంది. ‘మెస్సీయ’ బిరుదు భావాన్ని ప్రత్యక్షంగా ఉంచుతుంది; తెలుగు క్రైస్తవ వాడుకలో స్థిరమైన ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν యొక్క భావం
  choice: మన పాపాల కోసం
  alternative: మన పాపాల నిమిత్తం
  rationale: మూలంలోని రక్షణ సంబంధిత ప్రకటనను ఉంచుతూనే, మరణం పాపాల ‘కారణంగా’ జరిగిందా లేక వాటి ‘పరిహారార్థంగా’ జరిగిందా అనే దానిని అవసరానికి మించి సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అందజేశాను/స్వీకరించినదానినే’ అనే పదజంట స్వీకరించి తిరిగి అందించే సంప్రదాయ ప్రసారాన్ని ప్రతిబింబిస్తుంది. వచనం తరువాతి వాక్యంతో కొనసాగుతున్నందున ముగింపులో కామా ఉంచబడింది.
