id: 1CO.15.58
reference: 1 Corinthians 15:58
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: te
  text: కాబట్టి, నా ప్రియ సహోదరులారా[a], దృఢంగా ఉండండి, చలించకుండా ఉండండి; ప్రభువు కార్యంలో ఎల్లప్పుడూ సమృద్ధిగా కృషి చేస్తూ ఉండండి. ప్రభువులో మీ ప్రయాస వ్యర్థం కాదని మీకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరులు’ అని అనువదించిన గ్రీకు పదం ἀδελφοί (adelphoi). సందర్భాన్ని బట్టి ఇది స్త్రీలతో సహా తోటి విశ్వాసులందరినీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: కాబట్టి
  rationale: ముందటి పునరుత్థాన వాదన నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: నా ప్రియ సహోదరులారా
  rationale: వ్యాకరణపరమైన పుంలింగ బహువచనాన్ని నిలుపుతూ, సంఘమంతటినీ ఉద్దేశించే సందర్భార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: ἑδραῖοι γίνεσθε
  choice: స్థిరంగా ఉండండి
  rationale: γίνεσθε యొక్క ఆజ్ఞార్థక బలాన్ని సహజ తెలుగులో అందిస్తూ, ἑδραῖοι సూచించే దృఢస్థితిని తెలియజేస్తుంది; అక్షరార్థమైన ‘స్థిరులుగా అవ్వండి’ కంటే ఇది ప్రస్తుత తెలుగులో సహజం.
- source_word: ἀμετακίνητοι
  choice: చలించనివారిగా ఉండండి
  rationale: తమ స్థానం నుంచి కదిలించబడని దృఢత్వాన్ని బలంగా వ్యక్తం చేస్తుంది.
- source_word: περισσεύοντες
  choice: సమృద్ధిగా పాల్గొంటూ ఉండండి
  rationale: కొనసాగుతూ సమృద్ధిగా ఉండే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; కేవలం పరిమాణమే కాక ప్రభువు కార్యంలో చురుకైన నిమగ్నతను సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: ప్రభువు కార్యంలో
  rationale: ἔργον యొక్క విస్తృత అర్థాన్ని కాపాడి, దానిని కేవలం పరిచర్య లేదా సేవకు పరిమితం చేయదు.
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: కాలవ్యాప్తిని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰδότες
  choice: మీకు తెలుసు
  rationale: తెలిసియుండటం ఆధారంగా ఇచ్చే ప్రోత్సాహాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: ὁ κόπος ὑμῶν
  choice: మీ ప్రయాస
  rationale: అలసట కలిగించే శ్రమ అనే κόπος భావాన్ని ‘పని’ కంటే బలంగా తెలియజేస్తుంది.
- source_word: οὐκ ἔστιν κενὸς
  choice: వ్యర్థం కాదు
  rationale: ఫలరహితమైనది లేదా అర్థరహితమైనది కాదనే సందర్భార్థాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు వాడుకలోని సంబంధాత్మక, ఆధ్యాత్మిక విస్తృతిని వ్యాఖ్యానంతో సంకుచితం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ἀδελφοί యొక్క లింగ సూచన
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’; సంఘంలోని స్త్రీలను కూడా సందర్భం కలుపుతుందని పాదటిప్పణి.
  alternative: సహోదర సహోదరీలారా
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం; అయితే పత్రికా సందర్భంలో అది విశ్వాసుల సమూహమంతటినీ సూచించగలదు. రెండింటినీ పాఠ్యం-పాదటిప్పణి ద్వారా కాపాడాం.
- issue: వాక్యాంతంలోని ἐν κυρίῳ సంబంధం
  choice: ‘ప్రభువులో మీ ప్రయాస’కు అన్వయించడం
  alternative: ప్రభువు కారణంగా మీ ప్రయాస వ్యర్థం కాదు
  rationale: గ్రీకు నిర్మాణం మరియు పౌలు వాడుక ప్రకారం ఈ పదబంధం విశ్వాసుల ప్రయాసను విశేషించడం సహజం; కారణార్థాన్ని బలవంతంగా చేర్చలేదు.
- issue: κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ సందర్భంలో క్రీస్తుకు సంబంధించిన గౌరవపూర్వక బిరుదుగా ‘ప్రభువు’ సహజమైనది మరియు స్థిరమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సంఘ పఠనానికి అనువైన శైలి. ‘స్థిరంగా ఉండండి, చలించనివారిగా ఉండండి’ అనే సమాంతర నిర్మాణం గ్రీకు ఉపదేశంలోని బలాన్ని నిలుపుతుంది; చివరి వాక్యంలో ‘ప్రభువులో’ అనే ఉద్దేశపూర్వకంగా విస్తృతమైన పౌలు పదబంధాన్ని యథాతథంగా ఉంచాం.
