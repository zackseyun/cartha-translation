  source_fidelity: The draft accurately represents the rhetorical transition (Ἐπεί), the future question τί ποιήσουσιν, the ongoing passive forms βαπτιζόμενοι/βαπτίζονται, the emphatic ὅλως (‘అసలు’), and the passive resurrection language. ‘చనిపోయినవారి తరఫున’ is a defensible minimally interpretive rendering of ὑπὲρ τῶν νεκρῶν, with alternatives appropriately retained in the footnote.
