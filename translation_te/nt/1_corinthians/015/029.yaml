source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: te
  text: లేకపోతే, చనిపోయినవారి తరఫున బాప్తిస్మం పొందుతున్నవారు ఏమి చేస్తారు?[a] చనిపోయినవారు అసలు లేపబడకపోతే, చనిపోయినవారి తరఫున బాప్తిస్మం పొందుతున్నారు ఎందుకు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చనిపోయినవారి కోసం,’ ‘చనిపోయినవారి కారణంగా,’ లేదా—తక్కువ సంభావ్యతతో—‘చనిపోయినవారి మీద’ అని కూడా అనువదించవచ్చు. ఇక్కడి గ్రీకు విభక్త్యుపసర్గానికి ఒకటి కంటే ఎక్కువ భావాలు ఉండవచ్చు; పౌలు సూచిస్తున్న నిర్దిష్ట ఆచారం ఏమిటో అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: లేకపోతే
  rationale: ముందటి పునరుత్థాన వాదనను అనుసరించి వచ్చే పరిణామాన్ని సూచించే వాదనాత్మక సంధిగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τί ποιήσουσιν
  choice: ఏమి చేస్తారు?
  rationale: ποιέω యొక్క విస్తృతమైన ‘చేయు’ భావాన్ని నిలుపుతూ ప్రశ్న యొక్క ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
- source_word: οἱ βαπτιζόμενοι
  choice: బాప్తిస్మం పొందుతున్నవారు
  rationale: వర్తమానకాల కర్మణి కృదంతాన్ని కొనసాగుతున్న లేదా ఆచారంగా ఉన్న చర్యగా చూపుతుంది; ఆ ఆచారాన్ని సమర్థించదు.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: చనిపోయినవారి తరఫున
  rationale: ὑπέρ + షష్ఠీ విభక్తికి సాధారణమైన ప్రతినిధిత్వ భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచుతుంది.
- source_word: εἰ ὅλως
  choice: అసలు ... కాకపోతే
  rationale: ὅλως ఇచ్చే ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: చనిపోయినవారు ... లేపబడకపోతే
  rationale: గ్రీకు కర్మణి రూపాన్ని నిలుపుతూ పునరుత్థానంలో సూచితమైన దైవిక కార్యసాధకత్వాన్ని నిర్దిష్టంగా చేర్చకుండా కాపాడుతుంది.
- source_word: τί καὶ
  choice: ఎందుకు?
  rationale: పునరుక్త అలంకార ప్రశ్న యొక్క వాదనాత్మక బలాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘అప్పుడు’ భావం షరతు వాక్యంతోనే స్పష్టమవుతుంది.
- source_word: βαπτίζονται
  choice: బాప్తిస్మం పొందడం
  rationale: కర్మణి భావాన్ని నిలుపుతూ తెలుగులో సహజమైన ప్రశ్న నిర్మాణాన్ని ఇస్తుంది.
- source_word: ὑπὲρ αὐτῶν
  choice: వారి తరఫున
  rationale: αὐτῶνను ‘చనిపోయినవారు’ అనే పూర్వపదానికి అనుసంధానించి, మొదటి ὑπέρ పదబంధంతో సమాంతరతను నిలుపుతుంది.
theological_decisions:
- issue: ‘చనిపోయినవారి తరఫున’ బాప్తిస్మం యొక్క అర్థం
  choice: ఆచారాన్ని వివరించకుండా లేదా ఆమోదించకుండా ‘చనిపోయినవారి తరఫున బాప్తిస్మం పొందుతున్నవారు’ అని కనిష్ఠ వ్యాఖ్యానంతో ఉంచడం.
  alternative: ‘చనిపోయినవారి కోసం,’ ‘చనిపోయినవారి కారణంగా,’ లేదా ‘చనిపోయినవారి మీద’ బాప్తిస్మం పొందడం.
  rationale: ఈ పదబంధం చారిత్రకంగానూ వ్యాఖ్యానపరంగానూ అనిశ్చితమైనది. పౌలు ప్రస్తావించిన నిర్దిష్ట ఆచారం ఏదో పాఠ్యం వివరించదు; అందువల్ల ఏ సంఘపరమైన సిద్ధాంతాన్నీ అనువాదంలోకి తేవకుండా గ్రీకు వాక్యంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘బాప్తిస్మం’ అనే విస్తృతంగా గుర్తించబడే బైబిలు పదాన్ని ఉపయోగించి, కర్మణి రూపాన్నీ వాక్యంలోని రెండు అలంకార ప్రశ్నలనూ నిలిపాం. పాదసూచిక సూచిక [a] సంబంధిత వివాదాస్పద పదబంధం తరువాత ప్రధాన పాఠ్యంలో ఉంచబడింది.
