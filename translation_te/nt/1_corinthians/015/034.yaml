source:
  edition: SBLGNT
  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: te
  text: సరైన రీతిగా తేరుకోండి[a], పాపం చేయడం కొనసాగించకండి[b]; ఎందుకంటే కొంతమందికి దేవుని గురించిన అజ్ఞానం ఉంది. మీకు సిగ్గు కలిగేలా నేను ఇది చెబుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సరైన విధంగా స్పృహలోకి రండి.’ మూలంలోని క్రియ అక్షరార్థంగా మత్తు నుంచి తేరుకోవడాన్ని సూచిస్తుంది; ఇక్కడ అది రూపకంగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పాపం చేయకండి’ లేదా ‘పాపం చేయడం మానండి.’ వర్తమాన ఆజ్ఞారూపం కొనసాగుతున్న లేదా అలవాటైన క్రియను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: మేల్కొని స్పృహలోకి రండి
  rationale: ఈ క్రియ అక్షరార్థంగా మత్తు నుంచి తేరుకోవడాన్ని సూచించినా, ఇక్కడ రూపకాలంకారంగా స్పష్టమైన బుద్ధికి తిరిగి రావాలనే నిర్ణయాత్మక ఆజ్ఞ. తెలుగు పాఠకునికి సహజంగా ఉండేలా, మేల్కొనడం మరియు స్పృహలోకి రావడం అనే చిత్రాన్ని నిలిపింది.
- source_word: δικαίως
  choice: సరిగ్గా
  rationale: ఈ క్రియావిశేషణం ఆజ్ఞను విశేషిస్తూ ‘సరైన విధంగా’ అనే భావాన్ని ఇస్తుంది. ‘నీతిగా’ అనడం ఇక్కడ లేనంత సాంకేతిక లేదా భారమైన నైతిక భావాన్ని కలిగించవచ్చు.
- source_word: μὴ ἁμαρτάνετε
  choice: పాపం చేస్తూనే ఉండకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞారూపం కొనసాగుతున్న లేదా అలవాటైన క్రియను నిషేధించే ఛాయను కలిగి ఉండవచ్చు. ఈ అనువాదం ఆ ఛాయను వ్యక్తం చేస్తూ, అందరూ ప్రస్తుతం ఒకే పాపంలో ఉన్నారని అతిగా నిర్ధారించదు.
- source_word: ἀγνωσίαν θεοῦ
  choice: దేవుని గురించిన జ్ఞానం లేదు
  rationale: ἀγνωσία ‘అజ్ఞానం’ లేదా ‘జ్ఞానలేమి’ని సూచిస్తుంది; θεοῦ ఇక్కడ దేవుని విషయమైన జ్ఞానాన్ని సూచించే సంబంధ విభక్తి. సహజమైన ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా తెలిపింది.
- source_word: τινες
  choice: మీలో కొందరికి
  rationale: ప్రేక్షకులతో సంబంధమున్న ఒక ఉపవర్గాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘మీలో’ను చేర్చడం సంబోధిత సమూహంతో సంబంధాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: మీరు సిగ్గుపడాలని
  rationale: ఈ పదబంధం శ్రోతల్లో కలగవలసిన సిగ్గును ఉద్దేశించిన గద్దింపు. ‘మీ అవమానానికి’ కంటే ఈ రూపం ఆధునిక తెలుగులో సహజంగా, పౌలు పలికిన మందలింపు బలంతో వినిపిస్తుంది.
- source_word: λαλῶ
  choice: నేను ఇది చెబుతున్నాను
  rationale: వర్తమాన కాలంలోని మాటల క్రియను, ముందున్న మందలింపును సూచించే సహజ తెలుగు వాక్యంగా అందించింది.
theological_decisions:
- issue: δικαίως యొక్క నైతిక బలం
  choice: సరిగ్గా
  alternative: నీతిగా
  rationale: సందర్భం నైతిక మందలింపే అయినా, క్రియావిశేషణం ప్రధానంగా సరైన విధంగా స్పృహలోకి రావడాన్ని విశేషిస్తుంది. ‘సరిగ్గా’ నైతిక ఛాయను పూర్తిగా తొలగించకుండా, ఇక్కడ స్పష్టంగా లేని సాంకేతిక ‘నీతి’ భావాన్ని దిగుమతి చేయదు.
- issue: μὴ ἁμαρτάνετε లోని క్రియాంశ ఛాయ
  choice: పాపం చేస్తూనే ఉండకండి
  alternative: పాపం చేయకండి / పాపం చేయడం మానండి
  rationale: వర్తమాన ఆజ్ఞారూపం కొనసాగింపు లేదా అలవాటు భావాన్ని సూచించవచ్చు; అయితే ఆ భావం వ్యాకరణం వల్ల నిర్బంధంగా తేలదు. ప్రధాన పాఠ్యంలో సాధ్యమైన కొనసాగింపు ఛాయను ఉంచి, అడుగుసూచనలో ప్రత్యామ్నాయాలను తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కానీ నేరుగా మందలించే శైలి. మూలంలోని మత్తు నుంచి తేరుకునే రూపకాన్ని సహజ తెలుగు వ్యక్తీకరణతో నిలిపి, δικαίως మరియు వర్తమాన ఆజ్ఞారూపంలోని నిజమైన అనిశ్చితులను అడుగుసూచనల్లో భద్రపరిచాం.
