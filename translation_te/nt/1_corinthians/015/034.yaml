- from: సరిగ్గా మేల్కొని స్పృహలోకి రండి[a]; పాపం చేస్తూనే ఉండకండి[b]. ఎందుకంటే మీలో కొందరికి దేవుని గురించిన జ్ఞానం లేదు. మీరు సిగ్గుపడాలని నేను ఇది చెబుతున్నాను.
