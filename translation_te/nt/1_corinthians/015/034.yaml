review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the central exhortation and the continuing-force nuance of μὴ ἁμαρτάνετε. However, «మీలో» adds an explicit limitation not stated by τινες; Paul says only that “some” have ignorance of God. The final clause is better rendered as an expression intended to bring shame rather than solely as a purpose clause about their feeling shame.
  naturalness: «మేల్కొని స్పృహలోకి రండి» is understandable but somewhat doubled and less idiomatic for the metaphor of sobering up. «సరైన రీతిగా తేరుకోండి» is concise, modern, and retains the image. «మీకు సిగ్గు కలిగేలా» preserves the rebuking effect naturally.
  terminology: «దేవుని గురించిన అజ్ఞానం» directly represents ἀγνωσίαν θεοῦ without weakening it into mere absence of information. «పాపం చేయడం కొనసాగించకండి» reflects the possible ongoing nuance without asserting more than the Greek warrants.
  issues:
  - severity: medium
    issue: «మీలో కొందరికి» adds «మీలో» (“among you”).
    rationale: τινες means “some/certain people”; the immediate context may make the audience association plausible, but the Greek wording here does not explicitly say “among you.” The addition should be removed for source fidelity.
  - severity: low
    issue: The rendering of ἐκνήψατε is unnecessarily redundant.
    rationale: «మేల్కొని స్పృహలోకి రండి» combines two closely related images. «తేరుకోండి» naturally conveys metaphorical sobering up/coming to one’s senses while the note preserves the literal imagery.
  - severity: low
    issue: The shame clause can more closely retain the source’s rhetorical force.
    rationale: πρὸς ἐντροπὴν ὑμῖν λαλῶ is idiomatically an utterance “to your shame” or “to make you ashamed.” «మీకు సిగ్గు కలిగేలా నేను ఇది చెబుతున్నాను» is natural and appropriately direct.
