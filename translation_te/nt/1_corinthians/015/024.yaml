id: 1CO.15.24
reference: 1 Corinthians 15:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: te
  text: 'ఆ తరువాత అంతం[a] వస్తుంది: ఆయన రాజ్యాన్ని తండ్రియైన దేవునికి అప్పగించినప్పుడు[b], ఆయన ప్రతి పరిపాలనను, ప్రతి అధికారాన్ని, ప్రతి శక్తిని నిర్వీర్యం చేసినప్పుడు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరిపూర్ణత.’ గ్రీకు τέλος అనే పదానికి ‘అంతం,’ ‘లక్ష్యం,’ లేదా ‘పరిపూర్ణత’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘రాజ్యాన్ని దేవునికీ తండ్రికీ అప్పగించినప్పుడు.’ ఇక్కడ ‘దేవుడు, అనగా తండ్రి’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘రద్దు చేసి,’ ‘పనిచేయకుండా చేసి,’ లేదా ‘లేకుండా చేసి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: ఆ తరువాత
  rationale: పునరుత్థాన క్రమంలో తదుపరి దశను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: τὸ τέλος
  choice: అంతం
  rationale: ఈ అంత్యకాల క్రమంలో τέλος యొక్క సూటి కాలసంబంధ అర్థాన్ని నిలుపుతుంది; ‘పరిపూర్తి’ అనే భావసాధ్యతను పాదటిప్పణిలో ఉంచింది.
- source_word: ὅταν παραδιδῷ
  choice: అప్పుడు … అప్పగిస్తాడు
  rationale: ὅταν తో ఉన్న భవిష్యత్ కాలసంబంధ సంఘటనను తెలుగులో సహజంగా వ్యక్తం చేసి, రాజ్యాధికార బదిలీ భావాన్ని నిలుపుతుంది.
- source_word: τὴν βασιλείαν
  choice: రాజ్యాన్ని
  rationale: రాజ్యం లేదా రాజపరిపాలన అనే అర్థవిస్తృతిని సహజంగా మోసే సాధారణ తెలుగు పదం.
- source_word: τῷ θεῷ καὶ πατρί
  choice: తండ్రియైన దేవునికి
  rationale: ‘దేవుడు, అనగా తండ్రి’ అనే సమానాధికరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; గ్రీకు సమన్వయ రూపాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: ὅταν καταργήσῃ
  choice: నిర్వీర్యం చేసి
  rationale: καταργέω సూచించే పనిచేయకుండా చేయడం, ప్రభావాన్ని తొలగించడం అనే భావాన్ని ‘నాశనం’ అనే సంపూర్ణ నిర్మూలన భావాన్ని రుద్దకుండా అందిస్తుంది.
- source_word: πᾶσαν ἀρχὴν
  choice: ప్రతి పరిపాలనను
  rationale: ἀρχή ఇక్కడ అధికారపూర్వక పాలన లేదా పాలక శక్తిని సూచించగల అస్పష్టతను కొంతవరకు నిలుపుతూ, త్రయిలో సహజంగా సరిపోతుంది.
- source_word: πᾶσαν ἐξουσίαν
  choice: ప్రతి అధికారాన్ని
  rationale: అధికార హక్కు లేదా అధికారక్షేత్రం అనే సాధారణ అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: δύναμιν
  choice: శక్తిని
  rationale: δύναμις యొక్క విస్తృతమైన బలం లేదా శక్తి భావానికి సహజ తెలుగు సమానం.
theological_decisions:
- issue: τῷ θεῷ καὶ πατρί లో ‘దేవుడు’ మరియు ‘తండ్రి’ మధ్య సంబంధం
  choice: సమానాధికరణంగా ‘తండ్రియైన దేవుడు’
  alternative: ‘దేవునికీ తండ్రికీ’ లేదా ‘దేవుడూ తండ్రియూ అయినవానికి’
  rationale: సందర్భంలో రాజ్యం ఎవరికి అప్పగించబడుతుందో సహజంగా స్పష్టం చేస్తుంది; అయితే గ్రీకు నిర్మాణానికి మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: καταργήσῃ శత్రు అధికారాలపై చూపే చర్య
  choice: వాటి కార్యసామర్థ్యాన్ని నిర్ణయాత్మకంగా తొలగించడం—‘నిర్వీర్యం చేయడం’
  alternative: రద్దు చేయడం; నిర్మూలించడం; లేకుండా చేయడం
  rationale: వాటి క్రియాశీల అధికారానికి ముగింపు పలకడాన్ని వ్యక్తం చేస్తుంది; వాటి అస్తిత్వం పూర్తిగా నశిస్తుందని వచనానికి మించి నిర్ణయించదు.
- issue: ἀρχή వ్యక్తిగత పాలకుడా లేక అమూర్త పరిపాలనా శక్తియా
  choice: ‘పరిపాలన’ అనే అమూర్త/వ్యవస్థాత్మక పదం
  alternative: ‘పాలకుడు’ లేదా ‘ప్రభుత్వం’
  rationale: ἐξουσία, δύναμις తో ఉన్న వరుసలో అధికార రంగాల భావాన్ని నిలుపుతుంది; ఆ పదం పాలక శక్తులను సూచించే అవకాశాన్ని పూర్తిగా మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరమైన లయతో రూపొందించబడింది. గ్రీకు వాక్యంలోని రెండు ὅταν ఉపవాక్యాలను తెలుగులో సహజమైన సంఘటన క్రమంగా అమర్చింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
