revisions:
- from: ఆ తరువాత అంతం[a] వస్తుంది. అప్పుడు ఆయన ప్రతి పరిపాలనను, ప్రతి అధికారాన్ని, శక్తిని నిర్వీర్యం చేసి[c], రాజ్యాన్ని తండ్రియైన దేవునికి అప్పగిస్తాడు[b].
  to: 'ఆ తరువాత అంతం[a] వస్తుంది: ఆయన రాజ్యాన్ని తండ్రియైన దేవునికి అప్పగించినప్పుడు[b], ఆయన ప్రతి పరిపాలనను, ప్రతి అధికారాన్ని, ప్రతి శక్తిని నిర్వీర్యం చేసినప్పుడు[c].'
  rationale: The revision retains the source order of the two ὅταν clauses, preserves their shared temporal force without over-specifying a sequence, and makes the final distributive explicit. It also replaces the less idiomatic footnote expression “పరిపూర్తి” with “పరిపూర్ణత.” Footnote anchors are retained and aligned with their respective terms.
  reviewer_model: gpt-5.6-terra
