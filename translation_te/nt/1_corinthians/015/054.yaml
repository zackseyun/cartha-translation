revisions:
- from: 'అయితే, నశించేది ఈ దేహం నాశనరాహిత్యాన్ని ధరించుకున్నప్పుడు, మరణించేది ఈ దేహం అమరత్వాన్ని ధరించుకున్నప్పుడు, అప్పుడు వ్రాయబడిన వాక్యం నెరవేరుతుంది[a]: “మరణం విజయంలో మింగివేయబడింది.”[b]'
  to: 'అయితే, ఈ నశ్వరమైనది అవినాశిత్వాన్ని ధరించుకున్నప్పుడు, ఈ మర్త్యమైనది అమరత్వాన్ని ధరించుకున్నప్పుడు, అప్పుడు వ్రాయబడిన వాక్యం నెరవేరుతుంది[a]: “మరణం విజయంలో మింగివేయబడింది.”[b]'
  rationale: The revision removes the unwarranted explicit repetition of “body,” preserves the Greek substantival ambiguity, and improves Telugu idiom. It retains the draft’s sound rendering of the clothing metaphor, the passive aorist quotation, and εἰς νῖκος as “విజయంలో.” The footnote continues to disclose the less interpretive lexical range of γενήσεται.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:05:55Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the clothing metaphor, the paired contrasts of perishable/imperishable and mortal/immortal, the future realization of the written saying, and the passive image of death being swallowed up. However, adding “ఈ దేహం” twice specifies “body,” whereas the Greek uses substantival adjectives (“this perishable thing” / “this mortal thing”) and does not explicitly repeat σῶμα in this verse. The immediately preceding context concerns the body, but the translation need not make that contextual inference part of the text.
  naturalness: “నశించేది ఈ దేహం” and “మరణించేది ఈ దేహం” have marked, less natural Telugu word order. “ఈ నశ్వరమైనది” and “ఈ మర్త్యమైనది” are idiomatic, concise, and retain the Greek’s substantival formulation. “నెరవేరుతుంది” is natural for a written prophetic saying; its slightly more interpretive fulfillment nuance is appropriately covered by a footnote noting the plain sense of γίνομαι.
  terminology: Use “నశ్వరమైనది / అవినాశిత్వం” for φθαρτόν / ἀφθαρσίαν, preserving their lexical contrast in clear modern Telugu. “మర్త్యమైనది / అమరత్వం” preserves the θνητόν / ἀθανασίαν contrast. “వ్రాయబడిన వాక్యం” and “మింగివేయబడింది” are suitable and retain the written-saying and passive imagery respectively.
  issues:
  - severity: medium
    issue: The text adds “ఈ దేహం” twice.
    rationale: Although the larger context concerns resurrection bodies, 1 Corinthians 15:54 itself has substantival adjectives and does not explicitly say “body.” The addition narrows the source wording unnecessarily.
  - severity: low
    issue: The phrases “నశించేది ఈ దేహం” and “మరణించేది ఈ దేహం” are awkward in modern standard Telugu.
    rationale: Replacing them with substantival adjective forms is more natural while also more closely matching the Greek construction.
  revised_text: 'అయితే, ఈ నశ్వరమైనది అవినాశిత్వాన్ని ధరించుకున్నప్పుడు, ఈ మర్త్యమైనది అమరత్వాన్ని ధరించుకున్నప్పుడు, అప్పుడు వ్రాయబడిన వాక్యం నెరవేరుతుంది[a]: “మరణం విజయంలో మింగివేయబడింది.”[b]'
