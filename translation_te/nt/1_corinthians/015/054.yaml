id: 1CO.15.54
reference: 1 Corinthians 15:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: te
  text: 'అయితే, ఈ నశ్వరమైనది అవినాశిత్వాన్ని ధరించుకున్నప్పుడు, ఈ మర్త్యమైనది అమరత్వాన్ని ధరించుకున్నప్పుడు, అప్పుడు వ్రాయబడిన వాక్యం నెరవేరుతుంది[a]: “మరణం విజయంలో మింగివేయబడింది.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అప్పుడు వ్రాయబడిన వాక్యం జరుగుతుంది” లేదా “సత్యమవుతుంది.” గ్రీకు క్రియకు అక్షరార్థంగా “జరుగుతుంది” లేదా “సంభవిస్తుంది” అనే భావం ఉంది.
    reason: alternative_reading
  - marker: b
    text: యెషయా 25:8 నుండి ఉటంకించబడింది; ఇక్కడి పదప్రయోగం పౌలు ఉటంకించిన గ్రీకు పాఠ సంప్రదాయాన్ని ప్రతిబింబిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: φθαρτὸν
  choice: నశించేది ఈ దేహం
  rationale: గ్రీకులో విశేషణం నామవాచకంగా వాడబడింది; సందర్భం ప్రస్తుత దేహాన్ని సూచిస్తున్నందున, తెలుగులో సహజంగా అర్థమయ్యేలా ‘దేహం’ను స్పష్టం చేస్తూ నశ్వర స్థితిని నిలిపింది.
- source_word: ἐνδύσηται
  choice: ధరించుకున్నప్పుడు
  rationale: కొత్త స్వభావాన్ని వస్త్రంలా ధరించే పౌలు రూపకాన్ని, మధ్యమ వాచ్య ఛాయతో సహా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀφθαρσίαν
  choice: నాశనరాహిత్యాన్ని
  rationale: క్షయం లేదా నాశనానికి లోబడని స్థితిని సూచిస్తుంది; φθαρτόςతో ఉన్న వ్యతిరేక జతను స్పష్టంగా ఉంచుతుంది.
- source_word: θνητὸν
  choice: మరణించేది ఈ దేహం
  rationale: మరణానికి లోబడిన ప్రస్తుత దేహాన్ని సూచిస్తుంది; అమరత్వంతో ఉన్న వ్యతిరేకతను సాధారణ పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: ἀθανασίαν
  choice: అమరత్వాన్ని
  rationale: మరణరాహిత్యాన్ని సూచించే ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: γενήσεται
  choice: నెరవేరుతుంది
  rationale: అక్షరార్థంగా ‘సంభవిస్తుంది/జరుగుతుంది’; అయితే వ్రాయబడిన ప్రవచన వాక్యం నిజమయ్యే సందర్భంలో ‘నెరవేరుతుంది’ సహజమైన తెలుగు. గ్రీకు క్రియ యొక్క మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చింది.
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: వ్రాయబడిన వాక్యం
  rationale: ఇక్కడ λόγος ఉటంకించబోయే లిఖిత ప్రకటనను సూచిస్తుంది; ‘వాక్యం’ తెలుగు బైబిలు శైలిలోనూ సాధారణ వాడుకలోనూ సహజంగా ఉంది.
- source_word: Κατεπόθη
  choice: మింగివేయబడింది
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి రూపాన్నీ, మరణం పూర్తిగా తొలగించబడే బలమైన రూపకాన్నీ నిలుపుతుంది.
- source_word: εἰς νῖκος
  choice: విజయంలో
  rationale: మరణం సంపూర్ణంగా ఓడిపోయిన ఫలితస్థితిని సూచించే గ్రీకు పదబంధానికి సన్నిహితమైన రూపం; మూలంలోని కొంత అసాధారణమైన భావసాంద్రతను నిలుపుతుంది.
theological_decisions:
- issue: γενήσεται అనే క్రియను లిఖిత వాక్యంతో అనుసంధానించడం
  choice: నెరవేరుతుంది
  alternative: జరుగుతుంది / నిజమవుతుంది
  rationale: ‘నెరవేరుతుంది’ సందర్భానుగుణంగా సహజమైనప్పటికీ, గ్రీకులో సాధారణ γίνομαι క్రియ మాత్రమే ఉంది; అందువల్ల మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి మూలంలోని భావపరిధిని కాపాడింది.
- issue: Κατεπόθη యొక్క కాలభావం
  choice: మింగివేయబడింది
  alternative: మింగివేయబడి ఉంది / మింగివేయబడుతుంది
  rationale: భవిష్యత్తులో సాకారమయ్యే సమయంలో లిఖిత ప్రకటన పూర్తయిన వాస్తవంగా నిలుస్తుందని గ్రీకు ఏఓరిస్ట్ సూచిస్తుంది. తెలుగు భూత కర్మణి రూపం ఉటంకణ స్వరాన్ని నిలుపుతూ, దానిని సాధారణ భవిష్యత్ వాక్యంగా మార్చదు.
- issue: εἰς νῖκος యొక్క భావం
  choice: విజయంలో
  alternative: విజయంగా / శాశ్వతంగా
  rationale: గ్రీకు సంప్రదాయంలోని εἰς νῖκος పదబంధాన్ని సన్నిహితంగా నిలుపుతుంది. ‘శాశ్వతంగా’ అనే భావం యెషయా హెబ్రీ పాఠానికి దగ్గరైనా, పౌలు ఇక్కడ ఉటంకించిన గ్రీకు రూపాన్ని భర్తీ చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ‘ఈ దేహం’ను సందర్భస్పష్టత కోసం చేర్చింది. ధరించడం, మింగివేయబడడం అనే మూల రూపకాలను నిలిపింది; పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా [a], [b]గా ఉన్నాయి.
