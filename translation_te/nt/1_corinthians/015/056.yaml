source:
  edition: SBLGNT
  text: τὸ δὲ κέντρον τοῦ θανάτου ἡ ἁμαρτία, ἡ δὲ δύναμις τῆς ἁμαρτίας ὁ νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: te
  text: మరణపు ముల్లు పాపం; పాపపు శక్తి ధర్మశాస్త్రం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ధర్మశాస్త్రం’ ముఖ్యంగా మోషే ధర్మశాస్త్రాన్ని సూచించే అవకాశం ఉంది; అయితే పాపాన్ని బయలుపరచి దాని ప్రభావాన్ని తీవ్రం చేయడంలో ధర్మశాస్త్రం పోషించే విస్తృత పాత్రను కూడా ఈ పదప్రయోగం అనుమతిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: ముల్లు
  rationale: κέντρον అనే పదానికి ‘ముల్లు’, ‘కొరడా ముల్లు/మునికోల’ అనే భావాలు ఉండవచ్చు. ఇక్కడ మరణం గాయపరచే సాధనాన్ని రూపకంగా సూచిస్తున్నందున, ముందటి వచనంలోని భావాన్నీ నిలుపుతూ ‘ముల్లు’ సహజంగా ఉంది.
- source_word: θανάτου
  choice: మరణపు
  rationale: జనిటివ్ సంబంధాన్ని తెలుగులో సహజమైన ‘మరణపు’ అనే రూపంతో వ్యక్తం చేశాం.
- source_word: ἁμαρτία
  choice: పాపం
  rationale: ఏకవచనాన్ని నిలిపి, వ్యక్తిగత పాపకార్యాలకన్నా పాపాన్ని ఒక శక్తి లేదా సూత్రంగా సూచించే పౌలు వాడుకను ప్రతిబింబిస్తుంది.
- source_word: δύναμις
  choice: శక్తి
  rationale: పాపానికి బలాన్నిచ్చే లేదా దాని ప్రభావాన్ని కార్యసాధకం చేసే సామర్థ్యాన్ని ‘శక్తి’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: νόμος
  choice: ధర్మశాస్త్రం
  rationale: పౌలు సందర్భంలో ముఖ్యంగా మోషే ధర్మశాస్త్రం ప్రతిధ్వనించినా, పదబంధాన్ని మరింత సంకుచితం చేయకుండా తెలుగు బైబిలు భాషలో సుపరిచితమైన ‘ధర్మశాస్త్రం’ను వాడాం.
- source_word: δὲ ... δὲ
  choice: ;
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతకన్నా వివరణాత్మక పురోగతిని సూచిస్తుంది. తెలుగులో అదనపు ‘అయితే/మరియు’ పదాలు లేకుండా అర్ధవిరామం రెండు సమాంతర వాక్యభాగాల సంబంధాన్ని సహజంగా చూపుతుంది.
theological_decisions:
- issue: ‘ధర్మశాస్త్రం’ అనే పదం మోషే ధర్మశాస్త్రానికే పరిమితమా?
  choice: ప్రధాన పాఠంలో ‘ధర్మశాస్త్రం’ అని మాత్రమే ఉంచడం
  alternative: ‘మోషే ధర్మశాస్త్రం’ అని స్పష్టీకరించడం లేదా సాధారణ ‘నియమం’గా అనువదించడం
  rationale: సందర్భం మోషే ధర్మశాస్త్రాన్ని బలంగా సూచించినప్పటికీ, గ్రీకు పదప్రయోగం ధర్మశాస్త్రం పాపాన్ని బయలుపరచి దాని ప్రభావాన్ని తీవ్రం చేసే విస్తృత పౌలు భావాన్నీ అనుమతిస్తుంది. కాబట్టి ప్రధాన పాఠం ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. రెండు సమాంతర వాక్యభాగాల బలాన్ని నిలుపుటకు అర్ధవిరామం ఉపయోగించబడింది.
