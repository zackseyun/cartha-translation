source:
  edition: SBLGNT
  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: te
  text: ఆ తర్వాత ఆయన ఒకేసారి ఐదువందల మందికంటే ఎక్కువమంది సహోదరులకు[a] కనిపించాడు. వారిలో చాలామంది ఇప్పటికీ జీవించి ఉన్నారు; అయితే కొందరు నిద్రలోకి వెళ్లిపోయారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహోదర సహోదరీలకు.’ గ్రీకు మూలంలో ‘సహోదరులకు’ అని ఉంది; తొలి క్రైస్తవ వాడుకలో ఈ పదం కొన్నిసార్లు విశ్వాసుల విస్తృత సమాజాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, వారు మరణించారు. పునరుత్థాన నిరీక్షణ వెలుగులో మరణాన్ని సూచించడానికి తొలి క్రైస్తవులు సాధారణంగా ఉపయోగించిన ‘నిద్రలోకి వెళ్లిపోయారు’ అనే రూపకాన్ని పౌలు ఇక్కడ ఉపయోగిస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: ఆ తర్వాత
  rationale: పునరుత్థాన దర్శనాల వరుసలో తదుపరి సంఘటనను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ὤφθη
  choice: కనిపించాడు
  rationale: పునరుత్థాన దర్శన సందర్భంలో ఈ క్రియకు ఉన్న ‘ప్రత్యక్షమయ్యాడు/కనిపించాడు’ అనే సంఘటనార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; కర్త మునుపటి సందర్భంలోని క్రీస్తు.
- source_word: ἐπάνω πεντακοσίοις
  choice: ఐదువందల మందికంటే ఎక్కువమంది
  rationale: ἐπάνω సంఖ్యతో కలిసి ‘కంటే ఎక్కువ’ అనే అర్థాన్ని ఇస్తుంది.
- source_word: ἀδελφοῖς
  choice: సహోదరులకు
  rationale: గ్రీకు పదంలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతూ, గౌరవప్రదమైన సాధారణ తెలుగు పదాన్ని ఉపయోగిస్తుంది; విస్తృత విశ్వాసుల సమాజాన్ని కూడా సూచించే అవకాశం పాదసూచికలో ఉంచబడింది.
- source_word: ἐφάπαξ
  choice: ఒకేసారి
  rationale: ఐదువందలకంటే ఎక్కువమందికి ఒకే సందర్భంలో దర్శనమిచ్చిన సమకాలిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξ ὧν οἱ πλείονες
  choice: వారిలో చాలామంది
  rationale: భాగసూచక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; οἱ πλείονες సూచించే అధిక భాగాన్ని ‘చాలామంది’ తెలియజేస్తుంది.
- source_word: μένουσιν ἕως ἄρτι
  choice: ఇప్పటివరకు ఉన్నారు
  rationale: ‘నిలిచి/ఉండి కొనసాగుతున్నారు’ అనే μένω యొక్క పదార్థాన్ని కాపాడుతుంది; ఈ సందర్భంలో వారు ఇంకా జీవించి ఉన్నారని సూచిస్తుంది.
- source_word: τινὲς δὲ
  choice: అయితే కొందరు
  rationale: మెజారిటీ ఇప్పటికీ ఉండటం మరియు కొందరు నిద్రించడం మధ్య δέ చూపే స్వల్ప వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: ἐκοιμήθησαν
  choice: నిద్రించారు
  rationale: మరణానికి వాడిన ‘నిద్ర’ రూపకాన్ని, ముఖ్యంగా పునరుత్థాన సందర్భంలో దాని ప్రాముఖ్యతను, ప్రధాన పాఠ్యంలో నిలుపుతుంది.
theological_decisions:
- issue: మిశ్రమ సమూహాన్ని సూచించే అవకాశం ఉన్న ἀδελφοῖς అనువాదం
  choice: సహోదరులకు
  alternative: సహోదర సహోదరీలకు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; తొలి క్రైస్తవ వాడుకలో ఇది విస్తృత విశ్వాసుల సమాజాన్ని సూచించగలదనే నిజమైన అర్థసాధ్యతను పాదసూచిక తెలియజేస్తుంది.
- issue: పునరుత్థాన సందర్భంలో ἐκοιμήθησαν అనువాదం
  choice: నిద్రించారు
  alternative: చనిపోయారు
  rationale: పౌలు ఉపయోగించిన నిద్ర రూపకాన్ని తొలగించకుండా కాపాడుతుంది; దాని ఉద్దేశించిన మరణార్థాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘కనిపించాడు,’ ‘ఒకేసారి,’ ‘నిద్రించారు’ వంటి పదాలు మూలంలోని సంఘటన క్రమం, సమకాలికత, మరణ రూపకాన్ని స్పష్టంగా నిలుపుతాయి.
