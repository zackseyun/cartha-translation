  text: Why are we also in danger every hour?[a]
translation:
  language: te
  text: మరి మేము కూడా ప్రతి గంటా ఎందుకు ప్రమాదంలో ఉంటున్నాం?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “మరి మేము కూడా ప్రతి గంటా ప్రమాదంలో ఉండటమేమిటి?” సందర్భంలో భావం: “మరి మేము కూడా ప్రతి గంటా ఎందుకు ప్రమాదంలో ఉంటున్నాం?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: ఎందుకు
  rationale: ఈ అలంకారప్రశ్నలో τί ఒక వస్తువును గురించి కాక, చర్యకు కారణం లేదా ప్రయోజనం ఏమిటని ప్రశ్నిస్తోంది. సందర్భంలోని వాదనాబలాన్ని ‘ఎందుకు’ సహజంగా తెలియజేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: పౌలు తనతో కూడిన వర్గాన్ని ముందుగా పేర్కొన్న ఉదాహరణలకు జోడిస్తున్నాడు; ‘కూడా’ ఈ సంకలన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἡμεῖς
  choice: మేము
  rationale: స్పష్టంగా ఉన్న ప్రథమ పురుష బహువచన సర్వనామాన్ని నిలుపుతుంది. ‘కూడా’తో కలిసి దాని వ్యత్యాసాత్మక బలం వ్యక్తమవుతుంది.
- source_word: κινδυνεύομεν
  choice: ప్రమాదంలో ఉంటున్నాం
  rationale: క్రియకు నేరుగా ‘ప్రమాదంలో ఉండడం’ లేదా ‘ముప్పును ఎదుర్కోవడం’ అనే అర్థం ఉంది. ‘ప్రాణాలను పణంగా పెడుతున్నాం’ అనడం మూలపాఠం కంటే ఎక్కువ వ్యాఖ్యానాత్మకం అవుతుంది.
- source_word: πᾶσαν ὥραν
  choice: ప్రతి గంటా
  rationale: నిరంతర ప్రమాదాన్ని సూచించే ఈ కాలవ్యక్తీకరణను మూలపదాలకు దగ్గరగా, ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: పునరుత్థానం గురించిన పౌలు వాదనలోని అలంకారప్రశ్న బలం
  choice: చనిపోయినవారు లేపబడకపోతే అపొస్తలులు నిరంతరం ప్రమాదాన్ని ఎందుకు ఎదుర్కొంటారనే అసంగతిని చూపించే అలంకారప్రశ్నగా అనువదించడం
  alternative: సమాచారం కోరే సాధారణ ప్రశ్నగా అనువదించడం
  rationale: గ్రీకు వాక్యనిర్మాణం మరియు తక్షణ సందర్భం దీనిని సమాచారార్థక ప్రశ్నగా కాక వాదనాత్మక అలంకారప్రశ్నగా సూచిస్తున్నాయి. అదనపు సిద్ధాంతపరమైన నిర్ధారణను చేర్చకుండా సందర్భంలోని ఉద్వేగాన్ని ఇది నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం. ‘మరి’ సందర్భంలోని వాదన కొనసాగింపును తెలియజేస్తుంది; ‘ప్రతి గంటా’ మూలంలోని నిరంతరతను దగ్గరగా నిలుపుతుంది.
