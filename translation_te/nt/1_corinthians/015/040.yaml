source:
  edition: SBLGNT
  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: te
  text: పరలోకానికి చెందిన శరీరాలు, భూమికి చెందిన శరీరాలు కూడా ఉన్నాయి; అయితే పరలోకానికి చెందిన వాటి మహిమ ఒక విధమైనది[a], భూమికి చెందిన వాటి మహిమ వేరొక విధమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఖగోళ శరీరాలు మరియు భౌమ శరీరాలు.’
    reason: ἐπουράνια మరియు ἐπίγεια పదాలకు సందర్భాన్ని ఖగోళార్థంగా తీసుకునే ప్రత్యామ్నాయ అనువాదం. ప్రధాన పాఠంలోని ‘పరలోకానికి చెందిన/భూమికి చెందిన’ అనువాదం మూలంలోని విస్తృతతను కాపాడుతుంది.
lexical_decisions:
- source_word: σώματα
  choice: శరీరాలు
  rationale: సాధారణంగా ‘శరీరాలు’ అనే అర్థాన్నే ఇస్తుంది. ఈ సందర్భంలో ఖగోళ వస్తువులు, పునరుత్థాన శరీరాలు లేదా ఇతర శరీర రూపాలు అని ముందుగానే పరిమితం చేయకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: ἐπουράνια
  choice: పరలోకానికి చెందిన
  rationale: ‘పరలోక సంబంధమైన’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; దానిని కేవలం ఖగోళ సంబంధమైనదిగా పరిమితం చేయదు.
- source_word: ἐπίγεια
  choice: భూమికి చెందిన
  rationale: ‘భూమిమీద ఉన్న/భూసంబంధమైన’ అనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తూ ‘పరలోకానికి చెందిన’ అనే పదబంధానికి సమతూకంగా నిలుస్తుంది.
- source_word: ἀλλὰ
  choice: అయితే
  rationale: రెండు రకాల శరీరాల మధ్యనున్న వ్యత్యాసాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో సూచిస్తుంది.
- source_word: ἑτέρα ... ἑτέρα
  choice: ఒక రకమైనది ... మరొక రకమైనది
  rationale: రెండింటి మహిమ ఒకేలా లేదనే గుణాత్మక భేదాన్ని మూలానికి అనుగుణంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: δόξα
  choice: మహిమ
  rationale: ఈ సందర్భంలోని వైభవం లేదా తేజస్సు భావాన్ని కలిగి ఉండటంతో పాటు పౌలు వాడే విస్తృతమైన వేదాంత పదజాలంతో అనుసంధానాన్ని కాపాడుతుంది.
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: పరలోకానికి చెందిన వాటి ... భూమికి చెందిన వాటి
  rationale: గ్రీకులో ముందున్న ‘శరీరాలు’ అనే పదాన్ని సూచించే సంక్షిప్త నిర్మాణాన్ని తెలుగులో స్పష్టంగా, అనవసర పునరుక్తి లేకుండా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ‘పరలోకానికి చెందిన శరీరాలు’, ‘భూమికి చెందిన శరీరాలు’ అనే పదబంధాల నిర్దిష్ట సూచన
  choice: ఏ ఒక్క నిర్దిష్ట సూచనకూ పరిమితం చేయకుండా సాధారణంగానే అనువదించడం
  alternative: ‘ఖగోళ శరీరాలు, భౌమ శరీరాలు’ లేదా ‘పరలోక జీవులు, భూలోక జీవులు’
  rationale: మూలంలో σώματα (‘శరీరాలు’) ఉంది; ‘జీవులు’ అని లేదు. సందర్భంలో పౌలు వేర్వేరు శరీర రూపాలు, వాటి వేర్వేరు మహిమలను ఉదాహరణగా చూపుతున్నాడు. అందువల్ల దీనిని దేవదూతలకు గానీ ఖగోళ వస్తువులకు మాత్రమే గానీ పరిమితం చేయకుండా మూలంలోని ఉద్దేశపూర్వక విస్తృతతను నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలిని వాడాం. ‘పరలోకానికి చెందిన/భూమికి చెందిన’ అనే జంట మూలంలోని వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది; ‘మహిమ’ అనే పదం తేజస్సు, వైభవం, వేదాంత సంబంధం—ఈ మూడింటినీ తెరిచి ఉంచుతుంది.
