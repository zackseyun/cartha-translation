revisions:
- from: అయితే అన్నీ ఆయనకు లోబరచబడినప్పుడు[a], కుమారుడు తానే కూడా అన్నిటినీ తనకు లోబరచినవానికి లోబరచబడతాడు. అప్పుడు దేవుడు అన్నిటిలో అన్నీ అయి ఉంటాడు[b].
  to: కానీ అన్నీ ఆయనకు లోబరచబడినప్పుడు[a], అప్పుడు కుమారుడు తానే అన్నిటినీ తనకు లోబరచినవానికి లోబరచబడతాడు; తద్వారా దేవుడు అన్నిటిలో అన్నీ అవుతాడు[b].
