id: 1CO.15.28
reference: 1 Corinthians 15:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: te
  text: కానీ అన్నీ ఆయనకు లోబరచబడినప్పుడు[a], అప్పుడు కుమారుడు తానే అన్నిటినీ తనకు లోబరచినవానికి లోబరచబడతాడు; తద్వారా దేవుడు అన్నిటిలో అన్నీ అవుతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సమస్తం’ అని కూడా అనువదించవచ్చు. గ్రీకులో τὰ πάντα అనే పదబంధం మళ్లీ మళ్లీ వస్తూ, పౌలు వాదనలోని విశ్వవ్యాప్త పరిధిని చూపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుడు అందరిలో అన్నీ అవుతాడు.’ గ్రీకు పదబంధం చాలా సంక్షిప్తంగా ఉంది; అక్షరార్థంగా ‘అన్నిటిలో అన్నీ’ అని చెప్పవచ్చు. అది వస్తువులనో వ్యక్తులనో మాత్రమే సూచిస్తుందా అనేది వాక్యం స్పష్టంగా పరిమితం చేయదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: అయితే ... లోబరచబడినప్పుడు
  rationale: ὅταν తెలిపే కాలసంబంధాన్ని ‘అప్పుడు/ఎప్పుడు’ భావంతో సహజమైన తెలుగు ఉపవాక్యంగా ఇచ్చి, δέ సూచించే స్వల్ప మలుపును ‘అయితే’తో నిలిపాం.
- source_word: ὑποταγῇ / ὑποταγήσεται
  choice: లోబరచబడినప్పుడు / లోబరచబడతాడు
  rationale: రెండు రూపాల్లోనూ ὑποτάσσω యొక్క కర్మణి భావాన్ని, అలాగే పదపునరావృతిని నిలిపాం.
- source_word: τὰ πάντα
  choice: అన్నీ / అన్నిటినీ
  rationale: నపుంసక బహువచన పదబంధం సూచించే సమస్త సృష్టి వ్యాప్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని పునరావృతినీ సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: αὐτὸς ὁ υἱὸς
  choice: కుమారుడు తానే
  rationale: αὐτός ఇచ్చే వ్యక్తిగత ఉద్ఘాటనను ‘తానే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τῷ ὑποτάξαντι αὐτῷ τὰ πάντα
  choice: అన్నిటినీ తనకు లోబరచినవానికి
  rationale: ఆర్టికల్‌తో ఉన్న కృదంతాన్ని ‘...వానికి’గా ఇచ్చి, చర్య చేసిన వ్యక్తిని గుర్తించే మూల నిర్మాణాన్ని సంక్షిప్తంగా నిలిపాం. సందర్భంలో ‘తనకు’ కుమారుణ్ణి సూచిస్తుంది.
- source_word: ἵνα ᾖ
  choice: అప్పుడు ... అయి ఉంటాడు
  rationale: ఇక్కడ ἵνα సూచించే లక్ష్యసిద్ధి/ఫలితాన్ని తెలుగు వాక్యప్రవాహంలో సహజంగా చూపుతుంది; ‘అప్పుడు’ అంతిమ స్థితిని ముందున్న సంఘటనతో కలుపుతుంది.
- source_word: πάντα ἐν πᾶσιν
  choice: అన్నిటిలో అన్నీ
  rationale: పౌలు ఉపయోగించిన సంక్షిప్తమైన, విస్తృతార్థక పదబంధాన్ని వివరణతో సంకుచితం చేయకుండా, దాని అలంకార బలాన్ని తెలుగులో నిలిపాం.
theological_decisions:
- issue: కుమారుడు లోబరచబడడం
  choice: కుమారుడు తానే ... లోబరచబడతాడు
  alternative: కుమారుడు స్వచ్ఛందంగా విధేయుడవుతాడు; లేదా ఆయన కార్యపరంగా మాత్రమే లోబడతాడు
  rationale: మూలపాఠం భవిష్యత్ కర్మణి రూపంలో చెప్పిన విషయాన్ని నేరుగా అనువదించాం. కుమారుని స్వరూపపరమైన హీనతను సూచించే వివరణనూ, వాక్యంలోని లోబడే భావాన్ని తగ్గించే సిద్ధాంతపరమైన వివరణనూ చేర్చలేదు.
- issue: πάντα ἐν πᾶσιν యొక్క పరిధి
  choice: దేవుడు అన్నిటిలో అన్నీ అయి ఉంటాడు
  alternative: దేవుడు అందరిలో సమస్తమై ఉంటాడు
  rationale: πᾶς పదాల విస్తృతమైన, ఉద్దేశపూర్వకంగా సంక్షిప్తమైన భావాన్ని నిలిపి, దానిని కేవలం మనుషులకు గానీ వస్తువులకు గానీ పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతతో కూడిన సరళ శైలి వాడాం. ‘లోబరచబడతాడు’ కొంత అధికారికంగా వినిపించినా, మూలంలోని కర్మణి రూపం మరియు ఒకే గ్రీకు క్రియ పునరావృతిని కాపాడేందుకు ఉద్దేశపూర్వకంగా ఎంచుకున్నాం. చివరి పదబంధంలోని అసలైన సంక్షిప్తత, విస్తృతి, వ్యాఖ్యానాత్మక ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
