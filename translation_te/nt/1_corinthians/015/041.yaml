id: 1CO.15.41
reference: 1 Corinthians 15:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: te
  text: సూర్యుని మహిమ[a] వేరు, చంద్రుని మహిమ వేరు, నక్షత్రాల మహిమ వేరు; మహిమలో ఒక నక్షత్రానికీ మరొక నక్షత్రానికీ తేడా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ఈ వచనమంతటా ‘తేజస్సు’ లేదా ‘ప్రకాశం’; గ్రీకు δόξα ఇక్కడ కనిపించే కాంతిని సూచించవచ్చు. అయితే ‘మహిమ’ అనే అనువాదం పరిసర వాదనలో పౌలు పదాన్ని పునరావృతం చేసిన తీరును కాపాడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλη
  choice: వేరు
  rationale: పునరావృతమైన ἄλλη సూర్యుడు, చంద్రుడు, నక్షత్రాల మహిమల మధ్య భేదాన్ని సూచిస్తుంది. తెలుగులో ప్రతి భాగంలో ‘వేరు’ అని పునరావృతం చేయడం సహజంగా ఉండి మూలంలోని వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: δόξα
  choice: మహిమ
  rationale: ఇక్కడ కనిపించే తేజస్సు లేదా ప్రకాశం భావంలో ఉన్నప్పటికీ, ‘మహిమ’ అనే పదం పునరుత్థాన శరీరాల గురించిన పరిసర వాదనతో పదబంధ సంబంధాన్ని కాపాడుతుంది.
- source_word: ἡλίου
  choice: సూర్యుని
  rationale: δόξα మీద ఆధారపడిన షష్ఠీ విభక్తిని తెలుగులో సహజమైన సంబంధ రూపంతో అందిస్తుంది.
- source_word: σελήνης
  choice: చంద్రుని
  rationale: సూర్యునికి సమాంతరంగా ఉన్న షష్ఠీ విభక్తి సంబంధాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀστέρων
  choice: నక్షత్రాల
  rationale: బహువచన షష్ఠీ రూపాన్ని కాపాడుతూ సూర్యుడు–చంద్రుడు–నక్షత్రాలు అనే త్రయాన్ని పూర్తి చేస్తుంది.
- source_word: ἀστὴρ ... ἀστέρος
  choice: ఒక నక్షత్రానికీ మరొక నక్షత్రానికీ
  rationale: నక్షత్రం నక్షత్రంతో పోల్చబడుతున్న మూల భావాన్ని సహజమైన తెలుగు తులనాత్మక నిర్మాణంలో నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే అనే ప్రత్యేక పదం లేకుండా అర్ధవిరామం తరువాత వివరణాత్మక వాక్యం
  rationale: γάρ ముందటి ప్రకటనకు వివరణ ఇస్తుంది. తెలుగులో అర్ధవిరామం తరువాత వచ్చే వాక్యమే ఆ వివరణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘ఎందుకంటే’ చేర్చడం ఇక్కడ కొంత భారంగా ఉంటుంది.
- source_word: διαφέρει
  choice: తేడా ఉంటుంది
  rationale: క్రియ సూచించే భేదాన్ని తెలియజేస్తుంది; ‘మించుతుంది’ అని అనువదించి ఆధిక్యత భావాన్ని అనవసరంగా బలపరచదు.
- source_word: ἐν δόξῃ
  choice: మహిమలో
  rationale: నక్షత్రాల మధ్య తేడా ఏ విషయంలో ఉందో స్పష్టం చేస్తూ δόξα పునరావృతాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పునరుత్థాన వాదనలోని ఖగోళ ఉపమానంలో δόξα అనువాదం
  choice: మహిమ
  alternative: తేజస్సు / ప్రకాశం
  rationale: తక్షణ సందర్భంలో ఆకాశకాయాల కనిపించే తేజస్సు ఉద్దేశించబడినా, పౌలు పరిసర వాక్యాల్లో పునరుత్థాన శరీరాలకు కూడా ఇదే పదాన్ని వాడుతున్నాడు. ‘మహిమ’ ఆ అలంకారిక, ధార్మిక అనుసంధానాన్ని కాపాడుతుంది; పాదటిప్పణి దాని దృశ్య ప్రకాశ భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మహిమ వేరు’ అనే సమాంతర పునరావృతం మూలంలోని లయను నిలుపుతుంది. చివరి వాక్యంలో అక్షరానువాదమైన ‘నక్షత్రం నక్షత్రం నుండి భేదిస్తుంది’కు బదులుగా సాధారణ పాఠకులకు స్పష్టమైన ‘ఒక నక్షత్రానికీ మరొక నక్షత్రానికీ తేడా ఉంటుంది’ వాడబడింది.
