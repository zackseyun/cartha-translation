  choice: SBLGNT పాఠాన్ని అనుసరించి ‘మనమందరం నిద్రించము; అయితే మనమందరం రూపాంతరం చెందుతాము’ అని అనువదించడం
  alternative: ‘మనమందరం నిద్రిస్తాము; అయితే మనమందరం రూపాంతరం చెందము’ అనే భావాన్నిచ్చే ప్రసిద్ధ పాఠాంతరం
  rationale: అందించిన మూలపాఠాన్ని నేరుగా అనుసరిస్తూ, అర్థపరంగా ప్రాముఖ్యమైన పాఠాంతరాన్ని పాదసూచికలో భద్రపరుస్తుంది.
