- source_word: ὑμῖν λέγω
  choice: నేను మీకు ... చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, ప్రకటన స్వరాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: మనమందరం నిద్రించము
  rationale: గ్రీకులోని ‘నిద్రించు’ అనే మరణ రూపకాన్ని, అలాగే ‘అందరూ కాదు’ అనే వాక్యార్థాన్ని నిలుపుతుంది. తెలుగులో ఈ పదక్రమం సందర్భానుసారంగా ‘మనలో అందరూ నిద్రించరు’ అనే భావాన్ని ఇస్తుంది.
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: అయితే మనమందరం రూపాంతరం చెందుతాము
  rationale: δέ సూచించే వ్యత్యాసాన్ని ‘అయితే’ ద్వారా చూపి, ἀλλάσσω సూచించే అంత్యకాల మార్పును ‘రూపాంతరం చెందుతాము’ అని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
