  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఇదిగో,’ ‘మర్మం,’ ‘నిద్రించము,’ ‘రూపాంతరం చెందుతాము’ అనే పదాలు మూలంలోని ప్రకటన స్వరం, పౌలు రూపకం, అంత్యకాల మార్పు భావాన్ని నిలుపుతాయి.
