  language: te
  text: 'ఇదిగో, నేను మీకు ఒక మర్మాన్ని చెబుతున్నాను: మనలో అందరూ నిద్రించరు[a]; కానీ మనమందరం రూపాంతరం చెందుతాము[b].'
