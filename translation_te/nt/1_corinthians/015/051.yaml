review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the SBLGNT wording and preserves both the death-metaphor of κοιμηθησόμεθα and the universal scope of ἀλλαγησόμεθα. However, “మనమందరం నిద్రించము” can naturally be understood as “none of us will sleep,” rather than the required “not all of us will sleep.” The partial negation needs to be made explicit.
  naturalness: The register is clear, modern, and suitably solemn. “మర్మం,” “ఇదిగో,” and “రూపాంతరం చెందుతాము” are appropriate. Recasting the first clause as “మనలో అందరూ నిద్రించరు” gives the required scope naturally in Telugu.
  terminology: “మర్మం” suitably renders μυστήριον in its Pauline sense. “నిద్రించరు” retains the biblical metaphor without prematurely interpreting it as death. “రూపాంతరం చెందుతాము” appropriately conveys eschatological transformation. The textual-variant footnote is correctly anchored and does not intrude into the main text.
  issues:
  - severity: medium
    issue: The first clause does not explicitly express partial negation.
    rationale: “మనమందరం నిద్రించము” may mean “we all will not sleep” / “none of us will sleep.” Greek πάντες οὐ κοιμηθησόμεθα means “not all of us will sleep.” “మనలో అందరూ నిద్రించరు” clearly preserves that distinction.
  - severity: low
    issue: The lexical-alternative footnote repeats the same Telugu scope ambiguity.
    rationale: “మనమందరం మరణించము” can likewise imply that none will die. “మనలో అందరూ మరణించరు” accurately represents “not all will die.”
