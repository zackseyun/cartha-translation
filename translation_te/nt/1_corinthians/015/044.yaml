id: 1CO.15.44
reference: 1 Corinthians 15:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: te
  text: సహజమైన శరీరం విత్తబడుతుంది; ఆత్మసంబంధమైన శరీరం లేపబడుతుంది. సహజమైన శరీరం ఉంటే,[a] ఆత్మసంబంధమైన శరీరం కూడా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రాణసంబంధమైన శరీరం … ఆత్మసంబంధమైన శరీరం.” ఇక్కడ పౌలు భౌతిక శరీరానికీ అభౌతికమైన ఉనికికీ మధ్య వ్యత్యాసం చూపడం లేదు; సాధారణ మానవ జీవంతో జీవించే శరీరానికీ, దేవుని ఆత్మచే జీవింపజేయబడే శరీరానికీ మధ్య వ్యత్యాసం చూపుతున్నాడు.
    reason: ψυχικόν యొక్క అక్షరానుసార ప్రత్యామ్నాయాన్ని సూచించి, πνευματικόν శరీరరహితమైనదని అర్థం చేసుకోకూడదని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: σπείρεται
  choice: విత్తబడుతుంది
  rationale: వర్తమానకాల కర్మణి రూపాన్ని, ముందున్న విత్తనం–పునరుత్థానం ఉపమానాన్ని నేరుగా నిలుపుతుంది.
- source_word: σῶμα
  choice: శరీరం
  rationale: మరణం మరియు పునరుత్థాన సందర్భంలో దేహధారియైన మానవుని సూచించే సహజమైన ప్రామాణిక పదం.
- source_word: ψυχικόν
  choice: ప్రకృతి సహజమైన
  rationale: సాధారణ సృష్ట జీవంతో నడిచే స్థితిని సూచిస్తుంది; ‘భౌతికమైన’ అని అనువదిస్తే పదార్థ శరీరం–పదార్థరహిత శరీరం అనే తప్పుదారి పట్టే వ్యత్యాసం కలగవచ్చు.
- source_word: ἐγείρεται
  choice: లేపబడుతుంది
  rationale: కర్మణి రూపాన్ని కాపాడుతూ పునరుత్థానాన్ని సూచించే స్పష్టమైన తెలుగు ప్రయోగం.
- source_word: πνευματικόν
  choice: ఆత్మసంబంధమైన
  rationale: πνευματικός యొక్క పదప్రయోగాన్ని నిలుపుతూ, శరీరరహితం అని కాక ఆత్మతో లక్షణీకరించబడిన శరీరం అనే భావానికి వీలు కల్పిస్తుంది.
- source_word: Εἰ
  choice: ఉంటే
  rationale: గ్రీకు షరతు రూపాన్ని అనవసరంగా నిశ్చయార్థకంగా మార్చకుండా కాపాడుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: రెండవ రకమైన శరీరం సైతం ఉందనే సంకలన భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ప్రకృతి సహజమైన శరీరం’ మరియు ‘ఆత్మసంబంధమైన శరీరం’ మధ్య వ్యత్యాసం
  choice: ప్రధాన పాఠ్యం సాధారణ సృష్ట జీవంతో లక్షణీకరించబడిన శరీరానికీ, ఆత్మతో లక్షణీకరించబడిన శరీరానికీ మధ్యనున్న వ్యత్యాసాన్ని నిలుపుతుంది.
  alternative: ‘భౌతిక శరీరం’–‘అభౌతిక శరీరం’ లేదా అక్షరానుసారమైన ‘ప్రాణసంబంధమైన శరీరం’–‘ఆత్మసంబంధమైన శరీరం’.
  rationale: గ్రీకు పదాల వ్యత్యాసం పదార్థ శరీరానికీ శరీరరహిత ఉనికికీ మధ్యది కాదు. వివరణను ప్రధాన పాఠ్యంలో అతిగా విస్తరించకుండా, నిజమైన పదార్థ పరిధిని పాదటిప్పణిలో తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ప్రకృతి సహజమైన’ అనే రూపం ‘సహజమైన’ కంటే సాధారణ సృష్ట జీవానికి సంబంధించిన భావాన్ని కొంత స్పష్టంగా చేస్తుంది; పాదటిప్పణి అక్షరార్థ ప్రత్యామ్నాయాన్ని కాపాడుతుంది.
