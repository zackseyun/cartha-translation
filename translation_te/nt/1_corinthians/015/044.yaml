revisions:
- from: ప్రకృతి సహజమైన శరీరం విత్తబడుతుంది; ఆత్మసంబంధమైన శరీరం లేపబడుతుంది. ప్రకృతి సహజమైన శరీరం ఉంటే,[a] ఆత్మసంబంధమైన శరీరం కూడా ఉంటుంది.
  to: సహజమైన శరీరం విత్తబడుతుంది; ఆత్మసంబంధమైన శరీరం లేపబడుతుంది. సహజమైన శరీరం ఉంటే,[a] ఆత్మసంబంధమైన శరీరం కూడా ఉంటుంది.
  rationale: 'The revision makes one necessary idiomatic correction: it replaces the tautological “ప్రకృతి సహజమైన” with “సహజమైన.” The footnote is lightly refined to explain the ψυχικόν/πνευματικόν contrast as differing sources or modes of life, rather than materiality, while leaving the translated wording itself appropriately concise and lexically open.'
  reviewer_model: gpt-5.6-terra
