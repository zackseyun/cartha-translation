review_pass:
  verdict: revise
  source_fidelity: The passive-present contrasts are accurately retained by “విత్తబడుతుంది” and “లేపబడుతుంది,” and the conditional/additive logic is preserved. However, “ప్రకృతి సహజమైన” is a redundant and unnatural intensification for ψυχικόν; “సహజమైన” adequately retains the deliberately broad Greek contrast without collapsing it into material versus immaterial.
  naturalness: The proposed revision removes the tautological phrase “ప్రకృతి సహజమైన.” “ఆత్మసంబంధమైన” is retained as a suitably formal, comprehensible rendering parallel to the lexical contrast in Greek.
  terminology: “శరీరం,” “సహజమైన,” and “ఆత్మసంబంధమైన” maintain the key Pauline terminology. The note gives “ప్రాణసంబంధమైన” as a lexical alternative and clarifies the intended contrast without making the main text interpretively expansive.
  issues:
  - severity: medium
    issue: Redundant rendering of ψυχικόν
    rationale: “ప్రకృతి సహజమైన” is tautological in modern Telugu and sounds stylistically cumbersome. The Greek ψυχικόν does not require both terms; “సహజమైన” is the clearer established equivalent in this contrast.
  - severity: low
    issue: Footnote wording can state the life-source contrast more precisely
    rationale: “ఆత్మతో నడిచే” is understandable but less exact than wording that describes the body as animated or given life by the Spirit. A small revision improves clarity while preserving the explanatory, non-doctrinal purpose of the note.
  revised_text: సహజమైన శరీరం విత్తబడుతుంది; ఆత్మసంబంధమైన శరీరం లేపబడుతుంది. సహజమైన శరీరం ఉంటే,[a] ఆత్మసంబంధమైన శరీరం కూడా ఉంటుంది.
