revisions:
- from: అవివేకీ![a] నువ్వు విత్తేది చనిపోతేనే తప్ప సజీవం చేయబడదు.[b]
  to: అవివేకీ![a] నువ్వు విత్తేది చనిపోతే తప్ప జీవం పొందదు.[b]
  rationale: The revision retains every element of the Greek sentence, including the emphatic “నువ్వు,” but replaces an unnatural and potentially misleading passive with the natural Telugu expression “జీవం పొందదు.” It also regularizes the conditional phrasing. The alternatives remain anchored to the relevant expressions and do not add interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:05:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the direct vocative rebuke, the emphatic second-person subject, the sowing metaphor, and the conditional relationship. However, “సజీవం చేయబడదు” is an awkward Telugu passive and can suggest that the seed is made to enliven something else. Here ζῳοποιεῖται means that what is sown itself comes to life/is made alive. “జీవం పొందదు” conveys this accurately and naturally.
  naturalness: “చనిపోతేనే తప్ప” is less idiomatic in this negative conditional. “చనిపోతే తప్ప” is the standard natural Telugu equivalent of “unless it dies.” “జీవం పొందదు” is clearer and more idiomatic than “సజీవం చేయబడదు.”
  terminology: “అవివేకీ!” suitably renders ἄφρων as a sharp direct address without importing doctrinal interpretation. “విత్తేది” retains the agricultural wording. “జీవం పొందదు” preserves the life/resurrection-related semantic force while avoiding an unnatural verbal construction.
  issues:
  - severity: medium
    issue: The rendering “సజీవం చేయబడదు” is semantically and idiomatically problematic.
    rationale: With the seed as subject, Telugu “సజీవం చేయబడదు” is an unnatural passive and may be read as ‘is not made to make [something] alive.’ The Greek passive refers to the sown thing receiving/entering life. “జీవం పొందదు” expresses that sense clearly.
  - severity: low
    issue: The phrase “చనిపోతేనే తప్ప” is stylistically awkward in this construction.
    rationale: “చనిపోతే తప్ప ... కాదు/పడదు” is the normal Telugu expression for ‘unless it dies.’ Removing “నే” does not change the force of the Greek conditional.
  revised_text: అవివేకీ![a] నువ్వు విత్తేది చనిపోతే తప్ప జీవం పొందదు.[b]
  revised_footnotes:
