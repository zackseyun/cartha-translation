lexical_decisions:
- source_word: ἄφρων
  choice: అవివేకీ
  rationale: ఇది నేరుగా సంబోధించే గట్టి మందలింపును నిలుపుతుంది; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదమైన గ్రంథశైలికి తగినట్లుగా ఉంది.
- source_word: σὺ
  choice: నువ్వు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న కర్తృ సర్వనామం ఇచ్చే ఉద్ఘాటనను తెలుగులోనూ వ్యక్తంగా నిలిపింది.
- source_word: ὃ σπείρεις
  choice: నువ్వు విత్తేది
  rationale: వ్యవసాయ రూపకాన్ని యథాతథంగా ఉంచుతూ సహజమైన తెలుగు సంబంధవాచక నిర్మాణాన్ని వాడింది.
- source_word: ζῳοποιεῖται
  choice: సజీవం చేయబడదు
  rationale: గ్రీకు క్రియలోని కర్మణి రూపాన్నీ, జీవం కలిగించబడడం అనే భావాన్నీ నిలుపుతుంది.
- source_word: ἐὰν μὴ
  choice: చనిపోతేనే తప్ప
  rationale: ప్రతికూల షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తూ, మరణం లేకుండా జీవింపజేయబడదనే సంబంధాన్ని కాపాడుతుంది.
- source_word: ἀποθάνῃ
  choice: చనిపోతే
  rationale: షరతు నిర్మాణంలో సహజమైన తెలుగు రూపం; మూలంలో లేని ‘మొదట’ అనే మాటను చేర్చదు.
theological_decisions:
- issue: విత్తనం చనిపోవడం మరియు పునరుత్థాన జీవం మధ్య రూపకాలంకార సంబంధం
  choice: వ్యవసాయ రూపకాన్ని వివరణాత్మక సిద్ధాంత పదాలు చేర్చకుండా నిలుపడం
  alternative: దీనిని శరీర పునరుత్థానం గురించిన ప్రత్యక్ష సిద్ధాంత ప్రకటనగా విస్తరించి అనువదించడం
  rationale: పౌలు పునరుత్థానంపై వచ్చిన అభ్యంతరానికి విత్తన రూపకంతో సమాధానం ఇస్తున్నాడు; ఈ వచనంలో లేని సిద్ధాంత వివరణను అనువాదం చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గట్టి సంబోధనను మృదువుచేయకుండా, అయితే అనవసరంగా అవమానకరంగా వినిపించకుండా ఉంచింది. ‘విత్తేది’ అనే పదంతో వ్యవసాయ రూపకం, ‘సజీవం చేయబడదు’ అనే రూపంతో గ్రీకు కర్మణి భావం నిలిచాయి.
