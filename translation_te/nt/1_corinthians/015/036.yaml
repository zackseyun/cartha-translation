    reason: lexical_alternative
  revision_rationale: The revision retains every element of the Greek sentence, including the emphatic “నువ్వు,” but replaces an unnatural and potentially misleading passive with the natural Telugu expression “జీవం పొందదు.” It also regularizes the conditional phrasing. The alternatives remain anchored to the relevant expressions and do not add interpretation.
