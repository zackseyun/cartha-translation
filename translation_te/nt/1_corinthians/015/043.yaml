  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: te
  text: అది అవమానంలో విత్తబడుతుంది; మహిమలో లేపబడుతుంది. అది బలహీనతలో విత్తబడుతుంది; శక్తిలో లేపబడుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: విత్తబడుతుంది
  rationale: వర్తమానకాల కర్మణి రూపాన్ని నిలుపుతూ, పరిసర వచనాల్లోని విత్తనం–శరీరం రూపకాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ἀτιμίᾳ
  choice: అవమానంలో
  rationale: δόξῃతో ఉన్న వ్యతిరేక సమాంతరాన్ని నిలుపుతుంది; భావోద్వేగ సిగ్గు అనే అర్థానికి పరిమితం చేయకుండా గౌరవహీన స్థితిని సూచిస్తుంది.
- source_word: ἐγείρεται
  choice: లేపబడుతుంది
  rationale: పునరుత్థాన సందర్భంలో సహజమైన పదం; గ్రీకు కర్మణి ప్రయోగాన్ని కాపాడి, కార్యసాధకుడైన దేవుణ్ణి మూలంలో ఉన్నట్లే సూచితంగా ఉంచుతుంది.
- source_word: δόξῃ
  choice: మహిమలో
  rationale: పునరుత్థాన సందర్భంలోని దైవిక వైభవం, ఘనత అనే విస్తృత భావాన్ని మోసే ప్రామాణిక తెలుగు పదం.
- source_word: ἀσθενείᾳ
  choice: బలహీనతలో
  rationale: శరీర దౌర్బల్యంతో సహా పదంలోని విస్తృత భావాన్ని నిలుపుతూ, శక్తితో ఉన్న వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δυνάμει
  choice: శక్తిలో
  rationale: ἀσθενείᾳకు స్పష్టమైన వ్యతిరేక పదంగా ఉండి, కేవలం శారీరక బలానికే పరిమితం కాకుండా పునరుత్థాన జీవశక్తిని కూడా సూచించగలదు.
theological_decisions:
- issue: పునరుత్థాన వాక్యంలో కర్త మరియు కార్యసాధకుడు
  choice: “లేపబడుతుంది” అనే కర్మణి రూపాన్ని ఉపయోగించి, దేవుణ్ణి కార్యసాధకుడిగా ప్రధాన వాక్యంలో స్పష్టంగా చేర్చలేదు.
  alternative: “దేవుడు దాన్ని లేపుతాడు”
  rationale: గ్రీకు మూలం కర్మణి రూపాన్ని వాడుతుంది. దానిని నిలుపడం ద్వారా పౌలు చెప్పినట్లే దైవిక కార్యసాధకత్వం సూచితంగా ఉంటుంది.
- issue: అధ్యాహారంగా ఉన్న కర్తకు సూచన
  choice: మునుపటి సందర్భంలోని శరీరాన్ని సూచించేందుకు “అది” ఉపయోగించబడింది.
  alternative: “శరీరం విత్తబడుతుంది … శరీరం లేపబడుతుంది”
  rationale: “అది” తెలుగు వాక్యంలో సహజంగా కర్తను స్పష్టం చేస్తుంది; అదే సమయంలో పరిసర సందర్భంలో పేర్కొన్న శరీరాన్ని అనవసరంగా మళ్లీ మళ్లీ చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని అనుసరించాం. మూలంలోని రెండు వ్యతిరేక సమాంతర జతలను, కర్మణి ప్రయోగాన్ని, విత్తనం–పునరుత్థానం రూపకాన్ని నిలిపాం.
