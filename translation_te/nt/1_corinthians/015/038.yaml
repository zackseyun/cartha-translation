source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: te
  text: కానీ దేవుడు తాను సంకల్పించినట్లుగా దానికి ఒక దేహాన్ని ఇస్తాడు; ప్రతి విత్తనానికీ[a] దాని సొంత దేహాన్ని ఇస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విత్తనాల్లో ప్రతిదానికీ దాని సొంత దేహాన్ని.” గ్రీకు మూలంలో అక్షరార్థంగా “విత్తనాల్లో ప్రతిదానికీ” అని ఉంది; ఇది పంపిణీ భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίδωσιν
  choice: ఇస్తాడు
  rationale: వర్తమాన కాల క్రియను నేరుగా, సహజంగా ప్రతిబింబిస్తుంది; విత్తనం–దేహం ఉపమానంలోని దేవుని క్రియను స్పష్టంగా ఉంచుతుంది.
- source_word: αὐτῷ
  choice: దానికి
  rationale: ముందటి సందర్భంలోని విత్తనాన్ని సూచించే ఏకవచన దత్తివాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σῶμα
  choice: దేహం
  rationale: ఈ అధ్యాయం అంతటా ఉన్న శరీర/దేహ సంబంధాన్ని నిలుపుతూ, విత్తనానికి దేవుడు ఇచ్చే రూపాన్ని సూచించే సహజమైన ఆధునిక పదం.
- source_word: καθὼς ἠθέλησεν
  choice: తాను సంకల్పించిన విధంగా
  rationale: దేవుని ఉద్దేశపూర్వక చిత్తాన్ని తెలియజేస్తుంది; ‘కోరుకున్న’ అనే కేవలం అభిలాషార్థం కంటే ఇక్కడి దైవిక నిర్ణయ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: విత్తనాల్లో ప్రతిదానికీ
  rationale: ἑκάστῳతో కూడిన భాగార్థక షష్ఠీ నిర్మాణాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతుంది; ‘ప్రతి విత్తనానికీ’ అనే పంపిణీ అర్థం కూడా సాధ్యమే.
- source_word: ἴδιον
  choice: దాని సొంత
  rationale: ప్రతి విత్తనానికి ప్రత్యేకంగా చెందిన దేహం అనే వ్యక్తీకరణ బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: విత్తనం–దేహం ఉపమానంలో దేవుని కార్యం మరియు చిత్తం
  choice: ప్రతి విత్తనానికి దేహాన్ని దేవుడే తన సంకల్పం ప్రకారం ఇస్తాడని పాఠ్యం చెబుతున్న మేరకు అనువదించబడింది.
  alternative: ‘ప్రతి రకమైన విత్తనానికి తగిన ప్రత్యేక రూపం’ అని మరింత వివరణాత్మకంగా అనువదించవచ్చు.
  rationale: మూలపాఠం దేవుని చిత్తాన్నీ, ప్రతి విత్తనానికి దాని సొంత దేహం ఉండడాన్నీ నొక్కిచెబుతుంది; అయితే ‘రకం’ లేదా ‘జాతి’ అనే భావాన్ని స్పష్టంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దేహం’ అనే పదం పునరావృతం మూలంలోని σῶμα పదబంధాన్నీ, అధ్యాయంలోని పునరుత్థాన దేహ సంబంధాన్నీ నిలుపుతుంది.
