id: 1CO.15.55
reference: 1 Corinthians 15:55
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ποῦ σου, θάνατε, τὸ ⸂νῖκος; ποῦ σου, θάνατε, τὸ κέντρον⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/055.yaml
  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: te
  text: “ఓ మరణమా, నీ విజయం ఎక్కడ[a]? ఓ మరణమా, నీ ముల్లు ఎక్కడ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో మొదటి ఉపవాక్యం, “ఓ మరణమా, నీ ముల్లు ఎక్కడ?” అని ఉంది. ఈ పాఠాంతరమే కింగ్ జేమ్స్ వెర్షన్‌తో పాటు మరికొన్ని సంప్రదాయ అనువాదాల్లో కనిపిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: ఎక్కడ
  rationale: ఎగతాళితో కూడిన అలంకారిక ప్రశ్నను సూటిగా వ్యక్తపరుస్తుంది; మూలంలో లేని అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: σου
  choice: నీ
  rationale: రెండవ పురుష ఏకవచన స్వామ్యార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: θάνατε
  choice: ఓ మరణమా
  rationale: సంబోధన విభక్తిని, మరణాన్ని వ్యక్తిగా సంబోధించే కవితాత్మక బలాన్ని నిలుపుతుంది.
- source_word: νῖκος
  choice: విజయం
  rationale: విజయం లేదా జయాన్ని సూచించే సాధారణ అర్థాన్ని స్పష్టంగా ఇస్తుంది; 54వ వచనంలోని సందర్భంతోనూ సరిపోతుంది.
- source_word: κέντρον
  choice: ముల్లు
  rationale: కుట్టే మొన లేదా ముల్లు అనే రూపకాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; వెంటనే వచ్చే 56వ వచనంలోని వివరణతో సరిపోతుంది.
theological_decisions:
- issue: మొదటి ఉపవాక్యంలోని పాఠాంతరం
  choice: SBLGNTలోని νῖκος ప్రకారం ప్రధాన పాఠంలో “విజయం” అని అనువదించడం
  alternative: కొన్ని ప్రతుల ప్రకారం మొదటి ఉపవాక్యంలో కూడా “ముల్లు” అని అనువదించడం
  rationale: అందించిన మూలపాఠంలో νῖκος ఉంది; కాబట్టి మూలభాషా ఆధారానికి ప్రాధాన్యమిస్తూ “విజయం”ను ప్రధాన పాఠంలో ఉంచాం. ప్రసిద్ధ సంప్రదాయ పాఠాంతరాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సంబోధనను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. “ఓ మరణమా” అనే రూపం గ్రీకు సంబోధనను స్పష్టంగా ప్రతిబింబిస్తుంది.
