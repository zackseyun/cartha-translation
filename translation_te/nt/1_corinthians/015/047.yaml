source:
  edition: SBLGNT
  text: ὁ πρῶτος ἄνθρωπος ἐκ γῆς χοϊκός, ὁ δεύτερος ⸀ἄνθρωπος ἐξ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: te
  text: మొదటి మనిషి భూమికి చెందినవాడు, ధూళిమయుడు[a]; రెండవ మనిషి పరలోకానికి చెందినవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధూళికి చెందినవాడు” లేదా “ధూళితో చేసినవాడు.” గ్రీకు విశేషణం χοϊκός ఆదాము ధూళి నుండి సృష్టించబడిన వృత్తాంతాన్ని ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: మొదటి
  rationale: ఆదాము–క్రీస్తు వ్యత్యాసంలో మొదటి ప్రతినిధిని సూచించే క్రమసంఖ్యను సహజంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: ἄνθρωπος
  choice: మనిషి
  rationale: రెండు భాగాల్లోనూ ఆదాము, క్రీస్తులను ప్రతినిధి పురుషులుగా సూచిస్తూ, పౌలు ఉద్దేశపూర్వకంగా చేసిన సమాంతర ప్రయోగాన్ని నిలుపుతుంది.
- source_word: ἐκ γῆς
  choice: భూమినుండి వచ్చినవాడు
  rationale: మూలం లేదా ఉద్భవాన్ని తెలియజేసే ἐκ γῆς భావాన్ని, సృష్టి వృత్తాంతపు ప్రతిధ్వనితో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: χοϊκός
  choice: ధూళితో చేయబడినవాడు
  rationale: ‘ధూళితో చేసిన/ధూళికి చెందిన’ అనే పదార్థాన్ని, ఆదాము ధూళినుండి సృష్టించబడిన సంగతికి ఉన్న సూచనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: δεύτερος
  choice: రెండవ
  rationale: ‘మొదటి’తో ఉన్న స్పష్టమైన క్రమసంఖ్యా వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐξ οὐρανοῦ
  choice: పరలోకంనుండి వచ్చినవాడు
  rationale: ఇక్కడ οὐρανός సూచించే దివ్యమైన మూలాన్ని ‘ఆకాశం’ అని భౌతికంగా పరిమితం చేయకుండా, సందర్భానుకూలంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘రెండవ మనిషి’ యొక్క క్రీస్తుసంబంధ అర్థం
  choice: ‘రెండవ మనిషి’ అని మాత్రమే ఉంచడం
  alternative: ‘రెండవ మనిషైన క్రీస్తు’ అని స్పష్టీకరించడం
  rationale: సందర్భం ఆయనను క్రీస్తుగా గుర్తించినా, ఈ వాక్యంలో గ్రీకు మూలం ఆయన పేరును చేర్చదు; అందువల్ల మూలంలోని సంక్షిప్తతను, ఆదాము–క్రీస్తు నమూనాను అలాగే నిలిపాం.
- issue: రెండవ భాగంలోని క్రియాకాలం
  choice: ‘పరలోకంనుండి వచ్చినవాడు’ అనే కాలపరంగా సహజమైన నామవాచక నిర్మాణం
  alternative: ‘పరలోకంనుండి ఉన్నవాడు’ లేదా స్పష్టంగా ‘వచ్చాడు’ అని అనువదించడం
  rationale: గ్రీకులో రెండు భాగాల్లోనూ సంధానక్రియ ప్రత్యక్షంగా లేదు. తెలుగు సహజత్వం కోసం ఒక నిర్దిష్ట కాలాన్ని బలవంతంగా చేర్చకుండా మూలం/ఉద్భవ భావాన్ని తెలిపే సమాంతర నిర్మాణాన్ని ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘మొదటి మనిషి ... రెండవ మనిషి’ అనే మూల సమాంతరతను నిలిపి, χοϊκός యొక్క సృష్టి-ధూళి సూచనను ప్రధాన పాఠ్యంలో స్పష్టంగా వ్యక్తం చేశాం.
