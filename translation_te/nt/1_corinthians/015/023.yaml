id: 1CO.15.23
reference: 1 Corinthians 15:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: te
  text: 'అయితే ప్రతి ఒక్కరూ తమ తమ క్రమంలో జీవింపజేయబడతారు: ప్రథమఫలం మెస్సీయ; తరువాత, ఆయన రాకడలో మెస్సీయకు చెందినవారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστος
  choice: ప్రతి ఒక్కరూ
  rationale: ముందటి సందర్భంలో చెప్పిన జీవింపజేయబడటాన్ని వ్యక్తులవారీగా విభజిస్తూ చెప్పే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: తమ తమ క్రమంలో
  rationale: τάγμα ఇక్కడ సైనిక హోదాకన్నా పునరుత్థాన సంఘటనల నియమిత వరుసను సూచిస్తుంది. తెలుగు వాడుకలో ‘తమ తమ’ పంపిణీ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀπαρχὴ
  choice: ప్రథమఫలంగా
  rationale: పంటలో మొదట దేవునికి అర్పించే భాగం అనే బైబిలు రూపకాన్ని, దాని తరువాత మరిన్ని ఫలాలు వస్తాయనే సూచనను కాపాడుతుంది.
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఈ వాక్యంలో ఇది వ్యక్తిగత పేరులా కాక అభిషిక్తుడనే బిరుదుగా, అంత్యకాల ప్రాధాన్యంతో వాడబడింది.
- source_word: οἱ τοῦ Χριστοῦ
  choice: మెస్సీయకు చెందినవారు
  rationale: సంబంధం లేదా స్వామ్యాన్ని తెలిపే గ్రీకు షష్ఠీ విభక్తి భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: παρουσίᾳ
  choice: రాకడ సమయంలో
  rationale: παρουσία ఉనికి లేదా చేరికను కూడా సూచించగలిగినా, ఇక్కడ మెస్సీయ భవిష్యత్తులో వచ్చే సంఘటనను సూచిస్తుంది; ‘రాకడ’ ఆ భావాన్ని అదనపు సిద్ధాంత వివరణ లేకుండా తెలియజేస్తుంది.
- source_word: '[ellipsis from preceding context]'
  choice: జీవింపజేయబడతారు
  rationale: గ్రీకు వాక్యం ముందు వచనంలోని ‘జీవింపజేయబడతారు’ అనే క్రియను అన్వయించుకుంటుంది. స్వతంత్రంగా చదివినప్పుడు తెలుగు వాక్యం సంపూర్ణంగా, అర్థవంతంగా ఉండేందుకు ఆ క్రియను స్పష్టంగా తెలిపాం.
theological_decisions:
- issue: Χριστόςను బిరుదుగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: పునరుత్థాన క్రమంలో మెస్సీయను, ఆయనకు చెందినవారిని పోల్చే ఈ సందర్భంలో ‘అభిషిక్తుడు’ అనే బిరుదు భావం ప్రధానంగా ఉంది. ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచాం.
- issue: παρουσίαకు అంత్యకాల సందర్భంలోని అర్థం
  choice: రాకడ
  alternative: సన్నిధి లేదా చేరిక
  rationale: ఇక్కడ ఆయనకు చెందినవారు జీవింపజేయబడే భవిష్యత్తు సందర్భాన్ని సూచిస్తున్నందున ‘రాకడ’ సహజంగా సరిపోతుంది; అయినా గ్రీకు పదంలోని విస్తృత అర్థపరిధిని పాదసూచికలో నిలిపాం.
- issue: ప్రథమఫల రూపకం మరియు పునరుత్థాన క్రమం
  choice: ప్రథమఫలంగా మెస్సీయ
  alternative: మొదటి భాగంగా మెస్సీయ
  rationale: పంటకు సంబంధించిన మూల రూపకాన్ని కాపాడుతూ, మెస్సీయ పునరుత్థానం తరువాతివారి పునరుత్థానానికి ముందస్తు ఫలమనే భావాన్ని సిద్ధాంతపరంగా అతివివరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన కానీ సహజమైన శైలిని ఉపయోగించాం. ముందు వచనం నుంచి అన్వయించే క్రియను తెలుగులో స్పష్టంచేశాం. ‘ప్రథమఫలం’ అనే బైబిలు పంట రూపకాన్ని, ‘మెస్సీయ’ అనే బిరుదు భావాన్ని నిలిపాం; παρουσίαలోని పదార్థ విస్తృతిని పాదసూచికలో భద్రపరిచాం.
