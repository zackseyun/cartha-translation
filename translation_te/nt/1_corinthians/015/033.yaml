  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: te
  text: 'మోసపోవద్దు: చెడు సహవాసాలు మంచి నడవడిని పాడుచేస్తాయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెడు సంభాషణలు మంచి నడవడిని పాడుచేస్తాయి.” గ్రీకు పదం సహవాసాన్ని లేదా సంభాషణను సూచించవచ్చు; ఈ సందర్భంలో “సహవాసాలు” అనే విస్తృత భావం బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: మోసపోవద్దు
  rationale: ఈ నిషేధ వాక్యం ఇతరుల వల్లనో స్వయంగా కలిగిన భ్రమ వల్లనో అనే విషయాన్ని నిర్దిష్టం చేయకుండా, గ్రీకు మధ్యమ/కర్మణి రూపంలోని హెచ్చరికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: φθείρουσιν
  choice: పాడుచేస్తాయి
  rationale: నైతిక నడవడిలో క్షీణత కలిగించడాన్ని సహజంగా తెలియజేస్తుంది; ‘నాశనం చేస్తాయి’ అనేది ఇక్కడ అతిగా బలమైనది.
- source_word: ἤθη
  choice: నడవడిని
  rationale: ఈ సందర్భంలో ఈ పదం కేవలం మర్యాదలను కాక నైతిక అలవాట్లు, ప్రవర్తనను సూచిస్తుంది. ‘నడవడి’ సాధారణ పాఠకులకు సహజంగా ఉండి ఆ నైతిక భావాన్ని అందిస్తుంది.
- source_word: χρηστὰ
  choice: మంచి
  rationale: ἤθηను నైతికంగా విశేషించే సాధారణ, నేరుగా అర్థమయ్యే సమానార్థకం.
- source_word: ὁμιλίαι
  choice: సహవాసాలు
  rationale: ఈ పదం సంభాషణలను గానీ అనుబంధాలను గానీ సూచించగలదు. సందర్భంలోని సామెతస్వరూప హెచ్చరికలో వ్యక్తులతో ఉండే సంబంధాలు అనే విస్తృత భావానికి ‘సహవాసాలు’ సరిపోతుంది; సంభాషణలనే సూచించే అవకాశం పాదసూచికలో నిలుపబడింది.
- source_word: κακαί
  choice: చెడు
  rationale: నైతికంగా హానికరమైన సహవాసాలను సూటిగా సూచిస్తుంది; మరింత తీవ్రతగల ‘దుష్ట’ అనే పదాన్ని అనవసరంగా చేర్చదు.
