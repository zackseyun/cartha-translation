id: 1CO.15.32
reference: 1 Corinthians 15:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: te
  text: కేవలం మానవ దృష్టితో చెప్పాలంటే[a], నేను ఎఫెసులో క్రూరమృగాలతో పోరాడితే[b], దానివల్ల నాకు ప్రయోజనమేమిటి? చనిపోయినవారు లేపబడకపోతే, “మనం తిందాం, తాగుదాం[c]; ఎందుకంటే రేపు చనిపోతాం.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కేవలం మానవ దృష్టితో నేను ఎఫెసులో క్రూరమృగాలతో పోరాడితే…” ఈ పదబంధం పౌలు మాట్లాడుతున్న తీరును గానీ, ఆయన పేర్కొంటున్న దృష్టికోణాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “క్రూరమృగాలతో పోరాడితే” అనే మాటను అక్షరార్థంగా తీసుకోవచ్చు; లేదా క్రూరమైన మానవ ప్రత్యర్థులతో జరిగిన పోరాటానికి రూపకంగా అర్థం చేసుకోవచ్చు. ప్రధాన పాఠ్యం గ్రీకులోని చిత్రాన్ని అలాగే ఉంచింది.
    reason: alternative_reading
  - marker: c
    text: యెషయా 22:13 నుండి ఉల్లేఖనం లేదా దానికి సూచన.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: కేవలం మానవ దృష్టితో చెప్పాలంటే
  rationale: ఈ నుడికారం పౌలు మాట్లాడుతున్న తీరును లేదా ఆయన ప్రతిపాదిస్తున్న మానవ దృష్టికోణాన్ని సూచించవచ్చు. సహజమైన ఆధునిక తెలుగులో ఈ రెండింటికీ చోటు ఉంచేలా అనువదించబడింది.
- source_word: ἐθηριομάχησα
  choice: నేను క్రూరమృగాలతో పోరాడితే
  rationale: గ్రీకు క్రియలోని స్పష్టమైన మృగాలతో పోరాడే చిత్రాన్ని నిలుపుతూ, అది అక్షరార్థమా లేక క్రూరమైన మానవ ప్రత్యర్థులకు రూపకమా అన్నది ప్రధాన పాఠ్యంలో తేల్చలేదు.
- source_word: ἐν Ἐφέσῳ
  choice: ఎఫెసులో
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: τί μοι τὸ ὄφελος
  choice: దానివల్ల నాకు ప్రయోజనమేమిటి?
  rationale: లాభం లేదా ప్రయోజనం గురించిన అలంకార ప్రశ్నను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: νεκροὶ
  choice: చనిపోయినవారు
  rationale: వ్యక్తులను సూచించే substantival adjective‌ను సాధారణ పాఠకులకు స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: ἐγείρονται
  choice: లేపబడకపోతే
  rationale: గ్రీకులోని కర్మణి ప్రయోగాన్ని నిలుపుతుంది; లేపేది ఎవరో పాఠ్యంలో అదనంగా పేర్కొనదు.
- source_word: Φάγωμεν καὶ πίωμεν
  choice: మనం తిందాం, తాగుదాం
  rationale: hortatory subjunctive‌ల ప్రేరణాత్మక భావాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: ఎందుకంటే రేపు చనిపోతాం
  rationale: వర్తమాన రూపంలో ఉన్నప్పటికీ భవిష్యత్తును సూచించే వాక్యభావాన్ని సహజంగా అందిస్తూ యెషయా 22:13 ప్రతిధ్వనిని కాపాడుతుంది.
theological_decisions:
- issue: ἐθηριομάχησα అక్షరార్థంగా నిజమైన మృగాలతో పోరాటాన్నా, లేక క్రూరమైన మానవ ప్రత్యర్థులతో సంఘర్షణకు రూపకాన్నా సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘క్రూరమృగాలతో పోరాడితే’ అనే గ్రీకు చిత్రాన్ని యథాతథంగా ఉంచడం
  alternative: ఎఫెసులో క్రూరమైన మానవ ప్రత్యర్థులతో పోరాడినట్లు స్పష్టంగా వ్యాఖ్యానించడం
  rationale: వాక్యంలోని వాదన ఈ చారిత్రక ప్రశ్నను అనువాదకుడు తేల్చాలని కోరదు. అందువల్ల మూలపాఠ్యంలోని నిజమైన సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. అలంకార ప్రశ్న యొక్క పదును, పునరుత్థానానికి సంబంధించిన కర్మణి ప్రయోగం, చివరి ఉల్లేఖనంలోని సంక్షిప్త నినాద ధోరణి నిలుపబడ్డాయి.
