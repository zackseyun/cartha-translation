  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: te
  text: అందరికంటే చివరిగా, అకాలంలో పుట్టినవానివంటి నాకూ[a] ఆయన కనిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “గర్భస్రావమైన పిండంవంటి నాకూ” లేదా “అబార్షన్ అయిన పిండంవంటి నాకూ.” పౌలు ఇక్కడ తనను తాను తగ్గించుకొనే కఠినమైన రూపకాన్ని ఉపయోగిస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: అందరికంటే చివరిగా
  rationale: ఇది మునుపు పేర్కొన్న సాక్షులందరి తరువాత జరిగిన దర్శనాన్ని సూచిస్తుంది. δέ ఇక్కడ బలమైన వ్యతిరేకతకన్నా జాబితాను కొనసాగిస్తుంది; తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: ὡσπερεὶ
  choice: వంటి
  rationale: పోలికను సహజమైన తెలుగులో తెలియజేస్తుంది; దాని సుమారు పోలిక భావం సందర్భంలో నిలుస్తుంది.
- source_word: τῷ ἐκτρώματι
  choice: అకాలంలో పుట్టినవానివంటి నాకూ
  rationale: ἔκτρωμα అక్షరార్థంగా గర్భస్రావమైన లేదా గర్భంలోనే తొలగించబడిన శిశువును సూచించే కఠినమైన ఆత్మన్యూనత రూపకం. ప్రధాన వాక్యంలో దాని అసాధారణ జనన భావాన్ని గౌరవప్రదంగా, అర్థమయ్యేలా ఉంచి, మరింత అక్షరార్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: ὤφθη
  choice: ఆయన కనిపించాడు
  rationale: పునరుత్థాన దర్శనాల సందర్భంలో ఈ నిష్క్రియారూపం ‘కనిపించాడు’ అనే భావాన్ని సహజంగా ఇస్తుంది; కర్త అయిన క్రీస్తు సందర్భం ద్వారా స్పష్టంగా ఉంటాడు.
- source_word: κἀμοί
  choice: నాకూ
  rationale: καί + ἐμοί లోని చేర్పు భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పౌలు తనను ἐκτρώματι అని వర్ణించుకోవడం
  choice: ప్రధాన పాఠ్యంలో ‘అకాలంలో పుట్టినవానివంటి’ అని ఉంచి, కఠినమైన అక్షరార్థాన్ని పాదటిప్పణిలో ఇవ్వడం
  alternative: ‘గర్భస్రావమైనవానివంటి’ లేదా ‘గర్భంలోనే తొలగించబడినవానివంటి’
  rationale: గ్రీకు రూపకంలోని అసాధారణతను, పౌలు ఆత్మన్యూనతను నిలుపుతూ, అది అతని అపొస్తలత్వం గురించి ఏ నిర్దిష్ట సిద్ధాంతార్థాన్ని సూచిస్తుందో అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని కఠిన రూపకాన్ని పూర్తిగా మృదువుచేయకుండా ప్రధాన పాఠ్యంలో చదవదగిన రూపాన్ని, పాదటిప్పణిలో అక్షరార్థ ప్రత్యామ్నాయాలను ఇచ్చాం.
