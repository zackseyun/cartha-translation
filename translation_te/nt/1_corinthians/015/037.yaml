review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast between what is sown and the future σώμα, as well as the contingent illustrative force of εἰ τύχοι. A minor revision makes γυμνὸν κόκκον and τινος τῶν λοιπῶν clearer in idiomatic Telugu without adding interpretation.
  naturalness: The present construction repeats ‘విత్తేది’ and ‘విత్తుతున్నావు’ in a somewhat heavy way, and ‘మిగిలినవాటిలో దేనిదైనా’ leaves the implied category unclear. A more direct verbal construction is natural modern standard Telugu.
  terminology: ‘దేహం,’ ‘ఉనికిలోకి రాబోయే,’ ‘గోధుమ,’ and ‘గింజ’ appropriately retain the source terminology and the resurrection-body connection. ‘కేవలం ఒక గింజ’ suitably conveys ‘a bare kernel’ in natural Telugu.
  issues:
  - severity: low
    issue: ‘మిగిలినవాటిలో దేనిదైనా’ has an unclear referent.
    rationale: The Greek means a seed of one of the other kinds. Naming ‘other kinds’ explicitly makes the agricultural reference clear while retaining the Greek’s indefiniteness.
  - severity: low
    issue: The sentence structure is slightly cumbersome because the sowing verb is framed both nominally and finally.
    rationale: Recasting it as a direct generic statement preserves the Greek’s repetition of σπείρεις while reading more smoothly in Telugu.
  revised_text: నీవు విత్తేటప్పుడు, ఉనికిలోకి రాబోయే దేహాన్ని విత్తడం లేదు; కేవలం ఒక గింజను విత్తుతున్నావు—అది గోధుమ గింజ కావచ్చు, లేదా మరేదైనా రకానికి చెందిన గింజ కావచ్చు.
