id: 1CO.15.37
reference: 1 Corinthians 15:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: te
  text: నీవు విత్తేటప్పుడు, ఉనికిలోకి రాబోయే దేహాన్ని విత్తడం లేదు; కేవలం ఒక గింజను విత్తుతున్నావు—అది గోధుమ గింజ కావచ్చు, లేదా మరేదైనా రకానికి చెందిన గింజ కావచ్చు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεις
  choice: విత్తేది / విత్తుతున్నావు
  rationale: వ్యవసాయ సందర్భంలోని ‘విత్తు’ అనే సహజమైన తెలుగు క్రియను వాడి, పునరుత్థానం గురించిన విత్తన రూపకాన్ని నిలిపింది.
- source_word: σῶμα
  choice: దేహం
  rationale: పౌలు పునరుత్థాన చర్చలో ఉపయోగించిన ‘దేహం’ అనే భావాన్ని యథాతథంగా నిలుపుతుంది; ‘రూపం’ అని సడలించి అనువదించలేదు.
- source_word: τὸ γενησόμενον
  choice: ఉనికిలోకి రాబోయే
  rationale: γίνομαι యొక్క ‘ఉనికిలోకి రావడం’ అనే భావాన్ని చూపుతుంది; కేవలం మొక్క పెరగడంగా పరిమితం చేయకుండా భవిష్యత్తు దేహంతో సంబంధాన్ని కాపాడుతుంది.
- source_word: γυμνὸν κόκκον
  choice: కేవలం ఒక విత్తనపు గింజ
  rationale: γυμνός ఇక్కడ అలంకారములేని లేదా ఇంకా భవిష్యత్ దేహాన్ని ధరించని గింజను సూచిస్తుంది. తెలుగులో ‘నగ్నమైన గింజ’ కంటే ‘కేవలం ... గింజ’ సహజంగా ఉండి వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: εἰ τύχοι
  choice: కావచ్చు
  rationale: ఇది కఠినమైన షరతును కాక ఉదాహరణాత్మక సంభావ్యతను వ్యక్తం చేస్తుంది.
- source_word: σίτου
  choice: గోధుమ గింజ
  rationale: సందర్భంలో σῖτοςను సాధారణ ధాన్యంగా కాక నిర్దిష్టంగా గోధుమగా గ్రహించడం సహజం.
- source_word: τινος τῶν λοιπῶν
  choice: మిగిలినవాటిలో దేనిదైనా
  rationale: గ్రీకు వాక్యంలోని ‘మిగిలిన వాటిలో ఏదో ఒకటి’ అనే నిర్మాణాన్ని, ఇతర రకాల విత్తనాలను సూచించేలా సహజ తెలుగులో నిలిపింది.
theological_decisions:
- issue: విత్తనానికి పునరుత్థాన దేహానికి ఉన్న సంబంధం
  choice: ‘దేహం’ అనే పదాన్ని, భవిష్యత్తులో ఉనికిలోకి వచ్చే భావాన్ని నిలిపి, రూపకాన్ని అంతకుమించి వివరించలేదు.
  alternative: ‘తరువాత మొలిచే మొక్కను నీవు విత్తడం లేదు’ అని పూర్తిగా వృక్ష సంబంధమైన భాషలో అనువదించడం.
  rationale: వాక్యం మార్పు మరియు కొనసాగింపును సూచించినా, ఆ సంబంధంపై పూర్తి సిద్ధాంత వివరణ ఇవ్వదు. అందుచేత వ్యవసాయ రూపకాన్నీ ‘దేహం’ అనే పౌలు పదాన్నీ కలిపి ఉంచడం అసలు వాక్యంలోని ఉద్దేశపూర్వక theological tensionను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలి. గ్రీకు వాక్యంలోని పునరుక్తి మరియు విత్తన–దేహ వ్యత్యాసం నిలిపబడ్డాయి.
