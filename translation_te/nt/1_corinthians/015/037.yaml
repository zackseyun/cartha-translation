revisions:
- from: నీవు విత్తేది, ఉనికిలోకి రాబోయే దేహాన్ని కాదు; కేవలం ఒక విత్తనపు గింజను—అది గోధుమ గింజ కావచ్చు, లేదా మిగిలినవాటిలో దేనిదైనా కావచ్చు—విత్తుతున్నావు.
  to: నీవు విత్తేటప్పుడు, ఉనికిలోకి రాబోయే దేహాన్ని విత్తడం లేదు; కేవలం ఒక గింజను విత్తుతున్నావు—అది గోధుమ గింజ కావచ్చు, లేదా మరేదైనా రకానికి చెందిన గింజ కావచ్చు.
  rationale: The revision retains the future-oriented ‘body’ language and the seed metaphor without doctrinal expansion. It renders γυμνὸν κόκκον as ‘కేవలం ఒక గింజ’ and clarifies that the alternative is a seed belonging to another kind, corresponding to τινος τῶν λοιπῶν.
