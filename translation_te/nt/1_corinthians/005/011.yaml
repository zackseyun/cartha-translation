revisions:
- from: 'అయితే ఇప్పుడు నేను మీకు రాసినది ఏమిటంటే: సహోదరుడు అని పిలువబడే వ్యక్తి లైంగిక దుర్నీతిపరుడైనా, అత్యాశపరుడైనా, విగ్రహారాధకుడైనా, దూషించేవాడైనా, తాగుబోతైనా, దోచుకునేవాడైనా అతనితో సహవాసం చేయకూడదు; అలాంటి వ్యక్తితో కలిసి భోజనం కూడా చేయకూడదు.'
  to: 'అయితే ఇప్పుడు నేను మీకు ఇలా రాశాను: సహోదరుడు అని పిలువబడే ఎవరైనా లైంగిక దుర్నీతిపరుడై, అత్యాశపరుడై, విగ్రహారాధకుడై, దూషించేవాడై, తాగుబోతై, లేదా దోపిడీ చేసేవాడై ఉంటే, అతనితో సాంగత్యం చేయకూడదు; అలాంటి వ్యక్తితో కలిసి భోజనం కూడా చేయకూడదు.'
  rationale: The revision explicitly retains the Greek conditional clause, replaces a potentially misleading Telugu term for social association, and uses a direct past-tense epistolary formulation. It preserves the full list, its generic masculine reference, and the climactic ‘not even eat with’ prohibition without adding ecclesial or doctrinal limitations.
  reviewer_model: gpt-5.6-terra
