id: 1CO.5.11
reference: 1 Corinthians 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: te
  text: 'అయితే ఇప్పుడు నేను మీకు ఇలా రాశాను: సహోదరుడు అని పిలువబడే ఎవరైనా లైంగిక దుర్నీతిపరుడై, అత్యాశపరుడై, విగ్రహారాధకుడై, దూషించేవాడై, తాగుబోతై, లేదా దోపిడీ చేసేవాడై ఉంటే, అతనితో సాంగత్యం చేయకూడదు; అలాంటి వ్యక్తితో కలిసి భోజనం కూడా చేయకూడదు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: అయితే ఇప్పుడు నేను మీకు రాసినది ఏమిటంటే
  rationale: Greek aorist ἔγραψα ను ‘రాసినది’గా నిలుపుతూ, νῦν δέ యొక్క సందర్భ మార్పును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μὴ συναναμίγνυσθαι
  choice: అతనితో సహవాసం చేయకూడదు
  rationale: పదం సూచించే సన్నిహిత సామాజిక కలయికను ‘సహవాసం’ స్పష్టంగా తెలియజేస్తుంది; చివరి భోజన నిషేధం దాని ప్రాయోగిక తీవ్రతను వివరిస్తుంది.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: సహోదరుడు అని పిలువబడే వ్యక్తి
  rationale: తాను సహోదరుడని చెప్పుకునేవాడా లేక ఇతరులు అలా పిలిచేవాడా అనే గ్రీకు వాక్యంలోని స్వల్ప అస్పష్టతను పరిష్కరించకుండా ఉంచుతుంది.
- source_word: πόρνος
  choice: లైంగిక దుర్నీతిపరుడు
  rationale: అక్రమ లైంగిక ప్రవర్తనను విస్తృతంగా, ఆధునిక పాఠకులకు అర్థమయ్యేలా సూచిస్తుంది.
- source_word: πλεονέκτης
  choice: అత్యాశపరుడు
  rationale: ఇతరులదాన్ని మరింతగా పొందాలనే దురాశను సూచించే సాధారణ, సహజ తెలుగు పదం.
- source_word: λοίδορος
  choice: దూషించేవాడు
  rationale: నిందిస్తూ, అవమానకరంగా మాట్లాడే వ్యక్తిని సూచిస్తుంది; కేవలం శారీరక హింస అనే భావాన్ని దిగుమతి చేయదు.
- source_word: μέθυσος
  choice: తాగుబోతు
  rationale: మద్యపానానికి అలవాటుపడి మత్తులో ఉండే వ్యక్తిని సాధారణ ఆధునిక తెలుగులో నేరుగా సూచిస్తుంది.
- source_word: ἅρπαξ
  choice: దోచుకునేవాడు
  rationale: బలవంతంగా లేదా అన్యాయంగా ఇతరుల సొత్తును స్వాధీనం చేసుకునే భావాన్ని నిలుపుతుంది; కేవలం మోసానికే పరిమితం చేయదు.
- source_word: μηδὲ συνεσθίειν
  choice: కలిసి భోజనం కూడా చేయకూడదు
  rationale: గ్రీకులోని బలమైన ‘కనీసం కలిసి తినకూడదు’ అనే నిషేధాన్ని సహజమైన తెలుగు క్రమంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘సహోదరుడు అని పిలువబడే’ వ్యక్తి యొక్క సంఘస్థితి
  choice: సహోదరుడు అని పిలువబడే వ్యక్తి
  alternative: తాను సహోదరుడినని చెప్పుకునే వ్యక్తి
  rationale: ὀνομαζόμενος అనే కర్మణి రూపం ఎవరు అతనిని అలా పిలుస్తున్నారో నిర్దిష్టం చేయదు; అందువల్ల సంఘసభ్యత్వం లేదా నిజమైన విశ్వాస స్థితిపై తీర్పును అనువాదంలో చేర్చలేదు.
- issue: కలిసి భోజనం చేయకూడదనే ఆజ్ఞ యొక్క పరిధి
  choice: అలాంటి వ్యక్తితో కలిసి భోజనం కూడా చేయకూడదు
  alternative: ప్రభుభోజనం కూడా అతనితో చేయకూడదు
  rationale: συνεσθίειν సాధారణంగా కలిసి తినడాన్ని సూచిస్తుంది. ఇది ప్రత్యేకంగా ప్రభుభోజనానికే పరిమితమని మూలపాఠం చెప్పదు; అందుచేత ఆ సిద్ధాంతపరమైన పరిమితిని దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా అర్థమయ్యే శైలి. పాపాల జాబితా సమాంతర నిర్మాణంతో ఉంచబడింది. మూలంలో లేని వివరణాత్మక పాదసూచికలు చేర్చలేదు.
