id: 1CO.5.12
reference: 1 Corinthians 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί γάρ ⸀μοι τοὺς ἔξω κρίνειν; οὐχὶ τοὺς ἔσω ὑμεῖς κρίνετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/012.yaml
  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: te
  text: బయటివారికి తీర్పు తీర్చడానికి నాకేమి సంబంధం? లోపలివారికి తీర్పు తీర్చవలసింది మీరే కదా?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బయటివారికి తీర్పు తీర్చే పని నాకెందుకు?”
    reason: lexical_alternative
  - marker: b
    text: అంటే, సంఘ సమాజం లోపలివారు. “తీర్పు తీరుస్తారు” అని కూడా అనువదించవచ్చు; గ్రీకులో క్రియ వర్తమాన సూచనార్థక రూపంలో ఉంది, అయితే సందర్భంలో అది బాధ్యతను సూచిస్తుంది.
    reason: cultural_and_grammatical_note
lexical_decisions:
- source_word: τί γάρ μοι
  choice: నాకేమి సంబంధం?
  rationale: ఈ గ్రీకు ప్రయోగం ‘అది నాకెందుకు సంబంధించిన విషయం?’ అనే భావాన్ని వ్యక్తం చేస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేలా, γάρ సందర్భంలో ముందటి వాదనతో ఏర్పరచే సంబంధాన్ని కొనసాగిస్తూ ఇలా అనువదించాం.
- source_word: τοὺς ἔξω
  choice: బయటివారు
  rationale: సంఘ సమాజానికి వెలుపల ఉన్నవారిని సూచించే సామాజిక-సముదాయ ప్రయోగం. కేవలం భౌతికంగా బయట ఉన్నారనే భావం రాకుండా, తరువాతి ‘లోపలివారు’తో స్పష్టమైన జతగా నిలుస్తుంది.
- source_word: κρίνειν / κρίνετε
  choice: తీర్పు తీర్చడానికి / తీర్పు తీర్చవలసింది
  rationale: ఈ సందర్భంలో κρίνω సంఘ క్రమశిక్షణకు సంబంధించిన తీర్పును సూచిస్తుంది. రెండవ క్రియ వ్యాకరణరీత్యా వర్తమాన సూచనార్థక రూపంలో ఉన్నా, ప్రశ్న సందర్భంలో బాధ్యతను సూచించగలదు; అందుకే ఆ బాధ్యతాభావాన్ని నిలిపాం.
- source_word: οὐχὶ
  choice: మీరే కదా?
  rationale: οὐχί సానుకూల సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను ప్రవేశపెడుతుంది. తెలుగులో ‘కదా?’ ఆ ఆశను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς ἔσω
  choice: లోపలివారు
  rationale: ఇది క్రైస్తవ సమాజం లోపలివారిని సూచిస్తుంది; ‘బయటివారు’ అనే పదానికి సమతుల్యమైన విరుద్ధపదంగా మూలంలోని వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: తీర్పు అనే మాట సాధారణ నైతిక నిర్ణయాన్నా, సంఘ క్రమశిక్షణనైనా సూచిస్తుందా?
  choice: సందర్భంలో సంఘం తన లోపలివారిపై నిర్వహించే క్రమశిక్షణాత్మక తీర్పుగా పాఠాన్ని ఉంచాం.
  alternative: అన్ని రకాల నైతిక విచక్షణకు సంబంధించిన విస్తృత ఆజ్ఞ లేదా నిషేధంగా చదవడం.
  rationale: 1 కొరింథీయులు 5:9–13 సందర్భం సంఘంలోని వ్యక్తి విషయంలో క్రమశిక్షణను చర్చిస్తుంది. అయితే అనువాదంలో ‘తీర్పు’ అనే మూలపదపు విస్తృతిని నిలిపి, వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయలేదు.
- issue: ὑμεῖς κρίνετε వర్ణనాత్మకమా లేక బాధ్యతను సూచించేదా?
  choice: ‘తీర్పు తీర్చవలసింది మీరే కదా?’ అని బాధ్యతాభావంతో అనువదించాం.
  alternative: ‘మీరు తీర్పు తీర్చరు కదా?’ లేదా ‘మీరు తీర్పు తీరుస్తారు కదా?’ అనే మరింత వర్ణనాత్మక అనువాదం.
  rationale: రూపం సూచనార్థకమైనదైనా, οὐχίతో కూడిన అలంకారిక ప్రశ్న మరియు సమీప సందర్భం సంఘ బాధ్యతను ముందుకు తెస్తాయి. అయినా ఇది ఆజ్ఞారూపం కాదనే వ్యాకరణ విషయాన్ని గమనికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘బయటివారు/లోపలివారు’ అనే జత మూలంలోని సముదాయ వ్యత్యాసాన్ని నిలుపుతుంది. ‘తీర్పు తీర్చడం’ బైబిలు సందర్భానికి తగినప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే ప్రస్తుత ప్రయోగం.
