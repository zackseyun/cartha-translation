id: 1CO.5.3
reference: 1 Corinthians 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: te
  text: ఎందుకంటే నేను శరీరపరంగా గైర్హాజరుగా ఉన్నప్పటికీ, ఆత్మలో హాజరుగా ఉండి, అక్కడ ఉన్నట్టుగానే, ఈ పని ఈ విధంగా చేసినవాడికి ఇప్పటికే తీర్పు తీర్చాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఆత్మ’ అనేది ఎక్కువగా పౌలు సొంత ఆత్మనే సూచిస్తుంది; దీనిని పరిశుద్ధాత్మకు సూచనగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὼν τῷ σώματι
  choice: శరీరపరంగా అక్కడ లేకపోయినా
  rationale: దేహంతో హాజరుకాకపోవడమే భావమని స్పష్టం చేస్తుంది; మరణం లేదా శరీరం నుండి వేరుపడడం అనే భావాన్ని కలిగించదు.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: ఆత్మలో అక్కడే ఉన్నాను
  rationale: శరీరపరమైన గైర్హాజరుతో ఉన్న సంక్షిప్త వ్యతిరేకతను కాపాడుతుంది; ‘ఆత్మ’ ఎవరిదో మూలంలోని స్వల్ప అస్పష్టతను ప్రధాన వాక్యంలో పరిష్కరించదు.
- source_word: ἤδη κέκρικα
  choice: ఇప్పటికే తీర్పు ఇచ్చేశాను
  rationale: ఇప్పటికే పూర్తయి, ఇంకా అమల్లో ఉన్న నిర్ణయాన్ని గ్రీకు పరిపూర్ణ కాలానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: ὡς παρὼν
  choice: నేను అక్కడ ఉన్నట్టుగానే
  rationale: పౌలు భౌతికంగా అక్కడే ఉన్నట్లు తన తీర్పును ఇస్తున్నాడనే తులనాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸν ... κατεργασάμενον
  choice: చేసినవాడి విషయంలో
  rationale: నామవాచకంగా పనిచేసే కృదంతాన్ని అనుసరిస్తూ, మూలంలో లేని అదనపు గుర్తింపును చేర్చదు.
- source_word: οὕτως τοῦτο
  choice: ఈ పని ఈ విధంగా
  rationale: τοῦτο సూచించే నిర్దిష్ట కార్యాన్నీ, οὕτως సూచించే దాని విధానాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంతో ఉన్న వివరణాత్మక సంబంధాన్ని తెలియజేస్తుంది.
- source_word: μὲν ... δὲ
  choice: లేకపోయినా ... ఉన్నాను
  rationale: గ్రీకు వ్యతిరేక నిర్మాణాన్ని తెలుగు concessive నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఆత్మలో అక్కడే ఉన్నాను’ అనే మాట యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మ’ అనే పదాన్ని అలాగే ఉంచి, పౌలు శరీరపరంగా దూరంగా ఉన్నప్పటికీ సంఘంతో ఆత్మపరంగా ఉన్నాడనే భావాన్ని వ్యక్తం చేయడం
  alternative: ఇది పరిశుద్ధాత్మ సన్నిధిని లేదా మరింత బలమైన మర్మమైన సన్నిధిని సూచిస్తుందని స్పష్టంగా అనువదించడం
  rationale: σώματι–πνεύματι వ్యతిరేకత పౌలు సొంత శరీరం, ఆత్మలను సూచించడం అత్యంత సహజం; అయినా మూలపాఠ్యం వివరించని సన్నిధి స్వరూపాన్ని అనువాదం నిర్దిష్టంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఈ పని ఈ విధంగా’ కొంత మూలానుసారమైన నిర్మాణమైనప్పటికీ, οὕτως మరియు τοῦτο రెండింటి భావాన్ని కాపాడటానికి ఉద్దేశపూర్వకంగా వాడబడింది.
