revisions:
- from: ఎందుకంటే, నేను శరీరపరంగా అక్కడ లేకపోయినా ఆత్మలో అక్కడే ఉన్నాను[a]. నేను అక్కడ ఉన్నట్టుగానే, ఈ పని ఈ విధంగా చేసినవాడి విషయంలో ఇప్పటికే తీర్పు ఇచ్చేశాను[b].
  to: ఎందుకంటే నేను శరీరపరంగా గైర్హాజరుగా ఉన్నప్పటికీ, ఆత్మలో హాజరుగా ఉండి, అక్కడ ఉన్నట్టుగానే, ఈ పని ఈ విధంగా చేసినవాడికి ఇప్పటికే తీర్పు తీర్చాను[a].
  rationale: The revision retains the source’s body/spirit contrast without adding an explicit locative to “in spirit,” makes the judgment directly concern the offender, and uses more natural Telugu judicial wording. The explanatory footnote retains the likely reading without resolving the source phrase categorically. Footnote b is retained as an available lexical alternative, though its anchor is not necessary in the revised sentence because the principal rendering is already clear.
