revisions:
- from: కాబట్టి మనం పండుగను ఆచరిద్దాం[a]—పాత పులిసిన పిండితో కాదు, దుర్బుద్ధి మరియు దుష్టత్వం అనే పులిసిన పిండితోనూ కాదు; నిష్కపటత మరియు సత్యం అనే పులియని రొట్టెలతో[b] ఆచరిద్దాం.
