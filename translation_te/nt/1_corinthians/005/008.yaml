review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the inferential force of ὥστε, the hortatory force of ἑορτάζωμεν, and the Passover/festival imagery. However, the Telugu syntax repeats “ఆచరిద్దాం” in a way that is unnecessarily heavy, and “దుర్బుద్ధి” is narrower than κακία, which here denotes moral badness/malice rather than merely faulty thinking.
  naturalness: Most terminology is clear and modern, but placing the governing verb once at the end produces a more natural Telugu contrast and avoids the awkward repetition of the same exhortation. “పులిసిన పిండి” and “పులియని రొట్టెలు” communicate the intended imagery well.
  terminology: “పండుగను ఆచరిద్దాం,” “పాత పులిసిన పిండి,” “పులియని రొట్టెలు,” “నిష్కపటత,” and “సత్యం” are suitable. “దురుద్దేశం” better conveys the hostile or malicious aspect of κακία while “దుష్టత్వం” retains the broader force of πονηρία.
  issues:
  - severity: medium
    issue: దుర్బుద్ధి is too narrow for κακία.
    rationale: దుర్బుద్ధి normally denotes bad judgment or wrong-mindedness. In this vice pairing κακία more naturally refers to malice or morally harmful intent. “దురుద్దేశం” better retains this force and distinguishes it from πονηρία.
  - severity: low
    issue: The exhortatory verb is repeated awkwardly.
    rationale: The Greek has one hortatory verb governing the whole contrast. Telugu reads more naturally when the contrast precedes one final “పండుగను ఆచరిద్దాం.”
  revised_text: కాబట్టి పాత పులిసిన పిండితో గానీ, దురుద్దేశం మరియు దుష్టత్వం అనే పులిసిన పిండితో గానీ కాదు; నిష్కపటత మరియు సత్యం అనే పులియని రొట్టెలతో మనం పండుగను ఆచరిద్దాం[a].
