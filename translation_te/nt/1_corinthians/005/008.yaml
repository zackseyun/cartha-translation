id: 1CO.5.8
reference: 1 Corinthians 5:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: te
  text: కాబట్టి పాత పులిసిన పిండితో గానీ, దురుద్దేశం మరియు దుష్టత్వం అనే పులిసిన పిండితో గానీ కాదు; నిష్కపటత మరియు సత్యం అనే పులియని రొట్టెలతో మనం పండుగను ఆచరిద్దాం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం వేడుక జరుపుకుందాం,” “మనం పండుగను పాటిద్దాం.” గ్రీకు పదం ముందటి వచనంలోని పస్కా పండుగ చిత్రణను కొనసాగిస్తుంది. గ్రీకులో అక్షరార్థంగా, “నిష్కపటత మరియు సత్యం అనే పులియనివాటితో” అని ఉంది; పస్కా చిత్రణను స్పష్టం చేయడానికి “రొట్టెలు” అని చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ἑορτάζωμεν
  choice: మనం పండుగను ఆచరిద్దాం
  rationale: వర్తమానకాల ప్రోత్సాహక విధిని నిలుపుతూ, ముందటి వచనంలోని పస్కా పండుగ రూపకాన్ని కాపాడుతుంది.
- source_word: ζύμῃ παλαιᾷ
  choice: పాత పులిసిన పిండితో
  rationale: ζύμη సూచించే పులియబెట్టే పదార్థం/పులిసిన పిండి భావాన్ని, పస్కా నేపథ్యాన్ని సాధారణ పాఠకునికి సహజంగా అందిస్తుంది.
- source_word: κακίας
  choice: దుర్బుద్ధి
  rationale: చెడైన మనోవైఖరి, ఇతరులకు కీడు తలపెట్టే స్వభావం అనే భావాన్ని తెలియజేస్తూ πονηρίαతో భేదాన్ని ఉంచుతుంది.
- source_word: πονηρίας
  choice: దుష్టత్వం
  rationale: విస్తృతమైన నైతిక చెడును సూచించి, κακίαకు ఎంచుకున్న పదంతో అర్థభేదాన్ని నిలుపుతుంది.
- source_word: ἀζύμοις
  choice: పులియని రొట్టెలతో
  rationale: మూలంలో నామవాచకంగా వాడిన ‘పులియనివాటితో’ అనే భావానికి పస్కా సందర్భం సూచించే ‘రొట్టెలు’ను స్పష్టత కోసం అందిస్తుంది.
- source_word: εἰλικρινείας
  choice: నిష్కపటత
  rationale: కల్తీలేని యథార్థత, నిజాయితీ గల ఉద్దేశం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀληθείας
  choice: సత్యం
  rationale: గ్రీకు పదానికి నేరుగా, గంభీరంగా, సహజంగా సరిపడే పదం.
theological_decisions:
- issue: పౌలు ఉపయోగించిన పస్కా/పండుగ రూపకం
  choice: ‘పండుగను ఆచరిద్దాం’, ‘పులిసిన పిండి’, ‘పులియని రొట్టెలు’ అని రూపకాన్ని స్పష్టంగా నిలుపడం
  alternative: ‘మనం సంబరపడదాం’ లేదా ‘నిష్కపటతతో, సత్యంతో జీవిద్దాం’ అని రూపకాన్ని సాధారణ నైతిక ప్రబోధంగా మార్చడం
  rationale: ముందటి వచనంలో క్రీస్తును పస్కా బలిగా పేర్కొన్న సందర్భంతో ఈ మాటలు నేరుగా అనుసంధానమై ఉన్నాయి. అందువల్ల పండుగ, పులిసిన పిండి, పులియని పదార్థాల చిత్రణను నిలుపడం మూల వాదనను కాపాడుతుంది.
- issue: ἀζύμοιςలో అంతర్లీన నామవాచకం
  choice: ప్రధాన పాఠ్యంలో ‘రొట్టెలతో’ అని అందించి, అది సరఫరా చేసిన పదమని పాదటిప్పణిలో తెలపడం
  alternative: ‘పులియనివాటితో’ అని అస్పష్టంగానే ఉంచడం
  rationale: గ్రీకులో పదశః ‘పులియనివాటితో’ అని ఉన్నప్పటికీ పస్కా సందర్భంలో పులియని రొట్టెలు ఉద్దేశించబడ్డాయి. తెలుగు పాఠకునికి రూపకం అర్థమయ్యేలా చేస్తూనే పాదటిప్పణి ద్వారా మూల నిర్మాణాన్ని పారదర్శకంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకునికి అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే పస్కా రూపకపు గంభీరతను నిలుపుతుంది. ‘పులిసిన పిండి/పులియని రొట్టెలు’ అనే పదజాలం తెలుగు బైబిలు సందర్భంలో గుర్తించదగినదిగా, నేటి వాడుకలోనూ అర్థమయ్యేలా ఉంది.
