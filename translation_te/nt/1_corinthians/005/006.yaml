id: 1CO.5.6
reference: 1 Corinthians 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: te
  text: మీ గొప్పలు చెప్పుకోవడం మంచిది కాదు. కొంచెం పులిసిన పిండి పిండి ముద్ద అంతటినీ పులియబెడుతుందని మీకు తెలియదా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλὸν
  choice: మంచిది
  rationale: ఇక్కడ కొరింథీయుల గొప్పలు చెప్పుకోవడాన్ని నైతికంగానూ ఆచరణాత్మకంగానూ ప్రతికూలంగా అంచనా వేస్తోంది; ‘మంచిది’ సహజమైన, నేరమైన సమానార్థకం.
- source_word: καύχημα
  choice: గొప్పలు చెప్పుకోవడం
  rationale: ఈ నామవాచకం గొప్పచెప్పే క్రియను లేదా దానికి ఆధారమైన విషయాన్ని సూచించగలదు. సందర్భంలోని గద్దింపు స్వరానికి క్రియానామ రూపం సహజంగా సరిపోతుంది; ఉద్దేశపూర్వకంగా ‘అతిశయించడం’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: οὐκ οἴδατε
  choice: మీకు తెలియదా?
  rationale: పౌలు వాడే అలంకారిక ప్రశ్నా సూత్రాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: μικρὰ ζύμη
  choice: కొంచెం పులిసిన పిండి
  rationale: ζύμη ప్రాచీన పులియబెట్టే పిండిని సూచిస్తుంది. ‘ఈస్ట్’ కంటే ‘పులిసిన పిండి’ ఆ కాలపు రొట్టె తయారీ దృశ్యాన్ని, రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὅλον τὸ φύραμα
  choice: పిండి ముద్ద అంతటినీ
  rationale: φύραμα కలిపిన పిండి ముద్దను సూచిస్తుంది; ὅλον తెలిపే సంపూర్ణతను ‘అంతటినీ’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ζυμοῖ
  choice: పులియబెడుతుంది
  rationale: ζύμηతో ఉన్న పదబంధ సంబంధాన్ని తెలుగులో ‘పులిసిన/పులియబెట్టు’ ద్వారా నిలుపుతూ, మొత్తం పిండి ముద్దపై దాని ప్రభావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పులిసిన పిండి రూపకం
  choice: రూపకాన్ని వివరించి విస్తరించకుండా యథాతథంగా నిలుపడం
  alternative: ‘కొంచెం పాపం సంఘమంతటినీ చెడగొడుతుంది’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: సందర్భం రూపకపు అన్వయాన్ని సూచించినా, ఈ వాక్యం సామెతసదృశమైన బేకింగ్ దృశ్యాన్నే చెబుతుంది. దాని నైతిక సూచనను అనువాదంలోనే నిర్దిష్టంగా నిర్ణయించడం మూలంలోని రూపక విస్తృతిని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన భాష. గ్రీకు వాక్యంలోని గద్దింపు స్వరాన్ని, అలంకారిక ప్రశ్నను, పులిసిన పిండి రూపకాన్ని నిలిపింది. అందించిన ఆంగ్ల పాదటిప్పణి ‘Or the whole lump’ వాస్తవానికి గుర్తు ఉంచిన ‘good’ పదానికి సంబంధించినది కాదు; తెలుగు ప్రధాన పాఠం φύραμα భావాన్ని స్పష్టంగా అందిస్తున్నందున అసంబద్ధమైన పాదటిప్పణిని చేర్చలేదు.
