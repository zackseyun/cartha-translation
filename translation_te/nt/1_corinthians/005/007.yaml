revisions:
- from: పాత పులిపిండిని పూర్తిగా తొలగించండి. అప్పుడు మీరు పులియని వారుగా ఉన్నట్లే కొత్త పిండిముద్దగా ఉంటారు. ఎందుకంటే మన పస్కా[a] అయిన మెస్సీయ బలిగా అర్పించబడ్డాడు.
  to: పాత పులిపిండిని పూర్తిగా తొలగించండి, తద్వారా మీరు కొత్త పిండిముద్దగా ఉండవచ్చు; మీరు పులియనివారే కదా. ఎందుకంటే మన పస్కా[a] అయిన మెస్సీయ బలిగా అర్పించబడ్డాడు.
  rationale: The revision replaces the temporal connector “అప్పుడు” with “తద్వారా” to represent the purpose/result force of ἵνα. It also makes the clause corresponding to καθώς ἐστε ἄζυμοι more idiomatic in modern Telugu without adding a doctrinal interpretation or losing the unleavened metaphor. The compact Greek designation “our Passover” remains in the text, with its possible sacrificial referents retained in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:02:43Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the imperative force of ἐκκαθάρατε, the leaven/dough imagery, the sacrificial passive sense of ἐτύθη, and the deliberately compact expression τὸ πάσχα ἡμῶν. However, “అప్పుడు” (“then”) does not adequately express ἵνα’s purpose/result relation. The final identification is otherwise faithful, and the footnote appropriately preserves the possible referents implicit in “our Passover.”
  naturalness: “మీరు పులియని వారుగా ఉన్నట్లే” is understandable but somewhat stiff in modern Telugu. “మీరు పులియనివారే కదా” is more natural and communicates the grounding force of καθώς in this context. “తద్వారా” clearly expresses the purpose/result intended by ἵνα.
  terminology: “పులిపిండి,” “పిండిముద్ద,” “పస్కా,” and “మెస్సీయ” are suitable and mutually coherent. “బలిగా అర్పించబడ్డాడు” accurately conveys the sacrificial sense of ἐτύθη. The footnote anchor is correctly placed after “పస్కా,” where the lexical ambiguity occurs.
  issues:
  - severity: medium
    issue: ἵνα is rendered as “అప్పుడు.”
    rationale: '“అప్పుడు” indicates temporal sequence (“then”), whereas ἵνα introduces intended purpose or result: “so that/in order that.”'
  - severity: low
    issue: The expression “పులియని వారుగా ఉన్నట్లే” is stylistically awkward.
    rationale: It is a very literal calque and is less idiomatic than a formulation such as “మీరు పులియనివారే కదా,” while retaining the metaphor and the clause’s contextual grounding.
  revised_text: పాత పులిపిండిని పూర్తిగా తొలగించండి, తద్వారా మీరు కొత్త పిండిముద్దగా ఉండవచ్చు; మీరు పులియనివారే కదా. ఎందుకంటే మన పస్కా[a] అయిన మెస్సీయ బలిగా అర్పించబడ్డాడు.
