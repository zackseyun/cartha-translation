id: 1CO.5.7
reference: 1 Corinthians 5:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: te
  text: పాత పులిపిండిని పూర్తిగా తొలగించండి, తద్వారా మీరు కొత్త పిండిముద్దగా ఉండవచ్చు; మీరు పులియనివారే కదా. ఎందుకంటే మన పస్కా[a] అయిన మెస్సీయ బలిగా అర్పించబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘మన పస్కా’ అని ఉంది. సందర్భంలో ఇది ‘మన పస్కా గొర్రెపిల్ల’ లేదా ‘మన పస్కా బలి’ అనే అర్థంలో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: పూర్తిగా తొలగించండి
  rationale: ఈ భూతకాల ఆజ్ఞారూపం పూర్తిగా తీసివేయాలనే అత్యవసరమైన ఆజ్ఞను సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా క్రియ తీవ్రతను ‘పూర్తిగా’ ద్వారా వ్యక్తం చేశాం.
- source_word: παλαιὰν ζύμην
  choice: పాత పులిపిండి
  rationale: ζύμη పిండిని పులియబెట్టే పులిపిండిని సూచిస్తుంది. ‘పులిపిండి’ పస్కా మరియు పులియని రొట్టెల రూపకాన్ని నిలుపుతుంది; ‘పాత’ అనేది παλαιὰν ను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἵνα ἦτε νέον φύραμα
  choice: అప్పుడు ... కొత్త పిండిముద్దగా ఉంటారు
  rationale: ἵνα ఉద్దేశించిన ఫలితాన్ని తెలియజేస్తుంది; φύραμα కలిపిన పిండిముద్దను లేదా పిండిరాశిని సూచిస్తుంది. ‘కొత్త పిండిముద్ద’ రూపకాన్ని స్పష్టంగా, సహజంగా ఉంచుతుంది.
- source_word: καθώς ἐστε ἄζυμοι
  choice: మీరు పులియని వారుగా ఉన్నట్లే
  rationale: καθώς లోని ‘ఉన్నట్లే’ అనే పోలికను నిలిపి, వారు ఎలా ఉండాలో ఇచ్చిన ఆజ్ఞకూ వారు ఇప్పటికే ఏమై ఉన్నారనే గుర్తింపుకూ మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది.
- source_word: τὸ πάσχα ἡμῶν
  choice: మన పస్కా
  rationale: గ్రీకు మూలంలోని సంక్షిప్తమైన, బహుఅర్థక ప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. సందర్భంలో ఇది పస్కా గొర్రెపిల్లను లేదా పస్కా బలిని సూచించవచ్చు; ఆ వివరాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἐτύθη
  choice: బలిగా అర్పించబడ్డాడు
  rationale: θύω బలిగా వధించడాన్ని సూచిస్తుంది. తెలుగు వ్యక్తీకరణ బలి భావాన్నీ గ్రీకు కర్మణి ప్రయోగాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός కేవలం పేరులా కాక, పస్కా విమోచన సందర్భంలో బిరుదుగా పనిచేస్తోంది; అందువల్ల ‘మెస్సీయ’ అని అనువదించాం.
theological_decisions:
- issue: మెస్సీయను ‘మన పస్కా’గా పేర్కొనడం
  choice: మన పస్కా అయిన మెస్సీయ
  alternative: మన పస్కా గొర్రెపిల్ల అయిన మెస్సీయ / మన పస్కా బలి అయిన మెస్సీయ
  rationale: గ్రీకులో అక్షరార్థంగా ‘మన పస్కా’ అని మాత్రమే ఉంది. ‘గొర్రెపిల్ల’ లేదా ‘బలి’ అని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని సంక్షిప్తతనూ భావవిస్తృతినీ కాపాడి, సాధ్యమైన అర్థాలను పాదసూచికలో వివరించాం.
- issue: Χριστός అనే బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: పస్కా సందర్భం అభిషిక్తుడనే బిరుదు భావాన్ని ముందుకు తెస్తుంది. అందువల్ల పేరులా వినిపించే ‘క్రీస్తు’ కంటే ‘మెస్సీయ’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. పులిపిండి–పిండిముద్ద–పులియని వారు అనే ఒకే రూపక శ్రేణిని కొనసాగించాం; నైతిక ఆజ్ఞకూ ఇప్పటికే ఉన్న గుర్తింపుకూ మధ్య పౌలు ఉంచిన ఉద్వేగాన్ని అలాగే నిలిపాం.
