  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: te
  text: అయితే బయటివారికి దేవుడు తీర్పు తీర్చుతాడు.[a] మీ మధ్యనుండి ఆ దుష్టుణ్ణి తొలగించండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకు క్రియ వర్తమాన కాలంలో ఉంది: “తీర్పు తీర్చుతాడు.” సందర్భాన్ని బట్టి కొన్ని అనువాదాలు దీనిని భవిష్యత్ భావంతో అనువదిస్తాయి.'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ మధ్యనుండి ఆ దుర్మార్గుణ్ణి వెళ్లగొట్టండి.” ఈ మాటలు ద్వితీయోపదేశకాండంలో సమాజం మధ్యనుండి చెడును తొలగించాలనే సూత్రప్రాయ పదబంధాన్ని ప్రతిధ్వనిస్తాయి.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: బయటివారికి
  rationale: సభ సమాజానికి వెలుపల ఉన్నవారిని సూచించే substantival ప్రయోగం; ఆధునిక తెలుగులో సహజంగా, సంబంధాత్మక భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలోని లోపలివారిని తీర్పు తీర్చే బాధ్యతకు, బయటివారి విషయానికి మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని చూపుతుంది.
- source_word: κρίνει
  choice: తీర్పు తీర్చుతాడు
  rationale: గ్రీకు వర్తమాన సూచక క్రియను సాధారణంగా ఎల్లప్పుడూ వర్తించే సత్యంగా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; భవిష్యత్ కాలాన్ని అనవసరంగా చేర్చదు.
- source_word: ἐξάρατε
  choice: తొలగించండి
  rationale: నిర్ణయాత్మక ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది; తరువాతి కాలపు సంఘపరమైన సాంకేతిక పదజాలాన్ని చేర్చదు.
- source_word: τὸν πονηρὸν
  choice: ఆ దుష్టుణ్ణి
  rationale: వ్యాసంతో కూడిన ఏకవచన పుంలింగ రూపం తక్షణ సందర్భంలోని నిర్దిష్ట అపరాధిని సూచిస్తుంది; ద్వితీయోపదేశకాండంలోని దుష్టుణ్ణి తొలగించే సూత్రప్రాయ పదబంధ ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: మీ మధ్యనుండి
  rationale: సమాజం లోపలినుండి తొలగించడాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సంఘ క్రమశిక్షణకు సంబంధించిన ఆజ్ఞ స్వభావం
  choice: బయటివారి తీర్పును దేవునికి విడిచిపెట్టి, అపరాధిని తమ సమాజం మధ్యనుండి తొలగించాలని సంఘానికి ఆజ్ఞ ఇవ్వబడింది.
  alternative: దీనిని అధికారిక బహిష్కరణను స్పష్టంగా సూచించకుండా, సమాజం నుండి దుష్టత్వాన్ని సాధారణంగా తొలగించాలనే ఆజ్ఞగా చదవవచ్చు.
  rationale: 1 కొరింథీయులు 5 సందర్భం సంఘంలో ఉన్న నిర్దిష్ట వ్యక్తి విషయాన్ని చర్చిస్తూ, లోపలివారి పట్ల సంఘ బాధ్యతను బయటివారిపై దేవుని తీర్పుతో వ్యత్యాసపరుస్తుంది. అనువాదం సమాజం నుండి తొలగింపును తెలియజేస్తుంది గాని, గ్రీకులో లేని తరువాతి సంస్థాగత పదజాలాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలి. “బయటివారు” అనే పదమే ‘those outside/outsiders’ అనే రెండు ఆంగ్ల ప్రత్యామ్నాయాల భావాన్ని సహజంగా కలిగిస్తున్నందున ప్రత్యేక పాదటిప్పణి అవసరం లేదు. ప్రధాన పాఠంలోని ప్రతి పాదటిప్పణి సూచికకు అనుగుణమైన పాదటిప్పణి ఇవ్వబడింది.
