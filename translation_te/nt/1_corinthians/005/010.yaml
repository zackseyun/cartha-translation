review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Paul’s clarification that the preceding instruction did not refer comprehensively to immoral people in wider society. The three coordinated groups and the consequent necessity of leaving the world are retained. A small revision better reflects the Greek list structure and conditional consequence.
  naturalness: The current Telugu is generally clear and modern. Recasting the list as a single coordinated object avoids the slightly repetitive ‘అలాగే ... కూడా కాదు’ and gives the verse a more natural, direct flow. ‘అలా అయితే’ clearly marks the inferred consequence.
  terminology: ‘లైంగిక దుర్నీతిపరులు,’ ‘అత్యాశపరులు,’ ‘దోచుకునేవారు,’ and ‘విగ్రహారాధకులు’ are understandable and suitably precise. The lexical note appropriately preserves the broader force of ἅρπαξιν. Footnote anchors are placed directly after the relevant terms.
  issues:
  - severity: low
    issue: The draft repeats ‘సహవాసం చేయకూడదని’ for the second and third groups.
    rationale: The Greek presents one negated clarification followed by a coordinated vice-list. A single integrated list is more idiomatic Telugu and more closely displays the source syntax without altering the inherited sense of association from the prior verse.
  - severity: low
    issue: The consequence is expressed as ‘అలా చేయాలంటే ... వస్తుంది.’
    rationale: This is understandable, but ‘అలా అయితే ... వచ్చేది’ more directly conveys the counterfactual/practical-necessity force of ἐπεὶ ... ὠφείλετε.
