id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: te
  text: ఈ లోకంలోని లైంగిక దుర్నీతిపరులతో, లేదా అత్యాశపరులతోను దోచుకునేవారితోను[a], లేదా విగ్రహారాధకులతోను[b] అసలు సహవాసం చేయకూడదని నా ఉద్దేశం కాదు. అలా అయితే మీరు ఈ లోకం నుండి బయటకు వెళ్లవలసి వచ్చేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దోచుకునేవారు” అనే మాటకు “దోపిడీ చేసేవారు,” “బలవంతంగా లాక్కునేవారు” అని కూడా అనువదించవచ్చు. గ్రీకు పదం ఇతరులదాన్ని బలవంతంగా లేదా దోపిడీ ద్వారా స్వాధీనం చేసుకునేవారిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: సంఘానికి వెలుపల ఉన్న దుర్నీతిపరులందరినీ విశ్వాసులు తప్పించుకోవాలని తాను చెప్పలేదని పౌలు స్పష్టం చేస్తున్నాడు; 1 కొరింథీయులు 5:11తో పోల్చండి.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: అసలే ... అని నా ఉద్దేశం కాదు
  rationale: మునుపటి ఆదేశానికి సంపూర్ణ నిషేధార్థం లేదని పౌలు స్పష్టం చేస్తున్న సందర్భోచిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πόρνοις
  choice: లైంగిక దుర్నీతిపరులతో
  rationale: లైంగిక తప్పిదంలో నిమగ్నమైనవారనే నిర్దిష్ట అర్థాన్ని ఆధునిక, స్పష్టమైన తెలుగులో నిలుపుతుంది.
- source_word: τοῦ κόσμου τούτου
  choice: ఈ లోకంలోని
  rationale: సంఘానికి వెలుపల ఉన్న మానవ సమాజాన్ని సూచించే κόσμος యొక్క సందర్భార్థాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: πλεονέκταις
  choice: అత్యాశపరులతో
  rationale: ఎక్కువ సంపాదించాలనే దురాశతో, తరచుగా ఇతరులను దోపిడీ చేసే స్వభావాన్ని సూచించే పదానికి సులభంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: ἅρπαξιν
  choice: దోచుకునేవారితో
  rationale: బలవంతం లేదా దోపిడీ ద్వారా ఇతరులది లాక్కునే విస్తృత భావాన్ని నిలుపుతుంది; అర్థాన్ని ఒక నిర్దిష్ట నేరానికే పరిమితం చేయదు.
- source_word: εἰδωλολάτραις
  choice: విగ్రహారాధకులతో
  rationale: విగ్రహాలను ఆరాధించేవారిని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: ἐπεὶ ... ὠφείλετε
  choice: అలా చేయాలంటే ... వెళ్లిపోవలసి వస్తుంది
  rationale: ఆ ఆదేశాన్ని సంపూర్ణంగా వర్తింపజేస్తే తప్పనిసరిగా కలిగే అసాధ్యమైన పరిణామాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: ఈ లోకం నుంచే వెళ్లిపోవలసి
  rationale: అటువంటి వారందరినీ తప్పించుకోవడం అంటే లోకాన్నే విడిచిపెట్టడం అవుతుందనే ఉద్దేశపూర్వకమైన తీవ్రతను నిలుపుతుంది.
theological_decisions:
- issue: చుట్టుపక్కల సందర్భంలో వేరుగా ఉండాలనే ఆదేశపు పరిధి
  choice: సమాజంలోని లైంగిక దుర్నీతిపరులైన అవిశ్వాసులందరి నుంచి పూర్తిగా వేరుపడాలని తాను చెప్పలేదని పౌలు స్పష్టం చేస్తున్నాడు.
  alternative: లైంగిక దుర్నీతిపరులైన వారందరితో సంపూర్ణ సామాజిక సంబంధవిచ్ఛేదాన్ని పౌలు ఆదేశిస్తున్నాడు.
  rationale: అలా అర్థం చేసుకుంటే విశ్వాసులు లోకం నుంచే వెళ్లిపోవలసి వస్తుందని వచనం స్పష్టంగా చెబుతుంది. అందువల్ల అనవసరమైన సామాజిక ఉపసంహరణను అనువాదం సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలో పూర్వ వచనం నుంచి గ్రహించబడే ‘సహవాసం చేయడం’ అనే భావాన్ని తెలుగులో వాక్యస్పష్టత కోసం వ్యక్తం చేశాం. ‘లోకం నుంచే వెళ్లిపోవడం’ అనే ఉద్దేశపూర్వక తీవ్రతను నిలిపాం.
