id: 1CO.5.4
reference: 1 Corinthians 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: te
  text: మన ప్రభువైన యేసు నామంలో[a], మీరు సమకూడినప్పుడు, నా ఆత్మ మీతో ఉండగా, మన ప్రభువైన యేసు శక్తితో,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు సమకూడి, నా ఆత్మ మీతో ఉండగా.’ గ్రీకులో రెండు సంక్షిప్త genitive absolute నిర్మాణాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: నామంలో
  rationale: గ్రీకు నుడికారాన్ని నిలుపుతూ, యేసు అధికారానికి లోబడి కార్యం చేయడం అనే భావాన్ని సహజంగా మోస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: నూతన నిబంధనలోని బిరుదు భావాన్నీ క్రీస్తును గురించిన ప్రాముఖ్యతనూ నిలుపుతుంది.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: συναχθέντων ὑμῶν
  choice: మీరు సమకూడినప్పుడు
  rationale: భూతకాల నిష్క్రియార్థక కృదంతంతో ఉన్న genitive absolute నిర్మాణాన్ని సహజమైన కాలవాచక ఉపవాక్యంగా అందిస్తుంది.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: నా ఆత్మ కూడా మీతో ఉండగా
  rationale: గ్రీకులో సంక్షిప్తంగా సూచితమైన సహవాస భావాన్ని తెలుగులో స్పష్టంగా చేస్తుంది; పౌలు శారీరకంగా కాక ఆత్మలో పాల్గొనడాన్ని అతిగా వివరించదు.
- source_word: σὺν
  choice: తో
  rationale: తోడ్పాటు లేదా సహచర్యం అనే సాధారణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δυνάμει
  choice: శక్తితో
  rationale: కేవలం అధికార పదవిని కాక, ఈ చర్యలో పనిచేసే ప్రభావవంతమైన శక్తి అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: మన ప్రభువైన యేసు
  rationale: సంబంధార్థాన్ని ‘శక్తితో’ అనే రూపంలో సహజంగా అనుసంధానిస్తూ, ఆ శక్తి యొక్క మూలం లేదా స్వామ్యంపై గ్రీకులో ఉన్న విస్తృతతను కాపాడుతుంది.
theological_decisions:
- issue: సమావేశంలో పౌలు ఉనికి స్వభావం
  choice: ‘నా ఆత్మ కూడా మీతో ఉండగా’ అని, పౌలు శారీరకంగా కాక నిజమైన ఆత్మసంబంధమైన అర్థంలో వారితో ఉన్నట్లు అనువదించబడింది.
  alternative: ఇది కేవలం పౌలు మనోభావం లేదా ఉద్దేశాన్ని సూచిస్తుందని, లేదా మరింత బలమైన మార్మిక ఉనికిని సూచిస్తుందని అర్థం చేసుకోవచ్చు.
  rationale: వాక్యం పౌలు శరీరరహిత భాగస్వామ్యాన్ని చెబుతుంది గాని అది ఎలా జరుగుతుందో నిర్వచించదు; అనువాదం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది తదుపరి వచనంలో పూర్తయ్యే వాక్యభాగం కాబట్టి చివర అల్పవిరామం ఉంచబడింది; మూలంలోని పునరుక్తి మరియు వాక్యనిర్మాణ ఉద్రిక్తత సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
