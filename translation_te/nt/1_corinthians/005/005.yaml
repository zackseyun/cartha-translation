revisions:
- from: అలాంటి వ్యక్తిని మాంస వినాశనం కోసం సాతానుకు అప్పగించాలి[a]; తద్వారా ప్రభువు దినాన[b] ఆత్మ రక్షించబడేలా చేయాలి.
  to: అలాంటి వ్యక్తిని శరీర నాశనానికి సాతానుకు అప్పగించాలి[a], తద్వారా ప్రభువు దినాన[b] ఆత్మ రక్షించబడేలా.
  rationale: The revision replaces an unnatural expression for ‘destruction of the flesh’ with idiomatic Telugu while retaining the source phrase’s debated scope through footnote a. It also removes ‘చేయాలి’ after the purpose clause, which had added an unwarranted command and causal agency. The Greek ambiguity of ‘the spirit’ is retained without adding ‘his,’ and the SBLGNT’s shorter ‘day of the Lord’ reading remains unchanged.
