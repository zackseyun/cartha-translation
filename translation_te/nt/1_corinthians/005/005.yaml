id: 1CO.5.5
reference: 1 Corinthians 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: te
  text: అలాంటి వ్యక్తిని శరీర నాశనానికి సాతానుకు అప్పగించాలి[a], తద్వారా ప్రభువు దినాన[b] ఆత్మ రక్షించబడేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శరీరం పాడైపోవడానికి.’ ఈ పదబంధం తీవ్రమైన శారీరక తీర్పును సూచించవచ్చు; లేదా రూపకంగా ఆ వ్యక్తిలోని శరీరసంబంధమైన పాపప్రవృత్తి నాశనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘ప్రభువు’కు బదులుగా ‘మన ప్రభువైన యేసు’ లేదా ‘ప్రభువైన యేసు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: అప్పగించాలి
  rationale: ఈ క్రియ సంఘం చేయవలసిన చర్యను సూచిస్తుంది. ‘అప్పగించాలి’ అనేది సహజమైన ఆధునిక తెలుగు; ఒకరి అధికార పరిధికి మరొకరిని అప్పగించే భావాన్ని నిలుపుతుంది.
- source_word: τὸν τοιοῦτον
  choice: అలాంటి వ్యక్తిని
  rationale: నిర్దిష్ట అపరాధిని సూచిస్తూనే గ్రీకులోని వర్గీకరణ ధోరణిని నిలుపుతుంది; ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: Σατανᾷ
  choice: సాతానుకు
  rationale: పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణ ప్రకారం ఇచ్చాం.
- source_word: εἰς ὄλεθρον
  choice: వినాశనం కోసం
  rationale: ὄλεθρος‌లోని తీవ్రమైన నాశనం లేదా పతనం అనే భావాన్ని నిలుపుతుంది; దాని స్వరూపాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: τῆς σαρκός
  choice: మాంస
  rationale: σάρξ‌కు ‘మాంసం’ అనే మూలార్థాన్ని నిలిపి, ఇది శారీరక తీర్పునా లేక పాపప్రవృత్తి నిర్మూలననా అనే సందిగ్ధతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా ఉంచుతుంది.
- source_word: ἵνα
  choice: తద్వారా … రక్షించబడేలా
  rationale: ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని తెలియజేసే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: గ్రీకులో స్పష్టమైన స్వామ్యసూచక సర్వనామం లేనందున ‘అతని ఆత్మ’ అని చేర్చలేదు.
- source_word: σωθῇ
  choice: రక్షించబడేలా
  rationale: కర్మణి ప్రయోగాన్నీ, ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని సూచించే విధానాన్నీ నిలుపుతుంది.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: దినాన
  rationale: అంత్యకాల సందర్భంలో కాలసూచనను సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: ఇచ్చిన SBLGNT పాఠంలో ఉన్న κυρίουను మాత్రమే అనువదించి, ‘యేసు’ లేదా ‘మన’ అనే పదాలను చేర్చలేదు.
theological_decisions:
- issue: ‘మాంస వినాశనం’ అనే మాట అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘మాంస వినాశనం’ అనే సందిగ్ధమైన రూపాన్ని నిలిపాం.
  alternative: తీవ్రమైన శారీరక శిక్ష లేదా మరణం; లేక ఆ వ్యక్తిలోని పాపసంబంధమైన మాంసప్రవృత్తి నిర్మూలన.
  rationale: గ్రీకు పదబంధం ఈ రెండింటిలో ఒక్క అర్థాన్నే తప్పనిసరిగా నిర్ణయించదు. అందువల్ల వ్యాఖ్యానంతో ఉద్రిక్తతను తొలగించకుండా మూలంలోని సందిగ్ధతను ఉంచాం.
- issue: ‘ఆత్మ’ ఎవరిది?
  choice: స్వామ్యసూచక పదం చేర్చకుండా ‘ఆత్మ’ అని అనువదించాం.
  alternative: ‘అతని ఆత్మ’ అని స్పష్టం చేయడం.
  rationale: సందర్భం అపరాధి రక్షణను సూచించినప్పటికీ, గ్రీకులో ‘అతని’ అనే పదం లేదు.
- issue: ‘ప్రభువు దినం’ అనే అంత్యకాల పదబంధం
  choice: SBLGNT పాఠాన్ని అనుసరించి ‘ప్రభువు దినాన’ అని ఇచ్చాం.
  alternative: ‘మన ప్రభువైన యేసు దినాన’ లేదా ‘ప్రభువైన యేసు దినాన’.
  rationale: కొన్ని ప్రతుల్లో విస్తృత పాఠం ఉన్నా, అందించిన మూలపాఠంలో ‘ప్రభువు’ మాత్రమే ఉంది; అందువల్ల సమన్వయపరచే విస్తరణ చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘మాంసం’ మరియు ‘ఆత్మ’ అనే పదాలను వ్యాఖ్యానాత్మకంగా విస్తరించకుండా ఉంచాం; వాక్యంలోని ఆదేశభావాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘అప్పగించాలి’ ఉపయోగించాం.
