id: 1CO.5.9
reference: 1 Corinthians 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔγραψα ὑμῖν ἐν τῇ ἐπιστολῇ μὴ συναναμίγνυσθαι πόρνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/009.yaml
  text: I wrote to you in the letter not to associate with sexually immoral people[c][b][a],
translation:
  language: te
  text: లైంగిక దుర్నీతికి పాల్పడేవారితో[c] సహవాసం చేయవద్దని[b] ఆ పత్రికలో[a] మీకు రాశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా పత్రికలో.” గ్రీకు పదబంధం పౌలు ఇంతకుముందు పంపిన పత్రికను గానీ, ఈ పత్రికలోని ముందటి భాగాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “వారితో కలిసిమెలిసి ఉండవద్దని,” “వారితో సంబంధం పెట్టుకోవద్దని.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “లైంగికంగా దుర్నీతిపరులైనవారితో.” గ్రీకు పదం లైంగిక దుర్నీతితో గుర్తింపబడే వ్యక్తులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψα
  choice: రాశాను
  rationale: గ్రీకు ఏఓరిస్ట్ సూచక క్రియను సహజమైన తెలుగు భూతకాలంగా అనువదిస్తుంది; క్రియ స్వయంగా ముందటి పత్రికనో ప్రస్తుత పత్రికనో నిర్ణయించదు.
- source_word: ὑμῖν
  choice: మీకు
  rationale: రాయబడినవారిని సూచించే దత్తివాచక సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: ఆ పత్రికలో
  rationale: నిర్దిష్టమైన, కొరింథీయులకు తెలిసిన పత్రికను సూచిస్తుంది; అది మునుపటి పత్రికా లేక ప్రస్తుత పత్రికలోని ముందటి భాగమా అనే సందిగ్ధతను అలాగే ఉంచుతుంది.
- source_word: μὴ συναναμίγνυσθαι
  choice: సహవాసం చేయవద్దని
  rationale: సామాజికంగా కలిసిమెలిసి ఉండడం లేదా సన్నిహిత సంబంధం కొనసాగించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πόρνοις
  choice: లైంగిక దుర్నీతికి పాల్పడేవారితో
  rationale: లైంగిక అనైతిక ప్రవర్తనతో గుర్తింపబడే వ్యక్తులను సూచించే బహువచన వ్యక్తివాచక భావాన్ని స్పష్టంగా అందిస్తుంది; అతి సంకుచితమైన లేదా ప్రాచీన పదజాలాన్ని నివారిస్తుంది.
theological_decisions:
- issue: “ఆ పత్రిక” దేనిని సూచిస్తుంది?
  choice: కొరింథీయులకు తెలిసిన ఒక నిర్దిష్ట పత్రిక అని మాత్రమే అనువాదంలో సూచించి, దాని గుర్తింపును నిర్ణయించకుండా ఉంచడం.
  alternative: అది ఇప్పుడు లభించని మునుపటి పత్రిక అని, లేదా 1 కొరింథీయుల పత్రికలోని ముందటి భాగమని స్పష్టీకరించడం.
  rationale: ἐν τῇ ἐπιστολῇ నిర్దిష్టతను చూపుతుంది గాని చారిత్రకంగా ఏ పత్రికో స్వయంగా తేల్చదు; అందుచేత మూలంలోని నిజమైన సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. “వ్యభిచారులు” వంటి సందర్భానుసారం సంకుచితంగా అర్థమయ్యే పదానికి బదులు విస్తృతమైన లైంగిక అనైతికతను తెలిపే పదబంధం వాడాం; మూలంలోని పత్రిక-సూచన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
