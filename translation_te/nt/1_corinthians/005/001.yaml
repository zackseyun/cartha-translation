id: 1CO.5.1
reference: 1 Corinthians 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: te
  text: 'మీలో లైంగిక అనైతికత ఉందని నిజంగానే వినబడుతోంది. అది అన్యజనులలో కూడా లేనంతటి లైంగిక అనైతికత[a]: ఒకడు తన తండ్రి భార్యతో సంబంధం కలిగి ఉన్నాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అన్య దేశాల ప్రజలలో కూడా లేనటువంటి.” ఇక్కడ “అన్యజనులు” అంటే యూదేతర ప్రజలు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తన తండ్రి భార్యను కలిగి ఉన్నాడు.” అంటే, తన తండ్రి భార్యతో లైంగిక లేదా దాంపత్య సంబంధంలో ఉన్నాడు. ఆమె అతని సవతి తల్లి అయి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: నిజంగానే
  rationale: ఇక్కడ ఈ పదం పరిమాణాన్ని కాక, పౌలు వ్యక్తం చేస్తున్న ఆశ్చర్యాన్ని మరియు నొక్కిచెప్పడాన్ని సూచిస్తుంది.
- source_word: ἀκούεται
  choice: వినబడుతోంది
  rationale: సంఘంలో జరిగిన విషయం నివేదించబడుతోందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, గ్రీకు నిష్క్రియ రూపానికి దగ్గరగా ఉంటుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: కొరింథు విశ్వాసుల సమాజం మధ్య ఈ పరిస్థితి ఉందనే సామూహిక భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: πορνεία
  choice: లైంగిక అనైతికత
  rationale: అక్రమమైన లైంగిక ప్రవర్తనను విస్తృతంగా సూచించే పదం; ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: τοιαύτη πορνεία
  choice: అది ... లేనంతటి లైంగిక అనైతికత
  rationale: అపరాధం ఎంత దిగ్భ్రాంతికరమైనదో తెలిపే గ్రీకు గుణాత్మక ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: అన్యజనులలో కూడా లేనంతటి
  rationale: ἔθνη అనే పదంలోని యూదేతర ప్రజల భావాన్ని అనవసరమైన నిందార్థం లేకుండా తెలియజేస్తుంది; గ్రీకులో విడిచిపెట్టబడిన క్రియను తెలుగులో సహజంగా పూరిస్తుంది.
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: తన తండ్రి భార్యను
  rationale: ప్రత్యేకంగా 'సవతి తల్లి' అని వ్యాఖ్యానించకుండా మూలంలోని బంధ సూచనను అలాగే కాపాడుతుంది.
- source_word: ἔχειν
  choice: ఉంచుకున్నాడు
  rationale: ఇక్కడ ἔχω సూచించే కొనసాగుతున్న దాంపత్య లేదా లైంగిక సంబంధాన్ని తెలుగులో తెలియజేస్తుంది; కేవలం స్వాధీన భావంగా అపార్థం కాకుండా చేస్తుంది.
theological_decisions:
- issue: ἔθνεσιν అనే పదాన్ని ఎలా అనువదించాలి
  choice: అన్యజనులు
  alternative: దేశాలు; విగ్రహారాధకులు
  rationale: ఇది పౌలు వాడే యూదులు–యూదేతరులు అనే భేదాన్ని నిలుపుతుంది; 'విగ్రహారాధకులు' అనడం మూలంలో లేని మతపరమైన తీర్పును చేర్చుతుంది.
- issue: ఆ స్త్రీని 'సవతి తల్లి' అని పేర్కొనాలా
  choice: తన తండ్రి భార్య
  alternative: తన సవతి తల్లి
  rationale: గ్రీకు ప్రత్యేక బంధుత్వ పదాన్ని వాడదు. 'తండ్రి భార్య' అనడం సాధ్యమైన అర్థాన్ని తెరిచి ఉంచి, మూలానికి దగ్గరగా ఉంటుంది.
- issue: ἔχεινలోని సంబంధ భావాన్ని ఎంత స్పష్టంగా చేయాలి
  choice: ఉంచుకున్నాడు
  alternative: ఆమెతో లైంగిక సంబంధం కలిగి ఉన్నాడు; ఆమెతో కాపురం చేస్తున్నాడు
  rationale: మూలంలోని సంక్షిప్తమైన, కొంత సౌమ్యోక్తిగల వ్యక్తీకరణను నిలుపుతూ, సంబంధం కొనసాగుతోందనే భావాన్ని అందిస్తుంది; సంబంధ స్వరూపాన్ని మూలం కంటే అధికంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను కాపాడే శైలి. పౌలు వ్యక్తం చేసిన దిగ్భ్రాంతిని మొదటి వాక్యంలో నిలిపి, మూలంలోని బంధ సూచనను వ్యాఖ్యానాత్మకంగా సంకుచితం చేయలేదు.
