id: 1CO.5.2
reference: 1 Corinthians 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: te
  text: అయినా మీరు గర్వంతో ఉబ్బిపోయి ఉన్నారు! దానికి బదులుగా మీరు దుఃఖించి ఉండవలసింది కాదా, తద్వారా ఈ పని చేసినవాడు మీ మధ్య నుండి తొలగించబడునట్లు? [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ మధ్య నుండి తీసివేయబడునట్లు.’ సందర్భంలో ఇది సంఘ క్రమశిక్షణ ద్వారా అతణ్ణి సంఘం నుండి తొలగించడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: ఉప్పొంగిపోయి ఉన్నారు
  rationale: గర్వంతో ఉబ్బిపోవడం అనే గ్రీకు రూపకాన్ని నిలుపుతూ, పరిపూర్ణ కాలం సూచించే స్థిరమైన స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὐχὶ μᾶλλον
  choice: దానికి బదులు ... ఉండవలసింది కాదా?
  rationale: వారి ప్రస్తుత వైఖరికి విరుద్ధంగా వారు చూపవలసిన స్పందనను గద్దింపుతో కూడిన అలంకారప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: ἐπενθήσατε
  choice: దుఃఖించి ఉండవలసింది
  rationale: సాధారణ బాధకంటే బలమైన శోకాన్ని సూచిస్తుంది; సంఘం సమష్టిగా దుఃఖించవలసిన భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: ἵνα ἀρθῇ
  choice: అలా చేస్తే ... తొలగించబడేవాడు
  rationale: ἵνα నిర్మాణంలోని ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని సహజ తెలుగులో తెలియజేస్తూ, గ్రీకులోని కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: ἐκ μέσου ὑμῶν
  choice: మీ మధ్య నుండి
  rationale: సమాజం మధ్యనుండి వేరుచేయబడే భావాన్ని స్పష్టంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: ఈ పని చేసినవాడు
  rationale: కర్తను గుర్తిస్తూ, ἔργον యొక్క గంభీరతను సహజ తెలుగులో నిలుపుతుంది; సందర్భం పురుషుణ్ని సూచిస్తున్నందున ‘చేసినవాడు’ సముచితం.
theological_decisions:
- issue: తప్పు చేసిన వ్యక్తిపై కోరబడిన చర్య స్వరూపం
  choice: మీ మధ్య నుండి తొలగించబడేవాడు
  alternative: దేవునిచేత తీసివేయబడేవాడు / సంఘం నుండి బహిష్కరించబడేవాడు
  rationale: ἀρθῇ అనే కర్మణి రూపం చర్య చేసే కర్తను పేర్కొనదు. సమీప సందర్భం సంఘ క్రమశిక్షణను సూచించినా, అనువాదం ‘బహిష్కరణ’ అని మరీ నిర్దిష్టం చేయకుండా మూలంలోని విస్తృతతను, దైవకర్మణి అయ్యే అవకాశాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గద్దింపు, అలంకారప్రశ్న, బలమైన శోకం అనే భావాలను గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు అర్థమయ్యేలా వ్యక్తం చేసింది. ‘ఉప్పొంగిపోయి’ అనే రూపకం పౌలు ఈ పత్రికలో పదేపదే ఉపయోగించే గర్వంతో ఉబ్బిపోవడం అనే చిత్రాన్ని నిలుపుతుంది.
