revisions:
- from: అయినా మీరు ఉప్పొంగిపోయి ఉన్నారు! దానికి బదులు మీరు దుఃఖించి ఉండవలసింది కాదా? అలా చేస్తే, ఈ పని చేసినవాడు మీ మధ్య నుండి తొలగించబడేవాడు.[a]
  to: అయినా మీరు గర్వంతో ఉబ్బిపోయి ఉన్నారు! దానికి బదులుగా మీరు దుఃఖించి ఉండవలసింది కాదా, తద్వారా ఈ పని చేసినవాడు మీ మధ్య నుండి తొలగించబడునట్లు? [a]
  rationale: The revision preserves the rhetorical rebuke and the perfect-state imagery of being inflated with pride. It replaces the conditional/counterfactual wording with a Telugu purpose-result construction corresponding to ἵνα with the aorist passive subjunctive, while leaving the agent and precise manner of removal unspecified. The footnote is conformed to the same purpose/result syntax.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:02:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the rebuke, the state of pride, the call for mourning, and removal from the community. However, “అలా చేస్తే” (‘if they did so’) recasts ἵνα as a conditional result, and “తొలగించబడేవాడు” gives an unnecessarily counterfactual conditional sense. The Greek expresses the intended/resulting purpose of the mourning: ‘so that/in order that he might be removed.’'
  naturalness: The Telugu is generally modern and clear. “గర్వంతో ఉబ్బిపోయి ఉన్నారు” is more explicit and idiomatic than “ఉప్పొంగిపోయి ఉన్నారు,” which can suggest excitement or swelling without clearly conveying pride. “తద్వారా … తొలగించబడునట్లు” naturally expresses the Greek purpose clause without imposing a conditional construction.
  terminology: “దుఃఖించి ఉండవలసింది” suitably conveys the strong mourning language. “ఈ పని చేసినవాడు” preserves the Greek’s restrained identification of the offender. “తొలగించబడునట్లు” retains the passive and does not over-specify formal excommunication or divine action. The footnote should likewise retain purpose/result wording rather than conditional wording.
  issues:
  - severity: medium
    issue: The purpose clause is translated conditionally.
    rationale: “అలా చేస్తే … తొలగించబడేవాడు” means ‘if you did that, he would be removed.’ Greek ἵνα ἀρθῇ expresses purpose/intended result, not an explicit conditional construction.
  - severity: low
    issue: The rendering of πεφυσιωμένοι does not clearly communicate pride.
    rationale: “ఉప్పొంగిపోయి ఉన్నారు” can be understood broadly as being emotionally elated. Adding “గర్వంతో” preserves Paul’s inflation metaphor while making its negative sense clear.
  revised_text: అయినా మీరు గర్వంతో ఉబ్బిపోయి ఉన్నారు! దానికి బదులుగా మీరు దుఃఖించి ఉండవలసింది కాదా, తద్వారా ఈ పని చేసినవాడు మీ మధ్య నుండి తొలగించబడునట్లు? [a]
