id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: te
  text: 'ఒక వ్యక్తి[b] మమ్మల్ని ఈ విధంగా పరిగణించాలి: మెస్సీయ యొక్క సేవకులుగానూ, దేవుని మర్మాల నిర్వాహకులుగానూ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: మూలంలోని “మనిషి” అనే పదం ఇక్కడ సాధారణ అర్థంలో ఉంది; అది ఏ వ్యక్తినైనా సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως
  choice: ఈ విధంగా
  rationale: పౌలును, అతని సహపరిచారకులను ఏ దృష్టితో చూడాలో తెలిపే విధానార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡμᾶς
  choice: మమ్మల్ని
  rationale: λογιζέσθω అనే క్రియకు ప్రత్యక్ష కర్మ; సందర్భంలో పౌలు మరియు అతనితో సేవచేసేవారిని సూచిస్తుంది.
- source_word: λογιζέσθω
  choice: పరిగణించాలి
  rationale: వర్తమాన మధ్యమ ఆజ్ఞార్థక రూపంలోని నియమాత్మక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἄνθρωπος
  choice: ప్రతి వ్యక్తీ
  rationale: గ్రీకు ఏకవచనం ఇక్కడ సాధారణ మానవ సూచనగా ఉంది. తెలుగు వాక్యంలో ‘ప్రతి వ్యక్తీ’ ఆ సాధారణ వ్యాప్తిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὡς
  choice: -గా
  rationale: వారిని ఏ హోదాలో పరిగణించాలో సూచించే భావాన్ని తెలుగు విభక్తి ప్రత్యయం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπηρέτας
  choice: సేవకులు
  rationale: క్రీస్తుకు లోబడి సేవచేసే స్థితిని తెలియజేస్తుంది; δοῦλος పదంలోని బానిసత్వ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ అభిషిక్తుడైన రాజు అనే బిరుదు భావంతో ఉంది; ‘మెస్సీయ’ ఆ బిరుదు స్వభావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οἰκονόμους
  choice: నిర్వాహకులు
  rationale: తమకు అప్పగించబడిన విషయాలను బాధ్యతతో నిర్వహించే గృహనిర్వాహకులు లేదా పరిపాలకులు అనే రూపకాన్ని ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: μυστηρίων
  choice: మర్మాలు
  rationale: దేవుడు తెలియజేసేంతవరకు మరుగై ఉన్న దైవిక సత్యాల కోసం పౌలు వాడే పదాన్ని వివరణతో సంకుచితం చేయకుండా నిలుపుతుంది.
- source_word: θεοῦ
  choice: దేవుని
  rationale: ఈ మర్మాలు దేవునికి చెందినవి, ఆయననుండి వచ్చినవి అనే సహజమైన షష్ఠీ సంబంధాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Χριστοῦ పదాన్ని బిరుదుగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός సేవకులు ఎవరికి చెందినవారో తెలిపే బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ అభిషిక్తుడు అనే బిరుదు భావాన్ని ముందుకు తెస్తుంది; సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ἄνθρωπος యొక్క సాధారణ ఏకవచన భావం
  choice: ప్రతి వ్యక్తీ
  alternative: ఒక మనిషి
  rationale: సందర్భంలో ఇది పురుషుడిని మాత్రమే కాక ఎవరినైనా సూచిస్తుంది. ‘ప్రతి వ్యక్తీ’ మూలంలోని సాధారణ వ్యాప్తిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఆ సంగతి పాదసూచికలో స్పష్టం చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘సేవకులు,’ ‘నిర్వాహకులు,’ ‘మర్మాలు’ అనే పదాలు మూలంలోని సేవ, అప్పగింత, దైవిక రహస్యం అనే భావాలను అతివివరణ లేకుండా నిలుపుతున్నాయి.
