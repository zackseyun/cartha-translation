- from: 'ప్రతి వ్యక్తీ[b] మమ్మల్ని ఈ విధంగా పరిగణించాలి: మెస్సీయ[a] సేవకులుగానూ, దేవుని మర్మాల నిర్వాహకులుగానూ.'
  to: 'ఒక వ్యక్తి[b] మమ్మల్ని ఈ విధంగా పరిగణించాలి: మెస్సీయ యొక్క సేవకులుగానూ, దేవుని మర్మాల నిర్వాహకులుగానూ.'
