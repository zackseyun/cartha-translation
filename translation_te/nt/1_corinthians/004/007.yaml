id: 1CO.4.7
reference: 1 Corinthians 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: te
  text: ఎందుకంటే, నిన్ను భిన్నంగా చేసేది ఎవరు?[a] నీవు పొందనిది నీకు ఏమి ఉంది? నీవు దానిని పొందిందే అయితే, పొందనట్టుగా ఎందుకు గొప్పలు చెప్పుకుంటున్నావు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిన్ను వేరుగా చేసేది ఎవరు?” గ్రీకు క్రియకు ‘వేరుచేయడం,’ ‘భిన్నంగా చేయడం,’ లేదా ‘ప్రత్యేకంగా చేయడం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: ఎందుకంటే, నిన్ను ప్రత్యేకంగా నిలబెట్టేది ఎవరు?
  rationale: γάρ ముందున్న గద్దింపుకు కారణాన్ని కలుపుతుంది. διακρίνει సకర్మకంగా ‘భిన్నంగా చేయడం,’ ‘ప్రత్యేకంగా గుర్తించడం,’ లేదా ‘వేరుగా నిలబెట్టడం’ అనే భావాలు ఇవ్వగలదు. ‘ప్రత్యేకంగా నిలబెట్టేది’ అనేది కొరింథీయుల ఆధిక్యభావాన్ని ప్రశ్నించే వాక్చాతుర్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τί δὲ ἔχεις ὃ οὐκ ἔλαβες
  choice: నీవు పొందనిది నీ దగ్గర ఏముంది?
  rationale: δὲ ఇక్కడ స్వల్ప అనుసంధానక పదం; తెలుగులో ప్రశ్నల వరుసే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది. అఒరిస్ట్ ἔλαβες‌ను ‘పొందనిది’గా అనువదించడం, ఉన్నదంతా స్వయంగా కలిగించుకున్నది కాక పొందినదే అనే ప్రశ్నను స్పష్టంగా ఉంచుతుంది.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: ఒకవేళ నీవు దాన్ని పొందివుంటే
  rationale: εἰ అనే షరతును నిలుపుతూ, καὶ ఇచ్చే బలాన్ని సహజ తెలుగు షరతు నిర్మాణంలో వ్యక్తం చేస్తుంది. ‘దాన్ని’ అనేది ముందున్న ‘ఏమి’ని సూచించేందుకు సందర్భం నుంచి చేర్చబడింది.
- source_word: τί καυχᾶσαι
  choice: ఎందుకు గొప్పలు చెప్పుకుంటున్నావు?
  rationale: καυχάομαι ఇక్కడ తన ఆధిక్యాన్ని ప్రకటించుకుంటూ గర్వపడటాన్ని సూచిస్తుంది. ‘గొప్పలు చెప్పుకోవడం’ సాధారణ ఆధునిక తెలుగులో ఆ గద్దింపు భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ὡς μὴ λαβών
  choice: పొందనట్టుగా
  rationale: ఈ కృదంత పదబంధం వాస్తవానికి విరుద్ధమైన ప్రవర్తనా తీరును చూపుతుంది—పొందినవాడు పొందనివాడిలా గొప్పలు చెప్పుకోవడం. సంక్షిప్తమైన ‘పొందనట్టుగా’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: మానవ ఆధిక్యం మరియు పొందిన వాటి గురించి పౌలు చేస్తున్న గద్దింపు పరిధి
  choice: ప్రత్యేకత, కలిగినది, లేదా ఆధిక్యానికి ఆధారం ఏదైనా స్వయంగా ఉద్భవించినది కాక పొందినదే అని వచనం సూచించేలా, దాని పరిధిని నిర్దిష్టంగా కుదించకుండా అనువదించబడింది.
  alternative: ఈ మాటలను కేవలం ఆత్మీయ వరాలకు లేదా పరిచర్య బాధ్యతలకు మాత్రమే పరిమితం చేయడం; లేక ప్రతి సామర్థ్యం, హోదా, ఆశీర్వాదాన్ని స్పష్టంగా చేర్చి విస్తరించడం.
  rationale: తక్షణ సందర్భం అపొస్తలుల పరిచర్య, పక్షపాతం, అతిశయంతో సంబంధమున్నప్పటికీ, గ్రీకు వాక్యం సాధారణ పదాలతో ఉంది. అందువల్ల మూలపాఠంలోని విస్తృతతను అలాగే ఉంచి, ఒక నిర్దిష్ట సిద్ధాంత పరిధిని అనువాదంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. వరుసగా వచ్చే మూడు అలంకారిక ప్రశ్నల గద్దింపు ధోరణి నిలుపబడింది; ‘నీవు’ అనే ఏకవచన సంబోధన గ్రీకు σε/ἔχεις/ἔλαβες/καυχᾶσαι రూపాలకు అనుగుణంగా ఉంది.
