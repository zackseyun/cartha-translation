translation:
  language: te
  text: మా సొంత చేతులతో పనిచేస్తూ శ్రమిస్తున్నాం. మమ్మల్ని దూషించినప్పుడు దీవిస్తున్నాం; మమ్మల్ని హింసించినప్పుడు సహిస్తున్నాం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοπιῶμεν
  choice: శ్రమిస్తున్నాం
  rationale: ఈ పదం సాధారణంగా పనిచేయడం మాత్రమే కాకుండా, అలసట కలిగించే కఠిన శ్రమను సూచిస్తుంది.
- source_word: ἐργαζόμενοι
  choice: పనిచేస్తూ
  rationale: పౌలు చెప్పిన శ్రమ ఏ విధంగా జరుగుతోందో వివరించే వర్తమాన కృదంతం; చేతిపనిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ταῖς ἰδίαις χερσίν
  choice: మా సొంత చేతులతో
  rationale: ἰδίαις ఇచ్చే స్వయంకృషి అనే నొక్కిచెప్పడాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉంది.
- source_word: λοιδορούμενοι
  choice: మమ్మల్ని దూషించినప్పుడు
  rationale: అవమానకరంగా నిందించడం లేదా తిట్టడం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది; గ్రీకు నిష్క్రియ కృదంతంలోని సందర్భార్థాన్ని సహజమైన కాలవాచక నిర్మాణంతో అందిస్తుంది.
- source_word: εὐλογοῦμεν
  choice: దీవిస్తున్నాం
  rationale: దూషణకు ప్రతిగా మేలు కోరుతూ పలకడం అనే బైబిలు భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: διωκόμενοι
  choice: హింసించినప్పుడు
  rationale: ఈ సందర్భంలో శత్రుత్వంతో వెంటాడి బాధించడం అనే పౌలు వాడుకలోని భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀνεχόμεθα
  choice: సహిస్తున్నాం
  rationale: హింసను ప్రతీకారం తీర్చుకోకుండా భరించడం అనే భావాన్ని, గ్రీకులో లేని ప్రత్యేక కర్మను చేర్చకుండా అందిస్తుంది.
theological_decisions:
- issue: దుర్వ్యవహారానికి అపొస్తలుల ప్రతిస్పందన
  choice: దూషణకు దీవెనతో, హింసకు సహనంతో ప్రతిస్పందిస్తున్న అపొస్తలుల ప్రవర్తనగా అనువదించబడింది.
  alternative: దీనిని పాఠకులందరికీ ఇచ్చిన ప్రత్యక్ష ఆజ్ఞగా విస్తరించడం.
  rationale: గ్రీకు వాక్యం ఆజ్ఞారూపంలో కాకుండా అపొస్తలుల ప్రస్తుత ఆచరణను తెలిపే ప్రథమ పురుష బహువచన వర్ణనగా ఉంది; దాని నైతిక బలాన్ని నిలుపుతూ దానిని అధికారిక ఆజ్ఞగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించబడింది. గ్రీకులోని సంక్షిప్త సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపింది.
