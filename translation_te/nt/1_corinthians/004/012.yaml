  source_fidelity: మొదటి జతలో గ్రీకులోని శ్రమించడం (κοπιῶμεν), స్వంత చేతులతో పని చేయడం (ἐργαζόμενοι ταῖς ἰδίαις χερσίν) స్పష్టంగా ప్రతిఫలించాయి. రెండవ జత కూడా తగినదే. అయితే διωκόμενοι నిష్క్రియ భావాన్ని, అలాగే లోయిదొరూమెనోయి జతతో ఉన్న సమాంతరాన్ని స్పష్టపరచడానికి ‘మమ్మల్ని హింసించినప్పుడు’ అవసరం.
  naturalness: ‘మా సొంత చేతులతో పనిచేస్తూ శ్రమిస్తున్నాం’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది. ‘మమ్మల్ని హింసించినప్పుడు’ అనేది సందర్భంలో ఇప్పటికే అర్థమయ్యే కర్మను అనవసరంగా వివరించడం కాదు; ముందు ఉన్న ‘మమ్మల్ని దూషించినప్పుడు’తో సమాంతరంగా ఉండి వాక్యాన్ని మరింత స్పష్టంగా, సహజంగా చేస్తుంది.
