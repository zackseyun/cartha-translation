review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys Paul''s figurative application of the preceding discussion to himself and Apollos, its beneficial purpose, the two purpose clauses, and the factional sense of being puffed up for one person against another. A safe correction is needed because ἃ is plural (''the things that are written''), while the text currently uses singular ''వ్రాయబడి ఉన్నదాన్ని.'' The note should also not say that the Greek has no verb: γέγραπται is a verb; what is elliptical is the absence of an explicit imperative/exhortative verb governing the maxim.'
  naturalness: The Telugu is clear, modern, and appropriately respectful. 'నాకూ అపొల్లోకూ' is smoother and more idiomatic than 'నాకు, అపొల్లోకు.' The retained sentence structure appropriately connects 'ఇలా చేశాను' with the preceding purpose clauses.
  terminology: '''సోదరులారా,'' ''అన్వయించాను,'' and ''ఉప్పొంగిపోకూడదు'' are suitable. ''ఉప్పొంగిపోకూడదు'' preserves Paul''s inflation metaphor without flattening it into mere pride. The imperative rendering of the disputed elliptical maxim is acceptable when its more literal form is preserved in a footnote.'
  issues:
  - severity: medium
    issue: The quoted maxim renders the plural relative pronoun ἃ as singular.
    rationale: Greek Μὴ ὑπὲρ ἃ γέγραπται refers to 'what/things are written.' Telugu should use plural 'వాటిని' rather than singular 'దాన్ని.'
  - severity: medium
    issue: Footnote b says the Greek is 'without a verb.'
    rationale: The phrase includes γέγραπται ('is/has been written'). Its ellipsis concerns the lack of an explicit imperative or other governing exhortative verb, not the complete absence of a verb.
  revised_text: సోదరులారా[a], మీ కోసమే నేను ఈ సంగతులను నాకూ అపొల్లోకూ అన్వయించాను. “వ్రాయబడి ఉన్న వాటిని మించిపోవద్దు”[b] అనే పాఠాన్ని మా విషయంలో మీరు నేర్చుకోవాలని, మీలో ఎవరూ ఒకరి పక్షాన మరొకరికి వ్యతిరేకంగా ఉప్పొంగిపోకూడదని ఇలా చేశాను.
