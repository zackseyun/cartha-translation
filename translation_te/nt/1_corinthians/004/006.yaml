  to: సోదరులారా[a], మీ కోసమే నేను ఈ సంగతులను నాకూ అపొల్లోకూ అన్వయించాను. “వ్రాయబడి ఉన్న వాటిని మించిపోవద్దు”[b] అనే పాఠాన్ని మా విషయంలో మీరు నేర్చుకోవాలని, మీలో ఎవరూ ఒకరి పక్షాన మరొకరికి వ్యతిరేకంగా ఉప్పొంగిపోకూడదని ఇలా చేశాను.
  rationale: The revision corrects the singular/plural mismatch in the maxim and makes the lexical note factually precise about the Greek ellipsis. It also makes the paired dative expression for Paul and Apollos more natural in modern standard Telugu. No theological interpretation is added, and the note continues to preserve the debated compressed form of the source expression.
