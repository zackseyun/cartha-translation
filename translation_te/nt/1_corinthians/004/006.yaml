id: 1CO.4.6
reference: 1 Corinthians 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: te
  text: సోదరులారా[a], మీ కోసమే నేను ఈ సంగతులను నాకూ అపొల్లోకూ అన్వయించాను. “వ్రాయబడి ఉన్న వాటిని మించిపోవద్దు”[b] అనే పాఠాన్ని మా విషయంలో మీరు నేర్చుకోవాలని, మీలో ఎవరూ ఒకరి పక్షాన మరొకరికి వ్యతిరేకంగా ఉప్పొంగిపోకూడదని ఇలా చేశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సోదర సోదరీమణులారా.” గ్రీకులోని “సోదరులు” అనే పదం స్త్రీపురుషులు కలిసిన సమూహాన్ని కూడా సంబోధించవచ్చు.
    reason: cultural_note
  - marker: b
    text: గ్రీకు వాక్యం స్పష్టమైన ఆజ్ఞారూప క్రియ లేకుండా సంక్షిప్తంగా ఉంది; అక్షరార్థంగా, “వ్రాయబడి ఉన్న వాటికి మించి కాదు.” ఇది ఒక సూత్రవాక్యం లేదా నినాదం అయి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ఈ సంగతులను
  rationale: బహువచన సూచక సర్వనామం ముందటి చర్చ మొత్తాన్ని వెనక్కి సూచిస్తుంది; అందువల్ల ఏకవచన సారాంశం కంటే ‘ఈ సంగతులను’ మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పుంలింగ బహువచన సంబోధనను నిలుపుతూ, సంఘంలోని స్త్రీపురుషులందరికీ ఇది వర్తించగలదని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: నాకు, అపొల్లోకు అన్వయించాను
  rationale: ముందటి విషయాలను పౌలు తనకూ అపొల్లోకూ ఉదాహరణాత్మకంగా వర్తింపజేశాడనే అలంకారిక బదలాయింపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δι’ ὑμᾶς
  choice: మీ కోసమే
  rationale: διά + కర్మ విభక్తి ఇక్కడ ప్రయోజనార్థక భావాన్ని తెలుపుతుంది; ‘ఏ’ పౌలు చేసిన అన్వయానికి వారి మేలే ఉద్దేశమని స్పష్టం చేస్తుంది.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: మా విషయంలో మీరు నేర్చుకోవాలని
  rationale: ‘మాలో’ అనే యాంత్రిక అనువాదం కంటే, పౌలు–అపొల్లోల విషయంలోని ఉదాహరణ ద్వారా నేర్చుకోవడమనే సంక్షిప్త గ్రీకు భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: “వ్రాయబడి ఉన్నదాన్ని మించిపోవద్దు” అనే పాఠాన్ని
  rationale: గ్రీకు నిర్మాణం క్రియలేకుండా సంక్షిప్తంగా ఉన్నప్పటికీ హెచ్చరికగా పనిచేస్తుంది. తెలుగు ఆజ్ఞారూపం ఉద్దేశిత భావాన్ని స్పష్టంగా అందిస్తుంది; మూలంలోని దీర్ఘవృత్త నిర్మాణాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: γέγραπται
  choice: వ్రాయబడి ఉన్నది
  rationale: పరిపూర్ణ కర్మణి రూపంలోని స్థిర ఫలితాన్ని, సాధారణ లేఖన సూత్ర భాషను కాపాడుతుంది.
- source_word: φυσιοῦσθε
  choice: ఉప్పొంగిపోకూడదు
  rationale: పౌలు ఉపయోగించే ఉబ్బిపోవడం అనే రూపకాన్ని నిలుపుతుంది; కేవలం ‘గర్వించకూడదు’ అని సమతలపరచదు.
- source_word: ὑπὲρ τοῦ ἑνὸς … κατὰ τοῦ ἑτέρου
  choice: ఒకరి పక్షాన మరొకరికి వ్యతిరేకంగా
  rationale: కొరింథు సంఘంలోని పక్షపాత పోటీని స్పష్టంగా తెలుపుతూ, ఒకరి అనుకూలత–మరొకరి వ్యతిరేకత అనే మూల విరుద్ధ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: τό· Μὴ ὑπὲρ ἃ γέγραπται అనే సంక్షిప్త వాక్యభాగం అర్థం
  choice: “వ్రాయబడి ఉన్నదాన్ని మించిపోవద్దు” అనే హెచ్చరికగా అనువదించడం
  alternative: “వ్రాయబడి ఉన్నదానికి మించి కాదు” అనే క్రియలేని సూత్రవాక్యంగా అనువదించడం
  rationale: మూల గ్రీకు సంక్షిప్తమైనదీ, బహుశా ఒక ప్రసిద్ధ సూత్రవాక్యాన్ని ప్రతిబింబించేదీ కావచ్చు. సందర్భంలో ఇది వారు నేర్చుకోవలసిన నియమంగా పనిచేస్తుంది; ఆజ్ఞారూప తెలుగు ఆ కార్యాన్ని స్పష్టం చేస్తుంది, అయితే దాని మూల రూపంలోని సందిగ్ధతను పాదటిప్పణి సంరక్షిస్తుంది.
- issue: ἐν ἡμῖν యొక్క సంబంధార్థం
  choice: ‘మా విషయంలో’ అని అనువదించడం
  alternative: ‘మాలో’ లేదా ‘మా ఉదాహరణ ద్వారా’
  rationale: ‘మా విషయంలో’ అనేది పౌలు, అపొల్లోలే నేర్చుకునే పాఠానికి ప్రదర్శనస్థలం లేదా ఉదాహరణ అనే భావాన్ని అతిగా వ్యాఖ్యానించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘అన్వయించాను,’ ‘మా విషయంలో’ వంటి పదబంధాలు పౌలు వాదనలోని అలంకారిక బదలాయింపును సహజంగా తెలియజేస్తాయి. ‘ఉప్పొంగిపోవడం’ అనే రూపకం మూలంలోని పౌలీయ చిత్రణను నిలుపుతుంది.
