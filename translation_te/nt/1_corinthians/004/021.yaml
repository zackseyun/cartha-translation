id: 1CO.4.21
reference: 1 Corinthians 4:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί θέλετε; ἐν ῥάβδῳ ἔλθω πρὸς ὑμᾶς, ἢ ἐν ἀγάπῃ πνεύματί τε πραΰτητος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: te
  text: మీరు ఏమి కోరుకుంటున్నారు? నేను బెత్తంతో మీ దగ్గరికి రావాలా? లేక ప్రేమతో, సాత్వికమైన మనోభావంతో[a][b] రావాలా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రేమతో, సాత్వికతగల ఆత్మతో.”
    reason: lexical_alternative
  - marker: b
    text: “సాత్వికమైన మనోభావం” అనేది పౌలు సాత్విక వైఖరిని సూచించవచ్చు; కొందరు ఇక్కడ “ఆత్మ”ను పరిశుద్ధాత్మ కార్యానికి పరోక్ష సూచనగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: మీరు ఏమి కోరుకుంటున్నారు?
  rationale: గ్రీకు వాక్యంలోని సూటియైన సవాలు, ప్రశ్నార్థక ధోరణి రెండింటినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐν ῥάβδῳ
  choice: బెత్తంతో
  rationale: ῥάβδος అనే పదంలోని అక్షరార్థమైన బెత్తం/దండం రూపకాన్ని, దాని క్రమశిక్షణాత్మక తీవ్రతను కాపాడుతుంది; ‘శిక్షించడానికి’ అని అనువదిస్తే రూపకాన్ని అతిగా వివరించినట్లవుతుంది.
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: నేను ... మీ దగ్గరికి రావాలా?
  rationale: చర్చాత్మక aorist subjunctive భావాన్ని తెలుగులో సహజమైన ‘రావాలా?’ అనే ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: ἢ
  choice: లేక
  rationale: పౌలు వచ్చే రెండు విధానాల మధ్య ఉన్న స్పష్టమైన ప్రత్యామ్నాయాన్ని తెలుపుతుంది.
- source_word: ἐν ἀγάπῃ
  choice: ప్రేమతో
  rationale: ‘బెత్తంతో’ అనే సమాంతర పదబంధానికి తగినట్లు ἐν ను విధానార్థకంగా అనువదిస్తుంది.
- source_word: πνεύματί τε πραΰτητος
  choice: సాత్వికమైన మనోభావంతో
  rationale: πνεῦμα ఇక్కడ పౌలు ప్రదర్శించే వైఖరి లేదా స్వభావాన్ని సూచించే అవకాశం ఎక్కువ. ‘మనోభావం’ ఆధునిక తెలుగులో సహజంగా ఉండి, πραΰτης లోని సాత్వికతను నిలుపుతుంది; మూలంలోని ‘ఆత్మ’ పదానికి సంబంధించిన సందిగ్ధతను పాదసూచికలు భద్రపరుస్తాయి.
theological_decisions:
- issue: πνεύματι అనే పదం పౌలు మనోభావాన్ని సూచిస్తుందా, పరిశుద్ధాత్మను సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో పౌలు వైఖరిని సూచించే ‘మనోభావం’
  alternative: ‘సాత్వికతగల ఆత్మతో’—పరిశుద్ధాత్మ కార్యానికి సూచనగా కూడా అర్థం చేసుకోవచ్చు
  rationale: తక్షణ సందర్భంలో పౌలు తాను వచ్చే రెండు విధానాలను—క్రమశిక్షణాత్మక కఠినతను, ప్రేమపూర్వక సాత్వికతను—వ్యతిరేకంగా చూపుతున్నాడు. గ్రీకులో πνεῦμα కు నిర్దిష్ట ఉపపదం లేకపోవడం వల్ల దాన్ని పరిశుద్ధాత్మకు స్పష్టమైన సూచనగా చేయకూడదు; అయితే ఆ అవకాశాన్ని పాదసూచికలో ఉంచడం మూలంలోని సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: భాష ఆధునిక ప్రామాణిక తెలుగులో, సూటిగా మరియు గౌరవప్రదంగా ఉంది. ‘బెత్తం’ అనే పదం మూలంలోని కఠినమైన క్రమశిక్షణ రూపకాన్ని నిలుపుతుంది. ‘సాత్వికమైన మనోభావం’ సాధారణ పాఠకునికి సహజంగా ఉండగా, పాదసూచికలు πνεῦμα లోని పదార్థ మరియు తాత్త్విక సందిగ్ధతను తెలియజేస్తాయి.
