id: 1CO.4.17
reference: 1 Corinthians 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: te
  text: అందుకే తిమోతిని మీ దగ్గరికి పంపాను. అతడు ప్రభువులో నాకు ప్రియమైన, నమ్మకమైన బిడ్డ[a]. మెస్సీయ యేసులోని నా మార్గాలను[b] అతడు మీకు గుర్తుచేస్తాడు; నేను ప్రతిచోటా ప్రతి సంఘంలో బోధిస్తున్నట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువులో నాకు ప్రియమైన, నమ్మకమైన కుమారుడు.” గ్రీకు τέκνον అనే పదానికి అక్షరార్థంగా “బిడ్డ” అని అర్థం; ఈ సందర్భంలో “కుమారుడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “క్రీస్తు యేసులోని నా మార్గాలను.” గ్రీకు Χριστός అనే బిరుదు అర్థాన్ని నిలుపడానికి ప్రధాన పాఠంలో “మెస్సీయ” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: ముందున్న వాదనకు కారణసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా కలుపుతుంది.
- source_word: ἔπεμψα
  choice: పంపాను
  rationale: గ్రీకు ఏఓరిస్టును సందర్భానుకూలమైన సరళ భూతకాలంగా అందిస్తుంది.
- source_word: Τιμόθεον
  choice: తిమోతి
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: τέκνον
  choice: బిడ్డ
  rationale: ఈ పదం లింగాన్ని ప్రత్యేకంగా సూచించని ‘సంతానం/బిడ్డ’ భావాన్ని కలిగిస్తుంది; పౌలు ఉపయోగించిన కుటుంబ రూపకాన్ని నిలుపుతుంది.
- source_word: ἀγαπητὸν καὶ πιστὸν
  choice: ప్రియమైన, నమ్మకమైన
  rationale: పౌలుకు తిమోతిపై ఉన్న అనురాగాన్నీ, ప్రభువులో అతని విశ్వసనీయతనూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: సంబంధం, జీవితం, సేవ అనే పౌలు వాడుకలోని విస్తృత భావాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- source_word: ἀναμνήσει
  choice: జ్ఞాపకం చేస్తాడు
  rationale: భవిష్యత్ క్రియను నేరుగా, సహజంగా తెలుగులో అందిస్తుంది.
- source_word: τὰς ὁδούς μου
  choice: నా మార్గాలను
  rationale: ప్రయాణ మార్గాలకన్నా పౌలు జీవితం, పరిచర్య, బోధనా పద్ధతులను సూచించే రూపక విస్తృతిని కాపాడుతుంది.
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులోని
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున దాని అర్థాన్ని ‘మెస్సీయ’గా అందించి, ఆ మార్గాలు ఆయనతో సంబంధంలో నిర్వచించబడుతున్నాయని చూపుతుంది.
- source_word: καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω
  choice: నేను ప్రతిచోటా ప్రతి సంఘంలో బోధిస్తున్నట్లే
  rationale: పౌలు బోధన అన్ని ప్రాంతాల్లోని ప్రతి సంఘంలో ఒకే విధంగా ఉందనే విస్తృతిని, పోలికను నిలుపుతుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఈ సందర్భంలో Χριστός బిరుదు భావాన్ని ఇంకా కలిగి ఉంది; ‘మెస్సీయ’ దాని అర్థాన్ని నేరుగా తెలియజేస్తుంది. సుపరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తున్నాం.
- issue: ‘నా మార్గాలు’ అనే రూపకం యొక్క పరిధి
  choice: నా మార్గాలను
  alternative: నా జీవన విధానాన్ని / నా నడవడిని
  rationale: గ్రీకు ὁδοί రూపకాన్ని నిలుపుతూ, పౌలు జీవితం, ప్రవర్తన, పరిచర్య, బోధనలన్నిటినీ కలుపుకోగల ఉద్దేశపూర్వక విస్తృతిని సంరక్షిస్తుంది.
- issue: πιστός యొక్క భావం
  choice: నమ్మకమైన
  alternative: విశ్వసనీయమైన / విశ్వాసంగల
  rationale: ఈ సందర్భంలో తిమోతి నమ్మదగినవాడనే భావం ప్రధానమైనప్పటికీ, ప్రభువుతో అతని విశ్వాస సంబంధాన్ని పూర్తిగా తొలగించకుండా ‘నమ్మకమైన’ అనే విస్తృత పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘బిడ్డ’ కుటుంబ రూపకాన్ని, ‘నా మార్గాలు’ గ్రీకు రూపకంలోని విస్తృతిని నిలుపుతాయి. ‘ప్రతిచోటా ప్రతి సంఘంలో’ మూలంలోని ద్విగుణ సార్వత్రికతను ఉద్దేశపూర్వకంగా కాపాడుతుంది.
