  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: te
  text: ఈ గడియ వరకు[a] మేము ఆకలితో ఉన్నాం, దాహంతో ఉన్నాం, సరిపడా బట్టలు లేకుండా ఉన్నాం[b], కొట్టబడుతున్నాం, స్థిరమైన నివాసం లేకుండా ఉన్నాం[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ప్రస్తుత గడియ వరకు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నగ్నంగా ఉన్నాం”; గ్రీకు పదం పూర్తిగా బట్టలు లేకపోవడమే కాక, సరిపడా బట్టలు లేకపోవడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “సంచరిస్తున్నాం”; గ్రీకు పదం స్థిరమైన నివాసం లేకపోవడాన్ని కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: ఇప్పటి ఈ ఘడియ వరకూ
  rationale: ప్రస్తుత కాలం వరకు కొనసాగుతున్న పరిస్థితిని సూచించే ఈ కాలవ్యక్తీకరణలోని ἄρτι అనే నొక్కిచెప్పడాన్ని, ὥρα అనే స్పష్టమైన కాలసూచనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πεινῶμεν
  choice: మేము ఆకలితో ఉన్నాం
  rationale: వర్తమాన సూచనార్థక క్రియ తెలిపే కొనసాగుతున్న దుస్థితిని సరళంగా, అతిశయింపకుండా వ్యక్తం చేస్తుంది.
- source_word: διψῶμεν
  choice: దాహంతో ఉన్నాం
  rationale: πεινῶμενతో జతగా ఉన్న కొనసాగుతున్న లేమిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γυμνιτεύομεν
  choice: సరిపడా బట్టలు లేకుండా ఉన్నాం
  rationale: ఈ పదం పూర్తిగా నగ్నంగా ఉండడమే కాక తగినంత వస్త్రధారణ లేకపోవడాన్ని కూడా సూచించగలదు; అందువల్ల అర్థాన్ని అతిగా తీవ్రం చేయకుండా భౌతిక లేమిని తెలియజేస్తుంది.
- source_word: κολαφιζόμεθα
  choice: దెబ్బలు తింటున్నాం
  rationale: వర్తమాన కర్మణి రూపం సూచించే పునరావృత శారీరక హింసను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ఒక నిర్దిష్ట రకమైన దెబ్బకే అర్థాన్ని పరిమితం చేయదు.
- source_word: ἀστατοῦμεν
  choice: నిలకడైన నివాసం లేక తిరుగుతున్నాం
  rationale: స్థిరమైన చోటు లేకపోవడం, అస్థిరంగా సంచరించడం అనే రెండు భావఛాయలనూ సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: καὶ … καὶ … καὶ …
  choice: … ఉన్నాం, … ఉన్నాం, … ఉన్నాం, … తింటున్నాం, … తిరుగుతున్నాం
  rationale: తెలుగులో ప్రతి అంశానికి క్రియను పునరుక్తి చేయడం ద్వారా గ్రీకులోని వరుస καίల సంచితమైన, విరామం లేని కష్టాల జాబితా ప్రభావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: పౌలు తన పరిస్థితిని వర్ణిస్తున్న స్వభావం
  choice: అపొస్తలుల లేమి, హింస, నివాస అస్థిరతలను కొనసాగుతున్న వాస్తవ కష్టాలుగా సూటిగా అనువదించడం
  alternative: ప్రధానంగా అలంకారికమైన లేదా అతిశయోక్తితో కూడిన వర్ణనగా స్పష్టం చేయడం
  rationale: మూలపాఠం వర్తమాన సూచనార్థక క్రియలతో నిర్దిష్ట కష్టాలను నేరుగా పేర్కొంటుంది. అవి ఎంతవరకు అలంకారికమో అనువాదం తేల్చకుండా, మూలంలోని వేదనను పెంచకుండానూ తగ్గించకుండానూ ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గంభీరమైన శైలి వాడబడింది. కష్టాల సంచిత ప్రభావం నిలిచేలా సమాంతర క్రియారూపాలను పునరుక్తి చేశాం; మతశాఖాపరమైన ప్రత్యేక పదజాలాన్ని నివారించాం.
