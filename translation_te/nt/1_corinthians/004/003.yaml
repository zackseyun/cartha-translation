id: 1CO.4.3
reference: 1 Corinthians 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: te
  text: అయితే, మీరు గానీ ఏ మానవ న్యాయస్థానం[a] గానీ నన్ను పరిశీలించడం నాకు చాలా స్వల్పమైన విషయమే. అంతేకాదు, నన్ను నేనే పరిశీలించను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మానవ న్యాయస్థానం’ అని అనువదించిన గ్రీకు మాటకు పదశః అర్థం ‘మానవ దినం’; ఇది మానవుల విచారణ లేదా మూల్యాంకనాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ δὲ
  choice: అయితే ... నాకు
  rationale: δέ యొక్క వ్యతిరేక/మార్పు భావాన్ని సహజమైన తెలుగులో చూపుతూ, దత్తి విభక్తి ἐμοὶ వ్యక్తిగత దృక్కోణాన్ని ‘నాకు’గా నిలుపుతుంది.
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: చాలా స్వల్పమైన విషయమే
  rationale: ఏదో అతి తక్కువ ప్రాముఖ్యత కలిగినదని తెలిపే గ్రీకు నుడికారాన్ని సహజంగా, గంభీరంగా వ్యక్తపరుస్తుంది.
- source_word: ἵνα ὑφ’ ὑμῶν ἀνακριθῶ
  choice: మీరు ... నన్ను పరిశీలించడం
  rationale: ἵνα ఇక్కడ అల్పమైనదిగా పరిగణించబడుతున్న విషయం ఏమిటో పరిచయం చేస్తుంది; ἀνακρίνω తుది తీర్పుకన్నా విచారణాత్మక పరిశీలనను సూచించగలదు.
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: ఏ మానవ న్యాయస్థానం గానీ
  rationale: ‘మానవ దినం’ అనే పదశః రూపానికి బదులు, సందర్భంలో ఉన్న మానవ విచారణ/మూల్యాంకన భావాన్ని ఆధునిక పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀλλ’ οὐδὲ
  choice: అంతేకాదు ... కూడా ... -ను
  rationale: ముందటి మాటకంటే మరింత బలమైన అంశానికి సాగే భావాన్ని, οὐδέ లోని ‘కూడా కాదు’ బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐμαυτὸν ἀνακρίνω
  choice: నన్ను నేను కూడా పరిశీలించుకోను
  rationale: ప్రతిఫలక సర్వనామాన్ని స్పష్టంగా ఉంచి, అదే క్రియను ‘పరిశీలించు’గా అనువదించడం ద్వారా వచనంలోని పదసామ్యాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἀνθρωπίνης ἡμέρας యొక్క అర్థం
  choice: మానవ న్యాయస్థానం
  alternative: మానవ దినం; మానవుల మూల్యాంకనం
  rationale: ఇది కాలమాన దినాన్ని గురించిన సిద్ధాంత ప్రకటన కాదు; సందర్భంలో మానవ విచారణను ప్రభువు చేసే విచారణతో వ్యత్యాసపరుస్తుంది. ‘న్యాయస్థానం’ నుడికార భావాన్ని స్పష్టంగా ఇస్తుంది; పదశః రూపాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
- issue: ἀνακρίνω యొక్క న్యాయ/మూల్యాంకన ఛాయ
  choice: పరిశీలించు
  alternative: తీర్పు తీర్చు; విచారించు
  rationale: సమీప సందర్భంలోని తుది తీర్పు భావంతో దీనిని పూర్తిగా సమానం చేయకుండా, జాగ్రత్తగా పరీక్షించడం లేదా మూల్యాంకనం చేయడం అనే విస్తృత భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చాలా స్వల్పమైన విషయమే’ పౌలు చెప్పిన అల్పప్రాముఖ్యతను నిలుపుతుంది; రెండు చోట్ల ἀνακρίνωను ‘పరిశీలించు’గా ఉంచి పదసామ్యాన్ని కాపాడాం. పాదటిప్పణి సూచిక [a] సంబంధిత నుడికార అనువాదం తర్వాత కాకుండా వాక్యాంతంలో ఉంచబడింది; అయినా అది ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంది.
