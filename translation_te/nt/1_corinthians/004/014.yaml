  to: మిమ్మల్ని సిగ్గుపరచడానికి[a] నేను ఈ సంగతులు రాయడం లేదు; కానీ నా ప్రియమైన పిల్లలుగా మిమ్మల్ని హెచ్చరిస్తూ రాస్తున్నాను[b].
  rationale: The revision retains the draft’s accurate structure and pastoral warmth while using ‘హెచ్చరిస్తూ’ for νουθετῶν, thereby making Paul’s corrective intent explicit. The alternative ‘బుద్ధి చెబుతూ’ is retained in a footnote as a natural, less forceful Telugu rendering. Footnote b is expanded to preserve the relational wording of the source.
