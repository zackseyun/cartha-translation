source:
  edition: SBLGNT
  text: Οὐκ ἐντρέπων ὑμᾶς γράφω ταῦτα, ἀλλ’ ὡς τέκνα μου ἀγαπητὰ ⸀νουθετῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: te
  text: మిమ్మల్ని సిగ్గుపరచడానికి[a] నేను ఈ సంగతులు రాయడం లేదు; కానీ నా ప్రియమైన పిల్లలుగా మిమ్మల్ని హెచ్చరిస్తూ రాస్తున్నాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు సిగ్గుపడేలా చేయడానికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా ప్రియమైన పిల్లలుగా మీకు బుద్ధి చెబుతూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: సిగ్గుపరచడానికి
  rationale: ఇక్కడ నిరాకరించబడిన క్రియారూపం పౌలు రాయడంలోని ఉద్దేశాన్ని లేదా తీరును సూచిస్తుంది. ‘సిగ్గుపరచడానికి’ అనేది గౌరవం–అవమానం భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: γράφω ταῦτα
  choice: నేను ఈ సంగతులు రాయడం లేదు … రాస్తున్నాను
  rationale: వర్తమానకాల లేఖారచనా భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, బహువచనమైన ταῦτα ను ‘ఈ సంగతులు’గా నిలిపింది.
- source_word: ἀλλ’
  choice: కాని
  rationale: పౌలు నిరాకరించిన ఉద్దేశానికి, తాను చెప్పే సానుకూల ఉద్దేశానికి మధ్యనున్న స్పష్టమైన వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: ὡς τέκνα μου ἀγαπητὰ
  choice: నా ప్రియమైన పిల్లలుగా
  rationale: τέκνα లింగభేదం లేకుండా సంతాన సంబంధాన్ని సూచిస్తుంది; ‘ప్రియమైన పిల్లలు’ ప్రేమతో కూడిన ఆత్మీయ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νουθετῶν
  choice: మీకు బుద్ధి చెబుతూ
  rationale: νουθετέω లోని హెచ్చరిక, దిద్దుబాటు, నైతిక ఉపదేశం అనే కలిపిన భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యే తెలుగులో వ్యక్తం చేస్తుంది; కేవలం శిక్షాత్మక ధ్వని రాకుండా ప్రేమతో కూడిన దిద్దుబాటును నిలుపుతుంది.
theological_decisions:
- issue: పౌలు దిద్దుబాటు మాటలలోని కాపరి ధోరణి
  choice: సిగ్గుపరచడం కాదని నిరాకరించి, ప్రియమైన పిల్లలకు బుద్ధి చెప్పే చర్యగా చూపడం
  alternative: ప్రియమైన పిల్లలను హెచ్చరిస్తున్నట్లు చూపడం
  rationale: ἐντρέπων అనే ప్రతికూల భాగానికి, νουθετῶν అనే సానుకూల భాగానికి మధ్యనున్న వ్యత్యాసం పౌలు గద్దింపును ప్రేమపూర్వక ఆత్మీయ తండ్రితనపు పరిధిలో ఉంచుతుంది. అనువాదం దిద్దుబాటు బలాన్నీ, సంబంధంలోని ఆప్యాయతనూ రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘బుద్ధి చెబుతూ’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతూనే ప్రేమతో కూడిన దిద్దుబాటు భావాన్ని ఇస్తుంది; ‘హెచ్చరిస్తూ’ అనే ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
