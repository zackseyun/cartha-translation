id: 1CO.4.15
reference: 1 Corinthians 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: te
  text: ఎందుకంటే, మెస్సీయలో మీకు లెక్కలేనంతమంది సంరక్షకులు ఉన్నా,[a] తండ్రులు మాత్రం చాలామంది లేరు. మెస్సీయ యేసులో సువార్త ద్వారా నేనే మీకు తండ్రినయ్యాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లెక్కలేనంతమంది’—పదశః ‘పదివేలమంది.’ గ్రీకు పదం తరచుగా చాలా పెద్ద సంఖ్యను సూచిస్తుంది. ‘సంరక్షకులు’ అనగా బాలుణ్ణి పర్యవేక్షించి క్రమశిక్షణలో నడిపించేవారు; ప్రధానంగా తరగతి ఉపాధ్యాయులు కాదు.
    reason: lexical_and_cultural_note
  - marker: b
    text: ‘నేనే మీకు తండ్రినయ్యాను’—గ్రీకులో పదశః, ‘నేను మిమ్మల్ని కనాను/జన్మింపజేశాను’ లేదా ‘మీకు తండ్రినయ్యాను.’ ఇది సువార్త ద్వారా వారు విశ్వాసంలోకి రావడంలో పౌలు పోషించిన పితృసమాన పాత్రను తెలిపే రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυρίους
  choice: లెక్కలేనంతమంది
  rationale: పదశః ‘పదివేలమంది’ అయినా, ఇక్కడ అత్యధిక సంఖ్యను సూచించే అలంకారిక ప్రయోగం. ‘లెక్కలేనంతమంది’ వాక్యంలోని ‘చాలామంది లేరు’ అనే వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: παιδαγωγοὺς
  choice: సంరక్షకులు
  rationale: గ్రీకు-రోమా సమాజంలో παιδαγωγός ప్రధానంగా తరగతి బోధకుడు కాదు; బాలుణ్ణి పర్యవేక్షించి, క్రమశిక్షణలో నడిపించే సంరక్షకుడు. అందువల్ల ‘సంరక్షకులు’ సామాజిక పాత్రను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదు; ‘మెస్సీయ’ దాని భావాన్ని తెలుగులో వెల్లడిస్తుంది. ἐν అనే పౌలు ప్రత్యేక ప్రయోగంలోని సంబంధం/ఐక్యతను ‘లో’ నిలుపుతుంది.
- source_word: πατέρας
  choice: తండ్రులు
  rationale: గ్రీకులోని పితృత్వ రూపకాన్ని ‘ఆత్మీయ తండ్రులు’ అని వివరణాత్మకంగా విస్తరించకుండా యథాతథంగా ఉంచుతుంది.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: సువార్త ద్వారా
  rationale: Genitive‌తో వచ్చిన διά సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది; ‘ద్వారా’ ఆ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐγέννησα
  choice: నేనే మిమ్మల్ని కన్నాను
  rationale: γεννάω యొక్క ‘కనడం/జన్మనివ్వడం’ అనే బలమైన పితృత్వ రూపకాన్ని నిలుపుతుంది. ‘నేనే’లోని ఉద్ఘాటన గ్రీకు ἐγώను, అనేక సంరక్షకులకు భిన్నంగా పౌలు పాత్రను, ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: పౌలు ఉపయోగించిన పితృత్వ/జనన రూపకాన్ని ఎలా వ్యక్తపరచాలి
  choice: ‘నేనే మిమ్మల్ని కన్నాను’ అని రూపకాన్ని ప్రత్యక్షంగా నిలుపడం
  alternative: ‘నేను మీకు తండ్రినయ్యాను’ లేదా ‘నేను మీ ఆత్మీయ తండ్రినయ్యాను’
  rationale: గ్రీకు ἐγέννησα నేరుగా ‘కన్నాను/జన్మనిచ్చాను’ అనే రూపకాన్ని ఉపయోగిస్తుంది. ‘ఆత్మీయ’ అని చేర్చడం పాఠ్యంలో లేని వివరణను దిగుమతి చేస్తుంది; ‘తండ్రినయ్యాను’ సహజమైనా మూలంలోని క్రియారూపకాన్ని కొంత మృదువుచేస్తుంది. సువార్త ద్వారా జరిగినదని సందర్భమే రూపకార్థాన్ని స్పష్టం చేస్తుంది.
- issue: Χριστόςను బిరుదుగా అనువదించడం
  choice: ‘మెస్సీయ’
  alternative: ‘క్రీస్తు’
  rationale: Χριστός యొక్క బిరుదు స్వభావాన్ని స్పష్టంగా చూపిస్తూ, ‘మెస్సీయలో’ మరియు ‘మెస్సీయ యేసులో’ అనే రెండు ప్రయోగాల సమాంతరతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సామాన్య పాఠకులకు అర్థమయ్యేలా ఉంచబడింది. మూలంలోని దీర్ఘ వాక్యాన్ని పఠన సౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించినా, γάρ ద్వారా వచ్చే వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో నిలుపబడింది. ‘కన్నాను’ కొద్దిగా అసాధారణంగా వినిపించినా, మూలంలోని ఉద్దేశపూర్వకమైన జనన రూపకాన్నీ దాని theological tensionనూ కాపాడుతుంది.
