    text: 'మరింత పదక్షరార్థంగా: “మీరు నిజంగానే ఏలివుంటే ఎంత బాగుండేది.”'
    reason: lexical_alternative
  - marker: b
    text: 'ఇక్కడ పౌలు వ్యంగ్యంగా మాట్లాడుతున్నాడు: కొరింథీయులు తాము అప్పటికే పూర్తిగా తృప్తిపడి, ధనవంతులై, రాజులుగా ఏలుతున్నట్లుగా ప్రవర్తిస్తున్నారు.'
