id: 1CO.4.8
reference: 1 Corinthians 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: te
  text: ఇప్పటికే మీరు పూర్తిగా తృప్తి చెందారు! ఇప్పటికే మీరు ధనవంతులయ్యారు! మేము లేకుండానే రాజులుగా ఏలారు! మీరు నిజంగానే రాజ్యమేలివుంటే ఎంత బాగుండేది[a]—అప్పుడు మేము కూడా మీతో కలిసి ఏలేవాళ్లం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదక్షరార్థంగా: “మీరు నిజంగానే ఏలివుంటే ఎంత బాగుండేది.”'
    reason: lexical_alternative
  - marker: b
    text: 'ఇక్కడ పౌలు వ్యంగ్యంగా మాట్లాడుతున్నాడు: కొరింథీయులు తాము అప్పటికే పూర్తిగా తృప్తిపడి, ధనవంతులై, రాజులుగా ఏలుతున్నట్లుగా ప్రవర్తిస్తున్నారు.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἤδη
  choice: ఇప్పటికే
  rationale: రెండు వాక్యభాగాల ఆరంభంలో ఉన్న కాలసంబంధ ఉద్ఘాటనను, వ్యంగ్య పునరుక్తిని నిలుపుతుంది.
- source_word: κεκορεσμένοι ἐστέ
  choice: మీరు పూర్తిగా తృప్తి చెందారు
  rationale: పూర్తిగా నిండిపోయి ఇక ఏ లోటూ లేనట్లున్న స్థితిని సూచించే పరిభాషను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; సందర్భంలోని వ్యంగ్యాన్ని కూడా మోయగలదు.
- source_word: ἐπλουτήσατε
  choice: మీరు ధనవంతులయ్యారు
  rationale: కేవలం ధనవంతులుగా ఉన్నారని కాక, ఆ స్థితికి చేరుకున్నారనే క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: χωρὶς ἡμῶν
  choice: మమ్మల్ని పక్కనపెట్టి
  rationale: ‘మేము లేకుండానే/మాకు వేరుగా’ అనే సంబంధాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది; అపొస్తలులను దాటి కొరింథీయులు ఎదిగిపోయామనుకునే వ్యంగ్యాన్ని సూచిస్తుంది.
- source_word: ἐβασιλεύσατε
  choice: రాజులుగా ఏలడం మొదలుపెట్టారు
  rationale: βασιλεύω లోని స్పష్టమైన రాజరిక చిత్రాన్ని నిలుపుతూ, వారు ఇప్పటికే రాజ్యపాలన స్థితిలో ప్రవేశించినట్లుగా పౌలు వ్యంగ్యంగా చెప్పే భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὄφελόν γε
  choice: నిజంగానే ఏలుతుంటే ఎంత బాగుండేది
  rationale: నెరవేరని బలమైన కోరికను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; γε ఇచ్చే ఉద్ఘాటనను ‘నిజంగానే’ నిలుపుతుంది.
- source_word: ἵνα
  choice: అప్పుడు
  rationale: కోరుకున్న పరిస్థితి నెరవేరితే దాని ఫలితంగా సంభవించేదాన్ని సహజమైన తెలుగు షరతు-ఫలిత నిర్మాణంలో చూపిస్తుంది.
- source_word: συμβασιλεύσωμεν
  choice: మేము కూడా మీతో కలిసి ఏలగలిగేవాళ్లం
  rationale: συν- లోని సహపాలన భావాన్ని స్పష్టంగా నిలుపుతుంది; నెరవేరని కోరికకు సరిపోయే సాధ్యతా రూపాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: మొదటి మూడు ప్రకటనల స్వరం
  choice: నేరుగా ప్రశంసలుగా కాక వ్యంగ్య ప్రకటనలుగా వినిపించేలా ఆశ్చర్యార్థక వాక్యాలుగా అనువదించడం
  alternative: ఎలాంటి వ్యంగ్య సూచన లేకుండా సాధారణ ప్రకటనలుగా అనువదించడం
  rationale: 4:7–13 సందర్భంలో కొరింథీయుల స్వీయోన్నత భావానికి అపొస్తలుల బాధలను పౌలు ఎదురుగా ఉంచుతున్నాడు. అయితే వ్యంగ్యాన్ని వివరణగా ప్రధాన పాఠ్యంలో చేర్చకుండా వాక్య స్వరంతోనే తెలియజేయబడింది.
- issue: రాజ్యపాలన భాష యొక్క భావం
  choice: ‘రాజులుగా ఏలడం/కలిసి ఏలడం’ అనే రాజరిక చిత్రాన్ని నిలుపడం
  alternative: ‘అధికారంలోకి వచ్చారు’ లేదా ‘ఉన్నత స్థితికి చేరారు’ అని సాధారణీకరించడం
  rationale: βασιλεύω, συμβασιλεύω పదాల్లోని రాజరిక చిత్రం ఈ వాక్యపు వాక్చాతుర్యానికి ముఖ్యమైనది; భవిష్యత్ రాజ్యపాలనకు సంబంధించిన సూచన ఉండవచ్చనే ఉద్వేగాన్ని కూడా ఇది ముందే నిర్ణయించకుండా నిలుపుతుంది.
- issue: ὄφελόν γε లోని వ్యంగ్యం మరియు నిజమైన కోరిక మధ్య ఉద్వేగం
  choice: ‘నిజంగానే… ఎంత బాగుండేది’ అని అనువదించి రెండింటికీ స్థలం ఇవ్వడం
  alternative: దీనిని పూర్తిగా వెటకారంగా లేదా పూర్తిగా సరళమైన కోరికగా మాత్రమే చూపించడం
  rationale: పౌలు వారి వాదనను వ్యంగ్యంగా తిప్పికొడుతూ, వారు నిజంగా ఏలే స్థితి వచ్చి అపొస్తలులూ వారితో ఏలాలని కోరుతున్న భావం కూడా ఉండవచ్చు; మూలంలోని ఈ ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పౌలు వాడిన ఘాటైన వ్యంగ్యం మరియు రాజరిక రూపకం నిలిచేలా రూపొందించబడింది. ఆశ్చర్యార్థక చిహ్నాలు గ్రీకు వాక్యంలోని వ్యంగ్య ఉద్ఘాటనను తెలుగులో వినిపిస్తాయి.
