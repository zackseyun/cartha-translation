revisions:
- from: ఇప్పటికే మీరు పూర్తిగా తృప్తి చెందారు! ఇప్పటికే మీరు ధనవంతులయ్యారు! మమ్మల్ని పక్కనపెట్టి రాజులుగా ఏలడం మొదలుపెట్టారు! మీరు నిజంగానే ఏలుతుంటే ఎంత బాగుండేది[a]—అప్పుడు మేము కూడా మీతో కలిసి ఏలగలిగేవాళ్లం.[b]
  to: ఇప్పటికే మీరు పూర్తిగా తృప్తి చెందారు! ఇప్పటికే మీరు ధనవంతులయ్యారు! మేము లేకుండానే రాజులుగా ఏలారు! మీరు నిజంగానే రాజ్యమేలివుంటే ఎంత బాగుండేది[a]—అప్పుడు మేము కూడా మీతో కలిసి ఏలేవాళ్లం.[b]
  rationale: The revision removes the unsupported inceptive addition, renders χωρὶς ἡμῶν without suggesting an extra action of setting the apostles aside, and makes the ὄφελόν γε clause clearly counterfactual. It preserves the passage’s irony and royal imagery; the explanatory note remains appropriately limited to the rhetorical tone.
  reviewer_model: gpt-5.6-terra
