id: 1CO.4.4
reference: 1 Corinthians 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: te
  text: ఎందుకంటే, నాకు వ్యతిరేకంగా ఏదీ నాకు తెలియదు[a]. అయినా, దీనివల్ల నేను నిర్దోషిగా తీర్పు పొందలేదు[b]. నన్ను పరిశీలించేవాడు ప్రభువే[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాలో ఏదీ నాకు తెలియదు” లేదా “నాకు వ్యతిరేకంగా ఏదీ నాకు తెలియదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దీనివల్ల నేను నీతిమంతునిగా తీర్చబడ్డాను కాదు” లేదా “దీనివల్ల నేను సమర్థించబడ్డాను కాదు.” గ్రీకు పదం న్యాయపరంగా అనుకూల తీర్పు పొందడాన్ని సూచించగలదు; పౌలు ఇతర చోట్ల కూడా ఇదే పదాన్ని ‘నీతిమంతునిగా తీర్చడం’ అనే భావంలో ఉపయోగిస్తాడు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నన్ను విచారించేవాడు” లేదా “నన్ను మదింపు చేసేవాడు.” ఈ గ్రీకు క్రియ న్యాయపరమైన సందర్భంలో పరిశీలించడం, విచారించడం, లేదా మదింపు చేయడం అనే అర్థాలను కలిగి ఉండగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: ఎందుకంటే, నా విషయంలో నాకు ఏ తప్పూ తెలిసి లేదు
  rationale: σύνοιδα యొక్క అంతరాత్మసంబంధమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. మూలంలో ‘తప్పు’ అనే నామవాచకం ప్రత్యక్షంగా లేకపోయినా, ἐμαυτῷతో కూడిన ప్రయోగం సందర్భంలో తనకు వ్యతిరేకంగా ఏదీ తెలియకపోవడం అనే భావాన్ని ఇస్తుంది; పాదటిప్పణిలో మరింత అక్షరార్థ ప్రత్యామ్నాయం నిలుపబడింది.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ
  choice: అయినా, దీనివల్ల ... కాను
  rationale: మునుపటి స్వీయ అవగాహనకు విరుద్ధంగా, అదే తనకు అనుకూల తీర్పుకు ఆధారం కాదని తెలుపుతుంది. ἐν τούτῳ ఇక్కడ సాధన/ఆధార భావంలో సహజంగా ‘దీనివల్ల’గా అనువదించబడింది.
- source_word: δεδικαίωμαι
  choice: నేను నిర్దోషిగా తీర్పు పొందినవాడిని కాను
  rationale: δικαιόω యొక్క న్యాయస్థాన సంబంధ భావాన్ని ‘నిర్దోషిగా తీర్పు పొందడం’ ద్వారా స్పష్టంగా నిలుపుతుంది. పరిపూర్ణ కర్మణి రూపంలోని ఇప్పటికే పొందిన తీర్పు/స్థితి భావాన్ని ‘పొందినవాడిని’ సూచిస్తుంది; విస్తృత సిద్ధాంతార్థాన్ని అనవసరంగా రుద్దదు.
- source_word: ὁ ... ἀνακρίνων με
  choice: నన్ను పరిశీలించేవాడు
  rationale: ἀνακρίνωలోని పరీక్షించడం, విచారించడం, మదింపు చేయడం అనే పరిధిని ‘పరిశీలించు’ సహజంగా వ్యక్తం చేస్తుంది; తుది తీర్పు అనే భావాన్ని అతిగా నిర్దేశించదు.
- source_word: κύριός
  choice: ప్రభువే
  rationale: నిర్దిష్టమైన κύριοςను ‘ప్రభువు’గా అనువదించి, వాక్యంలోని కర్తపై ఉన్న ఉద్ఘాటనను ‘ఏ’ ప్రత్యయంతో చూపిస్తుంది; మూలంలో లేని ‘యేసు’ అనే వివరణను చేర్చదు.
theological_decisions:
- issue: δεδικαίωμαι యొక్క న్యాయస్థాన సంబంధ భావం మరియు పౌలు స్వీయ మదింపు మధ్య సంబంధం
  choice: ‘దీనివల్ల నేను నిర్దోషిగా తీర్పు పొందినవాడిని కాను’
  alternative: ‘దీనివల్ల నేను నీతిమంతుడిగా తీర్చబడను’ లేదా ‘దీనివల్ల నేను సమర్థించబడను’
  rationale: తక్షణ సందర్భం సేవకుల పరిశీలన, తీర్పు గురించి ఉంది. అందువల్ల న్యాయపరమైన బరువును నిలుపుతూ, ఈ ఒక్క వాక్యాన్ని విస్తృతమైన సిద్ధాంత ప్రకటనగా మార్చకుండా అనువదించబడింది.
- issue: κύριος ఎవరిని సూచిస్తుంది
  choice: ‘ప్రభువు’ అని మాత్రమే ఉంచడం
  alternative: ‘ప్రభువైన యేసు’
  rationale: పౌలు సందర్భంలో క్రీస్తు ఉద్దేశింపబడి ఉండవచ్చును; అయినా ఈ వాక్యంలో గ్రీకు పాఠం κύριος అని మాత్రమే చెబుతుంది. అందుచేత గుర్తింపును అనువాదంలో విస్తరించలేదు.
- issue: ἀνακρίνωνను పరిశీలనగా లేదా తీర్పుగా అనువదించడం
  choice: ‘పరిశీలించేవాడు’
  alternative: ‘తీర్పు తీర్చేవాడు’ లేదా ‘విచారించేవాడు’
  rationale: ఈ క్రియలో న్యాయపరమైన పరిశీలన/మదింపు భావం ఉంది, కాని అది తప్పనిసరిగా తుది తీర్పునే సూచించదు. అస్పష్టతను పూర్తిగా తొలగించకుండా ప్రధాన పాఠంలో విస్తృతమైన పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నా విషయంలో నాకు ఏ తప్పూ తెలిసి లేదు’ సాధారణ పాఠకునికి అంతరాత్మసంబంధ భావాన్ని స్పష్టంగా అందిస్తుంది. ‘నిర్దోషిగా తీర్పు పొందినవాడిని’ న్యాయస్థాన రూపకాన్ని కాపాడుతుంది; ‘ప్రభువే’ మూలంలోని ఉద్ఘాటనను సహజంగా ప్రతిబింబిస్తుంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
