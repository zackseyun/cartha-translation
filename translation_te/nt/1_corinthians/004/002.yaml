id: 1CO.4.2
reference: 1 Corinthians 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὧδε λοιπὸν ζητεῖται ἐν τοῖς οἰκονόμοις ἵνα πιστός τις εὑρεθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: te
  text: ఇక ఈ విషయంలో, గృహనిర్వాహకుల్లో కోరబడేది ఏమిటంటే, ఒక్కొక్కరు నమ్మకస్థులుగా కనబడాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “గృహనిర్వాహకులలో ఒకరు నమ్మకస్థుడిగా కనబడాలని వెదకబడుతుంది.” ఇక్కడ “కోరబడేది” అంటే వారినుండి ఆశించబడే లేదా అవసరమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε λοιπὸν
  choice: ఈ విషయంలో
  rationale: ὧδε సందర్భాన్ని లేదా చర్చలోని విషయాన్ని సూచిస్తుంది; λοιπὸν వాదనలో తదుపరి నిర్ధారణకు దారితీస్తుంది. తెలుగులో రెండింటినీ విడివిడిగా కృత్రిమంగా పేర్చకుండా ‘ఈ విషయంలో’ అని సహజంగా వ్యక్తపరచడం సందర్భానుకూలం.
- source_word: ζητεῖται
  choice: కనబడాలి
  rationale: ζητέω యొక్క మూల భావం ‘వెదకడం’ అయినా, ఈ నిష్క్రియ ప్రయోగంలో పరిశీలనలో ఏ గుణం ఉండాలని ఆశించబడుతుందో సూచిస్తుంది. ‘కనబడాలి’ అనే రూపం εὑρεθῇతో కలిసి బాధ్యతను సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τοῖς οἰκονόμοις
  choice: గృహనిర్వాహకుల్లో
  rationale: ἐν ఇక్కడ ఆ గుణం వెదకబడే వర్గాన్ని సూచిస్తుంది. ‘గృహనిర్వాహకుల్లో’ అనేది గ్రీకు నిర్మాణాన్ని, అప్పగించబడిన ఇంటి వ్యవహారాలను నిర్వహించే రూపకాన్ని నిలుపుతుంది.
- source_word: οἰκονόμοις
  choice: గృహనిర్వాహకులు
  rationale: οἰκονόμος అంటే యజమాని అప్పగించిన ఇంటి లేదా ఆస్తి వ్యవహారాలను నిర్వహించే వ్యక్తి. ‘గృహనిర్వాహకుడు’ ఈ అప్పగింత-నిర్వహణ రూపకాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἵνα πιστός τις εὑρεθῇ
  choice: ప్రతి ఒక్కరూ నమ్మకస్థులుగా కనబడాలి
  rationale: ἵνα ఇక్కడ వెదకబడే లేదా ఆశించబడే విషయాన్ని పరిచయం చేస్తుంది; πιστός అప్పగించిన బాధ్యతలో విశ్వసనీయతను సూచిస్తుంది; εὑρεθῇ పరిశీలనలో అలా తేలడాన్ని సూచిస్తుంది. τις యొక్క అనిర్దిష్ట ప్రతినిధి ఏకవచన భావాన్ని సహజ తెలుగులో ‘ప్రతి ఒక్కరూ’ తెలియజేస్తుంది.
theological_decisions:
- issue: అనిర్దిష్ట ప్రతినిధి ఏకవచనం మరియు లింగ ఖచ్చితత్వం
  choice: ప్రతి ఒక్కరూ నమ్మకస్థులుగా కనబడాలి
  alternative: ఒకడు నమ్మకస్థుడిగా కనబడాలి
  rationale: గ్రీకులో τις అనిర్దిష్ట ఏకవచనం; దాని సూచన సాధారణమైనది, కేవలం పురుషులకు పరిమితం కాదు. ‘ప్రతి ఒక్కరూ’ వ్యక్తిగత బాధ్యతను నిలుపుతూ అనవసరమైన పురుషలింగ పరిమితిని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘గృహనిర్వాహకులు’ ద్వారా అప్పగించబడిన నిర్వహణ అనే మూల రూపకం నిలుపబడింది; ‘నమ్మకస్థులు’ πιστόςలోని విశ్వసనీయత భావాన్ని తెలియజేస్తుంది.
