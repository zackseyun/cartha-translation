revisions:
- from: ఈ విషయంలో, గృహనిర్వాహకుల్లో ప్రతి ఒక్కరూ నమ్మకస్థులుగా కనబడాలి[a].
  to: ఇక ఈ విషయంలో, గృహనిర్వాహకుల్లో కోరబడేది ఏమిటంటే, ఒక్కొక్కరు నమ్మకస్థులుగా కనబడాలి[a].
  rationale: The revision adds ‘ఇక’ for λοιπὸν and renders ζητεῖται separately as ‘కోరబడేది,’ while retaining εὑρεθῇ as ‘కనబడాలి.’ ‘ఒక్కొక్కరు’ gives the generic singular’s individual force without unnecessarily restricting the statement to men. The footnote now accurately distinguishes the literal wording from the idiomatic Telugu rendering.
