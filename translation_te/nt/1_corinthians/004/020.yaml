  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: te
  text: ఎందుకంటే దేవుని రాజ్యం మాటల్లో[a] కాదు, శక్తిలో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మాటలో,” “ప్రసంగంలో,” లేదా “వట్టి మాటల్లో”; ఇక్కడ వట్టి మాటలకు, కార్యసాధకమైన శక్తికి మధ్య వ్యత్యాసం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ఎందుకంటే ... కాదు
  rationale: γάρ ముందున్న వాక్యానికి కారణాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఈ సంబంధాన్ని సహజంగా చూపుతుంది. οὐ నిరాకరణను ‘కాదు’గా వ్యక్తం చేశాం.
- source_word: ἐν λόγῳ
  choice: మాటల్లో
  rationale: λόγος ఇక్కడ మాట, ప్రసంగం, లేదా వాచిక ప్రకటనను సూచించగలదు. బహువచన రూపంలోని ‘మాటల్లో’ తెలుగులో సహజంగా ఉండి, కేవలం మాటలకు మరియు కార్యసాధక శక్తికి మధ్యనున్న వ్యత్యాసాన్ని తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: ఇది తెలుగులో స్థిరమైన, సహజమైన అనువాదం; βασιλείαలోని రాజ్యం మరియు పాలన అనే భావవ్యాప్తిని అనవసరంగా ఒక్కదానికే పరిమితం చేయదు.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: శక్తిలో ఉంది
  rationale: δύναμιςకు ‘శక్తి’ నేరమైన సమానార్థకం. గ్రీకులో చివరి భాగంలో క్రియ అధ్యాహారంగా ఉంది; తెలుగులో వాక్యం సంపూర్ణంగా, సహజంగా ఉండేందుకు ‘ఉంది’ని స్పష్టంగా చేర్చాం.
theological_decisions:
- issue: ‘మాట’ మరియు ‘శక్తి’ మధ్య వ్యత్యాస స్వభావం
  choice: దేవుని రాజ్యానికి గుర్తు కేవలం మాటలు కాక, కార్యసాధకమైన శక్తి అని విస్తృతంగానే ఉంచడం
  alternative: శక్తి అనేది ప్రత్యేకంగా అద్భుతాలు, మారిన జీవితం మరియు సంఘ క్రమశిక్షణ, అపొస్తల అధికారము, లేదా పరిశుద్ధాత్మ కార్యం మాత్రమే అని నిర్దిష్టీకరించడం
  rationale: గ్రీకు పాఠం δύναμις యొక్క నిర్దిష్ట రూపాన్ని ఇక్కడ చెప్పదు. కాబట్టి అనువాదం దాని భావాన్ని ఒకే వేదాంత వివరణకు పరిమితం చేయకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ‘మాటల్లో కాదు, శక్తిలో ఉంది’ అనే నిర్మాణం మూలంలోని పదునైన వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
