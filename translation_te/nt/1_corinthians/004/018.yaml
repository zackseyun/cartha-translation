    reason: lexical_alternative
  - marker: b
    text: తమను తాము గొప్పవారిగా భావించే గర్వాన్ని సూచించడానికి పౌలు 1 కొరింథీయుల పత్రికలో ‘ఉబ్బిపోవడం’ అనే రూపకాన్ని పదేపదే వాడాడు; 1 కొరింథీయులు 4:6, 4:19; 5:2; 8:1; 13:4 చూడండి.
