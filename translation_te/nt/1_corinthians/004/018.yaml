lexical_decisions:
- source_word: ὡς
  choice: అని భావించి
  rationale: ఇది కొరింథీయుల తప్పుడు ఊహను సూచించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: నేను మీ దగ్గరికి రానని
  rationale: ὡς మీద ఆధారపడిన ఈ షష్ఠీ విభక్తి కృదంత నిర్మాణం నేరుగా చెప్పిన వాస్తవం కాక, వారు ఊహించిన పరిస్థితిని సూచిస్తుంది.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప అనుసంధాన అవ్యయం; ముందరి వాక్యంతో ఉన్న ప్రవాహంలో దాని కార్యం తెలుగులో ప్రత్యేక పదం లేకుండానే స్పష్టమవుతుంది.
- source_word: ἐφυσιώθησάν
  choice: ఉబ్బిపోయారు
  rationale: φυσιόω లోని ‘ఉబ్బడం’ అనే రూపకాన్ని నిలుపుతూ, తమను తాము గొప్పవారిగా భావించే గర్వాన్ని సందర్భంలో తెలియజేస్తుంది.
- source_word: τινες
  choice: కొందరు
  rationale: సంఘంలోని ఒక నిర్దిష్టం కాని వర్గాన్ని సహజంగా, సంక్షిప్తంగా సూచిస్తుంది.
theological_decisions:
- issue: కొరింథీయుల గర్వంపై పౌలు చేసిన విమర్శను ఎలా వ్యక్తపరచాలి
  choice: ‘అహంకారులయ్యారు’ అని అర్థాన్ని మాత్రమే చెప్పకుండా, ‘ఉబ్బిపోయారు’ అనే రూపకాన్ని వాడటం
  alternative: నేను మీ దగ్గరికి రానని భావించి, కొందరు అహంకారులయ్యారు.
  rationale: ఇది పౌలు 1 కొరింథీయుల పత్రికలో పదేపదే వాడిన రూపకాన్ని, దాని వాక్చాతుర్య సంబంధాన్ని నిలుపుతుంది; అదే సమయంలో పాఠకులకు దాని భావాన్ని గమనికలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, గౌరవప్రదంగా ఉంది. మూలంలోని ఊహాత్మక భావాన్ని ‘అని భావించి’ ద్వారా, పౌలు వాడిన గర్వపు రూపకాన్ని ‘ఉబ్బిపోయారు’ ద్వారా నిలిపింది.
