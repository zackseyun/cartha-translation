revisions:
- from: మమ్మల్ని దూషించినప్పుడు[a], మేము వేడుకుంటాం. ఇప్పటివరకు మేము లోకపు చెత్తలా, అన్నిటిలోని మురికిలా[b] అయ్యాం.
  to: మమ్మల్ని దూషించినప్పుడు[a], మేము వేడుకుంటాం; ఇప్పటివరకు మేము లోకపు చెత్తగా, అన్నిటికీ తుడిచిపారేసిన మురికిగా[b] అయ్యాం.
  rationale: 'The revision corrects the relational sense of πάντων περίψημα: it no longer says that the dirt is located within all things, but presents the apostles as what is discarded or wiped away in relation to all. It retains the source’s harsh paired imagery, modern standard Telugu, and the source ambiguity regarding the possible scope of πάντων. The footnote is adjusted to match the revised wording and continues to avoid importing disputed sacrificial associations into the text.'
