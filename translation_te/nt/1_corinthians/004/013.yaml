id: 1CO.4.13
reference: 1 Corinthians 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: te
  text: మమ్మల్ని దూషించినప్పుడు[a], మేము వేడుకుంటాం; ఇప్పటివరకు మేము లోకపు చెత్తగా, అన్నిటికీ తుడిచిపారేసిన మురికిగా[b] అయ్యాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మమ్మల్ని అపకీర్తిపాలు చేసినప్పుడు, మేము బతిమాలుతాం.’ ఇక్కడి గ్రీకు క్రియకు ‘వేడుకొను,’ ‘విజ్ఞప్తి చేయు,’ లేదా ‘ప్రోత్సహించు’ అనే అర్థాలు రావచ్చు. ఈ సందర్భంలో అది దూషణకు ప్రతీకారం తీర్చుకోకుండా సమాధానకరంగా స్పందించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘చెత్త,’ ‘తుడిచిపారేసిన మురికి’ అని అనువదించిన గ్రీకు పదాలు అరుదైనవి, చాలా తీవ్రమైనవి. శుభ్రం చేసేటప్పుడు గీకి లేదా తుడిచి తొలగించే వ్యర్థాన్ని అవి సూచించవచ్చు; ఇక్కడ అవి అత్యంత తీవ్రమైన సామాజిక తృణీకరణను వ్యక్తం చేస్తున్నాయి.
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: మమ్మల్ని దూషించినప్పుడు
  rationale: ఈ కర్మణి వర్తమాన అసమాపక క్రియ ఇతరులు అపకీర్తికరంగా మాట్లాడడాన్ని సూచిస్తుంది. కాలార్థక ఉపవాక్యం తెలుగులో సహజంగా ఉండి, గ్రీకు రూపంలోని సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: παρακαλοῦμεν
  choice: మేము వేడుకుంటాం
  rationale: παρακαλέωకు వేడుకొను, విజ్ఞప్తి చేయు, ప్రోత్సహించు అనే అర్థాలు ఉన్నాయి. ఇక్కడ దూషణకు ప్రతీకారంగా స్పందించకుండా, సమాధానకరంగా విజ్ఞప్తి చేయడమే సందర్భానికి తగినది. గ్రీకులో లేని ‘మృదువుగా’ అనే క్రియావిశేషణాన్ని చేర్చలేదు.
- source_word: ὡς
  choice: లా
  rationale: ఇది కచ్చితమైన తాదాత్మ్యాన్ని కాక పోలికను సూచిస్తుంది; తెలుగు పోలికా ప్రత్యయం ‘లా’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: περικαθάρματα τοῦ κόσμου
  choice: లోకపు చెత్త
  rationale: శుభ్రం చేసేటప్పుడు తొలగించబడే వ్యర్థాన్ని సూచించే బలమైన రూపకాన్ని ‘చెత్త’ సామాన్య పాఠకులకు స్పష్టంగా, తీవ్రత తగ్గకుండా అందిస్తుంది.
- source_word: ἐγενήθημεν
  choice: అయ్యాం
  rationale: అపొస్తలులు అవమానకరమైన స్థితికి చేరిన ఫలితాన్ని సూచిస్తుంది; చివరనున్న ‘ఇప్పటివరకు’తో కలిసి తెలుగు భూతరూపం కొనసాగుతున్న ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάντων περίψημα
  choice: అన్నిటిలోని మురికి
  rationale: περίψημα తుడిచి లేదా గీకి తొలగించే నీచమైన అవశేషాన్ని సూచిస్తుంది. πάντων యొక్క విస్తృత, సంభావ్య నపుంసక భావాన్ని ‘అన్నిటిలోని’ నిలుపుతుంది; ‘మురికి’ సమీప పర్యాయ రూపకాన్ని సులభంగా తెలియజేస్తుంది.
- source_word: ἕως ἄρτι
  choice: ఇప్పటివరకు
  rationale: రచన జరుగుతున్న ప్రస్తుత క్షణం వరకు ఆ స్థితి కొనసాగిందని తెలిపే సహజ తెలుగు కాలవ్యక్తీకరణ.
theological_decisions:
- issue: περικαθάρματα / περίψημα అనే జంట పదాల్లోని అవమాన భావాన్ని ఎలా అనువదించాలి
  choice: ప్రధాన పాఠ్యంలో ‘చెత్త’ / ‘మురికి’ అనే తీవ్రమైన సామాజిక తృణీకరణ భాషను వాడడం
  alternative: వాటిని ప్రాయశ్చిత్త బలి లేదా శుద్ధీకరణ బలులుగా నేరుగా వ్యాఖ్యానించడం
  rationale: అరుదైన ఈ పదాలకు శుద్ధీకరణలో తొలగించబడే పదార్థం అనే నేపథ్యం ఉండవచ్చు; కొన్ని వాడుకల్లో బలి సంబంధ సూచనలు చర్చించబడతాయి. అయితే ఈ సందర్భంలో స్పష్టమైన ముఖ్యాంశం అపొస్తలులు లోకపు దృష్టిలో అత్యంత నీచంగా చూడబడటం. అందువల్ల వివాదాస్పదమైన బలి భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా వాక్యంలోని అవమానకర రూపకాల తీవ్రతను తగ్గించకుండా అనువదించబడింది. ‘ప్రపంచం’ కంటే బైబిలు సందర్భంలో సహజమైన ‘లోకం’ వాడబడింది; అరుదైన సంస్కృతీకృత లేదా పాత పదజాలం నివారించబడింది.
