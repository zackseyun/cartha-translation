reference: 1 Corinthians 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: te
  text: కాబట్టి, ప్రభువు వచ్చేవరకు సమయానికి ముందే[a] దేనిగురించీ తీర్పు తీర్చకండి. ఆయన కూడా చీకటిలో దాగి ఉన్నవాటిని వెలుగులోకి తెచ్చి, హృదయాల్లోని సంకల్పాలను[b] బయలుపరుస్తాడు.[c] అప్పుడు ప్రతి ఒక్కరికీ ప్రశంస దేవుని నుండి వస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తగిన సమయం రాకముందే,’ ‘అకాలంగా.’ గ్రీకు మాట సరైన లేదా తగిన సమయానికి ముందే వ్యవహరించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘హృదయాల్లోని ఉద్దేశాలను,’ ‘హృదయాల్లోని ఆలోచనలను.’
    reason: lexical_alternative
  - marker: c
    text: అంటే, ప్రభువు వచ్చినప్పుడు దాగి ఉన్నవాటిని బయలుపరచి చేసే ఆయన అంతిమ మూల్యాంకనంలో.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందున్న వాదన నుండి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μὴ πρὸ καιροῦ
  choice: సమయానికి ముందే ... తీర్పు తీర్చకండి
  rationale: πρὸ καιροῦ అనే మాట తగిన సమయం రాకముందే లేదా అకాలంగా వ్యవహరించడాన్ని సూచిస్తుంది; ‘నియమిత సమయం’ అని మూలంలో లేని భావాన్ని స్పష్టంగా చేర్చలేదు.
- source_word: τι κρίνετε
  choice: దేనిగురించీ తీర్పు తీర్చకండి
  rationale: τι యొక్క విస్తృత పరిధిని నిలుపుతూ, న్యాయనిర్ణయం చేయడం అనే సందర్భార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: ప్రభువు వచ్చేవరకు వేచి ఉండండి
  rationale: ప్రధాన నిషేధానికి ఉన్న కాలపరిమితిని సహజమైన తెలుగులో చూపుతుంది. ‘వేచి ఉండండి’ అనేది తెలుగు వాక్య నిర్మాణానికి అవసరమైన స్పష్టీకరణ; తీర్పును ప్రభువు రాకవరకు నిలిపివేయాలనే భావాన్ని మార్చదు.
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: చీకటిలో దాగి ఉన్నవాటిని వెలుగులోకి తెచ్చి
  rationale: భౌతిక కాంతికన్నా రహస్యమైన వాటిని బయలుపరచడం అనే రూపకాలంకార భావాన్ని సహజంగా నిలుపుతుంది; τοῦ σκότους ను సంబంధార్థకంగా ‘చీకటిలో’ అని వ్యక్తం చేసింది.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: హృదయాల్లోని సంకల్పాలను బయలుపరుస్తాడు
  rationale: βουλαί లోని సంకల్పాలు, ఉద్దేశాలు, ఆలోచిత యోచనలు అనే విస్తృతిని ‘సంకల్పాలు’ నిలుపుతుంది; హృదయాలు అంతరంగాన్ని సూచించే మూలరూపకాన్ని కాపాడింది.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: ప్రతి ఒక్కరికీ ప్రశంస దేవుని నుండి వస్తుంది
  rationale: ప్రశంస ప్రతి వ్యక్తికి దేవుని నుండి వస్తుందనే మూలంలోని కర్త, పంపిణీ భావం, మూలాధారాన్ని నిలుపుతుంది; ‘తగిన’ వంటి మూలంలో లేని విశేషణాన్ని చేర్చలేదు.
theological_decisions:
- issue: తీర్పు యొక్క పరిధి, సమయం
  choice: ప్రభువు రాకముందు, దాగిన విషయాలు బయలుపడకముందు చేసే అకాల మానవ తీర్పును నిషేధించడం
  alternative: అన్ని సందర్భాల్లో ప్రతి విధమైన వివేచనను సంపూర్ణంగా నిషేధించడం
  rationale: నిషేధాన్ని మూలంలాగే విస్తృతంగా ఉంచినా, ‘ప్రభువు వచ్చేవరకు’ అనే కాలపరిమితి దానిని అంతిమ బయలుపరచడం మరియు మూల్యాంకనంతో అనుసంధానిస్తుంది.
- issue: ὁ κύριος యొక్క గుర్తింపు
  choice: ‘ప్రభువు’ అనే బిరుదును అనువదించి, పేరును వచనంలో చేర్చకుండా ఉంచడం
  alternative: ‘ప్రభువైన యేసు’ అని స్పష్టంగా విస్తరించడం లేదా సాధారణంగా ‘దేవుడు’ అని అనువదించడం
  rationale: పౌలు వాడుకలో ఇది సహజంగా యేసు భవిష్యదాగమనాన్ని సూచించినా, గ్రీకు వచనం కేవలం బిరుదునే ఉపయోగిస్తుంది; అందువల్ల అనువాదం దాని సంక్షిప్తతను, క్రీస్తుసంబంధ బలాన్ని కాపాడుతుంది.
- issue: ప్రతి ఒక్కరికీ ప్రశంస
  choice: మూలంలోని సానుకూలమైన ‘ప్రశంస’ను యథాతథంగా ఉంచడం
  alternative: ‘తీర్పు’ లేదా ‘ప్రతిఫలం’ అని సాధారణీకరించడం
  rationale: ἔπαινος స్పష్టంగా ప్రశంసను సూచిస్తుంది. అంతిమ మూల్యాంకనంలో ఇతర ఫలితాలు ఉండవచ్చని ఊహించి ఈ పదంలోని ఉద్దేశపూర్వక theological tension ను మార్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. వాక్యాన్ని సహజంగా చదవడానికి సెమీకోలన్ తరువాత ‘వేచి ఉండండి’ అని స్పష్టీకరించబడింది. ‘చీకటిలో దాగి ఉన్నవి,’ ‘హృదయాలు’ అనే మూల రూపకాలు నిలుపబడ్డాయి; సాంకేతిక లేదా శాఖాపరమైన పదజాలం నివారించబడింది.
