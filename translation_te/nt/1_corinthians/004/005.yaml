review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the inferential force, the prohibition of premature judging, the Lord's coming, the disclosure of hidden matters and heart-intentions, and praise from God. However, “వేచి ఉండండి” introduces an additional explicit command not present in the Greek; the temporal limit should instead modify “తీర్పు తీర్చకండి” directly. The additive καί before φωτίσει should also be represented by “కూడా.”
  naturalness: The Telugu is modern, clear, and appropriately respectful. Directly attaching “ప్రభువు వచ్చేవరకు” to the prohibition is both more concise and more faithful than splitting it into a separate command.
  terminology: “ప్రభువు,” “వెలుగులోకి తెచ్చు,” “హృదయాల్లోని సంకల్పాలు,” and “ప్రశంస” are suitable modern-standard Telugu choices. “సంకల్పాలు” adequately retains the breadth of βουλαί; the lexical footnote appropriately gives alternatives.
  issues:
  - severity: medium
    issue: “ప్రభువు వచ్చేవరకు వేచి ఉండండి” adds a separate command to wait.
    rationale: The Greek has one prohibition, “do not judge,” qualified by “until the Lord comes.” It does not independently command the audience to wait. Telugu can express the source syntax naturally by placing “ప్రభువు వచ్చేవరకు” with “తీర్పు తీర్చకండి.”
  - severity: low
    issue: The additive force of καί in “ὃς καὶ φωτίσει” is not expressed.
    rationale: Adding “కూడా” preserves the source's connective nuance without making the Telugu unnatural.
