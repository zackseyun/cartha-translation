id: 1CO.4.19
reference: 1 Corinthians 4:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: te
  text: అయితే, ప్రభువు చిత్తమైతే, నేను త్వరలోనే మీ దగ్గరకు వస్తాను; అప్పుడు గర్వంతో ఉప్పొంగిపోయినవారి మాటలను కాదు, వారి శక్తిని తెలుసుకుంటాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: అయితే నేను త్వరలోనే మీ దగ్గరికి వస్తాను
  rationale: δέ ముందున్న సందర్భంతో స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ταχέως సమీప భవిష్యత్తును తెలియజేస్తుంది; πρὸς ὑμᾶς గమ్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: ప్రభువు ఇష్టపడితే
  rationale: షరతుతో కూడిన ఈ వాక్యభాగం ప్రభువు సంకల్పంపై ఆధారపడటాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: γνώσομαι
  choice: తెలుసుకుంటాను
  rationale: సందర్శన ద్వారా అసలు పరిస్థితిని నిర్ధారించుకుంటాననే భావాన్ని ఇస్తూనే, గ్రీకు క్రియ యొక్క ప్రాథమిక అర్థానికి దగ్గరగా ఉంటుంది.
- source_word: τὸν λόγον
  choice: మాటలను
  rationale: λόγος ఇక్కడ δύναμις‌తో వ్యత్యాసంలో పలుకులు లేదా ప్రసంగాన్ని సూచిస్తుంది. ‘మాటలను’ అనేది విస్తృత అర్థాన్ని నిలుపుతూ సహజంగా ఉంటుంది.
- source_word: τῶν πεφυσιωμένων
  choice: ఉప్పొంగిపోయినవారి
  rationale: φυσιόω లోని ఉబ్బిపోవడం అనే రూపకాన్ని, గర్వంతో ఉప్పొంగిన స్థితిని సూచించేలా నిలుపుతుంది.
- source_word: τὴν δύναμιν
  choice: వారి శక్తిని
  rationale: తెలుగులో వ్యాకరణ స్పష్టత కోసం సంబంధసూచకమైన ‘వారి’ చేర్చబడింది; శక్తి స్వరూపాన్ని అద్భుతాలు, అధికారం లేదా ప్రభావం అని సంకుచితం చేయలేదు.
theological_decisions:
- issue: ὁ κύριος ఎవరిని సూచిస్తుంది
  choice: ప్రభువు
  alternative: ప్రభువైన యేసు; దేవుడు
  rationale: గ్రీకు పాఠం కేవలం ‘ప్రభువు’ అని చెబుతుంది. యేసు లేదా తండ్రి అని అనువాదంలో ప్రత్యేకంగా నిర్ణయించకుండా మూలంలోని విస్తృతిని నిలిపాం.
- issue: λόγος మరియు δύναμις మధ్య వ్యత్యాసం
  choice: మాటలు మరియు శక్తి మధ్య విస్తృత వ్యత్యాసం
  alternative: బోధ మరియు అద్భుత శక్తి మధ్య వ్యత్యాసం; వాక్చాతుర్యం మరియు అపొస్తల అధికారానికి మధ్య వ్యత్యాసం
  rationale: పౌలు ఏ నిర్దిష్ట రకమైన శక్తిని ఉద్దేశించాడో ఈ వచనం తేల్చదు. అందువల్ల భావాన్ని ఒకే సిద్ధాంతపరమైన వివరణకు పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘ఉప్పొంగిపోయినవారు’ అనే రూపకం పౌలు ఉపయోగించిన గర్వభావ చిత్రణను నిలుపుతుంది.
