id: 1CO.4.9
reference: 1 Corinthians 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: te
  text: ఎందుకంటే దేవుడు అపొస్తలులమైన మమ్మల్ని అందరికన్నా చివరివారిగా, మరణానికి నియమించబడినవారిలా[a] బహిరంగంగా ప్రదర్శించాడని నాకు అనిపిస్తోంది; ఎందుకనగా మేము లోకానికి—దేవదూతలకూ మనుషులకూ[c]—ఒక బహిరంగ ప్రదర్శనగా[b] మారాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మరణశిక్ష విధించబడినవారిలా.” గ్రీకు పదం మరణానికి నియమించబడినవారిని సూచిస్తుంది; మరణం కోసం రంగస్థలంలోకి తీసుకువచ్చిన ఖైదీల చిత్రం ఇందులో ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా “ఒక రంగస్థలంగా”; ఇక్కడ భావం అందరూ చూసే బహిరంగ దృశ్యం.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ “మనుషులు” అనే మాట పురుషులను మాత్రమే కాక, దేవదూతలకు భిన్నంగా మానవులందరినీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: ఎందుకంటే ... నాకు అనిపిస్తోంది
  rationale: δοκῶ లోని పౌలు వ్యక్తిగత అంచనాను సహజమైన తెలుగులో నిలుపుతూ, γάρ ముందున్న సందర్భంతో ఉన్న వివరణాత్మక సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: అపొస్తలులమైన మమ్మల్ని
  rationale: τοὺς ἀποστόλους అనేది ἡμᾶς‌ను వివరిస్తున్న సమానాధికార పదబంధం; పౌలు సూచిస్తున్న సమూహం అపొస్తలులేనని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐσχάτους
  choice: అందరికన్నా చివరివారిగా
  rationale: చివరి స్థానంలో, అత్యల్ప స్థాయిలో ఉంచబడినవారనే వాక్చాతుర్య బలాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπέδειξεν
  choice: బహిరంగంగా ప్రదర్శించాడు
  rationale: తరువాతి θέατρον రూపకానికి సరిపోయేలా ప్రజల ఎదుట చూపించడం లేదా ప్రదర్శించడం అనే భావాన్ని అందిస్తుంది.
- source_word: ὡς ἐπιθανατίους
  choice: మరణానికి నియమించబడినవారిలా
  rationale: మరణించేందుకు నిర్ణయించబడిన లేదా మరణశిక్షకు గురైన వ్యక్తుల భావాన్ని నిలుపుతుంది; రంగస్థలంలో మరణానికి నెట్టబడిన ఖైదీల చిత్రం కూడా ఇందులో సూచితం కావచ్చు.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు కారణం లేదా వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: θέατρον ἐγενήθημεν
  choice: ఒక బహిరంగ ప్రదర్శనగా మారాం
  rationale: θέατρον‌ను కేవలం రంగస్థల భవనంగా కాక, అందరూ చూసే దృశ్యం లేదా spectacle అనే రూపకార్థంలో సహజంగా అందిస్తుంది.
- source_word: τῷ κόσμῳ
  choice: లోకానికి
  rationale: అపొస్తలులు ఎవరి ఎదుట ప్రదర్శనగా ఉన్నారో సూచించే దత్తివును సంక్షిప్తంగా నిలుపుతుంది.
- source_word: καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: దేవదూతలకూ మనుషులకూ
  rationale: పరలోక జీవులు మరియు మానవులు అనే సమగ్ర ప్రేక్షక సమూహాన్ని, రెండు καί పదాల సమన్వయ బలంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀγγέλοις అనే పదం యొక్క అర్థం
  choice: అపొస్తలుల అవమానకరమైన బహిరంగ స్థితిని చూస్తున్న పరలోక జీవులైన దేవదూతలు
  alternative: సాధారణ అర్థంలో సందేశకులు
  rationale: κόσμος మరియు ἀνθρώποις‌తో కలిసి వచ్చిన సందర్భంలో, ఇది మానవ సందేశకులకన్నా పరలోక దేవదూతలను సూచించడం సహజం; మూలపాఠానికి మించిన సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని ఉపయోగించాం. రంగస్థల రూపకాన్ని సహజంగా వినిపించేలా ప్రధాన పాఠంలో “బహిరంగ ప్రదర్శన”గా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం. రెండు γάρ/ὅτι సంబంధాలను వాక్య విభజనతో స్పష్టంగా చూపించాం.
