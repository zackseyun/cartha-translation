  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: te
  text: 'మెస్సీయ నిమిత్తం[a] మేము మూర్ఖులం, కాని మెస్సీయలో[b] మీరు జ్ఞానులు; మేము బలహీనులం, కాని మీరు బలవంతులు; మీరు గౌరవనీయులు[c], కాని మేము అవమానితులం.


    [a] “మెస్సీయ నిమిత్తం” అనే మాటకు “మెస్సీయ కారణంగా” లేదా “మెస్సీయ కొరకు” అని కూడా అర్థం కావచ్చు.


    [b] “మెస్సీయలో” అనే మాటను “క్రీస్తులో” అని కూడా అనువదించవచ్చు.


    [c] ఇక్కడ “గౌరవనీయులు,” “అవమానితులం” అనే మాటలు కేవలం మనసులోని భావాలను కాక, ఇతరుల దృష్టిలో ఉన్న గౌరవం లేదా అవమానంతో కూడిన సామాజిక స్థితిని సూచిస్తున్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మెస్సీయ నిమిత్తం” అనే మాటకు “మెస్సీయ కారణంగా” లేదా “మెస్సీయ కొరకు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మెస్సీయలో” అనే మాటను “క్రీస్తులో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ “గౌరవనీయులు,” “అవమానితులం” అనే మాటలు కేవలం మనసులోని భావాలను కాక, ఇతరుల దృష్టిలో ఉన్న గౌరవం లేదా అవమానంతో కూడిన సామాజిక స్థితిని సూచిస్తున్నాయి.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: మూర్ఖులం
  rationale: కొరింథీయుల స్వీయ అంచనాకు వ్యంగ్యంగా ఎదురుగా నిలిచే పదునైన నామవాచక భావాన్ని, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: διὰ Χριστόν
  choice: మెస్సీయ నిమిత్తం
  rationale: διά + accusative సూచించగల కారణం లేదా నిమిత్తం అనే భావాలను తెలుగులో సహజంగా, ఉద్దేశపూర్వకంగా అస్పష్టంగానే ఉంచుతుంది.
- source_word: φρόνιμοι
  choice: జ్ఞానులు
  rationale: ‘మూర్ఖులు’ అనే పదానికి నేరుగా వ్యతిరేకంగా ఉండి, వాక్యంలోని వ్యంగ్య సమాంతరతను కాపాడుతుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: పౌలు తరచుగా వాడే ἐν Χριστῷ నిర్మాణాన్ని వ్యాఖ్యానాత్మకంగా విప్పకుండా ‘లో’ అనే సంబంధంతో నిలుపుతుంది.
- source_word: ἀσθενεῖς
  choice: బలహీనులం
  rationale: శారీరక, సామాజిక లేదా ప్రభావపరమైన బలహీనతను అతిగా నిర్దిష్టం చేయకుండా విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: ἰσχυροί
  choice: బలవంతులు
  rationale: ‘బలహీనులు’కు సహజమైన వ్యతిరేక పదంగా వాక్య సమాంతరతను నిలుపుతుంది.
- source_word: ἔνδοξοι
  choice: గౌరవింపబడుతున్నారు
  rationale: ఈ సందర్భంలో బాహ్య మహిమకన్నా ప్రజల మధ్య లభించే ఘనత, ఉన్నత స్థానం ప్రధానంగా ఉన్నందున సహజ తెలుగు కర్మణి రూపం ఎంచుకోబడింది.
- source_word: ἄτιμοι
  choice: అవమానింపబడుతున్నాం
  rationale: ἔνδοξοιకి వ్యతిరేకంగా ప్రజల దృష్టిలో అవమానం, హీనస్థితి అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἡμεῖς / ὑμεῖς
  choice: మేము / మీరు
  rationale: గ్రీకులో స్పష్టంగా పలికిన సర్వనామాల నొక్కిచెప్పే శక్తిని, అపొస్తలులు—కొరింథీయులు అనే వ్యంగ్య వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: Χριστός పదానికి అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός బిరుదు భావాన్ని కలిగి ఉండగా, ‘మెస్సీయ’ ఆ బిరుదును స్పష్టంగా నిలుపుతుంది; తెలుగు క్రైస్తవ వాడుకలోని ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- issue: διὰ Χριστόνలో కారణం లేదా ఉద్దేశం
  choice: మెస్సీయ నిమిత్తం
  alternative: మెస్సీయ కారణంగా / మెస్సీయ కొరకు
  rationale: గ్రీకు నిర్మాణం కారణం మరియు ‘కొరకు’ అనే భావాల్లో ఏదో ఒకదానిని ఖచ్చితంగా నిర్బంధించదు; ప్రధాన పాఠం ఆ భావ విస్తృతిని కాపాడి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని మూడు వ్యంగ్య విరుద్ధ జంటలు, స్పష్ట సర్వనామాల నొక్కిచెప్పడం, పునరావృత వ్యతిరేక నిర్మాణం నిలుపబడ్డాయి.
