revisions:
- from: 'కాబట్టి మిమ్మల్ని వేడుకుంటున్నాను: నన్ను అనుకరించేవారిగా అవ్వండి.[a][b]'
  to: 'కాబట్టి, మిమ్మల్ని కోరుతున్నాను: నన్ను అనుకరించేవారిగా అవ్వండి.[a][b]'
  rationale: The revision replaces a potentially over-pleading expression with a natural Telugu equivalent for Paul's earnest exhortational appeal. All other wording and both correctly anchored footnotes are retained, with only a stylistic neutralization in footnote b.
