id: 1CO.4.16
reference: 1 Corinthians 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παρακαλῶ οὖν ὑμᾶς, μιμηταί μου γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/016.yaml
  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: te
  text: 'కాబట్టి, మిమ్మల్ని కోరుతున్నాను: నన్ను అనుకరించేవారిగా అవ్వండి.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను అనుకరించేవారిగా ఉండండి.”
    reason: γίνεσθεను సందర్భానుసారం ‘అవ్వండి’ లేదా ‘ఉండండి’ అని వ్యక్తపరచవచ్చు.
  - marker: b
    text: మరోచోట పౌలు, “నేను క్రీస్తును అనుకరిస్తున్నట్లే, మీరు నన్ను అనుకరించండి” అని చెబుతున్నాడు (1 కొరింథీయులు 11:1).
    reason: ఈ ఆజ్ఞకు సంబంధించిన విస్తృత క్రీస్తు-కేంద్ర సందర్భాన్ని సూచించే సమాంతర వాక్యం.
lexical_decisions:
- source_word: παρακαλῶ
  choice: వేడుకుంటున్నాను
  rationale: ఇక్కడ παρακαλῶ ఆదరణకన్నా హృదయపూర్వకమైన విజ్ఞప్తి, ప్రోత్సాహంతో కూడిన ఉపదేశం అనే భావాన్ని కలిగిస్తుంది. ఆధునిక తెలుగులో ‘వేడుకుంటున్నాను’ ఆ గంభీరమైన విజ్ఞప్తి స్వరాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: οὖν ముందున్న వాదననుంచి వచ్చే నిర్ధారణను సూచిస్తుంది; ‘కాబట్టి’ ఆ తార్కిక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: ఇది παρακαλῶకు బహువచన ప్రత్యక్ష కర్మ. ‘మిమ్మల్ని’ తెలుగులో ఆ సంఖ్యను, వ్యాకరణ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: μιμηταί
  choice: అనుకరించేవారిగా
  rationale: μιμητής మరొకరి జీవన నమూనాను అనుసరించి ప్రవర్తించే వ్యక్తిని సూచిస్తుంది. ‘అనుకరించేవారు’ అనేది ‘వెంబడించేవారు’ కంటే మూలపదానికి మరింత ప్రత్యక్షమైన సమానార్థకం.
- source_word: μου
  choice: నన్ను
  rationale: గ్రీకులో షష్ఠీ విభక్తి రూపం μιμηταίతో కలిసి ‘నన్ను అనుకరించేవారు’ అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘నన్ను’ అనే కర్మరూపం సహజమైన నిర్మాణం.
- source_word: γίνεσθε
  choice: అవ్వండి
  rationale: γίνομαι యొక్క వర్తమాన ఆజ్ఞారూపం ఒక స్థితిలోకి రావడం లేదా దానిని స్వీకరించడం అనే భావాన్ని ఇస్తుంది. అందువల్ల కేవలం ‘ఉండండి’ కంటే ‘అవ్వండి’ మూలంలోని గతిశీలతను మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: పౌలు తనను అనుకరించమని నేరుగా కోరడం, విస్తృత క్రీస్తు-కేంద్ర సందర్భం లేకుండా చదివితే అతిశయంగా అనిపించవచ్చు.
  choice: ‘నన్ను అనుకరించేవారిగా అవ్వండి’ అని వాక్యంలోని ప్రత్యక్ష ఆజ్ఞను యథాతథంగా నిలుపడం.
  alternative: ‘నా మాదిరిని అనుసరించండి’ అని మృదువుగా చెప్పడం.
  rationale: గ్రీకు పాఠం పౌలునే తక్షణ ఆదర్శంగా స్పష్టంగా పేర్కొంటుంది. ప్రధాన వాక్యంలో దానిని మృదువుపరచకుండా, 1 కొరింథీయులు 11:1లోని క్రీస్తు-కేంద్ర వివరణను పాదసూచికలో ఇవ్వడం మూలంలోని వేదాంత ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ఉపదేశ స్వరం ఉపయోగించబడింది. ‘అనుకరించేవారిగా అవ్వండి’ కొద్దిగా ఉద్దేశపూర్వకమైన నిర్మాణమైనా, μιμηταί మరియు γίνεσθε రెండింటి భావాన్ని వేరువేరుగా నిలుపుతుంది. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో [a], [b]గా చేర్చబడ్డాయి.
