  language: en
  yaml_path: translation/nt/1_corinthians/014/013.yaml
  text: Therefore[b][a], the one who speaks in a tongue should pray that he may interpret.
translation:
  language: te
  text: కాబట్టి, భాషలో[a] మాట్లాడే వ్యక్తి అర్థవివరణ చేయగలిగేలా ప్రార్థించాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా “నాలుకలో.” ఈ అధ్యాయంలో అర్థవివరణ అవసరమయ్యే పలుకును సూచించడానికి ఈ పదం సాధారణంగా వాడబడింది. “ఒక భాషలో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో, “అతడు అర్థవివరణ చేయునట్లు.” ఇక్కడ ఏకవచన పుంలింగ రూపం భాషలో మాట్లాడే ఎవరినైనా ప్రతినిధిగా సూచిస్తుంది.
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: Διὸ
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి తీసుకొచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ λαλῶν
  choice: మాట్లాడే వ్యక్తి
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతంలోని సాధారణ ఏకవచన భావాన్ని నిలుపుతూ, ఇది పురుషులకు మాత్రమే పరిమితమన్న భావం కలగకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: γλώσσῃ
  choice: భాషలో
  rationale: ఈ అధ్యాయంలో అర్థవివరణ అవసరమయ్యే మాటను సూచిస్తుంది. ‘అన్యభాష’ అని మూలంలో లేని ‘అన్య’ భావాన్ని చేర్చకుండా, ‘నాలుకలో’ అనే అసహజమైన పదశః రూపాన్ని తప్పిస్తుంది; గ్రీకు పదంలోని విస్తృతిని పాదసూచికలో నిలుపుతుంది.
- source_word: προσευχέσθω
  choice: ప్రార్థించాలి
  rationale: మూడవ పురుష ఏకవచన వర్తమాన ఆజ్ఞార్థకంలోని ఉపదేశాత్మక బలాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἵνα
  choice: గలిగేలా
  rationale: ప్రార్థన యొక్క ఉద్దేశాన్ని తెలిపే ἵνα భావాన్ని తెలుగు ప్రయోజనార్థక నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: διερμηνεύῃ
  choice: దాని అర్థాన్ని తెలియజేయగలిగేలా
  rationale: సభకు అర్థంకాని మాటను అర్థమయ్యేలా చేయడం అనే సందర్భానుసార భావాన్ని అందిస్తుంది; ‘అనువదించు’ అని పరిమితం చేయదు, ‘వివరించు’ అని అతిగా విస్తరించదు.
theological_decisions:
- issue: γλώσσῃ యొక్క స్వభావం
  choice: భాషలో
  alternative: నాలుకతో; అన్యభాషలో
  rationale: ఇది సాధారణ మానవ భాషా, పారవశ్యమైన పలుకా, లేక మరింత విస్తృతమైన ఆత్మీయ వరమా అనే చర్చను మూలపాఠం ఇక్కడ తేల్చదు. ప్రధాన పాఠం సహజంగా ఉండేలా చేసి, అర్థవివరణ అవసరమయ్యే పలుకు అనే సందర్భాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: గ్రీకు సాధారణ పుంలింగ ఏకవచనం
  choice: మాట్లాడే వ్యక్తి … అర్థాన్ని తెలియజేయగలిగేలా
  alternative: మాట్లాడేవాడు … అతడు అర్థం చెప్పేలా
  rationale: గ్రీకు రూపాలు వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా, అవి భాషలో మాట్లాడే ఎవరినైనా ప్రతినిధిగా సూచిస్తాయి. తెలుగు రూపం ఏకవచనాన్ని నిలుపుతూ అనవసరమైన లింగ పరిమితిని విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘ ఆరాధన సందర్భానికి తగిన గౌరవప్రదమైన సరళ శైలి. ‘అన్యభాష’ వంటి వ్యాఖ్యానాత్మక పదాన్ని చేర్చకుండా, మూలంలోని అస్పష్టతను పాదసూచికతో కాపాడింది.
