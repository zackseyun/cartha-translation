  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: te
  text: ఇద్దరు లేదా ముగ్గురు ప్రవక్తలు మాట్లాడాలి; మిగిలినవారు చెప్పబడినదానిని వివేచించాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “తీర్పు చెప్పాలి,” “పరిశీలించాలి,” లేదా “మదింపు చేయాలి.” గ్రీకు క్రియ ఇక్కడ ప్రవచనాత్మకంగా చెప్పబడిన మాటను పరీక్షించి అంచనా వేయడాన్ని సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: ప్రవక్తలు
  rationale: ఈ నామవాచకం ప్రవక్తలను లేదా ప్రవచనాత్మకంగా మాట్లాడేవారిని సూచిస్తుంది. ‘ప్రవక్తలు’ అనేది నేరుగా, సందర్భానికి తగిన అనువాదం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప విషయాంతరాన్ని సూచిస్తుంది. తెలుగులో అర్ధవిరామంతో సూచనల ప్రవాహాన్ని సహజంగా ఉంచవచ్చు; ‘కాని’ అని అనువదిస్తే మూలంలో లేని బలమైన వ్యతిరేక భావం రావచ్చు.
- source_word: δύο ἢ τρεῖς
  choice: ఇద్దరు లేదా ముగ్గురు
  rationale: వ్యక్తులను లెక్కించే సహజమైన తెలుగు రూపంలో మూలంలోని సంఖ్యా వ్యక్తీకరణను నేరుగా నిలిపింది.
- source_word: λαλείτωσαν
  choice: మాట్లాడాలి
  rationale: మూడవ పురుష బహువచన ఆజ్ఞార్థక క్రియలోని నిర్దేశక బలాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οἱ ἄλλοι
  choice: మిగిలినవారు
  rationale: వీరు ఇతర ప్రవక్తలా, సంఘ నాయకులా, లేక కూడివచ్చిన ఇతరులా అన్నది మూలపాఠం స్పష్టంగా చెప్పదు. ‘మిగిలినవారు’ ఆ అనిశ్చితిని నిలుపుతుంది.
- source_word: διακρινέτωσαν
  choice: చెప్పబడినదాన్ని పరిశీలించి నిర్ణయించాలి
  rationale: ఈ సందర్భంలో క్రియ ప్రవచనాత్మక మాటను జాగ్రత్తగా పరీక్షించి దాని గురించి నిర్ణయించడాన్ని సూచిస్తుంది. ఈ రూపం కేవలం ఖండించే న్యాయతీర్పు భావాన్ని నివారిస్తూ, మూలంలోని మదింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మిగిలినవారు’ ఎవరు?
  choice: వారిని ‘మిగిలినవారు’ అని సాధారణంగానే పేర్కొంది.
  alternative: ‘మిగిలిన ప్రవక్తలు’ లేదా ‘సంఘంలోని మిగిలినవారు’ అని నిర్దిష్టం చేయడం.
  rationale: గ్రీకు పాఠం ఆ గుంపును స్పష్టంగా నిర్వచించదు. కాబట్టి సంఘవ్యవస్థకు సంబంధించిన ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని అనువాదంలో చేర్చకుండా మూలంలోని సందిగ్ధతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘంలో బహిరంగంగా చదవడానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. ఆజ్ఞార్థక భావానికి ‘మాట్లాడాలి,’ ‘నిర్ణయించాలి’ అనే సహజ నిర్దేశక రూపాలు వాడబడ్డాయి.
