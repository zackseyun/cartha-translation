id: 1CO.14.33
reference: 1 Corinthians 14:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: te
  text: ఎందుకంటే దేవుడు అస్తవ్యస్తతకు దేవుడు కాదు, శాంతికి దేవుడు; పరిశుద్ధుల సంఘాలన్నిటిలో ఉన్నట్లే.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు గందరగోళానికి దేవుడు కాదు, శాంతికి దేవుడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుని పరిశుద్ధ ప్రజల సంఘాలన్నిటిలో ఉన్నట్లే.” కొందరు ఈ పదబంధాన్ని ఈ వచనంతో కాకుండా తరువాతి వచనంతో కలిపి చదువుతారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: అస్తవ్యస్తత
  rationale: సంఘ ఆరాధనలో క్రమం లేకపోవడాన్ని సూచించే సందర్భానికి ఇది సహజంగా సరిపోతుంది; కేవలం మానసిక గందరగోళం అనే అర్థానికి పరిమితం చేయదు.
- source_word: εἰρήνης
  choice: శాంతి
  rationale: ἀκαταστασίαకు వ్యతిరేకంగా సంఘంలో క్రమబద్ధమైన ప్రశాంతత, సామరస్యాన్ని తెలిపే ప్రామాణిక తెలుగు పదం.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: నిర్దిష్టమైన, వ్యక్తిగతమైన దేవుణ్ణి సూచిస్తూ ఆధునిక తెలుగు వాడుకకు అనుగుణంగా ఉంది.
- source_word: ὡς
  choice: ఉన్నట్టే
  rationale: అన్ని సంఘాల్లో కనిపించే సాధారణ స్థితితో పోలికను వ్యక్తం చేస్తుంది; అయితే ఈ పదబంధం తరువాతి వచనంతో కలిసే అవకాశాన్ని పాదసూచనలో ఉంచాం.
- source_word: ἐκκλησίαις
  choice: సంఘాలు
  rationale: స్థానిక క్రైస్తవ సమూహాలకు పౌలు వాడే ἐκκλησίαకు స్థిరపడిన, సహజమైన తెలుగు సమానం.
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధుల
  rationale: విశ్వాసులకు పౌలు వాడే సాధారణ సంబోధనతో ఉన్న పదసంబంధాన్ని నిలుపుతుంది; వివరణాత్మక ప్రత్యామ్నాయం పాదసూచనలో ఇవ్వబడింది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందున్న క్రమబద్ధమైన సభా ప్రవర్తనకు ఈ వాక్యం కారణాన్ని ఇస్తోందని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων అనే పదబంధం దేనితో అనుసంధానమవుతుంది?
  choice: 33వ వచనంలోని దేవుని శాంతి స్వభావం, సంఘ క్రమం గురించిన వాక్యంతో అనుసంధానం
  alternative: తదుపరి వచనంతో కలిపి, సంఘాల్లో ప్రవర్తన గురించి కొత్త వాక్యానికి ఆరంభంగా చదవడం
  rationale: ఇచ్చిన SBLGNT విరామచిహ్నాలు ఈ పదబంధాన్ని 33వ వచనంతో కలుపుతున్నాయి. అయినా గ్రీకు వాక్యనిర్మాణంలో అనుసంధానం వివాదాస్పదం కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచనలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కర్త’ అనే పదం గ్రీకులో సూచితంగా ఉన్న ‘దేవుడు అస్తవ్యస్తతకు చెందినవాడు కాదు, శాంతికి చెందినవాడు’ అనే నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ప్రధాన పాఠంలో [a], [b] గుర్తులు రెండూ చేర్చబడ్డాయి.
