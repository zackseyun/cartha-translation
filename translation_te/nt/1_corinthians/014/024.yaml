id: 1CO.14.24
reference: 1 Corinthians 14:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: te
  text: అయితే అందరూ ప్రవచిస్తే, విశ్వసించని వ్యక్తి లేదా అవగాహన లేని వ్యక్తి ఎవరైనా లోపలికి వస్తే, అందరివల్ల అతనికి దోషబోధ కలుగుతుంది; అందరిచేత అతడు పరిశీలించబడతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντες
  choice: అందరూ
  rationale: సమావేశంలో ప్రవచించే వారందరినీ సూచించే సమగ్ర పరిమాణార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: προφητεύωσιν
  choice: ప్రవచిస్తుండగా
  rationale: ఈ అధ్యాయమంతటా పౌలు ఉపయోగించే ప్రవచనానికి సంబంధించిన స్థిరమైన భావవర్గాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἄπιστος
  choice: విశ్వసించని వ్యక్తి
  rationale: ఇక్కడ ఇది నమ్మకద్రోహిని కాక, విశ్వాసం లేని వ్యక్తిని సూచిస్తుంది.
- source_word: ἰδιώτης
  choice: అవగాహన లేని వ్యక్తి
  rationale: సమావేశంలో జరిగే వాటి గురించి తగిన అవగాహన లేదా పరిచయం లేని వ్యక్తి అనే భావాన్ని ఇస్తుంది; ఆధునిక సంఘపరమైన ‘సామాన్యుడు’ వంటి భావాన్ని రుద్దదు.
- source_word: ἐλέγχεται
  choice: అతని తప్పు బయటపడుతుంది
  rationale: విన్న ప్రవచనాల ద్వారా ఆ వ్యక్తి నైతిక స్థితి బహిర్గతమై అతనికి దోషబోధ కలిగే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; కేవలం తుది తీర్పు అనే భావాన్ని రుద్దదు.
- source_word: ἀνακρίνεται
  choice: అతడు పరిశీలించబడతాడు
  rationale: నిశితంగా పరీక్షించడం లేదా విచారించడం అనే అర్థాన్ని నిలుపుతుంది; తుది శిక్షాతీర్పు అనే అతిశయార్థాన్ని నివారిస్తుంది.
- source_word: ὑπὸ πάντων
  choice: అందరిచేత
  rationale: గ్రీకులో రెండుసార్లు వచ్చిన పదబంధపు వాక్చాతుర్య పునరుక్తిని తెలుగులోనూ నిలుపుతుంది.
- source_word: δέ
  choice: అయితే
  rationale: మునుపటి పరిస్థితితో ఉన్న వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది; రెండవ δέ తెలుగు వాక్యనిర్మాణంలో ప్రత్యేక సంధానపదం లేకుండానే ప్రతిఫలిస్తుంది.
- source_word: τις
  choice: ఎవరైనా
  rationale: వ్యక్తి ఎవరో నిర్దిష్టంగా చెప్పని గ్రీకు అనిర్దిష్టతను సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: సమావేశ సందర్భంలో ἰδιώτης అర్థం
  choice: అవగాహన లేని వ్యక్తి
  alternative: బయటివాడు; నేర్చుకోని వ్యక్తి; సామాన్యుడు
  rationale: సమీప సందర్భం మాటల గ్రాహ్యతను, సమావేశపు ఆచారాలపై అవగాహన లేని వ్యక్తిపై వాటి ప్రభావాన్ని ప్రాధాన్యంగా చూపుతుంది. ఈ అనువాదం అతడు పూర్తిగా క్రైస్తవ సమాజానికి వెలుపలివాడేనని నిర్ణయించదు; ‘బయటివాడు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యంలోని షరతు నిర్మాణం, ‘అందరిచేత’ అనే పునరుక్తి, ἰδιώτης పదంలోని సందర్భానుసారమైన సందిగ్ధత నిలుపబడ్డాయి.
