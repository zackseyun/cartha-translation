id: 1CO.14.22
reference: 1 Corinthians 14:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: te
  text: కాబట్టి, భాషలు[a] విశ్వసించేవారికి కాదు, అవిశ్వాసులకు ఒక సూచనగా[b] ఉన్నాయి; అయితే ప్రవచనం అవిశ్వాసులకు కాదు, విశ్వసించేవారికి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నాలుకలు’ అని కూడా అనువదించవచ్చు. అయితే 1 కొరింథీయులు 12–14లో γλῶσσαι అనే పదం పౌలు ఉపయోగించే స్థిరమైన పరిభాష; ఇది విదేశీ భాషలా లేదా ఇతర రకమైన ఉచ్చారణలా అనే వివాదాస్పద విషయాన్ని అనువాదం నిర్ణయించదు.
    reason: lexical_alternative
  - marker: b
    text: ముందటి వచనాల్లో ఉదహరించిన యెషయా 28:11–12 దృష్ట్యా, ఇక్కడి ‘సూచన’ను కొందరు తీర్పు సూచనగా అర్థం చేసుకుంటారు.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γλῶσσαι
  choice: భాషలు
  rationale: γλῶσσαι యొక్క ప్రాథమిక అర్థాన్ని ఉంచుతూ, అవి విదేశీ భాషలా లేక ప్రత్యేక ఆత్మీయ ఉచ్చారణలా అన్న వివాదాన్ని ప్రధాన పాఠ్యంలో పరిష్కరించదు.
- source_word: εἰς σημεῖόν
  choice: సూచనగా
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచించే εἰς నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς πιστεύουσιν
  choice: విశ్వసించేవారికి
  rationale: క్రియాత్మక భావమున్న substantival participle ను స్పష్టంగా నిలుపుతుంది.
- source_word: τοῖς ἀπίστοις
  choice: అవిశ్వాసులకు
  rationale: విశ్వసించేవారితో ఉన్న ప్రత్యక్ష వ్యత్యాసాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: προφητεία
  choice: ప్రవచనం
  rationale: ఈ అధ్యాయంలో సూచించిన ప్రవచన వరం లేదా కార్యానికి స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: δὲ
  choice: అయితే
  rationale: భాషలు మరియు ప్రవచనం మధ్య వ్యత్యాసాన్ని సహజంగా చూపిస్తుంది.
theological_decisions:
- issue: కరిస్మాటిక్ సందర్భంలో γλῶσσαι అర్థం
  choice: భాషలు అని అనువదించి, గమనికలో ‘నాలుకలు’ అనే సంప్రదాయ ప్రత్యామ్నాయాన్ని ఇచ్చాం.
  alternative: విదేశీ భాషలు; ఆవేశపూరిత లేదా ఆత్మీయ ఉచ్చారణలు
  rationale: గ్రీకు పదం స్వయంగా ఈ వివాదాస్పద స్వరూపాన్ని ఖచ్చితంగా నిర్ణయించదు; అందువల్ల ప్రధాన పాఠ్యం ఏ ప్రత్యేక సిద్ధాంతాన్నీ దిగుమతి చేయదు.
- issue: అవిశ్వాసులకు σημεῖον యొక్క భావం
  choice: తటస్థంగా ‘సూచన’ అని ఉంచాం.
  alternative: నిర్ధారించే సూచన; తీర్పు సూచన
  rationale: ముందున్న యెషయా ఉదాహరణ వల్ల తీర్పు భావం సాధ్యమైనా, ఈ వాక్యంలోని గ్రీకు కేవలం ‘సూచన’ అని మాత్రమే చెబుతుంది.
- issue: ప్రవచనం విశ్వాసులకు ఉండడంలోని వాక్య నిర్మాణం
  choice: ‘విశ్వసించేవారికి ఉంది’ అని మూలంలోని సంక్షిప్త సమాంతర నిర్మాణాన్ని నిలిపాం.
  alternative: విశ్వసించేవారికి సూచనగా ఉంది
  rationale: రెండవ భాగంలో εἰς σημεῖον పదాలు ప్రత్యక్షంగా పునరావృతం కావు; వాటిని చేర్చడం భావాన్ని అతిగా నిర్దిష్టం చేయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని వ్యత్యాసం మరియు సమాంతరతను నిలుపుతూ, వివాదాస్పద అంశాలను ప్రధాన పాఠ్యంలో నిర్ణయించకుండా గమనికల్లో వివరించాం.
