translation:
  language: te
  text: అయితే సమస్తమూ సముచితంగా, క్రమపద్ధతిలో జరగాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సముచితంగా” అనే పదానికి “తగిన విధంగా” అని కూడా అనువదించవచ్చు; గ్రీకు పదం సందర్భానికి తగినది లేదా మర్యాదకరమైనది అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: సమస్తమూ
  rationale: నపుంసక బహువచన రూపం విస్తృత పరిధిని సూచిస్తుంది; సందర్భంలోని సంఘ ఆరాధనకు సంబంధించిన కార్యాలన్నిటినీ సహజంగా కలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి చర్చ నుంచి సారాంశ ఆదేశానికి వచ్చే స్వల్ప వ్యత్యాసాన్ని లేదా మలుపును తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: εὐσχημόνως
  choice: సముచితంగా
  rationale: తగినదిగా, మర్యాదకరంగా, సందర్భోచితంగా ఉండే ప్రవర్తనను సూచిస్తుంది; మూలపదంలోని విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: κατὰ τάξιν
  choice: క్రమపద్ధతిలో
  rationale: సరైన అమరిక లేదా వరుసకు అనుగుణంగా జరగడాన్ని సూచిస్తుంది; కేవలం నిశ్శబ్దం అనే భావాన్ని చేర్చకుండా క్రమబద్ధతను వ్యక్తం చేస్తుంది.
- source_word: γινέσθω
  choice: జరగాలి
  rationale: మూడవ పురుష ఆజ్ఞార్థక బలాన్ని తెలుగులో సహజమైన విధ్యర్థక రూపంతో వ్యక్తం చేస్తుంది; సమస్తమూ ఎలా నిర్వహించబడాలో సాధారణ నిర్దేశంగా నిలుస్తుంది.
theological_decisions:
- issue: సంఘ ఆరాధన సందర్భంలో ఆదేశపు పరిధి
  choice: సమావేశంలో జరిగే కార్యాలు సముచితంగా, క్రమపద్ధతిలో జరగాలనే సాధారణ నిర్దేశం
  alternative: స్థిరమైన ఒక ప్రత్యేక ఆరాధనా క్రమాన్ని విధించే సన్నని నియమం; లేదా తక్షణ సందర్భాన్ని దాటి సంఘ జీవితమంతటికీ నేరుగా వర్తించే సూత్రం
  rationale: ఈ వాక్యం సంఘ సమావేశంలో మాటలాడటం, ప్రవచించడం, భాషలు మాట్లాడటం గురించి జరిగిన చర్చను సారాంశపరుస్తుంది. మూలంలోని సాధారణతను నిలుపుతూ ఏ ప్రత్యేక సంఘ సంప్రదాయాన్నీ అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. సంక్షిప్త ఆజ్ఞాత్మక వాక్య స్వరాన్ని నిలిపి, ఏ ప్రత్యేక సంఘ ఆరాధనా విధానాన్నీ సూచించలేదు.
