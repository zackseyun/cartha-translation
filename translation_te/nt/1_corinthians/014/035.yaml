id: 1CO.14.35
reference: 1 Corinthians 14:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: te
  text: అయితే వారు ఏదైనా నేర్చుకోవాలనుకుంటే, ఇంట్లో తమ సొంత భర్తలను అడగాలి. ఎందుకంటే ఒక స్త్రీ[a] సంఘసమావేశంలో[b] మాట్లాడడం సిగ్గుచేటు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక భార్య.’ గ్రీకు పదానికి సందర్భానుసారం ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థం రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సంఘంలో’ లేదా ‘సభలో’; గ్రీకు పదం కూడివచ్చిన విశ్వాసుల సమాజాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: తెలుసుకోవడం
  rationale: ఈ సందర్భంలో నేర్చుకోవడం లేదా తెలుసుకోవడం అనే భావం ఉంది. ప్రశ్నించడం ద్వారా విషయం తెలుసుకోవాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘తెలుసుకోవడం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν οἴκῳ
  choice: ఇంట్లో
  rationale: సమకూడిన సంఘానికి భిన్నమైన గృహపరిస్థితిని సహజంగా సూచించే తెలుగు ప్రయోగం.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: తమ సొంత భర్తలను
  rationale: ἄνδρας అనే పదానికి ‘పురుషులు’ లేదా ‘భర్తలు’ అనే అర్థాలు ఉండవచ్చు. ἰδίους (‘తమ సొంత’) మరియు ఇంటి సందర్భం వల్ల ఇక్కడ వైవాహిక అర్థమైన ‘భర్తలు’ అత్యంత సహజం.
- source_word: ἐπερωτάτωσαν
  choice: అడగాలి
  rationale: మూలంలోని ఆజ్ఞార్థక బలాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: αἰσχρὸν
  choice: సిగ్గుచేటు
  rationale: సామాజికంగా అవమానకరమైన లేదా సిగ్గుకరమైనదనే పదబలాన్ని సంక్షిప్తమైన, ప్రస్తుత తెలుగు పదం నిలుపుతుంది.
- source_word: γυναικὶ
  choice: ఒక స్త్రీ
  rationale: γυνή సందర్భానుసారం ‘స్త్రీ’ లేదా ‘భార్య’ అని అర్థం కావచ్చు. ప్రధాన పాఠంలో సాధారణ అర్థమైన ‘స్త్రీ’ని ఉంచి, వైవాహిక అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
- source_word: λαλεῖν
  choice: మాట్లాడడం
  rationale: మూలంలోని విస్తృతమైన ‘మాట్లాడు’ అనే భావాన్ని నిలుపుతుంది; ప్రసంగ రకాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: ἐν ἐκκλησίᾳ
  choice: సంఘసమావేశంలో
  rationale: ἐκκλησία ఇక్కడ కూడివచ్చిన సమాజాన్ని సూచిస్తుంది. ‘సంఘసమావేశం’ స్థలం లేదా సంస్థ కంటే సమకూడిన సభ అనే సందర్భాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: సంఘసమావేశంలో స్త్రీ మాట్లాడడంపై వాక్యంలోని నిషేధ పరిధి
  choice: మూలంలో ఉన్నట్లే ‘మాట్లాడడం’ అని అనువదించి, ప్రధాన పాఠంలో దానిని ఒక నిర్దిష్టమైన మాటల రకానికి పరిమితం చేయలేదు.
  alternative: దీనిని అంతరాయం కలిగించే ప్రశ్నలకు, ప్రవచనాలను పరిశీలించడానికి మాత్రమే పరిమితం చేయడం, లేదా కొరింథీయుల అభిప్రాయానికి ఉద్ధరణగా భావించడం.
  rationale: గ్రీకు వాక్యం ఇక్కడ మాటల నిర్దిష్ట రకాన్ని స్వయంగా పేర్కొనదు. అందువల్ల వ్యాఖ్యానంతో ఉద్రిక్తతను ముందే పరిష్కరించకుండా మూలంలోని విస్తృత పదప్రయోగాన్ని నిలిపాం.
- issue: γυνή/ἀνήρ పదజంటను స్త్రీ/పురుషుడు గానా, భార్య/భర్త గానా అనువదించాలి?
  choice: ἄνδρας‌ను ‘భర్తలు’గా, γυναικὶ‌ను ప్రధాన పాఠంలో ‘స్త్రీ’గా అనువదించి, ‘భార్య’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
  alternative: అన్నిచోట్లా ‘భార్య/భర్త’గా లేదా ‘స్త్రీ/పురుషులు’గా అనువదించడం.
  rationale: ‘తమ సొంత’ అనే విశేషణం మరియు ఇంటి సందర్భం ἄνδρας‌కు ‘భర్తలు’ అనే అర్థాన్ని బలపరుస్తాయి. అయితే γυναικὶ సాధారణంగా ‘స్త్రీ’ అని లేదా సందర్భానుసారం ‘భార్య’ అని అర్థం కావచ్చు; అందువల్ల ఆ నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘సంఘసమావేశం’ అనే పదం సంస్థ లేదా భవనం కంటే కూడివచ్చిన సభను ముందుకు తెస్తుంది; ‘సిగ్గుచేటు’ మూలంలోని నైతిక-సామాజిక బలాన్ని సహజంగా నిలుపుతుంది.
