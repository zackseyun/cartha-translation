id: 1CO.14.2
reference: 1 Corinthians 14:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: te
  text: ఎందుకంటే, భాషలో మాట్లాడేవాడు మనుషులతో కాక దేవునితో మాట్లాడుతాడు; అతడు చెప్పేది ఎవరికీ అర్థం కాదు[a]. అయితే, అతడు ఆత్మలో మర్మాలను పలుకుతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరూ వినరు.” గ్రీకు క్రియకు ‘విను’ అని అర్థం; ఈ సందర్భంలో అది ‘అర్థం చేసుకో’ అనే భావాన్ని కూడా ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఆత్మలో” అనే మాట పరిశుద్ధాత్మను లేదా మాట్లాడేవాని ఆత్మను సూచించవచ్చు; “ఆత్మచేత” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: మాట్లాడేవాడు
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతాన్ని సాధారణంగా అలాంటి పని చేసే వ్యక్తిని సూచించే సహజమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: γλώσσῃ
  choice: భాషలో
  rationale: ఏకవచన దత్తి రూపాన్ని నిలుపుతూ, మూలంలో లేని ‘తెలియని’ లేదా ‘వేరొక’ అనే విశేషణాలను చేర్చలేదు. ఈ అధ్యాయ సందర్భంలో ఇది భాషా-ఉచ్చారణ అనే ప్రత్యేక ఘటనను సూచిస్తుంది.
- source_word: ἀνθρώποις
  choice: మనుషులతో
  rationale: ఇది లింగభేదం లేని సాధారణ బహువచనం. λαλεῖతో ఉన్న దత్తి భావాన్ని తెలుగులో సహజంగా ‘తో’ ద్వారా వ్యక్తం చేశాం.
- source_word: θεῷ
  choice: దేవునితో
  rationale: λαλεῖతో ఉన్న దత్తి కర్మను సహజమైన తెలుగులో నేరుగా అనువదించాం.
- source_word: ἀκούει
  choice: అతడు చెప్పేది ఎవరికీ అర్థం కాదు
  rationale: ἀκούω ప్రాథమికంగా ‘విను’ అని అర్థమైనా, ఇక్కడ అర్థవంతమైన సమాచార ప్రసారానికి వ్యతిరేకంగా వాడబడినందున ‘అర్థం కాదు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది. అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: πνεύματι
  choice: ఆత్మలో
  rationale: దత్తి రూపంలోని సాధన/పరిధి భావాన్ని అతిగా నిర్ణయించకుండా ఇచ్చాం. తెలుగు రూపం పరిశుద్ధాత్మను గానీ, మాట్లాడేవాని ఆత్మను గానీ సూచించే మూలంలోని సందిగ్ధతను కొంతవరకు నిలుపుతుంది.
- source_word: μυστήρια
  choice: మర్మాలను
  rationale: పౌలు వాడుకలోని గంభీరమైన, దైవసంబంధమైన అంతర్భావాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాన్ని ఎంచుకున్నాం.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యానికి భిన్నమైన వివరణాత్మక మలుపును సహజమైన తెలుగులో సూచిస్తుంది.
theological_decisions:
- issue: πνεύματι ఎవరిని లేదా దేనిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మలో’
  alternative: ‘తన ఆత్మలో’ లేదా ‘ఆత్మచేత’
  rationale: గ్రీకు దత్తి పరిశుద్ధాత్మను, మాట్లాడేవాని ఆత్మను, లేదా సాధన భావాన్ని సూచించగలదు. ప్రధాన పాఠ్యం ఏ ఒక్క సిద్ధాంతపరమైన అర్థాన్నీ బలవంతంగా నిర్ణయించకుండా ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణాన్ని వాడాం. ‘అన్యభాష’ లేదా ‘తెలియని భాష’ అని సిద్ధాంతపరంగా ముందే నిర్వచించకుండా, ఏకవచన γλώσσῃను ‘భాషలో’గా ఉంచాం. మూలంలోని πνεύματι సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిసి సంరక్షిస్తాయి.
