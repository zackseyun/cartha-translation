- from: అయితే, సహోదరులారా[a], సంగతేమిటి? మీరు కూడివచ్చినప్పుడు, ఒక్కొక్కరి దగ్గర ఒక కీర్తన, ఒక బోధ, ఒక ప్రత్యక్షత, ఒక భాష[b], ఒక అర్థవివరణ ఉంటాయి. అన్నీ సంఘాన్ని బలపరచడానికే జరగాలి.
