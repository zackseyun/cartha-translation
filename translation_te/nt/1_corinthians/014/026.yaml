id: 1CO.14.26
reference: 1 Corinthians 14:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: te
  text: అయితే, సహోదరులారా[a], సంగతేమిటి? మీరు కూడివచ్చినప్పుడు, మీలో ప్రతి ఒక్కరి వద్ద ఒక కీర్తన ఉంది, ఒక బోధ ఉంది, ఒక వెల్లడి ఉంది, ఒక భాష[b] ఉంది, ఒక అర్థవివరణ ఉంది. అన్నీ సంఘాన్ని బలపరచడానికి జరగాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరులారా’ అనే సంబోధన ఇక్కడ సంఘంలోని స్త్రీపురుషులందరినీ ప్రతినిధిగా ఉద్దేశిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదానికి అక్షరార్థంగా ‘నాలుక’ అని, సందర్భానుసారం ‘భాష’ అని అర్థం రావచ్చు. ఇక్కడ పౌలు చర్చిస్తున్న పలుకు యొక్క ఖచ్చిత స్వరూపాన్ని ఈ పదం ఒక్కటే నిర్ణయించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: అయితే ... సంగతేమిటి?
  rationale: ముందటి చర్చనుంచి ఆచరణాత్మక నిర్ధారణకు తీసుకెళ్లే గ్రీకు అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకులోని పుంలింగ బహువచన సంబోధనను నిలుపుతూ, సందర్భంలో అది స్త్రీపురుషులందరితో కూడిన సంఘాన్ని ఉద్దేశిస్తుందని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: ὅταν συνέρχησθε
  choice: మీరు కూడివచ్చినప్పుడు
  rationale: సంఘంగా సమావేశమయ్యే సందర్భాన్ని, పునరావృతంగా జరిగే చర్య అనే భావంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἕκαστος
  choice: ఒక్కొక్కరి దగ్గర
  rationale: ప్రతి వ్యక్తి తన వంతుగా ఏదో ఒకటి తీసుకువస్తున్నాడనే విభాజక భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో చూపుతుంది.
- source_word: ψαλμὸν
  choice: ఒక కీర్తన
  rationale: సాధారణ ‘పాట’ కంటే గ్రీకు పదంలోని స్తుతిగీత భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: διδαχὴν
  choice: ఒక బోధ
  rationale: ఈ సమావేశ సందర్భంలో అందించే ఉపదేశాన్ని సూచిస్తుంది; వ్యవస్థీకృత సిద్ధాంతం అనే అధిక భావాన్ని చేర్చదు.
- source_word: ἀποκάλυψιν
  choice: ఒక ప్రత్యక్షత
  rationale: దేవుని నుండి వెల్లడైన విషయం అనే భావాన్ని సంప్రదాయబద్ధమైనప్పటికీ సులభంగా అర్థమయ్యే పదంతో అందిస్తుంది.
- source_word: γλῶσσαν
  choice: ఒక భాష
  rationale: గ్రీకు పదం ‘నాలుక’ లేదా ‘భాష’ను సూచించగలదు. తెలుగులో ‘నాలుక’ ప్రధాన పాఠ్యంలో శరీర అవయవార్థాన్ని బలంగా వినిపించేందున ‘భాష’ను ఎంచుకుని, పౌలు చర్చిస్తున్న పరిణామం స్వరూపాన్ని పాదటిప్పణిలో తెరిచి ఉంచింది.
- source_word: ἑρμηνείαν
  choice: ఒక అర్థవివరణ
  rationale: సంఘానికి అర్థమయ్యేలా భాషలో పలికినదాని భావాన్ని తెలియజేయడాన్ని సూచిస్తుంది; కేవలం పదానువాదం అని పరిమితం చేయదు.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: అన్నీ సంఘాన్ని బలపరచడానికే జరగాలి
  rationale: οἰκοδομήలోని కట్టడం అనే రూపకానికి చెందిన సామూహిక అభివృద్ధి భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలుపుతుంది; గ్రీకు ఆజ్ఞార్థక బలాన్ని ‘జరగాలి’ నిలుపుతుంది.
theological_decisions:
- issue: సంఘాన్ని ఉద్దేశించిన ప్రతినిధి పుంలింగ సంబోధన
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’ అని ఉంచి, సందర్భంలోని సమగ్రతను పాదటిప్పణిలో స్పష్టం చేయడం
  alternative: సహోదర సహోదరీలారా
  rationale: గ్రీకు రూపాన్ని దాచకుండా నిలుపుతుంది; అదే సమయంలో ఇది మిశ్రమ సంఘాన్ని ఉద్దేశించిన సంబోధన అని పాఠకునికి తెలియజేస్తుంది.
- issue: ఈ అధ్యాయంలో γλῶσσα యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘భాష’ అని అనువదించి, గ్రీకు పదంలోని ‘నాలుక/భాష’ పరిధిని పాదటిప్పణిలో పేర్కొనడం
  alternative: నాలుక; అన్యభాష
  rationale: ‘అన్యభాష’ అని అనువదిస్తే గ్రీకులో లేని ‘అన్య’ భావం చేరుతుంది; ‘నాలుక’ తెలుగులో అపార్థానికి దారితీయవచ్చు. ‘భాష’తో పాటు పాదటిప్పణి ఉంచడం, ఇది తెలిసిన మానవ భాషా లేక మరో విధమైన పలుకా అనే ప్రశ్నను పాఠ్యం నిర్ణయించిన దానికంటే ఎక్కువగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సంఘ పఠనానికి అనువైన శైలి. జాబితాలో గ్రీకు పునరావృత నిర్మాణాన్ని పూర్తిగా యాంత్రికంగా అనుకరించకుండా, ‘ఒక్కొక్కరి దగ్గర ... ఉంటాయి’ అనే సహజ తెలుగు నిర్మాణంతో పంపిణీ భావాన్ని నిలిపింది.
