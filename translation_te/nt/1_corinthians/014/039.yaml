id: 1CO.14.39
reference: 1 Corinthians 14:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: te
  text: కాబట్టి, నా సహోదరులారా[a], ప్రవచించాలని ఆసక్తిగా కోరుకోండి; భాషల్లో మాట్లాడడాన్ని నిషేధించకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా సహోదర సహోదరీలారా”; గ్రీకులో “సహోదరులారా” అని ఉంది; అది సంఘమంతటినీ కలుపుకొని ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి చర్చనుంచి తుదినిర్ణయాన్ని సూచించే అన్వయార్థక సంధానపదం; ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని నిర్ధారణ భావాన్ని నిలుపుతుంది.
- source_word: ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: మూలంలోని పుంలింగ బహువచన సంబోధనను, μου అనే స్వామ్యసూచక పదాన్ని నేరుగా నిలుపుతుంది; సంఘమంతటినీ కలుపుకొని సంబోధించే అవకాశం పాదటిప్పణిలో తెలియజేయబడింది.
- source_word: ζηλοῦτε
  choice: ఆసక్తిగా కోరుకోండి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపం నిరంతరమైన, ఉత్సాహపూర్వక అభిలాషను సూచిస్తుంది; కేవలం పని చేయమనే అర్థం కాకుండా దానిని హృదయపూర్వకంగా కోరుకోవాలనే భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: τὸ προφητεύειν
  choice: ప్రవచించాలని
  rationale: ఆజ్ఞలో కోరుకోవలసిన కార్యాన్ని సూచించే articular infinitive; తెలుగులో సహజమైన క్రియాపూరక రూపంతో అనువదించబడింది.
- source_word: μὴ κωλύετε
  choice: నిషేధించకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థకం ప్రత్యక్ష నిషేధాన్ని ఇస్తుంది; సంఘ ఆచరణకు సంబంధించిన సందర్భంలో ‘నిషేధించకండి’ స్పష్టంగా సరిపోతుంది.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: భాషల్లో మాట్లాడడాన్ని
  rationale: ఈ అధ్యాయంలో చర్చిస్తున్న కార్యాన్ని సూచిస్తుంది. γλώσσαις అనే పదం ఎలాంటి భాషలను సూచిస్తుందో అనవసరంగా నిర్ణయించకుండా ‘భాషల్లో’ అని అనువదించడం మూలంలోని విస్తృతతను కాపాడుతుంది.
theological_decisions:
- issue: మిశ్రమ లింగాల సంఘాన్ని ఉద్దేశించే ἀδελφοί అనే సంబోధన
  choice: నా సహోదరులారా
  alternative: నా సహోదర సహోదరీలారా
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా పుంలింగ బహువచనం; సందర్భంలో అది సంఘమంతటినీ ప్రతినిధిత్వంగా ఉద్దేశించి ఉండవచ్చు. ప్రధాన పాఠం మూలరూపాన్ని నిలుపుతూ, సమావేషక అర్థసాధ్యతను పాదటిప్పణిలో వివరిస్తుంది.
- issue: γλώσσαις సూచించే భాషల స్వరూపం
  choice: భాషల్లో
  alternative: అన్యభాషల్లో
  rationale: ఈ పదం మానవ విదేశీ భాషలనే గాని, ప్రత్యేక ఆధ్యాత్మిక ఉచ్చారణలనే గాని ఇక్కడ అనువాదంలో ముందే నిర్ణయించదు. ‘భాషల్లో’ అనేది ఆ అర్థసాధ్యతను తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. వాక్యం స్పష్టంగా, సంఘంలో బహిరంగంగా చదవడానికి సహజంగా ఉండేలా రూపొందించబడింది; ‘భాషల్లో’ అనే పదం మూలంలోని అర్థసాధ్యతను సిద్ధాంతపరంగా కుదించదు.
