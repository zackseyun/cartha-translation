  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: te
  text: ఎందుకంటే, బాకా అస్పష్టమైన ధ్వనిని ఇస్తే[a], పోరాటానికి[b] ఎవరు సిద్ధపడతారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గుర్తుపట్టలేని ధ్వనిని.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “యుద్ధం కోసం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న వాదనకు వివరణాత్మక ఆధారాన్ని జోడించే అనుసంధానంగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἐὰν
  choice: ఇస్తే
  rationale: δῷతో కలిసి షరతును వ్యక్తం చేస్తుంది; తెలుగులో క్రియకు ‘-తే’ చేర్చడం సహజం.
- source_word: ἄδηλον
  choice: అస్పష్టమైన
  rationale: సులభంగా గుర్తించలేని లేదా స్పష్టంగా అర్థంకాని సంకేతధ్వనిని సూచిస్తుంది.
- source_word: φωνὴν
  choice: ధ్వనిని
  rationale: బాకా సందర్భంలో φωνή మానవ స్వరం కాక వాద్యం వెలువరించే ధ్వనిని సూచిస్తుంది.
- source_word: σάλπιγξ
  choice: బాకా
  rationale: యుద్ధసంకేతాలు ఇవ్వడానికి ఉపయోగించే తూర్యవాద్యాన్ని సూచించే సాధారణమైన, సందర్భోచిత తెలుగు పదం.
- source_word: δῷ
  choice: ఇస్తే
  rationale: గ్రీకు ‘ఇవ్వు’ అనే చిత్రణను ‘ధ్వనిని ఇస్తే’ అనే సహజ తెలుగు పదబంధంలో నిలుపుతుంది.
- source_word: τίς
  choice: ఎవరు
  rationale: అలంకారిక ప్రశ్నను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρασκευάσεται
  choice: సిద్ధపడతారు
  rationale: మధ్యమ ప్రయోగంలోని తనను తాను సిద్ధం చేసుకోవడం అనే భావాన్ని సహజమైన తెలుగు క్రియ వ్యక్తం చేస్తుంది.
- source_word: εἰς πόλεμον
  choice: యుద్ధానికి
  rationale: గ్రీకు పదబంధానికి సన్నిహితమైన రూపం; సైనిక సంకేతం నేపథ్యంలో పోరాటానికి సిద్ధం కావడాన్ని సూచిస్తుంది.
