id: 1CO.14.15
reference: 1 Corinthians 14:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: te
  text: అయితే, ఏమి చేయాలి? నేను ఆత్మతో ప్రార్థిస్తాను[a]; మనస్సుతో కూడా ప్రార్థిస్తాను[b]. నేను ఆత్మతో స్తుతిగానం చేస్తాను[c]; మనస్సుతో కూడా స్తుతిగానం చేస్తాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆత్మలో’ లేదా ‘ఆత్మ ద్వారా.’ ఇక్కడ ‘ఆత్మ’ ప్రత్యేకంగా పరిశుద్ధాత్మను, మాట్లాడేవారి మానవ ఆత్మను, లేదా ఆత్మసంబంధమైన ఉచ్చారణను సూచిస్తుందో గ్రీకు పాఠ్యం స్పష్టం చేయదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అవగాహనతో.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘పాడుతాను’ లేదా ‘స్వరమాలాపన చేస్తాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: అయితే, ఏమి చేయాలి?
  rationale: ఈ గ్రీకు ప్రశ్న ముందటి చర్చ నుంచి ఆచరణాత్మక నిర్ణయానికి తీసుకువెళుతుంది. అక్షరార్థమైన ‘అయితే ఏమిటి?’ కంటే ఇది ఆధునిక తెలుగులో సహజంగా, సందర్భార్థానికి దగ్గరగా ఉంది.
- source_word: προσεύξομαι
  choice: నేను ప్రార్థిస్తాను
  rationale: భవిష్యత్ రూపంలోని క్రియను సహజంగా, నేరుగా అనువదిస్తుంది; మధ్యమ వాచ్యానికి తెలుగులో ప్రత్యేక ఆత్మనిష్ఠ రూపం అవసరం లేదు.
- source_word: τῷ πνεύματι
  choice: ఆత్మతో
  rationale: దత్తివిభక్తి సూచించే సాధన లేదా సహభాగ భావాన్ని, అలాగే ‘మనస్సుతో’ అనే సమాంతర నిర్మాణాన్ని నిలుపుతుంది. ఇది పరిశుద్ధాత్మనా, మానవ ఆత్మనా, లేక ఆత్మసంబంధమైన ఉచ్చారణనా అన్నది ప్రధాన పాఠ్యంలో నిర్ణయించదు.
- source_word: τῷ νοΐ
  choice: మనస్సుతో
  rationale: νοῦς ఇక్కడ అవగాహనతో కూడిన ఆలోచనా సామర్థ్యాన్ని సూచిస్తుంది. ‘మనస్సుతో’ అనేది πνεῦμαతో ఉన్న పదనిర్మాణ సమాంతరతను కాపాడే సహజ తెలుగు ప్రయోగం.
- source_word: ψαλῶ
  choice: స్తుతిగానం చేస్తాను
  rationale: ఈ ఆరాధనా సందర్భంలో ψάλλω పాడే స్తుతిని సూచిస్తుంది. ‘పాడుతాను’ కంటే స్తుతి భావాన్ని స్పష్టం చేస్తూ, ‘వాయిద్యంతో స్వరం చేస్తాను’ వంటి అతిగా అక్షరార్థమైన భావాన్ని నివారిస్తుంది.
- source_word: δὲ καὶ
  choice: కూడా
  rationale: ఒక విధానానికే పరిమితం కాక మరొకదానినీ చేర్చే సమతుల్యమైన స్వల్ప వ్యత్యాసాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆత్మకూ మనస్సుకూ మధ్య వ్యత్యాసంలో πνεῦμα అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మ’ అని సాధారణంగా ఉంచడం
  alternative: ‘పరిశుద్ధాత్మతో’ లేదా ‘నా ఆత్మతో’
  rationale: సందర్భం ఆరాధనలో ఆత్మసంబంధమైన పలుకుకూ అర్థగ్రాహ్యమైన అవగాహనకూ మధ్య సంబంధాన్ని చర్చిస్తుంది. ఇక్కడ పరిశుద్ధాత్మను, మానవ ఆత్మను, లేదా పరిశుద్ధాత్మచే ప్రేరేపితమైన మానవ ఆత్మను ఉద్దేశించారా అనే విషయంలో గ్రీకు పాఠ్యం స్పష్టంగా నిర్ణయించదు; అందువల్ల ఆ సందిగ్ధతను అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘ ఆరాధన సందర్భానికి తగిన గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని పునరుక్త సమాంతర నిర్మాణాన్ని నిలిపాం; πνεῦμα యొక్క ఉద్దేశిత సూచనను ప్రధాన పాఠ్యంలో నిర్ధారించలేదు.
