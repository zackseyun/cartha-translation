id: 1CO.14.9
reference: 1 Corinthians 14:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: te
  text: అలాగే మీరు కూడా నాలుక ద్వారా స్పష్టంగా అర్థమయ్యే మాటను పలకకపోతే[a], చెప్పబడేది ఎలా అర్థమవుతుంది? ఎందుకంటే మీరు గాలిలోకి మాట్లాడుతున్నవారవుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్పష్టమైన మాటను” లేదా “సులభంగా గుర్తించగల సందేశాన్ని.” గ్రీకు పదం శ్రోతలు గుర్తించి అర్థం చేసుకోగల మాటను నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: అలాగే మీరు కూడా
  rationale: ముందటి ఉదాహరణతో పౌలు చేస్తున్న పోలికను, కొరింథీయులను నేరుగా సంబోధిస్తున్న భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: διὰ τῆς γλώσσης
  choice: నాలుక ద్వారా
  rationale: ‘నాలుక’ అనే మూలపాఠంలోని సాకార రూపకాన్ని కాపాడుతూ, మాట పలికే సాధనమనే భావాన్ని తెలియజేస్తుంది.
- source_word: εὔσημον λόγον
  choice: స్పష్టంగా అర్థమయ్యే మాటను
  rationale: εὔσημος లోని స్పష్టత, గుర్తించగలగడం, శ్రోతకు అర్థమవడం అనే భావాలను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δῶτε
  choice: పలకకపోతే
  rationale: గ్రీకులో అక్షరార్థంగా ‘ఇవ్వకపోతే’ ఉన్నప్పటికీ, తెలుగులో ‘మాటను ఇవ్వడం’ అసహజం; సందర్భంలోని ఉచ్చారణ భావాన్ని ‘పలకడం’ సహజంగా తెలియజేస్తుంది.
- source_word: πῶς γνωσθήσεται
  choice: ఎలా అర్థమవుతుంది?
  rationale: నిష్క్రియ రూపాన్ని నిలుపుతూ, ఈ సందర్భంలో శ్రోతలు సందేశాన్ని గ్రహించడమే ఉద్దేశమని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ λαλούμενον
  choice: చెప్పబడేది
  rationale: నామవాచకంగా వాడిన నిష్క్రియ కృదంతాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: అప్పుడు మీరు గాలితో మాట్లాడుతున్నవారిలా ఉంటారు
  rationale: అర్థంకాని మాటల వ్యర్థతను తెలిపే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘γάρ’ ఇక్కడ ఫలితానికి వివరణ ఇస్తున్నందున ‘అప్పుడు’తో అనుసంధానం చేయబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, గౌరవప్రదంగా ఉంది. ‘నాలుక’ మరియు ‘గాలి’ అనే మూలపాఠ రూపకాలు నిలుపబడ్డాయి.
