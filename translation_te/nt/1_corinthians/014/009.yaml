revisions:
- from: అలాగే మీరు కూడా నాలుక ద్వారా స్పష్టంగా అర్థమయ్యే మాటను పలకకపోతే[a], చెప్పబడేది ఎలా అర్థమవుతుంది? అప్పుడు మీరు గాలితో మాట్లాడుతున్నవారిలా ఉంటారు.
  to: అలాగే మీరు కూడా నాలుక ద్వారా స్పష్టంగా అర్థమయ్యే మాటను పలకకపోతే[a], చెప్పబడేది ఎలా అర్థమవుతుంది? ఎందుకంటే మీరు గాలిలోకి మాట్లాడుతున్నవారవుతారు.
  rationale: 'The revision changes only the final clause: it restores εἰς ἀέρα as ‘గాలిలోకి’ (‘into the air’) and represents γάρ with the causal connector ‘ఎందుకంటే.’ No theological or interpretive change is introduced.'
  reviewer_model: gpt-5.6-terra
