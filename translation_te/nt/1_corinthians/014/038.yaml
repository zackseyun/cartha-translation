  text: But if anyone does not recognize this[b][a], he is not recognized.
translation:
  language: te
  text: అయితే ఎవరైనా దీనిని గుర్తించకపోతే,[a] అతడు గుర్తించబడడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దీనిని అంగీకరించకపోతే.” గ్రీకు క్రియకు “తెలియకపోవడం,” “గుర్తించకపోవడం,” లేదా “అంగీకరించకపోవడం” అనే భావాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో, “ఎవరైనా తెలియనివాడైతే, అతడు తెలియనివాడిగానే ఉండనివ్వండి” అని ఉంది. స్వీకరించిన పాఠంలో ఒకే గ్రీకు క్రియ కర్తరి, కర్మణి రూపాల్లో వచ్చి, “గుర్తించకపోతే ... గుర్తించబడడు” అనే పదప్రయోగాన్ని కలిగిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: εἰ
  choice: ఎవరైనా ... అయితే
  rationale: షరతును సహజమైన ఆధునిక తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: ముందటి వాక్యానికి భిన్నంగా వచ్చే హెచ్చరికను తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: τις
  choice: ఎవరైనా
  rationale: నిర్దిష్టత లేని ఏ వ్యక్తినైనా సూచించే ఏకవచన సాధారణ ప్రయోగం.
- source_word: ἀγνοεῖ
  choice: గుర్తించకపోతే
  rationale: 37వ వచనంలోని గుర్తింపుతో సంబంధాన్ని నిలుపుతూ, ‘తెలియకపోవడం’ లేదా ‘అంగీకరించకపోవడం’ అనే భావవ్యాప్తిని పూర్తిగా మూసివేయదు.
- source_word: ἀγνοεῖται
  choice: గుర్తించబడడు
  rationale: గ్రీకులోని అదే క్రియకు చెందిన కర్తరి-కర్మణి సమాంతరతను తెలుగులో సాధ్యమైనంత స్పష్టంగా నిలుపుతుంది; కర్తను అనవసరంగా పేర్కొనదు.
theological_decisions:
- issue: ἀγνοεῖται అనే కర్మణి క్రియ భావం
  choice: అతడు గుర్తించబడడు
  alternative: అతడు పట్టించుకోబడడు; అతడు అంగీకరించబడడు
  rationale: SBLGNT పాఠంలో ఇది కర్మణి నిర్దేశార్థక రూపం; ఆజ్ఞార్థకం కాదు. ఎవరిచేత గుర్తించబడడో నిర్దిష్టం చేయకుండా, మూలంలోని న్యాయాత్మక లేదా ప్రతిఫలాత్మక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: పాఠాంతరంలోని ఆజ్ఞార్థక భావం
  choice: ప్రధాన పాఠంలో కర్మణి నిర్దేశార్థక రూపాన్ని అనుసరించడం
  alternative: ‘తెలియనివాడు తెలియనివాడిగానే ఉండనివ్వండి’
  rationale: ఇచ్చిన SBLGNT మూలపాఠం ἀγνοεῖται అని చదువుతుంది; ఇతర ప్రతుల పాఠాన్ని పాదటిప్పణిలో నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన వాక్యం. ‘గుర్తించు/గుర్తించబడడు’ అనే పునరుక్తి మూలంలోని అలంకార సమాంతరతను నిలుపుతుంది. పాదటిప్పణి గుర్తులు రెండూ ప్రధాన పాఠంలో ఉన్నాయి.
