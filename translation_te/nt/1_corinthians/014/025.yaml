id: 1CO.14.25
reference: 1 Corinthians 14:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: te
  text: అతని హృదయంలోని రహస్య విషయాలు బయలుపడతాయి. అలా అతడు ముఖం నేలకు ఆనించి పడిపోయి దేవుణ్ణి ఆరాధిస్తాడు; “దేవుడు నిజంగా మీ మధ్య ఉన్నాడు[a]” అని ప్రకటిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “దేవుడు నిజంగా మీలో ఉన్నాడు.”'
    reason: గ్రీకు ἐν ὑμῖν అనే పదబంధం ‘మీ మధ్య’ లేదా ‘మీలో’ అనే రెండు భావాలను ఇవ్వగలదు.
lexical_decisions:
- source_word: τὰ κρυπτὰ τῆς καρδίας αὐτοῦ
  choice: అతని హృదయంలో దాగి ఉన్నవి
  rationale: మూలంలోని ‘హృదయపు రహస్య విషయాలు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘హృదయం’ అనే బైబిలు మానవశాస్త్ర పదాన్ని నిలుపుతుంది.
- source_word: φανερὰ γίνεται
  choice: బయలుపడతాయి
  rationale: దాగి ఉన్నవి స్పష్టంగా వెలుగులోకి రావడం అనే భావాన్నీ, γίνεται లోని పరిణామ భావాన్నీ సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: καὶ οὕτως
  choice: అప్పుడు
  rationale: హృదయంలోని విషయాలు బయలుపడటానికి ప్రతిస్పందనగా తరువాత జరిగే చర్యను సహజంగా అనుసంధానిస్తుంది.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: సాష్టాంగపడి
  rationale: ముఖం నేలకు ఆనేటట్లు పడే ఆరాధనా భంగిమను సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: προσκυνήσει τῷ θεῷ
  choice: దేవుణ్ణి ఆరాధిస్తూ
  rationale: ఇక్కడ క్రియ దేవునికి చేసే ఆరాధనను సూచిస్తుంది; శారీరకంగా వంగిపడే అంశం ముందు పదబంధంలోనే వ్యక్తమైంది.
- source_word: ἀπαγγέλλων
  choice: ప్రకటిస్తాడు
  rationale: అతడు గుర్తించిన సత్యాన్ని స్పష్టంగా తెలియజేయడం అనే భావాన్ని ఇస్తుంది; అవసరానికి మించి బహిరంగ బోధన భావాన్ని రుద్దదు.
- source_word: Ὄντως
  choice: నిజంగా
  rationale: అతని నిర్ధారణలోని బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: సమకూడిన సంఘాన్ని ఉద్దేశించిన సందర్భంలో దేవుడు వారి మధ్య ఉన్నాడనే సామూహిక భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ముగింపు ప్రకటనలో ἐν ὑμῖν యొక్క భావం
  choice: మీ మధ్య
  alternative: మీలో
  rationale: తక్షణ సందర్భం సమకూడిన సంఘంలో ప్రవచన కార్యం ద్వారా దేవుని సన్నిధిని అవిశ్వాసి గుర్తించడం గురించి ఉంది. అయితే గ్రీకు పదబంధం ‘మీలో’ అనే అంతర్నివాస భావాన్నీ అనుమతించగలదు కాబట్టి దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘సాష్టాంగపడి’ ముఖం నేలకు ఆనేటట్లు పడటాన్ని సంక్షిప్తంగా తెలిపే సుపరిచిత పదంగా ఉపయోగించబడింది.
