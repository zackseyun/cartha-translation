id: 1CO.14.11
reference: 1 Corinthians 14:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: te
  text: కాబట్టి, ఆ ధ్వని తెలియజేసే అర్థం[a] నాకు తెలియకపోతే, మాట్లాడేవానికి నేను పరదేశిగా[b] ఉంటాను; మాట్లాడేవాడు కూడా నాకు పరదేశిగా ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ ధ్వని యొక్క శక్తి’; అంటే ఆ ధ్వని తెలియజేసే భావం లేదా అర్థం.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘బార్బరుడు.’ ఇక్కడ అది నాగరికతలేని వ్యక్తిని తప్పనిసరిగా సూచించదు; మాట అర్థంకాని విదేశీయుడు లేదా భాషాపరంగా పరాయివాడు అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: కాబట్టి ... తెలియకపోతే
  rationale: οὖν యొక్క నిర్ధారణాత్మక భావాన్ని ‘కాబట్టి’తో, ἐὰν యొక్క షరతును ‘తెలియకపోతే’తో సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలిపింది.
- source_word: μὴ εἰδῶ
  choice: నాకు తెలియకపోతే
  rationale: οἶδα యొక్క ప్రాథమికమైన ‘తెలుసు’ భావాన్ని కాపాడుతూ, తెలుగులో సహజంగా ఉండే దత్త విభక్తి నిర్మాణాన్ని వాడింది.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: ఆ ధ్వని తెలియజేసే అర్థం
  rationale: δύναμις‌కు మౌలికంగా ‘శక్తి/బలం’ అనే భావం ఉన్నప్పటికీ, ఇక్కడ φωνή ద్వారా వ్యక్తమయ్యే భావం లేదా ప్రాముఖ్యతను సూచిస్తుంది. ‘ధ్వని తెలియజేసే అర్థం’ మూలంలోని రూపకాన్ని పూర్తిగా చెరపకుండా ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῷ λαλοῦντι
  choice: మాట్లాడేవానికి
  rationale: వర్తమాన కృదంతంలోని ‘మాట్లాడుతున్న వ్యక్తి’ భావాన్ని సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: βάρβαρος
  choice: పరదేశిగా
  rationale: ఈ సందర్భంలో ఈ పదం నాగరికతలేనివాడని కాక, మాట అర్థంకాని విదేశీయుడిని లేదా భాషాపరంగా పరాయివాడిని సూచిస్తుంది. ‘పరదేశిగా’ పరస్పర భాషా దూరాన్ని అవమానకర భావం లేకుండా తెలియజేస్తుంది.
- source_word: ἐν ἐμοὶ
  choice: నాకు
  rationale: ఇక్కడ ἐν ἐμοί సంబంధాన్ని లేదా ఎదుటివారి దృష్టిలోని స్థితిని సూచిస్తుంది; పరస్పర నిర్మాణంలో ‘నాకు’ సహజమైన తెలుగు సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడింది. మూలంలోని పరస్పర నిర్మాణాన్ని—‘నేను అతనికి, అతడు నాకు’—స్పష్టంగా కాపాడింది; ‘ధ్వని’ అనే పదం φωνή యొక్క శబ్దం/స్వరం అనే పరిధిని నిలుపుతుంది.
