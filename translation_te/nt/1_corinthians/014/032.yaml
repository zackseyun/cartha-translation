translation:
  language: te
  text: ప్రవక్తల ఆత్మలు ప్రవక్తలకు లోబడి ఉంటాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రవక్తలకు చెందిన ఆత్మలు ప్రవక్తలకు లోబడి ఉంటాయి.’ ఈ మాట ప్రవచన ప్రేరణలను లేదా ప్రవక్తలకు సంబంధించిన ఆధ్యాత్మిక క్రియను సూచించవచ్చు; ప్రవచించేటప్పుడు స్వీయనియంత్రణ ఉంటుందని ఇది నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (తెలుగులో ప్రత్యేకంగా అనువదించలేదు)
  rationale: ఈ వాక్యం ముందున్న వాదనను కొనసాగిస్తుంది. తెలుగులో వాక్యసందర్భమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; ‘మరియు’ అని పెట్టడం అసహజంగా ఉంటుంది.
- source_word: πνεύματα
  choice: ఆత్మలు
  rationale: మూలంలోని బహువచన నామవాచకాన్ని నేరుగా నిలుపుతుంది. సందర్భంలో ఇది ప్రవచన ప్రేరణలను లేదా ప్రవక్తలకు సంబంధించిన ఆధ్యాత్మిక క్రియను సూచించవచ్చు; అయితే ప్రధాన పాఠ్యంలో ‘ప్రవచనాలు’ లేదా ‘వరాలు’ అని వివరణాత్మకంగా మార్చడం మూలంలోని సందిగ్ధతను తొలగిస్తుంది.
- source_word: προφητῶν
  choice: ప్రవక్తల
  rationale: ‘ఆత్మలు’తో సంబంధాన్ని తెలిపే బహువచన షష్ఠీ విభక్తిని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: προφήταις
  choice: ప్రవక్తలకు
  rationale: ὑποτάσσεταιతో వచ్చిన సంప్రదాన విభక్తి లోబడే వ్యక్తులను సూచిస్తుంది. ‘ప్రవక్తలకు’ అనే రూపం మూలానికి దగ్గరగా ఉండి, అది అదే ప్రవక్తలనో ఇతర ప్రవక్తలనో సూచిస్తుందనే ప్రశ్నను అనవసరంగా పరిష్కరించదు.
- source_word: ὑποτάσσεται
  choice: లోబడి ఉంటాయి
  rationale: అధీనంలో లేదా నియంత్రణలో ఉండటం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. గ్రీకులో నపుంసక బహువచన కర్తతో ఏకవచన క్రియ ఉన్నప్పటికీ, తెలుగులో బహువచన అన్వయం అవసరం.
theological_decisions:
- issue: ‘ప్రవక్తల ఆత్మలు’ మరియు ప్రవచనంలో నియంత్రణ
  choice: ప్రవక్తల ఆత్మలు ప్రవక్తలకు లోబడి ఉంటాయని మూల వాక్య నిర్మాణాన్ని నిలిపి, ప్రవచన కార్యంలో నియంత్రణ సాధ్యమనే భావాన్ని సూచించడం
  alternative: దీనిని నేరుగా ‘ప్రవచన ప్రేరణలు ప్రవక్తల నియంత్రణలో ఉంటాయి’ అని వివరణాత్మకంగా అనువదించడం; లేదా ప్రవక్తల మానవ ఆత్మలు ఇతర ప్రవక్తలకు లోబడతాయని నిర్దిష్టీకరించడం
  rationale: సమకూడిన సంఘంలో క్రమబద్ధమైన ప్రవచనం గురించి ఉన్న తక్షణ సందర్భం స్వీయనియంత్రణను బలపరుస్తుంది. అయినప్పటికీ, ‘ఆత్మలు’ అనేది మానవ ఆత్మలనో, ప్రవచన ప్రేరణలనో, ప్రవక్తలకు సంబంధించిన ఆధ్యాత్మిక క్రియనో సూచించవచ్చు. ప్రధాన పాఠ్యం ఈ నిజమైన భావసందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ఆత్మలు’ అనే మూలపదాన్ని నిలిపి, సందర్భానుసారమైన వివరణను పాదటిప్పణికి పరిమితం చేశాం.
