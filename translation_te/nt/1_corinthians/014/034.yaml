id: 1CO.14.34
reference: 1 Corinthians 14:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: te
  text: సంఘాలలో స్త్రీలు[a] మౌనంగా ఉండాలి; ఎందుకంటే మాట్లాడడానికి[b] వారికి అనుమతి లేదు. ధర్మశాస్త్రం[c] కూడా చెప్పినట్లుగా, వారు లోబడి ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “భార్యలు”; γυνή అనే గ్రీకు పదానికి సందర్భాన్ని బట్టి “స్త్రీ” లేదా “భార్య” అనే అర్థం రావచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఈ వాక్యం ఏ విధమైన మాట్లాడడాన్ని ఉద్దేశిస్తుందో స్వయంగా నిర్దిష్టం చేయదు; కొందరు చుట్టుపక్కల సందర్భం ఆధారంగా దీన్ని మరింత పరిమితమైన అర్థంలో గ్రహిస్తారు.
    reason: lexical_alternative
  - marker: c
    text: ఇది ప్రత్యేకంగా మోషే ధర్మశాస్త్రాన్ని లేదా మరింత విస్తృతంగా లేఖనాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: స్త్రీలు
  rationale: γυνή అనే పదానికి సందర్భాన్ని బట్టి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు. ఈ వాక్యంలో భర్తల ప్రస్తావన స్పష్టంగా లేనందున ప్రధాన పాఠంలో విస్తృతమైన ‘స్త్రీలు’ను ఉంచి, ‘భార్యలు’ అనే అవకాశాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἐκκλησίαις
  choice: సంఘాలలో
  rationale: పౌలు వాడుకలో ἐκκλησία సాధారణంగా కూడివచ్చిన క్రైస్తవ విశ్వాసుల సంఘాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు పరిభాషలో ‘సంఘాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: σιγάτωσαν
  choice: మౌనంగా ఉండాలి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపం పేర్కొన్న సందర్భంలో మౌనం పాటించాలనే ఆదేశాన్ని తెలియజేస్తుంది. ఇదే అధ్యాయంలోని క్రమబద్ధమైన మౌనానికి సంబంధించిన వాడుకతో ఇది సరిపోతుంది.
- source_word: ἐπιτρέπεται
  choice: అనుమతి లేదు
  rationale: ఈ కర్మణి రూపం అనుమతించబడకపోవడాన్ని తెలుపుతుంది. ‘అనుమతి లేదు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని నిరపేక్ష భావాన్ని నిలుపుతుంది.
- source_word: λαλεῖν
  choice: మాట్లాడడానికి
  rationale: λαλέω మాట్లాడడాన్ని సూచించే విస్తృతార్థక క్రియ. మూలపాఠం ఇక్కడ ఎలాంటి మాటను ఉద్దేశించిందో పరిమితం చేయదు; అందువల్ల తటస్థమైన సాధారణ పదాన్ని వాడాం.
- source_word: ὑποτασσέσθωσαν
  choice: లోబడి ఉండాలి
  rationale: ఈ వర్తమాన మధ్యమ/కర్మణి ఆజ్ఞార్థక రూపం లోబడిన స్థితిని లేదా వైఖరిని సూచిస్తుంది. ‘లోబడి ఉండాలి’ ఆజ్ఞార్థాన్ని స్పష్టంగా, అనవసరమైన కఠినత లేకుండా తెలియజేస్తుంది.
- source_word: νόμος
  choice: ధర్మశాస్త్రం
  rationale: తెలుగు బైబిలు వాడుకలో νόμοςకు ‘ధర్మశాస్త్రం’ సహజమైన సమానార్థకం. ఇది మోషే ధర్మశాస్త్రాన్నే ప్రత్యేకంగా సూచిస్తుందా లేక లేఖనాన్ని మరింత విస్తృతంగా సూచిస్తుందా అనే ప్రశ్నను పాదటిప్పణిలో తెరిచి ఉంచాం.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: ధర్మశాస్త్రం కూడా చెప్పినట్లుగా
  rationale: ఈ పదబంధం పోలికతో కూడిన అదనపు ఆధారాన్ని ప్రవేశపెడుతుంది. ‘చెప్పినట్లుగా’ καθὼς భావాన్ని, ‘కూడా’ καί భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: γυναῖκες ఎవరిని సూచిస్తుంది?
  choice: సంఘాలలోని స్త్రీలు
  alternative: సంఘాలలోని భార్యలు
  rationale: గ్రీకు పదం రెండు అర్థాలనూ ఇవ్వగలదు. ఈ వాక్యంలో భర్తలను స్పష్టంగా పేర్కొనకపోవడంతో ప్రధాన పాఠంలో ‘స్త్రీలు’ను ఎంచుకుని, ‘భార్యలు’ అనే పఠనాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: మాట్లాడకూడదనే ఆదేశం పరిధి
  choice: మూలంలోని సాధారణ ‘మాట్లాడడం’ అనే భావాన్ని పరిమితం చేయకుండా అనువదించడం
  alternative: అంతరాయం కలిగించే మాటలకు మాత్రమే లేదా ప్రవచనాలను పరిశీలించే మాటలకు మాత్రమే వర్తించే ఆదేశం
  rationale: ఈ వాక్యంలోని గ్రీకు పాఠం కేవలం ‘మాట్లాడడం’ అంటుంది. సందర్భం ఆధారంగా ప్రతిపాదించే సన్నని అర్థాలు వివాదాస్పదమైనందున వాటిని ప్రధాన పాఠంలో చేర్చలేదు.
- issue: ὁ νόμος యొక్క నిర్దిష్ట సూచన
  choice: ధర్మశాస్త్రం
  alternative: ప్రత్యేకంగా మోషే ధర్మశాస్త్రం లేదా మరింత విస్తృతంగా లేఖనం
  rationale: పౌలు ఏ నిర్దిష్ట పాఠాన్ని లేదా విభాగాన్ని సూచిస్తున్నాడో ఈ వాక్యం చెప్పదు. అందువల్ల ప్రధాన పాఠం దాన్ని నిర్దిష్టం చేయకుండా, సాధ్యమైన పరిధిని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘సంఘాలు,’ ‘ధర్మశాస్త్రం,’ ‘లోబడి ఉండాలి’ వంటి స్థిరమైన తెలుగు బైబిలు పదజాలాన్ని సహజ వాక్యనిర్మాణంతో కలిపాం. మూలంలోని మూడు ప్రధాన సందిగ్ధతలను—స్త్రీలు/భార్యలు, మాట్లాడడం యొక్క పరిధి, ధర్మశాస్త్రం యొక్క సూచన—ప్రధాన పాఠంలో సిద్ధాంతపరంగా పరిష్కరించకుండా పాదటిప్పణుల్లో సంరక్షించాం.
