id: 1CO.14.12
reference: 1 Corinthians 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: te
  text: అలాగే మీరు కూడా, ఆత్మసంబంధమైన వరాల[a] పట్ల ఆసక్తి గలవారు కాబట్టి, సంఘ నిర్మాణం కోసం సమృద్ధిగా ఉండాలని ప్రయత్నించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో “ఆత్మసంబంధమైన విషయాలు” లేదా “ఆత్మలు” అని కూడా అర్థమవవచ్చు; ఇక్కడి సందర్భం ఆత్మసంబంధమైన వరాలు లేదా ఆత్మ ప్రత్యక్షతలను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: అలాగే మీరు కూడా
  rationale: ముందటి వచనాల్లోని పోలికను కొనసాగిస్తూ గ్రీకు పదబంధంలోని అన్వయార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπεὶ ζηλωταί ἐστε
  choice: ఆసక్తి గలవారు కాబట్టి
  rationale: ἐπεὶ యొక్క కారణార్థాన్ని, ζηλωταί సూచించే ఉత్సాహపూరితమైన కోరికను సరళంగా వ్యక్తం చేస్తుంది.
- source_word: πνευμάτων
  choice: ఆత్మసంబంధమైన వరాల[a]
  rationale: గ్రీకులో అక్షరార్థంగా ‘ఆత్మల’ అని ఉన్నప్పటికీ, 1 కొరింథీయులు 12–14 అధ్యాయాల సందర్భం ఆత్మసంబంధమైన వరాలు లేదా ప్రత్యక్షతలను సూచిస్తుంది. మూలంలోని సంక్షిప్తతను పాదటిప్పణిలో తెలియజేశాం.
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: సంఘాన్ని బలపరచే విషయంలో
  rationale: οἰκοδομήలోని కట్టడం అనే రూపకానికి గల సామూహిక బలపరచడం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ζητεῖτε ἵνα περισσεύητε
  choice: సమృద్ధిగా ఉండాలని కోరుకోండి
  rationale: ζητεῖτε యొక్క ఆజ్ఞార్థకమైన ఉద్దేశపూర్వక కోరికను, περισσεύητε యొక్క సమృద్ధి భావాన్ని నిలుపుతుంది; గ్రీకులో లేని నిర్దిష్ట కర్మను ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: πνευμάτων అనే బహువచనానికి సందర్భానుసారమైన అర్థం
  choice: ఆత్మసంబంధమైన వరాలు
  alternative: ఆత్మలు; ఆత్మసంబంధమైన విషయాలు లేదా ప్రత్యక్షతలు
  rationale: ఈ అధ్యాయాల సందర్భం పరిశుద్ధాత్మకు సంబంధించిన వరాలు, ముఖ్యంగా భాషలు మరియు ప్రవచనం గురించి మాట్లాడుతుంది. ‘ఆత్మలు’ అనే అక్షరార్థం తెలుగులో ఇతర వ్యక్తిగత ఆత్మలను సూచించినట్లు తప్పుదారి పట్టించవచ్చు; అయినా మూలంలోని నిజమైన పదరూపాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: ἵνα περισσεύητεలో సమృద్ధి దేనిలో అన్న ప్రశ్న
  choice: సంఘాన్ని బలపరచే విషయంలో సమృద్ధిగా ఉండడం
  alternative: ఆ వరాలు మీలో సమృద్ధిగా ఉండడం; సంఘ నిర్మాణానికి వాటిలో రాణించడం
  rationale: గ్రీకు వాక్యం సమృద్ధికి నిర్దిష్ట కర్మను చెప్పకుండా దానిని సంఘ నిర్మాణ లక్ష్యంతో అనుసంధానిస్తుంది. అందువల్ల ‘వాటిలో’ అని చేర్చి భావాన్ని అనవసరంగా నిర్ణయించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సంఘాన్ని బలపరచడం’ అనే ప్రయోగం పౌలు ఉపయోగించిన నిర్మాణ రూపకంలోని సామూహిక భావాన్ని సహజంగా తెలియజేస్తుంది.
