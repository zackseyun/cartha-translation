  source_fidelity: 'ప్రధాన భావం మూలగ్రంథానికి సన్నిహితంగా ఉంది: పౌలు కోరే రెండు విషయాలు, ప్రవచించేవాని తులనాత్మక గొప్పతనం, అర్థవివరణకు సంబంధించిన మినహాయింపు, సంఘ ప్రయోజనం అన్నీ ఉన్నాయి. అయితే οἰκοδομὴν λάβῃ అనేది సంఘం ‘బలపడుతుంది’ అనే సాధారణ ఫలితంకన్నా, సంఘం నిర్మాణం/బలపరచబడటం పొందే ఉద్దేశాన్ని సూచిస్తుంది; దానిని మరింత స్పష్టంగా ప్రతిబింబించడం అవసరం.'
  naturalness: ‘మీరందరూ,’ ‘ప్రవచించేవాడు,’ ‘భాషల్లో మాట్లాడేవాడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉన్నాయి. మినహాయింపు వాక్యాన్ని డ్యాష్‌ల మధ్య ‘అయితే’తో పెట్టడం కొద్దిగా భారంగా ఉంది. ‘అతడు అర్థం చెబితే మాత్రం కాదు’ అనే నిర్మాణం తులనకు వర్తించే మినహాయింపును స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
  terminology: ‘భాషల్లో మాట్లాడడం,’ ‘ప్రవచించడం,’ ‘సంఘం’ అనే పదాలు సందర్భానికి తగినవి. διερμηνεύῃ కోసం ‘అర్థం చెప్పడం’ సరిపోతుంది. οἰκοδομή యొక్క నిర్మాణం/బలపరచడం రూపకాన్ని ‘బలపరచబడుట’ ద్వారా నిలుపుతూ, సంఘం దానిని పొందుతుందనే భావాన్ని చూపాలి.
