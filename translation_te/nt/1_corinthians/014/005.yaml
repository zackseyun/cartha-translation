id: 1CO.14.5
reference: 1 Corinthians 14:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: te
  text: మీరందరూ భాషల్లో మాట్లాడాలని నేను కోరుతున్నాను; అయితే అంతకంటే ఎక్కువగా మీరు ప్రవచించాలని కోరుతున్నాను. భాషల్లో మాట్లాడేవాడికంటే ప్రవచించేవాడు గొప్పవాడు, అతడు అర్థం చెబితే మాత్రం కాదు[a], తద్వారా సంఘం బలపరచబడుటకు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరైనా అర్థం చెబితే మాత్రం కాదు.” గ్రీకు భాషలోని ఏకవచన క్రియ భాషల్లో మాట్లాడే వ్యక్తినే సూచించవచ్చు; లేదా ఈ సందర్భంలో మరింత సాధారణంగా అర్థవివరణ అందించబడటాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “బలపరచబడుట” అనే మాట, కూడివచ్చిన సంఘం నిర్మించబడటం లేదా అభివృద్ధి పొందటం అనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: నేను కోరుతున్నాను
  rationale: వర్తమానకాలంలో పౌలు వ్యక్తపరుస్తున్న నేరమైన కోరికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πάντας ὑμᾶς
  choice: మీరందరూ
  rationale: సంఘంలోని వారందరినీ ఉద్దేశించిన బహువచన సమగ్ర భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: λαλεῖν γλώσσαις
  choice: భాషల్లో మాట్లాడడం
  rationale: γλῶσσαι అనే పదాన్ని ‘భాషలు’గా నిలుపుతూ, మూలంలో లేని ‘తెలియని’ వంటి విశేషణాన్ని చేర్చదు; 1 కొరింథీయులు 12–14 సందర్భంలోని ప్రత్యేకమైన మాటలాడటాన్ని పాఠకుడు సందర్భం ద్వారా గ్రహించగలడు.
- source_word: μᾶλλον δὲ
  choice: అయితే అంతకంటే ఎక్కువగా
  rationale: భాషల్లో మాట్లాడటాన్ని తిరస్కరించకుండా, ప్రవచనానికి పౌలు ఇస్తున్న అధిక ప్రాధాన్యాన్ని సూచిస్తుంది.
- source_word: ἵνα προφητεύητε
  choice: మీరు ప్రవచించాలని
  rationale: θέλω తరువాతి ἵνα ఉపవాక్యం పౌలు కోరుతున్న విషయాన్ని తెలియజేస్తుంది; ఈ రూపం తెలుగులో సహజంగా ఉంది.
- source_word: μείζων
  choice: గొప్పవాడు
  rationale: తులనాత్మకమైన ‘greater’ భావాన్ని నేరుగా నిలుపుతుంది; ఇది వ్యక్తిగత పవిత్రత లేదా హోదాను తప్పనిసరిగా సూచిస్తుందని అనువాదంలో నిర్ణయించదు.
- source_word: ὁ προφητεύων
  choice: ప్రవచించేవాడు
  rationale: క్రియను చేసే వ్యక్తిని సూచించే substantival participle భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὁ λαλῶν γλώσσαις
  choice: భాషల్లో మాట్లాడేవాడు
  rationale: ముందటి పదబంధంతో అనుసంధానాన్ని ఉంచి, పౌలు చేస్తున్న వ్యక్తుల మధ్య తులనను స్పష్టంగా చూపుతుంది.
- source_word: ἐκτὸς εἰ μὴ
  choice: అయితే ... తప్ప
  rationale: ముందు చెప్పిన తులనకు ఉన్న మినహాయింపును సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: διερμηνεύῃ
  choice: అతడు అర్థం చెబితే
  rationale: ఏకవచన క్రియకు సమీపంలోని భాషల్లో మాట్లాడేవాడినే సహజ కర్తగా తీసుకుంటుంది; ‘అనువదించడం’ కంటే ఈ సందర్భంలో ‘అర్థం చెప్పడం’ విస్తృతమైన వ్యాఖ్యాన భావాన్ని ఇస్తుంది.
- source_word: ἡ ἐκκλησία
  choice: సంఘం
  rationale: ఇక్కడ కూడివచ్చిన క్రైస్తవ సమాజాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: οἰκοδομὴν λάβῃ
  choice: బలపడుతుంది
  rationale: అక్షరార్థంలోని కట్టడపు రూపకాన్ని తెలుగులో సహజమైన ఫలితార్థంతో వ్యక్తపరుస్తూ, సంఘం ప్రయోజనం పొందుతుందనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రవచించేవాడు భాషల్లో మాట్లాడేవాడికంటే ‘గొప్పవాడు’ అనడంలోని భావం
  choice: ‘గొప్పవాడు’ అనే తులనను ప్రధాన పాఠ్యంలో యథాతథంగా ఉంచడం
  alternative: సంఘానికి ఎక్కువ ఉపయోగకరుడు
  rationale: ముగింపులోని సంఘం బలపడాలనే ఉద్దేశం ఈ తులనకు కార్యాత్మక సందర్భాన్ని ఇస్తుంది. అయినా మూలంలోని ‘గొప్ప’ అనే తెరవున్న పదాన్ని వివరణాత్మకంగా కుదించకుండా నిలుపుతుంది.
- issue: διερμηνεύῃ క్రియకు కర్త ఎవరు
  choice: భాషల్లో మాట్లాడేవాడే అర్థం చెబుతాడు
  alternative: మరెవరైనా అర్థం చెబుతారు లేదా అర్థవివరణ అందించబడుతుంది
  rationale: కొత్త కర్తను పేర్కొనని ఏకవచన క్రియ, వెంటనే ముందు ఉన్న భాషల్లో మాట్లాడే ఏకవచన వ్యక్తినే సహజంగా కొనసాగిస్తుంది. అయితే అధ్యాయం యొక్క విస్తృత సందర్భంలో మరొకరు అర్థం చెప్పే అవకాశం ఉండటంతో దానిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలో లేని ‘తెలియని భాషలు’ అనే వివరణను చేర్చలేదు. వాక్యంలోని రెండు కోరికలను స్పష్టత కోసం తెలుగులో ‘కోరుతున్నాను’ అని పునరుక్తి చేశాం. మినహాయింపు ఉపవాక్యపు పరిధి స్పష్టంగా ఉండేందుకు దీర్ఘ విరామచిహ్నాలు వాడబడ్డాయి.
