  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: te
  text: ప్రేమను పట్టుదలతో అనుసరించండి. ఆత్మసంబంధమైన వాటిని[a] ఎంతో ఆసక్తితో కోరుకోండి; కానీ మీరు ప్రవచించాలని మరింతగా కోరుకోండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆత్మసంబంధమైన విషయాలను’; సందర్భాన్ని బట్టి, ‘ఆత్మీయ వరాలను.’ గ్రీకు పదబంధం ‘వరాలు’ అనే అర్థం కంటే విస్తృతమైనది; అయితే ఇక్కడి సందర్భం సంఘంలో ఆత్మ అనుగ్రహించే వ్యక్తీకరణలపై దృష్టి పెడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కానీ అంతకంటే మీరు ప్రవచించాలని కోరుకోండి.’
    reason: alternative_rendering
lexical_decisions:
- source_word: Διώκετε
  choice: పట్టుదలతో అనుసరించండి
  rationale: కేవలం ‘కోరుకోండి’ అనే భావం కాకుండా, నిరంతరంగా వెంబడించి సాధించడానికి కృషి చేయాలనే ఆజ్ఞాత్మక బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν ἀγάπην
  choice: ప్రేమను
  rationale: మునుపటి అధ్యాయంతో పదబంధ సంబంధాన్ని నిలుపుతూ ἀγάπηకు సహజమైన, విస్తృతంగా అర్థమయ్యే సమానార్థక పదం.
- source_word: ζηλοῦτε
  choice: ఎంతో ఆసక్తితో కోరుకోండి
  rationale: ζηλόωలోని బలమైన కోరిక, ఉత్సాహం అనే సానుకూల ఆజ్ఞార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ πνευματικά
  choice: ఆత్మసంబంధమైన వాటిని
  rationale: నపుంసక బహువచన విశేషణంలోని ‘ఆత్మీయ విషయాలు/వాటిని’ అనే విస్తృతతను నిలుపుతుంది; ‘వరాలు’ అని మూలంలో లేని నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: μᾶλλον δὲ
  choice: మరీ ముఖ్యంగా
  rationale: ఇతర ఆత్మసంబంధమైన వాటితో పోలిస్తే ప్రవచనానికి పౌలు ఇచ్చే అధిక ప్రాధాన్యాన్ని సహజంగా తెలియజేస్తుంది; δὲలోని స్వల్ప మలుపును విరామచిహ్నం, ‘మరీ’ ద్వారా సూచిస్తుంది.
- source_word: ἵνα προφητεύητε
  choice: మీరు ప్రవచించేలా కోరుకోండి
  rationale: ἵναతో వచ్చిన ఉపవాక్యాన్ని కోరిక యొక్క ప్రత్యేక విషయంగా చూపుతూ, ప్రవచించడాన్ని ప్రధానంగా కోరుకోవాలనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: τὰ πνευματικά యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మసంబంధమైన వాటిని’ అని విస్తృతంగా అనువదించడం
  alternative: ‘ఆత్మీయ వరాలను’ లేదా ‘ఆత్మసంబంధమైన విషయాలను’
  rationale: గ్రీకు పదబంధం ‘వరాలు’ కంటే విస్తృతమైనది. 1 కొరింథీయులు 12–14 సందర్భం సంఘంలో ఆత్మ అనుగ్రహించే వ్యక్తీకరణలపై దృష్టి పెట్టినా, ప్రధాన పాఠ్యం మూలంలోని నిజమైన పదార్థ విస్తృతతను కాపాడుతుంది; సందర్భానుగుణమైన ‘వరాలు’ అనే అర్థాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ప్రవచనానికి ఇచ్చిన ప్రాధాన్యం
  choice: ‘మరీ ముఖ్యంగా, మీరు ప్రవచించేలా కోరుకోండి’
  alternative: ‘అంతకంటే మీరు ప్రవచించాలని కోరుకోండి’
  rationale: μᾶλλον δὲ యొక్క తులనాత్మక ప్రాధాన్యాన్ని నిలుపుతూ, ఇతర ఆత్మసంబంధమైన వ్యక్తీకరణలను నిరాకరించినట్లు లేదా ప్రవచనమే ఏకైక సముచితమైనదని సూచించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘పట్టుదలతో అనుసరించండి’ నిరంతర ప్రయత్నాన్ని సహజంగా తెలియజేస్తుంది. ‘ఆత్మసంబంధమైన వాటిని’ కొద్దిగా విస్తృతమైన పదబంధంగానే ఉంచి, మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడింది; అవసరమైన సందర్భ వివరణను పాదసూచికకు పరిమితం చేసింది.
