id: 1CO.14.6
reference: 1 Corinthians 14:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: te
  text: ఇప్పుడు, సహోదరులారా,[a] నేను మీ దగ్గరికి భాషలతో మాట్లాడుతూ వస్తే,[b] బయలుపాటుతోనో, జ్ఞానంతోనో, ప్రవచనంతోనో, బోధతోనో మీతో మాట్లాడకపోతే, మీకు నావల్ల ఏ ప్రయోజనం కలుగుతుంది?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదర సహోదరీలారా’ అని కూడా అనువదించవచ్చు; గ్రీకులోని ‘సహోదరులు’ అనే పదం స్త్రీపురుషులు కలిసిన సంఘాన్ని ఉద్దేశించి వాడబడవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘భాషలు’ అనే పదం ‘నాలుకలు’ లేదా ‘భాషలు’ అని అర్థమవవచ్చు. ఇక్కడ ఇది 1 కొరింథీయులు 12–14లో చర్చించబడుతున్న మాటల ఘటనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: ఇప్పుడు
  rationale: పౌలు వాదనలోని తదుపరి అంశానికి మార్పును సహజంగా సూచిస్తుంది; δέ లోని స్వల్ప వ్యత్యాస భావాన్ని సందర్భానుసారంగా అతిగా బలపరచదు.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పదంలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతూ, సంఘాన్ని ఉద్దేశించిన గౌరవప్రదమైన సంబోధనగా సహజంగా ఉంది; మిశ్రిత సంఘాన్ని కూడా సూచించగల ప్రయోగాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: γλώσσαις λαλῶν
  choice: భాషలతో మాట్లాడినా
  rationale: γλῶσσα యొక్క ప్రాథమిక ‘భాష’ భావాన్ని నిలుపుతూ, 1 కొరింథీయులు 12–14లో చర్చిస్తున్న ఆత్మసంబంధమైన మాటల ఘటనను ముందుగానే నిర్వచించకుండా ఉంచుతుంది.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: మీకు నావల్ల ఏ ప్రయోజనం కలుగుతుంది?
  rationale: ὠφελέω లోని సహాయం లేదా ప్రయోజనం కలిగించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ప్రశ్నారూపంగా వ్యక్తం చేస్తుంది.
- source_word: ἐὰν μὴ ὑμῖν λαλήσω
  choice: మీతో చెప్పకపోతే
  rationale: ప్రతికూల షరతును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; λαλέω యొక్క సంభాషణాత్మక భావాన్ని ‘మీతో చెప్పడం’ ద్వారా అందిస్తుంది.
- source_word: ἐν ἀποκαλύψει
  choice: దేవుడు బయలుపరచినదానినో
  rationale: ἀποκάλυψις యొక్క ‘బయలుపరచడం/ప్రత్యక్షపరచడం’ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలుపుతుంది; ఇక్కడ దేవుడిని కర్తగా పేర్కొనడం సందర్భంలో అంతర్లీనమైన భావాన్ని సహజ తెలుగులో వెల్లడిస్తుంది.
- source_word: ἐν γνώσει
  choice: జ్ఞానాన్నో
  rationale: γνῶσις కు సమీపమైన, సాంప్రదాయికంగా కూడా సులభంగా అర్థమయ్యే తెలుగు పదం; జాబితా సమాంతరతను నిలుపుతుంది.
- source_word: ἐν προφητείᾳ
  choice: ప్రవచనాన్నో
  rationale: προφητεία అనే సంఘ సంబంధమైన మాటల వర్గాన్ని నిర్వచించకుండా సూటిగా సూచిస్తుంది.
- source_word: ἐν διδαχῇ
  choice: బోధననో
  rationale: διδαχή యొక్క బోధ లేదా ఉపదేశ భావాన్ని సహజంగా అందిస్తూ జాబితా లయను నిలుపుతుంది.
theological_decisions:
- issue: సంఘ సంబోధనలో ἀδελφοί యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’
  alternative: ‘సహోదర సహోదరీలారా’
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం; అయితే పౌలు ప్రయోగంలో అది మిశ్రిత సంఘాన్ని ఉద్దేశించవచ్చు. రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, విస్తృత ప్రయోగాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: γλώσσαις యొక్క స్వభావం
  choice: భాషలతో
  alternative: అన్యభాషలతో; భాషలు మాట్లాడుతూ
  rationale: గ్రీకు పదం ‘నాలుకలు’ లేదా ‘భాషలు’ అని అర్థమవుతుంది. ఇక్కడ 1 కొరింథీయులు 12–14లోని ఆత్మసంబంధమైన ఘటనను సూచించినప్పటికీ, అది మానవ భాషలేనా మరొక విధమైన మాటలా అనే వివాదాన్ని అనువాదం పరిష్కరించదు.
- issue: నాలుగు ἐν పదబంధాల సంబంధం
  choice: తెలుగులో ప్రత్యక్ష కర్మల సమాంతర జాబితా
  alternative: ‘బయలుపాటులోనైనా, జ్ఞానంలోనైనా, ప్రవచనంలోనైనా, బోధలోనైనా’
  rationale: ἐν ఇక్కడ విధం లేదా సాధనాన్ని సూచించవచ్చు. సహజ తెలుగులో ‘ఏదైనా మీతో చెప్పడం’ అనే నిర్మాణం ఆ ప్రయోజనకరమైన సమాచార వర్గాలను స్పష్టంగా చూపుతుంది; గ్రీకు విభక్తి నిర్మాణాన్ని అసహజంగా అనుకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనువైన శైలి. గ్రీకు వాక్యంలోని దీర్ఘ షరతు నిర్మాణాన్ని తెలుగులో సహజమైన క్రమంలో అమర్చి, నాలుగు అంశాల సమాంతరతను నిలిపింది. పాఠ్యంలో [a], [b] సూచికలు రెండూ చేర్చబడ్డాయి.
