id: 1CO.14.36
reference: 1 Corinthians 14:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ ἀφ’ ὑμῶν ὁ λόγος τοῦ θεοῦ ἐξῆλθεν, ἢ εἰς ὑμᾶς μόνους κατήντησεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: te
  text: లేదా, దేవుని వాక్యం మీ నుంచే బయలుదేరిందా?[a] లేక అది మీ దగ్గరకు మాత్రమే చేరిందా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దేవుని వాక్యం మీ నుంచే ఆరంభమైందా?”
    reason: lexical_alternative
  - marker: b
    text: “అది మీకే వచ్చిందా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: లేదా
  rationale: వాక్యారంభంలోని విభజనార్థక ప్రశ్నార్థక కణాన్ని నేరుగా చూపిస్తూ, పౌలు గద్దింపులోని వాక్చాతుర్యాన్ని ప్రశ్నరూపమే వ్యక్తం చేసేలా అనువదించబడింది.
- source_word: ἀφ’ ὑμῶν
  choice: మీ దగ్గర నుంచే
  rationale: ἀπό + షష్ఠీ విభక్తి మూలం లేదా ఆరంభస్థానాన్ని సూచిస్తుంది. ‘నుంచే’ అనే రూపం కొరింథీయులే దానికి మూలమా అనే వ్యంగ్య ప్రశ్నలోని ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: దేవుని వాక్యం
  rationale: పౌలు రచనల్లో బరువుగల సాధారణ పదబంధాన్ని కాపాడుతుంది; దీన్ని సువార్తకు మాత్రమే గానీ, సంఘంలోని ప్రవచనానికి మాత్రమే గానీ పరిమితం చేయదు.
- source_word: ἐξῆλθεν
  choice: బయలుదేరిందా
  rationale: ἐξέρχομαι యొక్క ‘బయటకు వెళ్లడం/బయలుదేరడం’ అనే చిత్రాన్ని నిలుపుతుంది. సందర్భంలో ‘ఆరంభమైందా’ అనే భావం సాధ్యమైనందున దాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: εἰς ὑμᾶς μόνους
  choice: మీ దగ్గరకు మాత్రమే
  rationale: గమ్యాన్ని సూచించే εἰς భావాన్నీ, μόνους లోని ప్రత్యేకత లేదా ఏకైకత్వ ఉద్ఘాటననూ సహజంగా తెలియజేస్తుంది.
- source_word: κατήντησεν
  choice: చేరిందా
  rationale: καταντάω లోని ‘గమ్యానికి చేరడం’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘దేవుని వాక్యం’ అనే పదబంధం దేనిని సూచిస్తుంది?
  choice: ‘దేవుని వాక్యం’ అని విస్తృతార్థాన్ని నిలిపి ఉంచడం
  alternative: ప్రత్యేకంగా సువార్త సందేశం; లేదా సంఘంలో పలికే ప్రవచన వాక్యం
  rationale: ఈ సందర్భంలో దేవుని అధికారపూర్వక సందేశానికి తామే మూలమో లేదా ఏకైక గ్రహీతలో అన్నట్లు ప్రవర్తించే కొరింథీయులను పౌలు ప్రశ్నిస్తున్నాడు. మూలపాఠం సూచనను సంకుచితం చేయకుండా దాని భావ విస్తృతిని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. రెండు సమాంతర ప్రశ్నల నిర్మాణం, ‘నుంచే/మాత్రమే’ అనే ఉద్ఘాటనలు పౌలు పలికిన పదునైన వాక్చాతుర్య గద్దింపును నిలుపుతాయి. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
