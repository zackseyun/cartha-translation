id: 1CO.14.17
reference: 1 Corinthians 14:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σὺ μὲν γὰρ καλῶς εὐχαριστεῖς, ἀλλ’ ὁ ἕτερος οὐκ οἰκοδομεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: te
  text: ఎందుకంటే నీవు కృతజ్ఞతలు బాగానే చెబుతున్నావు; కానీ మరొక వ్యక్తి బలపడడం లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిర్మించబడడం లేదు.”
    reason: οἰκοδομεῖται అనే పదంలోని ‘కట్టడం/నిర్మించడం’ రూపకాన్ని మరింత నేరుగా చూపించే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: σὺ
  choice: నువ్వు
  rationale: రెండవ పురుష ఏకవచనాన్ని స్పష్టంగా నిలుపుతుంది; పౌలు ఒక వ్యక్తిని నేరుగా ఉద్దేశిస్తున్నాడు.
- source_word: μὲν γὰρ
  choice: ఎందుకంటే ... బాగానే
  rationale: γάρ యొక్క వివరణాత్మక భావాన్ని ‘ఎందుకంటే’ తెలియజేస్తుంది; μέν తరువాతి ἀλλάతో ఏర్పడే అంగీకార-వ్యతిరేక నిర్మాణాన్ని ‘బాగానే ... కానీ’ సహజంగా నిలుపుతుంది.
- source_word: καλῶς
  choice: బాగానే
  rationale: ‘మంచిగా/సరిగ్గా’ అనే అనుకూల అంచనాను తెలియజేస్తూనే, తరువాత వచ్చే వ్యతిరేకతకు తగిన concessive భావాన్ని ఇస్తుంది.
- source_word: εὐχαριστεῖς
  choice: కృతజ్ఞతలు ... చెల్లిస్తున్నావు
  rationale: సమాజ ఆరాధనలో దేవునికి కృతజ్ఞతలు చెప్పడాన్ని సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: ἀλλ’
  choice: కానీ
  rationale: ప్రధాన వ్యతిరేకతను నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὁ ἕτερος
  choice: అవతలి వ్యక్తి
  rationale: సమావేశంలో మాట్లాడుతున్న వ్యక్తి కాకుండా ఉన్న మరొకరిని సూచిస్తుంది; ‘ఇతరుడు’ కంటే ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: οὐκ οἰκοδομεῖται
  choice: అభివృద్ధి పొందడం లేదు
  rationale: οἰκοδομέω యొక్క కట్టడం అనే రూపకాన్ని తెలుగు క్రైస్తవ వాడుకలోని ‘అభివృద్ధి’ ద్వారా నిలుపుతూ, ఆ వ్యక్తికి ప్రయోజనం లేదా బలపాటు కలగడం లేదనే సందర్భార్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: సమాజ సందర్భంలో οἰκοδομέω అనే పౌలు రూపకం
  choice: అభివృద్ధి పొందడం లేదు
  alternative: బలపడడం లేదు
  rationale: ఈ పదాన్ని కేవలం జ్ఞానబోధగా లేదా ఒక నిర్దిష్ట సిద్ధాంతపరమైన ఆత్మీయ ప్రక్రియగా పరిమితం చేయకుండా, సమాజంలో వ్యక్తికి కలిగే నిర్మాణాత్మక ప్రయోజనాన్ని విస్తృతంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘నువ్వు’ ద్వారా గ్రీకు ఏకవచనం నిలుపబడింది; వాక్యంలోని అంగీకారం తరువాత వ్యతిరేకత సహజంగా వ్యక్తమైంది.
