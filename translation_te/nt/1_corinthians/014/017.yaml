  revision_rationale: The revision preserves γάρ (“ఎందుకంటే”), the concessive acknowledgment set against ἀλλά (“బాగానే ... కానీ”), and the direct singular address (“నీవు”). It replaces a generalized rendering of οἰκοδομεῖται with a strengthening expression and supplies a footnote that explicitly preserves the underlying construction metaphor. No doctrinal interpretation is added.
