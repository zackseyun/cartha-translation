id: 1CO.14.14
reference: 1 Corinthians 14:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: te
  text: ఎందుకంటే, నేను ఒక భాషలో[a] ప్రార్థిస్తే, నా ఆత్మ ప్రార్థిస్తుంది; కానీ నా మనస్సు ఫలరహితంగా ఉంటుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక నాలుకతో.’ గ్రీకు పదం మానవ భాషను సూచించవచ్చు; ఈ అధ్యాయం అంతటా అది ఆత్మప్రేరిత వాక్కును సూచించే ‘నాలుక’ అనే భావంలోనూ వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా అవగాహన ఫలరహితంగా ఉంటుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: ఎందుకంటే, ... ప్రార్థిస్తే
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, ἐάν యొక్క షరతును ‘-తే’ రూపంతో సహజమైన తెలుగులో నిలిపాము.
- source_word: προσεύχωμαι
  choice: నేను ... ప్రార్థిస్తే
  rationale: ἐάν తరువాత ఉన్న వర్తమాన సుబ్జంక్టివ్‌ను తెలుగు షరతు రూపంలో సహజంగా అనువదించాము.
- source_word: γλώσσῃ
  choice: ఒక భాషలో
  rationale: ఏకవచన దత్తివును నిలుపుతూ, γλῶσσα సూచించగల ‘భాష/నాలుక’ అర్థాలలో సందర్భానికి సహజమైన ‘భాష’ను ప్రధాన పాఠంలో ఎంచుకున్నాము; అధ్యాయంలోని ఆత్మప్రేరిత వాక్కు భావాన్ని పాదటీపు ద్వారా తెరిచి ఉంచాము.
- source_word: τὸ πνεῦμά μου
  choice: నా ఆత్మ
  rationale: స్వామ్యసూచకమైన ‘నా’ను నేరుగా నిలిపి, పరిశుద్ధాత్మ అని వ్యాఖ్యానాత్మకంగా నిర్ణయించకుండా వక్త యొక్క ఆత్మ అనే సహజ పఠనాన్ని ఇచ్చాము.
- source_word: προσεύχεται
  choice: ప్రార్థిస్తుంది
  rationale: గ్రీకు సాధారణ వర్తమాన భావాన్ని సహజమైన తెలుగు వర్తమాన క్రియతో వ్యక్తం చేశాము.
- source_word: ὁ δὲ νοῦς μου
  choice: కానీ నా మనస్సు
  rationale: δέ లోని వ్యతిరేకతను ‘కానీ’తో, νοῦς యొక్క విస్తృత భావాన్ని సంకుచితం చేయకుండా ‘మనస్సు’తో అనువదించాము.
- source_word: ἄκαρπός ἐστιν
  choice: ఫలించదు
  rationale: ἄκαρπος లోని ఫలరూపకాన్ని సహజమైన తెలుగు క్రియారూపంలో నిలిపాము; ‘ప్రయోజనం కలిగించదు’ వంటి వివరణాత్మక విస్తరణను నివారించాము.
theological_decisions:
- issue: τὸ πνεῦμά μου (‘నా ఆత్మ’) దేనిని సూచిస్తుంది?
  choice: వక్త యొక్క ఆత్మగా అనువదించడం
  alternative: వక్తలోని పరిశుద్ధాత్మగా అర్థం చేసుకోవడం
  rationale: ‘నా’ అనే స్వామ్యసూచన మరియు ‘నా మనస్సు’తో ఉన్న వ్యత్యాసం వక్తలోని మానవ ఆత్మను సూచించే పఠనానికి బలం ఇస్తాయి. అయినా మూలంలో లేనిదాన్ని చేర్చి పరిశుద్ధాత్మను స్పష్టంగా నిరాకరించకుండా ‘నా ఆత్మ’ అనే పదబంధాన్నే నిలిపాము.
- issue: γλώσσῃ యొక్క స్వభావం
  choice: ప్రధాన పాఠంలో ‘ఒక భాషలో’; పాదటీపులో ‘ఒక నాలుకతో’ అనే ప్రత్యామ్నాయం మరియు సందర్భార్థం
  alternative: ‘అన్యభాషలో’ అని నేరుగా అనువదించడం
  rationale: γλῶσσα మానవ భాషనూ, ఈ అధ్యాయంలో ఆత్మప్రేరిత వాక్కుగా చెప్పబడే ‘నాలుక’నూ సూచించగలదు. ‘అన్యభాష’ అని అనువదిస్తే మూలంలో లేని ‘అన్య’ భావం చేరుతుంది; అందువల్ల అస్పష్టతను పాదటీపుతో కాపాడాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘ఆత్మ—మనస్సు’ వ్యత్యాసం మరియు ‘ఫలం’ రూపకం నిలుపబడ్డాయి. ప్రతి పాదటీపు సూచిక ప్రధాన పాఠంలో చేర్చబడింది.
