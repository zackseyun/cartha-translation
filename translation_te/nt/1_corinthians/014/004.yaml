id: 1CO.14.4
reference: 1 Corinthians 14:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ λαλῶν γλώσσῃ ἑαυτὸν οἰκοδομεῖ· ὁ δὲ προφητεύων ἐκκλησίαν οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: te
  text: ఒక భాషలో[a] మాట్లాడేవాడు[b] తనను తాను బలపరచుకుంటాడు; అయితే ప్రవచించేవాడు సంఘాన్ని[c] బలపరుస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదానికి అక్షరార్థం ‘నాలుక.’ ఈ అధ్యాయంలో ఈ పదం ఆత్మీయ వరమైన భాషాపలుకును సూచిస్తున్నట్లు కనిపిస్తుంది; అయితే ఆ పలుకు యొక్క ఖచ్చిత స్వభావం గురించి భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో పుంలింగ ఏకవచనం ఉంది; ఇక్కడ అది ప్రతినిధిగా సాధారణ వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘సభను’ లేదా ‘సమాజాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: మాట్లాడేవాడు
  rationale: నిర్దిష్ట ఉపపదంతో కూడిన వర్తమాన కృదంతం ఒక ప్రతినిధి వ్యక్తిని సూచిస్తుంది. తెలుగు ఏకవచన కర్తృరూపం గ్రీకు నిర్మాణాన్నీ, తరువాతి ‘ప్రవచించేవాడు’తో ఉన్న సమాంతరాన్నీ నిలుపుతుంది.
- source_word: γλώσσῃ
  choice: ఒక భాషలో
  rationale: ఉపపదం లేని ఏకవచన చతుర్థీ రూపాన్ని సహజమైన తెలుగులో ఏకవచనంగానే అందిస్తుంది. ఇది సాధారణ భాషనా, విదేశీ భాషనా, ఆత్మప్రేరిత ప్రత్యేక పలుకునా అనే వివాదాన్ని ప్రధాన పాఠ్యంలో తేల్చదు.
- source_word: ἑαυτὸν
  choice: తనను తాను
  rationale: గ్రీకులోని ఆత్మవాచక సర్వనామాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది. ‘మాట్లాడేవాడు’ అనే పుంలింగ ఏకవచన రూపంతో సరిపోతూ, సాధారణ సూత్రాన్ని సూచిస్తుంది.
- source_word: οἰκοδομεῖ
  choice: బలపరచుకుంటాడు / బలపరుస్తాడు
  rationale: ఇక్కడ οἰκοδομέω భౌతిక నిర్మాణం కాక రూపకాలంకారంగా వ్యక్తి లేదా సమాజం అభివృద్ధి చెంది బలపడటాన్ని సూచిస్తుంది. తెలుగులో ‘బలపరచు’ సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ఆత్మవాచక కర్మతో మొదటి చోట ‘బలపరచుకుంటాడు’గా వచ్చింది.
- source_word: ὁ δὲ προφητεύων
  choice: అయితే ప్రవచించేవాడు
  rationale: δέ సూచించే మృదువైన వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది. కృదంతాన్ని కర్తృనామ రూపంలో అనువదించడం మొదటి వాక్యభాగంతో సమాంతరతను కాపాడుతుంది.
- source_word: ἐκκλησίαν
  choice: సంఘాన్ని
  rationale: పౌలు సందర్భంలో ఇది కూడివచ్చిన క్రైస్తవ సమాజాన్ని సూచిస్తుంది. ఆధునిక తెలుగు క్రైస్తవ వాడుకలో ‘సంఘం’ సహజమైన పదం; ‘సభ’ లేదా ‘సమాజం’ అనే అర్థసాధ్యతను పాదటిప్పణి నమోదు చేస్తుంది.
theological_decisions:
- issue: 1 కొరింథీయులు 12–14లో γλώσσῃ స్వభావం
  choice: ‘ఒక భాషలో’ అని అనువదించి, ఆ పలుకు యొక్క ఖచ్చిత స్వభావాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా ఉంచడం
  alternative: ‘అన్యభాషలో,’ ‘విదేశీ భాషలో,’ లేదా ‘పరవశ పలుకుతో’
  rationale: సందర్భం ఆత్మీయ వరమైన భాషాపలుకును చర్చిస్తున్నప్పటికీ, అది తెలిసిన విదేశీ భాషేనా లేక మరో విధమైన ఆత్మప్రేరిత పలుకా అన్నది పదమే ఖచ్చితంగా తేల్చదు. అందువల్ల ఏ ప్రత్యేక సిద్ధాంతాన్నీ పాఠ్యంలో బలవంతంగా చేర్చలేదు.
- issue: పుంలింగ ఏకవచన రూపాల ప్రతినిధి ప్రయోగం
  choice: ‘మాట్లాడేవాడు … తనను తాను’
  alternative: లింగాన్ని వ్యక్తపరచని ‘మాట్లాడే వ్యక్తి … తనను తాను’
  rationale: గ్రీకు పుంలింగ ఏకవచన కృదంతం, ఆత్మవాచక సర్వనామం సాధారణ ప్రతినిధి భావంలో ఉన్నాయి. తెలుగు రూపం మూలంలోని వ్యాకరణ ఆకారాన్ని నిలుపుతూ, మాటను కేవలం పురుషులకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘బలపరచు’ అనే రూపం మూలంలోని నిర్మాణ రూపకానికి చెందిన ఆధ్యాత్మిక/సామూహిక అభివృద్ధి భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా అందిస్తుంది. ‘ప్రవచించు’ అనే స్థిరమైన పదం మూలంలోని προφητεύωను అనవసర వివరణ లేకుండా ప్రతిబింబిస్తుంది.
