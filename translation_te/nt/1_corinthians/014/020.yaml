id: 1CO.14.20
reference: 1 Corinthians 14:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: te
  text: సోదరులారా[a], ఆలోచనలో పిల్లలుగా మారకండి. కాని చెడు విషయంలో[b] పసిపిల్లలుగా ఉండండి; ఆలోచనలో మాత్రం పరిణతి చెందినవారిగా మారండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సోదరీ సోదరులారా’; గ్రీకులో పురుష బహువచనమైన ‘సోదరులు’ అనే పదం సంఘాన్ని సంబోధించడానికి వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దురుద్దేశం విషయంలో’; κακία అనే గ్రీకు పదానికి చెడు, దుష్టత్వం, లేదా దురుద్దేశం అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: సోదరులారా
  rationale: సంబోధనార్థక పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సంఘమంతటికీ వర్తించే సంబోధన భావాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: παιδία
  choice: పిల్లలు
  rationale: సాధారణంగా పిల్లలను సూచిస్తుంది; νηπιάζετε మరియు τέλειοι మధ్యనున్న వయోపరిపక్వత వ్యత్యాసాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: γίνεσθε
  choice: మారకండి / మారండి
  rationale: γίνομαι యొక్క ‘అవడం, మారడం’ అనే క్రియాబలాన్ని, రెండు చోట్ల ఉన్న వాక్య సమాంతరతను నిలుపుతుంది.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: ఆలోచనలో
  rationale: φρήν ఇక్కడ ఆలోచనా లేదా అవగాహనా సామర్థ్యాన్ని సూచిస్తుంది; తెలుగు వాడుకలో సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: τῇ κακίᾳ
  choice: చెడు విషయంలో
  rationale: κακία యొక్క విస్తృత నైతిక భావాన్ని నిలుపుతుంది; ‘దురుద్దేశం’ అనే మరింత పరిమిత భావాన్ని పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇస్తుంది.
- source_word: νηπιάζετε
  choice: పసిపిల్లలుగా ఉండండి
  rationale: ‘పసిపిల్లగా ఉండడం’ అనే క్రియార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, పిల్లలు—పసిపిల్లలు—పరిణతి అనే ఉద్దేశపూర్వక వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: τέλειοι
  choice: పరిణతి చెందినవారు
  rationale: ఈ సందర్భంలో τέλειος పాపరహిత పరిపూర్ణతకన్నా మానసిక పరిపక్వతను సూచిస్తుంది.
- source_word: ἀλλὰ ... δὲ
  choice: అయితే ... మాత్రం
  rationale: మొదటి వ్యత్యాసాన్ని, ఆపై చెడు నుండి ఆలోచనవైపు జరిగే వాక్య మలుపును సహజ తెలుగులో స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: లింగసూచక సంఘ సంబోధన
  choice: ప్రధాన పాఠ్యంలో ‘సోదరులారా’ అని ఉంచి, అది సోదరీసోదరులందరినీ ఉద్దేశించిన సంఘ సంబోధన కావచ్చని పాదటిప్పణిలో పేర్కొనడం.
  alternative: సోదరీ సోదరులారా
  rationale: గ్రీకు పదంలోని పురుష బహువచన రూపం పాఠ్యంలో కనిపించేలా ఉంచుతూనే, మిశ్రమ సంఘానికున్న సందర్భానుగత సమగ్ర వర్తింపును పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని ఆజ్ఞారూపం, మూడు దశల వ్యత్యాసం, ‘మారడం’ అనే క్రియాబలం నిలుపబడ్డాయి.
