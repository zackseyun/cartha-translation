id: 1CO.14.21
reference: 1 Corinthians 14:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: te
  text: 'ధర్మశాస్త్రంలో ఇలా రాయబడి ఉంది: “వేరే భాషలు మాట్లాడేవారి ద్వారా, పరదేశుల పెదవుల ద్వారా నేను ఈ ప్రజలతో మాట్లాడతాను.[a] అయినా ఈ విధంగా కూడా వారు నా మాట వినరు,” అని ప్రభువు చెబుతున్నాడు.[b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “వేరే భాషల ద్వారా, ఇతరుల పెదవుల ద్వారా.”'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “వారు నా మాటకు లోబడరు.”'
    reason: lexical_alternative
  - marker: c
    text: ఈ ఉల్లేఖనం యెషయా 28:11–12ను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
  - marker: d
    text: ఇది ఇశ్రాయేలు దేవుడు పలికిన మాటల ఉల్లేఖనం కాబట్టి, హెబ్రీ నేపథ్యాన్ని ప్రతిబింబిస్తూ కొందరు “యెహోవా చెబుతున్నాడు” అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: ధర్మశాస్త్రంలో
  rationale: ఇక్కడ νόμος పంచగ్రంథాలకే పరిమితం కాకుండా యూదుల లేఖన సమాహారాన్ని విస్తృతంగా సూచిస్తుంది; ఉదాహరణ యెషయా నుండి వచ్చినప్పటికీ పౌలు వాడిన సంప్రదాయ పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: γέγραπται
  choice: ఇలా రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే గ్రీకు సంపూర్ణ కర్మణి సూత్రానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἑτερογλώσσοις
  choice: వేరే భాషలు మాట్లాడేవారి ద్వారా
  rationale: ‘వేరొక భాషకు చెందిన’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, చుట్టుపక్కల సందర్భంలోని భాషల అంశంతో సంబంధాన్ని నిలుపుతుంది.
- source_word: χείλεσιν ἑτέρων
  choice: పరదేశుల పెదవుల ద్వారా
  rationale: ‘పెదవులు’ అనే ఉల్లేఖన చిత్రాన్ని నిలుపుతూ, ἑτέρων ఇక్కడ ఇతర భాష/ప్రజలకు చెందినవారిని సూచిస్తుందనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: λαλήσω
  choice: నేను ... మాట్లాడతాను
  rationale: సాధారణ భవిష్యత్ క్రియకు సహజమైన, గంభీరమైన సమానార్థక రూపం.
- source_word: τῷ λαῷ τούτῳ
  choice: ఈ ప్రజలతో
  rationale: λαός కు ‘ప్రజలు’ సహజమైన ఎంపిక; తెలుగులో ‘మాట్లాడు’తో ‘తో’ విభక్తి సహజంగా ఉండి, ఉద్దేశిత గ్రహీతను స్పష్టంగా చూపుతుంది.
- source_word: οὐδ’ οὕτως
  choice: అయినా ఈ విధంగా కూడా
  rationale: అసాధారణమైన ఈ మార్గం ద్వారానైనా వారు స్పందించరనే οὐδέ + οὕτως యొక్క బలాన్ని కాపాడుతుంది.
- source_word: εἰσακούσονταί μου
  choice: వారు నా మాట వినరు
  rationale: εἰσακούω లోని వినడం మరియు ఆలకించడం అనే భావాలను సహజమైన తెలుగులో అందిస్తుంది; ‘నా మాటకు లోబడరు’ అనే బలమైన ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: λέγει κύριος
  choice: అని ప్రభువు చెబుతున్నాడు
  rationale: గ్రీకు వర్తమాన ఉల్లేఖన సూత్రాన్ని సహజంగా అందిస్తూ κύριος ను ‘ప్రభువు’గా అనువదిస్తుంది.
theological_decisions:
- issue: దైవవాక్య ఉల్లేఖనంలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: గ్రీకు పాఠంలో κύριος ఉన్నందున ప్రధాన పాఠంలో ‘ప్రభువు’ను ఉంచాం. అయితే యెషయా నేపథ్యంలోని హెబ్రీ దైవనామాన్ని ప్రతిబింబించేందుకు ‘యెహోవా’ను పాదటిప్పణిలో ప్రత్యామ్నాయంగా సూచించాం.
- issue: εἰσακούσονταί μου లో వినడం లేదా విధేయత భావం
  choice: వారు నా మాట వినరు
  alternative: వారు నా మాటకు లోబడరు
  rationale: గ్రీకు పదం వినడం/ఆలకించడం అనే ప్రాథమిక భావంతో పాటు మాటను పట్టించుకోవడం అనే ఛాయను కలిగి ఉంది. ప్రధాన పాఠం ఆ ద్వంద్వార్థాన్ని సాధ్యమైనంతవరకు తెరిచి ఉంచుతుంది; విధేయత భావాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. గ్రీకు పాఠంలోని రూపకాన్ని, ఉద్దేశపూర్వక అస్పష్టతను పాదటిప్పణులతో సంరక్షించింది.
