id: 1CO.14.16
reference: 1 Corinthians 14:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: te
  text: లేకపోతే, నీవు ఆత్మలో[b] దీవెన పలికితే, అవగాహన లేని వ్యక్తిగా అక్కడ ఉన్నవాడు నీ కృతజ్ఞతలు చెప్పినప్పుడు[c] “ఆమేన్” అని ఎలా చెబుతాడు? నీవు ఏమి చెబుతున్నావో అతనికి తెలియదు కదా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘ఆత్మలో’ అనే మాటకు ‘ఆత్మతో’ అని కూడా అనువదించవచ్చు; గ్రీకు ఇక్కడ అంతకంటే నిర్దిష్టమైన వ్యాఖ్యానాన్ని తప్పనిసరి చేయదు.
    reason: alternative_reading
  - marker: c
    text: ఇక్కడ ‘కృతజ్ఞతలు చెప్పడం’ అంటే దేవునికి కృతజ్ఞత వ్యక్తం చేయడం; తరువాత సాంకేతిక పదంగా వాడుకలోకి వచ్చిన ‘యూకరిస్టు’ అని తప్పనిసరిగా అర్థం కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: లేకపోతే, ... పలికితే
  rationale: ముందటి వాదననుంచి వచ్చే సరిదిద్దే లేదా పర్యవసాన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εὐλογῇς
  choice: దీవెన పలికితే
  rationale: సమాజ ఆరాధనలో మాటలతో పలికే దీవెన అనే భావాన్ని నిలుపుతుంది; కేవలం ‘స్తుతిస్తే’ అని భావాన్ని కుదించదు.
- source_word: πνεύματι
  choice: ఆత్మలో
  rationale: దాతివు సూచించగల సాధనార్థక, పరిధ్యర్థక భావాల్లో ఒక్కదానినే ఖచ్చితంగా నిర్ణయించకుండా గ్రీకు అస్పష్టతను కాపాడుతుంది.
- source_word: ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  choice: అవగాహన లేనివాని స్థానంలో ఉన్నవాడు
  rationale: సమాజంలో ఒక స్థానం లేదా పాత్రను ఆక్రమించడం అనే రూపకాన్ని నిలుపుతూ, పలికిన మాట అర్థం కాని వ్యక్తిపైన సందర్భం పెట్టే బలాన్ని తెలియజేస్తుంది.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: “ఆమేన్” అని ఎలా అంటాడు?
  rationale: సమాజం పలికే సమ్మతి పదమైన ‘ఆమేన్’ను అలాగే ఉంచి, తెలుగులో సహజమైన ప్రశ్నగా అందిస్తుంది.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: నీ కృతజ్ఞతాస్తుతికి
  rationale: ఇక్కడ మాటలతో దేవునికి కృతజ్ఞత చెప్పడాన్ని సూచిస్తుంది; తరువాత ఏర్పడిన సాంకేతిక సంస్కారార్థాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: నీవు ఏమి చెబుతున్నావో అతనికి తెలియదు కదా
  rationale: కారణాన్ని నేరుగా తెలుపుతూ, గ్రీకు ‘తెలియదు’ అనే పదప్రయోగాన్ని మరియు వాక్యంలోని వివరణాత్మక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ఆరాధన సందర్భంలో πνεύματι అర్థం
  choice: ‘ఆత్మలో’ అని సాధారణంగా అనువదించడం
  alternative: ‘తన ఆత్మతో’ లేదా ‘పరిశుద్ధాత్మ ద్వారా’
  rationale: ఇది మాట్లాడేవాని మానవ ఆత్మనా, ఆత్మ ప్రేరేపితమైన మాటనా అనే విషయాన్ని ఈ వచనం ఖచ్చితంగా తేల్చదు; అందువల్ల ఆ వేదాంతపరమైన ఉద్వేగాన్ని అనువాదం పరిష్కరించదు.
- issue: εὐχαριστίᾳ అర్థం
  choice: కృతజ్ఞతాస్తుతి
  alternative: యూకరిస్టు లేదా ప్రభుభోజనం
  rationale: తక్షణ సందర్భం సమాజ ఆరాధనలో అర్థమయ్యేలా కృతజ్ఞత చెప్పడం గురించి ఉంది; తరువాతి సాంకేతిక సంస్కారార్థాన్ని గ్రీకు ఇక్కడ తప్పనిసరి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ఆరాధనా భాషను నిలుపుతూ, ‘ఆత్మ’ మరియు ‘కృతజ్ఞతాస్తుతి’ విషయంలో అనవసరమైన మతశాఖాపరమైన నిర్ధారణలను నివారించింది.
