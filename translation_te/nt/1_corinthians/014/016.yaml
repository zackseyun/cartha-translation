revisions:
- from: లేకపోతే, నీవు ఆత్మలో[b] దీవెన పలికితే, అవగాహన లేనివాని[a] స్థానంలో ఉన్నవాడు నీ కృతజ్ఞతాస్తుతికి[c] “ఆమేన్” అని ఎలా అంటాడు? నీవు ఏమి చెబుతున్నావో అతనికి తెలియదు కదా.
  to: లేకపోతే, నీవు ఆత్మలో[b] దీవెన పలికితే, అవగాహన లేని వ్యక్తిగా అక్కడ ఉన్నవాడు నీ కృతజ్ఞతలు చెప్పినప్పుడు[c] “ఆమేన్” అని ఎలా చెబుతాడు? నీవు ఏమి చెబుతున్నావో అతనికి తెలియదు కదా.
  rationale: The revision improves idiomatic Telugu and removes a possible syntactic misreading of the phrase concerning the ἰδιώτης. It renders εὐχαριστία with a natural verbal expression, preserving the nontechnical sense of giving thanks. Footnote a is retained to preserve viable lexical alternatives, even though the revised body wording does not carry its marker in the supplied draft; the anchor should be placed after ‘వ్యక్తిగా’ in final typesetting.
