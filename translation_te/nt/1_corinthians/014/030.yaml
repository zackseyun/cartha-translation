  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: te
  text: అయితే, కూర్చుని ఉన్న మరొకరికి ఏదైనా బయలుపరచబడితే[a], మొదట మాట్లాడుతున్నవాడు మౌనంగా ఉండాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కూర్చుని ఉన్న మరొకరికి ఏదో ఒకటి బయలుపరచబడితే.’
    reason: lexical_alternative
  - marker: b
    text: అంటే, మరొకరు మాట్లాడేలా మొదట మాట్లాడుతున్న వ్యక్తి మాట్లాడడం ఆపాలి.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: అయితే, ... అయితే
  rationale: ἐὰν షరతును, δὲ స్వల్ప వ్యత్యాసాన్ని లేదా తదుపరి పరిణామాన్ని సూచిస్తాయి. తెలుగులో ‘అయితే’ ఈ రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄλλῳ
  choice: మరొకరికి
  rationale: ప్రస్తుతం మాట్లాడుతున్న వ్యక్తికి భిన్నమైన మరొక సభాసభ్యుణ్ణి సూచించే దత్తివిభక్తి రూపాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀποκαλυφθῇ
  choice: ఏదైనా బయలుపరచబడితే
  rationale: ἀποκαλύπτω యొక్క కర్మణి ప్రయోగాన్ని నిలుపుతూ, గ్రీకు వాక్యంలో ప్రత్యక్ష నామవాచకం లేకపోవడాన్ని ‘ఏదైనా’ ద్వారా ప్రతిబింబిస్తుంది; బయలుపరచే కర్తను వచనం పేర్కొననందున అనువాదమూ పేర్కొనదు.
- source_word: καθημένῳ
  choice: కూర్చున్న
  rationale: ἄλλῳను విశేషించే వర్తమాన కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ πρῶτος
  choice: మొదటివాడు
  rationale: అక్షరార్థమైన ‘మొదటివాడు’ను నిలుపుతుంది; సందర్భంలో ఇది మొదట మాట్లాడుతున్న వ్యక్తిని సూచిస్తుంది.
- source_word: σιγάτω
  choice: మౌనంగా ఉండాలి
  rationale: మూడవ పురుష ఆజ్ఞార్థక భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగు ఆదేశ రూపంలో వ్యక్తం చేస్తుంది; సందర్భానుసారం మాట్లాడడం ఆపాలని సూచిస్తుంది.
theological_decisions:
- issue: సభలో ప్రవచనానికి సంబంధించిన బయలుపాటు స్వభావం
  choice: ‘ఏదైనా బయలుపరచబడితే’ అని కర్మణి రూపంలో అనువదించి, కర్తను స్పష్టంగా పేర్కొనలేదు.
  alternative: ‘మరొకరికి ఒక బయలుపాటు ఇవ్వబడితే’ లేదా ‘దేవుడు మరొకరికి ఏదైనా బయలుపరిస్తే.’
  rationale: మూలంలోని కర్మణి క్రియ బయలుపాటు సంఘటనను సూచించినా, దాని కర్తను ఈ వాక్యంలో ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల దైవిక కర్తను అనవసరంగా చేర్చకుండా మూలంలోని సంయమనాన్ని, భావ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన బోధనా శైలి. ‘బయలుపరచబడితే’ మూలంలోని కర్మణి ప్రయోగాన్ని నిలుపుతుంది; ‘మొదటివాడు’ మూలపు సంక్షిప్తతను కాపాడగా పాదటిప్పణి సందర్భార్థాన్ని వివరిస్తుంది.
