id: 1CO.14.23
reference: 1 Corinthians 14:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: te
  text: కాబట్టి, సంఘమంతా ఒకేచోట కూడి, అందరూ అన్యభాషలలో[a] మాట్లాడుతుంటే, పరిచయం లేనివారో[b] అవిశ్వాసులో లోపలికి వస్తే, “మీకు మతి పోయిందని” అనరా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భాషలలో.” గ్రీకు పదానికి “భాషలు” అనే అర్థం కూడా ఉండవచ్చు. అయితే ఈ సందర్భంలో ఇది ప్రత్యేకమైన మాటల ప్రదర్శనకు ఉపయోగించే స్థిరమైన పదం; అవి మానవ భాషలా, పారవశ్య వాక్కులా, లేక మరేదైనా అన్న విషయాన్ని ఈ అనువాదం నిర్ణయించదు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “సామాన్యులు” లేదా “అవగాహన లేనివారు.” ఇక్కడ సంఘపు ఆచరణల గురించి పరిచయం లేదా బోధన లేనివారిని సూచించే అవకాశం ఉంది; వీరిని “అవిశ్వాసులు” నుండి వేరుగా పేర్కొన్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία ὅλη
  choice: సంఘమంతా
  rationale: ఇక్కడ ἐκκλησία సమావేశమైన క్రైస్తవ సమాజాన్ని సూచిస్తుంది; ὅλη దాని సంపూర్ణతను నొక్కిచెబుతుంది. ‘సంఘమంతా’ సహజంగా ఈ రెండింటినీ వ్యక్తపరుస్తుంది.
- source_word: ἐπὶ τὸ αὐτό
  choice: ఒకేచోట
  rationale: అందరూ ఒకే స్థలంలో కూడడమనే స్థానిక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: λαλῶσιν γλώσσαις
  choice: భాషలతో మాట్లాడుతుండగా
  rationale: γλῶσσαι యొక్క ప్రాథమిక ‘భాషలు/నాలుకలు’ భావాన్ని నిలుపుతూ, ఇక్కడి ఆత్మసంబంధమైన మాటల స్వరూపాన్ని అనవసరంగా నిర్ధారించదు; ప్రత్యామ్నాయంగా స్థిరపడిన ‘అన్యభాషలు’ను పాదటిప్పణిలో ఇస్తుంది.
- source_word: ἰδιῶται
  choice: ఆ విషయాలు తెలియని వారు
  rationale: సంఘంలోని ఆచరణ గురించి సమాచారం లేదా పరిచయం లేనివారనే సందర్భోచిత భావాన్ని తెలియజేస్తూ, తరువాతి ‘అవిశ్వాసులు’తో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: ἄπιστοι
  choice: అవిశ్వాసులు
  rationale: నమ్మని వారిని సూచించే ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: μαίνεσθε
  choice: మీకు మతిపోయింది
  rationale: పిచ్చిగా లేదా బుద్ధి తప్పినట్లుగా ఉన్నారనే నిందను సహజమైన ఆధునిక తెలుగు నుడికారంలో వ్యక్తపరుస్తుంది.
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: అని అనరా?
  rationale: అవుననే సమాధానాన్ని ఆశించే గ్రీకు అలంకారప్రశ్న బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న వాదన నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: συνέλθῃ
  choice: సమావేశమై
  rationale: కలిసి కూడడమనే అర్థాన్ని సందర్భానికి తగిన గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: 1 కొరింథీయులు 14లో γλώσσαι యొక్క స్వరూపం
  choice: ప్రధాన పాఠ్యంలో ‘భాషలతో’ అని అనువదించి, ‘అన్యభాషలతో’ అనే స్థిరపడిన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
  alternative: అన్యభాషలతో మాట్లాడుతుండగా
  rationale: గ్రీకు పదం భాషలను సూచించగలదు; ఈ అధ్యాయంలో అది ఆత్మసంబంధమైన ప్రత్యేక మాటల ప్రదర్శనకు పేరుగా పనిచేస్తుంది. ‘భాషలతో’ మూలపదానికి సన్నిహితంగా ఉండి, అవి తెలిసిన మానవ భాషలా, పారవశ్య వాక్కులా, లేక మరేదైనా అన్న వివాదాన్ని పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదంగా మరియు సహజంగా రూపొందించబడింది. ‘సంఘం,’ ‘అవిశ్వాసులు’ వంటి స్థిరమైన పదాలను ఉంచి, γλώσσαι మరియు ἰδιῶταιలోని నిజమైన అర్థవిస్తృతిని పాదటిప్పణులతో సంరక్షించాం.
