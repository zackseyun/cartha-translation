  source_fidelity: The draft accurately conveys the conditional self-claim, the categories ‘prophet’ and ‘spiritual,’ the imperative to recognize, and the Lord-authority assertion. Supplying ‘commands’ appropriately makes the elliptical κυρίου ἐστίν explicit, while the note preserves the more literal alternative.
