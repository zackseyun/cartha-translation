  terminology: ‘ప్రవక్త,’ ‘ప్రభువు,’ and ‘ఆజ్ఞలు’ are suitable. ‘ఆత్మీయుడు’ naturally represents πνευματικός without over-specifying the precise nature of the person’s spiritual standing or gifting.
