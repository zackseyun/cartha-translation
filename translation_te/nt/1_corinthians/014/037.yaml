id: 1CO.14.37
reference: 1 Corinthians 14:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: te
  text: ఎవరైనా తాను ప్రవక్తనని లేదా ఆత్మీయుడనని భావిస్తే, నేను మీకు రాస్తున్నవి ప్రభువు ఆజ్ఞలని అతడు గుర్తించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మీకు రాస్తున్నవి ప్రభువువి.” గ్రీకు మూలంలో అక్షరార్థంగా “ప్రభువుకు చెందినవి” లేదా “ప్రభువువి” అని ఉంది; భావాన్ని స్పష్టం చేయడానికి ప్రధాన పాఠ్యంలో “ఆజ్ఞలు” అనే పదం చేర్చబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: భావిస్తే
  rationale: ఇక్కడ ఈ పదం ఒక వ్యక్తి తన గురించి చేసుకునే అంచనాను లేదా చెప్పుకునే హోదాను సూచిస్తుంది; ‘భావిస్తే’ సహజంగా ఉండి, పౌలు మాటలోని సరిదిద్దే ధోరణిని నిలుపుతుంది.
- source_word: προφήτης
  choice: ప్రవక్త
  rationale: ఆత్మీయ వరాలు, ప్రవచనం గురించిన సందర్భంలో ఇది ప్రామాణికమైన, స్పష్టమైన సమానార్థకం.
- source_word: πνευματικός
  choice: ఆత్మసంబంధమైనవాడు
  rationale: గ్రీకు విశేషణంలోని సంక్షిప్తతను, అది ఆత్మ చేత వరం పొందిన లేదా నడిపించబడుతున్న వ్యక్తిని సూచించగల విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἐπιγινωσκέτω
  choice: గుర్తించాలి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపం గుర్తించి అంగీకరించాల్సిన బాధ్యతను తెలియజేస్తుంది; తెలుగులో ‘గుర్తించాలి’ సహజంగా ఆ బలాన్ని అందిస్తుంది.
- source_word: ἃ γράφω ὑμῖν
  choice: నేను మీకు రాస్తున్నవి
  rationale: సంబంధ సర్వనామాన్నీ, పత్రిక రాస్తున్న వర్తమాన చర్యనూ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κυρίου ἐστίν
  choice: ప్రభువు ఆజ్ఞలని
  rationale: గ్రీకులో నామవాచకం లేకుండా ‘ప్రభువుకు చెందినవి/ప్రభువువి’ అనే సంక్షిప్త నిర్మాణం ఉంది. సందర్భంలో దాని అధికారపూర్వక బలాన్ని తెలుగులో స్పష్టం చేయడానికి ‘ఆజ్ఞలు’ సరఫరా చేయబడింది; మూలంలోని అస్పష్టతను పాదటిప్పణి తెలియజేస్తుంది.
theological_decisions:
- issue: κυρίου ἐστίν అనే సంక్షిప్త నిర్మాణం
  choice: ‘ప్రభువు ఆజ్ఞలు’ అని ప్రధాన పాఠ్యంలో స్పష్టం చేయడం
  alternative: ‘ప్రభువువి’ లేదా ‘ప్రభువుకు చెందినవి’
  rationale: ఈ అధ్యాయంలో పౌలు తాను రాస్తున్న ఉపదేశాలకు ప్రభువు అధికారం ఉందని నొక్కిచెబుతున్నాడు. అయితే ‘ఆజ్ఞలు’ అనే నామవాచకం గ్రీకులో ప్రత్యక్షంగా లేదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం నిజమైన భాషాత్మక అస్పష్టతను కాపాడుతుంది.
- issue: τις ... προφήτης ... πνευματικός లో లింగ సూచన
  choice: ‘ఎవరైనా ... వాడినని ... అతడు’ అనే వ్యాకరణపరంగా పుంలింగ ఏకవచన నిర్మాణం
  alternative: లింగనిరపేక్ష బహువచన నిర్మాణం
  rationale: గ్రీకు రూపాలు వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉండి, ఏ వ్యక్తినైనా సాధారణంగా సూచిస్తున్నాయి; తెలుగు వాక్యం ఆ రూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఆత్మసంబంధమైనవాడు’ అనే రూపం πνευματικός యొక్క ఉద్దేశపూర్వక విస్తృతతను నిలుపుతుంది; పాదటిప్పణి మూలంలోని κυρίου ἐστίν నిర్మాణ అస్పష్టతను వెల్లడిస్తుంది.
