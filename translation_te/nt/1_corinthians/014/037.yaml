  to: ఎవరైనా తాను ప్రవక్తనని లేదా ఆత్మీయుడనని భావిస్తే, నేను మీకు రాస్తున్నవి ప్రభువు ఆజ్ఞలని అతడు గుర్తించాలి.[a]
