  text: ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ οἰκοδομὴν καὶ παράκλησιν καὶ παραμυθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: te
  text: కాని ప్రవచించేవాడు ప్రజలకు వారిని బలపరచడానికి[a], ప్రోత్సహించడానికి[b], ఓదార్చడానికి[c] మాట్లాడుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలపదానికి అక్షరార్థంగా ‘కట్టడం’; ఇక్కడ ‘అభివృద్ధి చేయడం’ లేదా ‘దృఢపరచడం’ అనే భావం.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రోత్సహించడానికి’ అని అనువదించిన పదానికి ‘ప్రబోధించడానికి’ లేదా కొన్ని సందర్భాల్లో ‘ఆదరించడానికి’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘సాంత్వనపరచడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: కాని ప్రవచించేవాడు
  rationale: వర్తమానకాల కృదంతం వ్యక్తిని సూచిస్తోంది. δέ ముందున్న వాక్యంతో స్వల్ప వ్యత్యాసాన్ని తెలియజేస్తుంది; ‘ప్రవచించేవాడు’ అనే పదం భావాన్ని బోధన లేదా భవిష్యద్వాణికే పరిమితం చేయదు.
- source_word: ἀνθρώποις
  choice: మనుషులతో
  rationale: దత్తి బహువచనం మాటల గ్రహీతలను సూచిస్తుంది. ఇది లింగపరంగా పురుషులకు మాత్రమే పరిమితం కాదు; తెలుగులో ‘మనుషులతో మాట్లాడుతాడు’ సహజమైన ప్రయోగం.
- source_word: λαλεῖ
  choice: మాట్లాడుతాడు
  rationale: λαλέω యొక్క సాధారణ వర్తమానకాల అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἰκοδομὴν
  choice: బలపరచడానికి
  rationale: అక్షరార్థంగా ‘కట్టడం’ అయినా, ఇక్కడ పౌలు వాడుకలో వ్యక్తులను ఆత్మీయంగా వృద్ధి చేసి స్థిరపరచడం అనే రూపకాలంకార భావం ఉంది. ‘బలపరచడం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: παράκλησιν
  choice: ప్రోత్సహించడానికి
  rationale: ఈ పదానికి ప్రోత్సాహం, ప్రబోధం, ఆదరణ అనే భావవ్యాప్తి ఉంది. తరువాతి παραμυθίαతో తేడాను నిలిపేందుకు ‘ప్రోత్సహించడం’ ఎంచుకోబడింది.
- source_word: παραμυθίαν
  choice: ఓదార్చడానికి
  rationale: ఈ పదం ఆదరణనిచ్చే, సాంత్వనపరిచే మాటను సూచిస్తుంది. ‘ఓదార్చడం’ παράκλησις నుండి భేదాన్ని కాపాడుతూ సహజంగా అర్థమవుతుంది.
theological_decisions:
- issue: సంఘ సందర్భంలో ‘ప్రవచించడం’ యొక్క అర్థం
  choice: ‘ప్రవచించేవాడు’ అని ఉంచడం
  alternative: ‘బోధించేవాడు’ లేదా ‘దైవప్రకటన చెప్పేవాడు’ అని సంకుచితం చేయడం
  rationale: మూలపదం యొక్క ధార్మిక భావవ్యాప్తిని నిలిపి, దానిని ప్రసంగం, భవిష్యద్వాణి లేదా ప్రత్యేక ప్రకటన అనే ఏకైక వ్యాఖ్యానానికి పరిమితం చేయకుండా ఉంచుతుంది.
- issue: οἰκοδομή, παράκλησις, παραμυθία అనే మూడు పదాల సంబంధం
  choice: బలపరచడం, ప్రోత్సహించడం, ఓదార్చడం అనే మూడు వేర్వేరు ప్రభావాలుగా అనువదించడం
  alternative: మూడింటినీ సాధారణంగా ‘మేలు చేయడం’ లేదా ‘ఆదరించడం’గా కలిపివేయడం
  rationale: మూలంలోని త్రివిధ నిర్మాణాన్ని, భావసామీప్యం ఉన్నప్పటికీ పదాల మధ్యనున్న సూక్ష్మ భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని స్వల్ప వ్యత్యాసం, వర్తమాన చర్య, మూడు సమాంతర ప్రయోజనాలు నిలుపబడ్డాయి.
