id: 1CO.14.19
reference: 1 Corinthians 14:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: te
  text: కానీ సంఘంలో, ఇతరులకు కూడా బోధించడానికి నా బుద్ధితో ఐదు మాటలు పలకాలని నేను ఇష్టపడతాను; ఒక భాషలో[a] పదివేల మాటలు పలకడం కంటే అది మేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదమైన γλῶσσαకు ‘నాలుక’ లేదా ‘భాష’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ఇది 1 కొరింథీయులు 12–14 అధ్యాయాలలో చర్చించబడిన ప్రత్యేకమైన మాటల విధానాన్ని సూచిస్తుంది.
    reason: γλῶσσα పదంలోని నిఘంటు పరిధిని, ఈ సందర్భంలో దాని స్వభావం గురించి ఉన్న అనిశ్చితిని నిలుపుతుంది; భౌతిక ‘నాలుక’ను తెలుగులో అసహజమైన ప్రత్యామ్నాయంగా చూపదు.
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: సంఘంలో
  rationale: ఇక్కడ ఇది ఆరాధన కోసం కూడిన క్రైస్తవ సమాజాన్ని సూచిస్తుంది. ఆధునిక తెలుగు క్రైస్తవ వాడుకలో ‘సంఘం’ సహజంగా ఉండి, సమకూడిన సమాజం అనే భావాన్ని నిలుపుతుంది.
- source_word: θέλω
  choice: నేను ఇష్టపడతాను
  rationale: ఈ పదానికి మౌలికంగా ‘కోరుతాను’ అనే అర్థం ఉన్నా, ‘కంటే’ అనే వ్యత్యాస నిర్మాణంలో పౌలు ప్రాధాన్యాన్ని వ్యక్తం చేస్తున్నాడు. ‘ఇష్టపడతాను’ ఆ తులనాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πέντε λόγους
  choice: ఐదు మాటలు
  rationale: ఐదు—పదివేలు అనే ఉద్దేశపూర్వక సంఖ్యాత్మక వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τῷ νοΐ μου
  choice: నా మనస్సుతో
  rationale: ‘నా అవగాహనతో’ అని వివరణాత్మకంగా మార్చకుండా νοῦς అనే మానసిక పదాన్ని నేరుగా నిలుపుతూ, అర్థవంతమైన మాటలతో ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: λαλῆσαι
  choice: పలకడం
  rationale: సంఘంలో మాటలుగా వ్యక్తం చేయడాన్ని తెలిపే సహజమైన, గౌరవప్రదమైన తెలుగు క్రియ.
- source_word: ἄλλους κατηχήσω
  choice: ఇతరులకు కూడా బోధించడానికి
  rationale: κατηχέωలోని మౌఖిక ఉపదేశ భావాన్ని తెలియజేస్తుంది; తరువాత ఏర్పడిన సాంకేతిక మతపరమైన అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: μυρίους λόγους
  choice: పదివేల మాటలు
  rationale: μύριοι యొక్క నిర్దిష్ట సంఖ్యాత్మక అర్థాన్ని ఉంచి, ‘ఐదు మాటలు’తో పౌలు చేసిన బలమైన వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἐν γλώσσῃ
  choice: ఒక భాషలో
  rationale: ఏకవచన రూపాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది. ఈ అధ్యాయాల్లో ప్రస్తావించిన ప్రత్యేక మాటల విధానాన్ని పాదసూచిక వివరిస్తుంది; దాని స్వభావాన్ని మూలపాఠం కంటే ఎక్కువగా నిర్వచించదు.
theological_decisions:
- issue: 1 కొరింథీయులు 12–14లో γλῶσσα పదం సూచించే మాటల స్వభావం
  choice: ప్రధాన పాఠంలో ‘ఒక భాషలో’ అని అనువదించి, ప్రత్యక్షమైన ‘నాలుకతో’ అనే అర్థాన్ని పాదసూచికలో ఇచ్చాం.
  alternative: ‘ఒక నాలుకతో’ లేదా వివరణాత్మకంగా ‘అన్యభాషలో’
  rationale: γλῶσσα అంటే ‘నాలుక’ లేదా ‘భాష’ కావచ్చు. ‘ఒక భాషలో’ తెలుగులో సహజంగా ఉన్నా, ఇది సాధారణ విదేశీ భాష మాత్రమే అని తేల్చదు; పాదసూచిక ద్వారా పదంలోని అస్పష్టతను నిలుపుతుంది. ‘తెలియని భాష’ లేదా ‘పరవశ భాష’ వంటి పదాలు మూలంలో లేని వ్యాఖ్యానాన్ని చేర్చేవి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘సంఘం,’ ‘మనస్సు,’ ‘బోధించడం’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. గ్రీకు వాక్యంలోని ఐదు మాటలు—పదివేల మాటలు అనే వాగ్వైభవ వ్యత్యాసం యథాతథంగా నిలుపబడింది.
