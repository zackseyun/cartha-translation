source:
  edition: SBLGNT
  text: εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: te
  text: ఎవరైనా భాషలో మాట్లాడితే, ఇద్దరు, లేదా ఎక్కువైతే ముగ్గురు మాత్రమే మాట్లాడాలి; వారు ఒక్కొక్కరుగా మాట్లాడాలి; ఒకరు దానికి అర్థం చెప్పాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γλώσσῃ
  choice: భాషతో
  rationale: λαλεῖతో వచ్చిన ఈ దత్తివిభక్తి రూపం ఒక భాషలో లేదా భాష అనే ఆత్మీయ వరంతో మాట్లాడడాన్ని సూచించగలదు. తెలుగులో ‘భాషతో’ అనే రూపం మూలంలోని పదాన్ని సహజంగా ఉంచుతూ, ఆ మాటలు మానవ భాషలా లేక పరవశ వాక్కులా అనే వివాదాన్ని తేల్చదు.
- source_word: τις
  choice: ఎవరైనా
  rationale: అనిర్దిష్టమైన, సాధారణ షరతును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λαλεῖ
  choice: మాట్లాడితే
  rationale: εἴτεతో కలిసి సాధారణ షరతును ఏర్పరుస్తుంది; తెలుగులో షరతార్థక రూపం సహజంగా ఉంటుంది.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: ఇద్దరు లేదా అత్యధికంగా ముగ్గురు మాత్రమే మాట్లాడాలి
  rationale: ఇది మాట్లాడేవారి సంఖ్యను పరిమితం చేసే నియమం. ‘మాత్రమే’ పరిమితిని స్పష్టం చేస్తుంది; ‘మాట్లాడాలి’ అనే పూరణ తెలుగులో వాక్యాన్ని సహజంగా చేస్తుంది.
- source_word: ἀνὰ μέρος
  choice: వారు ఒక్కొక్కరుగా మాట్లాడాలి
  rationale: ఒకేసారి కాకుండా వంతులవారీగా, ఒక్కొక్కరు మాట్లాడాలనే పంపిణీ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἷς
  choice: ఒకరు
  rationale: నామవాచకంగా వాడిన సంఖ్యావాచకం; అర్థం చెప్పే ఒక వ్యక్తిని సూచిస్తుంది.
- source_word: διερμηνευέτω
  choice: అర్థం చెప్పాలి
  rationale: సమాజానికి ఆ మాటలు గ్రాహ్యమయ్యేలా వాటి అర్థాన్ని తెలియజేయాలనే ఆజ్ఞ. ‘అనువదించాలి’ అని చెప్పడం కేవలం తెలిసిన మానవ భాషలకే భావాన్ని పరిమితం చేయవచ్చు; ‘అర్థం చెప్పాలి’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఆత్మీయ వరాల సందర్భంలో γλώσσῃ యొక్క అర్థం
  choice: ప్రధాన పాఠంలో ‘భాషతో’ అని అనువదించి, 1 కొరింథీయులు 12–14లో చర్చిస్తున్న మాటల వరాన్ని సూచించనివ్వడం; అది మానవ భాషా లేక పరవశ వాక్కా అని నిర్దిష్టంగా చెప్పకపోవడం.
  alternative: ‘అన్యభాషలో’ అని అనువదించడం; లేదా దానిని ప్రత్యేకంగా విదేశీ మానవ భాషగా గాని పరవశ వాక్కుగా గాని వ్యాఖ్యానించడం.
  rationale: ఈ వచనం మాట్లాడే విధానాన్ని, సంఖ్యను నియంత్రిస్తుంది గాని ఆ వరం స్వభావంపై ఉన్న విస్తృత వివాదాన్ని పరిష్కరించదు. ‘భాషతో’ అనే ఎంపిక ఆ తెరచిన భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘంలో బహిరంగంగా చదవడానికి తగిన గౌరవప్రదమైన సరళ శైలి. మూలంలోని నియమాత్మక స్వరాన్ని ‘మాట్లాడాలి’ మరియు ‘అర్థం చెప్పాలి’ రూపాలతో నిలుపుతూ, తెలుగులో అసహజమైన పదక్రమాన్ని నివారించాం.
