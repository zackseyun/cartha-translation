  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా ఉండేలా ‘భాషలు’ మరియు ‘అర్థం లేనిది’ ప్రధాన పాఠ్యంలో వాడబడ్డాయి. మూలంలోని పదార్థ సందిగ్ధత పాదసూచికలో నిలుపబడింది.
