id: 1CO.14.28
reference: 1 Corinthians 14:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: te
  text: కానీ, అర్థం చెప్పేవాడు లేకపోతే, అతను సంఘంలో[a] మౌనంగా ఉండాలి; తనతో తాను, దేవునితో మాట్లాడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సభలో’ లేదా ‘సమావేశంలో.’
    reason: ἐκκλησίᾳకు సందర్భోచితమైన ‘assembly/congregation’ అనే ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: διερμηνευτής
  choice: అర్థం చెప్పేవాడు
  rationale: అన్యభాషలో పలికినదాన్ని ఇతరులకు అర్థమయ్యేలా వివరించే వ్యక్తిని సందర్భానుసారంగా సహజమైన తెలుగులో సూచిస్తుంది; కేవలం భాషాంతరకుడు అనే భావానికి పరిమితం చేయదు.
- source_word: σιγάτω
  choice: మౌనంగా ఉండాలి
  rationale: మూడవ పురుష ఏకవచన వర్తమాన ఆజ్ఞార్థక రూపంలోని నిర్దేశక బలాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν ἐκκλησίᾳ
  choice: సంఘంలో
  rationale: ఈ అధ్యాయంలోని సందర్భం కూడివచ్చిన క్రైస్తవ సమాజం; ‘సంఘంలో’ అనేది స్థలాన్ని మాత్రమే కాక సమావేశమైన విశ్వాసుల సమూహాన్నీ సహజంగా సూచిస్తుంది.
- source_word: ἑαυτῷ
  choice: తనతో తాను
  rationale: సమకూడిన వారిని ఉద్దేశించని మాటను అదనపు వ్యాఖ్యానం లేకుండా నేరుగా వ్యక్తం చేస్తుంది.
- source_word: λαλείτω
  choice: మాట్లాడాలి
  rationale: ఆజ్ఞార్థక నిర్దేశాన్ని సహజ తెలుగులో కొనసాగిస్తూ, గంభీరతను నిలుపుతుంది.
- source_word: τῷ θεῷ
  choice: దేవునితో
  rationale: మాట దేవునివైపు ఉద్దేశించబడుతుందని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: అయితే, ... లేకపోతే
  rationale: షరతును మరియు ముందరి వాక్యంతో ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: సంఘారాధనలో మౌనంగా ఉండాలనే ఆజ్ఞ పరిధి
  choice: అర్థం చెప్పేవాడు లేనప్పుడు సంఘాన్ని ఉద్దేశించి బహిరంగంగా మాట్లాడకూడదనే నిర్దేశంగా అనువదించబడింది; తనతో తాను, దేవునితో మాట్లాడటం మాత్రం వాక్యంలో నిలుపబడింది.
  alternative: మాట్లాడేవాడు అన్ని విధాల మాటను పూర్తిగా ఆపాలి; లేదా సంఘానికి వినిపించేలా మాట్లాడటం కొనసాగించవచ్చు.
  rationale: ‘సంఘంలో మౌనంగా ఉండాలి’ అనే మాటకు, ‘తనతో తాను, దేవునితో మాట్లాడాలి’ అనే మాట వ్యత్యాసంగా ఉంది. అనువాదం ఈ ఉద్రిక్తతను నిలుపుతుంది; ఆత్మీయ వరాల గురించి ఏ ప్రత్యేక సంప్రదాయ సిద్ధాంతాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. ‘అర్థం చెప్పేవాడు’ సందర్భంలోని కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది. మూలంలోని సంక్షిప్తతను, ఆజ్ఞార్థక బలాన్ని నిలుపుతూ అనవసరమైన వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
