id: 1CO.14.7
reference: 1 Corinthians 14:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: te
  text: నిర్జీవమైన వస్తువులు కూడా శబ్దం చేస్తాయి—వేణువు అయినా వీణ[a] అయినా—అవి స్వరాల్లో భేదాన్ని చూపకపోతే, వేణువుపై లేదా వీణపై వాయించబడుతున్నది ఏమిటో ఎలా తెలుస్తుంది?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం κιθάρα ఒక ప్రాచీన తీగ వాయిద్యాన్ని సూచిస్తుంది; అది నేటి వీణకు సరిగ్గా సమానం కాకపోవచ్చు. దాన్ని ‘లైర్’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως
  choice: అలాగే
  rationale: ముందటి విషయానికి నిర్జీవ వాయిద్యాల ఉదాహరణను జోడించే పోలికను సహజంగా సూచిస్తుంది; సందర్భంలో విరోధార్థకమైన ‘అయినప్పటికీ’ కంటే ఇది తగినది.
- source_word: τὰ ἄψυχα φωνὴν διδόντα
  choice: శబ్దం చేసే నిర్జీవమైన వాయిద్యాలు
  rationale: ‘శబ్దమిచ్చే నిర్జీవమైనవి’ అనే మూలభావాన్ని నిలుపుతూ, సందర్భం సూచించే సంగీత వాయిద్యాలను తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: పిల్లనగ్రోవి అయినా వీణ అయినా
  rationale: αὐλός అనే ఊదే వాయిద్యానికి ‘పిల్లనగ్రోవి’, κιθάρα అనే ప్రాచీన తీగ వాయిద్యానికి సాధారణ పాఠకులకు సుపరిచితమైన ‘వీణ’ వాడబడ్డాయి; చారిత్రక ఖచ్చితత్వానికి పాదసూచిక ఇవ్వబడింది.
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: స్వరాలను స్పష్టంగా వేరు చేసి పలికించకపోతే
  rationale: διαστολή లోని భేదం/వేర్పాటు భావాన్ని, φθόγγοι లోని సంగీత స్వరాల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πῶς γνωσθήσεται
  choice: ఎలా తెలుస్తుంది?
  rationale: భవిష్యత్ కర్మణి రూపంలోని ‘ఎలా గుర్తించబడుతుంది/తెలియబడుతుంది’ అనే అర్థాన్ని తెలుగు ప్రశ్నలో సహజంగా అందిస్తుంది.
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: పిల్లనగ్రోవితో లేదా వీణతో వాయించేది ఏమిటో
  rationale: రెండు కర్మణి కృదంతాలు ఆయా వాయిద్యాలపై వాయించబడుతున్న సంగీతాన్ని సూచిస్తాయి; మూలంలోని సమాంతరతను సంక్షిప్తంగా నిలుపుతుంది.
