source:
  edition: SBLGNT
  text: δύνασθε γὰρ καθ’ ἕνα πάντες προφητεύειν, ἵνα πάντες μανθάνωσιν καὶ πάντες παρακαλῶνται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: te
  text: ఎందుకంటే, అందరూ నేర్చుకోవడానికీ అందరూ ప్రోత్సాహం పొందడానికీ, మీరందరూ ఒక్కొక్కరుగా[a] ప్రవచించగలరు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకేసారి ఒక్కరు.’
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రోత్సాహం పొందడానికి’ అని అనువదించిన గ్రీకు క్రియకు సందర్భానుసారం ‘ప్రబోధం పొందడానికి’ లేదా ‘ఆదరణ పొందడానికి’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: ప్రవచించగలరు
  rationale: రెండవ పురుష బహువచనంలో సామర్థ్యం లేదా సాధ్యతను తెలియజేస్తుంది. తెలుగులో క్రియతో కలిసిన ‘గలరు’ సహజంగా ఈ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి కారణం లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: καθ’ ἕνα
  choice: ఒక్కొక్కరుగా
  rationale: సభలో క్రమంగా ఒకరి తరువాత ఒకరు మాట్లాడే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఒకేసారి ఒక్కరు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: πάντες
  choice: అందరూ / మీరందరూ
  rationale: గ్రీకులో మూడుసార్లు వచ్చిన విస్తృత భావాన్ని, దాని పునరుక్తిని నిలుపుతుంది. మొదటి సందర్భంలో తెలుగు వాక్యానికి అవసరమైన సంబోధిత సమూహాన్ని ‘మీరందరూ’గా చూపగా, తరువాతి రెండు సందర్భాల్లో ‘అందరూ’గా ఉంచాం.
- source_word: προφητεύειν
  choice: ప్రవచించగలరు
  rationale: పౌలు ఉపయోగించిన స్థిరమైన ఆధ్యాత్మిక కార్యవర్గాన్ని వివరణాత్మకంగా సంకుచితం చేయకుండా ‘ప్రవచించు’ అనే ప్రామాణిక పదంతో అనువదించాం.
- source_word: ἵνα
  choice: …డానికీ
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచించే ἵνα భావాన్ని సహజ తెలుగు ఉద్దేశార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: μανθάνωσιν
  choice: నేర్చుకోవడానికి
  rationale: సభలోని వారందరూ నేర్చుకోవాలనే సాధారణ బోధనాత్మక ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: παρακαλῶνται
  choice: ప్రోత్సాహం పొందడానికి
  rationale: παρακαλέω సందర్భానుసారం ప్రోత్సహించడం, బుద్ధిచెప్పడం లేదా ఆదరించడం అనే భావాలు కలిగి ఉంటుంది. సభ క్షేమాభివృద్ధి సందర్భంలో విస్తృతమైన ‘ప్రోత్సాహం పొందడం’ ప్రధాన పాఠ్యంలో సహజంగా సరిపోతుంది; ఇతర భావాలను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: సభా ఉపదేశంలో πάντες (‘అందరూ’) అనే పదం యొక్క పరిధి
  choice: గ్రీకు పునరుక్తిని ‘మీరందరూ… అందరూ… అందరూ’గా నిలిపి, మొదటి ‘అందరూ’ ఎవరిని సూచిస్తుందో మరింత సంకుచితం చేయలేదు.
  alternative: ‘మీరందరూ’ అన్నది ప్రతి విశ్వాసినీ సూచిస్తుందని స్పష్టీకరించడం; లేదా ‘ప్రవక్తలందరూ’ అని పరిమితం చేయడం.
  rationale: మొదటి πάντες సందర్భానుసారం ప్రవచించగల సమూహాన్ని, తరువాతివి వినే లేదా పాల్గొనే సమూహాన్ని సూచించవచ్చు. ‘ప్రవక్తలందరూ’ వంటి వివరణను మూలంలోకి చేర్చకుండా, సందర్భమే పరిధిని నిర్ణయించనిచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సభా-బోధనా శైలి. మూలంలోని కారణసూచక అనుసంధానం, ‘అందరూ’ అనే పునరుక్తి, క్రమంగా ప్రవచించే భావం, అలాగే παρακαλέω పదంలోని విస్తృత భావపరిధి నిలుపబడ్డాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
