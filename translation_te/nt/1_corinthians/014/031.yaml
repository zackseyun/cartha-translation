  source_fidelity: 'ప్రధాన పాఠ్యం గ్రీకు వాక్యార్థాన్ని విశ్వసనీయంగా తెలియజేస్తుంది: γάρ యొక్క కారణసూచక భావం, πάντες యొక్క మూడుసార్ల పునరుక్తి, καθ’ ἕνα యొక్క క్రమభావం, అలాగే ఉద్దేశాన్ని తెలిపే ἵνα వాక్యభాగం నిలిచాయి. ‘మీరందరూ’ అనే మొదటి ప్రయోగం మూలంలోని పరిధి-అస్పష్టతను అనవసరంగా సిద్ధాంతపరంగా పరిమితం చేయదు.'
