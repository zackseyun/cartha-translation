id: 1CO.13.8
reference: 1 Corinthians 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: te
  text: ప్రేమ ఎన్నటికీ విఫలం కాదు[a]. అయితే ప్రవచనాలు ఉన్నా, అవి తొలగించబడతాయి; భాషలు ఉన్నా[b], అవి ఆగిపోతాయి; జ్ఞానం ఉన్నా, అది తొలగించబడుతుంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రేమ ఎన్నటికీ పడిపోదు,’ లేదా ‘ప్రేమకు ఎన్నటికీ అంతం ఉండదు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నాలుకలు.’
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘తొలగించబడుతుంది’ అని అనువదించిన క్రియే ప్రవచనాల విషయంలోనూ వాడబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: పౌలు వర్ణిస్తున్న విస్తృతమైన ప్రేమ భావాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐδέποτε
  choice: ఎన్నటికీ ... కాదు
  rationale: సంపూర్ణ కాలనిరాకరణను సహజమైన తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: πίπτει
  choice: విఫలం కాదు
  rationale: ఇక్కడ ఇది అక్షరార్థమైన ‘పడిపోవడం’ కంటే ప్రేమ నిలకడగా ఉండడాన్ని సూచించే సందర్భానుగుణ ప్రయోగం. తరువాతి క్రియలతో పూర్తిగా కలిపివేయకుండా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: εἴτε δὲ
  choice: అయితే ... అయినా
  rationale: ముందటి వాక్యంతో ఉన్న వ్యత్యాసాన్ని, తరువాత వచ్చే మూడు సమాంతర అంశాలను సహజంగా కలుపుతుంది; గ్రీకులో సూచితంగా ఉన్న నిర్మాణాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: προφητεῖαι
  choice: ప్రవచనాలు
  rationale: ప్రవచన సందేశాలు లేదా ప్రవచించే కార్యాలను సూచించే ప్రామాణికమైన, అర్థమయ్యే పదం.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: తొలగించబడతాయి / తొలగించబడుతుంది
  rationale: వాటి కార్యం నిలిపివేయబడుతుందనే భావాన్ని వ్యక్తం చేస్తూ, రెండు చోట్ల ఉన్న ఒకే గ్రీకు క్రియను తెలుగులోనూ ఒకే విధంగా అనువదిస్తుంది.
- source_word: γλῶσσαι
  choice: భాషలు
  rationale: 1 కొరింథీయులు 12–14 అధ్యాయాల్లో చర్చిస్తున్న ఆత్మసంబంధమైన ఘటనను ‘అన్యభాషలు’ అని ముందే నిర్వచించకుండా, సాధారణంగా అర్థమయ్యే పదంతో సూచిస్తుంది.
- source_word: παύσονται
  choice: ఆగిపోతాయి
  rationale: ‘తొలగించబడతాయి’ అనే చుట్టుపక్కల క్రియకు భిన్నంగా, స్వయంగా నిలిచిపోవడం అనే క్రియా భేదాన్ని కాపాడుతుంది.
- source_word: γνῶσις
  choice: జ్ఞానం
  rationale: తరువాతి వచనాల్లోని పాక్షిక జ్ఞానంతో ఉన్న సంబంధాన్ని నిలుపుతూ, పౌలు వాడుకకు సరిపోయే సాధారణ పదం.
theological_decisions:
- issue: πίπτει అనే క్రియ యొక్క సందర్భార్థం
  choice: ప్రేమ ఎన్నటికీ విఫలం కాదు
  alternative: ప్రేమ ఎన్నటికీ పడిపోదు; ప్రేమకు ఎన్నటికీ అంతం ఉండదు
  rationale: సందర్భం ప్రేమ యొక్క నిలకడను తాత్కాలిక వరాలతో పోలుస్తుంది. ‘విఫలం కాదు’ అనే అనువాదం ప్రేమ నమ్మదగినదిగా నిలుస్తుందనే భావాన్ని ఇస్తుంది; అదే సమయంలో దానిని తరువాతి ‘ఆగిపోవడం/తొలగించబడడం’ క్రియలతో సమానం చేయదు.
- issue: γλῶσσαι యొక్క స్వభావం
  choice: భాషలు
  alternative: నాలుకలు
  rationale: ఈ పదం ఇక్కడ ఆత్మసంబంధమైన వరాన్ని సూచిస్తుంది. ‘భాషలు’ అనే పదం పాఠకునికి సహజంగా ఉండి, అవి తెలిసిన మానవ భాషలా లేక వేరే విధమైన ఘటనలా అనే వివాదాన్ని అనువాదంలోనే తీర్చదు.
- issue: καταργέω మరియు παύω మధ్య క్రియా భేదం
  choice: తొలగించబడతాయి/తొలగించబడుతుంది; ఆగిపోతాయి
  alternative: అన్నిటికీ ‘అంతమవుతాయి’ అని అనువదించడం
  rationale: మూలపాఠంలో ప్రవచనాలు, జ్ఞానం విషయంలో ఒకే క్రియ ఉండగా, భాషల విషయంలో వేరే క్రియ ఉంది. ఆ భేదాన్ని సిద్ధాంతపరమైన నిర్ణయంగా విస్తరించకుండా తెలుగులో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి స్పష్టంగా ఉండే శైలి. మూడు సమాంతర ఉపవాక్యాల లయను నిలుపుతూ, గ్రీకు క్రియల మధ్య ఉన్న భేదాన్ని కాపాడాం. ‘అన్యభాషలు’ అనే మరింత నిర్దిష్ట పదాన్ని వాడకుండా మూలంలోని వ్యాఖ్యాన స్వేచ్ఛను నిలిపాం.
