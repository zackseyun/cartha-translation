revisions:
- from: ప్రేమ ఎన్నటికీ విఫలం కాదు[a]. అయితే ప్రవచనాలైనా, అవి తొలగించబడతాయి; భాషలైనా[b], అవి ఆగిపోతాయి; జ్ఞానమైనా, అది తొలగించబడుతుంది[c].
  to: ప్రేమ ఎన్నటికీ విఫలం కాదు[a]. అయితే ప్రవచనాలు ఉన్నా, అవి తొలగించబడతాయి; భాషలు ఉన్నా[b], అవి ఆగిపోతాయి; జ్ఞానం ఉన్నా, అది తొలగించబడుతుంది[c].
  rationale: The revision makes the three elliptical conditional clauses natural in modern Telugu while retaining their parallelism. It preserves the source's verbal distinction and consistent rendering of καταργέω. Footnote b is made more precise and less potentially misleading; no theological interpretation is introduced.
