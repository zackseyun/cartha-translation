id: 1CO.13.5
reference: 1 Corinthians 13:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἀσχημονεῖ, οὐ ζητεῖ τὰ ἑαυτῆς, οὐ παροξύνεται, οὐ λογίζεται τὸ κακόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/005.yaml
  text: it does not behave disgracefully[a], it does not seek its own, it is not provoked[e][d][c][b], it does not count the wrong.
translation:
  language: te
  text: ప్రేమ అనుచితంగా ప్రవర్తించదు[a]; తన స్వప్రయోజనాన్ని కోరదు[b]; చిరాకు పడదు[c]; కీడును లెక్కలో పెట్టుకోదు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శోభించని విధంగా ప్రవర్తించదు,” “మర్యాద తప్పి ప్రవర్తించదు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తనవాటిని కోరదు”; అంటే, స్వార్థపూరితంగా తన ప్రయోజనాన్నే వెదకదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “రెచ్చిపోదు,” “కోపోద్రిక్తం కాదు.” గ్రీకులో “సులభంగా” అనే మాట లేదు.
    reason: alternative_reading
  - marker: d
    text: లేదా, “కీడును లెక్కించదు.” ఇది తనకు జరిగిన అపకారాలను ఖాతాలో ఉంచుకోకపోవడాన్ని సూచించవచ్చు; గ్రీకు పదబంధం అక్షరార్థంగా “కీడును లెక్కించదు/పరిగణించదు.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: అనుచితంగా ప్రవర్తించదు
  rationale: ఈ క్రియ సిగ్గుచేటైన, మర్యాదకు తగని, శోభించని ప్రవర్తనను సూచిస్తుంది. ‘అనుచితంగా ప్రవర్తించదు’ అనే రూపం కేవలం మొరటుతనానికి పరిమితం కాకుండా దాని విస్తృత సామాజిక-నైతిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: తన స్వప్రయోజనాన్ని కోరదు
  rationale: అక్షరార్థంగా ‘తనవాటిని కోరదు.’ ఇక్కడి గ్రీకు నుడికారం స్వార్థపూరితంగా తన ప్రయోజనాన్నే వెదకడాన్ని సూచిస్తుంది. తెలుగు పాఠకునికి స్పష్టంగా ఉండేందుకు ‘స్వప్రయోజనం’ వాడినా, ‘తన మాటే నెగ్గాలని పట్టుబడదు’ వంటి మరింత సంకుచిత వ్యాఖ్యానాన్ని చేర్చలేదు.
- source_word: παροξύνεται
  choice: చిరాకు పడదు
  rationale: ఈ రూపం తీవ్రంగా ఉద్రేకానికి, చికాకుకు లేదా కోపానికి లోనవడాన్ని సూచిస్తుంది. ‘చిరాకు పడదు’ సహజమైన ఆధునిక తెలుగు; గ్రీకులో లేని ‘సులభంగా’ అనే తీవ్రతా సూచకాన్ని చేర్చలేదు.
- source_word: λογίζεται τὸ κακόν
  choice: కీడును లెక్కలో పెట్టుకోదు
  rationale: λογίζεταιలో లెక్కించడం, ఖాతాలో నమోదు చేయడం, పరిగణించడం అనే భావాలు ఉన్నాయి. ‘లెక్కలో పెట్టుకోదు’ లెక్కల రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది; τὸ κακόνలోని ఏకవచన సామాన్య భావాన్ని ‘కీడు’గా ఉంచి, ‘తనకు చేసిన అపకారాల జాబితా’ అని విస్తరించలేదు.
- source_word: ἀγάπη (సందర్భం నుంచి కొనసాగుతున్న కర్త)
  choice: ప్రేమ
  rationale: ఈ వాక్యంలోని కర్త ముందరి సందర్భం నుంచి వచ్చిన ἀγάπη. తెలుగు వాక్యం స్వతంత్రంగా స్పష్టంగా ఉండేందుకు ‘ప్రేమ’ను ప్రత్యక్షంగా పేర్కొన్నాం.
theological_decisions:
- issue: παροξύνεταιలో లేని తీవ్రతా సూచకాన్ని అనువాదంలో చేర్చాలా
  choice: చిరాకు పడదు
  alternative: సులభంగా కోపపడదు
  rationale: గ్రీకు పాఠ్యంలో ‘సులభంగా’ అనే క్రియావిశేషణం లేదు. దాన్ని చేరిస్తే కొన్ని సందర్భాల్లో కోపానికి లోనవడం ప్రేమకు అనుకూలమే అన్న భావం అనవసరంగా రావచ్చు; అందువల్ల మూలంలోని నిర్దిష్టతను అలాగే ఉంచాం.
- issue: λογίζεται τὸ κακόνను అపకారాల రికార్డు ఉంచడమనే విస్తృత నుడికారంగా మార్చాలా
  choice: కీడును లెక్కలో పెట్టుకోదు
  alternative: తనకు జరిగిన అపకారాలను గుర్తుపెట్టుకోదు
  rationale: ప్రత్యామ్నాయం సందర్భానుకూలమైన అర్థాన్ని స్పష్టపరుస్తుంది, కాని గ్రీకులో లేని ‘తనకు జరిగిన’ అనే సంబంధాన్ని చేర్చి ఏకవచనాన్ని బహువచనంగా మారుస్తుంది. ఎంపిక చేసిన రూపం లెక్కల రూపకాన్నీ, మూలంలోని సంక్షిప్తతనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన లయతో నాలుగు సమాంతర వాక్యభాగాలు ఉంచబడ్డాయి. ‘ప్రేమ’ను ప్రతి భాగంలో పునరావృతం చేయకుండా మొదట ఒక్కసారి పేర్కొన్నాం. సెమీకోలన్లు గ్రీకు వరుసలోని సమాంతర లక్షణాలను స్పష్టంగా చూపిస్తాయి.
