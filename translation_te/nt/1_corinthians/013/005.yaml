  source_fidelity: The Telugu accurately represents all four Greek predicates. “అనుచితంగా ప్రవర్తించదు” retains the broad improper/indecorous sense of ἀσχημονεῖ; “తన స్వప్రయోజనాన్ని కోరదు” communicates the idiomatic self-seeking force of ζητεῖ τὰ ἑαυτῆς without importing a particular manner such as insisting on one’s own way; “చిరాకు పడదు” appropriately renders παροξύνεται without adding “easily”; and “కీడును లెక్కలో పెట్టుకోదు” preserves both the accounting image of λογίζεται and the singular, general τὸ κακόν. The relational implication in footnote d is appropriately presented as a possible contextual sense rather than as part of the translation.
