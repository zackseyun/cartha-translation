source:
  edition: SBLGNT
  text: πάντα στέγει, πάντα πιστεύει, πάντα ἐλπίζει, πάντα ὑπομένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/007.yaml
  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: te
  text: అది అన్నిటినీ సహిస్తుంది[a], అన్నిటినీ నమ్ముతుంది[b], అన్నిటినీ నిరీక్షిస్తుంది, అన్నిటినీ ఓర్చుకొని నిలిచి ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అన్నిటినీ కప్పుతుంది’ లేదా ‘కాపాడుతుంది’; στέγει అనే పదానికి కప్పడం లేదా కాపాడడంతో పాటు సహించడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అన్నిటినీ విశ్వసిస్తుంది’; ఇక్కడ ప్రేమ విచక్షణ లేకుండా ఏదైనా నమ్ముతుందని కాక, నమ్మడానికి మొగ్గు చూపుతుందని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: అన్నిటినీ
  rationale: ప్రతి క్రియతో వచ్చే నపుంసక బహువచన కర్మపదం సమగ్ర భావాన్ని ఇస్తుంది. ‘అన్నిటినీ’ అనే పునరుక్తి మూలంలోని లయను, విస్తృతిని నిలుపుతుంది.
- source_word: στέγει
  choice: సహిస్తుంది
  rationale: ఈ క్రియకు ‘కప్పుతుంది/కాపాడుతుంది’ అనే మూలభావంతో పాటు ‘భరిస్తుంది, సహిస్తుంది’ అనే భావం కూడా ఉంది. ప్రేమ యొక్క నిలకడను వర్ణించే ఈ వరుసలో ‘సహిస్తుంది’ సహజంగా సరిపోతుంది; ‘కప్పిపుచ్చుతుంది’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: πιστεύει
  choice: నమ్ముతుంది
  rationale: πιστεύω సాధారణంగా ‘నమ్మడం’ లేదా ‘విశ్వసించడం’ అని అర్థం. ‘నమ్ముతుంది’ సంక్షిప్త సమాంతర శైలిని నిలుపుతుంది; ఇది విచక్షణలేని అమాయక నమ్మకాన్ని సూచించదు.
- source_word: ἐλπίζει
  choice: నిరీక్షిస్తుంది
  rationale: వర్తమాన కాలరూపం ప్రేమకు నిరంతరంగా ఉండే లక్షణాన్ని వ్యక్తం చేస్తుంది. ‘నిరీక్షిస్తుంది’ ఆశతో ఎదురుచూసే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὑπομένει
  choice: అన్నిటిలో నిలకడగా ఉంటుంది
  rationale: ὑπομένω ఒత్తిడి లేదా కష్టం మధ్య వెనుదిరగకుండా నిలిచి ఉండడాన్ని సూచిస్తుంది. ‘నిలకడగా ఉంటుంది’ సహించడం అనే ముందటి క్రియతో అనవసర పదపునరావృతిని నివారిస్తూ ప్రత్యేక భావాన్ని చూపుతుంది.
theological_decisions:
- issue: ప్రతి క్రియతో పునరుక్తమయ్యే πάντα యొక్క భావం
  choice: ఈ వాక్యం ప్రేమ యొక్క సమగ్రమైన స్థిరత్వాన్ని అలంకారికంగా వర్ణిస్తుంది; ప్రేమ ప్రతిదానినీ ఆమోదిస్తుందని లేదా విచక్షణ లేకుండా నమ్ముతుందని చెప్పదు.
  alternative: ప్రేమ ఎటువంటి మినహాయింపూ లేకుండా ప్రతి విషయాన్నీ నమ్ముతుంది లేదా ఆమోదిస్తుంది అనే సంపూర్ణ అక్షరార్థ పఠనం.
  rationale: తక్షణ సందర్భం ἀγάπη స్వభావాన్ని కావ్యాత్మకంగా వర్ణిస్తోంది. ‘అన్నిటినీ’ అనే పునరుక్తిని ఉంచడం పౌలు వాడిన విస్తృత భాషనూ దానిలోని ఉద్వేగాన్నీ నిలుపుతుంది; అయితే వివరణలో ప్రేమను అమాయకత్వంతో సమానం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని నాలుగు సమాంతర భాగాలనూ ‘అన్నిటినీ/అన్నిటిలో’ పునరుక్తితో నిలుపుతూ, చివరి ὑπομένει యొక్క ఒత్తిడిలో స్థిరంగా నిలిచే ప్రత్యేక భావాన్ని వ్యక్తం చేశాం.
