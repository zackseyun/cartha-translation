id: 1CO.13.10
reference: 1 Corinthians 13:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ τὸ τέλειον, ⸀τὸ ἐκ μέρους καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: te
  text: కానీ సంపూర్ణమైనది వచ్చినప్పుడు[a], పాక్షికమైనది తొలగించబడుతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ‘పూర్తియైనది,’ ‘పరిపక్వమైనది.’ ‘సంపూర్ణమైనది’ (గ్రీకు: to teleion) అనే పదబంధం గురించి భిన్నాభిప్రాయాలు ఉన్నాయి. ప్రస్తుత పాక్షిక స్థితికి భిన్నంగా ఇది సంపూర్ణతను, పరిపక్వతను, లేదా అంత్యకాల పరిపూర్ణ స్థితిని సూచిస్తుందని వివిధ రీతుల్లో అర్థం చేసుకుంటారు.'
    reason: alternative_reading
  - marker: b
    text: లేదా ‘రద్దు చేయబడుతుంది,’ ‘అంతమవుతుంది,’ ‘లేకుండా చేయబడుతుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: వచ్చినప్పుడు
  rationale: భవిష్యత్తులో ఎదురుచూస్తున్న సంఘటనను సూచించే కాలసంబంధ ఉపవాక్యంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: కానీ
  rationale: ముందటి వచనాల్లోని పాక్షిక స్థితికి, రాబోయే సంపూర్ణ స్థితికి మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἔλθῃ
  choice: వచ్చినప్పుడు
  rationale: ὅτανతో కూడిన భూతకాలరూప సబ్జంక్టివ్ ఇక్కడ భవిష్యత్తు సంఘటనను సూచిస్తుంది; తెలుగులో ‘వచ్చినప్పుడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: τὸ τέλειον
  choice: సంపూర్ణమైనది
  rationale: τέλειονలోని సంపూర్ణత భావాన్ని నిలుపుతూ, అది దేనిని సూచిస్తుందో సిద్ధాంతపరంగా ముందే నిర్ణయించకుండా నపుంసక భావంలోని నామవాచక ప్రయోగాన్ని ప్రతిబింబిస్తుంది.
- source_word: τὸ ἐκ μέρους
  choice: పాక్షికమైనది
  rationale: నామవాచకంగా వాడిన గ్రీకు పదబంధాన్ని సంక్షిప్తంగా వ్యక్తం చేసి, ‘సంపూర్ణమైనది’తో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: καταργηθήσεται
  choice: తొలగించబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, పాక్షికమైనది ఇక అమలులో లేకుండా చేయబడుతుందనే భావాన్ని తెలియజేస్తుంది; పూర్తిగా నాశనం చేయబడుతుందనే అదనపు భావాన్ని రుద్దదు.
theological_decisions:
- issue: τὸ τέλειον దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘సంపూర్ణమైనది’ అని సాధారణంగా అనువదించి, దాని నిర్దిష్ట సూచనను నిర్ణయించలేదు.
  alternative: ‘పూర్తియైనది,’ ‘పరిపక్వమైనది,’ లేదా అంత్యకాల సంపూర్ణ స్థితి; కొందరు దీన్ని సంపూర్ణమైన లేఖనసమాహారంగా కూడా అర్థం చేసుకుంటారు.
  rationale: ఈ వచనంలోని గ్రీకు పదబంధం తన సూచనను స్పష్టంగా గుర్తించదు. కాబట్టి అనువాదం ఒక నిర్దిష్ట సిద్ధాంత వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చకుండా, మూలంలోని అర్థవిస్తృతిని మరియు ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘సంపూర్ణమైనది—పాక్షికమైనది’ అనే సమాంతర వ్యత్యాసం మూలపాఠ్య నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల వెంట ఉంచబడ్డాయి.
