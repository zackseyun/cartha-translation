    issue: The main text begins with the unanchored pronoun ‘అది’.
    rationale: Although the subject is recoverable from the wider paragraph, the verse on its own reads more clearly and naturally with ‘ప్రేమ’ as its subject. This also reflects the explicit topic governing the Greek verbal sequence in the immediate context.
  - severity: low
    issue: The adversative force of δέ is only implied by punctuation.
    rationale: A semicolon can signal the transition, but ‘కానీ’ explicitly and naturally conveys the source contrast between what love does not do and what it does do.
