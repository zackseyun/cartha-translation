translation:
  language: te
  text: ప్రేమ అనీతిని బట్టి సంతోషించదు[a], కానీ సత్యంతో కలిసి సంతోషిస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తప్పుచేయడాన్ని బట్టి” లేదా “అన్యాయాన్ని బట్టి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సత్యాన్ని బట్టి సంతోషిస్తుంది.” గ్రీకు సంయుక్త క్రియ సత్యంతో కలిసి ఆనందించడాన్ని గానీ, సత్యం కారణంగా ఆనందించడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: సంతోషించదు
  rationale: χαίρω ఆనందించడం లేదా సంతోషించడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండటంతో పాటు συγχαίρει తోనున్న క్రియాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: అనీతిని బట్టి
  rationale: χαίρω తో ἐπί + సంప్రదాన విభక్తి సంతోషానికి కారణం లేదా సందర్భాన్ని సూచిస్తుంది. ἀδικία లోని నైతికమైన అధర్మం, తప్పుచేయడం, అన్యాయం అనే విస్తృత భావాన్ని ‘అనీతి’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: συγχαίρει
  choice: కలిసి సంతోషిస్తుంది
  rationale: συν- ఉపసర్గలోని కలిసి ఆనందించే భావాన్ని స్పష్టంగా నిలుపుతూ, తెలుగులో సహజమైన వ్యక్తీకరణను ఇస్తుంది.
- source_word: δὲ
  choice: ;
  rationale: గ్రీకు δέ ఇక్కడ వ్యతిరేకతను సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో మొదటి నిషేధాత్మక భాగం మరియు రెండవ సానుకూల భాగం మధ్య అర్ధవిరామం ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది; ‘కాని’ అని కూడా అనువదించవచ్చు.
- source_word: τῇ ἀληθείᾳ
  choice: సత్యంతో
  rationale: నిర్దిష్టమైన ἀλήθεια ను ‘సత్యం’గా అనువదించడం, అది మాటలోని నిజత్వానికే పరిమితమా, ప్రవర్తనలోని నిజానికా, లేక మరింత విస్తృతమైన నైతిక/సువార్త సంబంధ భావానికా అన్నదాన్ని అతిగా నిర్ధారించకుండా ఉంచుతుంది.
theological_decisions:
- issue: పౌలు ఉపయోగించిన ἀδικία–ἀλήθεια నైతిక వ్యత్యాసం
  choice: అనీతి
  alternative: తప్పుచేయడం; అన్యాయం; అధర్మం
  rationale: ‘అనీతి’ కేవలం చట్టపరమైన లేదా సామాజిక అన్యాయానికి పరిమితం కాకుండా విస్తృత నైతిక భావాన్ని నిలుపుతుంది. అదే సమయంలో ‘అధర్మం’ కలిగించగల మతపరంగా అతిగా నిర్దిష్టమైన ఛాయను నివారిస్తుంది.
- issue: సత్యంతో ఆనందించడంలో συγχαίρει యొక్క సంబంధ భావం
  choice: సత్యంతో కలిసి సంతోషిస్తుంది
  alternative: సత్యాన్ని బట్టి సంతోషిస్తుంది; సత్యంలో సంతోషిస్తుంది
  rationale: సంయుక్త క్రియలోని ‘తో కలిసి ఆనందించడం’ అనే భావాన్ని ప్రధాన పాఠ్యంలో నిలిపినా, గ్రీకు క్రియ సత్యం కారణంగా లేదా సత్యంపై ఆనందించడాన్ని కూడా సూచించగలదనే నిజమైన సందిగ్ధతను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సందర్భంలోని కర్త ‘ప్రేమ’ అయినప్పటికీ, ఈ ఒక్క వచనంలో గ్రీకు పాఠ్యంలోని క్రియాత్మక కొనసాగింపును అనుసరించి ‘అది’ వాడబడింది. ‘సంతోషించదు / సంతోషిస్తుంది’ అనే సమాంతర నిర్మాణం మూలంలోని χαίρει / συγχαίρει అనుసంధానాన్ని నిలుపుతుంది.
