  source_fidelity: ప్రేమకు సంబంధించిన గ్రీకు పునరుక్తి, μακροθυμεῖ యొక్క ఇతరులపట్ల ఓర్పు భావం, χρηστεύεται యొక్క దయతో ప్రవర్తించే క్రియాశీల భావం, అలాగే వరుస నిరాకరణలు అన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి. ζηλοῖకి ప్రతికూల సందర్భంలో ‘అసూయపడదు’ సరైన అర్థం. φυσιοῦταιలోని ఉబ్బిపోవడం అనే పౌలీయ రూపకం ‘గర్వంతో ఉబ్బిపోదు’లో నిలిచింది.
