id: 1CO.13.4
reference: 1 Corinthians 13:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: te
  text: ప్రేమ ఓర్పు చూపుతుంది; ప్రేమ దయగా ప్రవర్తిస్తుంది. అది అసూయపడదు[a], గొప్పలు చెప్పుకోదు, గర్వంతో ఉబ్బిపోదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈర్ష్యపడదు’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ సందర్భాన్ని బట్టి అనుకూలమైన ఉత్సాహాన్నిగానీ, ప్రతికూలమైన అసూయ లేదా ఈర్ష్యనుగానీ సూచించగలదు; ఇక్కడి ప్రతికూల సందర్భం ‘అసూయ’ అనే భావానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, అహంకారంతో నిండిపోదు. గ్రీకులో గర్వం వల్ల ఉబ్బిపోవడం అనే రూపకం ఉంది.
    reason: metaphor_clarification
lexical_decisions:
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: ఈ పదం ఇక్కడ స్వార్థరహితమైన, ఇతరుల మేలు కోరే ప్రేమను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రేమ’ సహజమైనదీ, విస్తృతార్థాన్ని నిలుపుకునేదీ.
- source_word: μακροθυμεῖ
  choice: ఓర్పు చూపుతుంది
  rationale: ఈ క్రియ ముఖ్యంగా ఇతరుల పట్ల దీర్ఘకాలం సహనంగా ఉండడాన్ని సూచిస్తుంది. ‘ఓర్పు చూపుతుంది’ ఆ క్రియాశీల నైతిక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: χρηστεύεται
  choice: దయగా ప్రవర్తిస్తుంది
  rationale: అరుదైన ఈ క్రియ దయతో మేలు చేయడాన్ని లేదా దయగా వ్యవహరించడాన్ని సూచిస్తుంది. కేవలం గుణాన్ని కాక ప్రవర్తనను కూడా వ్యక్తం చేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: ζηλοῖ
  choice: అసూయపడదు
  rationale: ζηλόω అనుకూల సందర్భంలో ఉత్సాహాన్ని, ప్రతికూల సందర్భంలో అసూయను లేదా ఈర్ష్యను సూచించగలదు. ఇక్కడ οὐ అనే నిరాకరణతో కూడిన దుర్గుణాల వరుసలో ఉన్నందున ‘అసూయపడదు’ సందర్భానికి తగినది.
- source_word: περπερεύεται
  choice: గొప్పలు చెప్పుకోదు
  rationale: ఈ క్రియ తనను తాను ప్రదర్శించుకోవడం లేదా డంబాలు పలకడం అనే భావాన్ని ఇస్తుంది. ‘గొప్పలు చెప్పుకోదు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి గౌరవప్రదమైన వచనశైలిని నిలుపుతుంది.
- source_word: φυσιοῦται
  choice: గర్వంతో ఉబ్బిపోదు
  rationale: ఈ క్రియ అక్షరార్థంగా ఉబ్బిపోవడం అనే రూపకంతో అహంకారాన్ని సూచిస్తుంది. ‘గర్వంతో’ భావాన్ని స్పష్టం చేస్తూ, ‘ఉబ్బిపోదు’ పౌలు వాడిన రూపకాన్ని నిలుపుతుంది.
- source_word: ἡ ἀγάπη ... ἡ ἀγάπη ... ⸂ἡ ἀγάπη⸃
  choice: ప్రేమ ... ప్రేమ ... అది
  rationale: మొదటి రెండు వాక్యభాగాల్లోని పునరుక్తిని ప్రాధాన్యం కోసం నిలిపి, తరువాతి వరుసలో తెలుగులో సహజంగా ఉండేందుకు ‘అది’ వాడబడింది. ζηλοῖ తరువాత మూడో ἡ ἀγάπη పాఠభేదానికి లోబడి ఉంది; అనువాదార్థం మాత్రం మారదు.
- source_word: οὐ
  choice: పడదు / చెప్పుకోదు / ఉబ్బిపోదు
  rationale: గ్రీకు నిరాకరణను ప్రతి తెలుగు క్రియలో సహజమైన వ్యతిరేక రూపంతో వ్యక్తం చేశారు.
theological_decisions:
- issue: ἀγάπη అనే పదానికి ఈ నైతిక-వేదాంత సందర్భంలో అనువాదం
  choice: ప్రేమ
  alternative: దాతృత్వం
  rationale: ‘దాతృత్వం’ అనే పదం అర్థాన్ని ధనసహాయం లేదా సేవకు కుదించే అవకాశం ఉంది. ‘ప్రేమ’ గ్రీకు పదంలోని విస్తృత సంబంధాత్మక, నైతిక భావాన్ని నిలుపుతుంది.
- issue: φυσιοῦται లోని అహంకార రూపకం
  choice: గర్వంతో ఉబ్బిపోదు
  alternative: అహంకరించదు
  rationale: సూటిగా ‘అహంకరించదు’ అని చెప్పడం భావాన్ని అందించినా, పౌలు ఉద్దేశపూర్వకంగా వాడిన ‘ఉబ్బిపోవడం’ అనే రూపకాన్ని తొలగిస్తుంది. ఎంపిక చేసిన రూపం భావాన్నీ రూపకాన్నీ రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన నైతిక వచనశైలి వాడబడింది. గ్రీకు వాక్యంలోని సమాంతర నిర్మాణం, మొదటి రెండు భాగాల్లో ‘ప్రేమ’ పునరుక్తి, చివరి క్రియలోని ఉబ్బిపోవడం అనే రూపకం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
