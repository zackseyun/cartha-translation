id: 1CO.13.3
reference: 1 Corinthians 13:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: te
  text: నా ఆస్తి అంతటినీ పంచిపెట్టినా, నా శరీరాన్ని కాల్చబడేలా అప్పగించినా,[a] ప్రేమ మాత్రం నాకు లేకపోతే, నాకు ఏ ప్రయోజనమూ లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “కాల్చబడేలా” అనే మాటకు బదులుగా “నేను గొప్పచెప్పుకొనేలా” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: పంచిపెట్టినా
  rationale: ఈ క్రియకు ముక్కలుగా లేదా భాగాలుగా పంచిపెట్టడం అనే భావం ఉంది. ఆస్తినంతటినీ ఇతరులకు దానంగా ఇవ్వడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ‘పంచిపెట్టినా’ అనువైనది.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: నా ఆస్తి అంతటినీ
  rationale: ఈ పదబంధం వ్యక్తికి చెందిన సంపద లేదా భౌతిక ఆస్తులను సూచిస్తుంది. ‘నా ఆస్తి అంతటినీ’ సంపూర్ణతను స్పష్టంగా నిలుపుతుంది.
- source_word: παραδῶ
  choice: అప్పగించినా
  rationale: తన శరీరాన్ని మరొకరి అధికారానికి లేదా ఒక పరిణామానికి ఇచ్చివేయడం అనే మూలభావాన్ని ‘అప్పగించినా’ నిలుపుతుంది; ‘బలి ఇచ్చినా’ వంటి వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: τὸ σῶμά μου
  choice: నా శరీరం
  rationale: మూలంలోని స్పష్టమైన శరీరార్థాన్ని నేరుగా అనువదిస్తుంది.
- source_word: ἵνα καυθήσομαι
  choice: కాల్చబడేలా
  rationale: SBLGNTలోని καυθήσομαι అనే భవిష్యత్ కర్మణి రూపం ‘కాల్చబడడం’ను సూచిస్తుంది. ఉద్దేశం లేదా ఫలిత సంబంధాన్ని సహజ తెలుగులో ‘కాల్చబడేలా’ తెలియజేస్తుంది.
- source_word: ἀγάπην
  choice: ప్రేమ
  rationale: ἀγάπηకి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, విస్తృతమైన సమానార్థకం ‘ప్రేమ’; దాని భావాన్ని ఒక ప్రత్యేక మతపరమైన పరిభాషకు పరిమితం చేయదు.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: నాకు ఏ ప్రయోజనమూ లేదు
  rationale: తనకు ఎలాంటి మేలు లేదా లాభం కలగదనే కర్మణి భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: '... పంచిపెట్టినా, ... అప్పగించినా'
  rationale: రెండు షరతులను వేర్వేరుగా ఉంచి పౌలు ఉపయోగించిన క్రమంగా పెరిగే ఊహాత్మక నిర్మాణాన్ని నిలుపుతుంది; తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా ‘అయినా’ రూపాలు వాడబడ్డాయి.
theological_decisions:
- issue: ఉద్దేశార్థక ఉపవాక్యంలోని పాఠాంతరం
  choice: SBLGNT పాఠమైన καυθήσομαιను ప్రధాన వాక్యంలో ‘కాల్చబడేలా’ అని అనువదించడం.
  alternative: καυχήσωμαι — ‘నేను గొప్పచెప్పుకునేలా’ లేదా ‘నేను అతిశయించేలా’.
  rationale: అందించబడిన మూలపాఠం SBLGNT కాబట్టి దానిలోని ‘కాల్చబడడం’ అనే పాఠాన్ని ప్రధాన వాక్యంలో అనుసరించాం. ‘గొప్పచెప్పుకోవడం’ అనే పాఠాంతరం అర్థాన్ని గణనీయంగా మార్చుతుంది కాబట్టి దాన్ని మౌనంగా విస్మరించకుండా పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి వాడబడింది. మూలంలోని రెండు షరతుల క్రమం, ప్రేమ లేకపోవడంపై ఉన్న వ్యతిరేకత, వ్యక్తికి ప్రయోజనం లేకపోవడం అనే ముగింపు నిలుపబడ్డాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత పాఠాంతర భాగం వెంట ఉంచబడింది.
