id: 1CO.13.12
reference: 1 Corinthians 13:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: te
  text: ఎందుకంటే ఇప్పుడు మనం అద్దం ద్వారా నిగూఢంగా చూస్తున్నాం[a]; అప్పుడైతే ముఖాముఖిగా చూస్తాం. ఇప్పుడు నేను కొంతవరకే తెలుసుకుంటున్నాను; అప్పుడైతే నేను పూర్తిగా తెలుసుకుంటాను—నేను కూడా పూర్తిగా తెలుసుకోబడినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా “ఒక చిక్కుప్రశ్నలో” లేదా “నిగూఢ రూపంలో” అని ఉంది. ఇది ప్రస్తుత దర్శనం పరోక్షంగా, పూర్తిగా స్పష్టంకాని విధంగా ఉందని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπομεν
  choice: మనం చూస్తున్నాం
  rationale: దృశ్యరూపకాన్ని, వర్తమానకాల భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἄρτι
  choice: ఇప్పుడు
  rationale: τότε (‘అప్పుడు’)తో ఉన్న కాలవ్యతిరేకతను సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δι’ ἐσόπτρου
  choice: అద్దం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సూచించే మధ్యవర్తి సాధన భావాన్ని నిలుపుతూ అద్దం అనే రూపకాన్ని కాపాడుతుంది.
- source_word: ἐν αἰνίγματι
  choice: నిగూఢంగా
  rationale: αἴνιγμαలోని చిక్కైన, పరోక్షమైన గ్రహింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘మసకగా’ అని మాత్రమే అనువదించి మూలంలోని చిక్కుప్రశ్న భావాన్ని కోల్పోకుండా పాదటిప్పణిలో అక్షరార్థాన్ని తెలిపింది.
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: ముఖాముఖిగా
  rationale: ప్రత్యక్షమైన, మధ్యవర్తిత్వం లేని దర్శనాన్ని తెలిపే స్థిరమైన తెలుగు నుడికారం.
- source_word: γινώσκω ἐκ μέρους
  choice: నేను కొంతవరకే తెలుసుకుంటున్నాను
  rationale: ప్రస్తుత జ్ఞానం పాక్షికమైనదనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιγνώσομαι
  choice: నేను పూర్తిగా తెలుసుకుంటాను
  rationale: γινώσκωతో పోల్చినప్పుడు ఉన్న బలమైన జ్ఞానభావాన్ని చూపుతుంది; అయితే సర్వజ్ఞత్వాన్ని ప్రకటించేలా అతిశయింపదు.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: నేను కూడా పూర్తిగా తెలుసుకోబడినట్లే
  rationale: గ్రీకులోని కర్మణి ప్రయోగాన్ని, తెలుసుకున్న వ్యక్తి ఎవరనే అవ్యక్తతను, ἐπιγινώσκω పదపునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: భవిష్యత్తులో కలిగే జ్ఞానం ఎంత సంపూర్ణమైనది?
  choice: ‘నేను పూర్తిగా తెలుసుకుంటాను’ అని అనువదించడం
  alternative: ‘నేను సమస్తాన్నీ తెలుసుకుంటాను’ లేదా ‘నాకు అన్నీ అర్థమవుతాయి’
  rationale: వాక్యం ప్రస్తుత పాక్షిక జ్ఞానాన్ని భవిష్యత్తు సంపూర్ణ జ్ఞానంతో వ్యతిరేకిస్తుంది; అయినా విశ్వాసికి దేవునితో సమానమైన సర్వజ్ఞత్వం కలుగుతుందని తప్పనిసరిగా చెప్పదు. అందువల్ల మూలంలోని ఉద్వేగాన్ని అతిగా పరిష్కరించకుండా ఉంచింది.
- issue: ‘పూర్తిగా తెలుసుకోబడిన’ వాక్యంలో తెలుసుకున్నవారు ఎవరు?
  choice: కర్తను పేర్కొనకుండా కర్మణి రూపాన్ని నిలుపడం
  alternative: ‘దేవుడు నన్ను పూర్తిగా తెలుసుకున్నట్లే’
  rationale: సందర్భంలో దేవుడే ఉద్దేశించబడి ఉండవచ్చు; అయితే గ్రీకు వాక్యం కర్తను ప్రత్యక్షంగా పేర్కొనదు. అనువాదంలో దానిని చేర్చకుండా మూలంలోని అవ్యక్తతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలిని వాడింది. ‘ముఖాముఖిగా’ వంటి సహజ నుడికారాన్ని ఉంచి, ἐν αἰνίγματιలోని నిగూఢతను ప్రధాన పాఠ్యంతో పాటు పాదటిప్పణిలో వివరించింది.
