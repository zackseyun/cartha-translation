id: 1CO.13.13
reference: 1 Corinthians 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη· τὰ τρία ταῦτα, μείζων δὲ τούτων ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: te
  text: ఇప్పుడు మాత్రం విశ్వాసం[a], నిరీక్షణ, ప్రేమ—ఈ మూడు నిలిచి ఉన్నాయి[b]. అయితే వీటిలో గొప్పది ప్రేమ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విశ్వాసం’ అనే పదాన్ని ‘నమ్మకం’ అనే విస్తృత భావంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘కొనసాగుతాయి’; గ్రీకు క్రియకు ‘నిలిచి ఉండడం,’ ‘కొనసాగడం’ అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: ఇప్పుడైతే
  rationale: νυνί ప్రస్తుత లేదా ముగింపు స్థితిని సూచిస్తుంది; δέ స్వల్ప వ్యత్యాసాన్ని లేదా కొనసాగింపును తెలియజేస్తుంది. ‘ఇప్పుడైతే’ ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: μένει
  choice: నిలిచి ఉంటాయి
  rationale: μένω ఇక్కడ కొనసాగడం లేదా శాశ్వతంగా నిలవడం అనే భావాన్ని ఇస్తుంది. మూడు ఏకవచన నామాలను సమూహంగా సూచిస్తున్నందున తెలుగులో బహువచన క్రియ సహజం.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఈ పౌలు త్రయంలో πίστις‌కు స్థిరమైన, సహజమైన తెలుగు పదం ‘విశ్వాసం’; ‘నమ్మకం’ కూడా సాధ్యమైన భావమని పాదసూచికలో ఉంచాం.
- source_word: ἐλπίς
  choice: నిరీక్షణ
  rationale: పౌలు రచనలలోని θεological usageను ‘నిరీక్షణ’ స్పష్టంగా తెలియజేస్తుంది; సాధారణ కోరికకన్నా భవిష్యత్తుపై ఆశాభరితమైన ఎదురుచూపు భావం ఇందులో ఉంది.
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: ἀγάπηకి ఆధునిక తెలుగులో విస్తృతంగా అర్థమయ్యే, సహజమైన సమానార్థకం ‘ప్రేమ’.
- source_word: τὰ τρία ταῦτα
  choice: ఈ మూడు
  rationale: ముందు పేర్కొన్న విశ్వాసం, నిరీక్షణ, ప్రేమలను నేరుగా తిరిగి సూచించే సంక్షిప్తమైన సహజ రూపం.
- source_word: μείζων δὲ τούτων
  choice: అయితే వీటిలో గొప్పది
  rationale: μείζων రూపరీత్యా తులనాత్మకమైనదైనా, ఈ మూడు అంశాల సమూహంలో ప్రేమకు అత్యున్నత స్థానం ఇస్తుంది. ‘వీటిలో గొప్పది’ మూలంలోని పోలికను సహజంగా కాపాడుతుంది.
theological_decisions:
- issue: πίστις అనే ధార్మిక ప్రాధాన్యమున్న పదం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ‘విశ్వాసం, నిరీక్షణ, ప్రేమ’ అనే త్రయం ఇక్కడ వ్యక్తిగత విశ్వసనీయతకన్నా విశ్వాసం/నమ్మకం అనే భావాన్నే బలపరుస్తుంది. అయినా ‘నమ్మకం’ అనే విస్తృత భావాన్ని పాదసూచికలో గుర్తించాం.
- issue: μείζων యొక్క తులనాత్మక లేదా అత్యుత్తమ భావం
  choice: వీటిలో గొప్పది ప్రేమ
  alternative: వీటికన్నా ప్రేమ గొప్పది
  rationale: గ్రీకు తులనాత్మక రూపం ఈ మూడు గుణాలలో ప్రేమను శ్రేష్ఠమైనదిగా ఉంచుతుంది. ఎంపిక చేసిన రూపం దానిని స్పష్టంగా తెలియజేస్తూనే మూలంలోని పోలికను నిలుపుతుంది.
- issue: μένει యొక్క కాలాతీత కొనసాగింపు
  choice: నిలిచి ఉంటాయి
  alternative: కొనసాగుతాయి; నిలుస్తాయి
  rationale: ముందటి వచనాలలో అంతమయ్యే వరాలకు విరుద్ధంగా ఈ మూడు కొనసాగుతాయనే భావం ఉంది; అవి ఏ విధంగా లేదా ఎంతకాలం నిలుస్తాయనే దానిని అనవసరంగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘ఇప్పుడైతే’ ద్వారా νυνὶ δὲ లోని స్వల్ప వ్యత్యాసం/కొనసాగింపు రెండింటినీ సహజంగా వ్యక్తం చేశాం. ప్రధాన వాక్యాన్ని అనవసరంగా భారంగా చేయకుండా నిజమైన పదార్థ ప్రత్యామ్నాయాలను పాదసూచికల్లో ఉంచాం.
