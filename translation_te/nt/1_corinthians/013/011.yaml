    issue: “నేను పురుషుణ్ణి అయినప్పుడు” అసహజమైన నిర్మాణం.
    rationale: ఇది ‘నేను పురుషుణ్ణి’ అనే స్థితివాక్యాన్ని ‘అయినప్పుడు’తో కలిపినట్లు వినిపిస్తుంది. γέγονα ἀνήρ సూచించే పురుషత్వ/పెద్దవాడి స్థితిలోకి మార్పును “నేను పురుషుడిగా మారినప్పుడు” స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
