id: 1CO.13.11
reference: 1 Corinthians 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: te
  text: నేను చిన్నపిల్లగా ఉన్నప్పుడు చిన్నపిల్లలా మాట్లాడేవాణ్ణి, చిన్నపిల్లలా ఆలోచించేవాణ్ణి, చిన్నపిల్లలా తర్కించేవాణ్ణి. నేను పురుషుడిగా మారినప్పుడు చిన్నపిల్లకు సంబంధించినవాటిని విడిచిపెట్టాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “చిన్నపిల్ల చేష్టలు” లేదా “చిన్నపిల్ల ప్రవర్తన.” గ్రీకు వాచ్యార్థం: “చిన్నపిల్లకు సంబంధించినవి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: చిన్నపిల్ల
  rationale: νήπιος చిన్న వయసుగల బిడ్డను, సందర్భానుసారంగా అపరిపక్వతను సూచిస్తుంది. ‘చిన్నపిల్ల’ అనేది ‘శిశువు’ కంటే విస్తృతమైనది; ἀνήρతో ఉన్న ఎదుగుదల వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐλάλουν
  choice: మాట్లాడేవాణ్ణి
  rationale: λαλέω యొక్క సాధారణ భావమైన ‘మాట్లాడు’ను సహజమైన తెలుగు పునరుక్తి నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἐφρόνουν
  choice: ఆలోచించేవాణ్ణి
  rationale: φρονέω ఆలోచన లేదా మనోభావాన్ని సూచించగలదు. ఇక్కడ మాట, ఆలోచన, తర్కం అనే వరుసలో ‘ఆలోచించేవాణ్ణి’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: ἐλογιζόμην
  choice: తర్కించేవాణ్ణి
  rationale: λογίζομαιకు పరిశీలించడం, లెక్కించడం, తర్కించడం వంటి భావాలున్నాయి. ‘తర్కించేవాణ్ణి’ అనేది ἐφρόνουνకు వాడిన ‘ఆలోచించేవాణ్ణి’ నుండి దీనిని వేరుచేస్తూ బౌద్ధిక పరిశీలన భావాన్ని నిలుపుతుంది.
- source_word: γέγονα
  choice: అయినప్పుడు
  rationale: పరిపూర్ణ కాలరూపం కొత్త స్థితిలోకి వచ్చిన భావాన్ని ఇస్తుంది. తెలుగు ‘అయినప్పుడు’ ఆ మార్పును సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: ἀνήρ
  choice: పురుషుణ్ణి
  rationale: ἀνήρ ఇక్కడ పురుష లింగ ఏకవచనం. పౌలు తనను ఉదాహరణగా తీసుకొని చిన్నపిల్ల స్థితికి విరుద్ధంగా ఎదిగిన పురుషుని స్థితిని చూపుతున్నందున లింగాన్ని తటస్థీకరించకుండా ‘పురుషుణ్ణి’ అని అనువదించబడింది.
- source_word: κατήργηκα
  choice: విడిచిపెట్టాను
  rationale: καταργέωకు రద్దుచేయడం, పనికిరాకుండా చేయడం, తొలగించడం అనే భావాలున్నాయి. వ్యక్తిగత పరిపక్వత రూపకంలో బాల్యానికి చెందినవాటిని ఇక కొనసాగించకపోవడాన్ని ‘విడిచిపెట్టాను’ సహజంగా తెలియజేస్తుంది.
- source_word: τὰ τοῦ νηπίου
  choice: చిన్నపిల్లకు సంబంధించినవాటిని
  rationale: గ్రీకు పదబంధం వాచ్యంగా ‘చిన్నపిల్లకు చెందిన/సంబంధించినవి.’ ఈ రూపం అసలు వాక్యంలోని విస్తృతతను నిలుపుతూ, ‘చేష్టలు’ లేదా ‘ప్రవర్తన’ అని భావాన్ని ముందుగానే పరిమితం చేయదు.
theological_decisions:
- issue: ἀνήρలోని లింగ సూచన
  choice: పురుషుణ్ణి
  alternative: పెద్దవాణ్ణి / వయోజనుణ్ణి
  rationale: గ్రీకు పదం పురుష లింగాన్ని స్పష్టంగా సూచిస్తుంది. ఇక్కడ పౌలు తన ఎదుగుదలను దృష్టాంతంగా ఉపయోగిస్తున్నాడు; పురుషుల ఆధిక్యతను బోధించడం లేదు. అందువల్ల మూలంలోని లింగ సూచనను ఉంచుతూ, దానిపై అదనపు సిద్ధాంతార్థాన్ని మోపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూడు క్రియల్లోని అలంకారాత్మక సమాంతరతను ‘చిన్నపిల్లలా’ అనే పునరుక్తితో నిలిపాం; ἐφρόνουν మరియు ἐλογιζόμην మధ్య తేడాను ‘ఆలోచించేవాణ్ణి,’ ‘తర్కించేవాణ్ణి’ ద్వారా చూపించాం.
