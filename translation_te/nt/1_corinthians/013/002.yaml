id: 1CO.13.2
reference: 1 Corinthians 13:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: te
  text: నాకు ప్రవచనం ఉండి, అన్ని రహస్యాలనూ సమస్త జ్ఞానాన్నీ నేను గ్రహించినా, పర్వతాలను తరలించగలిగేంతటి సంపూర్ణ విశ్వాసం[a] నాకు ఉన్నా, ప్రేమ లేకపోతే నేను ఏమీ కాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమస్త నమ్మకం’; తక్కువ సంభావ్యంగా, ‘సమస్త విశ్వాస్యత.’ గ్రీకు పదానికి విస్తృత అర్థపరిధి ఉంది; ఇక్కడ అది పర్వతాలను తరలించగల అసాధారణ విశ్వాసాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείαν
  choice: ప్రవచించే వరం
  rationale: సందర్భం ఆత్మీయ వరాల గురించి కావడంతో, కేవలం కార్యాన్నో పదవినో పరిమితం చేయకుండా సహజమైన తెలుగులో నామవాచక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: εἰδῶ
  choice: గ్రహించినా
  rationale: ‘తెలుసుకొను’ అనే మూలభావాన్ని నిలుపుతూ, రహస్యాలు మరియు జ్ఞానం అనే కర్మలతో మానసిక అవగాహనను సహజంగా తెలియజేస్తుంది.
- source_word: μυστήρια
  choice: రహస్యాలు
  rationale: పౌలు వాడే, దాచబడి తరువాత వెల్లడైన దైవసత్యాల భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: γνῶσιν
  choice: జ్ఞానం
  rationale: εἰδῶకు ఎంచుకున్న ‘గ్రహించు’ నుండి పదభేదాన్ని కాపాడుతూ, మూలంలోని ప్రత్యేక నామవాచకాన్ని ప్రతిబింబిస్తుంది.
- source_word: πᾶσαν τὴν πίστιν
  choice: సంపూర్ణ విశ్వాసం
  rationale: πᾶσαν యొక్క సమగ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భంలో ఇది అసాధారణ కార్యసాధక విశ్వాసాన్ని సూచిస్తుంది.
- source_word: ὥστε ὄρη μεθιστάναι
  choice: పర్వతాలను తరలించగలిగే
  rationale: ఫలిత/సామర్థ్య నిర్మాణాన్ని సహజంగా అందిస్తూ, మూలంలోని పర్వతాలను తరలించే బలమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἀγάπην
  choice: ప్రేమ
  rationale: ἀγάπη యొక్క విస్తృతమైన, ప్రస్తుత సందర్భానికి తగిన అర్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: οὐθέν εἰμι
  choice: నేను ఏమీ కాను
  rationale: పౌలు పలికిన తీవ్రమైన స్వీయనిరాకరణను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నేరుగా, బలంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అద్భుత కార్యసామర్థ్య సందర్భంలో πίστις అర్థం
  choice: విశ్వాసం
  alternative: నమ్మకం; నమ్మకత్వం
  rationale: ఇక్కడ పర్వతాలను తరలించే అసాధారణ విశ్వాసమే సందర్భానుకూల భావం. ‘నమ్మకం’ సాధ్యమైన ప్రత్యామ్నాయం; πίστιςకు ఇతర సందర్భాల్లో ‘నమ్మకత్వం’ అనే అర్థం ఉన్నా, ఇక్కడ అది తక్కువ సంభావ్యమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకునికి సులభంగా అర్థమయ్యే శైలి. మూలంలోని అతిశయోక్తి, షరతుల వరుస, చివరి తీవ్ర ప్రకటన నిలుపబడ్డాయి.
