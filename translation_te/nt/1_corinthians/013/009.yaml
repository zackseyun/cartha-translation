translation:
  language: te
  text: ఎందుకంటే మనకు కొంతవరకే తెలుసు, మరియు కొంతవరకే ప్రవచిస్తున్నాము.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ μέρους
  choice: కొంతవరకే
  rationale: ఈ గ్రీకు నుడికారం ‘పాక్షికంగా/కొంతవరకు’ అనే అర్థాన్ని ఇస్తుంది. తరువాతి సంపూర్ణతతో ఉన్న వ్యత్యాసాన్ని చూపిస్తూ, రెండు ఉపవాక్యాల్లోని పునరుక్తిని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంతో ఉన్న వివరణాత్మక సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: γινώσκομεν
  choice: తెలుసుకుంటున్నాం
  rationale: ‘తెలుసుకోవడం’ అనే జ్ఞానసంబంధ అర్థాన్ని నేరుగా ఇస్తుంది; ‘అర్థం చేసుకోవడం’ అని ప్రత్యేకంగా వ్యాఖ్యానించదు.
- source_word: καὶ
  choice: ;
  rationale: గ్రీకులోని καί రెండు సమాంతర ఉపవాక్యాలను కలుపుతుంది. తెలుగులో పునరుక్త నిర్మాణాన్ని సహజంగా ఉంచేందుకు అర్థవిరామంతో సమన్వయం వ్యక్తమైంది.
- source_word: προφητεύομεν
  choice: ప్రవచిస్తున్నాం
  rationale: ఆత్మీయ వరాల సందర్భంలో ప్రవక్తసంబంధమైన మాట పలకడాన్ని సూచిస్తుంది; దానిని కేవలం భవిష్యత్తు చెప్పడం లేదా సాధారణ బోధగా పరిమితం చేయదు.
theological_decisions:
- issue: సంఘంలో ప్రవచన కార్యం యొక్క అర్థం
  choice: ప్రవచిస్తున్నాం
  alternative: భవిష్యత్తును ముందుగా చెబుతున్నాం; బోధిస్తున్నాం
  rationale: మూలపదం ప్రేరేపిత ప్రవచన వాక్కును విస్తృతంగా సూచించగలదు. వివాదాస్పదమైన పరిధిని సంకుచితం చేయకుండా మూలంలోని భావ విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయినా గౌరవప్రదమైన శైలిలో అనువదించబడింది. మూలంలోని సమాంతర నిర్మాణం, పరిమిత జ్ఞానం మరియు ప్రవచనం మధ్య సంబంధం నిలుపబడ్డాయి.
