id: 1CO.13.1
reference: 1 Corinthians 13:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: te
  text: నేను మనుషుల భాషల్లోనూ[a] దేవదూతల భాషల్లోనూ మాట్లాడినా, నాకు ప్రేమ లేకపోతే, మ్రోగే కంచువలె లేదా గట్టిగా మోగే తాళంవలె అయిపోయాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘భాషలు’ అని అనువదించిన గ్రీకు పదానికి అక్షరార్థంగా ‘నాలుకలు’ అని కూడా అర్థం. ఇక్కడ అది భాషలను లేదా నాలుకలతో చేసే ప్రత్యేకమైన ప్రసంగాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν … λαλῶ
  choice: మాట్లాడినా
  rationale: షరతుతో కూడిన పౌలు వాక్యానికి తెలుగులో సహజమైన రీతిని ఇస్తూ, ఊహాత్మకమైన ‘అలా చేసినా’ అనే భావాన్ని నిలుపుతుంది.
- source_word: ταῖς γλώσσαις
  choice: భాషల్లో
  rationale: γλῶσσα ఇక్కడ ‘నాలుకలు’ లేదా ‘భాషలు’ అని అర్థమవవచ్చు. ఆధునిక తెలుగులో ‘భాషల్లో మాట్లాడడం’ సహజంగా ఉండగా, పాదసూచిక మూలపదంలోని విస్తృతిని మరియు కోరింథు పత్రికలోని ప్రత్యేక భాషా-ప్రసంగ సందర్భాన్ని తెలియజేస్తుంది.
- source_word: τῶν ἀνθρώπων
  choice: మనుషుల
  rationale: ἄνθρωποι ఇక్కడ పురుషులను మాత్రమే కాక మానవులను దేవదూతలతో వ్యత్యాసంగా సూచిస్తుంది; ‘మనుషుల’ ఈ భావాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: τῶν ἀγγέλων
  choice: దేవదూతల
  rationale: మనుషులతో చేసిన వ్యత్యాసం వల్ల ἄγγελοι ఇక్కడ సాధారణ వార్తాహరులు కాక పరలోక జీవులను సూచించడం అత్యంత సహజం.
- source_word: ἀγάπην δὲ μὴ ἔχω
  choice: నాకు ప్రేమ లేకపోతే
  rationale: δέ లోని వ్యత్యాసాన్ని వాక్య నిర్మాణం తెలియజేస్తుంది; ἔχω లోని ‘కలిగి ఉండడం’ భావాన్ని తెలుగులో సహజమైన ‘నాకు … లేకపోతే’గా అందిస్తుంది.
- source_word: γέγονα
  choice: అయిపోయాను
  rationale: పరిపూర్ణ కాలంలోని ఏర్పడిన ఫలితస్థితిని ‘అయిపోయాను’ స్పష్టంగా నిలుపుతుంది; కేవలం ‘ఉన్నాను’ అని సడలించదు.
- source_word: χαλκὸς ἠχῶν
  choice: మోగే కంచు
  rationale: χαλκός ఒక నిర్దిష్ట వాద్యాన్ని పేరుపెట్టకుండా కంచు/రాగి వంటి లోహాన్ని సూచిస్తుంది; ἠχῶν దాని మోగే శబ్దాన్ని తెలియజేస్తుంది. అనవసరంగా ‘గాంగ్’ వంటి వాద్యాన్ని చేర్చకుండా మూలచిత్రాన్ని నిలుపుతుంది.
- source_word: κύμβαλον ἀλαλάζον
  choice: గణగణలాడే తాళం
  rationale: κύμβαλον తాళవాద్యాన్ని, ἀλαλάζον పెద్దగా ఢమరుమనే లేదా గణగణలాడే శబ్దాన్ని సూచిస్తుంది; ఈ తెలుగు పదబంధం ఆ కఠినమైన శ్రవణచిత్రాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘మనుషుల భాషలు, దేవదూతల భాషలు’ అనే మాటల స్వభావం
  choice: మానవ మరియు దేవదూతల భాషల మధ్య ఉన్న అలంకారాత్మక వ్యత్యాసాన్ని నేరుగా నిలుపడం
  alternative: ఇవి అక్షరార్థమైన పరలోక భాషలని లేదా కేవలం అతిశయోక్తి అని నిర్ణయించడం
  rationale: దేవదూతల భాషలు నిజమైన ప్రత్యేక భాషలా, అత్యున్నతమైన ప్రసంగాన్ని సూచించే అతిశయోక్తా అనేది వాక్యం తేల్చదు. అనువాదం ఆ ఉద్దేశపూర్వక అనిశ్చితిని నిలుపుతుంది.
- issue: ἀγάπη యొక్క భావం
  choice: ప్రేమ
  alternative: దాతృత్వం లేదా ఒక నిర్దిష్ట మతపరమైన సాంకేతిక పదం
  rationale: ‘ప్రేమ’ ఆధునిక తెలుగులో విస్తృతంగా అర్థమయ్యే పదం; సందర్భం దాని స్వభావాన్ని తరువాతి వచనాల్లో వివరించనిస్తుంది, ముందుగానే ఒక సిద్ధాంతపరమైన నిర్వచనాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘మనుషులు’ లింగభేదం లేకుండా మానవజాతిని సూచిస్తుంది. ‘దేవదూతల భాషలు’ అనే మాటను అక్షరార్థమా అతిశయోక్తా అని అనువాదంలో నిర్ణయించలేదు. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలకు సరిపోతాయి.
