id: PHM.1.20
reference: Philemon 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: te
  text: అవును, సహోదరా, ప్రభువులో నీ వల్ల నాకు మేలు కలగనివ్వు[a]; మెస్సీయలో[c] నా హృదయాన్ని[b] సేదదీర్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ వల్ల నాకు ప్రయోజనం కలగనివ్వు,’ లేదా ‘నీ వల్ల నాకు ఆనందం కలగనివ్వు.’ ఇక్కడ పౌలు ‘ఒనేసిము’ అనే పేరుకూ మేలు లేదా ఉపయోగం అనే భావానికీ మధ్య పదప్రయోగం చేసి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘నా అంతర్భాగాలు.’ ఇది లోతైన భావాలను లేదా అంతరంగాన్ని సూచించే నుడికారం; తెలుగులో సహజంగా ‘నా హృదయాన్ని’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘క్రీస్తులో.’ గ్రీకు Χριστός అభిషిక్తుడనే బిరుదు; దాని బిరుదు భావాన్ని నిలుపడానికి ఇక్కడ ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: అవును
  rationale: ఆప్యాయమైన అంగీకారాన్ని, వెంటనే వచ్చే విజ్ఞాపనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀδελφέ
  choice: సహోదరా
  rationale: ఫిలేమోనును తోటి విశ్వాసిగా నేరుగా సంబోధించే ఏకవచన పుంలింగ రూపాన్ని నిలుపుతుంది.
- source_word: ἐγώ σου ὀναίμην
  choice: నీ వల్ల నాకు మేలు కలగనివ్వు
  rationale: ὀναίμηνలోని ప్రయోజనం పొందడం అనే భావాన్ని, విజ్ఞాపన స్వరాన్ని నిలుపుతుంది; ఒనేసిము పేరుతో ఉండవచ్చిన పదప్రయోగాన్ని పాదసూచికలో సూచిస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు వాడే సంబంధం లేదా కార్యక్షేత్రాన్ని సూచించే పదబంధాన్ని సుపరిచితమైన నూతన నిబంధన శైలిలో అందిస్తుంది.
- source_word: ἀνάπαυσόν
  choice: సేదదీర్చు
  rationale: విశ్రాంతి, ఉపశమనం, ప్రోత్సాహం కలిగించాలనే స్పష్టమైన విజ్ఞాపనను సహజంగా వ్యక్తం చేస్తూ 1:7లోని భావాన్ని ప్రతిధ్వనిస్తుంది.
- source_word: μου τὰ σπλάγχνα
  choice: నా హృదయాన్ని
  rationale: అక్షరార్థంగా అంతర్భాగాలను సూచించే గ్రీకు నుడికారానికి ఇక్కడ లోతైన భావాలు లేదా అంతరంగం అనే సహజమైన తెలుగు సమానార్థకాన్ని ఇస్తుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός యొక్క బిరుదు భావాన్ని నిలుపుతూ, క్రైస్తవ సహవాసంలోనే ఈ కార్యం జరగాలనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: Χριστῷ పదాన్ని అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ ఈ పదం కేవలం పేరులా కాక అభిషిక్తుడనే బిరుదు భావంతో పనిచేస్తుంది. అందువల్ల ‘మెస్సీయ’ మూలపదంలోని బిరుదు స్వరూపాన్ని స్పష్టంగా నిలుపుతుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇస్తుంది.
- issue: κυρίῳ పదాన్ని అనువదించడం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ పౌలు ప్రయోగంలో ‘ప్రభువు’ గౌరవాన్ని మరియు స్థిరమైన నూతన నిబంధన బిరుదును నిలుపుతుంది; దాసుడు–యజమాని భావాన్ని అనవసరంగా ముందుకు తేవదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయమైనప్పటికీ గౌరవప్రదమైన విజ్ఞాపన శైలిని వాడింది. ‘సహోదరా,’ ‘ప్రభువులో,’ ‘మెస్సీయలో’ అనే రూపాలు పత్రికా సందర్భానికి తగిన గంభీరతను నిలుపుతాయి. పదప్రయోగం మరియు గ్రీకు నుడికారంలోని ప్రత్యామ్నాయ భావాలు ప్రధాన వాక్యాన్ని భారంగా చేయకుండా పాదసూచికల్లో భద్రపరచబడ్డాయి.
