  terminology: “ప్రభువు” is appropriate for κύριος. “మెస్సీయ” consistently renders Χριστός as a title in accordance with the stated project policy, while footnote c supplies “క్రీస్తులో” as the conventional alternative. The footnotes accurately explain the πιθαν wordplay involving Onesimus and the idiomatic force of σπλάγχνα.
