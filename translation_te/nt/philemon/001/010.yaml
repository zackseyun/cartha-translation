id: PHM.1.10
reference: Philemon 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παρακαλῶ σε περὶ τοῦ ἐμοῦ τέκνου, ὃν ἐγέννησα ἐν τοῖς ⸀δεσμοῖς Ὀνήσιμον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: te
  text: నా సంకెళ్లలో ఉండగా[b] నేను తండ్రినైన నా బిడ్డ[a] ఒనేసిము విషయమై నిన్ను వేడుకుంటున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బిడ్డ’ అనే మాట ఇక్కడ పౌలుకు ఒనేసిముతో ఉన్న ఆధ్యాత్మిక సంబంధాన్ని సూచించే రూపకం.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో ‘సంకెళ్లు’ అనే స్పష్టమైన చిత్రం ఉంది; ఇది ‘నేను చెరలో ఉన్నప్పుడు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: వేడుకుంటున్నాను
  rationale: ఇక్కడ παρακαλέω ఆజ్ఞను కాకుండా వ్యక్తిగతమైన, హృదయపూర్వకమైన విజ్ఞప్తిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వేడుకుంటున్నాను’ ఆ బంధపూర్వక స్వరాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: నా బిడ్డ గురించి
  rationale: περί + షష్ఠీ విభక్తి ‘గురించి’ అనే భావాన్ని ఇస్తుంది. τέκνονను ‘కుమారుడు’గా పరిమితం చేయకుండా, ఆప్యాయమైన ఆధ్యాత్మిక బంధాన్ని నిలిపేలా ‘బిడ్డ’గా అనువదించాం.
- source_word: ὃν ἐγέννησα
  choice: నేను అతనికి తండ్రినయ్యాను
  rationale: γεννάωలోని జన్మనివ్వడం/కనడం అనే రూపకాన్ని తెలుగులో సహజంగా, పౌలు-ఒనేసిముల ఆధ్యాత్మిక సంబంధాన్ని అతిగా వివరించకుండా ‘తండ్రినయ్యాను’గా అందించాం.
- source_word: ἐν τοῖς δεσμοῖς
  choice: నా సంకెళ్లలో ఉండగా
  rationale: δεσμοί యొక్క ప్రత్యక్షమైన ‘బంధాలు/సంకెళ్లు’ అనే చిత్రాన్ని నిలిపి, సందర్భానుసారంగా పౌలు నిర్బంధంలో ఉన్న కాలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: Ὀνήσιμον
  choice: ఒనేసిము
  rationale: వ్యక్తి పేరును ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
theological_decisions:
- issue: ఒనేసిముతో పౌలుకు ఉన్న సంబంధ స్వభావం
  choice: ఆధ్యాత్మిక పితృత్వపు రూపకాన్ని ‘అతనికి తండ్రినయ్యాను’గా నిలిపాం.
  alternative: అతన్ని విశ్వాసంలోకి నడిపించాను / అతడు నా ఆధ్యాత్మిక కుమారుడయ్యాడు
  rationale: వాక్యం విశ్వాసంలోకి నడిపించడాన్ని బలంగా సూచించినా, గ్రీకు మూలం దాన్ని స్పష్టమైన సిద్ధాంతపరమైన పదాలతో కాక జననం/పితృత్వపు రూపకంతో చెబుతుంది. కాబట్టి మూలంలోని సూచననూ ఉద్వేగాన్నీ అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయతతో కూడిన, గౌరవప్రదమైన లేఖా శైలిని ఉపయోగించాం. గ్రీకులోని పితృత్వ రూపకాన్నీ సంకెళ్ల స్పష్ట చిత్రాన్నీ నిలిపి, తెలుగులో అసహజమైన పదక్షర అనువాదాన్ని నివారించాం.
