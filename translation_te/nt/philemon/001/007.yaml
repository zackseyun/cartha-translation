id: PHM.1.7
reference: Philemon 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: te
  text: సోదరా, నీ ప్రేమవల్ల నాకు ఎంతో ఆనందం, ప్రోత్సాహం కలిగాయి. ఎందుకంటే నీ ద్వారా పరిశుద్ధుల హృదయాలు[a] సేదతీరాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా “పరిశుద్ధుల అంతరంగాలు”; అంటే వారి లోతైన భావాలు లేదా అంతరంగ జీవితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: ఆనందం
  rationale: χαράకు సహజమైన ఆధునిక తెలుగు సమానార్థకం; పౌలు వ్యక్తం చేస్తున్న సంతోషాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πολλὴν ἔσχον
  choice: నాకు ఎంతో … కలిగాయి
  rationale: ఇక్కడ ἔσχον అనుభవాన్ని సూచిస్తుంది. రెండు భావనామాలకు అనుగుణంగా తెలుగులో సహజంగా బహువచన క్రియను వాడాం.
- source_word: παράκλησιν
  choice: ప్రోత్సాహం
  rationale: ఈ సందర్భంలో παράκλησις ఓదార్పు అనే భావంతో పాటు బలపరిచే ప్రోత్సాహాన్ని సూచిస్తుంది; ఫిలేమోను ప్రేమ పౌలుకు కలిగించిన సానుకూల ప్రభావానికి ఇది సహజమైన పదం.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: నీ ప్రేమవల్ల
  rationale: ἐπί + దత్తి విభక్తి ఇక్కడ కారణాన్ని సూచిస్తుంది; పౌలు ఆనందం, ప్రోత్సాహం ఫిలేమోను ప్రేమవల్ల కలిగాయని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγάπῃ
  choice: ప్రేమ
  rationale: ἀγάπηకు సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: σπλάγχνα
  choice: హృదయాలు
  rationale: అక్షరార్థంగా అంతర్గత అవయవాలను సూచించినా, ఇక్కడ లోతైన అంతరంగ భావాలు లేదా అంతరంగ జీవితం అనే నుడికారార్థం ఉంది. ‘హృదయాలు’ ఆ భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; అక్షరార్థ ఛాయను పాదసూచికలో ఉంచాం.
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధుల
  rationale: పౌలు వాడుకలో ἅγιοι దేవునికి ప్రత్యేకపరచబడిన విశ్వాసుల సమాజాన్ని సూచిస్తుంది. ‘పరిశుద్ధులు’ ఆ సమాజపరమైన, ధార్మిక భావాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: ἀναπέπαυται
  choice: సేదతీరాయి
  rationale: ἀναπαύω విశ్రాంతి లేదా ఉపశమనం కలిగించడం అనే భావాన్ని ఇస్తుంది. పరిపూర్ణ కాలం వల్ల ఏర్పడిన ఫలిత స్థితిని ‘సేదతీరాయి’ సహజంగా తెలియజేస్తుంది; పత్రికలో తరువాత కనిపించే పదప్రయోగ సంబంధాన్నీ నిలుపుతుంది.
- source_word: διὰ σοῦ
  choice: నీ ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనత్వం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది; ‘నీ ద్వారా’ దానిని నేరుగా నిలుపుతుంది.
- source_word: ἀδελφέ
  choice: సోదరా
  rationale: పురుష సహవిశ్వాసిని ఉద్దేశించిన ప్రత్యక్ష కుటుంబసంబంధ సంబోధనను అదనపు విశేషణం లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: ἅγιοι పదం యొక్క అనువాదం
  choice: పరిశుద్ధులు
  alternative: దేవుని ప్రజలు; పవిత్రులు
  rationale: ఈ పదం దేవునికి ప్రత్యేకపరచబడిన విశ్వాసులను సూచిస్తుంది. ‘పరిశుద్ధులు’ పౌలు సంఘసంబంధ భాషను నిలుపుతుంది; తరువాతి కాలపు అధికారిక సంతపదవిని సందర్భంలోకి చొప్పించదు.
- issue: σπλάγχνα అనే మానవ అంతరంగ నుడికారం
  choice: హృదయాలు
  alternative: అంతరంగాలు; లోతైన అనురాగాలు
  rationale: గ్రీకు నుడికారం కేవలం శారీరక అవయవాలను కాక, లోతైన అంతరంగ జీవితం, అనురాగాలను సూచిస్తుంది. ‘హృదయాలు’ తెలుగులో సహజంగా ఆ విస్తృత భావాన్ని అందిస్తుంది; పాదసూచిక మూలరూపపు ఛాయను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. గ్రీకు వాక్యంలోని కారణ సంబంధాన్ని రెండు తెలుగు వాక్యాలుగా సహజంగా విభజించాం. ‘సోదరా’ను ఆరంభంలో ఉంచడం తెలుగు సంబోధనలో సహజంగా ఉండి, మూలంలోని ఆప్యాయ ముగింపు బలాన్ని కాపాడుతుంది.
