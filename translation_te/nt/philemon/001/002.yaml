  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: te
  text: 'సహోదరియైన అప్పియకూ[a], మన తోటి సైనికుడైన అర్ఖిప్పుకూ, నీ ఇంటిలోని సంఘానికీ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “సహోదరి”కు బదులుగా “మన సహోదరి” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: అప్పియ
  rationale: గ్రీకు వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: τῇ ἀδελφῇ
  choice: సహోదరి
  rationale: ఇక్కడ క్రీస్తులోని కుటుంబ సంబంధాన్ని సూచించే ‘సహోదరి’ అనే అర్థాన్ని నిలుపుకున్నాం. మూలపాఠంలో ‘మన’ అనే స్వామ్యపదం లేనందున ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: Ἀρχίππῳ
  choice: అర్ఖిప్పు
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగులో గుర్తించదగిన విధంగా లిప్యంతరీకరించాం.
- source_word: τῷ συστρατιώτῃ ἡμῶν
  choice: మన తోటి సైనికుడైన
  rationale: పౌలు ఉపయోగించిన సైనిక రూపకాన్ని తగ్గించకుండా, సహసేవను సూచించే సహజమైన తెలుగు పదబంధాన్ని ఎంచుకున్నాం.
- source_word: τῇ κατ’ οἶκόν σου ἐκκλησίᾳ
  choice: నీ ఇంటిలోని సంఘానికి
  rationale: ఇది ఫిలేమోను ఇంటిలో కూడే లేదా అక్కడ ఉన్న విశ్వాసుల సంఘాన్ని సూచిస్తుంది. ‘కూడే’ అని స్పష్టీకరించకుండా గ్రీకు పదబంధపు సంక్షిప్తతను నిలిపాం.
- source_word: ἐκκλησίᾳ
  choice: సంఘం
  rationale: ఈ సందర్భంలో కూడిన క్రైస్తవ సమాజానికి సహజమైన, స్థిరపడిన తెలుగు పదం.
- source_word: καὶ
  choice: కూడా
  rationale: మునుపటి వచనంలోని సంబోధనల కొనసాగింపును తెలుగులో సహజంగా తెలియజేస్తూ, ఈ వచనంలోని అదనపు గ్రహీతలను అనుసంధానిస్తుంది.
theological_decisions:
- issue: ἀδελφῇతో ‘మన’ అనే స్వామ్యపదాన్ని చేర్చాలా?
  choice: సహోదరి
  alternative: మన సహోదరి
  rationale: ఇచ్చిన SBLGNT ప్రధాన పాఠం τῇ ἀδελφῇ అని ఉంది; ἡμῶν లేదు. కాబట్టి అనువాద సంప్రదాయాన్ని అనుసరించి పదాన్ని చేర్చకుండా మూలపాఠానికే ప్రాధాన్యం ఇచ్చాం; పాఠాంతరాన్ని పాదసూచికలో తెలిపాం.
- issue: συστρατιώτηςలోని సైనిక రూపకాన్ని నిలుపాలా?
  choice: తోటి సైనికుడు
  alternative: తోటి సేవకుడు
  rationale: ‘తోటి సేవకుడు’ సందర్భార్థాన్ని తెలిపినా మూలంలోని సైనిక రూపకాన్ని తొలగిస్తుంది. అందువల్ల రూపకాన్నీ, సహకార భావాన్నీ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. వచనం ముందరి సంబోధనను కొనసాగిస్తున్నందున తెలుగులో సహజంగా ఉండేలా చివర ‘కూడా’ ఉంచాం. ప్రతి గ్రహీతకు చతుర్థీ విభక్తి స్పష్టంగా ఇచ్చాం.
