source:
  edition: SBLGNT
  text: ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις ⸀πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/005.yaml
  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: te
  text: ఎందుకంటే ప్రభువైన యేసుపట్లను, పరిశుద్ధులందరిపట్లను నీకు ఉన్న ప్రేమను, విశ్వాసాన్ని గురించి నేను వింటున్నాను.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'భావాన్ని మరింత స్పష్టంగా చెప్పాలంటే: “ప్రభువైన యేసుపట్ల నీకున్న విశ్వాసాన్ని, పరిశుద్ధులందరిపట్ల నీకున్న ప్రేమను.”'
    reason: alternative_reading
  - marker: b
    text: లేదా “నీకు ఉన్న విశ్వసనీయతను.” గ్రీకు పదం విశ్వాసం, నమ్మకం, లేదా విశ్వసనీయత అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “నీ ప్రేమను, నీకు ఉన్న విశ్వాసాన్ని.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκούων
  choice: నేను వింటున్నాను
  rationale: వర్తమాన భావాన్ని నిలుపుతూ, ముందరి వాక్యంలోని కృతజ్ఞతాప్రకటనతో ఉన్న కారణ సంబంధాన్ని ‘ఎందుకంటే’ ద్వారా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀγάπην
  choice: ప్రేమను
  rationale: ἀγάπηకు సహజమైన, విస్తృతంగా అర్థమయ్యే సాధారణ తెలుగు అనువాదం.
- source_word: πίστιν
  choice: విశ్వాసాన్ని
  rationale: πίστιςకు ప్రాజెక్టు సాధారణ అనువాదాన్ని నిలుపుతుంది; ‘నమ్మకత్వం’ అనే సంభావ్య భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: ప్రభువైన యేసుపట్ల
  rationale: వ్యక్తివైపు దిశను లేదా సంబంధాభిముఖతను సూచించే πρός భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κύριον
  choice: ప్రభువైన
  rationale: క్రీస్తును సూచించే κύριος బిరుదుకు ప్రామాణికమైన తెలుగు రూపం.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: పరిశుద్ధులందరి విషయంలో
  rationale: ముందున్న πρόςకు వాడిన ‘పట్ల’ను యాంత్రికంగా పునరావృతం చేయకుండా, పరిశుద్ధులకు సంబంధించిన దిశ లేదా పరిధిని వ్యక్తం చేస్తుంది; అదే సమయంలో ప్రేమను మాత్రమే వారితో జతచేసి అసలు వాక్యంలోని సందిగ్ధతను ముందుగానే పరిష్కరించదు.
- source_word: ἁγίους
  choice: పరిశుద్ధులు
  rationale: పౌలు లేఖల్లో విశ్వాసుల సమూహాన్ని సూచించే ἅγιοιకు సంక్షిప్తమైన, స్థిరపడిన తెలుగు పదం.
theological_decisions:
- issue: ‘ప్రేమ’, ‘విశ్వాసం’ అనే రెండు నామవాచకాలను తరువాతి రెండు సంబంధ పదబంధాలతో ఎలా అనుసంధానించాలి
  choice: ప్రధాన పాఠంలో ప్రేమ, విశ్వాసం రెండింటినీ ముందుగా ఉంచి, ప్రభువైన యేసు మరియు పరిశుద్ధులందరిని సూచించే రెండు పదబంధాలను వాటితో కలిపి, గ్రీకు వాక్యంలోని ఉపరితల సందిగ్ధతను నిలిపింది.
  alternative: ‘ప్రభువైన యేసుపట్ల నీకున్న విశ్వాసాన్ని, పరిశుద్ధులందరిపట్ల నీకున్న ప్రేమను’ అని భావాన్ని విభజించి స్పష్టంగా చెప్పడం.
  rationale: విశ్వాసం యేసువైపు, ప్రేమ పరిశుద్ధులవైపు ఉద్దేశించబడిందనే విభజన పౌలు వాడుకకు, 7వ వచనానికి సరిపోతుంది. అయినా గ్రీకు వాక్యం ఆ విభజనను వ్యాకరణపరంగా స్పష్టంగా గుర్తించదు; కాబట్టి ప్రధాన పాఠం ఉద్రిక్తతను నిలిపి, స్పష్టీకరించిన భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: πίστις యొక్క భావ పరిధి
  choice: విశ్వాసం
  alternative: నమ్మకత్వం
  rationale: πίστις సాధారణంగా ‘విశ్వాసం’గా అనువదించబడుతుంది; ఈ సందర్భంలో విశ్వాసపాత్రత లేదా నమ్మకత్వం అనే ఛాయ ఉండవచ్చు కాబట్టి దాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చకుండా పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పరిశుద్ధులు’ అనే స్థిరపడిన నూతన నిబంధన సమూహపదాన్ని నిలిపింది. గ్రీకు వాక్యంలోని సంబంధ సందిగ్ధతను ప్రధాన పాఠంలో అతిగా విడదీయకుండా, అవసరమైన వివరణలను పాదటిప్పణుల్లో ఉంచింది.
