- from: ఇకమీదట దాసునిగా[a] కాక, దాసునికంటే మిన్నగా—ప్రియ సహోదరునిగా. అతడు ప్రత్యేకంగా నాకే ప్రియుడు; మరెంత ఎక్కువగా నీకు ప్రియుడో! మానవ సంబంధంలోనూ[b], ప్రభువులోనూ అతడు నీకు ప్రియుడే.
