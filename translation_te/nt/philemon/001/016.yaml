id: PHM.1.16
reference: Philemon 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: te
  text: ఇకపై దాసునిగా[a] కాదు, దాసునికంటే మిన్నగా, ప్రియమైన సహోదరునిగా—ముఖ్యంగా నాకు, అయితే నీకు ఎంత ఎక్కువగా—శరీరంలోనూ[b] ప్రభువులోనూ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాసుడు’కు మూలంలోని గ్రీకు పదం బంధిత సేవలో ఉన్న వ్యక్తిని సూచించగలదు; సందర్భాన్ని బట్టి ‘బానిస’ లేదా ‘సేవకుడు’ అని కూడా అనువదించవచ్చు. ఇక్కడ ఒనేసిము బంధిత సామాజిక స్థితి ఉద్దేశంగా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా ‘శరీరంలోనూ.’ ఇక్కడ అది ‘పాపస్వభావంలో’ అని కాక, భూలోక లేదా సామాజిక సంబంధంలో, లేక వ్యక్తిగతంగా అనే భావాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: ఇకమీదట … కాక
  rationale: మునుపటి పరిస్థితి నుంచి వచ్చిన మార్పును సూచించే కాలార్థక నిరాకరణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὡς δοῦλον
  choice: దాసునిగా
  rationale: ఇక్కడ ఒనేసిము బంధిత సామాజిక స్థితి ప్రధానమైనది. ‘దాసుడు’ ఆ వాస్తవాన్ని తెలుగులో గౌరవప్రదంగా, స్పష్టంగా తెలియజేస్తుంది; పదార్థ పరిధిని పాదసూచిక వివరిస్తుంది.
- source_word: ὑπὲρ δοῦλον
  choice: దాసునికంటే మిన్నగా
  rationale: ὑπέρ ఇక్కడ ప్రత్యామ్నాయాన్ని కాక, స్థానం లేదా విలువలో మించిపోవడాన్ని సూచిస్తుంది.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: ప్రియ సహోదరునిగా
  rationale: విశ్వాస సమాజంలోని కుటుంబసంబంధ రూపకాన్ని ‘సహోదరుడు’ నేరుగా నిలుపుతుంది; ἀγαπητός భావాన్ని ‘ప్రియ’ సహజంగా అందిస్తుంది.
- source_word: μάλιστα ἐμοί
  choice: ప్రత్యేకంగా నాకే ప్రియుడు
  rationale: μάλιστα సూచించే ప్రత్యేక ప్రాధాన్యాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; వాక్య సౌలభ్యం కోసం సందర్భంలో అంతర్లీనంగా ఉన్న ‘ప్రియుడు’ను పునరుద్ఘాటిస్తుంది.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: మరెంత ఎక్కువగా నీకు ప్రియుడో!
  rationale: పౌలుతో ఉన్న సంబంధం నుంచి ఫిలేమోనుతో ఉన్న మరింత గాఢమైన సంబంధానికి వెళ్లే అలంకారిక తులన బలాన్ని కాపాడుతుంది.
- source_word: ἐν σαρκὶ
  choice: మానవ సంబంధంలోనూ
  rationale: ఈ సందర్భంలో σάρξ పాపస్వభావాన్ని కాక భౌతిక, భూలోక లేదా సామాజిక సంబంధాన్ని సూచిస్తుంది. అక్షరానువాదం తెలుగులో అపార్థం కలిగించే అవకాశం ఉన్నందున సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, ప్రత్యక్ష రూపాన్ని పాదసూచికలో నిలిపింది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులోనూ
  rationale: ప్రభువుతో ఐక్యత లేదా క్రైస్తవ సంబంధ పరిధిని సూచించే పౌలు వాడుకను అతిగా వివరణ చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ఒనేసిము సందర్భంలో δοῦλος అనువాదం
  choice: దాసుడు
  alternative: సేవకుడు; బానిస
  rationale: పత్రికలో ఒనేసిము సామాజిక బంధిత స్థితి సందర్భపరంగా ముఖ్యమైనది. ‘సేవకుడు’ ఆ వాస్తవాన్ని బలహీనపరచవచ్చు; ‘బానిస’ సాధ్యమైనప్పటికీ ఆధునిక తెలుగులో మరింత కఠిన లేదా అవమానార్థ ఛాయ కలిగించవచ్చు. ‘దాసుడు’తో పాటు పాదసూచిక మూలపద పరిధిని తెలియజేస్తుంది.
- issue: ἐν σαρκὶ καὶ ἐν κυρίῳ భావం
  choice: మానవ సంబంధంలోనూ, ప్రభువులోనూ
  alternative: శరీరంలోనూ, ప్రభువులోనూ; వ్యక్తిగతంగానూ, ప్రభువులోనూ
  rationale: ఈ జంట ఫిలేమోనుకు ఒనేసిముతో ఉన్న మానవ/సామాజిక సంబంధాన్నీ, క్రైస్తవ సంబంధాన్నీ కలిపి ఉంచుతుంది. ‘మానవ సంబంధంలో’ సందర్భార్థాన్ని స్పష్టం చేస్తూనే, పాదసూచిక ద్వారా మూలంలోని రూపకాన్ని మరియు దాని అర్థవిస్తృతిని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవభరితంగా రూపొందించబడింది. గ్రీకు వాక్యంలోని సంక్షిప్త అనుబంధ నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం. ‘ప్రియుడు’ అనే భావం ἀγαπητόν నుంచి తరువాతి తులనలకూ వ్యాకరణపరంగా కొనసాగుతుందని స్పష్టం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
