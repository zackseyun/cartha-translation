  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: te
  text: మనలో ఉన్న ప్రతి మంచి విషయాన్ని మెస్సీయ కొరకు తెలుసుకోవడం ద్వారా నీ విశ్వాసపు సహవాసం ప్రభావవంతం కావాలని[a][b][c][d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ విశ్వాసాన్ని పంచుకోవడం’ లేదా ‘నీ విశ్వాసంలోని భాగస్వామ్యం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: πίστις అనే గ్రీకు పదానికి కొన్ని సందర్భాల్లో ‘నమ్మకత్వం’ లేదా ‘నమ్మకం’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: c
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘మనలో’కు బదులు ‘నీలో’ అని ఉంది.
    reason: textual_variant
  - marker: d
    text: ‘క్రీస్తు కొరకు’ అని కూడా అనువదించవచ్చు. ఇక్కడ Χριστός అనే బిరుదును ‘మెస్సీయ’గా అనువదించాం.
    reason: lexical_alternative
  - marker: e
    text: చివరి పదబంధాన్ని ‘మెస్సీయను దృష్టిలో ఉంచుకొని మనలో ఉన్న ప్రతి మంచి విషయాన్ని తెలుసుకోవడం ద్వారా’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὅπως
  choice: కావాలని
  rationale: ముందటి వాక్యంలోని పౌలు ప్రార్థనకు సంబంధించిన ఉద్దేశం లేదా ఆశను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: κοινωνία
  choice: సహవాసం
  rationale: పంచుకోవడం, పాలుపంచుకోవడం, భాగస్వామ్యం అనే భావాలను కలిగిన పదం. మూలంలోని విస్తృతమైన సామూహిక భావాన్ని ప్రధాన పాఠ్యంలో కాపాడేందుకు ‘సహవాసం’ ఎంచుకున్నాం.
- source_word: πίστεώς
  choice: విశ్వాస
  rationale: ఈ సందర్భంలో ఫిలేమోను క్రైస్తవ విశ్వాసాన్ని సూచించే సాధారణ అర్థం సరిపోతుంది; ‘నమ్మకత్వం’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἐνεργὴς γένηται
  choice: ప్రభావవంతం కావాలని
  rationale: క్రియాశీలంగా లేదా ఫలప్రదంగా మారడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν ἐπιγνώσει
  choice: గుర్తించడం ద్వారా
  rationale: ἐν ఇక్కడ సాధనార్థకంగా ఉండవచ్చు; ἐπίγνωσις సూచించే తెలుసుకోవడం లేదా లోతుగా గుర్తించడం అనే భావాన్ని సులభమైన తెలుగులో అందిస్తుంది.
- source_word: παντὸς ἀγαθοῦ
  choice: ప్రతి మంచిదానిని
  rationale: నపుంసక ఏకవచన నిర్మాణాన్ని ‘ప్రతి మంచి విషయం’ అనే విస్తృత అర్థంతో సహజంగా అందిస్తుంది; మూలంలో లేని ‘వరము’ వంటి ప్రత్యేక భావాన్ని చేర్చదు.
- source_word: τοῦ ἐν ἡμῖν
  choice: మనలో ఉన్న
  rationale: SBLGNT పాఠంలోని ἡμῖνను అనుసరిస్తూ సమూహార్థకమైన ‘మనలో’ను నిలుపుతుంది.
- source_word: εἰς Χριστόν
  choice: మెస్సీయ కొరకు
  rationale: εἰς యొక్క దిశ, ఉద్దేశం లేదా సంబంధ భావాన్ని పూర్తిగా నిర్ధారించకుండా ‘కొరకు’తో అందిస్తుంది; Χριστόςను బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తుంది.
theological_decisions:
- issue: κοινωνία τῆς πίστεώς σου యొక్క భావం
  choice: నీ విశ్వాస సహవాసం
  alternative: నీ విశ్వాసాన్ని పంచుకోవడం; నీ విశ్వాసంలో భాగస్వామ్యం
  rationale: ఈ క్లిష్టమైన పదబంధం విశ్వాసాన్ని కార్యరూపంలో పంచుకోవడాన్నీ, విశ్వాసంలో సామూహిక భాగస్వామ్యాన్నీ సూచించవచ్చు. ప్రధాన పాఠ్యం ఒక భావానికే పరిమితం కాకుండా ‘సహవాసం’ను ఉంచుతుంది.
- issue: ἐν ἡμῖνలో ‘మన’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: పౌలు, ఫిలేమోను మరియు తోటి విశ్వాసులను సమూహంగా సూచించే ‘మనలో’
  alternative: కొన్ని ప్రతులలో ఉన్న ‘నీలో’ అనే పాఠం, ఫిలేమోనును ప్రత్యేకంగా సూచిస్తుంది
  rationale: ముద్రిత గ్రీకు పాఠం ἡμῖνను కలిగి ఉన్నందున దానినే ప్రధాన పాఠ్యంలో నిలిపాం; ప్రతుల భేదాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: εἰς Χριστόν యొక్క సంబంధం
  choice: మనలో ఉన్న ప్రతి మంచిదీ మెస్సీయ కొరకు అనే సంబంధం
  alternative: మెస్సీయ వైపు లేదా మెస్సీయకు సంబంధించి; మొత్తం క్రియతో అనుసంధానం
  rationale: గ్రీకు వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి ఒకటి కంటే ఎక్కువ అనుసంధానాలకు వీలు ఇస్తుంది. ప్రధాన పాఠ్యం సాధ్యమైన సహజ పఠనాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘విశ్వాస సహవాసం’ కొంత సాంద్రమైన పదబంధమే అయినప్పటికీ, మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను తొలగించకుండా ఉంచి దాని సాధ్యమైన అర్థాలను పాదటిప్పణిలో వివరించాం.
