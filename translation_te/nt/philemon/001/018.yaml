review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional contrast (εἰ δέ), the broad unspecified wrong (τι ἠδίκησέν σε), possible indebtedness (ἢ ὀφείλει), and Paul’s imperative that the obligation be entered against him (τοῦτο ἐμοὶ ἐλλόγα). No theological expansion is introduced.
  naturalness: The sentence is generally natural modern Telugu. However, “నా లెక్కలో వేయి” is somewhat less idiomatic and can sound like merely including something in a calculation. “నా ఖాతాలో వేయి” more clearly conveys the commercial/accounting sense of charging an obligation to Paul’s account.
  terminology: “అన్యాయం” appropriately preserves the breadth of ἀδικέω, without narrowing it to theft or fraud. “బాకీ” is a natural rendering of indebtedness. “ఖాతా” is the clearest contemporary Telugu term for the accounting metaphor in ἐλλογέω.
  issues:
  - severity: low
    issue: Accounting idiom is slightly imprecise
    rationale: “నా లెక్కలో వేయి” is understandable, but “నా ఖాతాలో వేయి” is more natural and specifically denotes posting a charge to someone’s account, as required by ἐλλόγα.
  revised_text: అయితే అతడు నీకు ఏ విషయంలోనైనా అన్యాయం చేసి ఉంటే, లేదా నీకు ఏమైనా బాకీ ఉంటే, దానిని నా ఖాతాలో వేయి.[a]
