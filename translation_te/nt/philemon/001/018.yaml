  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: te
  text: అయితే అతడు నీకు ఏ విషయంలోనైనా అన్యాయం చేసి ఉంటే, లేదా నీకు ఏమైనా బాకీ ఉంటే, దానిని నా ఖాతాలో వేయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని నా ఖాతాకు రాసివేయి.” ఇక్కడి క్రియకు ఒక మొత్తాన్ని ఎవరి ఖాతాలోనైనా నమోదు చేయడం, అంటే వారి మీద బాకీగా వేయడం అనే లెక్కల సంబంధమైన భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: అయితే ... ఉంటే
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసం లేదా కొనసాగింపును ‘అయితే’ సహజంగా తెలియజేస్తుంది; εἰ యొక్క షరతు భావం ‘ఉంటే’లో నిలుస్తుంది.
- source_word: τι ἠδίκησέν σε
  choice: అతడు నీకు ఏ విషయంలోనైనా అన్యాయం చేసి ఉంటే
  rationale: ἀδικέω వ్యక్తిగత, నైతిక, లేదా ఆర్థిక అన్యాయాన్ని సూచించగల విస్తృత పదం. ‘ఏ విషయంలోనైనా’ τι యొక్క అనిర్దిష్ట విస్తృతిని కాపాడుతుంది.
- source_word: ἢ ὀφείλει
  choice: లేదా నీకు ఏమైనా బాకీ ఉంటే
  rationale: ὀφείλω ఇక్కడ అప్పు లేదా తీర్చవలసిన బాధ్యతను సూచిస్తుంది. సందర్భం నుంచి గ్రహించబడే ‘నీకు’ను తెలుగులో స్పష్టంగా ఉంచడం సహజం.
- source_word: τοῦτο
  choice: దాన్ని
  rationale: ఇప్పుడే పేర్కొన్న అన్యాయం లేదా బాకీ రెండింటిలో ఏదైనా తిరిగి సూచించే ఏకవచన నిర్దేశక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐμοὶ ἐλλόγα
  choice: దాన్ని నా లెక్కలో వేయి
  rationale: ἐλλογέω యొక్క లెక్కల భాషలోని ‘ఒకరి ఖాతాకు చేర్చడం/వసూలుగా నమోదు చేయడం’ అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఏకవచన సంబోధన వాడబడింది. ‘అన్యాయం’ అనే విస్తృత పదం ద్వారా తప్పు స్వభావాన్ని అతిగా నిర్దిష్టం చేయలేదు; ‘నా లెక్కలో వేయి’ ద్వారా మూలంలోని ఆర్థిక రూపకాన్ని సులభంగా గ్రహించగల విధంగా కాపాడాం.
