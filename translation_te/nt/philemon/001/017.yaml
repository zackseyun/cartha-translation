  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: te
  text: కాబట్టి నన్ను నీ భాగస్వామిగా భావిస్తే, నన్ను స్వీకరించినట్లే అతణ్ణి స్వీకరించు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతణ్ణి ఆదరంగా చేర్చుకో.’ ఈ క్రియ ఒకరిని అనుకూలంగా స్వీకరించడం లేదా సహవాసంలో చేర్చుకోవడం అనే భావాన్ని కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: కాబట్టి … అయితే
  rationale: οὖν సూచించే ముందు మాటతోని తార్కిక సంబంధాన్ని ‘కాబట్టి’ తెలియజేస్తుంది; εἰ యొక్క షరతును ‘అయితే’ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔχεις κοινωνόν
  choice: నన్ను నీ భాగస్వామిగా భావిస్తే
  rationale: κοινωνός అనేది మరొకరితో కలిసి పాలుపంచుకునే వ్యక్తిని సూచిస్తుంది. ‘భాగస్వామి’ పరస్పర సంబంధాన్ని తెలియజేస్తుంది; ἔχεις అనే గ్రీకు ప్రయోగాన్ని తెలుగులో సహజంగా చెప్పడానికి ‘భావిస్తే’ వాడబడింది.
- source_word: προσλαβοῦ
  choice: స్వీకరించు
  rationale: ఈ మధ్యమపద ఆజ్ఞారూపం అనుకూలంగా చేర్చుకోవడం, ఆహ్వానించడం లేదా అంగీకరించడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘స్వీకరించు’ ఆ భావ విస్తృతిని కాపాడుతుంది.
- source_word: αὐτὸν
  choice: అతణ్ణి
  rationale: సందర్భంలో ఈ ఏకవచన పుంలింగ సర్వనామం ఒనేసిమును సూచిస్తుంది.
- source_word: ὡς ἐμέ
  choice: నన్నులాగే
  rationale: ὡς తో కూడిన పోలికను సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తూ, పౌలును స్వీకరించే విధంగానే ఒనేసిమును స్వీకరించాలనే విజ్ఞప్తిని తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు విజ్ఞప్తిలో κοινωνός యొక్క సంబంధార్థం
  choice: భాగస్వామి
  alternative: తోటి భాగస్థుడు; సహవాసి
  rationale: ఇక్కడ పౌలు, ఫిలేమోను మధ్య ఉన్న ఉమ్మడి భాగస్వామ్య సంబంధమే ప్రధాన భావం. ‘భాగస్వామి’ ఏ ప్రత్యేక మతశాఖకు చెందిన సాంకేతిక అర్థాన్ని చేర్చకుండా ఆ పరస్పర సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఏకవచన సంభాషణ శైలి వాడబడింది. మూలంలోని షరతు, తార్కిక అనుసంధానం, సంబంధపరమైన విజ్ఞప్తి నిలుపబడ్డాయి.
