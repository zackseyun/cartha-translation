    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: అతడు
  rationale: మునుపటి వచనంలోని ఒనేసిమును సూచించే substantival/anaphoric article. తెలుగు వాక్యప్రవాహంలో ‘అతడు’ సహజంగా ఆ సూచనను కొనసాగిస్తుంది.
- source_word: ποτέ
  choice: ఒకప్పుడు
  rationale: గత కాలాన్ని సూచిస్తూ νυνί (‘ఇప్పుడు’)తో ఉన్న స్పష్టమైన కాలవ్యతిరేకతను సహజ తెలుగులో నిలుపుతుంది.
- source_word: σοι
  choice: నీకు
  rationale: ἄχρηστονతో ఉన్న దత్తి విభక్తి వ్యక్తిగత సంబంధ సందర్భంలో ‘నీకు’గా సహజంగా వ్యక్తమవుతుంది.
- source_word: ἄχρηστον
  choice: పనికిరానివాడిగా
  rationale: ‘ఉపయోగం లేని’ అనే సాధారణ అర్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తూ, εὔχρηστονతో ఉన్న పదవ్యతిరేకతను కాపాడుతుంది.
- source_word: νυνὶ δὲ
  choice: ఇప్పుడు
  rationale: ‘ఒకప్పుడు’తో కాలవ్యతిరేకత స్పష్టంగా ఉండటంతో, తెలుగు నిర్మాణంలో ‘ఇప్పుడు’ సహజంగా δέ యొక్క వ్యతిరేక భావాన్ని మోస్తుంది.
- source_word: σοὶ καὶ ἐμοὶ
  choice: నీకూ నాకూ
  rationale: రెండు దత్తి రూపాల సమతూకాన్ని ‘నీకూ నాకూ’ అనే జత నిర్మాణం సంక్షిప్తంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: εὔχρηστον
  choice: పనికివచ్చేవాడిగా
  rationale: ‘ఉపయోగకరమైన/ప్రయోజనకరమైన’ భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తూ, ‘పనికిరానివాడిగా’తో ఉద్దేశపూర్వక పదప్రయోగ వ్యతిరేకతను నిలుపుతుంది.
theological_decisions:
- issue: ఒనేసిము పేరుతో ఉండవచ్చిన పదప్రయోగం మరియు అతనిలో వచ్చిన మార్పు
  choice: ప్రధాన పాఠ్యంలో ‘పనికిరాని—పనికివచ్చే’ అనే సరళ వ్యతిరేకతను నిలుపడం
  alternative: పేరుతో ఉన్న పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా మరింత స్పష్టపరచడం
  rationale: గ్రీకు పాఠ్యమే వ్యతిరేకతను స్పష్టంగా చూపుతుంది. సరళ అనువాదం సాహిత్య ప్రభావాన్ని కాపాడుతూ, మూలంలో లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘పనికిరాని/పనికివచ్చే’ జంట మూలంలోని ἄχρηστος/εὔχρηστος పదవ్యతిరేకతను సహజంగా నిలుపుతుంది.
