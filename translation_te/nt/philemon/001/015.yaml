source:
  edition: SBLGNT
  text: τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: te
  text: 'ఎందుకంటే, బహుశా ఈ కారణంగానే అతడు కొంతకాలం నీ నుండి వేరుచేయబడ్డాడు: నీవు అతణ్ణి ఎప్పటికీ తిరిగి పొందేలా.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు కొంతకాలం నీ నుండి వెళ్లిపోయాడు.’ గ్రీకులో ‘వేరుచేయబడ్డాడు’ అనే కర్మణి రూపం నేరుగా నింద మోపకుండా సున్నితంగా చెప్పి ఉండవచ్చు; సూచితమైన దైవిక ఉద్దేశానికి కూడా అవకాశం ఉంచవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: బహుశా
  rationale: పౌలు నిశ్చయంగా ప్రకటించకుండా వినయంగా ఒక సాధ్యతను సూచిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంతో ఉన్న వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: διὰ τοῦτο
  choice: ఈ కారణంగానే అనే భావం వాక్య నిర్మాణంలో అంతర్భూతం
  rationale: గ్రీకు పదబంధంలోని కారణం లేదా ఉద్దేశ భావం ‘వేరుచేయబడింది ... కావచ్చు’ అనే మొత్తం నిర్మాణం ద్వారా వ్యక్తమవుతుంది; ప్రత్యేకంగా చేరిస్తే తెలుగులో వాక్యం భారంగా మారుతుంది.
- source_word: ἐχωρίσθη
  choice: వేరుచేయబడింది
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి రూపాన్ని నిలుపుతూ, ఒనేసిము స్వయంగా వెళ్లాడా లేక దైవిక సంకల్పం సూచితమైందా అనే సందిగ్ధతను పరిష్కరించదు.
- source_word: πρὸς ὥραν
  choice: కొంతకాలం
  rationale: అక్షరార్థంగా ‘ఒక గంట’ కాకుండా పరిమిత కాలాన్ని సూచించే నుడికారాన్ని సహజంగా అందిస్తుంది; ‘ఎప్పటికీ’తోని వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἵνα
  choice: అనే కావచ్చు
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తూ, τάχα వల్ల మొత్తం ఊహకు ఉన్న అనిశ్చిత స్వరాన్ని కూడా తెలుగులో నిలుపుతుంది.
- source_word: αἰώνιον
  choice: ఎప్పటికీ
  rationale: ఇక్కడ క్రియావిశేషణ భావంతో తాత్కాలిక వియోగానికి ఎదురుగా శాశ్వతమైన తిరిగి పొందడాన్ని సూచిస్తుంది.
- source_word: αὐτὸν
  choice: అతణ్ణి
  rationale: సందర్భంలో ఒనేసిమును సూచించే ప్రత్యక్ష కర్మ.
- source_word: ἀπέχῃς
  choice: తిరిగి కలిగివుండాలి
  rationale: ἀπέχω ఇక్కడ తిరిగి పొందడం మరియు ఇకపై కలిగివుండడం అనే భావాన్ని ఇస్తుంది; సంబంధపరమైన సందర్భానికి తగిన సహజ తెలుగు రూపం.
theological_decisions:
- issue: ἐχωρίσθη అనే కర్మణి క్రియలో సూచిత కర్తృత్వం
  choice: ‘వేరుచేయబడింది’ అని కర్మణి రూపాన్ని నిలుపడం
  alternative: ‘అతడు వెళ్లిపోయాడు’ లేదా ‘దేవుడు అతణ్ణి వేరు చేశాడు’
  rationale: పౌలు నేరుగా ఒనేసిముపై నింద మోపడు, అలాగే దేవుణ్ణి స్పష్టమైన కర్తగా పేర్కొనడు. ఈ రూపం దైవిక నిర్వహణకు అవకాశం ఉంచుతూనే దానిని నిర్దిష్టంగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగాను, పత్రికా సందర్భానికి తగిన గౌరవప్రదమైన శైలిలోనూ రూపొందించబడింది. గ్రీకు వాక్యంలోని తాత్కాలిక వియోగం—శాశ్వత పునరుద్ధరణ వ్యత్యాసం మరియు కర్తృత్వ సందిగ్ధత నిలుపబడ్డాయి.
