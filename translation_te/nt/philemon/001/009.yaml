id: PHM.1.9
reference: Philemon 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: te
  text: ప్రేమను బట్టి, ఆజ్ఞాపించడంకన్నా వేడుకుంటున్నాను—పౌలునైన నేను, వృద్ధుడను[a], ఇప్పుడు మెస్సీయ యేసు ఖైదీని కూడా—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాయబారిని.’ అయితే గ్రీకు పదానికి సహజమైన అర్థం ‘వృద్ధుడు.’
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: ప్రేమను బట్టి
  rationale: διά + accusative ఇక్కడ కారణాన్ని సూచిస్తుంది. ‘ప్రేమను బట్టి’ అనేది ప్రేమ కారణంగానూ ప్రేమ దృష్ట్యానూ పౌలు వేడుకుంటున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μᾶλλον παρακαλῶ
  choice: ఆజ్ఞాపించకుండా వేడుకోవడానికే ఇష్టపడుతున్నాను
  rationale: μᾶλλον మునుపటి వచనంలోని ఆజ్ఞాపించే అవకాశానికి బదులుగా పౌలు ఎంచుకున్న మార్గాన్ని సూచిస్తుంది; παρακαλῶ ఇక్కడ అధికారపూర్వక ఆజ్ఞ కాక వ్యక్తిగత విజ్ఞప్తి.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: ఇలా ఉన్న పౌలు అనే నేను
  rationale: మూలంలోని స్వీయ-వర్ణన కొంత సంక్షిప్తంగా, అసంపూర్ణంగా ఉంది. తెలుగు వాక్యంలో అర్థమయ్యేలా చేస్తూనే, తరువాత వచ్చే ‘వృద్ధుణ్ణి… ఖైదీని’ అనే వర్ణనలతో దాని సంబంధాన్ని నిలుపుతుంది.
- source_word: πρεσβύτης
  choice: వృద్ధుణ్ణి
  rationale: ఈ పదానికి సహజమైన అర్థం వయస్సు మళ్లిన వ్యక్తి. ‘రాయబారి’ అనేది వేరొక గ్రీకు పదంతో సంబంధం ఉన్న ప్రత్యామ్నాయ ఊహ; ‘సంఘపెద్ద’ అనే పదవి భావం ఇక్కడ అవసరం లేదు.
- source_word: νυνὶ δὲ καὶ
  choice: ఇప్పుడు … కూడా
  rationale: νυνί యొక్క కాల సూచనను, καί యొక్క అదనపు భావాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచింది.
- source_word: δέσμιος Χριστοῦ Ἰησοῦ
  choice: క్రీస్తు యేసు ఖైదీని
  rationale: δέσμιος అంటే ఖైదీ. Genitive సంబంధం క్రీస్తు యేసుకు చెందినవాడిగా లేదా ఆయన నిమిత్తం బంధించబడినవాడిగా రెండింటినీ సూచించగలదు; సంక్షిప్త రూపం ఆ సంబంధాన్ని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: πρεσβύτης యొక్క అర్థం
  choice: వృద్ధుడు
  alternative: రాయబారి; సంఘపెద్ద
  rationale: SBLGNTలోని πρεσβύτης సాధారణంగా వృద్ధుడిని సూచిస్తుంది. ‘రాయబారి’కి సాధారణ పదం πρεσβευτής; ‘సంఘపెద్ద’ అనే పదవి భావాన్ని ఇక్కడ చేర్చడం మూలపాఠం కంటే ఎక్కువ.
- issue: Χριστός అనువాదం
  choice: క్రీస్తు
  alternative: మెస్సీయ
  rationale: ఆధునిక ప్రామాణిక తెలుగులో ‘క్రీస్తు యేసు’ సుపరిచితమైనప్పటికీ గౌరవపద బలాన్ని కలిగి ఉంది. ‘మెస్సీయ యేసు’ కన్నా సహజంగా ఉండి, మూలంలోని బిరుదును లిప్యంతరీకృత రూపంలో నిలుపుతుంది.
- issue: δέσμιος Χριστοῦ Ἰησοῦ లో genitive సంబంధం
  choice: క్రీస్తు యేసు ఖైదీ
  alternative: క్రీస్తు యేసు నిమిత్తం ఖైదీ; క్రీస్తు యేసుకు చెందిన ఖైదీ
  rationale: గ్రీకు genitive కారణం, అనుబంధం లేదా చెందినదనాన్ని సూచించే అవకాశం ఉంది. ప్రధాన పాఠంలో సంక్షిప్త సంబంధాన్ని ఉంచడం ద్వారా ఆ భావవిస్తృతిని అనవసరంగా కుదించలేదు.
translation_notes:
  register: భాష ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది. 8వ వచనంతో ఉన్న ‘ఆజ్ఞాపించడం—వేడుకోవడం’ వ్యత్యాసాన్ని తెలుగులో స్పష్టంచేసింది. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
