  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: te
  text: అయితే, నీ సమ్మతి లేకుండా[a] నేను ఏమీ చేయాలని కోరుకోలేదు. నీ మంచి పని[b] బలవంతం వల్ల జరిగినట్టుగా కాక, స్వచ్ఛందంగా[c] జరగాలన్నదే నా ఉద్దేశం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ ఆమోదం లేకుండా’ లేదా ‘నీ అభిప్రాయాన్ని పరిగణనలోకి తీసుకోకుండా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ మంచితనం’ లేదా ‘నీ దయ.’ గ్రీకు పదబంధం ఈ సందర్భంలో ఫిలేమోను చేసే మంచి పనినిగానీ, మరింత సాధారణంగా అతని మంచితనాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అంటే, ‘నీ సొంత ఇష్టంతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: నీ సమ్మతి లేకుండా
  rationale: γνώμη అభిప్రాయం, నిర్ణయం, ఆమోదం లేదా సమ్మతి అనే అర్థాలను ఇవ్వగలదు. ఒనేసిము విషయంలో ఫిలేమోను అనుమతి లేకుండా పౌలు వ్యవహరించకూడదనుకున్న సందర్భంలో ‘సమ్మతి’ సహజంగా ఉండి, అతని స్వేచ్ఛాపూర్వక అంగీకారాన్ని స్పష్టం చేస్తుంది.
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: ఏమీ చేయాలని నేను కోరుకోలేదు
  rationale: θέλω ఇక్కడ పౌలు సంకల్పాన్ని లేదా ఇష్టాన్ని తెలియజేస్తుంది. ఈ అనువాదం దానిని ‘నిర్ణయించుకున్నాను’ అని అతిగా నిర్దిష్టం చేయకుండా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὸ ἀγαθόν σου
  choice: నీవు చేసే మేలు
  rationale: నపుంసకలింగ విశేషణం ఇక్కడ ఫిలేమోను చేయగల మంచి కార్యాన్ని సూచించే అవకాశం ఎక్కువ. అయితే అది అతని మంచితనం లేదా దయను మరింత సాధారణంగా సూచించగల అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
- source_word: ὡς κατὰ ἀνάγκην
  choice: బలవంతంగా చేసినట్టుగా
  rationale: ἀνάγκη ఇక్కడ కేవలం అవసరాన్ని కాక ఒత్తిడి లేదా నిర్బంధాన్ని సూచిస్తుంది. ‘చేసినట్టుగా’ అనే రూపం ὡς లోని పోలిక భావాన్ని నిలుపుతుంది.
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: స్వచ్ఛందంగా చేసినదై
  rationale: ἑκούσιον బలవంతం లేకుండా ఇష్టపూర్వకంగా చేయబడినదాన్ని సూచిస్తుంది. ‘స్వచ్ఛందంగా’ అనే పదం నిర్బంధంతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἵνα μὴ ... ᾖ ἀλλά
  choice: '... కాక ... ఉండాలన్నదే నా ఉద్దేశం'
  rationale: ἵνα తో వ్యక్తమైన ఉద్దేశాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తూ, బలవంతం మరియు స్వచ్ఛందత మధ్యనున్న వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఫిలేమోను ప్రతిస్పందన స్వభావం
  choice: అతని మేలు బలవంతం వల్ల కాక స్వచ్ఛందంగా జరగాలని పౌలు కోరుకున్నట్లు అనువదించడం
  alternative: ‘నీ మంచితనం’ అని మరింత అమూర్తంగా లేదా ‘నీ దయ’ అని మరింత నిర్దిష్టంగా అనువదించడం
  rationale: గ్రీకు వాక్యం ఫిలేమోను చేయవలసిన నిర్దిష్ట కార్యాన్ని చెప్పకుండా, అతని ప్రతిస్పందన స్వేచ్ఛాపూర్వకంగా ఉండాలనే నైతిక స్వభావాన్ని ప్రధానంగా ఉంచుతుంది. అందువల్ల అనువాదం పాఠ్యంలో లేని ప్రత్యేక సిద్ధాంతపరమైన లేదా నైతిక నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన ఏకవచన సంభాషణ శైలిని ఉపయోగించాం. మూలంలోని ఉద్దేశం, బలవంతం–స్వచ్ఛందత వ్యత్యాసం, అలాగే τὸ ἀγαθόν σου లోని భావ అస్పష్టతను నిలిపాం.
