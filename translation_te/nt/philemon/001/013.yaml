id: PHM.1.13
reference: Philemon 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: te
  text: అతణ్ణి నా దగ్గరే ఉంచుకోవాలని నేను కోరుకున్నాను; తద్వారా సువార్త సంకెళ్లలో[a] అతడు నీ తరఫున నాకు సేవ చేయడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సువార్త కోసం సంకెళ్లలో”—అంటే సువార్త కారణంగా భరిస్తున్న సంకెళ్లలో.
    reason: τοῦ εὐαγγελίου అనే గ్రీకు షష్ఠీవిభక్తి సంకెళ్లకు సువార్తతో ఉన్న సంబంధాన్ని సూచిస్తుంది; సందర్భంలో కారణార్థం సాధ్యమైన అర్థం.
lexical_decisions:
- source_word: ὃν
  choice: అతణ్ణి
  rationale: ఈ పురుషలింగ ఏకవచన సంబంధ సర్వనామం ముందుగా ప్రస్తావించిన ఒనేసిమును సూచిస్తుంది. ఆధునిక తెలుగులో ‘అతణ్ణి’ సహజంగా ఉంది.
- source_word: ἐβουλόμην
  choice: కోరుకున్నాను
  rationale: గతకాలంలో పౌలుకు ఉన్న కోరిక లేదా ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది; అసంపూర్ణ భూతకాల రూపాన్ని అతిగా వ్యాఖ్యానించదు.
- source_word: πρὸς ἐμαυτὸν κατέχειν
  choice: నా దగ్గరే ఉంచుకోవాలని
  rationale: ఒనేసిమును తన సన్నిధిలో తనతో ఉంచుకోవాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. ‘ఏ’ పౌలు తన దగ్గర ఉంచుకోవాలనే భావానికి తగిన బలం ఇస్తుంది.
- source_word: ἵνα
  choice: తద్వారా
  rationale: ఒనేసిమును తన దగ్గర ఉంచుకోవాలన్న పౌలు ఉద్దేశాన్ని సూచించే ప్రయోజన సంబంధాన్ని నిలుపుతుంది.
- source_word: ὑπὲρ σοῦ
  choice: నీ తరఫున
  rationale: ఒనేసిము చేసే సేవ ఫిలేమోను తరఫున లేదా అతని పక్షాన జరిగేదనే ప్రతినిధిత్వ భావాన్ని చూపుతుంది; పూర్తి స్థానాపన్నతను నిర్బంధంగా ప్రకటించదు.
- source_word: μοι διακονῇ
  choice: అతడు నాకు సేవ చేయగలడు
  rationale: διακονέωలోని విస్తృత సేవా లేదా సహాయక భావాన్ని ‘సేవ చేయు’ నిలుపుతుంది. సంభావనతో కూడిన ప్రయోజన భావాన్ని ‘చేయగలడు’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τοῖς δεσμοῖς
  choice: సంకెళ్లలో
  rationale: δεσμοί యొక్క స్పష్టమైన భౌతిక రూపకాన్ని నిలుపుతూ పౌలు ఖైదులో ఉన్న పరిస్థితిని సూచిస్తుంది.
- source_word: τοῦ εὐαγγελίου
  choice: సువార్త సంకెళ్లు
  rationale: గ్రీకు షష్ఠీవిభక్తి సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది. సంకెళ్లు సువార్త కారణంగా వచ్చాయా లేక సువార్తతో మరొక విధంగా సంబంధించాయా అనే భావాన్ని ప్రధాన పాఠ్యంలో పూర్తిగా పరిష్కరించదు.
theological_decisions:
- issue: δεσμοῖς‌ను విశేషించే τοῦ εὐαγγελίου యొక్క భావం
  choice: సువార్త సంకెళ్లలో
  alternative: సువార్త కారణంగా వేసిన సంకెళ్లలో
  rationale: ప్రధాన పాఠ్యం గ్రీకు షష్ఠీవిభక్తి యొక్క సంక్షిప్తతను, భావ విస్తృతిని నిలుపుతుంది. కారణార్థం సందర్భంలో బలంగా ఉన్నప్పటికీ దానిని పాఠ్యంలోనే ఏకైక అర్థంగా నిర్ణయించకుండా పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘సేవ’ను మతపరమైన అధికారిక పరిచర్యకు మాత్రమే పరిమితం చేయకుండా సాధారణ సహాయసేవ భావంలో ఉంచాం. ‘సువార్త సంకెళ్లు’ అనే సంక్షిప్త పదబంధం పౌలు వాడిన భావసాంద్రతను నిలుపుతుంది; పాదసూచిక దాని సాధ్యమైన కారణార్థాన్ని వివరిస్తుంది.
