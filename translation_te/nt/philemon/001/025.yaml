  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: te
  text: ప్రభువైన యేసు క్రీస్తు[a] కృప మీ[b] ఆత్మతో ఉండుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘క్రీస్తు’ అంటే ‘అభిషిక్తుడు’; అంటే ‘మెస్సీయ.’
    reason: lexical_alternative
  - marker: b
    text: ‘మీ’ అనే సర్వనామం గ్రీకులో బహువచనం; కాబట్టి ఈ ముగింపు ఆశీర్వాదం ఫిలేమోనుకు మాత్రమే కాక, ఈ లేఖను స్వీకరించిన సమూహానికంతటికీ వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: దేవుడు అనుగ్రహించే దయను, ఆశీర్వాదాన్ని సూచించే పౌలు లేఖల ముగింపు పదంగా ‘కృప’ సహజమైనదీ స్థిరపడినదీ.
- source_word: κυρίου
  choice: ప్రభువైన
  rationale: κύριος అనే బిరుదులోని అధికారాన్నీ క్రీస్తు సంబంధమైన ప్రాధాన్యాన్నీ నిలుపుతూ, తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేలా విశేషణ రూపంలో ఇచ్చాం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు క్రీస్తు
  rationale: తెలుగులో విస్తృతంగా తెలిసిన గౌరవప్రదమైన రూపాన్ని వాడాం; Χριστός యొక్క ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: μετὰ
  choice: తో ఉండుగాక
  rationale: గ్రీకులో క్రియ లేకపోయినా ఆశీర్వచన భావం ఉంది; తెలుగులో దానిని సహజంగా వ్యక్తం చేయడానికి ‘ఉండుగాక’ను పూరించాం.
- source_word: πνεύματος
  choice: ఆత్మ
  rationale: స్వీకర్తల అంతరంగాన్ని సూచించే సాధారణ అర్థాన్ని నిలిపాం; పరిశుద్ధాత్మ అని ప్రత్యేకంగా నిర్ధారించే పదాన్ని చేర్చలేదు.
- source_word: ὑμῶν
  choice: మీ
  rationale: ఇది గ్రీకులో బహువచనం. సహజమైన తెలుగు సర్వనామమైన ‘మీ’ని ప్రధాన పాఠ్యంలో ఉంచి, దాని బహువచన భావాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: Χριστοῦ అనే పదాన్ని ముగింపు ఆశీర్వచనంలో ఎలా ఇవ్వాలి
  choice: క్రీస్తు
  alternative: మెస్సీయ / అభిషిక్తుడు
  rationale: ‘క్రీస్తు’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజంగా గుర్తించబడే రూపం; అది కేవలం ఇంటిపేరు కాదనీ, ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదనీ పాదసూచిక తెలియజేస్తుంది.
- issue: ‘మీ ఆత్మ’లో ఆత్మకు సూచన
  choice: స్వీకర్తల ఆత్మ లేదా అంతరంగం
  alternative: పరిశుద్ధాత్మ
  rationale: ‘మీ’ అనే స్వామ్యసూచక పదం స్వీకర్తల ఆత్మను సూచిస్తుంది. అయితే మూలపాఠం చెప్పినదానికంటే ఎక్కువగా అర్థాన్ని నిర్ధారించకుండా ‘ఆత్మ’ అనే పదాన్నే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆశీర్వచన శైలిని వాడాం. గ్రీకు వాక్యంలో క్రియ లేకపోవడాన్ని తెలుగులో ‘ఉండుగాక’తో సహజీకరించాం; ‘మీ’ యొక్క బహువచనత్వాన్ని పాదసూచికలో స్పష్టం చేశాం.
