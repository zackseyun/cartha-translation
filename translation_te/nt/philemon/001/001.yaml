id: PHM.1.1
reference: Philemon 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: te
  text: మెస్సీయ[b] యేసు ఖైదీ అయిన పౌలు, సహోదరుడైన తిమోతి—మాకు ప్రియమైన, మా సహచర కార్యకర్త అయిన ఫిలేమోనుకు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: గ్రీకు పదం Χριστός; ఇక్కడ అది బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది. ‘క్రీస్తు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσμιος
  choice: ఖైదీ
  rationale: బంధించబడి కారాగారంలో ఉన్న వ్యక్తిని సూచించే ఈ నామవాచకానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం ‘ఖైదీ’.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός యేసుకు బిరుదుగా పనిచేస్తోంది; అందువల్ల దాని అభిషిక్త రాజు అనే భావాన్ని నిలుపుతూ ‘మెస్సీయ’ అని అనువదించబడింది.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: వ్యక్తినామానికి తెలుగులో స్థిరపడిన ప్రామాణిక రూపం.
- source_word: ὁ ἀδελφὸς
  choice: సహోదరుడైన
  rationale: విశ్వాస సమాజంలోని కుటుంబసంబంధాన్ని తెలియజేస్తుంది. గ్రీకులోని నిర్దేశక ఉపపదాన్ని తెలుగులో ప్రత్యేకంగా చూపకుండా విశేషణబంధంగా చెప్పడం సహజం; మూలంలో లేని ‘మన’ లేదా ‘మా’ను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ἀγαπητῷ
  choice: ప్రియుడూ
  rationale: ఆప్యాయతను గౌరవప్రదంగా, సహజంగా వ్యక్తం చేస్తుంది. ‘ప్రియమైనవాడు’ కంటే సంబోధన నిర్మాణంలో ‘ప్రియుడు’ సంక్షిప్తంగా ఉంటుంది.
- source_word: συνεργῷ
  choice: సహపనివాడూ
  rationale: కలిసి పనిచేసే వ్యక్తి అనే సమాసార్థాన్ని నిలుపుతుంది; పరిచర్యకు మాత్రమే పరిమితం చేయని సాధారణ పదం.
- source_word: ἡμῶν
  choice: మా
  rationale: బహువచన సర్వనామాన్ని నిలుపుతూ, దాని స్థానానికి అనుగుణంగా ‘సహపనివాడు’తో స్పష్టంగా అనుసంధానించబడింది.
- source_word: Φιλήμονι
  choice: ఫిలేమోనుకు
  rationale: లేఖా అభివాదంలోని దత్తివిభక్తిని తెలుగులో ‘-కు’తో సహజంగా వ్యక్తం చేసింది.
- source_word: καὶ Τιμόθεος
  choice: సహోదరుడైన తిమోతి
  rationale: తిమోతిని పౌలుతో కూడిన సహపంపినవాడిగా ఉంచుతుంది; తెలుగులో సంబంధవాచకాన్ని పేరుకు ముందు పెట్టడం సహజం.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ పరిచయ వాక్యంలో పదం కేవలం పేరులో భాగంగా కాక యేసు బిరుదుగానూ అర్థవంతంగా ఉంది. అందువల్ల మూలంలోని ‘అభిషిక్తుడు’ అనే బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
- issue: Χριστοῦ Ἰησοῦ అనే సంబంధవిభక్తి భావం
  choice: ‘మెస్సీయ యేసు ఖైదీ’ అనే సంక్షిప్త సంబంధాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘మెస్సీయ యేసు నిమిత్తం ఖైదీ’ లేదా ‘మెస్సీయ యేసుకు చెందిన ఖైదీ’
  rationale: గ్రీకు సంబంధవిభక్తి యేసుతో పౌలుకు ఉన్న సంబంధాన్నిగానీ, యేసు నిమిత్తం అతడు ఖైదీ అయ్యాడనే కారణాన్నిగానీ సూచించగలదు. ప్రధాన పాఠ్యంలో ఒక్క భావానికే పరిమితం చేయకుండా, పాదసూచికలో రెండింటినీ తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన లేఖా ఆరంభ శైలిని వాడింది. మూలంలోని అసంపూర్ణ అభివాద వాక్య నిర్మాణాన్ని తదుపరి వచనంతో కలిసేలా చివర కామాతో నిలిపింది. ‘ప్రియుడు’కు మూలంలో ప్రత్యేకంగా ‘మా’ లేకపోవడం వల్ల, ἡμῶνను సమీపంలోని ‘సహపనివాడు’తో మాత్రమే అనుసంధానించింది.
