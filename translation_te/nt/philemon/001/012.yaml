  text: ὃν ἀνέπεμψά ⸂σοι αὐτόν, τοῦτ’ ἔστιν τὰ ἐμὰ σπλάγχνα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/012.yaml
  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: te
  text: అతనిని నీ దగ్గరకు తిరిగి పంపుతున్నాను[a]—అంటే, నా హృదయమే అయిన అతనిని.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత రూపనిష్ఠంగా, “అతనిని నీ దగ్గరకు తిరిగి పంపాను.” గ్రీకు భూతకాల రూపాన్ని వివిధ విధాలుగా అనువదించవచ్చు; ఉత్తరం ఫిలేమోనుకు చేరే దృక్కోణాన్ని “పంపుతున్నాను” ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నా అంతరావయవాలు”; ఇది లోతైన అనురాగాన్ని లేదా సున్నితమైన మమకారాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: అతనిని
  rationale: ఈ సంబంధసర్వనామం ముందు ప్రస్తావించిన ఒనేసిమును సూచిస్తుంది; తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం వ్యక్తిసర్వనామంగా అనువదించబడింది.
- source_word: ἀνέπεμψά
  choice: తిరిగి పంపుతున్నాను
  rationale: ἀναπέμπω అంటే ‘తిరిగి పంపు.’ ఉత్తరం ఫిలేమోనుకు చేరే దృక్కోణాన్ని అనుసరించి గ్రీకు భూతకాల క్రియను తెలుగులో వర్తమాన కొనసాగింపు రూపంతో సహజంగా వ్యక్తం చేశాం.
- source_word: σοι
  choice: నీ దగ్గరికి
  rationale: ద్వితీయ పురుష ఏకవచన దత్తి విభక్తి పంపబడే వ్యక్తిని సూచిస్తుంది; సందర్భానికి సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: αὐτόν
  choice: అతనినే
  rationale: గ్రీకులో పునరుక్తమైన సర్వనామం ఒనేసిముపై ఉద్ఘాటన ఇస్తుంది; ‘అతనినే’ ఆ బలాన్ని తెలుగులో నిలుపుతుంది.
- source_word: τοῦτ’ ἔστιν
  choice: అంటే
  rationale: వివరణాత్మక అన్వయాన్ని పరిచయం చేసే సూత్రప్రయోగం; ‘అంటే’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: నా ప్రాణంతో సమానమైన
  rationale: σπλάγχνα అక్షరార్థంగా అంతరావయవాలు అయినా, ఇక్కడ అత్యంత లోతైన అనురాగానికి రూపకం. తెలుగులో ‘నా ప్రాణంతో సమానమైన’ అనేది ఒనేసిముపట్ల పౌలు కలిగిన గాఢమైన మమకారాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: σπλάγχνα లోని మానవశరీర రూపకం
  choice: నా ప్రాణంతో సమానమైన
  alternative: నా హృదయమే అయిన; నా అంతరంగ అనురాగమైన
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాక, భాషాపరమైన రూపక అనువాదం. అక్షరార్థమైన ‘నా అంతరావయవాలు’ ఆధునిక తెలుగు పాఠకునికి ఉద్దేశిత భావాన్ని మరుగుపరుస్తుంది; ఎంపిక చేసిన రూపం పౌలు యొక్క గాఢమైన వ్యక్తిగత అనురాగాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని αὐτόν ఉద్ఘాటనను ‘అతనినే’తో నిలిపి, σπλάγχνα రూపకాన్ని సాధారణ పాఠకునికి స్పష్టమైన భావసమానతతో అందించాం.
