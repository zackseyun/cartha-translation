source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: te
  text: అదే సమయంలో, నాకు బస చేయడానికి ఒక చోటును[a] కూడా సిద్ధం చేయి. ఎందుకంటే మీ ప్రార్థనల ద్వారా నేను మీకు అనుగ్రహించబడతానని[b] ఆశిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వసతిని” లేదా “ఆతిథ్యాన్ని”; గ్రీకు పదం అతిథికి కల్పించే బస స్థలాన్నిగానీ, ఆతిథ్యం అందించే కార్యాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేను మీకు ఇవ్వబడతానని”; గ్రీకు క్రియ ఉచితంగా లేదా కృపతో ఇవ్వబడే భావాన్ని కలిగి ఉంది; ఇక్కడ ఇచ్చేవాడు దేవుడనే సూచన ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: అదే సమయంలో ... కూడా
  rationale: మునుపటి విజ్ఞప్తికి తోడుగా మరో అభ్యర్థనను పరిచయం చేసే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἑτοίμαζέ
  choice: సిద్ధం చేయి
  rationale: వర్తమాన క్రియారూపంలోని ప్రత్యక్ష ఆజ్ఞను సరళంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: μοι
  choice: నా కోసం
  rationale: దత్తివిభక్తిలోని లబ్ధిదారుని భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ξενίαν
  choice: ఒక అతిథి గదిని
  rationale: ἑτοίμαζέ అనే క్రియతో కలిసి ఇక్కడ బస చేసే స్థలం అనే నిర్దిష్ట భావం అత్యంత సహజం; అయితే ఆతిథ్యం లేదా వసతి అనే విస్తృత అర్థాలను పాదసూచికలో ఉంచాం.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: ఎందుకంటే ... ఆశిస్తున్నాను
  rationale: γάρ ఇచ్చే కారణసంబంధాన్ని, ὅτι పరిచయం చేసే ఆశ యొక్క విషయాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: మీ ప్రార్థనల ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనార్థక భావాన్ని నేరుగా కాపాడుతుంది.
- source_word: χαρισθήσομαι
  choice: అనుగ్రహించబడతాను
  rationale: భవిష్యత్ కర్మణి రూపాన్నీ, χαρίζομαιలోని కృపతో లేదా ఉచితంగా ఇవ్వబడే భావాన్నీ నిలుపుతుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: పౌలు తిరిగి గ్రహీతలకు ఇవ్వబడతాడనే దత్తివిభక్తి భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: χαρισθήσομαιలో పౌలు విడుదలై తిరిగి రావడం మరియు దైవిక కార్యసాధకత్వం
  choice: నేను మీకు అనుగ్రహించబడతాను
  alternative: నేను మీ వద్దకు విడుదల చేయబడతాను / నేను మీకు ఇవ్వబడతాను
  rationale: గ్రీకు పాఠం విడుదలను ప్రత్యక్షంగా చెప్పదు. కర్మణి రూపం దేవుని కార్యసాధకత్వాన్ని సూచించే అవకాశం ఉన్నా దానిని మూలపాఠం కంటే స్పష్టంగా చేయకుండా, కృపాపూర్వకంగా ఇవ్వబడే భావాన్ని నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఏకవచన సంబోధన వాడబడింది. మొదటి వాక్యంలోని ఏకవచన ఆజ్ఞ ఫిలేమోనును ఉద్దేశిస్తుంది; తరువాతి బహువచన ‘మీ’ మూలంలోని ὑμῶν/ὑμῖνను అనుసరించి విస్తృత గ్రహీతల సమూహాన్ని సూచించే అవకాశాన్ని నిలుపుతుంది.
