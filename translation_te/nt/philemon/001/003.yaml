id: PHM.1.3
reference: Philemon 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: te
  text: మన తండ్రియైన దేవుని నుండి, ప్రభువైన యేసు మెస్సీయ[a] నుండి మీకు కృప, శాంతి కలుగుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘యేసు క్రీస్తు.’ గ్రీకు Χριστός (క్రిస్టోస్) అనే పదం ‘మెస్సీయ’ అనే బిరుదుగానూ, కొన్ని సందర్భాల్లో ‘క్రీస్తు’ అనే పేరులో భాగంలాగానూ వాడబడుతుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు శుభవందనాల్లో ఈ పదానికి సాధారణ పలకరింపును మించిన దైవానుగ్రహ భావం ఉంది; ‘కృప’ ఆ భావాన్ని సహజంగా, స్థిరంగా వ్యక్తం చేస్తుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: ఈ దత్తివిభక్తి శుభాశీస్సు ఎవరికి ఉద్దేశించబడిందో తెలుపుతుంది; తెలుగులో ‘మీకు’ సహజమైన రూపం.
- source_word: εἰρήνη
  choice: సమాధానం
  rationale: గ్రీకు పదంలోని శాంతి, క్షేమం అనే విస్తృత భావాన్ని తెలుగు బైబిలు శైలిలో ‘సమాధానం’ నిలుపుతుంది.
- source_word: ἀπὸ
  choice: నుండీ
  rationale: కృప, సమాధానం వచ్చే మూలాన్ని సూచించే పూర్వప్రత్యయ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: మన తండ్రియైన దేవుడు
  rationale: πατρός అనేది θεοῦను వివరిస్తున్న సమానాధికరణ సంబంధాన్ని ‘తండ్రియైన దేవుడు’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςలోని గౌరవార్థక, క్రీస్తుసంబంధ బలాన్ని ‘ప్రభువు’ నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Ἰησοῦను పేరుగా లిప్యంతరీకరించి, Χριστοῦలోని అభిషిక్తుడనే బిరుదు భావాన్ని ‘మెస్సీయ’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστοῦను ఎలా అనువదించాలి
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: Χριστός బిరుదుగానూ, స్థిరమైన పేరులో భాగంలాగానూ పనిచేయగలదు. ప్రధాన పాఠంలో దాని బిరుదు భావాన్ని ‘మెస్సీయ’గా చూపించి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చాం; గ్రీకులోని నిజమైన భావసాధ్యతను అలా నిలిపాం.
- issue: గ్రీకులో స్పష్టమైన క్రియ లేకపోవడం
  choice: కలుగుగాక
  alternative: ఉన్నవి
  rationale: ఇది పౌలు పత్రికా శుభాశీస్సు సూత్రం. తెలుగులో పూర్తి, సహజమైన ఆశీర్వాద వాక్యంగా ఉండేందుకు సూచితమైన ఆశాభావాన్ని ‘కలుగుగాక’తో వ్యక్తం చేశాం; కొత్త సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా-ఆశీర్వాద శైలి వాడబడింది. ‘నుండీ’ అనే సహజ ఆధునిక రూపాన్ని రెండుసార్లు ఉంచి, తండ్రియైన దేవుడూ ప్రభువైన యేసు మెస్సీయయే కృపకు, సమాధానానికి మూలమని గ్రీకు నిర్మాణం సూచించే సమాంతరతను నిలిపాం.
