id: PHM.1.21
reference: Philemon 1:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ⸀ἃ λέγω ποιήσεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: te
  text: నీ విధేయతను నమ్మి, నీవు నేను చెప్పేదానికంటే కూడా ఎక్కువగా[a] చేస్తావని తెలిసి, నీకు రాశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను చెబుతున్నదాన్ని మించి.’ ఫిలేమోను పౌలు చేసిన నిర్దిష్ట విజ్ఞప్తికంటే ఎక్కువ చేస్తాడని పౌలు సూచిస్తుండవచ్చు; అయితే అది ఏమిటో ఈ వచనం స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: నమ్మకంతో
  rationale: పరిపూర్ణ కృదంతం స్థిరపడిన నమ్మకస్థితిని సూచిస్తుంది. ‘నమ్మకంతో’ సహజమైన తెలుగులో ఆ భావాన్నీ, వాక్యంలోని కారణసంబంధాన్నీ నిలుపుతుంది.
- source_word: τῇ ὑπακοῇ σου
  choice: నీ విధేయతపై
  rationale: ὑπακοήలో విధేయత, చెప్పినదానికి స్పందించి ఆచరించడం అనే నైతిక-సంబంధ భావం ఉంది. ‘విధేయత’ దానిని కేవలం మర్యాదపూర్వక సమ్మతిగా బలహీనపరచదు.
- source_word: ἔγραψά σοι
  choice: నీకు రాశాను
  rationale: అయోరిస్ట్ క్రియను సందర్భానుకూలమైన సహజ తెలుగు భూతకాలంలో అనువదించాం.
- source_word: εἰδὼς
  choice: నాకు తెలుసు
  rationale: పౌలు తనకు ఉన్న నిశ్చితమైన అవగాహన ఆధారంగా రాస్తున్నాడనే భావాన్ని సహజ తెలుగు ప్రధాన వాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: నేను చెప్పేదానికంటే కూడా ఎక్కువగా
  rationale: ὑπέρ + ద్వితీయా విభక్తి ‘చెప్పినదాన్ని మించి/దానికంటే ఎక్కువగా’ అనే భావాన్ని ఇస్తుంది. ‘కూడా’ καί యొక్క బలాన్ని తెలియజేస్తుంది; అదనంగా ఏమి చేస్తాడో మాత్రం నిర్దిష్టం చేయదు.
- source_word: ποιήσεις
  choice: నీవు చేస్తావు
  rationale: ποιέω యొక్క విశాలమైన, ఉద్దేశపూర్వకంగా నిర్దిష్టం కాని భావాన్ని ‘చేస్తావు’ అలాగే ఉంచుతుంది.
theological_decisions:
- issue: పౌలు విజ్ఞప్తిలో ὑπακοή యొక్క బలం
  choice: ‘విధేయత’ అని అనువదించాం.
  alternative: ‘సమ్మతి’ లేదా ‘స్పందించడానికి సిద్ధత’
  rationale: మూలపదం విధేయతను స్పష్టంగా సూచిస్తుంది. ఈ ఎంపిక పత్రికలోని అపొస్తల అధికార సంబంధాన్ని నిలుపుతుంది; అయితే వచనంలో లేని బలవంతాన్ని చేర్చదు.
- issue: ‘నేను చెప్పేదానికంటే కూడా ఎక్కువగా’ అనే మాటలోని సూచన
  choice: పౌలు ఆశించే అదనపు కార్యం ఏమిటో చెప్పకుండా తెరిచి ఉంచాం.
  alternative: ఒనేసిమును విడుదల చేయమనే సూచనగా లేదా అతనిని ఉదారంగా స్వీకరించడమేనని నిర్దిష్టపరచడం
  rationale: గ్రీకు వాక్యం సూచనాత్మకంగా ఉన్నా, అదనపు కార్యాన్ని స్పష్టంగా పేర్కొనదు. అందువల్ల దాని ఉద్దేశపూర్వక అస్పష్టతను, వ్యాఖ్యానపరమైన ఉద్రిక్తతను అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఏకవచన సంభాషణశైలిని వాడాం. గ్రీకు కృదంత నిర్మాణాలను యథాతథంగా బిగుసుకుపోయిన తెలుగులో ఉంచకుండా, వాటి తార్కిక సంబంధాన్ని సెమికోలన్‌తో సహజంగా వ్యక్తం చేశాం.
