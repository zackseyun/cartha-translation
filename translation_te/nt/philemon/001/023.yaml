  revision_rationale: The revision corrects the greeting idiom while retaining the source's singular addressee, Epaphras's designation as Paul's fellow prisoner, and the ambiguity of the imprisonment. It also supplies an anchored lexical alternative for Christ/Messiah consistent with the audit trail.
