id: PHM.1.23
reference: Philemon 1:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: te
  text: క్రీస్తు యేసులో నాతోటి ఖైదీ అయిన ఎపఫ్రా నీకు అభివాదాలు తెలియజేస్తున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయ యేసులో.”
    reason: Χριστῷ యొక్క బిరుదు-అర్థాన్ని స్పష్టంగా చూపించే లెక్సికల్ ప్రత్యామ్నాయం; ప్రధాన పాఠంలో ఉన్న స్థిరమైన తెలుగు వాడుకను మార్చకుండా ఇంగ్లీషు POB పరిశీలన-గమనికను ప్రతిబింబిస్తుంది.
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: శుభాకాంక్షలు తెలుపుతున్నాడు
  rationale: ఇక్కడ ἀσπάζομαι అంటే ఒకరికి అభివందనాలు లేదా శుభాకాంక్షలు తెలియజేయడం. ఆధునిక తెలుగు పత్రికా సందర్భంలో ఈ ప్రయోగం సహజంగా ఉంటుంది.
- source_word: σε
  choice: నీకు
  rationale: ఇది ద్వితీయ పురుష ఏకవచన సర్వనామం; ఫిలేమోనును నేరుగా ఉద్దేశిస్తుంది. తెలుగు రూపం ఏకవచనాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: Ἐπαφρᾶς
  choice: ఎపఫ్రా
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ὁ συναιχμάλωτός μου
  choice: నా తోటి ఖైదీ అయిన
  rationale: συναιχμάλωτος అనే సమాసపదం తనతో పాటు బందీగా లేదా ఖైదీగా ఉన్న వ్యక్తిని సూచిస్తుంది. 'తోటి ఖైదీ' సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: క్రీస్తు యేసులో
  rationale: ἐν ను 'లో'గా నిలిపి, పౌలు వాడే క్రీస్తుతో ఐక్యతను సూచించే భాషను కాపాడాం. Χριστόςకు తెలుగులో విస్తృతంగా స్థిరపడిన బిరుదు రూపం 'క్రీస్తు'; Ἰησοῦను 'యేసు'గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ అనే పౌలు ప్రయోగంలో Χριστῷ అనువాదం
  choice: క్రీస్తు యేసులో
  alternative: మెస్సీయ యేసులో
  rationale: Χριστός మూలంగా 'అభిషిక్తుడు/మెస్సీయ' అనే బిరుదే అయినప్పటికీ, ఈ స్థిరమైన పౌలు ప్రయోగంలో తెలుగులో 'క్రీస్తు యేసు' సహజంగా, గౌరవప్రదంగా, విస్తృతంగా అర్థమయ్యే రూపం. 'లో'ను అలాగే ఉంచడం ద్వారా ఐక్యత భావాన్ని 'కోసం' లేదా 'నిమిత్తం'గా పరిష్కరించకుండా కాపాడాం.
- issue: συναιχμάλωτος అక్షరార్థమా లేక రూపకాలంకారమా
  choice: తోటి ఖైదీ
  alternative: తోటి బందీ
  rationale: పదం నిజమైన నిర్బంధాన్ని లేదా రూపకాలంకారమైన సహబంధితత్వాన్ని సూచించగలదనే వివరాన్ని వాక్యంలో అదనంగా నిర్ణయించలేదు; మూలంలోని ఉద్వేగాన్ని నిలిపే సాధారణ పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన పత్రికా అభివాద శైలి. ఫిలేమోనును ఉద్దేశించిన ఏకవచనాన్ని 'నీకు' ద్వారా స్పష్టంగా ఉంచాం.
