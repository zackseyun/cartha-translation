revisions:
- from: క్రీస్తు యేసులో నా తోటి ఖైదీ అయిన ఎపఫ్రా నీకు శుభాకాంక్షలు తెలుపుతున్నాడు.
  to: క్రీస్తు యేసులో నాతోటి ఖైదీ అయిన ఎపఫ్రా నీకు అభివాదాలు తెలియజేస్తున్నాడు.[a]
  rationale: The revision corrects the greeting idiom while retaining the source's singular addressee, Epaphras's designation as Paul's fellow prisoner, and the ambiguity of the imprisonment. It also supplies an anchored lexical alternative for Christ/Messiah consistent with the audit trail.
