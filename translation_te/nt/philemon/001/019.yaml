id: PHM.1.19
reference: Philemon 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: te
  text: 'నేను పౌలు, నా స్వహస్తంతో రాశాను: నేనే తిరిగి చెల్లిస్తాను. నీవు నీ అంతట నీవే నాకు రుణపడి ఉన్నావని నీతో చెప్పనవసరం లేదు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: రాస్తున్నాను
  rationale: రూపరీత్యా ఇది భూతకాల రూపమైనప్పటికీ, పత్రాన్ని చదివే సమయంలో పౌలు స్వహస్తంతో రాసిన హామీని చూపిస్తున్న సందర్భంలో తెలుగు పత్రశైలికి సహజమైన వర్తమాన రూపం భావాన్ని స్పష్టంగా అందిస్తుంది. రూపసామ్యమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: τῇ ἐμῇ χειρί
  choice: నా సొంత చేతితో
  rationale: పౌలు స్వయంగా రాస్తున్నాడనే ఉద్ఘాటనను, అలాగే అతని వ్యక్తిగత హామీని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀποτίσω
  choice: నేనే తిరిగి చెల్లిస్తాను
  rationale: మునుపటి వచనంలో చెప్పిన నష్టం లేదా అప్పును తాను తీర్చుతాననే భవిష్యత్ హామీని తెలియజేస్తుంది. కర్తపై ఉన్న ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది.
- source_word: ἵνα μὴ λέγω σοι
  choice: నీతో చెప్పనవసరం లేదు
  rationale: ఇక్కడ ఇది కఠినమైన ఉద్దేశార్థం కంటే మర్యాదపూర్వకమైన అలంకారోక్తిగా పనిచేస్తుంది; చెప్పనవసరం లేదంటూనే విషయాన్ని సూచించే పౌలు ధోరణిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ σεαυτόν
  choice: నీ అంతట నిన్నే
  rationale: καί ఇచ్చే ఉద్ఘాటనతో కూడిన ఆత్మవాచక సర్వనామాన్ని నిలుపుతూ, కేవలం ధనమే కాక ఫిలేమోను తననుతానే పౌలుకు రుణపడి ఉన్నాడనే బలమైన వ్యక్తిగత భావాన్ని తెలియజేస్తుంది.
- source_word: προσοφείλεις
  choice: రుణపడి ఉన్నావు
  rationale: అదనంగా లేదా మరింతగా బాకీ ఉండటాన్ని సూచించే క్రియ. సందర్భంలోని ‘నీ అంతట నిన్నే’ అనే ఉద్ఘాటన దాని అదనపు భావాన్ని మోస్తుండగా, ఈ పదబంధం తెలుగులో స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: ‘నీ అంతట నిన్నే నాకు రుణపడి ఉన్నావు’ అనే మాటలో ఫిలేమోను పౌలుకు గల రుణ స్వభావం
  choice: వ్యక్తిగతమైన రూపకాలంకార రుణాన్ని అలాగే ఉంచి, దాని ఖచ్చితమైన ఆధారాన్ని పేర్కొనలేదు.
  alternative: ఫిలేమోను తన మారుమనస్సు, రక్షణ, లేదా భౌతిక ప్రాణం విషయంలో పౌలుకు రుణపడి ఉన్నాడని స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం రుణాన్ని బలంగా చెబుతుంది గాని, అది ఏ కారణంగా ఏర్పడిందో నిర్వచించదు. అందువల్ల అనువాదం మారుమనస్సు, రక్షణ లేదా ప్రాణరుణం వంటి నిర్దిష్ట వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. ‘నా సొంత చేతితో’, ‘నేనే’ అనే రూపాలు పౌలు వ్యక్తిగతంగా ఇచ్చే హామీపై ఉన్న ఉద్ఘాటనను కాపాడుతాయి. వ్యక్తిగత రుణం యొక్క అసలు స్వభావాన్ని అనువాదం ఉద్దేశపూర్వకంగా అనిర్దిష్టంగా ఉంచుతుంది.
