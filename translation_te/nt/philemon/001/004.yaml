- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: క్రమమైన నిరంతరత్వాన్ని సూటిగా తెలియజేస్తుంది; ఈ పదం ప్రధాన క్రియతో సంబంధించేదిగా వాక్యక్రమం సూచిస్తుంది.
- source_word: μνείαν σου ποιούμενος
  choice: నిన్ను ప్రస్తావిస్తూ
  rationale: ‘నీ గురించి ప్రస్తావన చేస్తూ’ అనే గ్రీకు నుడికారంలోని వాచిక ప్రస్తావన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: నా ప్రార్థనల్లో
  rationale: ప్రార్థన చేసే సందర్భంలో అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
