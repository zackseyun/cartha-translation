  text: Μᾶρκος, Ἀρίσταρχος, Δημᾶς, Λουκᾶς, οἱ συνεργοί μου.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/024.yaml
  text: Mark, Aristarchus, Demas, and Luke, my fellow workers.
translation:
  language: te
  text: నా తోటి పనివారైన మార్కు, అరిస్తార్కు, దేమా, లూకా కూడా నీకు వందనాలు చెబుతున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μᾶρκος
  choice: మార్కు
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న సహజ లిప్యంతరీకరణ.
- source_word: Ἀρίσταρχος
  choice: అరిస్తార్కు
  rationale: గ్రీకు వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: Δημᾶς
  choice: దేమా
  rationale: గ్రీకు వ్యక్తినామాన్ని దాని దీర్ఘ స్వరాన్ని ప్రతిబింబించేలా తెలుగులో లిప్యంతరీకరించింది.
- source_word: Λουκᾶς
  choice: లూకా
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: οἱ συνεργοί μου
  choice: నా తోటి పనివారు
  rationale: συνεργοί కలిసి పనిచేసే సహచరులను సూచిస్తుంది. ‘తోటి పనివారు’ సహకార భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; μου అనుబంధాన్ని ‘నా’గా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: మూలంలో ఇది ముందరి వాక్యంలోని వందన క్రియపై ఆధారపడిన నామాల జాబితా. తెలుగు పాఠకుడికి స్వతంత్ర వచనంగా సహజంగా అర్థమయ్యేందుకు ఆ అంతర్భావిత క్రియను ‘కూడా నీకు వందనాలు చెబుతున్నారు’ అని స్పష్టం చేశాం. భాష ఆధునికం, గౌరవప్రదం, సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచాం.
