id: PHM.1.8
reference: Philemon 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διό, πολλὴν ἐν Χριστῷ παρρησίαν ἔχων ἐπιτάσσειν σοι τὸ ἀνῆκον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/008.yaml
  text: Therefore[a], though I have much boldness in Messiah to command you to do what is proper[b],
translation:
  language: te
  text: అందుచేత, మెస్సీయలో సముచితమైనది చేయమని నీకు ఆజ్ఞాపించేంత ధైర్యం నాకు ఉన్నప్పటికీ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: అందుచేత
  rationale: ముందటి మాటల ఆధారంగా తీసుకునే ముగింపును సూచించే అనుసంధానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πολλὴν ... παρρησίαν
  choice: ఎంతో ధైర్యం
  rationale: πολλήν అనే తీవ్రతను, παρρησίαలోని ధైర్యంగా లేదా సంకోచం లేకుండా మాట్లాడగల భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది. ‘లో’ అనే రూపం పౌలు వాడే సంబంధాత్మక పరిధిని సాధ్యమైనంతవరకు తెరిచి ఉంచుతుంది.
- source_word: ἔχων
  choice: ఉన్నప్పటికీ
  rationale: తదుపరి వచనంలో వచ్చే విజ్ఞప్తితో ఉన్న వ్యత్యాసాన్ని బట్టి ఈ కృదంతానికి రాయితీ భావం ఉంది; తెలుగు వాక్య నిర్మాణంలో దానిని సహజంగా స్పష్టం చేస్తుంది.
- source_word: ἐπιτάσσειν σοι
  choice: నీకు ... చేయమని ఆజ్ఞాపించడానికి
  rationale: ἐπιτάσσωలోని అధికారపూర్వక ఆదేశ భావాన్ని నిలుపుతూ, σοι అనే సంబోధితుని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ ἀνῆκον
  choice: తగినదాన్ని చేయమని
  rationale: ἀνήκω యొక్క ‘తగినది, సముచితమైనది’ అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది; సందర్భంలో అవసరమైన కార్యభావాన్ని ‘చేయమని’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: Χριστῷ అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ పదం కేవలం పేరుగా కాక బిరుదుగా ఉంది. ‘మెస్సీయ’ దాని బిరుదు భావాన్ని సాధారణ తెలుగు బైబిలు పాఠకులకు గుర్తించదగిన విధంగా నిలుపుతుంది; ప్రత్యామ్నాయ సాంప్రదాయ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ἐν అనే సంబంధం
  choice: లో
  alternative: ద్వారా
  rationale: ఇది సంబంధపు పరిధి, ఆధారం లేదా సాధన భావాలను కలిగి ఉండవచ్చు. ‘లో’ గ్రీకు పదబంధంలోని విస్తృతతను కాపాడి, ఒక్క అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. వాక్యం 9వ వచనంలో పూర్తయ్యే వ్యత్యాసాన్ని ప్రతిబింబించేందుకు చివర కామా ఉంచబడింది.
