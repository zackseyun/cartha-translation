- from: 'అందుచేత, నేను వస్తే, అతడు చేస్తున్న పనులను అందరి దృష్టికి తీసుకొస్తాను: అతడు దుష్టమైన మాటలతో మా మీద అర్థంలేని నిందలు వేస్తున్నాడు. అంతటితో తృప్తిపడక, అతడు స్వయంగా సహోదరులను స్వాగతించడు[a]; వారిని స్వాగతించాలనుకునేవారిని అడ్డుకొని, సంఘం నుండి వెళ్లగొడుతున్నాడు[b].'
