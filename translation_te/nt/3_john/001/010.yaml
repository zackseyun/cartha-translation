id: 3JN.1.10
reference: 3 John 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: te
  text: అందుచేత, నేను వస్తే, అతడు చేస్తున్న పనులను గుర్తుచేస్తాను—అతడు దుష్టమైన మాటలతో మాపై అర్థంలేని మాటలు మాట్లాడుతూ ఉన్నాడు. అంతటితో తృప్తిపడక, అతడు స్వయంగా సహోదరులను స్వీకరించడు[a]; వారిని స్వీకరించాలనుకునేవారిని అడ్డుకొని, సంఘం నుండి బయటకు తోసివేస్తున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహోదరులను స్వాగతించడు.” ఇక్కడి గ్రీకు క్రియకు వారిని స్వీకరించి ఆతిథ్యం ఇవ్వడం అనే భావం ఉంది. “సహోదరులు” అనేది బహుశా ప్రయాణిస్తూ సేవచేసే క్రైస్తవ సహోదరులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సంఘం నుండి బహిష్కరిస్తున్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుచేత
  rationale: ముందటి విషయంతో ఉన్న కారణ-పర్యవసాన సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐὰν ἔλθω
  choice: నేను వస్తే
  rationale: షరతుతో కూడిన భావాన్ని, పత్రికా దృక్కోణాన్ని నేరుగా నిలుపుతుంది.
- source_word: ὑπομνήσω
  choice: అందరి దృష్టికి తీసుకొస్తాను
  rationale: కేవలం జ్ఞాపకం చేయడం కాక, దియొత్రెఫే క్రియలను బహిరంగంగా గుర్తుచేసి జవాబుదారీతనానికి తేవడం అనే సందర్భార్థాన్ని వ్యక్తపరుస్తుంది.
- source_word: αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: అతడు చేస్తున్న పనులను
  rationale: బహువచన రూపాన్నీ, కొనసాగుతున్న ప్రవర్తనను సూచించే వర్తమాన భావాన్నీ నిలుపుతుంది.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: అతడు దుష్టమైన మాటలతో మా మీద అర్థంలేని నిందలు వేస్తున్నాడు
  rationale: φλυαρέω లోని వ్యర్థమైన లేదా అర్థంలేని మాటల భావంతో పాటు, సందర్భంలోని విరోధపూర్వక అపవాద భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: అంతటితో తృప్తిపడక
  rationale: అతని దుష్ప్రవర్తన నిందలతో ఆగలేదనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: అతడు స్వయంగా సహోదరులను స్వాగతించడు
  rationale: ἐπιδέχομαι లోని ఆహ్వానించి ఆదరించడం, ముఖ్యంగా ఆతిథ్యం ఇవ్వడం అనే భావాన్ని 'స్వాగతించడు' స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοὺς βουλομένους κωλύει
  choice: వారిని స్వాగతించాలనుకునేవారిని అడ్డుకొని
  rationale: ముందటి క్రియలో అంతర్లీనంగా ఉన్న కర్మను తెలుగులో స్పష్టపరుస్తూ, βούλομαι యొక్క సంకల్ప భావాన్ని మరియు κωλύω యొక్క నిరోధ భావాన్ని నిలుపుతుంది.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: సంఘం నుండి వెళ్లగొడుతున్నాడు
  rationale: స్థానిక క్రైస్తవ సమాజం నుండి బలవంతంగా తొలగించే చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἀδελφούς అనే పురుష బహువచనాన్ని సంఘ ఆతిథ్య సందర్భంలో ఎలా అనువదించాలి
  choice: సహోదరులను
  alternative: తోటి విశ్వాసులను
  rationale: సందర్భం సంచార క్రైస్తవ సేవకులను సూచించే అవకాశమున్నందున మూలంలోని పురుష-సూచక కుటుంబపదాన్ని నిలిపాం; అయితే ఇది క్రైస్తవ సహవాస పదమని పాదటిప్పణిలో వివరించాం.
- issue: ἐκκλησία యొక్క సందర్భార్థం
  choice: సంఘం
  alternative: సభ
  rationale: ఇక్కడ భవనం కాక స్థానిక క్రైస్తవ సమాజం ఉద్దేశించబడింది; ఆధునిక ప్రామాణిక తెలుగులో 'సంఘం' ఆ భావాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే పత్రికకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని కొనసాగుతున్న చర్యలను వర్తమాన రూపాల్లో ఉంచి, ఆతిథ్య సందర్భాన్ని అవసరమైన చోట స్పష్టపరిచాం.
