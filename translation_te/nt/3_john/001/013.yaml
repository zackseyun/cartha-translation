  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: te
  text: నీకు రాయడానికి నా దగ్గర ఎన్నో విషయాలు ఉండేవి; అయితే, సిరాతో, కలంతో[a] నీకు రాయాలని నేను అనుకోవడం లేదు;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కలం’ అని అనువదించిన గ్రీకు పదానికి అక్షరార్థం ‘రెల్లు’; రాయడానికి ఉపయోగించే రెల్లు కలం ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ
  choice: ఎన్నో విషయాలు
  rationale: నపుంసక బహువచన విశేషణం నామవాచకంగా వాడబడింది; ‘ఎన్నో విషయాలు’ అనే రూపం బహువచన భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἶχον
  choice: నాకు ... ఉన్నాయి
  rationale: గ్రీకులో ఇది అసంపూర్ణ భూతకాల రూపమైనప్పటికీ, రాయడానికి తన వద్ద ఇంకా అనేక విషయాలు ఉన్నాయనే పత్రికా సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి వర్తమాన రూపం వాడబడింది; ‘ఉండేవి’ అంటే అవి ఇప్పుడు లేవనే అనవసర భావం కలగవచ్చు.
- source_word: γράψαι σοι
  choice: నీకు రాయడానికి
  rationale: ఆలోచించిన రచనా చర్యను తెలిపే aorist infinitiveతో పాటు పరోక్ష కర్మను సరళంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀλλ’ οὐ θέλω
  choice: అయితే ... నాకు ఇష్టం లేదు
  rationale: θέλω తెలిపే ఇష్టాన్ని లేదా సంకల్పాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; మరీ అధికారికమైన ‘నేను కోరుకోవడం లేదు’ కంటే పత్రికా శైలికి అనుకూలం.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: సిరాతో, కలంతో
  rationale: διά జనిటివ్ ఇక్కడ సాధనాన్ని సూచిస్తుంది. μέλαν అంటే సిరా; κάλαμος అక్షరార్థంగా రెల్లు అయినా, రాసే సాధనంగా సందర్భానుసారం ‘కలం’ సహజమైన సమానార్థకం.
- source_word: γράφειν
  choice: రాయడం
  rationale: వర్తమాన infinitive రచనా ప్రక్రియను సూచిస్తుంది; తెలుగు క్రియానామ రూపం దానిని సహజంగా తెలియజేస్తుంది.
