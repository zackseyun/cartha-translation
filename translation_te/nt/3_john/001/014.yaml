- from: అయితే, నిన్ను త్వరలో చూడాలని ఆశిస్తున్నాను. అప్పుడు మనం ముఖాముఖిగా[a] మాట్లాడుకుందాం.
  to: అయితే, నేను నిన్ను త్వరలో చూడాలని ఆశిస్తున్నాను. మనం ముఖాముఖిగా[a] మాట్లాడతాము.
