  yaml_path: translation/nt/3_john/001/014.yaml
  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: te
  text: అయితే, నేను నిన్ను త్వరలో చూడాలని ఆశిస్తున్నాను. మనం ముఖాముఖిగా[a] మాట్లాడతాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నోరు నోటికి.’ ఈ నుడికారం ప్రత్యక్షంగా ఎదురెదురుగా సంభాషించడాన్ని, అంటే ‘ముఖాముఖిగా’ మాట్లాడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: ఆశిస్తున్నాను
  rationale: వర్తమానకాల క్రియ రచయిత వ్యక్తిగత ఆశను లేదా నిరీక్షణను తెలియజేస్తుంది; పత్రిక ముగింపు సందర్భంలో ‘ఆశిస్తున్నాను’ సహజంగా ఉంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యంలో రాయడం గురించి చెప్పిన దానినుంచి స్వల్ప వ్యత్యాసంతో విషయాన్ని మళ్లిస్తుంది; ‘అయితే’ ఆ సంధిని సహజంగా నిలుపుతుంది.
- source_word: εὐθέως
  choice: త్వరలో
  rationale: సాధారణంగా ‘వెంటనే’ అనే అర్థం ఉండగలిగినా, ఇక్కడ రాబోయే కలయిక సందర్భంలో సమీప కాలాన్ని సూచిస్తుంది.
- source_word: σε ἰδεῖν
  choice: నిన్ను ... చూడాలని
  rationale: గ్రీకు నిర్మాణంలోని ‘నిన్ను చూడడం’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; ‘సందర్శించాలని’ అనడం కంటే తక్కువ వ్యాఖ్యాత్మకం.
- source_word: στόμα πρὸς στόμα
  choice: ముఖాముఖిగా
  rationale: అక్షరార్థం ‘నోరు నోటితో’; సందర్భంలో ప్రత్యక్షంగా ఎదురెదురుగా సంభాషించడాన్ని తెలిపే సహజ తెలుగు నుడికారం ‘ముఖాముఖిగా’.
- source_word: λαλήσομεν
  choice: మాట్లాడుకుందాం
  rationale: గ్రీకులో భవిష్యత్ సూచన ఉన్నప్పటికీ, తెలుగు సందర్భంలో ఉభయుల రాబోయే సంభాషణను ‘మాట్లాడుకుందాం’ సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పత్రికా ముగింపు శైలి. గ్రీకు నుడికారాన్ని ప్రధాన పాఠ్యంలో అర్థసహజంగా అనువదించి, దాని అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
