  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పత్రికా శైలిని వాడాం. ఏకవచన సంబోధనను ‘నీకు/చెప్పు’తో నిలిపి, φίλοι పదాన్ని రెండుసార్లూ ‘స్నేహితులు’గా అనువదించాం.
