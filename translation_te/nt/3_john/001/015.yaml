  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: te
  text: నీకు శాంతి కలుగుగాక.[a] స్నేహితులు నీకు వందనాలు చెబుతున్నారు. స్నేహితులకు పేరుపేరునా వందనాలు చెప్పు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు శాంతి.” గ్రీకులో పదశః ఇలా ఉంది; ఇది సంక్షిప్తమైన పత్రికా ఆశీర్వచనం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒక్కొక్కరికీ వ్యక్తిగతంగా.” గ్రీకులో పదశః “పేరు ప్రకారం” అని ఉంది; ప్రతి స్నేహితునికి వ్యక్తిగత వందనం చెప్పాలనే భావం ఇందులో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: నీకు శాంతి కలుగుగాక
  rationale: గ్రీకు మూలంలోని సంక్షిప్త పత్రికా ఆశీర్వచనాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది. ‘నీకు శాంతి’ మరింత పదశః రూపమైనా, తెలుగులో ‘కలుగుగాక’ అనే అంతర్లీన క్రియను స్పష్టం చేయడం సహజం.
- source_word: ἀσπάζονταί σε
  choice: నీకు వందనాలు చెబుతున్నారు
  rationale: పత్రికలలో శుభాభివందనాలు తెలియజేయడాన్ని సూచించే క్రియకు ఇది సహజమైన తెలుగు సమానం; వర్తమాన బహువచన భావాన్ని నిలుపుతుంది.
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: స్నేహితులు / స్నేహితులలో ప్రతి ఒక్కరికీ
  rationale: φίλοι అనే ప్రత్యేక పదాన్ని ‘సోదరులు’గా మార్చకుండా ‘స్నేహితులు’గా ఒకే విధంగా అనువదించాం. రెండో సందర్భంలో κατ’ ὄνομα భావంతో సహజంగా కలపడానికి విభక్తి రూపాన్ని వాడాం.
- source_word: κατ’ ὄνομα
  choice: పేరుపేరునా
  rationale: పదశః ‘పేరు ప్రకారం’ అనే భావాన్ని, ఒక్కొక్కరిని వ్యక్తిగతంగా పలకరించాలనే ఉద్దేశాన్ని సహజమైన తెలుగు నుడికారంలో నిలుపుతుంది.
