revisions:
- from: ఎందుకంటే, సహోదరులు[a] వచ్చి నీలో ఉన్న సత్యానికి సాక్ష్యమిచ్చినప్పుడు[b]—నీవు సత్యంలో నడుచుకుంటున్నట్టుగానే—నేను ఎంతో సంతోషించాను.
  to: ఎందుకంటే, సహోదరులు[a] వచ్చి, నీవు సత్యంలో నడుచుకుంటున్నట్లుగా నీ సత్యానికి సాక్ష్యమిచ్చినప్పుడు నేను ఎంతో సంతోషించాను.
  rationale: The revision removes the unsupported phrase “నీలో ఉన్న,” retaining the Greek expression’s compact ambiguity as “నీ సత్యానికి.” The footnote supplies the fuller contextual interpretation without making it the asserted main-text meaning. The comparative clause is integrated into the sentence in a natural Telugu order. Footnote b is retained as an interpretive alternative, but the anchor is removed because the revised main text has no [b] marker.
