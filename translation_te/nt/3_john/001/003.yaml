  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: te
  text: ఎందుకంటే, సహోదరులు[a] వచ్చి, నీవు సత్యంలో నడుచుకుంటున్నట్లుగా నీ సత్యానికి సాక్ష్యమిచ్చినప్పుడు నేను ఎంతో సంతోషించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘సహోదరులు’ అంటే తోటి విశ్వాసులు; గ్రీకులో వ్యాకరణపరంగా పుంలింగ బహువచనం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: ఎందుకంటే … నేను ఎంతో సంతోషించాను
  rationale: γὰρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, λίαν యొక్క బలాన్ని ‘ఎంతో’తో వ్యక్తం చేస్తూ, χαίρωను సహజమైన ఆధునిక తెలుగులో అందించింది.
- source_word: ἐρχομένων ἀδελφῶν
  choice: సహోదరులు వచ్చి … ఉన్నప్పుడు
  rationale: జెనిటివ్ పార్టిసిపియల్ నిర్మాణంలోని కాలసంబంధ భావాన్ని తెలుగులో సహజమైన సందర్భవాచక నిర్మాణంగా మార్చింది.
- source_word: μαρτυρούντων
  choice: సాక్ష్యమిచ్చినప్పుడు
  rationale: μαρτυρέωలోని సాక్ష్య భావాన్ని నిలుపుతూ, కేవలం ‘తెలిపారు’ లేదా ‘నివేదించారు’ అని బలహీనపరచలేదు.
- source_word: σου τῇ ἀληθείᾳ
  choice: నీలో ఉన్న సత్యానికి
  rationale: గ్రీకు దత్తివిభక్తి మరియు σου కలయికను వ్యక్తిగతమైన ‘నీ సత్యం’గా అపార్థం కాకుండా, గాయిలో ఉన్న లేదా అతనికి సంబంధించిన సత్యంగా సహజంగా తెలిపింది; ప్రత్యామ్నాయ సంబంధార్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς
  choice: నీవు సత్యంలో నడుచుకుంటున్నట్టుగానే
  rationale: καθὼςలోని అనురూపతను, περιπατέωలోని నైతిక నడక రూపకాన్ని, వర్తమాన కాలంలోని కొనసాగుతున్న భావాన్ని నిలిపింది.
theological_decisions:
- issue: యోహాను రచనలో ‘సత్యం’ యొక్క సిద్ధాంతపరమైన మరియు నైతిక భావాలు
  choice: రెండు సందర్భాల్లోనూ ‘సత్యం’ అనే పదాన్ని నిలిపి, ‘సత్యంలో నడుచుకోవడం’ అనే రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: ‘సత్యానికి నమ్మకంగా జీవించడం’ లేదా ‘సత్యనిష్ఠతో జీవించడం’
  rationale: ఈ వాక్యం అంగీకరించిన సత్యాన్నీ, ఆ సత్యానికి అనుగుణమైన జీవనాన్నీ కలుపుతుంది. ‘సత్యం’ను కేవలం బోధగా గానీ, కేవలం నిజాయితీగా గానీ పరిమితం చేయకుండా మూలంలోని theological-ethical ఉద్వేగాన్ని కాపాడుతుంది.
- issue: σου τῇ ἀληθείᾳ యొక్క సంబంధార్థం
  choice: ‘నీలో ఉన్న సత్యానికి’
  alternative: ‘సత్యం పట్ల నీ నమ్మకత్వం గురించి’
  rationale: ప్రత్యామ్నాయం సందర్భానికి సరిపోయినా ‘నమ్మకత్వం’ను స్పష్టంగా చేర్చి మూలంలోని అనిశ్చితిని పరిష్కరిస్తుంది. ప్రధాన పాఠం ἀλήθεια అనే ‘సత్యం’ పదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘సత్యంలో నడుచుకోవడం’ అనే యోహానీయ రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపింది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
