id: 3JN.1.2
reference: 3 John 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: te
  text: ప్రియమైనవాడా, నీ ఆత్మ వర్ధిల్లుతున్నట్లే, నీవు అన్ని విషయాల్లో వర్ధిల్లాలని, ఆరోగ్యంగా ఉండాలని ప్రార్థిస్తున్నాను.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అన్ని విషయాల్లో” అనగా “ప్రతి విషయంలో” అని కూడా అనువదించవచ్చు; సంప్రదాయంగా “అన్నిటికంటే ముఖ్యంగా” అని అనువదించారు. గ్రీకు పదబంధం ప్రాధాన్యం కంటే విస్తృతిని సూచించడం మరింత సహజం.
    reason: alternative_reading
  - marker: b
    text: “నీ ఆత్మ వర్ధిల్లుతున్నట్లే” అనగా “నీ అంతరంగ క్షేమం చక్కగా ఉన్నట్లే” లేదా “నీ ఆత్మకు మేలు జరుగుతున్నట్లే” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: ప్రియుడా
  rationale: ప్రేమతో సంబోధించే ఏకవచన రూపాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: περὶ πάντων
  choice: అన్ని విషయాల్లో
  rationale: ప్రాధాన్యాన్ని సూచించే ‘అన్నిటికంటే ముఖ్యంగా’ అనే భావం కాకుండా, ప్రార్థన వర్తించే విస్తృతిని సూచిస్తుంది.
- source_word: εὔχομαί
  choice: ప్రార్థిస్తున్నాను
  rationale: పత్రికా సందర్భంలో ప్రార్థనతో కూడిన అభిలాషను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: σε εὐοδοῦσθαι
  choice: నీవు ... వర్ధిల్లుతూ
  rationale: వ్యక్తి పరిస్థితులు చక్కగా సాగడం, క్షేమంగా ఉండడం అనే విస్తృత భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ὑγιαίνειν
  choice: ఆరోగ్యంగా ఉండాలని
  rationale: ఈ సందర్భంలో శారీరక ఆరోగ్యాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: καθὼς
  choice: అట్లే
  rationale: బాహ్య క్షేమానికి, ఆత్మ క్షేమానికి మధ్య ఉన్న పోలికను స్పష్టంగా సూచిస్తుంది.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: నీ ఆత్మ వర్ధిల్లుతున్నట్లే
  rationale: మూలంలోని రెండు εὐοδόομαι రూపాల పదప్రతిధ్వనిని తెలుగులో ‘వర్ధిల్లు’ అనే ఒకే క్రియతో కాపాడుతుంది.
- source_word: ψυχή
  choice: ఆత్మ
  rationale: ‘జీవం,’ ‘అంతరంగం’ అనే సాధ్యార్థాలను పూర్తిగా నిరాకరించకుండా, ఈ సందర్భంలోని అంతరంగిక క్షేమ భావాన్ని సంప్రదాయబద్ధమైన సాధారణ పదంతో నిలుపుతుంది.
theological_decisions:
- issue: περὶ πάντων యొక్క భావం
  choice: అన్ని విషయాల్లో—విస్తృతి
  alternative: అన్నిటికంటే ముఖ్యంగా—ప్రాధాన్యం
  rationale: గ్రీకు పదబంధం ఇక్కడ ప్రాధాన్యక్రమం కంటే క్షేమం వర్తించే పరిధిని సహజంగా సూచిస్తుంది.
- issue: ψυχή యొక్క భావం
  choice: ఆత్మ
  alternative: అంతరంగం; జీవం; స్వయం
  rationale: వివరణాత్మక మానవ స్వభావ సిద్ధాంతాన్ని చొప్పించకుండా మూలంలోని భావపరమైన విస్తృతిని సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రేమపూర్వకమైనప్పటికీ గౌరవప్రదమైన పత్రికా శైలి. మూలంలోని ‘వర్ధిల్లు’ పదప్రతిధ్వనిని ఉద్దేశపూర్వకంగా నిలిపింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
