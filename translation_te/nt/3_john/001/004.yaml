id: 3JN.1.4
reference: 3 John 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: te
  text: నా పిల్లలు సత్యంలో నడుచుకుంటున్నారని వినడం కంటే నాకు గొప్ప సంతోషం మరొకటి లేదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఈ విషయాలకంటే గొప్ప సంతోషం నాకు లేదు.”
    reason: lexical_alternative
  - marker: b
    text: “నా పిల్లలు” అనేది రచయిత ఆధ్యాత్మికంగా సంరక్షిస్తున్న విశ్వాసులను సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν
  choice: గొప్ప
  rationale: χαράνతో కలిసి తులనాత్మక భావాన్ని ఇస్తుంది; తెలుగులో ‘కంటే ... గొప్ప సంతోషం’ సహజంగా ఉంది.
- source_word: τούτων
  choice: '... వినడం కంటే'
  rationale: ఇది తులనకు సంబంధించిన షష్ఠీ రూపం. తరువాతి ἵνα వాక్యభాగం సూచించే విషయాన్ని తెలుగులో సహజంగా తులనాత్మక నిర్మాణంలో వ్యక్తం చేస్తుంది; మూలంలోని బహువచన రూపం గురించి పాదటిప్పణిలో తెలిపాం.
- source_word: χαράν
  choice: సంతోషం
  rationale: χαρά యొక్క ఆనందభావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα ἀκούω
  choice: వినడం
  rationale: ఇక్కడ ἵνα కఠినమైన ఉద్దేశాన్ని కాకుండా సంతోషానికి కారణమైన విషయాన్ని పరిచయం చేస్తుంది; ‘వినడం’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τὰ ἐμὰ τέκνα
  choice: నా పిల్లలు
  rationale: కుటుంబ సంబంధ రూపకాన్ని వ్యాఖ్యానించి కుదించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: సత్యంలో
  rationale: నిర్దిష్టమైన ‘సత్యం’ అనే భావాన్ని నిలుపుతూ, నిజాయితీ ప్రవర్తన మరియు వెల్లడైన సత్యానికి అనుగుణమైన జీవితం అనే యోహానీయ విస్తృతిని తెరిచి ఉంచుతుంది.
- source_word: περιπατοῦντα
  choice: నడుచుకుంటున్నారని
  rationale: జీవన విధానాన్ని సూచించే నడక రూపకాన్ని తెలుగులో సహజమైన బైబిలు ప్రయోగంగా నిలుపుతుంది.
theological_decisions:
- issue: τέκνα అంటే శారీరక సంతానమా లేక ఆధ్యాత్మిక పిల్లలా?
  choice: ప్రధాన పాఠ్యంలో ‘నా పిల్లలు’ అని ఉంచడం
  alternative: ‘నా ఆధ్యాత్మిక పిల్లలు’ లేదా ‘నా ద్వారా విశ్వసించినవారు’
  rationale: సందర్భం ఆధ్యాత్మిక సంరక్షణలో ఉన్న విశ్వాసులను సూచించే అవకాశం బలంగా ఉన్నా, గ్రీకు పాఠ్యం కుటుంబ సంబంధ పదాన్నే వాడుతుంది. అనువాదంలో రూపకాన్ని నిలిపి, వివరణను పాదటిప్పణికి పరిమితం చేశాం.
- issue: ἐν τῇ ἀληθείᾳ యొక్క భావపరిధి
  choice: ‘సత్యంలో’
  alternative: ‘నిజాయితీగా’ లేదా ‘సత్యబోధ ప్రకారం’
  rationale: యోహానీయ వాడుకలో ఇది నైతిక జీవితం, వెల్లడైన సత్యం రెండింటినీ కలిపి సూచించగలదు. వాటిలో ఒక్కదానికే భావాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘సత్యంలో నడుచుకోవడం’ అనే మూల రూపకాన్ని నిలిపి, అతివ్యాఖ్యానాన్ని నివారించాం.
