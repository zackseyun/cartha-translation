id: 3JN.1.11
reference: 3 John 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: te
  text: ప్రియమైనవాడా, చెడును అనుకరించకు; మంచినే అనుకరించు. మేలు చేసేవాడు దేవుని నుండి వచ్చినవాడు; కీడు చేసేవాడు దేవుణ్ణి చూడలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మేలు చేస్తూ ఉండేవాడు … కీడు చేస్తూ ఉండేవాడు’ అని కూడా అనువదించవచ్చు; గ్రీకులోని వర్తమాన కాల కృదంతాలు కొనసాగుతున్న ఆచరణను లేదా ఒక వ్యక్తికి లక్షణమైన ప్రవర్తనను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: ప్రియమైనవాడా
  rationale: ఏకవచన సంబోధనలోని ఆప్యాయతను, యోహాను రచనలకు సొంతమైన శైలిని నిలుపుతుంది.
- source_word: μὴ μιμοῦ
  choice: అనుకరించకు
  rationale: μιμέομαι అనే క్రియలోని మాదిరిని అనుసరించడం లేదా అనుకరించడం అనే నైతిక భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: τὸ κακὸν ... τὸ ἀγαθόν
  choice: చెడు ... మంచి
  rationale: నపుంసకలింగ విశేషణాలు నామవాచకాలుగా వాడబడి సాధారణ నైతిక వర్గాలను సూచిస్తున్నందున, సహజమైన తెలుగు భావనామాలుగా అనువదించబడ్డాయి.
- source_word: ὁ ἀγαθοποιῶν
  choice: మేలు చేసేవాడు
  rationale: నామవాచకంగా వాడిన వర్తమాన అసమాపక క్రియ యొక్క వ్యక్తిగత, లక్షణాత్మక ప్రవర్తన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: దేవుని నుండి వచ్చినవాడు
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం సిద్ధాంతపరమైన ‘దేవునికి చెందినవాడు’గా కుదించదు.
- source_word: ὁ κακοποιῶν
  choice: కీడు చేసేవాడు
  rationale: ὁ ἀγαθοποιῶνకు సమాంతరంగా ఉండే నిరంతర లేదా లక్షణాత్మక దుష్ప్రవర్తన భావాన్ని కాపాడుతుంది.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: దేవుణ్ణి చూడలేదు
  rationale: ὁράω క్రియ యొక్క స్పష్టమైన ‘చూచుట’ రూపకాన్ని నిలుపుతుంది; దానిని వ్యాఖ్యానాత్మకంగా ‘దేవుణ్ణి ఎరుగడు’ అని మార్చదు.
theological_decisions:
- issue: నైతిక ప్రవర్తనకు దేవునితో సంబంధానికి మధ్య ఉన్న యోహాను శైలి ప్రకటన
  choice: మేలు చేసేవాడు ‘దేవుని నుండి వచ్చినవాడు,’ కీడు చేసేవాడు ‘దేవుణ్ణి చూడలేదు’ అనే మూలపాఠంలోని వర్గాలనే నిలుపడం
  alternative: దీనిని పునర్జన్మ, నైతిక పరిపూర్ణత, లేదా దేవునితో ఎప్పటికీ ఎలాంటి పూర్వ సంబంధమూ లేకపోవడం గురించిన నిర్దిష్ట వ్యవస్థీకృత సిద్ధాంతంగా వివరించడం
  rationale: గ్రీకు పాఠం నైతిక-ఆధ్యాత్మిక నిర్ధారణను యోహాను ప్రత్యేక పదజాలంలో తెలియజేస్తుంది. అనువాదం ఆ హెచ్చరికను తగ్గించకుండా, తరువాతి కాలపు మతశాఖాపరమైన నిర్ణయాలను కూడా చేర్చకుండా దాని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘చెడు/మంచి,’ ‘మేలు/కీడు’ అనే సమాంతర పదజాలం సాధారణ పాఠకులకు స్పష్టంగా ఉండి మూలంలోని నైతిక వ్యత్యాసాన్ని నిలుపుతుంది.
