  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: te
  text: వారు సంఘం ఎదుట నీ ప్రేమ గురించి సాక్ష్యమిచ్చారు. వారిని వారి ప్రయాణానికి దేవునికి తగిన విధంగా సాగనంపితే[a], నీవు మంచి పని చేస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి ప్రయాణానికి సహాయం చేసి పంపితే’; ఈ గ్రీకు క్రియ ప్రయాణికులు ముందుకు వెళ్లేందుకు అవసరమైన ఆచరణాత్మక సహాయం అందించడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: సాక్ష్యమిచ్చారు
  rationale: అఒరిస్ట్ సూచక క్రియ పూర్తయిన గత సంఘటనను తెలియజేస్తుంది. ‘సాక్ష్యమిచ్చారు’ అనే పదం వారు సంఘం ఎదుట గాయికి సంబంధించిన ప్రేమను వెల్లడించిన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: σου τῇ ἀγάπῃ
  choice: నీ ప్రేమను గురించి
  rationale: μαρτυρέωతో వచ్చిన దత్తివిభక్తి సాక్ష్యంలోని విషయాన్ని లేదా దాని సంబంధాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘నీ ప్రేమను గురించి’ అనేది స్పష్టమైన, సహజమైన తెలుగు.
- source_word: ἐνώπιον ἐκκλησίας
  choice: సంఘం ఎదుట
  rationale: ἐνώπιον బహిరంగ సమక్షాన్ని సూచిస్తుంది; ἐκκλησία ఇక్కడ కూడివచ్చిన క్రైస్తవ సమాజాన్ని సూచిస్తుంది. ‘సంఘం ఎదుట’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: οὓς
  choice: వారిని
  rationale: ఈ సంబంధ సర్వనామం ముందటి వచనంలో చెప్పబడిన ప్రయాణిక సహోదరులను సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘వారిని’ సహజం.
- source_word: καλῶς ποιήσεις
  choice: నీవు మంచి పని చేసినవాడవుతావు
  rationale: భవిష్యత్ సూచక రూపంలో మర్యాదపూర్వక ప్రోత్సాహం లేదా విజ్ఞప్తి ఉంది. ఈ అనువాదం నేరుగా ఆజ్ఞగా మార్చకుండా అభినందనాత్మక ప్రోత్సాహాన్ని నిలుపుతుంది.
- source_word: προπέμψας
  choice: ప్రయాణానికి సాగనంపితే
  rationale: προπέμπω ప్రయాణికులను ముందుకు పంపడమే కాక, వారి తదుపరి ప్రయాణానికి అవసరమైన సహాయం అందించే భావాన్నీ కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో సహజమైన రూపాన్ని ఉంచి, విస్తృత భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἀξίως τοῦ θεοῦ
  choice: దేవునికి తగిన విధంగా
  rationale: ἀξίως ప్రవర్తన యొక్క విధానాన్ని తెలియజేస్తుంది. ఈ పదబంధం ఆ ఆతిథ్యం దేవుని ఘనతకు తగిన ప్రమాణంలో ఉండాలనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: క్రైస్తవ ఆతిథ్యంలో προπέμπω పదంలోని భావవిస్తృతి
  choice: ప్రధాన పాఠంలో ‘ప్రయాణానికి సాగనంపితే’ అని అనువదించి, ఆచరణాత్మక సహాయ భావాన్ని పాదటిప్పణిలో ఉంచడం
  alternative: ‘వారి ప్రయాణానికి సహాయం చేసి పంపితే’
  rationale: ఈ పదం కేవలం వీడ్కోలు చెప్పి పంపడాన్ని మాత్రమే కాకుండా, ఆహారం, ధనం లేదా ఇతర అవసరాలు సమకూర్చి ప్రయాణాన్ని కొనసాగించేందుకు తోడ్పడటాన్ని కూడా సూచించవచ్చు. అయితే సహాయం యొక్క నిర్దిష్ట రూపాన్ని మూలపాఠం చెప్పదు; అందువల్ల ప్రధాన పాఠంలో దాన్ని అతిగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని రెండు భాగాల సంబంధాన్ని సహజ తెలుగు షరతు నిర్మాణంతో వ్యక్తం చేశాం; కాలభావాన్ని గత సాక్ష్యం మరియు భవిష్యత్ ఫలితంగా నిలిపాం.
