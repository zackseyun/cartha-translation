id: 3JN.1.7
reference: 3 John 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: te
  text: ఎందుకంటే వారు ఆ నామం కోసం బయలుదేరి, అన్యజనుల[a] నుండి ఏమీ స్వీకరించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అన్యమతస్థుల” లేదా “అవిశ్వాసుల.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: కోసం
  rationale: షష్ఠీ విభక్తిలో ఉన్న ‘నామం’తో కలిసి ఇది ప్రత్యామ్నాయార్థం కంటే ఉద్దేశం లేదా కారణాన్ని సూచిస్తుంది. ‘కోసం’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: τοῦ ὀνόματος
  choice: ఆ నామం
  rationale: గ్రీకులో ఉన్న నిర్దిష్టతను ‘ఆ’ నిలుపుతుంది. ఇది యేసు/ప్రభువును గౌరవపూర్వకంగా సూచించే సంక్షిప్త ప్రయోగం; మూలంలో లేని పేరును ప్రధాన వాక్యంలో చేర్చలేదు.
- source_word: ἐξῆλθον
  choice: బయలుదేరి
  rationale: సేవా ప్రయాణానికి బయలుదేరిన భావాన్ని ఆధునిక, సహజ తెలుగులో ఇస్తుంది. తరువాతి కృదంత భావంతో వాక్యాన్ని సులభంగా కలుపుతుంది.
- source_word: μηδὲν λαμβάνοντες
  choice: ఏమీ స్వీకరించలేదు
  rationale: వారు అన్యజనుల నుండి ధనసహాయం లేదా వస్తుసహాయం ఏదీ పొందలేదనే భావాన్ని ‘స్వీకరించలేదు’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: అన్యజనుల నుండి
  rationale: మొదటి శతాబ్దపు యూదు-క్రైస్తవ దృక్కోణంలోని జాతి-మత నేపథ్యాన్ని ‘అన్యజనులు’ నిలుపుతుంది. సందర్భంలో ‘అన్యమతస్థులు’ లేదా ‘అవిశ్వాసులు’ అనే భావం కూడా సాధ్యమని పాదసూచికలో ఉంచబడింది.
theological_decisions:
- issue: ‘ఆ నామం’ దేనిని సూచిస్తుంది?
  choice: యేసు/ప్రభువును గౌరవపూర్వకంగా సూచించే ‘ఆ నామం’ అనే పరోక్ష ప్రయోగాన్ని ప్రధాన వాక్యంలో అలాగే ఉంచడం.
  alternative: ‘క్రీస్తు నామం’ లేదా ‘ఆయన నామం’ అని స్పష్టంగా అనువదించడం.
  rationale: మూలపాఠం వ్యక్తి పేరును నేరుగా చెప్పకుండా ‘నామం’ అనే గౌరవపూర్వక సంక్షిప్త ప్రయోగాన్ని వాడుతుంది. దానిని అలాగే ఉంచడం మూలంలోని భావగాంభీర్యాన్ని కాపాడుతుంది; మూలంలో లేని స్పష్టీకరణను చేర్చదు.
- issue: ἐθνικῶν యొక్క సందర్భార్థం
  choice: ప్రధాన వాక్యంలో ‘అన్యజనులు’.
  alternative: ‘అన్యమతస్థులు’ లేదా ‘అవిశ్వాసులు’.
  rationale: ‘అన్యజనులు’ మూలపదంలోని జాతి-మత నేపథ్యాన్ని నిలుపుతుంది. అయితే ఈ సందర్భంలో క్రైస్తవ విశ్వాస సమాజానికి వెలుపలివారు అనే మతపరమైన భావం ముందుకు రావచ్చు కాబట్టి ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన శైలి ఉపయోగించబడింది. ‘ఆ నామం’ అనే బైబిలీయ గౌరవప్రయోగం నిలుపబడింది. అందించిన ఆంగ్ల సంప్రదింపు పాఠంలో [a] గుర్తు ‘the Name’ తరువాత ఉన్నప్పటికీ, దాని పాదసూచిక ἐθνικῶν యొక్క ప్రత్యామ్నాయాల గురించి కావడంతో మూలపదానికి సరిపడే ‘అన్యజనుల’ తరువాత గుర్తు ఉంచబడింది.
