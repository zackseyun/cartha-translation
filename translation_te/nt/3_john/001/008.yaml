source:
  edition: SBLGNT
  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: te
  text: కాబట్టి, సత్యం కోసం[a] సహపనివారమవడానికి అలాంటివారిని మనం ఆదరించాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సత్యంతో కలిసి’ లేదా ‘సత్యంలో’ అని కూడా అనువదించవచ్చు. గ్రీకు దత్తి విభక్తిని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు; ప్రధాన పాఠం సత్యం అనే ధ్యేయానికి మద్దతివ్వడం అనే భావాన్ని తీసుకుంటుంది.
    reason: alternative_reading
  - marker: b
    text: ‘ఆదరించాలి’ అని అనువదించిన క్రియకు, అలాంటి సంచార సేవకులను స్వాగతించి వారికి అవసరమైన ఆర్థిక లేదా ఇతర సహాయం అందించాలి అనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: మనం
  rationale: గ్రీకులో సర్వనామం స్పష్టంగా ఉండి నొక్కి చెబుతుంది; సహజమైన ఆధునిక తెలుగులో ‘మనం’ దానిని నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వచనంలోని విషయంనుంచి తీసుకున్న నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: ὀφείλομεν
  choice: ఆదరించాలి
  rationale: ‘చేయవలసిన బాధ్యత ఉంది’ అనే నైతిక బాధ్యతను తెలుగు విధ్యర్థక రూపం సహజంగా తెలియజేస్తుంది; దీనిని నిర్బంధ ఆజ్ఞగా అతిశయింపదు.
- source_word: ὑπολαμβάνειν
  choice: ఆదరించాలి
  rationale: ఈ సందర్భంలో ప్రయాణించే సేవకులను స్వాగతించి, వారికి అవసరమైన సహాయం అందించడాన్ని సూచిస్తుంది. ‘ఆదరించాలి’ అతిథ్యాన్నీ ఆచరణాత్మక తోడ్పాటునీ కలుపుకోగల విస్తృతమైన పదం.
- source_word: τοὺς τοιούτους
  choice: అలాంటివారిని
  rationale: మునుపటి వచనంలో వర్ణించిన రకమైన వ్యక్తులను సూచిస్తుంది; అనవసరంగా పురుషలింగానికి పరిమితం చేయకుండా సహజంగా ఉంటుంది.
- source_word: ἵνα
  choice: తద్వారా
  rationale: వారిని ఆదరించడం వల్ల కలిగే ఉద్దేశపూర్వక ఫలితాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: συνεργοὶ
  choice: తోటి పనివారు
  rationale: ఒకే కార్యంలో పాలుపంచుకొని పనిచేసే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: γινώμεθα
  choice: తోటి పనివారమవుతాం
  rationale: 'γίνομαι లోని ‘అవడం/కావడం’ అనే భావాన్ని నిలుపుతుంది: వారిని ఆదరించడం ద్వారా విశ్వాసులు ఆ పనిలో భాగస్వాములవుతారు.'
- source_word: τῇ ἀληθείᾳ
  choice: సత్యం కోసం
  rationale: ఈ దత్తి విభక్తిని సత్యం అనే ధ్యేయం లేదా దాని పురోగతికి అనుకూలంగా పనిచేయడం అనే భావంలో తీసుకుంటుంది; సందర్భంలోని సంచార సేవకులకు ఇచ్చే సహాయంతో ఇది సరిపోతుంది.
theological_decisions:
- issue: συνεργοὶ పదంతో τῇ ἀληθείᾳ కు ఉన్న సంబంధం
  choice: ‘సత్యం కోసం’—సత్యాన్ని ప్రకటించే కార్యానికి మద్దతిచ్చి దానిలో పాలుపంచుకోవడం
  alternative: ‘సత్యంతో కలిసి’ లేదా ‘సత్యంలో’
  rationale: మునుపటి సందర్భం ‘నామం నిమిత్తం’ బయలుదేరినవారికి సహాయం చేయడం గురించి ఉంది. అందువల్ల ప్రధాన పాఠం సత్యం అనే ధ్యేయం కోసం కలిసి పనిచేయడాన్ని వ్యక్తం చేస్తుంది. అయితే గ్రీకు దత్తి విభక్తి ఇతర సంబంధాలకూ వీలు కల్పిస్తుండటంతో వాటిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఆదరించాలి’ అతిథ్యంతో స్వీకరించడం మరియు ఆచరణాత్మకంగా ఆదుకోవడం రెండింటినీ సూచించగలదు. పాదసూచికలు వర్తించే పదబంధాల దగ్గర ఉంచినందున [b] పాఠంలో [a] కంటే ముందుగా కనిపిస్తుంది.
