id: 3JN.1.1
reference: 3 John 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος Γαΐῳ τῷ ἀγαπητῷ, ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: te
  text: పెద్దనైనవాడు ప్రియమైన గాయసుకు—నేను సత్యంలో[a] ప్రేమించే అతనికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిజంగా” అని కూడా అనువదించవచ్చు; లేదా “ఆ సత్యంలో.” గ్రీకు పదబంధం నిజాయితీగల ప్రేమను, సువార్త సత్యంలో పాతుకుపోయిన ప్రేమను, లేదా రెండింటినీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: పెద్దనైన నేను
  rationale: ఇది పంపినవాడు తనను తాను పరిచయం చేసుకునే బిరుదు లేదా హోదాగా ఉంది. “ప్రెస్బిటర్” వంటి సాంకేతిక సంఘపదాన్ని చేర్చకుండా, వయస్సు లేదా నాయకత్వ హోదా అనే సాధ్యమైన భావాలను “పెద్ద” నిలుపుతుంది; తెలుగు వాక్యానికి అవసరమైన “నేను”ను చేర్చాం.
- source_word: Γαΐῳ
  choice: గాయుకు
  rationale: Γάϊος అనే వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన “గాయు” రూపాన్ని తీసుకొని, గ్రీకు దత్తివిభక్తిని “-కు”తో వ్యక్తం చేశాం.
- source_word: τῷ ἀγαπητῷ
  choice: ప్రియమైన
  rationale: సంబోధించబడుతున్న వ్యక్తిపట్ల ఉన్న ఆప్యాయతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, తరువాత వచ్చే “ప్రేమించే”తో భావసంబంధాన్ని నిలుపుతుంది.
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: నేను … ప్రేమించే అతనికి
  rationale: సంబంధవాచక నిర్మాణాన్ని నిలుపుతూ, ὃν క్రియకు కర్మ అని స్పష్టపరుస్తుంది. గ్రీకులో వ్యక్తమైన ἐγώ యొక్క స్వల్ప ఉద్ఘాటనను “నేను”తో ఉంచాం.
- source_word: ἐν ἀληθείᾳ
  choice: సత్యంలో
  rationale: ఈ పదబంధం నిజాయితీగా ప్రేమించడం, సువార్త సత్యంలో నిలిచిన ప్రేమ, లేదా రెండింటినీ సూచించవచ్చు. “సత్యంలో” ఈ ఉద్దేశపూర్వక విస్తృతిని పరిష్కరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: యోహాను రచనలలో ἀλήθεια అనే పదానికి ఉన్న భావవ్యాప్తి
  choice: సత్యంలో
  alternative: నిజంగా; ఆ సత్యంలో
  rationale: ఇక్కడ ప్రేమ యొక్క నిజాయితీని మాత్రమే సూచిస్తున్నదా, సువార్త సత్యంలో పాతుకుపోయిన ప్రేమను సూచిస్తున్నదా, లేక రెండింటినీ సూచిస్తున్నదా అనే విషయాన్ని మూలపాఠం ఖచ్చితంగా విడదీయదు. అందువల్ల ప్రధాన పాఠం ఆ భావ ఉద్రిక్తతను నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా శైలిని వాడాం. “పెద్దనైన” అనే కొంత బైబిలీయంగా పరిచితమైన రూపం పంపినవాని స్వీయబిరుదును సహజంగా తెలియజేస్తుంది; “సంఘపెద్ద” అని విస్తరించకుండా మూలంలోని సాధ్యమైన హోదా/వయస్సు భావవ్యాప్తిని నిలిపాం.
