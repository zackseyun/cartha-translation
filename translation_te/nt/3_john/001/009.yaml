id: 3JN.1.9
reference: 3 John 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: te
  text: నేను సంఘానికి ఏదో రాశాను[a]. అయితే వారిలో మొదటివాడిగా ఉండాలని కోరుకునే దియొత్రెఫే మమ్మల్ని అంగీకరించడం లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను సంఘానికి ఒక చిన్న సందేశం రాశాను.” గ్రీకు పాఠంలో “ఏదో రాశాను” అనే అనిర్దిష్ట వ్యక్తీకరణ ఉంది; కొన్ని ప్రతుల్లో ఈ మాటలను విస్తరించారు.
    reason: textual_variant
  - marker: b
    text: లేదా, “మమ్మల్ని స్వాగతించడం లేదు,” లేదా “మమ్మల్ని గుర్తించడం లేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: రాశాను
  rationale: గ్రీకు ఏఒరిస్ట్ సూచనార్థక క్రియను సహజమైన తెలుగు భూతకాలంతో వ్యక్తం చేస్తుంది.
- source_word: τι
  choice: ఏదో
  rationale: అనిర్దిష్ట సర్వనామంలోని అస్పష్టతను అలాగే ఉంచుతుంది; మూలంలో స్పష్టంగా లేని ‘చిన్న ఉత్తరం’ వంటి భావాన్ని చేర్చదు.
- source_word: τῇ ἐκκλησίᾳ
  choice: సంఘానికి
  rationale: స్థానిక క్రైస్తవ సమాజాన్ని సూచించే సహజమైన, స్థిరపడిన తెలుగు పదప్రయోగం.
- source_word: ἀλλ’
  choice: అయితే
  rationale: రచయిత రాసినదానికీ దియొత్రెఫే స్పందనకీ మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ φιλοπρωτεύων
  choice: మొదటివాడిగా ఉండాలని కోరుకునే
  rationale: ప్రథమస్థానాన్ని లేదా ప్రాధాన్యాన్ని ఆశించే నైతిక భావాన్ని అర్థమయ్యే ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτῶν
  choice: వారిలో
  rationale: అతడు ఏ సమూహంలో మొదటి స్థానం కోరుతున్నాడో తెలియజేస్తుంది; అధికారిక హోదా ఉందని అదనంగా నిర్ధారించదు.
- source_word: Διοτρέφης
  choice: దియొత్రెఫే
  rationale: గ్రీకు వ్యక్తిపేరును తెలుగు లిపిలో ధ్వన్యనుసారంగా అందిస్తుంది.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: మమ్మల్ని అంగీకరించడం లేదు
  rationale: ἐπιδέχομαιలో ఉండగల స్వీకరించడం, ఆహ్వానించడం, గుర్తించడం అనే విస్తృత భావాన్ని సాధ్యమైనంతవరకు కాపాడుతుంది; కేవలం ఆతిథ్యానికే పరిమితం చేయదు.
theological_decisions:
- issue: దియొత్రెఫే వ్యతిరేకత యొక్క స్వరూపం
  choice: మమ్మల్ని అంగీకరించడం లేదు
  alternative: మమ్మల్ని స్వాగతించడం లేదు; మమ్మల్ని గుర్తించడం లేదు
  rationale: ఇది వ్యక్తిగత స్వాగతమా, ఆతిథ్యమా, లేక రచయిత మరియు అతని ప్రతినిధుల అధికారాన్ని అంగీకరించకపోవడమా అన్నది గ్రీకు వాక్యం ఖచ్చితంగా తేల్చదు. విస్తృతమైన పదప్రయోగం ఆ ఉద్దేశపూర్వక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ఏదో’ మూలంలోని అనిర్దిష్టతను నిలుపుతుంది; ‘అంగీకరించడం లేదు’ ఆతిథ్యం మరియు అధికార గుర్తింపు మధ్య భావపరిధిని అనవసరంగా సంకుచితం చేయదు.
