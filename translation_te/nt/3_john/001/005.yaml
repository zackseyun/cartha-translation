  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: te
  text: ప్రియమైనవాడా, సహోదరుల[a] కోసం నీవు ఏమి చేసినా నమ్మకంగా చేస్తున్నావు—ముఖ్యంగా వారు నీకు అపరిచితులైనప్పుడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరులు’ అని అనువదించిన ἀδελφούς పుంలింగ బహువచనం. ఈ సందర్భంలో అది తోటి విశ్వాసులను సూచిస్తుంది; వారిలో స్త్రీలు కూడా ఉండి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “అది కూడా అపరిచితుల కోసం” అని అనువదించవచ్చు. ఇక్కడ ‘అపరిచితులు’ అంటే తప్పనిసరిగా విదేశీయులు కాదు; గాయుస్‌కు ముందుగా పరిచయం లేని సహవిశ్వాసులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: ప్రియమైనవాడా
  rationale: ἀγαπητός యొక్క ఏకవచన సంబోధనలోని ఆప్యాయతను నిలుపుతూ, మూలంలో లేని ‘స్నేహితుడా’ లేదా ‘సహోదరా’ అనే సంబంధపదాన్ని చేర్చకుండా అనువదిస్తుంది.
- source_word: πιστὸν ποιεῖς
  choice: నమ్మకంగా చేస్తున్నావు
  rationale: అక్షరార్థంగా ‘నమ్మకమైన పని చేస్తున్నావు’ అని చెప్పగలిగినా, ఇక్కడ గాయుస్ ప్రవర్తనలోని విశ్వసనీయతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: నీవు ఏమి చేసినా
  rationale: ἐάνతో కూడిన సంభావనార్థక క్రియ ఇచ్చే అనిర్దిష్ట భావాన్ని—‘ఏది చేసినా’—సూటిగా నిలుపుతుంది.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: సహోదరుల కోసం
  rationale: εἰς యొక్క ప్రయోజనార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తూ, ἀδελφούςలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది.
- source_word: καὶ τοῦτο ξένους
  choice: ముఖ్యంగా వారు నీకు అపరిచితులైనప్పుడు
  rationale: సహోదరులలో తనకు ముందుగా పరిచయం లేనివారికి కూడా గాయుస్ చేసిన సేవను ప్రశంసించే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘ముఖ్యంగా’ అనేది καὶ τοῦτο యొక్క ఉద్ఘాటనను ప్రతిబింబిస్తుంది.
- source_word: ξένους
  choice: నీకు అపరిచితులు
  rationale: ఇక్కడ ξένος జాతిపరంగా విదేశీయులను తప్పనిసరిగా సూచించదు; ఆతిథ్యమిచ్చే వ్యక్తికి ముందుగా తెలియనివారిని సూచిస్తుంది.
theological_decisions:
- issue: ἀδελφούς యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులు’ అని పుంలింగ రూపాన్ని నిలిపి, సందర్భంలో ఇది తోటి విశ్వాసులను సూచిస్తుందని పాదటిప్పణిలో వివరించడం
