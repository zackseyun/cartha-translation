  rationale: మూలంలోని వ్యాకరణ రూపాన్ని కనిపించేలా ఉంచుతుంది; అదే సమయంలో ఆ సమూహంలో స్త్రీలు ఉండే అవకాశాన్ని అనవసరంగా నిరాకరించదు.
- issue: ξένους ఎవరిని సూచిస్తుంది
  choice: సహోదరులలో రచన స్వీకర్తకు అపరిచితులైనవారిగా అనువదించడం
  alternative: విదేశీయులు లేదా విశ్వాసులకు భిన్నమైన అపరిచితులు
  rationale: 3 యోహాను సందర్భం సంచార సహవిశ్వాసులకు ఇచ్చిన ఆతిథ్యాన్ని సూచిస్తుంది; ξένοςను జాతిపరమైన ‘విదేశీయుడు’గా పరిమితం చేయడానికి మూలంలో ఆధారం లేదు.
