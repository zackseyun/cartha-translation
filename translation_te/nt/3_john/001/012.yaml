review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the perfect passive commendation, the universal scope of πάντων, the emphatic αὐτῆς, the additional witness of the writer(s), and the present sense of οἶδας. It appropriately does not insert ‘good’ into the main text.
  naturalness: ‘స్వయంగా సత్యం నుండీ’ is understandable but has an unnatural modifier order in modern standard Telugu. Placing ‘స్వయంగా’ after ‘సత్యం’ makes the emphatic agency clearer and more idiomatic.
  terminology: ‘సాక్ష్యం’ / ‘సాక్ష్యమిస్తున్నాం’ consistently reflects the μαρτυρ- word group. ‘సత్యం’ appropriately preserves the lexical and Johannine connection between ἀλήθεια and ἀληθής without doctrinal narrowing.
