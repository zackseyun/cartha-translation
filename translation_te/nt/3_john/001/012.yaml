source:
  edition: SBLGNT
  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: te
  text: దెమెత్రియుకు అందరి నుండీ[a], సత్యం స్వయంగా కూడా[b] సాక్ష్యం లభించింది. మేము కూడా సాక్ష్యమిస్తున్నాం; మా సాక్ష్యం సత్యమని నీకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దెమెత్రియును గురించి అందరూ సాక్ష్యమిచ్చారు.” గ్రీకులో ‘సాక్ష్యమివ్వడం’ అనే క్రియ పరిపూర్ణ నిష్క్రియ రూపంలో ఉంది; ఇది ఇప్పటికే స్థిరపడిన, ఇంకా వర్తించే ప్రశంసాపూర్వక సాక్ష్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “సత్యం స్వయంగా” అనేది దెమెత్రియు జీవితం సత్యానికి అనుగుణంగా ఉందని సూచించవచ్చు; లేదా మరింత విస్తృతంగా, సువార్త/సత్యమే అతనికి అనుకూలంగా సాక్ష్యమిస్తోందని అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: దెమెత్రియుకు
  rationale: వ్యక్తి పేరును గ్రీకు రూపానికి అనుగుణంగా ఆధునిక తెలుగులో లిప్యంతరీకరించి, దత్తి విభక్తిని ‘-కు’తో తెలిపాం.
- source_word: μεμαρτύρηται
  choice: సాక్ష్యం లభించింది
  rationale: గ్రీకులోని perfect passive రూపాన్ని సహజమైన తెలుగు నిష్క్రియ భావంతో అందించి, గతంలో ఇచ్చిన సాక్ష్యం ఇప్పటికీ స్థిరంగా ఉన్నదనే ఫలితభావాన్ని సాధ్యమైనంతవరకు నిలిపాం. మూలంలో లేని ‘మంచి’ అనే విశేషణాన్ని ప్రధాన వాక్యంలో చేర్చలేదు.
- source_word: ὑπὸ πάντων
  choice: అందరి నుండీ
  rationale: నిష్క్రియ నిర్మాణంలోని సాక్ష్యానికి మూలం/కర్తలను సహజమైన తెలుగులో తెలిపి, πάντων యొక్క సమగ్ర పరిధిని నిలిపాం.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: స్వయంగా సత్యం నుండీ
  rationale: αὐτῆς యొక్క ఉద్ఘాటనను ‘స్వయంగా’తో, ἀληθείας ను వ్యాఖ్యానించి సంకుచితం చేయకుండా ‘సత్యం’గా నిలిపాం.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: మేము కూడా సాక్ష్యమిస్తున్నాం
  rationale: ἡμεῖς యొక్క ఉద్ఘాటనను ‘మేము’తో, additive భావాన్ని ‘కూడా’తో తెలిపాం; δέ ను అనవసరంగా బలమైన విరోధార్థకంగా మార్చలేదు.
- source_word: οἶδας
  choice: నీకు తెలుసు
  rationale: οἶδα రూపం కొయినే గ్రీకులో వర్తమాన స్థితి అర్థాన్నిస్తుంది; తెలుగులో సహజంగా ‘తెలుసు’ అని అనువదించాం.
- source_word: ἡ μαρτυρία ἡμῶν
  choice: మా సాక్ష్యం
  rationale: మునుపటి μαρτυροῦμεν తో పదసంబంధాన్ని నిలిపేందుకు ‘సాక్ష్యం’నే ఉపయోగించాం.
- source_word: ἀληθής ἐστιν
  choice: సత్యం
  rationale: ముందున్న ἀλήθεια తో పదసంబంధం కనిపించేలా సరళంగా ‘సత్యం’ అని అందించాం.
theological_decisions:
- issue: ‘సత్యమే స్వయంగా’ దెమెత్రియుకు సాక్ష్యమివ్వడం అనే యోహాను శైలి భావం
  choice: ‘స్వయంగా సత్యం నుండీ’ అనే విస్తృతమైన రూపాన్ని నిలిపాం.
  alternative: ‘సువార్త నుండీ’ లేదా ‘అతని సత్యానుగుణ జీవితం నుండీ’ అని వివరణాత్మకంగా సంకుచితం చేయడం.
  rationale: ఈ మాట దెమెత్రియు జీవితం సత్యానికి అనుగుణంగా ఉందని సూచించవచ్చు; లేదా సువార్త/సత్యమే అతనికి అనుకూలంగా సాక్ష్యమిస్తుందని విస్తృతంగా అర్థమవచ్చు. గ్రీకు ఈ రెండింటిలో ఒక్కదానికే పరిమితం చేయదు కాబట్టి ప్రధాన పాఠ్యంలో ఆ theological tension ను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘సాక్ష్యం’ అనే పదాన్ని క్రియా-నామ రూపాల మధ్య భావసంబంధం నిలిచేలా పునరావృతం చేశాం. మూలంలో స్పష్టంగా లేని ‘మంచి’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, అనుకూల సాక్ష్యం అనే సందర్భార్థాన్ని గమనికలో వివరించాం.
