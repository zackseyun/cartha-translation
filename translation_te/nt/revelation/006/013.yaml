id: REV.6.13
reference: Revelation 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες τοῦ οὐρανοῦ ἔπεσαν εἰς τὴν γῆν, ὡς συκῆ ⸀βάλλει τοὺς ὀλύνθους αὐτῆς ὑπὸ ἀνέμου μεγάλου σειομένη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: te
  text: ఆకాశంలోని నక్షత్రాలు భూమిపై పడిపోయాయి; బలమైన గాలికి కదిలించబడిన అత్తిచెట్టు తన పక్వానికి రాని అత్తికాయలను రాల్చినట్లుగా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀστέρες
  choice: నక్షత్రాలు
  rationale: సాధారణ అర్థమైన ‘నక్షత్రాలు’నే ఉంచి, ప్రకటన గ్రంథంలోని ప్రతీకాత్మక భావాన్ని అనువాదంలో ముందుగానే వ్యాఖ్యానించలేదు.
- source_word: τοῦ οὐρανοῦ
  choice: ఆకాశ
  rationale: తెలుగులో నక్షత్రాలకు సంబంధించి ‘ఆకాశ నక్షత్రాలు’ సహజంగా ఉండి, పైలోకపు విశ్వవ్యాప్త దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: భూమిమీద పడ్డాయి
  rationale: εἰς సూచించే భూమివైపు కదలిక మరియు పడిన ఫలితం రెండింటినీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὡς
  choice: రాలినట్లుగా
  rationale: మూలంలోని ఉపమానాన్ని తెలుగులో సహజమైన పోలిక నిర్మాణంతో తెలియజేస్తుంది.
- source_word: συκῆ
  choice: అత్తిచెట్టు
  rationale: ఈ వృక్షానికి ప్రామాణికమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: βάλλει
  choice: రాలినట్లుగా
  rationale: పండ్ల సందర్భంలో βάλλει అనే ‘విసరడం/పడవేయడం’ భావాన్ని తెలుగులో సహజంగా ‘రాలడం’ అని వ్యక్తం చేసింది.
- source_word: ὀλύνθους
  choice: పచ్చికాయలు
  rationale: ఇంకా పక్వానికి రాని అత్తికాయలను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; పదానికి ఉన్న ఇతర సూక్ష్మార్థాలను పాదసూచికలో ఉంచింది.
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: బలమైన గాలికి
  rationale: గాలి తీవ్రతను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: σειομένη
  choice: ఊగినప్పుడు
  rationale: చెట్టును బలమైన గాలి కదిలించే పరిస్థితిని సహజమైన కాలసంబంధ ఉపవాక్యంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆకాశ నక్షత్రాలు భూమిమీద పడే ప్రకటనాత్మక దృశ్యం
  choice: ‘ఆకాశ నక్షత్రాలు భూమిమీద పడ్డాయి’ అనే మూల దృశ్యాన్ని యథాతథంగా నిలుపడం
  alternative: నక్షత్రాలను దేవదూతలుగా, పాలకులుగా లేదా ఇతర ప్రతీకాత్మక సత్తలుగా అనువదించడం
  rationale: ఈ దృశ్యానికి ప్రతీకాత్మక భావం ఉండవచ్చు; అయితే మూలపాఠం దానిని ఇక్కడ వివరణాత్మకంగా నిర్ధారించదు. కాబట్టి అనువాదం ఆ వ్యాఖ్యాన భేదాన్ని పరిష్కరించకుండా దృశ్యాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటనాత్మక స్వరాన్ని, అలాగే స్పష్టమైన ఉపమానాన్ని నిలిపింది. ‘పచ్చికాయలు’ సాధారణ పాఠకునికి సులభం; మరింత సాంకేతిక ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
