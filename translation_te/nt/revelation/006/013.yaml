  to: ఆకాశంలోని నక్షత్రాలు భూమిపై పడిపోయాయి; బలమైన గాలికి కదిలించబడిన అత్తిచెట్టు తన పక్వానికి రాని అత్తికాయలను రాల్చినట్లుగా.
