id: REV.6.7
reference: Revelation 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: te
  text: ఆయన నాలుగవ ముద్రను తెరిచినప్పుడు, “రా”[a] అని చెబుతున్న నాలుగవ జీవి స్వరాన్ని నేను విన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భాన్ని బట్టి, “బయలుదేరు.” గ్రీకులో అక్షరార్థంగా “రా” అని ఉంది; ఈ ఆజ్ఞ యోహానును ఉద్దేశించిందా, గుర్రపు స్వారిని ఉద్దేశించిందా అనే విషయంలో భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: తెరిచినప్పుడు
  rationale: ἀνοίγω అనే క్రియకు సహజమైన తెలుగు సమానం ‘తెరచు/తెరువు’. ముద్రలను ఒక్కొక్కటిగా తెరవడం అనే ప్రకటన గ్రంథంలోని పునరావృత సూత్రాన్ని ఇది స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: σφραγῖδα
  choice: ముద్రను
  rationale: చుట్టపై ఉన్న seal‌ను సూచించే స్థిరమైన, సహజమైన తెలుగు పదం ‘ముద్ర’; సందర్భంలోని వస్తువును అనవసరంగా విపులీకరించదు.
- source_word: τετάρτην / τετάρτου
  choice: నాలుగవ
  rationale: రెండు చోట్లా ఒకే క్రమసంఖ్యను స్థిరంగా ఉంచింది.
- source_word: φωνὴν
  choice: స్వరాన్ని
  rationale: నాలుగవ జీవికి చెందిన వినిపించే పలుకును ‘స్వరం’ సహజంగా సూచిస్తుంది; ‘శబ్దం’ కంటే వ్యక్తిగత వాణి భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: ζῴου
  choice: జీవి
  rationale: ఇది సాధారణ జంతువును కాక సింహాసనం చుట్టూ ఉన్న జీవులను సూచిస్తుంది. ‘జీవి’ సహజమైనది మరియు θηρίονకు వాడే ‘మృగం’తో గందరగోళం కలిగించదు.
- source_word: λέγοντος
  choice: అని చెబుతున్న
  rationale: వర్తమాన కృదంతపు కొనసాగుతున్న పలుకు భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: Ἔρχου
  choice: రా
  rationale: ఏకవచన ఆజ్ఞార్థకమైన ἔρχουకు నేరమైన తెలుగు సమానం. ఎవరు రావాలో మూలపాఠం పేర్కొననందున సంబోధితుడిని అనువాదంలో చేర్చలేదు.
theological_decisions:
- issue: Ἔρχου అనే ఆజ్ఞ ఎవరిని ఉద్దేశించింది?
  choice: సంబోధితుడిని పేర్కొనకుండా “రా” అని అనువదించడం.
  alternative: యోహానును ఉద్దేశించిన ఆజ్ఞగా లేదా గుర్రపు స్వారిని ఉద్దేశించి “బయలుదేరు” అనే ఆజ్ఞగా స్పష్టీకరించడం.
  rationale: గ్రీకు పాఠం కేవలం Ἔρχου అని మాత్రమే చెబుతుంది; సంబోధితుడిని గుర్తించదు. అందువల్ల అనువాదం కథనంలోని నిజమైన సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా సహజమైన తెలుగు క్రమం వాడబడింది; అయితే సంబోధితుని గురించిన మూలపాఠపు సందిగ్ధత అలాగే ఉంచబడింది.
