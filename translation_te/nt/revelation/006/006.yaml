id: REV.6.6
reference: Revelation 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: te
  text: 'మరియు నాలుగు జీవరాశుల మధ్యలో ఒక స్వరంలా వినిపించినది ఇలా చెప్పడం విన్నాను: “ఒక కొయినిక్సు[a] గోధుమలు ఒక దేనారానికి[b], మూడు కొయినిక్సుల యవలు ఒక దేనారానికి; నూనెకు, ద్రాక్షామద్యానికి హాని చేయవద్దు.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొయినిక్సు అనేది దాదాపు ఒక లీటరుకు సమానమైన ప్రాచీన పొడి కొలత; సాధారణంగా ఒక వ్యక్తికి ఒక రోజుకు సరిపడే ధాన్య పరిమాణంగా భావించబడుతుంది.
    reason: cultural_note
  - marker: b
    text: దేనారం సాధారణంగా ఒక కూలీకి ఒక రోజు వేతనం. ఇక్కడ చెప్పిన ధరలు తీవ్రమైన ఆహార కొరతను సూచిస్తున్నాయి.
    reason: cultural_note
  - marker: c
    text: లేదా, “నూనెను, ద్రాక్షామద్యాన్ని పాడుచేయవద్దు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: ఒక స్వరంలాంటిది
  rationale: ὡς సూచించే పోలిక లేదా అనిశ్చిత గ్రహింపును నిలుపుతుంది; మాట్లాడినవాడు ఎవరో పాఠ్యంలో లేనందున దానిని నిర్దిష్టం చేయదు.
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: నాలుగు జీవుల మధ్యనుంచి
  rationale: దర్శనంలోని సింహాసన పరిసర జీవులను ‘జీవులు’ అని గౌరవప్రదంగా సూచిస్తూ, స్వరం వాటి మధ్యనుంచి వినిపించిందనే స్థలార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Χοῖνιξ / τρεῖς χοίνικες
  choice: ఒక కొయినిక్సు / మూడు కొయినిక్సులు
  rationale: ప్రాచీన పొడి కొలతను సుమారు ఆధునిక కొలతగా మార్చి ఖచ్చితత్వ భ్రమ కలిగించకుండా చారిత్రక పదాన్ని ఉంచి, పాదసూచికలో దాని పరిమాణం మరియు ప్రాముఖ్యతను వివరిస్తుంది.
- source_word: σίτου
  choice: గోధుమలు
  rationale: యవలతో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతూ σῖτοςకు సందర్భానుగుణమైన అర్థాన్ని ఇస్తుంది.
- source_word: δηναρίου
  choice: ఒక దేనారానికి
  rationale: ధరను తెలిపే జనిటివ్‌ను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, చారిత్రక నాణెం పేరును నిలుపుతుంది.
- source_word: κριθῶν
  choice: యవలు
  rationale: κριθή అనే ధాన్యానికి ప్రామాణికమైన తెలుగు పదం; గోధుమలతో ధర వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τὸ ἔλαιον καὶ τὸν οἶνον
  choice: నూనెకు, ద్రాక్షారసానికి
  rationale: ἔλαιονను సాధారణంగా ‘నూనె’గా, οἶνοςను స్పష్టమైన ఆధునిక తెలుగు పదమైన ‘ద్రాక్షారసం’గా అందిస్తుంది.
- source_word: μὴ ἀδικήσῃς
  choice: హాని చేయవద్దు
  rationale: ἀδικέω ఇక్కడ వస్తువులను పాడుచేయడం లేదా నష్టపరచడం అనే విస్తృత భావాన్ని కలిగి ఉంది; ‘హాని చేయవద్దు’ ఆ విస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: ప్రకటన గ్రంథంలోని ζῴων పదానికి అనువాదం
  choice: జీవులు
  alternative: మృగాలు / జంతువులు
  rationale: ఇవి సింహాసనం చుట్టూ ఉన్న దర్శన జీవులు. ‘మృగాలు’ అనడం ప్రకటన గ్రంథంలో తరువాత కనిపించే విరోధి మృగాలతో అపార్థకరమైన అనుబంధాన్ని కలిగించవచ్చు.
- issue: ప్రాచీన కొలతలు మరియు నాణెం విలువను ఎంతవరకు ఆధునికీకరించాలి
  choice: కొయినిక్సు, దేనారం అనే చారిత్రక పదాలను ఉంచి పాదసూచికల్లో వివరణ ఇవ్వడం
  alternative: లీటరు మరియు ఆధునిక ద్రవ్యమూల్యంగా మార్చడం
  rationale: ఇలా చేయడం చారిత్రక సందర్భాన్ని, తీవ్రమైన కొరతను నిలుపుతుంది; ఆధునిక సమాన విలువలు ఖచ్చితమైనవన్న భ్రమను నివారిస్తుంది.
- issue: స్వరం యొక్క గుర్తింపు
  choice: ఒక స్వరంలాంటిది
  alternative: ఒక స్వరం
  rationale: ὡςలోని పోలిక లేదా గ్రహింపులోని అనిశ్చితిని నిలుపుతూ, స్వరం ఎవరిదో పాఠ్యానికి మించి నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దర్శన వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. వాక్య నిర్మాణం సహజంగా ఉండేందుకు ధరను ధాన్య పరిమాణం తరువాత ఉంచాం. ప్రాచీన కొలత, నాణెం పేర్లను పాదసూచికల సహాయంతో నిలిపాం; పాఠ్యంలో లేని వక్త గుర్తింపును చేర్చలేదు.
