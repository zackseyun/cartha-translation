id: REV.6.5
reference: Revelation 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: te
  text: ఆయన మూడవ ముద్రను తెరిచినప్పుడు, మూడవ జీవి, “రా,”[a] అని చెప్పడం నేను విన్నాను. నేను చూశాను, ఇదిగో, ఒక నల్లని గుర్రం; దానిమీద కూర్చున్నవాని చేతిలో ఒక త్రాసు ఉంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రా” అనే ఆజ్ఞ యోహానును ఉద్దేశించి ఉండవచ్చు; లేదా గుర్రాన్నీ, దానిమీద కూర్చున్నవానినీ ముందుకు రమ్మని పిలిచి ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: గ్రీకు పదం ఇతర సందర్భాల్లో “కాడి” అని కూడా అర్థమివ్వగలదు; ఇక్కడ అది ఆహారాన్ని తూచి కొలిచే త్రాసును సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: తెరిచినప్పుడు
  rationale: ἀνοίγω అనే క్రియకు సహజమైన ప్రత్యక్ష అనువాదం; ముద్రను తెరవడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: σφραγῖδα τὴν τρίτην
  choice: మూడవ ముద్రను
  rationale: మూలంలోని క్రమసంఖ్యను, ‘ముద్ర’ అనే ప్రధాన పదాన్ని యథాతథంగా కాపాడుతుంది.
- source_word: ζῴου
  choice: జీవి
  rationale: ప్రకటన గ్రంథంలోని సింహాసన పరిసర జీవిని సూచిస్తుంది; ‘జంతువు’ అనే సాధారణ భావాన్ని నివారిస్తూ సహజమైన తెలుగు రూపాన్ని ఇస్తుంది.
- source_word: Ἔρχου
  choice: రా
  rationale: ఏకవచన ఆజ్ఞారూపంలోని సంక్షిప్తతను, బలాన్ని కాపాడుతుంది; ఎవరిని ఉద్దేశించిందో అనువాదంలో నిర్ధారించదు.
- source_word: εἶδον ... ἰδοὺ
  choice: నేను చూశాను; ఇదిగో
  rationale: రెండు గ్రీకు వ్యక్తీకరణలైన దర్శనక్రియను, దృష్టిని ఆకర్షించే ἰδού పదాన్ని విడివిడిగా నిలుపుతుంది.
- source_word: ἵππος μέλας
  choice: ఒక నల్లని గుర్రం
  rationale: దర్శనంలోని రంగు ప్రతీకను వ్యాఖ్యానం చేయకుండా ప్రత్యక్షంగా కాపాడుతుంది.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: దానిమీద కూర్చున్నవాని
  rationale: గ్రీకు కృదంత నిర్మాణాన్ని ‘గుర్రపు స్వారీ’గా సంక్షిప్తం చేయకుండా సమీపంగా ప్రతిబింబిస్తుంది.
- source_word: ζυγὸν
  choice: ఒక త్రాసు
  rationale: తదుపరి వచనంలోని ఆహార ధాన్యాల కొలత సందర్భంలో ζυγός తూకం వేసే త్రాసును సూచిస్తుంది; ఆధునిక తెలుగులో స్పష్టమైన పదం.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: చేతిలో
  rationale: సందర్భం ద్వారా స్వామ్యార్థం స్పష్టంగా ఉండగా సహజమైన తెలుగులో మూల భావాన్ని నేరుగా అందిస్తుంది.
theological_decisions:
- issue: Ἔρχου అనే ఆజ్ఞ ఎవరిని ఉద్దేశించింది
  choice: ‘రా’ అని మాత్రమే అనువదించి, సంబోధితుని నిర్దిష్టం చేయలేదు.
  alternative: యోహానును ‘ఇక్కడికి రా’ అని పిలవడం; లేదా గుర్రాన్ని, దానిమీద కూర్చున్నవానిని ముందుకు రమ్మని పిలవడం.
  rationale: గ్రీకులో ఆజ్ఞకు సంబోధితుడు వ్యక్తంగా పేర్కొనబడలేదు. మూలంలోని నిజమైన సందిగ్ధతను కాపాడేందుకు ప్రధాన పాఠంలో దానిని పరిష్కరించకుండా పాదసూచికలో అవకాశాలను తెలిపాం.
- issue: ζυγός యొక్క సందర్భార్థం
  choice: త్రాసు
  alternative: కాడి లేదా జతకాడి
  rationale: తదుపరి వచనంలోని ధాన్యాన్ని కొలిచి ధర నిర్ణయించే సందర్భం తూకపు త్రాసు అర్థాన్ని బలంగా సమర్థిస్తుంది; అయినా పదానికి ఇతర సందర్భాల్లో ‘కాడి’ అనే అర్థం ఉండగలదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. దర్శన వర్ణనలోని ఆకస్మికతను ‘ఇదిగో’ మరియు ఆశ్చర్యార్థక చిహ్నంతో నిలిపాం. పాదసూచిక గుర్తులు సంబంధిత వాక్యభాగాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
