revisions:
- from: భూమి రాజులు, ఉన్నతాధికారులు, సైన్యాధిపతులు, ధనవంతులు, బలవంతులు, బానిసలందరూ, స్వతంత్రులందరూ పర్వతాల గుహల్లోను బండల మధ్యను దాక్కున్నారు.
  to: భూమి రాజులు, ప్రముఖులు, సైన్యాధిపతులు, ధనవంతులు, బలవంతులు, బానిసలందరూ, స్వతంత్రులందరూ గుహలలోను పర్వతాల బండరాళ్ల మధ్యను దాక్కున్నారు.
