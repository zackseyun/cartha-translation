id: REV.6.15
reference: Revelation 6:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every servant and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: te
  text: భూమి రాజులు, ప్రముఖులు, సైన్యాధిపతులు, ధనవంతులు, బలవంతులు, బానిసలందరూ, స్వతంత్రులందరూ గుహలలోను పర్వతాల బండరాళ్ల మధ్యను దాక్కున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: భూమి రాజులు
  rationale: ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త తీర్పు సందర్భంలో γῆకి ‘భూమి’ సహజంగా సరిపోతుంది; ‘దేశం’ అనే పరిమిత భావాన్ని నివారిస్తుంది.
- source_word: μεγιστᾶνες
  choice: ఉన్నతాధికారులు
  rationale: ఈ పదం ఉన్నత స్థానం, ప్రాముఖ్యత గల వ్యక్తులను సూచిస్తుంది. ‘ప్రభువులు’ కంటే ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, వంశపారంపర్య కులీనత్వాన్ని అనవసరంగా సూచించదు.
- source_word: χιλίαρχοι
  choice: సైన్యాధిపతులు
  rationale: పదశః వెయ్యిమందిపై అధికారి అనే భావమున్నా, ఇక్కడ సైనిక నాయకత్వ హోదాను సహజంగా తెలియజేస్తుంది.
- source_word: πλούσιοι
  choice: ధనవంతులు
  rationale: నామవాచకంగా వాడిన విశేషణానికి సంక్షిప్తమైన, ప్రామాణిక తెలుగు సమానం.
- source_word: ἰσχυροὶ
  choice: బలవంతులు
  rationale: శారీరక బలం లేదా సామర్థ్యం అనే మూలభావాన్ని నిలుపుతుంది; ‘శక్తిమంతులు’ కూడా సాధ్యమే కాని అది సామాజిక అధికారంతో ఎక్కువగా కలిసిపోవచ్చు.
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: బానిసలందరూ, స్వతంత్రులందరూ
  rationale: బానిస–స్వతంత్రుడు అనే సామాజిక వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతూ, గ్రీకు ఏకవచన రూపాల ప్రతినిధి భావాన్ని తెలుగులో సహజమైన సమూహార్థంతో వ్యక్తం చేస్తుంది.
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: దాక్కున్నారు
  rationale: క్రియలోని ఆత్మనేపదార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὰ σπήλαια
  choice: గుహల్లోను
  rationale: εἰςలోని లోపలికి వెళ్లే భావం సందర్భంలో దాక్కున్న ప్రదేశంగా పరిణమిస్తుంది; తెలుగులో స్థానార్థక రూపం సహజం.
- source_word: εἰς τὰς πέτρας τῶν ὀρέων
  choice: పర్వతాల ... బండల మధ్యను
  rationale: పర్వతాల్లోని రాతిబండలు, వాటి సందులు లేదా ఆవరణల మధ్య దాక్కోవడాన్ని సహజంగా తెలియజేస్తుంది; ‘బండల్లోకి’ అనే అసహజ పదశః అనువాదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: δοῦλος అనే పదాన్ని స్వతంత్రులతో వ్యతిరేక జంటలో అనువదించడం
  choice: బానిస
  alternative: సేవకుడు
  rationale: ἐλεύθεροςతో ప్రత్యక్ష వ్యతిరేకత ఉండటంతో బంధిత సామాజిక స్థితి ఇక్కడ ప్రధానమైనది; అందువల్ల ‘బానిస’ మూలపాఠపు తీవ్రతను కాపాడుతుంది.
- issue: πᾶς δοῦλος καὶ ἐλεύθεροςలో లింగం మరియు సంఖ్య
  choice: బానిసలందరూ, స్వతంత్రులందరూ
  alternative: ప్రతి బానిస, స్వతంత్రుడు
  rationale: గ్రీకులో పుంలింగ ఏకవచన జంట ఉన్నప్పటికీ అది అన్ని సామాజిక వర్గాలవారిని ప్రతినిధిగా సూచిస్తుంది. తెలుగు బహువచన సమూహ రూపం ఆ సమగ్ర భావాన్ని సహజంగా తెలియజేస్తుంది; పురుషులకే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని వరుస సామాజిక వర్గాల లయను నిలుపుతూ, తెలుగులో అనవసరంగా ప్రతి అంశం ముందు ‘మరియు’ పునరావృతం చేయలేదు. ఈ పాఠ్యంలో పాఠకునికి అవసరమైన అస్పష్టతను వివరించే పాదసూచిక అవసరం లేదని నిర్ణయించబడింది.
