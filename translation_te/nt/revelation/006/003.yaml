    text: లేదా “వెళ్లు.” ఈ ఆజ్ఞ ముందుకు రావాలనే పిలుపుగా కాకుండా గుర్రపు రౌతుకు ఉద్దేశించబడిందని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
  revision_rationale: No correction is needed. The draft faithfully preserves the Greek wording and its ambiguity, while using clear modern standard Telugu. The footnote marker is correctly anchored to the disputed imperative.
