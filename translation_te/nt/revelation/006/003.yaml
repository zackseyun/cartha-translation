id: REV.6.3
reference: Revelation 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: te
  text: ఆయన రెండవ ముద్రను తెరిచినప్పుడు, “రా”[a] అని రెండవ జీవి చెప్పడం నేను విన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వెళ్లు.” ఈ ఆజ్ఞ ముందుకు రావాలనే పిలుపుగా కాకుండా గుర్రపు రౌతుకు ఉద్దేశించబడిందని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: ఆయన...తెరిచినప్పుడు
  rationale: తెలుగులో సహజమైన కథన ప్రవాహం కోసం వాక్యారంభంలోని అనుసంధానార్థాన్ని కాలవాచక ఉపవాక్యంతో కలిపి వ్యక్తం చేశాం; ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: ὅτε
  choice: తెరిచినప్పుడు
  rationale: తదుపరి సంఘటనను సూచించే కాలవాచక సంధి; ‘అప్పుడు’ కంటే ఈ నిర్మాణంలో ‘-నప్పుడు’ సహజంగా ఉంది.
- source_word: ἤνοιξεν
  choice: తెరిచిన
  rationale: ἀνοίγω యొక్క ప్రత్యక్ష అర్థమైన ‘తెరవడం’ను నిలిపాం; ‘ముద్రను విరిచిన’ అనే వ్యాఖ్యానాత్మక భావాన్ని చేర్చలేదు.
- source_word: σφραγῖδα τὴν δευτέραν
  choice: రెండవ ముద్రను
  rationale: గ్రీకు పదబంధంలోని క్రమసంఖ్య ప్రాధాన్యాన్ని సహజమైన తెలుగు పదక్రమంలో తెలిపింది.
- source_word: ἤκουσα
  choice: నేను విన్నాను
  rationale: కథన సందర్భంలోని సాధారణ శ్రవణ క్రియను నేరుగా అనువదించింది.
- source_word: τοῦ δευτέρου ζῴου
  choice: రెండవ జీవి
  rationale: ప్రకటన గ్రంథంలో సింహాసనం చుట్టూ ఉన్న సజీవ సృష్టులను సూచిస్తుంది; ‘జంతువు’ అనే సాధారణ అర్థం తప్పుదారి పట్టించవచ్చు. ‘జీవి’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: λέγοντος
  choice: చెప్పడం
  rationale: ‘విన్నాను’పై ఆధారపడిన వర్తమాన కృదంత భావాన్ని సహజమైన తెలుగు క్రియానామ నిర్మాణంతో నిలిపింది.
- source_word: Ἔρχου
  choice: రా
  rationale: ἔρχομαι ఆజ్ఞారూపానికి ప్రత్యక్షమైన తెలుగు సమానం. సంబోధితుడు స్పష్టంగా లేకపోయినా, గ్రీకు పదం యొక్క ప్రాథమిక దిశార్థాన్ని ప్రధాన పాఠంలో నిలిపాం.
theological_decisions:
- issue: ముద్ర తెరవబడే సందర్భంలోని Ἔρχου ఆజ్ఞ అనువాదం
  choice: రా
  alternative: వెళ్లు
  rationale: గ్రీకు Ἔρχου సహజంగా ‘రా’ అని అర్థమిస్తుంది. ఆజ్ఞ యోహానుకు ఉద్దేశించబడిందా లేక గుర్రపు రౌతుకు ఉద్దేశించబడిందా అనే సందర్భసంబంధ అనిశ్చితిని ప్రధాన పాఠంలో తీర్మానించకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘రా’ ఏకవచన ఆజ్ఞ అయినప్పటికీ గ్రీకు రూపానికి సన్నిహితంగా ఉండి, ఇక్కడ అవమానార్థం కలిగించదు. పాదసూచిక గుర్తు ప్రధాన పాఠంలో సంబంధిత పదం వెంట ఉంచబడింది.
