id: REV.6.2
reference: Revelation 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: te
  text: నేను చూశాను; ఇదిగో, ఒక తెల్లని గుర్రం! దాని మీద కూర్చున్నవాడు[a] ఒక విల్లు పట్టుకొని ఉన్నాడు. అతనికి ఒక కిరీటం[b] ఇవ్వబడింది. అతడు జయిస్తూ, జయించడానికి బయలుదేరాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ గుర్రం మీద కూర్చున్నవాడు ఎవరో పాఠం చెప్పదు. అతని గుర్తింపు గురించి భిన్నమైన వ్యాఖ్యానాలు ఉన్నాయి.
    reason: alternative_reading
  - marker: b
    text: లేదా, “విజయ కిరీటం” లేదా “విజయమాల.” గ్రీకు పదం στέφανος సాధారణంగా విజేతకు ఇచ్చే మాల లేదా కిరీటాన్ని సూచిస్తుంది; అది రాజు ధరించే రాజకిరీటాన్నే తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: ὁράω యొక్క భూతకాల రూపానికి నేరమైన, సహజమైన తెలుగు; దర్శన వర్ణనలో దృశ్యగ్రహణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: ఆకస్మికంగా కనిపించిన దృశ్యంపై పాఠకుని దృష్టిని నిలిపే ప్రకటన గ్రంథపు సజీవ శైలిని కాపాడుతుంది.
- source_word: ἵππος λευκός
  choice: ఒక తెల్లని గుర్రం
  rationale: ఈ దృశ్యంలో కొత్తగా పరిచయమవుతున్న గుర్రాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: దాని మీద కూర్చున్నవాడు
  rationale: మూలంలోని విశేషణార్థక కృదంత నిర్మాణాన్ని సహజంగా నిలుపుతుంది; అతని గుర్తింపును అనువాదంలో చేర్చదు.
- source_word: ἔχων τόξον
  choice: ఒక విల్లు పట్టుకొని ఉన్నాడు
  rationale: ἔχων యొక్క ‘కలిగి ఉండడం/పట్టుకొని ఉండడం’ భావాన్ని ఈ దృశ్య సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: అతనికి ఒక కిరీటం ఇవ్వబడింది
  rationale: కర్మణి ప్రయోగాన్ని నిలుపుతుంది. στέφανος‌ను సాధారణంగా అర్థమయ్యే ‘కిరీటం’గా అనువదించి, విజయమాల అనే ప్రత్యేక నుడికార్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: ἐξῆλθεν
  choice: బయలుదేరాడు
  rationale: దృశ్యంలో కార్యానికి ముందుకు వెళ్లే కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: νικῶν
  choice: జయిస్తూ
  rationale: ప్రధాన క్రియతో పాటు కొనసాగుతున్న జయక్రియను వర్తమాన కృదంత రూపంలో నిలుపుతుంది.
- source_word: ἵνα νικήσῃ
  choice: జయించడానికి
  rationale: ἵνα సహిత విధ్యర్థక క్రియలోని ఉద్దేశ భావాన్ని సహజమైన తెలుగులో కాపాడుతుంది; νικάω పునరుక్తిని కూడా నిలుపుతుంది.
theological_decisions:
- issue: తెల్లని గుర్రం మీద ఉన్నవాని గుర్తింపు
  choice: అతని గుర్తింపును వాక్యంలో నిర్దిష్టం చేయలేదు.
  alternative: క్రీస్తు లేదా క్రీస్తును పోలిన వ్యక్తి; జయించే పాలకుడు లేదా సామ్రాజ్యం; అంతిక్రీస్తు లేదా మోసపూరిత జయశీలి
  rationale: గ్రీకు పాఠం అతని రూపాన్ని, ఆయుధాన్ని, కిరీటాన్ని, కార్యాన్ని మాత్రమే వర్ణిస్తుంది; అతను ఎవరో చెప్పదు. కాబట్టి అనువాదం వివాదాస్పదమైన ఏ గుర్తింపునూ పాఠ్యంలోకి చేర్చదు.
- issue: στέφανος యొక్క స్వరూపం
  choice: ప్రధాన పాఠ్యంలో ‘కిరీటం’
  alternative: విజయ కిరీటం లేదా విజయమాల
  rationale: στέφανος సాధారణంగా విజేతకు ఇచ్చే మాల లేదా కిరీటాన్ని సూచించగలదు; అది రాజాధికారాన్ని సూచించే διάδημαతో తప్పనిసరిగా సమానం కాదు. సందర్భార్థాన్ని అతిగా నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన దర్శన శైలి. ‘ఇదిగో’ అపోకలిప్టిక్ సజీవతను నిలుపుతుంది. ‘జయిస్తూ, జయించడానికి’ అనే ఉద్దేశపూర్వక పునరుక్తి మూలంలోని νικῶν καὶ ἵνα νικήσῃ నిర్మాణాన్ని కాపాడుతుంది.
