revisions:
- from: నిప్పులా ఎర్రని మరో గుర్రం బయలుదేరింది[a]. దాని మీద కూర్చున్నవాడికి భూమి[b] నుండి శాంతిని తీసివేసేందుకు అనుమతి ఇవ్వబడింది; దాంతో మనుషులు ఒకరినొకరు వధించుకుంటారు[c]. అతనికి ఒక పెద్ద ఖడ్గం ఇవ్వబడింది.
  to: నిప్పులా ఎర్రని మరో గుర్రం బయలుదేరింది[a]. దాని మీద కూర్చున్నవాడికి భూమి[b] నుండి శాంతిని తీసివేయడానికి ఇవ్వబడింది, తద్వారా ఒకరినొకరు వధించుకొనేలా; అతనికి ఒక పెద్ద ఖడ్గం ఇవ్వబడింది[c].
  rationale: The revision removes the unsupported ‘permission,’ retains the source’s two unspecified passive constructions, and renders the ἵνα clause with a Telugu purpose/result construction rather than a definite future assertion. Footnote c is placed with ‘ఖడ్గం’ because Telugu word order makes a post-clause anchor less disruptive; its content still explains the immediately preceding ‘వధించుకొనేలా.’
