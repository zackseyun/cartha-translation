id: REV.6.4
reference: Revelation 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: te
  text: నిప్పులా ఎర్రని మరో గుర్రం బయలుదేరింది[a]. దాని మీద కూర్చున్నవాడికి భూమి[b] నుండి శాంతిని తీసివేయడానికి ఇవ్వబడింది, తద్వారా ఒకరినొకరు వధించుకొనేలా; అతనికి ఒక పెద్ద ఖడ్గం ఇవ్వబడింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎర్రని గుర్రం.’ πυρρός అనే గ్రీకు విశేషణం మరింత నిర్దిష్టంగా నిప్పును తలపించే ఎరుపును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘భూమి’కి బదులుగా ‘దేశం’ అని కూడా అనువదించవచ్చు. γῆ అనే గ్రీకు పదానికి ఈ రెండు అర్థాలూ ఉండవచ్చు; అయితే ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త అపోకలిప్టిక్ సందర్భానికి ఇక్కడ ‘భూమి’ బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘వధించు’ అని అనువదించిన గ్రీకు క్రియ సాధారణంగా ‘చంపు’ అనే పదం కంటే బలమైనది; అది హింసాత్మక రక్తపాతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: మరో
  rationale: దర్శనంలోని మునుపటి గుర్రానికి భిన్నంగా, వరుసలో తరువాత కనిపించిన గుర్రాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἵππος πυρρός
  choice: నిప్పులా ఎర్రని గుర్రం
  rationale: πυρρός కేవలం ఎరుపును కాక, నిప్పును తలపించే ఎరుపును సూచిస్తుంది; ఈ తెలుగు పదబంధం ఆ స్పష్టమైన దృశ్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: దాని మీద కూర్చున్నవాడికి
  rationale: ‘స్వారీ చేసేవాడు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా, గ్రీకు కృదంత నిర్మాణాన్ని స్పష్టమైన తెలుగులో అనుసరిస్తుంది.
- source_word: ἐδόθη αὐτῷ λαβεῖν
  choice: తీసివేసేందుకు అనుమతి ఇవ్వబడింది
  rationale: తెలుగులో సహజత కోసం అనుమతి అనే సందర్భార్థాన్ని వ్యక్తం చేస్తూనే, ఇచ్చినవారు ఎవరో పేర్కొనకుండా గ్రీకులోని కర్మణి ప్రయోగాన్ని నిలుపుతుంది.
- source_word: τὴν εἰρήνην ἐκ τῆς γῆς
  choice: భూమి నుండి శాంతిని తీసివేసేందుకు
  rationale: λαμβάνω ... ἐκ అనే నిర్మాణంలోని ‘నుండి తీసివేయడం’ భావాన్ని నిలుపుతుంది; ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త అపోకలిప్టిక్ సందర్భంలో γῆకి ‘భూమి’ సరిపోతుంది.
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: దాంతో మనుషులు ఒకరినొకరు వధించుకుంటారు
  rationale: ἵναలోని ఉద్దేశం లేదా ఫలితం మధ్య ఉన్న భావసంబంధాన్ని ‘దాంతో’ సహజంగా వ్యక్తం చేస్తుంది; σφάζωలోని హింసాత్మక రక్తపాత తీవ్రతను ‘వధించు’ నిలుపుతుంది.
- source_word: μάχαιρα μεγάλη
  choice: ఒక పెద్ద ఖడ్గం
  rationale: μάχαιρα సూచించే యుద్ధాయుధాన్ని అపోకలిప్టిక్ దృశ్యానికి తగిన ‘ఖడ్గం’గా, μεγάληను ‘పెద్ద’గా స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: రెండుసార్లు వచ్చే ἐδόθη అనే కర్మణి ప్రయోగం
  choice: ‘అనుమతి ఇవ్వబడింది’, ‘ఖడ్గం ఇవ్వబడింది’ అనే కర్మణి రూపాలను నిలుపడం
  alternative: ‘దేవుడు అనుమతి ఇచ్చాడు’ లేదా ‘దేవుడు ఖడ్గం ఇచ్చాడు’ అని కర్తను స్పష్టంగా చేర్చడం
  rationale: మూలపాఠం ఇచ్చినవారిని పేర్కొనదు. కర్మణి రూపం దేవుని సార్వభౌమ అనుమతిని సూచించే అవకాశాన్ని ఉంచుతూనే, పాఠం స్పష్టంగా చెప్పని కర్తను అనువాదంలో చేర్చకుండా theological tensionను కాపాడుతుంది.
- issue: ἵνα ద్వారా వ్యక్తమయ్యే ఉద్దేశం లేదా ఫలితం
  choice: ‘దాంతో’ అని ఉద్దేశం–ఫలితం రెండింటికీ చోటు ఇచ్చే అనుసంధానం
  alternative: ‘వధించుకోవాలనే ఉద్దేశంతో’ అని కేవలం ఉద్దేశంగా నిర్ణయించడం
  rationale: ఈ సందర్భంలో ἵνα ఉద్దేశం లేదా పరిణామ ఫలితం అనే రెండు ఛాయలను మోయగలదు; ‘దాంతో’ ఆ సంబంధాన్ని అనవసరంగా ఒక వైపుకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతో పాటు దర్శనభాగానికి తగిన గంభీరతను నిలుపుతుంది. ‘ఖడ్గం’, ‘వధించు’ వంటి పదాలు దృశ్యంలోని హింసాత్మక, అపోకలిప్టిక్ స్వరాన్ని కాపాడుతాయి; పురాతన క్రియారూపాలు నివారించబడ్డాయి.
