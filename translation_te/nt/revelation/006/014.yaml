  terminology: οὐρανόςకు ‘ఆకాశం’ సందర్భోచితం. βιβλίονకు ‘చుట్టపత్రం’ ఆధునిక బద్ధపుస్తకాన్ని సూచించకుండా పురాతన scroll భావాన్ని తెలియజేస్తుంది. ‘తొలగించబడ్డాయి’ κινέω యొక్క స్థానభ్రంశ భావాన్నీ, కర్మణి రూపాన్నీ ప్రతిఫలిస్తుంది.
