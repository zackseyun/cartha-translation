id: REV.6.14
reference: Revelation 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: te
  text: ఆకాశం[a] చుట్టబడుతున్న చుట్టపత్రంలా[b] విడిపోయింది[c], మరియు ప్రతి పర్వతమూ, ప్రతి ద్వీపమూ తమ తమ స్థానాలనుండి తొలగించబడ్డాయి[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆకాశం’కు బదులుగా ‘పరలోకం’ అని కూడా అనువదించవచ్చు. అయితే ఈ దర్శనంలోని విశ్వసంబంధ చిత్రణలో కనిపించే ఆకాశవిశాలతే ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు βιβλίον ఇక్కడ ఆధునిక బద్ధమైన పుస్తకాన్ని కాదు, చుట్టి ఉంచే వ్రాతపత్రాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘తొలగిపోయింది’ లేదా ‘వేరుపడింది.’ గ్రీకు క్రియ విడిపోవడం లేదా వెనక్కి తొలగిపోవడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: d
    text: గ్రీకులో ‘వాటి స్థానాలనుండి’ అని బహువచనంలో ఉంది; ప్రతి పర్వతం, ప్రతి ద్వీపం దాని స్వస్థానం నుండి తొలగించబడిన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανὸς
  choice: ఆకాశం
  rationale: ఈ ప్రళయదర్శన సందర్భంలో భూమికి పైన కనిపించే ఆకాశవిశాలత ఉద్దేశించబడింది. ‘ఆకాశం’ సహజమైన ఆధునిక తెలుగు; ‘పరలోకం’ అని అనువదిస్తే దేవుని నివాసస్థలాన్ని సూచిస్తున్నట్లు అనవసరమైన భావం కలగవచ్చు.
- source_word: ἀπεχωρίσθη
  choice: విడిపోయింది
  rationale: ఈ క్రియ వేరుపడడం లేదా తొలగిపోవడం అనే భావాలను ఇవ్వగలదు. చుట్టివేయబడే గ్రంథపు చుట్ట అనే ఉపమానంతో ‘విడిపోయింది’ బాగా సరిపోతుంది; అయితే ‘తొలగిపోయింది’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: βιβλίον
  choice: గ్రంథపు చుట్ట
  rationale: మొదటి శతాబ్దపు సందర్భంలో ఇది ఆధునిక బద్ధగ్రంథం కంటే చుట్టగా చుట్టే వ్రాతపత్రాన్ని సూచిస్తుంది. సాధారణ పాఠకునికి వస్తువు రూపం స్పష్టంగా ఉండేందుకు ఈ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: ἑλισσόμενον
  choice: చుట్టివేయబడుతున్న
  rationale: వర్తమాన కర్మణి అసమాపక క్రియార్థాన్ని నిలుపుతూ, చుట్ట మూసుకుపోతున్న దృశ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: ప్రతి పర్వతమూ, ప్రతి ద్వీపమూ
  rationale: ఏ ఒక్క పర్వతాన్నీ లేదా ద్వీపాన్నీ మినహాయించని విభజనాత్మక భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ τῶν τόπων αὐτῶν
  choice: తమ తమ స్థానాలనుంచి
  rationale: గ్రీకులోని బహువచన ‘వాటి స్థానాలనుంచి’ అనే భావాన్ని, ఒక్కొక్కటి తన స్థానంనుంచి కదిలిందనే విభజనాత్మక అర్థంతో సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐκινήθησαν
  choice: కదిలిపోయాయి
  rationale: కేవలం కంపించడమే కాక తమ స్థానాలనుంచి తొలగించబడిన దృశ్యాన్ని వ్యక్తం చేస్తుంది. తెలుగు వాక్యప్రయోగంలో ఇది సహజంగా ఉండి, గ్రీకు కర్మణి రూపంలోని కర్తను పేర్కొనని స్వభావాన్ని అతిగా వివరించదు.
theological_decisions:
- issue: ప్రళయదర్శనంలోని విశ్వసంబంధ పదప్రయోగం
  choice: οὐρανός ను ‘ఆకాశం’గా అనువదించడం
  alternative: పరలోకం
  rationale: దర్శనంలో కనిపించే భౌతిక ఆకాశవిశాలతపై దృష్టి నిలుస్తుంది. దేవుని నివాసస్థలం మారిపోయిందనే సిద్ధాంతపరమైన నిర్ణయాన్ని వచనంలోకి చేర్చకుండా ఉంటుంది.
- issue: ఆకాశానికి జరిగిన చర్య స్వభావం
  choice: ἀπεχωρίσθη ను ‘విడిపోయింది’గా అనువదించడం
  alternative: తొలగిపోయింది / అదృశ్యమైంది
  rationale: మూలక్రియలో వేరుపడడం, వెనక్కి తొలగడం అనే భావపరిధి ఉంది. ‘విడిపోయింది’ చుట్ట ఉపమానానికి సరిపోతూ, ఆకాశం పూర్తిగా నశించిందని నిర్ణయించదు; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకునికి అర్థమయ్యే గంభీరమైన దర్శనశైలిని ఉపయోగించాం. ‘గ్రంథపు చుట్ట’కు వివరణాత్మక పాదసూచిక ఇచ్చి చారిత్రక వస్తురూపాన్ని స్పష్టం చేశాం. మూలంలోని ‘విడిపోవడం/తొలగిపోవడం’ అనే సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా నిలిపాం.
