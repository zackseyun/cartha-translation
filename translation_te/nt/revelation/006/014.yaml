  source_fidelity: ప్రధాన భావం మూలగ్రీకుకు సమీపంగానే ఉంది. అయితే ἐκινήθησαν కర్మణి క్రియకు ‘కదిలిపోయాయి’ కంటే ‘తొలగించబడ్డాయి’ మరింత ప్రత్యక్షమైన సమానార్థం. ἀπεχωρίσθηలోని విడిపోవడం/తొలగిపోవడం అనే తెరిచి ఉన్న భావాన్ని ప్రధాన పాఠం మరియు పాదసూచిక నిలుపుతాయి.
