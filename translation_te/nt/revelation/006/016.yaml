id: REV.6.16
reference: Revelation 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: te
  text: 'వారు పర్వతాలకూ బండలకూ ఇలా అంటున్నారు: “మా మీద పడండి! సింహాసనంపై కూర్చున్నవాని సన్నిధి నుండీ[a], గొర్రెపిల్ల ఉగ్రకోపం నుండీ మమ్మల్ని దాచండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సింహాసనంపై కూర్చున్నవాని ముఖం నుండి.”
    reason: πρόσωπον అక్షరార్థంగా ‘ముఖం’; ఈ సందర్భంలో ‘సన్నిధి’ అనేది సహజమైన సందర్భార్థ అనువాదం.
lexical_decisions:
- source_word: λέγουσιν
  choice: అంటున్నారు
  rationale: అపోకలిప్టిక్ కథనంలోని వర్తమాన కాలపు సజీవతను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ὄρεσιν
  choice: పర్వతాలతో
  rationale: ὄρος యొక్క సాధారణ అర్థమైన ‘పర్వతం’ను ఖచ్చితంగా నిలుపుతుంది; ‘కొండలు’ అనడం దృశ్య తీవ్రతను కొంత తగ్గించవచ్చు.
- source_word: πέτραις
  choice: బండలతో
  rationale: πέτρα సూచించే పెద్ద రాతి సమూహాలు లేదా శిలలను ‘బండలు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: మా మీద పడండి
  rationale: బహువచన ఆజ్ఞార్థక రూపంలోని అత్యవసరతను నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κρύψατε ἡμᾶς
  choice: మమ్మల్ని దాచండి
  rationale: ఆజ్ఞార్థక బలాన్ని సరళంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπὸ προσώπου
  choice: ముఖం ఎదుటి నుండి
  rationale: πρόσωπον యొక్క ‘ముఖం’ అనే సజీవ చిత్రాన్ని నిలుపుతూ, ἀπόతో ఉన్న దూరీకరణ భావాన్ని తెలుగులో అర్థమయ్యేలా వ్యక్తపరుస్తుంది; ‘సన్నిధి నుండి’ అనే సందర్భార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: సింహాసనం మీద కూర్చున్నవాని
  rationale: సుబంతంగా వాడిన వర్తమాన కృదంతాన్ని, నిరంతర సింహాసనాసీన స్థితిని సూచించే సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: ὀργῆς
  choice: ఉగ్రత
  rationale: సాధారణ కోపం కంటే తీర్పుతో కూడిన తీవ్ర ఆగ్రహాన్ని సూచిస్తుంది; సందర్భంలోని అంత్యకాల తీర్పు గంభీరతను నిలుపుతుంది.
- source_word: τοῦ ἀρνίου
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలో ἀρνίονకు స్థిరమైన క్రీస్తుసంబంధ బిరుదును నిలుపుతూ, బలిగా అర్పించబడే సౌమ్యతకూ తీర్పు అధికారానికీ మధ్య ఉన్న విరుద్ధభాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: అపోకలిప్టిక్ తీర్పులో దైవిక వ్యక్తుల ప్రస్తావన
  choice: ‘సింహాసనం మీద కూర్చున్నవాడు’ మరియు ‘గొర్రెపిల్ల’ అనే రెండు వేర్వేరు అయినా సమన్వయంగా ఉన్న ప్రస్తావనలను నిలుపడం
  alternative: వాక్యాన్ని దేవుని గురించిన సాధారణ ప్రస్తావనగా కలిపివేయడం లేదా ‘గొర్రెపిల్ల ఉగ్రత’ను మృదువుగా మార్చడం
  rationale: గ్రీకు పాఠం ἀπόతో సమన్వయమైన రెండు పదబంధాలను స్పష్టంగా ఉంచుతుంది—ఒకటి సింహాసనాసీనుడిని, మరొకటి గొర్రెపిల్లను సూచిస్తుంది. బలికి సంబంధించిన గొర్రెపిల్లే అంత్యకాల తీర్పు ఉగ్రతను కలిగి ఉండడం అనే ఉద్దేశపూర్వక theological tensionను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన అపోకలిప్టిక్ శైలిని నిలిపింది. ప్రత్యక్ష ఆజ్ఞల్లో అత్యవసరత కోసం ఆశ్చర్యార్థక చిహ్నం వాడింది; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచింది.
