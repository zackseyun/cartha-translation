id: REV.6.9
reference: Revelation 6:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: te
  text: ఆయన ఐదవ ముద్రను తెరిచినప్పుడు, దేవుని వాక్కు కారణంగానూ, వారు కలిగియున్న సాక్ష్యం[b] కారణంగానూ వధించబడినవారి[a] ఆత్మలను బలిపీఠం కింద నేను చూశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చంపబడినవారి.’ గ్రీకు క్రియ సాధారణ హత్యకన్నా బలమైన హింసాత్మక భావాన్ని కలిగి ఉండి, ఈ సందర్భంలో బలి సంబంధిత ప్రతిధ్వనిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సాక్ష్యప్రకటన.’ గ్రీకు పదం ఇచ్చిన సాక్ష్యాన్నీ, ప్రకటించిన విశ్వాస సాక్ష్యాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: తెరిచినప్పుడు
  rationale: ప్రకటన గ్రంథంలోని ముద్రలను తెరవడం అనే పునరావృత దృశ్యానికి సహజమైన, ఖచ్చితమైన తెలుగు రూపం.
- source_word: σφραγῖδα
  choice: ముద్రను
  rationale: అపోకలిప్టిక్ దృశ్యంలో σφραγίςకు సంప్రదాయబద్ధమైన, అర్థస్పష్టమైన తెలుగు పదం.
- source_word: ὑποκάτω
  choice: కింద
  rationale: సరళమైన స్థలసంబంధ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: θυσιαστηρίου
  choice: బలిపీఠం
  rationale: θυσιαστήριονలోని ఆరాధనా, బలి సంబంధిత చిత్రాన్ని నిలుపుతూ, అది పరలోక సంబంధమైనదా భూసంబంధమైనదా అని అదనంగా నిర్ణయించదు.
- source_word: ψυχὰς
  choice: ఆత్మలను
  rationale: యోహాను దర్శనంలో మరణించినవారు బలిపీఠం కింద కనిపించే ప్రత్యేక చిత్రాన్ని నిలుపుతుంది; ‘ప్రాణాలు’ లేదా ‘వ్యక్తులు’ అని అనువదించడం ఈ దర్శనాత్మక విశిష్టతను తగ్గిస్తుంది.
- source_word: ἐσφαγμένων
  choice: వధించబడినవారి
  rationale: సాధారణంగా ‘చంపబడిన’ అనే పదం కంటే హింసాత్మకమైన, బలి సంబంధిత ఛాయను కలిగిన σφάζω భావాన్ని గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్కు కారణంగా
  rationale: Accusativeతో వచ్చిన διά ఇక్కడ కారణాన్ని సూచిస్తుంది; ‘కారణంగా’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μαρτυρίαν
  choice: సాక్ష్యం
  rationale: μαρτυρία న్యాయపరమైన లేదా విశ్వాస ప్రకటన సంబంధిత ‘సాక్ష్యం’ అనే భావాన్ని కలిగి ఉంది; తెలుగు ‘సాక్ష్యం’ దాని testimony/witness విస్తృతిని చాలావరకు నిలుపుతుంది.
- source_word: ἣν εἶχον
  choice: వారు కలిగివున్న
  rationale: ἔχω యొక్క అసంపూర్ణ భూతకాల భావాన్ని అతిగా వ్యాఖ్యానించకుండా నేరుగా అందిస్తుంది.
theological_decisions:
- issue: దర్శనంలో ψυχὰς స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మలను’ అని అనువదించడం.
  alternative: ప్రాణాలను; వ్యక్తులను
  rationale: ఇది బలిపీఠం కింద కనిపించిన హతసాక్షుల దర్శనాత్మక చిత్రాన్ని నిలుపుతుంది; అయితే ఈ ఒక్క దృశ్యం ఆధారంగా విస్తృత మానవశాస్త్ర సిద్ధాంతాన్ని నిర్ణయించదు.
- issue: ἐσφαγμένων యొక్క బలమైన భావం
  choice: ‘వధించబడినవారి’ అని అనువదించడం.
  alternative: చంపబడినవారి; గొంతుకోయబడినవారి
  rationale: బలిపీఠం సందర్భంలో ఉన్న హింసాత్మక, బలి సంబంధిత ప్రతిధ్వనిని మృదువుచేయకుండా నిలుపుతుంది; అదే సమయంలో గ్రీకు పదాన్ని తప్పనిసరిగా ఒక నిర్దిష్ట హత్యావిధానానికే పరిమితం చేయదు.
- issue: μαρτυρίαν ἣν εἶχον యొక్క అర్థ విస్తృతి
  choice: ‘వారు కలిగివున్న సాక్ష్యం’ అనే సన్నిహిత రూపాన్ని ఉంచడం.
  alternative: వారు ఇచ్చిన సాక్ష్యం; వారు నిలుపుకున్న సాక్ష్యం
  rationale: వారు సాక్ష్యం ఇచ్చారా, దానిని పట్టుకున్నారా అనే భావాల్లో ఒక్కదానిని మాత్రమే బలవంతంగా ఎంచుకోకుండా గ్రీకు వాక్యంలోని సంక్షిప్తతను, ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని దర్శనాత్మక పదచిత్రం, కారణార్థక నిర్మాణం, సాక్ష్యం గురించిన అర్థవిస్తృతి సాధ్యమైనంతవరకు నిలుపబడ్డాయి. పాదటిప్పణి గుర్తులు వాటికి సంబంధించిన పదాల దగ్గరే ఉంచబడ్డాయి.
