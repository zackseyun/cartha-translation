  to: 'వారు గొప్ప స్వరంతో ఇలా కేకలేశారు: “పవిత్రుడవు, సత్యవంతుడవు అయిన సర్వాధిపతీ[a], భూమిపై నివసించేవారిమీద తీర్పు తీర్చి, వారిమీద మా రక్తానికి ప్రతీకారం తీర్చకుండా ఇంకా ఎంతకాలం వరకు ఉంటావు?[b]”'
  rationale: నివసించేవారికి వ్యతిరేకంగా తీర్పు, ప్రతీకారం కోరుతున్న వాక్యంలోని సంబంధాలను తెలుగులో స్పష్టపరిచాం; అయితే ἐκ యొక్క “నుండి” భావాన్ని పాదటిప్పణిలో నిలిపి నిజమైన అనువాద భేదాన్ని తొలగించలేదు. దైవ సంబోధనలో δεσπότης యొక్క ప్రత్యేక అధికారనువ్వును కాపాడుతూ మరింత సహజమైన గౌరవసంబోధనను వాడాం.
