id: REV.6.10
reference: Revelation 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: te
  text: 'వారు గొప్ప స్వరంతో ఇలా కేకలేశారు: “పవిత్రుడవు, సత్యవంతుడవు అయిన సర్వాధిపతీ[a], భూమిపై నివసించేవారిమీద తీర్పు తీర్చి, వారిమీద మా రక్తానికి ప్రతీకారం తీర్చకుండా ఇంకా ఎంతకాలం వరకు ఉంటావు?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులోని δεσπότης (దెస్పోతేస్) అనే బిరుదు సంపూర్ణ అధికారం, యాజమాన్యాన్ని నొక్కిచెబుతుంది; ఇది సాధారణంగా “ప్రభువు” అని అనువదించే κύριος (క్యూరియోస్) కంటే భిన్నమైన పదం. “యజమానీ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “వారి నుండి మా రక్తానికి ప్రతీకారం తీర్చకుండా” అని కూడా అనువదించవచ్చు. గ్రీకులోని ἐκ నిర్మాణం వారినుండి ప్రతీకారం కోరడాన్ని సూచించగలదు; సందర్భంలో వారిమీద ప్రతీకార చర్య జరుగుతుందనే భావమూ ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔκραξαν φωνῇ μεγάλῃ
  choice: పెద్ద స్వరంతో కేకవేస్తూ
  rationale: క్రియలోని తీవ్రతను, φωνῇ μεγάλῃ తెలిపే గట్టిగానున్న స్వరాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Ἕως πότε
  choice: ఇంకా ఎంతకాలం
  rationale: దైవ చర్య ఆలస్యమవుతున్నదన్న విలాపపూర్వక ప్రశ్నను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δεσπότης
  choice: సర్వాధికారియైన యజమాని
  rationale: κύριος అనే సాధారణ ‘ప్రభువు’ బిరుదుతో భేదాన్ని ఉంచుతూ, సంపూర్ణ అధికారం మరియు యాజమాన్యాన్ని సూచించే δεσπότης బలాన్ని తెలియజేస్తుంది.
- source_word: ἅγιος καὶ ἀληθινός
  choice: పవిత్రుడు, సత్యవంతుడు
  rationale: దేవుని పరిశుద్ధతను, నిజమైన మరియు నమ్మదగిన స్వభావాన్ని ప్రత్యక్ష విశేషణాలతో వ్యక్తం చేస్తుంది.
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: తీర్పుతీర్చి … ప్రతీకారం తీర్చకుండా … ఉంటావు
  rationale: రూపరీత్యా వర్తమానకాల ప్రశ్న అయినా, సందర్భంలో ఆలస్యమైన న్యాయచర్య గురించి ఉన్న విజ్ఞప్తిని తెలుగులో సహజంగా అందిస్తుంది; న్యాయతీర్పు మరియు ప్రతీకారమనే రెండు భావాలనూ నిలుపుతుంది.
- source_word: τὸ αἷμα ἡμῶν
  choice: మా రక్తం
  rationale: హింసాత్మక మరణాన్ని సూచించే బైబిలీయ రూపకాన్ని వివరణతో పలుచన చేయకుండా నిలుపుతుంది.
- source_word: ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: భూమిపై నివసించేవారికి
  rationale: ἐκ ఇక్కడ ప్రతీకార చర్య ఎవరిమీద లేదా ఎవరి నుండి అమలవుతుందో సూచిస్తుంది; తెలుగు విభక్తి సహజంగా లక్ష్యాన్ని తెలియజేస్తుంది, అయితే ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: δεσπότης అనే దైవ సంబోధన
  choice: సర్వాధికారియైన యజమానీ
  alternative: ప్రభువా; యజమానీ
  rationale: ‘ప్రభువు’ మాత్రమే అంటే κύριοςతో ఉన్న పదభేదం కనుమరుగవుతుంది; ‘సర్వాధికారియైన యజమాని’ సంపూర్ణ అధికార భావాన్ని స్పష్టపరుస్తుంది, కాని వచనానికి కొత్త సిద్ధాంతాన్ని జోడించదు.
- issue: హతసాక్షుల న్యాయవిన్నపం
  choice: తీర్పుతీర్చి, మా రక్తానికి ప్రతీకారం తీర్చు
  alternative: తీర్పుతీర్చి, మా రక్తానికి న్యాయం చేయు
  rationale: ἐκδικεῖς లోని న్యాయపరమైన ప్రతీకార భావాన్ని మృదువుచేయకుండా నిలుపుతుంది. ఇది దేవుని న్యాయచర్య కోసం చేసే విజ్ఞప్తిగా వచనంలోని ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: ἐκ అనే సంబంధసూచక పదం యొక్క బలం
  choice: భూమిపై నివసించేవారికి … ప్రతీకారం తీర్చడం
  alternative: భూమిపై నివసించేవారిపై … ప్రతీకారం తీర్చడం; భూమిపై నివసించేవారి నుండి … ప్రతీకారం తీర్చుకోవడం
  rationale: ఈ నిర్మాణం ప్రతీకార లక్ష్యాన్ని లేదా దాని మూలాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు నిర్మాణాన్ని ఎంచుకొని, నిజమైన వ్యాకరణ అస్పష్టతను పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రార్థనా-విలాప ధోరణి. ప్రకటన గ్రంథంలో పునరావృతమయ్యే ‘భూమిపై నివసించేవారు’ అనే అంశపూర్వక పదబంధాన్ని నిలుపుతూ, సాధారణ పాఠకునికి సహజంగా ఉండే వాక్యనిర్మాణం ఉపయోగించబడింది.
