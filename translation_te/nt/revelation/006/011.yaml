id: REV.6.11
reference: Revelation 6:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow servants and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: te
  text: వారిలో ఒక్కొక్కరికి తెల్లని పొడవాటి వస్త్రం ఇవ్వబడింది; ఇంకా కొంతకాలం విశ్రమించమని వారికి చెప్పబడింది—వారికి తోటి దాసులూ, వారి సహోదరులూ[b] అయినవారు వారిలాగే చంపబడబోయి, వారు కూడా పూర్తి చేయబడే వరకు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పూర్తి చేయబడే వరకు’ అనే గ్రీకు పదబంధాన్ని ‘నెరవేర్చబడే వరకు’ లేదా ‘వారి పూర్తి సంఖ్య నిండే వరకు’ అని కూడా అర్థం చేసుకోవచ్చు. మూలంలో ‘సంఖ్య’ అనే పదం లేదు.
    reason: alternative_reading
  - marker: b
    text: ‘సహోదరులు’ అని అనువదించిన గ్రీకు పుంలింగ బహువచన పదం, ఈ సందర్భంలో స్త్రీలతో సహా తోటి విశ్వాసులందరినీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: στολὴ λευκή
  choice: తెల్లని అంగీ
  rationale: στολή పొడవైన వస్త్రాన్ని లేదా అంగీని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘అంగీ’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: ἑκάστῳ
  choice: వారిలో ఒక్కొక్కరికి
  rationale: ఏకవచన దత్తి రూపంలోని పంపిణీ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐρρέθη αὐτοῖς
  choice: వారికి చెప్పబడింది
  rationale: గ్రీకు కర్మణి ప్రయోగాన్ని తెలుగులో సహజమైన కర్మణి రూపంతో నిలుపుతుంది.
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: ఇంకా కొంతకాలం విశ్రమించమని
  rationale: ἀναπαύω లోని విశ్రాంతి భావాన్నీ, ἔτι χρόνον μικρόν లోని ‘మరికొంత కాలం’ అనే కాల భావాన్నీ సహజంగా అందిస్తుంది.
- source_word: πληρωθῶσιν
  choice: సంపూర్ణం చేయబడే
  rationale: ‘సంఖ్య’ అనే పదాన్ని మూలంలో లేనప్పుడు చేర్చకుండా, πληρόω కర్మణి రూపంలోని పూర్తి/సంపూర్ణత భావాన్ని నిలుపుతుంది.
- source_word: σύνδουλοι
  choice: తోటి దాసులు
  rationale: ఒకే యజమానికి చెందినవారనే σύνδουλος భావాన్ని ‘తోటి దాసులు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతూ, ఆధునిక గౌరవప్రద తెలుగు పదాన్ని ఉపయోగిస్తుంది.
- source_word: μέλλοντες ἀποκτέννεσθαι
  choice: చంపబడబోయే
  rationale: μέλλω తో కూడిన భావి/సమీపంగా సంభవించబోయే చర్యను అనవసరమైన విధినిర్ణయ భావం లేకుండా తెలియజేస్తుంది.
- source_word: ὡς καὶ αὐτοί
  choice: వారిలాగే
  rationale: బలిపీఠం కింద ఉన్నవారు చంపబడినట్లే ఇతరులు కూడా చంపబడతారనే పోలికను సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: వ్యక్తులను కర్తలుగా తీసుకున్న πληρωθῶσιν అర్థం
  choice: ‘సంపూర్ణం చేయబడే వరకు’ అని సాధారణ పూర్తి భావంతో అనువదించడం
  alternative: ‘వారి పూర్తి సంఖ్య నిండే వరకు’ లేదా ‘నెరవేర్చబడే వరకు’
  rationale: గ్రీకులో ‘సంఖ్య’ అని స్పష్టంగా లేదు. సంఖ్యాపరమైన పూర్తి సందర్భం ద్వారా సూచించబడవచ్చుగాని, దానిని ప్రధాన పాఠ్యంలో నిర్బంధించకుండా మూలంలోని విస్తృతమైన భావాన్ని నిలుపుతున్నాం.
- issue: ἀδελφοί మిశ్రిత లింగ విశ్వాసుల సమూహాన్ని సూచించే అవకాశం
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులు’; విస్తృత ప్రయోగాన్ని పాదటిప్పణిలో తెలపడం
  alternative: ‘సహోదర సహోదరీలు’ లేదా ‘తోటి విశ్వాసులు’
  rationale: గ్రీకు పదరూపం పుంలింగ బహువచనం; అయితే ప్రాచీన క్రైస్తవ వాడుకలో స్త్రీలను కూడా కలుపుకొని విశ్వాసుల సమూహాన్ని సూచించగలదు. రెండింటినీ నిజాయితీగా నిలుపుతుంది.
- issue: సహదాసత్వాన్ని సూచించే σύνδουλοι
  choice: ‘తోటి దాసులు’
  alternative: ‘తోటి సేవకులు’
  rationale: ఒకే ప్రభువుకు చెందిన బంధిత స్థితి అనే రూపకాన్ని బలహీనపరచకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. మూలంలోని రెండు కర్మణి రూపాలు సాధ్యమైనంతవరకు నిలుపబడ్డాయి. ‘సంపూర్ణం చేయబడే’ అనే కొంత అసాధారణమైన వ్యక్తీకరణ, మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడేందుకు ఉంచబడింది.
