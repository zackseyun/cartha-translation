revisions:
- from: వారిలో ఒక్కొక్కరికి తెల్లని అంగీ ఇవ్వబడింది. ఇంకా కొంతకాలం విశ్రమించమని వారికి చెప్పబడింది—వారిలాగే చంపబడబోయే వారి తోటి దాసులు, వారి సహోదరులు కూడా సంపూర్ణం చేయబడే వరకు.[a][b]
  to: వారిలో ఒక్కొక్కరికి తెల్లని పొడవాటి వస్త్రం ఇవ్వబడింది; ఇంకా కొంతకాలం విశ్రమించమని వారికి చెప్పబడింది—వారికి తోటి దాసులూ, వారి సహోదరులూ[b] అయినవారు వారిలాగే చంపబడబోయి, వారు కూడా పూర్తి చేయబడే వరకు.[a]
  rationale: The revision corrects the robe terminology, clarifies the scope of the participial clause ‘about to be killed,’ and improves the passive completion wording. It does not introduce ‘number’ into the main text or impose a particular interpretation of πληρωθῶσιν. Footnote markers are placed directly after the relevant wording.
