- from: ఆయన ఆరవ ముద్రను తెరిచినప్పుడు నేను చూశాను. అప్పుడు గొప్ప భూకంపం వచ్చింది; సూర్యుడు వెంట్రుకలతో నేసిన గోనెపట్టలా[a] నల్లగా మారాడు; చంద్రుడు మొత్తంగా రక్తంలా మారాడు.
