id: REV.6.12
reference: Revelation 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: te
  text: ఆయన ఆరవ ముద్రను తెరిచినప్పుడు నేను చూశాను. అప్పుడు గొప్ప భూకంపం వచ్చింది; సూర్యుడు వెంట్రుకలతో చేసిన ముతక గోనెపట్టలా[a] నల్లగా మారాడు; చంద్రుడు అంతా రక్తంలా మారాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెంట్రుకల గోనెపట్టలా.” ఈ పదబంధం వెంట్రుకలతో—బహుశా మేక వెంట్రుకలతో—చేసిన ముతక గోనెపట్టను సూచిస్తుంది; ఇలాంటి వస్త్రం సంప్రదాయంగా శోకంతో ముడిపడి ఉండేది.
    reason: త్రίχινος అనే పదం వెంట్రుకలతో చేసిన వస్త్రాన్ని సూచిస్తుంది; ‘నేసిన’ అనే అదనపు తయారీ విధానాన్ని నివారిస్తూ పదబంధానికి ప్రత్యామ్నాయ రూపాన్ని, అవసరమైన సాంస్కృతిక వివరణను అందిస్తుంది.
lexical_decisions:
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: దర్శనంలో యోహాను గ్రహించిన దృశ్యాన్ని తెలియజేసే సాధారణ, సహజమైన అనువాదం.
- source_word: ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην
  choice: ఆయన ఆరవ ముద్రను తెరిచినప్పుడు
  rationale: ముద్రను తెరవడం అనే ప్రకటన గ్రంథపు స్థిరమైన రూపకాన్ని నేరుగా నిలుపుతుంది; గ్రీకు కర్తను ‘ఆయన’గా ఉంచి, ముందున్న సందర్భమే ఆయన ఎవరన్నది నిర్ధారించనిస్తుంది.
- source_word: σεισμὸς μέγας ἐγένετο
  choice: గొప్ప భూకంపం వచ్చింది
  rationale: σεισμόςను సందర్భానుసారం ‘భూకంపం’గా, μέγαςను బలహీనపరచకుండా ‘గొప్ప’గా అందిస్తుంది; ‘వచ్చింది’ ఆధునిక తెలుగులో సహజమైన సంఘటనాత్మక ప్రయోగం.
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: సూర్యుడు నల్లగా మారాడు
  rationale: μέλας యొక్క నిర్దిష్టమైన ‘నలుపు’ భావాన్ని ‘చీకటి’గా సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: ὡς σάκκος τρίχινος
  choice: వెంట్రుకలతో నేసిన గోనెపట్టలా
  rationale: σάκκοςను ‘గోనెపట్ట’గా, τρίχινοςను వెంట్రుకలతో చేసిన ముతక వస్త్రంగా స్పష్టంగా తెలియజేస్తుంది; ὡς సూచించే ఉపమానాన్ని ‘లా’తో నిలుపుతుంది.
- source_word: ἡ σελήνη ὅλη
  choice: చంద్రుడు మొత్తంగా
  rationale: ὅλη ఇచ్చే సంపూర్ణత ఉద్ఘాటనను సహజమైన తెలుగు క్రియావిశేషణ రూపంలో స్పష్టంగా నిలుపుతుంది.
- source_word: ἐγένετο ὡς αἷμα
  choice: రక్తంలా మారాడు
  rationale: ὡςను ఉపమానంగానే ఉంచి, చంద్రుడు అక్షరార్థంగా రక్తమయ్యాడని అనువాదం నిర్ణయించకుండా ఉంటుంది.
theological_decisions:
- issue: విశ్వసంబంధ సూచనల స్వభావం
  choice: భూకంపం, నల్లబడిన సూర్యుడు, రక్తంలా మారిన చంద్రుడు అనే దర్శన చిత్రాలను వ్యాఖ్యానం జోడించకుండా యథాతథంగా అందించడం.
  alternative: వీటిని పూర్తిగా అక్షరార్థ ఖగోళ సంఘటనలుగా లేదా పూర్తిగా ప్రతీకాత్మక రాజకీయ/న్యాయతీర్పు సూచనలుగా స్పష్టీకరించడం.
  rationale: గ్రీకు పాఠం స్పష్టమైన ఉపమానాలతో దర్శనాన్ని వర్ణిస్తుంది గాని, ఆ సూచనల విస్తృత వ్యాఖ్యానాన్ని తేల్చదు. అందువల్ల అనువాదం ఆ ఉద్దేశపూర్వక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. గ్రీకులోని వరుస ‘καὶ’ ప్రయోగాన్ని తెలుగులో అసహజంగా పునరావృతం చేయకుండా, ‘అప్పుడు’ మరియు అర్ధవిరామాలతో సంఘటనల వరుసను నిలిపాం. దర్శనపు ఉపమానాలను సిద్ధాంతపరంగా విశదీకరించలేదు.
