  to: నేను చూశాను; ఇదిగో, పాలిపోయిన పచ్చని రంగు గల గుర్రం.[a] దానిమీద కూర్చున్నవాని పేరు మృత్యువు; పాతాళం అతని వెంట వస్తోంది. భూమిలోని నాలుగవ వంతుపై ఖడ్గంతో, కరవుతో, తెగులుతో[b], భూమిమీద ఉన్న క్రూరమృగాల చేత చంపడానికి వారిద్దరికీ అధికారం ఇవ్వబడింది.
