id: REV.6.8
reference: Revelation 6:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: te
  text: నేను చూశాను; ఇదిగో, పాలిపోయిన పచ్చని రంగు గల గుర్రం.[a] దానిమీద కూర్చున్నవాని పేరు మృత్యువు; పాతాళం అతని వెంట వస్తోంది. భూమిలోని నాలుగవ వంతుపై ఖడ్గంతో, కరవుతో, తెగులుతో[b], భూమిమీద ఉన్న క్రూరమృగాల చేత చంపడానికి వారిద్దరికీ అధికారం ఇవ్వబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “పాలిపోయిన గుర్రం.” గ్రీకు పదం పచ్చటి లేదా పాలిపోయిన పచ్చటి వర్ణాన్ని అక్షరార్థంగా సూచిస్తుంది; ఇక్కడ అది రోగగ్రస్తమైన లేదా శవసదృశమైన ఛాయను సూచించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా: “మరణంతో.” యెహెజ్కేలు 14లోని తీర్పుల జాబితా నేపథ్యానుసారం ఇక్కడ ఈ పదం “తెగులు” అనే భావంలో వాడబడి ఉండవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: పాలిపోయిన పచ్చని
  rationale: ఈ పదం పచ్చని లేదా పాలిపోయిన పచ్చని వర్ణాన్ని సూచించగలదు. సందర్భంలోని శవసదృశమైన, రోగగ్రస్తమైన ఛాయను తెలియజేస్తూనే దాని ప్రాథమిక వర్ణార్థాన్ని నిలుపుతుంది.
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: దానిమీద కూర్చున్నవాడు
  rationale: గ్రీకు కృదంత ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: దానిమీద కూర్చున్నవాని పేరు మృత్యువు
  rationale: సవారీ చేస్తున్న వ్యక్తికి ‘మృత్యువు’ అనే పేరు ఉందని తెలిపే గ్రీకు నామకరణ నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Θάνατος
  choice: మృత్యువు
  rationale: ఇక్కడ మృత్యువు వ్యక్తీకరించబడి గుర్రంపై కూర్చున్నవాని పేరుగా ఉంది.
- source_word: ᾅδης
  choice: పాతాళం
  rationale: మృతుల లోకాన్ని సూచించే పదంగా తెలుగులో సహజంగా అర్థమవుతుంది; అంతిమ శిక్షాస్థలమనే భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: μετ’ αὐτοῦ
  choice: అతనితోపాటు
  rationale: μετά + షష్ఠీ విభక్తి యొక్క ప్రాథమిక ‘తో’ భావాన్ని నిలుపుతూ, ἠκολούθει తెలిపే వెంబడింపుతో సహజంగా కలుస్తుంది.
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: వారిద్దరికీ అధికారం ఇవ్వబడింది
  rationale: బహువచన సర్వనామం మృత్యువు, పాతాళం అనే ఇద్దరినీ సూచిస్తుందని తెలుగులో స్పష్టం చేస్తుంది; కర్తను పేర్కొనని దైవీయ కర్మణి ప్రయోగాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: భూమిలో నాలుగవ వంతుమీద
  rationale: తీర్పు పరిధిని భూమి యొక్క నాలుగవ వంతుగా సూటిగా తెలియజేస్తుంది.
- source_word: ἀποκτεῖναι
  choice: చంపడానికి
  rationale: సరళమైన, ఆధునిక తెలుగు క్రియ; గ్రీకు ఉద్దేశార్థక క్రియారూపాన్ని నిలుపుతుంది.
- source_word: ἐν ῥομφαίᾳ
  choice: ఖడ్గంతో
  rationale: ῥομφαία అనే ఆయుధార్థాన్ని, సాధనార్థక ἐν భావాన్ని గంభీరమైన కానీ సులభమైన తెలుగులో అందిస్తుంది.
- source_word: ἐν λιμῷ
  choice: కరవుతో
  rationale: వ్యక్తిగత ఆకలి కంటే విస్తృతమైన ఆహార కొరత లేదా కరవును సూచించే λιμός భావాన్ని అందిస్తుంది.
- source_word: ἐν θανάτῳ
  choice: తెగులుతో
  rationale: యెహెజ్కేలు 14లోని తీర్పుల జాబితా నేపథ్యానుసారం θάνατος ఇక్కడ మహమ్మారి లేదా తెగులు అనే ప్రయోగార్థం కలిగి ఉండవచ్చు; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: భూమిమీద ఉన్న క్రూరమృగాల చేత
  rationale: ὑπό సూచించే కర్తృసాధనాన్ని ‘చేత’తో, θηρία యొక్క ప్రమాదకర అడవి జంతువుల భావాన్ని ‘క్రూరమృగాలు’తో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ᾅδης పదం అనువాదం
  choice: పాతాళం
  alternative: మృతుల లోకం; సమాధి; నరకం
  rationale: వాక్యం వ్యక్తీకరించబడిన మృత్యువును, అతనితోపాటు వచ్చే మృతుల లోకాన్ని వేరుగా చూపిస్తుంది. ‘నరకం’ అని అనువదించడం అంతిమ తీర్పుకు సంబంధించిన భావాన్ని అనవసరంగా చేర్చవచ్చు.
- issue: తీర్పుల జాబితాలో ἐν θανάτῳ భావం
  choice: తెగులుతో
  alternative: మరణంతో
  rationale: ఇది యెహెజ్కేలు 14లో కనిపించే స్థిరమైన తీర్పుల జాబితాను ప్రతిధ్వనిస్తుంది; ఆ సందర్భంలో ‘మరణం’ తెగులు లేదా మహమ్మారిని సూచించగలదు. నిజమైన అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- issue: αὐτοῖς అనే బహువచన సర్వనామ సూచన
  choice: వారిద్దరికీ
  alternative: వారికి
  rationale: దగ్గరగా పేర్కొన్న మృత్యువు, పాతాళం అనే రెండు వ్యక్తీకృత అంశాలనే బహువచనం సూచించే సహజ పఠనాన్ని తెలుగులో స్పష్టం చేస్తుంది; అధికారం ఎవరు ఇచ్చారో మాత్రం వాక్యం చెప్పనందున పేర్కొనలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన అపోకలిప్టిక్ శైలిని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘ఇదిగో’, ‘మృత్యువు’, ‘పాతాళం’, ‘ఖడ్గం’ వంటి పదాలు ప్రకటన గ్రంథపు గంభీరతకు తగినవి. మూలంలోని దీర్ఘ సమన్వయ వాక్యాన్ని తెలుగు పఠనసౌలభ్యానికి రెండు వాక్యాలుగా విభజించినా భావక్రమాన్ని నిలిపాం.
