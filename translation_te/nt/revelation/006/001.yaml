id: REV.6.1
reference: Revelation 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: te
  text: గొర్రెపిల్ల ఏడు ముద్రలలో ఒక ముద్రను తెరిచినప్పుడు నేను చూశాను. అప్పుడు నాలుగు జీవుల్లో ఒక జీవి ఉరుములాంటి స్వరంతో, “రా[a]!” అని చెప్పడం విన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ ఆజ్ఞ యోహానుకు కాక గుర్రపు రౌతును ఉద్దేశించి చెప్పబడిందని అర్థం చేసుకుంటే, “బయలుదేరు” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలో ఇది యేసును సూచించే క్రీస్తుసంబంధమైన బిరుదు. తెలుగు బైబిలు వాడుకలో సహజంగా, గౌరవప్రదంగా ఉన్న రూపాన్ని ఎంచుకున్నాం.
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: ఏడు ముద్రలలో ఒకదాన్ని
  rationale: ఏడు ముద్రల సమూహంలోనిది ఒకటి అనే భాగార్థక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ζῴων
  choice: జీవులు
  rationale: ఇక్కడ సాధారణ జంతువులు కాక సింహాసన పరిసరాల్లోని సజీవ పరలోక ప్రాణులు ఉద్దేశించబడ్డాయి. ‘జీవులు’ సందర్భానికి తగిన, స్థిరమైన తెలుగు పదం.
- source_word: ὡς φωνῇ βροντῆς
  choice: ఉరుములాంటి స్వరంతో
  rationale: ఆ జీవి స్వరాన్ని ఉరుముతో పోల్చే ఉపమానాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: Ἔρχου
  choice: రా
  rationale: ἔρχομαι ఆజ్ఞార్థక రూపానికి అత్యంత ప్రత్యక్షమైన అర్థం ‘రా.’ మూలపాఠం ఎవరిని ఉద్దేశించి చెప్పిందో స్పష్టంగా తెలుపనందున ప్రధాన పాఠంలో ఆ అనిశ్చితిని నిలిపాం.
- source_word: ὅτε
  choice: తెరిచినప్పుడు
  rationale: దర్శనం జరిగిన సమయాన్ని సూచించే కాలార్థక సంబంధాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: కథనంలోని భూతకాల క్రియను అదనపు భావం చేర్చకుండా సరళంగా అనువదిస్తుంది.
- source_word: ἤκουσα
  choice: విన్నాను
  rationale: ἀκούω భూతకాల కథన రూపానికి ప్రామాణికమైన తెలుగు సమానం.
- source_word: λέγοντος
  choice: చెప్పడం
  rationale: మాట్లాడిన విధానాన్ని అతిశయింపకుండా participial భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో అందిస్తుంది.
theological_decisions:
- issue: Ἔρχου అనే ఆజ్ఞ ఎవరిని ఉద్దేశించింది, దాని భావం ఏమిటి
  choice: ప్రధాన పాఠంలో ఎవరిని ఉద్దేశించిందో నిర్దేశించకుండా ‘రా’ అని అనువదించడం.
  alternative: ఈ ఆజ్ఞ యోహానుకు కాక గుర్రపు స్వారికి చెప్పబడిందని అర్థం చేసుకుంటే ‘బయలుదేరు’ అని అనువదించడం.
  rationale: గ్రీకు ఆజ్ఞకు ప్రత్యక్ష అర్థం ‘రా’; అయితే సంబోధితుడు స్పష్టంగా పేర్కొనబడలేదు. అందువల్ల మూలంలోని అనిశ్చితిని ప్రధాన పాఠంలో నిలిపి, సందర్భాధారిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని రెండు καί పదాలను తెలుగులో సహజమైన క్రమానికి అనుగుణంగా మొదటిదాన్ని ప్రత్యేకంగా చూపకుండా, రెండవదాన్ని ‘అప్పుడు’గా వ్యక్తం చేశాం. పాదసూచిక గుర్తు సంబంధిత ఆజ్ఞ తర్వాతే ఉంచబడింది.
