revisions:
- from: గొర్రెపిల్ల ఏడు ముద్రలలో ఒకదాన్ని తెరిచినప్పుడు నేను చూశాను. అప్పుడు నాలుగు జీవులలో ఒకటి ఉరుములాంటి స్వరంతో, “రా[a]!” అని చెప్పడం విన్నాను.
  to: గొర్రెపిల్ల ఏడు ముద్రలలో ఒక ముద్రను తెరిచినప్పుడు నేను చూశాను. అప్పుడు నాలుగు జీవుల్లో ఒక జీవి ఉరుములాంటి స్వరంతో, “రా[a]!” అని చెప్పడం విన్నాను.
  rationale: The revision retains the source text’s sequence, imagery, and ambiguity concerning Ἔρχου, while improving idiomatic Telugu and clarifying the footnote’s reference to a rider. No doctrinal interpretation has been added.
