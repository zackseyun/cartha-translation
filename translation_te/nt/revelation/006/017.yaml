id: REV.6.17
reference: Revelation 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: te
  text: ఎందుకంటే వారి ఆగ్రహపు మహా దినం వచ్చింది[a]; ఎవరు నిలబడగలరు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని వ్యాఖ్యానాత్మక అనువాదాల్లో ‘ఆయన ఆగ్రహం’ అని ఉంటుంది. గ్రీకు పాఠంలో ‘వారి ఆగ్రహం’ అని ఉంది; ఇది సింహాసనంపై కూర్చున్నవానిని, గొర్రెపిల్లను కలిపి సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: మునుపటి వచనంలో చెప్పిన భయానికి కారణాన్ని పరిచయం చేసే సహజమైన ఆధునిక తెలుగు కారణసూచక పదం.
- source_word: ἦλθεν
  choice: వచ్చేసింది
  rationale: సంభవించి, దాని ఫలితం ఇప్పుడు ఎదురుగా ఉందనే గ్రీకు భూతకాల క్రియ బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: మహా దినం
  rationale: అంత్యకాల సంబంధమైన గంభీరతను నిలుపుతూ, గ్రీకు విశేషణ నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῆς ὀργῆς
  choice: ఉగ్రత యొక్క
  rationale: తీర్పు సందర్భంలో ὀργή సాధారణ కోపం కంటే బలమైన, న్యాయతీర్పుతో కూడిన ఆగ్రహాన్ని సూచిస్తుంది; ‘ఉగ్రత’ ఆ బలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: αὐτῶν
  choice: వారి
  rationale: గ్రీకు బహువచన సర్వనామాన్ని యథాతథంగా నిలుపుతుంది; ఇది మునుపటి వచనంలోని సింహాసనంపై కూర్చున్నవానిని, గొర్రెపిల్లను కలిపి సూచిస్తుంది.
- source_word: τίς δύναται σταθῆναι
  choice: ఎవరు నిలబడగలరు?
  rationale: సామర్థ్యాన్ని ప్రశ్నించే గంభీర అలంకార ప్రశ్నను సహజమైన తెలుగులో అందిస్తుంది; తీర్పు ఎదుట తట్టుకొని నిలిచే భావం సందర్భంలో అంతర్లీనంగా ఉంటుంది.
theological_decisions:
- issue: ‘ఉగ్రత’కు సంబంధించిన బహువచన సర్వనామం
  choice: ‘వారి ఉగ్రత’ అని బహువచనాన్ని నిలుపడం
  alternative: ఏకవచన దైవిక కార్యాన్ని ముందుంచి ‘ఆయన ఉగ్రత’ అని అనువదించడం
  rationale: మూల గ్రీకులో αὐτῶν స్పష్టంగా బహువచనం; అది 6:16లోని సింహాసనంపై కూర్చున్నవానిని, గొర్రెపిల్లను సూచిస్తుంది. అందువల్ల వ్యాకరణపరమైన, దైవశాస్త్రపరమైన ఉద్విగ్నతను పరిష్కరించకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటన శైలి. ‘వచ్చేసింది’ ప్రస్తుత ఫలితంతో కూడిన రాకను బలంగా తెలియజేస్తుంది; ‘ఇక’ అలంకార ప్రశ్నకు సహజమైన సందర్భబద్ధ ప్రవాహాన్ని ఇస్తుంది.
