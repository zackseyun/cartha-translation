id: REV.17.12
reference: Revelation 17:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: te
  text: నీవు చూసిన ఆ పది కొమ్ములు పది మంది రాజులు. వారు ఇంకా రాజ్యాన్ని పొందలేదు; అయితే వారు మృగంతో కలిసి రాజులుగా ఒక గంటపాటు[a] అధికారం పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొద్దికాలం.” దర్శన భాషలో “ఒక గంట” అనే మాట స్వల్పమైన, పరిమితమైన కాలాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέρατα
  choice: కొమ్ములు
  rationale: ప్రకటన గ్రంథంలోని దర్శనాత్మక ప్రతీకను యథాతథంగా నిలుపుతుంది; వెంటనే అవి రాజులని వాక్యమే వివరిస్తుంది.
- source_word: βασιλεῖς
  choice: రాజులు
  rationale: పదానికి సహజమైన ప్రాథమిక అర్థం; ప్రతీకాత్మక పాలకులు లేదా అధికార శక్తులు అనే భావాన్ని అనువాదంలో ముందుగానే నిర్ణయించదు.
- source_word: βασιλείαν
  choice: రాజ్యాన్ని
  rationale: రాజ్యాన్ని లేదా పాలనా పరిధిని సూచిస్తూ, తరువాత వచ్చే ἐξουσίαν అనే ‘అధికారం’తో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: οὔπω ἔλαβον
  choice: ఇంకా ... పొందలేదు
  rationale: ఇప్పటివరకు వారికి రాజ్యం లభించలేదనే కాలసంబంధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: పాలించడానికి ప్రసాదించబడిన అధికారాన్ని సూచిస్తుంది; దీనిని ‘రాజ్యం’తో కలిపివేయదు.
- source_word: ὡς βασιλεῖς
  choice: రాజులుగా
  rationale: వారు అధికారాన్ని పొందే హోదా లేదా విధానాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: μίαν ὥραν
  choice: ఒక గంటసేపు
  rationale: మూలంలోని దర్శనాత్మక కాలవ్యక్తీకరణను నిలుపుతుంది; స్వల్పకాలం అనే సాధ్యమైన భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: λαμβάνουσιν
  choice: పొందుతారు
  rationale: గ్రీకు వర్తమాన రూపం దర్శన సందర్భంలో సమీప భవిష్యత్తును సజీవంగా వర్ణిస్తుంది; ఆధునిక తెలుగులో ‘పొందుతారు’ సందర్భానుకూలంగా సహజం.
- source_word: μετὰ τοῦ θηρίου
  choice: మృగంతో పాటు
  rationale: మృగంతో సహవాసం లేదా భాగస్వామ్యాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: θηρίου
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలో స్థిరంగా ఉపయోగించగల, దర్శనాత్మక రూపకాన్ని కాపాడే తెలుగు పదం.
theological_decisions:
- issue: పది మంది రాజులు అక్షరార్థ రాజులా, ప్రతీకాత్మక పాలకులా లేదా అధికార శక్తులా
  choice: మూలంలోని ‘పది మంది రాజులు’ అనే పదప్రయోగాన్ని నిలుపడం
  alternative: పది మంది ప్రతీకాత్మక పాలకులు; పది రాజకీయ శక్తులు
  rationale: గ్రీకు పాఠం వారిని స్పష్టంగా రాజులని అంటుంది; దర్శన సందర్భం ప్రతీకాత్మకతకు అవకాశం ఇస్తుంది. అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: μίαν ὥραν అక్షరార్థంగా ఒక గంటనా, లేక స్వల్పకాలానికి ప్రతీకనా
  choice: ప్రధాన పాఠంలో ‘ఒక గంటసేపు’ అని ఉంచడం
  alternative: కొద్దికాలం; స్వల్పకాలం
  rationale: మూల వ్యక్తీకరణను ప్రధాన పాఠంలో కాపాడుతూ, దర్శనాత్మక సందర్భంలో దాని సాధ్యమైన అలంకారార్థాన్ని పాదసూచికలో సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘కొమ్ములు,’ ‘రాజులు,’ ‘రాజ్యం,’ ‘అధికారం,’ ‘మృగం’ అనే వేర్వేరు మూలపదాల భేదం నిలుపబడింది. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో సంబంధిత కాలవ్యక్తీకరణ వెంట ఉంచబడింది.
