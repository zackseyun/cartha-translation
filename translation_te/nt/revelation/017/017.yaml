id: REV.17.17
reference: Revelation 17:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: te
  text: ఎందుకంటే దేవుడు తన సంకల్పాన్ని నెరవేర్చాలని, ఒకే సంకల్పంతో వ్యవహరించాలని, తమ రాజ్యాన్ని ఆ మృగానికి అప్పగించాలని వారి హృదయాల్లో ఉద్దేశం కలిగించాడు—దేవుని మాటలు నెరవేరే వరకు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి భాగాన్ని ‘దేవుని మాటలు పూర్తయ్యే వరకు’ లేదా ‘సాకారమయ్యే వరకు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: వారి హృదయాల్లో ఆ ఆలోచన కలిగించాడు
  rationale: గ్రీకు నుడికారంలోని అంతరంగ ప్రేరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, దేవుని క్రియాశీల పాత్రను నిలుపుతుంది.
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: తన సంకల్పాన్ని నెరవేర్చడానికి
  rationale: γνώμη ఇక్కడ అభిప్రాయం కంటే ఉద్దేశం లేదా సంకల్పాన్ని సూచిస్తుంది; ποιῆσαιతో కలిసి దానిని కార్యరూపంలో పెట్టడాన్ని తెలియజేస్తుంది.
- source_word: ποιῆσαι μίαν γνώμην
  choice: ఒకే సంకల్పంతో వ్యవహరించడానికి
  rationale: పదశః ఉన్న ‘ఒక సంకల్పాన్ని చేయడం’ అనే సంక్షిప్త గ్రీకు భావాన్ని, రాజుల ఏకీకృత ఉద్దేశం మరియు చర్య రెండింటినీ తెలియజేసే సహజ తెలుగులో అందిస్తుంది.
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: తమ రాజ్యాన్ని ... అప్పగించడానికి
  rationale: δοῦναι యొక్క ‘ఇవ్వడం’ భావాన్ని అధికార బదలాయింపు సందర్భానికి తగిన ‘అప్పగించడం’గా అందిస్తుంది; ఏకవచనమైన βασιλείαను ‘రాజ్యం’గా నిలుపుతుంది.
- source_word: τῷ θηρίῳ
  choice: ఆ మృగానికి
  rationale: ప్రకటన గ్రంథంలోని ప్రతీకాత్మక θηρίονకు స్థిరమైన, సహజమైన తెలుగు పదం ‘మృగం’; నిర్దిష్ట సూచనను ‘ఆ’ తెలియజేస్తుంది.
- source_word: ἄχρι τελεσθήσονται οἱ λόγοι τοῦ θεοῦ
  choice: దేవుని మాటలు నెరవేరే వరకు
  rationale: భవిష్యత్ కర్మణి రూపం ప్రవచనాత్మక మాటలు పూర్తిగా సాకారం కావడాన్ని సూచిస్తుంది; ‘నెరవేరు’ తెలుగు బైబిలు శైలిలో సహజంగా ఉంది.
theological_decisions:
- issue: రాజుల చర్యల్లో దేవుని సార్వభౌమత్వం మరియు మానవ కార్యసాధకత్వం
  choice: దేవుడు వారి హృదయాల్లో ఆ ఆలోచన కలిగించాడనీ, వారే ఏక సంకల్పంతో రాజ్యాన్ని మృగానికి అప్పగించారనీ రెండింటినీ స్పష్టంగా ఉంచడం
  alternative: దేవుడు కేవలం అనుమతించాడని బలహీనపరచడం, లేదా గ్రీకు వాక్యాన్ని మించి నిర్ణయవాద భావాన్ని చేర్చడం
  rationale: మూలపాఠం దేవుని కారణక క్రియను, పాలకుల నిజమైన చర్యను పక్కపక్కనే ఉంచుతుంది; అనువాదం ఆ వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా సంరక్షిస్తుంది.
- issue: αὐτοῦ అనే సర్వనామం సూచించే వ్యక్తి
  choice: ‘తన సంకల్పం’ ద్వారా దేవునినే సూచించడం
  alternative: రాజుల లేదా మృగం యొక్క సంకల్పంగా అర్థం చేసుకోవడం
  rationale: వాక్యంలోని కర్త ὁ θεός; సమీప వ్యాకరణ నిర్మాణం మరియు సందర్భం αὐτοῦను దేవునికి సంబంధించినదిగా సూచిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని మూడు సమాంతర infinitive క్రియల భావాన్ని వరుసగా ‘నెరవేర్చడానికి… వ్యవహరించడానికి… అప్పగించడానికి’ అని నిలుపుకుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
