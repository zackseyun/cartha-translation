id: REV.17.8
reference: Revelation 17:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: te
  text: నువ్వు చూసిన మృగం ఒకప్పుడు ఉండేది, ఇప్పుడు లేదు. అది అగాధం నుండి పైకి రాబోతుంది, నాశనానికి పోతుంది. ప్రపంచపు పునాది వేయబడినప్పటి నుండి జీవగ్రంథంలో ఎవరి పేరు రాయబడలేదో, భూమిమీద నివసించే వారు ఆ మృగాన్ని చూసి ఆశ్చర్యపోతారు; ఎందుకంటే అది ఒకప్పుడు ఉండేది, ఇప్పుడు లేదు, ప్రత్యక్షమవుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది ఒకప్పుడు ఉండేది, ఇప్పుడు లేదు, ప్రత్యక్షమవుతుందని ఆ మృగాన్ని చూసి ఆశ్చర్యపోతారు.” గ్రీకు పదాన్ని ఇక్కడ ‘ఎందుకంటే’ అనే కారణార్థంలోనూ, ‘అని’ అనే విషయార్థంలోనూ తీసుకోవచ్చు. చివరి క్రియకు ‘వస్తుంది’ లేదా ‘ఉంటుంది’ అనే భావాలు కూడా సాధ్యమే.
    reason: alternative_reading
lexical_decisions:
- source_word: θηρίον
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలోని ప్రతీకాత్మకమైన, భయంకరమైన జీవిని సూచించే స్థిరమైన అపోకలిప్టిక్ పదంగా ‘మృగం’ సహజంగా సరిపోతుంది.
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: ఒకప్పుడు ఉండేది, ఇప్పుడు లేదు
  rationale: గ్రీకు వాక్యంలోని కాలవ్యతిరేకతను స్పష్టంగా ఉంచుతూ, దానికి అదనపు సిద్ధాంతార్థాన్ని జోడించదు.
- source_word: μέλλει ἀναβαίνειν
  choice: పైకి రాబోతుంది
  rationale: μέλλει తెలిపే సమీప భవిష్యత్తును, ἀναβαίνειν తెలిపే పైకి కదలికను సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: ἄβυσσος
  choice: అగాధం
  rationale: ‘అంతులేని గొయ్యి’ వంటి వివరణాత్మక విస్తరణ లేకుండా అపోకలిప్టిక్ భావాన్ని కాపాడుతుంది.
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: నాశనానికి పోతుంది
  rationale: అంతిమ వినాశం వైపు వెళ్లడాన్ని సరళంగా, మూలంలోని గమన భావంతో వ్యక్తం చేస్తుంది.
- source_word: θαυμασθήσονται
  choice: ఆశ్చర్యపోతారు
  rationale: సందర్భంలోని విస్మయాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: భూమిమీద నివసించే వారు
  rationale: ప్రకటన గ్రంథంలో పునరావృతమయ్యే వర్గసూచక పదబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: ఎవరి పేరు రాయబడలేదో
  rationale: మూలంలోని ఏకవచన ‘పేరు’ను తెలుగులో సహజమైన పంపిణీ నిర్మాణంతో నిలుపుతుంది.
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: జీవగ్రంథంలో
  rationale: పేరును గ్రంథంలో నమోదు చేయడం అనే తెలుగు నుడికారానికి అనుగుణంగా ఉంది; ἐπίని యాంత్రికంగా ‘మీద’ అని అనువదించదు.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: లోకం స్థాపించబడినప్పటి నుండి
  rationale: కాలసూచనను మరియు ‘స్థాపన’ భావాన్ని స్పష్టంగా ఉంచే సహజమైన తెలుగు రూపం.
- source_word: βλεπόντων
  choice: చూసి
  rationale: వారు ఆశ్చర్యపడటానికి ఆ మృగాన్ని చూడటమే సందర్భమని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὅτι ἦν καὶ οὐκ ἔστιν καὶ παρέσται
  choice: ఎందుకంటే అది ఒకప్పుడు ఉండేది, ఇప్పుడు లేదు, అయినా వచ్చి ఉంటుంది
  rationale: ὅτιని కారణార్థకంగా తీసుకుంటూ, παρέσταιలోని రాక మరియు భవిష్యత్ సన్నిధి భావాలను ‘వచ్చి ఉంటుంది’ ద్వారా సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: ‘లోకం స్థాపించబడినప్పటి నుండి’ అనే కాలపదబంధం దేనితో సంబంధించింది
  choice: జీవగ్రంథంలో పేరు రాయబడకపోవడంతో అనుసంధానించబడింది.
  alternative: దీనిని ఇతర సమీప భావాలతో లేదా విస్తృతమైన సిద్ధాంత వ్యవస్థతో అనుసంధానించడం.
  rationale: ఈ వాక్యంలో గ్రీకు పదక్రమం ఈ కాలపదబంధాన్ని పేరు రాయబడటానికి నేరుగా అనుసంధానిస్తుంది; అనువాదం అంతకుమించిన పూర్వనిర్ణయ సిద్ధాంతాన్ని చేర్చదు.
- issue: παρέσται యొక్క భావం
  choice: వచ్చి ఉంటుంది
  alternative: వస్తుంది; ప్రత్యక్షమవుతుంది; ఉండబోతుంది
  rationale: పదం రాక లేదా చేరికతో కూడిన భవిష్యత్ సన్నిధిని సూచించగలదు. ఎంచుకున్న రూపం ‘లేదు’ అనే వర్తమాన స్థితితో దాని వ్యతిరేకతను నిలుపుతూ, పునరుత్థానం వంటి భావాన్ని స్పష్టంగా చేర్చదు.
- issue: ὅτι యొక్క వాక్యసంబంధం
  choice: కారణార్థకంగా ‘ఎందుకంటే’
  alternative: విషయార్థకంగా ‘అది ... అని’
  rationale: వారు ఎందుకు ఆశ్చర్యపడతారో తెలిపే కారణార్థం సందర్భంలో సహజంగా ఉంది; అయితే గ్రీకులో విషయార్థక పఠనం కూడా సాధ్యమని పాదటిప్పణిలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ప్రకటన గ్రంథపు సంకేతభాషను కాపాడేందుకు ‘మృగం,’ ‘అగాధం,’ ‘జీవగ్రంథం’ వంటి స్థిర పదాలు ఉంచబడ్డాయి. మూలంలోని కాలవ్యతిరేకతను స్పష్టంగా చూపేందుకు ‘ఒకప్పుడు’ మరియు ‘ఇప్పుడు’ చేర్చబడ్డాయి; ఇవి భావాన్ని వివరించేవే గాని అదనపు సిద్ధాంత వ్యాఖ్యానం కావు.
