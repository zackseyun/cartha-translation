revisions:
- from: నువ్వు చూసిన మృగం ఒకప్పుడు ఉండేది, ఇప్పుడు లేదు. అది అగాధం నుండి పైకి రాబోతుంది, నాశనానికి పోతుంది. లోకం స్థాపించబడినప్పటి నుండి జీవగ్రంథంలో ఎవరి పేరు రాయబడలేదో, భూమిమీద నివసించే వారు ఆ మృగాన్ని చూసి ఆశ్చర్యపోతారు; ఎందుకంటే అది ఒకప్పుడు ఉండేది, ఇప్పుడు లేదు, అయినా వచ్చి ఉంటుంది.[a]
  to: నువ్వు చూసిన మృగం ఒకప్పుడు ఉండేది, ఇప్పుడు లేదు. అది అగాధం నుండి పైకి రాబోతుంది, నాశనానికి పోతుంది. ప్రపంచపు పునాది వేయబడినప్పటి నుండి జీవగ్రంథంలో ఎవరి పేరు రాయబడలేదో, భూమిమీద నివసించే వారు ఆ మృగాన్ని చూసి ఆశ్చర్యపోతారు; ఎందుకంటే అది ఒకప్పుడు ఉండేది, ఇప్పుడు లేదు, ప్రత్యక్షమవుతుంది.[a]
  rationale: The revision corrects the final future verb to an idiomatic Telugu expression that conveys future appearance/presence without the future-perfect or concessive implications of “అయినా వచ్చి ఉంటుంది.” It also renders “from the foundation of the world” with the source image of a foundation being laid. The causal reading of ὅτι remains in the text, while the viable content reading and lexical alternatives are retained in the footnote.
