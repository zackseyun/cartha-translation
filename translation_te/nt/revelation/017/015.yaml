id: REV.17.15
reference: Revelation 17:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: te
  text: 'అతడు నాతో ఇలా చెప్పాడు: “నువ్వు చూసిన, ఆ వేశ్య కూర్చున్న జలాలు ప్రజలూ జనసమూహాలూ దేశాలూ భాషలూ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕδατα
  choice: జలాలు
  rationale: ప్రకటన గ్రంథంలోని ప్రతీకాత్మక దృశ్యభాషను నిలుపుతూ, ఆధునిక తెలుగులో గంభీరమైన సహజ పదాన్ని ఎంచుకున్నాం.
- source_word: ἡ πόρνη
  choice: ఆ వేశ్య
  rationale: గ్రీకు పదంలోని స్పష్టమైన, కఠినమైన ప్రతీకను మృదువుచేయకుండా నేరుగా అనువదించాం.
- source_word: λαοὶ καὶ ὄχλοι
  choice: ప్రజలను, జనసమూహాలను
  rationale: λαοί మరియు ὄχλοι మధ్య ఉన్న స్వల్ప భేదాన్ని వరుసగా ‘ప్రజలు’, ‘జనసమూహాలు’గా నిలిపాం.
- source_word: ἔθνη καὶ γλῶσσαι
  choice: దేశాలను, భాషలను
  rationale: ἔθνηకి సందర్భానుకూలంగా ‘దేశాలు’, γλῶσσαιకి జనభాషలను సూచించే ‘భాషలు’ వాడాం.
- source_word: εἰσὶν
  choice: సూచిస్తున్నాయి
  rationale: ప్రతీకకు ఇచ్చిన వివరణను సహజ తెలుగులో స్పష్టం చేస్తుంది; అక్షరార్థమైన ‘అవి ... ఉన్నాయి’ కంటే ఈ సందర్భంలో భావాన్ని సరిగ్గా అందిస్తుంది.
theological_decisions:
- issue: జలాలు మరియు మానవ సమూహాల మధ్య ప్రతీకాత్మక సమీకరణ
  choice: ‘సూచిస్తున్నాయి’ అని అనువదించడం
  alternative: ‘అవి ప్రజలు...’
  rationale: దూత దర్శనంలోని ప్రతీకను వివరిస్తున్నాడనే సందర్భాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘నువ్వు’ ఏకవచన సంభాషణను సహజంగా ఉంచుతుంది. మూలంలోని వరుస జాబితా మరియు ప్రతీకాత్మక ఉద్వేగం పరిరక్షించబడ్డాయి.
