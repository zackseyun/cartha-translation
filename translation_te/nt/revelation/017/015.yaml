revisions:
- from: 'ఆ దూత నాతో ఇలా అన్నాడు: “నువ్వు చూసిన జలాలు—అంటే ఆ వేశ్య కూర్చున్న చోట ఉన్నవి—ప్రజలను, జనసమూహాలను, దేశాలను, భాషలను సూచిస్తున్నాయి.”'
  to: 'అతడు నాతో ఇలా చెప్పాడు: “నువ్వు చూసిన, ఆ వేశ్య కూర్చున్న జలాలు ప్రజలూ జనసమూహాలూ దేశాలూ భాషలూ.”'
  rationale: The revision removes the added identification of the speaker, restores the source’s relative-clause image without adding “place,” and keeps the direct symbolic equation. It preserves the Greek sequence of peoples, crowds, nations, and languages in idiomatic Telugu.
