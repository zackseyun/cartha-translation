review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the inscriptional structure, the passive-resultative sense of γεγραμμένον, and the viable treatment of μυστήριον as part of the written name. However, βδελυγμάτων is broader than ‘హేయకార్యాలు’ (‘detestable acts’); it denotes detestable/abominable things and should not be limited to actions.
  naturalness: The Telugu is clear and appropriately solemn. ‘వేశ్యలకు ... తల్లి’ is a natural Telugu expression for ‘mother of prostitutes,’ even though Telugu uses the dative form with this kinship construction. ‘హేయమైన వాటికి’ is more natural and semantically accurate here than the compound ‘హేయకార్యాలకు.’
  terminology: ‘మర్మం,’ ‘మహా బబులోను,’ and ‘వేశ్యలు’ are suitable modern-standard Telugu choices. Revising ‘హేయకార్యాలు’ to ‘హేయమైనవి’ preserves the biblical/apocalyptic breadth of ‘abominations’ without importing a narrower interpretation.
  issues:
  - severity: medium
    issue: ‘హేయకార్యాలకు’ narrows βδελυγμάτων to actions.
    rationale: The Greek βδελύγματα can include idolatrous objects, practices, and other detestable things; ‘కార్యాలు’ specifies deeds only. ‘హేయమైన వాటికి’ retains the source term’s breadth.
  revised_text: 'ఆమె నుదుటిపై ఒక పేరు రాసి ఉంది: “మర్మం[a], మహా బబులోను, భూమిలోని వేశ్యలకూ హేయమైన వాటికీ తల్లి.”'
  revised_footnotes:
  - marker: a
    text: 'లేదా, “ఆమె నుదుటిపై ఒక పేరు—ఒక మర్మం—రాసి ఉంది: ‘మహా బబులోను, భూమిలోని వేశ్యలకూ హేయమైన వాటికీ తల్లి.’” ఈ పఠనంలో “మర్మం” అనేది లిఖిత నామంలో భాగం కాకుండా, ఆ పేరు సూచించే సంకేతార్థాన్ని పరిచయం చేస్తుంది.'
