revisions:
- from: 'ఆమె నుదుటిపై ఒక పేరు రాసి ఉంది: “మర్మం[a], మహా బబులోను, భూమిలోని వేశ్యలకు, హేయకార్యాలకు తల్లి.”'
  to: 'ఆమె నుదుటిపై ఒక పేరు రాసి ఉంది: “మర్మం[a], మహా బబులోను, భూమిలోని వేశ్యలకూ హేయమైన వాటికీ తల్లి.”'
  rationale: Only the rendering of βδελυγμάτων has been adjusted. ‘హేయమైన వాటికి’ faithfully covers the full semantic range of ‘abominations,’ while retaining the source’s appositional title and its ambiguity concerning whether μυστήριον belongs to the inscription.
  reviewer_model: gpt-5.6-terra
