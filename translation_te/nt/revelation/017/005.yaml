id: REV.17.5
reference: Revelation 17:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: te
  text: 'ఆమె నుదుటిపై ఒక పేరు రాసి ఉంది: “మర్మం[a], మహా బబులోను, భూమిలోని వేశ్యలకూ హేయమైన వాటికీ తల్లి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “ఆమె నుదుటిపై ఒక పేరు—ఒక మర్మం—రాసి ఉంది: ‘మహా బబులోను, భూమిలోని వేశ్యలకూ హేయమైన వాటికీ తల్లి.’” ఈ పఠనంలో “మర్మం” అనేది లిఖిత నామంలో భాగం కాకుండా, ఆ పేరు సూచించే సంకేతార్థాన్ని పరిచయం చేస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: ఆమె నుదుటిపై
  rationale: ἐπίతో కూడిన ఈ స్థలవాచక ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, నుదుటిపై ఉన్న లిఖితపు దృశ్యాన్ని నిలుపుతుంది.
- source_word: ὄνομα γεγραμμένον
  choice: ఒక పేరు రాసి ఉంది
  rationale: γεγραμμένονలోని కర్మణి, ఫలితస్థితి భావాలను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: μυστήριον
  choice: మర్మం
  rationale: అపోకలిప్టిక్ సందర్భంలోని దాగిన సంకేతార్థాన్ని సూచించే గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే పదం. ప్రధాన పాఠంలో ఇది లిఖిత నామంలో భాగంగా ఉంచబడింది.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: మహా బబులోను
  rationale: Βαβυλώνను సంప్రదాయ తెలుగు రూపమైన ‘బబులోను’గా లిప్యంతరీకరించి, ἡ μεγάληను సహజమైన బిరుదుగా ‘మహా’ అని ఇచ్చింది.
- source_word: ἡ μήτηρ
  choice: తల్లి
  rationale: తరువాతి రెండు సంబంధపదబంధాలకు వర్తించే బిరుదు/సమానాధికరణ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τῶν πορνῶν
  choice: వేశ్యలకు
  rationale: πόρνη యొక్క ప్రత్యక్ష అర్థాన్ని ఆధునిక, గౌరవప్రదమైన కానీ దాని నైతిక-లైంగిక చిత్రాన్ని మృదువుపరచని తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τῶν βδελυγμάτων
  choice: హేయకార్యాలకు
  rationale: βδέλυγμα సూచించే నైతికంగా లేదా విగ్రహారాధనాపరంగా అసహ్యమైన వాటిని సహజ తెలుగులో తెలియజేస్తుంది; ‘కార్యాలు’ సందర్భంలోని దుష్ప్రవర్తన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: τῆς γῆς
  choice: భూమిలోని
  rationale: ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త సందర్భంలో γῆకి ‘భూమి’ తగినది; ఈ పదబంధం వేశ్యలు, హేయకార్యాలు రెండింటికీ వర్తించేలా నిర్మాణం చేయబడింది.
theological_decisions:
- issue: μυστήριον లిఖిత నామంలో భాగమా, లేక తరువాతి పేరుకు సంకేతార్థాన్ని పరిచయం చేసే కథనపదమా?
  choice: 'ప్రధాన పాఠంలో దాన్ని లిఖిత నామంలో భాగంగా: “మర్మం, మహా బబులోను...” అని ఇచ్చాం.'
  alternative: '“ఒక పేరు—ఒక మర్మం—రాసి ఉంది: మహా బబులోను...” అని తీసుకొని, ‘మర్మం’ తరువాతి పేరులోని సంకేతార్థాన్ని పరిచయం చేస్తుందని అర్థం చేసుకోవచ్చు.'
  rationale: గ్రీకు మూలంలో విరామచిహ్నాలు ఈ సంబంధాన్ని తేల్చవు. పదక్రమం μυστήριονను పేరులో భాగంగా తీసుకోవడానికి అనుకూలించినా, ప్రత్యామ్నాయ విశ్లేషణ కూడా సాధ్యమే; అందువల్ల దాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రకటనాత్మక శైలిని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం వాడబడింది. మూలంలోని సమానాధికరణ శ్రేణిని ఉద్ధరణ చిహ్నాలు, విరామచిహ్నాలతో స్పష్టంచేశాం.
