id: REV.17.3
reference: Revelation 17:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: te
  text: అతడు నన్ను ఆత్మలో[a] ఒక అరణ్యానికి తీసుకెళ్లాడు. అప్పుడు దైవదూషణకరమైన పేర్లతో నిండిన కెంపురంగు మృగం మీద కూర్చున్న ఒక స్త్రీని చూశాను. ఆ మృగానికి ఏడు తలలు, పది కొమ్ములు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆత్మీయ స్థితిలో.” ఈ గ్రీకు పదబంధం ఒక ఆధ్యాత్మిక స్థితినిగానీ, ఆత్మ ద్వారా తీసుకెళ్లబడడాన్నిగానీ సూచించవచ్చు; ప్రకటన గ్రంథంలో ఇది సాధారణంగా దర్శనానుభవాన్ని పరిచయం చేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: తీసుకెళ్లాడు
  rationale: దర్శనానుభవంలో ఒక ప్రదేశం నుండి మరొక ప్రదేశానికి తరలించబడడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς ἔρημον
  choice: ఒక అరణ్యానికి
  rationale: ἔρημος అనేది ఎడారి, అరణ్యం లేదా నిర్జన ప్రదేశాన్ని సూచించగలదు. నిర్దిష్ట ఉపపదం లేని గ్రీకు రూపాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘ఒక అరణ్యానికి’ అని అనువదించాం.
- source_word: ἐν πνεύματι
  choice: ఆత్మలో
  rationale: ప్రకటన గ్రంథంలో ఈ పదబంధం సాధారణంగా ప్రవచనాత్మక దర్శన స్థితిని పరిచయం చేస్తుంది. ఇది పరిశుద్ధాత్మ కార్యాన్ని సూచించే అవకాశం ఉన్నప్పటికీ, గ్రీకులోని భావసందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: γυναῖκα
  choice: ఒక స్త్రీ
  rationale: εἶδον అనే క్రియకు ప్రత్యక్ష కర్మగా ఉన్న పదానికి సహజమైన తెలుగు సమానం.
- source_word: καθημένην ἐπὶ
  choice: మీద ... కూర్చుని ఉండడం
  rationale: మృగం పైన స్త్రీ ఉన్న స్థానాన్ని, కొనసాగుతున్న దృశ్యాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θηρίον
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ ప్రతీకను స్థిరంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: κόκκινον
  choice: కెంపు రంగు
  rationale: κόκκινος సూచించే గాఢమైన ప్రకాశవంతమైన ఎరుపు లేదా స్కార్లెట్ రంగుకు సహజమైన తెలుగు పదబంధం.
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: దైవదూషణ పేర్లతో నిండివున్న
  rationale: γέμοντα అనే ‘నిండివున్న’ భావాన్ని, βλασφημίας అనే దైవాన్ని అవమానించే లక్షణాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: ἔχων
  choice: ఆ మృగానికి ... ఉన్నాయి
  rationale: తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో మృగానికి చెందిన లక్షణాలుగా ఏడు తలలు, పది కొమ్ములను తెలియజేస్తుంది.
- source_word: κεφαλὰς ἑπτὰ
  choice: ఏడు తలలు
  rationale: అపోకలిప్టిక్ చిత్రణను యథాతథంగా నిలిపే ప్రత్యక్ష అనువాదం.
- source_word: κέρατα δέκα
  choice: పది కొమ్ములు
  rationale: మూలంలోని ప్రామాణిక అపోకలిప్టిక్ చిత్రణను యథాతథంగా నిలిపే ప్రత్యక్ష అనువాదం.
theological_decisions:
- issue: ἐν πνεύματι యొక్క అర్థం
  choice: ‘ఆత్మలో’—ఆత్మ కార్యం ద్వారా కలిగిన ప్రవచనాత్మక దర్శనానుభవాన్ని సూచించే పఠనం
  alternative: ‘ఆత్మావేశంలో’ లేదా ‘ఆత్మపరంగా’—ఒక ఆధ్యాత్మిక స్థితిని సూచించే పఠనం
  rationale: ప్రకటన గ్రంథంలో ఈ పదబంధం దర్శనానుభవాన్ని పరిచయం చేస్తుంది. పరిశుద్ధాత్మ కార్యం ప్రధాన సంభావ్యత అయినప్పటికీ, గ్రీకు వచనం కేవలం అంతర్గత ఆధ్యాత్మిక స్థితి అనే భావాన్నీ అనుమతిస్తుంది; అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. అపోకలిప్టిక్ చిత్రణలోని ‘మృగం,’ ‘ఏడు తలలు,’ ‘పది కొమ్ములు’ వంటి ప్రధాన పదాలను వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలిపాం.
