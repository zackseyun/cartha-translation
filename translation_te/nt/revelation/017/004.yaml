id: REV.17.4
reference: Revelation 17:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: te
  text: ఆ స్త్రీ ఊదా, స్కార్లెట్ రంగుల వస్త్రాలు ధరించి ఉంది. ఆమె బంగారంతో, విలువైన రత్నాలతో, ముత్యాలతో అలంకరించబడి ఉంది. ఆమె చేతిలో అసహ్యకరమైన వాటితోను, ఆమె లైంగిక దుర్నీతికి[a] సంబంధించిన అపవిత్రమైన వాటితోను నిండిన బంగారు పాత్ర ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “లైంగిక దుర్నీతి” అనే పదాన్ని “వ్యభిచారం” లేదా “వేశ్యావృత్తి” అని కూడా అనువదించవచ్చు. ప్రకటన గ్రంథంలో ఈ గ్రీకు పదం అక్షరార్థంగానూ రూపకార్థంగానూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένη
  choice: వస్త్రాలు ధరించి ఉంది
  rationale: ἦνతో కూడిన పరిపూర్ణ కృదంతం ఆమె అలాంటి వస్త్రధారణలో ఉన్న స్థితిని తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజంగా, ఫలితస్థితిని నిలుపుతుంది.
- source_word: πορφυροῦν καὶ κόκκινον
  choice: ఊదారంగు, ఎర్రని వస్త్రాలు
  rationale: రంగులను నేరుగా ఉంచుతూ, గ్రీకులో సూచితమైన వస్త్ర భావాన్ని తెలుగులో స్పష్టం చేస్తుంది. κόκκινονకు ఇక్కడ ప్రకాశవంతమైన ఎరుపు భావం ఉంది.
- source_word: κεχρυσωμένη
  choice: అలంకరించుకొని ఉంది
  rationale: బంగారం మొదలైన వాటితో వైభవంగా అలంకరించబడిన స్థితిని సహజ తెలుగులో వ్యక్తం చేస్తుంది; బంగారం పూత మాత్రమే అని కుదించదు.
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: బంగారంతో, విలువైన రత్నంతో, ముత్యాలతో
  rationale: మూలంలోని సంఖ్యను గౌరవిస్తూ λίθῳ τιμίῳను ఏకవచనంగా ఉంచి, అలంకరణ సామగ్రి జాబితాను నిలుపుతుంది.
- source_word: ποτήριον χρυσοῦν
  choice: బంగారు పాత్ర
  rationale: ποτήριον అనేది తాగే పాత్రను సూచిస్తుంది; 'పాత్ర' ఆధునిక తెలుగులో సహజంగా ఉండి దాని ఖచ్చిత ఆకారాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: βδελυγμάτων
  choice: అసహ్యమైన వాటితో
  rationale: దేవునికి హేయమైన, నైతికంగా లేదా ఆరాధనాపరంగా జుగుప్సాకరమైన వాటనే బలమైన భావాన్ని సులభమైన తెలుగులో అందిస్తుంది.
- source_word: τὰ ἀκάθαρτα
  choice: అపవిత్రమైన వాటితో
  rationale: నపుంసక బహువచన నామవాచక ప్రయోగాన్ని ప్రతిబింబిస్తూ, ఆచారపరమైన మరియు నైతిక అపవిత్రత రెండింటికీ వీలు కల్పిస్తుంది.
- source_word: πορνείας
  choice: లైంగిక దుర్నీతి
  rationale: πορνεία యొక్క విస్తృత లైంగిక భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది; ప్రకటన గ్రంథంలోని రూపకాలంకార భావాన్ని కూడా నిరాకరించదు.
theological_decisions:
- issue: ప్రకటన గ్రంథంలోని ప్రతీకాత్మక సందర్భంలో πορνείαను ఎలా అనువదించాలి
  choice: లైంగిక దుర్నీతి
  alternative: వ్యభిచారం; వేశ్యావృత్తి
  rationale: ఈ పదం అక్షరార్థ లైంగిక దుర్నీతినీ, విగ్రహారాధనతో కూడిన ఆధ్యాత్మిక అవిశ్వాసానికి సంబంధించిన రూపకాలంకారాన్నీ మోసే అవకాశం ఉంది. 'లైంగిక దుర్నీతి' పదాన్ని అతిగా సంకుచితం చేయకుండా ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: λίθῳ τιμίῳ యొక్క వ్యాకరణ సంఖ్య
  choice: విలువైన రత్నంతో
  alternative: విలువైన రత్నాలతో
  rationale: గ్రీకు పాఠంలో ఇది ఏకవచనంలో ఉంది. సమూహార్థం సాధ్యమైనప్పటికీ, ప్రచురణ పాఠంలో మూల సంఖ్యను నిలుపడం నిజమైన రూపభేదాన్ని మౌనంగా సరిచేయకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అపోకలిప్టిక్ దృశ్యంలోని గంభీరతను నిలుపుతూ రూపొందించబడింది. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం. పాదసూచిక గుర్తు సంబంధిత పదబంధం తరువాత ఉంచబడింది.
