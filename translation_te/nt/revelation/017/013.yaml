id: REV.17.13
reference: Revelation 17:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: te
  text: వీరు ఒకే ఉద్దేశంతో ఉన్నారు[a]; తమ శక్తినీ అధికారాన్నీ ఆ మృగానికి ఇస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకే మనస్సు కలిగి ఉన్నారు.” గ్రీకు నుడికారం అక్షరార్థంగా వారు “ఒకే మనస్సు కలిగి ఉన్నారు” అని చెబుతుంది; అది ఉమ్మడి సంకల్పాన్ని లేదా ఉద్దేశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: వీరు
  rationale: ముందు ప్రస్తావించిన పది మంది రాజులను సూచించే నిర్దేశక సర్వనామాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: μίαν γνώμην ἔχουσιν
  choice: ఒకే ఉద్దేశంతో ఉన్నారు
  rationale: γνώμη ఇక్కడ అభిప్రాయం, సంకల్పం, ఉద్దేశం అనే భావాలను కలిగి ఉండగలదు; సందర్భంలోని ఉమ్మడి రాజకీయ సంకల్పాన్ని సహజంగా తెలియజేస్తూ, ప్రత్యామ్నాయ నుడికారాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: δύναμιν
  choice: శక్తి
  rationale: కార్యసాధక బలం లేదా సామర్థ్యాన్ని సూచిస్తుంది; ἐξουσία నుండి భావభేదాన్ని కాపాడుతుంది.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: పాలించే హక్కు లేదా అధికృత అధికారాన్ని సూచించి, శక్తి అనే భావంతో కలిపివేయకుండా ఉంచుతుంది.
- source_word: τῷ θηρίῳ
  choice: ఆ మృగానికి
  rationale: ప్రకటన గ్రంథంలోని ఇప్పటికే గుర్తించబడిన అపోకలిప్టిక్ రూపాన్ని తెలుగు నిర్దేశక ప్రయోగంతో స్పష్టంగా సూచిస్తుంది.
- source_word: διδόασιν
  choice: ఇస్తారు
  rationale: గ్రీకు వర్తమాన కాల క్రియను దర్శనాత్మక వర్ణనలో సహజమైన తెలుగు వర్తమాన రూపంతో నేరుగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: μίαν γνώμην ἔχουσιν అనే నుడికారంలోని భావవిస్తృతి
  choice: ఒకే ఉద్దేశంతో ఉన్నారు
  alternative: ఒకే మనస్సు కలిగి ఉన్నారు
  rationale: సందర్భంలో వారి ఏకీకృత సంకల్పం లేదా లక్ష్యం ప్రధానంగా కనిపిస్తుంది. అయితే గ్రీకు వాక్యం అభిప్రాయం, సంకల్పం, ఉద్దేశం మధ్య విస్తృతిని కలిగి ఉన్నందున అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: δύναμις మరియు ἐξουσία మధ్య భేదం
  choice: శక్తి మరియు అధికారం
  alternative: బలం మరియు పాలనాధికారం
  rationale: కార్యసాధక శక్తి, పాలించే అధికారం అనే సంబంధితమైనా వేర్వేరు భావాలను రెండు పదాలతో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘శక్తి’ మరియు ‘అధికారం’ అనే రెండు భావాలను వేరుగా నిలిపి, మూలంలోని ఉమ్మడి సంకల్ప నుడికారానికి పాదటిప్పణి ద్వారా విస్తృతిని కాపాడింది.
