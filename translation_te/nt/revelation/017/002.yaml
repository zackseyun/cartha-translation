id: REV.17.2
reference: Revelation 17:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: te
  text: ఆమెతో భూమి రాజులు లైంగిక అవినీతికి పాల్పడ్డారు[a]; భూమిపై నివసించేవారు ఆమె లైంగిక అవినీతి ద్రాక్షారసం వల్ల మత్తెక్కారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘లైంగిక అవినీతి’ అనే మాట అవినీతికరమైన, విగ్రహారాధనతో కూడిన లేదా నమ్మకద్రోహమైన కూటమిని ప్రతీకాత్మకంగా సూచించే అవకాశం ఉంది; అయితే లైంగిక రూపకపు బలం అలాగే ఉంటుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘ఆమె వ్యభిచారపు ద్రాక్షారసం వల్ల మత్తెక్కారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: ఆమెతో
  rationale: మునుపటి వచనంలోని స్త్రీనే సంబంధసర్వనామం సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘ఆమెతో’ అని అనువదించబడింది.
- source_word: ἐπόρνευσαν
  choice: లైంగిక అవినీతికి పాల్పడ్డారు
  rationale: లైంగిక రూపకాన్ని నిలుపుతూ, ప్రకటన గ్రంథంలో ఉండే విగ్రహారాధనాత్మక లేదా రాజకీయ అవిశ్వాసం అనే ప్రతీకాత్మక భావాన్ని ప్రధాన పాఠ్యంలోనే పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: భూమి రాజులు
  rationale: ప్రకటన గ్రంథంలో పునరావృతమయ్యే, ప్రపంచవ్యాప్త భావంగల పదబంధాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: ἐμεθύσθησαν
  choice: మత్తెక్కారు
  rationale: గ్రీకు నిష్క్రియారూపం సూచించే ఫలితస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: భూమిపై నివసించేవారు
  rationale: ప్రకటన గ్రంథంలోని స్థిర పదబంధానికి సహజమైన తెలుగు రూపం; ‘నివసించు’ అనే క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ἐκ τοῦ οἴνου
  choice: ద్రాక్షారసం తాగి
  rationale: ἐκ సూచించే మూలం లేదా కారణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, మత్తు కలిగించే పానీయపు రూపకాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τῆς πορνείας αὐτῆς
  choice: ఆమె లైంగిక అవినీతి అనే
  rationale: సంబంధిత క్రియతో పదసామ్యాన్ని నిలుపుతూ, ద్రాక్షారసం ప్రతీక ఆమె లైంగిక అవినీతిని సూచిస్తుందని తెలుగు వాక్యనిర్మాణంలో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: πορνεύω/πορνείαను విగ్రహారాధన లేదా రాజకీయ-మత అవిశ్వాసంగా ప్రధాన పాఠ్యంలోనే వివరించాలా
  choice: లైంగిక అవినీతి అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: విగ్రహారాధనతో కూడిన కూటమి లేదా ఆధ్యాత్మిక వ్యభిచారం అని నేరుగా అర్థవివరణ చేయడం
  rationale: ప్రకటన గ్రంథం లైంగిక భాష ద్వారా మతపరమైన, రాజకీయ అవినీతిని ప్రతీకాత్మకంగా చిత్రిస్తుంది. దాన్ని ఒకే వివరణకు కుదించకుండా అసలు రూపకంలోని బలాన్ని, ఉద్దేశపూర్వక ఉద్వేగాన్ని కాపాడటం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘లైంగిక అవినీతి’ రూపకాన్ని నిలిపి, దాని ప్రతీకాత్మక అర్థాన్ని పాదటిప్పణిలో సూచించాం.
