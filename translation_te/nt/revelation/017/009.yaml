source:
  edition: SBLGNT
  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: te
  text: 'జ్ఞానం గల మనస్సుతో ఆలోచించవలసిన సంగతి ఇదే: ఆ ఏడు తలలు, ఆ స్త్రీ వాటిమీద కూర్చున్న ఏడు పర్వతాలు; మరియు అవి ఏడుగురు రాజులు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὧδε
  choice: ఇక్కడ ... అవసరం
  rationale: ఇది తరువాత వచ్చే సంకేత వివరణకు ప్రవేశవాక్యం. తెలుగులో సహజంగా ఉండేందుకు ‘ఇక్కడ’ అనే సూచనార్థాన్ని నిలిపి, సందర్భంలో వివేచన అవసరమనే భావాన్ని వ్యక్తం చేసింది.
- source_word: ὁ νοῦς ὁ ἔχων σοφίαν
  choice: జ్ఞానం గల మనస్సు
  rationale: νοῦς‌ను ‘మనస్సు’గా, σοφίαను ‘జ్ఞానం’గా నేరుగా ప్రతిబింబిస్తూ, సంకేతాన్ని గ్రహించడానికి కావలసిన వివేచన భావాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించలేదు.
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: ఆ ఏడు తలలు
  rationale: సంకేత పదాన్ని దాని అర్థాన్ని ముందుగానే నిర్ధారించకుండా యథాతథంగా ఉంచింది.
- source_word: ἑπτὰ ὄρη
  choice: ఏడు పర్వతాలు
  rationale: ὄρηకు నేరమైన సాధారణ అర్థం ‘పర్వతాలు’; రోముతో సంబంధం సూచించే ‘కొండలు’ అనే అర్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా పెట్టకుండా పాదసూచికలో ఇచ్చింది.
- source_word: ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν
  choice: ఆ స్త్రీ కూర్చున్న
  rationale: గ్రీకు వాక్యంలోని స్థలసంబంధ భావాన్ని తెలుగులో సహజమైన సంబంధవాచక నిర్మాణంతో వ్యక్తం చేసింది; ‘వాటి మీద’ అన్న భావం ‘పర్వతాలు’తో సహజంగా అంతర్భూతమవుతుంది.
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: అవి ఏడుగురు రాజులు కూడా
  rationale: అవ్యక్త కర్తను ముందున్న ‘ఏడు తలలు’తో అనుసంధానించి, అవే రాజులని తెలిపే సంకేత సమానీకరణను స్పష్టంగా ఉంచింది. వ్యక్తులకు సహజమైన ‘ఏడుగురు’ వాడింది.
theological_decisions:
- issue: ఏడు తలల సంకేతాత్మక గుర్తింపు
  choice: వాటిని ఏడు పర్వతాలు మరియు ఏడుగురు రాజులుగా వచనం చెప్పిన మేరకే అనువదించడం
  alternative: ఏడు పర్వతాలను రోము నగరపు ఏడు కొండలుగా, లేదా రాజులను నిర్దిష్ట చక్రవర్తులు/రాజ్యాలుగా గుర్తించడం
  rationale: ఈ వచనం సంకేత సంబంధాలను తెలియజేస్తుంది గాని వాటి నిర్దిష్ట చారిత్రక సూచనను తేల్చదు. అందువల్ల అనువాదం ఆ వ్యాఖ్యాన భేదాన్ని పరిష్కరించకుండా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. సంకేత పదాలకు వ్యాఖ్యానాత్మక చారిత్రక గుర్తింపులు జోడించలేదు.
