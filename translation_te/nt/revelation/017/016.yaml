review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the collective force of “the ten horns … and the beast—these,” the future actions, and the apocalyptic imagery. However, “నిర్జనంగా చేస్తారు” is not idiomatic for the personified female object in modern Telugu and weakly conveys the ruin/devastation denoted by ἠρημωμένην ποιήσουσιν.
  naturalness: The wording is generally clear and suitably grave. Replacing “నిర్జనంగా చేస్తారు” with “పాడుబెట్టి” gives a more natural Telugu expression for laying her waste while retaining the personified imagery.
  terminology: “కొమ్ములు,” “మృగం,” “వేశ్య,” “నగ్నంగా,” “మాంసం,” and “అగ్నితో పూర్తిగా కాల్చివేస్తారు” are appropriate modern-standard Telugu equivalents. The footnotes correctly retain the lexical and symbolic dimensions without resolving the imagery into a particular interpretation.
  issues:
  - severity: low
    issue: “నిర్జనంగా చేస్తారు” is awkward with “ఆమెను.”
    rationale: Although it reflects “make desolate” formally, “నిర్జనంగా” normally describes an uninhabited place. “పాడుబెట్టి” naturally expresses causing devastation and fits the verse’s personified city imagery without specifying its referent.
  revised_text: నీవు చూసిన ఆ పది కొమ్ములూ, ఆ మృగమూ—వీరు ఆ వేశ్యను ద్వేషిస్తారు; ఆమెను పాడుబెట్టి నగ్నంగా[a] చేస్తారు; ఆమె మాంసాన్ని తింటారు[b]; ఆమెను అగ్నితో పూర్తిగా కాల్చివేస్తారు.
