id: REV.17.16
reference: Revelation 17:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: te
  text: నీవు చూసిన ఆ పది కొమ్ములూ, ఆ మృగమూ—వీరు ఆ వేశ్యను ద్వేషిస్తారు; ఆమెను పాడుబెట్టి నగ్నంగా[a] చేస్తారు; ఆమె మాంసాన్ని తింటారు[b]; ఆమెను అగ్నితో పూర్తిగా కాల్చివేస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బట్టలు తీసివేసి బహిర్గతం చేస్తారు.” గ్రీకులో అక్షరార్థంగా “నగ్నంగా” ఉంది; ఇక్కడ అది బహిరంగ అవమానాన్నీ పూర్తిగా బట్టబయలు చేయడాన్నీ సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “మాంసం” అనేది అక్షరార్థ పదమే; ప్రకటన గ్రంథంలోని సూచక దృశ్యంలో ఈ మాట సంపూర్ణమైన హింసాత్మక నాశనాన్ని చిత్రిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: కొమ్ములు
  rationale: వాటి భావార్థమైన రాజులు లేదా అధికారాలు అని మార్చకుండా, గ్రీకు మూలంలోని ప్రకటన గ్రంథ సూచక చిత్రాన్ని యథాతథంగా నిలిపింది.
- source_word: θηρίον
  choice: మృగం
  rationale: భయానకమైన ప్రకటన గ్రంథ సూచక భావాన్ని కాపాడే సహజమైన తెలుగు పదం.
- source_word: πόρνην
  choice: వేశ్య
  rationale: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, నేరుగా సరిపడే పదం; మూలంలోని సూచక రూపకాన్ని వ్యాఖ్యానించి మార్చదు.
- source_word: μισήσουσι
  choice: ద్వేషిస్తారు
  rationale: భవిష్యత్ క్రియను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἠρημωμένην ποιήσουσιν
  choice: నిర్జనంగా చేస్తారు
  rationale: ఒక వ్యక్తి రూపంలో చూపబడిన నగరాన్ని లేదా వ్యవస్థను సూచించగల ద్వంద్వ చిత్రాన్ని కాపాడుతూ, పాడుబడిన స్థితికి చేర్చడమనే ఫలితార్థాన్ని నిలిపింది.
- source_word: γυμνήν
  choice: నగ్నంగా
  rationale: గ్రీకు విశేషణానికి నేరమైన సమానం; బహిరంగ అవమానం అనే అంతర్భావాన్ని ప్రధాన పాఠ్యంలో విస్తరించకుండా పాదటిప్పణిలో తెలిపింది.
- source_word: σάρκας
  choice: మాంసాన్ని
  rationale: భయంకరమైన ప్రకటన గ్రంథ దృశ్యాన్ని మెత్తబరచకుండా, బహువచన గ్రీకు రూపాన్ని తెలుగులో సహజ సమూహార్థ ఏకవచనంగా అందించింది.
- source_word: φάγονται
  choice: తింటారు
  rationale: ‘మింగివేస్తారు’ వంటి శైలీకృత విస్తరణకు బదులు మూల క్రియకు నేరమైన అర్థాన్ని నిలిపింది.
- source_word: κατακαύσουσιν ἐν πυρί
  choice: అగ్నితో పూర్తిగా కాల్చివేస్తారు
  rationale: κατακαίω లోని సంపూర్ణంగా కాల్చివేయడమనే బలాన్ని ‘పూర్తిగా’ ద్వారా, ἐν πυρί సాధనార్థాన్ని ‘అగ్నితో’ ద్వారా వ్యక్తం చేసింది.
- source_word: οὗτοι
  choice: వీరు
  rationale: ముందున్న పది కొమ్ములు మరియు మృగాన్ని బహువచనంగా తిరిగి సూచించే, ఉద్ఘాటనగల గ్రీకు సర్వనామాన్ని నిలిపింది.
theological_decisions:
- issue: ‘పది కొమ్ములు ... మృగం’ అనే మిశ్రమ కర్తను బహువచన క్రియలు తిరిగి సూచించడం
  choice: ‘ఆ పది కొమ్ములూ, ఆ మృగమూ—వీరు ...’ అని సమష్టి కర్తను ఉద్ఘాటనగల బహువచన సర్వనామంతో కొనసాగించడం
  alternative: ‘పది కొమ్ములు, మృగం ... ద్వేషిస్తాయి’ అని వాక్య నిర్మాణాన్ని పూర్తిగా సాఫీ చేయడం
  rationale: గ్రీకులోని οὗτοι అనే ఉద్ఘాటనగల పుంలింగ బహువచన సర్వనామం, తరువాతి బహువచన క్రియలు ఈ మిత్ర శక్తులను కలిసి పనిచేసే కర్తలుగా చూపుతాయి; తెలుగు ‘వీరు’ ఆ వ్యక్తీకరణను సహజంగా నిలుపుతుంది.
- issue: వేశ్య నాశనానికి సంబంధించిన ప్రకటన గ్రంథ రూపకాల స్వభావం
  choice: వేశ్య, నగ్నత, మాంసం తినడం, అగ్నితో కాల్చడం అనే రూపక చిత్రాలను ప్రధాన పాఠ్యంలో అలాగే ఉంచడం
  alternative: వేశ్యను నేరుగా ఒక నగరం లేదా వ్యవస్థగా అనువదించి, హింసాత్మక చిత్రాన్ని వివరణాత్మకంగా మార్చడం
  rationale: మూల వాక్యం సూచక తీర్పు దృశ్యాన్ని ఇస్తుంది; అనువాదం దాని అర్థాన్ని ఒక ప్రత్యేక వ్యాఖ్యానంగా పరిష్కరించకుండా ఆ ఉద్రిక్తతను కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘నిర్జనంగా’ అనే తీర్పు భాష వ్యక్తి-నగరం అనే ఉద్దేశపూర్వక రూపక ద్వంద్వాన్ని కాపాడుతుంది. సెమికోలన్లు వరుసగా జరిగే హింసాత్మక చర్యలను స్పష్టంగా వేరు చేస్తాయి; అన్ని పాదటిప్పణి గుర్తులు వాటికి సంబంధించిన పదాల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
