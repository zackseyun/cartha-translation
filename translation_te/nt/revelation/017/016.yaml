- from: నీవు చూసిన ఆ పది కొమ్ములూ, ఆ మృగమూ—వీరు ఆ వేశ్యను ద్వేషిస్తారు. ఆమెను నిర్జనంగా, నగ్నంగా[a] చేస్తారు; ఆమె మాంసాన్ని తింటారు[b]; ఆమెను అగ్నితో పూర్తిగా కాల్చివేస్తారు.
