id: REV.17.14
reference: Revelation 17:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: te
  text: వీరు గొర్రెపిల్లతో యుద్ధం చేస్తారు[a]. అయితే గొర్రెపిల్ల వారిని జయిస్తుంది; ఎందుకంటే ఆయన ప్రభువులకు ప్రభువు, రాజులకు రాజు. ఆయనతో ఉన్నవారు పిలువబడినవారు, ఎన్నుకోబడినవారు, నమ్మకమైనవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, ‘గొర్రెపిల్లతో యుద్ధం చేస్తారు’; ఇక్కడ దాని భావం ఆయనకు వ్యతిరేకంగా యుద్ధం చేయడం.
    reason: μετά + షష్ఠీ విభక్తి సాధారణంగా ‘తో’ అని అర్థమిచ్చినా, πολεμέωతో కూడిన ఈ యుద్ధ సందర్భంలో ప్రత్యర్థిత్వాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: οὗτοι
  choice: వీరు
  rationale: ముందటి సందర్భంలోని రాజులను సూచించే నిర్దేశక సర్వనామ బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: μετὰ τοῦ ἀρνίου πολεμήσουσιν
  choice: గొర్రెపిల్లతో యుద్ధం చేస్తారు
  rationale: πολεμέωతో వచ్చిన μετά + షష్ఠీ విభక్తి యుద్ధ ప్రత్యర్థిని సూచిస్తుంది. తెలుగు ‘తో యుద్ధం చేయడం’ సహజంగానే ‘వ్యతిరేకంగా యుద్ధం చేయడం’ అనే అర్థాన్ని ఇస్తూ, గ్రీకు నిర్మాణాన్ని కూడా దగ్గరగా నిలుపుతుంది.
- source_word: ἀρνίον
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలోని ప్రత్యేక క్రీస్తు బిరుదును స్పష్టంగా, స్థిరంగా వ్యక్తపరుస్తుంది.
- source_word: νικήσει
  choice: జయిస్తుంది
  rationale: యుద్ధ సందర్భంలో విజయాన్ని తెలిపే νικάωకు సహజమైన తెలుగు సమానం; ప్రకటన గ్రంథంలోని పునరావృత విజయ ఇతివృత్తాన్ని నిలుపుతుంది.
- source_word: κύριος κυρίων
  choice: ప్రభువులకు ప్రభువు
  rationale: అత్యున్నత అధికారాన్ని తెలిపే గ్రీకు ఘనతా నిర్మాణాన్ని తెలుగులో సంప్రదాయబద్ధంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: βασιλεὺς βασιλέων
  choice: రాజులకు రాజు
  rationale: సర్వోన్నత రాజాధికారాన్ని తెలిపే సమాంతర బిరుదును సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί
  choice: పిలువబడినవారు, ఎన్నుకోబడినవారు, నమ్మకమైనవారు
  rationale: మూడు వేర్వేరు విశేషణాలనూ విడిగా కాపాడుతుంది; ‘నమ్మకమైనవారు’ πιστοίలోని విశ్వసనీయత, స్థిరనిష్ఠ భావాలకు తగిన విస్తృతిని ఇస్తుంది.
theological_decisions:
- issue: గొర్రెపిల్ల యొక్క బిరుదు మరియు విజయ భాష
  choice: ‘గొర్రెపిల్ల’ మరియు ‘జయిస్తుంది’ అని అనువదించడం
  alternative: ‘గొర్రెపిల్ల ... గెలుస్తుంది’ లేదా ‘విజయం పొందుతుంది’
  rationale: ప్రకటన గ్రంథంలోని ప్రత్యేక క్రీస్తు బిరుదును, νικάω అనే ముఖ్య ఇతివృత్త పదాన్ని నిలుపుతూ, మూలపాఠానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
- issue: κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί అనే త్రయం
  choice: ‘పిలువబడినవారు, ఎన్నుకోబడినవారు, నమ్మకమైనవారు’ అని మూడు వర్ణనలనూ సమాంతరంగా ఉంచడం
  alternative: ‘పిలిచినవారు, ఎన్నికైనవారు, విశ్వాసులు’
  rationale: పిలుపు లేదా ఎన్నిక స్వభావంపై ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థనూ రుద్దకుండా, మూలంలోని మూడు గుర్తింపులను మరియు వాటి మధ్య ఉన్న theological tensionను కాపాడుతుంది.
- issue: καὶ οἱ μετ’ αὐτοῦ అనే చివరి ఖండం యొక్క వాక్య సంబంధం
  choice: ‘ఆయనతో ఉన్నవారు పిలువబడినవారు, ఎన్నుకోబడినవారు, నమ్మకమైనవారు’ అని స్వతంత్ర వాక్యంగా ఇవ్వడం
  alternative: ‘ఆయనతో ఉన్న పిలువబడినవారు, ఎన్నుకోబడినవారు, నమ్మకమైనవారు కూడా జయిస్తారు’
  rationale: గ్రీకులో చివరి ఖండంలో స్పష్టమైన క్రియ లేదు. ‘కూడా జయిస్తారు’ అని చేర్చడం భావ్యమైన అన్వయమే అయినా, అది మూలంలో లేని క్రియను స్పష్టీకరిస్తుంది. అందువల్ల సహచరుల గుర్తింపును మాత్రమే నేరుగా తెలిపి నిజమైన వాక్యనిర్మాణ సంక్షిప్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన అపోకలిప్టిక్ శైలిని ఉంచాం. ‘వీరు’ ద్వారా మూలంలోని నిర్దేశకతను, ‘అయితే’ ద్వారా ప్రతికూల మలుపును సహజంగా చూపించాం. బిరుదుల సమాంతర నిర్మాణాన్ని కాపాడి, చివరి మూడు విశేషణాలను సిద్ధాంతపరంగా అతివ్యాఖ్యానించలేదు.
