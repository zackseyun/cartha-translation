source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: te
  text: ఆ స్త్రీ పరిశుద్ధుల రక్తంతో, యేసు సాక్షుల[a] రక్తంతో మత్తెక్కి ఉండడాన్ని నేను చూశాను. ఆమెను చూసినప్పుడు నేను ఎంతో ఆశ్చర్యపోయాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు హతసాక్షులు.” గ్రీకు పదానికి ‘సాక్షులు’ లేదా ‘హతసాక్షులు’ అనే అర్థాలు రావచ్చు; ఇక్కడ వారి రక్తం ప్రస్తావించబడటం వల్ల ‘హతసాక్షులు’ అనే భావం ప్రత్యేకంగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθύουσαν
  choice: మత్తెక్కి ఉండడం
  rationale: ఈ వర్తమాన కృదంతం స్త్రీ ఉన్న స్థితిని వర్ణిస్తుంది. రక్తపాతం వల్ల కలిగిన మత్తు అనే దిగ్భ్రాంతికరమైన రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐκ τοῦ αἵματος
  choice: రక్తంతో
  rationale: ἐκ అక్షరార్థంగా ‘నుండి/వల్ల’ అనే భావం ఇచ్చినా, μεθύωతో కలిసి ఇక్కడ మత్తుకు కారణమైన లేదా సాధనమైన రక్తాన్ని సూచిస్తుంది; తెలుగులో ‘రక్తంతో మత్తెక్కి’ సహజంగా ఉంటుంది.
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధులు
  rationale: ప్రకటన గ్రంథంలో ఈ పదం దేవునికి ప్రత్యేకించబడిన ఆయన ప్రజలను సూచిస్తుంది. ‘పరిశుద్ధులు’ సంక్షిప్తంగా, గౌరవప్రదంగా, స్థిరమైన బైబిలు వాడుకకు అనుగుణంగా ఉంది.
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: యేసు సాక్షులు
  rationale: μάρτυς అనే పదానికి ‘సాక్షి’ అనే మూలార్థమూ, ప్రాణత్యాగం చేసిన ‘హతసాక్షి’ అనే సందర్భార్థమూ ఉన్నాయి. రక్తప్రస్తావన హతసాక్షి భావాన్ని బలంగా సూచించినా, ప్రధాన పాఠంలో ‘సాక్షులు’ ఉంచడం పదంలోని మూలార్థాన్ని, Ἰησοῦ అనే సంబంధవిభక్తిలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: ἐθαύμασα
  choice: నేను ఎంతో ఆశ్చర్యపోయాను
  rationale: θαυμάζω ఇక్కడ తీవ్రమైన విస్మయాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం సాధారణ పాఠకులకు సహజంగా ఉండి, సందర్భంలో సమ్మతి లేదా ప్రశంసను అనవసరంగా సూచించదు.
- source_word: ἰδὼν αὐτὴν
  choice: ఆమెను చూసినప్పుడు
  rationale: అనంతరకాల కృదంతాన్ని తెలుగులో కాలసంబంధ ఉపవాక్యంగా అనువదించడం సహజం; ఇది ఆమెను చూడడానికీ ఆశ్చర్యపడడానికీ ఉన్న సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: θαῦμα μέγα
  choice: ఎంతో
  rationale: ఒకే మూలానికి చెందిన నామవాచకంతో క్రియను బలపరిచే గ్రీకు నిర్మాణాన్ని తెలుగులో తీవ్రతను తెలిపే క్రియావిశేషణంగా సహజంగా అందిస్తుంది.
theological_decisions:
- issue: హింసా సందర్భంలో μάρτυρες పదార్థం
  choice: ప్రధాన పాఠంలో ‘సాక్షులు’; ప్రత్యామ్నాయంగా ‘హతసాక్షులు’ పాదసూచికలో
  alternative: యేసు హతసాక్షులు
  rationale: రక్తం ప్రస్తావించబడటం వల్ల ప్రాణత్యాగం చేసినవారనే భావం స్పష్టంగా సందర్భంలో ఉంది. అయినా μάρτυς పదంలోని ‘సాక్షి’ అనే మూలార్థం ప్రకటన గ్రంథంలోని సాక్ష్యమనే అంశంతో కూడా ముడిపడి ఉంది; అందువల్ల ఒక భావాన్ని పూర్తిగా తొలగించకుండా రెండింటినీ నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘రక్తంతో మత్తెక్కి’ అనే రూపకం మెత్తబడకుండా ఉంచబడింది. ‘యేసు సాక్షులు’ అనే సంక్షిప్త నిర్మాణం మూలంలోని సంబంధవిభక్తి భావాన్ని అతిగా నిర్ధారించకుండా కాపాడుతుంది.
