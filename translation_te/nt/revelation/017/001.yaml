id: REV.17.1
reference: Revelation 17:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: te
  text: 'అప్పుడు ఆ ఏడు పాత్రలను పట్టుకున్న ఏడుగురు దేవదూతల్లో ఒకడు వచ్చి నాతో మాట్లాడి ఇలా చెప్పాడు: “రా, అనేక జలాల మీద కూర్చున్న ఆ మహా వేశ్యకు జరిగే తీర్పును[a] నీకు చూపిస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దోషనిర్ణయాన్ని” లేదా “శిక్షను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి ఘట్టాన్ని సహజమైన తెలుగులో సూచిస్తూ గ్రీకు సంధానార్థాన్ని నిలుపుతుంది.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: ఆ ఏడు పాత్రలను పట్టుకున్న
  rationale: ἔχω అనే క్రియలోని కలిగియుండడం/పట్టుకొనియుండడం భావాన్ని దృశ్యానికి తగిన సహజ తెలుగులో వ్యక్తం చేస్తుంది; φιάλας ను ‘పాత్రలు’గా అనువదించడం ప్రకటన గ్రంథంలోని బింబానికి సరిపోతుంది.
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: నాతో ఇలా అన్నాడు
  rationale: μετά సహిత సంభాషణ భావాన్ని ‘నాతో’ నిలుపుతూ, తెలుగులో అనవసర పునరుక్తి లేకుండా సహజంగా పలుకును పరిచయం చేస్తుంది.
- source_word: Δεῦρο
  choice: రా
  rationale: ప్రత్యక్షమైన, సంక్షిప్తమైన పిలుపు; గ్రీకు ఆహ్వాన/ఆజ్ఞార్థ బలాన్ని కాపాడుతుంది.
- source_word: δείξω σοι
  choice: నీకు చూపిస్తాను
  rationale: భవిష్యత్ సూచక క్రియను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ κρίμα
  choice: తీర్పు
  rationale: న్యాయనిర్ణయం, దోషనిర్ధారణ, దాని శిక్షాత్మక ఫలితం అనే విస్తృత భావాన్ని ముందుగానే ఒక్క అర్థానికి పరిమితం చేయదు.
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: ఆ మహా వేశ్య
  rationale: πόρνη యొక్క బలమైన ప్రవచనాత్మక రూపకాన్ని ఆధునిక, గౌరవప్రదమైనప్పటికీ స్పష్టమైన తెలుగులో నిలుపుతుంది.
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: అనేక జలాల మీద కూర్చున్న
  rationale: ἐπί మరియు καθημένης యొక్క దృశ్యరూపాన్ని నేరుగా కాపాడుతుంది; తరువాత వచ్చే సంకేతార్థ వివరణను ముందుగానే అనువాదంలో చేర్చదు.
theological_decisions:
- issue: బబులోనును సూచించే πόρνη అనే రూపకం
  choice: మహా వేశ్య
  alternative: మహా వ్యభిచారిణి
  rationale: ‘వేశ్య’ మూలపదపు ప్రత్యక్ష అర్థాన్నీ ప్రవచనాత్మక లైంగిక రూపకాన్నీ నిలుపుతుంది; బబులోను ఎవరో అనే నిర్దిష్ట మతపరమైన వ్యాఖ్యానాన్ని రుద్దదు.
- issue: అంత్యకాల దర్శన సందర్భంలో κρίμα అర్థం
  choice: తీర్పు
  alternative: దోషనిర్ణయం; శిక్ష
  rationale: గ్రీకు పదం న్యాయపరమైన నిర్ణయాన్నీ దాని శిక్షాత్మక అమలునూ సూచించగలదు. ‘తీర్పు’ ఈ ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజ వాక్యనిర్మాణం, అయితే ప్రకటన గ్రంథంలోని గంభీరమైన దర్శనభాష మరియు రూపకబలం నిలుపబడ్డాయి. ‘నాతో ఇలా అన్నాడు’ అనేది గ్రీకు నిర్మాణాన్ని తెలుగులో సహజంగా సంక్షిప్తం చేస్తుంది.
