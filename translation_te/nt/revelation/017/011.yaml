id: REV.17.11
reference: Revelation 17:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: te
  text: ఉండినదీ లేనిదీ అయిన ఆ మృగం తానే ఎనిమిదవది[a]; అది ఆ ఏడింటి నుంచిది[b], నాశనానికి వెళ్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ మృగం తానే ఎనిమిదవ రాజు.’ సందర్భాన్ని బట్టి ‘రాజు’ అనే నామవాచకం అంతర్లీనంగా ఉంది; అయితే గ్రీకు పాఠంలో అది ఇక్కడ స్పష్టంగా లేదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఆ ఏడింటిలో ఒకటి.’ గ్రీకులో మరింత అక్షరార్థంగా ‘ఆ ఏడింటి నుండి’ అని ఉంది; ఇది మూలాన్ని, వాటిలో సభ్యత్వాన్ని, లేదా వాటితో సన్నిహిత సంబంధాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ ప్రతీకాత్మక శక్తిని నిలుపుతూ, దేవునికి విరోధమైన భయంకర అధికారాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: ఉండినదీ ఇప్పుడు లేనిదీ అయిన
  rationale: గ్రీకులోని ఉద్దేశపూర్వకమైన విరుద్ధ సమాంతరతను నిలుపుతుంది; ‘ఇప్పుడు’ తెలుగులో వర్తమాన అర్థాన్ని స్పష్టం చేస్తుంది గాని ఆ మృగం ఇక ఎన్నటికీ ఉండదని నిర్ధారించదు.
- source_word: αὐτὸς
  choice: తానే
  rationale: కర్తపై ఉన్న గ్రీకు ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὄγδοός
  choice: ఎనిమిదవది
  rationale: గ్రీకులో నామవాచకం స్పష్టంగా లేకపోవడంతో ‘రాజు’ అని ప్రధాన పాఠంలో చేర్చకుండా, సందర్భం సూచించే వర్గాన్ని అంతర్లీనంగానే ఉంచుతుంది.
- source_word: ἐκ τῶν ἑπτά
  choice: ఆ ఏడింటి నుండి వచ్చినది
  rationale: ἐκ అనే పూర్వప్రత్యయం తెలిపే మూలం లేదా సంబంధాన్ని ప్రతిబింబిస్తుంది; అది ఏడింటిలో ఒకటే అని ప్రధాన పాఠంలో ఖచ్చితంగా నిర్ణయించదు.
- source_word: εἰς ἀπώλειαν
  choice: నాశనానికి
  rationale: అంతిమ వినాశం లేదా దుర్గతిని స్పష్టమైన, గంభీరమైన ఆధునిక తెలుగు పదంతో తెలియజేస్తుంది.
- source_word: ὑπάγει
  choice: వెళ్తుంది
  rationale: గ్రీకు వర్తమాన కాలపు సూటితనాన్ని, చలన భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ὄγδοόςతో అంతర్లీనంగా ఉన్న నామవాచకాన్ని ‘రాజు’ అని పేర్కొనాలా?
  choice: ప్రధాన పాఠంలో ‘ఎనిమిదవది’ అని మాత్రమే ఉంచడం.
  alternative: ‘ఎనిమిదవ రాజు’ అని అనువదించడం.
  rationale: సమీప సందర్భంలో రాజుల ప్రస్తావన ఉన్నప్పటికీ ఈ వాక్యంలో βασιλεύς లేదు. అందువల్ల మూలపాఠపు సంక్షిప్తతను, ప్రతీకాత్మక అనిశ్చితిని నిలుపుతూ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తున్నాం.
- issue: ἐκ τῶν ἑπτάను ‘ఏడింటిలో ఒకటి’ అని నిర్దిష్టంగా అనువదించాలా?
  choice: ‘ఆ ఏడింటి నుండి వచ్చినది’ అని ఉంచడం.
  alternative: ‘ఆ ఏడింటిలో ఒకటి’ అని అనువదించడం.
  rationale: ఈ పదబంధం మూలాన్ని, సభ్యత్వాన్ని, లేదా సన్నిహిత సంబంధాన్ని సూచించవచ్చు. ఒకే గుర్తింపును బలవంతంగా నిర్ణయించకుండా గ్రీకు పదబంధంలోని భావ విస్తృతిని నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ‘ఉండినదీ ఇప్పుడు లేనిదీ’ అనే నిర్మాణం మూలంలోని ఉద్దేశపూర్వక విరోధాభాసాన్ని నిలుపుతుంది; ‘తానే’ ఉద్ఘాటనను తెలియజేస్తుంది.
