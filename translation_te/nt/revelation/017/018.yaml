source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: te
  text: నీవు చూసిన ఆ స్త్రీ భూమి రాజులపై రాజ్యాధికారం కలిగివున్న ఆ మహానగరమే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భూమి రాజులపై రాజ్యం కలిగివున్నది.’ గ్రీకు పదబంధం అక్షరార్థంగా ‘రాజ్యం కలిగివున్న’ అని చెబుతుంది; అది రాజరిక పాలన లేదా రాజ్యాధికారం కలిగి ఉండడమని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: స్త్రీ
  rationale: దర్శనంలో కనిపించిన ప్రతీకాత్మక స్త్రీని సూచిస్తున్నందున, సందర్భానికి సహజమైన మరియు వ్యాఖ్యానభారం లేని అనువాదం.
- source_word: ἣν εἶδες
  choice: నీవు చూసిన
  rationale: ముందు దర్శనంలో యోహాను చూసిన వ్యక్తిని నేరుగా గుర్తించే సంబంధవాచక వాక్యభాగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πόλις ἡ μεγάλη
  choice: ఆ మహానగరం
  rationale: πόλις మరియు దాని విశేషణాన్ని సూటిగా అందిస్తూ, ముందు పేర్కొన్న నిర్దిష్ట ప్రతీకాత్మక నగరాన్ని సూచిస్తుంది.
- source_word: ἔχουσα βασιλείαν
  choice: రాజ్యాధికారం కలిగివున్న
  rationale: అక్షరార్థంగా ‘రాజ్యం/రాజరికం కలిగివున్న’ అనే భావం. ఇక్కడ భౌగోళిక రాజ్యాన్ని కలిగి ఉండడం కంటే రాజులపై పాలనా అధికారం కలిగి ఉండడమే ప్రధాన భావం.
- source_word: βασιλεία
  choice: రాజ్యాధికారం
  rationale: ‘రాజ్యం,’ ‘రాజరికం,’ ‘పాలన’ అనే అర్థసాధ్యతలను కొంతవరకు నిలుపుతూ, తరువాత వచ్చే ‘రాజులపై’ అనే పదబంధానికి తగిన సార్వభౌమ పాలనా భావాన్ని ఇస్తుంది.
- source_word: ἐπὶ τῶν βασιλέων
  choice: రాజులపై
  rationale: ఇక్కడ ἐπί అధికారాన్ని లేదా ఆధిపత్యాన్ని సూచిస్తుంది; ‘రాజులపై’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῆς γῆς
  choice: భూరాజుల
  rationale: ‘భూమికి చెందిన రాజులు’ అనే విస్తృత ప్రకటనసంబంధ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; ఒక నిర్దిష్ట దేశానికి పరిమితం చేయదు.
theological_decisions:
- issue: స్త్రీకి మహానగరానికి మధ్య ఉన్న గుర్తింపు స్వరూపం
  choice: ‘ఆ స్త్రీ ... ఆ మహానగరం’ అని ప్రత్యక్ష ప్రతీకాత్మక గుర్తింపుగా అనువదించడం.
  alternative: ‘ఆ స్త్రీ మహానగరానికి ప్రతీక’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: గ్రీకు పాఠంలో సాధారణ సంధాన క్రియ ἔστιν (‘అది/ఉంది’) ఉంది. ‘ప్రతీక’ అని విప్పిచెప్పకుండా ప్రత్యక్ష గుర్తింపును ఉంచడం మూలంలోని అపోకలిప్టిక్ ప్రతీకాత్మక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘రాజ్యాధికారం’ మూలంలోని βασιλεία పదానికి ఉన్న రాజ్యం/రాజరిక పాలన భావాలను సమతుల్యంగా నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
