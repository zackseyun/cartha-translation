id: REV.17.7
reference: Revelation 17:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: te
  text: 'అప్పుడు ఆ దూత నాతో ఇలా అన్నాడు: “నీవెందుకు ఆశ్చర్యపడ్డావు? ఆ స్త్రీ గురించీ, ఆమెను మోస్తున్న[a], ఏడు తలలూ పది కొమ్ములూ ఉన్న ఆ మృగం గురించీ ఉన్న మర్మాన్ని నేను నీకు చెబుతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమెను భరిస్తున్న.’
    reason: βαστάζοντος కు ‘మోస్తున్న’ ప్రధాన అనువాదం; ‘భరిస్తున్న’ కూడా సందర్భానికి సాధ్యమైన పదకోశ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἐθαύμασας
  choice: ఆశ్చర్యపడ్డావు
  rationale: ఈ క్రియ విస్మయం లేదా దిగ్భ్రాంతిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆశ్చర్యపడ్డావు’ సహజంగా ఉండి, కేవలం ఆసక్తితో ఆలోచించడం అనే భావానికి పరిమితం కాదు.
- source_word: μυστήριον
  choice: మర్మం
  rationale: ఇక్కడ ఇది కేవలం చిక్కుప్రశ్నను కాక, దాచబడి ఇప్పుడు వెల్లడించబడే వాస్తవాన్ని సూచిస్తుంది. ‘మర్మం’ ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: γυναικός
  choice: స్త్రీ
  rationale: తక్షణ సందర్భంలో వివాహ సంబంధం ఉద్దేశించబడలేదు; దర్శనంలోని ప్రతీకాత్మక వ్యక్తికి ‘స్త్రీ’ సరైన పదం.
- source_word: θηρίου
  choice: మృగం
  rationale: ప్రకటన గ్రంథమంతటా కొనసాగే శత్రుత్వపూరితమైన అపోకలిప్టిక్ రూపాన్ని ‘మృగం’ నిలుపుతుంది.
- source_word: βαστάζοντος
  choice: మోస్తున్న
  rationale: βαστάζω యొక్క మోయడం/భరించడం అనే దృశ్యార్థాన్ని ‘మోస్తున్న’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔχοντος
  choice: ఉన్న
  rationale: ఈ కృదంతం మృగాన్నే వర్ణిస్తుంది. ‘ఏడు తలలు, పది కొమ్ములు ఉన్న’ అనే నిర్మాణం తెలుగులో సహజంగా ఆ సంబంధాన్ని చూపుతుంది.
- source_word: κεφαλάς
  choice: తలలు
  rationale: దర్శనంలోని శరీర సంబంధ ప్రతీకాత్మక చిత్రాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: κέρατα
  choice: కొమ్ములు
  rationale: అపోకలిప్టిక్ సాహిత్యంలో ఉన్న ప్రతీకాత్మక చిత్రాన్ని అక్షరార్థ పదంతో నిలుపుతుంది.
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: ప్రశ్నార్థక పదబంధానికి సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: ἐρῶ σοι
  choice: నేను నీకు చెబుతాను
  rationale: దూత తరువాత వెల్లడించబోయే వివరణను నేరుగా పరిచయం చేసే సహజమైన భవిష్యత్‌కాల రూపం.
theological_decisions:
- issue: ‘ఏడు తలలు, పది కొమ్ములు ఉన్న’ అనే వర్ణన దేనికి వర్తిస్తుంది?
  choice: ఈ వర్ణనను మృగానికే స్పష్టంగా అనుసంధానించడం.
  alternative: వాక్య నిర్మాణాన్ని మరింత సడలించి, అది స్త్రీకా లేక మొత్తం మర్మానికా వర్తిస్తుందనే అస్పష్టతను ఉంచడం.
  rationale: τοῦ βαστάζοντος, τοῦ ἔχοντος అనే షష్ఠీ విభక్తి ఏకవచన కృదంతాలు θηρίου తో వ్యాకరణపరంగా సరిపోతాయి; γυναικός తో కావు. అందువల్ల గ్రీకు మూలంలోని స్పష్టతను తెలుగులోనూ చూపాలి.
- issue: ‘మర్మం’ అనే ఏకవచనం స్త్రీ మరియు మృగం రెండింటితో ఉన్న సంబంధం
  choice: ‘ఆ స్త్రీ గురించిన మర్మాన్ని, ... ఆ మృగం గురించిన మర్మాన్ని’ అని సమన్వయార్థాన్ని స్పష్టం చేయడం.
  alternative: ‘స్త్రీ యొక్క మరియు మృగం యొక్క మర్మం’ అనే మూల నిర్మాణానికి దగ్గరైన కానీ తెలుగులో కఠినమైన రూపం.
  rationale: గ్రీకులో ఒకే μυστήριον రెండు షష్ఠీ పదబంధాలకు సంబంధించినది. తెలుగులో పదాన్ని రెండుసార్లు పలకడం ఒకే సమగ్ర మర్మాన్ని విభజించదు; సంబంధాన్ని సహజంగా స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు మూలంలోని దీర్ఘ విశేషణ సంబంధాన్ని డాష్‌లతో స్పష్టం చేశాం. ఆంగ్ల సంప్రదింపు పాఠంలోని [a] సూచిక వాక్యంలోని స్థానానికి సరిపోకపోవడం, దాని గమనిక ‘carries/bears’ కు సంబంధించినదై ఉండడం వల్ల తెలుగు ప్రధాన పాఠంలో అవసరం లేని పాదటిప్పణి చేర్చలేదు.
