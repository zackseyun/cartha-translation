review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the deliberately elliptical succession: five have fallen, one is, and another has not yet come. It appropriately avoids identifying the kings. However, the final clause uses present-tense necessity (ఉండవలసి ఉంది) after a future-contingent arrival; Telugu should express the consequent future necessity as ఉండవలసి ఉంటుంది.'
  naturalness: The wording is clear, modern standard Telugu, and suitably restrained in register. Recasting the last sentence with future consequence improves temporal coherence and flow.
  terminology: ఐదుగురు, ఒకడు, మరొకడు preserve the personal/kingly referents without putting ‘kings’ into the main text. పతనమయ్యారు suitably conveys the apocalyptic downfall. The footnote supplies రాజులు only as a contextual clarification and is appropriate.
  issues:
  - severity: medium
    issue: The final clause has a tense/aspect mismatch in Telugu.
    rationale: ὅταν ἔλθῃ introduces a future contingency, and δεῖ μεῖναι states what will then be necessary. “అతడు వచ్చినప్పుడు కొద్దికాలం ఉండవలసి ఉంది” can imply a present necessity. “అతడు వచ్చినప్పుడు, అతడు కొద్దికాలం ఉండవలసి ఉంటుంది” naturally preserves the future result.
  revised_text: ఐదుగురు పతనమయ్యారు[a]; ఒకడు ఉన్నాడు; మరొకడు ఇంకా రాలేదు. అతడు వచ్చినప్పుడు, అతడు కొద్దికాలం ఉండవలసి ఉంటుంది.
