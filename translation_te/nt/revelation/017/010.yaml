id: REV.17.10
reference: Revelation 17:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: te
  text: ఐదుగురు పతనమయ్యారు[a]; ఒకడు ఉన్నాడు; మరొకడు ఇంకా రాలేదు. అతడు వచ్చినప్పుడు, అతడు కొద్దికాలం ఉండవలసి ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సందర్భాన్ని మరింత స్పష్టంగా చెబితే: “ఐదుగురు రాజులు పతనమయ్యారు; ఒక రాజు ఉన్నాడు; మరొక రాజు ఇంకా రాలేదు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πέντε
  choice: ఐదుగురు
  rationale: మునుపటి వాక్యభాగంలోని ఏడుగురు రాజులను సూచిస్తుంది. వ్యక్తులను సూచించే సహజమైన తెలుగు సంఖ్యారూపం వాడబడింది; తెలుగు వాక్యనిర్మాణంలో నిర్దిష్ట ఉపపదం అవసరం లేదు.
- source_word: ἔπεσαν
  choice: పతనమయ్యారు
  rationale: πίπτω యొక్క రూపకాల అర్థమైన అధికార పతనం లేదా తొలగింపును తెలియజేస్తూ, అపోకలిప్టిక్ గంభీరతను నిలుపుతుంది.
- source_word: ὁ εἷς ἔστιν
  choice: ఒకడు ఉన్నాడు
  rationale: గ్రీకు మూలంలోని సంక్షిప్తమైన, అధ్యాహార భావాన్ని అలాగే ఉంచుతుంది; ‘పాలిస్తున్నాడు’ అని అర్థాన్ని నిర్దిష్టం చేయదు.
- source_word: ὁ ἄλλος οὔπω ἦλθεν
  choice: మరొకడు ఇంకా రాలేదు
  rationale: రాజుల వరుసలో తదుపరి వ్యక్తిని సూచిస్తుంది. οὔπω ἦλθεν లోని ఇంకా నెరవేరని రాకను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅταν ἔλθῃ
  choice: అతడు వచ్చినప్పుడు
  rationale: భవిష్యత్తులో సంభవించబోయే రాకను తెలిపే ὅταν మరియు సంభావనార్థక క్రియకు సహజమైన తెలుగు సమానార్థకం.
- source_word: ὀλίγον αὐτὸν δεῖ μεῖναι
  choice: అతడు కొద్దికాలం ఉండవలసి ఉంది
  rationale: ὀλίγον తెలిపే స్వల్ప వ్యవధినీ, δεῖ తెలిపే అనివార్యతనూ, μεῖναι యొక్క ‘ఉండడం/నిలిచి ఉండడం’ భావాన్నీ నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ఏడుగురు రాజుల ప్రతీకకు చారిత్రక గుర్తింపులు నిర్ణయించడం
  choice: వచనంలోని సంక్షిప్త సూచనలను అలాగే ఉంచి, నిర్దిష్ట రాజులు లేదా చారిత్రక పథకాన్ని అనువాదంలో గుర్తించలేదు.
  alternative: ‘ఐదుగురు రాజులు పతనమయ్యారు; ఒక రాజు ఉన్నాడు...’ అని ప్రధాన వచనంలోనే విపులీకరించడం లేదా వారిని నిర్దిష్ట రోమా చక్రవర్తులుగా గుర్తించడం.
  rationale: తక్షణ సందర్భం వీరు రాజులని చెబుతున్నప్పటికీ, ఈ వచనం అధ్యాహారంగా ఉంది. వివాదాస్పదమైన చారిత్రక గుర్తింపును అనువాదం స్వయంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన అపోకలిప్టిక్ శైలిని పాటించాం. ‘ఒకడు ఉన్నాడు’ అనే మూలంలోని సంక్షిప్తతను నిలిపి, ‘పాలిస్తున్నాడు’ వంటి వ్యాఖ్యానాత్మక పదాన్ని చేర్చలేదు. ప్రధాన వచనంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
