  terminology: ధన్యులు, వస్త్రాలు, జీవవృక్షం, హక్కు, ద్వారాలు, నగరం అనే పదాలు తగినవే. పాఠభేద పాదసూచికలో “ఆయన”కు మూలపాఠంలో ప్రత్యక్ష పూర్వపదం లేకపోయినా ప్రత్యామ్నాయ పాఠానికి అది సరైన ప్రతినిధిత్వం. పాదసూచిక cలో “ద్వారాలతో” అనేది అస్పష్టమైన అక్షరార్థ ప్రత్యామ్నాయం కనుక తొలగించాలి.
