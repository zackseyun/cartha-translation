id: REV.22.14
reference: Revelation 22:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: te
  text: తమ వస్త్రాలను ఉతుక్కొనేవారు ధన్యులు! వారికి జీవవృక్షంపై హక్కు కలిగి, వారు ద్వారాల గుండా నగరంలోకి ప్రవేశించునట్లు.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “తమ వస్త్రాలను ఉతుక్కొనేవారు” అనే మాటలకు బదులుగా “ఆయన ఆజ్ఞలను ఆచరించేవారు” లేదా “ఆయన ఆజ్ఞలను పాటించేవారు” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: వస్త్రాలను ఉతకడమనే ఈ చిత్రం ప్రకటన 7:14ను ప్రతిధ్వనిస్తుంది; అక్కడ వారు తమ వస్త్రాలను గొర్రెపిల్ల రక్తంలో ఉతికి తెల్లగా చేసుకున్నారు.
    reason: cross_reference
  - marker: c
    text: లేదా, “ద్వారాల ద్వారా.” ఇక్కడ భావం నగర ద్వారాల గుండా ప్రవేశించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: ధన్యులు
  rationale: దైవ అనుగ్రహం, అంత్యకాల ఆశీర్వాదం అనే భావభారాన్ని నిలుపుతూ, ధన్యత ప్రకటనలకు సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: πλύνοντες τὰς στολὰς αὐτῶν
  choice: తమ వస్త్రాలను ఉతుక్కొనేవారు
  rationale: క్రియ యొక్క స్పష్టమైన కడగడం/ఉతకడం అనే చిత్రాన్ని, అలాగే ఆ పని చేత గుర్తింపబడే వ్యక్తుల భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἵνα
  choice: కలగడానికి … ప్రవేశించడానికి
  rationale: గ్రీకు ఉద్దేశ్య/ఫలిత సంబంధాన్ని తెలుగు క్రియార్థక నిర్మాణంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: జీవవృక్షం దగ్గరకు వెళ్లే హక్కు వారికి
  rationale: ఇక్కడ ἐξουσία పరిపాలనా అధికారం లేదా శక్తి కాక, సముచిత ప్రవేశ హక్కును సూచిస్తుంది; ἐπί కూడా జీవవృక్షంపై ఆధిపత్యం కన్నా దాని వద్దకు చేరే అవకాశాన్ని సూచిస్తుంది.
- source_word: τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν
  choice: ద్వారాల గుండా నగరంలోకి ప్రవేశించడానికి
  rationale: దత్తివు రూపంలోని πυλῶσιν ప్రవేశ మార్గాన్ని సూచిస్తుంది; ‘ద్వారాల గుండా’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
theological_decisions:
- issue: మొదటి ఉపవాక్యంలోని పాఠభేదం
  choice: SBLGNT పాఠమైన ‘తమ వస్త్రాలను ఉతుక్కొనేవారు’ను ప్రధాన పాఠ్యంలో అనువదించడం.
  alternative: ‘ఆయన ఆజ్ఞలను పాటించేవారు/ఆచరించేవారు.’
  rationale: ఇచ్చిన మూలపాఠం πλύνοντες τὰς στολὰς αὐτῶν అని ఉంది. ముఖ్యమైన ప్రత్యామ్నాయ పాఠాన్ని దాని అనువాద సంప్రదాయ, భావప్రాధాన్యాల కారణంగా పాదసూచికలో భద్రపరచాం.
- issue: వస్త్రాలను ఉతకడానికి జీవానికి ప్రవేశంతో ఉన్న సంబంధం
  choice: వాక్యం తెలిపే సంబంధాన్ని అలాగే ఉంచి, అది ఎలా పనిచేస్తుందనే అదనపు సిద్ధాంత వివరణను ప్రధాన పాఠ్యంలో చేర్చకపోవడం.
  alternative: దీనిని మానవ పుణ్యకార్యంగా స్పష్టీకరించడం, లేదా ప్రకటన 7:14లోని గొర్రెపిల్ల రక్తాన్ని ప్రధాన పాఠ్యంలోనే చేర్చడం.
  rationale: ఈ వాక్యం వస్త్రాలు ఉతకడమనే చిత్రాన్ని జీవవృక్షం మరియు నగర ప్రవేశంతో కలుపుతుంది; అయితే దాని సిద్ధాంతపరమైన విధానాన్ని ఇక్కడ వివరించదు. అందువల్ల ఆ ఉద్రిక్తతను అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, ప్రకటన గ్రంథపు గంభీరమైన దర్శనాత్మక శైలిని నిలిపాం. ‘వస్త్రాలు,’ ‘జీవవృక్షం,’ ‘ద్వారాలు,’ ‘నగరం’ అనే ప్రతీకలను వ్యాఖ్యానాత్మకంగా మార్చకుండా కాపాడాం. అన్ని పాదసూచిక సూచికలను ప్రధాన పాఠ్యంలో చేర్చాం.
