  source_fidelity: ప్రధాన పాఠ్యంలో ఉన్న “అలా చేస్తారు” గ్రీకు వాక్యనిర్మాణంలో లేదు; ఇది వస్త్రాలు ఉతకడాన్ని హక్కు/ప్రవేశం పొందడానికి ఉద్దేశపూర్వక సాధనంగా అనవసరంగా స్పష్టీకరిస్తుంది. ἵνα + భవిష్యత్ నిర్మాణం తెలిపే ఫలిత/ఉద్దేశ సంబంధాన్ని, అలాగే ἐξουσία యొక్క ‘హక్కు’ భావాన్ని సవరించిన పాఠ్యం నిలుపుతుంది.
