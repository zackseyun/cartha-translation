  verdict: revise
  source_fidelity: 'మూల గ్రీకు వాక్యనిర్మాణం మూడు సమాంతర అనుబంధాలను కలిగి ఉంది: యోహాను, అతని ప్రవక్తలైన సహోదరులు, ఈ గ్రంథపు మాటలను పాటించేవారు. ముసాయిదా భావాన్ని ప్రధానంగా నిలుపుతుంది; అయితే ‘తో పాటు’ చివరి సమూహాన్ని సమీపంలోని ప్రవక్తలతో మరింతగా కలిపినట్లు వినిపించవచ్చు. ‘దేవుణ్ణే’ సందర్భానుసారంగా సమర్థనీయమైనా, మూలంలో లేని ఉద్ఘాటనను ప్రధాన పాఠంలో చేర్చకుండా ఉండటం మరింత మితమైనది.'
  naturalness: ‘సహదాసుణ్ణి’ అర్థవంతమే, కానీ ‘సహదాసుడను’ ఆధునిక ప్రామాణిక తెలుగులో ఈ స్వీయపరిచయానికి కొద్దిగా సహజంగా ఉంటుంది. మూడు సమూహాలను ‘నీతోను … వారితోను’ అని స్పష్టంగా సమన్వయపరచడం చదవడానికి సులభం.
  terminology: ‘సహదాసుడు’ σύνδουλος లోని ఉమ్మడి దాసస్థితిని సముచితంగా కాపాడుతుంది. ‘పాటించేవారు,’ ‘గ్రంథంలోని మాటలు,’ ‘ఆరాధించు’ కూడా వరుసగా τηροῦντες, λόγοι, προσκύνησονలకు సరైన ఆధునిక తెలుగు ఎంపికలు.
  issues:
