- from: 'అప్పుడు అతడు నాతో ఇలా అన్నాడు: “అలా చేయకు![a] నేను నీతో, ప్రవక్తలైన నీ సహోదరులతో, ఈ గ్రంథంలోని మాటలను పాటించేవారితో పాటు సహదాసుణ్ణి.[b] దేవుణ్ణే ఆరాధించు.”[c]'
  to: 'అతడు నాతో ఇలా అన్నాడు: “అలా చేయకు![a] నేను నీతోను, ప్రవక్తలైన నీ సహోదరులతోను, ఈ గ్రంథంలోని మాటలను పాటించేవారితోను సహదాసుడను.[b] దేవుణ్ణి ఆరాధించు.”[c]'
  rationale: ప్రధాన పాఠంలో మూడు సమాంతర దాతృసంబంధ పదబంధాలను ‘నీతోను … వారితోను’ ద్వారా స్పష్టంగా ఉంచాం. మూలంలో ప్రత్యక్షంగా లేని ‘-నే’ ఉద్ఘాటనను తొలగించాం. ఇతర పదజాలం మూలార్థానికీ, ఆధునిక ప్రామాణిక తెలుగు వాడుకకీ తగినదే కాబట్టి నిలిపాం. పాదటిప్పణి cలో ఉదాహరించిన వాక్యాన్ని సవరించిన ప్రధాన పాఠంతో సరిపోల్చాం.
