id: REV.22.9
reference: Revelation 22:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow servant with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: te
  text: 'అతడు నాతో ఇలా అన్నాడు: “అలా చేయకు![a] నేను నీతోను, ప్రవక్తలైన నీ సహోదరులతోను, ఈ గ్రంథంలోని మాటలను పాటించేవారితోను సహదాసుడను.[b] దేవుణ్ణి ఆరాధించు.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో నిషేధం అక్షరార్థంగా సంక్షిప్తమైన ‘చూడు, వద్దు’ అనే రూపంలో ఉంది. సందర్భార్థం: యోహాను దేవదూతను ఆరాధించబోయిన పని చేయకూడదు.'
    reason: lexical_alternative
  - marker: b
    text: ‘సహదాసుడు’ అంటే ఒకే యజమాని అధీనంలో దాసులుగా ఉన్నవారు. దేవదూత కూడా యోహానులాగే దేవుని అధీనంలో ఉన్నాడనీ, అందువల్ల అతడు ఆరాధనకు పాత్రుడు కాదనీ ఇది నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ప్రకటన 19:10లో కూడా దేవదూత ఇదే విధంగా సరిదిద్దుతూ, “దేవుణ్ణి ఆరాధించు” అని చెబుతాడు.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μή
  choice: అలా చేయకు!
  rationale: ఇది యోహాను దేవదూతను ఆరాధించబోయిన చర్యను అకస్మాత్తుగా నిలువరించే సంక్షిప్త గ్రీకు నిషేధం; సందర్భంలో సూచితమైన చర్యను సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: σύνδουλός
  choice: సహదాసుణ్ణి
  rationale: దేవదూత కూడా యోహానులాగే దేవుని అధీనంలో ఉన్నవాడనే ఉమ్మడి దాసస్థితిని నిలుపుతుంది; కేవలం ‘తోటి సేవకుడు’ కంటే మూలపద బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀδελφῶν σου τῶν προφητῶν
  choice: ప్రవక్తలైన నీ సహోదరులతో
  rationale: రెండవ పదబంధాన్ని మొదటిదానికి వివరణగా తీసుకొని, సహోదరులు ఎవరో—ప్రవక్తలు—సహజంగా తెలియజేస్తుంది.
- source_word: τηρούντων
  choice: పాటించేవారితో
  rationale: గ్రంథంలోని మాటలను నమ్మకంగా గైకొని వాటి ప్రకారం నడుచుకోవడాన్ని సూచిస్తుంది; ‘కాపాడేవారు’ అనే పరిమిత భావాన్ని నివారిస్తుంది.
- source_word: λόγους τοῦ βιβλίου τούτου
  choice: ఈ గ్రంథంలోని మాటలను
  rationale: λόγους యొక్క బహువచన రూపాన్నీ, βιβλίον యొక్క సందర్భానుకూల అర్థాన్నీ నేరుగా నిలుపుతుంది.
- source_word: τῷ θεῷ προσκύνησον
  choice: దేవుణ్ణే ఆరాధించు
  rationale: దేవదూతకు చేయబోయిన ఆరాధనకు విరుద్ధంగా ఆరాధన దేవునికే చెందుతుందని తెలుగు ఉద్ఘాటక ప్రత్యయం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: σύνδουλος లోని దాసత్వ భాష
  choice: ‘సహదాసుడు’ అని అనువదించడం
  alternative: ‘తోటి సేవకుడు’
  rationale: ఇక్కడ దేవదూత ఆరాధనకు పాత్రుడు కాదని, యోహానుతోపాటు దేవుని అధీనంలో ఉన్నవాడని చెప్పడమే ప్రధాన భావం. ‘సహదాసుడు’ ఆ ఉమ్మడి అధీనస్థితిని కాపాడుతుంది.
- issue: Ὅρα μή లో సూచిత చర్యను తెలుగులో వ్యక్తం చేయడం
  choice: ‘అలా చేయకు!’
  alternative: ‘చూడకు’ లేదా కేవలం ‘వద్దు’
  rationale: గ్రీకులో నిషేధం సంక్షిప్తంగా ఉన్నా, ముందరి సందర్భంలో యోహాను దేవదూతను ఆరాధించబోవడమే సూచిత చర్య. తెలుగు పాఠకునికి సహజంగా ఉండేందుకు దానిని స్పష్టం చేశాం.
- issue: ప్రవక్తలు మరియు మాటలను పాటించేవారి సంబంధం
  choice: రెండు సమూహాలనూ దేవదూతతోటి దాసులుగా సమాంతరంగా ఉంచడం
  alternative: మాటలను పాటించేవారిని ప్రవక్తల వివరణగానే తీసుకోవడం
  rationale: καί పదాల సమన్వయ నిర్మాణం యోహాను, ప్రవక్తలైన అతని సహోదరులు, ఈ గ్రంథపు మాటలను పాటించేవారు అనే సమాంతర అనుబంధాన్ని అనుమతిస్తుంది; వాక్య నిర్మాణాన్ని పరిష్కరించి ఒకే సమూహంగా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ వాడబడింది. ‘సహదాసుడు’ కొంత సాహిత్యపూర్వకమైనా మూలంలోని ఉమ్మడి దాసస్థితిని ఖచ్చితంగా నిలుపుతుంది. ప్రధాన పాఠంలోని [a], [b], [c] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
