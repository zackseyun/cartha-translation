id: REV.22.18
reference: Revelation 22:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: te
  text: 'ఈ గ్రంథం[b]లోని ప్రవచనపు మాటలను వినే ప్రతి ఒక్కరికీ నేను సాక్ష్యమిస్తున్నాను[a]: ఎవరైనా వాటికి ఏదైనా జోడిస్తే, దేవుడు ఈ గ్రంథంలో వ్రాయబడిన తెగుళ్లను అతనిమీద జోడిస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను సాక్ష్యం చెబుతున్నాను.’ ఇక్కడి క్రియ కేవలం సాధారణ హెచ్చరిక కాక, సాక్ష్యమిచ్చే భాషను ఉపయోగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘గ్రంథం’కు మూలపదాన్ని ప్రాచీన రచనా రూపాన్ని దృష్టిలో ఉంచుకుని ‘చుట్టపత్రం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: నేను సాక్ష్యమిస్తున్నాను
  rationale: ఇది కేవలం హెచ్చరించడం అనే భావం కాకుండా, గంభీరమైన సాక్ష్యభాషను వ్యక్తం చేస్తుంది; హెచ్చరిక భావం తరువాతి షరతు మరియు తీర్పు ద్వారా స్పష్టమవుతుంది.
- source_word: παντὶ τῷ ἀκούοντι
  choice: వినే ప్రతి ఒక్కరికీ
  rationale: దత్తివ విభక్తిలోని వర్తమాన కృదంత నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: ప్రవచన వాక్యాలను
  rationale: λόγοι యొక్క మాటల రూపాన్ని, προφητεία యొక్క ప్రవచన స్వభావాన్ని రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τοῦ βιβλίου τούτου / ἐν τῷ βιβλίῳ τούτῳ
  choice: ఈ గ్రంథం / ఈ గ్రంథంలో
  rationale: βιβλίονకు ప్రాచీన భౌతిక రూపం పరంగా ‘చుట్ట’ అనే అర్థం సాధ్యమైనా, రచనను సూచించడానికి ‘గ్రంథం’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: ఎవరైనా వాటికి ఏదైనా జోడిస్తే
  rationale: ἐπιτίθημι ఇక్కడ ‘చేర్చడం/జోడించడం’ అనే అర్థంలో ఉంది. తెలుగులో వాక్యం స్పష్టంగా ఉండేందుకు అంతర్భావిత కర్మను ‘ఏదైనా’గా వ్యక్తం చేసింది.
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: దేవుడు ... అతనికి జోడిస్తాడు
  rationale: ముందటి ఉపవాక్యంలోనూ ఇదే గ్రీకు క్రియ వాడబడింది. ‘జోడిస్తే—జోడిస్తాడు’ అనే పదసామ్యాన్ని నిలుపడం ద్వారా మూలంలోని ఉద్దేశపూర్వక ప్రతిధ్వని కాపాడబడింది.
- source_word: τὰς πληγὰς
  choice: తెగుళ్లను
  rationale: ప్రకటన గ్రంథంలో πληγή సాధారణంగా దేవుని తీర్పుగా వచ్చే తెగుళ్లను సూచిస్తుంది; ఈ పదం గ్రంథంలోని అంతర్గత ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: τὰς γεγραμμένας
  choice: వ్రాయబడిన
  rationale: నిలిచి ఉన్న లిఖిత విషయాన్ని సూచించే పరిపూర్ణ కర్మణి భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ ప్రకటన స్వభావం—హెచ్చరికా లేక సాక్ష్యమా
  choice: ‘నేను సాక్ష్యమిస్తున్నాను’ అని అనువదించడం
  alternative: ‘నేను హెచ్చరిస్తున్నాను’
  rationale: గ్రీకు క్రియ సాక్ష్యమిచ్చే భాషకు చెందినది. దానిని కేవలం హెచ్చరికగా మార్చకుండా, హెచ్చరిక తీవ్రతను తరువాతి తీర్పు వాక్యం ద్వారా వెలువడనివ్వడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: ‘జోడించడం’ అనే క్రియ యొక్క ప్రతిసామ్యం
  choice: మానవుడు జోడించడం, దేవుడు తెగుళ్లను జోడించడం—రెండింటికీ ఒకే తెలుగు క్రియను ఉంచడం
  alternative: రెండవ భాగంలో ‘అతని మీదికి రప్పిస్తాడు’ లేదా ‘మోపుతాడు’
  rationale: రెండు ఉపవాక్యాల్లో ఒకే గ్రీకు క్రియ పునరావృతమై, చర్యకు తగిన ప్రతిఫలాన్ని బలంగా చూపుతుంది. కొద్దిగా గుర్తించదగిన వాక్యనిర్మాణమైనా, ఈ ధార్మిక-వాక్చాతుర్య ఉద్రిక్తతను నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, బహిరంగ పఠనానికి అనుకూలమైన శైలి వాడబడింది. ‘జోడిస్తే—జోడిస్తాడు’ అనే పునరుక్తి తెలుగులో కొద్దిగా విశిష్టంగా వినిపించినా, మూలంలోని ఉద్దేశపూర్వక పదసామ్యాన్ని కాపాడుతుంది.
