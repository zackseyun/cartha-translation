  naturalness: ‘దేవుడు … తెగుళ్లను అతనికి జోడిస్తాడు’ ఆధునిక తెలుగులో కొద్దిగా అసహజంగా ఉంది. ‘అతనిమీద జోడిస్తాడు’ గంభీరమైన శైలిలో సహజంగా ఉండి, మూలంలోని పదసామ్యాన్నీ నిలుపుతుంది. మొదటి పాదాన్ని ‘ప్రవచనపు మాటలు’గా చేయడం కూడా మరింత నేరమైన, సహజమైన అనుసంధానం.
