    rationale: Although “అబద్ధం” is lexically possible, the climactic construction of loving and doing ψεῦδος can encompass more than an individual lie. “అసత్యం” preserves that breadth more naturally in Telugu; “అబద్ధం” can be retained in a footnote as a legitimate alternative.
  - severity: low
    issue: “అబద్ధాన్ని ప్రేమిస్తూ ఆచరించే” is somewhat less idiomatic as a rendering of the paired participles.
    rationale: “అసత్యాన్ని ప్రేమించి ఆచరించే” is a smoother characteristic-action formulation in modern standard Telugu and retains both φιλῶν and ποιῶν.
