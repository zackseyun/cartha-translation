id: REV.22.15
reference: Revelation 22:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: te
  text: బయట కుక్కలు[b], మంత్రవిద్య చేసేవారు, లైంగిక దుర్నీతికి పాల్పడేవారు, హంతకులు, విగ్రహారాధకులు, అలాగే అసత్యాన్ని ప్రేమించి ఆచరించే ప్రతి ఒక్కరూ ఉంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అబద్ధాన్ని ప్రేమించి ఆచరించే ప్రతి ఒక్కరూ.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘కుక్కలు’ అనేది బహుశా బహిష్కరణను, నైతిక అపవిత్రతను సూచించే రూపకం; కొందరు వ్యాఖ్యాతలు దీనిని మరింత నిర్దిష్టమైన వర్గానికి అన్వయిస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: ἔξω
  choice: బయట ... ఉన్నారు
  rationale: నగరంలో ప్రవేశం లేని స్థితిని సూచించే క్రియావిశేషణం. గ్రీకులోని ఆరంభ ప్రాధాన్యాన్ని నిలుపుతూ తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం ‘ఉన్నారు’ చేర్చబడింది.
- source_word: κύνες
  choice: కుక్కలు
  rationale: మూలంలోని స్పష్టమైన రూపక చిత్రాన్ని యథాతథంగా నిలుపుతుంది; దానిని వివాదాస్పదమైన ఏదో ప్రత్యేక వర్గంగా ప్రధాన పాఠ్యంలో వ్యాఖ్యానించదు.
- source_word: φάρμακοι
  choice: మంత్రవిద్యలు చేసేవారు
  rationale: ప్రకటన గ్రంథ సందర్భంలో మాంత్రిక లేదా క్షుద్ర ఆచారాలు చేసేవారిని సూచిస్తుంది. ఆధునిక పాఠకులకు ‘మాంత్రికులు’ కంటే చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: πόρνοι
  choice: లైంగిక దుర్నీతికి పాల్పడేవారు
  rationale: లైంగికంగా అనైతికమైన ప్రవర్తనలో నిమగ్నులయ్యే వారిని విస్తృతంగా సూచిస్తుంది; అర్థాన్ని ఒక నిర్దిష్ట లైంగిక పాపానికే పరిమితం చేయదు.
- source_word: φονεῖς
  choice: హంతకులు
  rationale: హత్య చేసేవారిని సూచించే నామవాచకానికి సూటి, సహజమైన తెలుగు సమానార్థకం.
- source_word: εἰδωλολάτραι
  choice: విగ్రహారాధకులు
  rationale: విగ్రహాలను ఆరాధించేవారిని సూచించే సంక్షిప్తమైన, ప్రామాణిక పదం; దోషాల జాబితా శైలిని కాపాడుతుంది.
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: అబద్ధాన్ని ప్రేమిస్తూ ఆచరించే ప్రతి ఒక్కరూ
  rationale: πᾶς తో కూడిన వర్తమాన కృదంతాలను లక్షణాత్మకమైన, కొనసాగుతున్న వైఖరి మరియు ప్రవర్తనగా తెలుపుతుంది. ψεῦδος యొక్క ఏకవచన రూపాన్ని ‘అబద్ధం’గా నిలుపుతూ, అది విస్తృతమైన అసత్యతను కూడా సూచించగలదనే అవకాశాన్ని పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: ‘కుక్కలు’ అనే రూపకాన్ని ఒక నిర్దిష్ట వర్గంగా వ్యాఖ్యానించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘కుక్కలు’ అనే ప్రత్యక్ష రూపకాన్నే నిలుపడం.
  alternative: అపవిత్రులు, సిగ్గులేనివారు, లేదా మరొక నిర్దిష్ట బహిష్కృత వర్గం.
  rationale: κύνες అనే మూలపదం సజీవమైన రూపకాన్ని ఉపయోగిస్తుంది. దాని ఖచ్చిత సూచన వివాదాస్పదం కాబట్టి, ఒక వ్యాఖ్యానాన్ని పాఠ్యంలోకి దిగుమతి చేయకుండా రూపకాన్ని కాపాడటం సముచితం.
- issue: ψεῦδος ను ‘అబద్ధం’గా లేదా విస్తృతంగా ‘అసత్యం’గా అనువదించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘అబద్ధం’; విస్తృత అర్థాన్ని పాదటిప్పణిలో సూచించడం.
  alternative: అసత్యాన్ని ప్రేమిస్తూ ఆచరించే ప్రతి ఒక్కరూ.
  rationale: గ్రీకు పదం ఏకవచనంలో ఉన్నందున ‘అబద్ధం’ దాని రూపాన్ని బాగా నిలుపుతుంది; అయితే ఈ సందర్భంలో అది అబద్ధపు మాటకన్నా విస్తృతమైన అసత్యతను సూచించవచ్చు. పాదటిప్పణి ఈ నిజమైన అర్థ విస్తృతిని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. గ్రీకు దోషాల జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు వర్ణనాత్మక బహువచన రూపాలను ఉపయోగించాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
