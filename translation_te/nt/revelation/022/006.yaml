id: REV.22.6
reference: Revelation 22:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his servants what must happen soon.”
translation:
  language: te
  text: 'ఆయన నాతో ఇలా అన్నాడు: “ఈ మాటలు నమ్మదగినవి, సత్యమైనవి. ప్రవక్తల ఆత్మలకు దేవుడైన ప్రభువు, త్వరలో[a] జరగవలసిన వాటిని తన దాసులకు చూపించడానికి తన దూతను పంపాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వేగంగా.” గ్రీకు పదబంధం కాలపరంగా సమీపాన్ని (“త్వరలో”) లేదా సంఘటనలు జరిగే వేగాన్ని (“వేగంగా”) సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὶ
  choice: నమ్మదగినవి
  rationale: మాటల విశ్వసనీయతను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘నమ్మకమైనవి’ కంటే ఈ సందర్భంలో సూటిగా ఉంటుంది.
- source_word: ἀληθινοί
  choice: సత్యమైనవి
  rationale: మాటల యథార్థతను, నిజత్వాన్ని నేరుగా నిలుపుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: ఇక్కడ దైవ బిరుదుగా ఉంది; తెలుగు బైబిలు శైలిలో సహజమైన, గౌరవప్రదమైన సమానం.
- source_word: ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: ప్రవక్తల ఆత్మలకు దేవుడు
  rationale: గ్రీకు షష్ఠీ సంబంధంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది; దేవుడు ప్రవక్తలను ప్రేరేపిస్తాడనే వ్యాఖ్యానాన్ని నేరుగా వాక్యంలో చేర్చదు.
- source_word: ἄγγελον
  choice: దూత
  rationale: ప్రకటన గ్రంథపు దర్శన సందర్భంలో ఇది పరలోక దూతను సూచిస్తుంది; తెలుగులో ‘దూత’ సహజమైన బైబిలు పదం.
- source_word: δούλοις
  choice: దాసులకు
  rationale: δοῦλος లోని యాజమాన్యానికి లోబడిన స్థితిని ‘సేవకులు’ కంటే స్పష్టంగా నిలుపుతూ, తెలుగులో గౌరవప్రదమైన బైబిలు వాడుకగా ఉంటుంది.
- source_word: δεῖξαι
  choice: చూపించడానికి
  rationale: దర్శన సందర్భానికి సరిపోయే δείκνυμι యొక్క సూటి అర్థాన్ని నిలుపుతుంది.
- source_word: ἃ δεῖ γενέσθαι
  choice: జరగవలసిన వాటిని
  rationale: δεῖ లోని అనివార్యతను, γενέσθαι లోని సంఘటన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τάχει
  choice: త్వరలో
  rationale: ఈ సందర్భంలో కాలసమీపతను ప్రధానంగా సూచిస్తుంది; సంఘటనలు వేగంగా జరగడం అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: Καὶ εἶπέν μοι
  choice: ఆయన నాతో ఇలా అన్నాడు
  rationale: తెలుగులో సహజమైన మాటల పరిచయం; καί ను ప్రతి సందర్భంలో ‘మరియు’గా అనువదించి అసహజత కలిగించకుండా కథన కొనసాగింపును నిలుపుతుంది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో ἐν τάχει భావం
  choice: త్వరలో
  alternative: వేగంగా
  rationale: ఈ పదబంధం కాలసమీపతను లేదా సంఘటనల వేగాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సమీపతను ఉంచి, మరో సాధ్యమైన భావాన్ని పాదసూచికలో ఇచ్చి వ్యాఖ్యాన ఉద్రిక్తతను నిలిపాం.
- issue: దేవుని ప్రజలకు δούλοι అనే సంబోధన
  choice: దాసులు
  alternative: సేవకులు
  rationale: దేవునికి చెందినవారనే బంధాన్ని ‘దాసులు’ బలంగా నిలుపుతుంది; ‘సేవకులు’ సహజమైన ప్రత్యామ్నాయమైనా మూలపదంలోని యాజమాన్య ఛాయను కొంత తగ్గిస్తుంది.
- issue: τῶν πνευμάτων τῶν προφητῶν లోని సంబంధం
  choice: ప్రవక్తల ఆత్మలకు దేవుడు
  alternative: ప్రవక్తలను ప్రేరేపించే దేవుడు
  rationale: మూలంలోని షష్ఠీ నిర్మాణం దేవుడు ఆ ఆత్మలపై అధికారిగానో, వాటి మూలంగానో ఉన్నాడనే వివిధ అవగాహనలకు వీలు ఇస్తుంది. వివరణాత్మక ప్రత్యామ్నాయం ఒకే భావాన్ని నిర్ణయిస్తుంది కాబట్టి ప్రధాన పాఠ్యంలో దాన్ని స్వీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ప్రవక్తల ఆత్మలకు దేవుడు’ అనే నిర్మాణం కొద్దిగా గంభీరమైనదైనా మూలంలోని సంబంధ అస్పష్టతను కాపాడుతుంది. ప్రధాన పాఠ్యంలోని [a] పాదసూచిక గుర్తు సంబంధిత పదం వెంట ఉంచబడింది.
