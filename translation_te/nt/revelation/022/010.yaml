id: REV.22.10
reference: Revelation 22:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: te
  text: 'అతడు నాతో ఇలా అంటున్నాడు: “ఈ గ్రంథపు ప్రవచన వాక్యాలకు ముద్ర వేయవద్దు[a][c]. ఎందుకంటే సమయం[b] సమీపంలో ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మూసివేయవద్దు,” “రహస్యంగా ఉంచవద్దు.” ఒక ప్రత్యక్షతను మూసి ఉంచాలా లేక బహిరంగంగా ఉంచాలా అనే ప్రవచన భాషను ఈ మాటలు ప్రతిధ్వనింపజేస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నిర్ణీత సమయం సమీపంలో ఉంది.” గ్రీకు καιρός ఒక కీలకమైన లేదా నిర్ణయించబడిన సమయాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: దానియేలు 12:4తో పోల్చండి; అక్కడ ప్రవచన వాక్యాలకు ముద్ర వేయమని చెప్పబడింది, కానీ ఇక్కడ దానికి విరుద్ధమైన ఆజ్ఞ ఇవ్వబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει μοι
  choice: అతడు నాతో ఇలా అంటున్నాడు
  rationale: గ్రీకులోని వర్తమాన కాల కథన రూపాన్ని సాధ్యమైనంత సహజంగా, దృశ్య సజీవతను నిలుపుతూ తెలుగులో వర్తమాన రూపంతో ఇచ్చాం.
- source_word: Μὴ σφραγίσῃς
  choice: ముద్ర వేయవద్దు
  rationale: σφραγίζω యొక్క ప్రాథమిక ‘ముద్ర వేయడం/మూసివేయడం’ భావాన్ని నిలుపుతుంది; ప్రవచనాన్ని రహస్యంగా ఉంచవద్దనే సందర్భార్థాన్నీ అనుమతిస్తుంది.
- source_word: τοὺς λόγους
  choice: వాక్యాలకు
  rationale: λόγοι అనే బహువచన concrete రూపాన్ని ‘సందేశం’గా ఏకవచనం చేయకుండా నిలిపాం.
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: ఈ గ్రంథంలోని ప్రవచన వాక్యాలకు
  rationale: వరుస genitive సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఈ గ్రంథంలోని ప్రవచన వాక్యాలు’గా వ్యక్తం చేశాం; βιβλίονకు సాధారణ పాఠకులకు సహజమైన ‘గ్రంథం’ను ఎంచుకున్నాం.
- source_word: ὁ καιρὸς
  choice: సమయం
  rationale: καιρόςకు నిర్ణీత లేదా కీలక సమయం అనే ఛాయ ఉండవచ్చు; ప్రధాన పాఠంలో విస్తరించకుండా ‘సమయం’గా ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: ἐγγύς ἐστιν
  choice: సమీపంలో ఉంది
  rationale: ‘దగ్గరగా/సమీపంలో ఉంది’ అనే నేర భావాన్ని సమకాలీన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలోని సమీపత భాష
  choice: ఎందుకంటే సమయం సమీపంలో ఉంది
  alternative: ఎందుకంటే నిర్ణీత సమయం సమీపంలో ఉంది
  rationale: వాక్యం ఒక నిర్దిష్ట అంత్యకాల కాలక్రమాన్ని వివరించకుండా సమీపతను ప్రకటిస్తుంది. ఆ ఉద్వేగాన్ని తగ్గించకుండానూ, సిద్ధాంతపరంగా వివరించి పరిష్కరించకుండానూ మూలంలోని వాదనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన ప్రవచన శైలిని నిలిపాం. గ్రీకు కథన వర్తమానాన్ని ‘అంటున్నాడు’గా ఉంచాం. ప్రధాన పాఠంలోని ప్రతి పాదటిప్పణి సూచిక [a], [b], [c] సంబంధిత పదబంధం దగ్గర కనిపిస్తుంది.
