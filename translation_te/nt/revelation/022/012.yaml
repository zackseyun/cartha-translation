id: REV.22.12
reference: Revelation 22:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: te
  text: “ఇదిగో, నేను త్వరలో వస్తున్నాను[a]; ప్రతి ఒక్కరికి తన పని ఎలాంటిదో దాని ప్రకారం ఇవ్వడానికి నా ప్రతిఫలం నాతో ఉంది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను వేగంగా వస్తున్నాను.” గ్రీకు ταχύ అనే పదం రాక సమీపంలో ఉందనే భావాన్నిగానీ, రాక వేగంగా లేదా అకస్మాత్తుగా జరుగుతుందనే భావాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: ప్రవచనాత్మకమైన, గంభీరమైన దృష్టి-ఆహ్వానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔρχομαι
  choice: నేను వస్తున్నాను
  rationale: సందర్భంలో భవిష్యదర్థం గల వర్తమాన రూపాన్ని, సమీపిస్తున్న రాకను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ταχύ
  choice: త్వరలో
  rationale: ఇక్కడ రాక సమీపంలో ఉందనే భావాన్ని సహజంగా తెలియజేస్తుంది; వేగంగా లేదా అకస్మాత్తుగా అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ὁ μισθός μου
  choice: నా ప్రతిఫలం
  rationale: μισθός లోని బహుమతి, జీతం, తగిన ప్రతిదానం అనే పరిధిలో దైవిక తీర్పు సందర్భానికి ‘ప్రతిఫలం’ సరిపోతుంది.
- source_word: μετ’ ἐμοῦ
  choice: నా దగ్గర ఉంది
  rationale: గ్రీకులో సూచితంగా ఉన్న సంధానక్రియను తెలుగులో స్పష్టంగా అందిస్తూ, ప్రతిఫలం ఆయన వెంట సిద్ధంగా ఉందనే భావాన్ని నిలుపుతుంది.
- source_word: ἀποδοῦναι
  choice: ప్రతిఫలం ఇవ్వడానికి
  rationale: చేసిన పనికి తగినదాన్ని తిరిగి ఇవ్వడం అనే భావాన్ని, ముందు వచ్చిన ‘ప్రతిఫలం’తో సహజంగా అనుసంధానిస్తుంది.
- source_word: ἑκάστῳ
  choice: ప్రతి ఒక్కరికి
  rationale: వ్యక్తిగతంగా ఒక్కొక్కరికి వర్తించే పంపిణీ భావాన్ని కచ్చితంగా తెలియజేస్తుంది.
- source_word: ὡς
  choice: దాని ప్రకారం
  rationale: తీర్పు లేదా ప్రతిఫలానికి ప్రమాణాన్ని సూచిస్తుంది.
- source_word: τὸ ἔργον ἐστὶν αὐτοῦ
  choice: వారి పని ఎలా ఉందో
  rationale: ἔργον అనే ఏకవచన నామవాచకాన్నీ, ἐστίν అనే ‘ఉంది’ భావాన్నీ సాధ్యమైనంత వరకు నిలుపుతూ, తెలుగులో సహజమైన ప్రతినిధి వచనాన్ని వాడుతుంది.
theological_decisions:
- issue: ἑκάστῳ ... αὐτοῦ లో లింగ సూచన
  choice: ప్రతి ఒక్కరికి వారి పని
  alternative: ప్రతి ఒక్కరికి అతని పని
  rationale: గ్రీకు పుంలింగ ఏకవచనం ఇక్కడ సమస్త వ్యక్తులను ప్రతినిధిగా సూచిస్తుంది. తెలుగు ‘వారి’ గౌరవ/ప్రతినిధి ప్రయోగం మూలంలోని వ్యక్తిగత బాధ్యతను నిలుపుతూ అనవసరంగా పురుషులకు మాత్రమే పరిమితం చేయదు.
- issue: క్రియల ప్రకారం ప్రతిఫలం
  choice: వారి పని ఎలా ఉందో దాని ప్రకారం ప్రతిఫలం ఇవ్వడానికి
  alternative: వారు చేసిన పనుల ప్రకారం ప్రతి ఒక్కరికి తిరిగి చెల్లించడానికి
  rationale: ప్రతి వ్యక్తికి పనిని బట్టి ప్రతిఫలం ఉంటుందని వాక్యం చెప్పే ఉద్వేగాన్ని నిలుపుతుంది; అంతిమ రక్షణకు ఆధారం ఏమిటనే అదనపు సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రకటన గ్రంథానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘ఇదిగో’ అపోకలిప్టిక్ దృష్టి-ఆహ్వానాన్ని నిలుపుతుంది; వాక్యక్రమం తెలుగు సహజ ప్రవాహానికి అనుగుణంగా అమర్చబడింది.
