revisions:
- from: “ఇదిగో, నేను త్వరలో వస్తున్నాను[a]. ప్రతి ఒక్కరికి వారి పని ఎలా ఉందో దాని ప్రకారం ప్రతిఫలం ఇవ్వడానికి, నా ప్రతిఫలం నా దగ్గర ఉంది.”
  to: “ఇదిగో, నేను త్వరలో వస్తున్నాను[a]; ప్రతి ఒక్కరికి తన పని ఎలాంటిదో దాని ప్రకారం ఇవ్వడానికి నా ప్రతిఫలం నాతో ఉంది.”
  rationale: 'The revision retains the draft’s sound rendering of ταχύ as “త్వరలో” and preserves the lexical alternative in the footnote. It changes “నా దగ్గర” to “నాతో” for closer fidelity to μετ’ ἐμοῦ, and uses distributive singular “తన పని” to represent ἑκάστῳ ... αὐτοῦ naturally without imposing a gender-specific interpretation. The clause order keeps the Greek’s stated purpose: the reward is with the speaker in order to give to each person in accordance with that person’s work.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:06:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the announcement, imminent coming, individual recompense, and the work-based standard. However, “నా దగ్గర ఉంది” weakens μετ’ ἐμοῦ (“with me”) into a merely locative sense, and the reward/recompense linkage can be expressed more directly.
  naturalness: The existing Telugu is generally clear, but “వారి పని ఎలా ఉందో దాని ప్రకారం” is less idiomatic for the distributive singular and is somewhat cumbersome. “తన పని ఎలాంటిదో దాని ప్రకారం” is natural modern standard Telugu and retains individual reference.
  terminology: “ఇదిగో,” “త్వరలో,” and “ప్రతిఫలం” suit the solemn register and the Greek terms. “నాతో ఉంది” more faithfully represents μετ’ ἐμοῦ than “నా దగ్గర ఉంది.”
  issues:
  - severity: medium
    issue: మెτ’ ἐμοῦ is rendered as “నా దగ్గర ఉంది.”
    rationale: The Greek says that the reward is “with me,” likely accompanying the speaker. “నా దగ్గర” can mean merely “in my possession/at my place”; “నాతో” preserves the accompanying sense.
  - severity: low
    issue: The distributive singular is rendered with plural “వారి.”
    rationale: While idiomatic in some contexts, “ప్రతి ఒక్కరికి తన పని” more transparently preserves the individual distributive force of ἑκάστῳ ... αὐτοῦ and reads smoothly in Telugu.
  revised_text: “ఇదిగో, నేను త్వరలో వస్తున్నాను[a]; ప్రతి ఒక్కరికి తన పని ఎలాంటిదో దాని ప్రకారం ఇవ్వడానికి నా ప్రతిఫలం నాతో ఉంది.”
  revised_footnotes:
