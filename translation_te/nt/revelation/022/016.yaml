id: REV.22.16
reference: Revelation 22:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: te
  text: “యేసునైన నేనే, సంఘాల కొరకు[a] ఈ విషయాలను మీకు సాక్ష్యంగా తెలియజేయడానికి నా దేవదూతను పంపాను. నేను దావీదు వేరును, దావీదు వంశస్థుడిని[b], ప్రకాశవంతమైన వేకువ చుక్కను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సంఘాలలో” లేదా “సంఘాల విషయమై.” గ్రీకులోని ἐπὶ ταῖς ἐκκλησίαις అనే పదబంధం ఒకటి కంటే ఎక్కువ భావసూక్ష్మతలకు అవకాశం ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దావీదు సంతానాన్ని.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: యేసునైన నేనే
  rationale: వ్యక్తవాచక సర్వనామంలోని ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది; ‘యేసునైన’ అనే రూపం తెలుగులో సహజమైన స్వీయ గుర్తింపును ఇస్తుంది.
- source_word: ἔπεμψα
  choice: పంపాను
  rationale: గ్రీకు ఏఓరిస్ట్‌ను సహజమైన తెలుగు భూతకాలంతో అనువదించాం; సందర్భమే ఆ పంపడం ఇప్పటికీ ప్రాసంగికమని తెలియజేస్తుంది.
- source_word: τὸν ἄγγελόν μου
  choice: నా దూతను
  rationale: ప్రకటన గ్రంథపు దర్శన సందర్భంలో ἄγγελος దేవదూతను సూచిస్తుంది; తెలుగులో ‘దూత’ ఈ అర్థాన్ని సహజంగా మోస్తుంది.
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: ఈ విషయాల గురించి మీకు సాక్ష్యమివ్వడానికి
  rationale: ఉద్దేశార్థక క్రియను నిలుపుతూ, తెలుగు వాక్యనిర్మాణానికి సహజంగా ఉండేలా సాక్ష్యపు విషయాన్ని ‘గురించి’తో తెలిపాం.
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: సంఘాల కోసం
  rationale: ἐπί + దత్తివిభక్తి ఇక్కడ ఉద్దేశం లేదా పరిధిని సూచించగలదు. ‘సంఘాల కోసం’ సాక్ష్యం సంఘాల ప్రయోజనార్థమని సహజంగా తెలియజేస్తుంది; ఇతర సాధ్యమైన సూక్ష్మార్థాలు పాదటిప్పణిలో ఉన్నాయి.
- source_word: ἡ ῥίζα
  choice: దావీదు వేరు
  rationale: ῥίζα యొక్క రూపకాన్ని వివరించి మార్చకుండా ‘వేరు’గా నిలిపాం.
- source_word: τὸ γένος Δαυίδ
  choice: అతని సంతానం
  rationale: γένος ఇక్కడ వంశసంబంధమైన ఉద్భవాన్ని సూచిస్తుంది. ‘సంతానం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, యేసు దావీదు వంశంలో పుట్టినవాడనే భావాన్ని నిలుపుతుంది.
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: ప్రకాశవంతమైన వేకువ చుక్క
  rationale: పునరుక్త నిర్దేశక పదాలతో కూడిన రెండు విశేషణాలను సహజమైన తెలుగు నామపదబంధంగా కూర్చి, ప్రకాశం మరియు ఉదయకాలం అనే రెండు భావాలనూ నిలిపాం.
theological_decisions:
- issue: దావీదుతో మెస్సీయ సంబంధంలోని ద్వంద్వత
  choice: ‘దావీదు వేరు’ మరియు ‘అతని సంతానం’ రెండింటినీ యథాతథ రూపకాలుగా నిలిపాం.
  alternative: ‘దావీదుకు మూలమైనవాడు, అతని వంశస్థుడు’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: యేసు దావీదుకు ముందున్న మూలమూ, అతని తరువాతి సంతానమూ అనే వాక్యంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
- issue: ‘వేకువ చుక్క’ అనే క్రీస్తు స్వీయ బిరుదు
  choice: ‘ప్రకాశవంతమైన వేకువ చుక్క’గా ప్రత్యక్ష స్వీయ గుర్తింపును నిలిపాం.
  alternative: దాని ప్రతీకార్థాన్ని వివరణగా ప్రధాన పాఠ్యంలో చేర్చడం.
  rationale: గ్రీకు పాఠ్యం దీనిని యేసు స్వీయ బిరుదుగా ఇస్తుంది; తరువాతి సిద్ధాంత వివరణలను ప్రధాన పాఠ్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘నేనే’ ద్వారా ఉద్ఘాటనను, ‘వేరు/సంతానం’ ద్వారా మూలపాఠ్యంలోని రూపకాన్నీ theological tensionనూ నిలిపాం.
