revisions:
- from: “యేసునైన నేనే, సంఘాల కోసం[a] ఈ విషయాల గురించి మీకు సాక్ష్యమివ్వడానికి నా దూతను పంపాను. నేను దావీదు వేరును, అతని సంతానాన్ని[b]; ప్రకాశవంతమైన వేకువ చుక్కను.”
  to: “యేసునైన నేనే, సంఘాల కొరకు[a] ఈ విషయాలను మీకు సాక్ష్యంగా తెలియజేయడానికి నా దేవదూతను పంపాను. నేను దావీదు వేరును, దావీదు వంశస్థుడిని[b], ప్రకాశవంతమైన వేకువ చుక్కను.”
  rationale: The revision directly renders the content of the testimony, specifies the angel in keeping with Revelation’s context, and improves the Telugu predicate construction. It retains the source text’s unresolved juxtaposition of Davidic source imagery and Davidic descent, as well as the ambiguity noted for ἐπὶ ταῖς ἐκκλησίαις.
