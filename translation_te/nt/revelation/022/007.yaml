id: REV.22.7
reference: Revelation 22:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔρχομαι ταχύ· μακάριος ὁ τηρῶν τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: te
  text: “ఇదిగో, నేను త్వరలో[a] వస్తున్నాను. ఈ గ్రంథంలోని[b] ప్రవచన వాక్యాలను పాటించేవాడు ధన్యుడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వేగంగా.” గ్రీకు పదం రాక కాలపరంగా సమీపంలో ఉందనే భావాన్ని గానీ, అది వేగంగా లేదా అకస్మాత్తుగా జరుగుతుందనే భావాన్ని గానీ నొక్కిచెప్పగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఈ చుట్టలోని.” ప్రాచీన సందర్భంలో ఇక్కడి గ్రీకు పదం వ్రాతచుట్టను సూచించగలదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షించే గ్రీకు సంభాషణ సూచకపు బలాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔρχομαι
  choice: నేను వస్తున్నాను
  rationale: సందర్భంలో భవిష్యదర్థం గల వర్తమాన రూపాన్ని కాపాడుతూ, రాక సమీపంలో ఉందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ταχύ
  choice: త్వరలో
  rationale: ఈ సందర్భంలో ప్రధానంగా కాలసమీపతను తెలియజేస్తుంది; వేగంగా లేదా అకస్మాత్తుగా అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: μακάριος
  choice: ధన్యుడు
  rationale: ఇది కేవలం భావోద్వేగపరమైన సంతోషాన్ని కాక, ధన్యత ప్రకటనలోని ఆధ్యాత్మిక మరియు అంత్యకాలిక బరువును నిలుపుతుంది.
- source_word: ὁ τηρῶν
  choice: పాటించేవాడు
  rationale: తెలుగులో సహజంగా ఉండి, ప్రవచన వాక్యాలను జాగ్రత్తగా ఆచరించడం అనే సందర్భార్థాన్ని తెలియజేస్తుంది; కేవలం వాటిని భౌతికంగా కాపాడటం అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: ప్రవచన వాక్యాలను
  rationale: λόγους అనే బహువచనాన్ని ‘వాక్యాలు’గా నిలుపుతూ, ‘ప్రవచనం’తో ఉన్న సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ βιβλίου τούτου
  choice: ఈ గ్రంథంలోని
  rationale: సంబంధార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. βιβλίον ప్రాచీన సందర్భంలో చుట్టను కూడా సూచించగలదని పాదసూచికలో పేర్కొన్నాం.
theological_decisions:
- issue: ‘నేను త్వరలో వస్తున్నాను’ అని చెప్పే వ్యక్తి గుర్తింపు
  choice: మూలంలోని ప్రథమ పురుష రూపాన్నే ఉంచి, వచనంలో ‘యేసు’ అనే పేరును చేర్చలేదు.
  alternative: వక్తను ‘యేసు’ అని వచనంలోనే స్పష్టంగా పేర్కొనడం.
  rationale: గ్రీకు వాక్యంలో వక్త పేరు లేదు; సాహిత్య సందర్భమే ఆయనను గుర్తించనివ్వడం ద్వారా అనువాదం మూలంలో లేని వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రకటన గ్రంథపు గంభీర ప్రకటన శైలిని నిలిపాం. ‘ఇదిగో’ దృష్టిని ఆకర్షించే మూలపద బలాన్ని కాపాడుతుంది; ‘పాటించేవాడు’ సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా ఎంచుకున్నాం.
