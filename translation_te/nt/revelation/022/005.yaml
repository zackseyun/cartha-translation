id: REV.22.5
reference: Revelation 22:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: te
  text: ఇక రాత్రి ఉండదు; దీపకాంతిగానీ సూర్యకాంతిగానీ వారికి అవసరం ఉండదు[a], ఎందుకంటే ప్రభువైన దేవుడు వారిమీద ప్రకాశిస్తాడు. వారు యుగయుగాలు రాజ్యమేలుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దీపపు వెలుగుగానీ సూర్యుని వెలుగుగానీ.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో, “యుగాల యుగాల వరకు”; ఇది అంతంలేని కాలాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ
  choice: రాత్రి
  rationale: మూలపదపు సాధారణ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: οὐκ ἔσται ἔτι
  choice: ఇక ... ఉండదు
  rationale: ఏదో ఇకపై ఉనికిలో ఉండదనే భావాన్ని సహజంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: οὐκ ἔχουσιν χρείαν
  choice: వారికి అవసరం ఉండదు
  rationale: గ్రీకులో వర్తమాన రూపం ఉన్నప్పటికీ, చుట్టూ ఉన్న భవిష్యత్ క్రియల సందర్భంలో ఇది సంపూర్ణ స్థితిని సూచిస్తుంది; తెలుగు ప్రయోగం ఆ భవిష్యత్ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: φωτὸς λύχνου καὶ φῶς ἡλίου
  choice: దీపకాంతిగానీ సూర్యకాంతిగానీ
  rationale: దీపపు వెలుగు, సూర్యుని వెలుగు అనే రెండు కాంతి మూలాల వ్యత్యాసాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: κύριος ὁ θεός
  choice: ప్రభువైన దేవుడు
  rationale: κύριος అనే బిరుదును ‘ప్రభువు’గా నిలుపుతూ, తెలుగు వాక్యంలో సహజంగా దేవునితో అనుసంధానిస్తుంది.
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: వారిమీద ప్రకాశిస్తాడు
  rationale: ἐπίతో కూడిన దిశాత్మక కాంతి చిత్రాన్ని కాపాడుతుంది; ‘వారికి వెలుగిస్తాడు’ అనే సాధ్యమైన భావాన్నీ పూర్తిగా మూసివేయదు.
- source_word: βασιλεύσουσιν
  choice: రాజ్యమేలుతారు
  rationale: రాజులుగా పరిపాలించడం లేదా ఏలడం అనే క్రియార్థాన్ని సహజమైన బైబిలు తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాలు
  rationale: అంతంలేని కాలవ్యవధిని తెలిపే గ్రీకు నుడికారానికి స్థిరమైన, గంభీరమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: భవిష్యత్ దర్శన సందర్భంలో οὐκ ἔχουσιν χρείαν యొక్క కాలసూచన
  choice: వారికి అవసరం ఉండదు
  alternative: వారికి అవసరం లేదు
  rationale: గ్రీకు క్రియ వర్తమాన రూపంలో ఉన్నా, ἔσται, φωτίσει, βασιλεύσουσιν అనే భవిష్యత్ రూపాల మధ్య దర్శనంలోని రాబోయే స్థితిని వర్ణిస్తుంది. భవిష్యత్ భావం తెలుగులో సందర్భసమ్మతంగా ఉంటుంది.
- issue: φωτίσει ἐπ’ αὐτούςలోని కాంతి సంబంధం
  choice: వారిమీద ప్రకాశిస్తాడు
  alternative: వారికి వెలుగిస్తాడు
  rationale: మొదటి రూపం ἐπ’ αὐτούςలోని ‘వారిమీద’ అనే దిశాత్మక చిత్రాన్ని కాపాడుతుంది; దేవుడే కాంతి మూలమనే వాక్యబలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రకటన గ్రంథపు గంభీరతను నిలిపే శైలి వాడబడింది. ‘దీపకాంతి’, ‘సూర్యకాంతి’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి; ‘యుగయుగాలు రాజ్యమేలుతారు’ శాశ్వత పరిపాలన భావాన్ని సంక్షిప్తంగా వ్యక్తపరుస్తుంది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
