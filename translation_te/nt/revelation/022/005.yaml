  terminology: 'Key terms are well rendered: “ప్రభువైన దేవుడు” preserves κύριος ὁ θεός, “వారిమీద ప్రకాశిస్తాడు” retains the directional image of φωτίσει ἐπ’ αὐτούς, and “రాజ్యమేలుతారు” accurately conveys βασιλεύσουσιν. “యుగయుగాలు” is an established Telugu idiomatic equivalent for the emphatic duration formula.'
