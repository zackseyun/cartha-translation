  source_fidelity: 'The Telugu accurately conveys all clauses of the Greek: the cessation of night, lack of need for lamp and sun light, the Lord God''s shining upon them, and their reigning for the ages of the ages. The future-oriented Telugu is appropriate in this visionary context.'
