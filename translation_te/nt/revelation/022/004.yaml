id: REV.22.4
reference: Revelation 22:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὄψονται τὸ πρόσωπον αὐτοῦ, καὶ τὸ ὄνομα αὐτοῦ ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/004.yaml
  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: te
  text: వారు ఆయన ముఖాన్ని చూస్తారు[a][b]; ఆయన పేరు వారి నుదుటుల మీద ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారు ఆయన ముఖాన్ని దర్శిస్తారు.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఆయన’ అనే ఏకవచన సర్వనామం దేవుణ్ణి సూచించవచ్చు; లేదా సమీప సందర్భంలో దేవుడు మరియు గొర్రెపిల్ల కలిసి పాలించడాన్ని ప్రతిబింబించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψονται
  choice: చూస్తారు
  rationale: ὁράω యొక్క భవిష్యత్ రూపానికి సహజమైన ఆధునిక తెలుగు పదం. ‘దర్శిస్తారు’ అనే పదం సాధ్యమైనా, అది మూలంలో లేని భక్తిపరమైన లేదా గౌరవార్థక ఛాయను కలిగించవచ్చు.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: ఆయన ముఖాన్ని
  rationale: πρόσωπον యొక్క ప్రాథమిక అర్థమైన ‘ముఖం’ను నిలుపుతుంది; ὄψονταιకు ప్రత్యక్ష కర్మగా ఉండటం వల్ల ‘సన్నిధి’కన్నా ఇదే సముచితం. αὐτοῦను నామవాచకంతో స్పష్టీకరించకుండా గౌరవ ఏకవచన సర్వనామంగా అనువదించాం.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ఆయన పేరు
  rationale: ὄνομαకు నేరమైన సమానార్థకం ‘పేరు’. గుర్తింపు, యాజమాన్యం, స్వభావం వంటి అంతర్భావాలను ప్రధాన వాక్యంలో అదనంగా చేర్చలేదు.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: వారి నుదుటుల మీద
  rationale: ἐπί + షష్ఠీ ఇక్కడ ఉపరితలంపై ఉన్న స్థానాన్ని సూచిస్తుంది. బహువచనమైన μετώπωνను ‘నుదుటుల’గా నిలిపి, సహజ తెలుగులో ‘మీద’ అని అనువదించాం.
- source_word: καὶ
  choice: వారు …; ఆయన …
  rationale: మొదటి καί ముందరి వాక్యంతో అనుసంధానిస్తుంది; ఈ ఒక్క వచనాన్ని స్వతంత్రంగా చదివినప్పుడు తెలుగులో దాన్ని ప్రత్యేకంగా ‘మరియు’ అని పెట్టకపోవడం సహజం. రెండవ καίతో అనుసంధానమైన సమాంతర వాక్యాలను అర్థవిరామ చిహ్నంతో కలిపాం.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: గ్రీకు ఏకవచన సర్వనామాన్ని అలాగే నిలిపి, దాని సూచిత వ్యక్తిని ‘దేవుడు’ లేదా ‘గొర్రెపిల్ల’ అని అనువాదంలో నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: ‘ఆయన ముఖం’, ‘ఆయన పేరు’లోని ఏకవచన సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ‘ఆయన’ అనే సర్వనామాన్నే నిలిపి, సూచిత వ్యక్తిని ప్రధాన వాక్యంలో నిర్దిష్టం చేయలేదు.
  alternative: దేవుడు; లేదా సమీప సందర్భంలో కలిసి ప్రస్తావించబడిన దేవుడు మరియు గొర్రెపిల్ల యొక్క పంచుకున్న దైవిక పరిపాలనను ప్రతిబింబించే సూచన.
  rationale: ప్రకటన 22:3లో దేవుడు మరియు గొర్రెపిల్ల సన్నిహితంగా కలిసి ప్రస్తావించబడతారు; 22:4లో మాత్రం αὐτοῦ ఏకవచనంగా ఉంది. మూలపాఠంలోని ఈ ఉద్దేశ్యపూర్వక సూచనాత్మక ఉద్రిక్తతను అనువాదం ఏ ఒక్క వైపుకూ పరిమితం చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘చూస్తారు’ సహజమైన పదంగా ఎంచుకోబడింది; ‘దర్శిస్తారు’ను పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇచ్చాం. సర్వనామ సూచనలోని మూలపాఠపు సందిగ్ధతను నిలిపాం.
