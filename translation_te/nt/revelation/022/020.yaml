  to: 'ఈ సంగతుల గురించి సాక్ష్యమిచ్చేవాడు ఇలా చెబుతున్నాడు: “అవును, నేను త్వరలో వస్తున్నాను[a].” ఆమేన్. ప్రభువా, యేసూ, రండి!'
