id: REV.22.20
reference: Revelation 22:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λέγει ὁ μαρτυρῶν ταῦτα· Ναί· ἔρχομαι ταχύ. Ἀμήν· ⸀ἔρχου, κύριε Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/020.yaml
  text: The one who testifies to these things says[a], “Yes, I am coming soon.” Amen. Come, Lord Jesus.
translation:
  language: te
  text: 'ఈ సంగతుల గురించి సాక్ష్యమిచ్చేవాడు ఇలా చెబుతున్నాడు: “అవును, నేను త్వరలో వస్తున్నాను[a].” ఆమేన్. ప్రభువా, యేసూ, రండి!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను వేగంగా వస్తున్నాను.” గ్రీకు క్రియావిశేషణం కాలపరంగా రాక సమీపంలో ఉందనో, రాక వేగంగా జరుగుతుందనో సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: చెబుతున్నాడు
  rationale: గ్రీకు వర్తమానకాల క్రియను తెలుగులో సహజమైన వర్తమాన వాక్యప్రవేశంగా అనువదించింది.
- source_word: ὁ μαρτυρῶν
  choice: సాక్ష్యమిచ్చేవాడు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతం, ఈ సంగతులకు సాక్ష్యమిచ్చే వ్యక్తిని సూచిస్తుంది; సాక్ష్యానికి సంబంధించిన భావాన్ని నిలుపుతుంది.
- source_word: ταῦτα
  choice: ఈ సంగతుల గురించి
  rationale: బహువచన సూచన సర్వనామం ఇంతవరకు వెల్లడించిన విషయాలను సూచిస్తుంది; తెలుగులో ‘గురించి’తో ప్రయోగించడం సహజంగా ఉంది.
- source_word: Ναί
  choice: అవును
  rationale: సూటియైన ధృవీకరణను అలంకారరహితంగా వ్యక్తం చేస్తుంది.
- source_word: ἔρχομαι
  choice: నేను వస్తున్నాను
  rationale: భవిష్యదర్థం గల గ్రీకు వర్తమాన రూపాన్ని తెలుగులో సహజమైన సమీప భవిష్యత్ భావంతో అందిస్తుంది.
- source_word: ταχύ
  choice: త్వరలో
  rationale: ఈ సందర్భంలో కాలసామీప్య భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘వేగంగా’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: Ἀμήν
  choice: ఆమేన్
  rationale: ప్రార్థనాత్మక సమ్మతిని తెలిపే సంప్రదాయ, సులభంగా గుర్తించగల రూపాన్ని నిలుపుతుంది.
- source_word: ἔρχου
  choice: రండి
  rationale: ఏకవచన ఆజ్ఞార్థక విజ్ఞప్తిని యేసును గౌరవంగా సంబోధించే ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: κύριε
  choice: ప్రభువైన
  rationale: యేసుకు వాడిన κύριος బిరుదును ‘ప్రభువు’గా నిలుపుతూ, ప్రత్యక్ష సంబోధనలో తెలుగుకు సహజమైన నిర్మాణాన్ని ఇస్తుంది.
- source_word: Ἰησοῦ
  choice: యేసూ
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు రూపంలో, ప్రత్యక్ష సంబోధనకు తగిన విభక్తితో అందిస్తుంది.
theological_decisions:
- issue: క్రీస్తు రాకడ వాగ్దానంలో ταχύ యొక్క భావం
  choice: త్వరలో
  alternative: వేగంగా / త్వరగా
  rationale: ταχύ కాలపరమైన సమీపతను లేదా రాక/చర్య వేగాన్ని సూచించగలదు. ముగింపు సందర్భంలో ‘త్వరలో’ సహజంగా ఉన్నప్పటికీ, అంత్యకాల సంబంధమైన వ్యాఖ్యాన భేదాన్ని పరిష్కరించకుండా ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైనప్పటికీ గౌరవప్రదమైన శైలి. యేసుకు ప్రత్యక్ష సంబోధనలో గౌరవ బహువచన క్రియారూపం వాడబడింది; మూలంలోని సంక్షిప్తత, ప్రత్యుత్తర నిర్మాణం నిలుపబడ్డాయి.
