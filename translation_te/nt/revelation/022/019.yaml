id: REV.22.19
reference: Revelation 22:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: te
  text: ఈ ప్రవచన గ్రంథంలోని మాటల నుండి ఎవరైనా ఏదైనా తీసివేస్తే, ఈ గ్రంథంలో వ్రాయబడి ఉన్న జీవవృక్షం[a] నుండి, పవిత్ర నగరం నుండి అతనికి దక్కే భాగాన్ని దేవుడు తీసివేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘జీవవృక్షం’ స్థానంలో ‘జీవగ్రంథం’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἀφέλῃ / ἀφελεῖ
  choice: తీసివేస్తే / తీసివేస్తాడు
  rationale: షరతులోని క్రియకూ దానికి ప్రతిగా దేవుడు చేసే కార్యానికీ ఒకే తెలుగు క్రియను వాడడం ద్వారా మూలంలోని ఉద్దేశపూర్వక సమాంతరతను నిలుపుతుంది.
- source_word: λόγων
  choice: మాటలలో నుంచి
  rationale: ఇక్కడ ప్రవచనంలోని వాచిక విషయాన్ని సూచిస్తుంది; ‘మాటలు’ సహజమైనదీ ప్రత్యక్షమైనదీ.
- source_word: βιβλίου
  choice: గ్రంథం
  rationale: గంభీరమైన లిఖిత రచనను సూచించడానికి ఆధునిక ప్రామాణిక తెలుగులో ‘గ్రంథం’ సహజంగా సరిపోతుంది.
- source_word: προφητείας
  choice: ప్రవచన
  rationale: రచన యొక్క ప్రవచన స్వభావాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: μέρος
  choice: భాగం
  rationale: జీవవృక్షంలోనూ పవిత్ర నగరంలోనూ వ్యక్తికి ఉన్న పాలును లేదా హక్కును సూచించే మూలపదపు విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ξύλου τῆς ζωῆς
  choice: జీవవృక్షం
  rationale: ప్రకటన 22 సమీప సందర్భంలోని అపోకలిప్టిక్ వృక్షాన్ని స్పష్టంగా సూచించే స్థిరమైన తెలుగు రూపం.
- source_word: πόλεως τῆς ἁγίας
  choice: పవిత్ర నగరం
  rationale: నిర్దిష్టమైన అపోకలిప్టిక్ నగరానికి సహజమైన, గౌరవప్రదమైన అనువాదం.
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: ఈ గ్రంథంలో రాసి ఉన్న
  rationale: పరిపూర్ణ కర్మణి భావాన్ని కాపాడుతూ, జీవవృక్షం మరియు పవిత్ర నగరం రెండింటినీ విశేషించేలా సహజమైన తెలుగు పదక్రమంలో ఉంచుతుంది.
theological_decisions:
- issue: ‘జీవవృక్షం’కు బదులుగా ‘జీవగ్రంథం’ అనే పాఠాంతరం
  choice: జీవవృక్షం
  alternative: జీవగ్రంథం
  rationale: ఇచ్చిన SBLGNT పాఠంలో ξύλου τῆς ζωῆς (‘జీవవృక్షం’) ఉంది; ఇది ప్రకటన 22 తక్షణ సందర్భానికీ సరిపోతుంది. ప్రసిద్ధమైన ‘జీవగ్రంథం’ పాఠాంతరాన్ని ప్రధాన పాఠంలో స్వీకరించకుండా పాదసూచికలో భద్రపరచడం సముచితం.
- issue: τῶν γεγραμμένων అనే బహువచన సంబంధం
  choice: జీవవృక్షం మరియు పవిత్ర నగరం రెండూ ఈ గ్రంథంలో రాసి ఉన్నవిగా అనుసంధానం
  alternative: పవిత్ర నగరానికి మాత్రమే అనుసంధానం
  rationale: గ్రీకు బహువచన రూపం ముందున్న రెండు అంశాలను సమష్టిగా సూచించడానికి అనుకూలంగా ఉంది; తెలుగు వాక్యనిర్మాణం ఆ సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, హెచ్చరిక యొక్క గంభీరతను నిలిపేలా రూపొందించబడింది. పాదసూచిక గుర్తు సంబంధిత పాఠాంతర పదబంధం తరువాత కాకుండా వాక్యాంతంలో ఉంచబడింది; అయినా అది ప్రధాన పాఠంలో స్పష్టంగా కనిపిస్తుంది.
