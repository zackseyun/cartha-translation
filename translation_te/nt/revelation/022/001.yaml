id: REV.22.1
reference: Revelation 22:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: te
  text: మరియు అతడు దేవుని మరియు గొర్రెపిల్ల యొక్క సింహాసనం నుండి ప్రవహిస్తున్న, స్ఫటికంలా ప్రకాశించే జీవజల నదిని నాకు చూపించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: నాకు చూపించాడు
  rationale: దర్శన సందర్భంలో δείκνυμι యొక్క సాధారణ అర్థమైన ‘చూపించడం’ను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; μοι దత్తివును ‘నాకు’గా నేరుగా నిలుపుతుంది.
- source_word: ποταμὸν
  choice: నదిని
  rationale: ποταμός సూచించే పెద్ద జలప్రవాహానికి ‘నది’ సరైన సమానార్థకం. తెలుగులో విభక్తి నిర్మాణమే అనిర్దిష్టతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὕδατος ζωῆς
  choice: జీవజల
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని సంక్షిప్తంగా, బైబిలు ప్రతీకను నిలుపుతూ వ్యక్తం చేస్తుంది; ‘జీవాన్నిచ్చే నీరు’ అనే వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: λαμπρὸν ὡς κρύσταλλον
  choice: స్ఫటికంలా ప్రకాశించే
  rationale: λαμπρός యొక్క ప్రధాన భావమైన వెలుగు/ప్రకాశాన్ని ‘ప్రకాశించే’గా, ὡς యొక్క ఉపమానాన్ని ‘లా’గా నిలుపుతుంది; ‘నిర్మలమైన’ అని పారదర్శకత భావాన్ని మాత్రమే ముందుకు తేవదు.
- source_word: ἐκπορευόμενον
  choice: ప్రవహిస్తున్న
  rationale: నదికి తగిన చలనాన్ని సహజంగా తెలియజేస్తూ వర్తమాన కృదంత భావాన్ని నిలుపుతుంది.
- source_word: ἐκ τοῦ θρόνου
  choice: సింహాసనం నుండి
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవస్థానాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: దేవుని మరియు గొర్రెపిల్ల యొక్క
  rationale: రెండు సమన్విత షష్ఠీ పదబంధాలను ఏకవచన ‘సింహాసనం’తో అనుసంధానిస్తుంది; ప్రకటన గ్రంథంలోని ἀρνίον అనే బిరుదు, బలిపశు ప్రతీకను ‘గొర్రెపిల్ల’ నిలుపుతుంది.
theological_decisions:
- issue: దేవునికీ గొర్రెపిల్లకీ సంబంధించిన ఒకే సింహాసనం
  choice: దేవుని మరియు గొర్రెపిల్ల యొక్క సింహాసనం
  alternative: దేవునికీ గొర్రెపిల్లకీ ఉమ్మడిగా చెందిన సింహాసనం; దేవుని మరియు గొర్రెపిల్ల సింహాసనాలు
  rationale: గ్రీకులో ‘సింహాసనం’ ఏకవచనంలో ఉండి, దానికి దేవుడు మరియు గొర్రెపిల్ల అనే రెండు షష్ఠీ పదాలు జతచేయబడ్డాయి. అనువాదం ఈ నిర్మాణాన్నీ దాని దేవశాస్త్రీయ ఉద్వేగాన్నీ వివరణ జోడించకుండా నిలుపుతుంది; బహువచనం మూలపాఠానికి విరుద్ధం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; దర్శన వర్ణనకు తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే పదక్రమం. మూలంలో నిజమైన పాఠాంతర లేదా అర్థసందిగ్ధతకు అవసరమైన గమనిక లేనందున పాదగమనికలు చేర్చలేదు; అందువల్ల ప్రధాన పాఠంలో పాదగమనిక గుర్తులు లేవు.
