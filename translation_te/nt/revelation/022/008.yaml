id: REV.22.8
reference: Revelation 22:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: te
  text: నేను, యోహాను, ఈ సంగతులను వింటూ చూస్తున్నవాడను. నేను విని చూసినప్పుడు, వీటిని నాకు చూపిస్తున్న దేవదూత పాదాల ముందు ఆరాధించడానికి[a] సాగిలపడ్డాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముందు సాగిలపడడానికి,’ ‘గౌరవం చెల్లించడానికి.’ గ్రీకు క్రియ నేలపై వంగడం లేదా భక్తిపూర్వక గౌరవం చూపడాన్ని సూచించగలదు. ప్రకటన గ్రంథంలో దానికి తరచుగా ఉన్న భావం, తరువాత వచ్చే గద్దింపు దృష్ట్యా ఇక్కడ ‘ఆరాధించడానికి’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ Ἰωάννης
  choice: యోహానును నేనే
  rationale: καί యొక్క కథన అనుసంధానాన్ని సందర్భానుసారంగా సహజ తెలుగు ప్రవాహంలో ఉంచుతూ, వ్యక్తమైన ἐγώ ఇచ్చే ఉద్ఘాటనను ‘నేనే’తో నిలిపింది.
- source_word: ὁ ἀκούων καὶ βλέπων ταῦτα
  choice: ఈ సంగతులను వింటూ చూస్తున్న
  rationale: వర్తమాన కృదంతాల కొనసాగుతున్న భావాన్ని ‘వింటూ చూస్తున్న’ ద్వారా కాపాడి, వాటిని సాధారణ భూతకాలంగా మార్చలేదు.
- source_word: ταῦτα
  choice: ఈ సంగతులు / వీటిని
  rationale: బహువచన సూచక సర్వనామాన్ని నిలిపి, ముందున్న దర్శనాలు మరియు ప్రకటనలను సూచించే సహజ తెలుగు రూపాలను వాడింది.
- source_word: ὅτε ἤκουσα καὶ ἔβλεψα
  choice: నేను విని చూసినప్పుడు
  rationale: ὅτε ను కాలసూచకమైన ‘చేసినప్పుడు’గా, రెండు ఆఓరిస్ట్ క్రియలను సహజ భూతకాల క్రియారూపాలుగా అందించింది; ‘తర్వాత’ అని క్రమాన్ని అధికంగా నిర్దిష్టం చేయలేదు.
- source_word: ἔπεσα
  choice: సాగిలపడ్డాను
  rationale: ఆరాధన లేదా గౌరవార్థం నేలపై పడే శారీరక చర్యను సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: προσκυνῆσαι
  choice: ఆరాధించడానికి
  rationale: ప్రకటన గ్రంథంలో ఈ క్రియకు సాధారణంగా ఉన్న ఆరాధనా బలాన్ని నిలిపింది; వెంటనే వచ్చే గద్దింపు వల్ల ఉత్పన్నమయ్యే ఉద్రిక్తతను మృదువుచేయలేదు.
- source_word: ἔμπροσθεν τῶν ποδῶν
  choice: పాదాల ముందు
  rationale: ἔμπροσθεν యొక్క ‘ముందు’ భావాన్ని, ‘పాదాలు’ అనే స్పష్టమైన నామవాచకాన్ని రెండింటినీ నిలిపింది.
- source_word: τοῦ ἀγγέλου
  choice: దేవదూత
  rationale: ఇక్కడ పరలోక సంబంధమైన వ్యక్తి స్పష్టంగా ఉద్దేశించబడినందున స్థిరమైన తెలుగు పదమైన ‘దేవదూత’ను ఎంచుకుంది.
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: వీటిని నాకు చూపిస్తున్న
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న/అసంపూర్ణ క్రియాభావాన్ని ‘చూపిస్తున్న’తో నిలిపింది.
theological_decisions:
- issue: దేవదూతవైపు ఉద్దేశించిన προσκυνέω చర్య స్వభావం
  choice: ఆరాధించడానికి
  alternative: ముందు సాగిలపడడానికి; గౌరవం చెల్లించడానికి
  rationale: προσκυνέω శారీరకంగా సాగిలపడడం లేదా గౌరవం చూపడం అనే భావాలనూ కలిగి ఉండవచ్చు. అయితే ప్రకటన గ్రంథంలోని దాని సాధారణ బలం మరియు తరువాతి వచనంలోని గద్దింపు దృష్ట్యా, ప్రధాన పాఠ్యంలో ‘ఆరాధించడానికి’ అని ఇవ్వడం కథనంలోని వేదాంతపరమైన ఉద్రిక్తతను ముందుగానే పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. వర్తమాన కృదంతాల కొనసాగుతున్న భావం నిలిపబడింది; ‘ఆరాధన’ అనే పదాన్ని మృదువుచేయకుండా, ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో తెలిపింది.
