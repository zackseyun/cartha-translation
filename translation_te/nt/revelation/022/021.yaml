  text: The grace of the Lord Jesus be with all[a].
translation:
  language: te
  text: ప్రభువైన యేసు కృప అందరితో ఉండుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని గ్రంథప్రతుల్లో, “ప్రభువైన యేసు కృప పరిశుద్ధులందరితో ఉండుగాక” అని, మరికొన్నింటిలో “మీ అందరితో ఉండుగాక” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: కొత్త నిబంధనలో ఆశీర్వాదపూర్వక ముగింపుల్లో వాడే స్థిరమైన, గౌరవప్రదమైన పదం; దేవుని అనుగ్రహ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువైన
  rationale: యేసుకు సంబంధించిన బిరుదుగా κύριοςను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: μετὰ
  choice: తో ఉండుగాక
  rationale: గ్రీకులో క్రియ లేకపోయినా ఇది ముగింపు ఆశీర్వాద సూత్రం; తెలుగులో దాని ఆశీర్వాద భావాన్ని సహజంగా తెలియజేయడానికి ‘ఉండుగాక’ను పూరించాం.
- source_word: πάντων
  choice: అందరితో
  rationale: మూలపాఠంలోని విస్తృతమైన, నిర్దిష్టీకరించని ‘అందరు’ అనే భావాన్ని ‘మీ అందరితో’ లేదా ‘పరిశుద్ధులందరితో’ అని పరిమితం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ఆశీర్వాదాన్ని పొందేవారిని నిర్దిష్టంగా పేర్కొనాలా
  choice: ‘అందరితో’ అని మాత్రమే ఉంచడం
  alternative: ‘మీ అందరితో’ లేదా ‘పరిశుద్ధులందరితో’
  rationale: SBLGNT పాఠం πάντων (‘అందరు’) అని మాత్రమే ఉంది. గ్రంథప్రతుల భేదాల్లో కనిపించే గ్రహీతల నిర్దిష్టీకరణను ప్రధాన పాఠంలో చేర్చకుండా, మూలంలోని విస్తృతతను మరియు అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రకటన గ్రంథపు చివరి ఆశీర్వాదానికి తగిన గౌరవప్రదమైన, సహజమైన శైలి. ‘ఉండుగాక’ ఆశీర్వాద స్వరాన్ని స్పష్టంగా ఉంచుతుంది.
