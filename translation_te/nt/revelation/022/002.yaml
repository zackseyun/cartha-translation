id: REV.22.2
reference: Revelation 22:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: te
  text: దాని వీధి మధ్యలోనూ, నదికి ఇటువైపునా అటువైపునా[a] జీవవృక్షం ఉంది. అది పన్నెండు ఫలాలను[b] కాస్తూ, ప్రతి నెలా తన ఫలాన్ని ఇస్తుంది.[c] ఆ వృక్షపు ఆకులు జాతుల స్వస్థత కోసం ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు వాక్యం జీవవృక్షాన్ని వీధి మధ్యలోనూ నదికి ‘ఇటువైపునా అటువైపునా’ ఉన్నట్లుగా సంక్షిప్తంగా వర్ణిస్తుంది. దీనిని ‘నదికి ఇరువైపులా’ అని కూడా అనువదించవచ్చు.
    reason: syntactical_ambiguity
  - marker: b
    text: లేదా, ‘పన్నెండు రకాల ఫలాలను.’ గ్రీకులో అక్షరార్థంగా ‘పన్నెండు ఫలాలు’ అని ఉంది; ఇది పన్నెండు రకాల ఫలాలను లేదా పన్నెండు ఫలదిగుబడులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఈ దృశ్యం ఆదికాండం 2:9లోని జీవవృక్షాన్ని, యెహెజ్కేలు 47:12లో ప్రతి నెలా ఫలించి స్వస్థతనిచ్చే ఆకులుగల వృక్షాలను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ τῆς πλατείας αὐτῆς
  choice: దాని వీధి మధ్యలోనూ
  rationale: πλατεία విశాలమైన వీధిని లేదా బహిరంగ కూడలిని సూచించగలదు. నగర దృశ్యంలో సహజంగా ఉండే ‘వీధి’ని ఎంచుకొని, αὐτῆςను ‘దాని’గా నిలిపాం.
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: ఇటువైపునా అటువైపునా
  rationale: నదికి సంబంధించిన రెండు వైపుల స్థల సూచనను సూటిగా నిలుపుతుంది; దృశ్యాన్ని అదనంగా పునర్వ్యవస్థీకరించదు.
- source_word: ξύλον ζωῆς
  choice: జీవవృక్షం
  rationale: ξύλονకు ‘చెక్క’ అనే అర్థమూ ఉన్నా, ఆదికాండం నేపథ్యం మరియు వృక్షసంబంధ సందర్భం ‘వృక్షం’ను స్పష్టం చేస్తాయి. సుపరిచితమైన ఏదేను ప్రతిరూపాన్ని సూచించేందుకు ‘జీవవృక్షం’ సహజం.
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: పన్నెండు ఫలాలను ఫలిస్తూ
  rationale: గ్రీకు పాఠ్యంలో ‘రకాలు’ అనే పదం లేదు. అందువల్ల దానిని ప్రధాన పాఠ్యంలో చేర్చకుండా, పన్నెండు ఫలాలు/ఫలదిగుబడులు అనే భావాన్ని దగ్గరగా ఉంచాం.
- source_word: κατὰ μῆνα ἕκαστον ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: ప్రతి నెలా తన ఫలాన్ని ఇస్తుంది
  rationale: నెలనెలా క్రమంగా ఫలాన్ని ఇచ్చే పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὰ φύλλα τοῦ ξύλου
  choice: ఆ వృక్షపు ఆకులు
  rationale: సాధారణ వృక్షశాస్త్ర పదప్రయోగాన్ని, ముందున్న ఏకవచన వృక్షంతో సంబంధాన్ని నిలుపుతుంది.
- source_word: εἰς θεραπείαν τῶν ἐθνῶν
  choice: జాతుల స్వస్థత కోసం
  rationale: εἰς యొక్క ప్రయోజనార్థక భావాన్ని ‘కోసం’ నిలుపుతుంది. θεραπείαను ‘స్వస్థత’గా, ἔθνηను విస్తృత ప్రజాసమూహాలైన ‘జాతులు’గా అనువదించాం.
theological_decisions:
- issue: వీధి, నది రెండు వైపులు, ఏకవచన జీవవృక్షం మధ్యనున్న సంక్షిప్త స్థలవర్ణన
  choice: ఏకవచన ‘జీవవృక్షం’ను ఉంచి, అది వీధి మధ్యలోనూ నదికి ఇటువైపునా అటువైపునా ఉన్నట్లు గ్రీకు వాక్యంలోని సంక్షిప్త దృశ్యాన్ని నిలిపాం.
  alternative: భౌగోళికంగా సులభంగా అర్థమయ్యేలా ‘నదికి ఇరువైపులా జీవవృక్షాలు ఉన్నాయి’ అని బహువచనంలో పునర్వ్యవస్థీకరించడం.
  rationale: గ్రీకు పాఠ్యం ξύλονను ఏకవచనంలో ఉంచుతుంది; అది ఆదికాండంలోని జీవవృక్ష ప్రతిధ్వనికి కూడా అనుగుణం. దర్శనంలోని స్థలసంబంధ ఉద్రిక్తతను పరిష్కరించకుండా నిలపడం సముచితం.
- issue: ‘పన్నెండు ఫలాలు’ అనే పదబంధం యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘పన్నెండు ఫలాలు’ అని సూటిగా ఉంచి, సాధ్యమైన ‘పన్నెండు రకాల ఫలాలు’ లేదా పన్నెండు ఫలదిగుబడుల భావాన్ని పాదసూచికలో తెలిపాం.
  alternative: ప్రధాన పాఠ్యంలోనే ‘పన్నెండు రకాల ఫలాలు’ అని స్పష్టీకరించడం.
  rationale: καρποὺς δώδεκα అక్షరార్థంగా పన్నెండు ఫలాలు అని ఉంటుంది; ‘రకాలు’ సందర్భానుకూలమైన సాధ్యతే కాని గ్రీకులో ప్రత్యక్షంగా లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘జీవవృక్షం,’ ‘జాతుల స్వస్థత’ వంటి బైబిలు భావపదాలను నిలుపుతూ, పాతకాలపు క్రియారూపాలను నివారించాం. దర్శనంలోని ఉద్దేశపూర్వక స్థల అస్పష్టతను సాఫీ చేయలేదు.
