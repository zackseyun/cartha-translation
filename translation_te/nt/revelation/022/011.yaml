id: REV.22.11
reference: Revelation 22:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ⸀ῥυπαρευθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: te
  text: అన్యాయం చేసేవాడు ఇంకా అన్యాయం చేయనివ్వండి; అపవిత్రుడు ఇంకా అపవిత్రపరచబడనివ్వండి[a]; నీతిమంతుడు ఇంకా నీతిని ఆచరించనివ్వండి[b]; పరిశుద్ధుడు ఇంకా పరిశుద్ధపరచబడనివ్వండి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అపవిత్రుడు ఇంకా అపవిత్రుడిగానే ఉండనివ్వండి.” గ్రీకులో క్రియ కర్మణి రూపంలో ఉంది; దాన్ని ఇక్కడ “అపవిత్రపరచబడనివ్వండి” అని అనువదించారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “న్యాయాన్ని ఆచరించనివ్వండి.” δικαιοσύνη అనే గ్రీకు పదానికి సందర్భానుసారం “నీతి” లేదా “న్యాయం” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “పరిశుద్ధుడు ఇంకా పరిశుద్ధుడిగానే ఉండనివ్వండి.” గ్రీకు క్రియ కర్మణి రూపంలో ఉంది; “పరిశుద్ధపరచబడనివ్వండి” అంటే “పరిశుద్ధుడిగా చేయబడనివ్వండి” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν … ἀδικησάτω ἔτι
  choice: అన్యాయం చేసేవాడు ఇంకా అన్యాయం చేయనివ్వండి
  rationale: వర్తమాన కృదంతంలోని క్రియాత్మక భావాన్ని, మూడవ పురుష ఆజ్ఞార్థక రూపాన్ని నిలుపుతుంది. ἔτιని ‘ఇంకా’గా అనువదించడం కొనసాగింపు లేదా పట్టుదలను తెలియజేస్తుంది.
- source_word: ὁ ῥυπαρός … ῥυπαρευθήτω ἔτι
  choice: అపవిత్రుడు ఇంకా అపవిత్రపరచబడనివ్వండి
  rationale: ῥυπαρόςలోని నైతిక మలినత, అపవిత్రత భావాలను ‘అపవిత్రుడు’ తెలియజేస్తుంది. ῥυπαρευθήτω కర్మణి ఆజ్ఞార్థక రూపాన్ని అసహజతను అతిగా పెంచకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι
  choice: నీతిమంతుడు ఇంకా నీతిని ఆచరించనివ్వండి
  rationale: δίκαιος–δικαιοσύνη పదసంబంధాన్ని ‘నీతిమంతుడు–నీతి’గా నిలుపుతూ, ποιέωతో ఏర్పడిన నైతిక ప్రవర్తన భావాన్ని సహజమైన ‘ఆచరించు’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: ὁ ἅγιος ἁγιασθήτω ἔτι
  choice: పవిత్రుడు ఇంకా పవిత్రపరచబడనివ్వండి
  rationale: ἅγιος–ἁγιάζω పదసంబంధాన్ని నిలుపుతుంది; కర్మణి ఆజ్ఞార్థక రూపాన్ని ‘పవిత్రపరచబడనివ్వండి’గా వ్యక్తం చేసి కర్తృత్వాన్ని నిర్దిష్టం చేయదు.
theological_decisions:
- issue: అంతిమ నైతిక స్థిరత్వ సందర్భంలోని ఆజ్ఞార్థక భావం
  choice: నాలుగు క్రియలనూ మూడవ పురుష ఆజ్ఞార్థకాలుగా ‘…నివ్వండి’ అని అనువదించడం.
  alternative: ‘అన్యాయం చేసేవాడు ఇంకా అన్యాయం చేస్తాడు…’ అనే భవిష్యదర్థక ప్రకటనగా అనువదించడం.
  rationale: గ్రీకు రూపాలు సూచనార్థకాలు కాక ఆజ్ఞార్థకాలు. ఈ మాటలు చెడును ఆమోదిస్తున్నట్లు వివరణ జోడించకుండా, సందర్భంలోని గంభీరమైన న్యాయతీర్పు ఉద్రిక్తతను యథాతథంగా ఉంచుతాయి.
- issue: ῥυπαρευθήτω మరియు ἁγιασθήτω యొక్క కర్మణి ప్రయోగం
  choice: ‘అపవిత్రపరచబడనివ్వండి,’ ‘పవిత్రపరచబడనివ్వండి’ అంటూ కర్మణి రూపాన్ని నిలుపడం.
  alternative: ‘అపవిత్రుడు ఇంకా అపవిత్రుడిగానే ఉండనివ్వండి,’ ‘పవిత్రుడు ఇంకా పవిత్రుడిగానే ఉండనివ్వండి.’
  rationale: రెండు గ్రీకు క్రియలూ కర్మణి ఆజ్ఞార్థకాలు. కర్మణి రూపాన్ని నిలపడం ద్వారా క్రియకు కారకుడు ఎవరో పేర్కొనకుండా మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. నాలుగు సమాంతర వాక్యభాగాల నిర్మాణం, పునరావృతమైన ‘ఇంకా,’ ఆజ్ఞార్థక బలం, రెండు కర్మణి క్రియల అస్పష్ట కర్తృత్వం కాపాడబడ్డాయి.
