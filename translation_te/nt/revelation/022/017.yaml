id: REV.22.17
reference: Revelation 22:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: te
  text: ఆత్మ మరియు వధువు, “రా” అని అంటున్నారు. వినేవాడు కూడా “రా” అనాలి. దాహంతో ఉన్నవాడు రావాలి[b]; కోరుకునేవాడు[c] జీవజలాన్ని ఉచితంగా[a] తీసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎలాంటి ధర చెల్లించకుండా” లేదా “కానుకగా.”
    reason: δωρεάν అనే పదంలో ఉచితంగా, ధర లేకుండా, కానుకగా అనే పరస్పర సంబంధిత భావాలు ఉన్నాయి.
  - marker: b
    text: మొదటి రెండు “రా” పిలుపులు సాధారణంగా ప్రభువు రావాలని చేసే విజ్ఞప్తిగా అర్థం చేసుకుంటారు; తరువాతి మాటలు దాహంతో ఉండి కోరుకునే వ్యక్తిని వచ్చి జీవజలాన్ని స్వీకరించమని ఆహ్వానిస్తాయి.
    reason: సంబోధితునిలో సంభవించే మార్పును ప్రధాన పాఠ్యంలో తేల్చకుండా ప్రత్యామ్నాయ పఠనాన్ని తెలియజేస్తుంది.
  - marker: c
    text: లేదా, “ఇష్టపడేవాడు”; మరొక విధంగా, “దానిని కోరుకునేవాడు.”
    reason: ὁ θέλων కోరిక లేదా ఇష్టాన్ని సూచిస్తుంది; రెండవ రూపం తెలుగులో ఉద్దేశిత కర్మను స్పష్టం చేసినా, ఆ కర్మ గ్రీకులో ప్రత్యక్షంగా లేదు.
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: సందర్భంలో ఇది పరిశుద్ధాత్మను సూచించడం అత్యంత సహజం. గ్రీకులో ప్రత్యేక పెద్ద అక్షర రూపం లేకపోయినా, తెలుగులో ‘ఆత్మ’ అనే రూపమే సందర్భార్థాన్ని సహజంగా మోస్తుంది.
- source_word: ἡ νύμφη
  choice: వధువు
  rationale: ప్రకటన గ్రంథంలోని ప్రతీకను ‘సంఘం’ లేదా ‘దేవుని ప్రజలు’ అని విప్పి చెప్పకుండా యథాతథంగా నిలుపుతుంది.
- source_word: λέγουσιν
  choice: అంటున్నారు
  rationale: వర్తమానకాలంలోని సజీవమైన, కొనసాగుతున్న ప్రకటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἔρχου
  choice: రా
  rationale: ఇది ఏకవచన ద్వితీయ పురుష ఆజ్ఞార్థకం. సంబోధితుడు పాఠ్యంలో స్పష్టంగా చెప్పబడనందున ఏ పేరునూ చేర్చలేదు.
- source_word: ὁ ἀκούων
  choice: వినేవాడు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతాన్ని సంక్షిప్తమైన సాధారణ ఏకవచన రూపంలో నిలుపుతుంది.
- source_word: εἰπάτω
  choice: అనాలి
  rationale: తృతీయ పురుష ఆజ్ఞార్థక భావాన్ని సహజమైన తెలుగు విధ్యర్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ὁ διψῶν
  choice: దాహంతో ఉన్నవాడు
  rationale: మూలంలోని దాహం అనే రూపకాన్ని వ్యాఖ్యానించకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: ἐρχέσθω
  choice: రావాలి
  rationale: తృతీయ పురుష ఆజ్ఞార్థకంలోని ఆహ్వాన/ఆదేశ బలాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ὁ θέλων
  choice: కోరుకునేవాడు
  rationale: θέλω లోని కోరిక లేదా అభిలాష భావాన్ని నిలుపుతూ, మూలంలో లేని ‘దానిని’ అనే కర్మను చేర్చదు.
- source_word: λαβέτω
  choice: తీసుకోవాలి
  rationale: λαμβάνω లోని ‘తీసుకో/పొందు’ భావాలలో, నీటిని స్వీకరించే చిత్రానికి మరియు సమాంతర ఆజ్ఞార్థక నిర్మాణానికి ‘తీసుకోవాలి’ సరిపోతుంది.
- source_word: ὕδωρ ζωῆς
  choice: జీవజలం
  rationale: ‘జీవపు నీరు’ అనే షష్ఠీ సంబంధాన్ని తెలుగులో స్థిరపడిన, సహజమైన సమాస రూపంతో అందిస్తుంది; దానిని కేవలం సాధారణ ‘జీవముగల నీరు’గా మార్చదు.
- source_word: δωρεάν
  choice: ఉచితంగా
  rationale: ధర లేకుండా, కానుకగా అనే భావాన్ని ఆధునిక సాధారణ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: “రా” అనే మొదటి రెండు పిలుపులు ఎవరిని ఉద్దేశించాయి?
  choice: సంబోధితుని ప్రధాన పాఠ్యంలో స్పష్టీకరించకుండా ‘రా’ అని మాత్రమే ఉంచడం
  alternative: మొదటి రెండు పిలుపులకు ‘ప్రభువా, రా’ అని స్పష్టమైన సంబోధన చేర్చడం; లేదా అన్ని పిలుపులనూ దాహంతో ఉన్నవారికే చేసిన ఆహ్వానంగా చదవడం
  rationale: గ్రీకు పాఠ్యం మొదట రెండుసార్లు ద్వితీయ పురుష ఏకవచన ఆజ్ఞార్థకాన్ని వాడి, తరువాత దాహంతో ఉన్నవారి విషయంలో తృతీయ పురుష ఆజ్ఞార్థకానికి మారుతుంది. అందువల్ల ప్రభువు రాకకోసం పిలుపు, తరువాత దాహంతో ఉన్నవారికి ఆహ్వానం అనే సాధ్యమైన పొరలను అనువాదం మూసివేయదు.
- issue: ‘వధువు’ యొక్క ప్రతీకాత్మక సూచన
  choice: ‘వధువు’ అనే ప్రతీకనే ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘సంఘం’, ‘దేవుని ప్రజలు’ లేదా ‘కొత్త యెరూషలేము’ అని వివరణాత్మకంగా అనువదించడం
  rationale: ప్రకటన గ్రంథం ఈ ప్రతీకతో అనేక అనుబంధాలను ఉద్దేశపూర్వకంగా కలుపుతుంది. వాటిలో ఒక్కదానిని ప్రధాన పాఠ్యంలో నిర్ణయించడం మూలం కంటే ఎక్కువ వ్యాఖ్యానమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకునికి అర్థమయ్యే సంక్షిప్త వాక్య నిర్మాణం. ‘రా’ అనే ఏకవచన పిలుపును, ‘వధువు’ అనే ప్రతీకను, దాహం మరియు జీవజలం అనే చిత్రాలను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా ఉంచాం. సరఫరా చేసిన ఆంగ్ల ముసాయిదాలో [a] గుర్తు స్థానభ్రంశమైనట్లు కనిపించినందున, దాన్ని δωρεάν కు సరిపడే ‘ఉచితంగా’ వద్ద ఉంచాం; అన్ని పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
