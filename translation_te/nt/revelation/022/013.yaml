language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: te
  text: “నేనే ఆల్ఫాను, ఓమెగాను; మొదటివాణ్ణి, చివరివాణ్ణి; ఆరంభాన్ని, అంతాన్ని.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మూలాన్ని, గమ్యాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: నేనే
  rationale: గ్రీకులో స్పష్టంగా ఉన్న ప్రథమ పురుష సర్వనామపు ఉద్ఘాటనను సహజమైన తెలుగులో ‘నేనే’ తెలియజేస్తుంది.
- source_word: τὸ Ἄλφα
  choice: ఆల్ఫాను
  rationale: గ్రీకు వర్ణమాలలోని మొదటి అక్షరనామాన్ని ప్రకటన గ్రంథంలోని స్థిరమైన సంకేతాత్మక బిరుదుగా లిప్యంతరీకరించి నిలిపాం.
- source_word: τὸ Ὦ
  choice: ఓమెగాను
  rationale: గ్రీకు వర్ణమాలలోని చివరి అక్షరనామాన్ని గుర్తింపు పొందిన సంకేతాత్మక బిరుదుగా లిప్యంతరీకరించి నిలిపాం.
- source_word: ὁ πρῶτος
  choice: మొదటివాణ్ణి
  rationale: వ్యక్తిని సూచించే విశేషణాత్మక నామరూపాన్ని తెలుగులో సహజంగా, ‘చివరివాణ్ణి’తో సమాంతరంగా అనువదించాం.
- source_word: ὁ ἔσχατος
  choice: చివరివాణ్ణి
  rationale: ‘మొదటివాణ్ణి’కి సహజమైన ప్రతిజోడిగా, బిరుదు స్వభావాన్ని నిలిపే రూపాన్ని ఎంచుకున్నాం.
- source_word: ἡ ἀρχὴ
  choice: ఆరంభాన్ని
  rationale: τέλοςతో ఉన్న సమాంతరతను నిలుపుతూ ‘beginning’ అనే ప్రధాన సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ τέλος
  choice: అంతాన్ని
  rationale: ἀρχήతో జతగా ఉన్న సమగ్ర ఆది–అంత భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘గమ్యం’ అనే భావసాధ్యతను పాదటిప్పణిలో సూచించాం.
theological_decisions:
- issue: మూడు జతల స్వీయ బిరుదులను సమగ్ర సార్వభౌమత్వం, నిత్యతను సూచించేలా ఉంచుతూ వాటి తాత్త్విక భావాన్ని అతిగా వివరణ చేయకపోవడం
  choice: నేనే ఆల్ఫాను, ఓమెగాను; మొదటివాణ్ణి, చివరివాణ్ణి; ఆరంభాన్ని, అంతాన్ని.
  alternative: నేనే ఆల్ఫాను, ఓమెగాను; మొదటివాణ్ణి, చివరివాణ్ణి; మూలాన్ని, గమ్యాన్ని.
  rationale: మూలపాఠం మూడు సమాంతర బిరుదు-జతలను వరుసగా ఉంచుతుంది. ప్రధాన అనువాదం వాటి లయ, సమతుల్యత, ఉన్నత క్రీస్తు సంబంధ ప్రకటనను అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది; ἀρχή, τέλοςలకు ‘మూలం, గమ్యం’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభగ్రాహ్యమైన బిరుదు-శైలిని వాడాం. మూడు జతల సమాంతర నిర్మాణాన్ని విరామచిహ్నాలతో స్పష్టంగా నిలిపాం; ఆల్ఫా, ఓమెగా అనే స్థిరమైన సంకేతాత్మక అక్షరనామాలను అనువదించకుండా లిప్యంతరీకరించాం.
