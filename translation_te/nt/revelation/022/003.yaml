id: REV.22.3
reference: Revelation 22:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his servants will worship him[d][c][b],
translation:
  language: te
  text: ఇక ఏ శాపమూ ఉండదు[a]. దేవునికీ గొర్రెపిల్లకూ చెందిన సింహాసనం దానిలో ఉంటుంది; ఆయన దాసులు[c] ఆయనను ఆరాధిస్తారు[d][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శాపగ్రస్తమైనదేదీ” లేదా “శాపానికి గురైన ఏ వస్తువూ.”
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు పాఠంలో ఏకవచన రూపాలున్నాయి: “దేవునికీ గొర్రెపిల్లకూ చెందిన సింహాసనం” ... “ఆయన దాసులు ఆయనను ఆరాధిస్తారు.” ఇలా దేవుడు, గొర్రెపిల్ల మధ్య భేదమూ, వారి ఉమ్మడి పరిపాలనమూ రెండూ నిలుస్తాయి.'
    reason: alternative_reading
  - marker: c
    text: లేదా, “సేవకులు”; మూలపదం యజమానికి చెందిన దాసులను కూడా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: లేదా, “సేవ చేస్తారు” లేదా “పవిత్ర సేవ అర్పిస్తారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: ఏ శాపమూ
  rationale: κατάθεμα ఇక్కడ శాపాన్ని లేదా శాపానికి గురైన దానిని సూచించగలదు. కొత్త సృష్టిలో శాపం పూర్తిగా తొలగిపోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ‘ఏ శాపమూ’ ఎంచుకున్నాం; వస్తువును సూచించే భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: οὐκ ἔσται ἔτι
  choice: ఇక ... ఉండదు
  rationale: భవిష్యత్తులో అది మరెన్నడూ ఉండదనే అస్తిత్వార్థాన్ని, ἔτι లోని ‘ఇకపై కాదు’ అనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ὁ θρόνος
  choice: సింహాసనం
  rationale: ప్రామాణిక సమానార్థకం; గ్రీకులోని ఏకవచనాన్ని నిలుపుతుంది.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: దేవునిదీ గొర్రెపిల్లదీ అయిన
  rationale: దేవుడు, గొర్రెపిల్ల అనే ఇద్దరి ప్రత్యేక ప్రస్తావనను ఉంచుతూ, ఒకే సింహాసనంతో వారి సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν αὐτῇ
  choice: దానిలో
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ముందు ప్రస్తావించిన నగరాన్ని సూచిస్తుంది. తెలుగు వ్యాకరణంలో నగరానికి సహజంగా వాడే ‘దానిలో’ మూలంలోని సర్వనామ సంబంధాన్ని నిలుపుతుంది.
- source_word: δοῦλοι
  choice: దాసులు
  rationale: δοῦλοι లోని యజమానికి చెందినవారు, ఆయన సేవకు అంకితమైనవారు అనే భావాన్ని ‘దాసులు’ నిలుపుతుంది; ‘సేవకులు’ కంటే బంధితమైన చెందుదల భావం ఇందులో బలంగా ఉంది, అయితే ఆధునిక తెలుగులో గౌరవప్రదమైన బైబిలు సందర్భానికి కూడా సరిపోతుంది.
- source_word: λατρεύσουσιν
  choice: ఆరాధిస్తారు
  rationale: సింహాసన సంబంధమైన ఈ సందర్భంలో λατρεύω దేవునికి అర్పించే పవిత్ర సేవను సూచిస్తుంది. ‘ఆరాధిస్తారు’ ఆ మతపరమైన భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτοῦ ... αὐτῷ
  choice: ఆయన ... ఆయనను
  rationale: ‘దేవునిదీ గొర్రెపిల్లదీ’ అని ఉన్నప్పటికీ మూలంలోని రెండు సర్వనామాలు ఏకవచనంలో ఉన్నాయి. తెలుగు అనువాదంలోనూ ఏకవచనం ఉంచి, మూలంలోని ఉద్దేశపూర్వక భావ ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపాం.
theological_decisions:
- issue: దేవుడు మరియు గొర్రెపిల్లకు సంబంధించిన ఒకే సింహాసనం, దాని తరువాత వచ్చే ఏకవచన సర్వనామాలు
  choice: ‘సింహాసనం ... ఆయన దాసులు ఆయనను’ అని ఏకవచన రూపాలను నిలుపడం
  alternative: ‘వారి దాసులు వారిని’ అని బహువచన సర్వనామాలు వాడడం లేదా సర్వనామాలను తప్పించేలా భావానువాదం చేయడం
  rationale: గ్రీకు పాఠం దేవుడు, గొర్రెపిల్ల మధ్య భేదాన్ని స్పష్టంగా ఉంచుతూనే ఒకే సింహాసనాన్ని, ఏకవచన సర్వనామాలను వాడుతుంది. ఈ వేదాంతపరమైన ఉద్వేగాన్ని తరువాతి సిద్ధాంతపరమైన పదజాలంతో పరిష్కరించకుండా యథాతథంగా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘దాసులు’ మూలపదంలోని చెందుదల భావాన్ని నిలుపుతుంది; ‘ఆయన ... ఆయనను’ అనే ఏకవచన రూపాలు గ్రీకు పాఠంలోని వేదాంతపరమైన ఉద్వేగాన్ని ఉద్దేశపూర్వకంగా కాపాడుతాయి.
