  to: ఇక ఏ శాపమూ ఉండదు[a]. దేవునికీ గొర్రెపిల్లకూ చెందిన సింహాసనం దానిలో ఉంటుంది; ఆయన దాసులు[c] ఆయనను ఆరాధిస్తారు[d][b].
  rationale: 'సురక్షితమైన శైలీ-స్పష్టత సవరణ మాత్రమే చేశాం: గ్రీకు τοῦ θεοῦ καὶ τοῦ ἀρνίου ను ‘దేవునికీ గొర్రెపిల్లకూ చెందిన’గా మార్చాం. దీనివల్ల ఒకే సింహాసనం, దేవుడు మరియు గొర్రెపిల్ల అనే రెండు ప్రత్యేక సూచనలు, అలాగే తరువాతి ఏకవచన సర్వనామాల ఉద్దేశపూర్వక ఉద్వేగం మారకుండా ఉంటాయి. పాదటిప్పణి b లోని ఉదాహరణను సవరించిన వచనంతో సరిపోల్చాం.'
