  terminology: «చెవి» మరియు «వినాలి» మూలంలోని స్థిరమైన ప్రవచనాత్మక వినికిడి-పిలుపు ప్రతిధ్వనిని నిలుపుతున్నాయి. «అతడు» గ్రీకు వ్యాకరణంలోని సాధారణార్థక పుంలింగ ఏకవచనాన్ని ప్రతిబింబిస్తుంది; దీన్ని నిర్దిష్ట పురుషునికి మాత్రమే పరిమితం చేయరాదు.
