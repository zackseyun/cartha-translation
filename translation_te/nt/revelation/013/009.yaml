  text: If anyone has an ear[a], let him hear.
translation:
  language: te
  text: ఎవరికైనా చెవి ఉంటే, అతడు వినాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴ τις
  choice: ఎవరికైనా
  rationale: షరతును పరిచయం చేసే Εἴ మరియు సాధారణార్థక అనిర్దిష్ట సర్వనామమైన τις కలిపి, తెలుగులో సహజంగా షరతు భావాన్ని నిలుపుతూ ‘ఎవరికైనా’ అని అనువదించాం.
- source_word: ἔχει
  choice: ఉంటే
  rationale: ‘కలిగి ఉండడం’ అనే వర్తమాన భావాన్ని, తెలుగు షరతు నిర్మాణానికి అనుగుణంగా ‘ఉంటే’ తెలియజేస్తుంది.
- source_word: οὖς
  choice: చెవి
  rationale: గ్రీకులో ఉన్న ఏకవచన రూపాన్ని నిలిపి, వినగల సామర్థ్యాన్ని సూచించే ప్రవచనాత్మక నుడికారాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ἀκουσάτω
  choice: అతడు వినాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞార్థక రూపంలోని గంభీర పిలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘వినాలి’ అనేది కేవలం శబ్దాన్ని గ్రహించడం మాత్రమే కాక శ్రద్ధగా ఆలకించి స్పందించాలనే నుడికార బలాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: ఏకవచన సాధారణార్థక వ్యక్తి సూచన
  choice: అతడు వినాలి
  alternative: వారు వినాలి
  rationale: గ్రీకు క్రియ మూడవ పురుష ఏకవచనంలో ఉంది. ‘అతడు’ తెలుగు వాక్యంలో ఏకవచన రూపాన్ని స్పష్టంగా నిలుపుతుంది; ఇక్కడ అది సందర్భానుసారంగా సాధారణార్థకంగా పనిచేస్తుంది.
- issue: వినుట అనే సూత్రప్రాయ పిలుపు
  choice: ‘వినాలి’ అనే బైబిలు నుడికారాన్ని నిలుపడం
  alternative: ‘అర్థం చేసుకోవాలి’ లేదా ‘శ్రద్ధగా ఆలకించాలి’
  rationale: మూలపాఠం వినుటకు పిలుస్తుంది; దానిని ‘అర్థం చేసుకోవాలి’ అని విపులీకరించడం భావాన్ని అనవసరంగా కుదించవచ్చు. ‘వినాలి’ ప్రవచనాత్మక, ప్రకటనాత్మక ప్రతిధ్వనిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన ప్రవచనాత్మక హెచ్చరికగా రూపొందించబడింది. మూలంలోని ఏకవచన ‘చెవి’ మరియు మూడవ పురుష ఏకవచన ఆజ్ఞ భావం నిలుపబడ్డాయి.
