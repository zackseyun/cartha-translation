revisions:
- from: పరిశుద్ధులతో యుద్ధం చేయడానికి[a], వారిని జయించడానికి[b] దానికి ఇవ్వబడింది. ప్రతి గోత్రం మీద, ప్రతి ప్రజ మీద, ప్రతి భాష[c] మీద, ప్రతి జాతి మీద దానికి అధికారం ఇవ్వబడింది.
  to: మరియు పరిశుద్ధులపై యుద్ధం చేయడానికి[a], వారిని జయించడానికి[b] దానికి అనుమతి ఇవ్వబడింది. ప్రతి గోత్రం, ప్రజ, భాష[c], జాతి మీద దానికి అధికారం ఇవ్వబడింది.
  rationale: The revision retains the repeated unnamed passive, including the text's restraint about who grants permission and authority. It supplies 'అనుమతి' only to make the first Telugu passive grammatical and idiomatic, restores the opening connective, and makes the adversarial sense of the war idiom explicit without adding an interpreter's identification of the giver or of the beast.
