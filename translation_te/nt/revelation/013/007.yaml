id: REV.13.7
reference: Revelation 13:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: te
  text: మరియు పరిశుద్ధులపై యుద్ధం చేయడానికి[a], వారిని జయించడానికి[b] దానికి అనుమతి ఇవ్వబడింది. ప్రతి గోత్రం, ప్రజ, భాష[c], జాతి మీద దానికి అధికారం ఇవ్వబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధులతో యుద్ధం చేయడానికి.” మూలపాఠంలో అక్షరార్థంగా “పరిశుద్ధులతో” అని ఉన్నా, యుద్ధం అనే సందర్భంలో అది వారికి వ్యతిరేకంగా అనే శత్రుత్వ భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారిని అధిగమించడానికి.”
    reason: lexical_alternative
  - marker: c
    text: 'సాంప్రదాయ అనువాదం: “నాలుక”; ఇక్కడ భావం “భాష.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: దానికి ఇవ్వబడింది
  rationale: గ్రీకులోని కర్మణి ప్రయోగాన్ని, ఇచ్చినవారు ఎవరో చెప్పకుండా ఉన్న భావాన్ని కాపాడుతుంది. ప్రకటన 13లో సూచించబడిన మృగానికి అనుగుణంగా తెలుగులో ‘దానికి’ వాడబడింది.
- source_word: ποιῆσαι πόλεμον μετὰ τῶν ἁγίων
  choice: పరిశుద్ధులతో యుద్ధం చేయడానికి
  rationale: ‘యుద్ధం చేయడం’ అనే గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది. యుద్ధ సందర్భంలో ‘తో’ శత్రుత్వ భావాన్నే స్పష్టంగా తెలియజేస్తుంది; ‘పరిశుద్ధులు’ దేవునికి చెందిన పవిత్ర ప్రజలను సూచించే స్థిరమైన బైబిలు పదం.
- source_word: νικῆσαι αὐτούς
  choice: వారిని జయించడానికి
  rationale: ప్రకటన గ్రంథంలో νικάω పదానికి ఉన్న ముఖ్యమైన భావసూత్రాన్ని నిలుపుతూ, వారిపై విజయం సాధించడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐξουσία
  choice: అధికారం
  rationale: కేవలం బలాన్ని కాకుండా ఇవ్వబడిన పాలనా హక్కు లేదా అధికార పరిధిని సూచిస్తుంది; పునరుక్త కర్మణి ప్రయోగంతోనూ సరిపోతుంది.
- source_word: ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος
  choice: ప్రతి గోత్రం మీద, ప్రతి ప్రజ మీద, ప్రతి భాష మీద, ప్రతి జాతి మీద
  rationale: నాలుగు సమూహాల విస్తృత పరిధిని స్పష్టంగా ఉంచుతుంది. ప్రతి నామవాచకానికి ‘ప్రతి’ని పునరుక్తి చేయడం గ్రీకు πᾶσαν యొక్క పంపిణీ భావాన్ని తెలుగులో సహజంగా వెల్లడిస్తుంది.
- source_word: φυλή
  choice: గోత్రం
  rationale: వంశ లేదా తెగ ఆధారిత సమూహానికి బైబిలు తెలుగులో స్థిరమైన, గౌరవప్రదమైన పదం.
- source_word: λαός
  choice: ప్రజ
  rationale: ఒక సమష్టి ప్రజాసమూహాన్ని సూచించడానికి ఈ జాబితాలో సరైన ఏకవచన సమూహవాచకం.
- source_word: γλῶσσα
  choice: భాష
  rationale: ఇక్కడ మాటలాడే భాషను సూచిస్తుంది; శరీరావయవమైన ‘నాలుక’ కంటే ఆధునిక పాఠకులకు నేరుగా అర్థమవుతుంది.
- source_word: ἔθνος
  choice: జాతి
  rationale: నాలుగు భాగాల సూత్రంలో విస్తృత జాతీయ లేదా జనసమూహాన్ని సంక్షిప్తంగా సూచిస్తుంది.
theological_decisions:
- issue: రెండుసార్లు వచ్చిన ἐδόθη అనే పేరులేని కర్మణి ప్రయోగం
  choice: ‘దానికి ఇవ్వబడింది ... దానికి అధికారం ఇవ్వబడింది’ అని కర్మణి రూపాన్ని నిలుపడం
  alternative: ‘దేవుడు దానిని అనుమతించాడు’ లేదా ‘దానికి అనుమతి లభించింది’ అని స్పష్టీకరించడం
  rationale: మూలపాఠం ఇచ్చినవారిని నేరుగా పేర్కొనదు. కర్మణి రూపాన్ని నిలుపడం ద్వారా దేవుని సార్వభౌమత్వం మరియు దుష్టత్వానికి కలిగిన పరిమిత అనుమతి మధ్య ఉన్న వేదాంతపరమైన ఉద్వేగాన్ని వ్యాఖ్యానంతో పరిష్కరించకుండా ఉంచుతుంది.
- issue: μετὰ τῶν ἁγίων లో μετά యొక్క భావం
  choice: ‘పరిశుద్ధులతో యుద్ధం’
  alternative: ‘పరిశుద్ధులకు వ్యతిరేకంగా యుద్ధం’
  rationale: μετά సాధారణంగా ‘తో’ అని అర్థమిచ్చినా, యుద్ధం అనే పదబంధంలో శత్రుత్వ సంబంధాన్ని సూచిస్తుంది. తెలుగులో ‘వారితో యుద్ధం’ సహజంగానే ‘వారికి వ్యతిరేకంగా’ అనే భావాన్ని ఇస్తుంది; పాదసూచిక ప్రత్యామ్నాయాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బైబిలు శైలి వాడబడింది. వాక్యం సులభంగా చదవబడేలా ఉన్నప్పటికీ, రెండు కర్మణి ప్రయోగాలు మరియు నాలుగు సమూహాల వరుస మూలపాఠానికి నమ్మకంగా నిలుపబడ్డాయి. ‘దానికి ఇవ్వబడింది’ కొంత ఉద్దేశపూర్వకంగా గంభీరమైన నిర్మాణం; ఇచ్చినవారిని పేర్కొనకుండా ఉండేందుకు దీనిని ఎంచుకున్నాం.
