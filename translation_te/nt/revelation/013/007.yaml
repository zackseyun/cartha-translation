review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two unnamed Greek passives and the scope of the fourfold list, but it omits the opening connective καὶ and leaves the first passive ('దానికి ఇవ్వబడింది') without an expressed Telugu complement. In this construction Telugu needs a noun such as 'అనుమతి' to express what was given. Rendering the hostile force of ποιῆσαι πόλεμον μετὰ τῶν ἁγίων explicitly as 'పరిశుద్ధులపై యుద్ధం' is clearer and fully reflects the idiom.
  naturalness: Adding 'అనుమతి' makes the first clause idiomatic modern standard Telugu. 'ప్రతి గోత్రం, ప్రజ, భాష, జాతి మీద' is natural and avoids unnecessarily repeating the postposition while retaining the distributive extent of πᾶσαν.
  terminology: '''పరిశుద్ధులు,'' ''జయించడానికి,'' ''అధికారం,'' ''గోత్రం,'' ''ప్రజ,'' ''భాష,'' and ''జాతి'' are suitable modern biblical Telugu equivalents. ''దానికి'' can retain the established non-personal reference to the beast while the passive continues not to identify the giver.'
  issues:
  - severity: medium
    issue: The opening καὶ is not represented.
    rationale: The verse begins with a connective that should be retained in an optimal-equivalence translation.
  - severity: high
    issue: The first clause, '... దానికి ఇవ్వబడింది,' has no expressed object/complement in Telugu.
    rationale: Although Greek can use ἐδόθη with the infinitival clause, Telugu requires an expression such as 'అనుమతి ఇవ్వబడింది' for a complete and natural passive construction. This does not identify the unnamed giver.
  - severity: medium
    issue: The main text's 'పరిశుద్ధులతో యుద్ధం' can be read less explicitly than the hostile sense required by the Greek idiom.
    rationale: In the collocation 'make war with,' μετά plus the saints denotes war against them. 'పరిశుద్ధులపై యుద్ధం' conveys this directly; the literal alternative can remain in a footnote.
  revised_text: మరియు పరిశుద్ధులపై యుద్ధం చేయడానికి[a], వారిని జయించడానికి[b] దానికి అనుమతి ఇవ్వబడింది. ప్రతి గోత్రం, ప్రజ, భాష[c], జాతి మీద దానికి అధికారం ఇవ్వబడింది.
