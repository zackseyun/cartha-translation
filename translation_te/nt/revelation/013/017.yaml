source:
  edition: SBLGNT
  text: καὶ ἵνα μή τις ⸀δύνηται ἀγοράσαι ἢ πωλῆσαι εἰ μὴ ὁ ἔχων τὸ χάραγμα, τὸ ὄνομα τοῦ θηρίου ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/017.yaml
  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: te
  text: మరియు, ఆ గుర్తును[c], మృగం పేరును లేదా దాని[b] పేరుకు సంబంధించిన సంఖ్యను కలిగి ఉన్న వ్యక్తి[a] తప్ప మరెవరూ కొనడం గానీ అమ్మడం గానీ చేయలేకుండా ఉండేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘కలిగి ఉన్నవాడు’; ఇక్కడ పుంలింగ ఏకవచన రూపం ఏ వ్యక్తికైనా సాధారణంగా వర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతని’. మృగాన్ని వ్యక్తిగా పరిగణించి ఇలా కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: గ్రీకు వాక్యనిర్మాణంలో ‘మృగం పేరు లేదా దాని పేరుకు సంబంధించిన సంఖ్య’ అనేవి ‘గుర్తు’ ఏమిటో వివరించే పదాలుగా కూడా అర్థం చేసుకోవచ్చు.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἵνα μή τις δύνηται
  choice: మరెవరూ … చేయలేకుండా చేసింది
  rationale: ἵνα ఇక్కడ ముందు వాక్యంలోని చర్యకు ఉద్దేశం లేదా ఫలితాన్ని తెలియజేస్తుంది; μή τις δύνηται అంటే ఎవరూ చేయగల స్థితిలో ఉండకపోవడం. తెలుగులో సహజమైన కొనసాగింపు కోసం ముందు వచనంలోని కర్తను సూచ్యంగా ఉంచి ఈ రూపాన్ని వాడాం.
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: కొనడం గానీ అమ్మడం గానీ
  rationale: ఈ రెండు క్రియలు సాధారణ కొనుగోలు-అమ్మకాల కార్యకలాపాలను సూచిస్తాయి; జంటగా ఉన్న ప్రత్యామ్నాయాలను తెలుగు ‘గానీ … గానీ’ సహజంగా తెలియజేస్తుంది.
- source_word: εἰ μὴ ὁ ἔχων
  choice: కలిగి ఉన్న వ్యక్తి తప్ప
  rationale: εἰ μή ఏకైక మినహాయింపును సూచిస్తుంది; ὁ ἔχων వ్యాకరణపరంగా ఏకవచనమైనా సాధారణంగా వర్తించే ‘కలిగి ఉన్న వ్యక్తి’ అనే భావం ఇస్తుంది.
- source_word: τὸ χάραγμα
  choice: ఆ గుర్తు
  rationale: χάραγμα ముద్రించిన లేదా చెక్కిన గుర్తును సూచించగలదు. ఆధునిక సాధారణ తెలుగులో ‘గుర్తు’ పారదర్శకంగా ఉండి, ప్రకటన గ్రంథంలోని σφραγίς (‘ముద్ర’)తో అనవసర పదసామ్యాన్ని తగ్గిస్తుంది.
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: మృగం పేరు
  rationale: ఇది నేరుగా ఉన్న సంబంధవాచక నిర్మాణం; ‘మృగం పేరు’ సహజమైన తెలుగులో దాని భావాన్ని కాపాడుతుంది.
- source_word: θηρίου
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలో θηρίον అంత్యకాల విరోధిని సూచించే ప్రతీకాత్మక బిరుదు; ‘మృగం’ ఆ భావాన్ని సరైన విధంగా అందిస్తుంది.
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: లేదా దాని పేరుకు సంబంధించిన సంఖ్య
  rationale: τοῦ ὀνόματος అనే సంబంధాన్ని తెలుగులో సహజంగా ‘పేరుకు సంబంధించిన’ అని తెలిపాం. αὐτοῦకు సమీప పూర్వపదమైన నపుంసకలింగ θηρίονను అనుసరించి ‘దాని’ అని అనువదించాం.
theological_decisions:
- issue: ὁ ἔχωνలోని వ్యాకరణ లింగం మరియు సాధారణ వర్తింపు
  choice: కలిగి ఉన్న వ్యక్తి
  alternative: కలిగి ఉన్నవాడు
  rationale: గ్రీకులో రూపం పుంలింగ ఏకవచనమైనా, ఇక్కడ అది ఏ వ్యక్తికైనా వర్తించే సాధారణ ప్రయోగం. తెలుగు ‘వ్యక్తి’ ఏకవచనాన్ని నిలిపి, లింగాన్ని అనవసరంగా పరిమితం చేయదు.
- issue: θηρίον తరువాత αὐτοῦ సూచించే సర్వనామం
  choice: దాని పేరు
  alternative: అతని పేరు
  rationale: θηρίον గ్రీకులో నపుంసకలింగం కాబట్టి ‘దాని’ రూపానికి ప్రత్యక్ష వ్యాకరణ ఆధారం ఉంది. అయితే సందర్భంలో మృగానికి వ్యక్తిగత చర్యలు ఆపాదించబడినందున ‘అతని’ కూడా సాధ్యమైన భావవ్యక్తీకరణ; దాన్ని పాదసూచికలో ఉంచాం.
- issue: గుర్తు, పేరు, సంఖ్యల మధ్య వాక్యనిర్మాణ సంబంధం
  choice: కామాలతో మూలంలోని వరుసను నిలిపి, వివరణను పాదసూచికలో తెలియజేయడం
  alternative: ‘ఆ గుర్తును, అంటే మృగం పేరును గానీ దాని పేరు సంఖ్యను గానీ’ అని స్పష్టమైన అన్వయంగా అనువదించడం
  rationale: గ్రీకు τὸ χάραγμα తరువాత τὸ ὄνομα … ἢ τὸν ἀριθμόν వస్తాయి. పేరు లేదా సంఖ్య ‘గుర్తు’ను వివరించే సమానాధికార పదాలుగా గ్రహించవచ్చు; అయితే ‘అంటే’ అని చేర్చడం మూలంలో సూచితమైన సంబంధాన్ని అతిగా నిర్ణయిస్తుంది. అందుకే ప్రధాన పాఠ్యంలో విరామచిహ్నాలతో నిర్మాణాన్ని సాధ్యమైనంత తెరిచి ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గంభీరమైన శైలి వాడబడింది. ‘గుర్తు’, ‘కొనడం’, ‘అమ్మడం’ వంటి సూటి పదాలు ఎంచుకున్నాం; వచనం ముందు వాక్యంపై వ్యాకరణపరంగా ఆధారపడుతున్న స్వభావాన్ని ‘అలా … చేసింది’ అనే కొనసాగింపుతో నిలిపాం.
