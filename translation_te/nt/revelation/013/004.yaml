    issue: The second worship action is rendered as a simultaneous participial action.
    rationale: “మృగాన్ని కూడా ఆరాధిస్తూ, … అన్నారు” may mean “while worshiping the beast, they said,” whereas Greek has a second finite verb, “and they worshiped the beast, saying.” A finite Telugu verb preserves the parallel actions.
  - severity: low
