    rationale: “ఆ మృగంలాంటివాడు ఎవరు?” can suggest a male human-like referent. “ఆ మృగానికి సాటి ఎవరు?” is idiomatic Telugu and directly conveys τίς ὅμοιος τῷ θηρίῳ.
