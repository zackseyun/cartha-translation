id: REV.13.4
reference: Revelation 13:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: te
  text: 'వారు ఆ ఘటసర్పాన్ని ఆరాధించారు, ఎందుకంటే అది మృగానికి అధికారాన్ని ఇచ్చింది. వారు ఆ మృగాన్నీ ఆరాధించి, ఇలా అన్నారు: “ఆ మృగానికి సాటి ఎవరు?[a][c] దానితో యుద్ధం చేయగలవాడు ఎవరు?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ మృగం వలె ఎవరు ఉన్నారు?’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దానికి వ్యతిరేకంగా యుద్ధం చేయగలవాడు ఎవరు?’
    reason: lexical_alternative
  - marker: c
    text: ఈ జయధ్వని దేవునికి సాటిలేదని చెప్పే పాత నిబంధన భాషను (ఉదాహరణకు నిర్గమకాండము 15:11; కీర్తన 35:10) ప్రతిధ్వనింపజేస్తున్నట్లు కనిపిస్తుంది; ఇక్కడ ఆ భాష మృగానికి దైవదూషణాత్మకంగా వర్తింపజేయబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: προσεκύνησαν
  choice: ఆరాధించారు
  rationale: ప్రకటన గ్రంథంలో ఈ క్రియ కేవలం వంగి నమస్కరించడాన్ని కాక మతపరమైన ఆరాధనను సాధారణంగా సూచిస్తుంది; ఇక్కడి విగ్రహారాధనా భావాన్ని ‘ఆరాధించారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: δράκοντι
  choice: ఘటసర్పాన్ని
  rationale: అపోకలిప్టిక్ ప్రతీకను వ్యాఖ్యానించి మార్చకుండా నేరుగా తెలిపే, తెలుగు బైబిలు వాడుకలో స్థిరపడిన పదం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఘటసర్పాన్ని ఆరాధించడానికి గల కారణాన్ని తెలిపే కారణార్థక ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔδωκεν
  choice: ఇచ్చింది
  rationale: గ్రీకు ఏఒరిస్టు క్రియను సహజమైన తెలుగు భూతకాలంతో అందిస్తుంది; అధికారం ఇవ్వడం ఆరాధనకు కారణమని వాక్యక్రమమే స్పష్టం చేస్తుంది.
- source_word: ἐξουσίαν
  choice: అధికారాన్ని
  rationale: కేవలం శక్తి కంటే అప్పగించబడిన పాలనా హక్కు లేదా అధికార పరిధి అనే భావాన్ని కాపాడుతుంది.
- source_word: θηρίῳ
  choice: మృగానికి / మృగాన్ని
  rationale: ప్రకటన గ్రంథంలోని θηρίον అనే అపోకలిప్టిక్ రూపానికి నేరమైన, స్థిరమైన తెలుగు సమానం.
- source_word: λέγοντες
  choice: ఆరాధిస్తూ … అన్నారు
  rationale: మాటలను పరిచయం చేసే భాగక్రియను తెలుగులో సహజమైన సమకాలిక క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: ఆ మృగంలాంటివాడు ఎవరు?
  rationale: మృగానికి సాటిలేదనే అలంకారిక సవాలును, దేవుని అసమానతను తెలిపే పాత నిబంధన భాషతో ఉండగల ప్రతిధ్వనిని విస్తరించి వ్యాఖ్యానించకుండా కాపాడుతుంది.
- source_word: δύναται πολεμῆσαι μετ’ αὐτοῦ
  choice: దానితో యుద్ధం చేయగలవాడు ఎవరు?
  rationale: πολεμέω లోని సైనిక సంఘర్షణ భావాన్ని ‘యుద్ధం చేయడం’ నిలుపుతుంది; μετά + షష్ఠీ విభక్తి ఇక్కడ ప్రతికూలంగా ఎదుర్కొనడాన్ని సూచిస్తుంది. ‘దానితో’ అనే సర్వనామం నపుంసకలింగ θηρίον ను సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: మృగాన్ని సూచించే సర్వనామం వ్యక్తివాచకంగా ఉండాలా, నపుంసకంగా ఉండాలా
  choice: ‘దానితో’ అని నపుంసక సూచనను వాడటం
  alternative: మృగాన్ని వ్యక్తి లేదా పాలకుడిగా భావించి ‘అతనితో’ అని వాడటం
  rationale: గ్రీకులో αὐτοῦ నపుంసకలింగ θηρίον ను సూచిస్తుంది. మృగం వ్యక్తిలా పనిచేసినప్పటికీ, ‘దానితో’ మూలపాఠపు వ్యాకరణాన్ని దగ్గరగా అనుసరించి అనవసరమైన వ్యక్తీకరణను నివారిస్తుంది.
- issue: దేవుని అసమానతను తెలిపే భాషకు ఉన్న ప్రతిధ్వని
  choice: ‘ఆ మృగంలాంటివాడు ఎవరు?’ అనే ప్రశ్నను వివరణాత్మక విస్తరణ లేకుండా ఉంచటం
  alternative: ఇది దేవునికి వర్తించే భాషను దూషణాత్మకంగా అనుకరిస్తోందని ప్రధాన పాఠంలోనే స్పష్టం చేయటం
  rationale: ఈ మాట నిర్గమకాండము 15:11, కీర్తన 35:10 వంటి వాక్యాల భాషను ప్రతిధ్వనింపజేసే అవకాశం ఉంది. ఆ ఉద్రిక్తతను అనువాదంలో నిలిపి, వివరణను పాదటిప్పణికి పరిమితం చేయడం సముచితం.
- issue: ఘటసర్పాన్ని సూచించే సర్వనామం
  choice: తెలుగు నామవాచకమైన ‘ఘటసర్పం’కు అనుగుణంగా ‘అది’ వాడటం
  alternative: గ్రీకు δράκων పుంలింగాన్ని లేదా వ్యక్తిగత కార్యసాధకత్వాన్ని ప్రతిబింబిస్తూ ‘వాడు/అతడు’ వాడటం
  rationale: తెలుగులో ‘ఘటసర్పం’ నపుంసక వాడుకలో సహజంగా ఉంటుంది. ‘అది’ ప్రతీకను వ్యక్తిగా ముందుగానే నిర్ణయించకుండా, దాని కార్యసాధకత్వాన్ని క్రియ ద్వారా స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే వాక్యనిర్మాణం వాడబడింది. ‘ఘటసర్పం’, ‘మృగం’, ‘అధికారం’, ‘ఆరాధించారు’ వంటి పదాలు అపోకలిప్టిక్ సందర్భాన్ని స్పష్టంగా నిలుపుతాయి. ప్రధాన పాఠంలో మూలంలోని రెండు సమాంతర ఆరాధనా క్రియలు, కారణ సంబంధం, రెండు అలంకారిక ప్రశ్నలు కాపాడబడ్డాయి.
