revisions:
- from: భూమిపై నివసించే వారందరూ దానికి ఆరాధన చేస్తారు—లోకం పునాది వేయబడినప్పటి నుండి వధించబడిన గొర్రెపిల్ల జీవగ్రంథంలో ఎవరి పేరు రాయబడలేదో వారందరూ.[a]
