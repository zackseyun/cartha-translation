id: REV.13.8
reference: Revelation 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: te
  text: భూమిపై నివసించే వారందరూ దానిని ఆరాధిస్తారు—లోకం పునాది వేయబడినప్పటి నుండి వధించబడిన గొర్రెపిల్ల జీవగ్రంథంలో ఎవరి పేరు రాయబడలేదో వారందరూ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోకం పునాది వేయబడినప్పటి నుండి గొర్రెపిల్ల జీవగ్రంథంలో ఎవరి పేరు రాయబడలేదో వారందరూ.” గ్రీకులో “లోకం పునాది వేయబడినప్పటి నుండి” అనే పదబంధాన్ని “వధించబడిన” అనే మాటతోనైనా, “రాయబడలేదు” అనే మాటతోనైనా అనుసంధానించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: ఆరాధన చేస్తారు
  rationale: ప్రకటన గ్రంథంలో ఈ క్రియ దేవునికి లేదా గొర్రెపిల్లకు చేసే ఆరాధనకూ, మృగానికి చేసే ఆరాధనకూ వాడబడుతుంది; అందువల్ల మతపరమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: భూమిపై నివసించే వారు
  rationale: ప్రకటన గ్రంథమంతటా పునరావృతమయ్యే వ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో, దాని క్రియారూపాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: οὗ οὐ γέγραπται τὸ ὄνομα αὐτοῦ
  choice: ఎవరి పేరు రాయబడలేదో
  rationale: సంబంధవాచక ఏకవచన నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, ప్రతి వ్యక్తి పేరుపై ఉన్న దృష్టిని నిలుపుతుంది; పరిపూర్ణ కాలంలోని ఫలితస్థితిని ‘రాయబడలేదు’ తెలియజేస్తుంది.
- source_word: βιβλίῳ τῆς ζωῆς
  choice: జీవగ్రంథం
  rationale: అపోకలిప్టిక్ రూపకాన్ని సంక్షిప్తంగా, తెలుగులో స్థిరపడిన బైబిలు పదబంధంతో అందిస్తుంది.
- source_word: τοῦ ἀρνίου
  choice: గొర్రెపిల్ల
  rationale: ప్రకటనలో క్రీస్తును సూచించే బిరుదులోని బలి సంబంధమైన రూపకాన్ని నిలుపుతుంది.
- source_word: τοῦ ἐσφαγμένου
  choice: వధించబడిన
  rationale: σφάζωలోని హింసాత్మకమైన, బలి సంబంధమైన భావాన్ని ‘చంపబడిన’ కంటే బలంగా, అయితే ఆధునిక గౌరవప్రదమైన శైలిలో తెలియజేస్తుంది.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: లోకం పునాది వేయబడినప్పటి నుండి
  rationale: ἀπό + షష్ఠీ విభక్తి సూచించే ప్రారంభకాల భావాన్ని నేరుగా అందిస్తూ, ‘foundation of the world’ అనే బైబిలు రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘ἀπὸ καταβολῆς κόσμου’ అనే కాలపదబంధం దేనితో అనుసంధానమవుతుంది?
  choice: ప్రధాన పాఠ్యంలో ‘వధించబడిన గొర్రెపిల్ల’తో అనుసంధానం
  alternative: ‘లోకం పునాది వేయబడినప్పటి నుండి ఎవరి పేరు ... రాయబడలేదో’ అని ‘రాయబడలేదు’తో అనుసంధానం
  rationale: గ్రీకు పదక్రమంలో ఈ పదబంధం వెంటనే ముందున్న τοῦ ἐσφαγμένου (‘వధించబడిన’)తో సహజంగా అనుసంధానమవుతుంది. అయితే ప్రకటన 17:8లోని సమాంతర వాక్యం పేర్లు రాయబడటంతో అనుసంధానానికి బలమైన మద్దతు ఇస్తుంది. నిజమైన వాక్యనిర్మాణ సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మృగాన్ని సూచించే αὐτόνకు తెలుగు వ్యాకరణానుసారం ‘దానికి’ వాడబడింది. ప్రధాన పాఠ్యంలో గ్రీకు పదక్రమానికి దగ్గరైన అనుసంధానాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో స్పష్టంగా ఇచ్చాం.
