revisions:
- from: తర్వాత భూమిలోనుండి[a] పైకి వస్తున్న మరొక మృగాన్ని నేను చూశాను. దానికి గొర్రెపిల్ల కొమ్ములవంటి రెండు కొమ్ములు ఉన్నాయి; అయితే అది ఘటసర్పంలా మాట్లాడుతూ ఉంది.
  to: అప్పుడు భూమి నుండి[a] పైకి వస్తున్న మరొక మృగాన్ని నేను చూశాను. దానికి గొర్రెపిల్లవంటి రెండు కొమ్ములు ఉండేవి, అది ఘటసర్పంలా మాట్లాడేది.
