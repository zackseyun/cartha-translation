id: REV.13.11
reference: Revelation 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: te
  text: అప్పుడు భూమి నుండి[a] పైకి వస్తున్న మరొక మృగాన్ని నేను చూశాను. దానికి గొర్రెపిల్లవంటి రెండు కొమ్ములు ఉండేవి, అది ఘటసర్పంలా మాట్లాడేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేల/దేశం నుండి పైకి వస్తున్న.’ గ్రీకు γῆ అనే పదానికి ‘భూమి,’ ‘నేల,’ లేదా సందర్భానుసారం ‘దేశం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: మరొక మృగం
  rationale: ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ ప్రతీకాత్మక భావాన్ని ‘మృగం’ నిలుపుతుంది; ἄλλοను సహజంగా ‘మరొక’ అని అనువదించాం.
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: భూమిలోనుండి పైకి వస్తున్న
  rationale: వర్తమాన కృదంతం చూపే కొనసాగుతున్న దృశ్యచలనాన్ని ‘పైకి వస్తున్న’ స్పష్టంగా తెలియజేస్తుంది. γῆకి ‘భూమి’ లేదా ‘నేల/దేశం’ అనే అర్థాలు సాధ్యమైనా, సముద్రం నుండి వచ్చిన మృగంతో ఉన్న విశాల ప్రతీకాత్మక వ్యత్యాసాన్ని ‘భూమి’ నిలుపుతుంది.
- source_word: εἶχεν
  choice: దానికి ... ఉన్నాయి
  rationale: అసంపూర్ణ భూతకాల క్రియ ఇక్కడ దృశ్యంలోని లక్షణాన్ని వర్ణిస్తుంది; సహజ తెలుగు వాక్యనిర్మాణంలో ‘ఉన్నాయి’ ఆ భావాన్ని అందిస్తుంది.
- source_word: κέρατα δύο
  choice: రెండు కొమ్ములు
  rationale: ప్రత్యక్ష అనువాదం; అపోకలిప్టిక్ సాహిత్యంలో శక్తి లేదా అధికారానికి సంబంధించిన ప్రతీకాత్మక చిత్రాన్ని నిలుపుతుంది.
- source_word: ὅμοια ἀρνίῳ
  choice: గొర్రెపిల్ల కొమ్ములవంటి
  rationale: ὅμοια వ్యాకరణపరంగా ‘కొమ్ములు’తో ఏకీభవిస్తుంది. అందువల్ల పోలిక కొమ్ముల రూపానికి చెందుతుందనే విషయాన్ని సహజ తెలుగులో స్పష్టంగా ఉంచాం; ἀρνίονను ‘గొర్రెపిల్ల’గా అనువదించడం ప్రకటన గ్రంథంలోని గొర్రెపిల్ల ప్రతిమతో సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐλάλει
  choice: మాట్లాడుతూ ఉంది
  rationale: అసంపూర్ణ భూతకాలం సూచించే కొనసాగుతున్న లేదా లక్షణాత్మక చర్యను ఈ రూపం నిలుపుతుంది.
- source_word: ὡς δράκων
  choice: ఘటసర్పంలా
  rationale: ὡς పోలికను సూచిస్తుంది; మృగమే ఘటసర్పమని గుర్తింపును విధించకుండా, దాని మాట ఘటసర్పపు మాటవంటిదని తెలియజేస్తుంది. ‘ఘటసర్పం’ ప్రకటన గ్రంథంలోని మహా అపోకలిప్టిక్ సర్పానికి తగిన గౌరవప్రదమైన తెలుగు పదం.
theological_decisions:
- issue: ἀρνίον పదం ప్రకటన గ్రంథంలోని గొర్రెపిల్ల ప్రతిమను ప్రతిధ్వనింపజేయడం
  choice: గొర్రెపిల్ల
  alternative: చిన్న గొర్రెపిల్ల
  rationale: ‘గొర్రెపిల్ల’ సహజ తెలుగులో ప్రతీకాత్మక సంబంధాన్ని నిలుపుతుంది. ‘చిన్న గొర్రెపిల్ల’ మూలంలో అవసరమైనదానికంటే ఎక్కువగా పరిమాణ భావాన్ని ముందుకు తెస్తుంది. ఈ మృగం నిజమైన గొర్రెపిల్లేనని కాక, దాని కొమ్ములు గొర్రెపిల్ల కొమ్ములవంటివని ఉన్న ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
- issue: γῆను ‘భూమి’గా లేదా ‘నేల/దేశం’గా అనువదించడం
  choice: భూమి
  alternative: నేల; దేశం
  rationale: రెండు భావాలూ పదపరంగా సాధ్యమే. సందర్భంలోని సముద్రపు మృగంతో విశాలమైన ప్రతీకాత్మక వ్యత్యాసాన్ని ‘భూమి’ బాగా నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం మూలంలోని అర్థవిస్తృతిని కాపాడుతుంది.
- issue: ὡς δράκωνలో పోలికను గుర్తింపుగా మార్చకుండా ఉంచడం
  choice: ఘటసర్పంలా మాట్లాడుతూ ఉంది
  alternative: ఘటసర్పంగా మాట్లాడింది
  rationale: మూలంలోని ὡς పోలికను సూచిస్తుంది. కాబట్టి ఈ మృగాన్ని ఘటసర్పంతో నేరుగా ఏకీకరించకుండా, దాని మాటతీరులోని పోలికను మాత్రమే తెలుపుతాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన దర్శన-వర్ణనా శైలిని ఉపయోగించాం. ‘అయితే’ను రెండవ లక్షణంలోని మోసపూరిత వ్యత్యాసాన్ని సహజ తెలుగులో వ్యక్తం చేయడానికి వాడాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
