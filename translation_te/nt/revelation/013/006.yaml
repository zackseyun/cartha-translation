revisions:
- from: అది దేవునికి వ్యతిరేకంగా దైవదూషణలు పలకడానికి తన నోరు తెరిచింది; ఆయన నామాన్ని, ఆయన నివాసాన్ని—అంటే పరలోకంలో నివసించేవారిని[a]—దూషించింది.[b]
  to: అది దేవునికి వ్యతిరేకంగా దైవదూషణలు పలకడానికి తన నోరు తెరిచింది—ఆయన నామాన్నీ, ఆయన నివాసాన్నీ[b], పరలోకంలో నివసించేవారినీ దూషించడానికి.[a]
  rationale: Removed the non-source explanatory ‘అంటే’; restored a Telugu purpose construction corresponding to βλασφημῆσαι; retained the final phrase in direct juxtaposition so that the source ambiguity is not settled in the main text; and moved the lexical footnote marker to ‘నివాసం.’
  reviewer_model: gpt-5.6-terra
