id: REV.13.6
reference: Revelation 13:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: te
  text: అది దేవునికి వ్యతిరేకంగా దైవదూషణలు పలకడానికి తన నోరు తెరిచింది—ఆయన నామాన్నీ, ఆయన నివాసాన్నీ[b], పరలోకంలో నివసించేవారినీ దూషించడానికి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఆయన నివాసాన్ని, పరలోకంలో నివసించేవారిని”; చివరి పదబంధాన్ని ‘దూషించడానికి’ అనే క్రియకు మూడవ కర్మగా కూడా అర్థం చేసుకోవచ్చు.'
    reason: alternative_reading
  - marker: b
    text: “నివాసం” అనే పదాన్ని “గుడారం” లేదా “నివాస గుడారం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: తన నోరు తెరిచింది
  rationale: గ్రీకు వాక్యంలోని సజీవమైన నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా నిలుపుతుంది; మొదటి αὐτοῦ మృగాన్ని సూచిస్తుంది.
- source_word: εἰς βλασφημίας πρὸς τὸν θεόν
  choice: దేవునికి వ్యతిరేకంగా దైవదూషణలు పలకడానికి
  rationale: వైరభావంతో కూడిన మాటల సందర్భంలో πρός యొక్క భావాన్ని ‘వ్యతిరేకంగా’ తెలియజేస్తుంది; బహువచనమైన βλασφημίαςను ‘దైవదూషణలు’గా నిలుపుతుంది.
- source_word: βλασφημῆσαι
  choice: దూషించింది
  rationale: తెలుగు వాక్యప్రవాహం కోసం ఉద్దేశం/ఫలితాన్ని ప్రధాన క్రియతో సహజంగా వ్యక్తం చేస్తుంది; దేవుని నామం, నివాసం పట్ల దూషణ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ఆయన నామాన్ని
  rationale: ‘నామం’ అనే బైబిలు సంబంధమైన భావాన్ని, దేవుని గుర్తింపు మరియు ఘనతతో దాని సంబంధాన్ని విస్తరించకుండా నిలుపుతుంది.
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: ఆయన నివాసాన్ని
  rationale: σκηνήకు గుడారం/నివాసం అనే అర్థాలు ఉన్నాయి; ఇక్కడ ‘నివాసం’ ఆధునిక పాఠకులకు సహజంగా ఉండి పరలోక నివాస భావాన్ని అందిస్తుంది.
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: పరలోకంలో నివసించేవారిని
  rationale: σκηνοῦντας యొక్క నిరంతర నివాస భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ముందున్న ‘నివాసం’కు వివరణాత్మక అనుబంధంగా ప్రధాన పాఠ్యంలో ఉంచబడింది.
theological_decisions:
- issue: ‘ఆయన నివాసం’కు ‘పరలోకంలో నివసించేవారు’ అనే చివరి పదబంధంతో ఉన్న సంబంధం
  choice: చివరి పదబంధాన్ని ‘ఆయన నివాసం’కు వివరణాత్మక అనుబంధంగా డాష్ మరియు ‘అంటే’తో చూపించడం
  alternative: 'దాన్ని దూషణకు మూడవ సమాన కర్మగా చదవడం: ‘ఆయన నివాసాన్ని, పరలోకంలో నివసించేవారిని’'
  rationale: గ్రీకు వ్యాకరణం అనుబంధ వివరణను గానీ, మూడవ సమన్విత కర్మను గానీ అనుమతిస్తుంది. σκηνή మరియు σκηνοῦντας మధ్య పదసంబంధం అనుబంధ పఠనానికి బలం ఇస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మృగాన్ని సూచించే ‘అది/తన’ మరియు దేవునిని సూచించే ‘ఆయన’ మధ్య సర్వనామ భేదం స్పష్టంగా ఉంచబడింది.
