id: REV.13.10
reference: Revelation 13:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: te
  text: ఎవరైనా చెరలోనికి పోవలసి ఉంటే, వారు చెరలోనికే పోతారు[a]; ఎవరైనా ఖడ్గంతో చంపబడవలసి ఉంటే, వారు ఖడ్గంతోనే చంపబడాలి[b]. పరిశుద్ధుల సహనమూ విశ్వాసమూ[c] ఇక్కడే ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరైనా చెరలోనికి పోతే, వారు చెరలోనికే పోతారు.” ఈ వాక్యాన్ని ఆజ్ఞగా కాకుండా నియమించబడిన గతి గురించిన ప్రకటనగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో ఈ ఉపవాక్యం భిన్నంగా ఉంది; వాటిలో “ఎవరైనా ఖడ్గంతో చంపితే, వారు ఖడ్గంతోనే చంపబడాలి” అనే భావమిచ్చే పాఠం కూడా ఉంది. ఇక్కడ స్వీకరించిన పాఠాన్నే అనుసరించాం; అయితే ఈ పాఠభేదం వ్యాఖ్యానానికి ముఖ్యమైనది.
    reason: textual_variant
  - marker: c
    text: లేదా, “విశ్వాసనీయత.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: ఎవరైనా
  rationale: సాధారణంగా ఎవరికైనా వర్తించే షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: చెరలోనికి పోవలసి ఉంటే ... చెరలోనికే పోతారు
  rationale: మూలంలోని ‘చెరలోనికి’ అనే పునరుక్తిని నిలుపుతూ, వాక్యంలోని నియమిత గతి లేదా అనివార్యత భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: αἰχμαλωσία
  choice: చెర
  rationale: బందీగా తీసుకుపోబడే స్థితిని సంక్షిప్తంగా, బైబిలు తీర్పు ధ్వనికి తగినట్లుగా సూచిస్తుంది.
- source_word: ἐν μαχαίρῃ
  choice: ఖడ్గంతో
  rationale: సాధనార్థక ప్రయోగాన్ని సహజంగా వ్యక్తం చేస్తూ బైబిలు శైలిని నిలుపుతుంది.
- source_word: ἀποκτανθῆναι
  choice: చంపబడవలసి / చంపబడాలి
  rationale: గ్రీకు భూతకర్మక క్రియారూపాన్ని, దానిలోని అనివార్యతను స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὧδέ ἐστιν
  choice: ఇక్కడే ఉన్నాయి
  rationale: తరువాత చెప్పే లక్షణాలవైపు దృష్టి మళ్లించే ‘ఇక్కడ’ అనే సూచనార్థాన్ని నేరుగా కాపాడుతుంది.
- source_word: ὑπομονή
  choice: సహనం
  rationale: పీడనలో నిలకడగా భరించడాన్ని సూచించే సరళమైన, ప్రస్తుత తెలుగు పదం.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: పదానికి ప్రధానమైన అర్థాన్ని నిలుపుతుంది; ఈ సందర్భంలో సాధ్యమైన ‘విశ్వాసనీయత’ భావాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధుల
  rationale: ప్రకటన గ్రంథంలో దేవునికి చెందిన పవిత్ర ప్రజలను సూచించే సంప్రదాయబద్ధమైన, అర్థమయ్యే పదం.
theological_decisions:
- issue: మొదటి రెండు ఉపవాక్యాలు నియమిత గతి గురించిన వర్ణనా, లేక ఆజ్ఞా?
  choice: నియమితమైన లేదా అనివార్యమైన గతి గురించిన వర్ణన
  alternative: హింసను ఎదిరించవద్దనే ఆజ్ఞ; లేదా చెరపట్టేవారూ చంపేవారూ అదే శిక్ష పొందుతారనే ప్రతీకార సూత్రం
  rationale: స్వీకరించిన గ్రీకు పాఠం సంక్షిప్తంగా, క్లిష్టంగా ఉన్నప్పటికీ, చెరకు లేదా ఖడ్గమరణానికి నియమించబడిన గతి నెరవేరుతుందనే సామెతసదృశ ప్రకటనగా సహజంగా చదవబడుతుంది. పాఠం స్పష్టంగా బోధించని అహింసా సిద్ధాంతాన్నిగానీ ప్రతీకార సిద్ధాంతాన్నిగానీ అనువాదంలో చేర్చలేదు.
- issue: πίστις పదం యొక్క సందర్భార్థం
  choice: విశ్వాసం
  alternative: విశ్వాసనీయత
  rationale: మూలపదం ‘విశ్వాసం’ అని అనువదించబడింది; పీడనలో నిలకడ అనే సందర్భం వల్ల ‘విశ్వాసనీయత’ కూడా సాధ్యమైన భావం కావడంతో దాన్ని పాదటిప్పణిలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. సాధారణ వ్యక్తిని సూచించే ‘ఎవరైనా’తో సరిపోలేలా గౌరవార్థక బహువచన క్రియారూపాలు వాడబడ్డాయి. మూలంలోని పునరుక్తి, భూతకర్మక నిర్మాణం, తీర్పు ధ్వని సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
