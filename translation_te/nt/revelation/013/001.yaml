  source_fidelity: The draft accurately retains the beast, its emergence from the sea, ten horns, seven heads, ten diadems/crowns on its horns, and names of blasphemy on its heads. However, “అప్పుడు” adds a temporal inference not expressed by Καὶ, which is simply connective (“And”). The revision removes that addition.
