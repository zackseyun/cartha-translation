id: REV.13.1
reference: Revelation 13:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: te
  text: నేను సముద్రం నుండి పైకి వస్తున్న ఒక మృగాన్ని చూశాను. దానికి పది కొమ్ములు, ఏడు తలలు ఉన్నాయి. దాని కొమ్ములపై పది రాజకిరీటాలు[a], దాని తలలపై దైవదూషణ పేర్లు[b] ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నిర్దిష్టంగా, “డయడెములు”; అంటే రాజాధికారాన్ని సూచించే కిరీటాలు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దైవదూషణకరమైన పేర్లు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: ὁράω క్రియ యొక్క భూతకాల కథన రూపాన్ని అదనపు వివరణ లేకుండా సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ἐκ τῆς θαλάσσης
  choice: సముద్రంలోనుండి
  rationale: ἐκ సూచించే లోపలినుండి వెలువడే భావాన్ని, దర్శనంలోని సజీవ దృశ్యాన్ని నిలుపుతుంది.
- source_word: θηρίον
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలోని సంకేతాత్మక జీవిని ముందుగానే వ్యాఖ్యానించకుండా, గంభీరమైన సాధారణ తెలుగు పదంతో సూచిస్తుంది.
- source_word: ἀναβαῖνον
  choice: పైకి వస్తున్న
  rationale: వర్తమాన కృదంతం చూపించే కొనసాగుతున్న కదలికను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κέρατα δέκα καὶ κεφαλὰς ἑπτά
  choice: పది కొమ్ములు, ఏడు తలలు
  rationale: దర్శనంలోని సంకేతాత్మక రూపాలను వ్యాఖ్యానించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: διαδήματα
  choice: రాజకిరీటాలు
  rationale: διάδημα సాధారణ కిరీటం కంటే రాజాధికారాన్ని సూచించే కిరీటమని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; సాంకేతిక ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: ὀνόματα βλασφημίας
  choice: దైవదూషణ పేర్లు
  rationale: గ్రీకు నామవాచక-షష్ఠీ నిర్మాణాన్ని దగ్గరగా నిలుపుతూ, దేవునికి వ్యతిరేకమైన దూషణ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రతీకాత్మక అంత్యకాల దర్శన చిత్రణ
  choice: ‘మృగం,’ ‘కొమ్ములు,’ ‘తలలు,’ ‘రాజకిరీటాలు,’ ‘దైవదూషణ పేర్లు’ అనే చిత్రణను ప్రధాన పాఠ్యంలోనే నిలుపడం
  alternative: మృగాన్ని రాజ్యం, సామ్రాజ్యం, పాలకుడు లేదా సాతాను సంబంధమైన ప్రతినిధిగా అనువాదంలోనే గుర్తించడం
  rationale: వచనం ప్రతీకలను చూపుతుంది గాని వాటి గుర్తింపును ఇక్కడ నిర్ధారించదు. అందువల్ల ఏ ప్రత్యేక అంత్యకాల వ్యాఖ్యానాన్నీ పాఠ్యంలోకి తేవకుండా అసలు ఉద్వేగాన్ని నిలుపుతుంది.
- issue: διαδήματα యొక్క రాజాధికార భావం
  choice: ప్రధాన పాఠ్యంలో ‘రాజకిరీటాలు’
  alternative: ‘కిరీటాలు’ లేదా ‘డయడెములు’
  rationale: ‘రాజకిరీటాలు’ అనే పదం సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి, διάδημα లోని ప్రత్యేక రాజచిహ్న భావాన్ని కూడా కాపాడుతుంది.
- issue: ὀνόματα βλασφημίας లోని షష్ఠీ సంబంధం
  choice: ‘దైవదూషణ పేర్లు’
  alternative: ‘దైవదూషణకరమైన పేర్లు’
  rationale: మూలంలోని ‘దూషణ యొక్క పేర్లు’ అనే నిర్మాణ సంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది; విశేషణాత్మక అర్థసాధ్యతను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన దర్శన-కథన శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలోని వరుస participial నిర్మాణాన్ని తెలుగులో చిన్న, స్పష్టమైన వాక్యాలుగా విభజించినా భావక్రమం నిలుపబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
