id: REV.13.14
reference: Revelation 13:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: te
  text: అది భూమిపై నివసించేవారిని మోసగిస్తుంది.[a] మృగం సమక్షంలో చేయడానికి దానికి అనుమతి ఇవ్వబడిన సూచకాల ద్వారా, కత్తి గాయాన్ని పొంది బ్రతికిన ఆ మృగం కోసం ఒక ప్రతిమను చేయాలని[b] భూమిపై నివసించేవారికి చెబుతుంది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భూమిపై నివసించేవారిని తప్పుదారి పట్టిస్తుంది.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మృగం యొక్క ప్రతిమను చేయాలని’; గ్రీకు వాక్యం అక్షరార్థంగా ‘మృగం కోసం ఒక ప్రతిమ’ అని చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘కత్తి గాయం కలిగి బ్రతికిన ఆ మృగం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: మోసగిస్తుంది
  rationale: వర్తమానకాల క్రియలోని తప్పుదారి పట్టించే కారణార్థక భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘తప్పుదారి పట్టిస్తుంది’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: κατοικοῦντας / κατοικοῦσιν ἐπὶ τῆς γῆς
  choice: భూమిపై నివసించేవారు
  rationale: ప్రకటన గ్రంథంలో పునరావృతమయ్యే ఈ అభివ్యక్తిలోని క్రియాత్మక భావాన్ని నిలుపుతూ సహజమైన తెలుగును ఇస్తుంది.
- source_word: διὰ τὰ σημεῖα
  choice: సూచక క్రియల ద్వారా
  rationale: διά తో కూడిన కర్మకారక రూపం ఇక్కడ సాధనార్థక-కారణార్థక భావాన్ని కలిగి ఉంది; ‘ద్వారా’ మోసం జరిగే సాధనాన్ని ప్రధానంగా చూపిస్తూ కారణ సంబంధాన్నీ అనుమతిస్తుంది.
- source_word: σημεῖα
  choice: సూచక క్రియలు
  rationale: కేవలం అద్భుత ప్రదర్శనలు అనే భావాన్ని జోడించకుండా, అర్థాన్ని సూచించే కార్యాలుగా σημεῖα పదంలోని భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: చేయడానికి తనకు అనుమతి ఇవ్వబడిన
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్ని నిలుపుతుంది; అనుమతి లేదా అధికారం ఎక్కడి నుంచి వచ్చిందో పాఠ్యంలో లేనిదాన్ని చేర్చదు.
- source_word: ἐνώπιον τοῦ θηρίου
  choice: మృగం సమక్షంలో
  rationale: స్థానిక-సంబంధ భావాన్ని గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: λέγων
  choice: చెబుతుంది
  rationale: తదుపరి ఆదేశ విషయాన్ని సహజంగా పరిచయం చేస్తుంది; ‘ఆజ్ఞాపిస్తుంది’ అని అనువదించి మూలంలోని బలాన్ని మించదు.
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: మృగం కోసం ఒక ప్రతిమను చేయాలని
  rationale: τῷ θηρίῳ అనే చతుర్థీ విభక్తిని ‘కోసం’గా నిలుపుతుంది; అది తప్పనిసరిగా మృగాన్ని పోలిన ప్రతిమేనని నిర్ణయించదు.
- source_word: εἰκόνα
  choice: ప్రతిమ
  rationale: ఆరాధనా సందర్భానికి సరిపోయే విస్తృత అర్థాన్ని ఇస్తుంది; ‘విగ్రహం’లో ఉండగల అదనపు వ్యాఖ్యానాత్మక భారాన్ని నివారిస్తుంది.
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης καὶ ἔζησεν
  choice: కత్తివల్ల గాయం తగిలినా బ్రతికిన
  rationale: గాయానంతరం బ్రతికిన విరుద్ధ ఫలితాన్ని సహజ తెలుగులో తెలియజేస్తుంది; పునరుత్థానం లేదా మళ్లీ ప్రాణం పొందడం అనే బలమైన భావాన్ని తప్పనిసరిగా చేర్చదు.
- source_word: μάχαιρα
  choice: కత్తి
  rationale: ఆయుధ రకాన్ని అనవసరంగా మరింత నిర్దిష్టం చేయకుండా సాధారణంగా అర్థమయ్యే సమానార్థ పదాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: ἐδόθη లోని దైవసూచక కర్మణి ప్రయోగం
  choice: ‘అనుమతి ఇవ్వబడిన’ అని కర్మణి రూపాన్ని ఉంచి, ఇచ్చినవారిని పేర్కొనలేదు.
  alternative: ‘దేవుడు అనుమతించిన’ లేదా ‘దానికి అధికారం లభించిన’
  rationale: అపోకలిప్టిక్ శైలిలో ఈ కర్మణి ప్రయోగం దైవ అనుమతిని సూచించవచ్చు; అయితే దేవుణ్ణి ప్రత్యక్ష కర్తగా చేర్చడం మూలపాఠాన్ని మించిపోతుంది.
- issue: ἔζησεν గాయం తరువాత కలిగిన స్థితిని ఎలా తెలియజేయాలి
  choice: ‘గాయం తగిలినా బ్రతికిన’
  alternative: ‘మళ్లీ బ్రతికిన’ లేదా ‘తిరిగి ప్రాణం పొందిన’
  rationale: సందర్భంలోని ఆశ్చర్యకరమైన విరుద్ధతను నిలుపుతూ, ఈ వచనం స్పష్టంగా చెప్పని పునరుత్థాన భావాన్ని అనువాదంలో బలవంతంగా చేర్చదు.
- issue: εἰκόνα τῷ θηρίῳ లో ప్రతిమకు మృగంతో ఉన్న సంబంధం
  choice: ‘మృగం కోసం ఒక ప్రతిమ’
  alternative: ‘మృగం యొక్క ప్రతిమ’ లేదా ‘మృగాన్ని పోలిన ప్రతిమ’
  rationale: గ్రీకులో చతుర్థీ విభక్తి ఉంది, షష్ఠీ విభక్తి కాదు; అందువల్ల అంకితం లేదా ప్రయోజన సంబంధాన్ని నిలుపుతూ ప్రతిమ రూపం గురించి అదనపు నిర్ణయం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రకటన గ్రంథపు గంభీరతను నిలుపుతూ అనువదించబడింది. ‘మృగం,’ ‘ప్రతిమ,’ ‘సూచక క్రియలు’ వంటి పదాలు గ్రంథాంతర స్థిరత్వం మరియు ఆరాధనా సందర్భాన్ని దృష్టిలో ఉంచి ఎంచుకోబడ్డాయి.
