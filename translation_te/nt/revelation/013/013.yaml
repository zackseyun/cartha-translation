id: REV.13.13
reference: Revelation 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: te
  text: అది గొప్ప సూచక క్రియలు[a] చేస్తుంది; మనుషుల కళ్లముందు[b] ఆకాశం నుండి భూమిమీదికి అగ్ని దిగివచ్చేలా కూడా చేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గొప్ప అద్భుతాలు,’ లేదా ‘గొప్ప ఆశ్చర్యకార్యాలు’; గ్రీకులో ‘సూచకాలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మనుషుల సమక్షంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: చేస్తుంది
  rationale: σημεῖα అనే కర్మతో కలిసి ఉన్న ποιεῖకి తెలుగులో సహజమైన ‘చేస్తుంది’ సరిపోతుంది; క్రియలను ప్రదర్శించడం లేదా కలుగజేయడం అనే భావాన్ని సందర్భం స్పష్టం చేస్తుంది.
- source_word: σημεῖα μεγάλα
  choice: గొప్ప సూచక క్రియలు
  rationale: ‘సూచక క్రియలు’ అనేది కేవలం అద్భుతాలు అనే భావానికే పరిమితం కాకుండా, ఏదో సూచించే అపోకలిప్టిక్ క్రియల భావాన్ని నిలుపుతుంది; μεγάλαను ‘గొప్ప’గా అనువదించాం.
- source_word: ἵνα καὶ πῦρ ποιῇ
  choice: అగ్ని దిగివచ్చేలా కూడా చేస్తుంది
  rationale: ἵνα నిర్మాణంలోని ఫలిత/ఉద్దేశ భావాన్ని సహజమైన తెలుగులో ‘వచ్చేలా చేస్తుంది’ అని వ్యక్తపరచి, καί యొక్క ఉద్ఘాటనను ‘కూడా’తో నిలిపాం.
- source_word: πῦρ
  choice: అగ్ని
  rationale: సందర్భంలోని ప్రవచనాత్మక, గంభీర శైలికి తగిన నేర అర్థం.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ఆకాశం నుండి
  rationale: οὐρανόςకు ‘ఆకాశం’ లేదా ‘పరలోకం’ అనే అర్థాలు సాధ్యమైనా, కనిపించే అగ్ని భూమికి దిగివచ్చే దృశ్యంలో ‘ఆకాశం’ సహజంగా ఉంటుంది; మూలంలోని స్థల సంబంధిత అస్పష్టతను అతిగా దైవిక మూలంగా నిర్ణయించదు.
- source_word: καταβαίνειν εἰς τὴν γῆν
  choice: భూమిమీదికి దిగివచ్చేలా
  rationale: కిందికి జరిగే కదలికను ‘దిగివచ్చు’ స్పష్టంగా తెలియజేస్తుంది; εἰς τὴν γῆν గమ్యాన్ని ‘భూమిమీదికి’గా నిలుపుతుంది.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: మనుషుల కళ్లముందే
  rationale: ἐνώπιονలోని బహిరంగ దృశ్యమానతను సహజమైన తెలుగులో తెలియజేస్తుంది; ἀνθρώπωνను లింగభేదం లేకుండా ‘మనుషులు’గా ఇచ్చాం.
theological_decisions:
- issue: సూచక క్రియల స్వభావం
  choice: ప్రజలకు కనిపించే గొప్ప సూచక క్రియలుగా వర్ణించడం; అవి నిజంగా అతీంద్రియమైనవా లేక మోసపూరిత ప్రదర్శనలా అన్నది నిర్ణయించకపోవడం
  alternative: ‘గొప్ప అద్భుతాలు’ అని అనువదించి అతీంద్రియ స్వభావాన్ని ముందుగానే సూచించడం, లేదా మాయాజాలమని స్పష్టీకరించడం
  rationale: ఈ వాక్యం సూచక క్రియలు జరుగుతున్నట్లు, అగ్ని ప్రజల కళ్లముందు దిగుతున్నట్లు చెబుతుంది; వాటి యాంత్రిక లేదా తాత్త్విక స్వభావాన్ని ఇక్కడ తేల్చదు.
- issue: οὐρανός యొక్క భావం
  choice: ఆకాశం
  alternative: పరలోకం
  rationale: మూలపదం రెండింటినీ సూచించగలదు. ఈ దృశ్య కదలికలో ‘ఆకాశం’ సహజమైనది; అయితే దాని మూలం నిజంగా పరలోక సంబంధమైనదని అనువాదమే నిర్ణయించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రకటన గ్రంథపు గంభీర, అపోకలిప్టిక్ శైలిని నిలిపాం. ‘అది’ అనే నపుంసక సర్వనామం మృగాన్ని సూచిస్తుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
