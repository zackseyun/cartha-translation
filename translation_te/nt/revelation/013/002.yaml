id: REV.13.2
reference: Revelation 13:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: te
  text: నేను చూసిన ఆ మృగం చిరుతపులిలా[a] ఉంది. దాని పాదాలు ఎలుగుబంటి పాదాల్లా ఉన్నాయి, దాని నోరు సింహం నోరులా ఉంది. ఆ ఘటసర్పం తన శక్తిని, తన సింహాసనాన్ని, గొప్ప అధికారాన్ని దానికి ఇచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చిరుతపులి, ఎలుగుబంటి, సింహం అనే ఈ రూపచిత్రాలు దానియేలు 7లోని మృగాల దర్శనాలను ప్రతిధ్వనింపజేస్తాయి.
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలోని భయానకమైన అపోకలిప్టిక్ ప్రతీకకు ‘మృగం’ సహజమైనదీ, స్థిరపడినదీ అయిన తెలుగు పదం; తటస్థమైన ‘జంతువు’ కంటే మూలంలోని ప్రతీకాత్మక బలాన్ని నిలుపుతుంది.
- source_word: ὅμοιον παρδάλει
  choice: చిరుతపులిలా
  rationale: ὅμοιος + చతుర్థీ విభక్తి పోలికను సూచిస్తుంది. ‘చిరుతపులిలా’ ఆధునిక తెలుగులో సహజంగా ఉండి దర్శనంలోని పోలికను వివరణ జోడించకుండా కాపాడుతుంది.
- source_word: πόδες ... ὡς ἄρκου
  choice: పాదాలు ఎలుగుబంటి పాదాల్లా
  rationale: πούς యొక్క సాధారణ అర్థం ‘పాదం’; జంతు సందర్భం వల్ల ‘పంజాలు’ అని ప్రత్యేకీకరించకుండా మూలానికి దగ్గరగా ఉంచాం. గ్రీకులోని సంక్షిప్త పోలికను తెలుగులో స్పష్టత కోసం ‘ఎలుగుబంటి పాదాల్లా’ అని సహజంగా విప్పాం.
- source_word: στόμα ... ὡς στόμα λέοντος
  choice: నోరు సింహం నోరులా
  rationale: మూలంలో στόμα రెండుసార్లు ఉన్నందున దృశ్యపు స్పష్టతను, వాక్య సమతూకాన్ని నిలుపుతూ ‘నోరు’ను రెండుసార్లు ఉంచాం.
- source_word: δράκων
  choice: ఘటసర్పం
  rationale: ప్రకటన గ్రంథంలోని δράκων అనే అపోకలిప్టిక్ మహాసర్ప రూపాన్ని సూచించే గంభీరమైన తెలుగు పదం. సాధారణ ‘సర్పం’ కంటే ఆ రూపపు విస్తారతను నిలుపుతుంది; అర్థాన్ని సిద్ధాంతపరంగా విస్తరించదు.
- source_word: ἔδωκεν
  choice: ఇచ్చింది
  rationale: δίδωμι యొక్క ప్రత్యక్ష అర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘అనుగ్రహించింది’ వంటి అదనపు భావఛాయను నివారిస్తుంది.
- source_word: δύναμιν
  choice: శక్తి
  rationale: కార్యసామర్థ్యాన్ని సూచించే δύναμιςకు ‘శక్తి’ సహజమైన సమానం; ἐξουσίαతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: θρόνον
  choice: సింహాసనం
  rationale: θρόνος యొక్క రాజాధికార, పాలనా భావాలను ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: ἐξουσίαν μεγάλην
  choice: గొప్ప అధికారం
  rationale: ἐξουσία సూచించే పాలించే హక్కు లేదా అప్పగించబడిన అధికారాన్ని ‘అధికారం’ స్పష్టంగా వ్యక్తం చేస్తుంది; δύναμις (‘శక్తి’)తో కలపదు.
- source_word: αὐτοῦ / αὐτῷ
  choice: తన / దానికి
  rationale: తెలుగులో వ్యాకరణ లింగభేదం లేకుండానే సూచన స్పష్టంగా ఉంటుంది. ‘తన’ ఘటసర్పానికి చెందిన శక్తి, సింహాసనాన్ని సూచిస్తే, ‘దానికి’ మృగాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ఘటసర్పం మరియు మృగం మధ్య సంబంధాన్ని సర్వనామాలతో చూపడం
  choice: మృగాన్ని ‘దాని/దానికి’ అని, ఘటసర్పపు వాటిని ‘తన’ అని సూచించాం.
  alternative: రెండింటికీ ఒకే విధమైన సూచన పదాలను వాడడం.
  rationale: గ్రీకు αὐτός రూపాలు సందర్భానుసారంగా రెండింటినీ సూచించినా, తెలుగులో ‘తన ... దానికి’ అనే నిర్మాణం ఎవరు ఇచ్చారు, ఎవరికి ఇచ్చారు అన్నది స్పష్టం చేస్తుంది; ఘటసర్పపు వ్యక్తిత్వం గురించి అదనపు సిద్ధాంత నిర్ణయాన్ని రుద్దదు.
- issue: మిశ్రమ జంతు రూపకాన్ని వ్యాఖ్యానించకుండా నిలుపడం
  choice: చిరుతపులి, ఎలుగుబంటి, సింహం పోలికలను ప్రధాన వాక్యంలో నేరుగా అనువదించాం.
  alternative: దానియేలు 7తో ఉన్న సంబంధాన్ని ప్రధాన వాక్యంలోనే వివరించడం.
  rationale: మూల గ్రీకు పోలికలను మాత్రమే ఇస్తుంది. దానియేలు 7 ప్రతిధ్వనిని పాదటిప్పణిలో తెలియజేయడం ద్వారా మూలపాఠంలోని ప్రతీకాత్మక ఉద్రిక్తతను నిలుపుతూ వ్యాఖ్యానాన్ని వచనంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. దర్శనపు పునరుక్తి, మూడు జంతు పోలికలు, శక్తి–అధికారం మధ్య భావభేదం నిలుపబడ్డాయి. [a] గుర్తు సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
