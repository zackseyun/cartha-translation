id: REV.13.12
reference: Revelation 13:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: te
  text: అది మొదటి మృగపు అధికారమంతటినీ దాని సమక్షంలో[a] చెలాయిస్తుంది. మరణకరమైన గాయం నయమైన ఆ మొదటి మృగాన్ని[b] భూమి, దానిపై నివసించేవారు ఆరాధించేలా అది చేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని ఎదుట.’ రెండో మృగం మొదటి మృగం చూస్తుండగా లేదా దాని తక్షణ సన్నిధిలో పనిచేస్తుందనే భావం ఈ మాటల్లో ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దాని మరణపు గాయం నయమైన.’ అంటే, ‘దాని మరణకరమైన గాయం నయమైన.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: ఇది కేవలం బలాన్ని కాక, వినియోగించబడే అధికారాన్ని లేదా హక్కును సూచిస్తుంది.
- source_word: πᾶσαν
  choice: అంతటినీ
  rationale: మొదటి మృగపు అధికార సంపూర్ణతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ποιεῖ (first occurrence)
  choice: చెలాయిస్తుంది
  rationale: ποιεῖ τὴν ἐξουσίαν అనే ప్రయోగానికి ‘అధికారాన్ని చెలాయిస్తుంది’ సహజమైన, అర్థసమానమైన తెలుగు.
- source_word: ἐνώπιον αὐτοῦ
  choice: దాని సమక్షంలో
  rationale: మొదటి మృగం ఎదుట లేదా దాని సన్నిధిలో రెండో మృగం కార్యం చేస్తుందనే స్థలాత్మక, సంబంధాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ποιεῖ (second occurrence)
  choice: ఆరాధించేలా ... చేస్తుంది
  rationale: ἵνα నిర్మాణంతో కలిసి ఇది కారణార్థక భావాన్ని ఇస్తుంది; బలవంతం యొక్క ఖచ్చిత స్థాయిని అదనంగా చేర్చదు.
- source_word: τὴν γῆν
  choice: భూమి
  rationale: ప్రకటన గ్రంథంలోని ఆకాశం, సముద్రం మొదలైన వాటికి భిన్నమైన ప్రపంచవ్యాప్త స్థల భావానికి సరిపోతుంది.
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: దానిపై నివసించేవారు
  rationale: భూమిపై నివసించేవారనే ప్రకటన గ్రంథపు పునరావృత అభివ్యక్తిలోని క్రియాత్మక రూపాన్ని నిలుపుతుంది.
- source_word: ἵνα προσκυνήσουσιν
  choice: ఆరాధించేలా
  rationale: కారణార్థక ప్రధాన క్రియతో ఉద్దేశించిన లేదా కలిగించిన చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: θηρίον
  choice: మృగం
  rationale: అపోకలిప్టిక్ సందర్భంలో θηρίονకు ప్రత్యక్షమైన, స్థిరమైన తెలుగు సమానం.
- source_word: πρῶτον
  choice: మొదటి
  rationale: తక్షణ సందర్భంలోని రెండో మృగం నుండి దీనిని స్పష్టంగా వేరు చేస్తుంది.
- source_word: ἐθεραπεύθη
  choice: నయమైన
  rationale: నిష్క్రియ రూపంలోని స్వస్థపరచబడిన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: మరణకరమైన గాయం
  rationale: అక్షరార్థంగా ‘దాని మరణపు గాయం’; మరణాన్ని కలిగించే గాయం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: భూమిపై నివసించేవారి విషయంలో రెండో మృగపు చర్యకు ఉన్న బలం
  choice: ఆరాధించేలా ... చేస్తుంది
  alternative: ఆరాధించమని బలవంతం చేస్తుంది
  rationale: గ్రీకు కారణార్థక నిర్మాణం ఆరాధనను రెండో మృగం కలిగిస్తుందని చెబుతుంది; అయితే ఈ వాక్యంలో బలవంతపు ఖచ్చిత స్థాయిని నిర్దేశించదు. కాబట్టి మరింత బలమైన భావాన్ని దిగుమతి చేయకుండా మూలంలోని ఉద్రేకాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘చెలాయిస్తుంది’ అధికార వినియోగాన్ని సహజంగా తెలియజేస్తుంది; ‘ఆరాధించేలా ... చేస్తుంది’ కారణార్థాన్ని నిలుపుతూ అనవసరంగా బలవంతపు భావాన్ని పెంచదు. రెండు పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
