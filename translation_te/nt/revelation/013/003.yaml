revisions:
- from: దాని తలల్లో ఒకటి చంపబడి మరణించినట్లుగా కనిపించింది[a]; అయితే దాని ప్రాణాంతక గాయం మానిపోయింది. భూమంతా ఆశ్చర్యపడి ఆ మృగం వెంట వెళ్లింది[b].
  to: దాని తలల్లో ఒకటి చంపబడి మరణించినట్లుగా ఉంది[a]; దాని ప్రాణాంతక గాయం మానిపోయింది. భూమంతా ఆశ్చర్యపడి ఆ మృగం వెంట వెళ్లింది[b].
  rationale: The revision removes the unsupported adversative ‘అయితే’ and renders the Greek comparative ὡς directly as ‘...అన్నట్లుగా ఉంది.’ It retains the source’s ambiguity regarding the beast’s apparent death, preserves the force of the mortal wounding, and leaves all footnote anchors and alternatives intact.
