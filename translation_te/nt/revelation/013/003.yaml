source:
  edition: SBLGNT
  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: te
  text: దాని తలల్లో ఒకటి చంపబడి మరణించినట్లుగా ఉంది[a]; దాని ప్రాణాంతక గాయం మానిపోయింది. భూమంతా ఆశ్చర్యపడి ఆ మృగం వెంట వెళ్లింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చంపబడి మరణించినట్లుగా ఉండింది.’ గ్రీకులో ‘అన్నట్లుగా’ అనే పోలిక ఉంది; అది నేరుగా జరిగినదని చెప్పడం కంటే కనిపించిన తీరు లేదా పోలికను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేశమంతా’; అయితే ఈ అపోకలిప్టిక్ సందర్భంలో ‘భూమంతా’ అనే అర్థమే ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: దాని తలల్లో ఒకటి
  rationale: μίαν ἐκ + షష్ఠీ బహువచనంలోని భాగార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὡς ἐσφαγμένην εἰς θάνατον
  choice: చంపబడి మరణించినట్లుగా కనిపించింది
  rationale: σφάζωలోని హింసాత్మకంగా చంపబడటం అనే బలాన్ని ఉంచుతూ, ὡς సూచించే పోలిక లేదా కనిపించే స్థితిని ‘అన్నట్లుగా కనిపించింది’ అనే భావంతో కాపాడుతుంది; εἰς θάνατον మరణం వరకు అనే తీవ్రతను వ్యక్తం చేస్తుంది.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: దాని ప్రాణాంతక గాయం
  rationale: మరణానికి దారితీసే లేదా మరణకరమైన గాయం అనే షష్ఠీ నిర్మాణ భావాన్ని సహజంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἐθεραπεύθη
  choice: మానిపోయింది
  rationale: గాయం స్వస్థపడిందనే నిష్క్రియార్థాన్ని గాయానికి సహజంగా వాడే ఆధునిక తెలుగు రూపంలో తెలుపుతుంది.
- source_word: ἐθαυμάσθη
  choice: ఆశ్చర్యపడి
  rationale: భూమంతా విస్మయానికి లోనైందనే భావాన్ని, ఆ స్పందన సానుకూలమా ప్రతికూలమా అని నిర్ణయించకుండా వ్యక్తం చేస్తుంది.
- source_word: ὅλη ἡ γῆ
  choice: భూమంతా
  rationale: γῆకు ‘దేశం/నేల’ అనే అర్థం సాధ్యమైనా, ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త సందర్భంలో ‘భూమంతా’ మరింత సంభావ్యమైనది.
- source_word: ὀπίσω τοῦ θηρίου
  choice: ఆ మృగం వెంట వెళ్లింది
  rationale: దిశాపరంగా వెనుక వెళ్లడం, విధేయతతో అనుసరించడం అనే రెండు ఛాయలనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: θηρίου
  choice: మృగం
  rationale: ప్రకటన గ్రంథపు అపోకలిప్టిక్ చిత్రణలో θηρίονకు స్థిరమైన, సూటి తెలుగు సమానం.
theological_decisions:
- issue: మృగపు తల మరణించినట్లు కనిపించడం మరియు గాయం మానిపోవడం యొక్క స్వభావం
  choice: మరణకరంగా చంపబడినట్లు కనిపించి, గాయం మానిపోయిన దృశ్యంగా అనువదించడం
  alternative: అక్షరార్థ మరణం-పునరుత్థానం; సామ్రాజ్యం లేదా పాలకుని ప్రతీకాత్మక పునరుద్ధరణ; మోసపూరితంగా ప్రదర్శించిన మరణం
  rationale: గ్రీకు పాఠంలోని ὡς పోలిక లేదా కనిపించే స్థితిని సూచిస్తుంది; సంఘటన అక్షరార్థమా, ప్రతీకాత్మకమా, మోసపూరితమా అని పాఠం తేల్చదు. అనువాదం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన, సహజమైన వాక్యనిర్మాణం. ‘చంపబడి’ σφάζω బలాన్ని ఉంచుతుంది; ‘కనిపించింది’ ὡςలోని అనిశ్చితిని స్పష్టంగా కాపాడుతుంది.
