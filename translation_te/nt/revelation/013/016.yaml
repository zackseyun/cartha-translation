id: REV.13.16
reference: Revelation 13:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the servants—to be given a mark on their right hand or on their forehead,
translation:
  language: te
  text: అది చిన్నవారైనా గొప్పవారైనా, ధనికులైనా పేదవారైనా, స్వతంత్రులైనా బానిసలైనా—అందరికీ వారి కుడిచేతి మీద గాని నుదుటి మీద గాని ఒక గుర్తు వేయబడేలా చేస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వారు వారికి ఒక గుర్తు ఇచ్చేలా.” గ్రీకు వాక్యనిర్మాణం అసాధారణంగా ఉంది; ప్రధాన పాఠం దాని భావాన్ని సహజమైన తెలుగులో కర్మణి రూపంలో అందిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: వేయబడేలా చేస్తుంది
  rationale: ποιέω + ἵνα నిర్మాణం కారణత్వాన్ని వ్యక్తం చేస్తుంది. ‘చేస్తుంది’ అనేది అది ఈ కార్యం జరిగేలా చేస్తుందని సహజమైన తెలుగులో తెలియజేస్తుంది; క్రియలో స్పష్టంగా లేని బలవంతాన్ని అదనంగా చేర్చదు.
- source_word: πάντας
  choice: అందరికీ
  rationale: తరువాత వచ్చే జతజతల సామాజిక వర్గాలన్నిటినీ సమగ్రంగా సూచిస్తుంది. ‘అందరికీ’ ఆధునిక తెలుగులో సహజంగా ఉండి విశ్వవ్యాప్త పరిధిని నిలుపుతుంది.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: చిన్నవారైనా గొప్పవారైనా
  rationale: ఇది హోదా లేదా ప్రాముఖ్యతలోని అన్ని స్థాయులను సూచించే స్థిరమైన విరుద్ధ జత. మూలంలోని రూపకాత్మక పదజాలాన్నీ ప్రకటన గ్రంథంలోని లయనూ నిలుపుతుంది.
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: ధనికులైనా పేదవారైనా
  rationale: ఆర్థిక స్థితిలోని స్పష్టమైన విరుద్ధ జతను సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: స్వతంత్రులైనా బానిసలైనా
  rationale: ‘స్వతంత్రులు’ అనే పదానికి వ్యతిరేకంగా δοῦλοι ఇక్కడ చట్టపరమైన లేదా సామాజిక బానిస స్థితిని సూచిస్తుంది; అందువల్ల ‘సేవకులు’ కంటే ‘బానిసలు’ ఖచ్చితమైనది.
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: అందరికీ ... ఒక గుర్తు వేయబడేలా
  rationale: గ్రీకు పాఠంలో క్రియ కర్తరి బహువచనంగా ఉండి అక్షరార్థంగా ‘వారు వారికి ఒక గుర్తు ఇచ్చేలా’ అని వస్తుంది; కానీ కర్త స్పష్టంగా లేదు, నిర్మాణం అసాధారణంగా ఉంది. తెలుగు ప్రధాన పాఠంలో కర్మణి నిర్మాణం సందర్భంలోని సంఘటనను సహజంగా తెలియజేస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: χάραγμα
  choice: గుర్తు
  rationale: గుర్తింపు కోసం వేసే చెక్కుడు, ముద్రణ లేదా చిహ్నం అనే విస్తృత భావాన్ని ‘గుర్తు’ సహజంగా అందిస్తుంది; ‘ముద్ర’ అని అనువదిస్తే వేరే గ్రీకు పదమైన σφραγίςతో అనవసరంగా కలిసిపోయే అవకాశం ఉంది.
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς
  choice: వారి కుడిచేతి మీద
  rationale: మూలంలోని ఏకవచన అవయవ నామాన్ని సమూహానికి పంపిణీ భావంలో సహజమైన తెలుగుగా అందిస్తుంది.
- source_word: ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: గాని నుదుటి మీద గాని
  rationale: ‘మీద ... గాని ... మీద గాని’ నిర్మాణం ప్రత్యామ్నాయ స్థానాలను స్పష్టంగా, సహజంగా తెలియజేస్తుంది; మూలంలోని ఏకవచన ‘నుదురు’ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: స్వతంత్రులు—δοῦλοι అనే సామాజిక స్థితి జత
  choice: బానిసలు
  alternative: సేవకులు
  rationale: స్వతంత్రులతో నేరుగా ఉన్న వ్యత్యాసం సాధారణ సేవను కాక బంధిత సామాజిక స్థితిని ముందుకు తెస్తుంది. కాబట్టి ‘బానిసలు’ మూలంలోని ఉద్రిక్తతను తగ్గించకుండా నిలుపుతుంది.
- issue: ἵνα δῶσιν αὐτοῖς χάραγμα అనే క్లిష్ట నిర్మాణం
  choice: ఒక గుర్తు వేయబడేలా
  alternative: వారు వారికి ఒక గుర్తు ఇచ్చేలా
  rationale: ప్రధాన పాఠంలోని కర్మణి రూపం గుర్తు పొందేవారిపై జరిగే కార్యాన్ని స్పష్టంగా చెబుతుంది, కానీ ఎవరు దాన్ని వేస్తారో నిర్ణయించదు. అసాధారణమైన కర్తరి గ్రీకు రూపాన్ని పాదసూచికలో ఉంచడం ద్వారా నిజమైన పాఠ్య అస్పష్టతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనదిగానూ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేదిగానూ రూపొందించబడింది. జతజతల విరుద్ధ వర్గాలకు ‘అయినా ... అయినా’ రూపాన్ని వాడి మూలంలోని సమగ్రతను, లయను నిలిపింది. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో సంబంధిత క్లిష్ట వాక్యభాగం తర్వాత ఉంచబడింది.
