id: REV.13.5
reference: Revelation 13:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: te
  text: గొప్ప మాటలూ[b] దేవదూషణలూ పలికే నోరు దానికి ఇవ్వబడింది. నలభై రెండు నెలలపాటు కార్యాచరణ చేయడానికి దానికి అధికారం ఇవ్వబడింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లోనూ అనువాదాల్లోనూ ఈ భాగానికి బదులుగా, “నలభై రెండు నెలలు కొనసాగడానికి దానికి అధికారం ఇవ్వబడింది” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: “గొప్ప మాటలు” అనే మాటబంధం ఈ సందర్భంలో డంబపు లేదా అహంకారపు మాటలను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη
  choice: ఇవ్వబడింది
  rationale: క్రియ యొక్క కర్మణి రూపాన్ని, అలాగే మృగానికి ఇది సహజసిద్ధంగా కాక ఇవ్వబడిందనే భావాన్ని నిలుపుతుంది; వచనంలోని పునరుక్తినీ కాపాడుతుంది.
- source_word: στόμα
  choice: నోరు
  rationale: ప్రకటన గ్రంథంలోని సజీవమైన దర్శనాత్మక రూపకాన్ని సంక్షిప్తం చేయకుండా నేరుగా నిలుపుతుంది.
- source_word: λαλοῦν
  choice: పలికే
  rationale: στόμαను విశేషించే వర్తమాన కృదంతానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: μεγάλα
  choice: గొప్ప మాటలు
  rationale: అక్షరార్థ విస్తృతిని నిలుపుతుంది; సందర్భంలో ఉన్న డంబపు లేదా అహంకారపు భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: βλασφημίας
  choice: దేవదూషణలు
  rationale: దేవునికి విరోధమైన దూషణ అనే మతపరమైన తీవ్రతను, బహువచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐξουσία
  choice: అధికారం
  rationale: ముడి శక్తికంటే ఇవ్వబడిన అనుమతి లేదా అధికార పరిధిని సూచిస్తుంది; ἐδόθηతో సహజంగా సరిపోతుంది.
- source_word: ποιῆσαι
  choice: పనిచేయడానికి
  rationale: ποιέω యొక్క విస్తృతమైన ‘చేయు/కార్యంచేయు’ భావాన్ని కాలవ్యవధితో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘కొనసాగడానికి’ అనే పాఠాంతర భావాన్ని ప్రధాన పాఠ్యంలోకి తీసుకురాదు.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: నలభై రెండు నెలలు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా, సంఖ్యను స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: μεγάλα సూచించే మాటల స్వభావం
  choice: గొప్ప మాటలు
  alternative: డంబపు మాటలు / అహంకారపు మాటలు
  rationale: సందర్భం అహంకారపూరితమైన దేవవిరోధ ప్రసంగాన్ని సూచించినా, μεγάλα స్వయంగా అంత సంకుచితంగా లేదు. ప్రధాన పాఠ్యం దాని విస్తృతిని నిలుపుతుంది; సందర్భార్థాన్ని పాదసూచిక తెలుపుతుంది.
- issue: కాలవ్యవధితో కూడిన ποιῆσαι అర్థం
  choice: నలభై రెండు నెలలు పనిచేయడానికి
  alternative: నలభై రెండు నెలలు కొనసాగడానికి
  rationale: ప్రధాన పాఠ్యం అందించిన SBLGNT పాఠమైన ποιῆσαιను అనుసరిస్తుంది. ‘కొనసాగడానికి’ అనే ప్రసిద్ధ రూపం పాఠాంతర సంప్రదాయానికి చెందినందున పాదసూచికలో ఉంచబడింది.
- issue: ఇవ్వబడిన నోరు మరియు అధికారం వెనుక కర్త
  choice: కర్తను పేర్కొనని కర్మణి ప్రయోగం
  alternative: దేవుడు ఇచ్చాడు / అనుమతించాడు
  rationale: గ్రీకు పాఠ్యం ఇచ్చినవారిని ప్రత్యక్షంగా పేర్కొనదు. దేవుని పరమాధికారాన్ని సందర్భం సూచించవచ్చుగాని, అనువాదం ఆ కర్తను స్పష్టంగా చేర్చి ఉద్రిక్తతను పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మృగాన్ని సూచించడానికి వ్యాకరణపరంగా సహజమైన నపుంసక సర్వనామం ‘దానికి’ వాడబడింది. మూలంలోని రెండు ἐδόθη రూపాల పునరుక్తి నిలుపబడింది; పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
