id: REV.13.18
reference: Revelation 13:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: te
  text: 'ఇక్కడ జ్ఞానం ఉంది: వివేకం గలవాడు మృగం యొక్క సంఖ్యను లెక్కించాలి, ఎందుకంటే అది మనిషి సంఖ్య[a], మరియు దాని సంఖ్య ఆరువందల అరవై ఆరు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక మనిషికి చెందిన సంఖ్య’; మరో విధంగా, ‘మానవ సంఖ్య.’
    reason: alternative_reading
  - marker: b
    text: కొన్ని ప్రతుల్లో 666కు బదులుగా 616 అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: ఇక్కడ జ్ఞానం ఉంది
  rationale: గ్రీకు వాక్యంలోని సూచనాత్మకమైన ‘ఇక్కడ’ అనే భావాన్ని, అలాగే ‘జ్ఞానం ఉంది’ అనే నేరమైన నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὁ ἔχων νοῦν
  choice: వివేకం గలవాడు
  rationale: νοῦς ఇక్కడ కేవలం మనస్సు అనే అవయవార్థం కాక, గ్రహించే వివేచనను సూచిస్తుంది. ఏకవచన exhortational భావాన్ని ఈ రూపం కాపాడుతుంది.
- source_word: ψηφισάτω
  choice: లెక్కించాలి
  rationale: సంఖ్యను గణించాలి లేదా లెక్క తేల్చాలి అనే ఆజ్ఞార్థక భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: మృగం యొక్క సంఖ్యను
  rationale: ప్రకటన గ్రంథపు అపోకలిప్టిక్ సందర్భంలో θηρίονకు స్థిరమైన ‘మృగం’ అనే పదాన్ని, సంబంధార్థక genitiveను స్పష్టంగా నిలుపుతుంది.
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: ఎందుకంటే అది మనిషి సంఖ్య
  rationale: ἀνθρώπου అనే ఏకవచన genitive ఒక నిర్దిష్ట మనిషిని, మనిషికి చెందినదాన్ని, లేదా మానవ సంబంధమైనదాన్ని సూచించగలదు. ‘మనిషి సంఖ్య’ ఈ ఉద్దేశపూర్వక అస్పష్టతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: καὶ ὁ ἀριθμὸς αὐτοῦ
  choice: దాని సంఖ్య
  rationale: αὐτοῦ ముందున్న మృగాన్ని సూచిస్తుంది; తెలుగులో ‘దాని’ సహజమైన, వ్యాకరణపరంగా స్పష్టమైన సూచన.
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: ఆరువందల అరవై ఆరు
  rationale: గ్రీకు సంఖ్యను నేరుగా, సహజమైన తెలుగు సంఖ్యా రూపంలో అందిస్తుంది.
theological_decisions:
- issue: ἀριθμὸς ἀνθρώπου అనే పదబంధంలోని ἀνθρώπου భావం
  choice: ప్రధాన పాఠంలో ‘మనిషి సంఖ్య’
  alternative: ‘ఒక మనిషికి చెందిన సంఖ్య’ లేదా ‘మానవ సంఖ్య’
  rationale: గ్రీకు పదబంధం ఒక నిర్దిష్ట వ్యక్తిని సూచిస్తుందా, మనిషికి చెందిన సంఖ్యనా, లేక మానవ స్వభావం గల సంఖ్యనా అనేది తేల్చదు. ప్రధాన పాఠం ఈ వ్యాఖ్యాన ఉద్రిక్తతను నిలుపుతుంది; పాదసూచిక మరింత నిర్దిష్టమైన సాధ్యార్థాలను తెలియజేస్తుంది.
- issue: మృగం సంఖ్యకు సంబంధించిన పాఠాంతరం
  choice: ప్రధాన పాఠంలో 666
  alternative: కొన్ని ప్రతుల్లో 616
  rationale: SBLGNT ప్రధాన పాఠం 666ను ఇస్తుంది; ముఖ్యమైన ప్రతుల పాఠాంతరాన్ని పాదసూచికలో నమోదు చేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గంభీరమైన ప్రకటన గ్రంథ శైలి. ‘మనిషి సంఖ్య’ ద్వారా మూలంలోని నిజమైన భావసందిగ్ధతను ఉద్దేశపూర్వకంగా నిలిపాం.
