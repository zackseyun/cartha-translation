id: REV.13.15
reference: Revelation 13:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: te
  text: మృగపు ప్రతిమకు ఊపిరిని ఇవ్వడానికి అతనికి అనుమతి ఇవ్వబడింది[a]. దాంతో మృగపు ప్రతిమ మాట్లాడి, తనను ఆరాధించని వారందరూ చంపబడేలా చేసింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రతిమకు ఆత్మను ఇవ్వడానికి’; లేదా ‘ప్రతిమకు జీవం ఇవ్వడానికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మృగపు ప్రతిమను ఆరాధించని వారందరినీ చంపించేలా చేసింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: అతనికి అనుమతి ఇవ్వబడింది
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్ని అలాగే ఉంచుతూ, సందర్భంలోని అనుమతి లేదా సామర్థ్యం ప్రసాదించబడిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δοῦναι πνεῦμα
  choice: ఊపిరిని ఇవ్వడానికి
  rationale: πνεῦμα అనే పదానికి ఊపిరి, ఆత్మ, జీవం అనే అర్థాలు సాధ్యమే. ప్రతిమ మాట్లాడేలా చేయబడుతున్న ఈ సందర్భంలో ‘ఊపిరి’ స్పష్టమైన దృశ్యార్థాన్ని నిలుపుతుంది; నిజమైన జీవమో వ్యక్తిగత ఆత్మో ఇవ్వబడిందని అవసరానికి మించి చెప్పదు.
- source_word: εἰκών
  choice: ప్రతిమ
  rationale: విగ్రహం లేదా రూపం అనే అర్థ పరిధిని కలిగి, నిర్దిష్ట భౌతిక ఆకారానికి అతిగా పరిమితం చేయని సహజ తెలుగు పదం.
- source_word: θηρίον
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ పాత్రకు స్థిరమైన, అర్థస్పష్టమైన పదం; ‘రాక్షస జంతువు’ వంటి పదాలు అధిక వ్యాఖ్యానాన్ని చేర్చుతాయి.
- source_word: ἵνα καὶ λαλήσῃ
  choice: దాంతో ... మాట్లాడడమే కాకుండా
  rationale: ἵνα యొక్క ఉద్దేశం/ఫలిత భావాన్ని ‘దాంతో’ తెలియజేస్తుంది; καί ప్రతిమ మాట్లాడగలగడంలోని ఆశ్చర్యకరమైన అంశాన్ని నొక్కిచెప్పేలా అనువదించబడింది.
- source_word: ποιήσῃ ἵνα
  choice: చంపబడేలా చేసింది
  rationale: పదశః అసహజంగా ఉండే గ్రీకు నిర్మాణంలోని కారణక భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: ఆరాధించని వారందరూ
  rationale: అనిర్దిష్ట సంబంధవాచక నిర్మాణంలోని సమగ్ర భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: προσκυνήσωσιν
  choice: ఆరాధించని
  rationale: ప్రకటన గ్రంథంలో మృగం మరియు దాని ప్రతిమ పట్ల చూపే మతపరమైన ఆరాధనను సందర్భానుసారంగా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποκτανθῶσιν
  choice: చంపబడేలా
  rationale: గ్రీకు కర్మణి రూపాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సూటిగా అర్థమయ్యే పదప్రయోగం.
theological_decisions:
- issue: ప్రతిమను చైతన్యపరచడంలో πνεῦμα యొక్క అర్థం
  choice: ఊపిరి
  alternative: ఆత్మ; జీవం
  rationale: ప్రతిమ మాట్లాడేలా చేయబడటంతో ‘ఊపిరి’ సృష్టిని అనుకరించే భయానక చిత్రాన్ని నిలుపుతుంది. అదే సమయంలో దానికి నిజమైన జీవమో వ్యక్తిగత ఆత్మో ఇచ్చారని పాఠ్యం కంటే ఎక్కువగా నిర్ధారించదు.
- issue: ἐδόθη అనే కర్మణి క్రియలో ఇచ్చినవారి గుర్తింపు
  choice: ఇచ్చినవారిని పేర్కొనకుండా ఉంచడం
  alternative: దేవుడు ఇచ్చాడని లేదా సాతాను ఇచ్చాడని స్పష్టంగా చేర్చడం
  rationale: గ్రీకు పాఠ్యం ఇచ్చినవారిని పేర్కొనదు. అందువల్ల ఆ అపోకలిప్టిక్ కర్మణి ప్రయోగంలోని ఉద్దేశపూర్వక అస్పష్టతను అనువాదం నిలుపుతుంది.
- issue: ποιήσῃ ἵνα నిర్మాణంలో ప్రతిమ యొక్క కార్యసాధక పాత్ర
  choice: ప్రతిమే చంపబడేలా చేసినట్లు వ్యాకరణ సంబంధాన్ని నిలుపడం
  alternative: పేర్కొనని ఇతర అధికారులు చంపారని స్పష్టీకరించడం
  rationale: ἡ εἰκών అనే కర్త λαλήσῃ మరియు ποιήσῃ రెండింటికీ వ్యాకరణపరంగా వర్తిస్తుంది. అమలు ఎవరు చేశారో పాఠ్యంలో చెప్పనందున దాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మృగం’, ‘ప్రతిమ’, ‘ఆరాధించు’ వంటి ప్రకటన గ్రంథానికి తగిన స్థిర పదజాలం వాడబడింది. మూలంలోని కర్తల అస్పష్టతను అనవసరంగా పరిష్కరించలేదు; ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
