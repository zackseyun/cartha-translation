  to: మృగపు ప్రతిమకు ఊపిరిని ఇవ్వడానికి అతనికి అనుమతి ఇవ్వబడింది[a]. దాంతో మృగపు ప్రతిమ మాట్లాడి, తనను ఆరాధించని వారందరూ చంపబడేలా చేసింది[b].
  rationale: రెండవ వాక్యంలోని ‘మాట్లాడడమే కాకుండా’ స్థానంలో ‘మాట్లాడి’ని ఉంచి, ప్రతిమే మాట్లాడి చంపబడేలా చేస్తుందనే గ్రీకు వాక్యనిర్మాణాన్ని మరింత నేరుగా నిలుపాం. పునరావృతమైన నామవాచకానికి బదులుగా ‘తనను’ వాడటం సహజమైన తెలుగు ప్రవాహాన్ని ఇస్తుంది; దాని సూచన సమీపంలోని ‘మృగపు ప్రతిమ’కే పరిమితమై స్పష్టంగా ఉంది. అర్థం, కర్తృత్వం, కర్మణి ‘చంపబడేలా’ భావం, మరియు పాదసూచికల అంకర్లు నిలుపబడ్డాయి.
