    “సింహాసనం మీద కూర్చున్నవానికీ గొర్రెపిల్లకూ

    స్తుతి, ఘనత, మహిమ, పరాక్రమం

    యుగయుగాలు[b] కలుగుగాక!”'
  to: 'పరలోకంలో, భూమి మీద, భూమి కింద, సముద్రం మీద ఉన్న సృష్టించబడిన ప్రతి ప్రాణినీ[a], వాటిలో ఉన్న సమస్తాన్నీ ఇలా చెప్పగా నేను విన్నాను:


    “సింహాసనం మీద కూర్చున్నవానికీ గొర్రెపిల్లకూ

    ఆశీర్వాదం, ఘనత, మహిమ, పరాక్రమం

    యుగయుగాలు[b] కలుగుగాక!”'
  rationale: సవరణ ‘ప్రతి ప్రాణి’తో పాటు ‘వాటిలో ఉన్న సమస్తం’ను వినబడిన పలుకులో సహకర్తలుగా స్పష్టంగా కలిపింది; తద్వారా καὶ τὰ ἐν αὐτοῖς πάντα యొక్క సమగ్రతను నిలిపింది. దోహదంలోని εὐλογίαను ‘ఆశీర్వాదం’గా మార్చి, ఘనత, మహిమ, పరాక్రమం నుండి పదార్థపరంగా వేరుగా ఉంచింది. మూలంలోని ఉమ్మడి దోహదం, కాలప్రయోగం, పాదసూచిక గుర్తులు యథాతథంగా సంరక్షించబడ్డాయి.
