id: REV.5.13
reference: Revelation 5:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: te
  text: 'పరలోకంలో, భూమి మీద, భూమి కింద, సముద్రం మీద ఉన్న సృష్టించబడిన ప్రతి ప్రాణినీ[a], వాటిలో ఉన్న సమస్తాన్నీ ఇలా చెప్పగా నేను విన్నాను:


    “సింహాసనం మీద కూర్చున్నవానికీ గొర్రెపిల్లకూ

    ఆశీర్వాదం, ఘనత, మహిమ, పరాక్రమం

    యుగయుగాలు[b] కలుగుగాక!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సృష్టించబడిన ప్రతిదీ.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “యుగాల యుగాల వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: సృష్టించబడిన ప్రతి ప్రాణి
  rationale: κτίσμα సృష్టించబడిన ప్రాణిని లేదా వస్తువును సూచించగలదు. ఈ దృశ్యంలో అవి పలుకుతున్నందున ‘ప్రతి ప్రాణి’ సహజంగా ఉంటుంది; ‘సృష్టించబడిన’ అనే మాట మూలపదంలోని సృష్టిత్వాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὃ ἐν τῷ οὐρανῷ ... καὶ τὰ ἐν αὐτοῖς πάντα
  choice: పరలోకంలో, భూమి మీద, భూమి కింద, సముద్రం మీద ఉన్న ... వాటిలో ఉన్న సమస్తం
  rationale: ప్రదేశాల వరుస సృష్టి సమగ్రతను వ్యక్తం చేస్తుంది. మూలంలోని ἐν, ἐπί, ὑποκάτω అనే భేదాలను సాధ్యమైనంతవరకు ‘లో’, ‘మీద’, ‘కింద’గా నిలిపి, αὐτοῖς యొక్క సమష్టి సూచనను ‘వాటిలో’గా అనువదించాం.
- source_word: ἤκουσα λέγοντας
  choice: ఇలా పలకడం నేను విన్నాను
  rationale: సమష్టిగా పేర్కొన్న ప్రాణులు స్వరంతో పలుకుతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: సింహాసనం మీద కూర్చున్నవానికి
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతాన్ని సహజంగా, గౌరవభావంతో అనువదిస్తుంది.
- source_word: τῷ ἀρνίῳ
  choice: గొర్రెపిల్లకు
  rationale: ప్రకటన గ్రంథంలో ἀρνίονకు ఉన్న స్థిరమైన బిరుదు మరియు బలి సంబంధిత ప్రతీకను నిలుపుతుంది.
- source_word: ἡ εὐλογία
  choice: స్తుతి
  rationale: దైవాన్ని ఉద్దేశించిన స్తుతివాక్యంలో εὐλογίαకు ‘ఆశీర్వాదం’ కంటే ‘స్తుతి’ తెలుగు భాషలో సహజంగా ఉండి, అర్పించే ప్రశంస భావాన్ని అందిస్తుంది.
- source_word: ἡ τιμή
  choice: ఘనత
  rationale: దైవానికి ఆపాదించే గౌరవాన్ని తెలిపే సహజమైన ఆరాధనా పదం.
- source_word: ἡ δόξα
  choice: మహిమ
  rationale: ఆరాధనా సందర్భాల్లో δόξαకు స్థిరమైన, అర్థపూర్ణమైన తెలుగు సమానం.
- source_word: τὸ κράτος
  choice: పరాక్రమం
  rationale: κράτοςలోని ప్రత్యక్షంగా వ్యక్తమయ్యే బలం, ఏలుబడి సామర్థ్యం అనే భావాన్ని తెలియజేస్తుంది; సమీప సందర్భంలోని δύναμιςతో పదభేదాన్ని కూడా నిలుపుతుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాలు
  rationale: అంతం లేని కాలవ్యాప్తిని సహజమైన తెలుగు ఆరాధనా ప్రయోగంలో వ్యక్తం చేస్తూ, మూలంలోని ‘యుగాల యుగాలు’ రూపకాన్ని కూడా ప్రతిధ్వనిస్తుంది.
theological_decisions:
- issue: దేవునికీ గొర్రెపిల్లకూ కలిపి అర్పించిన స్తుతి
  choice: ‘సింహాసనం మీద కూర్చున్నవానికీ గొర్రెపిల్లకూ ... కలుగుగాక’ అని ఒకే స్తుతివాక్యాన్ని ఇద్దరికీ ఉమ్మడిగా ఉంచడం
  alternative: ప్రతి గ్రహీతకు క్రియను విడివిడిగా పునరుక్తి చేయడం
  rationale: గ్రీకు వాక్యం వివరణాత్మక విస్తరణ లేకుండా ఒకే స్తుతిని ఇద్దరికీ సమాంతరంగా ఆపాదిస్తుంది. అనువాదం ఆ నిర్మాణాన్ని, దానిలోని క్రీస్తు సంబంధిత ఉద్వేగాన్ని వ్యాఖ్యానంతో పరిష్కరించకుండా నిలుపుతుంది.
- issue: κτίσμα సూచించే వర్గం
  choice: పలుకుతున్న దృశ్యానికి అనుగుణంగా ‘సృష్టించబడిన ప్రతి ప్రాణి’
  alternative: ‘సృష్టించబడిన ప్రతిదీ’ లేదా ‘సమస్త సృష్టి’
  rationale: κτίσμα ప్రాణి లేదా సృష్టవస్తువు అనే విస్తృతార్థం కలిగి ఉన్నప్పటికీ, λέγοντας అనే పలుకుటను సూచించే పదం వ్యక్తిగత ప్రాణుల చిత్రాన్ని బలపరుస్తుంది. ప్రత్యామ్నాయ విస్తృతార్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆరాధనా శైలిని వాడాం. కవితాత్మక స్తుతి భాగాన్ని పంక్తులుగా అమర్చి సమాంతర నిర్మాణాన్ని స్పష్టంచేశాం. మూలంలోని ప్రదేశ సూచక భేదాలను, ఉమ్మడి స్తుతిని, నిత్యకాల ప్రయోగాన్ని సాధ్యమైనంతవరకు నిలిపాం. అందించిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలతో సరిపోలకపోవడంతో, తెలుగు ముసాయిదాలో [a]ను κτίσμα వద్ద, [b]ను కాలప్రయోగం వద్ద సరైన స్థానాల్లో ఉంచాం.
