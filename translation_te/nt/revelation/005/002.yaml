  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄγγελον ἰσχυρὸν κηρύσσοντα ἐν φωνῇ μεγάλῃ· Τίς ⸀ἄξιος ἀνοῖξαι τὸ βιβλίον καὶ λῦσαι τὰς σφραγῖδας αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: te
  text: 'మరియు, ఒక శక్తిమంతుడైన దేవదూత బిగ్గరగా ప్రకటిస్తూ ఉండడం నేను చూశాను: “ఈ చుట్టపత్రాన్ని[a] తెరవడానికి, దాని ముద్రలను విప్పడానికి అర్హుడు ఎవరు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చుట్టపత్రం”కు బదులుగా “గ్రంథం” అని కూడా అనువదించవచ్చు. గ్రీకు పదం βιβλίον సాధారణంగా లిఖిత పత్రాన్ని సూచించగలదు; ఇక్కడ అనేక ముద్రలతో మూయబడిన వస్తువు కాబట్టి చుట్ట రూపంలోని పత్రం సందర్భానికి బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: బలవంతుడైన ఒక దేవదూత
  rationale: ἰσχυρός బలం లేదా శక్తిని సూచిస్తుంది. ‘బలవంతుడైన’ అనేది దేవదూత యొక్క మహాశక్తిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κηρύσσοντα
  choice: ప్రకటించడం
  rationale: κηρύσσω బహిరంగంగా, అధికారపూర్వకంగా చాటడాన్ని సూచిస్తుంది; ఈ గంభీర దర్శన సందర్భంలో ‘ప్రకటించడం’ సరిపోతుంది.
- source_word: ἐν φωνῇ μεγάλῃ
  choice: పెద్ద స్వరంతో
  rationale: ఇది బిగ్గరగా, అందరికీ వినిపించేలా మాట్లాడటాన్ని సూచించే నుడికారం. ‘పెద్ద స్వరంతో’ మూలంలోని μέγας బలాన్ని నిలుపుతూ సహజంగా ఉంది.
- source_word: Τίς ἄξιος
  choice: అర్హుడు ఎవరు
  rationale: ἄξιος ఈ గంభీర కార్యాన్ని చేయడానికి తగిన యోగ్యత లేదా విలువ కలిగినవాడిని సూచిస్తుంది. ‘అర్హుడు’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: ఈ గ్రంథపు చుట్టను తెరవడానికి
  rationale: βιβλίον సాధారణంగా లిఖిత పత్రం లేదా గ్రంథాన్ని సూచించగలదు; అనేక ముద్రలు గల ఈ దృశ్యంలో చుట్ట రూపంలోని గ్రంథం ఉద్దేశించబడింది. ‘గ్రంథపు చుట్ట’ ప్రాచీన వస్తురూపాన్నీ, అది లిఖిత గ్రంథమనే భావాన్నీ తెలియజేస్తుంది.
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: దాని ముద్రలను విప్పడానికి
  rationale: λύω అంటే విప్పడం, వదలించడం లేదా తొలగించడం. ముద్రల సందర్భంలో వాటిని తొలగించి చుట్టను తెరవడానికి సిద్ధం చేయడమే భావం; ‘విప్పడానికి’ మూలంలోని రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సింహాసన మందిర దర్శనంలో βιβλίον అనువాదం
  choice: గ్రంథపు చుట్ట
  alternative: గ్రంథం / పుస్తకం
  rationale: మొదటి శతాబ్దపు సందర్భంలో అనేక ముద్రలతో మూయబడిన లిఖిత వస్తువు చుట్టగా ఊహించడం సహజం. అయితే βιβλίον అనే పదానికి ఉన్న విస్తృత ‘గ్రంథం/లిఖిత పత్రం’ భావాన్ని పూర్తిగా కోల్పోకుండా ‘గ్రంథపు చుట్ట’ అని అనువదించబడింది.
- issue: λύω మరియు ముద్రల చర్య
  choice: ముద్రలను విప్పడం
  alternative: ముద్రలను పగులగొట్టడం / తొలగించడం
  rationale: మూల క్రియకు ‘విప్పు, వదులు’ అనే విస్తృత అర్థం ఉంది; ముద్రలను భౌతికంగా పగులగొట్టడం తప్పనిసరి అని వచనం స్పష్టంగా చెప్పదు. అందువల్ల చర్యను అతిగా నిర్దిష్టం చేయకుండా ‘విప్పడం’ ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దర్శన వర్ణన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని దర్శనం, బహిరంగ ప్రకటన, రెండు సమాంతర infinitive కార్యాలు నిలుపబడ్డాయి. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
