revisions:
- from: 'వారు ఒక నూతన గీతం పాడుతూ ఇలా అంటున్నారు:

    “ఆ గ్రంథపు చుట్టను తీసుకోవడానికి,

    దాని ముద్రలను తెరవడానికి నీవు అర్హుడవు;

    ఎందుకంటే నీవు వధించబడ్డావు,

    నీ రక్తం ద్వారా[b]

    ప్రతి వంశం, భాష, ప్రజ, జాతి నుండి[d]

    మనుషులను[c] దేవుని కోసం[a] కొన్నావు.”'
  to: 'వారు ఒక కొత్త గీతం పాడుతూ ఇలా అంటున్నారు:


    “ఆ చుట్టగ్రంథాన్ని తీసుకోవడానికి,

    దాని ముద్రలను తెరవడానికి నీవు అర్హుడవు;

    ఎందుకంటే నీవు వధించబడ్డావు,

    నీ రక్తం ద్వారా[b]

    ప్రతి వంశం నుండీ, భాష నుండీ, ప్రజాసమూహం నుండీ, జాతి నుండీ

    మనుషులను[c] దేవుని కోసం[a] కొన్నావు.”'
  rationale: The revision is limited to idiomatic and referential clarity. ‘చుట్టగ్రంథం’ accurately names the ancient scroll, and the fourfold list has been made grammatical and explicitly comprehensive in Telugu. All source ambiguities, including the implicit object of ‘purchased’ and the possible rendering of τῷ θεῷ, remain visible through the text and footnotes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:57:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the SBLGNT text: the present-tense singing, new song, worthiness, taking the scroll, opening its seals, being slain, purchase for/to God by means of blood, and the fourfold worldwide list are retained. It appropriately supplies an implicit human object for ἠγόρασας and transparently marks that supply in a footnote. The dative τῷ θεῷ and instrumental ἐν τῷ αἵματί σου are preserved without doctrinal expansion.'
  naturalness: A few expressions are less natural or less precise in modern standard Telugu. ‘ఆ గ్రంథపు చుట్ట’ is structurally awkward for a sealed ancient scroll, and bare ‘ప్రజ’ in the coordinated list is not idiomatic. A small recasting gives a fluent Telugu list while preserving the fourfold structure and the scope of ‘every.’
  terminology: ‘చుట్టగ్రంథం’ clearly identifies βιβλίον as a scroll rather than a modern codex. ‘వధించబడ్డావు,’ ‘నీ రక్తం ద్వారా,’ and ‘కొన్నావు’ preserve the sacrificial, instrumental, and commercial wording respectively without importing a doctrinal gloss. ‘ప్రజాసమూహం’ distinguishes λαός from ἔθνος (‘జాతి’) more clearly than bare ‘ప్రజ.’
  issues:
  - severity: medium
    issue: ‘ఆ గ్రంథపు చుట్టను’ is awkward and potentially misleading.
    rationale: The phrase can sound like a roll belonging to a book rather than the written scroll denoted by τὸ βιβλίον. ‘ఆ చుట్టగ్రంథాన్ని’ naturally denotes the ancient sealed document.
  - severity: medium
    issue: The phrase ‘ప్రతి వంశం, భాష, ప్రజ, జాతి నుండి’ is not fully idiomatic Telugu and does not clearly distribute ‘ప్రతి’ across all four items.
    rationale: Bare ‘ప్రజ’ is awkward in this list, and repeating the postposition makes the source’s fourfold, comprehensive formula clear. ‘ప్రజాసమూహం’ suitably renders λαός while retaining ‘జాతి’ for ἔθνος.
  revised_text: 'వారు ఒక కొత్త గీతం పాడుతూ ఇలా అంటున్నారు:


    “ఆ చుట్టగ్రంథాన్ని తీసుకోవడానికి,

    దాని ముద్రలను తెరవడానికి నీవు అర్హుడవు;

    ఎందుకంటే నీవు వధించబడ్డావు,

    నీ రక్తం ద్వారా[b]

    ప్రతి వంశం నుండీ, భాష నుండీ, ప్రజాసమూహం నుండీ, జాతి నుండీ

    మనుషులను[c] దేవుని కోసం[a] కొన్నావు.”'
  revised_footnotes:
  - marker: a
    text: లేదా ‘దేవునికి.’ గ్రీకు దత్తివిభక్తి τῷ θεῷను ఈ రెండు విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ రక్తంతో.’
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు పాఠంలో ‘మనుషులను’ అనే కర్మ ప్రత్యక్షంగా లేదు; వాక్యార్థం స్పష్టంగా ఉండేందుకు సందర్భం ఆధారంగా ఇక్కడ చేర్చబడింది.
