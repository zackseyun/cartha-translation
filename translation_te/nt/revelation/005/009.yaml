id: REV.5.9
reference: Revelation 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: te
  text: 'వారు ఒక కొత్త గీతం పాడుతూ ఇలా అంటున్నారు:


    “ఆ చుట్టగ్రంథాన్ని తీసుకోవడానికి,

    దాని ముద్రలను తెరవడానికి నీవు అర్హుడవు;

    ఎందుకంటే నీవు వధించబడ్డావు,

    నీ రక్తం ద్వారా[b]

    ప్రతి వంశం నుండీ, భాష నుండీ, ప్రజాసమూహం నుండీ, జాతి నుండీ

    మనుషులను[c] దేవుని కోసం[a] కొన్నావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవునికి.’ గ్రీకు దత్తివిభక్తి τῷ θεῷను ఈ రెండు విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ రక్తంతో.’
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు పాఠంలో ‘మనుషులను’ అనే కర్మ ప్రత్యక్షంగా లేదు; వాక్యార్థం స్పష్టంగా ఉండేందుకు సందర్భం ఆధారంగా ఇక్కడ చేర్చబడింది.
    reason: textual_clarity
lexical_decisions:
- source_word: ᾄδουσιν
  choice: పాడుతూ ఇలా అంటున్నారు
  rationale: గ్రీకు వర్తమాన కాలంలోని సజీవ దృశ్యాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది; ‘స్తుతిస్తున్నారు’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: ᾠδὴν καινὴν
  choice: ఒక నూతన గీతం
  rationale: ప్రకటన గ్రంథంలోని ‘కొత్త గీతం’ భావచిత్రాన్ని గౌరవప్రదమైన, సుపరిచితమైన తెలుగులో నిలుపుతుంది.
- source_word: Ἄξιος εἶ
  choice: నీవు అర్హుడవు
  rationale: ప్రత్యక్ష ప్రశంసను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ βιβλίον
  choice: ఆ గ్రంథపు చుట్ట
  rationale: ఇది ముద్రలు వేసిన ప్రాచీన చుట్టగ్రంథమని స్పష్టపరుస్తుంది; ఆధునిక పుస్తకమనే అపార్థాన్ని నివారిస్తుంది.
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: దాని ముద్రలను తెరవడానికి
  rationale: గ్రీకులోని ‘ముద్రలను తెరవడం’ అనే సంక్షిప్త భావప్రయోగాన్ని వ్యాఖ్యానాత్మకంగా ‘విరగగొట్టడం’గా మార్చకుండా నిలుపుతుంది.
- source_word: ἐσφάγης
  choice: నీవు వధించబడ్డావు
  rationale: σφάζωలోని హింసాత్మకమైన, బలిసంబంధమైన ఛాయను సాధారణ ‘చంపబడ్డావు’ కంటే బాగా నిలుపుతుంది.
- source_word: ἠγόρασας
  choice: కొన్నావు
  rationale: క్రియ యొక్క ప్రాథమిక క్రయార్థాన్ని నేరుగా నిలుపుతుంది; ‘విమోచించావు’ అనే విస్తృత theological వ్యాఖ్యానాన్ని పదంలోకి ముందుగానే చేర్చదు.
- source_word: τῷ θεῷ
  choice: దేవుని కోసం
  rationale: దత్తివిభక్తి ఇక్కడ దేవుని కొరకు కొనబడినవారనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘దేవునికి’ అనే సాధ్యమైన రూపాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: ἐν τῷ αἵματί σου
  choice: నీ రక్తం ద్వారా
  rationale: ἐν యొక్క సాధనార్థాన్ని స్పష్టంగా తెలియజేస్తూ మూలంలోని రక్తసంబంధ బలి భాషను నిలుపుతుంది.
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: ప్రతి వంశం, భాష, ప్రజ, జాతి నుండి
  rationale: నాలుగు భాగాల మూల జాబితాను, ἐκ πάσης యొక్క విస్తృత పరిధిని సన్నిహితంగా అనుసరిస్తుంది.
- source_word: λαοῦ
  choice: ప్రజ
  rationale: ఏకవచన సమూహార్థక పదాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ‘కొన్నావు’ అనే క్రియకు గ్రీకు వాక్యంలో ప్రత్యక్ష కర్మ స్పష్టంగా లేకపోవడం
  choice: తెలుగు వాక్యస్పష్టత కోసం ‘మనుషులను’ చేర్చి, అది మూలంలో ప్రత్యక్షంగా లేదని పాదటిప్పణిలో తెలపడం
  alternative: కర్మను చెప్పకుండా ‘ప్రతి వంశం... నుండి దేవుని కోసం కొన్నావు’ అని ఉంచడం
  rationale: తెలుగులో కర్మ లేకపోతే వాక్యం అస్పష్టంగా ఉంటుంది. సందర్భం కొనబడినవారు మనుషులేనని సూచిస్తుంది; అయితే మూలంలోని వ్యాకరణ అంతరాన్ని పాదటిప్పణి పారదర్శకంగా కాపాడుతుంది.
- issue: ‘నీ రక్తం ద్వారా’లోని ప్రాయశ్చిత్త/బలి భాష
  choice: రక్తం అనే స్పష్టమైన మూలభాషను యథాతథంగా నిలుపడం
  alternative: ‘నీ మరణం ద్వారా’ అని సాధారణీకరించడం
  rationale: వచనం కొనుగోలుకు సాధనంగా గొఱ్ఱెపిల్ల రక్తాన్నే పేర్కొంటుంది; దానిని ఒక నిర్దిష్ట సిద్ధాంత సూత్రంగా విస్తరించకుండానే నిలుపబడింది.
- issue: τῷ θεῷ దత్తివిభక్తి యొక్క సంబంధం
  choice: ‘దేవుని కోసం’
  alternative: ‘దేవునికి’
  rationale: రెండు రూపాలూ సాధ్యమైన సంబంధాన్ని వ్యక్తం చేయగలవు. ప్రధాన పాఠంలో సహజమైన ప్రయోజనార్థక రూపాన్ని ఎంచుకొని, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గీతానికి తగిన గౌరవప్రదమైన లయతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘గ్రంథపు చుట్ట’ ప్రాచీన వస్తువును స్పష్టం చేస్తుంది. కవితా పంక్తుల విభజన గ్రీకు ప్రశంసాగీతంలోని భావక్రమాన్ని అనుసరిస్తుంది.
