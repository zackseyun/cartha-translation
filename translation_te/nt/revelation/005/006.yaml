revisions:
- from: అప్పుడు నేను సింహాసనం మధ్యలోనూ నాలుగు జీవుల మధ్యలోనూ, పెద్దల మధ్యలోనూ ఒక గొర్రెపిల్ల నిలబడి ఉండడం చూశాను. అది వధించబడినట్టుగా ఉంది.[a] దానికి ఏడు కొమ్ములు, ఏడు కళ్లు ఉన్నాయి. ఆ కళ్లు భూమి అంతటిలోకి పంపబడిన దేవుని ఏడు ఆత్మలు.[b]
  to: అప్పుడు నేను సింహాసనం మధ్యలోను, నాలుగు జీవుల మధ్యలోను, పెద్దల మధ్యలోను వధించబడినట్టుగా నిలబడి ఉన్న ఒక గొర్రెపిల్లను చూశాను.[a] దానికి ఏడు కొమ్ములు, ఏడు కళ్లు ఉన్నాయి; ఆ కళ్లు భూమి అంతటికీ పంపబడిన దేవుని ఏడు ఆత్మలు.[b]
  rationale: The revision retains the source text's repeated spatial language, the paradoxical image of a slain yet standing Lamb, and the direct identification of the seven eyes with the seven Spirits of God. It makes only safe syntactic and lexical improvements, avoids resolving the debated symbolism, and places each footnote anchor beside its relevant expression.
