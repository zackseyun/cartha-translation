id: REV.5.6
reference: Revelation 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: te
  text: అప్పుడు నేను సింహాసనం మధ్యలోను, నాలుగు జీవుల మధ్యలోను, పెద్దల మధ్యలోను వధించబడినట్టుగా నిలబడి ఉన్న ఒక గొర్రెపిల్లను చూశాను.[a] దానికి ఏడు కొమ్ములు, ఏడు కళ్లు ఉన్నాయి; ఆ కళ్లు భూమి అంతటికీ పంపబడిన దేవుని ఏడు ఆత్మలు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “వధించబడినదానిలా” లేదా “బలి చేయబడినట్టుగా.”
    reason: lexical_alternative
  - marker: b
    text: “దేవుని ఏడు ఆత్మలు” అనే పదబంధం మూలపాఠంలో ఉన్నట్టుగానే ఉంచబడింది; కొందరు దీన్ని ఏడంతల సంపూర్ణతలో ఉన్న పరిశుద్ధాత్మను సూచించే ప్రతీకగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ ... καὶ ... ἐν μέσῳ
  choice: మధ్యలోనూ ... మధ్యలోనూ ... మధ్యలోనూ
  rationale: గ్రీకులోని పునరుక్త స్థలవర్ణనను కుదించకుండా ఉంచి, దర్శనంలోని పొరలుగల దృశ్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ζῴων
  choice: జీవులు
  rationale: ఇక్కడ సాధారణ జంతువులు కాక సింహాసనం చుట్టూ ఉన్న సజీవ పరలోక జీవులు ఉద్దేశించబడ్డాయి; సందర్భంలో ‘నాలుగు జీవులు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: πρεσβυτέρων
  choice: పెద్దలు
  rationale: దర్శన సందర్భంలోని గుర్తింపుగల పరలోక సమూహాన్ని సూచించే బిరుదుగా ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: ἀρνίον
  choice: గొర్రెపిల్ల
  rationale: చిన్న గొర్రె అనే మూలచిత్రాన్నీ బలి సంబంధమైన ప్రతీకనూ అనవసర సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- source_word: ἑστηκὸς
  choice: నిలబడి ఉండడం
  rationale: పరిపూర్ణ కృదంతం గొర్రెపిల్ల నిలబడిన స్థితిలో ఉందని చూపుతుంది; తెలుగు వాక్యనిర్మాణంలో ఇది సహజంగా ఉంటుంది.
- source_word: ὡς ἐσφαγμένον
  choice: వధించబడినట్టుగా ఉంది
  rationale: ὡς లోని పోలిక/కనిపించే విధానాన్ని, అలాగే గతంలో జరిగిన వధ ఫలితం ఇంకా కనిపిస్తోందనే పరిపూర్ణ కృదంత భావాన్ని నిలుపుతుంది.
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: దానికి ఏడు కొమ్ములు, ఏడు కళ్లు ఉన్నాయి
  rationale: ప్రతీకాత్మక అవయవాలను అర్థవివరణగా మార్చకుండా యథార్థ చిత్రాలుగానే ఉంచుతూ తెలుగులో సహజంగా చెబుతుంది.
- source_word: οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: ఆ కళ్లు ... దేవుని ఏడు ఆత్మలు
  rationale: సమీప పూర్వపదమైన ‘ఏడు కళ్లు’తో సంబంధవాక్యాన్ని స్పష్టంగా కలిపి, గ్రీకు పాఠంలోని గుర్తింపును అనువాదంలో నిలుపుతుంది.
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: భూమి అంతటిలోకి పంపబడిన
  rationale: నిష్క్రియ బహువచన కృదంతాన్ని నిలుపుతూ, పంపబడిన దిశ మరియు పరిధి రెండింటినీ సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘అవి దేవుని ఏడు ఆత్మలు’ అనే సంబంధవాక్యానికి పూర్వపదం
  choice: ఈ వాక్యం గొర్రెపిల్ల ఏడు కళ్లను దేవుని ఏడు ఆత్మలతో గుర్తిస్తుంది.
  alternative: ఇది కొమ్ములు, కళ్లు రెండింటినీ కలిపి సూచిస్తుందని విస్తృతంగా తీసుకోవచ్చు.
  rationale: వ్యాకరణపరంగా మరియు జెకర్యాలోని కళ్ల ప్రతిధ్వని దృష్ట్యా సమీప పూర్వపదమైన ‘ఏడు కళ్లు’ అత్యంత సహజం; అయినా అదనపు సిద్ధాంత వివరణను పాఠ్యంలో చేర్చలేదు.
- issue: ‘దేవుని ఏడు ఆత్మలు’ అనే పదబంధం
  choice: బహువచన రూపాన్ని యథాతథంగా ‘దేవుని ఏడు ఆత్మలు’ అని ఉంచడం.
  alternative: ‘దేవుని ఏడంతల ఆత్మ’ లేదా ‘ఏడంతల సంపూర్ణతలో ఉన్న దేవుని ఆత్మ’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: గ్రీకు పాఠం స్వయంగా బహువచనంలో ‘ఏడు ఆత్మలు’ అంటుంది. ఇది పరిశుద్ధాత్మ యొక్క సంపూర్ణతకు ప్రతీక కావచ్చనే అవగాహనను తోసిపుచ్చకుండా, వివాదాస్పద ప్రతీకను అనువాదంలో ముందుగానే పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే దర్శనగ్రంథపు గంభీరత మరియు ప్రతీకాత్మక ఉద్వేగం నిలిచేలా రచించబడింది. ‘వధించబడినట్టుగా’ అనే రూపం సజీవంగా నిలబడిన గొర్రెపిల్ల మరియు దానిపై కనిపించే వధచిహ్నాల మధ్యనున్న ఉద్దేశపూర్వక విరోధాభాసాన్ని కాపాడుతుంది.
