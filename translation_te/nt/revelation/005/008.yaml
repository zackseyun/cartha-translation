  rationale: The revision improves idiomatic Telugu for “scroll,” explicitly preserves the Greek grammatical antecedent of the final relative clause, and aligns the second footnote with the limited lexical alternative in the English audit trail. It does not alter the direct symbolic identification or resolve beyond the source the scope of “each.”
