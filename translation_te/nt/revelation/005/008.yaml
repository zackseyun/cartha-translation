revisions:
- from: ఆయన ఆ గ్రంథపు చుట్టను తీసుకున్నప్పుడు, ఆ నాలుగు జీవులు, ఇరవై నలుగురు పెద్దలు గొర్రెపిల్ల ఎదుట సాగిలపడ్డారు. వారిలో ప్రతి ఒక్కరూ ఒక వీణను[a], ధూపద్రవ్యాలతో నిండిన బంగారు పాత్రలను పట్టుకొని ఉన్నారు. ఆ పాత్రలే పరిశుద్ధుల[b] ప్రార్థనలు.
