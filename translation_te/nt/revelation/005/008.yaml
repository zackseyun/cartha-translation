id: REV.5.8
reference: Revelation 5:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: te
  text: ఆయన ఆ లేఖనపు చుట్టను తీసుకున్నప్పుడు, ఆ నాలుగు జీవులు, ఇరవై నలుగురు పెద్దలు గొర్రెపిల్ల ఎదుట సాగిలపడ్డారు. వారిలో ప్రతి ఒక్కరూ ఒక వీణను[a], ధూపద్రవ్యాలతో నిండిన బంగారు పాత్రలను పట్టుకొని ఉన్నారు. ధూపద్రవ్యాలతో నిండిన ఆ బంగారు పాత్రలే పరిశుద్ధుల[b] ప్రార్థనలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లైర్ అనే తంతివాద్యం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పవిత్రుల ప్రార్థనలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλίον
  choice: గ్రంథపు చుట్ట
  rationale: ప్రకటన గ్రంథంలోని దృశ్యం పురాతన కాలపు చుట్టబడిన లిఖిత పత్రాన్ని సూచిస్తుంది; ఆధునిక పుస్తక రూపాన్ని సూచించకుండా అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ζῷα
  choice: జీవులు
  rationale: సింహాసనం చుట్టూ ఉన్న సజీవ పరలోక ప్రాణులను సూచిస్తుంది; అవమానార్థకమైన ‘మృగాలు’ అనే భావాన్ని నివారిస్తుంది.
- source_word: πρεσβύτεροι
  choice: పెద్దలు
  rationale: ఇరవై నలుగురు గౌరవనీయ పరలోక ప్రతినిధులను సహజమైన తెలుగులో సూచిస్తుంది; తరువాతి సంఘపదవిని అనవసరంగా దిగుమతి చేయదు.
- source_word: ἐνώπιον
  choice: ఎదుట
  rationale: స్థానిక సమీపతనూ ఆరాధన సందర్భంలోని గౌరవాన్నీ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἀρνίου
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలోని క్రీస్తును సూచించే బిరుదు యొక్క మూల రూపకాన్నీ బలి సంబంధిత ప్రతిధ్వనినీ నిలుపుతుంది.
- source_word: ἔχοντες ἕκαστος
  choice: వారిలో ప్రతి ఒక్కరూ ... పట్టుకొని ఉన్నారు
  rationale: ἕκαστος లోని పంపిణీ భావాన్ని నిలుపుతూ, సంయుక్త కర్తతో తెలుగులో సహజంగా అనుసంధానిస్తుంది.
- source_word: κιθάραν
  choice: వీణ
  rationale: తీగలతో వాయించే వాద్యాన్ని సాధారణ పాఠకులకు తెలిసిన, ఆరాధన సందర్భానికి తగిన పదంతో సూచిస్తుంది; మరింత సాంకేతిక ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: φιάλας χρυσᾶς
  choice: బంగారు పాత్రలు
  rationale: φιάλη సూచించే వెడల్పైన లేదా లోతు తక్కువ పాత్రలను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: γεμούσας θυμιαμάτων
  choice: ధూపద్రవ్యాలతో నిండిన
  rationale: బహువచన రూపంలోని ధూప పదార్థాల భావాన్ని తెలుగులో సహజంగా, దృశ్యాన్ని విస్తరించకుండా అందిస్తుంది.
- source_word: αἵ εἰσιν αἱ προσευχαὶ τῶν ἁγίων
  choice: ఆ పాత్రలే పరిశుద్ధుల ప్రార్థనలు
  rationale: స్త్రీలింగ బహువచన సంబంధసర్వనామం αἵ సమీపంలోని φιάλας (‘పాత్రలు’)తో వ్యాకరణపరంగా ఏకీభవిస్తుంది. అందువల్ల పాత్రలను ప్రార్థనలతో నేరుగా సమానం చేసే మూల వాక్య నిర్మాణాన్ని నిలిపింది.
theological_decisions:
- issue: పాత్రలు/ధూపం మరియు ప్రార్థనల మధ్య సంకేతాత్మక గుర్తింపు
  choice: ఆ పాత్రలే పరిశుద్ధుల ప్రార్థనలు
  alternative: ఆ ధూపద్రవ్యాలు పరిశుద్ధుల ప్రార్థనలకు సంకేతం
  rationale: గ్రీకు αἵ స్త్రీలింగ బహువచనం ‘పాత్రలు’ అనే పదంతో ఏకీభవిస్తుంది; εἰσιν నేరుగా సమానత్వాన్ని చెబుతుంది. కాబట్టి దానిని ‘సూచిస్తాయి’ అని బలహీనపరచకుండా, మూలంలోని అపోకలిప్టిక్ ఉద్వేగాన్ని నిలిపింది.
- issue: τῶν ἁγίων యొక్క భావం
  choice: పరిశుద్ధుల
  alternative: పవిత్రుల / దేవుని పవిత్ర ప్రజల
  rationale: దేవునికి ప్రత్యేకించబడిన ప్రజలను సూచించే సంప్రదాయబద్ధమైన, సంక్షిప్తమైన పదం. దీనిని తరువాతి కాలంలో అధికారికంగా ప్రకటించబడిన కొద్దిమంది ‘సెయింట్లు’ అనే భావానికి పరిమితం చేయదు.
- issue: ప్రతి ఒక్కరూ వాద్యమూ పాత్రలూ పట్టుకోవడం
  choice: సంయుక్త కర్తను సూచించే ‘వారిలో ప్రతి ఒక్కరూ’
  alternative: పెద్దలలో ప్రతి ఒక్కరూ
  rationale: ἔχοντες అనే పుంలింగ బహువచన కృదంతం నాలుగు జీవులు మరియు పెద్దలు అనే సంయుక్త కర్తను అనుసరించగలదు; వాక్యాన్ని కేవలం పెద్దలకు పరిమితం చేయడం స్పష్టంగా నిర్బంధించబడలేదు. అందువల్ల మూలంలోని విస్తృత వ్యాకరణ అవకాశాన్ని అనుసరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ఆరాధన దృశ్యానికి తగిన గౌరవభరిత శైలి వాడబడింది. ‘సాగిలపడ్డారు’ అనేది మూలంలో లేని నిర్దిష్ట శరీరభంగిమను జోడించకుండా నమస్కారపూర్వకంగా పడటాన్ని తెలియజేస్తుంది. పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
