id: REV.5.3
reference: Revelation 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: te
  text: పరలోకంలో గానీ, భూమిమీద గానీ, భూమికింద గానీ ఎవరూ ఆ చుట్టిన గ్రంథాన్ని విప్పలేకపోయారు; దానిని చూడనూ లేకపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ గ్రంథాన్ని.’ గ్రీకు పదం సాధారణంగా ఒక లిఖిత పత్రాన్ని సూచించగలదు; అయితే ఈ సందర్భంలోని పురాతన దృశ్యానికి ‘చుట్టిన గ్రంథం’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: ఎవరూ
  rationale: నిషేధ క్రియతో కలిసి ‘ఎవరూ ... లేకపోయారు’ అనే సహజమైన తెలుగు నిర్మాణం గ్రీకు అనిశ్చిత నిషేధ సర్వనామ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐδύνατο
  choice: తెరవలేకపోయారు; ... చూడనూ లేకపోయారు
  rationale: అసమర్థతను గత కథన సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది. గ్రీకులో ఒకే సామర్థ్య క్రియ రెండు క్రియార్థక రూపాలను నియంత్రించినా, తెలుగులో రెండవ భాగంలో క్రియను పునరుద్ధరించడం స్పష్టతనిస్తుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: అపోకలిప్టిక్ సందర్భంలోని ఆకాశీయ లోకాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: ἐπί + షష్ఠీ విభక్తి తెలిపే స్థానార్థాన్ని, అలాగే త్రిస్థాయి విశ్వ చిత్రణను నిలుపుతుంది.
- source_word: ὑποκάτω τῆς γῆς
  choice: భూమికింద
  rationale: మూలంలోని సరళమైన స్థల సూచనను, పరలోకం–భూమి–భూమికింద అనే త్రిభాగ విస్తృతిని కాపాడుతుంది.
- source_word: ἀνοῖξαι
  choice: తెరవడం
  rationale: మూలంలోని సాధారణ క్రియార్థాన్ని అదనపు వివరణ లేకుండా నేరుగా అందిస్తుంది.
- source_word: τὸ βιβλίον
  choice: ఆ గ్రంథపు చుట్ట
  rationale: βιβλίον సాధారణంగా లిఖిత పత్రం లేదా గ్రంథాన్ని సూచించగలదు; ఈ దర్శన సందర్భంలో చుట్టగా ఉన్న పత్రం అనే పురాతన దృశ్యాన్ని ‘గ్రంథపు చుట్ట’ స్పష్టంగా అందిస్తుంది.
- source_word: οὔτε βλέπειν αὐτό
  choice: దానిని చూడనూ లేకపోయారు
  rationale: οὔτε రెండవ క్రియార్థక రూపాన్ని నిషేధ సమన్వయంతో కలుపుతుంది. ‘చూడనూ’ అనే రూపం అదనంగా ‘కూడా’ లేదా ‘సైతం’ చేర్చకుండానే ఆ సమన్వయ బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: గ్రంథపు చుట్టను తెరవలేని వారి విశ్వవ్యాప్త పరిధి
  choice: ‘పరలోకంలో గానీ, భూమిమీద గానీ, భూమికింద గానీ’ అనే మూడు స్థలాల భాషను నిలుపడం
  alternative: ‘సృష్టిలో ఎక్కడా’ వంటి సాధారణీకృత భావానువాదం
  rationale: మూడు స్థాయుల విశ్వ చిత్రణ సర్వసృష్టిలోని అసమర్థతను ఉద్ఘాటిస్తుంది. దానిని యథాతథంగా ఉంచడం ప్రకటన గ్రంథపు దర్శనాత్మక స్వరూపాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘గానీ ... గానీ’ నిర్మాణం విశ్వవ్యాప్త త్రిభాగ పరిధిని సహజంగా నిలుపుతుంది.
