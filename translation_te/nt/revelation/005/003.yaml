  to: పరలోకంలో గానీ, భూమిమీద గానీ, భూమికింద గానీ ఎవరూ ఆ చుట్టిన గ్రంథాన్ని విప్పలేకపోయారు; దానిని చూడనూ లేకపోయారు.[a]
