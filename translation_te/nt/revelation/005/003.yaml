review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the threefold cosmic scope, the universal incapacity, and the paired infinitives. For a scroll, however, Telugu more precisely and naturally expresses ἀνοῖξαι as ‘విప్పడం’ rather than ‘తెరవడం.’
  naturalness: ‘గ్రంథపు చుట్ట’ is understandable but somewhat cumbersome in modern standard Telugu. ‘చుట్టిన గ్రంథం’ is a more natural designation for a scroll in this context.
  terminology: ‘పరలోకం,’ ‘భూమి,’ and ‘భూమికింద’ suitably retain the apocalyptic spatial triad. ‘చుట్టిన గ్రంథం’ preserves the ancient scroll image without importing a codex-like sense.
  issues:
  - severity: low
    issue: Scroll terminology and corresponding verb are slightly mismatched.
    rationale: A ‘చుట్ట’ is normally unrolled (‘విప్పడం’), whereas ‘తెరవడం’ more readily evokes opening a bound book or object. Revising both terms gives a smoother and more source-sensitive rendering.
  revised_text: పరలోకంలో గానీ, భూమిమీద గానీ, భూమికింద గానీ ఎవరూ ఆ చుట్టిన గ్రంథాన్ని విప్పలేకపోయారు; దానిని చూడనూ లేకపోయారు.[a]
