revisions:
- from: ఆ నాలుగు జీవులు, “ఆమేన్” అని చెబుతూ ఉన్నాయి. పెద్దలు సాష్టాంగపడి ఆరాధించారు.[a]
  to: ఆ నాలుగు జీవులు, “ఆమేన్” అని చెబుతుండేవి. పెద్దలు సాగిలపడి ఆరాధించారు.[a]
  rationale: 'The revision changes only two expressions for source-sensitive naturalness: it renders the imperfect ἔλεγον with a past ongoing form, and it uses an idiomatic, non-overly-technical expression for the elders’ falling down. It retains the absolute ‘ఆరాధించారు’ and the textual-variant footnote, so no object of worship is supplied in the main text.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:57:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the four living creatures, their acclamation “Amen,” the elders, and the unexpressed object of worship. However, “చెబుతూ ఉన్నాయి” normally reads as present progressive in modern Telugu, whereas ἔλεγον is an imperfect in a past narrative setting. “చెబుతుండేవి” more naturally conveys the ongoing/repeated past action. “సాష్టాంగపడి” is understandable, but “సాగిలపడి” is a more idiomatic rendering of falling down in reverence without specifying the technical ‘eight-limbed’ form of prostration.
  naturalness: The revised wording is natural modern standard Telugu while retaining the elevated worship-scene register. “సాగిలపడి ఆరాధించారు” clearly joins the bodily act and worship without unnecessarily adding an object.
  terminology: ‘జీవులు,’ ‘ఆమేన్,’ ‘పెద్దలు,’ and ‘ఆరాధించారు’ are appropriate and consistent with established Telugu biblical usage. The footnote correctly identifies the textual variation and preserves the shorter SBLGNT reading.
  issues:
  - severity: medium
    issue: The verbal phrase “చెబుతూ ఉన్నాయి” is present-progressive in ordinary modern Telugu.
    rationale: It does not adequately reflect the Greek imperfect ἔλεγον in this past narrative. “చెబుతుండేవి” preserves the ongoing/repeated past sense.
  - severity: low
    issue: “సాష్టాంగపడి” may be more technically specific than the Greek ἔπεσαν.
    rationale: The Greek says that the elders fell down; “సాగిలపడి” idiomatically expresses reverential falling/prostration while avoiding the specific implication of aṣṭāṅga prostration.
  revised_text: ఆ నాలుగు జీవులు, “ఆమేన్” అని చెబుతుండేవి. పెద్దలు సాగిలపడి ఆరాధించారు.[a]
  revised_footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘ఆరాధించారు’ తర్వాత ‘యుగయుగాలు జీవించే వానిని’ లేదా ‘ఆయనను’ వంటి స్పష్టమైన కర్మ ఉంది. ప్రధాన పాఠం సంక్షిప్తమైన SBLGNT పాఠాన్ని అనుసరించి, సందర్భం ద్వారా అర్థమయ్యే ఆరాధన కర్మను అవ్యక్తంగా ఉంచుతుంది.
    reason: textual_variant
  revision_rationale: 'The revision changes only two expressions for source-sensitive naturalness: it renders the imperfect ἔλεγον with a past ongoing form, and it uses an idiomatic, non-overly-technical expression for the elders’ falling down. It retains the absolute ‘ఆరాధించారు’ and the textual-variant footnote, so no object of worship is supplied in the main text.'
