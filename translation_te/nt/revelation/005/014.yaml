id: REV.5.14
reference: Revelation 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα ⸀ἔλεγον· Ἀμήν. καὶ οἱ πρεσβύτεροι ἔπεσαν καὶ προσεκύνησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: te
  text: ఆ నాలుగు జీవులు, “ఆమేన్” అని చెబుతుండేవి. పెద్దలు సాగిలపడి ఆరాధించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘ఆరాధించారు’ తర్వాత ‘యుగయుగాలు జీవించే వానిని’ లేదా ‘ఆయనను’ వంటి స్పష్టమైన కర్మ ఉంది. ప్రధాన పాఠం సంక్షిప్తమైన SBLGNT పాఠాన్ని అనుసరించి, సందర్భం ద్వారా అర్థమయ్యే ఆరాధన కర్మను అవ్యక్తంగా ఉంచుతుంది.
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: జీవులు
  rationale: ప్రకటన గ్రంథంలోని సింహాసన దర్శన సందర్భంలో ఇది సాధారణ జంతువులను కాక, సింహాసనం చుట్టూ ఉన్న సజీవ పరలోక జీవులను సూచిస్తుంది. ‘జీవులు’ సహజంగా ఉండి యెహెజ్కేలు దర్శనంతో ఉన్న అనుసంధానాన్ని నిలుపుతుంది.
- source_word: ἔλεγον
  choice: చెబుతూ ఉన్నాయి
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమైన పలుకును సూచించగలదు; ఈ తెలుగు రూపం ఆ అంశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἀμήν
  choice: ఆమేన్
  rationale: ఇది ఆరాధనలోని సమ్మతి ప్రకటన. అర్థానువాదం చేయకుండా ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉంచడం దాని ఆరాధనా స్వరూపాన్ని కాపాడుతుంది.
- source_word: πρεσβύτεροι
  choice: పెద్దలు
  rationale: ఇక్కడ ఇది కేవలం వయస్సును కాక, పరలోక సమూహానికి చెందిన గుర్తింపును సూచిస్తుంది; ‘పెద్దలు’ ఆధునిక తెలుగు బైబిలు వాడుకలో సహజమైన పదం.
- source_word: ἔπεσαν
  choice: సాష్టాంగపడి
  rationale: ఆరాధనా సందర్భంలో కింద పడటం/ప్రణమిల్లటం అనే శారీరక చర్యను సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: προσεκύνησαν
  choice: ఆరాధించారు
  rationale: సింహాసన మందిర సందర్భంలో ఈ క్రియ కేవలం నమస్కారాన్ని కాక ఆరాధనాత్మక భక్తిని సూచిస్తుంది.
theological_decisions:
- issue: ఆరాధనకు ఉద్దేశించిన వ్యక్తి మూలపాఠంలో అవ్యక్తంగా ఉండటం
  choice: ‘ఆరాధించారు’ అని మాత్రమే ఉంచి కర్మను చేర్చలేదు.
  alternative: ‘ఆయనను ఆరాధించారు’; ‘దేవుణ్ణి ఆరాధించారు’; ‘యుగయుగాలు జీవించే వానిని ఆరాధించారు’
  rationale: SBLGNT పాఠం καὶ προσεκύνησαν వద్ద వ్యక్తమైన కర్మ లేకుండానే ముగుస్తుంది. సందర్భం ద్వారా అర్థమయ్యే కర్మను తెలుగు సహజంగా అవ్యక్తంగా ఉంచగలదు; దానిని స్పష్టపరచడం ఇతర పాఠాంతరాల లేదా వ్యాఖ్యానపు పదాలను ప్రధాన పాఠంలోకి తేవడమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే పరలోక ఆరాధనా దృశ్యానికి తగిన గౌరవప్రదమైన శైలి. ‘చెబుతూ ఉన్నాయి’ ద్వారా గ్రీకు అసంపూర్ణ భూతకాల భావం నిలుపబడింది; మూలపాఠంలో లేని ఆరాధన కర్మను చేర్చలేదు.
