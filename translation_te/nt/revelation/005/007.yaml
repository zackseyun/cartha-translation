source:
  edition: SBLGNT
  text: καὶ ἦλθεν καὶ εἴληφεν ἐκ τῆς δεξιᾶς τοῦ καθημένου ἐπὶ τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/007.yaml
  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: te
  text: ఆయన వచ్చి, సింహాసనంపై కూర్చున్నవాని కుడిచేతి నుండి దానిని తీసుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దానిని—అంటే ముందరి సందర్భంలో చెప్పబడిన గ్రంథచుట్టను.
    reason: గ్రీకు మూలంలో కర్మ స్పష్టంగా రాయకపోయినా, సందర్భం దానిని తెలియజేస్తుంది; తెలుగులో చేర్చిన సర్వనామ సూచనను వివరిస్తుంది.
lexical_decisions:
- source_word: ἦλθεν
  choice: వచ్చి
  rationale: ἔρχομαι యొక్క భూతకాల కథన రూపం. దర్శనంలోని కదలికను అదనపు వివరణ లేకుండా సహజమైన తెలుగు కథన శైలిలో తెలియజేస్తుంది.
- source_word: εἴληφεν
  choice: తీసుకున్నాడు
  rationale: λαμβάνω యొక్క పరిపూర్ణకాల రూపం అయినప్పటికీ, దర్శన కథనంలోని వరుస చర్యగా తెలుగులో సాధారణ భూతకాలంతో సహజంగా వ్యక్తమవుతుంది. ఇక్కడ 'స్వీకరించాడు' కంటే ప్రత్యక్షంగా తీసుకునే చర్యను 'తీసుకున్నాడు' స్పష్టంగా చూపిస్తుంది.
- source_word: ἐκ
  choice: నుండి
  rationale: మూలస్థానాన్ని సూచించే సాధారణ స్థానార్థం; ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: τῆς δεξιᾶς
  choice: కుడిచేతిలో
  rationale: ఈ నిర్మాణంలో δεξιά కుడివైపు మాత్రమే కాక కుడిచేతిని సూచిస్తుంది. ἐκతో కలిసినప్పుడు తెలుగులో 'కుడిచేతిలో నుండి' అనే రూపం దృశ్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: τοῦ καθημένου
  choice: కూర్చున్నవాని
  rationale: κάθημαι వర్తమాన కృదంతం నామవాచకంగా వాడబడింది. నిరంతర స్థితిని కాపాడుతూ, వ్యక్తిని స్పష్టంగా సూచించే సహజమైన గౌరవప్రద తెలుగు రూపం.
- source_word: ἐπὶ τοῦ θρόνου
  choice: సింహాసనం మీద
  rationale: ἐπί యొక్క స్థానార్థాన్ని ఆధునిక సాధారణ తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది; 'మీద' సహజమైనది, అతిగా ప్రాచీనమైనది కాదు.
theological_decisions:
- issue: εἴληφεν యొక్క సూచిత కర్మ
  choice: '''దానిని'' అని చేర్చి, ముందరి సందర్భంలోని గ్రంథపు చుట్టను సూచించడం'
  alternative: కర్మను వ్యక్తం చేయకుండా 'కుడిచేతిలో నుండి తీసుకున్నాడు' అని అనువదించడం
  rationale: గ్రీకులో సందర్భం వల్ల కర్మ విడిచిపెట్టబడింది. తెలుగులో 'దానిని' చేర్చడం వాక్యాన్ని స్పష్టం చేస్తుంది; ముందరి సందర్భానికి మించిన కొత్త భావాన్ని జోడించదు.
- issue: సింహాసనంపై ఉన్న వ్యక్తి యొక్క వర్ణన
  choice: సింహాసనం మీద కూర్చున్నవాడు
  alternative: సింహాసనాసీనుడు
  rationale: ఇది గొఱ్ఱెపిల్లకు మరియు సింహాసనంపై కూర్చున్న వ్యక్తికి మధ్య ఉన్న భేదాన్ని నిలుపుతుంది; వ్యక్తి ఎవరో అనే అదనపు సిద్ధాంత వివరణను చేర్చదు. కృదంత నిర్మాణానికి కూడా దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథన క్రమం, గౌరవప్రదమైన బైబిలు శైలి. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతగా నిలుపుతూ, సూచిత కర్మను సందర్భానుసారంగా స్పష్టం చేసింది.
