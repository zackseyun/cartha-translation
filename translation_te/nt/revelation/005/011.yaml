id: REV.5.11
reference: Revelation 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: te
  text: నేను చూశాను[a], మరియు సింహాసనం, ఆ జీవులు, పెద్దలు చుట్టూ ఉన్న అనేక దేవదూతల స్వరాన్ని విన్నాను. వారి సంఖ్య పదివేల కొలది పదివేలు, వేల కొలది వేలు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను దృష్టి సారించాను.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా, “పదివేల కొలది పదివేలు, వేల కొలది వేలు”; ఇది అపారమైన సమూహాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: ὁράω యొక్క సాధారణ దర్శనాత్మక అర్థాన్ని నిలుపుతుంది; తరువాత వచ్చే ‘విన్నాను’తో ప్రకటన గ్రంథంలోని చూచుట–వినుట క్రమాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἤκουσα
  choice: విన్నాను
  rationale: అయోరిస్ట్ కథనంలో ἀκούωకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: అనేకమంది దేవదూతల స్వరం
  rationale: సమూహం వెలువరించే ఏకీకృత స్వరాన్ని సూచించే గ్రీకు ఏకవచన φωνήνను ‘స్వరం’గా ఉంచి, జనిటివ్ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων
  choice: సింహాసనం చుట్టూ, ఆ జీవులూ పెద్దలూ ఉన్న చోట
  rationale: κύκλῳ మూడు జనిటివ్ పదాలకూ సంబంధించగల నిర్మాణాన్ని తెలుగులో సహజంగా చూపుతూ, దేవదూతలు సింహాసనం, జీవులు, పెద్దల చుట్టూ ఉన్న దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: ζῴων
  choice: ఆ జీవులు
  rationale: ప్రకటన గ్రంథంలోని ప్రత్యేక సింహాసనమందిర జీవులను సూచిస్తుంది; ‘జంతువులు’ అనే సాధారణ అర్థాన్ని నివారిస్తుంది.
- source_word: πρεσβυτέρων
  choice: పెద్దలు
  rationale: ప్రకటన గ్రంథ సింహాసన దృశ్యాల్లో πρεσβύτεροιకు సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: వారి సంఖ్య
  rationale: సంఖ్యను స్పష్టంగా పేర్కొనే గ్రీకు వాక్యభాగాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων
  choice: పదివేల కొలది పదివేలు, వేల కొలది వేలు
  rationale: μυριάς యొక్క సంఖ్యాత్మక విలువను, గ్రీకు పునరుక్తి ద్వారా వ్యక్తమయ్యే అపార సమూహ భావాన్ని రెండింటినీ కాపాడుతుంది.
theological_decisions:
- issue: ప్రకటన గ్రంథంలోని ζῷα అనే సింహాసనమందిర జీవుల పేరు
  choice: ఆ జీవులు
  alternative: ఆ జీవరాశులు / ఆ సజీవ ప్రాణులు
  rationale: వాటిని సాధారణ జంతువులుగా కుదించకుండా, సందర్భంలో ముందే పరిచయమైన ప్రత్యేక జీవులుగా సూచిస్తుంది; వాటి స్వరూపం గురించి అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: దేవదూతల సంఖ్యను నిర్దిష్ట గణనగా లేదా అపార సమూహ సూచనగా గ్రహించడం
  choice: గ్రీకు సంఖ్యా పునరుక్తిని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: లెక్కలేనంత గొప్ప సమూహం
  rationale: మూలంలోని అపారత భావాన్ని కాపాడుతూనే దానిని కేవలం అలంకారంగా నిర్ణయించకుండా, సంఖ్యాత్మక రూపాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన దర్శనకథన శైలి. మూలంలోని చూచుట–వినుట క్రమం, సమూహ స్వరానికి ఏకవచనం, సంఖ్యల పునరుక్తి నిలుపబడ్డాయి.
