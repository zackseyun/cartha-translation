id: REV.5.5
reference: Revelation 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: te
  text: 'పెద్దలలో ఒకడు నాతో ఇలా అంటున్నాడు: “ఏడవకు. ఇదిగో, యూదా గోత్రం నుంచి వచ్చిన సింహం, దావీదు వేరు, చుట్టను, దాని ఏడు ముద్రలను తెరవడానికి జయించాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: పెద్దలలో
  rationale: ప్రకటన గ్రంథంలో ఇది కేవలం వయస్సును కాక, పరలోక సభలోని గుర్తింపు పొందిన వర్గాన్ని సూచిస్తుంది; ‘పెద్దలు’ ఆ పాత్రను సహజంగా నిలుపుతుంది.
- source_word: λέγει
  choice: ఇలా అంటున్నాడు
  rationale: గ్రీకు వర్తమాన కాలంలోని కథన సజీవతను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Μὴ κλαῖε
  choice: ఏడవకు
  rationale: క్లుప్తమైన నిషేధార్థక ఆజ్ఞను, సందర్భంలోని గంభీర స్వరాన్ని సహజంగా అందిస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షించే గ్రీకు ఉద్బోధక పదం యొక్క బలాన్ని ప్రస్తుత ప్రామాణిక తెలుగులో నిలుపుతుంది.
- source_word: ἐνίκησεν
  choice: జయించాడు
  rationale: ప్రకటన గ్రంథంలో పునరావృతమయ్యే νικάω అనే విజయపదానికి నేరమైన సమానార్థకం; జయించడం/అధిగమించడం అనే భావ ఉద్రిక్తతను నిలుపుతుంది.
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: యూదా గోత్రం నుంచి వచ్చిన సింహం
  rationale: ἐκ సూచించే మూలం లేదా అనుబంధాన్ని స్పష్టంగా ఉంచుతూ మెస్సీయ సంబంధిత సింహ బిరుదును యథాతథంగా నిలుపుతుంది.
- source_word: ἡ ῥίζα Δαυίδ
  choice: దావీదు వేరు
  rationale: ῥίζα యొక్క వేరు రూపకాన్ని ‘చిగురు’ వంటి వ్యాఖ్యానాత్మక మార్పు లేకుండా నిలుపుతుంది; ఇది బిరుదుగా సందర్భంలో అర్థమవుతుంది.
- source_word: ἀνοῖξαι
  choice: అందువల్ల ఆయన … తెరవగలడు
  rationale: జయానికి, చుట్టను తెరవడానికి మధ్య ఉన్న ఫలితం/సామర్థ్య సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకు అపాదాన క్రియారూపం మరింత అక్షరార్థంగా కూడా అనువదించవచ్చని పాదసూచికలో ఉంచబడింది.
- source_word: τὸ βιβλίον
  choice: చుట్టను
  rationale: ఈ దర్శన సందర్భంలో βιβλίον కట్టిన పుస్తకంకన్నా వ్రాతచుట్టను సూచిస్తుంది.
- source_word: σφραγῖδας
  choice: ముద్రలను
  rationale: చుట్టను మూసి భద్రపరిచే ముద్రలకు సందర్భోచితమైన సాధారణ తెలుగు పదం.
- source_word: αὐτοῦ
  choice: దాని
  rationale: సర్వనామం చుట్టను సూచిస్తుంది; తెలుగు స్వామ్యరూపంలో సహజంగా అనువదించబడింది.
theological_decisions:
- issue: యేసుకు వర్తింపజేసిన మెస్సీయ రాజబిరుదులు
  choice: ‘యూదా గోత్రం నుంచి వచ్చిన సింహం’, ‘దావీదు వేరు’ అనే రెండు బిరుదులనూ స్పష్టంగా నిలుపడం.
  alternative: ఒకటి లేదా రెండు బిరుదులను వివరణాత్మక భావానువాదంతో మార్చడం.
  rationale: వాక్యం ఇశ్రాయేలు లేఖనాల నేపథ్యంలోని రెండు రాజసంబంధిత/మెస్సీయ బిరుదులను ఉద్దేశపూర్వకంగా కలుపుతుంది. అదనపు సిద్ధాంత వివరణ లేకుండా వాటిని నేరుగా నిలుపడం మూలంలోని క్రీస్తు సంబంధిత బలాన్ని కాపాడుతుంది.
- issue: ἐνίκησεν తరువాత ἀνοῖξαι యొక్క సంబంధం
  choice: జయానికి ఫలితంగా తెరవగల సామర్థ్యాన్ని ‘అందువల్ల ఆయన … తెరవగలడు’ అని వ్యక్తం చేయడం.
  alternative: ‘తెరవడానికి జయించాడు’ అని గ్రీకు అపాదాన క్రియారూపాన్ని మరింత అక్షరార్థంగా ఉంచడం.
  rationale: ఈ నిర్మాణం విజయాన్ని చుట్ట తెరవడంతో అనుసంధానిస్తుంది. ప్రధాన పాఠం సహజ తెలుగులో ఆ సంబంధాన్ని తెలియజేస్తుంది; అయితే ‘యోగ్యత’ అనే మూలంలో లేని పదాన్ని చేర్చదు, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, దర్శన వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ఇదిగో’, ‘చుట్ట’, ‘ముద్రలు’ వంటి పదాలు స్పష్టతతో పాటు లేఖనాత్మక స్వరాన్ని నిలుపుతాయి. మెస్సీయ బిరుదుల రూపకాలను వివరణగా మార్చకుండా కాపాడింది.
