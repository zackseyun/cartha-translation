id: REV.5.10
reference: Revelation 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: te
  text: మా దేవునికి వారిని ఒక రాజ్యంగా, యాజకులుగా[a] చేశావు; వారు భూమిపై పరిపాలిస్తున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “ఒక రాజ్యంగా, యాజకులుగా” అనే బదులు “రాజులుగా, యాజకులుగా” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో “పరిపాలిస్తున్నారు” అనే బదులు “పరిపాలిస్తారు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: చేశావు
  rationale: ఆరిస్ట్ కర్తరి నిర్దేశక రూపాన్ని సహజమైన తెలుగు భూతకాలంతో వ్యక్తం చేస్తుంది.
- source_word: αὐτοὺς
  choice: వారిని
  rationale: మునుపటి వచనంలో విమోచించబడిన ప్రజలను సూచించే బహువచన కర్మప్రత్యయం.
- source_word: τῷ θεῷ ἡμῶν
  choice: మా దేవునికి
  rationale: దత్తివిభక్తి రూపాన్ని, సమర్పణ భావాన్ని అనవసరంగా విస్తరించకుండా నేరుగా నిలుపుతుంది.
- source_word: βασιλείαν
  choice: ఒక రాజ్యంగా
  rationale: 'ఏకవచన నామవాచకాన్ని సమూహార్థంలో అనువదిస్తుంది: వారు రాజులుగా కాక, ఒక రాజ్యంగా ఏర్పరచబడ్డారు.'
- source_word: ἱερεῖς
  choice: యాజకులుగా
  rationale: మూలంలోని బహువచన నామవాచకానికి సాధారణమైన, గౌరవప్రదమైన తెలుగు పదం; ‘చేశావు’తో సరిపడేలా ‘గా’ రూపం వాడబడింది.
- source_word: βασιλεύουσιν
  choice: పరిపాలిస్తున్నారు
  rationale: ఇచ్చిన SBLGNT పాఠంలోని వర్తమాన కర్తరి నిర్దేశక రూపాన్ని స్పష్టమైన తెలుగు వర్తమాన కాలంలో నిలుపుతుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిపై
  rationale: ἐπί + షష్ఠీ విభక్తి యొక్క స్థానార్థాన్ని నేరుగా వ్యక్తం చేస్తుంది; ‘భూమిమీద అధికారంతో’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
theological_decisions:
- issue: విమోచించబడినవారి గుర్తింపు—βασιλείαν
  choice: ఒక రాజ్యంగా
  alternative: రాజులుగా
  rationale: స్వీకరించిన SBLGNT పాఠంలో βασιλείαν (‘రాజ్యం’) ఉంది; βασιλεῖς (‘రాజులు’) అనే పాఠాంతరాన్ని పాదసూచికలో ఉంచాం.
- issue: వారి పరిపాలన కాలం—βασιλεύουσιν
  choice: పరిపాలిస్తున్నారు
  alternative: పరిపాలిస్తారు
  rationale: ఇచ్చిన గ్రీకు రూపం వర్తమాన కాలంలో ఉంది. అందువల్ల అంత్యకాల సంబంధమైన ప్రశ్నను ముందే తీర్మానించకుండా వర్తమాన భావాన్ని ప్రధాన పాఠంలో నిలిపి, భవిష్యత్ పాఠాంతరాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గీతాత్మక గౌరవాన్ని నిలిపే శైలి. ‘పరిపాలిస్తున్నారు’ అనే రూపం గ్రీకు వర్తమాన కాలాన్ని స్పష్టంగా చూపుతుంది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
