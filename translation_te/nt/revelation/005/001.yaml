  source_fidelity: 'The Telugu accurately represents all principal Greek elements: John''s seeing, the scroll in the right hand of the one seated on the throne, writing on its inner and reverse sides, and its sealed condition with seven seals. It retains the source''s descriptive, non-explicit identification of the enthroned figure. The two-sentence Telugu arrangement does not alter the syntactic or semantic relationships.'
