  terminology: “గ్రంథపు చుట్ట” appropriately conveys βιβλίον as a scroll in this material setting, while footnote a responsibly records “గ్రంథం” as an alternative. “లోపలివైపునా వెనుకవైపునా” preserves the physical sense of ἔσωθεν καὶ ὄπισθεν without flattening it to a generic “outside.” “ముద్రలు” accurately renders σφραγῖσιν.
