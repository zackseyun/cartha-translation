id: REV.5.1
reference: Revelation 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ⸀ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: te
  text: సింహాసనం మీద కూర్చున్నవాని కుడిచేతిలో ఒక గ్రంథపు చుట్టను[a] చూశాను. దాని లోపలివైపునా వెనుకవైపునా[b] రాసి ఉంది; అది ఏడు ముద్రలతో ముద్రించబడి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక గ్రంథాన్ని.’ ఇక్కడి గ్రీకు పదం βιβλίον కోడెక్స్ రూపంలోని పుస్తకం కంటే గ్రంథపు చుట్టను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘లోపలివైపునా వెనుకవైపునా.’ కొన్ని అనువాదాలు రెండో మాటను మరింత సాధారణంగా ‘బయటివైపునా’ అని ఇస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: చూశాను
  rationale: కథనంలో Καί అనుసంధానాన్ని సందర్భప్రవాహం తెలుపుతుంది; εἶδον అనే సాధారణ భూతకాల క్రియను సహజమైన తెలుగులో ‘చూశాను’గా ఇచ్చాం.
- source_word: ἐπὶ τὴν δεξιὰν
  choice: కుడిచేతిలో
  rationale: ἐπί అక్షరార్థంగా ‘మీద’ అనే భావాన్ని ఇవ్వగలిగినా, ఇక్కడ వస్తువు ఆ వ్యక్తి అధీనంలో లేదా చేతిలో ఉన్న దృశ్యాన్ని సహజంగా తెలియజేయడానికి ‘కుడిచేతిలో’ సరిపోతుంది.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: సింహాసనం మీద కూర్చున్నవాని
  rationale: మూలంలోని నామవాచకార్థక కృదంతాన్ని వివరణాత్మకంగానే ఉంచి, ఆ వ్యక్తిని దేవుడని వచనంలోనే స్పష్టీకరించలేదు.
- source_word: βιβλίον
  choice: గ్రంథపు చుట్ట
  rationale: మొదటి శతాబ్దపు సందర్భం, రెండు వైపులా రాయబడటం, ముద్రలు వేయబడటం అనే చిత్రణల దృష్ట్యా ఇది కోడెక్స్ పుస్తకం కంటే చుట్టను సూచించే అవకాశం ఎక్కువ. ‘గ్రంథపు చుట్ట’ ఆధునిక పాఠకుడికి వస్తువు స్వరూపాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: γεγραμμένον
  choice: రాసి ఉంది
  rationale: పరిపూర్ణ కర్మణి కృదంతం రాయడం పూర్తయి, ఆ స్థితి కొనసాగుతోందనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: లోపలివైపునా వెనుకవైపునా
  rationale: చుట్ట యొక్క లోపలి భాగాన్నీ దాని వెనుక లేదా తిరుగు వైపునీ సూచించే భౌతిక చిత్రాన్ని నిలుపుతుంది; రెండో పదాన్ని సాధారణీకరించి కేవలం ‘బయట’ అని మార్చలేదు.
- source_word: κατεσφραγισμένον
  choice: ముద్రించబడి ఉంది
  rationale: ముద్రవేయడం పూర్తయి వస్తువు ఆ స్థితిలో ఉందనే పరిపూర్ణ కర్మణి భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: σφραγῖσιν ἑπτά
  choice: ఏడు ముద్రలతో
  rationale: సాధనార్థక చతుర్థీ విభక్తిని తెలుగులో సహజమైన ‘తో’ రూపంతో వ్యక్తం చేసింది.
theological_decisions:
- issue: సింహాసనం మీద కూర్చున్న వ్యక్తి గుర్తింపు
  choice: సింహాసనం మీద కూర్చున్నవాని
  alternative: సింహాసనం మీద కూర్చున్న దేవుని
  rationale: గ్రీకు వాక్యం ఆ వ్యక్తిని వివరణాత్మకంగా సూచిస్తుంది గాని ఈ వచనంలో దైవనామాన్ని స్పష్టంగా ఉపయోగించదు. అందువల్ల గుర్తింపును అనువాదంలో ముందుగానే నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. పొడవైన గ్రీకు వాక్య నిర్మాణాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించినా, దృశ్యంలోని అంశాల క్రమం మరియు పరస్పర సంబంధం నిలుపబడ్డాయి.
