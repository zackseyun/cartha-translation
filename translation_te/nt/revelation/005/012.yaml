id: REV.5.12
reference: Revelation 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: te
  text: 'వారు బిగ్గర స్వరంతో ఇలా అన్నారు: “వధించబడిన[a] గొర్రెపిల్ల శక్తిని, సంపదను[b], జ్ఞానాన్ని, బలాన్ని[c], ఘనతను, మహిమను, ఆశీర్వాదాన్ని పొందడానికి అర్హుడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చంపబడిన.” గ్రీకు పదం వధను స్పష్టంగా సూచిస్తుంది; “వధించబడిన” అనే రూపం ఈ ఆరాధనా సందర్భంలోని గంభీరతకు సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఐశ్వర్యాన్ని.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “పరాక్రమాన్ని.” ఇక్కడ ‘బలం’ అని అనువదించిన గ్రీకు పదం, ముందున్న ‘శక్తి’కి వాడిన గ్రీకు పదానికి భిన్నమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: ఇలా అన్నారు
  rationale: ఈ వర్తమాన కృదంతం మునుపటి వచనంలోని సమూహంతో వాక్యసంబంధాన్ని కొనసాగిస్తుంది. తెలుగులో సహజమైన ప్రత్యక్ష వాక్య ప్రవేశం కోసం ‘ఇలా అన్నారు’ అని అనువదించాం.
- source_word: φωνῇ μεγάλῃ
  choice: బిగ్గర స్వరంతో
  rationale: స్వరానికి సంబంధించిన స్పష్టమైన చిత్రణను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించే విధంగా అనువదించాం.
- source_word: Ἄξιόν ἐστιν
  choice: అర్హుడు
  rationale: గొర్రెపిల్ల ఇక్కడ క్రీస్తును సూచించే వ్యక్తిగత బిరుదు కాబట్టి పుంలింగ రూపం సహజం; పొందడానికి తగినవాడనే భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: τὸ ἀρνίον
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలో యేసుకు వాడే స్థిరమైన క్రీస్తు సంబంధ బిరుదును సహజ తెలుగులో నిలుపుతుంది.
- source_word: τὸ ἐσφαγμένον
  choice: వధించబడిన
  rationale: σφάζω అనే పదంలోని హింసాత్మక మరణ భావాన్ని నిలుపుతూ, ఆరాధనా సందర్భానికి తగిన గంభీరతను కాపాడుతుంది. సంపూర్ణ కర్మణి కృదంతంలోని గత చర్యతో కూడిన ప్రస్తుత స్థితి తెలుగులో ఈ రూపంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: λαβεῖν
  choice: పొందడానికి
  rationale: ఈ స్తుతిగీతంలో పేర్కొన్నవన్నీ గొర్రెపిల్లకు అర్పించబడుతున్నందున ‘తీసుకోవడానికి’ కంటే ‘పొందడానికి’ సందర్భానికి మరింత సహజం.
- source_word: δύναμιν
  choice: శక్తిని
  rationale: δύναμιςకు సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: πλοῦτον
  choice: సంపదను
  rationale: వనరులు, ఐశ్వర్యం అనే విస్తృత భావాన్ని ఆధునిక సాధారణ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: σοφίαν
  choice: జ్ఞానాన్ని
  rationale: σοφία యొక్క సాధారణ అర్థాన్ని నేరుగా అందిస్తుంది.
- source_word: ἰσχὺν
  choice: బలాన్ని
  rationale: శారీరకమైనా కార్యసామర్థ్యమైనా బలాన్ని సూచించగల ἰσχύςను సహజంగా తెలియజేస్తూ, ముందున్న ‘శక్తి’తో పదభేదాన్ని నిలుపుతుంది.
- source_word: τιμὴν
  choice: ఘనతను
  rationale: ఆరాధనలో అర్పించబడే గౌరవం, ప్రతిష్ఠ అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: δόξαν
  choice: మహిమను
  rationale: ఆరాధనా సందర్భాల్లో δόξαకు స్థిరమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: εὐλογίαν
  choice: ఆశీర్వాదాన్ని
  rationale: εὐλογία యొక్క ప్రాథమిక ‘ఆశీర్వాదం’ భావాన్ని నిలుపుతుంది; దానిని కేవలం ‘స్తుతి’గా పరిమితం చేయదు.
theological_decisions:
- issue: క్రీస్తు సంబంధ బిరుదుగా గొర్రెపిల్ల
  choice: గొర్రెపిల్ల
  alternative: ఒక గొర్రెపిల్ల
  rationale: నిర్దిష్ట ఉపపదం మరియు ప్రకటన గ్రంథ సందర్భం ఇది సాధారణ జంతువు కాక, వధించబడిన మరియు మహిమపరచబడిన యేసును సూచించే బిరుదని తెలియజేస్తాయి. తెలుగులో ప్రత్యేక పెద్ద అక్షర రూపం లేకపోవడంతో సందర్భమే బిరుదును స్పష్టం చేస్తుంది.
- issue: వధ భాషలో బలియర్పణ భావాన్ని అతిగా చేర్చకపోవడం
  choice: వధించబడిన
  alternative: బలిగా అర్పించబడిన
  rationale: σφάζω వధను స్పష్టంగా సూచిస్తుంది; అయితే ఈ పదమే ఒంటరిగా ‘బలిగా అర్పించబడిన’ అనే పూర్తి వ్యాఖ్యానాన్ని తప్పనిసరి చేయదు. అందువల్ల మూలంలోని మరణభావాన్ని ఉంచి, బలియర్పణ విధానాన్ని అనువాదంలో అదనంగా నిర్దేశించలేదు.
- issue: εὐλογία యొక్క అర్థ విస్తృతి
  choice: ఆశీర్వాదం
  alternative: స్తుతి
  rationale: ఆరాధనా సందర్భంలో ఈ పదం స్తుతి లేదా ప్రశంస భావాన్ని కూడా కలిగి ఉండవచ్చు. అయినా మూలపదంలోని ‘ఆశీర్వాదం’ భావాన్ని నిలుపుతూ, అర్థాన్ని ఒకే విధంగా పరిష్కరించకుండా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనా ప్రకటనకు తగిన గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. ఏడు అంశాల వరుసను మరియు వాటి మధ్య సమన్వయాన్ని మూలానికి అనుగుణంగా నిలుపుకున్నాం.
