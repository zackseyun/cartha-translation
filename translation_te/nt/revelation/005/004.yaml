id: REV.5.4
reference: Revelation 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: te
  text: ఆ చుట్టగ్రంథాన్ని[a] తెరవడానికిగానీ, దానిని చూడడానికిగానీ[b] యోగ్యుడైనవారెవరూ కనబడనందున నేను ఎంతోగా ఏడుస్తూ ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ గ్రంథాన్ని” లేదా “ఆ పుస్తకాన్ని.” గ్రీకు పదం βιβλίον ఈ అర్థాలను కూడా కలిగి ఉండవచ్చు; అయితే ఇక్కడి ప్రాచీన దృశ్యానికీ, దానిని తెరవడం అనే చిత్రణకూ “చుట్టగ్రంథం” బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దానిలో చూడడానికి.” గ్రీకు పదబంధం నేరుగా “దానిని చూడడం” అని చెప్పినా, సందర్భంలో దాని లోపలి విషయాలను చూడడాన్ని కూడా సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: నేను
  rationale: తెలుగులో వాక్యసంధి, కర్త ప్రాధాన్యం సందర్భం ద్వారా సహజంగా వ్యక్తమవుతాయి; అనవసరంగా ‘మరియు’ చేర్చకుండా కథన ప్రవాహాన్ని నిలుపుతుంది.
- source_word: ἔκλαιον
  choice: ఏడుస్తూ ఉన్నాను
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న చర్యను సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: πολύ
  choice: ఎంతోగా
  rationale: ఏడుపు తీవ్రతను తెలియజేస్తుంది; మూలంలో లేని ‘బిగ్గరగా’ లేదా ‘వెక్కివెక్కి’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: οὐδεὶς
  choice: ఎవరూ
  rationale: అర్హతగల ఏ వ్యక్తీ లేడనే సంపూర్ణ ప్రతికూల భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἄξιος
  choice: యోగ్యుడు
  rationale: కేవలం సామర్థ్యం లేదా అర్హతకన్నా, దేవుని సమక్షంలో తగిన విలువ మరియు స్థానం అనే గంభీర భావాన్ని నిలుపుతుంది.
- source_word: εὑρέθη
  choice: కనిపించలేదు
  rationale: మూలంలోని కర్మణి భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ఎవరు వెదికారనే కర్తను ఊహించి చేర్చదు.
- source_word: ἀνοῖξαι
  choice: తెరవడానికి
  rationale: యోగ్యత ఏ కార్యానికి అవసరమో స్పష్టంగా తెలిపే సరళమైన క్రియారూపం.
- source_word: τὸ βιβλίον
  choice: ఆ గ్రంథపు చుట్టను
  rationale: ప్రకటన గ్రంథంలోని ప్రాచీన దృశ్యానికి తగిన చుట్టబడిన లిఖిత పత్రాన్ని సూచిస్తుంది; సాధారణ ఆధునిక పుస్తకమనే దృశ్యాన్ని నివారిస్తుంది.
- source_word: οὔτε βλέπειν αὐτό
  choice: దానిని చూడడానికిగానీ
  rationale: βλέπειν యొక్క ప్రాథమిక అర్థమైన ‘చూడడం’ను నిలుపుతుంది; దాని విషయాలను పరిశీలించడం అనే సందర్భసాధ్య భావాన్ని పాదసూచికలో ఉంచి, ప్రధాన పాఠంలో దానిని ఖరారు చేయదు.
- source_word: ὅτι
  choice: కనిపించనందుకు
  rationale: యోహాను ఏడుపుకు కారణాన్ని తెలుగులో సహజమైన కారణార్థక నిర్మాణంతో తెలియజేస్తుంది.
theological_decisions:
- issue: పరలోక సింహాసన దృశ్యంలో ἄξιος స్వభావం
  choice: ‘యోగ్యుడు’ అని అనువదించడం
  alternative: ‘అర్హుడు’ లేదా ‘తగినవాడు’
  rationale: ఇది ఒక పని చేయగల సామర్థ్యాన్ని మాత్రమే కాక, దేవుని సంకల్పాన్ని నెరవేర్చడానికి అవసరమైన గంభీరమైన యోగ్యతను సూచిస్తుంది; అయితే ఆ భావాన్ని వివరణగా విస్తరించదు.
- issue: ప్రకటన 5లో βιβλίον సూచించే వస్తువు
  choice: ‘గ్రంథపు చుట్ట’ అని అనువదించడం
  alternative: ‘గ్రంథం’ లేదా ‘పుస్తకం’
  rationale: తెరవబడే చుట్టగ్రంథం అనే ప్రాచీన సాంస్కృతిక దృశ్యాన్ని స్పష్టపరుస్తుంది; సిద్ధాంతపరమైన అదనపు భావాన్ని చేర్చదు.
- issue: βλέπειν αὐτό యొక్క భావవ్యాప్తి
  choice: ‘దానిని చూడడం’ అనే విస్తృత రూపాన్ని ప్రధాన పాఠంలో ఉంచడం
  alternative: ‘దానిలో చూడడం’ లేదా ‘దాని విషయాలను పరిశీలించడం’
  rationale: గ్రీకు పదబంధం కేవలం దానిని చూడడాన్నీ, సందర్భంలో దాని లోపలివాటిని చూడడాన్నీ సూచించగలదు. ప్రధాన పాఠం ఈ సందిగ్ధతను ముందుగానే పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఏడుస్తూ ఉన్నాను’ కొనసాగుతున్న చర్యను నిలుపుతుంది. ‘గ్రంథపు చుట్ట’ ప్రాచీన వస్తువును స్పష్టంగా చూపుతుంది; పాదసూచికలు నిజమైన పదార్థ ప్రత్యామ్నాయాలను నమోదు చేస్తాయి.
