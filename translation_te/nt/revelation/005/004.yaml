revisions:
- from: ఆ గ్రంథపు చుట్టను[a] తెరవడానికిగానీ, దానిని చూడడానికిగానీ[b] యోగ్యుడెవరూ కనిపించనందుకు నేను ఎంతోగా ఏడుస్తూ ఉన్నాను.
  to: ఆ చుట్టగ్రంథాన్ని[a] తెరవడానికిగానీ, దానిని చూడడానికిగానీ[b] యోగ్యుడైనవారెవరూ కనబడనందున నేను ఎంతోగా ఏడుస్తూ ఉన్నాను.
