id: REV.14.20
reference: Revelation 14:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: te
  text: ఆ ద్రాక్షతొట్టి పట్టణం వెలుపల తొక్కబడింది; ఆ ద్రాక్షతొట్టి నుండి రక్తం బయటికి వచ్చి, గుర్రాల కళ్లెముల ఎత్తు వరకు వెయ్యి ఆరువందల స్టేడియాల మేర విస్తరించింది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ ద్రాక్షతొట్టి నుండి రక్తం ప్రవహించింది.”
    reason: lexical_alternative
  - marker: b
    text: స్టేడియం ప్రాచీన దూర కొలమానం; 1,600 స్టేడియాలు సుమారు 296 కిలోమీటర్లు.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπατήθη
  choice: తొక్కబడింది
  rationale: πατέω యొక్క కర్మణి రూపాన్ని నేరుగా ప్రతిబింబిస్తూ, ద్రాక్షతొట్టి రూపకాన్ని నిలుపుతుంది.
- source_word: ληνός / ληνοῦ
  choice: ద్రాక్షతొట్టి
  rationale: ద్రాక్షలను కాళ్లతో తొక్కే తొట్టిని ఆధునిక పాఠకులకు సహజంగా తెలియజేస్తూ, పంటకోత–తీర్పు దృశ్యాన్ని కాపాడుతుంది.
- source_word: ἔξωθεν τῆς πόλεως
  choice: పట్టణం వెలుపల
  rationale: స్థలాన్ని సూచించే గ్రీకు పదబంధానికి సహజమైన, సూటి తెలుగు రూపం.
- source_word: ἐξῆλθεν αἷμα
  choice: రక్తం బయటికి వచ్చి
  rationale: ἐξέρχομαι యొక్క ప్రాథమిక భావమైన ‘బయటికి రావడం’ను ఉంచుతుంది; ‘ప్రవహించింది’ అనే సందర్భానుకూల భావాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించదు.
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: గుర్రాల కళ్లెముల ఎత్తు వరకు
  rationale: రక్తం చేరిన నిలువు పరిమాణాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తూ మూలంలోని భయానక దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: వెయ్యి ఆరువందల స్టేడియాల దూరం
  rationale: మూలంలోని ప్రాచీన కొలమానాన్ని మార్చకుండా ఉంచి, ఆ పరిమాణం దూరాన్ని సూచిస్తుందని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ఈ వచనంలోని అతిశయోక్తితో కూడిన అపోకలిప్టిక్ తీర్పు దృశ్యాన్ని వివరణాత్మకంగా మృదువుచేయాలా?
  choice: రక్తం, గుర్రాల కళ్లెములు, స్టేడియాలు అనే స్పష్టమైన దృశ్యభాషను యథాతథంగా నిలుపడం.
  alternative: దీనిని ‘అపారమైన తీర్పు’ అని భావార్థంగా చెప్పడం.
  rationale: మూలపాఠం ఉద్దేశపూర్వకంగా ఘాటైన అపోకలిప్టిక్ చిత్రాన్ని ఇస్తుంది. దాని ప్రతీకాత్మక అర్థాన్ని అనువాదంలోనే నిర్ణయించకుండా, ఆ ఉద్రిక్తతను పాఠకునికి అందించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర శైలిని ఉపయోగించాం. మూలంలోని రెండు సమాంతర వాక్యాలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా ఉంచాం; అయితే దృశ్యంలోని తీవ్రతను తగ్గించలేదు.
