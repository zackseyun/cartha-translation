  terminology: ‘దూత,’ ‘మృగం,’ ‘ప్రతిమ,’ and ‘ఆరాధించు’ are appropriate in a formal modern Telugu biblical register. ‘గుర్తు’ accurately conveys χάραγμα without implying specifically a seal or stamp.
