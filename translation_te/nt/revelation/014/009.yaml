  - severity: low
    issue: Footnote b is anchored at ‘పొందితే,’ rather than at the possessive pronoun whose Greek form it explains.
    rationale: Moving the anchor to ‘తన’ makes the note’s referent clear and preserves the intended source-form annotation.
