  source_fidelity: The draft preserves the third angel, his following the preceding angels, the loud proclamation, worship of both the beast and its image, and receipt of the mark in either stated location. A small lexical and syntactic revision more directly represents the two coordinated Greek objects and χάραγμα as an identifying mark.
