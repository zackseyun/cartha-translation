id: REV.14.9
reference: Revelation 14:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: te
  text: 'మరొక దూత—మూడవవాడు—వారి వెంబడి వచ్చి, పెద్ద స్వరంతో ఇలా అన్నాడు: “ఎవరైనా మృగాన్నీ దాని ప్రతిమనూ ఆరాధించి[a], తన[b] నుదుటిపై గాని తన చేతిపై గాని ఒక గుర్తును పొందితే,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మృగానికీ దాని ప్రతిమకూ నమస్కరిస్తే.” గ్రీకు క్రియ నేలపై వంగడాన్ని సూచించగలదు; ఇక్కడ అది ఆరాధనతో కూడిన విధేయత భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా, “అతని నుదుటిపై లేదా అతని చేతిపై.” అక్కడి ఏకవచన పుంలింగ సర్వనామం “ఎవరైనా” అనే సాధారణ వ్యక్తిని సూచిస్తుంది.
    reason: source_form_note
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: మరొక దూత—మూడవవాడు—
  rationale: ἄλλος (‘మరొక’) మరియు τρίτος (‘మూడవవాడు’) రెండింటినీ ఉంచి, దర్శనంలో ఇతడు మరొక దూత మాత్రమే కాక వరుసలో మూడవవాడని స్పష్టం చేస్తుంది.
- source_word: ἠκολούθησεν αὐτοῖς
  choice: వారి వెంబడి వచ్చి
  rationale: దర్శనంలోని కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘వెంబడి’ మూలంలోని అనుసరణ భావాన్ని నిలుపుతుంది.
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: పెద్ద స్వరంతో ఇలా అన్నాడు
  rationale: ప్రకటన బహిరంగంగా, బలంగా వినిపించిందనే emphatic భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: Εἴ τις
  choice: ఎవరైనా
  rationale: అనిర్దిష్ట షరతును, హెచ్చరిక అందరికీ వర్తించగలదనే భావాన్ని నిలుపుతుంది.
- source_word: προσκυνεῖ
  choice: పూజ చేసి
  rationale: ఈ సందర్భంలో క్రియ కేవలం శరీరంతో వంగడాన్ని కాక మృగానికి చూపే ఆరాధనాత్మక విధేయతను సూచిస్తుంది.
- source_word: τὸ θηρίον
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ పాత్రకు స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: దాని ప్రతిమ
  rationale: εἰκώνను ‘ప్రతిమ’గా అనువదించడం ఆరాధనకు ఉద్దేశించిన ప్రతిరూప భావాన్ని అందిస్తుంది; ‘దాని’ అనేది θηρίονతో సహజంగా అనుసంధానమవుతుంది.
- source_word: λαμβάνει χάραγμα
  choice: ఒక ముద్రను పొందితే
  rationale: λαμβάνειను ‘పొందితే’గా ఇవ్వడం ఆ గుర్తును స్వీకరించడాన్ని సూచిస్తుంది; అనిర్దిష్ట χάραγμαకు ‘ఒక ముద్ర’ సహజంగా సరిపోతుంది.
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: తన నుదుటి మీద గాని తన చేతి మీద గాని
  rationale: రెండు స్థానాల ప్రత్యామ్నాయాన్ని స్పష్టంగా ఉంచుతుంది. తెలుగు ‘తన’ ఏ లింగానికైనా వర్తిస్తూ, ఏ వ్యక్తి గురించైతే షరతు ఉందో అదే వ్యక్తి అవయవాలని తెలియజేస్తుంది.
theological_decisions:
- issue: మృగం పట్ల προσκυνέω యొక్క మతపరమైన బలం
  choice: పూజ చేసి
  alternative: మృగం ఎదుట సాగిలపడి
  rationale: సందర్భం కేవలం భంగిమను కాక విగ్రహారాధనతో కూడిన విధేయతను సూచిస్తుంది. ‘పూజ’ ఆ గంభీరతను నిలుపుతుంది; ప్రత్యామ్నాయ శారీరక భావాన్ని పాదసూచికలో ఉంచాం.
- issue: τιςకు అనుసంధానమైన ఏకవచన αὐτοῦ
  choice: తన నుదుటి మీద గాని తన చేతి మీద గాని
  alternative: అతని నుదుటి మీద గాని అతని చేతి మీద గాని
  rationale: గ్రీకులో ఏకవచన పుంలింగ సర్వనామం సాధారణార్థంలో వాడబడింది. తెలుగులో ‘తన’ ఏకవచన సంబంధాన్ని కాపాడుతూ అనవసరంగా లింగాన్ని నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రకటన శైలిని ఉపయోగించాం. మూలవాక్యం తదుపరి వచనంలో పూర్తయ్యే షరతు వాక్యం కాబట్టి చివర కామాను అలాగే ఉంచాం. పాదసూచిక గుర్తులను అవి వివరించే పదబంధాల దగ్గర ఉంచాం.
