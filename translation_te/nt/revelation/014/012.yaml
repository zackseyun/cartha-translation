revisions:
- from: ఇక్కడే పవిత్రుల సహనం కనిపిస్తుంది—దేవుని ఆజ్ఞలను, యేసు విశ్వాసాన్ని[a] పాటించేవారి సహనం.
  to: ఇక్కడ దేవుని ఆజ్ఞలనూ యేసు విశ్వాసాన్నీ[a] పాటించేవారైన పరిశుద్ధుల సహనం ఉంది.
  rationale: The revision removes the added ‘appears’ sense, avoids repetition, and renders the Greek participial phrase naturally as ‘those saints who keep...’. It also uses the established Telugu biblical term ‘పరిశుద్ధులు.’ The ambiguous relationship in ‘the faith of Jesus’ remains intentionally unresolved in the main text and is documented in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:58:40Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the core terms, including the ambiguous genitive phrase ‘πίστιν Ἰησοῦ,’ and the footnote appropriately preserves its principal interpretations. However, ‘కనిపిస్తుంది’ introduces a nuance of becoming visible that is not expressed by Ὧδε ἐστίν, while the repeated ‘సహనం’ is unnecessary and weakens the Greek participial identification.
  naturalness: The proposed revision is smoother modern standard Telugu. It retains the rhetorical ‘here’ while expressing the participial phrase directly as an attributive description of the saints, without an unnatural repetition.
  terminology: ‘పరిశుద్ధులు’ is the more established Telugu biblical term for ἅγιοι. ‘సహనం,’ ‘ఆజ్ఞలు,’ and ‘పాటించేవారు’ are appropriate. The main-text expression ‘యేసు విశ్వాసం’ deliberately retains the Greek ambiguity; the footnote gives the interpretive alternatives without selecting one.
  issues:
  - severity: medium
    issue: ‘కనిపిస్తుంది’ adds a meaning not explicit in the Greek.
    rationale: Ὧδε ἡ ὑπομονὴ ... ἐστίν states ‘Here is/is found the endurance,’ rather than saying that it ‘appears’ or ‘becomes visible.’
  - severity: low
    issue: The draft repeats ‘సహనం’ after the dash.
    rationale: The repetition is not required to express the appositional participle οἱ τηροῦντες and makes the Telugu heavier than necessary.
  - severity: low
    issue: ‘పవిత్రులు’ is less idiomatic than the established biblical designation ‘పరిశుద్ధులు.’
    rationale: Both can convey ἅγιοι, but ‘పరిశుద్ధులు’ is the conventional and recognizable Telugu Scripture term for God’s holy people.
  revised_text: ఇక్కడ దేవుని ఆజ్ఞలనూ యేసు విశ్వాసాన్నీ[a] పాటించేవారైన పరిశుద్ధుల సహనం ఉంది.
  revised_footnotes:
