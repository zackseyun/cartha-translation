id: REV.14.12
reference: Revelation 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: te
  text: ఇక్కడ దేవుని ఆజ్ఞలనూ యేసు విశ్వాసాన్నీ[a] పాటించేవారైన పరిశుద్ధుల సహనం ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘యేసుపై విశ్వాసాన్ని’; మరో సాధ్యత: ‘యేసు విశ్వసనీయతను.’ గ్రీకు పదబంధానికి ఒకటి కంటే ఎక్కువ అర్థాలు సాధ్యమే.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: ఇక్కడే
  rationale: ముందు వివరించిన పరిస్థితిలో పవిత్రుల సహనం వెల్లడవుతుందనే సూచనాత్మక, అలంకారిక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὑπομονὴ
  choice: సహనం
  rationale: శ్రమల మధ్య స్థిరంగా నిలిచి కొనసాగడాన్ని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే సంక్షిప్త పదం.
- source_word: ἁγίων
  choice: పవిత్రులు
  rationale: దేవునికి ప్రత్యేకించబడిన ఆయన ప్రజలను సూచించే సహజమైన తెలుగు బైబిలు పదప్రయోగం.
- source_word: τηροῦντες
  choice: పాటించేవారు
  rationale: దేవుని ఆజ్ఞలకు విధేయులై వాటిని ఆచరించడమనే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐντολὰς
  choice: ఆజ్ఞలు
  rationale: దేవుడు ఇచ్చిన అధికారపూర్వక ఆదేశాలను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: మూలపదానికి సాధారణమైన అర్థాన్ని నిలుపుతూ, ఇక్కడి సంబంధవిభక్తి నిర్మాణంలోని సందిగ్ధతను పాదసూచికలో భద్రపరుస్తుంది.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: గ్రీకు సంబంధవిభక్తిని 'యేసు విశ్వాసం' అనే సమీప నిర్మాణంతో ప్రతిబింబిస్తుంది; దాని వివిధ అర్థసాధ్యతలను పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: τὴν πίστιν Ἰησοῦ యొక్క అర్థం
  choice: యేసు విశ్వాసం
  alternative: యేసుపై విశ్వాసం; లేదా యేసు విశ్వసనీయత
  rationale: πίστιν Ἰησοῦ అనేది యేసును లక్ష్యంగా చేసుకున్న విశ్వాసాన్నో, యేసుకు చెందిన విశ్వాసం/విశ్వసనీయతనో సూచించవచ్చు. ప్రధాన పాఠంలో గ్రీకు నిర్మాణానికి సమీపంగా ఉండి, నిజమైన అర్థసందిగ్ధతను పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిలో రూపొందించబడింది. గ్రీకులోని appositional నిర్మాణాన్ని తెలుగులో స్పష్టంగా, సహజంగా చూపేందుకు డాష్ మరియు పునరుక్తి ఉపయోగించబడ్డాయి.
