    text: 'లేదా, ‘యేసుపై విశ్వాసాన్ని’; మరో సాధ్యత: ‘యేసు విశ్వసనీయతను.’ గ్రీకు పదబంధానికి ఒకటి కంటే ఎక్కువ అర్థాలు సాధ్యమే.'
    reason: alternative_reading
  revision_rationale: The revision removes the added ‘appears’ sense, avoids repetition, and renders the Greek participial phrase naturally as ‘those saints who keep...’. It also uses the established Telugu biblical term ‘పరిశుద్ధులు.’ The ambiguous relationship in ‘the faith of Jesus’ remains intentionally unresolved in the main text and is documented in the footnote.
