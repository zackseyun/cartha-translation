id: REV.14.13
reference: Revelation 14:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: te
  text: 'ప్రకటన 14:13


    పరలోకం నుండి ఒక స్వరం ఇలా చెప్పడం నేను విన్నాను: “వ్రాయి: ఇకనుండి ప్రభువులో మరణించేవారు ధన్యులు.”


    “అవును,” అని ఆత్మ చెబుతోంది, “వారు తమ ప్రయాసల నుండి విశ్రాంతి పొందేలా[a]; ఎందుకంటే వారి క్రియలు వారితో పాటు వస్తాయి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు తమ ప్రయాసల నుండి విశ్రాంతి పొందుతారు.” గ్రీకు నిర్మాణంలో ఉద్దేశం లేదా ఫలితం అనే భావాలు ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “వారి క్రియలు వారిని అనుసరిస్తాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: పరలోకం నుండి ఒక స్వరం ఇలా చెప్పడం
  rationale: φωνήను సహజంగా ‘స్వరం’ అని, ἐκ τοῦ οὐρανοῦను ‘పరలోకం నుండి’ అని అనువదించాం; λεγούσηςలోని మాటల పరిచయ భావాన్ని ‘ఇలా చెప్పడం’ నిలుపుతుంది.
- source_word: Γράψον
  choice: ఇలా రాయి
  rationale: ఏకవచన ఆజ్ఞార్థక రూపం. తెలుగులో వెంట వచ్చే విషయాన్ని పరిచయం చేయడానికి ‘ఇలా’ సహజంగా ఉంటుంది; గ్రీకులో లేని నిర్దిష్ట విషయాన్ని అదనంగా వివరించదు.
- source_word: Μακάριοι
  choice: ధన్యులు
  rationale: ఆశీర్వచన శైలికి తగిన, గంభీరమైన మరియు సాధారణ బైబిలు పదం; కేవలం భావోద్వేగ సంతోషాన్ని సూచించేలా సంకుచితం చేయదు.
- source_word: οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: ప్రభువులో చనిపోయేవారు
  rationale: తెలుగులో ‘చనిపోయే మృతులు’ అనడం అసహజం. ఈ పదబంధం సూచించే వర్గాన్ని ‘చనిపోయేవారు’ సహజంగా తెలియజేస్తుంది; ἐν κυρίῳను వ్యాఖ్యానించకుండా ‘ప్రభువులో’గా నిలిపాం.
- source_word: ἀπ’ ἄρτι
  choice: ఇకనుండి
  rationale: ప్రస్తుత క్షణం మొదలుకొని అనే కాలార్థాన్ని సంక్షిప్తమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: “అవును,” అని ఆత్మ చెబుతోంది
  rationale: ναίలోని బలమైన సమ్మతిని ‘అవును’ తెలియజేస్తుంది; ఆత్మనే స్పష్టమైన వక్తగా నిలుపుతుంది.
- source_word: ἵνα ἀναπαήσονται
  choice: వారు ... విశ్రాంతి పొందేలా
  rationale: ἵναతో కూడిన అసాధారణ భవిష్యత్ రూపంలోని ఉద్దేశం/ఫలితం భావాన్ని ఒకదానికే పరిమితం చేయకుండా తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: తమ ప్రయాసల నుండి
  rationale: κόποςలోని శ్రమతో కూడిన కష్టం, అలసట భావాలను ‘ప్రయాసలు’ సముచితంగా తెలియజేస్తుంది.
- source_word: τὰ γὰρ ἔργα αὐτῶν
  choice: ఎందుకంటే వారి క్రియలు
  rationale: ἔργαను కార్యాచరణలు/చేసిన పనులు అనే విస్తృత భావంలో ‘క్రియలు’గా ఇచ్చాం; సంపాదించిన పుణ్యం వంటి అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
- source_word: ἀκολουθεῖ μετ’ αὐτῶν
  choice: వారితోపాటు వెళ్తాయి
  rationale: μετάలోని ‘వారితోపాటు’ భావాన్ని స్పష్టంగా నిలుపుతూ, తెలుగులో సహజమైన వాక్యాన్ని ఇస్తుంది; ‘అనుసరిస్తాయి’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: ‘ప్రభువులో’ అనే సంబంధం యొక్క పరిధి
  choice: ప్రభువులో
  alternative: ప్రభువుకు నమ్మకంగా ఉంటూ; ప్రభువుకు చెందినవారిగా
  rationale: ఐక్యత, చెందిన స్థితి, విశ్వాసపాత్రత వంటి సాధ్యమైన భావాలను ఒకే వ్యాఖ్యానానికి కుదించకుండా ἐν κυρίῳను సన్నిహితంగా అనువదించాం.
- issue: ἵνα ἀναπαήσονταιలో ఉద్దేశం లేదా ఫలితం
  choice: విశ్రాంతి పొందేలా
  alternative: విశ్రాంతి పొందుతారు; విశ్రాంతి పొందడానికి
  rationale: గ్రీకు నిర్మాణంలోని ఉద్దేశం/ఫలితం మధ్య ఉన్న ఉద్వేగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, మరింత ఫలితార్థకమైన పఠనాన్ని పాదసూచికలో సూచించాం.
- issue: క్రియలు మరియు ధన్యులైన మృతుల మధ్య సంబంధం
  choice: వారి క్రియలు వారితోపాటు వెళ్తాయి
  alternative: వారి క్రియలు వారిని అనుసరిస్తాయి
  rationale: వారి క్రియలు వారితో సంబంధంగా కొనసాగుతాయని మాత్రమే పాఠ్యం చెబుతుంది. అవి రక్షణను సంపాదిస్తాయని గానీ, కేవలం జ్ఞాపకంగా మిగులుతాయని గానీ అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రకటనాత్మక శైలిని వాడాం. ‘ధన్యులు,’ ‘ప్రభువులో,’ ‘ఆత్మ’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, పాతకాలపు విభక్తి రూపాలు మరియు అతిగా సంస్కృతీకృతమైన పదప్రయోగాన్ని నివారించాం.
