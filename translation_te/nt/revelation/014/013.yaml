revisions:
- from: 'ప్రకటన 14:13


    అప్పుడు పరలోకం నుండి ఒక స్వరం ఇలా చెప్పడం విన్నాను: “ఇలా రాయి: ఇకనుండి ప్రభువులో చనిపోయేవారు ధన్యులు.”


    “అవును,” అని ఆత్మ చెబుతోంది, “వారు తమ ప్రయాసల నుండి విశ్రాంతి పొందేలా[a]; ఎందుకంటే వారి క్రియలు వారితోపాటు వెళ్తాయి[b].”'
  to: 'ప్రకటన 14:13


    పరలోకం నుండి ఒక స్వరం ఇలా చెప్పడం నేను విన్నాను: “వ్రాయి: ఇకనుండి ప్రభువులో మరణించేవారు ధన్యులు.”


    “అవును,” అని ఆత్మ చెబుతోంది, “వారు తమ ప్రయాసల నుండి విశ్రాంతి పొందేలా[a]; ఎందుకంటే వారి క్రియలు వారితో పాటు వస్తాయి[b].”'
  rationale: The revision removes an unnecessary temporal addition, uses a more appropriate modern-standard term for death in this solemn setting, and renders the works as accompanying the dead in a way that better reflects both ἀκολουθεῖ and μετ’ αὐτῶν. The purpose/result ambiguity of ἵνα ἀναπαήσονται remains preserved in the main text and footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:58:41Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal sense well, including the temporal force of ἀπ’ ἄρτι, the unexpanded expression ‘in the Lord,’ the purpose/result nuance of ἵνα, and the accompanying sense of μετ’ αὐτῶν. However, ‘అప్పుడు’ adds a temporal specification not required by Καί, and ‘వారితోపాటు వెళ్తాయి’ weakens the specific ‘follow/accompany’ imagery of ἀκολουθεῖ.
  naturalness: The register is generally clear and appropriate. ‘మరణించేవారు’ is more dignified and suitable to this solemn context than ‘చనిపోయేవారు.’ ‘వారితో పాటు వస్తాయి’ is a more natural Telugu expression for deeds accompanying persons than ‘వెళ్తాయి.’
  terminology: ‘ధన్యులు,’ ‘ప్రభువులో,’ and ‘ఆత్మ’ are appropriate established biblical terms. ‘క్రియలు’ is retained, as it can represent ἔργα broadly without making an interpretive claim about merit.
  issues:
  - severity: low
    issue: Added temporal connective ‘అప్పుడు’
    rationale: Καί means ‘and’ here; ‘అప్పుడు’ (‘then’) adds a more explicit temporal sequence than the Greek states.
  - severity: medium
    issue: ‘వారితోపాటు వెళ్తాయి’ does not adequately retain ἀκολουθεῖ
    rationale: The Greek says that their works follow with/accompany them. ‘వస్తాయి’ with ‘వారితో పాటు’ better retains this image in idiomatic Telugu.
  - severity: low
    issue: ‘చనిపోయేవారు’ is less fitting in this solemn beatitude
    rationale: ‘మరణించేవారు’ is standard modern Telugu in elevated biblical register and better suits the context.
