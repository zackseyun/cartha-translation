id: REV.14.2
reference: Revelation 14:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: te
  text: పరలోకం నుండి ఒక శబ్దం[a] నాకు వినిపించింది. అది అనేక జలాల[b] ఘోషలా, గొప్ప ఉరుములా ఉంది. నేను విన్న ఆ శబ్దం, తమ హార్పులను[c] వాయిస్తున్న హార్పువాదకుల సంగీతంలా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్వరం’ అని కూడా అనువదించవచ్చు; గ్రీకు φωνή సందర్భాన్ని బట్టి ‘శబ్దం’ లేదా ‘స్వరం’ అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘అనేక జలాలు’ అనేది విస్తారమైన, అణచివేయలేని ఘోషను సూచించే బైబిలు ప్రతిమ; యెహెజ్కేలు 43:2 చూడండి.
    reason: cross_reference
  - marker: c
    text: గ్రీకు κιθάρα అనేది హార్పు కంటే లైర్‌కు దగ్గరగా ఉండే ప్రాచీన తీగ వాయిద్యం; సంప్రదాయంగా దీనిని ‘హార్పు’ అని అనువదిస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: శబ్దం
  rationale: ఈ వాక్యంలో ఈ పదం జలాలు, ఉరుము, వాయిద్య సంగీతం వంటి వినికిడి అనుభవాలతో పోల్చబడింది. అందువల్ల వ్యక్తి పలికే ‘స్వరం’ అని నిర్దిష్టం చేయకుండా ‘శబ్దం’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: ప్రకటన గ్రంథ సందర్భంలో οὐρανός కేవలం భౌతిక ఆకాశాన్ని కాక పరలోక లోకాన్ని సూచిస్తుంది.
- source_word: ὡς
  choice: లా
  rationale: మూలంలోని వరుస ఉపమానాలను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ὑδάτων πολλῶν
  choice: అనేక జలాల ఘోష
  rationale: ‘అనేక జలాలు’ అనే బైబిలు ప్రతిమను నిలుపుతూ, ఇక్కడ ఉద్దేశించిన వినికిడి పోలికను ‘ఘోష’ స్పష్టం చేస్తుంది.
- source_word: βροντῆς μεγάλης
  choice: పెద్ద ఉరుము ధ్వని
  rationale: μέγας ఇక్కడ ఉరుము తీవ్రతను సూచిస్తుంది; ఈ ఎంపిక మూల భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: κιθαρῳδῶν
  choice: వాద్యకారులు
  rationale: వెంటనే వచ్చే క్రియాపదం వారు తీగ వాయిద్యాలను వాయిస్తున్నారని స్పష్టం చేస్తుంది. నిర్దిష్ట ప్రాచీన వాయిద్యాన్ని ఆధునిక భారతీయ ‘వీణ’తో సమానం చేయకుండా ఈ పదం సహజంగా ఉంటుంది.
- source_word: κιθαριζόντων
  choice: వాయిస్తున్న
  rationale: వాయిద్యాన్ని వాయించే చర్యను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: తమ తీగ వాయిద్యాలను
  rationale: κιθάρα ఒక ప్రాచీన తీగ వాయిద్యం. ‘హార్పు’ లేదా ‘వీణ’ అనే ఆధునిక వాయిద్యంతో ఖచ్చితంగా సమీకరించకుండా వాయిద్య వర్గాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: పరలోక వినికిడి అనుభవ స్వభావం
  choice: φωνή పదాన్ని ‘శబ్దం’గా అనువదించడం
  alternative: ‘స్వరం’గా అనువదించడం లేదా సందర్భానుసారం ‘స్వరం’, ‘శబ్దం’ కలిపి వాడడం
  rationale: మూలవాక్యం దానిని మాట్లాడే వ్యక్తితో స్పష్టంగా అనుసంధానించకుండా జలాలు, ఉరుము, వాయిద్య సంగీతంతో పోలుస్తుంది. ‘శబ్దం’ ఆ అస్పష్టతను కాపాడి, వ్యక్తిగత వక్తను అనవసరంగా ఊహించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. వరుస ఉపమానాల శ్రవణ ప్రభావాన్ని నిలిపి, ప్రాచీన κιθάραను భారతీయ వీణతో తప్పుగా సమీకరించకుండా ‘తీగ వాయిద్యం’ అనే విస్తృత పదాన్ని ఎంచుకున్నాం.
