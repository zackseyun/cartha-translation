- from: పరలోకం నుండి ఒక శబ్దం[a] నాకు వినిపించింది. అది అనేక జలాల[b] ఘోషలా, పెద్ద ఉరుము ధ్వనిలా ఉంది. నేను విన్న ఆ శబ్దం, తమ తీగ వాయిద్యాలను[c] వాయిస్తున్న వాద్యకారుల సంగీతంలా ఉంది.
