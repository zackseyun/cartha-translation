  rationale: The revision retains the draft’s sound-based rendering of φωνή and its modern, reverent Telugu register. It replaces redundant wording for thunder and restores the source’s specific, repeated κιθάρα terminology through ‘హార్పులు’ and ‘హార్పువాదకులు.’ The footnote preserves the needed historical qualification without importing a modern Indian instrument or overstating exact equivalence.
