id: REV.14.17
reference: Revelation 14:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: te
  text: మరొక దేవదూత పరలోకంలోని ఆలయం[a] నుండి బయటికి వచ్చాడు. అతనికి కూడా పదునైన కొడవలి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకంలోని పవిత్రస్థలం.’ గ్రీకు పదమైన ναός మరింత నిర్దిష్టంగా ఆలయంలోని అంతరాలయాన్ని లేదా పవిత్రస్థలాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: మరొక దేవదూత
  rationale: ἄλλος ఇక్కడ దర్శనంలోని దేవదూతల వరుసలో ఇంకొకరిని సూచిస్తుంది; ఈ తెలుగు పదబంధం సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἐξῆλθεν
  choice: బయటికి వచ్చాడు
  rationale: ἐξέρχομαι లోపలి స్థలం నుండి బయటకు రావడాన్ని సూచిస్తుంది; ఆలయం నుండి జరిగిన కదలికను ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: ναοῦ
  choice: ఆలయం
  rationale: ναός ఆలయాన్ని, మరింత నిర్దిష్టంగా దాని అంతరాలయాన్ని లేదా పవిత్రస్థలాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సాధారణంగా అర్థమయ్యే ‘ఆలయం’ ఉంచి, మరింత నిర్దిష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: పరలోకంలోని
  rationale: ఈ విశేషణ పదబంధం ఆలయం పరలోకంలో ఉందని గుర్తిస్తుంది; ‘పరలోకంలోని’ సంక్షిప్తంగా, సహజంగా అదే సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἔχων καὶ αὐτὸς
  choice: అతని దగ్గర కూడా ... ఉంది
  rationale: καὶ αὐτός ఈ దేవదూతకు కూడా, ముందున్న వ్యక్తిలాగే, కొడవలి ఉందని నొక్కిచెబుతుంది. తెలుగు స్వతంత్ర వాక్య నిర్మాణం ఈ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: δρέπανον
  choice: కొడవలి
  rationale: δρέπανον పంట కోయడానికి ఉపయోగించే వంకర పదునైన పనిముట్టును సూచిస్తుంది; ‘కొడవలి’ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: ὀξύ
  choice: పదునైన
  rationale: ὀξύ కొడవలి పదును కలిగి ఉందని తెలిపి దర్శనంలోని సజీవ చిత్రణను నిలుపుతుంది.
theological_decisions:
- issue: పరలోక ఆలయ చిత్రణ స్వభావం
  choice: ναός ను ప్రధాన పాఠ్యంలో ‘ఆలయం’గా నేరుగా అనువదించడం
  alternative: ‘పవిత్రస్థలం’ లేదా ‘అంతరాలయం’ అని అనువదించడం; లేక దీనిని ప్రతీకాత్మక పరలోక నివాసంగా వివరణాత్మకంగా చెప్పడం
  rationale: ఈ వచనం పరలోక ఆలయాన్ని దర్శన చిత్రణగా అందిస్తుంది. అది నిర్మాణాత్మకమైనదా, ప్రతీకాత్మకమైనదా, ఆరాధనా సంబంధమైనదా అనే విషయాన్ని అనువాదం నిర్ణయించదు. ναός యొక్క మరింత నిర్దిష్ట భావాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు కృదంత నిర్మాణాన్ని తెలుగులో సహజమైన రెండవ వాక్యంగా మార్చినా, ‘కూడా’ ద్వారా καὶ αὐτός ఇచ్చే తులనాత్మక నొక్కును నిలిపాం.
