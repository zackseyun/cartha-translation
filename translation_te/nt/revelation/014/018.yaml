id: REV.14.18
reference: Revelation 14:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: te
  text: మరొక దేవదూత బలిపీఠం నుండి వచ్చాడు. అతనికి అగ్నిపై అధికారం ఉంది. అతడు పదునైన కొడవలి ఉన్నవానికి బిగ్గర స్వరంతో, “నీ పదునైన కొడవలిని పంపి[a], భూమి ద్రాక్షావల్లి[b] ద్రాక్షగుత్తులను కోసి సమకూర్చు; ఎందుకంటే దాని ద్రాక్షపండ్లు పండాయి” అని కేక వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ పదునైన కొడవలిని దించు.” గ్రీకు క్రియ అక్షరార్థంగా “పంపు”; అయితే కోత సందర్భంలో కొందరు దాన్ని సందర్భానుగుణంగా “దించు” అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: “భూమి ద్రాక్షావల్లి” అపోకలిప్టిక్ రూపకం. చుట్టుపక్కల సందర్భం తీర్పును గురించి ఉన్నప్పటికీ, ఇది ఎవరిని లేదా దేనిని సూచిస్తుందో ఈ వచనం స్పష్టంగా చెప్పదు.
    reason: cross_reference
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: మరొక దేవదూత
  rationale: దర్శనాత్మక సందర్భంలో ἄγγελος దేవదూతను సూచిస్తుంది; ἄλλος కథన క్రమంలోని ‘మరొక’ అనే భావాన్ని నిలుపుతుంది.
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: బలిపీఠం దగ్గరనుంచి
  rationale: θυσιαστήριονను ‘బలిపీఠం’గా అనువదించాం. గ్రీకు ἐκ మూలం లేదా వెలుపలికి రావడాన్ని సూచించినా, బలిపీఠం అంతర్భాగం నుంచి వచ్చినట్లు అనవసరంగా భావింపజేయకుండా ‘దగ్గరనుంచి’ సహజంగా ఉంది.
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: అతనికి అగ్నిమీద అధికారం ఉంది
  rationale: దేవదూతను వర్ణించే కర్తృవాచక కృదంతాన్ని సహజమైన తెలుగు స్వతంత్ర వాక్యంగా ఇచ్చాం; ἐξουσία భావాన్ని ‘అధికారం’ నిలుపుతుంది.
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: పెద్ద స్వరంతో ... కేక వేశాడు
  rationale: φωνῇ μεγάλῃలోని స్పష్టమైన ‘స్వరం’ అనే నామవాచకాన్ని ఉంచుతూ, ἐφώνησεν యొక్క బలమైన పిలుపును ‘కేక వేశాడు’గా సహజంగా తెలిపాం.
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: పదునైన కొడవలి పట్టుకున్నవానితో
  rationale: సంబోధింపబడిన వ్యక్తిని తెలిపే కృదంత నిర్మాణాన్ని సహజ తెలుగులో ఇచ్చాం; δρέπανονకు వ్యవసాయ కోత పనిముట్టును సూచించే ‘కొడవలి’ వాడాం.
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: నీ పదునైన కొడవలిని పంపి
  rationale: πέμπω యొక్క ప్రాథమిక ‘పంపు’ భావాన్ని నిలిపాం; కోత సందర్భంలో దీని జాతీయార్థక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: τρύγησον τοὺς βότρυας
  choice: గెలలను కోయి
  rationale: τρυγάω ద్రాక్షపంటను సమకూర్చడాన్ని సూచిస్తుంది; βότρυες ద్రాక్షగెలలు. తెలుగులో కోత చర్యను సహజంగా చెప్పేందుకు ‘గెలలను కోయి’ వాడాం.
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: భూమి ద్రాక్షావల్లి
  rationale: అపోకలిప్టిక్ రూపకాన్ని వ్యాఖ్యానించకుండా, రెండు నామపదాల సంబంధాన్ని సంక్షిప్తంగా నిలిపాం.
- source_word: ἤκμασαν αἱ σταφυλαὶ αὐτῆς
  choice: దాని ద్రాక్షపండ్లు పండాయి
  rationale: ἀκμάζω ఇక్కడ పరిపక్వతకు చేరడాన్ని సూచిస్తుంది. ‘పండాయి’ సహజ తెలుగు; ‘పూర్తిగా’ వంటి అదనపు తీవ్రతను చేర్చలేదు.
theological_decisions:
- issue: τῆς ἀμπέλου τῆς γῆςలోని అపోకలిప్టిక్ రూపకం
  choice: ‘భూమి ద్రాక్షావల్లి’ అని రూపకాన్నే నిలుపడం
  alternative: దానిని ‘భూమిలోని దుష్టులు’ లేదా మానవజాతిగా ప్రధాన పాఠ్యంలో స్పష్టీకరించడం
  rationale: చుట్టుపక్కల సందర్భం తీర్పును సూచించినా, ఈ వచనం దాని లక్ష్యాన్ని నేరుగా గుర్తించదు. అందువల్ల రూపకంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని దీర్ఘ కృదంత నిర్మాణాన్ని స్పష్టత కోసం చిన్న వాక్యాలుగా విభజించాం; ద్రాక్షతోట మరియు తీర్పు రూపకాలను వ్యాఖ్యానించకుండా నిలిపాం.
