- from: అప్పుడు నేను చూశాను. ఇదిగో, ఒక తెల్లని మేఘం! ఆ మేఘం మీద మనుష్య కుమారుని పోలిన ఒకరు[a] కూర్చుని ఉన్నారు. ఆయన తలపై బంగారు కిరీటం[b], చేతిలో పదునైన కొడవలి ఉన్నాయి.
  to: నేను చూశాను; ఇదిగో, ఒక తెల్లని మేఘం! ఆ మేఘంపై మనిషి కుమారుని పోలిన ఒక వ్యక్తి[a] కూర్చుని ఉన్నాడు. అతని తలపై బంగారు కిరీటం[b] ఉంది; అతని చేతిలో పదునైన కొడవలి ఉంది.
