id: REV.14.14
reference: Revelation 14:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: te
  text: నేను చూశాను; ఇదిగో, ఒక తెల్లని మేఘం! ఆ మేఘంపై మనిషి కుమారుని పోలిన ఒక వ్యక్తి[a] కూర్చుని ఉన్నాడు. అతని తలపై బంగారు కిరీటం[b] ఉంది; అతని చేతిలో పదునైన కొడవలి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మనుష్యకుమారుని పోలినవాడు’ అని కూడా అనువదించవచ్చు. ఈ పదబంధం దానియేలు 7:13ను ప్రతిధ్వనిస్తుంది; సాధారణంగా దీనిని మెస్సీయకు సంబంధించిన బిరుదుగా అర్థం చేసుకుంటారు. అయితే ఇక్కడ గ్రీకులో నిర్దిష్ట ఉపపదం లేదు; అక్షరార్థంగా ‘మనిషి కుమారుని పోలినవాడు’ అనే భావం ఉంది.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ ‘కిరీటం’కు వాడిన గ్రీకు పదం στέφανος (స్టెఫనోస్). ఇది రాజాధికారాన్ని సూచించే కిరీటం కంటే, తరచుగా విజేతకు పెట్టే విజయమాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: యోహాను దర్శన వర్ణనలో అకస్మాత్తుగా దృష్టిని ఆకర్షించే గ్రీకు పదం యొక్క సజీవమైన సూచనాత్మక బలాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: νεφέλη λευκή
  choice: ఒక తెల్లని మేఘం
  rationale: λευκή అనే పదం యొక్క ప్రత్యక్ష అర్థమైన ‘తెల్లని’ని నిలుపుతూ, ప్రకటన గ్రంథంలోని ప్రతీకాత్మక భావాన్ని ‘ప్రకాశవంతమైన’ అని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: ఆ మేఘం మీద ... కూర్చుని ఉన్నారు
  rationale: దర్శనంలోని కూర్చున్న స్థితిని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: మనుష్య కుమారుని పోలిన ఒకరు
  rationale: ὅμοιον యొక్క పోలిక భావాన్ని, అలాగే గ్రీకులో నిర్దిష్ట ఉపపదం లేని υἱὸν ἀνθρώπου నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది; దానిని ప్రధాన పాఠ్యంలోనే స్థిరమైన క్రీస్తు సంబంధ బిరుదుగా మరింత నిర్దిష్టం చేయదు.
- source_word: στέφανον χρυσοῦν
  choice: బంగారు కిరీటం
  rationale: సహజంగా అర్థమయ్యే తెలుగు పదబంధం; στέφανοςలో ఉండగల విజయమాల అనే ప్రత్యేక భావాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
- source_word: δρέπανον ὀξύ
  choice: పదునైన కొడవలి
  rationale: పంట కోత దృశ్యానికి సరిపోయే, సాధారణ పాఠకులకు స్పష్టమైన తెలుగు పదప్రయోగం.
theological_decisions:
- issue: υἱὸν ἀνθρώπουను స్పష్టమైన క్రీస్తు సంబంధ బిరుదుగా అనువదించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘మనుష్య కుమారుని పోలిన ఒకరు’
  alternative: ‘మనుష్యకుమారుని పోలిన ఒకరు’ లేదా ‘ఆ మనుష్యకుమారుని పోలిన ఒకరు’ అనే బిరుదాత్మక అవగాహన
  rationale: గ్రీకులో ఈ పదబంధానికి నిర్దిష్ట ఉపపదం లేదు. అయినప్పటికీ ఇది దానియేలు 7:13ను ప్రతిధ్వనిస్తుంది, సందర్భంలో సాధారణంగా మెస్సీయకు సంబంధించినదిగా అర్థం చేసుకుంటారు. అందువల్ల ఆ భావాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించకుండా పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దర్శన వర్ణనకు తగిన గంభీరతతో అనువదించబడింది. ‘ఇదిగో’ అనే పదం అపోకలిప్టిక్ దృశ్యంలోని ఆకస్మికతను నిలుపుతుంది. గ్రీకులోని వరుస καίలను తెలుగులో యాంత్రికంగా పునరావృతం చేయకుండా, చిన్న వాక్యాలు మరియు విరామచిహ్నాలతో సహజమైన ప్రవాహం కల్పించబడింది.
