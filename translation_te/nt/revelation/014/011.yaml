revisions:
- from: వారి యాతన పొగ యుగయుగాలూ పైకి లేస్తూనే ఉంటుంది[a]. ఆ మృగానికీ దాని ప్రతిమకూ పూజ చేసేవారికి రాత్రింబగళ్లు విశ్రాంతి ఉండదు; అలాగే, దాని పేరుకు చెందిన ముద్రను ఎవరైనా స్వీకరిస్తే[b].
  to: వారి యాతన యొక్క పొగ యుగయుగాల పాటు పైకి లేస్తూనే ఉంటుంది[a], మరియు వారికి రాత్రింబగళ్లు విశ్రాంతి ఉండదు—ఆ మృగాన్నీ దాని ప్రతిమనూ ఆరాధించేవారికి, మరియు దాని పేరుకు చెందిన ముద్రను ఎవరైనా స్వీకరిస్తే[b].
  rationale: సవరణ మూల వాక్యంలోని రెండు ప్రధాన సమన్వయ భాగాలను ఒకే వాక్యప్రవాహంలో ఉంచుతుంది. చివరి ఏకవచన, అనిర్దిష్ట షరతు గ్రీకులో ఉన్నట్లే అసంపూర్ణంగా ఉండేలా డాష్ తర్వాత నిలిపాం; దానిని పూర్తిస్థాయి సంబంధవాచక వాక్యంగా మార్చి వ్యాఖ్యానాత్మకంగా సమతలీకరించలేదు. పాదసూచిక ఆ నిర్మాణాన్ని, సాధ్యమైన సాఫీ అనువాదాన్ని స్పష్టంగా వివరిస్తుంది.
