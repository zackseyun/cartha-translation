id: REV.14.11
reference: Revelation 14:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: te
  text: వారి యాతన యొక్క పొగ యుగయుగాల పాటు పైకి లేస్తూనే ఉంటుంది[a], మరియు వారికి రాత్రింబగళ్లు విశ్రాంతి ఉండదు—ఆ మృగాన్నీ దాని ప్రతిమనూ ఆరాధించేవారికి, మరియు దాని పేరుకు చెందిన ముద్రను ఎవరైనా స్వీకరిస్తే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత పదశఃగా, “యుగాల యుగాల వరకు.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు వాక్యం “మరియు దాని పేరుకు చెందిన ముద్రను ఎవరైనా స్వీకరిస్తే” అని ఆకస్మికంగా ముగుస్తుంది. ఇది తీర్పుకు లోనయ్యేవారి వర్ణనను కొనసాగిస్తున్నట్లు కనిపిస్తుంది; కొన్ని అనువాదాలు దీనిని “ముద్రను స్వీకరించేవారికి కూడా విశ్రాంతి ఉండదు” అని సాఫీగా మారుస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς
  choice: పొగ
  rationale: దర్శనంలోని స్పష్టమైన దృశ్యరూపాన్ని విస్తరించకుండా నేరుగా తెలియజేస్తుంది.
- source_word: βασανισμοῦ
  choice: యాతన
  rationale: తీర్పు సందర్భంలోని బాధాకరమైన శిక్ష భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; బాధ కలిగించే విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: εἰς αἰῶνας αἰώνων
  choice: యుగయుగాలూ
  rationale: ప్రకటన గ్రంథంలోని ఈ బలమైన కాలవ్యాప్తి నుడికారానికి సహజమైన, గంభీరమైన తెలుగు రూపం; మరింత పదశః రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀναβαίνει
  choice: పైకి లేస్తూనే ఉంటుంది
  rationale: వర్తమానకాలంలోని కొనసాగుతున్న దృశ్యాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ἀνάπαυσιν
  choice: విశ్రాంతి
  rationale: మూలపదానికి నేరమైన సమానార్థకం; ‘ఉపశమనం’ వంటి వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: ἡμέρας καὶ νυκτός
  choice: రాత్రింబగళ్లు
  rationale: నిరంతర కాలాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు నుడికారం.
- source_word: προσκυνοῦντες
  choice: పూజ చేసేవారు
  rationale: ఈ సందర్భంలో మృగానికి చూపే ఆరాధనాత్మక విధేయతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: θηρίον
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలోని స్థిరమైన అపోకలిప్టిక్ ప్రతీకకు సరైన, ప్రామాణిక తెలుగు పదం.
- source_word: εἰκόνα
  choice: ప్రతిమ
  rationale: ఆరాధనకు సంబంధించిన సందర్భంలో ‘image’ భావాన్ని సహజంగా తెలియజేస్తూ, కేవలం చిత్రమనే అర్థానికి పరిమితం చేయదు.
- source_word: εἴ τις λαμβάνει
  choice: ఎవరైనా స్వీకరిస్తే
  rationale: గ్రీకులోని ఏకవచన అనిర్దిష్ట షరతును, దాని ఆకస్మిక వాక్యనిర్మాణ మార్పును సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: χάραγμα
  choice: ముద్ర
  rationale: ప్రకటన గ్రంథంలో గుర్తింపు చిహ్నాన్ని సూచించే విస్తృతమైన, స్థిరమైన పదం.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: దాని పేరుకు చెందిన
  rationale: సంబంధవాచక గ్రీకు నిర్మాణాన్ని అతిగా వివరించకుండా తెలుగులో అర్థమయ్యేలా అందిస్తుంది.
theological_decisions:
- issue: εἰς αἰῶνας αἰώνων తెలిపే తీర్పు కాలవ్యాప్తి
  choice: యుగయుగాలూ
  alternative: యుగాల యుగాల వరకు
  rationale: ఈ ప్రకటన గ్రంథ నుడికారం అత్యంత బలమైన నిరంతర కాలవ్యాప్తిని వ్యక్తం చేస్తుంది. అనువాదం దాని బలాన్ని తగ్గించదు; అదే సమయంలో పదశః రూపాన్ని పాదసూచికలో చూపి మూలంలోని రూపాన్ని దాచదు.
- issue: చివరి షరతు వాక్యభాగం యొక్క సంబంధం మరియు ఆకస్మికత
  choice: ‘అలాగే, ... ఎవరైనా స్వీకరిస్తే’ అని అసంపూర్ణంగా వినిపించే నిర్మాణాన్ని నిలిపాం
  alternative: ‘ముద్రను స్వీకరించేవారికి కూడా విశ్రాంతి ఉండదు’ అని పూర్తిగా సవరించడం
  rationale: గ్రీకు బహువచన కృదంత వర్ణన నుంచి ఏకవచన అనిర్దిష్ట షరతుకు ఆకస్మికంగా మారుతుంది. దాన్ని పూర్తిగా సమతలీకరించడం చివరి భాగం ముందున్న సమూహంతో ఎలా సంబంధించిందో అనవసరంగా నిర్ణయిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే గంభీర శైలిని వాడాం. ‘యాతన,’ ‘మృగం,’ ‘ప్రతిమ,’ ‘ముద్ర’ వంటి ప్రకటన గ్రంథానికి తగిన స్థిర పదాలను ఎంచుకున్నాం. చివరి గ్రీకు వాక్యభాగంలోని ఉద్దేశపూర్వకంగా కనిపించే వాక్యనిర్మాణ ఆకస్మికతను ప్రధాన పాఠ్యంలో నిలిపి, పాదసూచికలో వివరించాం.
