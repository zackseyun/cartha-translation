id: REV.14.4
reference: Revelation 14:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: te
  text: వీరు స్త్రీలతో అపవిత్రం కాలేదు[a], ఎందుకంటే వీరు కన్యత్వం కలిగినవారు. గొర్రెపిల్ల ఎక్కడికి వెళ్లినా దానిని అనుసరించేవారు వీరే. వీరు దేవునికీ గొర్రెపిల్లకూ ప్రథమఫలాలుగా మానవుల మధ్య నుండి కొనబడినవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఇది కేవలం లైంగిక సంయమనం గురించిన అక్షరార్థపు ప్రకటన కాకుండా, ఆధ్యాత్మిక పవిత్రతను లేదా విగ్రహారాధనవల్ల కలిగే అపవిత్రత నుండి విముక్తిని సూచించే దృశ్యభాష కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘మానవజాతి మధ్య నుండి’ లేదా ‘ప్రజల మధ్య నుండి’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం పురుషులను మాత్రమే కాక, సాధారణంగా మానవులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: తమను అపవిత్రం చేసుకోనివారు
  rationale: గ్రీకు క్రియ వ్యాకరణపరంగా కర్మణి రూపంలో ఉన్నా, సందర్భంలో వారి స్థితిని సహజమైన తెలుగులో వ్యక్తపరచడానికి ఆత్మార్థక నిర్మాణం వాడబడింది; నైతిక లేదా ఆచారసంబంధ అపవిత్రత భావం నిలిచింది.
- source_word: μετὰ γυναικῶν
  choice: స్త్రీలతో
  rationale: μετά + షష్ఠీ విభక్తి సాధారణంగా ‘తో’ అనే అర్థం ఇస్తుంది. γυναικῶν ఇక్కడ ‘భార్యలతో’ అని పరిమితం చేయకుండా ‘స్త్రీలతో’ అని అనువదించడం మూలంలోని విస్తృత సూచనను కాపాడుతుంది.
- source_word: παρθένοι
  choice: కన్యలు
  rationale: παρθένοι యొక్క ప్రత్యక్ష అర్థాన్ని నిలిపి, దానిని కేవలం ‘పవిత్రులు’ లేదా ‘బ్రహ్మచారులు’ అనే వ్యాఖ్యానాత్మక పదంగా మార్చలేదు. తెలుగులో ‘కన్యలు’ సాధారణంగా స్త్రీలను సూచించినప్పటికీ, ఇక్కడ మూలంలోని రూపకాత్మక ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- source_word: ἀκολουθοῦντες
  choice: వెంబడించేవారు
  rationale: వర్తమాన అసమాపక క్రియ సూచించే నిరంతర, లక్షణాత్మక అనుసరణను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀρνίῳ
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలోని క్రీస్తుసంబంధ బిరుదు మరియు బలిసంబంధ దృశ్యాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: ὅπου ἂν ὑπάγῃ
  choice: ఎక్కడికి వెళ్లినా
  rationale: ὅπου ἄν + విధ్యర్థక రూపం వ్యక్తపరచే అనిర్దిష్ట ‘ఎక్కడికైనా/ఎక్కడికి వెళ్లినా’ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἠγοράσθησαν
  choice: కొనబడినవారు
  rationale: ἀγοράζω యొక్క కొనుగోలు రూపకాన్ని నేరుగా నిలుపుతుంది; ప్రధాన పాఠ్యంలో మరింత వ్యాఖ్యానాత్మకమైన ‘విమోచించబడినవారు’ అనే పదాన్ని చేర్చదు.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: మానవులలో నుండి
  rationale: ἄνθρωποι ఇక్కడ పురుషులకు మాత్రమే కాక సమస్త మానవులను సూచిస్తుంది; ‘మానవులు’ లింగ-సమగ్ర అర్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: ἀπαρχὴ
  choice: ప్రథమఫలం
  rationale: దేవునికి అర్పించే తొలి పంటభాగం అనే ఆచారసంబంధ, పంటసంబంధ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: స్త్రీలతో అపవిత్రం కాలేదు / కన్యలు అనే వర్ణనను అక్షరార్థంగా అనువదించాలా, ఆధ్యాత్మిక పవిత్రతగా వ్యాఖ్యానించాలా
  choice: ప్రధాన పాఠ్యంలో మూలంలోని స్పష్టమైన దృశ్యభాషను అక్షరరూపంలో నిలిపాం.
  alternative: ఇది విగ్రహారాధన కలుషితం నుండి విముక్తి లేదా ఆధ్యాత్మిక పవిత్రతకు ప్రతీక కావచ్చు.
  rationale: ప్రకటనలో ప్రతీకాత్మక దృశ్యాలు ఉన్నప్పటికీ, అనువాదం వ్యాఖ్యానాన్ని తేల్చకుండా మూలంలోని స్పష్టమైన పదప్రయోగాన్ని కాపాడాలి; ప్రతీకాత్మక అవకాశాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: ‘కన్యలు’ అనే పదం పురుష సమూహానికి వర్తించే అసాధారణత
  choice: మూలంలోని παρθένοι కి సమీపమైన ‘కన్యలు’ అనే పదాన్ని నిలిపాం.
  alternative: ‘బ్రహ్మచారులు’ లేదా ‘లైంగిక సంబంధం లేనివారు’ అని భావవ్యాఖ్యానంతో అనువదించడం.
  rationale: ప్రత్యామ్నాయాలు లింగం లేదా జీవనస్థితి గురించి మూలం కంటే ఎక్కువగా నిర్ణయిస్తాయి. అసాధారణమైన రూపకాన్ని సున్నితపరచకుండా నిలపడం మంచిది.
- issue: ‘కొనబడినవారు’ అనే రూపకం
  choice: వాణిజ్య రూపకాన్ని ‘కొనబడినవారు’గా ఉంచాం.
  alternative: ‘విమోచించబడినవారు’.
  rationale: ‘విమోచించబడినవారు’ సరైన ధార్మిక భావాన్ని సూచించగలిగినా, ἠγοράσθησαν యొక్క ప్రత్యక్ష కొనుగోలు రూపకాన్ని ముందుగానే వ్యాఖ్యానిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ప్రకటన గ్రంథానికి ప్రత్యేకమైన ‘గొర్రెపిల్ల’, ‘ప్రథమఫలం’, ‘కొనబడినవారు’ అనే రూపకాలను వ్యాఖ్యానాత్మకంగా సులభీకరించకుండా నిలిపాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
