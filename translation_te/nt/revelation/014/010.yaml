id: REV.14.10
reference: Revelation 14:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: te
  text: అతడు కూడా దేవుని ఉగ్రత అనే ద్రాక్షారసంలోనుంచి తాగుతాడు. అది ఆయన కోపపు పాత్రలో కలిపి, పలుచన చేయకుండా సిద్ధం చేయబడింది.[a] అతడు పరిశుద్ధ దూతల సమక్షంలోనూ గొర్రెపిల్ల సమక్షంలోనూ అగ్నితోనూ గంధకంతోనూ[b] యాతనకు గురవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: ‘కలిపిన, పలుచన చేయనిది.’ గ్రీకు పదబంధం సిద్ధం చేసిన లేదా కలిపిన ద్రాక్షారసం అనే భావాన్నీ, నీళ్లు కలిపి బలహీనపరచకుండా పూర్తి బలంతో ఉన్నదనే భావాన్నీ కలిపి చెబుతుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'సాంప్రదాయ అనువాదాల్లో: ‘అగ్నితోనూ గంధకపు మంటతోనూ’ లేదా ‘అగ్ని గంధకాలతోనూ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: అతడు కూడా
  rationale: మునుపటి వచనంలో పేర్కొన్న వ్యక్తిని నొక్కి సూచిస్తూ, καί యొక్క చేర్పు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: ద్రాక్షారసంలోనుంచి తాగుతాడు
  rationale: భవిష్యత్ క్రియను స్పష్టంగా ఉంచి, ἐκ సూచించే మూలం లేదా పాత్రనుంచి తాగే చిత్రాన్ని నిలుపుతుంది.
- source_word: θυμοῦ τοῦ θεοῦ
  choice: దేవుని ఉగ్రత
  rationale: తీర్పు సందర్భంలోని తీవ్రమైన దైవిక ఆగ్రహాన్ని ‘ఉగ్రత’ తెలియజేస్తుంది; ఇదే వాక్యంలో వచ్చే ὀργή నుంచి పదభేదాన్ని కూడా కాపాడుతుంది.
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: నీళ్లు కలపకుండా సిద్ధం చేయబడింది
  rationale: κεράννυμι లోని సిద్ధం చేయడం/కలపడం భావాన్నీ, ἄκρατος లోని పలుచన చేయని పూర్తి బలాన్నీ ఆధునిక తెలుగులో విరోధాభాసం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ
  choice: ఆయన కోపపు పాత్రలో
  rationale: ἐν యొక్క స్థానార్థాన్నీ, దేవుని కోపానికి సంబంధించిన పాత్ర అనే రూపకాన్నీ నేరుగా నిలుపుతుంది.
- source_word: βασανισθήσεται
  choice: యాతనకు గురవుతాడు
  rationale: తీవ్రమైన శిక్షాత్మక బాధను సూచించే భవిష్యత్ కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: అగ్నితోనూ గంధకంతోనూ
  rationale: తీర్పు సాధనాలను స్పష్టంగా చూపుతుంది; θείον కు ఆధునికంగా అర్థమయ్యే ఖచ్చితమైన పదం ‘గంధకం’.
- source_word: ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου
  choice: పరిశుద్ధ దూతల సమక్షంలోనూ గొర్రెపిల్ల సమక్షంలోనూ
  rationale: ἐνώπιον యొక్క ‘ఎదుట/సన్నిధిలో’ భావాన్ని ‘సమక్షంలో’ సహజంగా అందిస్తూ, గ్రీకులోని పునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: θυμός మరియు ὀργή మధ్య పదభేదం
  choice: θυμός ను ‘ఉగ్రత’గా, ὀργή ను ‘కోపం’గా అనువదించడం
  alternative: రెండింటినీ ‘కోపం’ లేదా ‘ఉగ్రత’గా అనువదించడం
  rationale: మూలపాఠం దగ్గరదగ్గరగా రెండు సంబంధితమైనా వేర్వేరు పదాలను వాడుతుంది. తెలుగు పదభేదం ఆ అలంకార బలాన్ని నిలుపుతుంది; వాటి మధ్య అతిగా కఠినమైన సిద్ధాంత భేదాన్ని మాత్రం విధించదు.
- issue: τοῦ κεκερασμένου ἀκράτου లోని ఉద్రిక్తమైన పదజోడు
  choice: ‘నీళ్లు కలపకుండా సిద్ధం చేయబడింది’ అని ప్రధాన పాఠంలో ఇవ్వడం
  alternative: ‘కలపబడినా కల్తీ చేయనిది’ లేదా ‘కలిపిన, పలుచన చేయని’ అని మరింత అక్షరార్థంగా ఇవ్వడం
  rationale: ప్రాచీన ద్రాక్షారస సిద్ధీకరణ నేపథ్యంలోని ‘సిద్ధం/కలపడం’ మరియు ‘పలుచన చేయకపోవడం’ అనే రెండు భావాలను కాపాడుతూ, తీర్పు ఏమాత్రం తగ్గించబడలేదనే బలాన్ని చదవదగిన తెలుగులో తెలియజేస్తుంది. అక్షరార్థ ఉద్రిక్తతను పాదటిప్పణి నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ప్రకటన గ్రంథంలోని గంభీరమైన తీర్పు స్వరాన్ని నిలుపుతూ రూపొందించబడింది. ‘గొర్రెపిల్ల’, ‘పరిశుద్ధ దూతలు’, ‘కోపపు పాత్ర’ వంటి స్థిరమైన బైబిలు రూపకాలను కాపాడింది.
