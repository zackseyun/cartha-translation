id: REV.14.8
reference: Revelation 14:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: te
  text: 'ఆ తరువాత మరొక దూత, రెండవ దూత, వచ్చి ఇలా అన్నాడు: “మహా బబులోను కూలిపోయింది, కూలిపోయింది! తన లైంగిక అవినీతి[c] యొక్క ఉగ్రావేశపు ద్రాక్షారసాన్ని[a] అన్ని జనాలకు తాగించింది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన లైంగిక అవినీతి యొక్క తీవ్రమైన వాంఛగల ద్రాక్షారసాన్ని” లేదా “తన లైంగిక అవినీతి యొక్క ఉగ్రతగల ద్రాక్షారసాన్ని.” గ్రీకు θυμός అనే పదానికి తీవ్రమైన వాంఛ, ఉగ్రత, లేదా కోపం అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అన్ని జనాలకు తాగించింది.” దీని భావాన్ని “అన్ని జనాలను మత్తెక్కించింది” అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: బబులోను ‘లైంగిక అవినీతి’ అనే చిత్రం అవినీతికరమైన, విగ్రహారాధనతో కూడిన, అవిశ్వాసపూరిత ప్రభావాన్ని రూపకంగా సూచించవచ్చు; అయితే పాఠ్యం దానిని వీటిలో ఒక్కదానికే పరిమితం చేయదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: మరొక దూత, అంటే రెండవ దూత
  rationale: ἄλλος (‘మరొక’) మరియు δεύτερος (‘రెండవ’) అనే రెండు పదాలనూ ఉంచుతూ, తెలుగు వాక్యప్రవాహం సహజంగా ఉండేందుకు వివరణాత్మక అన్వయాన్ని వాడింది.
- source_word: ἠκολούθησεν λέγων
  choice: వెంబడిస్తూ ఇలా అన్నాడు
  rationale: దర్శనంలోని వరుసను సూచించే ἠκολούθησεν భావాన్నీ, λέγων అనే కృదంత సంబంధాన్నీ సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: కూలిపోయింది, కూలిపోయింది
  rationale: రెండుసార్లు పలికిన భూతకాల ప్రకటనలోని ప్రవచనాత్మక నిశ్చయాన్నీ, వాక్చాతుర్య బలాన్నీ నిలుపుతుంది.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: మహా బబులోను
  rationale: పేరును లిప్యంతరీకరించి, ἡ μεγάλη ఇచ్చే బిరుదు వంటి భావాన్ని సంక్షిప్తమైన ప్రామాణిక తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: ἣ
  choice: తన
  rationale: స్త్రీలింగ సంబంధ సర్వనామం బబులోనును నగరం/స్త్రీగా వ్యక్తీకరిస్తుంది; తెలుగులో ‘తన’ ఆ సంబంధాన్ని సహజంగా కొనసాగిస్తుంది.
- source_word: ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς
  choice: తన లైంగిక అవినీతి అనే తీవ్రమైన వాంఛతో కూడిన ద్రాక్షారసాన్ని
  rationale: οἶνος చిత్రాన్ని నిలుపుతూ, θυμόςలోని తీవ్ర ఆవేశం/వాంఛ మరియు ఉగ్రత మధ్య సందిగ్ధతను ప్రధాన పాఠ్యంలో ‘తీవ్రమైన వాంఛ’గా, పాదటిప్పణిలో ప్రత్యామ్నాయంగా చూపుతుంది.
- source_word: πεπότικεν πάντα τὰ ἔθνη
  choice: అన్ని జనాలకు తాగించింది
  rationale: ποτίζω యొక్క causative భావాన్నీ, perfect రూపంలోని పూర్తయి ప్రభావం కొనసాగుతున్న చర్యనూ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బబులోను πορνεία యొక్క రూపకాల భావం
  choice: ప్రధాన పాఠ్యంలో ‘లైంగిక అవినీతి’ అనే చిత్రాత్మక పదబంధాన్ని ఉంచడం
  alternative: విగ్రహారాధన / ఆధ్యాత్మిక వ్యభిచారం / రాజకీయ అవిశ్వాసం
  rationale: ఈ సందర్భంలో రూపకం అవినీతికరమైన, విగ్రహారాధనతో కూడిన లేదా అవిశ్వాసపూరిత ప్రభావాన్ని సూచించవచ్చు; అయితే వాక్యం దానిని ఒక్క అర్థానికే పరిమితం చేయదు.
- issue: θυμός అర్థం
  choice: ‘తీవ్రమైన వాంఛ’
  alternative: ‘ఉగ్రత’ లేదా ‘కోపం’
  rationale: ఈ పదం ఇక్కడ πορνείαతో వ్యాకరణపరంగా ముడిపడి ఉండటంతో మండే వాంఛను సూచించవచ్చు; అదే సమయంలో ఉగ్రత/కోపం అనే తీర్పు ఛాయను కూడా కలిగి ఉంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా సందిగ్ధతను కాపాడింది.
- issue: బబులోను వ్యక్తీకరణ
  choice: స్త్రీ/నగర వ్యక్తీకరణను ‘తన’ ద్వారా కొనసాగించడం
  alternative: వ్యక్తీకరణను తొలగించి కేవలం నగరంగా పేర్కొనడం
  rationale: గ్రీకు స్త్రీలింగ సంబంధ సర్వనామం బబులోనును వ్యక్తిగా చిత్రిస్తుంది; దాన్ని పూర్తిగా సమతలీకరించకుండా తెలుగులో సహజంగా ప్రతిబింబించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటన శైలిని వాడింది. ‘కూలిపోయింది’ అనే పునరుక్తిని అలాగే ఉంచి ప్రవచనాత్మక బలాన్ని నిలిపింది. ‘లైంగిక అవినీతి’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి, రూపక విస్తృతిని అనవసరంగా సంకుచితం చేయదు.
