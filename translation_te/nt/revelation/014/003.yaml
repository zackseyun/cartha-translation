id: REV.14.3
reference: Revelation 14:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: te
  text: వారు సింహాసనం ఎదుట, నాలుగు జీవుల ఎదుట, పెద్దల ఎదుట కొత్త పాటలా ఉన్న ఒక పాటను[a] పాడుతున్నారు. భూమి నుండి కొనబడిన[b] ఆ లక్ష నలభై నాలుగు వేల మంది తప్ప మరెవరూ ఆ పాటను నేర్చుకోలేకపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొత్త పాటగా’ / ‘కొత్త పాటలా.’ ఇక్కడ గ్రీకు పదం ప్రకటన గ్రంథపు దర్శన వర్ణనల్లో కనిపించే పోలిక లేదా కనిపించిన విధానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘విమోచించబడిన.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘కొనబడిన’ లేదా ‘కొనుగోలు చేయబడిన’ అని అర్థం.
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: పాడుతున్నారు
  rationale: వర్తమాన సూచనార్థక బహువచన క్రియను, ప్రకటన గ్రంథపు దర్శన వర్ణనలోని సజీవ వర్తమాన భావాన్ని సహజమైన తెలుగు వర్తమాన ప్రగతిశీల రూపంలో నిలిపాం.
- source_word: ὡς ᾠδὴν καινὴν
  choice: కొత్త పాటగా అనిపించిన పాటను
  rationale: ὡς సూచించే దర్శనానుభూతి లేదా పోలిక భావాన్ని నేరుగా గుర్తింపుగా మార్చకుండా నిలిపి, καινή యొక్క ‘కొత్త’ భావాన్ని యథాతథంగా ఉంచాం.
- source_word: ἐνώπιον
  choice: ఎదుట
  rationale: సింహాసనం మరియు పరలోక సమూహాల సమక్షంలో ఉండే స్థలసంబంధ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: τῶν τεσσάρων ζῴων
  choice: నాలుగు జీవులు
  rationale: ప్రకటన గ్రంథంలో సింహాసనం చుట్టూ ఉన్న పరలోక జీవులను సూచిస్తుంది; ‘జంతువులు’ అనే తప్పుదారి పట్టించే భావాన్ని నివారిస్తుంది.
- source_word: τῶν πρεσβυτέρων
  choice: పెద్దలు
  rationale: పరలోక సభలోని గుర్తించదగిన సమూహానికి సహజమైన, సంప్రదాయబద్ధమైన తెలుగు పదం.
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: మరెవరూ ... నేర్చుకోలేకపోయారు
  rationale: నేర్చుకునే సామర్థ్యం ఎవరికీ లేదనే గ్రీకు అపూర్ణ భూతకాల భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: ఆ లక్ష నలభై నాలుగు వేల మంది
  rationale: 144,000 అనే సంఖ్యను సాహిత్య గౌరవం, పఠన సౌలభ్యం కోసం అక్షరాల్లో ఇచ్చి, గ్రీకు నిర్దిష్ట ఉపపద భావాన్ని ‘ఆ’తో నిలిపాం.
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: భూమి నుండి కొనబడిన
  rationale: ἀγοράζωలోని కొనుగోలు రూపకాన్ని ప్రధాన పాఠ్యంలో నేరుగా నిలిపాం; ‘విమోచించబడిన’ అనే వ్యాఖ్యానాత్మక ధార్మిక పదాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: దర్శన వర్ణనలో ὡς యొక్క భావం
  choice: ‘కొత్త పాటగా అనిపించిన’ అనే దర్శనానుభూతి సూచన
  alternative: ‘కొత్త పాటగా’ లేదా ‘కొత్త పాటలా’
  rationale: ఇది నిజంగా కొత్త పాట కాదని వాక్యం తేల్చదు; దర్శనంలో గ్రహించిన విధానాన్ని ὡς సూచించవచ్చు. అందువల్ల పాట స్వరూపాన్ని సిద్ధాంతపరంగా నిర్ణయించకుండా అస్పష్టతను నిలిపాం.
- issue: ἠγορασμένοι పదంలోని కొనుగోలు రూపకం
  choice: కొనబడిన
  alternative: విమోచించబడిన
  rationale: గ్రీకు క్రియ యొక్క ప్రత్యక్ష పదార్థం కొనడం. ‘విమోచించబడిన’ అనేది సందర్భానుకూల ధార్మిక వివరణ అయినప్పటికీ, మూలంలోని మార్కెట్ రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే దర్శన వర్ణనకు తగిన గౌరవప్రదమైన శైలిలో ఉంది. గ్రీకు వాక్యంలోని పునరుక్త ‘ఎదుట’ నిర్మాణాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
