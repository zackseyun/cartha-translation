  edition: SBLGNT
  text: καὶ ⸂ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη⸃ ψεῦδος· ⸀ἄμωμοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/005.yaml
  text: And in their mouth no lie was found[a]; they are blameless.
translation:
  language: te
  text: వారి నోటిలో ఏ అబద్ధమూ కనబడలేదు; వారు నిందలేనివారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మచ్చలేనివారు” లేదా “నిర్దోషులు.” గ్రీకు పదం నైతికంగా నిందలేని స్థితితో పాటు, బలికి తగిన మచ్చలేని పవిత్రత భావాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: వారి నోటిలో
  rationale: στόματι ఏకవచనంలో ఉన్నప్పటికీ αὐτῶνతో సమూహార్థం ఇస్తుంది. ‘వారి నోటిలో’ అనే దగ్గరి అనువాదం వారి మాటల్లో అబద్ధం లేదనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὐχ εὑρέθη
  choice: కనబడలేదు
  rationale: గ్రీకు భూతకాల కర్మణి రూపాన్ని తెలుగులో సహజమైన కర్మణి భావంతో నిలుపుతూ, అబద్ధం పూర్తిగా లేకపోవడంపై ఉన్న ఉద్ఘాటనను కాపాడుతుంది.
- source_word: ψεῦδος
  choice: ఏ అబద్ధమూ
  rationale: ‘అబద్ధం’ ψεῦδοςకు నేరుగా, సాధారణ పాఠకులకు స్పష్టంగా సరిపోతుంది. నిషేధ వాక్యంలో ‘ఏ…మూ’ ప్రయోగం తెలుగులో సంపూర్ణ లేమిని సహజంగా తెలియజేస్తుంది.
- source_word: ἄμωμοί
  choice: నిందలేనివారు
  rationale: ఈ పదం నైతికంగా నిందారహితంగా ఉండడాన్నీ, బలి సంబంధమైన మచ్చలేని స్థితినీ సూచించగలదు. ప్రధాన పాఠంలో ‘నిందలేనివారు’ నైతిక భావాన్ని స్పష్టంగా ఇస్తుంది; ఇతర ఛాయలను పాదసూచికలో ఉంచాం.
- source_word: καὶ
  choice: —
  rationale: ఈ వచనం ముందున్న వర్ణనను కొనసాగిస్తున్నప్పటికీ, తెలుగులో వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా కొనసాగింపు సహజంగానే అర్థమవుతుంది.
theological_decisions:
- issue: ἄμωμοί అనే పదంలోని నైతిక నిందారాహిత్యం మరియు బలి-పవిత్రత ఛాయలను అతిశయించకుండా నిలుపడం
  choice: నిందలేనివారు
  alternative: మచ్చలేనివారు; నిర్దోషులు
  rationale: ‘నిందలేనివారు’ నైతిక సమగ్రతను తెలియజేస్తుంది; సంపూర్ణ పాపరాహిత్యం అనే సిద్ధాంతార్థాన్ని అనవసరంగా రుద్దదు. ‘మచ్చలేనివారు’ అనే ప్రత్యామ్నాయం బలి-పవిత్రత రూపకాన్ని మరింత స్పష్టంగా ఉంచుతుంది కాబట్టి దాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్య నిర్మాణానికి దగ్గరగా ఉండడంతో పాటు తెలుగు సహజత్వాన్ని కాపాడాం; ἄμωμοίలోని ఉద్దేశపూర్వక అర్థవిస్తృతిని పాదసూచిక ద్వారా నిలిపాం.
