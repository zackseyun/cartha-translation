id: REV.14.15
reference: Revelation 14:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: te
  text: 'మరొక దేవదూత ఆలయం నుండి బయటికి వచ్చి, మేఘం మీద కూర్చున్నవానితో బిగ్గరగా కేక వేస్తూ ఇలా అన్నాడు: “నీ కొడవలిని చాపి కోయి; ఎందుకంటే కోత కోయాల్సిన సమయం వచ్చింది, ఎందుకంటే భూమి పంట కోతకు సిద్ధమైంది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  choice: ఆలయం
  rationale: ప్రకటన గ్రంథ సందర్భంలో దేవుని ఆలయాన్ని సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: నీ కొడవలిని చాపి
  rationale: πέμπω యొక్క ప్రాథమిక భావం ‘పంపు’ అయినా, కొడవలితో కోయడం అనే సందర్భంలో దానిని కార్యానికి దించడం/చాపడం అనే సహజ భావాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: θέρισον
  choice: కోయి
  rationale: ఆజ్ఞార్థక రూపాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: ἐξηράνθη ὁ θερισμὸς τῆς γῆς
  choice: భూమి పంట పండింది
  rationale: అక్షరార్థంగా ‘ఎండిపోయింది’ అనే రూపం కోతకు సిద్ధంగా పరిపక్వమైన పంటను సూచిస్తుంది; తెలుగు వ్యవసాయ వాడుకలో ‘పంట పండింది’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: మేఘంపై కూర్చున్నవానికి దేవదూత ఇచ్చిన ఆజ్ఞాత్మక పిలుపు
  choice: “నీ కొడవలిని చాపి కోయి” అనే ఆజ్ఞారూపాన్ని యథాతథంగా ఉంచడం
  alternative: దీనిని అనుమతి లేదా ప్రార్థనగా మృదువుగా అనువదించడం
  rationale: గ్రీకు పాఠంలో రెండు స్పష్టమైన ఆజ్ఞార్థక క్రియలు ఉన్నాయి; వాటి వల్ల కలిగే దైవశాస్త్ర సంబంధ ఉద్రిక్తతను అనువాదం తగ్గించకూడదు.
- issue: ἐξηράνθη యొక్క రూపకం
  choice: కోతకు సిద్ధమైన పరిపక్వతను సూచిస్తూ ‘పంట పండింది’
  alternative: ‘పంట మితిమీరి పండింది’ లేదా ‘పంట ఎండిపోయింది’
  rationale: మూలపాఠం కోత ఆలస్యమైందని తప్పనిసరిగా చెప్పదు; ‘మితిమీరి’ అనే భావాన్ని చేర్చకుండా, కోతకు సిద్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ప్రకటన గ్రంథానికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని పునరుక్త కారణ నిర్మాణాన్ని తెలుగులో సహజమైన రెండు వాక్యాలుగా అందించింది.
