revisions:
- from: అప్పుడు నేను చూశాను. ఇదిగో, గొర్రెపిల్ల సీయోను కొండ మీద నిలబడి ఉంది. దానితో పాటు నూట నలభై నాలుగు వేలమంది ఉన్నారు. వారి నుదుటుల మీద దాని పేరు, దాని తండ్రి పేరు రాసి ఉన్నాయి.[a]
  to: అప్పుడు నేను చూశాను. ఇదిగో, గొర్రెపిల్ల సీయోను కొండ మీద నిలబడి ఉంది. ఆయనతో పాటు నూట నలభై నాలుగు వేలమంది ఉన్నారు. వారి నుదుటుల మీద ఆయన పేరు, ఆయన తండ్రి పేరు రాసి ఉన్నాయి.[a]
  rationale: SBLGNT యొక్క రెండు నామాల పాఠాన్ని, సంఖ్యను, నిలబడిన స్థితిని, నుదుటులపై వ్రాయబడిన గుర్తును యథాతథంగా ఉంచి, గొర్రెపిల్లను సూచించే నపుంసక ‘దాని’ స్థానంలో వ్యక్తిగత గౌరవసూచకమైన ‘ఆయన’ను వాడాం. ఇది మూలపాఠంలో లేని వివరణను చేర్చదు; తెలుగులో వ్యక్తిగత సూచనను మాత్రమే సహజంగా చేస్తుంది. పాదసూచికలోని పాఠాంతరాన్నీ అదే సూచనకు అనుగుణంగా సవరించాం.
