id: REV.14.1
reference: Revelation 14:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: te
  text: అప్పుడు నేను చూశాను. ఇదిగో, గొర్రెపిల్ల సీయోను కొండ మీద నిలబడి ఉంది. ఆయనతో పాటు నూట నలభై నాలుగు వేలమంది ఉన్నారు. వారి నుదుటుల మీద ఆయన పేరు, ఆయన తండ్రి పేరు రాసి ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “వారి నుదుటుల మీద ఆయన తండ్రి పేరు రాసి ఉంది” అని మాత్రమే ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: అప్పుడు నేను చూశాను
  rationale: దర్శనంలోని తదుపరి దృశ్యాన్ని సహజమైన తెలుగు కథన సంధితో పరిచయం చేస్తూ, εἶδον యొక్క ‘చూశాను’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కొత్త దృశ్యంపై శ్రద్ధను ఆకర్షించే ప్రకటన గ్రంథపు ఉద్ధృత శైలిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸ ἀρνίον
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలో క్రీస్తుకు వాడిన శీర్షికను అదనపు వ్యాఖ్యానం లేకుండా నేరుగా అందిస్తుంది.
- source_word: ἑστὸς
  choice: నిలబడి ఉంది
  rationale: ἵστημι పరిపూర్ణ కృదంతం సూచించే, అప్పటికే ఏర్పడి కొనసాగుతున్న నిలబడిన స్థితిని వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: సీయోను కొండ మీద
  rationale: స్థలనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంతో లిప్యంతరీకరించి, స్థాన సంబంధాన్ని సహజంగా తెలుపుతుంది.
- source_word: μετ’ αὐτοῦ
  choice: దానితో పాటు
  rationale: గొర్రెపిల్లతో కలిసి ఉన్న సమూహాన్ని తెలుగులో సహజంగా సూచిస్తుంది; మూలంలోని సహవాస భావాన్ని నిలుపుతుంది.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: నూట నలభై నాలుగు వేలమంది
  rationale: మూలంలోని ఖచ్చిత సంఖ్యను నిలుపుతూ, వ్యక్తుల సమూహానికి సహజమైన ‘మంది’ వర్గసూచకాన్ని ఉపయోగిస్తుంది.
- source_word: ἔχουσαι
  choice: వారి నుదుటుల మీద ... రాసి ఉన్నాయి
  rationale: గ్రీకు కృదంతాన్ని సహజమైన తెలుగు వాక్యంగా విప్పి, పేర్లు వారికి చెందిన గుర్తుగా ఉన్న స్థితిని తెలియజేస్తుంది.
- source_word: τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: దాని పేరు, దాని తండ్రి పేరు
  rationale: రెండు వేర్వేరు అయినా సమన్వయంగా ఉన్న పేర్లను అలాగే ఉంచుతుంది; వాటిని ఒకే పేరుగా కలిపి వ్యాఖ్యానించదు.
- source_word: γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν
  choice: వారి నుదుటుల మీద ... రాసి ఉన్నాయి
  rationale: ముందే రాయబడి అలాగే ఉన్న పరిపూర్ణ నిష్క్రియ భావాన్నీ, గుర్తు ఉన్న స్పష్టమైన స్థానాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: τὸ ἀρνίον యొక్క గుర్తింపు
  choice: ‘గొర్రెపిల్ల’ అనే క్రీస్తు శీర్షికను మాత్రమే అనువదించడం
  alternative: ‘బలిగా అర్పించబడిన గొర్రెపిల్ల’
  rationale: సందర్భంలో ఇది క్రీస్తును సూచించినప్పటికీ, ఈ వచనంలో లేని బలి సంబంధ వివరణను అనువాదంలో చేర్చలేదు.
- issue: గొర్రెపిల్ల పేరు, తండ్రి పేరు మధ్య సంబంధం
  choice: ‘దాని పేరు, దాని తండ్రి పేరు’ అని రెండు సమన్వయ నామాలుగా ఉంచడం
  alternative: ‘దాని పేరు, అంటే దాని తండ్రి పేరు’
  rationale: గ్రీకు పాఠం రెండు పేర్లను καί ద్వారా కలుపుతుంది; వాటిని సమానార్థక వివరణగా మార్చదు. అందువల్ల భేదాన్నీ సన్నిహిత సంబంధాన్నీ పరిష్కరించకుండా నిలుపుతుంది.
- issue: నుదుటులపై ఉన్న లేఖనానికి సంబంధించిన పాఠాంతరం
  choice: SBLGNT ప్రకారం గొర్రెపిల్ల పేరు, దాని తండ్రి పేరు రెండింటినీ ప్రధాన పాఠంలో ఉంచడం
  alternative: దాని తండ్రి పేరు మాత్రమే
  rationale: ప్రధాన గ్రీకు పాఠంలో రెండు పేర్లు ఉన్నాయి; మొదటి పేరును విడిచిపెట్టే ప్రాముఖ్యమైన పాఠాంతరాన్ని పాదసూచికలో నమోదు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే ప్రకటనాత్మక శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా దర్శనశైలిలోని శ్రద్ధాకర్షణ నిలుపబడింది. ‘గొర్రెపిల్ల’ వ్యాకరణరీత్యా నపుంసకలింగ పదం కావడంతో దానికి సరిపడే ‘దాని’ సర్వనామం వాడబడింది; ఇది సూచిత వ్యక్తి గౌరవాన్ని తగ్గించడానికి కాదు.
