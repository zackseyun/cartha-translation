id: REV.14.7
reference: Revelation 14:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: te
  text: 'అతడు పెద్ద స్వరంతో ఇలా అన్నాడు: “దేవునికి భయపడండి[a], ఆయనకు మహిమ ఇవ్వండి, ఎందుకంటే ఆయన తీర్పు గడియ వచ్చింది. ఆకాశాన్ని, భూమిని, సముద్రాన్ని, నీటి ఊటలను[b] సృష్టించినవానిని ఆరాధించండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవునిపట్ల భయభక్తులు కలిగి ఉండండి.” గ్రీకు క్రియ భక్తిపూర్వక భయాన్నీ, తీర్పు ఎదుట కలిగే భయాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “జలాల ఊటలను.” గ్రీకులో “జలాలు” బహువచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: అతడు పెద్ద స్వరంతో ఇలా అన్నాడు
  rationale: మునుపటి వాక్యంతో ఉన్న కృదంత సంబంధాన్ని సందర్భానుసారమైన కర్తతో తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా అందిస్తుంది; φωνῇ μεγάλῃ యొక్క బలాన్ని ‘పెద్ద స్వరంతో’ నిలుపుతుంది.
- source_word: Φοβήθητε τὸν θεὸν
  choice: దేవునికి భయపడండి
  rationale: తీర్పు, మహిమ, ఆరాధనల సందర్భంలో భక్తిపూర్వక భయం మరియు తీర్పు ఎదుట కలిగే భయం రెండింటినీ ‘భయపడండి’ నిలుపుతుంది; ‘గౌరవించండి’ అని మృదువుగా మార్చదు.
- source_word: δότε αὐτῷ δόξαν
  choice: ఆయనకు మహిమ ఇవ్వండి
  rationale: δόξαν యొక్క స్పష్టమైన భావాన్ని నిలుపుతూ తెలుగులో స్థిరపడిన బైబిలు ప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ
  choice: ఎందుకంటే ఆయన తీర్పు గడియ వచ్చింది
  rationale: ὅτιని కారణార్థకంగా, ὥραను సాధారణ ‘సమయం’గా మార్చకుండా ‘గడియ’గా, κρίσεως αὐτοῦలోని ఉద్దేశపూర్వక సంక్షిప్తతను అలాగే ఉంచుతుంది.
- source_word: προσκυνήσατε τῷ ποιήσαντι
  choice: సృష్టించినవాణ్ణి ఆరాధించండి
  rationale: ప్రకటన గ్రంథంలోని మతపరమైన సందర్భంలో προσκυνέωకు ‘ఆరాధించండి’ తగినది; కృదంతంలోని క్రియాబలాన్ని ‘సృష్టించినవాణ్ణి’ నిలుపుతుంది.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν
  choice: ఆకాశాన్ని, భూమిని, సముద్రాన్ని
  rationale: సృష్టి వర్ణనను గుర్తుచేసే వరుసను స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πηγὰς ὑδάτων
  choice: నీటి ఊటలను
  rationale: గ్రీకు బహువచన నిర్మాణానికి అర్థపరంగా నమ్మకంగా ఉండి, తెలుగులో కృత్రిమంగా వినిపించే ‘జలాల ఊటలు’కు బదులు సహజమైన రూపాన్ని ఇస్తుంది.
theological_decisions:
- issue: Φοβήθητε τὸν θεόν అనే ఆజ్ఞ స్వభావం
  choice: దేవునికి భయపడండి
  alternative: దేవుణ్ణి పూజ్యభావంతో గౌరవించండి
  rationale: సృష్టికర్తను ఆరాధించమనే పిలుపు మరియు సమీపించిన తీర్పు రెండూ ఈ ఆజ్ఞలో ఉన్నాయి. ‘భయపడండి’ భక్తిపూర్వక భయాన్నీ తీర్పు ఎదుటి భయాన్నీ కలిపి ఉంచుతుంది; దానిని కేవలం గౌరవంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ప్రకటనాత్మక శైలి పాటించబడింది. ‘గడియ,’ ‘మహిమ,’ ‘ఆరాధించండి’ వంటి పదాలు అపోకలిప్టిక్ మరియు ఆరాధనా సందర్భానికి తగిన గౌరవభరిత స్వరాన్ని నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
