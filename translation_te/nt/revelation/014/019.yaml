id: REV.14.19
reference: Revelation 14:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: te
  text: అప్పుడు ఆ దూత తన కొడవలిని భూమిపైకి వేశాడు; భూమి ద్రాక్షవల్లిని కోసి, దానిని దేవుని ఉగ్రత యొక్క మహా ద్రాక్షగానుగలోకి వేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: తన కొడవలిని భూమిమీదికి విసిరి
  rationale: βάλλω యొక్క సాధారణ అర్థమైన ‘వేయు/విసరు’ను, εἰς τὴν γῆν సూచించే దిశను నిలిపింది. సందర్భంలో కోత చర్య ఉద్దేశితమైనా, మూలంలో లేని ‘ఊపాడు’ అనే భావాన్ని నేరుగా చేర్చలేదు.
- source_word: ἐτρύγησεν τὴν ἄμπελον τῆς γῆς
  choice: భూమి ద్రాక్షతీగ పంటను కోసి
  rationale: τρυγάω ద్రాక్షపంటను కోయడం లేదా సమకూర్చడాన్ని సూచిస్తుంది; ἄμπελος అక్షరార్థంగా ద్రాక్షతీగ. తెలుగులో సహజంగా ఉండేందుకు ‘పంటను’ చేర్చి, తీగ-పంట ప్రతీకను నిలిపింది.
- source_word: τὴν ληνὸν ... τὸν μέγαν
  choice: మహా ద్రాక్షగానుగలో
  rationale: ληνός ద్రాక్షలను తొక్కి రసం తీసే గానుగను సూచిస్తుంది; ‘మహా’ అనే విశేషణాన్ని స్పష్టంగా దానితో అనుసంధానించింది.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: దేవుని ఉగ్రత అనే
  rationale: θυμός ఇక్కడ దేవుని తీవ్ర ఆగ్రహాన్ని సూచిస్తుంది. గానుగకు ఉగ్రతతో ఉన్న రూపకాల సంబంధం తెలుగులో స్పష్టంగా ఉండేందుకు ‘అనే’ వాడింది.
theological_decisions:
- issue: ద్రాక్షతీగ పంటను గానుగలో వేయడం అనే తీర్పు ప్రతీక
  choice: ప్రతీకను వివరించకుండా మూలరూపంలో నిలిపింది
  alternative: దీనిని నేరుగా దుష్టులపై దేవుని తీర్పుగా వ్యాఖ్యానించడం
  rationale: వచనం బలమైన తీర్పు చిత్రాన్ని ఇస్తుంది గాని, ఈ వాక్యంలో దాని లక్ష్యాన్ని వివరణాత్మకంగా పేరుపెట్టదు; అందువల్ల వ్యాఖ్యానాన్ని పాఠ్యంలో కలపలేదు.
- issue: θυμός యొక్క అనువాదం
  choice: ఉగ్రత
  alternative: కోపం
  rationale: అపోకలిప్టిక్ సందర్భంలోని తీవ్రతను ‘ఉగ్రత’ మెరుగ్గా మోస్తుంది; అయినా దానిని సిద్ధాంతపరంగా మరింత నిర్వచించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రకటన గ్రంథ శైలిని కాపాడుతూ సాధారణ పాఠకునికి అర్థమయ్యే పదాలు వాడబడ్డాయి. ‘ద్రాక్షగానుగ’ బైబిలు చిత్రాన్ని సంక్షిప్తంగా, సహజంగా మోసే పదంగా ఎంచుకోబడింది.
