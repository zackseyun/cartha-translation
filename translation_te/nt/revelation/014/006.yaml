source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: te
  text: ఆకాశ నడిమధ్యంలో[a] ఎగురుతున్న మరొక దేవదూతను నేను చూశాను; భూమిపై నివసించేవారికి[b], ప్రతి జాతికీ, గోత్రానికీ, భాషకూ, ప్రజకూ ప్రకటించడానికి అతడు నిత్యమైన సువార్తను కలిగియున్నాడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆకాశం మధ్యలో’ లేదా ‘గాలిమధ్యలో’; గ్రీకు పదం అపోకలిప్టిక్ రచనల్లో కనిపించే ప్రత్యేక వ్యక్తీకరణ.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘భూమిపై కూర్చున్నవారికి’; ప్రకటన గ్రంథంలో ఇది భూమి నివాసులను సూచించే నుడికారంగా పనిచేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: మరొక దేవదూతను
  rationale: ἄλλος కథన క్రమంలో అదే వర్గానికి చెందిన ‘మరొక’ వ్యక్తిని సూచిస్తుంది; ప్రకటన గ్రంథ సందర్భంలో ἄγγελος పరలోక దూతనే సూచిస్తుంది.
- source_word: πετόμενον ἐν μεσουρανήματι
  choice: ఆకాశం నడిమధ్యలో ఎగురుతున్న
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న చలనాన్ని చూపుతుంది. μεσουράνημα అనే ప్రత్యేక అపోకలిప్టిక్ పదంలోని ఆకాశ మధ్య/ఉన్నత విస్తార దృశ్యాన్ని ఈ పదబంధం సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: εὐαγγέλιον αἰώνιον
  choice: నిత్యమైన సువార్త
  rationale: εὐαγγέλιονకు స్థిరపడిన, సులభంగా అర్థమయ్యే ‘సువార్త’ను వాడాం; αἰώνιον దాని నిత్య స్వభావాన్ని తెలియజేస్తుంది. గ్రీకులో నిర్దేశక ఉపపదం లేకపోవడాన్ని తెలుగు సహజ వాక్యనిర్మాణం ప్రత్యేకంగా గుర్తించదు.
- source_word: εὐαγγελίσαι
  choice: ప్రకటించడానికి
  rationale: అనంత క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తుంది. ‘సువార్తను సువార్తగా ప్రకటించడానికి’ వంటి అనవసర పునరుక్తిని నివారిస్తూ శుభవార్త భావాన్ని నామవాచకంలోనే నిలిపాం.
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: భూమిపై నివసించేవారికి
  rationale: καθημένους అక్షరార్థంగా ‘కూర్చున్నవారు’ అయినా, ప్రకటన గ్రంథంలో ఇది భూనివాసులను సూచించే సందర్భోచిత ప్రయోగం; భంగిమను తప్పుగా ఊహింపజేయకుండా భావాన్ని అందిస్తుంది.
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: ప్రతి జాతికి, గోత్రానికి, భాషవారికి, ప్రజకు
  rationale: నాలుగు భాగాల సార్వత్రిక పరిధిని, సమాంతర లయను నిలిపాం. γλῶσσα ఇక్కడ భాష ఆధారంగా గుర్తింపబడే సమూహాన్ని సూచిస్తున్నందున సహజ తెలుగులో ‘భాషవారికి’ అన్నాం.
theological_decisions:
- issue: εὐαγγέλιον αἰώνιονను సంప్రదాయ క్రైస్తవ పదంతో అనువదించాలా, సాధారణ ‘శుభవార్త’ పదంతోనా
  choice: నిత్యమైన సువార్త
  alternative: నిత్యమైన శుభవార్త
  rationale: ‘సువార్త’ మూలపదంలోని శుభవార్త భావంతో పాటు గ్రంథాంతర ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది; వచనంలో లేని సిద్ధాంత వివరణను చేర్చదు.
- issue: τοὺς καθημένους ἐπὶ τῆς γῆςను అక్షరార్థంగా అనువదించాలా, ప్రకటన గ్రంథంలోని నుడికారంగా అనువదించాలా
  choice: భూమిపై నివసించేవారికి
  alternative: భూమిపై కూర్చున్నవారికి
  rationale: అక్షరార్థ ప్రత్యామ్నాయం శరీర భంగిమను సూచించి తప్పుదారి పట్టించవచ్చు. ఎంచుకున్న రూపం ప్రకటన గ్రంథంలోని పునరావృత భూనివాసుల వర్గాన్ని సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. గ్రీకు సమన్వయ జాబితాను కామాలతో నిలిపి, తెలుగు సహజత్వం కోసం మొదటి దీర్ఘ వాక్యాన్ని రెండు వాక్యాలుగా విభజించాం. ‘అతని దగ్గర ... ఉంది’ అనేది ἔχοντα యొక్క స్వాధీన భావాన్ని సహజంగా తెలుపుతుంది; ‘పట్టుకొని’ అనే భౌతిక భావాన్ని అనవసరంగా చేర్చదు.
