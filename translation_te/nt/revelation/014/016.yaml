id: REV.14.16
reference: Revelation 14:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: te
  text: ఆ మేఘం మీద కూర్చున్నవాడు[c] తన కొడవలిని భూమి మీదికి విసిరాడు[a]; భూమి కోయబడింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కొడవలిని భూమి మీద ప్రయోగించాడు.” గ్రీకు క్రియ అక్షరార్థంగా “విసిరాడు” అని అర్థమిస్తుంది; ఈ కోత సందర్భంలో కొడవలితో కోయడం మొదలుపెట్టిన చర్యను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భూమి పంట కోయబడింది.”
    reason: lexical_alternative
  - marker: c
    text: మునుపటి సందర్భాన్ని బట్టి మేఘం మీద కూర్చున్నవానిని తరచుగా మనుష్యకుమారునిగా గుర్తిస్తారు; అయితే ఈ వచనం మాత్రం ఆయనను “మేఘం మీద కూర్చున్నవాడు” అని మాత్రమే పేర్కొంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔβαλεν
  choice: విసిరాడు
  rationale: βάλλω యొక్క ప్రాథమిక భావమైన ‘విసురు/ప్రయోగించు’ను నిలుపుతుంది; కొడవలి సందర్భంలో కోతకు దానిని ప్రయోగించిన చర్యను సూచిస్తుంది.
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: ఆ మేఘం మీద కూర్చున్నవాడు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతాన్ని వివరణాత్మకంగా అనువదించి, ఆ వ్యక్తి ఎవరనే విషయాన్ని ఈ వచనం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించదు.
- source_word: τῆς νεφέλης
  choice: ఆ మేఘం
  rationale: గ్రీకు నిర్దిష్ట ఉపపదాన్ని, ముందటి వచనంలో పేర్కొన్న మేఘంతో ఉన్న సందర్భ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: δρέπανον
  choice: కొడవలి
  rationale: పంట కోయడానికి ఉపయోగించే సాధనానికి సహజమైన ఆధునిక తెలుగు పదం; కోత మరియు తీర్పు దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τὴν γῆν
  choice: భూమి మీదికి
  rationale: కర్మకారకంతో ఉన్న ἐπί సూచించే దిశను సహజంగా వ్యక్తపరుస్తూ, కొడవలి భూమి వైపు ప్రయోగించబడినట్లు చూపుతుంది.
- source_word: ἐθερίσθη
  choice: కోయబడింది
  rationale: θερίζω యొక్క భూతకాల నిష్క్రియ రూపాన్ని నేరుగా నిలుపుతుంది; పంటకోత దృశ్యంలో సహజంగా ఉంటుంది.
- source_word: ἡ γῆ
  choice: భూమి
  rationale: ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త అంత్యకాల సందర్భానికి ‘దేశం’ కంటే ‘భూమి’ సరిపోతుంది; గ్రీకులోని పునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: మేఘం మీద కూర్చున్న కోతకోయువాని గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘ఆ మేఘం మీద కూర్చున్నవాడు’ అని మాత్రమే వివరణాత్మకంగా అనువదించడం
  alternative: మునుపటి సందర్భాన్ని బట్టి ఆయనను ‘మనుష్యకుమారుడు’ లేదా మెస్సీయ అని స్పష్టంగా పేర్కొనడం; లేదా దేవుని ఆజ్ఞను నెరవేర్చే దేవదూతగా భావించడం
  rationale: ఈ వచనంలోని గ్రీకు పాఠ్యం ఆ వ్యక్తిని ‘మేఘం మీద కూర్చున్నవాడు’ అని మాత్రమే పేర్కొంటుంది. కాబట్టి ముందుగానే గుర్తింపును ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని వ్యాఖ్యానసాధ్యతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. మూలంలోని రెండు సమన్వయ వాక్యాల క్రమాన్ని నిలిపి, తెలుగులో ప్రవాహం కోసం మొదట ‘అప్పుడు’ వాడబడింది. ఆ వ్యక్తిని ‘మనుష్యకుమారుడు’ అని ప్రధాన పాఠ్యంలో నిర్ధారించకుండా మూలంలోని వివరణాత్మక రూపం కాపాడబడింది.
