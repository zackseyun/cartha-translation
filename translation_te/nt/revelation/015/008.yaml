id: REV.15.8
reference: Revelation 15:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: te
  text: దేవుని మహిమ నుండి, ఆయన శక్తి నుండి వచ్చిన పొగతో పవిత్రస్థలం[a] నిండిపోయింది. ఆ ఏడుగురు దేవదూతల ఏడు తెగుళ్లు ముగిసే వరకు ఎవరూ ఆ పవిత్రస్థలంలోకి ప్రవేశించలేకపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆలయం.’ గ్రీకు పదం ναός సాధారణంగా విశాలమైన ఆలయ ప్రాంగణం కంటే అంతర్గత పవిత్ర నివాసాన్ని మరింత ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: పవిత్రస్థలం
  rationale: ναός ఇక్కడ విశాలమైన ఆలయ ప్రాంగణం కంటే దేవుని సన్నిధికి సంబంధించిన అంతర్గత పవిత్ర నివాసాన్ని సూచిస్తుంది. ‘పవిత్రస్థలం’ ఆ ప్రత్యేక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐγεμίσθη
  choice: నిండిపోయింది
  rationale: అనిర్దిష్ట భూతకాల కర్మణి రూపంలోని ‘నింపబడింది/నిండింది’ అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καπνοῦ
  choice: పొగతో
  rationale: γεμίζω తరువాతి షష్ఠీ విభక్తిని తెలుగులో ‘తో’ అని సహజంగా వ్యక్తం చేయవచ్చు; దైవ ప్రత్యక్షత చిత్రణలో ‘పొగ’ సందర్భోచితం.
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ
  choice: దేవుని మహిమ నుండి
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని ‘నుండి’ స్పష్టంగా నిలుపుతుంది.
- source_word: ἐκ τῆς δυνάμεως αὐτοῦ
  choice: ఆయన శక్తి నుండి
  rationale: δύναμις యొక్క దైవ బలం/శక్తి భావాన్ని నేరుగా అందిస్తూ, రెండవ ἐκ యొక్క మూలార్థాన్ని కూడా నిలుపుతుంది.
- source_word: οὐδεὶς ἐδύνατο
  choice: ఎవరూ ... ప్రవేశించలేకపోయారు
  rationale: అసమాపక భూతకాల రూపం తెలిపే అసమర్థతను సహజమైన తెలుగు క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: εἰσελθεῖν εἰς τὸν ναὸν
  choice: ఆ పవిత్రస్థలంలోకి ప్రవేశించడానికి
  rationale: εἰς సూచించే లోపలికి ప్రవేశాన్ని ‘లోకి’ నిలుపుతుంది; ναός అనువాదంలో ఏకరూపత పాటించబడింది.
- source_word: ἄχρι τελεσθῶσιν
  choice: ముగిసే వరకు
  rationale: కాల పరిమితిని, ఏడు తెగుళ్లు పూర్తయ్యే స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: πληγαὶ
  choice: తెగుళ్లు
  rationale: ప్రకటన గ్రంథంలోని దైవ తీర్పు సందర్భంలో πληγή కి స్థిరమైన, సందర్భోచిత తెలుగు పదం.
- source_word: τῶν ἑπτὰ ἀγγέλων
  choice: ఆ ఏడుగురు దేవదూతల
  rationale: షష్ఠీ విభక్తిలోని సంబంధం లేదా అనుబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ఇవి ఆ దేవదూతలతో అనుబంధమైన తెగుళ్లు.
theological_decisions:
- issue: అంతర్గత దైవ నివాసాన్ని సూచించే ναός పదం
  choice: పవిత్రస్థలం
  alternative: ఆలయం
  rationale: అపోకలిప్టిక్ పరలోక ఆరాధన సందర్భంలో ναός మొత్తం ఆలయ ప్రాంగణాన్ని కాకుండా దేవుని అంతర్గత పవిత్ర నివాసాన్ని తరచుగా సూచిస్తుంది. ‘పవిత్రస్థలం’ ఈ ప్రత్యేకతను కాపాడుతుంది; అయినా ‘ఆలయం’ కూడా సాధ్యమైన అనువాదం.
- issue: పొగకు దేవుని మహిమ, శక్తి మూలాలుగా చెప్పబడటం
  choice: దేవుని మహిమ నుండి, ఆయన శక్తి నుండి వచ్చిన పొగ
  alternative: దేవుని మహిమవల్ల, ఆయన శక్తివల్ల కలిగిన పొగ
  rationale: రెండు ἐκ పదాల మూలం/ఉద్భవం అనే భావాన్ని నిలుపుతూ, కారణార్థానికి మాత్రమే పరిమితం చేయకుండా మూలపాఠంలోని చిత్రాత్మక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండు ‘నుండి’ పదాల భావాన్ని సహజంగా నిలుపుటకు ‘వచ్చిన’ చేర్చబడింది. ప్రధాన పాఠంలో [a] సూచిక ఉంచబడింది.
