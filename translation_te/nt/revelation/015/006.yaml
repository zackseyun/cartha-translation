id: REV.15.6
reference: Revelation 15:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: te
  text: ఆ ఏడు తెగుళ్లను కలిగివున్న ఏడుగురు దేవదూతలు పరిశుద్ధస్థలం[a] నుండి బయటికి వచ్చారు. వారు శుభ్రమైన[b], ప్రకాశవంతమైన నారవస్త్రాలు ధరించి, తమ ఛాతీల చుట్టూ బంగారు పట్టీలు[c] కట్టుకొని ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవాలయం.” ఇక్కడున్న గ్రీకు పదం ναός; ఇది దేవాలయ సముదాయం మొత్తాన్ని కాక ప్రత్యేకంగా దాని అంతర్గత పరిశుద్ధస్థలాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నిర్మలమైన” లేదా “పవిత్రమైన.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “బంగారు దట్టీలు.” ఇవి నడుము వద్ద కాక ఛాతీల చుట్టూ కట్టబడి ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: బయటికి వచ్చారు
  rationale: బయటకు కదలడాన్ని తెలిపే ἐξέρχομαι పదంలోని దిశాభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἄγγελοι
  choice: దేవదూతలు
  rationale: ప్రకటన గ్రంథంలోని పరలోక దర్శన సందర్భంలో ఇది మానవ దూతలను కాక పరలోక దేవదూతలను సూచిస్తుంది.
- source_word: πληγάς
  choice: తెగుళ్లు
  rationale: ఈ సందర్భంలో దేవుని తీర్పుగా వచ్చే వినాశకరమైన దెబ్బలను సూచించే స్థిరమైన, సాధారణ తెలుగు పదం.
- source_word: ναοῦ
  choice: పరిశుద్ధస్థలం
  rationale: ναός సాధారణంగా దేవాలయ సముదాయం మొత్తాన్ని కాక దాని అంతర్గత పవిత్రస్థలాన్ని సూచిస్తుంది; పరలోక దర్శనంలోని నిర్దిష్ట భావాన్ని ఇది నిలుపుతుంది.
- source_word: ἐνδεδυμένοι
  choice: ధరించి
  rationale: వారు వస్త్రాలు ధరించిన స్థితిలో ఉన్నారని తెలిపే పరిపూర్ణ కృదంత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: λίνον
  choice: నారవస్త్రాలు
  rationale: λίνον నారతో చేసిన వస్త్రాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘నార’ అని చెప్పడం కంటే ‘నారవస్త్రాలు’ దృశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలో లేని ‘సన్నని’ అనే విశేషణాన్ని చేర్చలేదు.
- source_word: καθαρὸν
  choice: శుభ్రమైన
  rationale: భౌతిక శుభ్రతతో పాటు సందర్భానుసారంగా పవిత్రత లేదా నిర్మలతను సూచించగల పదానికి నేరమైన తెలుగు సమానం.
- source_word: λαμπρὸν
  choice: ప్రకాశవంతమైన
  rationale: λαμπρός తెలిపే వెలుగు, మెరుపు భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: περιεζωσμένοι
  choice: చుట్టూ … కట్టుకొని ఉన్నారు
  rationale: తమ చుట్టూ బిగించుకొని ఉన్న స్థితిని తెలిపే కృదంత భావాన్ని తెలుగులో సహజంగా పునరుత్పత్తి చేస్తుంది.
- source_word: περὶ τὰ στήθη
  choice: తమ ఛాతీల చుట్టూ
  rationale: పట్టీలు నడుము వద్ద కాక ఛాతీ ప్రాంతం చుట్టూ ఉన్నాయనే అసాధారణమైన కానీ ముఖ్యమైన దృశ్య వివరాన్ని కాపాడుతుంది.
- source_word: ζώνας χρυσᾶς
  choice: బంగారు పట్టీలు
  rationale: ζώνη నడికట్టు, దట్టి లేదా పట్టీ కావచ్చు. ఇవి ఛాతీ చుట్టూ ఉన్నందున ‘పట్టీలు’ అనే పదం ‘నడికట్లు’ కంటే చిత్రానికి సరిపోతుంది.
theological_decisions:
- issue: పరలోక దేవాలయ సందర్భంలో ναός అనువాదం
  choice: పరిశుద్ధస్థలం
  alternative: దేవాలయం
  rationale: ναός అనే పదం విస్తృత దేవాలయ ప్రాంగణం కంటే అంతర్గత పవిత్రస్థలాన్ని ఎక్కువగా సూచిస్తుంది. ‘పరిశుద్ధస్థలం’ ఆ ప్రత్యేకతను నిలుపుతుంది; ‘దేవాలయం’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: καθαρός పదంలోని భౌతిక మరియు ఆచారపరమైన భావసాధ్యత
  choice: శుభ్రమైన
  alternative: నిర్మలమైన / పవిత్రమైన
  rationale: వస్త్రాల ప్రత్యక్ష వర్ణనకు ‘శుభ్రమైన’ సహజంగా సరిపోతుంది; అయితే మూలపదంలో ఉండగల నిర్మలత లేదా పవిత్రత భావాన్ని పాదసూచిక ద్వారా తెరిచి ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. దర్శనంలోని అసాధారణ దృశ్యాన్ని సులభతరం చేయకుండా ‘ఛాతీల చుట్టూ’ అని స్పష్టంగా ఉంచాం. మూల గ్రీకు వాక్య నిర్మాణం తెలుగులో భారంగా కాకుండా ఉండేందుకు రెండు వాక్యాలుగా విభజించాం; భావక్రమం మాత్రం యథాతథంగా ఉంది.
