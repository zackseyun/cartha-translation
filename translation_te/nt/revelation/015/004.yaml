id: REV.15.4
reference: Revelation 15:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: te
  text: ప్రభువా, నీకు భయపడకుండా, నీ నామాన్ని మహిమపరచకుండా ఉండగలవాడు ఎవడు? ఎందుకంటే నీవొక్కడవే పవిత్రుడవు. సమస్త జనాంగాలు వచ్చి నీ సన్నిధిలో ఆరాధిస్తారు; ఎందుకంటే నీ నీతికార్యాలు[a] వెల్లడయ్యాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ న్యాయమైన తీర్పులు.” గ్రీకు పదం న్యాయనిర్ణయాలను లేదా శాసనాలను కూడా సూచించవచ్చు; ఇక్కడ దేవుని న్యాయం వెల్లడైన కార్యాలను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: నీకు భయపడకుండా ... ఉండేవాడు ఎవడు?
  rationale: οὐ μήతో కూడిన ప్రశ్నకు ‘ఎవరూ లేరు’ అనే బలమైన అలంకారిక భావం ఉంది. తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేలా ప్రతికూల క్రియను చివరి ‘ఎవడు?’తో కలిపి ఆ బలాన్ని నిలిపాం.
- source_word: κύριε
  choice: ప్రభువా
  rationale: κύριος యొక్క సంబోధన రూపాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజమైన దైవసంబోధనగా అనువదించాం.
- source_word: δοξάσει τὸ ὄνομά σου
  choice: నీ నామాన్ని మహిమపరచకుండా
  rationale: δοξάζω యొక్క ‘మహిమపరచు’ భావాన్ని, దేవుని నామం అంటే ఆయన వెల్లడైన స్వభావం మరియు ఖ్యాతి అనే బైబిలు నుడికారాన్ని నిలిపింది.
- source_word: μόνος ὅσιος
  choice: నీవొక్కడవే పవిత్రుడవు
  rationale: ὅσιος ఇక్కడ దైవ స్తోత్ర సందర్భంలో నైతిక, ఆరాధన సంబంధ పవిత్రతను సూచిస్తుంది; μόνος యొక్క ప్రత్యేకతను ‘ఒక్కడవే’ స్పష్టంగా చూపిస్తుంది.
- source_word: πάντα τὰ ἔθνη
  choice: సమస్త జనాలు
  rationale: ἔθνη ఇక్కడ అంత్యకాలికంగా అన్ని ప్రజాసమూహాలను సమగ్రంగా సూచిస్తుంది. ‘జనాలు’ సాధారణ పాఠకులకు సహజంగా ఉండి, ‘అన్యజనులు’ అనే సంకుచిత భావాన్ని రుద్దదు.
- source_word: ἥξουσιν
  choice: వచ్చి
  rationale: ప్రవచనాత్మక భవిష్యత్ భావం తరువాతి ‘ఆరాధిస్తారు’లో వ్యక్తమవుతుంది; సంయుక్త తెలుగు క్రియారూపం వాక్యాన్ని సహజంగా చేస్తుంది.
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: నీ సన్నిధిలో ఆరాధిస్తారు
  rationale: προσκυνέω యొక్క మతపరమైన ఆరాధన భావాన్ని ‘ఆరాధిస్తారు’ అందిస్తుంది; ἐνώπιόν σουను సహజమైన గౌరవభాషలో ‘నీ సన్నిధిలో’గా ఉంచాం.
- source_word: τὰ δικαιώματά σου
  choice: నీ నీతికార్యాలు
  rationale: δικαιώματαకు నీతిగల కార్యాలు, న్యాయతీర్పులు, విధులు అనే విస్తృత అర్థపరిధి ఉంది. సందర్భంలో దేవుని న్యాయం ప్రత్యక్షమైన కార్యాల ద్వారా కనబడటంతో ‘నీతికార్యాలు’ ప్రధాన పాఠంలో విస్తృతిని నిలుపుతుంది.
- source_word: ἐφανερώθησαν
  choice: వెల్లడయ్యాయి
  rationale: అయోరిస్ట్ పాసివ్‌లోని ప్రత్యక్షపరచబడిన భావాన్ని సంక్షిప్తంగా అందిస్తుంది; ఫలితం ఇప్పుడు స్పష్టంగా ఉందనే సందర్భార్థానికీ సరిపోతుంది.
theological_decisions:
- issue: దైవ స్తోత్రంలో ὅσιος అనువాదం
  choice: పవిత్రుడు
  alternative: నమ్మకమైనవాడు; భక్తిగలవాడు
  rationale: ఈ సందర్భం దేవుని ఏకైక పవిత్రతను స్తుతిస్తుంది. ‘పవిత్రుడు’ నైతిక, ఆరాధన సంబంధ భావాన్ని నిలుపుతుంది; ‘భక్తిగలవాడు’ దేవుని గురించి తెలుగులో అసహజం, ‘నమ్మకమైనవాడు’ అర్థాన్ని నిబంధన విశ్వసనీయతకు పరిమితం చేయవచ్చు.
- issue: అంత్యకాల తీర్పు సందర్భంలో δικαιώματα అర్థం
  choice: నీతికార్యాలు
  alternative: న్యాయమైన తీర్పులు; శాసనాలు
  rationale: దేవుని న్యాయం జనాల ఎదుట వెల్లడైందనే సందర్భంలో ‘నీతికార్యాలు’ పదం కార్యాలు, తీర్పులు రెండింటికీ చోటిస్తుంది. పాఠం సూచించేదానికంటే సంకుచితమైన న్యాయపరమైన అర్థాన్ని ప్రధాన అనువాదంలో రుద్దకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన ఆరాధనా శైలిని ఉపయోగించాం. ‘ప్రభువా’, ‘నీ నామం’, ‘నీ సన్నిధిలో’ వంటి పరిచిత బైబిలు నుడికారాలను నిలిపి, వాక్యాన్ని సాధారణ పాఠకుడికి సహజంగా మలిచాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిగ్గా అనుసంధానించబడింది.
