id: REV.15.2
reference: Revelation 15:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: te
  text: నేను అగ్నితో కలిసిన గాజు సముద్రంలాంటిదానినీ, మృగంపైనా, దాని ప్రతిమపైనా, దాని పేరు యొక్క సంఖ్యపైనా విజయం సాధించినవారు[a] దేవుని వీణలు[b] పట్టుకొని ఆ గాజు సముద్రం మీద నిలబడి ఉండడాన్నీ చూశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మృగం నుండి, దాని ప్రతిమ నుండి, దాని పేరు యొక్క సంఖ్య నుండి బయటపడి విజయం సాధించినవారు.’ గ్రీకు నిర్మాణం మృగంపై సాధించిన విజయాన్ని గానీ, దాని అధికారం నుండి బయటపడడాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘దేవుని వీణలు’ అనేది అవి దేవునికి చెందినవని, దేవుని నుండి వచ్చినవని, లేదా దేవునికి అంకితమైనవని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς θάλασσαν ὑαλίνην
  choice: గాజు సముద్రంలా కనిపించిన దానిని
  rationale: ὡς దర్శనంలో కనిపించిన పోలికను సూచిస్తుంది; ‘కనిపించిన’ అనేది దానిని కచ్చితమైన గుర్తింపుగా కాక దర్శనానుభూతిగా ఉంచుతుంది. θάλασσα ὑαλίνη అనే విశిష్ట రూపకాన్ని ‘గాజు సముద్రం’గా నిలుపుతుంది.
- source_word: μεμιγμένην πυρί
  choice: అగ్నితో కలిసిన
  rationale: పరిపూర్ణ కృదంతం సూచించే కలిసివున్న స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ అసాధారణ దృశ్యాన్ని వ్యాఖ్యానించకుండా ఉంచుతుంది.
- source_word: τοὺς νικῶντας
  choice: విజయం సాధించినవారు
  rationale: νικάωలోని జయించడం/అధిగమించడం అనే భావాన్ని సైనిక హింసకు మాత్రమే పరిమితం చేయకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ θηρίου ... ἐκ τῆς εἰκόνος ... ἐκ τοῦ ἀριθμοῦ
  choice: మృగంపైనా, దాని ప్రతిమపైనా, దాని పేరు యొక్క సంఖ్యపైనా
  rationale: νικῶντας‌తో వచ్చిన ἐκను సందర్భానుసారంగా ‘పై విజయం’గా అందిస్తూ మూడు అంశాల సమాంతర నిర్మాణాన్ని కాపాడుతుంది; ‘నుండి బయటపడిన’ భావసాధ్యతను పాదసూచికలో ఉంచుతుంది.
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: ఆ గాజు సముద్రం మీద నిలబడి ఉండడం
  rationale: ἐπί + accusativeలోని ఆశ్చర్యకరమైన ‘మీద’ దృశ్యాన్ని బలహీనపరచకుండా నిలుపుతుంది; ‘దగ్గర’ అని మార్చదు.
- source_word: κιθάρας τοῦ θεοῦ
  choice: దేవుని వీణలు
  rationale: κιθάραకు సాధారణంగా అర్థమయ్యే ‘వీణ’ను వాడి, τοῦ θεοῦలోని స్వామ్యం, మూలం లేదా అంకితం అనే సంభావ్య సంబంధాలను నిర్దిష్టంగా తేల్చకుండా ఉంచుతుంది.
theological_decisions:
- issue: νικῶντας తరువాత పునరుక్తమైన ἐκ మృగంతో విజేతల సంబంధాన్ని ఎలా సూచిస్తుంది
  choice: మృగం, దాని ప్రతిమ, దాని పేరు యొక్క సంఖ్యపై వారు విజయం సాధించారు
  alternative: వారు మృగం యొక్క అధికారం లేదా పరిధి నుండి బయటపడ్డారు
  rationale: ప్రకటన గ్రంథంలోని νικάω జయభావానికి ‘పై విజయం’ సహజంగా సరిపోతుంది; అయితే ἐκ యొక్క మూలార్థం వల్ల విడుదలై బయటకు రావడం అనే భావసాధ్యతను పాదసూచికలో సంరక్షించాం.
- issue: τοῦ θεοῦ అనే షష్ఠీ విభక్తి సంబంధం
  choice: దేవుని వీణలు
  alternative: దేవుడు ఇచ్చిన వీణలు లేదా దేవునికి అంకితమైన వీణలు
  rationale: మూలంలోని షష్ఠీ సంబంధాన్ని ఉద్దేశపూర్వకంగా విప్పి చెప్పకుండా ఉంచడం ద్వారా స్వామ్యం, మూలం, అంకితం అనే భావసాధ్యతలు నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దర్శనశైలిని పాటించాం. ‘ప్రతిమ,’ ‘పేరు యొక్క సంఖ్య,’ ‘గాజు సముద్రం’ వంటి ప్రకటన గ్రంథపు కీలక రూపాలను స్పష్టీకరణ పేరుతో సరళీకరించలేదు. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
