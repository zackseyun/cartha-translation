revisions:
- from: అప్పుడు అగ్నితో కలిసిన గాజు సముద్రంలా కనిపించిన దానిని నేను చూశాను. మృగంపైనా, దాని ప్రతిమపైనా, దాని పేరు యొక్క సంఖ్యపైనా విజయం సాధించినవారు[a] దేవుని వీణలు[b] పట్టుకొని, ఆ గాజు సముద్రం మీద నిలబడి ఉండడం చూశాను.
  to: నేను అగ్నితో కలిసిన గాజు సముద్రంలాంటిదానినీ, మృగంపైనా, దాని ప్రతిమపైనా, దాని పేరు యొక్క సంఖ్యపైనా విజయం సాధించినవారు[a] దేవుని వీణలు[b] పట్టుకొని ఆ గాజు సముద్రం మీద నిలబడి ఉండడాన్నీ చూశాను.
  rationale: Removed the unsupported temporal ‘అప్పుడు’ and recast the sentence so that a single ‘నేను ... చూశాను’ governs both coordinated objects, as εἶδον does in Greek. The revision preserves the visionary comparison, the unusual image of standing on the glass sea, the repeated threefold relation of victory, and the unresolved sense of the genitive in ‘harps of God.’ Footnote a was adjusted for clear Telugu while preserving the alternative ‘from/out of’ force of ἐκ.
