id: REV.15.3
reference: Revelation 15:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the servant of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: te
  text: 'వారు దేవుని దాసుడైన మోషే పాటను, గొర్రెపిల్ల పాటను పాడుతూ ఇలా అంటున్నారు:


    “ప్రభువా, దేవా, సర్వశక్తిమంతుడా,

    నీ కార్యాలు గొప్పవి, ఆశ్చర్యకరమైనవి!

    నీ మార్గాలు న్యాయమైనవి, సత్యమైనవి,

    యుగాల రాజా![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “యుగాల రాజా”కు బదులు “జనాంగాల రాజా” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: పాడుతూ
  rationale: వర్తమానకాల దర్శన వర్ణనను సహజమైన తెలుగు వాక్య నిర్మాణంలో కొనసాగుతున్న చర్యగా వ్యక్తం చేస్తుంది.
- source_word: ᾠδὴν
  choice: పాటను
  rationale: సాధారణ అర్థమైన ‘పాట’ను కాపాడుతుంది; మూలంలో తప్పనిసరిగా లేని ఆరాధనా-కీర్తన భావాన్ని అదనంగా చేర్చదు.
- source_word: δούλου
  choice: దాసుడైన
  rationale: మోషే దేవునికి చెందినవాడని, ఆయన సేవకు నియమించబడినవాడని సూచించే δοῦλος బలాన్ని ‘సేవకుడు’ కంటే స్పష్టంగా నిలుపుతుంది; తెలుగులో గౌరవప్రదమైన బైబిలు సందర్భానికీ సరిపోతుంది.
- source_word: ἀρνίου
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలోని క్రీస్తు సంబంధిత బిరుదు మరియు బలి ప్రతీకను నేరుగా కాపాడుతుంది.
- source_word: Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου
  choice: నీ కార్యాలు గొప్పవి, ఆశ్చర్యకరమైనవి
  rationale: విధేయ విశేషణాల నిర్మాణాన్ని సహజ తెలుగులో ఉంచి, దేవుని కార్యాలు విస్మయం కలిగించేవని వ్యక్తం చేస్తుంది.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: సర్వశక్తిమంతుడవైన ప్రభువైన దేవా
  rationale: ప్రభువు, దేవుడు, సర్వశక్తిమంతుడు అనే మూడు అంశాలనూ సహజమైన తెలుగు సంబోధనలో నిలుపుతుంది.
- source_word: δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου
  choice: నీ మార్గాలు న్యాయమైనవి, సత్యమైనవి
  rationale: దేవుని వ్యవహార విధానాలు న్యాయసమ్మతమైనవీ విశ్వసనీయంగా సత్యమైనవీ అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: యుగాల రాజా
  rationale: అందించిన SBLGNT పాఠంలోని αἰώνων అనే బహువచన షష్ఠీ రూపాన్ని సంక్షిప్తమైన, గంభీరమైన తెలుగు సంబోధనగా అనువదిస్తుంది.
theological_decisions:
- issue: మోషేకు సంబంధించిన δοῦλος బిరుదు
  choice: దేవుని దాసుడు
  alternative: దేవుని సేవకుడు
  rationale: ‘దాసుడు’ దేవునికి చెందడం మరియు ఆయన అధికారానికి లోబడిన నియామక సేవ అనే భావాన్ని కాపాడుతుంది; ‘సేవకుడు’ సాధ్యమైనప్పటికీ మూలపద బలాన్ని కొంత మృదువుచేస్తుంది.
- issue: చివరి దైవ బిరుదులోని పాఠాంతరం
  choice: యుగాల రాజా
  alternative: జనాల రాజా
  rationale: ప్రధాన పాఠం అందించిన SBLGNT లోని αἰώνων (‘యుగాల’)ను అనుసరిస్తుంది. ἐθνῶν (‘జనాల/జనాంగాల’) అనే ముఖ్యమైన పాఠాంతరాన్ని ప్రధాన పాఠంలో కలపకుండా పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన స్తుతిగీత శైలిని ఉపయోగించాం. పదక్రమాన్ని తెలుగు కవితాత్మక సంబోధనకు అనుగుణంగా అమర్చినా, మూలంలోని ప్రతి బిరుదు మరియు సమాంతర వాక్య నిర్మాణం నిలుపబడింది.
