- from: 'నేను పరలోకంలో మరొక సూచక చిహ్నాన్ని చూశాను. అది గొప్పదీ అద్భుతమైనదీ[a]: చివరివైన ఏడు తెగుళ్లను కలిగి ఉన్న ఏడుగురు దేవదూతలు; ఎందుకంటే ఆ తెగుళ్లలో దేవుని ఉగ్రకోపం పూర్తయింది[b].'
