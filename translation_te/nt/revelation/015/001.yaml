id: REV.15.1
reference: Revelation 15:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: te
  text: 'నేను పరలోకంలో గొప్పదీ అద్భుతమైనదీ అయిన మరొక చిహ్నాన్ని చూశాను[a]: చివరివైన ఏడు తెగుళ్లను కలిగిన ఏడుగురు దేవదూతలు; ఎందుకంటే ఆ తెగుళ్లలో దేవుని ఉగ్రకోపం పూర్తయింది[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గొప్పదీ ఆశ్చర్యకరమైనదీ.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ముగిసింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: సూచక చిహ్నం
  rationale: ప్రకటన గ్రంథంలోని దృశ్యపరమైన, ప్రతీకాత్మకమైన సూచన భావాన్ని స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘సూచన’ కంటే కనిపించే చిహ్నం అనే భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: ఈ ప్రకటనాత్మక దర్శన సందర్భంలో οὐρανός కనిపించే ఆకాశం కంటే పరలోక ప్రదేశాన్ని సూచించడం సహజం.
- source_word: μέγα καὶ θαυμαστόν
  choice: గొప్పదీ అద్భుతమైనదీ
  rationale: చిహ్నం యొక్క మహత్తును, ఆశ్చర్యం కలిగించే స్వభావాన్ని రెండింటినీ గంభీరమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀγγέλους ἑπτὰ
  choice: ఏడుగురు దేవదూతలు
  rationale: మూలంలోని సంఖ్యను, నామవాచకాన్ని నేరుగా మరియు సహజంగా అందిస్తుంది.
- source_word: ἔχοντας
  choice: కలిగి ఉన్న
  rationale: దేవదూతలకు తెగుళ్లు ఉన్నాయని తెలిపే గ్రీకు వర్తమాన కృదంత సంబంధాన్ని నిలుపుతుంది; ‘మోస్తున్న’ అని చెప్పి మూలంలో లేని భౌతిక చిత్రాన్ని బలపరచదు.
- source_word: πληγὰς
  choice: తెగుళ్లు
  rationale: దైవిక తీర్పుల సందర్భంలో πληγήకి సహజమైన బైబిలు తెలుగు సమానార్థకం; ‘దెబ్బలు’ కంటే ఈ సందర్భాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὰς ἐσχάτας
  choice: చివరివైన
  rationale: ఈ ఏడు తెగుళ్లు శ్రేణిలో చివరివని నేరుగా తెలియజేస్తుంది; ‘అంతిమమైన’ కంటే తక్కువ వ్యాఖ్యాత్మకం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ తెగుళ్లు చివరివి కావడానికి తరువాతి వాక్యం కారణం ఇస్తున్న causal సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν αὐταῖς
  choice: ఆ తెగుళ్లలో
  rationale: సర్వనామానికి సూచితమైన ‘తెగుళ్లు’ అనే నామాన్ని తెలుగులో స్పష్టపరుస్తూ ἐν యొక్క ‘లో’ భావాన్ని కాపాడుతుంది.
- source_word: ἐτελέσθη
  choice: పూర్తయింది
  rationale: τελέω యొక్క పూర్తికి చేరడం అనే భావాన్ని నిలుపుతుంది; కేవలం ఆగిపోయిందనే భావానికి పరిమితం చేయదు.
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: దేవుని ఉగ్రకోపం
  rationale: θυμόςలోని తీవ్రమైన దైవిక కోపం, తీర్పు బలాన్ని ఆధునిక తెలుగులో తెలియజేస్తుంది; అనవసరంగా దాన్ని మృదుపరచదు.
theological_decisions:
- issue: ప్రకటనాత్మక సందర్భంలోని దైవిక తీర్పు భాష
  choice: దేవుని ఉగ్రకోపం
  alternative: దేవుని కోపం
  rationale: θυμόςలోని తీవ్రతను నిలుపుతూ, మూలానికి మించి ప్రత్యేక సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: ἐτελέσθη ద్వారా దేవుని ఉగ్రకోపానికి చెప్పబడిన పూర్తి
  choice: పూర్తయింది
  alternative: ముగిసింది
  rationale: ఈ తెగుళ్లలో దేవుని ఉగ్రకోపం తన పూర్తికి చేరుతుందనే లక్ష్యసిద్ధి భావాన్ని నిలుపుతుంది; సమస్త తీర్పు గురించి వాక్యం చెప్పనిదాన్ని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటనాత్మక శైలిని ఉపయోగించాం. మూలంలోని దర్శన వాక్య నిర్మాణాన్ని గుర్తించగలిగేలా ఉంచుతూ, తెలుగులో పఠనసౌలభ్యం కోసం మొదటి వాక్యాన్ని విడదీశాం. ‘ఆ తెగుళ్లలో’ అనే రూపం గ్రీకు ἐν αὐταῖςను స్పష్టంగా నిలుపుతుంది.
