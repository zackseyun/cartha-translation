  yaml_path: translation/nt/revelation/015/005.yaml
  text: And after these things I saw[a], and the temple of the tabernacle of the testimony in heaven was opened[b],
translation:
  language: te
  text: మరియు ఈ సంగతుల తరువాత నేను చూశాను; పరలోకంలోని సాక్ష్యపు గుడారపు ఆలయం[a][b] తెరవబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆలయం’ (ναός) అనే పదాన్ని ‘పరిశుద్ధస్థలం’ అని కూడా అనువదించవచ్చు; అది విశాలమైన ఆలయ ప్రాంగణం కంటే లోపలి పవిత్ర భాగాన్ని ప్రత్యేకంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘సాక్ష్యపు గుడారం’ అనే మాట పాత నిబంధనలోని పరిశుద్ధ గుడార భాషను, ముఖ్యంగా అరణ్య ప్రయాణకాలంలో దేవుని నిబంధన సాక్ష్యంతో ముడిపడిన గుడారాన్ని, ప్రతిధ్వనింపజేస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: ఈ సంగతుల తరువాత
  rationale: అపోకలిప్టిక్ దర్శన కథనంలోని క్రమాన్ని సూచించే పదబంధం. ‘ఈ సంగతులు’ అని బహువచన భావాన్ని నిలిపి, తెలుగులో సహజమైన కథన అనుసంధానాన్ని ఇచ్చింది.
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: దర్శనంలో గ్రహించినదాన్ని నేరుగా తెలియజేస్తుంది; ‘నేను చూడసాగాను’ వంటి రూపం మూలంలో లేని కొనసాగింపు భావాన్ని చేర్చుతుంది.
- source_word: ἠνοίγη
  choice: తెరవబడింది
  rationale: అయోరిస్ట్ కర్మణి రూపంలోని సంఘటన భావాన్ని సహజమైన తెలుగు కర్మణి రూపంతో నిలిపింది.
- source_word: ὁ ναὸς
  choice: ఆలయం
  rationale: ναός ప్రత్యేకంగా ఆలయ అంతర్భాగమైన పరిశుద్ధ స్థలాన్ని సూచించగలిగినా, ప్రకటన గ్రంథంలోని ఆలయ భాషతో అనుసరణకోసం పరిచితమైన ‘ఆలయం’ వాడబడింది; ప్రత్యామ్నాయ సూక్ష్మార్థం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: τῆς σκηνῆς
  choice: గుడారపు
  rationale: అరణ్య ప్రయాణకాలంలోని దేవుని నివాస గుడారాన్ని గుర్తుచేసే ఆరాధనా నేపథ్యాన్ని కాపాడుతుంది. ‘గుడారం’ ఆధునిక పాఠకులకు అర్థమయ్యే సహజ పదం.
- source_word: τοῦ μαρτυρίου
  choice: సాక్ష్యపు
  rationale: పాత నిబంధనలో దేవుని నిబంధన సంబంధమైన సాక్ష్యంతో ముడిపడిన గుడారాన్ని సూచించే మార్మిక ఆరాధనా పదబంధాన్ని నిలిపింది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: ఆలయం భూమిపై కాక పరలోక పరిధిలో ఉందని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పరలోక పరిశుద్ధస్థలానికి సంబంధించిన ఆరాధనా చిత్రణ
  choice: ‘పరలోకంలో సాక్ష్యపు గుడారపు ఆలయం’ అనే పూర్తి పదబంధాన్ని నిలిపివేయడం
  alternative: ‘పరలోక పరిశుద్ధస్థలం’ అని సంక్షిప్తంగా భావానువాదం చేయడం
  rationale: గ్రీకు మూలంలోని వరుస షష్ఠీ సంబంధాలు ఆలయం, గుడారం, సాక్ష్యం అనే పాత నిబంధన ఆరాధనా ప్రతిధ్వనులను కలిపి ఉంచుతాయి. వాటిని ఒకే వ్యాఖ్యాత్మక పదంగా కుదించకుండా మూలంలోని చిత్రణనూ దాని ఉద్దేశపూర్వక ఉద్రిక్తతనూ కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని సాంద్రమైన ఆరాధనా పదబంధాన్ని సరళీకరించకుండా, తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేందుకు ద్విబిందువు ఉపయోగించబడింది.
