id: REV.15.7
reference: Revelation 15:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: te
  text: ఆ నాలుగు జీవులలో ఒకటి, యుగయుగాలూ[b] జీవించే దేవుని ఉగ్రతతో నిండిన ఏడు బంగారు పాత్రలను[a] ఆ ఏడుగురు దేవదూతలకు ఇచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏడు బంగారు గిన్నెలను’; గ్రీకు పదం వెడల్పైన, గిన్నెలాంటి పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘యుగముల యుగముల వరకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: ఆ నాలుగు జీవులలో ఒకటి
  rationale: ప్రకటన గ్రంథంలోని సింహాసన మందిరపు సజీవ ప్రాణులను సూచించే ζῷονకు ‘జీవులు’ సహజమైన, సందర్భోచితమైన పదం; θηρίονకు వాడే ‘మృగం’తో గందరగోళాన్ని నివారిస్తుంది.
- source_word: ἔδωκεν
  choice: ఇచ్చింది
  rationale: δίδωμι యొక్క భూతకాల క్రియను సూటిగా, సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς ἑπτὰ ἀγγέλοις
  choice: ఆ ఏడుగురు దేవదూతలకు
  rationale: దర్శన సందర్భంలో ἄγγελος పరలోక దేవదూతలను సూచిస్తుంది; గ్రీకు నిర్దిష్ట ఉపపదాన్ని ‘ఆ’తో ప్రతిబింబించాం.
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: ఏడు బంగారు పాత్రలను
  rationale: φιάλη వెడల్పైన, గిన్నెలాంటి పాత్రను సూచిస్తుంది. ‘పాత్రలు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, వాటి ఖచ్చిత ఆకారంపై అనవసర నిర్ధారణ చేయదు; χρυσᾶςను ‘బంగారు’గా తెలిపాం.
- source_word: γεμούσας τοῦ θυμοῦ τοῦ θεοῦ
  choice: దేవుని ఉగ్రతతో నిండిన
  rationale: γέμωతో వచ్చిన షష్ఠీ విభక్తి ‘నిండిన’ భావాన్ని ఇస్తుంది. ఇక్కడ θυμός అంత్యకాల దైవిక తీర్పులోని తీవ్రమైన కోపాన్ని సూచిస్తున్నందున ‘ఉగ్రత’ దాని బలాన్ని నిలుపుతుంది.
- source_word: τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాలు జీవించే
  rationale: వర్తమాన కృదంతమైన ζῶντος దేవునినే విశేషిస్తుంది; εἰς τοὺς αἰῶνας τῶν αἰώνων తెలిపే నిరంతర కాలాన్ని ‘యుగయుగాలు’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవిక θυμός పదబంధం
  choice: దేవుని ఉగ్రత
  alternative: దేవుని కోపం
  rationale: ‘ఉగ్రత’ ఈ అంత్యకాల తీర్పు సందర్భంలోని θυμός యొక్క తీవ్రతను నిలుపుతుంది; దాన్ని కేవలం భావోద్వేగంగా గానీ, ప్రత్యేక సిద్ధాంతపరమైన అర్థంతో గానీ విస్తరించదు.
- issue: దేవుని జీవితం మరియు నిత్యత్వం మధ్య వ్యాకరణ సంబంధం
  choice: యుగయుగాలు జీవించే దేవుడు
  alternative: జీవముగల దేవుడు, యుగయుగాలు
  rationale: గ్రీకులో τοῦ ζῶντος దేవునిని విశేషిస్తుండగా, తదనంతర కాలపదబంధం ఆయన జీవించడాన్ని సహజంగా నిర్దేశిస్తుంది. ఎంపిక చేసిన రూపం ఈ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడాం. ‘యుగయుగాలు’ బైబిలు సందర్భంలో సుపరిచితమైన నిత్యకాల ప్రయోగం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
