  terminology: “సంపద” naturally expresses πλοῦτος here. “ఓడాధిపతి,” “నావికులు,” and “సముద్రాన్ని ఆధారంగా చేసుకొని జీవనం సాగించేవారు” maintain the source’s distinctions without identifying the second group narrowly as passengers or merchants.
