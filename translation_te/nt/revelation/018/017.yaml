source:
  edition: SBLGNT
  text: ὅτι μιᾷ ὥρᾳ ἠρημώθη ὁ τοσοῦτος πλοῦτος. Καὶ πᾶς κυβερνήτης καὶ πᾶς ὁ ἐπὶ τόπον πλέων, καὶ ναῦται καὶ ὅσοι τὴν θάλασσαν ἐργάζονται, ἀπὸ μακρόθεν ἔστησαν
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/017.yaml
  text: for in one hour such great wealth has been laid waste. And every shipmaster, and everyone sailing to a place, and sailors, and as many as work the sea, stood far off
translation:
  language: te
  text: ఎందుకంటే ఒక్క గంటలోనే ఇంతటి సంపద నాశనమైంది.” ప్రతి ఓడాధిపతి, సముద్రమార్గంలో ఏదైనా గమ్యస్థానానికి ప్రయాణించే ప్రతి ఒక్కరూ[a], నావికులు, సముద్రాన్ని ఆధారంగా చేసుకొని జీవనం సాగించేవారందరూ దూరంగా నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏ ఓడరేవుకైనా ప్రయాణించే ప్రతి ఒక్కరూ” లేదా “ఎక్కడికైనా సముద్రమార్గంలో ప్రయాణించే ప్రతి ఒక్కరూ.” గ్రీకు పదబంధం నుడికారపూర్వకమైనది; సముద్రమార్గంలో గమ్యస్థానాలకు ప్రయాణించేవారిని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న విలాపానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; తెలుగులో సహజమైన కారణసూచక అనుసంధానం.
- source_word: μιᾷ ὥρᾳ
  choice: ఒక్క గంటలోనే
  rationale: కాల దత్తివిభక్తి భావాన్ని నిలుపుతూ తీర్పు అకస్మాత్తుగా సంభవించినదనే ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἠρημώθη
  choice: నాశనమైపోయింది
  rationale: పాడుచేయబడటం, శూన్యమవటం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; కర్మణి భావం ఫలితస్థితిలో నిలుస్తుంది.
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: ఇంతటి ఐశ్వర్యం
  rationale: τοσοῦτος లోని పరిమాణాత్మక ఉద్ఘాటనను, విలాపానికి తగిన గంభీర స్వరాన్ని కాపాడుతుంది.
- source_word: πᾶς κυβερνήτης
  choice: ప్రతి ఓడ నావికాధిపతి
  rationale: ఓడను నడిపే లేదా దానికి అధిపతిగా ఉండే వ్యక్తిని సూచిస్తుంది; సాధారణ ‘నావికుడు’తో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: ఏదో ఒక గమ్యస్థానానికి ఓడలో ప్రయాణించే ప్రతి ఒక్కరూ
  rationale: గ్రీకు నుడికారంలోని గమ్యస్థానానికి సముద్రయానం చేసే విస్తృత భావాన్ని నిలుపుతుంది; ప్రయాణికులు లేదా వర్తకులు అని అనవసరంగా కుదించదు.
- source_word: ναῦται
  choice: నావికులు
  rationale: ఆధునిక ప్రామాణిక తెలుగులో sailors కు స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: సముద్రంపై పనిచేసే వారందరూ
  rationale: నావికులకే పరిమితం కాని, సముద్రంతో ముడిపడిన శ్రమ లేదా వృత్తి చేసే విస్తృత వర్గాన్ని కాపాడుతుంది.
- source_word: ἀπὸ μακρόθεν
  choice: దూరంగా
  rationale: భయంతో లేదా జాగ్రత్తతో దూరం పాటించిన స్థితిని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: ἔστησαν
  choice: నిలబడ్డారు
  rationale: అనిశ్చితార్థక వివరణను జోడించకుండా aorist క్రియను సరళ కథన చర్యగా అందిస్తుంది.
theological_decisions:
- issue: బబులోను పతనంపై విలాపంలో పేర్కొన్న సముద్ర సంబంధిత వర్గాల పరిధి
  choice: ఓడ నావికాధిపతులు, గమ్యస్థానాలకు సముద్రయానం చేసేవారు, నావికులు, సముద్రంపై పనిచేసేవారు అనే వర్గాలను వేర్వేరుగా నిలుపడం
  alternative: అందరినీ కలిపి ‘సముద్రయానులు’గా అనువదించడం లేదా రెండవ వర్గాన్ని కేవలం ప్రయాణికులు/వర్తకులుగా నిర్ధారించడం
  rationale: గ్రీకు పాఠం అనేక సమన్విత వర్గాలను వరుసగా పేర్కొంటుంది. వాటి భేదాలను కాపాడడం బబులోను పతనంతో ప్రభావితమైన ఆర్థిక వలయపు విస్తృతిని చూపుతుంది; పాఠంలో లేని నిర్దిష్ట గుర్తింపును రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రకటన గ్రంథంలోని విలాపానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. వాక్యం మునుపటి సందర్భంలో మొదలైన ప్రత్యక్ష విలాపాన్ని ముగించే భాగమని ముగింపు ఉద్ధరణ చిహ్నం సూచిస్తుంది.
