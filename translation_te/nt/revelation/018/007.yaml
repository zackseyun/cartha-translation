id: REV.18.7
reference: Revelation 18:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: te
  text: ఆమె తనను తాను ఎంతగా మహిమపరచుకొని భోగవిలాసాల్లో జీవించిందో[a], అంతగా ఆమెకు యాతననూ శోకాన్నీ కలిగించండి. ఎందుకంటే ఆమె తన హృదయంలో, ‘నేను రాణిగా కూర్చున్నాను; నేను విధవరాలిని కాను; శోకాన్ని నేనెన్నటికీ చూడనే చూడను[b]’ అని అంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్వీయభోగంలో జీవించింది,’ లేదా ‘ఇంద్రియసుఖాల్లో జీవించింది.’ గ్రీకు క్రియ విలాసవంతమైన, విచ్చలవిడిగా స్వీయభోగానికి లోనైన జీవనాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఎన్నటికీ చూడనే చూడను’ అనే మాటలో గ్రీకులో బలమైన నిరాకరణ ఉంది; శోకం తనకు ఎప్పటికీ రాదనే ఆమె గట్టి ధీమాను ఇది వ్యక్తపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: ఎంతగా ... అంతగా
  rationale: గ్రీకులోని పరిమాణానుసారమైన ప్రతిఫల నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐδόξασεν αὑτὴν
  choice: తనను తాను మహిమపరచుకొని
  rationale: కర్త తనకే మహిమ ఆపాదించుకున్నదనే స్పష్టమైన ఆత్మోన్నతి భావాన్ని కాపాడుతుంది.
- source_word: ἐστρηνίασεν
  choice: భోగవిలాసాల్లో జీవించింది
  rationale: విలాసవంతమైన, స్వీయభోగాసక్తితో కూడిన జీవనాన్ని సూచిస్తుంది; సందర్భానికి లేని లైంగిక భావాన్ని అనవసరంగా చేర్చదు.
- source_word: δότε αὐτῇ
  choice: ఆమెకు ... కలిగించండి
  rationale: తెలుగులో యాతన, శోకం అనే రెండు కర్మలతో సహజంగా వినిపిస్తూ ఆజ్ఞార్థక న్యాయతీర్పు ధోరణిని నిలుపుతుంది.
- source_word: βασανισμὸν
  choice: యాతన
  rationale: తీర్పులోని తీవ్రమైన బాధను తెలియజేస్తుంది; కేవలం శారీరక హింసకే భావాన్ని పరిమితం చేయదు.
- source_word: πένθος
  choice: శోకం
  rationale: నష్టం లేదా తీర్పు వల్ల కలిగే దుఃఖభరితమైన విలాప భావాన్ని ఇస్తుంది; రెండు చోట్ల ఒకే పదాన్ని వాడి మూలంలోని పునరుక్తిని కాపాడుతుంది.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: ఆమె తన హృదయంలో ... అని అంటుంది
  rationale: అంతరంగంలోని గర్వపూరిత నిశ్చయాన్ని తెలిపే బైబిలీయ రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: Κάθημαι βασίλισσα
  choice: నేను రాణిగా కూర్చున్నాను
  rationale: రాజసింహాసన భద్రతను సూచించే కూర్చోవడం అనే వర్తమాన చిత్రాన్ని నిలుపుతుంది.
- source_word: χήρα οὐκ εἰμί
  choice: నేను విధవరాలిని కాను
  rationale: నష్టం, ఏకాకితనం తనకు రావనే ఆమె తప్పుడు ధీమాను వ్యక్తపరిచే స్త్రీరూపకాన్ని నేరుగా కాపాడుతుంది.
- source_word: οὐ μὴ ἴδω
  choice: నేనెన్నటికీ చూడనే చూడను
  rationale: οὐ μή అనే బలమైన నిరాకరణను తెలుగు పునరుక్తి ద్వారా స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: బబులోనును స్త్రీగా, రాణిగా, విధవరాలిగా వ్యక్తీకరించడం
  choice: స్త్రీలింగ వ్యక్తీకరణను ‘ఆమె,’ ‘రాణి,’ ‘విధవరాలు’ రూపాల్లో కొనసాగించడం
  alternative: నగరం లేదా ఆర్థిక వ్యవస్థగా మాత్రమే నిర్లింగంగా చెప్పడం
  rationale: గ్రీకు మూలం అంతటా స్త్రీలింగ వ్యక్తీకరణను కొనసాగిస్తుంది; గర్వోన్నతి నుంచి తీర్పుకు దారితీసే ప్రవచనాత్మక చిత్రానికి ఇది కేంద్రాంశం.
- issue: βασανισμός లోని తీర్పు భాష
  choice: యాతన
  alternative: హింస; బాధ
  rationale: తీర్పు తీవ్రతను నిలుపుతూ, మూలం చెప్పని నిర్దిష్టమైన శారీరక హింసా విధానాన్ని అనువాదం చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ప్రవచనాత్మక, న్యాయతీర్పు ధోరణి నిలుపబడింది. ‘తన హృదయంలో,’ ‘రాణిగా కూర్చున్నాను’ వంటి మూలచిత్రాలు అలాగే ఉంచబడ్డాయి; బలమైన నిరాకరణను ‘చూడనే చూడను’తో వ్యక్తపరిచాం.
