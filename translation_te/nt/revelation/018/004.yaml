revisions:
- from: 'అప్పుడు పరలోకం నుండి మరో స్వరం ఇలా చెప్పడం నేను విన్నాను: “నా ప్రజలారా, ఆమె పాపాల్లో మీరు పాలుపంచుకోకుండా, ఆమెకు కలిగే తెగుళ్లలో దేనినీ మీరు పొందకుండా ఉండేలా ఆమె నుండి బయటికి రండి.[a]”'
  to: 'మరియు పరలోకం నుండి మరో స్వరం ఇలా చెప్పడం నేను విన్నాను: “నా ప్రజలారా, మీరు ఆమె పాపాల్లో పాలుపంచుకోకుండా ఉండటానికి, ఆమె తెగుళ్లలో ఏదీ పొందకుండా ఉండటానికి ఆమె నుండి బయటికి రండి[a].”'
  rationale: The revision renders the initial Καὶ without adding a temporal meaning, retains the two purpose/warning clauses explicitly and coordinately, and removes the added specification «కలిగే» from the plagues. It also relocates the existing footnote anchor to the imperative it explains. No doctrinal or referential interpretation has been added.
  reviewer_model: gpt-5.6-terra
