review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the heavenly voice, the summons to leave, the covenantal address, participation in sins, and avoidance of the plagues. However, «అప్పుడు» adds a temporal sense not expressed by Καί, and «ఆమెకు కలిగే తెగుళ్లు» interpretively specifies that the plagues come upon her, whereas the Greek more simply says “her plagues.”
  naturalness: The revised wording is modern, clear Telugu. Repeating «ఉండటానికి» reflects the two coordinated ἵνα clauses without sounding unduly formal, and placing the footnote marker directly after the imperative makes its attachment clear.
  terminology: «పరలోకం», «మరో స్వరం», «నా ప్రజలారా», «పాపాల్లో పాలుపంచుకోవడం», and «తెగుళ్లు» are suitable modern-standard Telugu choices. Feminine «ఆమె» appropriately preserves Babylon’s personification without defining its referent beyond the text.
  issues:
  - severity: medium
    issue: «అప్పుడు» renders the opening conjunction.
    rationale: Καὶ means “and” here; it does not itself introduce the temporal sense “then.”
  - severity: medium
    issue: «ఆమెకు కలిగే తెగుళ్లు» adds an explicit interpretive relationship.
    rationale: ἐκ τῶν πληγῶν αὐτῆς says “from/among her plagues.” In context these are Babylon’s plagues, but the Greek does not explicitly say “plagues that come upon her.”
  - severity: low
    issue: The lexical-alternative footnote marker is placed at the end of the quotation rather than immediately after the translated imperative.
    rationale: Moving the marker to «బయటికి రండి» makes the footnote’s referent unambiguous.
