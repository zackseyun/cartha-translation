id: REV.18.4
reference: Revelation 18:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: te
  text: 'మరియు పరలోకం నుండి మరో స్వరం ఇలా చెప్పడం నేను విన్నాను: “నా ప్రజలారా, మీరు ఆమె పాపాల్లో పాలుపంచుకోకుండా ఉండటానికి, ఆమె తెగుళ్లలో ఏదీ పొందకుండా ఉండటానికి ఆమె నుండి బయటికి రండి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బయటికి రండి’ అని అనువదించిన గ్రీకు ఆజ్ఞను సందర్భాన్ని బట్టి ‘వెలుపలికి వెళ్లండి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: మరో స్వరం
  rationale: ముందటి స్వరానికి భిన్నమైన అదనపు స్వరాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: ఈ సందర్భంలో οὐρανός భౌతిక ఆకాశాన్ని కాక పరలోకాన్ని సూచిస్తుంది.
- source_word: Ἐξέλθατε ... ἐξ αὐτῆς
  choice: ఆమె నుండి బయటికి రండి
  rationale: బబులోనును స్త్రీగా వ్యక్తీకరించిన రూపకాన్ని ‘ఆమె’తో నిలుపుతూ, బహువచన ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ λαός μου
  choice: నా ప్రజలారా
  rationale: గ్రీకులోని సంబోధన భావాన్ని ఆధునిక తెలుగు సంబోధన రూపంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς
  choice: ఆమె పాపాల్లో మీరు పాలుపంచుకోకుండా
  rationale: συγκοινωνέωలోని భాగస్వామ్యం లేదా సహపాలిత్వ భావాన్ని ‘పాలుపంచుకో’ సహజంగా అందిస్తుంది.
- source_word: ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε
  choice: ఆమెకు కలిగే తెగుళ్లలో దేనినీ మీరు పొందకుండా
  rationale: ἐκ యొక్క భాగస్వీకరణ భావాన్ని ‘దేనినీ’ ద్వారా తెలియజేస్తూ, λάβητεను ‘పొందడం’గా అనువదిస్తుంది; ‘తెగుళ్లు’ ప్రకటన గ్రంథంలోని దైవిక తీర్పుల సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: αὐτῆς సూచించే బబులోను యొక్క స్త్రీ వ్యక్తీకరణ
  choice: ‘ఆమె’ అనే స్త్రీలింగ సర్వనామాన్ని నిలుపడం
  alternative: నగరం లేదా వ్యవస్థను ప్రధానంగా చూపేందుకు ‘దాని’ అని అనువదించడం
  rationale: ప్రకటన గ్రంథం బబులోనును స్త్రీగానూ నగరంగానూ చిత్రిస్తుంది. ‘ఆమె’ అనడం ఆ సాహిత్య రూపకాన్ని వ్యాఖ్యానాత్మకంగా తటస్థీకరించకుండా కాపాడుతుంది.
- issue: రెండు ἵνα μὴ ఉపవాక్యాల సంబంధం
  choice: రెండింటినీ ‘...కుండా ...కుండా ఉండేలా’ అనే సమన్విత ఉద్దేశం/హెచ్చరికగా చూపడం
  alternative: రెండవదాన్ని మొదటిదానికి వివరణగా చూపడం లేదా ‘లేకపోతే’ అని అనువదించడం
  rationale: పునరుక్తమైన ἵνα నిర్మాణం పాపాల్లో భాగస్వామ్యం కాకపోవడం, తెగుళ్లలో భాగం పొందకపోవడం అనే రెండు అనుసంధానిత ఉద్దేశాలను లేదా హెచ్చరికలను ఉద్ఘాటిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. బబులోను అనే స్త్రీ/నగర వ్యక్తీకరణను ‘ఆమె’తో నిలిపి, గ్రీకు వాక్యంలోని రెండు సమన్విత హెచ్చరికలను సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేశాం.
