review_pass:
  verdict: revise
  source_fidelity: 'The summons to heaven and to the holy ones, apostles, and prophets is accurately represented. The final clause, however, uses the Telugu idiom “తీర్పును ... తీర్చాడు” in a way that is not clear: it can sound as though God rendered the audience''s own judgment, while “ఆమెనుండి” does not naturally convey the judicial relation intended by the compressed Greek ἐξ αὐτῆς. A minimally explicating judicial formulation is needed in Telugu.'
  naturalness: The opening vocatives and paired imperatives are natural, elevated modern Telugu. “దేవుడు మీ తీర్పును ఆమెనుండి తీర్చాడు” is syntactically possible only with difficulty and is not idiomatic enough for public reading. “ఆమె విషయమై” is understandable, though “ఆమెను బట్టి” more directly conveys rejoicing over her fall.
  terminology: “పరలోకం,” “పరిశుద్ధులు,” “అపొస్తలులు,” and “ప్రవక్తలు” are appropriate established terms. “మీ పక్షాన” gives the judicial-benefactive force without introducing a denominational claim or making the main text say explicit revenge.
  issues:
  - severity: medium
    issue: The final judicial expression is unnatural and potentially misleading in Telugu.
    rationale: “మీ తీర్పును ఆమెనుండి తీర్చాడు” is a calque that does not clearly express God's adjudication of the addressees' case in relation to her. Telugu requires a clearer case relation; “ఆమెకు వ్యతిరేకంగా మీ పక్షాన తీర్పు తీర్చాడు” retains judicial language while supplying only what the Greek construction and context entail.
  - severity: low
    issue: The footnote's revenge alternative is awkwardly phrased.
    rationale: “ఆమెపై మీకు ప్రతీకారం తీర్చాడు” is less idiomatic than “మీ కోసం ఆమెపై ప్రతీకారం తీర్చాడు.” The explanatory note should also distinguish the more literal compressed form from interpretive alternatives.
  revised_text: పరలోకమా, ఆమెను బట్టి సంతోషించు! పరిశుద్ధులూ, అపొస్తలులూ, ప్రవక్తలూ, మీరూ సంతోషించండి! ఎందుకంటే దేవుడు ఆమెకు వ్యతిరేకంగా మీ పక్షాన తీర్పు తీర్చాడు.[a]
