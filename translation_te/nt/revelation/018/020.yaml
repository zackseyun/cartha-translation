id: REV.18.20
reference: Revelation 18:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: te
  text: పరలోకమా, ఆమెను బట్టి సంతోషించు! పరిశుద్ధులూ, అపొస్తలులూ, ప్రవక్తలూ, మీరూ సంతోషించండి! ఎందుకంటే దేవుడు ఆమెకు వ్యతిరేకంగా మీ పక్షాన తీర్పు తీర్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత భావవివరణగా: “దేవుడు మీ కోసం ఆమెకు తీర్పు విధించాడు” లేదా “దేవుడు మీ కోసం ఆమెపై ప్రతీకారం తీర్చాడు.” గ్రీకు వాక్యం సంక్షిప్తంగా ఉంది; అక్షరార్థానికి దగ్గరగా, “దేవుడు ఆమెనుండి మీ తీర్పును తీర్చాడు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐφραίνου
  choice: సంతోషించు
  rationale: ఇది రెండవ పురుష ఏకవచన ఆజ్ఞార్థకం; పరలోకాన్ని నేరుగా సంబోధిస్తూ ఆనందించమనే పిలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπ’ αὐτῇ
  choice: ఆమె విషయమై
  rationale: ἐπί + దత్తివు ఇక్కడ సంతోషానికి విషయాన్ని లేదా సందర్భాన్ని సూచిస్తుంది. ‘ఆమె విషయమై’ అనేది ఆమె పతనాన్ని బట్టి కలిగే ఆనందాన్ని తెలిపినా, కారణార్థాన్ని అతిగా విప్పదు.
- source_word: οὐρανέ
  choice: పరలోకమా
  rationale: ఏకవచన సంబోధనను నిలుపుతూ, వ్యక్తీకరించబడిన పరలోకానికి ఇచ్చిన గంభీరమైన పిలుపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ἅγιοι
  choice: పరిశుద్ధులు
  rationale: ప్రకటన గ్రంథంలో దేవునికి చెందిన పరిశుద్ధ ప్రజలను సూచించే స్థిరమైన, గౌరవప్రదమైన పదం.
- source_word: οἱ ἀπόστολοι
  choice: అపొస్తలులు
  rationale: ప్రవక్తలతోపాటు ఉన్న సందర్భంలో సాంకేతిక భావమే బలంగా ఉంది; ‘దూతలు’ అని అనువదిస్తే ఆ భావం మసకబారుతుంది.
- source_word: οἱ προφῆται
  choice: ప్రవక్తలు
  rationale: προφῆταιకి ప్రామాణికమైన, స్పష్టమైన తెలుగు సమానం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: సంతోషించమనే ఆజ్ఞకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: ἔκρινεν
  choice: తీర్చాడు
  rationale: న్యాయపరమైన తీర్పు క్రియను సూచిస్తూ κρίμαతో ఉన్న మూలభాషా పదబంధ సంబంధాన్ని తెలుగులో కొంతవరకు నిలుపుతుంది.
- source_word: τὸ κρίμα ὑμῶν
  choice: మీ తీర్పును
  rationale: ‘మీకు సంబంధించిన తీర్పు/మీ పక్షాన తీర్పు’ అనే సంక్షిప్తమైన, కొంత సందిగ్ధమైన గ్రీకు నిర్మాణాన్ని వ్యాఖ్యానాత్మకంగా పూర్తిగా విప్పకుండా నిలుపుతుంది.
- source_word: ἐξ αὐτῆς
  choice: ఆమెనుండి
  rationale: ἐξ అనే పూర్వప్రత్యయాన్ని నేరుగా ప్రతిబింబిస్తూ, బబులోను నుండి తీర్పు రాబట్టబడిందా లేక ఆమెకు వ్యతిరేకంగా తీర్పు జరిగిందా అనే మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
theological_decisions:
- issue: పరిశుద్ధుల పక్షాన బబులోనుపై దేవుడు చేసిన న్యాయచర్యను ఎంత స్పష్టంగా విప్పి చెప్పాలి
  choice: ‘దేవుడు మీ తీర్పును ఆమెనుండి తీర్చాడు’ అనే సంక్షిప్త న్యాయపరమైన పదబంధాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘దేవుడు మీ నిమిత్తం ఆమెకు తీర్పు తీర్చాడు’ లేదా ‘దేవుడు ఆమెపై మీకు ప్రతీకారం తీర్చాడు’
  rationale: గ్రీకులో ప్రతీకారాన్ని స్పష్టంగా చెప్పే క్రియ కాకుండా κρίνω/κρίμα అనే ఒకే మూలానికి చెందిన న్యాయపరమైన పదాలు ఉన్నాయి. భావంలో సమర్థన లేదా ప్రతిఫలం ఉండవచ్చు; అయితే దానిని ప్రధాన పాఠ్యంలో పూర్తిగా విప్పితే మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తత తొలగిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటన-శైలిని ఉపయోగించాం. గ్రీకులోని ఏకవచన ఆజ్ఞ మొదట పరలోకాన్ని ఉద్దేశిస్తుంది; తరువాతి బహువచన సమూహాలకు తెలుగులో సహజంగా వినిపించేందుకు ‘మీరూ సంతోషించండి’ అని పునరుక్తి చేశాం. ప్రధాన పాఠ్యంలో క్లిష్టమైన న్యాయపరమైన నిర్మాణాన్ని ఉద్దేశపూర్వకంగా నిలిపి, సహజమైన భావవివరణలను పాదసూచికలో ఇచ్చాం.
