revisions:
- from: పరలోకమా, ఆమె విషయమై సంతోషించు! పరిశుద్ధులూ అపొస్తలులూ ప్రవక్తలూ, మీరూ సంతోషించండి! ఎందుకంటే దేవుడు మీ తీర్పును ఆమెనుండి తీర్చాడు.[a]
  to: పరలోకమా, ఆమెను బట్టి సంతోషించు! పరిశుద్ధులూ, అపొస్తలులూ, ప్రవక్తలూ, మీరూ సంతోషించండి! ఎందుకంటే దేవుడు ఆమెకు వ్యతిరేకంగా మీ పక్షాన తీర్పు తీర్చాడు.[a]
  rationale: The revision replaces an opaque Telugu calque with an idiomatic judicial expression. “మీ పక్షాన” represents the genitive relation in τὸ κρίμα ὑμῶν without asserting more than divine adjudication on behalf of the addressed groups, and “ఆమెకు వ్యతిరేకంగా” makes the judicial target intelligible. The footnote retains the source's compressed wording and offers the avenging sense only as an interpretive alternative.
