id: REV.18.24
reference: Revelation 18:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: te
  text: ఆమెలో ప్రవక్తల, పరిశుద్ధుల[a], భూమిమీద వధించబడిన వారందరి రక్తం కనుగొనబడింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పవిత్రుల’ లేదా ‘దేవుని పరిశుద్ధ ప్రజల’.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆమె’ అనేది చుట్టుపక్కల దర్శనంలో స్త్రీగా చిత్రించబడిన బబులోనును సూచిస్తుంది. ‘వధించబడిన’ అని అనువదించిన గ్రీకు క్రియ సాధారణంగా ‘చంపబడిన’ కంటే బలమైనది; అది క్రూరంగా హతమార్చబడినవారనే భావాన్ని కూడా తెలియజేయగలదు.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: ఆమెలో
  rationale: స్త్రీలింగ సర్వనామం సందర్భంలోని స్త్రీగా చిత్రించబడిన బబులోనును సూచిస్తుంది; వ్యక్తీకరణను నిలుపుతుంది.
- source_word: αἷμα
  choice: రక్తం
  rationale: మూలపదానికి సహజమైన ప్రత్యక్ష అర్థం; సందర్భంలో రక్తపాత దోషారోపణ భావాన్నీ మోస్తుంది.
- source_word: προφητῶν
  choice: ప్రవక్తల
  rationale: προφήτης పదానికి ప్రామాణికమైన, సహజమైన తెలుగు రూపం.
- source_word: ἁγίων
  choice: పరిశుద్ధుల
  rationale: ప్రకటన గ్రంథంలో దేవునికి ప్రతిష్ఠించబడిన ప్రజలను సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపం.
- source_word: εὑρέθη
  choice: కనిపించింది
  rationale: కర్తరి భావాన్ని చొప్పించకుండా, కనుగొనబడిన లేదా బయటపడిన న్యాయపరమైన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: πάντων τῶν ἐσφαγμένων
  choice: వధించబడిన వారందరి
  rationale: σφάζω సాధారణంగా చంపడం కంటే బలమైన హింసాత్మక అర్థాన్ని కలిగి ఉంది; ‘వధించబడిన’ ఆ తీవ్రతను గౌరవప్రదమైన భాషలో నిలుపుతుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: ప్రకటన గ్రంథంలోని విస్తృత అపోకలిప్టిక్ సందర్భంలో γῆకి ‘భూమి’ అనేది తగిన అర్థం.
theological_decisions:
- issue: బబులోను దోషపు పరిధి
  choice: ప్రవక్తలు, పరిశుద్ధులు, భూమిమీద వధించబడిన వారందరి రక్తానికి బబులోను బాధ్యురాలిగా చూపే సమగ్ర న్యాయపరమైన ఆరోపణను యథాతథంగా ఉంచడం.
  alternative: చివరి మాటను సమస్త నీతిమంతుల రక్తపాతానికి బబులోను ప్రతినిధిగా నిలిచే అతిశయోక్తి భాషగా లేదా దర్శనంలోని ప్రతీకాత్మక పరిధిలో అక్షరార్థ సార్వత్రిక బాధ్యతగా గ్రహించవచ్చు.
  rationale: గ్రీకు వాక్యం ఈ ఆరోపణ చరిత్రకు ఎలా వర్తిస్తుందో పరిమితం చేయదు; కాబట్టి అనువాదం దాని విస్తృతిని కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘రక్తమూ’ అనే పదాన్ని ప్రతి వర్గంతో పునరుక్తి చేయడం తెలుగు వాక్య స్పష్టతను పెంచుతుంది; మూలంలోని సమగ్ర ఆరోపణను మార్చదు. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
