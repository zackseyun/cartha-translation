revisions:
- from: దీపపు వెలుగు ఇక ఎన్నటికీ నీలో ప్రకాశించదు; పెండ్లికుమారుని, పెండ్లికుమార్తె స్వరం ఇక ఎన్నటికీ నీలో వినబడదు. ఎందుకంటే నీ వర్తకులు భూమిపై గొప్పవారుగా ఉన్నారు[a]; నీ మంత్రవిద్యచేత[b] సమస్త జనులు దారితప్పించబడ్డారు.
  to: దీపపు వెలుగు ఇక ఎన్నటికీ నీలో ప్రకాశించదు; వరుడి, వధువు స్వరం ఇక ఎన్నటికీ నీలో వినబడదు. ఎందుకంటే నీ వర్తకులు భూమిలోని గొప్పవారు[a]; ఎందుకంటే నీ మంత్రవిద్యచేత[b] అన్ని జనాంగాలు దారితప్పించబడ్డాయి.
  rationale: The revision preserves the draft's strengths while restoring the collective meaning of ἔθνη, more directly reflecting τῆς γῆς, making both Greek causal clauses explicit, and smoothing the wedding-voice expression into natural modern standard Telugu. Footnote anchors remain attached to the corresponding lexical terms.
  reviewer_model: gpt-5.6-terra
