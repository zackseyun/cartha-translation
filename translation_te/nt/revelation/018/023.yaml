review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the lamp-light, the emphatic and final negations, Babylon''s direct second-person address, merchants, and sorcery. Two details need correction: οἱ μεγιστᾶνες τῆς γῆς is more precisely ‘the great/powerful people of the earth’ than ‘great on the earth,’ and πάντα τὰ ἔθνη refers to all the nations/peoples, not simply all individuals (‘సమస్త జనులు’). The second causal ὅτι is also best made explicit.'
  naturalness: The wording is generally modern and suitably elevated. ‘వరుడి, వధువు స్వరం’ is more natural contemporary Telugu than the unevenly inflected ‘పెండ్లికుమారుని, పెండ్లికుమార్తె స్వరం.’
  terminology: ‘మంత్రవిద్య’ is a sound, broad rendering of φαρμακεία in this context. ‘అన్ని జనాంగాలు’ preserves the collective sense of ἔθνη without restricting it to modern nation-states. ‘భూమిలోని గొప్పవారు’ retains the breadth of μεγιστᾶνες.
  issues:
  - severity: medium
    issue: ‘సమస్త జనులు’ renders πάντα τὰ ἔθνη as individual people rather than nations/peoples.
    rationale: ἔθνη is collective and should retain the sense of nations or peoples in Revelation's international imagery.
  - severity: low
    issue: ‘భూమిపై గొప్పవారుగా’ can suggest that the merchants were great merely by location or status ‘on earth.’
    rationale: The genitive τῆς γῆς is more directly represented by ‘భూమిలోని గొప్పవారు,’ meaning the earth's prominent people.
  - severity: low
    issue: The bridegroom-and-bride phrase is stylistically uneven, and the second causal clause is not explicitly marked.
    rationale: ‘వరుడి, వధువు స్వరం’ is idiomatic modern Telugu; adding ‘ఎందుకంటే’ reflects the second ὅτι and preserves the verse's causal structure.
  revised_text: దీపపు వెలుగు ఇక ఎన్నటికీ నీలో ప్రకాశించదు; వరుడి, వధువు స్వరం ఇక ఎన్నటికీ నీలో వినబడదు. ఎందుకంటే నీ వర్తకులు భూమిలోని గొప్పవారు[a]; ఎందుకంటే నీ మంత్రవిద్యచేత[b] అన్ని జనాంగాలు దారితప్పించబడ్డాయి.
  revised_footnotes:
