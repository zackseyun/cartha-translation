id: REV.18.23
reference: Revelation 18:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: te
  text: దీపపు వెలుగు ఇక ఎన్నటికీ నీలో ప్రకాశించదు; వరుడి, వధువు స్వరం ఇక ఎన్నటికీ నీలో వినబడదు. ఎందుకంటే నీ వర్తకులు భూమిలోని గొప్పవారు[a]; ఎందుకంటే నీ మంత్రవిద్యచేత[b] అన్ని జనాంగాలు దారితప్పించబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భూమిలోని ప్రముఖులు.’ గ్రీకు పదం గొప్ప ప్రాముఖ్యత లేదా అధికారం గలవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ మాంత్రిక కళలచేత’ లేదా ‘నీ క్షుద్రవిద్యచేత.’ గ్రీకు φαρμακεία మంత్రవిద్యను లేదా మాయాజాలంతో చేసే వంచనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: దీపపు వెలుగు
  rationale: λύχνοςకు సందర్భానుకూలమైన సాధారణ తెలుగు పదం ‘దీపం’; సంబంధార్థక నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: ఇక ఎన్నటికీ ... ప్రకాశించదు
  rationale: οὐ μή అనే బలమైన నిరాకరణను, ἔτι సూచించే ఇకపై సంభవించకపోవడాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν σοὶ
  choice: నీలో
  rationale: బబులోనును వ్యక్తిగా సంబోధించే గ్రీకు ద్వితీయ పురుష ప్రయోగాన్ని నేరుగా నిలుపుతుంది.
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: పెండ్లికుమారుని, పెండ్లికుమార్తె స్వరం
  rationale: φωνή యొక్క ‘స్వరం’ అనే భావాన్ని, ప్రవచనాత్మక తీర్పు ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: ఇక ఎన్నటికీ ... వినబడదు
  rationale: గ్రీకులోని బలమైన నిరాకరణను, కర్మణి రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οἱ ἔμποροί σου
  choice: నీ వర్తకులు
  rationale: ప్రకటన 18లోని వాణిజ్య సందర్భానికి సరిపోయే గౌరవప్రదమైన, సుపరిచితమైన పదం.
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: భూమిపై గొప్పవారు
  rationale: రాజకీయ కులీనులకో వ్యాపార ధనవంతులకో మాత్రమే పరిమితం చేయకుండా ప్రాముఖ్యత, అధికారమనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: నీ మంత్రవిద్యచేత
  rationale: φαρμακεία సూచించే మాంత్రిక లేదా వశీకరణ ఆచారాల భావాన్ని ఆధునిక ఔషధాల అర్థానికి పరిమితం చేయకుండా తెలియజేస్తుంది.
- source_word: ἐπλανήθησαν
  choice: దారితప్పించబడ్డారు
  rationale: πλανάω యొక్క దారితప్పించడం అనే భావాన్ని, గ్రీకు కర్మణి రూపాన్ని కాపాడుతుంది.
- source_word: πάντα τὰ ἔθνη
  choice: సమస్త జనులు
  rationale: ఇక్కడ ἔθνη ప్రపంచంలోని ప్రజాసమూహాలను సూచిస్తుంది; ‘సమస్త జనులు’ ఆ సమగ్రతను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అంత్యకాల తీర్పు సందర్భంలో φαρμακεία అనువాదం
  choice: మంత్రవిద్య
  alternative: మాంత్రిక కళలు; క్షుద్రవిద్య
  rationale: ఈ పదంలో మంత్రాలు, మాయా ఆచారాలు, వాటి ద్వారా కలిగే వంచన అనే విస్తృత భావం ఉంది. ‘మంత్రవిద్య’ దానిని కేవలం ఔషధ వినియోగంగా మార్చదు; ‘క్షుద్రవిద్య’ కంటే తక్కువగా అర్థాన్ని సంకుచితం చేస్తుంది.
- issue: రెండుసార్లు వచ్చిన οὐ μή నిర్మాణాల బలం
  choice: ఇక ఎన్నటికీ ... కాదు
  alternative: ఇకపై ... కాదు; నిశ్చయంగా ... కాదు
  rationale: బబులోనుపై తీర్పు తిరుగులేనిదని తెలిపే బలమైన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచనాత్మక శైలిని ఉపయోగించాం. బబులోనును నేరుగా సంబోధించే ‘నీలో/నీ’ రూపాలను నిలిపాం. పునరుక్త నిర్మాణం తీర్పు యొక్క సంపూర్ణతను బలపరుస్తుంది.
