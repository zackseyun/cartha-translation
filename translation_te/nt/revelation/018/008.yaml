id: REV.18.8
reference: Revelation 18:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: te
  text: 'అందుచేత ఒకే రోజున ఆమె విపత్తులు వస్తాయి: మరణం, దుఃఖం, కరవు; ఆమె అగ్నిలో పూర్తిగా దహింపబడుతుంది. ఎందుకంటే ఆమెకు తీర్పు విధించిన ప్రభువైన దేవుడు శక్తిమంతుడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుచేత
  rationale: ముందటి వాక్యంలోని ఆమె అతిశయానికి, రాబోయే తీర్పుకు మధ్య ఉన్న కారణసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: ఒక్క రోజులోనే
  rationale: తీర్పు ఆకస్మికంగా, స్వల్పకాలంలో సంభవిస్తుందనే గ్రీకు పదబంధంలోని బలాన్ని నిలుపుతుంది.
- source_word: πληγαὶ
  choice: తెగుళ్లు
  rationale: ప్రకటన గ్రంథంలోని దైవిక విపత్తులు లేదా దెబ్బలు అనే భావానికి సాధారణ పాఠకులకు అర్థమయ్యే సాంప్రదాయిక పదం.
- source_word: πένθος
  choice: దుఃఖం
  rationale: మరణం వల్ల కలిగే శోకం లేదా విలాపం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λιμός
  choice: కరవు
  rationale: ఆహార కొరతతో కూడిన famine భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: అగ్నిలో పూర్తిగా కాల్చివేయబడుతుంది
  rationale: κατακαίωలోని పూర్తిగా దహనం చేయడం అనే తీవ్రతను, భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: ἰσχυρὸς
  choice: బలవంతుడు
  rationale: ‘శక్తిమంతుడు’ అని విస్తరించకుండా, మూలంలోని ‘strong’ భావాన్ని నేరుగా మరియు గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ κρίνας αὐτήν
  choice: ఆమెకు తీర్పు తీర్చిన
  rationale: ఆమెపై తీర్పు ప్రకటించి అమలు చేసిన దేవుని న్యాయచర్యను గ్రీకు aorist participleకు అనుగుణంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని బలమే తీర్పు నెరవేరడానికి కారణమని తెలిపే ὅτι సంబంధం
  choice: ఎందుకంటే ఆమెకు తీర్పు తీర్చిన ప్రభువైన దేవుడు బలవంతుడు
  alternative: ఆమెకు తీర్పు తీర్చిన ప్రభువైన దేవుడు శక్తిమంతుడు గనుక
  rationale: కారణార్థాన్ని స్పష్టంగా ఉంచుతూ, మూలంలోని పదక్రమపు ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; దేవుని బలం తీర్పు నిశ్చితత్వానికి ఆధారమనే ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ‘ఒక్క రోజులో’ అన్నది అక్షరార్థ దినమా లేక ఆకస్మికతకు ప్రతీకా
  choice: ఒక్క రోజులోనే
  alternative: ఒకే రోజున
  rationale: పాఠ్యంలో ఉన్న కాలవ్యక్తీకరణను యథాతథంగా ఉంచి, దాని ప్రతీకాత్మక లేదా అక్షరార్థ వ్యాఖ్యానాన్ని అనువాదంలో నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన అపోకలిప్టిక్ స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం వాడబడింది. స్త్రీలింగ ఏకవచన సూచనలను ‘ఆమె’గా నిలిపి, బబులోను నగరానికి చేసిన వ్యక్తీకరణను కాపాడింది.
