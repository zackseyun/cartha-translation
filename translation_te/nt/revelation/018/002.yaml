  rationale: The revision is limited to clarity and idiomatic modern Telugu. It retains the SBLGNT wording, including the repeated fall proclamation, the generic ‘beast,’ and the lexical ambiguity of φυλακή in the footnote. No interpretive or doctrinal expansion has been introduced.
