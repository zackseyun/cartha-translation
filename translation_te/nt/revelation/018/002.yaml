- from: 'అతడు బలమైన స్వరంతో కేకవేసి ఇలా అన్నాడు: “పడిపోయింది, పడిపోయింది మహా బబులోను! అది దయ్యాలకు నివాసంగా, ప్రతి అపవిత్రాత్మకు నిర్బంధ స్థలంగా[a], ప్రతి అపవిత్ర పక్షికి నిర్బంధ స్థలంగా, అపవిత్రమైనదీ అసహ్యించుకోబడినదీ అయిన ప్రతి మృగానికి నిర్బంధ స్థలంగా[b] మారింది.”'
