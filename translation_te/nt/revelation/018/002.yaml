id: REV.18.2
reference: Revelation 18:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: te
  text: 'అతడు బలమైన స్వరంతో కేక వేసి ఇలా అన్నాడు: “పడిపోయింది, పడిపోయింది, మహా బబులోను! అది దయ్యాలకు నివాసస్థలంగా, ప్రతి అపవిత్ర ఆత్మకు నిర్బంధ స్థలంగా[a], ప్రతి అపవిత్ర పక్షికి నిర్బంధ స్థలంగా, ప్రతి అపవిత్రమైన, అసహ్యించబడిన మృగానికి నిర్బంధ స్థలంగా[b] మారింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి అపవిత్ర ఆత్మకు … ప్రతి అపవిత్ర పక్షికి … ప్రతి అపవిత్రమైన, అసహ్యించబడిన మృగానికి నివసించే లేదా తరచూ సంచరించే చోటుగా.” “నిర్బంధ స్థలం” అని అనువదించిన గ్రీకు పదం, నివాసంగా లేదా తరచూ వచ్చే ప్రదేశంగా కూడా అర్థమవవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో “ప్రతి అపవిత్రమైన, అసహ్యించబడిన మృగానికి నిర్బంధ స్థలంగా” అనే మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: ἔκραξεν
  choice: కేకవేసి
  rationale: కράζω బిగ్గరగా కేకవేయడాన్ని సూచిస్తుంది. ‘కేకవేసి’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని తీవ్రతను నిలుపుతుంది.
- source_word: ἐν ἰσχυρᾷ φωνῇ
  choice: బలమైన స్వరంతో
  rationale: ఈ పదబంధం విధానాన్ని సూచిస్తుంది. ‘బలమైన’ అనేది ἰσχυρᾷ యొక్క శక్తి భావాన్ని కేవలం ‘బిగ్గరగా’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: పడిపోయింది, పడిపోయింది
  rationale: పునరుక్తిని యథాతథంగా ఉంచి, ప్రవచనాత్మక తీర్పు ప్రకటనలోని గంభీరమైన లయను కాపాడుతుంది.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: మహా బబులోను
  rationale: గ్రీకు పదబంధంలోని బిరుదు భావాన్ని సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: ἐγένετο
  choice: మారింది
  rationale: పతనం తరువాత ఏర్పడిన ఫలిత స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κατοικητήριον
  choice: నివాసం
  rationale: నివసించే ప్రదేశం అనే మూలార్థాన్ని స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా అందిస్తుంది.
- source_word: δαιμονίων
  choice: దయ్యాలు
  rationale: ఇది సాధారణంగా దుష్ట ఆత్మలను కాక ప్రత్యేకంగా demons‌ను సూచించే నామవాచకం; ‘దయ్యాలు’ తెలుగులో నేరుగా, సులభంగా అర్థమయ్యే సమానార్థకం.
- source_word: φυλακὴ
  choice: నిర్బంధ స్థలం
  rationale: φυλακήకి చెరసాల, కాపలా, ఉంచబడే ప్రదేశం అనే అర్థపరిధి ఉంది. ‘నిర్బంధ స్థలం’ ఇక్కడి confinement భావాన్ని నిలుపుతూ, ఆత్మలు, పక్షులు, మృగాలు అన్నింటితో సహజంగా అనుసంధానమవుతుంది; నివాసం లేదా సంచరించే చోటు అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: ప్రతి అపవిత్రాత్మ
  rationale: ‘అపవిత్ర’ అనే పదం బైబిలు సంబంధమైన శుద్ధి–అశుద్ధి భావాన్ని నిలుపుతుంది.
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: ప్రతి అపవిత్ర పక్షి
  rationale: ὄρνεον సాధారణంగా పక్షిని సూచిస్తుంది; మూలంలో లేని రాబందు లేదా మాంసాహారి పక్షి అనే ప్రత్యేకీకరణను చేర్చలేదు.
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: అపవిత్రమైనదీ అసహ్యించుకోబడినదీ అయిన ప్రతి మృగం
  rationale: θηρίονను ఇక్కడ సాధారణ జంతువు/మృగం అనే భావంలో తీసుకున్నాం. μεμισημένουలోని కర్మణి, ఫలిత స్థితి భావాన్ని ‘అసహ్యించుకోబడినది’ నిలుపుతుంది.
theological_decisions:
- issue: θηρίουను ప్రకటన గ్రంథంలోని ప్రత్యేక ‘మృగం’గా తీసుకోవాలా, సాధారణ నామవాచకంగా తీసుకోవాలా
  choice: సాధారణ నామవాచకమైన ‘ప్రతి మృగం’
  alternative: ప్రత్యేక అంత్యకాల విరోధిని సూచించే ‘మృగం’
  rationale: ఇక్కడ θηρίουకు παντός ఉంది; అది ‘ప్రతి అపవిత్రాత్మ,’ ‘ప్రతి అపవిత్ర పక్షి’లతో సమాంతర జాబితాలో వస్తుంది. కాబట్టి ప్రత్యేక ప్రతీకాత్మక విరోధికన్నా సాధారణ జంతువుల భావమే వాక్యనిర్మాణానికి సరిపోతుంది.
- issue: అపోకలిప్టిక్ తీర్పు దృశ్యంలో φυλακή అర్థం
  choice: నిర్బంధ స్థలం
  alternative: నివాసం లేదా సంచరించే చోటు
  rationale: ఈ పదం చెరసాల, కాపలా, ఉంచే ప్రదేశం, నివసించే లేదా తరచుగా వచ్చే చోటు వంటి అర్థాలను పొందగలదు. ప్రధాన పాఠంలో నిర్బంధ భావాన్ని ఉంచి, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటనాత్మక శైలిని పాటించాం. ‘పడిపోయింది, పడిపోయింది’ అనే పునరుక్తిని ప్రవచనాత్మక లయ కోసం నిలిపాం. అరుదైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం; φυλακήలోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో స్పష్టంచేశాం.
