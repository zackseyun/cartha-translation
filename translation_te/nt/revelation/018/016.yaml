- from: 'ఇలా అంటున్నారు[a]: “అయ్యో, అయ్యో! సన్నని నారబట్టను, ఊదారంగు వస్త్రాన్ని, ఎర్రని వస్త్రాన్ని ధరించి, బంగారంతో, విలువైన రాళ్లతో, ముత్యాలతో అలంకరించుకున్న మహానగరమా!”'
  to: 'ఇలా అంటున్నారు[a]: “సన్నని నారవస్త్రం, ఊదా రంగు వస్త్రం, ఎర్రని వస్త్రం ధరించి, బంగారంతో, విలువైన రాళ్లతో, ముత్యాలతో అలంకరించబడిన ఆ గొప్ప నగరానికి అయ్యో, అయ్యో!”'
  rationale: నగరాన్ని సంబోధనగా కాక విలాపానికి గురైన నగరంగా చూపేందుకు మహానగరమా స్థానంలో ఆ గొప్ప నగరానికి అయ్యో, అయ్యో అని మార్చాం. κεχρυσωμένη యొక్క కర్మణి, సంపూర్ణ స్థితిని ప్రతిబింబించేందుకు అలంకరించుకున్న స్థానంలో అలంకరించబడిన వాడాం. రంగుల పదాలకు సూచితమైన వస్త్రం అనే నామాన్ని స్పష్టత, సహజత్వం కోసం రెండింటికీ చేర్చాం.
