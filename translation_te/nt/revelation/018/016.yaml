id: REV.18.16
reference: Revelation 18:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: te
  text: 'ఇలా అంటున్నారు[a]: “సన్నని నారవస్త్రం, ఊదా రంగు వస్త్రం, ఎర్రని వస్త్రం ధరించి, బంగారంతో, విలువైన రాళ్లతో, ముత్యాలతో అలంకరించబడిన ఆ గొప్ప నగరానికి అయ్యో, అయ్యో!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇలా అంటూ.”
    reason: గ్రీకు వర్తమాన కృదంతమైన λέγοντες ను మరింత రూపసామ్యంతో అనువదించే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: λέγοντες
  choice: ఇలా అంటున్నారు
  rationale: వర్తమాన కర్తరి కృదంతం మునుపటి వచనంలోని కర్తలతో సంబంధాన్ని కొనసాగిస్తూ విలాప వాక్యాన్ని పరిచయం చేస్తుంది; తెలుగులో సహజత్వం కోసం సమాపక క్రియారూపం వాడబడింది.
- source_word: Οὐαὶ οὐαί
  choice: అయ్యో, అయ్యో
  rationale: విలాపంతోపాటు విపత్తు, తీర్పు భావాన్ని సందర్భానుసారంగా మోసే సహజమైన తెలుగు ఉద్గారం; పునరుక్తి గ్రీకు పాఠంలోని తీవ్రతను నిలుపుతుంది.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: మహానగరమా
  rationale: సంబోధనగా ఉన్న విలాపానికి సహజమైన తెలుగు రూపం; నగరపు గొప్పతనంపై గ్రీకు పాఠంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: περιβεβλημένη
  choice: ధరించి
  rationale: నగరం విలాసవస్త్రాలు ధరించిన స్థితిలో ఉన్నదనే సంపూర్ణ కృదంత భావాన్ని సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: βύσσινον
  choice: సన్నని నారబట్టను
  rationale: సాధారణ నారబట్ట కాక ఖరీదైన, మెత్తని నారవస్త్రాన్ని సూచించే విలాస భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: πορφυροῦν
  choice: ఊదారంగు వస్త్రాన్ని
  rationale: సంపద, రాజవైభవంతో ముడిపడిన రంగును సూచిస్తుంది; తెలుగులో కేవలం రంగు పేరుకన్నా వస్త్రం అని చెప్పడం ధరించడమనే సందర్భంలో సహజం.
- source_word: κόκκινον
  choice: ఎర్రని వస్త్రాన్ని
  rationale: ప్రకాశవంతమైన స్కార్లెట్ రంగును సాధారణ పాఠకునికి స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: κεχρυσωμένη
  choice: అలంకరించుకున్న
  rationale: బంగారం మాత్రమే పూతపూయడం అనే పరిమిత భావానికి బదులు, వెంట వచ్చే బంగారం, రత్నాలు, ముత్యాలు అన్నిటితో చేసిన వైభవోపేత అలంకరణను కవరిస్తుంది.
- source_word: χρυσίῳ
  choice: బంగారంతో
  rationale: అలంకరణకు ఉపయోగించిన పదార్థాన్ని నేరుగా సూచిస్తుంది.
- source_word: λίθῳ τιμίῳ
  choice: విలువైన రాళ్లతో
  rationale: గ్రీకు ఏకవచనం ఇక్కడ సమూహార్థకంగా ఉండగలదు; సహజ తెలుగులో విలాస అలంకరణ జాబితాకు బహువచనం సముచితం.
- source_word: μαργαρίτῃ
  choice: ముత్యాలతో
  rationale: గ్రీకు ఏకవచనం సమూహార్థకంగా గ్రహించవచ్చు; అలంకరణ సందర్భంలో తెలుగు బహువచనం సహజంగా ఉంటుంది.
theological_decisions:
- issue: బబులోను పతనంపై విలాపం మరియు తీర్పు స్వరం
  choice: “అయ్యో, అయ్యో” అని అనువదించి విలాపం, విపత్తు రెండింటి భావాన్ని ఉంచడం
  alternative: “శ్రమ, శ్రమ” వంటి మరింత తీర్పు-కేంద్రీకృత పదప్రయోగం
  rationale: οὐαί సందర్భానుసారంగా దుఃఖ ఉద్గారాన్నీ రాబోయిన లేదా సంభవించిన విపత్తునీ సూచిస్తుంది. “అయ్యో” ఆధునిక తెలుగులో సహజమైన విలాప స్వరాన్ని ఇస్తూ ప్రకటన గ్రంథంలోని తీర్పు సందర్భాన్ని అడ్డుకోదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకునికి అర్థమయ్యేలా, అయినా అపోకలిప్టిక్ విలాపానికి తగిన గంభీరతతో. నగరాన్ని వ్యక్తీకరించి సంబోధిస్తున్న నిర్మాణాన్ని నిలుపుకున్నాం.
