id: REV.18.19
reference: Revelation 18:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: te
  text: 'వారు తమ తలలపై దుమ్ము చల్లుకొని, ఏడుస్తూ దుఃఖిస్తూ బిగ్గరగా కేకలు వేశారు: “అయ్యో, అయ్యో[a], మహానగరమా! సముద్రంలో ఓడలు కలిగిన వారందరూ దాని విలాసవైభవం వల్ల ధనవంతులయ్యారు. ఒక్క గంటలోనే అది నాశనం చేయబడింది!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అయ్యో, అయ్యో” అనే గ్రీకు ఉద్గారం విలాపాన్ని వ్యక్తం చేస్తుంది; ఈ సందర్భంలో అది విపత్తు లేదా తీర్పు తీవ్రతను కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: తమ తలల మీద దుమ్ము పోసుకొని
  rationale: దుఃఖాన్ని వ్యక్తం చేసే సంప్రదాయ చర్యను గ్రీకు చిత్రణకు దగ్గరగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: ఏడుస్తూ దుఃఖిస్తూ బిగ్గరగా ఇలా కేకలు వేశారు
  rationale: κλαίοντες, πενθοῦντες అనే వేర్వేరు దుఃఖభావాలను నిలుపుతూ, ἔκραξαν లోని గట్టిగా మొరపెట్టుకునే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: Οὐαὶ οὐαί
  choice: అయ్యో, అయ్యో
  rationale: తెలుగులో సహజమైన విలాపోద్గారం; ఈ సందర్భంలోని దుఃఖం, విపత్తు, తీర్పు తీవ్రతను పునరుక్తితో నిలుపుతుంది.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: మహానగరమా
  rationale: ప్రత్యక్ష సంబోధనలో సహజంగా ఉండి, ‘గొప్ప నగరం’ అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἐν ᾗ
  choice: దాని ... వల్ల
  rationale: అక్షరార్థంగా ‘దానిలో’ అయినప్పటికీ, ఓడలవారు నగరంతో ముడిపడిన వాణిజ్య విలాసం ద్వారా ధనవంతులయ్యారనే సందర్భార్థాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: సముద్రంలో ఓడలు కలిగిన వారందరూ
  rationale: ‘కలిగిన’ అనే విస్తృత భావాన్ని ఉంచి, తప్పనిసరిగా యాజమాన్యాన్ని మాత్రమే నిర్దేశించకుండా మూలానికి దగ్గరగా ఉంటుంది.
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: దాని విలాసవైభవం వల్ల
  rationale: τιμιότης లోని ఖరీదైనతనం, వైభవం, విలువ అనే భావాలను కలిపి చూపుతుంది; కేవలం నగరపు మొత్తం సంపద అని భావాన్ని కుదించదు.
- source_word: μιᾷ ὥρᾳ ἠρημώθη
  choice: ఒక్క గంటలోనే అది పాడైపోయింది
  rationale: వినాశనం అకస్మాత్తుగా సంభవించిందనే అపోకలిప్టిక్ బలాన్ని సహజ తెలుగులో నిలుపుతుంది; గ్రీకు నిష్క్రియ భావానికి ఫలితస్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: అపోకలిప్టిక్ తీర్పు సందర్భంలో Οὐαὶ οὐαί అనే విలాప సూత్రం
  choice: అయ్యో, అయ్యో
  alternative: శ్రమ, శ్రమ / హా, హా
  rationale: ఇది విలాపం మరియు తీర్పు ప్రకటన రెండింటినీ మోస్తుంది. ‘అయ్యో’ ఆధునిక తెలుగులో సహజమైన తీవ్రమైన విలాపోద్గారం; పాదటిప్పణి దాని తీర్పు-విపత్తు ఛాయను స్పష్టం చేస్తుంది.
- issue: ἐκ τῆς τιμιότητος αὐτῆς యొక్క ఆర్థిక మరియు వైభవ సంబంధ భావం
  choice: దాని విలాసవైభవం వల్ల
  alternative: దాని సంపద వల్ల
  rationale: ఈ పదం సంపదనే కాక ఖరీదైన విలాసం, వైభవం, విలువను కూడా సూచించగలదు. సందర్భంలోని సముద్ర వాణిజ్య లాభాన్ని నిలుపుతూ పదార్థ పరిధిని అతిగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రకటన గ్రంథ శైలిని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వాక్య నిర్మాణం. నగరాన్ని స్త్రీలింగంగా చేయకుండా తెలుగు సహజ సర్వనామమైన ‘దాని/అది’ వాడబడింది.
