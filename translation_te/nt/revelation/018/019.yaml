  to: 'వారు తమ తలలపై దుమ్ము చల్లుకొని, ఏడుస్తూ దుఃఖిస్తూ బిగ్గరగా కేకలు వేశారు: “అయ్యో, అయ్యో[a], మహానగరమా! సముద్రంలో ఓడలు కలిగిన వారందరూ దాని విలాసవైభవం వల్ల ధనవంతులయ్యారు. ఒక్క గంటలోనే అది నాశనం చేయబడింది!”'
