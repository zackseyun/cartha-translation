id: REV.18.22
reference: Revelation 18:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: te
  text: వీణావాదకుల, సంగీతకారుల, వేణువాదకుల, బాకాలు ఊదేవారి శబ్దం నీలో ఇక ఎన్నటికీ వినబడదు[a]; ఏ కళలోనైనా ఏ శిల్పీ నీలో ఇక ఎన్నటికీ దొరకడు; తిరగలి శబ్దం నీలో ఇక ఎన్నటికీ వినబడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వేణువాదకులు” అని అనువదించిన గ్రీకు పదం, ఆధునిక వేణువుతో పూర్తిగా సమానం కాని ప్రాచీన గాలి వాయిద్యమైన ఔలోస్ వాయించేవారిని సూచిస్తుంది; “గాలి వాయిద్యకారులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తిరగలి రాయి శబ్దం”; గ్రీకు పదం రుబ్బే మిల్లును సాధారణంగా లేదా దాని రాయిని మరింత నిర్దిష్టంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: శబ్దం
  rationale: ఇక్కడ ఈ పదం మాట లేదా స్వరాన్ని కాక, సంగీత వాయిద్యాలకూ తిరగలికీ సంబంధించిన వినిపించే శబ్దాన్ని సూచిస్తుంది. పునరావృతమైన రూపకాన్ని కూడా ‘శబ్దం’ సహజంగా నిలుపుతుంది.
- source_word: κιθαρῳδῶν
  choice: వీణావాదకుల
  rationale: ఈ పదం కిథారా అనే తంతివాయిద్యంతో ప్రదర్శన చేసేవారిని సూచిస్తుంది. ప్రాచీన వాయిద్యాన్ని ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా చెప్పడానికి ‘వీణావాదకులు’ సహజమైన సమీప పదం.
- source_word: μουσικῶν
  choice: సంగీతకారుల
  rationale: సంగీత ప్రదర్శనలో పాల్గొనేవారిని విస్తృతంగా సూచించే పదం కావడంతో ‘సంగీతకారులు’ జాబితాలోని సమగ్ర భావాన్ని నిలుపుతుంది.
- source_word: αὐλητῶν
  choice: వేణువాదకుల
  rationale: ఈ పదం ప్రాచీన గాలి వాయిద్యమైన ఔలోస్ వాయించేవారిని సూచిస్తుంది. సాధారణ పాఠకులకు స్పష్టంగా ఉండేందుకు ‘వేణువాదకులు’ వాడి, వాయిద్య భేదాన్ని పాదసూచికలో తెలియజేశాం.
- source_word: σαλπιστῶν
  choice: బాకా ఊదేవారి
  rationale: బాకా వంటి ఘోషగల వాయిద్యాన్ని ఊదేవారిని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: ఇక ఎన్నటికీ వినబడదు
  rationale: οὐ μή అనే బలమైన నిషేధాన్నీ, ἔτι సూచించే ఇకపై లేని స్థితినీ కలిపి, సంపూర్ణమైన మరియు తుదియైన నిలిపివేతగా వ్యక్తపరుస్తుంది.
- source_word: ἐν σοὶ
  choice: నీలో
  rationale: బబులోనును ఒక నగరంగా వ్యక్తీకరించి నేరుగా సంబోధించే రెండవ పురుష రూపాన్ని నిలుపుతుంది.
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: ఏ వృత్తికి చెందిన ఏ శిల్పీ
  rationale: ఏ రకమైన నైపుణ్య వృత్తివాడూ మినహాయింపు కాదనే గ్రీకు పదబంధపు సమగ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὐ μὴ εὑρεθῇ
  choice: ఇక ఎన్నటికీ కనిపించడు
  rationale: అక్కడ అలాంటి శిల్పి ఇక అసలే ఉండడనే బలమైన భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μύλου
  choice: తిరగలి
  rationale: ధాన్యం రుబ్బే మిల్లు లేదా దాని రాయిని సూచించే పదాన్ని, ప్రాచీన దైనందిన రుబ్బే పనికి తగిన ‘తిరగలి’తో అనువదించాం; మరింత నిర్దిష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: బబులోను తీర్పులో సంపూర్ణ నిర్జనతను చూపే దృశ్యరూపం
  choice: సంగీతం, నైపుణ్యమైన పని, దైనందిన ఆహార సిద్ధతకు సంబంధించిన శబ్దాలు మరియు కార్యకలాపాలు పూర్తిగా నిలిచిపోతాయని మూడు ప్రకటనలుగా అనువదించడం
  alternative: వీటిని ప్రత్యేక భావం లేని అలంకార వివరాలుగా మాత్రమే చూపించడం
  rationale: మూడుసార్లు వచ్చే οὐ μή ... ἔτι నిర్మాణం తీర్పు సంపూర్ణమనీ తిరుగులేనిదనీ బలంగా తెలియజేస్తుంది. అనువాదం ఈ దృశ్యాలను అతిగా రూపకాలుగా వివరించకుండా వాటి స్పష్టమైన చిత్రణను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని జాబితానూ, ‘నీలో ఇక ఎన్నటికీ’ అనే పునరావృత తీర్పు సూత్రాన్నీ నిలిపాం.
