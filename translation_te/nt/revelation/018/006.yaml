revisions:
- from: ఆమె చేసినట్లే ఆమెకు తిరిగి చెల్లించండి; ఆమె క్రియల ప్రకారం ఆమెకు రెండింతలు తిరిగి చెల్లించండి.[a] ఆమె కలిపిన పాత్రలోనే ఆమె కోసం రెండింతలు కలపండి.[b]
  to: ఆమె తానే తిరిగి చెల్లించినట్లే ఆమెకు తిరిగి చెల్లించండి; ఆమె క్రియలకు తగినట్లుగా ఆమెకు రెండింతలు చెల్లించండి.[a] ఆమె కలిపిన పానపాత్రలో ఆమెకు రెట్టింపు మోతాదు కలపండి.[b]
  rationale: గ్రీకు వాక్యంలోని ఒకే ప్రతిఫల-క్రియను (‘తిరిగి చెల్లించు’) మొదటి రెండు ఉపవాక్యాల్లో నిలిపి, αὐτή ఉద్ఘాటనను ‘ఆమె తానే’తో వ్యక్తం చేశాం. ‘పానపాత్ర’ మరియు ‘రెట్టింపు మోతాదు’ పదాలు కలిపిన పానీయపు ప్రతీకను, ద్విగుణ ప్రతిఫల భావాన్ని సహజమైన తెలుగులో కాపాడతాయి. పాదటిప్పణులు తమ గుర్తుల వద్దనే ఉండి, ప్రత్యామ్నాయ పదబంధం మరియు సాంస్కృతిక చిత్రాన్ని వివరిస్తాయి.
