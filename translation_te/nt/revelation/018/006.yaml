id: REV.18.6
reference: Revelation 18:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν, καὶ ⸀διπλώσατε ⸀τὰ διπλᾶ κατὰ τὰ ἔργα αὐτῆς· ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν κεράσατε αὐτῇ διπλοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: te
  text: ఆమె తానే తిరిగి చెల్లించినట్లే ఆమెకు తిరిగి చెల్లించండి; ఆమె క్రియలకు తగినట్లుగా ఆమెకు రెండింతలు చెల్లించండి.[a] ఆమె కలిపిన పానపాత్రలో ఆమెకు రెట్టింపు మోతాదు కలపండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెకు రెండింతలను రెండింతలు చేయండి.” గ్రీకు పదబంధం బలమైనదీ సంక్షిప్తమైనదీ; ఇది ప్రతిఫలాన్ని మరింత తీవ్రంగా చూపించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆమె కలిపి సిద్ధం చేసిన పానపాత్ర. ఈ చిత్రం తీర్పు కోసం సిద్ధం చేసిన పానీయాన్ని సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε
  choice: తిరిగి చెల్లించండి
  rationale: ప్రతిఫలంగా లేదా ప్రతీకార న్యాయంగా తిరిగి ఇవ్వాలనే ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: ఆమె చేసినట్లే
  rationale: బబులోను గతంలో ఇతరులకు చేసినదే ఇప్పుడు ఆమెకు తిరిగి జరగాలనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; αὐτήలోని ఉద్ఘాటన సందర్భంలో ‘ఆమె’ ద్వారా నిలుస్తుంది.
- source_word: διπλώσατε τὰ διπλᾶ
  choice: ఆమెకు రెండింతలు తిరిగి చెల్లించండి
  rationale: గ్రీకు పదబంధంలోని బలమైన, సంక్షిప్త ద్విగుణీకరణ భావాన్ని తెలుగులో చదవడానికి సులభంగా ఉంచుతుంది; అసలు వాక్యంలోని వాక్చాతుర్యాన్ని పూర్తిగా విప్పి నిర్ణయించకుండా పాదటిప్పణిలో ప్రత్యామ్నాయం ఇస్తుంది.
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: ఆమె క్రియల ప్రకారం
  rationale: ἔργα యొక్క ‘క్రియలు/చేసిన పనులు’ అనే న్యాయపరమైన భావాన్ని, ప్రతిఫలం ఆమె చర్యలకు అనుగుణమని చూపే విధంగా నిలుపుతుంది.
- source_word: ποτηρίῳ
  choice: పాత్రలో
  rationale: పానపాత్ర అనే చిత్రాన్ని సందర్భానుకూలంగా తెలియజేస్తూ, ప్రకటన గ్రంథం మరియు ప్రవక్తల తీర్పు-పాత్ర ప్రతీకతో అనుసంధానాన్ని నిలుపుతుంది.
- source_word: ἐκέρασεν
  choice: కలిపిన
  rationale: κεράννυμι యొక్క పానీయాన్ని కలిపి సిద్ధం చేయడం అనే ప్రాథమిక చిత్రాన్ని ‘పోసిన’ అని సడలించకుండా కాపాడుతుంది.
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: ఆమె కోసం రెండింతలు కలపండి
  rationale: అదే పాత్ర-కలపడం చిత్రాన్ని పునరావృతం చేస్తూ, διπλοῦνలోని ద్విగుణ పరిమాణం లేదా తీవ్రతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రెండింతల ప్రతిఫల ఆజ్ఞ స్వభావం
  choice: తీర్పుకు సంబంధించిన ప్రతిఫలంగా, ‘రెండింతలు’ అనే తీవ్ర చిత్రాన్ని యథాతథంగా ఉంచడం
  alternative: దీనిని ఖచ్చితమైన గణిత పరిమాణమున్న శిక్షగా నిర్ణయించడం, లేదా ద్విగుణ చిత్రాన్ని తొలగించి సాధారణ న్యాయంగా మాత్రమే అనువదించడం
  rationale: అపోకలిప్టిక్ తీర్పు భాషలో ఇది బబులోనుకు తగినదిగా మరియు తీవ్రంగా వచ్చే ప్రతిఫలాన్ని సూచిస్తుంది. ‘రెండింతలు’ అక్షరార్థ పరిమాణమా లేక వాక్చాతుర్యపూర్వక ఉద్ఘాటనా అన్నది అనువాదం తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆజ్ఞారూపాన్ని వాడాం. ‘తిరిగి చెల్లించండి,’ ‘క్రియలు,’ ‘పాత్ర,’ ‘కలపండి’ అనే పదాలు న్యాయప్రతిఫలం మరియు ప్రతీకాత్మక పానపాత్ర చిత్రాన్ని స్పష్టంగా ఉంచుతాయి; మతశాఖాపరమైన ప్రత్యేక వ్యాఖ్యానాన్ని చేర్చలేదు.
