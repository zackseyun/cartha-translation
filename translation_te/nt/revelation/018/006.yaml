  source_fidelity: మొదటి ఉపవాక్యంలోని ἀπέδωκεν (‘తిరిగి చెల్లించింది/ప్రతిఫలం ఇచ్చింది’) భావం ముసాయిదాలోని ‘ఆమె చేసినట్లే’లో సాధారణ ‘చేయడం’గా తగ్గిపోయింది. అలాగే αὐτή ఉద్ఘాటనను ‘ఆమె తానే’తో ప్రతిబింబించడం సముచితం. చివరి ఆజ్ఞలో διπλοῦνను ‘రెట్టింపు మోతాదు’గా చెప్పడం పానపాత్రలో కలిపే పరిమాణ చిత్రాన్ని మరింత స్పష్టంగా కాపాడుతుంది.
  naturalness: ‘తిరిగి చెల్లించండి,’ ‘క్రియలకు తగినట్లుగా,’ ‘పానపాత్ర,’ ‘రెట్టింపు మోతాదు కలపండి’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగాను గంభీరమైన న్యాయ-తీర్పు నమోదుకు తగినట్లుగాను ఉన్నాయి.
