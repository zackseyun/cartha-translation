source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: te
  text: ఈ వస్తువుల వ్యాపారులు[a]—ఆమె వల్ల ధనవంతులైనవారు—ఆమె యాతనకు భయపడి, ఏడుస్తూ దుఃఖిస్తూ దూరంగా నిలబడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ సరుకుల వ్యాపారులు’; ఈ మాటలు సందర్భంలో పేర్కొన్న విలాస వస్తువులను సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: వ్యాపారులు
  rationale: వాణిజ్యం చేసేవారిని సూచించే సహజమైన, ప్రామాణిక ఆధునిక తెలుగు పదం.
- source_word: τούτων
  choice: ఈ వస్తువుల
  rationale: సమీప సందర్భంలో జాబితా చేసిన విలాస వస్తువులను వెనక్కి సూచిస్తుంది; మూలంలోని సాధారణ సూచనను అతిగా నిర్దిష్టం చేయదు.
- source_word: πλουτήσαντες ἀπ’ αὐτῆς
  choice: ఆమె వల్ల ధనవంతులైనవారు
  rationale: బబులోను వారి సంపదకు మూలమని స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది; కర్తరి భావాన్ని నిలుపుతుంది.
- source_word: ἀπὸ μακρόθεν στήσονται
  choice: దూరంగా నిలబడతారు
  rationale: భయంతో ఉద్దేశపూర్వకంగా దూరం పాటిస్తూ నిలిచే దృశ్యాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: ఆమె అనుభవించే యాతనకు భయపడి
  rationale: διά తెలిపే కారణాన్ని సహజమైన తెలుగులో అందిస్తుంది; సంబంధిత జనిటివ్‌ను సందర్భానుసారంగా ఆమెకు సంభవించే యాతనగా వ్యక్తం చేస్తుంది.
- source_word: βασανισμοῦ
  choice: యాతన
  rationale: ప్రకటన గ్రంథంలోని తీవ్రమైన తీర్పు బాధను పలుచన చేయకుండా తెలియజేస్తుంది; ఆధునికంగా మరీ సంకుచితమైన ‘హింస’ భావాన్ని రుద్దదు.
- source_word: κλαίοντες καὶ πενθοῦντες
  choice: ఏడుస్తూ దుఃఖిస్తూ
  rationale: రెండు వేర్వేరు భాగధాతువులను నిలుపుతూ, ఒకటి రోదనను మరొకటి శోకాన్ని సూచించే సహజ తెలుగు జంటను ఉపయోగిస్తుంది.
theological_decisions:
- issue: అపోకలిప్టిక్ తీర్పు భాషలో βασανισμός స్వభావం
  choice: ‘యాతన’గా అనువదించి తీవ్రమైన తీర్పు బాధను నిలుపడం
  alternative: ‘శిక్ష’ లేదా ‘బాధ’
  rationale: తక్షణ సందర్భం బబులోను తీర్పు. ‘యాతన’ మూలంలోని తీవ్రతను నిలుపుతుంది; అయితే అంతిమ శిక్ష స్వరూపంపై వచనం చెప్పనిదాన్ని జోడించదు.
- issue: τοῦ βασανισμοῦ αὐτῆς లోని సంబంధం
  choice: ‘ఆమె అనుభవించే యాతన’
  alternative: ‘ఆమె యాతన’
  rationale: తెలుగులో ఎవరికీ యాతన కలుగుతుందో స్పష్టత ఇస్తుంది; యాతనను ఆమె ఇతరులకు కలిగించేదిగా అపార్థం చేసుకోకుండా చేస్తుంది, కాని దాని విధానం గురించి అదనపు సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. స్త్రీలింగ ‘ఆమె’ బబులోనును వ్యక్తీకరించే మూలరూపాన్ని నిలుపుతుంది; డాష్‌లు భాగధాతు వివరణను స్పష్టంగా వేరుచేస్తాయి.
