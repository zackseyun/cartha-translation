id: REV.18.18
reference: Revelation 18:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἔκραξαν βλέποντες τὸν καπνὸν τῆς πυρώσεως αὐτῆς λέγοντες· Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: te
  text: 'ఆమె దహనపు పొగను చూస్తూ వారు ఇలా బిగ్గరగా కేకలు వేశారు: “ఆ గొప్ప నగరానికి సాటియైన నగరం ఏది?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκραξαν
  choice: బిగ్గరగా కేకలు వేసి
  rationale: κράζω బిగ్గరగా మొరపెట్టడం లేదా కేక వేయడాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో క్రియల క్రమం సహజంగా ఉండేందుకు అసమాపక రూపం వాడబడింది.
- source_word: βλέποντες
  choice: చూస్తూ
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలీనమైన చర్యను సూచిస్తుంది; ‘చూస్తూ’ ఆ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: ఆమె దహనపు పొగను
  rationale: πύρωσις దహించబడే ప్రక్రియను సూచిస్తుంది. αὐτῆς లోని స్త్రీలింగ వ్యక్తీకరణను ‘ఆమె’ ద్వారా నిలుపుతూ, సంక్షిప్తమైన తెలుగు షష్ఠీ నిర్మాణం వాడబడింది.
- source_word: λέγοντες
  choice: అన్నారు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే కృదంతాన్ని సహజ తెలుగు ప్రధాన క్రియగా వ్యక్తం చేస్తుంది.
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: ఈ మహానగరంలాంటి నగరం ఏది?
  rationale: గ్రీకులో పోలిక వాక్యం సంక్షిప్తంగా ఉండి కర్త స్పష్టంగా చెప్పబడలేదు. సందర్భం ప్రకారం ‘నగరం’ను పూరించి, విస్మయభరితమైన అలంకారప్రశ్నను సహజ తెలుగులో నిలుపుతుంది.
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: ఈ మహానగరం
  rationale: నిర్దిష్టంగా సందర్భంలో ఇప్పటికే గుర్తించబడిన గొప్ప నగరాన్ని సూచిస్తుంది; ‘ఈ’ విలపిస్తున్నవారి దృష్టిలో ఉన్న నగరాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బబులోను/నగర స్త్రీరూప వ్యక్తీకరణ
  choice: ‘ఆమె’ అనే స్త్రీలింగ సూచనను నిలుపడం
  alternative: ‘దాని’ అనే నపుంసక సూచనను వాడడం
  rationale: ప్రకటన గ్రంథంలో బబులోను ఒక స్త్రీగానూ నగరంగానూ నిరంతరం వ్యక్తీకరించబడుతుంది; ‘ఆమె’ ఆ సాహిత్య, ధార్మిక ప్రతిమను వ్యాఖ్యానాత్మకంగా మార్చకుండా కాపాడుతుంది.
- issue: Τίς ὁμοία అనే కాలరహిత సంక్షిప్త పోలిక
  choice: ‘లాంటి నగరం ఏది?’ అని వర్తమాన/కాలరహిత అలంకారప్రశ్నగా అనువదించడం
  alternative: ‘లాంటి నగరం ఏది ఉండేది?’ అని భూతకాల భావాన్ని పూరించడం
  rationale: గ్రీకు పాఠంలో స్పష్టమైన సంధానక్రియ లేదు. కాబట్టి తెలుగులో కాలాన్ని బలవంతంగా నిర్ణయించకుండా సహజమైన నామవాచక ప్రశ్నగా ఉంచడం మూలంలోని అస్పష్టతను మెరుగ్గా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని స్త్రీరూప వ్యక్తీకరణను నిలిపి, గ్రీకు సంక్షిప్త పోలికలో లేని కాలాన్ని చేర్చకుండా అనువదించబడింది.
