id: REV.18.5
reference: Revelation 18:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἐκολλήθησαν αὐτῆς αἱ ἁμαρτίαι ἄχρι τοῦ οὐρανοῦ, καὶ ἐμνημόνευσεν ὁ θεὸς τὰ ἀδικήματα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/005.yaml
  text: for her sins have piled up as high as heaven, and God has remembered her wrongdoings.
translation:
  language: te
  text: ఎందుకంటే ఆమె పాపాలు ఆకాశమంత ఎత్తుగా పేరుకుపోయాయి[a]; దేవుడు ఆమె దురాకృత్యాలను జ్ఞాపకం చేసుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె పాపాలు ఆకాశం వరకు కలిసికట్టుగా పోగయ్యాయి.” గ్రీకు క్రియకు అక్షరార్థంగా “అంటించబడ్డాయి/కలపబడ్డాయి” అనే భావం ఉంది; ఇక్కడ అది పాపాలు గొప్ప కుప్పగా పేరుకుపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'ఇక్కడ “జ్ఞాపకం చేసుకున్నాడు” అనేది న్యాయతీర్పుకు సంబంధించిన భావాన్ని కలిగి ఉంది: దేవుడు ఆమె దురాకృత్యాలను ఉపేక్షించలేదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని ఆజ్ఞకు కారణాన్ని తెలిపే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐκολλήθησαν
  choice: పేరుకుపోయాయి
  rationale: మూల క్రియకు అక్షరార్థంగా ‘అంటించబడ్డాయి/కలిసిపోయాయి’ అనే భావం ఉన్నా, ఇక్కడ పాపాలు ఆకాశం వరకు విపరీతంగా పోగైన రూపకాన్ని ‘పేరుకుపోయాయి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἁμαρτίαι
  choice: పాపాలు
  rationale: ἁμαρτίαకు ప్రామాణికమైన, సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: ఆకాశమంత ఎత్తుగా
  rationale: పాపాల అపారమైన నిలువు పరిమాణాన్ని సహజమైన తెలుగు రూపకంగా వ్యక్తం చేస్తుంది; ‘ఆకాశం వరకు’ అనేది మరింత అక్షరార్థ ప్రత్యామ్నాయం.
- source_word: ἐμνημόνευσεν
  choice: జ్ఞాపకం చేసుకున్నాడు
  rationale: దేవుని జ్ఞాపకం సందర్భంలో న్యాయతీర్పు చర్యను సూచించినా, మూలంలోని ‘జ్ఞాపకం చేసుకోవడం’ అనే క్రియను నిలుపుతూ దాని అంతర్భావాన్ని అనువాదంలో విప్పి చెప్పదు.
- source_word: ὁ θεός
  choice: దేవుడు
  rationale: నేరుగా, ప్రామాణికంగా సరిపోలే తెలుగు రూపం.
- source_word: ἀδικήματα
  choice: దురాకృత్యాలు
  rationale: తప్పైన, అన్యాయమైన కార్యాలను సూచిస్తూ, ముందున్న ‘పాపాలు’ అనే పదంతో మూలంలోని పదభేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἁμαρτίαι మరియు ἀδικήματα మధ్య పదభేదం
  choice: ‘పాపాలు’, ‘దురాకృత్యాలు’ అనే రెండు వేరు పదాలు
  alternative: రెండింటినీ ‘పాపాలు’ లేదా ‘దోషాలు’గా అనువదించడం
  rationale: మూల గ్రీకులో సంబంధితమైనా వేర్వేరు పదాలు ఉన్నాయి. వాటి మధ్య కృత్రిమమైన సిద్ధాంత భేదాన్ని కల్పించకుండా, వాక్యంలోని భావపూర్ణ వైవిధ్యాన్ని నిలుపుతుంది.
- issue: దేవుడు జ్ఞాపకం చేసుకోవడంలోని న్యాయపరమైన భావం
  choice: ‘జ్ఞాపకం చేసుకున్నాడు’ అని నేరుగా అనువదించడం
  alternative: ‘లెక్క అడిగాడు’ లేదా ‘తీర్పుకు తెచ్చాడు’ అని విస్తరించడం
  rationale: సందర్భంలో దేవుని జ్ఞాపకం తీర్పుతో కూడిన చర్యను సూచిస్తుంది; అయినా మూల క్రియను నిలుపడం ద్వారా ఆ వేదాంతపరమైన అంతర్భావాన్ని మౌనంగా పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రకటన శైలి. ‘పేరుకుపోయాయి’ రూపకాన్ని స్పష్టంగా ఉంచుతుంది; ‘జ్ఞాపకం చేసుకున్నాడు’ అనే బైబిలు సంబంధిత న్యాయార్థ ఉద్వేగాన్ని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
