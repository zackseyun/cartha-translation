id: REV.18.11
reference: Revelation 18:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: te
  text: భూమి[a] మీద ఉన్న వ్యాపారులు ఆమెను గురించి ఏడుస్తూ దుఃఖిస్తున్నారు; ఎందుకంటే వారి సరుకును[b] ఇక ఎవరూ కొనడం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశంలోని.’ γῆ అనే గ్రీకు పదం ‘భూమి’ లేదా ‘దేశం/నేల’ అని అర్థమివ్వగలదు; ప్రకటన గ్రంథంలో దీనికి తరచుగా విస్తృతమైన ప్రపంచవ్యాప్త భావం ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఓడ సరుకును’ లేదా ‘వాణిజ్య వస్తువులను.’ γόμος అనే గ్రీకు పదం ఓడలోని సరుకు లోడును లేదా అమ్మకానికి ఉంచిన వస్తువులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: వ్యాపారులు
  rationale: వాణిజ్యంలో నిమగ్నమైన వర్తకులను సూచించే సహజమైన ఆధునిక తెలుగు పదం; ప్రకటన 18లోని అంతర్జాతీయ విలాసవస్తువుల వ్యాపార సందర్భానికి సరిపోతుంది.
- source_word: τῆς γῆς
  choice: భూమి మీద ఉన్న
  rationale: γῆ అనే పదానికి ‘భూమి’ లేదా ‘దేశం/నేల’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ప్రకటన గ్రంథంలోని విస్తృత ప్రపంచవ్యాప్త సందర్భాన్ని ‘భూమి మీద ఉన్న’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: ఏడుస్తూ దుఃఖిస్తున్నారు
  rationale: 'రెండు క్రియల భేదాన్నీ, వాటి ద్వారా కలిగే భావతీవ్రతనూ నిలుపుతుంది: మొదటిది కన్నీరు పెట్టడాన్ని, రెండవది శోకించడాన్ని సూచిస్తుంది.'
- source_word: ἐπ’ αὐτήν
  choice: ఆమెను గురించి
  rationale: విలాపాన్ని సూచించే క్రియలతో ఈ పదబంధం ఎవరి విషయంలో శోకిస్తున్నారో తెలియజేస్తుంది. ‘ఆమె’ అనే స్త్రీలింగ సూచన బబులోను నగరపు వ్యక్తీకరణను నిలుపుతుంది.
- source_word: γόμον
  choice: సరుకు
  rationale: γόμος ఓడలో తీసుకెళ్లే సరుకు లేదా వాణిజ్య వస్తువుల లోడును సూచిస్తుంది. సాధారణ పాఠకులకు ‘సరుకు’ సహజంగా ఉండి, వాణిజ్య సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: ఇక ఎవరూ కొనడం లేదు
  rationale: వర్తమాన కాల క్రియను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, οὐκέτι సూచించే నిలిచిపోయిన స్థితిని ‘ఇక’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτῶν
  choice: వారి
  rationale: ఈ సంబంధసూచక సర్వనామం వ్యాపారులకు చెందిన సరుకును సూచిస్తుంది; తెలుగులో ‘వారి’ సహజమైన స్వామ్యరూపం.
theological_decisions:
- issue: బబులోను స్త్రీగా/నగరంగా వ్యక్తీకరించబడటం
  choice: స్త్రీలింగ సర్వనామమైన ‘ఆమె’ను నిలుపడం
  alternative: నగరం లేదా వ్యవస్థగా భావించి ‘దాని’ అని అనువదించడం
  rationale: ప్రకటన గ్రంథం బబులోనును స్త్రీగా, నగరంగా వ్యక్తీకరిస్తుంది. ‘ఆమె’ ఆ సాహిత్య-దైవశాస్త్రీయ చిత్రాన్ని నిలుపుతుంది; చిహ్నానికి మించిన నిర్దిష్ట వ్యాఖ్యానాన్ని అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని రెండు శోకక్రియలను వేర్వేరుగా నిలిపి, బబులోనుకు సంబంధించిన స్త్రీలింగ వ్యక్తీకరణను కాపాడాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న ‘భూమి’ మరియు ‘సరుకు’ పదాల దగ్గరే ఉంచాం.
