id: REV.18.3
reference: Revelation 18:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: te
  text: ఎందుకంటే ఆమె లైంగిక అనైతికత యొక్క కోపపు ద్రాక్షారసం వల్ల అన్ని జనాంగాలు పతనమయ్యాయి.[a] భూమి రాజులు ఆమెతో లైంగిక అనైతికతకు పాల్పడ్డారు,[b] భూమి వ్యాపారులు ఆమె మితిమీరిన విలాసపు ప్రభావం వల్ల ధనవంతులయ్యారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని గ్రీకు ప్రతులలో, “అన్ని జనాంగాలు ఆమె లైంగిక అనైతికత యొక్క కోపపు ద్రాక్షారసం తాగాయి” అని ఉంది. “కోపం” అని అనువదించిన గ్రీకు పదానికి సందర్భాన్ని బట్టి “తీవ్ర వాంఛ” అనే అర్థమూ ఉండవచ్చు.
    reason: textual_variant; lexical_alternative
  - marker: b
    text: ఇక్కడ “లైంగిక అనైతికత” అనే మాట విగ్రహారాధనతో కూడిన అవినీతికరమైన రాజకీయ, ఆర్థిక, మతపరమైన పొత్తులను రూపకంగా సూచిస్తుండవచ్చు. అయితే అనువాదం గ్రీకులోని లైంగిక రూపకాన్ని అలాగే ఉంచుతుంది.
    reason: alternative_reading
  - marker: c
    text: “మితిమీరిన విలాసం” అని అనువదించిన గ్రీకు పదం కేవలం సుఖసౌకర్యాలను కాకుండా, స్వార్థభోగంతో కూడిన దర్పపూరితమైన అతిశయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐκ τοῦ οἴνου
  choice: ద్రాక్షారసం వల్ల
  rationale: ἐκ యొక్క మూలం/కారణ భావాన్ని ఇక్కడి ‘పతనమయ్యాయి’ అనే పాఠంతో సహజంగా కలుపుతూ, ద్రాక్షారస రూపకాన్ని నిలుపుతుంది.
- source_word: θυμοῦ
  choice: కోపపు
  rationale: θυμόςకు కోపం, ఉగ్రావేశం అనే భావాలు ఉన్నాయి. తీర్పుతో నిండిన ప్రకటన గ్రంథ సందర్భంలో ‘కోపం’ ప్రధాన భావాన్ని ఇస్తుంది; ప్రత్యామ్నాయ భావసాధ్యతను వ్యాఖ్యానంతో మూసివేయదు.
- source_word: πορνείας / ἐπόρνευσαν
  choice: లైంగిక అవినీతి / లైంగిక అవినీతికి పాల్పడ్డారు
  rationale: గ్రీకు పదాల్లోని లైంగిక రూపకాన్ని నిలుపుతూ, దాన్ని కేవలం విగ్రహారాధనగా లేదా వ్యభిచార వృత్తిగా సంకుచితం చేయదు.
- source_word: πέπτωκαν
  choice: పతనమయ్యాయి
  rationale: ఇచ్చిన SBLGNT పాఠంలోని πέπτωκαν అనేది πίπτω (‘పడిపోవు’) క్రియ యొక్క పరిపూర్ణ రూపం. అందువల్ల సంప్రదింపుగా ఇచ్చిన ఇంగ్లీషు పాఠంలోని ‘తాగాయి’ కంటే మూలపాఠాన్నే అనుసరించాం; పాఠాంతరాన్ని అడుగుసూచనలో ఇచ్చాం.
- source_word: πάντα τὰ ἔθνη
  choice: జనాలన్నీ
  rationale: ఇక్కడ ἔθνη భూమిపై ఉన్న జనసమూహాలను సమష్టిగా సూచిస్తుంది; యూదేతరులు అనే సంకుచిత భేదాన్ని రుద్దదు.
- source_word: ἔμποροι
  choice: వర్తకులు
  rationale: ప్రకటన 18లోని అంతర్జాతీయ వాణిజ్య సందర్భానికి సరిపోయే గౌరవప్రదమైన సాధారణ తెలుగు పదం.
- source_word: ἐκ τῆς δυνάμεως
  choice: శక్తివల్ల
  rationale: δύναμιςలోని శక్తి/ప్రభావ భావాన్ని కేవలం ‘సంపద’గా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: στρήνους
  choice: విచ్చలవిడి విలాసం
  rationale: στρῆνος సూచించే మితిమీరిన, దర్పపూరితమైన స్వార్థభోగాన్ని ‘విలాసం’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπλούτησαν
  choice: ధనవంతులయ్యారు
  rationale: వాణిజ్యం ద్వారా సంపద పొందిన ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: πορνεία/πορνεύωను నేరుగా లైంగిక భాషలో అనువదించాలా, లేక ‘విగ్రహారాధన’ వంటి వ్యాఖ్యానాత్మక పదంతో మార్చాలా
  choice: ప్రధాన పాఠంలో ‘లైంగిక అవినీతి’ అనే రూపకాన్ని నిలుపడం
  alternative: విగ్రహారాధన; ఆధ్యాత్మిక వ్యభిచారం; అవినీతికరమైన పొత్తు
  rationale: ప్రకటన గ్రంథం లైంగిక అవిశ్వాసం అనే ఉద్దేశపూర్వక రూపకం ద్వారా మతపరమైన, రాజకీయ, ఆర్థిక అవినీతిని కలిపి చూపుతుంది. ఒకే వ్యాఖ్యానంతో ఆ ఉద్రిక్తతను తొలగించకుండా మూల రూపకాన్ని నిలిపాం.
- issue: πέπτωκανను ‘పతనమయ్యాయి’గా తీసుకోవాలా, పాఠాంతరమైన ‘తాగాయి’గా తీసుకోవాలా
  choice: ఇచ్చిన SBLGNT మూలపాఠాన్ని అనుసరించి ‘పతనమయ్యాయి’
  alternative: తాగాయి
  rationale: అందించిన గ్రీకు పాఠంలో స్పష్టంగా πέπτωκαν ఉంది. ద్రాక్షారస రూపకంతో ‘తాగాయి’ సులభంగా సరిపోయినా, అది వేరే గ్రీకు పాఠాన్ని అనుసరిస్తుంది; అందుకే దాన్ని అడుగుసూచనలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నప్పటికీ ప్రకటన గ్రంథంలోని గంభీరమైన ప్రవచన శైలిని నిలిపింది. ‘జనాలు,’ ‘వర్తకులు,’ ‘ధనవంతులయ్యారు’ వంటి సహజ పదాలతో పాటు ‘పతనమయ్యాయి,’ ‘విచ్చలవిడి విలాసం’ వంటి గౌరవప్రదమైన పదప్రయోగాలు వాడబడ్డాయి.
