id: REV.18.10
reference: Revelation 18:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: te
  text: 'ఆమె యాతనకు భయపడి వారు దూరంగా నిలబడి ఇలా అంటారు: “అయ్యో, అయ్యో[a], ఆ గొప్ప నగరమా, బబులోనూ, ఆ బలమైన నగరమా[b]! ఒక్క గంటలో నీపై తీర్పు వచ్చింది!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హా, హా.” గ్రీకు ఆశ్చర్యార్థకం విలాపాన్నీ విపత్తు లేదా తీర్పు ప్రకటననూ వ్యక్తం చేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: “బలమైన” అనే గ్రీకు పదానికి “శక్తిమంతమైన” లేదా “మహాబలమైన” అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: దూరంగా నిలబడి
  rationale: దూరాన్ని సూచించే పదబంధాన్నీ, నిలిచి ఉన్న స్థితిని సూచించే పరిపూర్ణ కృదంతాన్నీ సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తపరుస్తుంది.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: ఆమె అనుభవిస్తున్న యాతనకు భయపడి
  rationale: διά + ద్వితీయా కారణాన్ని సూచిస్తుంది. సంబంధిత సర్వనామంలోని అస్పష్టతను కాపాడుతూనే, బబులోనుకు కలిగిన తీవ్రమైన బాధను సహజంగా తెలియజేస్తుంది.
- source_word: λέγοντες
  choice: ఇలా అంటారు
  rationale: ప్రత్యక్ష ఉక్తిని పరిచయం చేసే కృదంతాన్ని తెలుగు వాక్యప్రవాహానికి అనుగుణంగా వర్తమాన క్రియగా అనువదించింది.
- source_word: Οὐαὶ οὐαί
  choice: అయ్యో, అయ్యో
  rationale: οὐαίలోని విలాపం మరియు రాబోయిన లేదా సంభవించిన విపత్తు భావం రెండింటినీ సాధారణ ఆధునిక తెలుగు ఆశ్చర్యార్థకం సహజంగా మోస్తుంది.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: మహానగరమా
  rationale: సంబోధన సందర్భంలో ‘మహానగరమా’ గ్రీకు విశేషణ బలాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: Βαβυλὼν
  choice: బబులోనూ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరును సంబోధన రూపంలో ఇచ్చింది.
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: బలమైన నగరమైన
  rationale: ἰσχυρά యొక్క ప్రాథమిక బలం/శక్తి భావాన్ని నేరుగా వ్యక్తపరుస్తూ, బబులోనుతో సమానాధికార సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: μιᾷ ὥρᾳ
  choice: ఒక్క గంటలోనే
  rationale: కాల దత్తివిభక్తి భావాన్ని, తీర్పు అకస్మాత్తుగా వచ్చినదనే ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἦλθεν ἡ κρίσις σου
  choice: నీకు తీర్పు వచ్చేసింది
  rationale: అక్షరార్థమైన ‘నీ తీర్పు వచ్చింది’ తెలుగులో తీర్పు చెప్పే క్రియగా అపార్థమయ్యే అవకాశం ఉంది; ‘నీకు తీర్పు’ లక్ష్యాన్ని స్పష్టం చేస్తుంది. ‘వచ్చేసింది’ పూర్తయిన రాకను, దాని ప్రస్తుత తీవ్రతను వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: οὐαί యొక్క విలాప–విపత్తు ద్వంద్వభావం
  choice: అయ్యో, అయ్యో
  alternative: శ్రమ, శ్రమ / హా, హా
  rationale: ‘అయ్యో’ సహజమైన తెలుగు విలాపాన్ని ఇస్తుంది; సందర్భం దాని తీర్పు సంబంధమైన అపశకున బలాన్ని అందిస్తుంది. పాదసూచిక ప్రత్యామ్నాయ భావాన్ని స్పష్టం చేస్తుంది.
- issue: ἦλθεν యొక్క కాలాంశం
  choice: వచ్చేసింది
  alternative: వచ్చింది
  rationale: గ్రీకు ఏఓరిస్ట్ తీర్పు రాకను సంపూర్ణ సంఘటనగా చూపుతుంది. ‘వచ్చేసింది’ దాని అకస్మాత్తుతనాన్నీ ప్రస్తుత ఫలితాన్నీ సహజంగా తెలియజేస్తుంది; ఇది సిద్ధాంత నిర్ణయం కాదు.
- issue: κρίσις σουలోని సంబంధం
  choice: నీకు తీర్పు
  alternative: నీ తీర్పు
  rationale: గ్రీకు పదబంధాన్ని యథాతథంగా ‘నీ తీర్పు’ అని ఇస్తే తెలుగులో నీవు ఇచ్చే తీర్పు అనే అపార్థం కలగవచ్చు. సందర్భానుసారం బబులోనుపై వచ్చిన తీర్పు అని స్పష్టం చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రకటన గ్రంథ శైలిని పాటించింది. ప్రత్యక్ష ఉక్తిలో సంబోధన రూపాలు ఉపయోగించబడ్డాయి; విలాపం, తీర్పు, అకస్మాత్తుతనం అనే భావాలు అతిశయమైన ప్రాచీన పదజాలం లేకుండా నిలుపబడ్డాయి.
