revisions:
- from: ఆమెతో లైంగిక దుర్నీతికి పాల్పడి, విలాసభోగాల్లో మునిగిన భూరాజులు ఆమె దహనపు పొగను చూసినప్పుడు, ఆమెను గూర్చి ఏడుస్తూ రొమ్ము కొట్టుకుంటారు[a].[b]
  to: ఆమెతో లైంగిక దుర్నీతికి పాల్పడి[b], ఆమెతో విలాసంగా జీవించిన భూమి రాజులు ఆమె దహనపు పొగను చూసినప్పుడు ఆమెను గూర్చి ఏడుస్తారు, రొమ్ములు బాదుకుంటారు[a].
  rationale: The revision retains the source’s imagery and ambiguity while using modern standard Telugu. It makes ‘with her’ explicit with both participial actions, restores the Greek coordination of ‘will weep and mourn,’ replaces the more literary ‘భూరాజులు’ with the transparent ‘భూమి రాజులు,’ and relocates both footnote anchors to their relevant text.
