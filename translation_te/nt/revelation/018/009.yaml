  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: te
  text: ఆమెతో లైంగిక దుర్నీతికి పాల్పడి[b], ఆమెతో విలాసంగా జీవించిన భూమి రాజులు ఆమె దహనపు పొగను చూసినప్పుడు ఆమెను గూర్చి ఏడుస్తారు, రొమ్ములు బాదుకుంటారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విలపిస్తారు’; గ్రీకు క్రియ బహిరంగంగా శోకిస్తూ రొమ్ములు బాదుకునే భావాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆమెతో లైంగిక దుర్నీతికి పాల్పడ్డారు’ అనే మాట ప్రకటన గ్రంథంలో కనిపించే అవినీతికరమైన, విగ్రహారాధనాత్మకమైన పొత్తుల రూపకంలో భాగమై ఉండవచ్చు; అయినా గ్రీకు మూలంలోని లైంగిక పదచిత్రం అలాగే నిలుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: ఏడుస్తూ
  rationale: κλαίω బిగ్గరగా ఏడవడం లేదా విలపించడం సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఏడుస్తూ’ సహజంగా భావోద్వేగ తీవ్రతను నిలుపుతుంది.
- source_word: κόψονται
  choice: రొమ్ము కొట్టుకుంటారు
  rationale: ఈ సందర్భంలో κόπτω మధ్యమ రూపం బహిరంగంగా శోకించడం అనే అంత్యక్రియల/విలాప ఆచారాన్ని సూచిస్తుంది; ‘రొమ్ము కొట్టుకుంటారు’ ఆ దృశ్యాత్మక భావాన్ని అపార్థం లేకుండా అందిస్తుంది.
- source_word: ἐπ’ αὐτὴν
  choice: ఆమెను గూర్చి
  rationale: విలాప క్రియలతో ἐπί + accusative శోకానికి గురైన వ్యక్తిని సూచిస్తుంది; ‘ఆమెను గూర్చి’ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: భూరాజులు
  rationale: ప్రకటన గ్రంథంలోని ప్రపంచ పాలకులను సూచించే అపోకలిప్టిక్ పదబంధం; ‘భూరాజులు’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: μετ’ αὐτῆς
  choice: ఆమెతో
  rationale: μετά + genitive సహవాసాన్ని సూచిస్తుంది. గ్రీకు వాక్యంలో ఇది రెండు సమన్విత క్రియలతో సంబంధం కలిగి ఉండగలదు; తెలుగులో ముందుంచడం ఆ భాగస్వామ్య సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πορνεύσαντες
  choice: లైంగిక దుర్నీతికి పాల్పడి
  rationale: πορνεύω యొక్క లైంగిక రూపకాన్ని నిలుపుతూ, అది ప్రకటన గ్రంథంలో విగ్రహారాధనాత్మక మరియు అవినీతికర పొత్తులకు రూపకంగా పనిచేసే అవకాశాన్ని మూసివేయదు.
- source_word: στρηνιάσαντες
  choice: విలాసభోగాల్లో మునిగిన
  rationale: ఈ క్రియ స్వీయాసక్తితో కూడిన మితిమీరిన విలాస జీవనాన్ని సూచిస్తుంది; ‘విలాసభోగాల్లో మునిగిన’ దాని నైతిక-ఆర్థిక విమర్శను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅταν βλέπωσιν
  choice: చూసినప్పుడు
  rationale: ὅταν + present subjunctive ఇక్కడ భవిష్యత్తులో జరిగే సందర్భాన్ని సూచిస్తుంది; ‘చూసినప్పుడు’ సహజ సమానార్థకం.
- source_word: τὸν καπνὸν
  choice: పొగను
  rationale: ప్రత్యక్షమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: τῆς πυρώσεως αὐτῆς
  choice: ఆమె దహనపు
  rationale: πύρωσις దహనాన్ని లేదా మండే ప్రక్రియను సూచిస్తుంది; సమీప వచనాల ప్రత్యేక పదజాలాన్ని దిగుమతి చేయకుండా ‘ఆమె దహనపు పొగ’ మూల చిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: బబులోను ‘లైంగిక దుర్నీతి’ యొక్క స్వభావం
  choice: ప్రధాన పాఠ్యంలో లైంగిక పదచిత్రాన్ని నిలుపుతూ, సందర్భంలో దాని రూపకార్థానికి అవకాశం ఉంచడం.
  alternative: ‘అవినీతికి పాల్పడ్డారు’ లేదా ‘ఆమెతో నమ్మకద్రోహం చేశారు’ అని మరింత అమూర్తంగా అనువదించడం.
  rationale: ప్రకటన గ్రంథం వ్యభిచార/లైంగిక దుర్నీతి చిత్రాన్ని విగ్రహారాధనాత్మకమైన, అవినీతికరమైన పొత్తులకు పదేపదే రూపకంగా వాడుతుంది. లైంగిక పదజాలాన్ని ఉంచడం ఆ ప్రవచన రూపకాన్ని, దానిలోని ఉద్దేశపూర్వక ఉద్రిక్తతను కాపాడుతుంది.
- issue: κόψονται యొక్క అనువాదం
  choice: ‘రొమ్ము కొట్టుకుంటారు’ అని బహిరంగ శోక చర్యను వ్యక్తం చేయడం.
  alternative: సాధారణంగా ‘విలపిస్తారు’ అని అనువదించడం; లేదా తప్పుదారి పట్టించే విధంగా ‘తమను తాము కోసుకుంటారు’ అని అతి అక్షరార్థంగా అనువదించడం.
  rationale: ఈ ప్రయోగం కేవలం అంతర్గత దుఃఖం కాక, కనిపించే విలాప చర్యను సూచిస్తుంది. తెలుగు ‘రొమ్ము కొట్టుకోవడం’ ఆ శోకభావాన్ని స్పష్టంగా అందిస్తుంది; స్వీయహానిని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ప్రవచన శైలి ఉపయోగించబడింది. ‘భూరాజులు’, ‘దహనపు పొగ’ వంటి పదాలు ప్రకటన గ్రంథపు గంభీర దృశ్యాన్ని నిలుపుతాయి. రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
