id: REV.18.14
reference: Revelation 18:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: te
  text: నీ ప్రాణం ఆశించిన పండు నీ దగ్గరనుండి వెళ్లిపోయింది; విలాసవంతమైనవన్నీ, శోభాయమానమైనవన్నీ నీ దగ్గరనుండి నశించిపోయాయి; వాటిని ఇక ఎన్నటికీ కనుగొనరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అవి ఇక ఎన్నటికీ దొరకవు.” గ్రీకులో ‘కనుగొంటారు’ అనే క్రియకు కర్త స్పష్టంగా పేర్కొనబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπώρα
  choice: పండు
  rationale: ఈ పదం ముఖ్యంగా పక్వమైన లేదా ఋతువు చివరలో లభించే పండును సూచిస్తుంది. సందర్భంలోని విలాసవస్తువుల జాబితితో అనుసంధానాన్ని నిలుపుతూ సాధారణ తెలుగు పాఠకునికి సహజంగా ఉండేందుకు ‘పండు’ అని అనువదించాం.
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: నీ ప్రాణం ఆశించిన
  rationale: గ్రీకు షష్ఠీ విభక్తి పదబంధాన్ని తెలుగులో సహజమైన సంబంధవాచక నిర్మాణంగా మార్చాం. ψυχή యొక్క అంతరంగ కోరిక తీవ్రతను నిలుపేందుకు ‘ప్రాణం’ను ఉంచాం.
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: నీ దగ్గరనుండి వెళ్లిపోయింది
  rationale: దూరమైపోవడం మరియు దాని ప్రస్తుత ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάντα τὰ λιπαρὰ
  choice: సమృద్ధిగలవన్నీ
  rationale: λιπαρός ఇక్కడ కొవ్వుగల ఆహారానికే పరిమితం కాకుండా సంపన్నమైన, విలాసవంతమైన వస్తువులను విస్తృతంగా సూచిస్తుంది. ‘సమృద్ధిగలవన్నీ’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: τὰ λαμπρὰ
  choice: వైభవంగలవన్నీ
  rationale: λαμπρός యొక్క ప్రకాశం, శోభ, ఆడంబర వైభవం అనే భావాలలో ఈ వాణిజ్య సందర్భానికి ‘వైభవంగలవి’ సరిపోతుంది.
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: నీ దగ్గరనుండి నశించిపోయాయి
  rationale: ἀπόλλυμι యొక్క తిరిగి పొందలేని నష్టం లేదా నాశనం భావాన్ని గంభీరమైన కానీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐκέτι οὐ μὴ
  choice: ఇక ఎన్నటికీ
  rationale: బలమైన సంయుక్త నిరాకరణను తెలుగులో సహజంగా, నిర్ణయాత్మకంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτὰ εὑρήσουσιν
  choice: వాటిని కనుగొనరు
  rationale: గ్రీకులో కర్తను పేర్కొనని తృతీయ పురుష బహువచనాన్ని తెలుగులోనూ పేర్కొనని బహువచన క్రియతో నిలిపాం; దీనివల్ల అసలు పాఠంలోని అనిర్దిష్టత కాపాడబడుతుంది.
theological_decisions:
- issue: εὑρήσουσιν యొక్క సూచింపబడని కర్త
  choice: ‘వాటిని ... కనుగొనరు’ అని అనిర్దిష్ట బహువచన కర్తతో అనువదించడం
  alternative: ‘అవి ... దొరకవు’ అనే కర్మణి-సదృశ నిర్మాణం
  rationale: గ్రీకులో స్పష్టమైన కర్త లేదు. తెలుగులో కర్తను చేర్చకుండా బహువచన క్రియ వాడటం మూలంలోని అనిర్దిష్టతను, బబులోను నష్టపు అంతిమత్వాన్ని రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రకటన గ్రంథంలోని విలాపానికి తగిన గంభీరతను ఉంచుతూ, పాతకాలపు లేదా అతిగా సంస్కృతీకృత పదప్రయోగాన్ని నివారించాం. రెండవ పురుష ఏకవచన సంబోధనను ‘నీ’తో నిలిపాం.
