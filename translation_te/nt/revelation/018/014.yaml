    text: లేదా, “అవి ఇక ఎన్నటికీ దొరకవు.” గ్రీకులో ‘కనుగొంటారు’ అనే క్రియకు కర్త స్పష్టంగా పేర్కొనబడలేదు.
    reason: alternative_reading
  revision_rationale: The revision corrects the contextual sense of λιπαρά from mere abundance to luxury and uses more idiomatic Telugu for the paired luxury descriptors. It retains the Greek’s singular ‘fruit,’ the ψυχή-based intensity of desire, the departure/loss imagery, and the indefinite third-person plural in the final clause. The footnote remains correctly anchored to that clause and explains the alternative passive-like Telugu rendering.
