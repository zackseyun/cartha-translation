revisions:
- from: నీ ప్రాణం ఆశించిన పండు నీ దగ్గరనుండి వెళ్లిపోయింది; సమృద్ధిగలవన్నీ, వైభవంగలవన్నీ నీ దగ్గరనుండి నశించిపోయాయి; వాటిని ఇక ఎన్నటికీ కనుగొనరు.[a]
  to: నీ ప్రాణం ఆశించిన పండు నీ దగ్గరనుండి వెళ్లిపోయింది; విలాసవంతమైనవన్నీ, శోభాయమానమైనవన్నీ నీ దగ్గరనుండి నశించిపోయాయి; వాటిని ఇక ఎన్నటికీ కనుగొనరు.[a]
  rationale: The revision corrects the contextual sense of λιπαρά from mere abundance to luxury and uses more idiomatic Telugu for the paired luxury descriptors. It retains the Greek’s singular ‘fruit,’ the ψυχή-based intensity of desire, the departure/loss imagery, and the indefinite third-person plural in the final clause. The footnote remains correctly anchored to that clause and explains the alternative passive-like Telugu rendering.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:05:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately reflects the sequence and finality of the Greek: the desired fruit has departed, the luxurious/splendid possessions are lost, and an unspecified plural subject will never find them. However, “సమృద్ధిగలవన్నీ” primarily denotes things that are abundant, whereas λιπαρά in this luxury-commercial context denotes sumptuous or luxurious things.'
  naturalness: The sentence is clear and suitably solemn. Replacing the somewhat unnatural paired forms “సమృద్ధిగలవన్నీ, వైభవంగలవన్నీ” with idiomatic adjectival substantives improves modern standard Telugu.
  terminology: “ప్రాణం” appropriately preserves the inward-force sense of ψυχή in this elevated lament. “విలాసవంతమైనవి” better conveys λιπαρά, and “శోభాయమానమైనవి” conveys λαμπρά without collapsing the two terms. The indefinite plural in “కనుగొనరు” properly preserves the Greek ambiguity.
  issues:
  - severity: medium
    issue: “సమృద్ధిగలవన్నీ” for πάντα τὰ λιπαρά
    rationale: This wording suggests abundance or plentifulness rather than the sumptuous, luxurious quality denoted by λιπαρά in Revelation 18’s catalogue of luxury goods.
  - severity: low
    issue: “వైభవంగలవన్నీ” is less idiomatic modern Telugu
    rationale: The meaning is understandable, but “శోభాయమానమైనవన్నీ” is more natural while retaining the splendor denoted by λαμπρά.
  revised_text: నీ ప్రాణం ఆశించిన పండు నీ దగ్గరనుండి వెళ్లిపోయింది; విలాసవంతమైనవన్నీ, శోభాయమానమైనవన్నీ నీ దగ్గరనుండి నశించిపోయాయి; వాటిని ఇక ఎన్నటికీ కనుగొనరు.[a]
  revised_footnotes:
