id: REV.18.13
reference: Revelation 18:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and servants, that is[b], human souls.
translation:
  language: te
  text: దాల్చినచెక్క, సుగంధ ద్రవ్యం[a], ధూపద్రవ్యాలు, పరిమళ తైలం, లుబానము, ద్రాక్షారసం, ఒలీవ నూనె, మెత్తని పిండి, గోధుమలు, పశువులు, గొర్రెలు, గుర్రాలు, రథబండ్లు, దేహాలు[b]—అంటే మనుష్యుల ప్రాణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అమోముమ్’; ఇది ఖరీదైన సుగంధ మొక్క లేదా మసాలా.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘దేహాలు’; ఇక్కడ బానిసలుగా అమ్మబడిన మనుషులు ఉద్దేశించబడ్డారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: దాల్చినచెక్క
  rationale: దిగుమతి చేసుకునే సుగంధ వస్తువైన cinnamon‌కు ఆధునిక తెలుగులో స్పష్టమైన సాధారణ పదం.
- source_word: ἄμωμον
  choice: సుగంధ ద్రవ్యం
  rationale: ఖరీదైన సుగంధ మొక్క లేదా మసాలాను సూచిస్తుంది; నిర్దిష్ట వృక్ష గుర్తింపు అనిశ్చితమైనందున సాధారణ అర్థాన్ని పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: θυμιάματα
  choice: ధూపద్రవ్యాలు
  rationale: వర్తక వస్తువుల జాబితాలో ఇది ధూపం వేయే చర్యను కాక, ధూపానికి ఉపయోగించే పదార్థాలను సూచిస్తుంది.
- source_word: μύρον
  choice: పరిమళ తైలం
  rationale: ఖరీదైన సువాసనగల నూనె లేదా లేపనాన్ని సహజంగా, వస్తురూపంగా తెలియజేస్తుంది.
- source_word: λίβανον
  choice: సాంబ్రాణి
  rationale: ముందున్న విస్తృతార్థక ధూపద్రవ్యాలకంటే భిన్నంగా frankincense అనే ప్రత్యేక సుగంధ జిగురును సూచిస్తుంది.
- source_word: ἔλαιον
  choice: ఒలీవ నూనె
  rationale: ఈ సందర్భంలో నూనె అనగా ఒలీవ నూనె; ఆధునిక పాఠకునికి అస్పష్టత లేకుండా పేర్కొన్నాం.
- source_word: σεμίδαλιν
  choice: మెత్తని పిండి
  rationale: నాణ్యమైన, సన్నగా చేసిన పిండిని సూచించే సహజ తెలుగు రూపం.
- source_word: σῖτον
  choice: గోధుమలు
  rationale: ధాన్యం అనే విస్తృత అర్థం ఉన్నా, ఈ వర్తక జాబితాలో గోధుమలు అనే నిర్దిష్ట అర్థమే సంభావ్యం.
- source_word: κτήνη
  choice: పశువులు
  rationale: పెంపుడు జంతువులను, ముఖ్యంగా పెద్ద పశువులను సూచిస్తుంది; తరువాతి గొర్రెలతో భేదాన్ని నిలుపుతుంది.
- source_word: πρόβατα
  choice: గొర్రెలు
  rationale: పదానికి నేరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: ῥεδῶν
  choice: రథాలు
  rationale: నాలుగు చక్రాల వాహనాలను సూచిస్తుంది; తెలుగు బైబిల్ సందర్భంలో సహజంగా అర్థమయ్యే సంక్షిప్త పదం, అయితే ఇది తప్పనిసరిగా యుద్ధ రథాలనే సూచించదు.
- source_word: σωμάτων
  choice: దేహాలు
  rationale: గ్రీకు పదం అక్షరార్థాన్ని నిలిపి, మనుషులను సరుకులుగా దిగజార్చిన జాబితాలోని దిగ్భ్రాంతికరమైన భాషను కాపాడుతుంది.
- source_word: ψυχὰς ἀνθρώπων
  choice: మనుష్య ప్రాణాలు
  rationale: ψυχή యొక్క ప్రాణం/వ్యక్తి అనే విస్తృత భావాన్ని నిలుపుతూ, దేహాలు అనే ముందు పదంతో ఉన్న ఉద్దేశపూర్వక ఉద్రిక్తతను కాపాడుతుంది.
theological_decisions:
- issue: σωμάτων καὶ ψυχὰς ἀνθρώπων యొక్క సంబంధం
  choice: దేహాలు—అంటే మనుష్య ప్రాణాలు
  alternative: బానిసలు, అంటే మనుష్య ప్రాణాలు; దేహాలు మరియు మనుష్యుల ప్రాణాలు
  rationale: మూలంలోని ‘దేహాలు’ అనే వస్తుకరణ భాషను తొలగించకుండా, తరువాతి పదబంధం మనుషులనే సూచిస్తుందని డాష్ మరియు ‘అంటే’ ద్వారా తెలియజేస్తుంది. బానిస వ్యాపార సందర్భాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది; పాఠ్యంలో మాత్రం మూలంలోని వాక్చాతుర్య ఉద్రిక్తత నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వర్తక జాబితా శైలిని ఉపయోగించాం. ప్రతి అంశాన్ని స్పష్టంగా వేరు చేసి, చివరలో మనుషుల వ్యాపారంపై మూలంలోని తీవ్ర నైతిక ప్రభావాన్ని నిలిపాం.
