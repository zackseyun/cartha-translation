id: REV.18.1
reference: Revelation 18:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: te
  text: ఈ సంగతుల తర్వాత, పరలోకం నుండి దిగివస్తున్న మరొక దేవదూతను నేను చూశాను. అతనికి గొప్ప అధికారం ఉంది; అతని మహిమవల్ల భూమి ప్రకాశించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని మహిమ నుండి వెలువడిన కాంతితో భూమి ప్రకాశించింది.”
    reason: ἐκ τῆς δόξης αὐτοῦ అనే పదబంధంలోని మూలసూచక భావాన్ని మరింత స్పష్టంగా చూపే అనువాద ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ఈ సంగతుల తర్వాత
  rationale: దర్శనాల వరుసను సూచించే ప్రామాణిక కాలసూచక ప్రయోగం; ταῦτα లోని బహువచన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: తదుపరి దర్శన దృశ్యాన్ని పరిచయం చేసే ὁράω క్రియ యొక్క సరళ భూతకాల భావాన్ని అదనపు అర్థం చేర్చకుండా తెలియజేస్తుంది.
- source_word: ἄλλον ἄγγελον
  choice: మరొక దేవదూతను
  rationale: దర్శన క్రమంలో ఇంకొక దూతను ἄλλον సూచిస్తుంది; ఈ భావానికి ఇది సహజమైన, స్పష్టమైన తెలుగు.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి దిగివస్తున్న
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలీనమైన దృశ్యాన్ని చూపుతుంది; ἐκ మూలస్థానాన్ని ‘నుండి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: అతనికి గొప్ప అధికారం ఉంది
  rationale: ἐξουσία కేవలం బలంకన్నా అధికారం లేదా అధికారహక్కును సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἡ γῆ
  choice: భూమి
  rationale: ఇక్కడి విశ్వవ్యాప్త ప్రకాశ దృశ్యం స్థానిక ‘దేశం’ కన్నా భూమిని సూచిస్తుంది.
- source_word: ἐφωτίσθη
  choice: ప్రకాశించింది
  rationale: φωτίζω యొక్క భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. తెలుగు అకర్మక రూపం దృశ్య ఫలితాన్ని సునిశితంగా వ్యక్తం చేసినా, గ్రీకు నిష్క్రియార్థంలోని మూలం/కారణం తరువాతి పదబంధంలో నిలుస్తుంది.
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: అతని మహిమవల్ల
  rationale: ἐκ ఇక్కడ ప్రకాశానికి మూలం లేదా కారణాన్ని సూచిస్తుంది; ‘మహిమవల్ల’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది. మరింత అక్షరార్థమైన మూలసూచనను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: దేవదూత అధికారం, మహిమల స్వభావం
  choice: దేవదూతకు గొప్ప అధికారం, మహిమ ఉన్నాయని వచనం చెప్పినట్లుగానే అనువదించడం
  alternative: భూమిని ప్రకాశింపజేసే మహిమ కారణంగా ఈ దేవదూతను దైవిక వ్యక్తిగా వ్యాఖ్యానించడం
  rationale: గ్రీకు పాఠం దేవదూతకు ‘గొప్ప అధికారం,’ ‘అతని మహిమ’ అని ఆపాదిస్తుంది; అయితే అతన్ని దేవుడిగా గుర్తించదు. అందువల్ల మహిమను తగ్గించకుండానే, పాఠానికి మించిన సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన దర్శన శైలిని వాడాం. ‘దేవదూత,’ ‘అధికారం,’ ‘మహిమ’ వంటి సాధారణ బైబిలు పదాలను నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం.
