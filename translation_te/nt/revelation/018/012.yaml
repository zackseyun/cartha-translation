translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వాణిజ్య-జాబితా శైలి వాడబడింది. మూలవాక్యం మునుపటి వచనంపై వ్యాకరణపరంగా ఆధారపడే జాబితా అయినప్పటికీ, ఇచ్చిన వచనాన్ని చదవదగిన స్వతంత్ర వాక్యంగా చేయడానికి చివర ‘ఇవన్నీ సరుకుగా ఉన్నాయి’ అని అమర్చబడింది. అరుదైన చెక్కపేరులోని అనిశ్చితి పాదటిప్పణిలో భద్రపరచబడింది.
