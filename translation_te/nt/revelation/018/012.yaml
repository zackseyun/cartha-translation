id: REV.18.12
reference: Revelation 18:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γόμον χρυσοῦ καὶ ἀργύρου καὶ λίθου τιμίου καὶ ⸀μαργαριτῶν καὶ βυσσίνου καὶ ⸀πορφύρας καὶ σιρικοῦ καὶ κοκκίνου, καὶ πᾶν ξύλον θύϊνον καὶ πᾶν σκεῦος ἐλεφάντινον καὶ πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/012.yaml
  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: te
  text: బంగారం, వెండి, విలువైన రాళ్లు, ముత్యాలు, మెత్తని నారవస్త్రం, ఊదారంగు బట్ట, పట్టు, కెంపురంగు బట్ట, అన్ని రకాల సిట్రన్ కలప[a], దంతంతో చేసిన ప్రతి రకమైన వస్తువు, అత్యంత విలువైన కలపతోను, కంచుతోను, ఇనుముతోను, పాలరాతితోను చేసిన ప్రతి రకమైన వస్తువుల సరుకు;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఖరీదైన సువాసనగల ‘థుయిన్’ కలప.
    reason: lexical_alternative
lexical_decisions:
- source_word: γόμον
  choice: సరుకుగా
  rationale: ఈ వాణిజ్య విలాపంలో ఓడలో రవాణా చేసే సరుకు లేదా వ్యాపార సరుకు అనే సమూహార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λίθου τιμίου
  choice: విలువైన రాళ్లు
  rationale: గ్రీకులో ఏకవచన పదార్థనామంగా ఉన్నా, తెలుగులో ఈ వ్యాపార జాబితాలో బహువచనం సహజంగా సమూహార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: μαργαριτῶν
  choice: ముత్యాలు
  rationale: గ్రీకు బహువచనానికి నేరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: βυσσίνου
  choice: సన్నని నారబట్ట
  rationale: ఉన్నత నాణ్యతగల మెత్తని నారవస్త్రాన్ని స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా సూచిస్తుంది.
- source_word: πορφύρας
  choice: ఊదారంగు బట్ట
  rationale: పదం రంగును, రంగువేసిన వస్త్రాన్ని సూచించగలదు; వ్యాపార సరుకుల సందర్భంలో వస్త్రార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: σιρικοῦ
  choice: పట్టు
  rationale: పట్టు లేదా పట్టువస్త్రం అనే ప్రామాణిక అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: κοκκίνου
  choice: ఎర్రని బట్ట
  rationale: స్కార్లెట్ వర్ణపు వస్త్రాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πᾶν ξύλον θύϊνον
  choice: అన్ని రకాల సిట్రన్ కలప[a]
  rationale: θύϊνος అనే అరుదైన చెక్కపేరును సాంప్రదాయ గుర్తింపైన సిట్రన్ కలపగా ఇస్తూ, దాని అనిశ్చితిని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: దంతంతో చేసిన ప్రతి రకమైన వస్తువు
  rationale: σκεῦος పాత్రకే పరిమితం కాక వస్తువు లేదా ఉపకరణం అనే విస్తృత అర్థం కలిగినందున ‘వస్తువు’ అనేది సందర్భానికి తగినది.
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: అత్యంత విలువైన కలపతో ... చేసిన ప్రతి రకమైన వస్తువు
  rationale: τιμιωτάτου లోని అతిశయార్థాన్ని ‘అత్యంత విలువైన’ అని నిలుపుతూ, ἐκ సూచించే పదార్థాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: χαλκοῦ
  choice: కంచుతో
  rationale: ఈ ప్రాచీన వస్తు జాబితాలో χαλκός కు సాధారణంగా సరిపోయే మిశ్రలోహార్థం; ‘రాగి’ కూడా సాధ్యమైనా కంచు సందర్భోచితం.
- source_word: σιδήρου
  choice: ఇనుముతో
  rationale: ప్రామాణిక నేర అనువాదం.
- source_word: μαρμάρου
  choice: పాలరాతితో
  rationale: మార్బుల్ రాయికి సహజమైన తెలుగు పేరు.
