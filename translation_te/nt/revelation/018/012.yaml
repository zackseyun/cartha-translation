- from: బంగారం, వెండి, విలువైన రాళ్లు, ముత్యాలు, సన్నని నారబట్ట, ఊదారంగు బట్ట, పట్టు, ఎర్రని బట్ట, అన్ని రకాల సిట్రన్ కలప[a], దంతంతో చేసిన ప్రతి రకమైన వస్తువు, అత్యంత విలువైన కలపతో, కంచుతో, ఇనుముతో, పాలరాతితో చేసిన ప్రతి రకమైన వస్తువు—ఇవన్నీ సరుకుగా ఉన్నాయి.
