- from: 'అప్పుడు బలవంతుడైన ఒక దేవదూత పెద్ద తిరుగలి రాయివంటి రాయిని ఎత్తి సముద్రంలో పడవేస్తూ ఇలా అన్నాడు: “ఇదే విధంగా మహానగరమైన బబులోను మహా వేగంతో పడవేయబడుతుంది; ఇక ఎన్నటికీ కనిపించదు.”[a]'
  to: 'ఒక బలవంతుడైన దేవదూత పెద్ద తిరుగలి రాయిలాంటి ఒక రాయిని ఎత్తి సముద్రంలో పడవేసి ఇలా అన్నాడు: “ఇదే విధంగా మహా నగరమైన బబులోను ప్రబలమైన ఉద్ధృతితో[a] పడవేయబడుతుంది; ఇక ఎన్నటికీ కనిపించదు.”'
  rationale: The revision retains the source's symbolic comparison, future passive overthrow, and emphatic finality. It corrects the temporal/action relationship, uses more idiomatic Telugu for the millstone comparison, and renders ὁρμήματι with force as well as sudden movement. The footnote marker is moved to its lexical anchor.
