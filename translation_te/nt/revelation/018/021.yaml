id: REV.18.21
reference: Revelation 18:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: te
  text: 'ఒక బలవంతుడైన దేవదూత పెద్ద తిరుగలి రాయిలాంటి ఒక రాయిని ఎత్తి సముద్రంలో పడవేసి ఇలా అన్నాడు: “ఇదే విధంగా మహా నగరమైన బబులోను ప్రబలమైన ఉద్ధృతితో[a] పడవేయబడుతుంది; ఇక ఎన్నటికీ కనిపించదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ప్రబలమైన ఉద్ధృతితో” అనే మాటకు “బలమైన దూకుడుతో,” “బలప్రయోగంతో,” లేదా “హింసాత్మకంగా” అని కూడా అర్థం కావచ్చు. గ్రీకు పదం అకస్మాత్తైన, బలమైన కదలికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρεν
  choice: ఎత్తి
  rationale: దేవదూత సూచనాత్మక చర్య కోసం రాయిని పైకెత్తడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: బలవంతుడైన ఒక దేవదూత
  rationale: εἷς లోని ‘ఒక’ భావాన్ని నిలుపుతూ, ἰσχυρός సూచించే బలాన్ని గంభీరమైన కాని సులభమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λίθον ὡς μύλινον μέγαν
  choice: పెద్ద తిరుగలి రాయివంటి రాయిని
  rationale: ὡς సూచించే పోలికను నిలుపుతుంది; ఆ రాయి నిజంగా తిరుగలి రాయేనని నిర్ధారించకుండా దాని భారీ పరిమాణం, బరువు అనే దృశ్యాన్ని అందిస్తుంది.
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: సముద్రంలో పడవేస్తూ
  rationale: βάλλω యొక్క బలమైన విసిరివేతను సందర్భానుసారంగా సహజంగా వ్యక్తం చేస్తుంది; λέγων తో చర్య సమకాలీనతను తెలుగులో సులభంగా కలుపుతుంది.
- source_word: Οὕτως
  choice: ఇదే విధంగా
  rationale: సూచనాత్మక చర్యకు దాని వివరణకు మధ్య ఉన్న స్పష్టమైన పోలికను నిలుపుతుంది.
- source_word: ὁρμήματι
  choice: మహా వేగంతో
  rationale: ఈ పదంలోని అకస్మాత్తైన, బలమైన దూకుడు లేదా ఉద్ధృత కదలికను వ్యక్తం చేస్తుంది; ‘హింసతో’ అనే తెలుగు పదం కలిగించగల మానవ హింస అనే పరిమిత భావాన్ని నివారిస్తుంది.
- source_word: βληθήσεται
  choice: పడవేయబడుతుంది
  rationale: ముందు రాయి పడవేయబడిన చర్యతో ఉన్న βάλλω పదప్రతిధ్వనిని, అలాగే భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: మహానగరమైన బబులోను
  rationale: బబులోనును ‘మహానగరం’గా పేర్కొనే విశేషణాత్మక సంబంధాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: ఇక ఎన్నటికీ కనిపించదు
  rationale: οὐ μή యొక్క బలమైన నిరాకరణను, ἔτι యొక్క ‘ఇకపై’ భావాన్ని సహజంగా మరియు నిర్ణయాత్మకంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: బబులోను నాశన దృశ్యం యొక్క స్వభావం
  choice: తీర్పు బలమైనదిగా, అంతిమమైనదిగా అనువదించబడింది; ‘బబులోను’ అక్షరార్థ నగరమా, సంకేతమా, లేక రెండూ కలిసిన రూపమా అన్నది నిర్ధారించలేదు.
  alternative: బబులోనును కేవలం చారిత్రక నగరంగా లేదా దేవునికి విరోధమైన ప్రపంచ వ్యవస్థగా మాత్రమే స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం సూచనాత్మక చర్యను, విపత్తుతో కూడిన పతనాన్ని చూపుతుంది గాని బబులోను యొక్క సూచనార్థాన్ని ఈ వచనంలోనే పరిష్కరించదు. అందువల్ల మూలంలోని అపోకలిప్టిక్ ఉద్వేగం అలాగే ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన అపోకలిప్టిక్ శైలిని, సాధారణ పాఠకునికి అర్థమయ్యే పదజాలంతో సమతుల్యం చేశాం. ‘తిరుగలి రాయి’ ద్వారా పురాతన భారీ మిల్లురాయి దృశ్యాన్ని నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
