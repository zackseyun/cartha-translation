revisions:
- from: వారు భూమి విశాల విస్తీర్ణం మీదికి వచ్చి[a], పరిశుద్ధుల శిబిరాన్నీ, ప్రియమైన పట్టణాన్నీ[b] చుట్టుముట్టారు[c]. అప్పుడు ఆకాశం నుండి అగ్ని దిగివచ్చి వారిని దహించివేసింది.
  to: వారు భూమి విశాల విస్తీర్ణమంతటా ఎక్కి వచ్చి[a], పరిశుద్ధుల శిబిరాన్నీ ప్రియమైన పట్టణాన్నీ[b] చుట్టుముట్టారు[c]. పరలోకం నుండి అగ్ని దిగివచ్చి వారిని దహించివేసింది.
  rationale: The revision restores the movement implicit in ἀνέβησαν, improves the Telugu expression for ἐπὶ τὸ πλάτος τῆς γῆς without adding a geographical ‘plain,’ and renders οὐρανοῦ as ‘heaven’ in the apocalyptic setting. All interpretive ambiguity concerning the beloved city remains in place, and the complete footnote set retains valid anchors.
