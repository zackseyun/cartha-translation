id: REV.20.9
reference: Revelation 20:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: te
  text: వారు భూమి విశాల విస్తీర్ణమంతటా ఎక్కి వచ్చి[a], పరిశుద్ధుల శిబిరాన్నీ ప్రియమైన పట్టణాన్నీ[b] చుట్టుముట్టారు[c]. పరలోకం నుండి అగ్ని దిగివచ్చి వారిని దహించివేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘భూమి వెడల్పు మీదికి.’ ఈ గ్రీకు ప్రయోగం విస్తారమైన భూభాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ వచనం ‘ప్రియమైన పట్టణం’ ఏదో స్పష్టంగా చెప్పదు. సాధారణంగా దీనిని యెరూషలేముగా లేదా మరింత విస్తృతంగా దేవుని పట్టణంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘చుట్టూ ఆవరించారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν
  choice: వచ్చి
  rationale: ἀναβαίνωలోని పైకి రావడం లేదా ముందుకు సాగడం అనే భావాన్ని సందర్భానికి సహజమైన తెలుగులో తెలియజేస్తుంది; నిర్దిష్ట భౌగోళిక ఎత్తును అనవసరంగా ఊహించదు.
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: భూమి విశాల విస్తీర్ణం మీదికి
  rationale: πλάτοςలోని ‘వెడల్పు, విశాల విస్తీర్ణం’ అనే భావాన్ని కాపాడుతూ, మూలంలో లేని ‘మైదానం’ అనే అర్థాన్ని చేర్చకుండా సహజంగా అనువదిస్తుంది.
- source_word: ἐκύκλευσαν
  choice: చుట్టుముట్టారు
  rationale: సైనిక సందర్భంలో ‘చుట్టూ ఆవరించడం’ అనే క్రియార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: παρεμβολὴν
  choice: శిబిరం
  rationale: παρεμβολή సూచించే శిబిరం లేదా మకాం అనే భావాన్ని సంక్షిప్తంగా కాపాడుతుంది; మూలంలో స్పష్టంగా లేని ‘సైనిక’ అనే విశేషణాన్ని చేర్చదు.
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధుల
  rationale: ప్రకటన గ్రంథంలో ἅγιοιకి స్థిరమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం; దేవునికి ప్రత్యేకించబడిన ప్రజలను సూచిస్తుంది.
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: ప్రియమైన పట్టణం
  rationale: ἠγαπημένηνలోని ప్రేమించబడిన స్థితిని సహజంగా తెలియజేస్తూ, ప్రేమించే వ్యక్తి ఎవరో మూలం చెప్పనందున అనువాదంలోనూ పేర్కొనదు.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: ఆకాశం నుండి అగ్ని దిగివచ్చి
  rationale: అగ్ని పైనుండి దిగివచ్చే మూల చిత్రణను నేరుగా, సహజంగా కాపాడుతుంది.
- source_word: κατέφαγεν αὐτούς
  choice: వారిని దహించివేసింది
  rationale: అగ్ని కర్తగా ఉన్నప్పుడు κατεσθίωలోని పూర్తిగా మింగివేయడం లేదా నాశనం చేయడం అనే భావానికి ఇది సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: ‘ప్రియమైన పట్టణం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ప్రియమైన పట్టణం’ అని మాత్రమే ఉంచడం
  alternative: యెరూషలేము; లేదా అంత్యకాల దేవుని పట్టణం/ప్రజలు
  rationale: గ్రీకు పాఠ్యం ఈ పట్టణానికి ఇక్కడ పేరు పెట్టదు. దానిని యెరూషలేముగా గానీ మరొక నిర్దిష్ట భావంగా గానీ అనువాదంలోనే గుర్తించడం వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. ‘విశాల విస్తీర్ణం’ మూలంలోని πλάτοςను కాపాడుతుంది; ‘మైదానం’ వంటి అదనపు భౌగోళిక భావాన్ని చేర్చలేదు. ‘ప్రియమైన పట్టణం’ అనే అస్పష్టత ఉద్దేశపూర్వకంగా నిలుపబడింది.
