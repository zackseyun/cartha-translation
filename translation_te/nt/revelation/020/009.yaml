review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two objects surrounded, the unspecified identity of the beloved city, and the consuming action of the fire. However, «వచ్చి» does not adequately represent the upward/advancing component of ἀνέβησαν, and «భూమి విశాల విస్తీర్ణం మీదికి» is syntactically less natural than an expression meaning ‘throughout/over the broad extent of the earth.’ «పరలోకం నుండి» more clearly renders ἐκ τοῦ οὐρανοῦ in this apocalyptic context than the potentially meteorological «ఆకాశం నుండి».
  naturalness: The revision uses fluent modern standard Telugu. «భూమి విశాల విస్తీర్ణమంతటా ఎక్కి వచ్చి» conveys the expansive movement without importing ‘plain,’ while «చుట్టుముట్టారు» and «దహించివేసింది» remain clear and suitably formal.
  terminology: «పరిశుద్ధులు», «శిబిరం», and «ప్రియమైన పట్టణం» are appropriate and preserve the Greek’s register and ambiguity. The city is not identified in the main text. Footnote markers are retained and attached to their relevant expressions.
  issues:
  - severity: medium
    issue: The rendering «వచ్చి» weakens ἀνέβησαν.
    rationale: ἀνέβησαν means ‘went/came up’ and includes an upward or advancing sense that bare «వచ్చి» does not express.
  - severity: low
    issue: «భూమి విశాల విస్తీర్ణం మీదికి» is somewhat awkward in Telugu.
    rationale: «విశాల విస్తీర్ణమంతటా» naturally expresses movement over a vast extent and avoids adding ‘plain.’
  - severity: low
    issue: «ఆకాశం నుండి» can suggest the physical sky rather than ‘heaven.’
    rationale: In Revelation’s context, «పరలోకం నుండి» more clearly communicates οὐρανοῦ while retaining the source image.
  revised_text: వారు భూమి విశాల విస్తీర్ణమంతటా ఎక్కి వచ్చి[a], పరిశుద్ధుల శిబిరాన్నీ ప్రియమైన పట్టణాన్నీ[b] చుట్టుముట్టారు[c]. పరలోకం నుండి అగ్ని దిగివచ్చి వారిని దహించివేసింది.
