- from: ఆ దూత అతణ్ణి అగాధంలోకి[a] పడవేసి, దాన్ని మూసి, అతని పైన ముద్ర వేశాడు. వెయ్యి సంవత్సరాలు పూర్తయ్యే వరకు అతడు ఇక జనాంగాలను మోసగించకుండా[b] ఉండేందుకు అలా చేశాడు. ఆ తరువాత అతడు కొద్దికాలం పాటు విడుదల చేయబడాలి[c].
  to: ఆ దూత అతణ్ణి అగాధంలోకి[a] త్రోసివేసి, దాన్ని మూసి, అతని మీదుగా ముద్ర వేశాడు; వెయ్యి సంవత్సరాలు పూర్తయ్యే వరకు అతడు ఇక జనాంగాలను మోసగించకుండా ఉండేందుకు ఇలా చేశాడు. ఆ తరువాత అతడు కొద్దికాలం పాటు విడుదల చేయబడాలి[c].
  rationale: ముద్ర వేయబడిన స్థలం-సంబంధాన్ని ‘అతని మీదుగా ముద్ర వేశాడు’గా సరిచేశాం. βάλλωలోని బలవంతమైన చలనాన్ని ‘త్రోసివేసి’ ద్వారా సహజంగా ప్రతిబింబించాం. ఉద్దేశార్థక భాగాన్ని మూల వాక్య నిర్మాణానికి దగ్గరగా ఉంచాం. ముసాయిదాలోని [b] పాదసూచిక ప్రధాన అనువాదంలోని ‘మోసగించకుండా’ పదానికే సమానమైన ప్రత్యామ్నాయాన్ని మాత్రమే ఇచ్చినందున, సురక్షితమైన సవరించిన పాదసూచిక సమితిలో దానిని చేర్చలేదు; మిగిలిన సూచికలు తమ సంబంధిత పదాల వద్ద ఉన్నాయి.
