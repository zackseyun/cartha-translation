id: REV.20.3
reference: Revelation 20:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: te
  text: ఆ దూత అతణ్ణి అగాధంలోకి[a] త్రోసివేసి, దాన్ని మూసి, అతని మీదుగా ముద్ర వేశాడు; వెయ్యి సంవత్సరాలు పూర్తయ్యే వరకు అతడు ఇక జనాంగాలను మోసగించకుండా ఉండేందుకు ఇలా చేశాడు. ఆ తరువాత అతడు కొద్దికాలం పాటు విడుదల చేయబడాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అడుగులేని గొయ్యిలోకి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘కొద్దికాలం విడిచిపెట్టబడాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: పడవేసి
  rationale: βάλλω ఇక్కడ బలవంతంగా ఒక గమ్యస్థానంలోకి వేయడాన్ని సూచిస్తుంది. ‘పడవేసి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ చర్య బలాన్ని నిలుపుతుంది.
- source_word: ἄβυσσον
  choice: అగాధం
  rationale: ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ స్థలపదంగా ἄβυσσος భావాన్ని ‘అగాధం’ సంక్షిప్తంగా, స్థిరంగా తెలియజేస్తుంది; ‘అడుగులేని గొయ్యి’ అనే వివరణాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἔκλεισεν
  choice: దాన్ని మూసి
  rationale: κλείω యొక్క సాధారణ అర్థం మూయడం. మూలంలో లేని తాళం వేయడం అనే భావాన్ని చేర్చకుండా ‘మూసి’ అని అనువదించాం.
- source_word: ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: అతని పైన ముద్ర వేశాడు
  rationale: σφραγίζω అంటే ముద్ర వేయడం; ἐπάνω αὐτοῦ అతని పైన ఉన్న అగాధపు మూసివేతను భద్రపరచిన స్థలసంబంధాన్ని సూచిస్తుంది. ద్వారం లేదా మూత వంటి వివరాలను మూలంలో లేనందున చేర్చలేదు.
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: అతడు ఇక జనాంగాలను మోసగించకుండా ఉండేందుకు
  rationale: πλανάω ఇక్కడ మోసగించడం లేదా తప్పుదారి పట్టించడం అనే భావం కలిగి ఉంది. ἔτι యొక్క ‘ఇక’ భావాన్ని క్రియతో కలిపి, τὰ ἔθνηను ప్రకటన గ్రంథానికి తగిన ‘జనాంగాలు’గా ఇచ్చాం.
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: వెయ్యి సంవత్సరాలు పూర్తయ్యే వరకు
  rationale: τελεσθῇ ఆ కాలం సంపూర్ణ ముగింపుకు చేరడాన్ని సూచిస్తుంది. ఈ రూపం కాలపరిమితిని సహజ తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: μετὰ ταῦτα
  choice: ఆ తరువాత
  rationale: కాలక్రమ మార్పును ఆధునిక తెలుగులో సహజంగా తెలియజేస్తూ గ్రీకు పదబంధం భావాన్ని నిలుపుతుంది.
- source_word: δεῖ
  choice: చేయబడాలి
  rationale: δεῖలోని అవసరతను ‘విడుదల చేయబడాలి’ అనే నిర్మాణంలో ‘చేయబడాలి’ నిలుపుతుంది; ఆ అవసరతకు గల దైవిక లేదా కథనాత్మక విధానాన్ని అదనంగా నిర్వచించదు.
- source_word: λυθῆναι αὐτὸν
  choice: అతడు విడుదల చేయబడాలి
  rationale: λύω యొక్క కర్మణి రూపం నిర్బంధం నుంచి విడిపించబడడాన్ని సూచిస్తుంది. ‘విడుదల చేయబడాలి’ ప్రస్తుత తెలుగులో స్పష్టంగా ఉండి కర్మణి భావాన్ని కాపాడుతుంది.
- source_word: μικρὸν χρόνον
  choice: కొద్దికాలం పాటు
  rationale: ఇది పరిమిత వ్యవధిని సూచించే కాలవాచక ప్రయోగం; ‘కొద్దికాలం పాటు’ సహజంగా, కచ్చితంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ‘వెయ్యి సంవత్సరాలు’ యొక్క స్వభావం
  choice: τὰ χίλια ἔτηను ఎటువంటి వ్యాఖ్యాత్మక విశేషణం లేకుండా ‘వెయ్యి సంవత్సరాలు’గా నేరుగా అనువదించాం.
  alternative: అక్షరార్థమైన సహస్రాబ్దం; ప్రతీకాత్మకమైన దీర్ఘకాలం.
  rationale: వాక్యం ఆ కాలాన్ని ఎలా వ్యాఖ్యానించాలో తేల్చదు. నేర అనువాదం విభిన్న అంత్యకాల వ్యాఖ్యానాల మధ్య ఉన్న ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: అపోకలిప్టిక్ సందర్భంలో δεῖ యొక్క బలం
  choice: ‘విడుదల చేయబడాలి’ అని అవసరతను నిలిపాం.
  alternative: దైవ నిర్ణయం అని స్పష్టీకరించడం; కేవలం కథనపరమైన అనివార్యతగా చూపడం.
  rationale: గ్రీకు పదం అవసరతను తెలియజేస్తుంది గాని దాని విధానాన్ని ఈ వాక్యంలో వివరించదు. అందువల్ల అనువాదం అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. మునుపటి వాక్యంలో స్పష్టమైన కర్త అయిన దూతను ‘ఆ దూత’గా పేర్కొనడం ద్వారా వరుస సర్వనామాల వల్ల కలిగే అస్పష్టతను తగ్గించాం. సాతానును సూచించే సర్వనామాలకు అతిశయ గౌరవార్థక రూపాలు గానీ అవమానార్థక రూపాలు గానీ వాడకుండా సాధారణ రూపాలను ఎంచుకున్నాం.
