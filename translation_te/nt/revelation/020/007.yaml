id: REV.20.7
reference: Revelation 20:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: te
  text: ఆ వెయ్యి సంవత్సరాలు పూర్తయినప్పుడు, సాతాను తన చెరసాల నుండి విడుదల చేయబడతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: అప్పుడు
  rationale: భవిష్యత్తులో ఎదురుచూస్తున్న సమయాన్ని సూచించే ఉపవాక్యంలో, ‘పూర్తయినప్పుడు’తో కలిసి సహజమైన తెలుగు కాలసంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: τελεσθῇ
  choice: పూర్తయినప్పుడు
  rationale: τελέω యొక్క కర్మణి రూపం నిర్దిష్ట కాలవ్యవధి పూర్తికావడాన్ని సూచిస్తుంది; తెలుగు నిర్మాణంలో కర్మణి భావం సహజంగా నిలుస్తుంది.
- source_word: τὰ χίλια ἔτη
  choice: ఆ వెయ్యి సంవత్సరాలు
  rationale: గ్రీకు నిర్దిష్ట సూచనను, ముందుగా ప్రస్తావించిన కాలవ్యవధిని సూచించే తెలుగు ‘ఆ’ ద్వారా స్పష్టంగా నిలుపుతుంది; దాని అక్షరార్థ లేదా ప్రతీకాత్మక స్వభావాన్ని నిర్ణయించదు.
- source_word: λυθήσεται
  choice: విడుదల చేయబడతాడు
  rationale: భవిష్యత్ కర్మణి భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; సానుకూల విముక్తి భావాన్ని అనవసరంగా జోడించదు.
- source_word: Σατανᾶς
  choice: సాతాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ/బిరుదు రూపం.
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: తన చెరసాల నుండి
  rationale: ఈ సందర్భంలో φυλακή బంధించబడే స్థలాన్ని సూచిస్తుంది. కర్తను తిరిగి సూచించే αὐτοῦకు సహజమైన తెలుగు ప్రతిబింబ సర్వనామం ‘తన’.
theological_decisions:
- issue: వెయ్యి సంవత్సరాల స్వభావం
  choice: ‘ఆ వెయ్యి సంవత్సరాలు’ అని నేరుగా అనువదించడం
  alternative: దానిని అక్షరార్థ వెయ్యేళ్ల పాలనగా లేదా ప్రతీకాత్మక దీర్ఘకాలంగా వివరణాత్మకంగా అనువదించడం
  rationale: ఈ వచనం నిర్దిష్ట కాలవ్యవధిని పేర్కొంటుంది గాని దాని అక్షరార్థ లేదా ప్రతీకాత్మక స్వభావాన్ని తేల్చదు. అందువల్ల ఏ సహస్రాబ్ద సిద్ధాంతాన్నీ అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం. ‘చెరసాల’ సాధారణ పాఠకునికి అర్థమయ్యే బైబిలీయ గౌరవభాషను నిలుపుతుంది.
