id: REV.20.4
reference: Revelation 20:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: te
  text: నేను సింహాసనాలను చూశాను. వాటిమీద వారు కూర్చున్నారు; తీర్పు వారికి ఇవ్వబడింది. యేసు సాక్ష్యం కారణంగా[a], దేవుని వాక్యం కారణంగా శిరచ్ఛేదం చేయబడినవారి ఆత్మలను, అలాగే మృగానికిగానీ దాని ప్రతిమకుగానీ ఆరాధన చేయని, తమ నుదుటిమీదగానీ చేతిమీదగానీ ముద్రను పొందని వారిని చూశాను. వారు జీవానికి వచ్చి, మెస్సీయతో[b] కలిసి వెయ్యి సంవత్సరాలు పరిపాలించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసును గురించి వారు ఇచ్చిన సాక్ష్యం కారణంగా.’ ‘యేసు సాక్ష్యం’ అనే గ్రీకు పదబంధం యేసు ఇచ్చిన సాక్ష్యాన్ని లేదా యేసును గురించిన సాక్ష్యాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘క్రీస్తుతో.’ గ్రీకు Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున ప్రధాన పాఠంలో ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνους
  choice: సింహాసనాలను
  rationale: ప్రత్యక్షమైన దృశ్యరూపాన్ని, ప్రకటన గ్రంథపు రాజసమైన శైలిని నిలుపుతుంది.
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: వాటిమీద వారు కూర్చున్నారు
  rationale: క్రియలోని కర్తను పేరుపెట్టి నిర్ధారించకుండా, గ్రీకులో ఉన్న బహువచన క్రియను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: తీర్పు వారికి ఇవ్వబడింది
  rationale: ఇది తీర్పు చెప్పే అధికారం కావచ్చా, తీర్పే కావచ్చా అనే κρίμα పదంలోని భావ విస్తృతిని వ్యాఖ్యానంతో కుదించకుండా ఉంచుతుంది.
- source_word: ψυχὰς
  choice: ఆత్మలను
  rationale: దర్శనాత్మక సందర్భంలోని రూపాన్ని నిలుపుతుంది; ‘వ్యక్తులను’ అని సాదాసీదాగా మార్చదు.
- source_word: πεπελεκισμένων
  choice: శిరచ్ఛేదం చేయబడినవారి
  rationale: తల నరికి చంపబడడాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గొడ్డలి అనే సాధనాన్ని అనవసరంగా చేర్చదు.
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: యేసు సాక్ష్యం కారణంగా
  rationale: διά యొక్క కారణార్థాన్ని తెలియజేస్తూ, ‘యేసు ఇచ్చిన సాక్ష్యం’ లేదా ‘యేసును గురించి ఇచ్చిన సాక్ష్యం’ అనే షష్ఠీ విభక్తి సందిగ్ధతను ప్రధాన పాఠంలో నిలుపుతుంది.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యం కారణంగా
  rationale: కారణార్థాన్ని స్పష్టంగా, సాంప్రదాయికమైనప్పటికీ సులభంగా అర్థమయ్యే పదబంధంతో అందిస్తుంది.
- source_word: προσεκύνησαν
  choice: పూజ చేయకుండా
  rationale: కేవలం శారీరకంగా నమస్కరించడం కంటే సందర్భంలోని ఆరాధనా భావాన్ని తెలియజేస్తుంది.
- source_word: θηρίον
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలోని స్థిరమైన అపోకలిప్టిక్ పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: εἰκόνα
  choice: ప్రతిమ
  rationale: దృశ్యరూపం మరియు ఆరాధనా సందర్భం రెండింటినీ సహజమైన తెలుగులో తెలియజేస్తుంది; ‘విగ్రహం’ అని వ్యాఖ్యానాత్మకంగా మరింత నిర్దిష్టం చేయదు.
- source_word: χάραγμα
  choice: ముద్ర
  rationale: ప్రకటన గ్రంథపు సందర్భంలో గుర్తు లేదా ముద్ర అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἔζησαν
  choice: తిరిగి జీవించారు
  rationale: సందర్భంలోని జీవానికి రావడం అనే సంఘటనాత్మక భావాన్ని వ్యక్తం చేస్తుంది; పునరుత్థాన స్వరూపంపై అదనపు సిద్ధాంత వివరణను చేర్చదు.
- source_word: χριστοῦ
  choice: మెస్సీయతో
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తున్నందున దాని బిరుదార్థాన్ని తెలుగులో ప్రత్యక్షంగా అందిస్తుంది.
- source_word: ἐβασίλευσαν
  choice: పరిపాలించారు
  rationale: రాజులుగా ఏలడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ἐκάθισαν అనే క్రియ కర్త మరియు తీర్పు పొందినవారి గుర్తింపు
  choice: ‘వారు’, ‘వారికి’ అని మాత్రమే ఉంచి వారి గుర్తింపును నిర్ధారించలేదు.
  alternative: వీరమరణం పొందినవారు, పరిశుద్ధులందరూ, లేదా పరలోక న్యాయసభ సభ్యులు అని స్పష్టీకరించడం.
  rationale: గ్రీకు పాఠం కర్తను ప్రత్యక్షంగా పేర్కొనదు; నిర్దిష్ట సమూహాన్ని చేర్చడం వ్యాఖ్యానాన్ని పాఠంలోకి తీసుకురావడం అవుతుంది.
- issue: διὰ τὴν μαρτυρίαν Ἰησοῦ యొక్క అర్థం
  choice: ప్రధాన పాఠంలో ‘యేసు సాక్ష్యం కారణంగా’ అని సందిగ్ధతను నిలిపి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
  alternative: ‘యేసును గురించి వారు ఇచ్చిన సాక్ష్యం కారణంగా’ అని ప్రధాన పాఠంలోనే నిర్ధారించడం.
  rationale: Ἰησοῦ అనే షష్ఠీ రూపం యేసు ఇచ్చిన సాక్ష్యాన్నీ, యేసును గురించిన సాక్ష్యాన్నీ సూచించగలదు.
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో ఇది వ్యక్తినామంలా కాక బిరుదుగా పనిచేస్తుంది; ప్రత్యామ్నాయ సుపరిచిత రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: ἔζησαν యొక్క భావం
  choice: తిరిగి జీవించారు
  alternative: జీవించారు; మళ్లీ బ్రతికారు
  rationale: సందర్భంలోని మరణానంతర జీవప్రాప్తి భావాన్ని తెలియజేస్తూ, దాని స్వరూపం గురించి ఏ ప్రత్యేక సహస్రాబ్ద సిద్ధాంతాన్నీ పాఠంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన దర్శనాత్మక శైలిని ఉపయోగించాం. పొడవైన గ్రీకు వాక్యాన్ని పఠనసౌలభ్యం కోసం కొన్ని తెలుగు వాక్యాలుగా విభజించినా, అంశాల క్రమం మరియు పునరుక్త నిర్మాణం నిలుపబడ్డాయి. ‘వారు’ అనే అనిర్దిష్ట కర్తను అలాగే ఉంచి వ్యాఖ్యానాత్మక గుర్తింపును చేర్చలేదు.
