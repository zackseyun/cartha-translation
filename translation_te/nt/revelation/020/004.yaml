revisions:
- from: నేను సింహాసనాలను చూశాను. వాటిమీద వారు కూర్చున్నారు; తీర్పు వారికి ఇవ్వబడింది. యేసు సాక్ష్యం కారణంగా[a], దేవుని వాక్యం కారణంగా శిరచ్ఛేదం చేయబడినవారి ఆత్మలను కూడా చూశాను. అలాగే మృగానికిగానీ దాని ప్రతిమకుగానీ పూజ చేయకుండా, తమ నుదుటిమీద గానీ చేతిమీద గానీ ముద్రను పొందనివారిని చూశాను. వారు తిరిగి జీవించి, మెస్సీయతో[b] కలిసి వెయ్యి సంవత్సరాలు పరిపాలించారు.
  to: నేను సింహాసనాలను చూశాను. వాటిమీద వారు కూర్చున్నారు; తీర్పు వారికి ఇవ్వబడింది. యేసు సాక్ష్యం కారణంగా[a], దేవుని వాక్యం కారణంగా శిరచ్ఛేదం చేయబడినవారి ఆత్మలను, అలాగే మృగానికిగానీ దాని ప్రతిమకుగానీ ఆరాధన చేయని, తమ నుదుటిమీదగానీ చేతిమీదగానీ ముద్రను పొందని వారిని చూశాను. వారు జీవానికి వచ్చి, మెస్సీయతో[b] కలిసి వెయ్యి సంవత్సరాలు పరిపాలించారు.
  rationale: The revision removes the added ‘again’ from the rendering of ἔζησαν while keeping its contextually eventive sense as ‘came to life.’ It also changes the worship clause to a relative construction and uses ‘ఆరాధన’ for the religious force of προσκυνέω. The unnamed subjects of sitting and receiving judgment remain unspecified; the syntactically difficult Greek sequence concerning the souls and those who refused the beast is not harmonized by identifying either group beyond the text. Both footnote anchors remain correctly placed and their stated alternatives are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:06:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the thrones, the unspecified plural subjects, the grant of judgment, beheading, the beast/image/mark imagery, and the thousand-year reign. However, “తిరిగి జీవించి” adds an explicit ‘again’ not stated by ἔζησαν. The Greek’s eventive force is better represented without that additional temporal implication. The wording for refusal of worship is also better made finite/relative rather than the instrumental-sounding “పూజ చేయకుండా.”
  naturalness: The register is generally clear modern standard Telugu. A small recasting produces a more natural parallel description of those who refused worship and did not receive the mark, while retaining the compact visionary style.
