id: REV.20.12
reference: Revelation 20:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: te
  text: చనిపోయినవారిని—గొప్పవారినీ అల్పులనూ—సింహాసనం ఎదుట నిలబడి ఉండగా నేను చూశాను. అప్పుడు గ్రంథాలు[a] తెరవబడ్డాయి. మరొక గ్రంథం కూడా తెరవబడింది; అది జీవగ్రంథం. ఆ గ్రంథాల్లో రాసి ఉన్న వాటి ఆధారంగా, చనిపోయినవారు వారు చేసిన క్రియల ప్రకారం తీర్పు పొందారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “గ్రంథాలు” అనే పదాన్ని, ప్రాచీన కాలపు వ్రాత మాధ్యమాన్ని ప్రతిబింబిస్తూ, “చుట్టలు” అని కూడా అనువదించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: చనిపోయినవారు
  rationale: మరణించిన వ్యక్తులను సమూహంగా సూచించే విశేషణ నామీకరణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: μεγάλους καὶ τοὺς μικρούς
  choice: గొప్పవారూ సామాన్యులూ
  rationale: సామాజిక స్థాయి లేదా ప్రాముఖ్యతలోని అన్ని వర్గాలను సూచించే సమగ్ర జంట. అక్షరార్థమైన ‘పెద్దవారూ చిన్నవారూ’ వయస్సును సూచిస్తున్నట్టు అపార్థం కలిగించవచ్చు.
- source_word: ἑστῶτας
  choice: నిలబడి ఉండడం
  rationale: పూర్తయిన చర్య వల్ల కొనసాగుతున్న స్థితిని సూచించే పరిపూర్ణ కృదంత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: సింహాసనం ముందు
  rationale: ‘తీర్పు పీఠం’ అనే వివరణను చేర్చకుండా మూలంలోని θρόνοςను నేరుగా నిలుపుతుంది.
- source_word: βιβλία
  choice: గ్రంథాలు
  rationale: ప్రాచీన కాలంలో ఇవి చుట్టలుగా ఉండవచ్చనే అవకాశాన్ని నిరాకరించకుండా, గంభీరమైన సందర్భానికి సరిపోయే విస్తృత పదం.
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: తెరవబడ్డాయి / తెరవబడింది
  rationale: ἀνοίγω యొక్క సాధారణ అర్థాన్ని నేరుగా అందిస్తుంది; ‘ముద్రలు విప్పబడ్డాయి’ అనే మూలంలో లేని ప్రత్యేకతను చేర్చదు.
- source_word: ἄλλο βιβλίον
  choice: మరొక గ్రంథం
  rationale: ముందు చెప్పిన గ్రంథాలకు అదనంగా, వాటికి భిన్నమైన ఒక గ్రంథాన్ని సహజంగా సూచిస్తుంది.
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: అది జీవగ్రంథం
  rationale: మూలంలో పునరుక్తంగా అర్థమయ్యే βιβλίονను తెలుగులో స్పష్టంగా వ్యక్తం చేసి, ‘జీవగ్రంథం’ అనే స్థిరమైన బైబిలు పదబంధాన్ని ఉపయోగిస్తుంది.
- source_word: ἐκρίθησαν
  choice: తీర్పు పొందారు
  rationale: న్యాయపరమైన తీర్పును సూచిస్తుంది; ఫలితం తప్పనిసరిగా దోషనిర్ణయమేనని ముందుగానే నిర్ణయించదు.
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: ఆ గ్రంథాల్లో రాసి ఉన్నదాని ఆధారంగా
  rationale: తీర్పుకు ఆధారంగా నమోదైన విషయాలను సూచించే ἐκ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; రాతగా నమోదై ఉన్న స్థితిని నిలుపుతుంది.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: తాము చేసిన క్రియల ప్రకారం
  rationale: ἔργα యొక్క కార్యాలు/చర్యలు అనే విస్తృత భావాన్ని నిలుపుతూ, తీర్పు వారి క్రియలకు అనుగుణంగా ఉంటుందని స్పష్టంగా చెబుతుంది.
theological_decisions:
- issue: క్రియల ప్రకారం తీర్పు
  choice: తాము చేసిన క్రియల ప్రకారం
  alternative: వారు చేసిన పనుల ప్రకారం / వారు చేసినదాని ప్రకారం
  rationale: వచనం తీర్పు క్రియల ప్రకారం జరుగుతుందని స్పష్టంగా చెబుతుంది. ఇతర సిద్ధాంతపరమైన వివరణతో దీనిని తగ్గించకుండా లేదా సమన్వయపరచకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: κρίνω యొక్క తీర్పు స్వభావం
  choice: తీర్పు పొందారు
  alternative: దోషులుగా తీర్చబడ్డారు
  rationale: మూల క్రియ న్యాయతీర్పును సూచిస్తుంది గాని ఈ పదం స్వయంగా ప్రతి ఒక్కరికీ దోషనిర్ణయాన్ని నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దర్శనాత్మక-న్యాయపరమైన శైలి. ‘గొప్పవారూ సామాన్యులూ’ అనే రూపం అన్ని సామాజిక స్థాయులను సూచిస్తూ వయస్సుకు సంబంధించిన అపార్థాన్ని నివారిస్తుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
