revisions:
- from: చనిపోయినవారు—గొప్పవారూ సామాన్యులూ—సింహాసనం ముందు నిలబడి ఉండడం నేను చూశాను. అప్పుడు గ్రంథాలు[a] తెరవబడ్డాయి. మరొక గ్రంథం కూడా తెరవబడింది; అది జీవగ్రంథం. ఆ గ్రంథాల్లో రాసి ఉన్నదాని ఆధారంగా, చనిపోయినవారు తాము చేసిన క్రియల ప్రకారం తీర్పు పొందారు.
