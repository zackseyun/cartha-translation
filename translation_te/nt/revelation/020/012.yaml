review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence of the vision, the throne, the opening of multiple books and an additional book of life, and judgment according to deeds. However, “సామాన్యులూ” means ordinary/common people and does not adequately represent μικρούς (“small/lowly”), which forms a great-and-small merism. “రాసి ఉన్నదాని” is also singular where the Greek refers to the things written.
  naturalness: The Telugu is generally clear and suitably solemn. “సింహాసనం ఎదుట” and “నిలబడి ఉండగా చూశాను” are smooth modern-standard Telugu and more closely reproduce the participial construction.
  terminology: “గ్రంథాలు,” “జీవగ్రంథం,” and “తీర్పు పొందారు” are appropriate. “వారు చేసిన క్రియల ప్రకారం” retains the judicial and theological wording without specifying a verdict beyond the source.
  issues:
  - severity: medium
    issue: “గొప్పవారూ సామాన్యులూ” for μεγάλους καὶ τοὺς μικρούς
    rationale: “సామాన్యులు” denotes ordinary people, whereas μικροί denotes the small/lowly in contrast with the great. “గొప్పవారినీ అల్పులనూ” better preserves the source contrast and its all-status merism.
  - severity: low
    issue: Singular “రాసి ఉన్నదాని” for τῶν γεγραμμένων
    rationale: The Greek substantivized plural refers to the things recorded in the books. Telugu plural wording avoids reducing this to one undifferentiated item.
