  edition: SBLGNT
  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: te
  text: ఎవరైనా జీవగ్రంథంలో[a] నమోదు చేయబడి ఉన్నట్లు కనబడకపోతే, ఆ వ్యక్తి అగ్ని సరస్సులో పడవేయబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జీవపు చుట్టలో.’ గ్రీకు పదం పుస్తకాన్ని లేదా చుట్టను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: ఎవరి పేరైనా
  rationale: గ్రీకు పదబంధం ఏ వ్యక్తినైనా సూచించే అనిర్దిష్ట షరతును వ్యక్తం చేస్తుంది. తెలుగులో ‘ఎవరి పేరైనా ... రాసి ఉన్నట్లు’ అనడం జీవగ్రంథంలోని నమోదును సహజంగా తెలియజేస్తుంది; ‘పేరు’ మూలంలో ప్రత్యక్షంగా లేకపోయినా తెలుగు వాక్యనిర్మాణానికి అవసరమైన స్వల్ప స్పష్టీకరణ.
- source_word: οὐχ εὑρέθη
  choice: కనబడకపోతే
  rationale: న్యాయతీర్పు సందర్భంలోని పరిశీలన/నిర్ధారణ భావాన్ని నిలుపుతూ, aorist passive రూపాన్ని సహజమైన తెలుగు షరతు వాక్యంగా అందిస్తుంది.
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: జీవగ్రంథంలో
  rationale: βίβλος పుస్తకం లేదా గ్రంథపు చుట్టను సూచించగలదు. ‘జీవగ్రంథం’ తెలుగులో స్పష్టమైన, స్థిరమైన బైబిలు పదప్రయోగం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: γεγραμμένος
  choice: రాసి ఉన్నట్లు
  rationale: Perfect passive participle‌లోని పూర్తయి కొనసాగుతున్న స్థితిని ‘రాసి ఉన్నట్లు’ సహజంగా నిలుపుతుంది.
- source_word: ἐβλήθη
  choice: పడవేయబడ్డాడు
  rationale: Aorist passive యొక్క బలవంతంగా లోనికి వేయబడిన భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: అగ్ని సరస్సులో
  rationale: మూలంలోని అపోకలిప్టిక్ ప్రతిమను వ్యాఖ్యానించకుండా నేరుగా నిలుపుతుంది.
- source_word: τις ... γεγραμμένος / ἐβλήθη
  choice: ఆ వ్యక్తి ... పడవేయబడ్డాడు
  rationale: గ్రీకులో అనిర్దిష్ట వ్యక్తి వ్యాకరణపరంగా పుంలింగ ఏకవచన రూపాలతో కొనసాగుతాడు. తెలుగులో ‘ఆ వ్యక్తి’ సహజంగా వ్యక్తిగత ఏకవచన సూచనను నిలుపుతూ, అనవసరంగా పురుషునికే పరిమితం చేయదు.
theological_decisions:
- issue: లింగ సూచనగల ప్రతినిధి ఏకవచనం
  choice: ఆ వ్యక్తి ... పడవేయబడ్డాడు
  alternative: అతడు ... పడవేయబడ్డాడు
  rationale: గ్రీకు పుంలింగ ఏకవచన రూపం ఇక్కడ అనిర్దిష్ట వ్యక్తిని ప్రతినిధిగా సూచిస్తుంది. తెలుగులో క్రియారూపం వ్యాకరణ ఏకవచనాన్ని నిలుపుతుంది; ‘ఆ వ్యక్తి’ అనడం మూలంలోని ఎవరైనా అనే విస్తృత భావాన్ని పురుషులకు మాత్రమే పరిమితం చేయదు.
- issue: అంతిమ తీర్పు ప్రతిమ
  choice: అగ్ని సరస్సు
  alternative: మండే అగ్ని సరస్సు
  rationale: మూలం ఇచ్చిన ప్రతిమను అదనపు సిద్ధాంత వివరణ లేదా తీవ్రతను చేర్చకుండా యథాతథంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రకటన గ్రంథంలోని తీర్పు సందర్భానికి తగిన గంభీరతతో. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదం వెంట ఉంచబడింది.
