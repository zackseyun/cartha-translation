id: REV.20.2
reference: Revelation 20:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: te
  text: అతడు ఆ మహాసర్పాన్ని—అంటే అపవాది మరియు సాతాను అయిన ఆ ప్రాచీన సర్పాన్ని—పట్టుకొని వెయ్యి సంవత్సరాలపాటు బంధించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκράτησεν
  choice: పట్టుకొని
  rationale: ఇక్కడ κρατέω బలంగా పట్టుకోవడం లేదా అదుపులోకి తీసుకోవడం అనే నిర్ణయాత్మక చర్యను సూచిస్తుంది. ‘పట్టుకొని’ సహజమైన ఆధునిక తెలుగు పదప్రయోగం; చర్యలోని బలాన్ని సందర్భం స్పష్టం చేస్తుంది.
- source_word: δράκοντα
  choice: మహాసర్పాన్ని
  rationale: ప్రకటన గ్రంథపు అపోకలిప్టిక్ సందర్భంలో δράκωνకు తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘మహాసర్పం’ రూపాన్ని ఎంచుకున్నాం; ఇది సాధారణ ‘సర్పం’తో ఉన్న భేదాన్ని, గ్రంథాంతర్గత ప్రతీకాత్మక అనుసంధానాన్ని నిలుపుతుంది.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: ఆ ప్రాచీన సర్పాన్ని
  rationale: ఇది మహాసర్పాన్ని మరింత స్పష్టంగా గుర్తించే సమానాధికార పదబంధం. పునరుక్త definite articleలను తెలుగులో సహజంగా ‘ఆ’తో సూచించాం; ἀρχαῖοςను వ్యాఖ్యానించకుండా ‘ప్రాచీన’గా ఉంచాం.
- source_word: Διάβολος
  choice: అపవాది
  rationale: Διάβολοςకు తెలుగు బైబిలు సంప్రదాయంలో స్థిరమైన, అర్థవంతమైన బిరుదు ‘అపవాది’; దీన్ని వ్యక్తిని సూచించే బిరుదుగానే నిలిపాం.
- source_word: Σατανᾶς
  choice: సాతాను
  rationale: వ్యక్తినామం/బిరుదుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: ἔδησεν
  choice: బంధించాడు
  rationale: δέωలోని కట్టివేయడం అనే స్పష్టమైన దృశ్యాన్ని నిలుపుతూ, నిరోధ స్వభావాన్ని అతిగా వ్యాఖ్యానించకుండా ‘బంధించాడు’ అని అనువదించాం.
- source_word: χίλια ἔτη
  choice: వెయ్యి సంవత్సరాలపాటు
  rationale: కాలవ్యాప్తిని సూచించే accusativeను తెలుగులో సహజంగా ‘-పాటు’తో వ్యక్తపరిచాం; సంఖ్యను యథాతథంగా ఉంచాం.
theological_decisions:
- issue: వెయ్యి సంవత్సరాల స్వభావం
  choice: ‘వెయ్యి సంవత్సరాలపాటు’ అని నేరుగా అనువదించడం
  alternative: అక్షరార్థమైన వెయ్యేళ్ల కాలం లేదా ప్రతీకాత్మక సహస్రాబ్దం అని వ్యాఖ్యానించడం
  rationale: మూలపాఠం కాలాన్ని ఎలా అర్థం చేసుకోవాలో ఇక్కడ నిర్ణయించదు. అందువల్ల అక్షరార్థ/ప్రతీకార్థ వివాదాన్ని అనువాదంలో పరిష్కరించకుండా పాఠ్యంలోని ఉద్వేగాన్ని నిలిపాం.
- issue: మహాసర్పం యొక్క గుర్తింపు
  choice: మహాసర్పం, ప్రాచీన సర్పం, అపవాది, సాతాను అనే పూర్తి గుర్తింపు శ్రేణిని నిలుపడం
  alternative: అన్ని బిరుదులను ఒకే సరళమైన పేరుగా కుదించడం
  rationale: వచనం స్వయంగా ఈ గుర్తింపులన్నిటినీ ఇస్తుంది; వాటిలో ఏదీ తొలగించకుండా ఉంచడం మూలానికి విశ్వసనీయమైనది.
- issue: ὅς ἐστιν యొక్క తెలుగు వ్యక్తీకరణ
  choice: ‘అని పిలువబడే’
  alternative: ‘అయిన’ లేదా ‘అతడే’
  rationale: ὅς ἐστινను తెలుగు ప్రవాహంలో సహజంగా వ్యక్తపరచడానికి ఈ రూపాన్ని ఎంచుకున్నాం; ఇది అపవాది, సాతాను అనే రెండు గుర్తింపులనూ అదే వ్యక్తికి అన్వయిస్తుంది, అదనపు సిద్ధాంతార్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. వాక్యంలోని సమానాధికార గుర్తింపులను దీర్ఘవిరామాలతో స్పష్టంచేశాం. ‘మహాసర్పం’ ప్రకటన గ్రంథపు స్థిర దృశ్యభాషను కాపాడుతుంది; ‘ప్రాచీన సర్పం’ మూలంలోని ἀρχαῖοςను సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
