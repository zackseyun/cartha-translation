id: REV.20.13
reference: Revelation 20:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: te
  text: సముద్రం తనలో ఉన్న మృతులను అప్పగించింది. అలాగే మరణం, పాతాళం[a] తమలో ఉన్న మృతులను అప్పగించాయి. వారిలో ప్రతి ఒక్కరూ తమ తమ క్రియల ప్రకారం తీర్పు పొందారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మృతుల లోకం.’ ఇక్కడి గ్రీకు పదం ᾅδης (హాదేస్); ఇది సాధారణంగా ‘నరకం’ అని అనువదించే ఇతర గ్రీకు పదాలకు భిన్నమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: అప్పగించింది / అప్పగించాయి
  rationale: δίδωμι యొక్క ప్రాథమిక భావం ‘ఇవ్వడం’; ఇక్కడ సముద్రం, మరణం, పాతాళం మృతులను తీర్పు కోసం వెలుపలికి ఇచ్చే సందర్భంలో ‘అప్పగించు’ సహజంగా, సందర్భోచితంగా ఉంటుంది.
- source_word: θάλασσα
  choice: సముద్రం
  rationale: నిర్దిష్ట సముద్రాన్ని సూచించే గ్రీకు పదానికి సాధారణమైన, స్పష్టమైన తెలుగు సమానం.
- source_word: νεκρούς
  choice: మృతులను
  rationale: నామవాచకంగా వాడిన గ్రీకు విశేషణాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν αὐτῇ / ἐν αὐτοῖς
  choice: తనలో ఉన్న / తమలో ఉన్న
  rationale: సముద్రానికి ఏకవచన సంబంధాన్ని, మరణం మరియు పాతాళానికి బహువచన సంబంధాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: θάνατος
  choice: మరణం
  rationale: వాక్యంలో వ్యక్తీకరించబడిన శక్తిగా పనిచేసినా, తెలుగు లిపిలో పెద్ద అక్షరాల భేదం లేకపోవడం వల్ల సాధారణ రూపమే సరైనది; క్రియ దాని వ్యక్తీకరణను తెలియజేస్తుంది.
- source_word: ᾅδης
  choice: పాతాళం
  rationale: మృతుల లోకాన్ని సూచించే ᾅδης‌కు తెలుగు బైబిలు భాషలో పరిచితమైన పదం; ‘నరకం’ అని అనువదించి అంతిమ శిక్ష భావాన్ని ముందుగానే చేర్చకుండా ఉంటుంది.
- source_word: ἐκρίθησαν ἕκαστος
  choice: వారిలో ప్రతి ఒక్కరూ ... తీర్పు పొందారు
  rationale: బహువచన క్రియతో కూడిన పంపిణీ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, ప్రతి వ్యక్తి విడివిడిగా తీర్పు పొందినట్లు స్పష్టం చేస్తుంది.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: తమ తమ క్రియల ప్రకారం
  rationale: ἔργα యొక్క ‘చేసిన పనులు/క్రియలు’ భావాన్ని నిలుపుతూ, ἕκαστος యొక్క వ్యక్తిగత పంపిణీ భావాన్ని ‘తమ తమ’ ద్వారా సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అంత్యకాల తీర్పు సందర్భంలో ᾅδης అనువాదం
  choice: పాతాళం
  alternative: మృతుల లోకం; నరకం
  rationale: ‘పాతాళం’ మృతుల నివాసస్థల భావాన్ని కాపాడి, సమీప సందర్భంలోని ‘అగ్ని సరస్సు’తో దీనిని కలపదు. ‘నరకం’ అనడం గ్రీకు పదం తప్పనిసరిగా సూచించని అంతిమ శిక్ష భావాన్ని దిగుమతి చేయవచ్చు.
- issue: θάνατος యొక్క వ్యక్తీకరణ
  choice: మరణం
  alternative: మృత్యువు
  rationale: మరణం మృతులను అప్పగించే కర్తగా చూపబడటమే వ్యక్తీకరణను తెలియజేస్తుంది. ‘మరణం’ ఆధునిక ప్రామాణిక తెలుగులో సులభంగా అర్థమయ్యే, గంభీరమైన రూపం.
- issue: క్రియల ప్రకారం తీర్పు
  choice: తమ తమ క్రియల ప్రకారం
  alternative: వారు చేసినవాటి ఆధారంగా
  rationale: గ్రీకు వాక్యంలోని ప్రమాణ సంబంధాన్ని నేరుగా కాపాడుతుంది; రక్షణ సిద్ధాంతంపై అదనపు వివరణను చేర్చకుండా వాక్యంలో ఉన్న ధార్మిక ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రకటన గ్రంథపు గంభీరమైన న్యాయతీర్పు శైలిని నిలుపుతూ రూపొందించబడింది. ‘అప్పగించింది,’ ‘తీర్పు పొందారు’ వంటి రూపాలు సహజత్వం మరియు మూలపాఠానికి సమీపత మధ్య సమతుల్యతను ఇస్తాయి.
