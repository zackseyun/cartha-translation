id: REV.20.11
reference: Revelation 20:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: te
  text: నేను ఒక గొప్ప తెల్లని సింహాసనాన్నీ, దానిపై కూర్చున్నవానినీ చూశాను. ఆయన సన్నిధి నుండి[a] భూమీ ఆకాశమూ పారిపోయాయి; వాటికి స్థలం దొరకలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఆయన ముఖం ఎదుటనుండి భూమీ ఆకాశమూ పారిపోయాయి.”'
    reason: πρόσωπον అనే పదానికి అక్షరార్థం ‘ముఖం’; ప్రధాన పాఠంలోని ‘సన్నిధి’ సందర్భానుసారమైన సహజ అనువాదం.
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: ఒక గొప్ప తెల్లని సింహాసనం
  rationale: μέγαν లోని పరిమాణం, మహత్తు రెండింటినీ సూచించగల భావాన్ని ‘గొప్ప’ నిలుపుతుంది; విశేషణ క్రమం తెలుగులో సహజంగా ఉంది.
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: దానిపై కూర్చున్నవాడు
  rationale: మూలంలోని వర్ణనాత్మక రూపాన్ని నిలుపుతూ, సింహాసనంపై ఉన్న వ్యక్తి ఎవరో వచనం చెప్పనందున పేరును లేదా ప్రత్యేక గుర్తింపును చేర్చదు.
- source_word: ἀπὸ τοῦ προσώπου
  choice: ఆయన సన్నిధి నుండి
  rationale: πρόσωπον అక్షరార్థంగా ‘ముఖం’; ఈ సందర్భంలో ఎవరి ఎదుటనుండి పారిపోవడం అనే భావాన్ని సహజ తెలుగులో ‘సన్నిధి నుండి’ తెలియజేస్తుంది.
- source_word: ἔφυγεν
  choice: పారిపోయాయి
  rationale: φεύγω యొక్క సజీవమైన పారిపోవు చిత్రణను నిలుపుతుంది; ‘అదృశ్యమయ్యాయి’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: భూమీ ఆకాశమూ
  rationale: రెండు ఏకవచన నామాలనూ సమానంగా కలిపి, అపోకలిప్టిక్ సందర్భంలో οὐρανός ను సహజమైన ‘ఆకాశం’గా అందిస్తుంది.
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: వాటికి స్థలం దొరకలేదు
  rationale: మూలంలోని నిషేధిత నిష్క్రియ భావాన్ని సహజ తెలుగులో నిలుపుతుంది; ‘వాటికి’ అనేది భూమి, ఆకాశం రెండింటినీ సూచిస్తుంది.
theological_decisions:
- issue: సింహాసనంపై కూర్చున్నవాని గుర్తింపు
  choice: ‘దానిపై కూర్చున్నవాడు’ అని మాత్రమే వర్ణించడం
  alternative: దేవుడు, తండ్రియైన దేవుడు, మెస్సీయ లేదా దైవిక న్యాయాధిపతి అని స్పష్టీకరించడం
  rationale: ఈ వచనం సింహాసనంపై కూర్చున్నవాని పేరు చెప్పదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను, దైవశాస్త్ర సంబంధమైన ఉద్విగ్నతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఆయన’ గౌరవార్థక సర్వనామంగా వాడబడింది, కానీ సింహాసనాసీనుని గుర్తింపును నిర్దేశించదు. కాలక్రమాన్ని సహజంగా కలపడానికి Καί ను ‘తర్వాత’గా ఇచ్చాం.
