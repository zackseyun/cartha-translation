  to: నేను ఒక గొప్ప తెల్లని సింహాసనాన్నీ, దానిపై కూర్చున్నవానినీ చూశాను. ఆయన సన్నిధి నుండి[a] భూమీ ఆకాశమూ పారిపోయాయి; వాటికి స్థలం దొరకలేదు.
