    text: లేదా, ‘అడుగులేని గొయ్యి.’ గ్రీకులో ‘అగాధం’ అని ఉంది.
    reason: lexical_alternative
  revision_rationale: The revision retains the Greek imagery and syntax while avoiding a stronger temporal inference at the opening. It also corrects the footnote so that it gives a legitimate traditional alternative without adding ‘endless’ as part of the Greek word’s stated meaning, and places the anchor on the annotated term.
