id: REV.20.1
reference: Revelation 20:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: te
  text: మరియు పరలోకం నుండి దిగివస్తున్న ఒక దేవదూతను నేను చూశాను. అతని చేతిలో అగాధపు[a] తాళంచెవి, ఒక పెద్ద గొలుసు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అడుగులేని గొయ్యి.’ గ్రీకులో ‘అగాధం’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: అప్పుడు
  rationale: దర్శన వర్ణనలో తదుపరి దృశ్యాన్ని సహజమైన తెలుగులో అనుసంధానిస్తుంది; గ్రీకు సంధాయకం సూచించే క్రమాన్ని అతిగా వ్యాఖ్యానించదు.
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: దర్శన కథనంలోని ప్రత్యక్షమైన ప్రథమపురుష వర్ణనను నిలుపుతుంది.
- source_word: ἄγγελον
  choice: ఒక దేవదూతను
  rationale: ప్రకటన గ్రంథ సందర్భంలో ఇది పరలోక సంబంధమైన దూతను సూచిస్తుంది; సాధారణ ‘దూత’ కంటే ‘దేవదూత’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి దిగివస్తున్న
  rationale: వర్తమాన కృదంతం తెలిపే కొనసాగుతున్న చలనాన్ని, దాని పరలోక మూలాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔχοντα
  choice: అతని చేతిలో ... ఉన్నాయి
  rationale: తాళంచెవి, గొలుసు అతని వద్ద ఉన్న దృశ్యాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: అగాధపు తాళంచెవి
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని సంక్షిప్తంగా నిలుపుతూ, ἄβυσσος‌ను అదనపు చిత్రార్థం చేర్చకుండా ‘అగాధం’గా అనువదిస్తుంది.
- source_word: ἅλυσιν μεγάλην
  choice: ఒక పెద్ద గొలుసు
  rationale: వస్తువు పరిమాణాన్ని సూచించే μεγάλην భావాన్ని ఆధునిక తెలుగులో సూటిగా తెలియజేస్తుంది.
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: అతని చేతిలో
  rationale: అక్షరార్థంగా ‘చేతిమీద’ అనగలిగినా, ఈ సందర్భంలో వస్తువులను పట్టుకొని లేదా మోసుకొని ఉండటాన్ని సహజ తెలుగులో ‘చేతిలో’ అంటారు.
theological_decisions:
- issue: అపోకలిప్టిక్ సందర్భంలో ἄβυσσος అనువాదం
  choice: అగాధం
  alternative: అంతులేని అగాధం; పాతాళపు గొయ్యి
  rationale: ‘అగాధం’ మూలపద భావాన్ని నేరుగా నిలుపుతుంది. ‘అంతులేని’ లేదా ‘పాతాళపు’ వంటి వివరణలను వాక్యంలో చేర్చడం గ్రీకు పదం కంటే చిత్రాన్ని అధికంగా నిర్దిష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ ప్రకటన గ్రంథ దర్శన వర్ణనకు తగిన గంభీరతను కాపాడింది. ప్రధాన వాక్యంలో ఉన్న [a] గుర్తు సంబంధిత పదబంధం తరువాత ఉంచబడింది.
