id: REV.20.10
reference: Revelation 20:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: te
  text: వారిని మోసగిస్తూ ఉన్న అపవాది అగ్నితో, గంధకంతో కూడిన సరస్సులో పడవేయబడ్డాడు. అక్కడ మృగం, అబద్ధ ప్రవక్త కూడా ఉన్నారు. వారు పగలూ రాత్రీ యుగయుగాలపాటు యాతన అనుభవిస్తారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάβολος
  choice: అపవాది
  rationale: ప్రకటన గ్రంథంలో ఇది సాతానును సూచించే స్థిరమైన వ్యక్తిగత బిరుదు. ‘అపవాది’ మూలపదంలోని నిందారోపణ భావాన్ని నిలుపుతూ తెలుగులో స్థిరపడిన, గౌరవప్రదమైన పదం.
- source_word: ὁ πλανῶν αὐτοὺς
  choice: వారిని మోసగిస్తూ ఉన్న
  rationale: వర్తమాన కృదంతం అపవాది కొనసాగిస్తూ వచ్చిన కార్యాన్ని గుర్తింపుగా చూపుతుంది; ఈ రూపం ఆ నిరంతర కార్యభావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐβλήθη
  choice: పడవేయబడ్డాడు
  rationale: న్యాయతీర్పులో బలవంతంగా విసిరివేయబడటం లేదా అప్పగించబడటం అనే కర్మణి భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: అగ్ని, గంధకాల సరస్సు
  rationale: రెండు గ్రీకు నామవాచకాలనూ నేరుగా ప్రతిబింబిస్తూ, ఆధునిక పాఠకులకు అర్థమయ్యే ‘గంధకం’ అనే పదాన్ని ఉపయోగిస్తుంది.
- source_word: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: అక్కడ మృగం, అబద్ధ ప్రవక్త కూడా ఉన్నారు
  rationale: గ్రీకులో క్రియాపదం లేనప్పటికీ, 19:20 నేపథ్యానికి అనుగుణంగా వారి కొనసాగుతున్న ఉనికిని తెలుగులో సహజంగా తెలియజేయడానికి ‘ఉన్నారు’ చేర్చబడింది.
- source_word: βασανισθήσονται
  choice: హింసించబడతారు
  rationale: తీవ్రమైన బాధకు గురిచేయబడటం అనే తీర్పు సందర్భంలోని భావాన్ని తెలియజేస్తుంది; బాధ విధానాన్ని అనవసరంగా మరింత నిర్దిష్టం చేయదు.
- source_word: ἡμέρας καὶ νυκτός
  choice: పగలూ రాత్రీ
  rationale: విరామం లేని కొనసాగింపును సూచించే మూలభాషా జంటను సహజమైన తెలుగు జంటగా అందిస్తుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాలపాటు
  rationale: అంతం లేని కాలవ్యాప్తిని బలంగా తెలిపే గ్రీకు నుడికారానికి సహజమైన, స్థిరపడిన తెలుగు సమానార్థకం.
theological_decisions:
- issue: εἰς τοὺς αἰῶνας τῶν αἰώνων తెలిపే తుది శిక్ష కాలవ్యాప్తి
  choice: యుగయుగాలపాటు
  alternative: యుగాల యుగాల వరకు
  rationale: మూలంలోని బలమైన, అంతం లేని కాలవ్యాప్తి భావాన్ని తగ్గించకుండా సహజమైన తెలుగులో అందిస్తుంది; ఈ వాక్యానికి మించిన సిద్ధాంతపరమైన వివాదాన్ని అనువాదం తేల్చదు.
- issue: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης లో వ్యక్తంగా లేని క్రియాపదం
  choice: ఉన్నారు
  alternative: ఉండేవారు
  rationale: గ్రీకులో క్రియాపదం అధ్యాహారంగా ఉంది. ముందటి సందర్భంలో వారు ఇప్పటికే ఆ సరస్సులో పడవేయబడినందున, కొనసాగుతున్న ఉనికిని సూచించే వర్తమాన రూపం సందర్భానికి సరిపోతుంది; ఇది అదనపు సిద్ధాంత వాదన కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘అపవాది,’ ‘మృగం,’ ‘అబద్ధ ప్రవక్త’ వంటి ప్రకటన గ్రంథానికి స్థిరమైన పదాలను నిలుపుతూ, పాతకాలపు క్రియారూపాలను నివారించాం.
