id: REV.20.14
reference: Revelation 20:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: te
  text: మరణమూ హేడీస్[a] అగ్ని సరస్సులో పడవేయబడ్డాయి. ఇదే రెండవ మరణం—అగ్ని సరస్సు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పాతాళం’ లేదా ‘మృతుల లోకం.’ గ్రీకు పదం ‘హేడీస్.’ ఇక్కడ అది ‘అగ్ని సరస్సు’కు భిన్నంగా ఉంది; అందువల్ల కొన్ని అనువాదాల్లో కనిపించే ‘నరకం’ అనే పదం ఈ సందర్భంలో తప్పుదారి పట్టించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: మరణం
  rationale: మొదటి వాక్యంలో హేడీస్‌తో కలిసి అగ్ని సరస్సులో పడవేయబడే శక్తిగా చిత్రించబడిన భావాన్ని నిలుపుతుంది. తెలుగు లిపిలో పెద్ద అక్షరాల భేదం లేనందున వ్యక్తీకరణను సందర్భమే తెలియజేస్తుంది; ‘రెండవ మరణం’లో ఇదే పదం సాధారణ నామవాచకంగా సహజంగా ఉంటుంది.
- source_word: ᾅδης
  choice: హేడీస్
  rationale: గ్రీకు పదాన్ని లిప్యంతరీకరించడం ద్వారా దానిని అంతిమ శిక్షకు సంబంధించిన ‘అగ్ని సరస్సు’తో కలిపివేయకుండా, మూలపాఠంలోని భేదాన్ని కాపాడుతుంది.
- source_word: ἐβλήθησαν
  choice: పడవేయబడ్డాయి
  rationale: బలవంతంగా ఒక చోటికి వేయబడటాన్ని తెలిపే గ్రీకు కర్మణి రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λίμνη τοῦ πυρός
  choice: అగ్ని సరస్సు
  rationale: మూలంలోని సంబంధార్థక నిర్మాణాన్నీ ప్రకటన గ్రంథపు దృశ్యరూపాన్నీ సంక్షిప్తంగా, పారదర్శకంగా నిలుపుతుంది.
- source_word: οὗτος
  choice: ఇదే
  rationale: సూచనార్థక పదాన్నీ గుర్తింపు వాక్యంలోని నొక్కిచెప్పే భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: θάνατος ὁ δεύτερος
  choice: రెండవ మరణం
  rationale: ప్రకటన గ్రంథంలో వాడే ప్రత్యేక పదబంధాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
theological_decisions:
- issue: అంత్యకాల తీర్పు సందర్భంలో ᾅδης అనువాదం
  choice: హేడీస్
  alternative: పాతాళం; మృతుల లోకం; నరకం
  rationale: ఈ వచనం హేడీస్‌ను అగ్ని సరస్సుకు భిన్నంగా చూపుతుంది. ‘నరకం’ అని అనువదించడం ఈ రెండు చిత్రాలను ఒకటిగా కలిపే ప్రమాదం కలిగిస్తుంది; లిప్యంతరీకరణ మూలంలోని భేదాన్నీ భావసంబంధమైన ఉద్రిక్తతనూ కాపాడుతుంది.
- issue: θάνατος యొక్క వ్యక్తీకరణ
  choice: మొదటి వాక్యంలో సందర్భం ద్వారా వ్యక్తీకరించబడిన ‘మరణం’; రెండవ వాక్యంలో ‘రెండవ మరణం’
  alternative: రెండు చోట్లా పూర్తిగా నిర్జీవ భావంగా అనువదించడం; రెండు చోట్లా వ్యక్తి పేరులా మార్చడం
  rationale: మొదటి వాక్యంలో మరణం హేడీస్‌తో పాటు చర్యకు లోనయ్యే శక్తిగా కనిపిస్తుంది; రెండవ వాక్యంలో అది తీర్పు స్థితికి పేరుగా వస్తుంది. తెలుగు లిపిలో capitalization లేకపోవడం వల్ల అదనపు వివరణను ప్రధాన పాఠంలో చేర్చకుండా సందర్భాన్నే పనిచేయనిచ్చాం.
- issue: రెండవ మరణం మరియు అగ్ని సరస్సు మధ్య సంబంధం
  choice: ‘ఇదే రెండవ మరణం—అగ్ని సరస్సు’ అనే సమానార్థక/వివరణాత్మక నిర్మాణం
  alternative: ‘అగ్ని సరస్సే రెండవ మరణం’; ‘ఇది రెండవ మరణాన్ని సూచిస్తుంది’
  rationale: గ్రీకు వాక్యంలోని గుర్తింపు మరియు చివరి apposition‌ను నిలుపుతూ, ‘సూచిస్తుంది’ వంటి అదనపు వ్యాఖ్యానాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘హేడీస్’ అనే లిప్యంతరీకరణకు వెంటనే పాదసూచిక ఇచ్చి అర్థవికల్పాలను వివరించాం. ఎమ్ డ్యాష్ గ్రీకు చివరి apposition‌ను వ్యాఖ్యానాత్మక పదాలు చేర్చకుండా చూపుతుంది.
