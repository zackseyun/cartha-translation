id: REV.20.6
reference: Revelation 20:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: te
  text: మొదటి పునరుత్థానంలో పాలుపొందినవారు ధన్యులు, పవిత్రులు. వీరిపై రెండవ మరణానికి అధికారం లేదు. వారు దేవునికీ మెస్సీయకూ యాజకులుగా ఉంటారు; ఆయనతో కలిసి వెయ్యి సంవత్సరాలు రాజ్యపాలన చేస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మెస్సీయ’కు బదులుగా ‘క్రీస్తు’ అని కూడా అనువదించవచ్చు. గ్రీకు Χριστός ఇక్కడ బిరుదుగా వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος καὶ ἅγιος
  choice: ధన్యులు, పవిత్రులు
  rationale: ప్రకటన వాక్యాల ఆశీర్వచన ధోరణిని ‘ధన్యులు’ నిలుపుతుంది; ἅγιος సూచించే దేవునికి ప్రత్యేకించబడిన స్థితిని ‘పవిత్రులు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ ἔχων μέρος
  choice: పాలుపొందినవారు
  rationale: గ్రీకు ఏకవచన ప్రతినిధి ప్రయోగాన్ని తెలుగులో సహజమైన సమూహవాచక బహువచనంగా అందించి, పునరుత్థానంలో భాగస్వామ్య భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: మొదటి పునరుత్థానంలో
  rationale: పదబంధాన్ని నేరుగా, స్థిరమైన బైబిలు పరిభాషతో అందిస్తుంది.
- source_word: ἐπὶ τούτων ... οὐκ ἔχει ἐξουσίαν
  choice: అలాంటివారిపై ... అధికారం లేదు
  rationale: ἐξουσίαలోని అధికార పరిధి లేదా ఆధిపత్య భావాన్ని ‘అధికారం’ స్పష్టంగా తెలియజేస్తుంది; τούτωνకు సహజమైన తెలుగు సూచన ‘అలాంటివారు’.
- source_word: ἱερεῖς
  choice: యాజకులు
  rationale: ఆరాధనా సేవకు సంబంధించిన నామవాచక భావాన్ని వ్యాఖ్యానంతో విస్తరించకుండా నిలుపుతుంది.
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: దేవునికీ మెస్సీయకూ
  rationale: సంబంధార్థక షష్ఠీ విభక్తిని తెలుగులో సహజమైన ‘కూ’ నిర్మాణంతో అందిస్తుంది; Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
- source_word: βασιλεύσουσιν μετ’ αὐτοῦ
  choice: ఆయనతో కలిసి ... రాజ్యపాలన చేస్తారు
  rationale: రాజులుగా పాలించే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలుపుతూ, మెస్సీయతో సహపాలనను నిలుపుతుంది.
- source_word: χίλια ἔτη
  choice: వెయ్యి సంవత్సరాలు
  rationale: పాఠంలోని నిర్దిష్ట కాలవ్యవధిని ఏ సహస్రాబ్ద సిద్ధాంతాన్నీ చొప్పించకుండా యథాతథంగా అందిస్తుంది.
theological_decisions:
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ పదం దేవునితో సమాంతరంగా సంబంధార్థక నిర్మాణంలో బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
- issue: వెయ్యి సంవత్సరాల స్వభావం
  choice: వెయ్యి సంవత్సరాలు
  alternative: సహస్రాబ్దం
  rationale: మూలపాఠం చెప్పే వ్యవధిని మాత్రమే తెలుపుతూ, అది అక్షరార్థమా ప్రతీకాత్మకమా అనే విస్తృత వ్యాఖ్యాన వివాదాన్ని పరిష్కరించదు.
- issue: ఏకవచన ప్రతినిధి ప్రయోగం
  choice: పాలుపొందినవారు ... వారు
  alternative: పాలుపొందిన వ్యక్తి ... అతడు/ఆ వ్యక్తి
  rationale: తెలుగులో లింగనిరపేక్షంగా, సహజంగా చదవడానికి బహువచనం వాడబడింది; ఇది గ్రీకులోని వర్గ-ప్రతినిధి భావాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ప్రకటన గ్రంథ శైలిని నిలిపింది. ‘పునరుత్థానం,’ ‘రెండవ మరణం,’ ‘యాజకులు,’ ‘రాజ్యపాలన’ వంటి కీలక అపోకలిప్టిక్, ఆరాధనా పదజాలాన్ని వ్యాఖ్యానాత్మకంగా కరిగించలేదు.
