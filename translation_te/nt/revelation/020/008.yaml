id: REV.20.8
reference: Revelation 20:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: te
  text: అతడు భూమి నాలుగు మూలల్లో ఉన్న జాతులను—గోగు, మాగోగు[b]—మోసగించడానికి[a], మరియు వారిని యుద్ధానికి[c] సమకూర్చడానికి బయలుదేరుతాడు. వారి సంఖ్య సముద్రపు ఇసుకలా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దారితప్పించడానికి.’
    reason: lexical_alternative
  - marker: b
    text: ‘గోగు, మాగోగు’ అనే పేర్లు యెహెజ్కేలు 38–39ను ప్రతిధ్వనిస్తాయి; చివరి తిరుగుబాటుకు సమకూడే జాతులకు ఇవి నమూనాత్మక గుర్తింపుగా ఉండవచ్చు.
    reason: cross_reference
  - marker: c
    text: లేదా ‘పోరాటానికి.’ గ్రీకు పదానికి ‘యుద్ధం’ లేదా ‘పోరాటం’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: బయలుదేరుతాడు
  rationale: భవిష్యత్ కాలంలోని కదలిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; మునుపటి వచనం ప్రకారం కర్త సాతాను.
- source_word: πλανῆσαι
  choice: మోసగించడానికి
  rationale: πλανάω లోని ‘మోసపుచ్చు/దారితప్పించు’ భావాల్లో సందర్భానికి సహజమైన ప్రధాన పదం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὰ ἔθνη
  choice: జనాలను
  rationale: ఇక్కడ ἔθνη అనేది యూదేతరులను మాత్రమే కాక, సమూహాలుగా ఉన్న లోక జనాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘జనాలు’ సహజంగా ఉంది.
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: భూమి నాలుగు మూలల్లో ఉన్న
  rationale: నివాస ప్రపంచపు సుదూర ప్రాంతాలన్నిటినీ సూచించే మూలభాషా రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: గోగు, మాగోగు
  rationale: పేర్లను లిప్యంతరీకరించి, వాటిని ముందున్న జనాలకు సమానాధికరణంగా డాష్‌ల మధ్య ఉంచాం; వాటి అపోకలిప్టిక్ గుర్తింపును మరింతగా నిర్ధారించలేదు.
- source_word: συναγαγεῖν
  choice: సమకూర్చడానికి
  rationale: యుద్ధం కోసం జనాలను ఒకచోట చేర్చే ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸν πόλεμον
  choice: యుద్ధానికి
  rationale: πόλεμος లోని విస్తృతమైన ‘యుద్ధం’ భావాన్ని నిలుపుతుంది; ‘పోరాటానికి’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: వారి సంఖ్య
  rationale: సమకూర్చబడే జనాలనే తిరిగి సూచించే గ్రీకు సంబంధవాచక నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: సముద్రపు ఇసుకలా ఉంటుంది
  rationale: లెక్కించలేనంత విస్తారమైన సంఖ్యను తెలిపే బైబిలు ఉపమానాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘బయలుదేరుతాడు’ అనే క్రియలో అంతర్లీనంగా ఉన్న కర్త
  choice: మునుపటి వచనం నుంచి కొనసాగుతున్న సాతానును ‘అతడు’గా వ్యక్తం చేయడం
  alternative: ఈ వచనంలో కర్తను స్పష్టంగా పేర్కొనకుండా ఉంచడం
  rationale: గ్రీకులో ఈ వచనంలో కర్త ప్రత్యక్షంగా లేకపోయినా, ప్రకటన 20:7లో సాతానే విడుదల చేయబడినవాడని స్పష్టంగా ఉండటం వల్ల ‘అతడు’ అనేది వ్యాకరణ సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- issue: ‘గోగు, మాగోగు’ పదాల పాత్ర
  choice: మోసగించబడే జనాలకు సమానాధికరణ గుర్తింపుగా ఉంచడం
  alternative: వాటిని ఇద్దరు వ్యక్తులుగానో, ఖచ్చితమైన భౌగోళిక జాతులుగానో నిర్ధారించడం
  rationale: ఈ రూపం యెహెజ్కేలు 38–39 ప్రతిధ్వనిని కాపాడుతూ, పేర్లు ప్రతీకలా, నమూనాత్మక గుర్తింపులా, లేక భౌగోళిక సూచనలా అన్న వివాదాన్ని అనువాదంలో పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘భూమి నాలుగు మూలలు’ మరియు ‘సముద్రపు ఇసుక’ అనే అపోకలిప్టిక్/బైబిలు చిత్రాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకునికి స్పష్టంగా తీర్చిదిద్దాం.
