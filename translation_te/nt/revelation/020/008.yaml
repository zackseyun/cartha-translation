revisions:
- from: అతడు భూమి నాలుగు మూలల్లో ఉన్న జనాలను—గోగు, మాగోగు[b]—మోసగించడానికి[a], యుద్ధానికి[c] వారిని సమకూర్చడానికి బయలుదేరుతాడు. వారి సంఖ్య సముద్రపు ఇసుకలా ఉంటుంది.
  to: అతడు భూమి నాలుగు మూలల్లో ఉన్న జాతులను—గోగు, మాగోగు[b]—మోసగించడానికి[a], మరియు వారిని యుద్ధానికి[c] సమకూర్చడానికి బయలుదేరుతాడు. వారి సంఖ్య సముద్రపు ఇసుకలా ఉంటుంది.
