id: REV.20.5
reference: Revelation 20:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: te
  text: మృతులలో మిగిలినవారు ఆ వెయ్యి సంవత్సరాలు ముగిసేవరకు జీవంలోకి రాలేదు.[a] ఇదే మొదటి పునరుత్థానం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ వెయ్యి సంవత్సరాలు ముగిసేవరకు జీవించలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: చనిపోయినవారిలో మిగిలినవారు
  rationale: ఇంతకుముందు చెప్పబడిన వర్గానికి భిన్నంగా ఇంకా మిగిలి ఉన్న మృతులను సూచించే సమూహార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὐκ ἔζησαν
  choice: తిరిగి జీవించలేదు
  rationale: పునరుత్థాన సందర్భంలో ζάω క్రియ యొక్క జీవంలోకి రావడం అనే భావాన్ని తెలియజేస్తుంది; కేవలం జీవించలేదు అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: ఆ వెయ్యి సంవత్సరాలు ముగిసేవరకు
  rationale: ἄχρι సూచించే కాలపరిమితిని, τελεσθῇలోని పూర్తికావడం అనే భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది; ఆ అనే సూచన ముందే ప్రస్తావించిన నిర్దిష్ట కాలాన్ని గుర్తుచేస్తుంది.
- source_word: αὕτη ἡ ἀνάστασις ἡ πρώτη
  choice: ఇదే మొదటి పునరుత్థానం
  rationale: ప్రదర్శక సర్వనామపు విస్తృత సూచనను అలాగే ఉంచి, ἀνάστασιςకు ప్రామాణిక తెలుగు పదమైన పునరుత్థానం వాడుతుంది.
theological_decisions:
- issue: “ఇదే మొదటి పునరుత్థానం” అనే మాటలో “ఇది” దేనిని సూచిస్తుంది?
  choice: సందర్భంలో ఇప్పుడే వర్ణించిన పునరుత్థాన వాస్తవాన్ని విస్తృతంగా సూచించేలా అనువదించబడింది.
  alternative: ఇది 4వ వచనంలోని హతసాక్షులను మాత్రమే సూచిస్తుంది; లేదా నీతిమంతులందరినీ సూచిస్తుంది; లేదా ఆత్మసంబంధమైన జీవాన్ని సూచిస్తుంది.
  rationale: గ్రీకు వాక్యం ఏ ప్రత్యేక సహస్రాబ్ద సిద్ధాంతాన్నీ స్పష్టంగా నిర్దేశించదు. కాబట్టి అనువాదం ఆ అంత్యకాల వివరణలలో ఏదో ఒకదాన్ని చేర్చకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: ἔζησαν యొక్క సందర్భార్థం
  choice: పునరుత్థాన సందర్భానికి అనుగుణంగా “తిరిగి జీవించలేదు” అని ఇచ్చాం.
  alternative: “జీవించలేదు” లేదా “ఆత్మసంబంధంగా జీవంలోకి రాలేదు.”
  rationale: సమీప సందర్భం మరణం తరువాత జీవించడం, పునరుత్థానం గురించి మాట్లాడుతుంది. అయినా గ్రీకు క్రియకు ఉన్న సాధారణ “జీవించారు” అనే రూపాన్ని పాదసూచికలో చూపించి, అవసరానికి మించిన సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. “చనిపోయినవారు” సహజమైన సామాన్య ప్రయోగం; “పునరుత్థానం” స్థిరపడిన బైబిలు-మతపర పదం. పాదసూచిక గుర్తు [a] సంబంధిత వాక్యానంతరం ఉంచబడింది.
