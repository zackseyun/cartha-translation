revisions:
- from: చనిపోయినవారిలో మిగిలినవారు ఆ వెయ్యి సంవత్సరాలు ముగిసేవరకు తిరిగి జీవించలేదు.[a] ఇదే మొదటి పునరుత్థానం.
  to: మృతులలో మిగిలినవారు ఆ వెయ్యి సంవత్సరాలు ముగిసేవరకు జీవంలోకి రాలేదు.[a] ఇదే మొదటి పునరుత్థానం.
  rationale: The revision removes the unexpressed ‘again’ element while retaining the contextual sense of coming to life. It also uses the concise, standard biblical-register expression “మృతులలో మిగిలినవారు.” The temporal wording, the deliberate ambiguity of the demonstrative, and the theological term “పునరుత్థానం” are preserved.
  reviewer_model: gpt-5.6-terra
