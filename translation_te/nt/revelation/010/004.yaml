id: REV.10.4
reference: Revelation 10:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: te
  text: 'ఆ ఏడు ఉరుములు పలికినప్పుడు, నేను రాయబోతుండగా, పరలోకం నుండి ఒక స్వరం ఇలా చెప్పడం విన్నాను: “ఆ ఏడు ఉరుములు పలికిన మాటలను ముద్రవేసి ఉంచు; వాటిని రాయకు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησαν
  choice: పలికినప్పుడు / పలికినవాటికి
  rationale: λαλέω యొక్క ‘మాట్లాడు, పలుకు’ అనే భావాన్ని సహజంగా తెలియజేస్తుంది; ఉరుములు మాట్లాడే ప్రకటనాత్మక రూపకాన్ని నిలుపుతుంది.
- source_word: αἱ ἑπτὰ βρονταί
  choice: ఆ ఏడు ఉరుములు
  rationale: βροντή యొక్క ప్రాథమిక అర్థమైన ‘ఉరుము’ను నిలుపుతూ, గ్రీకులో మాట్లాడే కర్తలుగా చిత్రించిన వ్యక్తీకరణను కాపాడుతుంది.
- source_word: ἤμελλον γράφειν
  choice: నేను రాయబోతున్నాను
  rationale: μέλλω + ధాతురూపం సూచించే సమీప చర్యను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి ఒక స్వరం
  rationale: స్వరం వచ్చిన మూలాన్ని మాత్రమే తెలుపుతుంది; మాట్లాడిన వ్యక్తి ఎవరనే విషయాన్ని అదనంగా నిర్ధారించదు.
- source_word: Σφράγισον
  choice: ముద్రవేయి
  rationale: ఆజ్ఞ యొక్క నిర్ణయాత్మక స్వరాన్ని, పలికిన విషయాలను వెల్లడించకుండా భద్రపరచాలనే ప్రకటన సందర్భాన్ని నిలుపుతుంది.
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: ఆ ఏడు ఉరుములు పలికినవాటికి
  rationale: నపుంసక బహువచన సంబంధసర్వనామం ἃను ‘పలికిన విషయాలు’ అనే బహువచన భావంతో తెలుగులో సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: μὴ αὐτὰ γράψῃς
  choice: వాటిని రాయకు
  rationale: αὐτά బహువచనాన్ని నేరుగా నిలుపుతూ, ఏడు ఉరుములు పలికిన విషయాలను సూచిస్తుంది.
theological_decisions:
- issue: పరలోకం నుండి వినిపించిన స్వరం ఎవరిదో స్పష్టీకరించాలా
  choice: పరలోకం నుండి ఒక స్వరం
  alternative: పరలోకం నుండి దేవుని స్వరం
  rationale: మూలపాఠం స్వరం పరలోకం నుండి వచ్చిందని మాత్రమే చెబుతుంది; మాట్లాడిన వ్యక్తిని దేవుడని స్పష్టంగా గుర్తించదు. అందువల్ల ఆ అనిశ్చితిని అలాగే ఉంచాం.
- issue: ముద్రవేయడం అనే ఆజ్ఞను కేవలం ‘రహస్యంగా ఉంచు’ అని వివరణాత్మకంగా మార్చాలా
  choice: ముద్రవేయి
  alternative: రహస్యంగా ఉంచు
  rationale: అపోకలిప్టిక్ ముద్ర రూపకాన్ని యథాతథంగా నిలుపుతూ, దాని భావాన్ని ఒక్క వ్యాఖ్యానానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘ఉరుములు పలికాయి’ అనే అసాధారణ వ్యక్తీకరణ మూలంలోని వ్యక్తీకృత అపోకలిప్టిక్ చిత్రాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది. గ్రీకు బహువచనాలైన ἃ మరియు αὐτάకు అనుగుణంగా ‘పలికినవాటికి’, ‘వాటిని’ వాడబడ్డాయి; అందువల్ల పాదటిప్పణి అవసరం లేదు.
