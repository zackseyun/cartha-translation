id: REV.10.8
reference: Revelation 10:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: te
  text: 'మరియు నేను పరలోకం నుండి విన్న స్వరం మళ్లీ నాతో మాట్లాడుతూ ఇలా చెప్పింది: “వెళ్లి, సముద్రం మీదా నేల మీదా నిలబడి ఉన్న దేవదూత చేతిలో తెరిచి ఉన్న గ్రంథపు చుట్టను[a] తీసుకో.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చిన్న గ్రంథపు చుట్టను.” సమీప వచనాల్లో చిన్నరూపమైన βιβλαρίδιον (“చిన్న గ్రంథపు చుట్ట”) ఉంది; అయితే ఈ వచనంలో βιβλίον (“గ్రంథపు చుట్ట”) ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ
  choice: స్వరం
  rationale: ఇక్కడ ఇది కేవలం శబ్దం కాదు; పరలోకం నుండి స్పష్టంగా మాట్లాడుతున్న స్వరం.
- source_word: πάλιν λαλοῦσαν μετ’ ἐμοῦ καὶ λέγουσαν
  choice: మళ్లీ నాతో మాట్లాడుతూ ఇలా చెప్పింది
  rationale: μετά + షష్ఠీ విభక్తిలోని సంబంధ భావాన్ని ‘నాతో మాట్లాడుతూ’ నిలుపుతూ, తెలుగు వాక్యప్రవాహానికి సహజంగా attendant participle‌ను ప్రధాన క్రియతో అనుసంధానిస్తుంది.
- source_word: Ὕπαγε λάβε
  choice: వెళ్లి ... తీసుకో
  rationale: వరుసగా ఉన్న రెండు ఆజ్ఞార్థక క్రియల ప్రత్యక్షతను సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: βιβλίον
  choice: గ్రంథపు చుట్ట
  rationale: ప్రాచీన గ్రంథరూపమైన scroll‌ను ‘పుస్తకం’ అని ఆధునిక codex భావంలో చూపకుండా వ్యక్తపరుస్తుంది; ఈ వచనంలో diminutive రూపం లేదు.
- source_word: ἠνεῳγμένον
  choice: తెరిచి ఉన్న
  rationale: perfect passive participle సూచించే—ముందు తెరవబడి ఇప్పుడు తెరిచిన స్థితిలో ఉన్న—ఫలితస్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῇ χειρὶ
  choice: చేతిలో
  rationale: ἐν యొక్క స్థానార్థాన్ని నేరుగా నిలుపుతుంది; ‘చేతి నుండి’ అనే భావం ఆజ్ఞ వల్ల సూచితమైనా మూలపదబంధంలో లేదు.
- source_word: ἄγγελος
  choice: దేవదూత
  rationale: ప్రకటన గ్రంథంలోని దర్శన సందర్భంలో ఇది పరలోక దూతను సూచిస్తుంది.
- source_word: ἑστῶτος
  choice: నిలబడి ఉన్న
  rationale: కొనసాగుతున్న నిలిచిన స్థితిని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: సముద్రం మీదా నేల మీదా
  rationale: దేవదూత నిలబడిన రెండు ప్రదేశాల దృశ్య వ్యత్యాసాన్ని, గ్రీకులో ἐπί పునరుక్తిని, సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: అపోకలిప్టిక్ దృశ్యంలో γῆ అనువాదం
  choice: నేల
  alternative: భూమి
  rationale: సముద్రానికి ఎదురుగా దేవదూత నిలబడే స్థలాన్ని ఈ సందర్భం సూచిస్తుంది; ‘నేల’ ఆ దృశ్యాన్ని అనవసరమైన విశ్వసంబంధ నిర్ధారణ లేకుండా స్పష్టంగా ఇస్తుంది.
- issue: చుట్టుపక్కల వచనాల్లోని diminutive రూపంతో βιβλίον సంబంధం
  choice: గ్రంథపు చుట్ట
  alternative: చిన్న గ్రంథపు చుట్ట
  rationale: ఈ వచనంలోని పాఠం βιβλίον; సమీప వచనాల్లో βιβλαρίδιον ఉన్నప్పటికీ, ఆ ‘చిన్న’ భావాన్ని ఇక్కడి పదంలోకి కలపకుండా పాఠ్య భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని సంబంధ భావం, ఆజ్ఞల ప్రత్యక్షత, తెరిచి ఉన్న ఫలితస్థితి నిలుపబడ్డాయి. ‘నేల’కు బదులుగా ‘భూమి’ కూడా సాధ్యమే; ప్రధాన పాఠం తక్షణ దృశ్య సందర్భాన్ని అనుసరిస్తుంది.
