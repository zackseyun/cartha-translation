id: REV.10.1
reference: Revelation 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: te
  text: మరియు పరలోకం నుండి దిగివస్తున్న మరొక బలమైన[a] దూతను నేను చూశాను. అతడు మేఘాన్ని ధరించి ఉన్నాడు; అతని తలపై ఇంద్రధనుస్సు ఉంది,[b] అతని ముఖం సూర్యునిలా ఉంది, అతని పాదాలు అగ్ని స్తంభాల్లా ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరొక శక్తిమంతుడైన దూతను.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం ప్రకాశవంతమైన ‘కాంతివలయాన్ని’ కూడా సూచించగలదు; అయితే ‘ఇంద్రధనుస్సు’ దాని సాధారణ అర్థం, ప్రకటన గ్రంథంలోని ప్రతీకలకు కూడా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: మరొక ... దూతను
  rationale: దర్శన సందర్భంలోనూ, పరలోకం నుండి దిగివస్తున్నాడనే వర్ణనలోనూ ἄγγελοςకు ‘దూత’ సహజమైన ఎంపిక; అది దేవదూతను సూచిస్తూనే మూలపదంలోని దూత భావాన్ని నిలుపుతుంది.
- source_word: ἰσχυρὸν
  choice: బలశాలి
  rationale: అసాధారణ బలాన్ని సూచించే ἰσχυρός భావాన్ని సహజమైన, గంభీరమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి దిగివస్తున్న
  rationale: క్రియావిశేషణ రూపంలోని సజీవమైన దిగువకు కదలికను సహజంగా నిలుపుతుంది.
- source_word: περιβεβλημένον νεφέλην
  choice: మేఘాన్ని వస్త్రంలా ధరించుకొని ఉన్నాడు
  rationale: περιβάλλωలోని ధరించబడిన లేదా ఆవరించబడిన స్థితిని, మేఘమే వస్త్రమన్న దర్శనాత్మక చిత్రంతో స్పష్టంగా అందిస్తుంది.
- source_word: ἡ ἶρις
  choice: ఇంద్రధనుస్సు
  rationale: ἶριςకు సాధారణ అర్థం ‘ఇంద్రధనుస్సు’; ప్రకటన 4:3లోని సమాన ప్రతీకతోనూ ఇది సరిపోతుంది.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: ఆయన తలపై
  rationale: తలపై లేదా తలకు పైన ఉన్న స్థానాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: ఆయన ముఖం సూర్యునిలా ఉంది
  rationale: ὡς అనే ఉపమానాన్ని నిలుపుతూ, తెలుగులో అవసరమైన క్రియను చేర్చి వాక్యాన్ని సహజంగా చేస్తుంది.
- source_word: οἱ πόδες αὐτοῦ
  choice: ఆయన పాదాలు
  rationale: πούς యొక్క ప్రాథమిక అర్థాన్ని గంభీరమైన బైబిలు వర్ణనకు తగిన తెలుగులో అందిస్తుంది.
- source_word: στῦλοι πυρός
  choice: అగ్నిస్తంభాల్లా
  rationale: ‘అగ్ని స్తంభాలు’ అనే మూలంలోని షష్ఠీ సంబంధ చిత్రాన్ని సంక్షిప్తమైన ఉపమానంగా నిలుపుతుంది.
theological_decisions:
- issue: బలశాలి దూత యొక్క గుర్తింపు
  choice: ‘మరొక బలశాలి దూత’ అని తటస్థంగా అనువదించడం
  alternative: ఈ వ్యక్తిని సృష్టించబడిన దేవదూతగా లేదా మెస్సీయ/క్రీస్తు ప్రత్యక్షతగా స్పష్టంగా గుర్తించడం
  rationale: గ్రీకు పాఠం ఈ వ్యక్తిని కేవలం ἄλλον ἄγγελον ἰσχυρόν అని పేర్కొంటుంది. ఆయన గుర్తింపుపై ఉన్న వ్యాఖ్యాన భేదాన్ని అనువాదం పరిష్కరించకుండా, పాఠంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ దర్శన వర్ణనకు తగిన గంభీరతను నిలిపాం. పునరుక్తమైన ‘ఆయన’ నిర్మాణం మూలంలోని αὐτοῦ పునరావృతిని కొంతవరకు ప్రతిబింబించి దృశ్య భాగాలను స్పష్టంగా కలుపుతుంది.
