revisions:
- from: అప్పుడు పరలోకం నుండి దిగివస్తున్న మరొక బలశాలి దూతను నేను చూశాను.[a] ఆయన మేఘాన్ని వస్త్రంలా ధరించుకొని ఉన్నాడు; ఆయన తలపై ఇంద్రధనుస్సు ఉంది,[b] ఆయన ముఖం సూర్యునిలా ఉంది, ఆయన పాదాలు అగ్నిస్తంభాల్లా ఉన్నాయి.
