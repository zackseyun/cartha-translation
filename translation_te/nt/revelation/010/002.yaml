id: REV.10.2
reference: Revelation 10:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ χειρὶ αὐτοῦ ⸀βιβλαρίδιον ἠνεῳγμένον. καὶ ἔθηκεν τὸν πόδα αὐτοῦ τὸν δεξιὸν ἐπὶ τῆς θαλάσσης, τὸν δὲ εὐώνυμον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/002.yaml
  text: and having in his hand a little scroll that had been opened[a]. And he placed his right foot on the sea, and his left on the land[b],
translation:
  language: te
  text: అతని చేతిలో తెరవబడి ఉన్న ఒక చిన్న చుట్ట[a] ఉంది. అతడు తన కుడి పాదాన్ని సముద్రం మీద, ఎడమ పాదాన్ని నేల[b] మీద ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక చిన్న పుస్తకం.’ గ్రీకు βιβλαρίδιον అనే కురచరూప పదం చిన్న చుట్టను లేదా చిన్న పుస్తకాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘భూమి.’ గ్రీకు γῆ అనే పదానికి ‘నేల,’ ‘దేశం,’ లేదా ‘భూమి’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ సముద్రంతో ఉన్న వ్యత్యాసాన్ని చూపడానికి ‘నేల’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων ἐν τῇ χειρὶ αὐτοῦ
  choice: అతని చేతిలో ... ఉంది
  rationale: వర్తమాన కృదంత నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, దూత చేతిలో అది ఉన్నదనే భావాన్ని నిలుపుతుంది.
- source_word: βιβλαρίδιον
  choice: ఒక చిన్న గ్రంథపు చుట్ట
  rationale: కురచరూప పదం చిన్న చుట్ట లేదా చిన్న పుస్తకాన్ని సూచిస్తుంది; దర్శనంలోని చుట్ట రూపకాన్ని స్పష్టంగా ఉంచేందుకు ‘చిన్న గ్రంథపు చుట్ట’ ఎంచుకోబడింది.
- source_word: ἠνεῳγμένον
  choice: తెరవబడి ఉన్న
  rationale: పూర్తయిన క్రియ ఫలితంగా కొనసాగుతున్న తెరిచిన స్థితిని గ్రీకు పరిపూర్ణ కర్మణి కృదంతానికి అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: ἔθηκεν
  choice: ఉంచాడు
  rationale: దూత ఉద్దేశపూర్వకంగా తన పాదాలను ఉంచిన చర్యకు సహజమైన ఆధునిక తెలుగు పదం.
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιὸν
  choice: తన కుడి పాదాన్ని
  rationale: గ్రీకులోని స్వాధీనతను మరియు కుడి పాదమనే స్పష్టతను సహజంగా నిలుపుతుంది.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: సముద్రం మీద
  rationale: దర్శనంలోని సజీవ స్థలచిత్రాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: τὸν δὲ εὐώνυμον
  choice: ఎడమ పాదాన్ని
  rationale: సమాంతర వాక్యనిర్మాణంలో గ్రీకులో రెండవసారి సూచింపబడిన పాదాన్ని తెలుగులో స్పష్టత కోసం పునరుక్తం చేస్తుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: నేల మీద
  rationale: సముద్రానికి వ్యతిరేకంగా ఉన్న పొడి నేలను సూచించే స్థానిక భేదాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: θάλασσα కు వ్యతిరేకంగా γῆ అర్థం
  choice: నేల
  alternative: భూమి
  rationale: ఇక్కడ ఒక పాదం సముద్రం మీద, మరొకటి పొడి నేల మీద ఉండే దృశ్యభేదమే ప్రధానంగా ఉంది. ‘నేల’ ఈ తక్షణ స్థలభేదాన్ని నిలుపుతుంది; ‘భూమి’ అనే విస్తృత విశ్వసంబంధ భావాన్ని అనవసరంగా నిర్బంధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన దర్శనశైలి వాడబడింది. గ్రీకు వాక్యంలోని కృదంత నిర్మాణం తెలుగులో సహజమైన స్వతంత్ర వాక్యంగా మార్చబడినా, తెరవబడిన చుట్ట దూత చేతిలో ఉన్నదనే సంబంధం మరియు పరిపూర్ణ క్రియ ఫలితస్థితి నిలుపబడ్డాయి.
