  terminology: ‘చిన్న చుట్ట’ is a natural, neutral rendering of βιβλαρίδιον. The note retains ‘చిన్న పుస్తకం’ as a legitimate lexical alternative. ‘నేల’ is suitable here, with ‘భూమి’ retained in the footnote as an alternative.
