id: REV.10.3
reference: Revelation 10:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: te
  text: అతడు సింహం గర్జించినట్లుగా బిగ్గర స్వరంతో కేక వేశాడు. అతడు కేక వేసినప్పుడు, ఆ ఏడు ఉరుములు తమ స్వరాలతో పలికాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ ఏడు ఉరుములు తమ స్వరాలను పలికాయి.” గ్రీకు వాక్యం అసాధారణంగా అక్షరార్థమైనది; ఉరుములు మాట్లాడినట్లుగా వాటిని వ్యక్తులవలె చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: కేక వేశాడు
  rationale: కράζω బలమైన, బిగ్గర పిలుపును సూచిస్తుంది. ‘కేక వేశాడు’ తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; అది తప్పనిసరిగా బాధతో చేసిన కేక అని నిర్దేశించదు.
- source_word: φωνῇ μεγάλῃ
  choice: గొప్ప స్వరంతో
  rationale: φωνή అనే స్పష్టమైన నామవాచకాన్ని నిలుపుతూ, దత్తివిభక్తి పదబంధంలోని సాధన/విధాన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὥσπερ λέων μυκᾶται
  choice: సింహం గర్జించినట్లుగా
  rationale: ὥσπερ లోని పోలికను స్పష్టంగా నిలుపుతుంది; సింహం చేసే శబ్దానికి ‘గర్జించు’ సహజమైన తెలుగు పదం.
- source_word: ὅτε
  choice: వేసినప్పుడు
  rationale: కాలసంబంధాన్ని మాత్రమే తెలియజేస్తుంది; ‘తర్వాత’ అని అనువదించి క్రమాన్ని అనవసరంగా మరింత నిర్దిష్టం చేయదు.
- source_word: αἱ ἑπτὰ βρονταὶ
  choice: ఆ ఏడు ఉరుములు
  rationale: నిర్దిష్ట ఉపపద భావాన్ని ‘ఆ’ ద్వారా సూచిస్తూ, దర్శనంలోని ఏడు ఉరుములను వ్యక్తులవలె చూపే చిత్రణను నిలుపుతుంది.
- source_word: ἐλάλησαν ... τὰς ἑαυτῶν φωνάς
  choice: తమ తమ స్వరాలతో పలికాయి
  rationale: λαλέω యొక్క ‘పలుకు’ భావాన్నీ, ἑαυτῶν లోని స్వకీయ ఉద్ఘాటనను ‘తమ తమ’ ద్వారా నిలుపుతుంది. ‘స్వరాలతో’ అనడం తెలుగులో సహజంగా ఉండి, ఉరుములు మాట్లాడినట్లుగా చూపే వ్యక్తీకరణను కాపాడుతుంది.
theological_decisions:
- issue: ఏడు ఉరుముల వ్యక్తీకరణ
  choice: ‘ఆ ఏడు ఉరుములు తమ తమ స్వరాలతో పలికాయి’ అని వ్యక్తులవలె మాట్లాడినట్లు అనువదించడం
  alternative: ‘ఆ ఏడు ఉరుములు మోగాయి’
  rationale: గ్రీకు వాక్యం ఉరుములకు ‘పలకడం’ను, ‘స్వరాలు’ను ఆపాదిస్తుంది. దర్శన సాహిత్యంలోని ఈ ఉద్దేశపూర్వక వ్యక్తీకరణను కేవలం శబ్దంగా మార్చకుండా నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘గొప్ప స్వరంతో’ మూలంలోని నామవాచక నిర్మాణాన్ని నిలుపుతుంది; ‘తమ తమ స్వరాలతో పలికాయి’ సహజత్వాన్నీ దర్శనాత్మక వ్యక్తీకరణనూ సమతుల్యం చేస్తుంది.
