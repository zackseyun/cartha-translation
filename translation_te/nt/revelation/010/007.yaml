id: REV.10.7
reference: Revelation 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own servants, the prophets.
translation:
  language: te
  text: కాని ఏడవ దూత స్వరం వినిపించే రోజుల్లో—అతడు బూర ఊదబోతున్నప్పుడు—దేవుడు తన దాసులైన[a] ప్రవక్తలకు శుభవార్తగా ప్రకటించినట్టే, దేవుని మర్మం నెరవేరుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకులైన.’ గ్రీకు పదానికి ‘దాసులు’ లేదా ‘సేవకులు’ అనే అర్థాలు రావచ్చు; ఇక్కడ వారు దేవునికి చెందినవారనే భావం ప్రధానంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: కాని
  rationale: ముందున్న వాక్యంలోని ఆలస్యం గురించిన ప్రకటనకు దీనిని వ్యతిరేకార్థకంగా అనుసంధానిస్తుంది.
- source_word: ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: ఏడవ దూత స్వరం వినిపించే రోజుల్లో
  rationale: అక్షరార్థమైన ‘స్వరపు రోజుల్లో’ అనే అసహజ నిర్మాణాన్ని నివారిస్తూ, φωνήలోని ‘స్వరం/ధ్వని’ భావాన్ని నిలుపుతుంది; దానిని ముందుగానే బూర ధ్వనిగా మాత్రమే పరిమితం చేయదు.
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: అతడు బూర ఊదబోతున్నప్పుడు
  rationale: μέλλῃ తెలిపే సమీప భవిష్యత్తును ‘ఊదబోతున్నప్పుడు’ ద్వారా, సందర్భంలో అంతర్లీనంగా ఉన్న బూరను స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ ἐτελέσθη
  choice: నెరవేరుతుంది
  rationale: రూపపరంగా భూతకాల ఏకఘట్ట క్రియ అయినప్పటికీ, భవిష్యత్తును సూచించే కాలవాక్య సందర్భంలో ఫలిత నిశ్చయాన్ని తెలుగులో సహజమైన భవిష్యత్ రూపంతో తెలుపుతుంది. ‘ముగుస్తుంది’ కంటే దేవుని సంకల్పం సాకారమవడాన్ని ‘నెరవేరుతుంది’ స్పష్టంగా అందిస్తుంది.
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: దేవుని మర్మం
  rationale: దేవుడు వెల్లడించే వరకు గూఢంగా ఉన్న సంకల్పం అనే బైబిలీయ భావాన్ని అతిగా వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: ὡς εὐηγγέλισεν
  choice: శుభవార్తగా ప్రకటించినట్టే
  rationale: εὐαγγελίζωలోని శుభవార్త ప్రకటించే భావాన్ని కేవలం ‘తెలియజేశాడు’గా కుదించకుండా కాపాడుతుంది.
- source_word: τοὺς ἑαυτοῦ δούλους τοὺς προφήτας
  choice: తన దాసులైన ప్రవక్తలకు
  rationale: ἑαυτοῦ సూచించే దేవునికి చెందినవారనే బలాన్ని ‘తన’ నిలుపుతుంది; ‘దాసులు’ సేవతో పాటు యజమానికి చెందిన బంధాన్ని కూడా వ్యక్తపరుస్తుంది; ‘ప్రవక్తలు’ వారెవరో వివరిస్తుంది.
theological_decisions:
- issue: దేవుని ప్రవక్తలకు వర్తించిన δοῦλος పదం
  choice: దాసులు
  alternative: సేవకులు
  rationale: ἑαυτοῦతో కలిసి ఈ పదం దేవునికి చెందిన నియమిత ప్రతినిధులనే భావాన్ని బలపరుస్తుంది. ‘దాసులు’ ఆ బంధాన్ని నిలుపుతుండగా, మరింత సేవాకేంద్రీకృత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: భవిష్యత్ సందర్భంలో ἐτελέσθη యొక్క కాలం మరియు భావం
  choice: నెరవేరుతుంది
  alternative: నెరవేరింది / పూర్తవుతుంది
  rationale: గ్రీకులో భూతకాల రూపం ఉన్నా, ‘ఎప్పుడు ... ఊదబోతున్నాడో’ అనే భవిష్యత్ సందర్భం నిశ్చయంగా జరగబోయే కార్యాన్ని సూచిస్తుంది. తెలుగు వర్తమాన-భవిష్యత్ రూపం ఆ సందర్భాన్ని సహజంగా అందిస్తుంది; ప్రత్యేక అంత్యకాల వ్యవస్థను రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటన గ్రంథ శైలిని నిలుపుతూ, అసహజమైన అక్షరానువాద నిర్మాణాలను నివారించాం. దీర్ఘ వాక్యంలోని కాలసంబంధ ఉపవాక్యాన్ని స్పష్టంచేయడానికి దీర్ఘ విరామచిహ్నాలు వాడాం.
