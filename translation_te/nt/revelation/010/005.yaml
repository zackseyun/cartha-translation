id: REV.10.5
reference: Revelation 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: te
  text: నేను చూసిన, సముద్రం మీదను భూమి[a] మీదను నిలబడి ఉన్న దేవదూత తన కుడిచేతిని పరలోకానికి ఎత్తాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక “నేల.”
    reason: lexical_alternative
  - marker: b
    text: లేక “పరలోకం వైపు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: దేవదూత
  rationale: ప్రకటన గ్రంథంలోని సందర్భం పరలోక సంబంధమైన జీవిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేవదూత’ అనేది సాధారణ ‘దూత’ కంటే ఈ సూచనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἑστῶτα
  choice: నిలబడి
  rationale: పరిపూర్ణ క్రియారూపం దేవదూత అప్పటికే నిలబడి ఉన్న స్థితిని వివరిస్తుంది; ‘నిలబడి’ సహజమైన తెలుగులో ఆ కొనసాగుతున్న భంగిమను తెలియజేస్తుంది.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: సముద్రం మీద
  rationale: ἐπίతో కూడిన ఈ పదబంధంలోని స్పష్టమైన దృశ్యాన్ని ‘సముద్రం మీద’ నేరుగా నిలుపుతుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: నేల మీద
  rationale: ఇక్కడ γῆ సముద్రానికి విరుద్ధమైన నేల/భూభాగాన్ని సూచిస్తుంది; ‘నేల’ ఆ తక్షణ దృశ్య వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἦρεν
  choice: ఎత్తాడు
  rationale: αἴρω ఇక్కడ ప్రమాణం చేయడానికి సంబంధించిన గంభీరమైన చేతి సంజ్ఞను సూచిస్తుంది; ‘ఎత్తాడు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: తన కుడిచేతిని
  rationale: గ్రీకు వాక్యం చేయి కుడిచేయి అని స్పష్టంగా పేర్కొంటుంది; తెలుగులో కర్తను తిరిగి సూచించడానికి ‘తన’ సహజం.
- source_word: εἰς τὸν οὐρανόν
  choice: పరలోకం వైపు
  rationale: εἰς దిశను సూచిస్తుంది; తరువాతి వచనంలోని ప్రమాణ సందర్భాన్ని దృష్టిలో ఉంచుకొని ‘పరలోకం’ దాని ఆధ్యాత్మిక గాంభీర్యాన్ని కాపాడుతుంది, ‘వైపు’ దిశార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: θάλασσαకు విరుద్ధంగా γῆను అనువదించడం
  choice: నేల
  alternative: భూమి
  rationale: దేవదూత సముద్రం, నేల అనే రెండు ప్రదేశాలపై నిలిచిన దృశ్యమే ప్రధానంగా ఉంది. ‘నేల’ ఈ స్థానిక వ్యత్యాసాన్ని తెలియజేస్తుంది; ‘భూమి’ అనే విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- issue: οὐρανόςను అనువదించడం
  choice: పరలోకం
  alternative: ఆకాశం
  rationale: తరువాతి వచనంలో సృష్టికర్తపై చేసే ప్రమాణానికి ఈ సంజ్ఞ ముందుమాటగా ఉంది. అందువల్ల కేవలం భౌతిక ఆకాశాన్ని సూచించేలా పరిమితం చేయకుండా ‘పరలోకం’ అనే గంభీర పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా వాక్య నిర్మాణం ఉంచబడింది. మూలంలోని సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజమైన క్రమంలో మార్చినా, దేవదూతను యోహాను చూడడం, అతడు సముద్రం మరియు నేల మీద నిలబడడం, కుడిచేయిని పరలోకం వైపు ఎత్తడం అనే అంశాలన్నీ నిలుపబడ్డాయి.
