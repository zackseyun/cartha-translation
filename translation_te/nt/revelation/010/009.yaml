id: REV.10.9
reference: Revelation 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: te
  text: నేను ఆ దూత దగ్గరికి వెళ్లి, ఆ చిన్న చుట్టను నాకు ఇవ్వమని చెప్పాను.[a] అతడు నాతో ఇలా అంటాడు:[b] “దాన్ని తీసుకొని పూర్తిగా తిను. అది నీ కడుపును చేదుగా చేస్తుంది; కానీ నీ నోటిలో తేనెలా తియ్యగా ఉంటుంది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చిన్న పుస్తకం.” గ్రీకులోని βιβλαρίδιον చిన్న చుట్టను లేదా చిన్న పుస్తకాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతడు నాతో ఇలా అన్నాడు.” గ్రీకులో కథనాన్ని సజీవంగా చూపే చారిత్రక వర్తమాన కాలం (“అంటాడు”) ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: నేను ఆ దూత దగ్గరికి వెళ్లి
  rationale: ἀπῆλθα ఇక్కడ దూతవైపు యోహాను కదలికను సూచిస్తుంది. ‘దగ్గరికి వెళ్లి’ అనేది πρὸς భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: నాకు ఇవ్వమని చెప్పాను
  rationale: ఈ కృదంత-అనంతక నిర్మాణం పలికిన మాటల విషయాన్ని తెలియజేస్తుంది. ‘చెప్పాను’ మూలంలోని λέγωνను నిలుపుతుంది; ‘అడిగాను’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని వినయపూర్వక అభ్యర్థన భావం చేరవచ్చు.
- source_word: βιβλαρίδιον
  choice: చిన్న గ్రంథపు చుట్ట
  rationale: ద్వితీయ లఘురూపమైన βιβλαρίδιον చిన్న పుస్తకం లేదా చిన్న చుట్టను సూచించవచ్చు. ప్రకటన గ్రంథంలోని ప్రాచీన లిఖిత సందర్భానికి ‘గ్రంథపు చుట్ట’ స్పష్టంగా సరిపోతూ, ‘చిన్న’ లఘుత్వాన్ని నిలుపుతుంది.
- source_word: λέγει μοι
  choice: ఆయన నాతో ఇలా అంటున్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలపు సజీవతను తెలుగులో వర్తమాన రూపంతో నిలిపాం. ‘ఇలా’ ప్రత్యక్ష వాక్యానికి సహజమైన పరిచయంగా పనిచేస్తుంది.
- source_word: Λάβε
  choice: దాన్ని తీసుకొని
  rationale: λαμβάνω ఆజ్ఞకు ‘తీసుకో’ ప్రాథమిక భావం. తరువాతి ఆజ్ఞతో సహజంగా కలపడానికి తెలుగులో ‘తీసుకొని’ వాడాం; కర్మను సందర్భానుసారంగా ‘దాన్ని’ అని తెలిపాం.
- source_word: κατάφαγε αὐτό
  choice: పూర్తిగా తిను
  rationale: κατεσθίωలోని బలవంతమైన లేదా సంపూర్ణంగా తినే భావాన్ని ‘పూర్తిగా తిను’ సహజంగా తెలియజేస్తుంది; ‘మింగివేయి’ అనడం అవసరానికి మించిన తీవ్రతను తెచ్చే అవకాశం ఉంది.
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: అది నీ కడుపుకు చేదు కలిగిస్తుంది
  rationale: πικραίνω కారణార్థక భావాన్ని ‘చేదు కలిగిస్తుంది’ నిలుపుతుంది. తినడం, జీర్ణం అనే సందర్భంలో κοιλίαకు ‘కడుపు’ సాధారణ ఆధునిక తెలుగు పదం.
- source_word: ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι
  choice: నీ నోటిలో మాత్రం తేనెలా తియ్యగా ఉంటుంది
  rationale: గ్రీకు ఉపమానాన్ని నేరుగా నిలుపుతూ, ἀλλά వ్యత్యాసాన్ని తెలుగులో సహజంగా ‘కానీ... మాత్రం’ ద్వారా వ్యక్తం చేశాం.
theological_decisions:
- issue: గ్రంథపు చుట్టను తినే ప్రతీకాత్మక చర్య
  choice: ‘దాన్ని తీసుకొని పూర్తిగా తిను’ అనే దృశ్యమైన ఆజ్ఞను వివరణ లేకుండా నిలిపాం.
  alternative: దేవుని సందేశాన్ని అంతరంగీకరించు అనే అర్థాన్ని అనువాదంలోనే చేర్చడం.
  rationale: వచనం ప్రతీకాత్మక చర్యను చూపుతుంది గాని దాని అర్థాన్ని ఈ వాక్యంలో విప్పి చెప్పదు. వివరణాత్మక సిద్ధాంతాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ప్రతీకలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని కాపాడాం.
- issue: λέγει అనే చారిత్రక వర్తమానం
  choice: ‘అంటున్నాడు’ అని వర్తమాన కాలాన్ని నిలిపాం.
  alternative: తెలుగు కథన ప్రవాహానికి అనుగుణంగా ‘అన్నాడు’ అని భూతకాలంలో ఇవ్వడం.
  rationale: రెండూ సందర్భార్థాన్ని అందించినా, మూలంలోని సజీవమైన కాలమార్పును నిలపడం సాధ్యమైనందున వర్తమాన రూపాన్ని ఎంచుకున్నాం; పాఠకులకు ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా దర్శన గ్రంథానికి తగిన గంభీరతతో రూపొందించబడింది. ‘చిన్న గ్రంథపు చుట్ట’ ప్రాచీన లిఖిత వస్తువును స్పష్టం చేస్తుంది. గ్రీకు చారిత్రక వర్తమానాన్ని ఉద్దేశపూర్వకంగా నిలిపి, దాని భూతకాల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
