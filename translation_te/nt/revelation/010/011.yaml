id: REV.10.11
reference: Revelation 10:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: te
  text: 'వారు నాతో ఇలా అంటున్నారు: “నీవు ప్రజలు, జనములు, భాషలు, అనేక రాజుల గురించి మళ్లీ ప్రవచించాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσίν μοι
  choice: వారు నాతో ఇలా అన్నారు
  rationale: గ్రీకు బహువచన కర్తను అలాగే ఉంచి, ప్రత్యక్ష వాక్యానికి సహజమైన ఆధునిక తెలుగు ప్రవేశాన్ని ఇచ్చింది. గ్రీకులో వర్తమాన కాలం ఉన్నప్పటికీ, దర్శన కథన ప్రవాహంలో తెలుగు భూతకాలం సహజంగా ఉంటుంది.
- source_word: Δεῖ σε
  choice: నీవు ... ప్రవచించాలి
  rationale: దైవిక అవసరం లేదా విధిని సూచించే δεῖ భావాన్ని స్పష్టమైన ‘చేయాలి’ రూపంలో తెలిపింది.
- source_word: πάλιν προφητεῦσαι
  choice: మళ్లీ ప్రవచించాలి
  rationale: πάλιν యొక్క పునరావృత్తి భావాన్నీ, προφητεύω యొక్క ప్రవచన ప్రకటన భావాన్నీ నేరుగా నిలిపింది.
- source_word: ἐπὶ
  choice: గురించి
  rationale: ఇక్కడి ἐπίకి ‘గురించి/సంబంధించి’ అనే భావం సందర్భానుకూలం; ఈ సమూహాల ఎదుటనే ప్రవచించాలి అని అనవసరంగా నిర్ణయించదు.
- source_word: λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς
  choice: అనేక ప్రజల గురించి, జనాల గురించి, భాషల గురించి, రాజుల గురించి
  rationale: ప్రకటన గ్రంథంలో కనిపించే నాలుగు వర్గాల జాబితాను వేరువేరుగా నిలిపి, πολλοῖς‌ను వాటన్నిటికీ సహజంగా వర్తించేలా ప్రారంభంలో ‘అనేక’గా ఉంచింది.
theological_decisions:
- issue: ἐπὶ యొక్క అర్థపరిధి
  choice: గురించి
  alternative: ఎదుట / మీద
  rationale: సందేశం అనేక ప్రజలు, జనాలు, భాషలు, రాజులకు సంబంధించినదని తెలిపే పఠనం సందర్భానుకూలం. అయితే గ్రీకు ఉపసర్గలో లక్ష్యంగా లేదా ఎదుట ప్రకటించడం అనే ఛాయ కూడా ఉండవచ్చు; ప్రధాన పాఠ్యంలో ఒక నిర్దిష్ట సిద్ధాంతార్థాన్ని అదనంగా చేర్చలేదు.
- issue: λέγουσιν అనే బహువచన కర్త యొక్క గుర్తింపు
  choice: వారు
  alternative: అతడు / ఒక స్వరం
  rationale: మూలపాఠ్యం కర్తను స్పష్టంగా గుర్తించకుండా బహువచనంలో ఉంచుతుంది. అందువల్ల దేవదూత, పరలోక స్వరాలు లేదా ఇతర వక్తలు అని నిర్ణయించకుండా అస్పష్టతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘ప్రజలు—జనాలు—భాషలు—రాజులు’ అనే ప్రకటన గ్రంథపు జాబితా నిర్మాణం నిలుపబడింది.
