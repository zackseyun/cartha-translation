id: REV.10.6
reference: Revelation 10:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: te
  text: యుగయుగాలు జీవించే ఆయనను సాక్షిగా పెట్టుకొని, ఆకాశాన్నీ దానిలో ఉన్నవాటినీ, భూమినీ దానిలో ఉన్నవాటినీ, సముద్రాన్నీ దానిలో ఉన్నవాటినీ సృష్టించిన ఆయన పేరున, “ఇక ఏ ఆలస్యమూ ఉండదు”[a] అని అతడు ప్రమాణం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇక కాలం ఉండదు.” ఈ సందర్భంలో χρόνος (క్రోనోస్) అనే గ్రీకు పదాన్ని దేవుని తుదిచర్యకు ముందున్న నిరీక్షణ లేదా ‘ఆలస్యం’ అనే అర్థంలో అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: ప్రమాణం చేశాడు
  rationale: ὀμνύω యొక్క భూతకాల రూపం గంభీరంగా ప్రమాణం చేయడాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రమాణం చేశాడు’ సహజంగానూ గౌరవప్రదంగానూ ఉంది.
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాలు జీవించే వానిని సాక్షిగా పెట్టుకొని
  rationale: ὀμνύω తరువాతి కర్తరి కర్మణి చతుర్థీ విభక్తి ప్రమాణానికి సాక్షిగా ఆహ్వానించబడిన వ్యక్తిని సూచిస్తుంది. ‘యుగయుగాలు’ అంతంలేని కాలాన్ని సహజమైన తెలుగు నుడికారంలో తెలియజేస్తుంది.
- source_word: ἔκτισεν
  choice: సృష్టించిన
  rationale: κτίζω ఈ విశ్వసృష్టి సందర్భంలో ‘సృష్టించు’ అనే అర్థాన్ని ఇస్తుంది; ‘చేసిన’ కంటే మూలంలోని సృష్టికర్త భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τὸν οὐρανὸν
  choice: ఆకాశాన్ని
  rationale: సృష్టికి సంబంధించిన ఆకాశం–భూమి–సముద్రం త్రయంలో οὐρανός విశాలమైన పైలోకాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘ఆకాశం’ స్పష్టంగా ఉంటుంది.
- source_word: τὰ ἐν αὐτῷ / τὰ ἐν αὐτῇ
  choice: దానిలో ఉన్నవాటిని / దానిపై ఉన్నవాటిని
  rationale: పునరావృత నిర్మాణాన్ని నిలుపుతూ, ఆకాశం మరియు సముద్రానికి ‘దానిలో’, భూమికి సహజ తెలుగు వాడుక ప్రకారం ‘దానిపై’ ఉపయోగించబడింది. ἐν సందర్భానుసారంగా ‘లో’ లేదా ‘పై’ అనే స్థానార్థాన్ని కలిగి ఉంటుంది.
- source_word: γῆν
  choice: భూమిని
  rationale: ఆకాశం–భూమి–సముద్రం అనే విశ్వవ్యాప్త త్రయంలో γῆ స్థానిక భూభాగం కాకుండా భూమిని సూచిస్తుంది.
- source_word: θάλασσαν
  choice: సముద్రాన్ని
  rationale: ఏకవచన θάλασσα కు సహజమైన, నేరమైన తెలుగు సమానార్థకం ‘సముద్రం’.
- source_word: ὅτι
  choice: అని
  rationale: ప్రమాణంలోని విషయాన్ని పరిచయం చేసే ὅτι ను తెలుగులో ఉద్ధరణార్థక ‘అని’ సహజంగా తెలియజేస్తుంది.
- source_word: χρόνος οὐκέτι ἔσται
  choice: ఇక ఏ ఆలస్యమూ ఉండదు
  rationale: తరువాతి వచనంలో దేవుని మర్మం నెరవేరబోతున్నదనే సందర్భం దృష్ట్యా χρόνος ఇక్కడ కాలమే అంతమవుతుందని కాకుండా ఇక వేచి ఉండాల్సిన ఆలస్యం లేదని సూచించే అవకాశం బలంగా ఉంది. ‘ఏ ఆలస్యమూ’ అనే రూపం οὐκέτι యొక్క సంపూర్ణ బలాన్ని తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: χρόνος οὐκέτι ἔσται అనే ప్రమాణ వాక్యపు అర్థం
  choice: దేవుని తుదిచర్యకు ముందు ఇక ఆలస్యం లేదా నిరీక్షణకాలం ఉండదు
  alternative: ‘ఇక కాలం ఉండదు’ లేదా ‘కాలం ఇక ఉండబోదు’
  rationale: 10:7లో దేవుని మర్మం నెరవేరడమే తక్షణ సందర్భం. అందువల్ల ఈ మాట కాలగమనమే పూర్తిగా నిలిచిపోతుందనే సిద్ధాంత ప్రకటనగా కాకుండా, దేవుని కార్యానికి విధించిన నిరీక్షణ ఇక ముగిసిందనే ప్రకటనగా అర్థం చేసుకోవడం సందర్భోచితం. అయినా గ్రీకు పదానికి ఉన్న అక్షరార్థపు సాధ్యతను పాదసూచికలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటన శైలిని ఉపయోగించాం. ఆకాశం–భూమి–సముద్రం అనే మూడు భాగాల సమాంతర నిర్మాణాన్ని నిలిపాం. ‘వానిని’ అనే సంబంధబోధక రూపం గౌరవాన్ని తగ్గించకుండా వాక్యాన్ని సహజంగా ఉంచుతుంది; ‘సాక్షిగా పెట్టుకొని ... ప్రమాణం చేశాడు’ అనేది ప్రమాణం చేయబడిన వ్యక్తిని స్పష్టంగా తెలియజేసే ప్రస్తుత తెలుగు ప్రయోగం.
