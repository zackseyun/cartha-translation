id: REV.10.10
reference: Revelation 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: te
  text: నేను దూత చేతిలోనుండి ఆ చిన్న వ్రాతచుట్టను[a] తీసుకొని తిన్నాను. అది నా నోటిలో తేనెలా తియ్యగా ఉంది; దాన్ని తిన్నప్పుడు నా కడుపు[b] చేదుగా మారింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చిన్న పుస్తకాన్ని.” గ్రీకు పదం చిన్న వ్రాతపత్రాన్ని సూచించే అల్పార్థక రూపం; ప్రాచీన కాలపు సంభావ్య రూపానికి “చిన్న వ్రాతచుట్ట” సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా ఉదరం చేదుగా మారింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: చిన్న గ్రంథపు చుట్ట
  rationale: ఈ అల్పార్థక రూపం చిన్న వ్రాతపత్రాన్ని సూచిస్తుంది. ప్రాచీన కాలంలో దాని సంభావ్య భౌతిక రూపాన్ని, చిన్నదనే భావాన్ని రెండింటినీ ఈ పదబంధం నిలుపుతుంది.
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: దూత చేతిలోనుండి
  rationale: దూత చేతినుండే దానిని తీసుకున్న దృశ్యాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: κατέφαγον
  choice: తిన్నాను
  rationale: సమ్మేళన క్రియలో తీవ్రత ఉండగలిగినా, ఇక్కడ సాధారణంగా ‘తిన్నాను’ అనడం సహజం; ‘మింగివేశాను’ లేదా ‘కబళించాను’ అంటే మూలంలో అవసరమైనదానికంటే ఎక్కువ తీవ్రత చేరవచ్చు.
- source_word: ὡς μέλι γλυκύ
  choice: తేనెలా తియ్యగా
  rationale: ὡς లోని పోలికను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὅτε ἔφαγον αὐτό
  choice: దాన్ని తిన్నప్పుడు
  rationale: గ్రీకు కథన క్రమాన్ని అనవసరమైన కాలభేద వివరణ లేకుండా సహజంగా చూపుతుంది.
- source_word: ἐπικράνθη
  choice: చేదుగా మారింది
  rationale: రూపపరంగా నిష్క్రియార్థకమైన క్రియను తెలుగులో అసహజమైన ‘చేదుగా చేయబడింది’ అని కాకుండా, సందర్భానికి తగిన ఫలితస్థితిగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κοιλία
  choice: కడుపు
  rationale: ఇక్కడి శరీర సంబంధ అర్థానికి సాధారణ ఆధునిక తెలుగులో స్పష్టమైన పదం; ‘ఉదరం’ మరింత గ్రాంథికంగా ఉంటుంది.
theological_decisions:
- issue: గ్రంథపు చుట్టను తినడం అనే సంకేతాత్మక కార్యం
  choice: తీపి, చేదు అనే దృశ్యాలను వివరణ జోడించకుండా యథాతథంగా అనువదించడం
  alternative: తీపిని ఆనందంగా, చేదును తీర్పుగా అనువాదంలోనే స్పష్టీకరించడం
  rationale: ఈ వచనం ప్రవచనాత్మక సంకేతాన్ని చూపుతుంది గాని దాని అన్ని భావాలను ఇక్కడే వివరించదు. అందువల్ల అనువాదం ఆ సంకేతాన్నీ దానిలోని ఉద్వేగాన్నీ నిలుపుతుంది; నిర్దిష్ట వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని వరుస చర్యలు, తేనెతీపి–కడుపు చేదు మధ్య ఉన్న ప్రతీకాత్మక ఉద్వేగం నిలుపబడ్డాయి.
