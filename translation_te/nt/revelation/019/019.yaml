- from: అప్పుడు ఆ మృగాన్నీ, భూమి రాజులనూ, వారి సైన్యాలనూ చూశాను. వారు గుర్రం మీద కూర్చున్నవానితోనూ అతని సైన్యంతోనూ యుద్ధం చేయడానికి సమకూడి ఉన్నారు.[a] [b]
