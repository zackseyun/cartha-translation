source:
  edition: SBLGNT
  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: te
  text: ఆ మృగాన్నీ, భూమి రాజులనూ, వారి సైన్యాలనూ నేను చూశాను. వారు గుర్రం మీద కూర్చున్నవానికి, అతని సైన్యానికి వ్యతిరేకంగా యుద్ధం చేయడానికి సమకూరి ఉన్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకచోటికి చేర్చబడి ఉన్నారు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘యుద్ధం చేయడానికి … తో’; సందర్భంలో భావం ‘…కు వ్యతిరేకంగా యుద్ధం చేయడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలోని ప్రతీకాత్మకమైన, భయంకరమైన భావాన్ని నిలుపుతూ ఆధునిక తెలుగు బైబిలు వాడుకకు సహజంగా ఉంటుంది.
- source_word: βασιλεῖς τῆς γῆς
  choice: భూమి రాజులు
  rationale: ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త అంత్యకాల సందర్భంలో γῆ ఇక్కడ ఒక ప్రాంతీయ దేశం కంటే భూమిని సూచిస్తుంది.
- source_word: στρατεύματα
  choice: సైన్యాలు
  rationale: πόλεμος కలిగించే సైనిక సందర్భంలో ఈ బహువచన రూపానికి ‘సైన్యాలు’ సహజమైన సమానార్థకం.
- source_word: συνηγμένα
  choice: సమకూడి ఉన్నారు
  rationale: పరిపూర్ణ కర్మణి కృదంతం వారు ఒకచోటికి చేర్చబడి, అలా సమకూడిన స్థితిలో ఉన్నారనే భావాన్ని ఇస్తుంది.
- source_word: ποιῆσαι τὸν πόλεμον
  choice: యుద్ధం చేయడానికి
  rationale: యుద్ధంలో తలపడటాన్ని తెలిపే గ్రీకు నుడికారాన్ని స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: గుర్రం మీద కూర్చున్నవానితో
  rationale: μετά యొక్క అక్షరార్థమైన ‘తో’ను నిలుపుతుంది; యుద్ధ సందర్భం దీనికి వ్యతిరేక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: τοῦ καθημένου
  choice: కూర్చున్నవాడు
  rationale: గ్రీకులోని వర్ణనాత్మక కృదంతాన్ని నిలుపుతూ ‘గుర్రపు రౌతు’ లేదా క్రీస్తు అనే వివరణాత్మక గుర్తింపును పాఠ్యంలో చేర్చదు.
- source_word: ἐπὶ τοῦ ἵππου
  choice: గుర్రం మీద
  rationale: స్థానార్థాన్ని ఆధునిక, సహజ తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: అతని సైన్యంతో
  rationale: ఏకవచన στρατεύματος ను సామూహిక ఏకవచనంగా ‘సైన్యం’ అని, μετά ను ‘తో’ అని నిలుపుతుంది; యుద్ధ సందర్భం శత్రుత్వాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: గుర్రం మీద కూర్చున్నవాని గుర్తింపు
  choice: పాఠ్యంలో ఉన్న వర్ణనాత్మక పదబంధాన్నే నిలిపాం.
  alternative: ‘మెస్సీయతో’ లేదా ‘క్రీస్తుతో’ అని స్పష్టంగా పేర్కొనడం.
  rationale: సమీప సందర్భం ఆ వ్యక్తిని గుర్తించడానికి సహాయపడినా, ఈ వచనం స్వయంగా బిరుదును ఉపయోగించదు. అందువల్ల మూలంలోని వర్ణనను అలాగే ఉంచడం అనవసరమైన వ్యాఖ్యానాన్ని నివారిస్తుంది.
- issue: μετά పదబంధాల శత్రుత్వ భావం
  choice: ముఖ్య పాఠ్యంలో ‘తో’ అని ఉంచి, యుద్ధ సందర్భం ద్వారా ‘వ్యతిరేకంగా’ అనే భావాన్ని వ్యక్తం చేశాం.
  alternative: ‘వ్యతిరేకంగా’ లేదా ‘ఎదిరించి’ అని స్పష్టీకరించడం.
  rationale: μετά + షష్ఠీ సాధారణంగా ‘తో’ అని ఉన్నప్పటికీ, ποιῆσαι τὸν πόλεμον సందర్భంలో సంబంధం శత్రుత్వపూర్వకమైనది. అక్షర నిర్మాణం మరియు సందర్భార్థం రెండింటినీ నిలుపేందుకు ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని దీర్ఘ సమన్వయ నిర్మాణాన్ని తెలుగులో సహజంగా ఉండేందుకు రెండు వాక్యాలుగా విభజించాం. ‘వారు’ అనే సర్వనామం రాజులు మరియు సైన్యాలను కలిపి సూచిస్తుంది.
