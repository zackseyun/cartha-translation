review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the throne as the source, the summons to praise, God's slaves/servants, reverent fear of God, and the inclusive 'small and great.' However, 'అప్పుడు' introduces a temporal meaning not expressed by the Greek καί, which is simply connective here. 'వెలువడి' more naturally and precisely conveys ἐξῆλθεν of a voice proceeding from the throne.
  naturalness: The revised wording is natural modern standard Telugu with a suitably elevated biblical register. 'ఒక స్వరం వెలువడి ఇలా పలికింది' is idiomatic and avoids the slightly awkward image of a voice 'setting out' (బయలుదేరి).
  terminology: '''దాసులు'' is a sound main-text rendering of δοῦλοι in this context, retaining belonging and allegiance without unnecessarily importing a modern social framing. ''భయపడేవారు'' properly preserves the biblical idiom of fearing God; the footnote appropriately explains its reverential dimension. ''చిన్నవారూ గొప్పవారూ'' preserves the source''s broad social pairing without overinterpreting it.'
  issues:
  - severity: low
    issue: Unwarranted temporal connective
    rationale: The opening 'అప్పుడు' means 'then,' whereas the Greek begins with connective καί ('and'). It should be omitted in idiomatic Telugu rather than replaced with a temporal sequence marker.
  - severity: low
    issue: Rendering of ἐξῆλθεν
    rationale: For a voice emerging from the throne, 'వెలువడి' is more natural Telugu than 'బయలుదేరి' and better retains the sense of proceeding forth.
  revised_text: 'సింహాసనం నుండి ఒక స్వరం వెలువడి ఇలా పలికింది: “మన దేవుణ్ణి స్తుతించండి—ఆయన దాసులందరూ[a], ఆయనకు భయపడేవారూ[b], చిన్నవారూ గొప్పవారూ!”'
