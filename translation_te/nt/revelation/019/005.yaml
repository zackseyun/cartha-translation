revisions:
- from: 'అప్పుడు సింహాసనం నుండి ఒక స్వరం బయలుదేరి ఇలా అంది: “మన దేవుణ్ణి స్తుతించండి—ఆయన దాసులందరూ[a], ఆయనకు భయపడేవారూ[b], చిన్నవారూ గొప్పవారూ!”'
  to: 'సింహాసనం నుండి ఒక స్వరం వెలువడి ఇలా పలికింది: “మన దేవుణ్ణి స్తుతించండి—ఆయన దాసులందరూ[a], ఆయనకు భయపడేవారూ[b], చిన్నవారూ గొప్పవారూ!”'
  rationale: The revision removes the added temporal implication of 'అప్పుడు' and replaces 'బయలుదేరి' with the more idiomatic and source-sensitive 'వెలువడి.' The command, its addressees, the intentionally broad wording concerning those who fear God, and both footnote anchors are otherwise retained unchanged.
  reviewer_model: gpt-5.6-terra
