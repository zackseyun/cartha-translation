id: REV.19.5
reference: Revelation 19:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his servants, and those who fear him[b], the small and the great.”
translation:
  language: te
  text: 'సింహాసనం నుండి ఒక స్వరం వెలువడి ఇలా పలికింది: “మన దేవుణ్ణి స్తుతించండి—ఆయన దాసులందరూ[a], ఆయనకు భయపడేవారూ[b], చిన్నవారూ గొప్పవారూ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయన బానిసలందరూ” లేదా “ఆయన సేవకులందరూ.” గ్రీకు పదమైన δοῦλοι సందర్భానుసారం దాసులను, బానిసలను లేదా సేవకులను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆయనను భయభక్తులతో గౌరవించేవారు.” ‘ఆయనకు భయపడడం’ అనేది దేవునిపట్ల భయభక్తి, గౌరవం, విధేయతలను సూచించే బైబిలు నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: ఒక స్వరం
  rationale: λέγουσα (‘అంటూ/ఇలా అంది’) అనే పదం వెంట వస్తున్నందున, ఇక్కడ ‘శబ్దం’ కంటే మాట్లాడే ‘స్వరం’ సహజంగా సరిపోతుంది.
- source_word: ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: సింహాసనం నుండి ... బయలుదేరి
  rationale: ἀπό మూలాన్ని సూచిస్తుంది; ἐξέρχομαιలోని బయటకు రావడం అనే భావాన్ని ‘బయలుదేరి’ నిలుపుతుంది. స్వరం సింహాసనం నుండే వచ్చిందనే దృశ్యాన్ని ఇది స్పష్టంగా ఉంచుతుంది.
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: మన దేవుణ్ణి స్తుతించండి
  rationale: బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది; దత్తి విభక్తిలో ఉన్న దేవుడే స్తుతికి కర్మ అని తెలుగు ప్రయోగం స్పష్టం చేస్తుంది.
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: ఆయన దాసులందరూ
  rationale: ‘దాసులు’ అనే పదం సేవతోపాటు యజమానికి చెందినవారనే బలమైన సంబంధాన్ని కూడా మోస్తుంది; ‘సేవకులు’ కంటే δοῦλοι యొక్క అధీనత భావాన్ని మెరుగ్గా నిలుపుతూ, ఆధునిక తెలుగు బైబిలు శైలిలో సహజంగా ఉంటుంది.
- source_word: οἱ φοβούμενοι αὐτόν
  choice: ఆయనకు భయపడేవారూ
  rationale: దేవునిపట్ల భయభక్తి, గౌరవం, విధేయతలతో కూడిన బైబిలు నుడికారాన్ని కేవలం ‘గౌరవించేవారు’గా సన్నగిల్లకుండా నిలుపుతుంది.
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: చిన్నవారూ గొప్పవారూ
  rationale: సామాజిక స్థాయి తక్కువవారినీ ఎక్కువవారినీ కలుపుకునే గ్రీకు జతను సంక్షిప్తంగా, సహజంగా ప్రతిబింబిస్తుంది; దాని రూపక అస్పష్టతను అనవసరంగా వివరణాత్మకం చేయదు.
theological_decisions:
- issue: δοῦλοι అనే పదాన్ని ఆరాధన సందర్భంలో ఎలా అనువదించాలి
  choice: దాసులు
  alternative: సేవకులు / బానిసలు
  rationale: ‘దాసులు’ సేవను మాత్రమే కాక దేవునికి పూర్తిగా చెందినవారనే అధీనత, నిబద్ధత భావాలను కూడా నిలుపుతుంది. ‘బానిసలు’ ఆ భావాన్ని మరింత కఠినంగా తెలియజేసినా తెలుగులో అనవసరమైన సామాజిక అపార్థాన్ని కలిగించవచ్చు; అందువల్ల దాన్ని పాదసూచికలో ఉంచాం.
- issue: దేవునికి భయపడడం అనే నుడికారం
  choice: ఆయనకు భయపడేవారు
  alternative: ఆయనను భయభక్తులతో గౌరవించేవారు
  rationale: మూలంలోని భయం, విస్మయం, గౌరవం, విధేయతల మధ్య ఉన్న ఉద్దేశపూర్వక భావవిస్తృతిని ప్రధాన పాఠంలో నిలుపుతుంది; వివరణాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: οἱ μικροὶ καὶ οἱ μεγάλοι ఎవరిని విశేషిస్తుంది
  choice: ఆయనకు భయపడేవారూ, చిన్నవారూ గొప్పవారూ
  alternative: ఆయనకు భయపడే చిన్నవారూ గొప్పవారూ
  rationale: గ్రీకు క్రమాన్ని నిలుపుతూ, చివరి పదబంధాన్ని ముందున్న దేవభయంగలవారిని మరింత వివరించే సమాసంగా చదివే అవకాశాన్నీ, పిలుపు పరిధిని విస్తరించే పదబంధంగా వినిపించే అవకాశాన్నీ పూర్తిగా మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఇలా అంది’ మాట్లాడే స్వరానికి సహజమైన తెలుగు నిర్మాణం; దీర్ఘ వాక్యంలో పిలుపును స్పష్టంగా వినిపించేందుకు డ్యాష్ ఉపయోగించబడింది. ‘దాసులు’, ‘భయపడేవారు’ వంటి బైబిలు భావభారం గల పదాలను అతి వివరణ లేకుండా ప్రధాన పాఠంలో నిలిపాం.
