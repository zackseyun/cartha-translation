id: REV.19.10
reference: Revelation 19:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: te
  text: అప్పుడు నేను అతనిని ఆరాధించడానికి అతని పాదాల ఎదుట పడ్డాను. అయితే అతడు నాతో, “అలా చేయవద్దు! నేను నీతోను, యేసు సాక్ష్యాన్ని కలిగివున్న నీ సహోదరులకును[a] తోటి దాసుడను. దేవుణ్ణి ఆరాధించు. ఎందుకంటే యేసు సాక్ష్యమే ప్రవచన ఆత్మ.”[b] అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరులు’ అనే మాట ఇక్కడ తోటి విశ్వాసులైన సహోదర సహోదరీలను సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘యేసు సాక్ష్యం’ అంటే ‘యేసును గురించిన సాక్ష్యం’ లేదా ‘యేసు ఇచ్చిన సాక్ష్యం’ కావచ్చు. ఈ అస్పష్టత ఈ వాక్యంలోని రెండు సందర్భాలకూ వర్తిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: అతని పాదాల ఎదుట పడ్డాను
  rationale: ἔμπροσθεν అనే ‘ఎదుట/ముందు’ భావాన్ని, ఆరాధనకు సంబంధించిన శారీరక భంగిమను రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: προσκυνῆσαι αὐτῷ / προσκύνησον
  choice: అతనిని ఆరాధించడానికి / దేవుణ్ణే ఆరాధించు
  rationale: దూత ఆ చర్యను నిరాకరించి దానిని దేవునివైపు మళ్లిస్తున్నందున, కేవలం ‘నమస్కరించు’ కంటే మతపరమైన బలాన్ని స్పష్టంగా తెలిపే ‘ఆరాధించు’ తగినది. ‘దేవుణ్ణే’లోని ఏకారార్థం వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ὅρα μή
  choice: అలా చేయవద్దు!
  rationale: గ్రీకు మాటలోని ఆకస్మికమైన, బలమైన నిషేధాన్ని ఆధునిక సహజ తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: σύνδουλός
  choice: నీతోపాటు ... దాసుడినే
  rationale: σύνδουλος సూచించే ఒకే యజమాని కింద సహదాసత్వాన్ని ‘తోటి సేవకుడు’ కంటే స్పష్టంగా ఉంచుతుంది; తెలుగు వాక్యనిర్మాణంలో ‘నీతోపాటు ... దాసుడినే’ సహజంగా ఉంది.
- source_word: ἀδελφῶν σου
  choice: నీ సహోదరులు
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని నిలుపుతుంది; సందర్భంలో ఇది తోటి విశ్వాసులను సమష్టిగా సూచించవచ్చని పాదసూచిక వివరిస్తుంది.
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: యేసు సాక్ష్యాన్ని కలిగివున్న
  rationale: ἔχω యొక్క ‘కలిగివుండు’ భావాన్ని అతిగా వ్యాఖ్యానించకుండా అందిస్తుంది; Ἰησοῦ సంబంధంలోని అస్పష్టతను ‘యేసు సాక్ష్యం’ నిలుపుతుంది.
- source_word: μαρτυρία Ἰησοῦ
  choice: యేసు సాక్ష్యం
  rationale: ఇది ‘యేసును గురించిన సాక్ష్యం’ లేదా ‘యేసు ఇచ్చిన సాక్ష్యం’ అనే రెండింటిలో ఏదో ఒకదానిగా నిర్ణయించకుండా గ్రీకు షష్ఠీ విభక్తి అస్పష్టతను కాపాడుతుంది.
- source_word: πνεῦμα τῆς προφητείας
  choice: ప్రవచన స్ఫూర్తి
  rationale: తెలుగులో ‘ప్రవచన ఆత్మ’ అనేది పరిశుద్ధాత్మను తప్పనిసరిగా సూచిస్తున్నట్లు వినిపించే అవకాశం ఉంది. ‘స్ఫూర్తి’ πνεῦμα యొక్క ప్రేరేపక/అంతర్భూత శక్తి భావాన్ని సహజంగా ఇస్తూనే, పాదసూచికలో మరింత రూపానుగత ప్రత్యామ్నాయాన్ని ఉంచుతుంది.
theological_decisions:
- issue: ‘యేసు సాక్ష్యం’లోని షష్ఠీ విభక్తి అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘యేసు సాక్ష్యం’ అనే అస్పష్ట రూపాన్ని ఉంచడం
  alternative: ‘యేసును గురించిన సాక్ష్యం’ లేదా ‘యేసు ఇచ్చిన సాక్ష్యం’
  rationale: Ἰησοῦ అనేది విషయార్థక షష్ఠీగా గానీ కర్తార్థక షష్ఠీగా గానీ అర్థమవుతుంది. మూలం నిర్ణయించని చోట అనువాదం ఒకే వ్యాఖ్యానాన్ని బలవంతంగా నిర్ణయించకూడదు.
- issue: σύνδουλοςలోని అధీనత భావం
  choice: ‘నీతోపాటు ... దాసుడినే’
  alternative: ‘నీ తోటి సేవకుణ్ణి’
  rationale: దూత కూడా యోహాను, ఇతర విశ్వాసులవలె దేవుని కింద ఉన్నవాడేనని చెప్పడం ఈ వాక్యంలోని ఆరాధన వ్యత్యాసానికి ముఖ్యమైనది; అందువల్ల సహదాసత్వం, అధీనత రెండూ నిలుపబడ్డాయి.
- issue: πνεῦμα τῆς προφητείας యొక్క భావం
  choice: ‘ప్రవచన స్ఫూర్తి’
  alternative: ‘ప్రవచన ఆత్మ’ లేదా ‘ప్రవచన సారాంశం’
  rationale: πνεῦμαను కేవలం ‘సారాంశం’గా కుదించలేదు; అదే సమయంలో తెలుగు ‘ఆత్మ’ వల్ల పరిశుద్ధాత్మ అనే నిర్బంధిత వ్యాఖ్యానం కలగకుండా ‘స్ఫూర్తి’ని ప్రధాన పాఠ్యంలో ఎంచుకుని, రూపానుగత పఠనాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. మూలంలోని ఆకస్మిక నిషేధం, ఆరాధన వ్యత్యాసం, సహదాసత్వం, ‘యేసు సాక్ష్యం’లోని నిజమైన అస్పష్టత నిలుపబడ్డాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
