source:
  edition: SBLGNT
  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: te
  text: పరలోకంలో ఉన్న సైన్యాలు[a] తెల్లని గుర్రాలపై ఆయనను అనుసరిస్తూ ఉండేవి; అవి తెల్లగా, శుభ్రంగా ఉన్న సన్నని నారవస్త్రాలు ధరించి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోక సైన్యాలు.’ గ్రీకు పదబంధానికి అక్షరార్థం, ‘సైన్యాలు, పరలోకంలో ఉన్నవి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύματα
  choice: సైన్యాలు
  rationale: ఈ బహువచన నామవాచకం వ్యవస్థీకృత సైనిక దళాలను సూచిస్తుంది; దర్శనంలోని యుద్ధ సందర్భంలో ‘సైన్యాలు’ సహజమైన, ప్రత్యక్షమైన తెలుగు సమానం.
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: పరలోకంలో ఉన్న
  rationale: ఈ పదబంధం సైన్యాలు ఉన్న స్థలాన్ని సూచిస్తుంది. ‘పరలోకంలో ఉన్న’ అనేది దాని స్థానార్థాన్ని స్పష్టంగా ఉంచుతుంది; వాటి గుర్తింపును అదనంగా నిర్వచించదు.
- source_word: ἠκολούθει αὐτῷ
  choice: ఆయనను అనుసరిస్తూ ఉన్నాయి
  rationale: అసంపూర్ణ భూతకాల క్రియ దర్శనంలో కొనసాగుతున్న చర్యను చూపుతుంది; ఈ రూపం ఆ ప్రగతిశీల భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: తెల్లని గుర్రాలపై
  rationale: ఈ పదబంధం వారు గుర్రాలపై స్వారీ చేస్తూ అనుసరిస్తున్నారని సూచిస్తుంది; రంగు సూచనను యథాతథంగా నిలుపుతుంది.
- source_word: ἐνδεδυμένοι
  choice: ధరించి ఉన్నారు
  rationale: ఈ కృదంతం వారు ఆ వస్త్రాలను ధరించిన స్థితిని వర్ణిస్తుంది; ఆధునిక తెలుగులో ‘ధరించి ఉన్నారు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: βύσσινον
  choice: సన్నని నారబట్టలు
  rationale: ఈ పదం నాణ్యమైన, మెత్తని నారవస్త్రాన్ని సూచిస్తుంది. ‘సన్నని నారబట్టలు’ దాని పదార్థాన్నీ నాణ్యతనూ సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: λευκὸν καθαρόν
  choice: తెల్లగా, శుభ్రంగా ఉన్న
  rationale: రెండు విశేషణాలనూ విడిగా నిలుపుతూ, దృశ్య తెలుపును మరియు మలినరాహిత్యాన్ని తెలియజేస్తుంది; ‘పవిత్రమైన’ అని వేదాంతపరంగా విస్తరించదు.
theological_decisions:
- issue: పరలోక సైన్యాల గుర్తింపు
  choice: ‘పరలోకంలో ఉన్న సైన్యాలు’ అని వర్ణనాత్మకంగా అనువదించడం
  alternative: ‘పరలోక సైన్యాలు’ లేదా వీరిని దేవదూతలు/మహిమపరచబడిన పరిశుద్ధులు అని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠం ఈ సైన్యాల స్థానాన్నీ వస్త్రధారణనూ తెలుపుతుంది గాని, వారు దేవదూతలా, పరిశుద్ధులా, లేక ఇద్దరూ కలిసినా అని ఈ వచనంలో నిర్దిష్టంగా చెప్పదు. అనువాదం ఆ సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన దర్శన-వర్ణనా శైలి. కొనసాగుతున్న చర్యను నిలుపుతూ, సైన్యాల గుర్తింపుపై మూలపాఠంలోని నిర్దిష్టతలేమిని కాపాడింది.
