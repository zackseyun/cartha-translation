  to: పరలోకంలో ఉన్న సైన్యాలు[a] తెల్లని గుర్రాలపై ఆయనను అనుసరిస్తూ ఉండేవి; అవి తెల్లగా, శుభ్రంగా ఉన్న సన్నని నారవస్త్రాలు ధరించి ఉన్నాయి.
