id: REV.19.15
reference: Revelation 19:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: te
  text: ఆయన నోటి నుండి పదునైన ఖడ్గం బయలుదేరుతుంది, దానితో ఆయన జనాంగాలను కొట్టడానికి. ఆయనే వారిని ఇనుప దండంతో కాపరిగా కాస్తాడు[a]; ఆయనే సర్వశక్తిమంతుడైన దేవుని ఉగ్రావేశపు కోపమనే ద్రాక్షారసపు గానుగను తొక్కుతున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కాపరిగా కాస్తాడు’ అని అనువదించిన గ్రీకు క్రియకు సందర్భానుసారంగా ‘పాలిస్తాడు’ అనే భావమూ ఉంటుంది; అయితే దాని అక్షరార్థం కాపరి చేసే కార్యాన్ని సూచిస్తుంది. ఇది కీర్తన 2లోని రాజాధికార దృశ్యాన్ని ప్రతిధ్వనింపజేస్తుంది.
    reason: alternative_reading
  - marker: b
    text: మూలపాఠంలో ‘దేవుని ఉగ్రావేశపు కోపమనే ద్రాక్షారసం’ అనే గాఢమైన వరుస రూపకం ఉంది; ‘ఉగ్రావేశం’ మరియు ‘కోపం’కు రెండు వేర్వేరు గ్రీకు పదాలు వాడబడ్డాయి.
    reason: rhetorical_clarity
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: బయలుదేరుతుంది
  rationale: నోటిలోనుండి ఖడ్గం వెలువడుతున్న సజీవ వర్తమాన దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ῥομφαία ὀξεῖα
  choice: పదునైన ఖడ్గం
  rationale: ῥομφαία పెద్ద ఖడ్గాన్ని సూచించినా, ఆయుధ రకాన్ని అతిగా నిర్దిష్టపరచకుండా సాధారణ పాఠకునికి స్పష్టమైన ‘ఖడ్గం’ను ఎంచుకున్నాం; ὀξεῖα నేరుగా ‘పదునైన’గా నిలిచింది.
- source_word: ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη
  choice: ఆయన జనాంగాలను దానితో కొట్టేందుకే
  rationale: ἵνα యొక్క ఉద్దేశ భావాన్ని, ἐν αὐτῇ యొక్క సాధనార్థాన్ని నిలుపుతుంది. πατάξῃలో లేని ‘పడగొట్టడం’ అనే అదనపు ఫలితాన్ని చేర్చకుండా ‘కొట్టడం’ వాడాం.
- source_word: τὰ ἔθνη
  choice: జనాంగాలు
  rationale: యూదేతరులను మాత్రమే సూచించేలా పరిమితం చేయకుండా సమస్త nations/peoples అనే సామూహిక భావాన్ని తెలియజేస్తుంది.
- source_word: ποιμανεῖ
  choice: కాపరిగా నడిపిస్తాడు
  rationale: కేవలం ‘పాలిస్తాడు’ అని చేసి కాపరి రూపకాన్ని తొలగించకుండా, ఆధునిక తెలుగులో మనుషుల విషయంగా సహజంగా అర్థమయ్యే విధంగా కాపరి భావాన్ని నిలిపాం.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: ఇనుప దండంతో
  rationale: ἐν యొక్క సాధనార్థాన్ని ‘తో’ ద్వారా, ῥάβδος యొక్క అధికారమూ శిక్షా సూచనలూ కలిగిన భావాన్ని ‘దండం’ ద్వారా తెలియజేస్తుంది.
- source_word: πατεῖ τὴν ληνὸν
  choice: ద్రాక్షారసపు గానుగను తొక్కుతున్నాడు
  rationale: ద్రాక్ష గానుగలో తొక్కే ప్రవచనాత్మక తీర్పు దృశ్యాన్ని నిలుపుతూ, గ్రీకు వర్తమాన కాలపు సజీవతను ‘తొక్కుతున్నాడు’గా వ్యక్తం చేస్తుంది.
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: కోపపు ఉగ్రావేశమనే ద్రాక్షారసపు
  rationale: θυμός మరియు ὀργή అనే పరస్పరం సమీపార్థకమైన రెండు పదాల తీవ్రతను ఒకే పదంగా పూర్తిగా కుదించకుండా ‘కోపపు ఉగ్రావేశం’గా నిలుపుతుంది; దానిని ద్రాక్షారసంతో సమీకరించే రూపకమూ స్పష్టంగా ఉంటుంది.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: సర్వశక్తిమంతుడైన దేవుని
  rationale: παντοκράτωρ అనే దైవ బిరుదును సహజమైన, గౌరవప్రదమైన తెలుగు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: తీర్పు సందర్భంలో ποιμανεῖ అనే కాపరి క్రియ
  choice: కాపరిగా నడిపిస్తాడు
  alternative: పాలిస్తాడు
  rationale: కీర్తన 2ను ప్రతిధ్వనించే రాజాధికార భావం ఉన్నప్పటికీ, మూలపాఠం ఉద్దేశపూర్వకంగా కాపరి రూపకాన్నే వాడుతుంది. అందువల్ల కాపరి సంరక్షణ మరియు ఇనుప దండపు న్యాయాధికారం మధ్యనున్న ఉద్వేగాన్ని ప్రధాన పాఠంలో నిలిపాం.
- issue: θυμοῦ τῆς ὀργῆςలోని ద్విగుణిత కోప వ్యక్తీకరణ
  choice: కోపపు ఉగ్రావేశం
  alternative: తీవ్రమైన కోపం
  rationale: రెండు సమీపార్థక గ్రీకు పదాలను ఒకే విశేషణ-నామవాచకంగా పూర్తిగా సమతలపరచకుండా, దేవుని తీర్పు తీవ్రతను వ్యక్తం చేసే ద్వంద్వ బలాన్ని సాధ్యమైనంత సహజంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రకటన-శైలిని వాడాం. ‘ఆయనే’ అనే పునరుక్తి గ్రీకులోని emphatic αὐτόςను నిలుపుతుంది. మొదటి ఉద్దేశ వాక్యాన్ని తెలుగులో సహజంగా ఉండేందుకు ముందుకు తెచ్చాం; చివరి క్రియలో వర్తమాన దృశ్య సజీవతను నిలిపాం.
