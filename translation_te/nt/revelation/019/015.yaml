revisions:
- from: ఆయన జనాంగాలను దానితో కొట్టేందుకే, ఆయన నోటిలోనుండి పదునైన ఖడ్గం బయలుదేరుతుంది. ఆయనే వారిని ఇనుప దండంతో కాపరిగా నడిపిస్తాడు[a]; ఆయనే సర్వశక్తిమంతుడైన దేవుని కోపపు ఉగ్రావేశమనే ద్రాక్షారసపు గానుగను తొక్కుతున్నాడు.[b]
  to: ఆయన నోటి నుండి పదునైన ఖడ్గం బయలుదేరుతుంది, దానితో ఆయన జనాంగాలను కొట్టడానికి. ఆయనే వారిని ఇనుప దండంతో కాపరిగా కాస్తాడు[a]; ఆయనే సర్వశక్తిమంతుడైన దేవుని ఉగ్రావేశపు కోపమనే ద్రాక్షారసపు గానుగను తొక్కుతున్నాడు.[b]
  rationale: సవరణ ప్రధానంగా తెలుగులో వాక్యనిర్మాణం మరియు సూచనాస్పష్టత కోసం చేయబడింది. ఖడ్గం నోటి నుండి బయలుదేరడం, దానితో జనాంగాలను కొట్టడం అనే ఉద్దేశం, కాపరి రూపకంతో కూడిన ఇనుప దండపు పాలన, మరియు దేవుని ఉగ్రావేశపు కోపపు ద్రాక్షారస గానుగ అనే తీర్పు రూపకం అన్నీ మూలపాఠానికి అనుగుణంగా నిలిచాయి. పాదటిప్పణుల గుర్తులు సంబంధిత పదబంధాలకే జతచేయబడ్డాయి.
