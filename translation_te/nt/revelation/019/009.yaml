id: REV.19.9
reference: Revelation 19:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: te
  text: 'అతడు నాతో ఇలా అన్నాడు: “రాయి: గొర్రెపిల్ల వివాహ విందుకు ఆహ్వానించబడినవారు[a] ధన్యులు.” అతడు నాతో ఇలా అన్నాడు: “దేవుని ఈ మాటలు సత్యమైనవి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గొర్రెపిల్ల వివాహ విందుకు పిలువబడినవారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నమ్మదగిన”; ఈ మాటలు నిజంగా దేవునివని, వాటిని నమ్మవచ్చని ఈ పదం తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γράψον
  choice: రాయి
  rationale: γράφω క్రియ యొక్క ఏకవచన ఆజ్ఞార్థక రూపాన్ని అదనపు భావం చేర్చకుండా నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: Μακάριοι
  choice: ధన్యులు
  rationale: ప్రకటన గ్రంథంలోని ధన్యతా ప్రకటనల గంభీరమైన, దైవశాస్త్ర సంబంధమైన భావాన్ని కాపాడే స్థిరమైన తెలుగు పదం.
- source_word: οἱ εἰς τὸ δεῖπνον ... κεκλημένοι
  choice: విందుకు ఆహ్వానించబడినవారు
  rationale: κεκλημένοι అనేది ఆహ్వానించబడి ఆ స్థితిలో ఉన్నవారిని సూచించే పరిపూర్ణ కర్మణి అసమాపక క్రియారూపం. భోజన సందర్భంలో ‘ఆహ్వానించబడినవారు’ సహజమైన తెలుగు; మరింత అక్షరార్థమైన ‘పిలువబడినవారు’ను పాదసూచికలో ఉంచాం.
- source_word: δεῖπνον
  choice: విందు
  rationale: ఇక్కడ సాధారణ భోజనం కంటే వేడుక సందర్భంలోని ప్రధాన భోజనాన్ని సూచిస్తుంది; ‘విందు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: γάμου
  choice: వివాహ
  rationale: γάμος వివాహాన్ని లేదా వివాహ వేడుకను సూచించగలదు. δεῖπνονను విశేషిస్తున్నందున ‘వివాహ విందు’ సహజంగాను మూలానికి సమీపంగాను ఉంది.
- source_word: τοῦ ἀρνίου
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలో ἀρνίονకు ఉన్న కీలకమైన క్రీస్తు సంబంధ ప్రతీకాత్మక బిరుదును స్థిరంగా నిలుపుతుంది.
- source_word: Οὗτοι οἱ λόγοι
  choice: ఇవి ... మాటలు
  rationale: సూచక సర్వనామం మరియు నామవాచకంతో ఉన్న గ్రీకు నిర్మాణాన్ని తెలుగులో సహజమైన నామవాక్యంగా అందిస్తుంది.
- source_word: ἀληθινοὶ
  choice: సత్యమైన
  rationale: ఈ మాటల నిజత్వాన్ని నేరుగా తెలియజేస్తుంది; ‘నమ్మదగిన’ అనే భావసాధ్యాన్ని పాదసూచికలో కాపాడాం.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తిని నేరుగా ప్రతిబింబిస్తుంది; ‘దేవుని నుండి వచ్చిన’ అని మూలం కంటే స్పష్టీకరించదు.
theological_decisions:
- issue: అంత్యకాల రక్షణ విందు సందర్భంలో κεκλημένοι అనువాదం
  choice: ఆహ్వానించబడినవారు
  alternative: పిలువబడినవారు
  rationale: భోజనానికి పిలిచే సందర్భంలో ‘ఆహ్వానించబడినవారు’ ఆధునిక తెలుగులో ఉద్దేశించిన ప్రయోగార్థాన్ని స్పష్టంగా ఇస్తుంది; అదే సమయంలో విస్తృతమైన దైవశాస్త్ర ‘పిలుపు’ భావాన్ని అనువాదంలో బలవంతంగా నిర్ణయించకుండా అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడుతుంది.
- issue: δεῖπνον τοῦ γάμουలో γάμου అనువాదం
  choice: వివాహ విందు
  alternative: పెండ్లి విందు
  rationale: ‘వివాహ విందు’ ఆధునిక ప్రామాణిక తెలుగులో గంభీరంగా, సహజంగా ఉండి వివాహ వేడుక భోజన చిత్రాన్ని కాపాడుతుంది; ‘పెండ్లి’ ప్రాంతీయ/వ్యావహారిక వైవిధ్యం కలిగిన రూపం కావడంతో ప్రధాన పాఠ్యంలో ఎంచుకోలేదు.
- issue: ἀληθινοὶ యొక్క భావవ్యాప్తి
  choice: సత్యమైన
  alternative: నమ్మదగిన
  rationale: ‘సత్యమైన’ మూలపదానికి అత్యంత నేరమైన అనువాదం. సందర్భంలో ఈ మాటలు నమ్మదగినవని కూడా భావం ఉండవచ్చు; దాన్ని పాదసూచికలో సూచించడం ద్వారా నిజత్వం మరియు విశ్వసనీయత మధ్యనున్న భావవ్యాప్తిని నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ప్రకటనాత్మక శైలిని వాడాం. పునరుక్త λέγει μοιను రెండుసార్లూ ప్రతిబింబిస్తూ, రెండవ సందర్భంలో సహజ ప్రవాహం కోసం ‘మళ్లీ’ చేర్చాం. మూలంలోని వర్తమాన కథనరూపాన్ని తెలుగులో సహజ కథన ప్రయోగమైన ‘అన్నాడు’గా అందించాం.
