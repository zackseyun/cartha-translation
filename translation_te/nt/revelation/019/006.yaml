id: REV.19.6
reference: Revelation 19:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: te
  text: 'నేను ఒక గొప్ప జనసమూహపు స్వరంలా, అనేక జలాల ఘోషలా, బలమైన ఉరుముల మోతలా ఉన్న ఒక స్వరాన్ని విన్నాను. అది ఇలా చెబుతోంది: “హల్లెలూయా! ఎందుకంటే ప్రభువైన దేవుడు, సర్వశక్తిమంతుడు[a], రాజ్యమేలుతున్నాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “ప్రభువైన మన దేవుడు, సర్వశక్తిమంతుడు” అని ఉంది. ఇక్కడ అనుసరించిన ముద్రిత గ్రీకు పాఠం అక్షరార్థంగా “ప్రభువు, దేవుడు, సర్వశక్తిమంతుడు” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: దీనిని “రాజ్యమేలాడు,” “రాజ్యమేలడం ప్రారంభించాడు,” లేదా “రాజయ్యాడు” అని కూడా అనువదించవచ్చు. ఈ గ్రీకు క్రియ దేవుని రాజ్యపాలన నిర్ణాయకంగా ప్రత్యక్షమైనందుకు చేసే స్తోత్రంగా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: నేను విన్నాను
  rationale: ἀκούω క్రియ యొక్క భూతకాల కథనరూపాన్ని సహజమైన తెలుగు కథనశైలిలో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ὡς
  choice: …లా / …లా ఉన్న
  rationale: మూడుసార్లు వచ్చిన ὡς పోలికను సూచిస్తుంది; దర్శనంలోని ధ్వని నిజంగా ఆ వస్తువులే అని కాక, వాటివలె వినిపించిందనే భావాన్ని నిలుపుతుంది.
- source_word: φωνὴν
  choice: స్వరం
  rationale: φωνήకు ‘స్వరం’ లేదా ‘ధ్వని’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ అది మాటలు పలుకుతోంది కాబట్టి ‘స్వరం’ ప్రధానంగా సరిపోతుంది; తరువాతి పోలికల్లో ఘోష, మోత అనే సహజ తెలుగు పదాలు వాడబడ్డాయి.
- source_word: ὄχλου πολλοῦ
  choice: ఒక గొప్ప జనసమూహం
  rationale: అసంఖ్యాకంగా కూడిన ప్రజల సమూహాన్ని తెలిపే ప్రకటన గ్రంథపు గంభీర దృశ్యాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ὑδάτων πολλῶν
  choice: అనేక జలాల ఘోష
  rationale: ‘అనేక జలాలు’ అనే బైబిలు ప్రతిమను నిలుపుతూ, ఇక్కడ ఉద్దేశించిన శక్తిమంతమైన వినికిడి అనుభూతిని ‘ఘోష’ స్పష్టం చేస్తుంది.
- source_word: βροντῶν ἰσχυρῶν
  choice: బలమైన ఉరుముల మోత
  rationale: ἰσχυρός తెలిపే శక్తిని ‘బలమైన’గా, ఉరుముల వినికిడి ప్రభావాన్ని ‘మోత’గా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λεγόντων
  choice: ఇలా చెబుతున్నట్టు
  rationale: ఈ వర్తమాన కృదంతం తరువాత వచ్చే స్తోత్రవాక్యాన్ని పరిచయం చేస్తుంది; పోలికతో కూడిన దర్శనశైలిని ‘చెబుతున్నట్టు’ నిలుపుతుంది.
- source_word: Ἁλληλουϊά
  choice: హల్లెలూయా
  rationale: కొత్త నిబంధనలోని స్థిరమైన ఆరాధనా ఉద్ఘోషను అనువదించకుండా, తెలుగులో ప్రాచుర్యం పొందిన లిప్యంతరీకరణగా ఉంచుతుంది.
- source_word: ὅτι
  choice: (ఉద్ఘోష తరువాతి కారణవాక్యంగా)
  rationale: తెలుగులో ప్రత్యేకంగా ‘ఎందుకంటే’ చేర్చడం ఇక్కడ భారంగా ఉంటుంది; వాక్యక్రమమే హల్లెలూయాకు కారణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐβασίλευσεν
  choice: రాజ్యమేలుతున్నాడు
  rationale: దేవుని రాజ్యాధికారం విజయవంతంగా ప్రత్యక్షమవుతున్న సందర్భాన్ని సహజ తెలుగులో తెలియజేస్తుంది; గ్రీకు అఒరిస్టుకు సాధ్యమైన ఇతర కాలాంశాలను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: సర్వశక్తిమంతుడైన ప్రభువైన దేవుడు
  rationale: ముద్రిత గ్రీకు పాఠంలోని మూడు దైవపదవులను ఏదీ వదలకుండా, తెలుగులో సహజమైన విశేషణ క్రమంలో అందిస్తుంది; మూలంలో లేని ‘మన’ అనే స్వామ్యపదాన్ని ప్రధాన పాఠంలో చేర్చదు.
theological_decisions:
- issue: ἐβασίλευσεν అనే అఒరిస్టు క్రియ దేవుని రాజ్యపాలనతో ఉన్న సంబంధం
  choice: రాజ్యమేలుతున్నాడు
  alternative: రాజ్యమేలాడు / రాజుగా పాలించడం ప్రారంభించాడు / రాజయ్యాడు
  rationale: సందర్భం దేవుని సార్వభౌమత్వం అప్పుడే ఉనికిలోకి వచ్చిందని తేల్చడం కంటే, ఆయన రాజ్యపాలన నిర్ణాయకంగా ప్రత్యక్షమైనందుకు చేసే స్తోత్రం. ప్రధాన పాఠం సహజమైన ప్రస్తుత పాలనను చెబుతుంది; కాలాంశంలోని నిజమైన విస్తృతిని పాదటిప్పణి కాపాడుతుంది.
- issue: θεός సమీపంలోని స్వామ్యపదానికి సంబంధించిన పాఠాంతరం
  choice: ప్రభువైన దేవుడు
  alternative: ప్రభువైన మన దేవుడు
  rationale: ఇచ్చిన SBLGNT పాఠంలో ἡμῶν (‘మన’) లేదు. అందువల్ల మూలపాఠ ప్రాధాన్యంతో ప్రధాన పాఠంలో దానిని చేర్చకుండా, ముఖ్యమైన పాఠాంతరాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రకటన గ్రంథపు గంభీరమైన ఆరాధనా ధోరణి మరియు వరుస శ్రవణ పోలికలు నిలిచేలా రూపొందించబడింది. ‘జలాలు,’ ‘హల్లెలూయా,’ ‘సర్వశక్తిమంతుడు’ వంటి బైబిలు-ఆరాధనా పదాలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
