id: REV.19.17
reference: Revelation 19:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: te
  text: 'సూర్యునిలో నిలబడి ఉన్న ఒక దేవదూతను నేను చూశాను. అతడు ఆకాశమధ్యంలో[a] ఎగురుతున్న పక్షులన్నిటికీ బిగ్గరగా ఇలా కేకవేశాడు: “రండి, దేవుని మహా విందుకు సమకూడండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆకాశం నడిమధ్యలో’ లేదా ‘నడినింగిలో’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం μεσουράνημα; ఇది ప్రకటన గ్రంథంలో ప్రత్యేకంగా కనిపించే అపోకలిప్టిక్ పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: ఒక దేవదూతను
  rationale: గ్రీకులోని ἕναను విస్మరించకుండా, తెలుగులో సహజంగా ‘ఒక దేవదూతను’ అని అనువదించాం. ‘ఒక్క దేవదూతను’ అంటే సందర్భంలో లేని ప్రత్యేక ఉద్ఘాటన కలగవచ్చు.
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: సూర్యునిలో నిలబడి ఉన్న
  rationale: ἐν అనే విభక్తి సూచించే ‘లో’ భావాన్ని, ప్రకటన గ్రంథానికి ప్రత్యేకమైన ఆశ్చర్యకర దృశ్యాన్ని సవరించకుండా యథాతథంగా నిలిపాం.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: పెద్ద స్వరంతో ఇలా కేకవేశాడు
  rationale: κράζωలోని బలమైన పిలుపును ‘కేకవేశాడు’ తెలియజేస్తుంది; φωνῇ μεγάλῃను ‘పెద్ద స్వరంతో’ అని స్పష్టంగా ఉంచాం.
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: పక్షులన్నిటికీ
  rationale: ὄρνεον సాధారణంగా ‘పక్షి’ అని అర్థం. తరువాతి సందర్భం మాంసాహార పక్షులను సూచించినా, ఆ భావాన్ని ఈ పదంలోనే చేర్చలేదు.
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: ఆకాశమధ్యంలో ఎగురుతున్న
  rationale: μεσουράνημα ఆకాశపు మధ్య లేదా అత్యున్నత ప్రాంతాన్ని సూచించే ప్రకటన గ్రంథపు విలక్షణ పదం. ‘ఆకాశమధ్యంలో’ ఆ దృశ్యరూపాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: Δεῦτε
  choice: రండి
  rationale: నేరుగా ఇచ్చిన పిలుపును సహజమైన తెలుగు ఆజ్ఞారూపంలో అనువదించాం.
- source_word: συνάχθητε
  choice: సమకూడండి
  rationale: కలిసి ఒకచోట చేరాలనే ఆజ్ఞను ‘సమకూడండి’ సహజంగా, గంభీరంగా తెలియజేస్తుంది; గ్రీకు రూపంలోని మధ్యమ/కర్మణి స్వరానికి ఉన్న అనిశ్చితిని అతిగా వివరించదు.
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: దేవుని మహా విందుకు
  rationale: δεῖπνον ప్రధాన భోజనాన్ని సూచిస్తుంది. ‘విందు’ సందర్భంలోని ఘనమైన భోజన దృశ్యానికి సరిపోతూ, వివాహ విందుతో ఉన్న సాహిత్య సంబంధాన్ని కూడా నిలుపుతుంది; τοῦ θεοῦను ‘దేవుని’గా ఉంచాం.
theological_decisions:
- issue: ప్రకటనాత్మక స్థల దృశ్యాన్ని అనువదించడం
  choice: సూర్యునిలో నిలబడి ఉన్న
  alternative: సూర్యుని ఎదుట నిలబడి ఉన్న
  rationale: ἐν τῷ ἡλίῳను ‘సూర్యునిలో’ అని నేరుగా అనువదించడం మూలంలోని ఉద్దేశపూర్వకంగా ఆశ్చర్యపరిచే దృశ్యాన్ని కాపాడుతుంది. దాన్ని ‘సూర్యుని ఎదుట’గా మార్చి అర్థాన్ని సులభతరం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. ప్రకటన గ్రంథపు అసాధారణ దృశ్యరూపాలు మృదువుగా మార్చబడలేదు. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘ఆకాశమధ్యంలో’ అనే పదం దగ్గర ఉంచాం.
