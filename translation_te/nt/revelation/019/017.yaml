- from: 'సూర్యునిలో నిలబడి ఉన్న ఒక దేవదూతను నేను చూశాను. అతడు ఆకాశమధ్యంలో[a] ఎగురుతున్న పక్షులన్నిటికీ పెద్ద స్వరంతో ఇలా కేకవేశాడు: “రండి, దేవుని మహా విందుకు సమకూడండి.”'
