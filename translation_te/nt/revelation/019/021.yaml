id: REV.19.21
reference: Revelation 19:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: te
  text: గుర్రంపై కూర్చున్నవాని నోటి నుండి వెలువడిన ఖడ్గంతో[b] మిగిలినవారు చంపబడ్డారు[a]; పక్షులన్నీ వారి మాంసంతో తృప్తి చెందాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వధించబడ్డారు.’
    reason: lexical_alternative
  - marker: b
    text: నోటి నుండి వెలువడే ‘ఖడ్గం’ అపోకలిప్టిక్ చిత్రణ. ప్రకటన 19:15 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: మిగిలినవారు
  rationale: మునుపటి సందర్భంలో మృగం, అబద్ధ ప్రవక్త తొలగించబడిన తర్వాత ఇంకా మిగిలినవారిని సూచించే సహజమైన సమూహవాచక ప్రయోగం.
- source_word: ἀπεκτάνθησαν
  choice: చంపబడ్డారు
  rationale: ἀποκτείνω క్రియ యొక్క భూతకాల కర్మణి రూపాన్ని స్పష్టమైన ఆధునిక తెలుగులో కర్మణి ప్రయోగంగానే నిలుపుతుంది.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: ఖడ్గంతో
  rationale: ἐν + చతుర్థీ విభక్తి ఇక్కడ సాధనార్థకంగా ఉంది. ప్రకటన గ్రంథంలో పునరావృతమయ్యే పెద్ద ఖడ్గం అనే స్పష్టమైన ప్రతిమను ‘ఖడ్గంతో’ నిలుపుతుంది.
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: గుర్రం మీద కూర్చున్నవాని
  rationale: గ్రీకు కృదంత నిర్మాణాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో పారదర్శకంగా అందిస్తుంది.
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: నోటినుండి వెలువడిన
  rationale: ఖడ్గాన్ని విశేషించే కృదంతాన్ని నిలుపుతూ, అపోకలిప్టిక్ దృశ్యాన్ని వ్యాఖ్యానించి పరిష్కరించకుండా యథాతథంగా ఉంచుతుంది.
- source_word: πάντα τὰ ὄρνεα
  choice: పక్షులన్నీ
  rationale: సందర్భంలో మృతదేహాలను తినే పక్షులు ఉద్దేశించబడినా, గ్రీకు పదం ప్రత్యేకంగా ‘రాబందులు’ లేదా ‘వేటపక్షులు’ అని చెప్పదు.
- source_word: ἐχορτάσθησαν
  choice: కడుపు నింపుకున్నాయి
  rationale: χορτάζω సూచించే పూర్తిగా తిని తృప్తిపడడాన్ని తెలుగులో సహజంగా, ఈ భౌతిక సందర్భానికి తగినట్లుగా వ్యక్తపరుస్తుంది.
- source_word: ἐκ τῶν σαρκῶν αὐτῶν
  choice: వారి మాంసాన్ని తిని
  rationale: ἐκ సూచించే మూలాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, σάρξ ఇక్కడ అక్షరార్థమైన శరీర మాంసమనే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: గుర్రపు స్వారీదారుని నోటినుండి వెలువడే ఖడ్గం స్వభావం
  choice: ‘నోటినుండి వెలువడిన ఖడ్గం’ అనే స్పష్టమైన అపోకలిప్టిక్ ప్రతిమను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: దానిని నేరుగా అతని వాక్యం లేదా తీర్పు అని వివరణాత్మకంగా అనువదించడం
  rationale: వచనం ప్రతీకాత్మక దృశ్యాన్ని అందిస్తుంది గాని దాని అర్థాన్ని ఇక్కడే విప్పి చెప్పదు. అందువల్ల అనువాదం దాని ప్రతీకార్థాన్ని సిద్ధాంతపరంగా నిర్ణయించకుండా అసలు ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యంలోని ఖడ్గానికి సంబంధించిన పునరుక్తి తెలుగులో భారంగా ఉండకుండా సంబంధవాచక నిర్మాణంగా కుదించబడింది; అపోకలిప్టిక్ చిత్రం మాత్రం పూర్తిగా నిలుపబడింది.
