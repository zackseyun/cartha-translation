- from: ఆ ఇరవై నలుగురు పెద్దలూ, ఆ నాలుగు జీవులూ సాగిలపడి, సింహాసనం మీద కూర్చున్న దేవుణ్ణి ఆరాధిస్తూ, “ఆమేన్! హల్లెలూయా![a]” అన్నారు.
  to: 'ఆ ఇరవై నలుగురు పెద్దలూ, ఆ నాలుగు జీవులూ సాగిలపడి, సింహాసనం మీద కూర్చున్న దేవుణ్ణి ఆరాధించి ఇలా అన్నారు: “ఆమేన్! హల్లెలూయా![a]”'
  rationale: 'The revision makes the relation of the Greek verbs explicit in natural modern Telugu: the elders and living creatures prostrate themselves, worship God, and then voice the acclamation. The footnote marker remains attached directly to ‘హల్లెలూయా,’ and the footnote’s lexical alternatives are retained.'
