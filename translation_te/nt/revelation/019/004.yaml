id: REV.19.4
reference: Revelation 19:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔπεσαν οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες καὶ τὰ τέσσαρα ζῷα, καὶ προσεκύνησαν τῷ θεῷ τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ λέγοντες· Ἀμήν, Ἁλληλουϊά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: te
  text: 'ఆ ఇరవై నలుగురు పెద్దలూ, ఆ నాలుగు జీవులూ సాగిలపడి, సింహాసనం మీద కూర్చున్న దేవుణ్ణి ఆరాధించి ఇలా అన్నారు: “ఆమేన్! హల్లెలూయా![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవాను స్తుతించండి!” ఇది హీబ్రూ ఆరాధనా ఉద్ఘోష; అక్షరార్థంగా, “యాహ్‌ను స్తుతించండి!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: సాగిలపడి
  rationale: ఆరాధన సందర్భంలో πίπτω సూచించే నేలపై వంగి పడే భక్తిపూర్వక చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: ఆ ఇరవై నలుగురు పెద్దలు
  rationale: ప్రకటన గ్రంథంలోని ఈ ప్రత్యేక సమూహాన్ని సూచించడానికి ‘పెద్దలు’ స్పష్టమైన, స్థిరమైన తెలుగు పదం; గ్రీకులోని నిర్దిష్టతను ‘ఆ’ తెలియజేస్తుంది.
- source_word: τὰ τέσσαρα ζῷα
  choice: ఆ నాలుగు జీవులు
  rationale: ζῷα ఇక్కడ సాధారణ జంతువులను కాక సింహాసన పరిసరాల్లోని సజీవ ప్రాణులను సూచిస్తుంది; ‘జీవులు’ సంక్షిప్తంగా, గౌరవప్రదంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: προσεκύνησαν
  choice: ఆరాధిస్తూ
  rationale: దేవుడు కర్మగా ఉన్నందున ఈ సందర్భంలో క్రియ కేవలం నమస్కరించడాన్ని కాక ఆరాధనను సూచిస్తుంది; సంయుక్త క్రియ నిర్మాణంలో ‘ఆరాధిస్తూ ... అన్నారు’ సహజంగా ఉంది.
- source_word: τῷ θεῷ τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: సింహాసనం మీద కూర్చున్న దేవుణ్ణి
  rationale: గ్రీకు విశేషణాత్మక కృదంత పదబంధాన్ని తెలుగులో సహజమైన సంబంధవాచక నిర్మాణంగా అందించి, దేవుణ్ణి గుర్తించే సింహాసన దృశ్యాన్ని కాపాడుతుంది.
- source_word: λέγοντες
  choice: అన్నారు
  rationale: గ్రీకు కృదంతాన్ని ప్రధాన వాక్యానికి సహజంగా అనుసంధానిస్తూ, వారు పలికిన ప్రత్యక్ష ఉక్తిని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: Ἀμήν
  choice: ఆమేన్
  rationale: స్థిరపడిన ఆరాధనా ఉద్ఘోషగా అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించడం దాని ప్రార్థనా స్వరూపాన్ని నిలుపుతుంది.
- source_word: Ἁλληλουϊά
  choice: హల్లెలూయా
  rationale: గ్రీకులోనూ లిప్యంతరీకరించబడిన హీబ్రూ ఆరాధనా ఉద్ఘోషను తెలుగులో పరిచితమైన రూపంలో నిలుపుతుంది; దాని అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: గ్రీకు పాఠ్యంలో పొందుపరచబడిన Ἁλληλουϊά అనే హీబ్రూ ఆరాధనా ఉద్ఘోషను ఎలా అందించాలి
  choice: హల్లెలూయా
  alternative: యెహోవాను స్తుతించండి; యాహ్‌ను స్తుతించండి
  rationale: ఇది సాధారణ సమాచార వాక్యంగా కాక స్థిరమైన ఆరాధనా ఉద్ఘోషగా పనిచేస్తుంది. లిప్యంతరీకరణ దాని ప్రార్థనా, సామూహిక స్వరూపాన్ని నిలుపుతుంది; అంతర్లీన అర్థాన్ని పాదటిప్పణిలో ఇవ్వడం ద్వారా దైవనామ రూపాన్ని ప్రధాన పాఠ్యంలో అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ఆరాధనా శైలిని ఉపయోగించాం. ‘పెద్దలూ ... జీవులూ’ అనే సముచ్చయ రూపం రెండు కర్త సమూహాలను స్పష్టంగా కలుపుతుంది. పాదటిప్పణి గుర్తును అది వివరిస్తున్న ‘హల్లెలూయా’ పదానికే జతచేశాం.
