source:
  edition: SBLGNT
  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: te
  text: ఆయన రక్తంలో ముంచిన[a] వస్త్రాన్ని ధరించి ఉన్నాడు. ఆయన పేరు “దేవుని వాక్యం” అని పిలువబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రక్తంతో మరకపడిన.” గ్రీకు క్రియకు మరింత అక్షరార్థంగా “ముంచిన” లేదా “రంగువేసిన” అనే అర్థం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: ధరించి ఉన్నాడు
  rationale: పూర్త భూతకృదంతం ఆయన ప్రస్తుతం ఆ వస్త్రాన్ని ధరించి ఉన్న స్థితిని తెలియజేస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగానూ మూలంలోని స్థితి భావాన్ని నిలుపుకునే విధంగానూ ఉంది.
- source_word: ἱμάτιον
  choice: వస్త్రం
  rationale: ἱμάτιον సాధారణంగా పైవస్త్రాన్ని సూచిస్తుంది. సందర్భానికి తగిన గాంభీర్యాన్ని ఉంచుతూ, మూలంలో లేని నిర్దిష్ట రాజవస్త్ర భావాన్ని చేర్చకుండా ‘వస్త్రం’ అని అనువదించాం.
- source_word: βεβαμμένον αἵματι
  choice: రక్తంలో ముంచిన
  rationale: βάπτω క్రియకు ప్రాథమికంగా ‘ముంచు’ లేదా ‘అద్దు’ అనే అర్థం ఉంది. ‘రక్తంలో ముంచిన’ అనేది మూలంలోని బలమైన దృశ్యాన్ని కాపాడుతుంది; ‘రక్తంతో మరకపడిన’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: κέκληται
  choice: అని పిలువబడుతుంది
  rationale: καλέω యొక్క పూర్త కర్మణి రూపం పేరు పెట్టబడిన ఫలితస్థితిని సూచిస్తుంది. వ్యక్తిని ఉద్దేశించినా, తెలుగులో ‘పేరు … అని పిలువబడుతుంది’ అనే నిర్మాణం సహజంగా కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ఆయన పేరు
  rationale: గ్రీకు స్వామ్య నిర్మాణానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: దేవుని వాక్యం
  rationale: ఇక్కడ λόγος కేవలం సందేశాన్ని కాక, అశ్వారోహికి ఇచ్చిన వ్యక్తిగత క్రీస్తుసంబంధ బిరుదుగా పనిచేస్తుంది. ‘దేవుని వాక్యం’ ఆ బిరుదు భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: క్రీస్తుసంబంధ బిరుదైన λόγος
  choice: దేవుని వాక్యం
  alternative: దేవుని సందేశం
  rationale: ఈ దర్శన సందర్భంలో ὁ Λόγος τοῦ Θεοῦ అశ్వారోహి పేరుగా లేదా బిరుదుగా ఇవ్వబడింది. ‘దేవుని వాక్యం’ దాని వ్యక్తిగత, ధార్మిక బరువును నిలుపుతుంది; ‘దేవుని సందేశం’ అని అనడం వ్యక్తిగత బిరుదును సాధారణ సమాచారంగా బలహీనపరచవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన దర్శనశైలిని ఉపయోగించాం. ‘ఆయన’ అనే గౌరవ ఏకవచనం కొనసాగించబడింది; మూలంలోని బలమైన రక్త దృశ్యాన్ని మృదువుపరచలేదు.
