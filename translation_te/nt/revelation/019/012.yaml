id: REV.19.12
reference: Revelation 19:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: te
  text: ఆయన కళ్ళు అగ్నిజ్వాలలా ఉన్నాయి. ఆయన తలపై అనేక రాజకిరీటాలు[a] ఉన్నాయి. ఆయనకు వ్రాయబడి ఉన్న ఒక పేరు ఉంది; అది ఆయనకు తప్ప మరెవరికీ తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనేక డయాడెములు.” గ్రీకు పదం ప్రత్యేకంగా రాజాధికారాన్ని సూచించే కిరీటాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὀφθαλμοὶ αὐτοῦ
  choice: ఆయన కళ్ళు
  rationale: గ్రీకు స్వామ్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: —
  rationale: ఇక్కడ ఇది స్వల్ప కొనసాగింపు సూచకం; తెలుగు వర్ణనా ప్రవాహంలో ప్రత్యేక పదం అవసరం లేదు.
- source_word: φλὸξ πυρός
  choice: అగ్నిజ్వాలలా ఉన్నాయి
  rationale: క్రియలేని గ్రీకు నామవాచక వాక్యాన్ని సందర్భానుగుణమైన ఉపమానంగా సహజ తెలుగులో అందిస్తుంది; అగ్ని జ్వాల అనే దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: ఆయన తలపై
  rationale: స్థానార్థక భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: διαδήματα πολλά
  choice: అనేక రాజకిరీటాలు
  rationale: διάδημα సాధారణ కిరీటం కాక రాజాధికారాన్ని సూచించే కిరీటం; 'రాజకిరీటాలు' ఖచ్చితత్వంతో పాటు సామాన్య పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: ἔχων
  choice: ఆయనపై ... రాసి ఉంది
  rationale: కర్తను వర్ణించే వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన స్వతంత్ర వాక్యంగా మలుస్తుంది. గ్రీకులో పేరు ఎక్కడ రాయబడిందో చెప్పకపోవడం వల్ల తెలుగులోనూ నిర్దిష్ట స్థలాన్ని చేర్చలేదు.
- source_word: ὄνομα γεγραμμένον
  choice: ఒక పేరు రాసి ఉంది
  rationale: పరిపూర్ణ కర్మణి కృదంతంలోని, రాయబడి ఇప్పటికీ ఉన్న ఫలితస్థితిని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὃ οὐδεὶς οἶδεν
  choice: అది ... మరెవరికీ తెలియదు
  rationale: οἶδεν యొక్క వర్తమానార్థాన్ని సహజ తెలుగు జ్ఞానస్థితి నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: εἰ μὴ αὐτός
  choice: ఆయనకు తప్ప
  rationale: అతనొక్కడికే ఆ పేరు తెలుసనే స్పష్టమైన మినహాయింపు భావాన్ని సిద్ధాంతపరమైన విస్తరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: రాసి ఉన్న పేరును ఎవరికి తెలుసన్న ప్రత్యేక జ్ఞాన వాక్యం
  choice: ఆ పేరు ఆయనకు తప్ప మరెవరికీ తెలియదు
  alternative: ఈ వాక్యాన్ని పేరు అగ్రాహ్యమైనదనే విస్తృత భావానికి వివరణాత్మకంగా మార్చడం
  rationale: గ్రీకు పాఠం స్వారీ చేస్తున్న వ్యక్తికే ఆ పేరు తెలుసని ప్రత్యక్షంగా చెబుతుంది. దాని రహస్యార్థాన్ని లేదా క్రీస్తు సంబంధమైన సిద్ధాంతాన్ని అనువాదంలో అదనంగా వివరించకుండా ప్రత్యేకతను యథాతథంగా ఉంచాం.
- issue: అగ్నిజ్వాల వర్ణనలో రూపకం లేదా ఉపమానం
  choice: అగ్నిజ్వాలలా ఉన్నాయి
  alternative: అగ్నిజ్వాలగా ఉన్నాయి
  rationale: గ్రీకు వాక్యం క్రియలేని నామవాచక నిర్మాణం; అది ప్రత్యక్ష రూపకంగానూ వర్ణనా పోలికగానూ వినిపించవచ్చు. తెలుగులో శరీర కళ్ళ వర్ణనగా సహజంగా అర్థమయ్యేందుకు ఉపమాన రూపం ఎంచుకున్నాం; దృశ్య బలాన్ని తగ్గించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. 'డయాడెములు' అనే సాంకేతిక అప్పుపదం బదులు మూలంలోని రాజాధికార భావాన్ని స్పష్టపరిచే 'రాజకిరీటాలు' వాడాం.
