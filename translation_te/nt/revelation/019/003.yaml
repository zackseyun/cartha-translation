id: REV.19.3
reference: Revelation 19:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ δεύτερον ⸀εἴρηκαν· Ἁλληλουϊά· καὶ ὁ καπνὸς αὐτῆς ἀναβαίνει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: te
  text: వారు రెండోసారి, “హల్లెలూయా!” అన్నారు. ఆమె పొగ యుగయుగాలకూ[a] పైకి లేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, “యుగాల యుగాల వరకు”; ఇది అంతం లేని కాలవ్యవధిని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: రెండోసారి
  rationale: క్రియావిశేషణంగా వాడిన ఈ పదం పునరావృతితో పాటు క్రమాన్ని కూడా సూచిస్తుంది; ‘రెండోసారి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: εἴρηκαν
  choice: అన్నారు
  rationale: λέγω అనే క్రియ యొక్క పరిపూర్ణ కాలరూపం. తెలుగు కథనంలో ‘అన్నారు’ సహజంగా ఉంటుంది; మూలంలో లేని తీవ్రతను చేర్చే ‘కేక వేశారు’ వంటి పదాన్ని నివారించాం.
- source_word: Ἁλληλουϊά
  choice: హల్లెలూయా
  rationale: ఆరాధనలో వాడే గుర్తించదగిన స్థిరమైన ఉద్ఘాటన కావడంతో భావానువాదం చేయకుండా లిప్యంతరీకరించాం.
- source_word: ὁ καπνὸς αὐτῆς
  choice: ఆమె పొగ
  rationale: αὐτῆς సందర్భంలోని బబులోనును స్త్రీగా చిత్రించే వ్యక్తీకరణను సూచిస్తుంది; ‘ఆమె’ ఆ స్త్రీలింగ చిత్రణను నిలుపుతుంది.
- source_word: ἀναβαίνει
  choice: పైకి లేస్తూనే ఉంటుంది
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న దృశ్యభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాలకూ
  rationale: అంతం లేని కాలవ్యవధిని సూచించే గ్రీకు నుడికారానికి ఇది సహజమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: εἰς τοὺς αἰῶνας τῶν αἰώνων సూచించే కాలవ్యవధి
  choice: యుగయుగాలకూ
  alternative: యుగాల యుగాల వరకు
  rationale: తుది తీర్పు సందర్భంలో ఈ గ్రీకు నుడికారం అంతం లేని వ్యవధిని సహజంగా సూచిస్తుంది. ప్రధాన పాఠం ఆ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తూనే, మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. బబులోనుకు సంబంధించిన స్త్రీ వ్యక్తీకరణను ‘ఆమె’తో నిలిపాం; ఆరాధనా ఉద్ఘాటనను ‘హల్లెలూయా’గా లిప్యంతరీకరించాం.
