- from: 'వారు రెండోసారి ఇలా అన్నారు: “హల్లెలూయా!” ఆమె పొగ యుగయుగాలకూ[a] పైకి లేస్తూనే ఉంటుంది.'
  to: వారు రెండోసారి, “హల్లెలూయా!” అన్నారు. ఆమె పొగ యుగయుగాలకూ[a] పైకి లేస్తుంది.
