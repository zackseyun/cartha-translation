id: REV.19.1
reference: Revelation 19:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: te
  text: 'ఈ సంగతుల తరువాత, పరలోకంలో ఉన్న పెద్ద జనసమూహపు బిగ్గర స్వరంలా వినిపించినదాన్ని నేను విన్నాను. వారు ఇలా అన్నారు: “హల్లెలూయా![a] రక్షణ, మహిమ, శక్తి మన దేవునివే.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్‌ను స్తుతించండి”; “యెహోవాను స్తుతించండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ఆ తరువాత
  rationale: దర్శనంలోని సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు బహువచన సూచనను తెలుగులో పదేపదే పలకడం అసహజంగా ఉండవచ్చు.
- source_word: ἤκουσα
  choice: నేను విన్నాను
  rationale: ἀκούω యొక్క భూతకాల కథనార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: ὡς
  choice: లాగా
  rationale: ఆ శబ్దాన్ని ఖచ్చితంగా గుర్తించడం కంటే దానితో పోలికను లేదా గ్రహణంలోని సాదృశ్యాన్ని సూచించే గ్రీకు భావాన్ని నిలుపుతుంది.
- source_word: φωνὴν μεγάλην
  choice: పెద్ద స్వరం
  rationale: φωνήతో μεγάλη శబ్ద తీవ్రతను సూచిస్తుంది; తెలుగులో ‘పెద్ద స్వరం’ సహజంగా గట్టిగా వినిపించే స్వరాన్ని తెలియజేస్తుంది.
- source_word: ὄχλου πολλοῦ
  choice: ఒక గొప్ప జనసమూహపు
  rationale: అనేకమందితో కూడిన విస్తారమైన సమూహాన్ని సూచిస్తుంది; సమూహమే ఒకే పెద్ద స్వరంలా వినిపించిందనే నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: ఇక్కడ οὐρανός ఆకాశాన్ని కాక దైవిక పరలోక పరిధిని సూచిస్తుంది.
- source_word: λεγόντων
  choice: వారు ఇలా అన్నారు
  rationale: బహువచన కర్త అయిన జనసమూహం పలికిన మాటలను తెలుగులో స్పష్టంగా, సహజంగా పరిచయం చేస్తుంది.
- source_word: Ἁλληλουϊά
  choice: హల్లెలూయా
  rationale: గ్రీకులోనూ లిప్యంతరీకరించబడిన హెబ్రీ ఆరాధనా ఉద్ఘాటనను, దాని గుర్తించదగిన ప్రార్థనా స్వభావంతో సహా నిలుపుతుంది.
- source_word: ἡ σωτηρία
  choice: రక్షణ
  rationale: దేవునికి చెందిన రక్షించే విమోచనను సూచించే స్థిరమైన తెలుగు సమానార్థకం.
- source_word: ἡ δόξα
  choice: మహిమ
  rationale: ఆరాధనా సందర్భంలో δόξαకు సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: ἡ δύναμις
  choice: శక్తి
  rationale: దైవిక సామర్థ్యాన్ని సూచించే సహజమైన సాధారణ తెలుగు పదం.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: మన దేవునివే
  rationale: గ్రీకు స్వామ్యార్థక షష్ఠీ విభక్తిని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, రక్షణ, మహిమ, శక్తి దేవునికే చెందుతాయని ‘-వే’ ద్వారా ఉద్ఘాటిస్తుంది.
theological_decisions:
- issue: Ἁλληλουϊά అనే పరలోక స్తుతి ఉద్ఘాటనను అనువదించడం
  choice: హల్లెలూయా
  alternative: యాహ్‌ను స్తుతించండి / యెహోవాను స్తుతించండి
  rationale: ఇది హెబ్రీ నుంచి గ్రీకులోకి వచ్చిన ఆరాధనా ఉద్ఘాటన. లిప్యంతరీకరణ దాని అంతర్‌గ్రంథ మరియు ఆరాధనా స్వరూపాన్ని నిలుపుతుంది; అర్థాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ὡς సూచించే గ్రహణాత్మక పోలిక
  choice: ఒక గొప్ప జనసమూహపు పెద్ద స్వరంలా
  alternative: ఒక గొప్ప జనసమూహపు పెద్ద స్వరాన్ని
  rationale: ὡς వల్ల ఏర్పడే పోలిక లేదా వినికిడి అనుభవంలోని అనిశ్చితిని తొలగించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆరాధనా ధోరణి ఉంచబడింది. ‘హల్లెలూయా’ అనే సుపరిచిత ప్రార్థనా రూపం నిలుపబడింది; దాని అర్థం పాదసూచికలో ఇవ్వబడింది. ప్రధాన వాక్యంలో [a] గుర్తు సంబంధిత పదం వెంట ఉంచబడింది.
