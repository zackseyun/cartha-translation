id: REV.19.16
reference: Revelation 19:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· Βασιλεὺς βασιλέων καὶ κύριος κυρίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: te
  text: 'ఆయన వస్త్రం మీద, ఆయన తొడ మీద ఒక పేరు రాయబడి ఉంది: “రాజులకు రాజు, ప్రభువులకు ప్రభువు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక పేరు లిఖించబడి ఉంది.” గ్రీకులో అక్షరార్థంగా “ఒక పేరు రాయబడి ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: ఉంది
  rationale: గ్రీకు వర్తమాన కాలంలోని దర్శన సజీవతను సహజమైన తెలుగు వర్తమాన రూపంలో నిలుపుతుంది; ‘ధరించి ఉన్నాడు’ అనడం మూలంలో లేని వివరణను చేర్చుతుంది.
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: ఆయన వస్త్రం మీద
  rationale: ἱμάτιον అంటే వస్త్రం లేదా పైవస్త్రం. ‘వస్త్రం’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలపదం కంటే మరీ నిర్దిష్టంగా మారదు.
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: ఆయన తొడ మీద
  rationale: μηρός అనే పదానికి నేరుగా ‘తొడ’ అని అర్థం. వాక్యంలో పేర్కొన్న రెండవ స్థానాన్ని ఎలాంటి వివరణాత్మక సమన్వయం లేకుండా యథాతథంగా ఉంచుతుంది.
- source_word: ὄνομα γεγραμμένον
  choice: ఒక పేరు రాయబడి ఉంది
  rationale: పూర్తయిన రచన ఫలితం కొనసాగుతున్నదనే perfect passive participle భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘చెక్కబడి’ అనేది సాధ్యమైనా మూలం కంటే నిర్దిష్టం.
- source_word: Βασιλεὺς βασιλέων
  choice: రాజులకు రాజు
  rationale: గ్రీకు బహువచన షష్ఠీ నిర్మాణంలోని అత్యున్నత రాజాధికార భావాన్ని తెలుగులో స్థిరమైన, స్పష్టమైన రూపంలో నిలుపుతుంది.
- source_word: κύριος κυρίων
  choice: ప్రభువులకు ప్రభువు
  rationale: κύριος ను ‘ప్రభువు’గా అనువదిస్తూ, పునరుక్త షష్ఠీ నిర్మాణాన్ని మరియు బిరుదు యొక్క దైవశాస్త్రీయ ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: రాజబిరుదులను వ్యాఖ్యానాత్మకంగా అనువదించాలా, అక్షరార్థ నిర్మాణాన్ని నిలుపాలా
  choice: “రాజులకు రాజు, ప్రభువులకు ప్రభువు” అనే అక్షరార్థ రాజబిరుదులను నిలుపడం
  alternative: “సర్వోన్నత రాజు, సర్వోన్నత ప్రభువు”
  rationale: గ్రీకు పాఠం వ్రాయబడిన పేరు లేదా బిరుదును స్పష్టంగా ఇస్తుంది. అక్షరార్థ నిర్మాణం దాని ఉన్నతమైన క్రీస్తుసంబంధ బలాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా కాపాడుతుంది.
- issue: “వస్త్రం మీద, తొడ మీద” అనే రెండు స్థానాల సంబంధాన్ని ఎలా చూపాలి
  choice: రెండు స్థానాలనూ నేరుగా అనువదించి, వాటి పరస్పర సంబంధాన్ని వివరించకుండా ఉంచడం
  alternative: “ఆయన తొడను కప్పిన వస్త్రం మీద” లేదా “ఆయన వస్త్రం మీద, అంటే తొడ దగ్గర”
  rationale: మూలంలో రెండు వేర్వేరు ἐπί పదబంధాలు ఉన్నాయి. శాసనం ఖచ్చితంగా ఎలా అమరిందో పాఠం వివరించనందున, అనువాదం ఆ సందిగ్ధ చిత్రణను పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన దర్శన శైలిని ఉపయోగించాం. ‘రాజులకు రాజు, ప్రభువులకు ప్రభువు’ అనే సుపరిచిత బిరుదు నిర్మాణాన్ని నిలిపి, రెండు స్థానాల అపోకలిప్టిక్ చిత్రణను వివరించి పరిష్కరించలేదు.
