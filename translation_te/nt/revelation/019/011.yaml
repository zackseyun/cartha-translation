id: REV.19.11
reference: Revelation 19:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: te
  text: అప్పుడు పరలోకం తెరవబడి ఉండడాన్ని నేను చూశాను. ఇదిగో, ఒక తెల్లని గుర్రం; దాని మీద కూర్చున్నవాణ్ణి “నమ్మకమైనవాడు, సత్యవంతుడు” అని పిలుస్తారు. ఆయన నీతితో[a] తీర్పు తీర్చి యుద్ధం చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయంగా తీర్పు తీర్చి యుద్ధం చేస్తాడు.”
    reason: δικαιοσύνη అనే పదం ఈ సందర్భంలో నీతిని మాత్రమే కాక న్యాయమైన విధానాన్ని కూడా సూచించగలదు.
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: తెరవబడి ఉండడం
  rationale: ἀνοίγω క్రియ యొక్క పరిపూర్ణ నిష్క్రియాత్మక కృదంత రూపం పరలోకం తెరవబడిన స్థితిలో ఉందని సూచిస్తుంది; ఈ ప్రయోగం ఆ ఫలిత స్థితిని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: దర్శనంలోని హఠాత్తైన, సజీవమైన దృష్టి ఆకర్షణను సహజమైన తెలుగు ప్రకటనతో నిలుపుతుంది.
- source_word: ἵππος λευκός
  choice: ఒక తెల్లని గుర్రం
  rationale: గ్రీకు నామవాచక పదబంధానికి సహజమైన, సూటియైన తెలుగు రూపం.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: దాని మీద కూర్చున్నవాడు
  rationale: ‘గుర్రపు స్వారీ చేసేవాడు’ అని మరింత వ్యాఖ్యానించకుండా మూలంలోని కృదంత నిర్మాణాన్ని సహజంగా అనుసరిస్తుంది.
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: “నమ్మకమైనవాడు, సత్యవంతుడు” అని పిలువబడుతున్నాడు
  rationale: καλούμενος తెలిపే పేరుపెట్టడాన్ని స్పష్టంగా చూపుతూ, రెండు విశేషణాలను ఆ వ్యక్తికి వర్తించే బిరుదులుగా అందిస్తుంది.
- source_word: πιστός
  choice: నమ్మకమైనవాడు
  rationale: విశ్వసనీయత, స్థిరమైన నిబద్ధత అనే భావాలను సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀληθινός
  choice: సత్యవంతుడు
  rationale: ఈ బిరుదుల జంటలో నిజమైనవాడు, సత్యానికి అనుగుణమైనవాడు అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν δικαιοσύνῃ
  choice: నీతితో
  rationale: తీర్పు తీర్చడం, యుద్ధం చేయడం నీతికి అనుగుణంగా జరుగుతాయని సంక్షిప్తంగా వ్యక్తపరుస్తుంది; సందర్భానుసారమైన ‘న్యాయంగా’ అనే అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: κρίνει
  choice: తీర్పు తీర్చి
  rationale: వర్తమాన క్రియ యొక్క న్యాయనిర్ణయ భావాన్ని తరువాతి సమాన క్రియతో సహజమైన తెలుగు వాక్యనిర్మాణంలో కలుపుతుంది.
- source_word: πολεμεῖ
  choice: యుద్ధం చేస్తాడు
  rationale: πολεμέω యొక్క సైనిక భావాన్ని సాధారణ ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: తెల్లని గుర్రం మీదున్న వ్యక్తి బిరుదుల రూపం
  choice: “నమ్మకమైనవాడు, సత్యవంతుడు” అని బిరుదులుగా చూపడం
  alternative: వీటిని కేవలం వర్ణనాత్మక విశేషణాలుగా, ‘నమ్మకమైనవాడూ సత్యవంతుడూ’ అని అనువదించడం
  rationale: καλούμενος అనే పదం ఇవి అతనికి పిలుపు పేర్లు లేదా బిరుదులుగా పనిచేస్తున్నాయని సూచిస్తుంది. ఉద్ధరణ చిహ్నాలు ఆ పాత్రను చూపుతాయి గాని వ్యక్తిని అదనంగా గుర్తించవు.
- issue: δικαιοσύνη పదంలోని నీతి–న్యాయం భావపరిధి
  choice: ప్రధాన పాఠంలో ‘నీతి’
  alternative: ‘న్యాయం’ లేదా ‘న్యాయంగా’
  rationale: δικαιοσύνη నీతియుక్త స్వభావాన్ని, న్యాయమైన కార్యాచరణను రెండింటినీ సూచించగలదు. ప్రధాన పాఠం ‘నీతి’ని నిలుపగా, తీర్పు మరియు యుద్ధ సందర్భంలో సాధ్యమైన ‘న్యాయంగా’ అనే భావాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దర్శనశైలిని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం. ‘ఇదిగో’ దర్శనంలోని నాటకీయ దృష్టి ఆకర్షణను కాపాడుతుంది; బిరుదులకు ఉద్ధరణ చిహ్నాలు వాడాం.
