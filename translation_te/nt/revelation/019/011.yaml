review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the opened state of heaven, the white horse, the seated figure, the title-pair, and the two present actions carried out in righteousness. A small revision improves the Telugu expression of the perfect passive participle and avoids an unnecessary progressive nuance in the passive naming expression.
  naturalness: ‘పరలోకం తెరవబడి ఉండడం నేను చూశాను’ is grammatically understandable but sounds nominalized and stiff in modern standard Telugu. ‘పరలోకం తెరవబడి ఉండడాన్ని నేను చూశాను’ is more natural. ‘పిలువబడుతున్నాడు’ can suggest an action presently in progress; ‘పిలువబడతాడు’ naturally renders the title/name expression.
  terminology: ‘ఇదిగో,’ suitably preserves ἰδού. ‘నమ్మకమైనవాడు, సత్యవంతుడు’ is a viable modern Telugu rendering of the title-pair ‘Faithful and True’ without identifying the rider beyond the text. ‘నీతితో’ appropriately represents ἐν δικαιοσύνῃ, while the footnote preserves ‘న్యాయంగా’ as a contextual alternative.
  issues:
  - severity: low
    issue: Awkward nominalized wording for the opened heaven
    rationale: ‘తెరవబడి ఉండడం నేను చూశాను’ is less idiomatic than an accusative/object construction in Telugu. The revision preserves the Greek perfect passive resultative sense.
  - severity: low
    issue: Progressive passive nuance in the naming clause
    rationale: ‘పిలువబడుతున్నాడు’ may imply that the act of calling is ongoing. The Greek present participle in this construction marks the established designation; ‘పిలువబడతాడు’ is more natural and does not add progressive force.
  revised_text: అప్పుడు పరలోకం తెరవబడి ఉండడాన్ని నేను చూశాను. ఇదిగో, ఒక తెల్లని గుర్రం; దాని మీద కూర్చున్నవాణ్ణి “నమ్మకమైనవాడు, సత్యవంతుడు” అని పిలుస్తారు. ఆయన నీతితో[a] తీర్పు తీర్చి యుద్ధం చేస్తాడు.
