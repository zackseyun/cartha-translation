id: REV.19.20
reference: Revelation 19:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: te
  text: మృగం పట్టుబడింది. దానితోపాటు, దాని సమక్షంలో సూచక కార్యాలు చేసిన అబద్ధ ప్రవక్త కూడా పట్టుబడ్డాడు. ఆ సూచక కార్యాల ద్వారా అతడు మృగం ముద్రను పొందినవారినీ, దాని ప్రతిమకు పూజ చేసినవారినీ మోసగించాడు. ఆ ఇద్దరూ సజీవంగానే గంధకంతో మండుతున్న అగ్ని సరస్సులో పడవేయబడ్డారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιάσθη
  choice: పట్టుబడింది
  rationale: πιάζω యొక్క భూతకాల కర్మణి రూపం పట్టుకోవడం లేదా బంధించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో ‘పట్టుబడింది’ సహజంగా ఉండి కర్మణి నిర్మాణాన్ని నిలుపుతుంది.
- source_word: θηρίον
  choice: మృగం
  rationale: ప్రకటన గ్రంథంలోని స్థిరమైన ప్రళయదర్శన ప్రతీకకు ‘మృగం’ నేరమైన, సుపరిచితమైన తెలుగు పదం.
- source_word: μετ’ αὐτοῦ
  choice: దానితోపాటు
  rationale: αὐτοῦ అనేది నపుంసకలింగమైన θηρίονను సూచిస్తుంది. ‘దానితోపాటు’ తెలుగు వ్యాకరణానికి సహజంగా ఉండి, అవసరం లేని వ్యక్తీకరణను చేర్చదు.
- source_word: ψευδοπροφήτης
  choice: అబద్ధ ప్రవక్త
  rationale: సమాస నామవాచకానికి నేరమైన, అర్థవంతమైన ఆధునిక తెలుగు రూపం.
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: సూచక కార్యాలు చేసిన
  rationale: σημεῖα కేవలం అద్భుతాలను కాక, ఏదో విషయాన్ని సూచించే కార్యాలను తెలియజేస్తుంది. ‘సూచక కార్యాలు’ ఆ భావాన్ని కాపాడుతుంది; చేసిన చర్య ప్రధాన సంఘటనకు ముందున్నదని సందర్భమే స్పష్టం చేస్తుంది.
- source_word: ἐνώπιον αὐτοῦ
  choice: దాని సమక్షంలో
  rationale: ἐνώπιον అంటే ‘ఎదుట’ లేదా ‘సమక్షంలో.’ ఇక్కడ ‘దాని సమక్షంలో’ సహజంగా ఉండి మృగాన్నే పూర్వపదంగా ఉంచుతుంది.
- source_word: ἐν οἷς ἐπλάνησεν
  choice: ఆ సూచక కార్యాల ద్వారా ... మోసగించాడు
  rationale: ἐν οἷς ఇక్కడ సాధనార్థకంగా, ఆ కార్యాలే మోసానికి సాధనమని తెలియజేస్తుంది; πλανάωకు ‘మోసగించాడు’ స్పష్టమైన సందర్భోచిత రూపం.
- source_word: χάραγμα
  choice: ముద్ర
  rationale: గుర్తింపును తెలిపే ముద్రిత గుర్తు అనే భావాన్ని ఇస్తూ, ప్రకటన గ్రంథపు పదప్రయోగంతో సరిపోతుంది.
- source_word: προσκυνοῦντας
  choice: పూజ చేసినవారిని
  rationale: ఈ సందర్భంలో προσκυνέω కేవలం వంగి నమస్కరించడం కాక ఆరాధనా విధేయతను సూచిస్తుంది; ‘పూజ చేయడం’ సాధారణ పాఠకునికి సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ζῶντες ἐβλήθησαν οἱ δύο
  choice: ఆ ఇద్దరూ సజీవంగానే ... పడవేయబడ్డారు
  rationale: బహువచన ζῶντες ఇద్దరూ జీవించి ఉండగానే పడవేయబడ్డారని నొక్కి చెబుతుంది; కర్మణి రూపం కూడా నిలుపబడింది.
- source_word: τὴν λίμνην τοῦ πυρὸς τῆς καιομένης ἐν θείῳ
  choice: గంధకంతో మండుతున్న అగ్ని సరస్సు
  rationale: అసలు వచనంలోని స్పష్టమైన తీర్పు ప్రతిమను సిద్ధాంతపరమైన వివరణతో మార్చకుండా యథాతథంగా అందిస్తుంది. θεῖονకు ఆధునిక రసాయన పదం ‘గంధకం’ సరైనది.
theological_decisions:
- issue: మృగాన్ని సూచించే సర్వనామాలు
  choice: ‘దాని/దానితో’ అనే నపుంసక సూచనలను ఉపయోగించడం
  alternative: ‘అతని/అతనితో’ అని మృగాన్ని వ్యక్తిగా చూపించడం
  rationale: గ్రీకులో θηρίον నపుంసకలింగ నామవాచకం; తెలుగు ‘మృగం’ కూడా సహజంగా నపుంసక సూచనను తీసుకుంటుంది. ఇలా చేయడం వచనం స్పష్టంగా చెప్పేదానికంటే ఎక్కువ వ్యక్తీకరణను దిగుమతి చేయదు.
- issue: చివరి తీర్పు చిత్రణ
  choice: ‘గంధకంతో మండుతున్న అగ్ని సరస్సు’ అని ప్రత్యక్ష చిత్రణను నిలుపడం
  alternative: దీనిని ‘నరకం’ లేదా ఒక నిర్దిష్ట అనంత శిక్ష సిద్ధాంతంగా వివరిస్తూ అనువదించడం
  rationale: ఈ వాక్యం ప్రళయదర్శన శైలిలోని స్పష్టమైన ప్రతిమను ఇస్తుంది. అనువాదం దానిని నిలుపుతూ, వాక్యంలో ప్రత్యక్షంగా లేని తరువాతి సిద్ధాంత వివరణలను చేర్చకూడదు.
- issue: అబద్ధ ప్రవక్త కూడా పట్టుబడినట్టు తెలుగులో క్రియను పునరుక్తి చేయడం
  choice: ‘కూడా పట్టుబడ్డాడు’ అని క్రియను స్పష్టంగా పునరుక్తి చేయడం
  alternative: గ్రీకు సమన్వయ నిర్మాణాన్ని పదక్రమంతో మాత్రమే అనుకరించడం
  rationale: గ్రీకులో ఒకే కర్మణి క్రియ మృగానికీ అబద్ధ ప్రవక్తకీ వర్తిస్తుంది. తెలుగులో క్రియను పునరుక్తి చేయడం భావాన్ని మార్చకుండా ఎవరు పట్టుబడ్డారో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలోని దీర్ఘ సంబంధ నిర్మాణాన్ని స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం; సంఘటనల సంబంధం, కర్మణి భావం, ప్రళయదర్శన చిత్రణ అన్నీ నిలుపబడ్డాయి.
