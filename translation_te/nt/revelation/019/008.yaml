revisions:
- from: ఆమె మెరుస్తూ శుభ్రంగా ఉన్న సన్నని నారవస్త్రాన్ని ధరించుకోవడానికి అది ఆమెకు ఇవ్వబడింది. ఎందుకంటే ఆ సన్నని నారవస్త్రం పరిశుద్ధుల నీతికార్యాలు[a].
  to: మెరుస్తూ, శుభ్రంగా ఉన్న సన్నని నారవస్త్రాన్ని ఆమె ధరించుకోవడానికి ఆమెకు ఇవ్వబడింది. ఎందుకంటే ఆ సన్నని నారవస్త్రం పరిశుద్ధుల నీతికార్యాలే[a].
  rationale: The revision removes the unclear pronoun while retaining the Greek’s unspecified passive agent and the middle/reflexive sense that she clothes herself. It retains the lexical and theological ambiguity of δικαιώματα in the note, while the main text follows the contextually strongest sense, “righteous deeds.”
