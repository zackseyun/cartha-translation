review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the unstated agent in ἐδόθη, the reflexive force of περιβάληται, the repeated reference to fine linen, and the explanatory identification of the linen with the saints’ δικαιώματα. The fronted, antecedent-less “అది” is, however, unclear in Telugu and weakens the source’s purpose/result construction.
  naturalness: “ఆమె ... ధరించుకోవడానికి అది ఆమెకు ఇవ్వబడింది” is awkward because “అది” has no prior Telugu antecedent. A construction with the garment phrase directly in the infinitival clause is natural while retaining the impersonal passive. The predicate in the final clause is also smoother with emphatic nominal closure.
  terminology: “సన్నని నారవస్త్రం,” “పరిశుద్ధులు,” and “నీతికార్యాలు” are suitable modern-standard Telugu equivalents. “మెరుస్తూ, శుభ్రంగా” appropriately renders λαμπρὸν καθαρόν without prematurely moralizing καθαρόν. The footnote correctly presents a viable lexical alternative without making it the main reading.
  issues:
  - severity: medium
    issue: అస్పష్టమైన ముందస్తు-సూచన (“అది”)
    rationale: The opening “అది” occurs before any explicit antecedent in Telugu. Although Greek uses an impersonal passive, Telugu can preserve this without an unclear pronoun by using an impersonal passive construction directly with the clothing clause.
  - severity: low
    issue: చివరి సమీకరణ వాక్యంలోని సహజత్వం
    rationale: “ఆ సన్నని నారవస్త్రం పరిశుద్ధుల నీతికార్యాలు” is intelligible, but “పరిశుద్ధుల నీతికార్యాలే” gives the nominal predicate a natural and appropriately emphatic Telugu completion.
  revised_text: మెరుస్తూ, శుభ్రంగా ఉన్న సన్నని నారవస్త్రాన్ని ఆమె ధరించుకోవడానికి ఆమెకు ఇవ్వబడింది. ఎందుకంటే ఆ సన్నని నారవస్త్రం పరిశుద్ధుల నీతికార్యాలే[a].
