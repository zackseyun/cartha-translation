id: REV.19.8
reference: Revelation 19:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: te
  text: మెరుస్తూ, శుభ్రంగా ఉన్న సన్నని నారవస్త్రాన్ని ఆమె ధరించుకోవడానికి ఆమెకు ఇవ్వబడింది. ఎందుకంటే ఆ సన్నని నారవస్త్రం పరిశుద్ధుల నీతికార్యాలే[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతిగల క్రియలు.” ఈ గ్రీకు పదానికి ఇతర సందర్భాల్లో “నీతియుక్త ఆదేశాలు” అనే అర్థం కూడా ఉండవచ్చు; అయితే ఇక్కడ అది పరిశుద్ధుల నీతికార్యాలను సూచించడం అత్యంత సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: అది ఆమెకు ఇవ్వబడింది
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్ని అలాగే ఉంచుతుంది; ఇచ్చినది దేవుడని అనువాదంలో స్పష్టంగా చేర్చదు.
- source_word: ἵνα περιβάληται
  choice: ధరించుకోవడానికి
  rationale: మధ్యమ ప్రయోగంలోని ఆత్మార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: βύσσινον
  choice: సన్నని నారవస్త్రం
  rationale: విలువైన, మెత్తని fine linen వస్త్రాన్ని సూచించే పదానికి స్పష్టమైన తెలుగు సమానం; రెండు చోట్లా ఒకే రూపాన్ని ఉంచుతుంది.
- source_word: λαμπρὸν καθαρόν
  choice: మెరుస్తూ శుభ్రంగా ఉన్న
  rationale: వస్త్రపు దృశ్య కాంతినీ పరిశుభ్రతనీ సూచిస్తుంది; καθαρόν‌కు అనవసరంగా నైతిక అర్థాన్ని ముందుగానే ఆపాదించదు.
- source_word: δικαιώματα
  choice: నీతికార్యాలు
  rationale: ఈ బహువచన ప్రతీకాత్మక సందర్భంలో పరిశుద్ధుల నీతిగల క్రియలను అత్యంత సహజంగా సూచిస్తుంది; పదానికి ఇతర సందర్భాల్లో ‘న్యాయమైన ఆదేశాలు’ అనే అర్థం కూడా ఉండవచ్చు.
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధుల
  rationale: దేవునికి చెందిన పరిశుద్ధ ప్రజలకు వాడే ప్రామాణిక నూతన నిబంధన సంబోధనను సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: వధువు వస్త్రానికి δικαιώματαతో ఉన్న సంబంధం
  choice: నారవస్త్రం పరిశుద్ధుల నీతికార్యాలను సూచిస్తుంది.
  alternative: నారవస్త్రం పరిశుద్ధులకు సంబంధించిన నీతియుక్త ఆదేశాలను లేదా వారి నీతిస్థితి/న్యాయనిర్ణయాన్ని సూచిస్తుంది.
  rationale: తక్షణ సందర్భంలో బహువచన రూపం క్రియలు లేదా కార్యాలను సహజంగా సూచిస్తుంది. అదే సమయంలో వస్త్రం ఆమెకు ‘ఇవ్వబడింది’ అనే మొదటి వాక్యాన్ని నిలిపి, దైవిక బహుమానానికీ పరిశుద్ధుల నీతి ప్రవర్తనకీ మధ్య ఉన్న ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది.
- issue: ἐδόθηలో కర్త
  choice: ఇచ్చిన కర్తను పేర్కొనకుండా కర్మణి ప్రయోగాన్ని నిలుపడం.
  alternative: దేవుడు ఆమెకు ఇచ్చాడు.
  rationale: దేవుడే ఇచ్చినవాడని సందర్భం సూచించవచ్చు, కానీ గ్రీకు వాక్యం కర్తను ప్రత్యక్షంగా పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రతీకను వివరించడానికి మూలంలో లేని ‘సూచిస్తుంది’ అనే పదాన్ని ప్రధాన వాక్యంలో చేర్చకుండా, గ్రీకు సమీకరణ నిర్మాణాన్ని నిలిపింది.
