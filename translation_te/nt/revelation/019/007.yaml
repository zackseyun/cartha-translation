id: REV.19.7
reference: Revelation 19:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: te
  text: మనం సంతోషిద్దాం, ఉల్లసిద్దాం, ఆయనకు మహిమ చెల్లిద్దాం[a]; ఎందుకంటే గొర్రెపిల్ల వివాహం వచ్చింది, ఆయన వధువు[b] తనను తాను సిద్ధం చేసుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు మహిమ చెల్లిస్తాం.” గ్రీకు క్రియ భవిష్యత్ కాల రూపంలో ఉంది; అయితే ఇక్కడ ముందున్న “సంతోషిద్దాం,” “ఉల్లసిద్దాం” అనే ప్రోత్సాహక క్రియలకు సమాంతరంగా పిలుపు భావంలో వాడి ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆయన భార్య.” గ్రీకు γυνή అనే పదానికి “స్త్రీ,” “భార్య,” లేదా వివాహ సందర్భంలో “వధువు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρωμεν
  choice: మనం సంతోషిద్దాం
  rationale: మొదటి పురుష బహువచన వర్తమాన సుబ్జంక్టివ్‌కు ఉన్న సమూహ ప్రోత్సాహక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀγαλλιῶμεν
  choice: ఉల్లసిద్దాం
  rationale: χαίρωμεν కంటే ఉద్ధృతమైన ఆనందాన్ని సూచిస్తూ, జతగా ఉన్న రెండు క్రియల భావభేదాన్ని నిలుపుతుంది.
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: ఆయనకు మహిమ చెల్లిద్దాం
  rationale: క్రియారూపం భవిష్యత్ సూచకమైనప్పటికీ, ముందున్న ప్రోత్సాహక క్రియల సరళిలో ఇది ఆరాధనకు పిలుపుగా సహజంగా పనిచేస్తుంది. ‘మహిమ చెల్లిద్దాం’ తెలుగులో గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: δόξαν
  choice: మహిమ
  rationale: స్తోత్రారాధన సందర్భంలో δόξαకు స్థిరమైన, భావగాంభీర్యం గల తెలుగు పదం.
- source_word: ἦλθεν
  choice: సమయం వచ్చింది
  rationale: γάμοςతో కలిపి ‘వివాహం వచ్చింది’ అనే అసహజ తెలుగు నిర్మాణాన్ని నివారిస్తూ, వివాహం ఆసన్నమైనదనే నెరవేర్పు భావాన్ని తెలియజేస్తుంది.
- source_word: γάμος
  choice: వివాహం
  rationale: ఈ సందర్భంలో వివాహ బంధం/వివాహ ఘటనను సూచిస్తుంది; తరువాతి వచనంలో స్పష్టమయ్యే విందు భావాన్ని ఇక్కడ ముందుగానే చేర్చదు.
- source_word: ἀρνίου
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలోని యోహాను సంబంధ క్రీస్తు బిరుదును అనువదించి అందించే స్థిరమైన తెలుగు రూపం.
- source_word: γυνὴ αὐτοῦ
  choice: ఆయన వధువు
  rationale: γυνήకు స్త్రీ, భార్య, వధువు అనే అర్థాలు సాధ్యమైనా, వివాహ సందర్భంలో ‘వధువు’ అత్యంత సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: ἡτοίμασεν ἑαυτήν
  choice: తనను తాను సిద్ధం చేసుకుంది
  rationale: గ్రీకులోని ఆత్మనిర్దేశక భావాన్ని స్పష్టంగా నిలుపుతూ, వధువు సిద్ధపడే సందర్భానికి సహజమైన ఆధునిక తెలుగు రూపాన్ని ఇస్తుంది.
theological_decisions:
- issue: వివాహ రూపకంలో γυνὴ αὐτοῦ అనువాదం
  choice: ఆయన వధువు
  alternative: ఆయన భార్య
  rationale: ఈ వాక్యం గొర్రెపిల్ల వివాహం మరియు ఆమె సిద్ధపడటాన్ని చిత్రిస్తుంది కాబట్టి ‘వధువు’ వివాహ సందర్భాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది. అయితే ‘భార్య’ అనే అర్థం గ్రీకులో నిజంగా సాధ్యమైనందున దానిని పాదసూచికలో నిలిపాం.
- issue: ప్రోత్సాహక సరళిలో δώσομεν భావం
  choice: ఆయనకు మహిమ చెల్లిద్దాం
  alternative: ఆయనకు మహిమ చెల్లిస్తాం
  rationale: δώσομεν రూపరీత్యా భవిష్యత్ కాలమైనా, χαίρωμεν మరియు ἀγαλλιῶμεν అనే ప్రోత్సాహక క్రియలతో కలిసి ఒకే ఆరాధనా పిలుపుగా చదవడం సందర్భానికి సరిపోతుంది. రూపసంబంధమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా అసలు భాషలోని ఉద్వేగాన్ని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సామూహిక ఆరాధనా స్వరాన్ని ఉపయోగించాం. ‘సంతోషించి ఉల్లసిద్దాం’ ద్వారా జతక్రియల ఉద్ధృతి నిలిచింది. అందించిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో ఉన్నందున, గ్రీకు పదాలకు సంబంధించిన సరైన స్థానాల్లో [a], [b] గుర్తులను ఉంచాం.
