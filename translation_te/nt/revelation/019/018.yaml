  terminology: ‘బానిసలు’ అనేది ἐλευθέρωνకు వ్యతిరేకంగా ఉన్న δούλωνకు సరైన పదం. χιλιάρχωνకు ‘సేనాధిపతులు’ ఆమోదయోగ్యం. అయితే ἰσχυρῶνకు ‘బలవంతులు’ తెలుగులో బలప్రయోగం చేసే వారి భావాన్నీ కలిగించవచ్చు; సందర్భంలోని ‘mighty/strong’ భావానికి ‘శక్తిమంతులు’ మరింత నిర్దిష్టం.
