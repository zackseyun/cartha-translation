  source_fidelity: మూలగ్రంథంలోని ἵνα φάγητε ఉద్దేశార్థక, రెండవ బహువచన నిర్మాణం ‘మీరు … తినడానికి’ ద్వారా ముందరి వచనానికి ఆధారమైన భాగవాక్యంగా సరిగ్గా ప్రతిఫలించింది. జాబితాలోని ‘మాంసం’ పునరుక్తి, గుర్రాలు మరియు వాటిపై కూర్చున్నవారు, అలాగే స్వతంత్రులు/బానిసలు మరియు చిన్నవారు/గొప్పవారు అనే సమగ్ర జంటలు నిలిచాయి.
