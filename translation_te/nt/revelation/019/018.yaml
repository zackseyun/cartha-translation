id: REV.19.18
reference: Revelation 19:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and servant, and small and great.
translation:
  language: te
  text: మీరు రాజుల మాంసాన్ని, సేనాధిపతుల మాంసాన్ని, శక్తిమంతుల మాంసాన్ని, గుర్రాల మాంసాన్ని, వాటిమీద కూర్చున్నవారి[a] మాంసాన్ని, స్వతంత్రులైనా బానిసలైనా, చిన్నవారైనా గొప్పవారైనా అందరి మాంసాన్ని తినడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వాటిమీద ఆసీనులైన వారి’; సంక్షిప్తంగా, ‘గుర్రపు స్వారుల’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: మీరు … తినడానికి
  rationale: ἵναతో కూడిన భూతకాలాంశ క్రియార్థక సంభావనారూపం ఉద్దేశాన్ని లేదా ఫలితాన్ని సూచిస్తుంది. ముందరి వాక్యంలోని పిలుపుతో అనుసంధానమయ్యే అధీన వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: σάρκας
  choice: మాంసాన్ని
  rationale: ఇది తీర్పు దృశ్యంలో భౌతిక శరీరాల మాంసాన్ని సూచిస్తుంది. పదపునరుక్తిని నిలుపడం మూలంలోని గంభీరమైన జాబితా శైలిని కాపాడుతుంది.
- source_word: βασιλέων
  choice: రాజుల
  rationale: నిర్దిష్టంగా రాజులను సూచిస్తుంది; సాధారణమైన ‘పాలకులు’ అనే పదం భావాన్ని విస్తరించేస్తుంది.
- source_word: χιλιάρχων
  choice: సేనాధిపతుల
  rationale: χιλίαρχος సైనిక అధికారిని, చారిత్రకంగా వెయ్యిమందికి అధిపతిని సూచిస్తుంది. ‘సేనాధిపతులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి సైనిక భావాన్ని నిలుపుతుంది.
- source_word: ἰσχυρῶν
  choice: బలవంతుల
  rationale: నామవాచకంగా వాడిన విశేషణం బలవంతులైన లేదా శక్తిమంతులైన వారిని సూచిస్తుంది.
- source_word: ἵππων
  choice: గుర్రాల
  rationale: యుద్ధ దృశ్యంలోని గుర్రాలకు నేరమైన సూచన.
- source_word: τῶν καθημένων ἐπ’ αὐτῶν
  choice: వాటిమీద కూర్చున్నవారి
  rationale: గుర్రాల మీద కూర్చున్నవారనే మూల చిత్రణను కుదించకుండా నిలుపుతుంది.
- source_word: πάντων
  choice: అందరి
  rationale: తరువాత పేర్కొన్న సామాజిక స్థాయి, హోదా భేదాలన్నిటినీ సమగ్రంగా చేర్చుతుంది.
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: స్వతంత్రులూ బానిసలూ
  rationale: స్వేచ్ఛగలవారు, బానిసత్వంలో ఉన్నవారు అనే పరస్పర విరుద్ధ సామాజిక స్థితులను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: μικρῶν καὶ μεγάλων
  choice: చిన్నవారూ గొప్పవారూ
  rationale: అన్ని హోదాలు, స్థాయులు కలవారిని సూచించే మూలంలోని జంటపద ప్రయోగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సామాజిక స్థితుల జంటలో δοῦλος అనువాదం
  choice: బానిసలు
  alternative: సేవకులు
  rationale: ἐλεύθεροςతో ఉన్న ప్రత్యక్ష వ్యత్యాసం స్వతంత్రతకు విరుద్ధమైన బానిస స్థితిని సూచిస్తుంది. అందువల్ల ‘సేవకులు’ కంటే ‘బానిసలు’ మూలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే దర్శన గ్రంథంలోని గంభీరమైన తీర్పు ధోరణి మరియు ఉద్దేశపూర్వక పదపునరుక్తి నిలిచేలా రూపొందించబడింది. వాక్యం ముందరి వచనంపై ఆధారపడే ఉద్దేశార్థక నిర్మాణంగా ఉంచబడింది.
