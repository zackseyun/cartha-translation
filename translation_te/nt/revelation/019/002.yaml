revisions:
- from: ఎందుకంటే ఆయన తీర్పులు సత్యమైనవి, న్యాయమైనవి. తన లైంగిక దుర్నీతితో భూమిని చెడగొట్టిన ఆ మహా వేశ్యకు ఆయన తీర్పు తీర్చాడు; తన దాసుల[a] రక్తానికి ఆమె చేతినుండి ప్రతీకారం తీర్చుకున్నాడు.
  to: ఎందుకంటే ఆయన తీర్పులు సత్యమైనవి, న్యాయమైనవి; తన లైంగిక దుర్నీతితో భూమిని చెడగొట్టిన ఆ మహా వేశ్యకు ఆయన తీర్పు తీర్చాడు, తన దాసుల[a] రక్తం కోసం ఆమెపై ప్రతీకారం తీర్చాడు.
