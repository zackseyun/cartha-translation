id: REV.19.2
reference: Revelation 19:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his servants from her hand.
translation:
  language: te
  text: ఎందుకంటే ఆయన తీర్పులు సత్యమైనవి, న్యాయమైనవి; తన లైంగిక దుర్నీతితో భూమిని చెడగొట్టిన ఆ మహా వేశ్యకు ఆయన తీర్పు తీర్చాడు, తన దాసుల[a] రక్తం కోసం ఆమెపై ప్రతీకారం తీర్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సేవకులు.’ గ్రీకు పదం దౌలోస్; అది ‘దాసుడు’ లేదా ‘సేవకుడు’ అని అర్థమివ్వగలదు. యజమానికి చెందినవాడు అనే బలమైన భావాన్ని నిలుపడానికి ఇక్కడ ‘దాసులు’ అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: సత్యమైనవి, న్యాయమైనవి
  rationale: తీర్పులు వాస్తవానికి అనుగుణమైనవనీ నైతికంగా న్యాయమైనవనీ తెలిపే రెండు విశేషణాల భేదాన్ని నిలుపుతుంది.
- source_word: κρίσεις
  choice: తీర్పులు
  rationale: న్యాయపరమైన భావాన్నీ ప్రకటన గ్రంథంలోని దైవిక న్యాయనిర్ణయ సందర్భాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔκρινεν
  choice: తీర్పు తీర్చాడు
  rationale: గ్రీకు ఏకకాల భూతక్రియను సహజమైన తెలుగు భూతకాలంలో ఉంచి, సందర్భంలో సూచితమైన దోషనిర్ణయాన్ని అతిగా విస్తరించకుండా వ్యక్తం చేస్తుంది.
- source_word: πόρνην τὴν μεγάλην
  choice: ఆ మహా వేశ్య
  rationale: πόρνη యొక్క ప్రత్యక్ష అర్థాన్నీ ప్రకటన గ్రంథంలోని రూపకాల బలాన్నీ నిలుపుతుంది.
- source_word: ἔφθειρεν
  choice: చెడగొట్టిన
  rationale: φθείρωలోని చెరపడం/భ్రష్టుపట్టించడం అనే విస్తృత భావాన్ని ఇక్కడి నైతిక సందర్భానికి తగిన విధంగా అందిస్తుంది; భౌతిక వినాశానికే పరిమితం చేయదు.
- source_word: τὴν γῆν
  choice: భూమిని
  rationale: ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త సందర్భానికి సరిపోతుంది; స్థానికమైన ‘దేశం’ అనే భావానికి పరిమితం చేయదు.
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: తన లైంగిక దుర్నీతితో
  rationale: πορνεία యొక్క విస్తృత లైంగిక అనైతికత భావాన్ని ఆధునిక తెలుగులో తెలియజేస్తూ, సందర్భంలోని రూపకాల అన్వయాన్ని పాఠకుడిపై బలవంతంగా రుద్దదు.
- source_word: ἐξεδίκησεν
  choice: ప్రతీకారం తీర్చుకున్నాడు
  rationale: అన్యాయానికి న్యాయపూర్వక ప్రతిఫలం విధించడం అనే క్రియ యొక్క బలాన్ని నిలుపుతుంది.
- source_word: τὸ αἷμα τῶν δούλων αὐτοῦ
  choice: తన దాసుల రక్తానికి
  rationale: δοῦλοςలోని యజమానికి చెందినవాడు అనే బలమైన సంబంధాన్ని ‘దాసులు’ నిలుపుతుంది; మరింత మృదువైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἐκ χειρὸς αὐτῆς
  choice: ఆమె చేతినుండి
  rationale: ఆమె బాధ్యత మరియు కార్యసాధకత్వాన్ని సూచించే గ్రీకు-బైబిలీయ నుడికారాన్ని తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దేవుని ప్రజలకు δοῦλοι అనే పదం వాడకం
  choice: దాసులు
  alternative: సేవకులు
  rationale: ఈ సందర్భంలో దేవునికి సంపూర్ణంగా చెందినవారు అనే బంధిత సంబంధం ప్రాముఖ్యమైనది. ‘దాసులు’ ఆ బలాన్ని నిలుపుతుంది; సాధారణ పరిచర్యను ముందుకు తెచ్చే ‘సేవకులు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఉంచాం.
- issue: πορνεία యొక్క ప్రత్యక్ష మరియు రూపకాల భావం
  choice: లైంగిక దుర్నీతి
  alternative: వ్యభిచారం
  rationale: మూలపదంలోని విస్తృత లైంగిక అనైతికత భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, దానిని కేవలం వివాహేతర సంబంధానికో లేదా విగ్రహారాధనకో పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘మహా వేశ్య’ అనే బలమైన రూపకాన్ని మృదువుచేయలేదు; క్రియలను గ్రీకు ఏకకాల భూతరూపానికి అనుగుణంగా సహజ తెలుగు భూతకాలంలో ఇచ్చాం.
