revisions:
- from: జనాలు కోపించాయి; నీ ఉగ్రకోపం వచ్చింది. చనిపోయినవారికి తీర్పు జరగడానికి, నీ సేవకులైన[a] ప్రవక్తలకు, పరిశుద్ధులకు, నీ నామానికి భయపడేవారికి—చిన్నవారికీ గొప్పవారికీ—ప్రతిఫలం ఇవ్వడానికి, భూమిని నాశనం చేసేవారిని నాశనం చేయడానికి సమయం వచ్చింది.[b]
  to: జనములు ఆగ్రహించాయి, నీ ఉగ్రత వచ్చింది; చనిపోయినవారికి తీర్పు జరగడానికి, నీ సేవకులకు—ప్రవక్తలకు, పరిశుద్ధులకు, నీ నామానికి భయపడేవారికి, చిన్నవారికీ గొప్పవారికీ—ప్రతిఫలం ఇవ్వడానికి, భూమిని[b] నాశనం చేసేవారిని నాశనం చేయడానికి సమయం వచ్చింది.[a]
  rationale: The revision makes only source- and anchor-driven adjustments. It uses a standard elevated Telugu term for divine wrath, clarifies the Greek list of rewarded recipients, and relocates the lexical footnote to its proper anchor. Footnote a is moved to “సేవకులకు,” the term it explains; footnote b follows “భూమిని,” the term it explains. The source's repeated destruction verb is retained in Telugu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:58:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse's sequence of the nations' anger, God's wrath, judgment of the dead, reward for God's servants, and destruction of the earth's destroyers. However, “ఉగ్రకోపం” somewhat heightens the wording beyond ὀργή, and the reward recipients are more clearly represented by retaining the Greek list structure after “నీ సేవకులకు.” The earth/land footnote must be anchored to “భూమిని,” not to the end of the whole verse.
  naturalness: The current Telugu is generally clear, but “జనాలు కోపించాయి” is relatively colloquial for this elevated apocalyptic proclamation. “జనములు ఆగ్రహించాయి” provides a natural, suitably dignified modern-standard biblical register. The revised sentence retains one governing “సమయం వచ్చింది” construction, reflecting the Greek syntax clearly.
  terminology: “ఉగ్రత” is a standard, concise Telugu rendering for divine judicial wrath and avoids adding the extra intensifier implicit in “ఉగ్రకోపం.” “సేవకులు,” “ప్రవక్తలు,” “పరిశుద్ధులు,” “నీ నామానికి భయపడేవారు,” and “ప్రతిఫలం” are appropriate. “భూమి” is contextually fitting for γῆ, while the footnote preserves land/territory as a lexical possibility.
  issues:
  - severity: medium
    issue: Footnote b is anchored at the sentence end rather than at “భూమిని.”
    rationale: Its content concerns γῆ (‘earth/land’), so its marker should directly follow the Telugu word it qualifies. The present placement can make the note appear to apply to the whole final clause.
  - severity: low
    issue: “ఉగ్రకోపం” adds an explicit intensification to ὀργή.
    rationale: The Greek denotes wrath; “ఉగ్రత” naturally carries divine judicial wrath in Telugu without doubling or heightening the expression beyond the source.
  - severity: low
    issue: The recipient list can more closely reflect the Greek construction.
    rationale: Placing “నీ సేవకులకు” before a dash and then listing “ప్రవక్తలకు, పరిశుద్ధులకు, ...” transparently preserves the appositional/list relationship without overdefining the boundaries among the groups.
  revised_text: జనములు ఆగ్రహించాయి, నీ ఉగ్రత వచ్చింది; చనిపోయినవారికి తీర్పు జరగడానికి, నీ సేవకులకు—ప్రవక్తలకు, పరిశుద్ధులకు, నీ నామానికి భయపడేవారికి, చిన్నవారికీ గొప్పవారికీ—ప్రతిఫలం ఇవ్వడానికి, భూమిని[b] నాశనం చేసేవారిని నాశనం చేయడానికి సమయం వచ్చింది.[a]
  revised_footnotes:
  - marker: a
    text: ‘సేవకులు’ అనే పదానికి ‘బానిసలు’ అని కూడా అనువదించవచ్చు; గ్రీకు doulos సందర్భానుసారం ఈ రెండు భావాలనూ ఇవ్వగలదు.
    reason: alternative_reading
  - marker: b
    text: ‘భూమి’కి ‘దేశం’ లేదా ‘భూభాగం’ అనే అర్థమూ సాధ్యమే; ‘భూమిని నాశనం చేసేవారు’ అనే మాటను ‘భూమిని పాడుచేసేవారు’ లేదా ‘చెడగొట్టేవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
