id: REV.11.18
reference: Revelation 11:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: te
  text: జనములు ఆగ్రహించాయి, నీ ఉగ్రత వచ్చింది; చనిపోయినవారికి తీర్పు జరగడానికి, నీ సేవకులకు—ప్రవక్తలకు, పరిశుద్ధులకు, నీ నామానికి భయపడేవారికి, చిన్నవారికీ గొప్పవారికీ—ప్రతిఫలం ఇవ్వడానికి, భూమిని[b] నాశనం చేసేవారిని నాశనం చేయడానికి సమయం వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సేవకులు’ అనే పదానికి ‘బానిసలు’ అని కూడా అనువదించవచ్చు; గ్రీకు doulos సందర్భానుసారం ఈ రెండు భావాలనూ ఇవ్వగలదు.
    reason: alternative_reading
  - marker: b
    text: ‘భూమి’కి ‘దేశం’ లేదా ‘భూభాగం’ అనే అర్థమూ సాధ్యమే; ‘భూమిని నాశనం చేసేవారు’ అనే మాటను ‘భూమిని పాడుచేసేవారు’ లేదా ‘చెడగొట్టేవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: జనాలు
  rationale: ఇక్కడ ప్రపంచంలోని సమస్త జనసమూహాలను సూచిస్తుంది; యూదేతరులు అనే పరిమిత భావం అవసరం లేదు.
- source_word: ὠργίσθησαν
  choice: కోపించాయి
  rationale: కోపానికి లోనయ్యారనే క్రియాభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలో లేనంత తీవ్రతను చేర్చదు.
- source_word: ὀργή
  choice: ఉగ్రకోపం
  rationale: దేవుని న్యాయతీర్పుతో కూడిన అంత్యకాల కోపాన్ని సాధారణ ‘కోపం’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: καιρός
  choice: సమయం
  rationale: నిర్ణాయకమైన సందర్భాన్ని సూచించే καιρός భావాన్ని సందర్భమే స్పష్టం చేస్తుంది; మూలంలో లేని ‘నియమించిన’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: τῶν νεκρῶν κριθῆναι
  choice: చనిపోయినవారికి తీర్పు జరగడానికి
  rationale: నిష్క్రియార్థక న్యాయపరమైన భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μισθός
  choice: ప్రతిఫలం
  rationale: ఇక్కడ దేవుడు తన ప్రజలకు ఇచ్చే ఫలాన్ని సూచిస్తుంది; ‘జీతం’ అనే లావాదేవీ భావాన్ని నివారిస్తుంది.
- source_word: δούλοις
  choice: సేవకులు
  rationale: ఇక్కడ దేవునికి చెందినవారనే గౌరవప్రదమైన సమూహపేరు ప్రధానంగా ఉంది; బానిసత్వ స్థితిపై దృష్టి లేదు. ‘బానిసలు’ అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἁγίοις
  choice: పరిశుద్ధులు
  rationale: దేవునికి ప్రత్యేకపరచబడిన ప్రజలను సూచించే ప్రకటన గ్రంథంలోని స్థిరమైన సమూహపేరు.
- source_word: φοβουμένοις τὸ ὄνομά σου
  choice: నీ నామానికి భయపడేవారు
  rationale: దేవునిపట్ల భయభక్తులను తెలిపే మూలభాషా బైబిలీయ నుడికారాన్ని వివరణతో భర్తీ చేయకుండా నిలుపుతుంది.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: చిన్నవారికీ గొప్పవారికీ
  rationale: హోదా లేదా ప్రాముఖ్యత ఏ స్థాయిలో ఉన్నా అందరినీ కలుపుకునే జంట నిర్మాణాన్ని నిలుపుతుంది.
- source_word: διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν
  choice: భూమిని నాశనం చేసేవారిని నాశనం చేయడానికి
  rationale: ఒకే గ్రీకు మూలక్రియ రెండుసార్లు రావడాన్ని తెలుగులోనూ పునరావృతం చేసి, క్రియాపద ఆటను కాపాడుతుంది; γῆకి విశ్వవ్యాప్త తీర్పు సందర్భంలో ‘భూమి’ తగినది.
theological_decisions:
- issue: దేవుని ప్రజలకు వాడిన δοῦλος పదం
  choice: సేవకులు
  alternative: బానిసలు
  rationale: ఈ వాక్యంలో బహుమానం పొందే దేవుని ప్రజల గుర్తింపే ప్రధానాంశం; బంధిత స్థితిని నొక్కిచెప్పడం కాదు. అయినా గ్రీకు పదంలోని ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- issue: γῆ యొక్క పరిధి
  choice: భూమి
  alternative: దేశం / భూభాగం
  rationale: ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త అంత్యకాల తీర్పు సందర్భానికి ‘భూమి’ సరిపోతుంది; ‘దేశం’ లేదా ‘భూభాగం’ కూడా నిఘంటుపరంగా సాధ్యమేనని పాదసూచికలో తెలిపాం.
- issue: ప్రవక్తలు, పరిశుద్ధులు, నామానికి భయపడేవారి పరస్పర సంబంధం
  choice: ‘నీ సేవకులైన’ అనే పరిచయం తరువాత మూడు వర్గాలను సమాంతరంగా ఉంచడం
  alternative: వీటిని పూర్తిగా వేర్వేరు, పరస్పర సంబంధం లేని వర్గాలుగా చూపడం
  rationale: గ్రీకు వాక్యనిర్మాణం వీరందరినీ దేవుని సేవకుల పరిధిలో చదవడానికి అనుకూలంగా ఉంది; అయితే వర్గాల మధ్య ఖచ్చితమైన హద్దులను అదనంగా నిర్వచించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని వరుస అంత్యకాల కార్యాలను తెలుగులో స్పష్టంగా చదవడానికి రెండు వాక్యాలుగా అమర్చినా, ‘సమయం వచ్చింది’ అనే ఒకే ప్రధాన నిర్మాణానికి అవన్నీ సంబంధించినట్టు నిలిపాం. ‘నీ నామానికి భయపడేవారు’ అనే బైబిలీయ నుడికారాన్ని ఉద్దేశపూర్వకంగా కాపాడాం.
