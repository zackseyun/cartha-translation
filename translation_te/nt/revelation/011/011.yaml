id: REV.11.11
reference: Revelation 11:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: te
  text: ఆ మూడున్నర రోజుల తర్వాత, దేవుని నుండి వచ్చిన జీవశ్వాస[a] వారిలోకి ప్రవేశించింది. అప్పుడు వారు తమ కాళ్ల మీద నిలబడ్డారు; వారిని చూస్తున్నవారిమీద గొప్ప భయం పడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని నుండి వచ్చిన జీవాత్మ”; బహుశా “దేవుని నుండి వచ్చిన జీవపు ఆత్మ.” గ్రీకు πνεῦμα అనే పదానికి శ్వాస, ఆత్మ, లేదా పరిశుద్ధాత్మ అనే అర్థాలు రావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: ఆ మూడున్నర రోజుల తర్వాత
  rationale: μετά + accusative కాలానంతర భావాన్ని సూచిస్తుంది. నిర్దిష్ట article భావాన్ని ‘ఆ’ ద్వారా నిలుపుతూ, καὶ ἥμισυను సహజమైన ఆధునిక తెలుగు ‘మూడున్నర’గా అనువదించాం.
- source_word: πνεῦμα ζωῆς
  choice: జీవశ్వాస
  rationale: πνεῦμα అనే పదానికి శ్వాస, ఆత్మ, పరిశుద్ధాత్మ అనే అర్థసాధ్యతలు ఉన్నాయి. ఈ పునర్జీవన సందర్భంలో యెహెజ్కేలు 37 ప్రతిధ్వనిని దృష్టిలో ఉంచుకొని ‘జీవశ్వాస’ను ప్రధాన పాఠంలో వాడాం; ఇతర సాధ్యతలను పాదసూచికలో నిలిపాం.
- source_word: ἐκ τοῦ θεοῦ
  choice: దేవుని నుండి వచ్చిన
  rationale: జీవశ్వాసకు దేవుడే మూలమని స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: వారిలోకి ప్రవేశించింది
  rationale: అది వారి అంతర్భాగంలోకి ప్రవేశించిందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: వారు తమ కాళ్ల మీద నిలబడ్డారు
  rationale: ἔστησαν యొక్క అకర్మక భావాన్నీ, పునరుద్ధరణ దృశ్యంలోని స్పష్టమైన శారీరక చర్యనూ నేరుగా నిలుపుతుంది.
- source_word: φόβος μέγας
  choice: గొప్ప భయం
  rationale: μέγας యొక్క తీవ్రతను అతిశయ వ్యాఖ్యానం లేకుండా నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐπέπεσεν ἐπὶ
  choice: ఆవరించింది
  rationale: భయం వారిమీదికి వచ్చి వారిని పట్టుకుందనే బలమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: వారిని చూస్తున్నవారిని
  rationale: θεωρέω participleలోని కొనసాగుతున్న, శ్రద్ధగా గమనించే చర్యను సరళమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: πνεῦμα ζωῆςను జీవాన్నిచ్చే శ్వాసగా అనువదించాలా, లేక పరిశుద్ధాత్మగా స్పష్టంగా గుర్తించాలా
  choice: ప్రధాన పాఠంలో ‘జీవశ్వాస’
  alternative: ‘జీవాత్మ’ లేదా ‘జీవాన్ని ఇచ్చే ఆత్మ’; సందర్భానుసారం ‘దేవుని జీవాత్మ’ అని కూడా అర్థం చేసుకోవచ్చు
  rationale: గ్రీకు πνεῦμα బహుఅర్థక పదం; ఈ వాక్యం దాని దైవిక మూలాన్ని చెబుతుంది గాని, పరిశుద్ధాత్మనే అని స్పష్టంగా నిర్ధారించదు. అందువల్ల పునర్జీవన చిత్రానికి సరిపోయే ‘జీవశ్వాస’ను ప్రధాన పాఠంలో ఉంచి, theological ambiguityని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలిని వాడాం. ‘జీవశ్వాస’ ద్వారా మూలపదంలోని రూపకాన్నీ బహుఅర్థకతనూ సాధ్యమైనంతవరకు నిలిపాం; ‘ఆవరించింది’ సహజ తెలుగులో ἐπέπεσεν ἐπὶ యొక్క తీవ్రతను తెలియజేస్తుంది.
