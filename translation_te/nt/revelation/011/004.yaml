source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: te
  text: వీరు రెండు ఒలీవ చెట్లు, రెండు దీపస్తంభాలు; భూమి ప్రభువు ఎదుట నిలిచి ఉన్నవారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: జెకర్యా 4కు ఇది సూచన. అక్కడి ఒలీవ చెట్లు, దీపస్తంభం అనే దృశ్యాలు దేవుడు నియమించి, తన ఆత్మచేత శక్తినిచ్చిన సేవకులను సూచిస్తాయి.
    reason: cross_reference
  - marker: b
    text: లేదా, “వీరు భూమి ప్రభువు ఎదుట నిలిచేవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτοί
  choice: వీరు
  rationale: ఇది పుంలింగ బహువచన సూచక సర్వనామం; సందర్భంలో ముందున్న ఇద్దరు సాక్షులను సూచిస్తుంది. అయితే ఈ వచనంలో లేని ‘సాక్షులు’ అనే పదాన్ని చేర్చకుండా ‘వీరు’ అని అనువదించాం.
- source_word: ἐλαῖαι
  choice: ఒలీవ చెట్లు
  rationale: జెకర్యా 4లోని ప్రతీకాత్మక దృశ్యాన్ని ప్రతిధ్వనింపజేసే చెట్లను ఈ పదం సూచిస్తుంది; అందువల్ల పండ్లుగా కాక చెట్లుగా అనువదించాం.
- source_word: λυχνίαι
  choice: దీపస్తంభాలు
  rationale: ఈ గ్రీకు పదం దీపాలను కాక, దీపాలను ఉంచే స్తంభాలను సూచిస్తుంది; ప్రకటన గ్రంథంలోని స్థిరమైన ప్రతీకను కూడా ఇది నిలుపుతుంది.
- source_word: ἐνώπιον
  choice: ఎదుట
  rationale: ఒకరి సన్నిధిలో లేదా వారి ఎదుట ఉండడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువైనవాని
  rationale: κύριος అనే బిరుదుకు గౌరవార్థకమైన ‘ప్రభువు’ తగిన అనువాదం. సంబంధార్థక నిర్మాణంలో సహజంగా ఉండేందుకు ‘ప్రభువైనవాని’ అని ఇచ్చాం.
- source_word: γῆς
  choice: భూమికి
  rationale: ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త సందర్భంలో γῆ భూలోకాన్ని సూచిస్తుంది; ‘దేశం’ అనే పరిమిత అర్థం ఇక్కడ తక్కువ సంభావ్యమైనది.
- source_word: ἑστῶτες
  choice: నిలిచియున్న
  rationale: ἵστημι యొక్క పరిపూర్ణ కృదంత రూపం, నిలబడిన స్థితిలో కొనసాగడాన్ని సూచిస్తుంది. ‘నిలిచియున్న’ ఆ స్థితిని, ప్రతీకలతో దాని వ్యాకరణ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: జెకర్యా 4తో ప్రతీకల సంబంధం మరియు ఇద్దరు సాక్షుల గుర్తింపు
  choice: ‘రెండు ఒలీవ చెట్లు, రెండు దీపస్తంభాలు’ అనే రూపక గుర్తింపును ప్రధాన పాఠ్యంలో నేరుగా నిలుపుట
  alternative: ‘ఈ ఇద్దరు సాక్షులు రెండు ఒలీవ చెట్లవలె, రెండు దీపస్తంభాలవలె ఉన్నారు’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: గ్రీకు పాఠ్యం ‘వలె’ అని పోలిక చేయకుండా వారిని ఈ అపోకలిప్టిక్ ప్రతీకలతో నేరుగా గుర్తిస్తుంది. దానిని అలాగే ఉంచడం అంతర్గ్రంథ సంబంధాన్ని, ప్రతీకలోని ఉద్దేశపూర్వక అనిశ్చితిని కాపాడుతుంది.
- issue: ἑστῶτες అనే పుంలింగ బహువచన కృదంతం దేనితో సంబంధించిందన్న వ్యాకరణ ఉద్వేగం
  choice: ప్రధాన పాఠ్యంలో ‘నిలిచియున్న’ అని ప్రతీకల తరువాత ఉంచి, అది వీరిని వర్ణించే భావాన్ని నిలుపుట
  alternative: ‘భూమికి ప్రభువైనవాని ఎదుట నిలిచేవారు’ అని సంబంధ వాక్యంగా అనువదించడం
  rationale: ‘ఒలీవ చెట్లు’ మరియు ‘దీపస్తంభాలు’ స్త్రీలింగ పదాలైనా, ἑστῶτες పుంలింగంలో ఉండి Οὗτοί ద్వారా సూచింపబడిన వ్యక్తులను అనుసరిస్తుంది. ప్రధాన అనువాదం గ్రీకు వాక్య క్రమానికి దగ్గరగా ఉంటుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన బైబిలు శైలిని అనుసరించాం. ‘వీరు’ వ్యక్తుల సూచనను స్పష్టంగా ఉంచుతుంది; ‘ఒలీవ చెట్లు’, ‘దీపస్తంభాలు’ మూలంలోని ప్రతీకలను వివరణాత్మకంగా మార్చకుండా కాపాడుతాయి. [a], [b] గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
