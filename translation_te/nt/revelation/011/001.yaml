id: REV.11.1
reference: Revelation 11:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: te
  text: 'మరియు, దండంలాంటి ఒక రెల్లుకాడ నాకు ఇవ్వబడింది; ఇలా చెప్పబడింది: “లేచి, దేవుని ఆలయాన్ని[a], బలిపీఠాన్ని, దానిలో ఆరాధించేవారిని కొలవు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని అంతరాలయాన్ని”; గ్రీకు ναός అనే పదం ఆలయ ప్రాంగణమంతటినీ కాకుండా, మరింత నిర్దిష్టంగా ఆలయంలోని పరిశుద్ధస్థలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: నాకు ఇవ్వబడింది
  rationale: దాతను స్పష్టంగా పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్ని నిలుపుతుంది.
- source_word: κάλαμος ὅμοιος ῥάβδῳ
  choice: దండంలాంటి ఒక రెల్లుకాడ
  rationale: κάλαμος యొక్క ప్రాథమిక అర్థమైన ‘రెల్లుకాడ’ను, ῥάβδος‌తో చేసిన పోలికను వేర్వేరుగా నిలుపుతుంది; ముందుగానే ‘కొలతకర్ర’ అని వ్యాఖ్యానించదు.
- source_word: λέγων
  choice: అని చెప్పబడింది
  rationale: తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఇస్తూ, మాటలాడిన వ్యక్తి ఎవరన్నది పేర్కొనకుండా ఉంచుతుంది. గ్రీకులోని పురుష ఏకవచన కృదంత నిర్మాణం ఆకస్మికంగా ఉన్నందున దాని భావసందిగ్ధతను పరిష్కరించదు.
- source_word: Ἔγειρε
  choice: లేచి
  rationale: ఆజ్ఞార్థక భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: μέτρησον
  choice: కొలువు
  rationale: కొలవమనే ప్రత్యక్ష ఆజ్ఞను సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ναὸν τοῦ θεοῦ
  choice: దేవుని ఆలయాన్ని
  rationale: ναός‌ను సహజంగా ‘ఆలయం’గా అనువదిస్తూ, అది మరింత నిర్దిష్టంగా అంతరాలయాన్ని సూచించగలదనే భావాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: θυσιαστήριον
  choice: బలిపీఠాన్ని
  rationale: θυσιαστήριονకు ప్రామాణికమైన తెలుగు పదం; అది ఏ రకమైన బలిపీఠమో అనవసరంగా నిర్ధారించదు.
- source_word: τοὺς προσκυνοῦντας ἐν αὐτῷ
  choice: దానిలో ఆరాధించేవారిని
  rationale: కృదంతంలోని క్రియాత్మక భావాన్ని నిలుపుతూ, αὐτῷ సహజంగా ఆలయాన్ని సూచిస్తుందని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రకటన గ్రంథ సందర్భంలో ναός దేనిని సూచిస్తుంది
  choice: దేవుని ఆలయం
  alternative: దేవుని అంతరాలయం/పరిశుద్ధస్థలం
  rationale: ఇది భూలోక ఆలయమా, పరలోక పరిశుద్ధస్థలమా, లేక దేవుని ప్రజలకు సంకేతమా అన్నది ఈ వాక్యం తేల్చదు; అందువల్ల ప్రధాన పాఠం ఏ ప్రత్యేక అంత్యకాల వ్యాఖ్యానాన్నీ చేర్చదు.
- issue: λέγωνలో సూచితమైన వక్త గుర్తింపు
  choice: వక్తను గుర్తించకుండా ‘అని చెప్పబడింది’
  alternative: ఒక దూత చెప్పాడు / ఒక స్వరం చెప్పింది
  rationale: గ్రీకు పాఠం వక్తను స్పష్టంగా గుర్తించదు. ‘దూత’ లేదా ‘స్వరం’ అని చేర్చడం మూలపాఠాన్ని మించిన వ్యాఖ్యానం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘రెల్లుకాడ’ మరియు ‘దండం’ మధ్య మూలపాఠంలోని పోలికను నిలిపి, వక్త గుర్తింపులోని సందిగ్ధతను పరిష్కరించకుండా ఉంచింది.
