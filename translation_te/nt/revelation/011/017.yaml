- from: ఇలా అంటూ, “ప్రభువైన దేవా, సర్వశక్తిమంతుడా, ఉన్నవాడా, ఉండినవాడా[a], మేము నీకు కృతజ్ఞతలు చెల్లిస్తున్నాం. ఎందుకంటే నీవు నీ మహా శక్తిని చేపట్టి రాజ్యపాలన ప్రారంభించావు[b].”
