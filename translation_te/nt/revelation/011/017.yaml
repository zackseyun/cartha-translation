id: REV.11.17
reference: Revelation 11:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγοντες· Εὐχαριστοῦμέν σοι, κύριε, ὁ θεός, ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην καὶ ἐβασίλευσας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: te
  text: ఇలా అంటూ, “ప్రభువా, దేవా, సర్వశక్తిమంతుడా, ఉన్నవాడా, ఉండినవాడా[a], మేము నీకు కృతజ్ఞతలు చెల్లిస్తున్నాం. ఎందుకంటే నీవు నీ గొప్ప శక్తిని తీసుకొని రాజ్యపాలన ప్రారంభించావు[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఉన్నవాడవు, ఉండినవాడవు.’ ప్రకటన గ్రంథంలోని ఇతర చోట్ల ‘రాబోవువాడు’ అనే పదబంధం కూడా కనిపిస్తుంది; అయితే ఇక్కడి గ్రీకు పాఠంలో ఆ మాటలు లేవు.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘రాజ్యపాలన చేశావు’ లేదా ‘రాజయ్యావు.’ గ్రీకు క్రియ రాజపాలన ఆరంభాన్ని గానీ, దాని అమలును గానీ నొక్కి చెప్పగలదు; ఇక్కడ దేవుని రాజపాలన బహిరంగంగా ప్రత్యక్షమవడాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: ఇలా అంటూ
  rationale: వర్తమాన క్రియావిశేషణ రూపంలోని ఈ బహువచన పదం మునుపటి వచనంలో చెప్పిన పెద్దల చర్యతో వారి మాటలను అనుసంధానిస్తుంది.
- source_word: Εὐχαριστοῦμέν σοι
  choice: మేము నీకు కృతజ్ఞతలు చెల్లిస్తున్నాం
  rationale: కృతజ్ఞత తెలియజేయడాన్ని సహజమైన, ఆరాధనకు తగిన గౌరవభరితమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: ప్రభువైన దేవా, సర్వశక్తిమంతుడా
  rationale: మూలంలోని దైవ సంబోధనల క్రమాన్నీ గంభీరతనూ సాధ్యమైనంతగా నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించే సంబోధనను ఇస్తుంది.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: ఉన్నవాడా, ఉండినవాడా
  rationale: వర్తమాన, భూతకాల రూపాలను నిలుపుతూ ప్రకటన గ్రంథంలోని సూత్రబద్ధమైన దైవ బిరుదును సంబోధన రూపంలో అందిస్తుంది; మూలంలో లేని భవిష్యత్ పదబంధాన్ని చేర్చదు.
- source_word: εἴληφας τὴν δύναμίν σου τὴν μεγάλην
  choice: నీ మహా శక్తిని చేపట్టి
  rationale: పూర్తయిన చర్యకు వర్తమాన ప్రాసంగికత ఉన్న భావాన్ని తెలుపుతుంది. ‘చేపట్టి’ అనేది తన శక్తిని నిర్ణాయకంగా వినియోగంలోకి తీసుకోవడాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἐβασίλευσας
  choice: రాజ్యపాలన ప్రారంభించావు
  rationale: ఈ సందర్భంలో రాజాధికార పాలన నిర్ణాయకంగా ప్రత్యక్షమవడం లేదా ఆరంభమవడం అనే సంభావ్య ప్రవేశార్థాన్ని వ్యక్తపరుస్తుంది; దేవుడు అంతకుముందు సార్వభౌముడు కాదనే భావాన్ని అవసరం లేకుండా కలిగించదు.
theological_decisions:
- issue: ‘ఉన్నవాడు, ఉండినవాడు’ అనే దైవ బిరుదులో ‘రాబోవువాడు’ అనే పదబంధాన్ని చేర్చాలా
  choice: ఉన్నవాడా, ఉండినవాడా
  alternative: ఉన్నవాడా, ఉండినవాడా, రాబోవువాడా
  rationale: SBLGNT గ్రీకు పాఠంలో ὁ ὢν καὶ ὁ ἦν మాత్రమే ఉంది. ప్రకటన గ్రంథంలోని ఇతర చోట్ల ఉన్న దీర్ఘ సూత్రంతో సమన్వయం చేయకుండా, ఇక్కడి సంక్షిప్త రూపాన్నే అనువాదం కాపాడుతుంది.
- issue: ἐβασίλευσας అనే క్రియ దేవుని రాజత్వాన్ని ఎలా సూచిస్తుంది
  choice: రాజ్యపాలన ప్రారంభించావు
  alternative: రాజ్యపాలన చేశావు; రాజయ్యావు
  rationale: సందర్భం దేవుని రాజాధికార పాలన నిర్ణాయకంగా, బహిరంగంగా వ్యక్తమవడాన్ని వేడుకగా ప్రకటిస్తుంది. ‘రాజయ్యావు’ అనేది దేవుడు అప్పుడే మొదటిసారి రాజయ్యాడనే అనవసర భావాన్ని కలిగించవచ్చు; ‘ప్రారంభించావు’ క్రియలోని ప్రవేశార్థ సంభావ్యతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ పరలోక ఆరాధనకు తగిన గౌరవభరిత, గంభీర శైలిని ఉపయోగించాం. దైవ బిరుదుల పునరుక్తిని అతిగా సరళీకరించకుండా నిలిపాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
