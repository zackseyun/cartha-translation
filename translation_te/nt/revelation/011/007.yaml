id: REV.11.7
reference: Revelation 11:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: te
  text: వారు తమ సాక్ష్యాన్ని ముగించినప్పుడు, అగాధం నుండి పైకి వచ్చే మృగం వారితో యుద్ధం చేస్తుంది[a]; వారిని జయిస్తుంది; వారిని చంపుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి వ్యతిరేకంగా యుద్ధం చేస్తుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τελέσωσιν
  choice: ముగించినప్పుడు
  rationale: ὅτανతో వచ్చిన ఏఓరిస్ట్ సబ్జంక్టివ్ భవిష్యత్తులో జరిగే సందర్భాన్ని సూచిస్తుంది. ‘ముగించినప్పుడు’ సహజమైన తెలుగులో వారి సాక్ష్యం పూర్తికావడాన్ని తెలియజేస్తుంది.
- source_word: μαρτυρίαν
  choice: సాక్ష్యాన్ని
  rationale: ఈ పదానికి ‘సాక్ష్యం’ లేదా ‘సాక్ష్యమివ్వడం’ అనే భావాలు ఉండవచ్చు. ఇక్కడ ‘ముగించు’ అనే క్రియతో ‘సాక్ష్యాన్ని’ సహజంగా సరిపోతూ, ప్రకటన గ్రంథంలోని సాక్ష్యమిచ్చే భావాన్ని నిలుపుతుంది.
- source_word: θηρίον
  choice: మృగం
  rationale: ప్రకటన గ్రంథపు అపోకలిప్టిక్ సందర్భంలో θηρίονకు స్థిరమైన, సంక్షిప్తమైన తెలుగు సమానార్థకం ‘మృగం’.
- source_word: ἀναβαῖνον
  choice: పైకి వచ్చే
  rationale: వర్తమాన కృదంతాన్ని సహజమైన సంబంధవాచక రూపంలో అనువదించి, అగాధం నుండి పైకి రావడం అనే సజీవ చిత్రణను నిలిపింది.
- source_word: ἀβύσσου
  choice: అగాధం
  rationale: ‘అగాధం’ గ్రీకు పదానికి సన్నిహితమైన అర్థాన్ని ఇస్తుంది; ‘అడుగులేని గుంట’ వంటి వివరణాత్మక విస్తరణను అనవసరంగా చేర్చదు.
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: వారితో యుద్ధం చేస్తుంది
  rationale: μετά + షష్ఠీ విభక్తి రూపంలోని ‘వారితో’ అనే నిర్మాణాన్ని దగ్గరగా నిలుపుతుంది. తరువాతి ‘జయిస్తుంది,’ ‘చంపుతుంది’ అనే క్రియలు ఈ యుద్ధం శత్రుత్వపూర్వకమని స్పష్టం చేస్తాయి.
- source_word: νικήσει
  choice: జయిస్తుంది
  rationale: νικάωలోని గెలవడం లేదా పైచేయి సాధించడం అనే సంఘర్షణ భావాన్ని ‘జయిస్తుంది’ సహజంగా నిలుపుతుంది.
- source_word: ἀποκτενεῖ
  choice: చంపుతుంది
  rationale: ఇది ప్రత్యక్షమైన, ఆధునిక తెలుగులో సహజమైన సమానార్థకం; మూలంలోని బలాన్ని తగ్గించదు లేదా మరింత ఆచారబద్ధంగా చేయదు.
theological_decisions:
- issue: ποιήσει μετ’ αὐτῶν πόλεμονలో శత్రుత్వ సంబంధాన్ని ఎలా వ్యక్తపరచాలి
  choice: వారితో యుద్ధం చేస్తుంది
  alternative: వారికి వ్యతిరేకంగా యుద్ధం చేస్తుంది
  rationale: మూల గ్రీకులో μετάతో ‘వారితో’ అనే నిర్మాణం ఉంది. తరువాత వచ్చే జయించడం, చంపడం అనే క్రియలు శత్రుత్వాన్ని సందేహం లేకుండా చూపుతాయి. అందువల్ల ప్రధాన పాఠం మూల నిర్మాణానికి దగ్గరగా ఉంటుంది; మరింత స్పష్టమైన భావానువాదాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని వరుస భవిష్యత్ క్రియలను తెలుగులో సమాంతర స్వతంత్ర క్రియలుగా ఉంచి, ‘వారిని’ అనే కర్మను రెండుసార్లు నిలిపాం. పాదటిప్పణి గుర్తును అది వివరించే యుద్ధపదబంధం వెంట ఉంచాం.
