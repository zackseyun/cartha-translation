source:
  edition: SBLGNT
  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: te
  text: వారు పరలోకం నుండి వారితో, “ఇక్కడికి పైకి రండి” అని చెప్పిన బిగ్గర స్వరాన్ని విన్నారు. వారు ఆ మేఘంలో[a] పరలోకానికి ఎక్కారు; వారి శత్రువులు వారిని గమనించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక మేఘంలో.” గ్రీకు పాఠంలో “ఆ మేఘంలో” అని ఉంది; ఇది దైవసన్నిధి, నిర్దోషిత్వ నిరూపణ లేదా విజయాన్ని సూచించే బైబిలులోని మేఘ దృశ్యాలను కూడా ప్రతిధ్వనింపజేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: విన్నారు
  rationale: ἀκούω యొక్క భూతకాల సంఘటనాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ఇక్కడ ‘ఆలకించారు’ అనే దీర్ఘకాలిక భావం అవసరం లేదు.
- source_word: φωνῆς μεγάλης
  choice: గొప్ప స్వరాన్ని
  rationale: μεγάλης పరిమాణం, బలం లేదా మహత్తును సూచించగలదు. ‘గొప్ప స్వరం’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది; సందర్భంలో అది బిగ్గర స్వరమని సహజంగా అర్థమవుతుంది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: దర్శనాత్మకమైన ఈ సందర్భంలో οὐρανός కేవలం ఆకాశాన్ని కాక పరలోకాన్ని సూచిస్తుంది.
- source_word: λεγούσης αὐτοῖς
  choice: తమతో ... అని చెబుతున్న
  rationale: స్వరాన్ని విశేషించే వర్తమాన కృదంత భావాన్నీ, αὐτοῖςలోని ‘వారితో/వారికి’ అనే సూచననూ స్పష్టంగా నిలుపుతుంది.
- source_word: Ἀνάβατε ὧδε
  choice: ఇక్కడికి పైకి రండి
  rationale: బహువచన ఆజ్ఞలోని పైకి రావాలనే పిలుపునూ, ὧδεలోని ‘ఇక్కడికి’ అనే స్థల సూచననూ సహజమైన తెలుగులో ఉంచుతుంది.
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: పరలోకానికి ఎక్కిపోయారు
  rationale: పైకి కదలడాన్ని, గమ్యాన్ని రెండింటినీ తెలియజేస్తుంది; ‘ఆరోహణమయ్యారు’ కంటే సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ἐν τῇ νεφέλῃ
  choice: ఆ మేఘంలో
  rationale: గ్రీకులోని నిర్దిష్ట ఉపపదాన్ని ‘ఆ’ ద్వారా నిలుపుతుంది; దైవసన్నిధి లేదా నిర్దోషిత్వ నిరూపణకు సంబంధించిన బైబిలు మేఘ దృశ్యాల ప్రతిధ్వని ఉండే అవకాశాన్ని తెరిచి ఉంచుతుంది.
- source_word: ἐθεώρησαν
  choice: చూస్తూ ఉన్నారు
  rationale: θεωρέωలోని శ్రద్ధగా గమనించడం అనే భావాన్ని, కేవలం ఒక్కసారి ‘చూశారు’ అనేదానికంటే బలంగా తెలియజేస్తుంది.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: వారి శత్రువులు
  rationale: స్వామ్య సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఆ మేఘం’లో ఉండే సంభావ్య బైబిలు ప్రతిధ్వని
  choice: ప్రధాన పాఠ్యంలో ‘ఆ మేఘంలో’ అని ఉంచడం
  alternative: ‘ఒక మేఘంలో’
  rationale: τῇ అనే నిర్దిష్ట ఉపపదం గుర్తించదగిన మేఘాన్ని సూచించవచ్చు; అది దైవసన్నిధి, సమర్థన లేదా విజయానికి సంబంధించిన బైబిలు దృశ్యాలను ప్రతిధ్వనింపజేయవచ్చు. అన్వయాన్ని ఖరారు చేయకుండా ఆ అవకాశాన్ని పదబంధమే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం వాడుతూ, దర్శన గ్రంథానికి తగిన గంభీరతను నిలిపింది. మూలంలోని వరుస ‘καὶ’లను తెలుగులో కృత్రిమంగా పునరావృతం చేయకుండా వాక్య విభజన, సంధిచిహ్నాలతో ప్రవాహవంతంగా అందించింది.
