- from: అప్పుడు వారు పరలోకం నుండి తమతో, “ఇక్కడికి పైకి రండి” అని చెబుతున్న గొప్ప స్వరాన్ని విన్నారు. వారు ఆ మేఘంలో[a] పరలోకానికి ఎక్కిపోయారు; వారి శత్రువులు వారిని చూస్తూ ఉన్నారు.
