id: REV.11.5
reference: Revelation 11:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: te
  text: ఎవరైనా వారికి హాని చేయాలని కోరితే, వారి నోటి[a] నుండి అగ్ని బయలుదేరి వారి శత్రువులను దహించివేస్తుంది. ఎవరైనా వారికి హాని చేయాలని కోరితే, అతడు ఈ విధంగానే చంపబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘వారి నోటి నుండి’ అని ఉంది—స్వామ్య సర్వనామం బహువచనంలో ఉన్నా, ‘నోరు’ ఏకవచనంలో ఉంది. దీనిని ‘వారి నోళ్ల నుండి’ అని కూడా అనువదించవచ్చు.
    reason: మూలంలోని ఏకవచన నామవాచకం మరియు బహువచన స్వామ్య నిర్మాణాన్ని వివరించి, సహజమైన తెలుగు ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: హాని చేయాలని
  rationale: ఈ దర్శన సందర్భంలో ఇద్దరు సాక్షులకు వ్యతిరేకంగా జరిగే శత్రుత్వ చర్యను సూచిస్తుంది. ‘హాని చేయడం’ అనేది అన్యాయం అనే భావానికే పరిమితం కాకుండా మూలపద పరిధిని సహజంగా తెలియజేస్తుంది.
- source_word: πῦρ
  choice: అగ్ని
  rationale: దర్శనంలోని సజీవమైన ప్రతీకాత్మక భాషను వ్యాఖ్యానించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: వారి నోటి నుండి ... బయలుదేరి
  rationale: ఏకవచనమైన στόματος (‘నోరు’)ను బహువచన స్వామ్యంతో ఉన్నట్టుగానే ఉంచి, గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: κατεσθίει
  choice: దహించివేస్తుంది
  rationale: అగ్ని శత్రువులను పూర్తిగా నాశనం చేసే బలమైన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘మింగివేస్తుంది’ కూడా సాధ్యమైన రూపం.
- source_word: ἐχθροὺς
  choice: శత్రువులను
  rationale: మూలపదానికి స్పష్టమైన, ప్రామాణిక ఆధునిక తెలుగు సమానం.
- source_word: θέλει / θελήσῃ
  choice: కోరితే
  rationale: రెండు షరతు వాక్యాల్లోనూ θέλω యొక్క సంకల్ప భావాన్ని సహజంగా తెలియజేస్తుంది. రెండవ క్రియలోని సంభావ్యతను తెలుగు షరతు రూపమే తగినంతగా మోస్తుంది.
- source_word: οὕτως
  choice: ఈ విధంగానే
  rationale: ముందు వివరించిన అగ్ని ద్వారా సంభవించే మరణ విధానాన్ని వెనక్కి సూచిస్తుంది; ‘-నే’ దాని బలాన్ని నిలుపుతుంది.
- source_word: δεῖ
  choice: చంపబడాలి
  rationale: అవసరం లేదా అనివార్యతను తెలిపే δεῖ యొక్క బలాన్ని ‘-బడాలి’ రూపం సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἀποκτανθῆναι
  choice: చంపబడాలి
  rationale: మూలంలోని కర్మణి క్రియారూపాన్ని ప్రత్యక్షమైన, ఆధునిక తెలుగు కర్మణి నిర్మాణంతో నిలుపుతుంది.
theological_decisions:
- issue: నోటి నుండి బయలుదేరే అగ్ని అక్షరార్థమా లేక తీర్పును సూచించే ప్రతీకా
  choice: ‘వారి నోటి నుండి అగ్ని బయలుదేరి’ అనే చిత్రణను వ్యాఖ్యానించకుండా నిలుపడం
  alternative: దీనిని తీర్పు ప్రకటించే మాటగా లేదా వారి ద్వారా వచ్చే విధ్వంసక తీర్పుగా వివరణాత్మకంగా అనువదించడం
  rationale: గ్రీకు పాఠం ప్రతీకను నేరుగా అందిస్తుంది. దాని అక్షరార్థ లేదా ప్రతీకాత్మక స్వభావాన్ని అనువాదంలో నిర్ణయించకుండా పాఠకునికి తెరిచి ఉంచాలి.
- issue: οὕτως సూచించే మరణ విధానం
  choice: ‘ఈ విధంగానే’ అని ముందు చెప్పిన అగ్ని-తీర్పుకు అనుసంధానించడం
  alternative: సాధారణంగా ‘అలాగే’ అని బలహీనంగా అనువదించడం లేదా దేవుని తీర్పు అని స్పష్టీకరించడం
  rationale: οὕτως ముందున్న విధానాన్ని సూచిస్తుంది; అయితే పాఠంలో లేని అదనపు కర్తను లేదా సిద్ధాంత వివరణను చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. దర్శనాత్మక చిత్రణను అలాగే ఉంచి, పాతకాలపు లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం. గ్రీకులోని ‘నోరు’ ఏకవచనాన్ని ప్రధాన పాఠంలో నిలిపి, సహజమైన బహువచన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
