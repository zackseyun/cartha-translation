id: REV.11.15
reference: Revelation 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: te
  text: 'ఏడవ దూత బూర ఊదాడు[a]. అప్పుడు పరలోకంలో బిగ్గరగా వినిపించిన స్వరాలు ఇలా పలికాయి: “లోకపు రాజ్యం మన ప్రభువుకూ, ఆయన మెస్సీయకూ[b] చెందింది; ఆయన యుగయుగాల వరకు[c] ఏలుతాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతులలో ‘లోక రాజ్యాలు అయ్యాయి’ లేదా ‘ఈ లోక రాజ్యం అయింది’ అని ఉంది. SBLGNT పాఠంలో ఏకవచనంగా ‘లోక రాజ్యం అయింది’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా ‘ఆయన క్రీస్తుకు.’ ఇక్కడ గ్రీకు Χριστός బిరుదుగా వాడబడినందున ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో అక్షరార్థంగా ‘యుగాల యుగాల వరకు’ అని ఉంది; ఇది అంతం లేని కాలాన్ని సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: బూర ఊదాడు
  rationale: σαλπίζω అంటే బూర మోగించడం. తెలుగులో ‘బూర ఊదాడు’ సహజంగా ఉండి, గ్రీకు క్రియలో అంతర్లీనంగా ఉన్న వాద్యాన్ని స్పష్టం చేస్తుంది.
- source_word: φωναὶ μεγάλαι
  choice: గొప్ప స్వరాలు
  rationale: φωνή ఇక్కడ λέγοντεςతో కలిసి మాటలాడే స్వరాలను సూచిస్తుంది. μεγάλαι శబ్దబలాన్ని సూచించినప్పటికీ, ప్రకటన యొక్క ఘనతను కూడా మోసే ‘గొప్ప’ అనే పదం మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: ఈ ప్రకటన సందర్భంలో οὐρανός భౌతిక ఆకాశం కంటే పరలోక పరిధిని సూచిస్తుంది.
- source_word: λέγοντες
  choice: ఇలా పలికాయి
  rationale: తెలుగులో స్వరాలు పలికినట్లు చెప్పడం సహజం. స్త్రీలింగ φωναίతో పురుషలింగ λέγοντες ఉన్న గ్రీకు వాక్యనిర్మాణ అసాధారణతను కృత్రిమంగా అనుకరించకుండా భావాన్ని అందిస్తుంది.
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: లోక రాజ్యం ... అయింది
  rationale: SBLGNTలో βασιλεία ఏకవచనం కాబట్టి ‘రాజ్యం’ అని ఉంచబడింది. ἐγένετο యొక్క పూర్తయిన ప్రకటనాత్మక భావాన్ని ‘అయింది’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ
  choice: మన ప్రభువుదీ, ఆయన మెస్సీయదీ
  rationale: గ్రీకు షష్ఠీ విభక్తి ఇక్కడ రాజ్యం ఎవరిదైందో తెలియజేస్తుంది. తెలుగు ‘-దీ’ నిర్మాణం ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా చూపుతుంది.
- source_word: καὶ βασιλεύσει
  choice: ఆయన ... ఏలుతాడు
  rationale: βασιλεύσει ఏకవచన భవిష్యత్ క్రియ. ‘ఆయన’ అనే ఏకవచన సర్వనామం గ్రీకు వచనాన్ని కాపాడుతూ, దాని పూర్వపదం గురించిన సంక్షిప్తతను పరిష్కరించదు.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాలు
  rationale: అక్షరార్థంగా ‘యుగాల యుగాల వరకు’ అనే ఈ గ్రీకు నానుడి అంతం లేని కాలాన్ని సూచిస్తుంది. ‘యుగయుగాలు’ దానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
theological_decisions:
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ τοῦ χριστοῦ αὐτοῦ (‘ఆయన అభిషిక్తుడు/మెస్సీయ’) అనే సంబంధం వల్ల Χριστός వ్యక్తినామంలా కాక బిరుదుగా పనిచేస్తుంది. అందువల్ల ‘మెస్సీయ’ బిరుదు భావాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: βασιλεύσει క్రియ యొక్క కర్త
  choice: ఆయన ఏలుతాడు
  alternative: వారు ఏలుతారు / ప్రభువూ ఆయన మెస్సీయా ఏలుతారు
  rationale: గ్రీకులో క్రియ ఏకవచనంలో ఉంది. కాబట్టి అనువాదం ఏకవచనాన్ని కాపాడుతుంది; అయితే ‘ఆయన’ ఎవరిని సూచిస్తుందో మూలం కంటే ఎక్కువగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రకటన శైలి వాడబడింది. ‘బూర,’ ‘పరలోకం,’ ‘మెస్సీయ,’ ‘ఏలుతాడు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి ప్రకటన గ్రంథపు ఘనతను నిలుపుతాయి. గ్రీకులోని ఏకవచన రాజ్యం మరియు ఏకవచన పాలక క్రియ రెండూ కాపాడబడ్డాయి.
