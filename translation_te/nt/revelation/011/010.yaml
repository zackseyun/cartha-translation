id: REV.11.10
reference: Revelation 11:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: te
  text: భూమిమీద నివసించేవారు[a] వారి విషయమై సంతోషిస్తారు మరియు సంబరపడతారు[b], ఒకరికొకరు కానుకలు పంపుతారు; ఎందుకంటే ఈ ఇద్దరు ప్రవక్తలు భూమిమీద నివసించేవారిని యాతనపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భూనివాసులు.’ ప్రకటన గ్రంథంలో ఈ మాట దేవునికి విరోధంగా ఉన్న లోకాన్ని సూచించడానికి తరచుగా ఉపయోగించబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఉల్లాసంగా వేడుక చేసుకుంటారు.’ గ్రీకు క్రియ ఉత్సవపూర్వకమైన ఆనందాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς / τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: భూమిమీద నివసించేవారు / భూమిమీద నివసించేవారిని
  rationale: ప్రకటన గ్రంథంలో పునరావృతమయ్యే ఈ ప్రయోగంలోని క్రియాత్మక భావాన్ని, ఈ వచనంలో రెండుసార్లు వచ్చే పదబంధ సారూప్యాన్ని నిలుపుతుంది.
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: వారి విషయంలో సంతోషించి
  rationale: ఇద్దరు ప్రవక్తలకు జరిగిన దానిని బట్టి భూనివాసులు సంతోషిస్తున్నారనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘వారి వల్ల’ అని కారణాన్ని అతిగా నిర్ధారించదు.
- source_word: εὐφραίνονται
  choice: సంబరపడతారు
  rationale: χαίρουσιν నుండి భిన్నమైనప్పటికీ దానికి సంబంధించిన ఉత్సవపూర్వక ఆనందాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: ఒకరికొకరు కానుకలు పంపుకుంటారు
  rationale: కానుకలు పంపే పరస్పర చర్యను సహజంగా తెలియజేస్తుంది; ‘మార్పిడి చేసుకుంటారు’ అనే అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: οὗτοι οἱ δύο προφῆται
  choice: ఈ ఇద్దరు ప్రవక్తలు
  rationale: నిర్దేశక సర్వనామంతో కూడిన గ్రీకు నామవాచక పదబంధానికి సరళమైన, సహజమైన తెలుగు రూపం.
- source_word: ἐβασάνισαν
  choice: యాతనపెట్టారు
  rationale: βασανίζωలోని తీవ్రమైన బాధ లేదా వేదన భావాన్ని ‘బాధపెట్టారు’ వంటి మృదువైన పదం కంటే బలంగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రకటన గ్రంథంలో దేవునికి విరోధంగా ఉన్న లోకాన్ని సూచించే పునరావృత పదబంధం
  choice: భూమిమీద నివసించేవారు
  alternative: భూనివాసులు
  rationale: ఇది కేవలం భౌగోళిక నివాసాన్ని మాత్రమే కాక ప్రకటన గ్రంథంలోని పునరావృత భావభారాన్ని కూడా పాఠకుడు గుర్తించేందుకు వీలు కల్పిస్తుంది; ప్రధాన పాఠ్యంలో ఆ భావాన్ని విపులీకరించి వ్యాఖ్యానించదు.
- issue: ఇద్దరు సాక్షుల ప్రభావం యొక్క తీవ్రత
  choice: యాతనపెట్టారు
  alternative: బాధపెట్టారు
  rationale: మూలపాఠంలోని తీవ్రమైన పదాన్ని మృదువుచేయకుండా అనువదిస్తుంది; యాతన ఏ రూపంలో కలిగిందో అదనంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘నివసించేవారు’ అనే రూపాన్ని రెండుసార్లు ఒకే విధంగా ఉంచి మూలంలోని పునరావృతాన్ని కాపాడాం; ‘సంతోషించి సంబరపడతారు’ అనే జత సమీపార్థక గ్రీకు క్రియల మధ్య స్వల్ప భేదాన్ని సహజంగా నిలుపుతుంది.
