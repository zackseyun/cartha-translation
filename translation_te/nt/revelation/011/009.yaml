id: REV.11.9
reference: Revelation 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: te
  text: ప్రజలలోనుండి, గోత్రాలనుండి, భాషలవారిలోనుండి, జనాంగాలనుండి కొందరు వారి మృతదేహాన్ని మూడున్నర రోజుల పాటు చూస్తూ ఉంటారు[a]; వారి మృతదేహాలను సమాధిలో ఉంచడానికి అనుమతించరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో మొదట ‘వారి మృతదేహం’ అని ఏకవచనంలో, తరువాత ‘వారి మృతదేహాలు’ అని బహువచనంలో ఉంది. మొదటి ఏకవచనం ఇద్దరు సాక్షులను ఒక సమష్టిగా చూపి, తరువాత వారి వ్యక్తిగత దేహాలకు మారవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπουσιν
  choice: చూస్తూ ఉంటారు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న, సజీవమైన దృశ్యభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: ప్రజల్లోనూ గోత్రాల్లోనూ వివిధ భాషలవారిలోనూ జనాల్లోనూ కొందరు
  rationale: ἐκ సూచించే సమూహాల్లోని కొందరు అనే భాగార్థాన్ని స్పష్టంగా ఉంచుతూ, ప్రకటన గ్రంథంలోని నాలుగు భాగాల జాబితాను నిలుపుతుంది.
- source_word: λαῶν
  choice: ప్రజలు
  rationale: వేర్వేరు సామూహిక ప్రజావర్గాలను సూచించే బహువచన భావాన్ని కాపాడుతుంది.
- source_word: φυλῶν
  choice: గోత్రాలు
  rationale: ప్రకటన గ్రంథంలోని ప్రజావర్గాల జాబితాకు సరిపోయే సాధారణ ఆధునిక పదం.
- source_word: γλωσσῶν
  choice: వివిధ భాషలవారు
  rationale: ఇక్కడ భాషల ద్వారా ఆయా భాషలు మాట్లాడే వర్గాలు సూచించబడుతున్నందున, తెలుగులో సహజంగా అర్థమయ్యేలా వ్యక్తులను సూచించే రూపం వాడబడింది.
- source_word: ἐθνῶν
  choice: జనాలు
  rationale: ఈ సూత్రబద్ధ జాబితాలో విస్తృతమైన జనసమూహాలను సూచిస్తుంది; ‘అన్యజనులు’ అని అనువదించడం సందర్భాన్ని అనవసరంగా కుదిస్తుంది.
- source_word: τὸ πτῶμα αὐτῶν
  choice: వారి మృతదేహాన్ని
  rationale: ఇద్దరు సాక్షులు ఉద్దేశించబడినా, మొదటి ఉపవాక్యంలో ఉన్న ఏకవచనాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: మూడున్నర రోజుల పాటు
  rationale: కాలవ్యవధిని సహజమైన ఆధునిక తెలుగులో ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: τὰ πτώματα αὐτῶν
  choice: వారి మృతదేహాలను
  rationale: రెండవ ఉపవాక్యంలో గ్రీకు పాఠం బహువచనానికి మారడాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οὐκ ἀφίουσιν
  choice: ఉంచనివ్వరు
  rationale: ἀφίημι ఇక్కడ ‘అనుమతించు’ అనే అర్థంలో ఉంది; నిరాకరణతో కలిపి ఈ తెలుగు రూపం సహజంగా ఉంటుంది.
- source_word: τεθῆναι εἰς μνῆμα
  choice: సమాధిలో ఉంచడం
  rationale: సాధారణంగా ‘పాతిపెట్టడం’ కంటే, మృతదేహాలను సమాధిలో ఉంచే నిర్దిష్ట చర్యను దగ్గరగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: మొదటి ఉపవాక్యంలో ఏకవచన πτῶμα, రెండవ ఉపవాక్యంలో బహువచన πτώματα
  choice: మొదట ‘వారి మృతదేహాన్ని’ అని ఏకవచనం, తరువాత ‘వారి మృతదేహాలను’ అని బహువచనం ఉంచడం
  alternative: తెలుగు శైలిని సులభతరం చేయడానికి రెండు చోట్లా ‘వారి మృతదేహాలను’ అని బహువచనం వాడడం
  rationale: మూలపాఠంలోని సంఖ్యామార్పు అర్థవంతమైనదై ఉండవచ్చు. మొదటి ఏకవచనం ఇద్దరు సాక్షులను ఒక సమష్టి సాక్ష్యంగా చూపవచ్చు; తరువాతి బహువచనం వారిని వ్యక్తులుగా సూచిస్తుంది. అనువాదం ఈ సందిగ్ధతను పరిష్కరించకుండా కనిపించేలా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ప్రకటన గ్రంథంలోని సూత్రబద్ధ ప్రజావర్గాల జాబితా మరియు మూలంలోని ఏకవచన–బహువచన ఉద్రిక్తత రెండూ నిలుపబడ్డాయి.
