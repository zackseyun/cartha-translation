id: REV.11.13
reference: Revelation 11:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: te
  text: ఆ గంటలో గొప్ప భూకంపం సంభవించింది. పట్టణపు పదోవంతు కూలిపోయింది. ఆ భూకంపంలో ఏడువేల మంది[a] చంపబడ్డారు. మిగిలినవారు భయభ్రాంతులై పరలోక దేవునికి మహిమ చెల్లించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మనుషుల పేర్లు—ఏడువేలు”; ఇది చనిపోయినవారి సంఖ్య ఏడువేలుగా నమోదైందని తెలిపే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ఆ గంటలోనే
  rationale: కాలసూచక పదబంధంలోని తక్షణత్వాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది; ‘ఆ సమయంలో’ అనేది సాధ్యమైనా మరింత సాధారణీకరిస్తుంది.
- source_word: ἐγένετο σεισμὸς μέγας
  choice: గొప్ప భూకంపం సంభవించింది
  rationale: σεισμός యొక్క ప్రత్యక్ష అర్థాన్ని, μέγας యొక్క బలాన్ని స్పష్టంగా మరియు గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: τὸ δέκατον τῆς πόλεως ἔπεσεν
  choice: పట్టణంలో పదోవంతు కూలిపోయింది
  rationale: నగరంలోని నిర్దిష్ట భాగాన్ని సూచించే విభక్తి భావాన్ని నిలుపుతుంది; సందర్భంలో ‘కూలిపోయింది’ అనేది ‘పడిపోయింది’ కంటే సహజంగా ఉన్నా విధ్వంస స్వరూపాన్ని అతిగా వివరించదు.
- source_word: ἀπεκτάνθησαν
  choice: చంపబడ్డారు
  rationale: క్రియలోని కర్మణి రూపాన్ని నిలుపుతుంది. ‘మరణించారు’ అనేది కారణకర్తృక భావాన్ని తగ్గిస్తుంది.
- source_word: ὀνόματα ἀνθρώπων χιλιάδες ἑπτά
  choice: ఏడువేల మంది[a]
  rationale: ‘మనుషుల పేర్లు’ అనే మూలభాషా ప్రయోగం లెక్కించబడిన వ్యక్తులను సూచిస్తుంది; తెలుగులో భావాన్ని సహజంగా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: οἱ λοιποὶ
  choice: మిగిలినవారు
  rationale: ‘బతికి మిగిలినవారు’ అని విస్తరించకుండా గ్రీకు పదంలోని తటస్థ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἔμφοβοι ἐγένοντο
  choice: భయభ్రాంతులై
  rationale: వారు భయస్థితిలోకి వచ్చిన భావాన్ని, ἔμφοβοι లోని తీవ్రతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔδωκαν δόξαν
  choice: మహిమ చెల్లించారు
  rationale: బైబిలు సంబంధమైన స్థిర ప్రయోగాన్ని సహజ తెలుగులో నిలుపుతుంది; ఇది కేవలం ‘గౌరవించారు’ కంటే మూలంలోని δόξα భావానికి దగ్గరగా ఉంది.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: పరలోక దేవునికి
  rationale: సంబంధ విభక్తితో ఉన్న బిరుదును సంక్షిప్తంగా, సహజంగా అందిస్తుంది; ‘పరలోకంలో ఉన్న దేవునికి’ అని స్థలార్థంగా మార్చదు.
theological_decisions:
- issue: మిగిలినవారి ప్రతిస్పందన నిజమైన పశ్చాత్తాపమా లేదా భయంతో దేవుని శక్తిని అంగీకరించడమేనా
  choice: ‘భయభ్రాంతులై పరలోక దేవునికి మహిమ చెల్లించారు’ అని తటస్థంగా అనువదించడం
  alternative: ‘పశ్చాత్తాపపడి దేవుణ్ణి మహిమపరిచారు’ లేదా ‘భయంతో ఆయన శక్తిని ఒప్పుకున్నారు’ అని అంతర్భావాన్ని నిర్ధారించడం
  rationale: గ్రీకు పాఠం భయాన్ని, దేవునికి మహిమ చెల్లించడాన్ని మాత్రమే స్పష్టంగా చెబుతుంది; ఆ ప్రతిస్పందన రక్షణాత్మక విశ్వాసమా కాదా అని నిర్ధారించదు. అందువల్ల ఆ వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ప్రకటన గ్రంథపు గంభీరతను నిలుపుతూ రూపొందించబడింది. ప్రతి వాక్యఖండాన్ని విడదీసి పఠనసౌలభ్యం కల్పించబడింది.
