- from: ఆ గంటలోనే గొప్ప భూకంపం సంభవించింది. పట్టణంలో పదోవంతు కూలిపోయింది. ఆ భూకంపంలో ఏడువేల మంది[a] చంపబడ్డారు. మిగిలినవారు భయభ్రాంతులై పరలోక దేవునికి మహిమ చెల్లించారు.
  to: ఆ గంటలో గొప్ప భూకంపం సంభవించింది. పట్టణపు పదోవంతు కూలిపోయింది. ఆ భూకంపంలో ఏడువేల మంది[a] చంపబడ్డారు. మిగిలినవారు భయభ్రాంతులై పరలోక దేవునికి మహిమ చెల్లించారు.
