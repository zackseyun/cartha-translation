id: REV.11.6
reference: Revelation 11:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: te
  text: వీరు తమ ప్రవచన దినాల్లో వర్షం కురవకుండా ఆకాశాన్ని[a] మూసివేసే అధికారం కలిగివున్నారు. నీళ్లపై వాటిని రక్తంగా మార్చే అధికారం వారికి ఉంది; అలాగే తాము కోరినప్పుడల్లా ప్రతి తెగులుతో భూమిని కొట్టే అధికారం కూడా వారికి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకాన్ని.’ గ్రీకు οὐρανός అనే పదానికి ‘పరలోకం,’ ‘ఆకాశం’ అనే రెండు అర్థాలూ ఉండవచ్చు; ఇక్కడ వర్షం ప్రస్తావన ఉన్నందున ‘ఆకాశం’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: వీరు
  rationale: ముందు ప్రస్తావించిన ఇద్దరు సాక్షులను సూచిస్తుంది; అయితే గ్రీకు వాక్యంలో ‘ఇద్దరు’ అని మళ్లీ లేదు కాబట్టి దాన్ని చేర్చలేదు.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: కేవలం సామర్థ్యాన్ని కాక, వారికి అనుగ్రహించబడిన హక్కు లేదా అధికార పరిధిని తెలియజేస్తుంది.
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: ఆకాశాన్ని మూసివేసే
  rationale: వర్షాన్ని నిలిపివేయడం తక్షణ సందర్భం కాబట్టి οὐρανός కు సహజమైన సందర్భోచిత అర్థమైన ‘ఆకాశం’ను ఎంచుకున్నాం.
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: వర్షం కురవకుండా
  rationale: ఆకాశాన్ని మూసివేయడంలోని ఉద్దేశం లేదా ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: తమ ప్రవచన దినాల్లో
  rationale: వారు ప్రవచించే కాలాన్ని సూచించే గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἐπὶ τῶν ὑδάτων
  choice: నీళ్లను
  rationale: ἐξουσία భావం తరువాతి క్రియతో తెలుగులో సహజంగా కలిసేలా, నీళ్లపై ఉన్న అధికారాన్ని ‘నీళ్లను ... మార్చడానికి’ అనే నిర్మాణంలో వ్యక్తం చేశాం.
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: నీళ్లను రక్తంగా మార్చడానికి
  rationale: నీళ్లు రక్తంగా రూపాంతరం చెందే చిత్రణను నేరుగా, స్పష్టంగా నిలుపుతుంది.
- source_word: πατάξαι τὴν γῆν
  choice: భూమిని కొట్టడానికి
  rationale: అపోకలిప్టిక్ చిత్రణను మృదువుపరచకుండా, ప్రస్తుత తెలుగులో అర్థమయ్యే నేరమైన పదబంధం.
- source_word: ἐν πάσῃ πληγῇ
  choice: ప్రతి తెగులుతో
  rationale: ἐν యొక్క సాధనార్థక భావాన్ని, πάσῃ యొక్క సంపూర్ణతను అనవసరంగా ‘ప్రతి విధమైన’ అని విస్తరించకుండా నిలుపుతుంది.
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: తాము కోరినప్పుడల్లా
  rationale: వారు కోరే ప్రతిసారి అనే పునరావృత సంభావ్యతను సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ ఇద్దరు సాక్షుల కార్యాల్లో ఏలీయా, మోషేలను జ్ఞాపకం చేసే సూచనలు
  choice: అద్భుత కార్యాలను నేరమైన భాషలో అలాగే ఉంచడం
  alternative: అవి కేవలం ప్రతీకాత్మకమని అనువాదంలోనే వివరించడం
  rationale: ఈ వాక్యం వాటిని సాక్షులకు ఇవ్వబడిన అధికారపు కార్యాలుగా చెబుతుంది. అవి అక్షరార్థమా, ప్రతీకాత్మకమా, రెండూ కలిసినవా అనే ఉద్రిక్తతను అనువాదం పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘కలిగివున్నారు’ మరియు ‘అధికారం’ గంభీరతను నిలుపుతాయి; అద్భుత కార్యాల అపోకలిప్టిక్ తీవ్రతను తగ్గించలేదు.
