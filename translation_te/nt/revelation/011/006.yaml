  terminology: అధికారం appropriately renders ἐξουσία. ఆకాశం is the contextually appropriate rendering of οὐρανός; the footnote preserves the alternative “heaven.” తెగులు and భూమిని కొట్టడం retain the apocalyptic plague-and-striking imagery without interpretive expansion.
