id: REV.11.8
reference: Revelation 11:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: te
  text: వారి మృతదేహం[a] ఆ మహానగరపు[c] విశాల వీధిలో పడి ఉంటుంది. ఆ నగరం ఆధ్యాత్మికంగా[b] “సొదొమ” అనీ “ఐగుప్తు” అనీ పిలువబడుతుంది; అక్కడే వారి ప్రభువు కూడా సిలువ వేయబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘మృతదేహం’ ఏకవచనంలో ఉంది; అది ఇద్దరు సాక్షులను ఒక సమష్టిగా చూపవచ్చు. కొన్ని అనువాదాలు ‘మృతదేహాలు’ అని బహువచనంలో ఇస్తాయి.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘అలంకారార్థంగా’ లేదా ‘ప్రతీకాత్మకంగా.’
    reason: lexical_alternative
  - marker: c
    text: ‘వారి ప్రభువు కూడా సిలువ వేయబడిన’ స్థలం అనే మాట యెరూషలేమును సూచిస్తుంది; అయితే మూలపాఠం ‘మహానగరం’ అనే ప్రతీకాత్మక సంజ్ఞనే ఉపయోగిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: వారి మృతదేహం
  rationale: πτῶμα పడిపోయిన మృతదేహాన్ని సూచిస్తుంది. గ్రీకులో ఏకవచనం ఉన్నందున, ఇద్దరు సాక్షులను ఒక సమష్టిగా చూపే భావాన్ని తెలుగులోనూ ఏకవచనంతో నిలిపాం.
- source_word: ἐπὶ τῆς πλατείας
  choice: విశాల వీధిలో
  rationale: πλατεῖα విశాలమైన వీధిని లేదా బహిరంగ కూడలిని సూచించవచ్చు. నగర దృశ్యానికి సహజంగా సరిపోతూ పదంలోని విశాలత భావాన్ని కాపాడేందుకు ‘విశాల వీధిలో’ అని అనువదించాం.
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: ఆ మహానగరపు
  rationale: ప్రకటన గ్రంథంలో ప్రాముఖ్యమైన ‘మహానగరం’ అనే అపోకలిప్టిక్ సంజ్ఞను వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలిపాం.
- source_word: πνευματικῶς
  choice: ఆధ్యాత్మికంగా
  rationale: గ్రీకు క్రియావిశేషణానికి సూటి సమానార్థకం. ఇది ఆ నగరానికి ఆధ్యాత్మిక లేదా సంకేతాత్మక నామకరణమని తెలియజేస్తుంది; ‘అలంకారార్థంగా’ అనే వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: సొదొమ అనీ ఐగుప్తు అనీ
  rationale: రెండు ప్రతీకాత్మక స్థలనామాలను సాంప్రదాయిక తెలుగు బైబిలు రూపాల్లో ఉంచి, వాటి సూచనార్థాన్ని ప్రధాన వాక్యంలో విప్పి చెప్పలేదు.
- source_word: ὅπου καὶ
  choice: అక్కడే ... కూడా
  rationale: ὅπου యొక్క స్థలార్థాన్నీ καί యొక్క అదనపు ఉద్ఘాటననూ సహజమైన తెలుగు నిర్మాణంలో కాపాడుతుంది.
- source_word: ὁ κύριος αὐτῶν
  choice: వారి ప్రభువు
  rationale: κύριος యొక్క దైవశాస్త్రపరమైన బరువును ‘ప్రభువు’ నిలుపుతుంది; αὐτῶν ఇద్దరు సాక్షులను సూచిస్తుంది.
- source_word: ἐσταυρώθη
  choice: సిలువ వేయబడ్డాడు
  rationale: σταυρόω యొక్క భూతకాల కర్మణి భావాన్ని తెలుగులో ప్రామాణికంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఇద్దరు సాక్షులను సూచిస్తున్నప్పటికీ πτῶμα ఏకవచనంలో ఉండడం
  choice: వారి మృతదేహం
  alternative: వారి మృతదేహాలు
  rationale: మూలపాఠంలోని ఏకవచనం ఇద్దరు సాక్షులను ఒక సమష్టిగా చూపవచ్చు. దాన్ని బహువచనంగా సరిచేయకుండా, తెలుగులో అర్థమయ్యే విధంగా ఏకవచనాన్నే నిలిపాం.
- issue: πνευματικῶς యొక్క భావం
  choice: ఆధ్యాత్మికంగా
  alternative: అలంకారార్థంగా / ప్రతీకాత్మకంగా
  rationale: సూటి పదార్థాన్ని ప్రధాన పాఠంలో ఉంచడం ద్వారా ఆధ్యాత్మికతకూ ప్రతీకాత్మకతకూ మధ్యనున్న భావ విస్తృతిని ముందుగానే కుదించలేదు.
- issue: ‘మహానగరం’ ఏ నగరమనే గుర్తింపు
  choice: ప్రధాన పాఠంలో ‘మహానగరం’ అనే ప్రతీకాత్మక సంజ్ఞనే ఉంచడం
  alternative: యెరూషలేము అని స్పష్టంగా పేర్కొనడం
  rationale: ‘అక్కడే వారి ప్రభువు ... సిలువ వేయబడ్డాడు’ అనే మాట యెరూషలేమును బలంగా సూచిస్తుంది; అయినా మూలపాఠం ఆ పేరును నేరుగా చెప్పకుండా అపోకలిప్టిక్ సంజ్ఞను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని ఉపయోగించాం. మూలంలోని దీర్ఘ వాక్యాన్ని తెలుగులో సహజమైన రెండు వాక్యాలుగా విభజించినా, సంబంధాలు మరియు ప్రతీకాత్మక ఉద్రిక్తతను యథాతథంగా ఉంచాం.
