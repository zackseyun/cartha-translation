id: REV.11.16
reference: Revelation 11:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: te
  text: దేవుని సన్నిధిలో తమ సింహాసనాల మీద కూర్చున్న ఇరవై నలుగురు పెద్దలు సాష్టాంగపడి దేవుణ్ణి ఆరాధించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: పెద్దలు
  rationale: ప్రకటన గ్రంథంలోని పరలోక సభకు చెందిన వ్యక్తులను సూచించే స్థిరమైన, సహజమైన తెలుగు పదం; కేవలం వృద్ధులు అనే వయోభావానికి పరిమితం కాదు.
- source_word: ἐνώπιον
  choice: సన్నిధిలో
  rationale: దేవుని ఎదుట, ఆయన సమక్షంలో ఉన్న స్థితిని గౌరవప్రదమైన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: καθήμενοι
  choice: కూర్చున్న
  rationale: వారు అప్పటికే కూర్చొని ఉన్న కొనసాగుతున్న స్థితిని అసమాపక క్రియ ద్వారా సహజంగా నిలుపుతుంది.
- source_word: ἐπὶ τοὺς θρόνους αὐτῶν
  choice: తమ సింహాసనాల మీద
  rationale: సింహాసనాలపై వారి స్థానాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; αὐτῶν లోని స్వాధీన భావాన్ని ‘తమ’ నిలుపుతుంది.
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: సాష్టాంగపడి
  rationale: ముఖం నేలకు ఆనేటట్లు పడే ఆరాధనా భంగిమను సహజ తెలుగు వాడుకలో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: προσεκύνησαν
  choice: ఆరాధించారు
  rationale: ఇక్కడ క్రియకు దేవుడే కర్మ కావడం, పరలోక సింహాసన దృశ్యం కావడం వల్ల మతపరమైన ఆరాధన భావమే ప్రధానమైనది.
- source_word: θεῷ / θεοῦ
  choice: దేవుడు / దేవుని / దేవుణ్ణి
  rationale: θεός కు ప్రామాణిక తెలుగు సమానం; వాక్యంలోని విభక్తులకు అనుగుణంగా రూపాంతరం చేయబడింది.
- source_word: οἱ εἴκοσι τέσσαρες
  choice: ఇరవై నలుగురు
  rationale: వ్యక్తుల సంఖ్యను తెలిపే సహజ ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: పరలోక ఆరాధనా దృశ్యంలో προσκυνέω భావం
  choice: ఆరాధించారు
  alternative: నమస్కరించారు / భక్తితో వంగారు
  rationale: క్రియ దేవునివైపు నేరుగా ఉద్దేశించబడినందున సాధారణ గౌరవప్రదర్శనకన్నా ఆరాధన భావం ప్రధానమైనది; అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా దానిని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సాష్టాంగపడి’ మూలంలోని ముఖం మీద పడే భంగిమను తెలుగులో సులభంగా గ్రహించగల ఆరాధనా పదబంధంగా అందిస్తుంది; వెంటనే వచ్చే ‘ఆరాధించారు’తో చర్య యొక్క ఉద్దేశం స్పష్టమవుతుంది.
