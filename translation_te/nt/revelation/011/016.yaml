  source_fidelity: 'మూల గ్రీకు వాక్యంలోని అన్ని ప్రధాన అంశాలు సరిగ్గా ప్రతిఫలించాయి: నిర్దిష్టమైన ఇరవై నలుగురు పెద్దలు, దేవుని సన్నిధి, వారి సొంత సింహాసనాలపై కూర్చున్న స్థితి, ముఖప్రణామాన్ని సూచించే పడిపోవడం, దేవునికే ఆరాధన చేయడం. ‘సాష్టాంగపడి’ అనేది ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν అనే ప్రణామ భంగిమకు సహజమైన తెలుగు సమానం; ‘ఆరాధించారు’ προσεκύνησαν యొక్క సందర్భానుకూల మతపరమైన అర్థాన్ని కాపాడుతుంది.'
