- from: పరలోకంలో ఉన్న దేవుని ఆలయం[a] తెరవబడింది. ఆయన ఆలయంలో ఆయన నిబంధన మందసం[b] కనిపించింది. అప్పుడు మెరుపులు, ధ్వనులు[c], ఉరుములు, భూకంపం, పెద్ద వడగండ్లు సంభవించాయి.
