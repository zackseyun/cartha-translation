id: REV.11.19
reference: Revelation 11:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: te
  text: పరలోకంలో ఉన్న దేవుని ఆలయం[a] తెరవబడింది. ఆయన ఆలయంలో ఆయన నిబంధన మందసం[b] కనిపించింది. అప్పుడు మెరుపులు, ధ్వనులు[c], ఉరుములు, భూకంపం, భారీ వడగండ్లు కలిగాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరిశుద్ధ స్థలం’; గ్రీకు ναός విస్తృత ఆలయ ప్రాంగణం కంటే దేవుని పవిత్ర నివాసమైన అంతరాలయాన్ని ప్రత్యేకంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘ఆయన నిబంధనకు చెందిన మందసం’; గ్రీకు పాఠ్యంలో ‘ఆయన’ అని స్పష్టంగా ఉంది.
    reason: lexical_clarification
  - marker: c
    text: లేదా ‘స్వరాలు’; ఇక్కడి గ్రీకు పదం మాటల స్వరాలను గానీ, ధ్వనులను గానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: ఆలయం
  rationale: తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే సాధారణ పదం. గ్రీకు ναός ప్రత్యేకంగా అంతరాలయాన్ని లేదా పవిత్ర నివాసాన్ని సూచించగలందున ‘పరిశుద్ధ స్థలం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: పరలోకంలో ఉన్న
  rationale: ఆలయం ఎక్కడ ఉందో తెలిపే గ్రీకు విశేషణ నిర్మాణాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἠνοίγη
  choice: తెరవబడింది
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి రూపాన్ని నిలుపుతూ, దేవుడే దానిని తెరిచాడని అనువాదంలో అదనంగా నిర్ధారించదు.
- source_word: ὤφθη
  choice: కనిపించింది
  rationale: గ్రీకు కర్మణి భావాన్ని సహజమైన తెలుగులో అందిస్తూ, మందసం స్వయంగా ప్రత్యక్షమైందా లేక చూసేవారికి కనిపించిందా అనే విషయాన్ని అతిగా నిర్ణయించదు.
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: ఆయన నిబంధన మందసం
  rationale: αὐτοῦ లోని ‘ఆయన’ను స్పష్టంగా నిలుపుతుంది; διαθήκηకి ‘నిబంధన’, κιβωτόςకి బైబిలు సందర్భంలో ప్రాచుర్యమున్న ‘మందసం’ వాడబడ్డాయి.
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: ఆయన ఆలయంలో
  rationale: పునరావృతమైన ναόςను అదే పదంతో అనువదించి, αὐτοῦ అనే స్వామ్యార్థాన్ని నిలుపుతుంది.
- source_word: ἐγένοντο
  choice: సంభవించాయి
  rationale: తదనంతరం కలిగిన సూచనల జాబితాను తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: ἀστραπαὶ
  choice: మెరుపులు
  rationale: బహువచన భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: φωναὶ
  choice: ధ్వనులు
  rationale: φωνή యొక్క విస్తృత అర్థాన్ని నిలుపుతూ, ఈ ప్రకృతి-దైవదర్శన క్రమంలో తప్పనిసరిగా మానవ మాటలనే సూచించకుండా ఉంటుంది. ‘స్వరాలు’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: βρονταὶ
  choice: ఉరుములు
  rationale: బహువచన βρονταίకి సహజమైన తెలుగు సమానం.
- source_word: σεισμὸς
  choice: భూకంపం
  rationale: σεισμόςకు ఈ సందర్భంలో సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: χάλαζα μεγάλη
  choice: పెద్ద వడగండ్లు
  rationale: χάλαζα μεγάλη యొక్క తీవ్రతను సమీపంగా నిలుపుతూ, తెలుగులో వడగండ్లను సహజంగా బహువచనంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పరలోక ναός స్వరూపం
  choice: ప్రధాన పాఠ్యంలో ‘ఆలయం’
  alternative: ‘పరిశుద్ధ స్థలం’ లేదా ‘అంతరాలయం’
  rationale: ‘ఆలయం’ సాధారణ పాఠకులకు సహజం; అదే సమయంలో పరలోక నిర్మాణం గురించి అవసరానికి మించిన నిర్దిష్ట సిద్ధాంతాన్ని రుద్దదు. ναός యొక్క సంకుచిత అర్థసాధ్యతను పాదటిప్పణి కాపాడుతుంది.
- issue: దైవదర్శన సూచనలలో φωναὶ అర్థం
  choice: ‘ధ్వనులు’
  alternative: ‘స్వరాలు’
  rationale: ఈ పదం ‘స్వరాలు’ అని అక్షరార్థంగా ఉండగలిగినా, మెరుపులు మరియు ఉరుములతో కూడిన క్రమంలో విస్తృతంగా ‘ధ్వనులు’ అని కూడా అర్థమవుతుంది. ప్రధాన పాఠ్యం సహజతను, పాదటిప్పణి అసలు పదంలోని సందిగ్ధతను కాపాడుతాయి.
- issue: మందసం ఎవరి నిబంధనకు చెందినది
  choice: ‘ఆయన నిబంధన మందసం’
  alternative: ‘నిబంధన మందసం’
  rationale: గ్రీకు αὐτοῦను విడిచిపెట్టకుండా దేవుని నిబంధన అనే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల ప్రకటన గ్రంథ శైలి. గ్రీకు కర్మణి రూపాలు, కీలక పదాల పునరావృతం, దైవదర్శన దృశ్యపు గంభీరత నిలుపబడ్డాయి; అసలు పాఠ్యంలోని అర్థసందిగ్ధతలు పాదటిప్పణుల్లో సూచించబడ్డాయి.
