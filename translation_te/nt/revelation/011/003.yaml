    rationale: The note explains sackcloth specifically, so its anchor should immediately follow that expression. The present placement can misleadingly suggest that the note applies to the whole sentence or duration.
  - severity: low
    issue: “ధరించుకొని” can suggest the prior act of putting on clothing rather than simply the state of being clothed.
    rationale: The perfect participle περιβεβλημένοι depicts the witnesses as clothed in sackcloth. “ధరించి” naturally conveys that state without adding temporal sequencing.
