id: REV.11.3
reference: Revelation 11:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: te
  text: “నా ఇద్దరు సాక్షులకు నేను అనుగ్రహిస్తాను[a]. వారు గోనెపట్టలు ధరించి[b] వెయ్యి రెండువందల అరవై రోజులపాటు ప్రవచిస్తారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా ఇద్దరు సాక్షులకు నేను ఇస్తాను.” ఏమి ఇస్తాడో గ్రీకు పాఠ్యం చెప్పదు; సందర్భంలో అది ప్రవచించడానికి అనుగ్రహించే అధికారం లేదా నియామకం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గోనెపట్టలు శోకం, పశ్చాత్తాపం, ప్రవక్తల విలాపంతో ముడిపడి ఉండేవి.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: నేను అనుగ్రహిస్తాను
  rationale: గ్రీకు క్రియకు అక్షరార్థంగా ‘ఇస్తాను’ అని అర్థం; అయితే ఏమి ఇస్తాడో కర్మను వాక్యం చెప్పదు. ‘అనుగ్రహిస్తాను’ అనేది ఆ ఉద్దేశపూర్వక ప్రసాదాన్ని సహజమైన, గంభీరమైన తెలుగులో తెలియజేస్తూనే, ‘అధికారం’ లేదా ‘నియామకం’ అని కర్మను నిర్ణయించదు.
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: నా ఇద్దరు సాక్షులకు
  rationale: స్వామ్యార్థాన్ని, సంఖ్యను, μάρτυς లోని సాక్ష్యమిచ్చే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: προφητεύσουσιν
  choice: ప్రవచిస్తారు
  rationale: ప్రవక్తలుగా దేవుని సందేశాన్ని ప్రకటించే భావానికి స్థిరమైన, స్పష్టమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: వెయ్యి రెండువందల అరవై రోజులపాటు
  rationale: కాలవ్యవధిని సూచించే గ్రీకు ద్వితీయా విభక్తిని సహజమైన తెలుగు ‘రోజులపాటు’తో వ్యక్తం చేస్తుంది; ఖచ్చిత సంఖ్యను యథాతథంగా ఉంచుతుంది.
- source_word: περιβεβλημένοι
  choice: ధరించుకొని
  rationale: వస్త్రధారణ స్థితిని సూచించే గ్రీకు సంపూర్ణ కృదంత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: σάκκους
  choice: గోనెపట్టలు
  rationale: ముతక గోనె వస్త్రాల స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది; దాని శోకార్థాన్ని ప్రధాన పాఠ్యంలో వ్యాఖ్యానించదు.
theological_decisions:
- issue: δώσω క్రియలో చెప్పని కర్మ
  choice: ‘నేను అనుగ్రహిస్తాను’ అని ఉంచి, ఏమి అనుగ్రహిస్తాడో ప్రధాన పాఠ్యంలో పూరించలేదు.
  alternative: ‘ప్రవచించే అధికారాన్ని ఇస్తాను’ లేదా ‘నా ఇద్దరు సాక్షులను నియమిస్తాను.’
  rationale: గ్రీకు పాఠ్యం ఏమి ఇవ్వబడుతుందో స్పష్టంగా చెప్పదు. తరువాతి వాక్యభాగం ప్రవచన సేవను సూచించినా, ‘అధికారం’ లేదా ‘నియామకం’ అని చేర్చడం మూలంలోని అస్పష్టతను తొలగిస్తుంది. తెలుగు నిర్మాణం కొంత అసాధారణంగా వినిపించినా అర్థవంతంగా ఉండి, మూలంలోని ఉద్దేశపూర్వక ఖాళీని కాపాడుతుంది.
- issue: గోనెపట్టల ప్రతీకాత్మక భావం
  choice: ప్రధాన పాఠ్యంలో ‘గోనెపట్టలు’ అనే దృశ్యాన్నే నిలిపి, వివరణను పాదసూచికకు పరిమితం చేశాం.
  alternative: ‘శోకవస్త్రాలు ధరించుకొని.’
  rationale: గోనెపట్టలు శోకం, పశ్చాత్తాపం, ప్రవక్తల విలాపంతో ముడిపడి ఉన్నా, వాక్యం ఆ భావాల్లో ఒక్కదానిని మాత్రమే స్పష్టంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని δώσω క్రియకు చెప్పని కర్మను సిద్ధాంతపరంగా పూరించకుండా కాపాడాం. [b] గుర్తును మొత్తం వాక్యాంతంలో ఉంచినా, దాని పాదసూచిక ప్రత్యేకంగా ‘గోనెపట్టలు’ అనే పదబంధాన్ని వివరిస్తుంది.
