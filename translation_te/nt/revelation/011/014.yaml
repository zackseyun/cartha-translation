revisions:
- from: రెండవ అయ్యో ముగిసిపోయింది. ఇదిగో, మూడవ అయ్యో త్వరగా[a] రాబోతున్నది.
  to: రెండవ అయ్యో గతించిపోయింది; ఇదిగో, మూడవ అయ్యో త్వరగా[a] వస్తున్నది.
  rationale: The revision makes only the needed aspectual adjustment for ἔρχεται. “గతించిపోయింది” idiomatically reflects ἀπῆλθεν (‘departed/has passed’) in this sequence, while preserving the same meaning as the draft. The footnote remains correctly anchored to త్వరగా and preserves the lexical ambiguity of ταχύ.
