id: REV.11.14
reference: Revelation 11:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ δευτέρα ἀπῆλθεν· ⸂ἰδοὺ ἡ οὐαὶ ἡ τρίτη⸃ ἔρχεται ταχύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: te
  text: రెండవ అయ్యో గతించిపోయింది; ఇదిగో, మూడవ అయ్యో త్వరగా[a] వస్తున్నది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘త్వరలో.’ గ్రీకు పదం కాలసామీప్యాన్ని లేదా వేగాన్ని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: అయ్యో
  rationale: ప్రకటన గ్రంథంలోని సంఖ్యాపూర్వక విపత్తు-హెచ్చరికల సందర్భంలో, విలాపం మరియు రాబోయే భయంకర పరిణామం అనే రెండు భావాలనూ ‘అయ్యో’ నిలుపుతుంది; ‘విపత్తు’ లేదా ‘తీర్పు’ అనడం మరింత వ్యాఖ్యానాత్మకం అవుతుంది.
- source_word: δευτέρα
  choice: రెండవ
  rationale: ‘అయ్యో’ను నేరుగా విశేషించే క్రమసంఖ్యను సహజంగా అనువదిస్తుంది.
- source_word: ἀπῆλθεν
  choice: ముగిసిపోయింది
  rationale: మూలార్థం ‘వెళ్లిపోయింది’; ఇక్కడ వరుసలోని రెండవ ‘అయ్యో’ పూర్తయిందనే సందర్భార్థాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἰδού
  choice: ఇదిగో
  rationale: అత్యవసరంగా దృష్టిని ఆకర్షించే ప్రవచనాత్మక సంభాషణా సూచికను గంభీరమైనప్పటికీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τρίτη
  choice: మూడవ
  rationale: ‘అయ్యో’ను నేరుగా విశేషించే క్రమసంఖ్యను సూటిగా అనువదిస్తుంది.
- source_word: ἔρχεται
  choice: రాబోతున్నది
  rationale: రాక సమీపంలో ఉందనే సజీవ వర్తమాన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘వచ్చేస్తుంది’ కంటే ఇది గంభీరమైన శైలికి తగినది.
- source_word: ταχύ
  choice: త్వరగా
  rationale: ఈ క్రియావిశేషణం కాలసామీప్యాన్ని (‘త్వరలో’) లేదా రాకలోని వేగాన్ని (‘త్వరగా’) సూచించవచ్చు. ప్రధాన పాఠంలో ‘త్వరగా’ ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తే మూలంలోని సందిగ్ధత నిలుస్తుంది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో ταχύ అనువాదం
  choice: త్వరగా
  alternative: త్వరలో
  rationale: ταχύ అనేది సంఘటన సమీపంలో ఉందని లేదా అది వేగంగా సంభవిస్తుందని సూచించగలదు. ‘త్వరగా’ అత్యవసరతను నిలుపుతూ ఒక నిర్దిష్ట అంత్యకాల కాలపట్టికను బలవంతంగా విధించదు; ‘త్వరలో’ అనే సాధ్యమైన కాలార్థం పాదటిప్పణిలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రకటన గ్రంథపు గంభీరమైన ప్రవచన శైలిని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదప్రయోగం. పాదటిప్పణి సూచిక [a] సంబంధిత పదం వెంట ప్రధాన పాఠంలో ఉంచబడింది.
