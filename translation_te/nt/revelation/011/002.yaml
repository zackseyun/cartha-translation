id: REV.11.2
reference: Revelation 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: te
  text: అయితే దేవాలయం[a] వెలుపలనున్న ప్రాంగణాన్ని వదిలివేయి; దాన్ని కొలవవద్దు. ఎందుకంటే అది జనాంగాలకు[b] ఇవ్వబడింది. వారు నలభై రెండు నెలలపాటు పవిత్ర నగరాన్ని తొక్కుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధస్థలం.” ఇక్కడి గ్రీకు పదం దేవాలయ సముదాయం మొత్తాన్ని కాకుండా మరింత నిర్దిష్టంగా పరిశుద్ధస్థలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యూదేతరులకు.” గ్రీకు పదానికి “జనాంగాలు” లేదా “యూదేతరులు” అనే అర్థాలు ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλή
  choice: ప్రాంగణం
  rationale: దేవాలయ సందర్భంలో ఆవరణ లేదా ప్రాకారంలోని బహిరంగ ప్రదేశాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: దేవాలయానికి వెలుపల ఉన్న
  rationale: ప్రాంగణం ναός‌కు వెలుపల ఉందనే స్థలసంబంధ వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ναός
  choice: దేవాలయం
  rationale: సాధారణ పాఠకులకు సహజమైన పదం; గ్రీకు పదం మరింత నిర్దిష్టంగా పరిశుద్ధస్థలాన్ని సూచించగలదనే భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἔκβαλε ἔξωθεν
  choice: కొలతలో చేర్చవద్దు
  rationale: అక్షరార్థంగా బయటకు విసరడం కంటే, తరువాతి ‘కొలవవద్దు’ అనే ఆజ్ఞకు అనుగుణంగా కొలత ప్రక్రియ నుండి మినహాయించడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: దాన్ని కొలవవద్దు
  rationale: రెండవ పురుష ఏకవచన నిషేధాజ్ఞను నేరుగా నిలుపుతుంది.
- source_word: ἐδόθη
  choice: ఇవ్వబడింది
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్ని అలాగే ఉంచి, దైవకర్తను అనువాదంలో చేర్చదు.
- source_word: τοῖς ἔθνεσιν
  choice: జనాలకు
  rationale: ἔθνηలోని విస్తృత ‘జనాలు/దేశజనాలు’ భావాన్ని ఉంచుతుంది; ‘యూదేతరులు’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: πόλιν τὴν ἁγίαν
  choice: పవిత్ర నగరం
  rationale: నగరాన్ని యెరూషలేముగా ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయకుండా గ్రీకు బిరుదును సహజంగా అనువదిస్తుంది.
- source_word: πατήσουσιν
  choice: తొక్కుతారు
  rationale: శత్రుత్వపూర్వక అధీనత లేదా అపవిత్రపరచడం అనే బలమైన చిత్రాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: నలభై రెండు నెలలపాటు
  rationale: కాలవ్యవధిని సూచించే గ్రీకు ద్వితీయా విభక్తి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అపోకలిప్టిక్ దేవాలయ చిత్రణలో ναός యొక్క నిర్దిష్టత
  choice: ప్రధాన పాఠ్యంలో ‘దేవాలయం’
  alternative: ‘పరిశుద్ధస్థలం’
  rationale: ‘దేవాలయం’ సాధారణ పాఠకులకు సహజం; అయితే ναός దేవాలయ సముదాయం మొత్తానికి బదులు అంతర్గత పరిశుద్ధస్థలాన్ని సూచించవచ్చు. దర్శనంలోని స్థల విభజనపై ప్రభావం చూపగల ఈ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- issue: ἔθνεσιν యొక్క పరిధి
  choice: ‘జనాలకు’
  alternative: ‘యూదేతరులకు’
  rationale: ఈ పదం సాధారణంగా దేశజనాలను లేదా ఇశ్రాయేలు/యూదులకు భిన్నమైన యూదేతరులను సూచించగలదు. ప్రధాన పాఠ్యం విస్తృత భావాన్ని ఉంచగా, జాతి-మత సంబంధ ప్రత్యామ్నాయాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. ‘కొలతలో చేర్చవద్దు; దాన్ని కొలవవద్దు’ అనే రూపం గ్రీకులోని మినహాయింపు మరియు స్పష్ట నిషేధం రెండింటినీ నిలుపుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
