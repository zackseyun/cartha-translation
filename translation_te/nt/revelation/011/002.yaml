revisions:
- from: అయితే దేవాలయానికి వెలుపల ఉన్న ప్రాంగణాన్ని[a] కొలతలో చేర్చవద్దు; దాన్ని కొలవవద్దు. ఎందుకంటే అది జనాలకు[b] ఇవ్వబడింది. వారు నలభై రెండు నెలలపాటు పవిత్ర నగరాన్ని తొక్కుతారు.
  to: అయితే దేవాలయం[a] వెలుపలనున్న ప్రాంగణాన్ని వదిలివేయి; దాన్ని కొలవవద్దు. ఎందుకంటే అది జనాంగాలకు[b] ఇవ్వబడింది. వారు నలభై రెండు నెలలపాటు పవిత్ర నగరాన్ని తొక్కుతారు.
