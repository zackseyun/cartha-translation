revisions:
- from: వారిని చంపకుండా, ఐదు నెలలపాటు వారిని వేదనకు గురిచేయడానికి వీటికి అనుమతి ఇవ్వబడింది. వాటివల్ల కలిగే వేదన, తేలు ఒక మనిషిని కుట్టినప్పుడు కలిగే వేదనలా ఉంది.
  to: వారిని చంపడానికి కాదు, ఐదు నెలలపాటు వారికి వేదన కలిగించడానికి వీటికి అనుమతి ఇవ్వబడింది. వాటి వేదన, తేలు ఒక మనిషిని కుట్టినప్పటి వేదనవంటిది.
  rationale: అనుమతి యొక్క ప్రతికూల పరిమితిని తెలుగులో స్పష్టపరచడానికి ‘చంపడానికి కాదు’గా సవరించబడింది. αὐτῶν యొక్క విస్తృత సంబంధాన్ని నిలుపడానికి ‘వాటివల్ల కలిగే వేదన’ స్థానంలో ‘వాటి వేదన’ వాడబడింది. తేలు పోలికను మూలంలోని పదపునరుక్తి మరియు ఆధునిక తెలుగు సహజత్వాన్ని కాపాడుతూ సంక్షిప్తం చేశాం. పాఠ్యంలో ఎలాంటి అదనపు కర్తను చేర్చలేదు; ‘ఒక మనిషిని’ సాధారణార్థాన్ని నిలుపుతుంది.
