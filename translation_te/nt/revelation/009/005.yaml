id: REV.9.5
reference: Revelation 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: te
  text: వారిని చంపడానికి కాదు, ఐదు నెలలపాటు వారికి వేదన కలిగించడానికి వీటికి అనుమతి ఇవ్వబడింది. వాటి వేదన, తేలు ఒక మనిషిని కుట్టినప్పటి వేదనవంటిది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: వీటికి అనుమతి ఇవ్వబడింది
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్ని నిలిపి, ప్రకటన గ్రంథంలోని దైవానుమతి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; దేవుడే ఇచ్చాడని పాఠ్యంలో ప్రత్యక్షంగా చేర్చదు.
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: వారిని చంపకుండా
  rationale: ἵνα నిర్మాణంలోని ఉద్దేశం/అనుమతి పరిధిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἀλλ’ ἵνα βασανισθήσονται
  choice: వారిని వేదనకు గురిచేయడానికి
  rationale: అసాధారణమైన ἵνα + భవిష్యత్ కర్మణి రూపం సూచించే ఉద్దేశం లేదా ఫలితాన్ని అతిగా నిర్ధారించకుండా, ముందు భాగంతో సమాంతరంగా అందిస్తుంది.
- source_word: βασανισθήσονται / βασανισμός
  choice: వేదనకు గురిచేయడానికి / వేదన
  rationale: తీవ్రమైన బాధను సూచిస్తూ, క్రియ–నామ పదాల మూలపద పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతుంది; న్యాయపరమైన చిత్రహింస అని అతిగా నిర్దిష్టం చేయదు.
- source_word: μῆνας πέντε
  choice: ఐదు నెలలపాటు
  rationale: కాలవ్యవధిని సూచించే గ్రీకు ద్వితీయా విభక్తిని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: వాటివల్ల కలిగే వేదన
  rationale: సందర్భంలో మిడతలాంటి జీవులు కలిగించే వేదననే సూచిస్తున్నందున, అస్పష్టమైన తెలుగు సర్వనామ సంబంధాన్ని నివారిస్తూ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ὡς βασανισμὸς σκορπίου
  choice: తేలు ... కలిగే వేదనలా
  rationale: పోలికను సహజమైన తెలుగులో అందిస్తూ βασανισμός పద పునరుక్తిని నిలుపుతుంది.
- source_word: ὅταν παίσῃ
  choice: కుట్టినప్పుడు
  rationale: παίω ప్రాథమికంగా ‘కొట్టు/దెబ్బకొట్టు’ అయినా, తేలు విషయంలో సందర్భానుగుణంగా ‘కుట్టు’ అనేది ఆధునిక తెలుగులో ఖచ్చితమైన సహజ ప్రయోగం.
- source_word: ἄνθρωπον
  choice: ఒక మనిషిని
  rationale: ఏ మనిషినైనా ప్రతినిధిగా సూచించే ఏకవచన సాధారణార్థాన్ని, లింగాన్ని అనవసరంగా ప్రత్యేకించకుండా, ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: అంత్యకాల తీర్పులో కర్తను పేర్కొనని కర్మణి ప్రయోగం
  choice: ‘వీటికి అనుమతి ఇవ్వబడింది’ అని కర్తను పేర్కొనకుండా ఉంచడం
  alternative: ‘దేవుడు వీటికి అధికారం ఇచ్చాడు’ లేదా ‘వీటిని అనుమతించాడు’
  rationale: గ్రీకు పాఠ్యం ఇచ్చినవారిని పేరుపెట్టి చెప్పదు. దేవుణ్ణి ప్రత్యక్ష కర్తగా చేర్చడం మూలపాఠ్యానికి మించిన వ్యాఖ్యానం అవుతుంది; కర్మణి రూపం దైవ సార్వభౌమత్వం మరియు మధ్యవర్తిత్వ తీర్పు మధ్య ఉన్న ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ἵνα + భవిష్యత్ కర్మణి రూపంలోని ఉద్దేశం/ఫలితం
  choice: ‘వేదనకు గురిచేయడానికి’
  alternative: ‘వారు వేదనకు గురవుతారని’
  rationale: ఈ అసాధారణ కోయినే నిర్మాణాన్ని ఖచ్చితంగా ఉద్దేశమో ఫలితమో అని తేల్చకుండా, ఇచ్చిన అనుమతి యొక్క పరిధిగా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- issue: సాధారణార్థక ἄνθρωπον
  choice: ‘ఒక మనిషిని’
  alternative: ‘ఒక వ్యక్తిని’ లేదా ‘ఎవరినైనా’
  rationale: మూలంలోని ఏకవచన ప్రతినిధి రూపాన్ని నిలుపుతూ, తెలుగులో ‘మనిషి’ సాధారణ మానవార్థాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ముందరి సందర్భంలోని మిడతలాంటి జీవులకు సరిపోయేలా నపుంసక బహువచన సూచన (‘వీటికి/వాటివల్ల’) వాడబడింది. మూలపాఠ్యంలో లేని వివరణాత్మక కర్తను చేర్చలేదు.
