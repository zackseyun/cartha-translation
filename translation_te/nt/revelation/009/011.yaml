id: REV.9.11
reference: Revelation 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: te
  text: వాటికి అగాధపు దేవదూత[c] రాజుగా ఉన్నాడు. హీబ్రూలో అతని పేరు అబద్దోను[a]; గ్రీకులో అతనికి అపొల్లుయోను[b] అనే పేరు ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అబద్దోను’ అనేది నాశనంతో సంబంధమున్న హీబ్రూ పేరు.
    reason: పేరు యొక్క హీబ్రూ అర్థసంబంధాన్ని తెలియజేయడానికి.
  - marker: b
    text: ‘అపొల్లుయోను’ అనే గ్రీకు పేరుకు ‘నాశకుడు’ అని అర్థం.
    reason: లిప్యంతరీకరించిన గ్రీకు పేరులోని అర్థాన్ని భద్రపరచడానికి.
  - marker: c
    text: లేదా, ‘అడుగులేని గొయ్యి.’
    reason: ἀβύσσουకు సంప్రదాయబద్ధమైన ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: వాటిమీద రాజుగా ... ఉన్నాడు
  rationale: గ్రీకులోని ‘వాటిమీద ... రాజును కలిగి ఉన్నాయి’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, రాజు వాటిపై అధికారమున్నవాడనే అంశాన్ని నిలుపుతుంది.
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: అగాధపు దూత
  rationale: ἄγγελος ఇక్కడ ప్రకటన గ్రంథంలోని అతిమానవ వ్యక్తిని సూచిస్తున్నందున ‘దూత’ సరిపోతుంది. ἄβυσσοςకు ‘అగాధం’ ప్రత్యక్షమైన, సహజమైన అనువాదం.
- source_word: Ἑβραϊστὶ Ἀβαδδών
  choice: హీబ్రూ భాషలో ... అబద్దోను
  rationale: భాషను స్పష్టంగా పేర్కొని, వ్యక్తి పేరుగా పనిచేసే Ἀβαδδώνను అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది; దాని అర్థసంబంధాన్ని పాదసూచికలో తెలిపింది.
- source_word: ἐν τῇ Ἑλληνικῇ ... Ἀπολλύων
  choice: గ్రీకు భాషలో ... అపొల్లుయోను
  rationale: గ్రీకు రూపాన్ని వ్యక్తి పేరుగా లిప్యంతరీకరించింది. ‘నాశకుడు’ అనే దాని పారదర్శక అర్థాన్ని పాదసూచికలో భద్రపరిచింది.
- source_word: ὄνομα ἔχει
  choice: అతనికి ... అనే పేరు ఉంది
  rationale: గ్రీకు వాక్యనిర్మాణంలోని ‘పేరు కలిగి ఉన్నాడు’ అనే భావాన్ని సహజమైన తెలుగులో, పేరును మళ్లీ ప్రస్తావించే మూల వచన శైలిని నిలుపుతూ అందిస్తుంది.
theological_decisions:
- issue: Ἀβαδδών మరియు Ἀπολλύων అనే రూపాలను అనువదించాలా, లిప్యంతరీకరించాలా
  choice: ప్రధాన వచనంలో ‘అబద్దోను’, ‘అపొల్లుయోను’ అని పేర్లుగా లిప్యంతరీకరించడం
  alternative: వాటిని ‘నాశనం’, ‘నాశకుడు’ అని అనువదించడం
  rationale: ఈ రూపాలు అగాధపు దూతకు పెట్టిన పేర్లుగా పనిచేస్తున్నాయి. అందువల్ల పేర్లను ప్రధాన వచనంలో ఉంచి, వాటి అర్థాన్ని పాదసూచికల్లో తెలియజేయడం పేరు-అర్థం మధ్య ఉన్న సంబంధాన్ని రెండింటినీ కాపాడుతుంది.
- issue: ἀβύσσου యొక్క రూపకం
  choice: అగాధం
  alternative: అడుగులేని గొయ్యి
  rationale: ‘అగాధం’ గ్రీకు పదానికి నేరమైన సమానార్థకం; ‘అడుగులేని గొయ్యి’ సంప్రదాయబద్ధమైన కానీ కొంత వివరణాత్మకమైన రూపం. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం మూలంలోని రూపకాన్ని అతిగా నిర్దిష్టం చేయకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘వాటిమీద రాజుగా’ అనే నిర్మాణం మూలంలోని అధికారం సూచించే ἐπ’ αὐτῶν భావాన్ని నిలుపుతుంది. పాదసూచిక గుర్తులను అవి వివరించే పదాల వెంటనే ఉంచాం.
