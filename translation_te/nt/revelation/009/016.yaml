id: REV.9.16
reference: Revelation 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ ἀριθμὸς τῶν στρατευμάτων τοῦ ⸀ἱππικοῦ ⸀δισμυριάδες μυριάδων· ἤκουσα τὸν ἀριθμὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/016.yaml
  text: And the number of the troops of the cavalry was two hundred million; I heard their number.
translation:
  language: te
  text: గుర్రపు దళ సైనికుల సంఖ్య ఇరవై కోట్లు[a]; వారి సంఖ్యను నేను విన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో అక్షరార్థంగా, “పదివేలల పదివేలు, దానికి రెండింతలు”; అంటే ఇరవై కోట్లు.
    reason: మూలంలోని అసాధారణ మిరియాదు-ఆధారిత సంఖ్యా వ్యక్తీకరణను పారదర్శకంగా చూపిస్తూ, ప్రధాన పాఠంలోని ఆధునిక సంఖ్యారూపాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: ἀριθμὸς
  choice: సంఖ్య
  rationale: ‘సంఖ్య, మొత్తం’ అనే సాధారణ అర్థాన్ని నేరుగా తెలియజేస్తుంది; గ్రీకులోని పునరుక్తిని తెలుగులోనూ నిలుపుతుంది.
- source_word: στρατευμάτων
  choice: సైనికులు
  rationale: ఇక్కడ బహువచన సైనిక బలగాలను సూచిస్తుంది. ‘గుర్రపు దళాల సైనికులు’ అనేది సహజమైన ఆధునిక తెలుగు; సైనిక భావాన్ని నిలుపుతుంది.
- source_word: ἱππικοῦ
  choice: గుర్రపు దళాలు
  rationale: గుర్రాలపై యుద్ధం చేసే సమష్టి సైనిక బలగాన్ని సూచించే సహజ తెలుగు పదబంధం.
- source_word: δισμυριάδες μυριάδων
  choice: ఇరవై కోట్లు
  rationale: గ్రీకు వ్యక్తీకరణ గణన ప్రకారం 200,000,000ను సూచిస్తుంది. ఆధునిక తెలుగు సంఖ్యా విధానంలో ‘ఇరవై కోట్లు’ స్పష్టంగా, సహజంగా ఉంటుంది; అక్షరార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἤκουσα
  choice: నేను విన్నాను
  rationale: సాధారణ కథన భూతకాల క్రియకు నేరమైన, సహజమైన అనువాదం.
- source_word: αὐτῶν
  choice: వారి
  rationale: ముందు పేర్కొన్న గుర్రపు దళాల సైనికులను తిరిగి సూచిస్తుంది; వ్యక్తులను సూచించే తెలుగులో ‘వారి’ సహజం.
