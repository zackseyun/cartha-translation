  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘అశ్విక దళం’ కంటే సులభంగా అర్థమయ్యే ‘గుర్రపు దళాలు’ను ఎంచుకున్నాం.
