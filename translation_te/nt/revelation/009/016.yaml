- from: గుర్రపు దళాల సైనికుల సంఖ్య ఇరవై కోట్లు[a]. వారి సంఖ్యను నేను విన్నాను.
  to: గుర్రపు దళ సైనికుల సంఖ్య ఇరవై కోట్లు[a]; వారి సంఖ్యను నేను విన్నాను.
