id: REV.9.21
reference: Revelation 9:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: te
  text: వారు తమ హత్యల నుండిగాని, తమ మంత్రవిద్యల నుండిగాని[a], తమ లైంగిక దుర్నీతి నుండిగాని, తమ దొంగతనాల నుండిగాని పశ్చాత్తాపపడి తిరగలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మంత్రతంత్రాలు,” “క్షుద్రవిద్యలు”; గ్రీకు పదం మంత్రద్రవ్యాలు లేదా విషప్రయోగాలతో కూడా సంబంధం కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν ἐκ
  choice: విడిచిపెట్టి పశ్చాత్తాపపడలేదు
  rationale: ఈ నైతిక సందర్భంలో μετανοέω కేవలం మనస్సు మార్చుకోవడాన్ని కాక పాపం నుంచి తిరగడాన్ని సూచిస్తుంది. ἐκ పదం తెలిపే ‘నుంచి వైదొలగడం’ అనే భావాన్ని ‘విడిచిపెట్టి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: φόνων
  choice: హత్యలు
  rationale: φόνος ఇక్కడ నైతికంగా దోషపూరితమైన ప్రాణహరణాన్ని సూచిస్తుంది; ‘హత్యలు’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: φαρμάκων
  choice: మంత్రవిద్యలు
  rationale: ప్రకటన గ్రంథంలోని సందర్భంలో ఈ పదం ప్రధానంగా మాంత్రిక లేదా క్షుద్ర ఆచారాలను సూచిస్తుంది. అయితే దాని పదార్థ పరిధిలో మంత్రద్రవ్యాలు లేదా విషప్రయోగాలు కూడా ఉండవచ్చు; అందువల్ల ఆ విస్తృతిని పాదసూచికలో ఉంచాం.
- source_word: πορνείας
  choice: లైంగిక దుర్నీతి
  rationale: πορνεία సూచించే విస్తృతమైన అనైతిక లైంగిక ప్రవర్తనను సంకుచితం చేయకుండా, సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే రీతిలో ఈ పదబంధం అందిస్తుంది.
- source_word: κλεμμάτων
  choice: దొంగతనాలు
  rationale: κλέμμα దొంగిలించిన వస్తువును లేదా దొంగతనపు కార్యాన్ని సూచించగలదు; దుర్గుణాల జాబితాలో ‘దొంగతనాలు’ సహజమైన బహువచన రూపం.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: గాని ... గాని ... గాని
  rationale: మొదటి నిషేధంతో అనుసంధానమైన ప్రతి అంశాన్ని సమానంగా నొక్కిచెప్పే గ్రీకు నిర్మాణాన్ని తెలుగులో పునరుక్త ‘గాని’ రూపం సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: అంత్యకాల దర్శనంలోని దుర్గుణాల జాబితాలో φαρμάκων పదార్థ పరిధి
  choice: మంత్రవిద్యలు
  alternative: మంత్రతంత్రాలు; చేతబడులు; మంత్రద్రవ్యాలు లేదా విషప్రయోగాలు
  rationale: ప్రకటన గ్రంథంలో సంబంధిత పదాలు మాంత్రిక మోసాలు లేదా క్షుద్రాచారాల భావంలో వస్తాయి. కాబట్టి ప్రధాన పాఠంలో ‘మంత్రవిద్యలు’ అనువైనది; అయినా గ్రీకు పదానికి ఉన్న ద్రవ్యాలు/విషాలతో సంబంధిత సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. ‘తమ’ అనే పదం ప్రతి అంశంతో పునరావృతమై మూలంలోని αὐτῶν పునరుక్తిని నిలుపుతుంది; ‘గాని’ పునరుక్తి దుర్గుణాలన్నింటినీ విడివిడిగా నొక్కిచెబుతుంది.
