id: REV.9.17
reference: Revelation 9:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: te
  text: 'దర్శనంలో గుర్రాలను, వాటిమీద కూర్చున్నవారిని నేను ఇలా చూశాను: వారు అగ్నివర్ణపు, నీలవర్ణపు, గంధకవర్ణపు ఛాతీ కవచాలు[a] ధరించి ఉన్నారు. ఆ గుర్రాల తలలు సింహాల తలల్లా ఉన్నాయి; వాటి నోళ్లలోనుంచి అగ్ని, పొగ, గంధకం వెలువడుతున్నాయి.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో మరింత రూపానుసారంగా, “అగ్నిమయమైన, హయాసింతు రంగుగల, గంధకమయమైన ఛాతీ కవచాలు” అని చెప్పవచ్చు. “హయాసింతు” సూచించే ఛాయ ముదురు నీలం లేదా నీల-ఊదా కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “గంధకం”కు సంప్రదాయ ఆంగ్ల అనువాదాల్లో “బ్రిమ్‌స్టోన్” అనే పదం వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ఇలా
  rationale: దర్శనంలో యోహాను చూసిన తీరు లేదా రూపాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: ἐν τῇ ὁράσει
  choice: దర్శనంలో
  rationale: ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ సందర్భంలో ఇది సాధారణ చూపును కాక దర్శనానుభవాన్ని సూచిస్తుంది.
- source_word: καθημένους ἐπ’ αὐτῶν
  choice: వాటిమీద కూర్చున్నవారిని
  rationale: ‘రౌతులు’ అని సంక్షిప్తం చేయకుండా గ్రీకు భాగవాచక నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: θώρακας
  choice: ఛాతీ కవచాలు
  rationale: శరీరంలోని ఛాతీ భాగాన్ని కాపాడే నిర్దిష్ట కవచాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: πυρίνους
  choice: అగ్నివర్ణపు
  rationale: అగ్నిసంబంధమైన రూపాన్ని, ఈ దృశ్యవర్ణనలోని రంగు భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: ὑακινθίνους
  choice: నీలవర్ణపు
  rationale: హయసింతు లేదా జాసింతు పదార్థంతో అనుసంధానమైన ముదురు నీలం నుంచి నీలఊదా వరకు ఉండగల రంగును సులభమైన తెలుగులో అందిస్తుంది; ఖచ్చిత ఛాయ అనిశ్చితిని పాదసూచికలో తెలిపింది.
- source_word: θειώδεις
  choice: గంధకవర్ణపు
  rationale: గంధకాన్ని పోలిన దృశ్యగుణాన్ని, సమాంతర రంగు విశేషణాల వరుసను కాపాడుతుంది.
- source_word: ὡς κεφαλαὶ λεόντων
  choice: సింహాల తలల్లా
  rationale: ὡς సూచించే పోలికను సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἐκπορεύεται
  choice: వెలువడుతున్నాయి
  rationale: గ్రీకులోని వర్తమానకాల దృశ్యసజీవతను నిలుపుతూ, తరువాత వచ్చే సంయుక్త కర్తకు అనుగుణంగా తెలుగులో బహువచనాన్ని వాడుతుంది.
- source_word: θεῖον
  choice: గంధకం
  rationale: ఆధునిక తెలుగులో రసాయన పదార్థమైన sulfurకు స్పష్టమైన, సాధారణ సమానార్థకం.
theological_decisions:
- issue: ఛాతీ కవచాలను వర్ణించే మూడు విశేషణాల అర్థం
  choice: అగ్నివర్ణపు, నీలవర్ణపు, గంధకవర్ణపు
  alternative: అగ్నిమయమైన, హయసింతు వంటి, గంధకమయమైన
  rationale: దర్శనంలోని సమన్విత దృశ్యవర్ణన రంగు భావాన్ని బలంగా సూచిస్తుంది. అయినప్పటికీ పదాలు కేవలం రంగునే సూచిస్తాయని ఖచ్చితంగా తేల్చకుండా, మరింత రూపానుసారమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- issue: ἐκπορεύεται యొక్క వర్తమానకాల రూపం
  choice: వెలువడుతున్నాయి
  alternative: వెలువడ్డాయి
  rationale: దర్శనాన్ని సజీవంగా వర్ణించే గ్రీకు వర్తమానకాలాన్ని గతకాలంగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. గ్రీకు వాక్యంలోని దీర్ఘ సమన్వయ నిర్మాణాన్ని పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం; దర్శనపు క్రమం, రూపకాల తీవ్రత, వర్తమానకాల సజీవత నిలుపబడ్డాయి.
