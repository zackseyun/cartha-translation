    issue: Footnote b gives an inaccurate lexical alternative.
    rationale: The Greek θεῖον denotes sulfur. “గంధకరసం” is not an appropriate traditional equivalent in this context and can suggest a different substance. The corresponding English audit note concerns the traditional English word “brimstone,” not a Telugu synonym.
