language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶχον τρίχας ὡς τρίχας γυναικῶν, καὶ οἱ ὀδόντες αὐτῶν ὡς λεόντων ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/008.yaml
  text: And they had hair like women’s hair[a], and their teeth were like lions’ teeth,
translation:
  language: te
  text: వాటికి స్త్రీల జుట్టువంటి వెంట్రుకలు ఉండేవి[a]; వాటి పళ్లు సింహాల పళ్లలా ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత పదానుసారంగా, “స్త్రీల జుట్టువంటి జుట్టు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶχον
  choice: ఉంది
  rationale: దర్శన వర్ణనలోని అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న రూపలక్షణాన్ని తెలుపుతుంది. తెలుగు సహజ వర్ణనలో ‘ఉంది’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τρίχας
  choice: జుట్టు
  rationale: గ్రీకులో బహువచనమైనా, తెలుగు సహజ వాడుకలో తలవెంట్రుకలను సమష్టిగా ‘జుట్టు’ అని చెప్పడం సముచితం.
- source_word: ὡς τρίχας γυναικῶν
  choice: స్త్రీల జుట్టువంటి జుట్టు
  rationale: ὡς తెలిపే పోలికను నేరుగా నిలుపుతూ, దేనితో దేనిని పోలుస్తున్నారో తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: οἱ ὀδόντες αὐτῶν
  choice: వాటి పళ్లు
  rationale: తెలుగులో సహజమైన స్వామ్య నిర్మాణం; జీవుల సమూహాన్ని సూచించే నపుంసక బహువచన సర్వనామం సందర్భానికి సరిపోతుంది.
- source_word: ὡς λεόντων
  choice: సింహాల పళ్లలా
  rationale: గ్రీకు వాక్యంలో పోలికకు సంబంధించిన ‘పళ్లు’ భావం అంతర్లీనంగా ఉంది; తెలుగులో అస్పష్టత రాకుండా దానిని పునరుక్తం చేశాం.
- source_word: ἦσαν
  choice: ఉన్నాయి
  rationale: వాటి పళ్ల రూపాన్ని వర్ణించే అసంపూర్ణ భూతకాల క్రియను సహజమైన తెలుగు స్థితివాచక రూపంతో అందిస్తుంది.
theological_decisions:
- issue: ప్రకటన గ్రంథంలోని దర్శనాత్మక చిత్రణ స్వభావం
  choice: స్త్రీల జుట్టు, సింహాల పళ్లు అనే ఉపమానాలను వివరణ జోడించకుండా యథాతథంగా నిలుపడం
  alternative: ఆ చిత్రాలకు ప్రతీకాత్మక అర్థాన్ని అనువాదంలోనే వివరించడం
  rationale: గ్రీకు మూలం ఈ పోలికలను మాత్రమే ఇస్తుంది; వాటి ప్రతీకార్థాన్ని వివరించదు. కాబట్టి అనువాదం ఆ దర్శన చిత్రంలోని ఉద్దేశపూర్వక ఉద్వేగాన్నీ వ్యాఖ్యాన స్వేచ్ఛనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘వెంట్రుకలు’ కంటే సందర్భానుకూలమైన ‘జుట్టు,’ ‘దంతాలు’ కంటే సాధారణ పాఠకులకు సహజమైన ‘పళ్లు’ ఎంచుకున్నాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
