id: REV.9.18
reference: Revelation 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπὸ τῶν τριῶν πληγῶν τούτων ἀπεκτάνθησαν τὸ τρίτον τῶν ἀνθρώπων, ⸀ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: te
  text: ఈ మూడు తెగుళ్ల వల్ల—వాటి నోళ్లలోనుంచి వెలువడుతున్న అగ్ని, పొగ, గంధకం వల్ల—మనుషుల్లో మూడవ వంతు మంది చంపబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మనుషుల్లో మూడవ వంతు’ అంటే మానవులందరిలో మూడవ వంతు; మూల గ్రీకు పదం పురుషులను మాత్రమే సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: ఈ మూడు తెగుళ్ల వల్ల
  rationale: ἀπό ఇక్కడ స్థలవియోగాన్ని కాక కారణాన్ని లేదా సాధనాన్ని సూచిస్తుంది. τούτων లోని సూచనార్థాన్ని ‘ఈ’ నిలుపుతుంది; πληγαίకు ప్రకటన గ్రంథ సందర్భంలో ‘తెగుళ్లు’ సహజమైన పదం.
- source_word: ἀπεκτάνθησαν
  choice: చంపబడ్డారు
  rationale: క్రియలోని భూతకాల నిష్క్రియార్థాన్ని స్పష్టంగా నిలుపుతుంది; కర్తను వచనం పేర్కొననందున అనవసరంగా చేర్చదు.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: మనుషుల్లో మూడవ వంతు మంది
  rationale: భాగార్థక నిర్మాణాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ἀνθρώπων ఇక్కడ పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది.
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: అగ్ని, పొగ, గంధకం వల్ల
  rationale: ἐκ ఇక్కడ నోళ్లనుంచి వెలువడిన వాటినే మరణానికి కారణాలుగా చూపుతుంది. మూలంలోని మూడు అంశాలనూ విడివిడిగా నిలుపుతుంది; θεῖονకు ఆధునిక ప్రామాణిక తెలుగు పదం ‘గంధకం’.
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: వాటి నోళ్లలోనుంచి వెలువడుతున్న
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న దృశ్యాన్ని ‘వెలువడుతున్న’ నిలుపుతుంది. αὐτῶνకు సందర్భంలోని గుర్రాలను సూచించే సహజ తెలుగు సర్వనామం ‘వాటి’.
theological_decisions:
- issue: అపోకలిప్టిక్ తీర్పు సందర్భంలో ἀνθρώπων పరిధి
  choice: మనుషులు
  alternative: మానవజాతి
  rationale: ఈ పదం పురుషులను ప్రత్యేకంగా కాక మానవులను సమష్టిగా సూచిస్తుంది. ‘మనుషుల్లో మూడవ వంతు మంది’ భాగార్థాన్ని సహజంగా వ్యక్తం చేస్తూ లింగపరమైన పరిమితిని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, స్పష్టమైన అపోకలిప్టిక్ శైలి. కారణార్థక ‘వల్ల’ను రెండుసార్లు ఉపయోగించి మూడు తెగుళ్లు ఏమిటో మధ్యవాక్యంగా వివరించబడింది; మూలంలోని పునరుక్త సంబంధం మరియు భావతీవ్రత నిలుపబడ్డాయి.
