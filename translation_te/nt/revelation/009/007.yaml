id: REV.9.7
reference: Revelation 9:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: te
  text: ఆ మిడతల రూపాలు యుద్ధానికి సిద్ధపరచబడిన గుర్రాల్లా ఉన్నాయి. వాటి తలల మీద బంగారాన్ని పోలిన కిరీటాల వంటివి ఉన్నాయి[a]. వాటి ముఖాలు మనుషుల ముఖాల్లా ఉన్నాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కిరీటాలు’ అని అనువదించిన గ్రీకు పదం στέφανοι; ఇది గౌరవం లేదా విజయంతో సంబంధమున్న విజయమాలలు లేదా కిరీటాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మనుషుల ముఖాలు’; ఇక్కడ గ్రీకు పదం మగవారిని మాత్రమే కాక, మానవులను సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοιώματα
  choice: రూపాలు
  rationale: దర్శనంలో కనిపించిన ఆకృతిని సూచిస్తూ, అవి అక్షరార్థంగా గుర్రాలేనని చెప్పకుండా పోలికను నిలుపుతుంది.
- source_word: ἀκρίδων
  choice: మిడతలు
  rationale: ἀκρίς అనే సాధారణ పదానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: యుద్ధానికి సిద్ధం చేసిన గుర్రాల్లా
  rationale: ὅμοιαలోని పోలికను, ἡτοιμασμένοιςలోని సిద్ధపరచబడి ఉన్న స్థితిని, πόλεμονలోని యుద్ధ భావాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: వాటి తలల మీద
  rationale: దర్శనంలోని స్థల సంబంధాన్ని నేరుగా, సహజంగా తెలుపుతుంది.
- source_word: ὡς στέφανοι ὅμοιοι χρυσῷ
  choice: బంగారంలా కనిపించే కిరీటాల వంటివి
  rationale: ὡς మరియు ὅμοιοι అనే రెండు పోలిక సూచనలనూ నిలుపుతూ, అవి నిజంగా బంగారంతో చేసిన కిరీటాలని నిర్ధారించదు.
- source_word: πρόσωπα ἀνθρώπων
  choice: మనుషుల ముఖాలు
  rationale: ἄνθρωποι ఇక్కడ లింగనిర్దిష్టంగా కాక మానవులను సాధారణంగా సూచిస్తుంది; ఈ తెలుగు పదబంధం ఆ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: అపోకలిప్టిక్ దర్శనంలోని వరుస పోలికలు
  choice: ‘లా’, ‘వంటివి’ వంటి పోలిక సూచనలను స్పష్టంగా నిలుపడం
  alternative: వాటిని నిజమైన గుర్రాలు, బంగారు కిరీటాలు లేదా మానవ ముఖాలుగా నేరుగా వర్ణించడం
  rationale: మూలపాఠంలోని ὅμοια/ὡς పదాలు దర్శనంలో కనిపించిన సాదృశ్యాన్ని సూచిస్తాయి; వాటి అస్తిత్వ స్వభావాన్ని అనువాదం నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. దర్శన వర్ణనలోని పోలికలు స్పష్టంగా ఉంచబడ్డాయి; వాక్యాన్ని సహజ తెలుగు ప్రవాహం కోసం మూడు వాక్యాలుగా విభజించాం.
