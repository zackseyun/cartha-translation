id: REV.9.6
reference: Revelation 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: te
  text: ఆ రోజుల్లో మనుషులు మరణాన్ని వెదకుతారు, కానీ దాన్ని ఎంతమాత్రమూ కనుగొనరు; చనిపోవాలని తహతహలాడుతారు, కానీ మరణం వారి నుండి పారిపోతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ఆ రోజుల్లో
  rationale: కాలాన్ని సూచించే గ్రీకు ప్రయోగంలోని నిర్దేశక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οἱ ἄνθρωποι
  choice: మనుషులు
  rationale: ἄνθρωποι ఇక్కడ పురుషులకు మాత్రమే పరిమితం కాకుండా మానవులను సాధారణంగా సూచిస్తుంది; ‘మనుషులు’ ఆ విస్తృత అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ζητήσουσιν
  choice: వెదకుతారు
  rationale: ఉద్దేశపూర్వకంగా కోరుతూ అన్వేషించే భావాన్ని, సందర్భంలోని గంభీరతను నిలుపుతుంది.
- source_word: τὸν θάνατον
  choice: మరణాన్ని
  rationale: మూలంలోని ప్రత్యక్ష కర్మను యథాతథంగా తెలుపుతూ, వాక్యాంతంలో వికసించే వ్యక్తీకరణకు పునాది వేస్తుంది.
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: దాన్ని ఎంతమాత్రమూ కనుగొనరు
  rationale: οὐ μή తో కూడిన భవిష్యత్ క్రియలోని బలమైన నిరాకరణను ‘ఎంతమాత్రమూ’ సహజంగా వ్యక్తం చేస్తుంది; ‘దాన్ని’ మరణాన్ని తిరిగి సూచిస్తుంది.
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: చనిపోవాలని తహతహలాడుతారు
  rationale: ἐπιθυμέωలోని తీవ్రమైన కోరికను ‘తహతహలాడు’ స్పష్టంగా తెలియజేస్తుంది; ἀποθανεῖνను సహజమైన ‘చనిపోవాలని’గా అందిస్తుంది.
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: మరణం వారి నుండి పారిపోతుంది
  rationale: వర్తమానకాలపు సజీవతను, మరణాన్ని క్రియాశీల పాత్రగా చూపే వ్యక్తీకరణను నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రళయదర్శన సందర్భంలో మరణానికి వ్యక్తిత్వారోపణ
  choice: ‘మరణం వారి నుండి పారిపోతుంది’ అని నేరుగా నిలుపడం
  alternative: ‘వారు చనిపోలేరు’ అని భావార్థంగా చెప్పడం
  rationale: గ్రీకులో మరణమే φεύγει అనే క్రియకు కర్త. దీన్ని నిలుపడం యోహాను దర్శనంలోని దృశ్యాత్మక ఉద్వేగాన్ని కాపాడుతుంది; కేవలం ఫలితాన్ని చెప్పి రూపకాన్ని చదును చేయదు.
- issue: οἱ ἄνθρωποι యొక్క సాధారణ మానవ సూచన
  choice: ‘మనుషులు’
  alternative: ‘పురుషులు’
  rationale: ఈ సందర్భంలో ἄνθρωποι లింగపరంగా పురుషులను మాత్రమే సూచించదు; తీర్పును అనుభవించే మానవులను సాధారణంగా సూచిస్తుంది. అందువల్ల ‘మనుషులు’ మూలార్థానికి మరింత కచ్చితమైన ఆధునిక తెలుగు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రళయదర్శన శైలిని ఉంచుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం. గ్రీకు బలమైన నిరాకరణను ‘ఎంతమాత్రమూ’తో, మరణపు వ్యక్తీకరణను ‘పారిపోతుంది’తో నిలిపాం.
