id: REV.9.19
reference: Revelation 9:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: te
  text: ఎందుకంటే ఆ గుర్రాల శక్తి వాటి నోళ్లలోను వాటి తోకల్లోను ఉంది; ఎందుకంటే వాటి తోకలు పాముల్లా ఉండి, తలలు కలిగి ఉన్నాయి, వాటి ద్వారా అవి హాని చేస్తాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: శక్తి
  rationale: ఈ దర్శన సందర్భంలో గుర్రాలు హాని చేయగల ప్రభావశీల సామర్థ్యాన్ని సూచిస్తుంది; అప్పగించబడిన అధికారాన్ని ప్రధానంగా సూచించడం లేదు.
- source_word: στόματι
  choice: నోళ్లలో
  rationale: గ్రీకులో ఏకవచనం పంపిణీ భావంలో ఉన్నప్పటికీ, బహువచనమైన గుర్రాలకు అనుగుణంగా తెలుగులో బహువచనం సహజంగా ఉంటుంది.
- source_word: οὐραῖς
  choice: తోకల్లో
  rationale: మూలంలోని స్పష్టమైన బహువచనాన్ని, దర్శన చిత్రణను నిలుపుతుంది.
- source_word: ὅμοιαι ὄφεσιν
  choice: పాముల్లా
  rationale: ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండి, సర్పాకార చిత్రణను స్పష్టంగా నిలుపుతుంది.
- source_word: ἔχουσαι κεφαλάς
  choice: తలలు కలిగి ఉన్నాయి
  rationale: తోకలకే తలలు ఉన్నాయనే అసాధారణమైన దర్శన చిత్రణను వ్యాఖ్యానించకుండా నేరుగా తెలియజేస్తుంది.
- source_word: ἀδικοῦσιν
  choice: హాని చేస్తాయి
  rationale: ఇక్కడ నైతిక అన్యాయం కంటే గాయపరచడం లేదా కీడు కలిగించడం అనే సందర్భార్థం ప్రధానమైనది.
- source_word: ἐν αὐταῖς
  choice: వాటితో
  rationale: ἐν ఇక్కడ సాధనార్థకంగా ఉంది; తోకలు లేదా వాటి తలలు హాని చేసే సాధనమనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే / వివరణాత్మక అనుసంధానం
  rationale: మొదటి γάρ ముందటి వాక్యానికి కారణాన్ని వివరిస్తుంది. రెండవ γάρను తెలుగులో ప్రత్యేక పదంగా పునరావృతం చేయకుండా తదుపరి వాక్యపు వివరణాత్మక సంబంధం ద్వారా సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: గుర్రాల తోకలు, వాటి తలలకు సంబంధించిన ప్రకటన గ్రంథ దర్శన చిత్రణ
  choice: చిత్రణను సూటిగా అనువదించి, దానికి ప్రతీకాత్మక అర్థాన్ని జోడించలేదు
  alternative: తోకలను అబద్ధ బోధగా లేదా దయ్యపు కార్యశక్తిగా వ్యాఖ్యానించడం
  rationale: గ్రీకు వచనం దర్శన దృశ్యాన్ని మాత్రమే వర్ణిస్తుంది; అనువాదం అందులో లేని ప్రత్యేక వేదాంత వ్యాఖ్యానాన్ని చేర్చకూడదు.
- issue: καὶ ἐν αὐταῖς లో αὐταῖς సూచించే అంశం
  choice: స్త్రీలింగ బహువచన సర్వనామానికి సమీప పూర్వపదమైన ‘తోకలు’ను సూచించేలా ‘వాటితో’ అని అనువదించాం
  alternative: తోకలలోని తలల ద్వారానే అవి హాని చేస్తాయని స్పష్టీకరించడం
  rationale: వ్యాకరణపరంగా సర్వనామం ‘తోకలు’తో సరిపోతుంది; తలలు హాని చేసే భాగమని భావించవచ్చుగానీ, మూలంలోని సూచనను అనువాదంలో మరీ సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే దర్శన వర్ణనకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలో లేని పాదసూచికలను చేర్చలేదు; అందువల్ల ప్రధాన పాఠ్యంలో పాదసూచిక గుర్తులు లేవు.
