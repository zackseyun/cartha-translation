id: REV.9.13
reference: Revelation 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: te
  text: ఆరవ దేవదూత బూర ఊదాడు; అప్పుడు నేను దేవుని ఎదుటనున్న బంగారు బలిపీఠపు కొమ్ములనుండి ఒకే స్వరాన్ని[a] విన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక స్వరం.” గ్రీకులో ఆ స్వరం ఒక్కటే అనే విషయం నొక్కి చెప్పబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: బూర ఊదాడు
  rationale: σαλπίζω అంటే బూరను ఊదడం లేదా మోగించడం. దర్శనంలోని సందర్భాన్ని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేయడానికి ‘బూర ఊదాడు’ అని అనువదించాం.
- source_word: φωνὴν μίαν
  choice: ఒకే స్వరం
  rationale: μία వల్ల స్వరం ఒక్కటే అనే నొక్కి చెప్పడం కనిపిస్తుంది. అది ఎవరి స్వరమో పేర్కొనకుండా ‘ఒకే స్వరం’ ఈ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐκ τῶν κεράτων
  choice: కొమ్ముల నుండి
  rationale: ἐκ మూలాన్ని లేదా ఆరంభస్థానాన్ని సూచిస్తుంది; κέρατα బలిపీఠంపై ఉన్న కొమ్ములవంటి పొడిగింపులను సూచిస్తుంది. ‘కొమ్ముల నుండి’ ఆ ఆరాధనా స్థల చిత్రణను నిలుపుతుంది.
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: బంగారు బలిపీఠపు
  rationale: గ్రీకు పదబంధంలోని నిర్దిష్టమైన బంగారు బలిపీఠాన్ని తెలుగులో సహజమైన సంబంధరూపంతో తెలియజేస్తుంది.
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: దేవుని ఎదుట ఉన్న
  rationale: ἐνώπιον దేవుని సన్నిధిలో లేదా ఆయన ఎదుట ఉన్న స్థానాన్ని సూచిస్తుంది. ఈ అనువాదం మూలానికి దగ్గరగా ఉండి పరలోక ఆలయ దృశ్యాన్ని కాపాడుతుంది.
- source_word: ἄγγελος
  choice: దూత
  rationale: ప్రకటన గ్రంథంలోని దర్శన సందర్భంలో ఇది మానవ సందేశకుడిని కాక దేవదూతను సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు శైలిలో ‘దూత’ సహజంగా ఉంది.
theological_decisions:
- issue: స్వరం ఎవరిది?
  choice: ఎవరి స్వరమో నిర్ధారించకుండా ‘ఒకే స్వరం’ అని అనువదించడం
  alternative: దేవుని స్వరం; ఒక దూత స్వరం; బలిపీఠంతో సంబంధమున్న స్వరం
  rationale: గ్రీకు వాక్యం దేవుని ఎదుట ఉన్న బంగారు బలిపీఠపు కొమ్ముల నుండి ఒకే స్వరం వినిపించిందని మాత్రమే చెబుతుంది. స్వరం ఎవరిదో అనువాదంలో చేర్చితే మూలంలోని ఉద్దేశపూర్వక అస్పష్టత తొలగిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించాం. దర్శనాత్మక, ఆరాధనా స్థల చిత్రణను నిలుపుతూ అనవసరమైన వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు. మూలంలోని footnote భావానికి సరిపోయేలా [a] గుర్తును ‘ఒకే స్వరం’ వద్ద ఉంచాం.
