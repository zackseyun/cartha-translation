id: REV.9.2
reference: Revelation 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: te
  text: అతడు అగాధానికి వెళ్లే బిలాన్ని[a] తెరిచాడు. ఆ బిలం నుంచి పెద్ద కొలిమి నుంచి వచ్చే పొగలాగా పొగ పైకి లేచింది. ఆ బిలం నుంచి వచ్చిన పొగవల్ల సూర్యుడూ గాలీ చీకటిమయమయ్యాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అగాధపు బిలం’; సంప్రదాయంగా, ‘అంతులేని గొయ్యి.’
    reason: φρέαρ τῆς ἀβύσσου అనే పదబంధానికి సాధ్యమైన ప్రత్యామ్నాయ అనువాదాలను, సంప్రదాయ రూపాన్ని సూచించడానికి.
lexical_decisions:
- source_word: ἤνοιξεν
  choice: తెరిచాడు
  rationale: ἀνοίγω యొక్క సాధారణ అర్థాన్ని సహజంగా తెలియజేస్తుంది; ఎలా తెరిచాడో అదనంగా నిర్దేశించదు.
- source_word: φρέαρ τῆς ἀβύσσου
  choice: అగాధానికి వెళ్లే బిలం
  rationale: φρέαρ అనే ప్రవేశ బిలానికి, ἄβυσσος అనే అగాధానికి మధ్య ఉన్న భేదాన్ని తెలుగులో స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: ἀβύσσου
  choice: అగాధం
  rationale: అంతులేని లోతు అనే మూలభావాన్ని ప్రతిబింబిస్తూ, సంప్రదాయపరమైన ‘అంతులేని గొయ్యి’ వంటి వ్యాఖ్యానాత్మక పదబంధాన్ని నివారిస్తుంది.
- source_word: ἀνέβη καπνὸς
  choice: పొగ పైకి లేచింది
  rationale: పైకి కదలడాన్ని తెలిపే ἀναβαίνω భావాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతుంది.
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: ఒక పెద్ద కొలిమి పొగవంటి పొగ
  rationale: ὡς సూచించే పోలికను, κάμινος యొక్క వేడి చేసే కొలిమి చిత్రాన్ని నేరుగా కాపాడుతుంది.
- source_word: ἐσκοτώθη
  choice: చీకటిమయమయ్యాయి
  rationale: సూర్యుడు, గాలి రెండూ పొగ ప్రభావంతో చీకటిగా చేయబడ్డాయనే ఫలిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ ἀὴρ
  choice: గాలి
  rationale: ἀήρ అనే వాతావరణంలోని గాలికి నేర సమానార్థకం; ‘ఆకాశం’ అని మార్చి దృశ్యాన్ని విస్తరించదు.
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: ఆ బిలం నుంచి వచ్చిన పొగవల్ల
  rationale: ἐκ తెలిపే మూలం మరియు సందర్భంలోని కారణ సంబంధం రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ ప్రదేశపదాలను వ్యాఖ్యానాత్మక సంప్రదాయ భాష లేకుండా అనువదించడం
  choice: φρέαρ మరియు ἄβυσσος మధ్య భేదాన్ని ‘అగాధానికి వెళ్లే బిలం’గా నిలిపాం.
  alternative: ‘అగాధపు గొయ్యి’ లేదా ‘అంతులేని గొయ్యి’
  rationale: మొదటిది బిలాన్నే అగాధంతో కలిపివేసే అవకాశం ఉంది; రెండవది మూలపదం చెప్పినదానికంటే ఎక్కువగా సంప్రదాయ వ్యాఖ్యానాన్ని చేర్చుతుంది. ప్రధాన పాఠం ప్రవేశద్వారం మరియు అగాధం మధ్య భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. అపోకలిప్టిక్ దృశ్యాన్ని స్పష్టంగా ఉంచుతూ ‘బిలం’ మరియు ‘అగాధం’ మధ్య భావభేదం కాపాడబడింది; వాక్యాన్ని సహజ తెలుగు ప్రవాహం కోసం మూడు చిన్న వాక్యాలుగా విభజించాం.
