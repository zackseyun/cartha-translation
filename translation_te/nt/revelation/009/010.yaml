id: REV.9.10
reference: Revelation 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: te
  text: వాటికి తేళ్లవంటి తోకలూ, కుట్టే ముళ్లూ ఉన్నాయి. మనుషులకు ఐదు నెలలపాటు హాని చేసే శక్తి వాటి తోకల్లో ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς
  choice: తోకలు
  rationale: దర్శనంలోని శరీరాకృతి సంబంధమైన ప్రత్యక్ష బహువచన చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὁμοίας σκορπίοις
  choice: తేళ్లవంటి
  rationale: ὅμοιος దత్తివుతో వ్యక్తపరచే పోలికను సంక్షిప్తంగా నిలుపుతుంది; తోకలు తేళ్ల తోకలవంటివే అని అతిగా నిర్దిష్టం చేయదు.
- source_word: κέντρα
  choice: కుట్టే ముళ్లు
  rationale: κέντρον యొక్క పదునైన కుట్టే భాగం అనే అర్థాన్ని తేలు చిత్రణలో స్పష్టంగా, సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది; ‘విషం’ అనే మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: ἐξουσία
  choice: శక్తి
  rationale: ఇక్కడ న్యాయపరమైన అధికారంకన్నా హాని కలిగించగల కార్యసామర్థ్యం ముందుకు వస్తుంది; అయినా దర్శనంలో అది అనుమతించబడిన శక్తి అనే అవకాశాన్ని నిరాకరించదు.
- source_word: ἀδικῆσαι
  choice: హాని చేసే
  rationale: ఈ విపత్తు సందర్భంలో ἀδικέω అన్యాయం చేయడం అనే నైరూప్య భావంకన్నా గాయపరచడం లేదా కీడు కలిగించడం అనే భావాన్ని ఇస్తుంది.
- source_word: τοὺς ἀνθρώπους
  choice: మనుషులకు
  rationale: ἄνθρωποι ఇక్కడ మానవులను సాధారణంగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘మనుషులు’ లింగపరంగా అనవసరమైన పరిమితిని కలిగించకుండా మూల సూచనను సహజంగా అందిస్తుంది.
- source_word: μῆνας πέντε
  choice: ఐదు నెలలపాటు
  rationale: కాలవ్యవధిని సూచించే ద్వితీయా విభక్తి భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: విపత్తు చిత్రణలో ἐξουσία భావం
  choice: శక్తి
  alternative: అధికారం
  rationale: వాక్యం తోకల ద్వారా హాని చేయగల సామర్థ్యాన్ని వర్ణిస్తుంది. ‘శక్తి’ ఆ కార్యసామర్థ్యాన్ని సహజంగా తెలియజేస్తుంది; అది దేవుని అనుమతిలో ఉన్న అధికారమనే విస్తృత సందర్భాన్ని మాత్రం తిరస్కరించదు.
- issue: τοὺς ἀνθρώπους యొక్క సాధారణ మానవ సూచన
  choice: మనుషులకు
  alternative: పురుషులకు
  rationale: ఈ సందర్భంలో వ్యాకరణపరమైన పుంలింగ రూపం కేవలం పురుషులను మాత్రమే సూచించదు. ‘మనుషులకు’ అనే పదం మూలంలోని సామాన్య మానవ సూచనను ఆధునిక తెలుగులో కచ్చితంగా నిలుపుతుంది.
- issue: తోకల్లో శక్తి ఉందనే దర్శనాత్మక వాక్యం
  choice: శక్తి వాటి తోకల్లో ఉంది
  alternative: తోకల ద్వారా వాటికి శక్తి ఉంది
  rationale: ἐν ταῖς οὐραῖς αὐτῶν అనే స్థానార్థక నిర్మాణాన్ని అలాగే ఉంచి, ఆ శక్తి ఎలా పనిచేస్తుందో అదనంగా వివరణాత్మకంగా నిర్ణయించకుండా దర్శనంలోని అసాధారణ చిత్రాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. పాతకాలపు ‘కొండ్లు’ బదులు స్పష్టమైన ‘కుట్టే ముళ్లు’ వాడబడింది. మూలంలోని రెండు సమాంతర వాక్యభాగాలు సహజ తెలుగు ప్రవాహం కోసం రెండు వాక్యాలుగా ఇచ్చబడ్డాయి.
