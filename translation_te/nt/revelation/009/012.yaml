id: REV.9.12
reference: Revelation 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ μία ἀπῆλθεν· ἰδοὺ ἔρχεται ἔτι δύο οὐαὶ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/012.yaml
  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: te
  text: మొదటి విపత్తు గడిచిపోయింది[a]. ఇదిగో, ఈ సంగతుల తరువాత ఇంకా రెండు విపత్తులు వస్తున్నాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ ఒక విపత్తు గడిచిపోయింది’; గ్రీకులో అక్షరార్థంగా ‘ఆ ఒక విపత్తు’ అని ఉంది, కానీ సందర్భంలో ఇది వరుసలో మొదటిదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇంకా రెండు విపత్తులు దీని తరువాత వస్తున్నాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: విపత్తు
  rationale: ఇక్కడ ఇది కేవలం ‘అయ్యో’ అనే ఆక్రందన కాదు; రాబోయే తీర్పు సంబంధమైన ఘోర దురవస్థను సూచించే నామవాచక ప్రయోగం. ‘విపత్తు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ప్రకటన గ్రంథంలోని అపాయ-తీర్పు ధ్వనిని నిలుపుతుంది.
- source_word: ἡ μία
  choice: మొదటి
  rationale: అక్షరార్థంగా ‘ఒకటి’ అయినప్పటికీ, ముందుగా ప్రకటించిన మూడు విపత్తుల వరుసలో ఇది మొదటిదని సందర్భం స్పష్టం చేస్తుంది.
- source_word: ἀπῆλθεν
  choice: గడిచిపోయింది
  rationale: మొదటి విపత్తు ముగిసిందనే సంపూర్ణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; స్థలాంతర భావమున్న ‘వెళ్లిపోయింది’ కంటే సందర్భానికి అనుకూలం.
- source_word: ἰδού
  choice: ఇదిగో
  rationale: తదుపరి ప్రకటనపై తక్షణ దృష్టిని ఆకర్షించే ప్రవచనాత్మక సంభాషణ సూచకాన్ని నిలుపుతుంది.
- source_word: ἔρχεται ἔτι
  choice: ఇంకా ... రాబోతున్నాయి
  rationale: మరో రెండు విపత్తులు మిగిలి ఉన్నాయనీ అవి సమీపిస్తున్నాయనీ సూచిస్తుంది. గ్రీకులో క్రియ ఏకవచనంలో ఉన్నా, తెలుగు బహువచన కర్తకు అనుగుణంగా బహువచన క్రియ సహజం.
- source_word: μετὰ ταῦτα
  choice: దీని తరువాత
  rationale: గ్రీకులో బహువచన రూపం ఉన్నప్పటికీ, ఇక్కడ ఇప్పుడే ముగిసిన మొదటి విపత్తును సమగ్ర సంఘటనగా సూచిస్తూ ఆధునిక తెలుగులో ‘దీని తరువాత’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: మూడు విపత్తుల అపోకలిప్టిక్ క్రమం
  choice: మొదటి విపత్తు ముగిసింది; మరో రెండు విపత్తులు తరువాత రానున్నాయి.
  alternative: ‘విపత్తు’ను సాధారణంగా ‘తీర్పు’ లేదా ‘ఆపద’గా విపులీకరించడం.
  rationale: మూలపాఠం సంఖ్యాబద్ధమైన మూడు విపత్తుల సాహిత్య క్రమాన్ని ప్రధానంగా చూపుతుంది. దానిని నిలుపుతూ, వాటి స్వరూపం లేదా కాలక్రమం గురించి పాఠ్యంలో లేని సిద్ధాంత వివరాలను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రకటన గ్రంథానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘ఇదిగో’ ద్వారా ప్రవచనాత్మక ఉద్ఘాటనను నిలిపాం.
