revisions:
- from: భూమి మీద ఉన్న గడ్డికి గానీ, పచ్చగా ఉన్న దేనికైనా గానీ, ఏ చెట్టుకైనా గానీ హాని చేయకూడదనీ, నొసళ్ల మీద దేవుని ముద్ర లేని మనుషులకు మాత్రమే హాని చేయాలనీ వాటికి చెప్పబడింది.
  to: భూమిలోని గడ్డికిగానీ, పచ్చగా ఉన్న దేనికైనా గానీ, ఏ చెట్టుకైనా గానీ హాని చేయవద్దనీ, వారి నొసళ్లపై దేవుని ముద్ర లేని మనుషులకే హాని చేయాలనీ వాటికి చెప్పబడింది.
  rationale: The revision retains the draft’s faithful rendering of the passive instruction and the exception clause, while clarifying the genitive relation in ‘the grass of the earth’ and the possessive sense in ‘their foreheads.’ No footnote is needed because ‘పచ్చగా ఉన్న దేనికైనా’ already preserves the lexical breadth of πᾶν χλωρόν.
  reviewer_model: gpt-5.6-terra
