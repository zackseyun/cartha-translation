id: REV.9.4
reference: Revelation 9:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: te
  text: భూమిలోని గడ్డికిగానీ, పచ్చగా ఉన్న దేనికైనా గానీ, ఏ చెట్టుకైనా గానీ హాని చేయవద్దనీ, వారి నొసళ్లపై దేవుని ముద్ర లేని మనుషులకే హాని చేయాలనీ వాటికి చెప్పబడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: వాటికి చెప్పబడింది
  rationale: λέγω యొక్క కర్మణి ప్రయోగాన్ని, స్త్రీలింగ బహువచన సర్వనామం సూచించే మునుపటి మిడతలను తెలుగులో సహజంగా సూచిస్తూ నిలుపుతుంది; చెప్పినవారు ఎవరో మూలపాఠం వెల్లడించదు.
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: హాని చేయకూడదని
  rationale: ఈ తీర్పు-దర్శన సందర్భంలో ἀδικέω భౌతిక హాని చేయడం అనే భావాన్ని ఇస్తుంది; ఉద్దేశార్థక ἵνα నిర్మాణం తెలుగులో పరోక్ష ఆజ్ఞగా సహజంగా వ్యక్తమవుతుంది.
- source_word: τὸν χόρτον τῆς γῆς
  choice: భూమి మీద ఉన్న గడ్డి
  rationale: χόρτοςను ‘గడ్డి’గా స్పష్టంగా అనువదిస్తూ, τῆς γῆς సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὐδὲ πᾶν χλωρόν
  choice: పచ్చగా ఉన్న దేనికైనా
  rationale: నామవాచకంగా వాడిన χλωρόν అక్షరార్థంగా ‘పచ్చనిది’; ‘మొక్క’ అని కుదించకుండా మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: οὐδὲ πᾶν δένδρον
  choice: ఏ చెట్టుకైనా
  rationale: δένδρονకు నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: εἰ μὴ
  choice: మాత్రమే
  rationale: హాని చేయడానికి అనుమతించబడిన ఏకైక వర్గాన్ని సూచించే మినహాయింపు భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς ἀνθρώπους
  choice: మనుషులకు
  rationale: ἄνθρωποι ఇక్కడ మగవారిని మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది.
- source_word: οἵτινες οὐκ ἔχουσι
  choice: లేని
  rationale: సంబంధ వాక్యాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: దేవుని ముద్ర
  rationale: σφραγίς యొక్క యాజమాన్యం, గుర్తింపు, రక్షణకు సంబంధించిన ప్రకటన గ్రంథ ప్రతీకను ‘ముద్ర’ నిలుపుతుంది.
- source_word: ἐπὶ τῶν μετώπων
  choice: నొసళ్ల మీద
  rationale: μέτωπονకు సాధారణ, ప్రామాణిక తెలుగు పదమైన ‘నొసలు’ను వాడి, ἐπί యొక్క స్థానార్థాన్ని ‘మీద’గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀνθρώπους యొక్క పరిధి
  choice: మానవులను సాధారణంగా సూచించే ‘మనుషులు’
  alternative: మగవారు మాత్రమే అనే భావమిచ్చే పదం
  rationale: ఈ వచనం వృక్షజాలాన్ని దేవుని ముద్ర ఉన్న లేదా లేని మానవులతో భేదపరుస్తుంది; లింగపరమైన పరిమితికి మూలపాఠంలో ఆధారం లేదు.
- issue: కర్మణి రూపంలోని ఆదేశానికి మూలం
  choice: ఎవరు చెప్పారో పేర్కొనకుండా ‘వాటికి చెప్పబడింది’
  alternative: దేవుడు వాటికి ఆజ్ఞాపించాడు
  rationale: ἐρρέθη అనే కర్మణి రూపం మాట్లాడిన వ్యక్తిని వెల్లడించదు. సందర్భంలో పరమాధికారం దేవునిదైనా, అనువాదం మూలంలో లేని స్పష్టమైన కర్తను చేర్చదు.
- issue: εἰ μή తరువాతి హాని యొక్క భావం
  choice: ముద్ర లేని మనుషులకు మాత్రమే హాని చేయాలని
  alternative: వృక్షజాలాన్ని తప్ప మనుషులందరికీ హాని చేయాలని
  rationale: సంబంధ వాక్యం హాని పొందే మనుషుల వర్గాన్ని దేవుని ముద్ర లేనివారికే పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. మూలంలోని కర్మణి ప్రయోగం, మినహాయింపు నిర్మాణం, ‘పచ్చగా ఉన్న దేనికైనా’ అనే విస్తృత పదార్థం నిలుపబడ్డాయి.
