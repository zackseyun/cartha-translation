revisions:
- from: ఐదవ దూత బూర ఊదాడు. అప్పుడు ఆకాశం నుండి భూమికి పడిపోయి ఉన్న[a] ఒక నక్షత్రాన్ని[b] నేను చూశాను. అగాధపు బిలం[c] తాళంచెవి ఆ నక్షత్రానికి ఇవ్వబడింది.
  to: ఐదవ దూత బూర ఊదాడు. అప్పుడు ఆకాశం నుండి భూమికి పడిపోయి ఉన్న ఒక నక్షత్రాన్ని[a] నేను చూశాను[b]. అగాధపు బిలానికి తాళంచెవి అతనికి ఇవ్వబడింది.
  rationale: The revision keeps the star image, the perfect participle’s prior-completed sense, and the passive without naming its agent. It changes the dative reference to masculine “అతనికి,” matching αὐτῷ while leaving the identity unspecified, and clarifies the shaft–abyss relationship. Footnote c is retained as an unanchored lexical note only because the supplied draft structurally places its anchor at “బిలం”; in the revised text it should be anchored to “బిలానికి” in publication layout.
