id: REV.9.1
reference: Revelation 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: te
  text: ఐదవ దూత బూర ఊదాడు. అప్పుడు ఆకాశం నుండి భూమికి పడిపోయి ఉన్న ఒక నక్షత్రాన్ని[a] నేను చూశాను[b]. అగాధపు బిలానికి తాళంచెవి అతనికి ఇవ్వబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పడిపోయిన.’ గ్రీకు రూపాన్ని సంక్షిప్తంగా ఇలా అనువదించవచ్చు; అయితే యోహాను చూసే సమయానికి పడిపోవడం అప్పటికే జరిగిందనే భావాన్ని అది సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: తరువాత ‘తాళంచెవి అతనికి ఇవ్వబడింది’ అని ఉండడం వల్ల, ఈ ‘నక్షత్రం’ ఒక వ్యక్తిగత జీవికి ప్రతీక కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: బూర ఊదాడు
  rationale: σαλπίζω అంటే బూరను మోగించడం లేదా ఊదడం. ఆధునిక తెలుగులో ‘బూర ఊదాడు’ సహజంగా ఉండి, మూలంలోని బూర భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀστέρα
  choice: నక్షత్రం
  rationale: ἀστήρ యొక్క ప్రత్యక్ష అర్థం ‘నక్షత్రం.’ దర్శనసంబంధ సందర్భంలో ఇది ఒక వ్యక్తిగత జీవిని సూచించే ప్రతీక కావచ్చు; అయినా ప్రధాన పాఠ్యంలో ప్రతీకను వ్యాఖ్యానించి మార్చకుండా ఉంచడం సముచితం.
- source_word: πεπτωκότα
  choice: పడిపోయి ఉన్న
  rationale: పరిపూర్ణ క్రియాకృదంతం, యోహాను చూసే సమయానికి పడిపోవడం అప్పటికే జరిగి దాని ఫలిత స్థితి కొనసాగుతోందని సూచిస్తుంది. ‘పడిపోయి ఉన్న’ ఆ రెండు అంశాలనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: ఆకాశం నుండి భూమికి
  rationale: ప్రకటన గ్రంథంలోని దర్శన సందర్భంలో οὐρανόςను ‘ఆకాశం’గా అనువదించడం సహజం; ‘భూమికి’తో కలిసి మూలంలోని దిశాత్మక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐδόθη αὐτῷ
  choice: ఆ నక్షత్రానికి ఇవ్వబడింది
  rationale: ఇచ్చినవారు ఎవరో మూలంలో పేర్కొనని కర్మణి ప్రయోగాన్ని ఇది కాపాడుతుంది. గ్రీకు వ్యాకరణ లింగాన్ని బట్టి వ్యక్తిత్వాన్ని తెలుగులో బలవంతంగా నిర్ధారించకుండా, ముందున్న ‘నక్షత్రం’నే స్పష్టంగా సూచిస్తుంది.
- source_word: ἡ κλεὶς
  choice: తాళంచెవి
  rationale: κλείς అంటే తాళంచెవి. గ్రీకులో నిర్దిష్ట సూచన ఉన్నందున, తెలుగులో సందర్భబద్ధంగా ‘అగాధపు బిలం తాళంచెవి’ అని నిర్దిష్టంగా వ్యక్తమవుతుంది.
- source_word: τοῦ φρέατος
  choice: బిలం
  rationale: φρέαρ బావి, గొయ్యి, లేదా లోతుకు వెళ్లే బిలాన్ని సూచించగలదు. ఇక్కడ ‘బిలం’ అగాధంలోకి ప్రవేశించే తెరువును సూచిస్తూ, దానిని అగాధంతో పూర్తిగా సమానపరచదు.
- source_word: τῆς ἀβύσσου
  choice: అగాధపు
  rationale: ἄβυσσοςను ‘అగాధం’గా అనువదించడం దాని అపార లోతు భావాన్ని నిలుపుతుంది; ‘అడుగులేని గొయ్యి’ వంటి మరింత వ్యాఖ్యానాత్మక రూపాన్ని ప్రధాన పాఠ్యంలోకి తేవదు.
theological_decisions:
- issue: ‘నక్షత్రం’ను దూతగా లేదా సాతానుగా ప్రధాన పాఠ్యంలో గుర్తించాలా
  choice: ప్రధాన పాఠ్యంలో ‘నక్షత్రం’ అనే ప్రతీకనే ఉంచడం
  alternative: దేవదూత; సాతానును సూచించే వ్యక్తి
  rationale: వాక్యం ఆ వ్యక్తిని నక్షత్ర ప్రతీకతో చూపి, దానికి తాళంచెవి ఇవ్వబడిందని చెబుతుంది; కానీ అది ఎవరో స్పష్టంగా గుర్తించదు. కాబట్టి వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చకుండా ఉన్న ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ‘ఇవ్వబడింది’ అనే కర్మణి ప్రయోగంలో దేవుణ్ణి కర్తగా స్పష్టం చేయాలా
  choice: ఇచ్చినవారిని పేర్కొనకుండా కర్మణి రూపాన్ని నిలుపడం
  alternative: దేవుడు ఆ నక్షత్రానికి తాళంచెవి ఇచ్చాడు
  rationale: దేవుడే ఇచ్చాడనే భావన సందర్భానికి అనుకూలమైనప్పటికీ, గ్రీకు పాఠ్యం కర్తను పేర్కొనదు. అందువల్ల అనువాదం కూడా ఆ నియంత్రణను పాటిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన దర్శనశైలిని ఉపయోగించాం. ‘బూర ఊదాడు,’ ‘పడిపోయి ఉన్న,’ ‘తాళంచెవి ఇవ్వబడింది’ వంటి రూపాలు సహజత్వంతో పాటు మూలంలోని కాలసూచన, ప్రతీక, కర్మణి ప్రయోగాన్ని కాపాడుతాయి. ‘అతనికి’ అని వాడితే నక్షత్రం వ్యక్తి అని తెలుగులో ముందుగానే నిర్ణయించినట్లవుతుందని, ‘ఆ నక్షత్రానికి’ అని అనువదించాం.
