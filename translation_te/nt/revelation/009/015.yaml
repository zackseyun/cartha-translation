id: REV.9.15
reference: Revelation 9:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: te
  text: మనుషుల్లో మూడవ వంతును చంపడానికి, ఆ గంటకూ, ఆ రోజుకూ, ఆ నెలకూ, ఆ సంవత్సరానికీ సిద్ధం చేయబడి ఉన్న ఆ నలుగురు దేవదూతలు విడుదల చేయబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ గంటకూ, రోజుకూ, నెలకూ, సంవత్సరానికీ.” గ్రీకు వాక్యం దేవుని నిర్ణయంలో ఖచ్చితంగా నియమించబడిన సమయాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύθησαν
  choice: విడుదల చేయబడ్డారు
  rationale: ఇది λύω అనే క్రియ యొక్క భూతకాల కర్మణి రూపం. ముందటి వచనంలో బంధించబడి ఉన్న దేవదూతల సందర్భంలో ‘విడుదల చేయబడ్డారు’ అనేది కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἄγγελοι
  choice: దేవదూతలు
  rationale: ప్రకటన గ్రంథంలోని దర్శనాత్మక సందర్భంలో ఇక్కడ మానవ సందేశకులు కాక, అతీంద్రియ దూతలే ఉద్దేశించబడ్డారు.
- source_word: οἱ ἡτοιμασμένοι
  choice: సిద్ధం చేయబడి ఉన్న
  rationale: పరిపూర్ణ కర్మణి అసమాపక క్రియ గతంలో జరిగిన సిద్ధపరచడం వల్ల కొనసాగుతున్న సిద్ధస్థితిని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ ముందస్తు సిద్ధతనూ దాని ఫలితస్థితినీ నిలుపుతుంది.
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: ఆ గంటకూ, ఆ రోజుకూ, ఆ నెలకూ, ఆ సంవత్సరానికీ
  rationale: మూలంలోని వరుస కాలపదాలను అలాగే నిలిపి, ఖచ్చితంగా నియమించబడిన కాలంపై ఉన్న సంచిత ఉద్ఘాటనను వ్యక్తం చేస్తుంది. ఇది ఒక నిర్దిష్ట క్షణమా లేక కలిపిన కాలవ్యవధా అనే ప్రశ్నను అనవసరంగా తీర్చదు.
- source_word: ἵνα ἀποκτείνωσιν
  choice: చంపడానికి
  rationale: ἵνα తో వచ్చిన క్రియ ఉద్దేశాన్ని సూచిస్తుంది. ‘చంపడానికి’ అనేది ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఆ ప్రయోజన భావాన్ని తెలియజేస్తుంది.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: మనుషుల్లో మూడవ వంతును
  rationale: τὸ τρίτον భాగసూచకంగా ‘మూడవ వంతు’ అని అర్థం; ἀνθρώπων సాధారణంగా మానవులందరినీ సూచిస్తుంది, పురుషులను మాత్రమే కాదు. ‘మనుషుల్లో’ ఆ సాధారణ మానవ పరిధిని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: ‘గంట, రోజు, నెల, సంవత్సరం’ అనే కాలపదబంధం యొక్క భావం
  choice: దేవుని నిర్ణయంలోని నిర్దిష్ట కాలాన్ని సూచించే పదక్రమాన్ని యథాతథంగా నిలిపాం.
  alternative: ఒక సంవత్సరం, ఒక నెల, ఒక రోజు, ఒక గంట కలిసిన మొత్తం కాలవ్యవధిగా అర్థం చేసుకోవచ్చు.
  rationale: ఒకే నిర్దేశక పదం కింద వచ్చే కాలపదాల వరుస ఖచ్చితంగా నియమించబడిన సమయాన్ని సహజంగా సూచిస్తుంది. అయితే ప్రకటన గ్రంథపు కాలక్రమంపై ఒక ప్రత్యేక గణనను అనువాదంలో రుద్దకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
- issue: ἀνθρώπων యొక్క పరిధి
  choice: మనుషులు—సాధారణంగా మానవులందరూ
  alternative: మానవజాతి; ప్రజలు; పురుషులు
  rationale: ఈ నామవాచకం ఇక్కడ లింగపరంగా పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది. అందువల్ల ‘మనుషులు’ అనే పదం మూలార్థాన్ని సహజంగా, కచ్చితంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని కర్మణి నిర్మాణం, ముందస్తు సిద్ధత, కాలపదాల వరుస, మానవుల సాధారణ పరిధి నిలుపబడ్డాయి. ప్రధాన పాఠ్యంలో [a] సూచికను సంబంధిత కాలపదబంధం తరువాత ఉంచాం.
