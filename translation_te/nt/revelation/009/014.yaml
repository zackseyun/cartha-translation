id: REV.9.14
reference: Revelation 9:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀λέγοντα τῷ ἕκτῳ ἀγγέλῳ, ὁ ἔχων τὴν σάλπιγγα· Λῦσον τοὺς τέσσαρας ἀγγέλους τοὺς δεδεμένους ἐπὶ τῷ ποταμῷ τῷ μεγάλῳ Εὐφράτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/014.yaml
  text: saying to the sixth angel[a], the one who had the trumpet, “Release the four angels who are bound at the great river Euphrates.”
translation:
  language: te
  text: 'బాకా పట్టుకున్న ఆరవ దూతకు ఇలా చెప్పింది: “యూఫ్రటీసు మహానది వద్ద బంధించబడి ఉన్న నలుగురు దూతలను విడిపించు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బంధించబడినవారు’ లేదా ‘బంధించబడి ఉన్నవారు’ అని కూడా అనువదించవచ్చు. గ్రీకులోని పూర్ణ భూత నిష్క్రియ కృదంతం, గతంలో జరిగిన బంధం ఫలితంగా వారు ఇప్పటికీ నిర్బంధ స్థితిలో ఉన్నారని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντα
  choice: ఇలా చెబుతూ
  rationale: వర్తమాన కృదంతం మునుపటి వచనంలోని బలిపీఠం నుండి వచ్చిన స్వరంతో ఈ మాటను అనుసంధానిస్తుంది; తెలుగు వాక్యప్రవాహంలో ఆ కొనసాగుతున్న మాటల చర్యను సహజంగా నిలుపుతుంది.
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: ఆరవ దూతతో
  rationale: సంబోధనకు లక్ష్యమైన పరోక్ష కర్మను ఆధునిక తెలుగులో సహజమైన ‘తో’ విభక్తితో వ్యక్తం చేసింది.
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: బాకా కలిగివున్న
  rationale: ఈ విశేషణాత్మక కృదంత పదబంధం ఏ ఆరవ దూత ఉద్దేశించబడ్డాడో గుర్తిస్తుంది; ‘కలిగివున్న’ స్వాధీనాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: Λῦσον
  choice: విడిపించు
  rationale: λύω యొక్క ఆజ్ఞార్థక రూపం బంధాన్ని తొలగించి విడుదల చేయమనే భావాన్ని ప్రస్తుత తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: నలుగురు దూతలను
  rationale: సంఖ్యతో కూడిన ప్రత్యక్ష కర్మను నేరుగా అనువదించింది.
- source_word: τοὺς δεδεμένους
  choice: బంధించబడి ఉన్న
  rationale: పూర్ణ భూత నిష్క్రియ కృదంతం గతంలో జరిగిన బంధం వల్ల కొనసాగుతున్న ప్రస్తుత స్థితిని సూచిస్తుంది; ఈ తెలుగు రూపం ఆ రెండు కోణాలనూ నిలుపుతుంది.
- source_word: ἐπὶ τῷ ποταμῷ
  choice: నది దగ్గర
  rationale: దత్తి విభక్తితో ఉన్న ἐπί ఇక్కడ స్థాన సంబంధాన్ని సూచిస్తుంది; ‘దగ్గర’ నది ఒడ్డున లేదా దాని పరిసర ప్రాంతంలో ఉన్న భావాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా అందిస్తుంది.
- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: యూఫ్రటీసు అనే మహానది
  rationale: గ్రీకు సమానాధికరణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ నది పేరు మరియు ‘మహా’ అనే వర్ణన రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: నలుగురు దూతల గుర్తింపు మరియు నైతిక స్థితి
  choice: ‘నలుగురు దూతలు’ అని మాత్రమే అనువదించడం
  alternative: ‘పడిపోయిన నలుగురు దూతలు’ లేదా ‘తీర్పు కోసం నియమించబడిన నలుగురు దూతలు’
  rationale: వచనం వారిని యూఫ్రటీసు దగ్గర బంధించబడిన దూతలని మాత్రమే గుర్తిస్తుంది. ‘పడిపోయినవారు’ వంటి విశేషణం మూలపాఠంలో స్పష్టంగా లేని ధార్మిక నిర్ణయాన్ని చేర్చుతుంది; అందువల్ల ఉద్దేశపూర్వక అనిశ్చితి నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ప్రకటన గ్రంథపు గంభీర శైలిని నిలుపుతూ రూపొందించబడింది. ‘బాకా’ అనే సాధారణ బైబిలు పదాన్ని ఉపయోగించింది. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
