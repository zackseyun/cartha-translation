id: REV.9.9
reference: Revelation 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: te
  text: వాటికి ఇనుప ఛాతికవచాలవంటి ఛాతికవచాలు ఉన్నాయి. వాటి రెక్కల శబ్దం యుద్ధానికి దూసుకుపోతున్న అనేక గుర్రాలు లాగే రథాల ధ్వనిలా ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “యుద్ధానికి పరుగెత్తుతున్న అనేక గుర్రాల రథాల ధ్వనిలా.”'
    reason: ἁρμάτων ἵππων πολλῶν τρεχόντων అనే పదబంధంలోని జనిటివ్ సంబంధాన్నీ, పురుషలింగ బహువచనమైన τρεχόντων ‘గుర్రాలు’తో వ్యాకరణపరంగా సరిపోవడాన్నీ దగ్గరగా చూపే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: θώρακας
  choice: ఛాతి కవచాలు
  rationale: θώραξ శరీరంలోని ఛాతి/మొండెం భాగాన్ని కప్పే కవచాన్ని సూచిస్తుంది. సాధారణ ‘కవచాలు’ కంటే ‘ఛాతి కవచాలు’ మూలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὡς θώρακας σιδηροῦς
  choice: ఇనుప కవచాలవంటి ఛాతి కవచాలు
  rationale: ὡς సూచించే పోలికను ‘వంటి’తో నిలిపి, σιδηροῦς‌ను సహజమైన తెలుగులో ‘ఇనుప’గా అనువదించింది.
- source_word: φωνὴ
  choice: శబ్దం / ధ్వని
  rationale: ఇక్కడ φωνή మాట లేదా స్వరం కాక, రెక్కలు మరియు రథాలు కలిగించే వినిపించే శబ్దాన్ని సూచిస్తుంది. ఒకే వాక్యంలో సహజమైన శైలికోసం ‘శబ్దం’, ‘ధ్వని’ రెండూ వాడబడ్డాయి.
- source_word: πτερύγων
  choice: రెక్కల
  rationale: πτέρυξ‌కు సూటిగా, సహజంగా సరిపోయే తెలుగు పదం ‘రెక్క’.
- source_word: ἁρμάτων ἵππων πολλῶν
  choice: అనేక గుర్రపు రథాల
  rationale: గ్రీకు పదబంధంలోని రథాలు, గుర్రాలు రెండింటినీ సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది. జనిటివ్ సంబంధంలోని నిర్మాణాత్మక అస్పష్టతను పాదసూచికలో మరింత అక్షరార్థంగా చూపించింది.
- source_word: τρεχόντων
  choice: దూసుకుపోతున్న
  rationale: τρέχω ప్రాథమికంగా ‘పరుగెత్తు’ అని అర్థం. యుద్ధం వైపు వెళ్తున్న రథాల దృశ్యంలో ‘దూసుకుపోతున్న’ వేగవంతమైన చలనాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘దాడి చేస్తున్న’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: εἰς πόλεμον
  choice: యుద్ధానికి
  rationale: εἰς πόλεμον‌లోని దిశను, యుద్ధ సందర్భాన్ని సరళంగా నిలుపుతుంది.
theological_decisions:
- issue: యోహాను దర్శనంలోని దృశ్య స్వభావం
  choice: ὡς (‘వంటి/లా’) సూచించే రెండు పోలికలను పోలికలుగానే అనువదించడం
  alternative: ఈ రూపాలను యంత్రాలు, దయ్యాలు లేదా ఒక నిర్దిష్ట సైన్యంగా అనువాదంలోనే గుర్తించడం
  rationale: వాక్యం స్పష్టమైన అపోకలిప్టిక్ పోలికలను ఇస్తుంది; వాటి అంతిమ సూచన ఏమిటో అనువాదం నిర్ణయించకుండా దృశ్యంలోని ఉద్రిక్తతను, బహుళ వ్యాఖ్యాన అవకాశాన్ని నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఛాతి కవచాలు’ సాంకేతిక ఖచ్చితత్వాన్ని, ‘దూసుకుపోతున్న’ దర్శనంలోని వేగాన్ని నిలుపుతాయి. పొడవైన గ్రీకు సమన్వయ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం.
