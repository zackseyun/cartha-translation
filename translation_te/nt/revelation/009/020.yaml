- from: ఈ తెగుళ్ల వల్ల చంపబడకుండా మిగిలిన మనుషులు[a], అయినప్పటికీ తమ చేతుల పనులను[b] విడిచిపెట్టి పశ్చాత్తాపపడలేదు. దయ్యాలనూ, చూడలేని, వినలేని, నడవలేని బంగారం, వెండి, కంచు, రాయి, చెక్కతో చేసిన విగ్రహాలనూ పూజించకుండా ఉండేందుకు[c] వారు పశ్చాత్తాపపడలేదు.
  to: ఈ తెగుళ్ల వల్ల చంపబడకుండా మిగిలిన మనుషులు[a] తమ చేతుల పనులనుండి పశ్చాత్తాపపడలేదు, దయ్యాలనూ, బంగారం, వెండి, కంచు, రాయి, చెక్కతో చేసిన—చూడలేని, వినలేని, నడవలేని—విగ్రహాలనూ పూజించకుండా ఉండేందుకు[c][b].
