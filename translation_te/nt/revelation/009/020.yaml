id: REV.9.20
reference: Revelation 9:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: te
  text: ఈ తెగుళ్ల వల్ల చంపబడకుండా మిగిలిన మనుషులు[a] తమ చేతుల పనులనుండి పశ్చాత్తాపపడలేదు, దయ్యాలనూ, బంగారం, వెండి, కంచు, రాయి, చెక్కతో చేసిన—చూడలేని, వినలేని, నడవలేని—విగ్రహాలనూ పూజించకుండా ఉండేందుకు[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిగిలిన మానవజాతి.’ గ్రీకు పదం ఇక్కడ స్త్రీపురుషులందరినీ సూచించే సాధారణ పదం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తమ చేతుల పనుల నుండి పశ్చాత్తాపపడలేదు.’ ఈ సందర్భంలో ఆ మాట ముఖ్యంగా వారు తయారుచేసి పూజించిన వాటిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘వారు వాటిని పూజించకుండా ఉండేలా.’ గ్రీకు ఉపవాక్యం ఉద్దేశాన్నిగానీ ఉద్దేశిత ఫలితాన్నిగానీ వ్యక్తం చేయగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: మిగిలిన మనుషులు
  rationale: λοιποί యొక్క ‘మిగిలినవారు’ అనే భావాన్నీ, ἀνθρώπων యొక్క స్త్రీపురుషులందరినీ సూచించే సాధారణ మానవ అర్థాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις
  choice: ఈ తెగుళ్ల వల్ల చంపబడకుండా
  rationale: కర్మణి రూపమైన ἀπεκτάνθησανను స్పష్టంగా నిలుపుతూ, ఇక్కడ సాధనార్థకంగా ఉన్న ἐνను తెలుగులో సహజమైన ‘వల్ల’తో అందిస్తుంది.
- source_word: οὐδὲ μετενόησαν
  choice: అయినప్పటికీ ... పశ్చాత్తాపపడలేదు
  rationale: తెగుళ్ల నుండి తప్పించుకున్న తరువాత కూడా వారు మారలేదనే οὐδέ యొక్క బలాన్ని సహజమైన తెలుగు విరుద్ధార్థక అనుసంధానంతో తెలియజేస్తుంది.
- source_word: ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: తమ చేతుల పనులను విడిచిపెట్టి
  rationale: ἐκ యొక్క దూరమవడం/వెనుదిరగడం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ‘తమ చేతుల పనులు’ అనే బైబిలీయ చిత్రాన్ని నిలుపుతుంది.
- source_word: τὰ δαιμόνια
  choice: దయ్యాలు
  rationale: కొత్త నిబంధనలో విరోధాత్మక ఆత్మీయ ప్రాణులను సూచించే δαιμόνιαకు సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: τὰ εἴδωλα
  choice: విగ్రహాలు
  rationale: ఇక్కడ తటస్థమైన ప్రతిమలను కాక ఆరాధించబడే మూర్తులను సూచిస్తున్నందున ‘విగ్రహాలు’ సందర్భానికి తగినది.
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: బంగారం, వెండి, కంచు, రాయి, చెక్కతో చేసిన
  rationale: విగ్రహాల పదార్థాలను వరుసగా స్పష్టంగా చూపుతుంది; χαλκόςకు ఇక్కడ ‘కంచు’ అనేది ‘ఇత్తడి’కంటే పదార్థపరంగా సమీపమైన ఎంపిక.
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: చూడలేని, వినలేని, నడవలేని
  rationale: విగ్రహాల అశక్తతను ఎత్తిచూపే మూడు క్రియలనూ సంక్షిప్తంగా, సమాంతరంగా నిలుపుతుంది; περιπατεῖνను సాధారణీకరించకుండా ‘నడవడం’గానే అనువదిస్తుంది.
theological_decisions:
- issue: ἀνθρώπων యొక్క సమష్టి, లింగసామాన్య పరిధి
  choice: మిగిలిన మనుషులు
  alternative: మిగిలిన మానవజాతి
  rationale: ఈ పదం పురుషులను మాత్రమే కాక మనుషులందరినీ సూచిస్తుంది. ‘మనుషులు’ తెలుగులో సహజంగా ఉండి, చంపబడినవారికి భిన్నంగా మిగిలిన వ్యక్తుల సమూహాన్ని స్పష్టంగా చూపుతుంది.
- issue: ἵνα μὴ προσκυνήσουσινలో పశ్చాత్తాపానికీ విగ్రహారాధన మానడానికీ ఉన్న సంబంధం
  choice: పూజించకుండా ఉండేందుకు వారు పశ్చాత్తాపపడలేదు
  alternative: పూజించడం మానుకునేలా వారు పశ్చాత్తాపపడలేదు
  rationale: ἵνα μήలోని ఉద్దేశం లేదా ఉద్దేశిత ఫలితం అనే భావాన్ని నిలుపుతుంది; పశ్చాత్తాపం విగ్రహారాధన నుండి వెనుదిరగడాన్ని కలిగి ఉందని వాక్యం చెప్పేదానికంటే మించి ఏ ప్రత్యేక సిద్ధాంతాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; రెండో వాక్యంలో ‘వారు పశ్చాత్తాపపడలేదు’ను పునరుక్తి చేసి ἵνα μή ఉపవాక్య సంబంధాన్ని స్పష్టం చేశాం. పదార్థాల జాబితా యొక్క సమీకృత ప్రభావం, విగ్రహాల అశక్తతను చూపే మూడు క్రియలు నిలుపబడ్డాయి.
