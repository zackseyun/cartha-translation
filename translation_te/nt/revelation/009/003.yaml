id: REV.9.3
reference: Revelation 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: te
  text: ఆ పొగలోనుండి మిడతలు భూమిమీదికి వచ్చాయి. భూమిమీద ఉండే తేళ్లకు అధికారం ఉన్నట్లే, వాటికీ అధికారం ఇవ్వబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటికి శక్తి ఇవ్వబడింది.’ గ్రీకు పదం అధికారం, హక్కు లేదా శక్తిని సూచించగలదు. ఇక్కడ కర్మణి ప్రయోగం అప్పగించబడిన అనుమతిని సూచిస్తున్నందున ‘అధికారం’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ
  choice: ఆ పొగలోనుండి
  rationale: ἐκ సూచించే లోపలి నుండి బయటికి వచ్చే కదలికను సహజమైన తెలుగులో నిలుపుతుంది; నిర్దిష్ట ఉపపదాన్ని ‘ఆ’గా ప్రతిబింబిస్తుంది.
- source_word: ἐξῆλθον
  choice: వచ్చాయి
  rationale: ముందున్న ‘పొగలోనుండి’తో కలిపి బయటికి వచ్చిన కదలికను పునరుక్తి లేకుండా తెలుపుతుంది.
- source_word: ἀκρίδες
  choice: మిడతలు
  rationale: బైబిలు మరియు ప్రకటనసాహిత్య సందర్భంలో ἀκρίδεςకు సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: εἰς τὴν γῆν
  choice: భూమిమీదికి
  rationale: εἰςలోని దిశాత్మక భావాన్ని ‘మీదికి’ నిలుపుతుంది; γῆను ఈ విశ్వవ్యాప్త సందర్భంలో ‘భూమి’గా అనువదిస్తుంది.
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: వాటికీ అధికారం ఇవ్వబడింది
  rationale: గ్రీకు కర్మణి ప్రయోగాన్ని నిలిపి, ఇచ్చినవారిని వాక్యం చెప్పినదానికంటే స్పష్టంగా పేర్కొనదు. ἐξουσίαలోని అప్పగించబడిన అధికారం భావాన్ని ‘అధికారం’ ప్రతిబింబిస్తుంది.
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: అధికారం ఉన్నట్లే
  rationale: ὡς సూచించే పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, గ్రీకులో పునరావృతమైన ἐξουσία భావాన్ని నిలుపుతుంది.
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: భూమిమీద ఉండే తేళ్లు
  rationale: పదక్షరంగా ‘భూమి యొక్క తేళ్లు’ అనడం కంటే ఆధునిక తెలుగులో సహజంగా ఉండి, భూమికి చెందిన సాధారణ తేళ్లనే సూచిస్తుంది.
theological_decisions:
- issue: మిడతలకు ఇవ్వబడిన సామర్థ్య స్వభావం
  choice: ἐξουσίαను ‘అధికారం’గా అనువదించి, ‘ఇవ్వబడింది’ అనే కర్మణి రూపాన్ని నిలుపడం
  alternative: ‘శక్తి’గా అనువదించడం లేదా ఇచ్చినవారిని స్పష్టంగా దేవుడని పేర్కొనడం
  rationale: వాటి కార్యం స్వతంత్ర శక్తివల్ల కాక అప్పగించబడిన అనుమతి లేదా అధికార పరిధిలో జరుగుతుందనే భావాన్ని ‘అధికారం’ బాగా నిలుపుతుంది. ఇచ్చినవారిని స్పష్టంగా పేర్కొనకుండా ఉండడం మూలపాఠంలోని ఉద్దేశపూర్వక నిర్దిష్టతలేమిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. గ్రీకు పోలికను సహజంగా చేయడానికి ఉపవాక్య క్రమం తెలుగుకు అనుగుణంగా మార్చబడింది.
