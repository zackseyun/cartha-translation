  source_fidelity: 'The translation accurately represents all major elements of the Greek: emergence from within the smoke, the locusts'' movement onto the earth, the passive granting of ἐξουσία without naming the giver, and the comparison with the authority of earthly scorpions. “భూమిమీద ఉండే తేళ్లు” is a natural Telugu rendering of οἱ σκορπίοι τῆς γῆς and does not materially narrow the sense.'
