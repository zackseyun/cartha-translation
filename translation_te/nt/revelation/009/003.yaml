  terminology: “మిడతలు” is the appropriate term for ἀκρίδες. “అధికారం” consistently renders both occurrences of ἐξουσία and appropriately preserves the sense of granted authority. The footnote responsibly notes “శక్తి” as a lexical alternative while retaining the passive construction.
