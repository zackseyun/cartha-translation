  to: 'నేను ఆయనతో, “నా ప్రభువా, మీకే తెలుసు” అన్నాను. అప్పుడు ఆయన నాతో ఇలా అన్నాడు: “వీరు మహా శ్రమలోనుండి[a] బయటికి వస్తున్నవారు. వీరు తమ అంగీలను కడిగి, గొర్రెపిల్ల రక్తంలో[b] వాటిని తెల్లగా చేశారు.”'
