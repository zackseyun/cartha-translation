id: REV.7.14
reference: Revelation 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: te
  text: 'నేను ఆయనతో, “నా ప్రభువా, మీకే తెలుసు” అన్నాను. అప్పుడు ఆయన నాతో ఇలా అన్నాడు: “వీరు మహా శ్రమలోనుండి[a] బయటికి వస్తున్నవారు. వీరు తమ అంగీలను కడిగి, గొర్రెపిల్ల రక్తంలో[b] వాటిని తెల్లగా చేశారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మహా శ్రమ” అనే మాటను “మహా బాధ” లేదా “మహా సంకటం” అని కూడా అనువదించవచ్చు. గ్రీకు పదం ఒత్తిడి, బాధ లేదా తీవ్రమైన ఆపదను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “గొర్రెపిల్ల రక్తంలో” అనే మూలభాషా రూపాన్ని ఇక్కడ నిలిపాం. గ్రీకు మాటను “గొర్రెపిల్ల రక్తం ద్వారా” అని సాధనార్థకంగా కూడా అర్థం చేసుకోవచ్చు; అయితే ఈ అనువాదం ప్రకటన గ్రంథంలోని విరోధాభాస శుద్ధీకరణ దృశ్యాన్ని కాపాడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: అన్నాను
  rationale: రూపం పరిపూర్ణ కాలంలో ఉన్నప్పటికీ, యోహాను కథన సంభాషణలో ఇది సహజంగా సాధారణ భూతకాల భావాన్ని ఇస్తుంది.
- source_word: Κύριέ μου
  choice: నా ప్రభువా
  rationale: యోహాను దేవునితో లేదా మెస్సీయతో కాక పరలోకపు పెద్దతో మాట్లాడుతున్నాడు. ఈ రూపం గౌరవసూచక సంబోధనను నిలుపుతూ, ఆ పెద్దను దైవంగా గుర్తించినట్లు చేయదు.
- source_word: σὺ οἶδας
  choice: మీకే తెలుసు
  rationale: స్పష్టంగా ఉన్న σὺ అనే సర్వనామంలోని స్వల్ప ఉద్ఘాటనను ‘మీకే’ తెలియజేస్తుంది; గౌరవార్థక బహువచనం సందర్భానికి సహజం.
- source_word: οἱ ἐρχόμενοι
  choice: బయటికి వస్తున్నవారు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న లేదా లక్షణాత్మక చర్యను భూతకాలంగా మార్చకుండా నిలుపుతుంది.
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: మహా శ్రమలోనుండి
  rationale: θλῖψις సూచించే తీవ్రమైన బాధ, ఒత్తిడి, ఆపద భావాన్ని తెలుగు బైబిలు సందర్భంలో సహజమైన ‘శ్రమ’ తెలియజేస్తుంది; ఏ ప్రత్యేక అంత్యకాల సిద్ధాంతాన్నీ అనువాదంలో చేర్చదు.
- source_word: ἔπλυναν
  choice: కడిగి
  rationale: పూర్తయిన చర్యగా చూపబడిన కడగడాన్ని సహజమైన తెలుగు క్రియతో అందిస్తుంది.
- source_word: στολάς
  choice: అంగీలను
  rationale: στολή సాధారణ వస్త్రం కంటే పొడవైన పైవస్త్రం లేదా గౌరవప్రదమైన అంగీని సూచిస్తుంది; ‘అంగీలు’ ఆ దృశ్యాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐλεύκαναν
  choice: తెల్లగా చేసుకున్నారు
  rationale: ‘తెల్లబరిచారు’ కంటే సహజంగా ఉండి, ‘తెల్లగా చేయడం’ అనే కారణార్థక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν τῷ αἵματι
  choice: రక్తంలో
  rationale: ἐν అనే పూర్వప్రత్యయాన్ని ‘లో/లోపల’ భావంతో నిలిపి, రక్తంలో కడగడం వల్ల తెల్లబడే ప్రకటన గ్రంథంలోని ఉద్దేశపూర్వక విరోధాభాస దృశ్యాన్ని కాపాడుతుంది.
- source_word: τοῦ ἀρνίου
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలో ఇది యేసును సూచించే బిరుదు. తెలుగు లిపిలో పెద్ద అక్షర భేదం లేకపోవడంతో సందర్భమే బిరుదు భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: పెద్దను సంబోధించడంలో κύριος అనువాదం
  choice: నా ప్రభువా
  alternative: అయ్యా
  rationale: ‘అయ్యా’ సాధ్యమైనప్పటికీ మూలంలోని ఘనమైన గౌరవ సంబోధనను కొంత తగ్గిస్తుంది. ‘నా ప్రభువా’ గౌరవాన్ని నిలుపుతుంది; సందర్భం వల్ల ఇది దేవునికి లేదా క్రీస్తుకు చేసిన సంబోధన కాదని స్పష్టమవుతుంది.
- issue: ‘మహా శ్రమ’ యొక్క వ్యాఖ్యానం
  choice: మహా శ్రమ
  alternative: మహా బాధ / మహా సంకటం
  rationale: ఈ పదబంధాన్ని ఏదో ఒక అంత్యకాల వ్యవస్థ ప్రకారం వివరించకుండా నిఘంటు పరిధిలో అనువదించాం. ఇది ప్రత్యేక అంత్యకాల కాలాన్నా, దేవుని ప్రజల విస్తృత బాధలనన్నా, రెండింటినీ సూచిస్తుందా అనే ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: గొర్రెపిల్ల రక్తంలో తెల్లగా చేయడం
  choice: రక్తంలో
  alternative: రక్తం ద్వారా
  rationale: ἐν సాధనార్థకంగా కూడా అర్థమవవచ్చు. అయినా ‘రక్తంలో’ అనే రూపం మూలంలోని ఆశ్చర్యకరమైన శుద్ధీకరణ దృశ్యాన్ని, దాని ఉద్దేశపూర్వక విరోధాభాసాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. పరలోకపు పెద్దకు గౌరవార్థక సంబోధనను ఉపయోగించాం. ప్రధాన వాక్యంలోని [a], [b] సూచికలు సంబంధిత పదబంధాల వెంటనే ఉంచబడ్డాయి.
