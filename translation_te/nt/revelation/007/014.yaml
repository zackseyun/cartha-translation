review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the Greek sequence and preserves the present participle in οἱ ἐρχόμενοι as “బయటికి వస్తున్నవారు.” “మహా శ్రమ” appropriately retains the lexical and eschatological openness of τῆς θλίψεως τῆς μεγάλης, and “గొర్రెపిల్ల రక్తంలో” rightly preserves ἐν’s striking imagery without forcing an instrumental interpretation. The respectful address “నా ప్రభువా” is contextually defensible for the elder.
  naturalness: The Telugu is generally clear, modern, and suitably elevated. However, “వాటిని తెల్లగా చేసుకున్నారు” is reflexive/benefactive in ordinary Telugu and can imply that they made the robes white for themselves, rather than directly stating that they made the robes white. “వాటిని తెల్లగా చేశారు” is more natural and precise.
  terminology: “అంగీలు” suitably conveys robes in this context; “మహా శ్రమ” and “గొర్రెపిల్ల” are established, comprehensible biblical terminology. The honorific singular forms appropriately fit the heavenly elder without identifying him as God or Christ.
  issues:
  - severity: medium
    issue: Reflexive wording for ἐλεύκαναν
    rationale: 'The Greek has a direct object, αὐτάς (“them,” referring to the robes): “they made them white.” The draft’s “తెల్లగా చేసుకున్నారు” adds a reflexive/for-themselves nuance not expressed by the Greek. Replace it with “తెల్లగా చేశారు.”'
  revised_text: 'నేను ఆయనతో, “నా ప్రభువా, మీకే తెలుసు” అన్నాను. అప్పుడు ఆయన నాతో ఇలా అన్నాడు: “వీరు మహా శ్రమలోనుండి[a] బయటికి వస్తున్నవారు. వీరు తమ అంగీలను కడిగి, గొర్రెపిల్ల రక్తంలో[b] వాటిని తెల్లగా చేశారు.”'
