id: REV.7.4
reference: Revelation 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: te
  text: 'ముద్ర వేయబడినవారి సంఖ్యను నేను విన్నాను: లక్ష నలభై నాలుగు వేల మంది—ఇశ్రాయేలు కుమారుల ప్రతి గోత్రం నుండి ముద్ర వేయబడినవారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు సంతానం.” గ్రీకులో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు” అని ఉంది; ఇది పుంలింగ వంశావళి పదప్రయోగాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: నేను విన్నాను
  rationale: కథన సందర్భంలో ἀκούω పదానికి చెందిన భూతకాల రూపాన్ని సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: ἀριθμὸν
  choice: సంఖ్యను
  rationale: లెక్కించబడిన సమూహం మొత్తాన్ని సూచించే ἀριθμόςకు సాధారణమైన తెలుగు సమానార్థకం.
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: ముద్ర వేయబడినవారి / ముద్ర వేయబడినవారు
  rationale: పూర్తయిన క్రియ వల్ల కొనసాగుతున్న స్థితిని సూచించే పరిపూర్ణ కర్మణి కృదంత భావాన్ని నిలుపుతూ, మూలంలోని పునరుక్తిని కూడా కాపాడుతుంది.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: లక్ష నలభై నాలుగు వేల మంది
  rationale: 144,000ను ఆధునిక తెలుగులో సహజమైన సంఖ్యా రూపంలో వ్యక్తం చేస్తుంది; వ్యక్తుల సంఖ్య కాబట్టి ‘మంది’ చేర్చబడింది.
- source_word: ἐκ
  choice: నుండి
  rationale: మూలం లేదా ఆవిర్భావాన్ని సూచించే ἐκ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: πάσης φυλῆς
  choice: ప్రతి గోత్రం
  rationale: ఏకవచన πᾶς యొక్క విభజనాత్మక భావాన్ని, అంటే ఒక్కొక్క గోత్రం నుండి అనే అర్థాన్ని, కాపాడుతుంది.
- source_word: υἱῶν Ἰσραήλ
  choice: ఇశ్రాయేలు కుమారుల
  rationale: మూలంలోని పుంలింగ వంశావళి పదప్రయోగాన్ని, గోత్ర సంబంధ సందర్భాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: గోత్రాల జాబితా సందర్భంలో υἱῶν Ἰσραήλ అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు సంతానం
  rationale: గ్రీకు పాఠంలో పుంలింగమైన υἱῶν స్పష్టంగా ఉంది. ‘కుమారులు’ మూలంలోని వంశావళి భాషను నిలుపుతుంది; ఏ ప్రత్యేక అంత్యకాల సిద్ధాంతాన్ని పాఠ్యంలోకి చేర్చదు. తెలుగులో సంప్రదాయంగా వినిపించే లింగసామాన్య ప్రత్యామ్నాయాన్ని పాదటీకలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. మూలంలోని ‘ముద్ర వేయబడిన’ పద పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
