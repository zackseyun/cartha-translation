id: REV.7.15
reference: Revelation 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: te
  text: అందుచేత వారు దేవుని సింహాసనం ఎదుట ఉన్నారు; ఆయన ఆలయంలో రాత్రింబగళ్లు ఆయనకు సేవ చేస్తున్నారు. సింహాసనం మీద కూర్చున్నవాడు తన గుడారాన్ని వారిమీద విస్తరిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిమీద నివసిస్తాడు” లేదా “వారికి ఆశ్రయంగా ఉంటాడు.” గ్రీకు క్రియ ‘గుడారం’ లేదా దేవుని నివాస గుడారం అనే భావచిత్రంతో సంబంధమున్నది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: అందుచేత
  rationale: ముందటి వచనంలో చెప్పిన కారణానికి ఈ వాక్యాన్ని స్పష్టంగా అనుసంధానిస్తుంది; సంక్షిప్తంగా, సహజంగా కారణ–ఫలిత సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐνώπιον
  choice: ఎదుట
  rationale: దేవుని సింహాసన సమక్షంలో వారు ఉన్నారనే స్థలిక, సాన్నిధ్య భావాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λατρεύουσιν
  choice: సేవ చేస్తున్నారు
  rationale: ఈ క్రియ దేవునికి అర్పించే ఆరాధనాత్మక సేవను సూచిస్తుంది. ఆలయ సందర్భం ఆ పవిత్ర భావాన్ని స్పష్టం చేస్తుంది; ‘ఆరాధిస్తున్నారు’ అని మాత్రమే అనడం వల్ల సేవ అనే విస్తృత భావం కుదించబడవచ్చు.
- source_word: ἡμέρας καὶ νυκτός
  choice: రాత్రింబగళ్లు
  rationale: ఎడతెగని సేవ అనే భావాన్ని తెలుగులో సహజమైన, సుపరిచితమైన జంటపదంతో తెలియజేస్తూ మూలంలోని పగలు–రాత్రి భావచిత్రాన్ని నిలుపుతుంది.
- source_word: ναῷ
  choice: ఆలయంలో
  rationale: ναός సూచించే దేవాలయ పవిత్ర స్థలాన్ని సాధారణ పాఠకులకు స్పష్టమైన పదంతో అందిస్తుంది; ఇది పరలోక సందర్భమని పరిసర వాక్యాలు తెలియజేస్తాయి.
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: సింహాసనం మీద కూర్చున్నవాడు
  rationale: గ్రీకు కృదంత బిరుదు యొక్క కొనసాగుతున్న భావాన్ని, బిరుదు స్వరూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: తన గుడారాన్ని వారిమీద విస్తరిస్తాడు
  rationale: σκηνόωలోని గుడారం/నివాస గుడారం భావచిత్రాన్ని, ἐπίలోని ‘వారిమీద’ అనే రక్షణాత్మక సాన్నిధ్య సూచనను నిలుపుతుంది. కేవలం ‘ఆశ్రయమిస్తాడు’ అనడం కంటే మూల రూపకాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: σκηνώσει అనే క్రియలోని దేవుని సాన్నిధ్య భావచిత్రం
  choice: తన గుడారాన్ని వారిమీద విస్తరిస్తాడు
  alternative: వారిమీద నివసిస్తాడు; వారికి ఆశ్రయంగా ఉంటాడు
  rationale: ఈ రూపకం దేవుని రక్షణాత్మక, నిబంధనాత్మక సాన్నిధ్యాన్ని గుడారం అనే భావచిత్రం ద్వారా సూచిస్తుంది. ప్రధాన పాఠంలో రూపకాన్ని నిలిపి, ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో ఇవ్వడం ద్వారా ఏ ఒక్క వ్యాఖ్యానానికీ అనవసరంగా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘సేవ చేస్తున్నారు’ ఆలయ సందర్భంలోని ఆరాధనాత్మక సేవను అతిగా వివరణ జోడించకుండా తెలియజేస్తుంది. [a] గుర్తును అది వివరిస్తున్న గుడారం రూపకం వెంట ఉంచాం.
