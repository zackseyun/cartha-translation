id: REV.7.10
reference: Revelation 7:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κράζουσι φωνῇ μεγάλῃ λέγοντες· Ἡ σωτηρία τῷ θεῷ ἡμῶν τῷ καθημένῳ ἐπὶ τῷ θρόνῳ καὶ τῷ ἀρνίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: te
  text: 'వారు బిగ్గరగా ఇలా కేకలు వేస్తున్నారు: “రక్షణ సింహాసనం మీద కూర్చున్న మన దేవునికి, గొర్రెపిల్లకు చెందుతుంది!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత అక్షరార్థంగా, “రక్షణ సింహాసనం మీద కూర్చున్న మన దేవునికి, గొర్రెపిల్లకు!”
    reason: క్రియలేని గ్రీకు ప్రశంసా ప్రకటనకు ఉన్న అక్షరార్థ ప్రత్యామ్నాయాన్ని చూపించడానికి.
lexical_decisions:
- source_word: κράζουσι
  choice: కేకలు వేస్తున్నారు
  rationale: వర్తమానకాల బహువచన క్రియ దృశ్యంలో కొనసాగుతున్న సజీవ చర్యను తెలియజేస్తుంది. ‘కేకలు వేస్తున్నారు’ అనేది κράζω యొక్క బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: φωνῇ μεγάλῃ
  choice: గొప్ప స్వరంతో
  rationale: ఇది విధానాన్ని తెలిపే దత్తివిభక్తి ప్రయోగం. ‘గొప్ప స్వరంతో’ మూలంలోని స్వర-చిత్రాన్ని, సమూహపు ఘనమైన ప్రకటన భావాన్ని నిలుపుతుంది.
- source_word: λέγοντες
  choice: ఇలా
  rationale: ఈ కృదంతం కేకలోని మాటలను పరిచయం చేస్తుంది. తెలుగులో ప్రధాన క్రియ తరువాత ‘ఇలా’ అని చెప్పడం సహజంగా ఉండి అనవసరమైన ‘చెబుతూ’ పునరుక్తిని నివారిస్తుంది.
- source_word: Ἡ σωτηρία
  choice: రక్షణ … చెందుతుంది
  rationale: గ్రీకులో ఇది క్రియలేని ప్రశంసా ప్రకటన. ‘చెందుతుంది’ దత్తివిభక్తిలోని ఆపాదన భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘విజయం’ అని అనువదించడం అవసరానికి మించిన వ్యాఖ్యానం అవుతుంది.
- source_word: τῷ θεῷ ἡμῶν
  choice: మన దేవునికి
  rationale: దత్తివిభక్తి రక్షణ ఎవరికి ఆపాదించబడుతుందో సూచిస్తుంది. ‘మన దేవునికి’ మూలంలోని సామూహిక అనుబంధాన్ని నిలుపుతుంది.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: సింహాసనం మీద కూర్చున్న
  rationale: ఈ కృదంత పదబంధం ‘మన దేవుడు’ను విశేషిస్తుంది. ఈ రూపం సంక్షిప్తంగా, సహజంగా ఉండి దర్శనంలోని ప్రస్తుత దృశ్యాన్ని నిలుపుతుంది.
- source_word: τῷ ἀρνίῳ
  choice: గొర్రెపిల్లకు
  rationale: ప్రకటన గ్రంథంలో ἀρνίον యేసుకు స్థిరమైన బిరుదు. దాన్ని లిప్యంతరీకరించకుండా ‘గొర్రెపిల్ల’గా అనువదించడం బలి మరియు మెస్సీయ సంబంధిత ప్రతీకను నిలుపుతుంది.
theological_decisions:
- issue: రక్షణకు దేవునితోను గొర్రెపిల్లతోను ఉన్న సంబంధం
  choice: “రక్షణ … మన దేవునికి, గొర్రెపిల్లకు చెందుతుంది” అని ఇద్దరికీ సంయుక్తంగా ఆపాదించే ప్రశంసా ప్రకటనగా అనువదించడం.
  alternative: “రక్షణ మన దేవునికి … గొర్రెపిల్లకు” అని క్రియ లేకుండా మరింత అక్షరార్థంగా అనువదించడం.
  rationale: గ్రీకు దత్తివిభక్తి నిర్మాణం రక్షణను దేవునికీ గొర్రెపిల్లకీ సంయుక్తంగా ఆపాదిస్తుంది; అది ఈ సంబంధాన్ని మరింత సంకుచితమైన సిద్ధాంత వివరణతో నిర్వచించదు. ‘చెందుతుంది’ తెలుగులో అర్థాన్ని సహజంగా వ్యక్తం చేస్తూనే మూలంలోని క్రీస్తు సంబంధిత ఉన్నత స్థానం మరియు ఆరాధనా బలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆరాధనా శైలిని ఉపయోగించాం. ‘కేకలు వేస్తున్నారు’ దృశ్యపు తీవ్రతను, ‘గొర్రెపిల్ల’ ప్రకటన గ్రంథంలోని ప్రతీకాత్మక బిరుదును నిలుపుతాయి. ప్రధాన పాఠంలో [a] గుర్తు సంబంధిత వాక్యాంతంలో ఉంచబడింది.
