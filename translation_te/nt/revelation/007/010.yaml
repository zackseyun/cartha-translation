- from: 'వారు గొప్ప స్వరంతో ఇలా కేకలు వేస్తున్నారు: “రక్షణ సింహాసనం మీద కూర్చున్న మన దేవునికి, గొర్రెపిల్లకు చెందుతుంది!”[a]'
