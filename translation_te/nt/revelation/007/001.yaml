revisions:
- from: దీని తరువాత నేను భూమి యొక్క నాలుగు మూలల దగ్గర నిలబడి ఉన్న నలుగురు దేవదూతలను చూశాను.[a][b] వారు భూమి యొక్క నాలుగు గాలులను ఆపి ఉంచారు; అందువల్ల భూమి మీదగానీ, సముద్రం మీదగానీ, ఏ చెట్టు మీదగానీ గాలి వీయకుండా ఉంది.
  to: దీని తరువాత[a] నేను భూమి నాలుగు మూలల వద్ద[b] నిలబడి, భూమి నాలుగు గాలులను అదుపులో ఉంచుతున్న నలుగురు దేవదూతలను చూశాను. భూమిమీదగానీ, సముద్రమీదగానీ, ఏ చెట్టుమీదగానీ ఏ గాలీ వీయకుండేందుకు వారు వాటిని అదుపులో ఉంచుతున్నారు.
  rationale: 'The revision preserves the ongoing visual action of the Greek participle and expresses the purpose of the angels'' restraint explicitly: no wind is to blow on the earth, sea, or any tree. It retains the source''s conventional cosmic imagery and relocates both footnote markers to their relevant phrases.'
