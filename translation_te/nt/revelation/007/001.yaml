id: REV.7.1
reference: Revelation 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: te
  text: దీని తరువాత[a] నేను భూమి నాలుగు మూలల వద్ద[b] నిలబడి, భూమి నాలుగు గాలులను అదుపులో ఉంచుతున్న నలుగురు దేవదూతలను చూశాను. భూమిమీదగానీ, సముద్రమీదగానీ, ఏ చెట్టుమీదగానీ ఏ గాలీ వీయకుండేందుకు వారు వాటిని అదుపులో ఉంచుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “ఈ సంగతుల తరువాత నేను చూశాను.”'
    reason: lexical_alternative
  - marker: b
    text: “భూమి నాలుగు మూలలు” అనేది భూమి అంచులను లేదా నాలుగు దిక్కులను సూచించే సంప్రదాయ వ్యక్తీకరణ.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: దీని తరువాత
  rationale: దర్శనంలోని కాలక్రమాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం; మరింత పదానుసారమైన ‘ఈ సంగతుల తరువాత’ అనే రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: εἶδον
  choice: నేను ... చూశాను
  rationale: దర్శనంలో యోహాను గ్రహించిన దృశ్యాన్ని నేరుగా తెలియజేస్తుంది; మూలంలో లేని ‘చూచి ఇదిగో’ వంటి విస్తరణ అవసరం లేదు.
- source_word: τέσσαρας ἀγγέλους ἑστῶτας
  choice: నిలబడి ఉన్న నలుగురు దేవదూతలను
  rationale: ἑστῶτας సూచించే నిలిచియున్న స్థితిని కాపాడుతుంది; ‘నియమించబడిన’ అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: భూమి యొక్క నాలుగు మూలల దగ్గర
  rationale: ప్రళయదర్శనంలోని సంప్రదాయ రూపకాన్ని యథాతథంగా కాపాడుతూ, ἐπίకి సందర్భానుగుణమైన సహజ తెలుగు ‘దగ్గర’ను వాడింది.
- source_word: κρατοῦντας
  choice: ఆపి ఉంచారు
  rationale: తరువాతి ఉద్దేశ్య వాక్యం గాలులు వీయకుండా నిరోధించడాన్ని స్పష్టం చేస్తుంది; అందువల్ల κρατέωలోని అదుపుచేసే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: భూమి యొక్క నాలుగు గాలులను
  rationale: నాలుగు దిక్కుల నుంచి వచ్చే గాలులను సూచించే దర్శనాత్మక వ్యక్తీకరణను నిలుపుతుంది.
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: గాలి వీయకుండా
  rationale: ἵνα + subjunctive తెలిపే ఉద్దేశ్యం లేదా ఫలిత సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ఏ గాలీ వీయకపోవడం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: భూమి మీదగానీ, సముద్రం మీదగానీ, ఏ చెట్టు మీదగానీ
  rationale: μήτε...μήτε అనే సమన్విత నిరాకరణను తెలుగు ‘గానీ’ నిర్మాణంతో స్పష్టంగా, సహజంగా అందిస్తుంది; πᾶν δένδρονకు ‘ఏ చెట్టు’ పంపిణీ భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: ప్రళయదర్శనంలో γῆ యొక్క పరిధి
  choice: వచనమంతటా ‘భూమి’గా అనువదించాం.
  alternative: నేల / దేశం
  rationale: నాలుగు మూలలు, నాలుగు గాలులు, భూమి, సముద్రం, ప్రతి చెట్టు అనే విస్తృత దృశ్యం విశ్వవ్యాప్త పరిధిని సూచిస్తుంది; ‘దేశం’ అని అనడం దృశ్యాన్ని అనవసరంగా కుదిస్తుంది.
- issue: ‘భూమి యొక్క నాలుగు మూలలు’ అనే విశ్వవర్ణన
  choice: మూలంలోని రూపకాన్ని నేరుగా నిలిపాం.
  alternative: భూమి నాలుగు దిక్కుల చివరలు
  rationale: ఇది సంప్రదాయ దర్శనాత్మక భాష. వివరణాత్మక పరామర్శగా మార్చకుండా మూలరూపాన్ని ఉంచడం దాని చిత్రాత్మక శక్తిని, నిజమైన భావవ్యాప్తిని కాపాడుతుంది.
- issue: ἵνα నిర్మాణంలో ఉద్దేశ్యం మరియు ఫలితం మధ్య సంబంధం
  choice: ‘అందువల్ల ... వీయకుండా ఉంది’ అని సందర్భానుగుణంగా వ్యక్తం చేశాం.
  alternative: ‘వీయకూడదని’ / ‘వీయకుండా ఉండేందుకు’
  rationale: గ్రీకు నిర్మాణం ఉద్దేశ్యాన్ని లేదా ఉద్దేశ్యంతో కలిసిన ఫలితాన్ని మోయగలదు. దేవదూతల నిరోధ చర్యకు వచ్చిన ఫలితాన్ని తెలుగు సహజంగా చెబుతూ, దాని వెనుక ఉద్దేశ్యాన్ని కూడా సందర్భంలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. దర్శనాత్మక రూపకాలను వివరణాత్మకంగా చదును చేయకుండా నిలిపాం. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో [a], [b]గా ఉన్నాయి.
