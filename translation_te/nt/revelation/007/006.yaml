id: REV.7.6
reference: Revelation 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ἀσὴρ δώδεκα χιλιάδες, ἐκ φυλῆς Νεφθαλὶμ δώδεκα χιλιάδες, ἐκ φυλῆς Μανασσῆ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/006.yaml
  text: from the tribe of Asher[a], twelve thousand; from the tribe of Naphtali, twelve thousand; from the tribe of Manasseh, twelve thousand;
translation:
  language: te
  text: ఆశేరు గోత్రం నుండి పన్నెండు వేలమంది[a]; నఫ్తాలి గోత్రం నుండి పన్నెండు వేలమంది; మనష్షే గోత్రం నుండి పన్నెండు వేలమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భాన్ని మరింత స్పష్టంగా చెప్పాలంటే, “ఆశేరు గోత్రం నుండి పన్నెండు వేలమంది ముద్రించబడ్డారు” అని అర్థం; తరువాత పేర్కొన్న గోత్రాల విషయంలోనూ ఇదే వర్తిస్తుంది. అయితే ఈ వచనంలోని గ్రీకు పాఠ్యం ఆ క్రియను మళ్లీ పేర్కొనదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: నుండి
  rationale: ఈ జాబితాలో ἐκ ఆయా గోత్రాల నుండి వచ్చినవారిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నుండి’ సహజమైన, ఖచ్చితమైన సమానార్థకం.
- source_word: φυλῆς
  choice: గోత్రం
  rationale: ఇశ్రాయేలు వంశ విభాగాన్ని సూచించే φυλήకు తెలుగు బైబిలు సందర్భంలో ‘గోత్రం’ స్పష్టమైన, స్థిరపడిన పదం.
- source_word: Ἀσὴρ
  choice: ఆషేరు
  rationale: మూల గ్రీకు రూపానికి అనుగుణంగా, తెలుగులో సులభంగా పలికే విధంగా గోత్రనామాన్ని లిప్యంతరీకరించాం.
- source_word: δώδεκα χιλιάδες
  choice: పన్నెండు వేలమంది
  rationale: సంఖ్య మనుషుల గణనను సూచిస్తున్నందున తెలుగులో సహజంగా ఉండేందుకు ‘మంది’ చేర్చాం; ‘ముద్రించబడ్డారు’ అనే క్రియను మాత్రం చేర్చలేదు.
- source_word: Νεφθαλὶμ
  choice: నఫ్తాలి
  rationale: సెమిటిక్ గోత్రనామానికి తెలుగులో సుపరిచితమైన రూపాన్ని వాడాం; గ్రీకు పదాంతంలోని -μ పేరుకు చెందిన ప్రాచీన రూపాంతరాన్ని ప్రతిబింబిస్తుంది.
- source_word: Μανασσῆ
  choice: మనష్షే
  rationale: మూలపేరుకు దగ్గరగా ఉండే, తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
theological_decisions:
- issue: సందర్భం నుండి ‘ముద్రించబడ్డారు’ అనే అంతర్లీన క్రియను చేర్చాలా?
  choice: ప్రధాన పాఠ్యంలో క్రియను చేర్చకుండా, గ్రీకులోని సంక్షిప్త జాబితా రూపాన్ని నిలిపాం.
  alternative: ఆషేరు గోత్రం నుండి పన్నెండు వేలమంది ముద్రించబడ్డారు; అలాగే తరువాతి గోత్రాల నుండి కూడా.
  rationale: ముందటి సందర్భంలో ముద్ర వేయబడడం పాలక భావంగా ఉన్నప్పటికీ, ఈ వచనంలోని గ్రీకు పాఠ్యంలో క్రియ పునరుక్తం కాలేదు. మూలంలోని సంక్షిప్తతను, అంతర్లీన భావాన్ని రెండింటినీ కాపాడేందుకు ప్రధాన పాఠ్యంలో క్రియను చేర్చకుండా వివరణను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన జాబితా శైలిని వాడాం. ప్రతి సంఖ్యకు ‘మంది’ చేర్చి మనుషుల లెక్క అని సహజంగా తెలియజేశాం; గ్రీకులో లేని క్రియను ప్రధాన పాఠ్యంలో చేర్చలేదు.
