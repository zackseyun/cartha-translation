source:
  edition: SBLGNT
  text: οὐ πεινάσουσιν ἔτι ⸀οὐδὲ διψήσουσιν ἔτι, οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος οὐδὲ πᾶν καῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: te
  text: వారు ఇక ఆకలిగొనరు, ఇక దాహంగొనరు; సూర్యుడు వారిని ఎన్నటికీ దహించడు, ఎలాంటి మండే వేడీ వారిని తాకదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινάσουσιν
  choice: ఆకలిగొనరు
  rationale: భవిష్యత్ క్రియను తెలుగులో సహజమైన క్రియారూపంతో వ్యక్తం చేస్తూ, తరువాతి ‘దాహంగొనరు’తో సమాంతరతను నిలుపుతుంది.
- source_word: ἔτι
  choice: ఇక
  rationale: నిషేధంతో కలిసి, ఇకపై ఆ స్థితి ఉండదనే ముగింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: διψήσουσιν
  choice: దాహంగొనరు
  rationale: గ్రీకు భవిష్యత్ క్రియారూపాన్ని కాపాడి, ఆకలి–దాహం జంటలోని వాక్య సమాంతరతను నిలుపుతుంది.
- source_word: οὐδὲ
  choice: ఇక ... కాదు / ఏదీ ... కాదు
  rationale: వరుసగా వచ్చే ప్రతికూల వాక్యాలను తెలుగులో సహజంగా సమన్వయపరుస్తుంది.
- source_word: οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος
  choice: ఎండ వారిమీద ఎంతమాత్రమూ పడదు
  rationale: οὐδὲ μή అనే బలమైన భవిష్యత్ నిషేధాన్ని ‘ఎంతమాత్రమూ ... పడదు’తో చూపిస్తుంది; πέσῃ యొక్క ‘పడు’ రూపకాన్ని, సూర్యుని ప్రభావానికి సహజమైన తెలుగు ‘ఎండ’ను కలిపి అందిస్తుంది.
- source_word: πᾶν καῦμα
  choice: మండించే వేడి ఏదీ
  rationale: καῦμαలోని దహింపజేసే తీవ్రమైన వేడి భావాన్ని, πᾶν యొక్క సంపూర్ణ పరిధిని ‘ఏదీ’ ద్వారా ప్రతికూల సందర్భంలో తెలియజేస్తుంది.
theological_decisions:
- issue: యెషయా 49:10కు సూచన మరియు అంత్యకాల పునరుద్ధరణ భాష
  choice: ఆకలి, దాహం, ఎండ, మండించే వేడి అనే స్పష్టమైన దృశ్యరూపాలను యథాతథంగా నిలుపడం
  alternative: ఆకలి, దాహాన్ని ప్రధానంగా ఆత్మీయ కోరికకు రూపకాలుగా అనువదించడం
  rationale: ప్రకటన సందర్భం ఆదరణను అందించే అపోకలిప్టిక్ దృశ్యం; యెషయా పునరుద్ధరణ వాగ్దానపు ప్రతిధ్వనిని అనువాదం నిలుపుతుంది, కానీ వచనం నిర్బంధించని ప్రత్యేక రూపకాల వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాగ్దానానికి తగిన గంభీరతతో రూపొందించబడింది. గ్రీకులోని బలమైన నిషేధాన్ని ‘ఎంతమాత్రమూ’ ద్వారా వ్యక్తం చేశాం. ఈ వచనంలో పాదటిప్పణి అవసరం లేదు.
