id: REV.7.5
reference: Revelation 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ἰούδα δώδεκα χιλιάδες ⸀ἐσφραγισμένοι, ἐκ φυλῆς Ῥουβὴν δώδεκα χιλιάδες, ἐκ φυλῆς Γὰδ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: te
  text: యూదా గోత్రం నుండి పన్నెండు వేలమంది ముద్ర వేయబడ్డారు[a]; రూబేను గోత్రం నుండి పన్నెండు వేలమంది; గాదు గోత్రం నుండి పన్నెండు వేలమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “యూదా గోత్రం నుండి పన్నెండు వేలమంది, ముద్ర వేయబడినవారు.” గ్రీకులో మొదటి గోత్రపు సంఖ్య తరువాత “ముద్ర వేయబడినవారు” అనే నిష్క్రియ భూతకృదంతం ఉంది.
    reason: వ్యాకరణపరమైన ప్రత్యామ్నాయ అనువాదం
lexical_decisions:
- source_word: ἐκ
  choice: నుండి
  rationale: మూలం లేదా సమూహం నుంచి ఎంపికను సూచించే ప్రామాణిక అర్థం; పునరావృత గోత్రాల జాబితాలో సహజంగా ఉంది.
- source_word: φυλῆς
  choice: గోత్రం
  rationale: ఇశ్రాయేలు వంశ విభాగాల సందర్భంలో స్థిరపడిన, ఖచ్చితమైన తెలుగు పదం.
- source_word: Ἰούδα
  choice: యూదా
  rationale: ఈ గోత్రనామానికి తెలుగు బైబిలు వాడుకలో స్థిరమైన రూపం.
- source_word: δώδεκα χιλιάδες
  choice: పన్నెండు వేలమంది
  rationale: సంఖ్యను నేరుగా అనువదిస్తూ, లెక్కించబడుతున్నది మనుషులనే విషయాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐσφραγισμένοι
  choice: ముద్ర వేయబడినవారు
  rationale: గ్రీకు నిష్క్రియ భూతకృదంత రూపాన్ని నామవాచకసదృశంగా నిలుపుతూ, మొదటి గోత్రానికి చెందిన లెక్కింపబడినవారిని వర్ణిస్తుంది.
- source_word: Ῥουβὴν
  choice: రూబేను
  rationale: ఈ గోత్రనామానికి స్థిరమైన తెలుగు లిప్యంతరీకరణ.
- source_word: Γὰδ
  choice: గాదు
  rationale: ఈ గోత్రనామానికి స్థిరమైన తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: గోత్రాల లెక్కింపులో ἐσφραγισμένοι పదం యొక్క బలం, పరిధి
  choice: మొదటి వాక్యభాగంలో ‘ముద్ర వేయబడినవారు’ అని భూతకృదంత రూపంలో అనువదించి, తరువాతి సమాంతర భాగాల్లో దానిని పునరుక్తి చేయలేదు.
  alternative: ‘ముద్ర వేయబడ్డారు’ అని స్పష్టమైన సమాపక క్రియగా అనువదించడం; లేదా ప్రతి గోత్రం తరువాత దానిని పునరావృతం చేయడం.
  rationale: గ్రీకులో ఈ నిష్క్రియ భూతకృదంతం మొదటి సంఖ్య తరువాత మాత్రమే కనిపిస్తుంది; అయినా జాబితా మొత్తానికి వర్తిస్తుందని సందర్భం సూచిస్తుంది. తెలుగు అనువాదం దాని వ్యాకరణ రూపాన్నీ తరువాతి భాగాల్లోని అధ్యాహారాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే జాబితా శైలి. మూలంలోని పునరావృత నిర్మాణం, మొదటి భాగంలోని భూతకృదంతం, తరువాతి భాగాల్లోని అధ్యాహారం కాపాడబడ్డాయి.
