id: REV.7.11
reference: Revelation 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: te
  text: దూతలందరూ సింహాసనాన్ని, పెద్దలను, నాలుగు జీవులను[a] చుట్టుకొని నిలబడి ఉన్నారు. వారు సింహాసనం ఎదుట తమ ముఖాలు నేలకు ఆనించి పడిపోయి, దేవుణ్ణి ఆరాధించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాలుగు సజీవ ప్రాణులను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: దూతలందరూ
  rationale: πάντες అనే సమగ్ర భావాన్నీ, ἄγγελοι అనే ప్రామాణిక అర్థాన్నీ సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: εἱστήκεισαν
  choice: నిలబడి ఉన్నారు
  rationale: ఈ రూపంలోని స్థితి/కొనసాగుతున్న భంగిమను సాధారణ భూతకాల క్రియకన్నా స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων
  choice: సింహాసనాన్ని, పెద్దలను, నాలుగు జీవులను చుట్టుకొని
  rationale: κύκλῳ యొక్క ప్రదేశార్థాన్ని, దాని పరిధిలో ఉన్న మూడు సమన్విత పదబంధాలనూ తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; దూతలు వారందరి చుట్టూ ఉన్నారనే దృశ్యాన్ని నిలుపుతుంది.
- source_word: τοῦ θρόνου
  choice: సింహాసనం
  rationale: ప్రకటన గ్రంథంలోని రాజాధికార, పరలోక సభా దృశ్యాన్ని కాపాడే స్థిరమైన సమానార్థకం.
- source_word: τῶν πρεσβυτέρων
  choice: పెద్దలు
  rationale: ఈ పరలోక సమూహానికి తెలుగులో సహజంగా, సంప్రదాయబద్ధంగా వాడే పదం.
- source_word: τῶν τεσσάρων ζῴων
  choice: నాలుగు జీవులు
  rationale: ζῷα ను సాధారణ జంతువులుగా తగ్గించకుండా, జీవముగల సింహాసన మందిరపు ప్రాణులుగా సూచించే సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: సింహాసనం ఎదుట తమ ముఖాలను నేలకు ఆనించి పడి
  rationale: పడిపోవడమూ, ముఖాలపై సాగిలపడడమూ అనే రెండు అంశాలను స్పష్టంగా ఉంచుతుంది; ‘నేలకు’ అనేది తెలుగు సహజ వ్యక్తీకరణ కోసం సందర్భానుసారంగా వ్యక్తీకరించబడింది.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: దేవుణ్ణి ఆరాధించారు
  rationale: ఇక్కడ కర్మ దేవుడే కావడం, శారీరక సాగిలపడడం ముందే పేర్కొనబడడం వల్ల προσκυνέω యొక్క భక్తిపూర్వక ఆరాధన భావాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: ζῷα అనే సింహాసన మందిరపు పరలోక ప్రాణుల గుర్తింపు
  choice: జీవులు
  alternative: సజీవ ప్రాణులు; జీవరాశులు
  rationale: మూలపదంలోని జీవముగల ప్రాణులు అనే విస్తృత భావాన్ని ఉంచుతూ, వాటిని జంతువులుగా గానీ మరే నిర్దిష్ట దేవదూతల వర్గంగా గానీ వ్యాఖ్యానించదు.
- issue: దేవునికి ఉద్దేశించిన προσκυνέω యొక్క భావం
  choice: దేవుణ్ణి ఆరాధించారు
  alternative: దేవుని ఎదుట సాగిలపడ్డారు
  rationale: శారీరకంగా ముఖాలపై పడడం ముందటి వాక్యభాగంలో ఇప్పటికే స్పష్టంగా ఉంది; అందువల్ల ఇక్కడ దేవునికి చెల్లించిన ఆరాధన భావం ప్రధానంగా వ్యక్తమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. మొదటి గ్రీకు వాక్యంలోని దీర్ఘ సమన్వయ నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినప్పటికీ, సంఘటనల క్రమం మరియు దృశ్య సంబంధం యథాతథంగా ఉంచబడ్డాయి.
