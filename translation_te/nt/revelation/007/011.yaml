review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys all the angels, their standing posture, the throne-room group, prostration before the throne, and worship of God. However, the wording for falling 'with their faces to the ground' is slightly redundant and less idiomatic than necessary in Telugu.
  naturalness: The first sentence is clear and modern. In the second, 'తమ ముఖాలను నేలకు ఆనించి పడి' combines two closely overlapping physical descriptions in a somewhat awkward way. 'తమ ముఖాలు నేలకు ఆనించి పడిపోయారు' is more natural while preserving the source image.
  terminology: ‘దూతలు,’ ‘సింహాసనం,’ ‘పెద్దలు,’ ‘జీవులు,’ and ‘దేవుణ్ణి ఆరాధించారు’ are suitable, consistent, and appropriately non-interpretive. The footnote provides a legitimate lexical alternative for ζῷα.
  issues:
  - severity: low
    issue: The prostration clause is mildly redundant/awkward.
    rationale: ‘ముఖాలను నేలకు ఆనించి పడి’ expresses both putting faces to the ground and falling in a compressed, less natural construction. The Greek says they fell before the throne upon their faces; recasting the Telugu verb phrase retains both elements more idiomatically.
  revised_text: దూతలందరూ సింహాసనాన్ని, పెద్దలను, నాలుగు జీవులను[a] చుట్టుకొని నిలబడి ఉన్నారు. వారు సింహాసనం ఎదుట తమ ముఖాలు నేలకు ఆనించి పడిపోయి, దేవుణ్ణి ఆరాధించారు.
