revisions:
- from: 'అప్పుడు సూర్యోదయ దిక్కు నుండి[a] పైకి వస్తున్న మరొక దేవదూతను నేను చూశాను. అతని దగ్గర సజీవుడైన దేవుని ముద్ర ఉంది. భూమికి, సముద్రానికి హాని చేయడం ఎవరికి అప్పగించబడిందో ఆ నలుగురు దేవదూతలకు అతడు గొప్ప స్వరంతో ఇలా కేక వేశాడు:'
  to: 'నేను సూర్యుడు ఉదయించే దిక్కు నుండి[a] పైకి వస్తున్న మరొక దేవదూతను చూశాను. అతడు సజీవుడైన దేవుని ముద్రను కలిగి, భూమికీ సముద్రానికీ హాని చేయడానికి ఇవ్వబడిన ఆ నలుగురు దేవదూతలకు బిగ్గర స్వరంతో కేక వేశాడు:'
  rationale: The revision replaces an ambiguous Telugu expression for loudness, uses a more suitable formal construction for the angel’s possession of the seal, and retains the source’s ambiguity concerning what was given to the four angels. The final colon is retained because the direct speech continues in the following verse.
