id: REV.7.2
reference: Revelation 7:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: te
  text: 'నేను సూర్యుడు ఉదయించే దిక్కు నుండి[a] పైకి వస్తున్న మరొక దేవదూతను చూశాను. అతడు సజీవుడైన దేవుని ముద్రను కలిగి, భూమికీ సముద్రానికీ హాని చేయడానికి ఇవ్వబడిన ఆ నలుగురు దేవదూతలకు బిగ్గర స్వరంతో కేక వేశాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సూర్యుని ఉదయం నుండి”; అంటే తూర్పు దిక్కు నుండి.
    reason: మూల గ్రీకు పదబంధంలోని సూర్యోదయ దృశ్యాన్ని, దాని దిశార్థమైన ‘తూర్పు’ను రెండింటినీ స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: మరొక దేవదూతను
  rationale: ముందు పేర్కొన్న నలుగురు దేవదూతలకు భిన్నమైన అదనపు దేవదూతను సూచిస్తుంది.
- source_word: ἀναβαίνοντα
  choice: పైకి వస్తున్న
  rationale: పైదిశలో కదలికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దర్శనాన్ని చూస్తున్న వాని దృష్టికోణాన్నీ నిలుపుతుంది.
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: సూర్యోదయ దిక్కు నుండి
  rationale: గ్రీకు పదబంధంలోని సూర్యోదయ చిత్రాన్ని నిలుపుతూ తూర్పు దిశ అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἔχοντα σφραγῖδα
  choice: అతని దగ్గర ... ముద్ర ఉంది
  rationale: ἔχω యొక్క సాధారణ స్వాధీన భావాన్ని వ్యక్తం చేస్తుంది; దేవదూత దానిని చేతిలో పట్టుకున్నాడని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: θεοῦ ζῶντος
  choice: సజీవుడైన దేవుని
  rationale: దేవుడు జీవించేవాడని తెలిపే attributive భావాన్ని గంభీరమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: గొప్ప స్వరంతో ... కేక వేశాడు
  rationale: క్రియలోని తీవ్రతను, φωνῇ μεγάλῃలోని బలమైన స్వర భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: οἷς ἐδόθη αὐτοῖς
  choice: ఎవరికి అప్పగించబడిందో
  rationale: మూలంలోని దైవకర్మణి నిర్మాణాన్ని నిలుపుతూ, ఇవ్వబడినది 'అధికారం' అని పాఠ్యంలో లేని నామవాచకాన్ని చేర్చదు.
- source_word: ἀδικῆσαι
  choice: హాని చేయడం
  rationale: ఈ సందర్భంలో సృష్టికి నష్టం కలిగించడం అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: భూమికి, సముద్రానికి
  rationale: ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త తీర్పు దృశ్యానికి సరిపోయేలా γῆను 'భూమి'గా అనువదిస్తుంది.
theological_decisions:
- issue: ἐδόθηలో అప్పగించబడిన అనుమతి లేదా అధికారం
  choice: ఎవరికి అప్పగించబడిందో
  alternative: ఎవరికి అధికారం ఇవ్వబడిందో; ఎవరికి అనుమతి ఇవ్వబడిందో
  rationale: కర్తను పేర్కొనని గ్రీకు దైవకర్మణిని, అలాగే ఇవ్వబడిన దాని స్వరూపంపై ఉన్న సంక్షిప్తతను నిలుపుతుంది; 'అధికారం' లేదా 'అనుమతి' అని అనవసరంగా నిర్ణయించదు.
- issue: ἀπὸ ἀνατολῆς ἡλίουలోని దిశ మరియు దృశ్యరూపం
  choice: సూర్యోదయ దిక్కు నుండి
  alternative: తూర్పు నుండి; సూర్యుడు ఉదయించే చోటు నుండి
  rationale: తూర్పు అనే దిశార్థాన్ని స్పష్టంగా చేస్తూనే మూలంలోని సూర్యోదయ చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- issue: θεοῦ ζῶντος అనే దైవ విశేషణం
  choice: సజీవుడైన దేవుని
  alternative: జీవముగల దేవుని; జీవించే దేవుని
  rationale: దేవుని జీవత్వాన్ని వ్యక్తం చేస్తుంది; కేవలం జీవాన్ని కలిగినవాడు అన్న బలహీన భావానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వాక్యం తదుపరి వచనంలోని ప్రత్యక్ష వాక్యానికి దారితీస్తున్నందున చివర ద్విబిందువు ఉంచబడింది. 'సజీవుడైన దేవుడు', 'దేవదూత', 'ముద్ర' వంటి బైబిలు పరంగా పరిచితమైన పదాలను సహజ రూపంలో వాడాం.
