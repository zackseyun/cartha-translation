id: REV.7.12
reference: Revelation 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “ఆమేన్! స్తుతి, మహిమ, జ్ఞానం, కృతజ్ఞత, ఘనత, శక్తి, బలం యుగయుగాల వరకు మన దేవునికి కలుగుగాక![a] ఆమేన్.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “యుగాల యుగాల వరకు మన దేవునికి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: వారు ఇలా అన్నారు
  rationale: వర్తమాన కర్తరి కృదంతం బహువచనంలో ఉండి స్తుతివాక్యాన్ని పరిచయం చేస్తుంది. తెలుగు కథనశైలిలో ‘వారు ఇలా అన్నారు’ సహజంగా ఉండి సమూహ ఉచ్చారణను స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἀμήν / ἀμήν
  choice: ఆమేన్
  rationale: ఆరాధనా, స్తోత్ర సందర్భంలో అనువదించకుండా సంప్రదాయబద్ధంగా లిప్యంతరీకరించడం సముచితం; పునరుక్తి స్తుతివాక్యానికి ఆరంభం, ముగింపు ఇస్తుంది.
- source_word: ἡ εὐλογία
  choice: స్తుతి
  rationale: εὐλογίαకు ‘ఆశీర్వాదం’ అనే అర్థం ఉన్నా, దేవునికి అర్పించే స్తోత్ర సందర్భంలో ‘స్తుతి’ సహజంగా ascriptive forceను వ్యక్తం చేస్తుంది.
- source_word: ἡ δόξα
  choice: మహిమ
  rationale: దైవస్తుతి సందర్భంలో δόξαకు ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: ἡ σοφία
  choice: జ్ఞానం
  rationale: σοφία సూచించే wisdomను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ εὐχαριστία
  choice: కృతజ్ఞతాస్తుతి
  rationale: కేవలం భావస్థితి అయిన ‘కృతజ్ఞత’ కంటే దేవునికి అర్పించే thanksgiving అనే ఆరాధనా కార్యాన్ని ఈ పదం స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡ τιμή
  choice: ఘనత
  rationale: ఇక్కడ ఆర్థిక విలువ కాక దేవునికి అర్పించే గౌరవం ఉద్దేశం; ‘ఘనత’ స్తుతి జాబితి యొక్క గంభీర శైలికి సరిపోతుంది.
- source_word: ἡ δύναμις
  choice: శక్తి
  rationale: సామర్థ్యం లేదా powerకు సహజమైన తెలుగు సమానార్థకం.
- source_word: ἡ ἰσχύς
  choice: బలం
  rationale: δύναμιςతో అర్థసామీప్యం ఉన్నప్పటికీ వేరే పదంతో ‘శక్తి, బలం’గా ఇవ్వడం మూలంలోని రెండు పదాల అలంకారపూర్వక సమృద్ధిని నిలుపుతుంది.
- source_word: τῷ θεῷ ἡμῶν
  choice: మన దేవునికి కలుగుగాక
  rationale: గ్రీకులో క్రియ లేని సంప్రదాన విభక్తి స్తుతి-అర్పణను సూచిస్తుంది. తెలుగులో ‘కలుగుగాక’ను పూరించడం ఆశీర్వచనాత్మక, ఆరాధనాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాల వరకు
  rationale: అంతం లేని కాలవ్యాప్తిని తెలిపే గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానార్థకం; పదశః రూపాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: క్రియలేని స్తుతివాక్యంలో అంతర్లీన క్రియను పూరించడం
  choice: మన దేవునికి కలుగుగాక
  alternative: మన దేవునికి చెందును
  rationale: మూలంలో స్పష్టమైన క్రియ లేదు. ‘కలుగుగాక’ స్తుతిని దేవునికి అర్పించే భావాన్ని నిలుపుతుంది; ‘చెందును’ అని ఇస్తే స్వామ్యభావాన్ని మరింత బలంగా నిర్ణయించే ప్రమాదం ఉంది.
- issue: δύναμις మరియు ἰσχύς మధ్య భేదాన్ని నిలుపడం
  choice: శక్తి ... బలం
  alternative: శక్తి ... మహాబలం
  rationale: మూలం దగ్గర అర్థాలున్న రెండు పదాలను వరుసగా ఉపయోగిస్తుంది. వేర్వేరు తెలుగు పదాలు ఆ వాక్యపు స్తోత్రపూర్ణతను నిలుపుతాయి; రెండవ పదానికి మూలంలో లేని తీవ్రతను జోడించలేదు.
- issue: εὐλογία యొక్క దిశ మరియు భావం
  choice: స్తుతి
  alternative: ఆశీర్వాదం
  rationale: దేవునికి ఉద్దేశించిన సప్తపద స్తుతిలో ‘స్తుతి’ సహజంగా ఉంటుంది. అయినా εὐλογίαలోని blessing భావసాధ్యతను పూర్తిగా నిరాకరించడం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనకు తగిన గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. గ్రీకు సప్తపద జాబితి నిలుపబడింది; ప్రతి నామవాచకానికి తెలుగు వ్యాకరణంలో అనవసరమైన నిర్దిష్ట ఉపపదాలు చేర్చలేదు. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
