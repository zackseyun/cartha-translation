id: REV.7.9
reference: Revelation 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: te
  text: ఆ తరువాత నేను చూశాను; ఇదిగో, ఎవరూ లెక్కించలేని గొప్ప జనసమూహం—ప్రతి జాతి నుంచీ, గోత్రాల నుంచీ, ప్రజల నుంచీ, భాషల నుంచీ చెందినవారైన వారు—తెల్లని వస్త్రాలు ధరించి, తమ చేతుల్లో తాటి కొమ్మలు పట్టుకొని, సింహాసనం ఎదుటా గొర్రెపిల్ల ఎదుటా నిలబడి ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత సరళంగా: “ప్రతి జాతి, గోత్రం, ప్రజ, భాష నుంచి చెందినవారు.” ప్రధాన పాఠం గ్రీకులో ‘జాతి’ ఏకవచనంలో ఉండి, ‘గోత్రాలు, ప్రజలు, భాషలు’ బహువచనంలో ఉండే మార్పును నిలుపుతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ఆ తరువాత
  rationale: దర్శనాల వరుసను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు బహువచన ప్రయోగాన్ని తెలుగులో అసహజంగా అనుకరించదు.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: నేను చూశాను. ఇదిగో
  rationale: εἶδον యొక్క సాధారణ దృశ్యార్థాన్ని, ἰδού యొక్క దృష్టిని ఆకర్షించే బలాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: ὄχλος πολύς
  choice: గొప్ప జనసమూహం
  rationale: అసంఖ్యాకంగా కూడిన ప్రజలను గౌరవప్రదమైన ప్రకటన గ్రంథ శైలిలో వ్యక్తం చేస్తుంది.
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: ఎవరూ లెక్కించలేనంత
  rationale: ఎవరూ లెక్కించగల సామర్థ్యం లేకపోవడాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: ప్రతి జాతి నుంచీ, గోత్రాల నుంచీ, ప్రజల నుంచీ, భాషల నుంచీ
  rationale: ἔθνους ఏకవచనంతో, తరువాతి మూడు నామవాచకాలు బహువచనంలో ఉన్న గ్రీకు రూపభేదాన్ని సాధ్యమైనంత స్పష్టంగా నిలుపుతుంది.
- source_word: ἑστῶτες
  choice: నిలబడి ఉన్నారు
  rationale: జనసమూహంలోని వ్యక్తులను భావానుసార బహువచనంతో సహజంగా సూచిస్తుంది; గ్రీకులోనూ భావానుసార బహువచన సమన్వయం ఉంది.
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: సింహాసనం ఎదుటా గొర్రెపిల్ల ఎదుటా
  rationale: ἐνώπιον పునరుక్తిని నిలిపి, దృశ్యంలోని గంభీర లయను కాపాడుతుంది.
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: తెల్లని పొడవాటి వస్త్రాలు ధరించి
  rationale: στολή సాధారణ వస్త్రం కంటే పొడవైన అంగీ లేదా వస్త్రాన్ని సూచించగలదని తెలియజేస్తూ, తెలుగులో సులభంగా అర్థమయ్యే మాటలను ఉపయోగిస్తుంది.
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: చేతుల్లో ఖర్జూరపు మట్టలు పట్టుకొని
  rationale: ఇక్కడ φοίνικες ఖర్జూర చెట్ల కొమ్మలు లేదా మట్టలను సూచిస్తుంది; చేతుల్లో ఉండటాన్ని సహజమైన తెలుగు దృశ్యవర్ణనగా అందిస్తుంది.
theological_decisions:
- issue: క్రీస్తును సూచించే ἀρνίον బిరుదు
  choice: గొర్రెపిల్ల
  alternative: చిన్న గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలో ఇది స్థిరమైన క్రీస్తు బిరుదుగా పనిచేస్తుంది. రూపంలోని అల్పార్థాన్ని అతిగా చూపకుండా, గుర్తించదగిన బిరుదును నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పొడవైన గ్రీకు వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం మూడు వాక్యాలుగా విభజించాం; ఆశ్చర్యసూచక చిహ్నం ἰδού యొక్క దృష్ట్యాకర్షణ బలాన్ని తోడ్పడుతుంది. జనసమూహాన్ని సూచించే క్రియలు భావానుసారంగా బహువచనంలో ఉన్నాయి.
