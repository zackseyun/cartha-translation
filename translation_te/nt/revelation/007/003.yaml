id: REV.7.3
reference: Revelation 7:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the servants of our God on their foreheads.”
translation:
  language: te
  text: 'అతడు ఇలా చెప్పాడు: “మన దేవుని బానిసల[a] నుదుటుల మీద మేము ముద్ర వేసేంతవరకు భూమికిగానీ, సముద్రానికిగానీ, చెట్లకుగానీ హాని చేయకండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాసులు,” “సేవకులు.” గ్రీకు పదమైన δούλους (డౌలూస్) యజమానికి చెందినవారిని సూచించగలదు; ఇక్కడ “బానిసలు” అనే అనువాదం ఆ బలమైన భావాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικήσητε
  choice: హాని చేయకండి
  rationale: భూమి, సముద్రం, చెట్లు కర్మలుగా ఉన్న ఈ సందర్భంలో ఇది నైతిక అన్యాయం కంటే భౌతిక నష్టం కలిగించడాన్ని సూచిస్తుంది.
- source_word: γῆν
  choice: భూమి
  rationale: భూమి, సముద్రం, చెట్లు అనే విశ్వవ్యాప్త తీర్పు దృశ్యంలో ‘భూమి’ సహజంగా సరిపోతుంది.
- source_word: θάλασσαν
  choice: సముద్రం
  rationale: మూలపదానికి నేరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: δένδρα
  choice: చెట్లు
  rationale: బహువచన రూపాన్ని సరళంగా, సహజంగా నిలుపుతుంది.
- source_word: ἄχρι
  choice: వేసేంతవరకు
  rationale: హాని చేయకూడదనే ఆజ్ఞకు ముద్ర వేయడం పూర్తయ్యే సమయం వరకు ఉన్న పరిమితిని తెలియజేస్తుంది.
- source_word: σφραγίσωμεν
  choice: మేము ముద్ర వేసే
  rationale: దేవునికి చెందినవారిని గుర్తించే ముద్రను వారి నుదుటుల మీద వేయడమనే సంఘటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δούλους
  choice: బానిసలు
  rationale: δοῦλοςలోని యజమానికి చెందినవారనే బలమైన భావాన్ని ఈ సందర్భంలో ‘బానిసలు’ నిలుపుతుంది; మృదువైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: మన దేవుని
  rationale: దేవునికి చెందినవారనే షష్ఠీ సంబంధాన్నీ, వక్త ఉపయోగించిన ‘మన’ అనే భావాన్నీ నిలుపుతుంది.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: వారి నుదుటుల మీద
  rationale: ముద్ర ఉంచబడే స్థానాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λέγων
  choice: ఇలా చెబుతూ
  rationale: ఇది ముందరి వాక్యంతో కొనసాగే వర్తమాన కృదంతమనే లక్షణాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: దేవునికి చెందినవారిని సూచించే సందర్భంలో δοῦλος అనువాదం
  choice: బానిసలు
  alternative: దాసులు; సేవకులు
  rationale: ముద్ర వేయడం ద్వారా వారు దేవునికి చెందినవారని ఈ దృశ్యం నొక్కిచెబుతుంది. అందువల్ల యాజమాన్యం, సంపూర్ణ విధేయత అనే ఉద్వేగాన్ని ‘బానిసలు’ స్పష్టంగా నిలుపుతుంది; సాంప్రదాయికంగా మృదువైన రూపాలను పాదసూచికలో ఉంచడం ద్వారా పదార్థ పరిధిని కూడా వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘భూమికిగానీ, సముద్రానికిగానీ, చెట్లకుగానీ’ అనే సమాంతర నిర్మాణం మూడు కర్మలపై ఒకే నిషేధాన్ని సహజంగా చూపిస్తుంది. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘బానిసలు’ పదానికే జతచేయబడింది.
