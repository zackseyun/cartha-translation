  terminology: “భూమి,” “సముద్రం,” “చెట్లు,” “ముద్ర,” and “నుదుటులు” are suitable. “బానిసలు” is source-sensitive in this context. The footnote’s Greek transliteration should correspond to the cited form δούλους / doulous.
