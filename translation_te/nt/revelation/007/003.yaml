  - severity: low
    issue: Footnote transliteration consistency
    rationale: The footnote gives “దూలూస్ (doulous)”; the Telugu transliteration does not clearly reflect the supplied Latin transliteration. Using the Greek form and a matching Telugu transliteration avoids confusion.
