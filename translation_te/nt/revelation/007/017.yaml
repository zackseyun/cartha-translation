id: REV.7.17
reference: Revelation 7:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: te
  text: ఎందుకంటే సింహాసనం మధ్యలో[a] ఉన్న గొర్రెపిల్లే వారిని కాపరివలె మేపుతాడు, జీవజలాల ఊటల వద్దకు వారిని నడిపిస్తాడు[b][c]. దేవుడు వారి కళ్లలోని ప్రతి కన్నీటినీ తుడిచివేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సింహాసనం నడుమ.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దారి చూపిస్తాడు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘జీవపు నీటి ఊటల వద్దకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలో ఇది క్రీస్తును సూచించే స్థిరమైన బిరుదు. మూలంలోని బలి మరియు మెస్సీయ సంబంధమైన ప్రతిధ్వనులను నిలుపుతుంది.
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: సింహాసనం మధ్యలో
  rationale: సింహాసనానికి సంబంధించి కేంద్రస్థానాన్ని తెలిపే గ్రీకు దృశ్యరూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ποιμανεῖ
  choice: కాపరిగా మేపుతాడు
  rationale: ποιμαίνω అనే క్రియలోని కాపరి కార్యాన్ని స్పష్టంగా తెలియజేస్తూ, గొర్రెపిల్లే కాపరిగా ఉండే ఉద్దేశపూర్వక విరోధాభాసాన్ని నిలుపుతుంది.
- source_word: ὁδηγήσει
  choice: నడిపిస్తాడు
  rationale: దారి చూపుతూ ముందుకు తీసుకెళ్లడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘మేపుతాడు’ అనే ముందరి క్రియతో పూర్తిగా కలిసిపోకుండా వేరుగా నిలుస్తుంది.
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: జీవపు నీటి ఊటల దగ్గరకు
  rationale: జీవం అనే షష్ఠీ సంబంధం ప్రధానంగా నీటిని విశేషిస్తుందనే సాధ్యమైన నిర్మాణాన్ని నిలుపుతూ, πηγαίకు సహజ ప్రకృతి దృశ్యమైన ‘ఊటలు’ను వాడుతుంది.
- source_word: ἐξαλείψει
  choice: తుడిచివేస్తాడు
  rationale: ఓదార్పు సందర్భంలో కన్నీటిని పూర్తిగా తొలగించే చర్యను సహజంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: πᾶν δάκρυον
  choice: ప్రతి కన్నీటినీ
  rationale: ఏ ఒక్క కన్నీరు కూడా మిగలదనే సంపూర్ణతను, మూలంలోని ఏకవచన దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: వారి కళ్లలోని
  rationale: తెలుగులో కన్నీటిని తుడిచివేయడం అనే ప్రయోగంతో సహజంగా సరిపోతూ, వారి కళ్లనుండి కన్నీరు తొలగించబడే మూలభావాన్ని అందిస్తుంది.
theological_decisions:
- issue: గొర్రెపిల్ల కాపరిగా ఉండే క్రీస్తు సంబంధమైన విరోధాభాసం
  choice: ‘గొర్రెపిల్లే వారిని కాపరిగా మేపుతాడు’ అని ప్రత్యక్షంగా నిలిపాం.
  alternative: ‘గొర్రెపిల్ల వారిని చూసుకుంటాడు’ లేదా ‘పాలిస్తాడు.’
  rationale: సులభతరం చేసి విరోధాభాసాన్ని తొలగించకుండా, ప్రకటన గ్రంథంలోని గొర్రెపిల్ల బిరుదునూ బైబిలు కాపరి దృశ్యాన్నీ కలిపే మూలంలోని ఉద్దేశపూర్వక బలాన్ని నిలుపుతుంది.
- issue: చివరి వాక్యంలో దేవునికి, గొర్రెపిల్లకు మధ్య వ్యాకరణ భేదం
  choice: ‘దేవుడు’ అనే స్పష్టమైన కర్తతో కొత్త వాక్యంగా ఉంచాం.
  alternative: గొర్రెపిల్లనే సూచించే అదే అంతర్లీన కర్త కొనసాగినట్లు అనువదించడం.
  rationale: గ్రీకులో ὁ θεός స్పష్టమైన కర్త. దాన్ని నిలపడం దర్శనంలోని వ్యక్తుల భేదాన్ని కలిపివేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘గొర్రెపిల్లే’లోని ఉద్ఘాటన కాపరిగా వ్యవహరించే గొర్రెపిల్ల అనే విరోధాభాసాన్ని స్పష్టం చేస్తుంది. క్రీస్తును సూచించే బిరుదు కావడంతో క్రియలకు వ్యక్తివాచక పురుష రూపం వాడబడింది.
