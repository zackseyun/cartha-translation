id: REV.7.7
reference: Revelation 7:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: te
  text: షిమ్యోను గోత్రం నుండి పన్నెండు వేలమంది; లేవి గోత్రం నుండి పన్నెండు వేలమంది; ఇశ్శాఖారు గోత్రం నుండి పన్నెండు వేలమంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: నుండి
  rationale: మూలం లేదా ఉద్భవాన్ని సూచించే ఈ విభక్త్యర్థానికి ఆధునిక తెలుగులో సహజమైన సమానార్థకం; ప్రతి గోత్రంతో పునరావృతమయ్యే మూలభాషా నిర్మాణాన్ని నిలుపుతుంది.
- source_word: φυλῆς
  choice: గోత్రం
  rationale: ఇశ్రాయేలు వంశపరమైన విభాగాన్ని సూచించే సందర్భంలో స్థిరమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: Συμεὼν
  choice: షిమ్యోను
  rationale: గ్రీకు రూపానికి ఆధారంగా, తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తి/గోత్ర నామాన్ని లిప్యంతరీకరించాం.
- source_word: δώδεκα χιλιάδες
  choice: పన్నెండు వేలమంది
  rationale: లెక్కించబడుతున్నవారు మనుషులు కాబట్టి ‘మంది’ని చేర్చడం తెలుగులో సహజంగా ఉంటుంది; సంఖ్యను పదాల్లో ఇవ్వడం జాబితా యొక్క సాహిత్య లయను నిలుపుతుంది.
- source_word: Λευὶ
  choice: లేవి
  rationale: పేరును ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించాం; జాబితాలో లేవి ఉండటాన్ని వివరణతో మార్చకుండా మూలాన్ని యథాతథంగా అనుసరించాం.
- source_word: Ἰσσαχὰρ
  choice: ఇశ్శాఖారు
  rationale: గ్రీకు నామరూపాన్ని తెలుగు బైబిలు నామపద్ధతికి అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: గోత్రాల జాబితాలో పునరావృత వాక్య నిర్మాణం
  choice: ప్రతి గోత్రానికి ‘గోత్రం నుండి పన్నెండు వేలమంది’ అనే నిర్మాణాన్ని పునరావృతం చేయడం
  alternative: ‘షిమ్యోను, లేవి, ఇశ్శాఖారు గోత్రాల నుండి ఒక్కొక్క గోత్రానికి పన్నెండు వేలమంది’ అని సంక్షిప్తీకరించడం
  rationale: గ్రీకు మూలంలో ప్రతి గోత్రానికి సూత్రబద్ధమైన పదబంధం పునరావృతమవుతుంది. ఆ ప్రకటనాత్మక జాబితా లయను, ప్రతి గోత్రానికి ఇచ్చిన సమాన ప్రాధాన్యాన్ని నిలుపడం కోసం పునరావృతిని కాపాడాం.
- issue: గోత్రాల లెక్కింపులో లేవి చేర్చబడటం
  choice: ప్రధాన పాఠ్యంలో వివరణ లేకుండా లేవి పేరును అనువదించడం
  alternative: లేవి అసాధారణంగా చేర్చబడిన విషయాన్ని ప్రధాన పాఠ్యంలో వివరించడం
  rationale: మూల వచనం లేవిని నేరుగా జాబితాలో ఉంచుతుంది; అదనపు వివరణ చేర్చడం వచనం చెప్పనిదాన్ని దిగుమతి చేయడమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన జాబితా శైలిని ఉపయోగించాం. మూలంలోని ἐκ ను ‘నుండి’గా స్పష్టంగా వ్యక్తపరచినందున ఆంగ్లంలో సూచించిన ‘from/out of’ ప్రత్యామ్నాయానికి తెలుగు పాదటిప్పణి అవసరం లేదు.
