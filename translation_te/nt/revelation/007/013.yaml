  to: 'అప్పుడు పెద్దలలో ఒకరు స్పందించి నాతో ఇలా అన్నారు: “తెల్లని వస్త్రాలు ధరించుకున్న వీరు ఎవరు? వీరు ఎక్కడి నుంచి వచ్చారు[a]?”'
