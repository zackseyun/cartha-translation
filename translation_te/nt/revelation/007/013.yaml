id: REV.7.13
reference: Revelation 7:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: te
  text: 'అప్పుడు పెద్దలలో ఒకరు స్పందించి నాతో ఇలా అన్నారు: “తెల్లని వస్త్రాలు ధరించుకున్న వీరు ఎవరు? వీరు ఎక్కడి నుంచి వచ్చారు[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీరు ఎక్కడి నుంచి వచ్చినవారు?”
    reason: ἦλθον అనే గతకాల క్రియను వారి ప్రస్తుత గుర్తింపుతో అనుసంధానించి తెలుగులో వ్యక్తపరచగల ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Καὶ
  choice: అప్పుడు
  rationale: దర్శన వర్ణనలో కథనాన్ని ముందుకు నడిపే అనుసంధానంగా సహజమైన ఆధునిక తెలుగులో అనువదించబడింది.
- source_word: ἀπεκρίθη
  choice: స్పందించి
  rationale: వెంటనే ముందు ప్రత్యక్ష ప్రశ్న లేకపోయినా, గ్రీకు క్రియలోని ప్రతిస్పందన భావాన్ని నిలుపుతూ తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: పెద్దలలో ఒకరు
  rationale: సమూహంలో ఒకరిని సూచించే గ్రీకు భాగసూచక నిర్మాణాన్ని సహజంగా తెలియజేస్తుంది; గౌరవార్థక ఏకవచన ప్రయోగం వాడబడింది.
- source_word: λέγων μοι
  choice: నాతో ఇలా అన్నారు
  rationale: మాట్లాడిన వ్యక్తి, సంబోధితుడు రెండింటినీ స్పష్టంగా ఉంచుతూ గ్రీకు కృదంత నిర్మాణాన్ని సహజమైన తెలుగు వాక్యంగా మారుస్తుంది.
- source_word: Οὗτοι οἱ περιβεβλημένοι
  choice: ధరించుకున్న వీరు
  rationale: పూర్వ క్రియ ఫలితంగా కొనసాగుతున్న ప్రస్తుత స్థితిని గ్రీకు పరిపూర్ణ కృదంతం సూచిస్తుంది; ‘ధరించుకున్న’ ఆ స్థితిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὰς στολὰς τὰς λευκάς
  choice: తెల్లని అంగీలు
  rationale: στολή సూచించే పొడవైన ప్రత్యేక వస్త్రాన్ని ‘అంగీలు’ సంక్షిప్తంగా, ప్రకటన గ్రంథంలోని దృశ్యానికి తగినట్లుగా తెలియజేస్తుంది.
- source_word: τίνες εἰσὶν
  choice: వీరు ఎవరు?
  rationale: ప్రదర్శక సర్వనామాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజమైన ప్రశ్నారూపాన్ని వాడుతుంది.
- source_word: πόθεν ἦλθον
  choice: వీరు ఎక్కడి నుంచి వచ్చారు?
  rationale: πόθεν లోని మూలస్థాన భావాన్నీ, ἦλθον లోని గత రాక భావాన్నీ స్పష్టమైన సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ἦλθον క్రియలోని కాలం మరియు ప్రస్తుత దృశ్యంతో దాని సంబంధం
  choice: వీరు ఎక్కడి నుంచి వచ్చారు?
  alternative: వీరు ఎక్కడి నుంచి వచ్చినవారు?
  rationale: గ్రీకు ఏఓరిస్టు రూపంలోని గత సంఘటనను ప్రధాన పాఠం నేరుగా వ్యక్తపరుస్తుంది. ప్రత్యామ్నాయ రూపం వారి ప్రస్తుత గుర్తింపుతో ఆ రాకకు ఉన్న సంబంధాన్ని ముందుకు తెస్తుంది; మూలపాఠం ఈ సూక్ష్మభేదాన్ని సిద్ధాంతపరంగా నిర్బంధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన శైలి వాడబడింది. ‘పెద్దలలో ఒకరు … అన్నారు’ అనే గౌరవార్థక ఏకవచనం తెలుగు వాడుకకు అనుగుణం. మూలంలోని ప్రశ్నలు రెండు ప్రత్యేక ప్రశ్నలుగానే నిలుపబడ్డాయి.
