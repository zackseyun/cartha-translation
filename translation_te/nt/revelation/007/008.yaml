id: REV.7.8
reference: Revelation 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ζαβουλὼν δώδεκα χιλιάδες, ἐκ φυλῆς Ἰωσὴφ δώδεκα χιλιάδες, ἐκ φυλῆς Βενιαμὶν δώδεκα χιλιάδες ⸀ἐσφραγισμένοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/008.yaml
  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: te
  text: జెబులూను గోత్రం నుండి పన్నెండు వేల మంది; యోసేపు గోత్రం నుండి పన్నెండు వేల మంది; బెన్యామీను గోత్రం నుండి పన్నెండు వేల మంది—వీరంతా ముద్ర వేయబడినవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ముద్ర వేయబడి ఉన్నవారు,’ ‘వారికి ముద్ర వేయబడింది.’ గ్రీకులో చివరనున్న కృదంతం జాబితాలో పేర్కొన్న సమూహాలను సమాహారంగా వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ φυλῆς
  choice: గోత్రం నుండి
  rationale: ఇశ్రాయేలు వంశ విభాగాన్ని సూచించే φυλήకు ‘గోత్రం’ సహజమైన, స్థిరపడిన తెలుగు సమానం; ἐκ మూలాన్ని లేదా సమూహంలోనుండి ఎంపికను సూచిస్తున్నందున ‘నుండి’ అని అనువదించాం.
- source_word: Ζαβουλὼν
  choice: జెబులూను
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా గోత్రనామాన్ని లిప్యంతరీకరించాం.
- source_word: δώδεκα χιλιάδες
  choice: పన్నెండు వేల మంది
  rationale: సంఖ్యను యథాతథంగా ఉంచుతూ, లెక్కించబడుతున్న వారు మనుషులని తెలుగులో సహజంగా తెలియజేయడానికి ‘మంది’ చేర్చాం.
- source_word: Ἰωσὴφ
  choice: యోసేపు
  rationale: మూలపాఠం ‘యోసేపు’ అనే పేరునే వాడుతోంది; ఇతర గోత్ర సంప్రదాయాలతో దానిని వివరణాత్మకంగా మార్చకుండా అదే పేరును నిలిపాం.
- source_word: Βενιαμὶν
  choice: బెన్యామీను
  rationale: గోత్రనామాన్ని సాధారణ తెలుగు బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: ἐσφραγισμένοι
  choice: ముద్ర వేయబడినవారు
  rationale: పూర్త భూతకాల నిష్క్రియాత్మక కృదంతంలోని నిష్క్రియాత్మకతను, ముద్రవేత ఫలితం కొనసాగుతున్న భావాన్ని ఈ రూపం సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: చివరనున్న ἐσφραγισμένοι అనే కృదంతం ఎవరిని సూచిస్తుంది, దాని బలం ఏమిటి?
  choice: జాబితాలో పేర్కొన్న వారిని సమాహారంగా సూచించే ముగింపు వర్ణనగా ‘వీరంతా ముద్ర వేయబడినవారు’ అని ఉంచాం.
  alternative: ‘ముద్ర వేయబడి ఉన్నవారు’ లేదా ‘వారికి ముద్ర వేయబడింది’ అని మరింత విపులంగా అనువదించడం.
  rationale: గ్రీకు వాక్యంలో కృదంతం చివర ఉండి ముందున్న గోత్ర సమూహాలను సమాహారంగా వర్ణిస్తుంది. దానిని చివరే ఉంచడం మూలంలోని సాహిత్య ప్రభావాన్ని కాపాడుతుంది; ముద్ర స్వభావం లేదా దాని ధార్మిక అర్థాన్ని పాఠం చెప్పినదానికంటే ఎక్కువగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా ఉండే జాబితా శైలిని వాడాం. పునరావృతమయ్యే ‘గోత్రం నుండి పన్నెండు వేల మంది’ నిర్మాణాన్ని మూలంలోని లయ కోసం నిలిపి, చివరి సమాహార కృదంతాన్ని దీర్ఘ విరామచిహ్నంతో అనుసంధానించాం.
