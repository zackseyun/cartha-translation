id: REV.12.11
reference: Revelation 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: te
  text: వారు గొర్రెపిల్ల రక్తం ద్వారా, తమ సాక్ష్య సందేశం ద్వారా అతనిని జయించారు[a]. వారు మరణం వరకు తమ ప్రాణాన్ని[b] ప్రేమించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిపై విజయం సాధించారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “జీవితాన్ని” లేదా “ఆత్మను”; గ్రీకు పదమైన ప్స్యూఖే ప్రాణం, జీవితం, స్వయం, లేదా ఆత్మ అనే అర్థాలను ఇవ్వగలదు. ఇక్కడ మరణం వరకు అనే సందర్భంలో ‘ప్రాణం’ భౌతిక జీవితాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν αὐτόν
  choice: అతనిపై విజయం సాధించారు
  rationale: క్రియలోని జయించడం/అధిగమించడం అనే భావాన్ని, ప్రకటన గ్రంథంలోని సంఘర్షణ చిత్రణను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: διὰ τὸ αἷμα τοῦ ἀρνίου
  choice: గొర్రెపిల్ల రక్తం ద్వారా
  rationale: διά + accusative ఇక్కడ సాధనం లేదా కారణాన్ని సూచించగలదు. ‘ద్వారా’ సాధన భావాన్ని ముందుకు తెస్తూనే, గొర్రెపిల్ల బలిమరణాన్ని పాఠానికి మించి సిద్ధాంతపరంగా విస్తరించదు.
- source_word: τοῦ ἀρνίου
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలో ఇది క్రీస్తును సూచించే బిరుదు; బలి సంబంధమైన మూల చిత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: τὸν λόγον τῆς μαρτυρίας αὐτῶν
  choice: తాము ఇచ్చిన సాక్ష్యవాక్యం
  rationale: λόγος మరియు μαρτυρία రెండింటి భావాన్నీ నిలుపుతూ, తెలుగులో సహజంగా వారి పలికిన సాక్ష్యాన్ని సూచిస్తుంది.
- source_word: τὴν ψυχὴν αὐτῶν
  choice: తమ ప్రాణాన్ని
  rationale: ψυχή ఇక్కడ మరణాన్ని ఎదుర్కొనే సందర్భంలో వారి భౌతిక జీవితం/ప్రాణాన్ని సూచిస్తుంది. గ్రీకు ఏకవచనంలోని పంపిణీ భావాన్ని తెలుగు ఏకవచనం సహజంగా మోస్తుంది.
- source_word: οὐκ ἠγάπησαν
  choice: ప్రేమించలేదు
  rationale: ἀγαπάω యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; ‘పట్టుకొని వేలాడలేదు’ వంటి వివరణాత్మక భావాన్ని పాఠంలోకి చేర్చదు.
- source_word: ἄχρι θανάτου
  choice: మరణం వరకూ
  rationale: మరణించే స్థాయి వరకు వారి నిబద్ధత వెళ్లిందనే హద్దు భావాన్ని సంక్షిప్తంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: గొర్రెపిల్ల రక్తం ద్వారా కలిగిన విజయం
  choice: రక్తాన్ని వారి విజయానికి సాధనంగా ‘ద్వారా’ అని అనువదించడం
  alternative: ‘గొర్రెపిల్ల రక్తం కారణంగా’
  rationale: సందర్భం సాధన భావానికి బలం ఇస్తుంది; అయితే మూలంలోని సాధన/కారణ సంభావ్యతను సిద్ధాంత వివరణతో మరీ నిర్దిష్టం చేయలేదు.
- issue: హతసాక్ష్య సందర్భంలో ψυχή అర్థం
  choice: ప్రాణం
  alternative: ఆత్మ లేదా జీవితం
  rationale: ఇక్కడ దేహం–ఆత్మ భేదాన్ని పాఠం తప్పనిసరిగా చెప్పడం లేదు. మరణాన్ని అంగీకరించే సందర్భంలో ‘ప్రాణం’ తెలుగులో అత్యంత సహజంగా ఆ ఉద్దేశాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. ‘గొర్రెపిల్ల,’ ‘రక్తం,’ ‘సాక్ష్యవాక్యం,’ ‘ప్రాణం’ అనే ప్రకటన గ్రంథపు ముఖ్య చిత్రాలు, పదసంబంధాలు నిలుపబడ్డాయి.
