revisions:
- from: 'అప్పుడు పరలోకంలో ఒక గొప్ప సూచన కనిపించింది: సూర్యుణ్ణి వస్త్రంగా ధరించిన ఒక స్త్రీ; ఆమె పాదాల కింద చంద్రుడు, ఆమె తలపై పన్నెండు నక్షత్రాలతో కూడిన కిరీటం[a] ఉన్నాయి.'
  to: 'మరియు పరలోకంలో ఒక గొప్ప సూచన కనిపించింది: సూర్యుణ్ణి వస్త్రంగా ధరించిన ఒక స్త్రీ; ఆమె పాదాల కింద చంద్రుడు ఉన్నాడు, ఆమె తలపై పన్నెండు నక్షత్రాల కిరీటం ఉంది[a].'
  rationale: The revision removes the added temporal sense of “అప్పుడు,” clarifies the Telugu syntax of the visionary description, and refines the στέφανος footnote. It does not identify the woman or otherwise interpret the symbolism.
