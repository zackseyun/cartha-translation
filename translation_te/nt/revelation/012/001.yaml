id: REV.12.1
reference: Revelation 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: te
  text: 'మరియు పరలోకంలో ఒక గొప్ప సూచన కనిపించింది: సూర్యుణ్ణి వస్త్రంగా ధరించిన ఒక స్త్రీ; ఆమె పాదాల కింద చంద్రుడు ఉన్నాడు, ఆమె తలపై పన్నెండు నక్షత్రాల కిరీటం ఉంది[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పుష్పమాల’ లేదా ‘విజేతకు ఇచ్చే కిరీటం.’ ఇక్కడ గ్రీకు పదం στέφανος; ఇది రాజమకుటాన్ని సూచించే పదానికి భిన్నమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: సూచన
  rationale: ప్రకటన గ్రంథంలోని దర్శనాత్మక సందర్భంలో ఇది కేవలం అద్భుతాన్ని కాక, ప్రతీకాత్మకంగా అర్థాన్ని సూచించే దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: μέγα
  choice: గొప్ప
  rationale: పరిమాణంతోపాటు ప్రాముఖ్యతను కూడా సహజంగా తెలియజేస్తుంది.
- source_word: ὤφθη
  choice: కనిపించింది
  rationale: గ్రీకులో రూపపరంగా కర్మణి ప్రయోగమైనా, దర్శనంలో దృశ్యం ప్రత్యక్షమైందనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: οὐρανός అనేది ఆకాశం లేదా పరలోకం అని అర్థం కావచ్చు; ప్రకటన గ్రంథంలోని దర్శన సందర్భంలో ‘పరలోకం’ అనేది సముచితమైన ఎంపిక.
- source_word: γυνή
  choice: ఒక స్త్రీ
  rationale: ఇక్కడ ఆమెను భార్యగా పేర్కొనలేదు; ప్రతీకాత్మక స్త్రీ రూపాన్ని మాత్రమే పరిచయం చేస్తుంది.
- source_word: περιβεβλημένη τὸν ἥλιον
  choice: సూర్యుణ్ణి వస్త్రంగా ధరించిన
  rationale: περιβάλλωలోని ధరించడం లేదా చుట్టబడి ఉండడం అనే వస్త్రచిత్రాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: ఆమె పాదాల కింద చంద్రుడు
  rationale: మూలంలోని స్థాన సంబంధమైన దృశ్యాన్ని సంక్షిప్తంగా, నేరుగా కాపాడుతుంది.
- source_word: στέφανος
  choice: కిరీటం
  rationale: ప్రధాన పాఠంలో స్పష్టమైన సాధారణ పదాన్ని వాడి, ఇది రాజమకుటం కంటే వలయాకార విజయ కిరీటాన్ని సూచించగలదనే సూక్ష్మతను పాదసూచికలో ఉంచింది.
- source_word: ἀστέρων δώδεκα
  choice: పన్నెండు నక్షత్రాలతో కూడిన
  rationale: కిరీటం పన్నెండు నక్షత్రాలతో సంబంధమున్నదనే దృశ్యాన్ని అదనపు వ్యాఖ్యానం లేకుండా సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: స్త్రీ ప్రతీకాత్మకంగా ఎవరిని సూచిస్తుందనే గుర్తింపు
  choice: అనువాదంలో ఆమెకు నిర్దిష్ట గుర్తింపును ఇవ్వకుండా దర్శనంలోని వర్ణనను మాత్రమే ఉంచడం
  alternative: ఇశ్రాయేలు, మరియ, దేవుని ప్రజలు, లేదా సంఘం అని స్పష్టీకరించడం
  rationale: ఈ వచనం స్త్రీని స్వయంగా గుర్తించదు. ఏ సంప్రదాయానికి ప్రత్యేకమైన వ్యాఖ్యానాన్నీ పాఠ్యంలో చేర్చకుండా దాని ఉద్దేశపూర్వక ప్రతీకాత్మక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దర్శన శైలిని నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగించాం. ‘అప్పుడు’ అనేది గ్రీకు Καὶ యొక్క కథన కొనసాగింపును సహజ తెలుగులో వ్యక్తపరుస్తుంది; స్త్రీ ఎవరో వ్యాఖ్యానాత్మకంగా నిర్ణయించలేదు.
