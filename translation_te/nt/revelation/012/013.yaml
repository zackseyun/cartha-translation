id: REV.12.13
reference: Revelation 12:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: te
  text: డ్రాగన్ తాను భూమిమీదికి పడవేయబడ్డాడని చూసినప్పుడు, మగ శిశువును[a] కన్న స్త్రీని వెంటాడింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఆ మగవానిని’ లేదా ‘ఆ మగది.’ సందర్భానికి సహజంగా ఉండేందుకు ‘శిశువు’ అనే పదం చేర్చబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘హింసించింది.’ గ్రీకు క్రియకు ‘వెంటాడింది,’ ‘హింసించింది’ అనే రెండు అర్థాలూ ఉండవచ్చు; ఇక్కడ శత్రుత్వంతో వెంబడించడం, హింసించడం రెండూ భావంలో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: మహాసర్పం
  rationale: ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ రూపకాన్ని నిలుపుతూ, సాధారణ ‘సర్పం’తో పూర్తిగా సమానం చేయకుండా పెద్దదైన భయంకర సర్పరూప జీవిని సూచిస్తుంది.
- source_word: ἐβλήθη
  choice: పడవేయబడినట్లు
  rationale: βάλλω యొక్క కర్మణి రూపంలో ఉన్న బలవంతపు కిందికి విసరబడటం లేదా తొలగించబడటం అనే భావాన్ని నిలుపుతుంది.
- source_word: εἰς τὴν γῆν
  choice: భూమి మీదికి
  rationale: సందర్భంలోని పరలోకం–భూమి వ్యత్యాసాన్ని బట్టి γῆ ఇక్కడ ‘దేశం’ కంటే ‘భూమి’ని సూచిస్తుంది.
- source_word: ἐδίωξεν
  choice: వెంటాడింది
  rationale: διώκω యొక్క ప్రత్యక్షమైన వెంబడింపు భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; హింసించడం అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: γυναῖκα
  choice: స్త్రీని
  rationale: స్త్రీ యొక్క సంకేతాత్మక గుర్తింపును అనువాదంలో నిర్ణయించకుండా గ్రీకు పదానికి నేరమైన సమానార్థాన్ని ఇస్తుంది.
- source_word: ἔτεκεν
  choice: కన్న
  rationale: τίκτωలోని ప్రసవించడం అనే భావాన్ని సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸν ἄρσενα
  choice: మగ శిశువును
  rationale: గ్రీకులో నామవాచకంగా వాడిన ‘మగవాడు/మగది’ అనే విశేషణాన్ని సహజమైన తెలుగుకోసం ‘శిశువు’తో స్పష్టం చేస్తూ, మగ లింగంపై ఉన్న ఉద్దేశపూర్వక నొక్కును నిలుపుతుంది.
theological_decisions:
- issue: స్త్రీ మరియు మగ శిశువు యొక్క సంకేతాత్మక గుర్తింపు
  choice: ‘స్త్రీ’, ‘మగ శిశువు’ అనే మూల రూపకాలనే నిలుపడం
  alternative: స్త్రీని మరియగా, ఇశ్రాయేలుగా లేదా దేవుని ప్రజలు/సంఘంగా అనువాదంలోనే గుర్తించడం
  rationale: ఈ అపోకలిప్టిక్ సంకేతాలకు భిన్నమైన వ్యాఖ్యానాలు ఉన్నాయి; గ్రీకు వాక్యం స్వయంగా చెప్పనిదాన్ని అనువాదం నిర్ణయించకూడదు.
- issue: διώκωలోని భావ పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘వెంటాడింది’
  alternative: ‘హింసించింది’
  rationale: కథనంలో ప్రత్యక్షంగా కనిపించే శత్రుత్వపూర్వక వెంబడింపును ప్రధాన పాఠ్యం చూపుతుంది; అదే క్రియలో ఉండగల హింస భావాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్య నిర్మాణం వాడబడింది. ‘మహాసర్పం’ అపోకలిప్టిక్ గంభీరతను నిలుపుతుంది; క్రియారూపాల్లో పాత గ్రాంథిక ముగింపులు నివారించబడ్డాయి.
