    text: అక్షరార్థంగా ‘ఆ మగవానిని’ లేదా ‘ఆ మగది.’ సందర్భానికి సహజంగా ఉండేందుకు ‘శిశువు’ అనే పదం చేర్చబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘హింసించింది.’ గ్రీకు క్రియకు ‘వెంటాడింది,’ ‘హింసించింది’ అనే రెండు అర్థాలూ ఉండవచ్చు; ఇక్కడ శత్రుత్వంతో వెంబడించడం, హింసించడం రెండూ భావంలో ఉండవచ్చు.
    reason: lexical_alternative
