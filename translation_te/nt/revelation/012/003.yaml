id: REV.12.3
reference: Revelation 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων ⸂μέγας πυρρός⸃, ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: te
  text: మరొక సూచన పరలోకంలో కనిపించింది; ఇదిగో, ఏడు తలలు, పది కొమ్ములు గల ఒక మహా అగ్నివర్ణపు డ్రాగన్, దాని తలలపై ఏడు రాజమకుటాలు[b] ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా “రాజపట్టాలు.” గ్రీకు పదం విజయమాలను కాక, రాజాధికారానికి చిహ్నమైన తలపట్టం లేదా రాజమకుటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: కనిపించింది
  rationale: దర్శన వర్ణనలో ఈ కర్మణి రూపం సహజంగా ‘కనిపించింది/ప్రత్యక్షమైంది’ అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘కనిపించింది’ స్పష్టంగా ఉంది.
- source_word: ἄλλο σημεῖον
  choice: మరో సూచన
  rationale: ప్రకటన గ్రంథంలోని σημεῖον దృశ్యరూపంలో కనిపించే ప్రతీకాత్మక సూచనను సూచిస్తుంది; ‘సూచన’ అర్థాన్ని వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: οὐρανός‌కు ఆకాశం లేదా పరలోకం అనే అర్థాలు సాధ్యమైనా, ఈ అపోకలిప్టిక్ దర్శన సందర్భంలో ‘పరలోకం’ విశ్వాతీత నేపథ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: దృశ్యంలోని ఆకస్మికమైన, గమనార్హమైన అంశంపై పాఠకుని దృష్టిని మళ్లించే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: δράκων
  choice: ఘటసర్పం
  rationale: δράκων సూచించే మహా సర్పాకార భయంకర జీవిని తెలుగులో గంభీరంగా, బైబిలు సందర్భానికి తగినట్లు వ్యక్తపరుస్తుంది; కేవలం ఆధునిక కల్పితకథల ‘డ్రాగన్’ భావానికి పరిమితం చేయదు.
- source_word: μέγας πυρρός
  choice: పెద్ద అగ్నివర్ణపు
  rationale: μέγας పరిమాణాన్ని, πυρρός అగ్నిజ్వాల వంటి ఎరుపు రంగును సూచిస్తాయి; ‘అగ్నివర్ణపు’ మూలపదంలోని జ్వాలసంబంధ ఛాయను సహజంగా నిలుపుతుంది.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: ఏడు తలలు, పది కొమ్ములు ఉన్న
  rationale: గ్రీకు వర్ణనాత్మక కృదంతాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా మార్చి, సంఖ్యలు మరియు ప్రతీకలను యథాతథంగా ఉంచుతుంది.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: దాని తలలపై
  rationale: తెలుగులో జంతు/భయంకర జీవి సూచక నామానికి ‘దాని’ సహజం; గ్రీకు వ్యాకరణ లింగాన్ని అనవసరంగా వ్యక్తిగత లింగంగా మార్చదు.
- source_word: διαδήματα
  choice: రాజకిరీటాలు
  rationale: διάδημα విజయమాల కంటే రాజాధికారాన్ని సూచించే కిరీటం లేదా రాజపట్టం; సాధారణ పాఠకునికి అర్థమయ్యేలా ‘రాజకిరీటాలు’ అని ఇచ్చి ప్రత్యేకతను నిలుపుతుంది.
theological_decisions:
- issue: πυρρός అనే రంగు విశేషణం
  choice: అగ్నివర్ణపు
  alternative: ఎర్రని
  rationale: ఈ పదం కేవలం సాధారణ ఎరుపు మాత్రమే కాక అగ్నిజ్వాల వంటి ఎరుపును సూచించగలదు. ‘అగ్నివర్ణపు’ ఆ దృశ్య తీవ్రతను వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
- issue: δράκων‌కు సూచించే సర్వనామం
  choice: దాని
  alternative: అతని
  rationale: ఈ వచనంలో కనిపిస్తున్న జీవిని తెలుగులో సహజంగా సూచించడానికి ‘దాని’ సరిపోతుంది. తరువాతి వచనాల్లో దానికి ఇచ్చే వ్యక్తిగత గుర్తింపును ముందుగానే ఈ వచనంలోకి తీసుకురాదు.
- issue: διάδημα యొక్క రాజాధికార భావం
  choice: రాజకిరీటాలు
  alternative: కిరీటాలు
  rationale: στέφανος అనే విజయమాల/కిరీటం నుండి διάδημα భిన్నమైన రాజచిహ్నం. ‘రాజకిరీటాలు’ ఆ తేడాను సాధారణ పాఠకునికి అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దర్శనశైలిని నిలిపాం. ‘ఇదిగో’ ఆకస్మిక దృశ్య ఉద్ఘాటనను మోస్తుంది. గ్రీకు వాక్యంలోని వివరణాత్మక ప్రవాహాన్ని తెలుగులో సహజంగా చేయడానికి ‘ఉన్న’ నిర్మాణం మరియు చివర ‘ఉన్నాయి’ వాడాం.
