review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential opening, the paired heavenly summons, the woe directed to earth and sea, the devil's descent, great wrath, and awareness of a short remaining period. A small revision better preserves the Greek participial sequence and makes the final subject unambiguous in Telugu.
  naturalness: The Telugu is generally modern and readable. Recasting the final participial clause as a finite clause improves flow and avoids a potentially momentary ambiguity in “తనకు ... తెలుసుకొని.” “మహా కోపం” is a more direct and idiomatic equivalent for θυμὸν μέγαν than “తీవ్రమైన ఆగ్రహం.”
  terminology: “పరలోకాలారా,” “నివసించేవారలారా,” and “అపవాది” are appropriate elevated modern-standard Telugu terms for this apocalyptic register. “అయ్యో” retains the lament/woe force without importing a specific doctrinal interpretation.
  issues:
  - severity: low
    issue: The ordering and form of the final participial clause are slightly less transparent.
    rationale: Greek has “having great wrath, knowing that he has a little time.” The draft’s “తనకు ... తెలుసుకొని” is understandable, but a finite explanatory clause more naturally identifies the devil as the one who knows and clearly retains the ongoing explanatory relationship.
  - severity: low
    issue: “తీవ్రమైన ఆగ్రహంతో” is somewhat less direct for θυμὸν μέγαν.
    rationale: θυμὸν μέγαν literally denotes great wrath/anger. “మహా కోపంతో” is natural Telugu and more closely represents the magnitude expressed by μέγαν.
  revised_text: కాబట్టి పరలోకాలారా, వాటిలో నివసించేవారలారా, ఆనందించండి! భూమికీ[a] సముద్రానికీ అయ్యో! ఎందుకంటే అపవాది మహా కోపంతో[b] మీ దగ్గరికి దిగివచ్చాడు; తనకు కొద్దికాలమే ఉందని అతనికి తెలుసు.
