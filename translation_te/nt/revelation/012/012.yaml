id: REV.12.12
reference: Revelation 12:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: te
  text: కాబట్టి పరలోకాలారా, వాటిలో నివసించేవారలారా, ఆనందించండి! భూమికీ[a] సముద్రానికీ అయ్యో! ఎందుకంటే అపవాది మహా కోపంతో[b] మీ దగ్గరికి దిగివచ్చాడు; తనకు కొద్దికాలమే ఉందని అతనికి తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేలకీ” లేదా “దేశానికీ.” గ్రీకు γῆ అనే పదానికి “భూమి,” “నేల,” లేదా “దేశం” అనే అర్థాలు రావచ్చు; ఇక్కడ విశ్వవ్యాప్త సందర్భాన్ని బట్టి “భూమి” అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తీవ్రమైన ఆగ్రహంతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: కాబట్టి
  rationale: ముందటి వచనాల్లోని పరలోక విజయానికి ఈ పిలుపు ఫలితమని తెలిపే సహజమైన తార్కిక అనుసంధానం.
- source_word: εὐφραίνεσθε
  choice: ఆనందించండి
  rationale: ఆనందంతో స్పందించాలనే ఆజ్ఞార్థక భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἱ οὐρανοὶ
  choice: పరలోకాలారా
  rationale: బహువచనాన్ని, ప్రత్యక్ష సంబోధనను రెండింటినీ నిలుపుతుంది.
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: వాటిలో నివసించేవారలారా
  rationale: σκηνόωలోని నివాస భావాన్ని సహజంగా అందిస్తూ, మూలంలోని ప్రత్యక్ష సంబోధనను కాపాడుతుంది.
- source_word: οὐαὶ
  choice: అయ్యో
  rationale: విపత్తు లేదా తీర్పును ప్రకటించే ప్రవచనాత్మక విలాప సూత్రానికి సహజమైన తెలుగు సమానం.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: భూమికీ సముద్రానికీ
  rationale: ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త సందర్భంలో γῆకు ‘భూమి’ అనేది సరిపోతుంది; దాని ‘నేల/దేశం’ అనే సాధ్యార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: κατέβη
  choice: దిగివచ్చాడు
  rationale: పై నుంచి కింది లోకానికి జరిగిన కదలికను, దాని ప్రస్తుత పర్యవసానాన్ని సహజంగా సూచిస్తుంది.
- source_word: ὁ διάβολος
  choice: అపవాది
  rationale: διάβολος యొక్క అపవాదు చేసే వాడు అనే మూలభావాన్ని నిలుపుతూ, సాతానుకు వాడే స్థిరమైన తెలుగు బిరుదుగా అర్థమవుతుంది.
- source_word: πρὸς ὑμᾶς
  choice: మీ దగ్గరికి
  rationale: కదలిక లక్ష్యాన్ని తెలియజేస్తుంది; ‘మీ మీదికి’ అని అనువదించి శత్రుత్వ భావాన్ని ఈ పదబంధంలోనే అదనంగా చేర్చదు.
- source_word: ἔχων θυμὸν μέγαν
  choice: తీవ్రమైన ఆగ్రహంతో
  rationale: θυμόςలోని ఉద్ధృతమైన కోపాన్ని గంభీరమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει
  choice: తనకు కొద్ది కాలమే ఉందని తెలుసుకొని
  rationale: కారణాత్మకంగా పనిచేసే అసమాపక క్రియను, పరిమితమైన కాలవ్యవధిని మూలానికి దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: ‘మీ దగ్గరికి’ అనే మాట ఎవరిని సూచిస్తుంది?
  choice: తెలుగు వాక్యంలో భూమి, సముద్రం వైపు సంబోధన మారినట్టుగా సహజంగా చదవబడేలా ఉంచడం
  alternative: ఈ ‘మీరు’ పరలోకాలను, వాటిలో నివసించేవారిని సంబోధించడాన్ని కొనసాగిస్తుందని చదవడం
  rationale: సమీప సందర్భంలో ‘భూమికీ సముద్రానికీ అయ్యో’ అన్న హెచ్చరిక తర్వాత πρὸς ὑμᾶς రావడం వల్ల భౌమిక పరిధే సహజమైన సూచన. అయినా ‘నివాసులు’ వంటి వివరణాత్మక పదాన్ని చేర్చకుండా మూలంలోని సంక్షిప్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటన గ్రంథ శైలిని నిలిపాం. ‘పరలోకాలారా’ మరియు ‘నివసించేవారలారా’ అనే సంబోధన రూపాలు మూలంలోని నాటకీయ ప్రత్యక్ష పిలుపును తెలియజేస్తాయి. పదక్రమాన్ని తెలుగు సహజ ప్రవాహానికి అనుగుణంగా మార్చినా, పరలోక ఆనందం—భూమి, సముద్రాల విపత్తు అనే వ్యత్యాసాన్ని యథాతథంగా ఉంచాం.
