revisions:
- from: అప్పుడు ఆ సర్పం తన నోటిలోనుండి నదిలాంటి నీటిని ఆ స్త్రీ వెనుకగా[a] వెళ్లగక్కింది; ఆ నది ఆమెను కొట్టుకుపోయేలా చేయాలనేదే దాని ఉద్దేశం.[b]
  to: మరియు ఆ సర్పం తన నోటి నుండి నదిలా నీటిని ఆ స్త్రీ వెనుకగా[a] విసిరింది; ఆమెను నది కొట్టుకుపోయేలా చేయడానికి.[b]
