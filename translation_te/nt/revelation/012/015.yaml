id: REV.12.15
reference: Revelation 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: te
  text: మరియు ఆ సర్పం తన నోటి నుండి నదిలా నీటిని ఆ స్త్రీ వెనుకగా[a] విసిరింది; ఆమెను నది కొట్టుకుపోయేలా చేయడానికి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ స్త్రీ వెంట.” గ్రీకు పదబంధానికి స్థలపరంగా “వెనుక” అనే అర్థమూ, వెంటపడే భావంలో “వెంట” అనే అర్థమూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆమెను నదిచేత మోసుకుపోయినదానిగా చేయడానికి.” అంటే నది ఆమెను కొట్టుకుపోయేలా చేయడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: వెళ్లగక్కింది
  rationale: βάλλωకు ప్రాథమికంగా ‘వేయు/విసురు’ అనే అర్థం ఉన్నా, నోటిలోనుండి నీటిని బలంగా బయటకు పంపే ఈ దృశ్యంలో ‘వెళ్లగక్కింది’ సహజంగా, సజీవంగా ఉంది.
- source_word: ὁ ὄφις
  choice: ఆ సర్పం
  rationale: ὄφις అంటే పాము/సర్పం. ప్రకటన గ్రంథంలోని బైబిలీయ, ప్రతీకాత్మక అనుసంధానాన్ని నిలుపుకోవడానికి ‘సర్పం’ ఎంచుకున్నాం.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: తన నోటిలోనుండి
  rationale: మూలంలోని సంబంధాన్ని నేరుగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὀπίσω τῆς γυναικός
  choice: ఆ స్త్రీ వెనుకగా
  rationale: ὀπίσω + genitive స్థలార్థంగా ‘వెనుక’ లేదా వెంటపడే భావంలో ‘వెంట/వెనుకగా’ అనవచ్చు. ప్రధాన పాఠంలో స్థలార్థాన్ని నిలిపి, వెంటపడి దాడి చేసే భావసాధ్యతను పాదసూచికలో తెలిపాం.
- source_word: ὕδωρ ὡς ποταμόν
  choice: నదిలాంటి నీటిని
  rationale: ὡς తెలిపే ఉపమానాన్ని, ποταμός అనే ‘నది’ రూపకాన్ని యథాతథంగా నిలుపుతుంది; ‘వరద’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: ἵνα
  choice: చేయాలనేదే దాని ఉద్దేశం
  rationale: ἵνα ఇక్కడ ఉద్దేశాన్ని తెలుపుతుంది. తెలుగు వాక్యంలో కర్త సర్పమేనని స్పష్టంగా ఉంచుతూ ప్రయోజనార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ποταμοφόρητον ποιήσῃ
  choice: ఆ నది ఆమెను కొట్టుకుపోయేలా చేయాలనేదే
  rationale: అరుదైన ποταμοφόρητος పదం అక్షరార్థంగా ‘నదిచేత మోసుకుపోబడిన’ అనే భావం ఇస్తుంది; ποιέωతో కలిసి కారణార్థకంగా ఉంది. ‘కొట్టుకుపోవడం’ ప్రవాహంలో మోసుకుపోయే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘ముంచి చంపడం’ వంటి అదనపు ఫలితాన్ని చేర్చదు.
theological_decisions:
- issue: సర్పం చేసే దాడిలోని ప్రతీకాత్మక/అపోకలిప్టిక్ దృశ్యం
  choice: ‘నదిలాంటి నీరు,’ ‘నది కొట్టుకుపోవడం’ అనే మూల దృశ్యాన్నే అనువాదంలో నిలిపాం.
  alternative: నీటిని సైన్యాలు, హింస, అబద్ధాలు లేదా అస్తవ్యస్తతగా ప్రధాన పాఠంలోనే వివరించడం.
  rationale: ఈ ప్రతీకకు సాధ్యమైన వ్యాఖ్యానాలలో ఏ ఒక్కదానినీ అనువాదంలో బలవంతంగా చేర్చకుండా, మూలంలోని దృశ్యాన్నీ దాని ఉద్రిక్తతనూ కాపాడాలి.
- issue: ὀπίσω యొక్క స్థలార్థం లేదా వెంటపడే భావం
  choice: ప్రధాన పాఠంలో ‘వెనుకగా’; పాదసూచికలో ‘ఆమె వెంట’ అనే ప్రత్యామ్నాయం.
  alternative: ప్రధాన పాఠంలోనే ‘ఆ స్త్రీ వెంట’ అని అనువదించడం.
  rationale: గ్రీకు పదబంధం రెండు భావాలకు అవకాశం ఇస్తుంది. ‘వెనుకగా’ రూపార్థానికి దగ్గరగా ఉండగా, సందర్భంలోని దాడి/వెంటపడే భావాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘వెళ్లగక్కింది’ దృశ్యంలోని బలాన్ని ఇస్తుంది; ‘కొట్టుకుపోయేలా’ అరుదైన గ్రీకు సమాసానికి సహజమైన తెలుగు సమానార్థక రూపం. సర్పాన్ని సూచించే సర్వనామంలో అనవసర లింగారోపణను నివారించడానికి ‘దాని’ వాడాం.
