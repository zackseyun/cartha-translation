  source_fidelity: ‘కాని అతని బలం చాలలేదు’ accurately retains the singular reference to the dragon and conveys οὐκ ἴσχυσεν without overinterpreting it. ‘ఇక పరలోకంలో వారికి చోటు దొరకలేదు’ faithfully conveys the negative, temporal ἔτι (‘ఇక’), the passive-result sense of εὑρέθη, the plural αὐτῶν, and the heavenly setting.
  naturalness: The wording is fluent modern standard Telugu with an appropriately dignified biblical register. ‘చోటు దొరకలేదు’ is idiomatic and adequately represents the Greek passive in Telugu.
  terminology: ‘పరలోకంలో’ is appropriate for οὐρανός in this apocalyptic context, and ‘చోటు’ naturally conveys τόπος. The footnote gives a legitimate lexical alternative, ‘పైచేయి సాధించలేదు,’ without treating it as the only meaning.
