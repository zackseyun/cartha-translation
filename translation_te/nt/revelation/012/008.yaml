id: REV.12.8
reference: Revelation 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκ ⸀ἴσχυσεν, οὐδὲ τόπος εὑρέθη ⸀αὐτῶν ἔτι ἐν τῷ οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: te
  text: కాని అతని బలం చాలలేదు[a]; ఇక పరలోకంలో వారికి చోటు దొరకలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు పైచేయి సాధించలేదు.” గ్రీకు క్రియకు బలంగా ఉండడం, సామర్థ్యం కలిగి ఉండడం, లేదా పైచేయి సాధించడం అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: కాని
  rationale: ముందటి వచనంలోని యుద్ధానికి వచ్చిన ప్రతికూల ఫలితాన్ని సూచించే సందర్భానుసారమైన వ్యతిరేక భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οὐκ ἴσχυσεν
  choice: అతని బలం చాలలేదు
  rationale: ἰσχύωలోని బలం లేదా సామర్థ్యం అనే భావాన్ని నిలుపుతూ, యుద్ధ సందర్భంలో సహజంగా ఉంటుంది. ఏకవచన క్రియకు ముందు వచనంలోని ఘటసర్పమే కర్త అని కూడా ఇది సూచిస్తుంది; ‘పైచేయి సాధించలేదు’ అనే భావం సాధ్యమే గాని కొంత ఎక్కువ వ్యాఖ్యానాత్మకం.
- source_word: οὐδὲ
  choice: ఇక … లేదు
  rationale: మొదటి ప్రతికూల వాక్యభాగానికి రెండవ ప్రతికూల ఫలితాన్ని జతచేస్తుంది; ἔτιతో కలిసి తెలుగులో ‘ఇక … లేదు’ సహజంగా ఉంటుంది.
- source_word: τόπος
  choice: చోటు
  rationale: స్థలం లేదా ఉండే అవకాశం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: εὑρέθη
  choice: దొరకలేదు
  rationale: గ్రీకు భూతకాల కర్మణి రూపంలోని ‘కనుగొనబడలేదు’ అనే ఫలితార్థాన్ని సహజమైన తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: αὐτῶν
  choice: వారికి
  rationale: ముందటి వచనంలోని ఘటసర్పం మరియు దాని దూతలను సమూహంగా సూచించే షష్ఠీ విభక్తి భావాన్ని ఈ నిర్మాణంలో తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔτι
  choice: ఇక
  rationale: ప్రతికూల సందర్భంలో ‘ఇకపై కాదు/మరెంతమాత్రమూ కాదు’ అనే కాలపరమైన భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: ఇక్కడ కనిపించే ఆకాశం కాక పరలోక సంబంధమైన లోకాన్ని సూచిస్తున్నందున ‘పరలోకం’ సరైన సందర్భార్థాన్ని ఇస్తుంది.
theological_decisions:
- issue: ἴσχυσεν అనే ఏకవచన క్రియ కర్త
  choice: మొదటి వాక్యభాగం ముందటి వచనంలోని ఏకవచన ఘటసర్పాన్ని సూచిస్తుంది; రెండవ భాగంలోని ‘వారికి’ ఘటసర్పం మరియు దాని దూతలను కలిపి సూచిస్తుంది.
  alternative: రెండు భాగాలనూ బహువచనంగా చేసి ‘వారి బలం చాలలేదు’ అని అనువదించడం.
  rationale: గ్రీకు పాఠంలోని ఏకవచన క్రియను, తరువాత వచ్చే బహువచన సర్వనామంతో కలపకుండా, మూలపాఠంలోని వ్యాకరణ మరియు కథన భేదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం. ‘అతని బలం చాలలేదు’ మూలంలోని బలసామర్థ్య భావాన్ని కాపాడుతుంది; ‘చోటు దొరకలేదు’ కర్మణి ఫలితాన్ని అసహజమైన పదశః రూపం లేకుండా వ్యక్తపరుస్తుంది.
