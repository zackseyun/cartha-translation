  yaml_path: translation/nt/revelation/012/018.yaml
  text: And he stood on the sand of the sea[a].
translation:
  language: te
  text: అతడు సముద్రపు ఇసుకపై నిలబడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “నేను సముద్రపు ఇసుకపై నిలబడ్డాను” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: ముందటి వాక్యంలోని సంఘటనతో కథన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది; ఈ సందర్భంలో καί కేవలం ‘మరియు’ అనే సముచ్చయార్థమే కాక కథన కొనసాగింపును సూచిస్తుంది.
- source_word: ἐστάθη
  choice: అతడు నిలబడ్డాడు
  rationale: ἵστημι యొక్క ప్రథమ భూతకాల, కర్మణి రూపంలో ఉన్నప్పటికీ ఇక్కడ అకర్మకంగా ‘నిలబడ్డాడు’ అనే అర్థం ఇస్తుంది. గ్రీకులో కర్త అంతర్లీనంగా ఉన్నందున, సందర్భంలోని ఘటసర్పాన్ని సూచించే మూడవ పురుష ఏకవచన సర్వనామం తెలుగులో స్పష్టంగా చేర్చబడింది.
- source_word: ἐπὶ
  choice: మీద
  rationale: ద్వితీయా విభక్తితో వచ్చిన ἐπί ఇక్కడ నిలిచిన ప్రదేశాన్ని సూచిస్తుంది; ‘మీద’ సహజంగా ఆ స్థాన సంబంధాన్ని తెలియజేస్తుంది.
- source_word: τὴν ἄμμον
  choice: ఇసుక
  rationale: ἄμμος యొక్క ప్రత్యక్ష అర్థమైన ‘ఇసుక’ను నిలుపుతుంది; ‘తీరం’ అని అనువదిస్తే మూలంలోని పదార్థసంబంధమైన దృశ్యరూపం తగ్గిపోతుంది.
- source_word: τῆς θαλάσσης
  choice: సముద్రపు
  rationale: ‘సముద్రానికి చెందిన ఇసుక’ అనే షష్ఠీ సంబంధాన్ని తెలుగులో సహజమైన ‘సముద్రపు ఇసుక’ నిర్మాణంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కర్త గుర్తింపు మరియు క్రియకు సంబంధించిన పాఠాంతరం
  choice: ప్రధాన పాఠంలో మూడవ పురుష రూపాన్ని అనుసరించి ‘అతడు నిలబడ్డాడు’ అని ఇచ్చాం.
  alternative: ‘నేను సముద్రపు ఇసుక మీద నిలబడ్డాను.’
  rationale: SBLGNTలో ముద్రితమైన ἐστάθη (‘అతడు నిలబడ్డాడు’) పాఠాన్ని ప్రధాన వచనం అనుసరిస్తుంది; సందర్భంలో ఇది ముందటి వచనంలోని ఘటసర్పాన్ని సహజంగా సూచిస్తుంది. అయితే ἐστάθην (‘నేను నిలబడ్డాను’) అనే ముఖ్యమైన పాఠాంతరాన్ని వ్యాఖ్యానించి పరిష్కరించకుండా పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘సముద్రపు ఇసుక’ అనే సహజమైన తెలుగు నిర్మాణం మూలంలోని స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
