id: REV.12.14
reference: Revelation 12:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: te
  text: ఆ స్త్రీకి ఆ మహా గద్ద యొక్క రెండు రెక్కలు ఇవ్వబడ్డాయి, ఆమె అరణ్యంలో ఉన్న తన స్థలానికి ఎగిరిపోవడానికి; అక్కడ ఆమె సర్పం సమక్షం నుండి దూరంగా ఒక కాలం, కాలాలు, అర్ధకాలం పాటు పోషించబడుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: ఆ మహా గద్ద యొక్క రెండు రెక్కలు
  rationale: నిర్దిష్ట ఉపపదాలను, ‘రెండు’ అనే సంఖ్యను, గ్రీకు పదబంధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: ἔρημον
  choice: అరణ్యం
  rationale: జనావాసం లేని వెలవెల ప్రదేశం అనే భావాన్ని ఇచ్చే, ప్రకటన గ్రంథ శైలికి తగిన సాధారణ తెలుగు పదం.
- source_word: ὅπου τρέφεται ἐκεῖ
  choice: అక్కడ ఆమె … పోషించబడుతుంది
  rationale: ‘ఎక్కడ … అక్కడ’ అనే గ్రీకు పునరుక్తిని భారంగా కాకుండా ‘అక్కడ’తో వ్యక్తం చేస్తూ, వర్తమాన నిష్క్రియార్థాన్ని నిలిపింది.
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: ఒక కాలం, కాలాలు, అర్ధకాలం
  rationale: ప్రతీకాత్మక కాలవ్యవధి యొక్క ఉద్దేశపూర్వక అనిశ్చితిని సంఖ్యలుగా వివరించకుండా యథాతథంగా నిలిపింది.
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: సర్పం ఎదుటికి దూరంగా
  rationale: ‘ముఖం/సన్నిధి నుండి’ అనే సెమిటిక్ భావాన్ని సహజ తెలుగులో ‘ఎదుటికి దూరంగా’గా అందించింది; కేవలం చూపుకు దూరంగా అని పరిమితం చేయలేదు.
theological_decisions:
- issue: ప్రతీకాత్మక కాలవ్యవధి
  choice: ఒక కాలం, కాలాలు, అర్ధకాలం
  alternative: మూడున్నర సంవత్సరాలు
  rationale: మూలంలోని ప్రతీకాత్మక పదబంధాన్ని నిర్దిష్ట కాలగణనగా వ్యాఖ్యానించకుండా దాని ఉద్వేగం, అనిశ్చితిని కాపాడింది.
- issue: మహా గద్ద యొక్క గుర్తింపు
  choice: వచనంలో ఉన్న ప్రతీకను వివరణ లేకుండా ఉంచడం
  alternative: దీనిని దేవుని రక్షణగా లేదా ఏదైనా నిర్దిష్ట శక్తిగా స్పష్టీకరించడం
  rationale: వచనం గద్దను ఎవరిగా లేదా దేనిగా గుర్తించదు; అనువాదం వ్యాఖ్యానాన్ని దిగుమతి చేయకూడదు.
- issue: స్త్రీ పోషణలో కర్త
  choice: పోషించబడుతుంది
  alternative: దేవుడు ఆమెను పోషిస్తాడు
  rationale: గ్రీకు నిష్క్రియ రూపం కర్తను స్పష్టంగా పేర్కొనదు; దేవునే కర్తగా చేర్చడం సాధ్యమైన భావమైనా మూలానికి మించిన స్పష్టీకరణ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. దీర్ఘమైన గ్రీకు వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి సహజ పఠనాన్ని సాధించాం; ప్రతీకాత్మక పదజాలాన్ని వ్యాఖ్యానాత్మకంగా విప్పలేదు.
