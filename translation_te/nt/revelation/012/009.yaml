revisions:
- from: ఆ మహా ఘటసర్పం పడద్రోయబడింది—అంటే, ఆ పురాతన సర్పం[b], అపవాది అనీ సాతాను అనీ పిలువబడేవాడు, భూలోకమంతటినీ[a] మోసగించేవాడు. అతడు భూమిమీదికి పడద్రోయబడ్డాడు; అతని దూతలు కూడా అతనితోపాటు పడద్రోయబడ్డారు.
  to: ఆ మహా డ్రాగన్—అనగా, ఆ పురాతన సర్పం, అపవాది అని సాతాను అని పిలువబడేవాడు, ప్రపంచమంతటినీ[a] మోసగించేవాడు—భూమికి విసిరివేయబడ్డాడు. అతని దూతలు కూడా అతనితోపాటు విసిరివేయబడ్డారు.
  rationale: The revision uses natural modern Telugu while preserving the Greek’s appositional structure and repeated verbal emphasis. “డ్రాగన్” is retained as a distinct term from “సర్పం,” avoiding the loss of the δράκων/ὄφις distinction. “విసిరివేయబడ్డాడు/విసిరివేయబడ్డారు” communicates the forceful downward expulsion indicated by the context and keeps all three occurrences parallel. The cross-reference footnote remains anchored to “పురాతన సర్పం”; its marker should be placed there in typesetting, while marker a remains on “ప్రపంచమంతటినీ.”
