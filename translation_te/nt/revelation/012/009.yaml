id: REV.12.9
reference: Revelation 12:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: te
  text: ఆ మహా డ్రాగన్—అనగా, ఆ పురాతన సర్పం, అపవాది అని సాతాను అని పిలువబడేవాడు, ప్రపంచమంతటినీ[a] మోసగించేవాడు—భూమికి విసిరివేయబడ్డాడు. అతని దూతలు కూడా అతనితోపాటు విసిరివేయబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రపంచమంతటినీ తప్పుదారి పట్టించేవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: పడద్రోయబడింది / పడద్రోయబడ్డారు
  rationale: దిగువకు బలవంతంగా విసిరివేయబడిన భావాన్ని తెలియజేస్తూ, మూలంలోని క్రియాపునరుక్తిని నిలుపుతుంది.
- source_word: δράκων ὁ μέγας
  choice: ఆ మహా ఘటసర్పం
  rationale: ప్రకటన గ్రంథంలోని భయంకరమైన అపోకలిప్టిక్ జీవి భావాన్ని నిలుపుతూ, తరువాత వచ్చే సాధారణ ‘సర్పం’తో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: ఆ పురాతన సర్పం
  rationale: ‘సర్పం’ ఆదికాండము 3లోని ప్రతిరూపాన్ని సహజంగా గుర్తుచేస్తుంది; ‘పురాతన’ అనేది ἀρχαῖος యొక్క పాతకాలానికి చెందిన భావాన్ని అతివ్యాఖ్యానం లేకుండా ఇస్తుంది.
- source_word: ὁ καλούμενος
  choice: పిలువబడేవాడు
  rationale: ముందున్న ఘటసర్పాన్ని తరువాతి రెండు పేర్లతో గుర్తించే సంబంధాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: Διάβολος
  choice: అపవాది
  rationale: ఈ పదం ఇక్కడ గుర్తింపునిచ్చే బిరుదుగా ఉన్నప్పటికీ, దాని ‘నిందించేవాడు/అపవాది’ అనే అర్థాన్ని సహజమైన స్థిర తెలుగు బిరుదుతో అందిస్తుంది.
- source_word: Σατανᾶς
  choice: సాతాను
  rationale: వ్యక్తినామం/బిరుదును తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో ఇస్తుంది.
- source_word: ὁ πλανῶν
  choice: మోసగించేవాడు
  rationale: πλανάωలోని మోసపరచడం లేదా తప్పుదారి పట్టించడం అనే భావాల్లో, వాక్యంలో సంక్షిప్తంగా సహజంగా సరిపడే రూపం.
- source_word: τὴν οἰκουμένην ὅλην
  choice: భూలోకమంతటినీ
  rationale: నివాసిత ప్రపంచమంతటినీ సూచించే విశ్వవ్యాప్త పరిధిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ సూక్ష్మతను పాదసూచికలో నిలుపుతుంది.
- source_word: εἰς τὴν γῆν
  choice: భూమిమీదికి
  rationale: పరలోక ప్రాంతం నుండి భూమికి పడద్రోయబడిన సందర్భోచిత వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: అతని దూతలు
  rationale: అపోకలిప్టిక్ సందర్భంలో ఘటసర్పంతో కలిసిన అతీంద్రియ దూతలను సూచించే స్థిరమైన బైబిలు పదప్రయోగం.
- source_word: μετ’ αὐτοῦ
  choice: అతనితోపాటు
  rationale: వారు అతనితో కలిసి పడద్రోయబడిన సహవర్తిత్వాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Διάβολος మరియు Σατανᾶςలను సమానాధికరణంలో చూపడం
  choice: అపవాది అనీ సాతాను అనీ పిలువబడేవాడు
  alternative: దయ్యమనీ సాతాననీ పిలువబడేవాడు
  rationale: గ్రీకు వాక్యం ఘటసర్పాన్ని ఈ రెండు గుర్తింపులతో పేర్కొంటుంది. ‘అపవాది’ అనే అనువాద బిరుదును, ‘సాతాను’ అనే లిప్యంతరీకృత పేరును కలిపి ఉంచడం మూలంలోని గుర్తింపును అదనపు సిద్ధాంత వివరణ లేకుండా కాపాడుతుంది.
- issue: οἰκουμένη యొక్క పరిధి
  choice: భూలోకమంతటినీ
  alternative: నివాసిత ప్రపంచమంతటినీ
  rationale: ప్రకటన గ్రంథపు విశ్వవ్యాప్త సందర్భానికి తగిన విస్తృత పరిధిని ప్రధాన పాఠ్యంలో సహజంగా ఇస్తూ, ‘నివాసిత ప్రపంచం’ అనే మరింత పదశః అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని మూడు సార్ల పడద్రోయబడే క్రియను పునరావృతం చేశాం. పాదసూచిక గుర్తులను వాటి విషయానికి సంబంధించిన పదబంధాల దగ్గర ఉంచాం.
