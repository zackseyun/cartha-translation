lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: ఆమె గర్భవతిగా ఉంది
  rationale: అక్షరార్థంగా ‘గర్భంలో కలిగి ఉండడం’ అనే ఈ గ్రీకు నుడికారం గర్భవతిగా ఉండడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘గర్భవతిగా ఉంది’ సహజంగానూ స్పష్టంగానూ ఉంటుంది.
- source_word: κράζει
  choice: కేకలు వేస్తోంది
  rationale: వర్తమానకాల క్రియ దర్శనంలోని సజీవమైన తక్షణత్వాన్ని వ్యక్తం చేస్తుంది. ‘కేకలు వేస్తోంది’ తీవ్రతను, కొనసాగుతున్న చర్యను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὠδίνουσα
  choice: ప్రసవ వేదనలు పడుతూ
  rationale: ఈ వర్తమాన కృదంతం ప్రసవ సమయంలో కలిగే నొప్పులను స్పష్టంగా సూచిస్తుంది. ‘ప్రసవ వేదనలు పడుతూ’ అనే రూపం నొప్పి చిత్రణను కాపాడుతుంది.
- source_word: βασανιζομένη
  choice: యాతన అనుభవిస్తూ
  rationale: ఈ కర్మణి కృదంతం తీవ్రమైన బాధ లేదా యాతనను తెలియజేస్తుంది. ‘యాతన అనుభవిస్తూ’ గ్రీకు పదంలోని తీవ్రతను కాపాడుతూ ప్రసవ సందర్భంలో సహజంగా ఉంటుంది.
- source_word: τεκεῖν
  choice: ప్రసవించడానికి
  rationale: ఈ క్రియారూపం బిడ్డను కనడాన్ని సూచిస్తుంది. ‘ప్రసవించడానికి’ సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: καὶ ... καὶ
  choice: ఆమె ... ఆమె ... పడుతూ ... అనుభవిస్తూ
  rationale: గ్రీకులోని వరుస అనుసంధానాల వల్ల ఏర్పడే సంచిత వర్ణనను తెలుగులో పునరుక్త కర్తతోను సమాంతర కృదంతాలతోను సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: దర్శనంలో స్త్రీ అనుభవిస్తున్న బాధ యొక్క తీవ్రత, స్వభావం
  choice: βασανιζομένη పదాన్ని బలంగా ‘యాతన అనుభవిస్తూ’ అని అనువదించి, స్త్రీ ఎవరో వ్యాఖ్యానించకుండా వదిలాం.
  alternative: ‘తీవ్ర బాధలో ఉండి’ లేదా ‘వేదన చెందుతూ’ అని కొంత మృదువుగా అనువదించడం.
  rationale: వచనం స్త్రీ బాధను తీవ్రంగా చిత్రిస్తుంది; అయితే ఆమె ప్రతీకాత్మక గుర్తింపును లేదా ఆ బాధకు సంబంధించిన వేదాంతార్థాన్ని ఈ వచనంలోనే వివరించదు. కాబట్టి గ్రీకు పదబలాన్ని నిలుపుతూ ఏ ప్రత్యేక వ్యాఖ్యానాన్నీ అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, అయితే దర్శనంలోని గంభీరతను నిలిపే శైలిని ఉపయోగించాం. గ్రీకు వర్తమానకాల సజీవత్వాన్ని ‘వేస్తోంది’తో, ప్రసవబాధ తీవ్రతను ‘వేదనలు’ మరియు ‘యాతన’తో కాపాడాం.
