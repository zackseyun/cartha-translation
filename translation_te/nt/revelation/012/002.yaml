  text: And she was pregnant[a], and she cries out[c][b], suffering birth pains and being tormented to give birth.
translation:
  language: te
  text: ఆమె గర్భవతిగా ఉంది[a]. ప్రసవ వేదనలతో బాధపడుతూ[b], ప్రసవించడానికి యాతన అనుభవిస్తూ[c] కేకలు వేస్తోంది.
  philosophy: optimal-equivalence
