id: REV.12.16
reference: Revelation 12:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: te
  text: భూమి ఆ స్త్రీకి సహాయం చేసింది.[a] భూమి తన నోరు తెరిచి, మహాసర్పం తన నోటినుండి విసిరిన నదిని[b] మింగివేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేల ఆ స్త్రీకి సహాయం చేసింది.” గ్రీకు పదం γῆకు “భూమి,” “నేల,” లేదా “దేశం” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మహాసర్పం తన నోటినుండి బయటకు పంపిన నదిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: సహాయం చేసింది
  rationale: βοηθέω అనే క్రియకు నేరమైన, సహజమైన ఆధునిక తెలుగు సమానార్థం; భూమి స్త్రీకి తోడ్పడిన కథన చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡ γῆ
  choice: భూమి
  rationale: γῆకు ‘భూమి,’ ‘నేల,’ ‘దేశం’ అనే అర్థాలు ఉండవచ్చు. ఈ ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త అపోకలిప్టిక్ దృశ్యానికి ‘భూమి’ బాగా సరిపోతుంది; పదంలోని భావవిస్తృతిని పాదసూచికలో ఉంచాం.
- source_word: τῇ γυναικί
  choice: ఆ స్త్రీకి
  rationale: నిర్దిష్టంగా ముందే ప్రస్తావించబడిన ప్రతీకాత్మక స్త్రీని సూచించడానికి ఆర్టికల్ భావాన్ని ‘ఆ’తో సహజంగా వ్యక్తం చేసింది.
- source_word: ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς
  choice: భూమి తన నోరు తెరిచి
  rationale: భూమిని వ్యక్తీకరించే మూలభాషా చిత్రణను వ్యాఖ్యానించకుండా యథాతథంగా నిలుపుతుంది. ‘తన’ వాడకం తెలుగులో సహజంగా ఉండి, నోరు భూమిదేనని స్పష్టం చేస్తుంది.
- source_word: κατέπιεν
  choice: మింగివేసింది
  rationale: καταπίνωలోని పూర్తిగా మింగే చర్యను సహజమైన తెలుగు క్రియతో వ్యక్తం చేస్తుంది; ‘వేసింది’ చర్య సంపూర్ణతను సూచిస్తుంది.
- source_word: τὸν ποταμόν
  choice: నదిని
  rationale: ποταμόςకు ప్రాథమిక సమానార్థం ‘నది.’ సందర్భాన్ని బట్టి ‘వరద’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలపద చిత్రాన్ని నిలుపుతుంది.
- source_word: ὃν ἔβαλεν
  choice: విసిరిన
  rationale: βάλλωలోని ‘విసురు/పడవేయు’ అనే బలమైన చర్యను నిలుపుతుంది. నోటినుండి నదిని ‘విసరడం’ అనే అసాధారణ అపోకలిప్టిక్ చిత్రాన్ని మృదువుగా మార్చలేదు; మరొక సహజ అవకాశాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ὁ δράκων
  choice: మహాసర్పం
  rationale: δράκων సూచించే భయంకరమైన అపోకలిప్టిక్ సర్పాకార జీవికి స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం. ‘ఘటసర్పం’ కంటే సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: తన నోటినుండి
  rationale: మహాసర్పం నోటిలోనుండే నది వచ్చిందనే మూలంలోని సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అపోకలిప్టిక్ చిత్రణలో భూమి వ్యక్తీకరణ
  choice: భూమి సహాయం చేయడం, నోరు తెరవడం అనే వ్యక్తీకృత చర్యలను అనువాదంలో అలాగే ఉంచడం
  alternative: భూమిని ఒక ప్రజాసమూహం, ప్రదేశం లేదా దేవుని రక్షణ సాధనంగా వివరణాత్మకంగా అనువదించడం
  rationale: మూలవాక్యం భూమిని చర్య చేసే పాత్రగా చిత్రిస్తుంది; దాని ప్రతీకాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా ఆ దృశ్యంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: మహాసర్పం నోటినుండి వచ్చిన నది స్వరూపం
  choice: ποταμόςను ‘నది’గానే అనువదించడం
  alternative: సందర్భానుసారంగా ‘వరద’ లేదా ‘నీటి ప్రవాహం’గా అనువదించడం
  rationale: ‘వరద’ సందర్భానికి సాధ్యమైన అర్థవ్యాఖ్య అయినా, మూలపదం నేరుగా ‘నది’ని సూచిస్తుంది. అందువల్ల ప్రతీకను ముందుగానే వివరణాత్మకంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని రెండు καί సంధుల వల్ల ఏర్పడే వరుస కథనాన్ని తెలుగులో రెండు వాక్యాలుగా సహజీకరించినా, భూమి అనే కర్త పునరుక్తిని మరియు దృశ్యంలోని వ్యక్తీకరణను నిలిపాం. పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉన్నాయి.
