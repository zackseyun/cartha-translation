revisions:
- from: ఆ మహాసర్పం ఆ స్త్రీ మీద తీవ్రంగా కోపగించుకొని, ఆమె సంతానంలో మిగిలినవారితో—అంటే దేవుని ఆజ్ఞలను పాటిస్తూ, యేసు సాక్ష్యాన్ని[a] కలిగివున్నవారితో—యుద్ధం చేయడానికి వెళ్లిపోయింది.
  to: ఆ డ్రాగన్ ఆ స్త్రీపై తీవ్రంగా కోపగించుకొని, దేవుని ఆజ్ఞలను పాటిస్తూ యేసు సాక్ష్యాన్ని[a] కలిగివున్న ఆమె సంతానంలో మిగిలినవారితో యుద్ధం చేయడానికి వెళ్లిపోయింది.
  rationale: The revision removes the unsupported “great” component from the rendering of δράκων, preserves the dragon imagery with the standard modern loanword, and presents the participial description of the offspring as a direct restrictive phrase. The ambiguous genitive in “యేసు సాక్ష్యం” and its footnote are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:58:20Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the dragon's anger, departure, intent to make war, the woman's remaining offspring, and the two defining participial clauses. However, “మహాసర్పం” adds the sense “great,” which is not present in δράκων in this verse, even though the figure is identified as the great dragon elsewhere in the chapter. “డ్రాగన్” more exactly preserves the apocalyptic image without importing that modifier.
  naturalness: The overall Telugu is clear and modern. Recasting the defining description without the explanatory “అంటే” makes its restrictive function more direct and avoids an added explanatory tone. “డ్రాగన్” is an established modern term for this apocalyptic creature and is clearer than treating it simply as a serpent.
  terminology: “దేవుని ఆజ్ఞలు” and “యేసు సాక్ష్యం” are suitable. The latter appropriately retains the Greek genitive ambiguity, and the footnote accurately presents the principal alternatives.
  issues:
  - severity: medium
    issue: “మహాసర్పం” renders δράκων.
    rationale: The Greek at 12:17 says “the dragon,” not “the great dragon.” The modifier “మహా-” reflects nearby contextual identification but is not in this verse's source text. Use “డ్రాగన్” to preserve the specific apocalyptic image and avoid adding “great.”
  - severity: low
    issue: The phrase introduced by “అంటే” is presented as an explicit explanation.
    rationale: The Greek uses article-plus-participles to identify the remaining offspring. Telugu can express this directly as a defining description, without adding the explanatory connector “అంటే.”
  revised_text: ఆ డ్రాగన్ ఆ స్త్రీపై తీవ్రంగా కోపగించుకొని, దేవుని ఆజ్ఞలను పాటిస్తూ యేసు సాక్ష్యాన్ని[a] కలిగివున్న ఆమె సంతానంలో మిగిలినవారితో యుద్ధం చేయడానికి వెళ్లిపోయింది.
  revised_footnotes:
  - marker: a
    text: “యేసును గురించిన సాక్ష్యం” అని కూడా అనువదించవచ్చు; లేదా “యేసు ఇచ్చిన సాక్ష్యం.” గ్రీకులోని షష్ఠీ సంబంధాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  revision_rationale: The revision removes the unsupported “great” component from the rendering of δράκων, preserves the dragon imagery with the standard modern loanword, and presents the participial description of the offspring as a direct restrictive phrase. The ambiguous genitive in “యేసు సాక్ష్యం” and its footnote are retained.
