id: REV.12.17
reference: Revelation 12:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: te
  text: ఆ డ్రాగన్ ఆ స్త్రీపై తీవ్రంగా కోపగించుకొని, దేవుని ఆజ్ఞలను పాటిస్తూ యేసు సాక్ష్యాన్ని[a] కలిగివున్న ఆమె సంతానంలో మిగిలినవారితో యుద్ధం చేయడానికి వెళ్లిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యేసును గురించిన సాక్ష్యం” అని కూడా అనువదించవచ్చు; లేదా “యేసు ఇచ్చిన సాక్ష్యం.” గ్రీకులోని షష్ఠీ సంబంధాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: తీవ్రంగా కోపగించుకొని
  rationale: కోపం కలిగిన స్థితిని మాత్రమే కాక, శత్రుత్వంతో కూడిన తీవ్ర ప్రతిచర్యను సూచించే క్రియారూప భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δράκων
  choice: మహాసర్పం
  rationale: ప్రకటన గ్రంథంలోని ప్రతీకాత్మకమైన విపరీత సర్ప రూపాన్ని నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే పదం.
- source_word: γυναικί
  choice: ఆ స్త్రీ మీద
  rationale: ఇప్పటికే పరిచయమైన నిర్దిష్ట స్త్రీని సూచించే గ్రీకు నిర్దేశక పదాన్ని ‘ఆ’ ద్వారా వ్యక్తం చేస్తుంది; ἐπί ఇక్కడ కోపం ఎవరిమీద ఉందో సూచిస్తుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లిపోయింది
  rationale: కథనంలోని అక్కడి నుంచి వెళ్లిన కదలికను అదనపు వివరణ లేకుండా సహజంగా తెలియజేస్తుంది.
- source_word: ποιῆσαι πόλεμον
  choice: యుద్ధం చేయడానికి
  rationale: గ్రీకు నుడికారంలోని ఉద్దేశార్థాన్ని తెలుగులో స్పష్టమైన, సహజమైన రూపంలో అందిస్తుంది.
- source_word: μετὰ τῶν λοιπῶν
  choice: మిగిలినవారితో
  rationale: μετά + షష్ఠీ విభక్తి యొక్క ‘తో’ భావాన్ని నిలుపుతుంది; ‘యుద్ధం చేయడం’ అనే సందర్భమే ప్రతికూల సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: τοῦ σπέρματος αὐτῆς
  choice: ఆమె సంతానంలో
  rationale: σπέρμα యొక్క వంశీయ లేదా సంతాన భావాన్ని ‘విత్తనం’ అనే అసహజ అక్షరార్థం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: τηρούντων
  choice: పాటిస్తూ
  rationale: ఆజ్ఞలను విశ్వాసపూర్వకంగా ఆచరించడం అనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది.
- source_word: τὰς ἐντολὰς τοῦ θεοῦ
  choice: దేవుని ఆజ్ఞలను
  rationale: మూలంలోని నిర్దిష్టమైన దైవ ఆదేశాల భావాన్ని సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది.
- source_word: ἐχόντων
  choice: కలిగివున్నవారితో
  rationale: ἔχω యొక్క ప్రాథమిక ‘కలిగియుండడం’ భావానికి దగ్గరగా ఉండి, సాక్ష్యంతో వారి స్థిరమైన సంబంధాన్ని తెలియజేస్తుంది.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: యేసు సాక్ష్యాన్ని
  rationale: Ἰησοῦ అనే షష్ఠీ సంబంధం ‘యేసును గురించిన సాక్ష్యం’ లేదా ‘యేసు ఇచ్చిన సాక్ష్యం’ అనే రెండింటిలో ఏదో ఒకదానిగా తేల్చకుండా తెలుగులోనూ సాధ్యమైనంతవరకు అస్పష్టతను నిలుపుతుంది.
theological_decisions:
- issue: τὴν μαρτυρίαν Ἰησοῦ లోని షష్ఠీ సంబంధం
  choice: యేసు సాక్ష్యం
  alternative: యేసును గురించిన సాక్ష్యం; లేదా యేసు ఇచ్చిన సాక్ష్యం
  rationale: గ్రీకు నిర్మాణం విషయార్థక షష్ఠీగా గానీ కర్తృార్థక షష్ఠీగా గానీ అర్థం కావచ్చు. ప్రధాన పాఠంలో దానిని నిర్ణయించకుండా ఉంచి, ప్రధాన అవకాశాలను పాదసూచికలో తెలియజేయడం మూలంలోని నిజమైన వ్యాఖ్యాన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రకటన గ్రంథపు గంభీరమైన ప్రతీకాత్మక శైలిని నిలుపుతూ అనువదించబడింది. ‘అంటే’ అనే వివరణాత్మక అనుసంధానం గ్రీకులోని సంబంధవాచక వివరణను తెలుగులో స్పష్టం చేస్తుంది; డాష్‌లు ఆ అనుబంధ వివరణను వాక్య ప్రధాన ప్రవాహం నుంచి గుర్తించడానికి ఉపయోగించబడ్డాయి.
