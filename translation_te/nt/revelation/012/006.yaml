  rationale: 'The revision places the purpose clause directly before “దేవుడు సిద్ధం చేసిన ఒక స్థలం,” yielding an idiomatic Telugu construction: God prepared a place for the purpose that unspecified persons would nourish her there. It preserves the Greek’s two locative references through “అక్కడ” in the noun clause and the implied location in the purpose construction, while retaining the active, indefinite plural subject. The footnote anchor is moved to the end of the complete sentence, where it unambiguously marks the relevant purposive clause.'
