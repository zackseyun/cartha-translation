id: REV.12.6
reference: Revelation 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: te
  text: ఆ స్త్రీ అరణ్యంలోకి పారిపోయింది; అక్కడ వారు ఆమెను వెయ్యి రెండువందల అరవై రోజులపాటు పోషించేలా దేవుడు సిద్ధం చేసిన ఒక స్థలం ఆమెకు ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడ ఆమె వెయ్యి రెండువందల అరవై రోజులపాటు పోషించబడేలా.” గ్రీకులో కర్తను పేర్కొనని మూడవ పురుష బహువచన క్రియ ఉంది; అక్షరార్థంగా, “అక్కడ వారు ఆమెను పోషించేలా.”
    reason: మూలపాఠంలోని పేర్కొనబడని బహువచన కర్తను మరియు సహజమైన నిష్క్రియాత్మక ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ἔφυγεν
  choice: పారిపోయింది
  rationale: φεύγω యొక్క భూతకాల రూపం ప్రమాదం నుంచి వెళ్లిపోవడం లేదా తప్పించుకోవడం అనే భావాన్ని ఇస్తుంది. ‘పారిపోయింది’ ఆ చర్యలోని అత్యవసరతను సహజంగా తెలియజేస్తుంది.
- source_word: ἔρημον
  choice: అరణ్యం
  rationale: ἔρημος జనసంచారం లేని నిర్జన ప్రదేశాన్ని సూచిస్తుంది; ‘అరణ్యం’ ఇసుక ఎడారిని మాత్రమే సూచించకుండా దాని విస్తృత బైబిలు భావాన్ని నిలుపుతుంది.
- source_word: τόπον
  choice: ఒక స్థలం
  rationale: τόπος అనే సాధారణ పదానికి సహజమైన సమానార్థకం; గ్రీకులోని అనిర్దిష్ట భావాన్ని ‘ఒక’ నిలుపుతుంది.
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: దేవుడు సిద్ధం చేసిన
  rationale: సంపూర్ణ నిష్క్రియాత్మక కృదంతం ఆ స్థలం ముందుగానే సిద్ధంగా చేయబడిందని సూచిస్తుంది; వ్యక్తిగత కర్తతో ἀπό ఇక్కడ దేవుణ్ణి కార్యనిర్వాహకునిగా సూచిస్తుంది.
- source_word: ἵνα
  choice: పోషించేలా
  rationale: తెలుగులో ‘-ేలా’ నిర్మాణం ἵνα తెలిపే ఉద్దేశం లేదా ఉద్దేశిత ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τρέφωσιν αὐτὴν
  choice: వారు ఆమెను … పోషించేలా
  rationale: τρέφω ఆహారం ఇవ్వడం మాత్రమే కాక నిరంతరం సంరక్షించి పోషించడాన్ని కూడా సూచిస్తుంది. స్పష్టంగా పేర్కొనని మూడవ పురుష బహువచన కర్తను ‘వారు’గా ఉంచడం ద్వారా మూలపాఠంలోని అనిర్దిష్టత నిలుస్తుంది.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: వెయ్యి రెండువందల అరవై రోజులపాటు
  rationale: కాలవ్యాప్తిని తెలుగులో ‘రోజులపాటు’ సహజంగా తెలియజేస్తుంది; సంఖ్యను పదాల్లో ఇవ్వడం బైబిలు గద్యశైలికి సరిపోతుంది.
- source_word: ἔχει ἐκεῖ
  choice: అక్కడ … ఒక స్థలం ఆమెకు ఉంది
  rationale: ἔχει యొక్క కలిగియుండే భావాన్ని ‘ఆమెకు ఉంది’గా, ἐκεῖ యొక్క స్థల ఉద్ఘాటనను ‘అక్కడ’గా నిలిపింది; తెలుగులో అనవసర పునరుక్తి లేకుండా రెండింటినీ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τρέφωσιν యొక్క పేర్కొనబడని కర్త
  choice: ‘వారు ఆమెను … పోషించేలా’ అని అనిర్దిష్ట బహువచన కర్తను నిలుపడం
  alternative: ‘ఆమె అక్కడ … పోషించబడేలా’
  rationale: గ్రీకు పాఠంలో స్పష్టమైన కర్త లేకుండా మూడవ పురుష బహువచన క్రియ ఉంది. కర్తగా దేవుణ్ణి చేర్చడం పాఠానికి మించిన వ్యాఖ్యానం అవుతుంది; నిష్క్రియాత్మకంగా మార్చడం సహజమైన ప్రత్యామ్నాయం అయినప్పటికీ మూలంలోని అనిర్దిష్ట సకర్మక నిర్మాణాన్ని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన గద్యాన్ని ఉపయోగించాం. ‘అరణ్యం’, ‘పోషించేలా’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా బైబిలు సందర్భపు గంభీరతను నిలుపుతాయి. మూలంలోని అనిర్దిష్ట బహువచన కర్తను వ్యాఖ్యానాత్మకంగా నిర్దిష్టం చేయలేదు.
