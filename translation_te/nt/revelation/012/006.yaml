revisions:
- from: ఆ స్త్రీ అరణ్యంలోకి పారిపోయింది. అక్కడ వారు ఆమెను వెయ్యి రెండువందల అరవై రోజులపాటు పోషించేలా[a], దేవుడు సిద్ధం చేసిన ఒక స్థలం ఆమెకు ఉంది.
