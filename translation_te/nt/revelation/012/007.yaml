id: REV.12.7
reference: Revelation 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: te
  text: పరలోకంలో యుద్ధం చెలరేగింది:[a] మిఖాయేలు మరియు అతని దూతలు ఆ ఘటసర్పంతో యుద్ధం చేశారు.[b] ఆ ఘటసర్పం మరియు దాని దూతలు యుద్ధం చేశారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకంలో యుద్ధం జరిగింది’ లేదా ‘పరలోకంలో యుద్ధం మొదలైంది.’
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘మిఖాయేలు మరియు అతని దూతలు ఆ ఘటసర్పంతో యుద్ధం చేయడానికి’; గ్రీకులో చర్యను లేదా ఉద్దేశాన్ని తెలిపే నిర్దిష్ట ఉపపదంతో కూడిన క్రియానామ నిర్మాణం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా సరళంగా, ‘ఆ ఘటసర్పం యుద్ధం చేసింది, దాని దూతలూ [యుద్ధం చేశారు].’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: యుద్ధం చెలరేగింది
  rationale: γίνομαι + నామవాచకం ఒక సంఘటన ఏర్పడడాన్ని సూచిస్తుంది. ‘చెలరేగింది’ అనే సహజమైన ఆధునిక తెలుగు ప్రయోగం యుద్ధం ఆరంభమైన భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: ఇక్కడ οὐρανός కనిపించే ఆకాశం కంటే పరలోక ప్రాంతాన్ని సూచిస్తుంది.
- source_word: Μιχαὴλ
  choice: మిఖాయేలు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: అతని దూతలు
  rationale: మిఖాయేలుకు సంబంధించిన దూతలనే నేరుగా, సహజమైన స్వామ్య నిర్మాణంతో తెలియజేస్తుంది.
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: ఆ ఘటసర్పంతో యుద్ధం చేశారు
  rationale: కర్తను పేర్కొన్న తరువాత వచ్చిన articular infinitive యొక్క సంక్షిప్త గ్రీకు నిర్మాణాన్ని సహజ తెలుగులో స్పష్టమైన క్రియగా ఇచ్చాం. ‘తో’ ఇక్కడ పరస్పర విరోధ యుద్ధాన్ని సూచిస్తుంది.
- source_word: δράκοντος / δράκων
  choice: ఘటసర్పం
  rationale: ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ మహాసర్ప రూపకాన్ని నిలిపే, తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన పదం.
- source_word: ἐπολέμησεν
  choice: యుద్ధం చేశారు
  rationale: గ్రీకు పాఠం కేవలం ‘యుద్ధం చేసింది’ అని చెబుతుంది; ప్రతిదాడి అనే భావాన్ని అనవసరంగా చేర్చకుండా సమాంతర నిర్మాణాన్ని నిలిపాం.
- source_word: καὶ οἱ ἄγγελοι αὐτοῦ
  choice: దాని దూతలు కూడా
  rationale: ఘటసర్పం మరియు దాని పక్షాన ఉన్న దూతలను కలిపి కర్తగా చూపుతూ, మిఖాయేలు పక్షంతో ఉన్న సమాంతరతను నిలుపుతుంది.
theological_decisions:
- issue: మిఖాయేలు గుర్తింపు మరియు హోదా
  choice: ‘మిఖాయేలు’ అనే వ్యక్తినామాన్ని మాత్రమే ఇచ్చి వ్యాఖ్యానాత్మక హోదా చేర్చలేదు.
  alternative: ప్రధాన దూతగా పేర్కొనడం లేదా క్రీస్తుతో గుర్తించడం
  rationale: ఈ వచనం మిఖాయేలును పేరుతో మాత్రమే పేర్కొంటుంది; అతని హోదాను చెప్పదు, క్రీస్తుతోనూ గుర్తించదు. అందువల్ల పాఠంలోని theological tension ను అలాగే నిలిపాం.
- issue: ఘటసర్పం చేసిన యుద్ధం ప్రతిదాడా అనే అంశం
  choice: ‘కూడా యుద్ధం చేశారు’
  alternative: ‘ఎదురు పోరాడారు’ లేదా ‘తిరిగి యుద్ధం చేశారు’
  rationale: సందర్భంలో ప్రతిస్పందన భావం సాధ్యమైనప్పటికీ, ἐπολέμησεν స్వయంగా ‘తిరిగి’ అనే అంశాన్ని వ్యక్తం చేయదు. మూలంలోని అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘అప్పుడు’ వాక్యారంభంలోని καί యొక్క కథన కొనసాగింపును తెలియజేస్తుంది. ఘటసర్పానికి ‘దాని’ అని వాడటం తెలుగులో సహజమైన నిర్జీవ/జంతు సూచన; మిఖాయేలుకు ‘అతని’ వాడి వ్యక్తిగత సూచనను నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
