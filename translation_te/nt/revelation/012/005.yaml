id: REV.12.5
reference: Revelation 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: te
  text: ఆమె ఒక కుమారుణ్ణి—మగబిడ్డను—కనింది. అతడు ఇనుప దండంతో సమస్త జనాంగాలను కాపరిలా నడిపించబోతున్నాడు[a]. ఆమె బిడ్డ హఠాత్తుగా దేవుని దగ్గరకు, ఆయన సింహాసనం దగ్గరకు ఎత్తుకొని పోబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇనుప దండంతో సమస్త జనాంగాలను పరిపాలించబోతున్నాడు.” గ్రీకు క్రియకు అక్షరార్థంగా ‘కాపరిలా నడిపించడం’ అనే భావం ఉంది; అయితే ఇక్కడ అది కీర్తన 2ను ప్రతిధ్వనిస్తూ రాజాధికారాన్ని కూడా సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: కనింది
  rationale: τίκτω సూచించే ప్రసవాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: υἱόν, ἄρσεν
  choice: ఒక కుమారుణ్ణి—మగబిడ్డను—
  rationale: గ్రీకులోని రెండు పదాల ఉద్దేశపూర్వక పునరుక్తినీ, రెండవ పదం మొదటిదాన్ని వివరించే భావాన్నీ నిలుపుతుంది.
- source_word: μέλλει ποιμαίνειν
  choice: కాపరిగా నడిపించబోతున్నాడు
  rationale: μέλλει లోని భవిష్యదభిముఖ భావాన్ని ‘బోతున్నాడు’తో, ποιμαίνω లోని కాపరి రూపకాన్ని ‘కాపరిగా నడిపించు’తో సహజంగా నిలుపుతుంది.
- source_word: πάντα τὰ ἔθνη
  choice: సమస్త జనాలను
  rationale: ఇక్కడ ἔθνη ప్రపంచంలోని జనసమూహాలను సూచిస్తుంది; ‘జనాలు’ సాధారణ పాఠకులకు సహజంగా ఉండి భావాన్ని జాతిపరంగా కుదించదు.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: ఇనుప దండంతో
  rationale: సాధనార్థక ἐν ను, కీర్తన 2ను ప్రతిధ్వనించే బలమైన రాజాధికార చిత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἡρπάσθη
  choice: హఠాత్తుగా ఎత్తుకుపోబడింది
  rationale: ἁρπάζω లోని ఆకస్మికమైన, బలమైన తొలగింపును మరియు దేవుని వైపు పైకి తీసుకుపోవడాన్ని వ్యక్తం చేస్తుంది; గ్రీకు కర్మణి ప్రయోగాన్ని కూడా నిలుపుతుంది.
- source_word: τὸ τέκνον αὐτῆς
  choice: ఆమె బిడ్డ
  rationale: υἱός నుండి మరింత సాధారణమైన τέκνον కు జరిగిన పదమార్పును తెలుగులో ‘బిడ్డ’తో ప్రతిబింబిస్తుంది.
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: దేవుని దగ్గరికి, ఆయన సింహాసనం దగ్గరికి
  rationale: రెండుసార్లు వచ్చిన πρὸς ను ‘దగ్గరికి’ అని రెండుసార్లు పలికి, దేవుని వైపుకూ ఆయన సింహాసనం వైపుకూ జరిగిన గమనాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ποιμαίνειν ... ἐν ῥάβδῳ σιδηρᾷ లో కీర్తన 2కు సంబంధించిన మెస్సీయ రాజాధికార సూచన
  choice: ప్రధాన పాఠ్యంలో ‘కాపరిగా నడిపించు’ అనే రూపకాన్ని నిలిపి, ‘పరిపాలించు’ అనే రాజాధికార భావాన్ని పాదసూచికలో ఇవ్వడం
  alternative: ఇనుప దండంతో సమస్త జనాలను పరిపాలించబోతున్నాడు
  rationale: ఈ మాట కీర్తన 2లోని రాజాధికారాన్ని ప్రతిధ్వనించినా, గ్రీకు క్రియ యొక్క ప్రత్యక్ష అర్థం ‘కాపరిగా కాయడం/నడిపించడం.’ అందువల్ల రూపకాన్ని ప్రధాన పాఠ్యంలోనే ఉంచడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: μέλλει యొక్క భావం
  choice: ‘నడిపించబోతున్నాడు’
  alternative: ‘నడిపిస్తాడు’ లేదా ‘నడిపించవలసినవాడు’
  rationale: సాధారణ భవిష్యత్తుగా చదునుచేయకుండా, రాబోయే లేదా నిర్ణయించబడిన కార్యం అనే గ్రీకు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కాపరిగా నడిపించు’ సాధారణ పాఠకునికి అర్థమయ్యేలా కాపరి రూపకాన్ని నిలుపుతుంది. ‘హఠాత్తుగా ఎత్తుకుపోబడింది’ కొంత సాహిత్య కర్మణి నిర్మాణమైనప్పటికీ, మూలంలోని ఆకస్మికతను మరియు తెలియజేయని కర్తను కాపాడుతుంది.
