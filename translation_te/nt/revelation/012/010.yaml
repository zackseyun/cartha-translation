id: REV.12.10
reference: Revelation 12:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: te
  text: 'పరలోకంలో ఒక బిగ్గర స్వరం ఇలా చెప్పడం నేను విన్నాను: “ఇప్పుడు మన దేవుని రక్షణ, శక్తి, రాజ్యం, ఆయన అభిషిక్తుని[a] అధికారం వచ్చాయి. ఎందుకంటే మన సహోదరులపై[b] ఆరోపణలు చేసేవాడు—మన దేవుని ఎదుట రాత్రింబగళ్లు వారిపై ఆరోపణలు చేసేవాడు—పడవేయబడ్డాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అభిషిక్తుడు” అనే పదానికి గ్రీకులో Χριστός (క్రిస్టోస్) ఉంది; దీనిని “క్రీస్తు” లేదా “మెస్సీయ” అని కూడా అంటారు. ఇక్కడ అది దేవుడు అభిషేకించిన పాలకుని బిరుదు.
    reason: alternative_reading
  - marker: b
    text: “సహోదరులు” అనే పదం ఈ సందర్భంలో స్త్రీలతో సహా తోటి విశ్వాసులందరినీ సమష్టిగా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: ఒక గొప్ప స్వరం
  rationale: తెలుగులో ‘గొప్ప స్వరం’ సందర్భానుసారంగా బిగ్గరగా వినిపించే శక్తిమంతమైన స్వరాన్ని సహజంగా సూచిస్తుంది; ప్రకటన గ్రంథపు గంభీర శైలినీ నిలుపుతుంది.
- source_word: Ἄρτι ἐγένετο
  choice: ఇప్పుడు ... ప్రత్యక్షమయ్యాయి
  rationale: Ἄρτι నిర్ణాయకమైన ప్రస్తుత క్షణాన్ని సూచిస్తుంది; ἐγένετο ఇక్కడ రక్షణ మొదలైనవి విజయవంతంగా అమలులోకి వచ్చి వెల్లడైన భావాన్ని ఇస్తుంది.
- source_word: ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία
  choice: రక్షణ, శక్తి, రాజ్యం
  rationale: గ్రీకు వాక్యంలోని అలంకారపూర్వక జాబితాను సంక్షిప్తమైన, సహజ తెలుగు పదాలతో నిలుపుతుంది.
- source_word: ἡ ἐξουσία
  choice: అధికారం
  rationale: δύναμις అనే ‘శక్తి’తో భేదాన్ని కాపాడుతూ, హక్కుగల పాలనా అధికారాన్ని సూచిస్తుంది.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: ఆయన అభిషిక్తుని
  rationale: Χριστός ఇక్కడ బిరుదుగా, దేవునిచేత అభిషేకించబడిన పాలకుణ్ణి సూచిస్తుంది; పేరులా లిప్యంతరీకరించకుండా మూలార్థాన్ని అందిస్తుంది.
- source_word: κατήγωρ / κατηγορῶν
  choice: నేరం మోపేవాడు / వారిపై నేరం మోపేవాడు
  rationale: న్యాయస్థాన సంబంధమైన ఆరోపణ భావాన్ని స్పష్టంగా తెలియజేస్తూ, నామవాచకం మరియు క్రియ మధ్యనున్న గ్రీకు పదప్రయోగ పునరుక్తిని నిలుపుతుంది.
- source_word: ἐβλήθη
  choice: కిందికి పడవేయబడ్డాడు
  rationale: బలవంతంగా పరలోకం నుంచి కిందికి విసరబడిన దృశ్యాన్ని, సమీప సందర్భంలోని పతన దిశను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἡμέρας καὶ νυκτός
  choice: రాత్రింబగళ్లు
  rationale: నిరంతర చర్యను తెలిపే సహజమైన ఆధునిక తెలుగు నుడికారం.
theological_decisions:
- issue: Χριστός పదాన్ని ఎలా అనువదించాలి
  choice: అభిషిక్తుడు
  alternative: క్రీస్తు / మెస్సీయ
  rationale: ఈ వాక్యంలో అది వ్యక్తినామం కంటే ‘దేవుని అభిషిక్త పాలకుడు’ అనే బిరుదుగా పనిచేస్తుంది. ‘అభిషిక్తుడు’ మూలపదార్థాన్ని నేరుగా కాపాడుతుంది; పాదటిప్పణి సుపరిచిత రూపాలను తెలియజేస్తుంది.
- issue: ἀδελφῶν యొక్క లింగవ్యాప్తి
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు / తోటి విశ్వాసులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపానికి సమీపంగా ఉంటూనే, సందర్భంలో విశ్వాసుల సమూహాన్ని సూచించే విస్తృత ప్రయోగం ఉండవచ్చని పాదటిప్పణిలో వివరిస్తుంది.
- issue: ἐγένετο యొక్క కాల-ఫలిత భావం
  choice: ప్రత్యక్షమయ్యాయి
  alternative: వచ్చాయి / సంభవించాయి
  rationale: ఈ ప్రకటన దేవుని రక్షణ మొదటిసారి ఉనికిలోకి వచ్చిందని తప్పనిసరిగా చెప్పకుండా, డ్రాగన్ పడవేయబడిన నిర్ణాయక సంఘటనలో అవి అమలై వెల్లడయ్యాయని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన అపోకలిప్టిక్ స్వరాన్ని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. గ్రీకులోని ఆరోపణ పదప్రయోగ పునరుక్తి ఉద్దేశపూర్వకంగా కాపాడబడింది; దీర్ఘ వాక్యాన్ని డాష్‌లతో స్పష్టీకరించాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
