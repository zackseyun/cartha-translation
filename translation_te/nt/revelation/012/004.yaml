id: REV.12.4
reference: Revelation 12:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: te
  text: దాని తోక ఆకాశంలోని నక్షత్రాలలో మూడవ వంతును లాగుకుపోతుంది; వాటిని భూమిపైకి విసిరివేసింది.[a] ప్రసవించబోతున్న స్త్రీ ఎదుట డ్రాగన్ నిలబడి ఉంది; ఆమె ప్రసవించినప్పుడు ఆమె బిడ్డను మింగివేయడానికి అది అక్కడ నిలబడి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో మొదటి క్రియ వర్తమానకాలంలో (‘లాగుకుపోతుంది’), తరువాతి క్రియ భూతకాలంలో (‘విసిరివేసింది’) ఉంది.
    reason: మూలపాఠంలోని గమనార్హమైన క్రియాకాల మార్పును పాఠకుడికి తెలియజేసి, అనువాదంలో దానిని సమతలపరచకుండా ఉంచేందుకు.
lexical_decisions:
- source_word: σύρει
  choice: ఈడ్చుకుంటూ ఉంది
  rationale: వర్తమానకాల రూపాన్ని నిలుపుతూ, తోక నక్షత్రాలను బలంగా లాగుతున్న దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ τρίτον
  choice: మూడవ వంతును
  rationale: మొత్తంలో ఒక మూడవ భాగం అనే గ్రీకు భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δράκων
  choice: ఘటసర్పం
  rationale: ప్రకటన గ్రంథంలోని మహా భయంకర సర్పాకార ప్రాణిని సూచించే గంభీరమైన తెలుగు పదం; సాధారణ ‘పాము’ కంటే మూలపదంలోని పురాణాత్మక దృశ్యాన్ని మెరుగుగా నిలుపుతుంది.
- source_word: καταφάγῃ
  choice: మింగివేయడానికి
  rationale: పూర్తిగా తినివేయడం అనే బలమైన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: σύρει అనే వర్తమానకాల క్రియ తర్వాత ἔβαλεν అనే భూతకాల క్రియ రావడం
  choice: ‘ఈడ్చుకుంటూ ఉంది; ... విసిరివేసింది’ అని కాలభేదాన్ని నిలిపాం
  alternative: రెండు క్రియలనూ ఒకే కాలంలో ‘ఈడ్చి ... విసిరివేసింది’ లేదా ‘ఈడ్చి ... విసిరివేస్తుంది’ అని అనువదించడం
  rationale: మూల గ్రీకులో ఉన్న ఆకస్మిక కాలమార్పును సరిచేసి సమతలపరచకుండా, దాని సాహిత్య ఉద్వేగం మరియు నిజమైన అసమానతను కాపాడుతుంది.
- issue: నక్షత్రాల ప్రతీకాత్మక గుర్తింపు
  choice: వ్యాఖ్యానించకుండా ‘నక్షత్రాలు’గానే ఉంచాం
  alternative: దూతలు లేదా ఇతర ఆత్మీయ జీవులు అని స్పష్టీకరించడం
  rationale: ఈ వచనం స్వయంగా వాటి ప్రతీకాత్మక గుర్తింపును నిర్ధారించదు; ఒక నిర్దిష్ట సిద్ధాంత వ్యాఖ్యానాన్ని పాఠ్యంలోకి దిగుమతి చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగిస్తూ, దర్శనంలోని గంభీరతను నిలిపాం. ‘ఘటసర్పం’ అనే పదం ప్రకటన గ్రంథపు మహా సర్పాకార విరోధిని గౌరవప్రద-సాహిత్య రిజిస్టర్‌లో సూచిస్తుంది. మూలంలోని వర్తమాన–భూత కాల మార్పును ఉద్దేశపూర్వకంగా కాపాడాం.
