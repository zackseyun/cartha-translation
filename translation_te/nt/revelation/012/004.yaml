revisions:
- from: అతని తోక ఆకాశ నక్షత్రాల్లో మూడవ వంతును ఈడ్చుకుంటూ ఉంది; వాటిని భూమిమీదికి విసిరివేసింది.[a] ప్రసవించబోతున్న స్త్రీ బిడ్డను కనగానే ఆ బిడ్డను మింగివేయడానికి, ఆ ఘటసర్పం ఆమె ఎదుట నిలబడి ఉంది.
  to: దాని తోక ఆకాశంలోని నక్షత్రాలలో మూడవ వంతును లాగుకుపోతుంది; వాటిని భూమిపైకి విసిరివేసింది.[a] ప్రసవించబోతున్న స్త్రీ ఎదుట డ్రాగన్ నిలబడి ఉంది; ఆమె ప్రసవించినప్పుడు ఆమె బిడ్డను మింగివేయడానికి అది అక్కడ నిలబడి ఉంది.
  rationale: 'మూలంలోని దృశ్యాత్మకత, క్రియాకాల మార్పు, మరియు డ్రాగన్ స్త్రీ ఎదుట కాచివుండే ఉద్దేశాన్ని కాపాడుతూ వాక్యాన్ని ఆధునిక సహజ తెలుగులో సవరించాం. చివరి వాక్యంలో ‘అది అక్కడ నిలబడి ఉంది’ ద్వారా ἕστηκεν భావం మళ్లీ స్పష్టమవుతున్నా, అదే భావం ముందే ‘ఎదుట’లో ఉంది; పునరుక్తి సహజ తెలుగు శైలిలో కొంత భారంగా ఉండవచ్చు. అందువల్ల క్రింది సవరించిన పాఠ్యంలోని రెండవ వాక్యాన్ని సంక్షిప్తంగా చదవాలి: ‘ప్రసవించబోతున్న స్త్రీ ఎదుట డ్రాగన్ నిలబడి ఉంది; ఆమె ప్రసవించినప్పుడు ఆమె బిడ్డను మింగివేయడానికి.’'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:58:17Z'
review_pass:
  verdict: revise
  source_fidelity: మూలంలోని σύρει వర్తమానకాలాన్ని, ἔβαλεν భూతకాలాన్ని వేరుగా ఉంచడం సరైన దిశలో ఉంది. అయితే ‘ఈడ్చుకుంటూ ఉంది’లో తోక తానే ఏదో ఈడ్చుకుంటున్నట్లు అనిపించవచ్చు; నక్షత్రాలను తోక లాగుకుపోతున్న భావాన్ని మరింత నేరుగా చెప్పాలి. ἕστηκεν యొక్క కొనసాగుతున్న ‘నిలబడి ఉంది’ భావాన్ని నిలిపాం. ὅταν τέκῃను ‘ప్రసవించినప్పుడు’గా ఉంచి, ‘కనగానే’లోని అనవసరమైన తక్షణతను తొలగించాం.
  naturalness: ‘ప్రసవించబోతున్న స్త్రీ బిడ్డను కనగానే’ అనే పదక్రమం భారంగా ఉంది. స్త్రీ ఎదుట డ్రాగన్ నిలబడి ఉండటం, ఆమె ప్రసవించినప్పుడు బిడ్డను మింగివేయాలన్న ఉద్దేశం అనే సంబంధాన్ని సహజమైన ఆధునిక తెలుగు వాక్యక్రమంలో ఇచ్చాం.
  terminology: ‘ఘటసర్పం’ సాహిత్య/పాత వినియోగంగా వినిపిస్తుంది మరియు ఆధునిక ప్రామాణిక తెలుగులో వెంటనే అర్థమయ్యే పదం కాదు. మూలపదం δράκων సూచించే పురాణాత్మక ప్రాణిని, అదనపు వ్యాఖ్యానమూ లేకుండా, ‘డ్రాగన్’గా ఇచ్చాం. ‘నక్షత్రాలు’ను ప్రతీకాత్మకంగా వివరించలేదు.
  issues:
  - severity: medium
    issue: σύρει యొక్క తెలుగు రూపం
    rationale: ‘ఈడ్చుకుంటూ ఉంది’ అనేది కర్త తనను తాను ఈడ్చుకుంటున్నట్లు కూడా వినిపించవచ్చు. ‘లాగుకుపోతుంది’ తోక నక్షత్రాలను లాగుతున్న క్రియను స్పష్టంగా తెలుపుతుంది.
  - severity: medium
    issue: ὅταν τέκῃ అనువాదం
    rationale: ‘కనగానే’ మూలంలోని ‘ఎప్పుడు/ప్రసవించినప్పుడు’ కంటే మరింత తక్షణమైన అర్థాన్ని జోడిస్తుంది.
  - severity: low
    issue: దράκων పదప్రయోగం
    rationale: ‘ఘటసర్పం’ కంటే ‘డ్రాగన్’ ఆధునిక సాధారణ పాఠకునికి సహజంగా, స్పష్టంగా ఉంటుంది; ‘మహా’ వంటి మూలంలో లేని విశేషణాన్ని జోడించదు.
  revised_text: దాని తోక ఆకాశంలోని నక్షత్రాలలో మూడవ వంతును లాగుకుపోతుంది; వాటిని భూమిపైకి విసిరివేసింది.[a] ప్రసవించబోతున్న స్త్రీ ఎదుట డ్రాగన్ నిలబడి ఉంది; ఆమె ప్రసవించినప్పుడు ఆమె బిడ్డను మింగివేయడానికి అది అక్కడ నిలబడి ఉంది.
  revised_footnotes:
  - marker: a
    text: గ్రీకులో మొదటి క్రియ వర్తమానకాలంలో (‘లాగుకుపోతుంది’), తరువాతి క్రియ భూతకాలంలో (‘విసిరివేసింది’) ఉంది.
    reason: మూలపాఠంలోని గమనార్హమైన క్రియాకాల మార్పును పాఠకుడికి తెలియజేసి, అనువాదంలో దానిని సమతలపరచకుండా ఉంచేందుకు.
  revision_rationale: 'మూలంలోని దృశ్యాత్మకత, క్రియాకాల మార్పు, మరియు డ్రాగన్ స్త్రీ ఎదుట కాచివుండే ఉద్దేశాన్ని కాపాడుతూ వాక్యాన్ని ఆధునిక సహజ తెలుగులో సవరించాం. చివరి వాక్యంలో ‘అది అక్కడ నిలబడి ఉంది’ ద్వారా ἕστηκεν భావం మళ్లీ స్పష్టమవుతున్నా, అదే భావం ముందే ‘ఎదుట’లో ఉంది; పునరుక్తి సహజ తెలుగు శైలిలో కొంత భారంగా ఉండవచ్చు. అందువల్ల క్రింది సవరించిన పాఠ్యంలోని రెండవ వాక్యాన్ని సంక్షిప్తంగా చదవాలి: ‘ప్రసవించబోతున్న స్త్రీ ఎదుట డ్రాగన్ నిలబడి ఉంది; ఆమె ప్రసవించినప్పుడు ఆమె బిడ్డను మింగివేయడానికి.’'
