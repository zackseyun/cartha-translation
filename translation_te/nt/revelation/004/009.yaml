  verdict: revise
  source_fidelity: The draft preserves the recurring temporal force of ὅταν, the threefold objects, and the two appositional descriptions of the throne occupant. However, ‘కృతజ్ఞతాస్తుతులను’ adds ‘praises’ and changes the singular εὐχαριστίαν to a plural expression. The duration phrase is better rendered explicitly as ‘యుగయుగాల వరకు,’ rather than the less precise ‘యుగయుగాలు.’
  naturalness: The revised wording uses a natural Telugu conditional-iterative construction (‘ఇచ్చినప్పుడల్లా’) and retains the verse’s unfinished syntax and final comma, since the sentence continues in the following verse.
  terminology: ‘మహిమ,’ ‘ఘనత,’ and ‘కృతజ్ఞత’ accurately distinguish δόξα, τιμή, and εὐχαριστία without adding interpretive worship language. ‘సింహాసనంపై కూర్చున్నవానికి’ and ‘జీవించేవానికి’ are suitable modern-standard Telugu renderings of the participial phrases.
  issues:
  - severity: medium
    issue: ‘కృతజ్ఞతాస్తుతులను’ for εὐχαριστίαν
    rationale: This expression introduces ‘స్తుతులు’ (praises), which is absent from the Greek, and employs a plural form where the source has singular ‘thanksgiving.’ ‘కృతజ్ఞతను’ preserves the source meaning without expansion.
  - severity: low
    issue: Footnote anchor is placed at the end of the clause rather than with the duration expression it explains.
    rationale: The lexical-alternative note concerns εἰς τοὺς αἰῶνας τῶν αἰώνων, so its marker should immediately follow ‘యుగయుగాల వరకు.’
  - severity: low
    issue: ‘యుగయుగాలు’ does not state the durative force as clearly as the Greek idiom.
    rationale: ‘యుగయుగాల వరకు’ naturally and explicitly conveys ‘forever and ever’ while allowing the literal alternative in the footnote.
  revised_text: ఆ జీవులు సింహాసనంపై కూర్చున్నవానికి, యుగయుగాల వరకు[a] జీవించేవానికి మహిమను, ఘనతను, కృతజ్ఞతను ఇచ్చినప్పుడల్లా,
