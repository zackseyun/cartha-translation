  to: ఆ జీవులు సింహాసనంపై కూర్చున్నవానికి, యుగయుగాల వరకు[a] జీవించేవానికి మహిమను, ఘనతను, కృతజ్ఞతను ఇచ్చినప్పుడల్లా,
