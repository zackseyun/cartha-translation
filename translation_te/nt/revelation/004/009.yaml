id: REV.4.9
reference: Revelation 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: te
  text: ఆ జీవులు సింహాసనంపై కూర్చున్నవానికి, యుగయుగాల వరకు[a] జీవించేవానికి మహిమను, ఘనతను, కృతజ్ఞతను ఇచ్చినప్పుడల్లా,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “యుగాల యుగాల వరకు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ఎప్పుడెప్పుడు ... అర్పిస్తాయో
  rationale: ὅταν ఇక్కడ పునరావృతమయ్యే లేదా నిర్దిష్టం కాని సందర్భాలను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘ఎప్పుడెప్పుడు ... అర్పిస్తాయో’ అనే రూపం ఆ పునరావృత కాలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δώσουσιν
  choice: అర్పిస్తాయో
  rationale: δίδωμι యొక్క మౌలిక అర్థం ‘ఇవ్వడం’ అయినా, మహిమ, ఘనత, కృతజ్ఞతాస్తుతులు అనే కర్మలతో ఆరాధనా సందర్భంలో ‘అర్పించడం’ సహజమైన తెలుగు; మూలంలోని కార్యార్థాన్ని అతిగా వివరించదు.
- source_word: τὰ ζῷα
  choice: ఆ జీవులు
  rationale: ఇవి ఈ అధ్యాయంలో ముందుగా పరిచయమైన సింహాసన పరిసర జీవులు. ‘ఆ’ సందర్భసంబంధాన్ని చూపుతుంది; ఈ వచనంలో లేని ‘నాలుగు’ అనే సంఖ్యను చేర్చలేదు.
- source_word: δόξαν
  choice: మహిమను
  rationale: ఆరాధనా సందర్భంలో δόξαకు స్థిరమైన, ప్రత్యక్ష సమానార్థకం ‘మహిమ’; దీనిని ‘స్తుతి’గా మార్చితే గుణం నుంచి చర్య వైపు భావం మళ్లుతుంది.
- source_word: τιμήν
  choice: ఘనతను
  rationale: τιμή సూచించే గౌరవాన్ని ఆరాధనా సందర్భంలో ‘ఘనత’ సహజంగా, గంభీరంగా తెలియజేస్తుంది; ‘మహిమ’తో అర్థభేదమూ నిలుస్తుంది.
- source_word: εὐχαριστίαν
  choice: కృతజ్ఞతాస్తుతులను
  rationale: εὐχαριστία ఇక్కడ వ్యక్తపరచబడే కృతజ్ఞత/ధన్యవాదాన్ని సూచిస్తుంది. ‘కృతజ్ఞతాస్తుతులు’ ఆరాధనా వ్యక్తీకరణను తెలుగులో సహజంగా తెలియజేస్తుంది; బహువచన రూపం సామూహిక ఆరాధనా పలుకులను సూచించే తెలుగు ప్రయోగం.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: సింహాసనంపై కూర్చున్నవానికి
  rationale: గ్రీకు కృదంత పదబంధాన్ని సహజమైన తెలుగు సంబంధార్థక రూపంలో అందించి, సింహాసన దృశ్యాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: τῷ ζῶντι
  choice: జీవించేవానికి
  rationale: వర్తమాన కృదంతంలోని నిరంతర జీవన భావాన్ని క్రియాత్మకంగా వ్యక్తం చేస్తూ, తరువాతి కాలవ్యాప్తి పదబంధంతో నేరుగా కలుపుతుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాలు
  rationale: ఈ గ్రీకు నుడికారం అంతంలేని కాలవ్యాప్తిని సూచిస్తుంది. ‘యుగయుగాలు’ ఆధునిక తెలుగు బైబిలు శైలిలో సహజమైన, గంభీరమైన సమానార్థకం.
theological_decisions:
- issue: దైవిక సింహాసన బిరుదులో మూలంలో లేని నిర్దిష్ట నామాన్ని చేర్చకపోవడం
  choice: సింహాసనంపై కూర్చున్నవానికి, యుగయుగాలు జీవించేవానికి
  alternative: సింహాసనంపై కూర్చున్న దేవునికి, శాశ్వతంగా జీవించేవానికి
  rationale: మూలపాఠం వ్యక్తిని సింహాసనాసీనత మరియు నిత్యజీవం ద్వారా గుర్తిస్తుంది గాని ఇక్కడ ‘దేవుడు’ అనే నామాన్ని ప్రత్యక్షంగా చేర్చదు. అందువల్ల అప్పోజిషనల్ నిర్మాణాన్ని, సందర్భంలోని గుర్తింపును అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆరాధనా ధోరణి పాటించబడింది. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది. పునరావృత భావం కోసం ‘ఎప్పుడెప్పుడు ... అర్పిస్తాయో’ వాడబడింది.
