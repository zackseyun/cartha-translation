id: REV.4.6
reference: Revelation 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: te
  text: సింహాసనం ఎదుట స్ఫటికంలాంటి గాజు సముద్రంలా ఏదో ఉంది[a]. సింహాసనం మధ్యలోను, సింహాసనం చుట్టూను[c] ముందూ వెనుకా కళ్లతో నిండిన నాలుగు జీవులు[b] ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “గాజులాంటి సముద్రం.” గ్రీకులో ఇది పోలిక: “గాజు సముద్రంలా ఏదో.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నాలుగు సజీవ ప్రాణులు.” ఇక్కడి గ్రీకు పదం ప్రకటన గ్రంథంలో తరువాత కనిపించే శత్రుత్వపూరిత “మృగాలను” సూచించదు.
    reason: lexical_alternative
  - marker: c
    text: “సింహాసనం మధ్యలోను, సింహాసనం చుట్టూను” అనే పదబంధం స్థానపరంగా క్లిష్టమైనది. ఇది దర్శన దృక్కోణాన్ని ప్రతిబింబిస్తుండవచ్చు; అందుకే మూలంలోని అసాధారణ పదప్రయోగాన్ని అనువాదం ఉద్దేశపూర్వకంగా నిలిపింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνώπιον
  choice: ఎదుట
  rationale: సింహాసనంతో ఉన్న స్థాన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘సన్నిధిలో’ అని విస్తరించి అర్థాన్ని మార్చదు.
- source_word: ὡς
  choice: …లా ఏదో
  rationale: ఇది ఖచ్చితమైన గుర్తింపు కాక పోలిక అని తెలియజేస్తుంది; దర్శనంలోని సాదృశ్య స్వభావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θάλασσα ὑαλίνη
  choice: గాజు సముద్రం
  rationale: మూలంలోని సముద్రం–గాజు చిత్రాన్ని నిలుపుతుంది; అది అక్షరార్థంగా నీటి సముద్రమని అదనంగా నిర్ధారించదు.
- source_word: ὁμοία κρυστάλλῳ
  choice: స్ఫటికంలాంటి
  rationale: స్ఫటికంతో చేసినదని కాక, దానిని పోలినదని చెప్పే రెండవ పోలికను సంక్షిప్తంగా కాపాడుతుంది.
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: సింహాసనం మధ్యలోను, సింహాసనం చుట్టూ
  rationale: దర్శనంలోని అసాధారణమైన స్థాన వివరణను సరిచేసి ఒకే భౌగోళిక చిత్రంగా మార్చకుండా మూలానికి దగ్గరగా ఉంచుతుంది.
- source_word: ζῷα
  choice: జీవులు
  rationale: దేవుని సింహాసనం దగ్గర ఉన్న సజీవ ప్రాణులను సూచిస్తుంది; ప్రకటన గ్రంథంలో తరువాత కనిపించే శత్రుత్వపూరిత ‘మృగాలు’ అనే భావాన్ని ఇక్కడికి రానివ్వదు.
- source_word: γέμοντα ὀφθαλμῶν
  choice: కళ్లతో నిండిన
  rationale: గ్రీకు పదబంధాన్ని స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: ముందూ వెనుకా
  rationale: జీవుల కళ్ల స్థానాన్ని తెలిపే సహజమైన తెలుగు జంటపద ప్రయోగం.
theological_decisions:
- issue: పరలోక సింహాసన దర్శనంలో ζῷα పదం అనువాదం
  choice: జీవులు
  alternative: సజీవ ప్రాణులు; మృగాలు
  rationale: ఈ పదం యెహెజ్కేలు సింహాసన దర్శనాన్ని తలపించే సజీవమైన పరలోక జీవులను సూచిస్తుంది. ‘మృగాలు’ అంటే ప్రకటన గ్రంథంలోని తరువాతి శత్రు రూపాలతో అనవసరమైన సంబంధం ఏర్పడవచ్చు.
- issue: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου లోని స్థానపరమైన ఉద్రిక్తత
  choice: ‘సింహాసనం మధ్యలోను, సింహాసనం చుట్టూ’ అనే అసాధారణ పదబంధాన్ని నిలుపడం
  alternative: ‘సింహాసనం చుట్టూ, దాని మధ్యభాగంలో’; ‘సింహాసనానికీ దాని చుట్టరికానికీ మధ్య’ అని సమన్వయపరచడం
  rationale: గ్రీకు వాక్యం దర్శన దృక్కోణం వల్ల స్థానపరంగా క్లిష్టంగా ఉంది. దాని రూపరేఖలను ఊహించి నిర్దిష్టం చేయకుండా ఆ వ్యాఖ్యాన ఉద్రిక్తతను అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘సన్నిధి,’ ‘స్ఫటికసదృశ’ వంటి అధిక గ్రాంథిక రూపాలకు బదులు ‘ఎదుట,’ ‘స్ఫటికంలాంటి’ అన్న సహజ రూపాలను ఎంచుకున్నాం. దర్శనంలోని పోలికనూ స్థానపరమైన అస్పష్టతనూ వివరణతో తొలగించలేదు.
