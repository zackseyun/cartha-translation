id: REV.4.1
reference: Revelation 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: te
  text: ఈ సంగతుల తర్వాత[a] నేను చూశాను; ఇదిగో, పరలోకంలో ఒక తలుపు తెరవబడి ఉంది. నేను ముందుగా విన్న ఆ స్వరం[b], బూర ధ్వనిలా నాతో మాట్లాడుతూ[c], “ఇక్కడికి పైకి రా; ఈ సంగతుల తర్వాత తప్పక జరగాల్సిన వాటిని నీకు చూపిస్తాను” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దీని తర్వాత’ అని కూడా అనువదించవచ్చు. గ్రీకులో ‘ఈ సంగతుల తర్వాత’ అనే బహువచన పదబంధం ఈ వచనం ఆరంభంలోనూ ముగింపులోనూ పునరావృతమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నేను ముందుగా విన్న ఆ స్వరం’ అనేది యోహాను ఇంతకు ముందు విన్న స్వరాన్ని సూచిస్తున్నట్టు కనిపిస్తుంది; ప్రకటన 1:10 చూడండి.
    reason: cross_reference
  - marker: c
    text: ‘నాకు మాట్లాడుతూ’ లేదా ‘నన్ను ఉద్దేశించి మాట్లాడుతూ’ అని కూడా అనువదించవచ్చు. గ్రీకులో అక్షరార్థంగా ‘నాతో మాట్లాడుతూ’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ఈ సంగతుల తర్వాత
  rationale: గ్రీకులోని బహువచన సూచనను, వాక్యం ఆరంభంలోనూ ముగింపులోనూ ఉన్న పునరుక్తిని నిలుపుతుంది.
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: దర్శన సందర్భంలో సహజంగా ఉండే ప్రత్యక్ష దృశ్యగ్రహణాన్ని తెలియజేస్తుంది; వెంట వచ్చే ἰδοὺ భావాన్ని వేరుగా నిలుపుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా దర్శనంలోని అంశంపై దృష్టి నిలిపే ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన తెలుగులో కాపాడుతుంది.
- source_word: θύρα ἠνεῳγμένη
  choice: ఒక తలుపు తెరిచి ఉంది
  rationale: పర్ఫెక్ట్ పాసివ్ కృదంతం సూచించే—ముందు తెరవబడి ఇప్పుడు తెరిచిన స్థితిలో ఉన్న—ఫలితస్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: ఇక్కడ కనిపించే ఆకాశాన్ని కాక పరలోక ప్రాంతాన్ని సూచించే ప్రకటన గ్రంథ సందర్భానికి సరిపోతుంది.
- source_word: ἡ φωνὴ ἡ πρώτη
  choice: నేను విన్న మొదటి స్వరం
  rationale: πρώτη అనే విశేషణ భావాన్ని నిలుపుతూ, మునుపటి స్వరానికి ఉండే సంభావ్య సూచనను అతిగా వివరించదు.
- source_word: ὡς σάλπιγγος
  choice: బూర ధ్వనిలా
  rationale: స్వరాన్ని బూరతో సమానంగా కాక పోలికగా చూపుతుంది; తెలుగులో కేవలం ‘బూరలా’ అనడం కంటే ధ్వని పోలికను సహజంగా తెలియజేస్తుంది.
- source_word: λαλούσης μετ’ ἐμοῦ
  choice: నాతో మాట్లాడుతూ
  rationale: μετά + షష్ఠీ విభక్తి యొక్క ‘నాతో’ భావాన్ని నిలుపుతుంది; ‘నాతో’ మరియు ‘నాకు’ మధ్య ఉన్న స్వల్ప భేదాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: Ἀνάβα ὧδε
  choice: ఇక్కడికి పైకి రా
  rationale: పరలోకంలో ఉన్న వక్త దృష్టికోణం నుంచి యోహానును పైకి రమ్మనే ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἃ δεῖ γενέσθαι
  choice: తప్పక జరగాల్సిన వాటిని
  rationale: δεῖ లోని అవసరతను నిలుపుతూ, ఏమి జరగాలి అనే బహువచన సంబంధార్థాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: μετὰ ταῦτα అనే పదబంధం రెండుసార్లు రావడంలోని కాలసంబంధ భావం
  choice: రెండు చోట్లా ‘ఈ సంగతుల తర్వాత’ అని అనువదించడం
  alternative: ‘దీని తర్వాత’ లేదా చివరలో ‘ఇకపై’ అని అనువదించడం
  rationale: గ్రీకు పాఠంలోని పునరుక్తిని, బహువచనాన్ని నిలుపుతుంది. ఇది సాహిత్య క్రమమా, దర్శన క్రమమా, లేక రక్షణచరిత్ర క్రమమా అని నిర్దిష్ట అంత్యకాల పద్ధతితో ముందే నిర్ణయించదు.
- issue: ‘మొదటి స్వరం’ ఎవరిని సూచిస్తుంది
  choice: పాఠంలో గుర్తింపును వివరించకుండా ‘నేను విన్న మొదటి స్వరం’ అని ఉంచడం
  alternative: ప్రకటన 1:10లో యోహాను విన్న స్వరమే అని ప్రధాన పాఠంలో స్పష్టీకరించడం
  rationale: మునుపటి స్వరానికి, ముఖ్యంగా ప్రకటన 1:10కు, సూచన ఉండే అవకాశం బలంగా ఉన్నా గ్రీకు వాక్యం దానిని పేరుపెట్టి గుర్తించదు; అందువల్ల ఆ సంబంధాన్ని పాదసూచికకు పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రకటన గ్రంథ దర్శనశైలికి తగిన గంభీరతను నిలిపాం. ‘ఇదిగో’, ‘పరలోకం’, ‘బూర ధ్వని’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యే విధంగా ఉండి మూలంలోని ఉద్ఘాటనాత్మక స్వరాన్ని కాపాడుతాయి.
