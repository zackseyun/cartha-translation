- from: ఈ సంగతుల తర్వాత[a] నేను చూశాను. ఇదిగో, పరలోకంలో ఒక తలుపు తెరిచి ఉంది. నేను విన్న మొదటి స్వరం[b] బూర ధ్వనిలా నాతో మాట్లాడుతూ[c], “ఇక్కడికి పైకి రా; ఈ సంగతుల తర్వాత తప్పక జరగాల్సిన వాటిని నీకు చూపిస్తాను” అని చెప్పింది.
  to: ఈ సంగతుల తర్వాత[a] నేను చూశాను; ఇదిగో, పరలోకంలో ఒక తలుపు తెరవబడి ఉంది. నేను ముందుగా విన్న ఆ స్వరం[b], బూర ధ్వనిలా నాతో మాట్లాడుతూ[c], “ఇక్కడికి పైకి రా; ఈ సంగతుల తర్వాత తప్పక జరగాల్సిన వాటిని నీకు చూపిస్తాను” అని చెప్పింది.
  rationale: 'The revision makes two narrowly linguistic improvements: it renders the perfect passive participle with an explicit resultant-state expression, and it clarifies that the ‘first voice’ is the voice heard earlier, without importing a definite identification into the main text. Footnote markers and all three explanatory footnotes are retained and remain correctly anchored.'
