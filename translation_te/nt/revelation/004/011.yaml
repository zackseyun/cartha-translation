id: REV.4.11
reference: Revelation 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: te
  text: '“మా ప్రభువా, మా దేవా,

    మహిమను, ఘనతను, శక్తిని పొందడానికి

    నీవు యోగ్యుడవు[a];

    ఎందుకంటే నీవే సమస్తాన్ని సృష్టించావు.

    నీ చిత్తం కారణంగా[b]

    అవి ఉనికిలో ఉండేవి, సృష్టించబడ్డాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరో విధంగా: “యోగ్యుడవు నీవు.” గ్రీకు వాక్యంలో “యోగ్యుడు” అనే పదం ఉద్ఘాటన కోసం ముందుగా ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: 'మరో విధంగా: “నీ చిత్తం ద్వారానే.” గ్రీకు పదబంధం ప్రధానంగా కారణాన్ని (“నీ చిత్తం కారణంగా”) సూచించగలదు; సాధనాన్ని (“నీ చిత్తం ద్వారా”) సూచించే భావమూ సాధ్యమే.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: నీవు యోగ్యుడవు
  rationale: εἶతో కూడిన ἄξιος అర్హతను లేదా యోగ్యతను తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘నీవు యోగ్యుడవు’ సహజమైన ప్రత్యక్ష సంబోధన; గ్రీకులోని ముందరి స్థానం కలిగించే ఉద్ఘాటనను పాద విభజనతోనూ పాదసూచికతోనూ సూచించాం.
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: మా ప్రభువా, మా దేవా
  rationale: ఆరాధనా సందర్భంలో వ్యాసంతో ఉన్న నామపదాలు సంబోధనగా పనిచేస్తున్నాయి. ‘మా ప్రభువా, మా దేవా’ రెండు బిరుదులనూ ἡμῶν అనే సంబంధాన్నీ సహజమైన తెలుగు సంబోధనలో నిలుపుతుంది.
- source_word: λαβεῖν
  choice: పొందడానికి
  rationale: ἄξιος తరువాతి ఈ infinitive, ఆయన దేనిని పొందడానికి యోగ్యుడో తెలుపుతుంది. ఆరాధన సందర్భంలో ‘పొందడానికి’ సహజంగా సరిపోతుంది.
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: మహిమను, ఘనతను, శక్తిని
  rationale: δόξα, τιμή, δύναμις అనే మూడు పదాల ప్రత్యేకతను, స్తోత్రలయాన్ని నిలుపుతూ వరుసగా ‘మహిమ’, ‘ఘనత’, ‘శక్తి’గా అనువదించాం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: దేవుడు యోగ్యుడై ఉండడానికి ఆధారాన్ని పరిచయం చేసే కారణార్థక సంధిగా స్పష్టంగా అనువదించాం.
- source_word: σὺ ἔκτισας τὰ πάντα
  choice: నీవే సమస్తాన్ని సృష్టించావు
  rationale: σὺ అనే స్పష్టమైన సర్వనామంలోని ఉద్ఘాటనను ‘నీవే’ నిలుపుతుంది. τὰ πάντα యొక్క సమగ్ర పరిధిని ‘సమస్తాన్ని’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τὸ θέλημά σου
  choice: నీ చిత్తం కారణంగానే
  rationale: διά + accusative ఇక్కడ ప్రధానంగా కారణాన్ని సూచిస్తుంది. ‘కారణంగానే’ ఆ భావాన్ని స్పష్టంగా ఉంచుతూ దేవుని చిత్తమే సృష్టి ఉనికికి కారణమని తెలుపుతుంది; సాధనార్థక అవకాశాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: అవి ఉనికిలో ఉన్నాయి, సృష్టించబడ్డాయి
  rationale: ἦσαν మరియు ἐκτίσθησαν అనే రెండు వేర్వేరు క్రియలను కలిపివేయకుండా, వరుసగా ఉనికిని మరియు సృష్టింపబడిన కార్యాన్ని వ్యక్తం చేశాం. మూలంలోని భావ ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
theological_decisions:
- issue: దేవుని బిరుదుల సంబోధనాత్మక రూపం
  choice: మా ప్రభువా, మా దేవా
  alternative: ప్రభువూ మా దేవా
  rationale: సింహాసనంపై కూర్చున్నవానిని నేరుగా సంబోధించే ఆరాధనా సందర్భాన్ని స్పష్టంగా నిలుపుతూ, κύριος మరియు θεός రెండింటినీ విస్తరణ లేకుండా అనువదించాం.
- issue: διὰ τὸ θέλημά σουలో దేవుని చిత్తానికి సృష్టితో ఉన్న సంబంధం
  choice: నీ చిత్తం కారణంగానే
  alternative: నీ చిత్తం ద్వారానే
  rationale: διά + accusative యొక్క సాధారణ కారణార్థాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. సాధనార్థకంగా చదివే అవకాశాన్ని పూర్తిగా తొలగించకుండా పాదసూచికలో ఇచ్చాం; తద్వారా విస్తృత తాత్త్విక వివాదాలను అనువాదం తానే పరిష్కరించదు.
- issue: ἦσαν καὶ ἐκτίσθησανలో ఉనికి మరియు సృష్టి మధ్య సంబంధం
  choice: అవి ఉనికిలో ఉన్నాయి, సృష్టించబడ్డాయి
  alternative: అవి ఏర్పడ్డాయి, సృష్టించబడ్డాయి
  rationale: రెండు గ్రీకు క్రియల ప్రత్యేకతను నిలుపుతూ, వాటి తార్కిక లేదా కాలక్రమ సంబంధాన్ని అదనంగా నిర్వచించలేదు.
translation_notes:
  register: ఆరాధనా గాంభీర్యాన్ని నిలుపుతూ సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే పదాలను వాడాం. కవితాత్మక పాద విభజన గ్రీకు స్తోత్రలయాన్ని ప్రతిబింబిస్తుంది. ‘ఘనత’, ‘చిత్తం’, ‘ఉనికిలో’ వంటి పదాలు గంభీరమైనవైనా ప్రస్తుత ప్రామాణిక తెలుగులో సులభంగా గ్రహించదగినవి.
