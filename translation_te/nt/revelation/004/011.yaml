  terminology: ప్రభువు, దేవుడు, మహిమ, ఘనత, శక్తి, చిత్తం, and సృష్టించు are appropriate and consistent. The repeated possessive in మా ప్రభువా, మా దేవా is a natural Telugu way to express the shared possessive in the Greek title sequence.
