id: REV.4.2
reference: Revelation 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: te
  text: వెంటనే నేను ఆత్మలో[a] ఉన్నాను; ఇదిగో, పరలోకంలో ఒక సింహాసనం నిలిచి ఉంది, ఆ సింహాసనం మీద ఒకరు కూర్చొని ఉన్నారు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆత్మసంబంధమైన స్థితిలో.” గ్రీకు పదబంధంలో నిర్దిష్ట నిర్దేశకం లేదు; ఇది పరిశుద్ధాత్మలో ఉండడాన్నిగానీ, ఆత్మసంబంధమైన లేదా దర్శన స్థితిలో ఉండడాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: వెంటనే
  rationale: దర్శన అనుభవంలో అకస్మాత్తుగా జరిగిన మార్పును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐγενόμην
  choice: ఉన్నాను
  rationale: γίνομαι రూపం స్థితిలోకి ప్రవేశించడాన్ని సూచించగలిగినా, ἐν πνεύματιతో కలిసి తెలుగులో ‘ఆత్మలో ఉన్నాను’ అనడం సహజంగా ఉంటుంది; ‘అయ్యాను’ అనే యాంత్రిక అనువాదం అసహజంగా వినిపిస్తుంది. ‘వెంటనే’ పరివర్తన భావాన్ని సందర్భంలో నిలుపుతుంది.
- source_word: ἐν πνεύματι
  choice: ఆత్మలో
  rationale: ప్రకటన గ్రంథంలోని ప్రవచనాత్మక దర్శన స్థితిని సూచించే సంక్షిప్త పదబంధాన్ని నిలుపుతుంది. ఇది పరిశుద్ధాత్మను సూచించవచ్చు; సాధారణ ఆత్మసంబంధ దర్శనస్థితి అనే భావమూ సాధ్యమే కాబట్టి పాదటిప్పణి ఇచ్చాం.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: దర్శనంలోని కొత్త దృశ్యంపై దృష్టిని ఆకర్షించే ఉద్ఘాటనను గౌరవప్రదమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: θρόνος
  choice: ఒక సింహాసనం
  rationale: దర్శనంలో మొదటిసారిగా పరిచయమవుతున్న వస్తువును తెలుగు నిర్దిష్టతకు అనుగుణంగా ‘ఒక’తో సూచిస్తుంది.
- source_word: ἔκειτο
  choice: ఉంచబడి ఉంది
  rationale: κεῖμαι ఇక్కడ సింహాసనం ఒక చోట స్థాపితమై ఉండడాన్ని సూచిస్తుంది. ‘నిలిచి ఉంది’ కంటే ‘ఉంచబడి ఉంది’ సింహాసనానికి సహజంగా ఉండి, దాని స్థిరమైన స్థానాన్ని తెలియజేస్తుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: ఇక్కడ భావం ఆకాశమండలం కాదు, దేవుని సన్నిధితో సంబంధమున్న పరలోక స్థలం.
- source_word: καθήμενος
  choice: ఒకరు కూర్చొని ఉన్నారు
  rationale: సింహాసనంపై ఉన్న వ్యక్తి గుర్తింపును మూలపాఠం కంటే ఎక్కువగా నిర్దిష్టం చేయకుండా, substantival participle భావాన్ని సహజమైన గౌరవ ఏకవచనంలో తెలియజేస్తుంది.
theological_decisions:
- issue: ἐν πνεύματι పరిశుద్ధాత్మను సూచిస్తుందా, లేక ఆత్మసంబంధమైన దర్శనస్థితిని సూచిస్తుందా?
  choice: ఆత్మలో
  alternative: ఆత్మసంబంధమైన దర్శనస్థితిలో
  rationale: ప్రకటన గ్రంథంలో ఈ పదబంధం ప్రవచనాత్మక దర్శన అనుభవానికి సూచికగా పనిచేస్తుంది; పరిశుద్ధాత్మ కార్యాన్ని సూచించే అవకాశం బలంగా ఉంది. అయితే గ్రీకులో నిర్దిష్ట ఉపపదం లేకపోవడం వల్ల సాధారణ ఆత్మసంబంధ స్థితి అనే భావాన్ని పూర్తిగా తొలగించకూడదు; అందుకే ప్రధాన పాఠాన్ని సంక్షిప్తంగా ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన అపోకలిప్టిక్ శైలిని అనుసరించాం. ‘ఇదిగో’ దృశ్యాత్మక ఉద్ఘాటనను నిలుపుతుంది. దేవుని గుర్తింపును మూలపాఠం ఈ భాగంలో ప్రత్యక్షంగా చెప్పనందున ‘ఒకరు’ అని మాత్రమే అనువదించి, గౌరవార్థక బహువచన క్రియారూపాన్ని వాడాం.
