  to: వెంటనే నేను ఆత్మలో[a] ఉన్నాను; ఇదిగో, పరలోకంలో ఒక సింహాసనం నిలిచి ఉంది, ఆ సింహాసనం మీద ఒకరు కూర్చొని ఉన్నారు,
