revisions:
- from: 'ఆ నాలుగు జీవులు—వాటిలో ప్రతి ఒక్కదానికి ఆరు రెక్కలు ఉన్నాయి—చుట్టూ, లోపలా కళ్లతో నిండి ఉన్నాయి. అవి పగలూ రాత్రీ విశ్రాంతి లేకుండా ఇలా చెబుతూనే ఉంటాయి: “పరిశుద్ధుడు, పరిశుద్ధుడు, పరిశుద్ధుడు ప్రభువైన దేవుడు, సర్వశక్తిమంతుడు; ఉన్నవాడు, ఉండినవాడు, వస్తున్నవాడు.”[a]'
  to: 'ఆ నాలుగు జీవులు—వాటిలో ప్రతి ఒక్కదానికి ఆరు రెక్కలు ఉన్నాయి—చుట్టూ, లోపలా కళ్లతో నిండి ఉన్నాయి. అవి పగలూ రాత్రీ విశ్రాంతి లేకుండా ఇలా చెబుతూనే ఉంటాయి: “పరిశుద్ధుడు, పరిశుద్ధుడు, పరిశుద్ధుడు ప్రభువైన దేవుడు, సర్వశక్తిమంతుడు; ఉండినవాడు, ఉన్నవాడు, వస్తున్నవాడు.”[a]'
  rationale: The sole necessary correction restores the Greek sequence in the divine temporal formula. It also retains the aspect-sensitive ‘వస్తున్నవాడు’ in the main text and preserves the traditional ‘రానున్నవాడు’ as an explicitly marked alternative. No structural validation errors were supplied.
