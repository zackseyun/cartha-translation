review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the four living creatures, six wings per creature, eyes around and within, their ceaseless restlessness, and the threefold acclamation. However, the divine temporal formula reverses the first two elements: ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος is ‘the one who was, and is, and is coming,’ not ‘the one who is, was, and is coming.’ This source-order reversal is a substantive fidelity issue.'
  naturalness: The Telugu is clear, modern, and suitably elevated. ‘చుట్టూ, లోపలా కళ్లతో నిండి ఉన్నాయి’ and ‘పగలూ రాత్రీ విశ్రాంతి లేకుండా’ are natural. The revised wording retains this register while restoring the source sequence.
  terminology: ‘జీవులు’ suitably avoids reducing ζῷα to ordinary animals; ‘ప్రభువైన దేవుడు’ and ‘సర్వశక్తిమంతుడు’ appropriately render the divine titles. ‘వస్తున్నవాడు’ preserves the present-participial force of ὁ ἐρχόμενος. The traditional future-oriented alternative remains properly footnoted.
  issues:
  - severity: high
    issue: The main text reverses ‘who was’ and ‘who is’ in the divine temporal formula.
    rationale: 'The Greek order is ὁ ἦν (‘who was’), ὁ ὢν (‘who is’), καὶ ὁ ἐρχόμενος (‘and who is coming’). Telugu can express this naturally without changing the sequence: ‘ఉండినవాడు, ఉన్నవాడు, వస్తున్నవాడు.’'
  revised_text: 'ఆ నాలుగు జీవులు—వాటిలో ప్రతి ఒక్కదానికి ఆరు రెక్కలు ఉన్నాయి—చుట్టూ, లోపలా కళ్లతో నిండి ఉన్నాయి. అవి పగలూ రాత్రీ విశ్రాంతి లేకుండా ఇలా చెబుతూనే ఉంటాయి: “పరిశుద్ధుడు, పరిశుద్ధుడు, పరిశుద్ధుడు ప్రభువైన దేవుడు, సర్వశక్తిమంతుడు; ఉండినవాడు, ఉన్నవాడు, వస్తున్నవాడు.”[a]'
  revised_footnotes:
  - marker: a
    text: 'లేదా, సంప్రదాయంగా: “ఉండినవాడు, ఉన్నవాడు, రానున్నవాడు.”'
