id: REV.4.8
reference: Revelation 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: te
  text: 'ఆ నాలుగు జీవులు—వాటిలో ప్రతి ఒక్కదానికి ఆరు రెక్కలు ఉన్నాయి—చుట్టూ, లోపలా కళ్లతో నిండి ఉన్నాయి. అవి పగలూ రాత్రీ విశ్రాంతి లేకుండా ఇలా చెబుతూనే ఉంటాయి: “పరిశుద్ధుడు, పరిశుద్ధుడు, పరిశుద్ధుడు ప్రభువైన దేవుడు, సర్వశక్తిమంతుడు; ఉండినవాడు, ఉన్నవాడు, వస్తున్నవాడు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సంప్రదాయంగా: “ఉండినవాడు, ఉన్నవాడు, రానున్నవాడు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ζῷα
  choice: జీవులు
  rationale: దర్శనంలోని సజీవ పరలోక ప్రాణులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘జంతువులు’ అనడం వల్ల కలిగే తప్పుదారిని నివారిస్తూ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: వాటిలో ప్రతి ఒక్కదానికి
  rationale: ప్రతి జీవిని విడివిడిగా ఉద్దేశించే పంపిణీ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: ఆరు రెక్కలు ఉన్నాయి
  rationale: ప్రతి జీవికి ఆరు రెక్కలు ఉన్నాయని స్పష్టంగా, సహజంగా తెలుపుతుంది.
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: చుట్టూ, లోపలా
  rationale: బయటి చుట్టుపక్కలతో పాటు లోపలి భాగాన్నీ సూచించే రెండు స్థల పరిమాణాలను నిలుపుతుంది.
- source_word: γέμουσιν ὀφθαλμῶν
  choice: కళ్లతో నిండి ఉన్నాయి
  rationale: γέμω యొక్క ‘నిండియుండడం’ అనే అర్థాన్ని, దర్శనంలోని బలమైన దృశ్యాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: విశ్రాంతి లేకుండా
  rationale: ‘విశ్రాంతి/విరామం లేకపోవడం’ అనే మూలార్థాన్ని కాపాడుతుంది; కేవలం మాటలు ఆపకపోవడమనే సంకుచిత వ్యాఖ్యానాన్ని రుద్దదు.
- source_word: ἡμέρας καὶ νυκτός
  choice: పగలూ రాత్రీ
  rationale: నిరంతర క్రియను సూచించే సహజమైన ఆధునిక తెలుగు నుడికారం.
- source_word: λέγοντες
  choice: ఇలా చెబుతూనే ఉంటాయి
  rationale: వర్తమానంలో కొనసాగుతున్న ప్రకటనను సహజంగా చూపుతుంది; మూలంలో లేని అరుపు లేదా అదనపు తీవ్రతను చేర్చదు.
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: పరిశుద్ధుడు, పరిశుద్ధుడు, పరిశుద్ధుడు
  rationale: ఆరాధనా ప్రాముఖ్యతగల మూడుసార్ల పునరుక్తిని యథాతథంగా నిలుపుతుంది; తెలుగులో వ్యక్తిగత దైవసంబోధనకు తగిన పురుషలింగ ఏకవచన రూపం వాడింది.
- source_word: κύριος, ὁ θεός
  choice: ప్రభువైన దేవుడు
  rationale: రెండు దైవ బిరుదులనూ నిలుపుతూ తెలుగులో సహజమైన సంబంధ నిర్మాణాన్ని ఇస్తుంది.
- source_word: ὁ παντοκράτωρ
  choice: సర్వశక్తిమంతుడు
  rationale: సమస్త అధికారమూ శక్తీ కలిగినవాడనే దైవ బిరుదును స్థిరమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος అనే దైవ కాలసూత్రం
  choice: ఉన్నవాడు, ఉండినవాడు, వస్తున్నవాడు
  alternative: ఉండినవాడు, ఉన్నవాడు, రానున్నవాడు
  rationale: గ్రీకు పాఠంలోని క్రమాన్ని యాంత్రికంగా అనుసరించకుండా, తెలుగులో దైవ బిరుదుగా సహజంగా వినిపించే స్థిర నిర్మాణాన్ని ఉపయోగించింది; ముఖ్యంగా ὁ ἐρχόμενος లోని వర్తమాన కృదంత భావాన్ని ‘వస్తున్నవాడు’గా నిలిపి, దాన్ని కేవలం భవిష్యత్తు ‘రానున్నవాడు’గా మార్చలేదు. సంప్రదాయ భవిష్యత్ నుడికారాన్ని పాదటీపులో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ఆరాధనా శైలి. దీర్ఘ గ్రీకు వాక్యాన్ని తెలుగులో చదవడానికి సులభంగా రెండు వాక్యాలుగా అమర్చినా, భావసంబంధం మరియు దర్శన చిత్రణను కాపాడింది. ప్రధాన పాఠంలోని [a] గుర్తు ప్రత్యామ్నాయ కాలసూత్ర పాదటీపుతో సరిపోలుతుంది.
