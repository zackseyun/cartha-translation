id: REV.4.10
reference: Revelation 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: te
  text: 'ఇరవై నలుగురు పెద్దలు సింహాసనంపై కూర్చున్నవాని ఎదుట సాగిలపడతారు; ఎప్పటికీ జీవించేవానిని[a] ఆరాధిస్తారు; తమ కిరీటాలను[b] సింహాసనం ఎదుట పడవేస్తారు; ఇలా అంటారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: ‘యుగయుగాల వరకు.’'
    reason: lexical_alternative
  - marker: b
    text: ‘కిరీటాలు’ అని అనువదించిన గ్రీకు పదం గౌరవానికి గుర్తుగా ఇచ్చే విజయ మాలలను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: సాగిలపడి
  rationale: ఆరాధన సందర్భంలోని భౌతికంగా కిందికి వంగి పడే చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది; అయితే పూర్తిగా సాష్టాంగ నమస్కారం చేశారని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: ఇరవై నలుగురు పెద్దలు
  rationale: ప్రకటన గ్రంథంలోని పరలోక సభ సందర్భంలో πρεσβύτεροι అనే పదానికి సాధారణ పాఠకులకు అర్థమయ్యే ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: ἐνώπιον
  choice: ముందు
  rationale: రెండు సందర్భాల్లోనూ ‘సమక్షంలో’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: సింహాసనం మీద కూర్చున్నవాని
  rationale: సింహాసనాసీనుడైన వ్యక్తిని గ్రీకు పాఠం వర్ణనాత్మకంగా సూచించిన విధానాన్ని నిలుపుతుంది; ఆయనను అనువాదంలోనే మరింత స్పష్టంగా గుర్తించదు.
- source_word: προσκυνήσουσιν
  choice: ఆరాధిస్తారు
  rationale: దైవిక సందర్భంలో ఈ క్రియ మతపరమైన ఆరాధనను సూచిస్తుంది; కేవలం నమస్కారం లేదా గౌరవం అనే బలహీన భావానికి పరిమితం చేయదు.
- source_word: τῷ ζῶντι
  choice: జీవించే వానిని
  rationale: దేవుని నిరంతర జీవముగల స్వరూపాన్ని క్రియాత్మక వర్ణనగా ఉంచి, తెలుగులో సహజంగా అందిస్తుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాలు
  rationale: అంతం లేని కాలాన్ని సూచించే గ్రీకు నుడికారానికి సహజమైన తెలుగు రూపం; పదశః రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: βαλοῦσιν
  choice: పడవేస్తూ
  rationale: βάλλω లోని ఉద్దేశపూర్వకంగా విసరడం లేదా పడవేయడం అనే సజీవ చర్యను నిలుపుతుంది; ‘ఉంచడం’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: τοὺς στεφάνους αὐτῶν
  choice: తమ కిరీటాలను
  rationale: రాజకీయ గౌరవం మరియు విజయ పురస్కారం రెండింటినీ మోయగల సహజమైన తెలుగు పదం; చారిత్రకంగా ‘విజయ మాలలు’ అనే భావసూక్ష్మతను పాదసూచికలో తెలిపింది.
- source_word: λέγοντες
  choice: ఇలా అంటారు
  rationale: తరువాత వచ్చే మాటలను పరిచయం చేసే వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా అందిస్తుంది.
theological_decisions:
- issue: సింహాసనం మీద కూర్చున్నవాని మరియు నిత్యం జీవించేవాని నిర్దిష్ట గుర్తింపు
  choice: మూలంలోని వర్ణనాత్మక పదబంధాలనే ఉంచడం
  alternative: అనువాదంలోనే ‘తండ్రియైన దేవుడు’ అని స్పష్టంగా గుర్తించడం
  rationale: సందర్భం సింహాసనాసీనుడైన దేవుని బలంగా సూచించినా, ఈ వచనం స్వయంగా పేరుతో లేదా ‘తండ్రి’ అని గుర్తించదు. అందువల్ల మూలపాఠంలోని వర్ణన మరియు దాని ఉద్దేశపూర్వక నిర్దిష్టతలేమి నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలి వాడబడింది. ‘సాగిలపడి’ మరియు ‘ఆరాధిస్తారు’ అనే పదాలు భౌతిక చర్యను, దాని ఆధ్యాత్మిక ఉద్దేశాన్ని వేరువేరుగా నిలుపుతాయి. [a], [b] సూచికలు సంబంధిత పదాల వెంటనే ఉంచబడ్డాయి.
