id: REV.4.4
reference: Revelation 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: te
  text: సింహాసనం చుట్టూ ఇరవై నాలుగు సింహాసనాలు ఉన్నాయి. ఆ సింహాసనాల మీద తెల్లని వస్త్రాలు ధరించిన ఇరవై నలుగురు పెద్దలు కూర్చుని ఉన్నారు; వారి తలల మీద బంగారు కిరీటాలు[a] ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విజయ కిరీటాలు’ లేదా ‘విజయమాలలు.’ ఇక్కడి గ్రీకు పదం రాజకిరీటాన్ని మాత్రమే కాక, గౌరవం లేదా విజయానికి బహుమతిగా ఇచ్చే కిరీటాన్ని లేదా మాలను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: చుట్టూ
  rationale: కేంద్ర సింహాసనాన్ని ఆవరించి ఉన్న ప్రాదేశిక అమరికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: θρόνοι
  choice: సింహాసనాలు
  rationale: కేంద్రంలోని సింహాసనానికి, దాని చుట్టూ ఉన్న ఇరవై నాలుగు ఆసనాలకు గ్రీకులో ఒకే పదం వాడబడింది. అందువల్ల రాజసంబంధమైన, న్యాయాధికార సంబంధమైన దృశ్యాన్ని నిలుపుతూ అదే పదబంధ సంబంధాన్ని కాపాడుతుంది.
- source_word: εἴκοσι τέσσαρες
  choice: ఇరవై నాలుగు / ఇరవై నలుగురు
  rationale: వస్తువులైన సింహాసనాలతో ‘ఇరవై నాలుగు’, వ్యక్తులైన పెద్దలతో సహజ తెలుగు ప్రకారం ‘ఇరవై నలుగురు’ వాడబడింది.
- source_word: πρεσβυτέρους
  choice: పెద్దలు
  rationale: ఇక్కడ ఇది కేవలం వయస్సును సూచించకుండా ఒక గుర్తింపుగల సమూహానికి బిరుదుగా ఉంది; ‘పెద్దలు’ ఆ అర్థాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: καθημένους
  choice: కూర్చుని ఉన్నారు
  rationale: దృశ్యంలో వారి స్థితిని సహజమైన తెలుగు క్రియారూపంలో వ్యక్తం చేస్తుంది.
- source_word: περιβεβλημένους ἐν ἱματίοις λευκοῖς
  choice: తెల్లని వస్త్రాలు ధరించిన
  rationale: వారు వస్త్రాలు ధరించి ఉన్న స్థితిని తెలియజేస్తుంది; ‘అంగీలు’ వంటి మరీ నిర్దిష్టమైన వస్త్రరూపాన్ని మూలపాఠం నిర్బంధించదు.
- source_word: στεφάνους
  choice: కిరీటాలు
  rationale: సందర్భంలో తలపై ధరించే గౌరవ లేదా విజయ చిహ్నాన్ని స్పష్టంగా తెలియజేసే సాధారణ పదం. గ్రీకు పదంలోని ‘విజయమాల’ భావసాధ్యతను పాదటీపులో ఉంచాం.
- source_word: χρυσοῦς
  choice: బంగారు
  rationale: పదార్థాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: చుట్టూ ఉన్న ఇరవై నాలుగు θρόνοι స్వభావం
  choice: ‘ఆసనాలు’ అని కాక ‘సింహాసనాలు’ అని అనువదించాం.
  alternative: కేంద్ర సింహాసనంతో సమానమైన సార్వభౌమాధికారాన్ని సూచించకుండా ఉండేందుకు ‘ఆసనాలు’ అని అనువదించడం.
  rationale: గ్రీకు పాఠం కేంద్ర సింహాసనానికీ చుట్టూ ఉన్న వాటికీ θρόνος అనే ఒకే పదాన్ని పునరావృతం చేస్తుంది. ‘సింహాసనాలు’ ఆ పదసంబంధాన్ని, రాజసంబంధమైన లేదా న్యాయాధికార సంబంధమైన చిత్రణను నిలుపుతుంది; పెద్దల అధికార స్వరూపాన్ని మాత్రం నిర్ణయించదు.
- issue: ఇరవై నలుగురు పెద్దల గుర్తింపు
  choice: వారిని అదనపు వివరణ లేకుండా ‘పెద్దలు’ అని మాత్రమే పేర్కొన్నాం.
  alternative: వారిని సంఘ ప్రతినిధులు, దేవదూతలవంటి జీవులు, లేదా ఇశ్రాయేలు గోత్రాలు మరియు అపొస్తలుల ప్రతినిధులు అని విస్తరించి చెప్పడం.
  rationale: ఈ వచనం వారిని πρεσβύτεροι అని పిలుస్తుంది గాని వారి గుర్తింపును వివరించదు. కాబట్టి అనువాదం ఆ ఉద్దేశపూర్వక అనిర్ణీతతను కాపాడుతుంది.
- issue: στεφάνους యొక్క భావపరిధి
  choice: ప్రధాన పాఠంలో ‘కిరీటాలు’ అని ఇచ్చి, విజయానికి లేదా గౌరవానికి ఇచ్చే కిరీటం/మాల భావాన్ని పాదటీపులో తెలిపాం.
  alternative: ప్రధాన పాఠంలోనే ‘విజయ కిరీటాలు’ లేదా ‘విజయమాలలు’ అని నిర్దిష్టీకరించడం.
  rationale: στέφανος గౌరవం లేదా విజయానికి సంబంధించిన కిరీటాన్ని సూచించగలదు; అయితే ఈ వచనం దాని ఖచ్చితమైన సంకేతార్థాన్ని వివరించదు. అందువల్ల ప్రధాన పాఠం విస్తృత పదాన్ని ఉంచి, నిజమైన లాక్షణిక ప్రత్యామ్నాయాన్ని పాదటీపులో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని దృశ్య క్రమాన్ని నిలుపుతూ, తెలుగులో భారంగా మారకుండా రెండు వాక్యాలుగా విభజించాం. పాదటీపు గుర్తును దాని విషయమైన ‘కిరీటాలు’ వెంట ఉంచాం.
