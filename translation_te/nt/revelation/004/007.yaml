id: REV.4.7
reference: Revelation 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: te
  text: మొదటి జీవి సింహంలా ఉంది; రెండవ జీవి దూడలా ఉంది; మూడవ జీవికి మనిషి వంటి ముఖం[a] ఉంది; నాలుగవ జీవి ఎగురుతున్న డేగలా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవ ముఖం.”
    reason: ἀνθρώπου అనే పదం సాధారణంగా మానవుణ్ణి సూచిస్తుంది. ప్రధాన పాఠం ὡς తెలిపే పోలికను “మనిషి వంటి” అని స్పష్టంగా నిలుపుతుంది; ప్రత్యామ్నాయం సహజమైన విశేషణ ప్రయోగాన్ని ఇస్తుంది.
lexical_decisions:
- source_word: ζῷον
  choice: జీవి
  rationale: సింహాసనం చుట్టూ ఉన్న ఈ ప్రాణముగల సృష్టులను సూచించడానికి సహజమైన తెలుగు పదం. ప్రకటన గ్రంథంలో తరువాత కనిపించే విరోధ స్వభావంగల θηρίον (‘మృగం’)తో తేడాను కూడా ఇది నిలుపుతుంది.
- source_word: ὅμοιον
  choice: లా ఉంది
  rationale: ఇది గుర్తింపు కాదు, పోలికను సూచిస్తుంది; ‘లా ఉంది’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: λέοντι
  choice: సింహం
  rationale: మూలంలోని జంతువు పేరుకు నేరమైన, సహజమైన సమానార్థకం.
- source_word: μόσχῳ
  choice: దూడ
  rationale: μόσχος సాధారణంగా దూడను లేదా చిన్న వయసు గల పశువును సూచిస్తుంది. లింగాన్ని లేదా బలి సంబంధమైన భావాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘దూడ’ మూలార్థాన్ని నిలుపుతుంది.
- source_word: ἔχων
  choice: ఉంది
  rationale: గ్రీకు వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన సమాపక క్రియతో వ్యక్తం చేసి, మూడవ జీవి ముఖాన్ని వర్ణించే భావాన్ని నిలిపాం.
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: మనిషి ముఖంలాంటి ముఖం
  rationale: πρόσωπον అంటే ‘ముఖం’; ὡς పోలికను సూచిస్తుంది. ἀνθρώπου ఇక్కడ సాధారణంగా మానవుణ్ణి సూచిస్తుంది కాబట్టి ‘మనిషి’ అని అనువదించడం లింగాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἀετῷ πετομένῳ
  choice: ఎగురుతున్న గద్ద
  rationale: ἀετόςకు సందర్భానుకూలమైన సాధారణ అర్థం ‘గద్ద’; πετομένῳ ఆ గద్ద ఎగురుతున్న స్థితిని ప్రత్యక్షంగా వర్ణిస్తుంది.
theological_decisions:
- issue: మూడవ జీవి ముఖ వర్ణనలో ἀνθρώπου అర్థం
  choice: మనిషి ముఖంలాంటి ముఖం
  alternative: మానవ ముఖం
  rationale: ἀνθρώπου ఒక మానవుణ్ణి సాధారణంగా సూచించగలదు; దానిని ప్రత్యేకంగా పురుషునిగా పరిమితం చేయలేదు. అదే సమయంలో ὡς తెలిపే పోలికను ప్రధాన పాఠంలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. సమన్వయ వాక్య భాగాలను స్పష్టంగా చూపడానికి అర్ధవిరామ చిహ్నాలు ఉపయోగించబడ్డాయి.
