id: REV.4.5
reference: Revelation 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: te
  text: సింహాసనం నుండి మెరుపులూ, ధ్వనులూ[a], ఉరుములూ వెలువడుతున్నాయి. సింహాసనం ఎదుట అగ్నితో మండుతున్న ఏడు దీపాలు[b] ఉన్నాయి; అవి దేవుని ఏడు ఆత్మలు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్వరాలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అగ్నితో మండుతున్న ఏడు దివిటీలు.’
    reason: lexical_alternative
  - marker: c
    text: ‘దేవుని ఏడు ఆత్మలు’ అనేది ఒకే పరిశుద్ధాత్మ యొక్క సంపూర్ణతను సూచించే ప్రతీకాత్మక మాట అని చాలామంది అర్థం చేసుకుంటారు; అయితే గ్రీకు పాఠంలో ‘ఏడు ఆత్మలు’ అనే బహువచనమే ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: వెలువడుతున్నాయి
  rationale: ἐκ తో కూడిన వర్తమాన క్రియ సింహాసనం నుండి ఈ దృశ్య-శ్రవ్య ఘటనలు నిరంతరం ఉద్భవిస్తున్న భావాన్ని ఇస్తుంది; ‘వెలువడుతున్నాయి’ సహజంగా ఆ దిశా భావాన్నీ వర్తమానత్వాన్నీ నిలుపుతుంది.
- source_word: ἀστραπαὶ
  choice: మెరుపులు
  rationale: బహువచనంలోని పునరావృత మెరుపు ఘటనలను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: φωναὶ
  choice: ధ్వనులు
  rationale: φωνή కు ‘స్వరాలు/కంఠధ్వనులు’ లేదా విస్తృతంగా ‘ధ్వనులు’ అనే అర్థాలు ఉన్నాయి. మెరుపులు, ఉరుములతో కూడిన సందర్భంలో వ్యక్తిగత మాటలను అనవసరంగా నిర్దేశించకుండా ‘ధ్వనులు’ మూలంలోని అస్పష్టతను సముచితంగా ఉంచుతుంది.
- source_word: βρονταί
  choice: ఉరుములు
  rationale: బహువచనంలోని పునరావృత ఉరుము శబ్దాలను సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: λαμπάδες πυρὸς
  choice: అగ్నితో మండుతున్న ఏడు దీపాలు
  rationale: λαμπάς కు దీపం లేదా దివిటీ అనే అర్థం రావచ్చు; πυρός మరియు καιόμεναι కలిపి అగ్నితో మండే వెలుగు సాధనాల చిత్రాన్ని ఇస్తాయి. ప్రధాన పాఠంలో ‘దీపాలు’ చదవడానికి సహజంగా ఉండగా, ‘దివిటీలు’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: καιόμεναι
  choice: మండుతున్న
  rationale: వర్తమాన కృదంతం నిరంతరంగా మండుతున్న స్థితిని సూచిస్తుంది.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: సింహాసనం ఎదుట
  rationale: సింహాసనానికి ముందున్న స్థల సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἅ εἰσιν
  choice: అవి
  rationale: ముందున్న ఏడు దీపాలను తిరిగి సూచించి వాటి ప్రతీకాత్మక గుర్తింపును సహజ తెలుగులో పరిచయం చేస్తుంది.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: దేవుని ఏడు ఆత్మలు
  rationale: గ్రీకు మూలంలోని స్పష్టమైన బహువచనాన్ని అలాగే నిలుపుతుంది; దాన్ని ‘ఏడంతల ఆత్మ’గా మార్చి ప్రతీకార్థాన్ని ముందుగానే నిర్ణయించదు.
theological_decisions:
- issue: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ యొక్క అర్థనిర్ణయం
  choice: ప్రధాన పాఠంలో ‘దేవుని ఏడు ఆత్మలు’ అని బహువచనంగానే అనువదించడం.
  alternative: దేవుని పరిశుద్ధాత్మ సంపూర్ణతను సూచించే ప్రతీకాత్మక వర్ణనగా గ్రహించడం.
  rationale: మూల గ్రీకు పాఠం ‘ఏడు ఆత్మలు’ అని స్పష్టంగా బహువచనంలో ఉంది. ‘ఏడంతల ఆత్మ’ లేదా ‘ఒకే పరిశుద్ధాత్మ యొక్క సంపూర్ణత’ అని ప్రధాన పాఠంలో పెట్టడం అనువాదం కంటే వ్యాఖ్యానమవుతుంది; అందుచేత మూలంలోని వేదాంతపరమైన ఉద్వేగాన్ని నిలిపి, సాధ్యమైన వ్యాఖ్యానాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ ప్రకటన గ్రంథంలోని గంభీరమైన సింహాసన-దర్శన శైలిని నిలిపింది. ‘ధ్వనులు’ మరియు ‘దేవుని ఏడు ఆత్మలు’ ద్వారా మూలంలోని నిజమైన లాక్షణిక, వేదాంతపరమైన అస్పష్టతను పరిష్కరించకుండా సంరక్షించింది.
