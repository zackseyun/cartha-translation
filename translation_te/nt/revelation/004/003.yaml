id: REV.4.3
reference: Revelation 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: te
  text: అక్కడ సింహాసనంపై కూర్చున్నవాడు చూడటానికి యాస్పిస్, కర్ణేలియన్ రత్నాలవలె ఉన్నాడు; ఆ సింహాసనం చుట్టూ మరకతంలా కనిపించే ఇంద్రధనస్సు[a] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభామండలం”; గ్రీకు పదం ఇంద్రధనస్సువంటి ప్రకాశాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: అక్కడ సింహాసనంపై కూర్చున్నవాడు
  rationale: ఇది నామవాచకార్థంలో వాడిన వర్తమాన కృదంతం; మునుపటి వచనంలోని సింహాసన సందర్భాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తూ, నిరంతరంగా సింహాసనాసీనుడై ఉన్న భంగిమను నిలుపుతుంది.
- source_word: ὅμοιος ὁράσει
  choice: చూడడానికి ...లా / ...లా కనిపించే
  rationale: ὁράσει అనే దత్తివిభక్తి రూపం రూపసాదృశ్య పరిధిని సూచిస్తుంది. ఈ అనువాదం వస్తుగత సమానత్వాన్ని కాక దర్శనంలో కనిపించిన పోలికను కాపాడుతుంది.
- source_word: λίθῳ ἰάσπιδι
  choice: యాస్పిస్ రాయిలా
  rationale: ἴασπιςకు సంప్రదాయ రత్ననామమైన ‘యాస్పిస్’ను ఉంచి, λίθοςను ‘రాయి’గా వ్యక్తం చేసింది; ప్రాచీన రత్నాన్ని ఆధునిక ఖనిజంతో అతిగా నిర్ధారించదు.
- source_word: σαρδίῳ
  choice: కర్ణేలియన్ రాయిలా
  rationale: ఎర్రటి-నారింజ వర్ణపు రత్నాన్ని ఆధునిక పాఠకునికి గుర్తించదగిన ‘కర్ణేలియన్’గా ఇస్తుంది; ‘మాణిక్యం’ అనడం అతిగా నిర్దిష్టం అవుతుంది.
- source_word: ἶρις
  choice: ఇంద్రధనస్సు
  rationale: ప్రళయదర్శన సందర్భంలో సింహాసనాన్ని చుట్టుముట్టిన ఇంద్రధనస్సువంటి ప్రకాశానికి ఇది అత్యంత ప్రత్యక్షమైన సహజ తెలుగు పదం; ‘ప్రభామండలం’ సాధ్యమైన ప్రత్యామ్నాయం కావడంతో పాదటిప్పణిలో ఇచ్చింది.
- source_word: κυκλόθεν τοῦ θρόνου
  choice: సింహాసనం చుట్టూ
  rationale: చుట్టుముట్టిన స్థానాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὅμοιος ὁράσει σμαραγδίνῳ
  choice: మరకతంలా కనిపించే
  rationale: σμαράγδινος సూచించే పచ్చని మరకత సాదృశ్యాన్ని కాపాడుతూ, అది నిజంగా మరకతంతో చేసినదని చెప్పకుండా దృశ్య పోలికగానే ఉంచుతుంది.
theological_decisions:
- issue: సింహాసనాసీనుడిని ప్రత్యక్ష భౌతిక వర్ణనగా కాక ఉపమానాలతో చిత్రించడం
  choice: ‘చూడడానికి ...లా’ అనే రూపసాదృశ్య భాషను నిలుపడం
  alternative: ఆయన రత్నాలతో చేయబడ్డాడని లేదా రత్నవర్ణ కాంతిని వెదజల్లాడని వ్యాఖ్యానాత్మకంగా చెప్పడం
  rationale: గ్రీకు వాక్యం రెండుసార్లు పోలికను సూచిస్తుంది. అందువల్ల దర్శనంలోని సాదృశ్యాన్ని మాత్రమే తెలిపి, దానిని సింహాసనాసీనుడి భౌతిక స్వరూపంపై నిశ్చిత ప్రకటనగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. అరుదైన రత్ననామాలు మూలంలోని అనిశ్చితిని అతిగా పరిష్కరించకుండా లిప్యంతరీకరణ/ఆధునిక రత్నపేర్లతో ఇవ్వబడ్డాయి; పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
