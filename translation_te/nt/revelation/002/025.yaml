  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: te
  text: అయినప్పటికీ[a], నేను వచ్చేవరకు మీకు ఉన్నదాన్ని గట్టిగా పట్టుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కేవలం నేను వచ్చేవరకు మీకు ఉన్నదాన్ని గట్టిగా పట్టుకోండి.”
    reason: πλὴν అనే పదం ఇక్కడ విరోధాత్మకంగా ‘అయినప్పటికీ’ అనే భావాన్నీ, పరిమితిని సూచిస్తూ ‘కేవలం’ అనే భావాన్నీ ఇవ్వగలదు.
lexical_decisions:
- source_word: πλὴν
  choice: అయినా
  rationale: ముందటి మాటల అనంతరం మినహాయింపు లేదా పరిమితిని సూచించే విరోధాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ‘కేవలం’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: ὃ ἔχετε
  choice: మీకు ఉన్నదాన్ని
  rationale: నపుంసకలింగ సంబంధవాచక నిర్మాణాన్ని సాధారణంగానూ స్పష్టంగానూ వ్యక్తపరుస్తూ, వారు ప్రస్తుతం కలిగివున్నదేమిటో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: κρατήσατε
  choice: గట్టిగా పట్టుకోండి
  rationale: κρατέω యొక్క ఆజ్ఞార్థక బలాన్ని, దృఢంగా నిలుపుకోవాలనే భావాన్ని సహజమైన తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: ἄχρι οὗ ἂν
  choice: వచ్చేవరకు
  rationale: వక్త రాకను భవిష్యత్ కాలపరిమితిగా సహజంగా సూచిస్తుంది.
- source_word: ἥξω
  choice: నేను వచ్చేవరకు
  rationale: ἥκωలోని రావడం/చేరుకోవడం భావాన్ని నిలుపుతూ, అది తుదిరాకనా లేక తీర్పు నిమిత్తమైన రాకనా అన్న విషయాన్ని అనువాదంలో నిర్దిష్టం చేయదు.
theological_decisions:
- issue: యేసు చెప్పిన రాక తుదికాలపు రాకనే సూచిస్తుందా, లేక ఈ సంఘాన్ని తీర్పు/సందర్శన కోసం రావడాన్నా సూచిస్తుందా?
  choice: “నేను వచ్చేవరకు” అని మాత్రమే అనువదించడం
  alternative: “నేను తీర్పు తీర్చడానికి వచ్చేవరకు” లేదా “నా తుదిరాక వరకు”
  rationale: గ్రీకు వాక్యం ఈ రాక యొక్క విధానాన్ని లేదా సమయాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల మూలంలోని ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం ఉపయోగించబడింది. ‘గట్టిగా పట్టుకోండి’ అనేది దృఢంగా నిలుపుకోవాలనే రూపకార్థాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
