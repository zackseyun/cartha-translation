review_pass:
  verdict: revise
  source_fidelity: The translation accurately preserves the singular address in the first and final clauses, the plural reference to some within the audience, the imminence expressed by μέλλω, imprisonment, testing, ten days of affliction, and the promise of the crown of life. However, “అప్పుడు” (“then”) adds a sequential/inferential element not expressed in the Greek and should be omitted.
  naturalness: The Telugu is clear, modern, and appropriately dignified. “చెరసాలలో వేయబోతున్నాడు,” “శ్రమ అనుభవిస్తారు,” and “నమ్మకంగా ఉండు” are natural in this register.
  terminology: '“అపవాది,” “శ్రమ,” and “జీవ కిరీటం” are suitable established biblical terms. Footnote a should express the passive alternative for πειρασθῆτε more accurately: “ప్రలోభానికి గురయ్యేలా,” rather than “ప్రలోభపరచబడేలా,” which can suggest causing someone else to be tempted.'
  issues:
  - severity: low
    issue: Added connective “అప్పుడు”
    rationale: The Greek simply coordinates the command and promise with καί (“and”); it does not state “then.” Removing it more closely reflects the source without impairing Telugu flow.
  - severity: low
    issue: Footnote a’s temptation alternative is imprecise in Telugu
    rationale: πειρασθῆτε is passive (“that you may be tested/tempted”). “ప్రలోభానికి గురయ్యేలా” naturally conveys being tempted, whereas “ప్రలోభపరచబడేలా” is potentially ambiguous and less idiomatic.
  revised_text: నీవు అనుభవించబోయే బాధలకు ఏమాత్రం భయపడకు. ఇదిగో, మీరు పరీక్షించబడేలా[a] అపవాది మీలో కొందరిని చెరసాలలో వేయబోతున్నాడు; మీరు పది రోజులపాటు శ్రమ అనుభవిస్తారు. మరణం వరకు[b] నమ్మకంగా ఉండు; నేను నీకు జీవ కిరీటాన్ని[c] ఇస్తాను.
