revisions:
- from: నీవు అనుభవించబోయే బాధలకు ఏమాత్రం భయపడకు. ఇదిగో, మీరు పరీక్షించబడేలా[a] అపవాది మీలో కొందరిని చెరసాలలో వేయబోతున్నాడు; మీరు పది రోజులపాటు శ్రమ అనుభవిస్తారు. మరణం వరకు[b] నమ్మకంగా ఉండు; అప్పుడు నేను నీకు జీవ కిరీటాన్ని[c] ఇస్తాను.
