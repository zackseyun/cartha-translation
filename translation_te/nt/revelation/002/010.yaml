id: REV.2.10
reference: Revelation 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: te
  text: నీవు అనుభవించబోయే బాధలకు ఏమాత్రం భయపడకు. ఇదిగో, మీరు పరీక్షించబడేలా[a] అపవాది మీలో కొందరిని చెరసాలలో వేయబోతున్నాడు; మీరు పది రోజులపాటు శ్రమ అనుభవిస్తారు. మరణం వరకు[b] నమ్మకంగా ఉండు; నేను నీకు జీవ కిరీటాన్ని[c] ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శోధించబడేలా’ లేదా ‘ప్రలోభానికి గురయ్యేలా’ అని కూడా అనువదించవచ్చు; గ్రీకు క్రియ సందర్భాన్నిబట్టి పరీక్ష, శోధన లేదా ప్రలోభం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘మరణం వరకు’ అనే మాటకు ‘మరణించాల్సి వచ్చినా’ లేదా ‘మరణం దాకా’ అనే భావం కూడా ఉండవచ్చు; అంటే హతసాక్షిగా మరణించాల్సి వచ్చినా నమ్మకంగా ఉండాలి.
    reason: alternative_reading
  - marker: c
    text: ‘కిరీటం’ అని అనువదించిన గ్రీకు పదం (stephanos) రాజు ధరించే మకుటాన్ని కాకుండా విజేతకు బహుమతిగా ఇచ్చే విజయమాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: ఏమాత్రం భయపడకు
  rationale: μηδέν‌తో కూడిన నిషేధాజ్ఞ భయానికి తావివ్వవద్దనే బలాన్ని కలిగి ఉంది; ఈ తెలుగు ప్రయోగం సహజంగా ఆ బలాన్ని తెలియజేస్తుంది.
- source_word: ἃ μέλλεις πάσχειν
  choice: నీవు అనుభవించబోయే బాధలు
  rationale: μέλλω సమీప భవిష్యత్తును, πάσχω బాధను అనుభవించడాన్ని సూచిస్తాయి. ఈ రూపం రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే విషయంపై శ్రద్ధ నిలిపే గ్రీకు సంభాషణా సూచకానికి గౌరవప్రదమైన, ప్రస్తుత తెలుగులో సుపరిచితమైన సమానం.
- source_word: μέλλει βάλλειν
  choice: వేయబోతున్నాడు
  rationale: μέλλωలోని ఆసన్నతను ‘బోతున్నాడు’ తెలియజేస్తుంది; చెరసాల సందర్భంలో βάλλωకు ‘వేయు’ సహజంగా సరిపోతుంది.
- source_word: ὁ διάβολος
  choice: అపవాది
  rationale: ఈ సందర్భంలో వ్యక్తిగతమైన దుష్ట ప్రత్యర్థిని సూచించే స్థిరమైన బైబిలు బిరుదు; పదంలోని అపనిందకుడు అనే మూలభావాన్నీ నిలుపుతుంది.
- source_word: ἐξ ὑμῶν
  choice: మీలో కొందరిని
  rationale: సమూహం నుండి ఒక భాగాన్ని సూచించే గ్రీకు నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς φυλακήν
  choice: చెరసాలలో
  rationale: φυλακή ఇక్కడ నిర్బంధ స్థలాన్ని సూచిస్తుంది; ‘చెరసాల’ వాక్య గాంభీర్యానికి తగిన పదం.
- source_word: ἵνα πειρασθῆτε
  choice: మీరు పరీక్షించబడేలా
  rationale: πειράζω పరీక్ష, శోధన లేదా ప్రలోభం అనే భావాలను కలిగి ఉండగలదు. హింసా సందర్భంలో ‘పరీక్షించబడడం’ ప్రధాన భావాన్ని సహజంగా అందిస్తుంది; ఇతర సాధ్య భావాలు పాదసూచికలో ఉన్నాయి.
- source_word: ἕξετε θλῖψιν
  choice: మీరు శ్రమ అనుభవిస్తారు
  rationale: θλῖψις సూచించే అణచివేసే బాధను ‘శ్రమ’ సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది; ἕξετεను తెలుగులో సహజంగా ‘అనుభవిస్తారు’ అని వ్యక్తం చేశాం.
- source_word: ἡμερῶν δέκα
  choice: పది రోజులపాటు
  rationale: కాలవ్యాప్తిని సూచించే గ్రీకు షష్ఠీ విభక్తిని సహజమైన తెలుగు కాలవ్యవధి రూపంతో అనువదిస్తుంది.
- source_word: γίνου πιστός
  choice: నమ్మకంగా ఉండు
  rationale: ప్రస్తుత ఆజ్ఞారూపం విశ్వాసపాత్ర స్థితిలో నిలకడగా కొనసాగాలనే పిలుపును సూచిస్తుంది; ‘నమ్మకంగా ఉండు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: ἄχρι θανάτου
  choice: మరణం వరకు
  rationale: గ్రీకు పదబంధానికి సూటిగా సమానమైన రూపం; జీవితాంతం నిలకడతో పాటు మరణాన్ని ఎదుర్కోవలసి వచ్చినా నమ్మకంగా ఉండాలనే భావాన్ని సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: జీవ కిరీటం
  rationale: గ్రీకు సంబంధబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది. στέφανος రాజమకుటం కంటే విజేతకు ఇచ్చే కిరీటాన్ని సూచిస్తుందనే సాంస్కృతిక వివరాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: అపవాది మరియు హింస సందర్భంలో πειρασθῆτε అర్థం
  choice: పరీక్షించబడేలా
  alternative: శోధించబడేలా లేదా ప్రలోభపరచబడేలా
  rationale: చెరసాల, శ్రమ, నమ్మకత్వం అనే తక్షణ సందర్భం విశ్వాసం పరీక్షించబడటాన్ని ప్రధానంగా సూచిస్తుంది. అయినా గ్రీకు క్రియలోని శోధన/ప్రలోభం సాధ్యతను పాదసూచికలో నిలిపాం.
- issue: ἄχρι θανάτου యొక్క పరిధి
  choice: మరణం వరకు
  alternative: మరణించాల్సి వచ్చినా లేదా మరణం దాకా
  rationale: సూటి అనువాదం జీవితాంత నమ్మకత్వాన్నీ, అవసరమైతే హతసాక్షిత్వం వరకు నిలబడటాన్నీ రెండింటినీ అనుమతిస్తుంది; ఒకే వివరణకు వాక్యాన్ని పరిమితం చేయదు.
- issue: στέφανος యొక్క ప్రతీకాత్మక స్వభావం
  choice: కిరీటం
  alternative: విజయమాల
  rationale: తెలుగులో స్థిరపడిన బైబిలు ప్రతీకను ‘కిరీటం’ నిలుపుతుంది; అయితే దానిని రాజమకుటంగా అపార్థం చేసుకోకుండా అసలు సాంస్కృతిక భావాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ఏకవచన సంబోధన (‘నీవు’, ‘నీకు’) మరియు సంఘ సభ్యులను సూచించే బహువచనం (‘మీరు’, ‘మీలో’) జాగ్రత్తగా నిలుపబడ్డాయి. ‘ఇదిగో’ ప్రకటనాత్మక బలాన్ని, ‘చెరసాల’, ‘శ్రమ’, ‘జీవ కిరీటం’ ప్రకటన గ్రంథానికి తగిన గాంభీర్యాన్ని కాపాడుతాయి.
