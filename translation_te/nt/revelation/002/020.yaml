id: REV.2.20
reference: Revelation 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: te
  text: 'అయితే నీ విషయంలో నాకు ఈ అభ్యంతరం ఉంది: తాను ప్రవక్త్రినని చెప్పుకునే[b] యెజెబెలు అనే స్త్రీని[a] నువ్వు సహిస్తున్నావు. ఆమె నా దాసులు లైంగిక అవినీతికి పాల్పడేలా, విగ్రహాలకు అర్పించిన ఆహారం తినేలా వారికి బోధిస్తూ వారిని మోసగిస్తోంది[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘యెజెబెలు అనే స్త్రీని’ అనే మాటలకు బదులు ‘నీ భార్య యెజెబెలును’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘తాను ప్రవక్త్రినని వాదించే.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘వారిని తప్పుదారి పట్టిస్తోంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందటి ప్రశంసకు భిన్నంగా ఇప్పుడు అభ్యంతరాన్ని ప్రవేశపెట్టే వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔχω κατὰ σοῦ
  choice: నీ విషయంలో నాకు ఈ అభ్యంతరం ఉంది
  rationale: ఒకరిపై ఉన్న ఆరోపణ లేదా ఫిర్యాదును సూచించే గ్రీకు నుడికారాన్ని సహజంగా, దాని గంభీరతను నిలుపుతూ అందిస్తుంది.
- source_word: ἀφεῖς
  choice: నువ్వు సహిస్తున్నావు
  rationale: హానికరమైన కార్యం కొనసాగడానికి అనుమతిస్తున్న బాధ్యతాయుత నిర్లక్ష్యాన్ని సూచిస్తుంది; కేవలం ‘వదిలివేయడం’ అనే భావానికి పరిమితం కాదు.
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: యెజెబెలు అనే స్త్రీని
  rationale: ‘ఆ స్త్రీ యెజెబెలు’ అనే మూలపాఠ భావాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచుతుంది; ‘నీ భార్య’ అనే పాఠాంతరాన్ని ప్రధాన పాఠంలో చేర్చదు.
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: తాను ప్రవక్త్రినని చెప్పుకునే
  rationale: ఆమె తనకుతానే ఆ హోదాను ఆపాదించుకుంటోందనే భావాన్ని నిలుపుతుంది; స్త్రీలింగ నామవాచకాన్ని ‘ప్రవక్త్రి’గా స్పష్టంగా చూపిస్తుంది.
- source_word: διδάσκει
  choice: బోధిస్తూ
  rationale: కొనసాగుతున్న బోధనా కార్యాన్ని, తరువాతి సమాంతర క్రియతో సహజమైన తెలుగు వాక్య నిర్మాణంలో కలుపుతుంది.
- source_word: πλανᾷ
  choice: మోసగిస్తోంది
  rationale: సత్యం లేదా సరైన ప్రవర్తన నుండి దారి మళ్లించే క్రియను బలంగా వ్యక్తం చేస్తుంది; ‘తప్పుదారి పట్టిస్తోంది’ అనే భావ ఛాయను పాదటిప్పణిలో నిలుపుతుంది.
- source_word: τοὺς ἐμοὺς δούλους
  choice: నా దాసులు
  rationale: వారు క్రీస్తుకు చెందినవారనే యాజమాన్య, విధేయత భావాన్ని ‘దాసులు’ నిలుపుతుంది; ‘సేవకులు’ కంటే δοῦλος యొక్క బంధిత సంబంధాన్ని మరింత స్పష్టంగా తెలియజేస్తుంది.
- source_word: πορνεῦσαι
  choice: లైంగిక అవినీతికి పాల్పడేలా
  rationale: అనుచిత లైంగిక ప్రవర్తనలో పాల్గొనడాన్ని ఆధునిక, స్పష్టమైన, మర్యాదగల భాషలో తెలియజేస్తుంది.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: విగ్రహాలకు అర్పించిన ఆహారం తినేలా
  rationale: అన్యదేవతారాధన బలులతో సంబంధమున్న ఆహారాన్ని స్పష్టంగా, సహజంగా వివరిస్తుంది.
theological_decisions:
- issue: ‘యెజెబెలు’ గుర్తింపు
  choice: ఇది ఆమె అసలు పేరా, లేక పాత నిబంధనలోని యెజెబెలును సూచించే ప్రతీకాత్మక పేరా అని నిర్ణయించకుండా ‘యెజెబెలు’ అనే రూపాన్నే నిలుపడం.
  alternative: ఆమె అసలు పేరు యెజెబెలు అని స్పష్టీకరించడం; లేదా ఇది పూర్తిగా ప్రతీకాత్మక బిరుదని అనువదించడం.
  rationale: ఈ వచనం ఆ ప్రశ్నను పరిష్కరించదు. అందువల్ల మూలంలోని అనిశ్చితిని అనువాదం నిలుపుతుంది.
- issue: δοῦλος పదం
  choice: దాసులు
  alternative: సేవకులు
  rationale: ‘నా’ అనే స్వామ్య సూచనతో కలిసి ఈ పదం క్రీస్తుకు చెందినవారనే బంధిత విధేయతను ముందుకు తెస్తుంది. ‘దాసులు’ ఆ బలాన్ని నిలుపుతూ తెలుగులో బైబిలు సంబంధ గంభీరతను కలిగి ఉంది.
- issue: బోధించడం మరియు మోసగించడం మధ్య సంబంధం
  choice: ‘బోధిస్తూ వారిని మోసగిస్తోంది’ అని రెండు కొనసాగుతున్న కార్యాలనూ నిలుపడం.
  alternative: ఆమె బోధనే మోసం అని ఒకే క్రియగా కలిపి చెప్పడం.
  rationale: గ్రీకులో καὶ ద్వారా రెండు క్రియలు వేరుగా ఉన్నందున, వాటిని పూర్తిగా ఒకే భావంగా కుదించకుండా ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ప్రత్యక్ష సంబోధనను ఉపయోగించాం. ‘నువ్వు’ ఏకవచన సంబోధనను, ‘దాసులు,’ ‘ప్రవక్త్రి,’ ‘విగ్రహాలకు అర్పించిన ఆహారం’ వంటి మూలపాఠానికి దగ్గరైన పదాలను సహజ వాక్య నిర్మాణంలో ఉంచాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
