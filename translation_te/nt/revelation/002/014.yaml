id: REV.2.14
reference: Revelation 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: te
  text: 'అయితే, నీకు విరోధంగా నాకు కొన్ని విషయాలు ఉన్నాయి: అక్కడ నీ దగ్గర బిలాము బోధను గట్టిగా పట్టుకున్న కొందరు ఉన్నారు. ఆ బిలాము, విగ్రహాలకు అర్పించిన ఆహారాన్ని తినేలా, లైంగిక అవినీతికి పాల్పడేలా ఇశ్రాయేలు కుమారుల[a] ముందు తొట్రుపడే రాయిని పెట్టమని బాలాకుకు బోధించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు సంతానం’ లేదా ‘ఇశ్రాయేలీయులు.’ గ్రీకు మూలంలో, ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: కొన్ని అభ్యంతరాలు
  rationale: నపుంసక బహువచన విశేషణం ఇక్కడ నామవాచకంగా వాడబడింది. ‘నీపై నాకు కొన్ని అభ్యంతరాలు ఉన్నాయి’ అనేది κατὰ σοῦ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κρατοῦντας τὴν διδαχὴν
  choice: బోధను గట్టిగా పట్టుకొనేవారు
  rationale: κρατέω ఇక్కడ భౌతికంగా పట్టుకోవడం కాక ఒక బోధకు కట్టుబడి ఉండడాన్ని సూచిస్తుంది; ‘గట్టిగా పట్టుకొను’ ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: Βαλαάμ / Βαλὰκ
  choice: బిలాము / బాలాకు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపాలు.
- source_word: βαλεῖν σκάνδαλον
  choice: తొట్రుపడే అడ్డంకిని పెట్టమని
  rationale: σκάνδαλον లోని పతనానికి దారితీసే రూపకాన్ని ‘ఉచ్చు’ అని పూర్తిగా వ్యాఖ్యానించకుండా, ఆధునిక తెలుగులో అర్థమయ్యేలా నిలుపుతుంది.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: ఇశ్రాయేలు కుమారుల
  rationale: మూలంలోని υἱῶν అనే పుంలింగ బహువచనాన్ని నేరుగా నిలుపుతూ, మరింత సాధారణ ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: విగ్రహాలకు అర్పించిన ఆహారాన్ని తినేలా
  rationale: εἰδωλόθυτα అనేది విగ్రహాలకు బలిగా అర్పించిన ఆహారాన్ని సూచిస్తుంది; ఈ రూపం ఆ ఆరాధనా సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: πορνεῦσαι
  choice: లైంగిక అవినీతికి పాల్పడేలా
  rationale: πορνεύω సూచించే విస్తృతమైన అక్రమ లైంగిక ప్రవర్తనను ఒక నిర్దిష్ట చర్యకే పరిమితం చేయకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τῶν υἱῶν Ἰσραήλ ను లింగ-తటస్థంగా అనువదించాలా
  choice: ఇశ్రాయేలు కుమారుల
  alternative: ఇశ్రాయేలు సంతానం; ఇశ్రాయేలీయులు
  rationale: గ్రీకు మూలంలో ‘కుమారులు’ అని స్పష్టంగా ఉన్నందున ప్రధాన పాఠ్యంలో దానిని నిలిపి, సహజమైన సమూహార్థక రూపాలను పాదసూచికలో అందించాం.
- issue: σκάνδαλον ను రూపకంగా నిలుపాలా లేక ‘ఉచ్చు/పాపానికి ప్రలోభం’గా వ్యాఖ్యానించాలా
  choice: తొట్రుపడే అడ్డంకి
  alternative: ఉచ్చు; పాపంలో పడేసే కారణం
  rationale: మూలంలోని రూపకాన్ని నిలుపుతూ దాని నైతిక పతన భావాన్ని తెలుగులో గ్రహించగలిగేలా చేస్తుంది; మరింత వ్యాఖ్యానాత్మకమైన అర్థాన్ని పాఠ్యంలో బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. ‘బోధ,’ ‘లైంగిక అవినీతి’ వంటి స్పష్టమైన ప్రస్తుత వాడుక పదాలను ఎంచుకొని, σκάνδαλον రూపకాన్ని ‘తొట్రుపడే అడ్డంకి’గా నిలిపాం.
