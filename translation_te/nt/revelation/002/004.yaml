language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι τὴν ἀγάπην σου τὴν πρώτην ἀφῆκες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/004.yaml
  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: te
  text: 'అయితే, నీపై నాకు ఈ అభ్యంతరం ఉంది: నీవు నీ మొదటి ప్రేమను విడిచిపెట్టావు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ మొదటి ప్రేమను నీవు వదిలేశావు.’ ఈ పదబంధం వారు తొలుత కలిగివున్న ప్రేమను సూచించవచ్చు—ప్రభువుపట్ల ప్రేమను, ఒకరిపట్ల ఒకరికి ఉన్న ప్రేమను, లేదా రెండింటినీ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందున్న ప్రశంసకు స్పష్టమైన వ్యత్యాసాన్ని చూపే సహజమైన ఆధునిక తెలుగు అనుసంధానం.
- source_word: ἔχω κατὰ σοῦ
  choice: నీకు వ్యతిరేకంగా నాకు ఒక విషయం ఉంది
  rationale: ఎవరిమీదనైనా అభియోగం లేదా అభ్యంతరం ఉందనే గ్రీకు నుడికారంలోని మందలింపు భావాన్ని నిలుపుతుంది.
- source_word: ὅτι
  choice: ':'
  rationale: అభ్యంతరంలోని విషయాన్ని పరిచయం చేసే గ్రీకు ప్రయోగాన్ని తెలుగులో సహజంగా ద్విబిందువుతో తెలియజేస్తుంది; కారణార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: τὴν ἀγάπην σου τὴν πρώτην
  choice: నీ మొదటి ప్రేమను
  rationale: ప్రేమ ఎవరిపట్లనో నిర్దేశించకుండా, గ్రీకు వాక్యంలోని సంక్షిప్తతను మరియు అర్థవిస్తృతిని కాపాడుతుంది.
- source_word: ἀφῆκες
  choice: నీవు విడిచిపెట్టావు
  rationale: వదిలివేయడం లేదా పరిత్యజించడం అనే భావాన్ని సహజమైన, గంభీరమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలో లేని కాలసూచనను చేర్చదు.
theological_decisions:
- issue: ‘నీ మొదటి ప్రేమ’ అనే పదబంధం ఎవరిపట్ల ప్రేమను సూచిస్తుంది?
  choice: నీ మొదటి ప్రేమ
  alternative: నాపట్ల మొదట నీకున్న ప్రేమ; మొదట మీ మధ్య ఉన్న పరస్పర ప్రేమ; నీ పూర్వపు ప్రేమ
  rationale: గ్రీకు పదబంధం ప్రభువుపట్ల ప్రేమనో, ఒకరిపట్ల ఒకరికి ఉన్న ప్రేమనో, లేక రెండింటినో స్పష్టంగా పరిమితం చేయదు. అనువాదం ఆ ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన మందలింపు ధోరణి. ‘మొదటి ప్రేమ’ అనే మూలంలోని అర్థసందిగ్ధతను వివరణాత్మక విస్తరణ లేకుండా నిలిపింది.
