id: REV.2.29
reference: Revelation 2:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/029.yaml
  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: te
  text: చెవి ఉన్నవాడు సంఘాలకు ఆత్మ ఏమి చెబుతున్నాడో వినాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: చెవి ఉన్నవాడు
  rationale: గ్రీకులోని ఏకవచన, సామెతసదృశమైన పిలుపును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀκουσάτω
  choice: వినాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞార్థక భావాన్ని తెలుగులో సహజంగా, గంభీరమైన పిలుపుగా వ్యక్తం చేస్తుంది.
- source_word: τί
  choice: ఏమి
  rationale: ఆత్మ పలుకుతున్న విషయాన్ని సూచించే ప్రశ్నార్థక సంబంధ రూపానికి సహజమైన తెలుగు సమానం.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: ప్రకటన 2–3లో సంఘాలను ఉద్దేశించి మాట్లాడే దైవిక ఆత్మను సూచిస్తుంది; అదనపు వివరణను మూలపాఠ్యంలో చేర్చలేదు.
- source_word: λέγει
  choice: చెబుతున్నాడో
  rationale: వర్తమానకాలంలోని కొనసాగుతున్న లేదా లక్షణాత్మకమైన పలుకును సహజమైన తెలుగు వాక్య నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ταῖς ἐκκλησίαις
  choice: సంఘాలకు
  rationale: ఈ సందర్భంలో ἐκκλησίαις అనేది సందేశాలు అందుకుంటున్న విశ్వాసుల స్థానిక సంఘాలను సూచిస్తుంది.
theological_decisions:
- issue: ‘ఆత్మ’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: సంఘాలతో మాట్లాడే దైవిక ఆత్మ
  alternative: మానవ ఆత్మ లేదా యేసు సందేశంలోని భావం
  rationale: ప్రకటన 2–3లో పునరావృతమయ్యే ఈ పిలుపు, సందేశాల ద్వారా సంఘాలన్నిటితో మాట్లాడే ఆత్మను దైవిక వక్తగా చూపుతుంది. ‘పరిశుద్ధాత్మ’ అని విస్తరించకుండా మూలంలోని ‘ఆత్మ’నే ఉంచడం పాఠ్యరూపాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే పిలుపు యొక్క గంభీరతను నిలుపుతూ అనువదించబడింది.
