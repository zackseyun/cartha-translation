revisions:
- from: ఇదిగో, నేను ఆమెను మంచం మీద పడవేస్తున్నాను[a]. ఆమెతో వ్యభిచారం చేసేవారిని కూడా తీవ్రమైన శ్రమలో పడవేస్తాను[b]—ఆమె చేసిన పనులను విడిచిపెట్టి వారు పశ్చాత్తాపపడకపోతే.
  to: ఇదిగో, నేను ఆమెను మంచంపై పడవేస్తున్నాను[a], ఆమెతో వ్యభిచారం చేసేవారిని గొప్ప శ్రమలోకి పడవేస్తున్నాను[b]—వారు ఆమె పనులనుండి పశ్చాత్తాపపడి తిరగకపోతే.
  rationale: The revision keeps κλίνη as “bed,” retains the direct term “commit adultery,” and preserves θλῖψις without imposing an eschatological reading. It supplies the coordinated second object under the same present-tense judgment action and expresses ἐκ τῶν ἔργων αὐτῆς idiomatically as repentance that turns away from her works.
