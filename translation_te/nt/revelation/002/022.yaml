id: REV.2.22
reference: Revelation 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: te
  text: ఇదిగో, నేను ఆమెను మంచంపై పడవేస్తున్నాను[a], ఆమెతో వ్యభిచారం చేసేవారిని గొప్ప శ్రమలోకి పడవేస్తున్నాను[b]—వారు ఆమె పనులనుండి పశ్చాత్తాపపడి తిరగకపోతే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రోగశయ్య మీద.’ గ్రీకులో అక్షరార్థంగా ‘మంచంపై’ అని ఉంది; ఈ సందర్భంలో చాలామంది దీనిని తీర్పుగా కలిగే బాధ లేదా వ్యాధి శయ్యగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మహా శ్రమలోకి.’ ఇక్కడ ఈ పదబంధం తీవ్రమైన బాధను లేదా సంకటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని ఆకర్షించే గ్రీకు ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదంతో వ్యక్తపరుస్తుంది.
- source_word: βάλλω
  choice: పడవేస్తున్నాను / పడవేస్తాను
  rationale: తీర్పు త్వరలో అమలవబోతున్నదనే సజీవమైన వర్తమాన భావాన్ని మొదటి వాక్యంలో నిలుపుతూ, తెలుగులో రెండవ కర్మతో క్రియను సహజంగా పునరుక్తి చేశాం.
- source_word: αὐτὴν εἰς κλίνην
  choice: ఆమెను మంచం మీద పడవేస్తున్నాను
  rationale: κλίνη యొక్క ప్రాథమిక అర్థమైన ‘మంచం’ను నిలిపి, మూలపాఠంలో స్పష్టంగా లేని ‘రోగశయ్య’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: ఆమెతో వ్యభిచారం చేసేవారిని
  rationale: μοιχεύω యొక్క నిర్దిష్టమైన ‘వ్యభిచారం చేయడం’ అనే అర్థాన్ని నిలిపి, అది అక్షరార్థమా రూపకాలంకారమా అన్న ప్రశ్నను అనువాదంలో ముందే తీర్చలేదు.
- source_word: εἰς θλῖψιν μεγάλην
  choice: తీవ్రమైన శ్రమలో
  rationale: θλῖψις సూచించే తీవ్రమైన బాధ, ఒత్తిడి, కష్టాన్ని సహజమైన తెలుగులో అందిస్తుంది; ప్రత్యేక అంత్యకాల సాంకేతిక అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: ἐὰν μὴ μετανοήσωσιν
  choice: వారు పశ్చాత్తాపపడకపోతే
  rationale: గ్రీకు షరతు నిర్మాణాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκ τῶν ἔργων αὐτῆς
  choice: ఆమె చేసిన పనులను విడిచిపెట్టి
  rationale: μετανοέωతో వచ్చిన ἐκ సూచించే ‘వాటి నుండి తిరగడం’ అనే భావాన్ని తెలుగులో స్పష్టంగా చూపుతూ, ఆ పనులు ఆమెకు చెందినవనే సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: κλίνηని తీర్పుగా వచ్చిన ‘రోగశయ్య’ అని ప్రధాన పాఠ్యంలో స్పష్టీకరించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘మంచం’ అనే అక్షరార్థాన్ని ఉంచడం
  alternative: రోగశయ్య
  rationale: సందర్భం బాధతో కూడిన తీర్పును సూచించినా, κλίνη అనే పదం స్వయంగా తప్పనిసరిగా రోగశయ్యనే సూచించదు. అందువల్ల వ్యాఖ్యానాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: μοιχεύοντας అక్షరార్థ వ్యభిచారాన్నా, ఆధ్యాత్మిక అవిశ్వాసాన్నా సూచిస్తుంది?
  choice: ‘వ్యభిచారం చేసేవారు’ అనే ప్రత్యక్ష పదార్థాన్ని ఉంచడం
  alternative: ఆమెతో లైంగిక అవినీతికి పాల్పడేవారు / ఆమెతో కలిసి అవిశ్వాసంగా ఉండేవారు
  rationale: మూలపదం నేరుగా వ్యభిచారాన్ని సూచిస్తుంది. ప్రకటన గ్రంథ సందర్భంలో రూపకాలంకార భావం కూడా ఉండవచ్చు; అనువాదం ఆ ఉద్రిక్తతను ముందే పరిష్కరించదు.
- issue: ‘ఆమె పనులనుండి’ అనే గ్రీకు నిర్మాణంలో పశ్చాత్తాపం యొక్క దిశను ఎలా చూపాలి?
  choice: ‘ఆమె చేసిన పనులను విడిచిపెట్టి’ అని అనువదించడం
  alternative: ఆమె పనుల విషయమై పశ్చాత్తాపపడడం
  rationale: ἐκ అనే విభక్తిపూర్వకం ఆ పనులనుండి తిరగడాన్ని సూచించగలదు. తెలుగు వాక్యం పశ్చాత్తాపంలో ఉన్న విరమణ భావాన్ని సహజంగా తెలియజేస్తుంది; అదే సమయంలో ‘ఆమె పనులు’ అనే అసాధారణ సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. తీర్పు యొక్క తీవ్రతను నిలిపి, ‘రోగశయ్య’ మరియు వ్యభిచారం యొక్క రూపకాలంకార భావం వంటి వ్యాఖ్యానాలను ప్రధాన పాఠ్యంలో నిర్బంధంగా చేర్చలేదు.
