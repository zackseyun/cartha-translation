review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the principal lexical elements and preserves the literal “bed” and “adultery.” However, the second occurrence of βάλλω is supplied as future (“పడవేస్తాను”), whereas the single present-tense verb governs both objects in Greek. The final conditional wording also needs a clearer Telugu expression of repenting/turning away from her works.
  naturalness: The register is generally modern and clear. “ఆమె చేసిన పనులను విడిచిపెట్టి వారు పశ్చాత్తాపపడకపోతే” is syntactically awkward and can suggest that abandoning the works precedes a failure to repent. Recasting it makes the condition natural and unambiguous.
  terminology: “వ్యభిచారం” suitably retains μοιχεύω without deciding between literal and figurative reference. “గొప్ప శ్రమ” is a natural, established rendering of θλῖψις and the footnote retains the alternative. “మంచం” appropriately avoids importing “sickbed” into the main text.
  issues:
  - severity: medium
    issue: The second implied action is rendered with a future tense.
    rationale: Greek βάλλω is present indicative and governs both “her” and “those committing adultery with her.” Telugu should retain the same vivid present force for both clauses.
  - severity: medium
    issue: The final conditional clause is awkward and may obscure the direction of repentance.
    rationale: “ఆమె చేసిన పనులను విడిచిపెట్టి వారు పశ్చాత్తాపపడకపోతే” can be read as “if, having abandoned her works, they do not repent.” The Greek means that they must repent/turn away from her works.
  revised_text: ఇదిగో, నేను ఆమెను మంచంపై పడవేస్తున్నాను[a], ఆమెతో వ్యభిచారం చేసేవారిని గొప్ప శ్రమలోకి పడవేస్తున్నాను[b]—వారు ఆమె పనులనుండి పశ్చాత్తాపపడి తిరగకపోతే.
