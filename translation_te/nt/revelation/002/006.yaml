  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: te
  text: 'అయితే, నీకు ఈ విషయం ఉంది: నీకొలాయితుల పనులను[a] నీవు ద్వేషిస్తున్నావు; వాటిని నేనూ ద్వేషిస్తున్నాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పనులు’ అనే మాటను ‘క్రియలు’ లేదా ‘ఆచరణలు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం చర్యలను లేదా ఆచరణలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందున్న సందర్భంతో వ్యత్యాసాన్ని సహజంగా సూచించే ఆధునిక తెలుగు విరోధార్థక సంధానపదం.
- source_word: τοῦτο ἔχεις
  choice: నీలో ఈ మంచి ఉంది
  rationale: అక్షరార్థమైన ‘ఇది నీకు ఉంది’ తెలుగులో అసహజంగా ఉంటుంది; సందర్భంలో ప్రశంసించదగిన ఒక విషయం ఉందనే భావాన్ని మితంగా వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: ':'
  rationale: వారిలో ఉన్న ప్రశంసనీయమైన విషయం ఏమిటో తరువాతి వాక్యం వివరిస్తున్నందున ద్విబిందువు సహజంగా ఆ విషయాన్ని పరిచయం చేస్తుంది.
- source_word: μισεῖς
  choice: నీవు ద్వేషిస్తున్నావు
  rationale: μισέω యొక్క బలమైన ప్రత్యక్ష అర్థాన్ని మృదువుచేయకుండా నిలుపుతుంది.
- source_word: τὰ ἔργα
  choice: పనులను
  rationale: ἔργα ఇక్కడ వారి క్రియలు లేదా ఆచరణలను సూచిస్తుంది; వ్యక్తులను కాక వారి పనులనే ద్వేషిస్తున్నారని స్పష్టంగా ఉంచుతుంది.
- source_word: τῶν Νικολαϊτῶν
  choice: నీకొలాయితుల
  rationale: గ్రీకు సమూహనామాన్ని తెలుగులో ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: ἃ
  choice: వాటిని
  rationale: నపుంసక బహువచన సంబంధసర్వనామం ముందున్న ‘పనులను’ తిరిగి సూచిస్తున్నది; తెలుగులో వాక్యాన్ని విడదీసి ‘వాటిని’ అనడం సహజం.
- source_word: κἀγὼ
  choice: నేనూ
  rationale: καὶ ἐγώ లోని ‘నేను కూడా’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: μισῶ
  choice: ద్వేషిస్తున్నాను
  rationale: ముందటి μισεῖς కు ఉపయోగించిన క్రియనే పునరావృతం చేసి మూలంలోని సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: ద్వేషానికి గురయ్యేది ఏమిటి?
  choice: నీకొలాయితుల పనులు
  alternative: నీకొలాయితులు అనే వ్యక్తులే
  rationale: τὰ ἔργα ప్రత్యక్ష కర్మగా ఉన్నందున వచనం వ్యక్తులను కాక వారి పనులను స్పష్టంగా ఖండిస్తుంది.
- issue: సంఘపు వైఖరితో వక్తకు ఉన్న ఏకీభావం
  choice: ‘వాటిని నేనూ ద్వేషిస్తున్నాను’
  alternative: ‘వాటిని నేను కూడా అసహ్యించుకుంటున్నాను’
  rationale: κἀγὼ μισῶ లోని భాగస్వామ్య వైఖరినీ, μισέω యొక్క బలాన్నీ అదే క్రియతో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ అనువదించబడింది. ‘ద్వేషం’ వ్యక్తులపై కాక వారి పనులపై ఉందనే మూలభాషా భేదం స్పష్టంగా కాపాడబడింది. పాదసూచిక గుర్తు సంబంధిత ‘పనులను’ పదం వెంట కాక వాక్యాంతంలో ఉంచడం పాఠన సౌలభ్యానికి; అది ఆ పదానికే వర్తిస్తుంది.
