id: REV.2.28
reference: Revelation 2:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς κἀγὼ εἴληφα παρὰ τοῦ πατρός μου, καὶ δώσω αὐτῷ τὸν ἀστέρα τὸν πρωϊνόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: te
  text: నేను కూడా నా తండ్రి నుండి పొందినట్లే, అతనికి వేకువ చుక్కను[a] ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉదయ నక్షత్రం.’ ఈ మాట మెస్సీయ రాజత్వ చిత్రణను సూచించవచ్చు; అలాగే యేసు తనను తాను ‘ప్రకాశవంతమైన వేకువ చుక్క’గా పేర్కొనే ప్రకటన 22:16ను ముందుగా సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς κἀγὼ
  choice: నేను కూడా … పొందినట్లే
  rationale: ὡς యొక్క పోలిక భావాన్ని ‘పొందినట్లే’ సహజంగా తెలియజేస్తుంది; κἀγώలోని ‘నేను కూడా’ అనే బలాన్ని నిలుపుతుంది. ఈ పోలిక మునుపటి వచనంలోని అధికార వాగ్దానంతో అనుసంధానమవుతుంది.
- source_word: εἴληφα
  choice: పొందినట్లే
  rationale: పూర్తయిన స్వీకరణకు కొనసాగుతున్న ఫలితం ఉందనే పరిపూర్ణ కాల భావం సందర్భంలో నిలుస్తుంది. ‘తీసుకున్న’ కంటే ‘పొందిన’ అనేది మూలం తండ్రి అని చెప్పే వాక్యానికి తగినది.
- source_word: παρὰ τοῦ πατρός μου
  choice: నా తండ్రి నుండి
  rationale: షష్ఠీ విభక్తితో παρά ఇక్కడ మూలం లేదా ఇచ్చినవానిని సూచిస్తుంది; కుమారుని సంబంధాన్ని విస్తరించకుండా యథాతథంగా ఉంచుతుంది.
- source_word: καὶ δώσω αὐτῷ
  choice: అతనికి … ఇస్తాను
  rationale: భవిష్యత్ కాల క్రియను నేరుగా తెలుగులో అందిస్తుంది. ‘అతనికి’ అనేది ముందు సందర్భంలోని జయించేవానిని సూచిస్తుంది.
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: వేకువ చుక్క
  rationale: తెలుగులో సహజంగా అర్థమయ్యే రూపకాన్ని నిలుపుతుంది; దాని ప్రతీకాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో ముందుగానే నిర్ణయించదు.
theological_decisions:
- issue: ‘వేకువ చుక్క’ యొక్క గుర్తింపు లేదా ప్రాముఖ్యత
  choice: ప్రధాన పాఠ్యంలో రూపకాన్ని ‘వేకువ చుక్క’గానే ఉంచడం
  alternative: మెస్సీయ రాజత్వానికి గుర్తు; క్రీస్తే; అంత్యకాల మహిమ లేదా బహుమానం
  rationale: ఈ వచనం రూపకాన్ని స్పష్టంగా నిర్వచించదు. ప్రకటన 22:16తో క్రీస్తును సూచించే సంబంధం సాధ్యమైనప్పటికీ, దానినే ఏకైక అర్థంగా ప్రధాన పాఠ్యంలో నిర్ధారించకుండా భావ ఉద్రిక్తతను నిలుపుతున్నాం.
- issue: ‘నా తండ్రి నుండి’ అనే మాటలోని క్రీస్తు సంబంధం
  choice: వివరణ జోడించకుండా నేరుగా అనువదించడం
  alternative: తండ్రి అప్పగించిన అధికారంగా లేదా విమోచన కార్యంలోని సంబంధంగా వివరించడం
  rationale: మూలపాఠ్యం వ్యక్తం చేసే కుమార సంబంధం, స్వీకరణ భావం మాత్రమే అనువాదంలో ఉంటాయి; తరువాతి సిద్ధాంత వివరణను పాఠ్యంలోకి చేర్చడం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని పోలికను ముందరి సందర్భంతో కలిపేలా ‘పొందినట్లే’ వాడబడింది. అర్థపరంగా సంబంధించినందున [a] గుర్తు ‘వేకువ చుక్క’ తరువాత ఉంచబడింది.
