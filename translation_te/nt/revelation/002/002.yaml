id: REV.2.2
reference: Revelation 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: te
  text: నీ కార్యాలు, నీ శ్రమ, నీ ఓర్పు నాకు తెలుసు. నీవు దుష్టులను సహించలేవని[a] కూడా నాకు తెలుసు. తాము అపొస్తలులమని చెప్పుకునేవారిని[b] నీవు పరీక్షించి, వారు అపొస్తలులు కాదని, వారిని అబద్ధికులని కనుగొన్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దుష్టులను భరించలేవు.’ గ్రీకులో అక్షరార్థంగా ‘భరించలేవు’; ఇక్కడ వారిని ఓర్చుకోకపోవడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తాము అపొస్తలులమని వాదించేవారిని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: నాకు తెలుసు
  rationale: వర్తమాన జ్ఞానస్థితిని నేరుగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔργα
  choice: కార్యాలు
  rationale: చర్యలు, పనులు అనే విస్తృత అర్థాన్ని నిలుపుతూ గౌరవప్రదమైన ఆధునిక శైలికి సరిపోతుంది.
- source_word: κόπον
  choice: ప్రయాస
  rationale: కేవలం పని అనే భావం కాకుండా శ్రమతో కూడిన కృషిని సూచిస్తుంది; ‘కష్టం’లో ఉండే బాధ అనే ద్వంద్వార్థాన్ని తగ్గిస్తుంది.
- source_word: ὑπομονήν
  choice: సహనం
  rationale: ఒత్తిడి మధ్య నిలకడగా కొనసాగడాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: οὐ δύνῃ βαστάσαι
  choice: సహించలేవు
  rationale: అక్షరార్థమైన ‘మోయలేవు’కన్నా ఈ నైతిక, సంఘ సంబంధ సందర్భంలో చెడ్డవారిని ఓర్చుకోకపోవడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κακούς
  choice: దుష్టులను
  rationale: వ్యక్తులను సూచించే పుంలింగ బహువచన విశేషణాన్ని లింగాన్ని అనవసరంగా ముందుకు తేవకుండా స్పష్టంగా అనువదిస్తుంది.
- source_word: ἐπείρασας
  choice: పరీక్షించావు
  rationale: వారి అపొస్తలత్వపు వాదన నిజమో కాదో పరిశీలించిన భావాన్ని సూటిగా నిలుపుతుంది.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: తాము అపొస్తలులమని చెప్పుకునేవారిని
  rationale: ἑαυτούςలోని స్వీయ ప్రకటన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀποστόλους
  choice: అపొస్తలులు
  rationale: ఈ సంఘ సందర్భంలో సాధారణ ‘దూతలు’కన్నా అధికారిక పరిచర్య హోదాను సూచించే సాంకేతిక అర్థమే ఎక్కువగా సంభావ్యమైనది.
- source_word: ψευδεῖς
  choice: అబద్ధికులు
  rationale: వారి వాదన, స్వరూపం అసత్యమని చెప్పే విధేయ విశేషణ బలాన్ని నిలుపుతుంది; ‘నకిలీ అపొస్తలులు’ అని మూలంలో లేని నామవాచకాన్ని పునరావృతం చేయదు.
theological_decisions:
- issue: ἀποστόλους పదం సూచించే హోదా
  choice: అపొస్తలులు
  alternative: దూతలు
  rationale: సంఘంలో అధికారాన్ని తమకు ఆపాదించుకున్నవారిని పరీక్షించడం ఈ వాక్యపు సందర్భం. ‘అపొస్తలులు’ అనే పదం సంభావ్య సాంకేతిక అర్థాన్ని నిలుపుతుంది, అయితే తరువాతి సంస్థాగత సిద్ధాంతాలను వాక్యంలోకి చేర్చదు.
- issue: οὐ δύνῃ βαστάσαιలో సామర్థ్యమా, సహించడానికి నిరాకరణా
  choice: సహించలేవు
  alternative: భరించలేవు
  rationale: గ్రీకు రూపం సామర్థ్య భాషను వాడుతున్నప్పటికీ, సందర్భంలో దుష్టులను ఓర్చుకోకపోవడం ప్రధాన భావం. ప్రధాన పాఠం ఆ సందర్భార్థాన్ని ఇస్తూ, పాదసూచిక మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
- issue: ψευδεῖς ద్వారా వ్యక్తులపై వచ్చే తీర్పు
  choice: అబద్ధికులు
  alternative: అసత్యులైనవారు
  rationale: మూలంలోని విధేయ విశేషణం వారి అపొస్తలత్వపు వాదన అసత్యమని తీవ్రమైన తీర్పు ఇస్తుంది. దానిని కేవలం ‘వారి వాదన తప్పు’గా సడలించకుండా వ్యక్తుల గురించిన మూల వాక్య నిర్మాణాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ఏకవచన సంబోధనను ‘నీ/నీవు’తో నిలిపాం. మూలంలోని పొడవైన సమన్వయ వాక్యాన్ని స్పష్టత కోసం చిన్న వాక్యాలుగా విభజించినా, భావ క్రమం మరియు పునరుక్త జ్ఞానబలం నిలుపబడ్డాయి. [a] గుర్తును సంబంధిత ‘సహించలేవు’ దగ్గర ఉంచాం; అందించిన ఆంగ్ల పాఠంలో అది ‘works’ తర్వాత ఉండటం పాదసూచిక విషయంతో సరిపోలదు.
