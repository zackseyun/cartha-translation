  to: నీ కార్యాలు, నీ శ్రమ, నీ ఓర్పు నాకు తెలుసు. నీవు దుష్టులను సహించలేవని[a] కూడా నాకు తెలుసు. తాము అపొస్తలులమని చెప్పుకునేవారిని[b] నీవు పరీక్షించి, వారు అపొస్తలులు కాదని, వారిని అబద్ధికులని కనుగొన్నావు.
  rationale: సవరించిన పాఠం మూలంలోని కార్యాలు—శ్రమ—ఓర్పు అనే త్రయాన్ని స్పష్టంగా ఉంచుతుంది; దుష్టులను సహించకపోవడాన్ని విడిగా, కానీ ‘నాకు తెలుసు’ అనే మూల జ్ఞాన ప్రకటనతో అనుసంధానించి ఉంచుతుంది. స్వయంగా అపొస్తలులమని చెప్పుకున్నవారిని పరీక్షించడం, వారు అలా కాదని మరియు అబద్ధికులని కనుగొనడం అనే మూల వాక్య సంబంధాన్ని తెలుగు వాక్యంలో సహజంగా వ్యక్తం చేసింది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వద్దనే ఉన్నాయి.
