id: REV.2.27
reference: Revelation 2:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ ὡς τὰ σκεύη τὰ κεραμικὰ ⸀συντρίβεται,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/027.yaml
  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
translation:
  language: te
  text: అతడు ఇనుప దండంతో[a] కాపరిగా వారిని నడిపిస్తాడు; మట్టి పాత్రలు పగులగొట్టబడినట్లుగా[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇనుప దండంతో వారిని పాలిస్తాడు.” ఈ క్రియకు అక్షరార్థంగా కాపరిగా నడిపించడం అనే భావం ఉంది; అయితే కీర్తన 2ను సూచించే ఈ సందర్భంలో రాజుగా పాలించడం అనే భావం కూడా ఉంది.
    reason: alternative_reading
  - marker: b
    text: ఇది కీర్తన 2:9ను సూచిస్తుంది; అక్కడ జనాలు మట్టి పాత్రలవలె పగులగొట్టబడతారు.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: మరియు
  rationale: ముందటి వాగ్దానంతో ఈ వాక్యాన్ని కలిపే సాధారణ సంధాన పదంగా నిలుపబడింది.
- source_word: ποιμανεῖ
  choice: కాస్తాడు
  rationale: ποιμαίνω యొక్క ప్రాథమిక కాపరి రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ఈ సందర్భంలో ఉన్న రాజాధికార భావాన్ని ప్రధాన పాఠంలో కేవలం ‘పాలిస్తాడు’ అని మార్చి రూపకాన్ని తొలగించలేదు.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: ఇనుప దండంతో
  rationale: ῥάβδος దండం, కర్ర లేదా రాజదండాన్ని సూచించగలదు. కీర్తన 2 నేపథ్యంలోని అధికారం, బలప్రయోగం రెండింటినీ ‘దండం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὡς
  choice: …గా
  rationale: పోలికను తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘పగులగొట్టబడినట్లుగా’ అనే నిర్మాణంలో అనువదించబడింది.
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: కుమ్మరి పాత్రలు
  rationale: κεραμικός సూచించే మట్టితో చేసిన పాత్రల భావాన్ని, కీర్తన 2:9 ప్రతిధ్వనిని సహజంగా తెలియజేస్తుంది.
- source_word: συντρίβεται
  choice: పగులగొట్టబడినట్లుగా
  rationale: హింసాత్మకంగా ముక్కలవడం అనే భావాన్ని వ్యక్తం చేస్తుంది. గ్రీకులో నపుంసక బహువచన కర్తతో ఏకవచన క్రియ రావడం సాధారణం; తెలుగులో భావానికి తగిన బహువచన రూపం వాడబడింది.
theological_decisions:
- issue: ποιμανεῖ మరియు ఇనుప దండం ద్వారా కీర్తన 2:9లోని రాజ-మెస్సీయ సూచన
  choice: ప్రధాన పాఠంలో ‘కాస్తాడు’ అనే కాపరి రూపకాన్ని నిలిపి, రాజాధికార భావాన్ని పాదసూచికలో తెలిపాం.
  alternative: ‘పాలిస్తాడు’ అని అనువదించి అధికార భావాన్ని నేరుగా ముందుకు తేవడం.
  rationale: గ్రీకు పాఠంలో సాధారణ ‘పాలించు’ క్రియ కాక ποιμαίνω ఉంది. కాపరి సంరక్షణ, రాజపరిపాలన, తీర్పు అనే భావాల మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్వేగాన్ని అనువాదం తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కాస్తాడు’ కాపరి రూపకాన్ని సహజంగా నిలుపుతుంది; ‘ఇనుప దండం’ రాజాధికార మరియు తీర్పు చిత్రణను కాపాడుతుంది. వాక్యం తరువాతి భాగంతో కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
