id: REV.2.7
reference: Revelation 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: te
  text: చెవి గలవాడు, ఆత్మ సంఘాలకు చెప్పేది వినాలి. జయించేవాడికి[a] దేవుని పరదైసులో ఉన్న జీవవృక్షం నుండి తినడానికి ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అధిగమించేవాడికి.’
    reason: νικάω అనే పదానికి విజయం సాధించడం లేదా ప్రతిబంధకాన్ని అధిగమించడం అనే పరస్పర సంబంధిత భావాలు ఉన్నాయి.
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: చెవి గలవాడు
  rationale: గ్రీకు వాక్యంలోని ఏకవచన రూపాన్ని, అందరినీ ఉద్దేశించే సామెతసదృశ పిలుపును సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀκουσάτω
  choice: వినాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞార్థక భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ఉపదేశాత్మక ఆజ్ఞగా వ్యక్తం చేస్తుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: ప్రకటన 2–3లో పునరావృతమయ్యే ఈ సూత్రవాక్యంలో దేవుని ఆత్మను సూచిస్తుంది; తెలుగు బైబిలు వాడుకకు అనుగుణంగా గౌరవార్థక పదాన్ని ఉంచుతుంది.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: సంఘాలకు చెప్పేది
  rationale: వర్తమానకాల క్రియను సహజమైన తెలుగులో చూపుతూ, దత్తివాచక బహువచనమైన ‘సంఘాలకు’ అనే గమ్యాన్ని కాపాడుతుంది.
- source_word: τῷ νικῶντι
  choice: జయించేవాడికి
  rationale: νικάω లోని విజయం సాధించడం అనే క్రియాత్మక భావాన్ని, ప్రకటన గ్రంథంలోని పోరాట-విజయ చిత్రణను నిలుపుతుంది.
- source_word: δώσω αὐτῷ φαγεῖν
  choice: జయించేవాడికి … తినడానికి ఇస్తాను
  rationale: αὐτῷ సూచించే గ్రహీతను తెలుగు దత్తివిభక్తి ‘-కి’ ద్వారా స్పష్టంగా వ్యక్తం చేసి, φαγεῖν ను నేరుగా ‘తినడానికి’ అని అనువదిస్తుంది.
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: జీవవృక్షం నుండి
  rationale: ἐκ యొక్క మూలార్థమైన ‘నుండి’ని, ξύλον యొక్క సందర్భానుసార అర్థమైన ‘వృక్షం’ను కాపాడి ఆదికాండము ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ἐν τῷ παραδείσῳ τοῦ θεοῦ
  choice: దేవుని పరదైసులో
  rationale: పరదైసు అనే పదం సాధారణ తోటకన్నా ఈ సందర్భంలోని అంత్యకాలిక, అంతర్గ్రంథ సంబంధిత బరువును మెరుగ్గా నిలుపుతుంది; τοῦ θεοῦ ను సహజమైన సంబంధవాచకంగా చూపుతుంది.
theological_decisions:
- issue: τὸ πνεῦμα ఎవరిని సూచిస్తుంది
  choice: దేవుని పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: ఒక సాధారణ ఆత్మ
  rationale: ప్రకటన 2–3లో ‘ఆత్మ సంఘాలకు చెప్పేది’ అనే పునరావృత దైవిక సంబోధన పరిశుద్ధాత్మను సందర్భపరంగా సూచిస్తుంది; అనువాదం అదనపు వివరణను చేర్చకుండా ‘ఆత్మ’ అని ఉంచుతుంది.
- issue: νικάω విజయ సూత్రవాక్యానికి అనువాదం
  choice: జయించేవాడు
  alternative: అధిగమించేవాడు
  rationale: ‘జయించేవాడు’ మూలక్రియలోని విజయ, పోరాట చిత్రణను స్పష్టంగా నిలుపుతుంది; ‘అధిగమించేవాడు’ కూడా సాధ్యమైన భావాంతరం కావడంతో పాదసూచికలో ఇస్తుంది.
- issue: ప్రతినిధ్య ఏకవచనం
  choice: చెవి గలవాడు … వినాలి
  alternative: చెవులు గలవారు వినాలి
  rationale: గ్రీకులోని ఏకవచన రూపాన్ని నిలుపుతూ, తెలుగులో ఇది సాధారణంగా ప్రతి వ్యక్తినీ ఉద్దేశించే ప్రతినిధ్య వాక్యంగా సహజంగా అర్థమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సంక్షిప్తంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘పరదైసు,’ ‘జీవవృక్షం,’ ‘సంఘాలు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలుపుతూ, అసహజమైన గ్రీకు వాక్యక్రమాన్ని తెలుగులో సహజంగా మార్చింది.
