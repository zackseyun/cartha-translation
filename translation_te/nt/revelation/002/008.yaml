id: REV.2.8
reference: Revelation 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: te
  text: '“మరియు స్ముర్నలోని సంఘపు దూతకు[a] ఇలా రాయి: మొదటివాడును చివరివాడును, మృతుడై తిరిగి జీవించినవాడును[b] ఇలా చెబుతున్నాడు:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్ముర్నలోని సంఘపు సందేశకునికి.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “చనిపోయి మళ్లీ బ్రతికినవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: దూతకు
  rationale: ప్రకటన గ్రంథంలోని దర్శనాత్మక సందర్భంలో ‘దూత’ ప్రధాన అర్థాన్ని సహజంగా తెలియజేస్తుంది; అదే సమయంలో గ్రీకు పదానికి సాధ్యమైన ‘సందేశకుడు’ అనే భావాన్ని పూర్తిగా మూసివేయదు.
- source_word: ἐκκλησίας
  choice: సంఘపు
  rationale: ఇక్కడ ἐκκλησία సాధారణ పౌరసభను కాక, స్ముర్నలోని క్రైస్తవ విశ్వాస సమాజాన్ని సూచిస్తుంది; ఆధునిక తెలుగు క్రైస్తవ వాడుకలో ‘సంఘం’ దీనిని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: Τάδε λέγει
  choice: ఇలా చెబుతున్నాడు
  rationale: గ్రీకు ప్రవచన సందేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, వర్తమాన కాల భావాన్ని నిలుపుతుంది.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: మొదటివాడును చివరివాడును
  rationale: పదబంధాన్ని క్రీస్తు స్వీయబిరుదుగా నిలుపుతూ, మూలంలోని సమాంతర నిర్మాణాన్ని మరియు యెషయా గ్రంథంలోని దైవిక బిరుదు ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: ἐγένετο νεκρὸς
  choice: మృతుడై
  rationale: γίνομαι లోని స్థితిలోకి ప్రవేశించిన సంఘటన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; కేవలం ‘మృతుడుగా ఉన్న’ అనే స్థితివాచక భావానికి పరిమితం చేయదు.
- source_word: ἔζησεν
  choice: తిరిగి జీవించినవాడు
  rationale: మరణంతో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని చూపి, సందర్భంలోని పునరుజ్జీవ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: క్రీస్తు బిరుదు మరియు మరణ–పునరుజ్జీవ ప్రకటన
  choice: ‘మొదటివాడును చివరివాడును’ అనే బిరుదును అలాగే నిలిపి, ‘మృతుడై తిరిగి జీవించినవాడు’ అని అనువదించడం
  alternative: ‘ఆదియును అంతమునై ఉన్నవాడు; చనిపోయి మళ్లీ బ్రతికినవాడు’
  rationale: మూలపాఠం యేసును ఉన్నతమైన దైవిక బిరుదుతో గుర్తిస్తూ ఆయన మరణాన్ని, తిరిగి జీవించడాన్ని ప్రకటిస్తుంది. అనువాదం ఈ రెండు అంశాలను అదనపు సిద్ధాంత వివరణ లేకుండా స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ప్రకటన శైలిని ఉపయోగించాం. ‘వాడును’ అనే సమాంతర రూపం బిరుదు యొక్క లయను నిలుపుతుంది. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ప్రధాన పాఠంలో ఉంచబడింది.
