id: REV.2.23
reference: Revelation 2:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: te
  text: ఆమె పిల్లలను మరణంతో చంపుతాను[a]; మరియు హృదయాలను, మనస్సులను పరిశోధించేవాడిని నేనే అని సంఘాలన్నీ తెలుసుకుంటాయి[b]. మీలో ప్రతి ఒక్కరికీ మీ మీ క్రియల ప్రకారం ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తెగులుతో చంపుతాను.’ గ్రీకులో అక్షరార్థంగా ‘మరణంతో’ అని ఉంది; ఇది తీర్పు తీవ్రతను నొక్కిచెప్పవచ్చు లేదా పాత నిబంధనలోని తీర్పు భాషను ప్రతిధ్వనింపజేయవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మూత్రపిండాలను, హృదయాలను.’ ఇది ఉద్దేశాలు, ఆలోచనలు, కోరికలతో సహా మనిషి అంతరంగాన్ని సూచించే బైబిలు నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: పిల్లలు
  rationale: ఈ పదానికి సహజమైన అర్థం ‘పిల్లలు’ లేదా ‘సంతానం.’ ఇక్కడ అది శారీరక సంతానాన్నో ఆమె అనుచరులనో సూచించవచ్చు; ‘పిల్లలు’ ఆ సందిగ్ధతను నిలుపుతుంది.
- source_word: ἀποκτενῶ
  choice: చంపుతాను
  rationale: ఈ క్రియ నేరుగా చంపడాన్ని సూచిస్తుంది; తీర్పు యొక్క తీవ్రతను తగ్గించకుండా స్పష్టంగా అనువదిస్తుంది.
- source_word: ἐν θανάτῳ
  choice: మరణంతో
  rationale: గ్రీకు వాక్యంలోని అసాధారణమైన ‘మరణంతో చంపుతాను’ అనే రూపాన్ని, దాని బలాన్ని మరియు పాత నిబంధన తీర్పు భాషతో ఉండగల ప్రతిధ్వనిని నిలుపుతూ అనువదించబడింది.
- source_word: γνώσονται
  choice: తెలుసుకుంటాయి
  rationale: తీర్పు ఫలితంగా సంఘాలన్నీ గుర్తించి తెలుసుకుంటాయనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκκλησίαι
  choice: సంఘాలు
  rationale: ప్రకటన గ్రంథంలో ఉద్దేశించిన క్రైస్తవ విశ్వాసుల స్థానిక సమూహాలకు ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో ‘సంఘాలు’ సరైన పదం.
- source_word: ὁ ἐραυνῶν
  choice: పరిశోధించేవాడిని
  rationale: అంతరంగాన్ని లోతుగా పరీక్షించే నిరంతర లక్షణాన్ని, న్యాయనిర్ణయ భావంతో సహా, ఈ రూపం నిలుపుతుంది.
- source_word: νεφροὺς καὶ καρδίας
  choice: హృదయాలను, మనస్సులను
  rationale: అక్షరార్థంగా ‘మూత్రపిండాలను, హృదయాలను’ అనే బైబిలు నుడికారం మనిషి అంతరంగంలోని ఆలోచనలు, ఉద్దేశాలు, కోరికలను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి అర్థవంతంగా ఉండేందుకు నుడికార భావం ప్రధాన పాఠ్యంలో ఇవ్వబడింది; అక్షరార్థం పాదటిప్పణిలో ఉంచబడింది.
- source_word: δώσω
  choice: ఇస్తాను
  rationale: గ్రీకు పదంలోని సాధారణ ‘ఇవ్వడం’ అనే భావాన్ని నిలుపుతుంది; సందర్భం దానిని న్యాయమైన ప్రతిఫలంగా సూచిస్తుంది.
- source_word: ἑκάστῳ
  choice: మీలో ప్రతి ఒక్కరికీ
  rationale: ὑμῖνతో కలిసి ఉన్న విభజనాత్మక ఏకవచన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατὰ τὰ ἔργα ὑμῶν
  choice: మీ మీ క్రియల ప్రకారం
  rationale: తీర్పు సూత్రంలోని ‘క్రియలు’ అనే బైబిలు పదబంధాన్ని, ప్రతి వ్యక్తికి సంబంధించిన విభజనాత్మక భావంతో నిలుపుతుంది.
theological_decisions:
- issue: అంతరంగాన్ని పరిశోధించేవాడిగా మాట్లాడుతున్నవాని స్వీయ గుర్తింపు
  choice: ‘పరిశోధించేవాడిని నేనే’ అనే బలమైన ప్రథమ పురుష స్వీయ గుర్తింపును నిలుపడం
  alternative: దీనిని కేవలం సాధారణంగా తెలుసుకోవడం లేదా గమనించడం అన్నట్లు మృదువుగా వ్యాఖ్యానించడం
  rationale: గ్రీకు పాఠ్యం అంతరంగాన్ని పరిశోధించి క్రియల ప్రకారం తీర్పు ఇచ్చే అధికారాన్ని బలంగా ప్రకటిస్తుంది; దాని దైవిక న్యాయాధికార భావాన్ని తగ్గించకూడదు.
- issue: ‘ఆమె పిల్లలు’ అనే పదబంధం యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో శారీరక పిల్లలా లేక అనుచరులా అన్నది నిర్ణయించకుండా ఉంచడం
  alternative: వారిని స్పష్టంగా శారీరక సంతానం లేదా ఆధ్యాత్మిక అనుచరులు అని పేర్కొనడం
  rationale: సందర్భం అనుచరులను సూచించవచ్చుగాని, గ్రీకు పదం ఒక్క అర్థాన్నే నిర్బంధించదు; అందువల్ల అసలు సందిగ్ధత నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘మరణంతో చంపుతాను’ అనే ఉద్దేశపూర్వక అసాధారణత మూలపాఠ్య బలాన్ని కాపాడుతుంది; పాదటిప్పణులు దాని ప్రత్యామ్నాయ భావాన్ని మరియు అంతరంగ అవయవాల నుడికారాన్ని వివరిస్తాయి.
