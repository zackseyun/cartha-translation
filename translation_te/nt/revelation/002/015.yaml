    rationale: ‘అలాగే’ను οὕτως మరియు ὁμοίως రెండింటికీ కలిపి ఉపయోగించినందున, మూలంలో వాక్యాంతంలో ఉన్న రెండవ పోలిక-సూచన కనుమరుగవుతుంది. ప్రధాన పాఠంలో ‘అదే విధంగా’ను నిలిపి, అది ‘పట్టుకొని ఉన్నవారు’ను లేదా మొత్తం పోలికను విశేషించవచ్చనే అస్పష్టతను పాదటిప్పణిలో వివరించడం సురక్షితం.
