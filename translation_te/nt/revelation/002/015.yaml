  verdict: revise
  source_fidelity: 'ముసాయిదా వచనంలోని ప్రధాన భావం సరైనదే: పెర్గములో నికొలాయితుల బోధను అనుసరించే వారు ఉన్నారనే యోహాను ఆరోపణను నమ్మకంగా తెలియజేస్తుంది. అయితే οὕτως మరియు వాక్యాంతంలోని ὁμοίως రెండింటి పోలిక-సూచనను ప్రధాన పాఠంలో ఒకే ‘అలాగే’లో కలిపివేయడం వల్ల వాక్యాంత క్రియావిశేషణం పూర్తిగా ప్రతిఫలించలేదు.'
  naturalness: ‘నీ మధ్య కూడా ... ఉన్నవారు ఉన్నారు’ ఆధునిక తెలుగులో సహజంగా ఉంది; సంఘాన్ని వ్యక్తిలా సంబోధించే మూలవాక్యానికి ఇది సందర్భానుగుణమైన రూపం. ‘అంటిపెట్టుకొని’ కంటే బోధకు కట్టుబడి ఉండే అర్థంలో ‘పట్టుకొని ఉన్న’ మరింత సహజమైనది, తక్కువ చిత్రాత్మకమైనది.
  terminology: ‘నికొలాయితుల,’ ‘బోధను,’ మరియు ‘నీ మధ్య’ తగినవే. ‘పట్టుకొని ఉన్నవారు’ κρατοῦντας కు సరైన, ఆధునిక తెలుగు సమానార్థకం. వాక్యాంతంలో ‘అదే విధంగా’ను ఉంచడం ద్వారా ὁμοίως యొక్క అన్వయ-అస్పష్టతను అనవసరంగా తీర్చకుండా కాపాడవచ్చు.
