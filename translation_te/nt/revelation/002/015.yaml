  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: te
  text: అలాగే, నీ మధ్య కూడా నికొలాయితుల బోధను పట్టుకొని ఉన్నవారు అదే విధంగా ఉన్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అలాగే, నీ మధ్య కూడా నికొలాయితుల బోధను పట్టుకొని ఉన్నవారు ఉన్నారు.” “అదే విధంగా” అనే గ్రీకు పదం, వారు ఆ బోధను పట్టుకొని ఉండే తీరు మునుపటి వచనంలో చెప్పినవారి తీరుతో పోలి ఉందని సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: అలాగే
  rationale: మునుపటి వచనంలో ప్రస్తావించిన పరిస్థితితో పోలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔχεις
  choice: నీ మధ్య ... ఉన్నవారు ఉన్నారు
  rationale: అక్షరార్థంగా ‘నీవు కలిగి ఉన్నావు’; సంఘంలో అలాంటి వ్యక్తులు ఉన్నారనే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ σὺ
  choice: నీ మధ్య కూడా
  rationale: ‘నీవు కూడా’ అనే పోలికనూ నేర సంబోధననూ నిలుపుతుంది; ‘నీ మధ్య’ అనేది సంఘంలో వారి ఉనికిని స్పష్టం చేస్తుంది.
- source_word: κρατοῦντας
  choice: అంటిపెట్టుకొని ఉన్నవారు
  rationale: ఒక బోధను గట్టిగా పట్టుకొని దానికి కట్టుబడి ఉండే భావాన్ని సాధారణులకు అర్థమయ్యే రీతిలో అందిస్తుంది.
- source_word: διδαχὴν
  choice: బోధను
  rationale: ‘సిద్ధాంతం’ కంటే సహజంగా ఉండి, బోధించబడే విషయమనే అర్థాన్ని కాపాడుతుంది.
- source_word: Νικολαϊτῶν
  choice: నికొలాయితుల
  rationale: గుంపు పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో అందిస్తుంది.
- source_word: ὁμοίως
  choice: అలాగే
  rationale: మునుపటి వచనంతో ఉన్న పోలికను సంక్షిప్తంగా చూపుతుంది; గ్రీకు వాక్యంలో οὕτωςతో కలిసి ఉన్న పునరుక్త పోలికను తెలుగు సహజత్వం కోసం ఒకే పదంలో సమీకరించింది.
theological_decisions:
- issue: ὁμοίως వాక్యంలో దేనిని విశేషిస్తుందనే అనిశ్చితి
  choice: ‘అలాగే’ అని వాక్యారంభంలో ఉంచి మొత్తం వాక్యాన్ని మునుపటి వచనంతో అనుసంధానించడం
  alternative: వాక్యాంతంలో ‘అదే విధంగా’ అని ఉంచి, వారు ఆ బోధను పట్టుకొనే తీరును నేరుగా విశేషించడం
  rationale: గ్రీకులో ὁμοίως క్రియావిశేషణం participle‌ను లేదా మొత్తం పోలికను సూచించవచ్చు. ప్రధాన పాఠం సహజమైన తెలుగులో విస్తృత పోలికను ఉంచుతుంది; పాదటిప్పణి ప్రత్యామ్నాయ అన్వయాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; నేర సంబోధనను ఏకవచన ‘నీ’తో నిలిపి, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలిని ఉపయోగించాం.
