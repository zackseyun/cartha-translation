id: REV.2.21
reference: Revelation 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: te
  text: ఆమె పశ్చాత్తాపపడడానికి నేను ఆమెకు సమయం ఇచ్చాను. అయినా ఆమె తన లైంగిక దుర్నడతను విడిచి పశ్చాత్తాపపడడానికి[a] ఇష్టపడడం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన లైంగిక దుర్నడత విషయమై పశ్చాత్తాపపడడానికి.”
    reason: μετανοέωతో ἐκ నిర్మాణాన్ని తెలుగులో ‘విడిచి’ అని లేదా ‘విషయమై’ అని వ్యక్తం చేయగల అర్థసంభావ్యతను నమోదు చేయడానికి.
lexical_decisions:
- source_word: ἔδωκα
  choice: ఇచ్చాను
  rationale: సందర్భంలో పూర్తయిన అవకాశప్రదానాన్ని సూచించే ఏఓరిస్ట్‌ను సహజమైన భూతకాల క్రియగా అనువదించాం.
- source_word: αὐτῇ
  choice: ఆమెకు
  rationale: స్త్రీలింగ ఏకవచన దత్తివిభక్తి సమీప సందర్భంలోని యెజెబెలు అని పిలువబడిన స్త్రీని సూచిస్తుంది.
- source_word: χρόνον
  choice: సమయం
  rationale: χρόνος ఇక్కడ పశ్చాత్తాపానికి అనుమతించిన కాలాన్ని సూచిస్తుంది; ‘సమయం’ సహజంగా, తగిన స్పష్టతతో ఉంది.
- source_word: ἵνα μετανοήσῃ
  choice: పశ్చాత్తాపపడడానికి
  rationale: ἵνα + సబ్జంక్టివ్ ఉద్దేశాన్ని తెలియజేస్తుంది; తెలుగులో ఈ రూపం సహజంగా ఆ ఉద్దేశాన్ని వ్యక్తం చేస్తుంది.
- source_word: οὐ θέλει
  choice: ఇష్టపడడం లేదు
  rationale: θέλω సంకల్పం లేదా మనసును సూచిస్తుంది. ‘ఇష్టపడడం లేదు’ ఆమె అయిష్టతను చూపుతుంది; ‘నిరాకరించింది’ అనే మరింత బలమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: μετανοῆσαι
  choice: పశ్చాత్తాపపడడానికి
  rationale: ఇది θέλειను పూరించే క్రియారూపం; మూలంలోని పునరుక్తిని తెలుగులోనూ నిలిపాం.
- source_word: ἐκ τῆς πορνείας αὐτῆς
  choice: తన లైంగిక దుర్నడతను విడిచి
  rationale: ἐκ యొక్క ‘నుండి/బయటకు’ భావాన్ని తెలుగులో సహజంగా ‘విడిచి’ అని వ్యక్తం చేశాం. πορνεία యొక్క లైంగిక నిర్దిష్టతను ‘లైంగిక దుర్నడత’ నిలుపుతుంది.
theological_decisions:
- issue: ప్రవచనాత్మక-అంత్యకాలిక గద్దింపు సందర్భంలో πορνεία అర్థం
  choice: లైంగిక దుర్నడత
  alternative: అవినీతి; వ్యభిచారం; వేశ్యావృత్తి
  rationale: ఈ పదానికి అక్షరార్థమైన లేదా రూపకాలంకారమైన, విగ్రహారాధన సంబంధమైన సూచనలు ఉండవచ్చు. ప్రధాన పాఠ్యంలో దాని సహజ లైంగిక అర్థాన్ని ఉంచి, సందర్భం రూపకాలంకారపు ప్రతిధ్వనులను మోయనిచ్చాం.
- issue: μετανοέωతో ἐκ యొక్క సంబంధం
  choice: ‘తన లైంగిక దుర్నడతను విడిచి పశ్చాత్తాపపడడానికి’ అని అనువదించడం
  alternative: ‘తన లైంగిక దుర్నడత విషయమై పశ్చాత్తాపపడడానికి’
  rationale: మూలంలోని ἐκ (‘నుండి/బయటకు’) మార్పు లేదా విడిచిపెట్టడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ‘విడిచి’ ఆ భావాన్ని సహజంగా నిలుపుతుంది; అయితే నిర్మాణానికి మరో సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మూలంలోని రెండు సార్లు వచ్చే ‘పశ్చాత్తాపపడు’ క్రియను ఉద్దేశపూర్వకంగా నిలిపాం. ‘అయినా’ గ్రీకు καί రెండవ వినియోగానికి సందర్భానుగుణ విరుద్ధార్థ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
