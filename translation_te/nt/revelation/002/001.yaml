source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: te
  text: 'ఎఫెసులోని సంఘపు దూతకు[a] ఇలా రాయి: తన కుడిచేతిలో ఏడు నక్షత్రాలను పట్టుకున్నవాడు, ఏడు బంగారు దీపస్తంభాల మధ్య నడిచేవాడు ఇలా అంటున్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎఫెసులోని సంఘపు సందేశకునికి.”
    reason: ἄγγελος అనే గ్రీకు పదానికి ‘దూత’ లేదా ‘సందేశకుడు’ అనే రెండు అర్థాలూ సాధ్యమైనవి.
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: దూతకు
  rationale: గ్రీకు పదం పరలోక దూతనైనా, మానవ సందేశకుడినైనా సూచించగలదు. ‘దూత’ తెలుగు భాషలో ఈ రెండు సాధ్యతలను కొంతవరకు నిలుపుతూ ప్రకటన గ్రంథపు దర్శనాత్మక సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: ἐκκλησίας
  choice: సంఘపు
  rationale: క్రైస్తవ విశ్వాసుల సమాజాన్ని సూచించే ఈ సందర్భంలో ‘సంఘం’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, స్థిరమైన పదం.
- source_word: γράψον
  choice: ఇలా రాయి
  rationale: ఏకవచన భూతార్థక ఆజ్ఞారూపంలోని సూటి ఆదేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Τάδε λέγει
  choice: చెప్పే మాటలు ఇవి
  rationale: ప్రవచనాత్మక ప్రకటనను పరిచయం చేసే గంభీర సూత్రాన్ని, తెలుగు వాక్యనిర్మాణానికి సహజంగా ఉండేలా వ్యక్తం చేస్తుంది.
- source_word: κρατῶν
  choice: గట్టిగా పట్టుకొని
  rationale: κρατέω కేవలం చేతిలో ఉంచుకోవడం కంటే దృఢంగా పట్టుకోవడం లేదా ఆధీనంలో ఉంచుకోవడం అనే భావాన్ని కలిగిస్తుంది; ‘గట్టిగా పట్టుకొని’ ఆ బలాన్ని అతివ్యాఖ్యానం చేయకుండా తెలియజేస్తుంది.
- source_word: δεξιᾷ
  choice: కుడిచేతిలో
  rationale: మూలంలోని శరీర రూపకాన్ని నేరుగా నిలుపుతుంది; అధికారము, సంరక్షణ వంటి సాధ్యమైన ప్రతీకార్థాలను వివరణగా చేర్చదు.
- source_word: περιπατῶν … ἐν μέσῳ
  choice: మధ్య నడిచేవాడు
  rationale: దీపస్తంభాల నడుమ సంచరించే సజీవ దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: λυχνιῶν
  choice: దీపస్తంభాల
  rationale: λυχνία దీపాన్ని కాదు, దీపాన్ని ఉంచే స్తంభాన్ని సూచిస్తుంది; ప్రకటన 1లోని రూపకంతోనూ ఇది సుసంగతం.
- source_word: χρυσῶν
  choice: బంగారు
  rationale: వస్తువు బంగారంతో సంబంధమున్నదని తెలిపే సహజమైన తెలుగు విశేషణం.
theological_decisions:
- issue: సంఘపు ἄγγελος ఎవరనే ప్రశ్న
  choice: ప్రధాన పాఠ్యంలో ‘దూత’
  alternative: ‘సందేశకుడు’
  rationale: ἄγγελος అనే గ్రీకు పదం పరలోక దూతను లేదా మానవ సందేశకుడిని సూచించవచ్చు. ప్రకటన గ్రంథపు దర్శనాత్మక నేపథ్యం ‘దూత’కు అనుకూలమైనప్పటికీ, వ్యక్తి ఎవరనే విషయాన్ని నిర్ణయాత్మకంగా పరిష్కరించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రవచన సూత్రపు ఔన్నత్యాన్ని నిలుపుతూ తెలుగు పదక్రమాన్ని సహజంగా ఉంచాం; గ్రీకు వర్తమాన కృదంతాల నిరంతర క్రియాభావాన్ని ‘పట్టుకొని’, ‘నడిచేవాడు’ ద్వారా తెలిపాం.
