id: REV.2.11
reference: Revelation 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: te
  text: చెవి ఉన్నవాడు సంఘాలకు ఆత్మ ఏమి చెబుతున్నాడో వినాలి. జయించేవాడు[a] రెండవ మరణం వల్ల ఎంతమాత్రమూ హాని పొందడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అధిగమించేవాడు.’
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘రెండవ మరణం నుండి/ద్వారా ఎంతమాత్రమూ హాని పొందడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: చెవి ఉన్నవాడు
  rationale: గ్రీకు ఏకవచన ప్రతినిధి నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘చెవి’ అనే ఏకవచన రూపాన్నీ కాపాడుతుంది.
- source_word: ἀκουσάτω
  choice: వినాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞార్థక భావాన్ని ఆధునిక, సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: τί τὸ πνεῦμα λέγει
  choice: ఆత్మ ఏమి చెబుతున్నాడో
  rationale: τίని ‘ఏమి’గా, వర్తమాన λέγειని ‘చెబుతున్నాడో’గా అందిస్తూ, ఆత్మను వ్యక్తిగత దైవిక వక్తగా సందర్భానుసారంగా సూచిస్తుంది.
- source_word: ταῖς ἐκκλησίαις
  choice: సంఘాలకు
  rationale: ప్రకటన 2–3 అధ్యాయాల్లో ఉద్దేశించిన స్థానిక విశ్వాసుల సమూహాలకు ‘సంఘాలు’ సహజమైన, విస్తృతంగా అర్థమయ్యే పదం.
- source_word: ὁ νικῶν
  choice: జయించేవాడు
  rationale: నిరంతర లక్షణాన్ని సూచించే వర్తమాన కృదంత భావాన్నీ, νικάωలోని విజయ భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: οὐ μὴ
  choice: ఎంతమాత్రమూ ... పొందడు
  rationale: οὐ μήతో వ్యక్తమయ్యే బలమైన నిరాకరణను సహజ తెలుగు ఉద్ఘాటనతో తెలియజేస్తుంది.
- source_word: ἀδικηθῇ
  choice: హాని పొందడు
  rationale: ఈ సందర్భంలో క్రియకు ఉన్న ‘హాని కలగడం/గాయపడడం’ అనే భావాన్ని తెలియజేస్తుంది; కేవలం న్యాయపరమైన ‘అన్యాయం చేయబడటం’ అనే అర్థానికి పరిమితం చేయదు.
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: రెండవ మరణం వల్ల
  rationale: ἐκ సూచించే మూలం లేదా కారణసదృశ సంబంధాన్ని సహజ తెలుగులో ‘వల్ల’తో వ్యక్తం చేస్తూ, ‘రెండవ మరణం’ అనే ప్రకటన గ్రంథపు కీలక పదబంధాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: ‘ఆత్మ’ ఎవరిని సూచిస్తుంది?
  choice: సంఘాలతో మాట్లాడే దైవిక ఆత్మగా వ్యక్తిగత క్రియారూపంతో అనువదించడం
  alternative: సాధారణ ప్రవచనాత్మక శక్తిగా భావించడం
  rationale: ప్రకటన 2–3లో పునరావృతమయ్యే ఈ వాక్యసూత్రంలో ఆత్మ సంఘాలను ఉద్దేశించి మాట్లాడే దైవిక వక్తగా పనిచేస్తుంది; అయితే మూలంలో లేని ‘పరిశుద్ధ’ అనే విశేషణాన్ని పాఠ్యంలో చేర్చలేదు.
- issue: వ్యాకరణపరంగా పుంలింగ ఏకవచనమైన ప్రతినిధి రూపాలు
  choice: ‘ఉన్నవాడు,’ ‘జయించేవాడు’ అనే ఏకవచన ప్రతినిధి రూపాలను నిలుపడం
  alternative: బహువచన లేదా పూర్తిగా లింగనిరపేక్ష పునర్నిర్మాణం
  rationale: గ్రీకు పుంలింగ ఏకవచన నిర్మాణాన్ని అనుసరిస్తూనే, తెలుగులో ఇది ఎవరైనా అర్హుడైన వ్యక్తిని ప్రతినిధిగా సూచించే సాధారణ వాడుకగా అర్థమవుతుంది.
- issue: ‘రెండవ మరణం’ అర్థం
  choice: వ్యాఖ్యాత్మక విస్తరణ లేకుండా పదబంధాన్ని నిలుపడం
  alternative: ‘తుది తీర్పు’ లేదా ‘నిత్య శిక్ష’ అని పాఠ్యంలోనే వివరణ ఇవ్వడం
  rationale: ఈ పదబంధానికి ప్రకటన గ్రంథంలోనే మరింత సందర్భం లభిస్తుంది; ఇక్కడ ఒక నిర్దిష్ట సిద్ధాంత వివరణను చేర్చడం మూలంలోని సంక్షిప్తతను మించిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గంభీరమైన కానీ అతిగా ప్రాచీనంగా కాని శైలి వాడబడింది. ‘వినాలి’ ఆజ్ఞార్థక బలాన్ని సహజంగా తెలియజేస్తుంది; ‘వినుగాక’ అనే అధిక సాంప్రదాయ రూపాన్ని నివారించాం. అందించిన ఆంగ్ల consultation layerలో పాదసూచిక గుర్తుల స్థానాలు వాటి విషయాలకు సరిపోలనందున, [a]ను ‘జయించేవాడు’ వద్దకు, [b]ను హాని/రెండవ మరణం వాక్యభాగం వద్దకు ఉంచాం.
