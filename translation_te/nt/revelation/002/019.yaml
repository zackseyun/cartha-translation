id: REV.2.19
reference: Revelation 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: te
  text: నీ క్రియలను, నీ ప్రేమను, విశ్వాసాన్ని[a], సేవను, సహనాన్ని నాకు తెలుసు; నీ తరువాతి క్రియలు మొదటి క్రియలకన్నా ఎక్కువని కూడా నాకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకత్వం.” ఈ సందర్భంలో గ్రీకు పదానికి “విశ్వాసం” లేదా “నమ్మకత్వం” అనే అర్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: నాకు తెలుసు
  rationale: οἶδα ఇక్కడ వర్తమాన స్థితిని సూచిస్తూ ‘తెలుసు’ అనే అర్థం ఇస్తుంది; సంఘాలకు చెప్పే ప్రకటనలో ఇది సహజమైన ఆధునిక తెలుగు.
- source_word: ἔργα
  choice: క్రియలు
  rationale: ἔργα వ్యక్తి చేసిన కార్యాలను సూచిస్తుంది. వచనంలోని రెండు ప్రస్తావనల్లో ఒకే పదాన్ని ఉంచి మూలంలోని పునరుక్తిని కాపాడింది.
- source_word: ἀγάπην
  choice: ప్రేమ
  rationale: ἀγάπη ఇక్కడ క్రైస్తవ సద్గుణమైన క్రియాశీల ప్రేమను సూచిస్తుంది.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: πίστις‌కు ప్రధాన అర్థంగా ‘విశ్వాసం’ ఉంచబడింది; ఈ సందర్భంలో సాధ్యమైన ‘నమ్మకంగా ఉండడం’ అనే భావాన్ని పాదసూచికలో కాపాడింది.
- source_word: διακονίαν
  choice: సేవ
  rationale: διακονία ఇక్కడ ఆచరణాత్మక సేవను సూచిస్తుంది; ‘సేవ’ సులభంగా అర్థమయ్యే పదం, అధికారిక పరిచర్య పదవిని సూచించదు.
- source_word: ὑπομονήν
  choice: సహనం
  rationale: ὑπομονή ఒత్తిడి మధ్య నిలకడగా సహించడాన్ని సూచిస్తుంది; ‘సహనం’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: నీ తరువాతి క్రియలు
  rationale: ἔσχατα ఇక్కడ కాలసంబంధమైన పోలికగా, మొదటి క్రియలకు భిన్నమైన తరువాతి క్రియలను సూచిస్తుంది.
- source_word: πλείονα τῶν πρώτων
  choice: నీ మొదటి క్రియలకంటే ... ఎక్కువగా
  rationale: πλείονα సంఖ్యలో లేదా పరిమాణంలో ‘ఎక్కువ’ అనే పోలికను వ్యక్తం చేస్తుంది; మూలంలోని సరళమైన తులనను పరిష్కరించకుండా అలాగే ఉంచింది.
theological_decisions:
- issue: సద్గుణాల జాబితాలో πίστις అర్థం
  choice: విశ్వాసం
  alternative: నమ్మకంగా ఉండడం
  rationale: ఈ సందర్భంలో πίστις దేవునిపై విశ్వాసాన్ని గానీ, ప్రవర్తనలో నమ్మకంగా ఉండడాన్ని గానీ సూచించవచ్చు. ప్రధాన పాఠ్యంలో ‘విశ్వాసం’ ఉంచి, నిజమైన అర్థసందిగ్ధతను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. జాబితా స్పష్టత కోసం మొదటి క్రియను పునరుక్తం చేసినప్పటికీ, మూలంలోని అంశాల క్రమం మరియు చివరి పోలిక నిలుపబడ్డాయి.
