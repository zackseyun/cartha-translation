id: REV.2.3
reference: Revelation 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑπομονὴν ἔχεις, καὶ ἐβάστασας διὰ τὸ ὄνομά μου, καὶ ⸂οὐ κεκοπίακες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: te
  text: నీకు సహనం ఉంది; నా నామం నిమిత్తం నీవు భరించావు[a], అలసిపోలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా నామం కారణంగా’ లేదా ‘నా నామం కొరకు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీవు అలసిపోలేదు.’ ఈ మాటను శ్రమతో సంబంధపెట్టి, ‘నీవు శ్రమించి అలసిపోలేదు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: సహనం
  rationale: శ్రమలు, పరీక్షల మధ్య స్థిరంగా నిలిచే ఓర్పును సూచించే సహజమైన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: ἔχεις
  choice: నీకు ... ఉంది
  rationale: వర్తమానకాలంలోని ప్రత్యక్ష ప్రశంసను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: ἐβάστασας
  choice: నీవు కష్టాలను భరించావు
  rationale: βαστάζω ఇక్కడ మోయడం లేదా కష్టాన్ని తట్టుకోవడం అనే భావాన్ని ఇస్తుంది. తెలుగులో కర్మ లేకుండా ‘భరించావు’ అసహజంగా ఉండవచ్చు కాబట్టి సందర్భానుగుణంగా ‘కష్టాలను’ స్పష్టీకరించబడింది; ఏ నిర్దిష్ట హింసను మాత్రం చేర్చలేదు.
- source_word: διὰ τὸ ὄνομά μου
  choice: నా నామం నిమిత్తం
  rationale: διά + ద్వితీయా విభక్తి కారణం లేదా ఉద్దేశాన్ని సూచించగలదు. ‘నిమిత్తం’ ఈ రెండింటి మధ్య కొంత విస్తృతిని ఉంచుతూ బైబిలీయ ‘నామం’ పదప్రయోగాన్ని కాపాడుతుంది.
- source_word: οὐ κεκοπίακες
  choice: అలసిపోలేదు
  rationale: సహనం, భరించడం అనే సమాంతర సందర్భంలో κοπιάω శ్రమించడం కంటే అలసిపోవడం అనే భావాన్ని ఎక్కువగా ఇస్తుంది. గ్రీకు పరిపూర్ణ కాలం సూచించే కొనసాగుతున్న ఫలితస్థితిని తెలుగు సందర్భం సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సహనం మరియు కష్టభరణానికి సంబంధించిన ప్రశంస యొక్క పరిధి
  choice: యేసు నామం నిమిత్తం కష్టాలను భరించి అలసిపోకుండా నిలిచినందుకు ప్రశంసగా అనువదించడం
  alternative: దీనిని ప్రత్యేకంగా హింసను సహించడం గానీ, పరిచర్యలో శ్రమించి అలసిపోకపోవడం గానీ అర్థం చేసుకోవచ్చు.
  rationale: గ్రీకు వాక్యం కష్టభరణాన్ని ప్రశంసిస్తుంది గాని కష్టాల నిర్దిష్ట రూపాన్ని చెప్పదు. అందువల్ల హింస, పరిచర్య, ప్రతిఫలం వంటి అదనపు భావాలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: οὐ κεκοπίακες యొక్క భావం
  choice: ‘అలసిపోలేదు’
  alternative: ‘శ్రమించడం మానలేదు’ లేదా ‘శ్రమవల్ల అలసిపోలేదు’
  rationale: κοπιάωకు ‘శ్రమించు’ మరియు ‘అలసిపోవు’ అనే భావాలు రెండూ సాధ్యమే. సమాంతర సందర్భం ‘అలసిపోలేదు’ అనే భావానికి అనుకూలమైనా, శ్రమతో సంబంధమున్న ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సూటిగా, గౌరవప్రదంగా రూపొందించబడింది. ‘నామం’ అనే బైబిలీయ పదప్రయోగం నిలుపబడింది. గ్రీకులోని వరుస καίలను తెలుగులో యాంత్రికంగా పునరావృతం చేయకుండా చిన్న వాక్యం, అర్ధవిరామంతో సహజ ప్రవాహం కల్పించబడింది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల వెంటనే ఉంచబడ్డాయి.
