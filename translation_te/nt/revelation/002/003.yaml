review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents ὑπομονή as enduring steadfastness, διά τὸ ὄνομά μου as motivation related to Jesus’ name, and the final perfect clause as not becoming weary. However, ‘కష్టాలను’ supplies an explicit object (‘hardships’) that the Greek leaves unstated; the commendatory context permits that inference, but the Telugu can remain both natural and closer to the source without it.
  naturalness: ‘నా నామం నిమిత్తం నీవు భరించావు’ is a natural, reverent modern-standard Telugu expression in this context. The revised punctuation also retains the compact parallel commendation. The existing footnote’s ‘సొమ్మసిల్లిపోలేదు’ is not a suitable alternative for κοπιάω here, since it suggests fainting rather than weariness.
  terminology: ‘సహనం’ and ‘నామం’ are appropriate. ‘భరించావు’ preserves the broad bearing/enduring sense of ἐβάστασας without defining the burden as a particular kind of hardship. The final ‘అలసిపోలేదు’ appropriately renders the likely contextual sense of οὐ κεκοπίακες.
  issues:
  - severity: medium
    issue: The main text makes ‘hardships’ explicit.
    rationale: ἐβάστασας has no stated object. While hardship is contextual, adding ‘కష్టాలను’ narrows the open-ended ‘have borne/endured’ expression beyond what the Greek explicitly says.
  - severity: medium
    issue: Footnote b uses ‘సొమ్మసిల్లిపోలేదు’ as an alternative.
    rationale: ‘సొమ్మసిల్లిపోవు’ ordinarily denotes fainting, collapsing, or losing strength, not simply becoming weary; it is therefore not a reliable lexical alternative for κεκοπίακες.
  revised_text: నీకు సహనం ఉంది; నా నామం నిమిత్తం నీవు భరించావు[a], అలసిపోలేదు[b].
