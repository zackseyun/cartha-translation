revisions:
- from: నీకు సహనం ఉంది. నా నామం నిమిత్తం[a] నీవు కష్టాలను భరించావు; అలసిపోలేదు[b].
  to: నీకు సహనం ఉంది; నా నామం నిమిత్తం నీవు భరించావు[a], అలసిపోలేదు[b].
  rationale: The revision removes the supplied object ‘కష్టాలను’ so that the Telugu preserves the Greek’s unspecified object of bearing while remaining idiomatic in context. Footnote b is corrected by removing an inaccurate ‘fainting’ alternative and retaining the possible labor-related nuance. Footnote anchors remain attached to the respective Greek phrases.
