id: REV.2.24
reference: Revelation 2:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: te
  text: 'అయితే తుయతైరాలో ఉన్న మిగిలిన మీతో నేను చెబుతున్నాను: ఈ బోధను అనుసరించని, వారు పిలిచే ‘సాతాను యొక్క లోతైన సంగతులను’ తెలుసుకోని మీపై నేను మరే భారం మోపను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సాతాను యొక్క లోతులు.” ఈ గ్రీకు పదబంధం తమకు ‘లోతైన’ ఆధ్యాత్మిక జ్ఞానం ఉందనే వాదనను సూచించవచ్చు; ఆ వాదనను ఇక్కడ తిరస్కరించబడినదిగా చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς λοιποῖς τοῖς ἐν Θυατείροις
  choice: తుయతైరలో ఉన్న మీలో మిగిలినవారితో
  rationale: సంఘంలో ఆ బోధను అనుసరించేవారికి భిన్నంగా ఉన్న మిగతా సభ్యులను సూచించే ప్రత్యక్ష సంబోధనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔχουσιν τὴν διδαχὴν ταύτην
  choice: ఈ బోధను అనుసరించనివారు
  rationale: ఇక్కడ ἔχω కేవలం కలిగి ఉండడం కాక, ఒక బోధను స్వీకరించి పట్టుకొని ఉండడాన్ని సూచిస్తుంది; ‘అనుసరించు’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: తెలుసుకోనివారు
  rationale: ఆ విషయాల్లో ప్రవేశించి అనుభవపూర్వకంగా ఎరిగిన భావాన్ని పూర్తిగా అతిశయింపకుండా సాధారణ తెలుగు రూపంలో ఇస్తుంది.
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: ‘సాతాను లోతైన సంగతులు’
  rationale: βαθέα యొక్క ‘లోతైన విషయాలు/లోతులు’ అనే రూపకాన్ని, ఆధ్యాత్మిక గూఢజ్ఞాన దావాపై ఉండగల వ్యంగ్య ధ్వనిని నిలుపుతుంది.
- source_word: ὡς λέγουσιν
  choice: అని వారు చెప్పేవాటిని
  rationale: ఆ పేరు ఎవరి మాటగా నివేదించబడుతోందో పూర్తిగా నిర్ణయించకుండా, నివేదిత లేదా వ్యంగ్య నామకరణ భావాన్ని నిలుపుతుంది.
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: మీపై నేను వేరే భారమేదీ మోపను
  rationale: βάλλω ἐπί అనే ప్రయోగంలోని విధింపును సహజమైన తెలుగులో వ్యక్తం చేస్తూ βάρος అనే ‘భారం’ రూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘సాతాను లోతైన సంగతులు, అని వారు చెబుతారు’ అనే మాట యొక్క ఉద్దేశం
  choice: నివేదిత లేదా వ్యంగ్య నామంగా అనిశ్చితిని నిలుపుతూ ‘సాతాను లోతైన సంగతులు’ అని వారు చెప్పేవి అని అనువదించడం
  alternative: అబద్ధ బోధకులు తమ బోధను ‘లోతైన సంగతులు’ అని పిలిచారని, యోహాను దాని మూలాన్ని సాతానుగా నిర్ధారించాడని స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం సంక్షిప్తంగా, వాదాత్మకంగా ఉండి ఖచ్చితమైన వక్తను లేదా వ్యంగ్య నిర్మాణాన్ని పూర్తిగా నిర్ణయించదు; అందువల్ల వ్యాఖ్యానంతో ఖాళీని పూరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మోపను’ ద్వారా విధించిన బాధ్యత భావం, ఉద్ధరణ చిహ్నాల ద్వారా వివాదాస్పద నామకరణం స్పష్టమవుతాయి. పాదసూచిక గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
