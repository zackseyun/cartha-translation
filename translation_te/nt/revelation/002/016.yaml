id: REV.2.16
reference: Revelation 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: te
  text: కాబట్టి పశ్చాత్తాపపడు. అలా చేయకపోతే, నేను త్వరగా నీ దగ్గరకు వస్తాను; నా నోటి ఖడ్గంతో[b] వారికి విరోధంగా[a] యుద్ధం చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘వారితో’; ఇక్కడ యుద్ధ సందర్భంలో భావం ‘వారికి విరోధంగా’.
    reason: lexical_alternative
  - marker: b
    text: ‘నా నోటి ఖడ్గం’ అనేది క్రీస్తు పలికే న్యాయతీర్పును సూచించే అపోకలిప్టిక్ దృశ్యరూపం.
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: పశ్చాత్తాపపడు
  rationale: నిర్ణయాత్మకంగా మనసు మార్చుకొని చెడు మార్గం నుండి తిరగమనే ఏకవచన ఆజ్ఞను, దాని నైతిక-ఆధ్యాత్మిక బలాన్ని ఈ పదం సహజంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి గద్దింపునుండి వచ్చే నిర్ధారణను, వాక్యాల మధ్య తార్కిక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εἰ δὲ μή
  choice: అలా చేయకపోతే
  rationale: పశ్చాత్తాపపడాలనే ఆజ్ఞను తిరిగి సూచిస్తూ, షరతుతో కూడిన హెచ్చరికను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔρχομαί σοι
  choice: నేను ... నీ దగ్గరికి వస్తాను
  rationale: గ్రీకు వర్తమాన రూపంలోని సమీప భవిష్యత్ భావాన్ని తెలుగులో సహజమైన హెచ్చరికగా అందిస్తుంది. శత్రుత్వ భావాన్ని ఈ పదబంధంలో చేర్చకుండా, తరువాతి యుద్ధ ప్రకటనలోనే ఉంచుతుంది.
- source_word: ταχύ
  choice: త్వరగా
  rationale: సమీపత్వమా లేక చర్య వేగమా అనే మూలపాఠంలోని స్వల్ప సందిగ్ధతను పూర్తిగా ఒక వైపుకు పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: πολεμήσω μετ’ αὐτῶν
  choice: వారికి విరోధంగా యుద్ధం చేస్తాను
  rationale: πολεμέω తరువాత μετά + షష్ఠీ విభక్తి సందర్భంలో ప్రతికూల సంబంధాన్ని సూచిస్తుంది; తెలుగులో వారు మిత్రపక్షమనే అపార్థం రాకుండా శత్రుత్వ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: ఖడ్గంతో
  rationale: ἐν యొక్క సాధనార్థక ప్రయోగాన్ని సహజంగా వ్యక్తం చేస్తూ, తీర్పు అమలయ్యే సాధనానికి సంబంధించిన దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: τῇ ῥομφαίᾳ τοῦ στόματός μου
  choice: నా నోటి ఖడ్గంతో
  rationale: ప్రకటన గ్రంథంలోని ఉద్దేశపూర్వక అపోకలిప్టిక్ దృశ్యాన్ని ‘నా మాటతో’ అని సరళీకరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: సంఘానికి క్రీస్తు రాకకూ, తప్పుచేసేవారిపై ఆయన యుద్ధానికీ ఉన్న సంబంధం
  choice: ఏకవచనంగా ఉద్దేశించిన సంఘం దగ్గరికి ఆయన వస్తాడు; అయితే ‘వారికి విరోధంగా’ యుద్ధం చేస్తాడు.
  alternative: ఆయన భేదం లేకుండా సంఘమంతటికీ విరోధంగా వస్తాడు; లేదా సంఘాన్ని ఉద్దేశించకుండా కేవలం తప్పుడు బోధకుల దగ్గరికే వస్తాడు.
  rationale: మూలపాఠం ‘నీ దగ్గరికి’ అనే ఏకవచన సంబోధనను, ‘వారికి విరోధంగా’ అనే లక్ష్యిత తీర్పును రెండింటినీ ఉంచుతుంది. అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
- issue: ‘నా నోటి ఖడ్గం’ అనే తీర్పు సాధనం
  choice: రూపకాత్మక-అపోకలిప్టిక్ దృశ్యాన్ని యథాతథంగా నిలుపడం
  alternative: ‘నా మాటతో’ లేదా ‘నా వాక్కు శక్తితో’ అని వివరణాత్మకంగా మార్చడం
  rationale: మూలపాఠంలోని బలమైన దృశ్యాన్ని వివరణగా చదును చేయకుండా ఉంచడం వల్ల దాని సాహిత్య, తీర్పుసంబంధ బలం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘పశ్చాత్తాపపడు’ అనే స్థిరమైన ఆధ్యాత్మిక పదాన్ని ఉంచి, మిగతా వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం. మూలంలో సంఘాన్ని ఉద్దేశించే ‘నీ’ ఏకవచనం, తప్పుచేసేవారిని సూచించే ‘వారు’ బహువచనం స్పష్టంగా నిలుపబడ్డాయి.
