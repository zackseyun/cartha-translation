  verdict: revise
  source_fidelity: The draft accurately renders the imperative call to repentance, the conditional warning, Christ’s coming to the singularly addressed church, the hostile action directed toward the plural ‘them,’ and the instrumental image of the sword of his mouth. ‘వారికి విరోధంగా’ correctly expresses the adversative force intended by μετ’ αὐτῶν in this context without suggesting alliance.
