revisions:
- from: చెవి ఉన్నవాడు సంఘాలకు ఆత్మ చెప్పేది వినాలి. జయించేవాడికి దాచివుంచబడిన మన్నాలో కొంత ఇస్తాను. అతనికి తెల్లని రాయిని కూడా ఇస్తాను; ఆ రాయిమీద ఒక కొత్త పేరు రాసి ఉంటుంది. దాన్ని పొందేవాడికి తప్ప మరెవరికీ ఆ పేరు తెలియదు.[a]
  to: చెవి ఉన్నవాడు సంఘాలకు ఆత్మ చెప్పేది వినాలి. జయించేవాడికి దాచివేయబడిన మన్నాలో కొంత ఇస్తాను. అతనికి తెల్లని రాయిని, దానిమీద రాయబడి ఉన్న కొత్త పేరును ఇస్తాను. ఆ పేరును పొందేవాడికి తప్ప మరెవరికీ అది తెలియదు.[a]
  rationale: The revision retains the Greek sequence and ambiguity while making explicit that ‘I will give’ governs both ‘a white stone’ and ‘a new name written on it.’ ‘దాచివేయబడిన’ is a natural modern rendering of the perfect participle ‘hidden.’ The final sentence identifies the new name as the thing unknown to all except its recipient, without adding an interpretation of the stone’s symbolism.
