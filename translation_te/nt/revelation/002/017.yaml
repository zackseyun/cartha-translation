id: REV.2.17
reference: Revelation 2:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: te
  text: చెవి ఉన్నవాడు సంఘాలకు ఆత్మ చెప్పేది వినాలి. జయించేవాడికి దాచివేయబడిన మన్నాలో కొంత ఇస్తాను. అతనికి తెల్లని రాయిని, దానిమీద రాయబడి ఉన్న కొత్త పేరును ఇస్తాను. ఆ పేరును పొందేవాడికి తప్ప మరెవరికీ అది తెలియదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తెల్లని రాయి’ అనేది ఓటు వేయడానికి వాడే గులకరాయిని, నిర్దోషిగా ప్రకటించిన సూచకాన్ని, లేదా ప్రవేశానికి ఇచ్చే గుర్తును జ్ఞాపకం చేయవచ్చు; ఇక్కడ ఏ నేపథ్యం ఉద్దేశించబడిందో పాఠం స్పష్టంగా చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: చెవి ఉన్నవాడు
  rationale: గ్రీకు ఏకవచన నుడికారాన్ని సహజమైన తెలుగులో దగ్గరగా నిలుపుతుంది; ఇది సాధారణంగా ప్రతి వినేవారినీ ఉద్దేశిస్తుంది.
- source_word: ἀκουσάτω
  choice: వినాలి
  rationale: ఆజ్ఞార్థక భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: సందర్భంలో దైవిక ఆత్మ ఉద్దేశించబడినా, మూలపాఠంలో ఉన్నట్లే ‘పరిశుద్ధ’ అనే విశేషణాన్ని చేర్చలేదు.
- source_word: ταῖς ἐκκλησίαις
  choice: సంఘాలకు
  rationale: ప్రకటన గ్రంథంలోని స్థానిక విశ్వాస సమాజాలకు ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజమైన పదం.
- source_word: τῷ νικῶντι
  choice: జయించేవాడికి
  rationale: νικάω పదంలోని విజయం/జయించడం అనే సజీవ భావాన్ని నిలుపుతుంది.
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: దాచివుంచబడిన మన్నాలో కొంత
  rationale: δίδωμι తరువాతి జనిటివ్ పదార్థంలోనుండి కొంత లేదా ఒక భాగం ఇవ్వడాన్ని సూచించగలదు; perfect participle కొనసాగుతున్న దాచబడిన స్థితిని తెలియజేస్తుంది.
- source_word: ψῆφον λευκήν
  choice: తెల్లని రాయి
  rationale: ψῆφος యొక్క సాధారణ దృశ్యరూపాన్ని నిలుపుతూ, అది ఓటు రాయా, నిర్దోషిత్వ సూచకమా, ప్రవేశ చిహ్నమా అనే విషయాన్ని ప్రధాన పాఠంలో నిర్ణయించదు.
- source_word: ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον
  choice: ఆ రాయిమీద ఒక కొత్త పేరు రాసి ఉంటుంది
  rationale: శాసనం రాయిమీద ఉన్నదనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తూ, perfect participle యొక్క పూర్తయి నిలిచివున్న స్థితిని ప్రతిబింబిస్తుంది.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: దాన్ని పొందేవాడికి తప్ప మరెవరికీ ఆ పేరు తెలియదు
  rationale: సాపేక్ష సర్వనామం ‘పేరు’ను సూచిస్తుందని స్పష్టం చేస్తూ, పొందబడేది రాయి-పేరు సముదాయమనే సహజ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఏకవచన పురుషరూపాల సాధారణ వర్తింపు
  choice: ‘ఉన్నవాడు’, ‘జయించేవాడు’, ‘అతనికి’, ‘పొందేవాడు’ అనే ఏకవచన రూపాలను నిలుపుట
  alternative: లింగసూచన లేని బహువచన లేదా ‘ఎవరైతే’ నిర్మాణాన్ని ఉపయోగించడం
  rationale: గ్రీకు వ్యాకరణపరంగా పుంలింగ ఏకవచనాన్ని వాడుతుంది; అది ప్రతినిధిత్వపూర్వకంగా అందరికీ వర్తించినప్పటికీ, మూలరూపాన్ని తెలుగు సహజత్వంలో నిలిపాం.
- issue: ψῆφος λευκή యొక్క ప్రతీకార్థం
  choice: ‘తెల్లని రాయి’ అని మాత్రమే అనువదించి ప్రతీకను నిర్ణయించకుండా ఉంచుట
  alternative: నిర్దోషిత్వ చిహ్నం, విందులో ప్రవేశానికి గుర్తు, లేదా ఓటు రాయి అని నిర్దిష్టీకరించడం
  rationale: మూలవాక్యం సాంస్కృతిక నేపథ్యాన్ని వివరించదు. అందువల్ల వ్యాఖ్యాన అవకాశాలను అడుగుకுறிப்பులో ఉంచి, ప్రధాన పాఠంలో అస్పష్టతను కాపాడాం.
- issue: కొత్త పేరును ఎవరు తెలుసుకుంటారు
  choice: పొందేవాడికి తప్ప మరెవరికీ తెలియదని మూలపాఠానుసారం నిలుపుట
  alternative: పేరు ఇచ్చేవాడైన క్రీస్తుకు కూడా తెలుసని భావాన్ని పాఠంలో చేర్చడం
  rationale: వక్తకు ఆ పేరు తెలియదనే తాత్విక నిర్ణయాన్ని వాక్యం తప్పనిసరిగా సూచించకపోయినా, మూలంలోని పరిమిత వాక్యాన్ని విస్తరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రకటన గ్రంథపు గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘మన్నా’, ‘ఆత్మ’, ‘సంఘాలు’ వంటి స్థిరపడిన బైబిలు పదజాలం ఉపయోగించబడింది.
