id: REV.2.5
reference: Revelation 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: te
  text: కాబట్టి నీవు ఎక్కడి నుండి పడిపోయావో జ్ఞాపకం చేసుకో[a], పశ్చాత్తాపపడి, మొదట చేసిన కార్యాలను చేయి. అలా చేయకపోతే, నేను నీ దగ్గరికి వస్తున్నాను; నీవు పశ్చాత్తాపపడకపోతే నీ దీపస్తంభాన్ని దాని స్థానం నుండి తొలగిస్తాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు ఎంత ఎత్తు నుండి పడిపోయావో.” గ్రీకులో అక్షరార్థంగా “ఎక్కడి నుండి పడిపోయావో” ఉంది; కొందరు ఇందులో ఎత్తును సూచించే రూపకం అంతర్లీనంగా ఉందని భావిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: ప్రకటన 1:20లో ‘దీపస్తంభం’ ఒక సంఘాన్ని సూచించే ప్రతీక.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: జ్ఞాపకం చేసుకో
  rationale: వర్తమాన ఆజ్ఞ నిరంతరంగా గుర్తుంచుకోవాలనే భావాన్ని కలిగి ఉన్నా, ఆధునిక తెలుగులో సహజమైన ఆజ్ఞారూపంగా ‘జ్ఞాపకం చేసుకో’ సరిపోతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి గద్దింపునుండి వచ్చే తార్కిక పర్యవసానాన్ని స్పష్టంగా చూపుతుంది.
- source_word: πόθεν πέπτωκας
  choice: ఎక్కడి నుండి పడిపోయావో
  rationale: గ్రీకు పదబంధంలోని ‘ఎక్కడి నుండి’ అనే ఉద్దేశపూర్వక అస్పష్టతను, పూర్తయి ప్రస్తుతం ఫలితమున్న పతన భావాన్ని నిలుపుతుంది; ‘ఎంత ఎత్తు నుండి’ అని ప్రధాన పాఠ్యంలో వివరణను చేర్చదు.
- source_word: μετανόησον / μετανοήσῃς
  choice: పశ్చాత్తాపపడు / పశ్చాత్తాపపడకపోతే
  rationale: నైతిక-ఆధ్యాత్మిక సందర్భంలో స్థిరపడిన, సంక్షిప్తమైన తెలుగు ప్రయోగం.
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: మొదట చేసిన క్రియలను మళ్లీ చేయి
  rationale: πρῶτα యొక్క కాలసంబంధ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘మళ్లీ’ అనేది మొదటి క్రియలకు తిరిగి రావాలనే సందర్భానుగుణ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: εἰ δὲ μή
  choice: అలా చేయకపోతే
  rationale: గ్రీకు హెచ్చరికలోని షరతును తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔρχομαί σοι
  choice: నేను నీ దగ్గరికి వస్తున్నాను
  rationale: వర్తమాన రూపంలోని సజీవమైన తక్షణ భావాన్ని నిలుపుతుంది; మూలంలో లేని ‘నీకు విరోధంగా’ అనే అర్థాన్ని చేర్చదు.
- source_word: κινήσω
  choice: తొలగిస్తాను
  rationale: ‘దాని స్థానం నుండి’ అనే పదబంధంతో కలిపి, కేవలం కదల్చడం కాక స్థానం నుంచి తీసివేయడమే సందర్భార్థం.
- source_word: τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς
  choice: నీ దీపస్తంభాన్ని దాని స్థానం నుండి
  rationale: λυχνίαను దీపంగా కాక దీపస్తంభంగా అనువదించి, ప్రకటన గ్రంథంలోని ప్రతీకాత్మక చిత్రాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: దీపస్తంభాన్ని తొలగిస్తాననే హెచ్చరిక స్వభావం
  choice: సంఘాన్ని సూచించే దీపస్తంభం అనే ప్రతీకను ప్రధాన పాఠ్యంలో వివరించకుండా నిలుపుట
  alternative: దీనిని సంఘ సాక్ష్యం కోల్పోవడం, సంఘ స్థితి లేదా ఉనికిపై తీర్పు, లేక వ్యక్తిగత రక్షణ కోల్పోవడం అని నిర్దిష్టీకరించడం
  rationale: ప్రకటన 1:20 దీపస్తంభాలను సంఘాలతో అనుసంధానిస్తుంది; అయితే ఈ వాక్యం వ్యక్తిగత రక్షణ గురించి ఒక నిర్దిష్ట సిద్ధాంతపరమైన తీర్మానాన్ని చెప్పదు. అందువల్ల ప్రతీకలోని ఉద్వేగం, విస్తృతి నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే ఏకవచన సంబోధన వాడబడింది. మూలంలోని మూడు ఆజ్ఞలు, షరతుతో కూడిన హెచ్చరిక, దీపస్తంభ ప్రతీక నిలుపబడ్డాయి.
