id: REV.2.12
reference: Revelation 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: te
  text: '“పెర్గములోని సంఘపు దూతకు ఇలా రాయి: పదునైన రెండు అంచులుగల ఖడ్గాన్ని కలిగినవాడు ఇలా చెబుతున్నాడు:[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దూత’కు బదులుగా ‘సందేశవాహకుడు’ అని కూడా అనువదించవచ్చు. ఇక్కడ సూచించబడినవాడు పరలోక దూతనా, సంఘానికి చెందిన మానవ ప్రతినిధినా అనే విషయంలో వ్యాఖ్యాతల అభిప్రాయాలు భిన్నంగా ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: దూతకు
  rationale: ἄγγελος అనే పదం పరలోక దూతను గానీ మానవ సందేశవాహకుణ్ణి గానీ సూచించగలదు. ‘దూత’ ఈ రెండు అవకాశాలను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἐκκλησίας
  choice: సంఘపు
  rationale: ఈ క్రైస్తవ సందర్భంలో ἐκκλησία విశ్వాసుల సమాజాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘సంఘం’ స్పష్టమైన, సహజమైన పదం.
- source_word: γράψον
  choice: రాయి
  rationale: ఇది γράφω యొక్క ఏకవచన ఆజ్ఞార్థక రూపం; తరువాత వచ్చే ప్రకటన దాని విషయాన్ని అందిస్తుంది.
- source_word: Τάδε λέγει
  choice: చెప్పే మాటలు ఇవి
  rationale: ప్రవచనాత్మక లేదా రాజాజ్ఞాపక ప్రకటనను పరిచయం చేసే సూత్రాన్ని, తెలుగులో సహజంగా ఉండేలా మరియు ప్రకటన 2–3లోని పునరావృత శైలిని నిలుపుతూ అనువదించబడింది.
- source_word: ὁ ἔχων
  choice: కలిగినవాడు
  rationale: గుణవాచక బిరుదు వంటి articular participle భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ῥομφαίαν
  choice: ఖడ్గం
  rationale: ῥομφαία పెద్ద లేదా బరువైన కత్తిని సూచించవచ్చు; ‘ఖడ్గం’ గంభీరమైన సందర్భానికి తగినదిగా ఉండి, అవసరం లేని ప్రత్యేకీకరణను నివారిస్తుంది.
- source_word: δίστομον
  choice: రెండంచుల
  rationale: అక్షరార్థంగా ‘రెండు నోళ్లుగల’ అనే గ్రీకు విశేషణం కత్తి విషయంలో రెండు వైపులా అంచుగలదని సూచిస్తుంది; ‘రెండంచుల’ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: ὀξεῖαν
  choice: పదునైన
  rationale: కత్తి యొక్క పదునును నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Περγάμῳ
  choice: పెర్గములో
  rationale: Πέργαμος అనే స్థలనామానికి ఆధునిక తెలుగు లిప్యంతరీకరణ; స్థానవాచక భావాన్ని ‘లో’తో తెలిపింది.
theological_decisions:
- issue: సంఘపు ‘దూత’ ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘దూత’ అని ఉంచి, అతడు పరలోక జీవినా మానవ ప్రతినిధినా నిర్ణయించలేదు.
  alternative: ‘సందేశవాహకుడు’ లేదా ‘సంఘ నాయకుడు’ అని స్పష్టీకరించడం.
  rationale: ἄγγελος పదం రెండు విధాల అర్థాన్ని అనుమతిస్తుంది; ఈ వాక్యం ఆ సూచిత వ్యక్తి ఎవరో తేల్చదు. అందువల్ల పాఠ్యంలోని నిజమైన సందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనదిగానూ గంభీరమైనదిగానూ రూపొందించబడింది. ‘ఇలా రాయి’ మరియు ‘చెప్పే మాటలు ఇవి’ ద్వారా ఆజ్ఞాపూర్వక, ప్రవచనాత్మక ధోరణి నిలుపబడింది; ‘దూత’ అనే పదంలోని ఉద్దేశపూర్వక సందిగ్ధతను పాదసూచికతో సంరక్షించాం.
