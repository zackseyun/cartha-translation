id: REV.2.18
reference: Revelation 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: te
  text: '“తుయతైరలోని సంఘపు దేవదూతకు[a] ఇలా రాయి: ‘అగ్నిజ్వాలవంటి కళ్లూ, మెరుగుపెట్టిన కంచువంటి పాదాలూ కలిగిన దేవుని కుమారుడు ఇలా అంటున్నాడు:’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవదూత’కు బదులుగా ‘సందేశవాహకుడు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: దూతకు
  rationale: ‘దూత’ అనే తెలుగు పదం దేవదూతను లేదా సందేశవాహకుణ్ణి సూచించగలదు; ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ సందర్భానికి సరిపోతూ, మూలపదంలోని నిజమైన సందిగ్ధతను కూడా నిలుపుతుంది.
- source_word: τῆς ἐν Θυατείροις ἐκκλησίας
  choice: తుయతైరలోని సంఘ
  rationale: స్థల నామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చి, ἐκκλησίαను క్రైస్తవ సమాజాన్ని సహజంగా సూచించే ‘సంఘం’గా అనువదించాం.
- source_word: Τάδε λέγει
  choice: చెప్పే మాటలు ఇవి
  rationale: ప్రవచనాత్మక సందేశ సూత్రాన్ని గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: మూలంలోని స్పష్టమైన క్రీస్తుసంబంధ బిరుదును ఎటువంటి వివరణాత్మక మార్పు లేకుండా నేరుగా నిలుపుతుంది.
- source_word: ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός
  choice: అగ్నిజ్వాలలాంటి కళ్లూ
  rationale: ὡς సూచించే ఉపమానాన్ని, φλόγα πυρόςలోని ఉజ్జ్వల అపోకలిప్టిక్ చిత్రణను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ
  choice: మెరుగుపెట్టిన కంచులాంటి పాదాలూ
  rationale: అరుదైన χαλκολίβανονకు ఖచ్చితమైన లోహార్థం అనిశ్చితమైనందున, ప్రకాశించే శుద్ధి చేసిన లోహ చిత్రాన్ని తెలిపే సుపరిచిత తెలుగు పదబంధాన్ని ఎంచుకుని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: ἀγγέλῳ సూచించే వ్యక్తి
  choice: దూత
  alternative: దేవదూత లేదా సందేశవాహకుడు
  rationale: తెలుగు ‘దూత’ రెండు భావాలనూ మోయగలదు. ప్రధాన పాఠం అపోకలిప్టిక్ సందర్భాన్ని నిలుపుతుండగా, పాదటిప్పణి మానవ సందేశవాహకుడనే అవకాశాన్ని మూసివేయదు.
- issue: వక్త యొక్క క్రీస్తుసంబంధ స్వీయ గుర్తింపు
  choice: దేవుని కుమారుడు
  alternative: లేదు
  rationale: ὁ υἱὸς τοῦ θεοῦ అనే స్పష్టమైన బిరుదును నేరుగా అనువదించి, దాని సంబంధాత్మక లేదా దైవిక భావాన్ని తగ్గించలేదు.
- issue: χαλκολιβάνῳ యొక్క ఖచ్చితమైన లోహ సూచన
  choice: మెరుగుపెట్టిన కంచు
  alternative: శుద్ధి చేసి ప్రకాశిస్తున్న లోహం లేదా మిశ్రలోహం
  rationale: పదం అరుదైనదీ ఖచ్చితార్థం అనిశ్చితమైనదీ కావడంతో, ప్రధాన పాఠంలో సజీవమైన సంప్రదాయ లోహచిత్రాన్ని ఇచ్చి, విస్తృతమైన సాధ్యార్థాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ప్రకటన గ్రంథపు గంభీరమైన ప్రవచనాత్మక శైలిని నిలుపుతూ రూపొందించబడింది. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠంలో ఉన్నాయి.
