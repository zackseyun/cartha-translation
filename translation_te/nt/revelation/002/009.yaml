id: REV.2.9
reference: Revelation 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: te
  text: నీ బాధను, నీ పేదరికాన్ని నాకు తెలుసు—అయినా నీవు ధనవంతుడవు—తాము యూదులమని చెప్పుకొనేవారు, కానీ యూదులు కానివారు చేసే అపనిందను కూడా నాకు తెలుసు; వారు సాతాను యొక్క సినగోగు[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దూషణ.’ ఈ సందర్భంలో ఇది విశ్వాసులకు వ్యతిరేకంగా పలికిన పరువు తీసే మాటలను సూచిస్తుంది; అందుకే ప్రధాన పాఠంలో ‘అపనింద’ అని వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: మూలంలోని ‘సినగోగు’ అనే పదానికి ‘సమాజం,’ ‘సభ’ లేదా ‘సమావేశం’ అనే అర్థాలు కూడా ఉండవచ్చు. ఇక్కడ అది యూదుల సమాజాన్ని సూచించే పదంగా కూడా పనిచేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: బాధ
  rationale: ఒత్తిడి, కష్టం, హింస వల్ల కలిగే బాధ అనే విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అంత్యకాలానికి సంబంధించిన సాంకేతిక అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: πτωχείαν
  choice: పేదరికం
  rationale: భౌతిక లేమిని సూటిగా, సాధారణ పాఠకులకు స్పష్టంగా తెలియజేసే సహజ తెలుగు పదం.
- source_word: πλούσιος
  choice: ధనవంతుడవు
  rationale: భౌతిక పేదరికానికి ఎదురుగా ఉన్న పదునైన వైరుధ్యాన్ని నిలుపుతుంది. అది ఆత్మసంబంధమైన ధనమని మూలపాఠం స్పష్టంగా చెప్పనందున అదనపు వివరణ చేర్చలేదు.
- source_word: βλασφημίαν
  choice: అపనింద
  rationale: ఈ సందర్భంలో విశ్వాసుల మీద పలికే హానికరమైన, పరువు తీసే మాటలను సూచిస్తుంది. దేవునికి విరోధంగా పలికే దైవదూషణ అనే అర్థానికే పరిమితం చేయదు.
- source_word: ἐκ τῶν λεγόντων
  choice: చెప్పుకుంటారు ... వారివారి
  rationale: ἐκ సూచించే మూలం లేదా వారి నుంచి వచ్చే అపనింద అనే సంబంధాన్ని తెలుగులో సహజమైన షష్ఠీ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: తాము యూదులమని చెప్పుకుంటారు
  rationale: ἑαυτούς యొక్క ఆత్మవాచక బలాన్ని ‘తాము’ ద్వారా నిలుపుతూ, తెలుగులో సహజంగా ఉంది.
- source_word: συναγωγὴ
  choice: సమాజం
  rationale: సమావేశమైన సమూహం లేదా సంఘం అనే ప్రాథమిక భావాన్ని తెలుగులో తెలియజేస్తుంది; ఇక్కడి యూదు సమాజానికి సంబంధించిన చారిత్రక ప్రత్యేకతను పాదసూచిక వివరిస్తుంది.
- source_word: τοῦ Σατανᾶ
  choice: సాతాను సమాజం
  rationale: ‘సాతానుకు చెందిన సమాజం’ అనే జనిటివ్ సంబంధాన్ని సంక్షిప్తంగా నిలుపుతూ, మూలంలోని తీవ్రమైన వాదనాత్మక భాషను మెత్తబరచదు.
theological_decisions:
- issue: ‘తాము యూదులమని చెప్పుకుంటారు గాని యూదులు కారు’ అనే వాదనాత్మక మాటను ఎలా అనువదించాలి
  choice: ‘యూదులు’ అనే పదాన్ని యథాతథంగా ఉంచి, మూలపాఠంలోని వ్యత్యాసాన్ని విస్తరించకుండా అనువదించడం
  alternative: ‘దేవుని ప్రజలమని చెప్పుకునేవారు’ లేదా ‘నిజమైన యూదులమని చెప్పుకునేవారు’
  rationale: Ἰουδαίους స్పష్టంగా ‘యూదులు’ అని ఉంది. జాతిపరమైన గుర్తింపును నిరాకరిస్తున్నట్లు బలపరచడమో, ‘నిజమైన’ వంటి మూలంలో లేని విశేషణాన్ని చేర్చడమో చేయకుండా, నిబంధన సంబంధమైన ప్రామాణికత గురించిన ఉద్రిక్తతను అలాగే ఉంచాలి.
- issue: ‘ధనవంతుడవు’ అనేది ఆత్మసంబంధమైన ధనమని స్పష్టం చేయాలా
  choice: మూలపాఠంలాగే విశేషణం లేకుండా ‘ధనవంతుడవు’ అని ఉంచడం
  alternative: ‘ఆత్మసంబంధంగా ధనవంతుడవు’
  rationale: పేదరికంతో ఉన్న వైరుధ్యం భౌతికేతర సంపదను సూచించినా, గ్రీకు పాఠం దానిని స్పష్టంగా నిర్వచించదు. వివరణను అనువాదంలోకి చేర్చి భావాన్ని ముందుగానే నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. ‘ఎరుగుదును’ వంటి ప్రాచీన రూపాల బదులు ‘నాకు తెలుసు’ వాడబడింది. మూలంలోని రెండు వ్యత్యాసాలు—పేదవాడైనా ధనవంతుడు; యూదులమని చెప్పుకున్నా యూదులు కారు—వివరణాత్మక పదాలు చేర్చకుండా నిలుపబడ్డాయి.
