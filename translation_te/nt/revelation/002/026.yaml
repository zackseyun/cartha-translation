  rationale: జయిస్తూ స్థానంలో జయించేవాడూ పెట్టడం ద్వారా ὁ νικῶν యొక్క substantival present-participle భావాన్ని, అలాగే ὁ τηρῶνతో దాని సమన్వయాన్ని నిలుపాం. జాతులపై అనేది ἐπὶ τῶν ἐθνῶνకు మరింత నేరమైన, ఆధునిక సహజమైన అనువాదం. ఫుట్‌నోట్లు మూలపాఠంలోని ప్రాతినిధ్య పుంలింగ రూపాన్ని మరియు ‘నా క్రియలు’ అనే సంబంధంలోని ఉద్దేశపూర్వక అస్పష్టతను యథాతథంగా వివరిస్తాయి.
