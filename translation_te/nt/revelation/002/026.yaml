base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: te
  text: జయించేవాడూ, నా క్రియలను అంతం వరకు పాటించేవాడూ అయిన వ్యక్తికి[a] జాతులపై అధికారం ఇస్తాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘జయించేవాడు … పాటించేవాడు … అతనికి’ అని ఏకవచన పుంలింగ రూపాలు ఉన్నాయి; ఇక్కడ అవి ప్రాతినిధ్యార్థంలో వాడబడ్డాయి.
    reason: cultural_note
  - marker: b
    text: ‘నా క్రియలు’ అంటే యేసుకు చెందిన లేదా ఆయనకు అనుగుణమైన క్రియలు—ఆయన కార్యాలు, ఉద్దేశాలు, లేదా ఆయన కోరే కార్యాలు—అని అర్థం కావచ్చు; గ్రీకు ఈ సంబంధాన్ని మరింత నిర్దిష్టం చేయదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: జయిస్తూ
  rationale: వర్తమాన కృదంతం నిరంతరంగా జయించే స్వభావాన్ని సూచిస్తుంది; ప్రకటన గ్రంథంలోని పోరాట చిత్రణను నిలుపుతుంది.
- source_word: ὁ τηρῶν
  choice: పాటించే
  rationale: τηρέω లోని కాపాడడం, గైకొనడం, నమ్మకంగా అనుసరించడం అనే భావాలను ఈ సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἄχρι τέλους
  choice: అంతం వరకు
  rationale: నిర్దిష్ట ముగింపు వరకు నిలకడగా కొనసాగడాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: τὰ ἔργα μου
  choice: నా క్రియలను
  rationale: గ్రీకులోని స్వామ్య సంబంధాన్ని సంకుచితం చేయకుండా నిలుపుతుంది; ఇవి యేసు చేసిన క్రియలా, ఆయనకు చెందిన ఉద్దేశాలా, ఆయన కోరే కార్యాలా అన్నది వాక్యం నిర్దిష్టం చేయదు.
- source_word: δώσω αὐτῷ
  choice: ఆ వ్యక్తికి … ఇస్తాను
  rationale: తెలుగులో సహజమైన వాక్య నిర్మాణంతో పరోక్ష కర్మను స్పష్టంగా ఉంచుతుంది; గ్రీకు ఏకవచన రూపానికి అనుగుణంగా ఉంది.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: కేవలం శక్తికన్నా పాలించే హక్కు లేదా అప్పగించబడిన అధికారాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: జనముల మీద
  rationale: ἐπί + షష్ఠీ విభక్తి ఇక్కడ పాలనా సంబంధాన్ని సూచిస్తుంది; ἔθνη ప్రపంచంలోని జనాలు లేదా దేశజన సమూహాలను సూచిస్తుంది.
theological_decisions:
- issue: ప్రాతినిధ్య ఏకవచన పుంలింగ రూపం
  choice: వ్యక్తికి
  alternative: అతనికి
  rationale: గ్రీకులో పుంలింగ ఏకవచనం ఉన్నా అది ప్రాతినిధ్యంగా వాడబడింది. తెలుగులో ‘వ్యక్తికి’ అని అనడం స్త్రీలను మినహాయించకుండా మూలంలోని ఏకవచన భావాన్ని నిలుపుతుంది.
- issue: ‘నా క్రియలు’ అనే సంబంధం
  choice: నా క్రియలను
  alternative: నేను ఆజ్ఞాపించిన వాటిని / నా కోసం చేసే క్రియలను
  rationale: మూలపాఠం ఆ సంబంధాన్ని మరింత నిర్దిష్టం చేయదు. అందువల్ల ఆజ్ఞలు లేదా యేసు కోసం చేసే పనులు అని సంకుచితం చేయకుండా నిజమైన భావసందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘క్రియలు’ మూలంలోని ἔργα పదబంధాన్ని, దాని ఉద్దేశపూర్వక భావసందిగ్ధతను నిలుపుతుంది; ‘జనములు’ ప్రకటన గ్రంథపు విశాల ప్రపంచజన భావానికి అనుకూలం.
