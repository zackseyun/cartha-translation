review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the promise of authority over the nations and preserves the ambiguity of τὰ ἔργα μου. However, initial జయిస్తూ functions adverbially ('while conquering') rather than as the first substantival, characterizing participle ὁ νικῶν. The revision represents both coordinated participles as descriptions of the same person.
  naturalness: అంతం వరకు and అధికారం are natural. The revised paired construction is more explicit and idiomatic than an initial adverbial participle, while retaining the Greek's twofold description.
  terminology: క్రియలు appropriately retains the broad, somewhat marked sense of ἔργα without reducing it to commandments. జాతులపై more directly and naturally expresses ἐπὶ τῶν ἐθνῶν ('over the nations') than జనముల మీద in contemporary standard Telugu. అధికారం accurately renders ἐξουσία.
  issues:
  - severity: medium
    issue: జయిస్తూ is adverbial rather than substantival.
    rationale: ὁ νικῶν denotes 'the one who conquers/is conquering,' coordinated with ὁ τηρῶν. జయిస్తూ can suggest that the keeping occurs merely while one is conquering, rather than presenting conquering as a defining qualification alongside keeping.
  - severity: low
    issue: జనముల మీద is less precise for ἐπὶ τῶν ἐθνῶν.
    rationale: జనములు can mean people generally. జాతులపై is a natural modern Telugu expression for authority over the nations and better retains the collective-political sense.
  revised_text: జయించేవాడూ, నా క్రియలను అంతం వరకు పాటించేవాడూ అయిన వ్యక్తికి[a] జాతులపై అధికారం ఇస్తాను.[b]
