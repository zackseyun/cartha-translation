id: REV.2.13
reference: Revelation 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: te
  text: నీవు ఎక్కడ నివసిస్తున్నావో నాకు తెలుసు—సాతాను సింహాసనం ఉన్న చోటే. అయినా నీవు నా నామాన్ని గట్టిగా పట్టుకున్నావు; అంతిపా దినాల్లో కూడా నాపై విశ్వాసాన్ని[a] నిరాకరించలేదు. అతడు నా సాక్షి[b], నాకు నమ్మకమైనవాడు; సాతాను నివసించే చోట, మీ మధ్య అతడు చంపబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నా విశ్వాసాన్ని.’ ఈ గ్రీకు పదబంధాన్ని ‘నాపై విశ్వాసాన్ని’ లేదా ‘నా నమ్మకత్వాన్ని’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘నా హతసాక్షి.’ ఇక్కడి గ్రీకు పదానికి ప్రాథమికంగా ‘సాక్షి’ అని అర్థం; బాధ లేదా మరణ సందర్భంలో అది ‘హతసాక్షి’ అనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: నాకు తెలుసు
  rationale: గ్రీకు perfect రూపానికి ఇక్కడ వర్తమాన అర్థం ఉంది; ఆధునిక తెలుగులో ఇది సహజమైన, ప్రత్యక్షమైన వ్యక్తీకరణ.
- source_word: κατοικεῖς
  choice: నీవు నివసిస్తున్నావు
  rationale: స్థిరంగా ఒక చోట జీవించడం లేదా ఉండడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: అక్కడే సాతాను సింహాసనం ఉంది
  rationale: అపోకలిప్టిక్ రూపకాన్ని వ్యాఖ్యానంతో విస్తరించకుండా అలాగే నిలుపుతుంది; ‘అక్కడే’ ఆ ప్రదేశంపై ఉన్న బలాన్ని తెలియజేస్తుంది.
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: నా నామాన్ని గట్టిగా పట్టుకొని ఉన్నావు
  rationale: κρατέωలోని దృఢంగా అంటిపెట్టుకొని ఉండే భావాన్ని కాపాడుతుంది; ‘నామం’ మూలంలోని ధార్మిక, విధేయతా బలాన్ని నిలుపుతుంది.
- source_word: οὐκ ἠρνήσω τὴν πίστιν μου
  choice: నాపై విశ్వాసాన్ని నిరాకరించలేదు
  rationale: సందర్భంలో సహజంగా అర్థమయ్యే objective-genitive భావాన్ని ప్రధాన పాఠ్యంలో ఇస్తుంది; గ్రీకు పదబంధంలోని ఇతర సాధ్యార్థాలను పాదసూచికలో నిలుపుతుంది.
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: అంతిప రోజుల్లో కూడా
  rationale: కాలసూచక పదబంధాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; ‘కూడా’ పరీక్ష తీవ్రమైన ఆ కాలంలోనూ విశ్వాసం నిరాకరించలేదనే సంబంధాన్ని చూపుతుంది.
- source_word: ὁ μάρτυς μου
  choice: నా సాక్షి
  rationale: μάρτυς యొక్క ప్రాథమిక అర్థం ‘సాక్షి’; మరణ సందర్భంలో వచ్చే ‘హతసాక్షి’ భావాన్ని పాదసూచికలో సూచిస్తుంది.
- source_word: ὁ πιστός μου
  choice: నాకు నమ్మకమైనవాడు
  rationale: ముందున్న ‘సాక్షి’తో కలిపివేయకుండా appositional నిర్మాణాన్ని, πιστόςలోని నమ్మకత్వ భావాన్ని కాపాడుతుంది.
- source_word: ἀπεκτάνθη παρ’ ὑμῖν
  choice: మీ మధ్య అతడు చంపబడ్డాడు
  rationale: కర్తను ఊహించకుండా passive భావాన్ని నిలుపుతుంది; παρά + dativeను ‘మీ మధ్య’గా అనువదించడం సంఘమే అతణ్ణి చంపిందనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: τὴν πίστιν μου అనే పదబంధం యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘నాపై విశ్వాసాన్ని’
  alternative: ‘నా విశ్వాసాన్ని’ లేదా ‘నా నమ్మకత్వాన్ని’
  rationale: సందర్భంలో యేసుపై విశ్వాసాన్ని నిరాకరించకపోవడం అత్యంత సహజమైన పఠనం. అయినప్పటికీ μουతో కూడిన సంక్షిప్త గ్రీకు నిర్మాణం ఇతర సంబంధాలను కూడా అనుమతిస్తుంది; కాబట్టి వాటిని పాదసూచికలో స్పష్టంగా ఉంచి theological tensionను తొలగించలేదు.
- issue: మరణ సందర్భంలో μάρτυςను ఎలా అనువదించాలి
  choice: ప్రధాన పాఠ్యంలో ‘సాక్షి’
  alternative: ‘హతసాక్షి’
  rationale: ‘సాక్షి’ మూలపదం యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతుంది. అంతిప చంపబడ్డాడని వాక్యమే స్పష్టంగా చెబుతుంది; అందువల్ల తరువాతి సాంకేతిక అర్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చకుండా పాదసూచికలో అందించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగిస్తూ ప్రకటన గ్రంథానికి తగిన గంభీరతను నిలిపాం. ‘నామం,’ ‘సింహాసనం,’ ‘సాక్షి’ వంటి మూలచిత్రాలను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా ఉంచాం. సంబోధన ఏకవచనంగా (‘నీవు’) ఉండగా, παρ’ ὑμῖνలో సంఘసమూహాన్ని సూచించే బహువచనాన్ని (‘మీ మధ్య’) కాపాడాం.
