id: REV.16.1
reference: Revelation 16:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: te
  text: 'ఆలయ పరిశుద్ధస్థలం నుండి[a] ఒక బిగ్గర స్వరం ఆ ఏడుగురు దేవదూతలతో ఇలా చెప్పడాన్ని నేను విన్నాను: “వెళ్లి, దేవుని ఉగ్రకోపపు ఏడు గిన్నెలను[b] భూమి మీద కుమ్మరించండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆలయం.’ గ్రీకు పదం ναός తరచుగా ఆలయ సముదాయం మొత్తాన్ని కాక దాని అంతర్గత పరిశుద్ధ స్థలాన్ని మరింత నిర్దిష్టంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం వెడల్పుగా, అంతగా లోతులేని పాత్రలను సూచిస్తుంది. సాంప్రదాయ అనువాదాల్లో దీనిని ‘సీసాలు’ అని కూడా అనువదించారు; ‘పాత్రలు’ అనేది మరో సాధ్యమైన సాధారణ అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: ఒక స్వరం బిగ్గరగా
  rationale: φωνήతో వాడిన μέγας ఇక్కడ స్వరం గొప్పదనే గుణాన్ని కాక దాని అధిక ధ్వనిని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ναοῦ
  choice: ఆలయ పరిశుద్ధ స్థలం
  rationale: ναός సాధారణంగా ఆలయ సముదాయం మొత్తాన్ని కాక దాని అంతర్గత పరిశుద్ధ స్థలాన్ని సూచిస్తుంది. ప్రకటన గ్రంథంలోని పరలోక దృశ్యానికి ఈ నిర్దిష్టత తగినది.
- source_word: λεγούσης
  choice: ఇలా చెప్పడం
  rationale: ఈ వర్తమాన కృదంతం ‘స్వరం’తో అన్వయిస్తుంది. తెలుగులో ప్రత్యక్ష వాక్యానికి ముందు ‘ఇలా చెప్పడం’ అని అనువదించడం సహజంగా ఉండి గ్రీకు వాక్య సంబంధాన్ని నిలుపుతుంది.
- source_word: Ὑπάγετε
  choice: వెళ్లి
  rationale: ఇది దేవదూతలు వెళ్లి ఆజ్ఞను అమలు చేయాలనే సరళమైన బహువచన ఆజ్ఞ.
- source_word: ἐκχέετε
  choice: కుమ్మరించండి
  rationale: పాత్రలో ఉన్నదాన్ని పూర్తిగా బయటికి పోయడమనే దృశ్యాన్ని ‘కుమ్మరించండి’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φιάλας
  choice: గిన్నెలు
  rationale: φιάλη సీసాను కాక వెడల్పుగా, అంతగా లోతులేని పాత్రను సూచిస్తుంది. ఆధునిక తెలుగులో ‘గిన్నెలు’ ఆ వస్తువును స్పష్టంగా తెలియజేస్తుంది.
- source_word: θυμοῦ
  choice: ఉగ్రకోపం
  rationale: ఇక్కడ θυμός దేవుని తీవ్రమైన న్యాయతీర్పు సంబంధమైన కోపాన్ని సూచిస్తుంది. ‘ఉగ్రకోపం’ దాని తీవ్రతను తెలియజేస్తుంది.
- source_word: εἰς τὴν γῆν
  choice: భూమి మీద
  rationale: ἐκχέωతో కూడిన εἰς, ఒక ఉపరితలం మీదికి కుమ్మరించే దిశను సూచించగలదు. సందర్భం విశ్వవ్యాప్త తీర్పు కాబట్టి γῆని ‘దేశం’గా కాక ‘భూమి’గా అనువదించాం.
theological_decisions:
- issue: పరలోక దృశ్యంలో ναός అనువాదం
  choice: ఆలయ పరిశుద్ధ స్థలం
  alternative: ఆలయం
  rationale: ‘ఆలయ పరిశుద్ధ స్థలం’ అనే అనువాదం ναόςకు ఉన్న అంతర్గత పవిత్రస్థల భావాన్ని నిలుపుతుంది; అయినా ‘ఆలయం’ అనే విస్తృత అనువాదం కూడా సాధ్యమే.
- issue: θυμός τοῦ θεοῦ అనువాదం
  choice: దేవుని ఉగ్రకోపం
  alternative: దేవుని కోపం
  rationale: ఈ సందర్భంలో దేవుని తీర్పులో వ్యక్తమయ్యే తీవ్రమైన కోపం ఉద్దేశించబడింది. ‘ఉగ్రకోపం’ దాని గంభీరతను చూపుతుంది, అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. ప్రత్యక్ష ఆజ్ఞ స్పష్టంగా ఉండేలా వాక్య నిర్మాణం క్రమబద్ధీకరించబడింది; మూలంలోని దృశ్యరూపకాలు, దిశ, తీవ్రత నిలుపబడ్డాయి.
