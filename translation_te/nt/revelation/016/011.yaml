id: REV.16.11
reference: Revelation 16:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: te
  text: వారు తమ నొప్పులనుబట్టి, తమ పుండ్లనుబట్టి[b] పరలోక దేవుణ్ణి దూషించారు[a]; తమ క్రియలను విడిచి పశ్చాత్తాపపడలేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరలోక దేవుణ్ణి నిందించారు,’ లేక ‘ఆయన గురించి చెడుగా మాట్లాడారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తమ వ్రణాలనుబట్టి.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘తమ క్రియలనుండి పశ్చాత్తాపపడలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: దూషించారు
  rationale: దేవునికి వ్యతిరేకంగా అవమానకరంగా, అపవిత్రంగా మాట్లాడడాన్ని సూచించే βλασφημέω భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘దూషించారు’ తెలియజేస్తుంది.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: పరలోక దేవుణ్ణి
  rationale: ‘పరలోక దేవుడు’ అనే గంభీరమైన బైబిలు బిరుదు గ్రీకు షష్ఠీ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: తమ నొప్పులనుబట్టి
  rationale: ఈ సందర్భంలో ἐκ కారణాన్ని సూచిస్తుంది; πόνοι తీవ్రమైన బాధలను లేదా నొప్పులను సూచిస్తుంది. ‘నొప్పులనుబట్టి’ కారణార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἑλκῶν
  choice: పుండ్లు
  rationale: ἕλκος పుండు లేదా వ్రణాన్ని సూచిస్తుంది. ‘పుండ్లు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, అవసరానికి మించిన వైద్య నిర్దిష్టతను చేర్చదు.
- source_word: μετενόησαν
  choice: పశ్చాత్తాపపడలేదు
  rationale: ప్రకటన గ్రంథంలో μετανοέω కేవలం అభిప్రాయం మార్చుకోవడం కాక, నైతికంగా పశ్చాత్తాపపడడాన్ని సూచిస్తుంది.
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: తమ క్రియలను విడిచిపెట్టి
  rationale: μετανοέωతో వాడిన ἐκ, గత క్రియలనుండి వైదొలగడాన్ని సూచిస్తుంది. ‘విడిచిపెట్టి’ ఆ వియోగ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పునరావృతమైన ἐκ పదబంధాల భావం
  choice: నొప్పులు, పుండ్ల కారణంగా వారు దేవుణ్ణి దూషించారు; తమ క్రియలను విడిచి పశ్చాత్తాపపడలేదు.
  alternative: మొదటి రెండు చోట్ల ἐκను ‘నుండి’ అని మరింత అక్షరార్థంగా అనువదించడం; చివరి చోట ‘తమ క్రియల విషయమై’ అని అనువదించడం.
  rationale: మొదటి రెండు పదబంధాల్లో ἐκ సందర్భానుసారంగా కారణార్థకంగా ఉంది; μετανοέωతో ఉన్న చివరి పదబంధంలో అది క్రియలనుండి వైదొలగడాన్ని సూచిస్తుంది. ఈ భేదాన్ని నిలుపడం బాధకు వారి ప్రతిస్పందనను—పశ్చాత్తాపం కాక దూషణను—అదనపు సిద్ధాంత వ్యాఖ్యానం లేకుండా స్పష్టపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రకటన-గ్రంథ శైలిని అనుసరించాం. ‘దూషించారు,’ ‘పశ్చాత్తాపపడలేదు’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం.
