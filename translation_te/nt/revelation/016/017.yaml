id: REV.16.17
reference: Revelation 16:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: te
  text: ఏడవవాడు తన గిన్నెలోనిది గాలిలోకి కుమ్మరించాడు. అప్పుడు పవిత్రస్థలం[a] నుండి, సింహాసనం నుండి బిగ్గర స్వరం బయలుదేరి, “జరిగిపోయింది”[b] అని పలికింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవాలయం.” గ్రీకు పదమైన ναός సాధారణంగా ఆలయ సముదాయం మొత్తాన్ని కాక దాని పవిత్రస్థలాన్ని ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పూర్తయింది.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: ఏడవవాడు
  rationale: గ్రీకులో ‘దూత’ అనే పదం లేకుండా నిర్ణయార్థక ఉపపదంతో కూడిన క్రమసంఖ్య మాత్రమే ఉంది. సందర్భంలో ఏడవ దూత ఉద్దేశించబడినా, మూలంలోని అధ్యాహారాన్ని అనువాదంలో నిలిపాం.
- source_word: ἐξέχεεν
  choice: కుమ్మరించాడు
  rationale: పాత్రలోని ద్రవాన్ని వెలుపలికి పోయడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రకటన 16లో పునరావృతమయ్యే తీర్పు-పాత్రల సందర్భానికీ సరిపోతుంది.
- source_word: φιάλην
  choice: గిన్నెను
  rationale: వెడల్పాటి పాత్రను సూచించే φιάληకు ‘గిన్నె’ సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక సమానార్థకం; చిన్న సీసా అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: ἐπὶ τὸν ἀέρα
  choice: గాలిలోకి
  rationale: పోయడం అనే క్రియతో ἐπί + ద్వితీయా విభక్తి సూచించే దిశను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: పెద్ద స్వరం బయలుదేరి
  rationale: φωνὴ μεγάλη యొక్క శబ్ద తీవ్రతను ‘పెద్ద స్వరం’ తెలియజేస్తుంది; ‘బయలుదేరి’ అనేది ἐξῆλθενలోని వెలుపలికి రావడం అనే భావాన్ని నిలుపుతుంది.
- source_word: ἐκ τοῦ ναοῦ
  choice: పవిత్రస్థలం నుండి
  rationale: ναός సాధారణంగా ఆలయ సముదాయం మొత్తాన్ని కాక దాని అంతర్గత పవిత్రస్థలాన్ని సూచిస్తుంది.
- source_word: ἀπὸ τοῦ θρόνου
  choice: సింహాసనం దగ్గర నుండి
  rationale: స్వరపు మూలాన్ని సూచించే రెండవ పదబంధాన్ని మొదటిదానితో కలిపివేయకుండా నిలుపుతుంది; తెలుగులో సింహాసనమే స్వరం పలికిందనే అసహజ భావాన్ని తగ్గిస్తుంది.
- source_word: λέγουσα
  choice: అని పలికింది
  rationale: స్త్రీలింగ కృదంతం φωνήతో అన్వయిస్తుంది; తెలుగులో స్వరం పలికిందని చెప్పడం సహజంగా ఉంటుంది.
- source_word: Γέγονεν
  choice: జరిగిపోయింది
  rationale: γίνομαι యొక్క సంపూర్ణ కాలం సూచించే జరిగి పూర్తయిన ఫలితస్థితిని సంక్షిప్తంగా, గంభీరంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: అపోకలిప్టిక్ పరలోక ఆలయ దృశ్యంలో ναός అనువాదం
  choice: పవిత్రస్థలం
  alternative: దేవాలయం
  rationale: ఇది సిద్ధాంత నిర్ణయం కంటే పదార్థ నిర్దిష్టతకు సంబంధించినది. ‘పవిత్రస్థలం’ అనేది ναόςను విస్తృత ఆలయ సముదాయార్థంలోకి విస్తరించకుండా ఉంచుతుంది; సాధ్యమైన విస్తృత అనువాదాన్ని పాదసూచికలో ఇచ్చాం.
- issue: Γέγονενలోని పూర్తి/ఫలిత భావం
  choice: జరిగిపోయింది
  alternative: పూర్తయింది
  rationale: ఏడవ పాత్రతో సంభవించిన కార్యం పూర్తయినదనే సంపూర్ణ కాల భావాన్ని ప్రధాన పాఠం నిలుపుతుంది. ఏది పూర్తయిందో వివరించి వేదాంతపరంగా నిర్ణయించకుండా, సాంప్రదాయిక పూర్తి సూత్రానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర శైలిని వాడాం. మూలంలో ‘దూత’ లేనందున దానిని చేర్చలేదు. రెండు మూలసూచక పదబంధాలను వేరుగా నిలిపి, Γέγονενలోని సంక్షిప్తతను కాపాడాం.
