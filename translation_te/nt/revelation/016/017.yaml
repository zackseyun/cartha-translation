revisions:
- from: ఏడవవాడు తన గిన్నెను గాలిలోకి కుమ్మరించాడు. అప్పుడు పవిత్రస్థలం[a] నుండి, సింహాసనం దగ్గర నుండి పెద్ద స్వరం బయలుదేరి, “జరిగిపోయింది”[b] అని పలికింది.
  to: ఏడవవాడు తన గిన్నెలోనిది గాలిలోకి కుమ్మరించాడు. అప్పుడు పవిత్రస్థలం[a] నుండి, సింహాసనం నుండి బిగ్గర స్వరం బయలుదేరి, “జరిగిపోయింది”[b] అని పలికింది.
  rationale: The revision corrects the weakened rendering of “from the throne,” makes the bowl-pouring expression idiomatic in modern standard Telugu, and improves the natural rendering of “a loud voice.” It preserves the original’s ellipsis (“ఏడవవాడు”), the separate sanctuary and throne phrases, and the terse completed-action declaration.
