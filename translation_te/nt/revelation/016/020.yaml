- from: ప్రతి ద్వీపం పారిపోయింది[a]; పర్వతాలు కనిపించకుండా పోయాయి.
  to: ప్రతి ద్వీపం పారిపోయింది[a]; పర్వతాలు కనిపించలేదు.
  rationale: The first clause and its footnote are retained. The second clause is revised from an interpretive disappearance expression to ‘పర్వతాలు కనిపించలేదు,’ which naturally conveys the negated passive ‘mountains were not found’ and preserves the source text’s ambiguity. The semicolon appropriately retains the compact coordination of the two clauses in Telugu.
  reviewer_model: gpt-5.6-terra
