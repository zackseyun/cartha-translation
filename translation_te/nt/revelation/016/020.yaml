  text: And every island fled[a], and mountains were not found.
translation:
  language: te
  text: ప్రతి ద్వీపం పారిపోయింది[a]; పర్వతాలు కనిపించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అదృశ్యమైంది.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘పారిపోయింది’ అని అర్థం; ఇది వచనంలోని సజీవ మానవీకరణను నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα νῆσος
  choice: ప్రతి ద్వీపం
  rationale: ఏకవచన నామవాచకంతో ఉన్న πᾶσα విభాజక భావాన్ని ఇస్తుంది; అందువల్ల ‘ప్రతి ద్వీపం’ సహజంగా, కచ్చితంగా ఉంది.
- source_word: ἔφυγεν
  choice: పారిపోయింది
  rationale: φεύγω యొక్క మౌలిక భావమైన ‘పారిపోవడం’ను నిలుపుతూ, ప్రకటన గ్రంథంలోని సజీవ మానవీకరణ చిత్రణను కాపాడుతుంది.
- source_word: ὄρη οὐχ εὑρέθησαν
  choice: పర్వతాలు కనిపించకుండా పోయాయి
  rationale: ‘కనిపించలేదు’ అనే అక్షరార్థ రూపం తెలుగులో కేవలం చూపుకు అడ్డుపడిన భావాన్ని ఇవ్వవచ్చు; సందర్భంలో అవి ఇక కనబడనంతగా తొలగిపోయిన ఫలితాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది, అయినా నాశనమయ్యాయని స్పష్టంగా జోడించదు.
- source_word: καὶ ... καὶ
  choice: …; …
  rationale: తెలుగులో రెండు సమన్వయ వాక్యభాగాలను అర్ధవిరామంతో కలపడం సహజం; మూలంలోని సంచిత, సమాంతర నిర్మాణం నిలుస్తుంది.
theological_decisions:
- issue: ప్రళయసంబంధ చిత్రణను అక్షరార్థ సంఘటనగా లేదా ప్రతీకగా ముందే నిర్ణయించాలా
  choice: ద్వీపం ‘పారిపోయింది’ అనే స్పష్టమైన చిత్రణను యథాతథంగా నిలుపడం
  alternative: ‘ద్వీపం అదృశ్యమైంది’ అని వ్యాఖ్యానాత్మకంగా సరళీకరించడం
  rationale: గ్రీకు పాఠం మానవీకరణతో కూడిన సజీవ చిత్రాన్ని ఇస్తుంది. అది అక్షరార్థమా ప్రతీకాత్మకమా అనే ప్రశ్నను అనువాదం నిర్ణయించకుండా పాఠకునికి వదిలివేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గంభీరమైన శైలి. ‘పారిపోయింది’ ద్వారా మూలంలోని సజీవ చిత్రణను నిలిపి, పాదటిప్పణిలో సందర్భోచిత ప్రత్యామ్నాయాన్ని ఇచ్చాం.
