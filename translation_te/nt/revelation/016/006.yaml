id: REV.16.6
reference: Revelation 16:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι αἷμα ἁγίων καὶ προφητῶν ἐξέχεαν, καὶ αἷμα αὐτοῖς ⸀δέδωκας πιεῖν· ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: te
  text: ఎందుకంటే వారు పరిశుద్ధులూ ప్రవక్తలూ అయిన వారి రక్తాన్ని కుమ్మరించారు[a]; నీవు వారికి తాగడానికి రక్తాన్ని ఇచ్చావు. వారు అర్హులు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరిశుద్ధులూ ప్రవక్తలూ అయిన వారి రక్తాన్ని చిందించారు.’ గ్రీకు క్రియకు అక్షరార్థం ‘కుమ్మరించారు’; చుట్టుపక్కల సందర్భంలో తీర్పు గిన్నెలలోని విషయాలు కుమ్మరించబడడాన్ని కూడా ఇది ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘వారు అర్హులు’ అంటే వారు ఈ తీర్పుకు పాత్రులని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: మునుపటి వచనంలోని ప్రకటనకు కారణాన్ని పరిచయం చేసే సహజమైన తెలుగు కారణార్థక పదం.
- source_word: αἷμα
  choice: రక్తం
  rationale: ప్రతీకార న్యాయంలోని ఉద్దేశపూర్వక పునరుక్తిని నిలుపుతూ, రెండు చోట్లా మూలంలోని సూటి పదాన్ని ఉపయోగించింది.
- source_word: ἁγίων
  choice: పరిశుద్ధులు
  rationale: ప్రకటన గ్రంథంలో దేవునికి చెందిన పరిశుద్ధ ప్రజలను సూచించే స్థిరమైన బైబిలు పదం; తరువాతి కాలంలోని ప్రత్యేక మతపరమైన హోదాను ఉద్దేశించదు.
- source_word: προφητῶν
  choice: ప్రవక్తలు
  rationale: మూలపదానికి సూటిగా, సహజంగా సరిపోయే పదం.
- source_word: ἐξέχεαν
  choice: కుమ్మరించారు
  rationale: ἐκχέω అనే క్రియలోని ‘pour out’ చిత్రాన్ని నిలుపుతుంది; చుట్టుపక్కల గిన్నెలు కుమ్మరించబడే తీర్పు దృశ్యంతో ఉన్న ప్రతిధ్వనిని కూడా కాపాడుతుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: హింసకు పాల్పడినవారిని సూచించే పరోక్ష కర్మను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δέδωκας
  choice: ఇచ్చావు
  rationale: గ్రీకు పరిపూర్ణ కాలం సూచించే పూర్తయిన దైవిక చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘ఇచ్చి ఉన్నావు’ వంటి రూపం ఇక్కడ కృత్రిమంగా ఉంటుంది.
- source_word: πιεῖν
  choice: తాగడానికి
  rationale: ‘ఇచ్చావు’ అనే క్రియకు సహజమైన ఉద్దేశార్థక పూరకంగా ఉండి, మూలంలోని భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἄξιοί εἰσιν
  choice: వారు అర్హులే
  rationale: మూలంలో స్పష్టంగా చెప్పని కర్మను ప్రధాన వాక్యంలో చేర్చకుండా, గంభీరమైన న్యాయనిర్ణయ ప్రకటనను మరియు దాని ఉద్విగ్నతను నిలుపుతుంది.
theological_decisions:
- issue: ప్రతీకార న్యాయ భాష
  choice: ‘వారికి తాగడానికి రక్తాన్ని ఇచ్చావు; వారు అర్హులే’ అనే కఠినమైన ప్రత్యక్ష ప్రకటనను నిలుపడం.
  alternative: ‘వారికి తగిన శిక్షగా రక్తాన్ని తాగించావు; వారు దానికి తగినవారే’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: గ్రీకు వాక్యం దైవిక తీర్పును రక్తానికి రక్తం అనే అనుపాత రూపంలో ఉంచుతుంది. దాన్ని సాధారణ శిక్షగా మృదువుగా మార్చకుండా అలాగే నిలిపింది; ‘అర్హులు’ ఇక్కడ నైతిక శ్రేష్ఠతను కాదు, ఈ తీర్పుకు పాత్రతను సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- issue: ἁγίων అనే పదం సూచించే వారు
  choice: దేవుని పరిశుద్ధ ప్రజలు అనే విస్తృత బైబిలు అర్థంలో ‘పరిశుద్ధులు’ అని అనువదించడం.
  alternative: ‘పరిశుద్ధ జనులు’ అని అనువదించడం.
  rationale: ప్రకటన గ్రంథంలో దేవుని ప్రజలకు వాడే సాధారణ పదాన్ని నిలుపుతూ, తరువాతి సంఘ సంప్రదాయాల్లోని ప్రత్యేక వర్గాన్ని పాఠ్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన న్యాయస్థాన ధోరణిని పాటించింది. ‘కుమ్మరించారు’ అనే కొంత అసాధారణమైన రక్తవర్ణనను సందర్భంలోని గిన్నెల ప్రతిధ్వని కోసం ఉద్దేశపూర్వకంగా నిలిపి, సాధారణ ప్రత్యామ్నాయమైన ‘చిందించారు’ను పాదసూచికలో ఇచ్చింది.
