id: REV.16.2
reference: Revelation 16:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: te
  text: మొదటివాడు వెళ్లి తన పాత్రను భూమి మీద కుమ్మరించాడు. అప్పుడు మృగపు ముద్రను కలిగి, దాని ప్రతిమను పూజించేవారిపై హానికరమైన, తీవ్రమైన పుండు[a] పుట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అసహ్యమైన, చెడ్డ పుండు.’ గ్రీకులో κακόν, πονηρόν అనే రెండు బలమైన విశేషణాలు పుండు యొక్క ఘోరతను నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: వెళ్లి
  rationale: కథన క్రమంలోని కదలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘వెళ్లిపోయాడు’ అనే అదనపు నొక్కును చేర్చదు.
- source_word: ὁ πρῶτος
  choice: మొదటివాడు
  rationale: గ్రీకులో విశేషణం నామవాచకంగా వాడబడింది. సందర్భంలో మొదటి దేవదూతను సూచించినా, మూలంలో లేని ‘దేవదూత’ను వచనంలో చేర్చకుండా ఉంచుతుంది.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: తన పాత్రను ... కుమ్మరించాడు
  rationale: φιάλη అనేది వెడల్పాటి పాత్ర; ‘పాత్ర’ సాధారణ పాఠకులకు సహజం. ἐκχέω యొక్క పూర్తిగా పోయడం అనే భావాన్ని ‘కుమ్మరించాడు’ స్పష్టంగా అందిస్తుంది.
- source_word: εἰς τὴν γῆν
  choice: భూమి మీద
  rationale: పాత్రలోని ద్రవం భూమిని లక్ష్యంగా చేసుకొని పోయబడిందనే దిశార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἕλκος
  choice: పుండు
  rationale: చర్మంపై కలిగే బాధాకరమైన గాయాన్ని సూచించే సులభమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం; మరీ వైద్యపరమైన నిర్దిష్టతను రుద్దదు.
- source_word: κακὸν καὶ πονηρὸν
  choice: హానికరమైన, తీవ్రమైన
  rationale: రెండు బలమైన ప్రతికూల విశేషణాల తీవ్రతను నిలుపుతూ, పుండుకు నైతికమైన ‘చెడు’ అనే భావాన్ని అనవసరంగా ఆపాదించదు.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: ఉన్నవారికీ ... పూజించేవారికీ
  rationale: ἄνθρωποι ఇక్కడ మానవులను లింగభేదం లేకుండా సూచిస్తుంది. తెలుగు సంబంధవాచక నిర్మాణం బాధ ఎవరికి కలిగిందో సహజంగా చూపుతుంది.
- source_word: τὸ χάραγμα τοῦ θηρίου
  choice: మృగపు ముద్ర
  rationale: ప్రకటన గ్రంథంలోని కీలక పదబంధాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది; χάραγμα యొక్క గుర్తు లేదా ముద్ర భావాన్ని నిలుపుతుంది.
- source_word: προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: దాని ప్రతిమను పూజించేవారికి
  rationale: προσκυνέω ఇక్కడ ఆరాధనాత్మకంగా సాగిలపడడం లేదా పూజించడం; సందర్భానుసారంగా ‘పూజించేవారు’ సహజమైన ఎంపిక. αὐτοῦ మృగాన్ని సూచిస్తుందని ‘దాని’ ద్వారా నిలుపబడింది.
theological_decisions:
- issue: κακὸν καὶ πονηρὸν అనే రెండు విశేషణాల అర్థం
  choice: హానికరమైన, తీవ్రమైన
  alternative: అసహ్యమైన, చెడ్డ; బాధాకరమైన, ఘోరమైన
  rationale: ఈ జత పీడ యొక్క తీవ్రతను పెంచుతుంది. అనువాదం రెండు విశేషణాలను నిలుపుతూ, పుండును నైతికంగా దుష్టమైనదిగా నిర్ణయించదు; సాధ్యమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: శిక్షకు గురయ్యేవారి పరిధి
  choice: మృగపు ముద్ర ఉన్నవారికీ, దాని ప్రతిమను పూజించేవారికీ
  alternative: ప్రజలందరికీ
  rationale: గ్రీకు వాక్యం శిక్షను మృగంతో ముద్ర మరియు ప్రతిమారాధన ద్వారా అనుబంధమైన వారికే స్పష్టంగా పరిమితం చేస్తుంది; దాన్ని విస్తరించకూడదు.
- issue: ὁ πρῶτος యొక్క గుర్తింపు
  choice: మొదటివాడు
  alternative: మొదటి దేవదూత
  rationale: సందర్భం దేవదూతను సూచించినప్పటికీ, గ్రీకు వచనం ఇక్కడ నామవాచకాన్ని పునరావృతం చేయదు. కాబట్టి మూలంలోని సంక్షిప్తతను, సందర్భాధారిత గుర్తింపును నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలి. ‘మొదటివాడు’ మూలంలోని నామవాచకరహిత రూపాన్ని నిలుపుతుంది; ‘పాత్ర’, ‘పుండు’, ‘ముద్ర’, ‘ప్రతిమ’ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పదాలు. ప్రధాన వచనంలో [a] గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
