revisions:
- from: మొదటివాడు వెళ్లి తన పాత్రను భూమి మీద కుమ్మరించాడు. అప్పుడు మృగపు ముద్ర ఉన్నవారికీ, దాని ప్రతిమను పూజించేవారికీ హానికరమైన, తీవ్రమైన పుండు[a] పుట్టింది.
