id: REV.16.12
reference: Revelation 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: te
  text: ఆరవవాడు తన పాత్రను యూఫ్రటీసు అనే మహానదిపై కుమ్మరించాడు. అప్పుడు సూర్యోదయ దిక్కు నుండి వచ్చే రాజులకు మార్గం సిద్ధం కావడానికి దాని నీరు ఎండిపోయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సరళంగా: ‘తూర్పు నుండి వచ్చే రాజులకు.’ అక్షరార్థంగా: ‘సూర్యుడు ఉదయించే దిక్కు నుండి.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: ఆరవవాడు
  rationale: గ్రీకు మూలంలో నామవాచకం లేకుండా పూర్వసందర్భంలోని పాత్రను కుమ్మరించే వ్యక్తిని సూచించే క్రమసంఖ్య మాత్రమే ఉంది. అందువల్ల మూలంలో లేని ‘దూత’ను చేర్చలేదు.
- source_word: ἐξέχεεν
  choice: కుమ్మరించాడు
  rationale: ἐκχέω అనే క్రియ పాత్రలోని దానిని వెలుపలికి పోయడాన్ని సూచిస్తుంది; ‘కుమ్మరించాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ప్రకటన గ్రంథంలోని తీర్పు-పాత్ర చిత్రణను నిలుపుతుంది.
- source_word: φιάλην
  choice: పాత్రను
  rationale: φιάλη విశాలమైన గిన్నె లేదా పాత్రను సూచిస్తుంది. తెలుగు బైబిలు సందర్భంలో ‘పాత్ర’ సహజమైనది; ఆధునిక పాఠకునికి తప్పుదారి పట్టించే సీసా భావాన్ని కలిగించదు.
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: యూఫ్రటీసు అనే మహానదిపై
  rationale: Εὐφράτης అనే పేరును ‘మహానది’తో సమానాధికార సంబంధంలో ఉంచుతూ, ἐπί సూచించే కుమ్మరింపు లక్ష్యాన్ని ‘పై’తో వ్యక్తం చేస్తుంది.
- source_word: ἐξηράνθη
  choice: ఎండిపోయింది
  rationale: అకర్మక రూపం తెలుగులో సహజంగా ఫలితస్థితిని తెలుపుతుంది. గ్రీకు కర్మణి రూపంలోని సంఘటన-ఫలిత భావం సందర్భంలో స్పష్టంగానే నిలుస్తుంది.
- source_word: τὸ ὕδωρ αὐτοῦ
  choice: దాని నీరు
  rationale: సర్వనామం నదిని సూచిస్తుంది; ‘దాని నీరు’ ఆధునిక తెలుగులో సహజమైన అన్వయం.
- source_word: ἵνα ἑτοιμασθῇ
  choice: సిద్ధం కావడానికి
  rationale: ἵνα తో వచ్చిన కర్మణి సంభావ్య క్రియ ఉద్దేశాన్ని వ్యక్తం చేస్తుంది. ‘సిద్ధం కావడానికి’ ఆ ప్రయోజన భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἡ ὁδὸς τῶν βασιλέων
  choice: రాజులకు మార్గం
  rationale: గ్రీకు షష్ఠీ నిర్మాణాన్ని తెలుగులో అక్షరార్థంగా ‘రాజుల మార్గం’ అనడం స్వామ్యార్థాన్ని అతిగా సూచించవచ్చు. సందర్భానుసారంగా రాజులు ప్రయాణించేందుకు సిద్ధమయ్యే మార్గమనే సంబంధాన్ని ‘రాజులకు మార్గం’ సహజంగా తెలియజేస్తుంది.
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: సూర్యోదయ దిక్కు నుండి వచ్చే
  rationale: అక్షరార్థంలోని ‘సూర్యుని ఉదయం’ చిత్రాన్ని ‘సూర్యోదయ దిక్కు’ ద్వారా నిలుపుతూ, ఇది రాజులను విశేషించే పదబంధమని ‘వచ్చే’తో స్పష్టం చేస్తుంది. సరళార్థం ‘తూర్పు నుండి’ అని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: ‘ఆరవవాడు’ ఎవరో దూతగా స్పష్టీకరించాలా
  choice: ‘ఆరవవాడు’ అని మాత్రమే ఉంచాం.
  alternative: ‘ఆరవ దూత’
  rationale: పూర్వసందర్భం అతడు దూత అని తెలియజేసినా, ఈ వచనంలోని గ్రీకు పాఠ్యంలో ‘దూత’ అనే నామవాచకం లేదు. మూలంలోని అధ్యాహారాన్ని అలాగే నిలిపాం.
- issue: యూఫ్రటీసు ఎండిపోవడం, రాజుల రాకను ప్రతీకాత్మకంగా వివరించాలా
  choice: చిత్రణను వ్యాఖ్యానించకుండా యథాతథంగా అనువదించాం.
  alternative: దండయాత్ర లేదా అంత్యకాల సమీకరణను వివరిస్తూ భావానువాదం చేయడం
  rationale: ఈ వచనం అపోకలిప్టిక్ చిత్రణను ఇస్తుంది గాని దాని ప్రతీకార్థాన్ని ఇక్కడే నిర్దిష్టంగా వివరించదు. అందువల్ల అనువాదంలో ఒక వ్యాఖ్యానాన్ని స్థిరపరచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. మూలంలోని ‘ఆరవవాడు’ అనే అధ్యాహారాన్ని కాపాడాం; అపోకలిప్టిక్ చిత్రణకు వ్యాఖ్యానాత్మక విస్తరణ చేయలేదు. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
