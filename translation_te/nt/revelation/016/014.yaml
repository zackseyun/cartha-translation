id: REV.16.14
reference: Revelation 16:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: te
  text: ఎందుకంటే అవి సూచక కార్యాలు చేసే దయ్యాల ఆత్మలు[a]; అవి ప్రపంచమంతటి[b] రాజుల దగ్గరికి, సర్వశక్తిమంతుడైన దేవుని మహాదినపు యుద్ధానికి వారిని సమకూర్చడానికి బయలుదేరుతాయి—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దయ్యస్వభావంగల ఆత్మలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నివసించబడిన ప్రపంచమంతటి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: దయ్యాల ఆత్మలు
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని దగ్గరగా నిలుపుతూ, ఇవి దయ్యాలకు చెందినవి లేదా దయ్యస్వభావం గల ఆత్మలు అనే భావపరిధిని అనవసరంగా కుదించదు.
- source_word: ποιοῦντα σημεῖα
  choice: సూచకకార్యాలు చేసే
  rationale: σημεῖα అనే పదంలోని ‘సూచనలుగా పనిచేసే అసాధారణ కార్యాలు’ అనే భావాన్ని ఉంచుతుంది; అవి కేవలం మాయలని గానీ, దైవ అద్భుతాలతో సమానమని గానీ ముందే నిర్ణయించదు.
- source_word: ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς
  choice: అవి ... రాజుల దగ్గరికి బయలుదేరి
  rationale: ἐκπορεύομαι యొక్క బయలుదేరే గమనాన్ని, ἐπί యొక్క లక్ష్యదిశను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. గ్రీకులో క్రియ ఏకవచన రూపంలో ఉన్నా, సంబంధసర్వనామం మరియు పూర్వపదం బహువచనమైనందున తెలుగులో భావానుసారంగా బహువచనం వాడబడింది.
- source_word: τῆς οἰκουμένης ὅλης
  choice: సర్వలోకపు
  rationale: οἰκουμένη యొక్క ‘నివాసిత లోకమంతా/మానవ లోకం’ అనే ప్రపంచవ్యాప్త రాజకీయ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: συναγαγεῖν αὐτοὺς
  choice: వారిని సమకూరుస్తాయి
  rationale: ఆత్మలు బయలుదేరే ఉద్దేశం రాజులను ఒకచోట యుద్ధానికి సమీకరించడమేనని తెలుపుతుంది.
- source_word: εἰς τὸν πόλεμον
  choice: యుద్ధానికి
  rationale: εἰς ఇక్కడ తెలిపే లక్ష్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలోని నిర్ణాయక సంఘర్షణను సూచిస్తుంది.
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: మహాదినపు
  rationale: అపోకలిప్టికల్ గంభీరతను నిలుపుతూ ‘గొప్ప దినానికి సంబంధించిన’ అనే గ్రీకు సంబంధాన్ని సహజంగా కుదిస్తుంది.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: సర్వశక్తిమంతుడైన దేవుని
  rationale: παντοκράτωρ అనే దైవ బిరుదును ఆధునిక ప్రామాణిక తెలుగులో పరిచితమైన, గౌరవప్రదమైన రూపంలో అందిస్తుంది.
theological_decisions:
- issue: ఆత్మలు చేసే సూచకకార్యాల స్వభావం
  choice: వచనం వాటిని దయ్యాల ఆత్మలు చేసే నిజమైన ‘సూచకకార్యాలు’గా పేర్కొన్నంతవరకే అనువదించడం
  alternative: వాటిని కేవలం మోసపూరిత మాయలుగా లేదా దైవ అద్భుతాలకు సమానమైన అద్భుతాలుగా స్పష్టీకరించడం
  rationale: σημεῖα వాటి యాంత్రిక విధానాన్ని లేదా శక్తి స్వరూపాన్ని నిర్ణయించదు. కాబట్టి మూలంలోని ధార్మిక ఉద్వేగం, అస్పష్టత నిలుపబడింది.
- issue: πνεύματα δαιμονίων లోని షష్ఠీ సంబంధం
  choice: దయ్యాల ఆత్మలు
  alternative: దయ్యస్వభావంగల ఆత్మలు
  rationale: ‘దయ్యాల ఆత్మలు’ అనేది మూల నిర్మాణానికి దగ్గరగా ఉండి, స్వామ్య/మూల/లక్షణార్థ సంబంధాల్లో ఒక్కదానినే బలవంతంగా ఖరారు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రకటన గ్రంథానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతోనూ రూపొందించబడింది. చివరి దీర్ఘవిరామం తరువాతి వచనంతో వాక్యప్రవాహం కొనసాగుతుందని సూచిస్తుంది.
