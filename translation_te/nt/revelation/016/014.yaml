revisions:
- from: ఎందుకంటే అవి సూచకకార్యాలు చేసే దయ్యాల ఆత్మలు[a]. అవి సర్వలోకపు[b] రాజుల దగ్గరికి బయలుదేరి, సర్వశక్తిమంతుడైన దేవుని మహాదినపు యుద్ధానికి వారిని సమకూరుస్తాయి—
  to: ఎందుకంటే అవి సూచక కార్యాలు చేసే దయ్యాల ఆత్మలు[a]; అవి ప్రపంచమంతటి[b] రాజుల దగ్గరికి, సర్వశక్తిమంతుడైన దేవుని మహాదినపు యుద్ధానికి వారిని సమకూర్చడానికి బయలుదేరుతాయి—
  rationale: The revision retains the source's ambiguity concerning the genitive in πνεύματα δαιμονίων and the nature of the signs. It improves idiomatic Telugu, restores the explicit purposive force of συναγαγεῖν, and preserves the verse's continuing syntax signaled by the dash.
