    text: లేదా, ‘దయ్యస్వభావంగల ఆత్మలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నివసించబడిన ప్రపంచమంతటి.’
    reason: lexical_alternative
  revision_rationale: The revision retains the source's ambiguity concerning the genitive in πνεύματα δαιμονίων and the nature of the signs. It improves idiomatic Telugu, restores the explicit purposive force of συναγαγεῖν, and preserves the verse's continuing syntax signaled by the dash.
