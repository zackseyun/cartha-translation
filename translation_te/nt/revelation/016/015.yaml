id: REV.16.15
reference: Revelation 16:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: te
  text: “ఇదిగో, నేను దొంగలాగా వస్తున్నాను. మెలకువగా ఉండి తన వస్త్రాలను కాపాడుకునేవాడు ధన్యుడు.[a] అతడు నగ్నంగా తిరిగి, వారు అతని అవమానాన్ని చూడకుండా ఉండేందుకు ఇలా చేయాలి.[b]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాపలా కాచేవాడు” / “అప్రమత్తంగా ఉండేవాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతని సిగ్గుకరమైన బహిర్గతాన్ని”; గ్రీకు పదం అవమానం లేదా సిగ్గుకరంగా శరీరం బహిర్గతమవడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: అపోకలిప్టిక్ హెచ్చరికలోని గంభీరమైన శ్రద్ధాకర్షణను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔρχομαι
  choice: నేను ... వస్తున్నాను
  rationale: వర్తమానకాల రూపంలోని సజీవతను, సమీప భవిష్యత్తు భావాన్ని నిలుపుతుంది.
- source_word: ὡς κλέπτης
  choice: దొంగలాగా
  rationale: రాక యొక్క అనూహ్యతను తెలిపే ఉపమానాన్ని నిలుపుతుంది; నైతిక సమానత్వాన్ని సూచించదు.
- source_word: μακάριος
  choice: ధన్యుడు
  rationale: ధన్యవచన శైలిలోని ఆధ్యాత్మిక, దైవసంబంధమైన బరువును ‘సంతోషవంతుడు’ కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: ὁ γρηγορῶν
  choice: మెలకువగా ఉండి
  rationale: శారీరకంగా మేలుకొని ఉండడం, రూపకాలంకారంగా అప్రమత్తంగా ఉండడం అనే రెండు భావాలకు చోటిస్తుంది.
- source_word: τηρῶν
  choice: కాపాడుకునేవాడు
  rationale: వస్త్రాలను భద్రంగా ఉంచుకోవడం లేదా పోగొట్టుకోకుండా చూసుకోవడం అనే సందర్భోచిత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: తన వస్త్రాలను
  rationale: మూలంలోని కొద్దిగా ఉన్నతమైన శైలిని, ప్రకటన గ్రంథంలోని సంభావ్య ప్రతీకాత్మక ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ἵνα μὴ
  choice: అప్పుడు ... తిరగడు; ... చూడరు
  rationale: తెలుగులో సహజమైన ఫలిత/నివారణ నిర్మాణంతో ప్రతికూల ఉద్దేశ్యాన్ని వ్యక్తం చేస్తుంది; నగ్నంగా తిరగడం మరియు బహిర్గతమైన అవమానం కనిపించడం రెండూ నివారించబడతాయి.
- source_word: γυμνὸς περιπατῇ
  choice: అతడు నగ్నంగా తిరగడు
  rationale: మూలంలోని స్పష్టమైన, concrete దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: βλέπωσιν
  choice: వారు చూడరు
  rationale: గ్రీకులో కర్తను నిర్దిష్టంగా చెప్పని మూడవ పురుష బహువచనాన్ని అలాగే అనిర్దిష్టంగా ఉంచుతుంది.
- source_word: τὴν ἀσχημοσύνην αὐτοῦ
  choice: అతని అవమానకరమైన నగ్నత్వాన్ని
  rationale: ఈ పదంలోని సిగ్గు, అసభ్యంగా బహిర్గతమవడం అనే రెండు భావాలను తెలుగులో స్పష్టంగా పట్టుకుంటుంది.
theological_decisions:
- issue: వస్త్రాలు, నగ్నత్వం అనే అపోకలిప్టిక్ చిత్రాల రూపకాలంకార భావం
  choice: ప్రధాన పాఠ్యంలో ‘వస్త్రాలు,’ ‘నగ్నంగా,’ ‘అవమానకరమైన నగ్నత్వం’ అనే స్పష్టమైన చిత్రాలనే నిలుపడం
  alternative: వస్త్రాలను నీతిక్రియలు లేదా ఆధ్యాత్మిక సిద్ధతగా, నగ్నత్వాన్ని అంత్యకాల అవమానంగా నేరుగా వివరించడం
  rationale: ఈ చిత్రాలకు ప్రకటన గ్రంథంలో ప్రతీకాత్మక ప్రతిధ్వని ఉండవచ్చు; అయితే మూలవాక్యం దానిని ఇక్కడ విప్పి చెప్పదు. అందువల్ల అనువాదం ఒకే వ్యాఖ్యానాన్ని రుద్దదు.
- issue: పురుష ఏకవచన ప్రతినిధి రూపం
  choice: ‘తన,’ ‘వాడు,’ ‘అతడు’ అనే పురుష ఏకవచన రూపాలను నిలుపడం
  alternative: బహువచనంగా లేదా లింగతటస్థంగా పునర్నిర్మించడం
  rationale: గ్రీకు కర్తృవాచక కృదంతం వ్యాకరణపరంగా పురుష ఏకవచనంలో ఉండి ప్రతినిధి భావంతో వాడబడింది; తెలుగు అనువాదం ఆ రూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రకటన-శైలిని ఉపయోగించాం. ‘ఇదిగో,’ ‘ధన్యుడు,’ ‘వస్త్రాలు’ వంటి పదాలు వాక్యంలోని గంభీరతను నిలుపుతాయి; మిగతా వాక్యనిర్మాణం సహజంగా ఉంచబడింది. ముగింపులోని దీర్ఘ గీత మూలపాఠంలోని అకస్మాత్తు విరామాన్ని నిలుపుతుంది.
