revisions:
- from: “ఇదిగో, నేను దొంగలాగా వస్తున్నాను. మెలకువగా[a] ఉండి, తన వస్త్రాలను కాపాడుకునేవాడు ధన్యుడు. అప్పుడు అతడు నగ్నంగా తిరగడు; అతని అవమానకరమైన నగ్నత్వాన్ని[b] వారు చూడరు—”
  to: “ఇదిగో, నేను దొంగలాగా వస్తున్నాను. మెలకువగా ఉండి తన వస్త్రాలను కాపాడుకునేవాడు ధన్యుడు.[a] అతడు నగ్నంగా తిరిగి, వారు అతని అవమానాన్ని చూడకుండా ఉండేందుకు ఇలా చేయాలి.[b]—”
  rationale: The final sentence has been recast so that the warning remains directed against the scenario in which he walks naked and people see his shame. The explicit “ఇలా చేయాలి” is supplied only to make the Telugu purpose construction readable; it refers back to staying awake and keeping one’s garments, without adding an interpretive explanation. The footnote anchors and notes have also been aligned with their respective lexical alternatives.
