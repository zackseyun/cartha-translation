review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the warning, imminent coming, thief simile, beatitude, vigilance, and garments. However, it changes the scope and force of the final purpose clause: the Greek warns against the combined outcome of walking naked and people seeing his shame; the draft says that people will not see it. The revised wording preserves the Greek construction without specifying the indefinite plural subject.'
  naturalness: The revised Telugu is modern standard, dignified, and idiomatic. “కాపలా కాచేవాడు” is a natural alternative for watchfulness, while “సిగ్గుకరమైన బహిర్గతం” conveys shameful exposure without redundantly repeating “నగ్నత్వం.”
  terminology: “ఇదిగో,” “ధన్యుడు,” and “వస్త్రాలు” suitably maintain the elevated apocalyptic register. “అవమానం” renders ἀσχημοσύνη naturally; its potentially more concrete sense of shameful exposure is retained in the footnote.
  issues:
  - severity: high
    issue: The final clause reverses the meaning of βλέπωσιν.
    rationale: In ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ, the negation governs the feared condition of walking naked, followed by people seeing his shame. The draft’s “వారు చూడరు” makes the seeing negative and thus alters the warning’s meaning.
  - severity: medium
    issue: “అవమానకరమైన నగ్నత్వం” is overly repetitive and less precise for ἀσχημοσύνη.
    rationale: The preceding γυμνὸς already expresses nakedness. ἀσχημοσύνη emphasizes shame/disgrace or shameful exposure; “అవమానం,” with an explanatory footnote, reflects this distinction more cleanly.
  - severity: low
    issue: The first footnote’s alternative “కావలిగా” is not idiomatic Telugu for the participle’s sense.
    rationale: “కాపలా కాచేవాడు” naturally expresses keeping watch and provides a clear lexical alternative to “మెలకువగా ఉండేవాడు.”
