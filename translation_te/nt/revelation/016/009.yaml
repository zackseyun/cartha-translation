revisions:
- from: మనుషులు తీవ్రమైన వేడికి కమిలిపోయారు. ఈ తెగుళ్లపై అధికారం కలిగిన దేవుని నామాన్ని వారు దూషించారు; ఆయనకు మహిమ చెల్లించడానికి వారు పశ్చాత్తాపపడలేదు.
