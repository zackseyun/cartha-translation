id: REV.16.9
reference: Revelation 16:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: te
  text: మనుషులు తీవ్రమైన వేడితో కాలిపోయారు. ఈ తెగుళ్లపై అధికారం కలిగిన దేవుని నామాన్ని వారు దూషించారు; ఆయనకు మహిమ ఇవ్వడానికి వారు పశ్చాత్తాపపడలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: కమిలిపోయారు
  rationale: καυματίζω యొక్క కర్మణి రూపం తీవ్రమైన వేడివల్ల శరీరం కాలిపోవడం లేదా కమిలిపోవడాన్ని సూచిస్తుంది. ‘కమిలిపోయారు’ అనేది పూర్తిగా దహనమయ్యారనే అతిశయార్థం రాకుండా సహజమైన తెలుగులో భావాన్ని తెలియజేస్తుంది.
- source_word: οἱ ἄνθρωποι
  choice: మనుషులు
  rationale: ఇక్కడ ἄνθρωποι పురుషులను మాత్రమే కాక సాధారణంగా మనుషులను సూచిస్తుంది. ‘మనుషులు’ ఆ సమగ్ర పరిధిని సహజంగా నిలుపుతుంది.
- source_word: καῦμα μέγα
  choice: తీవ్రమైన వేడికి
  rationale: καῦμα వేడిని, μέγα దాని తీవ్రతను సూచిస్తున్నాయి. తెలుగులో ‘తీవ్రమైన వేడి’ సహజంగా ఉండి, కమిలిపోవడానికి కారణమైన వేడిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐβλασφήμησαν
  choice: దూషించారు
  rationale: దేవుని నామానికి సంబంధించి βλασφημέω భక్తిహీనంగా అవమానించడం లేదా దూషించడం అనే బలమైన భావాన్ని కలిగిస్తుంది. ‘దూషించారు’ ఆధునిక తెలుగులో స్పష్టమైన, గంభీరమైన పదం.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: దేవుని నామాన్ని
  rationale: ‘నామం’ అనే బైబిలు నుడికారాన్ని నిలుపుతూ, దేవుని వ్యక్తిత్వం మరియు ఘనతపై జరిగిన దూషణను వ్యక్తపరుస్తుంది.
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: ఈ తెగుళ్లపై అధికారం కలిగిన
  rationale: వర్తమాన అసమాపక క్రియ ἔχοντος దేవునికి ప్రస్తుతం ఉన్న అధికారాన్ని తెలియజేస్తుంది; ἐξουσίαν అంటే అధికారం. ఈ విశేషణ భాగాన్ని ‘దేవుని’తో నేరుగా అనుసంధానించడం తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: πληγὰς
  choice: తెగుళ్లు
  rationale: ప్రకటన గ్రంథపు తీర్పుల సందర్భంలో πληγή దైవిక తీర్పుగా వచ్చే plague‌ను సూచిస్తుంది. ‘తెగుళ్లు’ నిర్గమకాండతో ఉన్న ప్రతిధ్వనిని కూడా నిలుపుతుంది.
- source_word: οὐ μετενόησαν
  choice: పశ్చాత్తాపపడలేదు
  rationale: తీర్పు సందర్భంలో μετανοέω కేవలం అభిప్రాయం మార్చుకోవడం కాక నైతిక, ఆధ్యాత్మిక పశ్చాత్తాపాన్ని సూచిస్తుంది.
- source_word: δοῦναι αὐτῷ δόξαν
  choice: ఆయనకు మహిమ చెల్లించడానికి
  rationale: మూలంలోని ‘ఆయనకు మహిమ ఇవ్వడం’ అనే నుడికారాన్ని సహజమైన తెలుగులో ‘మహిమ చెల్లించడం’గా అందించింది. అసమాపక క్రియ పశ్చాత్తాపంతో ఆశించబడిన ఫలితం లేదా దాని వ్యక్తీకరణను సూచించగలదు; అనువాదం ఆ సంబంధాన్ని మరీ నిర్దిష్టంగా తీర్మానించదు.
theological_decisions:
- issue: οἱ ἄνθρωποι యొక్క పరిధి
  choice: లింగ సమగ్ర మానవ సూచనగా ‘మనుషులు’
  alternative: పురుషులు
  rationale: సందర్భం తీర్పును ఎదుర్కొంటున్న మనుషుల గురించి; మగవారికి మాత్రమే పరిమితం చేయడానికి పాఠ్యంలో ఆధారం లేదు.
- issue: తెగుళ్లపై దేవుని అధికారం
  choice: దేవుడు ఈ తెగుళ్లపై అధికారం కలిగినవాడని ప్రత్యక్షంగా పేర్కొనడం
  alternative: దేవుడు తెగుళ్లతో కేవలం సంబంధం కలిగినవాడని మృదువుగా చెప్పడం
  rationale: ἐξουσία అనే పదం అధికారాన్ని స్పష్టంగా ప్రకటిస్తుంది. పాఠ్యంలోని దైవాధికార వాదనను తగ్గించకుండా, దానిని మించి సిద్ధాంత విస్తరణ చేయకుండా అనువదించబడింది.
- issue: పశ్చాత్తాపం మరియు మహిమ చెల్లించడం మధ్య సంబంధం
  choice: ‘ఆయనకు మహిమ చెల్లించడానికి వారు పశ్చాత్తాపపడలేదు’
  alternative: ‘వారు పశ్చాత్తాపపడలేదు, ఆయనను మహిమపరచలేదు’
  rationale: δοῦναι అనే అసమాపక క్రియను రెండు స్వతంత్ర నిరాకరణలుగా విభజించకుండా, పశ్చాత్తాపంతో మహిమ చెల్లించడం మధ్య మూలపాఠంలోని సంబంధాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నామం,’ ‘మహిమ,’ ‘పశ్చాత్తాపం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలుపుతూ, వాక్య నిర్మాణాన్ని సహజమైన తెలుగుకు అనుగుణంగా రెండు ప్రధాన వాక్యాలుగా అమర్చింది.
