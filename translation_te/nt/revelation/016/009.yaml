review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the verse’s main clauses, including the inclusive scope of οἱ ἄνθρωποι, God’s authority over the plagues, and the infinitival relation in οὐ μετενόησαν δοῦναι αὐτῷ δόξαν. However, ‘కమిలిపోయారు’ can suggest shriveling or withering and is less direct for ἐκαυματίσθησαν than a verb explicitly denoting being scorched/burned by heat.
  naturalness: The register is clear modern standard Telugu and appropriately solemn. ‘తీవ్రమైన వేడితో కాలిపోయారు’ is more immediately idiomatic in this plague context than ‘తీవ్రమైన వేడికి కమిలిపోయారు.’
  terminology: ‘మనుషులు,’ ‘దేవుని నామం,’ ‘తెగుళ్లు,’ and ‘పశ్చాత్తాపపడలేదు’ are suitable. ‘ఆయనకు మహిమ ఇవ్వడానికి’ preserves the concrete biblical expression δοῦναι αὐτῷ δόξαν more closely and remains natural Telugu.
  issues:
  - severity: low
    issue: The rendering ‘కమిలిపోయారు’ is potentially less precise for ἐκαυματίσθησαν.
    rationale: While it can convey heat damage, it may evoke shriveling/wilting. ‘కాలిపోయారు’ directly conveys being scorched by intense heat without implying total destruction.
  - severity: low
    issue: ‘మహిమ చెల్లించడానికి’ is a slightly freer rendering of δοῦναι αὐτῷ δόξαν.
    rationale: ‘ఆయనకు మహిమ ఇవ్వడానికి’ retains the source’s ‘give glory’ idiom and aligns with established biblical Telugu usage.
  revised_text: మనుషులు తీవ్రమైన వేడితో కాలిపోయారు. ఈ తెగుళ్లపై అధికారం కలిగిన దేవుని నామాన్ని వారు దూషించారు; ఆయనకు మహిమ ఇవ్వడానికి వారు పశ్చాత్తాపపడలేదు.
