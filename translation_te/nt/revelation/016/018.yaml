id: REV.16.18
reference: Revelation 16:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: te
  text: మెరుపులు, ధ్వనులు[a], ఉరుములు కలిగాయి. ఒక గొప్ప భూకంపం సంభవించింది. భూమిమీద మనుషులు ఉనికిలోకి వచ్చినప్పటి నుండి అలాంటి భూకంపం ఎన్నడూ సంభవించలేదు—అంత గొప్పది ఆ భూకంపం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్వరాలు’.
    reason: φωναὶ అనే గ్రీకు పదం సందర్భానుసారం ధ్వనులు లేదా స్వరాలు అని అర్థం కావచ్చు.
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: మెరుపులు
  rationale: బహువచన భావాన్ని సహజమైన ఆధునిక తెలుగు పదంతో నిలుపుతుంది.
- source_word: φωναὶ
  choice: ధ్వనులు
  rationale: ఈ పదానికి ‘స్వరాలు’ లేదా ‘ధ్వనులు’ అనే అర్థాలు సాధ్యం. మెరుపులు, ఉరుములు ఉన్న సందర్భంలో ‘ధ్వనులు’ సహజంగా సరిపోతుంది; అయితే వ్యక్తుల స్వరాలు అనే అవకాశాన్ని పూర్తిగా తొలగించదు.
- source_word: βρονταί
  choice: ఉరుములు
  rationale: పునరావృతమైన ఉరుముల బహువచన భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: σεισμὸς
  choice: భూకంపం
  rationale: ఈ సందర్భంలో σεισμόςకు ప్రామాణికమైన, సాధారణంగా అర్థమయ్యే తెలుగు సమానం.
- source_word: μέγας
  choice: గొప్ప
  rationale: భూకంపం యొక్క అసాధారణ తీవ్రతను గంభీరమైన భాషలో తెలియజేస్తుంది; మూలంలోని పునరుక్తిని చివరి వాక్యంలోనూ నిలుపుతుంది.
- source_word: οἷος οὐκ ἐγένετο
  choice: అలాంటి భూకంపం ఎన్నడూ సంభవించలేదు
  rationale: ఇంతకు ముందెన్నడూ లేని పరిమాణాన్ని తెలిపే పోలికను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀφ’ οὗ ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: భూమిమీద మనుషులు ఉనికిలోకి వచ్చినప్పటి నుండి
  rationale: ἐγένοντοలోని ‘ఉనికిలోకి రావడం’ అనే భావాన్ని కాపాడుతూ, ἄνθρωποι మానవాళిని సాధారణంగా సూచిస్తుందని స్పష్టం చేస్తుంది.
- source_word: τηλικοῦτος ... οὕτω μέγας
  choice: అంత గొప్పది ఆ భూకంపం
  rationale: మూలంలోని తుద ఉద్ఘాటనను, భూకంపం యొక్క అపార పరిమాణాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ἀφ’ οὗ ἄνθρωποι ἐγένοντο అనే మాట మానవాళి ఆరంభాన్ని సూచించడం
  choice: భూమిమీద మనుషులు ఉనికిలోకి వచ్చినప్పటి నుండి
  alternative: భూమిమీద మానవులు ఏర్పడినప్పటి నుండి
  rationale: ఈ వాక్యం పురుషులను మాత్రమే కాక మానవాళి మొత్తాన్ని సూచిస్తుంది. ‘మనుషులు’ ఆధునిక తెలుగులో సహజమైన సమగ్ర పదం; నిర్దిష్ట సృష్టి విధానం లేదా కాలక్రమాన్ని అనవసరంగా జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటన గ్రంథ శైలిని పాటించాం. మూలంలోని వరుస దృశ్య-శ్రవ్య ఘటనలు, భూకంపం అసమానత, చివరి ఉద్ఘాటన నిలుపబడ్డాయి.
