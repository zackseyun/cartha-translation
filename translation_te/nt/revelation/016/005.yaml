id: REV.16.5
reference: Revelation 16:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: te
  text: 'నేను జలాల దూత[c] ఇలా చెప్పడం విన్నాను: “నీవు నీతిమంతుడవు[b]—ఉన్నవాడవు, ఉండినవాడవు, పరిశుద్ధుడవు[a]—ఎందుకంటే నీవు ఈ సంగతులను తీర్పు తీర్చావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'కొన్ని ప్రతుల్లో ఇక్కడ “ఉన్నవాడవు, ఉండినవాడవు, రాబోవువాడవు” అనే విస్తృత బిరుదు ఉంది. అది ప్రకటన గ్రంథంలోని ఇతర సమాన పదబంధాలకు అనుగుణంగా మార్చబడి ఉండవచ్చు. ఇక్కడ అనుసరించిన పాఠం: “ఉన్నవాడవు, ఉండినవాడవు, పరిశుద్ధుడవు.”'
    reason: textual_variant
  - marker: b
    text: “నీవు న్యాయవంతుడవు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “జలాలపై ఉన్న దూత” లేదా “జలాలకు బాధ్యత వహించే దూత” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: జలాల దూత
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని సన్నిహితంగా కాపాడుతుంది. సందర్భంలో జలాలపై బాధ్యతగల దూత అనే భావం ఉండవచ్చు; దాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: Δίκαιος
  choice: నీతిమంతుడవు
  rationale: దేవుని తీర్పులోని నైతిక న్యాయసమ్మతతను, స్తుతి ధోరణిని రెండింటినీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: వర్తమానుడవు, భూతకాలంలో ఉన్నవాడవు
  rationale: ప్రకటన గ్రంథంలోని దైవిక బిరుదు స్వరూపాన్ని కాపాడుతూ, ప్రస్తుత ఉనికినీ గత ఉనికినీ స్పష్టంగా తెలుపుతుంది.
- source_word: ὁ ὅσιος
  choice: పరిశుద్ధుడవు అయిన
  rationale: ὅσιος ఇక్కడ దేవుని పవిత్రతను సూచించే బిరుదుగా ఉంది. సంబోధనలో సహజంగా కలిసేలా అనువదించబడింది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: దేవుడు నీతిమంతుడని ప్రకటించడానికి తరువాతి వాక్యం కారణాన్ని ఇస్తున్న causal సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ταῦτα
  choice: వీటికి
  rationale: మూలంలోని సాధారణ సూచనార్థక పదాన్ని నిలుపుతుంది; ‘ఈ తీర్పులు’ అని స్పష్టీకరించి మూలంలో లేని నామవాచకాన్ని చేర్చదు.
- source_word: ἔκρινας
  choice: తీర్పు తీర్చావు
  rationale: పూర్తయిన న్యాయనిర్ణయ చర్యను సహజమైన తెలుగు భూతకాల రూపంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: భవిష్యత్ అంశం లేని దైవిక బిరుదు
  choice: వర్తమానుడవు, భూతకాలంలో ఉన్నవాడవు, పరిశుద్ధుడవు అయిన
  alternative: వర్తమానుడవు, భూతకాలంలో ఉన్నవాడవు, రాబోవువాడవు అయిన
  rationale: SBLGNT పాఠంలో ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος ఉంది; ప్రకటన గ్రంథంలోని ఇతర చోట్ల కనిపించే ‘రాబోవువాడు’ అనే పూర్తి సూత్రాన్ని ఇక్కడ చేర్చలేదు. అందువల్ల ముద్రిత గ్రీకు పాఠాన్నే ప్రధాన వాక్యంలో అనుసరించి, పాఠాంతరాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: ὁ ὅσιος యొక్క వాక్య సంబంధం
  choice: దైవిక సంబోధనలో ‘పరిశుద్ధుడవు అయిన’
  alternative: ప్రత్యేక నామబిరుదుగా ‘పరిశుద్ధుడు’
  rationale: గ్రీకు పదబంధం దేవునికి వర్తించే బిరుదు; తెలుగు వాక్యంలో సంబోధనను సహజంగా ఉంచుతూ దాని ప్రత్యేకతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆరాధనా గాంభీర్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణం. పాఠాంతరాన్ని ప్రధాన పాఠంలో కలపకుండా అన్ని [a], [b], [c] సూచికలను పాఠ్యంలో ఉంచాం.
