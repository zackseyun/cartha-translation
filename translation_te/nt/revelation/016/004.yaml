id: REV.16.4
reference: Revelation 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: te
  text: మూడవవాడు తన పాత్రను నదుల్లోకి, నీటి ఊటల్లోకి కుమ్మరించాడు. అవి రక్తంగా మారాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: మూడవవాడు
  rationale: గ్రీకు మూలంలో నామవాచకం లేకుండా సవ్యాఖ్యమైన క్రమసంఖ్య మాత్రమే ఉంది. ముందున్న సందర్భం వ్యక్తిని స్పష్టం చేస్తుంది కాబట్టి ‘దూత’ అని చేర్చకుండా తెలుగు సహజంగా ఉండేలా అనువదించాం.
- source_word: ἐξέχεεν
  choice: కుమ్మరించాడు
  rationale: ἐκχέω అంటే ద్రవాన్ని పోయడం లేదా కుమ్మరించడం. పాత్రలోని దానిని పూర్తిగా వెలుపలికి పోసే ఈ తీర్పు దృశ్యంలో ‘కుమ్మరించాడు’ సహజంగా, బలంగా ఉంది.
- source_word: φιάλην
  choice: పాత్రను
  rationale: φιάλη వెడల్పైన, లోతు తక్కువగల పాత్రను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పాత్ర’ స్పష్టంగా ఉంటుంది; ‘సీసా’ అనే అర్థాన్ని అనవసరంగా కలిగించదు.
- source_word: εἰς τοὺς ποταμούς
  choice: నదుల్లోకి
  rationale: εἰς తో ద్వితీయా విభక్తి లోపలికి సాగే దిశను సూచిస్తుంది; ‘నదుల్లోకి’ ఆ భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: πηγὰς τῶν ὑδάτων
  choice: నీటి ఊటల్లోకి
  rationale: πηγή అంటే ఊట, జలధార, లేదా నీటి మూలం. ‘నీటి ఊటలు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని సంబంధార్థాన్ని నిలుపుతుంది.
- source_word: ἐγένετο αἷμα
  choice: అవి రక్తంగా మారాయి
  rationale: గ్రీకులో క్రియ ఏకవచనంలో ఉన్నప్పటికీ, సందర్భంలో నదులు మరియు నీటి ఊటలు సమిష్టిగా సూచించబడ్డాయి. తెలుగులో వాటిని ‘అవి’ అని తీసుకొని మార్పు భావాన్ని స్పష్టంగా చెప్పడం సహజం.
theological_decisions:
- issue: ἐγένετο అనే ఏకవచన క్రియకు అంతర్భూత కర్త
  choice: నదులు, నీటి ఊటలు రక్తంగా మారాయి
  alternative: నీరు సమిష్టిగా రక్తంగా మారింది
  rationale: తక్షణ పూర్వపదాలు నదులు, నీటి ఊటలు. వాటిని బహువచనంగా సూచించడం తీర్పు వ్యాప్తిని స్పష్టం చేస్తుంది; అయితే గ్రీకు ఏకవచనం నీటిని సమిష్టిగా సంక్షిప్తీకరించి ఉండవచ్చు. ఇది వ్యాకరణ సంబంధ నిర్ణయం, సిద్ధాంతపరమైన వివరణ కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ‘మూడవవాడు’ అనే ellipsis‌ను నిలిపి, ‘దూత’ను చేర్చలేదు.
