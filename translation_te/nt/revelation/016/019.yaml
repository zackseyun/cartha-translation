id: REV.16.19
reference: Revelation 16:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: te
  text: ఆ మహా నగరం మూడు భాగాలుగా చీలిపోయింది; దేశాల నగరాలు కూలిపోయాయి. మహా బబులోను దేవుని సన్నిధిలో జ్ఞాపకానికి వచ్చింది[a]—ఆమెకు ఆయన కోపపు ఉగ్రతకు చెందిన ద్రాక్షారసపు పాత్రను ఇవ్వడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత పదబద్ధంగా, ‘దేవుని ఎదుట జ్ఞాపకం చేయబడింది.’ ఇది తీర్పు కోసం దేవుని దృష్టికి రావడాన్ని సూచించే బైబిలీయ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... εἰς τρία μέρη
  choice: మూడు భాగాలుగా చీలిపోయింది
  rationale: పదబద్ధంగా ‘మూడు భాగాలుగా అయింది’ అనే ఫలితార్థం ఉంది; సందర్భంలో నగరం విభజించబడిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: ఆ మహానగరం
  rationale: గ్రీకు నిర్దిష్ట పదబంధాన్ని, ప్రకటన గ్రంథంలోని ప్రతీకాత్మక నగర చిత్రాన్ని నిలుపుతుంది.
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: జనాల పట్టణాలు
  rationale: ἔθνη ఇక్కడ ప్రపంచంలోని వివిధ జనాలు లేదా దేశాలను సూచిస్తుంది; ‘జనాలు’ అనేది ‘అన్యజనులు’ అనే మతపరంగా సంకుచితమైన అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: ἔπεσαν
  choice: కూలిపోయాయి
  rationale: పదార్థం ‘పడిపోయాయి’; నగరాల విషయమై తెలుగులో ‘కూలిపోయాయి’ సహజంగా ఉండి వినాశన దృశ్యాన్ని స్పష్టంగా చూపుతుంది.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: మహా బబులోను
  rationale: ప్రకటన గ్రంథంలో పునరావృతమయ్యే బబులోను బిరుదును సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది.
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: దేవుని సన్నిధిలో జ్ఞాపకానికి వచ్చింది
  rationale: తీర్పు కోసం దేవుని దృష్టికి రావడాన్ని సూచించే బైబిలీయ నుడికారాన్ని వివరణాత్మకంగా మార్చకుండా సహజ తెలుగులో నిలుపుతుంది.
- source_word: δοῦναι αὐτῇ
  choice: ఆమెకు ... ఇవ్వడానికి
  rationale: బబులోనును స్త్రీరూపంలో సూచించే αὐτῇను, క్రియార్థక క్రియావిశేషణంలోని ఉద్దేశం లేదా ఫలిత భావాన్ని నిలుపుతుంది.
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: ద్రాక్షారసపు పాత్ర
  rationale: తీర్పుగా కేటాయించబడిన పాత్ర అనే బైబిలీయ రూపకాన్ని నిలుపుతూ, ‘wine’కు స్పష్టమైన తెలుగు పదాన్ని ఉపయోగిస్తుంది.
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: ఆయన కోపపు ఉగ్రత
  rationale: ὀργήను ‘కోపం’గా, θυμόςను దాని తీవ్ర ఉప్పెనను సూచించే ‘ఉగ్రత’గా వ్యక్తం చేసి, మూలంలోని రెండు సంబంధిత పదాల తీవ్రతను పూర్తిగా ఒకే పదంలో కలపదు.
theological_decisions:
- issue: ἐμνήσθη ἐνώπιον τοῦ θεοῦ అనే తీర్పు నుడికారం
  choice: దేవుని సన్నిధిలో జ్ఞాపకానికి వచ్చింది
  alternative: తీర్పు చేయడానికి దేవుడు ఆమెను జ్ఞాపకం చేసుకున్నాడు
  rationale: ప్రత్యామ్నాయం సందర్భార్థాన్ని ముందుగానే వివరిస్తుంది. ఎంచుకున్న రూపం దేవుడు మరచిపోయాడనే సాధారణ భావానికీ, తీర్పు కోసం ఆయన దృష్టికి వచ్చిందనే బైబిలీయ నుడికారానికీ మధ్యనున్న ఉద్వేగాన్ని మూలంలాగే నిలుపుతుంది; పాదసూచిక సందర్భాన్ని వివరిస్తుంది.
- issue: θυμός మరియు ὀργή అనే రెండు తీర్పు పదాల సంబంధం
  choice: కోపపు ఉగ్రత
  alternative: ఉగ్రకోపం
  rationale: ‘ఉగ్రకోపం’ మరింత సంక్షిప్తమైనదైనా రెండు గ్రీకు పదాలను ఒకే సమాసంలో కుదిస్తుంది. ‘కోపపు ఉగ్రత’ మూలంలోని జనిటివ్ సంబంధాన్ని మరియు భావతీవ్రతను మెరుగ్గా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటనాత్మక శైలి ఉపయోగించబడింది. ‘సన్నిధి,’ ‘పాత్ర’ వంటి పరిచిత బైబిలీయ పదాలు నిలుపబడ్డాయి; పురాతన క్రియారూపాలు నివారించబడ్డాయి. అందించిన ఆంగ్ల ముసాయిదాలో [a] గుర్తు మొదటి వాక్యభాగం తర్వాత ఉన్నప్పటికీ, దాని పాదసూచిక ἐμνήσθη ἐνώπιον τοῦ θεοῦకు సంబంధించినందున గుర్తు సంబంధిత తెలుగు పదబంధం తర్వాత ఉంచబడింది.
