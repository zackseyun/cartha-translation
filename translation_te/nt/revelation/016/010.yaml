id: REV.16.10
reference: Revelation 16:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: te
  text: ఐదవవాడు తన పాత్రను మృగపు సింహాసనంపై కుమ్మరించాడు. అప్పుడు దాని రాజ్యం[a] చీకటిమయమైంది[b]. వారు వేదనవల్ల తమ నాలుకలను కొరుక్కుంటూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని రాజ్యం.’ గ్రీకులో ‘మృగం’ అనే పదం నపుంసకలింగంలో ఉంది; అయితే మృగాన్ని వ్యక్తిగా చూపుతూ ‘అతని’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘చీకటిలో మునిగిపోయింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: ఐదవవాడు
  rationale: గ్రీకులో ‘దూత’ అనే పదం లేదు; సందర్భంలో అది సూచితమైనా, మూలంలోని నామవాచకంగా వాడిన క్రమసంఖ్యను అలాగే ఉంచుతుంది.
- source_word: ἐξέχεεν
  choice: కుమ్మరించాడు
  rationale: పాత్ర తీర్పుల సందర్భంలో ద్రవాన్ని లేదా పాత్రలోని దానిని పోయడాన్ని సహజంగా తెలిపే తెలుగు క్రియ.
- source_word: φιάλην
  choice: పాత్రను
  rationale: వెడల్పాటి గిన్నె అనే భావాన్ని సందర్భానుకూలంగా ఇస్తుంది; ఆధునిక పాఠకులకు తప్పుదారి పట్టించే ‘సీసా’ వంటి పదాన్ని నివారిస్తుంది.
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: మృగం సింహాసనం మీద
  rationale: ἐπί యొక్క స్థానార్థాన్ని నేరుగా తెలియజేస్తూ, ప్రకటన గ్రంథంలోని θηρίον అపోకలిప్టిక్ ప్రతిమను ‘మృగం’గా నిలుపుతుంది.
- source_word: ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη
  choice: దాని రాజ్యం చీకటిమయమైంది
  rationale: γίνομαιతో కూడిన పరిపూర్ణ కర్మణి కృదంతం సూచించే, చీకటికి గురై ఆ స్థితిలోకి వచ్చిన ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐμασῶντο
  choice: కొరుక్కుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: τὰς γλώσσας αὐτῶν
  choice: తమ నాలుకలను
  rationale: కర్తలే తమ నాలుకలను కొరుక్కున్నారని సహజమైన ఆత్మార్థక నిర్మాణంలో నేరుగా తెలుపుతుంది.
- source_word: ἐκ τοῦ πόνου
  choice: వేదనవల్ల
  rationale: ἐκ ఇక్కడ కారణాన్ని సూచిస్తుంది; ‘వేదనవల్ల’ సంక్షిప్తంగా, సహజంగా ఆ కారణాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: మృగాన్ని సూచించే సర్వనామం
  choice: దాని రాజ్యం
  alternative: అతని రాజ్యం
  rationale: θηρίον గ్రీకులో నపుంసకలింగ పదం; ‘దాని’ మూలంలోని వ్యాకరణ సంబంధాన్ని ప్రతిబింబిస్తుంది. ‘అతని’ అనడం మృగాన్ని వ్యక్తిగా చూపే సాధ్యమైన పఠనం అయినా, దానిని ప్రధాన పాఠ్యంలో తప్పనిసరి చేయలేదు.
- issue: చీకటి తీర్పు యొక్క వ్యక్తీకరణ
  choice: చీకటిమయమైంది
  alternative: చీకటిలో మునిగిపోయింది
  rationale: మూలంలోని కర్మణి ఫలితస్థితిని అదనపు రూపకం చేర్చకుండా తెలియజేస్తుంది; మరింత సజీవమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలో లేని ‘దూత’ను చేర్చలేదు. అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యను ‘కొరుక్కుంటూ ఉన్నారు’తో నిలిపింది.
