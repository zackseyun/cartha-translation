source:
  edition: SBLGNT
  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: te
  text: అతడు వారిని హెబ్రీ భాషలో హర్మగెదోను అని పిలువబడే స్థలానికి సమకూర్చాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో, “అతడు/అది వారిని సమకూర్చాడు.” క్రియ ఏకవచనంలో ఉంది, కాని కర్తను స్పష్టంగా పేర్కొనలేదు. 13–14 వచనాల్లో రాజులను సమకూర్చడానికి బయలుదేరిన అపవిత్ర ఆత్మలను దృష్టిలో ఉంచుకొని, “వారు వారిని సమకూర్చారు” అని కూడా భావించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “హెబ్రీ/అరామిక్ భాషలో.” ప్రకటన గ్రంథంలో “హెబ్రీలో” అనేది హెబ్రీ, అరామిక్ భాషల మధ్య కచ్చితమైన భేదాన్ని తప్పనిసరిగా సూచించకుండా, సెమిటిక్ భాషా రూపంలో ఉన్న పేరును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: అతడు ... సమకూర్చాడు
  rationale: గ్రీకు క్రియ ఏకవచనంలో ఉంది; అందువల్ల దాని వ్యాకరణ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. కర్త ఎవరో వాక్యంలో స్పష్టంగా చెప్పబడలేదు; ఆ సందిగ్ధతను పాదసూచికలో తెలియజేశాం.
- source_word: αὐτοὺς
  choice: వారిని
  rationale: ఇది సందర్భంలోని రాజులను సూచించే కర్మకారక బహువచన సర్వనామం.
- source_word: τὸν τόπον
  choice: స్థలానికి
  rationale: τόπος కు సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు సమానార్థకం ‘స్థలం’.
- source_word: τὸν καλούμενον
  choice: అని పిలిచే
  rationale: స్థలానికి ఉన్న పేరును తెలిపే గ్రీకు కర్మణి భావాన్ని తెలుగులో సహజమైన సంబంధ వాక్యంతో వ్యక్తం చేస్తుంది.
- source_word: Ἑβραϊστὶ
  choice: హెబ్రీ భాషలో
  rationale: గ్రీకు పదానికి నేరమైన అర్థాన్ని నిలుపుతూ, అది భాషను సూచిస్తోందని తెలుగులో స్పష్టం చేస్తుంది; హెబ్రీ/అరామిక్ పరిధిని పాదసూచికలో ఉంచాం.
- source_word: Ἁρμαγεδών
  choice: హర్మగెదోను
  rationale: గ్రీకు పేరులోని ఆరంభ శ్వాసధ్వనిని ‘హ’తో ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ; పేరును అనువదించకుండా నిలిపింది.
theological_decisions:
- issue: సమకూర్చిన కర్త ఎవరు?
  choice: ఏకవచన కర్తను సూచించే ‘అతడు ... సమకూర్చాడు’
  alternative: ‘వారు ... సమకూర్చారు’ లేదా ‘అది ... సమకూర్చింది’
  rationale: συνήγαγεν వ్యాకరణపరంగా ఏకవచనం. అయితే కర్త ఈ వాక్యంలో వ్యక్తంగా లేదు; 13–14 వచనాల్లో అపవిత్రాత్మలు రాజులను సమకూర్చడానికి బయలుదేరుతాయి. ప్రధాన పాఠ్యం గ్రీకు రూపాన్ని నిలుపుతుంది; కర్తను నిర్దిష్టంగా గుర్తించకుండా పాదసూచికలో సందర్భ సంబంధమైన ప్రత్యామ్నాయాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని ఏకవచన క్రియను ప్రధాన పాఠ్యంలో నిలిపి, కర్త గురించిన సందర్భసంబంధ సందిగ్ధతను పాదసూచికలో సంరక్షించాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
