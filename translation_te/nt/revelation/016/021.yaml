id: REV.16.21
reference: Revelation 16:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: te
  text: మరియు దాదాపు ఒక తలాంతు బరువున్న పెద్ద వడగండ్లు[a] ఆకాశం నుండి మనుషుల మీద పడుతున్నాయి. ఆ వడగండ్ల విపత్తు అత్యంత తీవ్రంగా ఉండడంతో,[b] మనుషులు వడగండ్ల విపత్తు కారణంగా దేవుణ్ణి దూషించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఒక తలాంతు బరువున్నట్లున్న వడగండ్లు’; గ్రీకు పదబంధం ఖచ్చితమైన కొలతకన్నా పోలికను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: వాక్యంలోని చివరి భాగాన్ని, ‘ఎందుకంటే దాని విపత్తు అత్యంత ఘోరంగా ఉంది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: పెద్ద వడగండ్లు
  rationale: గ్రీకు ఏకవచన సమూహార్థక నామాన్ని తెలుగులో సహజంగా బహువచనంతో వ్యక్తం చేసి, వడగండ్ల అసాధారణ పరిమాణాన్ని నిలిపింది.
- source_word: ὡς ταλαντιαία
  choice: దాదాపు ఒక తలాంతు బరువున్న
  rationale: ὡς సూచించే పోలికను ఖచ్చిత కొలతగా కాక సుమారు బరువుగా తెలియజేస్తుంది; సందర్భానుసారం ఒక్కో వడగండుకు ఈ బరువు వర్తిస్తుంది.
- source_word: καταβαίνει
  choice: పడుతున్నాయి
  rationale: అపోకలిప్టిక్ కథనంలోని సజీవ వర్తమాన కాలాన్ని సహజమైన తెలుగు వర్తమాన రూపంలో నిలిపింది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ఆకాశం నుండి
  rationale: ఇక్కడ వడగండ్లు కురిసే దృశ్యానికి οὐρανός యొక్క ప్రత్యక్ష వాతావరణార్థమైన ‘ఆకాశం’ సహజం; పై నుండి వచ్చే తీర్పు భావాన్ని కూడా ఇది అడ్డుకోదు.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: మనుషుల మీద
  rationale: ἄνθρωποι స్త్రీపురుషులందరినీ సూచించే సాధారణ మానవ పదం; ‘మనుషులు’ ఆధునిక తెలుగులో లింగనిరపేక్షంగా సహజంగా ఉంది.
- source_word: ἐβλασφήμησαν
  choice: దూషించారు
  rationale: దేవునికి వ్యతిరేకంగా అవమానకరంగా మాట్లాడటాన్ని తెలిపే సహజమైన, గంభీరమైన తెలుగు పదం.
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: వడగండ్ల విపత్తును బట్టి
  rationale: ἐκ యొక్క కారణార్థాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తూ, ప్రకటన గ్రంథంలోని πληγή సూచించే దైవిక విపత్తు/తీర్పు భావాన్ని నిలిపింది.
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: ఆ వడగండ్ల విపత్తు అత్యంత తీవ్రంగా ఉండడంతో
  rationale: μεγάλη ... σφόδρα యొక్క బలమైన తీవ్రతను సహజ తెలుగులో తెలియజేసి, αὐτῆςను వడగండ్లకు స్పష్టంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: οὐρανός యొక్క అర్థం
  choice: ఆకాశం నుండి
  alternative: పరలోకం నుండి
  rationale: వడగండ్ల ప్రత్యక్ష దృశ్యంలో ‘ఆకాశం’ ప్రాథమిక అర్థం. ‘పరలోకం’ తీర్పు యొక్క దైవిక మూలాన్ని మరింత స్పష్టంగా చూపగలిగినా, మూలంలోని ఆకాశం/పరలోకం అర్థసంభావ్యతను అనవసరంగా ఒక వైపుకు నిర్ణయించకుండా ‘ఆకాశం’ ఎంచుకోబడింది.
- issue: ἄνθρωποι యొక్క సాధారణ మానవ సూచన
  choice: మనుషులు
  alternative: ప్రజలు
  rationale: ఈ పదం పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది; ‘మనుషులు’ మూలపదానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంది.
- issue: πληγή యొక్క తీర్పు సంబంధిత భావం
  choice: విపత్తు
  alternative: తెగులు
  rationale: వడగండ్ల సందర్భంలో ‘తెగులు’ వ్యాధిని సూచించే అవకాశముంది. ‘విపత్తు’ భౌతిక దెబ్బతో పాటు ప్రకటన గ్రంథంలోని తీర్పు తీవ్రతను సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన అపోకలిప్టిక్ శైలిని ఉంచుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగించాం. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించాం; కారణ సంబంధాన్ని ‘ఉండడంతో’ ద్వారా స్పష్టం చేశాం.
