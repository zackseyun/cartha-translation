revisions:
- from: మరియు దాదాపు ఒక తలాంతు బరువున్న పెద్ద వడగండ్లు[a] ఆకాశం నుండి మనుషుల మీద పడుతున్నాయి. ఆ వడగండ్ల విపత్తు అత్యంత తీవ్రంగా ఉండడంతో, మనుషులు దాని విపత్తును బట్టి దేవుణ్ణి దూషించారు.[b]
  to: మరియు దాదాపు ఒక తలాంతు బరువున్న పెద్ద వడగండ్లు[a] ఆకాశం నుండి మనుషుల మీద పడుతున్నాయి. ఆ వడగండ్ల విపత్తు అత్యంత తీవ్రంగా ఉండడంతో,[b] మనుషులు వడగండ్ల విపత్తు కారణంగా దేవుణ్ణి దూషించారు.
  rationale: 'The revision resolves the unclear pronoun and explicitly retains the source’s causal sequence: the people blasphemed God because of the hail’s calamity, which was exceedingly severe. It keeps the Greek vivid present, the comparison rather than exact measurement, and the source ambiguity of οὐρανοῦ. Footnote a is narrowed to its lexical function and avoids an unnecessarily precise historical conversion; footnote b is moved to its proper clause anchor.'
