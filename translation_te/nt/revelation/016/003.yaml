id: REV.16.3
reference: Revelation 16:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: te
  text: రెండవవాడు తన పాత్రను సముద్రంలో కుమ్మరించాడు. అప్పుడు సముద్రం చనిపోయినవాడి రక్తంలా మారింది[a]; సముద్రంలో ఉన్న ప్రతి జీవి చనిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శవం నుండి వచ్చిన రక్తంలా’; గ్రీకులో అక్షరార్థంగా, ‘చనిపోయినవాడి రక్తంలా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: రెండవవాడు
  rationale: సందర్భంలో ఇది రెండవ దూతను సూచించినా, ఈ వచనంలో ‘దూత’ అనే నామవాచకం లేదు. అందువల్ల గ్రీకు వాక్యంలోని సంక్షిప్తతను నిలుపుతూ ‘రెండవవాడు’ అని అనువదించాం.
- source_word: ἐξέχεεν
  choice: కుమ్మరించాడు
  rationale: పాత్రలోని ద్రవాన్ని బయటకు పోయడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, తీర్పు పాత్రల దృశ్యాన్ని నిలుపుతుంది.
- source_word: φιάλην
  choice: పాత్రను
  rationale: φιάλη వెడల్పాటి గిన్నె లేదా పాత్రను సూచిస్తుంది. తెలుగులో ‘పాత్ర’ సహజంగా ఉండి, తప్పుదారి పట్టించే ప్రత్యేక ఆకారాన్ని అనవసరంగా నిర్దేశించదు.
- source_word: εἰς τὴν θάλασσαν
  choice: సముద్రంలో
  rationale: εἰς ఇక్కడ పాత్రలోని ద్రవం సముద్రంలోకి పోయబడిన గమనాన్ని సూచిస్తుంది; తెలుగులో ‘సముద్రంలో కుమ్మరించాడు’ సహజమైన నిర్మాణం.
- source_word: ἐγένετο αἷμα
  choice: రక్తంగా మారింది
  rationale: గ్రీకు వాక్యం కేవలం రక్తంలా కనిపించిందని కాక, రక్తంగా అయిందని చెబుతుంది. ‘రక్తంగా మారింది’ ఆ బలాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὡς νεκροῦ
  choice: చనిపోయినవాడి రక్తంలాంటి
  rationale: νεκροῦ ఏకవచనంలో చనిపోయిన వ్యక్తిని సూచిస్తుంది; గ్రీకులో అంతర్లీనంగా ఉన్న ‘రక్తం’ అనే పోలికను తెలుగులో స్పష్టంగా చేసి, దాని అసహ్యకరమైన స్వభావాన్ని నిలుపుతుంది.
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: ప్రతి ప్రాణి
  rationale: సముద్ర సందర్భంలో ఇది ప్రతి జీవిని సూచించే సెమిటిక్ ధోరణి గల ప్రయోగం. ‘ప్రతి ప్రాణి’ సహజంగా ఉండి, ψυχήని ఆధునిక అర్థంలోని ‘ఆత్మ’గా తప్పుగా గ్రహించకుండా చేస్తుంది.
- source_word: ἀπέθανεν
  choice: చనిపోయింది
  rationale: సాధారణ క్రియ యొక్క నేరమైన అర్థాన్ని అలంకారమో వ్యాఖ్యాన విస్తరణో లేకుండా అందిస్తుంది.
- source_word: τὰ ἐν τῇ θαλάσσῃ
  choice: సముద్రంలో ఉన్న
  rationale: ఈ నపుంసక బహువచన ప్రయోగం ముందున్న జీవులను తిరిగి సూచిస్తుంది. తెలుగులో దాన్ని ‘ప్రతి ప్రాణి’కి విశేషణంగా కలపడం సహజం.
theological_decisions:
- issue: తెగులు దృశ్యంలో సముద్రం రక్తంగా మారడం
  choice: దర్శనంలో సముద్రం నిజంగా రక్తంగా మారినట్లు అనువదించడం
  alternative: ‘రక్తంలా కనిపించింది’ అని అనుభవవర్ణనగా మెత్తబరచడం
  rationale: ἐγένετο αἷμα అంటే ‘రక్తంగా మారింది’; తరువాతి ὡς νεκροῦ ఆ రక్త స్వభావాన్ని పోల్చుతుంది. కాబట్టి దర్శనాత్మక తీర్పు భాష యొక్క తీవ్రతను తగ్గించలేదు.
- issue: ὡς νεκροῦలోని సంక్షిప్త పోలిక
  choice: ప్రధాన పాఠ్యంలో ‘చనిపోయినవాడి రక్తంలాంటి రక్తం’ అని అంతర్లీన పదాన్ని స్పష్టం చేయడం
  alternative: ‘చనిపోయినవాడిదానిలాంటి రక్తం’ అని మరింత అక్షరార్థంగా ఉంచడం
  rationale: తెలుగులో పోలికకు అవసరమైన ‘రక్తం’ను స్పష్టం చేయడం అర్థాన్ని పరిష్కరించడం కాదు; గ్రీకు సంక్షిప్త నిర్మాణంలోని సహజంగా గ్రహించబడే అంశాన్ని వ్యక్తం చేస్తుంది. అడుగుసూచనలో ప్రత్యామ్నాయ భావవ్యక్తీకరణను ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘దూత’ను మూలంలో లేనందున చేర్చలేదు; సముద్రం రక్తంగా మారిందనే తీర్పు భాషను మెత్తబరచలేదు.
