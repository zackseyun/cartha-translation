- from: అప్పుడు ఘటసర్పం నోటిలోనుండి, మృగం నోటిలోనుండి, అబద్ధ ప్రవక్త నోటిలోనుండి కప్పలవంటి మూడు అపవిత్ర ఆత్మలు రావడం నేను చూశాను.[a]
