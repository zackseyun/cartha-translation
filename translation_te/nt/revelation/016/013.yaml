  rationale: «అప్పుడు»ను «మరియు»గా మార్చి καί యొక్క సాధారణ అనుసంధాన భావాన్ని నిలిపాం. పాదటిప్పణిలోని సాంకేతికంగా అస్పష్టమైన పదాన్ని సరిచేశాం. మిగతా పదజాలం, కప్పలతో పోలిక, మరియు బయటకు రావడాన్ని సూచించే నిర్మాణం మూలగ్రంథానికీ సందర్భానికీ తగినవే కాబట్టి నిలిపాం.
