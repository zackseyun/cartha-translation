id: REV.16.13
reference: Revelation 16:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: te
  text: మరియు నేను ఘటసర్పం నోటిలోనుండి, మృగం నోటిలోనుండి, అబద్ధ ప్రవక్త నోటిలోనుండి కప్పలవంటి మూడు అపవిత్ర ఆత్మలు రావడం చూశాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఘటసర్పం నోటిలోనుండి, మృగం నోటిలోనుండి, అబద్ధ ప్రవక్త నోటిలోనుండి కప్పలవంటి మూడు అపవిత్ర ఆత్మలను నేను చూశాను.” గ్రీకులో పునరుక్తమైన మూలాన్ని సూచించే పదబంధాలు ‘మూడు అపవిత్ర ఆత్మలు’ కంటే ముందు వస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: ὁράω యొక్క భూతకాల కథనరూపాన్ని దర్శన వర్ణనలో సహజమైన సరళ భూతకాలంగా అనువదిస్తుంది.
- source_word: ἐκ ... τοῦ στόματος
  choice: నోటిలోనుండి ... రావడం
  rationale: ἐκ మూలం లేదా లోపలినుండి వెలుపలికి వచ్చే భావాన్ని తెలుపుతుంది. గ్రీకులో స్పష్టంగా లేని కదలికను తెలుగు వాక్యనిర్మాణం కోసం ‘రావడం’తో సహజంగా వ్యక్తం చేస్తూ, మూడు పునరుక్త మూలపదబంధాలను నిలుపుతుంది.
- source_word: δράκοντος
  choice: ఘటసర్పం
  rationale: ప్రకటన గ్రంథంలోని δράκων సూచించే మహా భయంకర సర్పాకార ప్రతీకకు స్థిరమైన బైబిలు తెలుగు పదం; సాధారణ ‘సర్పం’కన్నా ప్రత్యేక ప్రతీకను నిలుపుతుంది.
- source_word: θηρίου
  choice: మృగం
  rationale: ప్రకటనలోని ప్రతీకాత్మక θηρίονకు సహజమైన, స్థిరమైన తెలుగు సమానం.
- source_word: ψευδοπροφήτου
  choice: అబద్ధ ప్రవక్త
  rationale: ψευδοπροφήτης అనే సమాసపదంలోని తప్పుడు ప్రవచన స్వభావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πνεύματα
  choice: ఆత్మలు
  rationale: ఇక్కడ గాలులు లేదా మనోవైఖరులు కాక ఆత్మసంబంధమైన సత్తలను సూచిస్తుంది; ‘ఆత్మలు’ సందర్భానికి సరైన సాధారణ పదం.
- source_word: τρία ἀκάθαρτα
  choice: మూడు అపవిత్ర
  rationale: ἀκάθαρτα లోని ఆచారపరమైన మరియు నైతిక-ఆధ్యాత్మిక అపవిత్రత భావాన్ని ‘అపవిత్ర’ నిలుపుతుంది; సంఖ్యా-విశేషణ క్రమం సహజ తెలుగుకు అనుగుణం.
- source_word: ὡς βάτραχοι
  choice: కప్పలవంటి
  rationale: ὡς ఇక్కడ సాదృశ్యాన్ని సూచిస్తుంది, అవే కప్పలు అనే తాదాత్మ్యాన్ని కాదు; ‘వంటి’ ఆ పోలికను సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: πνεύματα ἀκάθαρτα యొక్క స్వభావం
  choice: ‘అపవిత్ర ఆత్మలు’ అని మాత్రమే అనువదించడం
  alternative: ‘దయ్యాల ఆత్మలు’ అని ముందుగానే స్పష్టం చేయడం
  rationale: తదుపరి వచనం వాటి దయ్యసంబంధ స్వభావాన్ని వివరిస్తుంది; ఈ వచనంలోని గ్రీకు మాత్రం ‘అపవిత్ర ఆత్మలు’ అని చెబుతుంది. అందువల్ల సందర్భం ఇచ్చే తదుపరి వివరణను ఇక్కడికి దిగుమతి చేయకుండా ప్రతీకాత్మక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: గ్రీకు పదక్రమం మరియు ఆత్మల బయటకు రావడం
  choice: సహజ తెలుగు కోసం ‘రావడం’ను ఉపయోగించి మూలాలను ముందుంచడం
  alternative: ‘... నోటిలోనుండి కప్పలవంటి మూడు అపవిత్ర ఆత్మలను చూశాను’ అని కదలికను వ్యక్తం చేయకుండా ఉంచడం
  rationale: ἐκ మూలం/వెలుపలికి వచ్చే సంబంధాన్ని సూచిస్తుంది. ‘రావడం’ తెలుగు వాక్యంలో ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; అయితే గ్రీకు పదక్రమాన్ని కూడా పాదటిప్పణిలో నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దర్శన-కథన శైలి. ‘ఘటసర్పం’, ‘మృగం’, ‘అబద్ధ ప్రవక్త’, ‘అపవిత్ర ఆత్మలు’ అనే ప్రకటన గ్రంథానికి తగిన ప్రతీకాత్మక పదజాలాన్ని నిలిపి, వాక్యాన్ని సాధారణ పాఠకుడికి సహజంగా నిర్మించాం.
