id: REV.16.8
reference: Revelation 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: te
  text: నాలుగవవాడు తన పాత్రను సూర్యుని మీద కుమ్మరించాడు. అప్పుడు మనుషులను అగ్నితో మాడ్చే అధికారం సూర్యునికి[a] ఇవ్వబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దానికి మనుషులను అగ్నిలో మాడ్చడానికి ఇవ్వబడింది.” ఈ సర్వనామం బహుశా సూర్యునినే సూచిస్తుంది.
    reason: మూలంలోని పేరులేని కర్మణి ప్రయోగాన్ని, “దానికి” అనే సర్వనామాన్ని, అలాగే ἐν πυρίకి సాధ్యమైన అక్షరార్థ రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: నాలుగవవాడు
  rationale: గ్రీకులో విశేషణం నామవాచకంగా వాడబడింది. సందర్భంలో దూత ఉద్దేశించబడినా, ఈ వచనంలో ‘దూత’ అనే పదం లేదు; అందువల్ల మూలంలోని సంక్షిప్తతను నిలిపాం.
- source_word: ἐξέχεεν
  choice: కుమ్మరించాడు
  rationale: పాత్రలోని దానిని పూర్తిగా పోయడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రకటన 16లో పునరావృతమయ్యే తీర్పు సూత్రానికి సరిపోతుంది.
- source_word: φιάλην
  choice: పాత్రను
  rationale: φιάλη అనేది వెడల్పాటి గిన్నె లేదా పాత్ర. ‘పాత్ర’ సహజంగా ఉండి, అనవసరంగా దాని ఖచ్చిత ఆకారాన్ని నిర్ణయించదు.
- source_word: ἐπὶ τὸν ἥλιον
  choice: సూర్యుని మీద
  rationale: ἐπί + accusative ఇక్కడ కుమ్మరించబడిన పాత్రకు సూర్యుడు లక్ష్యమని సూచిస్తుంది.
- source_word: ἐδόθη αὐτῷ
  choice: సూర్యునికి అనుమతి ఇవ్వబడింది
  rationale: αὐτῷకు అత్యంత సహజమైన పూర్వపదం ἥλιον. గ్రీకు కర్మణి ప్రయోగంలో ఇచ్చినవాడు చెప్పబడలేదు; తెలుగులో సహజత కోసం ‘అనుమతి’ని వ్యక్తం చేసినా, ఇచ్చినవాడిని పేర్కొనలేదు.
- source_word: καυματίσαι
  choice: మాడ్చడానికి
  rationale: καυματίζω తీవ్రమైన వేడితో కాల్చడం లేదా మాడ్చడం అనే భావాన్ని ఇస్తుంది. సూర్యుని వేడికి ‘మాడ్చు’ సహజమైన తెలుగు పదం.
- source_word: τοὺς ἀνθρώπους
  choice: మనుషులను
  rationale: ἄνθρωπος ఇక్కడ పురుషులకు మాత్రమే కాక సాధారణంగా మానవులను సూచిస్తుంది; ‘మనుషులు’ ఆ సమగ్ర భావాన్ని కాపాడుతుంది.
- source_word: ἐν πυρί
  choice: అగ్నితో
  rationale: ἐν ఇక్కడ సాధనం లేదా విధానాన్ని సూచించగలదు. ‘అగ్నితో’ సహజమైన తెలుగులో అగ్ని ద్వారా మాడ్చడం అనే దృశ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἐδόθηలో పరోక్ష దైవకర్తృత్వం
  choice: ‘అనుమతి ఇవ్వబడింది’ అని కర్మణి రూపాన్ని ఉంచి, ఇచ్చినవారిని పేర్కొనలేదు.
  alternative: ‘దేవుడు అనుమతి ఇచ్చాడు’ లేదా ‘దేవుడు శక్తి ఇచ్చాడు.’
  rationale: ప్రకటన గ్రంథంలో ఇటువంటి కర్మణి ప్రయోగం దేవుని సార్వభౌమ అనుమతిని సూచించవచ్చు; అయితే ఈ వాక్యంలో దేవుడు ప్రత్యక్షంగా పేర్కొనబడలేదు.
- issue: αὐτῷ యొక్క సూచన
  choice: అది సూర్యునిని సూచిస్తుందని ప్రధాన పాఠ్యంలో స్పష్టం చేశాం.
  alternative: అది నాలుగవవాడిని సూచిస్తుంది; లేదా సూచనను అస్పష్టంగా ఉంచడం.
  rationale: సమీప పూర్వపదం ‘సూర్యుడు’; మనుషులను మాడ్చే చర్య కూడా సూర్యునికి సందర్భోచితంగా సరిపోతుంది. అయినా మూలంలోని సర్వనామ నిర్మాణాన్ని పాదసూచికలో అందించాం.
- issue: ἀνθρώπους యొక్క లింగ-సమగ్ర భావం
  choice: ‘మనుషులను’
  alternative: ‘పురుషులను’ లేదా ‘మానవజాతిని.’
  rationale: ఈ పదం ఇక్కడ లింగపరంగా సాధారణ మానవ సమూహాన్ని సూచిస్తుంది; ‘మనుషులు’ సహజంగా, సమగ్రంగా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘నాలుగవవాడు’ ద్వారా మూలంలో లేని ‘దూత’ను ప్రధాన పాఠ్యంలో చేర్చలేదు. ప్రధాన పాఠ్యంలో తెలుగు స్పష్టత కోసం సర్వనామ సూచనను ‘సూర్యునికి’గా వ్యక్తం చేసి, మూలంలోని మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో నిలిపాం.
