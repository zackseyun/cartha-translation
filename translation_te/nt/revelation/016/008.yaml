revisions:
- from: నాలుగవవాడు తన పాత్రను సూర్యుని మీద కుమ్మరించాడు. అప్పుడు మనుషులను అగ్నితో మాడ్చడానికి సూర్యునికి[a] అనుమతి ఇవ్వబడింది.
  to: నాలుగవవాడు తన పాత్రను సూర్యుని మీద కుమ్మరించాడు. అప్పుడు మనుషులను అగ్నితో మాడ్చే అధికారం సూర్యునికి[a] ఇవ్వబడింది.
  rationale: The revision retains the draft’s accurate rendering of the verse while replacing “permission” with “authority” in the main text to better express the granted capacity in context. It also corrects the footnote so that its “more literal” formulation does not introduce the interpretive term “permission.” The likely reference of αὐτῷ to the sun remains indicated, while the footnote preserves the source’s pronoun-based formulation and does not name the giver.
