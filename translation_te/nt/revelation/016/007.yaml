id: REV.16.7
reference: Revelation 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: te
  text: 'నేను బలిపీఠం ఇలా చెప్పడం విన్నాను[a]: “అవును, ప్రభువా, సర్వశక్తిమంతుడైన దేవా, నీ తీర్పులు సత్యమైనవి, న్యాయమైనవి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలిపీఠం నుండి ఇలా చెప్పడం నేను విన్నాను.” యోహాను విన్న మాటల మూలాన్ని గ్రీకు నిర్మాణం సూచించవచ్చు; అయితే బలిపీఠమే మాట్లాడుతున్నట్లు అర్థం చేసుకోవడం మరింత సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: నేను విన్నాను
  rationale: ἀκούω యొక్క ఏకకాల గత సంఘటనను సహజంగా తెలియజేస్తుంది; ఉద్దేశపూర్వకంగా ఆలకించాడనే అదనపు భావాన్ని చేర్చదు.
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: బలిపీఠం ఇలా చెప్పడం
  rationale: గ్రీకు నిర్మాణం వినబడిన మాటలకు బలిపీఠమే మూలమని సూచించగలదు; λέγοντος కారణంగా బలిపీఠాన్నే మాట్లాడుతున్నదిగా చూపడం ఇక్కడ అత్యంత సహజం, అలాగే ప్రకటన గ్రంథంలోని సజీవ చిత్రణను నిలుపుతుంది.
- source_word: Ναί
  choice: అవును
  rationale: బలమైన సమ్మతిని, ప్రతిస్పందన స్వభావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: ప్రభువా, సర్వశక్తిమంతుడైన దేవా
  rationale: మూడు దైవ సంబోధనాంశాలనూ నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన సంబోధన క్రమాన్ని ఇస్తుంది.
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: సత్యమైనవి, న్యాయమైనవి
  rationale: తీర్పులు వాస్తవానికి అనుగుణమైనవనీ న్యాయసమ్మతమైనవనీ తెలిపే రెండు వేర్వేరు గుణాలను నిలుపుతుంది.
- source_word: αἱ κρίσεις σου
  choice: నీ తీర్పులు
  rationale: న్యాయనిర్ణయాలు లేదా తీర్పు కార్యాలు అనే న్యాయపరమైన భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: బలిపీఠాన్ని మాట్లాడే దానిగా వ్యక్తీకరించడం
  choice: “బలిపీఠం ఇలా చెప్పడం నేను విన్నాను”
  alternative: “బలిపీఠం దగ్గరనుండి ఇలా చెప్పడం నేను విన్నాను” లేదా పాఠ్యంలో లేని ‘స్వరం’ను చేర్చడం
  rationale: τοῦ θυσιαστηρίου λέγοντος అనే గ్రీకు మాటలు బలిపీఠాన్నే చెప్పేవానిగా అత్యంత సహజంగా చూపుతాయి. ఈ వ్యక్తీకరణను నిలుపడం ప్రకటన గ్రంథంలోని దర్శనాత్మక ఉద్వేగాన్ని కాపాడుతుంది; అయితే మూలాన్ని సూచించే షష్ఠీ విభక్తి వల్ల ప్రత్యామ్నాయ నిర్మాణం సాధ్యమని పాదటిప్పణి తెలియజేస్తుంది.
- issue: దైవ బిరుదుల సంబోధన
  choice: “ప్రభువా, సర్వశక్తిమంతుడైన దేవా”
  alternative: “ప్రభువైన సర్వశక్తిమంతుడైన దేవా”
  rationale: κύριε, ὁ θεός, ὁ παντοκράτωρ అనే సంబోధనాంశాలన్నిటినీ అనువదిస్తుంది. తెలుగులో సహజత్వం కోసం ‘దేవా’తో ‘సర్వశక్తిమంతుడైన’ను కలిపినా, ‘ప్రభువా’ను ప్రత్యేక సంబోధనగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘బలిపీఠం’ అనే స్థిరమైన బైబిలు పదాన్ని, ‘తీర్పులు’ అనే న్యాయపరమైన పదాన్ని నిలిపాం. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగులో సహజమైన సంబోధన, విధేయ క్రమం ఉపయోగించాం.
