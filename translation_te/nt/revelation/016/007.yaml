- from: 'అప్పుడు బలిపీఠం ఇలా చెప్పడం నేను విన్నాను[a]: “అవును, ప్రభువా, సర్వశక్తిమంతుడైన దేవా, నీ తీర్పులు సత్యమైనవి, న్యాయమైనవి.”'
  to: 'నేను బలిపీఠం ఇలా చెప్పడం విన్నాను[a]: “అవును, ప్రభువా, సర్వశక్తిమంతుడైన దేవా, నీ తీర్పులు సత్యమైనవి, న్యాయమైనవి.”'
