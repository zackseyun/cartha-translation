id: REV.21.11
reference: Revelation 21:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: te
  text: దేవుని మహిమను కలిగివున్నది. దాని తేజస్సు అత్యంత విలువైన రత్నంలా, స్ఫటికంలా స్వచ్ఛంగా మెరిసే సూర్యకాంతమణిలా[a] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్ఫటికంలా మెరిసే సూర్యకాంతమణిలా.”
    reason: κρυσταλλίζοντι అనే పదం స్ఫటికసదృశమైన స్వచ్ఛతను లేదా మెరుపును సూచించవచ్చు.
lexical_decisions:
- source_word: ἔχουσαν
  choice: కలిగివున్నది
  rationale: మునుపటి వచనంలోని నగరాన్ని విశేషించే వర్తమాన కృదంత భావాన్ని తెలుగులో సహజంగా కొనసాగిస్తుంది.
- source_word: δόξαν τοῦ θεοῦ
  choice: దేవుని మహిమను
  rationale: దైవసన్నిధి ప్రత్యక్షతను సూచించే δόξα పదంలోని దృశ్య, వేదాంతపరమైన బరువును ‘మహిమ’ నిలుపుతుంది.
- source_word: ὁ φωστὴρ αὐτῆς
  choice: దాని తేజస్సు
  rationale: φωστήρ వెలుగునిచ్చే మూలాన్నీ, కనిపించే ప్రకాశాన్నీ సూచించగలదు; నగర రూపవర్ణనలో ‘తేజస్సు’ సహజంగా ఉండి ఆ విస్తృతిని చాలావరకు నిలుపుతుంది.
- source_word: λίθῳ τιμιωτάτῳ
  choice: అత్యంత అమూల్యమైన రాయిలా
  rationale: τιμιωτάτῳ లోని అత్యుత్తమ స్థాయి భావాన్ని ‘అత్యంత’ ద్వారా, విలువను ‘అమూల్యమైన’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: సూర్యకాంతపు రాయిలా
  rationale: ἴασπις అనే ప్రాచీన రత్ననామానికి తెలుగులో పరిచితమైన బైబిలు రత్నపదాన్ని వాడుతూ λίθος పునరుక్తిని ‘రాయి’తో నిలుపుతుంది.
- source_word: κρυσταλλίζοντι
  choice: స్ఫటికంలా మెరిసే
  rationale: ఈ కృదంతం స్ఫటికసదృశమైన స్వచ్ఛత లేదా మెరుపును సూచించవచ్చు; ‘మెరిసే’ ఆ దృశ్యగుణాన్ని సహజ తెలుగులో ఇస్తూ అస్పష్టతను పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: δόξαν τοῦ θεοῦ అనే ప్రళయదర్శన వర్ణన
  choice: దేవుని మహిమ
  alternative: దేవుని వైభవం
  rationale: ఇది కేవలం దృశ్య సౌందర్యం కాక, దేవుని సన్నిధి ప్రత్యక్షతను సూచిస్తుంది; ‘మహిమ’ ఆ వేదాంతపరమైన ప్రతిధ్వనిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. నగరాన్ని సూచించేందుకు నపుంసక ఏకవచన రూపాలు వాడబడ్డాయి. ప్రధాన పాఠంలోని [a] పాదటిప్పణి గుర్తు సంబంధిత ప్రత్యామ్నాయానికి జతచేయబడింది.
