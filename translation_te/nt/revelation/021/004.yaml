id: REV.21.4
reference: Revelation 21:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: te
  text: ఆయన వారి కళ్లనుండి ప్రతి కన్నీటి బొట్టునూ తుడిచివేస్తాడు[a]. ఇక మరణం ఉండదు; దుఃఖమూ, రోదనమూ[b], వేదనా ఇక ఉండవు. మునుపటి సంగతులు గతించిపోయాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కన్నీళ్లన్నిటినీ.’ గ్రీకులోని ఏకవచన ప్రయోగం ఒక్కొక్క కన్నీటినీ కలుపుకొని ‘ప్రతి కన్నీరు’ అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కేక’ లేదా ‘ఆర్తనాదం.’ గ్రీకు పదం గట్టిగా వెలువడే ఏడుపు లేదా మొరను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మొదటి సంగతులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: తుడిచివేస్తాడు
  rationale: కన్నీటి సందర్భంలో ἐξαλείφω వ్యక్తిగతంగా కన్నీటిని తొలగించడాన్ని సూచిస్తుంది. ‘తుడిచివేస్తాడు’ సహజమైన తెలుగు ప్రయోగంగా ఉండి, క్రియలోని సంపూర్ణ తొలగింపు భావాన్ని నిలుపుతుంది.
- source_word: πᾶν δάκρυον
  choice: ప్రతి కన్నీటి బొట్టునూ
  rationale: ఏకవచనంతో ఉన్న πᾶν విభజనార్థకంగా ప్రతి ఒక్క కన్నీటిని సూచిస్తుంది. ‘ప్రతి కన్నీటి బొట్టునూ’ ఆ వ్యక్తిగతమైన, సమగ్ర ఆదరణ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: వారి కళ్లనుండి
  rationale: కన్నుల నుంచి కన్నీటిని తొలగించడాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ θάνατος
  choice: మరణం
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, ఇక్కడ సమస్త మరణ వాస్తవాన్ని తెలుగులో సహజంగా ‘మరణం’ అని చెప్పవచ్చు.
- source_word: οὐκ ἔσται ἔτι
  choice: ఇక ... ఉండదు / ఉండవు
  rationale: ఈ వాక్యభాగం సంపూర్ణమైన అంతాన్ని సూచిస్తుంది. సంఖ్యకు అనుగుణంగా ‘ఇక మరణం ఉండదు’ మరియు ‘ఇక ఉండవు’ అని రెండుసార్లు అనువదించడం మూలంలోని పునరుక్తినీ అంతిమతనూ నిలుపుతుంది.
- source_word: πένθος
  choice: దుఃఖం
  rationale: మరణం లేదా నష్టంతో ముడిపడిన శోకాన్ని సూచిస్తుంది. ‘దుఃఖం’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతూ సందర్భంలోని విస్తృత శోకభావాన్ని కలిగి ఉంటుంది.
- source_word: κραυγή
  choice: రోదనం
  rationale: κραυγή ఏడుపు, కేక లేదా గట్టిగా వెలువడే మొరను సూచించగలదు. ఈ ఆదరణ సందర్భంలో ‘రోదనం’ దుఃఖంతో కూడిన వినిపించే ఏడుపును గౌరవప్రదమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πόνος
  choice: వేదన
  rationale: πόνος బాధ, శ్రమ లేదా నొప్పిని సూచించగలదు. ‘వేదన’ శారీరకమూ మానసికమూ అయిన బాధను విస్తృతంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ πρῶτα
  choice: మునుపటి సంగతులు
  rationale: ఇది ముందున్న పాత వ్యవస్థకు చెందిన వాస్తవాలను సూచించే నపుంసక బహువచన నామవాచక ప్రయోగం. ‘మునుపటి సంగతులు’ తెలుగులో సహజంగా ఉండి, ‘మొదటి సంగతులు’ అనే సాధ్యమైన అక్షరార్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἀπῆλθαν
  choice: గతించిపోయాయి
  rationale: పూర్తిగా వెళ్లిపోయిన స్థితిని తెలిపే అఓరిస్ట్ క్రియ. ‘గతించిపోయాయి’ పాత వాస్తవాలు ముగిసి తొలగిపోయాయనే సంపూర్ణ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ‘తుడిచివేస్తాడు’ అనే క్రియకు కర్త ఈ వచనంలో నామవాచకంగా మళ్లీ చెప్పబడలేదు; అది ప్రకటన 21:3 సందర్భం నుంచి తెలుస్తుంది.
  choice: ‘దేవుడు’ అని చేర్చకుండా ‘ఆయన’ అని అనువదించడం.
  alternative: ‘దేవుడు ... తుడిచివేస్తాడు’ అని స్పష్టీకరించడం.
  rationale: గ్రీకు క్రియలో మూడవ పురుష ఏకవచన కర్త అంతర్లీనంగా ఉంది; సమీప సందర్భం దాని సూచ్యాన్ని తెలియజేస్తుంది. ‘ఆయన’ మూలంలోని సందర్భ అనుసంధానాన్ని నిలుపుతూ, వచనంలో లేని నామవాచకాన్ని చేర్చదు.
- issue: కొత్త సృష్టిలో మరణం, దుఃఖం, రోదనం, వేదనల అంతం ఎంత సంపూర్ణమో తెలియజేయడం.
  choice: ‘ఇక ... ఉండదు/ఉండవు’ అనే నిరపేక్ష భాషను ఉపయోగించడం.
  alternative: అవి తగ్గిపోతాయి లేదా ఇక బాధించవు అని మృదువుగా చెప్పడం.
  rationale: గ్రీకు పాఠం తగ్గుదలను కాదు, వాటి సంపూర్ణ అంతాన్ని ప్రకటిస్తుంది. అనువాదం ఎలాంటి వివరణాత్మక పరిమితులు చేర్చకుండా ఆ అంతిమతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రవచన శైలిని ఉపయోగించాం. ‘కళ్లు,’ ‘దుఃఖం,’ ‘వేదన’ వంటి ప్రస్తుత వాడుక పదాలతో పాటు సందర్భానికి తగిన ‘రోదనం,’ ‘గతించిపోయాయి’ వంటి గంభీరమైన పదాలను ఎంచుకున్నాం. మూలంలోని రెండు ‘ఇక ఉండదు/ఉండవు’ ప్రకటనల పునరుక్తిని నిలిపాం.
