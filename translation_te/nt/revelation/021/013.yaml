source:
  edition: SBLGNT
  text: ἀπὸ ⸀ἀνατολῆς πυλῶνες τρεῖς, καὶ ἀπὸ βορρᾶ πυλῶνες τρεῖς, καὶ ἀπὸ νότου πυλῶνες τρεῖς, καὶ ἀπὸ δυσμῶν πυλῶνες τρεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: te
  text: తూర్పు వైపున[a] మూడు ద్వారాలు, ఉత్తర వైపున మూడు ద్వారాలు, దక్షిణ వైపున మూడు ద్వారాలు, పడమర వైపున మూడు ద్వారాలు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: ‘తూర్పు నుండి … ఉత్తరం నుండి … దక్షిణం నుండి … పడమర నుండి.’ ఇక్కడ ద్వారాలు ఏ వైపున ఉన్నాయో సహజమైన తెలుగులో తెలియజేయడానికి ‘వైపున’ అని అనువదించబడింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς
  choice: తూర్పు వైపున
  rationale: ἀπόను అక్షరార్థంగా ‘నుండి’ అని అనువదించవచ్చు; అయితే నగర నిర్మాణ వర్ణనలో ఇది ద్వారాలు ఉన్న వైపును సూచిస్తుంది. ‘తూర్పు వైపున’ ఆధునిక తెలుగులో సహజంగా ఆ స్థానార్థాన్ని తెలియజేస్తుంది.
- source_word: πυλῶνες
  choice: ద్వారాలు
  rationale: πυλών విశాలమైన ప్రవేశద్వారాన్ని లేదా ద్వార నిర్మాణాన్ని సూచించగలదు. ఈ సందర్భంలో ‘ద్వారాలు’ స్పష్టమైన, సహజమైన పదం; ‘ద్వారగోపురాలు’ అనడం మూలపాఠం కంటే మరీ నిర్దిష్టమవుతుంది.
- source_word: τρεῖς
  choice: మూడు
  rationale: సాధారణ సంఖ్యావాచకం. ప్రతి దిక్కు విషయంలో దీని పునరుక్తిని నిలిపి, మూలంలోని కొలతతో కూడిన సమతౌల్యాన్ని కాపాడాం.
- source_word: ἀπὸ βορρᾶ / ἀπὸ νότου / ἀπὸ δυσμῶν
  choice: ఉత్తర వైపున / దక్షిణ వైపున / పడమర వైపున
  rationale: నాలుగు దిక్కుల పదబంధాలను ఒకే నిర్మాణంలో అనువదించడం ద్వారా నగరపు ప్రతి వైపున ద్వారాలు ఉన్నాయనే స్థానార్థం, అలాగే వాక్య సమాంతరత స్పష్టమవుతాయి.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: కామాలతో సమాంతర జాబితా
  rationale: తెలుగులో ప్రతి భాగం ముందు ‘మరియు’ పునరావృతం చేయడం అసహజంగా ఉంటుంది. ఒకే వాక్యనిర్మాణాన్ని వరుసగా పునరావృతం చేయడం ద్వారా గ్రీకు పాఠంలోని లయ, సమతౌల్యం నిలుస్తాయి.
theological_decisions:
- issue: కొత్త యెరూషలేము ద్వారాల స్థలవర్ణన
  choice: నగరపు నాలుగు వైపులా మూడేసి ద్వారాలు ఉన్నాయని నేరుగా వర్ణించడం
  alternative: ఇశ్రాయేలు గోత్రాల అమరికతో లేదా యెహెజ్కేలు దర్శనంలోని ఆలయ-నగరంతో ఉన్న ప్రతీకాత్మక సంబంధాన్ని అనువాదంలో స్పష్టం చేయడం
  rationale: ఈ వచనం స్వయంగా ద్వారాలను దిక్కుల వారీగా మాత్రమే లెక్కిస్తుంది. విస్తృత లేఖన సందర్భంలో ప్రతీకాత్మక సంబంధాలు ఉండవచ్చు; అయితే వాటిని ప్రధాన పాఠంలో చేర్చకుండా వ్యాఖ్యానానికి వదిలివేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలో క్రియ లేకపోయినా, తెలుగులో వాక్యాన్ని సహజంగా పూర్తిచేయడానికి చివర ‘ఉన్నాయి’ చేర్చాం; నాలుగు వైపుల సమాంతర నిర్మాణాన్ని మాత్రం కాపాడాం.
