id: REV.21.1
reference: Revelation 21:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: te
  text: నేను కొత్త ఆకాశాన్నీ కొత్త భూమినీ చూశాను. ఎందుకంటే మొదటి ఆకాశమూ మొదటి భూమీ[a] గతించిపోయాయి; సముద్రం ఇక లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మొదటి ఆకాశం, మొదటి భూమి’ అనే మాటలను ‘మునుపటి ఆకాశం, మునుపటి భూమి’ అని కూడా అనువదించవచ్చు. గ్రీకు పాఠంలో ‘మొదటి’ అని ఉంది; అది కొత్త వ్యవస్థకు ముందు ఉన్న వ్యవస్థను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సముద్రం’ అనే మాటను అక్షరార్థంగా అర్థం చేసుకోవచ్చు. అయితే ప్రకటన గ్రంథంలో అది అస్తవ్యస్తత, ప్రమాదం లేదా వేరుపాటు వంటి భావాలతో కూడా ముడిపడి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδον
  choice: చూశాను
  rationale: ὁράω యొక్క భూతకాల కథన రూపాన్ని ఆధునిక తెలుగులో సహజమైన సాధారణ భూతకాల క్రియగా అనువదిస్తుంది.
- source_word: οὐρανὸν ... γῆν
  choice: ఆకాశం ... భూమి
  rationale: ఈ విశ్వసంబంధమైన దర్శన సందర్భంలో ఇవి కేవలం కనిపించే ఆకాశాన్నీ నేలనూ కాక సృష్టి వ్యవస్థను సూచిస్తాయి; గ్రీకు ఏకవచన రూపాలనూ నిలుపుతాయి.
- source_word: καινὸν ... καινήν
  choice: కొత్త ... కొత్త
  rationale: καινός గుణంలో లేదా స్వభావంలో కొత్తదనాన్ని సూచించగలదు. ‘కొత్త’ అనేది పాత సృష్టి పూర్తిగా భర్తీ అయిందా లేక రూపాంతరం చెందిందా అనే విషయాన్ని ముందుగానే నిర్ణయించదు.
- source_word: ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: ఎందుకంటే మొదటి ఆకాశమూ మొదటి భూమీ
  rationale: γὰρ యొక్క కారణార్థాన్ని ‘ఎందుకంటే’ స్పష్టంగా తెలియజేస్తుంది. πρῶτος‌ను నేరుగా ‘మొదటి’గా అనువదించడం కొత్త వ్యవస్థకు ముందు ఉన్న వ్యవస్థతో గ్రీకు పాఠం చేసే వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἀπῆλθαν
  choice: గతించిపోయాయి
  rationale: మునుపటి ఆకాశం, భూమి ఇక లేకపోవడాన్ని ఈ సందర్భంలో సహజంగా తెలియజేస్తూ, ‘వెళ్లిపోయాయి’ అనే అతిగా అక్షరార్థమైన రూపాన్ని నివారిస్తుంది.
- source_word: ἡ θάλασσα
  choice: సముద్రం
  rationale: θάλασσα యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; దాని సంభావ్య ప్రతీకాత్మక భావాన్ని ప్రధాన పాఠంలో చేర్చదు.
- source_word: οὐκ ἔστιν ἔτι
  choice: ఇక లేదు
  rationale: ἔτιతో కూడిన వర్తమానకాల నిరాకరణను సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కొత్త ఆకాశం, కొత్త భూమి స్వరూపం
  choice: ‘కొత్త’ అని మాత్రమే అనువదించి, పాత సృష్టి భర్తీ చేయబడిందా లేక రూపాంతరం చెందిందా అని నిర్దేశించలేదు.
  alternative: పూర్తిగా భర్తీ చేయబడిన సృష్టి; లేదా ఇప్పటికే ఉన్న సృష్టి పునరుద్ధరణ/రూపాంతరం
  rationale: καινός కొత్తదనాన్ని సూచించినా, ఈ వచనం భర్తీ మరియు రూపాంతరం మధ్య ఉన్న తాత్త్విక ప్రశ్నను స్వయంగా పరిష్కరించదు.
- issue: ‘సముద్రం ఇక లేదు’ అనే మాట అర్థం
  choice: ప్రధాన పాఠంలో సముద్రం అనే స్పష్టమైన రూపకల్పనను యథాతథంగా ఉంచింది.
  alternative: సముద్రం అక్షరార్థంగా లేకపోవడం; లేదా అస్తవ్యస్తత, ప్రమాదం, చెడు, వేరుపాటు తొలగిపోవడానికి ప్రతీక
  rationale: ప్రకటన గ్రంథంలో సముద్రానికి ప్రతీకాత్మక అనుబంధాలు ఉండవచ్చు; అయితే ఈ వచనం వాటిలో ఒక్కదానినే స్పష్టంగా ఎంచుకోదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన దర్శన-కథన శైలి వాడబడింది. ‘ఆకాశాన్నీ ... భూమినీ’, ‘ఆకాశమూ ... భూమీ’ అనే సముచ్చయ రూపాలు సహజమైన తెలుగు ప్రవాహాన్ని ఇస్తాయి. మూలంలోని γὰρ సంబంధాన్ని రెండు వాక్యాలుగా విభజించినప్పటికీ ‘ఎందుకంటే’ ద్వారా తార్కిక అనుసంధానం స్పష్టంగా నిలుపబడింది.
