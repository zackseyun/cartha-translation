translation:
  language: te
  text: దేశాల మహిమను, గౌరవాన్ని వారు దానిలోకి తీసుకువస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, గ్రీకులో నగరాన్ని స్త్రీరూపంగా వ్యక్తీకరించిన విధానాన్ని నిలుపుతూ, ‘ఆమెలోకి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴσουσιν
  choice: తీసుకొస్తారు
  rationale: φέρω అనే క్రియ యొక్క భవిష్యత్ క్రియాశీల రూపం. నగరంలోకి వెలుపలి నుంచి తీసుకురావడం అనే గమనార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δόξαν
  choice: మహిమను
  rationale: δόξα పదంలోని కీర్తి, వైభవం, ప్రకాశం వంటి విస్తృత బైబిలీయ భావాలను ‘మహిమ’ నిలుపుతుంది.
- source_word: τιμὴν
  choice: ఘనతను
  rationale: δόξαతో జతగా వచ్చిన τιμή ఇక్కడ విలువ లేదా సంపద కంటే గౌరవం, ప్రతిష్ఠ అనే భావాన్ని ప్రధానంగా సూచిస్తుంది; ‘ఘనత’ ఈ జంటలో సహజంగా వినిపిస్తుంది.
- source_word: τῶν ἐθνῶν
  choice: జనాల
  rationale: ἔθνη విస్తృతంగా ప్రజాసమూహాలను లేదా దేశజనాలను సూచిస్తుంది. ‘అన్యజనులు’ అనడం ఇక్కడ ప్రధానంగా లేని యూదు–అన్యజన భేదాన్ని ముందుకు తెస్తుంది.
- source_word: εἰς αὐτήν
  choice: దానిలోకి
  rationale: స్త్రీలింగ సర్వనామమైన αὐτήνకు పూర్వపదం నగరం. ఆధునిక తెలుగులో నగరాన్ని సాధారణంగా ‘అది’తో సూచించడం సహజం; గ్రీకు వాక్యంలోని స్త్రీరూప వ్యక్తీకరణను పాదటిప్పణిలో చూపించాం.
- source_word: καὶ
  choice: —ను, —ను
  rationale: వాక్యారంభంలోని అనుసంధాన καὶ సందర్భంతో కలుస్తుంది; నామపదాల మధ్యనున్న καὶను తెలుగులో సహజమైన ‘మహిమను, ఘనతను’ అనే జంట నిర్మాణంతో వ్యక్తం చేశాం.
theological_decisions:
- issue: αὐτήν సూచించే నగరం మరియు దాని స్త్రీరూప వ్యక్తీకరణ
  choice: కొత్త యెరూషలేము నగరాన్ని సూచిస్తూ ‘దానిలోకి’ అని అనువదించడం
  alternative: ‘ఆమెలోకి’ అని అనువదించి నగరపు స్త్రీరూప వ్యక్తీకరణను ప్రత్యక్షంగా నిలుపడం
  rationale: πόλις గ్రీకులో స్త్రీలింగ పదం; సమీప సందర్భంలో నగరం వధువుగా కూడా చిత్రించబడుతుంది. అయినా ఆధునిక తెలుగులో ఈ వాక్యస్థానంలో నగరాన్ని ‘ఆమె’ అనడం అసహజం కావచ్చు. అందువల్ల ప్రధాన పాఠ్యంలో సహజ రూపాన్ని, పాదటిప్పణిలో వ్యక్తీకరణను నిలిపాం.
- issue: జనాల ‘మహిమ మరియు ఘనత’ అర్థం
  choice: నిర్దిష్ట వివరణకు కుదించకుండా విస్తృత పదబంధంగానే ఉంచడం
  alternative: జనాల సంపద; వారి సాంస్కృతిక వైభవం; వారు అర్పించే గౌరవం
  rationale: గ్రీకు పదబంధం విస్తృతార్థకమైనది. ఇది భౌతిక సంపదనా, సాంస్కృతిక శ్రేష్ఠతనా, అర్పించే నివాళినా అని సందర్భం తప్పనిసరిగా నిర్ణయించదు; అందువల్ల ఏ ప్రత్యేక అంత్యకాల సిద్ధాంతాన్నీ పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: సరళమైన, ఆధునిక, గౌరవప్రదమైన తెలుగు. ‘జనాలు’ సాధారణ పాఠకులకు సహజంగా ఉండగా, ‘మహిమ’, ‘ఘనత’ మూలంలోని గంభీరమైన మరియు విస్తృతమైన భావాన్ని నిలుపుతాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
