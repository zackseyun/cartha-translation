translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రకటన గ్రంథపు గంభీర దృశ్యభాషకు తగిన గౌరవప్రద శైలి పాటించబడింది. గ్రీకు వాక్యంలో నగరం ‘మేలిమి బంగారం’ అని నామవాచక విధేయ నిర్మాణం ఉంది; తెలుగులో అసహజతను నివారించేందుకు ‘మేలిమి బంగారంతో నిర్మితమై ఉంది’ అని వ్యక్తం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
