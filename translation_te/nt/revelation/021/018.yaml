id: REV.21.18
reference: Revelation 21:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ ἡ ἐνδώμησις τοῦ τείχους αὐτῆς ἴασπις, καὶ ἡ πόλις χρυσίον καθαρὸν ὅμοιον ὑάλῳ καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/018.yaml
  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: te
  text: దాని ప్రాకారపు నిర్మాణ పదార్థం సూర్యకాంతమణి[a]; ఆ నగరం స్వచ్ఛమైన గాజువంటి[b] మేలిమి బంగారం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని ప్రాకారపు నిర్మాణం సూర్యకాంతమణి.” గ్రీకు పదం నిర్మాణ కార్యాన్ని లేదా నిర్మించబడిన దాని పదార్థాన్ని/నిర్మితిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “స్వచ్ఛమైన గాజులా” లేదా “పారదర్శకమైన గాజులా.” ఈ పోలిక నగరపు ప్రకాశవంతమైన స్వచ్ఛతను నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδώμησις
  choice: నిర్మాణ పదార్థం
  rationale: ఈ పదం నిర్మాణాన్ని లేదా నిర్మించబడిన దాని పదార్థం/నిర్మితిని సూచించగలదు. ఇక్కడ ἴασπις అనే పదార్థం విధేయంగా ఉండడం వల్ల ‘నిర్మాణ పదార్థం’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: τεῖχος
  choice: ప్రాకారం
  rationale: నగరాన్ని చుట్టిన రక్షణ గోడను సూచించడానికి ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రాకారం’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: ἴασπις
  choice: సూర్యకాంతమణి
  rationale: ప్రకటన గ్రంథంలోని రత్నపదానికి తెలుగులో ప్రాచుర్యంలో ఉన్న సంప్రదాయ సమానార్థాన్ని వాడాం; ప్రాచీన ἴασπις ఆధునిక ఖనిజ వర్గీకరణతో పూర్తిగా సరిపోలకపోవచ్చు.
- source_word: χρυσίον καθαρόν
  choice: మేలిమి బంగారం
  rationale: χρυσίον పదార్థమైన బంగారాన్ని, καθαρόν దాని శుద్ధతను సూచిస్తాయి. ‘మేలిమి బంగారం’ శుద్ధీకరించిన/నిష్కల్మషమైన బంగారాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὅμοιον
  choice: లా
  rationale: పోలికను సహజమైన, సంక్షిప్తమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὕαλῳ καθαρῷ
  choice: స్వచ్ఛమైన స్ఫటికం
  rationale: ὕαλος గాజును లేదా గాజువంటి పారదర్శక పదార్థాన్ని సూచించగలదు; καθαρός ఇక్కడ స్వచ్ఛతతోపాటు దృశ్య స్పష్టతను తెలియజేస్తుంది. ‘స్ఫటికం’ ప్రకాశవంతమైన పారదర్శక రూపాన్ని సహజంగా అందిస్తుంది; ‘స్వచ్ఛమైన గాజు’ మరింత ప్రత్యక్ష ప్రత్యామ్నాయం.
