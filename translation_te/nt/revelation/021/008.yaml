id: REV.21.8
reference: Revelation 21:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: te
  text: కాని పిరికివారికి, విశ్వసించనివారికి[a], అసహ్యకరమైనవారికి, హంతకులకు, లైంగిక దుర్నీతికి పాల్పడేవారికి, మంత్రతంత్రాలు చేసేవారికి, విగ్రహారాధకులకు, అబద్ధికులందరికీ దక్కే వంతు అగ్నితోనూ గంధకంతోనూ మండే సరస్సులో ఉంటుంది. అదే రెండవ మరణం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకంగా ఉండనివారికి” లేదా “నమ్మకద్రోహులకు.”
    reason: ἀπίστοις అనే పదం అవిశ్వాసంతో పాటు నమ్మకంగా ఉండకపోవడాన్ని కూడా సూచించగలదు.
lexical_decisions:
- source_word: δειλοῖς
  choice: పిరికివారికి
  rationale: ఈ పదం సాధారణ భయాన్ని కాక, నైతికంగా తప్పించుకునే పిరికితనాన్ని సూచిస్తుంది; ‘పిరికివారు’ ఆ ప్రతికూల బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀπίστοις
  choice: విశ్వసించనివారికి
  rationale: ఈ తీర్పు జాబితాలో అవిశ్వాసమే ప్రధాన భావంగా కనిపిస్తుంది. అయితే ఈ గ్రీకు పదానికి ‘నమ్మకంగా ఉండనివారు’ అనే భావం కూడా ఉండగలదు; దాన్ని పాదసూచికలో నిలిపాం.
- source_word: ἐβδελυγμένοις
  choice: అసహ్యకరమైనవారికి
  rationale: βδελύσσομαι నుంచి వచ్చిన ఈ రూపం హేయమైన లేదా అపవిత్రమైన స్వభావంతో గుర్తింపబడినవారిని సూచిస్తుంది. ‘అసహ్యకరమైనవారు’ బలమైన నైతిక భావాన్ని ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: φονεῦσι
  choice: హంతకులకు
  rationale: φονεύς ఉద్దేశపూర్వకంగా హత్య చేసేవారిని సూచిస్తుంది; సాధారణంగా చంపేవారనే విస్తృత భావం కాకుండా ‘హంతకులు’ ఖచ్చితంగా సరిపోతుంది.
- source_word: πόρνοις
  choice: లైంగిక దుర్నీతికి పాల్పడేవారికి
  rationale: πόρνος లైంగిక అనైతికతలో నిమగ్నమైనవారిని విస్తృతంగా సూచిస్తుంది. ఈ రూపం ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, భావాన్ని అనవసరంగా కుదించదు.
- source_word: φαρμάκοις
  choice: మంత్రతంత్రాలు చేసేవారికి
  rationale: ప్రకటన గ్రంథ సందర్భంలో ఈ పదం మాయాజాలం లేదా క్షుద్రవిద్య ఆచరించేవారిని సూచిస్తుంది. ‘మాంత్రికులు’ అనే పదానికి వినోద ప్రదర్శకులనే భావం రావచ్చు కాబట్టి వివరణాత్మక రూపం ఎంచుకున్నాం.
- source_word: εἰδωλολάτραις
  choice: విగ్రహారాధకులకు
  rationale: ఈ పదం నేరుగా విగ్రహాలను ఆరాధించేవారిని సూచిస్తుంది; తెలుగు బైబిలు వాడుకలోనూ ఇది స్పష్టమైన, సహజమైన పదం.
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: అబద్ధికులందరికీ
  rationale: ψευδής ఇక్కడ నామవాచకార్థంలో అబద్ధం చెప్పేవారిని లేదా అసత్యంతో గుర్తింపబడినవారిని సూచిస్తుంది. ‘అందరికీ’ πᾶσι యొక్క సమగ్రతను నిలుపుతుంది.
- source_word: τὸ μέρος αὐτῶν
  choice: వారికి దక్కే వంతు
  rationale: μέρος ఇక్కడ వారికి కేటాయించబడిన భాగం లేదా అంతిమ గమ్యాన్ని సూచిస్తుంది. ‘దక్కే వంతు’ సహజమైన తెలుగులో ఆ భావాన్ని అందిస్తుంది.
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: అగ్నితోనూ గంధకంతోనూ మండే సరస్సులో
  rationale: καιομένῃ సరస్సును ‘మండే’దిగా వర్ణిస్తుంది; θείονకు ఆధునిక, ఖచ్చితమైన తెలుగు పదం ‘గంధకం.’ జతగా ఉన్న అగ్ని, గంధకం రెండింటినీ ‘తోనూ’ రూపంతో నిలిపాం.
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: అదే రెండవ మరణం
  rationale: ఈ వివరణ ముందున్న అగ్ని-గంధకాల సరస్సును రెండవ మరణంగా గుర్తిస్తుంది. ‘అదే’ సంక్షిప్తంగా, సహజంగా ఆ గుర్తింపును తెలుపుతుంది.
theological_decisions:
- issue: తీర్పు జాబితాలో ἄπιστος పదార్థం
  choice: విశ్వసించనివారు
  alternative: నమ్మకంగా ఉండనివారు / నమ్మకద్రోహులు
  rationale: సందర్భంలో విశ్వాసం లేకపోవడం ప్రధాన భావంగా కనిపించినా, ἄπιστος విశ్వసనీయత లేకపోవడం లేదా నమ్మకద్రోహాన్ని కూడా సూచించగలదు. ప్రధాన పాఠ్యంలో ఒక సహజ అర్థాన్ని ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా భావసందిగ్ధతను నిలిపాం.
- issue: తీర్పును సూచించే τὸ μέρος αὐτῶν
  choice: వారికి దక్కే వంతు
  alternative: వారి భాగం
  rationale: ఈ మాట వారి అంతిమ గమ్యాన్ని కేటాయించబడిన వంతుగా చిత్రిస్తుంది. శిక్ష స్వభావంపై వాక్యం చెప్పిన దానికంటే అదనపు సిద్ధాంత వివరణను చేర్చకుండా మూల రూపకాన్ని నిలిపాం.
- issue: రెండవ మరణంతో సరస్సు సంబంధం
  choice: అదే రెండవ మరణం
  alternative: అది రెండవ మరణం
  rationale: సంబంధసర్వనామం ముందున్న సరస్సు చిత్రణను రెండవ మరణంగా గుర్తిస్తుంది. దాని స్వరూపాన్ని మరింత సిద్ధాంతపరంగా నిర్వచించకుండా మూలంలోని గుర్తింపును మాత్రమే తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. గ్రీకు జాబితాలోని పునరుక్త καίలను తెలుగులో సహజమైన విరామచిహ్నాలతో ఇచ్చి, చివరి అంశానికి ముందు భావప్రవాహాన్ని కొనసాగించాం. ‘మంత్రతంత్రాలు చేసేవారు’ వంటి స్పష్టమైన పదబంధాలు అపార్థాన్ని తగ్గిస్తాయి; సంప్రదాయ మతపరమైన పదజాలాన్ని అవసరమైన చోట మాత్రమే ఉంచాం.
