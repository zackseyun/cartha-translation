id: REV.21.25
reference: Revelation 21:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ πυλῶνες αὐτῆς οὐ μὴ κλεισθῶσιν ἡμέρας, νὺξ γὰρ οὐκ ἔσται ἐκεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/025.yaml
  text: And its gates will never be shut by day—for there will be no night there—[a][b]
translation:
  language: te
  text: 'దాని ద్వారాలు పగటివేళ ఎన్నటికీ మూయబడవు; ఎందుకంటే అక్కడ రాత్రి ఉండదు.[a][b]


    [a] మరింత అక్షరార్థంగా, “పగటివేళ దాని ద్వారాలు ఎంతమాత్రమూ మూయబడవు.” గ్రీకు మూలంలో బలమైన నిషేధ ప్రయోగం ఉంది.

    [b] ద్వారాలు మూయబడకపోవడానికి చెప్పబడిన కారణం: “అక్కడ రాత్రి ఉండదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “పగటివేళ దాని ద్వారాలు ఎంతమాత్రమూ మూయబడవు.” గ్రీకు మూలంలో బలమైన నిషేధ ప్రయోగం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: 'ద్వారాలు మూయబడకపోవడానికి చెప్పబడిన కారణం: “అక్కడ రాత్రి ఉండదు.”'
    reason: cross_reference
lexical_decisions:
- source_word: πυλῶνες
  choice: ద్వారాలు
  rationale: నగర సందర్భంలో ఈ పదం నగర ద్వారాలను లేదా ద్వార సముదాయాలను సూచిస్తుంది. ‘ద్వారాలు’ సహజంగా ఉండి నూతన యెరూషలేము చిత్రణను నిలుపుతుంది.
- source_word: οὐ μὴ κλεισθῶσιν
  choice: ఎన్నటికీ మూయబడవు
  rationale: οὐ μή తో కూడిన aorist subjunctive బలమైన భవిష్యత్ నిషేధాన్ని వ్యక్తం చేస్తుంది. ‘ఎన్నటికీ ... మూయబడవు’ ఆ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἡμέρας
  choice: పగటివేళ
  rationale: ఇక్కడ genitive కాలవాచక క్రియావిశేషణంగా పనిచేస్తుంది. ‘పగటివేళ’ తరువాతి ‘రాత్రి’తో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: ఎందుకంటే అక్కడ రాత్రి ఉండదు
  rationale: γάρ ముందున్న ప్రకటనకు కారణాన్ని తెలియజేస్తుంది; ἔσται యొక్క ఉనికి భావాన్ని ‘ఉండదు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: దాని ద్వారాలు
  rationale: καί ఈ వాక్యాన్ని ముందటి నగర వర్ణనతో కలుపుతుంది. తెలుగులో వచన ప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే అనుసంధానం నిలుస్తుంది.
- source_word: αὐτῆς
  choice: దాని
  rationale: గ్రీకులో స్త్రీలింగ సర్వనామం వ్యాకరణపరంగా నగరాన్ని సూచిస్తుంది. తెలుగులో నగరానికి సహజమైన నిర్జీవ సూచన ‘దాని’; ఇది అవసరం లేని వ్యక్తీకరణను జోడించదు.
theological_decisions:
- issue: నూతన యెరూషలేమును ఎంతవరకు వ్యక్తిగా చూపాలి
  choice: ‘దాని ద్వారాలు’ అని అనువదించడం
  alternative: ‘ఆమె ద్వారాలు’ అని వ్యక్తీకరించడం
  rationale: గ్రీకు స్త్రీలింగ సర్వనామం నగరాన్ని సూచించే నామవాచకంతో వ్యాకరణపరంగా ఏకీభవిస్తుంది. ఈ వాక్యంలో ప్రధాన భావం నగరం ఎల్లప్పుడూ తెరిచి ఉండడం, అక్కడ రాత్రి లేకపోవడం; వధువు రూపకం ఇక్కడ ప్రత్యేకంగా ముందుకు తేవబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. బలమైన నిషేధాన్ని ‘ఎన్నటికీ’తో, γάρ తెలిపే కారణ సంబంధాన్ని ‘ఎందుకంటే’తో స్పష్టంగా వ్యక్తం చేశాం.
