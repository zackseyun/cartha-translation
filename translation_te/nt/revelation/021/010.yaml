id: REV.21.10
reference: Revelation 21:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: te
  text: అతడు ఆత్మలో[a] నన్ను విశాలమైన, ఎత్తైన ఒక పర్వతం మీదికి తీసుకువెళ్లి, పరలోకం నుండి దేవుని నుండి దిగివస్తున్న పవిత్ర నగరమైన యెరూషలేమును నాకు చూపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆత్మిక స్థితిలో.’ ఈ గ్రీకు పదబంధం దర్శనస్థితిని సూచించవచ్చు; ప్రకటన గ్రంథంలో ఇది సాధారణంగా ప్రవచన దర్శనాన్ని పరిచయం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: తీసుకువెళ్లి
  rationale: దర్శన సందర్భంలో ఒక స్థలం నుండి మరొక వీక్షణస్థలానికి తరలించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం ‘తీసుకొని’ కంటే గమనాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐν πνεύματι
  choice: ఆత్మలో
  rationale: ప్రకటన గ్రంథంలో ప్రవచన దర్శనాన్ని పరిచయం చేసే పునరావృత సూత్రప్రయోగాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘ఆత్మ’ పరిశుద్ధాత్మను సూచించవచ్చు, అయితే గ్రీకు పదబంధంలోని భావసందిగ్ధతను పాదటీపు ద్వారా కాపాడుతుంది.
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: గొప్పదైన, ఎత్తైన ఒక పర్వతం మీదికి
  rationale: ἐπίతో కూడిన కర్మవిభక్తి సూచించే ‘మీదికి’ అనే గమనాన్ని, అలాగే μέγα మరియు ὑψηλόν అనే రెండు వేర్వేరు విశేషణాలను నిలుపుతుంది.
- source_word: ἔδειξέν μοι
  choice: నాకు చూపించాడు
  rationale: అదనపు వ్యాఖ్యానార్థం చేర్చకుండా δείκνυμι యొక్క సాధారణ అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: τὴν πόλιν τὴν ἁγίαν Ἰερουσαλήμ
  choice: పవిత్ర నగరమైన యెరూషలేమును
  rationale: గ్రీకు అపోసిషనల్ నిర్మాణాన్ని సహజమైన తెలుగులో తెలియజేస్తూ నగరం, పవిత్రత, యెరూషలేము అనే గుర్తింపులను కాపాడుతుంది.
- source_word: καταβαίνουσαν
  choice: దిగివస్తున్న
  rationale: వర్తమాన కృదంతం చిత్రించే కొనసాగుతున్న అవరోహణ క్రియను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: ἐκ సూచించే ఉద్భవస్థానాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘పరలోకం లోపలి నుండి’ అనడం అవసరానికి మించిన విస్తరణ అవుతుంది.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: దేవుని దగ్గర నుండి
  rationale: ἀπό సూచించే మూలాన్ని, ముందున్న ‘పరలోకం నుండి’తో భేదం కనిపించేలా సహజమైన తెలుగులో అందిస్తుంది; ‘దేవుని సన్నిధి నుండి’ అనే అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: ἐν πνεύματι లో ‘ఆత్మ’ యొక్క సూచన
  choice: ముఖ్య పాఠ్యంలో ‘ఆత్మలో’ అని ఉంచడం
  alternative: ‘ఒక ఆత్మిక దర్శనస్థితిలో’ లేదా ‘నా ఆత్మలో’
  rationale: ఈ పదబంధం పరిశుద్ధాత్మ కార్యాన్ని సూచించే అవకాశమున్నప్పటికీ, గ్రీకు రూపం స్వయంగా దర్శనస్థితి అనే భావాన్నీ అనుమతిస్తుంది. అందువల్ల ముఖ్య పాఠ్యం theological tensionను పరిష్కరించకుండా ఉంచి, ప్రత్యామ్నాయాన్ని పాదటీపులో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండు ‘నుండి’ సంబంధాలను నిలుపుతూ, ‘దేవుని దగ్గర నుండి’ అని సహజంగా భేదపరిచాం.
