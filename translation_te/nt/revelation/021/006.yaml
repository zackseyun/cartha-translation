id: REV.21.6
reference: Revelation 21:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: te
  text: 'ఆయన నాతో ఇలా అన్నాడు: “ఇవి నెరవేరాయి.[a] నేనే అల్ఫాను, ఓమెగాను; ఆదిని, అంతాన్ని. దాహంతో ఉన్నవానికి జీవజలపు ఊట నుండి ఉచితంగా[b] ఇస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'సంప్రదాయంగా, “అది పూర్తయింది” అని కూడా అనువదిస్తారు. అయితే గ్రీకు క్రియ బహువచనంలో ఉంది: “అవి సంభవించాయి” లేదా “ఇవి నెరవేరాయి.”'
    reason: alternative_reading
  - marker: b
    text: లేదా “ఏ ధర లేకుండా,” “బహుమతిగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γέγοναν
  choice: ఇవి నెరవేరాయి
  rationale: గ్రీకు క్రియ పరిపూర్ణకాల బహువచనంలో ఉంది. కాబట్టి సంప్రదాయ ఏకవచన రూపమైన ‘అది పూర్తయింది’ అని కాకుండా, ప్రకటించబడిన సంగతులు వాస్తవంగా నెరవేరాయని తెలిపే బహువచనాన్ని నిలిపింది.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: అల్ఫాను, ఓమెగాను
  rationale: ప్రకటన గ్రంథంలో స్థిరపడిన ప్రతీకాత్మక గ్రీకు అక్షరనామాలను నిలిపింది; వెంటనే వచ్చే ‘ఆది, అంతం’ వాటి భావాన్ని వివరిస్తుంది.
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: ఆదిని, అంతాన్ని
  rationale: కాలారంభం–ముగింపు భావంతో పాటు మూలం–లక్ష్యం అనే అంతర్భావాన్ని అతిగా వివరణ చేయకుండా నిలిపే సహజ తెలుగు జంట.
- source_word: τῷ διψῶντι
  choice: దాహంతో ఉన్నవానికి
  rationale: దాహం కలిగిన వ్యక్తిని సూచించే ఏకవచన substantival participleను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δώσω
  choice: ఇస్తాను
  rationale: సరళమైన భవిష్య వాగ్దానాన్ని నేరుగా అందిస్తుంది.
- source_word: ἐκ τῆς πηγῆς
  choice: ఊట నుండి
  rationale: πηγή అనేది సహజంగా పొంగే నీటి ఊటను సూచిస్తుంది; జీవాన్నిచ్చే నీటి చిత్రణకు ‘ఊట’ స్పష్టమైన ఆధునిక పదం.
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: జీవజలపు
  rationale: స్థిరమైన బైబిలు చిత్రణను సంక్షిప్తమైన తెలుగు సమాసంలో నిలిపి, జీవాన్నిచ్చే నీరు అనే సంబంధాన్ని కాపాడుతుంది.
- source_word: δωρεάν
  choice: ఉచితంగా
  rationale: ధర లేకుండా, ప్రతిఫలం ఆశించకుండా ఇవ్వబడుతుందనే క్రియావిశేషణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Γέγοναν అనే దైవిక ప్రకటనలోని బహువచనాన్ని ఎలా అనువదించాలి
  choice: ఇవి నెరవేరాయి
  alternative: అది పూర్తయింది
  rationale: కొత్త సృష్టికి సంబంధించిన ప్రకటిత వాస్తవాలు నెరవేరినట్లు సందర్భం సూచిస్తుంది. గ్రీకు బహువచనాన్ని నిలపడం ద్వారా సంప్రదాయ ఏకవచన సూత్రానికి వచనాన్ని సర్దుబాటు చేయలేదు.
- issue: అల్ఫా–ఓమెగా అనే దైవిక బిరుదు చిత్రణ
  choice: అల్ఫాను, ఓమెగాను
  alternative: మొదటి అక్షరాన్ని, చివరి అక్షరాన్ని
  rationale: గ్రీకు అక్షరనామాలను నిలపడం ప్రకటన గ్రంథంలోని ప్రతీకాత్మక మరియు అంతర్గ్రంథ సంబంధాలను కాపాడుతుంది; ‘ఆది, అంతం’ దాని భావాన్ని వెంటనే తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. దైవిక స్వప్రకటనలోని ἐγώ ఉద్ఘాటనను ‘నేనే’తో నిలిపింది. మూలంలో ప్రత్యక్ష కర్మ సూచ్యంగా ఉండటంతో ‘ఊట నుండి … ఇస్తాను’ అనే సంక్షిప్త నిర్మాణాన్ని అలాగే ఉంచింది.
