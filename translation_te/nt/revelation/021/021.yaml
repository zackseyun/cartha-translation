id: REV.21.21
reference: Revelation 21:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: te
  text: ఆ పన్నెండు ద్వారాలు పన్నెండు ముత్యాలు; ఒక్కొక్క ద్వారం ఒక్క ముత్యంతో చేయబడింది. నగరపు వీధి పారదర్శకమైన గాజులా ఉన్న స్వచ్ఛమైన బంగారం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నగరపు విశాల వీధి”; లేదా “నగరపు కూడలి.”
    reason: πλατεῖα అనే పదం విశాల వీధిని లేదా బహిరంగ కూడలి/ప్రాంగణాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: πυλῶνες
  choice: ద్వారాలు
  rationale: కొత్త యెరూషలేము నిర్మాణ వర్ణనలో ప్రవేశ ద్వారాలను సూచించే సహజమైన, స్థిరమైన తెలుగు పదం.
- source_word: μαργαρῖται / μαργαρίτου
  choice: ముత్యాలు / ముత్యం
  rationale: బహువచనం తరువాత ఏకవచనం వచ్చే మూల నిర్మాణాన్ని నిలిపి, ప్రతి ద్వారం ఒక్క ముత్యంతో సంబంధించిందనే చిత్రాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἀνὰ εἷς ἕκαστος
  choice: ఒక్కొక్క
  rationale: ఒక్కో ద్వారానికి ఒక్కటి చొప్పున అనే పంపిణీ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: ఒక్క ముత్యంతో చేయబడింది
  rationale: ἐξ తెలిపే పదార్థ/మూల భావాన్ని సందర్భానుసారంగా స్పష్టం చేస్తూ, ἑνός లోని ‘ఒక్క’ అనే ఉద్ఘాటనను కాపాడుతుంది.
- source_word: πλατεῖα
  choice: వీధి
  rationale: విశాల వీధి లేదా బహిరంగ ప్రజామార్గాన్ని సూచించగల పదం; ప్రధాన పాఠ్యంలో ‘వీధి’ సహజంగా ఉండగా ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నిలిపాం.
- source_word: χρυσίον καθαρὸν
  choice: స్వచ్ఛమైన బంగారం
  rationale: బంగారపు కల్తీలేని స్వభావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὡς ὕαλος διαυγής
  choice: పారదర్శకమైన గాజులా
  rationale: διαυγής లోని దాని గుండా స్పష్టంగా కనిపించే గుణాన్ని ‘పారదర్శకమైన’ నేరుగా తెలియజేస్తుంది; ὡς లోని ఉపమానాన్ని కాపాడుతుంది.
theological_decisions:
- issue: πλατεῖα సూచించే నగర మార్గ స్వరూపం
  choice: ఏకవచన ‘నగరపు వీధి’
  alternative: ‘నగరపు విశాల వీధి’ లేదా ‘నగరపు కూడలి/బహిరంగ ప్రాంగణం’
  rationale: దర్శనంలోని నగర నిర్మాణాన్ని అతిగా నిర్దిష్టం చేయకుండా సాధారణ అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, నిజమైన పదార్థ విస్తృతిని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని పన్నెండు–పన్నెండు, ఏకవచన ముత్యం, గాజువంటి పారదర్శక బంగారం అనే దర్శనాత్మక చిత్రణను నిలిపాం.
