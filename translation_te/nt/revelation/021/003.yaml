revisions:
- from: 'సింహాసనం నుండి ఒక గొప్ప స్వరం ఇలా చెప్పడం నేను విన్నాను: “ఇదిగో, దేవుని నివాసస్థలం[a] మనుషుల మధ్య[b] ఉంది. ఆయన వారితో నివసిస్తాడు[c]. వారు ఆయన ప్రజాసమూహాలుగా[d] ఉంటారు. దేవుడు తానే వారితో ఉంటాడు.”'
  to: 'సింహాసనం నుండి ఒక బిగ్గర స్వరం ఇలా చెప్పడం నేను విన్నాను: “ఇదిగో, దేవుని నివాసస్థలం[a] మనుషులతో[b] ఉంది. ఆయన వారితో నివసిస్తాడు[c]. వారు ఆయనకు చెందిన ప్రజలుగా[d] ఉంటారు. దేవుడు తానే వారితో ఉంటాడు.”'
  rationale: The revision corrects the voice idiom, renders μετά more directly, improves Telugu fluency for the plural covenant formula, and refines the σκηνή footnote without reducing the tabernacle imagery or imposing a theological interpretation.
