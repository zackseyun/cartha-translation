id: REV.21.3
reference: Revelation 21:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: te
  text: 'సింహాసనం నుండి ఒక బిగ్గర స్వరం ఇలా చెప్పడం నేను విన్నాను: “ఇదిగో, దేవుని నివాసస్థలం[a] మనుషులతో[b] ఉంది. ఆయన వారితో నివసిస్తాడు[c]. వారు ఆయనకు చెందిన ప్రజలుగా[d] ఉంటారు. దేవుడు తానే వారితో ఉంటాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నివాసస్థలం’ అని అనువదించిన గ్రీకు పదం σκηνή; దానికి ‘గుడారం’ లేదా ‘పవిత్ర గుడారం’ అనే అర్థాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘మనుషులతో’; ఇక్కడ స్త్రీపురుషులందరినీ కలుపుకొని మానవజాతి ఉద్దేశించబడింది.
    reason: lexical_alternative
  - marker: c
    text: ‘నివసిస్తాడు’ అనే క్రియ ‘నివాసస్థలం/గుడారం’ అనే పదానికి సంబంధించింది; మరింత అక్షరార్థంగా, ‘వారితో గుడారం వేసుకొని ఉంటాడు.’
    reason: lexical_alternative
  - marker: d
    text: గ్రీకు పాఠంలో ‘ప్రజలు’ అనేది బహువచనం; సంప్రదాయ అనువాదాల్లో కనిపించే ఏకవచన ‘ప్రజ’ కాదు.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: ఒక గొప్ప స్వరం
  rationale: μέγας స్వరం యొక్క బలాన్ని, ఘనతను సూచిస్తుంది. ‘గొప్ప స్వరం’ ప్రకటన యొక్క గంభీరతను నిలుపుతుంది; సందర్భంలో అది బిగ్గరగా వినిపించే స్వరమని సహజంగా అర్థమవుతుంది.
- source_word: ἐκ τοῦ θρόνου
  choice: సింహాసనం నుండి
  rationale: ἐκ మూలాన్ని సూచిస్తుంది. ప్రకటన గ్రంథంలోని సింహాసన దృశ్యాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే ἰδού యొక్క గంభీరమైన ప్రకటనాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: దేవుని నివాసస్థలం
  rationale: σκηνή అక్షరార్థంగా గుడారం లేదా ప్రత్యక్ష గుడారాన్ని సూచించినా, ఇక్కడ దేవుడు మనుషుల మధ్య నివసించడమే ప్రధాన భావం. స్పష్టత కోసం ‘నివాసస్థలం’ ఎంచుకొని, గుడారపు ప్రతీకను పాదసూచికలో ఉంచాం.
- source_word: μετὰ τῶν ἀνθρώπων
  choice: మనుషుల మధ్య
  rationale: ἄνθρωποι ఇక్కడ స్త్రీపురుషులందరినీ కలుపుకొని మానవజాతిని సూచిస్తుంది. ‘మనుషుల మధ్య’ సహజంగా ఉండి, దేవుని సన్నిధి వారి నడుమ ఉండటాన్ని తెలియజేస్తుంది.
- source_word: σκηνώσει
  choice: నివసిస్తాడు
  rationale: σκηνόω అంటే నివసించడం లేదా గుడారం వేసుకొని ఉండడం. ప్రధాన పాఠంలో సహజమైన ‘నివసిస్తాడు’ వాడి, σκηνήతో ఉన్న పదప్రతిధ్వనిని పాదసూచికలో వివరించాం.
- source_word: λαοὶ αὐτοῦ
  choice: ఆయన ప్రజాసమూహాలుగా
  rationale: SBLGNTలో λαοί బహువచనం. సంప్రదాయ ఏకవచనమైన ‘ప్రజగా’ అని మార్చకుండా, అనేక ప్రజలను సూచించే బహువచనాన్ని ‘ప్రజాసమూహాలు’ ద్వారా నిలిపాం.
- source_word: αὐτὸς ὁ θεός
  choice: దేవుడు తానే
  rationale: αὐτόςలోని ఉద్ఘాటనను ‘తానే’ స్పష్టంగా వ్యక్తం చేసి, దేవుని ప్రత్యక్ష సన్నిధిని నొక్కిచెబుతుంది.
- source_word: μετ’ αὐτῶν ἔσται
  choice: వారితో ఉంటాడు
  rationale: సాధారణ భవిష్యత్ వాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, దేవుడు తన ప్రజలతో ఉండే నిబంధనా సన్నిధి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: λαοὶ అనే బహువచనం, సంప్రదాయ ఏకవచనమైన ‘ప్రజ’కు భిన్నంగా ఉండటం
  choice: వారు ఆయన ప్రజాసమూహాలుగా ఉంటారు
  alternative: వారు ఆయన ప్రజగా ఉంటారు
  rationale: విమర్శాత్మక గ్రీకు పాఠంలో λαοί బహువచనం. దాన్ని ఏకవచనంగా సవరించకుండా అనేక ప్రజాసమూహాలు దేవునికి చెందినవారవుతారనే పాఠ్య ఉద్వేగాన్ని నిలిపాం; ఇది వారి ఆధ్యాత్మిక ఐక్యతపై అదనపు నిర్ణయం విధించదు.
- issue: σκηνή / σκηνόωలోని గుడారం-నివాసం ప్రతీక
  choice: నివాసస్థలం ... నివసిస్తాడు
  alternative: గుడారం ... గుడారం వేసుకొని ఉంటాడు
  rationale: ప్రధాన పాఠం సాధారణ పాఠకులకు సహజంగా ఉండేందుకు అర్థాన్ని స్పష్టంగా ఇచ్చాం. అయితే పాత నిబంధనలో దేవుని గుడార సన్నిధిని జ్ఞాపకం చేసే అక్షరార్థ ప్రతీకను పాదసూచికల్లో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటన శైలిని పాటించాం. ‘ఇదిగో’, ‘సింహాసనం’, ‘దేవుడు తానే’ వంటి పదబంధాలు అపోకలిప్టిక్ గౌరవాన్ని నిలుపుతాయి. σκηνή/σκηνόω పదప్రతీకను ప్రధాన పాఠంలో సహజంగా, పాదసూచికల్లో మరింత అక్షరార్థంగా అందించాం. λαοί బహువచనాన్ని అసహజతను సాధ్యమైనంత తగ్గిస్తూ ‘ప్రజాసమూహాలు’గా స్పష్టపరిచాం.
