id: REV.21.15
reference: Revelation 21:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: te
  text: నాతో మాట్లాడుతున్నవాని దగ్గర పట్టణాన్ని, దాని ద్వారాలను, దాని ప్రాకారాన్ని కొలవడానికి ఒక బంగారు కొలకర్ర[a] ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బంగారు కొలిచే రెల్లు.’ గ్రీకులో κάλαμος అనే పదానికి అక్షరార్థం ‘రెల్లు’; ఇక్కడ అది కొలవడానికి ఉపయోగించే కర్రను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: నాతో మాట్లాడుతున్నవాడు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న వివరణాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; సందర్భం ఆధారంగా ‘దూత’ అని మూలంలో లేని పదాన్ని చేర్చదు.
- source_word: εἶχεν
  choice: దగ్గర ... ఉంది
  rationale: ἔχω యొక్క అపూర్ణ భూతకాల రూపం ఇక్కడ ఒక సాధనం అతని వద్ద ఉండటాన్ని సూచిస్తుంది. తెలుగులో ‘దగ్గర ఉంది’ సహజంగా ఆ స్వాధీన భావాన్ని తెలియజేస్తుంది; ‘పట్టుకొని ఉన్నాడు’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: బంగారు కొలకర్ర
  rationale: μέτρον మరియు κάλαμος కలసి కొలిచే సాధనాన్ని సూచిస్తున్నాయి. ‘కొలకర్ర’ ఆధునిక పాఠకులకు దాని పనిని స్పష్టంగా తెలియజేస్తుంది; κάλαμος యొక్క అక్షరార్థమైన ‘రెల్లు’ను పాదసూచికలో నిలుపుతుంది.
- source_word: ἵνα μετρήσῃ
  choice: కొలవడానికి
  rationale: ἵνα తో కూడిన సంభావనార్థక క్రియ ఉద్దేశాన్ని వ్యక్తం చేస్తుంది; తెలుగులో ‘కొలవడానికి’ ఆ ప్రయోజన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τὴν πόλιν
  choice: పట్టణాన్ని
  rationale: πόλις కు సందర్భానుకూలమైన సాధారణ తెలుగు పదం; ‘కొత్త యెరూషలేము’ అని వివరణను మూలపాఠ్యంలోకి చేర్చదు.
- source_word: τοὺς πυλῶνας αὐτῆς
  choice: దాని ద్వారాలను
  rationale: πυλών పెద్ద ద్వారం లేదా ప్రవేశద్వారాన్ని సూచించగలదు; ఇక్కడ ‘ద్వారాలు’ సహజమైన, సరిపడిన నిర్మాణ సంబంధ పదం.
- source_word: τὸ τεῖχος αὐτῆς
  choice: దాని ప్రాకారాన్ని
  rationale: τεῖχος పట్టణాన్ని చుట్టిన రక్షణ గోడను సూచిస్తుంది. ‘ప్రాకారం’ సాధారణ గోడకన్నా పట్టణపు చుట్టుగోడ భావాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: మాట్లాడుతున్న వ్యక్తిని స్పష్టంగా దూతగా గుర్తించాలా?
  choice: ‘నాతో మాట్లాడుతున్నవాడు’ అనే మూలపాఠ్య వివరణనే ఉంచడం
  alternative: ‘నాతో మాట్లాడుతున్న దూత’
  rationale: విస్తృత సందర్భంలో అతడు దూతలలో ఒకడని తెలిసినా, ఈ వచనంలో గ్రీకు పాఠ్యం ‘దూత’ అనే నామవాచకాన్ని ఉపయోగించదు. అందువల్ల మూలపాఠ్యంలో లేని స్పష్టీకరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ప్రాకారం’ పట్టణపు చుట్టుగోడను సూచించే సుపరిచితమైన నిర్మాణ పదంగా వాడబడింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
