  source_fidelity: The draft accurately renders the speaker without adding ‘angel,’ preserves the purpose clause, and correctly represents the city, its gates, and its wall. However, εἶχεν is imperfect past tense (‘had’), whereas ‘ఉంది’ is present tense. The Telugu should use a past narrative form.
