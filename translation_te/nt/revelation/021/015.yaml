  terminology: ‘కొలకర్ర’ appropriately conveys the measuring implement, while the footnote preserves κάλαμος (‘reed’). ‘ప్రాకారం’ is a suitable rendering of τεῖχος as the city’s enclosing wall. No theological or contextual identification has been added.
