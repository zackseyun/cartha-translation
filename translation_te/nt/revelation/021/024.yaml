  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: te
  text: జాతులు దాని వెలుగు ద్వారా[a] నడుస్తారు; భూమి రాజులు తమ మహిమను[b] దానిలోకి[c] తీసుకొస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాని వెలుగులో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తమ వైభవాన్ని’ లేదా ‘తమ ఘనతను.’
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు మూలంలో ‘ఆమెలోకి’ అనే స్త్రీలింగ రూపం ఉంది; అది వ్యాకరణపరంగా స్త్రీలింగమైన ‘నగరం’ అనే పదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: నడుస్తారు
  rationale: క్రియలోని ప్రత్యక్షమైన ‘నడచుట’ అనే దృశ్యాన్ని నిలుపుతుంది; ఈ సందర్భంలో వెలుగు ఆధారంగా సాగే జనాల చిత్రణకు సహజంగా సరిపోతుంది.
- source_word: τὰ ἔθνη
  choice: జనాలు
  rationale: ἔθνη ఇక్కడ అన్యజనులను మాత్రమే కాక వివిధ ప్రజాసమూహాలను సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘జనాలు’ సహజంగా ఉండి ఆ సమష్టి భావాన్ని అందిస్తుంది.
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: దాని వెలుగులో
  rationale: διά + షష్ఠీ విభక్తి వెలుగు సాధనంగా లేదా మాధ్యమంగా పనిచేస్తున్నదని సూచిస్తుంది. ‘దాని వెలుగులో’ తెలుగులో సహజంగా ఉండి, వెలుగు ద్వారా నడవడం అనే భావచిత్రాన్ని నిలుపుతుంది; ‘దాని వెలుగు ద్వారా’ మరింత అక్షరానువాదమైన ప్రత్యామ్నాయం.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: భూమి రాజులు
  rationale: ప్రకటన గ్రంథంలోని అపోకలిప్టిక్ ప్రయోగానికి అనుగుణంగా భూమిమీదనున్న పాలకులను సూచిస్తుంది.
- source_word: φέρουσιν
  choice: తీసుకొస్తారు
  rationale: గమ్యస్థానమైన నగరంలోకి దేనినైనా తీసుకురావడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. దర్శన సందర్భంలోని భవిష్యత్ భావానికి అనుగుణంగా భవిష్యత్ రూపం వాడబడింది.
- source_word: τὴν δόξαν αὐτῶν
  choice: తమ మహిమను
  rationale: δόξα లోని మహిమ, వైభవం, ఘనత అనే అర్థవిస్తృతిని ‘మహిమ’ నిలుపుతుంది; ‘తమ’ రాజులకే తిరిగి సూచించే సహజ తెలుగు రూపం.
- source_word: εἰς αὐτήν
  choice: దానిలోకి
  rationale: εἰς లోని లోపలికి అనే దిశాభావాన్ని నిలుపుతుంది. సర్వనామం నగరాన్ని సూచిస్తున్నందున తెలుగులో సహజమైన ‘దాని’ రూపం వాడబడింది.
theological_decisions:
- issue: కొత్త యెరూషలేమును సూచించే స్త్రీలింగ సర్వనామం
  choice: నగరాన్ని సూచిస్తూ ‘దాని/దానిలోకి’ అని అనువదించడం
  alternative: వధువు రూపకాన్ని ముందుకు తెస్తూ ‘ఆమె/ఆమెలోకి’ అని అనువదించడం
  rationale: గ్రీకులో πόλις (‘నగరం’) వ్యాకరణపరంగా స్త్రీలింగం కావడంతో αὐτῆς/αὐτήν స్త్రీలింగంలో ఉన్నాయి. ఈ వాక్యంలో వెలుగు, నడక, నగరంలోకి తీసుకురావడం అనే ప్రాదేశిక నగర చిత్రణ ప్రధానంగా ఉంది. కాబట్టి తెలుగులో ‘దాని/దానిలోకి’ సహజం; అయినా వధువు-నగరం వ్యక్తీకరణను పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నడుస్తారు,’ ‘భూమి రాజులు,’ ‘మహిమ’ అనే పదాలు ప్రకటన గ్రంథపు దృశ్యాత్మకతను, బైబిలు ప్రతిధ్వనిని నిలుపుతాయి; పురాతన బహువచన రూపాలు నివారించబడ్డాయి.
