id: REV.21.2
reference: Revelation 21:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: te
  text: దేవుని నుండి పరలోకం నుంచి దిగివస్తున్న పవిత్ర నగరమైన కొత్త యెరూషలేమును నేను చూశాను. అది తన భర్త కోసం అలంకరించబడిన పెండ్లికుమార్తెలా సిద్ధపరచబడి ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλιν τὴν ἁγίαν
  choice: పవిత్ర నగరమైన
  rationale: నగరానికి సంబంధించిన ప్రత్యక్షమైన దృశ్యరూపాన్ని, ἁγίαν లోని దేవునికి ప్రత్యేకించబడిన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Ἰερουσαλὴμ καινὴν
  choice: కొత్త యెరూషలేము
  rationale: Ἰερουσαλήμ పేరును లిప్యంతరీకరించి, καινήν ను వర్ణనాత్మక విశేషణంగా అనువదిస్తుంది; దానిని ప్రత్యేక బిరుదుగా ముందే నిర్ణయించదు.
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: ὁράω యొక్క భూతకాల క్రియను అదనపు విస్తరణ లేకుండా నేరుగా తెలియజేస్తుంది.
- source_word: καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ
  choice: దేవుని దగ్గర నుండి పరలోకంలో నుంచి దిగివస్తున్న
  rationale: καταβαίνουσαν యొక్క కొనసాగుతున్న దృశ్యచలనాన్ని ‘దిగివస్తున్న’గా, ἐκ యొక్క లోపలి నుంచి బయలుదేరే భావాన్ని ‘పరలోకంలో నుంచి’గా, ἀπό యొక్క మూలాన్ని ‘దేవుని దగ్గర నుండి’గా వేరు చేసి చూపుతుంది.
- source_word: ἡτοιμασμένην
  choice: సిద్ధపరచబడి ఉంది
  rationale: పూర్తయిన సిద్ధత ఫలితంగా కొనసాగుతున్న స్థితిని సూచించే perfect passive participle భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὡς νύμφην
  choice: పెండ్లికుమార్తెలా
  rationale: ὡς ఇక్కడ ఉపమానాన్ని సూచిస్తుంది; అనిర్దిష్ట వధువు రూపకాన్ని సహజంగా అందిస్తుంది.
- source_word: κεκοσμημένην τῷ ἀνδρὶ αὐτῆς
  choice: తన భర్త కోసం అలంకరించుకున్న
  rationale: వివాహ సందర్భంలో ἀνήρ కు ‘భర్త’ సహజమైన అర్థం; κοσμέω లోని అలంకరణ భావాన్ని నిలుపుతూ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ప్రతిఫలక రూపాన్ని వాడుతుంది.
theological_decisions:
- issue: ‘కొత్త యెరూషలేము’ను అధికారిక అంత్యకాల బిరుదుగా చూపాలా
  choice: వర్ణనాత్మకంగా ‘కొత్త యెరూషలేము’ అని అనువదించడం
  alternative: ప్రత్యేక బిరుదుగా భావించి ముద్రణా పద్ధతిలో ప్రత్యేకంగా గుర్తించడం
  rationale: గ్రీకులో καινήν అనేది యెరూషలేమును వర్ణించే విశేషణం; తెలుగు లిపిలో ఆంగ్లంలాంటి పెద్ద అక్షర భేదం లేదు కాబట్టి అనువాదం దానిని అధికారిక బిరుదుగా నిర్ణయించదు.
- issue: పెండ్లికుమార్తె రూపకాన్ని సంఘం లేదా గొర్రెపిల్ల భార్యగా స్పష్టీకరించాలా
  choice: వచనంలోని ఉపమానాన్ని మాత్రమే నిలుపడం
  alternative: ‘సంఘమనే పెండ్లికుమార్తె’ లేదా ‘గొర్రెపిల్ల భార్య’ అని వివరణ చేర్చడం
  rationale: ఈ వాక్యం నగరాన్ని పెండ్లికుమార్తెతో పోలుస్తుంది; దాని ప్రతీకాత్మక గుర్తింపును ప్రధాన పాఠ్యంలో విస్తరించడం మూలంలో లేని వ్యాఖ్యానాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన దృశ్యవర్ణన. ‘దేవుని దగ్గర నుండి’ మరియు ‘పరలోకంలో నుంచి’ అనే ప్రయోగాలు ἀπό, ἐκ మధ్యనున్న మూలం/బయలుదేరే స్థలం అనే సూక్ష్మ భేదాన్ని నిలుపుతాయి. మూలంలో పాఠభేదం లేదా తెలుగులో తప్పనిసరి వివరణ అవసరం లేకపోవడంతో పాదటిప్పణులు చేర్చలేదు.
