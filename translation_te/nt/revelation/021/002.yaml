revisions:
- from: దేవుని దగ్గర నుండి పరలోకంలో నుంచి దిగివస్తున్న పవిత్ర నగరమైన కొత్త యెరూషలేమును నేను చూశాను. అది తన భర్త కోసం అలంకరించుకున్న పెండ్లికుమార్తెలా సిద్ధపరచబడి ఉంది.
  to: దేవుని నుండి పరలోకం నుంచి దిగివస్తున్న పవిత్ర నగరమైన కొత్త యెరూషలేమును నేను చూశాను. అది తన భర్త కోసం అలంకరించబడిన పెండ్లికుమార్తెలా సిద్ధపరచబడి ఉంది.
  rationale: 'The revision preserves the Greek sequence of imagery and the distinction between descent out of heaven and origin from God in natural Telugu. It replaces the reflexive bridal adornment with a passive form corresponding to κεκοσμημένην. No footnotes are needed: the verse has no textual issue requiring a Telugu note, and the English audit trail’s capitalization and stylistic alternatives do not require an anchor in Telugu.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:06:18Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the holy city, new Jerusalem, John’s seeing, its descent out of heaven from God, and the bridal comparison. However, “దేవుని దగ్గర నుండి” can suggest physical proximity or ‘from God’s presence’ rather than the plain source expression ἀπὸ τοῦ θεοῦ. More significantly, “అలంకరించుకున్న” is reflexive (‘having adorned herself’), while κεκοσμημένην is passive (‘having been adorned’).
  naturalness: The wording is generally clear and modern. “పరలోకంలో నుంచి” is less idiomatic for ἐκ τοῦ οὐρανοῦ than “పరలోకం నుంచి,” and the revised phrasing keeps both source expressions without sounding overly repetitive.
  terminology: “పవిత్ర నగరం,” “కొత్త యెరూషలేము,” “పరలోకం,” “పెండ్లికుమార్తె,” and “భర్త” are suitable modern-standard Telugu choices. “పెండ్లికుమార్తె” appropriately retains the indefinite bridal simile and does not import an ecclesiological identification.
  issues:
  - severity: medium
    issue: The bride is rendered with a reflexive verb.
    rationale: '“తన భర్త కోసం అలంకరించుకున్న” means that the bride adorned herself. Greek κεκοσμημένην is a perfect passive participle and should be rendered passively: ‘అలంకరించబడిన.’'
  - severity: low
    issue: The expression for the city’s origin is slightly interpretive and less idiomatic.
    rationale: “దేవుని దగ్గర నుండి” may imply location/proximity. The Greek simply says ‘from God’; “దేవుని నుండి” is more direct. “పరలోకంలో నుంచి” is also better expressed as “పరలోకం నుంచి” for movement out of heaven.
  revised_text: దేవుని నుండి పరలోకం నుంచి దిగివస్తున్న పవిత్ర నగరమైన కొత్త యెరూషలేమును నేను చూశాను. అది తన భర్త కోసం అలంకరించబడిన పెండ్లికుమార్తెలా సిద్ధపరచబడి ఉంది.
  revised_footnotes: []
  revision_rationale: 'The revision preserves the Greek sequence of imagery and the distinction between descent out of heaven and origin from God in natural Telugu. It replaces the reflexive bridal adornment with a passive form corresponding to κεκοσμημένην. No footnotes are needed: the verse has no textual issue requiring a Telugu note, and the English audit trail’s capitalization and stylistic alternatives do not require an anchor in Telugu.'
