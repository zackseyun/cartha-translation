id: REV.21.16
reference: Revelation 21:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: te
  text: 'ఆ పట్టణం చతురస్రాకారంగా ఉంది; దాని పొడవు దాని వెడల్పుతో సమానం. అతడు కొలత కర్రతో[c] ఆ పట్టణాన్ని కొలిచాడు: పన్నెండు వేల స్టేడియాలు[a]. దాని పొడవు, వెడల్పు, ఎత్తు సమానంగా ఉన్నాయి[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: స్టేడియం అనేది ప్రాచీన దూర ప్రమాణం. స్టేడియం పొడవును ఎలా లెక్కిస్తామన్నదాన్ని బట్టి, పన్నెండు వేల స్టేడియాలు సుమారు 2,220 కిలోమీటర్లు (1,380 మైళ్లు).
    reason: cultural_note
  - marker: b
    text: మరింత వ్యాఖ్యానాత్మకంగా, ‘ఆ పట్టణం పరిపూర్ణ ఘనాకారంలో ఉంది’ అని చెప్పవచ్చు. గ్రీకు పాఠ్యం నేరుగా దాని పొడవు, వెడల్పు, ఎత్తు సమానమని చెబుతుంది.
    reason: alternative_reading
  - marker: c
    text: లేదా ‘రెల్లుతో.’ గ్రీకు పదానికి ‘రెల్లు’ అనే అర్థం కూడా ఉంది; ఇక్కడ అది కొలిచే సాధనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετράγωνος
  choice: చతురస్రాకారంగా
  rationale: నాలుగు సమాన భుజాలుగల ఆకారాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; నగరానికి సంబంధించిన నిర్మాణ వర్ణనను స్పష్టంగా ఉంచుతుంది.
- source_word: κεῖται
  choice: విస్తరించి ఉంది
  rationale: పట్టణం ఏ ఆకారంలో అమరి ఉందో తెలిపే సందర్భంలో ‘ఉంది’ కంటే స్థల విస్తార భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; అయితే మూలంలోని స్థితి వర్ణనను మించదు.
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: దాని పొడవు దాని వెడల్పుతో సమానం
  rationale: ὅσον తెలిపే పరిమాణ సమానత్వాన్ని నేరుగా, సులభంగా వ్యక్తం చేస్తుంది.
- source_word: ἐμέτρησεν
  choice: కొలిచాడు
  rationale: సందర్భంలో దూతను సూచించే అంతర్నిహిత కర్తతో కూడిన సాధారణ భూతకాల కథన క్రియకు సహజమైన అనువాదం.
- source_word: τῷ καλάμῳ
  choice: కొలత కర్రతో
  rationale: κάλαμος పదానికి ‘రెల్లు’ అనే అర్థం ఉన్నప్పటికీ, ఇక్కడ అది కొలిచే సాధనం; దాని పనిని స్పష్టంగా తెలియజేసే ఆధునిక తెలుగు పదబంధం.
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: పన్నెండు వేల స్టేడియాలు
  rationale: కొలత ఫలితాన్ని సహజమైన తెలుగులో ఇస్తూ, మూలంలోని ప్రాచీన ప్రమాణాన్ని మార్చకుండా నిలుపుతుంది.
- source_word: στάδιος
  choice: స్టేడియాలు
  rationale: ప్రాచీన దూర ప్రమాణానికి పారదర్శకమైన లిప్యంతరీకరణ; ఆధునిక ప్రమాణంగా మార్చడం వల్ల వచ్చే అంచనాను ప్రధాన పాఠ్యంలోకి తీసుకురాదు.
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: దాని పొడవు, వెడల్పు, ఎత్తు సమానంగా ఉన్నాయి
  rationale: మూడు కొలతల సమానత్వాన్ని మూలం చెప్పిన విధంగానే స్పష్టంగా ఉంచుతుంది; ‘ఘనం’ అనే వ్యాఖ్యానాత్మక రేఖాగణిత పదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: ప్రాచీన దూర ప్రమాణాన్ని ప్రధాన పాఠ్యంలో ఉంచాలా, ఆధునిక ప్రమాణంగా మార్చాలా
  choice: ‘పన్నెండు వేల స్టేడియాలు’ అని ప్రాచీన ప్రమాణాన్నే ఉంచడం
  alternative: సుమారు 2,220 కిలోమీటర్లు అని అనువదించడం
  rationale: గ్రీకు మూలం ప్రాచీన ప్రమాణాన్నే ఇస్తుంది. ఒక స్టేడియం ఖచ్చితమైన పొడవుపై లెక్క మారవచ్చు కాబట్టి ఆధునిక సమానాన్ని పాదసూచికలో మాత్రమే ఇవ్వడం మూలానికి మరింత నిబద్ధంగా ఉంటుంది.
- issue: సమానమైన మూడు కొలతలను ఎలా వ్యక్తం చేయాలి
  choice: పొడవు, వెడల్పు, ఎత్తు సమానమని నేరుగా చెప్పడం
  alternative: పట్టణం పరిపూర్ణ ఘనాకారంలో ఉందని చెప్పడం
  rationale: ఘనాకారం అనేది వాక్యంలోని కొలతల నుంచి వచ్చే సహజ నిర్ధారణ అయినా, గ్రీకు పాఠ్యం రేఖాగణిత నామాన్ని వాడకుండా మూడు కొలతల సమానత్వాన్నే చెబుతుంది. అందువల్ల ఆ ఉద్వేగాన్ని ప్రధాన పాఠ్యంలో అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. నిర్మాణ వర్ణనలో స్పష్టత కోసం ‘చతురస్రాకారంగా విస్తరించి ఉంది,’ ‘కొలత కర్ర’ వంటి సహజ పదబంధాలు వాడబడ్డాయి. ప్రధాన పాఠ్యంలో ప్రాచీన ప్రమాణం మరియు మూడు కొలతల సమానత్వం యథాతథంగా నిలుపబడ్డాయి.
