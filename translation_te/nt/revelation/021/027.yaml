review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic exclusion (οὐ μὴ), the distinction between ‘nothing unclean’ and persons who practice detestable things or falsehood, and the sole exception of those written in the Lamb’s book of life. Repeating ‘enter’ in Telugu is a legitimate explicit rendering of the shared Greek verb. The singular masculine ‘చేసేవాడెవడూ,’ however, is unnecessarily gender-restrictive in modern Telugu for the substantival participle ποιῶν.
  naturalness: The wording is generally clear and suitably elevated. Replacing the masculine-singular generic with the inclusive plural ‘చేసేవారెవరూ’ is more natural modern standard Telugu. Explicitly marking the Lamb’s possessive relation also removes a minor syntactic ambiguity.
  terminology: ‘అపవిత్రమైనదేదీ,’ ‘జీవగ్రంథం,’ and ‘గొర్రెపిల్ల’ are appropriate. ‘గొర్రెపిల్లకు చెందిన జీవగ్రంథం’ clearly preserves the possessive genitive τοῦ ἀρνίου without adding ‘names.’
  issues:
  - severity: low
    issue: Masculine-singular generic in ‘అసహ్యమైనదాన్ని గానీ అబద్ధాన్ని గానీ చేసేవాడెవడూ’
    rationale: The Greek substantival participle is grammatically masculine plural and is not limited to male persons. Inclusive plural Telugu better reflects its scope in modern usage.
  - severity: low
    issue: Possessive relation in ‘గొర్రెపిల్ల జీవగ్రంథంలో’ is slightly compressed
    rationale: Though understandable as a biblical compound, ‘గొర్రెపిల్లకు చెందిన జీవగ్రంథంలో’ makes the source genitive (‘the Lamb’s book of life’) explicit and natural.
