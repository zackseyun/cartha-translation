id: REV.21.27
reference: Revelation 21:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: te
  text: అపవిత్రమైనదేదీ దానిలోకి ఎన్నటికీ ప్రవేశించదు[a]; అసహ్యమైనదాన్ని గానీ అబద్ధాన్ని గానీ చేసేవారెవరూ ప్రవేశించరు[b]. కానీ గొర్రెపిల్లకు చెందిన జీవగ్రంథంలో వ్రాయబడినవారు మాత్రమే ప్రవేశిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అపవిత్రమైనదేదీ’ అన్నదానికి ‘సామాన్యమైనదేదీ,’ ‘లౌకికమైనదేదీ’ లేదా ‘మైలపడినదేదీ’ అని కూడా అనువదించవచ్చు (πᾶν κοινόν).
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అసహ్యకార్యాన్ని మరియు అబద్ధాన్ని చేసేవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: ఎన్నటికీ ప్రవేశించదు
  rationale: οὐ μή + aorist subjunctive బలమైన నిరాకరణను సూచిస్తుంది; ఈ తెలుగు ప్రయోగం భవిష్యత్ ప్రవేశాన్ని పూర్తిగా తోసిపుచ్చుతుంది.
- source_word: αὐτὴν
  choice: దానిలోకి
  rationale: ఈ సర్వనామం నూతన యెరూషలేము నగరాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో నగరాన్ని అనవసరంగా వ్యక్తీకరించకుండా సహజంగా ఉంది.
- source_word: πᾶν κοινὸν
  choice: అపవిత్రమైనదేదీ
  rationale: నపుంసక ఏకవచనంలోని πᾶν సమగ్రంగా ‘ఏదీ’ అనే భావాన్ని ఇస్తుంది. యూదుల పవిత్రత సందర్భంలో κοινός సాధారణమైనది అనే అర్థం కంటే అపవిత్రమైనది/మైలపడినది అనే భావాన్ని కలిగిస్తుంది.
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: అసహ్యమైనదాన్ని గానీ అబద్ధాన్ని గానీ చేసేవాడు
  rationale: ποιῶν వ్యక్తిని సూచించే substantival participle; βδέλυγμα నైతిక-ఆరాధనా విరక్తి కలిగించే దానిని, ψεῦδος అబద్ధం లేదా అసత్యాన్ని సూచిస్తాయి. ‘చేసేవాడు’ మూలంలోని ఒకే క్రియకు రెండు కర్మల సంబంధాన్ని నిలుపుతుంది.
- source_word: εἰ μὴ
  choice: మాత్రమే
  rationale: ఇక్కడ εἰ μή నిషేధానికి ఏకైక మినహాయింపును తెలియజేస్తుంది; తెలుగులో ‘మాత్రమే’ ఆ పరిమితిని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ γεγραμμένοι
  choice: వ్రాయబడినవారు
  rationale: perfect passive participle నమోదు చేయబడి ఉన్న స్థితిని సూచిస్తుంది. మూలంలో లేని ‘పేర్లు’ అనే పదాన్ని చేర్చకుండా రూపాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς
  choice: జీవగ్రంథంలో
  rationale: ఇది స్థిరమైన, సంక్షిప్తమైన తెలుగు బైబిలు ప్రయోగం; జీవానికి సంబంధించిన గ్రంథం అనే genitive సంబంధాన్ని నిలుపుతుంది.
- source_word: τοῦ ἀρνίου
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలోని ప్రధాన క్రీస్తు-బిరుదైన ἀρνίον ను గౌరవప్రదంగా, అర్థమయ్యే విధంగా ‘గొర్రెపిల్ల’గా అందిస్తుంది; genitive సంబంధం పదక్రమంలో స్పష్టమవుతుంది.
theological_decisions:
- issue: నూతన యెరూషలేములో ప్రవేశించకుండా మినహాయించబడేవారి పరిధి
  choice: అపవిత్రమైన ఏ వస్తువు/విషయమూ, అలాగే అసహ్యమైనదాన్ని లేదా అబద్ధాన్ని ఆచరించే ఏ వ్యక్తీ ప్రవేశించడని వేర్వేరుగా చూపించడం
  alternative: మొదటి నపుంసక పదబంధాన్ని కూడా వ్యక్తులకే పరిమితం చేయడం
  rationale: గ్రీకు పాఠం నపుంసకమైన πᾶν κοινόν మరియు వ్యక్తిని సూచించే ποιῶν అనే రెండు రూపాలను కలిపి ఉంచుతుంది; అనువాదం ఆ భేదాన్ని కూల్చదు.
- issue: ‘వ్రాయబడినవారు’ అనే మాటలో అంతర్లీన అంశం
  choice: ‘పేర్లు’ అని విస్తరించకుండా ‘వ్రాయబడినవారు’ అని అనువదించడం
  alternative: ‘వారి పేర్లు వ్రాయబడినవారు’
  rationale: గ్రంథ రూపకం పేర్ల నమోదును సూచించినా, ఈ వచనంలోని గ్రీకు పాఠంలో ‘పేర్లు’ అనే పదం లేదు; సమాంతర వచనాల మాటలను ఇక్కడికి దిగుమతి చేయలేదు.
- issue: βδέλυγμα καὶ ψεῦδος మధ్య సంబంధం
  choice: ‘అసహ్యమైనదాన్ని గానీ అబద్ధాన్ని గానీ’
  alternative: ‘అసహ్యమైనదాన్ని మరియు అబద్ధాన్ని’
  rationale: గ్రీకులో καί సమన్వయాన్ని నిలుపుతూనే, నిషేధ వాక్యంలో రెండు స్వతంత్ర దుష్కార్య వర్గాల్లో ఏదైనా వర్తిస్తుందని సహజ తెలుగులో స్పష్టం చేస్తుంది; రెండూ కలిసే చేసినప్పుడే నిషేధం వర్తిస్తుందనే అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. ‘అపవిత్రమైనదేదీ’, ‘ఎన్నటికీ’, ‘మాత్రమే’ వంటి పదాలు బలమైన నిషేధం మరియు ఏకైక మినహాయింపును స్పష్టంగా ఉంచుతాయి. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తుకు అనుగుణమైన పాదసూచిక ఇవ్వబడింది.
