id: REV.21.23
reference: Revelation 21:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: te
  text: ఆ పట్టణానికి వెలుగునివ్వడానికి సూర్యుడు గానీ చంద్రుడు గానీ అవసరం లేదు[a]. ఎందుకంటే దేవుని మహిమ దాన్ని వెలిగించింది; గొర్రెపిల్లే దాని దీపం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిపై ప్రకాశించడానికి.’ గ్రీకు పదబంధం అక్షరార్థంగా ‘దానికోసం/దానిపై ప్రకాశించడానికి’ అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλις
  choice: పట్టణం
  rationale: కొత్త యెరూషలేమును సూచించే సందర్భంలో ఇది సహజమైన, నేరుగా అర్థమయ్యే తెలుగు పదం.
- source_word: οὐ χρείαν ἔχει
  choice: అవసరం లేదు
  rationale: గ్రీకు నుడికారంలోని ‘అవసరం కలిగి లేదు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: సూర్యుడు గానీ చంద్రుడు గానీ
  rationale: రెండు ఖగోళ జ్యోతులనూ సమతూకంగా పేర్కొంటూ, గ్రీకులోని నిరాకరణ జతను సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: దానికి వెలుగునివ్వడానికి
  rationale: φαίνω యొక్క ప్రకాశించే భావాన్నీ, αὐτῇ యొక్క సంబంధాన్నీ సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: δόξα
  choice: మహిమ
  rationale: దైవసంబంధ సందర్భంలో స్థిరపడిన, భావగాంభీర్యాన్ని నిలిపే తెలుగు పదం.
- source_word: ἐφώτισεν
  choice: వెలిగించింది
  rationale: పట్టణాన్ని కాంతితో నింపిన నిర్దిష్ట కార్యాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λύχνος
  choice: దీపం
  rationale: సాధారణ ‘వెలుగు’ లేదా ‘దీపస్తంభం’ కాకుండా, గ్రీకులోని దీపం అనే నిర్దిష్ట రూపకాన్ని కాపాడుతుంది.
- source_word: ἀρνίον
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలో యేసును సూచించే స్థిరమైన క్రీస్తుసంబంధ బిరుదును తెలుగు బైబిలు వాడుకకు అనుగుణంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘దాని దీపం గొర్రెపిల్ల’ అనే రూపక సంబంధం
  choice: గొర్రెపిల్లే దాని దీపం
  alternative: గొర్రెపిల్లే దాని వెలుగు
  rationale: గ్రీకు పాఠం సాధారణ ‘వెలుగు’ పదాన్ని కాక λύχνος (‘దీపం’) అనే పదాన్నే ఉపయోగిస్తుంది. దేవుని మహిమ పట్టణాన్ని వెలిగిస్తుండగా గొర్రెపిల్ల దాని దీపంగా ఉన్నదనే చిత్రణను ఈ అనువాదం నేరుగా నిలుపుతుంది.
- issue: దైవిక ప్రకాశం గురించిన అంత్యకాల చిత్రణ
  choice: పాఠంలో ఉన్న ప్రకటనను వివరణ జోడించకుండా అనువదించడం
  alternative: సృష్టించబడిన వెలుగులన్నిటినీ దేవుడు భర్తీ చేస్తాడని విస్తరించి చెప్పడం
  rationale: పట్టణానికి సూర్యచంద్రుల అవసరం లేదనీ, దేవుని మహిమ దాన్ని వెలిగించిందనీ, గొర్రెపిల్ల దాని దీపమనీ వచనం చెబుతుంది. దాని పరిధిని మించి సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘గొర్రెపిల్లే’లోని ఏకారంతో మూలంలోని విధేయ రూపకానికి సహజమైన తెలుగు ఉద్ఘాటన ఇచ్చింది; కొత్త సిద్ధాంతార్థం జోడించలేదు.
