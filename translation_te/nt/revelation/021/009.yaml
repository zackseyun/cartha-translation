id: REV.21.9
reference: Revelation 21:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: te
  text: అప్పుడు చివరి ఏడు తెగుళ్లతో నిండిన ఏడు పాత్రలను కలిగిన ఏడుగురు దేవదూతలలో ఒకడు వచ్చి నాతో మాట్లాడుతూ ఇలా అన్నాడు,[a] “రా, వధువును—గొర్రెపిల్ల భార్యను—నీకు చూపిస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాతో మాట్లాడాడు.” గ్రీకులో “నాతో” అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ సంధాన భావాన్ని నిలుపుతుంది.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: ఏడుగురు దేవదూతల్లో ఒకడు
  rationale: ἐκ తో ఉన్న భాగార్థక నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: τὰς ἑπτὰ φιάλας
  choice: ఏడు పాత్రలను
  rationale: φιάλη వెడల్పాటి గిన్నె లేదా పాత్రను సూచిస్తుంది; ఆధునిక పాఠకుడికి తప్పుదారి పట్టించే ‘సీసాలు’ కంటే ‘పాత్రలు’ తగినది.
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: చివరి ఏడు తెగుళ్లతో నిండిన
  rationale: γεμόντων యొక్క ‘నిండియున్న’ భావాన్ని, ἐσχάτων యొక్క క్రమపరమైన ‘చివరి’ భావాన్ని, ప్రకటన గ్రంథంలో πληγαίకి సాధారణమైన ‘తెగుళ్లు’ అనే అర్థాన్ని నిలుపుతుంది.
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: నాతో మాట్లాడుతూ … అన్నాడు
  rationale: μετά యొక్క ‘తో’ భావాన్ని నిలుపుతూ, గ్రీకు వర్తమాన కృదంత నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: Δεῦρο
  choice: ఇలా రా!
  rationale: దగ్గరకు రావాలనే ఆహ్వానాత్మక ఆజ్ఞను సహజమైన ఏకవచన తెలుగు సంబోధనలో వ్యక్తం చేస్తుంది.
- source_word: δείξω σοι
  choice: నీకు చూపిస్తాను
  rationale: భవిష్యత్ సూచక క్రియను నేరుగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: τὴν νύμφην
  choice: వధువును
  rationale: వివాహ రూపకాన్ని స్పష్టంగా నిలిపే ప్రామాణిక తెలుగు పదం.
- source_word: τὴν γυναῖκα τοῦ ἀρνίου
  choice: గొర్రెపిల్ల భార్యను
  rationale: వివాహ సందర్భంలో γυνήకి ‘భార్య’ సరైన అర్థం; ἀρνίονకు ప్రకటన గ్రంథంలోని క్రీస్తు బిరుదుగా ‘గొర్రెపిల్ల’ను నిలుపుతుంది.
theological_decisions:
- issue: νύμφην మరియు γυναῖκα మధ్య సంబంధం
  choice: వధువును—గొర్రెపిల్ల భార్యను—
  alternative: గొర్రెపిల్ల వధువైన భార్యను
  rationale: గ్రీకులోని రెండు సమానాధికార నామవాచకాలను విడివిడిగా నిలిపి, ‘వధువు’ మరియు ‘భార్య’ అనే రెండు వివాహ చిత్రాలను ఒకటిగా కుదించకుండా సంరక్షిస్తుంది.
- issue: ἀρνίον అనే క్రీస్తు సంబంధ బిరుదు
  choice: గొర్రెపిల్ల
  alternative: మేషపిల్ల
  rationale: మూలంలోని బలిపశువు మరియు సౌమ్యతకు సంబంధించిన చిత్రాన్ని అనువదిస్తుంది; వచనంలో లేని అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే కథన శైలి. ‘ఇలా రా’ సజీవమైన ఆహ్వానం; ‘వధువును—గొర్రెపిల్ల భార్యను—’ అనే విరామచిహ్న నిర్మాణం గ్రీకు సమానాధికార పదబంధాన్ని స్పష్టంగా నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
