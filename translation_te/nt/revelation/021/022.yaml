  - severity: low
    issue: The final appended phrase is abrupt in Telugu.
    rationale: The Greek itself has an unusual singular clause followed by καὶ τὸ ἀρνίον. Retaining ellipsis is appropriate, but adding ‘అలాగే’ improves readability while preserving the Lamb's inclusion and avoiding a plural verb that would smooth away the source syntax.
