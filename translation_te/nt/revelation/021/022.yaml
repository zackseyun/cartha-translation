id: REV.21.22
reference: Revelation 21:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: te
  text: దానిలో నాకు ఏ దేవాలయమూ కనిపించలేదు.[a] ఎందుకంటే ప్రభువైన దేవుడు, సర్వశక్తిమంతుడు, దాని దేవాలయంగా ఉన్నాడు; అలాగే గొర్రెపిల్ల కూడా.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పవిత్రాలయం.’ గ్రీకు ναός సాధారణంగా ఆలయాన్ని, మరింత ప్రత్యేకంగా దాని పవిత్ర అంతర్భాగాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు వాక్యంలో ‘ఉన్నాడు’ అనే క్రియ ఏకవచనంలో ఉంది; ఆ తరువాత ‘మరియు గొర్రెపిల్ల’ అని జతచేయబడింది. ఇక్కడ గొర్రెపిల్ల కూడా నగరపు దేవాలయమని భావం.
    reason: syntax_note
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: దేవాలయం
  rationale: ναός ప్రత్యేకంగా ఆలయాన్ని, ముఖ్యంగా దాని పవిత్ర అంతర్భాగాన్ని సూచించగలదు. ఇక్కడ భౌతిక ఆలయం లేకపోవడానికి దేవుడూ గొర్రెపిల్లయే నగరపు ఆలయంగా ఉండడం కారణమనే వ్యత్యాసాన్ని ‘దేవాలయం’ సహజంగా నిలుపుతుంది.
- source_word: οὐκ εἶδον
  choice: నాకు ... ఏదీ కనిపించలేదు
  rationale: మొదటి పురుష దర్శన వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, ఆలయం పూర్తిగా లేకపోవడాన్ని ‘ఏదీ’ స్పష్టం చేస్తుంది.
- source_word: ἐν αὐτῇ / αὐτῆς
  choice: దానిలో / దాని
  rationale: ఈ సర్వనామాలు ముందున్న నగరాన్ని సూచిస్తాయి. తెలుగులో వ్యాకరణ లింగాన్ని బలవంతంగా మోపకుండా ‘దాని’ అనే సహజ రూపం మూలార్థాన్ని నిలుపుతుంది.
- source_word: ὁ κύριος, ὁ θεός
  choice: ప్రభువైన దేవుడు
  rationale: κύριος మరియు θεός అనే దైవ బిరుదులను స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: ὁ παντοκράτωρ
  choice: సర్వశక్తిమంతుడు
  rationale: παντοκράτωρ దేవుని సమస్తంపై సార్వభౌమ శక్తిగలవాడిగా సూచిస్తుంది; ప్రకటన గ్రంథ సందర్భంలో ‘సర్వశక్తిమంతుడు’ స్థిరమైన, సహజమైన తెలుగు రూపం.
- source_word: τὸ ἀρνίον
  choice: గొర్రెపిల్ల
  rationale: ప్రకటన గ్రంథంలోని క్రీస్తుకు సంబంధించిన ప్రతీకాత్మక బిరుదును నేరుగా, పరిచితంగా అనువదిస్తుంది.
theological_decisions:
- issue: ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον అనే వాక్య నిర్మాణంలో దేవుడు మరియు గొర్రెపిల్ల సంబంధం
  choice: ‘దాని దేవాలయంగా ఉన్నాడు; గొర్రెపిల్ల కూడా’ అని అనువదించి, దేవుడితో పాటు గొర్రెపిల్ల కూడా నగరపు దేవాలయమని సూచించడం
  alternative: ‘ప్రభువైన దేవుడు, సర్వశక్తిమంతుడు, మరియు గొర్రెపిల్ల దాని దేవాలయంగా ఉన్నారు’ అని బహువచన క్రియతో పూర్తిగా సమన్వయించడం
  rationale: గ్రీకులో ἐστιν ఏకవచనంగా ఉండి, τὸ ἀρνίον ‘మరియు గొర్రెపిల్ల’ అని తరువాత జతచేయబడింది. తెలుగు అనువాదం ఈ క్రమాన్నీ ఏకవచన నిర్మాణాన్నీ సాధ్యమైనంతవరకు నిలుపుతూ, καί యొక్క సమన్వయ బలాన్ని ‘కూడా’ ద్వారా స్పష్టం చేస్తుంది; అంతకుమించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని నగరాన్ని సూచించే సర్వనామాలను సహజమైన లింగనిరపేక్ష తెలుగు రూపాల్లో ఇచ్చాం. చివరి భాగంలోని అసాధారణ గ్రీకు సమన్వయ నిర్మాణాన్ని సున్నితంగా నిలుపుతూ అర్థాన్ని పాదటిప్పణిలో వివరించాం.
