revisions:
- from: దానిలో నాకు దేవాలయం[a] ఏదీ కనిపించలేదు. ఎందుకంటే ప్రభువైన దేవుడు, సర్వశక్తిమంతుడు, దాని దేవాలయంగా ఉన్నాడు; గొర్రెపిల్ల కూడా.[b]
  to: దానిలో నాకు ఏ దేవాలయమూ కనిపించలేదు.[a] ఎందుకంటే ప్రభువైన దేవుడు, సర్వశక్తిమంతుడు, దాని దేవాలయంగా ఉన్నాడు; అలాగే గొర్రెపిల్ల కూడా.[b]
  rationale: The revision makes the negated opening idiomatic in modern Telugu and lightly smooths the final ellipsis. It retains the singular ‘ఉన్నాడు’ and the subsequently appended Lamb, thereby representing the marked Greek construction rather than choosing the interpretively smoother plural ‘ఉన్నారు.’ Footnote markers and their anchors remain valid.
