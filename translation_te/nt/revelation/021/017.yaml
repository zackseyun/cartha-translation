id: REV.21.17
reference: Revelation 21:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: te
  text: అతడు దాని గోడను 144 మూరలు కొలిచాడు; ఈ కొలత మానవుల కొలమానం ప్రకారం, అంటే దూత కొలమానం ప్రకారం ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక మనిషి కొలమానం ప్రకారం, అంటే ఒక దూత కొలమానం ప్రకారం.” దూత మానవులు ఉపయోగించే కొలమానంతో కొలిచాడని, లేదా ఈ సందర్భంలో మానవుల కొలమానం దూత కొలమానంతో సరిపోతుందని గ్రీకు వాక్యం సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: కొలిచాడు
  rationale: μετρέω అనే క్రియకు ఇక్కడ నేరమైన, సహజమైన తెలుగు సమానార్థకం; భూతకాలంలో పూర్తయిన కొలిచే చర్యను తెలియజేస్తుంది.
- source_word: τὸ τεῖχος αὐτῆς
  choice: దాని గోడను
  rationale: τεῖχος పట్టణాన్ని చుట్టిన గోడను సూచిస్తుంది; αὐτῆς ముందున్న పట్టణాన్ని సూచిస్తున్నందున ‘దాని’ సహజంగా ఉంది.
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 144 మూరలు
  rationale: πῆχυς ప్రాచీన మోచేయి-ఆధారిత కొలమానం. దాన్ని ఆధునిక ప్రమాణంలోకి మార్చకుండా తెలుగులో సుపరిచితమైన ‘మూర’తో నిలుపుతూ, చదవడానికి సంఖ్యను అంకెల్లో ఇచ్చాం.
- source_word: μέτρον ἀνθρώπου
  choice: మానవ కొలత ప్రకారం
  rationale: ἄνθρωπος ఇక్కడ పురుషునికి మాత్రమే పరిమితం కాకుండా సాధారణ మానవ అర్థంలో ఉంది. ‘ప్రకారం’ అనే పదం కొలమాన ప్రమాణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὅ ἐστιν ἀγγέλου
  choice: అదే దూత కొలత కూడా
  rationale: గ్రీకులో వదిలివేయబడిన ‘కొలత’ను తెలుగులో స్పష్టత కోసం పునరుక్తి చేశాం. ‘అదే...కూడా’ మానవ కొలతకూ దూత కొలతకూ ఇక్కడ ఉన్న సంబంధాన్ని చూపుతుంది, కాని దాని స్వరూపాన్ని అతిగా వివరిచదు.
theological_decisions:
- issue: μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου అనే సంక్షిప్త వాక్యభాగం యొక్క అర్థం
  choice: కొలత మానవ ప్రమాణం ప్రకారం ఉంది; అదే దూత కొలత కూడా.
  alternative: ఒక మనిషి కొలత ప్రకారం, అంటే ఒక దూత కొలత ప్రకారం.
  rationale: గ్రీకు నిర్మాణం మానవ కొలమానాన్ని దూత వాడాడనే భావానికీ, ఈ సందర్భంలో మానవ-దూత కొలతలు సరిపోతాయనే భావానికీ అవకాశం ఇస్తుంది. ప్రధాన పాఠం సంబంధాన్ని తెలుపుతుంది; దానిని మించిన సిద్ధాంతపరమైన వివరణను విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ప్రాచీన కొలమానాన్ని ‘మూర’గా నిలిపి, గ్రీకు వాక్యంలోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో సంరక్షించాం.
