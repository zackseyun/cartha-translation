    issue: “చెక్కబడి” narrows the sense of ἐπιγεγραμμένα.
    rationale: The Greek indicates that the names were inscribed/written on the gates, but does not require that they were carved. “లిఖించబడి” is accurate without adding a material method.
  - severity: low
    issue: The footnote alternative is not a complete replacement for the marked possessive phrase in context.
    rationale: “ఇశ్రాయేలు సంతానం” by itself does not naturally replace “ఇశ్రాయేలు కుమారుల పన్నెండు గోత్రాల.” A full alternative preserves the intended traditional designation and syntax.
