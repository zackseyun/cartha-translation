id: REV.21.12
reference: Revelation 21:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: te
  text: దానికి గొప్పదైన, ఎత్తైన ప్రాకారం ఉంది; పన్నెండు ద్వారాలు ఉన్నాయి. ఆ ద్వారాల దగ్గర పన్నెండు మంది దేవదూతలు ఉన్నారు. వాటిమీద ఇశ్రాయేలు కుమారుల[a] పన్నెండు గోత్రాల పేర్లు లిఖించబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయబద్ధంగా, “ఇశ్రాయేలు సంతానపు పన్నెండు గోత్రాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσα
  choice: దానికి … ఉంది / ఉన్నాయి
  rationale: ఈ స్త్రీలింగ వర్తమాన కృదంతం ముందటి వచనంలోని నగరాన్ని విశేషిస్తుంది. తెలుగులో సహజమైన వర్ణనా ప్రవాహం కోసం నగరాన్ని సూచించే ‘దానికి’తో అస్తిత్వ నిర్మాణం వాడబడింది.
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: పెద్దదైన, ఎత్తైన ప్రాకారం
  rationale: μέγα, ὑψηλόν అనే రెండు విశేషణాలనూ విడిగా నిలుపుతూ, నగర నిర్మాణ సందర్భంలో τεῖχοςకు సహజమైన ‘ప్రాకారం’ వాడబడింది.
- source_word: πυλῶνας δώδεκα
  choice: పన్నెండు ద్వారాలు
  rationale: ప్రాకారమున్న నగర ప్రవేశద్వారాలకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదబంధం.
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: ద్వారాల దగ్గర / వాటి మీద
  rationale: ἐπί + దత్తి ఇక్కడ స్థానార్థాన్ని ఇస్తుంది. దేవదూతల విషయంలో ‘దగ్గర’ అని చెప్పడం వారు ద్వారాల పైభాగంలో ఉన్నారనే అనవసర భావాన్ని నివారిస్తుంది; చెక్కబడిన పేర్ల విషయంలో ‘వాటి మీద’ నిర్మాణ సందర్భానికి సరిపోతుంది.
- source_word: ἀγγέλους δώδεκα
  choice: పన్నెండు మంది దేవదూతలు
  rationale: వ్యక్తులను లెక్కించే సహజ తెలుగు ప్రయోగానికి ‘మంది’ చేర్చబడింది; ἀγγέλουςకు ‘దేవదూతలు’ ప్రామాణిక సమానార్థకం.
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: పేర్లు చెక్కబడి ఉన్నాయి
  rationale: ἐπιγεγραμμέναలోని ఉపరితలంపై లిఖించబడిన భావాన్ని, స్మారక నిర్మాణ సందర్భానికి తగిన ‘చెక్కబడి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: φυλῶν
  choice: గోత్రాల
  rationale: ఇశ్రాయేలు గోత్ర విభాగాలకు స్థిరమైన బైబిలు పదం.
- source_word: υἱῶν Ἰσραήλ
  choice: ఇశ్రాయేలు కుమారుల
  rationale: మూలంలోని υἱῶν అనే పుంలింగ కుటుంబపదాన్ని ప్రధాన పాఠ్యంలో యథార్థంగా నిలుపుతుంది.
theological_decisions:
- issue: υἱῶν Ἰσραήλ అనే సమూహ వాచక నిబంధనాత్మక పేరును ఎలా అనువదించాలి
  choice: ఇశ్రాయేలు కుమారుల
  alternative: ఇశ్రాయేలు సంతానం
  rationale: గ్రీకు పాఠం స్పష్టంగా ‘కుమారులు’ అనే అర్థమున్న υἱῶνను వాడుతుంది. అందువల్ల ప్రధాన పాఠ్యం దాని పుంలింగ కుటుంబ రూపాన్ని నిలుపుతుంది; సమూహమంతటినీ సూచించే సంప్రదాయ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గంభీరమైన వర్ణనా శైలి వాడబడింది. గ్రీకు కృదంతాల వరుసను తెలుగులో అసహజంగా అనుకరించకుండా చిన్న వాక్యాలుగా విభజించాం; అయినా నగరానికి చెందిన ప్రాకారం, ద్వారాలు, దేవదూతలు, పేర్లు అనే వివరాల క్రమం నిలుపబడింది.
