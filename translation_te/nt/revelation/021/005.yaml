id: REV.21.5
reference: Revelation 21:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: te
  text: 'సింహాసనంపై కూర్చున్నవాడు ఇలా అన్నాడు: “ఇదిగో, నేను అన్నిటినీ కొత్తవిగా చేస్తున్నాను[a].” ఆయన ఇలా అన్నాడు: “రాయి, ఎందుకంటే ఈ మాటలు నమ్మదగినవీ[b], సత్యమైనవీ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను సమస్తాన్నీ కొత్తగా చేస్తున్నాను.” గ్రీకు పదబంధం అన్నిటినీ కొత్తవిగా చేస్తున్న కార్యాన్ని తెలియజేస్తుంది; ఇది పూర్తిగా భర్తీ చేయడమా లేక రూపాంతరం చేయడమా అని ప్రత్యేకంగా నిర్ణయించదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “విశ్వసనీయమైనవీ” లేదా “నమ్మకమైనవీ.” గ్రీకు పదం ఈ మాటలపై ఆధారపడవచ్చనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: సింహాసనం మీద కూర్చున్నవాడు
  rationale: వర్తమాన కృదంతంలోని వర్ణనాత్మక భావాన్ని, సింహాసనాధికార చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని గంభీరంగా ఆకర్షించే ప్రకటనాత్మక బలాన్ని కాపాడుతుంది.
- source_word: καινὰ
  choice: కొత్తగా
  rationale: గుణం లేదా స్వభావంలో కొత్తదనాన్ని సూచించగల καινός భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; పూర్తిగా భర్తీ చేయడమా, రూపాంతరం చేయడమా అనే విషయాన్ని నిర్ణయించదు.
- source_word: ποιῶ
  choice: చేస్తున్నాను
  rationale: వర్తమాన క్రియలోని కొనసాగుతున్న కార్యభావాన్ని ప్రతిబింబిస్తుంది; మూలంలో లేని ‘సృష్టిస్తున్నాను’ అనే ప్రత్యేక భావాన్ని జోడించదు.
- source_word: πάντα
  choice: సమస్తాన్నీ
  rationale: నపుంసక బహువచనంలోని సమగ్ర పరిధిని సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: Γράψον
  choice: రాయి
  rationale: మూలంలోని ప్రత్యక్ష ఏకవచన ఆజ్ఞను అదనపు కర్మను చేర్చకుండా నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: రాయమనే ఆజ్ఞకు తరువాతి వాక్యం కారణాన్ని ఇస్తున్నదనే సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: οὗτοι οἱ λόγοι
  choice: ఈ మాటలు
  rationale: ఇప్పుడే పలికిన ప్రకటనలను సహజంగా సూచిస్తుంది.
- source_word: πιστοὶ
  choice: నమ్మదగినవీ
  rationale: ఈ మాటలపై ఆధారపడవచ్చనే భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: ἀληθινοί
  choice: సత్యమైనవీ
  rationale: మాటల నిజత్వాన్ని నేరుగా తెలిపి, πιστοίతో ఉన్న జంట విశేషణ నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: καινὰ ποιῶ πάντα లో అంత్యకాల నూతనీకరణ పరిధి, స్వభావం
  choice: నేను సమస్తాన్నీ కొత్తగా చేస్తున్నాను
  alternative: నేను అన్నిటినీ కొత్తవిగా చేస్తున్నాను / నేను సమస్తాన్నీ నూతనపరుస్తున్నాను
  rationale: ఎంచుకున్న రూపం πάντα యొక్క సమగ్రతను, ποιῶ యొక్క వర్తమాన కార్యభావాన్ని నిలుపుతుంది. ఇది పాతదాన్ని పూర్తిగా భర్తీ చేయడమా లేక రూపాంతరం చేయడమా అనే వేదాంత ప్రశ్నను మూలం కంటే ఎక్కువగా పరిష్కరించదు.
- issue: సింహాసనం మీదున్న వక్త గుర్తింపు
  choice: సింహాసనం మీద కూర్చున్నవాడు
  alternative: సింహాసనం మీద ఆసీనుడైనవాడు
  rationale: మూలపాఠం ఇచ్చే సింహాసన చిత్రణ ద్వారానే వక్తను పేర్కొంటుంది; అదనపు సిద్ధాంతపరమైన గుర్తింపును చేర్చదు.
- issue: πιστοὶ καὶ ἀληθινοί అనే జంట విశేషణాలు
  choice: నమ్మదగినవీ, సత్యమైనవీ
  alternative: విశ్వసనీయమైనవీ, నిజమైనవీ
  rationale: మొదటి పదం విశ్వసించదగిన స్వభావాన్ని, రెండవది సత్యత్వాన్ని సూచించే భేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ప్రకటన శైలిని పాటించాం. ‘ఆసీనుడు,’ ‘నూతనపరుస్తున్నాను’ వంటి ఎక్కువ గ్రాంథిక రూపాలకంటే సహజమైన పదాలను ఎంచుకున్నాం; అయితే ‘సమస్తాన్నీ’ ద్వారా వాక్యంలోని విశాలమైన, గంభీరమైన పరిధిని నిలిపాం.
