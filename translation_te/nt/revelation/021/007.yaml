id: REV.21.7
reference: Revelation 21:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: te
  text: జయించేవాడు[a] వీటిని వారసత్వంగా పొందుతాడు. నేను అతనికి దేవుడనై ఉంటాను; అతడు నాకు కుమారుడై ఉంటాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గెలిచేవాడు.’ ప్రకటన గ్రంథంలో గ్రీకు క్రియ νικάω విశ్వాసంగా నిలిచి విజయం సాధించడాన్ని సూచిస్తూ పదేపదే వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘అతడు నాకు కుమారుడై ఉంటాడు.’ ఇక్కడ పుంలింగ పదం ప్రతినిధిత్వ భావంతో వాడబడి ఉండవచ్చు; అయినా మూలపాఠ్యంలోని కుమారత్వ భాషను అనువాదం నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: జయించేవాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వర్తమాన కృదంతం, జయిస్తూ నిలిచే లక్షణం గల వ్యక్తిని సూచిస్తుంది. ‘జయించేవాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ప్రకటన గ్రంథమంతటా పునరావృతమయ్యే νικάω పదబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: κληρονομήσει
  choice: వారసత్వంగా పొందుతాడు
  rationale: κληρονομέω అంటే వారసత్వంగా పొందడం. ఈ అనువాదం తరువాత వచ్చే దేవుడు–కుమారుడు సంబంధంతో ముడిపడిన కుటుంబ, నిబంధన భావాలను నిలుపుతుంది.
- source_word: ταῦτα
  choice: వీటిని
  rationale: బహువచన సూచనసర్వనామమైన ταῦταను నేరుగా, సహజంగా ప్రతిబింబిస్తుంది; ముందున్న దర్శనంలో చెప్పబడిన సంగతులను సూచిస్తుంది.
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: నేను అతనికి దేవుడనై ఉంటాను
  rationale: దత్తివిభక్తిలోని సంబంధ భావాన్ని నిలుపుతూ, లేఖనాల్లోని నిబంధన సూత్రాన్ని తెలుగులో గంభీరంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: అతడు నాకు కుమారుడై ఉంటాడు
  rationale: మూలంలోని పరస్పర సంబంధ నిర్మాణాన్ని, కుమారత్వ భాషను కాపాడుతుంది. υἱόςకు అనిర్దిష్ట ఉపపదం లేకపోవడం వల్ల తెలుగులో ‘ఒక కుమారుడు’ అని తప్పనిసరిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: υἱός
  choice: కుమారుడు
  rationale: మూలంలోని పుంలింగ కుమారత్వ పదాన్ని, దానితో ముడిపడిన వారసత్వం మరియు దత్తపుత్రత్వ సూచనలను ‘బిడ్డ’ వంటి లింగతటస్థ పదంతో చదును చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: జయించేవాడికి సాధారణంగా వర్తించే వాగ్దానంలో పుంలింగ కుమారత్వ భాష
  choice: ప్రధాన పాఠ్యంలో ‘కుమారుడు’ను ఉంచడం
  alternative: బిడ్డ
  rationale: గ్రీకు పాఠ్యంలో స్పష్టంగా పుంలింగ ఏకవచనమైన υἱός ఉంది. ఇక్కడ అది ప్రతినిధిత్వ భావంతో అందరికీ వర్తించే అవకాశం ఉన్నప్పటికీ, వారసత్వం మరియు కుమారత్వానికి సంబంధించిన ప్రాముఖ్యమైన రూపకాన్ని ప్రధాన పాఠ్యంలో తటస్థీకరించకుండా, వివరణను పాదటిప్పణిలో ఇస్తున్నాం.
- issue: నిబంధన సంబంధ సూత్ర ప్రతిధ్వని
  choice: ‘నేను అతనికి దేవుడనై ఉంటాను; అతడు నాకు కుమారుడై ఉంటాడు’
  alternative: ‘నేను అతనికి దేవునిగా ఉంటాను; అతడు నాకు ఒక కుమారునిగా ఉంటాడు’
  rationale: మూలంలోని దేవుడు–కుమారుడు పరస్పర సంబంధాన్ని, నిబంధన భాష ప్రతిధ్వనిని అదనపు సిద్ధాంత వివరణ చేర్చకుండా సహజమైన తెలుగులో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. సంప్రదాయ ‘జయించువాడు’కు బదులు ప్రస్తుత వాడుకలో సులభంగా అర్థమయ్యే ‘జయించేవాడు’ను ఎంచుకున్నాం. నిబంధన సూత్రంలోని సమాంతర నిర్మాణాన్ని సెమికోలన్‌తో స్పష్టంగా ఉంచాం.
