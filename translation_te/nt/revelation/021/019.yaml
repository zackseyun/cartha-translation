id: REV.21.19
reference: Revelation 21:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: te
  text: నగర ప్రాకారపు పునాదులు అన్ని రకాల విలువైన రాళ్లతో అలంకరించబడి ఉన్నాయి.[a] మొదటి పునాది సూర్యకాంతం, రెండవది నీలమణి, మూడవది ఖల్కెడోను,[b] నాలుగవది మరకతం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి విలువైన రాయితో.” గ్రీకు పదబంధాన్ని విభజనాత్మకంగా తీసుకుంటే, “అన్ని రకాల విలువైన రాళ్లతో” అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: “ఖల్కెడోను” అనేది గ్రీకు రత్ననామానికి ధ్వన్యనుకరణ. కొన్ని ప్రాచీన రత్నాలను ఖచ్చితంగా గుర్తించడం అనిశ్చితం.
    reason: cultural_note
lexical_decisions:
- source_word: θεμέλιοι
  choice: పునాదులు
  rationale: బహువచన నామవాచకం పట్టణ ప్రాకారానికి చెందిన పునాదులను సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: τείχους
  choice: ప్రాకారపు
  rationale: సందర్భంలో ఇది పట్టణాన్ని చుట్టిన గోడ; ‘ప్రాకారం’ సాధారణ ‘గోడ’ కంటే ఈ పట్టణ రక్షణ గోడ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: πόλεως
  choice: పట్టణపు
  rationale: πόλιςకు సహజమైన ఆధునిక తెలుగు పదం; ప్రకటన గ్రంథంలోని మహాపట్టణ సందర్భానికి సరిపోతుంది.
- source_word: παντὶ λίθῳ τιμίῳ
  choice: అన్నిరకాల విలువైన రాళ్లతో
  rationale: దత్తి విభక్తి అలంకరణకు ఉపయోగించిన సాధనాన్ని సూచిస్తుంది; παντί యొక్క విభజనాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది, అయితే ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో ఉంచింది.
- source_word: κεκοσμημένοι
  choice: అలంకరించబడి ఉన్నాయి
  rationale: పూర్ణ భూత నిష్క్రియ కృదంతం సూచించే పూర్తయిన అలంకరణ ఫలితంగా కొనసాగుతున్న స్థితిని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: మొదటి పునాది
  rationale: వరుసగా ఒక్కొక్క పునాదిని పరిచయం చేసే ఏకవచన నిర్మాణాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἴασπις
  choice: సూర్యకాంతం
  rationale: ἴασπιςకు తెలుగు బైబిలు వాడుకలో స్థిరపడిన రత్ననామం; ప్రాచీన రత్నపు ఖచ్చిత స్వరూపం నేటి jasperతో పూర్తిగా సమానమని నిర్ధారించదు.
- source_word: σάπφιρος
  choice: నీలమణి
  rationale: సాప్ఫైర్ రత్నానికి సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పేరు.
- source_word: χαλκηδών
  choice: చాల్కెదోను రాయి
  rationale: ప్రాచీన రత్నపు ఖచ్చిత గుర్తింపు అనిశ్చితమైనందున గ్రీకు పేరును తెలుగు లిపిలో ధ్వన్యనుకరణ చేసి ‘రాయి’తో స్పష్టం చేసింది.
- source_word: σμάραγδος
  choice: పచ్చరాయి
  rationale: స్మారగ్దోస్ సూచించే ఆకుపచ్చ విలువైన రత్నాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది; సాధారణంగా emeraldగా గుర్తిస్తారు.
theological_decisions:
- issue: దర్శన సంబంధమైన వర్ణనలో రత్నాల జాబితా
  choice: ప్రధాన పాఠ్యంలో రత్నాల పేర్లను వాటి ప్రతీకార్థం వివరించకుండా సూటిగా అనువదించడం
  alternative: రాళ్లను ఇశ్రాయేలు గోత్రాలు, అపొస్తలుల పునాదులు లేదా యాజక వస్త్రాలతో ప్రతీకాత్మకంగా అనుసంధానించడం
  rationale: ఈ వచనం రాళ్ల ప్రతీకార్థాన్ని వివరించకుండా అలంకరణను మాత్రమే వర్ణిస్తుంది; ఏ నిర్దిష్ట సిద్ధాంత పద్ధతినీ అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ‘ప్రాకారం,’ ‘పునాదులు,’ ‘అలంకరించబడి ఉన్నాయి’ అనే పదాలు దర్శన వర్ణన యొక్క ఔన్నత్యాన్ని నిలుపుతాయి. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
