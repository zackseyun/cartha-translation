  source_fidelity: క్రమసంఖ్యలూ జాబితా నిర్మాణమూ గ్రీకు మూలానికి సరిగ్గా ఉన్నాయి. అయితే కొన్ని సంప్రదాయ తెలుగు రత్నపేర్లు ఆధునిక ఖనిజపేర్లకు నిర్దిష్టంగా అనుసంధానమై ఉండి (ప్రత్యేకంగా వైడూర్యం, పచ్చ), βήρυλλος మరియు τοπάζιον వంటి గ్రీకు పదాలకు అనవసరమైన, తప్పుదారి పట్టించే ఆధునిక గుర్తింపును కలిగించవచ్చు. మూలంలోని ప్రాచీన రత్న-గుర్తింపు అనిశ్చితిని కాపాడడానికి స్థిరమైన తెలుగు లిప్యంతరీకరణలు సురక్షితం.
  naturalness: సవరణలోని రూపాలు ఆధునిక ప్రామాణిక తెలుగులో రత్ననామాలుగా సహజంగా చదవబడతాయి; సంక్షిప్తమైన పునరావృత జాబితా శైలి అలాగే నిలుస్తుంది.
