id: REV.21.20
reference: Revelation 21:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ πέμπτος σαρδόνυξ, ὁ ἕκτος σάρδιον, ὁ ἕβδομος χρυσόλιθος, ὁ ὄγδοος βήρυλλος, ὁ ἔνατος τοπάζιον, ὁ δέκατος χρυσόπρασος, ὁ ἑνδέκατος ὑάκινθος, ὁ δωδέκατος ἀμέθυστος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: te
  text: ఐదవది సార్డోనిక్స్; ఆరవది సార్డియస్[a]; ఏడవది క్రైసోలైట్; ఎనిమిదవది బెరిల్; తొమ్మిదవది టోపాజ్; పదవది క్రైసోప్రేస్; పదకొండవది హయాసింత్[b]; పన్నెండవది అమేతిస్టు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సార్డియస్’ను ‘కార్నేలియన్’ అని కూడా అనువదించవచ్చు; ఈ ప్రాచీన రత్నం యొక్క ఖచ్చితమైన గుర్తింపు అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: ‘హయాసింత్’ను ‘జాసింత్’ అని కూడా లిప్యంతరీకరించవచ్చు; ఇక్కడ గ్రీకు పదం పువ్వును కాదు, ఒక రత్నాన్నే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμπτος
  choice: ఐదవది
  rationale: పునాదిరాళ్ల వరుసను సహజమైన తెలుగు జాబితా నిర్మాణంలో కొనసాగించే క్రమసంఖ్య.
- source_word: σαρδόνυξ
  choice: గోమేధికం
  rationale: సార్డోనిక్స్ రత్నానికి తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన రత్ననామం; ప్రాచీన రత్నాల ఖచ్చిత గుర్తింపు కొంత అనిశ్చితం.
- source_word: ἕκτος
  choice: ఆరవది
  rationale: గ్రీకు క్రమసంఖ్యను నేరుగా, జాబితా లయను నిలుపుతూ అనువదించింది.
- source_word: σάρδιον
  choice: కెంపు
  rationale: ఎర్రని సార్డియస్/కార్నేలియన్ రత్నానికి సహజమైన తెలుగు పేరు; σαρδόνυξతో భేదాన్ని నిలుపుతుంది.
- source_word: ἕβδομος
  choice: ఏడవది
  rationale: క్రమాన్ని యథాతథంగా తెలిపే సహజ తెలుగు రూపం.
- source_word: χρυσόλιθος
  choice: పుష్యరాగం
  rationale: ప్రాచీన క్రిసోలైట్‌కు తెలుగు రత్ననామ సంప్రదాయంలో వాడుకలో ఉన్న సమానం; ఖచ్చిత ఆధునిక ఖనిజ గుర్తింపు అనిశ్చితం.
- source_word: ὄγδοος
  choice: ఎనిమిదవది
  rationale: గ్రీకు క్రమసంఖ్యకు నేర అనువాదం.
- source_word: βήρυλλος
  choice: వైడూర్యం
  rationale: బెరిల్ రత్నానికి తెలుగు సంప్రదాయంలో ప్రసిద్ధమైన పేరు.
- source_word: ἔνατος
  choice: తొమ్మిదవది
  rationale: గ్రీకు క్రమసంఖ్యకు నేర అనువాదం.
- source_word: τοπάζιον
  choice: పచ్చ
  rationale: ప్రాచీన తోపాజియోన్‌కు తెలుగు బైబిలు రత్నాల జాబితాలో పరిచితమైన పేరు; ఆధునిక ‘టోపాజ్’తో ఖచ్చిత సమీకరణ అనిశ్చితం.
- source_word: δέκατος
  choice: పదవది
  rationale: గ్రీకు క్రమసంఖ్యకు నేర అనువాదం.
- source_word: χρυσόπρασος
  choice: లశునీయం
  rationale: క్రిసోప్రేస్ అనే పచ్చని రత్నానికి సంప్రదాయ తెలుగు పేరు; అపరిచిత లిప్యంతరీకరణకంటే జాబితా శైలికి సరిపోతుంది.
- source_word: ἑνδέκατος
  choice: పదకొండవది
  rationale: గ్రీకు క్రమసంఖ్యను సహజ తెలుగు రూపంలో ఇచ్చింది.
- source_word: ὑάκινθος
  choice: నీలమణి
  rationale: ఇక్కడ పువ్వు కాక రత్నమే ఉద్దేశం; ప్రాచీన హయాసింత్ రత్నపు నీలవర్ణ భావాన్ని తెలిపే పరిచిత తెలుగు పేరు.
- source_word: δωδέκατος
  choice: పన్నెండవది
  rationale: గ్రీకు క్రమసంఖ్యను సహజ తెలుగు రూపంలో ఇచ్చింది.
- source_word: ἀμέθυστος
  choice: సుగంధికం
  rationale: అమెథిస్ట్ రత్నానికి తెలుగు బైబిలు సంప్రదాయంలో కనిపించే పేరు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన జాబితా శైలి. గ్రీకు మూలంలోని సంక్షిప్త, పునరావృత క్రమాన్ని నిలిపి, రత్నాలకు తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన పేర్లు వాడబడ్డాయి. ప్రాచీన రత్నాల ఆధునిక ఖనిజ సమీకరణలోని అనిశ్చితిని గమనికల్లో స్పష్టపరచబడింది.
