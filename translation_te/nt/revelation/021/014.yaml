id: REV.21.14
reference: Revelation 21:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: te
  text: ఆ పట్టణపు గోడకు పన్నెండు పునాదులు[a] ఉన్నాయి; వాటిమీద గొర్రెపిల్లకు చెందిన పన్నెండు మంది అపొస్తలుల పన్నెండు పేర్లు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పన్నెండు పునాది రాళ్లు.” గ్రీకు పదం θεμελίους నిర్మాణ సందర్భంలో పునాదులను లేదా పునాది రాళ్లను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεῖχος
  choice: గోడ
  rationale: ఇది ప్రత్యేకంగా పట్టణ గోడను సూచిస్తుంది; ఆధునిక తెలుగులో ‘గోడ’ సహజమైన, స్పష్టమైన పదం.
- source_word: πόλεως
  choice: పట్టణపు
  rationale: సంబంధార్థక షష్ఠీ విభక్తిని తెలుగులో సహజమైన ‘పట్టణపు గోడ’గా వ్యక్తం చేసింది.
- source_word: ἔχων
  choice: ఉన్నాయి
  rationale: గ్రీకులో వర్తమాన అసమాపక క్రియ ఉన్నప్పటికీ, దర్శన వర్ణనలో తెలుగు సహజ వాక్యనిర్మాణానికి అనుగుణంగా సమాపక క్రియగా అనువదించబడింది.
- source_word: θεμελίους δώδεκα
  choice: పన్నెండు పునాదులు
  rationale: θεμέλιος అనేది పునాదులను లేదా పునాది రాళ్లను సూచించవచ్చు. ప్రధాన పాఠ్యంలో విస్తృతమైన ప్రత్యక్ష అర్థమైన ‘పునాదులు’ను ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἐπ’ αὐτῶν
  choice: వాటిమీద
  rationale: ἐπί తో వచ్చిన స్థితి భావాన్ని, ముందున్న పునాదులను స్పష్టంగా సూచించే సహజ తెలుగు రూపంలో అందించింది.
- source_word: ὀνόματα
  choice: పేర్లు
  rationale: మూలపాఠం ‘చెక్కబడిన పేర్లు’ వంటి అదనపు భావాన్ని చెప్పదు; కాబట్టి కేవలం ‘పేర్లు’ అని అనువదించబడింది.
- source_word: ἀποστόλων
  choice: అపొస్తలుల
  rationale: కొత్త నిబంధనలోని స్థిరమైన పరిచర్య పదవిని సూచించడానికి ప్రామాణిక తెలుగు క్రైస్తవ పదమైన ‘అపొస్తలులు’ను వాడింది.
- source_word: τοῦ ἀρνίου
  choice: గొర్రెపిల్లకు చెందిన
  rationale: ప్రకటన గ్రంథంలో యేసును సూచించే ప్రధాన బిరుదైన ἀρνίονను ‘గొర్రెపిల్ల’గా నిలిపి, షష్ఠీ సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేసింది.
theological_decisions:
- issue: క్రీస్తును సూచించే ἀρνίον అనే బిరుదు
  choice: గొర్రెపిల్ల
  alternative: గొర్రె పిల్ల
  rationale: ప్రకటన గ్రంథమంతటా ఇది మహిమపరచబడిన యేసుకు స్థిరమైన బిరుదుగా పనిచేస్తుంది. తెలుగు లిపిలో పెద్ద అక్షరాల భేదం లేకపోవడంతో, ఏ అదనపు వివరణను చేర్చకుండా స్థిరమైన సమాసరూపం ‘గొర్రెపిల్ల’ను ఉపయోగించింది.
- issue: τοῦ ἀρνίου లోని సంబంధ భావం
  choice: గొర్రెపిల్లకు చెందిన
  alternative: గొర్రెపిల్ల యొక్క
  rationale: ఈ షష్ఠీ అపొస్తలులు గొర్రెపిల్లకు చెందినవారనే సంబంధాన్ని తెలియజేస్తుంది. ‘కు చెందిన’ ఆధునిక తెలుగులో సహజంగా ఉండి, సంబంధాన్ని అతిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. గ్రీకు వాక్యంలో ‘పన్నెండు’ రెండుసార్లు ఉన్నట్లే అనువాదంలోనూ ఉంచబడింది; పేర్లు చెక్కబడ్డాయని మూలంలో లేని వివరాన్ని చేర్చలేదు.
