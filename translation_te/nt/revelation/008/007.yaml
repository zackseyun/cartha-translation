    rationale: ἐγένετο సంఘటనాత్మక పరిచయాన్ని సూచిస్తుంది. “సంభవించాయి” ఈ అపోకలిప్టిక్ దృశ్యానికి సహజమైన తెలుగు ప్రయోగం.
