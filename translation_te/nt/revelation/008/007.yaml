id: REV.8.7
reference: Revelation 8:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: te
  text: మొదటివాడు బూర ఊదాడు. అప్పుడు రక్తంతో కలిసిన[a] వడగండ్లూ అగ్నీ సంభవించాయి; అదంతా భూమి[b] మీదికి విసిరివేయబడింది. భూమిలో మూడవ వంతు కాలిపోయింది, చెట్లలో మూడవ వంతు కాలిపోయింది, పచ్చగడ్డి అంతా కాలిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రక్తంలో కలిసిన.”
    reason: ἐν అనే గ్రీకు ఉపసర్గ ఇక్కడ ‘తో’ లేదా ‘లో’ అనే భావాన్ని ఇవ్వగలదు.
  - marker: b
    text: లేదా, “నేల” లేదా “దేశం”; γῆ అనే గ్రీకు పదం ‘భూమి,’ ‘నేల,’ లేదా ‘దేశం’ అని సూచించగలదు.
    reason: మూలపదంలో ఉన్న నిజమైన స్థలార్థక విస్తృతిని పాఠకునికి తెలియజేయడం.
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: మొదటివాడు
  rationale: సందర్భంలో బూరలు పట్టుకున్న దేవదూతలలో మొదటివాడు అని అర్థమైనా, గ్రీకు వాక్యంలో ‘దేవదూత’ అనే నామవాచకం లేదు. అందువల్ల మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: ἐσάλπισεν
  choice: బూర ఊదాడు
  rationale: σαλπίζω అంటే బూరను మోగించడం. ఆధునిక తెలుగులో ‘బూర ఊదాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐγένετο χάλαζα καὶ πῦρ
  choice: వడగండ్లు, అగ్ని వచ్చాయి
  rationale: ἐγένετο యొక్క సంఘటనాత్మక భావాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తూ, దర్శనంలోని స్పష్టమైన ప్రతిమలను యథాతథంగా ఉంచుతుంది.
- source_word: μεμιγμένα ἐν αἵματι
  choice: రక్తంతో కలిసిన
  rationale: మెμιγμένα మిశ్రమ స్థితిని సూచిస్తుంది; ἐν ఇక్కడ సహవాస లేదా సాధన భావంలో ఉండవచ్చు. ‘రక్తంతో కలిసిన’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: అదంతా భూమి మీదికి విసరవబడింది
  rationale: ఏకవచన నిష్క్రియాపదమైన ἐβλήθη వడగండ్లు-అగ్ని అనే మొత్తం దృగ్విషయాన్ని ఒక సమష్టిగా చూపుతుంది. ‘అదంతా’ ఆ సమష్టి ఏకవచన భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: τὸ τρίτον τῆς γῆς
  choice: భూమిలో మూడవ వంతు
  rationale: భాగార్థక నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ప్రకటన గ్రంథంలోని విస్తృత ప్రళయాత్మక సందర్భం వల్ల ‘నేల/దేశం’ కంటే ‘భూమి’కి ప్రాధాన్యం ఇచ్చాం.
- source_word: κατεκάη
  choice: కాలిపోయింది
  rationale: κατακαίω యొక్క తీవ్ర లేదా సంపూర్ణ దహన భావాన్ని ‘కాలిపోయింది’ సహజంగా తెలియజేస్తుంది.
- source_word: τὸ τρίτον τῶν δένδρων
  choice: చెట్లలో మూడవ వంతు
  rationale: భాగార్థక గ్రీకు పదబంధానికి సహజమైన తెలుగు సమానం.
- source_word: πᾶς χόρτος χλωρός
  choice: పచ్చగడ్డి అంతా
  rationale: χόρτος ఇక్కడ గడ్డి లేదా పచ్చికను, χλωρός దాని పచ్చని తాజా స్థితిని సూచిస్తాయి. ‘పచ్చగడ్డి అంతా’ స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రళయాత్మక తీర్పు సందర్భంలో γῆ యొక్క పరిధి
  choice: భూమి
  alternative: నేల; దేశం
  rationale: γῆ అనే పదానికి ‘భూమి,’ ‘నేల,’ లేదా ‘దేశం’ అనే అర్థాలు రావచ్చు. ఈ బూర తీర్పుల విస్తృత ప్రళయాత్మక సందర్భం ‘భూమి’ని సమర్థిస్తుంది; అయితే మూలపదంలోని ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని వరుస తీర్పు వాక్యాల పునరుక్తిని నిలుపుతూ, గ్రీకు ఏకవచన నిష్క్రియాపదాన్ని ‘అదంతా’ అనే సమష్టి రూపంతో సహజీకరించాం.
