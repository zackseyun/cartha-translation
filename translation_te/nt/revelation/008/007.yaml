- from: మొదటివాడు బూర ఊదాడు. అప్పుడు రక్తంతో కలిసిన[a] వడగండ్లు, అగ్ని వచ్చాయి; అదంతా భూమి[b] మీదికి విసరవబడింది. భూమిలో మూడవ వంతు కాలిపోయింది, చెట్లలో మూడవ వంతు కాలిపోయింది, పచ్చగడ్డి అంతా కాలిపోయింది.
