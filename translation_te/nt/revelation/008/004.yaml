id: REV.8.4
reference: Revelation 8:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: te
  text: ఆ ధూపపు పొగ పరిశుద్ధుల ప్రార్థనలతో కలిసి దేవదూత చేతిలోనుండి దేవుని ఎదుట పైకి లేచింది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పైకి ఎగసింది.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో, ‘పరిశుద్ధుల ప్రార్థనలతో.’ ఈ వాక్యం ధూపపు పొగను ప్రార్థనలతో అనుసంధానిస్తుంది గాని, ఈ వచనంలో రెండూ ఒకటేనని స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: పైకి లేచింది
  rationale: పైకి కదలడాన్ని సూచించే ἀναβαίνω యొక్క భూతకాల క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దృశ్యంలోని స్పష్టమైన పైకెగసే భావాన్ని నిలుపుతుంది.
- source_word: καπνὸς
  choice: పొగ
  rationale: సాధారణ అర్థమైన ‘పొగ’నే ఉంచి, అపోకలిప్టిక్ దృశ్యానికి అనవసరమైన ప్రతీకాత్మక వివరణను చేర్చదు.
- source_word: θυμιαμάτων
  choice: ధూపపు
  rationale: θυμίαμα ఇక్కడ ఆరాధనలో ఉపయోగించే ధూపాన్ని సూచిస్తుంది. గ్రీకు బహువచనాన్ని తెలుగులో సహజమైన సమూహార్థక ఏకవచన రూపంతో వ్యక్తం చేశాం.
- source_word: ταῖς προσευχαῖς
  choice: ప్రార్థనలతో కలిసి
  rationale: దత్తివాచక నిర్మాణంలోని సహచర్య భావాన్ని స్పష్టమైన సహజ తెలుగులో తెలియజేస్తుంది; ధూపాన్ని ప్రార్థనలతో సమానం చేయకుండా వాటి అనుబంధాన్ని కాపాడుతుంది.
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధుల
  rationale: దేవునికి ప్రతిష్ఠించబడిన ప్రజలను సూచించే ప్రామాణిక బైబిలు పదాన్ని నిలుపుతుంది; తరువాతి మతసంప్రదాయాల్లోని ప్రత్యేక అర్థానికి పరిమితం చేయదు.
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: దేవదూత చేతిలోనుండి
  rationale: గ్రీకు నిర్మాణాన్నీ, దర్శనంలోని చేతి నుండి పైకి లేచే దృశ్యాన్నీ సన్నిహితంగా కాపాడుతుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని సన్నిధికి
  rationale: ἐνώπιον యొక్క ‘ఎదుట/సన్నిధిలో’ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; పొగ దేవుని సమక్షానికి పైకి లేచిన దిశను సందర్భానుసారంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ధూపానికి ప్రార్థనలకు మధ్య సంబంధం
  choice: ‘ధూపపు పొగ పరిశుద్ధుల ప్రార్థనలతో కలిసి’ అని అనువదించి, వాటి అనుబంధాన్ని చూపించాం గాని రెండింటినీ ఒకటిగా నిర్ధారించలేదు.
  alternative: ‘పరిశుద్ధుల ప్రార్థనలైన ధూపపు పొగ’ లేదా ‘పరిశుద్ధుల ప్రార్థనల నిమిత్తం ధూపపు పొగ’
  rationale: గ్రీకు వాక్యనిర్మాణం ధూపపు పొగను ప్రార్థనలతో అనుసంధానిస్తుంది, కాని ఈ వచనంలో అవి ఒకటేనని స్పష్టంగా చెప్పదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక అనిశ్చితిని నిలిపాం.
- issue: ‘పరిశుద్ధులు’ అనే పదం సూచించే వారు
  choice: దేవునికి చెందిన పరిశుద్ధ ప్రజలను విస్తృతంగా సూచించే ‘పరిశుద్ధులు’ అనే బైబిలు పదాన్ని వాడాం.
  alternative: ‘దేవుని పరిశుద్ధ ప్రజలు’
  rationale: మూలంలోని ἅγιοι పదాన్ని ఒక నిర్దిష్ట తరువాతి మతసంప్రదాయ అర్థానికి పరిమితం చేయకుండా, దాని స్థిరమైన బైబిలు వాడుకను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బైబిలు శైలి. ‘ధూపం,’ ‘పరిశుద్ధులు,’ ‘దేవుని సన్నిధి’ వంటి స్థిరమైన పదజాలాన్ని ఉంచుతూ, వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా నిర్మించాం.
