source:
  edition: SBLGNT
  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: te
  text: సముద్రంలో ఉన్న జీవుల్లో—ప్రాణమున్న వాటిలో—మూడవ వంతు చనిపోయింది; ఓడల్లో మూడవ వంతు నాశనమైంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέθανε
  choice: చనిపోయింది
  rationale: ἀποθνῄσκω యొక్క భూతకాల రూపం ఇక్కడ నేరుగా మరణాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చనిపోయింది’ సహజమైన, స్పష్టమైన సమానార్థకం.
- source_word: τὸ τρίτον
  choice: మూడవ వంతు
  rationale: మొత్తంలో మూడో భాగాన్ని సూచించే గ్రీకు పరిమాణార్థాన్ని సహజమైన తెలుగులో ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: κτισμάτων
  choice: సృష్టిజీవులు
  rationale: κτίσμα అంటే ‘సృష్టించబడినది/సృష్టిజీవి.’ సముద్రంలో ఉండి ప్రాణం గలవిగా పేర్కొనబడిన ఈ సందర్భంలో ‘సృష్టిజీవులు’ దాని సృష్టిత్వాన్ని, జీవులనే సందర్భార్థాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: సముద్రంలో ఉన్న
  rationale: స్థానాన్ని సూచించే గ్రీకు పదబంధానికి సరళమైన, సహజమైన తెలుగు రూపం.
- source_word: τὰ ἔχοντα ψυχάς
  choice: ప్రాణమున్న వాటిలో
  rationale: ఈ సందర్భంలో ψυχή సజీవత్వాన్ని సూచిస్తుంది. ‘ప్రాణమున్న’ అనేది తెలుగులో సహజంగా ఉండటంతో పాటు ‘జీవం’ అని మాత్రమే సారాంశీకరించకుండా మూలపదపు భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: ψυχάς
  choice: ప్రాణం
  rationale: ψυχήకి ప్రాణం, జీవం, జీవి వంటి సందర్భానుసార అర్థాలు ఉన్నాయి. సముద్రజీవుల సందర్భంలో ‘ప్రాణం’ సజీవత్వాన్ని తెలియజేస్తుంది; జంతువుల ఆత్మ గురించి సాంకేతిక సిద్ధాంతాన్ని అనవసరంగా ప్రవేశపెట్టదు.
- source_word: πλοίων
  choice: ఓడలు
  rationale: πλοῖονకు సముద్ర ప్రయాణ నౌక అనే అర్థం ఉంది; ‘ఓడలు’ సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: διεφθάρησαν
  choice: నాశనమైంది
  rationale: διαφθείρω యొక్క కర్మణి రూపం ఇక్కడ నైతిక భ్రష్టతను కాదు, విపత్తువల్ల సంభవించిన విధ్వంసాన్ని సూచిస్తుంది.
theological_decisions:
- issue: సముద్రజీవులను వర్ణించే ψυχάς పదానికి అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘ప్రాణమున్న’ అని ఉంచడం
  alternative: ‘జీవమున్న,’ ‘జీవులు’
  rationale: ఈ వాక్యం జంతువుల ఆత్మ గురించి సాంకేతిక మానవశాస్త్రీయ ప్రకటన చేయడం లేదు. అయినా ψυχή అనే ప్రాముఖ్యమైన బైబిలు పదాన్ని పూర్తిగా తొలగించకుండా, తెలుగులో సహజమైన ‘ప్రాణమున్న’ రూపంతో దాని సజీవత్వ భావాన్ని నిలిపి, ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతతో కూడిన సులభ శైలి. గ్రీకు వాక్యంలో τὰ ἔχοντα ψυχάς వివరణాత్మకంగా ప్రత్యేకంగా నిలిచినందున దాన్ని డాష్‌ల మధ్య ఉంచాం; రెండు విపత్తు ఫలితాలను స్పష్టంగా వేరు చేయడానికి అర్ధవిరామం వాడాం.
