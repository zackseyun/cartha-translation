id: REV.8.13
reference: Revelation 8:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: te
  text: 'అప్పుడు నేను చూశాను; ఆకాశమధ్యంలో[b] ఎగురుతున్న ఒక గద్ద[a] బిగ్గరగా ఇలా చెప్పడం విన్నాను: “భూమిపై నివసించేవారికి అయ్యో, అయ్యో, అయ్యో—బూరలు ఊదబోతున్న ముగ్గురు దేవదూతల మిగిలిన బూరధ్వనుల కారణంగా!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “ఒక గద్ద”కు బదులు “ఒక దేవదూత” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా “ఆకాశపు ఎత్తైన మధ్యభాగంలో”; ఈ గ్రీకు పదం తలపై ఉన్న ఆకాశపు అత్యున్నత ప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: గద్ద
  rationale: ఈ నామవాచకం సాధారణంగా గద్దను సూచిస్తుంది. ఇక్కడ మృతదేహాలను తినే పక్షి అనే ప్రత్యేక సందర్భం లేనందున ‘రాబందు’ కంటే ‘గద్ద’ అనువైనది.
- source_word: μεσουρανήματι
  choice: ఆకాశమధ్యంలో
  rationale: ఈ పదం తలపై విస్తరించిన ఆకాశపు ఎత్తైన మధ్యభాగాన్ని సూచిస్తుంది. ‘ఆకాశమధ్యంలో’ దర్శనాత్మక, విశ్వవ్యాప్త భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: φωνῇ μεγάλῃ
  choice: బిగ్గరగా
  rationale: బహిరంగంగా, గొప్ప శబ్దంతో ప్రకటించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: అయ్యో, అయ్యో, అయ్యో
  rationale: ప్రవచనాత్మక హెచ్చరికలోని తీవ్రతను నిలుపడానికి మూడుసార్ల పునరుక్తిని యథాతథంగా ఉంచింది.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: భూమిపై నివసించేవారికి
  rationale: ప్రకటన గ్రంథంలో పునరావృతమయ్యే ఈ అభివ్యక్తిని సంక్షిప్తం చేయకుండా, భూమిపై స్థిరంగా నివసించేవారనే భావంతో అందిస్తుంది.
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: మిగిలిన బూరధ్వనుల కారణంగా
  rationale: ἐκ సందర్భంలో కారణాన్ని సూచిస్తుంది; φωναίని బూర సందర్భానికి తగినట్లు ‘బూరధ్వనులు’గా అనువదించింది.
- source_word: τῶν τριῶν ἀγγέλων
  choice: ముగ్గురు దేవదూతల
  rationale: దర్శనాత్మక సందర్భంలో ἄγγελοι పరలోక దూతలను సూచిస్తున్నందున ‘దేవదూతలు’ అని అనువదించింది.
- source_word: τῶν μελλόντων σαλπίζειν
  choice: ఇంకా బూరలు ఊదబోతున్న
  rationale: μέλλω + క్రియారూపం సూచించే సమీప భవిష్యత్తును ‘ఊదబోతున్న’ నిలుపుతుంది; λοιπῶνలోని మిగిలిన చర్య భావాన్ని ‘ఇంకా’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ఎగురుతున్న ప్రకటనకర్తకు సంబంధించిన పాఠాంతరం
  choice: ఒక గద్ద
  alternative: ఒక దేవదూత
  rationale: ప్రధాన పాఠం SBLGNTలోని ἀετοῦ (‘గద్ద’)ను అనుసరిస్తుంది. కొన్ని ప్రతుల్లోని ‘దేవదూత’ అనే పాఠాంతరాన్ని ప్రధాన పాఠంలోకి తీసుకురాకుండా పాదసూచికలో భద్రపరచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దర్శనాత్మక శైలిని పాటించింది. గ్రీకు వాక్యంలోని ‘చూశాను, విన్నాను’ అనే రెండు గ్రహణక్రియలను సహజ తెలుగు వాక్యక్రమంలో నిలిపింది. మూడుసార్లు వచ్చే ‘అయ్యో’ను ప్రవచనాత్మక తీవ్రత కోసం ఉంచింది; చివరి ‘వారికి శ్రమ’ తెలుగులో ‘అయ్యో’ అనే హెచ్చరిక ఎవరికి వర్తిస్తుందో వాక్యాంతంలో సహజంగా బలపరుస్తుంది.
