review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the SBLGNT reading ‘one eagle,’ retains both ‘I saw’ and ‘I heard,’ and accurately renders the eagle’s location, the threefold woe, the earth-dwellers, the three angels, and their imminent trumpet sounding. However, ‘వారికి శ్రమ!’ adds a distinct concluding calamity statement not present in the Greek and makes the causal phrase modify that added statement rather than the triple ‘woe.’
  naturalness: The Telugu is generally clear and suitably solemn. A dash after the threefold ‘అయ్యో’ gives a natural, emphatic way to connect the cause without adding words or a further assertion.
  terminology: ‘గద్ద,’ ‘ఆకాశమధ్యంలో,’ ‘దేవదూతలు,’ ‘బూరధ్వనులు,’ and ‘అయ్యో’ are acceptable modern-standard Telugu choices in this apocalyptic context. The textual-variant and lexical footnotes are correctly anchored and accurately describe their respective issues.
  issues:
  - severity: medium
    issue: The final clause adds ‘వారికి శ్రమ!’ after the triple woe.
    rationale: Greek has only ‘Woe, woe, woe to those dwelling on the earth, because of the remaining trumpet sounds ...’; it does not add a separate ‘hardship to them.’ The addition also distorts the grammatical scope of ἐκ (‘because of’).
