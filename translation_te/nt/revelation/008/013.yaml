- from: 'అప్పుడు నేను చూశాను; ఆకాశమధ్యంలో[b] ఎగురుతున్న ఒక గద్ద[a] బిగ్గరగా ఇలా చెప్పడం విన్నాను: “భూమిపై నివసించేవారికి అయ్యో, అయ్యో, అయ్యో! ఇంకా బూరలు ఊదబోతున్న ముగ్గురు దేవదూతల మిగిలిన బూరధ్వనుల కారణంగా వారికి శ్రమ!”'
  to: 'అప్పుడు నేను చూశాను; ఆకాశమధ్యంలో[b] ఎగురుతున్న ఒక గద్ద[a] బిగ్గరగా ఇలా చెప్పడం విన్నాను: “భూమిపై నివసించేవారికి అయ్యో, అయ్యో, అయ్యో—బూరలు ఊదబోతున్న ముగ్గురు దేవదూతల మిగిలిన బూరధ్వనుల కారణంగా!”'
