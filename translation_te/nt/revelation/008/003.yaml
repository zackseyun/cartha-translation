  terminology: ‘దేవదూత,’ ‘బలిపీఠం,’ ‘ధూపపాత్ర,’ ‘ధూపద్రవ్యం,’ ‘పరిశుద్ధులు,’ and ‘సింహాసనం’ are suitable established biblical terms. ‘బంగారు’ naturally renders χρυσοῦν in both occurrences.
  issues:
