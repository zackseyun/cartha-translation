id: REV.8.3
reference: Revelation 8:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: te
  text: మరొక దేవదూత వచ్చి బలిపీఠం దగ్గర నిలబడ్డాడు. అతడు బంగారు ధూపపాత్ర[a]ను పట్టుకొని ఉన్నాడు. పరిశుద్ధులందరి ప్రార్థనలతో కలిపి, సింహాసనం ఎదుట ఉన్న బంగారు బలిపీఠం మీద అర్పించడానికి అతనికి చాలా ధూపద్రవ్యం ఇవ్వబడింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బంగారంతో చేసిన ధూపం వేసే పాత్ర.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘పరిశుద్ధులందరి ప్రార్థనలకు దానిని ఇవ్వడానికి.’ ఈ సందర్భంలో ధూపద్రవ్యాన్ని వారి ప్రార్థనలతో కలిపి లేదా వాటికి తోడుగా అర్పించడం అనే భావం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: మరొక దేవదూత
  rationale: ἄλλος ఇక్కడ వరుసలో అదనంగా కనిపించే దేవదూతను సూచిస్తుంది; వేరే రకమైన జీవిని కాదు.
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: బలిపీఠం దగ్గర నిలబడ్డాడు
  rationale: ἐπί + షష్ఠీ విభక్తి ఇక్కడ బలిపీఠం పైన నిలబడినట్లు కాక, దాని దగ్గర స్థానాన్ని తీసుకున్నట్లు సూచిస్తుంది.
- source_word: λιβανωτὸν χρυσοῦν
  choice: బంగారు ధూపపాత్ర
  rationale: λιβανωτός ధూపం వేయడానికి లేదా కాల్చడానికి ఉపయోగించే పాత్రను సూచిస్తుంది. ‘ధూపపాత్ర’ సహజమైన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: అతనికి విస్తారంగా ధూపద్రవ్యం ఇవ్వబడింది
  rationale: θυμιάματα ధూపానికి ఉపయోగించే సుగంధ ద్రవ్యాన్ని సూచిస్తుంది. ‘విస్తారంగా’ πολλὰ యొక్క పరిమాణ భావాన్ని సహజంగా తెలియజేస్తూ, మూలంలోని కర్మణి ప్రయోగాన్ని నిలుపుతుంది.
- source_word: ἵνα δώσει
  choice: అర్పించడానికి
  rationale: δίδωμι సాధారణంగా ‘ఇవ్వు’ అని అర్థమైనా, ధూపం మరియు బలిపీఠం ఉన్న ఆరాధనా సందర్భంలో ‘అర్పించు’ అనే భావం సహజం. ἵνα ఉద్దేశాన్ని సూచిస్తుంది.
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: పరిశుద్ధులందరి ప్రార్థనలతో కలిపి
  rationale: ఇక్కడి దత్తి విభక్తి సంబంధం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. సందర్భంలో ధూపద్రవ్యం ప్రార్థనలతో పాటు అర్పించబడుతున్న భావాన్ని ఈ ఎంపిక తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἅγιοι
  choice: పరిశుద్ధులు
  rationale: ప్రకటన గ్రంథంలో ఈ పదం దేవునికి ప్రత్యేకించబడిన ప్రజలను సూచిస్తుంది. ‘పరిశుద్ధులు’ స్థిరపడిన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: బంగారు బలిపీఠం మీద
  rationale: ἐπί + ద్వితీయా విభక్తి, అర్పణ క్రియ సందర్భంలో బలిపీఠం మీదకు ఉద్దేశించిన చర్యను సూచిస్తుంది.
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: సింహాసనం ఎదుట ఉన్న
  rationale: ἐνώπιον యొక్క ప్రాదేశిక భావాన్ని ‘ఎదుట’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పరిశుద్ధుల ప్రార్థనలకు ధూపద్రవ్యానికి ఉన్న సంబంధం
  choice: ధూపద్రవ్యం పరిశుద్ధులందరి ప్రార్థనలతో కలిపి అర్పించబడుతుంది.
  alternative: మరింత అక్షరార్థంగా, ధూపద్రవ్యం ‘పరిశుద్ధులందరి ప్రార్థనలకు ఇవ్వబడుతుంది.’
  rationale: గ్రీకు దత్తి విభక్తి నిర్మాణం కొంత అస్పష్టంగా ఉన్నా, ఆలయ-ఆరాధనా దృశ్యం ధూపం ప్రార్థనలతో కలిసి లేదా వాటికి తోడుగా అర్పించబడుతున్న భావాన్ని సమర్థిస్తుంది. దేవదూత మధ్యవర్తిత్వం గురించి వచనం చెప్పేదానికంటే ఎక్కువ సిద్ధాంతాన్ని ఇందులో చేర్చలేదు; అక్షరార్థ అవకాశాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం మూడు తెలుగు వాక్యాలుగా విభజించాం. ‘ధూపపాత్ర,’ ‘ధూపద్రవ్యం,’ ‘బలిపీఠం,’ ‘సింహాసనం’ వంటి స్థిరపడిన బైబిలు పదజాలాన్ని ఉపయోగించాం.
