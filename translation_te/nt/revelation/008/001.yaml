id: REV.8.1
reference: Revelation 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: te
  text: ఆయన ఏడవ ముద్రను తెరిచినప్పుడు, పరలోకంలో దాదాపు అరగంటసేపు నిశ్శబ్దం నెలకొంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: తెరిచినప్పుడు
  rationale: ఇది కథనంలోని ఒకే సంఘటనను సూచిస్తోంది; అందువల్ల అనిశ్చిత లేదా పునరావృత భావమున్న ‘తెరిచినప్పుడల్లా’ కంటే ‘తెరిచినప్పుడు’ సహజంగా, సందర్భానుగుణంగా ఉంది.
- source_word: ἤνοιξεν
  choice: తెరిచిన
  rationale: ἀνοίγω యొక్క మౌలిక భావం ‘తెరవడం.’ ‘ముద్రను విరిచి తెరిచిన’ అని అనువదిస్తే మూలపాఠంలో స్పష్టంగా లేని విధానాన్ని చేర్చినట్టవుతుంది.
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: ఏడవ ముద్రను
  rationale: σφραγίςకు స్థిరమైన తెలుగు సమానం ‘ముద్ర’; క్రమసంఖ్యను సహజ తెలుగు పదక్రమంలో దాని ముందు ఉంచాం.
- source_word: ἐγένετο
  choice: నెలకొంది
  rationale: ఇక్కడ γίνομαι ఒక స్థితి ఏర్పడటాన్ని సూచిస్తుంది. ‘నిశ్శబ్దం నెలకొంది’ అనేది ‘నిశ్శబ్దం కలిగింది’ కంటే సహజమైన, గంభీరమైన తెలుగు వ్యక్తీకరణ.
- source_word: σιγὴ
  choice: నిశ్శబ్దం
  rationale: ఈ పదం మౌనం లేదా నిశ్చల నిశ్శబ్దాన్ని సూచిస్తుంది; దర్శనంలోని గంభీరమైన విరామాన్ని ‘నిశ్శబ్దం’ సముచితంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలో
  rationale: సందర్భంలో οὐρανός భౌతిక ఆకాశాన్ని కాక పరలోక ప్రదేశాన్ని సూచిస్తోంది.
- source_word: ὡς ἡμιώριον
  choice: దాదాపు అరగంటసేపు
  rationale: ὡς కాలపరిమాణానికి సుమారు అనే భావాన్ని ఇస్తుంది; ‘సేపు’ వ్యవధిని సహజ తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ἤνοιξενలో అంతర్నిహిత కర్త ఎవరనేది
  choice: ‘ఆయన’ అని ఉంచి, ఈ వచనంలో పేరుతో గుర్తించలేదు.
  alternative: ‘గొర్రెపిల్ల’ అని స్పష్టంగా పేర్కొనడం.
  rationale: గ్రీకులో మూడవ పురుష ఏకవచన కర్త క్రియలో అంతర్నిహితంగా ఉంది; ముందటి సందర్భం అది గొర్రెపిల్లను సూచిస్తుందని తెలియజేస్తుంది. అయినప్పటికీ ఈ వచనంలో లేని పేరును చేర్చకుండా ‘ఆయన’ అని ఉంచడం మూలపాఠ నిర్మాణానికి దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే దర్శనంలోని గంభీరత నిలిచే విధంగా అనువదించబడింది. మూలంలో ఉన్న భావాన్ని మించి ‘ముద్రను విరిచాడు’ వంటి వివరణను చేర్చలేదు.
