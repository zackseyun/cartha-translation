id: REV.8.11
reference: Revelation 8:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: te
  text: ఆ నక్షత్రం పేరు “విషమూలిక”[a] అంటారు. నీళ్లలో మూడవ వంతు విషమూలికగా మారింది. ఆ నీళ్లవల్ల అనేకమంది చనిపోయారు[b], ఎందుకంటే అవి చేదుగా చేయబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అబ్సింత్.” గ్రీకు Ἄψινθος/ἄψινθον అనేది వార్మ్‌వుడ్ అనే చేదైన మొక్కను సూచిస్తుంది. ఒకే పదాన్ని మళ్లీ వాడడం నక్షత్రం పేరును నీళ్ల చేదుతో అనుసంధానిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: చివరి మాటను మరింత స్పష్టంగా, “ఎందుకంటే ఆ నీళ్లు చేదుగా చేయబడ్డాయి” అని అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄνομα
  choice: పేరు
  rationale: నక్షత్రానికి ఉన్న పేరును సూచించే సహజమైన, నేరుగా సరిపోయే తెలుగు పదం.
- source_word: ἀστέρος
  choice: నక్షత్రం
  rationale: దర్శన సాహిత్యంలోని ఖగోళ రూపకాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λέγεται
  choice: అని పేరు
  rationale: గ్రీకు వర్తమాన కర్మణి రూపమైన ‘అని పిలువబడుతుంది’ అనే భావాన్ని తెలుగులో అనవసరమైన భారంలేకుండా సహజంగా తెలియజేస్తుంది.
- source_word: Ἄψινθος / ἄψινθον
  choice: మాచిపత్రి / మాచిపత్రి
  rationale: చేదు గల wormwood మొక్కకు వాడే తెలుగు పేరు. నక్షత్రం పేరులోనూ, నీళ్లకు కలిగిన మార్పులోనూ ఒకే పదాన్ని పునరావృతం చేసి మూలంలోని ఉద్దేశపూర్వక పదబంధాన్ని నిలుపుతుంది.
- source_word: ἐγένετο
  choice: మారింది
  rationale: εἰς తో కలిసి వచ్చినప్పుడు కలిగిన పరివర్తన లేదా ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: నీళ్లలో మూడవ వంతు
  rationale: భాగార్థక నిర్మాణాన్నీ, పరిమాణాన్నీ స్పష్టంగా కాపాడే సహజమైన తెలుగు రూపం.
- source_word: εἰς ἄψινθον
  choice: మాచిపత్రిగా
  rationale: నీళ్లు మాచిపత్రిగా మారాయనే మూలంలోని స్పష్టమైన రూపకాన్ని మృదువుచేయకుండా నిలుపుతుంది; కేవలం ‘చేదుగా’ అని మాత్రమే మార్చలేదు.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: అనేకమంది
  rationale: లింగభేదాన్ని సూచించకుండా అనేక మంది మనుషులను సహజంగా సూచిస్తుంది; తెలుగు సందర్భంలో ‘మనుషులలో అనేకమంది’ కంటే సంక్షిప్తంగా ఉంటుంది.
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: ఆ నీళ్లవల్ల ... చనిపోయారు
  rationale: ἐκ సూచించే కారణాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలో లేని ‘తాగి’ అనే వివరాన్ని చేర్చదు.
- source_word: ὅτι ἐπικράνθησαν
  choice: ఎందుకంటే అవి చేదుగా చేయబడ్డాయి
  rationale: కర్మణి భావాన్నీ, ముందున్న నీళ్లనే సర్వనామం సూచిస్తుందనే సహజ అన్వయాన్నీ కాపాడుతుంది.
theological_decisions:
- issue: ἐπικράνθησαν అనే కర్మణి క్రియకు పూర్వపదం
  choice: ‘అవి’ అనేది నీళ్లను సూచిస్తుంది.
  alternative: మనుషులు చేదెక్కారు లేదా అస్వస్థులయ్యారు అనే అన్వయం.
  rationale: వ్యాకరణపరంగా సమీపంలోని బహువచన పూర్వపదం నీళ్లే; సందర్భంలో కూడా నీళ్లు చేదుగా చేయబడినందువల్ల మరణాలు సంభవించాయని అర్థం సరిపోతుంది. పాదటిప్పణిలో పూర్వపదాన్ని మరింత స్పష్టంగా చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘జలాలు’ కంటే సహజమైన ‘నీళ్లు’ ఎంచుకోబడింది. మూలంలోని ‘మాచిపత్రి’ పదపునరుక్తినీ, కర్మణి నిర్మాణాన్నీ సాధ్యమైనంతవరకు నిలుపుతూ తెలుగు వాక్యప్రవాహం సహజంగా ఉంచబడింది.
