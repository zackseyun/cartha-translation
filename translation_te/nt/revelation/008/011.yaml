revisions:
- from: ఆ నక్షత్రానికి “మాచిపత్రి”[a] అని పేరు. నీళ్లలో మూడవ వంతు మాచిపత్రిగా మారింది. ఆ నీళ్లవల్ల అనేకమంది చనిపోయారు[b], ఎందుకంటే అవి చేదుగా చేయబడ్డాయి.
