id: REV.8.8
reference: Revelation 8:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: te
  text: రెండవ దూత బూర ఊదాడు. అప్పుడు అగ్నితో మండుతున్న గొప్ప పర్వతంలాంటిది[a] సముద్రంలోకి విసిరివేయబడింది; సముద్రపు మూడవ వంతు రక్తంగా మారింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అగ్నితో మండుతున్న గొప్ప పర్వతంలా’; గ్రీకు పదం ఇది పోలిక అని సూచిస్తుంది, అది నిజంగా పర్వతమేనని తప్పనిసరిగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: బూర ఊదాడు
  rationale: σαλπίζω అంటే బూరను ఊదడం లేదా మోగించడం. తెలుగులో సందర్భానికి సహజంగా, స్పష్టంగా ఉండేందుకు క్రియలో అంతర్లీనంగా ఉన్న వాద్యాన్ని ‘బూర’గా పేర్కొన్నాం.
- source_word: ὡς
  choice: లాంటిది
  rationale: ὡς ఇక్కడ వస్తువు నిజంగా పర్వతమేనని కాక, పర్వతాన్ని పోలి ఉందని సూచిస్తుంది. ‘లాంటిది’ ఆ సాదృశ్యాన్ని, వస్తువు స్వరూపంపై ఉన్న అనిశ్చితిని నిలుపుతుంది.
- source_word: ὄρος μέγα
  choice: గొప్ప పర్వతం
  rationale: మూలంలోని నామవాచక-విశేషణ పదబంధాన్ని నేరుగా అందిస్తుంది; ‘గొప్ప’ ప్రకటన గ్రంథంలోని గంభీరమైన దృశ్యశైలిని నిలుపుతుంది.
- source_word: πυρὶ καιόμενον
  choice: అగ్నితో మండుతున్న
  rationale: దత్తివిభక్తిలోని πυρί మరియు καιόμενον కలిసి అగ్నితో మండుతున్న దృశ్యాన్ని వ్యక్తం చేస్తాయి. అది అగ్నిపర్వతమా, ఉల్కా, లేక ప్రతీకా అని నిర్ణయించకుండా మూలచిత్రాన్ని నిలుపుతుంది.
- source_word: ἐβλήθη
  choice: విసిరివేయబడింది
  rationale: కర్త తెలియజేయని భూతకాల కర్మణి రూపాన్ని నిలుపుతుంది. ‘విసిరివేయబడింది’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలో లేని అదనపు తీవ్రతను చేర్చదు.
- source_word: εἰς τὴν θάλασσαν
  choice: సముద్రంలోకి
  rationale: θάλασσα పదానికి సాధారణమైన, నేరమైన తెలుగు సమానార్థకం ‘సముద్రం’; εἰς సూచించే లోపలికి కదలికను ‘లోకి’ తెలియజేస్తుంది.
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: సముద్రంలో మూడవ వంతు
  rationale: ఈ భాగసూచక పదబంధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ప్రకటన గ్రంథంలో పునరావృతమయ్యే పరిమాణాత్మక తీర్పు భావాన్ని నిలుపుతుంది.
- source_word: αἷμα
  choice: రక్తం
  rationale: మూలపదానికి నేరమైన అర్థం ‘రక్తం’. దానిని ప్రతీకాత్మకంగా లేదా రూపకాలంకారంగా విస్తరించకుండా వాక్యం చెప్పినట్లే ఉంచాం.
theological_decisions:
- issue: పర్వతంలా కనిపించిన వస్తువు స్వరూపం
  choice: గ్రీకు మూలంలోని పోలికను మాత్రమే వ్యక్తం చేసి, ఆ వస్తువును నిర్దిష్టంగా గుర్తించలేదు.
  alternative: దానిని అక్షరార్థమైన పర్వతంగా, ఉల్కవంటి వస్తువుగా, లేదా తీర్పుకు ప్రతీకగా నిర్ధారించడం.
  rationale: ὡς సాదృశ్యాన్ని సూచిస్తుంది. కాబట్టి ఈ దర్శనచిత్రం అక్షరార్థమా, ప్రతీకాత్మకమా, లేక రెండూ కలిసినదా అనే ఉద్రిక్తతను అనువాదం పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన దర్శనశైలిని అనుసరించాం. చిన్న వాక్యవిభజన పఠనసౌలభ్యాన్ని పెంచుతుంది; పోలికలోని అస్పష్టతను పాదసూచికతో సంరక్షించాం.
