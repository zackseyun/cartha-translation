id: REV.8.10
reference: Revelation 8:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: te
  text: మూడవ దూత బూర ఊదాడు; అప్పుడు ఆకాశం[a] నుండి కాగడాలా[b] మండుతున్న ఒక గొప్ప నక్షత్రం[c] పడింది. అది నదులలో మూడవ వంతుపైనా, నీటి ఊటలపైనా పడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరలోకం నుండి’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం ఆకాశాన్ని లేదా పరలోకాన్ని సూచించగలదు; ఈ దర్శన సందర్భంలో ‘ఆకాశం’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘దివిటీలా’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం కాగడాను లేదా దీపాన్ని సూచించగలదు; మండుతూ పడుతున్న నక్షత్రం అనే చిత్రానికి ‘కాగడా’ మరింత సరిపోతుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘నక్షత్రం’ అనే చిత్రాన్ని అలాగే ఉంచాం. ఇది దేవదూతసంబంధ జీవిని, ఉల్కలాంటి వస్తువును, లేదా ప్రతీకాత్మక శక్తిని సూచిస్తుందా అనే విషయంలో వ్యాఖ్యాతలు భిన్నంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: బూర ఊదాడు
  rationale: σαλπίζω అంటే బూరను ఊదడం లేదా మోగించడం. ఆధునిక తెలుగులో ‘బూర ఊదాడు’ సహజంగా ఉండి, గ్రీకు క్రియలో అంతర్లీనంగా ఉన్న వాద్యాన్ని స్పష్టం చేస్తుంది.
- source_word: ἀστὴρ μέγας
  choice: ఒక గొప్ప నక్షత్రం
  rationale: μέγας పరిమాణంతో పాటు మహత్తు లేదా అసాధారణతను కూడా సూచించగలదు. ‘గొప్ప’ అనే పదం ఆ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ఆకాశం నుండి
  rationale: οὐρανός ఇక్కడ నక్షత్రం కిందికి పడే దృశ్య స్థలాన్ని సూచిస్తుంది. తెలుగులో ‘ఆకాశం నుండి’ ఈ చిత్రాన్ని సహజంగా తెలియజేస్తుంది; ‘పరలోకం నుండి’ కూడా సాధ్యమే కాని అది భావాన్ని మరింత ధార్మికంగా నిర్దిష్టం చేయవచ్చు.
- source_word: καιόμενος ὡς λαμπάς
  choice: దివిటీలాగా మండుతున్న
  rationale: καιόμενος మండుతున్న స్థితిని, λαμπάς వెలిగే దివిటీ లేదా కాగడాను సూచిస్తుంది. ‘దివిటీలాగా మండుతున్న’ ఉపమానాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: పడింది ... అది ... పడింది
  rationale: మూలంలో ἔπεσεν రెండుసార్లు రావడం—మొదట కిందికి రావడం, తరువాత దేనిమీద పడిందో చెప్పడం—లయను, ఉద్ఘాటనను కలిగిస్తుంది; తెలుగులోనూ ఆ పునరుక్తిని నిలిపాం.
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: నదుల్లో మూడవ వంతు మీద
  rationale: τὸ τρίτον పరిమాణాత్మకంగా మూడింట ఒక వంతును సూచిస్తుంది. ఈ రూపం నదుల మొత్తం సంఖ్య లేదా సముదాయంలో మూడవ వంతుపై ప్రభావం పడిందనే భావాన్ని అందిస్తుంది.
- source_word: πηγὰς τῶν ὑδάτων
  choice: నీటి ఊటల మీద
  rationale: πηγή సహజంగా ఉబికి వచ్చే నీటి ఊటను సూచిస్తుంది. గ్రీకు బహువచన భావాన్ని తెలుగులో సహజమైన ‘నీటి ఊటలు’గా అందించాం.
theological_decisions:
- issue: పడుతున్న నక్షత్రం దేనిని సూచిస్తుంది?
  choice: ‘ఒక గొప్ప నక్షత్రం’ అనే దర్శన చిత్రాన్ని యథాతథంగా ఉంచడం
  alternative: దేవదూతసంబంధ జీవి, ఉల్కలాంటి వస్తువు, లేదా ప్రతీకాత్మక అధికారం అని వ్యాఖ్యానించడం
  rationale: ఈ వచనం దానిని ‘నక్షత్రం’ అని మాత్రమే పేర్కొంటుంది; అది సూచించే వ్యక్తి లేదా శక్తిని నిర్దిష్టంగా గుర్తించదు. అందువల్ల సాధ్యమైన ప్రతీకార్థాల్లో ఒక్కదానిని అనువాదంలోకి చేర్చలేదు.
- issue: οὐρανός యొక్క భావం
  choice: ‘ఆకాశం’
  alternative: ‘పరలోకం’
  rationale: పడుతున్న నక్షత్రం అనే దృశ్య సందర్భంలో ‘ఆకాశం’ సహజంగా సరిపోతుంది. అయితే గ్రీకు పదం ‘పరలోకం’ అనే భావాన్నీ కలిగి ఉండగలదని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, ప్రకటన గ్రంథపు గంభీరమైన దర్శన శైలిని నిలుపుతూ అనువదించబడింది. మూలంలోని రెండు ‘పడింది’ క్రియలను ఉద్దేశపూర్వకంగా నిలిపాం.
