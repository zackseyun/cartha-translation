    issue: The phrase “నదుల్లో మూడవ వంతు మీద” is unclear and unidiomatic.
    rationale: ἐπὶ τὸ τρίτον τῶν ποταμῶν means ‘upon a third of the rivers,’ not ‘on a third within the rivers.’
  - severity: low
    issue: The torch/lamp lexical alternative and the interpretive note on ‘star’ are merged under one footnote marker.
    rationale: They concern distinct source expressions and should have distinct anchors, preserving the audit trail and making each note’s scope clear.
