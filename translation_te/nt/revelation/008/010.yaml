  verdict: revise
  source_fidelity: The draft accurately retains the third angel, the trumpet action, the falling great star, the burning-torch simile, and the repeated verb for falling. However, “నదుల్లో మూడవ వంతు మీద” is syntactically awkward and can suggest a fraction within the rivers rather than ‘upon one-third of the rivers.’
