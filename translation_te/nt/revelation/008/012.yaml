id: REV.8.12
reference: Revelation 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: te
  text: నాలుగవ దూత బూర ఊదాడు. అప్పుడు సూర్యుని మూడవ వంతు, చంద్రుని మూడవ వంతు, నక్షత్రాల మూడవ వంతు దెబ్బతిన్నాయి. దాంతో వాటి మూడవ వంతు చీకటిగా మారింది; పగలు మూడవ వంతు సమయం ప్రకాశించలేదు[a], రాత్రి కూడా అలాగే ప్రకాశించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పగలు మూడవ వంతు సమయం ప్రకాశించకుండా ఉండేలా.” గ్రీకు నిర్మాణం ఇక్కడ ఫలితంతో పాటు ఉద్దేశాన్ని సూచించే ఛాయను కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: బూర ఊదాడు
  rationale: σαλπίζω అంటే బూరను మోగించడం. ఆధునిక తెలుగులో ‘బూర ఊదాడు’ సహజంగా ఉండి క్రియలో అంతర్లీనమైన వాద్యాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐπλήγη
  choice: దెబ్బతిన్నాయి
  rationale: πλήσσω యొక్క కర్మణి రూపం ‘కొట్టబడడం/దెబ్బతినడం’ అనే తీర్పు భావాన్ని ఇస్తుంది. సంయుక్త కర్తలను దృష్టిలో ఉంచుకొని తెలుగులో బహువచనంగా ఇచ్చాం.
- source_word: τὸ τρίτον
  choice: మూడవ వంతు
  rationale: పరిమాణాన్ని కచ్చితంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలోని పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: ἥλιος / σελήνη / ἀστέρες
  choice: సూర్యుడు / చంద్రుడు / నక్షత్రాలు
  rationale: ఇవి సూటిగా ఉన్న ఖగోళ పదాలు; సందర్భంలో విభక్తులతో ‘సూర్యునిలో… చంద్రునిలో… నక్షత్రాలలో’ అని అనువదించాం.
- source_word: ἵνα
  choice: దాంతో
  rationale: ఇక్కడ ἵνα ఉద్దేశం లేదా ఫలితం రెండింటినీ సూచించగలదు. ప్రధాన వాక్యంలో సహజమైన ఫలిత భావాన్ని ఇచ్చి, ఉద్దేశ ఛాయను పాదసూచికలో నిలిపాం.
- source_word: σκοτισθῇ
  choice: చీకటిపడింది
  rationale: కాంతి కోల్పోవడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ఆ చీకటి వాటికి సంభవించినదనే కర్మణి భావాన్ని సందర్భం నిలుపుతుంది.
- source_word: αὐτῶν
  choice: వాటిలో
  rationale: బహువచన సర్వనామం సూర్యుడు, చంద్రుడు, నక్షత్రాలను సమష్టిగా తిరిగి సూచిస్తుంది.
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: పగలు … ప్రకాశించలేదు
  rationale: φαίνω ఇక్కడ ‘ప్రకాశించు’ అనే అర్థంలో ఖగోళ చీకటి సందర్భానికి సరిపోతుంది. ‘పగలు’ సాధారణ ఆధునిక తెలుగు పదం.
- source_word: τὸ τρίτον αὐτῆς
  choice: తన కాలంలో మూడవ వంతు
  rationale: దినకాలంలో ప్రభావితమైన పరిమాణం/వ్యవధిని స్పష్టం చేస్తుంది; ‘తన’ పగలునే తిరిగి సూచిస్తుంది.
- source_word: ἡ νὺξ ὁμοίως
  choice: రాత్రి కూడా అలాగే అయింది
  rationale: రాత్రికి కూడా అదే పరిమితి వర్తించిందనే సంక్షిప్త మూలవాక్య భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఖగోళ తీర్పు దృశ్య స్వభావం
  choice: ఖగోళ కాంతులు చీకటిపడిన అపోకలిప్టిక్ తీర్పు దృశ్యాన్ని సూటిగా అనువదించడం
  alternative: దీనిని పూర్తిగా అక్షరార్థ ఖగోళ సంఘటనగా లేదా పూర్తిగా ప్రతీకాత్మక రాజకీయ/విశ్వ దృశ్యంగా నిర్దేశించడం
  rationale: ఈ వచనం దృశ్యాన్ని వివరిస్తుంది గాని అది అక్షరార్థమా, ప్రతీకాత్మకమా, రెండూ కలిసినదా అని తేల్చదు. అనువాదం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: ἵνα నిర్మాణంలోని ఉద్దేశం–ఫలితం ఛాయ
  choice: ప్రధాన పాఠ్యంలో ఫలిత భావంతో ‘దాంతో… ప్రకాశించలేదు’
  alternative: ఉద్దేశ లేదా సంభావ్య ఛాయతో ‘ప్రకాశించకుండా ఉండేలా’
  rationale: ἵνα ఉద్దేశాన్ని లేదా ఫలితాన్ని వ్యక్తం చేయగలదు. కథన ప్రవాహంలో ఫలిత భావం సహజమైనది; ప్రత్యామ్నాయ ఛాయను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. మూలంలోని ‘మూడవ వంతు’ పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
