revisions:
- from: నాలుగవ దూత బూర ఊదాడు. అప్పుడు సూర్యునిలో మూడవ వంతు, చంద్రునిలో మూడవ వంతు, నక్షత్రాలలో మూడవ వంతు దెబ్బతిన్నాయి. దాంతో వాటిలో మూడవ వంతు చీకటిపడింది; పగలు తన కాలంలో మూడవ వంతు ప్రకాశించలేదు[a]; రాత్రి కూడా అలాగే అయింది.
  to: నాలుగవ దూత బూర ఊదాడు. అప్పుడు సూర్యుని మూడవ వంతు, చంద్రుని మూడవ వంతు, నక్షత్రాల మూడవ వంతు దెబ్బతిన్నాయి. దాంతో వాటి మూడవ వంతు చీకటిగా మారింది; పగలు మూడవ వంతు సమయం ప్రకాశించలేదు[a], రాత్రి కూడా అలాగే ప్రకాశించలేదు.
  rationale: భాగార్థ సంబంధాన్ని తెలుగులో స్పష్టంగా చేయడానికి ‘సూర్యుని/చంద్రుని/నక్షత్రాల మూడవ వంతు’గా మార్చబడింది. పగలు-రాత్రులపై ఒకే విధమైన ప్రభావాన్ని మూలం స్పష్టంగా కలుపుతుంది కాబట్టి, చివరి వాక్యంలో ‘ప్రకాశించలేదు’ అనే క్రియను రాత్రికి కూడా చెప్పబడింది. ἵνα యొక్క ఫలిత భావాన్ని ప్రధాన పాఠ్యంలో ‘దాంతో’ ద్వారా, ఉద్దేశ-ఛాయను పాదసూచికలో నిలుపుతున్నాం.
