id: REV.8.2
reference: Revelation 8:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: te
  text: దేవుని ఎదుట నిలిచివున్న ఆ ఏడుగురు దేవదూతలను నేను చూశాను[a]. వారికి ఏడు బూరలు ఇవ్వబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుని ఎదుట నిలబడివున్న’ లేదా ‘దేవుని ఎదుట నిలిచి ఉన్న’; గ్రీకు పర్ఫెక్ట్ క్రియ వారు నిలిచిన స్థితి కొనసాగుతున్నదని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: నేను చూశాను
  rationale: దర్శన వర్ణనలోని ఆరిస్ట్ క్రియను సహజమైన ఆధునిక తెలుగులో గతకాలంగా వ్యక్తపరుస్తుంది; ‘తిలకించాను’ అనవసరంగా ప్రాచీన శైలిని తెస్తుంది.
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: ఆ ఏడుగురు దేవదూతలను
  rationale: నిర్దిష్ట ఉపపదం మరియు సంఖ్య సూచించే ప్రత్యేక సమూహాన్ని ‘ఆ’ ద్వారా స్పష్టంగా చూపిస్తుంది; వ్యక్తులను సూచిస్తున్నందున ‘ఏడుగురు’ సహజం.
- source_word: ἀγγέλους
  choice: దేవదూతలను
  rationale: పరలోక సింహాసన సందర్భంలో మానవ సందేశకులు కాక దేవదూతలే ఉద్దేశించబడ్డారు.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని ఎదుట
  rationale: స్థానికతతో పాటు సన్నిధి భావాన్ని కూడా సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἑστήκασιν
  choice: నిలిచివున్న
  rationale: పర్ఫెక్ట్ క్రియలోని, ముందుగా నిలిచి ఇప్పుడు కూడా ఆ స్థితిలో కొనసాగుతున్న భావాన్ని తెలుగు సంయుక్త రూపం సహజంగా తెలియజేస్తుంది.
- source_word: ἐδόθησαν αὐτοῖς
  choice: వారికి ... ఇవ్వబడ్డాయి
  rationale: ఇచ్చినవారిని పేర్కొనకుండా గ్రీకు కర్మణి నిర్మాణాన్ని నిలుపుతుంది; ‘వారు పొందారు’ అని క్రియాశీల దృష్టికోణానికి మార్చదు.
- source_word: σάλπιγγες
  choice: బూరలు
  rationale: ప్రకటన గ్రంథంలోని తీర్పు సంకేత సందర్భానికి సరిపోయే, సాధారణ తెలుగు బైబిలు పాఠకులకు అర్థమయ్యే పదం.
theological_decisions:
- issue: ఏడుగురు దేవదూతల గుర్తింపు మరియు హోదా
  choice: ‘దేవుని ఎదుట నిలిచివున్న ఆ ఏడుగురు దేవదూతలు’ అని మాత్రమే అనువదించడం
  alternative: ‘ఏడుగురు ప్రధాన దూతలు’ లేదా తరువాతి సంప్రదాయంలోని ప్రత్యేక దేవదూతలతో వారిని గుర్తించడం
  rationale: గ్రీకు పాఠం వారిని నిర్దిష్టమైన ఏడుగురు దేవదూతలుగా చెబుతుంది గాని ἀρχάγγελοι (‘ప్రధాన దూతలు’) అని పిలవదు, వారి హోదాను మరింత నిర్వచించదు. అందువల్ల తరువాతి సంప్రదాయాన్ని పాఠంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ‘దేవదూతలు’, ‘బూరలు’ వంటి పరిచిత పదాలను వాడి, గ్రీకు పాఠంలోని నిర్దిష్టత, కర్మణి నిర్మాణం, కొనసాగుతున్న స్థితి భావాన్ని నిలిపాం.
