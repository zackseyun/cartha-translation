id: REV.8.5
reference: Revelation 8:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: te
  text: దూత ధూపపాత్రను తీసుకొని, బలిపీఠం మీదున్న అగ్నితో దాన్ని నింపి, భూమి మీదికి విసిరాడు. అప్పుడు ఉరుములు, శబ్దాలు[a], మెరుపులు, భూకంపం సంభవించాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్వరాలు.” గ్రీకు పదం ఈ సందర్భంలో పలికిన స్వరాలను గానీ, ఇతర శబ్దాలను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴληφεν
  choice: తీసుకొని
  rationale: పరిపూర్ణ కాలరూపానికి ఫలితభావం ఉన్నప్పటికీ, తరువాతి క్రియలతో కూడిన కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λιβανωτόν
  choice: ధూపపాత్ర
  rationale: ధూపం వేయడానికి, బలిపీఠపు నిప్పులను మోయడానికి ఉపయోగించే ఆరాధనా పాత్రను సంక్షిప్తంగా, సందర్భోచితంగా సూచిస్తుంది.
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: బలిపీఠం మీదున్న అగ్నితో దాన్ని నింపి
  rationale: పాత్రను నింపిన అగ్ని బలిపీఠం నుండి తీసుకున్నదనే మూలపాఠ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: θυσιαστηρίου
  choice: బలిపీఠం
  rationale: దేవాలయ, ఆరాధనా దృశ్యాలలో ఈ గ్రీకు పదానికి ప్రామాణికమైన తెలుగు సమానం.
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: భూమి మీదికి విసిరాడు
  rationale: βάλλω లోని బలమైన చర్యను ‘విసిరాడు’ తెలియజేస్తుంది; ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త తీర్పు సందర్భంలో γῆ కి ‘భూమి’ తగినది.
- source_word: ἐγένοντο
  choice: సంభవించాయి
  rationale: ఆ దృగ్విషయాలు, శ్రవణవిషయాలు అకస్మాత్తుగా ఏర్పడినట్లు సహజంగా తెలియజేస్తుంది.
- source_word: βρονταὶ
  choice: ఉరుములు
  rationale: బహువచనంలో ఉన్న పునరావృత ఉరుముల భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: φωναὶ
  choice: శబ్దాలు
  rationale: మాట్లాడేవారు ఎవరూ పేర్కొనబడనందున, వ్యక్త స్వరాలా లేక ఇతర ధ్వనులా అన్న అస్పష్టతను అతిగా నిర్ణయించకుండా ఉంచుతుంది.
- source_word: ἀστραπαὶ
  choice: మెరుపులు
  rationale: బహువచనంలోని మెరుపు ప్రకాశాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: σεισμός
  choice: భూకంపం
  rationale: ఏకవచన నామపదానికి సూటిగా, ప్రామాణికంగా సరిపోతుంది.
theological_decisions:
- issue: అంత్యకాల తీర్పు సందర్భంలో γῆ అర్థం
  choice: భూమి
  alternative: నేల; దేశం
  rationale: ఈ దృశ్యం విశ్వవ్యాప్త తీర్పు చిత్రణలో ఉన్నందున ‘భూమి’ విస్తృత పరిధిని నిలుపుతుంది; ‘నేల’ భావాన్ని అనవసరంగా కుదిస్తుంది, ‘దేశం’ స్థానిక పరిధిని సూచించవచ్చు.
- issue: దైవ ప్రత్యక్షతను సూచించే పదబంధంలో φωναί అర్థం
  choice: శబ్దాలు
  alternative: స్వరాలు
  rationale: మాట్లాడేవారు గుర్తించబడలేదు. అందువల్ల ప్రధాన పాఠంలో ‘శబ్దాలు’ ఉంచి, వ్యక్తమైన స్వరాలు కావచ్చనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ఆరాధనా సందర్భానికి ‘ధూపపాత్ర’, ‘బలిపీఠం’ వంటి సుపరిచిత పదాలు నిలుపబడ్డాయి; φωναί లోని అస్పష్టత పాదసూచిక ద్వారా సంరక్షించబడింది.
