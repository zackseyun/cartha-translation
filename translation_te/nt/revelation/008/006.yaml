source:
  edition: SBLGNT
  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: te
  text: ఏడు బూరలు పట్టుకున్న ఆ ఏడుగురు దేవదూతలు వాటిని ఊదడానికి సిద్ధమయ్యారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బూరలు మోగించడానికి.” గ్రీకు క్రియకు ‘బూర ఊదడం, బూర మోగించడం’ అనే అర్థం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελοι
  choice: దేవదూతలు
  rationale: ప్రకటన గ్రంథంలోని ఈ పరలోక దర్శన సందర్భంలో ఈ పదం మానవ సందేశకులను కాక పరలోక దేవదూతలను సూచిస్తుంది.
- source_word: ἔχοντες
  choice: పట్టుకున్న
  rationale: ఏడు బూరలు వారి చేతిలో ఉన్నాయనే దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: σάλπιγγας
  choice: బూరలు
  rationale: బూర అనే పదం వాయించి సంకేతమిచ్చే వాద్యాన్ని సహజంగా సూచిస్తూ, ప్రకటన గ్రంథపు సందర్భానికి తగిన గంభీరతను నిలుపుతుంది.
- source_word: ἡτοίμασαν αὑτοὺς
  choice: సిద్ధమయ్యారు
  rationale: గ్రీకు క్రియతో కూడిన ఆత్మవాచక సర్వనామం తెలిపే స్వీయ సిద్ధతను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἵνα σαλπίσωσιν
  choice: వాటిని ఊదడానికి
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని క్రియార్థక రూపంలో సహజంగా వ్యక్తపరుస్తుంది; 'వాటిని' అనేది సమీపంలోని ఏడు బూరలను స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: దర్శన సందర్భంలో ἄγγελοι ఎవరిని సూచిస్తుంది
  choice: పరలోక దేవదూతలు
  alternative: మానవ సందేశకులు
  rationale: ప్రకటన 8లోని పరలోక ఆరాధన మరియు అంత్యకాల బూరల సందర్భం పరలోక జీవులనే బలంగా సూచిస్తుంది; దీనికి మించిన సిద్ధాంతార్థాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, దర్శన దృశ్యానికి తగిన గంభీరతతో రూపొందించబడింది. సంఖ్యావాచక పునరుక్తి మూలంలోని ‘ఏడు బూరలు—ఏడుగురు దేవదూతలు’ నిర్మాణాన్ని నిలుపుతుంది.
