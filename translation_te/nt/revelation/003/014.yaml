id: REV.3.14
reference: Revelation 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: te
  text: 'లవొదికయలోని సంఘపు దూతకు[a] ఇలా రాయి: ఆమేన్ అనబడేవాడు, నమ్మకమైన, సత్యమైన సాక్షి, దేవుని సృష్టికి ఆది[b] అయినవాడు ఇలా అంటున్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దూత’ అని అనువదించిన పదానికి ‘సందేశకుడు’ అనే అర్థం కూడా రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆది’కి మూలమైన గ్రీకు పదానికి ‘మూలం/ఆరంభకర్త’ లేదా ‘పాలకుడు’ అనే అర్థాలు కూడా రావచ్చు. అందువల్ల ఈ మాటను ‘దేవుని సృష్టికి మూలమైనవాడు’ లేదా ‘దేవుని సృష్టిపై పాలకుడు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: దూతకు
  rationale: ఈ పదానికి దేవదూత లేదా మానవ సందేశకుడు అనే అర్థాలు రావచ్చు. ప్రకటన గ్రంథంలో ఏడు సంఘాలకు ఇచ్చిన సంబోధన సూత్రంలో ‘దూత’ సహజమైన ప్రధాన అనువాదం; మరో సాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: Τάδε λέγει
  choice: చెప్పే మాటలు ఇవి
  rationale: ప్రవచనాత్మక ప్రకటన సూత్రాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా వినిపించే రూపం.
- source_word: ὁ Ἀμήν
  choice: ఆమేన్‌ అనబడేవాడు
  rationale: ఇది క్రీస్తుకు వర్తించిన ప్రత్యేక బిరుదు. నిశ్చయత, సత్యం అనే హీబ్రూ నేపథ్య ప్రతిధ్వనిని కాపాడేందుకు ‘ఆమేన్’ను లిప్యంతరీకరించాం.
- source_word: ὁ μάρτυς ὁ πιστὸς καὶ ἀληθινός
  choice: నమ్మకమైన సత్యసాక్షి
  rationale: ‘సాక్షి’ సాక్ష్యమిచ్చే భావాన్ని కాపాడుతుంది; ‘నమ్మకమైన’ విశ్వసనీయతను, ‘సత్య’ నిజత్వాన్ని సహజమైన తెలుగు సమాసంలో తెలియజేస్తాయి.
- source_word: ἡ ἀρχὴ
  choice: ఆది
  rationale: ἀρχή పదంలోని ‘ఆరంభం’ అనే ప్రత్యక్ష అర్థాన్ని సంక్షిప్తంగా కాపాడుతుంది. ‘మూలం’ లేదా ‘పాలకుడు’ అనే సాధ్యమైన అర్థాలను ప్రధాన పాఠ్యంలో నిర్ణయాత్మకంగా చేర్చకుండా పాదసూచికలో తెలిపాం.
- source_word: τῆς κτίσεως τοῦ θεοῦ
  choice: దేవుని సృష్టికి
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తూ ‘దేవుని సృష్టి’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ అనే క్రీస్తు సంబంధ బిరుదు యొక్క అర్థం
  choice: దేవుని సృష్టికి ఆది
  alternative: దేవుని సృష్టికి మూలం/ఆరంభకర్త; దేవుని సృష్టిపై పాలకుడు
  rationale: ἀρχή పదం ‘ఆది,’ ‘మూలం,’ లేదా ‘పాలకుడు’ అనే భావాలను వ్యక్తం చేయగలదు. ప్రధాన పాఠ్యం ప్రత్యక్షమైన ‘ఆది’ని ఉంచి, వివాదాస్పదమైన క్రీస్తు సంబంధ భావాన్ని అనువాదంలోనే పరిష్కరించదు; ఇతర సాధ్యమైన అర్థాలను పాదసూచిక నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. ‘ఆమేన్’ అనే ప్రత్యేక బిరుదును అనువదించకుండా ఉంచాం; ‘ఆది’లోని ఉద్దేశపూర్వక భావసందిగ్ధతను పాదసూచికతో సంరక్షించాం. పాదసూచిక సూచికలను అవి వివరిస్తున్న పదాలకే నేరుగా జతచేశాం.
