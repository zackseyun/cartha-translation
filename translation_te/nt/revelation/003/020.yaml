id: REV.3.20
reference: Revelation 3:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: te
  text: ఇదిగో[a], నేను తలుపు దగ్గర నిలబడి తట్టుతున్నాను. ఎవరైనా నా స్వరం విని తలుపు తెరిస్తే, నేను అతని వద్దకు ప్రవేశించి[b], అతనితో కలిసి భోజనం చేస్తాను[c], అతడు నాతో కలిసి భోజనం చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “చూడండి, నేను తలుపు దగ్గర నిలబడి ఉన్నాను, తట్టుతున్నాను.” “నిలబడి ఉన్నాను” అనే భావమిచ్చే గ్రీకు పరిపూర్ణ కాలరూపం, “తట్టుతున్నాను” అనే వర్తమాన కాలరూపం కలిసి కొనసాగుతున్న స్థితినీ చర్యనూ నొక్కిచెబుతున్నాయి.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “నేను అతని వద్దకు ప్రవేశిస్తాను.” ఈ మాటలు కేవలం ఒక చోటులోకి ప్రవేశించడాన్ని కాక, ఆ వ్యక్తి వద్దకు రావడంలోని సంబంధాత్మక భావాన్ని కూడా కలిగి ఉన్నాయి.'
    reason: lexical_alternative
  - marker: c
    text: కలిసి భోజనం చేసే చిత్రం సన్నిహితమైన పరస్పర సహవాసాన్ని వ్యక్తం చేస్తుంది. ఇది ప్రత్యేకంగా ప్రభుభోజనాన్ని సూచిస్తుందా, విశ్వాసంలోకి రావడాన్ని సూచిస్తుందా, లేక పునరుద్ధరించబడిన సహవాసాన్ని సూచిస్తుందా అనే విషయంలో వ్యాఖ్యాతలు భిన్నంగా అర్థం చేసుకుంటారు; మూలపాఠం దీనిని స్పష్టంగా నిర్ణయించదు.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే గ్రీకు అవ్యయానికి సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు సమానం.
- source_word: ἕστηκα
  choice: నిలబడి
  rationale: పరిపూర్ణ కాలరూపానికి ఇక్కడ వర్తమాన స్థితి భావం ఉంది; ప్రస్తుతం కొనసాగుతున్న నిలిచివుండడాన్ని తెలుపుతుంది.
- source_word: ἐπὶ τὴν θύραν
  choice: తలుపు దగ్గర
  rationale: ప్రవేశద్వారం వద్ద ఉన్న స్థానాన్ని తెలుగు సహజ ప్రయోగంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: κρούω
  choice: తట్టుతున్నాను
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐάν τις
  choice: ఎవరైనా
  rationale: నిర్దిష్టతలేని, అందరినీ కలుపుకొనే షరతును లింగపరిమితి లేకుండా నిలుపుతుంది.
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: నా స్వరం విని
  rationale: φωνή ఇక్కడ కేవలం శబ్దం కాక వ్యక్తిగత స్వరాన్ని సూచిస్తుంది.
- source_word: ἀνοίξῃ τὴν θύραν
  choice: తలుపు తెరిస్తే
  rationale: షరతుగల ఉపవాక్యాన్ని ఆధునిక తెలుగులో నేరుగా, సహజంగా అందిస్తుంది.
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: నేను అతని దగ్గరికి లోపలికి వచ్చి
  rationale: εἰσελεύσομαι లోని లోపలికి ప్రవేశించే భావాన్నీ, πρὸς αὐτόν లోని వ్యక్తివైపు సాగే సంబంధాత్మక భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: δειπνήσω
  choice: కలిసి భోజనం చేస్తాను
  rationale: ప్రధాన భోజనాన్ని పంచుకోవడంలోని సహవాస భావాన్ని, ఒక నిర్దిష్ట సంస్కృతిలోని సాయంకాల భోజనానికే పరిమితం చేయకుండా తెలుపుతుంది.
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: అతనితో కలిసి భోజనం చేస్తాను; అతడు నాతో కలిసి భోజనం చేస్తాడు
  rationale: గ్రీకులోని పరస్పరతను తెలుగులో స్పష్టంగా చూపేందుకు రెండవ భాగంలోని అంతర్భూత క్రియను పునరుక్తి చేసింది.
theological_decisions:
- issue: రూపకాలంకారమైన భోజన సహవాస చిత్రం
  choice: పరస్పర వ్యక్తిగత సహవాసాన్ని సూచించే భోజన చిత్రాన్ని యథాతథంగా ఉంచడం
  alternative: దీనిని ప్రత్యేకంగా ప్రభుభోజనంగా, మారుమనస్సు లేదా రక్షణ అనుభవంగా, లేక సంఘంతో పునరుద్ధరించబడిన సహవాసంగా గుర్తించడం
  rationale: వాక్యం సన్నిహితమైన పరస్పర సహవాసాన్ని స్పష్టంగా చూపుతుంది; అయితే ఆ భోజనం ఏ ప్రత్యేక సిద్ధాంతార్థానికే పరిమితమో మూలపాఠం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. “ఇదిగో” ప్రకటనలోని తక్షణ శ్రద్ధాహ్వానాన్ని నిలుపుతుంది. “అతని” అనే ఏకవచన రూపం గ్రీకు αὐτόν ను అనుసరిస్తుంది; సందర్భంలోని “ఎవరైనా” ఆహ్వానాన్ని అందరికీ తెరిచి ఉంచుతుంది. పరస్పర భోజన సహవాసాన్ని తెలుగులో అస్పష్టత లేకుండా చెప్పేందుకు చివరి అంతర్భూత క్రియను పూర్తిగా వ్యక్తం చేసింది.
