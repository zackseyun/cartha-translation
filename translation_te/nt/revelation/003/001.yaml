- from: '“సార్దీసులో ఉన్న సంఘపు దూతకు ఇలా రాయి: ‘దేవుని ఏడు ఆత్మలనూ, ఏడు నక్షత్రాలనూ కలిగివున్నవాడు చెప్పేవి ఇవే: నీ క్రియలు నాకు తెలుసు. నీవు సజీవుడవని నీకు పేరుంది[a]; కానీ నీవు మృతుడివి.’”'
  to: '“సార్దీసులో ఉన్న సంఘపు దూతకు ఇలా రాయి: ‘దేవుని ఏడు ఆత్మలనూ, ఏడు నక్షత్రాలనూ కలిగివున్నవాడు ఇలా చెబుతున్నాడు: నీ క్రియలు నాకు తెలుసు. నీవు సజీవుడవనే పేరు నీకు ఉంది[a]; కానీ నీవు మృతుడివి.’”'
