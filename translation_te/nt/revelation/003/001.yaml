id: REV.3.1
reference: Revelation 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: te
  text: '“సార్దీసులో ఉన్న సంఘపు దూతకు ఇలా రాయి: ‘దేవుని ఏడు ఆత్మలనూ, ఏడు నక్షత్రాలనూ కలిగివున్నవాడు ఇలా చెబుతున్నాడు: నీ క్రియలు నాకు తెలుసు. నీవు సజీవుడవనే పేరు నీకు ఉంది[a]; కానీ నీవు మృతుడివి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నీవు జీవిస్తున్నావని నీకు పేరు ఉంది.” ఇక్కడ “పేరు ఉంది” అంటే అలా పేరుపొందడం లేదా ఖ్యాతి కలిగి ఉండడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: దూతకు
  rationale: ‘దూత’ అనే తెలుగు పదం దేవదూతను గానీ సందేశవాహకుణ్ణి గానీ సూచించగలదు; మూలంలోని ἄγγελος పదానికున్న సందిగ్ధతను సహజంగా నిలుపుతుంది.
- source_word: ἐκκλησίας
  choice: సంఘపు
  rationale: క్రైస్తవ సమాజాన్ని సూచించే ἐκκλησίαకు ఆధునిక తెలుగు బైబిలు వాడుకలో సహజమైన, సుపరిచితమైన పదం.
- source_word: Τάδε λέγει
  choice: చెప్పేవి ఇవే
  rationale: ప్రవచనాత్మక ప్రకటన సూత్రాన్ని గంభీరంగా, అయితే సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἔχων
  choice: కలిగివున్నవాడు
  rationale: వర్తమాన కృదంత భావాన్ని మరియు రెండు కర్మలతో దాని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: దేవుని ఏడు ఆత్మలు
  rationale: బహువచన రూపాన్ని వ్యాఖ్యానాత్మకంగా ‘ఏడంతల ఆత్మ’గా మార్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: ఏడు నక్షత్రాలు
  rationale: మూలానికి నేరమైన, సహజమైన అనువాదం; చిహ్నార్థాన్ని ఈ వాక్యంలో ముందుగానే నిర్ణయించదు.
- source_word: Οἶδά σου τὰ ἔργα
  choice: నీ క్రియలు నాకు తెలుసు
  rationale: ప్రకటన గ్రంథంలోని పునరావృత మూల్యాంకన సూత్రానికి తగిన గంభీరతను కాపాడుతూ, తెలుగులో సహజమైన పదక్రమాన్ని వాడుతుంది.
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: నీవు సజీవుడవని నీకు పేరుంది
  rationale: ‘పేరు ఉంది’ అనే మూల రూపకాన్ని నిలుపుతూ, అది ఖ్యాతి లేదా పేరుప్రతిష్ఠను సూచిస్తుందని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: νεκρὸς εἶ
  choice: నీవు మృతుడివి
  rationale: మూలంలోని కఠినమైన వ్యతిరేక తీర్పును తగ్గించకుండా గంభీరంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘దేవుని ఏడు ఆత్మలు’ అనే పదబంధం యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘దేవుని ఏడు ఆత్మలు’ అని బహువచనాన్ని నిలుపడం
  alternative: దేవుని సంపూర్ణ ఆత్మ; దేవుని సన్నిధిలోని ఏడు పరలోక ఆత్మలు
  rationale: గ్రీకు పాఠ్యం బహువచనంలో ఉంది; దాని చిహ్నార్థం వివాదాస్పదం కాబట్టి అనువాదమే ఒక సిద్ధాంత నిర్ణయం చేయకూడదు.
- issue: సంఘపు ἄγγελος ఎవరు?
  choice: సందిగ్ధతను నిలిపే ‘దూత’ అనే పదాన్ని వాడడం
  alternative: దేవదూత; సందేశవాహకుడు; సంఘపు మానవ ప్రతినిధి
  rationale: తెలుగు ‘దూత’ మూలపదం యొక్క రెండు ప్రధాన సాధ్యతలను సహజంగా మోయగలదు; సూచిత వ్యక్తిని పాఠ్యం కంటే ఎక్కువగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రకటన గ్రంథపు గంభీరమైన, ప్రవచనాత్మక స్వరాన్ని నిలిపాం. ‘సజీవుడు/మృతుడు’ అనే సమాంతర పదజోడు మూలంలోని పదునైన వ్యత్యాసాన్ని కాపాడుతుంది. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
