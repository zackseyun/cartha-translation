id: REV.3.19
reference: Revelation 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω· ⸀ζήλευε οὖν καὶ μετανόησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: te
  text: నేను ప్రేమించేవారందరినీ గద్దించి, క్రమశిక్షణలో పెడతాను.[a] కాబట్టి ఉత్సాహంగా ఉండు, పశ్చాత్తాపపడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘క్రమశిక్షణలో పెడతాను’ అంటే కేవలం శిక్షించడం కాదు; తప్పును సరిదిద్ది శిక్షణ ఇవ్వడం కూడా.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకులో సర్వనామం స్పష్టంగా ఉండి కొంత ఉద్ఘాటనను ఇస్తుంది; తెలుగులో సహజంగా ‘నేను’ అని ఉంచడం ఆ ఉద్ఘాటనను తగినంతగా నిలుపుతుంది.
- source_word: ὅσους ἐὰν
  choice: ప్రేమించేవారందరినీ
  rationale: ఈ అనిర్దిష్ట సంబంధవాచక నిర్మాణం ‘ఎవరెవరినైతే / ఎంతమందినైతే’ అనే విస్తృత భావాన్ని ఇస్తుంది; ‘వారందరినీ’ దానిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: φιλῶ
  choice: ప్రేమించేవారిని
  rationale: φιλέω ఇక్కడ నిజమైన ప్రేమను, అనురాగాన్ని సూచిస్తుంది; ‘ప్రేమించు’ సాధారణ పాఠకులకు సహజంగా ఉండి భావబలాన్ని తగ్గించదు.
- source_word: ἐλέγχω
  choice: గద్దించి
  rationale: ఈ సందర్భంలో తప్పును ఎత్తిచూపి దిద్దుబాటుకు పిలిచే క్రియను సూచిస్తుంది; ‘గద్దించు’ ఆ సరిదిద్దే మందలింపు భావాన్ని సహజంగా అందిస్తుంది.
- source_word: παιδεύω
  choice: క్రమశిక్షణలో పెడతాను
  rationale: ఈ పదంలో శిక్ష మాత్రమే కాక సరిదిద్దే శిక్షణ, రూపుదిద్దడం కూడా ఉన్నాయి; ఈ పదబంధం ఆ రెండు పార్శ్వాలను నిలుపుతుంది.
- source_word: ζήλευε
  choice: ఆసక్తి కలిగి
  rationale: వర్తమాన ఆజ్ఞారూపం ఉత్సాహపూర్వకమైన, గంభీరమైన నిబద్ధతను కోరుతుంది; ‘ఆసక్తి కలిగి’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది, అయితే ‘ఉత్సాహంగా ఉండు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి ప్రేమపూర్వక దిద్దుబాటును తరువాతి ఆజ్ఞలకు కారణంగా కలిపే నిర్ధారణ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: μετανόησον
  choice: పశ్చాత్తాపపడు
  rationale: నైతిక-ఆధ్యాత్మిక సందర్భంలో μετανοέωకు స్థిరమైన, సముచితమైన తెలుగు పదం; మనస్సు మరియు ప్రవర్తన మార్పు వైపు పిలుపును తెలియజేస్తుంది.
theological_decisions:
- issue: దైవిక ప్రేమకు గద్దింపు, క్రమశిక్షణతో ఉన్న సంబంధం
  choice: ‘ప్రేమించేవారందరినీ’ అని పూర్తి ప్రేమభావంతో అనువదించడం
  alternative: ‘అనురాగం చూపేవారిని’
  rationale: వాక్యం దిద్దుబాటును నిజమైన ప్రేమలో ఆధారపరుస్తుంది. φιλέω మరియు ἀγαπάω మధ్య సందర్భం నిర్దేశించని సాంకేతిక భేదాన్ని చొప్పించకుండా ‘ప్రేమ’ అనే బలమైన భావాన్ని నిలుపుతుంది.
- issue: παιδεύω యొక్క స్వభావం
  choice: ‘క్రమశిక్షణలో పెడతాను’
  alternative: ‘శిక్షిస్తాను’ లేదా ‘శిక్షణ ఇస్తాను’
  rationale: మూలపదం కేవలం దండనను గానీ, కేవలం బోధనను గానీ సూచించదు; సరిదిద్దే మరియు రూపుదిద్దే చర్య రెండింటినీ కలిగి ఉంది.
- issue: ζήλευε యొక్క ఆజ్ఞార్థ భావం
  choice: ‘ఆసక్తి కలిగి’
  alternative: ‘ఉత్సాహంగా ఉండు’
  rationale: మూలపదంలోని తీవ్ర నిబద్ధతను నిలుపుతూ, సందర్భం చెప్పని నిర్దిష్ట భావోద్వేగం లేదా సిద్ధాంతార్థాన్ని జోడించకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ఏకవచన ఆజ్ఞారూపాలు లవొదికయ సంఘదూతను ఉద్దేశించిన గ్రీకు వ్యాకరణాన్ని నిలుపుతున్నాయి. ప్రధాన పాఠ్యంలో ఉన్న [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
