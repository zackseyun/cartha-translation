id: REV.3.21
reference: Revelation 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: te
  text: జయించేవాడికి[a][b] నేను నా సింహాసనం మీద నాతో కలిసి కూర్చోవడానికి అనుగ్రహిస్తాను; నేను కూడా జయించి నా తండ్రితో కలిసి ఆయన సింహాసనం మీద కూర్చున్నట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అధిగమించేవాడు’ అని కూడా అనువదించవచ్చు. గ్రీకు νικάω అనే క్రియ ఈ వచనంలో రెండుసార్లు వచ్చింది; విజయ భావాన్నీ పదపునరావృతినీ నిలుపడానికి రెండుచోట్లా ‘జయించు’ వాడాం.
    reason: lexical_alternative
  - marker: b
    text: ‘జయించేవాడికి’ అనే పుంలింగ ఏకవచన రూపం ప్రతినిధి ప్రయోగం; ఈ వాగ్దానం జయించే ప్రతి ఒక్కరికీ వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: జయించేవాడు
  rationale: వర్తమాన కృదంతం నామవాచకంగా వాడబడింది. ప్రకటన గ్రంథంలో పునరావృతమయ్యే విజయ భావాన్ని నిలుపుతూ, νικάω అనే క్రియకు ఈ వచనంలో రెండుసార్లూ ‘జయించు’ అనే ఒకే మూలపదాన్ని వాడాం.
- source_word: δώσω αὐτῷ καθίσαι
  choice: అతనిని ... కూర్చోనిస్తాను
  rationale: δίδωμιతో కూడిన అనిశ్చిత క్రియారూపం ఇక్కడ ఒక విశేషాధికారాన్ని ప్రసాదించడాన్ని సూచిస్తుంది. ‘కూర్చోనిస్తాను’ అనేది ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μετ’ ἐμοῦ
  choice: నాతో పాటు
  rationale: μετάతో షష్ఠీ విభక్తి సహవాసాన్ని సూచిస్తుంది; ‘నాతో పాటు’ సహజంగా ఆ అనుబంధాన్ని తెలియజేస్తుంది.
- source_word: ἐν τῷ θρόνῳ μου
  choice: నా సింహాసనం మీద
  rationale: గ్రీకు ἐν అక్షరార్థంగా ‘లో’ అయినా, సింహాసనాసీనతకు తెలుగులో ‘సింహాసనం మీద’ అనేది సహజమైన ప్రయోగం.
- source_word: ὡς κἀγὼ
  choice: నేను ... నట్లే
  rationale: ὡς పోలికను, κἀγώలోని καί యేసు అనుభవాన్నీ అదే పోలికలో చేర్చడాన్ని సూచిస్తాయి. తెలుగు వాక్య నిర్మాణంలో ‘నేను ... నట్లే’ రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐνίκησα
  choice: జయించి
  rationale: మొదటి νικῶνతో ఉన్న పదసంబంధాన్ని, ప్రకటన గ్రంథంలోని విజయ ఇతివృత్తాన్ని నిలుపుతుంది.
- source_word: ἐκάθισα
  choice: కూర్చున్న
  rationale: పూర్తయిన సింహాసనాసీన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μετὰ τοῦ πατρός μου
  choice: నా తండ్రితో పాటు
  rationale: తండ్రితో సహవాసాన్ని, అలాగే ‘నా తండ్రి’ అనే కుమార సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἐν τῷ θρόνῳ αὐτοῦ
  choice: ఆయన సింహాసనం మీద
  rationale: సింహాసనాసీనతకు సహజమైన తెలుగు ప్రయోగాన్ని వాడుతూ, సర్వనామ సూచనను నిలుపుతుంది.
theological_decisions:
- issue: జయించేవాడిని సూచించే పుంలింగ ఏకవచనం
  choice: ప్రధాన పాఠ్యంలో ‘జయించేవాడు,’ ‘అతనిని’ అని పుంలింగ ఏకవచనాన్ని నిలిపాం.
  alternative: ‘జయించే వ్యక్తిని’ వంటి లింగ-తటస్థ రూపం
  rationale: గ్రీకు పాఠ్యంలో పుంలింగ ఏకవచన కృదంతం, సర్వనామం ఉన్నాయి; అవి ప్రతినిధి ఏకవచనంగా ప్రతి జయించే విశ్వాసికీ వర్తిస్తాయి. మూలరూపాన్ని పాఠ్యంలో నిలిపి, దాని వ్యాప్తిని పాదసూచికలో స్పష్టం చేశాం.
- issue: విశ్వాసి క్రీస్తు సింహాసనం మీద కూర్చోవడం, క్రీస్తు తండ్రి సింహాసనం మీద కూర్చోవడం మధ్య పోలిక
  choice: పోలికను ఎలాంటి తగ్గింపు లేదా వివరణాత్మక విస్తరణ లేకుండా నేరుగా అనువదించాం.
  alternative: సింహాసనం మీద కూర్చోవడాన్ని ప్రధాన పాఠ్యంలోనే కేవలం ప్రతీకాత్మకమని వివరించడం
  rationale: మూలపాఠ్యం జయించేవారికి ఇచ్చే వాగ్దానానికీ యేసు విజయానంతర సింహాసనాసీనతకూ బలమైన సమాంతరాన్ని ఉంచుతుంది. అనువాదం ఆ ఉద్రిక్తతను నిలుపాలి; తండ్రి, కుమారుడు, విశ్వాసి మధ్య సంబంధాల గురించి పాఠ్యంలో లేని సిద్ధాంత వివరణలను చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. పాత రూపాలైన ‘కూర్చుండనిచ్చెదను,’ ‘సింహాసనమందు’ బదులు ‘కూర్చోనిస్తాను,’ ‘సింహాసనం మీద’ వాడాం. దీర్ఘమైన గ్రీకు వాక్యంలోని వాగ్దానం–పోలిక సంబంధాన్ని స్పష్టంగా ఉంచేందుకు విరామరేఖను ఉపయోగించాం.
