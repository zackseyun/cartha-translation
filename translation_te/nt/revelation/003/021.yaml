revisions:
- from: జయించేవాడిని[a]—నేను జయించి నా తండ్రితో పాటు ఆయన సింహాసనం మీద కూర్చున్నట్లే, అతనిని[b] నాతో పాటు నా సింహాసనం మీద కూర్చోనిస్తాను.
  to: జయించేవాడికి[a][b] నేను నా సింహాసనం మీద నాతో కలిసి కూర్చోవడానికి అనుగ్రహిస్తాను; నేను కూడా జయించి నా తండ్రితో కలిసి ఆయన సింహాసనం మీద కూర్చున్నట్లే.
  rationale: The revision follows the source order, renders the grant expressed by δώσω ... καθίσαι as an explicit bestowed privilege, and retains the repeated ‘జయించు’ terminology. It preserves the unqualified parallel between the conqueror's promised session with Christ and Christ's completed session with the Father, without adding doctrinal explanation. Footnote b is retargeted to the masculine representative form actually present in the revised text.
