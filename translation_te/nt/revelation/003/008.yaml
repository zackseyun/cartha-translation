id: REV.3.8
reference: Revelation 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: te
  text: నీ క్రియలు నాకు తెలుసు. ఇదిగో, నీ ముందు తెరిచి ఉన్న ఒక తలుపును[a] ఉంచాను; దాన్ని ఎవరూ మూయలేరు. ఎందుకంటే నీకు బలం కొద్దిగానే ఉంది, నీవు నా వాక్యాన్ని పాటించావు, నా నామాన్ని నిరాకరించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తెరవబడిన తలుపు’ అని కూడా అనువదించవచ్చు. గ్రీకు కృదంతం ఆ తలుపు తెరవబడి, తెరిచి ఉన్న స్థితిలో ఉందని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: నీ క్రియలు నాకు తెలుసు
  rationale: οἶδα రూపానికి పరిపూర్ణకాల స్వరూపం ఉన్నా వర్తమాన అర్థాన్ని ఇస్తుంది. τὰ ἔργα అనే బహువచన నామవాచకాన్ని, ప్రకటన గ్రంథంలో పునరావృతమయ్యే సూత్రప్రాయ వాక్యాన్ని ‘క్రియలు’ అని నిలిపాం.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని తరువాతి ప్రకటనపై నిలిపే సహజమైన, గౌరవప్రదమైన తెలుగు సూచన పదం.
- source_word: δέδωκα ἐνώπιόν σου
  choice: నీ ముందు … ఉంచాను
  rationale: δέδωκα అక్షరార్థంగా ‘ఇచ్చాను’ అయినా, తలుపుతో కలిసినప్పుడు దాన్ని ఎదుట ఉంచిన భావం సహజం. ‘ఉంచాను’ పూర్తయి ప్రస్తుతం ఫలితమున్న చర్యను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: θύραν ἠνεῳγμένην
  choice: తెరిచి ఉన్న ఒక తలుపు
  rationale: పరిపూర్ణ కర్మణి కృదంతం తలుపు తెరవబడి ఇప్పుడు తెరిచి ఉన్న స్థితిని సూచిస్తుంది. ‘తెరిచి ఉన్న’ సహజమైన తెలుగులో ఆ ఫలితస్థితిని నిలుపుతుంది.
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: దాన్ని ఎవరూ మూయలేరు
  rationale: δύναται తెలిపే సామర్థ్య భావాన్ని ‘మూయలేరు’ సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: ఎందుకంటే నీకు బలం కొద్దిగానే ఉన్నా
  rationale: ὅτι యొక్క కారణార్థాన్ని ‘ఎందుకంటే’తో నిలిపాం. μικράν δύναμιν పరిమిత సామర్థ్యాన్ని సూచిస్తుంది; ‘బలం కొద్దిగానే’ రాజకీయ అధికార భావాన్ని అనవసరంగా చేర్చదు. ‘ఉన్నా’ తరువాత చెప్పే విశ్వాసపాత్రతతో ఉన్న భావసంబంధాన్ని సహజ తెలుగులో చూపుతుంది.
- source_word: ἐτήρησάς μου τὸν λόγον
  choice: నీవు నా వాక్యాన్ని పాటించావు
  rationale: τηρέωలో కాపాడటం, గైకొనటం, విధేయత చూపటం అనే భావవిస్తృతి ఉంది. ఈ సందర్భంలో ‘పాటించావు’ సహజంగా ఉండి విశ్వాసపాత్రమైన అనుసరణను తెలియజేస్తుంది; λόγοςను ‘వాక్యం’గా నిలిపాం.
- source_word: οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: నా నామాన్ని నిరాకరించలేదు
  rationale: ἀρνέομαιలోని తిరస్కరించడం లేదా సంబంధాన్ని ఒప్పుకోకపోవడం అనే భావాన్ని ‘నిరాకరించలేదు’ నిలుపుతుంది. ‘నామం’ అనే ప్రతినిధిత్వం, విధేయతతో కూడిన ధార్మిక రూపకాన్ని వ్యాఖ్యానించి తొలగించలేదు.
theological_decisions:
- issue: ‘తెరిచి ఉన్న తలుపు’ రూపకం యొక్క అర్థం
  choice: రూపకాన్ని ‘తెరిచి ఉన్న ఒక తలుపు’ అని యథాతథంగా ఉంచడం
  alternative: సువార్త ప్రకటించే అవకాశం, రక్షణ లేదా రాజ్యంలో ప్రవేశం, సాధారణ దైవిక అవకాశం అని స్పష్టీకరించడం
  rationale: ఈ వచనం తలుపు దేనిని సూచిస్తుందో నిర్ణయించదు. అందువల్ల అనువాదం దాని బహుళార్థసాధ్యతను, ధార్మిక ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- issue: ὅτι తరువాతి వాక్యభాగం యొక్క కారణాత్మక మరియు భావసంబంధ బలం
  choice: ‘ఎందుకంటే’తో కారణాన్ని చూపుతూ, పరిమిత బలం మరియు విశ్వాసపాత్రత మధ్య సంబంధాన్ని ‘ఉన్నా’తో సహజంగా వ్యక్తం చేయడం
  alternative: ὅτιను ‘అని’గా తీసుకొని ‘నీకు బలం కొద్దిగా ఉందని నాకు తెలుసు’ అనే విధంగా అనుసంధానించడం
  rationale: ఇక్కడ ὅτι క్రీస్తు తలుపును ఉంచిన దానికి కారణాన్ని పరిచయం చేయడం అత్యంత సహజం. అయితే పరిమిత బలమే ప్రతికూల తీర్పు అన్న భావాన్ని చేర్చకుండా, తరువాతి విశ్వాసపాత్రతతో దాని సంబంధాన్ని తెలుగు వాక్యనిర్మాణం తెలియజేస్తుంది.
- issue: గ్రీకు కాలరూపాల ప్రస్తుత ప్రాసంగికత
  choice: ‘ఉంచాను,’ ‘పాటించావు,’ ‘నిరాకరించలేదు’ అనే తెలుగు భూతకాల రూపాలు
  alternative: ప్రస్తుత ఫలితాన్ని మరింత విస్తరించి ‘ఉంచి ఉన్నాను,’ ‘పాటిస్తూ వచ్చావు’ అని అనువదించడం
  rationale: తెలుగులో సాధారణ భూతకాల రూపాలే సందర్భానుసారం ప్రస్తుతం కొనసాగుతున్న ఫలితాన్ని సహజంగా మోయగలవు. విస్తరించిన రూపాలు మూలంలో లేని కొనసాగింపు భావాన్ని అధికంగా ముందుకు తేవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘాన్ని ఏకవచనంగా సంబోధించే మూలంలోని σουకు అనుగుణంగా ‘నీ/నీవు’ రూపాలు వాడబడ్డాయి. శైలి గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంది; రూపకాన్ని వ్యాఖ్యానించి పరిమితం చేయలేదు.
