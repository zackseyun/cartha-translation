id: REV.3.17
reference: Revelation 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: te
  text: ఎందుకంటే, ‘నేను ధనవంతుణ్ణి; సంపన్నుణ్ణయ్యాను; నాకు ఏదీ అవసరం లేదు’ అని నీవు అంటున్నావు, అయితే నీవు దౌర్భాగ్యుడవు, జాలిపడదగినవాడవు, పేదవాడవు, అంధుడవు, నగ్నుడవు అని నీకు తెలియదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι λέγεις ὅτι
  choice: ఎందుకంటే ... అని నీవు అంటున్నావు
  rationale: మొదటి ὅτι యొక్క కారణార్థాన్ని, రెండవ ὅτι పరిచయం చేసే ప్రత్యక్ష ఉల్లేఖనాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: Πλούσιός εἰμι
  choice: నేను ధనవంతుణ్ణి
  rationale: ఆర్థిక సంపదను సూచించే సూటి స్వీయవివరణను యథాతథంగా ఉంచుతుంది.
- source_word: πεπλούτηκα
  choice: సంపన్నుణ్ణయ్యాను
  rationale: పరిపూర్ణ కాలరూపంలోని ‘సంపదను సంపాదించి ఇప్పుడు ఆ స్థితిలో ఉన్నాను’ అనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: οὐδὲν χρείαν ἔχω
  choice: నాకు ఏదీ అవసరం లేదు
  rationale: οὐδέν యొక్క సంపూర్ణ నిరాకరణను స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὐκ οἶδας
  choice: నీకు తెలియదు
  rationale: జ్ఞానాన్ని సూచించే గ్రీకు క్రియను ‘గ్రహించలేదు’ వంటి వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నేరుగా అనువదిస్తుంది.
- source_word: σὺ εἶ ὁ ταλαίπωρος
  choice: దౌర్భాగ్యుడవు ... నీవే
  rationale: ὁ వల్ల కలిగే సూటిగా గురిపెట్టే బలాన్ని తెలుగులో చివరి ‘నీవే’ ద్వారా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐλεεινός
  choice: జాలిపడదగినవాడు
  rationale: ఇతరులు జాలిపడవలసిన దయనీయ స్థితిని తెలియజేస్తూ, ταλαίπωρος‌తో అర్థభేదాన్ని కాపాడుతుంది.
- source_word: πτωχός
  choice: పేదవాడు
  rationale: తాను ధనవంతుడననే వాదనకు ఎదురుగా ఉన్న వ్యంగ్య విరోధాన్ని సూటిగా నిలుపుతుంది.
- source_word: τυφλός
  choice: గుడ్డివాడు
  rationale: మూలంలోని రూపక చిత్రాన్ని వ్యాఖ్యానించకుండా సాధారణ తెలుగు పదంతో నిలుపుతుంది.
- source_word: γυμνός
  choice: దిగంబరుడు
  rationale: వస్త్రహీన స్థితిని గౌరవప్రదమైన, గ్రంథోచితమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సంపద, పేదరికం, అంధత్వం, దిగంబరత్వం ఆధ్యాత్మికమైనవని ప్రధాన పాఠ్యంలో స్పష్టం చేయాలా
  choice: మూలంలోని చిత్రభాషను ఎటువంటి వ్యాఖ్యానాత్మక విశేషణాలు జోడించకుండా ఉంచడం
  alternative: ‘ఆధ్యాత్మికంగా పేదవాడవు’ వంటి వివరణను చేర్చడం
  rationale: వచనమే భౌతిక స్వీయమూల్యాంకనానికీ నిజమైన స్థితికీ మధ్య వ్యంగ్య ఉద్రిక్తతను సృష్టిస్తుంది; ‘ఆధ్యాత్మికంగా’ అని చేర్చడం మూలంలో లేని వ్యాఖ్యానాన్ని దిగుమతి చేస్తుంది.
- issue: ὁ ταλαίπωρος లోని నిర్దిష్టతను ఎలా తెలియజేయాలి
  choice: సహజమైన విశేషణ శ్రేణిని వాడి, ‘నీవే’తో దృష్టిని బలపరచడం
  alternative: ‘ఆ దౌర్భాగ్యుడవు’ లేదా ‘దౌర్భాగ్యుడైన వ్యక్తివి’ అని పదశః నిర్మించడం
  rationale: తెలుగులో పదశః నిర్దిష్ట నిర్మాణం కృత్రిమంగా ఉంటుంది; ‘నీవే’ గ్రీకు వాక్యంలోని గురిపెట్టే బలాన్ని సహజంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా ప్రకటన గ్రంథపు గంభీరమైన మందలింపు స్వరాన్ని నిలుపుతూ అనువదించబడింది. మూలంలో లేని ఆంగ్ల సంప్రదింపు పాఠ్యపు [a], [b] సూచనలు అసంబద్ధంగా కనిపిస్తున్నందున అవి దిగుమతి చేయలేదు; అందువల్ల ప్రధాన పాఠ్యంలో పాదసూచిక గుర్తులు లేవు.
