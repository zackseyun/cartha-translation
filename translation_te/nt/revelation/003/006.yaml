id: REV.3.6
reference: Revelation 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/006.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: te
  text: చెవి ఉన్నవాడు[a], సంఘాలకు ఆత్మ చెప్పేది వినాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో అక్షరార్థంగా, “చెవి ఉన్నవాడు వినాలి.” ఇక్కడ ఏకవచన పుంలింగ రూపం వినే ప్రతి వ్యక్తినీ ఉద్దేశించిన సాధారణ ప్రబోధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: చెవి ఉన్నవాడు
  rationale: గ్రీకు వాక్యంలో ఏకవచనంలో ఉన్న సామాన్య సంబోధనను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే రూపం. ఇది కేవలం పురుషులను మాత్రమే సూచించదు; వినగల ప్రతివారికీ వర్తించే హితోక్తి.
- source_word: ἀκουσάτω
  choice: వినాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞార్థక క్రియలోని బలమైన ప్రబోధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది. ‘వినుగాక’ మూలరూపానికి దగ్గరగా ఉన్నా నేటి సాధారణ వాడుకలో పురాతన శైలిగా అనిపిస్తుంది.
- source_word: τί τὸ πνεῦμα λέγει
  choice: ఆత్మ చెప్పేది
  rationale: τί సూచించే సందేశ విషయాన్ని సహజమైన తెలుగు సంబంధార్థక నిర్మాణంలో వ్యక్తపరుస్తుంది. సందర్భంలో τὸ πνεῦμα దేవుని పరిశుద్ధాత్మను సూచిస్తుంది; ‘ఆత్మ’ అనే రూపం ఆ అర్థాన్ని నిలుపుతుంది.
- source_word: ταῖς ἐκκλησίαις
  choice: సంఘాలకు
  rationale: ప్రకటన 2–3 అధ్యాయాల్లోని స్థానిక విశ్వాస సమాజాలను సూచించడానికి ‘సంఘాలు’ స్థిరమైన, సహజమైన తెలుగు పదం; బహువచన దత్తివిభక్తి భావాన్ని ‘సంఘాలకు’ స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ‘ఆత్మ’ ఎవరిని సూచిస్తుంది?
  choice: పరిశుద్ధాత్మ
  alternative: ఒక ఆత్మ
  rationale: ప్రకటన 2–3 అధ్యాయాల్లో పునరావృతమయ్యే ఈ ముగింపు పిలుపులో సంఘాలతో మాట్లాడే ‘ఆత్మ’ పరిశుద్ధాత్మనే సూచించడం సందర్భానికి అత్యంత అనుకూలం. అనువాదంలో మూలంలోని సంక్షిప్త రూపమైన ‘ఆత్మ’నే ఉంచాం.
- issue: ఏకవచన సంబోధన పరిధి
  choice: చెవి ఉన్నవాడు
  alternative: చెవులు ఉన్నవారు
  rationale: గ్రీకులో కర్త, ఆజ్ఞ రెండూ ఏకవచనంలో ఉన్నాయి. ఆ రూపాన్ని నిలిపినా, ఇది పురుషులకు మాత్రమే పరిమితం కాకుండా వినే ప్రతి వ్యక్తిని ఉద్దేశించిన సాధారణ ప్రబోధం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ఏకవచన హితోక్తిని నిలిపి, పురాతనంగా వినిపించే ‘వినుగాక’కు బదులుగా సహజమైన ప్రబోధాత్మక ‘వినాలి’ ఎంచుకోబడింది.
