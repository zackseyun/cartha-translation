id: REV.3.12
reference: Revelation 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: te
  text: జయించేవాడిని నా దేవుని ఆలయంలో ఒక స్తంభంగా చేస్తాను; అతడు ఇక ఎన్నటికీ దానిలోనుంచి బయటికి వెళ్లడు.[a] అతని మీద నా దేవుని పేరును, నా దేవుని పట్టణం పేరును—అంటే, పరలోకం నుండి నా దేవుని యొద్ద నుండి దిగివచ్చే కొత్త యెరూషలేము పేరును—మరియు నా సొంత కొత్త పేరును రాస్తాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతడు ఇక ఎంతమాత్రమూ బయటికి వెళ్లనే వెళ్లడు”; గ్రీకులో ఇది బలమైన నిరాకరణ.
    reason: lexical_alternative
  - marker: b
    text: “నా కొత్త పేరు” అని కూడా అనువదించవచ్చు; గ్రీకు పదనిర్మాణంలో ఉద్ఘాటన ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: జయించేవాడు
  rationale: ప్రకటన గ్రంథమంతటా పునరావృతమయ్యే నικάω విజయ భావాన్ని, వర్తమాన కృదంతపు ప్రతినిధి స్వభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ποιήσω αὐτὸν στῦλον
  choice: అతడిని ... ఒక స్తంభంగా చేస్తాను
  rationale: ποιέωతో వచ్చిన విధేయ ద్వితీయా నిర్మాణాన్ని, స్థిరత్వం మరియు గౌరవాన్ని సూచించే స్తంభ రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἐν τῷ ναῷ τοῦ θεοῦ μου
  choice: నా దేవుని ఆలయంలో
  rationale: ναός ప్రత్యేకంగా దేవాలయం/పరిశుద్ధస్థలాన్ని సూచిస్తుంది; 'ఆలయం' ఆధునిక తెలుగులో సహజంగా ఉండి రూపకాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: అతడు ఇక ఎన్నటికీ దానిలోనుంచి బయటికి వెళ్లడు
  rationale: οὐ μήతో కూడిన బలమైన నిరాకరణను 'ఇక ఎన్నటికీ ... వెళ్లడు' తెలియజేస్తుంది; 'దానిలోనుంచి' అనేది సందర్భంలో అంతర్లీనంగా ఉన్న ఆలయ సూచనను స్పష్టం చేస్తుంది.
- source_word: γράψω ἐπ’ αὐτὸν
  choice: అతని మీద ... రాస్తాను
  rationale: ἐπίతో కూడిన γράφω ఇక్కడ గుర్తుగా వ్రాయడం/చెక్కడం అనే భావం కలిగినా, 'మీద రాస్తాను' మూల రూపకాన్ని వ్యాఖ్యానం చేయకుండా నిలుపుతుంది.
- source_word: τῆς καινῆς Ἰερουσαλήμ
  choice: కొత్త యెరూషలేము
  rationale: విశేషణార్థాన్ని సహజ క్రమంలో నిలుపుతూ పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరిస్తుంది.
- source_word: ἡ καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: నా దేవుని దగ్గరనుంచి పరలోకంలోనుంచి దిగివచ్చే
  rationale: ἐκ మరియు ἀπό అనే రెండు మూలసూచక విభక్తి సంబంధాలను వరుసగా 'పరలోకంలోనుంచి', 'నా దేవుని దగ్గరనుంచి'గా నిలుపుతుంది; తెలుగులో సంబంధం స్పష్టంగా ఉండేందుకు దేవుని మూలాన్ని ముందుగా ఉంచింది.
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: నా సొంత కొత్త పేరు
  rationale: పునరుక్త నిర్దేశక నిర్మాణంలోని ఉద్ఘాటనను 'సొంత' ద్వారా సహజంగా వ్యక్తం చేస్తూ, ఆ పేరు ఏమిటో ఊహించదు.
theological_decisions:
- issue: వాగ్దాన సూత్రంలోని పుంలింగ ఏకవచనం
  choice: '''జయించేవాడు'', ''అతడిని'', ''అతడు'', ''అతని'' అనే పుంలింగ ఏకవచన రూపాలు'
  alternative: జయించేవారు / వారిని; జయించే వ్యక్తి
  rationale: గ్రీకులోని పుంలింగ ఏకవచన కృదంతం మరియు సర్వనామాలను నిలుపుతుంది; అయినా వాక్యం ప్రతినిధి వాగ్దానంగానే అర్థమవుతుంది.
- issue: ఉన్నతుడైన యేసు మాటలో 'నా దేవుడు' అనే పునరుక్తి
  choice: మూలంలోని ప్రతి సందర్భంలో 'నా దేవుని' అని నాలుగు సార్లు నిలుపడం
  alternative: శైలికోసం కొన్ని పునరుక్తులను తొలగించడం
  rationale: మూలపాఠంలోని ఉద్దేశపూర్వక పునరుక్తి మరియు క్రీస్తుశాస్త్ర సంబంధమైన ఉద్రిక్తతను వ్యాఖ్యానంతో పరిష్కరించకుండా కాపాడుతుంది.
- issue: చివరి పేరు పదబంధంలోని ఉద్ఘాటన
  choice: నా సొంత కొత్త పేరు
  alternative: నా కొత్త పేరు
  rationale: τὸ ὄνομά μου τὸ καινόν నిర్మాణంలోని ఉద్ఘాటనను చూపుతుంది; పేరు యొక్క స్వరూపం గురించి సిద్ధాంతపరమైన ఊహను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన ప్రవచన శైలిని నిలుపుతూ అనువదించబడింది. 'స్తంభం', 'పేరు', 'దిగివచ్చే' వంటి ప్రధాన రూపకాలు వ్యాఖ్యానించకుండా ఉంచబడ్డాయి. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలకు సరిపోతాయి.
