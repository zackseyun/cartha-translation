id: REV.3.15
reference: Revelation 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: te
  text: 'నీ క్రియలు నాకు తెలుసు: నీవు చల్లగానూ లేవు, వేడిగానూ లేవు. నీవు చల్లగానో వేడిగానో ఉంటే బాగుండేది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు చల్లగానో వేడిగానో ఉంటే ఎంత బాగుండునో!”
    reason: ὄφελονలోని బలమైన కోరికను మరింత స్పష్టంగా వ్యక్తం చేసే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: Οἶδά
  choice: నాకు తెలుసు
  rationale: οἶδα ఇక్కడ వర్తమాన స్థితిని సూచిస్తుంది. ‘నాకు తెలుసు’ సహజమైన ఆధునిక తెలుగు రూపం; నేరమైన మూల్యాంకన స్వరాన్ని నిలుపుతుంది.
- source_word: τὰ ἔργα
  choice: నీ క్రియలు
  rationale: ప్రకటన గ్రంథంలోని మూల్యాంకన సూత్రంలో ἔργαకు ‘క్రియలు’ పదం భావగాంభీర్యాన్ని, పదసంబంధ నిరంతరత్వాన్ని కాపాడుతుంది.
- source_word: ψυχρὸς
  choice: చల్లగా
  rationale: ఉష్ణోగ్రత రూపకాన్ని వ్యాఖ్యానించకుండా యథాతథంగా ఉంచుతుంది; ζεστόςతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ζεστός
  choice: వేడిగా
  rationale: మూలంలోని సాధారణ ఉష్ణోగ్రత పదానికి సహజమైన తెలుగు సమానార్థకం; ‘మండుతూ’ లేదా ‘ఆసక్తితో’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: ὄφελον
  choice: ఉంటే బాగుండేది
  rationale: ὄφελον ప్రస్తుత వాస్తవానికి విరుద్ధమైన బలమైన కోరికను వ్యక్తం చేస్తుంది. ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఆ కోరికను తెలియజేస్తుంది.
- source_word: ἢ
  choice: గానో ... గానో
  rationale: తెలుగులో ప్రత్యామ్నాయాలను సహజంగా, స్పష్టంగా చూపించే విభక్తి నిర్మాణం.
theological_decisions:
- issue: ‘చల్లగా’, ‘వేడిగా’ అనే ఉష్ణోగ్రత రూపకం యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో రూపకాన్ని అర్థవివరణ చేయకుండా అక్షరార్థ ఉష్ణోగ్రత పదాలతో నిలుపడం.
  alternative: ‘చల్లగా’ అంటే ఆధ్యాత్మికంగా ఉదాసీనంగా లేదా అవిశ్వాసిగా, ‘వేడిగా’ అంటే ఆధ్యాత్మికంగా ఉత్సాహంగా అని వివరించడం; లేదా రెండింటినీ వేర్వేరు రీతుల్లో ప్రయోజనకరమైన ఉష్ణోగ్రతలుగా అర్థం చేయడం.
  rationale: ఈ వచనం రూపకాన్ని ఉపయోగిస్తుంది గాని దాని సంకేతార్థాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల ఏ నిర్దిష్ట వ్యాఖ్యానాన్నీ అనువాదంలో చేర్చకుండా మూలంలోని భావ ఉద్రిక్తతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ప్రకటన గ్రంథపు గంభీరమైన మందలింపు స్వరాన్ని నిలుపుతూ అనువదించబడింది. ఏకవచన సంబోధనను ‘నీ/నీవు’తో స్పష్టంగా ఉంచాం.
