id: REV.3.9
reference: Revelation 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: te
  text: ఇదిగో, సాతాను సమాజమందిరం నుండి కొందరిని నేను ఇస్తున్నాను[a]—వారు తాము యూదులమని చెప్పుకుంటున్నారు, కాని వారు యూదులు కారు; అబద్ధం చెబుతున్నారు. ఇదిగో, వారు వచ్చి నీ పాదాల ఎదుట సాగిలపడేలా[b] నేను చేస్తాను; నేను నిన్ను ప్రేమించానని వారు తెలుసుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సాతాను సమాజమందిరం నుండి నేను ఇస్తున్నాను.” గ్రీకులో ‘ఇస్తున్నాను’ అనే క్రియకు కర్మను పూర్తిగా పేర్కొనలేదు. ఈ వాక్యం ఆ గుంపులోని కొందరిని ఉద్దేశిస్తున్నట్లు భావించి ఇక్కడ “కొందరిని” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వచ్చి నీ పాదాల ఎదుట నమస్కరించేలా.” ఇక్కడి గ్రీకు క్రియకు ‘సాగిలపడడం’ లేదా ‘ఆరాధించడం’ అనే అర్థాలు రావచ్చు. ఈ సందర్భంలో నీ పాదాల ఎదుట జరిగే చర్యను దైవారాధనగా అర్థం చేసుకోకుండా, శరీరంతో వంగి గౌరవం లేదా అధీనతను చూపే చర్యగా అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షించే గ్రీకు ఉద్బోధకాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదంతో తెలిపింది.
- source_word: διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: సాతాను సమాజమందిరానికి చెందినవారిలో కొందరిని నేను నీకు అప్పగిస్తున్నాను
  rationale: διδῶ వర్తమాన కాలాన్ని ‘అప్పగిస్తున్నాను’గా నిలిపి, ἐκ యొక్క సమూహంలోనుండి కొందరు అనే భావాన్ని స్పష్టం చేసింది. గ్రీకులో పరోక్ష కర్మ స్పష్టంగా లేకపోయినా సందర్భానుసారంగా ‘నీకు’ చేర్చబడింది; దీనిని పాదసూచికలో తెలియజేసింది.
- source_word: συναγωγῆς
  choice: సమాజమందిరం
  rationale: యూదుల సామూహిక, ఆరాధనా సందర్భాన్ని తెలుగులో స్థిరంగా వినిపించే పదంతో తెలిపింది; సాధారణ ‘సమాజం’ అనే అస్పష్టతను నివారించింది.
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: వారు తాము యూదులమని చెప్పుకుంటున్నారు
  rationale: ప్రతిబింబ సర్వనామంతో కూడిన వారి స్వీయ వాదనను సహజమైన తెలుగులో నేరుగా నిలిపింది.
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: కాని వారు యూదులు కారు; అబద్ధమాడుతున్నారు
  rationale: ‘కారు’ అన్నదానికి సందర్భంలోని ‘యూదులు’ను పునరుద్ధరించి, ψεύδονται యొక్క వర్తమాన క్రియాత్మక బలాన్ని నిలిపింది.
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν καὶ προσκυνήσουσιν
  choice: వారు వచ్చి ... సాగిలపడేలా నేను చేస్తాను
  rationale: ποιήσω యొక్క కారణార్థక బలాన్ని, ἥξουσιν మరియు προσκυνήσουσιν సూచించే రాక మరియు శరీరంతో వంగి నమస్కరించే చర్యలను సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలిపింది.
- source_word: ἐνώπιον τῶν ποδῶν σου
  choice: నీ పాదాల ఎదుట
  rationale: ἐνώπιον యొక్క ‘ఎదుట/సమక్షంలో’ భావాన్ని, పాదాలకు సంబంధించిన స్పష్టమైన రూపకాన్ని యథాతథంగా నిలిపింది.
- source_word: γνῶσιν ὅτι ἐγὼ ἠγάπησά σε
  choice: నేను నిన్ను ప్రేమించానని వారు తెలుసుకుంటారు
  rationale: ἠγάπησα యొక్క ఏకవచన సంబోధనను, అఓరిస్ట్ రూపాన్ని ‘ప్రేమించాను’గా అతిగా వ్యాఖ్యానించకుండా నిలిపింది.
theological_decisions:
- issue: ‘తాము యూదులమని చెప్పుకుంటున్నారు, కాని వారు యూదులు కారు’ అనే వాక్యపు పరిధి
  choice: పాఠంలోని తీవ్రమైన ఒడంబడిక/విశ్వాస్యత సంబంధిత తీర్పును నేరుగా ఉంచి, దానిని సమస్త జాతి యూదులపై వ్యాఖ్యగా విస్తరించలేదు.
  alternative: దీనిని కేవలం జాతి గుర్తింపును నిరాకరించడంగా లేదా ‘ఆత్మీయ యూదుడు’ అనే పూర్తి సిద్ధాంత నిర్వచనంగా అనువదించడం.
  rationale: గ్రీకు పాఠం వారి వాదనను తిరస్కరిస్తుంది, కానీ తిరస్కరణకు గల పూర్తి ప్రమాణాన్ని ఈ వచనంలో వివరించదు; అందువల్ల ఆ ఉద్రిక్తతను అలాగే ఉంచాలి.
- issue: ప్రσκυνέω క్రియ విశ్వాసి పాదాల ఎదుట జరిగే సందర్భంలో దాని భావం
  choice: ‘సాగిలపడడం’—అధీనత లేదా గౌరవాన్ని సూచించే శరీర చర్య.
  alternative: ‘ఆరాధించడం’ లేదా ‘పూజించడం’.
  rationale: క్రియకు ఆరాధన అనే భావం ఉండగలిగినా, ఇక్కడ చర్య ‘నీ పాదాల ఎదుట’ జరుగుతుంది. ‘సాగిలపడడం’ అసలు చర్యను నిలిపి, విశ్వాసికి దైవారాధన చేస్తున్నారనే అనవసర భావాన్ని రానివ్వదు.
- issue: ἠγάπησά σε యొక్క కాలబలం
  choice: ‘నేను నిన్ను ప్రేమించాను’ అని అఓరిస్ట్ రూపాన్ని సరళంగా నిలిపింది.
  alternative: ‘నేను నిన్ను ప్రేమిస్తున్నాను’ అని వర్తమాన స్థితిగా మార్చడం.
  rationale: ప్రేమ కొనసాగుతుందనే భావం సందర్భంలో సాధ్యమైనా, అనువాదం గ్రీకు క్రియారూపాన్ని మౌనంగా వర్తమాన కాలంగా మార్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సమాజమందిరం,’ ‘సాగిలపడడం’ వంటి బైబిలు సందర్భానికి పరిచితమైన పదాలను ఉంచినా, వాక్యనిర్మాణం సహజంగా ఉండేలా చేసింది. ప్రధాన పాఠ్యంలో [a], [b] సూచికలు రెండూ సంబంధిత స్థానాల్లో ఉన్నాయి.
