revisions:
- from: నీవు ధనవంతుడివి కావడానికి అగ్నిలో శుద్ధిచేయబడిన బంగారాన్ని నా దగ్గర కొనుక్కోమని, నీవు ధరించుకోవడానికి—నీ నగ్నత్వపు అవమానం బయటపడకుండా ఉండడానికి—తెల్లని వస్త్రాలను[a], అలాగే నీకు చూపు కలగడానికి నీ కళ్లకు పూసుకునే కంటి మందును[b] నా దగ్గర కొనుక్కోమని నీకు సలహా ఇస్తున్నాను.
  to: అగ్ని ద్వారా శుద్ధి చేయబడిన బంగారాన్ని[a] నా దగ్గర నుండి కొనుక్కొని నీవు ధనవంతుడివి కావడానికి, తెల్లని వస్త్రాలను[b] నా దగ్గర నుండి కొనుక్కొని నీవు ధరించుకోవడానికి, అప్పుడు నీ నగ్నత్వపు అవమానం బయటపడకుండా ఉండడానికి, అలాగే నీ కళ్లకు పూసుకోవడానికి కంటి మందును[c] నా దగ్గర నుండి కొనుక్కొని నీవు చూడగలగడానికి నేను నీకు సలహా ఇస్తున్నాను.
  rationale: The revision restores a transparent parallel relationship between each commodity and buying it ‘from me,’ retains the purposive sequence in the source, and renders βλέπῃς directly as the ability to see. It does not explain the imagery doctrinally. Footnote anchors are supplied for each relevant lexical/cultural note.
