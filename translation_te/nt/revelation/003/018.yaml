id: REV.3.18
reference: Revelation 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: te
  text: అగ్ని ద్వారా శుద్ధి చేయబడిన బంగారాన్ని[a] నా దగ్గర నుండి కొనుక్కొని నీవు ధనవంతుడివి కావడానికి, తెల్లని వస్త్రాలను[b] నా దగ్గర నుండి కొనుక్కొని నీవు ధరించుకోవడానికి, అప్పుడు నీ నగ్నత్వపు అవమానం బయటపడకుండా ఉండడానికి, అలాగే నీ కళ్లకు పూసుకోవడానికి కంటి మందును[c] నా దగ్గర నుండి కొనుక్కొని నీవు చూడగలగడానికి నేను నీకు సలహా ఇస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అగ్నిలో శుద్ధి చేయబడిన’ లేదా ‘అగ్ని పరీక్షను తట్టుకున్న.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తెల్లని దుస్తులను’; కొన్ని సందర్భాల్లో మరింత నిర్దిష్టంగా ‘తెల్లని అంగీలను.’
    reason: lexical_alternative
  - marker: c
    text: ‘కంటి మందు’ అనేది కళ్లకు పూసే ఔషధ తయారీని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: συμβουλεύω σοι
  choice: నీకు సలహా ఇస్తున్నాను
  rationale: వర్తమానకాల ప్రథమ పురుష క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, అధికారపూర్వకమైన ఉపదేశ ధోరణిని నిలుపుతుంది.
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: నా దగ్గర కొనుక్కోమని
  rationale: παρά + షష్ఠీ విభక్తి మూలాన్ని సూచిస్తుంది; మధ్యార్థక తెలుగు రూపం సంబోధితుడు తనకోసం పొందడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: χρυσίον πεπυρωμένον ἐκ πυρός
  choice: అగ్నిలో శుద్ధిచేయబడిన బంగారం
  rationale: పరిపూర్ణ కర్మణి కృదంతం అగ్ని ప్రక్రియ ద్వారా శుద్ధి పొందిన స్థితిని సూచిస్తుంది; లోహశుద్ధి రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ἵνα πλουτήσῃς
  choice: నీవు ధనవంతుడివి కావడానికి
  rationale: ఆరిస్ట్ సబ్జంక్టివ్‌లోని స్థితిలోకి ప్రవేశించే భావాన్ని ‘కావడానికి’ స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ἱμάτια λευκά
  choice: తెల్లని వస్త్రాలు
  rationale: ἱμάτια సాధారణంగా దుస్తులు లేదా వస్త్రాలను సూచిస్తుంది; ‘వస్త్రాలు’ ప్రకటన గ్రంథపు గంభీర చిత్రణకు సరిపోతూ ‘అంగీలు’ అనే సంకుచిత అర్థాన్ని రుద్దదు.
- source_word: ἵνα περιβάλῃ
  choice: నీవు ధరించుకోవడానికి
  rationale: మధ్యమ వాచ్యంలోని స్వీయ అన్వయాన్ని సహజమైన తెలుగు ఆత్మార్థక రూపంతో నిలుపుతుంది.
- source_word: μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: నీ నగ్నత్వపు అవమానం బయటపడకుండా ఉండడానికి
  rationale: కర్మణి భావాన్ని ‘బయటపడకుండా’ సహజంగా తెలుపుతూ, నగ్నత్వంతో ముడిపడిన αἰσχύνη యొక్క అవమాన భావాన్ని కాపాడుతుంది.
- source_word: κολλούριον
  choice: కంటి మందు
  rationale: కళ్లకు పూసే ఔషధ తయారీని సాధారణ ఆధునిక తెలుగు పాఠకునికి సులభంగా అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: నీ కళ్లకు పూసుకునే
  rationale: రుద్ది లేదా పూసి మందును ఉపయోగించే క్రియాత్మక భావాన్ని సందర్భానుకూలంగా ఇస్తుంది; తెలుగులో ‘అభిషేకించు’ అనడం కలిగించగల అనవసర ఆచారార్థాన్ని నివారిస్తుంది.
- source_word: ἵνα βλέπῃς
  choice: నీకు చూపు కలగడానికి
  rationale: కేవలం చూసే చర్యకన్నా చూపు పొందే సందర్భార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది; ఆధ్యాత్మిక సూచనను ప్రధాన వాక్యంలో విప్పి చెప్పదు.
theological_decisions:
- issue: బంగారం, తెల్లని వస్త్రాలు, కంటి మందు అనే వస్తువుల ప్రతీకాత్మక అర్థం
  choice: ప్రధాన పాఠ్యంలో చిత్రణను అక్షరార్థ రూపంలోనే నిలుపడం
  alternative: బంగారాన్ని ఆధ్యాత్మిక సంపదగా, వస్త్రాలను నీతి లేదా పవిత్రతగా, కంటి మందును ఆధ్యాత్మిక వివేచనగా అనువాదంలోనే వివరించడం
  rationale: గ్రీకు వచనం ఈ ప్రతీకల అర్థాలను ఈ వాక్యంలో స్పష్టంగా విప్పదు; అందువల్ల వ్యాఖ్యానాన్ని అనువాదంలోకి చొప్పించకుండా చిత్రణనూ దాని ఉద్వేగాన్నీ నిలుపుతుంది.
- issue: ἐγχρῖσαι క్రియకు సంభవించగల ఆచారపరమైన లేదా అభిషేక సంబంధిత ప్రతిధ్వని
  choice: వైద్య సందర్భానికి సహజమైన ‘పూసుకునే’ అనే రూపం
  alternative: ‘అభిషేకించుకోవడానికి’ లేదా ‘అంటించుకోవడానికి’
  rationale: ఈ సందర్భంలో కంటి మందును రాసే చర్య ప్రధానమైనది. ‘అభిషేకించు’ తెలుగు పాఠకునికి వచనం స్పష్టంగా చెప్పని మతాచార భావాన్ని సూచించవచ్చు; ‘పూసుకో’ మూలక్రియ యొక్క ప్రయోగార్థాన్ని కాపాడుతుంది.
- issue: ἵνα βλέπῃς లో శారీరక మరియు ఆధ్యాత్మిక చూపు మధ్య సంబంధం
  choice: ‘నీకు చూపు కలగడానికి’ అని అస్పష్టతను నిలుపడం
  alternative: ‘ఆధ్యాత్మికంగా చూడగలగడానికి’ అని స్పష్టీకరించడం
  rationale: సందర్భం రూపకాత్మక పఠనాన్ని బలంగా సూచించినా, గ్రీకు వచనం ‘ఆధ్యాత్మికంగా’ అనే విశేషణాన్ని ఉపయోగించదు; దాన్ని చేర్చకుండా అర్థ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అందుబాటులో ఉండే శైలి. మూలంలోని వరుస కొనుగోలు అంశాలను ఒకే సలహా నిర్మాణంలో ఉంచి, తెలుగులో స్పష్టత కోసం ‘నా దగ్గర కొనుక్కోమని’ చివరి అంశం వద్ద పునరుక్తి చేయబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
