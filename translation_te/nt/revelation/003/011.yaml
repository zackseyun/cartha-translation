id: REV.3.11
reference: Revelation 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: te
  text: నేను త్వరలో వస్తున్నాను[a]. నీ దగ్గర ఉన్నదాన్ని గట్టిగా పట్టుకో, ఎవరూ నీ కిరీటాన్ని తీసుకోకుండా ఉండేందుకు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “త్వరగా.” గ్రీకు క్రియావిశేషణం కాలపరమైన సమీపతను లేదా చర్యలోని వేగాన్ని సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడి గ్రీకు పదం ప్రత్యేకంగా రాజకిరీటాన్ని కాక, విజేతకు ఇచ్చే పుష్పమాలలాంటి కిరీటాన్ని లేదా గౌరవ కిరీటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: నేను ... వస్తున్నాను
  rationale: వర్తమాన కాల రూపం సందర్భంలో సమీప భవిష్యత్తులో జరగబోయే రాకను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వస్తున్నాను’ సహజంగా ఉండి రాబోయే రాక భావాన్ని నిలుపుతుంది.
- source_word: ταχύ
  choice: త్వరలో
  rationale: ఈ క్రియావిశేషణం కాలసమీపతను (‘త్వరలో’) లేదా చర్య వేగాన్ని (‘త్వరగా’) సూచించగలదు. ప్రధాన పాఠంలో సందర్భానుకూలంగా ‘త్వరలో’ వాడి, మరొక భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: κράτει
  choice: గట్టిగా పట్టుకో
  rationale: ఆజ్ఞారూపంలోని κρατέω దృఢంగా నిలుపుకోవడం లేదా విడిచిపెట్టకుండా కొనసాగడాన్ని సూచిస్తుంది. ‘గట్టిగా పట్టుకో’ ఆ ఆజ్ఞ బలాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ὃ ἔχεις
  choice: నీకు ఉన్నదాన్ని
  rationale: గ్రీకు మూలంలాగే వస్తువు ఏమిటో ప్రత్యేకంగా నిర్ధారించకుండా ఉంచుతుంది; సందర్భమే దాని భావాన్ని తెలియజేస్తుంది.
- source_word: ἵνα μηδεὶς λάβῃ
  choice: అప్పుడు ఎవరూ ... తీసుకోలేరు
  rationale: నివారించవలసిన ఉద్దేశిత ఫలితాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ‘అప్పుడు’ ముందున్న ఆజ్ఞకు ఈ ఫలితంతో ఉన్న సంబంధాన్ని చూపుతుంది.
- source_word: στέφανόν
  choice: కిరీటాన్ని
  rationale: στέφανος గౌరవం లేదా విజయానికి ఇచ్చే పుష్పమాలలాంటి కిరీటాన్ని సూచిస్తుంది; సాధారణ పాఠకులకు అర్థమయ్యే ‘కిరీటం’ను ప్రధాన పాఠంలో ఉంచి ప్రత్యేక నుడికారాన్ని పాదసూచికలో వివరించాం.
theological_decisions:
- issue: క్రీస్తు రాకను తెలిపే ταχύ యొక్క భావం
  choice: త్వరలో
  alternative: త్వరగా
  rationale: ఈ పదం రాక కాలపరంగా సమీపమని లేదా అది సంభవించినప్పుడు వేగంగా జరుగుతుందని సూచించగలదు. ప్రధాన పాఠంలో కాలసమీపతను ఎంచుకుని, అసలులోని నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆజ్ఞాత్మక శైలి. మూలంలోని సంక్షిప్తతను కాపాడుతూ, ταχύ యొక్క సందిగ్ధతను మరియు στέφανος యొక్క గౌరవ/విజయ నుడికారాన్ని పాదసూచికల్లో నిలిపాం.
