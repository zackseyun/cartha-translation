  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: te
  text: చెవి ఉన్నవాడు[a], ఆత్మ సంఘాలకు ఏమి చెబుతున్నాడో వినుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెవి ఉన్న ప్రతి ఒక్కరూ వినాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ఉన్నవాడు
  rationale: నిర్దేశక పదంతో కూడిన వర్తమాన కృదంతం వ్యక్తిని సూచించే నామవాచక ప్రయోగంగా ఉంది. ‘చెవి ఉన్నవాడు’ అనే రూపం గ్రీకులోని ఏకవచన ప్రతినిధి భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὖς
  choice: చెవి
  rationale: గ్రీకులో ఇది ఏకవచనం. వినడానికి సిద్ధంగా ఉండడాన్ని సూచించే రూపకాలంకార ప్రయోగాన్ని తెలుగులోనూ ఏకవచనంగానే ఉంచడం సహజం.
- source_word: ἀκουσάτω
  choice: వినుగాక
  rationale: ఇది తృతీయ పురుష ఏకవచన ఆజ్ఞార్థక రూపం. ‘వినుగాక’ ఉపదేశాత్మక ఆజ్ఞ బలాన్ని కాపాడుతుంది; ‘వినాలి’ అని అనువదిస్తే అది ప్రధానంగా బాధ్యతను సూచించే అవకాశం ఉంది.
- source_word: τί
  choice: ఏమి
  rationale: ఆత్మ చెప్పే సందేశపు విషయాన్ని పరిచయం చేస్తుంది. ‘ఏమి చెబుతున్నాడో’ అనేది సహజమైన తెలుగు పరోక్ష ప్రశ్న నిర్మాణం.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: ప్రకటన 2–3 అధ్యాయాల్లో పునరావృతమయ్యే ఈ మాటలో ఇది సంఘాలతో మాట్లాడే దేవుని పరిశుద్ధాత్మను సూచిస్తుంది. మూలంలో లేని ‘పరిశుద్ధ’ అనే విశేషణాన్ని ప్రధాన వాక్యంలో చేర్చకుండా ‘ఆత్మ’ అని ఉంచాం.
- source_word: λέγει
  choice: చెబుతున్నాడో
  rationale: వర్తమాన కాలంలోని మాటల చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. పుంలింగ క్రియారూపం ఆత్మను మాట్లాడే వ్యక్తిగా సూచిస్తుంది, నిర్జీవ శక్తిగా కాదు.
- source_word: ταῖς ἐκκλησίαις
  choice: సంఘాలకు
  rationale: చతుర్థీ విభక్తి సందేశాన్ని అందుకునేవారిని సూచిస్తుంది. ప్రకటన 2–3 అధ్యాయాల్లో ἐκκλησίαις అనేది ఉద్దేశించబడిన విశ్వాసుల స్థానిక సంఘాలకు వాడబడింది.
theological_decisions:
- issue: ఉపదేశంలోని ఏకవచన ప్రతినిధి వ్యక్తీకరణ
  choice: చెవి ఉన్నవాడు … వినుగాక
  alternative: చెవి ఉన్న ప్రతి ఒక్కరూ … వినాలి
  rationale: గ్రీకు వాక్యం వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉండి అందరికీ వర్తించే ప్రతినిధి భావాన్ని కలిగిస్తుంది. ప్రధాన అనువాదం ఆ రూపాన్ని నిలుపుతుంది; ప్రత్యామ్నాయం భావాన్ని స్పష్టం చేసినా ఏకవచన నిర్మాణాన్ని బహువచనంగా మారుస్తుంది.
- issue: ‘ఆత్మ’ అనే పదం సూచించే వ్యక్తి
  choice: ఆత్మ
  alternative: పరిశుద్ధాత్మ
  rationale: సందర్భంలో మాట్లాడుతున్నది పరిశుద్ధాత్మనే. అయినా గ్రీకు పాఠంలో ἅγιον (‘పరిశుద్ధ’) లేదు కాబట్టి ప్రధాన వాక్యంలో దాన్ని చేర్చకుండా, సూచిత అర్థాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన వాక్యనిర్మాణాన్ని ఉపయోగించాం. ‘వినుగాక’ కొంత గంభీరమైనదైనా, ఆజ్ఞార్థక బలాన్ని ఖచ్చితంగా నిలిపి సాధారణ పాఠకులకు అర్థమయ్యే రూపం. ‘సంఘాలు’ ప్రకటన గ్రంథంలోని స్థానిక క్రైస్తవ సమూహాలకు స్థిరమైన, సహజమైన పదం.
