  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/013.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: te
  text: చెవి ఉన్నవాడు, ఆత్మ సంఘాలకు చెప్పేది వినాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “చెవి ఉన్నవాడు, ఆత్మ సంఘాలకు చెప్పేది వినుగాక.”'
    reason: ఆజ్ఞార్థక నిర్మాణానికి అక్షరార్థ ప్రత్యామ్నాయం
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: చెవి ఉన్నవాడు
  rationale: గ్రీకు వాక్యంలోని ఏకవచన, సామెతలాంటి పిలుపును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀκουσάτω
  choice: వినాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞార్థక భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; కేవలం శబ్దం వినడం మాత్రమే కాక శ్రద్ధగా ఆలకించి స్పందించాలనే భావానికీ చోటిస్తుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: ప్రకటన గ్రంథంలోని పునరావృత సందేశ సూత్రంలో ఇది పరిశుద్ధాత్మను సూచిస్తుంది; తెలుగు బైబిలు వాడుకకు అనుగుణంగా గౌరవార్థక సూచనను నిలుపుతుంది.
- source_word: λέγει
  choice: చెప్పేది
  rationale: ఆత్మ పలుకుతున్న సందేశ విషయాన్ని ‘ఏమి’తో కలిపి సహజ తెలుగు సంబంధవాచక నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ταῖς ἐκκλησίαις
  choice: సంఘాలకు
  rationale: సందేశాన్ని అందుకునే బహువచన సమూహాలను సూచిస్తుంది; ప్రకటనలోని ఏడు సంఘాల సందర్భానికి ‘సంఘాలు’ ప్రామాణికమైన తెలుగు పదం.
theological_decisions:
- issue: ‘ఆత్మ’ యొక్క సూచిత వ్యక్తి
  choice: సంఘాలతో మాట్లాడుతున్న పరిశుద్ధాత్మ
  alternative: మానవ ఆత్మ లేదా వ్యక్తిత్వరహిత ప్రవచన ప్రేరణ
  rationale: ప్రకటన గ్రంథంలో సంఘాలకు ఇచ్చే సందేశాల చివర పునరావృతమయ్యే ఈ సూత్రంలో ‘ఆత్మ’ పరిశుద్ధాత్మను సూచించడం సందర్భానికి అత్యంత అనుకూలం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకులోని ఏకవచన ‘చెవి’ని నిలిపి, ఆజ్ఞార్థక భావాన్ని సహజ తెలుగు ‘వినాలి’తో అందించింది.
