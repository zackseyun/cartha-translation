source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: te
  text: మెలకువగా ఉండు; చనిపోబోతున్న మిగిలిన వాటిని బలపరచు. ఎందుకంటే నా దేవుని ఎదుట నీ క్రియలు పూర్తిగా నెరవేరినవిగా నాకు కనిపించలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: మేలుకో!
  rationale: అక్షరార్థంగా ‘మెలకువగా ఉంటూ ఉండు’ అనే భావం ఉన్నప్పటికీ, సార్దీసు సంఘం ఆత్మీయ నిద్రావస్థను ఉద్దేశించిన సందర్భంలో సహజమైన, ప్రత్యక్ష హెచ్చరికగా ‘మేలుకో’ సరిపోతుంది.
- source_word: στήρισον
  choice: బలపరచు
  rationale: మిగిలి ఉన్నవాటిని స్థిరపరచి దృఢం చేయాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὰ λοιπά
  choice: మిగిలి ఉన్నవాటిని
  rationale: గ్రీకు నపుంసక బహువచనంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది; అది వ్యక్తులా, క్రియలా, ఆత్మీయ వాస్తవాలా అని నిర్ణయించదు.
- source_word: ἃ ἔμελλον ἀποθανεῖν
  choice: అవి చనిపోవడానికి సిద్ధంగా ఉన్నాయి
  rationale: μέλλω యొక్క సమీపిస్తున్న ప్రమాద భావాన్ని తెలియజేస్తూ, ఇంకా పూర్తిగా చనిపోలేదనే ఉద్వేగాన్ని కాపాడుతుంది.
- source_word: πεπληρωμένα
  choice: సంపూర్ణమైనవిగా
  rationale: క్రియలు దేవుని ప్రమాణం ఎదుట పూర్తిగా నెరవేరిన స్థితిలో లేవనే perfect passive భావాన్ని ప్రతిబింబిస్తుంది.
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: నా దేవుని ఎదుట
  rationale: దైవిక పరిశీలన మరియు తీర్పు భావాన్ని, అలాగే ‘నా దేవుడు’ అనే మూలపాఠంలోని సంబంధపూర్వక పదబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘మేలుకో’ లేదా ‘మెలకువగా ఉండు’
  choice: మేలుకో!
  alternative: మెలకువగా ఉండు
  rationale: వర్తమాన imperative నిర్మాణం నిరంతర జాగరూకతను సూచించగలిగినా, సందర్భం నిద్రనుంచి మేల్కొనే అత్యవసర పిలుపును బలంగా మద్దతిస్తుంది. అయినా దీన్ని శారీరక నిద్రగా పరిమితం చేయలేదు.
- issue: చనిపోవడానికి సమీపించిన వాటి గుర్తింపు
  choice: మిగిలి ఉన్నవాటిని
  alternative: మిగిలి ఉన్నవారిని
  rationale: మూలంలోని τὰ λοιπά నపుంసక రూపం కావడంతో, దాన్ని కేవలం వ్యక్తులుగా వ్యాఖ్యానించకుండా అస్పష్టతను కాపాడాం.
- issue: క్రియల స్థితి
  choice: సంపూర్ణమైనవిగా కనిపించలేదు
  alternative: పరిపూర్ణమైనవిగా కనిపించలేదు
  rationale: ఇక్కడ భావం పాపరహిత పరిపూర్ణత కంటే దేవుని ఎదుట పూర్తిగా నెరవేరని క్రియలపై ఉండవచ్చు; అందువల్ల ‘సంపూర్ణమైనవి’ తక్కువ సిద్ధాంతాత్మక భారంతో మూలాన్ని ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; అత్యవసర హెచ్చరికకు తగిన సంక్షిప్త, గంభీర శైలి. ‘క్రియలు’ అనే పదం బైబిలు సందర్భానికి సుపరిచితమైనదిగా ఉండి, సాధారణ పాఠకుడికీ స్పష్టంగా ఉంటుంది.
