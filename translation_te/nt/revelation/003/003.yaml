id: REV.3.3
reference: Revelation 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: te
  text: కాబట్టి, నీవు ఏ విధంగా పొందావో, విన్నావో జ్ఞాపకం చేసుకో[a]; దానిని పాటించు, పశ్చాత్తాపపడు. కాబట్టి నీవు మేలుకొని ఉండకపోతే[b], నేను దొంగలా వస్తాను[c]; ఏ గంటలో నీ మీదకు వస్తానో నీకు ఎంతమాత్రమూ తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు ఏమి పొందావో, విన్నావో జ్ఞాపకం చేసుకో.’ గ్రీకు పాఠంలో ‘ఏ విధంగా’ అని ఉంది. అది వారు స్వీకరించిన విధానాన్ని నొక్కి చెప్పవచ్చు; అయితే కొందరు దానిని వారు స్వీకరించిన సందేశాన్ని సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: ‘మేలుకొని ఉండు’ అనే మాటను ‘అప్రమత్తంగా ఉండు’ లేదా ‘కాపలా కాస్తూ ఉండు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘నేను దొంగలా వస్తాను’ అనే హెచ్చరిక ఆకస్మికమైన, ఊహించని సందర్శన గురించి ఇతర చోట్ల వాడిన భాషను ప్రతిధ్వనిస్తుంది. ఇది అంతిమ తీర్పును సూచిస్తుందా లేక మరింత తక్షణమైన క్రమశిక్షణాత్మక చర్యను సూచిస్తుందా అనేది ఈ వచనం స్వయంగా నిర్దేశించదు.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: జ్ఞాపకం చేసుకో
  rationale: వర్తమానకాల ఆజ్ఞ నిరంతరంగా జ్ఞాపకం ఉంచుకోవాలనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన, స్పష్టమైన ఆజ్ఞ.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న గద్దింపునుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: πῶς
  choice: ఏ విధంగా
  rationale: గ్రీకు క్రియావిశేషణం ప్రధానంగా పొందిన, విన్న విధానాన్ని సూచిస్తుంది; దానిని ‘ఏమి’గా మార్చకుండా మూలంలోని సందిగ్ధతను కాపాడుతుంది.
- source_word: εἴληφας
  choice: పొందావో
  rationale: పూర్ణకాల రూపం గతంలో పొందినదానికి కొనసాగుతున్న ప్రాసంగికత ఉందని సూచిస్తుంది; తెలుగు సందర్భంలో ఈ సాధారణ భూతరూపం సహజంగా ఆ భావాన్ని మోస్తుంది.
- source_word: ἤκουσας
  choice: విన్నావో
  rationale: గతంలోని వినికిడి చర్యను నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τήρει
  choice: దానిని పాటించి
  rationale: τηρέωలోని కాపాడటం, ఆచరించడం అనే భావాల్లో ఈ ఉపదేశ సందర్భంలో విధేయతను సహజంగా తెలుపుతుంది; ‘దానిని’ అనేది పొందినదీ విన్నదీ అయిన సందేశాన్ని సూచించేందుకు తెలుగులో చేర్చబడింది.
- source_word: μετανόησον
  choice: పశ్చాత్తాపపడు
  rationale: పాపం నుంచి తిరగడాన్ని సూచించే ప్రామాణిక నూతన నిబంధన పదప్రయోగం; గంభీరమైన ఆధునిక తెలుగులో సుపరిచితం.
- source_word: γρηγορήσῃς
  choice: మేలుకొని ఉండకపోతే
  rationale: మేల్కొని అప్రమత్తంగా ఉండే మూల రూపకాన్ని నిలుపుతుంది; తరువాతి దొంగ ఉపమానంతో సహజంగా సరిపోతుంది.
- source_word: ἥξω ὡς κλέπτης
  choice: నేను దొంగలా వస్తాను
  rationale: ఆకస్మికమైన, ఊహించని రాకను సూచించే ఉపమానాన్ని సహజ తెలుగు రూపంలో నిలుపుతుంది.
- source_word: οὐ μὴ γνῷς
  choice: నీకు ఎంతమాత్రమూ తెలియదు
  rationale: οὐ μή యొక్క బలమైన నిరాకరణను ‘ఎంతమాత్రమూ’ ద్వారా సహజంగా, గట్టిగా వ్యక్తపరుస్తుంది.
- source_word: ποίαν ὥραν
  choice: ఏ గంటలో
  rationale: సాధారణ ‘సమయం’ కంటే మూలంలోని నిర్దిష్టమైన ‘గంట’ పదాన్ని, ప్రకటన గ్రంథపు గంభీర స్వరాన్ని నిలుపుతుంది.
- source_word: ἐπὶ σέ
  choice: నీ మీదికి
  rationale: సంబోధితుని వైపు లేదా అతనికి విరోధంగా వచ్చే భావాన్ని నిలుపుతూ, సందర్శననా తీర్పా అనే అర్థాన్ని అనవసరంగా నిర్ణయించదు.
theological_decisions:
- issue: πῶς εἴληφας καὶ ἤκουσας అనే ఉపదేశం యొక్క స్వభావం
  choice: ‘నీవు ఏ విధంగా పొందావో, విన్నావో’ అని అనువదించబడింది.
  alternative: ‘నీవు ఏమి పొందావో, విన్నావో’
  rationale: మూలంలో πῶς (‘ఎలా/ఏ విధంగా’) ఉంది; అది మొదటిగా స్వీకరించిన విధానాన్ని సూచించవచ్చు. సందేశ విషయాన్నే సూచిస్తుందని కూడా అర్థం చేసుకోవచ్చు కాబట్టి ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి, ప్రధాన పాఠ్యంలో మూల పదాన్ని నిలిపాం.
- issue: ‘నేను దొంగలా వస్తాను’ అనే హెచ్చరిక యొక్క పరిధి
  choice: ఊహించని రాక గురించిన హెచ్చరికగా మాత్రమే ఉంచబడింది.
  alternative: దీనిని అంతిమ రాకగా లేదా స్థానిక క్రమశిక్షణాత్మక తీర్పుగా స్పష్టంగా నిర్దేశించడం
  rationale: ఈ వాక్యం ఆ రాక అంతిమ తీర్పునా, తక్షణ శిక్షణాత్మక చర్యనా అని నిర్ణయించదు; అందువల్ల ఉపమానంలోని ఉద్దేశపూర్వక విశాలతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ఏకవచన సంబోధనను వాడాం. ‘జ్ఞాపకం చేసుకో,’ ‘పశ్చాత్తాపపడు,’ ‘మేలుకొని ఉండు’ వంటి సుపరిచిత బైబిలు పదబంధాలను నిలిపి, మూలంలోని ఉపదేశ ధాటిని కాపాడాం. ప్రధాన పాఠ్యంలో పాదసూచిక గుర్తులు [a], [b], [c] అన్నీ సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
