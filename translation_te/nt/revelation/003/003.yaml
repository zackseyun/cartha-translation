review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the main Greek clauses, including πῶς (“how/in what way”), the emphatic οὐ μὴ (“certainly not”), and the deliberately open-ended warning of the coming “like a thief.” However, τήρει is an independent present imperative coordinated with μετανόησον; rendering it as పాటించి (“having kept/keeping”) weakens its coordinate imperatival force.
  naturalness: The Telugu is generally clear and uses an appropriate solemn modern register. Recasting పాటించి as the direct imperative పాటించు makes the exhortation more natural and syntactically faithful. ‘నీ మీదకు’ is slightly more idiomatic than ‘నీ మీదికి’ in this warning context.
  terminology: జ్ఞాపకం చేసుకో, పశ్చాత్తాపపడు, మేలుకొని ఉండు, and దొంగలా వస్తాను are suitable modern-standard Telugu renderings. The notes preserve the source ambiguity and do not impose a doctrinal interpretation.
  issues:
  - severity: medium
    issue: The rendering ‘దానిని పాటించి’ does not retain τήρει as a coordinate imperative.
    rationale: τήρει and μετανόησον are both imperatives joined by καί. ‘పాటించు, పశ్చాత్తాపపడు’ preserves two direct commands, whereas పాటించి makes the first action subordinate or sequential.
  - severity: low
    issue: ‘నీ మీదికి’ is less idiomatic than ‘నీ మీదకు’ here.
    rationale: Both can communicate movement toward the addressee, but ‘నీ మీదకు’ is the more natural modern Telugu expression while retaining the non-specific force of ἐπὶ σέ.
