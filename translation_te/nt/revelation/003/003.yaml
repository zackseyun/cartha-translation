revisions:
- from: కాబట్టి, నీవు ఏ విధంగా పొందావో, విన్నావో జ్ఞాపకం చేసుకో[a]; దానిని పాటించి, పశ్చాత్తాపపడు. కాబట్టి నీవు మేలుకొని ఉండకపోతే[b], నేను దొంగలా వస్తాను[c]; ఏ గంటలో నీ మీదికి వస్తానో నీకు ఎంతమాత్రమూ తెలియదు.
  to: కాబట్టి, నీవు ఏ విధంగా పొందావో, విన్నావో జ్ఞాపకం చేసుకో[a]; దానిని పాటించు, పశ్చాత్తాపపడు. కాబట్టి నీవు మేలుకొని ఉండకపోతే[b], నేను దొంగలా వస్తాను[c]; ఏ గంటలో నీ మీదకు వస్తానో నీకు ఎంతమాత్రమూ తెలియదు.
  rationale: The revision restores the independent imperative force of τήρει by changing ‘దానిని పాటించి’ to ‘దానిని పాటించు.’ It also makes a minor idiomatic adjustment from ‘నీ మీదికి’ to ‘నీ మీదకు,’ without resolving the source text’s intentionally open question of whether the coming is visitation, discipline, or final judgment. All footnote anchors and their corresponding notes are retained.
