source:
  edition: SBLGNT
  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: te
  text: అందుచేత, నీవు గోరువెచ్చగా ఉన్నావు, వేడిగానీ చల్లగానీ లేవు కాబట్టి, నిన్ను నా నోటి నుండి కక్కివేయబోతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిన్ను నా నోటి నుండి బయటకు త్రోసివేయబోతున్నాను.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘వాంతి చేయడం’ అనే బలమైన భావం ఉంది; ‘ఉమ్మివేయడం’ దాని తీవ్రతను పూర్తిగా తెలియజేయదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: అందుచేత
  rationale: ముందటి వాక్యంలో చెప్పిన స్థితి నుంచి వచ్చే పర్యవసానాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: ప్రకటించబోయే తీర్పుకు కారణాన్ని స్పష్టంగా తెలియజేసే కారణార్థక ప్రయోగం.
- source_word: χλιαρός
  choice: గోరువెచ్చగా
  rationale: వేడి, చల్లని అనే ఉష్ణోగ్రత వ్యత్యాసం మధ్యనున్న స్థితిని సహజంగా, ఖచ్చితంగా వ్యక్తం చేస్తుంది.
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: వేడిగా గానీ చల్లగా గానీ లేవు
  rationale: గ్రీకులోని జత వ్యత్యాసాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా తెలుగులో నిలుపుతుంది.
- source_word: μέλλω
  choice: వేయబోతున్నాను
  rationale: జరగబోయే చర్య సమీపంలో ఉందనే μέλλω యొక్క భావాన్ని నిలుపుతుంది.
- source_word: ἐμέσαι
  choice: కక్కివేయు
  rationale: గ్రీకు క్రియలోని బలమైన, అసహ్యకరమైన వాంతి చిత్రాన్ని మెత్తబరచకుండా సహజమైన తెలుగులో అందిస్తుంది; ‘ఉమ్మివేయు’ దీనికంటే బలహీనమైనది.
- source_word: ἐκ τοῦ στόματός μου
  choice: నా నోటిలోనుండి
  rationale: బయటకు విసర్జించడాన్ని సూచించే సజీవమైన శరీర చిత్రాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ἐμέσαιలోని తీర్పు చిత్రం ఎంత బలంగా ఉండాలి
  choice: ‘కక్కివేయు’ అనే బలమైన చిత్రాన్ని నిలుపడం
  alternative: ‘ఉమ్మివేయు’
  rationale: మూలపాఠం ఉద్దేశపూర్వకంగా దిగ్భ్రాంతికరమైన దైవిక తిరస్కరణ చిత్రాన్ని వాడుతుంది. దాన్ని ‘ఉమ్మివేయు’గా మెత్తబరచడం హెచ్చరిక బలాన్ని తగ్గిస్తుంది.
- issue: μέλλω యొక్క కాలభావం
  choice: ‘వేయబోతున్నాను’ అని సమీప చర్యగా అనువదించడం
  alternative: ‘వేస్తాను’
  rationale: గ్రీకు పదం కేవలం సాధారణ భవిష్యత్తును కాక, ఆసన్నమైన చర్యను సూచిస్తుంది; అనువాదం ఆ అత్యవసరతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ప్రకటన గ్రంథంలోని గంభీరమైన హెచ్చరిక స్వరాన్ని మరియు మూలంలోని కఠిన చిత్రాన్ని నిలుపుతూ రూపొందించబడింది.
