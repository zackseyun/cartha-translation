id: REV.3.5
reference: Revelation 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: te
  text: జయించేవాడు[a] ఈ విధంగా తెల్లని వస్త్రాలు ధరిస్తాడు; అతని పేరును జీవగ్రంథం[c] నుండి నేను ఎంతమాత్రమూ తుడిచివేయను[b]; నా తండ్రి ఎదుట, ఆయన దూతల ఎదుట అతని పేరును నేను బహిరంగంగా అంగీకరిస్తాను[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అధిగమించేవాడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతని పేరును జీవగ్రంథం నుండి ఎన్నటికీ తుడిచివేయను.’ గ్రీకులో ఇక్కడ బలమైన నిరాకరణ ఉంది.
    reason: lexical_alternative
  - marker: c
    text: అంటే, దేవునికి చెందినవారిగా జీవాన్ని స్వాస్థ్యంగా పొందేవారి పేర్లు ఉన్న పరలోకపు నమోదు.
    reason: cultural_note
  - marker: d
    text: లేదా ‘అతని పేరును ఒప్పుకుంటాను.’ మత్తయి 10:32తో పోల్చండి.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ νικῶν
  choice: జయించేవాడు
  rationale: వర్తమాన కృదంతం ఇక్కడ వ్యక్తిని సూచించే నామవాచక ప్రయోగం. ‘జయించేవాడు’ ప్రకటన గ్రంథంలోని విజయ భావాన్ని, కొనసాగుతున్న లక్షణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: ముందున్న సందర్భంలోని వాగ్దానంతో సంబంధాన్ని చూపే గ్రీకు క్రియావిశేషణాన్ని వదలకుండా స్పష్టంగా అనువదిస్తుంది.
- source_word: περιβαλεῖται
  choice: ధరిస్తాడు
  rationale: ఈ మధ్యమ/కర్మణి రూపాన్ని తెలుగు సహజ ప్రయోగంలో ఫలితాన్ని తెలిపే విధంగా అనువదించాం. కృత్రిమమైన ‘ధరింపజేయబడతాడు’ కంటే ఇది స్పష్టం; వస్త్రాలు ఇవ్వబడుతున్న వాగ్దాన సందర్భం దాని భావాన్ని తెలియజేస్తుంది.
- source_word: ἱματίοις λευκοῖς
  choice: తెల్లని వస్త్రాలు
  rationale: ἱμάτια సాధారణంగా వస్త్రాలను సూచిస్తుంది; మరింత నిర్దిష్టమైన ‘అంగీలు’ లేదా ‘పొడవాటి వస్త్రాలు’ అనే భావాన్ని అనవసరంగా చేర్చకుండా మూలంలోని ప్రతీకాత్మక తెలుపును నిలుపుతుంది.
- source_word: οὐ μὴ ἐξαλείψω
  choice: నేను ఎంతమాత్రమూ తుడిచివేయను
  rationale: οὐ μήతో కూడిన భవిష్యత్ క్రియలోని బలమైన నిరాకరణను ‘ఎంతమాత్రమూ ... చేయను’ సహజంగా వ్యక్తపరుస్తుంది. గ్రంథం/నమోదు రూపకానికి ‘తుడిచివేయడం’ సరిపోతుంది.
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: జీవగ్రంథం నుండి
  rationale: ఇది స్థిరమైన బైబిలు పదబంధం; βίβλοςను సందర్భానుసారంగా ‘గ్రంథం’ అని అనువదించడం పరలోకపు నమోదుపుస్తక రూపకాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ὁμολογήσω τὸ ὄνομα αὐτοῦ
  choice: అతని పేరును నేను బహిరంగంగా అంగీకరిస్తాను
  rationale: ὁμολογέω ఇక్కడ ఒకరి పేరును బహిరంగంగా ఒప్పుకోవడం లేదా అంగీకరించడం. తెలుగులో ‘పేరును ఒప్పుకుంటాను’ కంటే ‘బహిరంగంగా అంగీకరిస్తాను’ ఉద్దేశించిన ప్రకటనా భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐνώπιον τοῦ πατρός μου
  choice: నా తండ్రి ఎదుట
  rationale: సంక్షిప్తమైన ప్రత్యక్ష అనువాదం; యేసు తన తండ్రితో కలిగిన సంబంధాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ἐνώπιον τῶν ἀγγέλων αὐτοῦ
  choice: ఆయన దూతల ఎదుట
  rationale: సమీప వ్యాకరణ పూర్వపదమైన ‘నా తండ్రి’ని αὐτοῦ సూచించడం సహజం. తెలుగు గౌరవ ఏకవచనం ఆ సంబంధాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: జీవగ్రంథం నుండి పేరును తుడిచివేయననే వాగ్దానం—విశ్వాసంలో నిలకడ లేదా భ్రష్టత్వం గురించిన వాదాలు
  choice: జయించేవానికి ఇచ్చిన బలమైన హామీగా వాక్యాన్ని నేరుగా అనువదించాం; రక్షణను కోల్పోవచ్చా లేదా నిజమైన విశ్వాసి తప్పక చివరివరకు నిలుస్తాడా అనే సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
  alternative: దీనిని పరిశుద్ధుల తప్పనిసరి నిలకడకు సంపూర్ణ హామీగా చదవడం; లేదా కొందరి పేరు జీవగ్రంథం నుండి తొలగించబడవచ్చనే పరోక్ష హెచ్చరికగా చదవడం.
  rationale: ఈ వచనం జయించేవానికి క్రీస్తు ఇచ్చే వాగ్దానంపైనే నేరుగా దృష్టి పెడుతుంది. విస్తృత సిద్ధాంత వివాదాన్ని ఈ మాటలు ఒక్కటే స్పష్టంగా పరిష్కరించవు; అందుచేత మూలంలోని ఉద్రిక్తతను నిలిపాం.
- issue: ὁ νικῶν మరియు αὐτοῦలోని పుంలింగ ఏకవచన రూపం
  choice: ‘జయించేవాడు’, ‘అతని పేరు’ అనే పుంలింగ ఏకవచనాన్ని ప్రతినిధి భావంతో నిలిపాం.
  alternative: లింగతటస్థ బహువచనంగా ‘జయించేవారు’, ‘వారి పేర్లు’ అని మార్చడం.
  rationale: మూలంలోని ఏకవచన వ్యాకరణ రూపాన్ని నిలుపుతూ, అది సంఘంలోని ఏ జయించేవానికైనా వర్తించే ప్రతినిధి ప్రయోగమని సందర్భం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి స్పష్టంగా ఉండే శైలిని వాడాం. ‘జీవగ్రంథం’ వంటి స్థిరమైన బైబిలు పదాన్ని నిలిపి, అసహజమైన కర్మణి నిర్మాణాలను నివారించాం. గ్రీకు మూలంలోని మూడు సమాంతర వాగ్దానాలను సెమీకోలన్‌లతో ఒకే వాక్యంగా ఉంచాం.
