id: REV.3.7
reference: Revelation 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: te
  text: '“ఫిలదెల్ఫియలో ఉన్న సంఘపు దూతకు[a] ఇలా రాయి: ‘పరిశుద్ధుడు, నిజమైనవాడు, దావీదు తాళపు చెవిని కలిగినవాడు[b], తెరిచేవాడు—ఎవరూ మూయరు; మూసేవాడు—ఎవరూ తెరవరు—ఇలా చెబుతున్నాడు:’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దూత’ (ἀγγέλῳ) అనే పదానికి ‘సందేశవాహకుడు’ అని కూడా అర్థం కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘దావీదు తాళపు చెవి’ అనే మాట బహుశా యెషయా 22:22ను సూచిస్తుంది; అది తెరవడానికి, మూయడానికి గల రాజాధికారానికి రూపకం.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: దూతకు
  rationale: ‘దూత’ అనే తెలుగు పదం పరలోక దూత లేదా మానవ సందేశవాహకుడు అనే రెండు సాధ్యమైన అర్థాలనూ కొంతవరకు నిలుపుతుంది. ప్రకటన గ్రంథంలోని ఏడు సంఘాల సంబోధన సూత్రాన్ని అనవసరంగా ఒకే వ్యాఖ్యానానికి పరిమితం చేయదు.
- source_word: ἐκκλησίας
  choice: సంఘపు
  rationale: ఇక్కడ క్రైస్తవ విశ్వాసుల సమాజాన్ని సూచించే సహజమైన, ప్రస్తుత తెలుగు పదం ‘సంఘం’.
- source_word: Τάδε λέγει
  choice: ఇలా చెబుతున్నాడు
  rationale: ప్రవక్తల ప్రకటన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో గంభీరంగా వ్యక్తం చేస్తూ, τάδε యొక్క సూచనార్థాన్ని నిలుపుతుంది.
- source_word: ὁ ἅγιος
  choice: పరిశుద్ధుడు
  rationale: ఆర్టికల్‌తో నామవాచకంగా వాడిన విశేషణం ఇక్కడ వక్తకు బిరుదుగా ఉంది; ‘పరిశుద్ధుడు’ ఆ బిరుదు స్వరూపాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ὁ ἀληθινός
  choice: నిజమైనవాడు
  rationale: ἀληθινός కేవలం నిజం మాట్లాడే వ్యక్తిని కాక నిజమైన, యథార్థమైన వ్యక్తిని కూడా సూచిస్తుంది. ‘నిజమైనవాడు’ ఆ విస్తృత భావాన్ని ‘సత్యవంతుడు’ కంటే మెరుగుగా నిలుపుతుంది.
- source_word: κλεῖν Δαυίδ
  choice: దావీదు తాళపు చెవి
  rationale: మూలంలోని రూపకాన్ని నేరుగా నిలుపుతూ, యెషయా 22:22లోని దావీదు సంబంధమైన రాజాధికార సూచనను వివరణతో భర్తీ చేయదు.
- source_word: ἀνοίγων
  choice: తెరిచేవాడు
  rationale: వర్తమాన కృదంతాన్ని వక్తను వర్ణించే బిరుదుల వరుసలో సహజమైన తెలుగు రూపంగా అనువదిస్తుంది.
- source_word: κλείσει
  choice: మూయరు
  rationale: గ్రీకులోని భవిష్యత్ సూచనను సందర్భానుసారమైన తెలుగు నిరాకరణతో అందిస్తుంది; ఆయన తెరిచినదాన్ని మరెవరూ మూయరనే భావాన్ని నిలుపుతుంది.
- source_word: κλείων
  choice: మూసేవాడు
  rationale: ἀνοίγωνతో సమాంతరంగా, వక్తను వర్ణించే వర్తమాన కృదంతాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀνοίγει
  choice: తెరవరు
  rationale: 'గ్రీకులోని వర్తమాన నిరాకరణను సమాంతర తెలుగు నిర్మాణంలో నిలుపుతుంది: ఆయన మూసినదాన్ని ఎవరూ తెరవరు.'
theological_decisions:
- issue: ὁ ἅγιος, ὁ ἀληθινός అనే క్రీస్తుసంబంధ బిరుదులు
  choice: పునరుత్థానుడైన యేసుకు నేరుగా వర్తించే బిరుదులుగా ‘పరిశుద్ధుడు, నిజమైనవాడు’ అని అనువదించబడింది.
  alternative: సాధారణ విశేషణాలుగా ‘పరిశుద్ధమైన, నిజమైన వ్యక్తి’ అని అనువదించడం.
  rationale: ఆర్టికల్‌తో నామవాచకంగా వాడిన ఈ విశేషణాలు సందేశం పలికేవానికి గంభీరమైన బిరుదులుగా పనిచేస్తాయి. పాఠం చెప్పేదానిని మించకుండా దాని ఉన్నత క్రీస్తు దృక్పథాన్ని నిలుపుతుంది.
- issue: ‘దావీదు తాళపు చెవి’లోని యెషయా గ్రంథ సూచన
  choice: రాజాధికారాన్ని సూచించే మూల రూపకాన్ని ప్రధాన పాఠంలో యథాతథంగా ఉంచి, సూచనను పాదసూచికలో తెలిపింది.
  alternative: ‘దావీదు రాజ్యంపై అధికారం కలిగినవాడు’ అని వివరణాత్మకంగా విస్తరించడం.
  rationale: ఈ మాట యెషయా 22:22ను సూచించే అవకాశం బలంగా ఉన్నా, అనువాదం బైబిలు రూపకాన్ని వ్యాఖ్యానంతో భర్తీ చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ప్రకటన శైలిని ఉపయోగించాం. ‘దూత’లోని ఉద్దేశపూర్వక అస్పష్టతను నిలిపాం. సమాంతరమైన ‘తెరిచేవాడు/మూసేవాడు’ నిర్మాణం మూలపాఠపు లయను కాపాడుతుంది. పాదసూచిక గుర్తులు ప్రధాన పాఠంలోని సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
