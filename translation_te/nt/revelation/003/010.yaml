review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the causal clause, reciprocal emphasis (‘I also’), the coming global testing, and its purpose. However, ‘నివాసిత లోకం’ is not idiomatic modern Telugu and weakens the natural expression of ἡ οἰκουμένη; ‘ప్రపంచమంతటిమీదికి’ conveys the inhabited-world sense adequately in context. The phrase τηρήσω ἐκ is retained as ‘... నుండి కాపాడుతాను,’ without deciding the disputed manner of protection.
  naturalness: Most of the verse is clear and appropriately formal. ‘నా సహన వాక్యం’ is somewhat compressed but serviceable and preserves the genitival openness. Replacing ‘నివాసిత లోకమంతటిమీదికి’ with ‘ప్రపంచమంతటిమీదికి’ produces natural modern standard Telugu. ‘భూమిపై నివసించేవారు’ appropriately retains Revelation’s recurring expression.
  terminology: ‘సహన వాక్యం,’ ‘పరీక్షా ఘడియ,’ ‘కాపాడుతాను,’ and ‘భూమిపై నివసించేవారు’ are suitable. The footnote’s first alternative should use ‘సహనం’ rather than ‘సహనాన్ని,’ since the possible sense is ‘the word concerning my endurance,’ and the wording should make clear that the alternatives are interpretive possibilities rather than a settled choice.
  issues:
  - severity: medium
    issue: ‘నివాసిత లోకమంతటిమీదికి’ is unnatural Telugu.
    rationale: Although it seeks to reflect οἰκουμένη (‘inhabited world’), ‘నివాసిత లోకం’ is not idiomatic in modern standard Telugu. ‘ప్రపంచమంతటిమీదికి’ is natural and retains the intended global scope.
  - severity: low
    issue: Footnote a’s wording ‘నా సహనాన్ని గూర్చిన వాక్యం’ is less precise than needed.
    rationale: The Greek genitive concerns ‘my endurance’; Telugu ‘నా సహనాన్ని గూర్చిన’ can sound like an object-focused paraphrase. ‘నా సహనం గురించిన వాక్యం’ is more natural and accurately represents the alternative sense.
  revised_text: నీవు నా సహన వాక్యాన్ని[a] పాటించావు కాబట్టి, భూమిపై నివసించేవారిని పరీక్షించడానికి ప్రపంచమంతటిమీదికి రాబోతున్న పరీక్షా ఘడియ నుండి[b] నేను కూడా నిన్ను కాపాడుతాను.
