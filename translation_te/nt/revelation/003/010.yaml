id: REV.3.10
reference: Revelation 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: te
  text: నీవు నా సహన వాక్యాన్ని[a] పాటించావు కాబట్టి, భూమిపై నివసించేవారిని పరీక్షించడానికి ప్రపంచమంతటిమీదికి రాబోతున్న పరీక్షా ఘడియ నుండి[b] నేను కూడా నిన్ను కాపాడుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా సహనం గురించిన వాక్యం,’ లేదా ‘సహించమని పిలిచే నా సందేశం.’ గ్రీకు పదబంధాన్ని దగ్గరి సంబంధమున్న ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పరీక్షా ఘడియలోనుండి నిన్ను భద్రపరుస్తాను,’ లేదా ‘పరీక్షా ఘడియకు దూరంగా నిన్ను ఉంచుతాను.’ గ్రీకులో అక్షరార్థంగా ‘నుండి కాపాడుతాను’ అని ఉంది; ఈ రక్షణ ఎలా జరుగుతుందనే తరువాతి వేదాంత వివాదాలను ఆ మాటలే తేల్చవు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: పాటించావు
  rationale: సందేశం లేదా వాక్యాన్ని విధేయతతో ఆచరించడం అనే సందర్భానుకూల భావాన్ని ఇస్తుంది; తరువాతి τηρήσωతో ఉన్న పదబంధ సంబంధం తెలుగులో సహజత కోసం ‘కాపాడుతాను’గా వ్యక్తమవుతుంది.
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: నా సహన వాక్యాన్ని
  rationale: 'గ్రీకు షష్ఠీ విభక్తి సంబంధంలోని ఉద్దేశపూర్వక అస్పష్టతను సాధ్యమైనంతగా నిలుపుతుంది: ఇది క్రీస్తు సహనాన్ని గూర్చిన వాక్యమో, సహనంతో లక్షణీకరించబడిన వాక్యమో, సహనానికి పిలిచే సందేశమో కావచ్చు.'
- source_word: κἀγώ
  choice: నేను కూడా
  rationale: వారు ఆయన వాక్యాన్ని పాటించినందుకు ప్రతిస్పందనగా ఆయన కూడా వారిని కాపాడతాడనే ఉద్ఘాటిత పరస్పర భావాన్ని తెలియజేస్తుంది.
- source_word: τηρήσω ἐκ
  choice: నుండి … కాపాడుతాను
  rationale: τηρέω + ἐκకు సూటియైన తెలుగు రూపం; పరీక్షకు ముందే తొలగించడమా, దాని మధ్య కాపాడడమా అనే వివాదాన్ని ప్రధాన పాఠ్యం పరిష్కరించదు.
- source_word: ὥρας
  choice: ఘడియ
  rationale: సాధారణ కాలవ్యవధిని సూచించగలిగినా, ప్రకటన గ్రంథపు అపోకలిప్టిక్ శైలిలోని ‘గంట/hour’ రూపకాన్ని గౌరవప్రదంగా నిలుపుతుంది.
- source_word: πειρασμοῦ
  choice: పరీక్షా
  rationale: ‘శోధన,’ ‘ప్రలోభం,’ ‘పరీక్ష’ అనే భావాల్లో ఇక్కడ విశ్వవ్యాప్త పరీక్ష సందర్భానికి ‘పరీక్ష’ విస్తృతమైనది, తక్కువ వ్యాఖ్యాత్మకమైనది.
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: రాబోతున్న
  rationale: μέλλω + infinitiveలోని భావి/సమీప భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: నివాసిత లోకమంతటిమీదికి
  rationale: οἰκουμένηలోని ‘నివసించబడిన ప్రపంచం’ అనే ప్రత్యేక భావాన్ని కేవలం ‘లోకం’గా సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: πειράσαι
  choice: పరీక్షించడానికి
  rationale: రాబోయే పరీక్షా ఘడియ యొక్క ఉద్దేశాన్ని తెలియజేస్తూ πειρασμόςతో పదార్థ సంబంధాన్ని నిలుపుతుంది.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: భూమిపై నివసించేవారిని
  rationale: ప్రకటన గ్రంథంలో పునరావృతమయ్యే ఈ పదబంధంలోని క్రియారూపాన్ని, అంతర్గ్రంథ సారూప్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో τηρήσω ἐκ అర్థం
  choice: ఘడియ నుండి నిన్ను కాపాడుతాను
  alternative: ఘడియలోనుండి నిన్ను భద్రపరుస్తాను; ఆ ఘడియకు దూరంగా ఉంచుతాను
  rationale: గ్రీకు నిర్మాణాన్ని సూటిగా అనుసరిస్తూ, ఇది పరీక్షకు ముందు తొలగింపునా, పరీక్ష మధ్య రక్షణనా, లేక దాని ప్రభావం నుండి మినహాయింపునా అనే తరువాతి అంత్యకాల సిద్ధాంత వివాదాన్ని నిర్ణయించదు.
- issue: τὸν λόγον τῆς ὑπομονῆς μουలో షష్ఠీ విభక్తి భావం
  choice: నా సహన వాక్యం
  alternative: నా సహనాన్ని గూర్చిన వాక్యం; సహించమని పిలిచే నా సందేశం
  rationale: మూల గ్రీకు అనుమతించే దగ్గరి భావాల మధ్య ఉన్న అస్పష్టతను ఒకే వ్యాఖ్యానంతో పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బైబిలు శైలి. ‘నివాసిత లోకం,’ ‘పరీక్షా ఘడియ’ వంటి పదాలు మూలంలోని అపోకలిప్టిక్ స్వరాన్ని నిలుపుతాయి. పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
