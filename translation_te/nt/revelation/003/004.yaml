id: REV.3.4
reference: Revelation 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: te
  text: అయితే సార్దీసులో తమ వస్త్రాలను మలినం చేయని కొన్ని పేర్లు[a] నీకు ఉన్నాయి. వారు తెల్లని వస్త్రాల్లో[c] నాతో నడుస్తారు; ఎందుకంటే వారు యోగ్యులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కొద్దిమంది వ్యక్తులు.’ గ్రీకులో అక్షరార్థంగా ‘కొన్ని పేర్లు’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో సంక్షిప్తంగా ‘తెల్లనివాటిలో’ అని ఉంది; ఇక్కడ బహుశా తెల్లని వస్త్రాలు ఉద్దేశించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందున్న గద్దింపుకు బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ὀλίγα ὀνόματα
  choice: కొన్ని పేర్లు
  rationale: గ్రీకు మూలంలోని విశిష్టమైన ‘పేర్లు’ అనే ప్రయోగాన్ని నిలుపుతుంది; ఇది వ్యక్తులను సూచించే లక్షణార్థక ప్రయోగమని సందర్భం స్పష్టం చేస్తుంది.
- source_word: ἐν Σάρδεσιν
  choice: సార్దీసులో
  rationale: నగరనామానికి సహజమైన స్థానార్థక తెలుగు రూపం.
- source_word: οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν
  choice: తమ వస్త్రాలను మలినం చేయని
  rationale: వస్త్రాల ప్రతీకను, నైతిక అపవిత్రత భావాన్ని రెండింటినీ కాపాడుతూ సాధారణ పాఠకునికి అర్థమయ్యే భాషను ఉపయోగిస్తుంది.
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: నాతో నడుస్తారు
  rationale: సహవాసం, గౌరవం అనే అంతర్భావాలను ముందే నిర్ణయించకుండా నడవడం అనే మూల చిత్రాన్ని నిలుపుతుంది.
- source_word: ἐν λευκοῖς
  choice: తెల్లని వస్త్రాల్లో
  rationale: గ్రీకులో విశేషణం సంక్షిప్తంగా నామవాచకార్థంలో ఉంది; ముందున్న వస్త్రాల ప్రస్తావన ఆధారంగా తెలుగులో సహజంగా అర్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: ὅτι ἄξιοί εἰσιν
  choice: ఎందుకంటే వారు యోగ్యులు
  rationale: వాగ్దానానికి కారణాన్ని స్పష్టంగా తెలిపి, ἄξιος పదంలోని యోగ్యత భావాన్ని సిద్ధాంతపరమైన వివరణ లేకుండా నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ὀνόματα అనే పదాన్ని ‘వ్యక్తులు’ అని భావానువాదం చేయాలా, ‘పేర్లు’ అని నిలుపాలా
  choice: ప్రధాన పాఠ్యంలో ‘కొన్ని పేర్లు’ అని నిలుపడం
  alternative: కొద్దిమంది వ్యక్తులు
  rationale: ఇది సంఘంలో క్రీస్తుకు తెలిసిన నిర్దిష్ట వ్యక్తులను సూచించే ఉద్దేశపూర్వకమైన, గమనించదగిన మూల ప్రయోగం కావచ్చు; పాదసూచిక అర్థాన్ని వివరిస్తుంది.
- issue: μολύνωలోని నైతిక లేదా ఆచారపరమైన అపవిత్రత చిత్రాన్ని ఎలా వ్యక్తం చేయాలి
  choice: ‘వస్త్రాలను మలినం చేయని’
  alternative: ‘వస్త్రాలను అపవిత్రం చేయని’
  rationale: ప్రధాన అనువాదం వస్త్రాలపై మలినం అనే చిత్రాన్ని స్పష్టంగా ఉంచుతుంది; మరింత బలమైన ఆచారపరమైన భావమున్న ప్రత్యామ్నాయం పాదసూచికలో ఉంటుంది.
- issue: ἄξιοί εἰσινను విస్తృత రక్షణ సిద్ధాంతం ప్రకారం మృదువుగా మార్చాలా
  choice: ‘వారు యోగ్యులు’ అని నేరుగా అనువదించడం
  alternative: వారు తగినవారు
  rationale: వారి నమ్మకమైన పవిత్రతకు, వాగ్దానం చేసిన సహవాసానికి మధ్య వాక్యం చూపే సంబంధాన్ని నిలుపుతూ, యోగ్యతకు సంబంధించిన విస్తృత సిద్ధాంతాన్ని అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, ప్రకటన గ్రంథంలోని ప్రతీకాత్మకమైన గంభీర శైలిని కాపాడింది. ‘పేర్లు,’ ‘నడుస్తారు,’ ‘యోగ్యులు’ వంటి మూలంలోని ఉద్దేశపూర్వక పదాలను సిద్ధాంతపరంగా విస్తరించకుండా నిలిపింది.
