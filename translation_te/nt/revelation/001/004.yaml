id: REV.1.4
reference: Revelation 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: te
  text: 'ఆసియాలోని ఏడు సంఘాలకు యోహాను నుండి: ఉన్నవాడూ, ఉండినవాడూ, వస్తున్నవాడూ అయిన ఆయన నుండి, అలాగే ఆయన సింహాసనం ఎదుట ఉన్న ఏడు ఆత్మల నుండి మీకు కృప, సమాధానం కలుగుగాక.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰωάννης
  choice: యోహాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: ఏడు సంఘాలకు
  rationale: ప్రకటన గ్రంథంలోని క్రైస్తవ సమాజాల సందర్భంలో ἐκκλησίαకు సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం ‘సంఘం’.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: ఆసియాలో ఉన్న
  rationale: గ్రీకు భౌగోళిక నామాన్ని నేరుగా నిలుపుతుంది; చారిత్రక సందర్భంలో ఇది ఆధునిక ఆసియా ఖండమంతటిని కాక రోమా సామ్రాజ్యంలోని ఆసియా ప్రాంతాన్ని సూచిస్తుంది.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: మీకు కృప, సమాధానం కలుగుగాక
  rationale: గ్రీకు ఆశీర్వాద వాక్య భావాన్ని ఆధునిక తెలుగులో సహజంగా, గంభీరంగా వ్యక్తపరుస్తుంది; కృప మరియు సమాధానం రెండింటినీ విడిగా నిలుపుతుంది.
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: ఉన్నవాడూ, ఉండినవాడూ, వస్తున్నవాడూ అయిన ఆయన నుండి
  rationale: గ్రీకులోని ఉద్దేశపూర్వకంగా అసాధారణమైన దైవ బిరుదును వ్యక్తిగత సూచనతో నిలుపుతూ, ὁ ἐρχόμενος యొక్క వర్తమాన కృదంత బలాన్ని ‘వస్తున్నవాడు’గా వ్యక్తపరుస్తుంది.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: ఏడు ఆత్మల నుండి
  rationale: గ్రీకు పాఠంలోని బహువచనాన్ని వ్యాఖ్యానాత్మకంగా ‘ఏడంతల ఆత్మ’గా మార్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: ఆయన సింహాసనం ఎదుట ఉన్న
  rationale: స్థాన సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది; ఆ ఆత్మల స్వరూపాన్ని అదనంగా నిర్వచించదు.
theological_decisions:
- issue: ‘ఉన్నవాడు, ఉండినవాడు, వస్తున్నవాడు’ అనే బిరుదు యొక్క రూపం
  choice: దీనిని దేవునికి సంబంధించిన వ్యక్తిగత దైవ బిరుదుగా ‘అయిన ఆయన నుండి’ అనే రూపంలో అనువదించడం.
  alternative: ‘ఉన్నవాని నుండి, ఉండినవాని నుండి, రాబోవువాని నుండి’ లేదా సంప్రదాయంగా ‘రానున్నవాడు’ అని అనువదించడం.
  rationale: మూలంలోని గంభీరమైన బిరుదు స్వభావాన్ని కాపాడుతూ, గ్రీకు వ్యాకరణంలోని అసాధారణతను తెలుగులో అర్థరహితంగా అనుకరించకుండా వ్యక్తపరుస్తుంది. ‘వస్తున్నవాడు’ వర్తమాన కృదంత భావాన్ని నిలుపుతుంది.
- issue: ‘ఏడు ఆత్మలు’ ఎవరిని సూచిస్తాయి
  choice: ప్రధాన పాఠంలో ‘ఏడు ఆత్మలు’ అనే బహువచనాన్నే నిలుపడం.
  alternative: పరిశుద్ధాత్మ సంపూర్ణతకు ప్రతీకగా భావించడం లేదా దేవుని సింహాసనం ఎదుట ఉన్న ఏడు పరలోక ఆత్మలుగా భావించడం.
  rationale: గ్రీకు పాఠం స్వయంగా ‘ఏడు ఆత్మలు’ అని చెబుతుంది. వివాదాస్పదమైన గుర్తింపును ప్రధాన పాఠంలోనే తీర్మానించకుండా, రెండు ప్రధాన అవగాహనలను పాదసూచికలో ఉంచడం మూలంలోని వేదాంతపరమైన ఉద్విగ్నతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన పత్రికా-ఆశీర్వాద శైలిని ఉపయోగించాం. ‘రాస్తున్నది’ అనే సహజ తెలుగు సంధానాన్ని శీర్షికాత్మక ప్రారంభం స్పష్టంగా ఉండేందుకు చేర్చాం; అది కొత్త విషయాన్ని జోడించదు. ‘కృప, సమాధానం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని పురాతన బహువచన/గ్రాంథిక రూపాలు లేకుండా ఉంచాం.
