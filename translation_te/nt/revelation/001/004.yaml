  to: 'ఆసియాలోని ఏడు సంఘాలకు యోహాను నుండి: ఉన్నవాడూ, ఉండినవాడూ, వస్తున్నవాడూ అయిన ఆయన నుండి, అలాగే ఆయన సింహాసనం ఎదుట ఉన్న ఏడు ఆత్మల నుండి మీకు కృప, సమాధానం కలుగుగాక.'
