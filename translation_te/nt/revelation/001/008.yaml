id: REV.1.8
reference: Revelation 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: te
  text: “నేనే ఆల్ఫాను, ఓమెగాను—ఉన్నవాడిని, గతంలో ఉన్నవాడిని, వస్తున్నవాడిని[a], సర్వశక్తిమంతుడిని” అని ప్రభువైన దేవుడు అంటున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాబోవువాడిని.”
    reason: ἐρχόμενος అనే పదాన్ని వర్తమాన గమనంగా ‘వస్తున్నవాడు’ అని లేదా భవిష్య రాకగా ‘రాబోవువాడు’ అని సహజంగా అనువదించవచ్చు.
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: నేనే
  rationale: గ్రీకు వాక్యంలోని బలమైన ప్రథమ పురుష సూచనను సహజమైన ఆధునిక తెలుగులో ‘నేనే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: ఆల్ఫాను, ఓమెగాను
  rationale: గ్రీకు అక్షరాల పేర్లను అలాగే ఉంచడం వల్ల వాటి ప్రతీకాత్మక భావం నిలుస్తుంది; తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా విభక్తి ప్రత్యయాలు జోడించబడ్డాయి.
- source_word: λέγει
  choice: అంటున్నాడు
  rationale: వర్తమాన కాలంలోని ఉక్తి సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘ప్రకటిస్తున్నాడు’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: κύριος, ὁ θεός
  choice: ప్రభువైన దేవుడు
  rationale: రెండు దైవ బిరుదుల అనుబంధాన్ని సహజంగా చూపుతూ ‘ప్రభువైన దేవుడు’ అని అనువదించబడింది.
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: ఉన్నవాడిని, ఉండినవాడిని, వస్తున్నవాడిని
  rationale: మూడు భాగాల సమాంతర నిర్మాణాన్ని నిలుపుతూ, ἐρχόμενος అనే వర్తమాన కృదంతాన్ని ‘వస్తున్నవాడు’ అని ప్రత్యక్షంగా ప్రతిబింబిస్తుంది.
- source_word: ὁ παντοκράτωρ
  choice: సర్వశక్తిమంతుడిని
  rationale: దేవుని సమస్తాధికారాన్ని సూచించే స్థిరమైన, సహజమైన తెలుగు బైబిలు పదప్రయోగం.
theological_decisions:
- issue: దేవుని నిత్య ఉనికి మరియు రాకను తెలిపే స్వీయ నిర్దేశన
  choice: ఉన్నవాడిని, ఉండినవాడిని, వస్తున్నవాడిని
  alternative: ఉన్నవాడిని, ఉండినవాడిని, రాబోవువాడిని
  rationale: ἐρχόμενος వర్తమాన కృదంతం కాబట్టి ‘వస్తున్నవాడు’ దాని కొనసాగుతున్న, క్రియాశీల భావాన్ని నేరుగా నిలుపుతుంది. ‘రాబోవువాడు’ కూడా సాధ్యమైన సంప్రదాయ భావానువాదం కావడంతో పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే దర్శన గ్రంథంలోని గంభీరమైన దైవ స్వీయ ప్రకటనకు తగిన శైలిలో ఉంది. ఉక్తి సూచక భాగాన్ని వాక్యాంతానికి ఉంచడం ద్వారా తెలుగులో సహజ ప్రవాహం సాధించబడింది.
