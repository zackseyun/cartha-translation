revisions:
- from: ఇదిగో, ఆయన మేఘాలతో వస్తున్నాడు. ప్రతి కన్నూ ఆయనను చూస్తుంది—ఆయనను పొడిచినవారు కూడా చూస్తారు. భూమిలోని వంశాలన్నీ[a] ఆయనను బట్టి విలపిస్తాయి. అవును, ఆమేన్.
  to: ఇదిగో, ఆయన మేఘాలతో వస్తున్నాడు. ప్రతి కన్నూ ఆయనను చూస్తుంది—ఆయనను పొడిచినవారు కూడా చూస్తారు. భూమిలోని వంశాలన్నీ[a] ఆయన విషయమై విలపిస్తాయి. అవును, ఆమేన్.
  rationale: Only the rendering of ἐπ’ αὐτόν has been adjusted. The revision improves modern Telugu idiom and more faithfully preserves the Greek mourning relation without deciding whether the lament is strictly causal, directed toward him, or concerning him. The text and footnote anchor otherwise remain intact.
  reviewer_model: gpt-5.6-terra
