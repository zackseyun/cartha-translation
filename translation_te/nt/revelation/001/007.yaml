review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the summons, vivid present "is coming," cloud imagery, universal "every eye," the specific group who pierced him, the mourning of all tribes, and the double affirmation. The primary concern is the rendering of ἐπ’ αὐτόν: “ఆయనను బట్టి” can sound like “according to him” or predominantly causal in Telugu, whereas the Greek mourning construction more directly permits mourning concerning/over him.'
  naturalness: The Telugu is generally clear, modern, and appropriately solemn. “ఆయన విషయమై విలపిస్తాయి” is more idiomatic and semantically suitable than “ఆయనను బట్టి విలపిస్తాయి,” while retaining the source expression’s breadth.
  terminology: “ఇదిగో,” “మేఘాలతో,” “ప్రతి కన్నూ,” “పొడిచినవారు,” “వంశాలన్నీ,” and “ఆమేన్” are suitable. “వంశాలు” is an acceptable modern rendering of φυλαί in this context. The footnote correctly preserves the viable land/earth ambiguity and its Zechariah resonance.
  issues:
  - severity: medium
    issue: The phrase “ఆయనను బట్టి విలపిస్తాయి” is not the clearest Telugu representation of ἐπ’ αὐτόν in a mourning context.
    rationale: In modern Telugu, “Xను బట్టి” often means “according to X” or “because of X.” It can therefore overemphasize causation and sound less natural. “ఆయన విషయమై విలపిస్తాయి” naturally expresses mourning concerning/over him without forcing a more specific interpretation.
  revised_text: ఇదిగో, ఆయన మేఘాలతో వస్తున్నాడు. ప్రతి కన్నూ ఆయనను చూస్తుంది—ఆయనను పొడిచినవారు కూడా చూస్తారు. భూమిలోని వంశాలన్నీ[a] ఆయన విషయమై విలపిస్తాయి. అవును, ఆమేన్.
