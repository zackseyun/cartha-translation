id: REV.1.7
reference: Revelation 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: te
  text: ఇదిగో, ఆయన మేఘాలతో వస్తున్నాడు. ప్రతి కన్నూ ఆయనను చూస్తుంది—ఆయనను పొడిచినవారు కూడా చూస్తారు. భూమిలోని వంశాలన్నీ[a] ఆయన విషయమై విలపిస్తాయి. అవును, ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశంలోని వంశాలన్నీ.’ ఈ మాటలు జెకర్యా 12:10-12ను తలపించవచ్చు; అక్కడ ‘దేశం’ అనే అర్థం సందర్భానికి సరిపోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: దృష్టిని సజీవంగా ఆకర్షించే ఆహ్వానాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔρχεται
  choice: వస్తున్నాడు
  rationale: గ్రీకు వర్తమాన కాలంలోని సజీవమైన, సమీప భవిష్యత్ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μετὰ τῶν νεφελῶν
  choice: మేఘాలతో
  rationale: దానియేలు 7:13ను తలపించే మేఘాల దృశ్యాన్ని సంక్షిప్తంగా, నేరుగా నిలుపుతుంది.
- source_word: ὄψεται
  choice: చూస్తుంది
  rationale: భవిష్యత్ అర్థాన్ని సహజమైన తెలుగు క్రియారూపంలో అందిస్తుంది.
- source_word: πᾶς ὀφθαλμὸς
  choice: ప్రతి కన్నూ
  rationale: ‘ప్రతి ఒక్కరూ’ అని సారాంశీకరించకుండా గ్రీకులోని స్పష్టమైన ఏకవచన పంపిణీ రూపకాన్ని నిలుపుతుంది.
- source_word: οἵτινες αὐτὸν ἐξεκέντησαν
  choice: ఆయనను పొడిచినవారు
  rationale: జెకర్యా 12:10, యోహాను 19:37లతో ఉన్న పదబంధ సంబంధాన్ని ‘పొడిచిన’ అనే పదం కాపాడుతుంది.
- source_word: κόψονται
  choice: విలపిస్తాయి
  rationale: శోకంతో చేసే విలాపాన్ని తెలియజేస్తుంది; నిర్దిష్టమైన శారీరక చర్యను అనవసరంగా చేర్చదు.
- source_word: ἐπ’ αὐτὸν
  choice: ఆయనను బట్టి
  rationale: ఈ సందర్భంలో ఆయన కారణంగా లేదా ఆయన విషయమై కలిగే విలాపం అనే అర్థాన్ని సహజంగా ఇస్తుంది; ‘ఆయన కోసం’ అని భావాన్ని ఏకపక్షంగా నిర్ణయించదు.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: భూమిలోని వంశాలన్నీ
  rationale: φυλαί యొక్క ‘వంశాలు/గోత్రాలు’ భావాన్ని, γῆ యొక్క విశ్వవ్యాప్త ‘భూమి’ భావాన్ని నిలుపుతుంది; ‘దేశంలోని’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: ναί, ἀμήν
  choice: అవును, ఆమేన్
  rationale: గ్రీకులోని ద్విగుణ ధృవీకరణను, ఆరాధనా ప్రాధాన్యాన్ని యథాతథంగా కాపాడుతుంది.
theological_decisions:
- issue: πᾶσαι αἱ φυλαὶ τῆς γῆς లో τῆς γῆς యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘భూమిలోని వంశాలన్నీ’
  alternative: ‘దేశంలోని వంశాలన్నీ’
  rationale: ‘ప్రతి కన్నూ’ అనే విశ్వవ్యాప్త సందర్భం ‘భూమి’ అర్థానికి మద్దతిస్తుంది. అయితే జెకర్యా 12:10-12 ప్రతిధ్వని కారణంగా ‘దేశం’ కూడా సాధ్యమే; అందువల్ల ఆ సందిగ్ధతను పాదటిప్పణిలో కాపాడాం.
- issue: ἐπ’ αὐτὸν వల్ల విలాపానికి ఉన్న సంబంధం
  choice: ‘ఆయనను బట్టి’
  alternative: ‘ఆయన కోసం’ లేదా ‘ఆయన విషయమై’
  rationale: గ్రీకు పదబంధం కారణం, సందర్భం, లేదా శోకానికి గురైన వ్యక్తి అనే భావాలను అనుమతిస్తుంది. ‘ఆయనను బట్టి’ ఈ ఉద్రిక్తతను పూర్తిగా ఒకే దిశలో పరిష్కరించకుండా సహజమైన తెలుగులో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రకటన గ్రంథపు గంభీరమైన ప్రవచన స్వరాన్ని నిలుపుతూ అనువదించబడింది. ప్రతి కన్నూ అనే మూర్తమైన రూపకం, మేఘాల దానియేలు ప్రతిధ్వని, పొడిచినవారు అనే జెకర్యా/యోహాను సంబంధం కాపాడబడ్డాయి.
