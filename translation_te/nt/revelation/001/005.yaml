id: REV.1.5
reference: Revelation 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: te
  text: మరియు నమ్మకమైన సాక్షియు, మృతులలో ప్రథమజన్ముడును, భూమి రాజులకు అధిపతియు అయిన యేసు మెస్సీయ[a] నుండి. మనలను ప్రేమిస్తూ, తన రక్తం ద్వారా మన పాపాలనుండి మనలను విడుదల చేసిన[b] ఆయనకు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు క్రీస్తు.” గ్రీకు పదం మెస్సీయ అనే బిరుదును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో “తన రక్తం ద్వారా మన పాపాలనుండి మనలను విడుదల చేసిన” బదులుగా, “తన రక్తంలో మన పాపాలనుండి మనలను కడిగిన” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; అందువల్ల కేవలం లిప్యంతరీకరించిన ‘క్రీస్తు’కు బదులు దాని బిరుదు భావాన్ని తెలిపే ‘మెస్సీయ’ను వాడాం.
- source_word: ὁ μάρτυς ὁ πιστός
  choice: నమ్మకమైన సాక్షి
  rationale: μάρτυς ఇక్కడ సాక్ష్యమిచ్చేవాడనే భావం; తప్పనిసరిగా ప్రాణత్యాగి అనే భావం కాదు. πιστός విశ్వసనీయత, స్థిరనిష్ఠ రెండింటినీ సూచిస్తుంది.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: మృతులలో ప్రథమజన్ముడు
  rationale: πρωτότοκος అనే బైబిలీయ రూపకాన్ని నిలుపుతూ, మృతుల మధ్యనుంచి జీవానికి వచ్చినవాడూ వారిపై ప్రాధాన్యం కలవాడూ అనే భావాలను అతిగా వివరణ చేయకుండా ఉంచుతుంది.
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: భూరాజులకు అధిపతి
  rationale: ἄρχων యొక్క అధికార భావాన్ని ‘అధిపతి’ సహజంగా తెలియజేస్తుంది; γῆకి ప్రకటన గ్రంథంలోని విశ్వవ్యాప్త సందర్భంలో ‘భూ-’ సరిపోతుంది.
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: మనలను ప్రేమిస్తున్నవాడూ ... అయిన ఆయనకు
  rationale: వర్తమాన కృదంతం తెలియజేసే కొనసాగుతున్న ప్రేమను ‘ప్రేమిస్తున్న’తో వ్యక్తం చేశాం.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: మన పాపాల నుంచి మనలను విడుదల చేసినవాడూ
  rationale: λύω యొక్క విప్పడం లేదా విడుదల చేయడం అనే భావాన్ని ‘విడుదల చేసిన’ స్పష్టంగా నిలుపుతుంది; ἐκ వేరుచేయడాన్ని ‘నుంచి’ తెలియజేస్తుంది.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: తన రక్తం ద్వారా
  rationale: ఇక్కడ ἐν సాధనార్థకంగా ఉంది; ‘ద్వారా’ ఆయన రక్తమే విడుదలకు సాధనమని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: λύσαντι / λούσαντι పాఠభేదం
  choice: λύσαντι — ‘విడుదల చేసిన’
  alternative: λούσαντι — ‘కడిగిన’
  rationale: ఇచ్చిన SBLGNT మూలపాఠంలో λύσαντι ఉంది. ప్రసిద్ధమైన, భావపరంగా ముఖ్యమైన λούσαντι పాఠభేదాన్ని ప్రధాన పాఠంలో కలపకుండా పాదసూచికలో నిలిపాం.
- issue: Χριστός అనే క్రీస్తుసంబంధ బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός పేరులోని స్థిరభాగంలా కాక బిరుదుగా ఉంది; అందువల్ల బిరుదు భావాన్ని స్పష్టంగా చూపే ‘మెస్సీయ’ను ప్రధాన పాఠంలో ఉంచి సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: మూల వాక్యం 1:4 నుంచి కొనసాగడం
  choice: ‘కృప, శాంతి మీకు కలుగుగాక’ను భావపూరణ కోసం చేర్చడం
  alternative: ‘మరియు ... యేసు మెస్సీయ నుంచి’ అనే అసంపూర్ణ ఖండవాక్యంగా ఉంచడం
  rationale: 1:5లోని καὶ ἀπό అనేది 1:4లో ప్రారంభమైన శుభవందన వాక్యాన్ని కొనసాగిస్తుంది. విడిగా ప్రచురించే వచనం తెలుగులో అర్థవంతంగా ఉండేందుకు ముందున్న ఆశీర్వాద విధేయాన్ని పునరుద్ధరించాం; కొత్త సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడాం. ఈ వచనం 1:4లో మొదలైన వాక్యాన్ని కొనసాగిస్తున్నందున ‘కృప, శాంతి మీకు కలుగుగాక’ను పునరుద్ధరించాం. చివరి దీర్ఘవిరామం తరువాతి వచనంలో స్తోత్రవాక్యం కొనసాగుతుందని సూచిస్తుంది.
