revisions:
- from: మరియు నమ్మకమైన సాక్షి, మృతులలో ప్రథమజన్ముడు, భూరాజులకు అధిపతి అయిన యేసు మెస్సీయ[a] నుంచి కృప, శాంతి మీకు కలుగుగాక. మనలను ప్రేమిస్తున్నవాడూ, తన రక్తం ద్వారా మన పాపాల నుంచి మనలను విడుదల చేసినవాడూ[b] అయిన ఆయనకు—
  to: మరియు నమ్మకమైన సాక్షియు, మృతులలో ప్రథమజన్ముడును, భూమి రాజులకు అధిపతియు అయిన యేసు మెస్సీయ[a] నుండి. మనలను ప్రేమిస్తూ, తన రక్తం ద్వారా మన పాపాలనుండి మనలను విడుదల చేసిన[b] ఆయనకు—
