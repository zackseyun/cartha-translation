id: REV.1.10
reference: Revelation 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: te
  text: ప్రభువు దినాన[a] నేను ఆత్మలో[b] ఉన్నాను; నా వెనుక బూరలాంటి బిగ్గర స్వరాన్ని విన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, తక్కువ సంభావ్యతతో, ‘ప్రభువు రాక దినాన.’ ఇక్కడి గ్రీకు పదబంధం ‘ప్రభువుకు చెందిన దినం’ అనే అర్థమిస్తుంది; అంత్యకాల ‘ప్రభువు దినం’ కోసం సాధారణంగా వాడే గ్రీకు పదబంధం ఇది కాదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఆత్మిక స్థితిలో.’ ఈ పదబంధం పరిశుద్ధాత్మ ప్రవచన ప్రభావంలో ఉండడాన్ని సూచించవచ్చు; అయితే ‘మైమరపులో’ ఉన్నాడని మూలపాఠం స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: ఉన్నాను
  rationale: γίνομαι ఇక్కడ ఒక స్థితిలో ఉండడాన్ని లేదా ఆ స్థితిలోకి రావడాన్ని సూచించగలదు. తెలుగు సహజత్వం కోసం ‘ఉన్నాను’ అని అనువదించాం; ‘మైమరపులోకి వెళ్లాను’ వంటి మూలంలో లేని భావాన్ని చేర్చలేదు.
- source_word: ἐν πνεύματι
  choice: ఆత్మలో
  rationale: ప్రకటన గ్రంథంలోని దర్శన సంబంధ సందర్భంలో ఇది పరిశుద్ధాత్మ ప్రభావాన్ని సూచించే అవకాశం ఉంది. అయినా గ్రీకు పదబంధం ‘మైమరపులో’ అని స్పష్టంగా చెప్పదు కాబట్టి దాని సంక్షిప్తతను, సందిగ్ధతను నిలిపాం.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: ప్రభువు దినాన
  rationale: κυριακός అంటే ‘ప్రభువుకు చెందిన’ అని అర్థం. అంత్యకాల ‘ప్రభువు దినం’ కోసం సాధారణంగా వాడే గ్రీకు నిర్మాణం ఇక్కడ లేదు; అందువల్ల స్వామ్యార్థాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: ἤκουσα
  choice: విన్నాను
  rationale: ఇక్కడ ἀκούω శబ్దాన్ని గ్రహించడాన్ని సూటిగా తెలియజేస్తుంది; శ్రద్ధగా ఆలకించాననే అదనపు భావం లేదు.
- source_word: ὀπίσω μου
  choice: నా వెనుక
  rationale: సందర్భంలో ఇది కాలక్రమాన్ని కాక స్థలాన్ని సూచిస్తుంది.
- source_word: φωνὴν μεγάλην
  choice: బిగ్గర స్వరం
  rationale: φωνήతో μέγας కలిసినప్పుడు స్వరం గొప్పదని కాక దాని శబ్ద తీవ్రతను సూచిస్తుంది. ‘బిగ్గర స్వరం’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ὡς σάλπιγγος
  choice: బూరలాంటి
  rationale: స్వరాన్ని బూరతో పోల్చుతోంది. ‘బూర మోతలాంటి’ అని విస్తరించకుండా గ్రీకు ఉపమానపు సంక్షిప్తతను నిలిపాం.
theological_decisions:
- issue: ἐν πνεύματι అనేది పరిశుద్ధాత్మ ప్రభావాన్నా, వ్యక్తి ఆత్మస్థితినో, లేక మైమరపు స్థితినో సూచిస్తుందా
  choice: ఆత్మలో
  alternative: ఆత్మ ప్రభావంలో; మైమరపులో
  rationale: దర్శన సందర్భం పరిశుద్ధాత్మ సంబంధ ప్రవచన ప్రేరణను సూచించవచ్చు; అయితే మూలపాఠం ‘మైమరపు’ అని స్పష్టంగా చెప్పదు. అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా ‘ఆత్మలో’ అని ఉంచాం.
- issue: κυριακῇ ἡμέρᾳ వారంలోని ప్రభువుకు చెందిన దినాన్నా లేక అంత్యకాల ప్రభువు దినాన్నా సూచిస్తుంది
  choice: ప్రభువు దినాన
  alternative: ప్రభువు రానున్న దినాన; ప్రభువు యొక్క దినాన
  rationale: κυριακός అనే విశేషణం ‘ప్రభువుకు చెందిన’ అనే అర్థాన్ని ఇస్తుంది; అంత్యకాల ‘ప్రభువు దినం’ అనే సాధారణ గ్రీకు పదబంధం ఇక్కడ లేదు. ఈ అనువాదం దినాన్ని మరింత నిర్దిష్టంగా గుర్తించకుండా మూలంలోని రూపాన్ని అనుసరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే వాక్య నిర్మాణం వాడాం. ‘దినమున,’ ‘వెనుకనుండి,’ ‘బూరధ్వనివలె’ వంటి పాత శైలికి బదులు ‘దినాన,’ ‘నా వెనుక,’ ‘బూరలాంటి’ అనే ప్రస్తుత రూపాలను ఎంచుకున్నాం. ‘ఆత్మ’కు పెద్ద అక్షర భేదం తెలుగులో కనిపించనందున, దాని సూచనలోని సందిగ్ధతను పాదసూచికలో వివరించాం.
