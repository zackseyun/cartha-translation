revisions:
- from: మీ సహోదరుడనైన యోహాను అనే నేను, యేసులో శ్రమలోను రాజ్యంలోను సహనంలోను మీతో కలిసి పాలుపంచుకునేవాణ్ణి. దేవుని వాక్యం కారణంగాను యేసు సాక్ష్యం[a] కారణంగాను పత్మాసు అనే ద్వీపంలో ఉన్నాను.
  to: మీ సహోదరుడను, యేసులో శ్రమలోను రాజ్యంలోను సహనంలోను మీతో సహభాగినైన యోహాను నేను, దేవుని వాక్యం మరియు యేసు సాక్ష్యం[a] కారణంగా పత్మొసు అని పిలువబడే ద్వీపంలో ఉన్నాను.
  rationale: The revision replaces an awkward habitual verb with the nominal ‘సహభాగినైన,’ which more closely represents συγκοινωνός and retains John’s solidarity with the audience. It streamlines the coordinated causal phrase while preserving its ambiguity regarding the precise circumstances. The footnote continues to preserve the disputed subjective/objective sense of Ἰησοῦ.
