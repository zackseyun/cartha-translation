id: REV.1.9
reference: Revelation 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: te
  text: మీ సహోదరుడను, యేసులో శ్రమలోను రాజ్యంలోను సహనంలోను మీతో సహభాగినైన యోహాను నేను, దేవుని వాక్యం మరియు యేసు సాక్ష్యం[a] కారణంగా పత్మొసు అని పిలువబడే ద్వీపంలో ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసును గూర్చిన సాక్ష్యం.’ గ్రీకు పదబంధం యేసు ఇచ్చిన సాక్ష్యాన్నిగానీ, యేసును గూర్చిన సాక్ష్యాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: మీతో కలిసి పాలుపంచుకునేవాణ్ణి
  rationale: ఈ పదం ఇతరులతో కలిసి ఒకే అనుభవంలో లేదా వాస్తవంలో భాగం పంచుకోవడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం సహభాగితను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: శ్రమలోను రాజ్యంలోను సహనంలోను
  rationale: మూడు నామవాచకాల సమన్వయాన్ని, వాటన్నిటిలో యోహాను పాఠకులతో పాలుపంచుకుంటున్న భావాన్ని నిలుపుతుంది. θλῖψις‌కు ఇక్కడ ‘శ్రమ’ అపోకలిప్టిక్ సందర్భంలోని బాధా-పీడన భావాన్ని మోస్తుంది; ὑπομονήకు ‘సహనం’ స్థిరంగా నిలిచే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἐν Ἰησοῦ
  choice: యేసులో
  rationale: ఈ సంక్షిప్త సంబంధప్రయోగాన్ని విస్తరించి వ్యాఖ్యానించకుండా అలాగే నిలుపుతుంది; ఇది ముందున్న శ్రమ, రాజ్యం, సహనం అనే మూడింటినీ యేసుతో సంబంధంలో ఉంచుతుంది.
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: ద్వీపంలో ఉన్నాను
  rationale: ఇక్కడ γίνομαι ఒక ప్రదేశంలో ఉండడాన్ని సందర్భానుసారంగా సూచిస్తుంది. అక్కడికి ఎలా చేరాడనే వివరాన్ని మూలపాఠం చెప్పనందున దాన్ని చేర్చదు.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: పత్మాసు అనే
  rationale: ద్వీపం పేరును తెలిపే καλουμένῃకు ఆధునిక తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యం కారణంగా
  rationale: Accusative‌తో వచ్చిన διά కారణాన్ని సూచిస్తుంది. ప్రకటన, నిబద్ధత లేదా హింస—వీటిలో ఏదో ఒకదానిగా ప్రత్యేకంగా నిర్ణయించకుండా కారణ సంబంధాన్ని మాత్రమే తెలుపుతుంది.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: యేసు సాక్ష్యం
  rationale: Ἰησοῦ అనే genitive యేసు ఇచ్చిన సాక్ష్యాన్నో యేసును గూర్చిన సాక్ష్యాన్నో సూచించవచ్చు. ‘యేసు సాక్ష్యం’ ప్రధాన పాఠంలో సంక్షిప్తతను, సాధ్యమైనంతవరకు ఆ ద్వంద్వార్థాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ భావం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἀδελφὸς ὑμῶν
  choice: మీ సహోదరుడనైన
  rationale: యోహాను తన పాఠకులతో ఉన్న కుటుంబసదృశ ఐక్యతను నేరుగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: μαρτυρίαν Ἰησοῦలోని genitive యొక్క ద్వంద్వార్థం
  choice: ప్రధాన పాఠంలో ‘యేసు సాక్ష్యం’
  alternative: ‘యేసును గూర్చిన సాక్ష్యం’ లేదా ‘యేసు ఇచ్చిన సాక్ష్యం’
  rationale: గ్రీకు నిర్మాణం subjective genitive లేదా objective genitive రెండింటినీ అనుమతిస్తుంది. వివాదాస్పదమైన భావాన్ని అనువాదంలో ఏకపక్షంగా నిర్ణయించకుండా ప్రధాన పాఠంలో సంక్షిప్త నిర్మాణాన్ని ఉంచి, పాదసూచికలో రెండు అవకాశాలను స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రకటన గ్రంథానికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని సమన్వయ క్రమం, ‘యేసులో’ అనే సంక్షిప్త ధార్మిక ప్రయోగం, సాక్ష్యానికి సంబంధించిన నిజమైన ద్వంద్వార్థం నిలుపబడ్డాయి.
