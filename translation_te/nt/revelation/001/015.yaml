id: REV.1.15
reference: Revelation 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ, ὡς ἐν καμίνῳ ⸀πεπυρωμένης, καὶ ἡ φωνὴ αὐτοῦ ὡς φωνὴ ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: te
  text: ఆయన పాదాలు కొలిమిలో కాల్చినట్లున్న మెరిసే కంచువలె ఉన్నాయి; ఆయన స్వరం అనేక జలాల ధ్వనిలా ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόδες
  choice: పాదాలు
  rationale: πούς అనే పదానికి ప్రత్యక్షమైన సాధారణ అర్థం ‘పాదం’; దర్శనంలోని శరీర వర్ణనను సహజంగా నిలుపుతుంది.
- source_word: ὅμοιοι
  choice: లా ఉన్నాయి
  rationale: ὅμοιος తెలిపే పోలికను ఆధునిక తెలుగులో సహజమైన ఉపమాన నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: χαλκολιβάνῳ
  choice: మెరిసే కంచు
  rationale: ఇది ఖచ్చితమైన లోహాన్ని గుర్తించడం కష్టమైన అరుదైన పదం. ప్రకాశవంతమైన, శుద్ధిచేసిన కంచు లేదా మిశ్రలోహ భావాన్ని ‘మెరిసే కంచు’ అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: కొలిమిలో కాల్చి శుద్ధిచేసినట్లు
  rationale: κάμινος కొలిమిని సూచిస్తుంది; πυρόομαι నిప్పుతో వేడిచేయడం, మండించడం లేదా శుద్ధిచేయడం అనే భావాలను కలిగి ఉంటుంది. లోహశుద్ధి దృశ్యాన్ని చదవడానికి సహజంగా వ్యక్తం చేస్తూనే ὡς యొక్క పోలికను ‘తెలి’ ద్వారా నిలుపుతుంది.
- source_word: φωνή
  choice: స్వరం
  rationale: మొదటి ప్రయోగం ఆయనకు చెందిన వ్యక్తిగత స్వరాన్ని సూచిస్తున్నందున ‘స్వరం’ సరైన ఎంపిక.
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: అనేక జలాల ధ్వనిలా
  rationale: రెండవ φωνήని ‘ధ్వని’గా అనువదించడం వినికిడి పోలికను సహజ తెలుగులో అందిస్తుంది. ‘అనేక జలాలు’ అనే బైబిలు దృశ్యాన్ని సముద్రపు అలలు వంటి ఒక నిర్దిష్ట ప్రకృతి దృశ్యానికి పరిమితం చేయదు.
theological_decisions:
- issue: చివరి ఉపమానంలో పునరావృతమైన φωνή అనువాదం
  choice: ఆయన స్వరం అనేక జలాల ధ్వనిలా ఉంది
  alternative: ఆయన స్వరం అనేక జలాల స్వరంలా ఉంది
  rationale: ‘ధ్వని’ ఆధునిక తెలుగులో పోలికను స్పష్టంగా చేస్తుంది; అయితే మూలంలోని φωνή పునరావృతాన్ని, దాని వ్యక్తీకరణాత్మక బలాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో నిలుపుతుంది.
- issue: χαλκολίβανον సూచించే లోహపు స్వరూపం
  choice: మెరిసే కంచు
  alternative: మెరుగుపెట్టిన కంచు; శుద్ధమైన ఇత్తడి; ప్రకాశించే మిశ్రలోహం
  rationale: పదం అరుదైనది, దాని ఖచ్చితమైన లోహశాస్త్రీయ సూచన అనిశ్చితం. దర్శనంలోని ప్రకాశాన్ని నిలుపుతూ నిర్దిష్ట మిశ్రలోహాన్ని సిద్ధాంతపరంగా లేదా భాషాపరంగా బలవంతంగా నిర్ణయించకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దర్శనశైలిని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. ‘అనేక జలాలు’ అనే సాంప్రదాయ బైబిలు ప్రతీకను పరిరక్షించాం; అరుదైన లోహపదంలోని నిజమైన అనిశ్చితిని పాదసూచికలో స్పష్టంచేశాం.
