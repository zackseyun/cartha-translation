  terminology: ‘ధన్యులు,’ ‘ప్రవచనం,’ ‘పాటించేవారు,’ and ‘సమయం సమీపంలో ఉంది’ are suitable modern-standard Telugu choices. The wording does not impose an interpretive eschatological scheme.
