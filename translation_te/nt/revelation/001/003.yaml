id: REV.1.3
reference: Revelation 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: te
  text: ఈ ప్రవచనంలోని మాటలను బిగ్గరగా చదివేవాడు[a], వాటిని విని, ఇందులో వ్రాయబడినవాటిని పాటించేవారు ధన్యులు; ఎందుకంటే ఆ సమయం సమీపంలో ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చదివేవాడు’; గ్రీకు పదం సాధారణంగా చదవడాన్ని సూచించగలదు, అయితే ఇక్కడ ఒకరు చదవడం, అనేకులు వినడం సభలో బిగ్గరగా చదివే సందర్భాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎందుకంటే నియమిత సమయం సమీపంలో ఉంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: ధన్యులు
  rationale: కొత్త నిబంధనలోని ధన్యతా ప్రకటనలకు తగిన ఆధ్యాత్మిక అనుగ్రహ భావాన్ని వ్యక్తం చేస్తుంది; కేవలం భావోద్వేగ సంతోషాన్ని సూచించదు. గ్రీకులో ఏకవచనం తరువాత బహువచన శ్రోతలతో కలిసినందున తెలుగులో సహజంగా సమూహాన్ని ఉద్దేశించిన బహువచన విధేయపదంగా వాడబడింది.
- source_word: ὁ ἀναγινώσκων
  choice: బిగ్గరగా చదివేవాడు
  rationale: ఏకవచన పాఠకుడు, బహువచన శ్రోతలు అనే నిర్మాణం సభలో బహిరంగంగా వినిపించే పఠనాన్ని సూచిస్తుంది. ‘బిగ్గరగా’ ఆ మౌఖిక సందర్భాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: οἱ ἀκούοντες
  choice: వాటిని విని
  rationale: బహిరంగ పఠనాన్ని వినే అనేకమందిని సూచిస్తుంది; తరువాతి ‘పాటించేవారు’తో సహజంగా అనుసంధానమవుతుంది.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: ఈ ప్రవచనంలోని మాటలను
  rationale: λόγους అనే బహువచనాన్ని సాధారణీకరించి ‘సందేశం’ అనకుండా ‘మాటలు’గా నిలుపుతుంది; సందర్భంలోని ఈ గ్రంథప్రవచనాన్ని ‘ఈ’ సూచిస్తుంది.
- source_word: τηροῦντες
  choice: పాటించేవారు
  rationale: వ్రాయబడినదాన్ని విధేయతతో కాపాడి ఆచరించడం అనే విస్తృత భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: ఇందులో వ్రాయబడినవాటిని
  rationale: గ్రీకు పరిపూర్ణ కర్మణి రూపంలోని ‘వ్రాయబడి ఉన్నవి’ అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘ఇందులో’ ప్రవచనాన్ని లేదా దానిని కలిగిన గ్రంథాన్ని సూచించే మూలంలోని సూచనను అలాగే ఉంచుతుంది.
- source_word: ὁ γὰρ καιρὸς
  choice: ఎందుకంటే ఆ సమయం
  rationale: γάρ యొక్క కారణ సంబంధాన్ని స్పష్టం చేస్తుంది. καιρόςలో నిర్ణీత లేదా కీలక సమయం అనే సాధ్యమైన భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘ఆ సమయం’గా ఉంచుతుంది.
- source_word: ἐγγύς
  choice: సమీపంలో ఉంది
  rationale: కాలపరమైన సమీపత్వాన్ని ఆధునిక, గౌరవప్రద తెలుగులో స్పష్టంగా తెలియజేస్తుంది; నెరవేర్పు కాలక్రమంపై ప్రత్యేక వ్యాఖ్యానాన్ని చొప్పించదు.
theological_decisions:
- issue: ఏకవచన పాఠకుడు, బహువచన శ్రోతలు సూచించే బహిరంగ పఠన సందర్భం
  choice: ‘బిగ్గరగా చదివేవాడు’ అని అనువదించడం
  alternative: ‘చదివేవాడు’ అని మాత్రమే అనువదించడం
  rationale: ఒక పాఠకుడిని అనేకమంది వినేవారితో జతచేసిన వాక్య నిర్మాణం సంఘంలో వినిపించే పఠనాన్ని బలంగా సూచిస్తుంది. అయినప్పటికీ మూలపదానికి సాధారణంగా ‘చదువు’ అనే అర్థం కూడా సాధ్యమని పాదసూచికలో నిలుపబడింది.
- issue: καιρός ἐγγύς యొక్క అంత్యకాల సంబంధిత బలం
  choice: ‘ఆ సమయం సమీపంలో ఉంది’ అని నేరుగా అనువదించడం
  alternative: ‘నియమిత సమయం సమీపంలో ఉంది’
  rationale: καιρός నిర్ణీత సమయాన్ని సూచించగలిగినా, మూలవాక్యం నెరవేర్పు విధానాన్ని లేదా కాలక్రమాన్ని వివరించదు. అందువల్ల సమీపత్వపు ఉద్వేగాన్ని నిలిపి, ఏ ప్రత్యేక అంత్యకాల పద్ధతినీ అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ఏకవచన పాఠకుడు–బహువచన శ్రోతల వ్యత్యాసాన్ని నిలుపుతూ, మొత్తం వర్గానికి వర్తించే ధన్యతను తెలుగులో సహజమైన ‘ధన్యులు’తో వ్యక్తం చేసింది. [a], [b] గుర్తులు ప్రధాన వచనంలో రెండూ ఉన్నాయి.
