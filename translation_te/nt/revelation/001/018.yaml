revisions:
- from: సజీవుడను నేనే. నేను మృతుడనయ్యాను; ఇదిగో, యుగయుగాల వరకు సజీవంగా ఉన్నాను[a]. మరణం యొక్క, పాతాళం యొక్క తాళంచెవులు నా దగ్గర ఉన్నాయి[b].
  to: నేనే సజీవుడిని—నేను మృతుడనయ్యాను; ఇదిగో, యుగయుగాల వరకు సజీవంగా ఉన్నాను[a]. మరణం మరియు పాతాళం యొక్క తాళంచెవులు నా దగ్గర ఉన్నాయి[b].
  rationale: 'The revision makes two limited idiomatic adjustments: it uses a natural modern predicative form for the Living One’s self-identification and smooths the coordinated genitives modifying ‘తాళంచెవులు.’ The death-to-life contrast, eternity formula, key imagery, and the distinct sense of ᾅδης are unchanged. Footnote anchors and content remain valid.'
