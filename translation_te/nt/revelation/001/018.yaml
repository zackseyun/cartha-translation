id: REV.1.18
reference: Revelation 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: te
  text: నేనే సజీవుడిని—నేను మృతుడనయ్యాను; ఇదిగో, యుగయుగాల వరకు సజీవంగా ఉన్నాను[a]. మరణం మరియు పాతాళం యొక్క తాళంచెవులు నా దగ్గర ఉన్నాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యుగాల యుగాల వరకు”; ఇది అంతంలేని కాలాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “పాతాళం” అంటే మృతుల లోకం; ఇది ప్రత్యేకంగా అంతిమ శిక్షాస్థలాన్ని సూచించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: సజీవుడను నేనే
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతంలోని బిరుదు భావాన్ని, ముందున్న ‘నేనే’ నిర్మాణంతో సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐγενόμην νεκρός
  choice: నేను మృతుడనయ్యాను
  rationale: సాధారణ స్థితిని మాత్రమే సూచించే ‘మృతుడిగా ఉన్నాను’ కంటే, γίνομαι వ్యక్తం చేసే మరణస్థితిలోకి మార్పును స్పష్టంగా కాపాడుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: ఆశ్చర్యం కలిగిస్తూ శ్రద్ధను ఆకర్షించే గ్రీకు అవ్యయపు సజీవమైన సూచనాబలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ζῶν εἰμι
  choice: సజీవంగా ఉన్నాను
  rationale: మరణించిన స్థితికి విరుద్ధంగా ఇప్పుడు కొనసాగుతున్న జీవస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాల వరకు
  rationale: ‘యుగాల యుగాల వరకు’ అనే గ్రీకు నుడికారంలోని అంతంలేని కాలవ్యాప్తిని తెలుగు బైబిలు శైలికి తగిన, అర్థమయ్యే రూపంలో అందిస్తుంది.
- source_word: κλεῖς
  choice: తాళంచెవులు
  rationale: భౌతిక రూపకాన్ని నేరుగా నిలుపుతూ, సందర్భంలో అధికారం మరియు నియంత్రణ భావాలను సూచిస్తుంది.
- source_word: τοῦ θανάτου
  choice: మరణం యొక్క
  rationale: ‘తాళంచెవులు’తో ఉన్న షష్ఠీ సంబంధాన్ని నేరుగా ఉంచుతుంది; అనవసరంగా మరణాన్ని వ్యక్తీకరించదు.
- source_word: τοῦ ᾅδου
  choice: పాతాళం యొక్క
  rationale: ᾅδης‌ను అంతిమ శిక్షాస్థలంతో సమానం చేయకుండా, మృతుల లోకాన్ని సూచించే స్థిరమైన తెలుగు పదాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో ᾅδης అనువాదం
  choice: పాతాళం
  alternative: మృతుల లోకం; సమాధి; నరకం
  rationale: ‘పాతాళం’ మరణంతో సంబంధమున్నప్పటికీ దానితో పూర్తిగా ఒకటే కాని మృతుల లోక భావాన్ని నిలుపుతుంది. ‘నరకం’ అన్నది అంతిమ శిక్ష భావాన్ని దిగుమతి చేయవచ్చు; ‘సమాధి’ అన్నది భౌతిక సమాధికే పరిమితం చేయవచ్చు. పాఠకుడికి ఉద్దేశించిన భావాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రకటన శైలిని పాటించాం. ‘సజీవుడను నేనే’ బిరుదు భావాన్నీ, ‘మృతుడనయ్యాను’ మరణస్థితిలోకి మార్పునీ కాపాడుతాయి. మూలంలోని దీర్ఘ సమన్వయ నిర్మాణాన్ని తెలుగు పఠనసౌలభ్యం కోసం చిన్న వాక్యాలుగా విభజించాం; భావసంబంధాన్ని మార్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
