  source_fidelity: 'ప్రధాన అనువాదం మూల గ్రీకు భావాన్ని సరిగ్గా ప్రతిబింబిస్తుంది: దర్శనంలో కనిపించేదాన్ని వ్రాసి ఏడు సంఘాలకు పంపమనే రెండు ఆజ్ఞలు, అలాగే పట్టణాల క్రమం, అన్నీ నిలిచాయి. అయితే βιβλίον‌కు ఇచ్చిన ప్రత్యామ్నాయ పాదసూచికలోని “గ్రంథపు చుట్ట” కంటే “చుట్టపత్రం” ఆధునిక తెలుగులో మరింత స్పష్టమైన, సహజమైన పదం.'
