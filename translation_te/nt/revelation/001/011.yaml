id: REV.1.11
reference: Revelation 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: te
  text: 'ఇలా చెబుతోంది: “నీవు చూస్తున్నదాన్ని ఒక పుస్తకంలో[a] రాసి, ఏడు సంఘాలకు పంపు—ఎఫెసుకు, స్ముర్నకు, పెర్గముకు[b], తుయతైరకు, సార్దీస్‌కు, ఫిలదెల్ఫియకు, లవొదికయకు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక చుట్టపత్రంలో”; గ్రీకు βιβλίον అనే పదం పుస్తకాన్ని, చుట్టపత్రాన్ని లేదా లిఖిత పత్రాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఈ పట్టణం పేరు కొన్ని పాత అనువాద సంప్రదాయాల్లో “పెర్గమోసు” అని కూడా ఉంది.
    reason: alternative_rendering
lexical_decisions:
- source_word: λεγούσης
  choice: ఇలా చెబుతోంది
  rationale: ఈ స్త్రీలింగ ఏకవచన వర్తమాన కృదంతం ముందరి వచనంలో పేర్కొన్న ‘స్వరం’తో వ్యాకరణపరంగా సంబంధించింది. తెలుగులో ఉల్లేఖనాన్ని సహజంగా పరిచయం చేస్తూ, ఈ వచనంలో లేని కర్తను కొత్తగా చేర్చకుండా ‘ఇలా చెబుతోంది’ అని అనువదించాం.
- source_word: Ὃ βλέπεις
  choice: నీవు చూస్తున్నదాన్ని
  rationale: వర్తమాన క్రియతో కూడిన నపుంసక సంబంధ సర్వనామం దర్శనంలో యోహాను చూస్తున్న సమస్తాన్ని సూచిస్తుంది. ‘చూస్తున్నదాన్ని’ అనే రూపం ఆ కొనసాగుతున్న దర్శన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: γράψον
  choice: రాసి
  rationale: ఇది γράφω క్రియ యొక్క ఏకవచన ఆజ్ఞారూపం. తరువాతి πέμψον ఆజ్ఞతో తెలుగులో సహజంగా అనుసంధానించడానికి ‘రాసి … పంపు’ అని ఇచ్చాం; ఆజ్ఞార్థం ‘పంపు’తో మొత్తం క్రియాక్రమానికి వర్తిస్తుంది.
- source_word: εἰς βιβλίον
  choice: ఒక పుస్తకంలో
  rationale: βιβλίον పుస్తకం, గ్రంథపు చుట్ట లేదా లిఖిత పత్రాన్ని సూచించగలదు. ఆధునిక పాఠకులకు స్పష్టమైన ‘పుస్తకం’ను ప్రధాన పాఠంలో ఉంచి, చారిత్రకంగా సాధ్యమైన ‘గ్రంథపు చుట్ట’ను పాదసూచికలో నిలిపాం.
- source_word: πέμψον
  choice: పంపు
  rationale: ఇది πέμπω క్రియ యొక్క ప్రత్యక్ష ఆజ్ఞారూపం. ఏమి పంపాలో ముందు చెప్పిన లిఖిత విషయంనుంచి స్పష్టమవుతుంది కాబట్టి తెలుగులో అదనపు సర్వనామం అవసరం లేదు.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: ఏడు సంఘాలకు
  rationale: ఇక్కడ ἐκκλησία ఆసియాలోని నిర్దిష్ట క్రైస్తవ సమాజాలను సూచిస్తుంది. ‘సంఘాలు’ అనే తెలుగు పదం మతశాఖాపరమైన ప్రత్యేక భావాన్ని చేర్చకుండా ఆ సమాజార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς Ἔφεσον … εἰς Λαοδίκειαν
  choice: ఎఫెసుకు, స్ముర్నకు, పెర్గముకు, తుయతైరకు, సార్దీస్‌కు, ఫిలదెల్ఫియకు, లవొదికయకు
  rationale: ప్రతి పట్టణానికి విడివిడిగా పునరావృతమైన εἰς యొక్క గమ్యార్థాన్ని ప్రతి పేరుకు ‘కు’ విభక్తి జోడించడం ద్వారా నిలిపాం. పట్టణాల పేర్లను తెలుగులో ప్రాచుర్యంలో ఉన్న, మూల గ్రీకు రూపాలకు సమీపమైన రూపాల్లో ఇచ్చాం.
theological_decisions:
- issue: ప్రకటన 1:11లో ἐκκλησίαις స్వభావం
  choice: సంఘాలకు
  alternative: సమాజాలకు / సమావేశాలకు
  rationale: ఈ పదం యోహాను ద్వారా సందేశం అందుకునే ఏడు నిర్దిష్ట క్రైస్తవ సమూహాలను సూచిస్తుంది. ‘సంఘాలు’ ఆ సమూహ స్వభావాన్ని తెలియజేస్తుంది; ఏ ప్రత్యేక సంఘపాలనా విధానాన్నీ లేదా మతశాఖ సిద్ధాంతాన్నీ ఇందులో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘నీవు’ ఆజ్ఞ యొక్క ఏకవచన సంబోధనను స్పష్టంగా ఉంచుతుంది. పట్టణాల వరుసలో మూలంలోని పంపిణీ భావాన్ని ప్రతి పేరుకు ‘కు’ విభక్తితో నిలిపాం; తెలుగులో అసహజంగా అనిపించే వరుస ‘మరియు’లను తప్పించాం.
