id: REV.1.6
reference: Revelation 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: te
  text: మనలను ఒక రాజ్యంగా[a], తన దేవునికీ తండ్రికీ యాజకులుగా చేశాడు—ఆయనకే మహిమ, ఆధిపత్యం యుగయుగాల వరకు[b] కలుగుగాక. ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని తరువాతి రాతప్రతుల్లో ‘ఒక రాజ్యంగా, యాజకులుగా’ అనే దానికి బదులు ‘రాజులుగాను యాజకులుగాను’ అని ఉంది. ప్రధాన పాఠం అందించిన గ్రీకు పాఠాన్ని అనుసరిస్తుంది.
    reason: textual_variant
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘యుగాల యుగాల వరకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: చేశాడు
  rationale: గ్రీకు భూతకాల క్రియను సందర్భానికి తగిన సహజమైన సాధారణ భూతకాలంతో అనువదించాం.
- source_word: βασιλείαν
  choice: ఒక రాజ్యంగా
  rationale: ఇది ఏకవచన నామవాచకం; ‘రాజులుగా’ అనే తరువాతి పాఠభేదాన్ని కాకుండా, సమాజమంతటినీ ఒక రాజ్యంగా చూపే మూలపాఠాన్ని అనుసరిస్తుంది.
- source_word: ἱερεῖς
  choice: యాజకులుగా
  rationale: ఒడంబడిక సంబంధమైన ఆరాధనా సేవ గుర్తింపును తెలిపే పదానికి సూటిగా, సాధారణంగా అర్థమయ్యే రూపం.
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: తన దేవునికీ తండ్రికీ
  rationale: దేవుని పట్ల యాజకులుగా ఏర్పరచబడిన భావాన్ని తెలుపుతూ, యేసుతో ఉన్న ‘దేవుడు మరియు తండ్రి’ అనే సంబంధ భాషను తగ్గించకుండా ఉంచుతుంది.
- source_word: αὐτῷ
  choice: ఆయనకే
  rationale: స్తోత్ర ప్రకటనలో దత్తివిభక్తి సూచించే సమర్పణను సహజమైన తెలుగు రూపంలో, ‘కే’ ద్వారా ఉద్ఘాటనతో వ్యక్తం చేస్తుంది.
- source_word: δόξα
  choice: మహిమ
  rationale: స్తోత్ర సందర్భాల్లో స్థిరంగా, సహజంగా వినిపించే తెలుగు సమానార్థకం.
- source_word: κράτος
  choice: ఆధిపత్యం
  rationale: కేవలం సాధారణ శక్తిని కాకుండా పాలించే సార్వభౌమ బలాన్ని సూచిస్తుంది.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: యుగయుగాల వరకు
  rationale: అంతంలేని కాలాన్ని తెలిపే గ్రీకు నుడికారానికి సహజమైన, గంభీరమైన తెలుగు సమానార్థకం.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: ఆరాధనా సమ్మతిని తెలిపే సంప్రదాయ తెలుగు లిప్యంతరీకరణను నిలుపుతుంది.
theological_decisions:
- issue: ‘తన దేవునికీ తండ్రికీ’ అనే మాటల సూచిత వ్యక్తి
  choice: సందర్భంలో ‘తన’ అనేది యేసును సూచిస్తుంది; దేవుడు యేసుకు దేవుడూ తండ్రీ అని ఉన్న సంబంధ భాషను యథాతథంగా ఉంచాం.
  alternative: ‘తండ్రియైన దేవునికి’ అని మార్చి సంబంధ భాషను సరళీకరించడం.
  rationale: సమీప సందర్భంలో కర్త యేసు క్రీస్తు. మూలపాఠంలోని క్రీస్తు సంబంధిత ఉద్రిక్తతను సిద్ధాంతపరంగా సవరించకుండా పారదర్శకంగా నిలుపుతుంది.
- issue: విశ్వాస సమాజపు స్థితి
  choice: ‘ఒక రాజ్యంగా, ... యాజకులుగా’ అనే మూలపాఠాన్ని అనుసరించాం.
  alternative: ‘రాజులుగాను యాజకులుగాను’ అనే తరువాతి పాఠభేదం.
  rationale: అందించిన SBLGNT పాఠంలో βασιλείαν (‘రాజ్యం’) ఉంది, ‘రాజులు’ లేదు; అందువల్ల సమాజపు సమిష్టి రాజ్య గుర్తింపును కాపాడాం.
- issue: స్తోత్ర వాక్యంలోని సూచిత క్రియ
  choice: ‘కలుగుగాక’ అని సహజ తెలుగు స్తోత్ర రూపాన్ని ఉపయోగించాం.
  alternative: క్రియ లేకుండా ‘ఆయనకే మహిమ, ఆధిపత్యం’ అని ఉంచడం.
  rationale: గ్రీకులో క్రియ ప్రత్యక్షంగా లేకున్నా, ఇది ఆశీర్వచనాత్మక స్తోత్ర ప్రకటన. తెలుగు వాక్యాన్ని సహజంగా పూర్తిచేయడానికి ‘కలుగుగాక’ సరిపోతుంది; భావానికి కొత్త సిద్ధాంతార్థం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆరాధనా శైలిని ఉంచాం. ‘రాజ్యం,’ ‘యాజకులు,’ ‘మహిమ,’ ‘ఆధిపత్యం’ వంటి మూలపాఠానికి కేంద్ర పదాలను నిలిపి, వాక్యప్రవాహం కోసం తెలుగు విభక్తులు మరియు ‘కలుగుగాక’ అనే సహజ స్తోత్ర రూపాన్ని వాడాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలతో సరిపోలుతున్నాయి.
