id: REV.1.13
reference: Revelation 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: te
  text: ఆ దీపస్తంభాల మధ్యలో మనుష్యుని కుమారుని పోలిన ఒకడు ఉన్నాడు. ఆయన పాదాల వరకు వచ్చే పొడవాటి వస్త్రాన్ని ధరించి, తన ఛాతీ చుట్టూ బంగారు పట్టీ కట్టుకొని ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν μέσῳ τῶν λυχνιῶν
  choice: ఆ దీపస్తంభాల మధ్యలో
  rationale: ἐν μέσῳ యొక్క స్థలార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది; λυχνία దీపాన్ని కాక దీపస్తంభాన్ని సూచిస్తుంది. నిర్దిష్టతను సందర్భానుసారంగా ‘ఆ’ ద్వారా తెలిపింది.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: మనుష్య కుమారుని వంటివాడు ఒకడు
  rationale: దానియేలు 7:13 ప్రతిధ్వనిని నిలుపుతూ, గ్రీకులో వ్యాసం లేకపోవడం వల్ల దీనిని ప్రధాన పాఠ్యంలో స్థిర బిరుదుగా అతిగా నిర్దిష్టం చేయదు.
- source_word: ἐνδεδυμένον ποδήρη
  choice: పాదాల వరకు ఉండే వస్త్రాన్ని ధరించి
  rationale: ποδήρης యొక్క ‘పాదాల వరకు చేరేది’ అనే అర్థాన్ని ప్రత్యేక సాంకేతిక పదం లేకుండా స్పష్టంగా తెలియజేస్తుంది; ἐνδεδυμένον సూచించే ధరించి ఉన్న స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: περιεζωσμένον πρὸς τοῖς μαστοῖς
  choice: ఛాతీ చుట్టూ ... పట్టీ కట్టుకొని
  rationale: పట్టీ నడుము వద్ద కాక దేహంపై ఎత్తుగా, ఛాతీ ప్రాంతంలో ఉన్నదనే దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ζώνην χρυσᾶν
  choice: బంగారు పట్టీ
  rationale: ζώνηకు నడికట్టు లేదా పట్టీ అనే అర్థాలు సాధ్యమైనా, ఛాతీ వద్ద ధరించిన సందర్భంలో ‘పట్టీ’ సహజంగా ఉండి దృశ్యానికి సరిపోతుంది.
theological_decisions:
- issue: ὅμοιον υἱὸν ἀνθρώπου యొక్క క్రీస్తుసంబంధమైన భావం
  choice: ప్రధాన పాఠ్యంలో ‘మనుష్య కుమారుని వంటివాడు ఒకడు’ అని అనువదించడం
  alternative: ‘మనుష్య కుమారుడైనవాని వంటివాడు’ లేదా స్థిర బిరుదుగా ‘మనుష్యకుమారుని వంటివాడు’
  rationale: ఈ రూపం గ్రీకు వాక్యంలోని అనిర్దిష్టతను, దానియేలు 7:13 సూచనను రెండింటినీ కాపాడుతుంది. ఈ దర్శనం మహిమపరచబడిన యేసుకు వర్తిస్తుందనే సందర్భార్థాన్ని పాదసూచికలో స్పష్టం చేస్తుంది; ప్రధాన పాఠ్యంలో మాత్రం వ్యాకరణం చెప్పినదానికంటే ఎక్కువ నిర్దిష్టతను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దర్శన వర్ణనకు తగిన గంభీరతతో కూడిన సహజ శైలి. ‘దీపస్తంభాలు,’ ‘పాదాల వరకు ఉండే వస్త్రం,’ ‘బంగారు పట్టీ’ వంటి పదాలు సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి; బిరుదుకు సంబంధించిన అసలు భాషా సందిగ్ధతను పాదసూచికతో నిలిపింది.
