id: REV.1.20
reference: Revelation 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: te
  text: 'నా కుడిచేతిలో నీవు చూసిన ఏడు నక్షత్రాల, అలాగే ఏడు బంగారు దీపస్తంభాల మర్మం ఇదే: ఆ ఏడు నక్షత్రాలు ఏడు సంఘాల దూతలు[a]; ఆ ఏడు దీపస్తంభాలు ఏడు సంఘాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం దేవదూతలను లేదా మానవ సందేశవాహకులను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: మర్మం
  rationale: దర్శనంలో వెల్లడించబడే అంతరార్థాన్ని సూచిస్తూ, అపోకలిప్టిక్ సందర్భంలోని భావగాంభీర్యాన్ని నిలుపుతుంది; కేవలం ‘సంకేతార్థం’ అని కుదించదు.
- source_word: ἀστέρων / ἀστέρες
  choice: నక్షత్రాలు
  rationale: దర్శనంలోని సంకేతాన్ని యథాతథంగా ఉంచుతుంది; దాని సూచనార్థాన్ని తరువాతి వాక్యభాగమే వివరిస్తుంది.
- source_word: οὓς εἶδες
  choice: నువ్వు చూసిన
  rationale: ‘నక్షత్రాలు’ను విశేషించే గ్రీకు సంబంధవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: నా కుడిచేతిలో
  rationale: ఈ దర్శన సందర్భంలో నక్షత్రాలు ఆయన కుడిచేతిలో ఉన్నాయనే సమీప సందర్భపు రూపకల్పనను సహజంగా తెలియజేస్తుంది.
- source_word: λυχνίας
  choice: దీపస్తంభాలు
  rationale: ఇది దీపాలను కాక, వాటిని ఉంచే స్తంభాలను సూచిస్తుంది; దర్శనంలోని స్పష్టమైన వస్తురూపాన్ని కాపాడుతుంది.
- source_word: χρυσᾶς
  choice: బంగారు
  rationale: వస్తువు బంగారంతో సంబంధం కలిగినదని సంక్షిప్తంగా, సహజంగా తెలియజేసే విశేషణం.
- source_word: ἄγγελοι
  choice: దూతలు
  rationale: గ్రీకు పదానికి దేవదూతలు లేదా మానవ సందేశవాహకులు అనే రెండు అర్థాలూ సాధ్యమైనందున, తెలుగు ‘దూతలు’ ఆ పదసంబంధమైన అస్పష్టతను ప్రధాన పాఠ్యంలోనే కొంతవరకు నిలుపుతుంది; పాదటిప్పణి రెండు అవకాశాలను స్పష్టం చేస్తుంది.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: సంఘాలు
  rationale: ప్రకటన గ్రంథం సంబోధించే స్థానిక విశ్వాస సమాజాలకు ఆధునిక తెలుగు బైబిలు వాడుకలో సహజమైన పదం.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: '… మర్మం, అలాగే … మర్మం ఇదే:'
  rationale: గ్రీకులో ముందుగా అంశాన్ని ప్రస్తావించి, తరువాత దాని వివరణ ఇచ్చే నిర్మాణాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది. రెండవ ‘మర్మం’ అర్థస్పష్టత కోసం పునరుక్తమైంది.
theological_decisions:
- issue: ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν అనే పదబంధంలో ἄγγελοι ఎవరిని సూచిస్తుంది?
  choice: ఏడు సంఘాల దూతలు
  alternative: ఏడు సంఘాల దేవదూతలు; లేదా ఏడు సంఘాల మానవ సందేశవాహకులు
  rationale: ἄγγελος అనే గ్రీకు పదం పరలోక దేవదూతను గానీ మానవ సందేశవాహకుణ్ణి గానీ సూచించగలదు. ప్రకటన గ్రంథంలో పరలోక జీవుల అర్థం సాధారణమైనప్పటికీ, ఇక్కడ ఉద్దేశించినవారు మానవులా పరలోక జీవులా అని పాఠ్యం స్పష్టంగా తేల్చదు. అందువల్ల ‘దూతలు’ అని అనువదించి, రెండు అవకాశాలను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని దర్శనాత్మక పదచిత్రాలు నిలుపబడ్డాయి. ἄγγελοι లోని నిజమైన అర్థసందిగ్ధతను ‘దూతలు’ మరియు పాదటిప్పణి ద్వారా సంరక్షించాం.
