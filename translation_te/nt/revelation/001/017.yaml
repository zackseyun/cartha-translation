id: REV.1.17
reference: Revelation 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: te
  text: 'నేను ఆయనను చూసినప్పుడు, చనిపోయినవాడిలా[a] ఆయన పాదాల దగ్గర పడిపోయాను. అప్పుడు ఆయన తన కుడిచేతిని నాపై ఉంచి ఇలా అన్నారు: “భయపడకు.[b] మొదటివాడను, చివరివాడను నేనే;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చనిపోయినట్టుగా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భయపడవద్దు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε εἶδον αὐτόν
  choice: నేను ఆయనను చూసినప్పుడు
  rationale: καί కథన ప్రవాహాన్ని కొనసాగిస్తుంది; తెలుగులో వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా సహజమైన కాలసూచక ఉపవాక్యంతో ఆ కొనసాగింపును వ్యక్తం చేశాం. εἶδον αὐτόνను సూటిగా ‘ఆయనను చూసినప్పుడు’ అని అనువదించాం.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: ఆయన పాదాల దగ్గర పడిపోయాను
  rationale: πρός ఇక్కడ ఆయన ఎదుట, ఆయన పాదాల వద్ద కూలిపోవడాన్ని సూచిస్తుంది. ‘పాదాల దగ్గర పడిపోయాను’ ఆధునిక తెలుగులో సహజంగా ఉండి భంగిమను స్పష్టంగా నిలుపుతుంది.
- source_word: ὡς νεκρός
  choice: చనిపోయినవాడిలా
  rationale: ὡς స్పష్టమైన ఉపమానాన్ని సూచిస్తుంది. యోహాను నిజంగా చనిపోయాడని చెప్పకుండా, మృతునిలా పడిపోయాడనే దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: ఆయన తన కుడిచేతిని నాపై ఉంచి
  rationale: τίθημι యొక్క ‘ఉంచు’ భావాన్ని సహజంగా అందిస్తుంది. మూలంలో స్పష్టంగా ఉన్న ‘కుడిచేతి’ని దాని ప్రతీకాత్మక ప్రాముఖ్యత కారణంగా యథాతథంగా ఉంచాం.
- source_word: λέγων
  choice: ఇలా అన్నారు
  rationale: గ్రీకు వర్తమాన కృదంతం చేతిని ఉంచిన చర్యతో పాటు పలికిన మాటలను పరిచయం చేస్తుంది. తెలుగులో గౌరవసూచకంగా, సహజంగా ‘ఇలా అన్నారు’ అని ఇచ్చాం.
- source_word: Μὴ φοβοῦ
  choice: భయపడకు
  rationale: ఏకవచన నిషేధాజ్ఞను సంక్షిప్తంగా, గంభీరంగా, ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐγώ εἰμι
  choice: నేనే
  rationale: వ్యక్తమైన ἐγώ వల్ల ఉన్న ఉద్ఘాటనను తెలుగు చివరి స్థానంలోని ‘నేనే’ సహజంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: మొదటివాడను, చివరివాడను
  rationale: ఆర్టికల్‌తో ఉన్న విశేషణాలు వ్యక్తిని సూచించే బిరుదులుగా పనిచేస్తున్నాయి. ‘మొదటివాడు, చివరివాడు’ మూలార్థాన్ని నేరుగా నిలుపుతూ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: ὁ πρῶτος καὶ ὁ ἔσχατος అనే స్వీయబిరుదు
  choice: మొదటివాడను, చివరివాడను నేనే
  alternative: ప్రథముడను, అంతిముడను నేనే
  rationale: ఇది మహిమపరచబడిన యేసు పలికే స్వీయబిరుదు; యెషయాలోని దైవిక బిరుదు భాషను ప్రతిధ్వనిస్తుంది. సంస్కృతభారం ఎక్కువగా ఉన్న ప్రత్యామ్నాయం కంటే మూలంలోని ‘మొదటి/చివరి’ జంటను సూటిగా, అర్థమయ్యే రీతిలో నిలిపాం; అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
- issue: ἐγώ εἰμι యొక్క ఉద్ఘాటన
  choice: నేనే
  alternative: నేను ఉన్నాను
  rationale: ఇక్కడ పదబంధం తరువాత వచ్చే బిరుదులతో కూడిన స్వీయపరిచయాన్ని చేస్తుంది. తెలుగులో ‘నేను ఉన్నాను’ అసహజంగా లేదా అస్తిత్వ ప్రకటనగా వినిపించవచ్చు; ‘నేనే’ వ్యక్తిపై ఉన్న ఉద్ఘాటనను కాపాడి, మూలం చెప్పినదానికంటే ఎక్కువ ప్రత్యేక సూచనను బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గంభీరమైన కథన శైలిని అనుసరించాం. యేసును సూచించే సర్వనామాలు, క్రియలకు గౌరవప్రయోగం వాడాం. [a] గుర్తును ఆ ప్రత్యామ్నాయం వర్తించే ‘చనిపోయినవాడిలా’ తరువాత ఉంచాం. చివరి అర్ధవిరామం 18వ వచనంలో కొనసాగనున్న స్వీయవివరణను సూచిస్తుంది.
