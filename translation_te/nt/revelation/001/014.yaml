id: REV.1.14
reference: Revelation 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: te
  text: ఆయన తల, వెంట్రుకలు తెల్లగా[a]—తెల్లని ఉన్నిలా, మంచులా—ఉన్నాయి; ఆయన కళ్లు అగ్నిజ్వాలలా[b] ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన తల, ఆయన వెంట్రుకలు తెల్లని ఉన్నిలా, మంచులా తెల్లగా ఉన్నాయి.”
    reason: గ్రీకు వాక్య నిర్మాణంలో తెల్లదనాన్ని తెలిపే పదానికీ తరువాతి రెండు ఉపమానాలకీ ఉన్న సంబంధాన్ని ఈ విధంగానూ వ్యక్తపరచవచ్చు.
  - marker: b
    text: ఈ దృశ్యరూపం దానియేలు 7:9ను ప్రతిధ్వనింపజేస్తూ, ఇది దర్శనాత్మక వర్ణన అని నొక్కిచెబుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది వర్ణనను కొనసాగించే స్వల్ప అనుసంధాన అవ్యయం. తెలుగులో సందర్భం, వాక్య నిర్మాణమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తాయి; కాలార్థం లేని పదాన్ని ‘ఇప్పుడు’ అని అనువదించడం నివారించబడింది.
- source_word: κεφαλὴ
  choice: తల
  rationale: దర్శన వర్ణనలోని సాధారణ శరీరాంగ పదాన్ని నేరుగా నిలుపుతుంది.
- source_word: τρίχες
  choice: వెంట్రుకలు
  rationale: గ్రీకులోని బహువచన రూపాన్ని సహజమైన తెలుగు శరీర వర్ణనగా వ్యక్తపరుస్తుంది.
- source_word: λευκαὶ
  choice: తెల్లగా
  rationale: మూలంలోని ప్రాథమిక వర్ణపదాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: ὡς ἔριον λευκόν
  choice: తెల్లని ఉన్నిలా
  rationale: ఉపమానాన్ని స్పష్టంగా ఉంచి, λευκόν అనే విశేషణం ἔριονను విశేషిస్తున్నదనే నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
- source_word: ὡς χιών
  choice: మంచులా
  rationale: తెల్లదనాన్ని బలపరిచే రెండవ ఉపమానాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ὀφθαλμοὶ
  choice: కళ్లు
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సాధారణ పదం.
- source_word: ὡς φλὸξ πυρός
  choice: అగ్నిజ్వాలలా
  rationale: ‘అగ్ని యొక్క జ్వాల’ అనే గ్రీకు భావాన్ని తెలుగులో సహజమైన సమాసంతో వ్యక్తపరుస్తూ, దర్శనాత్మక ఉపమానాన్ని నిలుపుతుంది.
theological_decisions:
- issue: మహిమపరచబడిన మనుష్యకుమారుని ప్రతీకాత్మక వర్ణన
  choice: ఉపమానాలను ప్రధాన పాఠ్యంలో యథాతథ దృశ్యరూపాలుగా ఉంచడం
  alternative: తెల్లదనాన్ని పవిత్రత లేదా నిత్యత్వంగా, అగ్నిజ్వాలను తీర్పుగా ప్రధాన పాఠ్యంలో వివరిస్తూ విస్తరించడం
  rationale: ఈ వచనం ప్రతీకలకు అర్థవ్యాఖ్య ఇవ్వకుండా దర్శనంలోని ఉపమానాలను మాత్రమే అందిస్తుంది. అందువల్ల అనువాదం వాటి సాధ్యమైన ధార్మిక భావాలను ఏకార్థంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన దర్శన వర్ణన. ‘ఉన్ని’, ‘అగ్నిజ్వాల’ వంటి పదాలు మూలంలోని చిత్రణను సంక్షిప్తంగా నిలుపుతాయి; డ్యాష్‌లు వరుస ఉపమానాలను స్పష్టంగా చూపుతాయి.
