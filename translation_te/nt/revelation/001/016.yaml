revisions:
- from: ఆయన తన కుడిచేతిలో ఏడు నక్షత్రాలను పట్టుకొని ఉన్నాడు. ఆయన నోటిలోనుండి పదునైన రెండంచుల ఖడ్గం[a] బయటికి వస్తూ ఉంది. ఆయన రూపం తన శక్తితో ప్రకాశించే సూర్యునిలా ఉంది.[b]
  to: ఆయన కుడిచేతిలో ఏడు నక్షత్రాలు ఉన్నాయి. ఆయన నోటినుండి పదునైన రెండు ధారలుగల ఖడ్గం[a] వెలువడుతోంది. ఆయన రూపం తన పూర్తి శక్తితో ప్రకాశించే సూర్యునిలా ఉంది.[b]
