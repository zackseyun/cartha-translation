id: REV.1.16
reference: Revelation 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: te
  text: ఆయన కుడిచేతిలో ఏడు నక్షత్రాలు ఉన్నాయి. ఆయన నోటినుండి పదునైన రెండు ధారలుగల ఖడ్గం[a] వెలువడుతోంది. ఆయన రూపం తన పూర్తి శక్తితో ప్రకాశించే సూర్యునిలా ఉంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పదునైన రెండంచుల ఖడ్గం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన శక్తి అంతటితో ప్రకాశించే సూర్యునిలా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: పట్టుకొని ఉన్నాడు
  rationale: ఈ వర్తమాన కృదంతం దర్శనంలో కొనసాగుతున్న వర్ణనను సూచిస్తుంది. తెలుగులో సహజమైన సమాపక క్రియారూపం ఆ కొనసాగుతున్న భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: తన కుడిచేతిలో
  rationale: గ్రీకులో χείρ (‘చేయి’) స్పష్టంగా ఉంది; అందువల్ల దానిని అనువాదంలో ఉంచి, సహజమైన తెలుగు పదక్రమాన్ని వాడాం.
- source_word: ἀστέρας ἑπτά
  choice: ఏడు నక్షత్రాలను
  rationale: మూలార్థాన్ని నేరుగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: ῥομφαία
  choice: ఖడ్గం
  rationale: ఈ పదం పెద్ద కత్తిని సూచించగలిగినా, ప్రకటన గ్రంథంలోని గంభీరమైన దర్శన చిత్రణకు ‘ఖడ్గం’ స్పష్టమైన, తగిన తెలుగు పదం; ఆయుధ రకాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: δίστομος
  choice: రెండంచుల
  rationale: అక్షరార్థంగా ‘రెండు నోళ్లుగల’ అనే రూపకం ఇక్కడ రెండు అంచులుగల ఆయుధాన్ని సూచిస్తుంది. ‘రెండంచుల’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ὀξεῖα
  choice: పదునైన
  rationale: ఖడ్గానికి సంబంధించిన పదునును స్పష్టంగా తెలియజేస్తుంది; మూలంలో అంచుల వర్ణనతోపాటు పదును కూడా ప్రత్యేకంగా పేర్కొనబడింది.
- source_word: ἐκπορευομένη
  choice: బయటికి వస్తూ ఉంది
  rationale: ఖడ్గం ఆయన నోటిలోనుండి వెలువడుతున్న కొనసాగుతున్న దర్శన దృశ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡ ὄψις αὐτοῦ
  choice: ఆయన రూపం
  rationale: ὄψις కేవలం ముఖానికే పరిమితం కాకుండా కనిపించే రూపాన్ని లేదా ఆకృతిని సూచిస్తుంది. ‘రూపం’ ఈ విస్తృతిని నిలుపుతుంది.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: ప్రకాశించే సూర్యునిలా
  rationale: వర్తమాన ప్రకాశాన్ని సహజమైన తెలుగు ఉపమాన రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: తన శక్తితో
  rationale: సూర్యుని బలం లేదా ప్రకాశ తీవ్రతను మూలానికి దగ్గరగా తెలియజేస్తుంది. ‘పూర్తి శక్తితో’ అనేది సందర్భోచితమైన వివరణాత్మక ప్రత్యామ్నాయం కాబట్టి పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: నోటిలోనుండి వెలువడే ఖడ్గం అనే దర్శన చిత్రణ స్వభావం
  choice: దర్శనంలోని రూపకాన్ని వివరణాత్మక విస్తరణ లేకుండా యథాతథంగా నిలుపడం
  alternative: ఖడ్గాన్ని క్రీస్తు తీర్పు తీర్చే వాక్యంగా ప్రధాన పాఠంలోనే స్పష్టంగా వ్యాఖ్యానించడం
  rationale: ఈ వచనం అపోకలిప్టిక్ ప్రతీకాత్మక దృశ్యాన్ని అందిస్తుంది. విస్తృత లేఖన సందర్భంలో ఇది దైవిక తీర్పుతో లేదా దేవుని వాక్యంతో సంబంధం కలిగి ఉండవచ్చుగానీ, ఆ వ్యాఖ్యానాన్ని అనువాద పాఠంలో చేర్చడం వచనంలోని ప్రతీకాత్మక ఉద్వేగాన్ని ముందుగానే పరిష్కరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన దర్శన శైలిని నిలిపాం. ‘ఖడ్గం’ వంటి పదం ప్రకటన గ్రంథపు ఉన్నత శైలికి తగినదిగా ఎంచుకోబడింది. సంప్రదింపుకు ఇచ్చిన ఆంగ్ల పాఠంలో పాదసూచిక గుర్తుల స్థానాలు వాటి విషయాలతో సరిపోలనందున, తెలుగు పాఠంలో [a]ను ఖడ్గం వద్ద, [b]ను సూర్యుని శక్తి వద్ద ఉంచాం.
