source:
  edition: SBLGNT
  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: te
  text: అతడు దేవుని వాక్యానికీ, యేసు మెస్సీయ సాక్ష్యానికీ[a], తాను చూసిన సమస్తానికీ సాక్ష్యమిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసు మెస్సీయ ఇచ్చిన సాక్ష్యానికి’; లేదా, ‘యేసు మెస్సీయను గురించిన సాక్ష్యానికి.’ గ్రీకు పదబంధాన్ని ఈ రెండు విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: సాక్ష్యమిచ్చాడు
  rationale: మార్ట్యురేయో అనే క్రియలోని సాక్షి/సాక్ష్యం భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; μαρτυρίαν తో ఉన్న పదబంధ సంబంధాన్నీ నిలుపుతుంది.
- source_word: λόγον
  choice: వాక్యం
  rationale: ఇక్కడ దేవుడు తెలియజేసిన ప్రవచన ప్రకటన అనే భావానికి ‘దేవుని వాక్యం’ స్థిరమైన, సహజమైన బైబిలు పదబంధం.
- source_word: μαρτυρίαν
  choice: సాక్ష్యం
  rationale: ἐμαρτύρησεν తో ఉన్న మూలపద సంబంధాన్ని ‘సాక్ష్యమిచ్చాడు/సాక్ష్యం’ రూపంలో కాపాడుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది; తెలుగులో ప్రత్యేక నిర్దేశక ఉపపదం లేకుండానే బిరుదు సహజంగా వ్యక్తమవుతుంది.
- source_word: ὅσα εἶδεν
  choice: తాను చూసినదంతటికీ
  rationale: ὅσα లోని సమగ్ర భావాన్ని ‘చూసినదంతటి’ అని తెలుపుతుంది; ‘తాను’ కర్తను స్పష్టంగా తిరిగి సూచిస్తుంది.
- source_word: τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: దేవుని వాక్యానికీ, యేసు మెస్సీయ సాక్ష్యానికీ
  rationale: రెండు సమన్విత కర్మలను సమాంతరంగా ఉంచుతుంది; ‘యేసు మెస్సీయ సాక్ష్యం’ అనే నిర్మాణం గ్రీకు షష్ఠీ విభక్తిలోని సంబంధ అస్పష్టతను ప్రధాన పాఠంలో సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ అనే షష్ఠీ విభక్తి ‘సాక్ష్యం’తో కలిగిన సంబంధం
  choice: ప్రధాన పాఠంలో ‘యేసు మెస్సీయ సాక్ష్యం’ అని ఉంచి సంబంధాన్ని నిర్ధారించకుండా వదిలింది.
  alternative: ‘యేసు మెస్సీయ ఇచ్చిన సాక్ష్యం’ లేదా ‘యేసు మెస్సీయను గురించిన సాక్ష్యం’
  rationale: గ్రీకు పదబంధం యేసు ఇచ్చిన సాక్ష్యాన్నీ లేదా యేసును గురించిన సాక్ష్యాన్నీ సూచించవచ్చు. మూలపాఠం నిర్ణయించని చోట అనువాదం ఒక భావాన్నే బలవంతంగా ఎంచుకోదు.
- issue: Χριστοῦ ను బిరుదుగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός బిరుదు భావం సజీవంగా ఉన్నందున దాని అర్థాన్ని తెలియజేసే ‘మెస్సీయ’ ఉపయోగించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సాక్ష్యమిచ్చాడు/సాక్ష్యం’ అనే పదజంట మూలంలోని క్రియా–నామ సంబంధాన్ని నిలుపుతుంది. చివరి భాగం ముందున్న రెండు అంశాలకు సమగ్ర వివరణగా కనిపించేందుకు డాష్‌ల మధ్య ‘అంటే’ వాడబడింది.
