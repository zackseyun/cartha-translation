id: REV.1.12
reference: Revelation 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: te
  text: నాతో మాట్లాడుతున్న[a] స్వరాన్ని చూడడానికి నేను తిరిగాను; అలా తిరిగినప్పుడు ఏడు బంగారు దీపస్తంభాలను చూశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను ఉద్దేశించి మాట్లాడుతున్న.” గ్రీకులో అక్షరార్థంగా “నాతో మాట్లాడుతున్న” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: నేను తిరిగాను
  rationale: ఇక్కడ ἐπιστρέφω శరీరాన్ని మరొక దిశకు తిప్పుకోవడాన్ని సూచిస్తుంది. ‘తిరిగాను’ అనేది మూలంలో లేని ‘వెనక్కి’ వంటి భావాన్ని చేర్చకుండా సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: βλέπειν
  choice: చూడడానికి
  rationale: ఈ క్రియారూపం తిరగడంలోని ఉద్దేశాన్ని తెలియజేస్తుంది. ‘చూడడానికి’ ఆధునిక తెలుగులో సహజమైన ప్రయోజనార్థక రూపం; ‘స్వరాన్ని చూడడం’ అనే మూలంలోని ఉద్దేశపూర్వకమైన అసాధారణ ప్రయోగాన్ని కూడా నిలుపుతుంది.
- source_word: τὴν φωνὴν
  choice: స్వరాన్ని
  rationale: మాట్లాడుతున్నది అని తరువాతి ఉపవాక్యం స్పష్టం చేస్తున్నందున φωνήకి ‘స్వరం’ సందర్భోచితమైన ఎంపిక. ‘శబ్దం’ అని అనువదిస్తే వ్యక్తిగతంగా మాట్లాడే భావం బలహీనపడుతుంది.
- source_word: ἥτις ἐλάλει μετ’ ἐμοῦ
  choice: నాతో మాట్లాడుతున్న
  rationale: ἐλάλει అనే అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను ‘మాట్లాడుతున్న’ నిలుపుతుంది. μετά + షష్ఠీ విభక్తిలోని సహవాస భావాన్ని ‘నాతో’ దగ్గరగా ప్రతిబింబిస్తుంది; తెలుగులో ‘నన్ను ఉద్దేశించి’ కూడా సందర్భానుసారంగా సాధ్యమైనందున దాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἐπιστρέψας
  choice: అలా తిరిగినప్పుడు
  rationale: ఈ భూతకాల కృదంతం ప్రధాన క్రియకు ముందు లేదా దానితో అనుసంధానమైన కాలక్రమాన్ని తెలియజేస్తుంది. ‘అలా తిరిగినప్పుడు’ ముందున్న తిరగడాన్ని సహజంగా తిరిగి సూచిస్తుంది.
- source_word: εἶδον
  choice: చూశాను
  rationale: ὁράω యొక్క సరళ భూతకాల భావాన్ని అదనపు వివరణ లేకుండా నేరుగా అందిస్తుంది.
- source_word: ἑπτὰ λυχνίας χρυσᾶς
  choice: ఏడు బంగారు దీపస్తంభాలను
  rationale: ἑπτάను ‘ఏడు’గా, χρυσᾶςను పదార్థం/గుణాన్ని తెలిపే ‘బంగారు’గా అనువదించాం. λυχνία దీపాన్ని ఉంచే స్తంభాన్ని సూచిస్తుంది కాబట్టి ‘దీపాలు’కన్నా ‘దీపస్తంభాలు’ ఖచ్చితమైనది.
theological_decisions:
- issue: ప్రకటన గ్రంథంలోని సంకేతాత్మక వస్తువు λυχνίας అనువాదం
  choice: దీపస్తంభాలు
  alternative: దీపాలు
  rationale: 1:20లో ఈ వస్తువులకే సంకేతార్థ వివరణ ఇవ్వబడుతుంది. ‘దీపాలు’ అని అనువదిస్తే దీపానికి, దాన్ని ఉంచే స్తంభానికి మధ్యనున్న భేదం చెరిగిపోతుంది; అందువల్ల మూలంలోని నిర్దిష్ట వస్తురూపాన్ని నిలిపాం.
- issue: ‘స్వరాన్ని చూడడం’ అనే అసాధారణ వ్యక్తీకరణ
  choice: స్వరాన్ని చూడడానికి
  alternative: స్వరం ఎవరిదో చూడడానికి
  rationale: మూల గ్రీకులో ‘స్వరాన్ని చూడడం’ అనే ఉద్దేశపూర్వకంగా అసాధారణమైన నిర్మాణమే ఉంది. దాన్ని ‘స్వరం ఎవరిదో’ అని వివరిస్తే అర్థాన్ని ముందుగానే పరిష్కరించి మూలంలోని సాహిత్య ఉద్వేగాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని ‘స్వరాన్ని చూడడం’ అనే అసాధారణతను సరళీకరించలేదు. రెండు సార్లు వచ్చే ‘తిరుగు’ భావాన్ని నిలిపి, రెండవదాన్ని ‘అలా తిరిగినప్పుడు’గా సహజంగా అనుసంధానించాం.
