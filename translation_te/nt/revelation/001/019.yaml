  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: te
  text: కాబట్టి నీవు చూసిన వాటిని, ఉన్న వాటిని, వీటి తర్వాత జరగబోయే వాటిని[a] వ్రాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీటి తర్వాత జరగనున్న వాటిని.” ఈ క్రియ కొన్ని సందర్భాల్లో సాధారణ భవిష్యత్తును సూచించవచ్చు; అయితే తరచుగా త్వరలో లేదా రాబోయే కాలంలో జరగనున్నదనే భావాన్ని కలిగి ఉంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: రాయి
  rationale: రెండవ పురుష ఏకవచన ఆజ్ఞార్థక క్రియ; అదనపు భావం చేర్చకుండా ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి దర్శనం, అప్పగింత ఆధారంగా వచ్చే కొనసాగింపు లేదా నిర్ధారణను స్పష్టంగా నిలుపుతుంది.
- source_word: ἃ εἶδες
  choice: నువ్వు చూసినవాటిని
  rationale: ఇప్పటికే చూసిన దర్శన విషయాలను సూచించే సంబంధవాచక నిర్మాణాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἃ εἰσὶν
  choice: ఇప్పుడు ఉన్నవాటిని
  rationale: గ్రీకు వర్తమాన కాల భావాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘ఇప్పుడు’ చేర్చబడింది; ఇది ప్రస్తుత వాస్తవాలను సూచిస్తుంది.
- source_word: μέλλει γίνεσθαι
  choice: జరగబోతున్నవాటిని
  rationale: μέλλω + క్రియారూపంలో ఉన్న సమీప లేదా రాబోయే సంభవ భావాన్ని సాధారణ భవిష్యత్తుగా చదును చేయకుండా నిలుపుతుంది.
- source_word: μετὰ ταῦτα
  choice: వీటి తర్వాత
  rationale: బహువచన సూచనను, కాలక్రమ సంబంధాన్ని రెండింటినీ సహజమైన తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: ప్రకటన గ్రంథపు సందర్భంలో μέλλει అనే క్రియ యొక్క కాలసూచక బలం
  choice: సమీపత లేదా రాబోయే సంభవ భావంతో ‘జరగబోతున్నవాటిని’
  alternative: సాధారణ భవిష్యత్తుగా ‘జరిగేవాటిని’ లేదా ‘జరగనున్నవాటిని’
  rationale: గ్రీకు నిర్మాణం జరగబోయే లేదా ఆసన్నమైన కార్యాన్ని సూచించగలదు. ఆ కాలసంబంధ ఉద్వేగాన్ని నిలుపుతూ, విస్తృత అంత్యకాల వాదాలలో ఏదో ఒకదాన్ని నిర్ణయాత్మకంగా ప్రతిపాదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. యోహానుతో ఏకవచన ప్రత్యక్ష సంభాషణను చూపడానికి ‘నువ్వు’ వాడబడింది. మూడు సమాంతర కర్మపదాలను నిలుపుతూ వాక్యం పఠనయోగ్యంగా రూపొందించబడింది.
