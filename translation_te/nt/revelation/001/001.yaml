id: REV.1.1
reference: Revelation 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: te
  text: మెస్సీయ అయిన యేసు యొక్క ప్రకటన[a] ఇది. త్వరలో[b] జరగవలసిన సంగతులను తన దాసులకు చూపించడానికి దేవుడు దానిని ఆయనకు ఇచ్చాడు. ఆయన తన దూతను పంపి, ఆ దూత ద్వారా తన దాసుడైన యోహానుకు దానిని తెలియజేశాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మెస్సీయ అయిన యేసు నుండి వచ్చిన ప్రకటన’ అని గానీ, ‘మెస్సీయ అయిన యేసును గురించిన ప్రకటన’ అని గానీ కూడా అర్థం చేసుకోవచ్చు. గ్రీకు షష్ఠీ రూపం ఈ సంబంధాన్ని ఒక్క విధంగానే నిర్ణయించదు.
    reason: alternative_reading
  - marker: b
    text: ‘త్వరలో’ అనే మాటకు బదులు ‘వేగంగా’ అని కూడా అనువదించవచ్చు. ఈ సంగతులు సమీప కాలంలో జరుగుతాయని గానీ, మొదలైన తర్వాత వేగంగా జరుగుతాయని గానీ ఈ మాట సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘తెలియజేశాడు’ అని అనువదించిన గ్రీకు క్రియకు ‘సంకేతాల ద్వారా తెలియజేశాడు’ అనే భావఛాయ కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: ప్రకటన
  rationale: దాచబడినది బయల్పరచబడటం లేదా తెలియజేయబడటం అనే భావాన్ని సహజమైన, సంప్రదాయబద్ధమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: మెస్సీయ అయిన యేసు యొక్క
  rationale: Χριστόςను వంశనామంలా కాక బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తుంది. ‘యొక్క’ అనే షష్ఠీ నిర్మాణం ప్రకటన ఆయన నుండి వచ్చిందా, ఆయనను గురించిందా అనే మూలపాఠంలోని సంబంధాన్ని ప్రధాన వాక్యంలో పూర్తిగా నిర్ణయించదు.
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: దేవుడు దానిని ఆయనకు ఇచ్చాడు
  rationale: దేవుడు ఇచ్చేవాడిగా, యేసు స్వీకరించేవాడిగా ఉన్న మూలపాఠ భేదాన్ని వివరణ జోడించకుండా నిలుపుతుంది.
- source_word: δεῖξαι
  choice: చూపించడానికి
  rationale: ఉద్దేశాన్ని తెలిపే క్రియారూపాన్ని నేరుగా, దర్శన సంబంధ సందర్భానికి తగినట్లుగా అందిస్తుంది.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: తన దాసులకు
  rationale: δοῦλοςలోని యజమానికి చెందినవాడు అనే బలమైన భావాన్ని ‘సేవకులు’ కంటే ‘దాసులు’ స్పష్టంగా నిలుపుతుంది.
- source_word: ἃ δεῖ γενέσθαι
  choice: జరగవలసిన సంగతులను
  rationale: δεῖలోని అవసరతను ‘వలసిన’ ద్వారా, బహువచన సంబంధార్థాన్ని ‘సంగతులను’ ద్వారా సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἐν τάχει
  choice: త్వరలో
  rationale: సందర్భంలో సమీప భవిష్యత్తు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; వేగంగా జరిగే భావసాధ్యతను పాదసూచికలో ఉంచింది.
- source_word: ἐσήμανεν
  choice: తెలియజేశాడు
  rationale: సమాచారాన్ని తెలియపరచడం అనే ప్రధాన అర్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో ఇస్తుంది; సంకేతాల ద్వారా సూచించడం అనే సాధ్యమైన ఛాయను పాదసూచికలో కాపాడుతుంది.
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: తన దూతను పంపి, ఆ దూత ద్వారా
  rationale: పంపడం అనే భాగక్రియను, దూత మధ్యవర్తిగా పనిచేసిన భావాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో స్పష్టం చేస్తుంది.
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: తన దాసుడైన యోహానుకు
  rationale: యోహాను స్వీకర్త అని విభక్తి ద్వారా చూపుతూ, ముందున్న δοῦλος అనువాదంతో ఏకరీతిని నిలుపుతుంది.
theological_decisions:
- issue: Ἀποκάλυψις Ἰησοῦ Χριστοῦలోని షష్ఠీ సంబంధం
  choice: ‘మెస్సీయ అయిన యేసు యొక్క ప్రకటన’ అని అనువదించి సంబంధాన్ని విస్తృతంగా ఉంచడం
  alternative: ‘మెస్సీయ అయిన యేసు నుండి వచ్చిన ప్రకటన’ లేదా ‘మెస్సీయ అయిన యేసును గురించిన ప్రకటన’
  rationale: గ్రీకు షష్ఠీ మూలం, విషయం, లేదా అధికారం వంటి ఒకటి కంటే ఎక్కువ సంబంధాలను సూచించగలదు. ప్రధాన పాఠంలో ఒక్కదానిని బలవంతంగా నిర్ణయించకుండా పాదసూచికలో సాధ్యతలను తెలిపింది.
- issue: δοῦλος పదం యొక్క సంబంధాత్మక బలం
  choice: దాసుడు / దాసులు
  alternative: సేవకుడు / సేవకులు
  rationale: ప్రకటన గ్రంథ సందర్భంలో దేవునికి లేదా మెస్సీయకు చెందినవారనే యజమాని–దాస సంబంధం ప్రాధాన్యంగా ఉంది; ‘దాసుడు’ ఆ బలాన్ని నిలుపుతుంది.
- issue: ἐσήμανενలో సంకేతార్థ ఛాయ
  choice: ప్రధాన పాఠంలో ‘తెలియజేశాడు’
  alternative: ‘సంకేతాల ద్వారా తెలియజేశాడు’ లేదా ‘సూచించాడు’
  rationale: క్రియకు సాధారణంగా ‘తెలియజేయడం’ అనే అర్థం ఉంది; సంకేతాల ద్వారా సమాచారమివ్వడం అనే ఛాయ ప్రకటన గ్రంథానికి సరిపోతున్నా, దానిని ప్రధాన పాఠంలో తప్పనిసరి అర్థంగా చేర్చకుండా పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. ‘మెస్సీయ’, ‘దాసులు’, ‘దూత’ వంటి పదాలు మూలపాఠంలోని బిరుదు, చెందినతనం, మధ్యవర్తిత్వ భావాలను కాపాడుతాయి. పొడవైన గ్రీకు వాక్యాన్ని అర్థస్పష్టత కోసం మూడు తెలుగు వాక్యాలుగా విభజించినా, సంఘటనల క్రమం మరియు సంబంధాలు నిలుపబడ్డాయి.
