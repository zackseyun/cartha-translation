language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י מָרְדֳּכַ֣י הַ/יְּהוּדִ֗י מִשְׁנֶה֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וְ/גָדוֹל֙ לַ/יְּהוּדִ֔ים וְ/רָצ֖וּי לְ/רֹ֣ב אֶחָ֑י/ו דֹּרֵ֥שׁ טוֹב֙ לְ/עַמּ֔/וֹ וְ/דֹבֵ֥ר שָׁל֖וֹם לְ/כָל זַרְעֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/003.yaml
  text: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
translation:
  language: te
  text: ఎందుకంటే యూదుడైన మొర్దెకై అహష్వేరోషు రాజుకు రెండవ స్థానంలో ఉన్నాడు. అతడు యూదుల మధ్య గొప్పవాడుగా, తన సహోదరుల్లో అనేకమందికి[a][b] అభిమానపాత్రుడుగా ఉన్నాడు. అతడు తన ప్రజల మేలు కోరుతూ, తన సంతానమంతటికీ[c] శాంతి పలికేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన సహోదరుల్లో అధికులకు.” హీబ్రూ పదబంధం అనేకమందిని గానీ, అధిక సంఖ్యాకులను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “సహోదరులు” అంటే కేవలం ఒకే తల్లిదండ్రులకు పుట్టిన పురుషులు కాక, తోటి యూదులు లేదా బంధువులు అని భావం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “తన వంశస్థులందరికీ.” హీబ్రూలోని “సంతానం” సమష్టిని సూచించే పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి సంగ్రహానికి వివరణాత్మక ఆధారాన్ని పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַיְּהוּדִי
  choice: యూదుడైన
  rationale: పర్షియా నేపథ్యంలోని మొర్దెకై జాతి-మత గుర్తింపును స్పష్టంగా తెలియజేస్తుంది; భౌగోళిక భావానికే పరిమితం చేయదు.
- source_word: מִשְׁנֶה לַמֶּלֶךְ
  choice: అహష్వేరోషు రాజుకు రెండవ స్థానంలో
  rationale: రాజు తరువాతి హోదా అనే భావాన్ని, మూలంలో లేని నిర్దిష్ట అధికార పదవిని చేర్చకుండా తెలియజేస్తుంది.
- source_word: וְגָדוֹל לַיְּהוּדִים
  choice: యూదుల మధ్య గొప్పవాడుగా
  rationale: యూదుల సమాజంలో అతనికున్న ఉన్నత స్థానం, ప్రాముఖ్యతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְרָצוּי
  choice: అభిమానపాత్రుడుగా
  rationale: సమాజం అతణ్ణి ఆమోదించి ఆదరించిందనే నిష్క్రియాత్మక భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: לְרֹב אֶחָיו
  choice: తన సహోదరుల్లో అనేకమందికి
  rationale: רֹב అనే పదంలోని ‘అనేకులు/అధికులు’ అనే పరిమాణ భావాన్ని ప్రధాన పాఠంలో సులభంగా చదివేలా ఇస్తూ, ‘అధికులకు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: אֶחָיו
  choice: తన సహోదరులు
  rationale: మూలంలోని కుటుంబ సంబంధ పదాన్ని నిలుపుతుంది; సందర్భంలో ఇది తోటి యూదులను లేదా బంధువులను సూచించవచ్చని పాదసూచిక వివరిస్తుంది.
- source_word: דֹּרֵשׁ טוֹב לְעַמּוֹ
  choice: తన ప్రజల మేలు కోరుతూ
  rationale: తన ప్రజల ప్రయోజనాన్ని చురుకుగా అన్వేషించే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְדֹבֵר שָׁלוֹם
  choice: శాంతి పలికేవాడు
  rationale: שָׁלוֹם లోని శాంతి, క్షేమం అనే విస్తృత ప్రతిధ్వనిని ఉంచుతూ హీబ్రూ వాక్యరీతికి దగ్గరగా ఉంటుంది.
- source_word: לְכָל זַרְעוֹ
  choice: తన సంతానమంతటికీ
  rationale: זֶרַע యొక్క సమష్టి ‘సంతానం/వంశస్థులు’ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
