translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మొదటి వాక్యంలో హోదాను స్పష్టంగా చెప్పి, తరువాతి భాగంలోని హీబ్రూ కృదంతాల నిరంతర స్వభావాన్ని ‘కోరుతూ ... పలికేవాడు’ ద్వారా సహజంగా వ్యక్తం చేశాం. మూలంలోని పరిమాణ, బంధుత్వ, సంతాన పదాల నిజమైన విస్తృతిని పాదసూచికల్లో నిలిపాం.
