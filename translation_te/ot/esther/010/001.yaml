  yaml_path: translation/ot/esther/010/001.yaml
  text: King Ahasuerus imposed tribute on the land and the islands of the sea[a][b].
translation:
  language: te
  text: అహష్వేరోషు రాజు దేశంపైనా సముద్ర ద్వీపాలపైనా[a] కప్పం[b] విధించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సముద్ర తీరప్రాంతాలపైనా.” హీబ్రూ పదం ద్వీపాలను లేదా సముద్ర తీరప్రాంతాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “పన్ను” లేదా “సుంకం.” హీబ్రూ పదం కొన్ని సందర్భాల్లో బలవంతపు శ్రమను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: విధించాడు
  rationale: שׂוּם מַס עַל అనే పరిపాలనా ప్రయోగంలో పన్ను లేదా కప్పం మోపడం అనే అర్థం ఉంది; ఆధునిక తెలుగులో ‘విధించాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַמֶּלֶךְ אחשרש
  choice: అహష్వేరోషు రాజు
  rationale: వ్యక్తి పేరుతో కూడిన రాజబిరుదును సహజ తెలుగు క్రమంలో ఇచ్చాం; పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מַס
  choice: కప్పం
  rationale: ఈ సందర్భంలో సామ్రాజ్యాధీన ప్రాంతాలపై విధించిన ఆర్థిక లేదా రాజకీయ చెల్లింపును ‘కప్పం’ బాగా వ్యక్తపరుస్తుంది; మూలపదానికి పన్ను, బలవంతపు శ్రమ అనే ఇతర సందర్భార్థాలూ ఉన్నాయి.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ సమస్త భూమి కాక రాజు అధికారంలోని భూభాగం ఉద్దేశించబడింది; ‘దేశం’ ఆ భౌగోళిక-రాజకీయ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְאִיֵּי הַיָּם
  choice: సముద్ర ద్వీపాల మీద
  rationale: హీబ్రూ పదబంధంలోని సముద్ర సంబంధ భౌగోళిక విస్తృతిని నిలుపుతూ ప్రధాన అర్థమైన ద్వీపాలను నేరుగా అనువదించాం; ‘తీరప్రాంతాలు’ అనే అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
