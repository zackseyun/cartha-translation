translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన చారిత్రక-వివరణాత్మక శైలి. సామ్రాజ్య సంబంధ భావాన్ని తెలియజేయడానికి ‘కప్పం’ ఎంచుకొని, మూలంలోని పదార్థ అనిశ్చితిని పాదసూచికల్లో నిలిపాం.
