  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל מַעֲשֵׂ֤ה תָקְפּ/וֹ֙ וּ/גְב֣וּרָת֔/וֹ וּ/פָרָשַׁת֙ גְּדֻלַּ֣ת מָרְדֳּכַ֔י אֲשֶׁ֥ר גִּדְּל֖/וֹ הַ/מֶּ֑לֶךְ הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֨פֶר֙ דִּבְרֵ֣י הַ/יָּמִ֔ים לְ/מַלְכֵ֖י מָדַ֥י וּ/פָרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/002.yaml
  text: And all the acts of his power and might[a], and the full account of the greatness of Mordecai, to which the king raised him—are they not written in the Book of the Chronicles of the Kings of Media and Persia?
translation:
  language: te
  text: అతని శక్తి, పరాక్రమాలకు సంబంధించిన కార్యాలన్నీ, రాజు మొర్దెకైని ఉన్నతపరిచిన అతని గొప్పతనం గురించిన పూర్తి వృత్తాంతం—ఇవన్నీ మాదీయుల, పారసీకుల రాజుల దినవృత్తాంతాల గ్రంథంలో[a] రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “మాదీయుల, పారసీకుల రాజుల వార్షిక వృత్తాంతాల గ్రంథం.”
    reason: సֵפֶר דִּבְרֵי הַיָּמִים అనే పదబంధం అధికారిక రాజవంశీయ దినవృత్తాంతాలు లేదా వార్షిక వృత్తాంతాలను సూచించవచ్చు.
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: కార్యాలు
  rationale: జరిగిన లేదా చేయబడిన పనులను సూచించే విస్తృత పదం; రాజవృత్తాంతపు శైలికి ‘కార్యాలు’ సహజంగా సరిపోతుంది.
- source_word: תָקְפּוֹ
  choice: అతని శక్తి
  rationale: రాజకీయంగా ప్రభావం చూపగల బలం లేదా అధికారసామర్థ్యాన్ని సూచిస్తుంది; కేవలం శారీరక బలానికి పరిమితం కాకుండా ‘శక్తి’ అర్థాన్ని నిలుపుతుంది.
- source_word: גְבוּרָתוֹ
  choice: పరాక్రమం
  rationale: תָקְפּוֹతో జతగా వచ్చి శౌర్యం లేదా మహాబలాన్ని వ్యక్తం చేస్తుంది; ‘శక్తి పరాక్రమాలు’ అనే జంట తెలుగు ఉన్నత చారిత్రక శైలిలో సహజంగా ఉంది.
- source_word: וּפָרָשַׁת
  choice: పూర్తి వృత్తాంతం
  rationale: వివరంగా తెలియజేయబడిన నివేదిక లేదా కథనాన్ని సూచిస్తుంది; అధికారిక లిఖిత ఆధార భావాన్ని ‘వృత్తాంతం’ నిలుపుతుంది.
- source_word: גְּדֻלַּת מָרְדֳּכַי
  choice: మొర్దెకై గొప్పతనం
  rationale: మొర్దెకై పొందిన ఔన్నత్యం లేదా ఉన్నత స్థితిని సూచించే నిర్మాణాన్ని అధికంగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ
  choice: రాజు అతన్ని ఎంతగా హెచ్చించాడో
  rationale: పియేల్ క్రియలోని ‘గొప్పవానిగా చేయడం, ఉన్నత స్థితికి తీసుకెళ్లడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి కదా?
  rationale: హీబ్రూ అలంకారప్రశ్నను, చారిత్రక గ్రంథాల్లో కనిపించే ధృవీకరణ స్వరాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: దినవృత్తాంతాల గ్రంథం
  rationale: రాజుల పాలనలకు సంబంధించిన అధికారిక దినచర్యా నమోదులు లేదా చారిత్రక వార్షిక వృత్తాంతాల గ్రంథాన్ని సూచిస్తుంది.
- source_word: לְמַלְכֵי מָדַי וּפָרָס
  choice: మాదీయుల, పారసీకుల రాజుల
  rationale: לְ ఇక్కడ ఆ గ్రంథం ఎవరి పాలనలకు సంబంధించినదో తెలిపే గ్రంథశీర్షికలో భాగం; తెలుగులో షష్ఠీ సంబంధం సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక శైలి వాడబడింది. హీబ్రూ అలంకారప్రశ్నను నిలిపి, దీర్ఘ వాక్యం చదవడానికి సులభంగా ఉండేందుకు డాష్‌లతో ఉపవాక్యం వేరుచేయబడింది. పాదసూచిక గుర్తు దానికి సంబంధించిన ‘దినవృత్తాంతాల గ్రంథం’ వద్ద ఉంచబడింది.
