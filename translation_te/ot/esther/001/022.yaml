- from: అతడు రాజు పాలనలోని అన్ని సంస్థానాలకు ఉత్తరాలు పంపించాడు—ప్రతి సంస్థానానికి దాని లిపిలో, ప్రతి ప్రజకు వారి భాషలో. ప్రతి పురుషుడు తన ఇంటిలో అధిపతిగా ఉండాలని, తన ప్రజల భాషనే మాట్లాడాలని[a] వాటిలో రాయించాడు.
