translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజపాలనా నేపథ్యానికి తగిన గౌరవప్రదమైన సరళ శైలి వాడాం. ‘సంస్థానం,’ ‘లిపి,’ ‘అధిపతి’ వంటి పదాలు పరిపాలనా మరియు గృహాధికార భావాలను స్పష్టంగా అందిస్తాయి.
