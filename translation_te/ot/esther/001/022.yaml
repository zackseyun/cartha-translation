  text: וַ/יִּשְׁלַ֤ח סְפָרִים֙ אֶל כָּל מְדִינ֣וֹת הַ/מֶּ֔לֶךְ אֶל מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/אֶל עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ לִ/הְי֤וֹת כָּל אִישׁ֙ שֹׂרֵ֣ר בְּ/בֵית֔/וֹ וּ/מְדַבֵּ֖ר כִּ/לְשׁ֥וֹן עַמּֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/022.yaml
  text: And he sent letters to all the provinces of the king[a], to each province in its own script and to each people in its own language[d][c][b], that every man should be master in his own house and speak the language of his own people.
translation:
  language: te
  text: అతడు రాజు యొక్క అన్ని పరిపాలనా ప్రాంతాలకు ఉత్తరాలు పంపించాడు—ప్రతి ప్రాంతానికి దాని లిపిలోను, ప్రతి ప్రజాసమూహానికి దాని భాషలోను. ప్రతి పురుషుడు తన ఇంటిలో అధిపతిగా ఉండాలని, తన ప్రజల భాషలో మాట్లాడాలని[a] వాటిలో రాయించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి మాటల అర్థవివరణపై భిన్నాభిప్రాయాలు ఉన్నాయి. ఇది ప్రతి పురుషుడు తన ప్రజల భాషలో మాట్లాడాలని అర్థం కావచ్చు; లేదా ఇంటి వ్యవహారాలు భర్త ప్రజల భాషకు అనుగుణంగా ఉండాలని విస్తృతంగా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: అతడు ... ఉత్తరాలు పంపించాడు
  rationale: కథనాన్ని ముందుకు నడిపించే wayyiqtol క్రియను సహజమైన తెలుగు భూతకాలంలో ఇచ్చాం; రాజపాలనా సందర్భంలో סְפָרִים అంటే పంపబడిన అధికారిక ఉత్తరాలు.
- source_word: כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: రాజు పాలనలోని అన్ని సంస్థానాలకు
  rationale: రాజుకు చెందిన పరిపాలనా ప్రాంతాలనే సూచిస్తుంది. ‘రాజు పాలనలోని’ అనేది తెలుగులో సహజంగా ఉండి సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: אֶל מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: ప్రతి సంస్థానానికి దాని లిపిలో
  rationale: పునరుక్త ఏకవచనం పంపిణీ భావాన్ని ఇస్తుంది; כִּכְתָבָהּ ఆయా ప్రాంతపు లిపి లేదా వ్రాతపద్ధతిని సూచిస్తుంది.
- source_word: וְאֶל עַם וָעָם כִּלְשׁוֹנוֹ
  choice: ప్రతి ప్రజకు వారి భాషలో
  rationale: సామ్రాజ్యంలోని ప్రతి జాతి/ప్రజాసమూహానికి వారి భాషలో సమాచారం పంపబడిందనే పంపిణీ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִהְיוֹת כָּל אִישׁ שֹׂרֵר בְּבֵיתוֹ
  choice: ప్రతి పురుషుడు తన ఇంటిలో అధిపతిగా ఉండాలని
  rationale: כָּל אִישׁ ను లింగసూచకంగా ‘ప్రతి పురుషుడు’ అని, שֹׂרֵר ను ఇంటిలో అధికారాన్ని చలాయించే ‘అధిపతి’ అని అనువదించాం; వివాహ సందర్భాన్ని బట్టి ‘భర్త’ అని మూలపదాన్ని సంకుచితం చేయలేదు.
- source_word: וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ
  choice: తన ప్రజల భాషనే మాట్లాడాలని
  rationale: క్రియారూపం శాసన విషయాన్ని కొనసాగిస్తుంది. ‘భాషనే’ అనే ప్రయోగం తన ప్రజల భాషకు ఇచ్చిన ప్రాధాన్యాన్ని తెలుగులో సహజంగా చూపుతుంది; అస్పష్టతను పాదసూచికలో నిలిపాం.
