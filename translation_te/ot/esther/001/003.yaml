  source_fidelity: మూలంలోని לְפָנָיו (‘అతని ఎదుట/సమక్షంలో’) జాబితాలోని అతిథుల హాజరును సూచిస్తుంది. ముసాయిదా దానిని కొత్త స్వతంత్ర వాక్యంగా మార్చి, ‘వారంతా’ అని మూలంలో స్పష్టంగా లేని సమూహ-సూచనను జతచేస్తుంది. దానిని ప్రధాన వాక్యంలోని స్థానిక పదబంధంగా ఉంచడం మరింత సన్నిహితమైనది.
  naturalness: ‘రాష్ట్రాలు’ ఆధునిక దేశీయ/రాజకీయ రాష్ట్రాల భావాన్ని కలిగించవచ్చు; సామ్రాజ్య పరిపాలనా విభాగాల సందర్భంలో ‘ప్రాంతాలు’ సహజం, స్పష్టం. ‘తన రాజ్యపాలన మూడవ సంవత్సరంలో’ కూడా రాజు యొక్క reign అనే భావాన్ని మరింత ఖచ్చితంగా ఇస్తుంది.
  terminology: ‘విందు’, ‘అధికారులు’, ‘సేవకులు’, ‘సైన్యం’, ‘కులీనులు’ తగిన ఆధునిక ప్రామాణిక పదాలు. חֵיל యొక్క విస్తృత ‘సైనిక బలం’ అర్థాన్ని పాదటిప్పణిలో నిలుపుతున్నాం. הַפַּרְתְּמִיםను ‘కులీనులు’గా ఉంచడం సముచితం.
