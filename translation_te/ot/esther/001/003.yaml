source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת שָׁלוֹשׁ֙ לְ/מָלְכ֔/וֹ עָשָׂ֣ה מִשְׁתֶּ֔ה לְ/כָל שָׂרָ֖י/ו וַ/עֲבָדָ֑י/ו חֵ֣יל פָּרַ֣ס וּ/מָדַ֗י הַֽ/פַּרְתְּמִ֛ים וְ/שָׂרֵ֥י הַ/מְּדִינ֖וֹת לְ/פָנָֽי/ו־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
translation:
  language: te
  text: తన రాజ్యపాలన మూడవ సంవత్సరంలో అతడు తన అధికారులందరికీ, సేవకులందరికీ—అతని సమక్షంలో ఉన్న పారసీక, మాదీయ సైన్యానికీ[b], కులీనులకూ, ప్రాంతాల అధికారులకూ—విందు[a] ఏర్పాటు చేశాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పానవిందు’; హీబ్రూ పదం పానంతో కూడిన వేడుకను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పారసీక, మాదీయ సైనిక బలానికి.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘అతని ఎదుట.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: తన పరిపాలన మూడో సంవత్సరంలో
  rationale: ఈ పదబంధం రాజు పరిపాలించిన కాలంలోని మూడో సంవత్సరాన్ని సూచిస్తుంది; ఇది సహజమైన ఆధునిక తెలుగు కాలవ్యక్తీకరణ.
- source_word: עָשָׂה מִשְׁתֶּה
  choice: విందు ఏర్పాటు చేశాడు
  rationale: עָשָׂה అక్షరార్థంగా ‘చేశాడు’ అయినప్పటికీ, מִשְׁתֶּהతో కలిసి విందు నిర్వహించడాన్ని సూచిస్తుంది. ‘విందు ఏర్పాటు చేశాడు’ రాజసభ సందర్భంలో సహజంగా ఉంది.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: తన అధికారులందరికీ, సేవకులందరికీ
  rationale: שָׂרִים పరిపాలనా హోదా గలవారిని, עֲבָדִים ఈ సందర్భంలో రాజసేవలోని వారిని సూచిస్తాయి; బానిసత్వాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా మూల భావాన్ని నిలుపుతుంది.
- source_word: חֵיל פָּרַס וּמָדַי
  choice: పారసీక, మాదీయ సైన్యానికి
  rationale: חֵיל సైన్యం, సైనిక బలం లేదా శక్తి అనే అర్థాలను కలిగి ఉంటుంది. ఈ రాజసభ జాబితాలో ‘సైన్యం’ సంక్షిప్తంగా, సహజంగా సైనిక భావాన్ని తెలియజేస్తుంది.
- source_word: הַפַּרְתְּמִים
  choice: కులీనులకు
  rationale: ఈ పారసీక మూలపదం ఉన్నత హోదా గల రాజసభ కులీనులను సూచిస్తుంది; ‘కులీనులు’ దాని సామాజిక-రాజకీయ స్థాయిని అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: וְשָׂרֵי הַמְּדִינוֹת
  choice: రాష్ట్రాల అధికారులకు
  rationale: מְדִינוֹת సామ్రాజ్యంలోని పరిపాలనా ప్రాంతాలు; שָׂרֵי వారి పాలనా అధికారులను సూచిస్తుంది. ‘గవర్నర్లు’ వంటి నిర్దిష్ట పదవిని మూలంలో లేనప్పుడు చేర్చలేదు.
- source_word: לְפָנָיו
  choice: అతని సమక్షంలో ఉన్నారు
  rationale: అక్షరార్థమైన ‘అతని ఎదుట’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ, వారు రాజు సన్నిధిలో హాజరయ్యారని స్పష్టం చేస్తుంది.
