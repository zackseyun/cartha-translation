translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. పొడవైన హీబ్రూ జాబితిని డ్యాష్‌లతో స్పష్టపరిచి, לְפָנָיו భావాన్ని సహజమైన వాక్యంగా మలిచాం; జాబితాలోని సభ్యులందరూ రాజు సమక్షంలో ఉన్నారనే మూల సంబంధం నిలుపబడింది.
