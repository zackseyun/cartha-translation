  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడాం. పొడవైన హీబ్రూ జాబితిని చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించాం; అరుదైన పదార్థాల విషయంలో మూలంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
