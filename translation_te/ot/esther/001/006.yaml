source:
  edition: WLC
  text: ח֣וּר כַּרְפַּ֣ס וּ/תְכֵ֗לֶת אָחוּז֙ בְּ/חַבְלֵי ב֣וּץ וְ/אַרְגָּמָ֔ן עַל גְּלִ֥ילֵי כֶ֖סֶף וְ/עַמּ֣וּדֵי שֵׁ֑שׁ מִטּ֣וֹת זָהָ֣ב וָ/כֶ֗סֶף עַ֛ל רִֽצְפַ֥ת בַּהַט וָ/שֵׁ֖שׁ וְ/דַ֥ר וְ/סֹחָֽרֶת׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/006.yaml
  text: There were hangings of white cotton and blue[a], fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl[c][b], and precious stones.
translation:
  language: te
  text: తెల్లని పత్తి, నీలిరంగు వస్త్రాల తెరలు[a] సన్నని నార, ఊదారంగు నూలు తాళ్లతో వెండి వలయాలకు[b], పాలరాతి స్తంభాలకు బిగించబడి ఉన్నాయి. బంగారు, వెండి విందు పడకలు[c] పాలరాయి, తెల్లరాయి, ముత్యపుచిప్ప, విలువైన రాళ్లతో చేసిన నేల[d] మీద ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీలిరంగు’ అనే పదం నీలి-ఊదా రంగును కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వెండి వలయాలు’కు బదులుగా ‘వెండి కడ్డీలు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం గుండ్రని లేదా చుట్టిన వెండి అమరికలను సాధారణంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఇవి సాధారణంగా నిద్రించడానికి ఉపయోగించే మంచాలు కావు; విందులో ఆనుకొని కూర్చోవడానికి లేదా పడుకోవడానికి ఉపయోగించే పడకలు.
    reason: cultural_note
  - marker: d
    text: నేలలో పేర్కొన్న పదార్థాల ఖచ్చిత గుర్తింపు అనిశ్చితం. ‘పాలరాయి, తెల్లరాయి, ముత్యపుచిప్ప, విలువైన రాళ్లు’ అనేవి సాధారణ పండిత గుర్తింపులు; కొందరు వీటిని ‘ఊదారాయి,’ ‘తెల్ల పాలరాయి,’ లేదా ‘ముదురు రాయి’ వంటి పదాలతో భిన్నంగా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּר כַּרְפַּס
  choice: తెల్లని పత్తి వస్త్రాలు
  rationale: חוּרను రంగుగా ‘తెల్లని’ అని, כַּרְפַּסను పత్తి వస్త్రంగా గ్రహించడం అలంకార వస్త్రాల సందర్భానికి సరిపోతుంది.
- source_word: תְכֵלֶת
  choice: నీలిరంగు వస్త్రాలు
  rationale: ఈ పదం విలాసవంతమైన నీలం లేదా నీలి-ఊదా రంగును సూచిస్తుంది; ప్రధాన పాఠ్యంలో సహజమైన ‘నీలిరంగు’ను ఉంచి, రంగు ఛాయలోని అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: חַבְלֵי בוּץ וְאַרְגָּמָן
  choice: సన్నని నారతోను ఊదారంగు దారంతోను చేసిన తాళ్లు
  rationale: בוּץ అత్యుత్తమ సన్నని నారను, אַרְגָּמָן ఊదారంగు విలాస వస్త్రదారాన్ని సూచిస్తాయి; חבליםను ఈ బిగింపు సందర్భంలో ‘తాళ్లు’గా అనువదించాం.
- source_word: גְּלִילֵי כֶסֶף
  choice: వెండి వలయాలు
  rationale: గుండ్రని లేదా చుట్టిన వెండి అమరికలను సూచించే పదం; తెరలను బిగించే సందర్భంలో ‘వలయాలు’ సహజం, అయితే ‘కడ్డీలు’ అనే అర్థం కూడా సాధ్యం.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: పాలరాతి స్తంభాలు
  rationale: ఇక్కడ שֵׁשׁ నారను కాక తెల్లని రాయిని సూచిస్తుంది; తెలుగు నిర్మాణ సందర్భంలో ‘పాలరాయి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: מִטּוֹת
  choice: విందు పరుపులు
  rationale: ఇవి నిద్రించే మంచాలు కాక, విందులో ఆనుకొని కూర్చోవడానికి లేదా పడుకోవడానికి ఉపయోగించే పరుపులు; ఆ సాంస్కృతిక భావాన్ని తెలిపేందుకు ‘విందు పరుపులు’ ఎంచుకున్నాం.
- source_word: רִצְפַת
  choice: నేల
  rationale: నిర్మించిన నేల ఉపరితలాన్ని సూచిస్తుంది; ‘మొజాయిక్’ అని నిర్దిష్టీకరించకుండా సరళమైన ‘నేల’ను వాడాం.
- source_word: בַּהַט וָשֵׁשׁ וְדַר וְסֹחָרֶת
  choice: పాలరాయి, తెల్లరాయి, ముత్యపుచిప్ప, విలువైన రాళ్లు
  rationale: ఈ అరుదైన రాతి/పదార్థ పదాల ఖచ్చిత గుర్తింపు వివాదాస్పదం. సాధారణ పండిత గుర్తింపులను పాఠ్యంలో ఇచ్చి, అనిశ్చితిని పాదసూచికలో స్పష్టంగా ఉంచాం.
