id: EST.1.2
reference: Esther 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יָּמִ֖ים הָ/הֵ֑ם כְּ/שֶׁ֣בֶת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֗וֹשׁ עַ֚ל כִּסֵּ֣א מַלְכוּת֔/וֹ אֲשֶׁ֖ר בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/002.yaml
  text: In those days[a], when King Ahasuerus sat on his royal throne, which was in Susa the citadel,
translation:
  language: te
  text: ఆ రోజుల్లో, అహష్వేరోషు రాజు షూషను దుర్గంలో[a] ఉన్న తన రాజసింహాసనం మీద కూర్చుని ఉన్నప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “షూషను రాజప్రాసాద-దుర్గంలో.”
    reason: బִּירָה అనేది సాధారణ కోటకన్నా రాజప్రాసాదం, పరిపాలనా భవనాలు ఉన్న పటిష్ఠ దుర్గ సముదాయాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: హీబ్రూ కథనాల్లో సాధారణంగా వచ్చే కాలసూచక ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ‘ఆ’ అనే నిర్దేశక భావాన్ని కూడా నిలుపుతుంది.
- source_word: כְּשֶׁבֶת
  choice: ఆసీనుడై ఉన్నప్పుడు
  rationale: כ + క్రియార్థక నామరూపం ఇక్కడ కాలసంబంధ ఉపవాక్యాన్ని ప్రవేశపెడుతుంది. రాజసింహాసన సందర్భంలో ‘ఆసీనుడై’ గౌరవప్రదంగానూ సహజంగానూ ఉంది.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజు
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించి, తెలుగులో సహజమైన క్రమంలో బిరుదును పేరుకు తరువాత ఉంచింది.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: తన రాజసింహాసనం మీద
  rationale: అక్షరార్థంగా ‘తన రాజ్యాధికారపు/రాజ్యపు సింహాసనం మీద.’ ‘తన రాజసింహాసనం’ అనేది స్వామ్యప్రత్యయాన్నీ రాజాధికార భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֲשֶׁר בְּשׁוּשַׁן
  choice: షూషను ... లో ఉన్న
  rationale: సంబంధవాచక ఉపవాక్యం సింహాసనం ఉన్న ప్రదేశాన్ని సూచిస్తుంది. హీబ్రూ స్థలనామమైన שׁוּשַׁן‌ను ‘షూషను’గా లిప్యంతరీకరించింది.
- source_word: הַבִּירָה
  choice: కోట
  rationale: בִּירָה ఇక్కడ రాజప్రాసాదం, పరిపాలనా కేంద్రం కలిగిన పటిష్ఠ దుర్గ సముదాయాన్ని సూచించగలదు. సాధారణ పాఠకులకు స్పష్టమైన ‘కోట’ను ప్రధాన పాఠంలో ఉంచి, విస్తృత భావాన్ని పాదసూచికలో తెలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనశైలికి తగిన గౌరవప్రదమైన భాష. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర కామాను నిలిపింది. ఇంగ్లీషు సంప్రదాయ రూపమైన ‘Susa’కు బదులుగా మూల హీబ్రూ שׁוּשַׁן‌కు దగ్గరైన ‘షూషను’ వాడింది.
