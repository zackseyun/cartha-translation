id: EST.1.12
reference: Esther 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּמָאֵ֞ן הַ/מַּלְכָּ֣ה וַשְׁתִּ֗י לָ/בוֹא֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ אֲשֶׁ֖ר בְּ/יַ֣ד הַ/סָּרִיסִ֑ים וַ/יִּקְצֹ֤ף הַ/מֶּ֨לֶךְ֙ מְאֹ֔ד וַ/חֲמָת֖/וֹ בָּעֲרָ֥ה בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/012.yaml
  text: But Queen Vashti refused to come at the king’s command by the hand of the eunuchs[a], and the king became very angry[b], and his wrath burned within him.
translation:
  language: te
  text: అయితే నపుంసకుల ద్వారా పంపిన రాజాజ్ఞ ప్రకారం రావడానికి రాణి వష్తి నిరాకరించింది.[a] దాంతో రాజు మిక్కిలి కోపగించాడు; అతని ఆగ్రహం అతనిలో మండింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నపుంసకుల చేతి ద్వారా.” అంటే రాజాజ్ఞను వారు ఆమెకు తెలియజేశారు.
    reason: lexical_alternative
  - marker: b
    text: “అతని ఉగ్రత అతనిలో మండింది” అని కూడా అనువదించవచ్చు. హీబ్రూ పాఠం కోపాన్ని అగ్నిగా చిత్రించే రూపకాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמָאֵן
  choice: నిరాకరించింది
  rationale: మానుకోవడం లేదా సున్నితంగా తిరస్కరించడం కంటే, ఉద్దేశపూర్వకంగా ఒప్పుకోకపోవడాన్ని ఈ క్రియ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמַּלְכָּה וַשְׁתִּי
  choice: రాణి వష్తి
  rationale: బిరుదునూ వ్యక్తిగత పేరునూ సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: לָבוֹא
  choice: రావడానికి
  rationale: రాజు పిలిపించిన సందర్భంలో בוא యొక్క సహజమైన సందర్భార్థం ‘రావడం’.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: రాజాజ్ఞ ప్రకారం
  rationale: דבר ఇక్కడ సాధారణ ‘మాట’ కాక రాజు ఇచ్చిన ఆదేశాన్ని సూచిస్తుంది; ‘ప్రకారం’ ఆ ఆజ్ఞకు విధేయంగా రావలసిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר בְּיַד הַסָּרִיסִים
  choice: నపుంసకుల ద్వారా పంపిన
  rationale: ‘చేతి ద్వారా’ అనే హీబ్రూ నుడికారం మధ్యవర్తిత్వం లేదా సమాచారాన్ని చేరవేయడాన్ని సూచిస్తుంది. సారిస్ అనే రాజసభ పదవికి ఉన్న శారీరక అర్థాన్ని అస్పష్టం చేయకుండా ‘నపుంసకులు’గా అనువదించాం.
- source_word: וַיִּקְצֹף מְאֹד
  choice: మిక్కిలి కోపగించాడు
  rationale: క్రియలోని తీవ్ర కోపాన్నీ מְאֹד ఇచ్చే బలాన్నీ గంభీరమైన, సహజ తెలుగు రూపంలో నిలుపుతుంది.
- source_word: וַחֲמָתוֹ בָּעֲרָה בוֹ
  choice: అతని ఆగ్రహం అతనిలో మండింది
  rationale: חֵמָה యొక్క తీవ్రతను ‘ఆగ్రహం’ తెలియజేస్తుంది; בער యొక్క అగ్ని రూపకాన్ని ‘మండింది’ నిలుపుతుంది; בוֹ ను అంతర్గత స్థితిగా ‘అతనిలో’ అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజసభ కథనానికి తగిన గంభీరతను ఉంచాం. మొదటి దీర్ఘ హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; ‘దాంతో’ కథనంలోని కారణ-ఫలిత సంబంధాన్ని తెలియజేస్తుంది. ప్రధాన పాఠంలో [a], [b] గుర్తులు రెండూ చేర్చబడ్డాయి.
