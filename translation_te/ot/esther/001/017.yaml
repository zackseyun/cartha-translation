  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יֵצֵ֤א דְבַר הַ/מַּלְכָּה֙ עַל כָּל הַ/נָּשִׁ֔ים לְ/הַבְז֥וֹת בַּעְלֵי/הֶ֖ן בְּ/עֵינֵי/הֶ֑ן בְּ/אָמְרָ֗/ם הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֡וֹשׁ אָמַ֞ר לְ/הָבִ֨יא אֶת וַשְׁתִּ֧י הַ/מַּלְכָּ֛ה לְ/פָנָ֖י/ו וְ/לֹא בָֽאָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/017.yaml
  text: For the queen’s matter will go out to all women, causing them to despise their husbands in their eyes, when they say, ‘King Ahasuerus said to bring Queen Vashti before him, but she did not come.’
translation:
  language: te
  text: 'ఎందుకంటే, రాణి విషయం స్త్రీలందరికీ తెలిసిపోతుంది. అప్పుడు వారు తమ భర్తలను తక్కువగా చూస్తారు. వారు ఇలా అంటారు: ‘అహష్వేరోషు రాజు వష్తి రాణిని తన ఎదుటికి తీసుకురమ్మని చెప్పాడు, కానీ ఆమె రాలేదు.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר הַמַּלְכָּה
  choice: రాణి విషయం
  rationale: דָּבָר ఇక్కడ రాణికి సంబంధించిన సంఘటన/విషయాన్ని సూచిస్తుంది; ‘ప్రవర్తన’ అని నిర్దిష్టం చేయకుండా మూలంలోని విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: יֵצֵא ... עַל כָּל הַנָּשִׁים
  choice: స్త్రీలందరికీ తెలిసిపోతుంది
  rationale: అక్షరార్థమైన ‘బయలుదేరుతుంది’ అనే భావాన్ని సహజ తెలుగులో సమాచారం అందరికీ వ్యాపించడంగా వ్యక్తం చేస్తుంది.
- source_word: לְהַבְזוֹת בַּעְלֵיהֶן בְּעֵינֵיהֶן
  choice: తమ భర్తలను తమ దృష్టిలో తృణీకరిస్తారు
  rationale: בזה యొక్క ‘నీచంగా చూడడం/తృణీకరించడం’ భావాన్నీ, בְּעֵינֵיהֶן అనే ‘వారి దృష్టిలో’ పదబంధాన్నీ నిలుపుతుంది.
- source_word: אָמַר לְהָבִיא
  choice: తీసుకురమ్మని చెప్పాడు
  rationale: ‘ఆజ్ఞాపించాడు’ అనే బలమైన అర్థాన్ని చేర్చకుండా, మూలంలోని אָמַר (‘చెప్పాడు’)ను ప్రతిబింబిస్తుంది.
- source_word: לְפָנָיו
  choice: తన ఎదుటికి
  rationale: రాజు సమక్షంలోకి తీసుకురావాలనే మూల భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభ కథనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని కారణసూచక నిర్మాణాన్ని, ప్రత్యక్ష ఉల్లేఖనాన్ని నిలుపుతూ, తెలుగులో సహజమైన వాక్యక్రమం వాడబడింది.
