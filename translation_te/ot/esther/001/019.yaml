source:
  edition: WLC
  text: אִם עַל הַ/מֶּ֣לֶךְ ט֗וֹב יֵצֵ֤א דְבַר מַלְכוּת֙ מִ/לְּ/פָנָ֔י/ו וְ/יִכָּתֵ֛ב בְּ/דָתֵ֥י פָֽרַס וּ/מָדַ֖י וְ/לֹ֣א יַעֲב֑וֹר אֲשֶׁ֨ר לֹֽא תָב֜וֹא וַשְׁתִּ֗י לִ/פְנֵי֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וּ/מַלְכוּתָ/הּ֙ יִתֵּ֣ן הַ/מֶּ֔לֶךְ לִ/רְעוּתָ֖/הּ הַ/טּוֹבָ֥ה מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/019.yaml
  text: 'If it seems good to the king[a], let a royal decree go out from before him and be written among the laws of Persia and Media, so that it may not be revoked: that Vashti is not to come before King Ahasuerus[c][b], and let the king give her royal position to another woman better than she.'
translation:
  language: te
  text: '“రాజుకు మంచిదనిపిస్తే[a], ఆయన సన్నిధి నుండి ఒక రాజాజ్ఞ వెలువడి, అది పారసీకుల, మాదీయుల చట్టాలలో లిఖించబడాలి; అది రద్దు చేయబడకూడదు[b]. ఆ ఆజ్ఞ ఇలా ఉండాలి: వష్తి అహష్వేరోషు రాజు సన్నిధికి రాకూడదు; రాజు ఆమె రాణి పదవిని[c] ఆమెకంటే మెరుగైన మరొక స్త్రీకి ఇవ్వాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజుకు సమ్మతమైతే.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అది మార్చబడకూడదు” లేదా “అది అతిక్రమించబడకూడదు.” హీబ్రూ నుడికారం ఆ ఆజ్ఞకు మార్పులేని స్థిరమైన చట్టబలం ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “ఆమె రాజరికం” లేదా “ఆమె రాణితనం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: రాజుకు మంచిదనిపిస్తే
  rationale: రాజు ఆమోదానికి వినయంగా ప్రతిపాదన చేసే రాజాస్థాన నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; טוב లోని ‘మంచి’ భావాన్ని కూడా నిలుపుతుంది.
- source_word: יֵצֵא דְבַר מַלְכוּת מִלְּפָנָיו
  choice: ఆయన సన్నిధి నుండి ఒక రాజాజ్ఞ వెలువడి
  rationale: דְבַר מַלְכוּת సాధారణ మాట కాక అధికారిక రాజాజ్ఞను సూచిస్తుంది. מִלְּפָנָיו లోని రాజాస్థాన భాషను ‘ఆయన సన్నిధి నుండి’ నిలుపుతుంది.
- source_word: וְיִכָּתֵב בְּדָתֵי פָרַס וּמָדַי
  choice: అది పారసీకుల, మాదీయుల చట్టాలలో లిఖించబడాలి
  rationale: ఆజ్ఞను అధికారిక న్యాయసంహితలో నమోదు చేయడాన్ని తెలియజేస్తూ, మూలంలోని పారసీక–మాదీయ క్రమాన్ని కాపాడుతుంది.
- source_word: וְלֹא יַעֲבוֹר
  choice: అది రద్దు చేయబడకూడదు
  rationale: ఈ న్యాయ సందర్భంలో ఆజ్ఞను తొలగించలేని లేదా ఉపసంహరించలేని స్థిరమైన చట్టబలాన్ని స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచింది.
- source_word: אֲשֶׁר לֹא תָבוֹא וַשְׁתִּי לִפְנֵי הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: వష్తి ఇక అహష్వేరోషు రాజు సన్నిధికి రాకూడదనీ
  rationale: ఆజ్ఞలోని నిషేధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ‘ఇక’ అనేది భవిష్యత్తులో ఆమె రావడాన్ని నిషేధించే భావాన్ని వ్యక్తం చేస్తుంది; ‘మళ్లీ’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: וּמַלְכוּתָהּ
  choice: ఆమె రాణి పదవిని
  rationale: ఇక్కడ מַלְכוּת ఒక భూభాగ రాజ్యాన్ని కాక వష్తి యొక్క రాచరిక హోదాను సూచిస్తుంది. ‘రాణి పదవి’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: יִתֵּן הַמֶּלֶךְ לִרְעוּתָהּ הַטּוֹבָה מִמֶּנָּה
  choice: ఆమెకంటే శ్రేష్ఠురాలైన మరొక స్త్రీకి రాజు ఇవ్వాలనీ
  rationale: רְעוּתָהּ యొక్క సంబంధార్థాన్ని ఈ ప్రత్యామ్నాయ నియామక సందర్భంలో ‘మరొక స్త్రీ’గా సహజంగా తెలియజేస్తుంది; הַטּוֹבָה מִמֶּנָּה లోని తులనను నైతికంగా మరీ నిర్దిష్టం చేయకుండా ‘శ్రేష్ఠురాలు’గా ఉంచుతుంది.
