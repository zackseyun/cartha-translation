translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజాస్థాన సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. చట్టపరమైన భావాన్ని స్పష్టంగా ఉంచుతూ, మూలంలోని అధికారిక నుడికారాన్ని సాధ్యమైనంతవరకు కాపాడాం.
