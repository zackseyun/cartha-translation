    issue: The word “ఇక” has been added in the prohibition concerning Vashti.
    rationale: The Hebrew says that Vashti is not to come before King Ahasuerus; it does not explicitly say “no longer” or “henceforth.” The added temporal implication should be removed.
  - severity: low
    issue: Footnote c is attached to “అహష్వేరోషు రాజు” rather than to “ఆమె రాణి పదవిని.”
    rationale: The note explains וּמַלְכוּתָהּ, Vashti's royal office, so its anchor must immediately follow the corresponding Telugu expression.
