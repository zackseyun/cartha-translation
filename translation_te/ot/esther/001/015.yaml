source:
  edition: WLC
  text: כְּ/דָת֙ מַֽה לַּ/עֲשׂ֔וֹת בַּ/מַּלְכָּ֖ה וַשְׁתִּ֑י עַ֣ל אֲשֶׁ֣ר לֹֽא עָשְׂתָ֗ה אֶֽת מַאֲמַר֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ בְּ/יַ֖ד הַ/סָּרִיסִֽים־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/015.yaml
  text: According to the law[c][b][a], what is to be done with Queen Vashti because she did not carry out the command of King Ahasuerus delivered by the eunuchs?
translation:
  language: te
  text: “నపుంసకుల[b] ద్వారా[a] తెలియజేసిన అహష్వేరోషు రాజు ఆజ్ఞను వష్తీ రాణి అమలు చేయలేదు కాబట్టి[c], చట్టం ప్రకారం ఆమెకు ఏమి చేయాలి?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నపుంసకుల చేత’; అక్షరార్థంగా, ‘నపుంసకుల చేతి ద్వారా.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదం విస్తృతార్థంలో రాజసభ అధికారులను కూడా సూచించవచ్చు; అయితే ‘నపుంసకులు’ అనేది మరింత ప్రత్యక్షమైన అనువాదం.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘అహష్వేరోషు రాజు ఆజ్ఞకు ఆమె లోబడలేదు కాబట్టి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדָת
  choice: చట్టం ప్రకారం
  rationale: ఎస్తేరు గ్రంథంలోని పారసీక రాజసభ సందర్భంలో דָּת సాధారణంగా చట్టం లేదా అధికారిక శాసనాన్ని సూచిస్తుంది. ‘చట్టం ప్రకారం’ అనే అనువాదం ప్రశ్నలోని న్యాయపరమైన స్వరాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מַה לַּעֲשׂוֹת
  choice: ఏమి చేయాలి
  rationale: ఈ క్రియారూపం తీసుకోవలసిన చర్య గురించి విచారణను సూచిస్తుంది. ‘ఏమి చేయాలి’ తెలుగులో సహజంగా ఉండి, నిర్ణయాత్మక న్యాయవిచారణ భావాన్ని తెలియజేస్తుంది.
- source_word: בַּמַּלְכָּה וַשְׁתִּי
  choice: వష్తి రాణికి
  rationale: ఈ సందర్భంలో עשה తో వచ్చిన ב ఒక వ్యక్తి విషయంలో తీసుకునే చర్యను సూచిస్తుంది. ‘వష్తి రాణికి ఏమి చేయాలి’ సహజమైన తెలుగు; ఆమెకు వ్యతిరేకంగా శిక్షే విధించాలనే భావాన్ని ముందుగానే చేర్చదు.
- source_word: עַל אֲשֶׁר לֹא עָשְׂתָה
  choice: అమలు చేయలేదు కాబట్టి
  rationale: עַל אֲשֶׁר చర్యకు కారణాన్ని ఇస్తుంది; עָשְׂתָה ప్రాథమికంగా ‘చేయడం’ అనే భావం కలిగి ఉంది. ఆజ్ఞతో కలిపి ‘అమలు చేయలేదు’ సహజంగా ఉండి, ప్రధాన పాఠంలో మరింత వ్యాఖ్యానాత్మకమైన ‘లోబడలేదు’ అనే పదాన్ని తప్పిస్తుంది.
- source_word: מַאֲמַר
  choice: ఆజ్ఞ
  rationale: రాజసందర్భంలో מַאֲמַר అధికారపూర్వకంగా పలికిన మాట లేదా ఆదేశాన్ని సూచిస్తుంది; ‘ఆజ్ఞ’ దాని అధికార బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజు
  rationale: రాజ బిరుదును తెలుగులో అనువదించి, వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בְּיַד הַסָּרִיסִים
  choice: నపుంసకుల ద్వారా తెలియజేసిన
  rationale: అక్షరార్థంగా ‘నపుంసకుల చేతి ద్వారా’ అనే హీబ్రూ నుడికారం మధ్యవర్తిత్వం లేదా ప్రతినిధిత్వాన్ని సూచిస్తుంది. ‘ద్వారా తెలియజేసిన’ ఆ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; סָרִיסִים కు ప్రత్యక్ష అర్థమైన ‘నపుంసకులు’ను ప్రధాన పాఠంలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయవిచారణ శైలిని ఉపయోగించాం. ప్రశ్న యొక్క అధికారిక స్వరాన్ని నిలుపుతూ, మూలంలోని ‘చేయలేదు’ అనే విస్తృత భావాన్ని ప్రధాన పాఠంలో ‘అమలు చేయలేదు’గా ఇచ్చి, ‘లోబడలేదు’ అనే సాధ్యమైన వ్యాఖ్యానాన్ని పాదసూచికలో ఉంచాం.
