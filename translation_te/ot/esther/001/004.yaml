  yaml_path: translation/ot/esther/001/004.yaml
  text: while he displayed the riches of the glory of his kingdom and the splendor of the honor of his greatness for many days—one hundred and eighty days.
translation:
  language: te
  text: అతడు తన రాజ్య మహిమ యొక్క సంపదను, తన గొప్పతనపు గౌరవపు శోభను అనేక రోజులు, అంటే నూట ఎనభై రోజులపాటు ప్రదర్శించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹשֶׁר כְּבוֹד מַלְכוּתוֹ
  choice: తన రాజ్య వైభవ సంపదను
  rationale: ‘సంపద’ (עֹשֶׁר), ‘వైభవం/మహిమ’ (כָּבוֹד), ‘రాజ్యం’ (מַלְכוּת) అనే భావాలను సహజమైన ఆధునిక తెలుగు పదబంధంలో నిలుపుతుంది.
- source_word: יְקָר תִּפְאֶרֶת גְּדוּלָּתוֹ
  choice: తన గొప్పతనపు ఘనమైన శోభను
  rationale: יְקָר లోని ఘనత/గౌరవ భావాన్నీ, תִּפְאֶרֶת లోని శోభ భావాన్నీ, גְּדוּלָּה లోని గొప్పతనాన్నీ అతిశయోక్తిని తగ్గించకుండా వ్యక్తం చేస్తుంది.
- source_word: בְּהַרְאֹתוֹ
  choice: అతడు ... ప్రదర్శించాడు
  rationale: హిబ్రూ కాలసంబంధ నిర్మాణాన్ని తెలుగులో సహజమైన ప్రధాన క్రియగా అందిస్తుంది; ముందరి వచనంతో ఉన్న కాలసంబంధం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: יָמִים רַבִּים שְׁמוֹנִים וּמְאַת יוֹם
  choice: నూట ఎనభై రోజులపాటు
  rationale: ‘అనేక రోజులు—నూట ఎనభై రోజులు’ అనే వివరణాత్మక నిర్మాణాన్ని అనవసర పునరుక్తి లేకుండా ఖచ్చిత కాలవ్యవధిగా సహజ తెలుగులో చెబుతుంది.
theological_decisions: []
