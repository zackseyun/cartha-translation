  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభా వైభవానికి తగిన గంభీరతను ఉంచుతూ, సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్య నిర్మాణం వాడబడింది.
