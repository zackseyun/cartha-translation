source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁבִיעִ֔י כְּ/ט֥וֹב לֵב הַ/מֶּ֖לֶךְ בַּ/יָּ֑יִן אָמַ֡ר לִ֠/מְהוּמָן בִּזְּתָ֨א חַרְבוֹנָ֜א בִּגְתָ֤א וַ/אֲבַגְתָא֙ זֵתַ֣ר וְ/כַרְכַּ֔ס שִׁבְעַת֙ הַ/סָּ֣רִיסִ֔ים הַ/מְשָׁ֣רְתִ֔ים אֶת פְּנֵ֖י הַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/010.yaml
  text: On the seventh day[a], when the king’s heart was merry with wine, he told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar[b], and Karkas—the seven eunuchs who attended King Ahasuerus—
translation:
  language: te
  text: ఏడవ రోజున, రాజు హృదయం ద్రాక్షామద్యంతో ఉల్లాసంగా ఉన్నప్పుడు[a], అహష్వేరోషు రాజు సన్నిధిలో సేవచేసే మెహూమాను, బిజ్తా, హర్బోనా, బిగ్తా, అబగ్తా, జేతరు, కర్కసు అనే ఏడుగురు నపుంసకులకు[b] ఇలా అన్నాడు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్రాక్షామద్యం వల్ల రాజు ఉల్లాసంగా ఉన్నప్పుడు.” హీబ్రూ నుడికారం ద్రాక్షామద్యం వల్ల రాజు హృదయం సంతోషించిందని చెబుతుంది; అతడు మత్తులో ఉన్నాడని స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: “నపుంసకులు” అనే పదం కొన్ని సందర్భాల్లో రాజసభాధికారులను విస్తృతంగా సూచించవచ్చు; ఇక్కడ దాని ప్రత్యక్షమైన పదార్థాన్ని ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: కాలాన్ని సూచించే హీబ్రూ పదబంధానికి సహజమైన తెలుగు సమానం. ‘విందు ఏడవ రోజున’ అని చెప్పడం ఈ వచనంలో లేని సమాచారాన్ని చేర్చుతుంది.
- source_word: כְּטוֹב לֵב הַמֶּלֶךְ בַּיָּיִן
  choice: రాజు హృదయం ద్రాక్షారసంతో ఉల్లాసంగా ఉన్నప్పుడు
  rationale: ద్రాక్షారసం వల్ల రాజు హృదయం సంతోషంగా ఉందనే హీబ్రూ నుడికారాన్ని నిలుపుతుంది; అతడు తప్పనిసరిగా మత్తులో ఉన్నాడని అతిగా వ్యాఖ్యానించదు.
- source_word: אָמַר
  choice: ఇలా అన్నాడు
  rationale: సాధారణ హీబ్రూ క్రియ ‘అన్నాడు’ అనే అర్థాన్నిస్తుంది. చెప్పబోయే మాట లేదా ఆజ్ఞ తదుపరి వచనంలో కొనసాగుతున్నందున తెలుగు వాక్య ప్రవాహానికి ‘ఇలా’ మరియు ముగింపు గీతను వాడాం; ఆజ్ఞ అనే భావాన్ని ఈ వచనంలోనే ముందుగా చేర్చలేదు.
- source_word: לִמְהוּמָן בִּזְּתָא חַרְבוֹנָא בִּגְתָא וַאֲבַגְתָא זֵתַר וְכַרְכַּס
  choice: మెహూమాను, బిజ్తా, హర్బోనా, బిగ్తా, అబగ్తా, జేతరు, కర్కసు
  rationale: వ్యక్తి పేర్లను హీబ్రూ ఉచ్చారణకు సమీపంగా, తెలుగులో చదవడానికి సహజంగా లిప్యంతరీకరించాం.
- source_word: שִׁבְעַת הַסָּרִיסִים
  choice: ఏడుగురు నపుంసకులు
  rationale: סָרִיסִים పదానికి ప్రత్యక్షమైన సాధారణ అర్థమైన ‘నపుంసకులు’ను నిలిపాం; రాజసభాధికారులు అనే విస్తృత అర్థసాధ్యతను పాదటిప్పణిలో సూచించాం.
- source_word: הַמְשָׁרְתִים אֶת פְּנֵי
  choice: సన్నిధిలో సేవచేసే
  rationale: ‘ముఖం ఎదుట సేవచేసే’ అనే రాజసభా నుడికారాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజు
  rationale: రాజబిరుదు మరియు పేరును తెలుగులో సహజమైన క్రమంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలవచనం తదుపరి వచనంలో కొనసాగుతుంది కాబట్టి చివర దీర్ఘగీత ఉంచాం; మూలంలో లేని ఆజ్ఞావిషయాన్ని ఈ వచనానికి జోడించలేదు. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
