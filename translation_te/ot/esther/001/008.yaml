translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. రాజసభా సందర్భాన్ని నిలుపుతూ అతిగా ప్రాచీనమైన పదజాలాన్ని నివారించాం. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట క్రమంగా ఉంచబడ్డాయి.
