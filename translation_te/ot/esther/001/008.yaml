  text: וְ/הַ/שְּׁתִיָּ֥ה כַ/דָּ֖ת אֵ֣ין אֹנֵ֑ס כִּי כֵ֣ן יִסַּ֣ד הַ/מֶּ֗לֶךְ עַ֚ל כָּל רַ֣ב בֵּית֔/וֹ לַ/עֲשׂ֖וֹת כִּ/רְצ֥וֹן אִישׁ וָ/אִֽישׁ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/008.yaml
  text: 'And the drinking was according to the law: there was no compulsion[c][b][a], for so the king had instructed every official of his household to do according to the desire of each man.'
translation:
  language: te
  text: త్రాగడం నియమం ప్రకారం ఉండేది:[a] బలవంతం ఏదీ లేదు.[b] ఎందుకంటే తన రాజగృహంలోని ప్రతి అధికారికి, ప్రతి మనిషి[c] ఇష్టప్రకారం చేయమని రాజు ఆదేశించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చట్టం ప్రకారం” లేదా “శాసనం ప్రకారం”; హీబ్రూ పదం చట్టం, శాసనం లేదా అధికారిక నియమాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “బలవంతం లేదు”; విందు సందర్భంలో త్రాగమని ఎవరినీ బలవంతం చేయలేదని దీని భావం.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో, “మనిషి మరియు మనిషి”; ఇది ప్రతి మనిషిని విడివిడిగా సూచించే పంపిణీ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁתִיָּה
  choice: త్రాగడం
  rationale: విందు మొత్తాన్ని కాకుండా, సందర్భంలోని పానక్రియను సూచించే నామవాచక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כַדָּת
  choice: నియమం ప్రకారం
  rationale: దాత్ అనే పదానికి చట్టం, శాసనం, నియమం అనే పరిధి ఉంది; ఇక్కడ విందులో పాటించాల్సిన పద్ధతి భావం ఉండటంతో ‘నియమం’ సహజంగా సరిపోతుంది, ఇతర భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֵין אֹנֵס
  choice: ఎవరినీ బలవంతం చేయలేదు
  rationale: బలవంతం లేకపోవడాన్ని స్పష్టమైన, సహజమైన తెలుగు వాక్యంగా వ్యక్తం చేస్తుంది; ఇక్కడ సందర్భానుసారం త్రాగమని ఎవరినీ బలవంతపెట్టలేదనే భావం.
- source_word: כִּי כֵן
  choice: ఎందుకంటే
  rationale: ముందున్న బలవంతం-లేని విధానానికి తరువాతి రాజాజ్ఞ కారణమని తెలుగులో సహజంగా కలుపుతుంది.
- source_word: יִסַּד
  choice: ఆదేశించాడు
  rationale: మూల ధాతువుకు ‘స్థాపించు/నిర్ణయించు’ అనే భావం ఉన్నా, రాజపరిపాలనా సందర్భంలో అమలు చేయాల్సిన ఆదేశాన్ని ఏర్పరచడం అనే ప్రయోగబలాన్ని వ్యక్తం చేస్తుంది.
- source_word: עַל כָּל רַב בֵּיתוֹ
  choice: తన రాజగృహంలోని అధికారులందరికీ
  rationale: రాజు గృహం లేదా రాజభవన నిర్వహణలో బాధ్యతగల ముఖ్యులను ఆధునిక పాఠకునికి స్పష్టంగా సూచిస్తుంది.
- source_word: לַעֲשׂוֹת כִּרְצוֹן
  choice: ఇష్టప్రకారం చేయాలని
  rationale: ప్రతి వ్యక్తి కోరుకున్న విధంగా వ్యవహరించాలనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: אִישׁ וָאִישׁ
  choice: ప్రతి ఒక్కరి
  rationale: హీబ్రూ పునరుక్త పంపిణీ ప్రయోగం ప్రతి వ్యక్తినీ విడివిడిగా సూచిస్తుంది; తెలుగులో ‘ప్రతి ఒక్కరి’ అదే పంపిణీ భావాన్ని సహజంగా తెలియజేస్తుంది.
