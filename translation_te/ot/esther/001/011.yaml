  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడింది. ‘రాజకిరీటంతో’ అని ఉంచి ధరించిందనే సాధ్యమైన భావాన్ని పాదసూచికలో తెలిపింది; ‘వివిధ ప్రజలు’ ద్వారా మూలంలోని బహువచనాన్ని పాఠకులకు అర్థమయ్యేలా నిలిపింది.
