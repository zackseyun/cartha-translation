  text: לְ֠/הָבִיא אֶת וַשְׁתִּ֧י הַ/מַּלְכָּ֛ה לִ/פְנֵ֥י הַ/מֶּ֖לֶךְ בְּ/כֶ֣תֶר מַלְכ֑וּת לְ/הַרְא֨וֹת הָֽ/עַמִּ֤ים וְ/הַ/שָּׂרִים֙ אֶת יָפְיָ֔/הּ כִּֽי טוֹבַ֥ת מַרְאֶ֖ה הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/011.yaml
  text: to bring Queen Vashti before the king with the royal crown[a], to show the peoples and the officials her beauty[c][b], for she was beautiful in appearance.
translation:
  language: te
  text: రాజకిరీటంతో[a] రాణి వష్టిని రాజు సమక్షానికి తీసుకురావాలని, ప్రజలకూ[b] అధికారులకూ ఆమె సౌందర్యాన్ని చూపించాలని, ఎందుకంటే ఆమె చూడడానికి అందంగా ఉండేది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాజకిరీటాన్ని ధరించి.’ హీబ్రూ ఉపసర్గకు అక్షరార్థంగా ‘తో’ అనే భావం ఉంది; సందర్భంలో కిరీటాన్ని ధరించి రావడం ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ప్రజలకు.’ హీబ్రూలో ఇది బహువచన రూపంలో ఉంది; సామ్రాజ్యానికి లోబడిన అనేక ప్రజాసమూహాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘ఆమె రూపం విషయమై మంచిదై ఉండేది’; ఇది శారీరక సౌందర్యాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: తీసుకువచ్చి
  rationale: בוא ధాతువు హిఫీల్ రూపంలో ‘వచ్చేలా చేయడం, తీసుకురావడం’ అనే భావాన్ని ఇస్తుంది. సందర్భానుసారంగా ‘తీసుకువచ్చి’ సహజంగా ఉంది.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: రాణి వష్టిని
  rationale: వ్యక్తి పేరుతో కూడిన రాజబిరుదును ఆధునిక తెలుగులో సహజమైన క్రమంలో ఉంచింది.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: రాజు సమక్షానికి
  rationale: לִפְנֵי అంటే ‘ఎదుట, సమక్షంలో.’ గమ్యాన్ని సూచించే తెలుగు నిర్మాణంలో ‘సమక్షానికి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: בְּכֶתֶר מַלְכוּת
  choice: రాజకిరీటంతో
  rationale: హీబ్రూ בְּ ఉపసర్గ ఇక్కడ తోడుగా ఉన్న వస్తువును సూచించగలదు. ‘రాజకిరీటంతో’ మూలంలోని అస్పష్టతను నిలుపుతుంది; ‘ధరించి’ అని పాఠ్యంలోనే నిర్దిష్టం చేయదు.
- source_word: לְהַרְאוֹת
  choice: చూపించాలని
  rationale: ראה హిఫీల్ రూపానికి ‘చూపడం’ అనే కారణార్థక భావం ఉంది. వాక్యంలోని ఉద్దేశాన్ని తెలుగులో ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: הָעַמִּים
  choice: వివిధ ప్రజలకు
  rationale: హీబ్రూలోని బహువచనాన్ని నిలుపుతూ, సామ్రాజ్యంలోని అనేక ప్రజాసమూహాల భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְהַשָּׂרִים
  choice: అధికారులకు
  rationale: שָׂרִים అనేది పాలకులు లేదా ఉన్నతాధికారులను సూచిస్తుంది. ‘అధికారులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, రాజకుమారులనే తప్పుదారి పట్టించే భావాన్ని నివారిస్తుంది.
- source_word: יָפְיָהּ
  choice: ఆమె సౌందర్యాన్ని
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయంతో ఉన్న నామవాచకానికి ఇది నేరమైన, గౌరవప్రదమైన అనువాదం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రాజు ఆమెను ప్రదర్శించాలనుకున్న కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: טוֹבַת מַרְאֶה
  choice: చూడడానికి అందంగా ఉండేది
  rationale: అక్షరార్థంగా ‘రూపంలో మంచిది’ అనే హీబ్రూ నుడికారాన్ని, బాహ్య సౌందర్యంపై దాని దృష్టిని నిలుపుతూ సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
