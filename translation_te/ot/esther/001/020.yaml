id: EST.1.20
reference: Esther 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נִשְׁמַע֩ פִּתְגָ֨ם הַ/מֶּ֤לֶךְ אֲשֶֽׁר יַעֲשֶׂה֙ בְּ/כָל מַלְכוּת֔/וֹ כִּ֥י רַבָּ֖ה הִ֑יא וְ/כָל הַ/נָּשִׁ֗ים יִתְּנ֤וּ יְקָר֙ לְ/בַעְלֵי/הֶ֔ן לְ/מִ/גָּד֖וֹל וְ/עַד קָטָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/020.yaml
  text: And when the king’s decree that he makes is heard throughout all his kingdom—for it is vast—all the women will give honor to their husbands[b][a], from great to small.
translation:
  language: te
  text: రాజు జారీచేసే ఆజ్ఞ[a] అతని రాజ్యమంతటా వినబడినప్పుడు—అది ఎంతో విశాలమైన రాజ్యం గనుక—గొప్పవారైనా అల్పులైనా, స్త్రీలందరూ తమ భర్తలను గౌరవిస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాజశాసనం.’ హీబ్రూ పదం అధికారిక రాజప్రకటనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తమ భర్తలపట్ల గౌరవం చూపిస్తారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַע
  choice: వినబడినప్పుడు
  rationale: నిఫల్ రూపంలోని కర్మణి భావాన్ని, తదనంతర ఫలితానికి కాలసంబంధ నేపథ్యంగా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: פִּתְגָם הַמֶּלֶךְ אֲשֶׁר יַעֲשֶׂה
  choice: రాజు జారీచేసే ఆజ్ఞ
  rationale: పారసీక రాజసభ సందర్భంలో פִּתְגָם అధికారిక రాజప్రకటనను సూచిస్తుంది; עשהతో కలిసిన భావాన్ని తెలుగులో సహజంగా ‘జారీచేసే’ అని అందించింది.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: అతని రాజ్యమంతటా
  rationale: ఆ ప్రకటన రాజ్యపు పూర్తి విస్తీర్ణంలో వినబడుతుందనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כִּי רַבָּה הִיא
  choice: అది ఎంతో విశాలమైన రాజ్యం గనుక
  rationale: సర్వనామం సూచించే ‘రాజ్యం’ను తెలుగులో స్పష్టంగా పునరుద్ఘాటించి, רַבָּה ఇక్కడ పరిమాణ విస్తృతిని సూచిస్తుందని చూపుతుంది.
- source_word: וְכָל הַנָּשִׁים
  choice: స్త్రీలందరూ
  rationale: హీబ్రూ బహువచన సాధారణ పదాన్ని అలాగే ఉంచుతుంది; తరువాతి ‘తమ భర్తలను’ అనే పదబంధం వివాహసంబంధ సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: יִתְּנוּ יְקָר
  choice: గౌరవిస్తారు
  rationale: ‘గౌరవం ఇస్తారు’ అనే మూలభాషా నుడికారాన్ని ఆధునిక తెలుగులో సహజమైన క్రియతో వ్యక్తపరుస్తూ, గౌరవ భావాన్ని కాపాడుతుంది.
- source_word: לְבַעְלֵיהֶן
  choice: తమ భర్తలను
  rationale: בעלకు యజమాని లేదా ప్రభువు అనే అర్థాలున్నా, ఈ గృహసంబంధ సందర్భంలో ‘భర్తలు’ అనే అర్థమే సముచితం.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: గొప్పవారు మొదలుకొని సామాన్యుల వరకు
  rationale: సామాజిక స్థాయిలోని మొత్తం పరిధిని సూచించే హీబ్రూ నుడికారాన్ని, ‘చిన్నవారు’ అనే అసహజ లేదా వయస్సుసంబంధ అపార్థం రాకుండా సహజ తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజసభ సందర్భానికి తగిన గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని కర్మణి నిర్మాణం, రాజ్య విస్తృతి, సామాజిక స్థాయుల సంపూర్ణ పరిధి నిలుపబడ్డాయి.
