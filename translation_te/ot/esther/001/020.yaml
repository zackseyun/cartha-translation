    issue: The phrase “గొప్పవారు మొదలుకొని సామాన్యుల వరకు” is somewhat interpretive for לְמִגָּדוֹל וְעַד קָטָן.
    rationale: “సామాన్యులు” specifically means ordinary/common people, whereas the Hebrew conventional pair denotes the full span from great/high to small/low. “గొప్పవారైనా అల్పులైనా” preserves that range more closely and naturally.
