base_translation:
  language: en
  yaml_path: translation/ot/esther/001/005.yaml
  text: And when these days were completed[a], the king gave a banquet for all the people who were present in Susa the citadel, from great to small, for seven days[d][c][b], in the court of the garden of the king’s palace.
translation:
  language: te
  text: ఈ రోజులు పూర్తయినప్పుడు, రాజు షూషను కోటలో ఉన్న ప్రజలందరికీ—గొప్పవారి నుండి చిన్నవారి వరకు[a]—రాజభవనపు[c] తోట ప్రాంగణంలో ఏడు రోజులపాటు విందు[b] ఏర్పాటు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ప్రతి సామాజిక స్థాయికి చెందినవారు; ‘గొప్పవారి నుండి అల్పుల వరకు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ పదం తరచుగా మద్యపానానికి ప్రాధాన్యమున్న విందును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘రాజభవనం’గా అనువదించిన పదాన్ని ‘మండపం’ లేదా ‘భవనం’ అని కూడా అనువదించవచ్చు; రాజసందర్భంలో ‘రాజభవనం’ సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאות הַיָּמִים הָאֵלֶּה
  choice: ఈ రోజులు ముగిసినప్పుడు
  rationale: ב + infinitive construct కాలసంబంధ పరిస్థితిని సూచిస్తుంది. ఈ అనువాదం మూలంలోని ‘ఈ రోజులు పూర్తయినప్పుడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: עָשָׂה ... מִשְׁתֶּה
  choice: విందు ఏర్పాటు చేశాడు
  rationale: עָשָׂה అనే సాధారణ క్రియ מִשְׁתֶּהతో కలిసి విందు చేయించడం లేదా ఏర్పాటు చేయడం అనే నుడికారార్థాన్ని ఇస్తుంది.
- source_word: לְכָל הָעָם הַנִּמְצְאִים
  choice: ఉన్న ప్రజలందరికీ
  rationale: הַנִּמְצְאִים ఇక్కడ ఒక ప్రదేశంలో ‘కనబడినవారు’ అనే అక్షరార్థం కంటే ‘ఉన్నవారు’ అనే సహజ భావాన్ని ఇస్తుంది; עָםను విస్తృతంగా ‘ప్రజలు’గా ఉంచాం.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: షూషను కోటలో
  rationale: בִּירָה బలపరచబడిన రాజకోట లేదా దుర్గప్రాంతాన్ని సూచిస్తుంది. ‘షూషను కోట’ హెబ్రీ అన్వయ నిర్మాణాన్ని సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: గొప్పవారి నుండి చిన్నవారి వరకు
  rationale: మూలంలోని జతపదాలను నిలుపుతూ, అన్ని స్థాయుల ప్రజలను చేర్చే సామాజిక నుడికారాన్ని కాపాడుతుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: בַּחֲצַר גִּנַּת בִּיתַן הַמֶּלֶךְ
  choice: రాజభవనపు తోట ప్రాంగణంలో
  rationale: హెబ్రీ సమాస శ్రేణిలోని ప్రాంగణం, తోట, రాజుకు చెందిన భవనం అనే స్థానిక సంబంధాలను సహజ తెలుగులో అందిస్తుంది; בִּיתַן యొక్క అర్థ అనిశ్చితిని పాదసూచికలో ఉంచాం.
