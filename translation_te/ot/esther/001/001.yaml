- from: అహష్వేరోషు కాలంలో జరిగింది ఇదే. భారతదేశం మొదలుకొని కూషు[a] వరకు నూట ఇరవై ఏడు పరగణాలను పాలించిన అహష్వేరోషు[b] ఇతడే—
  to: 'అహష్వేరోషు కాలంలో ఇలా జరిగింది: భారతదేశం నుండి కూషు[a] వరకు నూట ఇరవై ఏడు పరిపాలనా ప్రాంతాలను పాలించిన అహష్వేరోషు[b] ఇతడే—'
  rationale: The revision makes the Hebrew narrative opening idiomatic in modern standard Telugu, renders the ‘from … to’ range directly, and uses a broader administrative term for the 127 מְדִינוֹת. It retains the source’s repeated-name identification, the transliterated personal and regional names, both footnote anchors, and the trailing dash that indicates continuation into the next verse.
