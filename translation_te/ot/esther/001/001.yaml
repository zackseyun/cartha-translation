  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֖י בִּ/ימֵ֣י אֲחַשְׁוֵר֑וֹשׁ ה֣וּא אֲחַשְׁוֵר֗וֹשׁ הַ/מֹּלֵךְ֙ מֵ/הֹ֣דּוּ וְ/עַד כּ֔וּשׁ שֶׁ֛בַע וְ/עֶשְׂרִ֥ים וּ/מֵאָ֖ה מְדִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/001.yaml
  text: It happened in the days of Ahasuerus—the Ahasuerus who reigned from India to Cush[b][a], over one hundred twenty-seven provinces—
translation:
  language: te
  text: 'అహష్వేరోషు కాలంలో ఇలా జరిగింది: భారతదేశం నుండి కూషు[a] వరకు నూట ఇరవై ఏడు పరిపాలనా ప్రాంతాలను పాలించిన అహష్వేరోషు[b] ఇతడే—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కూషు’ అనేది ప్రాచీన ప్రాంతనామం; కొన్ని అనువాదాలు దీనిని ‘ఇథియోపియా’ అని పేర్కొంటాయి.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పేరును నేరుగా లిప్యంతరీకరించకుండా, చరిత్రలో గుర్తించబడిన పర్షియా రాజుతో సమీకరిస్తే ‘క్షెర్క్సెస్’ అని అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: జరిగింది ఇదే
  rationale: హీబ్రూ కథనారంభ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; మూలంలో లేని ‘ఇప్పుడు’ అనే కాలసూచక పదాన్ని చేర్చదు.
- source_word: בִּימֵי
  choice: కాలంలో
  rationale: ‘రోజుల్లో’ అనే పదశః రూపం కంటే రాజు పరిపాలించిన కాలాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు
  rationale: హీబ్రూ నామరూపాన్ని లిప్యంతరీకరిస్తుంది; చారిత్రక గుర్తింపైన ‘క్షెర్క్సెస్’ను ప్రధాన పాఠ్యంలో విధించదు.
- source_word: הוּא אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు ఇతడే
  rationale: పునరుక్త నామంతో కూడిన הוּא యొక్క నిర్దిష్టీకరణ బలాన్ని నిలుపుతుంది.
- source_word: הַמֹּלֵךְ
  choice: పాలించిన
  rationale: రాజు అధికార పరిధిని తెలిపే హీబ్రూ కృదంతాన్ని సహజమైన తెలుగు సంబంధార్థక రూపంలో అందిస్తుంది.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: భారతదేశం మొదలుకొని కూషు వరకు
  rationale: הֹדּוּకు సుపరిచితమైన ‘భారతదేశం’ను, כּוּשׁకు ఆధునిక దేశమైన ఇథియోపియాతో తప్పుగా సమీకరించకుండా ప్రాచీన ప్రాంతనామం ‘కూషు’ను ఉపయోగిస్తుంది.
- source_word: שֶׁבַע וְעֶשְׂרִים וּמֵאָה
  choice: నూట ఇరవై ఏడు
  rationale: హీబ్రూ సంఖ్యను సహజమైన తెలుగు క్రమంలో అందిస్తుంది.
- source_word: מְדִינָה
  choice: పరగణాలను
  rationale: పర్షియా సామ్రాజ్యంలోని పరిపాలనా విభాగాలను సాధారణ పాఠకునికి అర్థమయ్యే స్థిరమైన తెలుగు పదంతో సూచిస్తుంది.
