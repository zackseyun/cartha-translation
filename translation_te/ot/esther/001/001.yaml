translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనారంభానికి గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. వాక్యం తరువాతి వచనంలో కొనసాగుతుందని సూచించేందుకు చివర దీర్ఘవిరామం ఉంచబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
