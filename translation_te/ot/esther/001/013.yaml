  yaml_path: translation/ot/esther/001/013.yaml
  text: Then the king said to the wise men who knew the times—for this was the king’s procedure before all who knew law and judgment—
translation:
  language: te
  text: అప్పుడు రాజు కాలాల సంగతి తెలిసిన జ్ఞానులతో ఇలా అన్నాడు—ఎందుకంటే చట్టమును న్యాయమును తెలిసిన వారందరి సమక్షంలో ఇలాగే వ్యవహరించడం రాజు విధానం—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹדְעֵי הָעִתִּים
  choice: కాలాల గురించి తెలిసిన
  rationale: కాలాలు, సందర్భాలు, తగిన సమయాలు అనే విస్తృత భావాన్ని మూలంలోని అస్పష్టతతోనే ఉంచుతుంది.
- source_word: דְּבַר הַמֶּלֶךְ
  choice: రాజు విషయాలను ఉంచడం
  rationale: దָּבָר ఇక్కడ మాట, విషయం లేదా వ్యవహారాన్ని సూచించవచ్చు; సహజమైన తెలుగులో రాజు సంప్రదింపుల విధానాన్ని తెలియజేస్తుంది.
- source_word: דָּת וָדִין
  choice: ధర్మశాస్త్రం, న్యాయవిచారణ
  rationale: దָּת అనే చట్టం/శాసనం భావాన్నీ, דִּין అనే తీర్పు/న్యాయవిచారణ భావాన్నీ వేరుగా నిలుపుతుంది.
