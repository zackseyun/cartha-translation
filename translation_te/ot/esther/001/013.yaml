translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూల వాక్యం తదుపరి వచనంలో కొనసాగుతున్న నిర్మాణాన్ని డాష్ ద్వారా సూచించాం.
