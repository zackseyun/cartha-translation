- from: అప్పుడు రాజు కాలాల గురించి తెలిసిన జ్ఞానులతో మాట్లాడాడు—ఎందుకంటే ధర్మశాస్త్రం, న్యాయవిచారణ తెలిసిన వారందరి ఎదుట రాజు విషయాలను ఉంచడం ఆనవాయితీ.
