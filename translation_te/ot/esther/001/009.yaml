translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించింది. ‘రాజభవనం’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుండగా, మూలంలోని ‘ఇల్లు’ రూపాన్ని పాదటిప్పణిలో నిలిపింది.
