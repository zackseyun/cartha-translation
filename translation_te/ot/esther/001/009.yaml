id: EST.1.9
reference: Esther 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּ֚ם וַשְׁתִּ֣י הַ/מַּלְכָּ֔ה עָשְׂתָ֖ה מִשְׁתֵּ֣ה נָשִׁ֑ים בֵּ֚ית הַ/מַּלְכ֔וּת אֲשֶׁ֖ר לַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/009.yaml
  text: Queen Vashti also gave a feast for the women in the royal house that belonged to King Ahasuerus[a][b].
translation:
  language: te
  text: అహష్వేరోషు రాజుకు చెందిన రాజభవనంలో వష్తి రాణి కూడా స్త్రీల కోసం విందు ఏర్పాటు చేసింది[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విందుభోజనం.” ఇక్కడి హీబ్రూ పదం సాధారణంగా పానీయాలతో కూడిన విందును సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రాచరికపు ఇంటిలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: కూడా
  rationale: ముందటి వచనాల్లో వర్ణించిన రాజు విందుకు అదనంగా వష్తి రాణి చేసిన విందును సూచిస్తుంది.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: వష్తి రాణి
  rationale: తెలుగులో సహజమైన పేరు-బిరుదు క్రమాన్ని అనుసరిస్తూ వ్యక్తినామాన్ని లిప్యంతరీకరించింది.
- source_word: עָשְׂתָה
  choice: ఏర్పాటు చేసింది
  rationale: మూల క్రియకు అక్షరార్థంగా ‘చేసింది’ అనే భావం ఉన్నా, విందుతో కలిపి తెలుగులో ‘ఏర్పాటు చేసింది’ సహజంగా ఉంటుంది.
- source_word: מִשְׁתֵּה
  choice: విందు
  rationale: ఈ పదం పానీయాలతో కూడిన భోజన వేడుకను సూచించగలదు; ప్రధాన పాఠ్యంలో విస్తృతమైన, సహజమైన ‘విందు’ను ఎంచుకుంది.
- source_word: נָשִׁים
  choice: స్త్రీల కోసం
  rationale: వష్తి ఏర్పాటు చేసిన విందుకు హాజరైన వర్గాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: בֵּית הַמַּלְכוּת
  choice: రాజభవనంలో
  rationale: అక్షరార్థంగా ‘రాజ్యపు/రాచరికపు ఇల్లు’; సందర్భంలో రాజభవనాన్ని సూచించే సహజ తెలుగు రూపం.
- source_word: אֲשֶׁר לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజుకు చెందిన
  rationale: రాజభవనం రాజుకు చెందినదని తెలిపే సంబంధవాక్యంలోని స్వామ్య భావాన్ని నిలుపుతుంది.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా ఉండే తెలుగు లిప్యంతరీకరణ.
