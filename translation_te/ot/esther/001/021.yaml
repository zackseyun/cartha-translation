  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ నుడికారాన్ని సహజంగా అనువదించి, דָּבָר పదంలోని ‘విషయం/మాట’ వైవిధ్యాన్ని సందర్భానుసారంగా నిలిపాం.
