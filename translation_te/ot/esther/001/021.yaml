  yaml_path: translation/ot/esther/001/021.yaml
  text: The matter pleased the king and the officials[b][a], and the king did according to the word of Memucan.
translation:
  language: te
  text: ఆ విషయం రాజుకూ ఉన్నతాధికారులకూ నచ్చింది; రాజు మెమూకాను మాట ప్రకారం చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మెమూకాను మాట ప్రకారం”; సందర్భంలో, అతని సలహాకు అనుగుణంగా అని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב ... בְּעֵינֵי
  choice: నచ్చింది
  rationale: ‘కళ్లలో మంచిగా ఉండడం’ అనే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం; అనుకూలంగా తోచిందనే మూల భావాన్ని నిలుపుతుంది.
- source_word: הַדָּבָר
  choice: ఆ విషయం
  rationale: ముందు మెమూకాను చెప్పిన మాటను సూచించే విస్తృతార్థక పదం; ‘ప్రతిపాదన’ అని నిర్దిష్టం చేయకుండా మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భానికి తగిన నేరుగా ఉన్న అనువాదం.
- source_word: וְהַשָּׂרִים
  choice: అధికారులు
  rationale: పర్షియా రాజసభలోని ఉన్నతస్థాయి నాయకులను సూచిస్తుంది; ‘అధికారులు’ ఆధునిక పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עָשָׂה అనే సాధారణ క్రియకు సమీపమైన రూపం; తరువాతి పదబంధం చేసిన కార్యానికి ప్రమాణాన్ని తెలియజేస్తుంది.
- source_word: כִּדְבַר מְמוּכָן
  choice: మెమూకాను చెప్పిన మాట ప్రకారం
  rationale: ‘మెమూకాను మాట ప్రకారం’ అనే మూల నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తపరుస్తూ, అది సలహా మాత్రమే అని అతిగా వ్యాఖ్యానించదు.
- source_word: מְמוּכָן
  choice: మెమూకాను
  rationale: హీబ్రూ పేరును తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించిన రూపం.
