  text: וְ/הַשְׁקוֹת֙ בִּ/כְלֵ֣י זָהָ֔ב וְ/כֵלִ֖ים מִ/כֵּלִ֣ים שׁוֹנִ֑ים וְ/יֵ֥ין מַלְכ֛וּת רָ֖ב כְּ/יַ֥ד הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/007.yaml
  text: Drinks were served in vessels of gold, with vessels differing from vessel to vessel, and royal wine in abundance, according to the king’s bounty.
translation:
  language: te
  text: బంగారు పాత్రల్లో పానీయాలు వడ్డించారు. ఒక్కో పాత్ర ఒక్కో విధంగా ఉండేది. రాజభవనం నుండి వచ్చిన ద్రాక్షారసం రాజు ఔదార్యానికి తగినట్లు సమృద్ధిగా ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשְׁקוֹת
  choice: పానీయాలు వడ్డించారు
  rationale: హిఫీల్ infinitive construct ఇక్కడ విందులో పానీయం అందించడాన్ని సూచిస్తుంది; తెలుగులో సహజమైన కర్మణి ప్రయోగం.
- source_word: וְכֵלִים מִכֵּלִים שׁוֹנִים
  choice: ఒక్కో పాత్ర ఒక్కో విధంగా ఉండేది
  rationale: పాత్రలు ఒకదానికొకటి భిన్నంగా ఉన్నాయని చెప్పే హెబ్రీయ సమాసాన్ని సహజంగా, పునరుక్తి భావాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: וְיֵין מַלְכוּת
  choice: రాజవంశపు ద్రాక్షారసం
  rationale: מַלְכוּת అనే పదంలోని రాజరిక సంబంధాన్ని నిలుపుతుంది; సందర్భంలో יַיִן ద్రాక్షతో చేసిన మద్యపానీయాన్ని సూచిస్తున్నందున 'ద్రాక్షారసం' వాడబడింది.
- source_word: רָב
  choice: సమృద్ధిగా
  rationale: పరిమాణం విస్తారంగా ఉందనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: రాజు ఔదార్యానికి తగినట్లు
  rationale: అక్షరార్థంగా 'రాజు చేతికి తగినట్లు'; ఇక్కడ 'చేయి' రాజు వనరులు లేదా ఉదారతకు రూపకం. సందర్భానుసారంగా ఔదార్యాన్ని వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభ విందుకు తగిన గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని మూడు సమన్విత అంశాలను మూడు చిన్న వాక్యాలుగా ఇచ్చి పఠనసౌలభ్యం కల్పించబడింది.
