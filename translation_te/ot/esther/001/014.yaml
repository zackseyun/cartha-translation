id: EST.1.14
reference: Esther 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/קָּרֹ֣ב אֵלָ֗י/ו כַּרְשְׁנָ֤א שֵׁתָר֙ אַדְמָ֣תָא תַרְשִׁ֔ישׁ מֶ֥רֶס מַרְסְנָ֖א מְמוּכָ֑ן שִׁבְעַ֞ת שָׂרֵ֣י פָּרַ֣ס וּ/מָדַ֗י רֹאֵי֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ הַ/יֹּשְׁבִ֥ים רִאשֹׁנָ֖ה בַּ/מַּלְכֽוּת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/014.yaml
  text: And those closest to him were Carshena[a], Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan[b], the seven officials of Persia and Media who saw the king’s face and sat first in the kingdom.
translation:
  language: te
  text: అతనికి అత్యంత సన్నిహితులైనవారు కర్షెనా, షేతారు, అద్మాతా, తర్షీషు, మెరెసు, మర్సెనా, మెమూకాను. వీరు పారసీక, మాదీయ దేశాలకు చెందిన ఏడుగురు ఉన్నతాధికారులు; రాజు ముఖాన్ని చూసేవారు[a], రాజ్యంలో ప్రథమ స్థానాల్లో కూర్చునేవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రాజు ముఖాన్ని చూసేవారు.” ఇది రాజు సమక్షంలోకి నేరుగా ప్రవేశించే హక్కుగలవారిని సూచించే పారసీక రాజాస్థాన నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా, “రాజ్యంలో అత్యున్నత పదవులను నిర్వహించేవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקָּרֹב אֵלָיו
  choice: అతనికి అత్యంత సన్నిహితులైనవారు
  rationale: קָרוֹב రూపరీత్యా ఏకవచనమైనా, వెంట వచ్చే ఏడుగురి జాబితాను సమూహార్థంలో పరిచయం చేస్తోంది. అందువల్ల సహజమైన తెలుగు బహువచనం వాడబడింది.
- source_word: כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן
  choice: కర్షెనా, షేతారు, అద్మాతా, తర్షీషు, మెరెసు, మర్సెనా, మెమూకాను
  rationale: వ్యక్తుల పేర్లను అనువదించకుండా, మూలభాష ఉచ్చారణను అనుసరించేలా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: שִׁבְעַת שָׂרֵי
  choice: ఏడుగురు ఉన్నతాధికారులు
  rationale: שָׂרִים రాజసభలో ఉన్నత హోదాగల పాలకులను లేదా అధికారులను సూచిస్తుంది. వంశపారంపర్య రాజకుమారులనే భావం రాకుండా ‘ఉన్నతాధికారులు’ అని అనువదించబడింది.
- source_word: פָּרַס וּמָדַי
  choice: పారసీక, మాదీయ దేశాల
  rationale: ఈ పదబంధం ద్వంద్వ సామ్రాజ్యంలోని రెండు రాజకీయ-భౌగోళిక భాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో స్పష్టత కోసం ‘దేశాల’ చేర్చబడింది.
- source_word: רֹאֵי פְּנֵי הַמֶּלֶךְ
  choice: రాజు ముఖాన్ని చూసేవారు
  rationale: రాజు సమక్షంలోకి నేరుగా ప్రవేశించే ప్రత్యేక హక్కును తెలిపే రాజాస్థాన నుడికారంలోని స్పష్టమైన ముఖచిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదసూచికలో వివరించాం.
- source_word: הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת
  choice: రాజ్యంలో ప్రథమ స్థానాల్లో కూర్చునేవారు
  rationale: ఈ మాటలు రాజ్య పరిపాలనలో ప్రాధాన్యాన్ని, అత్యున్నత హోదాను సూచిస్తాయి. మూలంలోని కూర్చోవడం-హోదా రూపకాన్ని నిలిపి ఉంచుతూ తెలుగులో అర్థమయ్యేలా అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే రాజాస్థాన శైలి వాడబడింది. మూలంలోని సమూహార్థక నిర్మాణం సహజమైన తెలుగు బహువచనంగా ఇవ్వబడింది; ‘రాజు ముఖాన్ని చూడడం,’ ‘ప్రథమ స్థానాల్లో కూర్చోవడం’ అనే రెండు రాజాస్థాన రూపకాలు పాదసూచికల సహాయంతో నిలుపబడ్డాయి.
