- from: ఈ రోజే, రాణి మాటను విన్న పారసీక, మాదీయ ఉన్నతకుల స్త్రీలు[a] రాజు అధికారులందరితో అలాగే అంటారు[b]. అప్పుడు తిరస్కారమూ ఆగ్రహమూ విస్తరిస్తాయి[c].
  to: ఈ రోజే, రాణి విషయాన్ని విన్న పర్షియా, మాదీయ దేశాల ఉన్నతస్థాయి స్త్రీలు[a] దానిని రాజు అధికారులందరికీ చెబుతారు[b]; అప్పుడు తృణీకారమూ ఆగ్రహమూ చాలినంతగా కలుగుతాయి[c].
