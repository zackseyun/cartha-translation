  text: וְֽ/הַ/יּ֨וֹם הַ/זֶּ֜ה תֹּאמַ֣רְנָה שָׂר֣וֹת פָּֽרַס וּ/מָדַ֗י אֲשֶׁ֤ר שָֽׁמְעוּ֙ אֶת דְּבַ֣ר הַ/מַּלְכָּ֔ה לְ/כֹ֖ל שָׂרֵ֣י הַ/מֶּ֑לֶךְ וּ/כְ/דַ֖י בִּזָּי֥וֹן וָ/קָֽצֶף׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/018.yaml
  text: And today the noblewomen of Persia and Media who have heard the queen’s word will say the same to all the king’s officials[c][b][a], and there will be enough contempt and wrath.
translation:
  language: te
  text: ఈ రోజే, రాణి విషయాన్ని విన్న పర్షియా, మాదీయ దేశాల ఉన్నతస్థాయి స్త్రీలు[a] దానిని రాజు అధికారులందరికీ చెబుతారు[b]; అప్పుడు తృణీకారమూ ఆగ్రహమూ చాలినంతగా కలుగుతాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పర్షియా, మాదీయ దేశాల ప్రముఖ స్త్రీలు.’ హీబ్రూ పదం ఉన్నత హోదా గల స్త్రీలను సూచిస్తుంది; వారు తప్పనిసరిగా రాజకుమార్తెలని అర్థం కాదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘రాణి మాట/విషయం’ అని ఉంది. ఇది రాణి చెప్పినదాన్ని గానీ, రాణికి సంబంధించిన విషయం లేదా ఘటనను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: చివరి భాగం హీబ్రూలో అసంపూర్ణ వాక్యరూపంలో ఉంది; అక్షరార్థంగా, ‘మరియు చాలినంత తృణీకారమూ ఆగ్రహమూ’ అన్నట్లుగా ఉంటుంది. తెలుగు వాక్యాన్ని స్పష్టం చేయడానికి ‘కలుగుతాయి’ అని చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹם הַזֶּה
  choice: ఈ రోజే
  rationale: ఈ కాలసూచక పదబంధం తక్షణత్వాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘ఈ రోజే’ సహజంగా ఉండి స్వల్ప ఉద్ఘాటనను నిలుపుతుంది.
- source_word: תֹּאמַרְנָה
  choice: అంటారు
  rationale: אמר అనే క్రియకు సాధారణ అర్థం ‘చెప్పు/అను’; సందర్భంలో ఇది మెమూకాను ఊహిస్తున్న తదుపరి పరిణామాన్ని సూచిస్తుంది.
- source_word: שָׂרוֹת
  choice: ఉన్నతకుల స్త్రీలు
  rationale: ఈ పదం ఉన్నత స్థానం గల స్త్రీలను సూచిస్తుంది; వారు తప్పనిసరిగా రాజకుమార్తెలని సూచించకుండా వారి సామాజిక హోదాను తెలియజేస్తుంది.
- source_word: פָּרַס וּמָדַי
  choice: పారసీక, మాదీయ
  rationale: తెలుగు బైబిలు భాషలో గుర్తించదగిన ప్రామాణిక జాతి/ప్రాంత విశేషణ రూపాలు.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: విన్న
  rationale: పూర్తయిన చర్యను సూచించే హీబ్రూ రూపాన్ని తెలుగులో సహజమైన భూతకాల విశేషణ క్రియతో వ్యక్తం చేసింది.
- source_word: אֶת דְּבַר הַמַּלְכָּה
  choice: రాణి మాటను
  rationale: דבר లోని ‘మాట/విషయం/వ్యవహారం’ అనే విస్తృతార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది; సందర్భంలో అది రాణి చెప్పిన మాటను గానీ ఆమెకు సంబంధించిన ఘటనను గానీ సూచించవచ్చు.
- source_word: לְכֹל שָׂרֵי הַמֶּלֶךְ
  choice: రాజు అధికారులందరితో
  rationale: שׂרים రాజసభలో పాలనా లేదా ఉన్నత అధికార హోదా గల పురుషులను సూచిస్తుంది; ‘అధికారులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וּכְדַי
  choice: విస్తరిస్తాయి
  rationale: మూలంలోని ‘చాలు/సమృద్ధిగా’ అనే భావంతో కూడిన అసంపూర్ణ ఫలిత వాక్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి తరువాతి నామవాచకాలతో కలిపి విస్తరణ భావం ఇచ్చింది.
- source_word: בִּזָּיוֹן
  choice: తిరస్కారం
  rationale: అవమానకరంగా తృణీకరించడం లేదా చిన్నచూపు చూడడం అనే సామాజిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וָקָצֶף
  choice: ఆగ్రహం
  rationale: קצף లోని బలమైన కోప భావాన్ని గంభీరమైన, సహజమైన ఆధునిక తెలుగు పదంతో తెలియజేస్తుంది.
