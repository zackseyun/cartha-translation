language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מומכן לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/הַ/שָּׂרִ֔ים לֹ֤א עַל הַ/מֶּ֨לֶךְ֙ לְ/בַדּ֔/וֹ עָוְתָ֖ה וַשְׁתִּ֣י הַ/מַּלְכָּ֑ה כִּ֤י עַל כָּל הַ/שָּׂרִים֙ וְ/עַל כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֕ר בְּ/כָל מְדִינ֖וֹת הַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/016.yaml
  text: Then Memucan said before the king and the officials[a], “Queen Vashti has done wrong not against the king alone, but against all the officials and all the peoples who are in all the provinces of King Ahasuerus.”
translation:
  language: te
  text: 'అప్పుడు మెమూకాను రాజు, అధికారుల సమక్షంలో ఇలా అన్నాడు: “రాణి వష్తి రాజుకు మాత్రమే కాదు, అహష్వేరోషు రాజు యొక్క అన్ని సంస్థానాల్లో ఉన్న అధికారులందరికీ, ప్రజలందరికీ తప్పు చేసింది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: מומכן
  choice: మెమూకాను
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: రాజు మరియు అధికారుల సమక్షంలో మాట్లాడిన భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַשָּׂרִים
  choice: అధికారులు
  rationale: పర్షియా రాజసభలోని ఉన్నతస్థాయి పాలకులను సూచించే ఆధునిక, స్పష్టమైన పదం; ‘ప్రభువులు’ కంటే పరిపాలనా సందర్భానికి సరిపోతుంది.
- source_word: עָוְתָה
  choice: అన్యాయం చేసింది
  rationale: తప్పుగా లేదా వక్రంగా ప్రవర్తించడాన్ని సూచించే క్రియకు నైతిక బరువును నిలుపుతుంది; కేవలం వ్యక్తిగత అవమానంగా పరిమితం చేయదు.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: రాణి వష్తి
  rationale: తెలుగులో బిరుదును పేరుకు ముందు ఉంచడం సహజం.
- source_word: לֹא עַל הַמֶּלֶךְ לְבַדּוֹ ... כִּי עַל
  choice: రాజుకు మాత్రమే ... చేయలేదు; ... అన్యాయం చేసింది
  rationale: ‘రాజుకు మాత్రమే కాదు, ఇతరులకూ’ అనే సరిదిద్దే విస్తరణను సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: כָּל הָעַמִּים
  choice: ప్రజలందరికీ
  rationale: హీబ్రూ బహువచనం సామ్రాజ్యంలోని విభిన్న ప్రజాసమూహాలను సూచిస్తుంది; తెలుగులో ‘ప్రజలందరూ’ ఆ సమగ్ర భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מְדִינוֹת
  choice: సంస్థానాలు
  rationale: ఎస్తేరు గ్రంథంలోని సామ్రాజ్య పరిపాలనా ప్రాంతాలకు గౌరవప్రదమైన, సాంప్రదాయికంగా అర్థమయ్యే తెలుగు పదం.
- source_word: אֲשֶׁר בְּכָל מְדִינוֹת הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజు పాలించే అన్ని సంస్థానాల్లోని
  rationale: మూలంలోని ‘అహష్వేరోషు రాజుకు చెందిన అన్ని సంస్థానాల్లో ఉన్న’ భావాన్ని తెలుగులో సహజమైన సంబంధవాచక నిర్మాణంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రాజసభా కథనశైలి పాటించబడింది. మూలంలోని ‘రాజుకు మాత్రమే కాదు ... అందరికీ’ అనే వాదనాత్మక విస్తరణ నిలుపబడింది. ఈ పాఠంలో ప్రచురణకు అవసరమైన పాఠాంతర లేదా అర్థసందిగ్ధత పాదటిప్పణీ స్థాయిలో లేదు.
