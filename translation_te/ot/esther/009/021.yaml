  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/קַיֵּם֮ עֲלֵי/הֶם֒ לִ/הְי֣וֹת עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר וְ/אֵ֛ת יוֹם חֲמִשָּׁ֥ה עָשָׂ֖ר בּ֑/וֹ בְּ/כָל שָׁנָ֖ה וְ/שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/021.yaml
  text: to establish among them that they should observe the fourteenth day of the month Adar[a], and the fifteenth day of it, year after year,
translation:
  language: te
  text: వారు ప్రతి సంవత్సరమూ[a] అదారు నెల పద్నాలుగో రోజును, అలాగే అదే నెల పదిహేనో రోజును ఆచరించాలనే నియమాన్ని వారిపై స్థిరపరచడానికి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ప్రతి సంవత్సరం సంవత్సరం”; అంటే “ఏటేటా.”
    reason: హీబ్రూ పునరుక్తిలోని పంపిణీ భావాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: לְקַיֵּם עֲלֵיהֶם
  choice: నియమాన్ని వారిపై స్థిరపరచడానికి
  rationale: పియేల్ రూపంలోని קום ఇక్కడ ఒక ఆచరణను అధికారికంగా స్థిరపరచడం లేదా అమలులో ఉంచడం అనే భావాన్ని ఇస్తుంది; עֲלֵיהֶם‌లోని బాధ్యత విధించే ‘వారిపై’ అనే భావాన్ని కూడా అనువాదం నిలుపుతుంది.
- source_word: לִהְיוֹת עֹשִׂים
  choice: ఆచరించాలనే
  rationale: అక్షరార్థంగా ‘చేస్తూ ఉండడానికి’; పండుగకు సంబంధించిన రోజులను క్రమంగా పాటించడం అనే సందర్భార్థాన్ని ఆధునిక తెలుగులో ‘ఆచరించడం’ సహజంగా తెలియజేస్తుంది.
- source_word: אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: అదారు నెల పద్నాలుగో రోజును
  rationale: హీబ్రూ తేదీ ప్రయోగాన్ని తెలుగులో సహజమైన క్యాలెండరు క్రమంలో అందిస్తుంది.
- source_word: וְאֵת יוֹם חֲמִשָּׁה עָשָׂר בּוֹ
  choice: అలాగే అదే నెల పదిహేనో రోజును
  rationale: בּוֹ ముందుగా పేర్కొన్న అదారు నెలనే సూచిస్తుంది; ‘అదే నెల’ ఆ అన్వయాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: ప్రతి సంవత్సరమూ
  rationale: ‘సంవత్సరం సంవత్సరం’ అనే హీబ్రూ పంపిణీ పునరుక్తి ప్రతి ఏడాది క్రమం తప్పకుండా జరగాలనే భావాన్ని ఇస్తుంది; ‘ప్రతి సంవత్సరమూ’ ఆధునిక తెలుగులో సహజంగా అదే భావాన్ని అందిస్తుంది.
