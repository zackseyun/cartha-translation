  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఈ వాక్యం పూర్వ వచనంలోని మొర్దెకై రాసిన పత్రాల ఉద్దేశాన్ని కొనసాగించే అసమాపక నిర్మాణం కాబట్టి చివర కామా ఉంచబడింది.
