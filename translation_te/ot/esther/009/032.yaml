lexical_decisions:
- source_word: מַאֲמַר
  choice: ఆజ్ఞ
  rationale: ఇక్కడ ఇది సాధారణ మాటను కాక, పూరీము ఆచరణను అధికారపూర్వకంగా స్థిరపరిచే ఎస్తేరు ఆదేశాన్ని సూచిస్తుంది.
- source_word: אֶסְתֵּר
  choice: ఎస్తేరు
  rationale: తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: קִיַּם
  choice: స్థిరపరచింది
  rationale: దేనినైనా నిలిచేలా చేయడం లేదా అధికారికంగా స్థాపించడం అనే క్రియ భావాన్ని, ఈ పరిపాలనా సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: דִּבְרֵי הַפֻּרִים הָאֵלֶּה
  choice: ఈ పూరీము ఆచరణలకు సంబంధించిన విషయాలను
  rationale: דִּבְרֵי అనేది కేవలం పలికిన మాటలనే కాక విషయాలు లేదా ఏర్పాట్లను కూడా సూచించగలదు. సందర్భం పూరీము ఆచరణకు సంబంధించిన నిబంధనలు లేదా వ్యవహారాల గురించి కాబట్టి ఈ రూపం స్పష్టంగా, సహజంగా ఉంది.
- source_word: הַפֻּרִים
  choice: పూరీము
  rationale: పండుగ ప్రత్యేక నామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో నిలిపాం.
- source_word: וְנִכְתָּב
  choice: అది ... రాయబడింది
  rationale: హీబ్రూ నిఫల్ క్రియలోని కర్మణి భావాన్ని నేరుగా నిలిపాం; కర్తను మూలపాఠం పేర్కొనదు.
- source_word: בַּסֵּפֶר
  choice: గ్రంథంలో
  rationale: סֵפֶר గ్రంథం, చుట్ట, లేదా లిఖిత నమోదు అనే అర్థాలను ఇవ్వగలదు. నిర్దిష్ట గ్రంథం ఏదో వచనం చెప్పనందున దానిని మరింత నిర్దిష్టం చేయలేదు.
