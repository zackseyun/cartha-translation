source:
  edition: WLC
  text: וּ/בִ/שְׁנֵים֩ עָשָׂ֨ר חֹ֜דֶשׁ הוּא חֹ֣דֶשׁ אֲדָ֗ר בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֥ר יוֹם֙ בּ֔/וֹ אֲשֶׁ֨ר הִגִּ֧יעַ דְּבַר הַ/מֶּ֛לֶךְ וְ/דָת֖/וֹ לְ/הֵעָשׂ֑וֹת בַּ/יּ֗וֹם אֲשֶׁ֨ר שִׂבְּר֜וּ אֹיְבֵ֤י הַ/יְּהוּדִים֙ לִ/שְׁל֣וֹט בָּ/הֶ֔ם וְ/נַהֲפ֣וֹךְ ה֔וּא אֲשֶׁ֨ר יִשְׁלְט֧וּ הַ/יְּהוּדִ֛ים הֵ֖מָּה בְּ/שֹׂנְאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/001.yaml
  text: 'In the twelfth month[a], that is, the month Adar, on the thirteenth day of it, when the king’s word and his decree were to be carried out, on the day when the enemies of the Jews had hoped to rule over them, the opposite happened: the Jews themselves ruled over those who hated them.'
translation:
  language: te
  text: 'పన్నెండవ నెలలో, అంటే అదారు నెలలో, ఆ నెల పదమూడవ రోజున, రాజు మాటనూ అతని శాసనాన్నీ అమలు చేయాల్సిన సమయం వచ్చినప్పుడు—యూదుల శత్రువులు వారిపై ఆధిపత్యం చెలాయించాలని ఆశించిన ఆ రోజున—పరిస్థితి తారుమారైంది[a]: యూదులే తమను ద్వేషించినవారిపై ఆధిపత్యం చెలాయించారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది తారుమారైంది” లేదా “అది తిరగబడింది.”
    reason: וְנַהֲפוֹךְ הוּא అనే హీబ్రూ నుడికారానికి సాధ్యమైన ప్రత్యామ్నాయ అనువాదాలను చూపిస్తుంది.
lexical_decisions:
- source_word: וּבִשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: పన్నెండవ నెలలో
  rationale: వావ్ కథన అనుసంధానాన్ని తెలుగులో ప్రత్యేకంగా ‘ఇప్పుడు’ అని చేర్చకుండా, సహజమైన కాలారంభంతో వ్యక్తం చేసింది.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: అంటే అదారు నెలలో
  rationale: పన్నెండవ నెలను గుర్తించే వివరణాత్మక సమానాధికార నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: ఆ నెల పదమూడవ రోజున
  rationale: ప్రత్యయం సూచించే నెలను స్పష్టంగా ఉంచుతూ, సహజమైన తెలుగు పదబంధాన్ని వాడింది.
- source_word: אֲשֶׁר הִגִּיעַ דְּבַר הַמֶּלֶךְ וְדָתוֹ לְהֵעָשׂוֹת
  choice: రాజు మాటనూ అతని శాసనాన్నీ అమలు చేయాల్సిన సమయం వచ్చినప్పుడు
  rationale: הִגִּיעַ లోని ‘చేరింది/వచ్చింది’ భావాన్ని అమలు సమయం రావడంగా సందర్భానుసారంగా తెలిపి, דְּבַר మరియు דָת మధ్య ఉన్న ‘మాట’–‘శాసనం’ భేదాన్ని నిలిపింది.
- source_word: שִׂבְּרוּ
  choice: ఆశించిన
  rationale: ఈ క్రియలోని నిరీక్షణ లేదా ఆశ భావాన్ని కథనంలోని వ్యంగ్యాత్మక మలుపుకు అనుగుణంగా నిలిపింది.
- source_word: לִשְׁלֹט בָּהֶם
  choice: వారిపై ఆధిపత్యం చెలాయించాలని
  rationale: שׁלט సూచించే అధికారపూర్వక పైచేయి లేదా ఆధిపత్య భావాన్ని ‘పాలించు’ కంటే ఈ శత్రుత్వ సందర్భంలో స్పష్టంగా తెలిపింది.
- source_word: וְנַהֲפוֹךְ הוּא
  choice: పరిస్థితి తారుమారైంది
  rationale: మూలంలోని నాటకీయ ప్రతికూల మలుపును సహజంగా తెలియజేస్తూ, అది ఎలా సంభవించిందనే విషయాన్ని అదనంగా నిర్ణయించదు.
- source_word: אֲשֶׁר יִשְׁלְטוּ הַיְּהוּדִים הֵמָּה
  choice: యూదులే ... ఆధిపత్యం చెలాయించారు
  rationale: הֵמָּה లోని వ్యతిరేక ఉద్ఘాటనను తెలుగు ‘యూదులే’ ద్వారా కాపాడింది.
- source_word: בְּשֹׂנְאֵיהֶם
  choice: తమను ద్వేషించినవారిపై
  rationale: కృదంతంలోని క్రియాత్మక ‘ద్వేషించు’ భావాన్ని సాధారణ ‘శత్రువులు’ అనే నామవాచకంలో కలిపివేయకుండా నిలిపింది.
