translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ఆజ్ఞాత్మక/నియమాత్మక సందర్భాన్ని తెలుగులో స్పష్టంగా చూపేందుకు ‘ఆచరించబడాలి’, ‘తొలగిపోకూడదు’ రూపాలు ఎంచుకున్నాం. హీబ్రూ పంపిణీ పునరుక్తిని ప్రధాన పాఠ్యంలో ‘తరతరాల్లో/ప్రతి’ ద్వారా సహజీకరించి, దాని రూపాన్ని పాదటిప్పణిలో చూపించాం.
