revisions:
- from: ఈ రోజులు తరతరాల్లో, ప్రతి కుటుంబంలో, ప్రతి సంస్థానంలో, ప్రతి పట్టణంలో జ్ఞాపకం చేసుకొని ఆచరించబడాలి.[a][b] ఈ పూరీము రోజులు యూదుల మధ్య నుండి తొలగిపోకూడదు; వాటి జ్ఞాపకం వారి సంతతివారిలో అంతరించిపోకూడదు.[c]
  to: ఈ రోజులు తరతరాల్లో, ప్రతి కుటుంబంలో, ప్రతి పరిపాలనా ప్రాంతంలో, ప్రతి పట్టణంలో స్మరించబడి ఆచరించబడతాయి.[a][b] ఈ పూరీము దినాలు యూదులలోనుండి తొలగిపోవు; వాటి జ్ఞాపకం వారి సంతతినుండి అంతరించిపోదు.[c]
  rationale: క్రియారూపాలను మూలంలోని ప్రకటనాత్మక స్వరానికి అనుగుణంగా సవరించాం; పరిపాలనా పదాన్ని స్పష్టం చేశాం; మరియు c పాదటిప్పణిలో ఉన్న విరుద్ధార్థాన్ని సరిచేశాం. పంపిణీ పునరుక్తి, పూరీము పేరు, యూదులలో పండుగ నిరంతరత, వారి సంతతిలో దాని జ్ఞాపకం నిలిచే భావం అన్నీ నిలుపబడ్డాయి.
