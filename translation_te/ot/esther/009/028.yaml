source:
  edition: WLC
  text: וְ/הַ/יָּמִ֣ים הָ֠/אֵלֶּה נִזְכָּרִ֨ים וְ/נַעֲשִׂ֜ים בְּ/כָל דּ֣וֹר וָ/ד֗וֹר מִשְׁפָּחָה֙ וּ/מִשְׁפָּחָ֔ה מְדִינָ֥ה וּ/מְדִינָ֖ה וְ/עִ֣יר וָ/עִ֑יר וִ/ימֵ֞י הַ/פּוּרִ֣ים הָ/אֵ֗לֶּה לֹ֤א יַֽעַבְרוּ֙ מִ/תּ֣וֹךְ הַ/יְּהוּדִ֔ים וְ/זִכְרָ֖/ם לֹא יָס֥וּף מִ/זַּרְעָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/028.yaml
  text: And these days are remembered and observed in every generation[a], every family, every province, and every city; and these days of Purim shall not pass away from among the Jews[c][b], and their remembrance shall not cease from their offspring.
translation:
  language: te
  text: ఈ రోజులు తరతరాల్లో, ప్రతి కుటుంబంలో, ప్రతి పరిపాలనా ప్రాంతంలో, ప్రతి పట్టణంలో స్మరించబడి ఆచరించబడతాయి.[a][b] ఈ పూరీము దినాలు యూదులలోనుండి తొలగిపోవు; వాటి జ్ఞాపకం వారి సంతతినుండి అంతరించిపోదు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్మరించబడి ఆచరణలో పాటించబడతాయి.’ ‘ఆచరించబడతాయి’ అని అనువదించిన హీబ్రూ క్రియకు అక్షరార్థంగా ‘చేయబడతాయి’ అని అర్థం; ఇక్కడ అది పండుగను ఆచరణలో నిర్వహించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థ పునరుక్తిని ప్రతిబింబిస్తూ: ‘తరం తరువాత తరంలో, కుటుంబం తరువాత కుటుంబంలో, పరిపాలనా ప్రాంతం తరువాత పరిపాలనా ప్రాంతంలో, పట్టణం తరువాత పట్టణంలో.’ హీబ్రూలో పంపిణీ భావాన్ని నొక్కిచెప్పడానికి ఏకవచన నామవాచకాలు పునరుక్తమయ్యాయి.'
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘వాటి జ్ఞాపకం వారి వంశస్థులనుండి అంతరించిపోదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְכָּרִים וְנַעֲשִׂים
  choice: జ్ఞాపకం చేసుకొని ఆచరించబడాలి
  rationale: మొదటి క్రియ ఈ రోజులను జ్ఞాపకంలో ఉంచడాన్ని, అక్షరార్థంగా ‘చేయబడే’ రెండవ క్రియ పండుగను ఆచరణలో పాటించడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేందుకు రెండింటినీ కలిపి ఈ విధంగా ఇచ్చాం.
- source_word: בְּכָל דּוֹר וָדוֹר
  choice: తరతరాల్లో
  rationale: పునరుక్త ఏకవచనం ప్రతి వరుస తరాన్నీ కలుపుకొనే పంపిణీ భావాన్ని ఇస్తుంది; ‘తరతరాల్లో’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפָּחָה וּמִשְׁפָּחָה
  choice: ప్రతి కుటుంబంలో
  rationale: హీబ్రూ పునరుక్తి ‘ఒక్కొక్క కుటుంబంలో’ అనే పంపిణీ ప్రాధాన్యాన్ని సూచిస్తుంది.
- source_word: מְדִינָה וּמְדִינָה
  choice: ప్రతి సంస్థానంలో
  rationale: ఎస్తేరు గ్రంథంలోని పారసీక సామ్రాజ్య పరిపాలనా ప్రాంతాన్ని సూచించేందుకు ‘సంస్థానం’ అనువైన గౌరవప్రద తెలుగు పదం.
- source_word: וְעִיר וָעִיר
  choice: ప్రతి పట్టణంలో
  rationale: పునరుక్త ఏకవచనంలోని పంపిణీ భావాన్ని ‘ప్రతి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְמֵי הַפּוּרִים
  choice: పూరీము రోజులు
  rationale: పండుగ పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, హీబ్రూ నిర్మాణంలోని ‘రోజులు’ భావాన్ని నిలిపాం.
- source_word: לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים
  choice: యూదుల మధ్య నుండి తొలగిపోకూడదు
  rationale: עבר తో מִתּוֹךְ కలయిక సమాజం నుండి కనుమరుగవడం లేదా ఆచారంగా నిలిచిపోవడం అనే భావాన్ని ఇస్తుంది; ‘తొలగిపోకూడదు’ మూల రూపకాన్ని, గంభీర స్వరాన్ని నిలుపుతుంది.
- source_word: וְזִכְרָם
  choice: వాటి జ్ఞాపకం
  rationale: సర్వనామ ప్రత్యయం పూరీము రోజులను సూచిస్తుంది; తెలుగులో నిర్జీవ బహువచనానికి ‘వాటి’ సహజం.
- source_word: לֹא יָסוּף מִזַּרְעָם
  choice: వారి సంతతివారిలో అంతరించిపోకూడదు
  rationale: יסוף ‘ముగియడం/నిలిచిపోవడం’ అనే భావాన్ని, זרע ఇక్కడ వంశస్థులను సూచించడాన్ని ఈ ఎంపిక సహజ తెలుగులో తెలియజేస్తుంది.
