  to: యూదులు తమ శత్రువుల నుండి ఉపశమనం పొందిన రోజులను, వారికి దుఃఖం సంతోషంగా, శోకం పండుగ రోజుగా[b] మారిన నెలను, విందు, సంతోష దినాలుగా, ఒక వ్యక్తి తన సహచరునికి భాగాలు[c] పంపే దినాలుగా[a], పేదలకు కానుకలు ఇచ్చే దినాలుగా ఆచరించాలని.
  rationale: సవరణ మూలంలోని వాక్యనిర్మాణం మరియు విభజనాత్మక ‘ఒక వ్యక్తి తన సహచరునికి’ భావాన్ని కాపాడుతుంది. సందర్భం నుంచి ఊహించిన ‘చెప్పాడు’ను తొలగించి, מָנוֹత్‌కు ఉన్న సాధారణ ‘భాగాలు’ అనే అర్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ఆహార-సంబంధిత సాంస్కృతిక వివరణను పాదటిప్పణికి పరిమితం చేసింది. అన్ని పాదటిప్పణి గుర్తులు వాటి సంబంధిత పదబంధాల వద్ద ఉన్నాయి.
