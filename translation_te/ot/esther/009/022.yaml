source:
  edition: WLC
  text: כַּ/יָּמִ֗ים אֲשֶׁר נָ֨חוּ בָ/הֶ֤ם הַ/יְּהוּדִים֙ מֵ/א֣וֹיְבֵי/הֶ֔ם וְ/הַ/חֹ֗דֶשׁ אֲשֶׁר֩ נֶהְפַּ֨ךְ לָ/הֶ֤ם מִ/יָּגוֹן֙ לְ/שִׂמְחָ֔ה וּ/מֵ/אֵ֖בֶל לְ/י֣וֹם ט֑וֹב לַ/עֲשׂ֣וֹת אוֹתָ֗/ם יְמֵי֙ מִשְׁתֶּ֣ה וְ/שִׂמְחָ֔ה וּ/מִשְׁל֤וֹחַ מָנוֹת֙ אִ֣ישׁ לְ/רֵעֵ֔/הוּ וּ/מַתָּנ֖וֹת לָֽ/אֶבְיוֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/022.yaml
  text: as the days on which the Jews had rest from their enemies[a], and as the month that had been turned for them from sorrow to gladness and from mourning to a good day, to make them days of feasting and gladness, and of sending portions, each man to his neighbor[c][b], and gifts to the poor.
translation:
  language: te
  text: యూదులు తమ శత్రువుల నుండి ఉపశమనం పొందిన రోజులను, వారికి దుఃఖం సంతోషంగా, శోకం పండుగ రోజుగా[b] మారిన నెలను, విందు, సంతోష దినాలుగా, ఒక వ్యక్తి తన సహచరునికి భాగాలు[c] పంపే దినాలుగా[a], పేదలకు కానుకలు ఇచ్చే దినాలుగా ఆచరించాలని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఒక పురుషుడు తన సహచరునికి.’ ఇది పంపిణీ భావాన్ని తెలిపే హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మంచి రోజుగా’; అంటే పండుగ లేదా వేడుక రోజుగా.
    reason: lexical_alternative
  - marker: c
    text: ‘భాగాలు’ అనే మాట పండుగ సందర్భంగా పంపే ఆహార భాగాలను లేదా ఆహార కానుకలను సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: נָחוּ
  choice: ఉపశమనం పొందిన
  rationale: נוח ఇక్కడ శత్రువుల బెడద నుండి విశ్రాంతి లేదా ఊరట పొందడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఉపశమనం పొందిన’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: מֵאֹיְבֵיהֶם
  choice: తమ శత్రువుల నుండి
  rationale: מִן వియోగం లేదా విముక్తి మూలాన్ని సూచిస్తుంది; ‘నుండి’ మూలంలోని సంబంధాన్ని నిలుపుతుంది.
- source_word: נֶהְפַּךְ
  choice: మారిన
  rationale: הפך యొక్క నిఫాల్ రూపం జరిగిన పరివర్తనను సూచిస్తుంది; తెలుగులో ‘మారిన’ సహజంగా ఉండి, ఆ తిరుగుబాటును కాదు, పరిస్థితి తారుమారైన భావాన్ని తెలియజేస్తుంది.
- source_word: יָגוֹן
  choice: దుఃఖం
  rationale: ఈ పదం లోతైన విచారాన్ని సూచిస్తుంది; ‘సంతోషం’తో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שִׂמְחָה
  choice: సంతోషం / సంతోషాలు
  rationale: సందర్భంలో ఇది పండుగ ఆనందాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో సహజత్వం కోసం తగిన సంఖ్యారూపాలు వాడబడ్డాయి.
- source_word: אֵבֶל
  choice: శోకం
  rationale: אֵבֶל బహిరంగంగా వ్యక్తమయ్యే దుఃఖం లేదా విలాప స్థితిని సూచిస్తుంది; యָגוֹןకు భిన్నమైన ఛాయను ‘శోకం’ నిలుపుతుంది.
- source_word: לְיוֹם טוֹב
  choice: పండుగ రోజుగా
  rationale: అక్షరార్థం ‘మంచి రోజు’; సందర్భంలోని విందు, సంతోషాల కారణంగా తెలుగులో ‘పండుగ రోజు’ దాని ప్రయోజనార్థాన్ని సహజంగా తెలియజేస్తుంది. అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לַעֲשׂוֹת אוֹתָם
  choice: ఆ రోజులను … ఆచరించాలని
  rationale: అక్షరార్థంగా ‘వాటిని చేయడానికి’; జ్ఞాపక దినాలను నియమితంగా పాటించే సందర్భంలో ‘ఆచరించడం’ తెలుగులో స్పష్టమైన సమానార్థక ప్రయోగం.
- source_word: יְמֵי מִשְׁתֶּה
  choice: విందు … దినాలుగా
  rationale: מִשְׁתֶּה విందు లేదా భోజనోత్సవాన్ని సూచిస్తుంది; మద్యపానాన్ని అనవసరంగా ముందుకు తేవకుండా ‘విందు’ భావాన్ని నిలుపుతుంది.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: ఆహార భాగాలు పంపుకొనే
  rationale: מָנוֹת అక్షరార్థంగా ‘భాగాలు’; పండుగ సందర్భంలో ఇవి ఆహార భాగాలని సూచించే అవకాశం బలంగా ఉన్నందున ప్రధాన పాఠ్యంలో సహజమైన స్పష్టీకరణ ఇచ్చి, పాదటిప్పణిలో వివరించాం.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: ఒకరికొకరు
  rationale: అక్షరార్థంగా ‘ఒక పురుషుడు తన సహచరునికి’; ఇది పరస్పర పంపిణీని తెలిపే విభజనాత్మక నుడికారం. ఆధునిక తెలుగులో ‘ఒకరికొకరు’ దాని కార్యార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: מַתָּנוֹת לָאֶבְיוֹנִים
  choice: పేదలకు కానుకలు
  rationale: אֶבְיוֹנִים అవసరంలో ఉన్న పేదలను సూచిస్తుంది; ‘పేదలకు కానుకలు’ సంక్షిప్తంగా సామాజిక-నైతిక ఉద్దేశాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אִישׁ לְרֵעֵהוּ అనే పుంలింగ విభజనాత్మక ప్రయోగం
  choice: ఒకరికొకరు
  alternative: ఒక్కొక్క పురుషుడు తన పొరుగువానికి
  rationale: ఇక్కడ పుంలింగ ఏకవచన రూపం వ్యక్తిగత పురుషులకే పరిమితమైన ఆజ్ఞగా కాక, సమాజంలో పరస్పర ఇచ్చిపుచ్చుకోవడాన్ని తెలిపే హీబ్రూ నుడికారంగా పనిచేస్తుంది. తెలుగు సహజ సమానార్థకం అర్థాన్ని విస్తరించకుండా ‘ఒకరికొకరు’ అని తెలుపుతుంది; అక్షరరూపం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ఈ వచనం ముందటి వాక్యానికి వ్యాకరణపరంగా అనుసంధానమై ఉన్నందున సందర్భాన్ని స్పష్టం చేయడానికి చివర ‘చెప్పాడు’ చేర్చబడింది. మూలంలోని దుఃఖం–సంతోషం, శోకం–పండుగ రోజు అనే సమాంతర విరుద్ధతలు నిలుపబడ్డాయి; పాదటిప్పణి గుర్తులు అన్నీ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
