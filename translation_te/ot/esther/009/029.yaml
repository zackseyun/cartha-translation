id: EST.9.29
reference: Esther 9:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/תִּכְתֹּב אֶסְתֵּ֨ר הַ/מַּלְכָּ֧ה בַת אֲבִיחַ֛יִל וּ/מָרְדֳּכַ֥י הַ/יְּהוּדִ֖י אֶת כָּל תֹּ֑קֶף לְ/קַיֵּ֗ם אֵ֣ת אִגֶּ֧רֶת הַ/פּוּרִ֛ים הַ/זֹּ֖את הַ/שֵּׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/029.yaml
  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
translation:
  language: te
  text: అప్పుడు అబీహయీలు కుమార్తె అయిన ఎస్తేరు రాణి, యూదుడైన మొర్దెకై పూర్తి అధికారంతో[a] పూరీము గురించిన ఈ రెండవ పత్రాన్ని ధృవీకరించడానికి రాశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సర్వ అధికారంతో,’ లేదా ‘పూర్తి బలంతో.’ ఈ హెబ్రీ పదబంధం పత్రానికి ఉన్న అధికారిక బలాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: అప్పుడు ... రాశారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది. ఎస్తేరు, మొర్దెకై ఇద్దరూ కర్తలుగా పేర్కొనబడినందున తెలుగులో బహువచన క్రియ సహజం.
- source_word: אֶסְתֵּר הַמַּלְכָּה בַת אֲבִיחַיִל
  choice: అబీహయీలు కుమార్తె అయిన ఎస్తేరు రాణి
  rationale: ఎస్తేరు యొక్క రాజపదవినీ, వంశపరమైన గుర్తింపునీ స్పష్టంగా నిలుపుతూ ఆధునిక తెలుగులో సహజమైన పదక్రమాన్ని వాడింది.
- source_word: וּמָרְדֳּכַי הַיְּהוּדִי
  choice: యూదుడైన మొర్దెకై
  rationale: పర్షియా సందర్భంలో יְהוּדִי జాతి-సమాజ గుర్తింపును సూచిస్తుంది; తెలుగులో ‘యూదుడు’ సాధారణంగా అర్థమయ్యే సమానార్థకం.
- source_word: אֶת כָּל תֹּקֶף
  choice: పూర్తి అధికారంతో
  rationale: תֹּקֶף బలం, ప్రభావం లేదా అధికారబలాన్ని సూచించగలదు. అధికారిక పత్రం సందర్భంలో ‘పూర్తి అధికారంతో’ ప్రధాన భావాన్ని సహజంగా తెలియజేస్తుంది; ఇతర సాధ్య భావాలను పాదటిప్పణిలో ఉంచింది.
- source_word: לְקַיֵּם
  choice: ధృవీకరించడానికి
  rationale: ఇప్పటికే ఏర్పాటైన పూరీము ఆచరణకు సంబంధించిన పత్రాన్ని అధికారికంగా స్థిరపరచడం లేదా సమర్థించడం అనే ఉద్దేశాన్ని ఈ పదం ఇక్కడ తెలియజేస్తుంది.
- source_word: אֵת אִגֶּרֶת הַפּוּרִים הַזֹּאת הַשֵּׁנִית
  choice: పూరీము గురించిన ఈ రెండవ పత్రాన్ని
  rationale: ‘పూరీము పత్రం’ అనే నిర్మాణ సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తూ, הַזֹּאת మరియు הַשֵּׁנִית సూచించే ‘ఈ రెండవ’ అనే నిర్దిష్టతను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. పేర్లకు సంప్రదాయ తెలుగు బైబిలు రూపాలను ఉపయోగిస్తూ, వాక్య నిర్మాణాన్ని సహజంగా ఉంచింది.
