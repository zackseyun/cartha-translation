revisions:
- from: కాబట్టి యూదులు తమ శత్రువులందరినీ కత్తివేటుతో[a] కొట్టి, వధించి నాశనం చేశారు. తమను ద్వేషించినవారికి తమ ఇష్టానుసారం[b] చేశారు.
  to: యూదులు తమ శత్రువులందరినీ ఖడ్గపు దెబ్బతో[a], వధతోను నాశనంతోను కొట్టారు; తమను ద్వేషించినవారికి తమ ఇష్టానుసారం[b] చేశారు.
  rationale: Removed the inferential «కాబట్టి» and rendered the sword-blow, slaughter, and destruction as a coordinated sequence, matching the Hebrew syntax and emphasis. Footnote markers are retained and placed immediately after their corresponding terms.
  reviewer_model: gpt-5.6-terra
