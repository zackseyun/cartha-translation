  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּכּ֤וּ הַ/יְּהוּדִים֙ בְּ/כָל אֹ֣יְבֵי/הֶ֔ם מַכַּת חֶ֥רֶב וְ/הֶ֖רֶג וְ/אַבְדָ֑ן וַ/יַּֽעֲשׂ֥וּ בְ/שֹׂנְאֵי/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/005.yaml
  text: So the Jews struck all their enemies with the stroke of the sword[a], and with slaughter and destruction[b], and they did to those who hated them as they pleased.
translation:
  language: te
  text: యూదులు తమ శత్రువులందరినీ ఖడ్గపు దెబ్బతో[a], వధతోను నాశనంతోను కొట్టారు; తమను ద్వేషించినవారికి తమ ఇష్టానుసారం[b] చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “కత్తి దెబ్బతో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తమ చిత్తం ప్రకారం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: కొట్టి
  rationale: נכה అనే క్రియకు ‘కొట్టు/దెబ్బతీయు’ అనే విస్తృత అర్థం ఉంది. వెంట వచ్చే వధ, నాశనం అనే పదాలే దాని ప్రాణాంతక ఫలితాన్ని స్పష్టం చేస్తున్నందున, దీనిని నేరుగా ‘చంపారు’ అని పరిమితం చేయలేదు.
- source_word: הַיְּהוּדִים
  choice: యూదులు
  rationale: ఎస్తేరు గ్రంథంలోని పర్షియా ప్రవాస సందర్భంలో ఇది యూదు ప్రజలను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: בְּכָל אֹיְבֵיהֶם
  choice: తమ శత్రువులందరినీ
  rationale: כָּל సూచించే సంపూర్ణ పరిధిని ‘అందరినీ’ స్పష్టంగా నిలుపుతుంది.
- source_word: מַכַּת חֶרֶב
  choice: కత్తివేటుతో
  rationale: ‘కత్తి దెబ్బ/వేటు’ అనే హీబ్రూ పదబంధంలోని స్పష్టమైన హింసాత్మక చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְהֶרֶג
  choice: వధించి
  rationale: הֶרֶג అంటే చంపడం లేదా వధ. తెలుగు వాక్య ప్రవాహం కోసం నామవాచకాన్ని క్రియారూపంలో ఇచ్చినా దాని తీవ్రతను తగ్గించలేదు.
- source_word: וְאַבְדָן
  choice: నాశనం చేశారు
  rationale: אַבְדָן తెలిపే నాశనం లేదా పూర్తిగా పోగొట్టడం అనే భావాన్ని అతిశయోక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: בְשֹׂנְאֵיהֶם
  choice: తమను ద్వేషించినవారికి
  rationale: ముందున్న ‘శత్రువులు’ అనే పదాన్ని మళ్లీ వాడకుండా, שׂנא యొక్క ప్రత్యేకమైన ‘ద్వేషించు’ భావాన్ని నిలుపుతుంది.
- source_word: כִּרְצוֹנָם
  choice: తమ ఇష్టానుసారం
  rationale: ‘తమ చిత్తం/కోరిక ప్రకారం’ అనే అర్థాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యుద్ధ హింసను మృదువుగా చేయకుండా లేదా అతిశయింపజేయకుండా అనువదించడం
  choice: ‘కత్తివేటు, వధ, నాశనం’ అనే మూలపాఠంలోని తీవ్ర పదసమూహాన్ని స్పష్టంగా నిలుపడం
  alternative: సాధారణంగా ‘ఓడించారు’ అని మృదువుగా చెప్పడం, లేదా ప్రతిచోటా ‘సమూలంగా నిర్మూలించారు’ వంటి మరింత వ్యాఖ్యానాత్మక పదాలు వాడడం
  rationale: హీబ్రూ పాఠం హింసాత్మక చర్యను ఉద్దేశపూర్వకంగా పదాల సమూహంతో వర్ణిస్తుంది. అనువాదం ఆ తీవ్రతను దాచకూడదు; అదే సమయంలో మూలపాఠం చెప్పినదానికంటే ఎక్కువ అర్థాన్ని చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. హీబ్రూలోని హింసాత్మక పదాల వరుసను సహజ తెలుగు కోసం సమన్విత క్రియారూపాల్లో ఇచ్చి, దాని తీవ్రతను నిలిపాం. రెండవ పాదంలోని ‘శత్రువులు’/‘ద్వేషించినవారు’ అనే పదభేదాన్ని కాపాడాం.
