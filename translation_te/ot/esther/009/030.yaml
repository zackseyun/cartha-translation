  text: וַ/יִּשְׁלַ֨ח סְפָרִ֜ים אֶל כָּל הַ/יְּהוּדִ֗ים אֶל שֶׁ֨בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מַלְכ֖וּת אֲחַשְׁוֵר֑וֹשׁ דִּבְרֵ֥י שָׁל֖וֹם וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/030.yaml
  text: And he sent letters to all the Jews in the one hundred twenty-seven provinces of the kingdom of Ahasuerus[a], words of peace and truth[c][b],
translation:
  language: te
  text: అహష్వేరోషు రాజ్యంలోని నూట ఇరవై ఏడు పరిపాలనా ప్రాంతాల్లో ఉన్న యూదులందరికీ శాంతి, సత్యం తెలిపే మాటలతో కూడిన ఉత్తరాలను అతడు పంపించాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శాంతి, సత్యాల సందేశం.” హీబ్రూలో అక్షరార్థంగా “శాంతి, సత్యాల మాటలు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “సత్యం” అనే పదానికి “విశ్వసనీయత” లేదా “నమ్మదగినత” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అతడు ... పంపించాడు
  rationale: వయ్యిక్టోల్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో సహజమైన భూతకాల కథన రూపాన్ని వాడాం.
- source_word: סְפָרִים
  choice: ఉత్తరాలు
  rationale: పారసీక సామ్రాజ్య పరిపాలనా సందర్భంలో పంపిన లిఖిత సమాచారాన్ని సహజంగా సూచిస్తుంది.
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: యూదులందరికీ
  rationale: సామ్రాజ్యమంతటా ఉన్న యూదులను సమష్టిగా, సమగ్రంగా సూచిస్తుంది.
- source_word: אֶל שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה
  choice: నూట ఇరవై ఏడు సంస్థానాలన్నిటిలో ఉన్న
  rationale: రెండవ אֶל గ్రహీతలు నివసించిన భౌగోళిక విస్తృతిని సూచిస్తుంది; సంస్థానాలకే ఉత్తరాలు పంపినట్లు కాకుండా తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: מְדִינָה
  choice: సంస్థానాలు
  rationale: ఎస్తేరు గ్రంథంలోని పారసీక సామ్రాజ్య పరిపాలనా ప్రాంతాలకు తెలుగు బైబిలు శైలిలో స్పష్టమైన సమానార్థకం.
- source_word: מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజ్యం
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు సంబంధ రూపంలో అందిస్తుంది; మూలంలో లేని ‘రాజు’ అనే బిరుదును చేర్చదు.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు
  rationale: చారిత్రక గుర్తింపైన ‘జెర్క్సెస్’తో భర్తీ చేయకుండా హీబ్రూ రాజనామ రూపాన్ని లిప్యంతరీకరించింది.
- source_word: דִּבְרֵי שָׁלוֹם וֶאֱמֶת
  choice: శాంతి, సత్యతలతో కూడిన మాటలు
  rationale: ‘శాంతి మాటలు, సత్యత మాటలు’ అనే అసహజ పదప్రతిపదార్థాన్ని నివారిస్తూ, דִּבְרֵי అనే ‘మాటలు’ను నిలుపుతుంది; אֱמֶת లోని సత్యం/నమ్మదగినత భావవిస్తృతిని ‘సత్యత’ కొంతవరకు సంరక్షిస్తుంది.
