revisions:
- from: అహష్వేరోషు రాజ్యంలోని నూట ఇరవై ఏడు సంస్థానాలన్నిటిలో ఉన్న యూదులందరికీ అతడు ఉత్తరాలు పంపించాడు. వాటిలో శాంతి, సత్యతలతో కూడిన మాటలు ఉన్నాయి.[a][b]
  to: అహష్వేరోషు రాజ్యంలోని నూట ఇరవై ఏడు పరిపాలనా ప్రాంతాల్లో ఉన్న యూదులందరికీ శాంతి, సత్యం తెలిపే మాటలతో కూడిన ఉత్తరాలను అతడు పంపించాడు.[a][b]
  rationale: The revision replaces the potentially misleading political term సంస్థానాలు with the contextually accurate and modern Telugu expression పరిపాలనా ప్రాంతాలు. It uses the direct lexical equivalent సత్యం and integrates the Hebrew phrase “words of peace and truth” into the description of the letters. The rendering “శాంతి, సత్యం తెలిపే మాటలతో కూడిన” maintains the source's deliberately compact expression without choosing between the related senses of truth, reliability, and faithfulness.
