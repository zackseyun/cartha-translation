translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి గ్రహణసౌలభ్యాన్ని పెంచాం. పేరును హీబ్రూ రూపానికి దగ్గరగా ఉంచాం; అనవసర చారిత్రక గుర్తింపును పాఠ్యంలో చేర్చలేదు.
