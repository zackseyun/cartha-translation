lexical_decisions:
- source_word: וְ/אֵת
  choice: -ను (కర్మ విభక్తి)
  rationale: వావ్‌తో కూడిన ప్రత్యక్ష కర్మ సూచిక ప్రతి పేరును ముందటి వచనంలోని క్రియకు కర్మగా కలుపుతోంది. తెలుగులో జాబితా ప్రవాహాన్ని సహజంగా ఉంచేందుకు పేర్లకు కర్మ విభక్తిని జోడించాం; ప్రతి పేరుకు విడిగా ‘మరియు’ అవసరం లేదు.
- source_word: פּוֹרָתָא
  choice: పోరాతా
