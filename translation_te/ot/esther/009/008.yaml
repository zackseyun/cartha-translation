  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన జాబితా నిర్మాణాన్ని వాడాం. మూలంలో ఈ వచనానికి స్వతంత్ర క్రియ లేదు; తెలుగులో ఒంటరిగా చదివినప్పటికీ అర్థమయ్యేలా ముందటి వచనంలోని ‘హతమార్చారు’ క్రియను పునరుద్ధరించి, దాని విషయాన్ని పాదసూచికలో తెలిపాం.
