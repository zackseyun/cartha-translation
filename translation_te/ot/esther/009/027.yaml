translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్య నిర్మాణం. మూలంలోని బాధ్యత స్వీకరణ, తరతరాల వర్తింపు, వార్షిక ఆచరణ భావాలు నిలుపబడ్డాయి.
