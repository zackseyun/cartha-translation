source:
  edition: WLC
  text: קִיְּמ֣וּ ו/קבל הַ/יְּהוּדִים֩ עֲלֵי/הֶ֨ם וְ/עַל זַרְעָ֜/ם וְ/עַ֨ל כָּל הַ/נִּלְוִ֤ים עֲלֵי/הֶם֙ וְ/לֹ֣א יַעֲב֔וֹר לִ/הְי֣וֹת עֹשִׂ֗ים אֵ֣ת שְׁנֵ֤י הַ/יָּמִים֙ הָ/אֵ֔לֶּה כִּ/כְתָבָ֖/ם וְ/כִ/זְמַנָּ֑/ם בְּ/כָל שָׁנָ֖ה וְ/שָׁנָֽה׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/027.yaml
  text: 'the Jews established and accepted for themselves[a], for their offspring, and for all who joined them, that it should not fail: to observe these two days according to what was written for them and at their appointed time[b], year after year.'
translation:
  language: te
  text: 'యూదులు తమకు, తమ సంతానానికి, తమతో చేరిన వారందరికీ ఈ బాధ్యతను స్థిరపరచి అంగీకరించారు: ఈ రెండు రోజులను వ్రాయబడిన విధంగా, వాటి నియమిత సమయాల్లో, ప్రతి సంవత్సరం ఎప్పటికీ విస్మరించకుండా ఆచరించాలని.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִיְּמוּ וְקִבֵּל
  choice: స్థిరపరచుకొని అంగీకరించారు
  rationale: రెండు క్రియల న్యాయపరమైన, స్వీకారపరమైన భావాలను నిలుపుతుంది; అసాధారణ ఏకవచన రూపం సందర్భానుసారంగా సమూహ కర్తతో సహజ తెలుగులో ఇవ్వబడింది.
- source_word: עֲלֵיהֶם
  choice: తమమీద
  rationale: బాధ్యతను తమపై వేసుకోవడం అనే హెబ్రీయ ప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: זַרְעָם
  choice: తమ సంతానం
  rationale: తరతరాల వారసులను సూచించే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: כָּל הַנִּלְוִים עֲלֵיהֶם
  choice: తమతో చేరిన వారందరు
  rationale: לוה క్రియలోని తమను అనుసంధానించుకోవడం లేదా చేరడం అనే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: וְלֹא יַעֲבוֹר
  choice: ఎన్నటికీ తప్పిపోకూడదు
  rationale: ఆచారం నిలిచిపోకూడదు, విస్మరింపబడకూడదు అనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; పాదటిప్పణిలో మరింత అక్షరార్థ ప్రత్యామ్నాయం ఇవ్వబడింది.
- source_word: לִהְיוֹת עֹשִׂים
  choice: ఆచరించడం
  rationale: అక్షరార్థంగా ‘చేస్తూ ఉండడం’; పండుగ దినాల సందర్భంలో ‘ఆచరించడం’ కొనసాగుతున్న నియమిత పాటింపును స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּכְתָבָם
  choice: వాటి గురించి వ్రాయబడిన ప్రకారం
  rationale: ఏ పత్రం లేదా విధినిర్దేశం అనేది పాఠం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించకుండా, లిఖిత ప్రమాణాన్ని నిలుపుతుంది.
- source_word: וְכִזְמַנָּם
  choice: వాటి నియమిత కాలంలో
  rationale: రెండు రోజులకూ నిర్ణయించబడిన సమయాన్ని బహువచన సూచనతో సహజంగా అందిస్తుంది.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: ప్రతి సంవత్సరం
  rationale: హెబ్రీయ పునరుక్తి తెలిపే వార్షిక కొనసాగింపును స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
