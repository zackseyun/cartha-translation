lexical_decisions:
- source_word: וְאֵת
  choice: ప్రత్యేకంగా అనువదించకుండా, జాబితాలో విరామచిహ్నాలతో సూచించబడింది
  rationale: אֵת నిర్దిష్ట ప్రత్యక్ష కర్మను సూచిస్తుంది; ప్రతి పేరుకు ముందు וְאֵת పునరావృతమై, ముందటి వచనంలోని ‘చంపారు’ అనే క్రియకు కర్మలుగా ఈ పేర్ల జాబితాను కొనసాగిస్తుంది. తెలుగులో దీనిని విడిగా అనువదించడం సహజం కాదు.
- source_word: פַּרְשַׁנְדָּתָא
  choice: పర్షందాతా
  rationale: ఇది బహుశా పారసీక మూలమున్న వ్యక్తి పేరు; అర్థానువాదం చేయకుండా హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: דַּלְפוֹן
  choice: దల్ఫోను
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: אַסְפָּתָא
  choice: అస్పాతా
  rationale: వ్యక్తి పేరును అనువదించకుండా, హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
