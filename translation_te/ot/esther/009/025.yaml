  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. మూలంలోని ప్రతిఫల నుడికారాన్ని నిలిపి, శిక్ష అమలు విధానంపై ఉన్న నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం.
