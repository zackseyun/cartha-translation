base_translation:
  language: en
  yaml_path: translation/ot/esther/009/025.yaml
  text: But when she came before the king[a], he commanded by letter that his evil scheme which he had devised against the Jews should return on his own head[b], and they hanged him and his sons on the gallows.
translation:
  language: te
  text: అయితే ఆమె రాజు సన్నిధికి వచ్చినప్పుడు,[a] యూదులకు విరోధంగా హామాను పన్నిన దుష్ట పథకం అతని తలమీదికే తిరిగి రావాలని రాజు లిఖితపూర్వకంగా ఆజ్ఞాపించాడు. హామానును, అతని కుమారులను ఆ కొయ్యపై వేలాడదీశారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆమె’ అంటే ఎస్తేరు.
    reason: referent_clarification
  - marker: b
    text: ‘వేలాడదీశారు’ అని అనువదించిన హీబ్రూ పదానికి ‘చెక్క స్తంభంపై గుచ్చి ఉంచారు’ అనే అర్థం కూడా ఉండవచ్చు. ‘కొయ్య’ అనేది చెక్క స్తంభాన్ని లేదా శిక్ష అమలు చేసే చెక్క నిర్మాణాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: ఆమె ... వచ్చినప్పుడు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం సందర్భంలో ఎస్తేరును సూచిస్తుంది; పేరును అనవసరంగా మళ్లీ చెప్పకుండా మూలంలోని అన్వయాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: రాజు సన్నిధికి
  rationale: రాజు సమక్షంలో ప్రవేశించడాన్ని తెలిపే హీబ్రూ నుడికారానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: אָמַר עִם הַסֵּפֶר
  choice: రాజు లిఖితపూర్వకంగా ఆజ్ఞాపించాడు
  rationale: మూలంలోని సంక్షిప్తమైన ‘పత్రంతో/పుస్తకంతో చెప్పాడు’ అనే నిర్మాణం సందర్భంలో రాజు జారీ చేసిన లిఖిత ఆజ్ఞను సూచిస్తుంది.
- source_word: מַחֲשַׁבְתּוֹ הָרָעָה אֲשֶׁר חָשַׁב
  choice: హామాను పన్నిన దుష్ట పథకం
  rationale: ఒక అంతరంగ ఆలోచనకన్నా ఉద్దేశపూర్వకమైన హానికర ప్రణాళికను సూచిస్తుంది; సందర్భం వల్ల కర్త హామాను అని స్పష్టం.
- source_word: יָשׁוּב ... עַל רֹאשׁוֹ
  choice: అతని తలమీదికే తిరిగి రావాలని
  rationale: ప్రతీకారాత్మక తారుమారును తెలిపే మూల నుడికారాన్ని తెలుగులో సహజంగా, దాని బలంతో సహా నిలుపుతుంది.
- source_word: וְתָלוּ אֹתוֹ וְאֶת־בָּנָיו עַל הָעֵץ
  choice: హామానును, అతని కుమారులను ఆ కొయ్యపై వేలాడదీశారు
  rationale: תלה అనేది వేలాడదీయడం లేదా కొయ్యపై ప్రదర్శించడం/శిక్షించడం అనే భావం ఇవ్వగలదు; עֵץ ను ఆధునిక ఉరికంబం అని అతిగా నిర్దిష్టీకరించకుండా ‘కొయ్య’గా అనువదించాం.
