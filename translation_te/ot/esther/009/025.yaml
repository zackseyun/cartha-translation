    issue: పాదటిప్పణి bలో ‘కొయ్యకు గుచ్చి నిలిపారు’ అనే పదబంధం అస్పష్టంగా ఉంది.
    rationale: ఇది impalement అనే ప్రత్యామ్నాయాన్ని సూచించాలనుకున్నప్పటికీ, తెలుగులో శిక్షా నిర్మాణంపై గుచ్చి ఉంచడాన్ని స్పష్టంగా చెప్పదు. ‘చెక్క స్తంభంపై గుచ్చి ఉంచారు’ అని చేయడం అర్థాన్ని స్పష్టపరుస్తుంది; ప్రధాన పాఠం యొక్క సందిగ్ధతను మార్చదు.
