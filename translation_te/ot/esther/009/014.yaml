source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/הֵֽעָשׂ֣וֹת כֵּ֔ן וַ/תִּנָּתֵ֥ן דָּ֖ת בְּ/שׁוּשָׁ֑ן וְ/אֵ֛ת עֲשֶׂ֥רֶת בְּנֵֽי הָמָ֖ן תָּלֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/014.yaml
  text: So the king said that it should be done so. A decree was issued in Susa[a], and the ten sons of Haman were hanged.
translation:
  language: te
  text: అప్పుడు రాజు, “అలాగే చేయాలని” చెప్పాడు. షూషనులో ఒక శాసనం జారీ అయింది; హామాను యొక్క పదిమంది కుమారులను వేలాడదీశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కంబానికి గుచ్చారు.” హీబ్రూ క్రియ ఆధునిక అర్థంలో మెడకు ఉరి వేయడాన్నే తప్పనిసరిగా సూచించదు; శరీరాలను కొయ్య లేదా కంబంపై వేలాడదీయడాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: చెప్పాడు
  rationale: אמר అనే క్రియకు సాధారణ అర్థం ‘చెప్పడం’. ఇక్కడ రాజు ఎస్తేరు అభ్యర్థనకు అధికారిక సమ్మతి తెలుపుతున్నప్పటికీ, మూలపాఠంలో ఉన్న సాధారణ క్రియను ‘ఆజ్ఞాపించాడు’ అని బలపరచకుండా అనువదించాం.
- source_word: לְהֵעָשׂוֹת כֵּן
  choice: అలాగే చేయాలి
  rationale: ఈ క్రియారూపం కోరిన కార్యం అమలు కావాలని సూచిస్తుంది. ‘అలాగే చేయాలి’ అనేది כֵּן భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַתִּנָּתֵן דָּת
  choice: ఒక శాసనం జారీ అయింది
  rationale: נתן + דת అనేది పారసీక పరిపాలనా సందర్భంలోని నానుడి. ‘శాసనం జారీ అయింది’ అనేది అక్షరార్థమైన ‘శాసనం ఇవ్వబడింది’ కంటే తెలుగులో సహజంగా, సందర్భానికి తగినట్లు ఉంటుంది.
- source_word: בְּשׁוּשָׁן
  choice: షూషనులో
  rationale: హీబ్రూ స్థలనామమైన שׁוּשָׁן ను తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన ‘షూషను’ రూపంలో లిప్యంతరీకరించాం.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: హామాను పదిమంది కుమారులను
  rationale: సంఖ్యతో కూడిన హీబ్రూ సమాసాన్ని సహజ తెలుగు క్రమంలో అందించాం.
- source_word: תָּלוּ
  choice: ఉరితీశారు
  rationale: תלה వేలాడదీయడం, కంబం లేదా మానుపై శరీరాన్ని ప్రదర్శించడం, కొన్ని సందర్భాల్లో కంబానికి గుచ్చడం వంటి అర్థాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో సుపరిచితమైన ‘ఉరితీశారు’ వాడి, విధానంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
