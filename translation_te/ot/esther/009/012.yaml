  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֡ה הָרְגוּ֩ הַ/יְּהוּדִ֨ים וְ/אַבֵּ֜ד חֲמֵ֧שׁ מֵא֣וֹת אִ֗ישׁ וְ/אֵת֙ עֲשֶׂ֣רֶת בְּנֵֽי הָמָ֔ן בִּ/שְׁאָ֛ר מְדִינ֥וֹת הַ/מֶּ֖לֶךְ מֶ֣ה עָשׂ֑וּ וּ/מַה שְּׁאֵֽלָתֵ/ךְ֙ וְ/יִנָּ֣תֵֽן לָ֔/ךְ וּ/מַה בַּקָּשָׁתֵ֥/ךְ ע֖וֹד וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/012.yaml
  text: Then the king said to Esther the queen[a], “In Susa the citadel the Jews have killed and destroyed five hundred men, along with the ten sons of Haman. What then have they done in the rest of the king’s provinces? Now what is your petition? It will be granted to you. And what is your further request? It will be done.”
translation:
  language: te
  text: 'అప్పుడు రాజు ఎస్తేరు రాణితో ఇలా అన్నాడు: “షూషను కోటలో యూదులు ఐదువందల మంది పురుషులను, హామాను యొక్క పదిమంది కుమారులను చంపి నాశనం చేశారు. మరి రాజుకు చెందిన మిగతా రాష్ట్రాల్లో వారు ఏమి చేసి ఉంటారు?[a] ఇప్పుడు నీ మనవి ఏమిటి? అది నీకు మంజూరు చేయబడుతుంది. ఇంకా నీ విన్నపం ఏమిటి? అది నెరవేర్చబడుతుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజుకు చెందిన మిగతా రాష్ట్రాల్లో వారు ఏమి చేశారు?” హెబ్రూ ప్రశ్నను ఇలా మరింత సరళంగా కూడా చదవవచ్చు. ప్రధాన పాఠంలోని “చేసి ఉంటారు” అనే రూపం, షూషనులో జరిగినదాని ఆధారంగా రాజు చేసిన ఊహను వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: షూషను కోటలో
  rationale: בִּירָה ఇక్కడ పర్షియా రాజధానిలోని రక్షణగల రాజకోట సముదాయాన్ని సూచిస్తుంది. ‘కోట’ ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమవుతూ ఆ భావాన్ని నిలుపుతుంది.
- source_word: הָרְגוּ ... וְאַבֵּד
  choice: చంపి నాశనం చేశారు
  rationale: రెండు హెబ్రూ క్రియల సమష్టి తీవ్రతను తగ్గించకుండా రెండింటినీ అనువదించాం.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: ఐదువందల మంది పురుషులను
  rationale: సంఖ్య తరువాత ఏకవచనంగా పంపిణీ భావంలో వచ్చిన אִישׁను లింగసూచనతో నేరుగా అనువదించాం.
- source_word: וְאֵת עֲשֶׂרֶת בְּנֵי הָמָן
  choice: హామాను పదిమంది కుమారులను
  rationale: అదనపు ప్రత్యక్ష కర్మను సహజమైన తెలుగు వాక్యనిర్మాణంలో ముందటి కర్మతో సమన్వయించాం.
- source_word: בִּשְׁאָר מְדִינוֹת הַמֶּלֶךְ
  choice: రాజుకు చెందిన మిగతా రాష్ట్రాల్లో
  rationale: పర్షియా సామ్రాజ్య పరిపాలనా విభాగాలైన מְדִינוֹתకు ‘రాష్ట్రాలు’ సహజమైన సమానార్థకం; שְׁאָרలోని ‘మిగతా’ భావాన్ని స్పష్టంగా ఉంచాం.
- source_word: מֶה עָשׂוּ
  choice: మరి ... వారు ఏమి చేసి ఉంటారు?
  rationale: షూషనులో జరిగినదానినుంచి రాజు మిగతా రాష్ట్రాల గురించి వేసిన ఊహాత్మక ప్రశ్నను ‘మరి’ మరియు ‘చేసి ఉంటారు’ సహజంగా వ్యక్తం చేస్తాయి; సరళ పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: שְּׁאֵלָתֵךְ
  choice: నీ మనవి
  rationale: రాజుకు సమర్పించే అధికారిక కోరిక అనే ఆస్థాన భావాన్ని ‘మనవి’ తెలియజేస్తుంది; తరువాతి సమీపార్థక పదం నుంచి కూడా కొంత భేదాన్ని నిలుపుతుంది.
- source_word: וְיִנָּתֵן לָךְ
  choice: అది నీకు మంజూరు చేయబడుతుంది
  rationale: రాజు ఒక మనవిని అంగీకరించి ఇస్తాడనే సందర్భోచిత నిష్క్రియ భావాన్ని ఆధునిక అధికారిక తెలుగులో తెలిపాం.
- source_word: בַּקָּשָׁתֵךְ ... עוֹד
  choice: ఇంకా నీ విన్నపం
  rationale: בַּקָּשָׁהకు ‘విన్నపం’ను ఎంచుకుని ముందటి שְׁאֵלָהతో ఉన్న సమీపార్థక భేదాన్ని ఉంచాం; עוֹדలోని అదనపు భావాన్ని ‘ఇంకా’ తెలియజేస్తుంది.
- source_word: וְתֵעָשׂ
  choice: అది నెరవేర్చబడుతుంది
  rationale: విన్నపం అమలు చేయబడుతుందనే సందర్భార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
