  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מָרְדֳּכַ֔י אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יִּשְׁלַ֨ח סְפָרִ֜ים אֶל כָּל הַ/יְּהוּדִ֗ים אֲשֶׁר֙ בְּ/כָל מְדִינוֹת֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ הַ/קְּרוֹבִ֖ים וְ/הָ/רְחוֹקִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/020.yaml
  text: Then Mordecai wrote these things and sent letters to all the Jews who were in all the provinces of King Ahasuerus[a], both near and far.
translation:
  language: te
  text: అప్పుడు మొర్దెకై ఈ సంగతులను[a] వ్రాసి, అహష్వేరోషు రాజు యొక్క అన్ని ప్రాంతాలలో దగ్గర ఉన్నవారికీ దూరంగా ఉన్నవారికీ, యూదులందరికీ ఉత్తరాలు పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ మాటలను.” హీబ్రూ పదబంధం ఇంతకుముందు వివరించిన సంగతులను లేదా సంఘటనలను, లేదా వాటి గురించి మొర్దెకై వ్రాసిన మాటలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: రాసి
  rationale: כתב క్రియకు నేరుగా ‘రాయడం’ అనే అర్థం ఉంది; వరుస కథన చర్యను తెలుగులో సహజంగా తెలిపేందుకు ‘రాసి’ అని అనువదించాం.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులను
  rationale: דְּבָרִים అనే పదం ‘మాటలు,’ ‘విషయాలు,’ లేదా ‘సంగతులు’ అని సూచించగలదు. ముందుగా వివరించిన సంఘటనలను సూచించే విస్తృత భావాన్ని ‘ఈ సంగతులను’ సహజంగా నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: ఉత్తరాలు పంపాడు
  rationale: ఈ పరిపాలనా సందర్భంలో סְפָרִים లిఖిత సమాచారాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఉత్తరాలు’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: כָּל הַיְּהוּדִים
  choice: యూదులందరికీ
  rationale: సామ్రాజ్యమంతటా ఉన్న యూద సమాజాన్ని నేరుగా, సంక్షిప్తంగా సూచిస్తుంది.
- source_word: בְּכָל מְדִינוֹת
  choice: అన్ని సంస్థానాల్లో
  rationale: מְדִינוֹת సామ్రాజ్య పరిపాలనా విభాగాలను సూచిస్తుంది; ఎస్తేరు గ్రంథపు రాజపాలనా సందర్భంలో ‘సంస్థానాలు’ సుపరిచితమైన తెలుగు పదం.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజు పాలించిన
  rationale: హీబ్రూ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, సంస్థానాలు రాజు అధీనంలో ఉన్నాయని స్పష్టం చేస్తుంది; పేరును మూలభాషకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַקְּרוֹבִים וְהָרְחוֹקִים
  choice: దగ్గరగా, దూరంగా ఉన్న
  rationale: సమీపం నుంచి సుదూరం వరకు ఉన్న యూదులందరినీ సూచించే జంట పదాల సమగ్ర భావాన్ని నిలుపుతుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: ప్రారంభంలోని వావ్-క్రమకథన రూపం ముందటి సంఘటనల తర్వాత జరిగిన చర్యను సూచిస్తుంది; ‘అప్పుడు’ ఆధునిక తెలుగు కథనంలో సహజంగా ఉంటుంది.
