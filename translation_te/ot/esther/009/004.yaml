source:
  edition: WLC
  text: כִּֽי גָ֤דוֹל מָרְדֳּכַי֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/שָׁמְע֖/וֹ הוֹלֵ֣ךְ בְּ/כָל הַ/מְּדִינ֑וֹת כִּֽי הָ/אִ֥ישׁ מָרְדֳּכַ֖י הוֹלֵ֥ךְ וְ/גָדֽוֹל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/004.yaml
  text: For Mordecai was great in the king’s house[a], and the report about him was spreading through all the provinces[b], for the man Mordecai was becoming greater and greater.
translation:
  language: te
  text: ఎందుకంటే మొర్దెకై రాజు భవనంలో గొప్పవాడు; అతని గురించిన వార్త అన్ని పరిపాలనా ప్రాంతాల్లో వ్యాపిస్తూ ఉండేది. మొర్దెకై అనే ఆ వ్యక్తి అంతకంతకు గొప్పవాడవుతూ ఉండేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మొర్దెకై అనే ఆ వ్యక్తి వెళ్తూ గొప్పవాడవుతున్నాడు”; ఇది అతని ప్రాముఖ్యత నిరంతరం పెరుగుతూ ఉండడాన్ని తెలిపే హెబ్రీ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ సంధానపదం ముందున్న సందర్భానికి కారణాన్ని వివరిస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘ఎందుకంటే’ ఆ వివరణాత్మక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: גָדוֹל
  choice: గొప్పవాడయ్యాడు
  rationale: ఇది ప్రాముఖ్యత, ఉన్నత స్థానం లేదా ప్రభావాన్ని సూచిస్తుంది. ఏ ఒక్క రాజకీయ భావానికీ పరిమితం చేయకుండా మూలంలోని విస్తృత అర్థాన్ని కాపాడుతుంది.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: రాజభవనంలో
  rationale: అక్షరార్థంగా ‘రాజు ఇంటిలో’; ఎస్తేరు గ్రంథంలోని రాజసభా సందర్భంలో సహజమైన ఆధునిక తెలుగు పదబంధం ‘రాజభవనంలో’.
- source_word: שָׁמְעוֹ
  choice: అతని పేరు
  rationale: ఈ నామవాచకం అతని గురించిన వార్త, కీర్తి లేదా పేరు అనే భావాలను కలిగి ఉంటుంది. ‘అతని పేరు వ్యాపించింది’ అనేది తెలుగులో సహజంగా ఉండి, అతని ప్రఖ్యాతి విస్తరించిన భావాన్ని తెలియజేస్తుంది.
- source_word: הוֹלֵךְ
  choice: వ్యాపిస్తూ వచ్చింది
  rationale: ‘పేరు/వార్త’ కర్తగా ఉన్నప్పుడు ఈ కృదంతం కొనసాగుతున్న విస్తరణను సూచిస్తుంది; తెలుగు నుడికారంలో ‘వ్యాపిస్తూ వచ్చింది’ సహజం.
- source_word: בְּכָל הַמְּדִינוֹת
  choice: అన్ని సంస్థానాల్లో
  rationale: పర్షియా పరిపాలనా విభాగాల సందర్భంలో מְדִינוֹתకు ‘సంస్థానాలు’ తగిన తెలుగు సమానం; ‘అన్ని ... లో’ విస్తృత వ్యాప్తిని తెలియజేస్తుంది.
- source_word: הָאִישׁ מָרְדֳּכַי
  choice: మొర్దెకై అనే ఆ వ్యక్తి
  rationale: మూలంలోని నిర్దేశక ఉపపదం, ‘వ్యక్తి’ అనే నామవాచకం ఇచ్చే ఉద్ఘాటనను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: הוֹלֵךְ וְגָדוֹל
  choice: అంతకంతకు గొప్పవాడవుతూ వచ్చాడు
  rationale: ఈ హెబ్రీ నుడికారం ప్రాముఖ్యత నిరంతరంగా పెరగడాన్ని సూచిస్తుంది; తెలుగు పదబంధం ప్రగతిశీలమైన తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘గొప్పవాడు’ అనే విస్తృత పదంతో హోదా, ప్రభావం, ప్రాముఖ్యతల మధ్య మూలంలో ఉన్న భావవిస్తృతిని కాపాడాం. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పాదటిప్పణికి జతచేయబడింది.
