source:
  edition: WLC
  text: וּ/שְׁאָ֣ר הַ/יְּהוּדִ֡ים אֲשֶׁר֩ בִּ/מְדִינ֨וֹת הַ/מֶּ֜לֶךְ נִקְהֲל֣וּ וְ/עָמֹ֣ד עַל נַפְשָׁ֗/ם וְ/נ֨וֹחַ֙ מֵ/אֹ֣יְבֵי/הֶ֔ם וְ/הָרֹג֙ בְּ/שֹׂ֣נְאֵי/הֶ֔ם חֲמִשָּׁ֥ה וְ/שִׁבְעִ֖ים אָ֑לֶף וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָֽׁלְח֖וּ אֶת יָדָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/016.yaml
  text: And the rest of the Jews who were in the king’s provinces gathered themselves together and stood for their lives[a], and had relief from their enemies, and killed seventy-five thousand of those who hated them[b]; but they did not lay a hand on the plunder.
translation:
  language: te
  text: రాజు పరిపాలనలోని ప్రాంతాల్లో ఉన్న మిగిలిన యూదులు సమకూడి, తమ ప్రాణాలను కాపాడుకోవడానికి నిలబడ్డారు[a]. వారు తమ శత్రువుల నుండి ఉపశమనం పొంది, తమను ద్వేషించినవారిలో డెబ్బై ఐదు వేల మందిని చంపారు. అయితే దోపుడుసొమ్ము[b] మీద వారు చేయి వేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ ప్రాణాల రక్షణ కోసం నిలబడ్డారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కొల్లసొమ్ము.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הַיְּהוּדִים
  choice: ఇతర ప్రాంతాల్లో ఉన్న యూదులు కూడా
  rationale: שְׁאָר అనే పదం ముందటి వచనంలోని షూషనులోని యూదులకు భిన్నంగా మిగిలిన యూదులను సూచిస్తుంది. తెలుగులో సందర్భానుసారంగా ‘ఇతర ప్రాంతాల్లో ఉన్న యూదులు కూడా’ సహజంగా ఆ వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: בִּמְדִינוֹת הַמֶּלֶךְ
  choice: రాజు పాలించే ఇతర ప్రాంతాల్లో
  rationale: מְדִינוֹת సామ్రాజ్యంలోని పరిపాలనా ప్రాంతాలను సూచిస్తుంది. ‘రాజు పాలించే ప్రాంతాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: נִקְהֲלוּ
  choice: సమకూడి
  rationale: ఈ క్రియ సమూహంగా కూడడాన్ని సూచిస్తుంది. ‘సమకూడి’ సంక్షిప్తంగా, సహజంగా కార్పొరేట్ భావాన్ని నిలుపుతుంది.
- source_word: וְעָמֹד עַל נַפְשָׁם
  choice: తమ ప్రాణాలను కాపాడుకోవడానికి నిలబడ్డారు
  rationale: అక్షరార్థంగా ‘తమ ప్రాణాల కోసం/మీద నిలబడ్డారు.’ ఈ హీబ్రూ నుడికారం ఆత్మరక్షణ భావాన్ని ఇస్తుంది; తెలుగు పదబంధం ఆ భావాన్నీ, ‘నిలబడడం’ అనే మూలచిత్రాన్నీ కాపాడుతుంది.
- source_word: וְנוֹחַ מֵאֹיְבֵיהֶם
  choice: తమ శత్రువుల బారి నుండి ఉపశమనం పొంది
  rationale: נוּחַ ఇక్కడ పోరాటం అనంతరం విశ్రాంతి లేదా ఉపశమనాన్ని పొందడాన్ని సూచిస్తుంది. ‘బారి నుండి ఉపశమనం’ సందర్భంలో సహజంగా ఉంది.
- source_word: וְהָרֹג בְּשֹׂנְאֵיהֶם
  choice: తమను ద్వేషించినవారిలో ... మందిని చంపారు
  rationale: בְּשֹׂנְאֵיהֶם లోని בְּను అతిగా నొక్కకుండా, ద్వేషించినవారి సమూహంలో పేర్కొన్న సంఖ్యను చంపారనే భావాన్ని ‘వారిలో’ స్పష్టంగా ఇస్తుంది.
- source_word: חֲמִשָּׁה וְשִׁבְעִים אָלֶף
  choice: డెబ్బై ఐదు వేల మంది
  rationale: హీబ్రూ సంఖ్యను సహజమైన తెలుగు సంఖ్యాక్రమంలో అందిస్తుంది.
- source_word: וּבַבִּזָּה לֹא שָׁלְחוּ אֶת יָדָם
  choice: అయితే దోపుడుసొమ్ము మీద వారు చేయి వేయలేదు
  rationale: בִּזָּה యుద్ధంలో స్వాధీనం చేసుకునే సొమ్మును సూచిస్తుంది. ‘చేయి వేయలేదు’ స్వాధీనం చేసుకోలేదనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం; ‘అయితే’ ముందటి హింసాత్మక చర్యతో ఉన్న వ్యత్యాసాన్ని చూపుతుంది.
theological_decisions:
- issue: యూదుల చర్య యొక్క నైతిక సందర్భీకరణ
  choice: తమ ప్రాణాలను కాపాడుకోవడానికి నిలబడ్డారు
  alternative: తమ కోసం నిలబడ్డారు / తమను తాము రక్షించుకున్నారు
  rationale: మూలంలోని נֶפֶשׁ వారి ప్రాణాలకు ముప్పు ఉన్న ఆత్మరక్షణ సందర్భాన్ని స్పష్టంగా సూచిస్తుంది. అనువాదం హింసను మృదువుపరచకుండా, అలాగే దాన్ని దాడిగా మార్చకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ నుడికారంలోని ‘నిలబడడం,’ ‘చేయి వేయడం’ చిత్రాలను సహజమైన తెలుగు రూపాల్లో నిలిపాం.
