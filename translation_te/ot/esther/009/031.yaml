translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక-పరిపాలనా శైలి పాటించబడింది. మూలంలోని దీర్ఘ ప్రయోజనార్థక నిర్మాణం ఈ వచనం ముందు వచనంతో వాక్యపరంగా అనుసంధానమై ఉందని చూపేందుకు చివర డ్యాష్‌తో కొనసాగింపుగా ఉంచబడింది; קים పునరుక్తిని తెలుగులో సహజత కోసం సందర్భానుసారంగా ‘స్థిరపరచు/నిర్ణయించు/విధిగా స్వీకరించు’గా వ్యక్తీకరించాం.
