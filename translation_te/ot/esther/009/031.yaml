source:
  edition: WLC
  text: לְ/קַיֵּ֡ם אֵת יְמֵי֩ הַ/פֻּרִ֨ים הָ/אֵ֜לֶּה בִּ/זְמַנֵּי/הֶ֗ם כַּ/אֲשֶׁר֩ קִיַּ֨ם עֲלֵי/הֶ֜ם מָרְדֳּכַ֤י הַ/יְּהוּדִי֙ וְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה וְ/כַ/אֲשֶׁ֛ר קִיְּמ֥וּ עַל נַפְשָׁ֖/ם וְ/עַל זַרְעָ֑/ם דִּבְרֵ֥י הַ/צֹּמ֖וֹת וְ/זַעֲקָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/031.yaml
  text: to establish these days of Purim at their appointed times[a], just as Mordecai the Jew and Esther the queen had established for them[b], and just as they had established for themselves and for their offspring the matters of the fasts and their cry.
translation:
  language: te
  text: ఈ పూరీము దినాలను వాటి నియమిత సమయాల్లో స్థిరపరచడానికి[a]—యూదుడైన మొర్దెకై, రాణియైన ఎస్తేరు వారికి స్థిరపరచినట్లుగాను, వారు ఉపవాసాలు, తమ మొరకు సంబంధించిన విషయాలను తమకూ తమ సంతతికీ విధిగా స్వీకరించినట్లుగాను[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్థిరపరచడానికి’ అనే చోట ‘ధృవీకరించడానికి’ అని కూడా అనువదించవచ్చు. ఈ వచనంలో పదేపదే వచ్చే హీబ్రూ క్రియ, ఈ ఆచరణను అధికారికంగా నిర్ణయించి అమలులో ఉంచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ వాక్యంలోని ‘తమ మొర’ అనేది ఉపవాసాలతో ముడిపడిన సమాజపు మొరను, విలాపాన్ని లేదా సహాయం కోసం చేసిన పిలుపును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: స్థిరపరచడానికి
  rationale: పియేల్ రూపంలోని קום ఇక్కడ ఆచరణను అధికారికంగా స్థాపించడం లేదా ధృవీకరించడం అనే భావాన్ని ఇస్తుంది; ‘స్థిరపరచడానికి’ ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְמֵי הַפֻּרִים הָאֵלֶּה
  choice: ఈ పూరీము దినాలను
  rationale: నిర్దిష్టంగా ముందే ప్రస్తావించిన పండుగ దినాలను సూచించే మూలంలోని సూచనాత్మక బలాన్ని కాపాడుతుంది.
- source_word: בִּזְמַנֵּיהֶם
  choice: వాటి నియమిత సమయాల్లో
  rationale: זְמָן అనే పదంలోని నిర్ణయించబడిన లేదా నిర్దేశించబడిన సమయం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר קִיַּם עֲלֵיהֶם
  choice: వారికి నిర్ణయించినట్లుగాను
  rationale: సమాజంపై ముందుగా విధిగా ఏర్పాటు చేసిన భావాన్ని తెలియజేస్తూ, బలవంతం అనే అదనపు భావాన్ని రానివ్వదు.
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: యూదుడైన మొర్దెకై
  rationale: ఎస్తేరు సందర్భంలోని జాతి గుర్తింపును సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: రాణి ఎస్తేరు
  rationale: హీబ్రూ ఉపపదబంధంలోని బిరుదును తెలుగులో సహజమైన పదక్రమంతో అందిస్తుంది.
- source_word: וְכַאֲשֶׁר קִיְּמוּ עַל נַפְשָׁם וְעַל זַרְעָם
  choice: వారు తమ మీదా తమ సంతతి మీదా ... విధిగా స్వీకరించినట్లుగాను
  rationale: עַל נַפְשָׁם లోని తమపై తాము బాధ్యతను స్వీకరించుకోవడం అనే ప్రతిఫలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: זַרְעָם
  choice: తమ సంతతి
  rationale: తరతరాల కుటుంబ కొనసాగింపును సూచించే זֶרַע కు సహజమైన తెలుగు సమానం.
- source_word: דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם
  choice: ఉపవాసాల సంగతులను, తమ మొరను
  rationale: דִּבְרֵי ను పరిపాలనా సందర్భానికి తగిన ‘సంగతులు’గా, זַעֲקָה ను దుఃఖం లేదా వేడుకోలుతో కూడిన తీవ్ర పిలుపును సూచించే ‘మొర’గా అందిస్తుంది.
