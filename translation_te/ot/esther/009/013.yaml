source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר אֶסְתֵּר֙ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב יִנָּתֵ֣ן גַּם מָחָ֗ר לַ/יְּהוּדִים֙ אֲשֶׁ֣ר בְּ/שׁוּשָׁ֔ן לַ/עֲשׂ֖וֹת כְּ/דָ֣ת הַ/יּ֑וֹם וְ/אֵ֛ת עֲשֶׂ֥רֶת בְּנֵֽי הָמָ֖ן יִתְל֥וּ עַל הָ/עֵֽץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
translation:
  language: te
  text: ఎస్తేరు, “రాజుకు సమ్మతమైతే, షూషనులో ఉన్న యూదులు ఈ రోజు రాజాజ్ఞ ప్రకారం రేపు కూడా చేయడానికి అనుమతి ఇవ్వబడాలి. హామాను పదిమంది కుమారులను చెట్టుపై వేలాడదీయాలి[a]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉరికంబంపై వేలాడదీయాలి,” “కొయ్య స్తంభంపై వేలాడదీయాలి,” లేదా “కొయ్య స్తంభంపై గుచ్చి నిలపాలి.” హీబ్రూలో అక్షరార్థంగా “చెట్టు/కొయ్యపై” అని ఉంది; సందర్భంలో అది శిక్షకు ఉపయోగించే మరపు నిర్మాణాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: రాజుకు సమ్మతమైతే
  rationale: ఇది నైతికంగా ‘మంచిది’ అనే తీర్పు కాకుండా రాజు ఆమోదాన్ని కోరే ఆస్థాన మర్యాదా ప్రయోగం; ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: יִנָּתֵן
  choice: అనుమతి ఇవ్వాలి
  rationale: నిష్క్రియాత్మక యుస్సివ్ భావం రాజు అధికారిక అనుమతిని కోరుతోంది; తెలుగులో అభ్యర్థన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גַּם מָחָר
  choice: రేపు కూడా
  rationale: ఈ రోజుకు ఉన్న అధికారాన్ని మరుసటి రోజుకూ పొడిగించాలనే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: לַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: షూషనులో ఉన్న యూదులు
  rationale: హీబ్రూ సంబంధ వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: לַעֲשׂוֹת כְּדָת הַיּוֹם
  choice: ఈ రోజు ఆజ్ఞ ప్రకారం చేసినట్లే ... చేయడానికి
  rationale: דָּת ఇక్కడ రాజాజ్ఞను సూచిస్తుంది. సందర్భంలోని చర్యను అతిగా నిర్దిష్టం చేయకుండా, ఈ రోజు జరిగినదాన్ని రేపు కొనసాగించే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: דָּת
  choice: ఆజ్ఞ
  rationale: ఎస్తేరు గ్రంథంలోని పారసీక రాజాస్థాన సందర్భంలో అధికారిక రాజశాసనం లేదా ఉత్తర్వు అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: హామాను పదిమంది కుమారులు
  rationale: హీబ్రూ సంఖ్యా-నామ నిర్మాణాన్ని తెలుగులో సహజమైన పదక్రమంతో అందిస్తుంది.
- source_word: יִתְלוּ עַל־הָעֵץ
  choice: కొయ్యపై వేలాడదీయాలి
  rationale: תלה యొక్క ‘వేలాడదీయు’ భావాన్నీ, עֵץ యొక్క విస్తృత ‘చెట్టు/కొయ్య/మరపు నిర్మాణం’ భావాన్నీ సాధ్యమైనంత వరకు నిలుపుతుంది; ‘ఉరికంబం’ అని మాత్రమే నిర్ణయించడం వల్ల కలిగే అధిక నిర్దిష్టతను నివారిస్తుంది.
