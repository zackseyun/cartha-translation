translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజాస్థాన అభ్యర్థనకు తగిన గౌరవప్రదమైన శైలి. మూలంలోని రెండు అభ్యర్థనలను స్పష్టంగా వేరు చేశాం. עֵץ మరియు תלה కలయికలో ఉన్న శిక్ష/ప్రదర్శన విధానపు నిజమైన అనిశ్చితిని ప్రధాన పాఠ్యంలో ‘కొయ్యపై వేలాడదీయాలి’గా ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
