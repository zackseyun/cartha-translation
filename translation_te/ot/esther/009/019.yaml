source:
  edition: WLC
  text: עַל כֵּ֞ן הַ/יְּהוּדִ֣ים ה/פרוזים הַ/יֹּשְׁבִים֮ בְּ/עָרֵ֣י הַ/פְּרָזוֹת֒ עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר שִׂמְחָ֥ה וּ/מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וּ/מִשְׁל֥וֹחַ מָנ֖וֹת אִ֥ישׁ לְ/רֵעֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/019.yaml
  text: Therefore the Jews of the villages[a], who live in the rural towns, make the fourteenth day of the month of Adar a day of gladness and feasting and a holiday, and of sending portions[b], each man to his neighbor.
translation:
  language: te
  text: అందుచేత ప్రాకారాలు లేని పట్టణాల్లో నివసించే గ్రామీణ యూదులు[a] ఆదారు నెల పద్నాలుగవ రోజును సంతోషం, విందు, పండుగ దినం, మరియు ఒకడు తన పొరుగువానికి భాగాలు పంపే దినంగా జరుపుకుంటారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “బహిరంగ నివాసాల్లో ఉండే యూదులు”; లేదా, “ప్రాకారాలు లేని పట్టణాల్లో నివసించే యూదులు.”'
    reason: lexical_alternative
  - marker: b
    text: “భాగాలు పంపడం” అనేది విందుకోసం ఆహార భాగాలను లేదా కానుకలను పంపడాన్ని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ముందటి కథనం నుంచి వచ్చే ఫలితాన్ని సూచించే సహజమైన ఆధునిక తెలుగు అనుసంధానం.
- source_word: הַיְּהוּדִים
  choice: యూదులు
  rationale: పర్షియా సామ్రాజ్యమంతటా ఉన్న యూదు ప్రజలను సూచిస్తుంది; కేవలం యూదయ నివాసులను కాదు.
- source_word: הפרוזים / הַיֹּשְׁבִים בְּעָרֵי הַפְּרָזוֹת
  choice: గ్రామాల్లోని యూదులు—ప్రాకారాలు లేని పట్టణాల్లో నివసించేవారు
  rationale: ప్రాకారాలుగల పట్టణాలకు భిన్నమైన బహిరంగ లేదా ప్రాకారాలు లేని నివాస ప్రాంతాల భావాన్ని స్పష్టంగా నిలుపుతుంది; మొదటి పదబంధంలోని సహజ వర్గీకరణను, తరువాతి వివరణాత్మక పదబంధాన్ని రెండింటినీ ప్రతిబింబిస్తుంది.
- source_word: עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר
  choice: పద్నాలుగవ రోజును ... రోజుగా ఆచరిస్తారు
  rationale: రోజును పాటించడం లేదా వేడుక చేసుకోవడం అనే עשה యొక్క సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: ఆదారు నెల
  rationale: హీబ్రూ తేదీ నిర్దేశాన్ని సాధారణ తెలుగు క్రమంలో అందిస్తుంది.
- source_word: שִׂמְחָה וּמִשְׁתֶּה וְיוֹם טוֹב
  choice: సంతోషించే, విందు చేసుకునే పండుగ రోజు
  rationale: ఆనందం, విందు, ప్రత్యేక ఉత్సవదినం అనే మూడు అంశాలను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది; మద్యపానాన్ని అవసరానికి మించి స్పష్టీకరించదు.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: వంతులు పంపే రోజు
  rationale: మָנוֹת అనే పదంలోని ‘వంతులు/భాగాలు’ అనే సాధారణతను ప్రధాన పాఠ్యంలో నిలుపుతుంది; అవి భోజన వంతులు లేదా కానుకలు కావచ్చనే సందర్భార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: ఒకడు తన పొరుగువానికి
  rationale: హీబ్రూలోని పురుష ఏకవచన పంపిణీ ప్రయోగాన్ని, అలాగే సమాజంలోని తోటి వ్యక్తి అనే רֵעַ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: אִישׁ לְרֵעֵהוּ అనే లింగసూచక పంపిణీ ప్రయోగం
  choice: ఒకడు తన పొరుగువానికి
  alternative: ఒకరికొకరు / ప్రతి వ్యక్తి మరొకరికి
  rationale: మూలంలో వ్యాకరణపరంగా పురుష ఏకవచనం ఉంది. దాన్ని లింగతటస్థంగా మార్చకుండా ప్రధాన పాఠ్యంలో నిలిపినా, సందర్భంలో ఇది సమాజవ్యాప్త ఆచారాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ‘ప్రాకారాలు లేని నివాసాలు’ అనే భౌగోళిక వ్యత్యాసాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంచి, מנות యొక్క స్వల్ప సాధారణతను పాదటిప్పణితో కాపాడాం.
