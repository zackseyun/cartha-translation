source:
  edition: WLC
  text: וְ/כָל שָׂרֵ֨י הַ/מְּדִינ֜וֹת וְ/הָ/אֲחַשְׁדַּרְפְּנִ֣ים וְ/הַ/פַּח֗וֹת וְ/עֹשֵׂ֤י הַ/מְּלָאכָה֙ אֲשֶׁ֣ר לַ/מֶּ֔לֶךְ מְנַשְּׂאִ֖ים אֶת הַ/יְּהוּדִ֑ים כִּֽי נָפַ֥ל פַּֽחַד מָרְדֳּכַ֖י עֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/003.yaml
  text: And all the officials of the provinces[a], the satraps, the governors, and those doing the king’s work were supporting the Jews, because the fear of Mordecai had fallen on them.
translation:
  language: te
  text: ప్రాంతాల అధికారులందరూ, క్షత్రపులు, పాలకులు, రాజు కార్యాలు నిర్వహించేవారు యూదులకు మద్దతు ఇచ్చారు[a]. ఎందుకంటే మొర్దెకై పట్ల భయం వారిమీద పడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యూదులకు సహాయం చేశారు’; హెబ్రీ క్రియకు ‘వారిని పైకి ఎత్తారు’ లేదా ‘వారికి అనుకూలంగా వ్యవహరించారు’ అనే భావాలు కూడా రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: ప్రాంతాల అధికారులు
  rationale: שָׂרִים పరిపాలనా అధికారులు లేదా పాలకులను సూచిస్తుంది; తరువాత వచ్చే పరిపాలనా పదవుల జాబితాకు అనుగుణంగా ఆధునిక తెలుగులో ‘అధికారులు’ సహజంగా ఉంది.
- source_word: אֲחַשְׁדַּרְפְּנִים
  choice: క్షత్రపులు
  rationale: ఇది పర్షియా సామ్రాజ్యంలోని ప్రత్యేక పరిపాలనా పదవిని సూచించే పదం; చారిత్రక ప్రత్యేకతను నిలుపుకోవడానికి తెలుగులో స్థిరపడిన ‘క్షత్రపులు’ వాడబడింది.
- source_word: פַּחוֹת
  choice: పాలకులు
  rationale: క్షత్రపులకంటే భిన్నమైన ప్రాంతీయ పరిపాలనా పదవి; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ‘పాలకులు’ అని అనువదించబడింది.
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר לַמֶּלֶךְ
  choice: రాజు కార్యాలు నిర్వహించేవారు
  rationale: అక్షరార్థంగా ‘రాజుకు చెందిన పని చేసేవారు’; రాజసేవలో వివిధ బాధ్యతలు నిర్వర్తించే వారిని విస్తృతంగా సూచించే మూలభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מְנַשְּׂאִים אֶת־הַיְּהוּדִים
  choice: యూదులకు మద్దతు ఇచ్చారు
  rationale: נָשָׂא హిఫిల్ రూపం ఎత్తడం, ఆదుకోవడం, మద్దతివ్వడం వంటి భావాలను ఇవ్వగలదు. ఈ సంఘర్షణ సందర్భంలో ఆచరణాత్మక సహకారాన్ని సూచించే ‘మద్దతు ఇచ్చారు’ సరిపోతుంది; సామాజికంగా హెచ్చించారనే భావాన్ని అనవసరంగా బలపరచదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: అధికారులు యూదులకు మద్దతు ఇవ్వడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: נָפַל פַּחַד מָרְדֳּכַי עֲלֵיהֶם
  choice: మొర్దెకై పట్ల భయం వారిమీద పడింది
  rationale: భయం ప్రజల మీదికి రావడాన్ని తెలిపే సజీవమైన హెబ్రీయ రూపకాన్ని ‘వారిమీద పడింది’ అని నిలుపుతూ, భయానికి సంబంధించిన వ్యక్తి మొర్దెకై అని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מָרְדֳּכַי
  choice: మొర్దెకై
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించబడింది.
