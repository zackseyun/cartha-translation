  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. పర్షియా పరిపాలనా నేపథ్యాన్ని నిలుపుకోవడానికి ‘క్షత్రపులు’ అనే చారిత్రక పదం ఉంచబడింది; మిగతా పరిపాలనా పదాలు సాధారణ పాఠకులకు అర్థమయ్యే రూపాల్లో ఇవ్వబడ్డాయి.
