translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. హెబ్రీలోని సంఘటనల క్రమం, ‘కూడా’ అనే సంకలన భావం, హత్య మరియు దోపుడు సొమ్మును తీసుకోకపోవడం మధ్య వ్యత్యాసం నిలుపబడ్డాయి. అక్షరార్థ నుడికారాన్ని పాదసూచికలో ఇచ్చి, ప్రధాన పాఠ్యంలో సహజమైన తెలుగు నుడికారాన్ని ఉపయోగించాం.
