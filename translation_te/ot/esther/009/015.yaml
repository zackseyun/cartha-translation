source:
  edition: WLC
  text: וַ/יִּֽקָּהֲל֞וּ ה/יהודיים אֲשֶׁר בְּ/שׁוּשָׁ֗ן גַּ֠ם בְּ/י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר וַ/יַּֽהַרְג֣וּ בְ/שׁוּשָׁ֔ן שְׁלֹ֥שׁ מֵא֖וֹת אִ֑ישׁ וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָׁלְח֖וּ אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/015.yaml
  text: The Jews who were in Susa also assembled on the fourteenth day of the month of Adar[a], and they killed three hundred men in Susa; but they did not lay a hand on the plunder.
translation:
  language: te
  text: షూషనులో ఉన్న యూదులు ఆదారు నెల పద్నాలుగవ రోజున కూడా సమకూడి, షూషనులో మూడువందల మంది పురుషులను చంపారు. అయితే దోపుడు సొమ్ముపై వారు చేయి వేయలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “దోపుడు సొమ్ముపై తమ చేతిని చాపలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: సమకూడి
  rationale: కהל క్రియ ఇక్కడ ఒక సమూహంగా ఉద్దేశపూర్వకంగా కూడడాన్ని సూచిస్తుంది. ‘సమకూడి’ సహజమైన ఆధునిక తెలుగు రూపం; క్రియల క్రమాన్నీ నిలుపుతుంది.
- source_word: הַיְּהוּדִים
  choice: యూదులు
  rationale: ఎస్తేరు సందర్భంలో ఇది పర్షియా సామ్రాజ్యంలో నివసిస్తున్న యూదు ప్రజలను సూచిస్తుంది; ‘యూదులు’ సాధారణంగా అర్థమయ్యే ప్రామాణిక పదం.
- source_word: אֲשֶׁר בְּשׁוּשָׁן
  choice: షూషనులో ఉన్న
  rationale: ఈ సంబంధ వాక్యభాగం షూషనులో నివసిస్తున్న యూదులను ప్రత్యేకంగా గుర్తిస్తుంది. ‘షూషను’ హెబ్రీ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: גַּם
  choice: కూడా
  rationale: మునుపటి రోజు జరిగిన చర్యకు అదనంగా పద్నాలుగవ రోజున కూడా వారు కూడారని తెలిపే సంకలన భావాన్ని నిలుపుతుంది.
- source_word: בְּיוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: ఆదారు నెల పద్నాలుగవ రోజున
  rationale: హెబ్రీ తేదీ నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగు క్రమంలో అందిస్తుంది.
- source_word: וַיַּהַרְגוּ
  choice: చంపారు
  rationale: הרג అనే సాధారణ హత్యార్థక క్రియకు నేరుగా, అస్పష్టత లేని ఆధునిక తెలుగు సమానార్థకం.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: మూడువందల మంది పురుషులను
  rationale: సంఖ్య తరువాత ఉన్న אִישׁ యొక్క పుంలింగ వ్యక్తి సూచనను ‘పురుషులను’ అని స్పష్టంగా నిలిపింది.
- source_word: וּבַבִּזָּה
  choice: అయితే దోపుడు సొమ్ముపై
  rationale: בִּזָּה యుద్ధం లేదా ఘర్షణలో స్వాధీనం చేసుకునే దోపుడు వస్తువులను సూచిస్తుంది. ముందరి హత్యలతో, వాటిని తీసుకోకపోవడాన్ని వ్యతిరేకంగా చూపేందుకు וְ ను సందర్భానుసారంగా ‘అయితే’ అని అనువదించింది.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: వారు చేయి వేయలేదు
  rationale: అక్షరార్థంగా ‘తమ చేతిని చాపలేదు/పంపలేదు’ అనే హెబ్రీ నుడికారానికి, వస్తువులను స్వాధీనం చేసుకోలేదనే అర్థాన్ని సహజమైన తెలుగులో తెలిపే సమాన నుడికారం.
