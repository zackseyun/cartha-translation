translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండుసార్ల ‘అందుచేత’ పునరుక్తి మరియు వాక్యం తదుపరి వచనంలో కొనసాగుతున్న అసంపూర్ణ నిర్మాణం నిలుపబడ్డాయి.
