  text: עַל כֵּ֡ן קָֽרְאוּ֩ לַ/יָּמִ֨ים הָ/אֵ֤לֶּה פוּרִים֙ עַל שֵׁ֣ם הַ/פּ֔וּר עַל כֵּ֕ן עַל כָּל דִּבְרֵ֖י הָ/אִגֶּ֣רֶת הַ/זֹּ֑את וּ/מָֽה רָא֣וּ עַל כָּ֔כָה וּ/מָ֥ה הִגִּ֖יעַ אֲלֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/026.yaml
  text: Therefore they called these days Purim[a], after the name of Pur. Therefore, because of all the words of this letter, and what they had seen concerning this matter, and what had happened to them[b],
translation:
  language: te
  text: అందుచేత పూరు అనే పేరును బట్టి ఈ రోజులకు పూరీము[a] అని పేరు పెట్టారు. అందుచేత, ఈ పత్రంలోని మాటలన్నిటిని బట్టి, ఈ విషయంలో వారు చూసినదానిని బట్టి, తమకు సంభవించినదానిని బట్టి[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పూరును బట్టి’; హీబ్రూలో అక్షరార్థంగా ‘పూరు అనే పేరును బట్టి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తమ మీదికి వచ్చినదానిని బట్టి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: పేరు పెట్టారు
  rationale: పేరు పెట్టే సందర్భంలో קרא అనే క్రియకు సహజమైన ఆధునిక తెలుగు రూపం; ‘పిలిచారు’ కంటే ఉద్దేశం స్పష్టంగా ఉంటుంది.
- source_word: לַיָּמִים הָאֵלֶּה
  choice: ఆ రోజులకు
  rationale: సందర్భంలో ఇప్పటికే ప్రస్తావించిన ప్రత్యేక పండుగ రోజులనే సూచిస్తుంది; తెలుగులో ‘ఆ రోజులు’ సహజం.
- source_word: פוּרִים
  choice: పూరీము
  rationale: పండుగకు ఏర్పడిన ప్రత్యేక నామాన్ని లిప్యంతరీకరించి నిలుపుతుంది.
- source_word: עַל שֵׁם הַפּוּר
  choice: పూరు అనే పేరును బట్టి
  rationale: ‘పూరు పేరును బట్టి’ అనే హీబ్రూ నామవ్యుత్పత్తి సంబంధాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: הַפּוּר
  choice: పూరు
  rationale: ఈ వాక్యంలో పండుగ పేరు ఎలా ఏర్పడిందో వివరించబడుతున్నందున, ‘చీటి’ అని అనువదించకుండా మూలపదాన్ని లిప్యంతరీకరించడం సముచితం.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: రెండుసార్లు వచ్చే కారణ-నిష్కర్ష భావాన్ని, అలాగే మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: עַל כָּל דִּבְרֵי הָאִגֶּרֶת הַזֹּאת
  choice: ఈ పత్రంలోని మాటలన్నిటిని బట్టి
  rationale: דברי అనే ‘మాటలు/విషయాలు’ భావానికి సమీపంగా ఉండి, ఇక్కడ עַל సూచించే కారణ సంబంధాన్ని ‘బట్టి’ వ్యక్తం చేస్తుంది.
- source_word: וּמָה רָאוּ עַל כָּכָה
  choice: ఈ విషయంలో వారు చూసినదానిని బట్టి
  rationale: ‘చూశారు’ అనే మూల క్రియను నిలుపుతూ, עַל כָּכָה ను సహజంగా ‘ఈ విషయంలో’ అని అందిస్తుంది.
- source_word: וּמָה הִגִּיעַ אֲלֵיהֶם
  choice: తమకు సంభవించినదానిని బట్టి
  rationale: ‘వారి దగ్గరకు చేరింది/వారిమీదికి వచ్చింది’ అనే మూల భావాన్ని సందర్భానుకూలమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
