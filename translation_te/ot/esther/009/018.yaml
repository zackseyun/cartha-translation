translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం. తేదీల పునరుక్తిని కొంత సహజీకరించినా, మూడు వరుస తేదీలను స్పష్టంగా నిలిపింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
