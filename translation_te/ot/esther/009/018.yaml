source:
  edition: WLC
  text: ו/ה/יהודיים אֲשֶׁר בְּ/שׁוּשָׁ֗ן נִקְהֲלוּ֙ בִּ/שְׁלֹשָׁ֤ה עָשָׂר֙ בּ֔/וֹ וּ/בְ/אַרְבָּעָ֥ה עָשָׂ֖ר בּ֑/וֹ וְ/נ֗וֹחַ בַּ/חֲמִשָּׁ֤ה עָשָׂר֙ בּ֔/וֹ וְ/עָשֹׂ֣ה אֹת֔/וֹ י֖וֹם מִשְׁתֶּ֥ה וְ/שִׂמְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/018.yaml
  text: But the Jews who were in Susa assembled on the thirteenth day of it and on the fourteenth day of it[a], and rested on the fifteenth day of it[b], and made it a day of feasting and gladness.
translation:
  language: te
  text: అయితే షూషనులో ఉన్న యూదులు ఆ నెల పదమూడవ రోజున, ఆ నెల పద్నాలుగవ రోజున[a] సమకూడారు. ఆ నెల పదిహేనవ రోజున విశ్రమించి, ఆ రోజును విందు మరియు సంతోష దినంగా చేసుకున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘దానిలో పదమూడవ రోజున … దానిలో పద్నాలుగవ రోజున … దానిలో పదిహేనవ రోజున’ అని ఉంది. సందర్భాన్ని బట్టి ‘దానిలో’ అనేది ఆ నెలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ రోజును విందు మరియు ఆనంద దినంగా చేసుకున్నారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: అయితే షూషనులో ఉన్న యూదులు
  rationale: వావ్ ఇక్కడ ముందటి వచనంలోని ప్రాంతాల యూదులతో వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది. שׁוּשָׁןకు మూలానికి దగ్గరైన తెలుగు రూపం ‘షూషను’.
- source_word: נִקְהֲלוּ
  choice: సమకూడారు
  rationale: కהל నిఫాల్ రూపం కూడడం లేదా సమకూడడాన్ని సూచిస్తుంది; ఉద్దేశాన్ని అదనంగా నిర్ధారించకుండా క్రియను నేరుగా అందిస్తుంది.
- source_word: בִּשְׁלֹשָׁה עָשָׂר בּוֹ וּבְאַרְבָּעָה עָשָׂר בּוֹ
  choice: ఆ నెల పదమూడవ రోజున, పద్నాలుగవ రోజున
  rationale: బో అనే ప్రత్యయానికి సందర్భంలో నెల పూర్వపదం. ఆధునిక తెలుగులో స్పష్టత కోసం మొదటి తేదీతో ‘ఆ నెల’ను వ్యక్తం చేసి, సమాంతర రెండవ తేదీని సహజంగా ఉంచింది.
- source_word: וְנוֹחַ
  choice: విశ్రాంతి తీసుకొని
  rationale: נוח పోరాటం లేదా కార్యాచరణ ముగిసిన తరువాత విశ్రమించడాన్ని సూచిస్తుంది; తెలుగు వాక్యక్రమంలో ఈ సంధిక్రియా సహజంగా తదుపరి చర్యతో కలుస్తుంది.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: దానిని ... రోజుగా చేసుకున్నారు
  rationale: עשה + కర్మ సర్వనామం ఆ రోజును నిర్దిష్ట విధంగా ఆచరించినట్లు లేదా చేసుకున్నట్లు సూచిస్తుంది; ‘చేసుకున్నారు’ మూలంలోని సాధారణ భావాన్ని కాపాడుతుంది.
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: విందు చేసుకొని సంతోషించే రోజు
  rationale: מִשְׁתֶּה విందు/భోజనోత్సవాన్ని, שִׂמְחָה సంతోషం లేదా ఆనందాన్ని సూచిస్తాయి. ఈ క్రియాత్మక తెలుగు రూపం సాధారణ పాఠకులకు సహజంగా ఉండి రెండు అంశాలనూ నిలుపుతుంది.
