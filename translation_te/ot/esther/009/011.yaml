  text: ఆ రోజున షూషను కోటలో చంపబడినవారి సంఖ్య రాజు సమక్షానికి చేరింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּשַׁן הַבִּירָה
  choice: షూషను కోటలో
  rationale: ‘הַבִּירָה’ను రాజధాని అని నిర్దిష్టీకరించకుండా, కోట/దుర్గప్రాంతం అనే మూలార్థాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: בָּא ... לִפְנֵי הַמֶּלֶךְ
  choice: రాజు ముందుకు వచ్చింది
  rationale: హీబ్రూ వాక్యంలో కర్త ‘సంఖ్య’; దానిని ‘తీసుకురాబడింది’గా కర్మణి రూపంలో మార్చకుండా, మూలంలోని ‘వచ్చింది’ అనే అభివ్యక్తిని కాపాడింది.
- source_word: מִסְפַּר הַהֲרוּגִים
  choice: చంపబడినవారి సంఖ్య
  rationale: హతులైన వారి లెక్కను సూచించే మూలపదబంధానికి స్పష్టమైన, సహజమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన కథన శైలి. మూలంలోని స్వల్ప అసాధారణ వ్యక్తీకరణ అయిన ‘సంఖ్య ... వచ్చింది’ను అర్థవంతంగా నిలిపింది.
