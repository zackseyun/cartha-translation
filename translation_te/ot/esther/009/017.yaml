translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూలోని వరుస క్రియాభావాలను తెలుగులో సహజమైన కర్తతో అనుసంధానించగా, ముందరి వచనంపై ఆధారపడే నిర్మాణాన్ని పాదటిప్పణిలో తెలిపింది.
