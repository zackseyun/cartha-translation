  text: on the thirteenth day of the month of Adar[a], and resting on the fourteenth day of it[b], and making it a day of feasting and gladness.
translation:
  language: te
  text: అదారు నెల పదమూడవ రోజున, అదే నెల పద్నాలుగవ రోజున విశ్రాంతి తీసుకొని, ఆ రోజును విందు, సంతోష దినంగా చేసుకున్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సందర్భానుసారం: “ఆ రోజును విందు, సంతోష దినంగా చేశారు.” హీబ్రూ క్రియారూపాన్ని సందర్భంలో మరింత సంపూర్ణ క్రియగా కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם שְׁלֹשָׁה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: అదారు నెల పదమూడవ రోజున
  rationale: కాలాన్ని సూచించే హీబ్రూ తేదీ సూత్రాన్ని సహజమైన ఆధునిక తెలుగు క్రమంలో అందిస్తుంది; ‘అదారు’ నెల పేరును లిప్యంతరీకరిస్తుంది.
- source_word: וְנוֹחַ
  choice: విశ్రాంతి తీసుకొని
  rationale: נוח ఇక్కడ యుద్ధం లేదా ఘర్షణ నుండి విరమించి ఉపశమనం పొందడాన్ని సూచిస్తుంది; తెలుగు సందర్భంలో ఇది సహజమైన క్రియారూపం.
- source_word: בְּאַרְבָּעָה עָשָׂר בּוֹ
  choice: అదే నెల పద్నాలుగవ రోజున
  rationale: בּוֹ అనే సర్వనామ సూచన అదారు నెలను తిరిగి సూచిస్తుంది; తెలుగులో అస్పష్టత రాకుండా ‘అదే నెల’ అని వ్యక్తం చేయబడింది.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: ఆ రోజును ... దినంగా చేసుకున్నారు
  rationale: ఆ రోజును ఒక ప్రత్యేక ఉత్సవ దినంగా చేయడం లేదా పాటించడం అనే భావాన్ని వ్యక్తం చేస్తుంది; సందర్భంలోని బహువచన కర్తను తెలుగులో సహజంగా కొనసాగిస్తుంది.
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: విందు, సంతోషాల దినం
  rationale: מִשְׁתֶּה యొక్క విందు/భోజన వేడుక భావాన్నీ, שִׂמְחָה యొక్క ఆనందోత్సాహ భావాన్నీ గౌరవప్రదమైన సాధారణ తెలుగులో నిలుపుతుంది.
