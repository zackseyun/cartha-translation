source:
  edition: WLC
  text: כִּי֩ הָמָ֨ן בֶּֽן הַמְּדָ֜תָא הָֽ/אֲגָגִ֗י צֹרֵר֙ כָּל הַ/יְּהוּדִ֔ים חָשַׁ֥ב עַל הַ/יְּהוּדִ֖ים לְ/אַבְּדָ֑/ם וְ/הִפִּ֥יל פּוּר֙ ה֣וּא הַ/גּוֹרָ֔ל לְ/הֻמָּ֖/ם וּֽ/לְ/אַבְּדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/024.yaml
  text: For Haman son of Hammedatha the Agagite[a], the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur—that is[b], the lot—to crush them and to destroy them.
translation:
  language: te
  text: ఎందుకంటే, యూదులందరికీ శత్రువైన హమ్మెదాతా కుమారుడైన అగాగీయుడు హామాను, యూదులను నాశనం చేయాలని వారిపై పన్నాగం పన్ని, వారిని కలవరపెట్టి[b] నాశనం చేయడానికి పూరు[a]—అంటే చీటి—వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పూరు’ అనేది పారసీక భాషనుంచి వచ్చిన పదం; దానికి ‘చీటి’ అని వాక్యంలోనే వివరణ ఉంది. ఈ పదాన్ని నిలపడం వల్ల చుట్టుపక్కల వచనాల్లోని ‘పూరీము’ అనే పేరుతో దాని సంబంధం స్పష్టంగా ఉంటుంది.
    reason: cultural_note
  - marker: b
    text: లేదా ‘వారిని భయభ్రాంతులకు గురిచేసి’ / ‘వారిని గందరగోళపరచి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలో చెప్పిన ఆచరణకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָמָן בֶּן הַמְּדָתָא הָאֲגָגִי
  choice: అగాగీయుడైన హమ్మెదాతా కుమారుడు హామాను
  rationale: వ్యక్తి పేర్లను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, ‘అగాగీయుడు’ అనే వంశ/జాతి సూచనను నిలిపింది.
- source_word: צֹרֵר כָּל הַיְּהוּדִים
  choice: యూదులందరికీ శత్రువైన
  rationale: צֹרֵר సూచించే క్రియాశీల విరోధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; כָּל యొక్క సమగ్రతను ‘అందరికీ’ నిలుపుతుంది.
- source_word: חָשַׁב עַל הַיְּהוּדִים
  choice: వారిపై పన్నాగం పన్ని
  rationale: ఈ సందర్భంలో సాధారణంగా ఆలోచించడం కాదు, హానికరమైన కుట్రను పన్నడం ఉద్దేశం. ‘వారిపై’ యూదులను తిరిగి సూచిస్తుంది.
- source_word: לְאַבְּדָם
  choice: వారిని నాశనం చేయాలని
  rationale: కారణక క్రియారూపంలోని సంపూర్ణ విధ్వంస ఉద్దేశాన్ని స్పష్టంగా, బలంగా తెలియజేస్తుంది.
- source_word: וְהִפִּיל פּוּר
  choice: పూరు వేశాడు
  rationale: פּוּר అనే పారసీక ఋణపదాన్ని నిలిపి, చీటి వేయడాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; తద్వారా ‘పూరీము’ పేరుతో ఉన్న పదసంబంధం నిలుస్తుంది.
- source_word: הוּא הַגּוֹרָל
  choice: అంటే చీటి
  rationale: మూలపాఠమే విదేశీ పదమైన ‘పూరు’కు ఇచ్చే వివరణను సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: לְהֻמָּם
  choice: వారిని కలవరపెట్టి
  rationale: המם క్రియలోని కలవరపరచడం, భయభ్రాంతులకు లేదా గందరగోళానికి గురిచేయడం అనే భావవ్యాప్తిని పూర్తిగా ‘చితకగొట్టడం’గా పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: וּלְאַבְּדָם
  choice: నాశనం చేయడానికి
  rationale: మూలంలోని ‘నాశనం’ క్రియ పునరుక్తిని నిలిపి, హామాను ఉద్దేశపు తీవ్రతను కాపాడుతుంది.
