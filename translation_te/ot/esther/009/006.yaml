  text: וּ/בְ/שׁוּשַׁ֣ן הַ/בִּירָ֗ה הָרְג֤וּ הַ/יְּהוּדִים֙ וְ/אַבֵּ֔ד חֲמֵ֥שׁ מֵא֖וֹת אִֽישׁ׃
base_translation:
