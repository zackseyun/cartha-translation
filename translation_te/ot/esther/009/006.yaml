  text: And in Susa the citadel[a], the Jews killed and destroyed five hundred men.
translation:
  language: te
  text: షూషను కోటలో[a] యూదులు ఐదువందల మంది పురుషులను చంపి నాశనం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దుర్గంలో.’ హీబ్రూ పదం బలపరచబడిన రాజప్రాసాద సముదాయాన్ని లేదా కోటను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/שׁוּשַׁן
  choice: షూషను ...లో
  rationale: స్థలనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపమైన ‘షూషను’గా ఇచ్చి, בְ ఉపసర్గలోని స్థలార్థాన్ని ‘లో’తో సహజంగా వ్యక్తం చేశాం. వాక్యారంభంలోని וּ సందర్భానుసార కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో అనవసరమైన ‘మరియు’ లేకుండానే ఆ అనుసంధానం సహజంగా నిలుస్తుంది.
- source_word: הַ/בִּירָה
  choice: కోట
  rationale: בִּירָה అనేది బలపరచబడిన రాజప్రాసాద సముదాయం, దుర్గం లేదా కోటను సూచించగలదు. సాధారణ ఆధునిక తెలుగులో ‘కోట’ స్పష్టంగా, సహజంగా ఉండి పదార్థ విస్తృతిని తగినంతగా నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: הָרְגוּ
  choice: చంపి
  rationale: הרג క్రియకు నేరమైన ఆధునిక తెలుగు సమానం ‘చంపు’. తరువాతి సమన్విత క్రియతో సహజ తెలుగు వాక్య నిర్మాణం కోసం ‘చంపి’ రూపం వాడాం.
- source_word: הַ/יְּהוּדִים
  choice: యూదులు
  rationale: ఎస్తేరు సందర్భంలో ఇది యూద ప్రజాసమూహాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన రూపం ‘యూదులు’.
- source_word: וְ/אַבֵּד
  choice: నాశనం చేశారు
  rationale: పియేల్ రూపంలోని אבד ‘నశింపజేయడం/నాశనం చేయడం’ అనే కారణార్థాన్ని ఇస్తుంది. హీబ్రూలోని రెండు క్రియలను ఒకటిగా కలపకుండా, ‘చంపి నాశనం చేశారు’గా రెండింటినీ నిలిపాం.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: ఐదువందల మంది పురుషులను
  rationale: ఇది ‘ఐదువందల మంది పురుషులు’ అనే లెక్కింపు ప్రయోగం. אִישׁ యొక్క పురుషలింగ సూచనను సాధారణ ‘మంది’లో కలిపివేయకుండా ‘పురుషులను’గా స్పష్టంగా నిలిపాం.
