source:
  edition: WLC
  text: וְ/קִבֵּל֙ הַ/יְּהוּדִ֔ים אֵ֥ת אֲשֶׁר הֵחֵ֖לּוּ לַ/עֲשׂ֑וֹת וְ/אֵ֛ת אֲשֶׁר כָּתַ֥ב מָרְדֳּכַ֖י אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/023.yaml
  text: So the Jews accepted what they had begun to do[a], and what Mordecai had written to them.
translation:
  language: te
  text: యూదులు తాము చేయడం ప్రారంభించినదానినీ[a], మొర్దెకై వారికి రాసినదానినీ అంగీకరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాము చేయడం ప్రారంభించినదాన్ని చేపట్టారు.” హెబ్రీ క్రియకు దేనినైనా అంగీకరించడం లేదా దాని బాధ్యతను తమపై స్వీకరించడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבֵּל
  choice: అంగీకరించారు
  rationale: קבל అనే క్రియ ఇక్కడ ఒక ఆచారాన్ని లేదా బాధ్యతను స్వీకరించి పాటించడానికి అంగీకరించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో యూదులు తాము ప్రారంభించిన పూరీము ఆచరణను స్థిరంగా స్వీకరించారని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: הַיְּהוּדִים
  choice: యూదులు
  rationale: నిర్దిష్ట సమూహాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אֵת אֲשֶׁר הֵחֵלּוּ לַעֲשׂוֹת
  choice: తాము చేయడం మొదలుపెట్టినదానిని
  rationale: הֵחֵלּוּ ‘మొదలుపెట్టారు,’ לַעֲשׂוֹת ‘చేయడానికి/చేయడం’ అనే నిర్మాణాన్ని, ప్రధాన క్రియకు కర్మగా ఉన్న సంబంధాన్ని కాపాడుతూ అనువదిస్తుంది.
- source_word: וְאֵת אֲשֶׁר
  choice: దానినీ
  rationale: రెండవ సమాంతర కర్మను తెలుగులో ‘దానినీ’ అని ఇవ్వడం ద్వారా హెబ్రీ పునరుక్త నిర్మాణం స్పష్టంగా, సహజంగా నిలుస్తుంది.
- source_word: כָּתַב
  choice: రాసిన
  rationale: మొర్దెకై రాయడం యూదుల అంగీకారానికి ముందే జరిగినదని సందర్భం తెలియజేస్తుంది; తెలుగు సంబంధకృదంతం ఈ కాల సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מָרְדֳּכַי
  choice: మొర్దెకై
  rationale: వ్యక్తి పేరుకు తెలుగులో సాధారణంగా వినియోగించే లిప్యంతరీకరణ.
- source_word: אֲלֵיהֶם
  choice: తమకు
  rationale: అక్షరార్థంగా ‘వారికి’; వాక్యకర్త యూదులే కాబట్టి తెలుగులో పరావర్తన సర్వనామమైన ‘తమకు’ సందిగ్ధత లేకుండా సహజంగా ఉంటుంది.
