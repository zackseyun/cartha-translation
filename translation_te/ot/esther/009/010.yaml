translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని కర్త పునరుద్ఘాటనను ‘వారు’తో నిలిపి, రెండో ఉపవాక్యంలో తెలుగు సహజత్వం కోసం కర్తను మళ్లీ చెప్పలేదు. మూల వాక్యంలో పాదటిప్పణి అవసరమైన నిజమైన పాఠాంతరం లేదు; అందువల్ల ఇంగ్లీషు consultation layerలో పొరపాటుగా వ్యక్తిపేరుకు జతైన [a] గుర్తును అనుసరించలేదు.
