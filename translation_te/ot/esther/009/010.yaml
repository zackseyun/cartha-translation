  text: the ten sons of Haman son of Hammedatha[a], the enemy of the Jews, they killed; but they did not lay a hand on the plunder.
translation:
  language: te
  text: హమ్మెదాతా కుమారుడైన, యూదుల శత్రువైన హామాను యొక్క పదిమంది కుమారులను వారు చంపారు; అయితే దోపుడు సొమ్ము మీద చేయి వేయలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: హామాను పదిమంది కుమారులను
  rationale: సంఖ్యావాచకం నిర్మాణసంబంధంలో ‘కుమారులు’తో ఉంది; సందర్భంలో ముందుగా పేర్లతో పేర్కొన్న హామాను మగసంతానాన్నే సూచిస్తుంది. తెలుగు సహజ పదక్రమంలో వ్యక్తి పేరు తరువాత సంఖ్యను ఉంచాం.
- source_word: בֶּן הַמְּדָתָא
  choice: హమ్మెదాతా కుమారుడు
  rationale: హామానును గుర్తించే వంశసంబంధ విశేషణం; పేరును తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: యూదుల శత్రువైన
  rationale: צֹרֵר శత్రుత్వం చూపే లేదా బాధించే వ్యక్తిని సూచిస్తుంది. ‘శత్రువు’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానం.
- source_word: הָרָגוּ
  choice: వారు చంపారు
  rationale: הרג క్రియకు నేరుగా సరిపోయే ఆధునిక తెలుగు పదం; కర్తను సూచించే బహువచన రూపాన్ని నిలిపాం.
- source_word: וּבַבִּזָּה
  choice: అయితే దోపుడుసొమ్ము మీద
  rationale: בִּזָּה యుద్ధంలో స్వాధీనం చేసుకునే దోపుడుసొమ్మును సూచిస్తుంది. ముందు జరిగిన హత్యలకు, సొమ్మును తీసుకోకపోవడానికి మధ్య ఉన్న వ్యత్యాసాన్ని బట్టి wawను ‘అయితే’గా వ్యక్తం చేశాం.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: చేయి వేయలేదు
  rationale: అక్షరార్థంగా ‘తమ చేతిని చాపలేదు’; ఇక్కడ స్వాధీనం చేసుకోకపోవడాన్ని తెలిపే హీబ్రూ జాతీయాన్ని, దాని చేతి-రూపకాన్ని కాపాడే సహజ తెలుగు జాతీయంతో అనువదించాం.
