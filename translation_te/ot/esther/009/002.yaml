base_translation:
  language: en
  yaml_path: translation/ot/esther/009/002.yaml
  text: The Jews assembled in their cities throughout all the provinces of King Ahasuerus to lay hands on those seeking their harm[a], and no one could stand before them[c][b], because the fear of them had fallen on all the peoples.
translation:
  language: te
  text: అహష్వేరోషు రాజు పరిపాలనా ప్రాంతాలన్నిటిలో యూదులు తమ తమ పట్టణాల్లో సమకూడి, తమకు కీడు చేయాలని చూసేవారిపై దాడి చేయడానికి[a] సిద్ధమయ్యారు. ఎవరూ వారిని ఎదిరించి నిలువలేకపోయారు[b]. ఎందుకంటే వారికి భయం అన్ని జనసమూహాల మీద పడింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమకు కీడు చేయాలని చూసేవారిపై చేయి చాపడానికి.’ హీబ్రూ జాతీయం అక్షరార్థంగా ‘వారికి వ్యతిరేకంగా చేయి చాపడం/పంపడం’ అని ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎవరూ వారి ముందు నిలబడలేకపోయారు.’
    reason: lexical_alternative
  - marker: c
    text: ‘జనసమూహాలు’ అనే మాట సామ్రాజ్యంలోని వివిధ జాతి లేదా ప్రజావర్గ సమూహాలను సూచించే అవకాశం ఉంది; కేవలం ఒకే దేశ ప్రజలను కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: సమకూడారు
  rationale: కהל నిఫాల్ రూపం సమూహంగా కూడడాన్ని సూచిస్తుంది; ‘సమకూడారు’ ఆధునిక తెలుగులో సహజంగా ఉండి సంఘటితంగా కూడిన భావాన్ని నిలుపుతుంది.
- source_word: בְּעָרֵיהֶם
  choice: తమ తమ పట్టణాల్లో
  rationale: బహువచన స్థలార్థాన్ని, ప్రతి ప్రాంతంలోని యూదులు వారి వారి పట్టణాల్లో కూడారనే పంపిణీ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּכָל מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజు పరిపాలనా ప్రాంతాలన్నిటిలో
  rationale: מְדִינוֹת పర్షియా సామ్రాజ్యంలోని పరిపాలనా విభాగాలను సూచిస్తుంది. ఆధునిక దేశరాష్ట్రాల భావం కలిగించే ‘రాష్ట్రాలు’ కంటే ‘పరిపాలనా ప్రాంతాలు’ చారిత్రక సందర్భాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: לִשְׁלֹחַ יָד
  choice: దాడి చేయడానికి
  rationale: అక్షరార్థంగా ‘చేయి చాపడం/పంపడం’ అయిన ఈ హీబ్రూ జాతీయం ఇక్కడ శత్రుత్వపూర్వకంగా దాడి చేయడాన్ని సూచిస్తుంది; ప్రధాన పాఠంలో అర్థాన్ని సహజంగా ఇచ్చి, మూల రూపకాన్ని పాదసూచికలో ఉంచాం.
- source_word: בִּמְבַקְשֵׁי רָעָתָם
  choice: తమకు కీడు చేయాలని చూసేవారిపై
  rationale: ‘తమ కీడును కోరేవారు’ అనే క్రియాశీల శత్రుత్వ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְאִישׁ לֹא עָמַד לִפְנֵיהֶם
  choice: ఎవరూ వారిని ఎదిరించి నిలువలేకపోయారు
  rationale: అక్షరార్థంగా ‘ఒక మనిషి కూడా వారి ముందు నిలబడలేదు’; సందర్భంలో ప్రతిఘటించలేకపోవడం అనే జాతీయార్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי נָפַל פַּחְדָּם
  choice: ఎందుకంటే వారంటే భయం ... మీద పడింది
  rationale: פַּחַד భయం లేదా భీతిని సూచిస్తుంది. ‘మీద పడింది’ అనే మూల రూపకాన్ని తెలుగులోనూ అర్థవంతంగా నిలుపుతూ, ‘వారంటే భయం’ ద్వారా యూదుల పట్ల కలిగిన భయమని స్పష్టం చేస్తుంది.
- source_word: עַל כָּל הָעַמִּים
  choice: అన్ని జనసమూహాల మీద
  rationale: עַמִּים బహువచనం సామ్రాజ్యంలోని విభిన్న జాతి లేదా ప్రజావర్గ సమూహాలను సూచిస్తుంది; ‘జనసమూహాలు’ ఈ బహుత్వాన్ని నిలుపుతుంది.
- source_word: אֳחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణను అనుసరిస్తుంది.
