  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ జాతీయాల భావాన్ని ప్రధాన పాఠంలో స్పష్టంగా ఇచ్చి, వాటి అక్షర రూపాన్ని పాదసూచికల్లో నిలిపాం; పర్షియా పరిపాలనా సందర్భానికి అనుగుణంగా ‘పరిపాలనా ప్రాంతాలు’ ఎంచుకున్నాం.
