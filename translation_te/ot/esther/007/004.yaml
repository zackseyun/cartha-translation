translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హత్యా ఆజ్ఞలోని మూడు క్రియల పునరుక్తి బలం, దాసులు–దాసీలు అనే లింగ భేదం, చివరి వాక్యభాగంలోని నిజమైన హీబ్రూ సందిగ్ధత నిలుపబడ్డాయి.
