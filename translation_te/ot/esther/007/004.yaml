  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י נִמְכַּ֨רְנוּ֙ אֲנִ֣י וְ/עַמִּ֔/י לְ/הַשְׁמִ֖יד לַ/הֲר֣וֹג וּ/לְ/אַבֵּ֑ד וְ֠/אִלּוּ לַ/עֲבָדִ֨ים וְ/לִ/שְׁפָח֤וֹת נִמְכַּ֨רְנוּ֙ הֶחֱרַ֔שְׁתִּי כִּ֣י אֵ֥ין הַ/צָּ֛ר שֹׁוֶ֖ה בְּ/נֵ֥זֶק הַ/מֶּֽלֶךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/004.yaml
  text: For we have been sold[a], I and my people, to be destroyed, to be killed, and to perish. But if we had been sold as male servants and female servants, I would have kept silent, for the adversary is not worth the damage to the king.
translation:
  language: te
  text: ఎందుకంటే నేనూ నా ప్రజలూ నాశనం చేయబడడానికి, చంపబడడానికి, పూర్తిగా తుడిచిపెట్టబడడానికి అమ్మివేయబడ్డాం. మమ్మల్ని దాసులుగా, దాసీలుగా అమ్మివేసి ఉంటే, నేను మౌనంగా ఉండేదాన్ని. ఎందుకంటే ఆ విరోధి రాజుకు కలిగే నష్టానికి సాటికాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ విరోధి రాజుకు కలిగే నష్టాన్ని పూడ్చలేడు.” హీబ్రూ మాటను రాజుకు కలిగే హాని, ఇబ్బంది లేదా ఆర్థిక నష్టం అనే భావాల్లో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְכַּרְנוּ
  choice: అమ్మివేయబడ్డాం
  rationale: మכר్ క్రియ యొక్క కర్మణి రూపం అమ్మబడడాన్ని సహజంగా సూచిస్తుంది. తరువాతి దాసత్వపు ఊహాత్మక పరిస్థితితో ఉన్న వాణిజ్య రూపక సంబంధాన్ని ఈ పదం నిలుపుతుంది.
- source_word: עַמִּי
  choice: నా ప్రజలు
  rationale: ఎస్తేరు తన జాతి సమూహంతో తనను తాను గుర్తించుకుంటున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: నాశనం చేయబడడానికి, చంపబడడానికి, పూర్తిగా తుడిచిపెట్టబడడానికి
  rationale: మూలంలోని మూడు సమీపార్థక క్రియల అలంకార బలాన్ని, బాధితుల దృష్టికోణాన్ని నిలుపుతూ మూడు వేర్వేరు తెలుగు వ్యక్తీకరణలతో అందిస్తుంది.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: దాసులుగా, దాసీలుగా
  rationale: మూలంలో పురుష, స్త్రీ దాసత్వ రూపాలు స్పష్టంగా వేరుచేయబడ్డాయి; ‘సేవకులు’ అనే మృదువైన పదం కన్నా బలవంతపు దాసత్వాన్ని ఇవి కచ్చితంగా తెలియజేస్తాయి.
- source_word: הֶחֱרַשְׁתִּי
  choice: నేను మౌనంగా ఉండేదాన్ని
  rationale: ఊహాత్మక పరిస్థితి ఫలితాన్ని సహజమైన తెలుగు వ్యతిరేక-వాస్తవ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: הַצָּר
  choice: ఆ విరోధి
  rationale: న్యాయస్థాన సందర్భానికి తగినట్లుగా శత్రుత్వం చూపే వ్యక్తిని సూచిస్తుంది; హామానును సూచించినా పదార్థాన్ని అనవసరంగా మరింత సంకుచితం చేయదు.
- source_word: שֹׁוֶה בְּנֵזֶק הַמֶּלֶךְ
  choice: రాజుకు కలిగే నష్టానికి సాటికాడు
  rationale: שוה లోని సమాన విలువ లేదా సాటిగా ఉండడం అనే భావాన్ని నిలుపుతుంది. మూలంలోని అసాధారణమైన, కొంత సందిగ్ధమైన ప్రయోగాన్ని పూర్తిగా వివరణాత్మకంగా మార్చకుండా ఉంచుతుంది.
