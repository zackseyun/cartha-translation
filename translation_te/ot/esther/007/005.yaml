source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וַ/יֹּ֖אמֶר לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֑ה מִ֣י ה֥וּא זֶה֙ וְ/אֵֽי זֶ֣ה ה֔וּא אֲשֶׁר מְלָא֥/וֹ לִבּ֖/וֹ לַ/עֲשׂ֥וֹת כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/005.yaml
  text: Then King Ahasuerus said to Esther the queen[a], “Who is he, and where is he[b], who has filled his heart to do this?”
translation:
  language: te
  text: 'అప్పుడు అహష్వేరోషు రాజు రాణి ఎస్తేరుతో ఇలా అన్నాడు: “ఇలా చేయడానికి తెగించినవాడు[a] ఎవడు? అతడు ఎక్కడ ఉన్నాడు[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతని హృదయం అతనిని నింపింది” అనే భావం. ఇది “ఇలా చేయడానికి తెగించినవాడు” లేదా “బరితెగించినవాడు” అనే భావమిచ్చే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, తక్కువ సంభావ్యతతో, “అతడు ఏ వ్యక్తి?” ఇక్కడి పదబంధాన్ని అతని ఆచూకీ గురించి కాక, అతన్ని గుర్తించమనే ప్రశ్నగా కూడా తీసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూలో ‘అన్నాడు’ అనే క్రియ రెండుసార్లు వచ్చినా, ఆధునిక తెలుగులో ఆ పునరుక్తి అసహజంగా ఉంటుంది. కథనంలోని మాటల ఆరంభాన్ని ఒక సహజమైన క్రియతో వ్యక్తం చేశాం.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజు
  rationale: రాజబిరుదును పేరుతో సహజమైన తెలుగు క్రమంలో ఉంచి, వ్యక్తినామాన్ని మూలభాషకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: రాణి ఎస్తేరుతో
  rationale: ‘ఎస్తేరు రాణితో’ అనే మూలంలోని సమానాధికార నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు బిరుదు-పేరు క్రమంలో అందించాం.
- source_word: מִי הוּא זֶה
  choice: ఎవడు?
  rationale: ఇది వ్యక్తి గుర్తింపును గట్టిగా ప్రశ్నించే వాక్యం. సందర్భంలో పురుషుడిని సూచిస్తున్నందున ‘ఎవడు?’ సహజంగా, స్పష్టంగా ఉంది; మూలంలో లేని ‘మనిషి’ అనే పదాన్ని చేర్చలేదు.
- source_word: וְאֵי זֶה הוּא
  choice: అతడు ఎక్కడ ఉన్నాడు?
  rationale: אֵי సాధారణంగా స్థలాన్ని అడిగే ‘ఎక్కడ?’ అనే అర్థం ఇస్తుంది. వ్యక్తిని గుర్తించమని అడిగే ప్రత్యామ్నాయ భావం సాధ్యమైనా, ఈ సందర్భంలో స్థలార్థమే ఎక్కువ సంభావ్యమైనది.
- source_word: אֲשֶׁר מְלָאוֹ לִבּוֹ
  choice: ఇలా చేయడానికి తెగించినవాడు
  rationale: ‘తన హృదయాన్ని నింపుకున్నవాడు’ అనే హీబ్రూ నుడికారం, అలాంటి పని చేయడానికి సాహసించడం లేదా బరితెగించడం అనే భావాన్ని ఇస్తుంది. అసహజమైన పదానువాదం బదులు ఆ నుడికార భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לַעֲשׂוֹת כֵּן
  choice: ఇలా చేయడానికి
  rationale: כֵּן ముందటి వచనంలో చెప్పిన దుష్కార్యాన్ని తిరిగి సూచిస్తుంది. ‘ఇలా చేయడానికి’ తెలుగు సందర్భంలో సహజంగా ఆ సూచనను నిలుపుతుంది.
