  yaml_path: translation/ot/esther/007/007.yaml
  text: Then the king rose in his wrath from the wine banquet and went into the palace garden[a], but Haman remained to beg Queen Esther for his life[c][b], for he saw that the evil against him had been determined by the king.
translation:
  language: te
  text: అప్పుడు రాజు ఉగ్రకోపంతో ద్రాక్షారస విందు నుండి లేచి రాజభవనపు తోటలోకి వెళ్లాడు.[a] అయితే హామాను తన ప్రాణం కోసం రాణి ఎస్తేరును వేడుకోవడానికి అక్కడే ఉండిపోయాడు.[b] ఎందుకంటే రాజు తనపై కీడును ఖరారు చేశాడని అతడు గ్రహించాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాజభవనపు తోట’ అనే మాటలను ‘మంటపపు తోట’ లేదా ‘రాజభవన సముదాయంలోని తోట’ అని కూడా అనువదించవచ్చు.
    reason: cultural_note
  - marker: b
    text: పదశః, ‘తన ప్రాణం కోసం రాణి ఎస్తేరు దగ్గర వెదకడానికి నిలబడ్డాడు.’ సందర్భంలో ఇది తన ప్రాణాన్ని కాపాడమని ఆమెను వేడుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘రాజు నుండి తనపై కీడు నిర్ణయించబడిపోయిందని.’ హీబ్రూ మాటలు హామానుకు వ్యతిరేకంగా రాజు నిర్ణయం ఇక ఖరారైందనే భావాన్ని తెలియజేస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲמָתוֹ
  choice: ఉగ్రకోపంతో
  rationale: חֵמָה తీవ్రమైన, మండే కోపాన్ని సూచిస్తుంది. ‘ఉగ్రకోపంతో’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִמִּשְׁתֵּה הַיַּיִן
  choice: ద్రాక్షారస విందు దగ్గరనుంచి
  rationale: מִשְׁתֶּה విందును, ముఖ్యంగా పానీయాలతో కూడిన విందును సూచిస్తుంది; הַיַּיִן ద్రాక్షారసాన్ని స్పష్టంగా పేర్కొంటుంది.
- source_word: גִּנַּת הַבִּיתָן
  choice: రాజభవనపు తోట
  rationale: גִּנָּה అంటే తోట; בִּיתָן రాజభవనం లేదా దాని మంటపాల సముదాయాన్ని సూచించవచ్చు. సందర్భంలో ‘రాజభవనపు తోట’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: עָמַד
  choice: అక్కడే ఉండిపోయాడు
  rationale: పదశః ‘నిలబడ్డాడు’; అయితే రాజు వెళ్లిపోగా హామాను అక్కడే మిగిలాడనే కథన వ్యత్యాసాన్ని ఈ అనువాదం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְבַקֵּשׁ עַל נַפְשׁוֹ
  choice: తన ప్రాణం కోసం ... వేడుకోవడానికి
  rationale: ఈ హీబ్రూ ప్రయోగం తన ప్రాణాన్ని కాపాడమని అర్థించడాన్ని సూచిస్తుంది. ‘వేడుకోవడానికి’ పరిస్థితిలోని ఆతురతను తెలియజేస్తుంది.
- source_word: מֵאֶסְתֵּר הַמַּלְכָּה
  choice: రాణి ఎస్తేరును
  rationale: తెలుగులో బిరుదును పేరుకు ముందు ఉంచడం సహజం; מִן సూచించే వ్యక్తిని ‘వేడుకొను’ అనే క్రియకు తగిన ద్వితీయా విభక్తితో ఇచ్చాం.
- source_word: כִּי רָאָה
  choice: ఎందుకంటే ... గ్రహించాడు
  rationale: כִּי హామాను ఎందుకు వేడుకున్నాడో తెలిపే కారణాన్ని ప్రవేశపెడుతుంది. ראה ఇక్కడ పరిస్థితిని ‘గ్రహించడం’ అనే భావంలో ఉంది.
- source_word: כִּי כָלְתָה
  choice: ఖాయమైందని
  rationale: כלה ఇక్కడ తీర్పు పూర్తిగా నిర్ణయించబడి ఇక మారనిదైందనే భావాన్ని ఇస్తుంది; ‘ఖాయమైంది’ ఆ తుదితనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָרָעָה
  choice: విపత్తు
  rationale: רָעָה చెడు, కీడు, ఆపద లేదా విపత్తు అనే అర్థాలను కలిగి ఉంటుంది. ఇక్కడ హామానుపై రాబోయే రాజతీర్పు వల్ల కలిగే వినాశకర పరిణామాన్ని ‘విపత్తు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: రాజు తనకు విధించబోయే
  rationale: מֵאֵת మూలాన్ని లేదా కర్తను సూచిస్తుంది. తెలుగులో రాజే ఆ విపత్తును విధించే వ్యక్తి అని ఈ నిర్మాణం సహజంగా తెలియజేస్తుంది.
