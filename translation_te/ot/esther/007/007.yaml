translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఉగ్రకోపం,’ ‘వేడుకోవడం,’ ‘విపత్తు ఖాయమవడం’ వంటి పదబంధాలు మూలంలోని తీవ్రతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి. హీబ్రూలోని ‘నిలబడ్డాడు,’ ‘కీడు/విపత్తు,’ ‘పూర్తయింది/నిర్ణయించబడింది’ అనే ప్రత్యామ్నాయ భావాలను పాదసూచికల్లో భద్రపరిచాం.
