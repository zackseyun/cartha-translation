  rationale: The revision removes an unwarranted causative sense, renders Mordecai’s favorable speech without importing its contextual content, improves natural location phrasing, and corrects the execution-method alternative so that it preserves rather than narrows the Hebrew ambiguity. Footnote markers remain correctly attached to the relevant expressions.
