  yaml_path: translation/ot/esther/007/009.yaml
  text: Then Harbonah[a], one of the eunuchs before the king, said, “Also, behold, the gallows that Haman made for Mordecai, who spoke good for the king, is standing at Haman’s house, fifty cubits high.” And the king said[c][b], “Hang him on it.”
translation:
  language: te
  text: 'అప్పుడు రాజు సన్నిధిలో ఉన్న నపుంసకుల్లో ఒకడైన హర్బోనా ఇలా అన్నాడు: “అంతేకాదు, ఇదిగో—రాజుకు అనుకూలంగా మాట్లాడిన మొర్దెకై కోసం హామాను చేసిన కొయ్య నిర్మాణం[a] హామాను ఇంటివద్ద యాభై మూరల ఎత్తుతో నిలిచి ఉంది.” అప్పుడు రాజు, “దానిమీద అతనిని వేలాడదీయండి[b]” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “చెట్టు/కొయ్య.” ఇక్కడ మరణశిక్ష అమలు చేయడానికి చేసిన కొయ్య నిర్మాణాన్ని సూచిస్తుంది; సంప్రదాయంగా “ఉరికంబం” అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దానిమీద అతనిని గుచ్చండి.” హీబ్రూ పదప్రయోగం కొయ్య నిర్మాణంపై వేలాడదీయడం లేదా గుచ్చడం అనే విస్తృత భావాన్ని కలిగి ఉండవచ్చు; ప్రాచీన శిక్షావిధానం ఖచ్చితంగా స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבוֹנָה
  choice: హర్బోనా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం.
- source_word: הַסָּרִיסִים
  choice: నపుంసకులు
  rationale: పర్షియా రాజసభ సందర్భంలో ఈ పదానికి ప్రత్యక్ష అర్థమైన రాజసభ నపుంసక సేవకులను సూచిస్తుంది; కేవలం ‘అధికారులు’ అని అనువదిస్తే మూలంలోని నిర్దిష్టత పోతుంది.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: రాజు సన్నిధిలో ఉన్న
  rationale: రాజు సమక్షంలో సేవకు హాజరై ఉండడాన్ని సూచించే రాజసభీయ నుడికారాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גַּם הִנֵּה
  choice: అంతేకాదు, ఇదిగో—
  rationale: గַּם యొక్క చేర్పు భావాన్నీ, הִנֵּה యొక్క దృష్టి ఆకర్షించే తక్షణ భావాన్నీ నిలుపుతుంది.
- source_word: הָעֵץ
  choice: కొయ్య నిర్మాణం
  rationale: అక్షరార్థంగా ‘చెట్టు/కొయ్య’; ఇక్కడ ఉరితీయడం లేదా మ్రానుపై వేలాడదీయడం/గుచ్చడం కోసం చేసిన నిర్మాణం. ‘ఉరికంబం’ అని మాత్రమే చెప్పడం ప్రాచీన విధానాన్ని అతిగా నిర్దిష్టం చేయవచ్చు.
- source_word: עָשָׂה ... לְמָרְדֳּכַי
  choice: మొర్దెకై కోసం హామాను చేయించిన
  rationale: మొర్దెకైని చంపే ఉద్దేశంతో ఆ నిర్మాణాన్ని సిద్ధం చేయించిన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: דִּבֶּר טוֹב עַל הַמֶּלֶךְ
  choice: రాజుకు మేలు కలిగే మాట చెప్పిన
  rationale: మొర్దెకై రాజుపై జరిగిన కుట్రను వెల్లడించినందువల్ల అతని మాట రాజుకు మేలు చేసిందనే సందర్భాన్ని అందిస్తూ, ‘రాజు గురించి మంచిగా మాట్లాడాడు’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: עֹמֵד בְּבֵית הָמָן
  choice: హామాను ఇంటి దగ్గర నిలిచి ఉంది
  rationale: వర్తమాన స్థితిని తెలిపే కృదంత భావాన్ని నిలుపుతూ, నిర్మాణం హామాను నివాస ప్రాంగణంలో ఉందనే స్థానార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: యాభై మూరల ఎత్తు
  rationale: ప్రాచీన కొలమానాన్ని తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘మూర’తో నిలుపుతుంది.
- source_word: תְּלֻהוּ עָלָיו
  choice: దానిమీదే అతణ్ణి వేలాడదీయండి
  rationale: మూలంలోని ఆజ్ఞను మరియు అదే నిర్మాణంపై శిక్షించాలనే వ్యంగ్యాత్మక తిరుగుబాటును నిలుపుతుంది; ఖచ్చితమైన శిక్షావిధానం విషయంలో మూలంలోని విస్తృతార్థాన్ని పాదటిప్పణిలో ఉంచాం.
