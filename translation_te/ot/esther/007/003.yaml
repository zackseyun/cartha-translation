  text: וַ/תַּ֨עַן אֶסְתֵּ֤ר הַ/מַּלְכָּה֙ וַ/תֹּאמַ֔ר אִם מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ הַ/מֶּ֔לֶךְ וְ/אִם עַל הַ/מֶּ֖לֶךְ ט֑וֹב תִּנָּֽתֶן לִ֤/י נַפְשִׁ/י֙ בִּ/שְׁאֵ֣לָתִ֔/י וְ/עַמִּ֖/י בְּ/בַקָּשָׁתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/003.yaml
  text: Then Queen Esther answered and said[a], “If I have found favor in your eyes, O king, and if it pleases the king, let my life be given me at my petition, and my people at my request.”
translation:
  language: te
  text: 'అప్పుడు ఎస్తేరు రాణి జవాబిచ్చి చెప్పింది: “రాజా, మీ దృష్టిలో నాకు దయ దొరికి ఉంటే, రాజుకు సమ్మతమైతే, నా విన్నపం ప్రకారం నా ప్రాణం నాకు ప్రసాదించబడాలి[a], నా మనవి ప్రకారం నా ప్రజలు కూడా ప్రసాదించబడాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత సహజంగా, “నా విన్నపం మేరకు నా ప్రాణాన్ని, నా మనవి మేరకు నా ప్రజలను నాకు అనుగ్రహించండి.” హీబ్రూలో అక్షరార్థంగా, “నా ప్రాణం నాకు ఇవ్వబడాలి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַר
  choice: ఇలా జవాబిచ్చింది
  rationale: హీబ్రూలోని ‘జవాబిచ్చి చెప్పింది’ అనే సంభాషణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: ఎస్తేరు రాణి
  rationale: వ్యక్తిపేరుతో రాజబిరుదును సహజ తెలుగు క్రమంలో ఉంచుతుంది.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: మీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే
  rationale: రాజసభ మర్యాదా సూత్రంలోని ‘మీ కళ్లలో కృప పొందడం’ అనే హీబ్రూ చిత్రాన్ని అర్థవంతమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజా
  rationale: ఇది ప్రత్యక్ష సంబోధన; ‘రాజా’ గౌరవప్రదంగాను సహజంగాను ఉంది.
- source_word: וְאִם עַל הַמֶּלֶךְ טוֹב
  choice: రాజుకు సమ్మతమైతే
  rationale: అక్షరార్థమైన ‘రాజుకు మంచిదైతే’ కంటే రాజు ఆమోదాన్ని సూచించే ఈ రూపం తెలుగు రాజసభ సందర్భంలో సహజంగా ఉంటుంది.
- source_word: תִּנָּתֶן לִי נַפְשִׁי
  choice: నా ప్రాణం నాకు ఇవ్వబడాలి
  rationale: נֶפֶשׁ ఇక్కడ ప్రాణాన్ని సూచిస్తుంది; నిఫాల్ క్రియలోని నిష్క్రియ రూపాన్ని నిలుపుతూ వేడుకోలు భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בִּשְׁאֵלָתִי
  choice: నా విన్నపం మేరకు
  rationale: שְׁאֵלָה అనే అభ్యర్థన భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְעַמִּי בְּבַקָּשָׁתִי
  choice: నా మనవి మేరకు నా ప్రజలు నాకు ఇవ్వబడాలి
  rationale: మొదటి అర్ధవాక్యంలోని క్రియను రెండవదానికీ వర్తింపజేసి, హీబ్రూ సమాంతర నిర్మాణాన్ని తెలుగులో స్పష్టం చేస్తుంది; రెండు సమీపార్థ పదాలకు ‘విన్నపం/మనవి’ అనే భేదాన్ని ఉంచుతుంది.
