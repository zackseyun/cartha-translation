- from: 'అప్పుడు ఎస్తేరు రాణి ఇలా జవాబిచ్చింది: “రాజా, మీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే, రాజుకు సమ్మతమైతే, నా విన్నపం మేరకు నా ప్రాణం నాకు ఇవ్వబడాలి[a]; నా మనవి మేరకు నా ప్రజలు నాకు ఇవ్వబడాలి.”'
  to: 'అప్పుడు ఎస్తేరు రాణి జవాబిచ్చి చెప్పింది: “రాజా, మీ దృష్టిలో నాకు దయ దొరికి ఉంటే, రాజుకు సమ్మతమైతే, నా విన్నపం ప్రకారం నా ప్రాణం నాకు ప్రసాదించబడాలి[a], నా మనవి ప్రకారం నా ప్రజలు కూడా ప్రసాదించబడాలి.”'
