translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన రాజసభ శైలిని పాటించాం. ‘రాజా’ అనే సంబోధనతో పాటు రాజును సూచించే మూడవ పురుష రూపమైన ‘రాజుకు’ను మూలంలోని మర్యాదా ప్రయోగానికి అనుగుణంగా నిలిపాం.
