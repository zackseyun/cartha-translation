source:
  edition: WLC
  text: וַ/יִּתְלוּ֙ אֶת הָמָ֔ן עַל הָ/עֵ֖ץ אֲשֶׁר הֵכִ֣ין לְ/מָרְדֳּכָ֑י וַ/חֲמַ֥ת הַ/מֶּ֖לֶךְ שָׁכָֽכָה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/010.yaml
  text: So they hanged Haman on the gallows that he had prepared for Mordecai[a], and the king’s wrath subsided.
translation:
  language: te
  text: హామానును మొర్దెకై కోసం అతడు సిద్ధం చేసిన కొయ్యపై వేలాడదీశారు[a]. అప్పుడు రాజు ఉగ్రత చల్లారింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొర్దెకై కోసం అతడు సిద్ధం చేసిన చెట్టు లేదా కొయ్యపై హామానును గుచ్చారు.” హీబ్రూ పదానికి “చెట్టు,” “కలప,” లేదా “కొయ్య” అనే అర్థాలు ఉన్నాయి; క్రియ శరీరాన్ని వేలాడదీయడం లేదా పైకి ఎత్తి తగిలించడం అనే విస్తృత అర్థాన్ని కలిగి ఉండవచ్చు. మరణశిక్ష అమలు చేసిన ఖచ్చితమైన విధానం వివాదాస్పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְלוּ
  choice: వేలాడదీశారు
  rationale: תלה అనే క్రియ ప్రాథమికంగా వేలాడదీయడం లేదా పైకి వేలాడగట్టడాన్ని సూచిస్తుంది. మరణశిక్ష అమలు చేసిన ఖచ్చితమైన విధానం స్పష్టంగా లేనందున, సాధారణమైన అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: הָמָן
  choice: హామాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: עַל הָעֵץ
  choice: కొయ్యపై
  rationale: עֵץ అంటే చెట్టు, కలప లేదా కొయ్య; ఈ సందర్భంలో అది మరణశిక్ష కోసం సిద్ధం చేసిన కలప నిర్మాణాన్ని సూచిస్తుంది. 'కొయ్య' మూలపద విస్తృతిని కాపాడుతూ, ఉరి లేదా శూలం అనే నిర్దిష్ట పద్ధతిని బలవంతంగా నిర్ణయించదు.
- source_word: אֲשֶׁר הֵכִין לְמָרְדֳּכָי
  choice: మొర్దెకై కోసం హామాను సిద్ధం చేసిన
  rationale: הכין అంటే సిద్ధం చేయడం లేదా అమర్చడం. తెలుగులో కర్త స్పష్టత కోసం 'హామాను'ను మళ్లీ పేర్కొని, అతడు మరొకరి కోసం సిద్ధం చేసినదానిపైనే శిక్ష పొందిన కథన వ్యంగ్యాన్ని నిలిపాం.
- source_word: וַחֲמַת הַמֶּלֶךְ
  choice: అప్పుడు రాజు ఉగ్రత
  rationale: חֵמָה తీవ్రమైన కోపం లేదా ఉగ్రతను సూచిస్తుంది. 'ఉగ్రత' తీవ్రతను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; וַ కథన క్రమాన్ని ఇక్కడ 'అప్పుడు' సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שָׁכָכָה
  choice: చల్లారింది
  rationale: שׁכך తగ్గిపోవడం, అణగడం లేదా శాంతించడం అనే భావాన్ని ఇస్తుంది. కోపం గురించి తెలుగులో 'చల్లారింది' సహజంగా ఉండి, భావ తీవ్రత తగ్గినదాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: హామానుకు విధించిన మరణశిక్ష పద్ధతి
  choice: ప్రధాన పాఠ్యంలో 'కొయ్యపై అతన్ని వేలాడదీశారు' అని అనిశ్చితిని నిలిపాం.
  alternative: '''ఉరికంబంపై ఉరితీశారు'' లేదా ''కొయ్యకు గుచ్చారు.'''
  rationale: హీబ్రూ תלה మరియు עֵץ కలయిక శరీరాన్ని వేలాడదీయడాన్ని సూచించినా, ఉరి తీయడమా లేక శూలారోపణమా అనే ఖచ్చితమైన విధానాన్ని నిర్ధారించదు. అందువల్ల ఏ ప్రత్యేక చారిత్రక పద్ధతినీ పాఠ్యంలో రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడాం. 'కొయ్య' అనే పదంతో హీబ్రూ పదంలోని విస్తృతిని, మరణశిక్ష విధానంలోని అనిశ్చితిని కాపాడాం; 'ఉగ్రత చల్లారింది' అనే సహజ తెలుగు ప్రయోగం మూలంలోని తీవ్రత మరియు తగ్గుదలను రెండింటినీ తెలియజేస్తుంది.
