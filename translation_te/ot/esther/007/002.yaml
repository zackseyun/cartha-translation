translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజసభ సందర్భానికి తగిన గౌరవప్రదమైన శైలిని వాడింది. మూలంలోని రెండు సమీపార్థక పదాలను ‘మనవి’, ‘కోరిక’గా వేరు చేసి, కృత్రిమమైన అర్థభేదాన్ని కల్పించలేదు.
