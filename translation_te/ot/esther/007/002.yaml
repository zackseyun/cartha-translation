- from: రెండవ రోజున కూడా, ద్రాక్షారస విందులో రాజు ఎస్తేరుతో, “ఎస్తేరు రాణీ, నీ మనవి ఏమిటి? అది నీకు అనుగ్రహించబడుతుంది. నీ కోరిక ఏమిటి? రాజ్యంలో సగం వరకైనా అది నెరవేర్చబడుతుంది[a]” అని అన్నాడు.
