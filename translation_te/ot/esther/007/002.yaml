source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ הַ/מֶּ֨לֶךְ לְ/אֶסְתֵּ֜ר גַּ֣ם בַּ/יּ֤וֹם הַ/שֵּׁנִי֙ בְּ/מִשְׁתֵּ֣ה הַ/יַּ֔יִן מַה שְּׁאֵלָתֵ֛/ךְ אֶסְתֵּ֥ר הַ/מַּלְכָּ֖ה וְ/תִנָּ֣תֵֽן לָ֑/ךְ וּ/מַה בַּקָּשָׁתֵ֛/ךְ עַד חֲצִ֥י הַ/מַּלְכ֖וּת וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/002.yaml
  text: And the king said to Esther on the second day also[a], at the banquet of wine, “What is your petition, Queen Esther? It will be granted to you. And what is your request? Even to half the kingdom[b], it shall be done.”
translation:
  language: te
  text: 'రెండవ రోజున కూడా, ద్రాక్షారస విందులో రాజు ఎస్తేరుతో ఇలా అన్నాడు: “రాణి ఎస్తేరూ, నీ మనవి ఏమిటి? అది నీకు మంజూరు చేయబడుతుంది. నీ విన్నపం ఏమిటి? రాజ్యంలో సగం వరకైనా[a], అది నెరవేర్చబడుతుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రాజ్యంలో సగం వరకు” అనేది రాజు చూపుతున్న అసాధారణ అనుగ్రహాన్ని తెలిపే సాంప్రదాయిక రాజసభా పలుకుబడి; రాజ్యాన్ని నిజంగానే సగం చేసి ఇస్తాననే తప్పనిసరి అర్థం కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם בַּיּוֹם הַשֵּׁנִי
  choice: రెండవ రోజున కూడా
  rationale: గత రోజు జరిగిన విందుతో కొనసాగింపును సూచించే גַּם భావాన్ని ‘కూడా’ సహజంగా నిలుపుతుంది; בַּיּוֹם הַשֵּׁנִיను నేరుగా ‘రెండవ రోజున’గా అనువదించింది.
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: ద్రాక్షారస విందులో
  rationale: మూలంలోని ‘ద్రాక్షారసం’ను స్పష్టంగా ఉంచుతూ, విందు జరుగుతున్న సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מַה שְּׁאֵלָתֵךְ
  choice: నీ మనవి ఏమిటి?
  rationale: రాజసభ సందర్భంలోని అధికారిక విన్నప భావాన్ని ‘మనవి’ గౌరవప్రదంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְתִנָּתֵן לָךְ
  choice: అది నీకు అనుగ్రహించబడుతుంది
  rationale: అక్షరార్థమైన ‘నీకు ఇవ్వబడుతుంది’ అనే భావాన్ని, మనవిని రాజు మంజూరు చేసే సందర్భానికి సరిపోయే తెలుగులో అందిస్తుంది.
- source_word: בַּקָּשָׁתֵךְ
  choice: నీ కోరిక
  rationale: שְׁאֵלָהతో సమీపార్థం ఉన్నప్పటికీ హెబ్రీ పదభేదాన్ని అతిశయింపకుండా ‘మనవి/కోరిక’ అనే సహజ భేదంతో ప్రతిబింబిస్తుంది.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: రాజ్యంలో సగం వరకైనా
  rationale: మూలంలోని ‘రాజ్యం’ అనే నిర్దిష్ట రూపాన్ని ‘నా రాజ్యం’గా విస్తరించకుండా, עַד యొక్క పరిమితి భావాన్ని ‘వరకైనా’తో తెలియజేస్తుంది.
- source_word: וְתֵעָשׂ
  choice: అది నెరవేర్చబడుతుంది
  rationale: కోరిక అమలు చేయబడుతుందనే ఫలితార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: ఎస్తేరు రాణీ
  rationale: ప్రత్యక్ష సంబోధనలో హెబ్రీ గౌరవ బిరుదును సహజ తెలుగు సంబోధన రూపంలో నిలుపుతుంది.
