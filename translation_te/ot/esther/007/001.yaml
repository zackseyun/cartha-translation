translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘తాగడం’ అనే నిర్దిష్ట క్రియను అలాగే నిలిపి, సందర్భం ఆధారంగా ‘విందు చేయడం’ లేదా ‘ద్రాక్షారసం తాగడం’ అని విస్తరించలేదు. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
