translation:
  language: te
  text: రాజు, హామాను రాణి ఎస్తేరుతో కలిసి తాగడానికి వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “రాజు, హామాను ఎస్తేరు రాణితో కలిసి తాగడానికి వచ్చారు.”'
    reason: పేరు-బిరుదు క్రమంలోని మూలపాఠ రూపాన్ని చూపించే పదప్రయోగ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చారు
  rationale: בוא అనే క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపించే సాధారణ భూతకాల చర్యను సూచిస్తుంది. సందర్భంలో ఎస్తేరు విందుకు రావడాన్ని సహజంగా వ్యక్తపరుస్తూ, మూలంలో లేని ‘ప్రవేశించారు’ అనే అదనపు నిర్దిష్టతను నివారిస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న מֶלֶךְకు సహజమైన తెలుగు సమానం. ఈ రాజు ఇప్పటికే కథనంలో పరిచితుడు కాబట్టి పేరు చేర్చలేదు.
- source_word: וְהָמָן
  choice: హామాను
  rationale: సంధికారకమైన וְ వాక్య నిర్మాణంలో జాబితా విరామంతో సహజంగా వ్యక్తమవుతుంది; హామాను అనే పేరును ప్రామాణిక తెలుగు బైబిలు రూపంలో ఉంచాం.
- source_word: לִשְׁתּוֹת
  choice: తాగడానికి
  rationale: שׁתה యొక్క క్రియార్థక నామరూపం నేరుగా ‘తాగడానికి’ అని అర్థం. సందర్భం విందును సూచించినా, మూలపాఠంలో ‘ద్రాక్షారసం’ లేదా విస్తృతార్థంలోని ‘విందు చేయడం’ స్పష్టంగా లేదు.
- source_word: עִם
  choice: తో కలిసి
  rationale: తోడుగా ఉండడాన్ని సూచించే עִםను సహజమైన ఆధునిక తెలుగులో ‘తో కలిసి’గా ఇచ్చాం.
- source_word: אֶסְתֵּר
  choice: ఎస్తేరు
  rationale: హీబ్రూ పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: הַמַּלְכָּה
  choice: రాణి ఎస్తేరు
  rationale: మూలంలోని ‘ఎస్తేరు రాణి’ అనే అన్వయాన్ని సహజ తెలుగు బిరుదు-పేరు క్రమంలో ‘రాణి ఎస్తేరు’గా ఇచ్చాం.
- source_word: וַ
  choice: కథన క్రమం ద్వారా వ్యక్తీకరించబడింది
  rationale: ప్రారంభ వావ్ కథన పరంపరను సూచిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘మరియు’ లేదా ‘అప్పుడు’ చేర్చకుండానే వాక్య క్రమం ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
