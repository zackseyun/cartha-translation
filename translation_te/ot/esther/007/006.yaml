  yaml_path: translation/ot/esther/007/006.yaml
  text: And Esther said, “A hostile and enemy man—this evil Haman!” Then Haman was terrified before the king and the queen.
translation:
  language: te
  text: అప్పుడు ఎస్తేరు, “విరోధి, శత్రువు అయినవాడు—ఈ దుష్ట హామాను!” అని చెప్పింది. రాజు, రాణి ఎదుట హామాను భయభ్రాంతుడయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ צַר וְאוֹיֵב
  choice: విరోధి, శత్రువు అయినవాడు
  rationale: אִישׁను విడిగా అసహజమైన ‘మనిషి’గా అనువదించకుండా, వ్యక్తిని సూచించే ‘అయినవాడు’తో నిలిపి, צַר మరియు אוֹיֵב అనే సమీపార్థకమైన రెండు ఆరోపణలనూ స్పష్టంగా ఉంచుతుంది.
- source_word: הָמָן הָרָע הַזֶּה
  choice: ఈ దుష్ట హామానే
  rationale: హీబ్రూ పదక్రమంలోని నాటకీయ గుర్తింపును సహజమైన తెలుగులో నిలిపి, הַזֶּה యొక్క చూపించే బలాన్నీ ‘ఈ’ ద్వారా, వాక్యంలోని ఉద్ఘాటనను ‘హామానే’ ద్వారా వ్యక్తపరుస్తుంది.
- source_word: נִבְעַת
  choice: భయభ్రాంతుడయ్యాడు
  rationale: ఈ క్రియ సూచించే ఆకస్మికమైన తీవ్ర భయం లేదా దిగ్భ్రాంతిని సాధారణ ‘భయపడ్డాడు’ కంటే బలంగా తెలియజేస్తుంది.
- source_word: מִלִּפְנֵי הַמֶּלֶךְ וְהַמַּלְכָּה
  choice: రాజు, రాణి ఎదుట
  rationale: మִלִּפְנֵי యొక్క సమక్షత/ఎదుట అనే భావాన్ని సహజంగా అందిస్తుంది; భయానికి కారణం వారేనని అవసరానికి మించి స్పష్టీకరించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలి. ఎస్తేరు ఆరోపణలోని సంక్షిప్తత, ద్వంద్వ పదప్రయోగం, నాటకీయంగా హామానును గుర్తించడం నిలిపివేయబడ్డాయి.
