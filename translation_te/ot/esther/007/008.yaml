  text: The king returned from the palace garden to the house of the wine feast, and Haman was falling on the couch where Esther was. Then the king said, “Will he even assault the queen while I am in the house?” As the word went out from the king’s mouth, they covered Haman’s face.
translation:
  language: te
  text: రాజు రాజభవనపు తోటనుంచి ద్రాక్షారస విందు మందిరానికి తిరిగి వచ్చాడు. హామాను ఎస్తేరు ఉన్న శయ్య మీదకు పడిపోతూ ఉన్నాడు[a]. రాజు, “నేను ఈ ఇంట్లో ఉండగానే రాణిని కూడా బలవంతంగా లోబరచుకుంటాడా[b]?” అన్నాడు. ఆ మాట రాజు నోటినుంచి వెలువడగానే, వారు హామాను ముఖాన్ని కప్పేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పడిపోతూ ఉన్నాడు’ అని అనువదించిన హీబ్రూ పదం కొనసాగుతున్న చర్యను సూచిస్తుంది; దీనిని ‘పడి ఉన్నాడు’ లేదా ‘వాలిపడి ఉన్నాడు’ అని కూడా అర్థం చేసుకోవచ్చు. సందర్భం ఈ భంగిమను ఎస్తేరును వేడుకొనే హామాను చర్యతో అనుసంధానిస్తుంది.
    reason: హీబ్రూ వర్తమాన కృదంతంలోని చర్య-స్థితి అస్పష్టతను తెలియజేయడానికి.
  - marker: b
    text: ‘బలవంతంగా లోబరచుకుంటాడా’ అని అనువదించిన హీబ్రూ క్రియకు ‘అదుపులోకి తెచ్చు, లోబరచు’ అనే అర్థాలు ఉన్నాయి. ఈ సందర్భంలో రాజు రాణిపై తీవ్రమైన దౌర్జన్యాన్ని ఆరోపిస్తున్నాడు; మూలం చర్యను మరింత నిర్దిష్టంగా నిర్వచించదు.
    reason: సందర్భానుసారమైన తీవ్రమైన భావాన్ని తెలియజేస్తూనే మూల క్రియలోని విస్తృతిని సంరక్షించడానికి.
lexical_decisions:
- source_word: בֵּית מִשְׁתֵּה הַיַּיִן
  choice: ద్రాక్షారస విందు మందిరం
  rationale: ‘ద్రాక్షారస విందు జరిగే మందిరం’ అనే మూలపదబంధంలోని స్థలం, విందు, ద్రాక్షారసం అనే మూడు అంశాలనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: נֹפֵל עַל־הַמִּטָּה
  choice: శయ్యపై పడి ఉన్నాడు
  rationale: హీబ్రూ వర్తమాన కృదంతం ఆ సమయంలో రాజు చూసిన హామాను భంగిమను సూచిస్తుంది. తెలుగులో ‘పడుతున్నాడు’ అనడం కేవలం కదలికను సూచించే ప్రమాదం ఉన్నందున, కొనసాగుతున్న స్థితిని సహజంగా వ్యక్తపరచే ‘పడి ఉన్నాడు’ ఎంచుకున్నాం.
- source_word: לִכְבּוֹשׁ
  choice: దాడి చేస్తాడా
  rationale: మూల క్రియకు ‘లోబరచు, బలవంతంగా అదుపుచేయు’ అనే భావాలు ఉన్నాయి; ఈ సందర్భంలో రాణిపై లైంగిక ఉద్దేశంతో కూడిన దౌర్జన్యాన్ని రాజు ఆరోపిస్తున్నట్టు కనిపిస్తుంది. ‘దాడి’ ఆ తీవ్రతను తెలియజేస్తూనే మూలంలో స్పష్టంగా లేని వివరాన్ని అదనంగా చేర్చదు.
- source_word: וּפְנֵי הָמָן חָפוּ
  choice: వారు హామాను ముఖాన్ని కప్పేశారు
  rationale: మూలంలో క్రియ బహువచనంగా ఉన్నా కర్త పేరు చెప్పబడలేదు. తెలుగులో కూడా అనిర్దిష్ట ‘వారు’ ద్వారా ఆ అస్పష్టతను నిలిపాం.
theological_decisions:
- issue: హామాను చర్యను లైంగిక దాడిగా ఎంత స్పష్టంగా చెప్పాలి
  choice: రాణిపై కూడా దాడి చేస్తాడా
  alternative: రాణిని కూడా లోబరచుకుంటాడా / రాణిపై అత్యాచారం చేస్తాడా
  rationale: ‘లోబరచుకోవడం’ సందర్భంలోని దౌర్జన్యాన్ని తగ్గించవచ్చు; ‘అత్యాచారం’ మూలపదం చెప్పినదానికంటే మరింత నిర్దిష్టం. ‘దాడి’ రాజు చేసిన తీవ్ర ఆరోపణను తెలియజేస్తూ అసలు పదంలోని కొంత విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ద్రాక్షారస విందు మందిరం’, ‘శయ్య’ వంటి పదాలు రాజసభా సందర్భాన్ని నిలుపుతాయి; వాక్య నిర్మాణం మాత్రం సాధారణ పాఠకునికి సహజంగా ఉంచబడింది.
