  text: וְ/הַ/מֶּ֡לֶךְ שָׁב֩ מִ/גִּנַּ֨ת הַ/בִּיתָ֜ן אֶל בֵּ֣ית מִשְׁתֵּ֣ה הַ/יַּ֗יִן וְ/הָמָן֙ נֹפֵ֔ל עַל הַ/מִּטָּה֙ אֲשֶׁ֣ר אֶסְתֵּ֣ר עָלֶ֔י/הָ וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ הֲ֠/גַם לִ/כְבּ֧וֹשׁ אֶת הַ/מַּלְכָּ֛ה עִמִּ֖/י בַּ/בָּ֑יִת הַ/דָּבָ֗ר יָצָא֙ מִ/פִּ֣י הַ/מֶּ֔לֶךְ וּ/פְנֵ֥י הָמָ֖ן חָפֽוּ־׀־־׃ס
