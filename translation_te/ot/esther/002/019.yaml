translation:
  language: te
  text: కన్యలు రెండోసారి[a] సమకూర్చబడినప్పుడు, మొర్దెకై రాజద్వారం[b] వద్ద కూర్చుని ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మళ్లీ.’ హీబ్రూలో అక్షరార్థంగా ‘రెండోసారి’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘రాజద్వారం’ బహుశా రాజప్రాసాదపు ద్వారప్రాంతాన్ని సూచిస్తుంది; అది అధికారిక సేవ, పరిపాలనా వ్యవహారాలు జరిగే స్థలంతో సంబంధం కలిగి ఉండేది.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהִקָּבֵץ
  choice: సమకూర్చినప్పుడు
  rationale: בְּ + నిఫాల్ infinitive construct కాలసంబంధ ఉపవాక్యాన్ని సూచిస్తుంది; నిఫాల్‌లోని కర్మణి భావాన్ని సహజమైన తెలుగు కర్మణి నిర్మాణంతో వ్యక్తం చేసింది. ప్రారంభ וּ సందర్భానుసార అనుసంధానాన్ని ఇస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: בְּתוּלוֹת
  choice: కన్యలను
  rationale: ఈ పదం సాధారణంగా కన్యత్వాన్ని స్పష్టంగా సూచిస్తుంది; కేవలం ‘యువతులను’ అని అనడం మూలంలోని నిర్దిష్టతను తగ్గిస్తుంది.
- source_word: שֵׁנִית
  choice: రెండోసారి
  rationale: హీబ్రూ పదానికి ‘రెండవసారి/మళ్లీ’ అనే అర్థం ఉంది. మూలంలోని క్రమసంఖ్య భావాన్ని స్పష్టంగా నిలుపుకోవడానికి ‘రెండోసారి’ ఎంచుకుంది.
- source_word: וּמָרְדֳּכַי
  choice: మొర్దెకై
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: יֹשֵׁב
  choice: కూర్చుని ఉన్నాడు
  rationale: Qal participle కొనసాగుతున్న స్థితిని సూచిస్తుంది; ‘కూర్చున్నాడు’ కంటే ‘కూర్చుని ఉన్నాడు’ ఆ కాలవ్యాప్త భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: రాజద్వారం దగ్గర
  rationale: అక్షరార్థంగా ‘రాజు ద్వారంలో/వద్ద’; ఇది రాజప్రాసాద ద్వారప్రాంతాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో స్థలార్థాన్ని సహజంగా తెలియజేయడానికి ‘దగ్గర’ వాడింది.
