source:
  edition: WLC
  text: אֲשֶׁ֤ר הָגְלָה֙ מִ/יר֣וּשָׁלַ֔יִם עִם הַ/גֹּלָה֙ אֲשֶׁ֣ר הָגְלְתָ֔ה עִ֖ם יְכָנְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/006.yaml
  text: who had been taken into exile from Jerusalem with the exiles who had been taken into exile with Jeconiah king of Judah[a], whom Nebuchadnezzar king of Babylon had taken into exile.
translation:
  language: te
  text: యెరూషలేము నుండి చెరలోకి తీసుకుపోబడినవాడు అతడు[a]—యూదా రాజైన యెకొన్యాతో కలిసి చెరలోకి తీసుకుపోబడినవారితో పాటు; ఆ యెకొన్యాను బబులోను రాజైన నెబుకద్నెజరు చెరలోకి తీసుకుపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, యెకొన్యా చెర తరాల క్రితం జరిగినందున, ‘అతడు’ అనేది మొర్దెకైని కాక అతని పూర్వికుడైన కీషును సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר הָגְלָה
  choice: అతడు ... చెరలోకి తీసుకుపోబడినవాడు
  rationale: హీబ్రూ సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, బలవంతపు దేశబహిష్కరణ భావాన్ని కర్మణి రూపంలో నిలుపుతుంది.
- source_word: מִירוּשָׁלַיִם
  choice: యెరూషలేము నుండి
  rationale: ఉపసర్గతో కూడిన స్థలనామానికి నేరమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: עִם הַגֹּלָה
  choice: చెరప్రజలతో
  rationale: ఇది కేవలం ‘చెర’ అనే అమూర్త స్థితిని కాక, చెరలోకి తరలించబడిన ప్రజాసమూహాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר הָגְלְתָה
  choice: చెరలోకి తీసుకుపోయిన
  rationale: సమూహవాచకమైన הַגּוֹלָהతో ఉన్న క్రియను తెలుగులో ప్రజల సమూహానికి సహజంగా అన్వయిస్తుంది; గלה పదపునరుక్తి భావాన్ని కూడా నిలుపుతుంది.
- source_word: יְכָנְיָה
  choice: యెకొన్యా
  rationale: ఈ వచనంలోని హీబ్రూ నామరూపాన్ని ప్రత్యక్షంగా లిప్యంతరీకరిస్తుంది; సమాంతర రాజనామంతో మౌనంగా సమన్వయపరచదు.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజు
  rationale: సహజమైన తెలుగు సంబంధ నిర్మాణం.
- source_word: אֲשֶׁר הֶגְלָה
  choice: తీసుకుపోయిన
  rationale: నెబుకద్నెజరును చర్యకర్తగా స్పష్టంగా చూపిస్తూ, గלה యొక్క చెరలోకి తరలింపు భావాన్ని సందర్భంలో నిలుపుతుంది.
- source_word: נְבוּכַדְנֶאצַּר
  choice: నెబుకద్నెజరు
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన, హీబ్రూ నామానికి దగ్గరైన రూపం.
- source_word: מֶלֶךְ בָּבֶל
  choice: బబులోను రాజు
  rationale: సహజమైన తెలుగు సంబంధ నిర్మాణం.
theological_decisions:
- issue: ఎస్తేరు 2:6లో సంబంధవాచక ఉపవాక్యపు పూర్వపదం
  choice: ప్రధాన పాఠంలో ఈ ఉపవాక్యం మొర్దెకైని సూచిస్తున్నట్లుగా అనువదించబడింది.
  alternative: యెకొన్యా చెర తరాల క్రితం జరిగినందున, ఈ ఉపవాక్యం మొర్దెకై పూర్వికుడైన కీషును సూచిస్తుందని అర్థం చేసుకోవచ్చు.
  rationale: హీబ్రూ వాక్యప్రవాహంలో సమీప వ్యక్తిగత పూర్వపదం మొర్దెకై; అందువల్ల ప్రధాన పాఠం ఉపరితల వ్యాకరణాన్ని అనుసరిస్తుంది. అయితే కాలక్రమ సంబంధమైన నిజమైన సందిగ్ధతను పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూలోని దీర్ఘ సంబంధవాచక శ్రేణిని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, మూడు సార్లు వచ్చే చెరలోకి తరలింపు భావాన్ని నిలిపింది.
