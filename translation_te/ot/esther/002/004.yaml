  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַֽ/נַּעֲרָ֗ה אֲשֶׁ֤ר תִּיטַב֙ בְּ/עֵינֵ֣י הַ/מֶּ֔לֶךְ תִּמְלֹ֖ךְ תַּ֣חַת וַשְׁתִּ֑י וַ/יִּיטַ֧ב הַ/דָּבָ֛ר בְּ/עֵינֵ֥י הַ/מֶּ֖לֶךְ וַ/יַּ֥עַשׂ כֵּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/004.yaml
  text: And let the young woman who pleases the king become queen instead of Vashti[a]. The proposal pleased the king[c][b], and he did so.
translation:
  language: te
  text: “రాజుకు నచ్చిన యువతి వష్తీకి బదులుగా రాణి కావాలి[a][b].” ఆ ప్రతిపాదన రాజుకు నచ్చింది[c]; అతడు అలాగే చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజు దృష్టిలో మంచిదిగా కనిపించిన యువతి.” హీబ్రూ నుడికారం అక్షరార్థంగా “రాజు కళ్లలో మంచిదిగా ఉన్న” అని చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వష్తీకి బదులుగా ఏలాలి.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆ విషయం రాజు దృష్టిలో మంచిదిగా అనిపించింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: యువతి
  rationale: నַעֲרָה యౌవనస్థురాలైన స్త్రీని సూచిస్తుంది. ‘యువతి’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, చిన్నపిల్ల అనే అనవసర భావాన్ని కలిగించదు.
- source_word: אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ
  choice: రాజుకు నచ్చిన
  rationale: ‘రాజు కళ్లకు మంచిదిగా ఉండడం’ అనే హీబ్రూ నుడికారానికి ‘రాజుకు నచ్చిన’ అనేది సంక్షిప్తమైన, సహజమైన తెలుగు రూపం; ఇది రాజు తీర్పులో ఆమోదయోగ్యంగా ఉండడాన్ని తెలియజేస్తుంది.
- source_word: תִּמְלֹךְ
  choice: రాణి కావాలి
  rationale: మָלַךְ అనే క్రియ మౌలికంగా ‘ఏలు/పాలించు’ అని అర్థం. అయితే వష్తి స్థానంలో మరొక స్త్రీని ఎన్నుకునే ఈ సందర్భంలో, స్త్రీలింగ క్రియ సూచించే రాజపదవిని తెలుగులో సహజంగా ‘రాణి కావాలి’ అని వ్యక్తం చేశాం; ప్రత్యక్ష రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: תַּחַת וַשְׁתִּי
  choice: వష్తికి బదులుగా
  rationale: ఇక్కడ תַּחַת స్థలపరంగా ‘కింద’ అని కాక, ఒకరి స్థానాన్ని మరొకరు భర్తీ చేయడాన్ని సూచిస్తుంది.
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ
  choice: ఆ ప్రతిపాదన రాజుకు నచ్చింది
  rationale: ముందటి వచనాల్లో సూచించిన కార్యాచరణను דָּבָר ఇక్కడ సూచిస్తున్నందున ‘ప్రతిపాదన’ సందర్భోచితం. పునరావృతమైన ‘కళ్లలో మంచిదిగా ఉండడం’ అనే నుడికారాన్ని సహజంగా ‘నచ్చింది’ అని అనువదించాం.
- source_word: וַיַּעַשׂ כֵּן
  choice: అతడు అలాగే చేశాడు
  rationale: రాజు ఆ ప్రతిపాదన ప్రకారం వ్యవహరించాడని తెలిపే కథన సూత్రానికి ఇది సరళమైన, సహజమైన తెలుగు రూపం.
