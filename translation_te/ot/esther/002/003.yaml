id: EST.2.3
reference: Esther 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יַפְקֵ֨ד הַ/מֶּ֣לֶךְ פְּקִידִים֮ בְּ/כָל מְדִינ֣וֹת מַלְכוּת/וֹ֒ וְ/יִקְבְּצ֣וּ אֶת כָּל נַעֲרָֽה בְ֠תוּלָה טוֹבַ֨ת מַרְאֶ֜ה אֶל שׁוּשַׁ֤ן הַ/בִּירָה֙ אֶל בֵּ֣ית הַ/נָּשִׁ֔ים אֶל יַ֥ד הֵגֶ֛א סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וְ/נָת֖וֹן תַּמְרוּקֵי/הֶֽן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/003.yaml
  text: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
translation:
  language: te
  text: రాజు తన రాజ్యంలోని అన్ని ప్రాంతాల్లో అధికారులను నియమించాలి. వారు చూడటానికి అందంగా ఉన్న ప్రతి యువ కన్యను షూషను కోటకు, స్త్రీల గృహానికి[a], స్త్రీల సంరక్షకుడైన రాజు నపుంసకుడు హేగై ఆధీనంలోకి సమకూర్చాలి. వారికి సౌందర్య సాధనాలు[b] ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అంతఃపురానికి.’ హీబ్రూలో అక్షరార్థంగా ‘స్త్రీల గృహానికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారికి సౌందర్య చికిత్సలు అందించాలి.’ హీబ్రూ పదం సౌందర్య లేపనాలను లేదా అందాన్ని మెరుగుపరిచే చికిత్సలను విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַפְקֵד / פְּקִידִים
  choice: అధికారులను నియమించాలి
  rationale: హిఫిల్ రూపం పరిపాలనా పనికోసం అధికారులను నియమించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన పరిపాలనా పదబంధం.
- source_word: מְדִינוֹת מַלְכוּתוֹ
  choice: తన రాజ్యంలోని అన్ని ప్రాంతాల్లో
  rationale: మְדִינוֹת సామ్రాజ్యపు పరిపాలనా విభాగాలను సూచిస్తుంది. ‘ప్రాంతాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וְיִקְבְּצוּ
  choice: సమకూర్చాలి
  rationale: రాజాజ్ఞ ప్రకారం వ్యక్తులను ఒకచోటికి రప్పించే భావాన్ని, ప్రతిపాదనలోని ఆజ్ఞార్థక క్రమాన్ని తెలియజేస్తుంది.
- source_word: כָּל נַעֲרָה בְתוּלָה
  choice: ప్రతి కన్యను
  rationale: ‘కన్య’ యౌవనంతోపాటు కన్యత్వాన్ని కూడా సహజంగా సూచిస్తుంది; ‘ప్రతి’ అనే సమగ్రతను నిలుపుతుంది.
- source_word: טוֹבַת מַרְאֶה
  choice: చూడటానికి అందంగా ఉన్న
  rationale: అక్షరార్థంగా ‘రూపంలో మంచిది’; దృశ్య రూపంపై ఉన్న ప్రాధాన్యాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: షూషను కోట
  rationale: הַבִּירָה నగరంలోని కోటగల రాజ సముదాయాన్ని సూచిస్తుంది; ‘కోట’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: בֵּית הַנָּשִׁים
  choice: స్త్రీల గృహం
  rationale: హీబ్రూ పదబంధాన్ని పారదర్శకంగా అనువదించి, మరింత వ్యాఖ్యానాత్మకమైన ‘అంతఃపురం’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఉంచింది.
- source_word: אֶל יַד הֵגֶא
  choice: హేగై ఆధీనంలోకి
  rationale: ‘చేతిలోకి’ అనే హీబ్రూ నుడికారానికి ఇక్కడ అధికారం లేదా సంరక్షణ కింద ఉంచడం అనే భావం.
- source_word: סְרִיס
  choice: నపుంసకుడు
  rationale: పర్షియా రాజాస్థాన సందర్భంలో ‘అధికారి’ అనే విస్తృత భావం సాధ్యమైనా, స్త్రీల గృహ సందర్భంలో మూలపదపు సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: స్త్రీల సంరక్షకుడు
  rationale: హేగై బాధ్యతను సూచించే కృదంత బిరుదును సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְנָתוֹן תַּמְרוּקֵיהֶן
  choice: వారికి సౌందర్య సాధనాలు ఇవ్వాలి
  rationale: తమ్రూకీమ్ అందాన్ని మెరుగుపరచే లేపనాలు లేదా సిద్ధీకరణలను సూచిస్తుంది; ‘సౌందర్య సాధనాలు’ విస్తృతమైన, సులభంగా అర్థమయ్యే పదం.
