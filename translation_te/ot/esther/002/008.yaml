revisions:
- from: రాజు ఆజ్ఞ, అతని శాసనం ప్రకటించబడినప్పుడు, అనేకమంది యువతులు షూషను కోటకు తీసుకువచ్చి హేగై సంరక్షణలో ఉంచబడినప్పుడు, ఎస్తేరు కూడా రాజగృహానికి తీసుకువెళ్లబడి, స్త్రీల సంరక్షకుడైన హేగై సంరక్షణలో ఉంచబడింది.[a]
  to: రాజు ఆజ్ఞ, అతని శాసనం వినబడినప్పుడు, అనేకమంది యువతులను షూషను దుర్గనగరానికి హేగై ఆధీనంలోకి[a] సమకూర్చినప్పుడు, ఎస్తేరు కూడా రాజగృహానికి తీసుకుపోబడింది—స్త్రీల కాపలాదారుడైన హేగై ఆధీనంలోకి.[a]
  rationale: The revision renders the source's 'was heard' without specifying proclamation, retains the passive and non-voluntary implication of Esther's being taken, and uses one consistently anchored note for both instances of the Hebrew idiom meaning placement under Hegai's authority. It retains the formal narrative register and avoids doctrinal or unnecessary historical elaboration.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T07:30:43Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the paired temporal clauses, the gathering of many young women at Susa, Esther's passive removal, and Hegai's supervisory role. However, 'ప్రకటించబడినప్పుడు' narrows the passive Hebrew 'when ... was heard' to formal proclamation, and the two occurrences of אֶל־יַד ('into the hand/custody of') should be represented consistently and anchored where they occur.
  naturalness: The narrative is generally clear and modern. 'హేగై ఆధీనంలోకి' is more idiomatic and more accurately conveys placement under authority than 'సంరక్షణలో'; it also avoids suggesting benevolent protection. 'దుర్గనగరం' clearly expresses the place designation 'Susa the citadel.'
  terminology: '''ఆజ్ఞ'' and ''శాసనం'' suitably render the royal command and decree. ''యువతులు,'' ''రాజగృహం,'' and ''స్త్రీల కాపలాదారుడు'' preserve the register and relevant ambiguity without importing details not stated in this verse.'
  issues:
  - severity: medium
    issue: The phrase 'ప్రకటించబడినప్పుడు' is more specific than the Hebrew passive infinitive בְּהִשָּׁמַע.
    rationale: The source says that the king's command and decree were 'heard.' They may have been made known publicly, but 'proclaimed' adds a mode of communication not explicitly expressed.
  - severity: low
    issue: The note for the idiom אֶל־יַד is anchored only after its second occurrence.
    rationale: The idiom occurs both in the gathering of the young women and in Esther's being taken to the king's house. Anchoring the same note at both occurrences makes the lexical explanation transparent.
  - severity: low
    issue: '''సంరక్షణలో'' can imply protective care.'
    rationale: In this administrative setting, 'ఆధీనంలోకి' more directly conveys the authority/custody sense of the Hebrew idiom without a benevolent implication.
  revised_text: రాజు ఆజ్ఞ, అతని శాసనం వినబడినప్పుడు, అనేకమంది యువతులను షూషను దుర్గనగరానికి హేగై ఆధీనంలోకి[a] సమకూర్చినప్పుడు, ఎస్తేరు కూడా రాజగృహానికి తీసుకుపోబడింది—స్త్రీల కాపలాదారుడైన హేగై ఆధీనంలోకి.[a]
