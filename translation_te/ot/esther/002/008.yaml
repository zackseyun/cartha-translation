source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִשָּׁמַ֤ע דְּבַר הַ/מֶּ֨לֶךְ֙ וְ/דָת֔/וֹ וּֽ/בְ/הִקָּבֵ֞ץ נְעָר֥וֹת רַבּ֛וֹת אֶל שׁוּשַׁ֥ן הַ/בִּירָ֖ה אֶל יַ֣ד הֵגָ֑י וַ/תִּלָּקַ֤ח אֶסְתֵּר֙ אֶל בֵּ֣ית הַ/מֶּ֔לֶךְ אֶל יַ֥ד הֵגַ֖י שֹׁמֵ֥ר הַ/נָּשִֽׁים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/008.yaml
  text: And when the king’s command and his decree were heard[a], and when many young women were gathered to Susa the citadel into the custody of Hegai, Esther also was taken into the king’s house, into the custody of Hegai[b], keeper of the women.
translation:
  language: te
  text: రాజు ఆజ్ఞ, అతని శాసనం వినబడినప్పుడు, అనేకమంది యువతులను షూషను దుర్గనగరానికి హేగై ఆధీనంలోకి[a] సమకూర్చినప్పుడు, ఎస్తేరు కూడా రాజగృహానికి తీసుకుపోబడింది—స్త్రీల కాపలాదారుడైన హేగై ఆధీనంలోకి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘హేగై ఆధీనంలోకి’—అక్షరార్థంగా ‘హేగై చేతికి’; అంటే అతని అధికారం లేదా పర్యవేక్షణ కిందకు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַמֶּלֶךְ
  choice: రాజు ఆజ్ఞ
  rationale: రాజసభ సందర్భంలో דָּבָר అధికారిక ఆదేశాన్ని సూచిస్తుంది; ‘ఆజ్ఞ’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: דָת
  choice: శాసనం
  rationale: పర్షియా రాజసభ సందర్భంలోని అధికారిక decree భావాన్ని ‘శాసనం’ గంభీరంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּהִשָּׁמַע
  choice: ప్రకటించబడినప్పుడు
  rationale: అక్షరార్థంగా ‘వినబడినప్పుడు’; ఇక్కడ రాజాజ్ఞ ప్రజలకు తెలియజేయబడిన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נְעָרוֹת רַבּוֹת
  choice: అనేకమంది యువతులు
  rationale: వివాహయోగ్య వయస్సులోని యువ స్త్రీలను సూచిస్తుంది; ఈ వచనంలోనే లేని కన్యత్వ భావాన్ని చేర్చదు.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: షూషను కోట
  rationale: బీరా అనే పదం రాజసంబంధమైన కోట లేదా దుర్గ ప్రాంగణాన్ని సూచిస్తుంది; ‘కోట’ సాధారణ పాఠకులకు స్పష్టం.
- source_word: אֶל יַד
  choice: సంరక్షణలో
  rationale: అక్షరార్థంగా ‘చేతికి’; సందర్భంలో అధికారం, పర్యవేక్షణ కింద ఉంచడాన్ని సూచించే సహజ తెలుగు నుడికారం.
- source_word: וַתִּלָּקַח
  choice: తీసుకువెళ్లబడి
  rationale: హీబ్రూ నిష్క్రియ రూపాన్ని నిలుపుతూ ఎస్తేరు స్వయంగా వెళ్లలేదనే భావాన్ని చూపుతుంది; ‘పట్టుకొనిపోబడింది’ అనడం బలవంతాన్ని అతిగా నిర్దిష్టం చేస్తుంది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజగృహం
  rationale: అక్షరార్థమైన ‘రాజు ఇల్లు’ను దగ్గరగా అనుసరిస్తూనే, రాజభవన సముదాయాన్ని సూచించే గౌరవప్రదమైన సహజ పదం.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: స్త్రీల సంరక్షకుడు
  rationale: కాపాడటం, పర్యవేక్షించడం అనే participial భావాన్ని తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని రెండు కాలసూచక ఉపవాక్యాలను నిలిపి, నిష్క్రియ రూపాల ద్వారా యువతుల సమీకరణలోనూ ఎస్తేరు తీసుకువెళ్లబడటంలోనూ వారి స్వచ్ఛందతను ఊహించి చేర్చకుండా ఉంచింది.
