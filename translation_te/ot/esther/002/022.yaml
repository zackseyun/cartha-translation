id: EST.2.22
reference: Esther 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּוָּדַ֤ע הַ/דָּבָר֙ לְ/מָרְדֳּכַ֔י וַ/יַּגֵּ֖ד לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֑ה וַ/תֹּ֧אמֶר אֶסְתֵּ֛ר לַ/מֶּ֖לֶךְ בְּ/שֵׁ֥ם מָרְדֳּכָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/022.yaml
  text: When the matter became known to Mordecai[a], he told Queen Esther[c][b], and Esther told the king in Mordecai's name.
translation:
  language: te
  text: ఆ విషయం మొర్దెకైకి తెలిసినప్పుడు[a], అతడు దానిని ఎస్తేరు రాణికి తెలియజేశాడు. ఎస్తేరు మొర్దెకై పేరున రాజుకు ఆ విషయం తెలియజేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ విషయం మొర్దెకైకి తెలియజేయబడినప్పుడు.’ హీబ్రూ నిష్క్రియాత్మక రూపం ఆ విషయం అతనికి తెలిసిందనే భావాన్నిగానీ, ఎవరో అతనికి తెలియజేశారనే భావాన్నిగానీ ముందుకు తేవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּדַע
  choice: తెలిసినప్పుడు
  rationale: ידע నిఫాల్ రూపం ఆ విషయం మొర్దెకై జ్ఞానానికి వచ్చిందనే నిష్క్రియాత్మక భావాన్ని ఇస్తుంది; ఎవరు తెలియజేశారో పేర్కొనకుండా సహజమైన తెలుగులో దీనిని వ్యక్తం చేస్తుంది.
- source_word: הַדָּבָר
  choice: ఆ విషయం
  rationale: דבר విస్తృతార్థక పదం; సమీప సందర్భంలోని కుట్రను సూచించినా, మూలంలో ఉన్న సాధారణతను ‘ఆ విషయం’ కాపాడుతుంది.
- source_word: לְמָרְדֳּכַי
  choice: మొర్దెకైకి
  rationale: లామెద్ ఉపసర్గ సమాచారాన్ని తెలుసుకున్న వ్యక్తిని సూచిస్తుంది; తెలుగు సంప్రదాన విభక్తి మూల వాక్యనిర్మాణాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וַיַּגֵּד
  choice: తెలియజేశాడు
  rationale: נגד హిఫిల్ ఇక్కడ చెప్పడం లేదా నివేదించడం అనే భావం ఇస్తుంది; ‘తెలియజేశాడు’ రాజసభా కథనానికి తగిన స్పష్టమైన ఆధునిక తెలుగు.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: ఎస్తేరు రాణికి
  rationale: హీబ్రూ పదబంధంలోని ‘ఎస్తేరు, రాణి’ అనే అన్వయాన్ని సహజ తెలుగు క్రమంలో ఉంచి ఆమె రాజబిరుదును నిలుపుతుంది.
- source_word: וַתֹּאמֶר
  choice: తెలియజేసింది
  rationale: אמר సాధారణంగా ‘చెప్పింది’; ఇక్కడ నివేదికను రాజుకు చేరవేసే సందర్భంలో ‘తెలియజేసింది’ సహజంగా ఉండి సమాచార ప్రసారాన్ని స్పష్టం చేస్తుంది.
- source_word: לַמֶּלֶךְ
  choice: రాజుకు
  rationale: ఉపసర్గతో కూడిన హీబ్రూ పదబంధాన్ని నేరుగా, సహజమైన తెలుగు సంప్రదాన విభక్తితో అందిస్తుంది.
- source_word: בְּשֵׁם מָרְדֳּכָי
  choice: మొర్దెకై పేరున
  rationale: בשם పదబంధాన్ని సంక్షిప్తంగా ప్రతిబింబిస్తూ, ఎస్తేరు నివేదికకు మొర్దెకైని మూలంగా గుర్తించిందనే భావాన్ని కాపాడుతుంది; ‘తరఫున’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, రాజసభా కథనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని నిష్క్రియాత్మక అనిశ్చితిని పాదసూచికలో నిలిపి, בשם అనే మూలపదబంధాన్ని ‘పేరున’గా సంక్షిప్తంగా అనువదించాం.
