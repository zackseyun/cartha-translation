  terminology: 'Names and title are well rendered: ‘మొర్దెకై,’ ‘ఎస్తేరు రాణి,’ and ‘రాజు.’ The footnote correctly explains the Niphal passive/inchoative ambiguity of וַיִּוָּדַע.'
