  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בָּ/עֶ֣רֶב הִ֣יא בָאָ֗ה וּ֠/בַ/בֹּקֶר הִ֣יא שָׁבָ֞ה אֶל בֵּ֤ית הַ/נָּשִׁים֙ שֵׁנִ֔י אֶל יַ֧ד שַֽׁעֲשְׁגַ֛ז סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/פִּֽילַגְשִׁ֑ים לֹא תָב֥וֹא עוֹד֙ אֶל הַ/מֶּ֔לֶךְ כִּ֣י אִם חָפֵ֥ץ בָּ֛/הּ הַ/מֶּ֖לֶךְ וְ/נִקְרְאָ֥ה בְ/שֵֽׁם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/014.yaml
  text: In the evening she would go in[a], and in the morning she would return to the second house of the women, into the care of Shaashgaz, the king’s eunuch, keeper of the concubines[b]. She would not go in again to the king unless the king delighted in her and she was summoned by name.
translation:
  language: te
  text: సాయంత్రం ఆమె లోపలికి వెళ్లేది[b]; ఉదయం ఉపపత్నుల సంరక్షకుడైన రాజు నపుంసకుడు షయష్గజు ఆధీనంలోని స్త్రీల రెండవ గృహానికి తిరిగి వెళ్లేది. రాజు ఆమెను ఇష్టపడి, ఆమె పేరుతో పిలువబడితే తప్ప ఆమె మళ్లీ రాజు దగ్గరికి వెళ్లేది కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘లోపలికి వెళ్లడం,’ ‘రాజు దగ్గరికి వెళ్లడం’ అనే మాటలు రాజు గదిలోకి లేదా సన్నిధిలోకి ప్రవేశించడాన్ని సూచించే హీబ్రూ నుడికారాలు; సందర్భం లైంగిక సంబంధాన్ని సూచిస్తున్నా, మూలపాఠం దాన్ని నేరుగా చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֶרֶב
  choice: సాయంత్రం
  rationale: కాలాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בָאָה
  choice: ఆమె లోపలికి వెళ్లేది
  rationale: మూల క్రియ అక్షరార్థంగా ‘వచ్చింది’ అయినా, సందర్భంలో రాజు గదిలోకి లేదా సన్నిధిలోకి ప్రవేశించడాన్ని సూచిస్తుంది. అపరోక్షతను నిలుపుతూ అలవాటుగా జరిగే గత చర్యను తెలిపేందుకు ‘వెళ్లేది’ వాడబడింది.
- source_word: וּבַבֹּקֶר ... שָׁבָה
  choice: ఉదయం ... తిరిగి వచ్చేది
  rationale: ఉదయకాల క్రమాన్ని, తిరిగి వెళ్లడం అనే క్రియార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית הַנָּשִׁים שֵׁנִי
  choice: స్త్రీల రెండవ గృహం
  rationale: హీబ్రూ పదబంధంలోని ‘స్త్రీల గృహం, రెండవది’ అనే నిర్మాణాన్ని సాధ్యమైనంత నేరుగా నిలుపుతుంది; ‘అంతఃపురం’ అనే వ్యాఖ్యాత్మక ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: אֶל יַד
  choice: సంరక్షణలోకి
  rationale: అక్షరార్థమైన ‘చేతికి’ అనే హీబ్రూ నుడికారానికి ఇక్కడ ఒకరి బాధ్యత లేదా ఆధీనంలో ఉండడం అనే అర్థం ఉంది.
- source_word: שַׁעֲשְׁגַז
  choice: షయష్గజు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: סְרִיס הַמֶּלֶךְ
  choice: రాజు నపుంసక అధికారి
  rationale: పర్షియా రాజసభ సందర్భంలో סריס సాధారణ అధికారిని కూడా సూచించగలిగినా, ఇక్కడ నపుంసక రాజోద్యోగి అనే నిర్దిష్ట అర్థమే ఎక్కువ సంభావ్యమైనది; ‘అధికారి’ అతని రాజసభ పాత్రను స్పష్టం చేస్తుంది.
- source_word: שֹׁמֵר הַפִּילַגְשִׁים
  choice: ఉపపత్నుల పర్యవేక్షకుడు
  rationale: కాపాడే లేదా బాధ్యత వహించే వ్యక్తి అనే కృదంత భావాన్ని, פילגשים అనే పదానికి ‘ఉపపత్నులు’ అనే గౌరవప్రదమైన చారిత్రక పదంతో అందిస్తుంది.
- source_word: לֹא תָבוֹא עוֹד אֶל הַמֶּלֶךְ
  choice: ఆమె మళ్లీ రాజు దగ్గరికి వెళ్లేది కాదు
  rationale: రాజు సన్నిధికి లేదా గదికి ప్రవేశించడం అనే హీబ్రూ నుడికారంలోని అపరోక్షతను నిలుపుతుంది; עוֹד భావాన్ని ‘మళ్లీ’ తెలియజేస్తుంది.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: ఒక్క మినహాయింపును సహజమైన తెలుగు షరతు నిర్మాణంతో తెలియజేస్తుంది.
- source_word: חָפֵץ בָּהּ
  choice: రాజుకు ఆమెపై ఇష్టం కలిగి
  rationale: ఈ క్రియలో ఇష్టపడడం, ఆనందించడం, కోరుకోవడం అనే భావవ్యాప్తి ఉంది. కేవలం లైంగిక కోరికగా కుదించకుండా సందర్భానికి సరిపోయే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וְנִקְרְאָה בְשֵׁם
  choice: ఆమెను పేరుపెట్టి పిలిపిస్తే
  rationale: ఆమె ప్రత్యేకంగా పేరుతో పిలవబడడం అనే నిష్క్రియ భావాన్ని సహజమైన తెలుగు రాజసభ ప్రయోగంలో వ్యక్తం చేస్తుంది.
