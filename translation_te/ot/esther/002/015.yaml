source:
  edition: WLC
  text: וּ/בְ/הַגִּ֣יעַ תֹּר אֶסְתֵּ֣ר בַּת אֲבִיחַ֣יִל דֹּ֣ד מָרְדֳּכַ֡י אֲשֶׁר֩ לָקַֽח ל֨/וֹ לְ/בַ֜ת לָ/ב֣וֹא אֶל הַ/מֶּ֗לֶךְ לֹ֤א בִקְשָׁה֙ דָּבָ֔ר כִּ֠י אִ֣ם אֶת אֲשֶׁ֥ר יֹאמַ֛ר הֵגַ֥י סְרִיס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וַ/תְּהִ֤י אֶסְתֵּר֙ נֹשֵׂ֣את חֵ֔ן בְּ/עֵינֵ֖י כָּל רֹאֶֽי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/015.yaml
  text: When Esther’s turn came—the daughter of Abihail[a], the uncle of Mordecai, who had taken her as his own daughter—to go in to the king, she asked for nothing except what Hegai, the king’s eunuch, keeper of the women, advised[b]. And Esther was gaining favor in the eyes of all who saw her.
translation:
  language: te
  text: మొర్దెకై తన కుమార్తెగా స్వీకరించుకున్న, మొర్దెకై మేనమామ అయిన అబీహయీలు కుమార్తె ఎస్తేరు రాజు దగ్గరకు వెళ్లే వంతు వచ్చినప్పుడు, స్త్రీల సంరక్షకుడైన రాజు నపుంసకుడు హేగై సూచించినది తప్ప ఆమె మరేమీ కోరలేదు.[a] ఆమెను చూసిన వారందరి దృష్టిలో ఎస్తేరు మెప్పు పొందుతూ ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నపుంసకుడు’ అనే పదాన్ని కొన్ని సందర్భాల్లో ‘రాజోద్యోగి’ అని విస్తృతంగా అనువదించవచ్చు; అయితే ఇక్కడి అంతఃపుర సందర్భం నిర్దిష్టమైన అర్థానికే అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַגִּיעַ תֹּר
  choice: వంతు వచ్చినప్పుడు
  rationale: కాలాన్ని సూచించే క్రియారూపాన్నీ, రాజు ఎదుటికి వెళ్లేందుకు క్రమంలో వచ్చిన ఆమె వంతునూ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: דֹּד מָרְדֳּכַי
  choice: మొర్దెకై మేనమామ
  rationale: దోద్ అనే బంధుత్వపదం ఇక్కడ పురుష పూర్వతరపు బంధువును సూచిస్తుంది; ఎస్తేరు 2:7లోని సంబంధం ప్రకారం అబీహయీలు మొర్దెకై మేనమామ. తెలుగు ‘మామ’లో ఉండే అస్పష్టతను తగ్గించేందుకు ‘మేనమామ’ ఎంచుకున్నాం.
- source_word: לָקַח לוֹ לְבַת
  choice: తనకు కుమార్తెగా స్వీకరించిన
  rationale: ఆమెను కుమార్తె స్థానంలో తన సంరక్షణలోకి తీసుకున్నాడనే హెబ్రీ నుడికారాన్ని తెలియజేస్తుంది; పాఠ్యంలో లేని నిర్దిష్ట చట్టపరమైన దత్తత ప్రక్రియను నిర్బంధంగా సూచించదు.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: రాజు దగ్గరికి వెళ్లే
  rationale: రాజు సన్నిధిలో ప్రవేశించడాన్ని తెలిపే మర్యాదపూర్వక నుడికారాన్ని కాపాడుతుంది; సందర్భంలోని లైంగిక సూచనను మూలం కంటే స్పష్టంగా చేయదు.
- source_word: כִּי אִם אֵת אֲשֶׁר יֹאמַר
  choice: సూచించినది తప్ప
  rationale: యోమర్ అక్షరార్థంగా ‘చెప్పేది’ అయినా, ఇక్కడ హేగై ఎంచి చెప్పిన వస్తువులను సూచిస్తుంది. ‘సూచించినది’ సందర్భానుగుణంగా సహజంగా ఉంది.
- source_word: סְרִיס
  choice: నపుంసకుడు
  rationale: రాజ అంతఃపుర సందర్భంలో ఈ పదానికి ఉన్న నిర్దిష్టమైన సాధారణ అర్థాన్ని నిలుపుతుంది; కేవలం ‘అధికారి’ అని సాధారణీకరించదు.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: స్త్రీల సంరక్షకుడు
  rationale: రాజభవనంలోని స్త్రీల బాధ్యత వహించే హేగై పదవిని సహజంగా తెలియజేస్తుంది.
- source_word: נֹשֵׂאת חֵן בְּעֵינֵי
  choice: దృష్టిలో ఆదరణ పొందుతూ ఉండేది
  rationale: ‘కృపను మోసేది’ అనే హెబ్రీ నుడికార భావాన్ని, కొనసాగుతున్న కథన చర్యతో సహా, స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: כָּל רֹאֶיהָ
  choice: ఆమెను చూసిన వారందరి
  rationale: మూలంలోని సమగ్ర భావాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: లָקַח לוֹ לְבַתలోని కుటుంబ సంబంధ స్వభావం
  choice: తనకు కుమార్తెగా స్వీకరించిన
  alternative: ఆమెను దత్తత తీసుకున్న
  rationale: మొర్దెకై ఆమెను కుమార్తె స్థానంలో సంరక్షించాడనే భావాన్ని కాపాడుతూ, ఆధునిక చట్టపరమైన దత్తత ప్రక్రియను పాఠ్యంలోకి చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. పొడవైన హెబ్రీ సంబంధవాచక నిర్మాణాన్ని డాష్‌తో స్పష్టీకరించాం. ‘మేనమామ కుమార్తె’ ద్వారా ఎస్తేరు మొర్దెకైకి బంధువని సహజంగా తెలియజేశాం; ‘రాజు దగ్గరికి వెళ్లడం’ అనే సంయమిత మూల నుడికారాన్ని నిలిపాం.
