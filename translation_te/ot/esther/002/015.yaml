revisions:
- from: మొర్దెకై తనకు కుమార్తెగా స్వీకరించిన అబీహయీలు కుమార్తె ఎస్తేరు—అంటే మొర్దెకై మేనమామ కుమార్తె—రాజు దగ్గరికి వెళ్లే వంతు వచ్చినప్పుడు, రాజు నపుంసకుడూ స్త్రీల సంరక్షకుడూ అయిన హేగై సూచించినది తప్ప ఆమె మరేమీ కోరలేదు.[a] ఎస్తేరును చూసిన వారందరి దృష్టిలో ఆమె ఆదరణ పొందుతూ ఉండేది.
  to: మొర్దెకై తన కుమార్తెగా స్వీకరించుకున్న, మొర్దెకై మేనమామ అయిన అబీహయీలు కుమార్తె ఎస్తేరు రాజు దగ్గరకు వెళ్లే వంతు వచ్చినప్పుడు, స్త్రీల సంరక్షకుడైన రాజు నపుంసకుడు హేగై సూచించినది తప్ప ఆమె మరేమీ కోరలేదు.[a] ఆమెను చూసిన వారందరి దృష్టిలో ఎస్తేరు మెప్పు పొందుతూ ఉండేది.
  rationale: The revision corrects the genealogical syntax so that Abihail—not Esther—is explicitly identified as Mordecai's uncle, while Esther remains Abihail's daughter. It retains the source's restrained courtly wording, Hegai's advisory role, and the ongoing sense of Esther gaining favor.
