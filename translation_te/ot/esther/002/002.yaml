translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘యువకులు’ మరియు ‘పరిచర్య చేసే’ అనే పదాలతో మూలంలోని వయస్సు-సేవా పదభేదం నిలుపబడింది; ‘కన్యలు’ ద్వారా virginity భావం స్పష్టంగా ఉంచబడింది.
