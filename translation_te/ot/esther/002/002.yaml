  text: וַ/יֹּאמְר֥וּ נַעֲרֵֽי הַ/מֶּ֖לֶךְ מְשָׁרְתָ֑י/ו יְבַקְשׁ֥וּ לַ/מֶּ֛לֶךְ נְעָר֥וֹת בְּתוּל֖וֹת טוֹב֥וֹת מַרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/002.yaml
  text: Then the king’s young men who attended him said[b][a], “Let young virgins beautiful in appearance be sought for the king.”
translation:
  language: te
  text: అప్పుడు రాజు వద్ద పరిచర్య చేసే యువకులు, “చూడడానికి అందమైన యువ కన్యలను రాజు కోసం వెదకనివ్వండి,” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు ... అన్నారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: రాజుకు ... యువకులు
  rationale: נַעַר ఇక్కడ యువకులను సూచిస్తుంది; తరువాతి מְשָׁרְתָיו వారి సేవా పాత్రను విడిగా తెలుపుతుంది కాబట్టి రెండింటి భేదాన్ని నిలిపాం.
- source_word: מְשָׁרְתָיו
  choice: పరిచర్య చేసే
  rationale: שׁרת ధాతువు నుంచి వచ్చిన ఈ కృదంతం రాజుకు వ్యక్తిగతంగా సేవచేసే లేదా హాజరుండే వారిని సూచిస్తుంది; సంబంధార్థక నిర్మాణం తెలుగులో సహజంగా ఉంటుంది.
- source_word: יְבַקְשׁוּ
  choice: వెదకనివ్వండి
  rationale: మూలంలోని క్రియ కర్తరి బహువచన ఆదేశార్థక రూపం—‘వారు వెదకాలి/వెదకనివ్వండి’; నిర్దిష్టంగా చెప్పని కార్యనిర్వాహకులను జోడించకుండా ఆదేశ భావాన్ని నిలుపుతుంది.
- source_word: לַמֶּלֶךְ
  choice: రాజు కోసం
  rationale: ప్రయోజనార్థక దత్తివును సూటిగా వ్యక్తం చేస్తుంది; అదనపు ఉద్దేశాన్ని చేర్చదు.
- source_word: נְעָרוֹת בְּתוּלוֹת
  choice: యువ కన్యలను
  rationale: రెండు పదాల భావాన్ని నిలుపుతూ, వివాహయోగ్య వయస్సులోని యువ స్త్రీలని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: טוֹבוֹת מַרְאֶה
  choice: చూడడానికి అందమైన
  rationale: అక్షరార్థంగా ‘రూపంలో మంచివారు’; ఇది బాహ్య రూప సౌందర్యాన్ని సూచిస్తుంది. ‘చూడడానికి అందమైన’ ఆ భావాన్ని సహజంగా, స్పష్టంగా అందిస్తుంది.
