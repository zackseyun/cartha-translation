source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/מֶּ֜לֶךְ מִשְׁתֶּ֣ה גָד֗וֹל לְ/כָל שָׂרָי/ו֙ וַ/עֲבָדָ֔י/ו אֵ֖ת מִשְׁתֵּ֣ה אֶסְתֵּ֑ר וַ/הֲנָחָ֤ה לַ/מְּדִינוֹת֙ עָשָׂ֔ה וַ/יִּתֵּ֥ן מַשְׂאֵ֖ת כְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/018.yaml
  text: Then the king gave a great banquet for all his officials and servants—the banquet of Esther—and he granted relief to the provinces and gave gifts according to the king’s bounty[a][b].
translation:
  language: te
  text: అప్పుడు రాజు తన అధికారులందరికీ, సేవకులందరికీ ఒక గొప్ప విందు ఇచ్చాడు—అది ఎస్తేరు విందు. అతడు ప్రాంతాలకు ఉపశమనం కలిగించాడు[a], రాజు ఔదార్యానికి తగినట్లుగా కానుకలు ఇచ్చాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రాంతాలకు సెలవు ప్రకటించాడు,’ లేదా ‘ప్రాంతాలకు మినహాయింపు ఇచ్చాడు.’ హీబ్రూ పదం ఉపశమనం, విశ్రాంతి లేదా మినహాయింపు అనే విస్తృత అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘రాజు చేతి ప్రకారం.’ ఇది రాజుకు తగిన ఉదారతను లేదా పరిమాణాన్ని సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתֶּה גָדוֹל
  choice: ఒక గొప్ప విందు
  rationale: מִשְׁתֶּה రాజసభ సందర్భంలో పానభోజన విందును సూచిస్తుంది; ఆధునిక తెలుగులో ‘విందు’ సహజంగా, గౌరవప్రదంగా ఉంది. גָדוֹלను ‘గొప్ప’గా అనువదించాం.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: తన అధికారులందరికీ, సేవకులందరికీ
  rationale: పర్షియా రాజసభ సందర్భంలో שָׂרִים ఉన్నత అధికారులను సూచిస్తుంది; עֲבָדִים యొక్క ప్రాథమిక అర్థమైన ‘సేవకులు’ను నిలిపాం.
- source_word: אֵת מִשְׁתֵּה אֶסְתֵּר
  choice: అది ఎస్తేరు విందు
  rationale: నిర్మాణ సంబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా, ఎస్తేరుతో అనుబంధమైన విందు అనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַהֲנָחָה לַמְּדִינוֹת עָשָׂה
  choice: అతడు సంస్థానాలకు ఉపశమనం కలిగించి
  rationale: הֲנָחָה విశ్రాంతి, ఉపశమనం లేదా మినహాయింపును సూచించగలదు. ‘ఉపశమనం’ దాని విస్తృత భావాన్ని నిలుపుతూ పన్ను మినహాయింపు లేదా సెలవుదినం అని నిర్బంధంగా తేల్చదు.
- source_word: מַשְׂאֵת
  choice: కానుకలు
  rationale: ఈ సందర్భంలో రాజు ప్రసాదించిన బహుమతులు లేదా కానుకలను సూచిస్తుంది; ‘కానుకలు’ సహజమైన, విస్తృతమైన పదం.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: రాజుకు తగిన ఔదార్యంతో
  rationale: అక్షరార్థంగా ‘రాజు చేతికి తగినట్లు’; రాజస్థాయికి సరిపడే ఉదారత లేదా పరిమాణాన్ని తెలిపే నానుడిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּעַשׂ
  choice: విందు ఇచ్చాడు
  rationale: క్రియ అక్షరార్థంగా ‘చేశాడు’; విందును నిర్వహించడం అనే సందర్భార్థానికి తెలుగులో ‘విందు ఇచ్చాడు’ సహజం.
