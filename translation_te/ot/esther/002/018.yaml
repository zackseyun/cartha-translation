  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘సంస్థానాలు’ పర్షియా పరిపాలనా విభాగాలకు సరిపోతుంది. మూలంలోని הֲנָחָה అస్పష్టతను ప్రధాన పాఠంలో ‘ఉపశమనం’తో, ప్రత్యామ్నాయాలను పాదసూచికలో నిలిపాం.
