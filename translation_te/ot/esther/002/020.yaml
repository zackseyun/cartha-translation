    rationale: כַּאֲשֶׁר הָיְתָה בְאָמְנָה אִתּוֹ అంటే ఆమె అతనితో/అతని సంరక్షణలో పెరుగుతున్నప్పటి స్థితిని సూచిస్తుంది; ‘ఆ సమయంలో చేసినట్టే’ అని మూలం వేరొక క్రియను చెప్పదు. ఈ చేర్పు తెలుగులో పోలికకు అస్పష్టతను కలిగిస్తుంది.
