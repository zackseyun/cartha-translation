  text: אֵ֣ין אֶסְתֵּ֗ר מַגֶּ֤דֶת מֽוֹלַדְתָּ/הּ֙ וְ/אֶת עַמָּ֔/הּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה עָלֶ֖י/הָ מָרְדֳּכָ֑י וְ/אֶת מַאֲמַ֤ר מָרְדֳּכַי֙ אֶסְתֵּ֣ר עֹשָׂ֔ה כַּ/אֲשֶׁ֛ר הָיְתָ֥ה בְ/אָמְנָ֖ה אִתּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/020.yaml
  text: Esther had not made known her family line or her people[a], just as Mordecai had commanded her; and Esther kept doing what Mordecai said[b], as when she was under his care.
translation:
  language: te
  text: ఎస్తేరు తన వంశమేమిటో, తన ప్రజలు ఎవరో తెలియజేయలేదు[a], మొర్దెకై ఆమెకు ఆజ్ఞాపించినట్టే. ఎస్తేరు మొర్దెకై మాటను పాటిస్తూ వచ్చింది[b], ఆమె మొర్దెకై సంరక్షణలో పెరుగుతున్నప్పటిలాగే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన వంశం’ అనే చోట ‘తన మూలం’ లేదా ‘తన బంధువర్గం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం జన్మ, వంశం లేదా బంధువర్గాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆమె అతనిచేత పెంచబడుతున్నప్పటిలాగే.’ హీబ్రూ మాటలు మొర్దెకై సంరక్షణలో ఎస్తేరు పెరిగిన మునుపటి కాలాన్ని గుర్తుచేస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... מַגֶּדֶת
  choice: తెలియజేయలేదు
  rationale: నిరాకరణతో కూడిన కృదంత నిర్మాణం, కథలో అప్పటివరకు ఎస్తేరు ఆ విషయాన్ని వెల్లడించలేదనే కొనసాగుతున్న స్థితిని సూచిస్తుంది. తెలుగులో ‘తెలియజేయలేదు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מוֹלַדְתָּהּ
  choice: తన వంశం
  rationale: ఈ పదం జన్మ, మూలం, బంధువర్గం లేదా వంశపరంపరను సూచించగలదు. ‘వంశం’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉండి, ఆమె ప్రజల గుర్తింపుతో జతగా వచ్చే మూలవంశ భావాన్ని నిలుపుతుంది.
- source_word: עַמָּהּ
  choice: తన ప్రజలు
  rationale: עם అనే పదానికి సాధారణ అర్థం ‘ప్రజలు.’ ఇక్కడ అది ఎస్తేరు చెందిన జాతి లేదా జనసమూహాన్ని సూచిస్తుంది; ‘తన ప్రజలు’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: כַּאֲשֶׁר צִוָּה עָלֶיהָ
  choice: మొర్దెకై తనకు ఆజ్ఞాపించినట్టే
  rationale: צוה కేవలం సలహా కాక అధికారపూర్వక ఆదేశాన్ని సూచిస్తుంది. ‘ఆజ్ఞాపించినట్టే’ దాని బలాన్ని నిలుపుతుంది.
- source_word: מַאֲמַר מָרְדֳּכַי
  choice: మొర్దెకై మాట
  rationale: מַאֲמַר మాట, పలుకు లేదా ఆదేశం అనే అర్థాలు కలిగి ఉంది. ముందు వాక్యభాగంలో ‘ఆజ్ఞాపించాడు’ ఉన్నందున, ఇక్కడ ‘మాట’ మూలంలోని పదభేదాన్ని సహజంగా నిలుపుతుంది.
- source_word: עֹשָׂה
  choice: పాటిస్తూ వచ్చింది
  rationale: కృదంత రూపం కొనసాగుతున్న లేదా అలవాటైన చర్యను సూచిస్తుంది. ‘పాటిస్తూ వచ్చింది’ ఎస్తేరు మొర్దెకై మాట ప్రకారం నిరంతరం ప్రవర్తించిందనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְאָמְנָה אִתּוֹ
  choice: అతని సంరక్షణలో పెరుగుతున్నప్పుడు
  rationale: אמן యొక్క ఈ రూపం పోషించడం లేదా పెంచడం అనే భావాన్ని గుర్తుచేస్తుంది; אִתּוֹ అంటే ‘అతనితో.’ ఈ అనువాదం మొర్దెకై సంరక్షకుడిగా ఎస్తేరును పెంచిన పూర్వస్థితిని స్పష్టంగా, అతిగా విశదీకరించకుండా అందిస్తుంది.
