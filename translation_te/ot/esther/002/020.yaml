  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వంశం/ప్రజలు’ అనే జతను వేర్వేరు భావాలతో నిలిపి, కృదంతాల కొనసాగింపు భావాన్ని అవసరమైన చోట సహజ తెలుగు క్రియారూపాలతో వ్యక్తపరిచాం.
