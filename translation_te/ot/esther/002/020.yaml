revisions:
- from: మొర్దెకై తనకు ఆజ్ఞాపించినట్టే, ఎస్తేరు తన వంశాన్నిగానీ తన ప్రజలనుగానీ తెలియజేయలేదు[a]. తాను అతని సంరక్షణలో పెరుగుతున్నప్పుడు చేసినట్టే, ఎస్తేరు మొర్దెకై మాటను పాటిస్తూ వచ్చింది[b].
  to: ఎస్తేరు తన వంశమేమిటో, తన ప్రజలు ఎవరో తెలియజేయలేదు[a], మొర్దెకై ఆమెకు ఆజ్ఞాపించినట్టే. ఎస్తేరు మొర్దెకై మాటను పాటిస్తూ వచ్చింది[b], ఆమె మొర్దెకై సంరక్షణలో పెరుగుతున్నప్పటిలాగే.
  rationale: రెండవ వాక్యంలో పెంపకకాలంతో పోలికను నేరుగా వ్యక్తం చేసి, మూలంలో లేని ‘చేసినట్టే’ అనే క్రియను తొలగించాం. మొదటి వాక్యాన్ని ఆధునిక తెలుగులో మరింత సహజంగా మార్చినా, ఎస్తేరు తన వంశ-మూలాన్నీ తన ప్రజలనూ వెల్లడించలేదనే మూలార్థాన్ని కాపాడాం. పాదటిప్పణి bని సవరించి, అది అనువదించబడిన వాక్యంతోను హీబ్రూ పెంపక-సూచనతోను సరిపోల్చాం.
