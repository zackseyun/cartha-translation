  edition: WLC
  text: לֹא הִגִּ֣ידָה אֶסְתֵּ֔ר אֶת עַמָּ֖/הּ וְ/אֶת מֽוֹלַדְתָּ֑/הּ כִּ֧י מָרְדֳּכַ֛י צִוָּ֥ה עָלֶ֖י/הָ אֲשֶׁ֥ר לֹא תַגִּֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/010.yaml
  text: Esther had not disclosed her people or her kindred[a], because Mordecai had commanded her not to disclose it.
translation:
  language: te
  text: ఎస్తేరు తన ప్రజలు ఎవరో, తన వంశం ఏమిటో[a] వెల్లడించలేదు; ఎందుకంటే ఆ సంగతి వెల్లడించవద్దని మొర్దెకై ఆమెకు ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన బంధువర్గం ఏమిటో’ లేదా ‘తన పూర్వీకుల మూలం ఏమిటో.’ హీబ్రూ పదం బంధుత్వ సమూహాన్ని, వంశమూలాన్ని లేదా పుట్టిన మూలస్థలాన్ని సూచించగలదు; ఇక్కడ ఎస్తేరు కుటుంబ వంశమూలం ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידָה
  choice: వెల్లడించలేదు
  rationale: נגד హిఫీల్ రూపం ‘తెలియజేయడం/ప్రకటించడం’ అనే భావాన్ని ఇస్తుంది. రాజసభలో తన గుర్తింపును గోప్యంగా ఉంచిన సందర్భంలో ‘వెల్లడించలేదు’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: עַמָּהּ
  choice: తన ప్రజలు ఎవరో
  rationale: עַם ఇక్కడ ఎస్తేరు చెందిన జాతి లేదా ప్రజాసమూహాన్ని సూచిస్తుంది. ‘తన ప్రజలు’ అనే మూలభావాన్ని నిలుపుతూ, తెలుగులో వాక్య నిర్మాణం సహజంగా ఉండేందుకు ‘ఎవరో’ చేర్చబడింది.
- source_word: מוֹלַדְתָּהּ
  choice: తన వంశం ఏమిటో
  rationale: מוֹלֶדֶת బంధుత్వం, వంశమూలం లేదా పుట్టుకకు సంబంధించిన మూలాన్ని సూచించగలదు. ‘వంశం’ ఇక్కడ ‘ప్రజలు’తో అనవసర పునరుక్తి లేకుండా కుటుంబపు వారసత్వ మూలాన్ని తెలియజేస్తుంది; పదంలోని విస్తృత భావపరిధిని పాదసూచికలో ఉంచాం.
- source_word: צִוָּה עָלֶיהָ
  choice: ఆమెకు ఆజ్ఞాపించాడు
  rationale: צוה లోని బలమైన ఆదేశార్థాన్ని ‘ఆజ్ఞాపించాడు’ కాపాడుతుంది; עָלֶיהָ ను తెలుగు ప్రయోగంలో సహజమైన ‘ఆమెకు’గా వ్యక్తీకరించాం.
- source_word: אֲשֶׁר לֹא תַגִּיד
  choice: ఆ సంగతి వెల్లడించవద్దని
  rationale: ఈ ఉపవాక్యం మొర్దెకై ఇచ్చిన ఆజ్ఞలోని విషయాన్ని తెలియజేస్తుంది. ‘ఆ సంగతి’ ముందున్న రెండు అంశాలను సమష్టిగా సూచిస్తుంది; మొదటి క్రియతో అనుసంధానం కోసం ‘వెల్లడించు’నే పునరావృతం చేశాం.
- source_word: אֶסְתֵּר
  choice: ఎస్తేరు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
- source_word: מָרְדֳּכַי
  choice: మొర్దెకై
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా, తెలుగులో ప్రాచుర్యంలో ఉన్న రూపాన్ని వాడాం.
