translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని ‘ప్రజలు—మోలెదెత్’ జంటను ‘ప్రజలు—వంశం’గా వేరు చేసి, రెండో పదంలోని నిజమైన అర్థవిస్తృతిని పాదసూచికలో సంరక్షించాం.
