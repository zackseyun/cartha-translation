revisions:
- from: ప్రతి రోజూ మొర్దెకై, ఎస్తేరు క్షేమంగా ఉందో, ఆమెకు ఏమి జరుగుతుందో తెలుసుకోవడానికి స్త్రీల గృహపు ప్రాంగణం ఎదుట అటూ ఇటూ తిరుగుతూ ఉండేవాడు.
  to: ప్రతి రోజూ మొర్దెకై ఎస్తేరు క్షేమంగా ఉందో, ఆమె విషయంలో ఏమి చేయబడుతుందో తెలుసుకోవడానికి స్త్రీల గృహపు ప్రాంగణం ఎదుట అటూ ఇటూ తిరుగుతూ ఉండేవాడు.
  rationale: The revision changes only the final clause to retain the Hebrew passive verb’s action-oriented yet agent-unspecified sense. The rest of the draft is accurate and natural modern standard Telugu.
