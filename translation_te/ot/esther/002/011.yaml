source:
  edition: WLC
  text: וּ/בְ/כָל י֣וֹם וָ/י֔וֹם מָרְדֳּכַי֙ מִתְהַלֵּ֔ךְ לִ/פְנֵ֖י חֲצַ֣ר בֵּית הַ/נָּשִׁ֑ים לָ/דַ֨עַת֙ אֶת שְׁל֣וֹם אֶסְתֵּ֔ר וּ/מַה יֵּעָשֶׂ֖ה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/011.yaml
  text: And every single day Mordecai would walk back and forth in front of the courtyard of the women’s house, to learn how Esther was doing and what would be done with her.
translation:
  language: te
  text: ప్రతి రోజూ మొర్దెకై ఎస్తేరు క్షేమంగా ఉందో, ఆమె విషయంలో ఏమి చేయబడుతుందో తెలుసుకోవడానికి స్త్రీల గృహపు ప్రాంగణం ఎదుట అటూ ఇటూ తిరుగుతూ ఉండేవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל־יוֹם וָיוֹם
  choice: ప్రతి రోజూ
  rationale: హీబ్రూ పునరుక్తి నిరంతర దినచర్యను బలంగా సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ‘ప్రతి రోజూ’ అని వ్యక్తమవుతుంది.
- source_word: מִתְהַלֵּךְ
  choice: అటూ ఇటూ తిరుగుతూ ఉండేవాడు
  rationale: ఈ హిత్పయేల్ రూపం ఇక్కడ ప్రాంగణం ఎదుట పదేపదే నడవడం లేదా పచార్లు చేయడం అనే భావాన్ని ఇస్తుంది.
- source_word: חֲצַר בֵּית הַנָּשִׁים
  choice: స్త్రీల గృహపు ప్రాంగణం
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా నిలుపుతూ, రాజభవనంలోని స్త్రీల నివాస విభాగాన్ని సూచించే గౌరవప్రదమైన సాధారణ పదజాలం ఎంచుకోబడింది.
- source_word: אֶת־שְׁלוֹם אֶסְתֵּר
  choice: ఎస్తేరు క్షేమంగా ఉందో
  rationale: ‘షాలోమ్’ ఇక్కడ ఆమె శ్రేయస్సు లేదా యోగక్షేమాన్ని తెలుసుకోవడం; తెలుగులో వ్యక్తిని ఉద్దేశించి సహజంగా ఇలా పలుకుతారు.
- source_word: וּמַה־יֵּעָשֶׂה בָּהּ
  choice: ఆమెకు ఏమి జరుగుతుందో
  rationale: హీబ్రూ నిష్క్రియ రూపంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది; ఎవరు ఏమి చేస్తారో వచనం పేర్కొనదు.
theological_decisions:
- issue: ఎస్తేరుకు జరగబోయేదాని స్వరూపం మరియు కర్త
  choice: ఆమెకు ఏమి జరుగుతుందో
  alternative: ఆమెను ఏమి చేస్తారో
  rationale: మూలంలోని నిష్క్రియ నిర్మాణం కర్తను తెలియజేయదు; ఎంపిక చేసిన అనువాదం ఆ అనిశ్చితిని సహజ తెలుగులో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని పునరావృత చర్యను ‘తిరుగుతూ ఉండేవాడు’ ద్వారా నిలిపాం.
