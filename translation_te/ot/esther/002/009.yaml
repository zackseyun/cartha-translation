source:
  edition: WLC
  text: וַ/תִּיטַ֨ב הַ/נַּעֲרָ֣ה בְ/עֵינָי/ו֮ וַ/תִּשָּׂ֣א חֶ֣סֶד לְ/פָנָי/ו֒ וַ֠/יְבַהֵל אֶת תַּמְרוּקֶ֤י/הָ וְ/אֶת מָנוֹתֶ֨/הָ֙ לָ/תֵ֣ת לָ֔/הּ וְ/אֵת֙ שֶׁ֣בַע הַ/נְּעָר֔וֹת הָ/רְאֻי֥וֹת לָֽ/תֶת לָ֖/הּ מִ/בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְשַׁנֶּ֧/הָ וְ/אֶת נַעֲרוֹתֶ֛י/הָ לְ/ט֖וֹב בֵּ֥ית הַ/נָּשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/009.yaml
  text: The young woman pleased him and found favor before him[a], and he quickly provided her with her beauty treatments and her portions, and with seven young women suitable to be given to her from the king’s palace; and he transferred her and her young women to the best place in the women’s house.
translation:
  language: te
  text: ఆ యువతి అతనికి నచ్చింది; ఆమె అతని దయను పొందింది. అతడు ఆమెకు సౌందర్య చికిత్సలను, ఆమెకు కేటాయించిన భాగాలను త్వరగా ఇచ్చాడు; రాజభవనం నుండి ఆమెకు ఇవ్వడానికి తగిన ఏడుగురు యువతులను కూడా ఇచ్చాడు. తరువాత అతడు ఆమెనూ ఆమె యువతులనూ స్త్రీల గృహంలోని ఉత్తమ స్థలానికి మార్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్త్రీల గృహంలోని ఉత్తమ నివాసస్థలానికి.’ ఈ పదబంధం రాజభవనంలోని స్త్రీల నివాస విభాగంలో మెరుగైన స్థలాన్ని సూచిస్తుంది; దీనిని సాధారణంగా ‘అంతఃపురం’గా అర్థం చేసుకుంటారు.
    reason: לְטוֹב בֵּית הַנָּשִׁיםలోని ‘ఉత్తమ స్థలం/నివాసస్థలం’కు సాధ్యమైన ప్రత్యామ్నాయ అనువాదాన్ని సూచించడానికి.
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: ఆ యువతి
  rationale: యౌవనంలో ఉన్న స్త్రీని సూచించే నַעֲרָהకు ఆధునిక, గౌరవప్రదమైన సహజ తెలుగు రూపం.
- source_word: וַתִּיטַב ... בְעֵינָיו
  choice: అతనికి నచ్చి
  rationale: ‘అతని కళ్లలో మంచిదిగా ఉండింది’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు; మూలంలో లేని శృంగార భావాన్ని చేర్చదు.
- source_word: וַתִּשָּׂא חֶסֶד לְפָנָיו
  choice: అతని అనుగ్రహం పొందింది
  rationale: రాజాస్థాన సందర్భంలో חֶסֶד అనుకూలత లేదా దయను సూచిస్తుంది; ‘అనుగ్రహం పొందింది’ నుడికార భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיְבַהֵל
  choice: వెంటనే అందించాడు
  rationale: క్రియలోని త్వరత్వర భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; తరువాతి వస్తువులను ఇవ్వడమే సందర్భానుసారమైన చర్య.
- source_word: תַּמְרוּקֶיהָ
  choice: ఆమె సౌందర్య సంరక్షణలకు కావలసినవాటిని
  rationale: స్త్రీల గృహంలో జరిగే శరీర/సౌందర్య సిద్ధపాటు ప్రక్రియను ఆధునిక పాఠకులకు స్పష్టంగా తెలుపుతుంది; కేవలం ‘సౌందర్య సాధనాలు’ అని పరిమితం చేయదు.
- source_word: מָנוֹתֶיהָ
  choice: ఆమెకు కేటాయించిన వాటాలను
  rationale: מָנוֹת అనేది కేటాయించిన భాగాలను, తరచుగా ఆహార భాగాలను, సూచిస్తుంది. ‘వాటాలు’ ఆహారానికే పరిమితం చేయకుండా మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: שֶׁבַע הַנְּעָרוֹת הָרְאֻיוֹת
  choice: తగిన ఏడుగురు యువతులను
  rationale: הָרְאֻיוֹתలోని ‘తగిన/యోగ్యమైన’ భావాన్ని నిలుపుతూ, నַעֲרוֹתను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: రాజభవనం నుండి
  rationale: రాజసంబంధ సందర్భంలో ‘రాజు ఇల్లు’ కంటే ‘రాజభవనం’ సంస్థాగత స్థలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיְשַׁנֶּהָ
  choice: మార్చాడు
  rationale: ‘మార్చడం/స్థానం మార్చడం’ అనే ప్రాథమిక భావాన్ని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని పదోన్నతి భావాన్ని చేర్చదు.
- source_word: לְטוֹב בֵּית הַנָּשִׁים
  choice: స్త్రీల గృహంలోని ఉత్తమ స్థలానికి
  rationale: స్త్రీల నివాస విభాగంలో మెరుగైన స్థలాన్ని సూచించే భావాన్ని మూలానికి దగ్గరగా అందిస్తుంది; ‘అంతఃపురం’ వంటి కొంత వ్యాఖ్యానాత్మక పదాన్ని ప్రధాన పాఠ్యంలో పెట్టదు.
