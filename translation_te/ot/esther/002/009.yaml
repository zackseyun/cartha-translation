  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజాస్థాన కథనానికి తగిన గౌరవప్రదమైన శైలి. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం నాలుగు వాక్యాలుగా విభజించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న చివరి పదబంధం వద్ద ఉంచాం.
