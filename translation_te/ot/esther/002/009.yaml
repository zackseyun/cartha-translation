revisions:
- from: ఆ యువతి అతనికి నచ్చి, అతని అనుగ్రహం పొందింది. అతడు ఆమె సౌందర్య సంరక్షణలకు కావలసినవాటిని, ఆమెకు కేటాయించిన వాటాలను వెంటనే అందించాడు. రాజభవనం నుండి ఆమెకు నియమించడానికి తగిన ఏడుగురు యువతులను కూడా ఇచ్చాడు. ఆ తర్వాత ఆమెను, ఆమె యువతులను స్త్రీల గృహంలోని ఉత్తమ స్థలానికి మార్చాడు.[a]
  to: ఆ యువతి అతనికి నచ్చింది; ఆమె అతని దయను పొందింది. అతడు ఆమెకు సౌందర్య చికిత్సలను, ఆమెకు కేటాయించిన భాగాలను త్వరగా ఇచ్చాడు; రాజభవనం నుండి ఆమెకు ఇవ్వడానికి తగిన ఏడుగురు యువతులను కూడా ఇచ్చాడు. తరువాత అతడు ఆమెనూ ఆమె యువతులనూ స్త్రీల గృహంలోని ఉత్తమ స్థలానికి మార్చాడు.[a]
  rationale: The revision retains the Hebrew syntax and all narrative elements while using more direct Telugu for the cosmetic preparations, allotted portions, and courtly favor. The destination remains a superior location within the women’s quarters, and the footnote preserves the non-main-text interpretive designation ‘అంతఃపురం.’
