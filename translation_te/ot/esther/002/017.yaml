language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֶּאֱהַ֨ב הַ/מֶּ֤לֶךְ אֶת אֶסְתֵּר֙ מִ/כָּל הַ/נָּשִׁ֔ים וַ/תִּשָּׂא חֵ֥ן וָ/חֶ֛סֶד לְ/פָנָ֖י/ו מִ/כָּל הַ/בְּתוּלֹ֑ת וַ/יָּ֤שֶׂם כֶּֽתֶר מַלְכוּת֙ בְּ/רֹאשָׁ֔/הּ וַ/יַּמְלִיכֶ֖/הָ תַּ֥חַת וַשְׁתִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/017.yaml
  text: The king loved Esther more than all the women[a], and she found favor and kindness before him more than all the virgins[b]. So he placed the royal crown on her head and made her queen instead of Vashti.
translation:
  language: te
  text: రాజు ఎస్తేరును స్త్రీలందరికంటే ఎక్కువగా ప్రేమించాడు. కన్యలందరికంటే ఆమె అతని దృష్టిలో అనుగ్రహాన్నీ దయనూ పొందింది. కాబట్టి అతడు ఆమె తలపై రాజకిరీటాన్ని ఉంచి, వష్తికి బదులుగా ఆమెను రాణిగా చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: ప్రేమించాడు
  rationale: אהב అనే క్రియ ప్రేమ లేదా అనురాగాన్ని నేరుగా సూచిస్తుంది; కేవలం ‘ఇష్టపడ్డాడు’ అని బలహీనపరచకుండా మూలార్థాన్ని నిలుపుతుంది.
- source_word: מִכָּל הַנָּשִׁים
  choice: మిగిలిన స్త్రీలందరికంటే ఎక్కువగా
  rationale: מִן + כָּל తులనార్థాన్ని స్పష్టంగా తెలుపుతుంది. נָשִׁים సాధారణంగా ‘స్త్రీలు’; తరువాతి בְּתוּלֹתతో ఉన్న పదభేదం కూడా నిలుస్తుంది.
- source_word: וַתִּשָּׂא חֵן וָחֶסֶד
  choice: అనుగ్రహాన్నీ దయనూ పొందింది
  rationale: అక్షరార్థంగా ‘అనుగ్రహం, దయను మోసింది’ అనే హెబ్రీ నుడికారాన్ని సహజ తెలుగులో ‘పొందింది’గా అనువదిస్తూ, חֵן మరియు חֶסֶד అనే రెండు భావాలనూ వేరుగా నిలిపాం.
- source_word: לְפָנָיו
  choice: అతని దృష్టిలో
  rationale: ‘అతని సమక్షంలో/ముఖం ఎదుట’ అనే హెబ్రీ భావాన్ని సహజమైన తెలుగు సంబంధ నుడికారంగా వ్యక్తం చేస్తుంది.
- source_word: מִכָּל הַבְּתוּלֹת
  choice: కన్యలందరికంటే
  rationale: בְּתוּלֹת అనేది ముందున్న ‘స్త్రీలు’ కంటే నిర్దిష్టమైన పదం; ఆ భేదాన్ని ‘కన్యలు’గా కాపాడాం.
- source_word: וַיָּשֶׂם כֶּתֶר מַלְכוּת
  choice: రాజకిరీటాన్ని ఉంచి
  rationale: ‘రాజత్వపు కిరీటం’ అనే నిర్మాణానికి ‘రాజకిరీటం’ సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: וַיַּמְלִיכֶהָ
  choice: ఆమెను రాణిగా చేశాడు
  rationale: מלך హిఫీల్ రూపం ‘పాలకురాలిగా చేయడం’ అనే భావం ఇస్తుంది; సందర్భంలో ‘రాణిగా చేశాడు’ స్పష్టంగా ఉంది.
- source_word: תַּחַת וַשְׁתִּי
  choice: వష్తికి బదులుగా
  rationale: ఇక్కడ תַּחַת వారసత్వం లేదా భర్తీ సందర్భంలో ‘స్థానంలో/బదులుగా’ అని అర్థం.
