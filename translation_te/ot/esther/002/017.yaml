  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘స్త్రీలు’ మరియు ‘కన్యలు’ అనే మూలంలోని పదభేదం ఉద్దేశపూర్వకంగా నిలుపబడింది; అవసరం లేని పాదసూచికలు జోడించలేదు.
