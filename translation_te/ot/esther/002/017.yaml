  terminology: ‘ప్రేమించాడు,’ ‘స్త్రీలు,’ ‘కన్యలు,’ ‘రాజకిరీటం,’ and ‘రాణిగా చేశాడు’ are suitable and preserve the relevant lexical distinctions. ‘అనుగ్రహం’ and ‘దయ’ appropriately retain the two Hebrew nouns without importing a specific doctrinal interpretation.
