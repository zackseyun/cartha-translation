  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִ֣ישׁ יְהוּדִ֔י הָיָ֖ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֑ה וּ/שְׁמ֣/וֹ מָרְדֳּכַ֗י בֶּ֣ן יָאִ֧יר בֶּן שִׁמְעִ֛י בֶּן קִ֖ישׁ אִ֥ישׁ יְמִינִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/005.yaml
  text: There was a Jewish man in Susa the citadel[a], and his name was Mordecai son of Jair, son of Shimei, son of Kish[c][b], a Benjaminite.
translation:
  language: te
  text: షూషను కోటలో[a] ఒక యూదుడు[b] ఉండేవాడు. అతని పేరు మొర్దెకై; అతడు యాయీరు కుమారుడు, షిమీ కుమారుడు, కీషు కుమారుడు[c], బెన్యామీను గోత్రస్థుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘షూషను రాజకోటలో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యూదయకు చెందినవాడు.’
    reason: lexical_alternative
  - marker: c
    text: వంశావళుల సందర్భంలో హీబ్రూ ‘కుమారుడు’ అనే పదం మరింత దూరపు వంశసంబంధాన్ని కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ יְהוּדִי
  choice: ఒక యూదుడు
  rationale: పర్షియా ప్రవాస సందర్భంలో ఇది యూద ప్రజల గుర్తింపును సహజంగా తెలియజేస్తుంది; యూదయ ప్రాంత నివాసి అనే అర్థానికే పరిమితం చేయదు.
- source_word: הָיָה
  choice: ఉండేవాడు
  rationale: కొత్త పాత్రను పరిచయం చేసే హీబ్రూ అస్తిత్వార్థక కథన ప్రయోగాన్ని సహజమైన తెలుగు కథన రూపంలో అందిస్తుంది.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: షూషను కోటలో
  rationale: שׁוּשַׁן అనే స్థలనామాన్నీ, הַבִּירָה సూచించే కోటతో కూడిన రాజ సముదాయాన్నీ సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וּשְׁמוֹ
  choice: అతని పేరు
  rationale: హీబ్రూ కథన కొనసాగింపును స్పష్టమైన ఆధునిక తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: מָרְדֳּכַי
  choice: మొర్దెకై
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తినామాన్ని లిప్యంతరీకరించింది.
- source_word: בֶּן יָאִיר בֶּן שִׁמְעִי בֶּן קִישׁ
  choice: యాయీరు కుమారుడు, షిమీ కుమారుడు, కీషు కుమారుడు
  rationale: בֶּן యొక్క మూలార్థమైన ‘కుమారుడు’ను నిలుపుతూ వంశావళి శైలిని కాపాడుతుంది; ఇది దూరపు వంశసంబంధాన్నీ సూచించగలదని పాదటిప్పణి వివరిస్తుంది.
- source_word: אִישׁ יְמִינִי
  choice: బెన్యామీను గోత్రస్థుడు
  rationale: బెన్యామీను గోత్రానికి చెందినవాడనే భావాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
