  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని పరిచయ క్రమం, వంశావళి పునరుక్తి నిలుపబడ్డాయి; పాఠక స్పష్టత కోసం ‘బెన్యామీను గోత్రస్థుడు’ అని అనువదించబడింది.
