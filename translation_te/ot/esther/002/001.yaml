translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూలోని మూడు సమాంతర కర్మలను—వష్తిని, ఆమె చేసినదాన్ని, ఆమెపై నిర్ణయించబడినదాన్ని—తెలుగులోనూ నిలిపాం; అనవసరమైన వివరణను ప్రధాన పాఠంలో చేర్చలేదు.
