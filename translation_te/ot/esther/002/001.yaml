  to: ఈ సంగతుల తర్వాత, అహష్వేరోషు రాజు కోపం చల్లారినప్పుడు, అతడు వష్తీని, ఆమె చేసినదాన్ని, ఆమెకు వ్యతిరేకంగా నిర్ణయించబడినదాన్ని[a] జ్ఞాపకం చేసుకున్నాడు.
