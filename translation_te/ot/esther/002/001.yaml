source:
  edition: WLC
  text: אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כְּ/שֹׁ֕ךְ חֲמַ֖ת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ זָכַ֤ר אֶת וַשְׁתִּי֙ וְ/אֵ֣ת אֲשֶׁר עָשָׂ֔תָה וְ/אֵ֥ת אֲשֶׁר נִגְזַ֖ר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/001.yaml
  text: After these things[a], when the anger of King Ahasuerus had subsided, he remembered Vashti, what she had done[b], and what had been decreed against her.
translation:
  language: te
  text: ఈ సంగతుల తర్వాత, అహష్వేరోషు రాజు కోపం చల్లారినప్పుడు, అతడు వష్తీని, ఆమె చేసినదాన్ని, ఆమెకు వ్యతిరేకంగా నిర్ణయించబడినదాన్ని[a] జ్ఞాపకం చేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె విషయంలో నిర్ణయించబడినదాన్ని.”
    reason: עָלֶיהָ అనే పదబంధాన్ని సందర్భంలో ‘ఆమెకు వ్యతిరేకంగా’ అని లేదా మరింత తటస్థంగా ‘ఆమె విషయంలో’ అని అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులు జరిగిన తర్వాత
  rationale: ఇది తరువాతి సన్నివేశాన్ని పరిచయం చేసే కాలసూచక ప్రయోగం. ‘ఈ సంగతులు జరిగిన తర్వాత’ అనే రూపం హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כְּשֹׁךְ חֲמַת
  choice: కోపం చల్లారినప్పుడు
  rationale: שׁכך కోపం తగ్గడం లేదా శాంతించడం అనే భావాన్ని ఇస్తుంది; ‘చల్లారినప్పుడు’ తెలుగులో సహజంగా ఉండి חֵמָהలోని తీవ్రమైన కోపభావాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజు
  rationale: తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా వ్యక్తినామం తరువాత రాజబిరుదును ఉంచి, రెండింటినీ నిలుపుకుంది.
- source_word: זָכַר
  choice: జ్ఞాపకం చేసుకున్నాడు
  rationale: క్రియలోని ‘గుర్తుచేసుకోవడం, మనస్సుకు తెచ్చుకోవడం’ అనే ప్రత్యక్ష భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַשְׁתִּי
  choice: వష్తి
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సులభంగా చదవదగిన సంప్రదాయ లిప్యంతరీకరణ.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: ఆమె చేసినదాన్ని
  rationale: రాజు జ్ఞాపకం చేసుకున్న మూడు కర్మలలో రెండవదాన్ని హీబ్రూ సంబంధవాక్యానికి దగ్గరగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר נִגְזַר עָלֶיהָ
  choice: ఆమెకు వ్యతిరేకంగా నిర్ణయించబడినదాన్ని
  rationale: నిష్క్రియారూపమైన נִגְזַר అధికారికంగా నిర్ణయించబడిన విషయాన్ని సూచిస్తుంది. עָלֶיהָ ఇక్కడ ప్రతికూల నిర్ణయాన్ని సూచించగలందున ‘ఆమెకు వ్యతిరేకంగా’ అని ప్రధాన పాఠంలో ఇచ్చి, విస్తృతమైన ‘ఆమె విషయంలో’ అనే అవకాశాన్ని పాదసూచికలో నిలిపాం.
