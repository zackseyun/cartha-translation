  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/הַגִּ֡יעַ תֹּר֩ נַעֲרָ֨ה וְ/נַעֲרָ֜ה לָ/ב֣וֹא אֶל הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֗וֹשׁ מִ/קֵּץ֩ הֱי֨וֹת לָ֜/הּ כְּ/דָ֤ת הַ/נָּשִׁים֙ שְׁנֵ֣ים עָשָׂ֣ר חֹ֔דֶשׁ כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י מְרוּקֵי/הֶ֑ן שִׁשָּׁ֤ה חֳדָשִׁים֙ בְּ/שֶׁ֣מֶן הַ/מֹּ֔ר וְ/שִׁשָּׁ֤ה חֳדָשִׁים֙ בַּ/בְּשָׂמִ֔ים וּ/בְ/תַמְרוּקֵ֖י הַ/נָּשִֽׁים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/012.yaml
  text: 'When the turn of each young woman came to go in to King Ahasuerus, after she had been under the regulation for the women for twelve months—for in this way the days of their beauty treatments were completed: six months with oil of myrrh, and six months with spices and with the cosmetics for women—'
translation:
  language: te
  text: 'ఒక్కొక్క యువతికి రాజైన అహష్వేరోషు వద్దకు ప్రవేశించే వంతు వచ్చినప్పుడు, స్త్రీలకు నియమించబడిన విధానం ప్రకారం ఆమె పన్నెండు నెలలు గడిపిన తరువాతే అది వచ్చేది; ఎందుకంటే వారి సౌందర్య చికిత్సల రోజులు ఈ విధంగా పూర్తయ్యేవి: ఆరు నెలలు బోళం నూనెతో, మరో ఆరు నెలలు సుగంధ ద్రవ్యాలతోను స్త్రీలకు ఉపయోగించే సౌందర్య సాధనాలతోను—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹּר
  choice: వంతు
  rationale: ఒక్కొక్కరికి క్రమంగా వచ్చే అవకాశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כְּדָת הַנָּשִׁים
  choice: స్త్రీలకు నియమించిన ప్రకారం
  rationale: דָּת ఇక్కడ స్త్రీలకు వర్తించే రాజనియమం లేదా నిర్దేశిత విధానాన్ని సూచిస్తుంది; కేవలం ‘ఆచారం’ అని పరిమితం చేయలేదు.
- source_word: יְמֵי מְרוּקֵיהֶן
  choice: వారి సౌందర్య సంరక్షణ కాలం
  rationale: מְרוּקִים శరీర శుద్ధి, అలంకరణ, సౌందర్య చికిత్సల సమగ్ర ప్రక్రియను సూచిస్తుంది; తెలుగులో సహజంగా కాలవ్యాప్తిని వ్యక్తం చేసింది.
- source_word: שֶׁמֶן הַמֹּר
  choice: బోళం నూనె
  rationale: מֹר అనేది myrrh; తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘బోళం’ను ఉంచి, అది నూనె రూపంలో వాడబడిందని స్పష్టం చేసింది.
- source_word: בַּבְּשָׂמִים
  choice: సుగంధ ద్రవ్యాలతో
  rationale: సువాసనగల పదార్థాలు/ద్రవ్యాలు అనే మూలార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וּבְתַמְרוּקֵי הַנָּשִׁים
  choice: స్త్రీల సౌందర్య సాధనాలతో
  rationale: స్త్రీలకు ఉపయోగించే ఇతర అలంకరణ లేదా శరీర సంరక్షణ పదార్థాలను సూచించే విస్తృత పదబంధంగా అనువదించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజదర్బారు సందర్భానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. వచనం తరువాతి వాక్యంతో కొనసాగుతుందని సూచించేందుకు చివర దీర్ఘ విరామ చిహ్నం ఉంచబడింది.
