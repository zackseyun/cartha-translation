  rationale: The revision corrects the kinship footnote, removes the unwarranted specification that the uncle was her father's brother, and renders Mordecai's action with a closer, natural Telugu equivalent. It preserves the Hebrew's apposition of Hadassah and Esther, its explicit statement that both parents were absent, and its distinct descriptions of figure and appearance.
