  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలి పాటించబడింది. రెండు పేర్లు, తల్లిదండ్రుల లేమి, శరీరాకృతి–రూపం మధ్య భేదం, కుమార్తెగా స్వీకరించడం అనే అంశాలు మూలపాఠానికి దగ్గరగా నిలుపబడ్డాయి.
