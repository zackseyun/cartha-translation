source:
  edition: WLC
  text: וַ/יְהִ֨י אֹמֵ֜ן אֶת הֲדַסָּ֗ה הִ֤יא אֶסְתֵּר֙ בַּת דֹּד֔/וֹ כִּ֛י אֵ֥ין לָ֖/הּ אָ֣ב וָ/אֵ֑ם וְ/הַ/נַּעֲרָ֤ה יְפַת תֹּ֨אַר֙ וְ/טוֹבַ֣ת מַרְאֶ֔ה וּ/בְ/מ֤וֹת אָבִ֨י/הָ֙ וְ/אִמָּ֔/הּ לְקָחָ֧/הּ מָרְדֳּכַ֛י ל֖/וֹ לְ/בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/007.yaml
  text: He was bringing up Hadassah—that is[a], Esther—the daughter of his uncle, because she had neither father nor mother. The young woman was beautiful in form and attractive in appearance, and when her father and her mother died[b], Mordecai took her as his own daughter.
translation:
  language: te
  text: అతడు తన మామ కుమార్తె[a] అయిన హదస్సాను—అంటే ఎస్తేరును—పెంచి పోషించేవాడు; ఎందుకంటే ఆమెకు తండ్రిగానీ తల్లిగానీ లేరు. ఆ యువతి చక్కని శరీరాకృతి, ఆకర్షణీయమైన రూపం కలది. ఆమె తండ్రి, తల్లి చనిపోయినప్పుడు, మొర్దెకై ఆమెను తన కుమార్తెగా తీసుకున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతని మామ కుమార్తె”; అంటే మొర్దెకైకి బంధుత్వంలో సమీప బంధువు.
    reason: హీబ్రూ బంధుత్వ పదబంధాన్ని స్పష్టం చేస్తూ, ఆమెను మొర్దెకైకి సోదరిగా తప్పుగా గుర్తించకుండా నివారించడం.
  - marker: b
    text: లేదా, “మొర్దెకై ఆమెను తన కుమార్తెగా దత్తత తీసుకున్నాడు.” హీబ్రూలో అక్షరార్థంగా, అతడు “ఆమెను తనకొరకు కుమార్తెగా తీసుకున్నాడు.”
    reason: దత్తత అనే సాధ్యమైన భావాన్ని సూచిస్తూ, మూలపాఠంలోని ప్రత్యక్ష పదప్రయోగాన్ని నిలుపడం.
lexical_decisions:
- source_word: אֹמֵן
  choice: పెంచి పోషించేవాడు
  rationale: ఈ కర్తరి వర్తమాన కృదంతం మొర్దెకై నిరంతరంగా ఆమెను పెంచి సంరక్షిస్తున్న పాత్రను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పెంచి పోషించేవాడు’ సహజంగా ఈ రెండు భావాలనూ తెలియజేస్తుంది.
- source_word: הֲדַסָּה הִיא אֶסְתֵּר
  choice: హదస్సాను—అంటే ఎస్తేరును—
  rationale: הִיא ఇక్కడ ఒకే వ్యక్తిని రెండు పేర్లతో గుర్తించే వివరణాత్మక సమానాధికరణం. ‘అంటే’ రెండు పేర్ల సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בַּת דֹּדוֹ
  choice: తన తండ్రి సోదరుని కుమార్తె
  rationale: హీబ్రూ పదబంధంలోని బంధుత్వ వివరణను నిలుపుతుంది. కేవలం ‘బంధువు’ అని సాధారణీకరించకుండా, ఆమె మొర్దెకైకి వరుసకు సోదరి అవుతుందనే విషయాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: כִּי אֵין לָהּ אָב וָאֵם
  choice: ఎందుకంటే ఆమెకు తండ్రిగానీ తల్లిగానీ లేరు
  rationale: ‘అనాథ’ అని సంక్షిప్తీకరించకుండా, తండ్రి మరియు తల్లి ఇద్దరూ లేరని మూలపాఠం ప్రత్యక్షంగా చెప్పిన విధానాన్ని నిలుపుతుంది.
- source_word: הַנַּעֲרָה
  choice: ఆ యువతి
  rationale: వివాహయోగ్య వయస్సులోని స్త్రీని సూచించే సందర్భానికి ‘యువతి’ ఆధునిక, గౌరవప్రదమైన తెలుగు పదం.
- source_word: יְפַת תֹּאַר
  choice: చక్కని శరీరాకృతి
  rationale: תֹּאַר సూచించే ఆకృతి లేదా శరీర నిర్మాణపు అందాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: טוֹבַת מַרְאֶה
  choice: ఆకర్షణీయమైన రూపం
  rationale: కనిపించే రూపం ఆహ్లాదకరంగా ఉందనే భావాన్ని తెలియజేస్తూ, ముందున్న శరీరాకృతి వర్ణనతో ఉన్న రెండు భాగాల తేడాను కాపాడుతుంది.
- source_word: וּבְמוֹת אָבִיהָ וְאִמָּהּ
  choice: ఆమె తండ్రి, తల్లి చనిపోయినప్పుడు
  rationale: బְּ తో కూడిన ‘చనిపోవడం’ అనే రూపం తెలిపే కాలసంబంధ పరిస్థితిని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת
  choice: మొర్దెకై ఆమెను తన సొంత కుమార్తెగా స్వీకరించాడు
  rationale: ‘తనకొరకు కుమార్తెగా తీసుకున్నాడు’ అనే హీబ్రూ భావాన్ని సహజంగా అందిస్తుంది; ఆధునిక చట్టపరమైన దత్తత విధానం గురించి మూలపాఠం చెప్పనిదాన్ని ఇందులో చేర్చదు.
