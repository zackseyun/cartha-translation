  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּלָּקַ֨ח אֶסְתֵּ֜ר אֶל הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרוֹשׁ֙ אֶל בֵּ֣ית מַלְכוּת֔/וֹ בַּ/חֹ֥דֶשׁ הָ/עֲשִׂירִ֖י הוּא חֹ֣דֶשׁ טֵבֵ֑ת בִּ/שְׁנַת שֶׁ֖בַע לְ/מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/016.yaml
  text: So Esther was taken to King Ahasuerus[a], into his royal palace, in the tenth month, which is the month Tebeth[b], in the seventh year of his reign.
translation:
  language: te
  text: అహష్వేరోషు రాజు పరిపాలనలోని ఏడవ సంవత్సరంలో, పదవ నెలలో—అంటే తేబేతు నెలలో[b]—ఎస్తేరు అహష్వేరోషు రాజు వద్దకు[a], అతని రాజభవనంలోకి తీసుకువెళ్లబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అహష్వేరోషు రాజు వద్దకు తీసుకురాబడింది.’ హీబ్రూ క్రియ కర్మణి రూపంలో ఉంది; ఎస్తేరు స్వయంగా చర్య చేసినట్లు కాక, ఆమెపై చర్య జరిగిందని అది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో ‘తేబేతు నెల’; ఇది పదవ నెలకు వాడిన బబులోను పేరు.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּלָּקַח
  choice: తీసుకువెళ్లబడింది
  rationale: לקח ధాతువు నిఫల్ రూపంలో ఉండటం వల్ల కర్తరహిత భావం స్పష్టంగా ఉంది; ఎస్తేరు స్వయంగా వెళ్లిందని కాక, ఇతరులు ఆమెను తీసుకువెళ్లారని ఈ రూపం తెలియజేస్తుంది.
- source_word: אֶל הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: రాజైన అహష్వేరోషు దగ్గరికి
  rationale: మొదటి אֶל రాజువైపు గమనాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో బిరుదు, పేరును సహజంగా కలిపి అందిస్తుంది.
- source_word: אֶל בֵּית מַלְכוּתוֹ
  choice: అతని రాజభవనంలోకి
  rationale: అక్షరార్థంగా ‘అతని రాజ్యాధికార గృహంలోకి’; సందర్భంలో ఇది రాజు నివసించే రాజభవనాన్ని సూచిస్తుంది. ‘లోకి’ గమనాన్ని నిలుపుతుంది.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי הוּא חֹדֶשׁ טֵבֵת
  choice: పదవ నెలలో—అంటే తేబేతు నెలలో
  rationale: నెల క్రమసంఖ్యను, దానికి సంబంధించిన బబులోనీయ పేరును వివరణాత్మకంగా అనుసంధానిస్తుంది.
- source_word: טֵבֵת
  choice: తేబేతు
  rationale: హీబ్రూ నెలపేరు טֵבֵת ను తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: בִּשְׁנַת שֶׁבַע לְמַלְכוּתוֹ
  choice: అహష్వేరోషు రాజు పరిపాలనలోని ఏడవ సంవత్సరంలో
  rationale: రాజుల పరిపాలనా సంవత్సరాన్ని సూచించే సాధారణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; సర్వనామ అస్పష్టత రాకుండా రాజు పేరును పునరుద్ఘాటించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. హీబ్రూ క్రియలోని కర్తరహిత భావాన్ని కాపాడింది; కాలసూచనను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా ముందుకు తెచ్చింది.
