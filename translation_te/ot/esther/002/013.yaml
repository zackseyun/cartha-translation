translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని ఆచారప్రక్రియ భావాన్ని ‘ఇవ్వబడేది’ ద్వారా నిలిపి, సాంస్కృతిక వివరణను పాదటిప్పణికి పరిమితం చేశాం.
