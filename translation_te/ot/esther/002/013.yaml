  text: וּ/בָ/זֶ֕ה הַֽ/נַּעֲרָ֖ה בָּאָ֣ה אֶל הַ/מֶּ֑לֶךְ אֵת֩ כָּל אֲשֶׁ֨ר תֹּאמַ֜ר יִנָּ֤תֵֽן לָ/הּ֙ לָ/ב֣וֹא עִמָּ֔/הּ מִ/בֵּ֥ית הַ/נָּשִׁ֖ים עַד בֵּ֥ית הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/013.yaml
  text: 'And in this way the young woman went to the king: whatever she said would be given to her to take with her from the house of the women to the king’s house[a][b].'
translation:
  language: te
  text: 'ఈ విధంగా ఆ యువతి రాజు దగ్గరకు వెళ్లేది: ఆమె ఏది అడిగితే అది, స్త్రీల గృహం నుండి రాజభవనం వరకు తనతో తీసుకువెళ్లడానికి ఆమెకు ఇవ్వబడేది.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఆమె ఏది చెబితే అది’; ఈ సందర్భంలో ఆమె తనతో తీసుకువెళ్లడానికి అడిగినదాన్ని ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘స్త్రీల గృహం’ అనేది హీబ్రూ పదబంధానికి సన్నిహిత అనువాదం; ఇది స్త్రీల నివాస విభాగాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָזֶה
  choice: వెళ్లే విధానం ఇదే
  rationale: בְּזֶה ఇక్కడ ముందుగా వివరించిన పద్ధతిని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా వాక్య నిర్మాణంలో ‘వెళ్లే విధానం ఇదే’ అని వ్యక్తీకరించాం.
- source_word: הַנַּעֲרָה
  choice: ఆ యువతి
  rationale: נַעֲרָה యువ స్త్రీని సూచిస్తుంది. ‘యువతి’ ఆధునిక, గౌరవప్రదమైన పదం; ‘బాలిక’ అనే అతి చిన్న వయస్సు భావాన్ని నివారిస్తుంది.
- source_word: בָּאָה אֶל־הַמֶּלֶךְ
  choice: రాజు దగ్గరకు వెళ్లే
  rationale: בוא + אֶל అంటే సందర్భానుసారం ‘వద్దకు రావడం/వెళ్లడం.’ స్త్రీల గృహం నుండి రాజు వద్దకు వెళ్లే సందర్భంలో ‘వెళ్లే’ సహజం.
- source_word: אֵת כָּל אֲשֶׁר תֹּאמַר
  choice: ఆమె ఏది అడిగితే అది
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఆమె ఏది చెబితే అది.’ అయితే ఇవ్వబడే వస్తువుల సందర్భంలో תאמר అభ్యర్థనను సూచిస్తుంది. ప్రధాన పాఠ్యంలో ఉద్దేశిత భావాన్ని స్పష్టంగా ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יִנָּתֵן לָהּ
  choice: ఆమెకు ఇవ్వబడేది
  rationale: נתן నిఫాల్ రూపం కర్మణి అర్థమైన ‘ఇవ్వబడడం’ను కలిగి ఉంది; అసంపూర్ణ క్రియ ఇక్కడ ఆచారంగా జరిగే ప్రక్రియను సూచిస్తుంది.
- source_word: לָבוֹא עִמָּהּ
  choice: తనతో తీసుకువెళ్లడానికి
  rationale: అక్షరార్థం ‘ఆమెతో వెళ్లడానికి/ప్రవేశించడానికి.’ ఇవ్వబడిన వస్తువులు ఆమెతో వెళ్లే భావాన్ని సహజ తెలుగులో ‘తనతో తీసుకువెళ్లడానికి’గా తెలిపాం.
- source_word: מִבֵּית הַנָּשִׁים
  choice: స్త్రీల గృహం నుండి
  rationale: హీబ్రూ పదబంధాన్ని సన్నిహితంగా అనువదించాం; మూలంలో లేని సాంస్కృతిక వివరణాత్మక పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: עַד בֵּית הַמֶּלֶךְ
  choice: రాజభవనం వరకు
  rationale: עַד యొక్క ‘వరకు’ భావాన్ని నిలిపాం. בֵּית הַמֶּלֶךְ అక్షరార్థంగా ‘రాజు గృహం’; సందర్భంలో సహజమైన ఆధునిక తెలుగు రూపం ‘రాజభవనం.’
