translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. రాజసభ పదజాలాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచుతూ, సָרִיס మరియు לִשְׁלֹחַ יָד పదబంధాల్లోని అర్థవిస్తృతిని పాదటిప్పణుల్లో సంరక్షించాం. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
