source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מָרְדֳּכַ֖י יֹשֵׁ֣ב בְּ/שַֽׁעַר הַ/מֶּ֑לֶךְ קָצַף֩ בִּגְתָ֨ן וָ/תֶ֜רֶשׁ שְׁנֵֽי סָרִיסֵ֤י הַ/מֶּ֨לֶךְ֙ מִ/שֹּׁמְרֵ֣י הַ/סַּ֔ף וַ/יְבַקְשׁוּ֙ לִ/שְׁלֹ֣חַ יָ֔ד בַּ/מֶּ֖לֶךְ אֲחַשְׁוֵֽרֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/021.yaml
  text: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
translation:
  language: te
  text: ఆ రోజుల్లో మొర్దెకై రాజద్వారం వద్ద కూర్చొని ఉండగా, గడపను కాపాడే రాజు నపుంసక అధికారులైన బిగ్తాను, తెరెషు అనే ఇద్దరు కోపించి, అహష్వేరోషు రాజుపై చేయి వేయాలని[a] తలపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘రాజుపై చేయి చాచాలని’; అంటే రాజుపై దాడి చేయాలని లేదా ఆయనను హత్య చేయాలని.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: హీబ్రూ కథనంలోని విస్తృత కాలసూచనను సహజమైన ఆధునిక తెలుగులో అలాగే నిలుపుతుంది.
- source_word: יֹשֵׁב
  choice: కూర్చొని ఉండగా
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న నేపథ్య పరిస్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: రాజద్వారం దగ్గర
  rationale: ఇది కేవలం తలుపును కాక రాజపాలనా కార్యకలాపాలు జరిగే ద్వారప్రాంతాన్ని సూచిస్తుంది; ‘దగ్గర’ తెలుగు వాడుకలో సహజం.
- source_word: קָצַף
  choice: కోపించి
  rationale: సంయుక్త కర్తకు ముందు ఏకవచన రూపంలో ఉన్న హీబ్రూ క్రియను ఇద్దరికీ వర్తించేలా, తీవ్రతను అనవసరంగా పెంచకుండా అనువదిస్తుంది.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: రాజు నపుంసక అధికారులు
  rationale: సָרִיס అనే పదానికి రాజసభ సందర్భంలో ఉన్న శారీరక అర్థాన్ని ‘నపుంసక’ నిలుపుతుండగా, వారి అధికారిక హోదాను ‘అధికారులు’ స్పష్టం చేస్తుంది; విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: గడపను కాపాడే
  rationale: הַסַּף యొక్క ‘గడప’ అనే స్పష్టమైన రూపకల్పనను నిలుపుతూ వారి రక్షక బాధ్యతను సహజంగా చెబుతుంది.
- source_word: וַיְבַקְשׁוּ
  choice: చూశారు
  rationale: ‘ప్రయత్నించారు/తలపెట్టారు’ అనే సందర్భార్థాన్ని ఇచ్చినా, కుట్ర యొక్క స్వరూపాన్ని మూలపాఠం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: לִשְׁלֹחַ יָד
  choice: మీద చెయ్యి వేయాలని
  rationale: ‘చెయ్యి చాపడం/పంపడం’ అనే హీబ్రూ నుడికారపు రూపాన్ని తెలుగులో దగ్గరగా నిలిపి, హింసాత్మక ఉద్దేశాన్ని సూచిస్తుంది; స్పష్టమైన భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు
  rationale: చారిత్రక గుర్తింపైన ‘క్షయర్షా/Xerxes’ను ప్రత్యామ్నాయంగా పెట్టకుండా హీబ్రూ నామరూపాన్ని తెలుగులో లిప్యంతరీకరిస్తుంది.
