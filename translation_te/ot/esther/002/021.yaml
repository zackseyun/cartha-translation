revisions:
- from: ఆ రోజుల్లో మొర్దెకై రాజద్వారం దగ్గర కూర్చొని ఉండగా, రాజు నపుంసక అధికారుల్లో[a] గడపను కాపాడే బిగ్తాను, తెరెషు అనే ఇద్దరు కోపించి, అహష్వేరోషు రాజు మీద చెయ్యి వేయాలని[b] చూశారు.
  to: ఆ రోజుల్లో మొర్దెకై రాజద్వారం వద్ద కూర్చొని ఉండగా, గడపను కాపాడే రాజు నపుంసక అధికారులైన బిగ్తాను, తెరెషు అనే ఇద్దరు కోపించి, అహష్వేరోషు రాజుపై చేయి వేయాలని[a] తలపెట్టారు.
  rationale: పాదటిప్పణి గుర్తు తప్పనిసరిగా ప్రధాన పాఠ్యంలో ఉండాలి కాబట్టి, సָרִיסకు సంబంధించిన ప్రత్యామ్నాయార్థపు పాదటిప్పణిని ‘నపుంసక అధికారులైన’ తర్వాత [b]గా జత చేశాం. వాక్యనిర్మాణాన్ని సరిచేసి, ఇద్దరు వ్యక్తులు రాజు నపుంసక అధికారులనీ గడప కాపలాదారులనీ స్పష్టం చేశాం; అలాగే וַיְבַקְשׁוּకు ‘తలపెట్టారు’ను వాడాం.
