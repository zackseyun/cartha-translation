base_translation:
  language: en
  yaml_path: translation/ot/esther/002/023.yaml
  text: When the matter was investigated and found to be so[a], both of them were hanged on a tree, and it was written in the book of the chronicles in the presence of the king.
translation:
  language: te
  text: ఆ విషయం విచారించబడగా, అది నిజమని తేలింది. అప్పుడు వారిద్దరినీ ఒక చెట్టుకు వేలాడదీశారు.[a] ఈ సంగతి రాజు సమక్షంలో దినవృత్తాంతాల గ్రంథంలో రాయబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక చెట్టుకు/కొయ్య స్తంభానికి గుచ్చివేశారు.’ హెబ్రీలో అక్షరార్థంగా ‘ఒక చెట్టుకు వేలాడదీశారు’ అని ఉంది; అయితే పారసీకుల నిర్దిష్ట శిక్షావిధానంలో కొయ్యకు గుచ్చడం లేదా బహిరంగంగా వేలాడదీయడం ఉండి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבֻקַּשׁ הַדָּבָר
  choice: ఆ విషయం విచారించబడగా
  rationale: బקש్ క్రియ యొక్క కర్మణి రూపం నివేదించబడిన కుట్రపై జరిగిన అధికారిక విచారణను సూచిస్తుంది. ‘విచారించబడగా’ కర్మణి భావాన్నీ న్యాయపరమైన సందర్భాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיִּמָּצֵא
  choice: అది నిజమని తేలింది
  rationale: ఈ కథన సందర్భంలో ఆరోపణ ధ్రువపడిందనే అంతర్భావాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּתָּלוּ
  choice: వేలాడదీశారు
  rationale: תלה ప్రాథమికంగా వేలాడదీయడాన్ని సూచిస్తుంది; పారసీక శిక్షావిధానం కేవలం ‘కొరతవేయడం’ అని నిర్దిష్టంగా తేల్చదు. అందువల్ల మూలంలోని విస్తృతార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: שְׁנֵיהֶם
  choice: వారిద్దరినీ
  rationale: కుట్రదారులైన ఇద్దరినీ కలిపి సూచించే హెబ్రీ పదబంధంలోని స్పష్టమైన ద్విత్వ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: עַל עֵץ
  choice: ఒక చెట్టుకు
  rationale: עֵץ అంటే అక్షరార్థంగా చెట్టు లేదా కలప. శిక్ష సందర్భంలో అది కొయ్య స్తంభం లేదా కొయ్య నిర్మాణాన్ని సూచించవచ్చు; ప్రధాన పాఠ్యం మూల పదానికి దగ్గరగా ఉంటుంది.
- source_word: וַיִּכָּתֵב
  choice: రాయబడింది
  rationale: כתב కర్మణి రూపానికి నేరమైన సమానార్థకం; అధికారిక రాజదర్బారు నమోదుకు కూడా సరిపోతుంది.
- source_word: בְּסֵפֶר דִּבְרֵי הַיָּמִים
  choice: దినవృత్తాంతాల గ్రంథంలో
  rationale: రోజువారీ రాజకార్య సంఘటనలను నమోదు చేసే అధికారిక గ్రంథాన్ని సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదబంధం.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: రాజు సమక్షంలో
  rationale: ‘రాజు ఎదుట/సమక్షంలో’ అనే మూలార్థాన్ని స్పష్టంగా తెలిపి రాజదర్బారు సందర్భాన్ని నిలుపుతుంది.
