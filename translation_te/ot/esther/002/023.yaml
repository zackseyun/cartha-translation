  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. అధికారిక విచారణ, మరణశిక్ష, రాజదర్బారు నమోదు అనే భావాలు స్పష్టంగా ఉండేలా చూసి, శిక్షావిధానంలోని మూలభాషా అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
