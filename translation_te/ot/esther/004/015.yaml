translation:
  language: te
  text: అప్పుడు ఎస్తేరు మొర్దెకైకి జవాబు పంపమని చెప్పింది:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా, “ఎస్తేరు మొర్దెకైకి తిరిగి జవాబు పంపమని చెప్పింది.” భావం: ఆమె అతనికి ప్రత్యుత్తరం పంపించాలని ఆదేశించింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... చెప్పింది
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. తరువాత వచ్చే క్రియాభావానికి అనుగుణంగా ‘చెప్పింది’ ఉపయోగించబడింది.
- source_word: אֶסְתֵּר
  choice: ఎస్తేరు
  rationale: హీబ్రూ వ్యక్తిపేరుకు ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: לְהָשִׁיב
  choice: జవాబు పంపమని
  rationale: שוב అనే క్రియ యొక్క హిఫీల్ ధాతురూపం ఇక్కడ ‘జవాబును తిరిగి పంపించడం’ అనే ప్రయోగార్థాన్ని ఇస్తుంది. సందర్భంలో మధ్యవర్తుల ద్వారా మొర్దెకైకి ప్రత్యుత్తరం పంపించమనే భావాన్ని ఇది సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל
  choice: మొర్దెకైకి
  rationale: ఈ ఉపసర్గ దిశను సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి ‘-కి’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: מָרְדֳּכָי
  choice: మొర్దెకై
  rationale: హీబ్రూ వ్యక్తిపేరుకు ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
