translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త ఆదేశభావాన్ని నిలుపుతూ, సందర్భంలో సూచితమైన సందేశవాహకులను ప్రధాన వాక్యంలో ప్రత్యేకంగా చేర్చలేదు.
