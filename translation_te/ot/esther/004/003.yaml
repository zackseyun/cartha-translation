translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. రాజసభ సందర్భానికి ‘శాసనం’ వాడబడింది. మూలంలోని చివరి వాక్యభాగపు సంక్షిప్తత వల్ల కలిగే నిజమైన ద్వంద్వార్థాన్ని ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
