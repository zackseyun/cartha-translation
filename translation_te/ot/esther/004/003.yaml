source:
  edition: WLC
  text: וּ/בְ/כָל מְדִינָ֣ה וּ/מְדִינָ֗ה מְקוֹם֙ אֲשֶׁ֨ר דְּבַר הַ/מֶּ֤לֶךְ וְ/דָת/וֹ֙ מַגִּ֔יעַ אֵ֤בֶל גָּדוֹל֙ לַ/יְּהוּדִ֔ים וְ/צ֥וֹם וּ/בְכִ֖י וּ/מִסְפֵּ֑ד שַׂ֣ק וָ/אֵ֔פֶר יֻצַּ֖ע לָֽ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/003.yaml
  text: And in every province[a], wherever the king’s word and his decree reached, there was great mourning among the Jews, with fasting and weeping and lamentation; sackcloth and ashes were spread out for many.
translation:
  language: te
  text: ప్రతి ప్రాంతంలోనూ, రాజు మాటా ఆయన శాసనమూ చేరిన ప్రతి చోటా, యూదులలో గొప్ప శోకం కలిగింది—ఉపవాసం, ఏడుపు, విలాపం జరిగాయి; గోనెపట్ట, బూడిద చాలామందికోసం పరచబడ్డాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చాలామంది గోనెపట్టనూ బూడిదనూ ఉపయోగించారు.” “పరచబడ్డాయి” తర్వాత ఉన్న హీబ్రూ לָרַבִּים సంక్షిప్తంగా ఉంది. ఈ శోకచిహ్నాలు చాలామందికోసం పరచబడ్డాయని లేదా చాలామంది వాటిని ఉపయోగించారని అది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה
  choice: ప్రతి సంస్థానంలో
  rationale: హీబ్రూలోని పంపిణీ భావాన్ని ఆధునిక తెలుగులో సహజంగా, సంపూర్ణత చెడకుండా వ్యక్తపరుస్తుంది.
- source_word: מְקוֹם אֲשֶׁר
  choice: ప్రతిచోటా
  rationale: రాజాజ్ఞ చేరిన అన్ని ప్రాంతాలనూ సూచించే పంపిణీ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: రాజు మాటా అతని శాసనం
  rationale: דְּבַר యొక్క ‘మాట’ అనే రూపాన్ని నిలుపుతూ, דָת యొక్క అధికారిక న్యాయసంబంధ బలాన్ని ‘శాసనం’ స్పష్టం చేస్తుంది.
- source_word: אֵבֶל גָּדוֹל לַיְּהוּדִים
  choice: యూదుల మధ్య గొప్ప దుఃఖం నెలకొంది
  rationale: సామూహికంగా అనుభవించిన తీవ్రమైన శోకస్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְצוֹם וּבְכִי וּמִסְפֵּד
  choice: వారు ఉపవాసం ఉండి, ఏడ్చి, విలపించారు
  rationale: మూడు నామవాచకాల ద్వారా వివరించిన శోకాచరణలను తెలుగులో సహజమైన క్రియారూపాలతో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: שַׂק וָאֵפֶר
  choice: గోనెపట్టా బూడిదా
  rationale: ప్రాచీన శోకాచరణకు సంబంధించిన రెండు దృశ్య చిహ్నాలను అర్థవంతంగా నిలుపుతుంది.
- source_word: יֻצַּע לָרַבִּים
  choice: చాలామందికి ... పరచబడ్డాయి
  rationale: Hophal క్రియలోని నిష్క్రియార్థాన్నీ, לָרַבִּים యొక్క సాధ్యమైన ‘చాలామందికి’ అర్థాన్నీ నేరుగా నిలుపుతుంది; మరో సాధ్యతను పాదసూచికలో ఇస్తుంది.
