  text: לֵךְ֩ כְּנ֨וֹס אֶת כָּל הַ/יְּהוּדִ֜ים הַֽ/נִּמְצְאִ֣ים בְּ/שׁוּשָׁ֗ן וְ/צ֣וּמוּ עָ֠לַ/י וְ/אַל תֹּאכְל֨וּ וְ/אַל תִּשְׁתּ֜וּ שְׁלֹ֤שֶׁת יָמִים֙ לַ֣יְלָה וָ/י֔וֹם גַּם אֲנִ֥י וְ/נַעֲרֹתַ֖/י אָצ֣וּם כֵּ֑ן וּ/בְ/כֵ֞ן אָב֤וֹא אֶל הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר לֹֽא כַ/דָּ֔ת וְ/כַ/אֲשֶׁ֥ר אָבַ֖דְתִּי אָבָֽדְתִּי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/016.yaml
  text: Go[a], gather all the Jews who are found in Susa, and fast for me. Do not eat or drink for three days[b], night and day. I and my young women also will fast in the same way. Then I will go to the king, though it is not according to the law; and if I perish[e][d][c], I perish.
translation:
  language: te
  text: “వెళ్లి, షూషనులో ఉన్న యూదులందరినీ సమకూర్చు. నా కోసం ఉపవాసం ఉండండి; మూడు రోజులు రాత్రింబగళ్లు తినకండి, తాగకండి. నేనూ నా పరిచారికలూ అలాగే ఉపవాసం ఉంటాం. ఆ తర్వాత, అది చట్టప్రకారం కాకపోయినా, నేను రాజు వద్దకు వెళ్తాను. నేను నశిస్తే, నశిస్తాను.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నశించినప్పుడు, నశిస్తాను.” హెబ్రీ వాక్యం చాలా సంక్షిప్తంగా, నొక్కిచెప్పేలా ఉంది; ఎస్తేరు తనకు ఎదురయ్యే ప్రమాదాన్ని అంగీకరిస్తున్నట్లు ఇది వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ כְּנוֹס
  choice: వెళ్లి... సమకూర్చు
  rationale: మొర్దెకైకి ఇచ్చిన రెండు ప్రత్యక్ష ఆజ్ఞలను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כָּל הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן
  choice: షూషనులో ఉన్న యూదులందరినీ
  rationale: הַנִּמְצְאִים అంటే అక్షరార్థంగా ‘కనబడుతున్న/ఉన్న’; తెలుగులో ‘ఉన్న’ అనేది సహజంగా అక్కడ ప్రస్తుతం ఉన్నవారందరినీ సూచిస్తుంది.
- source_word: וְצוּמוּ עָלַי
  choice: నా కోసం ఉపవాసం ఉండండి
  rationale: עָלַי ఇక్కడ ఎస్తేరు పరిస్థితిని ఉద్దేశించి, ఆమె నిమిత్తం చేసే ఉపవాసాన్ని సూచిస్తుంది.
- source_word: שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם
  choice: మూడు రోజులు రాత్రింబగళ్లు
  rationale: నిరవధిక కాలవ్యాప్తిని తెలిపే హెబ్రీ క్రమాన్ని సహజమైన తెలుగు సమాసంతో వ్యక్తం చేస్తుంది.
- source_word: גַּם אֲנִי וְנַעֲרֹתַי
  choice: నేనూ నా పరిచారికలూ
  rationale: נַעֲרוֹתַי ఇక్కడ ఎస్తేరుకు సేవచేసే యువతులు లేదా మహిళా పరిచారికలను సూచించవచ్చు; ‘పరిచారికలు’ సందర్భానికి తగిన స్పష్టమైన పదం.
- source_word: וּבְכֵן
  choice: ఆ తర్వాత
  rationale: ముందు చెప్పిన ఉపవాసం అనంతరం జరిగే చర్యకు మార్పును సహజంగా సూచిస్తుంది.
- source_word: אֲשֶׁר לֹא כַדָּת
  choice: అది చట్టప్రకారం కాకపోయినా
  rationale: రాజును సమీపించే చర్య చట్టబద్ధ నియమానికి అనుగుణం కాదనే భావాన్ని, సందర్భంలోని concessive సంబంధంతో అందిస్తుంది.
- source_word: וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי
  choice: నేను నశించాల్సివస్తే, నశిస్తాను
  rationale: హెబ్రీ వాక్యంలోని సంక్షిప్తత, పునరుక్తి, ప్రమాదాన్ని అంగీకరించే దృఢత్వాన్ని నిలుపుతూ దాని షరతార్థక సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఎస్తేరు చివరి మాటలో షరతు లేదా అనివార్యత
  choice: నేను నశించాల్సివస్తే, నశిస్తాను
  alternative: నేను నశించినప్పుడు, నశిస్తాను
  rationale: כַאֲשֶׁר రూపం ‘ఎలాగైతే/ఎప్పుడు’ అనే భావాన్నీ ఇవ్వగలదు; సందర్భం ప్రమాదాన్ని స్వీకరించే షరతార్థక వాక్యాన్ని బలపరుస్తుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజదర్బారు సందర్భానికి తగిన గౌరవభరితమైన శైలి. ప్రధాన వాక్యంలోని ఆజ్ఞలు, ఉపవాసపు తీవ్రత, చట్టాన్ని అతిక్రమించే ప్రమాదం, చివరి పునరుక్తి అన్నీ నిలుపబడ్డాయి.
