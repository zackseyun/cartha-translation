  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּקְרָא֩ אֶסְתֵּ֨ר לַ/הֲתָ֜ךְ מִ/סָּרִיסֵ֤י הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר הֶעֱמִ֣יד לְ/פָנֶ֔י/הָ וַ/תְּצַוֵּ֖/הוּ עַֽל מָרְדֳּכָ֑י לָ/דַ֥עַת מַה זֶּ֖ה וְ/עַל מַה זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/005.yaml
  text: Then Esther called for Hathach[a], one of the king’s eunuchs, whom he had appointed to attend her, and commanded him concerning Mordecai, to learn what this was and why it was.
translation:
  language: te
  text: అప్పుడు ఎస్తేరు, తనకు సేవచేయడానికి రాజు నియమించిన రాజ నపుంసకులలో ఒకడైన హతాకును[a] పిలిపించి, మొర్దెకై విషయం ఏమిటో, దానికి కారణమేమిటో తెలుసుకోవాలని అతనికి ఆజ్ఞాపించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాజ అధికారులలో ఒకడైన హతాకును.’ హీబ్రూ పదం ప్రత్యేకంగా నపుంసకుణ్ణి సూచించవచ్చు; కొన్ని సందర్భాల్లో సాధారణంగా రాజాస్థాన అధికారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא
  choice: అప్పుడు ఎస్తేరు ... పిలిపించి
  rationale: వయ్యిక్తోల్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన క్రమాన్ని తెలియజేస్తుంది. వ్యక్తినామానికి ముందు ל ఉండడం అతణ్ణి తన సమక్షానికి రప్పించిందనే భావాన్ని సూచిస్తుంది.
- source_word: לַהֲתָךְ
  choice: హతాకును
  rationale: వ్యక్తినామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించి, తెలుగు విభక్తిని జోడించాం.
- source_word: מִסָּרִיסֵי הַמֶּלֶךְ
  choice: రాజ నపుంసకులలో ఒకడైన
  rationale: סָרִיס సాధారణంగా రాజాస్థాన సందర్భంలో నపుంసకుణ్ణి సూచిస్తుంది. ‘రాజ అధికారి’ అనే విస్తృత అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ
  choice: తనకు సేవచేయడానికి రాజు నియమించిన
  rationale: క్రియకు కర్త ముందున్న ‘రాజు’ అని సహజంగా గ్రహించబడుతుంది. ‘ఆమె ఎదుట నిలిపిన’ అనే అక్షరార్థం ఇక్కడ అధికారిక నియామకం, పరిచర్య అనే భావాన్ని కలిగిస్తుంది; తెలుగులో దాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: וַתְּצַוֵּהוּ עַל מָרְדֳּכָי
  choice: మొర్దెకై విషయం ... అతనికి ఆజ్ఞాపించింది
  rationale: צוה క్రియలోని బలాన్ని ‘ఆజ్ఞాపించింది’ నిలుపుతుంది; עַל విచారణకు సంబంధించిన వ్యక్తిని సూచిస్తుంది.
- source_word: לָדַעַת
  choice: తెలుసుకోవాలని
  rationale: ఇది ఉద్దేశాన్ని తెలిపే క్రియారూపం; పంపిన వ్యక్తి ద్వారా విషయం కనుక్కోవాలనే ఉద్దేశాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מַה זֶּה וְעַל מַה זֶּה
  choice: విషయం ఏమిటో, దానికి కారణమేమిటో
  rationale: జత ప్రశ్నలలో మొదటిది పరిస్థితి ఏమిటని, రెండవది దాని కారణం ఏమిటని అడుగుతుంది. హీబ్రూ పునరుక్తిని కృత్రిమంగా అనుకరించకుండా రెండు ప్రశ్నల భేదాన్ని నిలిపాం.
