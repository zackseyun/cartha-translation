  text: וַ/יָּב֕וֹא עַ֖ד לִ/פְנֵ֣י שַֽׁעַר הַ/מֶּ֑לֶךְ כִּ֣י אֵ֥ין לָ/ב֛וֹא אֶל שַׁ֥עַר הַ/מֶּ֖לֶךְ בִּ/לְב֥וּשׁ שָֽׂק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/002.yaml
  text: He came as far as the front of the king’s gate[b][a], because no one could enter the king’s gate clothed in sackcloth.
translation:
  language: te
  text: అతడు రాజద్వారం ఎదుటివరకు వచ్చాడు[a]. ఎందుకంటే గోనెపట్ట ధరించి రాజద్వారంలోకి ప్రవేశించడానికి అనుమతి లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజద్వారం ముందు వరకు.” హీబ్రూ వాక్యం అతడు ద్వారం ఎదుట ఉన్న స్థలం వరకే వచ్చాడని నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “గోనెపట్ట ధరించి రాజద్వారంలోకి ప్రవేశం లేదు.” సందర్భంలో ఇది శోకవస్త్రంతో ప్రవేశించడంపై ఉన్న నిషేధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అతడు ... వచ్చాడు
  rationale: בוא యొక్క కథనరూపం మొర్దెకై రాజద్వారం వైపు వచ్చడాన్ని సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘వచ్చాడు’ సహజంగా ఉంది.
- source_word: עַד לִפְנֵי
  choice: ఎదుటివరకు
  rationale: עַד తెలిపే హద్దును, לִפְנֵי తెలిపే ‘ఎదుట’ అనే స్థలభావాన్ని రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది; అతడు ద్వారంలోకి ప్రవేశించలేదనే భావం స్పష్టమవుతుంది.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: రాజద్వారం
  rationale: రాజుకు సంబంధించిన ద్వారాన్ని తెలిపే సహజమైన, గౌరవప్రదమైన తెలుగు సమాసం; రాజప్రాసాద ప్రవేశద్వార సందర్భానికి సరిపోతుంది.
- source_word: כִּי אֵין לָבוֹא
  choice: ఎందుకంటే ... ప్రవేశించడానికి అనుమతి లేదు
  rationale: אֵין + క్రియానామ రూపం సందర్భంలో అమలులో ఉన్న నిషేధాన్ని సూచిస్తుంది. తెలుగు పాఠకునికి కారణ సంబంధాన్నీ నిషేధ భావాన్నీ సహజంగా తెలియజేస్తుంది; వ్యక్తిని ‘ఎవరూ’ అని మూలంలో లేనంతగా ముందుకు తేవదు.
- source_word: אֶל שַׁעַר הַמֶּלֶךְ
  choice: రాజద్వారంలోకి
  rationale: אֶל ఇక్కడ ద్వార ప్రదేశంలోకి ప్రవేశాన్ని సూచిస్తుంది; ‘లోకి’ గమ్యస్థాన భావాన్ని తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: בִּלְבוּשׁ שָׂק
  choice: గోనెపట్ట ధరించి
  rationale: శోక సూచకమైన שָׂק వస్త్రాన్ని ‘గోనెపట్ట’గా, ధరించిన స్థితిని సహజమైన తెలుగులో అందిస్తుంది; వస్త్రాల సంఖ్యను అనవసరంగా నిర్దిష్టం చేయదు.
