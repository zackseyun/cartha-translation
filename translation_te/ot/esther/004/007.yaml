source:
  edition: WLC
  text: וַ/יַּגֶּד ל֣/וֹ מָרְדֳּכַ֔י אֵ֖ת כָּל אֲשֶׁ֣ר קָרָ֑/הוּ וְ/אֵ֣ת פָּרָשַׁ֣ת הַ/כֶּ֗סֶף אֲשֶׁ֨ר אָמַ֤ר הָמָן֙ לִ֠/שְׁקוֹל עַל גִּנְזֵ֥י הַ/מֶּ֛לֶךְ ב/יהודיים לְ/אַבְּדָֽ/ם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/007.yaml
  text: Mordecai told him everything that had happened to him[a], and the exact amount of money that Haman had said he would weigh out into the king’s treasuries for the destruction of the Jews.
translation:
  language: te
  text: మొర్దెకై అతనికి తనకు జరిగినదంతా, యూదులను నాశనం చేయడానికి హామాను రాజు ఖజానాల కోసం తూచి చెల్లిస్తానని చెప్పిన డబ్బు ఖచ్చితమైన మొత్తాన్ని[a] తెలియజేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘డబ్బుకు సంబంధించిన పూర్తి వివరాన్ని,’ లేదా ‘డబ్బు మొత్తాన్ని.’ హీబ్రూ పదబంధం హామాను చెల్లించడానికి ప్రతిపాదించిన నిర్దిష్ట మొత్తాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: తెలియజేశాడు
  rationale: హిఫిల్ రూపం ‘తెలియజేయడం/చెప్పడం’ అనే భావాన్ని ఇస్తుంది. కథన సందర్భంలో ‘తెలియజేశాడు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: לוֹ
  choice: అతనికి
  rationale: సందర్భంలో ఈ సర్వనామం హతాకును సూచిస్తుంది; మూలంలోని సర్వనామాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  choice: తనకు జరిగినదంతా
  rationale: קָרָהוּ లోని ప్రత్యయాన్ని ‘తనకు’గా వ్యక్తపరుస్తూ, మొర్దెకైకి జరిగిన సమస్తాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: פָּרָשַׁת הַכֶּסֶף
  choice: డబ్బు యొక్క ఖచ్చితమైన మొత్తాన్ని
  rationale: פָּרָשָׁה ఇక్కడ నిర్దిష్ట వివరం లేదా పేర్కొన్న మొత్తాన్ని సూచించవచ్చు. హామాను ప్రతిపాదించిన ధనరాశి సందర్భంలో ‘ఖచ్చితమైన మొత్తం’ భావాన్ని స్పష్టంగా అందిస్తుంది; ప్రత్యామ్నాయ అర్థాలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: אָמַר ... לִשְׁקוֹל
  choice: తూచి ఇస్తానని చెప్పిన
  rationale: హామాను చెప్పిన మాటను, వెండిని బరువుతో కొలిచి చెల్లించే దృశ్యాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: לִשְׁקוֹל
  choice: తూచి ఇవ్వడం
  rationale: పురాతన ఆర్థిక సందర్భంలో వెండిని బరువుతో కొలిచే నిర్దిష్ట చిత్రణను సాధారణ ‘చెల్లించడం’ కంటే మెరుగ్గా కాపాడుతుంది.
- source_word: עַל גִּנְזֵי הַמֶּלֶךְ
  choice: రాజు ఖజానాల్లోకి
  rationale: గింజే అనే బహువచనాన్ని ‘ఖజానాలు’గా నిలుపుతూ, ధనం వాటిలో జమ చేయబడే భావాన్ని ‘లోకి’ తెలియజేస్తుంది.
- source_word: ביהודיים ... לְאַבְּדָם
  choice: యూదులను నాశనం చేయడానికి
  rationale: యూదులే విధ్వంసక చర్యకు లక్ష్యమని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; ప్రత్యయం సూచించే ‘వారిని’ అనే భావం ‘యూదులను’లో సమగ్రంగా వ్యక్తమవుతుంది.
