  to: మొర్దెకై అతనికి తనకు జరిగినదంతా, యూదులను నాశనం చేయడానికి హామాను రాజు ఖజానాల కోసం తూచి చెల్లిస్తానని చెప్పిన డబ్బు ఖచ్చితమైన మొత్తాన్ని[a] తెలియజేశాడు.
