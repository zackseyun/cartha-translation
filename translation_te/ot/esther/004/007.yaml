translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని ‘తూచి ఇవ్వడం’ అనే ఆర్థిక చిత్రణను, ‘ఖజానాలు’ అనే బహువచనాన్ని నిలుపుతూ, פָּרָשַׁת הַכֶּסֶף లోని అర్థసంభావ్యతను పాదసూచికలో సంరక్షించాం.
