reference: Esther 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/תָּבוֹאינָה נַעֲר֨וֹת אֶסְתֵּ֤ר וְ/סָרִיסֶ֨י/הָ֙ וַ/יַּגִּ֣ידוּ לָ֔/הּ וַ/תִּתְחַלְחַ֥ל הַ/מַּלְכָּ֖ה מְאֹ֑ד וַ/תִּשְׁלַ֨ח בְּגָדִ֜ים לְ/הַלְבִּ֣ישׁ אֶֽת מָרְדֳּכַ֗י וּ/לְ/הָסִ֥יר שַׂקּ֛/וֹ מֵ/עָלָ֖י/ו וְ/לֹ֥א קִבֵּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/004.yaml
  text: Esther’s young women and her eunuchs came and told her[a], and the queen was greatly distressed. She sent garments to clothe Mordecai and to remove his sackcloth from him[c][b], but he did not accept them.
translation:
  language: te
  text: ఎస్తేరు పరిచారికలూ[a] ఆమె నపుంసకులూ[b] వచ్చి ఆమెకు ఆ సంగతి తెలియజేశారు. అప్పుడు రాణి ఎంతో కలవరపడింది. మొర్దెకైకి బట్టలు తొడిగించడానికి, అతనిమీద ఉన్న గోనెపట్టను[c] తీసివేయడానికి ఆమె బట్టలు పంపించింది. కాని అతడు వాటిని స్వీకరించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: “యువతులు”; ఇక్కడ ఎస్తేరు పరిచారికలను సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: “నపుంసకులు” అనే పదం కొన్ని సందర్భాల్లో రాజోద్యోగులను కూడా సూచించవచ్చు; అయితే ఎస్తేరు గ్రంథంలోని రాజభవన సందర్భంలో “నపుంసకులు” అనే నిర్దిష్ట అర్థమే ఎక్కువగా సరిపోతుంది.
    reason: cultural_note
  - marker: c
    text: గోనెపట్ట అనేది దుఃఖం, శోకం లేదా అవమానానికి సూచనగా ధరించే ముతక వస్త్రం.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹת
  choice: పరిచారికలు
  rationale: రాజభవన సందర్భంలో ఈ పదం ఎస్తేరు సేవలో ఉన్న యువతులను సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో వారి పాత్రను స్పష్టంగా తెలియజేయడానికి ‘పరిచారికలు’ అని అనువదించాం; పదశః ప్రత్యామ్నాయం పాదసూచికలో ఉంచాం.
- source_word: וְסָרִיסֶיהָ
  choice: ఆమె నపుంసకులు
  rationale: పర్షియా రాజభవన సందర్భంలో סָרִיס అనే పదానికి ‘నపుంసకులు’ అనే నిర్దిష్ట అర్థమే చారిత్రకంగా, పాఠ్యపరంగా తగినది; కొన్ని సందర్భాల్లో ‘రాజోద్యోగులు’ అనే విస్తృత అర్థం ఉండగలదని పాదసూచిక తెలియజేస్తుంది.
- source_word: וַיַּגִּידוּ לָהּ
  choice: వచ్చి ఆమెకు ఆ సంగతి తెలియజేశారు
  rationale: హీబ్రూ కథన క్రమంలోని రావడం, తెలియజేయడం రెండింటినీ నిలుపుతూ, ముందరి సందర్భాన్ని సూచించే కర్మను తెలుగులో సహజత కోసం ‘ఆ సంగతి’గా స్పష్టం చేశాం.
- source_word: וַתִּתְחַלְחַל
  choice: ఎంతో కలవరపడింది
  rationale: ఈ క్రియ తీవ్రమైన అంతరంగ కుదుపు లేదా ఆందోళనను సూచిస్తుంది. ‘ఎంతో కలవరపడింది’ భావతీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַמַּלְכָּה
  choice: రాణి
  rationale: ఎస్తేరు రాజపదవిని సూచించే నిర్దిష్ట బిరుదుకు నేరమైన తెలుగు రూపం.
- source_word: בְּגָדִים
  choice: బట్టలు
  rationale: ఆధునిక సాధారణ తెలుగులో స్పష్టమైన, సహజమైన పదం; సందర్భంలో గౌరవాన్ని తగ్గించదు.
- source_word: לְהַלְבִּישׁ אֶת מָרְדֳּכַי
  choice: మొర్దెకైకి బట్టలు తొడిగించి
  rationale: క్రియ యొక్క causative భావాన్ని, పంపిన బట్టల ఉద్దేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּלְהָסִיר שַׂקּוֹ מֵעָלָיו
  choice: అతని మీదున్న గోనెపట్టను తీసివేయడానికి
  rationale: వస్త్రాన్ని అతని శరీరం మీదనుంచి తొలగించాలనే స్పష్టమైన చర్యను కాపాడుతుంది.
- source_word: שַׂקּוֹ
  choice: అతని మీదున్న గోనెపట్టను
  rationale: שַׂק సూచించే ముతక శోకవస్త్రం అనే నిర్దిష్ట సాంస్కృతిక వస్తువును సాధారణ పాఠకునికి గ్రాహ్యంగా అందిస్తుంది; దాని ఆచారార్థం పాదసూచికలో వివరించాం.
- source_word: וְלֹא קִבֵּל
  choice: కాని అతడు వాటిని స్వీకరించలేదు
  rationale: హీబ్రూలో కర్మ వ్యక్తంగా లేకున్నా, సందర్భానుసారం పంపిన బట్టలే ఉద్దేశ్యం. ‘వాటిని’ చేర్చడం తెలుగులో స్పష్టతనిస్తుంది; వాక్యం అతడు స్వీకరించని వాస్తవాన్ని మాత్రమే చెబుతుంది.
