  text: Then Esther spoke to Hathach and commanded him to go to Mordecai[a].
translation:
  language: te
  text: అప్పుడు ఎస్తేరు హతాకుకు చెప్పి, మొర్దెకై దగ్గరకు వెళ్లమని అతనికి ఆజ్ఞాపించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వచనం అక్షరార్థంగా, “అప్పుడు ఎస్తేరు హతాకుకు చెప్పి, అతనికి మొర్దెకై వైపునకు ఆజ్ఞాపించింది” అని ఉంది. ‘వెళ్లమని’ అనే క్రియ హీబ్రూలో స్పష్టంగా లేదు; హతాకు మొర్దెకై దగ్గరకు వెళ్లాలని ఎస్తేరు ఆజ్ఞాపించిందని సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ఎస్తేరు ... మాట్లాడి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది కాబట్టి ‘అప్పుడు’ అని అనువదించాం. אמר సాధారణంగా ‘చెప్పు’ అని అర్థమైనా, హతాకును ఉద్దేశించి పలికిన సందర్భంలో ‘మాట్లాడి’ సహజంగా ఉంటుంది.
- source_word: אֶסְתֵּר
  choice: ఎస్తేరు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לַהֲתָךְ
  choice: హతాకుతో
  rationale: ל ఇక్కడ ఎస్తేరు మాటలకు పరోక్ష కర్మను సూచిస్తుంది. తెలుగులో ‘హతాకుతో మాట్లాడి’ అనే ప్రయోగం సహజంగా ఉంది.
- source_word: וַתְּצַוֵּהוּ
  choice: అతనికి ఆజ్ఞాపించింది
  rationale: צוה పియేల్ రూపం స్పష్టమైన ఆజ్ఞ లేదా నిర్దేశాన్ని సూచిస్తుంది. కర్మప్రత్యయం హతాకును సూచిస్తుంది.
- source_word: אֶל
  choice: దగ్గరకు వెళ్లమని
  rationale: אֶל అక్షరార్థంగా ‘వైపు/దగ్గరకు’ అని దిశను సూచిస్తుంది. ‘ఆజ్ఞాపించింది’తో తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు సందర్భంలో అంతర్లీనమైన ‘వెళ్లమని’ని చేర్చాం.
- source_word: מָרְדֳּכָי
  choice: మొర్దెకై
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు సంప్రదాయంలో విస్తృతంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం.
