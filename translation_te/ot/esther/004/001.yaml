source:
  edition: WLC
  text: וּ/מָרְדֳּכַ֗י יָדַע֙ אֶת כָּל אֲשֶׁ֣ר נַעֲשָׂ֔ה וַ/יִּקְרַ֤ע מָרְדֳּכַי֙ אֶת בְּגָדָ֔י/ו וַ/יִּלְבַּ֥שׁ שַׂ֖ק וָ/אֵ֑פֶר וַ/יֵּצֵא֙ בְּ/ת֣וֹךְ הָ/עִ֔יר וַ/יִּזְעַ֛ק זְעָקָ֥ה גְדֹלָ֖ה וּ/מָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/001.yaml
  text: When Mordecai learned all that had been done[a], Mordecai tore his clothes and put on sackcloth and ashes. Then he went out into the midst of the city and cried out with a great and bitter cry.
translation:
  language: te
  text: మొర్దెకై జరిగినదంతా తెలుసుకున్నప్పుడు, తన బట్టలు చింపుకొని, గోనెపట్టను ధరించుకొని బూడిద చల్లుకున్నాడు. తరువాత అతడు నగరం మధ్యలోకి వెళ్లి, బిగ్గరైన, తీవ్ర దుఃఖంతో కూడిన కేక వేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఉద్ఘాటన కోసం ‘కేక వేయడం’ అనే క్రియతో అదే మూలానికి చెందిన ‘కేక’ అనే నామవాచకం వాడబడింది. దీనిని ‘బిగ్గరగా, తీవ్ర దుఃఖంతో కేక వేశాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַע
  choice: తెలుసుకున్నప్పుడు
  rationale: ఇక్కడ ఈ క్రియ మొర్దెకైకి జరిగిన విషయాలు తెలిసిన సందర్భాన్ని సూచిస్తుంది. ‘తెలుసుకున్నప్పుడు’ అనేది ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כָּל אֲשֶׁר נַעֲשָׂה
  choice: జరిగినదంతా
  rationale: హీబ్రూ నిష్క్రియ నిర్మాణంలోని విస్తృత భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది; ఎవరు చేశారో వాక్యంలో చేర్చి అస్పష్టతను తొలగించదు.
- source_word: וַיִּקְרַע ... אֶת בְּגָדָיו
  choice: తన బట్టలు చింపుకొని
  rationale: శోకానికి సూచనగా బట్టలు చింపుకోవడం అనే చర్యను ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: שַׂק וָאֵפֶר
  choice: గోనెపట్ట కట్టుకొని బూడిద పోసుకున్నాడు
  rationale: శోకం, దీనత్వం వ్యక్తపరిచే రెండు హీబ్రూ చిహ్నాలనూ నిలుపుతూ, తెలుగులో సహజమైన క్రియలతో అందిస్తుంది.
- source_word: בְּתוֹךְ הָעִיר
  choice: నగరం మధ్యలోకి
  rationale: בְּתוֹךְ లోని ‘మధ్యలో’ అనే ప్రాదేశిక భావాన్ని కాపాడుతుంది; నిర్దిష్టమైన ‘నగర కేంద్రం’ అని మితిమీరిన అర్థనిర్ణయం చేయదు.
- source_word: וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה
  choice: గొప్పదైన, చేదైన కేక వేశాడు
  rationale: క్రియతో అదే మూలానికి చెందిన నామవాచకాన్ని జతచేసిన హీబ్రూ ఉద్ఘాటనను ‘కేక వేశాడు’ ద్వారా సహజంగా అందిస్తూ, גְדֹלָה మరియు מָרָה పదాల ‘గొప్ప’ మరియు ‘చేదు’ రూపకాల బలాన్ని నిలుపుతుంది.
- source_word: וַ
  choice: తరువాత
  rationale: వావ్-అనుక్రమ నిర్మాణం కథనాన్ని ముందుకు తీసుకెళ్లే క్రమాన్ని తెలుగులో స్పష్టంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలి వాడబడింది. శోకాచారాలకు సంబంధించిన మూలపాఠంలోని స్పష్టమైన దృశ్యభాషను సరళీకరించకుండా నిలిపాం.
