id: EST.4.14
reference: Esther 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י אִם הַחֲרֵ֣שׁ תַּחֲרִישִׁי֮ בָּ/עֵ֣ת הַ/זֹּאת֒ רֶ֣וַח וְ/הַצָּלָ֞ה יַעֲמ֤וֹד לַ/יְּהוּדִים֙ מִ/מָּק֣וֹם אַחֵ֔ר וְ/אַ֥תְּ וּ/בֵית אָבִ֖י/ךְ תֹּאבֵ֑דוּ וּ/מִ֣י יוֹדֵ֔עַ אִם לְ/עֵ֣ת כָּ/זֹ֔את הִגַּ֖עַתְּ לַ/מַּלְכֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/014.yaml
  text: For if you remain silent at this time, relief and deliverance will arise for the Jews from another place, but you and your father's house will perish. And who knows whether you have come to your royal position for a time like this?
translation:
  language: te
  text: ఎందుకంటే, నీవు ఈ సమయంలో మౌనంగా ఉండిపోతే, యూదులకు ఉపశమనం, రక్షణ మరొక చోటు నుండి కలుగుతాయి. అయితే నీవూ నీ తండ్రి ఇంటివారూ నశించిపోతారు. ఇలాంటి సమయం కోసమేమో నీవు రాణి పదవికి చేరుకున్నావు—ఎవరికి తెలుసు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: ఎందుకంటే, ... పోతే
  rationale: మునుపటి మాటకు వివరణను జోడిస్తూ షరతును తెలిపే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַחֲרֵשׁ תַּחֲרִישִׁי
  choice: మౌనంగా ఉండిపోతే
  rationale: క్రియను బలపరిచే infinitive absolute, ఈ సంక్షోభ సమయంలో మాట్లాడకుండా అలాగే ఉండిపోవడాన్ని సూచిస్తుంది.
- source_word: רֶוַח וְהַצָּלָה
  choice: ఉపశమనమూ రక్షణా
  rationale: మొదటి పదంలోని కష్టంనుంచి ఊరట భావాన్నీ, రెండవ పదంలోని ప్రమాదంనుంచి కాపాడబడే భావాన్నీ వేరుగా నిలుపుతుంది.
- source_word: יַעֲמוֹד
  choice: కలుగుతాయి
  rationale: అక్షరార్థమైన ‘నిలుస్తుంది’ కంటే, సహాయం మరో చోటు నుండి ఉద్భవించి అందుబాటులోకి వస్తుందనే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מִמָּקוֹם אַחֵר
  choice: మరొక చోటు నుండి
  rationale: సహాయం వచ్చే మూలాన్ని స్పష్టంగా గుర్తించకుండా ఉంచిన హీబ్రూ పదబంధంలోని ఉద్దేశపూర్వక అనిర్దిష్టతను కాపాడుతుంది.
- source_word: וְאַתְּ וּבֵית אָבִיךְ
  choice: నీవూ నీ తండ్రి ఇంటివారూ
  rationale: ‘తండ్రి ఇల్లు’ అనే హీబ్రూ బంధుత్వ భావాన్ని ఆధునిక పాఠకులకు అర్థమయ్యే విధంగా కుటుంబ/గృహ సభ్యులను సూచించే తెలుగులో అందిస్తుంది.
- source_word: תֹּאבֵדוּ
  choice: నశించిపోతారు
  rationale: మరణం లేదా సంపూర్ణ పతనం రెండింటినీ కలిగి ఉండగల אבד క్రియ యొక్క విస్తృతమైన గంభీర భావాన్ని నిలుపుతుంది.
- source_word: וּמִי יוֹדֵעַ אִם
  choice: వచ్చావేమో—ఎవరికి తెలుసు?
  rationale: నిశ్చయంగా ప్రకటించకుండా ఒక సాధ్యతను లేవనెత్తే అలంకార ప్రశ్న యొక్క తెరవబడిన స్వభావాన్ని నిలుపుతుంది.
- source_word: לְעֵת כָּזֹאת הִגַּעַתְּ לַמַּלְכוּת
  choice: ఇలాంటి సమయం కోసమే నీవు రాజస్థానానికి వచ్చావు
  rationale: రాజసంబంధమైన స్థానానికి చేరడాన్ని సహజంగా చెబుతూ, ‘ఈ సమయం కోసం’ అనే సాధ్యమైన ఉద్దేశాన్ని మూలవాక్యంలాగే పరోక్షంగా ఉంచుతుంది.
theological_decisions:
- issue: ‘మరొక చోటు నుండి’ మరియు ‘ఇలాంటి సమయం కోసమే’ అనే మాటల్లో సూచితమైన దైవ పరిపాలన
  choice: ప్రధాన పాఠ్యంలో దేవుణ్ణి ప్రత్యక్షంగా పేర్కొనకుండా పరోక్ష భాషనే ఉంచడం
  alternative: ‘దేవుని నుండి’ లేదా ‘దేవుని సంకల్పం ప్రకారం ఈ సమయం కోసం’ అని స్పష్టీకరించడం
  rationale: ఈ వాక్యం దైవ పరిపాలనను బలంగా సూచించవచ్చు; అయినా హీబ్రూ పాఠ్యం ఇక్కడ దేవుణ్ణి పేరుపెట్టి చెప్పదు. అందువల్ల దాని ధార్మిక ఉద్వేగం మరియు అనిశ్చితిని అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే సందర్భపు గంభీరతకు తగిన మర్యాదపూర్వక శైలి. పాతకాలపు క్రియారూపాలు, అధిక సంస్కృతీకరణ, మరియు పాఠ్యంలో లేని వివరణలను నివారించాం.
