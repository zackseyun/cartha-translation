  to: 'రాజు సేవకులందరికీ, రాజు ప్రాంతాల ప్రజలందరికీ ఈ విషయం తెలుసు: పిలుపు లేకుండా[a] లోపలి ప్రాంగణంలో రాజు వద్దకు వెళ్లే ఏ పురుషుడికైనా స్త్రీకైనా ఒకే చట్టం ఉంది[b]—మరణశిక్ష. అయితే రాజు ఎవరికైతే బంగారు రాజదండాన్ని చాపుతాడో, వారు ప్రాణాలతో ఉంటారు. కానీ నేను రాజు వద్దకు వెళ్లడానికి పిలవబడక ముప్పై రోజులైంది.'
