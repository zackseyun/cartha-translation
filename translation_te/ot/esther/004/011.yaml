source:
  edition: WLC
  text: כָּל עַבְדֵ֣י הַ/מֶּ֡לֶךְ וְ/עַם מְדִינ֨וֹת הַ/מֶּ֜לֶךְ יֽוֹדְעִ֗ים אֲשֶׁ֣ר כָּל אִ֣ישׁ וְ/אִשָּׁ֡ה אֲשֶׁ֣ר יָבֽוֹא אֶל הַ/מֶּלֶךְ֩ אֶל הֶ/חָצֵ֨ר הַ/פְּנִימִ֜ית אֲשֶׁ֣ר לֹֽא יִקָּרֵ֗א אַחַ֤ת דָּת/וֹ֙ לְ/הָמִ֔ית לְ֠/בַד מֵ/אֲשֶׁ֨ר יֽוֹשִׁיט ל֥/וֹ הַ/מֶּ֛לֶךְ אֶת שַׁרְבִ֥יט הַ/זָּהָ֖ב וְ/חָיָ֑ה וַ/אֲנִ֗י לֹ֤א נִקְרֵ֨אתי֙ לָ/ב֣וֹא אֶל הַ/מֶּ֔לֶךְ זֶ֖ה שְׁלוֹשִׁ֥ים יֽוֹם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/011.yaml
  text: 'All the king’s servants and the people of the king’s provinces know that for any man or woman who goes to the king in the inner court without being summoned[a], there is one law for him: to be put to death, except for the one to whom the king extends the golden scepter, so that he may live. But as for me[b], I have not been summoned to go in to the king these thirty days.'
translation:
  language: te
  text: 'రాజు సేవకులందరికీ, రాజు ప్రాంతాల ప్రజలందరికీ ఈ విషయం తెలుసు: పిలుపు లేకుండా[a] లోపలి ప్రాంగణంలో రాజు వద్దకు వెళ్లే ఏ పురుషుడికైనా స్త్రీకైనా ఒకే చట్టం ఉంది[b]—మరణశిక్ష. అయితే రాజు ఎవరికైతే బంగారు రాజదండాన్ని చాపుతాడో, వారు ప్రాణాలతో ఉంటారు. కానీ నేను రాజు వద్దకు వెళ్లడానికి పిలవబడక ముప్పై రోజులైంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పిలవబడకుండా.” ఇక్కడి హీబ్రూ కర్మణి క్రియ అధికారిక రాజసభ పిలుపును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా, “ఒకే శాసనం ఉంది: మరణం.” హీబ్రూ నుడికారం ఇటువంటి సందర్భంలో వర్తించే ఒకే స్థిరమైన చట్టాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: సేవకులు
  rationale: రాజు సేవలో ఉన్నవారిని విస్తృతంగా సూచించే సహజమైన పదం; ఈ సందర్భంలో ‘బానిసలు’ అనడం అవసరానికి మించి నిర్దిష్టంగా ఉంటుంది.
- source_word: וְעַם מְדִינוֹת הַמֶּלֶךְ
  choice: రాజు పాలించే ప్రాంతాల ప్రజలు
  rationale: సామ్రాజ్యంలోని పరిపాలనా ప్రాంతాల విస్తృత ప్రజానీకాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: పురుషుడికైనా స్త్రీకైనా
  rationale: మూలంలోని రెండు లింగాల స్పష్ట ప్రస్తావనను, పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: יָבוֹא אֶל הַמֶּלֶךְ אֶל הֶחָצֵר הַפְּנִימִית
  choice: రాజును కలవడానికి లోపలి ప్రాంగణంలోకి వెళ్లే
  rationale: నిషిద్ధమైన లోపలి రాజప్రాంగణంలో ప్రవేశించి రాజును సమీపించే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר לֹא יִקָּרֵא
  choice: పిలుపు లేకుండా
  rationale: అధికారికంగా పిలవబడకుండానే రాజసన్నిధిలో ప్రవేశించడాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַחַת דָּתוֹ
  choice: వర్తించే చట్టం ఒక్కటే
  rationale: ప్రతి అలాంటి సందర్భానికీ ఒకే స్థిరమైన చట్టపరమైన ఫలితం ఉందనే హీబ్రూ నుడికార భావాన్ని నిలుపుతుంది.
- source_word: לְהָמִית
  choice: మరణశిక్ష
  rationale: ఇది సహజ మరణం కాక విధించబడే న్యాయశిక్ష అని స్పష్టపరుస్తుంది.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: బంగారు రాజదండం
  rationale: రాజాధికారానికి, అనుగ్రహానికి చిహ్నమైన దండాన్ని ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: וְחָיָה
  choice: ప్రాణాలతో బయటపడతారు
  rationale: రాజు దండం చాపడం వల్ల మరణశిక్ష తప్పి జీవించడం అనే ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: זֶה שְׁלוֹשִׁים יוֹם
  choice: ఇప్పటికి ముప్పై రోజులైంది
  rationale: గత ముప్పై రోజులుగా పిలుపు రాలేదనే కాలవ్యవధిని సహజమైన తెలుగు వాక్య నిర్మాణంలో తెలియజేస్తుంది.
