  text: And they told Mordecai Esther’s words[a].
translation:
  language: te
  text: వారు ఎస్తేరు మాటలను[a] మొర్దెకైకి తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎస్తేరు సందేశాన్ని’ లేదా ‘ఎస్తేరు జవాబును.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: వారు ... తెలియజేశారు
  rationale: נגד ధాతువు హిఫీల్ వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి చర్యను, పేర్కొనబడని బహువచన కర్తతో తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘తెలియజేశారు’ అనేది సమాచారాన్ని అందించడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְמָרְדֳּכָי
  choice: మొర్దెకైకి
  rationale: לְ పరోక్ష కర్మను సూచిస్తుంది; తెలుగులో ‘-కి’ విభక్తితో సహజంగా వ్యక్తమవుతుంది. పేరును ‘మొర్దెకై’గా లిప్యంతరీకరించాం.
- source_word: אֵת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది హెబ్రీ భాషలో ప్రత్యక్ష కర్మ సూచిక. తెలుగులో దీనికి విడిగా సమానార్థక పదం అవసరం లేదు; వాక్య నిర్మాణమే దాని విధిని తెలియజేస్తుంది.
- source_word: דִּבְרֵי
  choice: మాటలను
  rationale: דָּבָר పదపు నిర్మాణ బహువచన రూపం ఇక్కడ ‘మాటలు,’ ‘సందేశం,’ లేదా సందర్భానుసారంగా ‘జవాబు’ అని అర్థమివ్వగలదు. ‘మాటలను’ మూలానికి అత్యంత పారదర్శకంగా ఉండి, ఎస్తేరు పలికిన విషయాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶסְתֵּר
  choice: ఎస్తేరు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం; דִּבְרֵיతో ఉన్న సంబంధం తెలుగులో పదక్రమం ద్వారా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. పేర్కొనబడని బహువచన కర్తను ‘వారు’గా ఉంచాం. మూలంలోని פ పేరా విరామ సూచికను పద్య పాఠ్యంలో విడిగా చూపలేదు.
