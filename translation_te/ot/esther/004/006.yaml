  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని గమ్యస్థాన క్రమాన్ని నిలుపుతూ, తెలుగు వాక్యప్రవాహానికి అనుగుణంగా స్థల వివరణను అమర్చాం.
