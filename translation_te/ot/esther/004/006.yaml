base_translation:
  language: en
  yaml_path: translation/ot/esther/004/006.yaml
  text: So Hathach went out to Mordecai[a], to the open square of the city that was in front of the king's gate.
translation:
  language: te
  text: అప్పుడు హతాకు బయటకు వెళ్లి, రాజద్వారం ఎదుట ఉన్న నగర బహిరంగ ప్రాంగణంలో ఉన్న మొర్దెకై దగ్గరికి వెళ్లాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నగర చౌకుకు’; ఇక్కడి హీబ్రూ పదం ఆధునిక అర్థంలోని వీధిని తప్పనిసరిగా సూచించదు; విశాలమైన బహిరంగ ప్రజాస్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: వెళ్లాడు
  rationale: יצא ఇక్కడ కథనంలోని పూర్తయిన గత చర్యను సూచిస్తుంది. హతాకు ఎస్తేరు ఉన్న అంతఃపురం నుంచి బయటకు వెళ్లిన భావం సందర్భం ద్వారా స్పష్టమవుతుంది; సహజమైన తెలుగు కోసం ‘వెళ్లాడు’ ఎంచుకున్నాం.
- source_word: הֲתָךְ
  choice: హతాకు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సులభంగా పలికేలా లిప్యంతరీకరించాం.
- source_word: אֶל מָרְדֳּכָי
  choice: మొర్దెకై దగ్గరికి
  rationale: אֶל గమ్యాన్ని సూచిస్తుంది. వ్యక్తిని కలుసుకోవడానికి వెళ్లే సందర్భంలో ‘దగ్గరికి’ సహజమైన ఆధునిక తెలుగు.
- source_word: אֶל רְחוֹב הָעִיר
  choice: నగర బహిరంగ ప్రాంగణానికి
  rationale: רְחוֹב ఆధునిక అర్థంలోని వీధిని మాత్రమే కాక, నగరంలోని విశాలమైన బహిరంగ ప్రజాస్థలాన్ని సూచిస్తుంది. అందువల్ల ‘బహిరంగ ప్రాంగణం’ మూలార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֲשֶׁר לִפְנֵי
  choice: ఎదుట ఉన్న
  rationale: స్థల సంబంధాన్ని తెలిపే ఈ పదబంధానికి ‘ఎదుట ఉన్న’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: రాజద్వారం
  rationale: ‘రాజు యొక్క ద్వారం’ అనే నిర్మాణాన్ని తెలుగులో స్థిరమైన, గౌరవప్రదమైన ‘రాజద్వారం’గా అందించాం; ఇది రాజప్రాసాద ప్రవేశద్వారాన్ని సూచిస్తుంది.
