  text: So Mordecai went away and did according to all that Esther had commanded him[a].
translation:
  language: te
  text: అప్పుడు మొర్దెకై వెళ్లి, ఎస్తేరు అతనికి ఆజ్ఞాపించినదంతా చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముందుకు వెళ్లి’ లేదా ‘దాటి వెళ్లి.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘దాటడం/గుండా వెళ్లడం’ అనే భావం ఉంది; అయితే ఇక్కడ ఎస్తేరు ఆజ్ఞాపించినది చేయడానికి మొర్దెకై వెళ్లడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: అక్కడి నుంచి వెళ్లి
  rationale: עבר అనే క్రియకు ప్రాథమికంగా ‘దాటి వెళ్లడం/గుండా వెళ్లడం’ అనే విస్తృత అర్థం ఉంది. ఈ కథన సందర్భంలో ఎస్తేరు చెప్పినది చేయడానికి మొర్దెకై అక్కడి నుంచి బయలుదేరడాన్ని ఇది సూచిస్తుంది; ‘అక్కడి నుంచి వెళ్లి’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భానికి మించిన నిర్దిష్ట దాటుదల భావాన్ని చేర్చదు.
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే సాధారణ ‘చేయు’ క్రియను సూటిగా ప్రతిబింబిస్తూ, కథన శైలిని నిలుపుతుంది.
- source_word: כְּכֹל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతా
  rationale: כְּ ఉపసర్గ సూచించే అనుగుణతను తెలుగు వాక్య నిర్మాణంలో ‘ఆజ్ఞాపించినదంతా చేశాడు’ సహజంగా వ్యక్తం చేస్తుంది; כֹּל యొక్క సమగ్ర భావం ‘అంతా’లో నిలుస్తుంది.
- source_word: צִוְּתָה
  choice: ఆజ్ఞాపించిన
  rationale: צוה యొక్క ‘ఆజ్ఞాపించు’ భావాన్ని తటస్థంగా, గౌరవప్రదంగా తెలియజేస్తుంది; తెలుగు కృదంత నిర్మాణం ఆ ఆజ్ఞ మొర్దెకై చర్యకు ముందే ఇచ్చబడిందని సహజంగా సూచిస్తుంది.
- source_word: עָלָיו
  choice: తనకు
  rationale: צוה తో వచ్చిన עַל ఇక్కడ ఆజ్ఞ అందుకున్న వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘తనకు ఆజ్ఞాపించిన’ అనేది సహజ ప్రయోగం; ‘తనకు’ మొర్దెకైని సూచిస్తుంది.
- source_word: אֶסְתֵּר
  choice: ఎస్తేరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంతో లిప్యంతరీకరించింది.
