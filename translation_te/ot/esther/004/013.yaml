source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מָרְדֳּכַ֖י לְ/הָשִׁ֣יב אֶל אֶסְתֵּ֑ר אַל תְּדַמִּ֣י בְ/נַפְשֵׁ֔/ךְ לְ/הִמָּלֵ֥ט בֵּית הַ/מֶּ֖לֶךְ מִ/כָּל הַ/יְּהוּדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/013.yaml
  text: Then Mordecai said to reply to Esther, “Do not imagine that you alone of all the Jews will escape in the king’s house.
translation:
  language: te
  text: 'అప్పుడు మొర్దెకై ఎస్తేరుకు ఇలా జవాబు చెప్పమన్నాడు: “యూదులందరిలో నువ్వు ఒక్కదానివే రాజభవనంలో తప్పించుకుంటావని అనుకోకు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהָשִׁיב אֶל־אֶסְתֵּר
  choice: ఎస్తేరుకు ఇలా జవాబు చెప్పమన్నాడు
  rationale: హీబ్రూ ప్రయోజనార్థక క్రియారూపం మధ్యవర్తుల ద్వారా ఎస్తేరుకు జవాబు పంపించమనే భావాన్ని సూచిస్తుంది; తెలుగులో సహజంగా, సంక్షిప్తంగా వ్యక్తీకరించబడింది.
- source_word: אַל־תְּדַמִּי בְנַפְשֵׁךְ
  choice: అనుకోకు
  rationale: అక్షరార్థంగా ‘నీ మనసులో ఊహించకు’; సందర్భంలో స్వయంగా అలా భావించవద్దనే హెచ్చరికను సహజ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לְהִמָּלֵט
  choice: తప్పించుకుంటావని
  rationale: ప్రమాదం లేదా మరణం నుంచి తప్పించుకొని సురక్షితంగా ఉండడాన్ని సూచించే నిఫాల్ క్రియ భావాన్ని నిలుపుతుంది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనంలో
  rationale: అక్షరార్థమైన ‘రాజు ఇల్లు’ ఇక్కడ రాజప్రాసాదం/రాజభవనాన్ని సూచిస్తుంది; ఆధునిక పాఠకునికి స్పష్టమైన పదం ఎంచుకోబడింది.
- source_word: מִכָּל־הַיְּהוּדִים
  choice: యూదులందరిలో నువ్వు ఒక్కదానివే
  rationale: מן యొక్క తులనాత్మక/వేరుచేసే భావాన్ని సందర్భానుసారం వ్యక్తం చేస్తూ, ఎస్తేరు ఇతర యూదులకంటే ప్రత్యేకంగా తప్పించుకోగలనని అనుకోవద్దనే ఉద్దేశాన్ని తెలుపుతుంది.
theological_decisions:
- issue: ఎస్తేరు రాజభవనంలో ఉండడం వల్ల ప్రత్యేక రక్షణ పొందుతుందా అనే హెచ్చరిక
  choice: “యూదులందరిలో నువ్వు ఒక్కదానివే ... తప్పించుకుంటావని అనుకోకు”
  alternative: “ఇతర యూదులకంటే రాజభవనంలో తప్పించుకుంటానని అనుకోకు”
  rationale: మూలంలోని తులనాత్మక నిర్మాణాన్ని సహజ తెలుగులో తెలియజేస్తూ, రక్షణ ఎలా సంభవిస్తుందనే తదుపరి వచనంలోని దైవసంబంధ ప్రశ్నలను ఈ వచనంలోకి ముందుగానే దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘రాజభవనం’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది. స్త్రీ ఏకవచనాన్ని ‘నువ్వు ఒక్కదానివే’ ద్వారా నిలుపుకున్నాం.
