translation:
  language: te
  text: హతాకు వచ్చి, మొర్దెకై మాటలను[a] ఎస్తేరుకు తెలియజేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొర్దెకై సందేశాన్ని” లేదా “మొర్దెకై చెప్పినదాన్ని.” హీబ్రూ మూలంలో అక్షరార్థంగా “మొర్దెకై మాటలను” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: వచ్చి
  rationale: בוא అనే చలన క్రియ సందర్భానుసారం ‘వచ్చాడు/వెళ్లాడు’ అని అర్థమవుతుంది. మొర్దెకై దగ్గరనుంచి ఎస్తేరు వద్దకు తిరిగి రావడాన్ని ఈ సందర్భం సూచిస్తున్నందున ‘వచ్చి’ సహజంగా ఉంది.
- source_word: הֲתָךְ
  choice: హతాకు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు ఉచ్చారణకు తగిన విధంగా లిప్యంతరీకరించాం.
- source_word: וַיַּגֵּד
  choice: తెలియజేశాడు
  rationale: נגד హిఫీల్ రూపానికి ‘తెలియజేయు, చెప్పు, నివేదించు’ అనే అర్థాలు ఉన్నాయి. సాధారణ కథన శైలిలో ‘తెలియజేశాడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לְאֶסְתֵּר
  choice: ఎస్తేరుకు
  rationale: לְ సూచించే పరోక్ష కర్మను తెలుగులో ‘-కు’ విభక్తితో వ్యక్తం చేశాం.
- source_word: אֵת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి స్వతంత్ర పదం అవసరం లేదు.
- source_word: דִּבְרֵי
  choice: మాటలను
  rationale: דָּבָר బహువచన నిర్మాణ రూపాన్ని దగ్గరగా ప్రతిబింబించే ‘మాటలు’ సహజమైన తెలుగు. సందర్భంలో ‘సందేశం’ లేదా ‘చెప్పినది’ అనే భావమూ సాధ్యమే.
- source_word: מָרְדֳּכָי
  choice: మొర్దెకై
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించాం.
