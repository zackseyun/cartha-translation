  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. పర్షియన్ రాజసభ నేపథ్యానికి తగిన ‘శాసనం’, ‘జారీ’, ‘సన్నిధి’, ‘విన్నవించు’ వంటి పదాలను ఎంచుకున్నప్పటికీ, వాక్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం.
