source:
  edition: WLC
  text: וְ/אֶת פַּתְשֶׁ֣גֶן כְּתָֽב הַ֠/דָּת אֲשֶׁר נִתַּ֨ן בְּ/שׁוּשָׁ֤ן לְ/הַשְׁמִידָ/ם֙ נָ֣תַן ל֔/וֹ לְ/הַרְא֥וֹת אֶת אֶסְתֵּ֖ר וּ/לְ/הַגִּ֣יד לָ֑/הּ וּ/לְ/צַוּ֣וֹת עָלֶ֗י/הָ לָ/ב֨וֹא אֶל הַ/מֶּ֧לֶךְ לְ/הִֽתְחַנֶּן ל֛/וֹ וּ/לְ/בַקֵּ֥שׁ מִ/לְּ/פָנָ֖י/ו עַל עַמָּֽ/הּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/008.yaml
  text: He also gave him a copy[a] of the written decree issued in Susa for their destruction, to show it to Esther and explain it to her, and to charge her to go to the king, implore his favor, and plead before him on behalf of her people.
translation:
  language: te
  text: అంతేకాక, వారిని నాశనం చేయడానికి షూషనులో జారీ చేసిన శాసనపు ప్రతిని[a] అతనికి ఇచ్చాడు. దాన్ని ఎస్తేరుకు చూపించి ఆమెకు వివరించమని, ఎస్తేరు రాజు వద్దకు వెళ్లి అతని అనుగ్రహం కోసం వేడుకొని తన ప్రజల కొరకు అతని సన్నిధిలో విన్నవించమని అతనికి ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రతి’ అని అనువదించిన పర్షియన్ మూలపదం అధికారిక పత్రంలోని పాఠాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב
  choice: శాసనపు ప్రతి
  rationale: పర్షియన్ మూలమైన ఈ పదబంధం అధికారిక పత్రాన్ని లేదా దాని ప్రతిని సూచించగలదు. ప్రధాన పాఠంలో సహజమైన ‘ప్రతి’ని ఉంచి, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: הַדָּת
  choice: శాసనం
  rationale: ఎస్తేరు గ్రంథంలోని పర్షియన్ రాజసభ సందర్భంలో ఇది సాధారణ ధర్మశాస్త్రం కంటే అధికారిక రాజాజ్ఞ లేదా శాసనాన్ని సూచిస్తుంది.
- source_word: נִתַּן בְּשׁוּשָׁן
  choice: షూషనులో జారీ చేసిన
  rationale: పరిపాలనా సందర్భంలో నిష్క్రియారూపం శాసనం అధికారికంగా ప్రకటించబడటాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘జారీ చేసిన’ సహజంగా ఉంటుంది.
- source_word: לְהַשְׁמִידָם
  choice: వారిని నాశనం చేయడానికి
  rationale: ప్రత్యయంతో కూడిన క్రియార్థక రూపం శాసన ఉద్దేశాన్ని నేరుగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְהַרְאוֹת אֶת אֶסְתֵּר וּלְהַגִּיד לָהּ
  choice: దాన్ని ఎస్తేరుకు చూపించి, ఆమెకు వివరించి
  rationale: హీబ్రూలో సందర్భం ద్వారా తెలిసే పత్రాన్ని తెలుగులో ‘దాన్ని’ అని స్పష్టం చేశాం; ‘వివరించి’ అనేది పత్రంలోని విషయాన్ని ఆమెకు తెలియజేయడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּלְצַוּוֹת עָלֶיהָ
  choice: ఆమెకు గట్టిగా చెప్పమన్నాడు
  rationale: צוה లోని బలమైన ఆదేశ భావాన్ని నిలుపుతూ, మొర్దెకై రాజాధికారంతో ఆమెను ఆజ్ఞాపించినట్లు అనిపించని సహజ తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: לְהִתְחַנֶּן לוֹ
  choice: అతని అనుగ్రహం కోసం వేడుకొని
  rationale: ఈ రూపం కేవలం అడగడమే కాక దయ లేదా అనుగ్రహం కోసం వినయంగా, తీవ్రంగా వేడుకోవడాన్ని సూచిస్తుంది.
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו עַל עַמָּהּ
  choice: అతని సన్నిధిలో తన ప్రజల పక్షంగా విన్నవించుకోవాలని
  rationale: రాజు సమక్షంలో పిటిషన్ చేయడాన్ని సూచించే సభామర్యాదా ప్రయోగాన్ని సహజ తెలుగులో అందిస్తూ, עַל עַמָּהּ లోని ప్రజల ప్రయోజనార్థ భావాన్ని ‘పక్షంగా’తో తెలిపాం.
