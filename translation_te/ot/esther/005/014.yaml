  yaml_path: translation/ot/esther/005/014.yaml
  text: Then Zeresh his wife and all his friends said to him[a], “Let a gallows fifty cubits high be made, and in the morning tell the king to have Mordecai hanged on it. Then go with the king to the banquet rejoicing.” The matter pleased Haman[c][b], and he made the gallows.
translation:
  language: te
  text: 'అప్పుడు అతని భార్య జెరెష్, అతని స్నేహితులందరూ అతనితో ఇలా అన్నారు: “యాభై మూరల[a] ఎత్తైన ఒక కొయ్యను[b] తయారు చేయించు. ఉదయాన్నే మొర్దెకైని దానిపై ఉరితీయమని[c] రాజుతో చెప్పు. తరువాత సంతోషంగా రాజుతో కలిసి విందుకు వెళ్లు.” ఆ సలహా హామానుకు నచ్చింది; అతడు ఆ కొయ్యను తయారు చేశాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యాభై మూరలు సుమారు 23 మీటర్లు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘కంబం,’ ‘ఉరికొయ్య.’ హీబ్రూ పదం చెట్టు, కలప లేదా చెక్కతో చేసిన వధనిర్మాణాన్ని సూచించవచ్చు; దాని ఖచ్చితమైన రూపం తెలియదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మొర్దెకైని దానిపై గుచ్చమని.’ హీబ్రూ మాటలు చెక్క నిర్మాణంపై వేలాడదీయడాన్ని లేదా గుచ్చడాన్ని సూచించవచ్చు; ఖచ్చితమైన శిక్షావిధానం వివాదాస్పదం.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבָיו
  choice: అతని స్నేహితులు
  rationale: అక్షరార్థంగా ‘అతన్ని ప్రేమించేవారు’ అయినా, రాజసభ కథన సందర్భంలో హామానుకు సన్నిహితులైన సహచరులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘స్నేహితులు’ సహజంగా ఉంటుంది.
- source_word: יַעֲשׂוּ
  choice: తయారు చేయించు
  rationale: నిర్దిష్ట కర్తను చెప్పని ఈ సలహారూప క్రియను తెలుగులో హామాను ఏర్పాటుచేయాలనే భావంతో సహజంగా వ్యక్తం చేస్తుంది; అతడే స్వయంగా నిర్మించాడని నిర్బంధించదు.
- source_word: עֵץ
  choice: ఉరికొయ్య
  rationale: మూలపదానికి చెట్టు, కలప, కొయ్య లేదా చెక్కతో చేసిన వధనిర్మాణం అనే అర్థాలు ఉండవచ్చు. కథన సందర్భంలో ప్రజల ముందర మరణశిక్ష అమలు చేయడానికి లేదా మృతదేహాన్ని ప్రదర్శించడానికి వాడే చెక్క నిర్మాణం ఉద్దేశించబడింది; ఖచ్చితమైన ఆకారం అనిశ్చితమని పాదసూచికలో తెలిపాం.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: యాభై మూరల ఎత్తుగల
  rationale: ప్రాచీన కొలమానాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ఆధునిక అంచనాను పాదసూచికలో ఇచ్చాం.
- source_word: וּבַבֹּקֶר
  choice: ఉదయాన్నే
  rationale: మూలంలోని కాలసూచనను సహజమైన తెలుగులో ఇస్తుంది; మూలంలో స్పష్టంగా లేని ‘మరుసటి’ అనే పదాన్ని చేర్చదు.
- source_word: אֱמֹר לַמֶּלֶךְ
  choice: రాజుతో చెప్పు
  rationale: సాధారణ ఆజ్ఞారూపమైన ‘రాజుతో చెప్పు’ అనే భావాన్ని నిలుపుతుంది; ‘అడుగు’ అని అనువదించి అభ్యర్థన భావాన్ని క్రియలోనే అదనంగా చేర్చదు.
- source_word: וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו
  choice: మొర్దెకైని దానిపై ఉరితీయించమని
  rationale: రాజు ఇతరులచేత శిక్ష అమలు చేయించాలనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ఇది కొయ్యపై వేలాడదీయడం లేదా గుచ్చి నిలబెట్టడం కావచ్చనే అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: מִשְׁתֶּה
  choice: విందు
  rationale: రాజసభలో జరిగే భోజన-పాన విందును ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: שָׂמֵחַ
  choice: సంతోషంగా
  rationale: హామాను విందుకు వెళ్లేటప్పుడు ఉండే ఉల్లాసస్థితిని క్రియావిశేషణంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן
  choice: ఆ సలహా హామానుకు నచ్చింది
  rationale: ప్రతిపాదన అతనికి మంచిదిగా లేదా ఆమోదయోగ్యంగా అనిపించిందనే హీబ్రూ నుడికారాన్ని స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: וַיַּעַשׂ הָעֵץ
  choice: అతడు ఆ ఉరికొయ్యను తయారు చేయించాడు
  rationale: హామాను స్వయంగా నిర్మించాడా లేక నిర్మింపజేశాడా అన్నది మూలం స్పష్టంగా చెప్పదు; ఉన్నతాధికారికి సంబంధించిన ఈ సందర్భంలో ఏర్పాటుచేయించాడనే సహజమైన తెలుగు ప్రయోగం ఆ విస్తృత కర్తృత్వాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మొర్దెకైకి ఉద్దేశించిన మరణశిక్ష విధానం
  choice: ప్రధాన పాఠ్యంలో ‘ఉరితీయించమని’ ఉంచి, విధానంలోని అనిశ్చితిని పాదసూచికలో తెలిపాం.
  alternative: ‘దానిపై గుచ్చి నిలబెట్టమని’
  rationale: תלה మరియు עֵץ కలయిక వేలాడదీయడం, కొయ్యపై ప్రదర్శించడం లేదా గుచ్చి నిలబెట్టడం వంటి భావాలను సందర్భానుసారం సూచించవచ్చు. పర్షియా శిక్షాచారాన్ని ఆధారంగా చేసుకొని ఒక్క విధానాన్ని ఖచ్చితమని నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. హామానుతో నేరుగా చెప్పే ఏకవచన ఆజ్ఞారూపాలు మూలంలోని వ్యాకరణాన్ని నిలుపుతాయి. ప్రాచీన కొలమానం ‘మూర’ ప్రధాన పాఠ్యంలో ఉంచి ఆధునిక సమానం పాదసూచికలో ఇచ్చాం.
