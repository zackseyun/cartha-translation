- from: ఆ రోజు హామాను సంతోషంతో, ఉల్లాసమైన హృదయంతో బయటికి వెళ్లాడు. అయితే రాజద్వారం దగ్గర మొర్దెకైని చూసినప్పుడు, అతడు తన ముందు లేవకపోవడం, భయంతో వణకకపోవడం చూసి, హామాను మొర్దెకై మీద ఆగ్రహంతో నిండిపోయాడు.[a]
  to: ఆ రోజు హామాను సంతోషంతో, ఉల్లాసమైన హృదయంతో బయటికి వెళ్లాడు. అయితే రాజు ద్వారం వద్ద మొర్దెకైని చూసినప్పుడు, మొర్దెకై హామాను ఎదుట లేవలేదని, వణకలేదని చూసి హామాను మొర్దెకైపై ఆగ్రహంతో నిండిపోయాడు.[a]
  rationale: The revision preserves the Hebrew’s two distinct gestures—Mordecai did not rise and did not show agitation before Haman—while making the persons involved explicit in natural Telugu. The footnote retains the legitimate lexical breadth of זוע without treating the contextual rendering as certain beyond the source.
