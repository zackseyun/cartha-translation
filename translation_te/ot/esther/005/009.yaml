  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు సహజంగా ఉండే పదబంధాలు వాడబడ్డాయి. గౌరవార్థకంగా లేవడం మరియు భయంతో వణకడం అనే రెండు చర్యలు వేరువేరుగా నిలుపబడ్డాయి.
