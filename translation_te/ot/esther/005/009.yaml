language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵ֤א הָמָן֙ בַּ/יּ֣וֹם הַ/ה֔וּא שָׂמֵ֖חַ וְ/ט֣וֹב לֵ֑ב וְ/כִ/רְאוֹת֩ הָמָ֨ן אֶֽת מָרְדֳּכַ֜י בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ וְ/לֹא קָם֙ וְ/לֹא זָ֣ע מִמֶּ֔/נּוּ וַ/יִּמָּלֵ֥א הָמָ֛ן עַֽל מָרְדֳּכַ֖י חֵמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/009.yaml
  text: Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king’s gate[a], and that he did not rise or tremble before him, Haman was filled with rage against Mordecai.
translation:
  language: te
  text: ఆ రోజు హామాను సంతోషంతో, ఉల్లాసమైన హృదయంతో బయటికి వెళ్లాడు. అయితే రాజు ద్వారం వద్ద మొర్దెకైని చూసినప్పుడు, మొర్దెకై హామాను ఎదుట లేవలేదని, వణకలేదని చూసి హామాను మొర్దెకైపై ఆగ్రహంతో నిండిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వణకలేదు” అనే మాటను “అతని కారణంగా కదలలేదు” లేదా “అతని ఎదుట భయాన్ని చూపలేదు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמֵחַ וְטוֹב לֵב
  choice: సంతోషంతో, ఉల్లాసమైన హృదయంతో
  rationale: జోడిగా ఉన్న హీబ్రూ అభివ్యక్తి ఆనందభరితమైన, ఉత్సాహపూరితమైన మనస్థితిని సూచిస్తుంది. ఈ అనువాదం సమాంతర భావాన్ని నిలుపుతూ సహజమైన ఆధునిక తెలుగులో ఉంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: కాల నిర్దిష్టతను సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: రాజద్వారం దగ్గర
  rationale: ב ఉపసర్గ ఇక్కడ ‘లో’ లేదా ‘దగ్గర’ అనే స్థలార్థం ఇవ్వగలదు. రాజప్రాసాద ద్వార ప్రాంగణంలో మొర్దెకై ఉన్నాడనే భావాన్ని ‘దగ్గర’ సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא קָם
  choice: తన ముందు లేవకపోవడం
  rationale: קום ఇక్కడ గౌరవసూచకంగా లేచి నిలబడడాన్ని సూచిస్తుంది. ‘లేవకపోవడం’ ఆ సామాజిక సంకేతాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: וְלֹא זָע מִמֶּנּוּ
  choice: భయంతో వణకకపోవడం
  rationale: זוע కదలడం, కంపించడం లేదా వణకడం అనే భావాలు ఇవ్వగలదు. సందర్భంలో హామాను ఎదుట మొర్దెకై భయావేశం చూపకపోవడమే ప్రధాన భావం; పదంలోని నిజమైన విస్తృతిని పాదసూచికలో ఉంచాం.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: ఆగ్రహంతో నిండిపోయాడు
  rationale: ‘నిండిపోవడం’తో חֵמָה కలయిక తీవ్రమైన కోపాన్ని సూచిస్తుంది. ‘ఆగ్రహం’ గంభీరమైనదిగా, సాధారణ పాఠకులకు అర్థమయ్యేదిగా ఉంది.
- source_word: עַל מָרְדֳּכַי
  choice: మొర్దెకై మీద
  rationale: కోపాన్ని సూచించే పదంతో עַל శత్రుత్వానికి గురైన వ్యక్తిని సూచిస్తుంది; ‘మీద’ తెలుగులో సహజంగా ఆ లక్ష్యార్థాన్ని వ్యక్తం చేస్తుంది.
