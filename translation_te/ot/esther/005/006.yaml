source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ לְ/אֶסְתֵּר֙ בְּ/מִשְׁתֵּ֣ה הַ/יַּ֔יִן מַה שְּׁאֵלָתֵ֖/ךְ וְ/יִנָּ֣תֵֽן לָ֑/ךְ וּ/מַה בַּקָּשָׁתֵ֛/ךְ עַד חֲצִ֥י הַ/מַּלְכ֖וּת וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/006.yaml
  text: And the king said to Esther at the wine banquet[a], “What is your petition? It will be granted to you. And what is your request? Even up to half the kingdom[b], it will be done.”
translation:
  language: te
  text: ద్రాక్షారస విందులో రాజు ఎస్తేరుతో, “నీ మనవి ఏమిటి? అది నీకు ఇవ్వబడుతుంది. నీ విన్నపం ఏమిటి? రాజ్యంలో సగభాగం వరకైనా[a] అది నెరవేర్చబడుతుంది” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “రాజ్యంలో సగభాగం వరకు”; “నా రాజ్యంలో” అని స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: ద్రాక్షారస విందులో
  rationale: מִשְׁתֶּה విందును, הַיַּיִן ద్రాక్షారసాన్ని సూచిస్తాయి. ఈ రూపం విందు సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְּׁאֵלָתֵךְ
  choice: నీ మనవి
  rationale: ఇక్కడ שאל మూలం నుంచి వచ్చిన నామవాచకం ప్రశ్నను కాక, రాజు ఎదుట కోరే మనవిని సూచిస్తుంది.
- source_word: וְיִנָּתֵן לָךְ
  choice: అది నీకు అనుగ్రహించబడుతుంది
  rationale: נתן యొక్క నిఫాల్ రూపం కోరినది ఇవ్వబడుతుందనే రాజ హామీని వ్యక్తం చేస్తుంది; ‘అనుగ్రహించబడుతుంది’ న్యాయస్థాన సందర్భానికి తగిన సహజ తెలుగు.
- source_word: בַּקָּשָׁתֵךְ
  choice: నీ విన్నపం
  rationale: בַּקָּשָׁה కోరుతున్న విషయాన్ని సూచిస్తుంది. ‘విన్నపం’ అని అనువదించడం ముందున్న ‘మనవి’తో స్వల్ప పదభేదాన్ని నిలుపుతుంది.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: రాజ్యంలో సగం వరకైనా
  rationale: హీబ్రూలో ‘నా’ అనే స్వామ్యసూచకం లేదు. ‘రాజ్యంలో సగం వరకు’ మూలంలోని నిర్దిష్ట రూపాన్ని కాపాడగా, ‘అయినా’ రాజోచిత అతిశయోక్తి బలాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: וְתֵעָשׂ
  choice: అది నెరవేర్చబడుతుంది
  rationale: సందర్భంలో ఇది ఎస్తేరు విన్నపం కార్యరూపం దాల్చడాన్ని సూచిస్తుంది; ‘నెరవేర్చబడుతుంది’ సంక్షిప్తంగా, సహజంగా రాజు ఇచ్చిన హామీని వ్యక్తం చేస్తుంది.
