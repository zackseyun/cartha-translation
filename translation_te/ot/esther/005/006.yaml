translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభ సందర్భానికి తగిన గౌరవప్రదమైన, సులభగ్రాహ్యమైన శైలి. సమాంతర ప్రశ్నలను, రెండు వేర్వేరు అభ్యర్థన పదాల మధ్య స్వల్ప భేదాన్ని నిలిపింది.
