revisions:
- from: ద్రాక్షారస విందులో రాజు ఎస్తేరుతో, “నీ మనవి ఏమిటి? అది నీకు అనుగ్రహించబడుతుంది. నీ విన్నపం ఏమిటి? రాజ్యంలో సగం వరకైనా[a] అది నెరవేర్చబడుతుంది” అని అన్నాడు.
  to: ద్రాక్షారస విందులో రాజు ఎస్తేరుతో, “నీ మనవి ఏమిటి? అది నీకు ఇవ్వబడుతుంది. నీ విన్నపం ఏమిటి? రాజ్యంలో సగభాగం వరకైనా[a] అది నెరవేర్చబడుతుంది” అని అన్నాడు.
  rationale: The revision clarifies that the king’s hyperbolic offer concerns half of the kingdom, not a point within it, and renders the first assurance with a closer Telugu equivalent of ‘it will be given to you.’ The parallel structure, courtly register, lexical distinction between the two requests, and the source text’s lack of an explicit possessive are retained.
