translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ రాజసభ కథనానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. హెబ్రీలోని ‘ఎస్తేరు మాట’ అనే ప్రయోగం కలిగిన విస్తృత భావాన్ని పాదసూచికలో నిలిపాం.
