  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַהֲרוּ֙ אֶת הָמָ֔ן לַ/עֲשׂ֖וֹת אֶת דְּבַ֣ר אֶסְתֵּ֑ר וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ וְ/הָמָ֔ן אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשְׂתָ֥ה אֶסְתֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/005.yaml
  text: Then the king said[a], "Hurry, bring Haman, so that Esther's word may be done." So the king and Haman came to the banquet that Esther had prepared.
translation:
  language: te
  text: అప్పుడు రాజు, “ఎస్తేరు చెప్పినట్లు చేయడానికి హామానును త్వరగా రప్పించండి” అన్నాడు. కాబట్టి రాజు, హామాను ఎస్తేరు సిద్ధం చేసిన విందుకు వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַהֲרוּ אֶת־הָמָן
  choice: హామానును త్వరగా తీసుకురండి
  rationale: మַהֲרוּ అనేది బహువచన ఆజ్ఞారూపం; ఇది పరిచారకులను ఉద్దేశించి, హామానును వెంటనే రప్పించాలని చెబుతోంది. తెలుగులో ‘త్వరగా తీసుకురండి’ సందర్భానికి సహజంగా ఉండి అత్యవసరతను నిలుపుతుంది.
- source_word: לַעֲשׂוֹת אֶת־דְּבַר אֶסְתֵּר
  choice: ఎస్తేరు కోరినది జరిగేలా
  rationale: దְּבַר అక్షరార్థంగా ‘మాట/విషయం’; ఈ రాజసభ సందర్భంలో అది ఎస్తేరు తెలిపిన కోరికను సూచిస్తుంది. ‘కోరినది జరిగేలా’ అనే అనువాదం హెబ్రీ నిర్మాణంలోని ఫలిత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: וַיָּבֹא
  choice: వచ్చారు
  rationale: בוא సందర్భానుసారం ‘రావడం’ లేదా ‘వెళ్లడం’ అని అర్థమవుతుంది. కథన దృష్టికోణంలో విందుకు ‘వచ్చారు’ అనడం సహజం.
- source_word: הַמִּשְׁתֶּה
  choice: విందు
  rationale: מִשְׁתֶּה పానీయాలతో కూడిన విందు లేదా భోజన సభను సూచిస్తుంది. రాజసభ సందర్భానికి ‘విందు’ స్పష్టమైన, సహజమైన తెలుగు పదం.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: ఎస్తేరు సిద్ధం చేసిన
  rationale: విందుతో కూడిన עשה ఇక్కడ దానిని ఏర్పాటు చేయడం లేదా సిద్ధం చేయడం అనే భావం ఇస్తుంది. ‘సిద్ధం చేసిన’ అనేది కాలక్రమాన్నీ సహజ తెలుగు ప్రయోగాన్నీ కాపాడుతుంది.
