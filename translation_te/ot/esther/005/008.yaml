  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజసభకు తగిన మర్యాదపూర్వకమైన గంభీర శైలిని ఉపయోగించాం. మూలంలోని సమీపార్థక జంటను ‘విన్నపం/మనవి’గా, చివరి వాక్యంలోని సంక్షిప్తతను యథాతథంగా నిలిపాం.
