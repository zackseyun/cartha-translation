  text: אִם מָצָ֨אתִי חֵ֜ן בְּ/עֵינֵ֣י הַ/מֶּ֗לֶךְ וְ/אִם עַל הַ/מֶּ֨לֶךְ֙ ט֔וֹב לָ/תֵת֙ אֶת שְׁאֵ֣לָתִ֔/י וְ/לַ/עֲשׂ֖וֹת אֶת בַּקָּשָׁתִ֑/י יָב֧וֹא הַ/מֶּ֣לֶךְ וְ/הָמָ֗ן אֶל הַ/מִּשְׁתֶּה֙ אֲשֶׁ֣ר אֶֽעֱשֶׂ֣ה לָ/הֶ֔ם וּ/מָחָ֥ר אֶֽעֱשֶׂ֖ה כִּ/דְבַ֥ר הַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
translation:
  language: te
  text: “నేను రాజు దృష్టిలో అనుగ్రహం పొందినట్లయితే[a], నా విన్నపాన్ని మంజూరు చేసి నా మనవిని నెరవేర్చడం రాజుకు సమ్మతమైతే, నేను వారి కోసం సిద్ధం చేసే విందుకు రాజు, హామాను రావాలి. రేపు నేను రాజు మాట ప్రకారం చేస్తాను[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, నుడికారంగా: “రాజు అనుగ్రహం నాకు లభించినట్లయితే.”'
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “రాజు మాట ప్రకారం చేస్తాను.” రాజు అడిగినట్లుగా ఎస్తేరు తన విన్నపాన్ని మరుసటి రోజు తెలియజేస్తుందనే భావం కావచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  choice: రాజు దృష్టిలో అనుగ్రహం పొందినట్లయితే
  rationale: హీబ్రూ నుడికారంలోని ‘కళ్లలో/దృష్టిలో’ అనే రూపకాన్ని నిలుపుతూ, రాజసభ సందర్భంలోని అనుకూల ఆదరణను ‘అనుగ్రహం’తో వ్యక్తం చేస్తుంది.
- source_word: עַל הַמֶּלֶךְ טוֹב
  choice: రాజుకు సమ్మతమైతే
  rationale: అక్షరార్థమైన ‘రాజుకు మంచిదైతే’ కంటే, రాజుకు ఆమోదయోగ్యంగా లేదా ఇష్టంగా ఉండటాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לָתֵת אֶת שְׁאֵלָתִי
  choice: నా విన్నపాన్ని మన్నించి
  rationale: ‘విన్నపాన్ని ఇవ్వడం’ అనే హీబ్రూ నిర్మాణానికి రాజసభ భాషలో సహజమైన తెలుగు సమానార్థకం; అభ్యర్థనను ఆమోదించే భావాన్ని అందిస్తుంది.
- source_word: וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  choice: నా మనవిని నెరవేర్చడం
  rationale: హీబ్రూలోని ‘చేయడం’ భావాన్ని తెలుగులో సహజంగా ‘నెరవేర్చడం’గా ఇచ్చి, సమీపార్థకమైన రెండు నామవాచకాల భేదాన్ని ‘విన్నపం/మనవి’గా నిలిపింది.
- source_word: יָבֹא
  choice: రావాలి
  rationale: ఇక్కడ అసంపూర్ణ క్రియ మర్యాదపూర్వక ఆహ్వానం లేదా అభ్యర్థనగా పనిచేస్తుంది; సందర్భంలో ‘రావాలి’ ఆ ఉద్దేశాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הַמִּשְׁתֶּה
  choice: విందు
  rationale: పానీయాలతో కూడిన రాజసభ భోజన సమారాధనను సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: אֲשֶׁר אֶעֱשֶׂה לָהֶם
  choice: నేను వారి కోసం సిద్ధం చేసే
  rationale: విందును ‘చేయడం’ అనే హీబ్రూ ప్రయోగాన్ని తెలుగులో సహజంగా ‘సిద్ధం చేయడం’గా వ్యక్తం చేస్తుంది.
- source_word: וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ
  choice: రేపు నేను రాజు మాట ప్రకారం చేస్తాను
  rationale: ఎస్తేరు మరుసటి రోజు తన మనవిని తెలియజేస్తుందనే సందర్భార్థం ఉన్నప్పటికీ, హీబ్రూ వాక్యంలోని ఉద్దేశపూర్వక సంక్షిప్తతను, కొంత అస్పష్టతను పరిష్కరించకుండా నిలుపుతుంది.
