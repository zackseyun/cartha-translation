translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రాజసభ శైలిని ఉపయోగించాం. మూలంలోని మర్యాదపూర్వక అభ్యర్థనను నిలిపి, ఏకవచన సర్వనామాన్ని బహువచనంగా సవరించలేదు.
