  text: וַ/תֹּ֣אמֶר אֶסְתֵּ֔ר אִם עַל הַ/מֶּ֖לֶךְ ט֑וֹב יָב֨וֹא הַ/מֶּ֤לֶךְ וְ/הָמָן֙ הַ/יּ֔וֹם אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשִׂ֥יתִי לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/004.yaml
  text: Esther said[a], “If it pleases the king[b], let the king and Haman come today to the banquet that I have prepared for him.”
translation:
  language: te
  text: 'ఎస్తేరు ఇలా అంది: “రాజుకు సమ్మతమైతే,[a] రాజు, హామాను ఈ రోజు నేను ఆయన కోసం[b] సిద్ధం చేసిన విందుకు రావాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రాజుకు మంచిదనిపిస్తే.” ఇది మర్యాదపూర్వకంగా రాజు ఆమోదాన్ని కోరే మాట.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఆయన కోసం” అని ఏకవచనంలో ఉంది; హామాను కూడా ఆహ్వానించబడినప్పటికీ, ఇది బహుశా రాజును సూచిస్తుంది.
    reason: referent_ambiguity
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: రాజుకు సమ్మతమైతే
  rationale: హీబ్రూ రాజసభ మర్యాదతో కూడిన అభ్యర్థనను సూచిస్తుంది. ‘సమ్మతమైతే’ అనేది అనుకూలమైన రాజాజ్ఞ లేదా ఆమోదం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יָבוֹא
  choice: రావాలి
  rationale: రూపపరంగా అసంపూర్ణ క్రియ అయినా, ఈ సందర్భంలో మర్యాదపూర్వక ఆహ్వానం లేదా అభ్యర్థనగా పనిచేస్తుంది. ‘రావాలి’ దాని సంకల్పార్థక బలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הַמֶּלֶךְ וְהָמָן
  choice: రాజు, హామాను
  rationale: మూలంలో ఉన్నట్లే రాజును బిరుదుతో పేర్కొని, వచనంలో లేని వ్యక్తిగత పేరును చేర్చలేదు.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: ఆహ్వానంలోని తక్షణ కాలసూచనను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַמִּשְׁתֶּה
  choice: విందు
  rationale: రాజసభ సందర్భంలోని భోజనోత్సవాన్ని సహజంగా సూచిస్తుంది; పానీయాల అంశాన్ని మూలం కంటే ఎక్కువగా ముందుకు తేవదు.
- source_word: אֲשֶׁר עָשִׂיתִי לוֹ
  choice: నేను ఆయన కోసం సిద్ధం చేసిన
  rationale: విందుతో עָשָׂה వాడినప్పుడు ‘సిద్ధం చేసిన’ సహజమైన తెలుగు. לוֹ ఏకవచనాన్ని ‘ఆయన కోసం’గా నిలిపి, దాన్ని ‘వారి కోసం’ అని సవరించలేదు.
