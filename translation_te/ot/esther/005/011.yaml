  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְסַפֵּ֨ר לָ/הֶ֥ם הָמָ֛ן אֶת כְּב֥וֹד עָשְׁר֖/וֹ וְ/רֹ֣ב בָּנָ֑י/ו וְ/אֵת֩ כָּל אֲשֶׁ֨ר גִּדְּל֤/וֹ הַ/מֶּ֨לֶךְ֙ וְ/אֵ֣ת אֲשֶׁ֣ר נִשְּׂא֔/וֹ עַל הַ/שָּׂרִ֖ים וְ/עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/011.yaml
  text: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
translation:
  language: te
  text: హామాను వారికి తన సంపద వైభవం గురించి, తనకు ఉన్న అనేకమంది కుమారుల గురించి, రాజు తనను గొప్పవానిగా చేయడానికి చేసినదంతా గురించి, రాజు తనను అధికారులకూ రాజసేవకులకూ పైన ఎలా ఉన్నత స్థానంలో ఉంచాడో గురించి వివరించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: వారికి వివరించాడు
  rationale: సִפֵּר అనే క్రియ ఇక్కడ హామాను తన గొప్పతనాన్ని విపులంగా చెప్పడాన్ని సూచిస్తుంది. ‘వివరించాడు’ అనేది సహజమైన ఆధునిక తెలుగు; కేవలం ‘చెప్పాడు’ కంటే పునర్వివరణ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: כְּבוֹד עָשְׁרוֹ
  choice: తన సంపద వైభవం
  rationale: כָּבוֹד సంపదతో కలిసినప్పుడు దాని ఘనత, వైభవం లేదా ఆకట్టుకునే ప్రదర్శనను సూచిస్తుంది. ‘సంపద వైభవం’ మూలంలోని భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: רֹב בָּנָיו
  choice: తన కుమారులు ఎంతమందో
  rationale: רֹב ఇక్కడ అధిక సంఖ్యను సూచిస్తుంది; בָּנִים ప్రత్యేకంగా ‘కుమారులు.’ ‘ఎంతమందో’ తెలుగు వాక్యంలో సహజంగా ఉండి, వారి అధిక సంఖ్యపై ఉన్న నొక్కును కాపాడుతుంది.
- source_word: גִּדְּלוֹ
  choice: తనను గొప్పవానిగా చేయడానికి
  rationale: גדל యొక్క పియేల్ రూపం ‘గొప్పవానిగా చేయడం, ఉన్నతికి తీసుకురావడం’ అనే కారణార్థాన్ని ఇస్తుంది. ఈ ఎంపిక రాజు చేసిన కార్యాలనూ అతని క్రియాశీల పాత్రనూ నిలుపుతుంది.
- source_word: נִשְּׂאוֹ עַל
  choice: తనను ... కంటే ఉన్నత స్థానంలో ఉంచాడో
  rationale: נשא עם עַל ఇక్కడ ఇతరులపై హోదాలో హెచ్చించడాన్ని సూచిస్తుంది. ‘ఉన్నత స్థానంలో ఉంచాడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి తులనాత్మక అధికార క్రమాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַשָּׂרִים
  choice: అధికారులు
  rationale: పర్షియా రాజసభ సందర్భంలో שָׂרִים అనేది పాలనా హోదాలో ఉన్న అధికారులను సూచిస్తుంది; ‘అధికారులు’ వంశపారంపర్య రాజకుమారులు అనే అవసరం లేని భావాన్ని రానివ్వదు.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: రాజ సేవకులు
  rationale: ఇక్కడ עֲבָדִים రాజసభలో రాజుకు సేవచేసే సిబ్బందిని సూచిస్తుంది. ‘రాజ సేవకులు’ సందర్భానుకూలంగా, సరళంగా ఉంది.
