translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వరుస జాబితా నిర్మాణాన్ని ‘గురించి’ అనే పునరుక్తితో నిలిపి, హామాను అతిశయంగా లెక్కపెట్టి చెప్పే ధోరణిని ప్రతిబింబించాం. పాఠ్యంలో నిజమైన అర్థసందిగ్ధతకు ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
