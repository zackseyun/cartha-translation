  text: Then Esther answered and said[a], “My petition and my request are:”
translation:
  language: te
  text: 'అప్పుడు ఎస్తేరు జవాబిచ్చి ఇలా చెప్పింది: “నా మనవి, నా విన్నపం ఏమిటంటే—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַן
  choice: అప్పుడు ... జవాబిస్తూ
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ענה యొక్క మాటకు ప్రతిస్పందించే భావాన్ని ‘జవాబిస్తూ’ నిలుపుతుంది.
- source_word: אֶסְתֵּר
  choice: ఎస్తేరు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ రూపం.
- source_word: וַתֹּאמַר
  choice: ఇలా చెప్పింది
  rationale: హీబ్రూలోని ‘జవాబిచ్చి చెప్పింది’ అనే ద్వంద్వ క్రియాభివ్యక్తిలోని రెండు అంశాలనూ సహజమైన తెలుగులో ‘జవాబిస్తూ ఇలా చెప్పింది’గా నిలిపింది.
- source_word: שְׁאֵלָתִי
  choice: నా మనవి
  rationale: ఈ రాజసభ సందర్భంలో ఈ పదం ప్రశ్నకన్నా అధికారికంగా సమర్పించే అభ్యర్థనను సూచిస్తుంది; ‘మనవి’ వినయపూర్వక విజ్ఞాపన భావాన్ని ఇస్తుంది.
- source_word: וּבַקָּשָׁתִי
  choice: నా విన్నపం
  rationale: בַּקָּשָׁה యొక్క అభ్యర్థన/వేడుకోలు భావాన్ని తెలిపి, దానికి సమీపార్థకమైన שְׁאֵלָהతో ఉన్న అధికారిక పదజోడులో స్వల్ప పదభేదాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభ సందర్భానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ సమీపార్థక పదజోడును ‘మనవి, విన్నపం’గా నిలిపి, వాక్యం తదుపరి వచనంలో కొనసాగుతుందని దీర్ఘవిరామంతో సూచించాం.
