translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. హామాను మాటల్లోని ఆత్మగర్వాన్ని ‘పైగా’ మరియు ‘నన్ను తప్ప మరెవరినీ’ అనే నిర్మాణాలు సహజంగా ప్రతిబింబిస్తాయి; మూలంలోని ‘తీసుకురావడం’ మరియు ‘పిలువబడడం’ రూపకాలను ప్రధాన పాఠ్యం, పాదటిప్పణుల ద్వారా సాధ్యమైనంతవరకు కాపాడాం.
