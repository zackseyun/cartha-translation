source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ הָמָן֒ אַ֣ף לֹא הֵבִיאָה֩ אֶסְתֵּ֨ר הַ/מַּלְכָּ֧ה עִם הַ/מֶּ֛לֶךְ אֶל הַ/מִּשְׁתֶּ֥ה אֲשֶׁר עָשָׂ֖תָה כִּ֣י אִם אוֹתִ֑/י וְ/גַם לְ/מָחָ֛ר אֲנִ֥י קָֽרוּא לָ֖/הּ עִם הַ/מֶּֽלֶךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/012.yaml
  text: Then Haman said[a], “Indeed, Queen Esther brought no one with the king to the banquet she prepared except me[b]; and tomorrow also I am invited by her together with the king.”
translation:
  language: te
  text: 'అప్పుడు హామాను ఇలా అన్నాడు: “అంతేకాదు, రాణి ఎస్తేరు తాను ఏర్పాటు చేసిన విందుకు[a] రాజుతో కలిసి నన్ను తప్ప మరెవరినీ తీసుకురాలేదు. రేపు కూడా నేను రాజుతో కలిసి ఆమె చేత ఆహ్వానించబడ్డాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విందు’ అని అనువదించిన హీబ్రూ పదం מִשְׁתֶּה; దీనిని ‘భోజనం’ లేదా ‘ఉత్సవ విందు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నేను ఆమె చేత పిలువబడ్డాను.’ ఈ సందర్భంలో దాని భావం ‘ఆహ్వానించబడ్డాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన శైలిలో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: אַף לֹא
  choice: పైగా ... మరెవరినీ ... లేదు
  rationale: హామాను గొప్పగా చెప్పుకుంటున్న సందర్భంలోని అదనపు, ఉద్ఘాటన భావాన్ని ‘పైగా’ మరియు నిషేధ నిర్మాణం సహజంగా వ్యక్తం చేస్తాయి.
- source_word: הֵבִיאָה
  choice: తీసుకురాలేదు
  rationale: హీబ్రూ క్రియ యొక్క ప్రాథమిక అర్థమైన ‘తీసుకురావడం’ను నిలుపుతుంది; సందర్భంలో విందుకు చేర్చడం లేదా ఆహ్వానించడం అనే భావం కూడా వినిపిస్తుంది.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: రాణి ఎస్తేరు
  rationale: తెలుగులో సహజమైన బిరుదు-పేరు క్రమాన్ని అనుసరిస్తూ వ్యక్తిని, గౌరవపదాన్ని రెండింటినీ కాపాడుతుంది.
- source_word: אֶל הַמִּשְׁתֶּה
  choice: విందుకు
  rationale: రాజసభ సందర్భంలో מִשְׁתֶּה సూచించే భోజన-పాన విందుకు ఆధునిక తెలుగులో ‘విందు’ సహజమైన పదం.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: తాను ఏర్పాటు చేసిన
  rationale: అక్షరార్థంగా ‘ఆమె చేసిన’; విందు విషయంలో ‘ఏర్పాటు చేసిన’ అనేది ఆతిథ్య పాత్రను అతిశయింపకుండా స్పష్టంగా తెలిపే సహజ తెలుగు.
- source_word: כִּי אִם אוֹתִי
  choice: నన్ను తప్ప మరెవరినీ
  rationale: ఈ నిర్మాణంలోని మినహాయింపు మరియు ఏకైకత్వ భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో స్పష్టంగా అందిస్తుంది.
- source_word: וְגַם לְמָחָר
  choice: రేపు కూడా
  rationale: గם యొక్క అదనపు భావాన్ని ‘కూడా’తోను, కాల సూచనను ‘రేపు’తోను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: קָרוּא לָהּ
  choice: ఆమె దగ్గరికి నేను ఆహ్వానించబడ్డాను
  rationale: కָרוּא అక్షరార్థంగా ‘పిలువబడినవాడు’; విందు సందర్భంలో ‘ఆహ్వానించబడ్డాను’ సహజమైన అర్థం. לָהּలోని దిశ/సంబంధ భావాన్ని ‘ఆమె దగ్గరికి’ నిలుపుతుంది.
- source_word: עִם הַמֶּלֶךְ
  choice: రాజుతోపాటు
  rationale: హామాను రాజుతో కలిసి హాజరవుతున్నాడనే సహవాస భావాన్ని సహజంగా తెలియజేస్తుంది.
