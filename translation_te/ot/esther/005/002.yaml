source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/רְא֨וֹת הַ/מֶּ֜לֶךְ אֶת אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה עֹמֶ֨דֶת֙ בֶּֽ/חָצֵ֔ר נָשְׂאָ֥ה חֵ֖ן בְּ/עֵינָ֑י/ו וַ/יּ֨וֹשֶׁט הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֗ר אֶת שַׁרְבִ֤יט הַ/זָּהָב֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/תִּקְרַ֣ב אֶסְתֵּ֔ר וַ/תִּגַּ֖ע בְּ/רֹ֥אשׁ הַ/שַּׁרְבִֽיט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/002.yaml
  text: And when the king saw Esther the queen standing in the court[a], she found favor in his sight, and the king extended to Esther the golden scepter that was in his hand[c][b]. Then Esther came near and touched the top of the scepter.
translation:
  language: te
  text: రాజు ప్రాంగణంలో[a] నిలబడి ఉన్న రాణి ఎస్తేరును చూసినప్పుడు, అతని దృష్టిలో ఆమెకు అనుగ్రహం లభించింది[b]. అప్పుడు రాజు తన చేతిలో ఉన్న బంగారు రాజదండాన్ని ఎస్తేరు వైపు చాచాడు. ఎస్తేరు దగ్గరకు వచ్చి రాజదండం పైభాగాన్ని[c] తాకింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆవరణంలో.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆమె అతని కళ్లలో అనుగ్రహాన్ని మోసింది’; అంటే అతడు ఆమెను అనుకూలంగా చూశాడు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘రాజదండం కొనను.’ హెబ్రీలో ‘రాజదండం తలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹת
  choice: చూసినప్పుడు
  rationale: וַיְהִי తో కూడిన infinitive construct కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది. తెలుగు కథన ప్రవాహంలో ‘చూసినప్పుడు’ సహజంగా ఉండి, హెబ్రీ నిర్మాణంలోని కాలసంబంధాన్ని నిలుపుతుంది.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: రాణి ఎస్తేరు
  rationale: తెలుగులో బిరుదును పేరుకు ముందు ఉంచడం సహజం. ఇది ఎస్తేరు రాజపదవిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֹמֶדֶת בֶּחָצֵר
  choice: ప్రాంగణంలో నిలబడి ఉన్న
  rationale: עֹמֶדֶת ఆమె నిలబడిన స్థితిని సూచిస్తుంది. חָצֵרకు ‘ప్రాంగణం’ లేదా ‘ఆవరణ’ అనే అర్థాలు సాధ్యమైనందున, రాజభవన సందర్భానికి సహజమైన ‘ప్రాంగణం’ ఎంచుకోబడింది.
- source_word: נָשְׂאָה חֵן בְּעֵינָיו
  choice: ఆమె అతని దృష్టిలో ఆదరణ పొందింది
  rationale: అక్షరార్థంగా ‘అతని కళ్లలో ఆదరణను మోసింది’ అనే ఈ హెబ్రీ నుడికారం, రాజు ఆమెను అనుకూలంగా చూశాడనే భావాన్ని తెలియజేస్తుంది. ‘ఆదరణ పొందింది’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַיּוֹשֶׁט
  choice: వైపు చాచాడు
  rationale: ఈ క్రియ ఒక వస్తువును మరొకరి వైపు పొడిగించడాన్ని సూచిస్తుంది. ‘చాచాడు’ స్పష్టమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: బంగారు రాజదండం
  rationale: שַׁרְבִיט రాజాధికారానికి చిహ్నమైన దండాన్ని సూచిస్తుంది; ‘రాజదండం’ సందర్భానుసారంగా స్పష్టంగా ఉంటుంది. הַזָּהָבను ‘బంగారు’గా అనువదించడం సహజం.
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: తన చేతిలో ఉన్న
  rationale: రాజు పట్టుకొని ఉన్న నిర్దిష్ట రాజదండాన్ని ఈ సంబంధ వాక్యం గుర్తిస్తుంది. తెలుగులో ‘తన చేతిలో ఉన్న’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַתִּקְרַב
  choice: దగ్గరకు వచ్చి
  rationale: రాజు సంకేతానికి ప్రతిస్పందనగా ఎస్తేరు సమీపించడాన్ని ఈ క్రియ తెలియజేస్తుంది. ‘దగ్గరకు వచ్చి’ తరువాతి చర్యతో సహజంగా అనుసంధానమవుతుంది.
- source_word: וַתִּגַּע בְּרֹאשׁ הַשַּׁרְבִיט
  choice: రాజదండం పైభాగాన్ని తాకింది
  rationale: רֹאשׁ అక్షరార్థంగా ‘తల’; ఒక వస్తువు విషయంలో అది పైభాగం లేదా కొనను సూచించవచ్చు. ‘పైభాగం’ హెబ్రీ కోరనంతగా ఆకారాన్ని నిర్దిష్టం చేయకుండా అర్థాన్ని అందిస్తుంది.
