  yaml_path: translation/ot/esther/005/013.yaml
  text: Yet all this is worth nothing to me whenever I see Mordecai the Jew sitting at the king’s gate[a][b].
translation:
  language: te
  text: అయినా, యూదుడైన మొర్దెకై రాజద్వారం వద్ద కూర్చుని ఉండడాన్ని నేను చూసినప్పుడల్లా, ఇదంతా నాకు ఏ విలువా లేదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదుడైన మొర్దెకై రాజద్వారం వద్ద కూర్చుని ఉండడాన్ని నేను చూసే ప్రతిసారీ, ఇదంతా నాకు ఏ ప్రయోజనమూ లేదు.”
    reason: lexical_alternative
  - marker: b
    text: “యూదుడు” అనే మాటను “యూదయవాసి” అని కూడా అనువదించవచ్చు; ఇక్కడ పర్షియా రాజసభ నేపథ్యంలోని మొర్దెకై యూద జాతి గుర్తింపునే ఇది ఎక్కువగా నొక్కిచెబుతున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל זֶה
  choice: అయినా, ఇదంతా
  rationale: וְ సాధారణంగా ‘మరియు’ అని అర్థమివ్వగలిగినా, ఇక్కడ హామాను ముందు చెప్పుకున్న ఘనతలకు విరుద్ధమైన భావాన్ని సూచిస్తుంది. ‘అయినా’ ఆ వ్యతిరేకతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; כָל זֶה ను ‘ఇదంతా’గా నిలుపుతుంది.
- source_word: אֵינֶנּוּ שֹׁוֶה לִי
  choice: నాకు ఏ విలువా లేనట్టే
  rationale: שׁוה తో కూడిన నిరాకరణ ఇక్కడ ‘నాకు విలువ కలిగి లేదు/నాకు ప్రయోజనం కాదు’ అనే మదింపు భావాన్ని ఇస్తుంది. హామాను దృష్టిలో అతని ఘనతలన్నీ మొర్దెకై కారణంగా విలువ కోల్పోయాయని సహజంగా తెలియజేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: בְּ/כָל עֵת אֲשֶׁר
  choice: చూసినప్పుడల్లా
  rationale: ‘ప్రతి సమయంలో’ అనే పునరావృత కాలభావాన్ని తెలుగులో ‘అప్పుడల్లా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רֹאֶה
  choice: నేను చూసినప్పుడు
  rationale: אֲנִי తో ఉన్న కృదంతం కొనసాగుతున్న లేదా పునరావృతమయ్యే చర్యను సూచిస్తుంది; ‘చూసినప్పుడల్లా’ ఆ భావాన్ని కాలవాక్యంలో సహజంగా అందిస్తుంది.
- source_word: מָרְדֳּכַי
  choice: మొర్దెకై
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: הַיְּהוּדִי
  choice: యూదుడైన
  rationale: పర్షియా ప్రవాస నేపథ్యంలోని మొర్దెకై జాతి-సామాజిక గుర్తింపును ఇక్కడ יְהוּדִי ప్రధానంగా సూచిస్తుంది. ‘యూదుడైన’ సహజమైన తెలుగు విశేషణ రూపం; ‘యూదయవాసి’ అనే భౌగోళిక అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: יוֹשֵׁב
  choice: కూర్చుని ఉండడం
  rationale: ఈ కృదంతం మొర్దెకై భంగిమతో పాటు రాజద్వారం వద్ద అతడు కనిపిస్తూ ఉండే స్థితిని చిత్రిస్తుంది. ‘కూర్చుని ఉండడం’ ఆ కొనసాగుతున్న దృశ్యాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: בְּ/שַׁעַר הַמֶּלֶךְ
  choice: రాజద్వారం దగ్గర
  rationale: ఇది రాజపాలనతో సంబంధమున్న ద్వార ప్రాంతాన్ని సూచిస్తుంది. ‘రాజద్వారం దగ్గర’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది; స్థలార్థాన్ని అనవసరంగా విస్తరించదు.
