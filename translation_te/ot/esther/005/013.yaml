revisions:
- from: అయినా, యూదుడైన మొర్దెకై రాజద్వారం దగ్గర కూర్చుని ఉండడం నేను చూసినప్పుడల్లా, ఇదంతా నాకు ఏ విలువా లేనట్టే.[a][b]
  to: అయినా, యూదుడైన మొర్దెకై రాజద్వారం వద్ద కూర్చుని ఉండడాన్ని నేను చూసినప్పుడల్లా, ఇదంతా నాకు ఏ విలువా లేదు.[a][b]
  rationale: The revision removes an unintended concessive nuance, rendering the source’s categorical statement of worthlessness directly. It also improves the Telugu syntax of the repeated seeing clause, while retaining the source’s ambiguity concerning יְהוּדִי in a footnote.
