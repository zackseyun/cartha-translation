id: EST.5.1
reference: Esther 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י וַ/תִּלְבַּ֤שׁ אֶסְתֵּר֙ מַלְכ֔וּת וַֽ/תַּעֲמֹ֞ד בַּ/חֲצַ֤ר בֵּית הַ/מֶּ֨לֶךְ֙ הַ/פְּנִימִ֔ית נֹ֖כַח בֵּ֣ית הַ/מֶּ֑לֶךְ וְ֠/הַ/מֶּלֶךְ יוֹשֵׁ֞ב עַל כִּסֵּ֤א מַלְכוּת/וֹ֙ בְּ/בֵ֣ית הַ/מַּלְכ֔וּת נֹ֖כַח פֶּ֥תַח הַ/בָּֽיִת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/001.yaml
  text: On the third day[a], Esther put on her royal robes and stood in the inner court of the king’s palace, opposite the king’s house, while the king was sitting on his royal throne in the royal house[b], opposite the entrance of the house.
translation:
  language: te
  text: మూడవ రోజున ఎస్తేరు రాజవస్త్రాలు[a] ధరించి, రాజభవనంలోని లోపలి ప్రాంగణంలో రాజభవనానికి ఎదురుగా నిలబడింది; రాజు తన రాజసింహాసనంపై, రాజభవనంలో, ఆ భవనం ప్రవేశద్వారానికి ఎదురుగా కూర్చొని ఉండగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రాజరికాన్ని ధరించింది”; అంటే రాజవస్త్రాలు లేదా రాజోచిత అలంకారం ధరించింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేక పదంగా అనువదించకుండా కథన క్రమంలో కలిపివేయడం
  rationale: ఇది కథనాన్ని ముందుకు నడిపించే సాధారణ హీబ్రూ నిర్మాణం. ఆధునిక తెలుగులో ‘అప్పుడు జరిగింది’ అని విడిగా చేర్చడం అసహజంగా ఉంటుంది; వాక్య క్రమమే దాని కార్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: కాల సూచనను నేరుగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת
  choice: ఎస్తేరు రాజవస్త్రాలు ధరించి
  rationale: మూలంలో అక్షరార్థంగా ‘రాజరికాన్ని ధరించింది’ అనే అసాధారణ ప్రయోగం ఉంది. సందర్భంలో అది రాజవస్త్రాలు లేదా రాజోచిత అలంకారాన్ని సూచిస్తుంది; ప్రధాన పాఠ్యంలో సహజమైన అర్థాన్ని ఇచ్చి, మూల ప్రయోగాన్ని పాదసూచికలో ఉంచాం.
- source_word: בַּחֲצַר בֵּית־הַמֶּלֶךְ הַפְּנִימִית
  choice: రాజభవనంలోని లోపలి ప్రాంగణంలో
  rationale: בֵּית అనే పదం ఇక్కడ రాజు నివసించే భవన సముదాయాన్ని సూచిస్తుంది. ‘రాజభవనం’ ప్రాంగణ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נֹכַח בֵּית הַמֶּלֶךְ
  choice: రాజమందిరానికి ఎదురుగా
  rationale: נֹכַח సూచించే ముఖాముఖి స్థల సంబంధాన్ని ‘ఎదురుగా’ సహజంగా నిలుపుతుంది.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: అప్పుడు రాజు ... కూర్చొని ఉన్నాడు
  rationale: ఈ ఉపవాక్యం అదే సమయంలో రాజు ఉన్న స్థితిని వివరిస్తుంది. ‘అప్పుడు’ తెలుగు కథన ప్రవాహంలో సమకాలీన నేపథ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: తన రాజసింహాసనం మీద
  rationale: ‘అతని రాజరికపు సింహాసనం’ అనే నిర్మాణానికి సహజమైన తెలుగు సమానార్థకం; రాజుకు సంబంధించిన సింహాసనం అనే భావాన్ని నిలుపుతుంది.
- source_word: בְּבֵית הַמַּלְכוּת
  choice: రాజమందిరంలో
  rationale: అక్షరార్థంగా ‘రాజరికపు గృహంలో’ అయినా, సందర్భంలో ఇది రాజభవనంలోని రాజు ఆసీనుడయ్యే మందిరాన్ని సూచిస్తుంది. ‘రాజమందిరం’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: נֹכַח פֶּתַח הַבָּיִת
  choice: మందిర ప్రవేశద్వారానికి ఎదురుగా
  rationale: రాజసింహాసనం ప్రవేశద్వారాన్ని ఎదుర్కొని ఉన్న స్థల అమరికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘రాజభవనం’ను మొత్తం ప్రాసాద సముదాయానికి, ‘రాజమందిరం’ను రాజు ఆసీనుడైన అంతర్గత భవనానికి వాడి స్థల అమరికను స్పష్టంచేశాం; మూలంలోని בית పదానికి ఉన్న అర్థ విస్తృతిని పాదసూచికలో నిలిపాం.
