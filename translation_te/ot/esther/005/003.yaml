  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. రాజసభ సందర్భానికి తగిన ‘విన్నపం’ వంటి పదాన్ని ఎంచుకుంటూనే వాక్యాన్ని సాధారణ పాఠకునికి సులభంగా ఉంచాం. హీబ్రూ నుడికారంలోని అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
