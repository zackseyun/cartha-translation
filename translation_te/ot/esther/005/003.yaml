  text: וַ/יֹּ֤אמֶר לָ/הּ֙ הַ/מֶּ֔לֶךְ מַה לָּ֖/ךְ אֶסְתֵּ֣ר הַ/מַּלְכָּ֑ה וּ/מַה בַּקָּשָׁתֵ֛/ךְ עַד חֲצִ֥י הַ/מַּלְכ֖וּת וְ/יִנָּ֥תֵֽן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/003.yaml
  text: Then the king said to her[a], “What is it[c][b], Queen Esther? And what is your request? Up to half the kingdom—it will be given to you.”
translation:
  language: te
  text: అప్పుడు రాజు ఆమెతో, “రాణి ఎస్తేరు, ఏమిటి?[a] నీ విన్నపం[b] ఏమిటి? రాజ్యంలో సగం వరకు అయినా[c] అది నీకు ఇవ్వబడుతుంది” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూ నుడికారం అక్షరార్థంగా, ‘నీకు ఏమి?’ అని ఉంటుంది. దీనిని ‘నిన్ను ఏది కలవరపెడుతోంది?’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘విన్నపం’కు బదులుగా ‘అభ్యర్థన’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఇది రాజు ఉదారంగా ఇస్తానని తెలిపే సంప్రదాయ రాజసభోక్తి; రాజ్యాన్ని నిజంగా సగం చేసి ఇస్తాననే అక్షరార్థ ప్రతిపాదనగా ఉండనవసరం లేదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన శైలిలో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָהּ
  choice: ఆమెతో
  rationale: హీబ్రూ ఉపసర్గతో కూడిన స్త్రీలింగ ఏకవచన సర్వనామాన్ని సహజమైన తెలుగు సంభాషణ నిర్మాణంలో ప్రతిబింబిస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట నామవాచకానికి సందర్భానుగుణమైన సూటి అనువాదం.
- source_word: מַה לָּךְ
  choice: నీకు ఏమైంది?
  rationale: ‘నీకు ఏమి?’ అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది; ఆమెకు కలత ఉందని ఖచ్చితంగా నిర్ణయించకుండా ప్రశ్న యొక్క విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: ఎస్తేరు రాణీ
  rationale: ప్రత్యక్ష సంబోధనకు తగిన తెలుగు రూపం; పేరు, రాజబిరుదు రెండింటినీ కాపాడుతుంది.
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: నీ విన్నపం ఏమిటి?
  rationale: בַּקָּשָׁה రాజసభ సందర్భంలో అభ్యర్థన లేదా విన్నపాన్ని సూచిస్తుంది; ‘విన్నపం’ గౌరవప్రదంగానూ సాధారణ పాఠకునికి స్పష్టంగానూ ఉంది.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: రాజ్యంలో సగం వరకు అడిగినా
  rationale: రాజు వాగ్దానం యొక్క గరిష్ఠ పరిధిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘అడిగినా’ అనేది తరువాతి నిష్క్రియ వాగ్దానంతో సంబంధాన్ని సహజంగా చేస్తుంది.
- source_word: וְיִנָּתֵן לָךְ
  choice: అది నీకు ఇవ్వబడుతుంది
  rationale: నతన్ క్రియ యొక్క నిఫాల్ అసంపూర్ణ రూపంలోని నిష్క్రియ వాగ్దాన భావాన్ని నిలుపుతుంది; ‘అది’ ముందున్న విన్నపాన్ని సూచిస్తుంది.
