- from: కాని హామాను తనను తాను అదుపు చేసుకొని, తన ఇంటికి వెళ్లాడు.[a] తరువాత అతడు తన స్నేహితులను, తన భార్య జెరెషును పిలిపించాడు.
  to: కాని హామాను తనను తాను అదుపు చేసుకొని తన ఇంటికి వెళ్లాడు.[a] తరువాత అతడు కబురు పంపి తన స్నేహితులను, తన భార్య జెరెషును రప్పించాడు.
