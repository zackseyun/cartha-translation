  yaml_path: translation/ot/esther/005/010.yaml
  text: But Haman restrained himself and went to his house[b][a]. Then he sent and brought in his friends and Zeresh his wife.
translation:
  language: te
  text: కాని హామాను తనను తాను అదుపు చేసుకొని తన ఇంటికి వెళ్లాడు.[a] తరువాత అతడు కబురు పంపి తన స్నేహితులను, తన భార్య జెరెషును రప్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇంటికి వెళ్లాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַפַּק
  choice: తనను తాను అదుపు చేసుకొని
  rationale: హిత్పయేల్ రూపంలోని ప్రతిఫలార్థాన్ని, సందర్భంలో కోపాన్ని అణచుకున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: తన ఇంటికి వెళ్లాడు
  rationale: ఇది ‘తన ఇంటివైపు వెళ్లాడు’ అనే హెబ్రీయ భావాన్ని సహజంగా నిలుపుతుంది; ‘ఇంటికి చేరుకున్నాడు’ అని మూలంలో లేని సంపూర్ణతను జోడించదు.
- source_word: וַיִּשְׁלַח וַיָּבֵא
  choice: పిలిపించాడు
  rationale: ‘పంపి రప్పించాడు’ అనే వరుస క్రియల సమగ్ర భావాన్ని తెలుగులో సహజమైన కారణార్థక క్రియతో అందిస్తుంది.
- source_word: אֹהֲבָיו
  choice: తన స్నేహితులను
  rationale: ప్రేమించేవారు అనే శబ్దవ్యుత్పత్తి ఉన్నా, ఈ నామవాచక బహువచనం సందర్భంలో సన్నిహితులు లేదా స్నేహితులను సూచిస్తుంది.
- source_word: זֶרֶשׁ אִשְׁתּוֹ
  choice: తన భార్య జెరెషును
  rationale: తెలుగులో వ్యక్తిని స్పష్టంగా, సహజంగా గుర్తించే పదక్రమం; పేరు మరియు భార్య అనే సంబంధం రెండింటినీ నిలుపుతుంది.
- source_word: וַ
  choice: కాని
  rationale: ముందటి సందర్భంలో హామాను కోపంతో నిండిపోయినా తనను అదుపు చేసుకున్న వ్యతిరేకతను సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. హెబ్రీయ క్రియల సంక్షిప్త వరుసను తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘పిలిపించాడు’ ఉపయోగించబడింది.
