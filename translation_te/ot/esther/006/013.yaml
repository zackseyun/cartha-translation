  edition: WLC
  text: וַ/יְסַפֵּ֨ר הָמָ֜ן לְ/זֶ֤רֶשׁ אִשְׁתּ/וֹ֙ וּ/לְ/כָל אֹ֣הֲבָ֔י/ו אֵ֖ת כָּל אֲשֶׁ֣ר קָרָ֑/הוּ וַ/יֹּ֩אמְרוּ֩ ל֨/וֹ חֲכָמָ֜י/ו וְ/זֶ֣רֶשׁ אִשְׁתּ֗/וֹ אִ֣ם מִ/זֶּ֣רַע הַ/יְּהוּדִ֡ים מָרְדֳּכַ֞י אֲשֶׁר֩ הַחִלּ֨וֹתָ לִ/נְפֹּ֤ל לְ/פָנָי/ו֙ לֹא תוּכַ֣ל ל֔/וֹ כִּֽי נָפ֥וֹל תִּפּ֖וֹל לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/013.yaml
  text: Then Haman told Zeresh his wife and all his friends everything that had happened to him. Then his wise men and Zeresh his wife said to him[a], “If Mordecai, before whom you have begun to fall, is from the seed of the Jews, you will not prevail against him, for you will surely fall before him.”
translation:
  language: te
  text: 'అప్పుడు హామాను తన భార్య జెరెషుకు, తన స్నేహితులందరికీ తనకు జరిగినదంతా వివరించాడు. అప్పుడు అతని జ్ఞానులు మరియు అతని భార్య జెరెషు అతనితో ఇలా అన్నారు: “మొర్దెకై యూదుల సంతతికి చెందినవాడైతే[a], అతని ఎదుట నీవు పడిపోవడం మొదలుపెట్టావు; అతనిపై నీవు గెలవలేవు, ఎందుకంటే నీవు అతని ఎదుట తప్పకుండా పడిపోతావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యూదుల విత్తనం నుండి వచ్చినవాడైతే.”
    reason: זֶרַע అనే పదానికి అక్షరార్థంగా ‘విత్తనం’ అని అర్థం; ఈ సందర్భంలో అది వంశం లేదా సంతతిని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: వివరించాడు
  rationale: హామాను జరిగిన సంగతులన్నిటినీ వరుసగా చెప్పాడనే ספר క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֹהֲבָיו
  choice: తన స్నేహితులందరికీ
  rationale: అక్షరార్థంగా ప్రేమించేవారు అనే భావమున్నా, రాజసభా సామాజిక సందర్భంలో సన్నిహితులు లేదా సహచరులను సూచిస్తుంది; ‘స్నేహితులు’ సహజంగా సరిపోతుంది.
- source_word: כָּל אֲשֶׁר קָרָהוּ
  choice: తనకు జరిగినదంతా
  rationale: హామానుకు సంభవించిన విషయాలన్నిటినీ సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֲכָמָיו
  choice: అతని జ్ఞానులు
  rationale: మూలంలోని ‘అతని జ్ఞానులు’ అనే రూపాన్ని నిలుపుతుంది; వారిని కేవలం సలహాదారులుగా పరిమితం చేయదు.
- source_word: אִם מִזֶּרַע הַיְּהוּדִים
  choice: మొర్దెకై యూదుల సంతతికి చెందినవాడైతే
  rationale: זֶרַע ఇక్కడ వంశపారంపర్యాన్ని సూచిస్తుంది. ‘సంతతి’ మూల రూపకానికి దగ్గరగా ఉండి ఆధునిక తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: הַחִלּוֹתָ לִנְפֹּל לְפָנָיו
  choice: అతని ఎదుట నీవు పడిపోవడం మొదలుపెట్టావు
  rationale: החל తెలిపే ఆరంభ భావాన్నీ, נפל యొక్క ‘పడిపోవు’ రూపాన్నీ నిలుపుతుంది; తరువాతి వాక్యభాగంలోని పునరుక్తికి కూడా అనుసంధానం కల్పిస్తుంది.
- source_word: לֹא תוּכַל לוֹ
  choice: అతనిపై నీవు గెలవలేవు
  rationale: יכל + ל సందర్భంలో ప్రత్యర్థిపై పైచేయి సాధించలేకపోవడాన్ని సూచిస్తుంది; తెలుగులో ‘గెలవలేవు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: נָפוֹל תִּפּוֹל
  choice: తప్పకుండా పూర్తిగా పడిపోతావు
  rationale: క్రియార్థక నామరూపం మరియు సమాపక క్రియ కలయిక ఇచ్చే నిశ్చయాత్మక తీవ్రతను ‘తప్పకుండా పూర్తిగా’ తెలియజేస్తుంది.
- source_word: לְפָנָיו
  choice: అతని ఎదుట
  rationale: మొర్దెకై సంబంధంగా హామాను పొందే ఓటమి లేదా పతనాన్ని సూచిస్తూ, మూలంలోని పునరావృతిని నిలుపుతుంది.
