  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘పడిపోవడం/పడిపోతావు’ అనే మూల పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం; జోస్యసదృశ నిశ్చయాన్ని అతిగా సిద్ధాంతీకరించకుండా అనువదించాం.
