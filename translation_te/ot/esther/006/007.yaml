  yaml_path: translation/ot/esther/006/007.yaml
  text: And Haman said to the king[a], “For the man whom the king delights to honor—”
translation:
  language: te
  text: 'అప్పుడు హామాను రాజుతో ఇలా అన్నాడు: “రాజు ఎవరిని ఘనపరచడంలో ఆనందిస్తాడో, ఆ మనిషి కోసం—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు ... ఇలా అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: הָמָן
  choice: హామాను
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־הַמֶּלֶךְ
  choice: రాజుతో
  rationale: మాట్లాడే క్రియతో ‘రాజుతో’ అనడం ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: אִישׁ
  choice: ఆ మనిషి
  rationale: హీబ్రూ పదం ఏకవచన పుంలింగంలో ఉండి అనిర్దిష్టంగా ‘ఒక మనిషి’ అని కూడా అర్థమివ్వగలదు. అయితే సంబంధవాక్యాన్ని అనుసరించి తెలుగులో ‘ఎవరిని ... ఆ మనిషి’ అనే సహసంబంధ నిర్మాణం సహజంగా ఉంటుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֲשֶׁר
  choice: ఎవరిని ... ఆ
  rationale: వ్యక్తిని సూచించే హీబ్రూ సంబంధసర్వనామాన్ని తెలుగులో సహజమైన ‘ఎవరిని ... ఆ’ నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: חָפֵץ
  choice: ఇష్టపడతాడో
  rationale: ఈ క్రియ కేవలం సంకల్పాన్ని కాక ఇష్టాన్ని లేదా ఆనందాన్ని కూడా సూచిస్తుంది. ‘కోరుకుంటాడో’ కంటే ‘ఇష్టపడతాడో’ ఆ భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: בִּיקָרוֹ
  choice: ఎవరిని ఘనపరచడం
  rationale: יְקָר ఇక్కడ గౌరవం లేదా ప్రతిష్ఠను సూచిస్తుంది. తెలుగులో క్రియారూపమైన ‘ఘనపరచడం’ రాజాస్థాన సందర్భానికి సహజంగా సరిపోతుంది.
