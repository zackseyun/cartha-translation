translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘవిరామ సూచకంగా డ్యాష్‌ను నిలిపాం.
