  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבוֹא֮ הָמָן֒ וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ מַה לַ/עֲשׂ֕וֹת בָּ/אִ֕ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֣ץ בִּ/יקָר֑/וֹ וַ/יֹּ֤אמֶר הָמָן֙ בְּ/לִבּ֔/וֹ לְ/מִ֞י יַחְפֹּ֥ץ הַ/מֶּ֛לֶךְ לַ/עֲשׂ֥וֹת יְקָ֖ר יוֹתֵ֥ר מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/006.yaml
  text: So Haman came in[a], and the king said to him, “What should be done for the man whom the king delights to honor?” And Haman said in his heart, “Whom would the king delight to honor more than me?”
translation:
  language: te
  text: 'హామాను లోపలికి వచ్చాడు. రాజు అతనితో, “రాజు ఘనపరచాలని ఇష్టపడే వ్యక్తికి ఏమి చేయాలి?” అన్నాడు. అప్పుడు హామాను తన మనసులో అనుకున్నాడు[a]: “నాకంటే ఎక్కువగా ఎవరిని ఘనపరచాలని రాజు ఇష్టపడతాడు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “తన హృదయంలో అన్నాడు.”
    reason: హీబ్రూ అంతరంగ సంభాషణను ‘హృదయంలో చెప్పడం’ అనే రూపకంతో వ్యక్తపరుస్తుంది; ప్రధాన పాఠంలో సహజమైన ఆధునిక తెలుగు వాడుతూ మూలరూపాన్ని ఇక్కడ భద్రపరచాం.
lexical_decisions:
- source_word: וַיָּבוֹא הָמָן
  choice: హామాను లోపలికి వచ్చాడు
  rationale: ఈ క్రియ కథనాన్ని ముందుకు నడిపిస్తుంది; రాజు సన్నిధిలోకి ప్రవేశించడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ‘లోపలికి వచ్చాడు’ ఉపయోగించబడింది.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: రాజు అతనితో … అన్నాడు
  rationale: אָמַר అనే మూలక్రియకు ‘అన్నాడు’ నేరుగా సరిపోతుంది; పలికిన మాట ప్రశ్న అయినప్పటికీ ‘అడిగాడు’ అని మార్చకుండా హీబ్రూ వ్యక్తీకరణను నిలుపుతుంది.
- source_word: מַה לַעֲשׂוֹת בָּאִישׁ
  choice: వ్యక్తికి ఏమి చేయాలి?
  rationale: ఈ సందర్భంలో ఆ వ్యక్తికి తగిన విధంగా ఏమి చేయాలనే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; మַה לַעֲשׂוֹת లోని విధి లేదా యుక్తత భావాన్ని ‘చేయాలి’ వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: రాజు ఘనపరచాలని ఇష్టపడే
  rationale: חָפֵץ లోని ఇష్టం లేదా సంతోషపూర్వకమైన అభిలాషను ‘ఇష్టపడే’ తెలియజేస్తుంది; יְקָר ఈ రాజసభ సందర్భంలో ప్రసాదించే ఘనతను సూచిస్తుంది.
- source_word: וַיֹּאמֶר הָמָן בְּלִבּוֹ
  choice: హామాను తన మనసులో అనుకున్నాడు[a]
  rationale: హీబ్రూ పదశః ‘తన హృదయంలో చెప్పుకున్నాడు.’ ఆధునిక తెలుగులో అంతరంగ సంభాషణను సహజంగా తెలియజేయడానికి ‘తన మనసులో అనుకున్నాడు’ వాడి, మూలంలోని రూపకాన్ని పాదసూచికలో భద్రపరచాం.
- source_word: לְמִי יַחְפֹּץ הַמֶּלֶךְ לַעֲשׂוֹת יְקָר יוֹתֵר מִמֶּנִּי
  choice: నాకంటే ఎక్కువగా ఎవరిని ఘనపరచాలని రాజు ఇష్టపడతాడు?
  rationale: హామాను తన గురించే రాజు మాట్లాడుతున్నాడని భావించిన అహంకారపూరిత అలంకార ప్రశ్నను స్పష్టంగా ఉంచుతుంది; חָפֵץ కు ముందు వాక్యంలో వాడిన ‘ఇష్టపడు’నే పునరావృతం చేసి మూలంలోని పదసామ్యాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. రాజసభ సందర్భానికి తగిన ‘ఘనపరచు’ పదాన్ని ఎంచుకున్నాం. חָפֵץ అనే పదం రెండుసార్లు రావడాన్ని ప్రతిబింబిస్తూ రెండు చోట్లా ‘ఇష్టపడు’ను నిలిపాం. పాదసూచిక గుర్తును దానికి సంబంధించిన అంతరంగ వాక్యంపైనే ఉంచాం.
