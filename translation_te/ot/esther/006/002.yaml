  text: וַ/יִּמָּצֵ֣א כָת֗וּב אֲשֶׁר֩ הִגִּ֨יד מָרְדֳּכַ֜י עַל בִּגְתָ֣נָא וָ/תֶ֗רֶשׁ שְׁנֵי֙ סָרִיסֵ֣י הַ/מֶּ֔לֶךְ מִ/שֹּׁמְרֵ֖י הַ/סַּ֑ף אֲשֶׁ֤ר בִּקְשׁוּ֙ לִ/שְׁלֹ֣חַ יָ֔ד בַּ/מֶּ֖לֶךְ אֲחַשְׁוֵרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/002.yaml
  text: And it was found written that Mordecai had reported concerning Bigthana and Teresh[a], two of the king’s eunuchs, among those who guarded the threshold[b], who had sought to lay a hand on King Ahasuerus.
translation:
  language: te
  text: 'మొర్దెకై బిగ్తానా[a] మరియు తెరెషుల గురించి తెలియజేశాడని వ్రాయబడి ఉండటం కనుగొనబడింది. వారు రాజుకు చెందిన ఇద్దరు నపుంసకులు[b], రాజద్వారాన్ని కాపాడేవారిలో ఉన్నవారు; వారు అహష్వేరోషు రాజుపై చేయి వేయడానికి ప్రయత్నించారు.


    [a] ఈ వచనంలోని హీబ్రూ రూపాన్ని బట్టి ఇక్కడ “బిగ్తానా” అని అనువదించబడింది; ఇతర చోట్ల ఈ పేరు “బిగ్తాన్” అనే రూపంలో కనిపిస్తుంది.


    [b] లేదా “రాజుకు చెందిన ఇద్దరు ఆస్థాన అధికారులు”; హీబ్రూ పదం ప్రత్యేకంగా నపుంసకులను గానీ, విస్తృతార్థంలో రాజోద్యోగులను గానీ సూచించవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలోని హీబ్రూ రూపాన్ని బట్టి ఇక్కడ “బిగ్తానా” అని అనువదించబడింది; ఇతర చోట్ల ఈ పేరు “బిగ్తాన్” అనే రూపంలో కనిపిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా “రాజుకు చెందిన ఇద్దరు ఆస్థాన అధికారులు”; హీబ్రూ పదం ప్రత్యేకంగా నపుంసకులను గానీ, విస్తృతార్థంలో రాజోద్యోగులను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא כָתוּב
  choice: రాసి ఉండడం కనుగొనబడింది
  rationale: నిష్క్రియ నిర్మాణాన్నీ, లిఖితపూర్వక రాజదర్బారు నమోదులో విషయం దొరికిందనే భావాన్నీ నిలుపుతుంది.
- source_word: הִגִּיד
  choice: తెలియజేసినట్లు
  rationale: ఈ సందర్భంలో అధికారికంగా సమాచారం ఇచ్చాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַל
  choice: సంగతి
  rationale: మొర్దెకై ఇచ్చిన సమాచారపు విషయాన్ని సూచిస్తుంది; తప్పనిసరిగా ‘వారికి వ్యతిరేకంగా’ అని అర్థాన్ని కుదించదు.
- source_word: בִּגְתָנָא וָתֶרֶשׁ
  choice: బిగ్తానా, తెరెషు
  rationale: ఈ వచనంలోని WLC హీబ్రూ నామరూపాలను తెలుగులో ధ్వన్యనుసారంగా ప్రతిబింబిస్తుంది; బిగ్తాను అనే ఇతర రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: שְׁנֵי סָרִיסֵי הַמֶּלֶךְ
  choice: రాజుకు చెందిన ఇద్దరు నపుంసకులు
  rationale: సָרִיסִים అనే పదానికి రాజదర్బారు సందర్భంలో ఉన్న నిర్దిష్ట అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ‘ఆస్థాన అధికారులు’ అనే విస్తృత అర్థాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: రాజద్వారాన్ని కాపాడేవారిలో
  rationale: వారు ద్వారం/గడప కాపలాదారుల సమూహానికి చెందినవారనే విభక్తి భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בִּקְשׁוּ
  choice: చేయాలని చూసిన
  rationale: వారు అలా చేయాలని కోరారు లేదా పూనుకున్నారు అనే భావాన్ని ఇస్తుంది; కార్యం విజయవంతమైందని సూచించదు.
- source_word: לִשְׁלֹחַ יָד
  choice: చేయి వేయాలని
  rationale: హీబ్రూ విరోధార్థక నానుడిలోని ‘చేయి చాపడం/వేయడం’ అనే రూపకాన్ని నిలుపుతూ హాని చేయాలనే భావాన్ని సందర్భం ద్వారా స్పష్టం చేస్తుంది.
- source_word: בַּמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజుపై
  rationale: ముందున్న నానుడితో సహజంగా అనుసంధానమై, విరోధ చర్యకు రాజే లక్ష్యమని స్పష్టం చేస్తుంది.
