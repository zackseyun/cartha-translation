  text: Then Mordecai returned to the king’s gate[a], but Haman hurried to his house[b], mourning and with his head covered.
translation:
  language: te
  text: ఆ తర్వాత మొర్దెకై రాజద్వారానికి తిరిగి వెళ్లాడు. అయితే హామాను దుఃఖిస్తూ, తల కప్పుకొని[b], తన ఇంటికి త్వరత్వరగా వెళ్లాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన ఇంటికి తోసివేయబడినవాడిలా వెళ్లాడు.” హీబ్రూ క్రియలోని నిష్క్రియ భావాన్ని ఈ అనువాదం మరింత స్పష్టంగా చూపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: తలను కప్పుకోవడం దుఃఖం, అవమానం లేదా శోకానికి సాంస్కృతిక సూచనగా ఉండేది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వెళ్లాడు
  rationale: שׁוּב ఇక్కడ మొర్దెకై తన మునుపటి స్థానమైన రాజద్వారానికి తిరిగి వెళ్లడాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం దిశాభావాన్ని సహజంగా నిలుపుతుంది.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: రాజద్వారం
  rationale: రాజుతో లేదా రాజభవన సముదాయంతో సంబంధమున్న ద్వారాన్ని తెలిపే సమాసానికి ఇది సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: נִדְחַף
  choice: త్వరత్వరగా వెళ్లాడు
  rationale: దחף ధాతువు నిఫాల్ రూపం తోసివేయబడినట్లు లేదా ఏదో ప్రేరణకు లోనై వేగంగా వెళ్లే భావాన్ని కలిగించగలదు. సందర్భంలో అవమానానంతరం హామాను హడావిడిగా వెళ్లడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, నిష్క్రియార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: בֵּיתוֹ
  choice: తన ఇంటికి
  rationale: కర్త హామానుతో స్వామ్యసంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אָבֵל
  choice: దుఃఖిస్తూ
  rationale: హామాను శోకస్థితిలో ఉన్నాడనే విశేషణ భావాన్ని తెలుగు కథన ప్రవాహంలో సహజమైన క్రియావిశేషణ రూపంలో అందిస్తుంది.
- source_word: חֲפוּי רֹאשׁ
  choice: తల కప్పుకొని
  rationale: అవమానం లేదా శోకాన్ని సూచించే దృశ్యమాన సాంస్కృతిక చర్యను వ్యాఖ్యానంతో భర్తీ చేయకుండా యథార్థంగా నిలుపుతుంది.
