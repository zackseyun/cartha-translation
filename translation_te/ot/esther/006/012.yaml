translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని విరుద్ధ దృశ్యాలు—మొర్దెకై తన స్థానానికి తిరిగి వెళ్లడం, హామాను అవమానంతో ఇంటికి వెళ్లడం—స్పష్టంగా నిలుపబడ్డాయి. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గర ఉంచాం.
