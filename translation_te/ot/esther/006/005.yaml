source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ נַעֲרֵ֤י הַ/מֶּ֨לֶךְ֙ אֵלָ֔י/ו הִנֵּ֥ה הָמָ֖ן עֹמֵ֣ד בֶּ/חָצֵ֑ר וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/005.yaml
  text: The king’s attendants said to him[a], “Look, Haman is standing in the court.” And the king said, “Let him come in.”
translation:
  language: te
  text: రాజు పరిచారకులు అతనితో, “ఇదిగో, హామాను ప్రాంగణంలో[a] నిలబడి ఉన్నాడు” అన్నారు. అప్పుడు రాజు, “అతన్ని లోపలికి రానివ్వండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆవరణంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: రాజు పరిచారకులు
  rationale: నַעַר అనే పదం సందర్భానుసారంగా యువకుడు, సేవకుడు, పరిచారకుడు అనే అర్థాలు ఇవ్వగలదు. రాజసభ సందర్భంలో వారి విధిని సహజంగా తెలియజేయడానికి ‘పరిచారకులు’ ఎంచుకోబడింది; వారి వయస్సును అనవసరంగా నిర్దేశించదు.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: దృష్టిని వెంటనే ఒక వ్యక్తి లేదా పరిస్థితివైపు మళ్లించే హీబ్రూ సూచనార్థక అవ్యయ భావాన్ని ఆధునిక, సహజమైన తెలుగులో ‘ఇదిగో’ తెలియజేస్తుంది.
- source_word: עֹמֵד
  choice: నిలబడి ఉన్నాడు
  rationale: వర్తమానంలో కొనసాగుతున్న స్థితిని సూచించే కృదంత రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది. ‘వేచి ఉన్నాడు’ అనడం సందర్భార్థాన్ని వ్యాఖ్యానించి చేర్చినట్లవుతుంది.
- source_word: בֶּחָצֵר
  choice: ప్రాంగణంలో
  rationale: חָצֵר రాజభవన సందర్భంలో ఆవరణ లేదా ప్రాంగణాన్ని సూచిస్తుంది. ‘ప్రాంగణం’ సహజంగా ఉండి స్థలాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ఆవరణం’ అనే సాధ్యమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: יָבֹא
  choice: అతన్ని లోపలికి రానివ్వండి
  rationale: ఇక్కడి అసంపూర్ణ క్రియారూపం రాజు ఇచ్చిన ఆజ్ఞ లేదా అనుమతిని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ నిర్దేశక బలాన్ని, రాజు సమక్షంలోకి ప్రవేశించే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הָמָן
  choice: హామాను
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
