  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని, రాజసభ సందర్భానికి తగిన గౌరవప్రద ధోరణిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస చర్యలను స్పష్టమైన తెలుగు వాక్యాలుగా విభజించాం; మూలంలో లేని ‘రాజుగారి గుర్రం’ వంటి వివరణను చేర్చలేదు.
