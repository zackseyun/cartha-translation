source:
  edition: WLC
  text: וַ/יִּקַּ֤ח הָמָן֙ אֶת הַ/לְּב֣וּשׁ וְ/אֶת הַ/סּ֔וּס וַ/יַּלְבֵּ֖שׁ אֶֽת מָרְדֳּכָ֑י וַ/יַּרְכִּיבֵ֨/הוּ֙ בִּ/רְח֣וֹב הָ/עִ֔יר וַ/יִּקְרָ֣א לְ/פָנָ֔י/ו כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/011.yaml
  text: So Haman took the robe and the horse[a], clothed Mordecai, led him on horseback through the city square, and proclaimed before him, “Thus shall it be done for the man whom the king delights to honor.”
translation:
  language: te
  text: 'అప్పుడు హామాను ఆ వస్త్రాన్ని, ఆ గుర్రాన్ని తీసుకొని, మొర్దెకైకి ఆ వస్త్రాన్ని తొడిగాడు. అతన్ని గుర్రం మీద ఎక్కించి నగర కూడలి గుండా స్వారీ చేయించాడు[a]. అతని ముందుగా ఇలా ప్రకటించాడు: “రాజు ఎవరిని ఘనపరచడానికి ఇష్టపడతాడో, ఆ మనిషికి ఈ విధంగా చేస్తారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “అతన్ని గుర్రం మీద నగర కూడలి గుండా తీసుకెళ్లాడు.” హీబ్రూ క్రియ కారక రూపంలో ఉంది: బహిరంగ గౌరవయాత్రలో మొర్దెకై గుర్రంపై స్వారీ చేసేలా హామాను చేశాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּבוּשׁ
  choice: ఆ వస్త్రం
  rationale: నిర్దిష్ట ఏకవచన నామవాచకం; ముందటి సందర్భంలో చెప్పిన ప్రత్యేక రాజవస్త్రాన్నే సూచిస్తుంది. ‘వస్త్రం’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: הַסּוּס
  choice: గుర్రం
  rationale: హీబ్రూ మూలంలో ‘రాజుగారి’ అనే విశేషణం లేకుండా నిర్దిష్ట రూపంలో ‘ఆ గుర్రం’ అనే భావమే ఉంది; రాజసంబంధం ముందటి సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: וַיַּלְבֵּשׁ אֶת־מָרְדֳּכָי
  choice: మొర్దెకైకి ఆ వస్త్రం తొడిగించాడు
  rationale: לבש యొక్క హిఫీల్ రూపంలోని ‘ఒకరికి వస్త్రం తొడిగించడం’ అనే కారక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּרְכִּיבֵהוּ
  choice: అతన్ని గుర్రం మీద ఎక్కించి … తీసుకెళ్లాడు
  rationale: רכב యొక్క కారక రూపం మొర్దెకై గుర్రంపై స్వారీ చేసేలా హామాను చేసినట్లు సూచిస్తుంది. తెలుగు కథనంలో ఈ ప్రయోగం సహజంగా ఉండి, బహిరంగ గౌరవయాత్ర భావాన్ని సందర్భానుసారంగా అందిస్తుంది.
- source_word: בִּרְחוֹב הָעִיר
  choice: నగర కూడలి గుండా
  rationale: רְחוֹב సాధారణ వీధికన్నా విశాలమైన బహిరంగ ప్రదేశం లేదా నగర కూడలిని సూచిస్తుంది; ‘నగర కూడలి’ ఆ బహిరంగ పౌర వేదికను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּקְרָא לְפָנָיו
  choice: అతని ముందు ఇలా చాటించాడు
  rationale: קרא ఇక్కడ బహిరంగంగా ప్రకటించడాన్ని సూచిస్తుంది. ‘అతని ముందు’ అనే స్థలసంబంధ పదబంధాన్ని ఉంచుతూ, హామాను ఖచ్చితంగా ఎలా కదిలాడో అదనంగా నిర్ధారించదు.
- source_word: כָּכָה יֵעָשֶׂה
  choice: ఈ విధంగా చేస్తారు
  rationale: హీబ్రూ నిష్క్రియార్థాన్ని తెలుగులో సహజమైన అనిర్దిష్ట కర్త ప్రయోగంతో వ్యక్తం చేస్తుంది; రాజాజ్ఞ వంటి సూత్రవాక్య ధోరణిని నిలుపుతుంది.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: ఘనపరచాలని కోరుకుంటాడో
  rationale: חפץ లోని కోరిక లేదా ఇష్ట భావాన్నీ, יקר లోని గౌరవప్రదానం భావాన్నీ సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
