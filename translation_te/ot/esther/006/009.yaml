- from: ఆ వస్త్రాన్నీ గుర్రాన్నీ రాజు ఉన్నతాధికారుల్లో ఒకరి చేతికి అప్పగించాలి. రాజు ఘనపరచాలని కోరుకునే వ్యక్తికి వారు ఆ వస్త్రాన్ని తొడిగించి, అతన్ని ఆ గుర్రం మీద ఎక్కించి, నగర కూడలి గుండా తీసుకువెళ్లాలి. అతని ముందు, ‘రాజు ఘనపరచాలని కోరుకునే వ్యక్తికి ఈ విధంగా చేస్తారు!’ అని ప్రకటించాలి.
  to: ఆ వస్త్రాన్నీ గుర్రాన్నీ రాజు ప్రముఖ అధికారులలో ఒకరి చేతికి అప్పగించాలి. అతడు రాజు ఘనపరచాలని కోరుకునే వ్యక్తికి ఆ వస్త్రాన్ని తొడిగించి, అతన్ని ఆ గుర్రం మీద ఎక్కించాలి. నగర బహిరంగ కూడలిలో అతని ముందుగా, ‘రాజు ఘనపరచాలని కోరుకునే వ్యక్తికి ఇలా చేయబడుతుంది!’ అని ప్రకటించాలి.
  rationale: మూలంలో లేని ‘తీసుకువెళ్లాలి’ను తొలగించాం. ఒక రాజాధికారి చేతికి అప్పగించబడిన వస్త్రం, గుర్రం ద్వారా జరిగే చర్యలను తెలుగులో స్పష్టమైన ఏకవచన సూచనతో వ్యక్తపరిచాం. ప్రకటనలోని మూలపు సాధారణ/ప్రకటనాత్మక క్రియను ‘ఇలా చేయబడుతుంది’తో నిలిపాం.
