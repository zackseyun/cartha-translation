  text: וְ/נָת֨וֹן הַ/לְּב֜וּשׁ וְ/הַ/סּ֗וּס עַל יַד אִ֞ישׁ מִ/שָּׂרֵ֤י הַ/מֶּ֨לֶךְ֙ הַֽ/פַּרְתְּמִ֔ים וְ/הִלְבִּ֨ישׁוּ֙ אֶת הָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֣ץ בִּֽ/יקָר֑/וֹ וְ/הִרְכִּיבֻ֤/הוּ עַל הַ/סּוּס֙ בִּ/רְח֣וֹב הָ/עִ֔יר וְ/קָרְא֣וּ לְ/פָנָ֔י/ו כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/009.yaml
  text: And let the robe and the horse be entrusted to the hand of one of the king’s noble officials, and let them clothe the man whom the king delights to honor, and let them mount him on the horse through the open square of the city, and proclaim before him, ‘Thus shall it be done for the man whom the king delights to honor.’
translation:
  language: te
  text: ఆ వస్త్రాన్నీ గుర్రాన్నీ రాజు ప్రముఖ అధికారులలో ఒకరి చేతికి అప్పగించాలి. అతడు రాజు ఘనపరచాలని కోరుకునే వ్యక్తికి ఆ వస్త్రాన్ని తొడిగించి, అతన్ని ఆ గుర్రం మీద ఎక్కించాలి. నగర బహిరంగ కూడలిలో అతని ముందుగా, ‘రాజు ఘనపరచాలని కోరుకునే వ్యక్తికి ఇలా చేయబడుతుంది!’ అని ప్రకటించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפַּרְתְּמִים
  choice: ఉన్నతాధికారులు
  rationale: ఈ పర్షియన్ మూలపదం రాజసభలోని ఉన్నత స్థాయి ప్రభువులను లేదా అధికారులను సూచిస్తుంది; ఆధునిక తెలుగులో హోదా, గౌరవం రెండింటినీ సహజంగా తెలియజేయడానికి ఈ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: ఘనపరచాలని కోరుకునే
  rationale: חָפֵץ అనేది ఇష్టపడటం లేదా కోరుకోవడాన్ని, יְקָר/יְקָרוֹ అనేది గౌరవం లేదా ఘనతను సూచిస్తుంది. రాజు ఉద్దేశపూర్వకంగా గౌరవం అనుగ్రహించడాన్ని ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּרְחוֹב הָעִיר
  choice: నగర కూడలి గుండా
  rationale: רְחוֹב ఇక్కడ సాధారణ వీధికన్నా నగరంలోని బహిరంగ ప్రదేశం లేదా విశాల కూడలిని సూచిస్తుంది; ఊరేగింపు జరిగే ప్రజా ప్రదేశ భావాన్ని నిలుపుతుంది.
- source_word: וְהִרְכִּיבֻהוּ עַל־הַסּוּס
  choice: అతన్ని ఆ గుర్రం మీద ఎక్కించి … తీసుకువెళ్లాలి
  rationale: హిఫిల్ రూపం అతన్ని గుర్రం ఎక్కించి దానిపై ప్రయాణింపజేయడాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ఊరేగింపు భావాన్ని సహజంగా వ్యక్తం చేయడానికి ‘తీసుకువెళ్లాలి’తో కలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభ సందర్భానికి తగిన గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని వరుస ఆజ్ఞార్థక భావాన్ని ‘చేయాలి’ నిర్మాణాలతో నిలిపాం.
