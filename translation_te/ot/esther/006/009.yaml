    rationale: హీబ్రూ క్రియారూపాల బహువచనాన్ని తెలుగులో తప్పనిసరిగా వ్యక్తిగత బహువచనంగా చూపాల్సిన అవసరం లేదు. కర్తను పునరుక్తి చేయకుండా క్రియలను అనుసంధానించడం సహజంగా ఉంటుంది.
