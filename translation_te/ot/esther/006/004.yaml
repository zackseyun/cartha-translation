  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ מִ֣י בֶ/חָצֵ֑ר וְ/הָמָ֣ן בָּ֗א לַ/חֲצַ֤ר בֵּית הַ/מֶּ֨לֶךְ֙ הַ/חִ֣יצוֹנָ֔ה לֵ/אמֹ֣ר לַ/מֶּ֔לֶךְ לִ/תְלוֹת֙ אֶֽת מָרְדֳּכַ֔י עַל הָ/עֵ֖ץ אֲשֶׁר הֵכִ֥ין לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/004.yaml
  text: And the king said[a], “Who is in the court?” Now Haman had come into the outer court of the king’s palace to speak to the king about hanging Mordecai on the gallows that he had prepared for him.
translation:
  language: te
  text: అప్పుడు రాజు, “ప్రాంగణంలో ఎవరు ఉన్నారు?” అని అడిగాడు. హామాను అప్పటికే రాజభవనం వెలుపలి ప్రాంగణానికి వచ్చాడు; తాను మొర్దెకై కోసం సిద్ధం చేసిన కొయ్యపై[a] మొర్దెకైని వేలాడదీయడం గురించి రాజుతో మాట్లాడడానికి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం עֵץ అక్షరార్థంగా ‘చెట్టు’ లేదా ‘కలప/కొయ్య’ అని అర్థం. ఇక్కడ అది మొర్దెకై కోసం హామాను సిద్ధం చేసిన శిక్షా చెక్క నిర్మాణాన్ని సూచిస్తుంది; దాని ఖచ్చిత రూపాన్ని ఈ పదం నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶחָצֵר / לַחֲצַר
  choice: ప్రాంగణంలో / ప్రాంగణంలోకి
  rationale: חָצֵר అంటే చుట్టూ ఆవరించబడిన ప్రాంగణం. రాజభవన సందర్భంలో ‘ప్రాంగణం’ సహజంగా ఉండి, పునరుక్త మూలపదాన్ని నిలుపుతుంది.
- source_word: וְהָמָן בָּא
  choice: హామాను అప్పటికే ... వచ్చాడు
  rationale: ఈ వాక్యభాగం రాజు ప్రశ్నించిన సమయానికి హామాను వచ్చి ఉన్నాడనే నేపథ్యాన్ని ఇస్తుంది; ‘అప్పటికే’ ఆ కథన సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనం
  rationale: అక్షరార్థంగా ‘రాజు ఇల్లు’; రాజసందర్భంలో ‘రాజభవనం’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: הַחִיצוֹנָה
  choice: వెలుపలి
  rationale: ఇది లోపలి ప్రాంగణం నుండి భేదాన్ని చూపుతుంది; ‘వెలుపలి’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: לֵאמֹר לַמֶּלֶךְ
  choice: రాజుతో మాట్లాడడానికి
  rationale: ఇక్కడ אמר క్రియారూపం రాజును కలిసి విషయం చెప్పాలనే ఉద్దేశాన్ని సూచిస్తుంది; ‘మాట్లాడడానికి’ దాని విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לִתְלוֹת
  choice: వేలాడదీయడం గురించి
  rationale: ఇది రాజుతో మాట్లాడటంలోని విషయాన్ని సూచిస్తుంది. ‘వేలాడదీయడం గురించి’ తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండి చర్యను స్పష్టంగా ఉంచుతుంది.
- source_word: הָעֵץ
  choice: కొయ్య
  rationale: עֵץ యొక్క ప్రాథమిక పరిధి ‘చెట్టు/కలప/కొయ్య’. మరణశిక్ష నిర్మాణపు ఖచ్చిత రూపాన్ని మూలం నిర్దేశించనందున ‘ఉరికంబం’ వంటి నిర్దిష్ట రూపాన్ని దిగుమతి చేయకుండా ‘కొయ్య’ను ఎంచి, పాదటిప్పణిలో సందర్భాన్ని వివరించాం.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: మొర్దెకై కోసం తాను సిద్ధం చేసిన
  rationale: సందర్భంలో לוֹ సహజంగా మొర్దెకైని సూచిస్తుంది. తెలుగులో అస్పష్టత రాకుండా పేరును పునరుక్తం చేసి, సిద్ధపరచినవాడు హామానే అని ‘తాను’ ద్వారా తెలియజేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ కథన నేపథ్యాన్ని ‘అప్పటికే’తో సహజంగా వ్యక్తం చేశాం. עֵץ సూచించే శిక్షా నిర్మాణం రూపాన్ని అనవసరంగా నిర్ధారించకుండా మూలంలోని విస్తృతతను పాదటిప్పణితో నిలిపాం.
