  source_fidelity: మూల హీబ్రూ వాక్యంలోని రాజు ప్రశ్న, హామాను అప్పటికే వెలుపలి ప్రాంగణానికి రావడం, రాజుతో మాట్లాడాలనే ఉద్దేశం, మొర్దెకై కోసం సిద్ధం చేసిన עֵץ మీద అతనిని వేలాడదీయాలనే విషయం అన్నీ ముసాయిదాలో ఉన్నాయి. అయితే “కొయ్యపై అతన్ని” అనే పదక్రమం తెలుగులో అనవసరమైన సూచన-అస్పష్టతను, కొంత అసహజత్వాన్ని కలిగిస్తుంది. మొర్దెకైని నేరుగా క్రియకు కర్మగా ఉంచడం మూలార్థాన్ని మరింత స్పష్టంగా ఇస్తుంది.
  naturalness: “మొర్దెకై కోసం తాను సిద్ధం చేసిన కొయ్యపై అతన్ని వేలాడదీయడం” కంటే “తాను మొర్దెకై కోసం సిద్ధం చేసిన కొయ్యపై మొర్దెకైని వేలాడదీయడం” సహజంగా, స్పష్టంగా ఉంటుంది. పాదటిప్పణిలోని “వేలాడదీయడానికి లేదా శరీరాన్ని కొయ్యపై వేలాడదీయడానికి/గుచ్చి నిలబెట్టడానికి” అనే నిర్మాణం పునరుక్తితో కూడి ఉంది; దానిని సంక్షిప్తంగా, మూల పదం నిర్దిష్టతను అతిగా నిర్ణయించకుండా మార్చాలి.
  terminology: ‘ప్రాంగణం,’ ‘రాజభవనం,’ ‘వెలుపలి,’ ‘హామాను,’ ‘మొర్దెకై’ సరైన ఆధునిక ప్రామాణిక తెలుగు పదాలు. עֵץ‌కు ప్రధాన పాఠంలో ‘కొయ్య’ను ఉంచడం మూలపదంలోని విస్తృతతను కాపాడుతుంది; పాదటిప్పణి అది శిక్ష కోసం సిద్ధం చేసిన చెక్క నిర్మాణమని, దాని ఖచ్చిత రూపం తెలియదని తెలియజేయాలి.
