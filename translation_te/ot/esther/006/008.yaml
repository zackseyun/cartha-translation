id: EST.6.8
reference: Esther 6:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יָבִ֨יאוּ֙ לְב֣וּשׁ מַלְכ֔וּת אֲשֶׁ֥ר לָֽבַשׁ בּ֖/וֹ הַ/מֶּ֑לֶךְ וְ/ס֗וּס אֲשֶׁ֨ר רָכַ֤ב עָלָי/ו֙ הַ/מֶּ֔לֶךְ וַ/אֲשֶׁ֥ר נִתַּ֛ן כֶּ֥תֶר מַלְכ֖וּת בְּ/רֹאשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/008.yaml
  text: Let them bring a royal robe that the king has worn[a], and a horse on which the king has ridden, and on whose head a royal crown has been placed.
translation:
  language: te
  text: రాజు ధరించిన రాజవస్త్రాన్నీ, రాజు స్వారీ చేసిన, దాని తలపై రాజకిరీటం ఉంచబడిన గుర్రాన్నీ తీసుకురావాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “దాని తలపై రాజకిరీటం ఉంచబడినది.” ఇక్కడి సర్వనామం సహజంగా గుర్రాన్ని సూచిస్తుంది; అయితే కొందరు దానిని రాజును సూచించేదిగా అర్థం చేసుకున్నారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָבִיאוּ
  choice: తీసుకురావాలి
  rationale: హిఫిల్ అసంపూర్ణ క్రియ ఇక్కడ ప్రత్యక్ష ప్రసంగంలో ఆజ్ఞాత్మక సూచనను వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ‘తీసుకురావాలి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לְבוּשׁ מַלְכוּת
  choice: రాజవస్త్రం
  rationale: ఈ నిర్మాణ పదబంధం రాజత్వానికి సంబంధించిన ప్రత్యేక వస్త్రాన్ని సూచిస్తుంది; ‘రాజవస్త్రం’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: אֲשֶׁר לָבַשׁ בּוֹ הַמֶּלֶךְ
  choice: రాజు ధరించిన
  rationale: వస్త్రాన్ని రాజు స్వయంగా ధరించాడనే సంబంధవాక్య భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְסוּס
  choice: గుర్రాన్ని
  rationale: రెండవ వస్తువును పరిచయం చేస్తుంది; తరువాతి సంబంధవాక్యం దానిని నిర్దిష్టం చేస్తున్నందున తెలుగులో కర్మరూపం సహజం.
- source_word: אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ
  choice: రాజు స్వారీ చేసిన
  rationale: రాజు ఆ గుర్రంపై ఎక్కి ప్రయాణించాడనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: וַאֲשֶׁר נִתַּן
  choice: ఉంచబడి ఉండాలి
  rationale: హీబ్రూ నిష్క్రియ రూపంలోని ఉంచడం/పెట్టడం భావాన్ని నిలుపుతూ, కోరబడుతున్న గుర్రానికి ఉండవలసిన లక్షణంగా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כֶּתֶר מַלְכוּת
  choice: రాజకిరీటం
  rationale: రాజత్వానికి సంబంధించిన కిరీటాన్ని సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: בְּרֹאשׁוֹ
  choice: ఆ గుర్రం తలపై
  rationale: సమీప వ్యాకరణ సంబంధం ప్రకారం ఏకవచన సర్వనామం సహజంగా గుర్రాన్నే సూచిస్తుంది; తెలుగులో సందిగ్ధత లేకుండా ప్రధాన పఠనాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: בְּרֹאשׁוֹ లోని సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: గుర్రాన్ని సూచిస్తుంది
  alternative: రాజును సూచిస్తుంది
  rationale: సమీప పూర్వపదం ‘గుర్రం’; వాక్య నిర్మాణం కూడా గుర్రానికి సంబంధించిన మరొక లక్షణాన్ని కొనసాగిస్తుంది. అయితే కొందరు దానిని రాజుకు అన్వయించినందున ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణిలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే రాజదర్బారు సందర్భానికి తగిన గౌరవప్రద శైలి పాటించబడింది.
