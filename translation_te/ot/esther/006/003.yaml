source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַֽה נַּעֲשָׂ֞ה יְקָ֧ר וּ/גְדוּלָּ֛ה לְ/מָרְדֳּכַ֖י עַל זֶ֑ה וַ/יֹּ֨אמְר֜וּ נַעֲרֵ֤י הַ/מֶּ֨לֶךְ֙ מְשָׁ֣רְתָ֔י/ו לֹא נַעֲשָׂ֥ה עִמּ֖/וֹ דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/003.yaml
  text: Then the king said[a], “What honor and greatness has been bestowed on Mordecai for this?” The king’s young men who attended him said, “Nothing has been done for him.”
translation:
  language: te
  text: అప్పుడు రాజు, “మొర్దెకైకి దీని నిమిత్తం ఏ ఘనతా గొప్పతనమూ ఇవ్వబడింది[a]?” అని అడిగాడు. రాజుకు పరిచర్య చేసే యువకులు, “మొర్దెకై కోసం ఏమీ చేయలేదు” అని చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, అక్షరార్థంగా, “దీనివల్ల మొర్దెకైకి ఏ ఘనతా గొప్పతనమూ చేయబడింది?”
    reason: మూలంలోని కర్మణి ప్రయోగాన్ని మరియు עַל זֶה అనే కారణసూచక పదబంధాన్ని మరింత సన్నిహితంగా ప్రతిబింబించే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: מַה נַּעֲשָׂה
  choice: ఎలాంటి ... కలిగించారు
  rationale: עשה యొక్క నిఫాల్ రూపం జరిగిన లేదా చేయబడిన కార్యాన్ని ప్రశ్నిస్తుంది. ‘ఘనత, గొప్పతనం కలిగించారు’ అనేది తెలుగులో సహజంగా ఉండి మూలంలోని కర్మణి భావాన్ని సందర్భానుగుణంగా వ్యక్తపరుస్తుంది.
- source_word: יְקָר
  choice: ఘనత
  rationale: రాజసభ సందర్భంలో ఇది వస్తువుల విలువను కాక, వ్యక్తికి ఇచ్చే గౌరవాన్ని సూచిస్తుంది. ‘ఘనత’ ఆ ప్రజా గౌరవ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּגְדוּלָּה
  choice: గొప్పతనం
  rationale: మూలపదంలోని ‘greatness’ భావాన్ని నేరుగా నిలుపుతూ, ముందున్న ‘ఘనత’తో కలిసి ఉన్న ఉన్నత గుర్తింపును సూచిస్తుంది.
- source_word: לְמָרְדֳּכַי
  choice: మొర్దెకైకి
  rationale: లామెద్ ఇక్కడ పరోక్ష కర్మను లేదా లబ్ధిదారుని సూచిస్తుంది; తెలుగు సంప్రదాన విభక్తి దీనిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַל זֶה
  choice: దీనికి ప్రతిఫలంగా
  rationale: ముందటి సందర్భంలో మొర్దెకై చేసిన కార్యాన్ని తిరిగి సూచిస్తూ దాని కారణంగా రావలసిన గుర్తింపు భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: రాజు యువకులు
  rationale: נערים యొక్క ప్రాథమిక అర్థమైన ‘యువకులు’ను నిలుపుతుంది; వారి సేవా పాత్రను తరువాతి పదబంధం తెలియజేస్తుంది.
- source_word: מְשָׁרְתָיו
  choice: అతనికి పరిచర్య చేసే
  rationale: שרת వ్యక్తిగతంగా సేవ చేయడం లేదా సమక్షంలో పరిచర్య చేయడాన్ని సూచిస్తుంది. ‘పరిచర్య చేసే’ రాజసభ సేవా భావాన్ని నిలుపుతుంది.
- source_word: לֹא נַעֲשָׂה עִמּוֹ דָּבָר
  choice: అతని కోసం ఏమీ చేయలేదు
  rationale: అతని పక్షాన ఎలాంటి చర్యా తీసుకోలేదనే హీబ్రూ నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
