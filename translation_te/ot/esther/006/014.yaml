  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కారణార్థక క్రియకు ఉన్న స్వల్ప అస్పష్టతను ప్రధాన పాఠంలో ఒక సాధ్యమైన అర్థంతో ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
