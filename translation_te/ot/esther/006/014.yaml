  text: עוֹדָ/ם֙ מְדַבְּרִ֣ים עִמּ֔/וֹ וְ/סָרִיסֵ֥י הַ/מֶּ֖לֶךְ הִגִּ֑יעוּ וַ/יַּבְהִ֨לוּ֙ לְ/הָבִ֣יא אֶת הָמָ֔ן אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשְׂתָ֥ה אֶסְתֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/014.yaml
  text: While they were still speaking with him[b][a], the king’s eunuchs arrived and hurried to bring Haman to the banquet that Esther had prepared.
translation:
  language: te
  text: వారు ఇంకా అతనితో మాట్లాడుతుండగానే, రాజు నపుంసకులు[a] వచ్చి, ఎస్తేరు సిద్ధం చేసిన విందుకు హామానును తీసుకురావడానికి త్వరపడ్డారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజు అధికారులు.” హీబ్రూ పదం నపుంసకులను గానీ రాజసభ అధికారులను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “హామానును తీసుకురావడానికి ఆతురపడ్డారు” లేదా “త్వరగా తీసుకువచ్చారు.” హీబ్రూ క్రియ అత్యవసరమైన వేగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדָם מְדַבְּרִים עִמּוֹ
  choice: వారు ఇంకా అతనితో మాట్లాడుతుండగానే
  rationale: కొనసాగుతున్న సంభాషణ పూర్తికాకముందే తదుపరి సంఘటన జరిగిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; עִמּוֹ లోని ‘అతనితో’ అనే సంబంధాన్ని నిలుపుతుంది.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: రాజు నపుంసకులు
  rationale: סָרִיס యొక్క ప్రత్యక్షమైన సాధారణ అర్థాన్ని ప్రధాన పాఠంలో నిలుపుతూ, రాజసభ అధికారులనే విస్తృత అర్థసాధ్యతను పాదసూచికలో ఇస్తుంది.
- source_word: הִגִּיעוּ
  choice: వచ్చి
  rationale: సంఘటనా స్థలానికి చేరుకోవడాన్ని తెలుగులో సహజమైన కథన శైలిలో తెలియజేస్తుంది.
- source_word: וַיְבַהִלוּ לְהָבִיא אֶת־הָמָן
  choice: హామానును తీసుకువెళ్లడానికి అతన్ని తొందరపెట్టారు
  rationale: 'בהל హిఫీల్ రూపంలోని కారణార్థక ఆతురతను నిలుపుతుంది: అధికారులు తాము మాత్రమే త్వరపడడం కాక, హామాను వెంటనే బయలుదేరేలా తొందరపెట్టారు. గమ్యస్థానానికి అతన్ని తీసుకెళ్లడం కావడంతో తెలుగు సందర్భంలో ‘తీసుకువెళ్లడానికి’ సహజం.'
- source_word: הַמִּשְׁתֶּה
  choice: విందు
  rationale: రాజసభ సందర్భంలోని భోజన విందును సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: ఎస్తేరు సిద్ధం చేసిన
  rationale: עשה యొక్క అక్షరార్థమైన ‘చేసిన’ కంటే విందు సందర్భంలో ‘సిద్ధం చేసిన’ అనేది సహజమైన తెలుగు ప్రయోగం; విందు అప్పటికే ఏర్పాటు చేయబడిందని సూచిస్తుంది.
