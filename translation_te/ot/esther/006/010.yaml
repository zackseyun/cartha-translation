source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לְ/הָמָ֗ן מַ֠הֵר קַ֣ח אֶת הַ/לְּב֤וּשׁ וְ/אֶת הַ/סּוּס֙ כַּ/אֲשֶׁ֣ר דִּבַּ֔רְתָּ וַֽ/עֲשֵׂה כֵן֙ לְ/מָרְדֳּכַ֣י הַ/יְּהוּדִ֔י הַ/יּוֹשֵׁ֖ב בְּ/שַׁ֣עַר הַ/מֶּ֑לֶךְ אַל תַּפֵּ֣ל דָּבָ֔ר מִ/כֹּ֖ל אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/010.yaml
  text: Then the king said to Haman[a], “Hurry, take the robe and the horse, just as you have said, and do so for Mordecai the Jew, who sits at the king’s gate[b]. Leave out nothing from all that you have said.”
translation:
  language: te
  text: అప్పుడు రాజు హామానుతో, “త్వరపడు; నీవు చెప్పినట్లే ఆ వస్త్రాన్ని, ఆ గుర్రాన్ని తీసుకొని, రాజు ద్వారం వద్ద కూర్చునే యూదుడైన మొర్దెకైకి అలాగే చేయి. నీవు చెప్పిన వాటన్నిటిలో ఏదీ విడిచిపెట్టవద్దు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నీవు చెప్పిన వాటన్నిటిలో ఏదైనా విషయం పడనివ్వకు.” ఇది ఏదీ మానవద్దని చెప్పే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: త్వరగా
  rationale: తక్షణ చర్యను కోరే ఆజ్ఞార్థక క్రియావిశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: קַח
  choice: తీసుకొని
  rationale: లָקַח్ క్రియ యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతూ, తరువాతి ఆజ్ఞతో సహజంగా అనుసంధానిస్తుంది.
- source_word: הַלְּבוּשׁ
  choice: ఆ వస్త్రాన్ని
  rationale: ముందటి వచనంలో పేర్కొన్న రాజవస్త్రాన్ని నిర్దిష్టంగా సూచిస్తుంది; మూలంలో ఈ వచనంలో ‘రాజ’ అనే విశేషణం లేనందున దాన్ని చేర్చలేదు.
- source_word: הַסּוּס
  choice: ఆ గుర్రాన్ని
  rationale: మూలంలోని నిర్దిష్ట నామవాచకాన్ని నేరుగా అందిస్తుంది; సందర్భంలో అది రాజుగారి గుర్రమైనా, ఇక్కడ లేని విశేషణాన్ని చేర్చదు.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: నీవు చెప్పినట్లే
  rationale: హామాను చేసిన ప్రతిపాదననే యథాతథంగా అమలు చేయమనే రాజు మాటలోని వ్యంగ్యాత్మక బలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַעֲשֵׂה כֵן
  choice: అలాగే చేయి
  rationale: ఆజ్ఞార్థక రూపాన్నీ, ముందుగా చెప్పిన ప్రకారమే చేయాలనే כֵן భావాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְמָרְדֳּכַי
  choice: మొర్దెకైకి
  rationale: లబ్ధిదారుని సూచించే לְ ఉపసర్గను తెలుగు సంప్రదాన విభక్తితో సహజంగా అందిస్తుంది.
- source_word: הַיְּהוּדִי
  choice: యూదుడైన
  rationale: కథలో మొర్దెకై యొక్క జాతి-మత గుర్తింపును సూచించే సాధారణ తెలుగు పదం; కేవలం భౌగోళిక ‘యూదయవాసి’ భావానికి పరిమితం చేయదు.
- source_word: הַיּוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: రాజద్వారం దగ్గర కూర్చునే
  rationale: వర్తమాన కృదంతం సూచించే స్థిరమైన/పరిచిత స్థానాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘ద్వారం’ ఇక్కడ రాజప్రాసాద ప్రవేశ ప్రాంతాన్ని సూచించగలదు.
- source_word: אַל תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ
  choice: నీవు చెప్పిన వాటన్నిటిలో ఒక్కటి కూడా విడిచిపెట్టవద్దు
  rationale: ‘ఏదీ పడనివ్వకు’ అనే హీబ్రూ నుడికారాన్ని దాని సందర్భార్థమైన ‘ఏదీ మానవద్దు’గా స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని సంక్షిప్త ఆజ్ఞాక్రమం, అత్యవసరత, హామాను మాటలనే మొర్దెకై కోసం అమలు చేయమనే కథన వ్యంగ్యం నిలుపబడ్డాయి. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
