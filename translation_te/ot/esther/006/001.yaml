source:
  edition: WLC
  text: בַּ/לַּ֣יְלָה הַ/ה֔וּא נָדְדָ֖ה שְׁנַ֣ת הַ/מֶּ֑לֶךְ וַ/יֹּ֗אמֶר לְ/הָבִ֞יא אֶת סֵ֤פֶר הַ/זִּכְרֹנוֹת֙ דִּבְרֵ֣י הַ/יָּמִ֔ים וַ/יִּהְי֥וּ נִקְרָאִ֖ים לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/001.yaml
  text: On that night the king could not sleep[a], so he ordered the book of records, the chronicles, to be brought[b], and they were read before the king.
translation:
  language: te
  text: ఆ రాత్రి రాజుకు నిద్ర పట్టలేదు[a]. కాబట్టి జ్ఞాపకాల గ్రంథమైన దినవృత్తాంతాల పుస్తకాన్ని తెప్పించమని అతడు ఆజ్ఞాపించాడు[b]. వాటిని రాజు సమక్షంలో చదివారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రాజు నిద్ర పారిపోయింది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నమోదుల గ్రంథాన్ని, అంటే దినవృత్తాంతాలను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: నిర్దిష్టమైన ఆ రాత్రిని సూచించే కాలవాచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נָדְדָה שְׁנַת הַמֶּלֶךְ
  choice: రాజుకు నిద్ర పట్టలేదు
  rationale: అక్షరార్థంగా ‘రాజు నిద్ర తొలగిపోయింది/దూరమైంది’; భావాన్ని సహజమైన తెలుగులో స్పష్టంగా అందిస్తుంది. మూలంలోని రూపకాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: וַיֹּאמֶר
  choice: ఆజ్ఞాపించాడు
  rationale: రూపరీత్యా ‘అన్నాడు’ అయినా, ఇక్కడ సేవకులకు ఇచ్చిన ఆదేశాన్ని పరిచయం చేస్తుంది.
- source_word: לְהָבִיא
  choice: తీసుకురమ్మని
  rationale: ఆజ్ఞలోని కార్యాన్ని తెలుగులో సహజమైన ఉద్ధరణేతర ఆదేశ నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: סֵפֶר הַזִּכְרֹנוֹת דִּבְרֵי הַיָּמִים
  choice: జ్ఞాపకార్థంగా నమోదు చేసిన రాజవృత్తాంతాల గ్రంథం
  rationale: ‘జ్ఞాపకాల/నమోదుల గ్రంథం’ మరియు దానికి వివరణగా ఉన్న ‘దినవృత్తాంతాలు’ అనే రెండు భాగాల భావాన్ని రాజసభ భాండాగార సందర్భంలో స్పష్టంగా కలుపుతుంది.
- source_word: וַיִּהְיוּ נִקְרָאִים
  choice: దాన్ని ... చదివారు
  rationale: హీబ్రూలోని నిష్క్రియాత్మక పఠన చర్యను తెలుగులో సహజమైన అనిర్దిష్ట కర్త నిర్మాణంతో అందిస్తుంది; ‘దాన్ని’ గ్రంథంలోని నమోదులను సమష్టిగా సూచిస్తుంది.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: రాజు సమక్షంలో
  rationale: ‘రాజు ఎదుట/సన్నిధిలో’ అనే మూలార్థాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
