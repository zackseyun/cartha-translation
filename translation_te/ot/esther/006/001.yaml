translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా ఉండేలా, రాజసభ కథనానికి తగిన గౌరవప్రదమైన శైలిని పాటించాం. మూలంలోని రెండు భాండాగార పదబంధాల సంబంధాన్ని ప్రధాన పాఠంలో సహజంగా తెలిపి, మరింత రూపసన్నిహిత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
