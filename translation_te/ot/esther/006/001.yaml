- from: ఆ రాత్రి రాజుకు నిద్ర పట్టలేదు[a]. కాబట్టి జ్ఞాపకార్థంగా నమోదు చేసిన రాజవృత్తాంతాల గ్రంథాన్ని తీసుకురమ్మని అతడు ఆజ్ఞాపించాడు[b]. దాన్ని రాజు సమక్షంలో చదివారు.
  to: ఆ రాత్రి రాజుకు నిద్ర పట్టలేదు[a]. కాబట్టి జ్ఞాపకాల గ్రంథమైన దినవృత్తాంతాల పుస్తకాన్ని తెప్పించమని అతడు ఆజ్ఞాపించాడు[b]. వాటిని రాజు సమక్షంలో చదివారు.
