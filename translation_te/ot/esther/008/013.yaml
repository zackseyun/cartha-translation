id: EST.8.13
reference: Esther 8:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָ/עַמִּ֑ים וְ/לִ/הְי֨וֹת ה/יהודיים עתודים לַ/יּ֣וֹם הַ/זֶּ֔ה לְ/הִנָּקֵ֖ם מֵ/אֹיְבֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/013.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made public to all the peoples[d][c][b], and so that the Jews would be ready on that day to avenge themselves on their enemies.
translation:
  language: te
  text: వ్రాతపూర్వక ఆజ్ఞ ప్రతిని ప్రతి ప్రాంతంలోనూ[a] చట్టంగా జారీ చేయాలి; దానిని అన్ని ప్రజలకూ బహిరంగపరచాలి[b]; యూదులు ఆ రోజుకు[c] తమ శత్రువుల మీద ప్రతీకారం తీర్చుకోవడానికి[d] సిద్ధంగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ప్రతి ప్రాంతం, ప్రాంతంలో’; హీబ్రూ పునరుక్తి ‘ఒక్కొక్క ప్రాంతంలో’ అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘బహిరంగంగా ప్రదర్శించాలి’ లేదా ‘ప్రచురించాలి.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ అక్షరార్థంగా ‘ఈ రోజుకు’; ఇది నిర్ణయించబడిన తేదీని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘తమ శత్రువుల మీద పగ తీర్చుకోవడానికి.’ కొన్ని అనువాదాలు సందర్భాన్ని బట్టి ‘తమను తాము కాపాడుకోవడానికి’ అని ఇస్తాయి; అయితే హీబ్రూ క్రియ ప్రత్యేకంగా ప్రతీకారం తీర్చుకోవడాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: ఆ వ్రాతపూర్వక ఆజ్ఞ ప్రతి
  rationale: పర్షియన్ మూలం గల פַּתְשֶׁגֶן అధికారిక పత్రపు ప్రతిని సూచిస్తుంది; הַכְּתָב అక్షరార్థంగా ‘వ్రాత/పత్రం’ అయినా, రాజాజ్ఞ సందర్భంలో ‘వ్రాతపూర్వక ఆజ్ఞ’ సహజంగా దాని పరిపాలనా స్వభావాన్ని తెలియజేస్తుంది.
- source_word: לְהִנָּתֵן דָּת
  choice: చట్టంగా జారీ చేసి
  rationale: దీనిలో అధికారిక ఆదేశాన్ని చట్టబద్ధంగా వెలువరించే భావం ఉంది. ‘జారీ చేసి’ పరిపాలనా సందర్భానికి సహజమైన ఆధునిక తెలుగు.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: ప్రతి రాష్ట్రంలోనూ
  rationale: హీబ్రూలో ‘రాష్ట్రం రాష్ట్రం’ అనే పునరుక్తి పంపిణీ భావాన్ని—ఒక్కొక్క రాష్ట్రంలో—తెలియజేస్తుంది. తెలుగులో ‘ప్రతి…లోనూ’ అదే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: ప్రజలందరికీ బహిరంగంగా ప్రకటించాలి
  rationale: גָּלוּי అంటే వెల్లడైనది లేదా బహిరంగమైనది. రాజశాసన సందర్భంలో ‘బహిరంగంగా ప్రకటించాలి’ దాని ప్రచురణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; עַמִּים సామ్రాజ్యంలోని వివిధ ప్రజాసమూహాలను సూచిస్తుంది.
- source_word: הַיְּהוּדִים עֲתוּדִים
  choice: యూదులు … సిద్ధంగా ఉండాలి
  rationale: עֲתוּדִים అంటే సిద్ధంగా లేదా సంసిద్ధంగా ఉన్నవారు. ‘సిద్ధంగా ఉండాలి’ ఉద్దేశ్యార్థక నిర్మాణంలో సహజంగా ఉంటుంది.
- source_word: לַיּוֹם הַזֶּה
  choice: ఆ రోజుకు
  rationale: అక్షరార్థంగా ‘ఈ రోజుకు’ అయినా, కథనంలో ముందుగా నిర్ణయించిన తేదీని సూచిస్తుంది. సిద్ధపడటంతో కలిపి ‘ఆ రోజుకు’ సహజంగా ఉంటుంది.
- source_word: לְהִנָּקֵם מֵאֹיְבֵיהֶם
  choice: తమ శత్రువుల మీద ప్రతీకారం తీర్చుకోవడానికి
  rationale: נקם నిఫాల్ రూపం తనకు జరిగిన దానికి ప్రతీకారం తీర్చుకోవడం అనే స్పష్టమైన భావాన్ని కలిగి ఉంది. ‘తమను తాము కాపాడుకోవడానికి’ అని అనువదించడం సందర్భానుసార వివరణ అవుతుంది గాని ఈ క్రియ యొక్క నేరుగా ఉన్న అర్థం కాదు.
theological_decisions:
- issue: హింసాత్మక న్యాయప్రతీకార భాషను మృదువుగా మార్చే అవకాశం
  choice: ప్రతీకారం తీర్చుకోవడానికి
  alternative: తమను తాము కాపాడుకోవడానికి
  rationale: మూలంలోని נקם కేవలం ఆత్మరక్షణను కాక ప్రతీకారం తీర్చుకోవడాన్ని స్పష్టంగా సూచిస్తుంది. విస్తృత సందర్భంలో ఆత్మరక్షణ ఉన్నప్పటికీ, ఈ వాక్యంలోని పదబలాన్ని అనువాదం తగ్గించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే పరిపాలనా శైలిని వాడాం. హీబ్రూ పంపిణీ పునరుక్తిని తెలుగులో సహజమైన ‘ప్రతి…లోనూ’గా అందించి, అక్షరరూపాన్ని పాదసూచికలో ఉంచాం. మూలంలోని ప్రతీకార భావాన్ని మృదువుగా మార్చలేదు.
