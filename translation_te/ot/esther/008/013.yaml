revisions:
- from: ఆ వ్రాతపూర్వక ఆజ్ఞ ప్రతిని ప్రతి రాష్ట్రంలోనూ[a] చట్టంగా జారీ చేసి, ప్రజలందరికీ బహిరంగంగా ప్రకటించాలి[b]; యూదులు ఆ రోజుకు[c] తమ శత్రువుల మీద ప్రతీకారం తీర్చుకోవడానికి[d] సిద్ధంగా ఉండాలి.
  to: వ్రాతపూర్వక ఆజ్ఞ ప్రతిని ప్రతి ప్రాంతంలోనూ[a] చట్టంగా జారీ చేయాలి; దానిని అన్ని ప్రజలకూ బహిరంగపరచాలి[b]; యూదులు ఆ రోజుకు[c] తమ శత్రువుల మీద ప్రతీకారం తీర్చుకోవడానికి[d] సిద్ధంగా ఉండాలి.
  rationale: స్వల్ప శైలీ, వ్యాకరణ సవరణలతో మూలంలోని అధికారిక-ప్రకటన నిర్మాణాన్ని మరింత స్పష్టంగా చేశాము. ‘ఆ’ను తొలగించాం; బహిరంగపరచాల్సింది ఆజ్ఞప్రతేనని స్పష్టం చేశాం; మరియు מְדִינָהకు చారిత్రకంగా తటస్థమైన ‘ప్రాంతం’ను వాడాం. అర్థం, ప్రతీకార భాష, మరియు పాదసూచికల ప్రత్యామ్నాయాలు మారలేదు.
