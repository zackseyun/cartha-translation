  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תּ֣וֹסֶף אֶסְתֵּ֗ר וַ/תְּדַבֵּר֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וַ/תִּפֹּ֖ל לִ/פְנֵ֣י רַגְלָ֑י/ו וַ/תֵּ֣בְךְּ וַ/תִּתְחַנֶּן ל֗/וֹ לְ/הַֽעֲבִיר֙ אֶת רָעַת֙ הָמָ֣ן הָֽ/אֲגָגִ֔י וְ/אֵת֙ מַֽחֲשַׁבְתּ֔/וֹ אֲשֶׁ֥ר חָשַׁ֖ב עַל הַ/יְּהוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/003.yaml
  text: Then Esther spoke again before the king. She fell before his feet[a], wept, and pleaded with him to avert the evil of Haman the Agagite and his scheme that he had devised against the Jews.
translation:
  language: te
  text: అప్పుడు ఎస్తేరు మళ్లీ రాజు సమక్షంలో మాట్లాడింది. ఆమె అతని పాదాల ఎదుట పడి, ఏడుస్తూ, అగాగీయుడైన హామాను చేసిన కీడును, యూదులకు వ్యతిరేకంగా అతడు పన్నిన పథకాన్ని తొలగించమని[a] అతనిని బతిమాలుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పక్కన పెట్టమని’ లేదా ‘దాటిపోయేలా చేయమని’; హామాను చేసిన కీడును, అతని పథకాన్ని అమలుకాకుండా తొలగించే భావం హీబ్రూ క్రియలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף ... וַתְּדַבֵּר
  choice: మళ్లీ ... మాట్లాడింది
  rationale: יסף తరువాత మరో క్రియ రావడం చర్య పునరావృతమైందని లేదా కొనసాగిందని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మళ్లీ మాట్లాడింది’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: రాజు సమక్షంలో
  rationale: ఇది రాజసభలో రాజు ఎదుట మాట్లాడడాన్ని సూచిస్తుంది; ‘సమక్షంలో’ గౌరవప్రదమైన సభా సందర్భాన్ని నిలుపుతుంది.
- source_word: וַתִּפֹּל לִפְנֵי רַגְלָיו
  choice: అతని పాదాల ఎదుట పడి
  rationale: ఈ పదబంధం శారీరకంగా సాగిలపడి వేడుకునే భంగిమను చిత్రిస్తుంది; మూలంలోని ‘పాదాల ఎదుట’ అనే రూపాన్ని నిలుపుతుంది.
- source_word: וַתֵּבְךְּ
  choice: ఏడుస్తూ
  rationale: בכה ఏడుపును సూచిస్తుంది; తరువాతి వేడుకోలుతో సహజంగా అనుసంధానించేందుకు తెలుగు అసమాపక క్రియారూపం వాడబడింది.
- source_word: וַתִּתְחַנֶּן לוֹ
  choice: అతనిని బతిమాలుకుంది
  rationale: హిత్పయేల్ రూపం దయ లేదా అనుగ్రహం కోసం తీవ్రమైన వినతిని సూచిస్తుంది; ‘బతిమాలుకుంది’ ఆ భావోద్వేగ, వినయపూర్వక బలాన్ని అందిస్తుంది.
- source_word: לְהַעֲבִיר
  choice: తొలగించమని
  rationale: עבר హిఫీల్ రూపం ‘దాటిపోయేలా చేయడం, తొలగించడం, పక్కన పెట్టడం’ అనే భావాలను కలిగి ఉంది. ఈ సందర్భంలో ‘తొలగించమని’ సహజమైన ప్రధాన అనువాదం; మూలంలోని విస్తృత భావాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: אֶת רָעַת הָמָן
  choice: హామాను చేసిన కీడును
  rationale: רָעָה కీడు, దుష్టత్వం లేదా హానిని సూచించగలదు. తరువాత ‘పథకం’ వేరుగా ఉన్నందున రెండింటినీ ఒకే ‘దుష్ట పథకం’గా కలపకుండా ‘కీడు’గా ఉంచబడింది.
- source_word: הָאֲגָגִי
  choice: అగాగీయుడైన
  rationale: హామానును గుర్తించే వంశీయ లేదా బిరుదాత్మక విశేషణంగా తెలుగు రూపాంతరం చేయబడింది.
- source_word: מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב
  choice: అతడు పన్నిన పథకాన్ని
  rationale: חשב నామ-క్రియా జోడీలోని ఉద్దేశపూర్వక ఆలోచన, కుట్ర భావాన్ని సహజ తెలుగులో ‘పన్నిన పథకం’ వ్యక్తం చేస్తుంది.
- source_word: עַל הַיְּהוּדִים
  choice: యూదులకు వ్యతిరేకంగా
  rationale: వైరపూరిత యోచన సందర్భంలో עַל లక్ష్యానికి వ్యతిరేక భావాన్ని ఇస్తుంది; దానిని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
