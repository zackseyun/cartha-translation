translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘కీడు’ మరియు ‘పథకం’ అనే రెండు వేర్వేరు మూలపదాల మధ్య తేడా నిలుపబడింది. పాదటిప్పణి గుర్తును దానికి సంబంధించిన ‘తొలగించమని’ అనే పదం వద్ద ఉంచబడింది.
