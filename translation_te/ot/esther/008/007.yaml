source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרֹשׁ֙ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה וּֽ/לְ/מָרְדֳּכַ֖י הַ/יְּהוּדִ֑י הִנֵּ֨ה בֵית הָמָ֜ן נָתַ֣תִּי לְ/אֶסְתֵּ֗ר וְ/אֹת/וֹ֙ תָּל֣וּ עַל הָ/עֵ֔ץ עַ֛ל אֲשֶׁר שָׁלַ֥ח יָד֖/וֹ ב/יהודיים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/007.yaml
  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
translation:
  language: te
  text: 'అప్పుడు అహష్వేరోషు రాజు ఎస్తేరు రాణితో, యూదుడైన మొర్దెకైతో ఇలా అన్నాడు: “ఇదిగో, హామాను ఇంటిని నేను ఎస్తేరుకు ఇచ్చాను. అతడు యూదుల మీద చెయ్యి చాపినందువల్ల అతన్ని కొయ్యపై[a] వేలాడదీశారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “చెట్టు/కొయ్యపై.” ఇక్కడ అది హామానును చంపడానికి ఉపయోగించిన వేలాడదీసే నిర్మాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: అహష్వేరోషు రాజు
  rationale: తెలుగులో వ్యక్తి పేరు తరువాత బిరుదు ఉంచడం సహజం; పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: ఎస్తేరు రాణితో
  rationale: హీబ్రూ గ్రహీతను సూచించే నిర్మాణాన్ని ‘తో ... అన్నాడు’ అనే సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తూ రాజబిరుదును నిలిపాం.
- source_word: וּלְמָרְדֳּכַי הַיְּהוּדִי
  choice: యూదుడైన మొర్దెకైతో
  rationale: הַיְּהוּדִי ఇక్కడ మొర్దెకై జాతి గుర్తింపును సూచిస్తుంది; ‘యూదుడైన’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే, చూపించే హీబ్రూ అవ్యయ బలాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בֵית הָמָן
  choice: హామాను ఇంటిని
  rationale: పదబద్ధంగా ‘హామాను ఇల్లు’; సందర్భంలో ఆస్తి/గృహసంపద భావం ఉండగలిగినా, మూలంలోని విస్తృతార్థాన్ని ‘ఇంటి’ అనే పదం కాపాడుతుంది.
- source_word: נָתַתִּי
  choice: నేను ... ఇచ్చాను
  rationale: పూర్తయిన రాజాజ్ఞాత్మక చర్యను తెలుగు భూతకాల రూపం సహజంగా తెలియజేస్తుంది; ‘నేను’ కర్తను ఉద్ఘాటిస్తుంది.
- source_word: וְאֹתוֹ תָּלוּ
  choice: అతన్ని ... వేలాడదీశారు
  rationale: హీబ్రూలో పేర్కొనని బహువచన కర్త ఉంది; తెలుగు అనిర్దిష్ట గౌరవ/బహువచన క్రియారూపం కర్తను అనవసరంగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: עַל הָעֵץ
  choice: కొయ్యపై
  rationale: עֵץ యొక్క ప్రాథమిక ‘చెట్టు/కొయ్య’ భావాన్ని నిలుపుతూ, సందర్భంలోని మరణదండన నిర్మాణాన్ని పాఠకుడు గ్రహించేలా పాదటిప్పణి ఇచ్చాం.
- source_word: עַל אֲשֶׁר
  choice: అందువల్ల
  rationale: ఈ నిర్మాణం శిక్షకు కారణాన్ని సూచిస్తుంది; తెలుగులో కారణ-ఫలిత సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁלַח יָדוֹ
  choice: చెయ్యి చాపిన
  rationale: శత్రుత్వ చర్యను సూచించే హీబ్రూ రూపకాన్ని పరిష్కరించకుండా, తెలుగులో అర్థమయ్యే విధంగా నిలిపాం.
- source_word: ביהודיים
  choice: యూదులకు విరోధంగా
  rationale: బేత్ ఉపసర్గ ఇక్కడ శత్రుత్వ దిశను సూచిస్తుంది; ‘విరోధంగా’ ఆ సంబంధాన్ని స్పష్టం చేస్తుంది.
