  source_fidelity: 'హీబ్రూ మూలానికి అనువాదం ప్రధానంగా నమ్మకంగా ఉంది: రాజు మాట, ఎస్తేరు మరియు యూదుడైన మొర్దెకై గ్రహీతలు, హామాను ఇల్లు ఎస్తేరుకు ఇవ్వబడడం, హామాను శిక్షించబడడం, యూదులపై అతని శత్రుత్వ చర్య—అన్నీ నిలిచాయి. עֵץ యొక్క ‘చెట్టు/కొయ్య’ అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భానుసారమైన మరణదండన నిర్మాణాన్ని పాదటిప్పణిలో వివరించడం సరైన జాగ్రత్త. అయితే בַּיְּהוּדִים‌తో ఉన్న ‘చెయ్యి చాపడం’ అనే శత్రుత్వ-ఇడియమ్‌కు ‘యూదులకు విరోధంగా చెయ్యి చాపిన’ కూర్పు తెలుగులో కొద్దిగా అసహజంగా ఉంది.'
