source:
  edition: WLC
  text: וְ֠/אַתֶּם כִּתְב֨וּ עַל הַ/יְּהוּדִ֜ים כַּ/טּ֤וֹב בְּ/עֵֽינֵי/כֶם֙ בְּ/שֵׁ֣ם הַ/מֶּ֔לֶךְ וְ/חִתְמ֖וּ בְּ/טַבַּ֣עַת הַ/מֶּ֑לֶךְ כִּֽי כְתָ֞ב אֲשֶׁר נִכְתָּ֣ב בְּ/שֵׁם הַ/מֶּ֗לֶךְ וְ/נַחְתּ֛וֹם בְּ/טַבַּ֥עַת הַ/מֶּ֖לֶךְ אֵ֥ין לְ/הָשִֽׁיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/008.yaml
  text: But you may write concerning the Jews as seems good in your eyes[a], in the king’s name, and seal it with the king’s signet ring[b], for a document that is written in the king’s name and sealed with the king’s signet ring cannot be revoked.
translation:
  language: te
  text: అయితే మీరు యూదుల గురించి మీకు మంచిదనిపించినట్లు[a] రాజు పేరుతో రాసి, దానికి రాజు ముద్రికతో ముద్ర వేయండి. ఎందుకంటే రాజు పేరుతో వ్రాయబడి, రాజు ముద్రికతో ముద్రించబడిన పత్రాన్ని రద్దు చేయడం సాధ్యం కాదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు తగినదిగా అనిపించినట్లు.” హెబ్రీ నుడికారం అక్షరార్థంగా “మీ కళ్లలో మంచిదైనట్లు” అని ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వెనక్కి తిప్పడం సాధ్యం కాదు.” ఇక్కడి హెబ్రీ వ్యక్తీకరణ అలాంటి రాజపత్రాన్ని వెనక్కి తీసుకోవడం లేదా రద్దు చేయడం కుదరదని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: అయితే మీరు
  rationale: ముందటి రాజాజ్ఞను రద్దు చేయలేమనే సందర్భానికి వ్యతిరేక భావాన్ని సహజంగా చూపుతూ, బహువచన సంబోధనను నిలుపుతుంది.
- source_word: כִּתְבוּ
  choice: రాసి ... ముద్ర వేయండి
  rationale: ఇది బహువచన ఆజ్ఞారూపం. రాజు ఇచ్చిన అధికారాన్ని సందర్భం తెలియజేస్తున్నా, హెబ్రీ రూపానికి దగ్గరగా ఆజ్ఞారూపాన్ని ఉంచాం.
- source_word: עַל הַיְּהוּדִים
  choice: యూదుల గురించి
  rationale: עַל ఇక్కడ రచనకు సంబంధించిన విషయాన్ని సూచిస్తుంది. ఇది వారి పక్షాన రాయడాన్ని సందర్భపరంగా అనుమతిస్తూనే మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  choice: మీకు మంచిదిగా తోచినట్లు
  rationale: ‘మీ కళ్లలో మంచిదైనట్లు’ అనే హెబ్రీ నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం; వారి నిర్ణయానికి తగినట్లు అనే భావాన్ని ఇస్తుంది.
- source_word: בְּשֵׁם הַמֶּלֶךְ
  choice: రాజు పేరుతో
  rationale: రాజాధికారంతో వ్యవహరించడాన్ని సూచించే మూలంలోని ‘పేరు’ అనే రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְחִתְמוּ בְּטַבַּעַת הַמֶּלֶךְ
  choice: దానికి రాజు ముద్ర ఉంగరంతో ముద్ర వేయండి
  rationale: טַבַּעַת పరిపాలనా సందర్భంలో అధికారిక ముద్ర వేయడానికి ఉపయోగించే ఉంగరం. ‘దానికి’ అనే పదం పత్రాన్ని స్పష్టపరుస్తుంది.
- source_word: כְתָב
  choice: పత్రం
  rationale: సాధారణ లిఖిత పత్రాన్ని సూచించే మూలపద విస్తృతిని కాపాడుతుంది; ‘శాసనం’ లేదా ‘ఆజ్ఞాపత్రం’ కంటే తక్కువ నిర్దిష్టం.
- source_word: אֵין לְהָשִׁיב
  choice: రద్దు చేయడం సాధ్యం కాదు
  rationale: అక్షరార్థంగా ‘తిరిగి చేయడం లేదు’ అనే నుడికారం; రాజపత్రాన్ని ఉపసంహరించడం లేదా అమాన్యం చేయడం అసాధ్యమనే న్యాయపరమైన భావాన్ని సహజంగా తెలుపుతుంది.
