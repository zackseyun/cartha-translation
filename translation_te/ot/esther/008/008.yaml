  terminology: యూదులు, రాజు పేరుతో, ముద్రిక, పత్రం, రద్దు చేయడం అనే పదాలు మూలపు పరిపాలనా-న్యాయ రిజిస్టర్‌ను సరియైన విధంగా కాపాడుతున్నాయి. “పత్రం” అనే సాధారణ పదం כְתָב యొక్క విస్తృత అర్థాన్ని అనవసరంగా “శాసనం/ఆజ్ఞ”గా పరిమితం చేయదు.
