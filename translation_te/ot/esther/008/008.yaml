  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే పరిపాలనా శైలిని ఉపయోగించాం. హెబ్రీ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజీకరించి, దాని అక్షరరూపాన్ని పాదసూచికలో ఇచ్చాం.
