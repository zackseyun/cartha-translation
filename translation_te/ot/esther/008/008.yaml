  verdict: revise
  source_fidelity: 'మూల హెబ్రీలో చివరి భాగం సాధారణ న్యాయసూత్రంగా ఉంది: రాజు పేరుతో వ్రాయబడి, రాజు ముద్రికతో ముద్రించబడిన పత్రాన్ని వెనక్కి తీసుకోలేరు. ముసాయిదాలోని “రాసి, ... ముద్ర వేసిన పత్రం” అర్థమయ్యేదే అయినా, మూలంలోని నిష్క్రియార్థాన్ని స్పష్టంగా ప్రతిబింబించదు. సవరించిన పాఠ్యం దానిని నిలుపుతుంది.'
