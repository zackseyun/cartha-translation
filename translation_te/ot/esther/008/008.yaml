- from: అయితే మీరు యూదుల గురించి మీకు మంచిదిగా తోచినట్లు[a] రాజు పేరుతో రాసి, దానికి రాజు ముద్ర ఉంగరంతో ముద్ర వేయండి. ఎందుకంటే రాజు పేరుతో రాసి, రాజు ముద్ర ఉంగరంతో ముద్ర వేసిన పత్రాన్ని రద్దు చేయడం సాధ్యం కాదు[b].
