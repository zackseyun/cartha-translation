  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. అరుదైన పారసీక కాలపు అశ్వ పదజాలాన్ని అతిగా నిర్దిష్టీకరించకుండా ప్రధాన వాక్యంలో సహజంగా అందించి, మూలంలోని అనిశ్చితిని పాదటిప్పణిలో స్పష్టంగా ఉంచింది.
