base_translation:
  language: en
  yaml_path: translation/ot/esther/008/010.yaml
  text: He wrote in the name of King Ahasuerus[a], sealed it with the king’s signet ring, and sent letters by couriers on horses, riding the royal steeds bred from swift stock.
translation:
  language: te
  text: అతడు అహష్వేరోషు రాజు పేరున వ్రాసి, రాజు ముద్రికతో ముద్రవేసి, గుర్రాలపై స్వారీ చేసే దూతల ద్వారా పత్రాలను పంపించాడు; వారు రాజసేవకు చెందిన మేలుజాతి గుర్రాలపై స్వారీ చేసేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వాక్యం చివర గుర్రాలకు సంబంధించిన హీబ్రూ పదాలు చాలా అరుదైనవి; వాటి ఖచ్చితమైన అర్థం అనిశ్చితం. మరింత అక్షరార్థంగా ఈ భాగాన్ని, “రెఖెష్ అశ్వాలు, అహష్తెరానీమ్, రమ్మాకీమ్ సంతానం” అని చెప్పవచ్చు. ఈ పదాలు రాజ అశ్వశాల లేదా రాజ తపాలా సేవతో సంబంధం ఉన్న ప్రత్యేక స్వారీ జంతువులను సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: అతడు ... వ్రాసి
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగు భూతకాల అనుసంధాన క్రియతో వ్యక్తం చేసింది; కర్తను సందర్భానుసారం ‘అతడు’ అని తెలిపింది.
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: అహష్వేరోషు రాజు పేరున
  rationale: ఇది రాజు అధికారంతో చర్య చేపట్టడాన్ని తెలిపే అధికారిక ప్రయోగం; ‘పేరున’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: రాజు ముద్ర ఉంగరంతో ముద్రవేశాడు
  rationale: రాజకీయ సందర్భంలో טַבַּעַת అనేది ముద్ర వేయడానికి ఉపయోగించే ఉంగరం. హీబ్రూలో కర్మ స్పష్టంగా లేకపోవడంతో తెలుగులోనూ అనవసరంగా దానిని నిర్దిష్టం చేయలేదు.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: ఆ పత్రాలను ... పంపించాడు
  rationale: ఈ సందర్భంలో סְפָרִים అధికారిక లిఖిత సందేశాలు; ‘పత్రాలు’ గౌరవప్రదమైన, సహజమైన తెలుగు పదం.
- source_word: בְּיַד הָרָצִים
  choice: దూతల చేత
  rationale: בְּיַד ఇక్కడ సాధనకర్తను సూచిస్తుంది; గుర్రాలపై వెళ్లే הָרָצִים రాజదూతలు లేదా సందేశవాహకులు కాబట్టి ‘దూతలు’ సరిపోతుంది.
- source_word: בַּסּוּסִים רֹכְבֵי
  choice: గుర్రాలపై వెళ్లే ... స్వారీ చేశారు
  rationale: దూతలు గుర్రాలపై ప్రయాణించారనే అర్థాన్ని స్పష్టమైన, సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలిపింది.
- source_word: הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים בְּנֵי הָרַמָּכִים
  choice: రాజసేవకు చెందిన, మేలుజాతి గుర్రాలు
  rationale: ఈ మూడు పదాల్లో రెండు అత్యంత అరుదైనవి; రాజ అశ్వశాల లేదా రాజ తపాలా సేవకు చెందిన ప్రత్యేకంగా పెంచిన స్వారీ గుర్రాలు అనే సందర్భార్థాన్ని ఇస్తూ, నిర్ధారించలేని జంతుశాస్త్రీయ వివరాన్ని బలవంతంగా చేర్చలేదు. అనిశ్చితిని పాదటిప్పణిలో నిలిపింది.
