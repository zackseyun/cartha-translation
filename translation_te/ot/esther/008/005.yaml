  to: 'ఆమె ఇలా చెప్పింది: “రాజుకు మంచిదిగా అనిపిస్తే, నేను ఆయన సమక్షంలో కటాక్షం పొందినట్లయితే, ఈ విషయం రాజుకు సముచితంగా ఉంటే, నేను ఆయన దృష్టిలో అనుకూలంగా ఉంటే, అగాగీయుడైన హమ్మెదాతా కుమారుడు హామాను పన్నిన పథకానికి సంబంధించిన, రాజు పరిపాలనా ప్రాంతాలన్నిటిలో ఉన్న యూదులను నాశనం చేయడానికి అతడు రాసిన పత్రాలను రద్దు చేయాలని[a] వ్రాయబడాలి.”'
  rationale: సవరణలో ‘అతడు రాసిన’ అని మూలక్రియను నిలిపి, హామాను పథకం మరియు పత్రాల మధ్యనున్న నిర్మాణాత్మక సంబంధాన్ని స్పష్టంగా వ్యక్తం చేశాం. రాజు అధీనంలోని మְדִינוֹת కు ‘పరిపాలనా ప్రాంతాలు’ వాడాం. పాదసూచికలో לְהָשִׁיב యొక్క ప్రత్యామ్నాయ అర్థాన్ని, అలాగే పత్రాలు–పథకం సంబంధంపై అవసరమైన పారదర్శకతను కలిపాం.
