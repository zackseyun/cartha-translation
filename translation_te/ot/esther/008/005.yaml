source:
  edition: WLC
  text: וַ֠/תֹּאמֶר אִם עַל הַ/מֶּ֨לֶךְ ט֜וֹב וְ/אִם מָצָ֧אתִי חֵ֣ן לְ/פָנָ֗י/ו וְ/כָשֵׁ֤ר הַ/דָּבָר֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/טוֹבָ֥ה אֲנִ֖י בְּ/עֵינָ֑י/ו יִכָּתֵ֞ב לְ/הָשִׁ֣יב אֶת הַ/סְּפָרִ֗ים מַחֲשֶׁ֜בֶת הָמָ֤ן בֶּֽן הַמְּדָ֨תָא֙ הָ/אֲגָגִ֔י אֲשֶׁ֣ר כָּתַ֗ב לְ/אַבֵּד֙ אֶת הַ/יְּהוּדִ֔ים אֲשֶׁ֖ר בְּ/כָל מְדִינ֥וֹת הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/005.yaml
  text: And she said[a], “If it seems good to the king, and if I have found favor before him, and if the matter is proper before the king, and if I am pleasing in his eyes, let it be written to revoke the letters devised by Haman son of Hammedatha the Agagite[b], which he wrote to destroy the Jews who are in all the provinces of the king.”
translation:
  language: te
  text: 'ఆమె ఇలా చెప్పింది: “రాజుకు మంచిదిగా అనిపిస్తే, నేను ఆయన సమక్షంలో కటాక్షం పొందినట్లయితే, ఈ విషయం రాజుకు సముచితంగా ఉంటే, నేను ఆయన దృష్టిలో అనుకూలంగా ఉంటే, అగాగీయుడైన హమ్మెదాతా కుమారుడు హామాను పన్నిన పథకానికి సంబంధించిన, రాజు పరిపాలనా ప్రాంతాలన్నిటిలో ఉన్న యూదులను నాశనం చేయడానికి అతడు రాసిన పత్రాలను రద్దు చేయాలని[a] వ్రాయబడాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పత్రాలను వెనక్కి తిప్పాలని.” ఇక్కడి హీబ్రూ క్రియకు ‘వెనక్కి తిప్పడం’ లేదా ఈ పరిపాలనా సందర్భంలో ‘రద్దు చేయడం’ అనే అర్థాలు రావచ్చు. అక్షరార్థంగా, “పత్రాలు—హామాను పథకం”; అనువాదం ఆ పత్రాలు హామాను పన్నిన పథకానికి సంబంధించినవని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: రాజుకు మంచిదిగా అనిపిస్తే
  rationale: రాజసభలో వినయపూర్వకంగా విన్నవించే సూత్రబద్ధమైన మాటను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מָצָאתִי חֵן לְפָנָיו
  choice: ఆయన సమక్షంలో నాకు అనుగ్రహం లభించి ఉంటే
  rationale: חֵן అనే పదంలోని రాజానుగ్రహ భావాన్ని, לְפָנָיו లోని ‘సమక్షంలో’ అనే భావాన్ని నిలుపుతుంది.
- source_word: וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ
  choice: ఈ విషయం రాజుకు సముచితంగా ఉంటే
  rationale: כָשֵׁר సూచించే తగినది, యుక్తమైనది అనే భావాన్ని అధికారిక సందర్భానికి సరిపోయేలా వ్యక్తం చేస్తుంది.
- source_word: וְטוֹבָה אֲנִי בְּעֵינָיו
  choice: నేను ఆయన దృష్టికి ఇంపైనదానినైతే
  rationale: వ్యక్తిగత ఆమోదం లేదా ప్రీతిని తెలిపే హీబ్రూ దృష్టి-జాతీయాన్ని సహజంగా, దాని ప్రత్యేక భావాన్ని చెరపకుండా అందిస్తుంది.
- source_word: יִכָּתֵב
  choice: రాయించాలి
  rationale: రాజాజ్ఞ రూపంలో వ్రాయబడాలని ఎస్తేరు చేస్తున్న అధికారిక విన్నపాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; హీబ్రూలోని పరోక్ష ఆజ్ఞార్థక బలాన్ని నిలుపుతుంది.
- source_word: לְהָשִׁיב
  choice: రద్దు చేయాలని
  rationale: ఈ పరిపాలనా సందర్భంలో ముందటి రాజపత్రాల అమలును ఉపసంహరించాలనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘వెనక్కి తిప్పడం’ అనే మూలార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: הַסְּפָרִים
  choice: పత్రాలను
  rationale: సామ్రాజ్యమంతటికి పంపిన అధికారిక లిఖిత సమాచారాన్ని ‘పత్రాలు’ సహజంగా, తగిన అధికారికతతో సూచిస్తుంది.
- source_word: מַחֲשֶׁבֶת הָמָן
  choice: హామాను ... రాయించిన పత్రాలను
  rationale: పదబంధం అక్షరార్థంగా ‘హామాను పన్నాగమైన పత్రాలు’ అనే సంబంధాన్ని చూపుతుంది. తెలుగులో పత్రాలు అతని యోచనకు రూపమిచ్చాయని సందర్భానుసారంగా సహజంగా వ్యక్తం చేయబడింది.
- source_word: לְאַבֵּד
  choice: నాశనం చేయడానికి
  rationale: యూదులను అంతమొందించాలనే కారణార్థక క్రియ యొక్క తీవ్రతను అతిశయోక్తి లేకుండా నిలుపుతుంది.
- source_word: הַיְּהוּדִים אֲשֶׁר בְּכָל מְדִינוֹת הַמֶּלֶךְ
  choice: రాజు సంస్థానాలన్నిటిలో ఉన్న యూదులను
  rationale: సాపేక్ష వాక్యాన్ని, సామ్రాజ్యంలోని అన్ని పరిపాలనా ప్రాంతాలకు వర్తించే పరిధిని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన రాజసభ విన్నప శైలిని పాటించాం. వరుసగా వచ్చే షరతులను నిలిపి, వాక్యం భారంగా కాకుండా సహజంగా రూపొందించాం. ‘సంస్థానాలు,’ ‘పత్రాలు,’ ‘రద్దు’ వంటి పదాలు పరిపాలనా సందర్భానికి తగినవి.
