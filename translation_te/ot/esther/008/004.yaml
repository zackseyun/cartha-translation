translation:
  language: te
  text: అప్పుడు రాజు బంగారు రాజదండాన్ని ఎస్తేరు వైపు చాపాడు[a]. ఎస్తేరు లేచి రాజు ఎదుట నిలబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బంగారు రాజదండాన్ని ఎస్తేరు వైపు సాగదీశాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֶׁט
  choice: చాపాడు
  rationale: ఈ క్రియకు ‘చాపడం, ముందుకు సాగదీయడం’ అనే అర్థం ఉంది. రాజదండాన్ని ఎస్తేరు వైపు చాపిన రాజసభ సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: బంగారు రాజదండాన్ని
  rationale: ఇది రాజుకు చెందిన బంగారు దండాన్ని సూచిస్తుంది. ‘రాజదండం’ సాధారణ ‘దండం’ కంటే రాజసభ సందర్భాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַתָּקָם
  choice: లేచి
  rationale: ‘లేచుట’ అనే మూలార్థాన్ని నిలుపుతూ, వెంటనే వచ్చే ‘నిలబడింది’ అనే క్రియతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: రాజు ఎదుట నిలబడింది
  rationale: לִפְנֵי అనే పదబంధంలోని ‘ఎదుట/సన్నిధిలో’ భావాన్ని రాజసభకు తగిన సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: ప్రారంభంలోని వావ్ కథనాన్ని తదుపరి సంఘటనకు తీసుకెళ్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לְאֶסְתֵּר
  choice: ఎస్తేరు వైపు
  rationale: రాజదండాన్ని ఆమె దిశగా చాపిన చర్యను తెలుగులో సహజంగా సూచిస్తుంది; హెబ్రీ పూర్వప్రత్యయం ఇక్కడ గమ్యాన్ని లేదా దిశను తెలియజేయగలదు.
