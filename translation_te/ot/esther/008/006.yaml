source:
  edition: WLC
  text: כִּ֠י אֵיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בָּ/רָעָ֖ה אֲשֶׁר יִמְצָ֣א אֶת עַמִּ֑/י וְ/אֵֽיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בְּ/אָבְדַ֖ן מוֹלַדְתִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/006.yaml
  text: For how could I bear to see the disaster that will come upon my people? And how could I bear to see the destruction of my kindred?[a]
translation:
  language: te
  text: ఎందుకంటే, నా ప్రజలకు సంభవించబోయే విపత్తును చూస్తూ నేను ఎలా సహించగలను? నా స్వజనుల నాశనాన్ని చూస్తూ నేను ఎలా సహించగలను?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా జన్మసంబంధమైన ప్రజల నాశనం’ / ‘నా బంధువుల నాశనం.’ హీబ్రూ పదం מוֹלַדְתִּי కేవలం జన్మస్థలాన్నే కాక, ఒకరి జన్మసంబంధమైనవారిని లేదా స్వజనులను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి విన్నపానికి కారణాన్ని పరిచయం చేసే హేత్వర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֵיכָכָה אוּכַל
  choice: నేను ఎలా సహించగలను?
  rationale: అసమర్థతను, భావోద్వేగభరితమైన విస్మయాన్ని తెలిపే అలంకారప్రశ్న. יכל యొక్క ‘శక్తి కలిగి ఉండు’ అనే మూలార్థాన్ని సందర్భానుసారంగా ‘సహించగలను’ అని వ్యక్తం చేసింది.
- source_word: וְרָאִיתִי
  choice: చూస్తూ
  rationale: విపత్తును ప్రత్యక్షంగా చూడవలసి రావడాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, ప్రధాన క్రియతో అనుసంధానిస్తుంది.
- source_word: בָּרָעָה אֲשֶׁר יִמְצָא
  choice: సంభవించబోయే విపత్తు
  rationale: רָעָה ఇక్కడ నైతిక చెడును కాక ఆపదను సూచిస్తుంది; ‘కనుగొను’ అనే యథార్థ రూపానికి బదులుగా ימצא యొక్క సందర్భోచిత భావమైన ‘సంభవించు’ ఉపయోగించబడింది.
- source_word: עַמִּי
  choice: నా ప్రజలు
  rationale: ఎస్తేరు తన యూదా ప్రజలతో కలిగిన గుర్తింపును నేరుగా కాపాడుతుంది.
- source_word: בְּאָבְדַן
  choice: నాశనం
  rationale: אבד నుంచి వచ్చిన ఈ నామవాచకం నశించిపోవడం లేదా విధ్వంసాన్ని సూచిస్తుంది; ‘నాశనం’ విస్తృతమైన, సహజమైన తెలుగు పదం.
- source_word: מוֹלַדְתִּי
  choice: నా స్వజనులు
  rationale: తన జన్మసంబంధమైనవారు, బంధువులు లేదా తన వంశప్రజలు అనే భావపరిధిని ‘స్వజనులు’ సహజంగా అందిస్తుంది; దానిని కేవలం జన్మస్థలంగా పరిమితం చేయదు.
