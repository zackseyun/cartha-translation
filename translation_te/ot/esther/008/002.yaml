source:
  edition: WLC
  text: וַ/יָּ֨סַר הַ/מֶּ֜לֶךְ אֶת טַבַּעְתּ֗/וֹ אֲשֶׁ֤ר הֶֽעֱבִיר֙ מֵֽ/הָמָ֔ן וַֽ/יִּתְּנָ֖/הּ לְ/מָרְדֳּכָ֑י וַ/תָּ֧שֶׂם אֶסְתֵּ֛ר אֶֽת מָרְדֳּכַ֖י עַל בֵּ֥ית הָמָֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/002.yaml
  text: Then the king removed his signet ring[a], which he had taken away from Haman, and gave it to Mordecai. And Esther appointed Mordecai over the house of Haman.
translation:
  language: te
  text: అప్పుడు రాజు హామాను నుండి తీసుకున్న తన ముద్ర ఉంగరాన్ని తీసి మొర్దెకైకి ఇచ్చాడు. ఎస్తేరు హామాను ఇంటి బాధ్యతను[a] మొర్దెకైకి అప్పగించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హామాను ఇంటివారి బాధ్యతను” లేదా “హామాను ఎస్టేటు బాధ్యతను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: తీసి
  rationale: హిఫిల్ రూపం ‘తొలగించడం/తీసివేయడం’ అనే భావాన్ని ఇస్తుంది. చేతికి ఉన్న ఉంగరాన్ని తీసే చర్యకు ‘తీసి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: טַבַּעְתּוֹ
  choice: తన ముద్ర ఉంగరాన్ని
  rationale: రాజదర్బారు సందర్భంలో ఇది అధికార పత్రాలకు ముద్ర వేసే రాజముద్ర ఉంగరం; ‘ముద్ర ఉంగరం’ దాని విధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר הֶעֱבִיר מֵהָמָן
  choice: హామాను దగ్గర నుంచి తీసుకున్న
  rationale: עבר హిఫిల్ ఇక్కడ హామాను నుంచి ఉంగరాన్ని తొలగించి స్వాధీనం చేసుకున్న మునుపటి చర్యను సూచిస్తుంది.
- source_word: וַיִּתְּנָהּ לְמָרְדֳּכָי
  choice: మొర్దెకైకి ఇచ్చాడు
  rationale: נתן అనే సాధారణ ‘ఇవ్వు’ క్రియను నేరుగా, సహజంగా అనువదిస్తుంది; స్త్రీలింగ ప్రత్యయం ఉంగరాన్ని సూచిస్తుంది.
- source_word: וַתָּשֶׂם אֶסְתֵּר אֶת מָרְדֳּכַי עַל
  choice: ఎస్తేరు ... మొర్దెకైని అధికారిగా నియమించింది
  rationale: שׂים עַל ఒక బాధ్యతా పరిధిపై వ్యక్తిని ఉంచడం లేదా నియమించడం అనే పరిపాలనా భావాన్ని కలిగిస్తుంది.
- source_word: בֵּית הָמָן
  choice: హామాను ఆస్తిపాస్తులపై
  rationale: ఈ సందర్భంలో בַּיִת కేవలం భవనాన్ని కాక, 8:1లో ఎస్తేరుకు అప్పగించబడిన హామాను గృహసంపద లేదా ఎస్టేటును సూచిస్తుంది. ‘ఆస్తిపాస్తులు’ ఆధునిక తెలుగులో ఆ విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. రాజదర్బారు అధికార భావాన్ని స్పష్టంగా ఉంచుతూ, మూలంలోని సంక్షిప్త వాక్య నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడింది.
