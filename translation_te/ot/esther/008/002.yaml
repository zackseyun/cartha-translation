    issue: בֵּית הָמָןను 'హామాను ఆస్తిపాస్తులపై'గా పరిమితం చేయడం
    rationale: హెబ్రీ בַּיִת ఈ సందర్భంలో ఆస్తిని కలిగి ఉండవచ్చుగాని, గృహస్థులు లేదా మొత్తం ఇంటి/ఎస్టేటు నిర్వహణను కూడా సూచిస్తుంది. 'ఆస్తిపాస్తులు' మాత్రమే చెప్పడం మూలంలోని విస్తృతతను కోల్పోతుంది.
  - severity: low
