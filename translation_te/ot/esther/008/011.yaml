source:
  edition: WLC
  text: אֲשֶׁר֩ נָתַ֨ן הַ/מֶּ֜לֶךְ לַ/יְּהוּדִ֣ים אֲשֶׁ֣ר בְּ/כָל עִיר וָ/עִ֗יר לְ/הִקָּהֵל֮ וְ/לַ/עֲמֹ֣ד עַל נַפְשָׁ/ם֒ לְ/הַשְׁמִיד֩ וְ/לַ/הֲרֹ֨ג וּ/לְ/אַבֵּ֜ד אֶת כָּל חֵ֨יל עַ֧ם וּ/מְדִינָ֛ה הַ/צָּרִ֥ים אֹתָ֖/ם טַ֣ף וְ/נָשִׁ֑ים וּ/שְׁלָלָ֖/ם לָ/בֽוֹז׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/011.yaml
  text: that the king granted the Jews in every single city to assemble and to stand for their lives[a], to destroy, to kill, and to annihilate every armed force of any people or province that might attack them, including children and women[b], and to plunder their spoil.
translation:
  language: te
  text: రాజు ప్రతి పట్టణంలోని యూదులకు సమకూడి, తమ ప్రాణాల కోసం నిలబడటానికి[a], తమతో శత్రుత్వంగా ఉన్న ఏ ప్రజ లేదా సంస్థానానికి చెందిన సైనిక బలగమంతటినీ—పిల్లలు, స్త్రీలతో సహా[b]—నాశనం చేయడానికి, చంపడానికి, నిర్మూలించడానికి, వారి సొత్తును దోచుకోవడానికి అనుమతి ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ ప్రాణాలను కాపాడుకోవడానికి.” హీబ్రూ పదబంధం అక్షరార్థంగా ‘తమ ప్రాణాల కోసం నిలబడటానికి’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “పిల్లలు, స్త్రీలు.” రాజాజ్ఞ పదప్రయోగంలో వీరు పేర్కొన్న శత్రు సమూహంలో స్పష్టంగా చేర్చబడ్డారు.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר נָתַן
  choice: అనుమతి ఇచ్చాడు
  rationale: రాజాజ్ఞలోని అధికారప్రదాన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మునుపటి వచనంలోని ఆజ్ఞ విషయాన్ని కొనసాగిస్తుంది.
- source_word: בְּכָל עִיר וָעִיר
  choice: ప్రతి పట్టణంలో ఉన్న
  rationale: హీబ్రూ పంపిణీ పునరుక్తిలోని సమగ్రతను సహజమైన తెలుగులో ‘ప్రతి పట్టణంలో’ తెలియజేస్తుంది.
- source_word: לְהִקָּהֵל
  choice: సమకూడి
  rationale: నిఫాల్ రూపంలోని కలిసి గుమికూడే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וְלַעֲמֹד עַל נַפְשָׁם
  choice: తమ ప్రాణాల కోసం నిలబడటానికి
  rationale: అక్షరార్థ చిత్రణను నిలుపుతూ ప్రాణరక్షణ సందర్భాన్ని సూచిస్తుంది; ‘తమను తాము రక్షించుకోవడానికి’ అని పూర్తిగా వివరణాత్మకం చేయలేదు.
- source_word: לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד
  choice: నాశనం చేయడానికి, చంపడానికి, నిర్మూలించడానికి
  rationale: మూలంలోని ఉద్దేశపూర్వకమైన మూడు హింసాత్మక క్రియల సముచ్చయాన్ని తగ్గించకుండా విడివిడిగా నిలుపుతుంది.
- source_word: כָּל חֵיל
  choice: సైనిక బలగాన్నైనా
  rationale: ఈ సందర్భంలో חֵיל సంపదను కాక సాయుధ లేదా సైనిక శక్తిని సూచిస్తుంది.
- source_word: עַם וּמְדִינָה
  choice: ఏ ప్రజకు లేదా సంస్థానానికి చెందిన
  rationale: సామ్రాజ్యంలోని జాతి-రాజకీయ సమూహాలన్నిటికీ వర్తించే అనిర్దిష్ట, సమగ్ర పరిధిని తెలియజేస్తుంది.
- source_word: הַצָּרִים אֹתָם
  choice: తమపై దాడి చేయగల
  rationale: శత్రుత్వంగా ప్రవర్తించే వారనే కృదంత భావాన్ని రక్షణాత్మక సందర్భంలో స్పష్టంచేస్తుంది; అది కేవలం సంభావ్యత మాత్రమే అని స్థిరపరచకుండా సందర్భోచిత సామర్థ్య భావాన్ని ఇస్తుంది.
- source_word: טַף וְנָשִׁים
  choice: పిల్లలు, స్త్రీలతో సహా
  rationale: ఈ పదాలు లక్ష్యంగా పేర్కొన్న శత్రు సమూహంలో భాగమని వాక్యనిర్మాణపరంగా స్పష్టంచేస్తూ, కఠినమైన విషయాన్ని దాచదు.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: వారి దోపుడు సొమ్మును కొల్లగొట్టడానికి
  rationale: వారి ఆస్తిని దోపిడీగా స్వాధీనం చేసుకోవడానికి ఇచ్చిన అనుమతిని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: రాజాజ్ఞలోని హింసాత్మక భాష
  choice: మూడు సంహారక క్రియలను నేరుగా అనువదించి, ‘తమ ప్రాణాల కోసం నిలబడటానికి’ మరియు ‘తమపై దాడి చేయగల’ అనే మాటలతో రక్షణాత్మక సందర్భాన్ని నిలిపాం.
  alternative: ‘ఓడించడానికి’ లేదా ‘ఎదుర్కోవడానికి’ వంటి మృదువైన పదాలతో హింస తీవ్రతను తగ్గించడం.
  rationale: హీబ్రూ పాఠం ప్రాణాంతక చర్యను, దోపిడిని స్పష్టంగా అనుమతిస్తుంది. అనువాదం దాని తీవ్రతను తగ్గించకూడదు; అదే సమయంలో సందర్భంలోని ఆత్మరక్షణ భావాన్నీ పోగొట్టకూడదు.
- issue: ‘పిల్లలు, స్త్రీలు’ అనే పదబంధపు పరిధి
  choice: లక్ష్యంగా చెప్పబడిన శత్రు బలగంలో వారూ చేర్చబడ్డారని పారదర్శకంగా చూపించి, నైతిక ఉద్రిక్తతను అలాగే ఉంచాం.
  alternative: ఈ పదబంధాన్ని అస్పష్టపరచడం, విడదీయడం లేదా వదిలివేయడం.
  rationale: వాక్యనిర్మాణం ఈ పదాలను లక్ష్య సమూహానికి అనుబంధంగా చూపుతుంది. పాఠంలోని నైతిక కఠినతను అనువాదం మృదువుచేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. రాజాజ్ఞ యొక్క న్యాయపరమైన ధోరణి, హింసాత్మక తీవ్రత, రక్షణాత్మక సందర్భం మూడింటినీ నిలిపాం. ‘సంస్థానం’ అనే పదం పర్షియా సామ్రాజ్యంలోని పరిపాలనా ప్రావిన్సును సూచిస్తుంది.
