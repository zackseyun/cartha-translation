  yaml_path: translation/ot/esther/008/009.yaml
  text: Then the king’s scribes were summoned at that time[a], in the third month, that is, the month of Sivan, on its twenty-third day; and it was written exactly as Mordecai commanded, to the Jews and to the satraps, the governors, and the officials of the provinces from India to Cush, one hundred and twenty-seven provinces, to each province in its own script, to each people in its own language[b], and also to the Jews in their own script and their own language.
translation:
  language: te
  text: 'ఆ సమయంలో, మూడవ నెలైన సీవాను నెల ఇరవై మూడవ రోజున[a], రాజు లేఖకులు పిలువబడ్డారు. మొర్దెకై ఆజ్ఞాపించినదంతా యూదులకు, క్షత్రపులకు, పాలకులకు, భారతదేశం నుండి కూషు[b] వరకు ఉన్న నూట ఇరవై ఏడు ప్రాంతాల అధికారులకు రాయబడింది—ప్రతి ప్రాంతానికి దాని లిపిలో, ప్రతి ప్రజకు దాని భాషలో, యూదులకు వారి లిపిలో, వారి భాషలో రాయబడింది.


    [a] మూలభాషలో అక్షరార్థంగా, “దానిలో ఇరవై మూడవ రోజున”; “దానిలో” అనేది సీవాను నెలను సూచిస్తుంది.


    [b] లేదా “ఇథియోపియా.” హీబ్రూ మూలంలో “హోదూ నుండి కూషు వరకు” అని ఉంది; ప్రాచీన ప్రాంతనామాన్ని మరింత ఖచ్చితంగా నిలుపుటకు ప్రధాన పాఠ్యంలో “కూషు” అని ఉంచబడింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “దానిలో ఇరవై మూడవ రోజున”; “దానిలో” అనేది సీవాను నెలను సూచిస్తుంది.
    reason: previous_rendering
  - marker: b
    text: లేదా “ఇథియోపియా.” హీబ్రూ మూలంలో “హోదూ నుండి కూషు వరకు” అని ఉంది; ప్రాచీన ప్రాంతనామాన్ని మరింత ఖచ్చితంగా నిలుపుటకు ప్రధాన పాఠ్యంలో “కూషు” అని ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרְאוּ
  choice: పిలిపించారు
  rationale: నిఫ్అల్ రూపంలోని నిష్క్రియ భావాన్ని తెలుగులో సహజమైన అనిర్దిష్ట కర్త ప్రయోగంతో తెలియజేస్తుంది; రాజసభ అధికారిక సందర్భాన్నీ నిలుపుతుంది.
- source_word: סֹפְרֵי הַמֶּלֶךְ
  choice: రాజు లేఖకులు
  rationale: రాజుకు చెందిన అధికారిక లేఖకులు అనే నిర్మాణాన్ని స్పష్టంగా, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי הוּא חֹדֶשׁ סִיוָן
  choice: మూడవ నెల అయిన సీవాను నెల
  rationale: హీబ్రూలోని వివరణాత్మక సమానాధికార నిర్మాణాన్ని సహజంగా నిలుపుతుంది; సీవాను నెల పేరును లిప్యంతరీకరించింది.
- source_word: וַיִּכָּתֵב
  choice: రాయబడింది
  rationale: మూలంలోని ఏకవచన నిష్క్రియ రూపాన్ని నిలుపుతూ, రచయితగా ఎవ్వరినీ అదనంగా చేర్చదు.
- source_word: כְּכָל אֲשֶׁר צִוָּה מָרְדֳּכַי
  choice: మొర్దెకై ఆజ్ఞాపించినదంతా
  rationale: כְּכָל లోని సంపూర్ణత భావాన్ని ‘అంతా’ ద్వారా నేరుగా తెలియజేస్తుంది.
- source_word: הָאֲחַשְׁדַּרְפְּנִים
  choice: క్షత్రపులు
  rationale: పర్షియా సామ్రాజ్యంలోని ఈ పరిపాలనా హోదాకు తెలుగులో స్థిరపడిన చారిత్రక పదం.
- source_word: הַפַּחוֹת
  choice: పాలకులు
  rationale: సందర్భంలోని దిగువస్థాయి ప్రాంతీయ పరిపాలకులను ఆధునిక పాఠకులకు స్పష్టంగా సూచిస్తుంది.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: సంస్థానాల అధికారులు
  rationale: సామ్రాజ్య పరిపాలనా సందర్భంలో שָׂרִים పదానికి రాజవంశీయ భావం చేర్చకుండా అధికారిక పదవిని తెలియజేస్తుంది.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: భారతదేశం మొదలుకొని కూషు వరకు
  rationale: הֹדּוּ ను సంప్రదాయంగా భారతదేశంతో గుర్తిస్తూ, כּוּשׁ అనే ప్రాచీన ప్రాంతనామాన్ని అనవసరంగా ఆధునిక భూగోళంతో సమానం చేయకుండా నిలుపుతుంది.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ וְעַם וָעָם כִּלְשֹׁנוֹ
  choice: ప్రతి సంస్థానానికి దాని లిపిలో, ప్రతి ప్రజకు వారి భాషలో
  rationale: హీబ్రూ పంపిణీ నిర్మాణాన్ని సహజమైన తెలుగు ‘ప్రతి’ నిర్మాణంతో వ్యక్తం చేస్తూ లిపి, భాష మధ్య తేడాను కాపాడుతుంది.
