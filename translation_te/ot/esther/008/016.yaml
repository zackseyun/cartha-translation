id: EST.8.16
reference: Esther 8:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לַ/יְּהוּדִ֕ים הָֽיְתָ֥ה אוֹרָ֖ה וְ/שִׂמְחָ֑ה וְ/שָׂשֹׂ֖ן וִ/יקָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/016.yaml
  text: For the Jews there was light and gladness and joy and honor[a].
translation:
  language: te
  text: యూదులకు వెలుగు, సంతోషం, ఆనందం, గౌరవం కలిగాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదులకు వెలుగు, సంతోషం, ఆనందం, గౌరవం ఉన్నాయి.” హీబ్రూ వాక్య నిర్మాణాన్ని ‘వారికి కలిగాయి’ అనే భావంలో గానీ, ‘వారికి ఉన్నాయి’ అనే భావంలో గానీ అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְּהוּדִים
  choice: యూదులకు
  rationale: ల ఉపసర్గ ఇక్కడ సంబంధాన్ని లేదా స్వాధీన భావాన్ని సూచిస్తుంది. ‘యూదులకు’ అనే రూపం హీబ్రూ నిర్మాణాన్ని సహజంగా నిలుపుతూ, దానిని కేవలం స్వాధీన వాక్యంగా నిర్ణయించదు.
- source_word: הָיְתָה
  choice: కలిగాయి
  rationale: ముందున్న దత్తివసదృశ పదబంధంతో היה క్రియ కలిపి, యూదులకు ఈ మేలులు ఏర్పడ్డాయని సూచిస్తుంది. తెలుగులో బహువచన అంశాల సరళికి అనుగుణంగా ‘కలిగాయి’ సహజంగా ఉంటుంది; మూలంలో క్రియ ఏకవచన స్త్రీలింగంలో మొదటి నామవాచకమైన אוֹרָהతో సరిపోతుంది.
- source_word: אוֹרָה
  choice: వెలుగు
  rationale: ఇది సందర్భంలో విమోచన, క్షేమానికి రూపకమైనప్పటికీ, ‘వెలుగు’ మూల చిత్రాన్ని వ్యాఖ్యానించకుండా కాపాడుతుంది.
- source_word: שִׂמְחָה
  choice: సంతోషం
  rationale: ఈ పదం ఆనందస్థితిని సూచిస్తుంది. తరువాతి שָׂשׂוֹןతో ఉన్న సమీపార్థక జోడీని పూర్తిగా కలిపివేయకుండా ‘సంతోషం’గా అనువదించాం.
- source_word: שָׂשׂוֹן
  choice: ఆనందం
  rationale: ఇది ఉల్లాసభరితమైన ఆనందం లేదా హర్షాన్ని సూచిస్తుంది. ‘ఆనందం’ ఆధునిక తెలుగులో సహజంగా ఉండి שִׂמְחָהకు ఎంచుకున్న ‘సంతోషం’తో స్వల్ప పదభేదాన్ని నిలుపుతుంది.
- source_word: יְקָר
  choice: గౌరవం
  rationale: ఈ సందర్భంలో ఈ పదం యూదులకు లభించిన ప్రతిష్ఠ, మర్యాదను సూచిస్తుంది. ‘గౌరవం’ సామాజిక భావాన్ని స్పష్టంగా అందిస్తుంది; ‘వైభవం’ దృశ్య మహిమను అతిగా సూచించవచ్చు.
