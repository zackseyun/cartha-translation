translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని వరుస నామవాచకాల లయను, ‘వెలుగు’ అనే రూపకాన్ని, రెండు ఆనందపదాల సమీపార్థక సమాహారాన్ని నిలిపాం.
