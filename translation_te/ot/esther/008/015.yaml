base_translation:
  language: en
  yaml_path: translation/ot/esther/008/015.yaml
  text: And Mordecai went out from the presence of the king in royal clothing of blue and white[a], with a large crown of gold and a robe of fine linen and purple[e][d][c][b]; and the city of Susa shouted and rejoiced.
translation:
  language: te
  text: మొర్దెకై నీలం, తెలుపు రంగుల రాజవస్త్రాలు ధరించి, పెద్ద బంగారు కిరీటంతో, సన్నని నారబట్టతోను ఊదా రంగు బట్టతోను చేసిన పైవస్త్రం కప్పుకొని రాజు సన్నిధి నుండి బయలుదేరాడు; షూషను పట్టణం ఆనందంతో కేకలు వేసి సంతోషించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీలం” అని అనువదించిన హీబ్రూ పదం నీలం-ఊదా ఛాయగల విలువైన రాజవర్ణాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא מִלִּפְנֵי הַמֶּלֶךְ
  choice: రాజు సన్నిధి నుండి బయలుదేరాడు
  rationale: ‘రాజు ఎదుటి నుండి బయటికి వెళ్లాడు’ అనే రాజసభ సందర్భంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְבוּשׁ מַלְכוּת תְּכֵלֶת וָחוּר
  choice: నీలం, తెలుపు రంగుల రాజవస్త్రాలు
  rationale: రాజసంబంధమైన దుస్తులను, వాటి రెండు వర్ణాలను స్పష్టంగా నిలుపుతుంది; תְּכֵלֶת యొక్క ఖచ్చితమైన ఛాయ అనిశ్చితిని పాదసూచికలో సూచించాం.
- source_word: עֲטֶרֶת זָהָב גְּדוֹלָה
  choice: పెద్ద బంగారు కిరీటం
  rationale: తలపై ధరించే బంగారు అలంకారం మరియు దాని వైభవం రెండింటినీ నేరుగా తెలియజేస్తుంది.
- source_word: תַכְרִיךְ בּוּץ וְאַרְגָּמָן
  choice: సన్నని నారబట్టతోను ఊదా రంగు బట్టతోను చేసిన పైవస్త్రం
  rationale: תַכְרִיךְ యొక్క చుట్టుకునే లేదా కప్పుకునే బయటి వస్త్ర భావాన్ని ‘పైవస్త్రం’గా సహజంగా అందిస్తూ, విలాసవంతమైన రెండు వస్త్ర పదార్థాలను వేరుగా ఉంచుతుంది.
- source_word: הָעִיר שׁוּשָׁן
  choice: షూషను పట్టణం
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు బైబిలు వినియోగానికి అనుగుణంగా లిప్యంతరీకరించి, అది పట్టణమని స్పష్టం చేస్తుంది.
- source_word: צָהֲלָה וְשָׂמֵחָה
  choice: ఆనందంతో కేకలు వేసి సంతోషించింది
  rationale: మొదటి క్రియలోని బహిరంగ ధ్వని స్పందనను, రెండవ క్రియలోని సంతోష స్థితిని వేరువేరుగా నిలుపుతుంది.
