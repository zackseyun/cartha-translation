translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర కథనశైలి. అరుదైన పారసీక-హీబ్రూ రవాణా పదజాలంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
