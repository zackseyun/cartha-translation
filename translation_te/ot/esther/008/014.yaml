source:
  edition: WLC
  text: הָ/רָצִ֞ים רֹכְבֵ֤י הָ/רֶ֨כֶשׁ֙ הָֽ/אֲחַשְׁתְּרָנִ֔ים יָֽצְא֛וּ מְבֹהָלִ֥ים וּ/דְחוּפִ֖ים בִּ/דְבַ֣ר הַ/מֶּ֑לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/014.yaml
  text: The couriers[a], mounted on the royal steeds, went out hastened and pressed on by the king’s command, and the decree was issued in Susa the citadel.
translation:
  language: te
  text: రాజవార్తాహరులు[a] అరుదైన రాజ రవాణా జంతువులపై[b] స్వారీ చేసి, రాజాజ్ఞచేత తొందరపెట్టబడి ఆతురంగా బయలుదేరారు. ఆ శాసనం షూషను కోటలో జారీ చేయబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరుగువారు.” పారసీక సామ్రాజ్య సందర్భంలో ఈ పదం రాజాజ్ఞలను తీసుకెళ్లే అధికారిక వార్తాహరులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలోని జంతువులను సూచించే పదాలు అరుదైనవి; అవి గుఱ్ఱాలనో, ఇతర వేగవంతమైన రాజ రవాణా జంతువులనో సూచిస్తాయా అనేది ఖచ్చితంగా నిర్ధారించలేము.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: הָרָצִים
  choice: రాజవార్తాహరులు
  rationale: మూలార్థం ‘పరుగెత్తేవారు’ అయినా, పారసీక సామ్రాజ్య సందర్భంలో రాజాజ్ఞలను చేరవేసే అధికారిక వార్తాహరులను సూచిస్తుంది.
- source_word: רֹכְבֵי הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים
  choice: రాజాశ్వాలపై ఎక్కి
  rationale: వేగవంతమైన రాజ రవాణాకు ఉపయోగించిన జంతువులను సూచించే అరుదైన పదసమూహం. ఖచ్చితమైన జంతు లేదా జాతి గుర్తింపు అనిశ్చితమైనందున సహజమైన సంక్షిప్త రూపాన్ని ఎంచుకున్నాం.
- source_word: יָצְאוּ
  choice: బయలుదేరారు
  rationale: ఈ ప్రయాణ సందర్భంలో ‘వెలుపలికి వెళ్లారు’ కంటే సహజంగా కథన గమనాన్ని తెలియజేస్తుంది.
- source_word: מְבֹהָלִים וּדְחוּפִים
  choice: త్వరపెట్టబడి, తొందరగా
  rationale: రెండు నిష్క్రియ భావాలూ రాజాజ్ఞ వల్ల కలిగిన బాహ్య ఒత్తిడిని, తక్షణ వేగాన్ని బలపరుస్తాయి; తెలుగులో అనవసర పునరుక్తి లేకుండా రెండింటి తీవ్రతను నిలిపాం.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: రాజాజ్ఞచేత
  rationale: דבר ఇక్కడ అధికారపూర్వకమైన ఆజ్ఞ; בְּ దాని ప్రేరక లేదా సాధన భావాన్ని సూచిస్తుంది.
- source_word: וְהַדָּת נִתְּנָה
  choice: ఆ శాసనం ... జారీ చేయబడింది
  rationale: పరిపాలనా సందర్భంలో דת రాజశాసనాన్ని, נתן దానిని అధికారికంగా ప్రకటించడం లేదా జారీ చేయడాన్ని సూచిస్తాయి.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: షూషను కోటలో
  rationale: స్థలనామాన్ని మూలానికి సమీపంగా లిప్యంతరీకరించి, הַבִּירָהను రాజకోట లేదా దుర్గప్రాంతం అనే సందర్భార్థంలో ‘కోట’గా ఇచ్చాం.
