id: EST.8.1
reference: Esther 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נָתַ֞ן הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרוֹשׁ֙ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה אֶת בֵּ֥ית הָמָ֖ן צֹרֵ֣ר ה/יהודיים וּ/מָרְדֳּכַ֗י בָּ֚א לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ כִּֽי הִגִּ֥ידָה אֶסְתֵּ֖ר מַ֥ה הוּא לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/001.yaml
  text: On that day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews, and Mordecai came before the king, because Esther had told what he was to her.
translation:
  language: te
  text: ఆ రోజున అహష్వేరోషు రాజు యూదుల శత్రువైన హామాను ఇంటిని రాణియైన ఎస్తేరుకు ఇచ్చాడు. ఎస్తేరు మొర్దెకై తనకు ఎవరో రాజుకు తెలియజేసినందువల్ల, అతడు రాజసన్నిధికి వచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הָמָן
  choice: హామాను ఇంటిని
  rationale: ‘ఇల్లు’ అనే మూలరూపాన్ని నిలుపుతూ, సందర్భానుసారంగా హామాను గృహం మరియు అతని ఆస్తి సముదాయాన్ని సూచించే విస్తృత భావానికి అవకాశం ఉంచుతుంది.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: యూదుల శత్రువైన
  rationale: צֹרֵר అనే పదంలోని విరోధి/పీడకుడు అనే భావాన్ని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: בָּא לִפְנֵי הַמֶּלֶךְ
  choice: రాజసన్నిధికి వచ్చాడు
  rationale: రాజు సమక్షంలో ప్రవేశించాడనే రాజసభా సందర్భాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַה הוּא לָהּ
  choice: తనకు ఏమవుతాడో
  rationale: మొర్దెకైతో ఎస్తేరుకు ఉన్న బంధాన్ని సూచిస్తూనే, మూలంలోని ఉద్దేశపూర్వక సాధారణతను కచ్చితమైన బంధుపేరుతో పరిమితం చేయదు.
theological_decisions:
- issue: మొర్దెకై–ఎస్తేరు బంధం యొక్క నిర్దిష్ట స్వరూపం
  choice: తనకు ఏమవుతాడో
  alternative: అతడు తన బంధువని
  rationale: ఈ వాక్యంలోని హెబ్రీ పాఠం బంధం ఏదో నిర్దిష్టంగా చెప్పదు; అందువల్ల ముందరి కథనం ఆధారంగా దానిని ఇక్కడే ప్రత్యేకంగా నిర్వచించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హెబ్రీ వాక్యంలోని కారణసంబంధాన్ని ‘తెలియజేసినందువల్ల’తో స్పష్టంగా నిలిపి, సంబంధ సూచనలోని అస్పష్టతను కాపాడింది.
