  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/י֣וֹם אֶחָ֔ד בְּ/כָל מְדִינ֖וֹת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֥דֶשׁ אֲדָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/012.yaml
  text: on one day in all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, that is, the month Adar.
translation:
  language: te
  text: అహష్వేరోషు రాజుకు చెందిన ప్రాంతాలన్నిటిలో ఒక రోజున, అంటే పన్నెండవ నెలైన అదారు నెల పదమూడవ రోజున.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם אֶחָד
  choice: ఒకే రోజున
  rationale: בְּ కాలసూచకంగా ‘రోజున’ అని అర్థమిస్తుంది; אֶחָד ఒకే నిర్ణీత రోజును సూచిస్తున్నందున సహజమైన తెలుగులో ‘ఒకే రోజున’ అని అనువదించాం.
- source_word: בְּכָל מְדִינוֹת
  choice: ప్రాంతాలన్నిటిలో
  rationale: מְדִינוֹת సామ్రాజ్యంలోని పరిపాలనా విభాగాలను సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘ప్రాంతాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజుకు చెందిన
  rationale: మూలంలోని సంబంధాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో వ్యక్తం చేశాం; పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר
  choice: పదమూడవ రోజున
  rationale: హీబ్రూలో సంఖ్యాపదం తేదీ సందర్భంలో క్రమసంఖ్యగా పనిచేస్తుంది; తెలుగులో స్పష్టత కోసం ‘రోజున’ చేర్చాం.
- source_word: לְחֹדֶשׁ שְׁנֵים עָשָׂר
  choice: పన్నెండవ నెలయైన
  rationale: ‘పన్నెండవ నెల’ అనే తేదీ సమాచారాన్ని తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా తదుపరి వివరణతో అనుసంధానించాం.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: అంటే ... అదారు నెల
  rationale: הוּא ఇక్కడ వివరణాత్మక సమానార్థక సంబంధాన్ని చూపుతుంది; ‘అంటే’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే తేదీ వాక్య నిర్మాణం వాడబడింది. ఇది పూర్వ వాక్యంపై ఆధారపడే ఖండవాక్యం కావడంతో మూలంలోని కొనసాగింపు స్వభావం నిలిపి ఉంచబడింది.
