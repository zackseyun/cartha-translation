- from: అహష్వేరోషు రాజుకు చెందిన ప్రాంతాలన్నిటిలో ఒకే రోజున, అంటే పన్నెండవ నెలయైన అదారు నెల పదమూడవ రోజున.
  to: అహష్వేరోషు రాజుకు చెందిన ప్రాంతాలన్నిటిలో ఒక రోజున, అంటే పన్నెండవ నెలైన అదారు నెల పదమూడవ రోజున.
