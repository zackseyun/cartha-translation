source:
  edition: WLC
  text: וּ/בְ/כָל מְדִינָ֨ה וּ/מְדִינָ֜ה וּ/בְ/כָל עִ֣יר וָ/עִ֗יר מְקוֹם֙ אֲשֶׁ֨ר דְּבַר הַ/מֶּ֤לֶךְ וְ/דָת/וֹ֙ מַגִּ֔יעַ שִׂמְחָ֤ה וְ/שָׂשׂוֹן֙ לַ/יְּהוּדִ֔ים מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וְ/רַבִּ֞ים מֵֽ/עַמֵּ֤י הָ/אָ֨רֶץ֙ מִֽתְיַהֲדִ֔ים כִּֽי נָפַ֥ל פַּֽחַד הַ/יְּהוּדִ֖ים עֲלֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/017.yaml
  text: And in every province and province, and in every city and city, wherever the king’s word and his decree reached, there was joy and gladness for the Jews, a feast and a good day. And many from the peoples of the land were becoming Jews, because the fear of the Jews had fallen on them.
translation:
  language: te
  text: ప్రతి ప్రాంతంలో, ప్రతి పట్టణంలో—రాజు మాట, అతని శాసనం ఎక్కడికి చేరాయో అక్కడ—యూదులకు ఆనందం, సంతోషం కలిగాయి; విందు, పండుగ జరిగాయి. దేశప్రజలలో అనేకులు యూదులుగా మారసాగారు[a], ఎందుకంటే యూదుల భయం వారిమీద పడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదులమని చెప్పుకుంటున్నారు” లేదా “యూదుల పక్షం వహిస్తున్నారు.” ఈ హీబ్రూ క్రియ బైబిలులో ఇక్కడ మాత్రమే కనిపిస్తుంది; వారు యూదు గుర్తింపును లేదా ఆచారాలను ఎంతవరకు స్వీకరించారో స్పష్టంగా లేదు.
    reason: అరుదైన מִתְיַהֲדִים అనే క్రియలోని నిజమైన పదార్థ అనిశ్చితిని సంరక్షించడానికి.
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה ... וּבְכָל עִיר וָעִיר
  choice: ప్రతి సంస్థానంలో, ప్రతి పట్టణంలో
  rationale: హీబ్రూ పదపునరుక్తి పంపిణీ భావాన్ని, అంటే ‘ప్రతి ఒక్క’ అనే అర్థాన్ని ఇస్తుంది; తెలుగులో సహజంగా అదే భావాన్ని వ్యక్తం చేశాం.
- source_word: דָת
  choice: శాసనం
  rationale: పర్షియా రాజసభ సందర్భంలో అధికారికంగా జారీ చేసిన రాజాజ్ఞ లేదా చట్టబద్ధమైన ఉత్తర్వు అనే భావాన్ని తెలియజేస్తుంది.
- source_word: מִשְׁתֶּה וְיוֹם טוֹב
  choice: విందు, పండుగ
  rationale: మొదటి పదం విందును, రెండవది ఉత్సవదినాన్ని సూచిస్తాయి; సహజమైన తెలుగు సమాంతర పదాలతో రెండింటినీ నిలిపాం.
- source_word: מִתְיַהֲדִים
  choice: యూదులుగా మారుతున్నారు
  rationale: ఈ అరుదైన హిత్పయేల్ రూపం యూదులుగా తమను చేసుకోవడం లేదా యూదులుగా ప్రకటించుకోవడం అనే భావాన్ని ఇస్తుంది; ప్రక్రియాత్మక రూపాన్ని ‘మారుతున్నారు’తో నిలిపాం.
- source_word: נָפַל פַּחַד הַיְּהוּדִים עֲלֵיהֶם
  choice: యూదుల భయం వారిమీద పడింది
  rationale: మూలంలోని స్పష్టమైన సామెతాత్మక నిర్మాణాన్ని, అలాగే ‘యూదుల పట్ల భయం’ అనే భావాన్ని సాధ్యమైనంత దగ్గరగా నిలిపాం.
theological_decisions:
- issue: מִתְיַהֲדִים క్రియ యొక్క స్వభావం
  choice: యూదులుగా మారుతున్నారు
  alternative: యూదులమని చెప్పుకుంటున్నారు / యూదుల ఆచారాలను స్వీకరిస్తున్నారు
  rationale: మూలక్రియ బాహ్య గుర్తింపును మాత్రమేనా, సంపూర్ణ మత-సామాజిక మార్పునా అన్నది పూర్తిగా నిర్ధారించదు. ప్రధాన పాఠంలో సాధారణ అర్థాన్ని ఉంచి, ఆ అనిశ్చితిని పాదసూచికలో తెలిపాం.
- issue: ‘యూదుల భయం’ కారణంగా మారడం
  choice: కారణ సంబంధాన్ని యథాతథంగా ఉంచడం
  alternative: వారి మార్పును నిజమైన విశ్వాసంగా వివరించడం
  rationale: వచనం స్పష్టంగా భయాన్నే కారణంగా చెబుతుంది; వారి అంతర్గత ఉద్దేశం లేదా మార్పు నిజస్వరూపంపై అదనపు ధార్మిక తీర్పు ఇవ్వలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని పంపిణీ పునరుక్తిని తెలుగు సహజ ‘ప్రతి’ నిర్మాణంతో అందించాం; అరుదైన క్రియలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
