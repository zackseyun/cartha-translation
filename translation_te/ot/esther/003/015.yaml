  text: הָֽ/רָצִ֞ים יָצְא֤וּ דְחוּפִים֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֑ה וְ/הַ/מֶּ֤לֶךְ וְ/הָמָן֙ יָשְׁב֣וּ לִ/שְׁתּ֔וֹת וְ/הָ/עִ֥יר שׁוּשָׁ֖ן נָבֽוֹכָה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/015.yaml
  text: The couriers went out[a], hurried by the king’s command, and the decree was issued in Susa the citadel. And the king and Haman sat down to drink[b], but the city of Susa was thrown into confusion.
translation:
  language: te
  text: రాజు ఆజ్ఞవల్ల తొందరపెట్టబడిన దూతలు బయలుదేరారు. ఆ శాసనం షూషను రాజకోటలో జారీ చేయబడింది.[a] రాజు, హామాను తాగడానికి కూర్చున్నారు; కానీ షూషను పట్టణం అయోమయానికి గురైంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ చట్టం షూషను రాజకోటలో ఇవ్వబడింది.” హీబ్రూ క్రియ అక్షరార్థంగా “ఇవ్వబడింది”; דָּת అనే పదాన్ని ఈ పారసీక పరిపాలనా సందర్భంలో “చట్టం” లేదా “శాసనం” అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “షూషను పట్టణం దిగ్భ్రాంతి చెందింది,” లేదా “కలవరపడింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: దూతలు
  rationale: పారసీక రాజపాలనా సందర్భంలో రాజాజ్ఞలను చేరవేసే అధికారిక సందేశవాహకులను సూచిస్తుంది; తెలుగులో ‘దూతలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: דְחוּפִים
  choice: త్వరత్వరగా
  rationale: వారిపై మోపబడిన అత్యవసరతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: రాజు ఆజ్ఞ ప్రకారం
  rationale: ఇక్కడ דָּבָר సాధారణ మాట కాక అధికారపూర్వక రాజాజ్ఞను సూచిస్తుంది.
- source_word: הַדָּת נִתְּנָה
  choice: ఆ శాసనం ... జారీ అయింది
  rationale: దָּת పారసీక పరిపాలనా సందర్భంలో అధికారిక శాసనాన్ని సూచిస్తుంది; నִתְּנָה అక్షరార్థంగా ‘ఇవ్వబడింది’ అయినా, ఇక్కడ అధికారికంగా ప్రకటించబడడం అనే భావాన్ని ‘జారీ అయింది’ సహజంగా అందిస్తుంది.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: షూషను కోటలో
  rationale: בִּירָה నగరంలోని కోటతో కూడిన రాజప్రాసాద సముదాయాన్ని సూచిస్తుంది; ‘కోట’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: יָשְׁבוּ לִשְׁתּוֹת
  choice: తాగడానికి కూర్చున్నారు
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా ప్రతిబింబిస్తూ, రాజు-హామానుల నిర్లిప్తతకూ నగర స్థితికీ మధ్య ఉన్న ఘాటు వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: נָבוֹכָה
  choice: అయోమయంలో పడిపోయింది
  rationale: నగర ప్రజలు కలవరానికి, దిక్కుతోచని స్థితికి లోనైన ఫలితభావాన్ని తెలియజేస్తుంది; ‘గందరగోళం’ కంటే మానసిక దిగ్భ్రాంతిని మెరుగ్గా వ్యక్తం చేస్తుంది.
- source_word: וְ
  choice: కానీ
  rationale: చివరి సంధిపదం రూపరీత్యా ‘మరియు’; అయితే రాజు, హామాను తాగుతుండగా నగరం అయోమయంలో ఉండడం అనే కథన వ్యత్యాసాన్ని తెలుగులో ‘కానీ’ స్పష్టంగా నిలుపుతుంది.
