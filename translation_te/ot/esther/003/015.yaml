translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పరిపాలనా సందర్భానికి తగిన ‘ఆజ్ఞ,’ ‘శాసనం,’ ‘జారీ’ పదాలను వాడి, చివరి వాక్యంలోని నైతిక-కథన వ్యత్యాసాన్ని ‘కానీ’తో నిలిపాం.
