translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పరిపాలనా శైలిని పాటించాం. మూలంలోని కర్మణి నిర్మాణాన్ని, అధికారుల స్థాయుల మధ్య భేదాన్ని, ‘లిపి—భాష’ వ్యత్యాసాన్ని నిలిపాం. స్పష్టంగా లేని పత్రానికి ‘శాసనం’ లేదా ‘ఆజ్ఞాపత్రం’ అనే నామవాచకాన్ని చేర్చకుండా ‘రాయబడింది’ అని ఉంచాం.
