  text: וַ/יִּקָּרְאוּ֩ סֹפְרֵ֨י הַ/מֶּ֜לֶךְ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֣ר יוֹם֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה הָמָ֡ן אֶ֣ל אֲחַשְׁדַּרְפְּנֵֽי הַ֠/מֶּלֶךְ וְֽ/אֶל הַ/פַּח֞וֹת אֲשֶׁ֣ר עַל מְדִינָ֣ה וּ/מְדִינָ֗ה וְ/אֶל שָׂ֤רֵי עַם֙ וָ/עָ֔ם מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ בְּ/שֵׁ֨ם הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרֹשׁ֙ נִכְתָּ֔ב וְ/נֶחְתָּ֖ם בְּ/טַבַּ֥עַת הַ/מֶּֽלֶךְ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/012.yaml
  text: Then the king’s scribes were summoned in the first month[a], on the thirteenth day of it, and it was written exactly as Haman commanded to the king’s satraps, to the governors who were over each province, and to the officials of each people, to every province in its own script and to every people in its own language[b]. It was written in the name of King Ahasuerus and sealed with the king’s signet ring.
translation:
  language: te
  text: అప్పుడు మొదటి నెల పదమూడవ రోజున రాజు లేఖకులు పిలిపించబడ్డారు. హామాను ఆజ్ఞాపించినదంతటి ప్రకారం రాజు క్షత్రపులకు, ఒక్కో ప్రాంతం మీద ఉన్న పాలకులకు, ఒక్కో ప్రజావర్గపు అధికారులకు రాయబడింది[a]—ప్రతి ప్రాంతానికి దాని సొంత లిపిలో[b], ప్రతి ప్రజావర్గానికి దాని సొంత భాషలో. అది అహష్వేరోషు రాజు పేరుతో రాయబడి, రాజముద్ర ఉంగరంతో ముద్రించబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “హామాను ఆజ్ఞాపించిన అన్నిటి ప్రకారం రాయబడింది.”
    reason: lexical_alternative
  - marker: b
    text: “లిపి” అనేది ప్రతి ప్రాంతంలో ఉపయోగించే వ్రాత విధానాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקָּרְאוּ
  choice: పిలిపించబడ్డారు
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతూ, రాజసభ అధికారిక సందర్భానికి సహజమైన ఆధునిక తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: סֹפְרֵי הַמֶּלֶךְ
  choice: రాజు లేఖకులు
  rationale: ఇక్కడి వారు రాజసభకు చెందిన అధికారిక లేఖకులు; ‘కార్యదర్శులు’ కంటే ‘లేఖకులు’ మూలపదానికి దగ్గరగా ఉంది.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: మొదటి నెల పదమూడవ రోజున
  rationale: మూలంలోని కాలసూచనను అనవసర విస్తరణ లేకుండా సహజమైన తెలుగు క్రమంలో తెలిపింది.
- source_word: כְּכָל אֲשֶׁר צִוָּה הָמָן
  choice: హామాను ఆజ్ఞాపించినదంతా యథాతథంగా
  rationale: כְּכָל తెలిపే సంపూర్ణ అనుగుణతను ‘అంతా యథాతథంగా’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: రాజు క్షత్రపులు
  rationale: పర్షియా సామ్రాజ్యంలోని ప్రత్యేక ఉన్నత పరిపాలనా పదవిని సాధారణ ‘పాలకులు’తో కలపకుండా చారిత్రక బిరుదును నిలిపింది.
- source_word: הַפַּחוֹת אֲשֶׁר עַל מְדִינָה וּמְדִינָה
  choice: ఒక్కో ప్రాంతం మీద నియమించబడిన పాలకులు
  rationale: క్షత్రపులకన్నా వేరైన పరిపాలనా అధికారులను సూచిస్తూ, పునరుక్తి తెలిపే విభజనార్థాన్ని ‘ఒక్కో’తో అందించింది.
- source_word: שָׂרֵי עַם וָעָם
  choice: ఒక్కో ప్రజావర్గపు అధికారులు
  rationale: పరిపాలనా జాబితిలో שָׂרִיםకు ‘అధికారులు’ సరిపోతుంది; ‘ప్రజావర్గం’ భిన్న జాతి-సమూహాలను సహజంగా సూచిస్తుంది.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: ప్రతి ప్రాంతానికి దాని సొంత లిపిలో
  rationale: כְּתָב ఇక్కడ భాషను కాక వ్రాత పద్ధతి లేదా లిపిని సూచిస్తుంది; అందుకే ‘లిపి’ని వాడాం.
- source_word: וְעַם וָעַם כִּלְשׁוֹנוֹ
  choice: ప్రతి ప్రజావర్గానికి దాని సొంత భాషలో
  rationale: లిపి మరియు భాష మధ్య మూలపాఠంలోని భేదాన్ని స్పష్టంగా నిలిపింది.
- source_word: וְנֶחְתָּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: రాజముద్ర ఉంగరంతో ముద్రించబడింది
  rationale: טַבַּעַתను సాధారణ ఉంగరంగా కాక అధికారిక ముద్రగల ఉంగరంగా సందర్భానుసారం వ్యక్తం చేసింది.
