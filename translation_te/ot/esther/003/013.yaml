  text: וְ/נִשְׁל֨וֹחַ סְפָרִ֜ים בְּ/יַ֣ד הָ/רָצִים֮ אֶל כָּל מְדִינ֣וֹת הַ/מֶּלֶךְ֒ לְ/הַשְׁמִ֡יד לַ/הֲרֹ֣ג וּ/לְ/אַבֵּ֣ד אֶת כָּל הַ֠/יְּהוּדִים מִ/נַּ֨עַר וְ/עַד זָקֵ֜ן טַ֤ף וְ/נָשִׁים֙ בְּ/י֣וֹם אֶחָ֔ד בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֣דֶשׁ אֲדָ֑ר וּ/שְׁלָלָ֖/ם לָ/בֽוֹז־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/013.yaml
  text: Letters were sent by the hand of the couriers to all the provinces of the king[a], to destroy, to kill, and to annihilate all the Jews, from young man to old man, children and women, in one day, on the thirteenth day of the twelfth month, that is, the month Adar[d][c][b], and to plunder their spoil.
translation:
  language: te
  text: రాజు పాలనలోని అన్ని రాష్ట్రాలకు దూతల ద్వారా ఉత్తరాలు పంపబడ్డాయి[a]. వాటిలో యూదులందరినీ—బాలుని నుండి వృద్ధుని వరకు[c], పిల్లలనూ స్త్రీలనూ—పన్నెండవ నెలైన అదారు నెల పదమూడవ రోజున, అంటే ఒకే రోజున, నాశనం చేయాలని, చంపాలని, నిర్మూలించాలని[b], వారి ఆస్తులను దోచుకోవాలని[d] ఆజ్ఞాపించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పరుగెత్తేవారి చేతి ద్వారా”; వీరు రాజ ఉత్తరాలను తీసుకెళ్లే దూతలు.
    reason: lexical_alternative
  - marker: b
    text: “నాశనం చేయడం, చంపడం, నిర్మూలించడం” అనే మూడు క్రియలను హీబ్రూ ఆజ్ఞలో ఉద్దేశపూర్వకంగా వరుసగా వాడి దాని తీవ్రతను పెంచారు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “చిన్నవారి నుండి పెద్దవారి వరకు.” హీబ్రూలో అక్షరార్థంగా “బాలుని నుండి వృద్ధుని వరకు”; ఇది మొత్తం వయోవర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: 'అక్షరార్థానికి దగ్గరగా, “వారి దోపుడు సొత్తును దోచుకోవాలని”; భావం: వారి వస్తుసంపదను దోపిడీగా స్వాధీనం చేసుకోవడం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁלוֹחַ סְפָרִים
  choice: ఉత్తరాలు పంపబడ్డాయి
  rationale: రాజ పరిపాలనా సందర్భంలోని వ్రాతపూర్వక సమాచారాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, హీబ్రూ నిష్క్రియ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בְּיַד הָרָצִים
  choice: దూతల ద్వారా
  rationale: అక్షరార్థంగా ‘పరుగెత్తేవారి చేతి ద్వారా’; సందర్భంలో వీరు రాజదూతలు/వార్తాహరులు. తెలుగు సహజ ప్రయోగం కోసం ‘ద్వారా’ వాడబడింది.
- source_word: אֶל כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: రాజు పాలించే రాష్ట్రాలన్నిటికీ
  rationale: మְדִינוֹת అనే పరిపాలనా విభాగ భావాన్ని ‘రాష్ట్రాలు’ తెలియజేస్తుంది; సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: నాశనం చేయాలని, చంపాలని, నిర్మూలించాలని
  rationale: మూడు సమీపార్థక క్రియల ఉద్దేశపూర్వక తీవ్రతను తగ్గించకుండా నిలుపుతుంది.
- source_word: אֶת כָּל הַיְּהוּדִים
  choice: యూదులందరినీ
  rationale: כָּל లోని సంపూర్ణతను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: బాలుని నుండి వృద్ధుని వరకు
  rationale: హీబ్రూలోని ఏకవచన, పుంలింగ పదరూపాలను మరియు సమస్త వయోవర్గాలను సూచించే విస్తృతిని రెండింటినీ నిలుపుతుంది.
- source_word: טַף וְנָשִׁים
  choice: పిల్లలనూ స్త్రీలనూ
  rationale: పోరాటంలో పాల్గొనని పిల్లలు, స్త్రీలు కూడా ఆజ్ఞలో చేర్చబడ్డారని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּיוֹם אֶחָד
  choice: ఒకే రోజున
  rationale: హింసను ఒక నిర్దిష్ట రోజులోనే జరపాలన్న కేంద్రీకృత కాలార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: పన్నెండవ నెల, అంటే అదారు నెల, పదమూడవ రోజున
  rationale: హీబ్రూ తేదీ సూత్రాన్ని తెలుగు క్రమంలో సహజంగా అమర్చి, ‘అదారు’ అనే నెలపేరును వివరణాత్మకంగా ఉంచుతుంది.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: వారి ఆస్తిని దోచుకోవాలని
  rationale: వారి వస్తుసంపదను దోపిడీగా స్వాధీనం చేసుకోవాలనే అర్థాన్ని సహజ తెలుగులో అందిస్తుంది; మూలంలోని నామ-క్రియా పదప్రయోగం పాదటిప్పణిలో సూచించబడింది.
