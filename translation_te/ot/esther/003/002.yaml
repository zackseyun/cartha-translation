source:
  edition: WLC
  text: וְ/כָל עַבְדֵ֨י הַ/מֶּ֜לֶךְ אֲשֶׁר בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ כֹּרְעִ֤ים וּ/מִֽשְׁתַּחֲוִים֙ לְ/הָמָ֔ן כִּי כֵ֖ן צִוָּה ל֣/וֹ הַ/מֶּ֑לֶךְ וּ/מָ֨רְדֳּכַ֔י לֹ֥א יִכְרַ֖ע וְ/לֹ֥א יִֽשְׁתַּחֲוֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/002.yaml
  text: And all the king’s servants who were at the king’s gate were bowing down and paying homage to Haman[a], for the king had so commanded concerning him[b]. But Mordecai would not bow down or pay homage.
translation:
  language: te
  text: రాజద్వారం దగ్గర ఉన్న రాజసేవకులందరూ హామాను ఎదుట వంగి అతనికి సాష్టాంగ నమస్కారం చేస్తూ ఉండేవారు[a]; ఎందుకంటే అతని విషయంలో రాజు అలా ఆజ్ఞాపించాడు[b]. అయితే మొర్దెకై వంగడానికీ సాష్టాంగ నమస్కారం చేయడానికీ నిరాకరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “హామాను ఎదుట సాగిలపడుతూ ఉండేవారు.” ఈ హీబ్రూ క్రియ కర్మగా దేవుడు ఉన్న సందర్భాల్లో “ఆరాధించడం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఎందుకంటే రాజు అతనికి అలా ఆజ్ఞాపించాడు.” అయితే ఇక్కడి సర్వనామం హామానును సూచిస్తుందని, అంటే అతనికి ఇవ్వవలసిన గౌరవం గురించి ఆజ్ఞ అని అర్థం చేసుకోవడం మరింత సహజం.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: రాజసేవకులు
  rationale: రాజాస్థాన సందర్భంలో עֶבֶד రాజు సేవలో ఉన్నవారిని సూచిస్తుంది. ‘బానిసలు’ అనడం ఇక్కడ వారి సామాజిక స్థితిని అతిగా నిర్దిష్టం చేస్తుంది; ‘అధికారులు’ అనడం మూలపద పరిధిని కుదిస్తుంది.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: రాజద్వారం దగ్గర
  rationale: ఇది రాజకార్యాలు జరిగే బహిరంగ/పరిపాలనా ప్రదేశాన్ని సూచించే స్పష్టమైన స్థలపదబంధం. ఆధునిక తెలుగులో ‘దగ్గర’ సహజంగా ఉంటుంది.
- source_word: כֹּרְעִים
  choice: వంగి
  rationale: కృదంత రూపం అలవాటుగా లేదా కొనసాగుతూ జరిగిన చర్యను సూచిస్తుంది. తరువాతి క్రియతో కలిపి శరీరాన్ని వంచి విధేయత చూపడాన్ని తెలియజేస్తుంది.
- source_word: וּמִשְׁתַּחֲוִים
  choice: సాష్టాంగ నమస్కారం చేస్తూ ఉండేవారు
  rationale: ఈ క్రియ దేవుని ఆరాధించడానికీ, మనుషుల ఎదుట నేలవంగి గౌరవం చూపడానికీ వాడవచ్చు. ఇక్కడ హామాను కర్మగా ఉన్నందున ప్రత్యేకంగా మతపరమైన ‘ఆరాధించు’ అనే భావాన్ని రుద్దకుండా, శారీరక వినయప్రదర్శనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְהָמָן
  choice: హామాను ఎదుట
  rationale: ఎవరికి విధేయతతో వంగుతున్నారో సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּי כֵן צִוָּה לוֹ הַמֶּלֶךְ
  choice: ఎందుకంటే అతని విషయంలో రాజు అలా ఆజ్ఞాపించాడు
  rationale: לוֹ అనే సర్వనామం హామానును సూచిస్తూ, అతనికి ఇవ్వవలసిన గౌరవం గురించి రాజాజ్ఞ ఉందనే ప్రధాన అవగాహనను వ్యక్తం చేస్తుంది; వ్యాకరణపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: וּמָרְדֳּכַי
  choice: అయితే మొర్దెకై
  rationale: మూలంలోని సాధారణ సంధి ఇక్కడ ముందున్న అందరి ప్రవర్తనకు మొర్దెకై ప్రవర్తనను బలంగా వ్యతిరేకిస్తుంది; ‘అయితే’ ఆ విరుద్ధతను సహజంగా తెలియజేస్తుంది.
- source_word: לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  choice: వంగడానికీ సాష్టాంగ నమస్కారం చేయడానికీ నిరాకరించాడు
  rationale: అసంపూర్ణ క్రియారూపాలు సందర్భంలో మొర్దెకై ఉద్దేశపూర్వకంగా, నిరంతరంగా తిరస్కరించడాన్ని సూచిస్తాయి. ‘నిరాకరించాడు’ ఆ సంకల్పపూర్వక భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: הִשְׁתַּחֲוָה అనే క్రియను ఇక్కడ మతపరమైన ‘ఆరాధన’గా అనువదించాలా?
  choice: ‘సాష్టాంగ నమస్కారం చేయడం’ అని అనువదించడం
  alternative: ‘ఆరాధించడం’ లేదా ‘గౌరవంతో నేలవంగడం’
  rationale: హీబ్రూ క్రియ దేవుని ఆరాధనకూ, మానవునికి చూపే రాజాస్థాన గౌరవానికీ వాడబడుతుంది. ఇక్కడ స్వీకర్త హామాను కనుక ‘ఆరాధన’ అని అనడం మూలం తప్పనిసరిగా చెప్పని మతపరమైన నిర్ణయాన్ని చేర్చుతుంది. శారీరకంగా నేలవంగే భావాన్ని ఉంచడం ద్వారా అంతర్లీన theological tensionను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ‘రాజద్వారం,’ ‘రాజసేవకులు’ వంటి పదాలు రాజాస్థాన సందర్భాన్ని కాపాడుతాయి. ‘సాష్టాంగ నమస్కారం’ సాధారణ పాఠకునికి శరీరాన్ని పూర్తిగా వంచే గౌరవచర్యగా అర్థమయ్యేలా ఉండి, ‘ఆరాధన’ అనే నిర్దిష్ట మతపరమైన భావాన్ని ప్రధాన పాఠ్యంలో రుద్దదు.
