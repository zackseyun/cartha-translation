  yaml_path: translation/ot/esther/003/014.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made known to all the peoples[b], so that they would be ready for this day.
translation:
  language: te
  text: ఆ లిఖిత ఆజ్ఞ ప్రతిని ప్రతి ప్రాంతంలో[a] చట్టంగా జారీ చేయవలసి ఉంది; అది ప్రజలందరికీ బహిరంగంగా తెలియజేయబడాలి, తద్వారా వారు ఈ రోజుకు[b] సిద్ధంగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ప్రాంతం’ అనే పదం పంపిణీయమైన బలాన్ని ఇవ్వడానికి పునరుక్తమైంది; అంటే, ‘ప్రతి ఒక్క ప్రాంతంలో.’
    reason: lexical_alternative
  - marker: b
    text: సందర్భంలో, ఆజ్ఞలో నిర్దేశించబడిన రోజును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: ఆ పత్రపు ప్రతి
  rationale: పర్షియన్ పరిపాలనా సందర్భంలో ఇది అధికారిక పత్రం యొక్క ప్రతిని సూచిస్తుంది. ‘పత్రపు ప్రతి’ సహజమైన ఆధునిక తెలుగు; ‘ఆ’ నిర్దిష్ట పత్రాన్ని సూచిస్తుంది.
- source_word: לְהִנָּתֵן דָּת
  choice: చట్టంగా జారీ చేసి
  rationale: నతన్ క్రియ యొక్క నిష్క్రియార్థం అధికారికంగా జారీ చేయడాన్ని, דָּת ఆ ఆజ్ఞకు ఉన్న చట్టబద్ధ బలాన్ని తెలియజేస్తాయి.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: ప్రతి సంస్థానంలో
  rationale: హీబ్రూలో ‘సంస్థానం’ పదం పంపిణీయ బలార్థంలో పునరుక్తమైంది. తెలుగులో సహజంగా ‘ప్రతి సంస్థానంలో’ అని ఇచ్చి, పునరుక్తి విషయాన్ని పాదసూచికలో నిలిపాం.
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: ప్రజలందరికీ బహిరంగంగా తెలియజేయాలి
  rationale: גָּלוּי బహిరంగ ప్రకటన భావాన్ని కలిగిస్తుంది; עַמִּים సామ్రాజ్యంలోని విభిన్న ప్రజాసమూహాలను సూచిస్తుంది.
- source_word: לִהְיוֹת עֲתִדִים
  choice: సిద్ధంగా ఉండాలి
  rationale: ఇది ఉద్దేశం లేదా ఫలితాన్ని సూచించే సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: לַיּוֹם הַזֶּה
  choice: ఆ రోజుకు
  rationale: అక్షరార్థంగా ‘ఈ రోజుకు’ అయినా, సందర్భంలో పత్రంలో ముందుగా నిర్దేశించిన రోజును సూచిస్తున్నందున తెలుగు సూచనరీతికి అనుగుణంగా ‘ఆ రోజుకు’ అని ఇచ్చాం; అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
