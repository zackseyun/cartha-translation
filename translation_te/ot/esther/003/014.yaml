  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పరిపాలనా శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని ఉద్దేశార్థ సంబంధాన్ని ‘తద్వారా’తో స్పష్టంగా ఉంచాం.
