- from: ఆ పత్రపు ప్రతిని ప్రతి సంస్థానంలో[a] చట్టంగా జారీ చేసి, ప్రజలందరికీ బహిరంగంగా తెలియజేయాలి; తద్వారా వారు ఆ రోజుకు[b] సిద్ధంగా ఉండాలి.
  to: ఆ లిఖిత ఆజ్ఞ ప్రతిని ప్రతి ప్రాంతంలో[a] చట్టంగా జారీ చేయవలసి ఉంది; అది ప్రజలందరికీ బహిరంగంగా తెలియజేయబడాలి, తద్వారా వారు ఈ రోజుకు[b] సిద్ధంగా ఉండాలి.
  rationale: The revision preserves the Hebrew’s official-publication sequence and purpose clause, uses modern Telugu administrative language, avoids the overly specific political sense of “సంస్థానం,” and retains the source’s proximal “ఈ రోజు” rather than resolving it in the main text as “ఆ రోజు.”
