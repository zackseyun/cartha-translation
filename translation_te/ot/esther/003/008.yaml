source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָמָן֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ יֶשְׁנ֣/וֹ עַם אֶחָ֗ד מְפֻזָּ֤ר וּ/מְפֹרָד֙ בֵּ֣ין הָֽ/עַמִּ֔ים בְּ/כֹ֖ל מְדִינ֣וֹת מַלְכוּתֶ֑/ךָ וְ/דָתֵי/הֶ֞ם שֹׁנ֣וֹת מִ/כָּל עָ֗ם וְ/אֶת דָּתֵ֤י הַ/מֶּ֨לֶךְ֙ אֵינָ֣/ם עֹשִׂ֔ים וְ/לַ/מֶּ֥לֶךְ אֵין שֹׁוֶ֖ה לְ/הַנִּיחָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/008.yaml
  text: Then Haman said to King Ahasuerus[a], “There is a certain people, scattered and separated among the peoples in all the provinces of your kingdom. Their laws are different from those of every other people, and they do not keep the king’s laws, so it is not in the king’s interest to let them remain.”
translation:
  language: te
  text: 'అప్పుడు హామాను అహష్వేరోషు రాజుతో ఇలా అన్నాడు: “మీ రాజ్యంలోని అన్ని పరిపాలనా ప్రాంతాల్లో ప్రజల మధ్య చెల్లాచెదురై, వేరుపడి ఉన్న ఒక ప్రజాసమూహం ఉంది. వారి చట్టాలు ప్రజలందరి చట్టాలకంటే భిన్నమైనవి. వారు రాజు చట్టాలను పాటించరు. కాబట్టి వారిని అలాగే ఉండనివ్వడం[a] రాజుకు ప్రయోజనకరం కాదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని పట్టించుకోకుండా వదిలేయడం”; “వారిని సహించడం.” హెబ్రీ క్రియకు ఎవరినైనా అలాగే ఉండనివ్వడం లేదా కలతపెట్టకుండా కొనసాగనివ్వడం అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשְׁנוֹ עַם אֶחָד
  choice: ఒక జాతి ఉంది
  rationale: ఈ పదబంధం నిర్దిష్టంగా పేరు చెప్పకుండా ఒక ప్రజాసమూహాన్ని సూచిస్తుంది. తెలుగులో ‘ఒక జాతి’ సహజంగా ఉండి, హామాను ఉద్దేశపూర్వకంగా వారి పేరు చెప్పకుండా చేసిన ఆరోపణ ధోరణిని నిలుపుతుంది.
- source_word: מְפֻזָּר וּמְפֹרָד
  choice: చెల్లాచెదురై, వేరుపడి ఉన్న
  rationale: మూలంలోని రెండు భాగవాచకాలను విడివిడిగా ప్రతిబింబిస్తుంది. రెండవ పదాన్ని అంతర్గత విభేదంగా కాకుండా ఇతరుల మధ్య వేరుగా ఉన్న స్థితిగా ఉంచుతుంది.
- source_word: בֵּין הָעַמִּים
  choice: ఇతర ప్రజల మధ్య
  rationale: సామ్రాజ్యంలో ఉన్న వివిధ ప్రజాసమూహాలను సూచిస్తుంది. సందర్భాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘ఇతర’ చేర్చబడింది; ఇది కొత్త భావాన్ని జోడించదు.
- source_word: בְּכֹל מְדִינוֹת מַלְכוּתֶךָ
  choice: మీ రాజ్యంలోని అన్ని సంస్థానాల్లో
  rationale: ఎస్తేరు గ్రంథంలో מְדִינוֹת అనేది పరిపాలనా విభాగాలను సూచిస్తుంది; ‘సంస్థానాలు’ ఆ సామ్రాజ్య సందర్భానికి సరిపోతుంది.
- source_word: דָתֵיהֶם
  choice: వారి చట్టాలు
  rationale: రాజు చట్టాలతో ఉన్న ప్రత్యక్ష వ్యత్యాసాన్ని నిలుపుతూ, న్యాయపరమైన బలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שֹׁנוֹת מִכָּל עָם
  choice: ఇతర ప్రజలందరి చట్టాలకంటే భిన్నమైనవి
  rationale: పోలిక ప్రజలకూ ప్రజలకూ మధ్య కాకుండా వారి చట్టాల మధ్య ఉందని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְאֶת דָּתֵי הַמֶּלֶךְ אֵינָם עֹשִׂים
  choice: వారు రాజు చట్టాలను పాటించరు
  rationale: చట్టాలకు సంబంధించి עָשָׂה అంటే వాటిని ఆచరించడం లేదా పాటించడం; ‘పాటించరు’ ఆధునిక తెలుగులో సహజమైన న్యాయపరమైన వాడుక.
- source_word: וְלַמֶּלֶךְ אֵין שֹׁוֶה
  choice: రాజుకు ప్రయోజనకరం కాదు
  rationale: ఈ వ్యక్తీకరణ రాజుకు లాభం లేదా మేలు ఉండదనే హామాను వాదనను గంభీరమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְהַנִּיחָם
  choice: వారిని అలాగే ఉండనివ్వడం
  rationale: ఈ సందర్భంలో హిఫిల్ రూపం వారిని వదిలివేయడం, ఉండనివ్వడం, కలతపెట్టకుండా కొనసాగనివ్వడం అనే భావాలను కలిగి ఉంది. ప్రధాన పాఠం ఆ విస్తృత భావాన్ని అతిగా తీవ్రతరం చేయకుండా నిలుపుతుంది.
