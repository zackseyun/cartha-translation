  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣רְא הָמָ֔ן כִּי אֵ֣ין מָרְדֳּכַ֔י כֹּרֵ֥עַ וּ/מִֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יִּמָּלֵ֥א הָמָ֖ן חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/005.yaml
  text: When Haman saw that Mordecai was neither bowing down nor prostrating himself before him[a], Haman was filled with rage.
translation:
  language: te
  text: హామాను, మొర్దెకై తనకు మోకరించడంగానీ తన ఎదుట సాష్టాంగపడడంగానీ చేయకపోవడాన్ని చూసినప్పుడు, తీవ్రమైన కోపంతో నిండిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వంగి నమస్కరించడంగానీ గౌరవార్థం వందనం చేయడంగానీ చేయకపోవడం.’ హెబ్రీలో గౌరవసూచక నమస్కారానికి సంబంధించిన, పరస్పర సంబంధమున్నా వేర్వేరు రెండు క్రియలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసినప్పుడు
  rationale: వావ్-క్రమబద్ధ క్రియ కథనాన్ని ముందుకు నడిపిస్తుంది; సందర్భంలోని కాలసంబంధ భావాన్ని సహజమైన తెలుగు ఉపవాక్యంతో వ్యక్తం చేస్తుంది.
- source_word: כִּי אֵין מָרְדֳּכַי
  choice: మొర్దెకై ... చేయకపోవడం
  rationale: אֵין తో కూడిన వర్తమాన క్రియారూపాలు మొర్దెకై నిరంతరంగా నిరాకరించిన చర్యను సూచిస్తాయి; తెలుగులో క్రియానామ నిర్మాణం సహజంగా ఉంటుంది.
- source_word: כֹּרֵעַ
  choice: మోకరించక
  rationale: כרע మోకాళ్లు వంచడం లేదా వంగడాన్ని సూచిస్తుంది. రాజాస్థాన గౌరవసూచక సందర్భంలో ‘మోకరించు’ శారీరక చర్యను స్పష్టంగా, అతిగా వివరించకుండా తెలియజేస్తుంది.
- source_word: וּמִשְׁתַּחֲוֶה
  choice: సాష్టాంగపడక
  rationale: השתחוה సాధారణంగా నేలవరకు వంగి ప్రణమిల్లే శారీరక చర్యను సూచిస్తుంది. ‘సాష్టాంగపడు’ మొదటి క్రియతో భేదాన్ని నిలుపుతూ బలమైన శరీర భంగిమను తెలియజేస్తుంది.
- source_word: לוֹ
  choice: తన ఎదుట
  rationale: అక్షరార్థంగా ‘అతనికి’ అయినా, ఇలాంటి గౌరవసూచక శారీరక చర్యలు తెలుగులో సహజంగా ‘అతని ఎదుట’ జరుగుతాయని చెబుతారు. ‘తన’ ఇక్కడ హామానును సూచిస్తుంది.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: తీవ్రమైన కోపంతో నిండిపోయాడు
  rationale: ‘నిండిపోవడం’ అనే హెబ్రీ నుడికారాన్ని నిలుపుతూ, חֵמָה సూచించే ఉగ్రతను ఆధునిక సహజ తెలుగులో ‘తీవ్రమైన కోపం’గా వ్యక్తం చేస్తుంది.
- source_word: חֵמָה
  choice: తీవ్రమైన కోపం
  rationale: ఈ కథన సందర్భంలో హామాను పొందిన ఉగ్ర ఆగ్రహాన్ని స్పష్టంగా తెలియజేస్తుంది; దైవిక ఉగ్రతకు మాత్రమే పరిమితమైన పదప్రయోగాన్ని రుద్దదు.
