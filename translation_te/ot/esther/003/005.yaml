translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. హెబ్రీలోని రెండు గౌరవసూచక శారీరక చర్యల మధ్య భేదాన్ని ‘మోకరించు’ మరియు ‘సాష్టాంగపడు’ ద్వారా నిలిపింది; పాదసూచిక ప్రత్యామ్నాయంగా విస్తృత కార్యార్థాన్ని తెలియజేస్తుంది.
