source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/הָמָ֔ן הַ/כֶּ֖סֶף נָת֣וּן לָ֑/ךְ וְ/הָ/עָ֕ם לַ/עֲשׂ֥וֹת בּ֖/וֹ כַּ/טּ֥וֹב בְּ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/011.yaml
  text: Then the king said to Haman[a], “The silver is given to you, and the people also[b], to do with them as seems good in your eyes.”
translation:
  language: te
  text: అప్పుడు రాజు హామానుతో, “వెండి నీకు ఇవ్వబడింది[a]; ప్రజలు కూడా నీకు అప్పగించబడ్డారు. వారి విషయంలో నీ దృష్టికి మంచిదనిపించినట్లు చేయి[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “డబ్బు నీకు ఇవ్వబడింది.” హీబ్రూ పదం כֶּסֶף అక్షరార్థంగా ‘వెండి’ అని, విస్తృతార్థంగా ‘డబ్బు’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘ప్రజలు’ అనే పదం వ్యాకరణరీత్యా ఏకవచన సమూహవాచకం; దానిని సూచించే సర్వనామం కూడా ఏకవచనంలో ఉంది. తెలుగులో సహజార్థం కోసం ‘వారి విషయంలో’ అని బహువచనంగా అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: మూలంలో వ్యక్తిపేరు కాక రాజబిరుదే ఉంది; తెలుగులో సందర్భానుసారంగా నిర్దిష్టత స్పష్టంగా ఉంటుంది.
- source_word: לְהָמָן
  choice: హామానుతో
  rationale: మాట ఎవరిని ఉద్దేశించి పలికిందో తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַכֶּסֶף
  choice: వెండి
  rationale: כֶּסֶף యొక్క ప్రాథమిక అర్థం ‘వెండి’; సందర్భంలో అది ధనాన్ని కూడా సూచించవచ్చు కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נָתוּן לָךְ
  choice: నీకే ఇవ్వబడింది
  rationale: హామాను ఆధీనంలో ఉంచబడినదనే నిష్క్రియ భావాన్ని నిలుపుతుంది; ‘కే’ అతనికే అప్పగింపబడిన రెండు అంశాల అనుసంధానాన్ని సహజంగా చేస్తుంది.
- source_word: וְהָעָם
  choice: ఆ ప్రజలు కూడా నీకే అప్పగించబడ్డారు
  rationale: హీబ్రూలో ఇది సమూహవాచక ఏకవచనం; తెలుగులో ప్రజలను సూచించేటప్పుడు బహువచన క్రియ సహజం. మూలంలోని సంక్షిప్త నిర్మాణాన్ని భావస్పష్టత కోసం పూర్తి వాక్యఖండంగా ఇచ్చాం.
- source_word: לַעֲשׂוֹת בּוֹ
  choice: అది వారిపట్ల చేయి
  rationale: בּוֹ రూపరీత్యా ఏకవచనమైనా, సమూహవాచకమైన ‘ప్రజలు’నే సూచిస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘వారిపట్ల’ అని ఇచ్చాం.
- source_word: כַּטּוֹב בְּעֵינֶיךָ
  choice: నీ దృష్టికి ఏది మంచిదనిపిస్తే
  rationale: ‘నీ కళ్లలో మంచిది’ అనే హీబ్రూ రూపకాన్ని ‘నీ దృష్టికి’ ద్వారా నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యేలా చేశాం.
