translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన రాజసభా శైలిని పాటించాం. హామాను నేరుగా రాజుతో మాట్లాడుతున్నందున ‘రాజు’ అనే తృతీయపురుష సంబోధనా నిర్మాణాన్ని నిలిపాం. మూలంలోని వాక్యప్రవాహం తెలుగులో స్పష్టంగా ఉండేందుకు రెండు వాక్యాలుగా విభజించాం; కార్యనిర్వాహకుల ఖచ్చిత గుర్తింపు మరియు עַל יְדֵי యొక్క agency/entrustment ద్వంద్వార్థాన్ని పాదసూచికలో సంరక్షించాం.
