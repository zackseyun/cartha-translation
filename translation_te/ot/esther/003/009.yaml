source:
  edition: WLC
  text: אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב יִכָּתֵ֖ב לְ/אַבְּדָ֑/ם וַ/עֲשֶׂ֨רֶת אֲלָפִ֜ים כִּכַּר כֶּ֗סֶף אֶשְׁקוֹל֙ עַל יְדֵי֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה לְ/הָבִ֖יא אֶל גִּנְזֵ֥י הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/009.yaml
  text: If it seems good to the king[a], let it be written that they be destroyed, and I will weigh out ten thousand talents of silver into the hands of those who do the work[c][b], to bring it into the king’s treasuries.
translation:
  language: te
  text: రాజుకు మంచిదనిపిస్తే[a], వారిని నాశనం చేయాలని వ్రాయబడాలి. నేను పదివేల తలాంతుల[b] వెండిని ఆ పని చేసేవారి చేతుల్లోకి[c] తూచి ఇస్తాను, దానిని రాజు ఖజానాల్లోకి చేర్చడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజుకు ఇష్టమైతే.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “పదివేల తలాంతుల వెండి.” తలాంతు నాణెం కాదు, బరువు ప్రమాణం; ఇది అత్యంత పెద్ద మొత్తాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, “ఆ పని చేసేవారి ద్వారా”; అంటే, దానిని అమలు చేసే కార్యనిర్వాహకుల ద్వారా.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: రాజుకు మంచిదనిపిస్తే
  rationale: రాజు ఆమోదాన్ని లేదా ఇష్టాన్ని తెలిపే హీబ్రూ రాజసభా నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో, దాని పదచిత్రానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: יִכָּתֵב
  choice: వ్రాయించాలి
  rationale: అక్షరార్థంగా ‘వ్రాయబడాలి’; రాజసభ సందర్భంలో అధికారికంగా వ్రాతపూర్వక ఆజ్ఞ జారీ చేయడాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం కర్తృప్రేరణ రూపం వాడినా, ‘శాసనం’ అని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: לְאַבְּדָם
  choice: వారిని నాశనం చేయాలని
  rationale: వ్రాయవలసిన ఆజ్ఞలోని ప్రాణాంతక ఉద్దేశాన్ని స్పష్టంగా, అదనపు తీవ్రతను చేర్చకుండా అందిస్తుంది.
- source_word: כִּכַּר כֶּסֶף
  choice: తలాంతుల వెండి
  rationale: כִּכָּר నాణెం కాక బరువు ప్రమాణం. సంప్రదాయ పారదర్శక పదమైన ‘తలాంతు’ను ఉంచి వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: אֶשְׁקוֹל
  choice: తూచి ఇస్తాను
  rationale: שקל యొక్క మౌలిక అర్థం ‘తూచుట’. చెల్లింపు భావం సందర్భంలో ఉన్నందున తెలుగులో ‘ఇస్తాను’ను జోడించి బరువుతో కొలిచే చిత్రాన్ని నిలిపాం.
- source_word: עַל יְדֵי
  choice: చేతికి
  rationale: ఈ నుడికారం ‘చేతిలోకి’ అనే అప్పగింపు భావాన్నీ, ‘ద్వారా’ అనే కార్యసాధక భావాన్నీ అనుమతిస్తుంది; ప్రధాన పాఠం మొదటి భావాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: ఆ పని చేసేవారు
  rationale: వీరు అధికారులు లేదా కార్యనిర్వాహకులు కావచ్చుగానీ, హీబ్రూ వారి గుర్తింపును విస్తృతంగానే ఉంచుతుంది; అందువల్ల మరింత నిర్దిష్టమైన పదాన్ని చేర్చలేదు.
- source_word: גִּנְזֵי הַמֶּלֶךְ
  choice: రాజు ఖజానాలు
  rationale: హీబ్రూలోని బహువచనాన్ని నిలిపి, ఆధునిక పాఠకులకు సులభంగా అర్థమయ్యే సాధారణ పదాన్ని ఎంచుకున్నాం.
