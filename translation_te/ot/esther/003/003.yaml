source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ עַבְדֵ֥י הַ/מֶּ֛לֶךְ אֲשֶׁר בְּ/שַׁ֥עַר הַ/מֶּ֖לֶךְ לְ/מָרְדֳּכָ֑י מַדּ֨וּעַ֙ אַתָּ֣ה עוֹבֵ֔ר אֵ֖ת מִצְוַ֥ת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/003.yaml
  text: Then the king’s servants who were at the king’s gate said to Mordecai[a], “Why are you transgressing the king’s command?”
translation:
  language: te
  text: అప్పుడు రాజద్వారం దగ్గర ఉన్న రాజు సేవకులు మొర్దెకైతో, “నీవు రాజు ఆజ్ఞను ఎందుకు ఉల్లంఘిస్తున్నావు?” అని అడిగారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు ... అని అడిగారు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; సందర్భంలో ప్రశ్న పలికినందున తెలుగులో ‘అప్పుడు ... అని అడిగారు’ సహజంగా ఉంటుంది.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: రాజు సేవకులు
  rationale: עֶבֶד అనే పదానికి ప్రాథమికంగా ‘సేవకుడు’ అనే అర్థం ఉంది. వీరు రాజద్వారం వద్ద పనిచేసే రాజసేవకులైనా, మూలపదాన్ని అనవసరంగా ‘అధికారులు’గా విస్తరించకుండా ‘సేవకులు’గా అనువదించాం.
- source_word: אֲשֶׁר בְּשַׁעַר הַמֶּלֶךְ
  choice: రాజద్వారం దగ్గర ఉన్న
  rationale: ఈ పదబంధం సేవకుల స్థానాన్ని సూచిస్తుంది. ‘రాజద్వారం దగ్గర’ ఆధునిక తెలుగులో సహజంగా ఉండి, రాజసభ పరిసరాన్ని నిలుపుతుంది.
- source_word: לְמָרְדֳּכָי
  choice: మొర్దెకైతో
  rationale: మాట ఎవరిని ఉద్దేశించి పలికిందో తెలుగులో సహజంగా చూపడానికి ‘మొర్దెకైతో’ అని ఇచ్చాం.
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: కారణాన్ని నేరుగా ప్రశ్నించే పదానికి ‘ఎందుకు’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: אַתָּה
  choice: నీవు
  rationale: మొర్దెకైని ఉద్దేశించిన ద్వితీయ పురుష ఏకవచనాన్ని గౌరవభరితమైన సాధారణ బైబిలు గద్యానికి తగిన ‘నీవు’తో వ్యక్తం చేశాం.
- source_word: עוֹבֵר
  choice: ఉల్లంఘిస్తున్నావు
  rationale: עבר ఇక్కడ ఆజ్ఞను దాటి వెళ్లడం, అంటే దానిని మీరడం లేదా ఉల్లంఘించడం అనే భావంలో ఉంది. వర్తమాన కృదంతం సూచించే కొనసాగుతున్న ప్రవర్తనను ‘ఉల్లంఘిస్తున్నావు’ నిలుపుతుంది.
- source_word: אֵת מִצְוַת הַמֶּלֶךְ
  choice: రాజు ఆజ్ఞను
  rationale: మִצְוָה ఇక్కడ మతపరమైన ‘ఆజ్ఞాపన’ కంటే రాజు జారీ చేసిన ఆజ్ఞను సూచిస్తుంది; ‘రాజు ఆజ్ఞ’ మూలార్థానికి దగ్గరగా, తెలుగులో సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘రాజద్వారం’ అనే సంక్షిప్త రూపం మూలంలోని ‘రాజు ద్వారం’ భావాన్ని నిలుపుతుంది; ‘ఉల్లంఘిస్తున్నావు’ అనే పదం עבר యొక్క ‘హద్దు/ఆజ్ఞ దాటడం’ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
