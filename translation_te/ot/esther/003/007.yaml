translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. నెలల పేర్లను ‘నీసాను’, ‘అదారు’గా, వ్యక్తి పేర్లను ‘అహష్వేరోషు’, ‘హామాను’గా తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా ఇచ్చాం. దీర్ఘమైన హీబ్రూ వాక్యాన్ని తెలుగు సమాచార ప్రవాహానికి తగినట్లు క్రమబద్ధం చేశాం; మూలంలోని అస్పష్ట ముగింపును పాదటిప్పణిలో నిలిపాం.
