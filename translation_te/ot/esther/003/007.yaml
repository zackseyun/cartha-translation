source:
  edition: WLC
  text: בַּ/חֹ֤דֶשׁ הָ/רִאשׁוֹן֙ הוּא חֹ֣דֶשׁ נִיסָ֔ן בִּ/שְׁנַת֙ שְׁתֵּ֣ים עֶשְׂרֵ֔ה לַ/מֶּ֖לֶךְ אֲחַשְׁוֵר֑וֹשׁ הִפִּ֣יל פּוּר֩ ה֨וּא הַ/גּוֹרָ֜ל לִ/פְנֵ֣י הָמָ֗ן מִ/יּ֧וֹם לְ/י֛וֹם וּ/מֵ/חֹ֛דֶשׁ לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֥דֶשׁ אֲדָֽר־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/007.yaml
  text: In the first month[a], that is, the month of Nisan, in the twelfth year of King Ahasuerus, Pur—that is, the lot—was cast before Haman, from day to day and from month to month, until the twelfth month, that is, the month of Adar.
translation:
  language: te
  text: అహష్వేరోషు రాజు పరిపాలన పన్నెండవ సంవత్సరంలో, మొదటి నెలైన నీసాను నెలలో, హామాను సమక్షంలో పూరు—అంటే చీటి—వేశారు. రోజు నుండి రోజుకు, నెల నుండి నెలకు చీటి వేస్తూ, పన్నెండవ నెల, అంటే అదారు నెల వరకు వెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలపాఠాన్ని మరింత అక్షరార్థంగా అనువదిస్తే: “రోజు నుండి రోజుకు, నెల నుండి నెలకు—పన్నెండు, అంటే అదారు నెల.” చివరి పదబంధం సంక్షిప్తంగా ఉంది. చీటి వేయడం పన్నెండవ నెల వరకు సాగిందని సందర్భం సూచిస్తుంది.'
    reason: హీబ్రూ చివరి పదబంధంలోని సంక్షిప్త, వ్యాకరణపరంగా క్లిష్టమైన రూపాన్ని చూపుతూ, ప్రధాన పాఠంలో అవసరమైన కనిష్ఠ సందర్భార్థాన్ని మాత్రమే ఇచ్చేందుకు.
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן הוּא חֹדֶשׁ נִיסָן
  choice: మొదటి నెలలో, అంటే నీసాను నెలలో
  rationale: కాలసూచక בְּను సహజమైన తెలుగులో చూపుతూ, הוּא ప్రవేశపెట్టే వివరణాత్మక సమానార్థక నిర్మాణాన్ని ‘అంటే’తో నిలుపుతుంది.
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: రాజు అహష్వేరోషు పరిపాలనలో పన్నెండవ సంవత్సరంలో
  rationale: రాజ్యపాలన సంవత్సరాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; రాజు పేరును మూలభాషకు సమీపంగా లిప్యంతరీకరిస్తుంది.
- source_word: הִפִּיל פּוּר
  choice: పూరు ... వేశారు
  rationale: హీబ్రూ ఏకవచన క్రియలో కర్త స్పష్టంగా చెప్పబడలేదు. గౌరవ/అనిర్దిష్ట బహువచన క్రియను ఉపయోగించడం ద్వారా కర్తను చేర్చకుండా చీటి వేయడమనే నుడికారాన్ని అందిస్తుంది.
- source_word: פּוּר הוּא הַגּוֹרָל
  choice: పూరు—అంటే చీటి—
  rationale: పర్షియన్ మూలపదమైన ‘పూరు’ను నిలిపి, మూలవాక్యమే ఇచ్చే హీబ్రూ వివరణను సాధారణ తెలుగు ‘చీటి’తో అందిస్తుంది; ఇది తరువాతి ‘పూరీము’ పేరుతో సంబంధాన్ని కాపాడుతుంది.
- source_word: לִפְנֵי הָמָן
  choice: హామాను సమక్షంలో
  rationale: ‘ముందు/సమక్షంలో’ అనే అర్థాన్ని సందర్భానుకూలంగా స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: מִיּוֹם לְיוֹם וּמֵחֹדֶשׁ לְחֹדֶשׁ
  choice: రోజువారీగా, నెలవారీగా చీటి వేస్తూ వెళ్లగా
  rationale: రోజులు, నెలల వరుసగా సాగిన చీటి ప్రక్రియ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలోని పునరావృత సమాంతరతను కూడా నిలుపుతుంది.
- source_word: שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: అది పన్నెండవ నెల, అంటే అదారు నెలపై పడింది
  rationale: వాక్యభాగంలోని సంక్షిప్తతను సందర్భం ఆధారంగా సహజ తెలుగులో విప్పుతుంది. అయితే ‘పడింది’ అనేది మూలంలో వ్యక్తంగా లేక సందర్భం నుంచి గ్రహించినదని పాదటిప్పణిలో సూచించబడింది.
