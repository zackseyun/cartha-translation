revisions:
- from: రాజు అహష్వేరోషు పరిపాలనలో పన్నెండవ సంవత్సరంలో, మొదటి నెలలో, అంటే నీసాను నెలలో, హామాను సమక్షంలో పూరు—అంటే చీటి—వేశారు. ఏ రోజో, ఏ నెలో నిర్ణయించడానికి రోజువారీగా, నెలవారీగా చీటి వేస్తూ వెళ్లగా, అది పన్నెండవ నెల, అంటే అదారు నెలపై పడింది.[a]
  to: అహష్వేరోషు రాజు పరిపాలన పన్నెండవ సంవత్సరంలో, మొదటి నెలైన నీసాను నెలలో, హామాను సమక్షంలో పూరు—అంటే చీటి—వేశారు. రోజు నుండి రోజుకు, నెల నుండి నెలకు చీటి వేస్తూ, పన్నెండవ నెల, అంటే అదారు నెల వరకు వెళ్లారు.[a]
  rationale: The revision removes the added purpose of the lot-casting and avoids stating more explicitly than the Hebrew does that a single lot ‘fell’ on Adar. It retains the source's day-to-day/month-to-month progression, its explanatory gloss of Pur, the regnal date, and the final textual compression through a focused footnote.
