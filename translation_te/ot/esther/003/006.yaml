  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֣בֶז בְּ/עֵינָ֗י/ו לִ/שְׁלֹ֤ח יָד֙ בְּ/מָרְדֳּכַ֣י לְ/בַדּ֔/וֹ כִּֽי הִגִּ֥ידוּ ל֖/וֹ אֶת עַ֣ם מָרְדֳּכָ֑י וַ/יְבַקֵּ֣שׁ הָמָ֗ן לְ/הַשְׁמִ֧יד אֶת כָּל הַ/יְּהוּדִ֛ים אֲשֶׁ֛ר בְּ/כָל מַלְכ֥וּת אֲחַשְׁוֵר֖וֹשׁ עַ֥ם מָרְדֳּכָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/006.yaml
  text: But it seemed contemptible in his eyes to lay a hand on Mordecai alone[a], because they had told him what people Mordecai belonged to. So Haman sought to destroy all the Jews throughout the whole kingdom of Ahasuerus—the people of Mordecai.
translation:
  language: te
  text: అయితే మొర్దెకై ఒక్కడి మీద చేయి వేయడం హామాను దృష్టికి తుచ్ఛంగా అనిపించింది. ఎందుకంటే మొర్దెకై ఏ ప్రజకు చెందినవాడో[a] వారు అతనికి తెలియజేశారు. అందుచేత అహష్వేరోషు రాజ్యమంతటా ఉన్న యూదులందరినీ—మొర్దెకై ప్రజలను—నాశనం చేయాలని హామాను పూనుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మొర్దెకై ప్రజలు’; అంటే మొర్దెకై ఏ ప్రజకు చెందినవాడో ఆ ప్రజలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶז בְּעֵינָיו
  choice: హామాను దృష్టికి తుచ్ఛంగా అనిపించింది
  rationale: בזה మరియు ‘అతని కళ్లలో’ అనే నుడికారం అవహేళనతో కూడిన అంచనాను వ్యక్తం చేస్తాయి. తెలుగు వాక్యప్రయోగంలో సహజంగా ఉండేలా, మూలంలోని మూల్యాంకన భావాన్ని నిలిపింది.
- source_word: לִשְׁלֹחַ יָד בְּ
  choice: మీద చేయి వేయడం
  rationale: హింసాత్మకంగా దాడి చేయడాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులోనూ సహజమైన సమాన రూపకంతో నిలిపింది.
- source_word: לְבַדּוֹ
  choice: ఒక్కడి
  rationale: మొర్దెకైని మాత్రమే లక్ష్యంగా చేసుకోవడం మరియు అతని ప్రజలందరినీ లక్ష్యంగా చేసుకోవడం మధ్య ఉన్న వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: כִּי הִגִּידוּ לוֹ
  choice: ఎందుకంటే ... వారు అతనికి తెలియజేశారు
  rationale: హామాను తన పథకాన్ని విస్తరించడానికి గల కారణాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; కర్త మూలంలో నిర్దిష్టంగా చెప్పబడనందున ‘వారు’ అని ఉంచింది.
- source_word: אֶת עַם מָרְדֳּכָי
  choice: మొర్దెకై ఏ ప్రజకు చెందినవాడో
  rationale: ‘మొర్దెకై ప్రజలు’ అనే హీబ్రూ సంబంధపదబంధం ఇక్కడ అతని జాతి ప్రజలను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు మొదటి ప్రస్తావనలో అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיְבַקֵּשׁ
  choice: పూనుకున్నాడు
  rationale: בקש ఇక్కడ ఉద్దేశపూర్వక సంకల్పం, కార్యప్రయత్నం సూచిస్తుంది. ఫలితం అప్పటికే సాధించబడిందని చెప్పకుండా దృఢమైన ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: לְהַשְׁמִיד
  choice: నాశనం చేయాలని
  rationale: שׁמד యొక్క హిఫీల్ రూపం సంపూర్ణ విధ్వంసాన్ని సూచిస్తుంది. ‘నాశనం చేయడం’ తీవ్రతను తెలియజేసే విస్తృతమైన, ప్రామాణిక తెలుగు పదప్రయోగం.
- source_word: כָּל הַיְּהוּדִים
  choice: యూదులందరినీ
  rationale: ఎస్తేరు సందర్భంలో ఇది యూదా ప్రాంత నివాసులను మాత్రమే కాక పర్షియా సామ్రాజ్యంలో చెదరిపోయిన యూదు ప్రజలను సూచిస్తుంది.
- source_word: אֲשֶׁר בְּכָל מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజ్యమంతటా ఉన్న
  rationale: సామ్రాజ్యమంతటా విస్తరించి ఉన్న యూదుల సమగ్ర పరిధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַם מָרְדֳּכָי
  choice: మొర్దెకై ప్రజలను
  rationale: ‘యూదులందరినీ’ అనే పదబంధానికి వివరణాత్మక పునరుక్తిగా మూలంలోని వాక్చాతుర్యాన్ని నిలిపింది.
