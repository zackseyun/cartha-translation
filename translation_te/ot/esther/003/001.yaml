source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה גִּדַּל֩ הַ/מֶּ֨לֶךְ אֲחַשְׁוֵר֜וֹשׁ אֶת הָמָ֧ן בֶּֽן הַמְּדָ֛תָא הָ/אֲגָגִ֖י וַֽ/יְנַשְּׂאֵ֑/הוּ וַ/יָּ֨שֶׂם֙ אֶת כִּסְא֔/וֹ מֵ/עַ֕ל כָּל הַ/שָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/001.yaml
  text: After these things[a], King Ahasuerus promoted Haman son of Hammedatha the Agagite, exalted him[c][b], and set his throne above all the officials who were with him.
translation:
  language: te
  text: ఈ సంగతుల తర్వాత[a], అహష్వేరోషు రాజు హమ్మెదాతా కుమారుడూ అగాగీయుడూ అయిన హామానుకు[b] ఉన్నత పదవి ఇచ్చి, అతన్ని ఘనపరచి, తనతో ఉన్న అధికారులందరికంటే అతని ఆసనాన్ని ఉన్నతంగా ఉంచాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ సంఘటనల తర్వాత.’
    reason: lexical_alternative
  - marker: b
    text: ‘అగాగీయుడు’ అనే హీబ్రూ విశేషణం అగాగుతో సంబంధమైన వంశాన్ని లేదా అనుబంధాన్ని సూచించవచ్చు.
    reason: cultural_note
  - marker: c
    text: ‘అతని ఆసనాన్ని ఉన్నతంగా ఉంచాడు’ అంటే ఇతర అధికారులందరికంటే అతనికి ఉన్నత హోదా ఇచ్చాడని భావం. ‘ఆసనం’ అనే హీబ్రూ పదాన్ని ‘సింహాసనం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతుల తర్వాత
  rationale: కథనంలో తదుపరి పరిణామాన్ని పరిచయం చేసే హీబ్రూ కాలసూచక ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో దగ్గరగా నిలుపుతుంది.
- source_word: גִּדַּל
  choice: ఉన్నత పదవి ఇచ్చి
  rationale: రాజసభలో హామాను హోదాను పెంచడమే సందర్భార్థం; అక్షరార్థమైన ‘గొప్పవాడిని చేసి’ కంటే ఇది పరిపాలనా భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు రాజు
  rationale: పేరును హీబ్రూ రూపానికి అనుగుణంగా లిప్యంతరీకరించి, తెలుగులో సహజమైన పేరు-బిరుదు క్రమాన్ని వాడింది.
- source_word: הָמָן
  choice: హామాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో గుర్తించదగిన సంప్రదాయ రూపంలో లిప్యంతరీకరించింది.
- source_word: בֶּן הַמְּדָתָא
  choice: హమ్మెదాతా కుమారుడు
  rationale: తండ్రి సంబంధాన్ని మూలంలో ఉన్నట్లే స్పష్టంగా ఉంచుతుంది.
- source_word: הָאֲגָגִי
  choice: అగాగీయుడు
  rationale: ఇది వంశం, ప్రజాసంబంధం లేదా అగాగుతో అనుబంధాన్ని సూచించవచ్చు; ప్రధాన పాఠ్యంలో దానిని అతిగా నిర్ధారించకుండా హీబ్రూ విశేషణ రూపాన్ని నిలుపుతుంది.
- source_word: וַיְנַשְּׂאֵהוּ
  choice: అతన్ని ఘనపరచి
  rationale: ముందటి పదోన్నతి భావాన్ని కేవలం పునరావృతం చేయకుండా, గౌరవంలో పైకి ఎత్తిన భావాన్ని తెలియజేస్తుంది.
- source_word: וַיָּשֶׂם אֶת כִּסְאוֹ
  choice: అతని ఆసనాన్ని ... ఉన్నతంగా ఉంచాడు
  rationale: כִּסֵּא అధికార ఆసనం లేదా సింహాసనం రెండింటినీ సూచించగలదు. ఇక్కడ రాజు కాని అధికారికి సంబంధించిన రాజసభా హోదా సందర్భంలో ‘ఆసనం’ సహజంగా ఉండి మూలంలోని స్థానప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: מֵעַל כָּל הַשָּׂרִים
  choice: అధికారులందరికంటే ... ఉన్నతంగా
  rationale: పర్షియా రాజసభలోని ఇతర అధికారులపై అతనికి ఇచ్చిన ఉన్నత హోదాను ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר אִתּוֹ
  choice: తన దగ్గర ఉన్న
  rationale: సందర్భంలో సర్వనామం రాజునే సూచించే అవకాశం బలంగా ఉంది; రాజుతో ఉన్న రాజసభ అధికారులను సహజ తెలుగులో తెలియజేస్తుంది.
