  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. రాజసభా సందర్భాన్ని సాధారణ పాఠకులకు స్పష్టంగా చేయడానికి ‘ఉన్నత పదవి’, ‘అధికారులు’ అనే పదాలు ఎంచుకోబడ్డాయి; ‘అగాగీయుడు’ అనే అస్పష్ట చారిత్రక designation‌ను వ్యాఖ్యానించి నిర్ణయించకుండా నిలుపుకున్నాం.
