  to: ఈ సంగతుల తర్వాత[a], అహష్వేరోషు రాజు హమ్మెదాతా కుమారుడూ అగాగీయుడూ అయిన హామానుకు[b] ఉన్నత పదవి ఇచ్చి, అతన్ని ఘనపరచి, తనతో ఉన్న అధికారులందరికంటే అతని ఆసనాన్ని ఉన్నతంగా ఉంచాడు[c].
