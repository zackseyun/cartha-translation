translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలోని అధికార బదలాయింపు దృశ్యాన్ని స్పష్టంగా ఉంచుతూ, పేర్లు మరియు వంశసూచకాన్ని సంక్షిప్తంగా కాపాడాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
