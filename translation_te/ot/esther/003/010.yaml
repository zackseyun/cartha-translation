  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֧סַר הַ/מֶּ֛לֶךְ אֶת טַבַּעְתּ֖/וֹ מֵ/עַ֣ל יָד֑/וֹ וַֽ/יִּתְּנָ֗/הּ לְ/הָמָ֧ן בֶּֽן הַמְּדָ֛תָא הָ/אֲגָגִ֖י צֹרֵ֥ר הַ/יְּהוּדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/010.yaml
  text: So the king took his signet ring from his hand and gave it to Haman son of Hammedatha the Agagite[a], the enemy of the Jews.
translation:
  language: te
  text: అప్పుడు రాజు తన చేతి నుండి తన ముద్ర ఉంగరాన్ని తీసి, హమ్మెదాతా కుమారుడైన అగాగీయుడూ యూదుల శత్రువూ అయిన హామానుకు ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యూదులు’ అని అనువదించిన హీబ్రూ పదం יְהוּדִים విస్తృతంగా యూద ప్రజలను సూచించవచ్చు; కొన్ని సందర్భాల్లో యూదా/యూదయ ప్రాంతానికి చెందినవారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: తీసి
  rationale: ఈ క్రియకు ‘తొలగించు/తీసివేయు’ అనే అర్థం ఉంది. ‘తన చేతి నుండి’ అనే పదబంధంతో కలిసి ‘తీసి’ సహజంగా ఉండి చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: טַבַּעְתּוֹ
  choice: తన ముద్ర ఉంగరాన్ని
  rationale: రాజసభ సందర్భంలో ఇది అలంకార ఉంగరం మాత్రమే కాక అధికారిక ముద్ర వేయడానికి ఉపయోగించే ఉంగరం; అందువల్ల ‘ముద్ర ఉంగరం’ దాని కార్యాన్ని స్పష్టం చేస్తుంది.
- source_word: מֵעַל יָדוֹ
  choice: తన చేతి నుండి
  rationale: హీబ్రూ పదబంధంలోని దృశ్యాన్ని కాపాడే సహజమైన తెలుగు రూపం.
- source_word: וַיִּתְּנָהּ
  choice: ఇచ్చాడు
  rationale: స్త్రీలింగ ప్రత్యయము ముందున్న ఉంగరాన్ని సూచిస్తుంది; తెలుగులో కర్మ ఇప్పటికే స్పష్టంగా ఉన్నందున ‘ఇచ్చాడు’ సహజంగా ఉంటుంది.
- source_word: לְהָמָן
  choice: హామానుకు
  rationale: వ్యక్తి పేరును సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: בֶּן הַמְּדָתָא
  choice: హమ్మెదాతా కుమారుడు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని నేరుగా కాపాడుతుంది.
- source_word: הָאֲגָגִי
  choice: అగాగీయుడు
  rationale: అగాగుతో సంబంధాన్ని సూచించే వంశ/జాతి విశేషణాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: צֹרֵר
  choice: శత్రువు
  rationale: ఈ కృదంతం వ్యతిరేకించే లేదా శత్రుత్వం చూపే వ్యక్తిని సూచిస్తుంది; సందర్భంలో ‘శత్రువు’ సహజంగా, బలంగా ఉంటుంది.
- source_word: הַיְּהוּדִים
  choice: యూదులు
  rationale: ఎస్తేరు గ్రంథంలో లక్ష్యంగా చేయబడిన గుర్తించదగిన ప్రజాసమూహాన్ని ఇక్కడ సూచిస్తుంది; కేవలం యూదయ నివాసులను మాత్రమే కాదు.
- source_word: וַ
  choice: అప్పుడు
  rationale: కథన పరంపరను, ముందటి వాక్యానికి అనుసరించిన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
