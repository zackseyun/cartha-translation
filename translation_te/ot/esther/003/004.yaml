  terminology: “మొర్దెకై,” “హామాను,” and “యూదుడు” are appropriate. “మొర్దెకై మాటలు నిలుస్తాయో లేదో” usefully retains the source metaphor and its deliberate breadth; the footnote explains it without imposing one interpretation.
