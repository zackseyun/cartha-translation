  yaml_path: translation/ot/esther/003/004.yaml
  text: And when they spoke to him day after day and he would not listen to them[a], they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew.
translation:
  language: te
  text: వారు అతనితో రోజురోజుకూ మాట్లాడుతున్నప్పుడు కూడా, అతడు వారి మాట వినలేదు. అప్పుడు మొర్దెకై మాటలు నిలుస్తాయో లేదో చూడడానికి వారు హామానుకు తెలియజేశారు[a]. ఎందుకంటే తాను యూదుడినని మొర్దెకై వారికి చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొర్దెకై చెప్పిన కారణం చెల్లుతుందో లేదో.” హెబ్రీలో అక్షరార్థంగా “మొర్దెకై మాటలు నిలుస్తాయో లేదో” అని ఉంది. ఇది నమస్కరించడానికి నిరాకరించినందుకు అతడు చెప్పిన కారణం చెల్లుతుందా అనే భావాన్నిగానీ, ఒత్తిడి వచ్చినా అతడు తన వైఖరిపై నిలబడతాడా అనే భావాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְאָמְרָם אֵלָיו יוֹם וָיוֹם
  choice: వారు రోజురోజుకూ అతనితో చెప్పినా
  rationale: ఈ కథన నిర్మాణంలోని కాలసంబంధ భావాన్ని సహజమైన తెలుగు ఉపవాక్యంగా అందించాం; יוֹם וָיוֹם పదబంధంలోని నిరంతర పునరావృతిని ‘రోజురోజుకూ’ తెలియజేస్తుంది.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: అతడు వారి మాట వినలేదు
  rationale: שׁמע אֶל ఇక్కడ ‘వినడం/పట్టించుకోవడం’ అనే భావం ఇస్తుంది. పునరావృత ఒత్తిడికి అతడు లొంగని సందర్భంలో ‘వారి మాట వినలేదు’ సహజంగా ఉంది.
- source_word: וַיַּגִּידוּ לְהָמָן
  choice: వారు హామానుకు తెలియజేశారు
  rationale: נגד హిఫీల్ రూపం చెప్పడం లేదా సమాచారం అందించడం అనే భావాన్ని ఇస్తుంది; అధికారికి నివేదించిన సందర్భాన్ని ‘తెలియజేశారు’ స్పష్టంగా అందిస్తుంది.
- source_word: לִרְאוֹת הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי
  choice: మొర్దెకై మాటలు నిలుస్తాయో లేదో చూడడానికి
  rationale: עמד తో ‘మాటలు’ అనే రూపకాన్ని అలాగే ఉంచి, అతని వివరణ చెల్లుతుందా లేదా అతని వైఖరి ఒత్తిడిలో కొనసాగుతుందా అనే మూలభాషలోని విస్తృత భావాన్ని కాపాడాం.
- source_word: כִּי הִגִּיד לָהֶם אֲשֶׁר הוּא יְהוּדִי
  choice: ఎందుకంటే తాను యూదుడినని మొర్దెకై వారికి చెప్పాడు
  rationale: כִּי కారణాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో కర్త స్పష్టత కోసం ‘మొర్దెకై’ని పునరుక్తి చేశాం; יְהוּדִיని జాతి-మత గుర్తింపును సూచించే ‘యూదుడు’గా అనువదించాం.
theological_decisions:
- issue: ‘మొర్దెకై మాటలు నిలుస్తాయో’ అనే పదబంధం యొక్క పరిధి
  choice: మూలంలోని ‘మాటలు నిలవడం’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపివేయడం
  alternative: ‘మొర్దెకై చెప్పిన కారణం చెల్లుతుందో’ లేదా ‘మొర్దెకై తన పట్టుదలపై నిలబడతాడో’
  rationale: 'మూల హెబ్రీ రెండు భావాలకు అవకాశం ఇస్తుంది: అతడు చెప్పిన కారణం చెల్లుబాటు అవుతుందా, లేదా ఒత్తిడిలోనూ అతని వైఖరి కొనసాగుతుందా. ఒక భావానికే పరిమితం చేయకుండా ఉద్దేశపూర్వక అస్పష్టతను కాపాడాం.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘మాటలు నిలుస్తాయో’ అనే కొద్దిగా రూపకాలంకృతమైన ప్రయోగాన్ని మూలంలోని నిజమైన అస్పష్టతను కాపాడేందుకు ఉంచి, పాదటిప్పణిలో రెండు సాధ్యమైన భావాలను వివరించాం.
