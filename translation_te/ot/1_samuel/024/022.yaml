- from: 'ఇప్పుడు యాహ్వే పేరుతో నాకు ప్రమాణం చేయి[a]: నా తరువాత నా సంతానాన్ని[b] నిర్మూలించనని, నా తండ్రి ఇంటిలోనుండి నా పేరును[c] తుడిచివేయనని ప్రమాణం చేయి.'
  to: 'ఇప్పుడు యాహ్వే పేరుతో నాకు ప్రమాణం చేయి[a]: నా తరువాత నా సంతానాన్ని[b] నిర్మూలించనని, నా తండ్రి ఇంటివారిలో నా పేరును[c] తుడిచివేయనని.'
