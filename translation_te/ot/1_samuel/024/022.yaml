  text: וְ/עַתָּ֗ה הִשָּׁ֤בְעָ/ה לִּ/י֙ בַּֽ/יהוָ֔ה אִם תַּכְרִ֥ית אֶת זַרְעִ֖/י אַֽחֲרָ֑/י וְ/אִם תַּשְׁמִ֥יד אֶת שְׁמִ֖/י מִ/בֵּ֥ית אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
translation:
  language: te
  text: 'ఇప్పుడు యాహ్వే పేరుతో నాకు ప్రమాణం చేయి[a]: నా తరువాత నా సంతానాన్ని[b] నిర్మూలించనని, నా తండ్రి ఇంటివారిలో నా పేరును[c] తుడిచివేయనని.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పాఠంలో ప్రమాణ విషయాన్ని పరిచయం చేయడానికి అక్షరార్థంగా ‘ఒకవేళ’ అనే పదం రెండుసార్లు ఉంది. ఈ ప్రమాణ సూత్రం సందర్భంలో దాని భావం ‘…చేయనని’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా వంశాన్ని’; హెబ్రీలో అక్షరార్థంగా ‘నా విత్తనాన్ని.’
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘నా పేరు’ అంటే సౌలు వ్యక్తిగత పేరు మాత్రమే కాక, అతని కుటుంబ వంశం, గుర్తింపు, జ్ఞాపకం కొనసాగడాన్ని కూడా సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సౌలు తన చివరి అభ్యర్థనను పరిచయం చేసే సంభాషణ సూచిక; ఆధునిక తెలుగులో ‘ఇప్పుడు’ సహజంగా ఉంది.
- source_word: הִשָּׁבְעָה לִּי
  choice: నాకు ప్రమాణం చేయి
  rationale: שבע ధాతువు నిఫల్ ఆజ్ఞార్థక రూపం ఇక్కడ ప్రమాణం చేయమనే ప్రత్యక్ష అభ్యర్థనను తెలియజేస్తుంది.
- source_word: בַּיהוָה
  choice: యాహ్వే పేరుతో
  rationale: ప్రమాణానికి సాక్షిగా యాహ్వే అనే దైవనామాన్ని ఆహ్వానించే భావాన్ని సహజమైన తెలుగు ప్రమాణ ప్రయోగంతో వ్యక్తపరుస్తుంది.
- source_word: אִם ... וְאִם
  choice: …నని, …నని
  rationale: ప్రమాణ సూత్రంలో אִם సాధారణ షరతును కాక, ప్రమాణ విషయాన్ని ప్రవేశపెడుతుంది; సందర్భం సూచించే నిషేధార్థాన్ని తెలుగులో ‘నని’ నిర్మాణంతో స్పష్టంగా వ్యక్తపరచాం.
- source_word: תַּכְרִית
  choice: నిర్మూలించనని
  rationale: כרת హిఫిల్ రూపం వంశాన్ని అంతమొందించడం లేదా తెగగొట్టడం అనే బలమైన భావాన్ని ఇక్కడ కలిగిస్తుంది.
- source_word: זַרְעִי
  choice: నా సంతానాన్ని
  rationale: זֶרַע ఇక్కడ అక్షరార్థమైన ‘విత్తనం’ కాక సౌలు తరువాతి వంశస్థులను సూచిస్తుంది; ‘సంతానం’ సహజమైనదీ, సమూహార్థాన్ని నిలుపుకునేదీ.
- source_word: אַחֲרַי
  choice: నా తరువాత
  rationale: సౌలు మరణించిన తరువాత అనే కాలార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: תַּשְׁמִיד
  choice: తుడిచివేయనని
  rationale: שמד హిఫిల్ రూపంలోని పూర్తిగా నాశనం చేసే భావాన్ని, ‘పేరు’తో సహజంగా కలిసే తెలుగు పదబంధంలో వ్యక్తపరుస్తుంది.
- source_word: שְׁמִי
  choice: నా పేరును
  rationale: కుటుంబంలో సౌలు జ్ఞాపకం, గుర్తింపు, వంశ కొనసాగింపు అనే విస్తృత భావాన్ని కలిగించే ‘పేరు’ రూపకాన్ని యథాతథంగా ఉంచాం.
- source_word: מִבֵּית אָבִי
  choice: నా తండ్రి ఇంటిలోనుండి
  rationale: పితృకుటుంబం లేదా వంశగృహాన్ని సూచించే హెబ్రీయ కుటుంబ నిర్మాణాన్ని అర్థమయ్యే విధంగా దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రమాణ సూత్రంలో יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది; దాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: אִם ఉన్న ప్రమాణ సూత్రంలో నిషేధార్థం
  choice: నిర్మూలించనని … తుడిచివేయనని
  alternative: ఒకవేళ నిర్మూలిస్తే … ఒకవేళ తుడిచివేస్తే
  rationale: హెబ్రీయ ప్రమాణ సూత్రం శాపఫలితాన్ని సంక్షిప్తంగా వదిలివేయగలదు. ఇక్కడ సౌలు దావీదు నుండి కోరుతున్న హామీ సందర్భానుసారంగా నిషేధాత్మకం; తెలుగులో అసంపూర్ణమైన షరతుగా కాక ప్రమాణ విషయంగా అనువదించాం, అసలు నిర్మాణాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘నా తండ్రి ఇల్లు’ అనే హెబ్రీయ బంధుత్వ రూపకం నిలుపబడింది. మొదటి ‘ప్రమాణం చేయి’ అభ్యర్థనను స్పష్టపరుస్తుంది; చివర దాని పునరుక్తి రెండు ‘…నని’ ఉపవాక్యాలను సహజమైన తెలుగు వాక్యంగా ముగిస్తుంది.
