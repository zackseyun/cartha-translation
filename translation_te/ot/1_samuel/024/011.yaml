  rationale: వచనాంతంలోని స్పష్టమైన మొదటి-పురుష మాటల క్రియను ‘నేను అన్నాను’గా సరిచేశాం. పాదటిప్పణి aలోని ఒక ప్రత్యామ్నాయాన్ని సహజమైన, స్పష్టమైన తెలుగుగా మార్చాం. ఇతర అనువాద ఎంపికలు మూలంలోని అనిర్దిష్ట కర్తను, రాజసంబంధ గౌరవాన్ని, మరియు అభిషేక భావాన్ని తగిన విధంగా కాపాడుతున్నాయి.
