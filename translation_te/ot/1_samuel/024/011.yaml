source:
  edition: WLC
  text: הִנֵּה֩ הַ/יּ֨וֹם הַ/זֶּ֜ה רָא֣וּ עֵינֶ֗י/ךָ אֵ֣ת אֲשֶׁר נְתָנְ/ךָ֩ יְהוָ֨ה הַ/יּ֤וֹם בְּ/יָדִ/י֙ בַּ/מְּעָרָ֔ה וְ/אָמַ֥ר לַ/הֲרָגֲ/ךָ֖ וַ/תָּ֣חָס עָלֶ֑י/ךָ וָ/אֹמַ֗ר לֹא אֶשְׁלַ֤ח יָדִ/י֙ בַּֽ/אדֹנִ֔/י כִּי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
translation:
  language: te
  text: ఇదిగో, ఈ రోజు గుహలో యాహ్వే నిన్ను నా చేతికి అప్పగించిన సంగతి నీ కళ్లే చూశాయి. నిన్ను చంపాలని ఒకరు అన్నారు[a]; కానీ నేను నిన్ను కనికరించి విడిచిపెట్టాను[b]. ‘నా ప్రభువుకు విరోధంగా నేను చేయి చాపను; ఎందుకంటే ఆయన యాహ్వే అభిషిక్తుడు’ అని నేను అన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు నిన్ను చంపాలని అన్నాడు,” “నిన్ను చంపాలని చెప్పబడింది,” లేదా “నేను నిన్ను చంపాలని ఒకరు చెప్పారు.” హీబ్రూలో కర్తను పేర్కొనని ఏకవచన క్రియ ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నేను నీపై జాలి చూపాను.” హీబ్రూ క్రియ కనికరంతో ప్రాణం తీయకుండా విడిచిపెట్టడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని బలంగా ఆకర్షించే హీబ్రూ సూచనార్థక పదాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רָאוּ עֵינֶיךָ
  choice: నీ కళ్లే చూశాయి
  rationale: కళ్లను ప్రత్యక్ష సాక్షులుగా పేర్కొనే హీబ్రూ నుడికారంలోని ఉద్ఘాటనను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: נְתָנְךָ יְהוָה ... בְּיָדִי
  choice: యాహ్వే నిన్ను నా చేతికి అప్పగించిన
  rationale: ‘చేతిలో ఇవ్వడం’ అనే అధికారానికి అప్పగించే భావాన్ని ‘నా చేతికి అప్పగించిన’ అని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామాన్ని బిరుదుగా మార్చకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరిస్తుంది.
- source_word: בַּמְּעָרָה
  choice: గుహలో
  rationale: స్థలార్థాన్ని నేరుగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: וְאָמַר לַהֲרָגֲךָ
  choice: నిన్ను చంపాలని ఒకరు అన్నారు
  rationale: కర్తను పేర్కొనని ఏకవచన క్రియను ఊహాత్మకంగా దావీదుకు మాత్రమే ఆపాదించకుండా, దాని అనిర్దిష్టతను తెలుగులో నిలుపుతుంది.
- source_word: וַתָּחָס עָלֶיךָ
  choice: కానీ నేను నిన్ను కనికరించి విడిచిపెట్టాను
  rationale: చంపకుండా వదిలివేయడం మరియు కనికరం చూపడం అనే రెండు భావ ఛాయలను సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא אֶשְׁלַח יָדִי
  choice: నేను చేయి చాపను
  rationale: విరోధ చర్యకు దిగడాన్ని సూచించే హీబ్రూ నుడికారాన్ని అర్థమయ్యే తెలుగు రూపంలో నిలుపుతుంది.
- source_word: בַּאדֹנִי
  choice: నా ప్రభువుకు విరోధంగా
  rationale: దావీదు సౌలును తనపై అధికారమున్న రాజుగా గౌరవంగా సంబోధిస్తున్న భావాన్ని తెలుపుతుంది; ఇది దేవునికి సంబంధించిన బిరుదు కాదు.
- source_word: מְשִׁיחַ יְהוָה
  choice: యాహ్వే అభిషిక్తుడు
  rationale: ఈ రాజవంశ కథనంలో యాహ్వే చేత రాజుగా ప్రతిష్ఠించబడిన వ్యక్తిని సూచిస్తుంది; అంత్యకాల సంబంధమైన ప్రత్యేక బిరుదును అనవసరంగా దిగుమతి చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా నేరుగా ప్రతిబింబిస్తుంది.
- issue: מְשִׁיחַ יְהוָה అనే రాజ సంబంధ పదబంధం
  choice: యాహ్వే అభిషిక్తుడు
  alternative: యాహ్వే మెస్సీయ
  rationale: సందర్భంలో ఇది అభిషేకించబడిన రాజైన సౌలును సూచిస్తుంది; తరువాతి ప్రత్యేక క్రీస్తు సంబంధ భావాన్ని ఇక్కడ బలవంతంగా మోపదు.
- issue: וְאָמַר లోని పేర్కొనని కర్త
  choice: ఒకరు అన్నారు
  alternative: నేను అన్నాను / అతడు అన్నాడు / చంపాలని చెప్పబడింది
  rationale: హీబ్రూ క్రియ ఏకవచనంలో ఉన్నా కర్త స్పష్టంగా లేదు. అందువల్ల ఒక నిర్దిష్ట వ్యక్తిని నిర్ణయించకుండా మూలంలోని అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. సౌలుతో నేరుగా మాట్లాడే హీబ్రూ ఏకవచనాన్ని ‘నీ/నిన్ను’తో నిలిపి, ‘నా ప్రభువు’ మరియు ‘ఆయన’ ద్వారా రాజుకు ఇచ్చే గౌరవాన్ని సహజంగా వ్యక్తం చేశాం.
