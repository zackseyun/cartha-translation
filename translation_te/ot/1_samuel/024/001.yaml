  text: Then David went up from there and stayed in the strongholds of En-gedi.
translation:
  language: te
  text: అప్పుడు దావీదు అక్కడి నుంచి పైకి వెళ్లి ఏన్-గెదీలోని దుర్గాల్లో బస చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వెళ్లి
  rationale: עלה పైదిశగా కదలడాన్ని సూచిస్తుంది; ‘పైకి వెళ్లి’ దిశాభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుంచి
  rationale: మునుపటి స్థలాన్ని సూచించే సహజమైన, స్పష్టమైన తెలుగు ప్రయోగం.
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישב ఇక్కడ కూర్చోవడం కంటే కొంతకాలం ఉండడం లేదా నివసించడాన్ని సూచిస్తుంది; శాశ్వతంగా స్థిరపడ్డాడనే భావాన్ని తప్పనిసరిగా కలిగించదు.
- source_word: בִּמְצָדוֹת
  choice: దుర్గస్థలాల్లో
  rationale: מצדות రక్షణకు అనువైన బలమైన ఆశ్రయస్థలాలను సూచిస్తుంది. ‘దుర్గస్థలాలు’ నిర్మిత కోటలకే పరిమితం కాకుండా సహజంగా రక్షణనిచ్చే ప్రదేశాలనూ సూచించగలదు.
- source_word: עֵין גֶּדִי
  choice: ఏన్-గెదీ
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలి వాడబడింది. మూలంలోని పైదిశ భావం, తాత్కాలిక నివాస సూచన, రక్షణాత్మక ప్రదేశాల భావం నిలుపబడ్డాయి.
