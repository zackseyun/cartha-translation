id: 1SA.24.4
reference: 1 Samuel 24:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יָּבֹא אֶל גִּדְר֨וֹת הַ/צֹּ֤אן עַל הַ/דֶּ֨רֶךְ֙ וְ/שָׁ֣ם מְעָרָ֔ה וַ/יָּבֹ֥א שָׁא֖וּל לְ/הָסֵ֣ךְ אֶת רַגְלָ֑י/ו וְ/דָוִד֙ וַ/אֲנָשָׁ֔י/ו בְּ/יַרְכְּתֵ֥י הַ/מְּעָרָ֖ה יֹשְׁבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
translation:
  language: te
  text: అతడు దారి పక్కన ఉన్న గొర్రెల దొడ్ల దగ్గరికి వచ్చాడు. అక్కడ ఒక గుహ ఉంది. సౌలు కాలకృత్యం తీర్చుకోవడానికి[a] ఆ గుహలోకి వెళ్లాడు. అప్పుడు దావీదు, అతని మనుషులు గుహ లోపలి మారుమూల భాగాల్లో కూర్చుని ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన పాదాలను కప్పుకోవడానికి”; ఇది మలవిసర్జనను సూచించే హీబ్రూ నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדְרוֹת הַצֹּאן
  choice: గొర్రెల దొడ్లు
  rationale: ఈ పదబంధం గొర్రెలను ఉంచే కంచెలతో కూడిన ఆవరణలను సూచిస్తుంది; ‘గొర్రెల దొడ్లు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: עַל הַדֶּרֶךְ
  choice: దారి పక్కన ఉన్న
  rationale: గొర్రెల దొడ్లు సౌలు ప్రయాణిస్తున్న దారికి సమీపంలో ఉన్నాయని తెలిపే స్థానార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְעָרָה
  choice: ఒక గుహ
  rationale: మూలపదానికి సాధారణమైన, సందర్భోచితమైన తెలుగు సమానం.
- source_word: לְהָסֵךְ אֶת רַגְלָיו
  choice: కాలకృత్యం తీర్చుకోవడానికి
  rationale: అక్షరార్థంగా ‘తన పాదాలను కప్పుకోవడానికి’ అనే హీబ్రూ నానుడి మలవిసర్జనను మర్యాదగా సూచిస్తుంది. తెలుగు అనువాదం కూడా భావాన్ని స్పష్టంగా, అసభ్యత లేకుండా అందిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: בְּיַרְכְּתֵי הַמְּעָרָה
  choice: గుహ లోపలి మారుమూల భాగాల్లో
  rationale: గుహ ప్రవేశద్వారానికి దూరంగా ఉన్న లోతైన, కనబడని భాగాలను సూచించే మూలపదపు స్థలార్థాన్ని ఇది నిలుపుతుంది.
- source_word: יֹשְׁבִים
  choice: కూర్చుని ఉన్నారు
  rationale: ఈ సందర్భంలో దీర్ఘకాల నివాసం కంటే ఆ సమయంలో వారి స్థితిని, భంగిమను సూచిస్తుంది.
- source_word: וַיָּבֹא ... וַיָּבֹא
  choice: వచ్చాడు ... లోకి వెళ్లాడు
  rationale: మొదటి క్రియ ప్రయాణం కొనసాగడాన్ని, రెండవది సౌలు గుహలో ప్రవేశించడాన్ని తెలుగులో సహజంగా వేరు చేసి చూపిస్తుంది.
