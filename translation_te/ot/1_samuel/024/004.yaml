translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. శరీరక్రియను సూచించే హీబ్రూ సభ్యోక్తికి సమానంగా మర్యాదగల తెలుగు సభ్యోక్తిని ఉపయోగించి, దాని అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
