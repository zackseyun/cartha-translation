base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
translation:
  language: te
  text: ఆ తర్వాత దావీదు లేచి గుహలోనుంచి బయటికి వచ్చి, “రాజా, నా ప్రభూ!” అని సౌలును వెనకనుంచి పిలిచాడు. సౌలు వెనక్కి చూసినప్పుడు, దావీదు ముఖం నేలకు వంచి సాగిలపడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సాగిలపడ్డాడు’ అనే మాటకు ‘లోతుగా వంగి నమస్కరించాడు’ అని కూడా అనువదించవచ్చు. హెబ్రీ క్రియ లోతైన గౌరవం లేదా విధేయతను చూపే భంగిమను సూచించగలదు; ఇక్కడ అది సౌలు ఎదుట దావీదు చూపిన గౌరవాన్ని సూచిస్తుంది, దైవారాధనను కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ ఇక్కడ కూర్చున్న లేదా దాగివున్న స్థితి నుంచి లేవడాన్ని సూచిస్తుంది; కథనశైలిలో ‘లేచి’ సహజంగా ఉంది.
- source_word: אַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: సంఘటనల కాలక్రమాన్ని సూటిగా తెలియజేసే సాధారణ ఆధునిక తెలుగు ప్రయోగం.
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  choice: గుహలోనుంచి బయటికి వచ్చి
  rationale: יצא అంటే లోపలి నుంచి బయటికి రావడం; కథకుని దృష్టికోణంలో తెలుగులో ‘బయటికి వచ్చి’ సహజంగా ఉంటుంది.
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  choice: సౌలును వెనకనుంచి పిలిచాడు
  rationale: אַחֲרֵי తో కూడిన קרא, ముందుకు వెళ్తున్న వ్యక్తిని వెనకనుంచి పిలవడాన్ని సూచిస్తుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: రాజా, నా ప్రభూ!
  rationale: రాజపదవినీ వ్యక్తిగత గౌరవసూచక సంబోధననీ రెండింటినీ నిలుపుతుంది; తెలుగు ప్రత్యక్ష సంబోధనలో ఈ పదక్రమం సహజంగా ఉంది.
- source_word: וַיַּבֵּט שָׁאוּל אַחֲרָיו
  choice: సౌలు వెనక్కి చూసినప్పుడు
  rationale: నిజానికి ‘అతని వెనుక చూశాడు’ అనే భావాన్ని తెలుగులో సహజమైన ‘వెనక్కి చూశాడు’గా వ్యక్తం చేసి, తరువాతి చర్యతో కాలసంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: ముఖం నేలకు వంచి
  rationale: קדד శరీరాన్ని వంచడాన్ని, אַפַּיִם אַרְצָה ముఖం నేలవైపు ఉండే లోతైన వినయభంగిమను సూచిస్తాయి.
- source_word: וַיִּשְׁתָּחוּ
  choice: సాగిలపడ్డాడు
  rationale: ఈ క్రియ లోతుగా వంగి లేదా నేలపై పడి గౌరవం చూపడాన్ని సూచిస్తుంది. ‘సాగిలపడ్డాడు’ శారీరక భంగిమ తీవ్రతను నిలుపుతూ, దేవారాధన అని తప్పనిసరిగా సూచించదు.
theological_decisions:
- issue: సౌలు ఎదుట దావీదు చేసిన వంగి నమస్కరించే చర్య స్వరూపం
  choice: లోతైన గౌరవం, విధేయతను చూపే శారీరక భంగిమ
  alternative: ఆరాధించాడు
  rationale: שׁחה అనే క్రియ సందర్భానుసారం దేవుని ఆరాధించడానికీ మనుషులకు గౌరవం చూపడానికీ వాడవచ్చు. ఇక్కడ చర్య సౌలు ఎదుట జరుగుతోంది; కాబట్టి దైవారాధన భావాన్ని రుద్దకుండా, దావీదు చూపిన లోతైన గౌరవాన్ని నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘రాజా, నా ప్రభూ!’లో రాజపదవీ, దావీదు చూపిన వినయపూర్వక గౌరవమూ నిలుపబడ్డాయి. వరుసగా ఉన్న రెండు హెబ్రీ శారీరక చర్యలను ‘ముఖం నేలకు వంచి సాగిలపడ్డాడు’గా సంక్షిప్తంగా కానీ స్పష్టంగా వ్యక్తం చేశాం.
