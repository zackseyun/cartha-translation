  text: Afterward David’s heart struck him because he had cut off the corner of Saul’s robe[a][b].
translation:
  language: te
  text: ఆ తరువాత దావీదు హృదయం అతన్ని గుచ్చింది,[a] ఎందుకంటే అతను సౌలు వస్త్రపు అంచును[b] కోశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ మూలంలో అక్షరార్థంగా, “దావీదు హృదయం అతన్ని కొట్టింది”; ఇది అతని మనస్సాక్షి కలతపడిందని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “అంచు” అనే హెబ్రీ పదానికి వస్త్రపు “చివర,” “మూల” లేదా “కొంగు” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: మునుపటి చర్య తరువాత జరిగినదాన్ని సూచించే సహజమైన ఆధునిక తెలుగు కాలసూచకం.
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: దావీదు హృదయం అతన్ని నిందించింది
  rationale: హృదయాన్నే కర్తగా ఉంచి హెబ్రీయుల చిత్రణను నిలుపుతూ, అంతరంగంలో కలిగిన నైతిక కలతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל אֲשֶׁר
  choice: తాను ... కోసినందుకు
  rationale: దావీదు అంతరంగ కలతకు కారణాన్ని స్పష్టంగా తెలిపే సహజమైన తెలుగు నిర్మాణం.
- source_word: כָּרַת
  choice: కోసిన
  rationale: ఈ క్రియకు ఇక్కడ వస్త్రభాగాన్ని కోసివేయడం అనే భావం ఉంది; సంఘటనల క్రమం సందర్భంలో స్పష్టంగా ఉంది.
- source_word: כָּנָף
  choice: అంచు
  rationale: వస్త్రపు చివరి భాగం, అంచు లేదా మూలను సూచించే పదం; తెలుగు వస్త్ర సందర్భంలో ‘అంచు’ సహజంగా ఉండి హెబ్రీయుల విస్తృతార్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֶת כְּנַף אֲשֶׁר לְשָׁאוּל
  choice: సౌలు వస్త్రపు అంచును
  rationale: మూలంలో వస్త్రం అనే నామవాచకం ప్రత్యక్షంగా లేకపోయినా, ముందరి వచన సందర్భం దానిని స్పష్టం చేస్తుంది; తెలుగులో అర్థస్పష్టత కోసం ‘వస్త్రపు’ అని చేర్చబడింది.
