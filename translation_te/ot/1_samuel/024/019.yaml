reference: 1 Samuel 24:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ו/את הִגַּ֣דְתָּ הַ/יּ֔וֹם אֵ֛ת אֲשֶׁר עָשִׂ֥יתָה אִתִּ֖/י טוֹבָ֑ה אֵת֩ אֲשֶׁ֨ר סִגְּרַ֧/נִי יְהוָ֛ה בְּ/יָדְ/ךָ֖ וְ/לֹ֥א הֲרַגְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/019.yaml
  text: 'And you have declared today what good you have done to me: when Yahweh gave me into your hand[b][a], you did not kill me.'
translation:
  language: te
  text: 'నీవు నాకు మేలు చేశావని ఈ రోజు తెలియజేశావు: యాహ్వే నన్ను నీ చేతికి అప్పగించినప్పుడు[a], నీవు నన్ను చంపలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నన్ను నీ అధికారానికి అప్పగించినప్పుడు.”
    reason: ‘నీ చేతికి’ అనే హీబ్రూ రూపకం ఒకరి అధికారంలోకి లేదా అధీనంలోకి అప్పగించబడటాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: הִגַּדְתָּ
  choice: తెలియజేశావు
  rationale: נגד అనే క్రియ హిఫీల్ రూపంలో ‘తెలియజేయు, ప్రకటించు’ అనే అర్థాన్ని ఇస్తుంది. ఇక్కడ దావీదు చేసిన మేలు అతని చర్య ద్వారా స్పష్టమైందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: సూటిగా కాలాన్ని సూచించే పదబంధం; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: עָשִׂיתָה אִתִּי טוֹבָה
  choice: నీవు నాకు చేసిన మేలు
  rationale: అక్షరార్థంగా ‘నాతో/నాకు మేలు చేశావు.’ ‘చేసిన మేలు’ మూలంలోని క్రియాత్మక భావాన్ని నిలుపుతూ సహజంగా ఉంటుంది; ‘కనికరం’ అని అనువదిస్తే మూలంలో లేని ప్రత్యేక భావాన్ని జోడించే అవకాశం ఉంది.
- source_word: סִגְּרַנִי
  choice: నన్ను ... అప్పగించినప్పుడు
  rationale: సגר ఇక్కడ ఒకరిని మరొకరి అధికారంలోకి ‘అప్పగించు’ అనే భావంలో ఉంది. ‘మూసివేయు’ అనే మూలార్థం ఈ సందర్భంలో సహజం కాదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలిపాం; బిరుదుతో భర్తీ చేయలేదు.
- source_word: בְּיָדְךָ
  choice: నీ చేతికి
  rationale: ‘చేతిలో/చేతికి’ అనేది ఒకరి అధికారానికి అప్పగించబడటాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులోనూ అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: וְלֹא הֲרַגְתָּנִי
  choice: నీవు నన్ను చంపలేదు
  rationale: సరళమైన నిరాకరణతో కూడిన ‘చంపు’ క్రియకు స్పష్టమైన, ఆధునిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా, సాధారణ తెలుగు పాఠకులకు బాగా పరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం; ఉచ్చారణ పునర్నిర్మాణాన్ని ప్రతిబింబించే ‘యాహ్వే’ కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని ‘చేతికి’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
