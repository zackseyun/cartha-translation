id: 1SA.24.17
reference: 1 Samuel 24:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת דָּוִ֗ד לְ/דַבֵּ֞ר אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֶל שָׁא֔וּל וַ/יֹּ֣אמֶר שָׁא֔וּל הֲ/קֹלְ/ךָ֥ זֶ֖ה בְּנִ֣/י דָוִ֑ד וַ/יִּשָּׂ֥א שָׁא֛וּל קֹל֖/וֹ וַ/יֵּֽבְךְּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
translation:
  language: te
  text: దావీదు సౌలుతో ఈ మాటలు చెప్పడం ముగించినప్పుడు, సౌలు, “నా కుమారుడా, దావీదూ,[a] ఇది నీ స్వరమేనా?” అని అడిగాడు. ఆ తర్వాత సౌలు గొంతెత్తి ఏడ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదూ, నా కుమారుడా.”
    reason: హీబ్రూ పదక్రమాన్ని మరింత దగ్గరగా ప్రతిబింబించే సహజమైన ప్రత్యామ్నాయ సంబోధన.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת דָוִד לְדַבֵּר
  choice: దావీదు ... చెప్పడం ముగించినప్పుడు
  rationale: וַיְהִי + כְּ + infinitive construct నిర్మాణం తరువాతి చర్యకు కాలసంబంధ ఉపవాక్యాన్ని ఏర్పరుస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండే ఈ రూపం, దావీదు మాటలు ముగిసిన తరువాత సౌలు స్పందించిన క్రమాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలు
  rationale: ఈ సందర్భంలో דְּבָרִים అనేది దావీదు పలికిన మాటలను సూచిస్తుంది; కాబట్టి సాధారణ అర్థమైన ‘విషయాలు’ కంటే ‘మాటలు’ సందర్భానికి తగినది.
- source_word: אֶל־שָׁאוּל
  choice: సౌలుతో
  rationale: హీబ్రూ אֶל దిశను లేదా సంభాషణ ఉద్దేశిత వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘సౌలుతో ఈ మాటలు చెప్పడం’ సహజమైన ప్రయోగం; ఇది దావీదు సౌలునే ఉద్దేశించి మాట్లాడాడనే భావాన్ని కాపాడుతుంది.
- source_word: הֲקֹלְךָ זֶה
  choice: ఇది నీ స్వరమేనా?
  rationale: קוֹל ఇక్కడ గుర్తుపట్టగల మాట్లాడే స్వరాన్ని సూచిస్తుంది. ప్రశ్నార్థక הֲ మరియు సమీప సూచకమైన זֶה భావాలను ‘ఇది ... ఏనా?’ రూపం నిలుపుతుంది.
- source_word: בְּנִי דָוִד
  choice: నా కుమారుడా, దావీదూ
  rationale: సౌలు ఉపయోగించిన ఆప్యాయమైన పుత్రసంబోధనను యథాతథంగా నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన సంబోధన విభక్తులను వాడింది.
- source_word: וַיִּשָּׂא שָׁאוּל קֹלוֹ
  choice: సౌలు గొంతెత్తి
  rationale: అక్షరార్థంగా ‘తన స్వరాన్ని ఎత్తాడు’ అనే హీబ్రూ నుడికారానికి ‘గొంతెత్తి’ సహజమైన తెలుగు సమానం. ఇది భావోద్వేగంతో వినిపించేలా ఏడ్చిన సంగతిని తెలిపినా, తరువాతి క్రియను అనవసరంగా విస్తరించదు.
- source_word: וַיֵּבְךְּ
  choice: ఏడ్చాడు
  rationale: ఈ క్రియ కన్నీరు పెట్టుకొని ఏడవడాన్ని స్పష్టంగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఏడ్చాడు’ ఖచ్చితమైన, సహజమైన పదం.
theological_decisions:
- issue: సౌలు దావీదును ‘నా కుమారుడా’ అని సంబోధించడం
  choice: సంబంధాత్మకమైన, భావోద్వేగపూరిత సంబోధనగా యథాతథంగా ఉంచబడింది.
  alternative: కేవలం రాజకీయ అనుగ్రహం లేదా పోషకత్వాన్ని తెలిపే పదంగా వివరించడం.
  rationale: హీబ్రూ పాఠం స్పష్టంగా పుత్రసంబంధ భాషను ఉపయోగిస్తుంది. అనువాదం దానికి ప్రత్యేక సిద్ధాంతార్థాన్ని చేర్చకుండా, దాని సామాజిక మరియు భావోద్వేగ బలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వృత్తాంతానికి తగిన గంభీరతతో రూపొందించబడింది. ‘గొంతెత్తి ఏడ్చాడు’ అనే సహజ తెలుగు నుడికారం మూలంలోని భావోద్వేగ వ్యక్తీకరణను నిలుపుతుంది.
