source:
  edition: WLC
  text: וַ/יִּקַּ֣ח שָׁא֗וּל שְׁלֹ֧שֶׁת אֲלָפִ֛ים אִ֥ישׁ בָּח֖וּר מִ/כָּל יִשְׂרָאֵ֑ל וַ/יֵּ֗לֶךְ לְ/בַקֵּ֤שׁ אֶת דָּוִד֙ וַֽ/אֲנָשָׁ֔י/ו עַל פְּנֵ֖י צוּרֵ֥י הַ/יְּעֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
translation:
  language: te
  text: అప్పుడు సౌలు ఇశ్రాయేలీయులందరిలో నుంచి ఎంపిక చేసిన మూడు వేల మందిని వెంటబెట్టుకొని, అడవి మేకల బండల ఎదురుగా[a] దావీదును, అతని మనుషులను వెదకడానికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అడవి మేకల కొండచరియల ఎదురుగా’; ఇక్కడ చెప్పిన జంతువు ప్రత్యేకంగా ఐబెక్స్ అనే కొండమేక జాతి కావచ్చు.
    reason: צוּרֵי అనే పదానికి ‘బండలు/కొండచరియలు’ అనే ప్రత్యామ్నాయాలు ఉన్నాయి; יְעֵלִים సాధారణ అడవి మేకలను లేదా ప్రత్యేకంగా ఐబెక్స్‌ను సూచించవచ్చు.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: వెంటబెట్టుకొని
  rationale: ఈ సందర్భంలో సౌలు సైనికులను తనతో తీసుకొని వెళ్లాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ בָּחוּר
  choice: ఎంపిక చేసిన మూడు వేల మందిని
  rationale: בָּחוּר ఇక్కడ యుద్ధయాత్ర కోసం ప్రత్యేకంగా ఎంపిక చేసిన వారిని సూచిస్తుంది; సైనిక సందర్భాన్ని అతిగా విస్తరించకుండా మూల భావాన్ని నిలుపుతుంది.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరిలో నుంచి
  rationale: దేశమంతటిలోని ప్రజల నుంచి వారిని ఎంపిక చేశాడనే పంపిణీ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ לְבַקֵּשׁ
  choice: వెదకడానికి వెళ్లాడు
  rationale: లక్ష్యాన్ని తెలిపే హెబ్రీ అనంతరూప నిర్మాణాన్ని సహజమైన తెలుగు ప్రయోజనార్థక నిర్మాణంతో ప్రతిబింబిస్తుంది.
- source_word: אֶת דָּוִד וַאֲנָשָׁיו
  choice: దావీదును, అతని మనుషులను
  rationale: దావీదుతో ఉన్న అనుచరులను సూచించే సరళమైన, సందర్భోచిత అనువాదం.
- source_word: עַל פְּנֵי
  choice: ఎదురుగా
  rationale: స్థలసంబంధమైన హెబ్రీ ప్రయోగాన్ని అతిగా అక్షరార్థం చేయకుండా, దాని ‘ముందు/ఎదురుగా’ అనే భావాన్ని నిలుపుతుంది.
- source_word: צוּרֵי הַיְּעֵלִים
  choice: అడవి మేకల బండలు
  rationale: צוּרֵי అనే పదంలోని రాతిబండలు/కొండచరియల భావాన్ని అందుబాటులో ఉండే భాషలో ఇస్తుంది; יְעֵלִים ప్రత్యేకంగా ఐబెక్స్ జాతిని సూచించే అవకాశం పాదసూచికలో నిలుపబడింది.
