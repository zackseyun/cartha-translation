  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
translation:
  language: te
  text: దావీదు సౌలుకు ప్రమాణం చేశాడు. అప్పుడు సౌలు తన ఇంటికి వెళ్లాడు; అయితే దావీదూ అతని మనుషులూ కోటకు పైకి వెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదూ అతని మనుషులూ కోటకు పైకి వెళ్లారు.” హీబ్రూలో సంధాయక పదం అక్షరార్థంగా “మరియు”; ప్రధాన పాఠంలోని “అయితే” కథనంలోని వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేశాడు
  rationale: שׁבע నిఫ్అల్ రూపం ఇక్కడ ప్రమాణం చేయడాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ఇది సహజమైన, నేరమైన అనువాదం.
- source_word: לְשָׁאוּל
  choice: సౌలుకు
  rationale: ל ఇక్కడ ప్రమాణం ఎవరికి చేయబడిందో సూచిస్తుంది; తెలుగు సంప్రదాన విభక్తి దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּלֶךְ שָׁאוּל אֶל־בֵּיתוֹ
  choice: తరువాత సౌలు తన ఇంటికి వెళ్లాడు
  rationale: בַּיִת ఇక్కడ ఇల్లు లేదా నివాసం అనే అర్థంలో ఉంది; ‘తన ఇంటికి’ హీబ్రూ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: అయితే దావీదు, అతని మనుషులు
  rationale: וְ అక్షరార్థంగా ‘మరియు’; సందర్భంలో సౌలు ఇంటికి వెళ్లడం, దావీదు తన మనుషులతో వేరే చోటుకు వెళ్లడం మధ్య వ్యత్యాసాన్ని ‘అయితే’ సహజంగా చూపిస్తుంది. ‘అతని మనుషులు’ సైనిక అనుచరుల సందర్భానికి సరిపోతుంది.
- source_word: עָלוּ
  choice: వెళ్లారు
  rationale: עלה అక్షరార్థంగా ‘పైకి వెళ్లారు’; తెలుగులో ‘కొండకోటకు పైకి వెళ్లారు’ అనడం భారంగా ఉండేందున గమ్యస్థాన పదంలోని ఎత్తైన ప్రదేశ భావంతో కలిపి సహజంగా ‘వెళ్లారు’ అని ఇచ్చాం; ప్రత్యక్ష దిశార్థం పాదటిప్పణిలో భద్రపరచబడింది.
- source_word: הַמְּצוּדָה
  choice: కొండకోట
  rationale: מְצוּדָה రక్షణనిచ్చే దుర్గం లేదా బలమైన ఆశ్రయాన్ని సూచిస్తుంది. దావీదు అరణ్యప్రాంత సందర్భంలో ‘కొండకోట’ స్థల స్వభావాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
