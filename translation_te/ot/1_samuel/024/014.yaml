  yaml_path: translation/ot/1_samuel/024/014.yaml
  text: As the ancient proverb says[a], ‘Wickedness comes out from the wicked,’ but my hand will not be against you.
translation:
  language: te
  text: పూర్వకాలపు సామెత చెప్పినట్లు[a], ‘దుష్టుల నుండి దుష్టత్వం వెలువడుతుంది.’ అయితే నా చెయ్యి నీకు విరోధంగా ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పూర్వీకుల సామెత చెప్పినట్లు.’ హీబ్రూ విశేషణం ‘పూర్వకాలపు’ అని గానీ, ‘పూర్వీకులకు చెందిన’ అని గానీ అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: చెప్పినట్లు
  rationale: సామెతను ఉదహరించే పోలిక సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יֹאמַר
  choice: చెప్పినట్లు
  rationale: ఇక్కడ అసంపూర్ణ క్రియ సాధారణంగా ఎప్పటికీ వర్తించే సామెత ఉటంకింపును సూచిస్తుంది; తెలుగు ప్రయోగంలో ‘సామెత చెప్పినట్లు’ సహజం.
- source_word: מְשַׁל
  choice: సామెత
  rationale: ఇది విస్తృతమైన ఉపమానకథ కాకుండా సంప్రదాయ జ్ఞానోక్తిని సూచిస్తుంది.
- source_word: הַקַּדְמֹנִי
  choice: పూర్వకాలపు
  rationale: ఈ విశేషణం ప్రాచీనమైనదని లేదా పూర్వీకులకు చెందినదని సూచించగలదు; ‘పూర్వకాలపు’ ప్రధాన భావాన్ని సహజంగా అందిస్తుంది, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מֵרְשָׁעִים
  choice: దుష్టుల నుంచే
  rationale: מִן మూలాన్ని సూచిస్తుంది. ‘దుష్టులు’ నైతిక వర్గాన్ని సామూహికంగా వ్యక్తం చేస్తుంది; ‘నుంచే’ సామెతలోని మూల-ఫల సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: יֵצֵא
  choice: బయలుదేరుతుంది
  rationale: క్రియలోని ‘బయటికి వెళ్లడం/వెలువడడం’ అనే చిత్రాన్ని నిలుపుతూ ఆధునిక తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: רֶשַׁע
  choice: దుష్టత్వం
  rationale: ముందున్న ‘దుష్టులు’ అనే పదంతో మూలంలోని శబ్దార్థ సంబంధాన్ని నిలుపుతుంది.
- source_word: וְיָדִי
  choice: అయితే నా చెయ్యి
  rationale: ‘చెయ్యి’ అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది; సందర్భంలోని వ్యత్యాసాన్ని తెలుగులో ‘అయితే’ స్పష్టం చేస్తుంది.
- source_word: לֹא תִהְיֶה בָּךְ
  choice: నీకు విరోధంగా ఉండదు
  rationale: అక్షరార్థంలోని చెయ్యి ఒకరిపై/విరోధంగా ఉండడమనే రూపకాన్ని కాపాడుతూ, సౌలుపై హాని చేయననే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
