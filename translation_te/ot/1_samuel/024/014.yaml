translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. సామెతలోని ‘దుష్టులు—దుష్టత్వం’ పదసంబంధాన్ని, అలాగే ‘నా చెయ్యి నీకు విరోధంగా’ అనే మూల రూపకాన్ని నిలుపుకుంది.
