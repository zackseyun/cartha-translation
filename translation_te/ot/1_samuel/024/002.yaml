translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనశైలికి తగిన సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. హీబ్రూలోని అనిర్దిష్ట బహువచన కర్తను ‘కొందరు’గా సహజంగా వ్యక్తం చేశాం.
