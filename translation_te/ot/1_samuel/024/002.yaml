  text: When Saul returned from pursuing the Philistines, they told him, saying, “Look, David is in the wilderness of En-gedi.”
translation:
  language: te
  text: సౌలు ఫిలిష్తీయులను వెంబడించి తిరిగివచ్చినప్పుడు, అతనికి, “ఇదిగో, దావీదు ఏన్‌గెదీ అరణ్యంలో ఉన్నాడు” అని తెలియజేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאַחֲרֵי פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులను వెంబడించడం ముగించుకొని
  rationale: మֵאַחֲרֵי అనే ప్రయోగం ఇక్కడ ఫిలిష్తీయుల వెంట వెళ్లి వారిని వెంబడించిన సందర్భాన్ని సూచిస్తుంది; ‘ముగించుకొని తిరిగి’ అనడం సహజమైన తెలుగులో సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: הִנֵּה
  choice: చూడండి
  rationale: శ్రద్ధ ఆకర్షించే హీబ్రూ ఉద్గారాన్ని ఆధునిక, సహజ తెలుగులో నిలుపుతుంది.
- source_word: בְּמִדְבַּר עֵין גֶּדִי
  choice: ఏన్‌గెదీ అరణ్యంలో
  rationale: מִדְבָּר ఇక్కడ జనావాసం తక్కువైన అరణ్యప్రాంతాన్ని సూచిస్తుంది; స్థలనామాన్ని లిప్యంతరీకరించాం.
