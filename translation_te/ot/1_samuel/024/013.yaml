  variant: modern standard Telugu
source:
  edition: WLC
  text: יִשְׁפֹּ֤ט יְהוָה֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/נְקָמַ֥/נִי יְהוָ֖ה מִמֶּ֑/ךָּ וְ/יָדִ֖/י לֹ֥א תִֽהְיֶה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
translation:
  language: te
  text: నాకూ నీకూ మధ్య యాహ్వే తీర్పు తీర్చుగాక; యాహ్వే నీ మీద నాకు ప్రతీకారం తీర్చుగాక.[a] అయితే నా చెయ్యి నీకు విరోధంగా ఉండదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నా కోసం నీ మీద ప్రతీకారం తీర్చుగాక.”
    reason: נקם מן నిర్మాణాన్ని తెలుగు పదక్రమంలో మరో సహజమైన రూపంలో చూపడానికి; మూలపాఠంలో లేని వివరాన్ని జోడించకుండా ఉంచడానికి.
  - marker: b
    text: “నా చెయ్యి నీకు విరోధంగా ఉండదు” అనేది తాను నీకు హాని చేయనని చెప్పే హీబ్రూ నుడికారం.
    reason: అక్షరార్థంగా నిలిపిన ‘చెయ్యి’ అనే రూపకపు భావాన్ని ఆధునిక పాఠకులకు వివరించడానికి.
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: తీర్పు తీర్చుగాక
  rationale: ఇక్కడి యిక్తోల్ రూపం సాధారణ భవిష్యత్తును కాక, దావీదు చేస్తున్న ప్రార్థనాత్మక విన్నపాన్ని సూచిస్తుంది. ‘తీర్పు తీర్చుగాక’ ఆ భావాన్ని సహజమైన తెలుగు ఆశీర్వాదార్థక/విన్నపార్థక రూపంలో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: నాకూ నీకూ మధ్య
  rationale: హీబ్రూలోని ఇద్దరి మధ్య న్యాయనిర్ణయం అనే ప్రత్యక్ష నిర్మాణాన్ని నిలుపుతూ, సహజమైన తెలుగు పదక్రమాన్ని వాడాం.
- source_word: וּנְקָמַנִי ... מִמֶּךָּ
  choice: నా పక్షంగా నీ మీద ప్రతీకారం తీర్చుగాక
  rationale: נקם పదంలోని ప్రతీకార భావాన్ని మృదువుగా ‘న్యాయం చేయడం’గా మార్చకుండా నిలిపాం. ‘నా పక్షంగా’ అనేది దావీదు స్వయంగా ప్రతీకారం చేయకుండా, యెహోవాకు దానిని అప్పగిస్తున్న సందర్భాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: అయితే నా చెయ్యి నీకు విరోధంగా ఉండదు
  rationale: ‘చెయ్యి’ అనే హీబ్రూ రూపకాన్ని నిలిపి, ముందు చెప్పిన దేవుని చర్యకు దావీదు స్వీయనిగ్రహాన్ని వ్యతిరేకార్థకంగా కలపడానికి ‘అయితే’ వాడాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తున్నందున దానిని సాధారణ బిరుదుతో భర్తీ చేయలేదు.
- issue: దావీదు కోరుతున్న נקם స్వభావం
  choice: యెహోవా దావీదు పక్షంగా సౌలు మీద ప్రతీకారం తీర్చాలని చేసే విన్నపం
  alternative: కేవలం దావీదును నిర్దోషిగా నిర్ధారించాలనే విన్నపం
  rationale: נקם లోని నిజమైన ప్రతీకార భావాన్నీ, అదే సమయంలో దావీదు తన చేతితో సౌలుకు హాని చేయననే ఉద్రిక్తతనూ మూలపాఠం ఉంచినట్లే అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ప్రార్థనాత్మక ‘-గాక’ రూపం మూలంలోని జస్సివ్ బలాన్ని నిలుపుతుంది; ‘ప్రతీకారం’ అనే బలమైన పదాన్ని ఉద్దేశపూర్వకంగా మృదువుచేయలేదు.
