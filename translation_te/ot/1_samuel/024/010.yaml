source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/שָׁא֔וּל לָ֧/מָּה תִשְׁמַ֛ע אֶת דִּבְרֵ֥י אָדָ֖ם לֵ/אמֹ֑ר הִנֵּ֣ה דָוִ֔ד מְבַקֵּ֖שׁ רָעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
translation:
  language: te
  text: 'దావీదు సౌలుతో ఇలా అన్నాడు: “ఇదిగో, దావీదు నీకు కీడు చేయాలని చూస్తున్నాడని చెప్పే ఒక మనిషి[a] మాటలకు నీవెందుకు చెవియొగ్గుతున్నావు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఒక మనిషి” అని ఉన్న హీబ్రూ పదాన్ని సందర్భాన్ని బట్టి “మనుషులు” లేదా “ప్రజలు” అనే సాధారణ అర్థంలో కూడా గ్రహించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לְשָׁאוּל
  choice: దావీదు సౌలుతో ఇలా అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో సహజమైన కథన శైలికి ‘ఇలా అన్నాడు’ సరిపోతుంది. לְ ఉపసర్గ సంభాషణ ఉద్దేశితుని సూచిస్తుంది.
- source_word: לָמָּה תִשְׁמַע
  choice: నీవెందుకు వింటున్నావు?
  rationale: שׁמע ఇక్కడ కేవలం శబ్దం వినడాన్ని కాక, మాటకు చెవియొగ్గడం లేదా దాన్ని పట్టించుకోవడాన్ని సూచిస్తుంది. ప్రశ్నలోని మందలింపు భావాన్ని సహజ తెలుగు వర్తమాన రూపం వ్యక్తం చేస్తుంది.
- source_word: דִּבְרֵי אָדָם
  choice: ఒక మనిషి మాటలను
  rationale: אָדָם ఏకవచనంలో ఉంది; సందర్భంలో సౌలుకు దావీదు గురించి అపవాదు చెప్పే వ్యక్తిని సూచించే అవకాశాన్ని నిలుపుతూ ఏకవచనంగానే అనువదించబడింది.
- source_word: לֵאמֹר
  choice: చెప్పే
  rationale: నివేదిత మాటల విషయాన్ని పరిచయం చేసే ఈ infinitiveను, ‘ఒక మనిషి మాటలు’తో సహజంగా అనుసంధానించే సంబంధార్థక క్రియారూపంగా ఇచ్చాం.
- source_word: הִנֵּה
  choice: ప్రత్యేక పదంగా వ్యక్తం చేయలేదు
  rationale: హీబ్రూలో ఇది దృష్టిని ఆకర్షించే సూచకం. ఈ వాక్య నిర్మాణంలో తెలుగు ఉద్ధృత వాక్యమే ఆరోపణను ముందుకు తెస్తుంది; ‘ఇదిగో’ చేరిస్తే ఇక్కడ అసహజంగా వినిపించే అవకాశం ఉంది.
- source_word: מְבַקֵּשׁ רָעָתֶךָ
  choice: నీకు కీడు చేయాలని చూస్తున్నాడు
  rationale: పార్టిసిపిల్ కొనసాగుతున్న లేదా ఉద్దేశపూర్వక ప్రయత్నాన్ని సూచిస్తుంది. רָעָה ఇక్కడ నైతిక ‘చెడు’కన్నా సౌలుకు హాని లేదా కీడు అనే ఆరోపణను సూచిస్తుంది; తెలుగు ప్రయోగంలో క్రియాత్మక రూపం సహజం.
theological_decisions:
- issue: אָדָם యొక్క ఏకవచన లేదా సామూహిక అర్థం
  choice: ఒక మనిషి
  alternative: మనుషుల / ప్రజల మాటలు
  rationale: రూపం ఏకవచనం; ఈ సందర్భంలో ఒక అపవాదిని సూచించవచ్చు. అదే సమయంలో సామాన్య మానవార్థం సాధ్యమని పాదటిప్పణిలో నమోదు చేసి మూలంలోని అర్థావకాశాన్ని కాపాడాం.
- issue: רָעָתֶךָలోని ‘కీడు’ భావం
  choice: నీకు కీడు చేయాలని
  alternative: నీకు విరోధంగా చెడు కోరుతున్నాడు
  rationale: సందర్భం దావీదు సౌలుకు హాని తలపెడుతున్నాడనే ఆరోపణ. ‘కీడు’ హాని మరియు చెడు రెండింటి భావ ఛాయలను నిలుపుతుంది; దావీదు నైతిక దుష్టత్వాన్ని స్పష్టంగా ప్రకటించినట్టు అతిశయింపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద కథన శైలి. ‘కీడు చేయాలని చూస్తున్నాడు’ అనే ప్రయోగం మూలంలోని కొనసాగుతున్న ప్రయత్న భావాన్ని సహజంగా తెలియజేస్తుంది.
