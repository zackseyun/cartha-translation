revisions:
- from: యెహోవా న్యాయాధిపతిగా ఉండి, నీకూ నాకూ మధ్య తీర్పు తీర్చుగాక. ఆయన చూసి, నా వ్యాజ్యాన్ని వాదించి, నీ చేతినుండి నాకు న్యాయం చేయుగాక.
  to: యెహోవా న్యాయాధిపతిగా ఉండి, నాకు నీకు మధ్య తీర్పు తీర్చుగాక. ఆయన చూసి, నా పక్షంగా వాదించి, నీ చేతి నుండి నన్ను విడిపించి నాకు న్యాయం చేయుగాక.
  rationale: The revision keeps all four linked legal actions and the prayer-like force of the Hebrew. It improves idiomatic Telugu in the final two clauses and makes explicit the deliverance-from-your-hand aspect that accompanies judicial vindication, without imposing a theological interpretation.
  reviewer_model: gpt-5.6-terra
