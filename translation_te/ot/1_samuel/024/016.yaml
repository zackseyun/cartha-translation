review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the sequence of judicial actions in the Hebrew: YHWH as judge, adjudication between the two parties, seeing, contending for David''s case, and a final act of judicial vindication/deliverance from Saul''s hand. The final Telugu clause, however, is less idiomatic and does not clearly express the personal deliverance implicit in ''from your hand.'''
  naturalness: The register and optative '-గాక' forms are appropriate for modern standard Telugu scripture. 'నా వ్యాజ్యాన్ని వాదించి' is understandable but less natural than explicitly stating that YHWH pleads on the speaker's behalf. 'నీ చేతినుండి నాకు న్యాయం చేయుగాక' is awkward Telugu.
  terminology: యెహోవా, న్యాయాధిపతి, తీర్పు తీర్చు, and న్యాయం are suitable. 'నా పక్షంగా వాదించి' naturally retains the forensic force of רִיבִי without needlessly repeating 'వ్యాజ్యం.'
  issues:
  - severity: medium
    issue: The final clause is awkward and underexpresses deliverance from the opponent's power.
    rationale: וְיִשְׁפְּטֵנִי מִיָּדֶךָ combines judicial vindication with rescue from 'your hand.' Adding 'నన్ను విడిపించి' makes the Telugu natural and preserves this contextual force.
  - severity: low
    issue: The wording for pleading the case is slightly unnatural.
    rationale: '''నా పక్షంగా వాదించి'' is clearer modern Telugu for the idiom ''plead my case'' while retaining the legal image.'
  revised_text: యెహోవా న్యాయాధిపతిగా ఉండి, నాకు నీకు మధ్య తీర్పు తీర్చుగాక. ఆయన చూసి, నా పక్షంగా వాదించి, నీ చేతి నుండి నన్ను విడిపించి నాకు న్యాయం చేయుగాక.
  revised_footnotes: []
  revision_rationale: The revision keeps all four linked legal actions and the prayer-like force of the Hebrew. It improves idiomatic Telugu in the final two clauses and makes explicit the deliverance-from-your-hand aspect that accompanies judicial vindication, without imposing a theological interpretation.
