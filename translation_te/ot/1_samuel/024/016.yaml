id: 1SA.24.16
reference: 1 Samuel 24:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֤ה יְהוָה֙ לְ/דַיָּ֔ן וְ/שָׁפַ֖ט בֵּינִ֣/י וּ/בֵינֶ֑/ךָ וְ/יֵ֨רֶא֙ וְ/יָרֵ֣ב אֶת רִיבִ֔/י וְ/יִשְׁפְּטֵ֖/נִי מִ/יָּדֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/016.yaml
  text: May the LORD be judge and decide between me and you, see and plead my case, and vindicate me from your hand.
translation:
  language: te
  text: యెహోవా న్యాయాధిపతిగా ఉండి, నాకు నీకు మధ్య తీర్పు తీర్చుగాక. ఆయన చూసి, నా పక్షంగా వాదించి, నీ చేతి నుండి నన్ను విడిపించి నాకు న్యాయం చేయుగాక.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה יְהוָה לְדַיָּן
  choice: యెహోవా న్యాయాధిపతిగా ఉండి
  rationale: హీబ్రూ వాక్యనిర్మాణాన్ని సహజమైన తెలుగు ఆశయార్థక వాక్యంగా నిలుపుతూ, దైవనామాన్ని యెహోవా అని లిప్యంతరీకరించాం.
- source_word: וְשָׁפַט בֵּינִי וּבֵינֶךָ
  choice: నీకూ నాకూ మధ్య తీర్పు తీర్చుగాక
  rationale: שפט యొక్క న్యాయపరమైన భావాన్ని స్పష్టంగా అందిస్తుంది; పరస్పర పక్షాల మధ్య తీర్పు అనే మూల భావాన్ని నిలుపుతుంది.
- source_word: וְיָרֵב אֶת רִיבִי
  choice: నా వ్యాజ్యాన్ని వాదించి
  rationale: ריב పదపునరుక్తిలోని న్యాయవివాదం/పక్షవాదం భావాన్ని తెలుగులో సహజమైన న్యాయపరమైన పదాలతో వ్యక్తపరుస్తుంది.
- source_word: וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: నీ చేతినుండి నాకు న్యాయం చేయుగాక
  rationale: ఇక్కడ שפט రూపం కేవలం తీర్పు చెప్పడం కాక, ప్రతిపక్షపు అధికారం నుంచి న్యాయపూర్వక విముక్తి కలిగించడం అనే సందర్భార్థాన్ని ఇస్తుంది; 'నీ చేతినుండి' అనే హీబ్రూ రూపకాన్ని నిలిపాం.
theological_decisions:
- issue: దేవుడు న్యాయాధిపతిగాను పక్షవాదిగాను చిత్రించబడటం
  choice: న్యాయాధిపతి, వ్యాజ్యాన్ని వాదించేవాడు అనే రెండు చిత్రాలనూ నిలిపాం
  alternative: రెండింటినీ సాధారణంగా ‘నాకు న్యాయం చేయుగాక’ అని కలిపివేయడం
  rationale: మూలంలో తీర్పు తీర్చడం, చూడడం, వ్యాజ్యం వాదించడం, న్యాయం చేయడం అనే వేర్వేరు న్యాయచర్యలు వరుసగా ఉన్నాయి; వాటి ఉత్కంఠను కుదించలేదు.
- issue: וְיִשְׁפְּטֵנִי యొక్క సందర్భార్థం
  choice: నాకు న్యాయం చేయుగాక
  alternative: నాకు తీర్పు తీర్చుగాక / నన్ను విడిపించుగాక
  rationale: ఈ రూపం వ్యాకరణపరంగా ‘నాకు తీర్పు తీర్చు’ అని ఉండగలిగినా, מִיָּדֶךָతో కలిసి సందర్భంలో న్యాయవిమోచన భావం ప్రధానంగా ఉంది. ‘విడిపించు’ అని మాత్రమే అనడం న్యాయస్థాన భావాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆశయార్థాన్ని ‘-గాక’ రూపంతో వ్యక్తపరిచాం. మూలంలోని న్యాయస్థాన పదచిత్రాన్ని సాధ్యమైనంత స్పష్టంగా నిలిపాం.
