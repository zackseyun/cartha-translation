id: 1SA.24.12
reference: 1 Samuel 24:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
translation:
  language: te
  text: “నా తండ్రీ, చూడండి—అవును, నా చేతిలో ఉన్న మీ అంగీ అంచును[a] చూడండి. నేను మీ అంగీ అంచును కోసినా మిమ్మల్ని చంపలేదు. నా చేతిలో ఏ దుష్టత్వమూ తిరుగుబాటూ[b] లేవని తెలుసుకోండి, చూడండి. నేను మీకు విరోధంగా పాపం చేయలేదు; అయినా మీరు నా ప్రాణం తీయడానికి నన్ను వేటాడుతున్నారు[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ అంగీ కొంగును” లేదా “మీ అంగీ చివరను.”
    reason: כָּנָף వస్త్రపు అంచు, చివర లేదా కొంగును సూచించగలదు.
  - marker: b
    text: లేదా “అతిక్రమమూ.”
    reason: פֶשַׁע అనే పదానికి తిరుగుబాటు, తీవ్రమైన అపరాధం లేదా అతిక్రమం అనే భావాలు ఉన్నాయి.
  - marker: c
    text: అక్షరార్థంగా, “మీరు నా ప్రాణాన్ని తీసుకోవడానికి దానిని వేటాడుతున్నారు.”
    reason: మూలభాషలో ‘నా ప్రాణం’ వేటకు గురయ్యే ప్రత్యక్ష కర్మగా ఉంది; తెలుగు ప్రధాన పాఠ్యంలో సహజమైన వాక్యనిర్మాణం ఉపయోగించబడింది.
lexical_decisions:
- source_word: וְאָבִי
  choice: నా తండ్రీ
  rationale: సౌలును దావీదు గౌరవపూర్వకంగా, కుటుంబ-రాజకీయ అనుబంధాన్ని సూచిస్తూ సంబోధిస్తున్నాడు. తెలుగు గౌరవ బహువచన క్రియారూపాలు సందర్భానికి సహజంగా సరిపోతాయి.
- source_word: רְאֵה גַּם רְאֵה
  choice: చూడండి—అవును, ... చూడండి
  rationale: గַּםతో కూడిన పునరుక్తి బలమైన నొక్కిచెప్పడాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ఉండేలా రెండు క్రియలనూ నిలిపాం.
- source_word: כְּנַף מְעִילְךָ
  choice: మీ అంగీ అంచు
  rationale: כָּנָף వస్త్రపు చివర, అంచు లేదా కొంగును సూచిస్తుంది. ఇక్కడ కోసిన భౌతిక భాగాన్ని స్పష్టంగా తెలియజేయడానికి ‘అంచు’ ఎంచుకున్నాం.
- source_word: בְּיָדִי
  choice: నా చేతిలో
  rationale: మొదటి సందర్భంలో దావీదు చూపిస్తున్న సాక్ష్యం నిజంగా అతని చేతిలో ఉంది; తరువాతి సందర్భంలో అదే పదబంధం అతని క్రియాశక్తి లేదా బాధ్యతను సూచిస్తుంది. ఈ పదబంధ సంబంధాన్ని నిలిపాం.
- source_word: כִּי בְכָרְתִי
  choice: నేను ... కోసినా
  rationale: సందర్భంలో ఇది సౌలు అంగీని కోసే అవకాశం ఉన్నప్పటికీ అతన్ని చంపలేదనే విరుద్ధతను తెలియజేస్తుంది. ‘కోసినా’ తెలుగులో ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דַּע וּרְאֵה
  choice: తెలుసుకొని చూడండి
  rationale: సాక్ష్యాన్ని గమనించి దాని నైతిక అర్థాన్ని గ్రహించమనే రెండు ఆజ్ఞల భావాన్ని నిలిపాం.
- source_word: רָעָה וָפֶשַׁע
  choice: దుష్టత్వమూ తిరుగుబాటూ
  rationale: רָעָה నైతిక చెడును, פֶשַׁע ఇక్కడ రాజుకు వ్యతిరేకమైన తిరుగుబాటు లేదా తీవ్రమైన అతిక్రమాన్ని సూచించగలదు. సౌలు ఎదుట దావీదు తన రాజద్రోహ ఉద్దేశాన్ని నిరాకరిస్తున్న సందర్భంలో ‘తిరుగుబాటు’ ప్రధాన పఠనం.
- source_word: וְלֹא חָטָאתִי לָךְ
  choice: నేను మీకు విరోధంగా పాపం చేయలేదు
  rationale: חטא యొక్క నైతిక-ఆధ్యాత్మిక బరువును ‘పాపం’ నిలుపుతుంది; לָךְ వ్యక్తికి వ్యతిరేకంగా చేసిన అపరాధాన్ని సూచిస్తుంది.
- source_word: צֹדֶה אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: నా ప్రాణం తీయడానికి నన్ను వేటాడుతున్నారు
  rationale: మూలంలోని వేట రూపకాన్ని నిలుపుతూ, ‘నా ప్రాణాన్ని వేటాడడం’ అనే తెలుగులో అసహజమైన నిర్మాణాన్ని సహజంగా మార్చాం. లక్ష్యం దావీదును చంపడమేనని స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: פֶשַׁע పదంలోని నైతిక-రాజకీయ భావం
  choice: తిరుగుబాటు
  alternative: అతిక్రమం
  rationale: రాజైన సౌలు ఎదుట దావీదు తన నిర్దోషిత్వాన్ని సమర్థించుకుంటున్నందున రాజకీయ అవిధేయత లేదా రాజద్రోహ భావం సందర్భంలో ప్రధానంగా ఉంది. అయితే సాధారణ నైతిక ‘అతిక్రమం’ అనే అర్థం కూడా సాధ్యమే కనుక పాదసూచికలో నిలిపాం.
- issue: נֶפֶשׁ యొక్క సందర్భార్థం
  choice: ప్రాణం
  alternative: వ్యక్తి / నేను
  rationale: ఇక్కడ נֶפֶשׁ దావీదు జీవప్రాణాన్ని సూచిస్తుంది. ‘ప్రాణం తీయడం’ అనే తెలుగు ప్రయోగం మరణింపజేయాలనే ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది; వేట రూపకాన్ని ‘నన్ను వేటాడుతున్నారు’లో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, కానీ సాధారణ పాఠకులకు సులభమైన శైలి. సౌలును ఉద్దేశించిన ఏకవచన హీబ్రూ రూపాలకు తెలుగులో మర్యాద సూచించే బహువచన క్రియారూపాలు వాడబడ్డాయి. మూలంలోని ‘చేతి’ పునరావృత్తి, ‘చూడడం/తెలుసుకోవడం’ జంట, వేట రూపకం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
