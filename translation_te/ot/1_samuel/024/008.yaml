  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. అరుదైన హీబ్రూ క్రియలోని అనిశ్చితిని ప్రధాన పాఠంలో బలమైన అదుపు భావంతో, పాదటిప్పణిలో ప్రత్యామ్నాయంగా నిలిపాం.
