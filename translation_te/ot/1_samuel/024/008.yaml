source:
  edition: WLC
  text: וַ/יְשַׁסַּ֨ע דָּוִ֤ד אֶת אֲנָשָׁי/ו֙ בַּ/דְּבָרִ֔ים וְ/לֹ֥א נְתָנָ֖/ם לָ/ק֣וּם אֶל שָׁא֑וּל וְ/שָׁא֛וּל קָ֥ם מֵ/הַ/מְּעָרָ֖ה וַ/יֵּ֥לֶךְ בַּ/דָּֽרֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/008.yaml
  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
translation:
  language: te
  text: దావీదు తన మనుష్యులను మాటలతో గట్టిగా అదుపుచేసి, సౌలుకు వ్యతిరేకంగా లేవనివ్వలేదు.[a] తరువాత సౌలు గుహలోనుండి లేచి తన దారిన వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు తన మనుష్యులను మాటలతో తీవ్రంగా గద్దించాడు.” ఇక్కడి హీబ్రూ క్రియ అరుదైనది; కేవలం అదుపుచేయడం కంటే బలమైన భావం దానిలో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁסַּע
  choice: గట్టిగా అదుపుచేసి
  rationale: ఈ అరుదైన క్రియకు చీల్చడం, తీవ్రంగా గద్దించడం వంటి బలమైన భావఛాయలు ఉండవచ్చు. సందర్భంలో దావీదు తన మనుష్యులు సౌలుపై చర్య తీసుకోకుండా ఆపుతున్నాడు; అందువల్ల క్రియ తీవ్రతను, ఆచరణాత్మక ఫలితాన్ని రెండింటినీ ఈ ఎంపిక తెలియజేస్తుంది.
- source_word: אֲנָשָׁיו
  choice: తన మనుష్యులను
  rationale: ఇక్కడ ఇది గుహలో దావీదుతో ఉన్న అతని అనుచరులను సూచిస్తుంది. ఆధునిక తెలుగు కథనంలో 'తన మనుష్యులు' సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: בַּדְּבָרִים
  choice: మాటలతో
  rationale: దావీదు వారిని అడ్డుకున్న సాధనాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: וְלֹא נְתָנָם
  choice: లేవనివ్వలేదు
  rationale: נתן + క్రియార్థక నిర్మాణం అనుమతించడం అనే భావాన్ని ఇస్తుంది. తెలుగులో తరువాతి క్రియతో కలిపిన ఈ రూపం స్పష్టంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: לָקוּם אֶל־שָׁאוּל
  choice: సౌలుకు విరోధంగా లేవ
  rationale: קום అనే 'లేవడం' చిత్రాన్ని నిలుపుతూ, אֶל ఇక్కడ సూచించే శత్రుత్వపూర్వక దిశను 'విరోధంగా' తెలియజేస్తుంది; 'దాడి చేయడం' అని మరీ స్పష్టీకరించదు.
- source_word: קָם מֵהַמְּעָרָה
  choice: గుహలోనుండి లేచి
  rationale: ముందటి קום క్రియతో ఉన్న కథన పునరుక్తిని 'లేచి' ద్వారా నిలుపుతుంది; తెలుగులో సహజమైన క్రమాన్ని అనుసరిస్తుంది.
- source_word: וַיֵּלֶךְ בַּדָּרֶךְ
  choice: తన దారిన వెళ్లిపోయాడు
  rationale: అక్షరార్థంగా 'దారిలో వెళ్లాడు'; సందర్భంలో అక్కడి నుంచి బయలుదేరి ప్రయాణం కొనసాగించాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
