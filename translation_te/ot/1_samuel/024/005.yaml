source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ אַנְשֵׁ֨י דָוִ֜ד אֵלָ֗י/ו הִנֵּ֨ה הַ/יּ֜וֹם אֲֽשֶׁר אָמַ֧ר יְהוָ֣ה אֵלֶ֗י/ךָ הִנֵּ֨ה אָנֹכִ֜י נֹתֵ֤ן אֶת איבי/ך בְּ/יָדֶ֔/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר יִטַ֣ב בְּ/עֵינֶ֑י/ךָ וַ/יָּ֣קָם דָּוִ֗ד וַ/יִּכְרֹ֛ת אֶת כְּנַֽף הַ/מְּעִ֥יל אֲשֶׁר לְ/שָׁא֖וּל בַּ/לָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
translation:
  language: te
  text: అప్పుడు దావీదు మనుషులు అతనితో, “ఇదిగో, యాహ్వే నీతో, ‘ఇదిగో, నేను నీ శత్రువును నీ చేతికి అప్పగిస్తున్నాను; నీకు మంచిదనిపించినట్లు అతనికి చేయవచ్చు[a]’ అని చెప్పిన రోజు ఇదే” అన్నారు. అప్పుడు దావీదు లేచి, సౌలుకు చెందిన పైవస్త్రపు అంచును రహస్యంగా కోసివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: “నీ కళ్లలో ఏది మంచిదో దాని ప్రకారం.”'
    reason: హీబ్రూ నుడికారపు పదశః రూపాన్ని భద్రపరచడానికి.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אַנְשֵׁי דָוִד
  choice: అప్పుడు దావీదు మనుషులు ... అన్నారు
  rationale: వావ్-క్రమనిర్మాణం కథను ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని ఇస్తుంది. ‘దావీదు మనుషులు’ అతని అనుచరులను సూచిస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: రెండుసార్లు వచ్చిన సూచనాత్మక ఉద్ఘాటనను ఆధునిక, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామంలోని నాలుగు హీబ్రూ వ్యంజనాలకు సాధారణంగా అంగీకరించబడిన ఉచ్చారణను పేరుగానే లిప్యంతరీకరిస్తుంది.
- source_word: נֹתֵן אֶת איביך בְּיָדֶךָ
  choice: నేను నీ శత్రువును నీ చేతికి అప్పగిస్తున్నాను
  rationale: వర్తమాన కృదంతంలోని సజీవమైన, సమీప చర్య భావాన్ని ‘అప్పగిస్తున్నాను’ తెలియజేస్తుంది; ‘నీ చేతికి’ అనే హీబ్రూ అధికార-అప్పగింత రూపకాన్ని నిలుపుతుంది. సందర్భం, తరువాతి ఏకవచన సర్వనామాలు శత్రువు ఏకవచనమని స్పష్టం చేస్తాయి.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ
  choice: నీకు ఏది మంచిదనిపిస్తే అది అతనికి చేయవచ్చు
  rationale: ఇక్కడ క్రియ ఆజ్ఞ కంటే అనుమతిని సూచిస్తుంది. హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో అందించి, దాని పదశః రూపాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: וַיָּקָם דָּוִד
  choice: అప్పుడు దావీదు లేచి
  rationale: కథన క్రమాన్ని, కదలికను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיִּכְרֹת אֶת כְּנַף הַמְּעִיל אֲשֶׁר לְשָׁאוּל בַּלָּט
  choice: సౌలు పైవస్త్రపు అంచును ఎవరికీ తెలియకుండా కోసివేశాడు
  rationale: כְּנַף వస్త్రపు అంచును, מְעִיל పైవస్త్రాన్ని సూచిస్తాయి. בַּלָּט చర్య రహస్యంగా, గుర్తించబడకుండా జరిగిన భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: యాహ్వే గతంలో ఈ మాటలను నిజంగా పలికాడని కథకుడు ధృవీకరిస్తున్నాడా, లేక ఇది దావీదు మనుషుల వ్యాఖ్యానమా?
  choice: ‘యాహ్వే నీతో చెప్పిన రోజు ఇదే’ అని మనుషులు చేసిన వాదనగానే ప్రత్యక్ష సంభాషణలో ఉంచడం
  alternative: ‘యాహ్వే వాగ్దానం చేసిన రోజు’ అని వ్యాఖ్యానాత్మకంగా చెప్పడం లేదా ఒక నిర్దిష్ట దైవోక్తి ఖచ్చితంగా ముందే ఇవ్వబడిందని మరింత బలంగా సూచించడం
  rationale: హీబ్రూ పాఠం దావీదు మనుషులు చెప్పినదాన్ని మాత్రమే నివేదిస్తుంది. అనువాదం వారి వాదనను తిరస్కరించకూడదు; అలాగే కథకుడి స్వతంత్ర ధృవీకరణగా కూడా మార్చకూడదు. ఈ విధంగా కథలోని వేదాంతపరమైన ఉద్రిక్తత నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రత్యక్ష సంభాషణలోని రెండు הִנֵּה పదాలకు ‘ఇదిగో’ ఉంచి మూలంలోని ఉద్ఘాటనను కాపాడాం; అర్థస్పష్టత కోసం హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజీకరించి, పదశః రూపాన్ని పాదసూచికలో ఇచ్చాం.
