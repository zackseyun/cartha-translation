  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לַ/אֲנָשָׁ֜י/ו חָלִ֧ילָ/ה לִּ֣/י מֵֽ/יהוָ֗ה אִם אֶעֱשֶׂה֩ אֶת הַ/דָּבָ֨ר הַ/זֶּ֤ה לַֽ/אדֹנִ/י֙ לִ/מְשִׁ֣יחַ יְהוָ֔ה לִ/שְׁלֹ֥חַ יָדִ֖/י בּ֑/וֹ כִּֽי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
translation:
  language: te
  text: 'అతడు తన మనుష్యులతో ఇలా అన్నాడు: “యెహోవానుబట్టి నా ప్రభువైన యెహోవా అభిషిక్తునికి ఈ పని చేయడం, అతని మీద నా చెయ్యి ఎత్తడం, నాకు దూరమగుగాక![a] ఎందుకంటే అతడు యెహోవా అభిషిక్తుడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయికంగా, “యెహోవా అలా చేయనివ్వకుండు గాక!” అని కూడా అనువదించవచ్చు. హీబ్రూ నుడికారం యెహోవాతో సంబంధించి అలాంటి కార్యం పట్ల తీవ్రమైన అసహ్యాన్ని, నిరాకరణను వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: యెహోవానుబట్టి ... నాకు దూరమగుగాక
  rationale: ఈ హీబ్రూ నుడికారం ఆ కార్యం పట్ల బలమైన నిరాకరణను వ్యక్తం చేస్తుంది; מֵיְהוָה దావీదు నిరాకరణను యెహోవాతో తన సంబంధం, ఆయనపట్ల భయభక్తుల ఆధారంగా చూపుతుంది.
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: నేను ఇలాంటి పని చేయడం
  rationale: חָלִילָה తరువాత אִם షరతును కాక, ప్రమాణసదృశమైన తీవ్ర నిరాకరణను సూచిస్తుంది. ‘ఇలాంటి పని’ సందర్భంలోని తలపెట్టిన కార్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַאדֹנִי לִמְשִׁיחַ יְהוָה
  choice: నా ప్రభువైన యెహోవా అభిషిక్తుని మీద
  rationale: ‘నా ప్రభువు’ సౌలుపట్ల దావీదు చూపిన గౌరవాన్ని నిలుపుతుంది; ‘యెహోవా అభిషిక్తుడు’ రాజుగా అభిషేకించబడిన అతని స్థానాన్ని సూచిస్తుంది.
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  choice: అతని మీద నేను చెయ్యి ఎత్తను
  rationale: చెయ్యి చాపడం/పంపడం అనే హీబ్రూ రూపకాన్ని తెలుగు నుడికారమైన ‘చెయ్యి ఎత్తడం’ ద్వారా, హింసాత్మక చర్య భావంతో సహజంగా అందిస్తుంది.
- source_word: כִּי מְשִׁיחַ יְהוָה הוּא
  choice: ఎందుకంటే అతడు యెహోవా అభిషిక్తుడు
  rationale: כִּי కారణాన్ని తెలియజేస్తుంది. హీబ్రూలోని పునరుక్తిని అలాగే ఉంచడం దావీదు నిరాకరణకు గల ధార్మిక కారణాన్ని నొక్కిచెబుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో అందిస్తుంది; దానిని ఒక బిరుదుతో భర్తీ చేయదు.
theological_decisions:
- issue: సౌలును מְשִׁיחַ అని పేర్కొనడం
  choice: యెహోవా అభిషిక్తుడు
  alternative: యెహోవా మెస్సీయ
  rationale: ఇక్కడ ఈ పదం యెహోవా చేత రాజుగా అభిషేకించబడిన సౌలు స్థానాన్ని సూచిస్తుంది. ‘మెస్సీయ’ అని అనువదిస్తే ఈ సందర్భం కోరని తరువాతి క్రీస్తుసంబంధ భావనలు కలిగే అవకాశం ఉంది.
- issue: దావీదు నిరాకరణలో యెహోవా పాత్ర
  choice: యెహోవానుబట్టి
  alternative: యెహోవా నన్ను ఆపుగాక
  rationale: మూలంలోని מִן సంబంధాన్ని కారణం/ఆధారంగా ఉంచి, యెహోవా ప్రత్యక్షంగా నిషేధ వాక్యం పలికినట్లు లేదా చర్య చేసినట్లు పాఠ్యంలో లేని భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘చెయ్యి ఎత్తడం’ సహజ తెలుగు నుడికారం; ‘అభిషిక్తుడు’ రాజసంబంధ-పవిత్ర భావాన్ని అనవసరమైన తరువాతి సిద్ధాంతార్థాలు లేకుండా నిలుపుతుంది.
