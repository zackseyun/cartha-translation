source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל דָּוִ֔ד צַדִּ֥יק אַתָּ֖ה מִמֶּ֑/נִּי כִּ֤י אַתָּה֙ גְּמַלְתַּ֣/נִי הַ/טּוֹבָ֔ה וַ/אֲנִ֖י גְּמַלְתִּ֥י/ךָ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
translation:
  language: te
  text: అతడు దావీదుతో, “నాకంటే నీవే ఎక్కువ నీతిమంతుడివి[a]. ఎందుకంటే నీవు నాకు మేలు చేశావు, కానీ నేను నీకు కీడు చేశాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకంటే నీవే న్యాయం వైపు ఉన్నావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־דָּוִד
  choice: అతడు దావీదుతో ... అన్నాడు
  rationale: హీబ్రూ కథన శైలిలోని సాధారణ భూతకాల క్రియను సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో ఇచ్చాం. సందర్భంలో మాట్లాడేది సౌలు అయినప్పటికీ, మూల వాక్యంలో ఉన్నట్లే ‘అతడు’ అని ఉంచాం.
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  choice: నాకంటే నీవే ఎక్కువ నీతిమంతుడివి
  rationale: צַדִּיק అనే పదంలోని నైతిక ‘నీతిమంతుడు’ భావాన్ని, מִן సూచించే తులనను స్పష్టంగా నిలిపాం; ‘నీవే’ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఒప్పుకోలుకు కారణాన్ని పరిచయం చేసే వివరణాత్మక బంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  choice: నీవు నాకు మేలు చేశావు
  rationale: גמל యొక్క ‘ఎవరితో ఒక విధంగా వ్యవహరించు/ప్రతిఫలమిచ్చు’ భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో ఇచ్చాం. הַטּוֹבָהను విస్తృతమైన ‘మేలు’గా ఉంచాం.
- source_word: וַאֲנִי
  choice: కానీ నేను
  rationale: וְ యొక్క వ్యత్యాసార్థక శక్తిని రెండు సమాంతర క్రియల మధ్య తెలుగులో సహజంగా ‘కానీ’తో వ్యక్తపరిచాం.
- source_word: גְּמַלְתִּיךָ הָרָעָה
  choice: నేను నీకు కీడు చేశాను
  rationale: మొదటి భాగంతో సమాంతరాన్ని నిలుపుతూ, רָעָהలోని హాని మరియు నైతిక తప్పు రెండింటినీ సూచించగల ‘కీడు’ను ఎంచుకున్నాం.
theological_decisions:
- issue: צַדִּיק యొక్క నైతిక నీతి లేదా వివాదంలో సరి అనే భావం
  choice: ఎక్కువ నీతిమంతుడివి
  alternative: నాకంటే నీవే న్యాయం వైపు ఉన్నావు / నీవే ఎక్కువ సరిగా ప్రవర్తించావు
  rationale: సౌలు దావీదు ప్రవర్తనలోని నైతిక వ్యత్యాసాన్ని ఒప్పుకుంటున్నందున ‘నీతిమంతుడు’ మూలపద విస్తృతిని కాపాడుతుంది; అయితే ‘న్యాయం నీ వైపే ఉంది’ అనే న్యాయపరమైన భావం కూడా సాధ్యమే కాబట్టి పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘మేలు/కీడు’ అనే సమాంతర జంట ద్వారా హీబ్రూలోని טוב/רע వ్యత్యాసం నిలుపబడింది.
