  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֙ הִנֵּ֣ה יָדַ֔עְתִּי כִּ֥י מָלֹ֖ךְ תִּמְל֑וֹךְ וְ/קָ֨מָה֙ בְּ/יָ֣דְ/ךָ֔ מַמְלֶ֖כֶת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/021.yaml
  text: And now, look, I know that you will surely reign, and the kingdom of Israel will be established in your hand.
translation:
  language: te
  text: ఇప్పుడు చూడు, నువ్వు తప్పకుండా రాజవుతావనీ, ఇశ్రాయేలు రాజ్యం నీ చేతిలో స్థిరపడుతుందనీ నాకు తెలుసు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: ఇప్పుడు చూడు
  rationale: సంభాషణలో దృష్టిని ఆకర్షించే హీబ్రూ పదబంధాన్ని ఆధునిక, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מָלֹךְ תִּמְלוֹךְ
  choice: నువ్వు తప్పకుండా రాజవుతావు
  rationale: అదే ధాతువుతో వచ్చిన infinitive absolute మరియు finite verb కలయికలోని నిశ్చయార్థక బలాన్ని ‘తప్పకుండా’తో నిలుపుతుంది.
- source_word: וְקָמָה
  choice: స్థిరపడుతుంది
  rationale: రాజ్యం స్థాపితమై నిలకడ పొందుతుందనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּיָדְךָ
  choice: నీ చేతిలో
  rationale: పాలన, అధికారం అనే భావాన్ని మోసే హీబ్రూ రూపకాన్ని తెలుగులోనూ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: దావీదు భవిష్యత్ రాజత్వంపై సౌలు వ్యక్తం చేసిన నిశ్చయం
  choice: ‘తప్పకుండా రాజవుతావు’ అని నిశ్చయార్థాన్ని స్పష్టంగా నిలిపాం.
  alternative: ‘నిజంగా ఏలుతావు’
  rationale: మూలంలోని מָלֹךְ תִּמְלוֹךְ బలమైన నిశ్చయాన్ని సూచిస్తుంది; దీనికి మించి దైవశాస్త్రీయ వివరణను చేర్చలేదు.
- issue: ఇశ్రాయేలు రాజ్యం దావీదు చేతిలో స్థిరపడటం
  choice: ‘నీ చేతిలో స్థిరపడుతుంది’ అనే మూల రూపకాన్ని నిలిపాం.
  alternative: ‘నీ పరిపాలనలో స్థాపించబడుతుంది’
  rationale: కర్తృవాచక హీబ్రూ నిర్మాణాన్నీ ‘చేతిలో’ అనే అధికార రూపకాన్నీ అనవసరంగా వివరణాత్మకం చేయకుండా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సౌలు దావీదుతో నేరుగా మాట్లాడుతున్నందున ఏకవచన సంబోధన వాడబడింది. వాక్యం గంభీరంగా, అయితే సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించబడింది.
