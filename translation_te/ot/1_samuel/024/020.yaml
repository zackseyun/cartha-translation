    rationale: ప్రధాన పాఠాన్ని ప్రశ్నార్థకంగా చేయడం తొలగించిన తర్వాత, అక్షరార్థ ఉదాహరణను కూడా ప్రకటనాత్మకంగా మార్చి పాదటిప్పణి-పాఠ అనుసంధానాన్ని నిలబెట్టాలి.
  revised_text: ఎందుకంటే, ఒక మనిషి తన శత్రువును కనుగొన్నప్పుడు అతన్ని క్షేమంగా వెళ్లనిస్తాడు. ఈ రోజున నీవు నాకు చేసిన దానికి యాహ్వే నీకు మేలు ప్రతిఫలంగా ఇవ్వుగాక.[b][a]
