revisions:
- from: ఎందుకంటే, ఒక మనిషి తన శత్రువును కనుగొన్నప్పుడు అతన్ని క్షేమంగా వెళ్లనిస్తాడా?[a] ఈ రోజు నీవు నాకు చేసిన దానికి యాహ్వే నీకు మేలు ప్రతిఫలంగా ఇవ్వుగాక.[b]
  to: ఎందుకంటే, ఒక మనిషి తన శత్రువును కనుగొన్నప్పుడు అతన్ని క్షేమంగా వెళ్లనిస్తాడు. ఈ రోజున నీవు నాకు చేసిన దానికి యాహ్వే నీకు మేలు ప్రతిఫలంగా ఇవ్వుగాక.[b][a]
  rationale: మూల హీబ్రూలో స్పష్టమైన ప్రశ్నార్థక సూచిక లేకపోవడంతో ప్రశ్నార్థక క్రియారూపాన్ని ప్రకటనాత్మక రూపంగా సవరించాం. సందర్భంలోని ప్రశంస/ఆశ్చర్య భావం సహజంగా మిగులుతుంది; అయితే మూలం నిర్దేశించని వ్యాకరణాత్మక ప్రశ్నను అనువాదం రుద్దదు. పాదటిప్పణి అక్షరార్థ ఉదాహరణను దీనికి అనుగుణంగా సవరించాం. పాదటిప్పణి గుర్తులను ఆంగ్ల ఆడిట్ ట్రయిల్ క్రమమైన [b][a]లో ఉంచాం.
