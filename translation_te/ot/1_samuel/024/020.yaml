id: 1SA.24.20
reference: 1 Samuel 24:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יִמְצָ֥א אִישׁ֙ אֶת אֹ֣יְב֔/וֹ וְ/שִׁלְּח֖/וֹ בְּ/דֶ֣רֶךְ טוֹבָ֑ה וַֽ/יהוָה֙ יְשַׁלֶּמְ/ךָ֣ טוֹבָ֔ה תַּ֚חַת הַ/יּ֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר עָשִׂ֖יתָה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
translation:
  language: te
  text: ఎందుకంటే, ఒక మనిషి తన శత్రువును కనుగొన్నప్పుడు అతన్ని క్షేమంగా వెళ్లనిస్తాడు. ఈ రోజున నీవు నాకు చేసిన దానికి యాహ్వే నీకు మేలు ప్రతిఫలంగా ఇవ్వుగాక.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మంచి మార్గంలో పంపిస్తాడు.” దీనిని “సమాధానంగా పంపిస్తాడు” లేదా “హాని చేయకుండా వెళ్లనిస్తాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వే నీకు మేలు ప్రతిఫలంగా ఇస్తాడు.” హీబ్రూ రూపం ఆశీర్వాదం లేదా కోరికగానూ, భవిష్యద్వచనంగానూ అర్థమవుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: ఎందుకంటే, ... దా?
  rationale: ముందటి మాటకు కారణాన్ని జోడిస్తూ, సందర్భంలో ఆశ్చర్యంతో కూడిన అలంకారప్రశ్నగా వినిపించే సాధారణ సత్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִמְצָא אִישׁ
  choice: ఒక మనిషి ... కనుగొన్నప్పుడు
  rationale: హీబ్రూ ఏకవచన పుంలింగ రూపాన్నీ, దాని సాధారణ ప్రతినిధి భావాన్నీ నిలుపుతుంది.
- source_word: אֶת אֹיְבוֹ
  choice: తన శత్రువును
  rationale: మూడవ పురుష ఏకవచన సంబంధాన్ని తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: וְשִׁלְּחוֹ
  choice: అతన్ని ... వెళ్లనిస్తాడా?
  rationale: దావీదు సౌలును హాని చేయకుండా విడిచిపెట్టిన సందర్భంలో, పంపివేయడం కంటే ‘వెళ్లనివ్వడం’ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּדֶרֶךְ טוֹבָה
  choice: క్షేమంగా
  rationale: అక్షరార్థంగా ‘మంచి మార్గంలో’; ఈ సందర్భంలో హాని లేకుండా సురక్షితంగా వెళ్లనివ్వడమనే నుడికార భావాన్ని సహజమైన తెలుగులో ఇస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: יְשַׁלֶּמְךָ טוֹבָה
  choice: నీకు మేలు ప్రతిఫలంగా ఇవ్వుగాక
  rationale: שׁלם మూలంలోని తగిన ప్రతిఫలం ఇచ్చే భావాన్నీ, טוֹבָה లోని మేలు భావాన్నీ నిలుపుతూ, ఇక్కడి ఆశీర్వాదసదృశమైన యిక్తోల్‌ను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי
  choice: ఈ రోజు నీవు నాకు చేసిన దానికి
  rationale: దావీదు ఆ రోజున సౌలుకు చేసిన మేలుకు తగిన ప్రతిఫలమనే సంబంధాన్ని సహజంగా వ్యక్తం చేస్తూ ‘నాకు’ అన్న మూలపాఠ అంశాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా అందించాం.
- issue: יְשַׁלֶּמְךָ యొక్క విధి—ఆశీర్వాదమా, భవిష్యద్వచనమా
  choice: ఇవ్వుగాక
  alternative: ఇస్తాడు
  rationale: సౌలు దావీదును ఉద్దేశించి పలికిన సందర్భంలో ఇది కోరిక లేదా ఆశీర్వాదంగా సహజంగా వినిపిస్తుంది; అయినా హీబ్రూ యిక్తోల్ భవిష్యద్వచన భావాన్నీ అనుమతిస్తుంది కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: అలంకారప్రశ్న స్వరూపం
  choice: వెళ్లనిస్తాడా?
  alternative: వెళ్లనిస్తాడు
  rationale: మునుపటి వచనంలోని ‘ఎవడు...?’ అనే ప్రశ్నకు కొనసాగింపుగా, శత్రువును చేతిలోకి పొందినవాడు సాధారణంగా క్షేమంగా విడిచిపెట్టడనే ఆశ్చర్యాన్ని ఇది బలంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. మూలంలోని అలంకారప్రశ్నను నిలిపి, ‘మంచి మార్గం’ అనే నుడికారాన్ని ప్రధాన పాఠంలో ‘క్షేమంగా’ అని సహజీకరించాం; అక్షరార్థాన్ని పాదటిప్పణిలో భద్రపరిచాం.
