  to: ఇశ్రాయేలు రాజు ఎవరి వెంట బయలుదేరి వచ్చాడు? మీరు ఎవరి వెంట పడుతున్నారు? చచ్చిన కుక్క వెంటనా? ఒక్క ఈగపేను వెంటనా?
