id: 1SA.24.15
reference: 1 Samuel 24:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַחֲרֵ֨י מִ֤י יָצָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אַחֲרֵ֥י מִ֖י אַתָּ֣ה רֹדֵ֑ף אַֽחֲרֵי֙ כֶּ֣לֶב מֵ֔ת אַחֲרֵ֖י פַּרְעֹ֥שׁ אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/015.yaml
  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
translation:
  language: te
  text: ఇశ్రాయేలు రాజు ఎవరి వెంట బయలుదేరి వచ్చాడు? మీరు ఎవరి వెంట పడుతున్నారు? చచ్చిన కుక్క వెంటనా? ఒక్క ఈగపేను వెంటనా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי מִי
  choice: ఎవరి వెంట
  rationale: אַחֲרֵי అనే పదానికి ‘వెనుక/వెంట’ అనే ప్రాథమిక భావం ఉంది; ఈ సందర్భంలో అది తరుమడాన్ని సూచిస్తుంది. రెండు ప్రశ్నల్లోనూ ‘ఎవరి వెంట’ అని ఉంచడం మూలంలోని పునరుక్తిని, వ్యంగ్యభరితమైన ప్రశ్నల లయను కాపాడుతుంది.
- source_word: יָצָא
  choice: బయలుదేరి వచ్చాడు
  rationale: ఈ క్రియకు ‘బయటికి వెళ్లడం/రావడం, బయలుదేరడం’ అనే అర్థం ఉంది. సౌలు దావీదును వెదకడానికి సైనిక చర్యగా బయలుదేరి అతడు ఉన్న ప్రాంతానికి వచ్చిన భావాన్ని ఈ పదబంధం సహజంగా తెలియజేస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: బిరుదును నేరుగా, గౌరవప్రదంగా అనువదించడం ద్వారా గొప్ప రాజు అతి అల్పుడిగా తనను చూపించుకుంటున్న దావీదు వెంట రావడంలోని వ్యంగ్యం నిలుస్తుంది.
- source_word: אַתָּה רֹדֵף
  choice: మీరు ... వెంటపడుతున్నారు
  rationale: רדף నిరంతరమైన, శత్రుత్వపూర్వకమైన తరుమడాన్ని సూచిస్తుంది. రాజును నేరుగా సంబోధిస్తున్నందున ఆధునిక ప్రామాణిక తెలుగులో గౌరవార్థక ‘మీరు’ సహజం.
- source_word: כֶּלֶב מֵת
  choice: చచ్చిన కుక్క
  rationale: దావీదు తన అల్పత్వాన్ని చూపించుకోవడానికి వాడిన తీవ్ర రూపకాన్ని సరళంగా, యథాతథంగా నిలుపుతుంది.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: ఒక్క పేను
  rationale: פַּרְעֹשׁ చిన్నగా గెంతే పరాన్నజీవి పురుగును, అంటే fleaను సూచిస్తుంది. తెలుగులో అందరికీ అర్థమయ్యే సమీప పదంగా ‘పేను’ వాడి, אֶחָד ఇచ్చే అల్పత్వపు నొక్కును ‘ఒక్క’తో నిలిపాం; ఖచ్చితమైన జీవశాస్త్రీయ భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי
  choice: వెంట ... వెంటపడుతున్నారు ... వెంటనా ... వెంటనా
  rationale: మూలంలోని పదపునరుక్తి దావీదు ప్రశ్నకు లయను, వ్యంగ్యాన్ని ఇస్తుంది. తెలుగులో సహజంగా ఉండేంతవరకు ‘వెంట’ను ప్రతి భాగంలోనూ నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజును ఉద్దేశించిన మాటలో గౌరవార్థక బహువచనం వాడబడింది. ప్రశ్నల పునరుక్తి, దావీదు స్వీయ-అల్పీకరణ, మూలంలోని వ్యంగ్య లయ కాపాడబడ్డాయి.
