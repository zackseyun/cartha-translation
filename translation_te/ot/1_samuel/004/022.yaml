  text: וַ/תֹּ֕אמֶר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל כִּ֥י נִלְקַ֖ח אֲר֥וֹן הָ/אֱלֹהִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/022.yaml
  text: And she said[a], “The glory has departed from Israel[b], because the ark of God has been taken.”
translation:
  language: te
  text: అప్పుడు ఆమె, “దేవుని మందసం తీసుకోబడినందున[b] ఇశ్రాయేలు నుండి మహిమ వెళ్లిపోయింది[a]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మహిమ ఇశ్రాయేలు నుండి ప్రవాసానికి వెళ్లిపోయింది.” హీబ్రూ క్రియకు ప్రవాసానికి వెళ్లడం లేదా తొలగిపోవడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎందుకంటే దేవుని మందసం తీసుకోబడింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ఆమె … అని చెప్పింది
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: גָּלָה
  choice: వెళ్లిపోయింది
  rationale: ఈ క్రియకు వెళ్లిపోవడం, తొలగిపోవడం, ప్రవాసానికి వెళ్లడం అనే భావాలు ఉన్నాయి. ‘మహిమ’ కర్తగా ఉన్నందున ‘వెళ్లిపోయింది’ సహజంగా ఉండి, మూలంలోని తొలగింపు భావాన్ని నిలుపుతుంది.
- source_word: כָבוֹד
  choice: మహిమ
  rationale: ఇక్కడ ఈ పదం దేవుని సన్నిధితో ముడిపడిన ఘనత, మహిమను సూచిస్తుంది. ‘మహిమ’ ఆ వేదాంతపరమైన బరువును అతిగా నిర్వచించకుండా కాపాడుతుంది.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలులో నుండి
  rationale: מן విభజన లేదా తొలగింపును సూచిస్తుంది. ‘ఇశ్రాయేలులో నుండి’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: …నందున
  rationale: ఇక్కడ כִּי ముందున్న ప్రకటనకు కారణాన్ని తెలియజేస్తుంది. ‘పట్టుబడినందున’ సంక్షిప్తంగా, సహజంగా కారణ సంబంధాన్ని చూపుతుంది.
- source_word: נִלְקַח
  choice: పట్టుబడినందున
  rationale: לקח యొక్క నిఫాల్ రూపం నిష్క్రియార్థకంగా ‘తీసుకోబడింది/పట్టుబడింది’ అని అర్థం. యుద్ధ సందర్భంలో ‘పట్టుబడింది’ సహజమైనదైనా, మూలంలోని సాధారణ ‘తీసుకోబడింది’ భావాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: నిర్మాణ సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ‘మందసం’ పరిచితమైన బైబిలు పదంగా ఉండి, మూలంలో లేని అదనపు విశేషణాన్ని చేర్చదు.
theological_decisions:
- issue: ‘మహిమ’కు ఇశ్రాయేలుతోను మందసంతోను ఉన్న సంబంధం
  choice: దేవుని మందసం పట్టుబడటంతో ముడిపడిన, ఇశ్రాయేలులో దేవుని ప్రత్యక్ష సన్నిధి మరియు ఘనత తొలగిపోయిన భావాన్ని సూచించేలా ‘మహిమ వెళ్లిపోయింది’ అని అనువదించడం
  alternative: దీనిని కేవలం ఇశ్రాయేలు జాతీయ గౌరవం పోయిందని గానీ, దేవుడే పూర్తిగా ఇశ్రాయేలును విడిచిపోయాడని గానీ స్పష్టీకరించడం
  rationale: సమీప సందర్భం మహిమ పోవడాన్ని మందసం పట్టుబడటంతో కలుపుతుంది; అయినా దేవుని సన్నిధి మందసంలో ఎలా ఉందో వచనం సాంకేతికంగా నిర్వచించదు. కాబట్టి అనువాదం ఆ వేదాంతపరమైన ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘మహిమ’ మరియు ‘దేవుని మందసం’ వంటి పరిచిత బైబిలు పదాలను నిలుపుతూ, మూలంలోని కారణ సంబంధం మరియు వేదాంతపరమైన అనిశ్చితి భద్రపరచబడ్డాయి.
