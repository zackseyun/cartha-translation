- from: ఏలీ ఆ కేక శబ్దం[a] విని, “ఈ కలకల శబ్దం ఏమిటి?” అని అడిగాడు. ఆ మనిషి త్వరపడి వచ్చి ఏలీకి సంగతి తెలియజేశాడు.
  to: ఏలీ ఆ కేక వినగానే, “ఈ కలకలపు శబ్దం ఏమిటి?” అన్నాడు. ఆ మనిషి త్వరపడి వచ్చి ఏలీకి చెప్పాడు.[a]
