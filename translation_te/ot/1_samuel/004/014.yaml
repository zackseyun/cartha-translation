  edition: WLC
  text: וַ/יִּשְׁמַ֤ע עֵלִי֙ אֶת ק֣וֹל הַ/צְּעָקָ֔ה וַ/יֹּ֕אמֶר מֶ֛ה ק֥וֹל הֶ/הָמ֖וֹן הַ/זֶּ֑ה וְ/הָ/אִ֣ישׁ מִהַ֔ר וַ/יָּבֹ֖א וַ/יַּגֵּ֥ד לְ/עֵלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
translation:
  language: te
  text: ఏలీ ఆ కేక వినగానే, “ఈ కలకలపు శబ్దం ఏమిటి?” అన్నాడు. ఆ మనిషి త్వరపడి వచ్చి ఏలీకి చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ గోల శబ్దం” లేదా “ఈ కోలాహల శబ్దం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: శబ్దం
  rationale: קוֹל సందర్భానుసారంగా స్వరం, ధ్వని, శబ్దం అనే అర్థాలు ఇస్తుంది. ఇక్కడ కేకను, కలకలాన్ని వినిపించే ఘటనలుగా సూచిస్తున్నందున ‘శబ్దం’ సహజంగా సరిపోతుంది.
- source_word: הַצְּעָקָה
  choice: ఆ కేక
  rationale: צְעָקָה ఆపద లేదా తీవ్ర భావోద్వేగంతో కూడిన గట్టికేకను సూచిస్తుంది. సందర్భంలోని పట్టణ ప్రజల ప్రతిస్పందనను ‘కేక’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מֶה
  choice: ఏమిటి?
  rationale: ఈ ప్రశ్న శబ్దానికి కారణమైన కలకలం ఏమిటో అడుగుతోంది. ‘ఏమిటి?’ ఆధునిక తెలుగులో సంక్షిప్తమైన, సహజమైన ప్రశ్నారూపం.
- source_word: הֶהָמוֹן
  choice: కలకలం
  rationale: הָמוֹן ఇక్కడ జనసమూహం వల్ల కలిగిన గోల, కోలాహలం లేదా అల్లకల్లోలాన్ని సూచిస్తుంది. ‘కలకలం’ ప్రజల మధ్య ఏర్పడిన తీవ్ర శబ్దభరిత పరిస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָאִישׁ
  choice: ఆ మనిషి
  rationale: హీబ్రూ పాఠం అతణ్ణి ‘మనిషి’ అని మాత్రమే పేర్కొంటుంది. ముందటి సందర్భంలో అతడు వార్త తెచ్చినవాడైనా, ‘దూత’ అని అనువదించడం మూలపాఠానికి మించిన వివరణ అవుతుంది.
- source_word: מִהַר
  choice: త్వరపడి
  rationale: ఈ క్రియ వేగంగా చేయడం లేదా తొందరపడడాన్ని సూచిస్తుంది. ‘త్వరపడి’ ఆధునిక కథనశైలిలో సహజంగా ఉంటుంది.
- source_word: וַיַּגֵּד לְעֵלִי
  choice: ఏలీకి సంగతి తెలియజేశాడు
  rationale: נגד హిఫీల్ రూపం చెప్పడం లేదా సమాచారం తెలియజేయడం అనే అర్థం ఇస్తుంది. వాక్యం తెలుగులో అసంపూర్ణంగా అనిపించకుండా ‘సంగతి తెలియజేశాడు’ అని సహజంగా అనువదించబడింది.
- source_word: עֵלִי
  choice: ఏలీ
  rationale: వ్యక్తి పేరును తెలుగులో సాధారణంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని భావాన్ని మరియు పునరుక్త ‘శబ్దం’ నిర్మాణాన్ని నిలిపి సహజమైన తెలుగు వాక్యంగా రూపొందించాం.
