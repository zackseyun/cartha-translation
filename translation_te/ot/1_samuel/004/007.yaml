reference: 1 Samuel 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽרְאוּ֙ הַ/פְּלִשְׁתִּ֔ים כִּ֣י אָמְר֔וּ בָּ֥א אֱלֹהִ֖ים אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּאמְרוּ֙ א֣וֹי לָ֔/נוּ כִּ֣י לֹ֥א הָיְתָ֛ה כָּ/זֹ֖את אֶתְמ֥וֹל שִׁלְשֹֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
translation:
  language: te
  text: 'ఫిలిష్తీయులు భయపడ్డారు, ఎందుకంటే వారు ఇలా అన్నారు: “దేవుడు[a] శిబిరంలోకి వచ్చాడు.” వారు మళ్లీ ఇలా అన్నారు: “అయ్యో మనకు! ఇలాంటిది ఇంతకుముందెన్నడూ జరగలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక దేవుడు.” אֱלֹהִים అనే హీబ్రూ నామవాచకం రూపపరంగా బహువచనం; అయితే దానితో ఉన్న క్రియ ఏకవచనంలో ఉంది. అందువల్ల ప్రధాన పాఠంలో “దేవుడు” అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּֽרְאוּ
  choice: భయపడ్డారు
  rationale: యרא క్రియ ఇక్కడ ఫిలిష్తీయుల తక్షణ భయప్రతిస్పందనను సూచిస్తుంది; ఆధునిక తెలుగులో ‘భయపడ్డారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహానికి తెలుగులో స్థిరపడిన బైబిలు సంబంధ జాతిపేరు.
- source_word: כִּי אָמְרוּ
  choice: ఎందుకంటే … అని వారు చెప్పుకున్నారు
  rationale: כִּי వారి భయానికి కారణాన్ని పరిచయం చేస్తుంది. పరస్పరం పలికిన సందర్భాన్ని ‘చెప్పుకున్నారు’ సహజంగా తెలియజేస్తుంది; మూలంలోని ‘చెప్పారు’ అనే భావాన్ని నిలుపుతుంది.
- source_word: בָּא אֱלֹהִים
  choice: దేవుడు వచ్చాడు
  rationale: אֱלֹהִים రూపపరంగా బహువచనమైనా, దానితో ఉన్న בָּא క్రియ ఏకవచనం; కాబట్టి ప్రధాన పాఠంలో ఏకవచనార్థమైన ‘దేవుడు’ సముచితం.
- source_word: אֶל הַמַּחֲנֶה
  choice: శిబిరంలోకి
  rationale: אֶל ఇక్కడ శిబిరం లోపలికి వచ్చిన గమనాన్ని సూచిస్తుంది; ‘శిబిరంలోకి’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אוֹי לָנוּ
  choice: అయ్యో, మనకు కీడు!
  rationale: ఇది తీవ్రమైన ఆపదభయాన్ని, విలాపాన్ని వ్యక్తం చేసే కేక. ‘అయ్యో, మనకు కీడు!’ దాని భావబలాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: לֹא הָיְתָה כָּזֹאת
  choice: ఇలాంటిది … జరగలేదు
  rationale: హీబ్రూ వాక్యప్రయోగం ఇలాంటి సంఘటన జరగలేదనే భావాన్ని ఇస్తుంది; తెలుగులో ఇది సహజమైన రూపం.
- source_word: אֶתְמוֹל שִׁלְשֹׁם
  choice: ఇంతకుముందెన్నడూ
  rationale: పదశః ‘నిన్న, మొన్న’ అనే పదజంట ఇక్కడ పూర్వకాలాన్ని సూచించే నానుడి. సందర్భంలోని అపూర్వతను ‘ఇంతకుముందెన్నడూ’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఫిలిష్తీయుల మాటలో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: ఒక దేవుడు
  rationale: దీనితో ఉన్న בָּא క్రియ ఏకవచనంలో ఉండడం వల్ల ఏకవచన సూచన బలంగా ఉంది. అయితే మాటలాడేవారు ఫిలిష్తీయులు కావడం, אֱלֹהִים రూపపరంగా బహువచనం కావడం వల్ల ‘ఒక దేవుడు’ అనే అవగాహనకు కూడా అవకాశం ఉంది; అందువల్ల దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, కథన గౌరవాన్ని నిలుపుతూ అనువదించబడింది. మూలంలోని వరుసగా వచ్చిన రెండు మాటల క్రియలను ‘చెప్పుకున్నారు/అన్నారు’గా ఉంచి పునరుక్తిని పూర్తిగా తొలగించలేదు; ఫిలిష్తీయుల భయోద్వేగాన్ని సహజ తెలుగు సంభాషణలో ప్రతిబింబించాం.
