id: 1SA.4.19
reference: 1 Samuel 4:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כַלָּת֣/וֹ אֵֽשֶׁת פִּינְחָס֮ הָרָ֣ה לָ/לַת֒ וַ/תִּשְׁמַ֣ע אֶת הַ/שְּׁמֻעָ֔ה אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וּ/מֵ֥ת חָמִ֖י/הָ וְ/אִישָׁ֑/הּ וַ/תִּכְרַ֣ע וַ/תֵּ֔לֶד כִּֽי נֶהֶפְכ֥וּ עָלֶ֖י/הָ צִרֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: His daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
translation:
  language: te
  text: అతని కోడలు, ఫీనెహాసు భార్య, గర్భవతిగా ఉండి ప్రసవించబోతుండగా, దేవుని మందసం పట్టుబడిందనీ[a], తన మామగారూ తన భర్తా చనిపోయారనీ[b] అనే వార్త ఆమె విన్నప్పుడు, వంగి బిడ్డను కనింది; ఎందుకంటే ఆమె ప్రసవవేదనలు ఆమె మీదికి వచ్చాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని మందసం పట్టుబడిన సంగతి.” హీబ్రూ నిర్మాణాన్ని వార్తలోని విషయంగా (“పట్టుబడిందని”) లేదా ఆ సంఘటనను సూచించే పదబంధంగా (“పట్టుబడిన సంగతి”) అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన మామగారూ తన భర్తా చనిపోయి ఉన్నారనీ.” హీబ్రూ రూపం వారు చనిపోయిన సంఘటనను లేదా దాని ఫలితమైన స్థితిని సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “ఆమె వేదనలు ఆమె మీదికి తిరిగాయి.” ఇది ప్రసవవేదనలు ఆమెపైకి వచ్చాయని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַלָּתוֹ
  choice: అతని కోడలు
  rationale: כַּלָּה ఇక్కడ ‘కోడలు’ అని అర్థం. ప్రారంభ וְ కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరి’ లేదా ‘అప్పుడు’ చేర్చకుండానే సందర్భం ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֵשֶׁת פִּינְחָס
  choice: ఫీనెహాసు భార్య
  rationale: ముందున్న ‘కోడలు’ ఎవరో వివరించే సమానాధికార పదబంధాన్ని సంక్షిప్తంగా, మూలానికి దగ్గరగా ఉంచుతుంది.
- source_word: הָרָה לָלַת
  choice: గర్భవతిగా ఉండి ప్రసవించే సమయం దగ్గరపడింది
  rationale: הָרָה గర్భస్థితిని, לָלַת ప్రసవం సమీపించిందనే భావాన్ని వ్యక్తం చేస్తాయి; తెలుగు వాడుకలో రెండింటినీ స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה
  choice: ఆమె వార్త విన్నప్పుడు
  rationale: שְׁמוּעָה కు ‘వార్త’ సహజమైన ఆధునిక తెలుగు సమానం. వరుస క్రియలను తెలుగులో సులభంగా అనుసంధానించడానికి కాలసూచక ఉపవాక్యంగా ఇచ్చింది.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం పట్టుబడిందనీ
  rationale: הִלָּקַח లోని కర్మణి భావాన్ని ‘పట్టుబడింది’ నిలుపుతుంది. אֶל తో కూడిన నిర్మాణాన్ని వార్తలోని విషయంగా అనువదించింది; నామవాచకార్థక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: וּמֵת חָמִיהָ וְאִישָׁהּ
  choice: తన మామగారూ తన భర్తా చనిపోయారనీ
  rationale: తెలుగులో గౌరవప్రదమైన ‘మామగారు’ మరియు సహజమైన ‘భర్త’ వాడబడ్డాయి. מֵת ను జరిగిన సంఘటనగా అనువదించినా, స్థితిని సూచించే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: וַתִּכְרַע וַתֵּלֶד
  choice: వంగి బిడ్డను కనింది
  rationale: כרע లోని వంగడం లేదా కుంగడం అనే శారీరక భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘వంగి’గా ఉంచింది; ילד ను ఆధునిక తెలుగులో సహజమైన ‘బిడ్డను కనింది’గా ఇచ్చింది.
- source_word: כִּי נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ
  choice: ఎందుకంటే ఆమె ప్రసవవేదనలు అకస్మాత్తుగా ఆమె మీదికి వచ్చాయి
  rationale: צִרֶיהָ ఇక్కడ ప్రసవవేదనలు. נֶהֶפְכוּ עָלֶיהָ అనే చిత్రాత్మక నుడికారంలోని ‘ఆమె మీదికి వచ్చాయి’ అనే భావాన్ని నిలుపుతూ, సందర్భంలోని హఠాత్తుతనాన్ని ‘అకస్మాత్తుగా’ స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘మందసం’ అనే స్థిరమైన బైబిలు పదాన్ని నిలిపి, మిగతా వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా నిర్మించింది. మూలంలోని క్రియాక్రమం మరియు కారణసంబంధం సాధ్యమైనంతవరకు కాపాడబడ్డాయి.
