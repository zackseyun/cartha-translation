  to: అతని కోడలు, ఫీనెహాసు భార్య, గర్భవతిగా ఉండి ప్రసవించబోతుండగా, దేవుని మందసం పట్టుబడిందనీ[a], తన మామగారూ తన భర్తా చనిపోయారనీ[b] అనే వార్త ఆమె విన్నప్పుడు, వంగి బిడ్డను కనింది; ఎందుకంటే ఆమె ప్రసవవేదనలు ఆమె మీదికి వచ్చాయి[c].
