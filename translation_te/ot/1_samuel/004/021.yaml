source:
  edition: WLC
  text: וַ/תִּקְרָ֣א לַ/נַּ֗עַר אִֽי כָבוֹד֙ לֵ/אמֹ֔ר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וְ/אֶל חָמִ֖י/הָ וְ/אִישָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/021.yaml
  text: And she named the boy Ichabod[a], saying, “The glory has departed from Israel,” because the ark of God had been taken, and because of her father-in-law and her husband.
translation:
  language: te
  text: ఆమె ఆ బాలునికి ఈకాబోదు[a] అని పేరు పెట్టి, “ఇశ్రాయేలులోనుండి మహిమ వెళ్లిపోయింది” అంది. దేవుని మందసం పట్టుబడినందువల్ల, అలాగే ఆమె మామను, ఆమె భర్తను బట్టి ఆమె అలా అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఈకాబోదు” అనే పేరు “మహిమ లేదు” అనే భావమున్న హీబ్రూ పదాలతో ఏర్పడి ఉండవచ్చు; లేదా “మహిమ ఎక్కడ?” అని కూడా అర్థం కావచ్చు.
    reason: పేరు వ్యుత్పత్తి విషయంలో ఉన్న నిజమైన హీబ్రూ అర్థసందిగ్ధతను తెలియజేయడం.
lexical_decisions:
- source_word: וַתִּקְרָא לַנַּעַר
  choice: ఆమె ఆ బాలునికి ... అని పేరు పెట్టి
  rationale: పేరు పెట్టే సందర్భంలో קרא ל అనే నిర్మాణం ‘పేరు పెట్టడం’ అనే అర్థాన్నిస్తుంది. נַעַר ఇక్కడ అప్పుడే పుట్టిన మగబిడ్డను సూచిస్తుంది; ‘బాలుడు’ సహజమైన తెలుగు పదం.
- source_word: אִי כָבוֹד
  choice: ఈకాబోదు
  rationale: ఇది వ్యక్తిపేరు కాబట్టి ప్రధాన పాఠ్యంలో తెలుగు లిపిలో లిప్యంతరీకరించబడింది. పేరులోని హీబ్రూ అంశాల అర్థసందిగ్ధతను పాదసూచిక వివరిస్తుంది.
- source_word: גָּלָה כָבוֹד מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలులోనుండి మహిమ వెళ్లిపోయింది
  rationale: גלה వేరై వెళ్లడం లేదా తొలగిపోవడం అనే భావాన్ని ఇస్తుంది. ‘మహిమ వెళ్లిపోయింది’ అనే రూపం దేవుని సన్నిధి, ఇశ్రాయేలు ఘనత అనే రెండు భావసాధ్యతలను నిర్దిష్టంగా తేల్చకుండా నిలుపుతుంది.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం పట్టుబడినందువల్ల
  rationale: సందర్భంలో אֶל కారణార్థకంగా పనిచేస్తుంది; הִלָּקַח నిష్క్రియ రూపం. యుద్ధంలో శత్రువులు మందసాన్ని స్వాధీనం చేసుకున్న సందర్భానికి ‘పట్టుబడింది’ సరిపోతుంది.
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  choice: అలాగే ఆమె మామ, భర్త చనిపోయినందువల్ల
  rationale: పునరుక్తమైన אֶל ముందు కారణార్థాన్ని కొనసాగిస్తుంది. హీబ్రూ పదబంధం మరణాన్ని ప్రత్యక్షంగా చెప్పకపోయినా, సమీప సందర్భంలో మామ, భర్త మరణాలనే సూచిస్తుంది; తెలుగులో అసంపూర్ణత రాకుండా భావం స్పష్టంగా వ్యక్తీకరించబడింది.
theological_decisions:
- issue: ఇశ్రాయేలుతో సంబంధించి ‘మహిమ’ అర్థం
  choice: ‘మహిమ’ అని మాత్రమే ఉంచడం
  alternative: ‘దేవుని మహిమ’ లేదా ‘ఘనత’ అని నిర్దిష్టీకరించడం
  rationale: כָבוֹד అనే హీబ్రూ పదం ఇక్కడ దేవుని ప్రత్యక్ష సన్నిధినీ, ఇశ్రాయేలు ఘనత కోల్పోవడాన్నీ సూచించే అవకాశం ఉంది. మూలపాఠ్యంలోని ఈ ధార్మిక ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
- issue: మందసం తీసుకుపోవడం యొక్క స్వరూపం
  choice: ‘పట్టుబడింది’
  alternative: ‘తీసుకుపోబడింది’
  rationale: ఫిలిష్తీయులు యుద్ధంలో మందసాన్ని స్వాధీనం చేసుకున్నారని సందర్భం స్పష్టం చేస్తుంది. ఈ పదప్రయోగం సంఘటనను తెలియజేస్తుంది గాని, మందసమే దేవుని సన్నిధితో పూర్తిగా సమానమని సిద్ధాంతపరంగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి వాడబడింది. ‘మందసం’ అనే స్థిరమైన బైబిలు పదం నిలుపబడింది. ప్రధాన పాఠ్యంలో పేరును అనువదించకుండా లిప్యంతరీకరించి, దాని అర్థసాధ్యతలను పాదసూచికలో ఇచ్చాం.
