  rationale: తెలుగులో వ్యాకరణపరంగా అవసరమైన కర్మను “కొంతమందిని”గా పరిమితంగా స్పష్టం చేశాం; ఇది మూలంలో సందర్భానుసారంగా సూచితమైన పంపబడిన వారిని మాత్రమే తెలియజేస్తుంది. ఏలీతో కుమారుల సంబంధాన్ని స్పష్టంగా చేయడానికి “యొక్క” చేర్చాం. దైవనామం, దైవబిరుదు, మందసపు పదజాలం, కెరూబుల-సింహాసన పదబంధంలోని ప్రత్యామ్నాయ పఠనం, మరియు పాదటిప్పణి సూచికల స్థానాలను కాపాడాం.
