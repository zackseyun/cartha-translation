id: 1SA.4.4
reference: 1 Samuel 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח הָ/עָם֙ שִׁלֹ֔ה וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם אֵ֣ת אֲר֧וֹן בְּרִית יְהוָ֛ה צְבָא֖וֹת יֹשֵׁ֣ב הַ/כְּרֻבִ֑ים וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י עִם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים חָפְנִ֖י וּ/פִֽינְחָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
translation:
  language: te
  text: కాబట్టి ప్రజలు కొంతమందిని షిలోహుకు పంపారు; వారు అక్కడి నుండి కెరూబుల పైన సింహాసనాసీనుడైన సేనల యాహ్వే[a] నిబంధన మందసాన్ని మోసుకొచ్చారు.[b] ఏలీ యొక్క ఇద్దరు కుమారులు, హొఫ్నీ మరియు ఫీనెహాసు, దేవుని నిబంధన మందసంతో అక్కడ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సైన్యాల యాహ్వే.”
    reason: lexical_alternative
  - marker: b
    text: “కెరూబుల పైన సింహాసనాసీనుడైన” అనే హెబ్రీ మాటను “కెరూబుల మధ్య సింహాసనాసీనుడైన” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם שִׁלֹה
  choice: ప్రజలు షిలోహుకు పంపారు
  rationale: ‘ప్రజలు’ అనే సమూహవాచక కర్తను సహజమైన తెలుగులో ఉంచి, హెబ్రీలో స్పష్టంగా లేని ‘మనుషులను’ అనే కర్మను ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: అక్కడి నుండి ... మోసుకొచ్చారు
  rationale: נשא ఇక్కడ మందసాన్ని భౌతికంగా మోయడాన్ని సూచిస్తుంది; సందర్భానుసారమైన గమ్యదిశను ‘మోసుకొచ్చారు’ సహజంగా తెలియజేస్తుంది.
- source_word: אֲרוֹן בְּרִית
  choice: నిబంధన మందసం
  rationale: ‘మందసం’ పవిత్ర పెట్టెను సూచించే స్థిరమైన తెలుగు పదం; నిర్మాణాన్ని సహజంగా ‘నిబంధన మందసం’గా ఇచ్చాం.
- source_word: יְהוָה צְבָאוֹת
  choice: సేనల యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం. צְבָאוֹת యొక్క సైనిక/సమూహ భావాన్ని ‘సేనలు’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: కెరూబుల పైన సింహాసనాసీనుడైన
  rationale: יֹשֵׁב అనే ఆరాధనాత్మక రాజరిక ప్రయోగాన్ని సాధారణంగా ‘కూర్చున్న’ అని కాక ‘సింహాసనాసీనుడైన’ అని ఇచ్చాం; స్థలసంబంధ అస్పష్టతను ప్రత్యామ్నాయ పఠనంతో పాదటిప్పణిలో ఉంచాం.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: ఏలీ ఇద్దరు కుమారులు
  rationale: హెబ్రీ నిర్మాణాన్ని అర్థస్పష్టమైన ఆధునిక తెలుగు పదక్రమంలో ఇచ్చాం.
- source_word: עִם אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: దేవుని నిబంధన మందసంతో
  rationale: עִם యొక్క సాధారణ సహవాసార్థాన్ని ‘తో’ ద్వారా నిలిపాం; మరింత నిర్దిష్టమైన ‘పక్కన’ అనే స్థలార్థాన్ని చేర్చలేదు.
- source_word: חָפְנִי וּפִינְחָס
  choice: హొఫ్నీ, ఫీనెహాసు
  rationale: హెబ్రీ వ్యక్తినామాలను తెలుగులో గుర్తించదగిన ధ్వన్యనుసార రూపాల్లో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: יְהוָה צְבָאוֹת అనే దైవబిరుదు
  choice: సేనల యాహ్వే
  alternative: సైన్యాల యాహ్వే
  rationale: צְבָאוֹתకు సేనలు/సైన్యాలు అనే రెండూ సాధ్యమైనవి. ప్రధాన పాఠంలో సంక్షిప్తమైన, విస్తృతమైన ‘సేనలు’ను ఎంచుకొని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: יֹשֵׁב הַכְּרֻבִים లోని రాజరిక మరియు స్థలసంబంధ భావం
  choice: కెరూబుల పైన సింహాసనాసీనుడైన
  alternative: కెరూబుల మధ్య సింహాసనాసీనుడైన
  rationale: ‘సింహాసనాసీనుడు’ దైవ రాజరిక భావాన్ని నిలుపుతుంది. అయితే హెబ్రీ వాక్యభాగం ‘పైన’ లేదా ‘మధ్య’ అనే స్థలసంబంధాన్ని పూర్తిగా నిర్దిష్టం చేయదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. ‘సింహాసనాసీనుడు,’ ‘నిబంధన మందసం’ వంటి బైబిలు భావపదాలను ఉంచినా, వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం. అందించిన ఆంగ్ల పాఠ్యంలో పాదటిప్పణి సూచికలు వాటి విషయాలకు సరిపోని చోట్ల కనిపించినందున, తెలుగు ప్రధాన పాఠ్యంలో [a]ను צְבָאוֹת దగ్గర, [b]ను కెరూబుల వాక్యభాగం దగ్గర విషయానుసారంగా ఉంచాం.
