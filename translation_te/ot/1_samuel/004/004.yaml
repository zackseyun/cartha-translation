  naturalness: “ఏలీ ఇద్దరు కుమారులు” కంటే “ఏలీ యొక్క ఇద్దరు కుమారులు” ఆధునిక ప్రామాణిక తెలుగులో మరింత సహజం. “మోసుకొచ్చారు” సందర్భానుగుణంగా సహజంగానే ఉంది.
