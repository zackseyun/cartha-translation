  naturalness: The revised wording is idiomatic modern standard Telugu and preserves the grave narrative register. “మరణించే వేళ” is a natural literary-narrative equivalent of “at/about the time of her death,” and “మనసులో పెట్టుకోలేదు” is a natural equivalent for the Hebrew heart idiom in this context.
  terminology: “కుమారుణ్ణి కన్నావు” is appropriate for the childbirth context. No theological terminology or proper names occur in this verse. The footnote preserves the lexical/formal alternative without imposing an interpretive reading in the main text.
  issues:
