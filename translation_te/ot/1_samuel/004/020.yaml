    rationale: The context supplies the referent, but “దానిని” more closely preserves the source’s compact, context-dependent expression while remaining natural Telugu.
  - severity: low
    issue: The footnote marker follows the sentence-final punctuation rather than immediately following the idiomatic clause it annotates.
    rationale: Placing the marker directly after “మనసులో పెట్టుకోలేదు” gives the note an unambiguous anchor.
