translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని పునరుక్త నిషేధ నిర్మాణం తెలుగులో ‘జవాబివ్వలేదు; ... పెట్టుకోలేదు’గా నిలుపబడింది. పాదసూచిక గుర్తు సందిగ్ధమైన చివరి నుడికారం వద్ద ఉంచబడింది.
