base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
translation:
  language: te
  text: ఆమె మరణించే వేళ, ఆమె పక్కన నిలబడి ఉన్న స్త్రీలు ఆమెతో, “భయపడకు, ఎందుకంటే నీవు కుమారుణ్ణి కన్నావు” అన్నారు. అయితే ఆమె జవాబివ్వలేదు; దానిని మనసులో పెట్టుకోలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆమె దానిపై తన మనసు నిలపలేదు”; అంటే, వారు చెప్పిన మాటను ఆమె పట్టించుకోలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  choice: ఆమె చనిపోతున్న సమయంలో
  rationale: ఈ పదబంధం ఆమె మరణం సంభవిస్తున్న సమయాన్ని సూచిస్తుంది. ‘చనిపోతున్న సమయంలో’ అనేది క్రియాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַתְּדַבֵּרְנָה
  choice: అన్నారు
  rationale: స్త్రీల సమూహం ఆమెను నేరుగా ఉద్దేశించి పలికిన మాటలను తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: הַנִּצָּבוֹת עָלֶיהָ
  choice: ఆమె పక్కన నిలబడి ఉన్న స్త్రీలు
  rationale: נצב అనే పదంలోని ‘నిలబడి ఉండడం’ అనే స్పష్టమైన చిత్రాన్ని నిలుపుతూ, על అనే సంబంధపదాన్ని ఈ ప్రసవ సందర్భంలో సహజంగా ‘పక్కన’ అని అందిస్తుంది.
- source_word: אַל תִּירְאִי
  choice: భయపడకు
  rationale: స్త్రీలింగ ఏకవచన నిషేధ ఆజ్ఞను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי בֵן יָלָדְתְּ
  choice: నీవు కుమారుణ్ణి కన్నావు
  rationale: ילד యొక్క ప్రసవార్థాన్ని సాధారణ ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది; כִּי ఇక్కడ ధైర్యపరచడానికి కారణాన్ని పరిచయం చేస్తుంది, దానిని తెలుగు విరామచిహ్న నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא עָנְתָה
  choice: ఆమె జవాబివ్వలేదు
  rationale: ענה యొక్క ‘సమాధానం చెప్పడం/ప్రతిస్పందించడం’ అనే సాధారణ అర్థాన్ని నేరుగా అందిస్తుంది.
- source_word: וְלֹא שָׁתָה לִבָּהּ
  choice: ఆ మాటను మనసులో పెట్టుకోలేదు
  rationale: అక్షరార్థ హృదయ భాషను తెలుగు వాడుకలోని సమానమైన నుడికారంతో నిలుపుతుంది. సందర్భంలో ఇది వారు చెప్పిన మాటపై ఆమె శ్రద్ధ పెట్టలేదనే భావాన్ని ఇస్తుంది; అయినా మూలంలోని నుడికార విస్తృతిని పూర్తిగా సంకుచితం చేయదు.
