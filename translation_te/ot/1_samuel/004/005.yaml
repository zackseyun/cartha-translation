source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן בְּרִית יְהוָה֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יָּרִ֥עוּ כָל יִשְׂרָאֵ֖ל תְּרוּעָ֣ה גְדוֹלָ֑ה וַ/תֵּהֹ֖ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
translation:
  language: te
  text: యాహ్వే నిబంధన మందసం శిబిరంలోకి వచ్చినప్పుడు, ఇశ్రాయేలీయులందరూ పెద్ద కేక వేశారు; దాంతో భూమి మారుమోగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమి కంపించింది.” హీబ్రూ క్రియ శబ్దకల్లోలాన్ని లేదా కంపనాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: వచ్చినప్పుడు
  rationale: వావ్-క్రమరూపంతో కూడిన కాలార్థక infinitive construct కథనంలో సమయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వచ్చినప్పుడు’ సహజంగా, మూలార్థానికి దగ్గరగా ఉంది.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యెహోవా నిబంధన మందసం
  rationale: హీబ్రూ construct chain భావాన్ని తెలుగులో సహజమైన సంబంధ నిర్మాణంతో తెలిపింది; ‘మందసం’ పవిత్ర పెట్టెను సూచించే గౌరవప్రదమైన బైబిలీయ పదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తినామంగా ఉంచింది.
- source_word: הַמַּחֲנֶה
  choice: శిబిరం
  rationale: సైనిక కథన సందర్భంలో ‘శిబిరం’ సహజమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: וַיָּרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: గొప్పగా కేకలు వేశారు
  rationale: క్రియతో సమాన మూలం గల నామవాచకం కలిగించే తీవ్రతను తెలుగులో క్రియావిశేషణ రూపంతో సహజంగా వ్యక్తం చేసింది; ‘యుద్ధనాదం’ అని సందర్భాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: וַתֵּהֹם הָאָרֶץ
  choice: నేల మారుమోగింది
  rationale: హీబ్రూ క్రియ శబ్దకల్లోలాన్నీ కంపనాన్నీ సూచించగలదు. ప్రధాన పాఠంలో ‘మారుమోగింది’ అని పెట్టి, ఖచ్చితమైన భూకంపాన్ని అనవసరంగా సూచించకుండా శబ్ద ప్రభావాన్ని తెలిపింది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న దైవ వ్యక్తినామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచింది. ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: మందసం వచ్చినప్పుడు ఇశ్రాయేలీయుల కేక స్వరూపం
  choice: కేకలు వేశారు
  alternative: యుద్ధనాదం చేశారు
  rationale: వారి ప్రతిస్పందనను విజయోత్సాహమా, యుద్ధనాదమా అని వచనం స్పష్టంగా నిర్ణయించదు; అందువల్ల విస్తృతార్థక పదాన్ని ఎంచుకుని ఆ అనిశ్చితిని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడుతూ, ‘మందసం’ వంటి స్థిరమైన బైబిలీయ పదాన్ని నిలిపింది. పాదటిప్పణి గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
