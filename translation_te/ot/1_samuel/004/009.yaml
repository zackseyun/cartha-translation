id: 1SA.4.9
reference: 1 Samuel 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִֽתְחַזְּק֞וּ וִֽ/הְי֤וּ לַֽ/אֲנָשִׁים֙ פְּלִשְׁתִּ֔ים פֶּ֚ן תַּעַבְד֣וּ לָ/עִבְרִ֔ים כַּ/אֲשֶׁ֥ר עָבְד֖וּ לָ/כֶ֑ם וִ/הְיִיתֶ֥ם לַ/אֲנָשִׁ֖ים וְ/נִלְחַמְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become servants to the Hebrews as they have been to you[b]. Be men and fight!
translation:
  language: te
  text: ఫిలిష్తీయులారా, బలపడండి; మగవారిగా నిలబడండి[a]. లేకపోతే, హెబ్రీయులు మీకు దాసులుగా ఉన్నట్లే మీరు వారికి దాసులవుతారు[b]. మగవారిగా నిలబడి యుద్ధం చేయండి!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పురుషులుగా ఉండండి”; ఇక్కడ ఇది మగ యోధుల ధైర్యాన్ని ప్రదర్శించమనే లింగసూచక యుద్ధ ప్రోత్సాహం. “మగవారిలా ప్రవర్తించండి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “వారు మీకు సేవ చేసినట్లే” అని కూడా అనువదించవచ్చు; ఈ యుద్ధ సందర్భంలో బలవంతపు అధీనస్థితి ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזְּקוּ
  choice: బలపడండి
  rationale: హిత్‌పయేల్ ఆజ్ఞార్థక బహువచనం యుద్ధ సందర్భంలో తమను తాము దృఢపరచుకొని ధైర్యం తెచ్చుకోవాలని పిలుస్తుంది; ‘బలపడండి’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וִהְיוּ לַאֲנָשִׁים / וִהְיִיתֶם לַאֲנָשִׁים
  choice: మగవారిగా నిలబడండి
  rationale: ఇది పురుష యోధులను ఉద్దేశించిన, పురుషత్వంతో కూడిన ధైర్యాన్ని ప్రదర్శించమనే అలంకారిక పిలుపు. మూలంలోని లింగసూచనను, రెండుసార్ల పునరుక్తిని నిలుపుతుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులారా
  rationale: సందర్భంలోని ప్రత్యక్ష సంబోధనను తెలుగు సంబోధనారూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: తప్పించుకోవలసిన పరిణామాన్ని హెచ్చరికగా పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: תַּעַבְדוּ
  choice: దాసులవుతారు
  rationale: యుద్ధపరాజయం వల్ల కలిగే బలవంతపు అధీనస్థితిని ‘సేవచేస్తారు’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָעִבְרִים
  choice: హెబ్రీయులు
  rationale: మూలంలోని עִבְרִים అనే జాతిపేరును అలాగే ఉంచి, ‘ఇశ్రాయేలీయులు’ అని సమన్వయపరచలేదు.
- source_word: כַּאֲשֶׁר עָבְדוּ לָכֶם
  choice: వారు మీకు దాసులుగా ఉన్నట్లే
  rationale: గతంలో హెబ్రీయులు ఫిలిష్తీయుల అధీనంలో ఉన్నారనే పోలికను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְנִלְחַמְתֶּם
  choice: యుద్ధం చేయండి
  rationale: వ్యాకరణపరంగా అనుసంధానమైన సంపూర్ణ క్రియ అయినా, సందర్భంలో ఆజ్ఞాత్మక ప్రేరణను కలిగి ఉంది; తెలుగులో ప్రత్యక్ష ఆజ్ఞ సహజం.
theological_decisions:
- issue: לַאֲנָשִׁים అనే లింగసూచక యుద్ధ ప్రోత్సాహం
  choice: మగవారిగా నిలబడండి
  alternative: ధైర్యంగా నిలబడండి / మగవారిలా ప్రవర్తించండి
  rationale: మూలపాఠం పురుష ఫిలిష్తీయ యోధులకు చెప్పిన లింగసూచక జాతీయాన్ని ఉపయోగిస్తుంది. కేవలం ‘ధైర్యంగా ఉండండి’ అనడం ఆ గుర్తింపును చెరిపేస్తుంది; ‘నిలబడండి’ దాని ప్రదర్శనాత్మక భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- issue: עבד యొక్క బలవంతపు అధీన భావం
  choice: దాసులవుతారు
  alternative: సేవ చేస్తారు / లోబడతారు
  rationale: ఇక్కడ స్వచ్ఛంద సేవ కాదు, యుద్ధంలో ఓడి మరొక ప్రజకు బంధిత అధీనస్థితిలో పడటం ఉద్దేశం. అందువల్ల ‘దాసులు’ సందర్భబలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, ప్రత్యక్ష యుద్ధ ప్రోత్సాహ శైలి. మూలంలోని పునరుక్తి, ‘హెబ్రీయులు’ అనే బాహ్య జాతిపేరు, లింగసూచక జాతీయం నిలుపబడ్డాయి. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
