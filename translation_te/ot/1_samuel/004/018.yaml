source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/הַזְכִּיר֣/וֹ אֶת אֲר֣וֹן הָ/אֱלֹהִ֗ים וַ/יִּפֹּ֣ל מֵֽ/עַל הַ֠/כִּסֵּא אֲחֹ֨רַנִּ֜ית בְּעַ֣ד יַ֣ד הַ/שַּׁ֗עַר וַ/תִּשָּׁבֵ֤ר מַפְרַקְתּ/וֹ֙ וַ/יָּמֹ֔ת כִּֽי זָקֵ֥ן הָ/אִ֖ישׁ וְ/כָבֵ֑ד וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל אַרְבָּעִ֥ים שָׁנָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
translation:
  language: te
  text: దేవుని మందసం గురించి అతడు ప్రస్తావించగానే, ఏలీ ద్వారం పక్కన[a] ఉన్న ఆసనం మీద నుండి వెనక్కి పడిపోయాడు. అతని మెడ విరిగి అతడు చనిపోయాడు; ఎందుకంటే అతడు వృద్ధుడూ బరువైనవాడూ. అతడు ఇశ్రాయేలుకు నలభై సంవత్సరాలు న్యాయాధిపతిగా ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ద్వారం వద్ద,” “ద్వారం వైపున.” హీబ్రూ నుడికారాన్ని అక్షరార్థంగా తీసుకుంటే “ద్వారం చేతి దగ్గర” అని ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “బరువైనవాడు.” అతని వయస్సుతోపాటు శరీర బరువు కూడా ఈ పతనం ప్రాణాంతకం కావడానికి కారణమై ఉండవచ్చని ఈ పదం సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  choice: అతడు ప్రస్తావించగానే
  rationale: זכר హిఫీల్ రూపానికి ‘ప్రస్తావించు’ అనే అర్థాన్ని, כְּ యొక్క కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: ఇశ్రాయేలు దేవునికి సంబంధించిన పవిత్ర మందసాన్ని సూచించే నిర్మాణాన్ని నేరుగా, స్థిరమైన బైబిలు పదజాలంతో అందిస్తుంది.
- source_word: וַיִּפֹּל ... אֲחֹרַנִּית
  choice: వెనక్కి పడిపోయాడు
  rationale: אֲחֹרַנִּית యొక్క క్రియావిశేషణ భావాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: הַכִּסֵּא
  choice: పీఠం
  rationale: ఈ రాజేతర సందర్భంలో כִּסֵּאను ‘సింహాసనం’గా అతిగా నిర్దిష్టం చేయకుండా, కూర్చునే ఎత్తైన ఆసనం అనే భావాన్ని ఇస్తుంది.
- source_word: בְּעַד יַד הַשַּׁעַר
  choice: ద్వారం పక్కన
  rationale: ‘ద్వారం చేతి/వైపు వద్ద’ అనే హీబ్రూ నుడికారంలోని స్థానార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది; ప్రత్యామ్నాయ సూక్ష్మతను పాదటిప్పణిలో ఉంచింది.
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  choice: అతని మెడ విరిగి
  rationale: מַפְרֶקֶת సూచించే మెడ లేదా మెడ వెనుక భాగాన్ని సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּי זָקֵן הָאִישׁ וְכָבֵד
  choice: ఎందుకంటే అతడు వృద్ధుడు, బరువైనవాడు
  rationale: వయస్సు మరియు כָבֵד యొక్క ప్రాథమిక ‘బరువైన’ భావాన్ని కాపాడుతుంది; ‘లావైనవాడు’ అని అర్థాన్ని సంకుచితం చేయదు.
- source_word: שָׁפַט אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు ... న్యాయం తీర్చాడు
  rationale: ఏలీ న్యాయాధిపతి పాత్రను అనవసర వివరణ లేకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: సంఖ్యా-కాల వ్యక్తీకరణకు నేరమైన అనువాదం.
theological_decisions:
- issue: אֲרוֹן הָאֱלֹהִיםలో אֱלֹהִים యొక్క సూచన
  choice: దేవుని
  alternative: దేవతల మందసం
  rationale: ఈ కథన సందర్భంలో ఇది ఇశ్రాయేలు దేవునినే సూచిస్తుంది; అందువల్ల ఏకవచన భావమే సందర్భానుసారంగా అవసరం.
- issue: שָׁפַטను పాలనా నాయకత్వంగా విస్తరించాలా
  choice: న్యాయం తీర్చాడు
  alternative: న్యాయాధిపతిగా ఇశ్రాయేలును పరిపాలించాడు
  rationale: మూలంలోని ‘తీర్పు తీర్చు/న్యాయాధిపతిగా వ్యవహరించు’ అనే విస్తృత భావాన్ని ఒక నిర్దిష్ట పాలనా సిద్ధాంతానికి పరిమితం చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి ఉపయోగించబడింది. ‘మందసం,’ ‘పీఠం,’ ‘న్యాయం తీర్చాడు’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకుడికి అర్థమయ్యేలా ఎంపికయ్యాయి. ప్రధాన వాక్యంలో ప్రతి పాదటిప్పణి సూచిక సంబంధిత పదబంధం వద్ద ఉంచబడింది.
