translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలిని వాడాం. ‘ఇశ్రాయేలు’ దేశ/ప్రజా సమూహంగా ఏకవచన క్రియతో వచ్చింది; వ్యక్తిగత నష్టాన్ని చెప్పే చోట ‘ఇశ్రాయేలీయుల్లో’ అని స్పష్టం చేశాం. మూలంలోని ‘గుడారాలు’ అనే దృశ్యరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ‘ఇళ్లు’ అనే నుడికార అవకాశాన్ని పాదటిప్పణిలో ఇచ్చాం.
