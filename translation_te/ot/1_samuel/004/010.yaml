base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
translation:
  language: te
  text: ఫిలిష్తీయులు యుద్ధం చేశారు; ఇశ్రాయేలు ఓడిపోయింది. ప్రతివాడూ తన గుడారానికి పారిపోయాడు.[a] సంహారం చాలా ఘోరంగా జరిగింది; ఇశ్రాయేలీయులలో ముప్పై వేలమంది కాలినడక సైనికులు యుద్ధంలో పడిపోయారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన ఇంటికి పారిపోయాడు.’ హీబ్రూలో అక్షరార్థంగా ‘తన గుడారానికి’ అని ఉంది; ఈ మాట ఒకరి నివాసస్థలాన్ని సూచించే నుడికారంగా కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఓటమి చాలా తీవ్రంగా ఉంది.’ హీబ్రూలో అక్షరార్థంగా, ‘దెబ్బ చాలా గొప్పది’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు యుద్ధం చేశారు
  rationale: לחם అనే క్రియ ఇక్కడ సైనిక పోరాటాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘యుద్ధం చేశారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఓడిపోయింది
  rationale: యుద్ధ సందర్భంలో נָגַף ఓటమిపాలవడాన్ని సూచిస్తుంది. తరువాతి పారిపోవడం వేరుగా చెప్పబడినందున ‘ఓడిపోయింది’ మూల భావాన్ని అతిశయింపకుండా అందిస్తుంది.
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  choice: ప్రతి ఒక్కరూ తమ తమ గుడారాలకు పారిపోయారు
  rationale: אִישׁ ఇక్కడ పంపిణీ భావంలో ‘ప్రతి ఒక్కరూ’ అని అర్థం; אֹהֶל యొక్క ప్రత్యక్ష అర్థమైన ‘గుడారం’ను నిలుపుతూ సహజ తెలుగు బహువచన నిర్మాణాన్ని వాడాం.
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  choice: సంహారం చాలా ఘోరంగా జరిగింది
  rationale: מַכָּה అక్షరార్థంగా ‘దెబ్బ’ అయినా, ఈ యుద్ధ సందర్భంలో వెంటనే చెప్పబడే భారీ ప్రాణనష్టాన్ని సూచిస్తుంది. ‘సంహారం’ ఆ ఘాతక ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּפֹּל מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల్లో ... యుద్ధంలో పడిపోయారు
  rationale: యుద్ధ సందర్భంలో נפל అంటే పోరాటంలో మరణించడం. ‘యుద్ధంలో పడిపోయారు’ అనే గౌరవప్రదమైన సైనిక ప్రయోగం మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: שְׁלֹשִׁים אֶלֶף רַגְלִי
  choice: ముప్పై వేలమంది కాల్బల సైనికులు
  rationale: రַגְלִי గుర్రపు లేదా రథ దళానికి భిన్నంగా కాలినడకన పోరాడే సైనికులను సూచిస్తుంది; ‘కాల్బల సైనికులు’ ఆధునిక ప్రామాణిక తెలుగు పదప్రయోగం.
