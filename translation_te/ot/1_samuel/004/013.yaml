- from: అతడు వచ్చేసరికి, ఇదిగో, ఏలీ దారి పక్కన[a] ఉన్న ఆసనం మీద కూర్చొని ఎదురుచూస్తున్నాడు. దేవుని మందసం గురించి అతని హృదయం వణుకుతోంది.[b] ఆ మనిషి పట్టణంలోకి వచ్చి వార్త చెప్పగానే, పట్టణమంతా కేక వేసింది.
