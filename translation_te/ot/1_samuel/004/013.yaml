  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּב֗וֹא וְ/הִנֵּ֣ה עֵ֠לִי יֹשֵׁ֨ב עַֽל הַ/כִּסֵּ֜א יך דֶּ֨רֶךְ֙ מְצַפֶּ֔ה כִּֽי הָיָ֤ה לִבּ/וֹ֙ חָרֵ֔ד עַ֖ל אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/הָ/אִ֗ישׁ בָּ֚א לְ/הַגִּ֣יד בָּ/עִ֔יר וַ/תִּזְעַ֖ק כָּל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
translation:
  language: te
  text: అతడు వచ్చేసరికి, ఇదిగో, ఏలీ దారి పక్కన[a] ఉన్న ఆసనం మీద కూర్చొని ఎదురుచూస్తున్నాడు; దేవుని మందసం గురించి అతని హృదయం వణుకుతోంది.[b] ఆ మనిషి వచ్చి పట్టణంలో వార్త తెలిపాడు, పట్టణమంతా కేక వేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దారి చేతి/వైపు’; అంటే దారి పక్కన.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘దేవుని మందసం గురించి అతని హృదయం ఆందోళన చెందుతోంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא וְהִנֵּה
  choice: అతడు వచ్చేసరికి, ఇదిగో
  rationale: కథనం ముందుకు సాగే భావాన్ని కాలసంబంధ వాక్యంతో సహజంగా తెలిపి, הִנֵּה కలిగించే ఆకస్మిక దృశ్యప్రాధాన్యాన్ని ‘ఇదిగో’తో నిలిపింది.
- source_word: יֹשֵׁב עַל־הַכִּסֵּא
  choice: ఆసనం మీద కూర్చొని
  rationale: כִּסֵּאను గృహోపకరణమైన ‘కుర్చీ’గా పరిమితం చేయకుండా, తటస్థమైన ‘ఆసనం’గా అనువదించింది.
- source_word: יַד דֶּרֶךְ
  choice: దారి పక్కన
  rationale: ‘దారి చేతి/వైపు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు స్థలార్థాన్ని ఇచ్చింది.
- source_word: מְצַפֶּה
  choice: ఎదురుచూస్తున్నాడు
  rationale: ఈ సందర్భంలో ఉన్న అప్రమత్తమైన, ఆత్రుతతో కూడిన నిరీక్షణను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כִּי הָיָה לִבּוֹ חָרֵד
  choice: అతని హృదయం వణుకుతోంది
  rationale: חָרֵדలోని భయం, ఆందోళన, వణుకు అనే దృఢమైన రూపకాన్ని వ్యాఖ్యానంతో సన్నగా చేయకుండా నిలిపింది.
- source_word: עַל אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం గురించి
  rationale: עַל ఇక్కడ ఆందోళనకు సంబంధించిన విషయాన్ని సూచిస్తుంది; ‘గురించి’ ఆ సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְהַגִּיד בָּעִיר
  choice: పట్టణంలోకి వచ్చి వార్త చెప్పగానే
  rationale: దూత పట్టణంలో వార్త తెలియజేసిన సంఘటనను సందర్భానుగుణంగా స్పష్టంగా తెలుపుతుంది; ‘వార్త’ యుద్ధసమాచారాన్ని సూచించినా దాని విషయాన్ని అదనంగా నిర్ధారించదు.
- source_word: וַתִּזְעַק כָּל־הָעִיר
  choice: పట్టణమంతా కేక వేసింది
  rationale: זעק సూచించే సామూహిక దుఃఖం లేదా భయంతో కూడిన గట్టి కేకను సంక్షిప్తంగా నిలిపింది.
theological_decisions:
- issue: אֲרוֹן הָאֱלֹהִים అనే పదబంధం
  choice: దేవుని మందసం
  alternative: దేవుని నిబంధన మందసం
  rationale: ఈ వచనంలో ‘నిబంధన’ అనే పదం ప్రత్యక్షంగా లేదు. అందువల్ల పరిచితమైన విస్తృత బిరుదును చేర్చకుండా మూలంలోని సంక్షిప్త రూపాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. ‘ఆసనం’, ‘మందసం’ వంటి పదాలు గౌరవప్రదమైన బైబిలు సందర్భాన్ని నిలిపినా వాక్యనిర్మాణం సరళంగా ఉంది. మూలంలోని దృశ్యాత్మక ‘ఇదిగో’ మరియు ‘హృదయం వణుకుతోంది’ అనే వ్యక్తీకరణలను ఉద్దేశపూర్వకంగా నిలిపాం.
