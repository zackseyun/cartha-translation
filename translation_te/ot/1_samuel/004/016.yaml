source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/אִ֜ישׁ אֶל עֵלִ֗י אָֽנֹכִי֙ הַ/בָּ֣א מִן הַ/מַּעֲרָכָ֔ה וַ/אֲנִ֕י מִן הַ/מַּעֲרָכָ֖ה נַ֣סְתִּי הַ/יּ֑וֹם וַ/יֹּ֛אמֶר מֶֽה הָיָ֥ה הַ/דָּבָ֖ר בְּנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
translation:
  language: te
  text: 'ఆ మనిషి ఏలీతో ఇలా అన్నాడు: “నేను యుద్ధ శ్రేణి[a] నుండి వచ్చినవాణ్ణి; ఈ రోజు యుద్ధ శ్రేణి నుండి పారిపోయాను.” అప్పుడు ఏలీ, “నా కుమారుడా, ఏమి జరిగింది?” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యుద్ధం నుండి,” “సైనిక శ్రేణుల నుండి,” లేదా “శిబిరం నుండి” అని కూడా అనువదించవచ్చు; హీబ్రూ పదం సైనిక అమరికను లేదా యుద్ధ శ్రేణిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: ఇది సాధారణంగా ‘మనిషి’ అనే అర్థమిచ్చే పదం. సందర్భంలో అతడు వార్త తీసుకొచ్చినవాడైనా, మూలపాఠంలో ప్రత్యేకంగా ‘దూత’ అనే పదం లేదు.
- source_word: הַבָּא
  choice: వచ్చినవాణ్ణి
  rationale: సర్వనామంతో కూడిన కృదంతం వక్తను ‘వచ్చినవాణ్ణి నేనే’ అని గుర్తిస్తుంది; అతడు అప్పటికే ఏలీ వద్దకు చేరుకున్న సందర్భానికి ఇది సహజంగా సరిపోతుంది.
- source_word: מִן הַמַּעֲרָכָה
  choice: యుద్ధ శ్రేణి నుండి
  rationale: מַעֲרָכָה యుద్ధానికి అమర్చిన సైనిక శ్రేణిని లేదా వ్యూహరచనను సూచిస్తుంది; ‘యుద్ధం నుండి’ కంటే ఈ సైనిక నిర్మాణ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: נַסְתִּי
  choice: పారిపోయి వచ్చాను
  rationale: נוּס యొక్క ప్రధాన భావం ‘పారిపోవడం.’ తెలుగులో గమ్యస్థానానికి చేరిన సందర్భంలో ‘పారిపోయి వచ్చాను’ సహజంగా ఉంటుంది; తప్పించుకొని బతికిన ఫలితాన్ని అనవసరంగా జోడించదు.
- source_word: הַיּוֹם
  choice: ఈ రోజే
  rationale: సంఘటన అదే రోజు జరిగిందనే కాలసూచనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఏ’ సందర్భోచిత ప్రాధాన్యాన్ని ఇస్తుంది.
- source_word: מֶה הָיָה הַדָּבָר
  choice: ఏమి జరిగింది?
  rationale: అక్షరార్థంగా ‘విషయం ఏమైంది?’ అనే నిర్మాణం; సంఘటనల నివేదికను అడిగే సందర్భంలో ‘ఏమి జరిగింది?’ సహజమైన, ఖచ్చితమైన తెలుగు.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: మొదటి పురుష ఏకవచన స్వామ్య ప్రత్యయం స్పష్టంగా ఉంది. ఇది చిన్నవాడిని ఆప్యాయంగా లేదా మర్యాదగా సంబోధించే మాట; బంధుత్వాన్ని తప్పనిసరిగా సూచించదు.
