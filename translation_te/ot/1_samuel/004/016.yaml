translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ‘యుద్ధ శ్రేణి’ పదం రెండుసార్లు రావడాన్ని అలాగే నిలిపి, వాక్యాన్ని సహజంగా చేయడానికి రెండో క్రియలో ‘వచ్చాను’ చేర్చబడింది. ‘నా కుమారుడా’ను ఆప్యాయ/మర్యాదపూర్వక సంబోధనగా ఉంచాం.
