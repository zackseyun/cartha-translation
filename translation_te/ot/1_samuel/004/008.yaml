  to: అయ్యో, మన గతేమిటి! ఈ బలమైన దేవుళ్ల చేతిలోనుండి మనల్ని ఎవరు రక్షించగలరు? అరణ్యంలో ఐగుప్తును ప్రతి తెగులుతో కొట్టిన దేవుళ్లు వీరే.[a][b]
