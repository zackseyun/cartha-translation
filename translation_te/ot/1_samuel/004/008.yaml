source:
  edition: WLC
  text: א֣וֹי לָ֔/נוּ מִ֣י יַצִּילֵ֔/נוּ מִ/יַּ֛ד הָ/אֱלֹהִ֥ים הָ/אַדִּירִ֖ים הָ/אֵ֑לֶּה אֵ֧לֶּה הֵ֣ם הָ/אֱלֹהִ֗ים הַ/מַּכִּ֧ים אֶת מִצְרַ֛יִם בְּ/כָל מַכָּ֖ה בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
translation:
  language: te
  text: అయ్యో, మన గతేమిటి! ఈ బలమైన దేవుళ్ల చేతిలోనుండి మనల్ని ఎవరు రక్షించగలరు? అరణ్యంలో ఐగుప్తును ప్రతి తెగులుతో కొట్టిన దేవుళ్లు వీరే.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ బలమైన దేవుడు/దేవుళ్లు.” ఇశ్రాయేలు దేవుణ్ణి గురించి మాట్లాడుతున్న ఫిలిష్తీయులు బహువచన రూపాలు వాడారు; అవి వారి సొంత బహుదేవతా అవగాహనను ప్రతిబింబిస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలపాఠంలో అక్షరార్థంగా “అరణ్యంలో” అని ఉంది. ఐగుప్తుపై తెగుళ్లు ఇశ్రాయేలీయుల అరణ్య ప్రయాణానికి ముందు సంభవించినందున ఈ పదబంధం సందర్భంలో క్లిష్టంగా ఉంది; అనువాదం మసొరేటిక్ పాఠాన్ని ఉన్నట్లుగానే అనుసరిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  choice: అయ్యో మనకు!
  rationale: తీవ్రమైన భయాన్నీ రాబోయే విపత్తు గురించిన విలాపాన్నీ తెలిపే హీబ్రూ ఉద్గారాన్ని సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది.
- source_word: מִ֣י יַצִּילֵ֔נוּ
  choice: మనల్ని ఎవరు విడిపించగలరు?
  rationale: నצל అనే క్రియలోని రక్షించడం లేదా అధికారంనుండి విడిపించడం అనే భావాన్ని ఇస్తుంది; ‘గలరు’ ప్రశ్నలోని నిస్సహాయతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: హీబ్రూలోని ‘చేతి’ అనే అధికార-నియంత్రణ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה
  choice: మహాశక్తిగల ఈ దేవుళ్లు
  rationale: אַדִּירִים అనే బహువచన విశేషణానికి అనుగుణంగా, ఫిలిష్తీయులు ఇశ్రాయేలు దేవుణ్ణి తమ బహుదేవతా అవగాహనతో వర్ణిస్తున్న తీరును నిలుపుతుంది.
- source_word: אֵלֶּה הֵם הָאֱלֹהִים
  choice: దేవుళ్లు వీరే
  rationale: హీబ్రూ గుర్తింపు వాక్యంలోని ఉద్ఘాటనను సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: הַמַּכִּים אֶת מִצְרַיִם
  choice: ఐగుప్తును ... కొట్టిన
  rationale: భూతకాలంలో తెలిసిన కార్యాన్ని సూచించే హీబ్రూ కృదంతాన్ని సంబంధార్థక వాక్యంగా అనువదిస్తుంది; מִצְרַיִםను దేశం లేదా ప్రజల సమష్టిగా ‘ఐగుప్తు’ అని ఉంచుతుంది.
- source_word: בְּכָל מַכָּה
  choice: ప్రతి తెగులుతో
  rationale: ‘ప్రతి దెబ్బ/తెగులు’ అనే మూలపాఠ భావాన్ని ‘ప్రతి’తో సన్నిహితంగా నిలుపుతుంది; నిర్గమ సందర్భంలో מַכָּהకు ‘తెగులు’ సహజం.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: మసొరేటిక్ పాఠంలో ఉన్న స్థలసూచనను చారిత్రక క్లిష్టత ఉన్నప్పటికీ సవరించకుండా అనువదిస్తుంది.
theological_decisions:
- issue: ఫిలిష్తీయుల మాటలో אֱלֹהִיםను ఎలా అనువదించాలి
  choice: దేవుళ్లు
  alternative: దేవుడు; దేవుడు/దేవుళ్లు
  rationale: ఇశ్రాయేలు ఆరాధించేది ఒక్క దేవుణ్ణే అయినా, ఈ వాక్యంలో బహువచన విశేషణం మరియు కృదంతం ఉన్నాయి. ఫిలిష్తీయుల బహుదేవతా దృష్టిని ఏకదేవతా ఒప్పుకోలుగా మార్చకుండా వారి అపార్థాన్ని నిలుపుతుంది.
- issue: בַּמִּדְבָּר అనే చారిత్రకంగా క్లిష్టమైన పదబంధం
  choice: అరణ్యంలో
  alternative: పదబంధాన్ని తొలగించడం లేదా ఐగుప్తులో అని సమన్వయపరచడం
  rationale: ఐగుప్తుపై తెగుళ్లు అరణ్య ప్రయాణానికి ముందు సంభవించినప్పటికీ, మసొరేటిక్ మూలపాఠం ‘అరణ్యంలో’ అని చదువుతుంది. అందువల్ల క్లిష్టతను పాదటిప్పణిలో సూచిస్తూ మూలపాఠాన్ని యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి వాడబడింది. ‘అయ్యో మనకు’ మూలంలోని సంక్షిప్త విలాపాన్ని నిలుపుతుంది; ‘చేతిలోనుండి’ హీబ్రూ అధికార రూపకాన్ని కాపాడుతుంది. ఫిలిష్తీయుల దృష్టికోణాన్ని సూచించడానికి బహువచనమైన ‘దేవుళ్లు’ ఉద్దేశపూర్వకంగా వాడబడింది.
