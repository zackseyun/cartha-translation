source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר שְׁמוּאֵ֖ל לְ/כָל יִשְׂרָאֵ֑ל וַ/יֵּצֵ֣א יִשְׂרָאֵל֩ לִ/קְרַ֨את פְּלִשְׁתִּ֜ים לַ/מִּלְחָמָ֗ה וַֽ/יַּחֲנוּ֙ עַל הָ/אֶ֣בֶן הָעֵ֔זֶר וּ/פְלִשְׁתִּ֖ים חָנ֥וּ בַ/אֲפֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
translation:
  language: te
  text: సమూయేలు మాట ఇశ్రాయేలీయులందరికీ చేరింది[a]. ఇశ్రాయేలీయులు ఫిలిష్తీయులను యుద్ధంలో ఎదుర్కోవడానికి బయలుదేరి, ఎబెనెజెరు[b] దగ్గర శిబిరం వేశారు. ఫిలిష్తీయులు ఆఫెకులో శిబిరం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమూయేలు సందేశం ఇశ్రాయేలీయులందరికీ చేరింది.” హీబ్రూ పదబంధం సమూయేలు మాటను లేదా సందేశాన్ని సూచించవచ్చు; ఈ సందర్భంలో అది బహుశా అతని ప్రవచన వాక్యాన్ని సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: “ఎబెనెజెరు” అంటే “సహాయపు రాయి.” ఇక్కడ అది ఒక స్థలపేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר שְׁמוּאֵל לְכָל יִשְׂרָאֵל
  choice: సమూయేలు మాట ఇశ్రాయేలీయులందరికీ చేరింది
  rationale: హీబ్రూ వాక్యంలోని ‘మాట’ అనే ఏకవచనాన్ని నిలుపుతూ, לְ సూచించే చేరికను సహజమైన ఆధునిక తెలుగులో ‘చేరింది’గా వ్యక్తపరుస్తుంది.
- source_word: וַיֵּצֵא יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు ... బయలుదేరి
  rationale: ప్రజాసమూహాన్ని సూచించే ‘ఇశ్రాయేలు’ను తెలుగులో సహజంగా ‘ఇశ్రాయేలీయులు’గా ఇచ్చి, יצא యొక్క సాధారణ అర్థాన్ని ‘బయలుదేరు’తో నిలిపింది.
- source_word: לִקְרַאת פְּלִשְׁתִּים לַמִּלְחָמָה
  choice: ఫిలిష్తీయులను యుద్ధంలో ఎదుర్కోవడానికి
  rationale: לקראת యొక్క ‘ఎదురుగా వెళ్లి కలుసుకోవడం’ అనే భావాన్ని సైనిక సందర్భంలో ‘ఎదుర్కోవడం’గా, מלחמהను ‘యుద్ధంలో’గా సహజంగా అందిస్తుంది.
- source_word: וַיַּחֲנוּ עַל הָאֶבֶן הָעֵזֶר
  choice: ఎబెనెజెరు దగ్గర శిబిరం వేశారు
  rationale: חנהను ఆధునిక తెలుగులో ‘శిబిరం వేశారు’గా ఇచ్చి, עַל‌ను స్థలసూచకంగా ‘దగ్గర’ అని అనువదించింది; పేరును లిప్యంతరీకరించింది.
- source_word: וּפְלִשְׁתִּים חָנוּ בַאֲפֵק
  choice: ఫిలిష్తీయులు ఆఫెకులో శిబిరం వేశారు
  rationale: సరళమైన సమన్వయ వాక్యంతో హీబ్రూ క్రమాన్ని నిలుపుతూ, స్థలనామమైన אֲפֵקను ‘ఆఫెకు’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: דְבַר שְׁמוּאֵל అనేది సమూయేలు ప్రవచన సందేశమా, లేక అతని గురించిన వార్తా?
  choice: ‘సమూయేలు మాట’—అతని ప్రవచన వాక్యంతో సంబంధం కనిపించేలా
  alternative: ‘సమూయేలు గురించిన వార్త’
  rationale: మూడో అధ్యాయం ముగింపులో యెహోవా సమూయేలు మాట ద్వారా తనను వెల్లడించిన సాహిత్య సందర్భం ప్రవచన వాక్యాన్ని బలపరుస్తుంది. అయినా హీబ్రూ పదబంధంలోని సాధ్యమైన ‘వార్త/వృత్తాంతం’ భావాన్ని పాదసూచికలో ఉంచి అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘మాట’ ద్వారా మూలంలోని ఏకవచన దָּבָרను నిలిపి, ప్రాచీనంగా అనిపించే పదజాలాన్ని నివారించాం. స్థలనామాలను తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
