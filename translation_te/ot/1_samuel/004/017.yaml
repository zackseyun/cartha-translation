translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వార్తా నివేదిక శైలిని ఉపయోగించాం. వాక్యానికి గంభీరతను నిలుపుతూ, సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదాలను ఎంచుకున్నాం. మూలంలోని వరుస విపత్తుల తీవ్రతను చిన్న, నేరుగా సాగే వాక్యాలతో కాపాడాం.
