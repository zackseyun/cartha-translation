source:
  edition: WLC
  text: וַ/יַּ֨עַן הַֽ/מְבַשֵּׂ֜ר וַ/יֹּ֗אמֶר נָ֤ס יִשְׂרָאֵל֙ לִ/פְנֵ֣י פְלִשְׁתִּ֔ים וְ/גַ֛ם מַגֵּפָ֥ה גְדוֹלָ֖ה הָיְתָ֣ה בָ/עָ֑ם וְ/גַם שְׁנֵ֨י בָנֶ֜י/ךָ מֵ֗תוּ חָפְנִי֙ וּ/פִ֣ינְחָ֔ס וַ/אֲר֥וֹן הָ/אֱלֹהִ֖ים נִלְקָֽחָה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
translation:
  language: te
  text: 'వార్త తెచ్చినవాడు ఇలా జవాబిచ్చాడు: “ఇశ్రాయేలు ఫిలిష్తీయుల ఎదుటనుండి పారిపోయింది. ప్రజల్లో కూడా గొప్ప సంహారం జరిగింది[a]. నీ ఇద్దరు కుమారులు హొఫ్నీ, ఫీనెహాసు కూడా చనిపోయారు. దేవుని మందసం పట్టుబడింది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజల్లో ఘోరమైన దెబ్బ తగిలింది.” హీబ్రూ పదం తీవ్రమైన దెబ్బను, తెగులును లేదా సంహారాన్ని సూచించవచ్చు; ఇక్కడి యుద్ధ సందర్భం “సంహారం” అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: పదశః, “దేవుని మందసం తీసుకోబడింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  choice: ఆ వార్త తెచ్చినవాడు
  rationale: ఈ కృదంత రూపం వార్తను తీసుకొచ్చిన వ్యక్తిని సూచిస్తుంది. సందర్భంలో ‘వార్త తెచ్చినవాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: נָס
  choice: పారిపోయింది
  rationale: మూల క్రియ నేరుగా ‘పారిపోవడం’ అనే అర్థాన్ని ఇస్తుంది; ‘ఓడిపోయింది’ అని అనువదిస్తే మూలంలో ఉన్నదానికంటే ఫలితాన్ని ఎక్కువగా వ్యాఖ్యానించినట్లు అవుతుంది.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల ఎదుట నుంచి
  rationale: శత్రువు సమక్షం నుంచి వెనుదిరిగి పారిపోవడాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: గొప్ప సంహారం
  rationale: యుద్ధ సందర్భంలో ఈ పదబంధం తీవ్రమైన దెబ్బను లేదా పెద్ద సంఖ్యలో జరిగిన వధను సూచిస్తుంది. ‘సంహారం’ ఈ సైనిక విపత్తును స్పష్టంగా తెలియజేస్తుంది; పదంలోని విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בָעָם
  choice: ప్రజల్లో
  rationale: హీబ్రూ పాఠం ‘ప్రజలు’ అనే పదాన్నే వాడుతుంది. సందర్భంలో వారు ఇశ్రాయేలు సైనికులైనా, మూలంలోని విస్తృత పదాన్ని నిలుపుతుంది.
- source_word: שְׁנֵי בָנֶיךָ
  choice: నీ ఇద్దరు కుమారులు
  rationale: మూలంలోని సంఖ్యనూ, ప్రత్యక్ష సంబోధననూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מֵתוּ
  choice: చనిపోయారు
  rationale: పూర్తయిన మరణ సంఘటనను తెలిపే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: חָפְנִי וּפִינְחָס
  choice: హొఫ్నీ, ఫీనెహాసు
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: ‘దేవుని మందసం’ అనే స్థిరమైన తెలుగు బైబిలు పదబంధం మూలంలోని సంబంధాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: נִלְקָחָה
  choice: పట్టుబడింది
  rationale: యుద్ధ సందర్భంలో మందసం శత్రువుల చేతికి చిక్కిందనే భావాన్ని సహజంగా తెలియజేస్తుంది; మరింత పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
