    rationale: హీబ్రూలో ‘వెగమ్’ పదం ‘నీ ఇద్దరు కుమారులు’ అనే అంశానికి ముందుంది. ‘నీ ఇద్దరు కుమారులు హొఫ్నీ, ఫీనెహాసు కూడా చనిపోయారు’ అని చేర్చడం మూలంలోని అనుసంధానాన్ని కాపాడుతుంది.
