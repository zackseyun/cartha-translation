source:
  edition: WLC
  text: וַ/יָּבֹ֣א הָ/עָם֮ אֶל הַֽ/מַּחֲנֶה֒ וַ/יֹּֽאמְרוּ֙ זִקְנֵ֣י יִשְׂרָאֵ֔ל לָ֣/מָּה נְגָפָ֧/נוּ יְהוָ֛ה הַ/יּ֖וֹם לִ/פְנֵ֣י פְלִשְׁתִּ֑ים נִקְחָ֧ה אֵלֵ֣י/נוּ מִ/שִּׁלֹ֗ה אֶת אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה וְ/יָבֹ֣א בְ/קִרְבֵּ֔/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/כַּ֥ף אֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
translation:
  language: te
  text: 'ప్రజలు శిబిరానికి వచ్చినప్పుడు, ఇశ్రాయేలు పెద్దలు ఇలా అన్నారు: “యాహ్వే ఈ రోజు ఫిలిష్తీయుల ఎదుట మనలను ఎందుకు ఓడించాడు? షిలోహు నుండి యాహ్వే నిబంధన మందసాన్ని మన దగ్గరికి తెచ్చుకుందాం. అది[a] మన మధ్యకు వచ్చి, మన శత్రువుల చేతిలోనుండి మనలను రక్షిస్తుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన మన మధ్యకు వచ్చి మనలను రక్షిస్తాడు.” ఏకవచన క్రియలు మందసంతో అనుబంధమైన యాహ్వే సన్నిధిని మరింత నేరుగా సూచిస్తున్నట్లు కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: ప్రజలు
  rationale: మూలంలోని సాధారణ అర్థమైన ‘ప్రజలు’ను నిలుపుతుంది; శిబిర సందర్భం వారు ఇశ్రాయేలు సైనికులని సూచిస్తుంది కాబట్టి అదనంగా ‘సైన్యం’ అని స్పష్టీకరించలేదు.
- source_word: הַמַּחֲנֶה
  choice: శిబిరం
  rationale: సైనిక సందర్భంలో సహజమైన, ప్రామాణిక తెలుగు పదం.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలు
  rationale: ప్రజల గుర్తింపు పొందిన నాయకులను సూచించే సహజమైన తెలుగు రూపం.
- source_word: נְגָפָנוּ
  choice: మనలను ఓడించాడు
  rationale: యుద్ధంలో దెబ్బతిని ఓడిపోవడాన్ని సూచిస్తుంది; దైవిక కర్తృత్వాన్ని కూడా స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నాలుగు అక్షరాల నామానికి సమీపమైన లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల ఎదుట
  rationale: ‘ఎదుట’ అనే మూల రూపకాన్ని నిలుపుతూ, యుద్ధంలో వారి సమక్షంలో పొందిన ఓటమిని సహజంగా తెలియజేస్తుంది.
- source_word: נִקְחָה אֵלֵינוּ
  choice: మన దగ్గరికి తెచ్చుకుందాం
  rationale: ప్రతిపాదనను తెలిపే cohortative భావాన్ని, అలాగే మందసాన్ని తమ శిబిరానికి తెప్పించుకోవాలనే ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִשִּׁלֹה
  choice: షిలోహు నుండి
  rationale: స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: హీబ్రూ construct సంబంధాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతూ మందసపు నిబంధనాత్మక ప్రాముఖ్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְיָבֹא בְקִרְבֵּנוּ
  choice: అది మన మధ్యకు వచ్చి
  rationale: సమీప వ్యాకరణ కర్త అయిన మందసాన్నే సూచిస్తుంది; ‘మన మధ్యకు’ అనే స్థల-సమూహ భావాన్ని నిలుపుతుంది.
- source_word: וְיֹשִׁעֵנוּ
  choice: మనలను రక్షిస్తుంది
  rationale: ישׁע హిఫీల్ రూపంలోని రక్షణ లేదా విమోచన భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: మన శత్రువుల చేతిలోనుండి
  rationale: అధికారం లేదా పట్టును సూచించే హీబ్రూ ‘చేతి’ రూపకాన్ని తెలుగు బైబిలు శైలిలో చదవదగిన విధంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూల రూపాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: וְיָבֹא ... וְיֹשִׁעֵנוּ క్రియల కర్త
  choice: అది మన మధ్యకు వచ్చి ... మనలను రక్షిస్తుంది
  alternative: ఆయన మన మధ్యకు వచ్చి ... మనలను రక్షిస్తాడు
  rationale: సమీప వ్యాకరణ పూర్వపదం ‘మందసం’ కాబట్టి ప్రధాన పాఠంలో ‘అది’ వాడబడింది. అయితే మందసంతో అనుబంధమైన యాహ్వే సన్నిధిని ఉద్దేశించి క్రియలను ‘ఆయన’కు అన్వయించే అవకాశాన్ని పాదసూచికలో నిలిపి, వాక్యంలోని నిజమైన ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మందసం,’ ‘నిబంధన,’ ‘చేతిలోనుండి’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచుతూ, అతిగా ప్రాచీనమైన క్రియారూపాలను నివారించింది. ప్రత్యక్ష వాక్యంలోని ప్రశ్న, ప్రతిపాదన, మందసంపై పెద్దల నిరీక్షణ స్పష్టంగా ఉండేలా రెండు వాక్యాలుగా అమర్చింది.
