  text: And the ark of God was captured, and the two sons of Eli died, Hophni and Phinehas.
translation:
  language: te
  text: దేవుని మందసం పట్టుబడింది; ఏలీ ఇద్దరు కుమారులైన హొఫ్నీ, ఫీనెహాసు చనిపోయారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן אֱלֹהִים
  choice: దేవుని మందసం
  rationale: హీబ్రూ నిర్మాణబంధాన్ని సహజమైన తెలుగులో చూపుతుంది; ‘మందసం’ పవిత్ర నిబంధన మందసాన్ని సూచించే గౌరవప్రదమైన ప్రామాణిక పదం.
- source_word: נִלְקָח
  choice: పట్టుబడింది
  rationale: לקח నిఫాల్ రూపం ఇక్కడ యుద్ధ సందర్భంలో శత్రువుల చేతికి చిక్కడాన్ని సూచిస్తుంది; ‘పట్టుబడింది’ ఆ నిష్క్రియాత్మక సైనిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּשְׁנֵי בְנֵי עֵלִי
  choice: ఏలీ ఇద్దరు కుమారులు
  rationale: సందర్భంలో ఏలీకి చెందిన నిర్దిష్టమైన ఇద్దరు కుమారులను సూచిస్తుంది; తెలుగు సహజ పదక్రమాన్ని అనుసరిస్తుంది.
- source_word: מֵתוּ
  choice: చనిపోయారు
  rationale: מות అనే సాధారణ క్రియను అదనపు చిత్రణ లేకుండా నేరుగా, సాధారణ ఆధునిక తెలుగులో అనువదిస్తుంది.
- source_word: חָפְנִי וּפִינְחָס
  choice: హొఫ్నీ, ఫీనెహాసు
  rationale: వ్యక్తుల పేర్లను హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించి, ఏలీ ఇద్దరు కుమారులు ఎవరో సమాసాధికారంగా తెలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన చారిత్రక వర్ణన. హీబ్రూ వాక్యంలోని రెండు విషాద సంఘటనలను అర్థవిరామంతో స్పష్టంగా అనుసంధానించాం; ఏ వివరణాత్మక లేదా మతసంప్రదాయ సంబంధిత అంశాన్నీ చేర్చలేదు.
