translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలపాఠంలోని వరుస సంఘటనలను నిలుపుతూ, తెలుగు పఠన సౌలభ్యం కోసం చివరి పరిస్థితి వాక్యాన్ని రెండు సమన్విత భాగాలుగా ఇచ్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత అంశాల తరువాత ఉంచబడ్డాయి.
