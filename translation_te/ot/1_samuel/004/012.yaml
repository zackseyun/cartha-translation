source:
  edition: WLC
  text: וַ/יָּ֤רָץ אִישׁ בִּנְיָמִן֙ מֵ/הַ/מַּ֣עֲרָכָ֔ה וַ/יָּבֹ֥א שִׁלֹ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וּ/מַדָּ֣י/ו קְרֻעִ֔ים וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/012.yaml
  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
translation:
  language: te
  text: అప్పుడు బెన్యామీను గోత్రానికి చెందిన ఒక మనిషి యుద్ధ శ్రేణి నుండి పరుగెత్తి, అదే రోజు షిలోహుకు వచ్చాడు.[a] అతడు చినిగిన బట్టలతో, తలపై మట్టితో ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యుద్ధం నుండి’ లేదా ‘సైనిక శ్రేణుల నుండి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం మరింత నిర్దిష్టంగా యుద్ధానికి అమర్చిన సైనిక శ్రేణిని లేదా పోరాట వరుసను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: బట్టలు చింపుకోవడం, తలపై మట్టి వేసుకోవడం దుఃఖం, తీవ్ర వేదన లేదా విపత్తును తెలియజేసే ఆనాటి ఆచార సూచనలు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרָץ
  choice: పరుగెత్తుకొని
  rationale: רוץ అనే క్రియ వేగంగా పరుగెత్తడాన్ని స్పష్టంగా సూచిస్తుంది. అతడు భయంతో పారిపోయాడనే ఉద్దేశాన్ని మూలపాఠం చెప్పదు కాబట్టి, ‘పారిపోయి’ అని అనువదించలేదు.
- source_word: אִישׁ בִּנְיָמִן
  choice: బెన్యామీను గోత్రానికి చెందిన ఒక మనిషి
  rationale: మూలంలోని గోత్ర గుర్తింపును స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מֵהַמַּעֲרָכָה
  choice: యుద్ధ శ్రేణి దగ్గర నుండి
  rationale: מַעֲרָכָה సాధారణంగా యుద్ధానికి అమర్చిన సైనిక శ్రేణిని లేదా పోరాట వరుసను సూచిస్తుంది. מן ఇక్కడ ఆ ప్రదేశం నుండి బయలుదేరడాన్ని తెలియజేస్తుంది.
- source_word: וַיָּבֹא שִׁלֹה
  choice: షిలోహుకు వచ్చాడు
  rationale: בוא అనే సాధారణ గమన క్రియను, గమ్యస్థానంతో సహజమైన తెలుగు కథన శైలిలో ఇచ్చింది.
- source_word: בַּיּוֹם הַהוּא
  choice: అదే రోజు
  rationale: అక్షరార్థంగా ‘ఆ రోజున’; సందర్భంలోని తక్షణ కాలసంబంధాన్ని సహజంగా తెలియజేయడానికి ‘అదే రోజు’ అని ఇచ్చింది.
- source_word: וּמַדָּיו קְרֻעִים
  choice: అతని బట్టలు చినిగిపోయి ఉన్నాయి
  rationale: מַדִּים ఇక్కడ వస్త్రాలను సూచిస్తుంది; קרע యొక్క నిష్క్రియ రూపం అవి చినిగిన స్థితిలో ఉన్నాయని చెబుతుంది.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: అతని తలపై మట్టి ఉంది
  rationale: אֲדָמָה అంటే నేల లేదా మట్టి. ‘ధూళి’ కంటే ‘మట్టి’ మూలపదానికి దగ్గరగా ఉండి, తెలుగులో సహజంగా ఉంది.
