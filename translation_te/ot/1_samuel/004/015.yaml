  text: Eli was ninety-eight years old[a], and his eyes were fixed so that he could not see.
translation:
  language: te
  text: ఏలీకి తొంభై ఎనిమిది సంవత్సరాలు; అతని కళ్లు స్థిరంగా ఉండిపోయాయి[a], కాబట్టి అతడు చూడలేకపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
