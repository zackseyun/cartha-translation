- from: ఏలీ తొంభై ఎనిమిది సంవత్సరాల వయస్సుగలవాడు. అతని కళ్లు స్థిరపడిపోయాయి[a]; అందుచేత అతడు చూడలేకపోయాడు.
  to: ఏలీకి తొంభై ఎనిమిది సంవత్సరాలు; అతని కళ్లు స్థిరంగా ఉండిపోయాయి[a], కాబట్టి అతడు చూడలేకపోయాడు.
  rationale: The revision uses an idiomatic Telugu age construction and replaces the unnatural “స్థిరపడిపోయాయి” with “స్థిరంగా ఉండిపోయాయి,” which better conveys the Hebrew image of eyes being fixed/stiff while leaving the precise medical sense unasserted. The causal relationship remains explicit and the footnote preserves the alternative lexical sense.
