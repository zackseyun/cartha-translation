lexical_decisions:
- source_word: בֶּן תִּשְׁעִים וּשְׁמֹנֶה שָׁנָה
  choice: తొంభై ఎనిమిది సంవత్సరాల వయస్సుగలవాడు
  rationale: ‘X సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు సూచక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వయస్సుగా వ్యక్తపరుస్తుంది.
- source_word: וְעֵינָיו
  choice: అతని కళ్లు
  rationale: బహువచన నామవాచకాన్ని, మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: קָמָה
  choice: స్థిరపడిపోయాయి
  rationale: ఈ సందర్భంలో కళ్లు కదలిక లేదా స్పందన కోల్పోయి స్థిరంగా మారిన స్థితిని సూచిస్తుంది; ‘మసకబారాయి’ అనే వివరణాత్మక అర్థాన్ని నేరుగా పాఠ్యంలో చేర్చకుండా మూలంలోని దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: וְלֹא יָכֹל לִרְאוֹת
  choice: అందుచేత అతడు చూడలేకపోయాడు
  rationale: కళ్ల స్థితి మరియు చూడలేకపోవడం మధ్య ఫలిత సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְ
  choice: ప్రత్యేక పదంగా అనువదించలేదు / వాక్య సంబంధంగా వ్యక్తీకరించబడింది
  rationale: వావ్ సంధిని తెలుగు కథన ప్రవాహానికి అనుగుణంగా విరామం మరియు ‘అందుచేత’ ద్వారా వ్యక్తపరిచాం; మూలంలో లేని ‘ఇప్పుడు’ అనే కాలసూచకాన్ని చేర్చలేదు.
