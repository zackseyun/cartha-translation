reference: 1 Samuel 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֤וּ פְלִשְׁתִּים֙ אֶת ק֣וֹל הַ/תְּרוּעָ֔ה וַ/יֹּ֣אמְר֔וּ מֶ֠ה ק֣וֹל הַ/תְּרוּעָ֧ה הַ/גְּדוֹלָ֛ה הַ/זֹּ֖את בְּ/מַחֲנֵ֣ה הָ/עִבְרִ֑ים וַ/יֵּ֣דְע֔וּ כִּ֚י אֲר֣וֹן יְהוָ֔ה בָּ֖א אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
translation:
  language: te
  text: ఫిలిష్తీయులు ఆ నినాద ధ్వనిని[a] విని, “హెబ్రీయుల శిబిరంలో ఈ పెద్ద నినాద ధ్వని ఏమిటి?” అని అడిగారు. యహ్వే[b] మందసం శిబిరంలోకి వచ్చిందని వారు తెలుసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నినాదం’ అనే పదాన్ని సందర్భానుసారంగా ‘కేక’, ‘జయధ్వని’ లేదా ‘యుద్ధనినాదం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలపాఠంలో దేవుని ప్రత్యేక నామం יהוה (YHWH) ఉంది; దీనిని ‘ప్రభువు’ లేదా ‘యెహోవా’ అని కూడా అనువదించడం ఆనవాయితీ.
    reason: divine_name
lexical_decisions:
- source_word: קוֹל
  choice: శబ్దం
  rationale: ఇక్కడ ఈ పదం మాట్లాడే ‘స్వరం’ను కాకుండా, ఇశ్రాయేలీయుల నినాదం వల్ల వినిపించిన శబ్దాన్ని సూచిస్తుంది.
- source_word: תְּרוּעָה
  choice: నినాదం
  rationale: ఈ పదం పెద్ద కేకను, జయధ్వనిని లేదా యుద్ధనినాదాన్ని సూచించగలదు. మందసం వచ్చినప్పుడు ప్రజలు చేసిన గొప్ప కేకను సందర్భానికి మించి ప్రత్యేకంగా నిర్వచించకుండా ‘నినాదం’ సహజంగా తెలియజేస్తుంది.
- source_word: מֶה
  choice: ఏమిటి?
  rationale: ఆ శబ్దం ఏమిటో లేదా దాని అర్థం ఏమిటో ఫిలిష్తీయులు ప్రశ్నిస్తున్నారు; తెలుగు ప్రత్యక్ష ప్రశ్నలో ‘ఏమిటి?’ సహజంగా ఉంటుంది.
- source_word: הַגְּדוֹלָה
  choice: గొప్ప
  rationale: మూలపదానికి ‘గొప్ప’ అనే ప్రాథమిక అర్థం ఉంది; ఇక్కడ అది నినాదపు తీవ్రతను సూచిస్తుంది. ‘పెద్ద’ లేదా ‘బిగ్గర’ అనేవి సందర్భానుసార ప్రత్యామ్నాయాలు.
- source_word: מַחֲנֶה
  choice: శిబిరం
  rationale: కథన సందర్భంలో ఇది సైనికులు దిగిన ప్రదేశాన్ని సూచిస్తుంది; ‘శిబిరం’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం.
- source_word: הָעִבְרִים
  choice: హెబ్రీయులు
  rationale: ఫిలిష్తీయులు ఉపయోగించిన జాతినామాన్ని ‘ఇశ్రాయేలీయులు’గా సాధారణీకరించకుండా, వారి దృష్టికోణాన్ని నిలుపుతుంది.
- source_word: וַיֵּדְעוּ
  choice: వారు తెలుసుకున్నారు
  rationale: కొత్త సమాచారం వారికి తెలిసిందనే భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, హీబ్రూ క్రియలోని తెలుసుకోవడం అనే ప్రాథమిక భావాన్ని కాపాడుతుంది.
- source_word: אֲרוֹן
  choice: మందసం
  rationale: పవిత్రమైన పెట్టెను సూచించే ఈ పదానికి తెలుగు బైబిలు వాడుకలో గౌరవప్రదమైన ‘మందసం’ సరిపోతుంది; మూలంలో లేని ‘నిబంధన’ అనే విశేషణాన్ని చేర్చలేదు.
- source_word: בָּא
  choice: వచ్చింది
  rationale: మందసం శిబిరంలోకి రావడం అప్పటికే పూర్తయిందని సందర్భం తెలియజేస్తుంది; తెలుగు ఉపవాక్య నిర్మాణంలో ‘వచ్చిందని’ ఆ పూర్వ చర్యను సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగానే లిప్యంతరీకరించాం. తెలుగు ఉచ్చారణకు అనుగుణంగా ‘యహ్వే’ వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ఫిలిష్తీయుల మాటల్లోని ‘హెబ్రీయులు’ అనే దృష్టికోణ పదాన్ని అలాగే నిలిపాం; నినాదం స్వరూపాన్ని అతిగా నిర్దిష్టం చేయలేదు.
