- from: ఫిలిష్తీయులు ఆ నినాద శబ్దాన్ని[a] విని, “హెబ్రీయుల శిబిరంలో ఈ గొప్ప నినాద శబ్దం ఏమిటి?” అని అడిగారు. యహ్వే[b] మందసం శిబిరంలోకి వచ్చిందని వారు తెలుసుకున్నారు.
