source:
  edition: WLC
  text: וַ/יַּעַרְכ֨וּ פְלִשְׁתִּ֜ים לִ/קְרַ֣את יִשְׂרָאֵ֗ל וַ/תִּטֹּשׁ֙ הַ/מִּלְחָמָ֔ה וַ/יִּנָּ֥גֶף יִשְׂרָאֵ֖ל לִ/פְנֵ֣י פְלִשְׁתִּ֑ים וַ/יַּכּ֤וּ בַ/מַּֽעֲרָכָה֙ בַּ/שָּׂדֶ֔ה כְּ/אַרְבַּ֥עַת אֲלָפִ֖ים אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
translation:
  language: te
  text: ఫిలిష్తీయులు ఇశ్రాయేలును ఎదుర్కొనేలా యుద్ధపంక్తిని ఏర్పాటు చేసుకున్నారు. యుద్ధం విస్తరించింది[a]. ఫిలిష్తీయుల ఎదుట ఇశ్రాయేలు ఓడిపోయింది; వారు పొలంలోని యుద్ధపంక్తిలో దాదాపు నాలుగు వేల మందిని హతమార్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధం మొదలైంది.” ఇక్కడి హెబ్రీయ క్రియ యుద్ధం ఆరంభమవడాన్ని గానీ, పోరాటం విస్తరించడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַרְכוּ
  choice: యుద్ధ పంక్తులు తీర్చారు
  rationale: సైన్యాన్ని యుద్ధానికి క్రమంగా అమర్చడం అనే ערך పదపు సైనిక అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִקְרַאת
  choice: ఎదుర్కోవడానికి
  rationale: ప్రత్యర్థి సైన్యాన్ని ఎదుర్కొనేందుకు ముందుకు రావడం అనే సందర్భోచిత భావాన్ని ఇస్తుంది; యుద్ధ సందర్భానికి మించిన భావాన్ని చేర్చదు.
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  choice: యుద్ధం విస్తరించింది
  rationale: యుద్ధం వ్యాపించి పూర్తి స్థాయి పోరాటంగా మారినట్లు సూచించే అరుదైన హెబ్రీయ నిర్మాణంలోని చిత్రాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: וַיִּנָּגֶף
  choice: ఓడిపోయింది
  rationale: నిఫాల్ రూపం ఇక్కడ శత్రువు ఎదుట పరాజయం పొందడాన్ని సూచిస్తుంది; తరువాత చెప్పే మరణాల సమాచారంతో దీన్ని కలిపివేయదు.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: శత్రువు సమక్షంలో, వారి చేతిలో ఓడిపోవడం అనే హెబ్రీయ సైనిక ప్రయోగాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: וַיַּכּוּ
  choice: హతమార్చారు
  rationale: యుద్ధ సందర్భంలో נכה ప్రాణాంతకంగా కొట్టివేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది స్పష్టంగా, సహజంగా ఉంది.
- source_word: בַמַּעֲרָכָה
  choice: యుద్ధ పంక్తిలో
  rationale: సైన్యపు అమరిక లేదా పోరాట పంక్తి అనే מַעֲרָכָה పదార్థాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: పొలంలోని
  rationale: హెబ్రీయ మూలంలోని సాధారణ 'పొలం/బయలు' భావానికి దగ్గరగా ఉండి, మూలంలో లేని 'బహిరంగ' వంటి వివరణను చేర్చదు.
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  choice: దాదాపు నాలుగు వేల మందిని
  rationale: సంఖ్య ముందు ఉన్న כְּ సుమారు అనే భావాన్ని ఇస్తుంది; אִישׁ ఇక్కడ యుద్ధంలో పాల్గొన్న పురుషులను లెక్కించే పదమైనా, సహజ తెలుగులో 'మంది' సందర్భానుసారంగా సరిపోతుంది.
