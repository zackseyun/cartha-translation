translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి. మూలంలోని వరుస చర్యలను చిన్న వాక్యాలుగా సహజంగా అందిస్తూ, అరుదైన యుద్ధ క్రియలోని సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
