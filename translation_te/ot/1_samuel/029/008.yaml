- from: 'దావీదు ఆకీషుతో ఇలా అన్నాడు: “అయితే నేను ఏమి చేశాను? నేను నీ సన్నిధిలో ఉన్న నాటి నుండి ఈ రోజు వరకు నీ సేవకునిలో నీవు ఏ తప్పు కనుగొన్నావు? నా ప్రభువైన రాజు శత్రువులతో యుద్ధం చేయడానికి నేను ఎందుకు వెళ్లకూడదు?”[a]'
