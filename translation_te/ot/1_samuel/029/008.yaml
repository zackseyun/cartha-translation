reference: 1 Samuel 29:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ כִּ֣י מֶ֤ה עָשִׂ֨יתִי֙ וּ/מַה מָּצָ֣אתָ בְ/עַבְדְּ/ךָ֔ מִ/יּוֹם֙ אֲשֶׁ֣ר הָיִ֣יתִי לְ/פָנֶ֔י/ךָ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י לֹ֤א אָבוֹא֙ וְ/נִלְחַ֔מְתִּי בְּ/אֹיְבֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
translation:
  language: te
  text: 'దావీదు ఆకీషుతో ఇలా అన్నాడు: “అయితే నేను ఏమి చేశాను? నేను నీ సన్నిధిలో ఉన్న నాటి నుండి ఈ రోజు వరకు నీ సేవకునిలో నీవు ఏ తప్పు కనుగొన్నావు? నా ప్రభువైన రాజు[a] శత్రువుల మీద యుద్ధం చేయడానికి నేను ఎందుకు వెళ్లకూడదు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా ప్రభువైన రాజు” అనే మాటను దావీదు పలికినట్లుగానే ఉంచాం. అతడు ఆకీషునే నేరుగా ఉద్దేశించాడా, లేక కథా సందర్భంలో ఈ మాటకు ఉద్దేశపూర్వక ద్వంద్వార్థం ఉందా అనేది హీబ్రూ పాఠం స్పష్టం చేయదు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי מֶה עָשִׂיתִי
  choice: అయితే నేను ఏమి చేశాను?
  rationale: כִּי ఇక్కడ ముందటి మాటకు దావీదు వ్యక్తం చేస్తున్న అభ్యంతరాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ ఆ సంభాషణాత్మక ప్రతిస్పందనను సహజంగా తెలియజేస్తుంది.
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  choice: నీ సేవకునిలో నీవు ఏ తప్పు కనుగొన్నావు?
  rationale: מצא + ב అనే నిర్మాణం సేవకునిలో తప్పు లేదా నిందకు కారణం కనుగొనడాన్ని సూచిస్తుంది. ‘ఏ తప్పు’ అంతర్లీన ప్రతికూల భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది; ‘నీ సేవకుడు’ రాజసన్నిధిలో వినయపూర్వక స్వీయసూచన.
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  choice: నేను నీ సన్నిధిలో ఉన్న నాటి నుండి ఈ రోజు వరకు
  rationale: హీబ్రూ పదబంధంలోని ‘నీ ఎదుట/సన్నిధిలో ఉన్న’ అనే భావాన్ని వ్యాఖ్యానాత్మకంగా ‘నీ సేవలో చేరిన’ అని మార్చకుండా, తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  choice: యుద్ధం చేయడానికి నేను ఎందుకు వెళ్లకూడదు?
  rationale: ఈ వాక్యం దావీదును యుద్ధానికి వెళ్లనివ్వకపోవడంపై అతని ప్రశ్నను తెలుపుతుంది. తెలుగులో ప్రశ్నార్థక రూపం ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּאֹיְבֵי
  choice: శత్రువులతో యుద్ధం చేయడానికి
  rationale: נלחם తో కూడిన ב యుద్ధ ప్రత్యర్థిని సూచిస్తుంది. తెలుగులో ‘శత్రువులతో యుద్ధం చేయడం’ సహజ ప్రయోగం; ఇది వారితో కలిసి యుద్ధం చేయడమనే అర్థాన్ని ఇవ్వదు.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: ఇక్కడ אֲדֹנִי దేవుని బిరుదు కాదు, మానవ రాజుకు గౌరవసూచక సంబోధన. ‘నా ప్రభువైన రాజు’ ఆ రాజసభా మర్యాదను నిలుపుతుంది.
theological_decisions:
- issue: ‘నా ప్రభువైన రాజు శత్రువులు’ అనే మాటలో ‘రాజు’ ఎవరిని సూచిస్తున్నాడనే ప్రశ్న
  choice: ఆకీషును గానీ మరొకరిని గానీ అనువాదంలో గుర్తించకుండా, దావీదు పలికిన గౌరవపూర్వక పదబంధాన్ని యథాతథంగా ఉంచడం
  alternative: ఇది ఆకీషును నేరుగా సూచిస్తుందని స్పష్టం చేయడం; లేదా దావీదు ఉద్దేశపూర్వకంగా ద్వంద్వార్థంతో మాట్లాడాడని తెలియజేయడం
  rationale: హీబ్రూ వాక్యం దావీదు అంతరంగ ఉద్దేశాన్ని నిర్ణయించదు. సందర్భంలోని కథన ఉద్వేగం, సంభావ్య ద్వంద్వార్థం నిలిచేలా సూచ్యార్థాన్ని నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజసన్నిధికి తగిన గౌరవపూర్వకమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నీ సేవకుడు’, ‘నా ప్రభువైన రాజు’ అనే మర్యాదా రూపాలను నిలిపి, అతిగా ప్రాచీనమైన పదప్రయోగాలను నివారించాం.
