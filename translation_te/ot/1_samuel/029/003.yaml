source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ שָׂרֵ֣י פְלִשְׁתִּ֔ים מָ֖ה הָ/עִבְרִ֣ים הָ/אֵ֑לֶּה וַ/יֹּ֨אמֶר אָכִ֜ישׁ אֶל שָׂרֵ֣י פְלִשְׁתִּ֗ים הֲ/לֽוֹא זֶ֨ה דָוִ֜ד עֶ֣בֶד שָׁא֣וּל מֶֽלֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הָיָ֤ה אִתִּ/י֙ זֶ֤ה יָמִים֙ אוֹ זֶ֣ה שָׁנִ֔ים וְ/לֹֽא מָצָ֤אתִי ב/וֹ֙ מְא֔וּמָה מִ/יּ֥וֹם נָפְל֖/וֹ עַד הַ/יּ֥וֹם הַ/זֶּֽה־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
translation:
  language: te
  text: 'అప్పుడు ఫిలిష్తీయుల సేనాధిపతులు, “ఈ హెబ్రీయుల సంగతి ఏమిటి?” అని అడిగారు. ఆకీషు ఫిలిష్తీయుల సేనాధిపతులతో ఇలా అన్నాడు: “ఇతడు ఇశ్రాయేలు రాజైన సౌలు సేవకుడు దావీదు కాదా? ఇతడు ఇన్ని రోజులుగానో, ఇన్ని సంవత్సరాలుగానో నా దగ్గర ఉన్నాడు. ఇతడు పక్షం మారి వచ్చిన రోజు మొదలుకొని[a] ఈ రోజు వరకు ఇతనికి వ్యతిరేకంగా నాకు ఏమీ కనిపించలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా, “అతడు పడిన రోజు మొదలుకొని.” ఈ సందర్భంలో అది అతడు పక్షం మారి వచ్చి చేరిన రోజును సూచించవచ్చు.
    reason: ‘పడడం’ అనే హీబ్రూ నుడికారానికి ఉన్న అక్షరార్థాన్ని, సందర్భార్థాన్ని రెండింటినీ చూపించి అసలు రూపకాన్ని మరుగుపరచకుండా ఉంచడం.
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల సేనాధిపతులు
  rationale: యుద్ధ సందర్భంలో שָׂרִים ఉన్నత స్థాయి సైనిక అధికారులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘సేనాధిపతులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מָה הָעִבְרִים הָאֵלֶּה
  choice: ఈ హెబ్రీయుల సంగతి ఏమిటి?
  rationale: మూలంలోని సంక్షిప్తమైన, అనుమానభరిత ప్రశ్నను ‘ఇక్కడ ఏం చేస్తున్నారు?’ అని అతిగా విస్తరించకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הָעִבְרִים
  choice: హెబ్రీయులు
  rationale: ఫిలిష్తీయుల దృష్టికోణంలో వాడిన జాతిపేరును ‘ఇశ్రాయేలీయులు’గా మార్చకుండా నిలుపుతుంది.
- source_word: הֲלוֹא
  choice: కాదా?
  rationale: అంగీకారాన్ని ఆశించే అలంకారిక ప్రశ్న స్వరాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֶבֶד
  choice: సేవకుడు
  rationale: ఇక్కడ దావీదుకు సౌలుతో ఉన్న రాజాస్థాన సంబంధాన్ని సూచిస్తుంది; ‘బానిస’ అనవసరమైన అర్థభారాన్ని కలిగిస్తుంది.
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  choice: ఇన్ని రోజులుగానో, ఇన్ని సంవత్సరాలుగానో
  rationale: ‘రోజులు లేదా సంవత్సరాలు’ అనే మూలంలోని అసాధారణమైన, కొంత అనిశ్చితమైన వ్యక్తీకరణను సున్నితంగా నిలుపుతుంది.
- source_word: מְאוּמָה
  choice: ఏమీ
  rationale: ‘ఏదీ/ఏమీ లేదు’ అనే విస్తృత అర్థాన్ని నిలుపుతూ, సందర్భానుసారంగా ‘వ్యతిరేకంగా’తో కలిపి ఆరోపణకు కారణమేదీ దొరకలేదనే భావాన్ని తెలుపుతుంది.
- source_word: מִיּוֹם נָפְלוֹ
  choice: ఇతడు పక్షం మారి వచ్చిన రోజు మొదలుకొని
  rationale: సైనిక-రాజకీయ సందర్భంలో נפל ఒకరి వైపుకు వచ్చి చేరడం లేదా పక్షం మారడాన్ని సూచించగలదు; తెలుగులో ఈ భావాన్ని స్పష్టంగా కానీ మితంగా వ్యక్తం చేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: మూలంలోని సాధారణ కాలవ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אָכִישׁ / דָוִד / שָׁאוּל
  choice: ఆకీషు / దావీదు / సౌలు
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన పేర్ల రూపాలను ఉపయోగించింది.
