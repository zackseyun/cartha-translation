  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త ప్రశ్నను, ‘రోజులుగానో—సంవత్సరాలుగానో’ అనే అసాధారణ కాలవ్యక్తీకరణను సాధ్యమైనంతవరకు నిలిపింది.
