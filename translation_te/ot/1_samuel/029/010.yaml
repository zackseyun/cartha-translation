translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవ/బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. మూలంలోని ‘ఉదయాన్నే లేవడం’ అనే పునరుక్తి మరియు ఏకవచనం నుంచి బహువచనానికి మార్పు సాధ్యమైనంతవరకు నిలుపబడ్డాయి; అసహజమైన హెబ్రీ వెలుగు-ప్రయోగానికి పాదటిప్పణి ఇవ్వబడింది.
