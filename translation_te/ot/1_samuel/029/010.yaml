revisions:
- from: కాబట్టి ఇప్పుడు, నువ్వూ నీతో వచ్చిన నీ యజమాని సేవకులూ ఉదయాన్నే లేవండి. మీరు ఉదయాన్నే లేచి, మీకు వెలుగు రాగానే వెళ్లిపోండి.[a]
  to: అయితే ఇప్పుడు, మీరు, మీతో వచ్చిన మీ యజమాని సేవకులు, ఉదయాన్నే లేవండి. మీరు ఉదయాన్నే లేచి, మీకు వెలుగు వచ్చినప్పుడు వెళ్లండి.[a]
  rationale: The revision uses a natural transitional marker, makes the public-register address internally consistent, retains the repeated early-morning instruction, and corrects the footnote so that it accurately represents the elliptical Hebrew expression without claiming an unwarranted literal wording.
