source:
  edition: WLC
  text: וְ/עַתָּה֙ הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/עַבְדֵ֥י אֲדֹנֶ֖י/ךָ אֲשֶׁר בָּ֣אוּ אִתָּ֑/ךְ וְ/הִשְׁכַּמְתֶּ֣ם בַּ/בֹּ֔קֶר וְ/א֥וֹר לָ/כֶ֖ם וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
translation:
  language: te
  text: అయితే ఇప్పుడు, మీరు, మీతో వచ్చిన మీ యజమాని సేవకులు, ఉదయాన్నే లేవండి. మీరు ఉదయాన్నే లేచి, మీకు వెలుగు వచ్చినప్పుడు వెళ్లండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు వెలుగు కనిపించగానే వెళ్లండి” లేదా “తెల్లవారగానే వెళ్లండి.” పదశః, “మరియు మీకు వెలుగు [ఉంది/కలుగుతుంది].”
    reason: וְאוֹר לָכֶם అనే సంక్షిప్త హెబ్రీ వాక్యభాగం వెలుగు కలిగే సమయాన్ని సూచిస్తుంది; దాని క్రియను సందర్భానుసారంగా పూరించాలి.
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ఇది వెంటనే ఇవ్వబోయే ఆదేశాన్ని ముందున్న సందర్భంతో అనుసంధానించే సంభాషణా సూచకం. ‘కాబట్టి ఇప్పుడు’ అనేది וְ అనే అనుసంధానాన్ని, עַתָּה అనే తక్షణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: ఉదయాన్నే లేవండి
  rationale: שׁכם హిఫిల్ రూపం తెల్లవారుజామున లేవడం లేదా త్వరగా బయలుదేరేందుకు సిద్ధపడడం అనే భావాన్ని ఇస్తుంది. בַּבֹּקֶרతో కలిపి ‘ఉదయాన్నే లేవండి’ సహజంగా ఉంది; మొదటి ఆజ్ఞ ఏకవచనంలో ఉన్నప్పటికీ, వెంటనే దావీదుతో పాటు అతని మనుషులు ప్రస్తావించబడటంతో తెలుగులో గౌరవ/బహువచన రూపం వాడబడింది.
- source_word: וְעַבְדֵי אֲדֹנֶיךָ אֲשֶׁר בָּאוּ אִתָּךְ
  choice: నువ్వూ నీతో వచ్చిన నీ యజమాని సేవకులూ
  rationale: אֲדֹנֶיךָ ఇక్కడ దేవుని బిరుదు కాదు; మానవ యజమానిని సూచిస్తుంది. సంబంధ వాక్యాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచి, దావీదును మరియు అతనితో వచ్చిన సేవకులను కలిపి చూపించాం.
- source_word: וְהִשְׁכַּמְתֶּם בַּבֹּקֶר
  choice: మీరు ఉదయాన్నే లేచి
  rationale: మూలంలో ఇక్కడ బహువచన రూపానికి మార్పు ఉంది. ఆ మార్పును ‘మీరు’ ద్వారా నిలిపి, మొదటి వాక్యంలోని పునరుక్తిని కూడా తొలగించలేదు.
- source_word: וְאוֹר לָכֶם
  choice: మీకు వెలుగు రాగానే
  rationale: పదశః ‘మీకు వెలుగు [ఉండగా/కలుగగా]’ అనే సంక్షిప్తమైన హెబ్రీ ప్రయోగం బయలుదేరే సమయాన్ని, అంటే వెలుగు వచ్చిన వేళను, సూచిస్తుంది. ‘మీకు’ అనే దత్తార్థ భావాన్ని నిలిపి సహజమైన తెలుగులో ఇచ్చాం.
- source_word: וָלֵכוּ
  choice: వెళ్లిపోండి
  rationale: הלך యొక్క బహువచన ఆజ్ఞ. ఈ సందర్భంలో శిబిరాన్ని విడిచి వెళ్లమనే భావం ఉన్నందున ‘వెళ్లిపోండి’ ప్రత్యక్షంగాను సహజంగాను ఉంది.
