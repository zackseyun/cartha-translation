  yaml_path: translation/ot/1_samuel/029/007.yaml
  text: So now[a], return and go in peace, and do not do evil in the eyes of the Philistine lords.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు వెనక్కి తిరిగి క్షేమంగా వెళ్లు; ఫిలిష్తీయుల అధిపతుల దృష్టిలో చెడ్డది[a] చేయకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫిలిష్తీయుల అధిపతులకు అభ్యంతరకరమైనది ఏదీ చేయకు.” హీబ్రూ నుడికారం వారు చెడ్డదిగా లేదా అంగీకారయోగ్యం కానిదిగా భావించేదాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ו అనే అనుసంధాన భావాన్నీ, עתה లోని ప్రస్తుతకాల/ముగింపు నిర్దేశ భావాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שׁוּב וְלֵךְ
  choice: తిరిగి ... వెళ్లు
  rationale: వరుసగా ఉన్న రెండు ఆజ్ఞారూపాల భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది; దావీదు సైన్యంతో వెళ్లకుండా వెనక్కి పంపబడుతున్న సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּשָׁלוֹם
  choice: క్షేమంగా
  rationale: ఈ సందర్భంలో సురక్షితంగా, ఎలాంటి విరోధం లేకుండా వెళ్లిపోవాలనే భావాన్ని సహజ తెలుగులో అందిస్తుంది; అక్షరార్థమైన ‘శాంతితో’ కంటే ప్రయాణ సందర్భానికి ఇది సరిపోతుంది.
- source_word: וְלֹא תַעֲשֶׂה רָע
  choice: చెడ్డది చేయకు
  rationale: עשה רע లోని నైతిక ప్రతికూలతను నిలుపుతూ, ‘హాని చేయకు’ అనే సంకుచిత అర్థానికి పరిమితం కాకుండా ఉంటుంది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: మూలంలోని ‘కళ్లలో’ అనే మూలభాషా నుడికారాన్ని తెలుగులో సహజమైన మూల్యాంకన నుడికారంగా ప్రతిబింబిస్తుంది.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల అధిపతులు
  rationale: ఫిలిష్తీయుల నగర-రాజ్యాల ఉన్నత పాలకులకు వాడిన ప్రత్యేక బిరుదును సాధారణ ‘పాలకులు’ కంటే గౌరవప్రదంగా, స్పష్టంగా తెలియజేస్తుంది.
