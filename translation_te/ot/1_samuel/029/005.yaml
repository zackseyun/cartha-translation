  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే అలంకారిక ప్రశ్న, గానంలోని సమాంతర నిర్మాణం, సంఖ్యల మధ్య వ్యత్యాసం నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
