source:
  edition: WLC
  text: הֲ/לוֹא זֶ֣ה דָוִ֔ד אֲשֶׁ֧ר יַעֲנוּ ל֛/וֹ בַּ/מְּחֹל֖וֹת לֵ/אמֹ֑ר הִכָּ֤ה שָׁאוּל֙ בַּֽ/אֲלָפָ֔י/ו וְ/דָוִ֖ד ב/רבבת/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/005.yaml
  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: te
  text: “నాట్యాలలో[a] ఒకరికొకరు పాడుకుంటూ, ‘సౌలు వేలమందిని హతమార్చాడు; దావీదు పదివేలమందిని హతమార్చాడు[b]’ అని ఎవరి గురించి పాడారో, అతడే ఈ దావీదు కాదా?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నాట్యాలలో అతని గురించి వారు ప్రత్యుత్తరంగా పాడారు.” ఇది ఒకరికి ఒకరు ప్రతిస్పందిస్తూ లేదా బృందాలుగా పాడడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “పదివేలు”; ఈ పదాన్ని “అనేక పదివేలు” లేదా “మిరియాదులు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא זֶה דָוִד
  choice: అతడే ఈ దావీదు కాదా?
  rationale: సమ్మతిని ఆశించే అలంకారిక ప్రశ్నను, దావీదును నొక్కి గుర్తించే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר יַעֲנוּ לוֹ
  choice: ఎవరి గురించి ... ఒకరికొకరు పాడుకుంటూ
  rationale: ענה అనే క్రియ ఇక్కడ నాట్యాల సందర్భంలో ప్రతిస్పందనాత్మక లేదా బృందగానాన్ని సూచిస్తుంది. לוֹ ను దావీదు గురించిన గానంగా తెలిపినా, మూలంలోని అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בַּמְּחֹלוֹת
  choice: నాట్యాలలో
  rationale: మూలంలోని ఉత్సవ నృత్యాల బహువచన రూపాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: యుద్ధగీత సందర్భంలో נכה శత్రువులను కొట్టి చంపడం లేదా సంహరించడం అనే భావాన్ని ఇస్తుంది; ‘హతమార్చాడు’ ఆ సైనిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בַּאֲלָפָיו
  choice: తన వేలమందిని
  rationale: ఇక్కడ ఉపసర్గతో కూడిన సంఖ్య ఓడించి హతమార్చిన వారి సంఖ్యను సూచిస్తుంది. తెలుగు కర్మరూపం సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְרִבְבֹתָיו
  choice: తన పదివేలమందిని
  rationale: רבבה యొక్క నిర్దిష్ట సంఖ్యార్థమైన ‘పది వేలు’ను నిలిపి, సౌలు వేలమందితో ఉన్న కవితాత్మక వ్యత్యాసాన్ని కాపాడుతుంది.
