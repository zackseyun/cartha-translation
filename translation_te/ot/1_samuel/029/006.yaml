source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אָכִ֜ישׁ אֶל דָּוִ֗ד וַ/יֹּ֣אמֶר אֵ֠לָי/ו חַי יְהוָ֞ה כִּי יָשָׁ֣ר אַתָּ֗ה וְ/ט֣וֹב בְּ֠/עֵינַ/י צֵאתְ/ךָ֨ וּ/בֹאֲ/ךָ֤ אִתִּ/י֙ בַּֽ/מַּחֲנֶ֔ה כִּ֠י לֹֽא מָצָ֤אתִֽי בְ/ךָ֙ רָעָ֔ה מִ/יּ֛וֹם בֹּאֲ/ךָ֥ אֵלַ֖/י עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בְ/עֵינֵ֥י הַ/סְּרָנִ֖ים לֹֽא ט֥וֹב אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
translation:
  language: te
  text: 'అప్పుడు ఆకీషు దావీదును పిలిచి అతనితో ఇలా అన్నాడు: “యెహోవా జీవం తోడు, నువ్వు యథార్థవంతుడివి. శిబిరంలో నాతో కలిసి నువ్వు వెళ్లడం, రావడం నా దృష్టికి మంచిదే[a]. నువ్వు నా దగ్గరికి వచ్చిన రోజు మొదలుకొని ఈ రోజు వరకు నీలో ఏ చెడూ నాకు కనిపించలేదు. అయితే ఫిలిష్తీయ పాలకుల[b] దృష్టిలో నువ్వు మంచివాడివి కావు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శిబిరంలో నాతో నీ ప్రవర్తన నా దృష్టికి నచ్చింది.” హీబ్రూలో అక్షరార్థంగా, “శిబిరంలో నాతో కలిసి నువ్వు వెళ్లడం, రావడం నా దృష్టికి మంచిది.”
    reason: lexical_alternative
  - marker: b
    text: “పాలకులు” అని అనువదించిన హీబ్రూ పదం ఫిలిష్తీయుల అధిపతులకు వాడే ప్రత్యేక బిరుదు.
    reason: cultural_note
  - marker: c
    text: లేదా, “ఫిలిష్తీయ పాలకుల దృష్టిలో నువ్వు ఆమోదయోగ్యుడివి కావు.”
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: యెహోవా జీవం తోడు
  rationale: హీబ్రూ ప్రమాణ సూత్రాన్ని సహజమైన, గంభీరమైన తెలుగు ప్రమాణ వ్యక్తీకరణగా అందిస్తుంది; దేవుని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: יָשָׁר
  choice: యథార్థవంతుడు
  rationale: నైతిక నిజాయితీ, నిష్కపటత అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: טוֹב בְּעֵינַי
  choice: నా దృష్టికి మంచిదే
  rationale: మూలంలోని ‘కళ్లలో/దృష్టిలో మంచి’ అనే మూల్యాంకన రూపకాన్ని నిలుపుతూ తెలుగులో చదవదగినదిగా ఉంది.
- source_word: צֵאתְךָ וּבֹאֲךָ
  choice: నువ్వు వెళ్లడం, రావడం
  rationale: మూలంలోని జంట వ్యక్తీకరణను నిలుపుతుంది; సందర్భంలో ఇది ప్రవర్తన లేదా కార్యకలాపాన్ని సూచించవచ్చని పాదసూచిక వివరిస్తుంది.
- source_word: אִתִּי בַּמַּחֲנֶה
  choice: శిబిరంలో నాతో కలిసి
  rationale: מַחֲנֶה యొక్క ప్రత్యక్ష అర్థమైన సైనిక శిబిరాన్ని సందర్భానుకూలంగా తెలియజేస్తుంది.
- source_word: לֹא מָצָאתִי בְךָ רָעָה
  choice: నీలో ఏ చెడూ నాకు కనిపించలేదు
  rationale: ‘నీ యందు చెడు కనుగొనలేదు’ అనే హీబ్రూ భావాన్ని సహజమైన తెలుగులో ఉంచి, నిందార్హత లేదా దుష్కార్యం అనే విస్తృతిని కాపాడుతుంది.
- source_word: הַסְּרָנִים
  choice: ఫిలిష్తీయ పాలకులు
  rationale: ఇది ఫిలిష్తీయుల ప్రత్యేక పాలక బిరుదు; ‘పాలకులు’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి, పాదసూచికలో బిరుదు స్వభావం తెలియజేయబడింది.
- source_word: לֹא טוֹב אָתָּה
  choice: నువ్వు మంచివాడివి కావు
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్తతను, కఠినత్వాన్ని నిలుపుతుంది; సందర్భార్థమైన ‘ఆమోదయోగ్యుడు కావు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని తెలుగులో స్థిరంగా పరిచితమైన వ్యక్తినామ రూపంలో ప్రతిలిపి చేస్తుంది; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
theological_decisions:
- issue: ఫిలిష్తీయ రాజు పలికిన ప్రమాణంలో יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో దైవనామమే ప్రత్యక్షంగా ఉంది. వక్త ఫిలిష్తీయుడైనప్పటికీ, పాఠంలోని నామాన్ని బిరుదుగా మార్చకుండా నిలుపబడింది.
- issue: לֹא טוֹב אָתָּה అనే తీర్పు యొక్క భావం
  choice: నువ్వు మంచివాడివి కావు
  alternative: నువ్వు వారికి ఆమోదయోగ్యుడివి కావు
  rationale: మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను ప్రధాన పాఠంలో కాపాడి, సందర్భానుసార భావాన్ని పాదసూచికలో అందించడం ద్వారా అస్పష్టతను బలవంతంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో, సంభాషణలో సహజమైన ఏకవచన సంబోధన ఉపయోగించబడింది. హీబ్రూ దృష్టి-రూపకం మరియు వెళ్లడం–రావడం అనే జంట వ్యక్తీకరణ ప్రధాన పాఠంలో సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
