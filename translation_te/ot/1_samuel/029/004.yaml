  to: 'కాని ఫిలిష్తీయుల సేనాధిపతులు అతనిపై కోపపడ్డారు. ఫిలిష్తీయుల సేనాధిపతులు అతనితో ఇలా అన్నారు: “ఈ మనిషిని వెనక్కి పంపు; నీవు అతనికి కేటాయించిన చోటుకు అతడు తిరిగి వెళ్లాలి. యుద్ధంలో అతడు మాకు విరోధిగా[a] మారకుండా, మాతో కలిసి యుద్ధానికి దిగకూడదు. ఈ మనిషి తన ప్రభువు అనుగ్రహాన్ని మళ్లీ ఎలా పొందగలడు[b]? ఆ మనుషుల తలలతోనే కదా?”'
