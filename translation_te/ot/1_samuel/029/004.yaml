source:
  edition: WLC
  text: וַ/יִּקְצְפ֨וּ עָלָ֜י/ו שָׂרֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֣אמְרוּ ל/וֹ֩ שָׂרֵ֨י פְלִשְׁתִּ֜ים הָשֵׁ֣ב אֶת הָ/אִ֗ישׁ וְ/יָשֹׁב֙ אֶל מְקוֹמ/וֹ֙ אֲשֶׁ֣ר הִפְקַדְתּ֣/וֹ שָׁ֔ם וְ/לֹֽא יֵרֵ֤ד עִמָּ֨/נוּ֙ בַּ/מִּלְחָמָ֔ה וְ/לֹא יִֽהְיֶה לָּ֥/נוּ לְ/שָׂטָ֖ן בַּ/מִּלְחָמָ֑ה וּ/בַ/מֶּ֗ה יִתְרַצֶּ֥ה זֶה֙ אֶל אֲדֹנָ֔י/ו הֲ/ל֕וֹא בְּ/רָאשֵׁ֖י הָ/אֲנָשִׁ֥ים הָ/הֵֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
translation:
  language: te
  text: 'కాని ఫిలిష్తీయుల సేనాధిపతులు అతనిపై కోపపడ్డారు. ఫిలిష్తీయుల సేనాధిపతులు అతనితో ఇలా అన్నారు: “ఈ మనిషిని వెనక్కి పంపు; నీవు అతనికి కేటాయించిన చోటుకు అతడు తిరిగి వెళ్లాలి. యుద్ధంలో అతడు మాకు విరోధిగా[a] మారకుండా, మాతో కలిసి యుద్ధానికి దిగకూడదు. ఈ మనిషి తన ప్రభువు అనుగ్రహాన్ని మళ్లీ ఎలా పొందగలడు[b]? ఆ మనుషుల తలలతోనే కదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం שָׂטָן (సాతాన్) అంటే ‘విరోధి’ లేదా ‘ప్రత్యర్థి’; ఇది ‘సాతాను’ అనే వ్యక్తినామం కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన ప్రభువుతో తిరిగి సయోధ్య చేసుకోగలడు?” ఈ హీబ్రూ వ్యక్తీకరణ తన పైఅధికారికి మళ్లీ ఆమోదయోగ్యుడవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  choice: అతనిపై కోపపడ్డారు
  rationale: קצף బలమైన కోపాన్ని సూచిస్తుంది. సందర్భానికి తగిన తీవ్రతను ఉంచుతూ ఆధునిక తెలుగులో సహజంగా ఉండే రూపం.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల సేనాధిపతులు
  rationale: యుద్ధ సందర్భంలో שָׂרִים రాజకీయ-సైనిక నాయకులను సూచిస్తుంది; ‘సేనాధిపతులు’ తక్షణ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָשֵׁב אֶת הָאִישׁ
  choice: ఈ మనిషిని వెనక్కి పంపు
  rationale: שוב హిఫీల్ ఆజ్ఞారూపం ‘తిరిగి వెళ్లేలా చేయు’ అనే కారణార్థాన్ని ఇస్తుంది; తెలుగులో ‘వెనక్కి పంపు’ సహజమైన ఆజ్ఞ.
- source_word: וְיָשֹׁב אֶל מְקוֹמוֹ
  choice: అతని స్థలానికి అతడు తిరిగి వెళ్లాలి
  rationale: ఆజ్ఞ తరువాత వచ్చే ఉద్దేశిత ఫలితాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר הִפְקַדְתּוֹ שָׁם
  choice: నీవు అతన్ని నియమించిన
  rationale: הפקיד ఇక్కడ నియమించడం లేదా ఒక చోట ఉంచడం అనే విస్తృత భావాన్ని కలిగి ఉంది; ‘నియమించిన’ ఆ భావాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: וְלֹא יֵרֵד עִמָּנוּ בַּמִּלְחָמָה
  choice: మాతో కలిసి యుద్ధానికి దిగకూడదు
  rationale: ירד యొక్క ‘దిగు’ రూపకాన్ని నిలుపుతూ, సైనిక కార్యాచరణలో చేరడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן
  choice: అతడు మాకు విరోధిగా మారకుండా
  rationale: שָׂטָן ఇక్కడ వ్యక్తినామం కాదు; సాధారణ నామవాచకంగా ప్రత్యర్థి లేదా విరోధి అనే అర్థం. ‘విరోధి’ ఆ అర్థాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  choice: ఈ మనిషి తన ప్రభువు అనుగ్రహాన్ని మళ్లీ ఎలా పొందగలడు
  rationale: హిత్పయేల్ రూపం తన పైఅధికారికి మళ్లీ ఆమోదయోగ్యుడవడం, అనుగ్రహం పొందడం లేదా సయోధ్య చేసుకోవడం అనే భావాన్ని ఇస్తుంది. ప్రధాన పాఠంలో సందర్భోచితమైన ‘అనుగ్రహాన్ని మళ్లీ పొందడం’ వాడి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲדֹנָיו
  choice: తన ప్రభువు
  rationale: ఇక్కడ దావీదు పైఅధికారిగా ఉన్న సౌలును సూచిస్తుంది. ‘ప్రభువు’ రాజకీయ విధేయత సంబంధాన్ని గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  choice: ఈ మనుషుల తలలతోనే కదా?
  rationale: హీబ్రూ వాక్యం ఉద్దేశపూర్వకంగా సంక్షిప్తంగా ఉంది; ఫిలిష్తీయుల తలలను ఇచ్చి సౌలు అనుగ్రహాన్ని పొందడం అనే భావాన్ని వివరించి విస్తరించకుండా, దాని ఘాటైన అలంకార ప్రశ్నను నిలుపుతుంది.
theological_decisions:
- issue: שָׂטָן యొక్క అర్థం
  choice: సాధారణ నామవాచకమైన ‘విరోధి’
  alternative: వ్యక్తినామమైన ‘సాతాను’
  rationale: ఈ చారిత్రక కథనంలో ఈ పదం యుద్ధంలో ఎదురుతిరిగే ప్రత్యర్థిని సూచిస్తుంది. ‘సాతాను’ అని వ్యక్తినామంగా అనువదిస్తే మూలపాఠం చేయని దయ్యశాస్త్ర సంబంధమైన వాదనను చేర్చినట్లవుతుంది.
- issue: יִתְרַצֶּה యొక్క భావవ్యాప్తి
  choice: తన ప్రభువు అనుగ్రహాన్ని మళ్లీ పొందడం
  alternative: తన ప్రభువుతో తిరిగి సయోధ్య చేసుకోవడం
  rationale: రెండు భావాలూ హీబ్రూ రూపానికి సాధ్యమే. సందర్భంలో పైఅధికారి ఆమోదాన్ని తిరిగి పొందడం ప్రధాన భావం; ప్రతిబింబకమైన సయోధ్య భావాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని ‘సేనాధిపతులు’ అనే పునరుక్తిని నిలిపి రెండు తెలుగు వాక్యాలుగా విభజించాం. సైనిక సందర్భంలోని ‘యుద్ధానికి దిగడం’ అనే రూపకాన్ని కాపాడాం; చివరి అలంకార ప్రశ్నలోని సంక్షిప్తతను వివరణతో నింపకుండా అలాగే ఉంచాం.
