  yaml_path: translation/ot/1_samuel/029/002.yaml
  text: And the lords of the Philistines were passing by by hundreds and by thousands[a], and David and his men were passing by at the rear with Achish.
translation:
  language: te
  text: ఫిలిష్తీయుల అధిపతులు వందల చొప్పున, వేల చొప్పున[a] సాగిపోతున్నారు. దావీదు, అతని మనుషులు ఆకీషుతో కలిసి వెనుక భాగంలో సాగిపోతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, వందలు మరియు వేల మందితో కూడిన సైనిక విభాగాలుగా.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: అధిపతులు
  rationale: ఫిలిష్తీయ పట్టణ-రాజ్యాల ఉన్నత రాజకీయ, సైనిక పాలకులను సూచించే పదం. ఆధునిక తెలుగులో ‘అధిపతులు’ వారి అధికార హోదాను సహజంగా తెలియజేస్తుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహానికి తెలుగులో స్థిరపడిన బైబిలు పేరు.
- source_word: עֹבְרִים
  choice: సాగిపోతున్నారు
  rationale: హీబ్రూ వర్తమాన కృదంతం ఊరేగింపు లేదా సైనిక కవాతులో కొనసాగుతున్న కదలికను చిత్రిస్తుంది; ‘సాగిపోతున్నారు’ ఆ దృశ్యాత్మక కొనసాగింపును సహజ తెలుగులో నిలుపుతుంది.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: వందలుగా, వేలుగా
  rationale: వందలు, వేలుగా ఏర్పాటైన సైనిక విభాగాలను సూచించే అవకాశం ఉంది. అయితే మూలంలోని సంక్షిప్తత, కొంత అస్పష్టత నిలిచేలా ప్రధాన పాఠంలో ‘వందలుగా, వేలుగా’ అని ఇచ్చి, సైనిక విభాగాల భావాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: אֲנָשָׁיו
  choice: అతని మనుషులు
  rationale: దావీదుతో ఉన్న పురుష సహచరులు లేదా పోరాట యోధులను సూచిస్తుంది. ‘సైనికులు’ అని పరిమితం చేయకుండా, సందర్భానికి సహజమైన ‘అతని మనుషులు’ ఉపయోగించాం.
- source_word: בָּאַחֲרֹנָה
  choice: అందరికంటే వెనుకగా
  rationale: ఊరేగింపు లేదా కవాతులో చివరి, వెనుక భాగంలోని స్థానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עִם אָכִישׁ
  choice: ఆకీషుతో కలిసి
  rationale: సాధారణ సహవాసాన్ని తెలిపే עִם భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
