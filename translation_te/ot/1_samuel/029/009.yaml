id: 1SA.29.9
reference: 1 Samuel 29:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַן אָכִישׁ֮ וַ/יֹּ֣אמֶר אֶל דָּוִד֒ יָדַ֕עְתִּי כִּ֣י ט֥וֹב אַתָּ֛ה בְּ/עֵינַ֖/י כְּ/מַלְאַ֣ךְ אֱלֹהִ֑ים אַ֣ךְ שָׂרֵ֤י פְלִשְׁתִּים֙ אָֽמְר֔וּ לֹֽא יַעֲלֶ֥ה עִמָּ֖/נוּ בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
translation:
  language: te
  text: 'ఆకీషు దావీదుకు జవాబిస్తూ ఇలా అన్నాడు: “నీవు నా దృష్టికి మంచివాడివని, దేవుని దూత[a] లాంటి వాడివని నాకు తెలుసు. అయితే ఫిలిష్తీయుల సేనాధిపతులు, ‘ఇతడు మనతో కలిసి యుద్ధానికి వెళ్లకూడదు’ అని చెప్పారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి ‘సందేశకుడు’ లేదా ‘దైవదూత’ అనే రెండు అర్థాలు ఉండవచ్చు. ఈ ప్రయోగంలో ‘దైవదూత’ అనే భావం మరింత సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: జవాబిస్తూ ఇలా అన్నాడు
  rationale: హీబ్రూ సంభాషణ సూత్రంలోని ‘జవాబిచ్చి అన్నాడు’ అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: ఇక్కడ పరిపూర్ణ క్రియ ఆకీషు కలిగివున్న స్థిరమైన ప్రస్తుత అభిప్రాయాన్ని సూచిస్తుంది.
- source_word: טוֹב אַתָּה בְּעֵינַי
  choice: నీవు నా దృష్టికి మంచివాడివి
  rationale: ‘నా కళ్లలో’ అనే హీబ్రూ మూలరూపాన్ని కృత్రిమంగా అనిపించకుండా, ‘నా దృష్టికి’ అనే తెలుగు జాతీయంతో విస్తృతమైన అనుకూల అంచనాను నిలుపుతుంది.
- source_word: כְּמַלְאַךְ אֱלֹהִים
  choice: దేవుని దూత లాంటి వాడివి
  rationale: מַלְאָךְ అనే పదంలోని ‘దూత/దైవదూత’ భావసాధ్యతను తెలుగు ‘దూత’ నిలుపుతుంది; పోలిక మాత్రమేనని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אַךְ
  choice: అయితే
  rationale: ఆకీషు వ్యక్తిగత అభిప్రాయానికి ఫిలిష్తీయ సేనాధిపతుల నిర్ణయానికి మధ్య ఉన్న వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల సేనాధిపతులు
  rationale: యుద్ధ సందర్భంలో שָׂרֵי అనే పదం పాలక-సైనిక నాయకులను సూచిస్తుంది; ‘సేనాధిపతులు’ సందర్భానికి స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: לֹא יַעֲלֶה עִמָּנוּ בַּמִּלְחָמָה
  choice: ఇతడు మనతో కలిసి యుద్ధానికి వెళ్లకూడదు
  rationale: నివేదిత వాక్యంలో ఉన్న నిషేధాత్మక నిర్ణయాన్ని ‘వెళ్లకూడదు’ స్పష్టంగా తెలియజేస్తుంది. עלה యొక్క సైనిక దండయాత్రలో చేరే సందర్భార్థాన్ని ‘యుద్ధానికి వెళ్లడం’ సహజంగా అందిస్తుంది.
theological_decisions:
- issue: כְּמַלְאַךְ אֱלֹהִים లోని מַלְאַךְ అర్థం
  choice: ‘దేవుని దూత’గా అనువదించి, ఇది దావీదు గురించి ఆకీషు చేసిన ఉన్నతమైన పోలికగానే ఉంచడం
  alternative: ‘దేవుని సందేశకుడు’ లేదా స్పష్టంగా ‘దేవదూత’
  rationale: హీబ్రూ పదం మానవ సందేశకుడినీ పరలోక దూతనూ సూచించగలదు. ఈ స్థిరమైన ప్రయోగంలో పరలోక దూత భావం సహజమైనదైనా, తెలుగు ‘దూత’ మూలంలోని అర్థవిస్తృతిని కాపాడుతుంది; దావీదు స్వరూపం గురించి అదనపు తాత్త్విక నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా దాని సంభాషణ క్రమం, వ్యత్యాసం, నిషేధ బలం కాపాడబడ్డాయి.
