translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలో ప్రత్యేకమైన ‘ఇప్పుడు’ అనే కాలసూచక పదం లేనందున వాక్యారంభంలో అలాంటి పదాన్ని చేర్చలేదు. రెండు సమకాలీన సైనిక స్థితులను సెమికోలన్‌తో స్పష్టంగా అనుసంధానించాం.
