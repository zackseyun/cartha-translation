reference: 1 Samuel 29:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְבְּצ֧וּ פְלִשְׁתִּ֛ים אֶת כָּל מַחֲנֵי/הֶ֖ם אֲפֵ֑קָ/ה וְ/יִשְׂרָאֵ֣ל חֹנִ֔ים בַּ/עַ֖יִן אֲשֶׁ֥ר בְּ/יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/001.yaml
  text: The Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
translation:
  language: te
  text: ఫిలిష్తీయులు తమ శిబిరాలన్నిటినీ[a] ఆఫెకులో సమకూర్చారు; ఇశ్రాయేలు యెజ్రెయేలులోని నీటి ఊట దగ్గర[b] మకాం వేసి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ దళాలన్నిటినీ’ లేదా ‘తమ సైన్యాలన్నిటినీ’; హీబ్రూ మూలంలో అక్షరార్థంగా ‘తమ శిబిరాలన్నిటినీ’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీటి బుగ్గ దగ్గర’; హీబ్రూ పదం సహజంగా ఉబికివచ్చే ఊటను లేదా బుగ్గను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  choice: సమకూర్చారు
  rationale: קבץ అనే క్రియ ఇక్కడ సైనిక సమూహాలను ఒకచోట చేర్చడాన్ని సూచిస్తుంది. ‘సమకూర్చారు’ అనేది సైనిక విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ప్రజాసమూహపు పేరుకు ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: כָּל מַחֲנֵיהֶם
  choice: తమ శిబిరాలన్నిటినీ
  rationale: מַחֲנֶה యొక్క ప్రాథమిక అర్థం ‘శిబిరం’ లేదా ‘మకాం.’ సైనిక సందర్భంలో దళాలను కూడా సూచించగలిగినా, ‘శిబిరాలు’ మూలపదానికి దగ్గరగా ఉండి దాని బహువచన రూపాన్ని నిలుపుతుంది.
- source_word: אֲפֵקָה
  choice: ఆఫెకులో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించాం. దిశను సూచించే చివరి ה ఇక్కడ గమ్యస్థానంలో సైన్యాలు కూడిన భావాన్ని ఇస్తున్నందున సహజమైన తెలుగులో ‘ఆఫెకులో’ అని ఇచ్చాం.
- source_word: וְיִשְׂרָאֵל חֹנִים
  choice: ఇశ్రాయేలు … మకాం వేసి ఉంది
  rationale: ఈ వాక్యభాగం మొదటి చర్యకు సమకాలీనమైన నేపథ్య పరిస్థితిని తెలియజేస్తుంది. ‘ఇశ్రాయేలు’ సమష్టివాచకంగా ఉన్నందున తెలుగులో ఏకవచన అన్వయం సహజంగా ఉంది.
- source_word: בַּעַיִן
  choice: నీటి ఊట దగ్గర
  rationale: עַיִן ఇక్కడ సహజంగా ఉబికివచ్చే నీటి ఊటను సూచిస్తుంది. శరీరంలోని ‘కన్ను’ అనే మరో అర్థం ఈ భౌగోళిక సందర్భానికి సరిపోదు.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: యెజ్రెయేలులోని
  rationale: సంబంధ వాక్యాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా మార్చి, ఊట ఉన్న ప్రదేశాన్ని నేరుగా తెలిపాం.
