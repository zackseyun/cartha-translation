translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని ఉదయకాల ప్రాధాన్యాన్ని నిలిపి, హీబ్రూ ఉద్దేశార్థక క్రియల పునరుక్తిని తెలుగులో సులభంగా మలిచాం. ‘పైకి వెళ్లారు’ అనే హీబ్రూ నుడికారంలోని భౌగోళిక లేదా సైనిక ఛాయను పాదటిప్పణిలో సంరక్షించాం.
