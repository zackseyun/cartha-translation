source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם דָּוִ֜ד ה֤וּא וַֽ/אֲנָשָׁי/ו֙ לָ/לֶ֣כֶת בַּ/בֹּ֔קֶר לָ/שׁ֖וּב אֶל אֶ֣רֶץ פְּלִשְׁתִּ֑ים וּ/פְלִשְׁתִּ֖ים עָל֥וּ יִזְרְעֶֽאל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
translation:
  language: te
  text: కాబట్టి దావీదూ అతని మనుషులూ వేకువనే లేచి, ఉదయాన ఫిలిష్తీయుల దేశానికి తిరిగి వెళ్లడానికి బయలుదేరారు.[a] ఫిలిష్తీయులు యెజ్రెయేలుకు పైకి వెళ్లారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “దావీదూ అతని మనుషులూ ఉదయాన వెళ్లి ఫిలిష్తీయుల దేశానికి తిరిగి రావడానికి వేకువనే లేచారు.”'
    reason: lexical_alternative
  - marker: b
    text: “పైకి వెళ్లారు” అనేది ఒక స్థలానికి వెళ్లడాన్ని సూచించే హీబ్రూ నుడికారం; సందర్భానుసారం “యెజ్రెయేలుకు దండుగా వెళ్లారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: తెల్లవారుజామునే లేచి
  rationale: שׁכם హిఫిల్ రూపం సాధారణంగా పొద్దున్నే లేవడం లేదా త్వరగా బయలుదేరడం సూచిస్తుంది. తెలుగు వాక్యంలో కాలప్రాధాన్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: הוּא וַאֲנָשָׁיו
  choice: దావీదు, అతనితో ఉన్న మనుషులు
  rationale: ఇది దావీదుతో ఉన్న అతని యోధబృందాన్ని సూచిస్తుంది; సేవకులు అనే అర్థాన్ని అనవసరంగా చేర్చకుండా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לָלֶכֶת בַּבֹּקֶר לָשׁוּב
  choice: తిరిగి వెళ్లడానికి బయలుదేరారు
  rationale: రెండు హీబ్రూ క్రియారూపాలు ఉదయాన బయలుదేరి తిరిగి వెళ్లే ఉద్దేశాన్ని సూచిస్తాయి. తెలుగులో అనవసర పునరుక్తి లేకుండా కదలికతో పాటు ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల దేశానికి
  rationale: אֶרֶץ అనే స్పష్టమైన ‘దేశం/భూభాగం’ భావాన్ని, జాతిపేరును యథాతథంగా నిలుపుతుంది.
- source_word: עָלוּ
  choice: వెళ్లారు
  rationale: עלה అక్షరార్థంగా ‘పైకి వెళ్లారు’; ఇక్కడ స్థలానికి సైనిక కదలికను సూచించే హీబ్రూ వాడుక. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు కోసం ‘వెళ్లారు’ అని ఇచ్చి, ప్రత్యేక నుడికారాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יִזְרְעֶאל
  choice: యెజ్రెయేలు
  rationale: హీబ్రూ స్థలనామానికి తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
