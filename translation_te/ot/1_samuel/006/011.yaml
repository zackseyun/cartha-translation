source:
  edition: WLC
  text: וַ/יָּשִׂ֛מוּ אֶת אֲר֥וֹן יְהוָ֖ה אֶל הָ/עֲגָלָ֑ה וְ/אֵ֣ת הָ/אַרְגַּ֗ז וְ/אֵת֙ עַכְבְּרֵ֣י הַ/זָּהָ֔ב וְ/אֵ֖ת צַלְמֵ֥י טְחֹרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
translation:
  language: te
  text: అప్పుడు వారు యాహ్వే మందసాన్ని బండి మీద, అలాగే ఆ పెట్టెను, బంగారు ఎలుకలను, వారి గడ్డల ప్రతిరూపాలను ఉంచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి వాపుల ప్రతిరూపాలను’; బహుశా, ‘వారి మూలవ్యాధి వాపుల ప్రతిరూపాలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: అప్పుడు వారు … ఉంచారు
  rationale: వయ్యిక్టోల్ రూపం కథనాన్ని తదుపరి చర్యకు తీసుకెళ్తుంది; ‘అప్పుడు’ వరుసక్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲרוֹן יְהוָה
  choice: యాహ్వే మందసం
  rationale: ఈ సందర్భంలో אֲרוֹן ఆరాధనకు సంబంధించిన స్థిరమైన పవిత్ర వస్తువు; ‘మందసం’ దాన్ని సాధారణ పెట్టె నుండి వేరుచేస్తుంది. יהוה అనే వ్యక్తిగత దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אֶל הָעֲגָלָה
  choice: బండి మీద
  rationale: వాహనం లేదా వేదికపై ఉంచడాన్ని తెలుగులో సహజంగా ‘బండి మీద’ అంటారు.
- source_word: הָאַרְגַּז
  choice: ఆ పెట్టె
  rationale: ఇది అపరాధ పరిహార అర్పణ ప్రతిరూపాలను ఉంచిన వేరొక పాత్ర; ‘పెట్టె’ అనడం మందసంతో గందరగోళాన్ని నివారిస్తుంది.
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: బంగారు ఎలుకలు
  rationale: ‘బంగారంతో చేసిన ఎలుకలు’ అనే పదార్థార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: צַלְמֵי
  choice: ప్రతిరూపాలు
  rationale: צֶלֶם ఇక్కడ వ్యాధిగ్రస్త భాగాలను సూచించేలా తయారుచేసిన నమూనాలు లేదా రూపాలను సూచిస్తుంది; ‘ప్రతిరూపాలు’ సందర్భానికి సరిపోతుంది.
- source_word: טְחֹרֵיהֶם
  choice: వారి కణుతులు
  rationale: మూలపదం వాపులు లేదా గడ్డలను సూచిస్తుంది; ఖచ్చితమైన వైద్య నిర్ధారణ వివాదాస్పదమైనందున సాధారణమైన ‘కణుతులు’ను ఎంచుకున్నాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమైన చతురక్షరి నామం ప్రత్యక్షంగా ఉంది. బిరుదుతో భర్తీ చేయకుండా దాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- issue: טְחֹרֵיהֶם యొక్క వ్యాధి సూచన
  choice: కణుతులు
  alternative: వాపులు; మూలవ్యాధి వాపులు
  rationale: పదం యొక్క ఖచ్చితమైన వైద్య సూచన అనిశ్చితంగా ఉంది. ప్రధాన పాఠంలో విస్తృతార్థాన్ని ఉంచి, మరింత నిర్దిష్టమైన అవకాశాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. ‘మందసం’ మరియు ‘పెట్టె’ మధ్య పదభేదాన్ని స్పష్టంగా నిలిపాం. ప్రధాన పాఠంలో వైద్యార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా మూలంలోని అనిశ్చితిని పాదసూచికతో కాపాడాం.
