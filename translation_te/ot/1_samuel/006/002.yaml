id: 1SA.6.2
reference: 1 Samuel 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרְא֣וּ פְלִשְׁתִּ֗ים לַ/כֹּהֲנִ֤ים וְ/לַ/קֹּֽסְמִים֙ לֵ/אמֹ֔ר מַֽה נַּעֲשֶׂ֖ה לַ/אֲר֣וֹן יְהוָ֑ה הוֹדִעֻ֕/נוּ בַּ/מֶּ֖ה נְשַׁלְּחֶ֥/נּוּ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
translation:
  language: te
  text: అప్పుడు ఫిలిష్తీయులు యాజకులను, దైవజ్ఞులను పిలిపించి, “యెహోవా మందసాన్ని ఏమి చేద్దాం? దాన్ని దాని స్థానానికి దేనితో పంపాలో[a] మాకు చెప్పండి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో ‘దేనితో పంపాలో’ అని ఉంది; దీనిని ‘ఏ విధంగా పంపాలో’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: ‘בַּמֶּה’ అనేది పంపే సాధనం లేదా వెంట పంపే వస్తువును, విస్తృతంగా పంపే విధానాన్ని సూచించగల భావసందిగ్ధతను నిలుపుటకు.
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: పిలిపించి
  rationale: ఇక్కడ క్రియ నిపుణులను సలహా కోసం రప్పించడాన్ని సూచిస్తుంది; ‘పిలిపించి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: לַכֹּהֲנִים
  choice: యాజకులను
  rationale: హీబ్రూ పదం ఆరాధనా విధులు నిర్వహించే అధికారులను సూచిస్తుంది; వారు ఫిలిష్తీయుల యాజకులని సందర్భమే స్పష్టం చేస్తుంది.
- source_word: וְלַקֹּסְמִים
  choice: దైవజ్ఞులను
  rationale: קֹסְמִים దైవజ్ఞానం లేదా శకునవిచారణ ద్వారా సూచనలు చెప్పేవారిని సూచిస్తుంది; ‘దైవజ్ఞులు’ సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక పదం.
- source_word: מַה נַּעֲשֶׂה
  choice: ఏమి చేద్దాం?
  rationale: మొదటి పురుష బహువచనంలో ఉన్న సంప్రదింపుతో కూడిన ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַאֲרוֹן יְהוָה
  choice: యెహోవా మందసాన్ని
  rationale: ל ప్రస్తుత ప్రశ్నలో ‘మందసాన్ని ఏమి చేద్దాం?’ అనే తెలుగు నిర్మాణంతో సహజంగా వ్యక్తమవుతుంది; אָרוֹן‌కు బైబిలు సందర్భంలో స్థిరమైన తెలుగు పదం ‘మందసం’.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: הוֹדִיעֻנוּ
  choice: మాకు చెప్పండి
  rationale: ‘మాకు తెలియజేయండి’ అనే మూల భావాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בַּמֶּה
  choice: దేనితో
  rationale: హీబ్రూలోని ‘దేనితో/ఏ సాధనంతో’ అనే పదప్రయోగాన్ని నిలుపుతుంది; కేవలం ‘ఎలా’ అని అనువదించడం వల్ల సాధనం లేదా వెంట పంపే వస్తువు అనే భావం కనుమరుగయ్యే అవకాశం ఉంది.
- source_word: נְשַׁלְּחֶנּוּ
  choice: దాన్ని ... పంపాలో
  rationale: సలహా కోరుతున్న సందర్భంలోని ఉద్దేశిత చర్యను తెలుగులో సహజమైన పరోక్ష ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: לִמְקוֹמוֹ
  choice: దాని స్థానానికి
  rationale: సర్వనామ ప్రత్యయం మందసాన్ని సూచిస్తుంది. సందర్భంలో తిరిగి పంపడం భావమైనా, మూలంలో లేని ‘తిరిగి’ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది; దాన్ని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: ఫిలిష్తీయుల మతాధికారుల గుర్తింపు
  choice: యాజకులు, దైవజ్ఞులు
  alternative: ఫిలిష్తీయుల యాజకులు, శకునాలు చెప్పేవారు
  rationale: మూలపాఠ్యం రెండు వర్గాలను పేర్కొంటుంది గాని అదనపు మతపరమైన వివరణ ఇవ్వదు. అందువల్ల వారిని ఇశ్రాయేలీయుల అధికారులుగా భావింపజేయకుండా, అదే సమయంలో మూలంలో లేని విశేషణాలను చేర్చకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, కథనానికి తగిన గౌరవప్రదమైన శైలి. ‘మందసం’, ‘యాజకులు’, ‘దైవజ్ఞులు’ వంటి సంక్షిప్త పదాలను ఉపయోగిస్తూ వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం. పాదసూచిక గుర్తు [a] సంబంధిత ‘దేనితో పంపాలో’ పదబంధం వెంట ఉంచబడింది.
