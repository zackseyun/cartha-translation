lexical_decisions:
- source_word: וַ/חֲמִשָּׁה
  choice: ఐదుగురు
  rationale: వ్యక్తులను సూచించే సంఖ్యకు సహజమైన ఆధునిక తెలుగు రూపం; సందర్భంలో తెలిసిన ఐదుగురు పాలకులనే సూచిస్తుంది.
- source_word: סַרְנֵי
  choice: పాలకులు
  rationale: ఫిలిష్తీయ పట్టణాలపై అధికారమున్నవారి ప్రత్యేక బిరుదును ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘ప్రభువులు’ కంటే రాజకీయ అధికార భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు షష్ఠీ రూపంలో అందిస్తుంది.
- source_word: רָאוּ
  choice: అది చూసి
  rationale: హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా, ముందుగా జరిగినదానిని సూచించే కర్మను తెలుగు వాక్య సహజత్వం కోసం ‘అది’గా అందించింది.
- source_word: וַ/יָּשֻׁבוּ
  choice: తిరిగి వెళ్లారు
  rationale: కథన క్రమంలోని שוב క్రియకు సందర్భానుకూలమైన, సహజమైన తెలుగు రూపం.
- source_word: עֶקְרוֹן
  choice: ఎక్రోనుకు
  rationale: గమ్యస్థానాన్ని తెలుగులో దత్తివిభక్తితో సహజంగా వ్యక్తం చేసింది.
- source_word: בַּ/יּוֹם הַ/הוּא
  choice: అదే రోజు
  rationale: అక్షరార్థమైన ‘ఆ రోజున’కు సమీపంగా ఉంటూనే, వారు అదే దినంలో తిరిగిన తక్షణ కాలసూచనను సహజంగా తెలియజేస్తుంది.
