translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ఫిలిష్తీయ అధికార బిరుదుకు ‘పాలకులు’ వాడబడింది; కర్మరహిత ‘చూశారు’ను సందర్భానుసారంగా ‘అది చూసి’గా సహజీకరించబడింది.
