revisions:
- from: అప్పుడు వారు కిర్యత్-యెయారీము నివాసుల దగ్గరికి దూతలను పంపి, “ఫిలిష్తీయులు యాహ్వే మందసాన్ని తిరిగి తీసుకొచ్చారు. మీరు దిగివచ్చి, దాన్ని మీ దగ్గరికి పైకి తీసుకెళ్లండి[a]” అని చెప్పించారు.
