id: 1SA.6.21
reference: 1 Samuel 6:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים אֶל יוֹשְׁבֵ֥י קִרְיַת יְעָרִ֖ים לֵ/אמֹ֑ר הֵשִׁ֤בוּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן יְהוָ֔ה רְד֕וּ הַעֲל֥וּ אֹת֖/וֹ אֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
translation:
  language: te
  text: 'అప్పుడు వారు కిర్యత్-యెయారీము నివాసుల దగ్గరికి దూతలను పంపి ఇలా తెలియజేశారు: “ఫిలిష్తీయులు యాహ్వే మందసాన్ని తిరిగి తీసుకొచ్చారు. మీరు దిగివచ్చి, దాన్ని మీ దగ్గరికి పైకి తీసుకెళ్లండి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దిగి వెళ్లి, దాన్ని మీ దగ్గరికి పైకి తీసుకెళ్లండి.” హీబ్రూలో అక్షరార్థంగా ‘దిగండి … పైకి తీసుకెళ్లండి’ అనే భౌగోళిక క్రియలు ఉన్నాయి; అవి బేత్-షెమెషు, కిర్యత్-యెయారీము మధ్యనున్న భూభాగపు ఎత్తుపల్లాలను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: అప్పుడు వారు ... పంపి
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ వరుస సంఘటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఇక్కడ మనుషుల ద్వారా పంపిన వార్తాహరులే ఉద్దేశం; సందర్భంలో ‘దూతలు’ స్పష్టంగా ఆ భావాన్నే ఇస్తుంది.
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  choice: కిర్యత్-యెయారీము నివాసుల దగ్గరికి
  rationale: ‘నివాసులు’ అనే పదం హీబ్రూ కృదంత నిర్మాణంలోని ‘అక్కడ నివసించేవారు’ అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది; స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: לֵאמֹר
  choice: అని చెప్పించారు
  rationale: దూతలను పంపి వారి ద్వారా సందేశం చెప్పించిన భావాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: הֵשִׁיבוּ
  choice: తిరిగి తీసుకొచ్చారు
  rationale: שׁוב హిఫీల్ రూపం ‘తిరిగి వచ్చేలా చేయడం/తిరిగి తీసుకురావడం’ అని అర్థం. పూర్తయిన చర్యను ఇది స్పష్టంగా తెలుపుతుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: జనసమూహపు పేరును మూలభాషకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֲרוֹן יְהוָה
  choice: యాహ్వే మందసాన్ని
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా నిలిపి, אֲרוֹן‌కు గౌరవప్రదమైన సాధారణ తెలుగు ‘మందసం’ వాడాం; మూలంలో లేని ‘ఒడంబడిక’ను చేర్చలేదు.
- source_word: רְדוּ
  choice: దిగివచ్చి
  rationale: ירד ఆజ్ఞారూపంలోని దిగువకు కదలికను నిలిపి, పిలుస్తున్న వారి దృష్టికోణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  choice: దాన్ని మీ దగ్గరికి పైకి తీసుకెళ్లండి
  rationale: עלה హిఫీల్‌లోని ‘పైకి తీసుకెళ్లడం’ అనే భౌగోళిక భావాన్నీ, אֲלֵיכֶם లోని ‘మీ దగ్గరికి’ అనే గమ్యాన్నీ రెండింటినీ నిలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: పాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, మూలంలోని చతురక్షర నామాన్ని ఆధునిక తెలుగు లిపిలో లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని వాడుతూ, ‘దిగు/పైకి తీసుకెళ్లు’ అనే మూలపాఠంలోని భౌగోళిక వ్యత్యాసాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. భాష సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదంగా ఉంది.
