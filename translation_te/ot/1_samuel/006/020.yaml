source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אַנְשֵׁ֣י בֵֽית שֶׁ֔מֶשׁ מִ֚י יוּכַ֣ל לַ/עֲמֹ֔ד לִ/פְנֵ֨י יְהוָ֧ה הָ/אֱלֹהִ֛ים הַ/קָּד֖וֹשׁ הַ/זֶּ֑ה וְ/אֶל מִ֖י יַעֲלֶ֥ה מֵ/עָלֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
translation:
  language: te
  text: అప్పుడు బేత్షెమెషు మనుషులు, “యాహ్వే అనే ఈ పరిశుద్ధ దేవుని ఎదుట ఎవరు నిలబడగలరు? మా దగ్గరనుండి ఎవరి దగ్గరికి వెళ్లాలి?[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది మా దగ్గరనుండి ఎవరి దగ్గరికి వెళ్లాలి?” ఇక్కడ ‘అది’ బహుశా యాహ్వే మందసాన్ని సూచిస్తుంది.
    reason: יַעֲלֶה అనే క్రియకు కర్త మూలపాఠ్యంలో స్పష్టంగా లేదు; సందర్భం మందసాన్ని సూచించే అవకాశముంది.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు ... అన్నారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: బేత్-షెమెషు మనుషులు
  rationale: אַנְשֵׁי అనే పురుష బహువచన రూపాన్ని సాధారణ ‘ప్రజలు’గా మార్చకుండా, పట్టణపు మనుషులను సూచించేలా అనువదించాం.
- source_word: מִי יוּכַל לַעֲמֹד לִפְנֵי
  choice: ఎవరు ... ఎదుట నిలబడగలరు?
  rationale: సామర్థ్యాన్ని ప్రశ్నించే יכל భావాన్ని, దేవుని సన్నిధిలో నిలిచి ఉండటాన్ని సూచించే עמד לפני నుడికారాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: ఇది బిరుదు కాక దేవుని వ్యక్తిగత నామమైన చతురక్షర నామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  choice: ఈ పరిశుద్ధ దేవుడు
  rationale: ‘దేవుడు,’ ‘పరిశుద్ధుడు,’ ‘ఈయన’ అనే భావాలను సహజమైన తెలుగు విశేషణ నిర్మాణంలో కలిపి, తీర్పు అనంతరం వారు అనుభవించిన తక్షణ భయాన్ని తెలిపే ‘ఈ’ అనే నిర్దేశకాన్ని నిలిపాం.
- source_word: וְאֶל מִי יַעֲלֶה מֵעָלֵינוּ
  choice: ఆయన మా దగ్గరనుండి ఎవరి దగ్గరికి వెళ్లాలి?
  rationale: עלה యొక్క ‘పైకి వెళ్లడం/వెళ్లడం’ భావాన్ని సందర్భానుకూలంగా ‘వెళ్లాలి’ అని ఇచ్చాం. హీబ్రూలో కర్త స్పష్టంగా లేకపోయినా క్రియ పుంలింగ ఏకవచనం; ప్రధాన పాఠ్యంలో ‘ఆయన’ దాని వ్యాకరణ రూపాన్ని ప్రతిబింబిస్తుంది, సందర్భంలో మందసం ఉద్దేశించి ఉండవచ్చని పాదటిప్పణి తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దైవనామాన్నే నేరుగా ఉపయోగిస్తుంది; అందువల్ల దాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణగా ఉంచాం.
- issue: יַעֲלֶה క్రియకు అంతర్నిహిత కర్త
  choice: ఆయన ... వెళ్లాలి
  alternative: అది ... వెళ్లాలి (యాహ్వే మందసాన్ని సూచిస్తూ)
  rationale: హీబ్రూ క్రియ పుంలింగ ఏకవచనంలో ఉన్నా కర్తను నామవాచకంగా పేర్కొనదు. వ్యాకరణ రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భపరంగా మందసమే కావచ్చనే భావాన్ని పాదటిప్పణిలో ఇచ్చాం; తద్వారా మూలంలోని ఉద్వేగాన్ని పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఎదుట నిలబడగలరు’ అనే పదబంధం మూలంలోని సన్నిధి, భయం, అసమర్థత భావాలను నిలుపుతుంది. స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా ‘బేత్-షెమెషు’ అని ఇచ్చాం.
