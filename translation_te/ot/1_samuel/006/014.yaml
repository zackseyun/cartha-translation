id: 1SA.6.14
reference: 1 Samuel 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ/עֲגָלָ֡ה בָּ֠אָה אֶל שְׂדֵ֨ה יְהוֹשֻׁ֤עַ בֵּֽית הַשִּׁמְשִׁי֙ וַ/תַּעֲמֹ֣ד שָׁ֔ם וְ/שָׁ֖ם אֶ֣בֶן גְּדוֹלָ֑ה וַֽ/יְבַקְּעוּ֙ אֶת עֲצֵ֣י הָ/עֲגָלָ֔ה וְ/אֶת הַ֨/פָּר֔וֹת הֶעֱל֥וּ עֹלָ֖ה לַ/יהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
translation:
  language: te
  text: ఆ బండి బేత్షెమెషీయుడైన యెహోషువ పొలానికి వచ్చి అక్కడ ఆగింది.[a] అక్కడ ఒక పెద్ద రాయి ఉంది. వారు బండి చెక్కలను చీల్చి, ఆ ఆవులను యహ్వేకు దహనబలిగా అర్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అక్కడ నిలిచింది.’
    reason: హీబ్రూ עמד యొక్క అక్షరార్థాన్ని తెలియజేస్తూ, ప్రధాన పాఠంలో సందర్భానుసారంగా వాడిన ‘ఆగింది’కు ప్రత్యామ్నాయం అందిస్తుంది.
lexical_decisions:
- source_word: הָעֲגָלָה
  choice: బండి
  rationale: మందసాన్ని మోసుకొచ్చిన వాహనాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: బేత్షెమెషువాడైన యెహోషువ పొలం
  rationale: హీబ్రూ విశేషణ రూపం యెహోషువకు బేత్షెమెషుతో ఉన్న సంబంధాన్ని సూచిస్తుంది; తెలుగులో ఈ నిర్మాణం సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: וַתַּעֲמֹד שָׁם
  choice: అక్కడ ఆగింది
  rationale: עמד అక్షరార్థంగా ‘నిలిచింది’; కదులుతున్న బండి సందర్భంలో ‘ఆగింది’ సహజమైన తెలుగు.
- source_word: וְשָׁם אֶבֶן גְּדוֹלָה
  choice: అక్కడ ఒక పెద్ద రాయి ఉంది
  rationale: స్థలంలో ఉన్న ప్రముఖమైన పెద్ద రాయిని హీబ్రూ సరళంగా పేర్కొంటుంది.
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  choice: బండి కర్రలను చీల్చి
  rationale: בקע అంటే చీల్చడం; బండి చెక్క భాగాలను ఇంధనంగా ఉపయోగించేందుకు చీల్చిన చర్యను ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַפָּרוֹת
  choice: ఆ ఆవులను
  rationale: פרות అనేది ఆడ పశువులను సూచించే సాధారణ పదం; ముందరి సందర్భంలో ఇవి పాలిచ్చే ఆవులు కాబట్టి ‘ఆవులు’ సముచితం.
- source_word: הֶעֱלוּ עֹלָה
  choice: దహనబలిగా అర్పించారు
  rationale: ఈ బలిసంబంధ పదబంధం పూర్తిగా దహనం చేసే అర్పణను సూచిస్తుంది; తెలుగు బైబిలు శైలిలో ‘దహనబలి’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: మూలపాఠంలోని దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూల హీబ్రూ పాఠంలో ఉన్న ఒడంబడిక నామాన్ని ప్రత్యక్షంగా నిలుపుతుంది; ‘ప్రభువు’ అనే బిరుదుతో కలిగే భేదాన్ని కూడా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. వ్యక్తి, స్థలనామాలను సాధారణ తెలుగు ధ్వన్యంతరీకరణలో ఉంచి, బలిసంబంధ పదజాలంలో గౌరవప్రదమైన బైబిలు శైలిని నిలిపాం.
