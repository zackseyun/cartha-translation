source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֩ צַלְמֵ֨י עפלי/כם וְ/צַלְמֵ֣י עַכְבְּרֵי/כֶ֗ם הַ/מַּשְׁחִיתִם֙ אֶת הָ/אָ֔רֶץ וּ/נְתַתֶּ֛ם לֵ/אלֹהֵ֥י יִשְׂרָאֵ֖ל כָּב֑וֹד אוּלַ֗י יָקֵ֤ל אֶת יָד/וֹ֙ מֵֽ/עֲלֵי/כֶ֔ם וּ/מֵ/עַ֥ל אֱלֹהֵי/כֶ֖ם וּ/מֵ/עַ֥ל אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
translation:
  language: te
  text: కాబట్టి మీ కణుతుల[a] ప్రతిరూపాలను, దేశాన్ని నాశనం చేస్తున్న మీ ఎలుకల ప్రతిరూపాలను తయారుచేయండి. ఇశ్రాయేలు దేవునికి మహిమ చెల్లించండి. బహుశా ఆయన మీ మీద, మీ దేవుళ్ల మీద, మీ దేశం మీద ఉన్న తన చేతి భారాన్ని తగ్గించవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ మూలవ్యాధి వాపుల.” హెబ్రీ పదం శరీరంపై ఏర్పడే వాపులు లేదా కణుతులను సూచిస్తుంది; సంప్రదాయంగా చెప్పే ఈ మరింత నిర్దిష్ట అర్థం సాధ్యమే గాని నిశ్చితం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: కాబట్టి ... తయారుచేసి
  rationale: ఈ సందర్భంలో క్రమానుసారమైన ఆదేశ భావం ఉంది. ‘కాబట్టి’ ముందున్న సలహా నుంచి వచ్చే పర్యవసానాన్ని, ‘తయారుచేసి’ ప్రతిరూపాలను చేయడాన్ని సహజమైన తెలుగులో తెలియజేస్తాయి.
- source_word: צַלְמֵי
  choice: ప్రతిరూపాలను
  rationale: చేతితో తయారుచేసిన పోలికలు లేదా నమూనాలు అనే భావాన్ని ‘ప్రతిరూపాలు’ స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: עפלי/כם
  choice: మీ కణుతుల[a]
  rationale: మూలపదం శరీరంపై ఏర్పడే వాపులు లేదా కణుతులను సూచిస్తుంది; ఖచ్చితంగా మూలవ్యాధి అని నిర్ధారించదు. అందువల్ల విస్తృతార్థకమైన ‘కణుతులు’ ప్రధాన పాఠ్యంలో ఉంచబడింది.
- source_word: וְצַלְמֵי עַכְבְּרֵי/כֶם
  choice: మీ ఎలుకల ప్రతిరూపాలను
  rationale: עכבר సాధారణంగా ఎలుకను సూచిస్తుంది. ‘ఎలుకలు’ ఆధునిక తెలుగులో సహజమైన, సంప్రదాయ అవగాహనకు సరిపోయే పదం.
- source_word: הַמַּשְׁחִיתִם אֶת הָאָרֶץ
  choice: దేశాన్ని నాశనం చేస్తున్న
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న విధ్వంసాన్ని సూచిస్తుంది. ‘నాశనం చేస్తున్న’ ఆ కొనసాగుతున్న చర్యను స్పష్టంగా ఉంచుతుంది.
- source_word: וּנְתַתֶּם ... כָּבוֹד
  choice: మహిమ చెల్లించండి
  rationale: దేవుని శక్తిని అంగీకరించి ఆయనకు ఘనత ఇవ్వడం అనే భావాన్ని ‘మహిమ చెల్లించండి’ సహజమైన బైబిలు తెలుగులో అందిస్తుంది.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవునికి
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని నేరుగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: אוּלַי
  choice: బహుశా
  rationale: నిశ్చయాన్ని కాక ఆశతో కూడిన అవకాశాన్ని సూచించే మూలపద భావాన్ని కాపాడుతుంది.
- source_word: יָקֵל אֶת יָדוֹ
  choice: తన చేతి భారాన్ని తగ్గిస్తాడు
  rationale: ‘చేతిని తేలిక చేయడం’ అనే హెబ్రీ రూపకాన్ని సహజమైన తెలుగులో అర్థమయ్యేలా ‘చేతి భారం’గా వ్యక్తం చేసింది; దేవుని కార్యశక్తిని సూచించే ‘చేతి’ ప్రతిమను నిలిపింది.
- source_word: מֵעֲלֵיכֶם וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
  choice: మీ మీద, మీ దేవుళ్ల మీద, మీ దేశం మీద ఉన్న
  rationale: మూడు అంశాలపై దేవుని చెయ్యి ఉందనే పునరుక్త నిర్మాణాన్ని తెలుగులో స్పష్టంగా నిలిపి, ఫిలిష్తీయుల దేవుళ్లు కూడా ఆ ఒత్తిడికి లోనయ్యారనే భావాన్ని తొలగించలేదు.
theological_decisions:
- issue: עפלים సూచించే వ్యాధి స్వభావం
  choice: కణుతులు
  alternative: మూలవ్యాధి వాపులు
  rationale: హెబ్రీ పదం శరీర వాపులు లేదా కణుతులను సూచించినా, వాటి ఖచ్చితమైన శరీరస్థానాన్ని నిర్బంధంగా నిర్ణయించదు. అందువల్ల ప్రధాన పాఠ్యంలో విస్తృతమైన పదాన్ని, సంప్రదాయ ప్రత్యేక అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: ‘ఆయన చెయ్యి’ అనే మానవరూపక భాష
  choice: తన చేతి భారాన్ని తగ్గిస్తాడు
  alternative: తన శిక్షను తగ్గిస్తాడు
  rationale: ‘చెయ్యి’ దేవుని శక్తి మరియు బాధ కలిగించే కార్యాన్ని సూచించే మూలరూపకం. దానిని కేవలం ‘శిక్ష’గా మార్చితే మూలంలోని దృశ్యభాష, ఉద్దేశపూర్వక ఉద్రిక్తత తగ్గిపోతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హెబ్రీ వాక్యంలోని ఆదేశం, కొనసాగుతున్న విధ్వంసం, ‘చెయ్యి’ రూపకం, మరియు మూడు అంశాలపై ఉన్న ఒత్తిడి అన్నింటినీ సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపాం.
