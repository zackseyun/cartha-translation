  terminology: ‘కణుతులు’ అనేది విస్తృతార్థకంగా సురక్షితమైన ఎంపిక. సంప్రదాయమైన, కానీ అనిశ్చితమైన ‘మూలవ్యాధి వాపులు’ పాదటిప్పణిలో ఉండాలి. ‘మహిమ చెల్లించండి,’ ‘ఇశ్రాయేలు దేవుడు,’ ‘దేవుళ్లు,’ మరియు ‘చెయ్యి’ తగిన బైబిలు-సంబంధిత పదజాలం.
