  source_fidelity: 'The Telugu accurately reflects the Hebrew sequence: take Yahweh’s ark, set it on the cart, place the gold objects being returned to him as a guilt offering in a box beside the ark, then send it away. The final clause, “అది వెళ్లిపోతుంది,” appropriately preserves the Hebrew waw-perfect’s formal resultative/future sense while the footnote acknowledges the contextually possible permissive sense.'
