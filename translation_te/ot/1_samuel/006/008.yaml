source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֞ם אֶת אֲר֣וֹן יְהוָ֗ה וּ/נְתַתֶּ֤ם אֹת/וֹ֙ אֶל הָ֣/עֲגָלָ֔ה וְ/אֵ֣ת כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר הֲשֵׁבֹתֶ֥ם ל/וֹ֙ אָשָׁ֔ם תָּשִׂ֥ימוּ בָ/אַרְגַּ֖ז מִ/צִּדּ֑/וֹ וְ/שִׁלַּחְתֶּ֥ם אֹת֖/וֹ וְ/הָלָֽךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
translation:
  language: te
  text: తర్వాత యాహ్వే మందసాన్ని తీసుకొని బండి మీద పెట్టండి. మీరు ఆయనకు అపరాధ పరిహార అర్పణగా తిరిగి ఇస్తున్న బంగారు వస్తువులను[a] ఒక పెట్టెలో[b] ఉంచి, దాన్ని మందసం పక్కన పెట్టండి. ఆ తర్వాత దానిని పంపివేయండి; అది వెళ్లిపోతుంది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బంగారు సామగ్రి’ లేదా ‘బంగారు పాత్రలు’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం వివిధ రకాల వస్తువులు లేదా పాత్రలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఒక భద్రపెట్టెలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘అది వెళ్లిపోతుంది.’ ఆదేశాల పరంపరలో ‘దానిని పంపివేసి, వెళ్లిపోనివ్వండి’ అనే భావం కూడా సాధ్యమే.
    reason: ambiguity_preservation
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: యాహ్వే మందసం
  rationale: אֲרוֹן ఇక్కడ పవిత్ర మందసాన్ని సూచిస్తుంది; יְהוָה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: הָעֲגָלָה
  choice: బండి
  rationale: עגלה అంటే బండి లేదా రథబండి; ఈ కథా సందర్భంలో సాధారణ ఆధునిక తెలుగు పదమైన ‘బండి’ సహజంగా ఉంటుంది.
- source_word: כְּלֵי הַזָּהָב
  choice: బంగారు వస్తువులు
  rationale: כְּלִי అనేది వస్తువు, సామగ్రి లేదా పాత్రను సూచించగల విస్తృత పదం. సందర్భంలోని ఆకృతులను అతిగా నిర్దిష్టం చేయకుండా ‘వస్తువులు’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: הֲשֵׁבֹתֶם לוֹ
  choice: మీరు ఆయనకు ... తిరిగి ఇస్తున్న
  rationale: שׁוב హిఫీల్ రూపం ఇక్కడ తిరిగి ఇవ్వడం లేదా పంపడం అనే భావాన్ని ఇస్తుంది; ఆదేశం ఇంకా అమలవుతున్న సందర్భానికి ఈ రూపం సరిపోతుంది.
- source_word: אָשָׁם
  choice: అపరాధ పరిహార అర్పణ
  rationale: אָשָׁם అపరాధంతో పాటు దానికి సంబంధించిన పరిహార భావాన్నీ కలిగిన బలిపదం. ‘అపరాధ పరిహార అర్పణ’ ఆ ఆరాధనా సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בָאַרְגַּז
  choice: ఒక పెట్టెలో
  rationale: אַרְגָּז అంటే పెట్టె లేదా చిన్న పెట్టెవంటి భద్రపాత్ర; ‘పెట్టె’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: מִצִּדּוֹ
  choice: మందసం పక్కన
  rationale: పుంలింగ ఏకవచన ప్రత్యయం సమీపంలోని మందసాన్ని సహజంగా సూచిస్తుంది; తెలుగులో సూచన స్పష్టత కోసం నామవాచకాన్ని పునరుక్తి చేశాం.
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ
  choice: దానిని పంపివేయండి
  rationale: שׁלח ఇక్కడ పంపివేయడం లేదా వెళ్లనివ్వడం అనే భావంలో ఉంది. పుంలింగ ప్రత్యయం మందసాన్ని సూచించవచ్చు; ‘దానిని’ మూలంలోని సూచనను అతిగా విశదీకరించదు.
- source_word: וְהָלָךְ
  choice: అది వెళ్లిపోతుంది
  rationale: ఈ క్రియ వ్యాకరణపరంగా ‘అది వెళ్లిపోతుంది’ అనే భావాన్ని ఇస్తుంది. ఆదేశ పరంపరలో ‘వెళ్లనివ్వండి’ అనే ప్రయోజనార్థక భావం సాధ్యమైనప్పటికీ, ప్రధాన పాఠం రూపసంబంధ అస్పష్టతను నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగులో సమీప లిప్యంతరీకరణతో ఇచ్చాం.
- issue: ఫిలిష్తీయుల సందర్భంలో אָשָׁם
  choice: అపరాధ పరిహార అర్పణ
  alternative: అపరాధ అర్పణ; పరిహార అర్పణ
  rationale: వక్తలు ఫిలిష్తీయులైనా, హెబ్రీ కథకుడు ఆరాధనా సంబంధమైన אָשָׁם పదాన్ని వాడుతున్నాడు. అపరాధం మరియు పరిహారం రెండింటినీ ప్రతిబింబించే పదబంధం ఆ ఉద్వేగాన్ని నిలుపుతుంది.
- issue: וְהָלָךְ యొక్క విధి లేదా భవిష్యత్ భావం
  choice: అది వెళ్లిపోతుంది
  alternative: అది వెళ్లిపోనివ్వండి
  rationale: హెబ్రీ రూపం నేరుగా భవిష్యత్/ఫలిత భావాన్ని ఇస్తుంది; ఆదేశ సందర్భం అనుమతి భావాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో రూపానికి దగ్గరగా ఉండి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆదేశ శైలిని వాడాం. ‘మందసం,’ ‘అపరాధ పరిహార అర్పణ’ వంటి బైబిలు-ఆరాధనా పదాలను సందర్భ గంభీరత కోసం నిలుపుతూ, మిగతా వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం.
