source:
  edition: WLC
  text: וּ/בֵ֣ית שֶׁ֔מֶשׁ קֹצְרִ֥ים קְצִיר חִטִּ֖ים בָּ/עֵ֑מֶק וַ/יִּשְׂא֣וּ אֶת עֵינֵי/הֶ֗ם וַ/יִּרְאוּ֙ אֶת הָ֣/אָר֔וֹן וַֽ/יִּשְׂמְח֖וּ לִ/רְאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/013.yaml
  text: The people of Beth-shemesh were reaping the wheat harvest in the valley[a], and they lifted up their eyes and saw the ark, and they rejoiced to see it.
translation:
  language: te
  text: బేత్-షెమెషు ప్రజలు లోయలో గోధుమ పంట కోస్తూ ఉన్నారు. వారు తలెత్తి[a] మందసాన్ని చూశారు, దానిని చూసి ఆనందించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: “తమ కళ్లను పైకెత్తి.” ఇది “తలెత్తి చూశారు” అనే అర్థమిచ్చే హెబ్రీయ నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית שֶׁמֶשׁ
  choice: బేత్-షెమెషు ప్రజలు
  rationale: తర్వాతి క్రియలు బహువచనంలో ఉన్నందున స్థల నామం ఇక్కడ ఆ పట్టణ నివాసులను సూచిస్తోంది; లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సహజంగా వ్యక్తపరచబడింది.
- source_word: קֹצְרִים קְצִיר חִטִּים
  choice: గోధుమ పంట కోస్తూ ఉన్నారు
  rationale: బహువచన కృదంతం కొనసాగుతున్న నేపథ్య కార్యాన్ని సూచిస్తుంది; తెలుగు రూపం ఆ దురేటివ్ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בָּעֵמֶק
  choice: లోయలో
  rationale: עֵמֶק సాధారణంగా లోయ లేదా తక్కువ ఎత్తున్న విస్తార ప్రాంతాన్ని సూచిస్తుంది; ఇక్కడ ‘లోయ’ సూటిగా సరిపోతుంది.
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: వారు తలెత్తి
  rationale: అక్షరార్థంగా ‘తమ కళ్లను ఎత్తారు’ అనే హెబ్రీయ జాతీయాన్ని ఆధునిక తెలుగులో దాని సహజ అర్థమైన ‘తలెత్తి’గా ఇచ్చి, పాదటిప్పణిలో అక్షరార్థాన్ని తెలిపాం.
- source_word: וַיִּרְאוּ אֶת הָאָרוֹן
  choice: మందసాన్ని చూసి
  rationale: సందర్భంలో הָאָרוֹן దేవుని మందసాన్ని సూచిస్తుంది. తెలుగు బైబిలు వినియోగంలో గౌరవప్రదమైన, స్థిరమైన పదంగా ‘మందసం’ ఎంచుకున్నాం.
- source_word: וַיִּשְׂמְחוּ לִרְאוֹת
  choice: దాన్ని చూసినందుకు సంతోషించారు
  rationale: לִרְאוֹת వారి సంతోషానికి సందర్భం లేదా కారణాన్ని తెలియజేస్తుంది; హెబ్రీలో అంతర్లీనంగా ఉన్న కర్మ మందసాన్ని సూచిస్తున్నందున తెలుగులో ‘దాన్ని’ చేర్చాం.
