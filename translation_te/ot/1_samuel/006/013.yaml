translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. హెబ్రీ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, కొనసాగుతున్న కోత పనిని నేపథ్యంగా ఉంచి తదనంతర చర్యలను స్పష్టంగా తెలిపాం; మూలంలో లేని ప్రారంభ కాలసూచక పదాన్ని చేర్చలేదు.
