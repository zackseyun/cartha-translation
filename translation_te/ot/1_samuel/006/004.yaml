source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ מָ֣ה הָ/אָשָׁם֮ אֲשֶׁ֣ר נָשִׁ֣יב ל/וֹ֒ וַ/יֹּאמְר֗וּ מִסְפַּר֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים חֲמִשָּׁה֙ עפלי זָהָ֔ב וַ/חֲמִשָּׁ֖ה עַכְבְּרֵ֣י זָהָ֑ב כִּֽי מַגֵּפָ֥ה אַחַ֛ת לְ/כֻלָּ֖/ם וּ/לְ/סַרְנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
translation:
  language: te
  text: అప్పుడు వారు, “మేము ఆయనకు తిరిగి పంపవలసిన అపరాధ పరిహార అర్పణ[a] ఏమిటి?” అని అడిగారు. అందుకు వారు, “ఫిలిష్తీయుల పాలకుల సంఖ్య ప్రకారం ఐదు బంగారు వాపులు[b], ఐదు బంగారు ఎలుకలు. ఎందుకంటే మీ అందరిమీదా, మీ పాలకులమీదా ఒకే తెగులు వచ్చింది” అని చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిహార అర్పణ”; లేదా, “దోష పరిహార అర్పణ.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం తెగులుతో సంబంధమున్న శరీర వాపులు లేదా గడ్డలను సూచించే అవకాశం ఉంది; కొందరు దీన్ని మరింత నిర్దిష్టంగా “మూలవ్యాధి వాపులు” అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  choice: అపరాధ పరిహార అర్పణ
  rationale: ఈ సందర్భంలో אָשָׁם అపరాధాన్ని పరిహరించేందుకు ఇచ్చే అర్పణను సూచిస్తుంది. ‘అపరాధ పరిహార అర్పణ’ అనే పదబంధం అపరాధం, పరిహారం అనే రెండు భావాలనూ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: נָשִׁיב לוֹ
  choice: మేము ఆయనకు తిరిగి పంపవలసిన
  rationale: హిఫిల్ రూపంలోని שוב ‘తిరిగి పంపడం/చేర్చడం’ అనే భావం ఇస్తుంది. పుంలింగ ఏకవచన సర్వనామాన్ని ఇశ్రాయేలు దేవునికి సూచనగా ‘ఆయనకు’ అని అనువదించాం.
- source_word: מִסְפַּר סַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల పాలకుల సంఖ్య ప్రకారం
  rationale: నిర్మాణం పాలకుల సంఖ్యకు అనుగుణమైన సంఖ్యను సూచిస్తుంది. ‘సంఖ్య ప్రకారం’ సహజమైన తెలుగులో ఆ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: סַרְנֵי
  choice: పాలకులు
  rationale: ఇది ఫిలిష్తీయుల ప్రధాన రాజకీయ నాయకుల ప్రత్యేక బిరుదు. ‘పాలకులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, సామంత వ్యవస్థకు చెందిన అనవసర భావాలను రానివ్వదు.
- source_word: עפלי זָהָב
  choice: బంగారు వాపులు
  rationale: ఈ పదం తెగులుతో కలిగిన శరీర వాపులు లేదా గడ్డలను సూచించే అవకాశం ఉంది. ‘వాపులు’ వ్యాధి స్వరూపాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా మూలంలోని సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: עַכְבְּרֵי זָהָב
  choice: బంగారు ఎలుకలు
  rationale: עַכְבָּר అనే పదానికి నేరుగా ‘ఎలుక’ అనే అర్థం. బంగారంతో చేసిన వాటి రూపాలను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַגֵּפָה אַחַת
  choice: ఒకే తెగులు
  rationale: אַחַת ఇక్కడ అందరినీ తాకిన అదే ఒక్క తెగులును నొక్కి చెబుతుంది. ‘ఒకే తెగులు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְכֻלָּם
  choice: మీ అందరిమీదా
  rationale: తెగులు ప్రభావితులపై ఉండడాన్ని לְ సూచిస్తుంది. సంభాషణలోని ద్వితీయ పురుష సంబోధనను అనుసరించి ‘మీ అందరిమీదా’ అని ఇచ్చాం.
- source_word: וּלְסַרְנֵיכֶם
  choice: మీ పాలకులమీదా
  rationale: రెండవ పురుష బహువచన ప్రత్యయాన్ని నిలుపుతూ, ముందున్న סַרְנֵיకి అనుగుణంగా ‘పాలకులు’ అనే పదాన్నే వాడాం.
theological_decisions:
- issue: לוֹ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ‘ఆయనకు’—ఇశ్రాయేలు దేవునికి సూచన
  alternative: ‘దానికి’—మందసాన్ని సూచించవచ్చు
  rationale: ఈ సందర్భంలో మందసాన్ని తిరిగి పంపడంతో పాటు దేవుని పట్ల జరిగిన అపరాధానికి పరిహారం చెల్లించడం ప్రధానంగా ఉంది. పుంలింగ ఏకవచన సర్వనామాన్ని వ్యక్తిగతంగా ‘ఆయనకు’ అని ఇవ్వడం వాక్యంలోని దైవసంబంధ తర్కానికి సరిపోతుంది; అయినా మందసాన్ని సూచించే పఠనం వ్యాకరణపరంగా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ప్రత్యక్ష సంభాషణ సహజంగా ఉండేందుకు ‘అడిగారు/చెప్పారు’ వాడాం. ‘అపరాధ పరిహార అర్పణ’ మూలంలోని ఆచారపరమైనదీ పరిహారపరమైనదీ అయిన భావాన్ని సమతుల్యంగా తెలియజేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
