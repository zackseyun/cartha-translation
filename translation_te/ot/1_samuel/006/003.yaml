  to: 'వారు ఇలా అన్నారు: “మీరు ఇశ్రాయేలు దేవుని మందసాన్ని పంపివేస్తే, దాన్ని ఖాళీగా పంపవద్దు. ఆయనకు అపరాధ పరిహార అర్పణను[a] తప్పకుండా సమర్పించాలి. అప్పుడు మీరు స్వస్థపడతారు; ఆయన చెయ్యి[b] మీ మీద నుండి ఎందుకు తొలగిపోలేదో మీకు తెలిసివస్తుంది.”'
  rationale: ‘చెల్లించాలి’ను ‘సమర్పించాలి’గా మార్చి, దేవునికి అపరాధ పరిహార అర్పణను ఇవ్వాలనే మూలభావాన్ని కాపాడాం. ‘వట్టిగా’ స్థానంలో ‘ఖాళీగా’ వాడి ఆధునిక ప్రామాణిక వాడుకను మెరుగుపరిచాం. మిగిలిన వాక్యార్థం, రూపకాలు, పాదసూచిక గుర్తులు మరియు పాదసూచికల అర్థం మారలేదు.
