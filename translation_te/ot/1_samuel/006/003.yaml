id: 1SA.6.3
reference: 1 Samuel 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אִֽם מְשַׁלְּחִ֞ים אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ אַל תְּשַׁלְּח֤וּ אֹת/וֹ֙ רֵיקָ֔ם כִּֽי הָשֵׁ֥ב תָּשִׁ֛יבוּ ל֖/וֹ אָשָׁ֑ם אָ֤ז תֵּרָֽפְאוּ֙ וְ/נוֹדַ֣ע לָ/כֶ֔ם לָ֛/מָּה לֹא תָס֥וּר יָד֖/וֹ מִ/כֶּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “మీరు ఇశ్రాయేలు దేవుని మందసాన్ని పంపివేస్తే, దాన్ని ఖాళీగా పంపవద్దు. ఆయనకు అపరాధ పరిహార అర్పణను[a] తప్పకుండా సమర్పించాలి. అప్పుడు మీరు స్వస్థపడతారు; ఆయన చెయ్యి[b] మీ మీద నుండి ఎందుకు తొలగిపోలేదో మీకు తెలిసివస్తుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరిహార అర్పణ”; సంప్రదాయంగా “అపరాధ అర్పణ.”
    reason: lexical_alternative
  - marker: b
    text: “ఆయన చెయ్యి” అనేది తీర్పు తీర్చడంలో దేవుని శక్తిని సూచించే సాధారణ హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  choice: పంపివేస్తే / పంపవద్దు
  rationale: ఈ సందర్భంలో మందసాన్ని ఫిలిష్తీయుల అధీనంనుంచి తిరిగి పంపడాన్ని సూచిస్తుంది. తెలుగు పునరుక్తిని సహజంగా ఉంచుతూ మూలంలోని క్రియాపునరావృతిని నిలుపుతుంది.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుని మందసం
  rationale: మూలంలోని సంబంధాన్ని నేరుగా నిలుపుతుంది; ఇక్కడ లేని ‘నిబంధన మందసం’ అనే తరువాతి సంక్షిప్త నామాన్ని చేర్చదు.
- source_word: רֵיקָם
  choice: వట్టిగా
  rationale: ఏ పరిహార కానుకా లేకుండా పంపడం అనే భావాన్ని ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הָשֵׁב תָּשִׁיבוּ
  choice: తప్పకుండా చెల్లించాలి
  rationale: క్రియావిశేషక మూలరూపం మరియు పరిమిత క్రియ కలయికలోని బలమైన నిశ్చయాన్ని ‘తప్పకుండా’ తెలియజేస్తుంది. అపరాధ పరిహార అర్పణను దేవునికి తిరిగి చెల్లించడమనే సందర్భార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: לּוֹ
  choice: ఆయనకు
  rationale: పుంలింగ ఏకవచన ప్రత్యయం అత్యంత సహజంగా ఇశ్రాయేలు దేవుణ్ణే సూచిస్తుంది; మందసాన్ని వస్తువుగా సూచించదు.
- source_word: אָשָׁם
  choice: అపరాధ పరిహార అర్పణ
  rationale: ఈ పదంలోని అపరాధం మరియు దానికి చేయవలసిన పరిహారం అనే రెండు భావాలను కలిపి తెలియజేస్తుంది; కేవలం ‘అపరాధ అర్పణ’ కంటే ఈ సందర్భంలోని నష్టపరిహార ఛాయను స్పష్టంగా ఉంచుతుంది.
- source_word: תֵּרָפְאוּ
  choice: మీరు స్వస్థపడతారు
  rationale: רפא నిఫాల్ రూపంలోని నిష్క్రియాత్మక/ఫలితార్థాన్ని నిలుపుతూ, తెగులు నుంచి ఉపశమనం పొందడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְנוֹדַע לָכֶם
  choice: మీకు తెలుస్తుంది
  rationale: హీబ్రూ నిఫాల్ రూపంలోని ‘మీకు తెలిసివస్తుంది’ అనే భావాన్ని భారంగా కాకుండా సహజ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לָמָּה לֹא תָסוּר יָדוֹ מִכֶּם
  choice: ఆయన చెయ్యి మీ మీదనుంచి ఎందుకు తొలగిపోలేదో
  rationale: దేవుని తీర్పు శక్తిని సూచించే ‘చెయ్యి’ రూపకాన్ని వ్యాఖ్యానించి మార్చకుండా నిలుపుతుంది; סור క్రియలోని తొలగిపోవడం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: לּוֹ లోని సర్వనామ ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: అర్పణను ‘ఆయనకు,’ అంటే ఇశ్రాయేలు దేవునికి చెల్లించాలి.
  alternative: అర్పణను ‘దానితో,’ అంటే మందసంతో పాటు తిరిగి పంపాలి.
  rationale: ‘ఇశ్రాయేలు దేవుని మందసం’ అనే సమీప పదబంధం, అలాగే אָשָׁם అనే అర్పణ పదం, వ్యక్తిగతమైన దైవ సూచనకు బలం ఇస్తాయి. అయినా అర్పణ మందసంతో పాటు పంపబడుతుందనే కార్యసందర్భాన్ని ఈ ఎంపిక నిరాకరించదు.
- issue: ‘ఆయన చెయ్యి’ అనే రూపకం
  choice: దేవుని బాధించే శక్తి లేదా తీర్పును సూచించే రూపకాన్ని ‘ఆయన చెయ్యి’గానే నిలుపడం.
  alternative: ‘ఆయన శిక్ష’ లేదా ‘ఆయన పంపిన తెగులు’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: ఈ రూపకం పాత నిబంధనలో ప్రాముఖ్యమైనది, సందర్భంలో అర్థమయ్యేదీ. దాన్ని నిలుపడం వల్ల మూలంలోని చిత్రణ మరియు దైవ కార్యంపై ఉన్న భావతీవ్రత కాపాడబడతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మందసం,’ ‘అర్పణ’ వంటి స్థిర బైబిలు పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గరే ఉంచాం.
