  text: וַ/יִשַּׁ֨רְנָה הַ/פָּר֜וֹת בַּ/דֶּ֗רֶךְ עַל דֶּ֨רֶךְ֙ בֵּ֣ית שֶׁ֔מֶשׁ בִּ/מְסִלָּ֣ה אַחַ֗ת הָלְכ֤וּ הָלֹךְ֙ וְ/גָע֔וֹ וְ/לֹא סָ֖רוּ יָמִ֣ין וּ/שְׂמֹ֑אול וְ/סַרְנֵ֤י פְלִשְׁתִּים֙ הֹלְכִ֣ים אַחֲרֵי/הֶ֔ם עַד גְּב֖וּל בֵּ֥ית שָֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/012.yaml
  text: And the cows went straight on the road toward Beth-shemesh[a], along one highway; they went on, lowing as they went, and did not turn aside to the right or to the left[c][b]. And the lords of the Philistines were walking behind them as far as the border of Beth-shemesh.
translation:
  language: te
  text: ఆ ఆవులు బేత్-షెమెషుకు వెళ్లే దారిలో ఒకే మార్గం వెంట నేరుగా వెళ్లాయి. అవి రంకె వేస్తూ ముందుకు సాగాయి; కుడికిగాని ఎడమకుగాని తొలగలేదు. ఫిలిష్తీయుల అధిపతులు[a] వాటి వెనుక బేత్-షెమెషు సరిహద్దు[b] వరకు నడుస్తూ వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అధిపతులు’ అనే పదం ఫిలిష్తీయుల ప్రధాన నగరాలను పాలించిన అధికారుల బిరుదును సూచిస్తుంది; ‘పాలకులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘బేత్-షెమెషు ప్రాంతం వరకు.’ మూలభాషలోని పదం సరిహద్దును లేదా ఆ హద్దులోని ప్రాంతాన్ని సూచించగలదు.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִשַּׁרְנָה
  choice: నేరుగా ... సాగిపోయాయి
  rationale: ישר అనే క్రియ ఆవులు పక్కకు మళ్లకుండా సూటిగా ప్రయాణించాయని సూచిస్తుంది. ఈ భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַפָּרוֹת
  choice: ఆ ఆవులు
  rationale: సందర్భంలో ఇవి పాలిచ్చే ఆవులు; అందువల్ల సాధారణమైన, సందర్భోచితమైన పదం ‘ఆవులు’.
- source_word: בַּדֶּרֶךְ עַל דֶּרֶךְ בֵּית שֶׁמֶשׁ בִּמְסִלָּה אַחַת
  choice: బేత్-షెమెషుకు వెళ్లే దారిలో నేరుగా, ఒకే రహదారిపై
  rationale: మూలంలోని דרך పదపునరుక్తి నిర్దిష్టమైన దారిని నొక్కిచెబుతుంది; מְסִלָּה אַחַת వారు ఒకే మార్గంలో నిలకడగా వెళ్లినట్లు తెలియజేస్తుంది. తెలుగులో అనవసరమైన పునరుక్తి లేకుండా ఆ ఉద్ఘాటనను నిలిపింది.
- source_word: הָלְכוּ הָלוֹךְ
  choice: ముందుకు సాగాయి
  rationale: క్రియతో కూడిన infinitive absolute నిరంతర గమనాన్ని బలపరుస్తుంది. ‘ముందుకు సాగాయి’ ఆ కొనసాగింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְגָעוֹ
  choice: అంబా అని అరుస్తూ
  rationale: געה పశువులు చేసే అరుపును సూచిస్తుంది. ‘అంబా అని అరుస్తూ’ సాధారణ తెలుగు పాఠకులకు వెంటనే అర్థమయ్యే సహజమైన రూపం.
- source_word: וְלֹא סָרוּ יָמִין וּשְׂמֹאול
  choice: కుడికిగాని ఎడమకుగాని తొలగలేదు
  rationale: סור అంటే నిర్ణీత మార్గం నుంచి పక్కకు మళ్లడం. మూలంలోని ద్వంద్వ దిశా ప్రయోగాన్ని యథాతథంగా నిలిపింది.
- source_word: וְסַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల అధిపతులు
  rationale: סֶרֶן ఫిలిష్తీయ నగర-పాలకులకు వాడే ప్రత్యేక బిరుదు. ‘అధిపతులు’ వారి అధికార స్థాయిని గౌరవప్రదంగా, మతపరమైన అదనపు భావం లేకుండా తెలియజేస్తుంది.
- source_word: הֹלְכִים אַחֲרֵיהֶם
  choice: వాటి వెనుక ... నడుచుకుంటూ వెళ్లారు
  rationale: హీబ్రూ participle కొనసాగుతున్న అనుసరణను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ దృశ్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עַד גְּבוּל בֵּית שָׁמֶשׁ
  choice: బేత్-షెమెషు సరిహద్దు వరకు
  rationale: גְּבוּל ఇక్కడ ప్రాంతపు అంచు లేదా హద్దును సూచించవచ్చు. ప్రధాన పాఠంలో ‘సరిహద్దు’ భౌగోళిక భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
