id: 1SA.6.10
reference: 1 Samuel 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֤וּ הָ/אֲנָשִׁים֙ כֵּ֔ן וַ/יִּקְח֗וּ שְׁתֵּ֤י פָרוֹת֙ עָל֔וֹת וַ/יַּאַסְר֖וּ/ם בָּ/עֲגָלָ֑ה וְ/אֶת בְּנֵי/הֶ֖ם כָּל֥וּ בַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
translation:
  language: te
  text: అప్పుడు ఆ మనుషులు అలాగే చేశారు. పాలు ఇస్తున్న రెండు ఆవులను తీసుకొని, వాటిని బండికి కట్టారు; వాటి దూడలను ఇంట్లో బంధించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: ఆ మనుషులు అలాగే చేశారు
  rationale: ముందు ఇచ్చిన ఆదేశం ప్రకారమే వారు ప్రవర్తించారని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: ఈ సందర్భంలో నిర్దిష్టమైన పురుష కార్యనిర్వాహకులను సూచించే אֲנָשִׁים అనే పదానికి లింగార్థాన్ని నిలుపుకునే అనువాదం.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: పాలు ఇస్తున్న రెండు ఆవులు
  rationale: עָלוֹת ఇక్కడ దూడలున్న, పాలిస్తున్న ఆవులను వర్ణిస్తుంది. 'పాలు ఇస్తున్న' అనేది స్పష్టమైన, సహజమైన తెలుగు.
- source_word: וַיַּאַסְרוּם
  choice: వాటిని ... కట్టారు
  rationale: אסר యొక్క మూలార్థం 'కట్టు'; బండి సందర్భంలో ఆవులను దానికి కట్టడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָּעֲגָלָה
  choice: బండికి
  rationale: עגלה మందసాన్ని, అర్పణలను మోసే చక్రాల వాహనం; 'బండి' సాధారణమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: וְאֶת בְּנֵיהֶם
  choice: వాటి దూడలను
  rationale: బెనేహెమ్ అక్షరార్థంగా 'వాటి పిల్లలు'; ఆవుల సంతానాన్ని తెలుగులో సహజంగా 'దూడలు' అంటారు.
- source_word: כָּלוּ בַּבָּיִת
  choice: ఇంట్లో బంధించారు
  rationale: ఈ సందర్భంలో כלה అదుపులో ఉంచడం లేదా బయటకు రాకుండా బంధించడం అనే భావాన్ని ఇస్తుంది; בַּבָּיִת లోని 'ఇంట్లో' అనే రూపాన్ని నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త చర్యల క్రమం నిలుపబడింది; వివరణ అవసరం లేకుండానే 'పాలు ఇస్తున్న ఆవులు' మరియు 'దూడలు' భావాన్ని స్పష్టం చేస్తాయి.
