  text: And the ark of Yahweh was in the territory of the Philistines seven months[a].
translation:
  language: te
  text: యెహోవా మందసం ఫిలిష్తీయుల ప్రాంతంలో ఏడు నెలలు ఉండింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఫిలిష్తీయుల పొలంలో”; ఇక్కడ అది వారి దేశాన్ని లేదా ప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉంది
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజమైన వాక్య నిర్మాణంతో తెలియజేస్తుంది; ప్రత్యేకంగా ‘అప్పుడు జరిగింది’ అనే భారమైన సూత్రవాక్యం అవసరం లేదు.
- source_word: אֲרוֹן יְהוָה
  choice: యెహోవా మందసం
  rationale: దైవ నామాన్ని వ్యక్తినామంగా ఉంచుతూ, ఆరాధనా సందర్భంలోని אֲרוֹן కు తెలుగులో స్థిరపడిన ‘మందసం’ అనే పదాన్ని ఉపయోగించింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో అందిస్తుంది.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల ప్రాంతంలో
  rationale: שָׂדֶה యొక్క అక్షరార్థం ‘పొలం’ అయినా, ఈ సందర్భంలో ఫిలిష్తీయుల అధీన భూభాగాన్ని సూచించే విస్తృత భౌగోళిక భావం సహజంగా సరిపోతుంది; అక్షరార్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: ఏడు నెలలు
  rationale: సంఖ్యా-కాల వ్యక్తీకరణను నేరుగా, సహజంగా అనువదించింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని ఒడంబడిక వ్యక్తినామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా సంరక్షిస్తుంది; ఈ వచన సందర్భం అదనపు వ్యాఖ్యానాన్ని కోరదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ప్రాంతం’ సందర్భార్థాన్ని ప్రధాన పాఠంలో ఇస్తూ, ‘పొలం’ అనే మూలపద అక్షరార్థాన్ని పాదటిప్పణిలో సంరక్షించింది.
