source:
  edition: WLC
  text: וְ/עַתָּ֗ה קְח֨וּ וַ/עֲשׂ֜וּ עֲגָלָ֤ה חֲדָשָׁה֙ אֶחָ֔ת וּ/שְׁתֵּ֤י פָרוֹת֙ עָל֔וֹת אֲשֶׁ֛ר לֹא עָלָ֥ה עֲלֵי/הֶ֖ם עֹ֑ל וַ/אֲסַרְתֶּ֤ם אֶת הַ/פָּרוֹת֙ בָּ/עֲגָלָ֔ה וַ/הֲשֵׁיבֹתֶ֧ם בְּנֵי/הֶ֛ם מֵ/אַחֲרֵי/הֶ֖ם הַ/בָּֽיְתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/007.yaml
  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
translation:
  language: te
  text: ఇప్పుడు ఒక కొత్త బండిని సిద్ధం చేయండి; ఇంతవరకు కాడి ఎప్పుడూ మోయని పాలిచ్చే రెండు ఆవులను తీసుకోండి. ఆ ఆవులను బండికి కట్టండి; అయితే వాటి దూడలను వాటి దగ్గరనుండి ఇంటికి తీసుకెళ్లండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: మునుపటి మాటల నుంచి తదుపరి ఆదేశానికి మారే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קְחוּ וַעֲשׂוּ
  choice: తీసుకొని ... సిద్ధం చేయండి
  rationale: రెండు ఆజ్ఞల క్రమాన్ని నిలుపుతూ, బండిని 'చేయడం' అనే మాటను సందర్భానుగుణంగా సహజమైన 'సిద్ధం చేయడం'గా అందిస్తుంది.
- source_word: עֲגָלָה חֲדָשָׁה אֶחָת
  choice: ఒక కొత్త బండి
  rationale: సంఖ్య, విశేషణం రెండింటినీ ఉంచి עֲגָלָהను సందర్భానికి తగిన 'బండి'గా అనువదిస్తుంది.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: పాలిచ్చే రెండు ఆవులు
  rationale: עָלוֹת అంటే పాలిస్తున్న లేదా పాలు ఇస్తున్న ఆవులు; 'పాలిచ్చే' అనేది స్పష్టమైన, సాధారణ తెలుగు.
- source_word: אֲשֶׁר לֹא עָלָה עֲלֵיהֶם עֹל
  choice: ఇంతవరకు కాడి మోయని
  rationale: హీబ్రూ నుడికారంలోని 'వాటి మీద కాడి రాలేదు' అనే భావాన్ని, అవి ఇంతకు ముందు బండి పనికి ఉపయోగించబడలేదని సహజంగా తెలియజేస్తుంది.
- source_word: וַאֲסַרְתֶּם אֶת־הַפָּרוֹת בָּעֲגָלָה
  choice: వాటిని బండికి కట్టండి
  rationale: బండిని లాగేందుకు ఆవులను దానికి జతచేసే కార్యాన్ని సాధారణ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַהֲשֵׁיבֹתֶם בְּנֵיהֶם מֵאַחֲרֵיהֶם הַבָּיְתָה
  choice: వాటి దూడలను వాటి దగ్గర నుంచి ఇంటికి తీసుకెళ్లండి
  rationale: హిఫిల్ క్రియలోని తిరిగి పంపే/తీసుకెళ్లే భావాన్ని, దూడలను తల్లుల నుంచి వేరు చేసి ఇంటివైపు తీసుకెళ్లాలనే క్రమంతో వ్యక్తం చేస్తుంది.
