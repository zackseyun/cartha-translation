translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. మూలంలోని కార్యనిర్దేశక క్రమం నిలుపబడింది; అవసరం లేని మతపరమైన వివరణలు చేర్చలేదు.
