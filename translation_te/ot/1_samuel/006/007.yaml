- from: కాబట్టి ఇప్పుడు ఒక కొత్త బండిని సిద్ధం చేయండి. ఇంతవరకు కాడి మోయని, పాలిచ్చే రెండు ఆవులను తీసుకొని, వాటిని బండికి కట్టండి; అయితే వాటి దూడలను వాటి దగ్గర నుంచి ఇంటికి తీసుకెళ్లండి.
  to: ఇప్పుడు ఒక కొత్త బండిని సిద్ధం చేయండి; ఇంతవరకు కాడి ఎప్పుడూ మోయని పాలిచ్చే రెండు ఆవులను తీసుకోండి. ఆ ఆవులను బండికి కట్టండి; అయితే వాటి దూడలను వాటి దగ్గరనుండి ఇంటికి తీసుకెళ్లండి.
