source:
  edition: WLC
  text: וַ/יַּ֞ךְ בְּ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ כִּ֤י רָאוּ֙ בַּ/אֲר֣וֹן יְהוָ֔ה וַ/יַּ֤ךְ בָּ/עָם֙ שִׁבְעִ֣ים אִ֔ישׁ חֲמִשִּׁ֥ים אֶ֖לֶף אִ֑ישׁ וַ/יִּֽתְאַבְּל֣וּ הָ/עָ֔ם כִּֽי הִכָּ֧ה יְהוָ֛ה בָּ/עָ֖ם מַכָּ֥ה גְדוֹלָֽה־־
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
translation:
  language: te
  text: యెహోవా మందసంలోకి చూసినందుకు యెహోవా బేత్షెమెషు మనుష్యుల్లో కొందరిని హతమార్చాడు.[a] ప్రజల్లో డెబ్బై మందిని, యాభై వేల మందిని ఆయన హతమార్చాడు.[b] యెహోవా ప్రజలపై గొప్ప దెబ్బ కొట్టినందుకు ప్రజలు దుఃఖించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా మందసాన్ని చూసినందుకు.” హీబ్రూ ఉపసర్గకు సాధారణంగా “చూడటం” అనే అర్థం కూడా రావచ్చు; అయితే ఈ సందర్భంలో “మందసంలోకి చూడటం” అపరాధాన్ని సూచించే అవకాశముంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠం అక్షరార్థంగా, “డెబ్బై మంది, యాభై వేల మంది” అని ఉంది. ఈ క్లిష్టమైన పదబంధాన్ని “యాభై వేల మందిలో డెబ్బై మంది” అనీ, “యాభై వేల డెబ్బై మంది” అనీ అర్థం చేసుకోవచ్చు; లేదా ఇది పాఠసంబంధమైన సమస్య కావచ్చు. కొన్ని ప్రాచీన పాఠసాక్ష్యాలు చాలా చిన్న సంఖ్యకు మద్దతిస్తాయి.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: హతమార్చాడు / కొట్టినందుకు
  rationale: తీర్పు సందర్భంలో మొదటి రెండు ప్రయోగాలు మరణాన్ని సూచిస్తున్నందున ‘హతమార్చాడు’ అని అనువదించాం; చివరి מַכָּהతో ఉన్న పదసంబంధాన్ని చూపేందుకు చివరి ప్రయోగంలో ‘కొట్టినందుకు’ అని ఉంచాం.
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: బేత్షెమెషు మనుష్యుల్లో కొందరిని
  rationale: בְּ అనే ఉపసర్గ ఇక్కడ సమూహంలో కొంతమందిని సూచించే భావాన్ని ఇస్తుంది; అందుకే మొత్తం పట్టణపు మనుష్యులందరూ అనే అపార్థాన్ని నివారించాం.
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  choice: యెహోవా మందసంలోకి చూసినందుకు
  rationale: ראה + ב నిర్మాణం ‘చూడటం’ లేదా సందర్భానుసారం ‘లోపలికి చూడటం’ అనే భావాలు ఇవ్వగలదు. కథనంలోని అపరాధ సందర్భానికి ‘మందసంలోకి చూశారు’ సహజంగా సరిపోతుంది; విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֲרוֹן יְהוָה
  choice: యెహోవా మందసం
  rationale: దైవనామాన్ని పేరుగానే నిలుపుతూ, אֲרוֹןకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘మందసం’ ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  choice: డెబ్బై మందిని, యాభై వేల మందిని
  rationale: మసొరా పాఠంలోని క్లిష్టమైన సంఖ్యా వరుసను ప్రధాన పాఠంలో పరిష్కరించకుండా యథాతథంగా ప్రతిబింబించాం; సాధ్యమైన వివరణలను పాదటిప్పణిలో తెలిపాం.
- source_word: וַיִּתְאַבְּלוּ
  choice: దుఃఖించారు
  rationale: אבל యొక్క హిత్పయేల్ రూపం మరణం లేదా విపత్తు కారణంగా శోకించడాన్ని సూచిస్తుంది; ‘దుఃఖించారు’ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: מַכָּה גְדוֹלָה
  choice: గొప్ప దెబ్బ
  rationale: מַכָּהలోని ‘దెబ్బ/ప్రహారం’ భావాన్ని నిలిపి, వ్యాధి లేదా వధ వంటి మరింత నిర్దిష్ట అర్థాన్ని పాఠంలోకి చేర్చలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. దానిని బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: మసొరా పాఠంలోని క్లిష్టమైన మృతుల సంఖ్య
  choice: ‘డెబ్బై మందిని, యాభై వేల మందిని’ అనే వరుసను ప్రధాన పాఠంలో నిలిపివేయడం
  alternative: ‘యాభై వేల మందిలో డెబ్బై మందిని’ లేదా ‘యాభై వేల డెబ్బై మందిని’; కొన్ని ప్రాచీన సాక్ష్యాల ప్రకారం చిన్న సంఖ్య
  rationale: హీబ్రూ వాక్యనిర్మాణం అసాధారణంగా ఉండి పాఠసంబంధమైన, వ్యాఖ్యానసంబంధమైన అనిశ్చితిని కలిగిస్తుంది. దాన్ని మౌనంగా పరిష్కరించకుండా ప్రధాన పాఠంలో ఉద్రిక్తతను నిలిపి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
- issue: మందసాన్ని చూడటంలో అపరాధ స్వభావం
  choice: ‘మందసంలోకి చూసినందుకు’
  alternative: ‘మందసాన్ని చూసినందుకు’
  rationale: సందర్భం ‘లోపలికి చూడటం’ అనే భావానికి అనుకూలమైనప్పటికీ, హీబ్రూ ఉపసర్గ విస్తృతమైన ‘చూడటం’ భావాన్నీ అనుమతిస్తుంది; అందువల్ల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వచన గాంభీర్యాన్ని నిలిపే శైలి. స్థలనామం ‘బేత్షెమెషు’, దైవనామం ‘యెహోవా’, పవిత్ర పెట్టెకు సుపరిచితమైన ‘మందసం’ వాడాం. క్లిష్ట సంఖ్యను సవరించకుండా పాఠంలో నిలిపాం.
