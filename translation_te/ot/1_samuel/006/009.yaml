id: 1SA.6.9
reference: 1 Samuel 6:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
translation:
  language: te
  text: '“మీరు గమనించండి: అది తన ప్రాంతానికి వెళ్లే మార్గంలో బేత్‌షెమెషుకు ఎక్కి వెళితే, మనకు ఈ గొప్ప విపత్తు[a] కలిగించినవాడు ఆయనే. అలా వెళ్లకపోతే, మనలను తాకింది ఆయన చెయ్యి కాదని, ఇది మనకు యాదృచ్ఛికంగా జరిగిందని[b] తెలుసుకుంటాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ గొప్ప హాని” లేదా “ఈ గొప్ప విపత్కర స్థితి.” హీబ్రూ పదం నైతిక దుష్టత్వాన్ని తప్పనిసరిగా సూచించకుండా తీవ్రమైన హాని లేదా విపత్తును సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇది మనకు సంభవించిన యాదృచ్ఛిక ఘటన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: మీరు గమనించండి
  rationale: బండి వెళ్లే దిశను జాగ్రత్తగా చూసి ఫలితాన్ని నిర్ధారించమనే బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דֶּרֶךְ גְּבוּלוֹ
  choice: తన ప్రాంతానికి వెళ్లే మార్గంలో
  rationale: דֶּרֶךְ అనే ‘మార్గం’ భావాన్నీ, גְּבוּל అనే ‘సరిహద్దు/ప్రాంతం’ భావాన్నీ నిలుపుతూ, గమ్యం ఇశ్రాయేలు ప్రాంతమనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יַעֲלֶה
  choice: ఎక్కి వెళితే
  rationale: עלה యొక్క ‘పైకి వెళ్లడం’ అనే భౌగోళిక చలన భావాన్ని నిలుపుతుంది.
- source_word: בֵּית שֶׁמֶשׁ
  choice: బేత్‌షెమెషు
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: הוּא עָשָׂה לָנוּ
  choice: మనకు ... కలిగించింది ఆయనే
  rationale: స్వతంత్ర సర్వనామం הוּא లోని నొక్కిచెప్పే భావాన్ని ‘ఆయనే’ ద్వారా నిలుపుతుంది.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: ఈ గొప్ప విపత్తు
  rationale: רָעָה ఇక్కడ నైతిక దుష్టత్వం కంటే తీవ్రమైన హాని లేదా విపత్తును సూచిస్తుంది; ‘విపత్తు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: יָדוֹ נָגְעָה בָּנוּ
  choice: మనలను తాకింది ఆయన చెయ్యి
  rationale: దేవుని క్రియాశీల శక్తి లేదా తీర్పును సూచించే ‘చెయ్యి తాకడం’ అనే మూల రూపకాన్ని తెలుగులో నిలుపుతుంది.
- source_word: מִקְרֶה הוּא הָיָה לָנוּ
  choice: ఇది మనకు యాదృచ్ఛికంగా జరిగింది
  rationale: מִקְרֶה లోని అనుకోకుండా లేదా యాదృచ్ఛికంగా సంభవించిన ఘటన అనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని చర్యకు సంబంధించిన רָעָה పదం అనువాదం
  choice: ఈ గొప్ప విపత్తు
  alternative: ఈ గొప్ప హాని / ఈ గొప్ప కీడు
  rationale: వచనం తీవ్రమైన బాధను దేవుని చర్యగా పరీక్షిస్తుంది; ‘విపత్తు’ ఆ తీర్పు తీవ్రతను తగ్గించకుండా, దేవునికి నైతిక దుష్టత్వాన్ని ఆపాదించకుండా మూలంలోని అర్థపరిధిని కాపాడుతుంది.
- issue: దైవిక చర్యా లేక యాదృచ్ఛిక ఘటననా అనే వక్తల పరీక్ష
  choice: వారు ప్రతిపాదించిన రెండు అవకాశాలనూ తీర్మానించకుండా యథాతథంగా ఉంచడం
  alternative: ఘటన తప్పనిసరిగా దేవుని చర్యేనని వచనంలోనే వివరణ జోడించడం
  rationale: ఈ వచనంలో ఫిలిష్తీయులు ఏర్పాటు చేసిన పరీక్ష మరియు వారి తర్కం మాత్రమే చెప్పబడుతున్నాయి; అనువాదం తరువాతి ఫలితాన్ని ముందుగానే చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ప్రత్యక్ష సంభాషణ స్వరాన్ని, ‘ఆయనే’ అనే నొక్కిచెప్పే భావాన్ని, ‘చెయ్యి’ అనే మూల రూపకాన్ని నిలుపుకుంది. మూలంలోని పరీక్షాత్మక అనిశ్చితిని పరిష్కరించకుండా అలాగే ఉంచింది.
