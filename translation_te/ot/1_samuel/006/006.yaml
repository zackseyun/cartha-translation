source:
  edition: WLC
  text: וְ/לָ֤/מָּה תְכַבְּדוּ֙ אֶת לְבַבְ/כֶ֔ם כַּ/אֲשֶׁ֧ר כִּבְּד֛וּ מִצְרַ֥יִם וּ/פַרְעֹ֖ה אֶת לִבָּ֑/ם הֲ/לוֹא֙ כַּ/אֲשֶׁ֣ר הִתְעַלֵּ֣ל בָּ/הֶ֔ם וַֽ/יְשַׁלְּח֖וּ/ם וַ/יֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
translation:
  language: te
  text: అయితే ఐగుప్తు, ఫరో తమ హృదయాలను కఠినపరచుకున్నట్లుగా మీరెందుకు మీ హృదయాలను కఠినపరచుకుంటున్నారు?[a] ఆయన వారితో కఠినంగా వ్యవహరించినప్పుడు, వారు వీరిని పంపివేసి, వీరు వెళ్లిపోలేదా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కఠినపరచుకోవడం’ అని అనువదించిన హీబ్రూ నుడికారానికి అక్షరార్థం ‘హృదయాన్ని భారంగా చేసుకోవడం.’
    reason: lexical_alternative
  - marker: b
    text: ‘వారితో’ అనేది ఐగుప్తు, ఫరోను సూచిస్తుంది; ‘వీరిని’ మరియు ‘వీరు’ అనేవి ఇశ్రాయేలీయులను సూచిస్తాయి.
    reason: cross_reference
lexical_decisions:
- source_word: תְכַבְּדוּ / כִּבְּדוּ
  choice: కఠినపరచుకుంటున్నారు / కఠినపరచుకున్నారు
  rationale: כבד అనే మూలపదానికి అక్షరార్థంగా ‘భారంగా చేయడం’ అనే భావం ఉన్నా, ‘హృదయం’తో కూడిన ఈ సందర్భంలో మొండిగా చేసుకోవడం లేదా కఠినపరచుకోవడం అనే నుడికారార్థం ఉంది. కర్తలే తమ హృదయాలపై చేసిన క్రియను తెలుగులో సహజంగా తెలియజేయడానికి ఆత్మార్థక రూపం వాడబడింది.
- source_word: לְבַבְכֶם / לִבָּם
  choice: మీ హృదయాలను / తమ హృదయాలను
  rationale: హీబ్రూ ‘హృదయం’ అంతరంగ సంకల్పం, ఆలోచన, వైఖరిని సూచిస్తుంది. బహువచన సంబోధనను తెలుగులో స్పష్టంగా ఉంచింది.
- source_word: מִצְרַיִם וּפַרְעֹה
  choice: ఐగుప్తు, ఫరో
  rationale: మూలంలోని ప్రదేశనామం ‘ఐగుప్తు’ అక్కడి ప్రజలను లేదా పాలక వ్యవస్థను సమష్టిగా సూచిస్తుంది; దాని రూపకల్పనను అలాగే నిలిపింది.
- source_word: הִתְעַלֵּל בָּהֶם
  choice: ఆయన వారితో కఠినంగా వ్యవహరించినప్పుడు
  rationale: ఈ రూపం ఇక్కడ తీవ్రంగా లేదా కఠినంగా వ్యవహరించడాన్ని సూచిస్తుంది. కర్త మూలంలో ప్రత్యక్ష నామవాచకంగా లేకపోవడంతో ‘ఆయన’ అని మాత్రమే ఉంచి, దేవుడు అనే పేరును పాఠ్యంలో చేర్చలేదు.
- source_word: וַיְשַׁלְּחוּם
  choice: వారు వీరిని పంపివేయగా
  rationale: שלח ఇక్కడ పంపివేయడం లేదా వెళ్లనివ్వడం అనే భావం ఇస్తుంది. రెండు వేర్వేరు సమూహాలను సూచించే సర్వనామాల గందరగోళాన్ని తెలుగులో ‘వారు/వీరిని’తో కొంత స్పష్టంచేసి, వివరణను పాదసూచికలో ఇచ్చింది.
- source_word: וַיֵּלֵכוּ
  choice: వీరు వెళ్లిపోయారు
  rationale: הלך యొక్క సరళమైన గమనార్థాన్ని, హీబ్రూ వాక్యంలోని సంక్షిప్త వరుసను సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: הִתְעַלֵּל అనే క్రియకు అంతర్లీన కర్త
  choice: ‘ఆయన’ అని ఉంచి, సందర్భానుసారంగా దేవుణ్ణి సూచించేలా అనువదించడం
  alternative: ‘వారికి కీడు జరిగినప్పుడు’ వంటి కర్తలేని నిర్మాణం
  rationale: నిర్గమ సంఘటనల నేపథ్యం కర్త దేవుడని సూచిస్తుంది; అయితే హీబ్రూ ఈ వాక్యంలో ఆయన పేరును స్పష్టంగా చెప్పదు. అందువల్ల దేవుడు అనే నామాన్ని చేర్చకుండా మూలంలోని అంతర్లీనతను కాపాడింది.
- issue: రెండు ‘వారు’ సూచనల భేదం
  choice: మొదటి సమూహాన్ని ఐగుప్తు, ఫరోగా; పంపివేయబడిన సమూహాన్ని ఇశ్రాయేలీయులుగా అర్థం చేసుకోవడం
  alternative: సర్వనామాలను వివరణ లేకుండా ఒకే రూపంలో ఉంచడం
  rationale: నిర్గమ కథనమే సూచనలను నిర్ణయిస్తుంది. పాఠ్యంలో పేర్లను అదనంగా చేర్చకుండా, పాదసూచికలో వాటిని స్పష్టం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడింది. మూలంలోని అలంకారప్రశ్నను ‘కదా?’తో నిలిపి, హృదయాన్ని భారంగా చేయడం అనే హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో అర్థానువాదంగా, పాదసూచికలో అక్షరార్థంగా ఇచ్చింది.
