id: 1SA.6.15
reference: 1 Samuel 6:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם הוֹרִ֣ידוּ אֶת אֲר֣וֹן יְהוָ֗ה וְ/אֶת הָ/אַרְגַּ֤ז אֲשֶׁר אִתּ/וֹ֙ אֲשֶׁר בּ֣/וֹ כְלֵֽי זָהָ֔ב וַ/יָּשִׂ֖מוּ אֶל הָ/אֶ֣בֶן הַ/גְּדוֹלָ֑ה וְ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ הֶעֱל֨וּ עֹל֜וֹת וַֽ/יִּזְבְּח֧וּ זְבָחִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא לַֽ/יהוָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
translation:
  language: te
  text: లేవీయులు యహ్వే[a] మందసాన్ని, దానితోపాటు ఉన్న పెట్టెను దించారు; ఆ పెట్టెలో బంగారు వస్తువులు[b] ఉన్నాయి. వారు వాటిని ఆ పెద్ద రాతిమీద ఉంచారు. బేత్-షెమెషు పురుషులు ఆ రోజున యహ్వేకు దహనబలులు అర్పించి, బలులు అర్పించారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH (יהוה); సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ పదం బంగారంతో చేసిన పాత్రలు, పరికరాలు లేదా ఇతర వస్తువులను విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో క్రియ, కర్మ ఒకే ధాతువుకు చెందినవి; అక్షరార్థంగా, ‘బలులను బలి అర్పించారు’ అనే పునరుక్తి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: הוֹרִידוּ
  choice: దించారు
  rationale: హిఫిల్ రూపం మందసాన్ని, పెట్టెను ఉన్న స్థలం నుంచి కిందికి దింపడాన్ని సూచిస్తుంది; సందర్భంలో బండి ఉన్నప్పటికీ మూల వాక్యంలో దానిని మళ్లీ స్పష్టంగా చేర్చలేదు.
- source_word: אֲרוֹן יְהוָה
  choice: యహ్వే మందసం
  rationale: ఆరాధన సంబంధమైన ఈ ప్రత్యేక పెట్టెకు ‘మందసం’ సహజమైన బైబిలు తెలుగు పదం; దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- source_word: הָאַרְגַּז
  choice: పెట్టె
  rationale: ఇది మందసానికి భిన్నంగా, దానితోపాటు ఉన్న సాధారణ వస్తు-పెట్టెను సూచిస్తుంది.
- source_word: אֲשֶׁר אִתּוֹ
  choice: దానితోపాటు ఉన్న
  rationale: పెట్టె మందసంతో కలిసి ఉన్నదనే సరళ సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר בּוֹ כְלֵי זָהָב
  choice: ఆ పెట్టెలో బంగారు వస్తువులు ఉన్నాయి
  rationale: כְּלֵי అనే విస్తృతార్థక పదం పాత్రలు, పరికరాలు లేదా ఇతర వస్తువులను సూచించవచ్చు; వాటి స్వరూపాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘వస్తువులు’ అని అనువదించాం.
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: వాటిని ఆ పెద్ద రాతిమీద ఉంచారు
  rationale: שׂים తో కూడిన אֶל ఇక్కడ రాతిపై ఉంచడాన్ని సహజంగా సూచిస్తుంది; సందర్భానుసారమైన ప్రధాన అర్థాన్ని ఇచ్చాం.
- source_word: וְאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: బేత్-షెమెషు పురుషులు
  rationale: אַנְשֵׁי అనే పుంలింగ రూపాన్ని లింగనిర్దిష్టంగా నిలుపుతూ, స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: הֶעֱלוּ עֹלוֹת
  choice: దహనబలులు అర్పించి
  rationale: పూర్తిగా దహనం చేసే బలులను సూచించే స్థిరమైన బలిసంబంధ పదబంధం.
- source_word: וַיִּזְבְּחוּ זְבָחִים
  choice: ఇతర బలులు కూడా అర్పించారు
  rationale: హీబ్రూలోని సమానధాతు క్రియా-కర్మ పునరుక్తిని తెలుగులో యాంత్రికంగా ఉంచితే అసహజంగా ఉంటుంది. ముందున్న దహనబలుల నుంచి వీటిని వేరుచూపేందుకు ‘ఇతర’ అని, సమన్వయాన్ని చూపేందుకు ‘కూడా’ అని ఇచ్చాం; మూల నిర్మాణాన్ని పాదసూచికలో తెలిపాం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాలసూచక పదబంధానికి సహజమైన, సూటి తెలుగు సమానం.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: ల ఉపసర్గ బలుల గ్రహీతను సూచిస్తుంది; దైవనామాన్ని లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: אַנְשֵׁי అనే పుంలింగ పదం
  choice: బేత్-షెమెషు పురుషులు
  alternative: బేత్-షెమెషు ప్రజలు
  rationale: మూల పాఠంలోని వ్యాకరణ పుంలింగాన్ని నిలిపాం; ఈ సందర్భం తప్పనిసరిగా మొత్తం జనాభాను ఉద్దేశిస్తుందని నిర్ధారించదు.
- issue: దహనబలులు మరియు זְבָחִים మధ్య సంబంధం
  choice: దహనబలులు అర్పించి, ఇతర బలులు కూడా అర్పించారు
  alternative: దహనబలులు అర్పించి, బలులను బలిగా అర్పించారు
  rationale: రెండు బలి చర్యల మధ్య భేదాన్ని నిలుపుతూ, హీబ్రూ సమానధాతు పునరుక్తిని అసహజమైన తెలుగుగా మార్చకుండా భావాన్ని స్పష్టంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథనశైలి వాడబడింది. ‘మందసం,’ ‘దహనబలులు’ వంటి స్థిరమైన బైబిలు పదాలను సాధారణ పాఠకుడికి అర్థమయ్యే సరళ వాక్యనిర్మాణంతో కలిపాం. హీబ్రూ వాక్యంలోని పొడవైన సంబంధవాచక నిర్మాణాన్ని రెండు వాక్యాలుగా విభజించి స్పష్టత పెంచాం.
