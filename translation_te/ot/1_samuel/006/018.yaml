id: 1SA.6.18
reference: 1 Samuel 6:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
translation:
  language: te
  text: బంగారు ఎలుకల సంఖ్య ఐదుగురు పాలకులకు చెందిన ఫిలిష్తీయుల పట్టణాలన్నిటి సంఖ్యకు అనుగుణంగా ఉంది—కోటగల పట్టణం నుండి ప్రాకారంలేని గ్రామం వరకు, అలాగే వారు యాహ్వే మందసాన్ని దింపిన పెద్ద రాయి[a] వరకు. ఆ రాయి నేటివరకు బేత్షెమెషీయుడైన యెహోషువ పొలంలో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మహా ఆబేలు వరకు.” హెబ్రీ పాఠాన్ని ఇక్కడ స్థలనామంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: బంగారు ఎలుకలు
  rationale: עַכְבָּר ఎలుక లేదా పెద్ద ఎలుకను సూచించగలదు. తెగులు సంబంధిత ప్రతిమల సందర్భంలో సాధారణ పాఠకులకు సహజమైన, విస్తృతంగా అర్థమయ్యే ‘ఎలుకలు’ను ఎంచుకున్నాం.
- source_word: מִסְפַּר כָּל עָרֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల పట్టణాలన్నిటి సంఖ్యకు సమానంగా
  rationale: מִסְפַּר ఇక్కడ సంఖ్యాపరమైన సరిపోలికను తెలియజేస్తుంది; తెలుగు వాక్యంలో ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  choice: ఐదుగురు పాలకుల ఆధీనంలో ఉన్న
  rationale: סְרָנִים అనేది ఫిలిష్తీయుల ప్రధాన పాలకులకు వాడిన ప్రత్యేక బిరుదు. ‘పాలకులు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది; సంబంధాన్ని ‘ఆధీనంలో ఉన్న’ అని తెలిపాం.
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  choice: కోటగల పట్టణం మొదలుకొని ప్రాకారంలేని గ్రామం వరకు
  rationale: ఈ పదబంధం రక్షణ ఏర్పాట్లు గల పట్టణం నుంచి బహిరంగ గ్రామం వరకు అన్ని రకాల నివాస ప్రాంతాలను చేర్చుతుంది. ‘ప్రాకారంలేని’ అనే మాట మూలంలోని వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  choice: అలాగే ... పెద్ద రాయి వరకు
  rationale: మసొరా వ్యంజన పాఠం ‘గొప్ప ఆబేలు’ అనే స్థలనామంగా అర్థమవగలిగినా, దానిపై మందసాన్ని ఉంచారనే వెంటనే వచ్చే ఉపవాక్యం మరియు సమీప సందర్భంలోని పెద్ద రాయి ప్రస్తావన ‘పెద్ద రాయి’ అనే సందర్భార్థానికి బలం ఇస్తాయి. స్థలనామ పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר הִנִּיחוּ עָלֶיהָ אֵת אֲרוֹן יְהוָה
  choice: వారు యాహ్వే మందసాన్ని దింపి ఉంచిన
  rationale: הִנִּיחוּ అంటే దింపి ఉంచడం లేదా నిలిపి ఉంచడం. ప్రయాణించి వచ్చిన మందసాన్ని రాయిపై ఉంచిన కథన చర్యకు ‘దింపి ఉంచిన’ సహజంగా సరిపోతుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకూ ... ఉంది
  rationale: రచనాకాలం వరకు ఆ గుర్తు అక్కడ కొనసాగి ఉందనే భావాన్ని తెలుగులో పూర్తి వాక్యంగా స్పష్టం చేస్తుంది.
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: బేత్షెమెషీయుడైన యెహోషువ పొలంలో
  rationale: בֵּית הַשִּׁמְשִׁי అనేది బేత్షెమెషుకు చెందిన వ్యక్తిని సూచించే జననామ రూపం. ‘బేత్షెమెషీయుడు’ ఆ రూపాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని పొడవైన నిర్మాణాన్ని చదవడానికి అనువుగా రెండు వాక్యాలుగా విభజించాం; అయితే పట్టణాల విస్తృతి, రాయి స్థానం, ‘ఈ రోజు వరకూ’ అనే కాలసూచన అన్నీ నిలిపాం.
