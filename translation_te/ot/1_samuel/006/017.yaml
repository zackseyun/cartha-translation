source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ טְחֹרֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֨ר הֵשִׁ֧יבוּ פְלִשְׁתִּ֛ים אָשָׁ֖ם לַֽ/יהוָ֑ה לְ/אַשְׁדּ֨וֹד אֶחָ֜ד לְ/עַזָּ֤ה אֶחָד֙ לְ/אַשְׁקְל֣וֹן אֶחָ֔ד לְ/גַ֥ת אֶחָ֖ד לְ/עֶקְר֥וֹן אֶחָֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
translation:
  language: te
  text: 'ఫిలిష్తీయులు యాహ్వేకు అపరాధ పరిహార అర్పణగా తిరిగి పంపిన బంగారు గడ్డలు[a] ఇవే: అష్డోదు కోసం ఒకటి, గాజా కోసం ఒకటి, అష్కెలోను కోసం ఒకటి, గాతు కోసం ఒకటి, ఎక్రోను కోసం ఒకటి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బంగారు వాపులు’; హీబ్రూ పదం ఈ కానుకల ద్వారా సూచించబడిన శరీర బాధను తెలియజేస్తుంది. సంప్రదాయంగా దీన్ని మరింత నిర్దిష్టంగా ‘మూలవ్యాధి’ అని అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇవే
  rationale: ఈ పదబంధం ముందున్న సందర్భంతో అనుసంధానిస్తూ, ఇప్పుడు వివరించబోయే జాబితాను సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది.
- source_word: טְחֹרֵי הַזָּהָב
  choice: బంగారు గడ్డలు
  rationale: ఈ కథనంలో శరీరానికి వచ్చిన బాధను సూచించే బంగారు ప్రతిరూపాలు ఉద్దేశించబడ్డాయి. ‘గడ్డలు’ అనేది మరీ నిర్దిష్టమైన వైద్యార్థాన్ని బలవంతంగా రుద్దకుండా మూలపద భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר הֵשִׁיבוּ
  choice: తిరిగి పంపిన
  rationale: హిఫిల్ రూపంలోని שׁוב ఇక్కడ ‘తిరిగి పంపడం’ అనే భావాన్ని ఇస్తుంది; మందసాన్ని తిరిగి పంపిన సందర్భానికి ఇదే సహజంగా సరిపోతుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహానికి తెలుగులో స్థిరపడిన రూపాన్ని ఉపయోగించాం.
- source_word: אָשָׁם
  choice: అపరాధ పరిహార అర్పణగా
  rationale: אָשָׁם అపరాధంతో పాటు దానికి చేయవలసిన పరిహారాన్ని కూడా సూచిస్తుంది. ఈ సందర్భంలోని పరిహార స్వభావాన్ని ‘అపరాధ పరిహార అర్పణ’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ పాఠంలోని దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: לְאַשְׁדּוֹד אֶחָד ... לְעֶקְרוֹן אֶחָד
  choice: అష్డోదు కోసం ఒకటి ... ఎక్రోను కోసం ఒకటి
  rationale: ప్రతి ఫిలిష్తీయ పట్టణానికి ఒక బంగారు ప్రతిరూపం చొప్పున ఉన్నదని పునరుక్తమైన לְ ... אֶחָד నిర్మాణం తెలుపుతుంది; దానిని తెలుగులో స్పష్టంగా పునరావృతం చేశాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దేవుని ఒడంబడిక నామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా, మూల ఉచ్చారణను ప్రతిబింబించే ‘యాహ్వే’ రూపాన్ని ఎంచుకున్నాం.
- issue: אָשָׁם యొక్క బలి సంబంధిత భావం
  choice: అపరాధ పరిహార అర్పణ
  alternative: అపరాధ అర్పణ
  rationale: ఈ సందర్భంలో అర్పణ అపరాధాన్ని అంగీకరించడమే కాక నష్టపరిహార లేదా పరిహార చర్యగా కూడా పనిచేస్తుంది. అందుకే రెండు భావాలనూ నిలిపే పదబంధాన్ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. పట్టణాల జాబితాలోని హీబ్రూ పునరుక్తిని స్పష్టత కోసం నిలిపాం; వ్యాధి స్వరూపంపై మూలంలోని అనిశ్చితిని పాదసూచికలో భద్రపరిచాం.
