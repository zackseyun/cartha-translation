source:
  edition: WLC
  text: כָּ/עֵ֣ת מָחָ֡ר אֶשְׁלַח֩ אֵלֶ֨י/ךָ אִ֜ישׁ מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מְשַׁחְתּ֤/וֹ לְ/נָגִיד֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הוֹשִׁ֥יעַ אֶת עַמִּ֖/י מִ/יַּ֣ד פְּלִשְׁתִּ֑ים כִּ֤י רָאִ֨יתִי֙ אֶת עַמִּ֔/י כִּ֛י בָּ֥אָה צַעֲקָת֖/וֹ אֵלָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
translation:
  language: te
  text: “రేపు ఇదే సమయానికి బెన్యామీను ప్రాంతం నుండి ఒక మనిషిని నీ వద్దకు పంపుతాను. నా ప్రజలైన ఇశ్రాయేలుపై పాలకునిగా[a] అతనిని అభిషేకించాలి. అతడు ఫిలిష్తీయుల చేతి నుండి నా ప్రజలను రక్షిస్తాడు. ఎందుకంటే నేను నా ప్రజలను చూశాను; వారి మొర నాకు చేరినందున.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘నాగీద్.’ దీనిని ‘నాయకుడు’ లేదా సంప్రదాయంగా ‘అధిపతి’ అని కూడా అనువదించవచ్చు. ఇది కేవలం గౌరవ బిరుదు కాక, పరిపాలించడానికి నియమించబడిన వ్యక్తిని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת מָחָר
  choice: రేపు ఇదే సమయానికి
  rationale: ఈ హీబ్రూ కాలసూచక ప్రయోగం మరుసటి రోజు సుమారు ఇదే వేళను సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘రేపు ఇదే సమయానికి’ అని అనువదించబడింది.
- source_word: מֵאֶרֶץ בִּנְיָמִן
  choice: బెన్యామీను ప్రాంతం నుంచి
  rationale: אֶרֶץ ఇక్కడ గోత్రానికి చెందిన భూభాగం లేదా ప్రాంతాన్ని సూచిస్తుంది; ‘ప్రాంతం’ ఆ భౌగోళిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְנָגִיד
  choice: పాలకునిగా
  rationale: נָגִיד దేవునిచేత నియమించబడి ప్రజలపై పరిపాలన చేసే వ్యక్తిని సూచిస్తుంది. ‘పాలకుడు’ అధికార భావాన్ని నిలుపుతూ, ‘రాజు’ అని మూలపదానికి మించిన నిర్దిష్టతను చేర్చదు.
- source_word: וְהוֹשִׁיעַ
  choice: అతడు ... రక్షిస్తాడు
  rationale: యాషా ధాతువు ప్రమాదం లేదా శత్రు ఆధిపత్యం నుంచి విడిపించడం, కాపాడడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో నియమించబడిన పాలకుని ద్వారా కలిగే భవిష్యత్ రక్షణను ఇది తెలియజేస్తుంది.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల చేతిలో నుంచి
  rationale: ‘చేతి’ అధికారం లేదా ఆధిపత్యానికి హీబ్రూ రూపకం. తెలుగులో కూడా అర్థమయ్యే ఈ రూపకాన్ని నిలుపుకున్నాం.
- source_word: כִּי רָאִיתִי אֶת עַמִּי
  choice: ఎందుకంటే నేను నా ప్రజలను చూశాను
  rationale: మూలంలోని ప్రత్యక్షమైన, కొంత ఉద్విగ్నత కలిగిన మాటనే నిలుపుతుంది; ‘వారి బాధను చూశాను’ వంటి వివరణను పాఠ్యంలో చేర్చలేదు.
- source_word: צַעֲקָתוֹ
  choice: వారి మొర
  rationale: హీబ్రూలో ప్రత్యయం వ్యాకరణపరంగా ఏకవచనమైనా, అది సమూహవాచకమైన ‘నా ప్రజలు’ను తిరిగి సూచిస్తుంది. తెలుగులో సహజమైన సమూహ సూచనగా ‘వారి’ వాడబడింది.
theological_decisions:
- issue: సౌలు పదవికి נָגִיד అనే పదాన్ని ఎలా అనువదించాలి
  choice: పాలకుడు
  alternative: నాయకుడు; అధిపతి; రాజకుమారుడు
  rationale: ఈ పదం ఇశ్రాయేలుపై దేవుడు నియమించిన పరిపాలనా అధికారాన్ని సూచిస్తుంది; అయితే ఇక్కడ దానిని నేరుగా ‘రాజు’గా మార్చడం మూలపదంలోని ప్రత్యేకతను తగ్గించవచ్చు. ‘పాలకుడు’ రాజకీయ అధికారాన్ని తెలిపి ఆ తేడాను కాపాడుతుంది.
- issue: צַעֲקָתוֹ లోని సమూహవాచక ఏకవచనం
  choice: వారి మొర
  alternative: అతని మొర; దాని మొర
  rationale: ఏకవచన ప్రత్యయం సమూహవాచకమైన ‘నా ప్రజలు’ను సూచిస్తుంది. ‘వారి మొర’ తెలుగులో సహజంగా ఉండి, మొత్తం ప్రజల సమష్టి ఆర్తనాదాన్ని వ్యక్తపరుస్తుంది.
- issue: כִּי רָאִיתִי אֶת עַמִּי అనే వాక్యంలోని భావ ఉద్విగ్నత
  choice: నేను నా ప్రజలను చూశాను
  alternative: నేను నా ప్రజల బాధను చూశాను; నేను నా ప్రజలను లక్ష్యపెట్టాను
  rationale: మసొరెటిక్ పాఠంలో ‘బాధ’ అనే నామవాచకం లేదు. దేవుడు ప్రజలను గమనించాడనే భావం సందర్భంలో ఉన్నప్పటికీ, దాన్ని వివరణాత్మకంగా విస్తరించకుండా మూలంలోని సంక్షిప్తతను నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘అతణ్ణి’ వంటి ప్రస్తుత వ్యవహార రూపంతో పాటు ‘అభిషేకించాలి,’ ‘పాలకుడు’ వంటి బైబిలు సందర్భానికి తగిన గంభీర పదజాలం సమతుల్యం చేయబడింది. మూలంలోని ‘చేతిలో నుంచి’ అనే రూపకం, ‘నా ప్రజలను చూశాను’ అనే ఉద్దేశపూర్వక సంక్షిప్తత నిలుపబడ్డాయి.
