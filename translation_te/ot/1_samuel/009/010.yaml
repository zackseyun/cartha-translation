source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֧וּל לְ/נַעֲר֛/וֹ ט֥וֹב דְּבָרְ/ךָ֖ לְכָ֣/ה נֵלֵ֑כָה וַ/יֵּֽלְכוּ֙ אֶל הָ/עִ֔יר אֲשֶׁר שָׁ֖ם אִ֥ישׁ הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/010.yaml
  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
translation:
  language: te
  text: అప్పుడు సౌలు తన యువకునితో[a], “నీవు చెప్పిన మాట మంచిదే. రా, వెళ్దాం” అన్నాడు. అలా వారు దేవుని మనిషి[b] ఉన్న పట్టణానికి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకునితో,” “సహాయకునితో.”
    reason: lexical_alternative
  - marker: b
    text: “దేవుని మనిషి” అనేది సాధారణంగా ప్రవక్తకు లేదా దేవుని తరఫున మాట్లాడే వ్యక్తికి వాడే హీబ్రూ బిరుదు.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: యువకుడు
  rationale: మూలపదం ప్రాథమికంగా ‘యువకుడు’ అని సూచిస్తుంది; సందర్భంలో అతడు సౌలుకు సహాయకుడిగా ఉన్నప్పటికీ, ‘సేవకుడు’ అని పాత్రను మరీ నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: טוֹב דְּבָרְךָ
  choice: నీవు చెప్పిన మాట మంచిదే
  rationale: דָּבָר అనే పదానికి ‘మాట,’ ‘విషయం,’ ‘సలహా’ అనే భావాలు ఉండవచ్చు. ఇక్కడ ముందు చెప్పిన సూచనను సౌలు సమ్మతిస్తున్నందున, సహజమైన తెలుగులో ‘నీవు చెప్పిన మాట మంచిదే’ అని అనువదించడం పదార్థాన్నీ సందర్భాన్నీ కాపాడుతుంది.
- source_word: לְכָה נֵלֵכָה
  choice: రా, వెళ్దాం
  rationale: ఆహ్వానాత్మక ఆజ్ఞతో కూడిన సమూహ సంకల్పాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הָעִיר
  choice: పట్టణం
  rationale: עִיר నగరం లేదా పట్టణాన్ని సూచించగలదు. ఈ కథన సందర్భానికి ఆధునిక తెలుగులో ‘పట్టణం’ సహజంగా ఉంటుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ఇది ప్రవక్తకు లేదా దేవుని తరఫున మాట్లాడేవానికి వాడే హీబ్రూ బిరుదు. ‘ప్రవక్త’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలంలోని బిరుదును నేరుగా నిలుపుతుంది.
- source_word: אֲשֶׁר שָׁם
  choice: ఉన్న
  rationale: సాపేక్ష పదబంధం మరియు స్థలసూచక క్రియావిశేషణాన్ని తెలుగులో సహజంగా ‘ఉన్న’ అని వ్యక్తపరచవచ్చు.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים అనే బిరుదు అనువాదం
  choice: దేవుని మనిషి
  alternative: ప్రవక్త
  rationale: ఈ పదబంధం ప్రవక్తను సూచించే సంప్రదాయ బిరుదే అయినప్పటికీ, మూలపాఠం ‘ప్రవక్త’ అనే పదాన్ని ఉపయోగించలేదు. కాబట్టి దాని ప్రత్యేక దైవశాస్త్రీయ పదప్రయోగాన్ని కాపాడేందుకు బిరుదును నేరుగా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘రా, వెళ్దాం’ సంభాషణలోని ఆహ్వాన భావాన్ని నిలుపుతుంది; ‘దేవుని మనిషి’ మూలంలోని బిరుదును వ్యాఖ్యానాత్మక ప్రత్యామ్నాయం లేకుండా కాపాడుతుంది.
