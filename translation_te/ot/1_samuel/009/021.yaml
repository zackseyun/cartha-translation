  text: וַ/יַּ֨עַן שָׁא֜וּל וַ/יֹּ֗אמֶר הֲ/ל֨וֹא בֶן יְמִינִ֤י אָ֨נֹכִי֙ מִ/קַּטַנֵּי֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וּ/מִשְׁפַּחְתִּ/י֙ הַ/צְּעִרָ֔ה מִ/כָּֽל מִשְׁפְּח֖וֹת שִׁבְטֵ֣י בִנְיָמִ֑ן וְ/לָ֨/מָּה֙ דִּבַּ֣רְתָּ אֵלַ֔/י כַּ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
translation:
  language: te
  text: సౌలు జవాబిస్తూ, “నేను ఇశ్రాయేలు గోత్రాల్లో అతి చిన్నదైన బెన్యామీను గోత్రానికి చెందినవాడిని కాదా? బెన్యామీను గోత్రంలోని వంశాలన్నిటిలో నా వంశమే అత్యల్పమైనది కాదా? అలాంటప్పుడు నాతో ఇలాంటి మాట ఎందుకు మాట్లాడావు?[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాతో ఈ విధంగా ఎందుకు మాట్లాడావు?”
    reason: כַּדָּבָר הַזֶּה అనే పదబంధాన్ని పలికిన మాట విషయంగా లేదా మాట్లాడిన విధానంగా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וַיַּעַן שָׁאוּל וַיֹּאמֶר
  choice: సౌలు జవాబిస్తూ ... అన్నాడు
  rationale: హీబ్రూ కథన సూత్రంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే ద్వంద్వ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: הֲלוֹא בֶן־יְמִינִי אָנֹכִי
  choice: నేను ... బెన్యామీను గోత్రానికి చెందినవాడిని కాదా?
  rationale: הֲלוֹא అంగీకారాన్ని ఆశించే అలంకారిక ప్రశ్న. בֶן־יְמִינִי ఇక్కడ వ్యక్తిపేరు కాక గోత్రసభ్యత్వాన్ని సూచిస్తుంది.
- source_word: מִקְּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాల్లో అతి చిన్నదైన
  rationale: קטן ఇక్కడ సంఖ్యాపరమైన చిన్నదనంతో పాటు హోదా లేదా ప్రాముఖ్యతలో అల్పత్వాన్నీ సూచించవచ్చు; ‘అతి చిన్నదైన’ మూలంలోని సరిపోలిక బలాన్ని నిలుపుతుంది.
- source_word: וּמִשְׁפַּחְתִּי
  choice: నా వంశం
  rationale: מִשְׁפָּחָה గోత్రం కంటే చిన్నదైన విస్తృత బంధుత్వ సమూహం. తెలుగులో ‘వంశం’ ఈ సామాజిక విభాగాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַצְּעִרָה
  choice: అత్యల్పమైనది
  rationale: ఈ పదం పరిమాణం, హోదా లేదా ప్రాముఖ్యతలో అల్పత్వాన్ని సూచించగలదు. ‘అత్యల్పమైనది’ ఆ విస్తృతిని కాపాడుతూ మునుపటి ‘అతి చిన్నది’ అనే పదబంధపు పునరుక్తిని తగ్గిస్తుంది.
- source_word: מִכָּל מִשְׁפְּחוֹת שִׁבְטֵי בִנְיָמִן
  choice: బెన్యామీను గోత్రంలోని వంశాలన్నిటిలో
  rationale: రూపపరంగా ‘బెన్యామీను గోత్రాల’ అని ఉన్నా, సందర్భంలో బెన్యామీను అనే ఒక గోత్రంలోని బంధుత్వ విభాగాల మధ్య పోలిక ఉద్దేశించబడింది; తెలుగు రూపం అపార్థాన్ని నివారిస్తుంది.
- source_word: וְלָמָּה
  choice: అలాంటప్పుడు ... ఎందుకు
  rationale: ముందటి స్వీయ-అల్పత ప్రకటనల నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: דִּבַּרְתָּ אֵלַי
  choice: నాతో ... మాట్లాడావు
  rationale: דבר עם/אל నిర్మాణానికి సహజమైన తెలుగు సమానం; పూర్తి క్రియను ప్రత్యక్ష సంభాషణలో సాధారణ భూతకాలంగా అందిస్తుంది.
- source_word: כַּדָּבָר הַזֶּה
  choice: ఇలాంటి మాట
  rationale: דָּבָר ఇక్కడ పలికిన మాట లేదా సందేశ విషయాన్ని సూచిస్తుంది. ‘ఇలాంటి మాట’ మూలంలోని విషయం-కేంద్రీకృత భావాన్ని నిలుపుతుంది; ‘ఈ విధంగా’ అనే విధానార్థం కూడా సాధ్యమే.
