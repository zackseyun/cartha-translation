  text: Yahweh had revealed to Samuel one day before Saul came[a], saying,
translation:
  language: te
  text: 'సౌలు రావడానికి ఒక రోజు ముందు యెహోవా సమూయేలుకు ఇలా వెల్లడించి ఉండెను:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంతో అనువదించాం. వావ్‌ను ప్రత్యేకమైన ‘ఇప్పుడు’ అనే కాలసూచక పదంగా చూపలేదు.
- source_word: גָּלָה אֶת־אֹזֶן שְׁמוּאֵל
  choice: సమూయేలుకు ఈ విషయం వెల్లడిస్తూ
  rationale: అక్షరార్థంగా ‘సమూయేలు చెవిని తెరిచాడు/బయలుపరచాడు’ అనే హీబ్రూ నుడికారానికి ‘అతనికి తెలియజేశాడు/వెల్లడించాడు’ అనే భావం ఉంది. తరువాతి ప్రత్యక్ష వాక్యాన్ని సహజంగా కలపడానికి ‘ఈ విషయం వెల్లడిస్తూ’ అని ఇచ్చాం.
- source_word: יוֹם אֶחָד לִפְנֵי בּוֹא שָׁאוּל
  choice: సౌలు రావడానికి ఒక రోజు ముందు
  rationale: కాల సంబంధాన్ని సహజమైన ఆధునిక తెలుగు వాక్య నిర్మాణంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: వెల్లడిస్తూ,
  rationale: తరువాతి వచనంలోని ప్రత్యక్ష మాటకు పరిచయంగా పనిచేసే לֵאמֹרను తెలుగులో సహజంగా ప్రధాన క్రియతో కలిపాం.
theological_decisions:
- issue: దైవ నామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది; దానిని సాధారణ బిరుదుగా మార్చకుండా తెలుగు బైబిలు పాఠకులకు పరిచితమైన నామరూపాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన ప్రవాహం సహజంగా ఉండేలా, తరువాతి వచనంలోని ప్రత్యక్ష వాక్యంతో ఈ అసంపూర్ణ వాక్యాన్ని కలిపే విధంగా రూపొందించాం. గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి.
