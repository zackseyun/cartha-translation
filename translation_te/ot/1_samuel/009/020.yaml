source:
  edition: WLC
  text: וְ/לָ/אֲתֹנ֞וֹת הָ/אֹבְד֣וֹת לְ/ךָ֗ הַ/יּוֹם֙ שְׁלֹ֣שֶׁת הַ/יָּמִ֔ים אַל תָּ֧שֶׂם אֶֽת לִבְּ/ךָ֛ לָ/הֶ֖ם כִּ֣י נִמְצָ֑אוּ וּ/לְ/מִי֙ כָּל חֶמְדַּ֣ת יִשְׂרָאֵ֔ל הֲ/ל֣וֹא לְ/ךָ֔ וּ/לְ/כֹ֖ל בֵּ֥ית אָבִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
translation:
  language: te
  text: మూడు రోజుల క్రితం తప్పిపోయిన నీ ఆడ గాడిదల గురించి మనసు పెట్టకు; అవి దొరికాయి. ఇశ్రాయేలు కోరేదంతా ఎవరి కోసం? నీ కోసమూ, నీ తండ్రి ఇంటివారందరి కోసమూ కాదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలులో కోరదగినదంతా ఎవరిది? నీదీ, నీ తండ్రి ఇంటివారందరిదీ కాదా?” ఇక్కడి హీబ్రూ పదబంధం ఇశ్రాయేలు కోరేదాన్ని గానీ, ఇశ్రాయేలులో విలువైనదాన్ని గానీ సూచించవచ్చు. “నీ తండ్రి ఇల్లు” అంటే కేవలం తల్లిదండ్రులు, పిల్లలతో కూడిన కుటుంబం కాకుండా విస్తృత కుటుంబ లేదా వంశ గృహ సమూహం.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת
  choice: ఆడ గాడిదలు
  rationale: హీబ్రూ నామవాచకం ఆడ గాడిదలను స్పష్టంగా సూచిస్తుంది; తెలుగులో ఇది సహజంగానే ఉండి మూలంలోని వివరాన్ని నిలుపుతుంది.
- source_word: הָאֹבְדוֹת לְךָ הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  choice: మూడు రోజుల క్రితం తప్పిపోయిన నీ ఆడ గాడిదలు
  rationale: కాలప్రయోగాన్ని సహజ తెలుగు రూపమైన ‘మూడు రోజుల క్రితం’గా అందించి, తప్పిపోయిన స్థితిని నిలిపింది.
- source_word: אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  choice: వాటి గురించి మనసు పెట్టకు
  rationale: ‘హృదయాన్ని వాటివైపు ఉంచకు’ అనే హీబ్రూ నుడికారంలోని శ్రద్ధ/ఆందోళన భావాన్ని తెలుగులో అర్థమయ్యేలా, అయితే రూపకాన్ని కొంతవరకు నిలుపుతూ అనువదించింది.
- source_word: נִמְצָאוּ
  choice: అవి దొరికాయి
  rationale: నిఫాల్ పరిపూర్ణ క్రియ సూచించే కనుగొనబడిన ఫలితస్థితిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּלְמִי כָּל־חֶמְדַּת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కోరేదంతా ఎవరి కోసం?
  rationale: חֶמְדַּת అనే పదంలోని ‘కోరిక/కోరదగినది’ భావాలలో మొదటిదాన్ని ప్రధాన పాఠ్యంలో సహజంగా అందించింది; వస్తుగతమైన ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: הֲלוֹא לְךָ וּלְכֹל בֵּית אָבִיךָ
  choice: నీ కోసమూ, నీ తండ్రి ఇంటివారందరి కోసమూ కాదా?
  rationale: అంగీకారాన్ని ఆశించే అలంకార ప్రశ్నను నిలిపి, ‘తండ్రి ఇల్లు’ అనే వంశీయ గృహ సమూహాన్ని ‘తండ్రి ఇంటివారు’గా సహజంగా తెలిపింది.
theological_decisions:
- issue: ‘ఇశ్రాయేలు యొక్క חֶמְדַּת’ అనే సంక్షిప్త వాక్యభాగం భావం
  choice: ఇశ్రాయేలు కోరేదంతా సౌలు మరియు అతని తండ్రి ఇంటివారి కోసం అన్నట్లు, రాజరికాన్ని స్పష్టంగా చేర్చకుండా అనువదించడం
  alternative: ‘ఇశ్రాయేలులో కోరదగినదంతా ఎవరిది?’ లేదా ఇశ్రాయేలు కోరిన రాజరికానికి నేర సూచన
  rationale: సందర్భం సౌలు నియామకాన్ని సూచించినా, ఈ వచనం ‘రాజరికం’ అని స్పష్టంగా చెప్పదు. అందువల్ల ఆ భావాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని ఉద్వేగం, కొంత అస్పష్టత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు స్పష్టమైన శైలి. ‘మనసు పెట్టకు’ మూల నుడికారాన్ని సహజంగా నిలుపుతుంది; ‘తండ్రి ఇంటివారు’ ప్రాచీన కుటుంబ-వంశ నిర్మాణాన్ని అతిగా సాంకేతికంగా చేయకుండా తెలియజేస్తుంది.
