  terminology: “ఆడ గాడిదలు” మూలంలోని స్త్రీలింగ నిర్దిష్టతను సరిగ్గా నిలుపుతుంది. “తండ్రి ఇంటివారు” అనేది בֵּית אָבִיךָ అనే కుటుంబ/వంశ గృహసమూహ భావానికి తగిన, సహజ తెలుగు రూపం. “ఇశ్రాయేలు కోరేదంతా” ప్రధాన పాఠ్యంలో మూలంలోని సంక్షిప్తతను నిలిపి, ప్రత్యామ్నాయ వస్తుగత అర్థాన్ని పాదటిప్పణి సముచితంగా వివరిస్తోంది.
