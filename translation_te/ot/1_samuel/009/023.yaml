base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/023.yaml
  text: Then Samuel said to the cook[a], “Bring the portion that I gave you, of which I said to you, ‘Set it aside with you.’”
translation:
  language: te
  text: అప్పుడు సమూయేలు వంటవాడితో[a], “నేను నీకు ఇచ్చిన భాగాన్ని తీసుకురా. దాని గురించి నేను నీతో, ‘దాన్ని నీ దగ్గర ఉంచు’ అని చెప్పాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మాంసం సిద్ధం చేసేవానితో.” ఇక్కడి హీబ్రూ పదం మాంసాన్ని కోసి సిద్ధం చేసే వ్యక్తినీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַּבָּח
  choice: వంటవాడు
  rationale: ఈ విందు సందర్భంలో మాంసాన్ని సిద్ధం చేసి వడ్డించే వ్యక్తిని సూచిస్తుంది. ‘కసాయి’ అనే అర్థం సాధ్యమైనా, ఇక్కడ ‘వంటవాడు’ సహజంగా సరిపోతుంది.
- source_word: תְּנָה
  choice: తీసుకురా
  rationale: మూల క్రియకు అక్షరార్థంగా ‘ఇవ్వు’ అనే భావం ఉంది; అయితే దాచిపెట్టిన భోజనభాగాన్ని ఇప్పుడు సమర్పించమనే సందర్భార్థాన్ని ‘తీసుకురా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מָּנָה
  choice: భాగం
  rationale: భోజనంలో ఒకరికి కేటాయించిన వాటాను సూచిస్తుంది; ‘భాగం’ ఖచ్చితమైనదీ సాధారణ పాఠకులకు సహజమైనదీ.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: నేను నీకు ఇచ్చిన
  rationale: సమూయేలు ముందుగా ఆ భాగాన్ని వంటవానికి ఇచ్చినట్లు సూటిగా తెలిపే మూల వాక్యార్థాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: దాని గురించి … అని నీతో చెప్పాను
  rationale: రెండవ సంబంధవాచక వాక్యం అదే భాగాన్ని తిరిగి సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేలా చేస్తూనే మూలంలోని పునఃసూచనను నిలుపుతుంది.
- source_word: שִׂים אֹתָהּ עִמָּךְ
  choice: దాన్ని నీ దగ్గర ఉంచు
  rationale: అక్షరార్థమైన ‘దాన్ని నీతో ఉంచు’ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలో దానిని తరువాత కోసం భద్రపరచడం సూచితమవుతుంది, కానీ దానిని వచనంలో మరీ స్పష్టీకరించలేదు.
