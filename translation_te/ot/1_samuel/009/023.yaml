translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ సంబంధవాచక నిర్మాణాన్ని సాధ్యమైనంత వరకు నిలుపుతూ, అసహజమైన పదానువాదాన్ని నివారించాం.
