id: 1SA.9.3
reference: 1 Samuel 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּאבַ֨דְנָה֙ הָ/אֲתֹנ֔וֹת לְ/קִ֖ישׁ אֲבִ֣י שָׁא֑וּל וַ/יֹּ֨אמֶר קִ֜ישׁ אֶל שָׁא֣וּל בְּנ֗/וֹ קַח נָ֤א אִתְּ/ךָ֙ אֶת אַחַ֣ד מֵֽ/הַ/נְּעָרִ֔ים וְ/ק֣וּם לֵ֔ךְ בַּקֵּ֖שׁ אֶת הָ/אֲתֹנֹֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: The donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
translation:
  language: te
  text: సౌలు తండ్రియైన కీషుకు చెందిన ఆడ గాడిదలు[a] తప్పిపోయాయి. కాబట్టి కీషు తన కుమారుడైన సౌలుతో, “దయచేసి యువకుల్లో ఒకడిని[b] నీతో తీసుకొని, లేచి వెళ్లి ఆ ఆడ గాడిదలను వెతుకు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ప్రత్యేకంగా ‘ఆడ గాడిదలు’ అని అర్థమిస్తుంది.
    reason: lexical_detail
  - marker: b
    text: లేదా ‘పరిచారకుల్లో ఒకడిని’ లేదా ‘సేవకుల్లో ఒకడిని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאבַדְנָה
  choice: తప్పిపోయాయి
  rationale: ఇక్కడ אבד జంతువులు కనిపించకుండా పోయిన భావాన్ని ఇస్తుంది; ‘చనిపోయాయి’ అనే అర్థాన్ని రానీయకుండా సహజమైన తెలుగులో ‘తప్పిపోయాయి’ అని అనువదించాం.
- source_word: הָאֲתֹנוֹת
  choice: ఆడ గాడిదలు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా ఆడ గాడిదలను సూచిస్తుంది; తెలుగులో ఇది సహజంగానే ఉండడంతో లింగవివరాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: לְקִישׁ
  choice: కీషుకు చెందిన
  rationale: లామెద్ ఇక్కడ స్వామ్యసంబంధాన్ని సూచిస్తుంది; ‘చెందిన’ అనే రూపం దాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֲבִי שָׁאוּל
  choice: సౌలు తండ్రి
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు సంబంధబంధంగా ఇచ్చాం.
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: కథనంలోని אמרకు సహజమైన సాధారణ తెలుగు సంభాషణా క్రియ.
- source_word: בְּנוֹ
  choice: తన కుమారుడైన
  rationale: మూలంలోని ‘అతని కుమారుడు’ అనే అనుబంధ వివరణను స్పష్టంగా నిలిపింది.
- source_word: קַח נָא אִתְּךָ
  choice: దయచేసి ... నీతో తీసుకొని
  rationale: נָא ఆజ్ఞను మృదుపరుస్తుంది; ‘దయచేసి’ దాన్ని తెలియజేస్తుంది. אִתְּךָను ‘నీతో’గా నిలిపాం.
- source_word: אַחַד מֵהַנְּעָרִים
  choice: పనివాళ్లలో ఒకడిని
  rationale: נְעָרִיםకు యువకులు, సేవకులు, పరిచారకులు అనే పరిధి ఉంది. ఈ ఇంటివారి సందర్భంలో ‘పనివాళ్లు’ సహజమైన తెలుగు; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: וְקוּם לֵךְ
  choice: లేచి వెళ్లి
  rationale: రెండు ఆజ్ఞారూప క్రియలను సహజమైన తెలుగు వరుసక్రియలుగా నిలిపాం.
- source_word: בַּקֵּשׁ
  choice: వెదుకు
  rationale: కనిపించని జంతువులను వెతకడాన్ని సూచించే సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. ‘దయచేసి’ ద్వారా נָא యొక్క మృదుత్వాన్ని, ‘లేచి వెళ్లి’ ద్వారా వరుస ఆజ్ఞలను నిలిపాం. ప్రధాన పాఠ్యంలో ఉన్న [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
