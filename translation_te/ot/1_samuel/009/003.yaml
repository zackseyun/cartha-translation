- from: సౌలు తండ్రి కీషుకు చెందిన ఆడ గాడిదలు[a] తప్పిపోయాయి. కాబట్టి కీషు తన కుమారుడైన సౌలుతో, “దయచేసి పనివాళ్లలో ఒకడిని[b] నీతో తీసుకొని లేచి వెళ్లి ఆ గాడిదలను వెదుకు” అన్నాడు.
