- from: 'ఆ యువతులు వారికి జవాబిస్తూ ఇలా అన్నారు: “అవును, ఇదిగో—అతడు మీకు కాస్త ముందే ఉన్నాడు.[a] ఇప్పుడే త్వరపడండి. అతడు ఈ రోజే పట్టణానికి వచ్చాడు; ఎందుకంటే ఈ రోజు ఉన్నత స్థలంలో[b] ప్రజల కోసం ఒక బలి ఉంది.”'
  to: 'ఆ యువతులు వారికి జవాబిచ్చి ఇలా అన్నారు: “అవును, ఇదిగో—అతడు నీ ముందే ఉన్నాడు.[a] త్వరగా వెళ్లు. అతడు ఈ రోజు పట్టణానికి వచ్చాడు; ఈ రోజు ప్రజల కొరకు ఉన్నత స్థలంలో[b] ఒక బలి ఉంది.”'
