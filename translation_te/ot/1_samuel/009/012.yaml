source:
  edition: WLC
  text: וַ/תַּעֲנֶ֧ינָה אוֹתָ֛/ם וַ/תֹּאמַ֥רְנָה יֵּ֖שׁ הִנֵּ֣ה לְ/פָנֶ֑י/ךָ מַהֵ֣ר עַתָּ֗ה כִּ֤י הַ/יּוֹם֙ בָּ֣א לָ/עִ֔יר כִּ֣י זֶ֧בַח הַ/יּ֛וֹם לָ/עָ֖ם בַּ/בָּמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
translation:
  language: te
  text: 'ఆ యువతులు వారికి జవాబిచ్చి ఇలా అన్నారు: “అవును, ఇదిగో—అతడు నీ ముందే ఉన్నాడు.[a] త్వరగా వెళ్లు. అతడు ఈ రోజు పట్టణానికి వచ్చాడు; ఈ రోజు ప్రజల కొరకు ఉన్నత స్థలంలో[b] ఒక బలి ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అదిగో, అతడు నీ ముందు ఉన్నాడు.” హెబ్రీలో ధృవీకార పదంతో పాటు చూపించే సూచనాత్మక పదం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “ఉన్నత స్థలం” అంటే సాధారణంగా ఎత్తైన ప్రదేశంలో ఉన్న స్థానిక ఆరాధనా స్థలం.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה אוֹתָם וַתֹּאמַרְנָה
  choice: ఆ యువతులు వారికి జవాబిస్తూ ఇలా అన్నారు
  rationale: క్రియల స్త్రీలింగ బహువచన రూపాన్ని సందర్భానుసారంగా ‘ఆ యువతులు’ అని స్పష్టం చేసింది; ‘జవాబిచ్చి అన్నారు’ అనే హెబ్రీ సంభాషణ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో ‘జవాబిస్తూ ఇలా అన్నారు’గా అందించింది.
- source_word: יֵשׁ הִנֵּה
  choice: అవును, ఇదిగో
  rationale: יֵשׁ ఇక్కడ ముందటి ప్రశ్నకు ధృవీకార సమాధానంగా పనిచేస్తుంది; הִנֵּה దృష్టిని ఆకర్షించే సూచనాత్మక పదం. ‘అవును, ఇదిగో’ ఈ రెండు భావాలను సహజంగా నిలుపుతుంది.
- source_word: לְפָנֶיךָ
  choice: మీకు కాస్త ముందే ఉన్నాడు
  rationale: అక్షరార్థంగా ‘మీ ముందు’; ప్రయాణ సందర్భంలో అతడు వారి కంటే కొద్దిగా ముందున్నాడనే స్థలసంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַהֵר עַתָּה
  choice: ఇప్పుడే త్వరపడండి
  rationale: ఆజ్ఞతో పాటు ఉన్న అత్యవసరతను సంక్షిప్తమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘వెళ్లండి’ వంటి మూలంలో లేని క్రియను చేర్చదు.
- source_word: כִּי הַיּוֹם בָּא לָעִיר
  choice: అతడు ఈ రోజే పట్టణానికి వచ్చాడు
  rationale: בָּא అనే సంపూర్ణ క్రియను కథన సందర్భానికి తగిన సాధారణ భూతకాలంలో అందించింది; ‘ఈ రోజే’ అతని అదే రోజు రాకను నొక్కిచెబుతుంది.
- source_word: זֶבַח
  choice: ఒక బలి
  rationale: ఈ వచనంలో పదం నేరుగా బలిని సూచిస్తుంది. విందు భావం పరిసర సందర్భంలో ఉండవచ్చుగాని, దానిని ఇక్కడ పాఠ్యంలో అదనంగా చేర్చలేదు.
- source_word: לָעָם
  choice: ప్రజల కోసం
  rationale: సమాజంగా పాల్గొనే ప్రజలను సూచించే సరళమైన, విస్తృతమైన అనువాదం.
- source_word: בַּבָּמָה
  choice: ఉన్నత స్థలంలో
  rationale: במה అనే చారిత్రక ఆరాధనా పదానికి ఉన్న ఎత్తైన స్థాన భావాన్నీ, సాంకేతిక అస్పష్టతనూ నిలుపుతుంది; వివరణను పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: దేవాలయానికి పూర్వకాలంలోని במה పదానికి అనువాదం
  choice: ఉన్నత స్థలం
  alternative: కొండమీది ఆరాధనా స్థలం
  rationale: ఇది గుర్తింపుపొందిన స్థానిక ఆరాధనా స్థలాన్ని సూచిస్తుంది. ‘ఉన్నత స్థలం’ అని అనువదించడం చారిత్రక పదస్వరూపాన్ని నిలుపుతూ, తరువాతి కాలపు ప్రతికూల తీర్పును ఈ వచనంలోకి ముందుగానే తీసుకురాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. స్త్రీలింగ బహువచన క్రియారూపాన్ని ‘ఆ యువతులు’తో స్పష్టం చేసింది. ‘జవాబిస్తూ ఇలా అన్నారు’ అనే రూపం హెబ్రీ నిర్మాణాన్ని పూర్తిగా కోల్పోకుండా తెలుగులోని అనవసర పునరుక్తిని తగ్గిస్తుంది.
