id: 1SA.9.9
reference: 1 Samuel 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/פָנִ֣ים בְּ/יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר הָ/אִישׁ֙ בְּ/לֶכְתּ/וֹ֙ לִ/דְר֣וֹשׁ אֱלֹהִ֔ים לְכ֥וּ וְ/נֵלְכָ֖ה עַד הָ/רֹאֶ֑ה כִּ֤י לַ/נָּבִיא֙ הַ/יּ֔וֹם יִקָּרֵ֥א לְ/פָנִ֖ים הָ/רֹאֶֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
translation:
  language: te
  text: పూర్వకాలంలో ఇశ్రాయేలులో, ఒక మనిషి దేవుని దగ్గర విచారణ చేయడానికి వెళ్లేటప్పుడు, “రండి, దీర్ఘదర్శి దగ్గరకు వెళ్దాం” అని అనేవాడు. ఎందుకంటే ఇప్పుడు ప్రవక్త అని పిలువబడే వ్యక్తిని పూర్వకాలంలో దీర్ఘదర్శి అని పిలిచేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְפָנִים
  choice: పూర్వకాలంలో
  rationale: గతకాలపు వాడుకను సూచించే కాలవాచక అవ్యయార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; రెండు సందర్భాల్లోనూ ఒకే పదాన్ని ఉంచి కాలవ్యతిరేకతను కాపాడింది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: ఆ ఆచారం ఉన్న ప్రదేశాన్ని నేరుగా సూచించే స్థానవాచక రూపం.
- source_word: כֹּה אָמַר
  choice: అని అనేవాడు
  rationale: పదశః ‘ఇలా అన్నాడు’ అయినా, గతంలో పునరావృతమైన సాధారణ ఆచారాన్ని సందర్భం సూచిస్తున్నందున అలవాటును తెలిపే రూపం వాడింది.
- source_word: הָאִישׁ
  choice: ఒక మనిషి
  rationale: నిర్దిష్ట వ్యక్తిని కాక సాధారణ ప్రతినిధిని సూచించే ఏకవచనంగా అనువదించింది; మూలంలోని పురుష ఏకవచన రూపాన్ని నిలిపింది.
- source_word: בְּלֶכְתּוֹ
  choice: వెళ్లేటప్పుడు
  rationale: సర్వనామ ప్రత్యయంతో ఉన్న infinitive construct యొక్క కాలసంబంధ విధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: దేవుని దగ్గర విచారణ చేయడానికి
  rationale: ప్రవక్తీయ మధ్యవర్తి ద్వారా దేవుని మార్గదర్శకత్వాన్ని అడగడమనే సందర్భార్థాన్ని ‘విచారణ చేయడం’ స్పష్టంగా అందిస్తుంది; సాధారణ భక్తిపూర్వక ‘వెదకడం’ అనే విస్తృతార్థానికి పరిమితం చేయదు.
- source_word: לְכוּ וְנֵלְכָה
  choice: రండి, ... వెళ్దాం
  rationale: బహువచన ఆజ్ఞతో పాటు cohortative ఆహ్వానాన్ని సహజమైన తెలుగు సంభాషణలో నిలుపుతుంది.
- source_word: עַד הָרֹאֶה
  choice: దీర్ఘదర్శి దగ్గరకు
  rationale: ఇక్కడ עַד ఒక వ్యక్తివైపు గమనాన్ని సూచిస్తుంది. רֹאֶה అనే పాత ప్రవక్తీయ బిరుదుకు ‘దీర్ఘదర్శి’ స్థిరమైన, సంక్షిప్తమైన తెలుగు సమానార్థకం.
- source_word: לַנָּבִיא
  choice: ప్రవక్త
  rationale: נָבִיאకు ప్రామాణిక తెలుగు పదం; వాక్య నిర్మాణంలో ‘ప్రవక్త అని’ సహజంగా బిరుదును సూచిస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజుల్లో
  rationale: కథకుని కాలంలోని ప్రస్తుత నామవాడుకను పూర్వకాలపు వాడుకతో స్పష్టంగా వ్యత్యాసపరుస్తుంది; ఇక్కడ ఒకే క్యాలెండర్ దినాన్ని కాక ‘ఇప్పుడు’ అనే కాలదృక్కోణాన్ని సూచిస్తుంది.
- source_word: יִקָּרֵא
  choice: పిలువబడేవాణ్ణి ... పిలిచేవారు
  rationale: మూలంలోని అపూర్ణక్రియా/కర్మణి భావాన్ని తెలుగులో గతపు నామవాడుకను వివరించే సహజ నిర్మాణంగా అందిస్తుంది; మొదటి భాగంలో ప్రస్తుత కథకకాలపు పేరును, రెండవ భాగంలో పూర్వపు పేరును వ్యత్యాసపరుస్తుంది.
- source_word: הָרֹאֶה
  choice: దీర్ఘదర్శి
  rationale: ప్రవక్తీయ వ్యక్తికి వాడిన పూర్వపు సాంకేతిక బిరుదును అదే పదంతో స్థిరంగా అనువదించింది.
theological_decisions:
- issue: הָאִישׁ అనే సాధారణ పురుష ఏకవచనం
  choice: ఒక మనిషి
  alternative: ఒక వ్యక్తి / ఎవరైనా
  rationale: మూలంలోని వ్యాకరణపరమైన పురుష ఏకవచనాన్ని అనవసరంగా లింగతటస్థం చేయకుండా, ఇది ఒక సాధారణ ఆచారాన్ని ఉదాహరించే ప్రతినిధి వాడుక అని తెలుగులో సహజంగా తెలిపింది.
- issue: דָּרַשׁ אֱלֹהִים యొక్క ప్రవక్తీయ సందర్భార్థం
  choice: దేవుని దగ్గర విచారణ చేయడానికి
  alternative: దేవుని వెదకడానికి / దేవుని సంప్రదించడానికి
  rationale: ఇక్కడ దేవుని మార్గదర్శకత్వాన్ని దీర్ఘదర్శి ద్వారా అడగడం సందర్భం. ‘విచారణ చేయడం’ ఆ సంప్రదింపుసంబంధ భావాన్ని నిలుపుతూ, ప్రవచనం గురించి అదనపు సిద్ధాంతాన్ని చేర్చదు.
- issue: ‘ప్రవక్త’ మరియు ‘దీర్ఘదర్శి’ మధ్య సంబంధం
  choice: ఈ రోజుల్లో ప్రవక్త అని పిలువబడేవాణ్ణి పూర్వకాలంలో దీర్ఘదర్శి అని పిలిచేవారు
  alternative: నేటి ప్రవక్తను పూర్వం దీర్ఘదర్శి అనేవారు
  rationale: రెండు పదాలు పూర్తిగా ఎల్లప్పుడూ సమానార్థకాలని సిద్ధాంతీకరించకుండా, కథకుడు వివరించిన కాలానుసార నామవాడుక మార్పును మాత్రమే వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని వివరణాత్మక parenthetical స్వభావం, గతపు అలవాటు, ‘ప్రవక్త/దీర్ఘదర్శి’ కాలవ్యతిరేకత కాపాడబడ్డాయి. ప్రచురణ పాఠ్యంలో పాదటిప్పణులు లేనందున గుర్తులు అవసరం లేదు.
