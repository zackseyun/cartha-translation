revisions:
- from: పూర్వకాలంలో ఇశ్రాయేలులో, ఒక మనిషి దేవుని దగ్గర విచారణ చేయడానికి వెళ్లేటప్పుడు, “రండి, దీర్ఘదర్శి దగ్గరకు వెళ్దాం” అని అనేవాడు. ఎందుకంటే ఈ రోజుల్లో ప్రవక్త అని పిలువబడేవాణ్ణి పూర్వకాలంలో దీర్ఘదర్శి అని పిలిచేవారు.
  to: పూర్వకాలంలో ఇశ్రాయేలులో, ఒక మనిషి దేవుని దగ్గర విచారణ చేయడానికి వెళ్లేటప్పుడు, “రండి, దీర్ఘదర్శి దగ్గరకు వెళ్దాం” అని అనేవాడు. ఎందుకంటే ఇప్పుడు ప్రవక్త అని పిలువబడే వ్యక్తిని పూర్వకాలంలో దీర్ఘదర్శి అని పిలిచేవారు.
