base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
translation:
  language: te
  text: 'అప్పుడు వంటవాడు కాలి భాగాన్ని[a], దానిమీద ఉన్నదానితో సహా[b], తీసుకొని సౌలు ముందు పెట్టాడు. అతడు ఇలా అన్నాడు: “ఇదిగో, నీ కోసం ఉంచబడినది[c] నీ ముందుంది. తిను; ఎందుకంటే, ‘నేను ప్రజలను ఆహ్వానించాను[d]’ అని నేను చెప్పినప్పటి నుంచే, నిర్ణయించిన సమయం వరకు ఇది నీ కొరకు ఉంచబడింది.” ఆ రోజు సౌలు సమూయేలుతో కలిసి భోజనం చేశాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తొడ భాగాన్ని.’ హీబ్రూ పదం שׁוֹק జంతువు కాలుకు చెందిన మాంసపు భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘కాలి భాగాన్ని, దానిమీద ఉన్నదానిని.’ దానితో ఉన్న భాగం ఏమిటో వాక్యం స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మిగిలినది.’ హీబ్రూ పదం మిగిలిపోయినదానినైనా, ప్రత్యేకంగా ఉంచినదానినైనా సూచించవచ్చు; ఇక్కడి సందర్భం సౌలు కోసం ప్రత్యేకంగా ఉంచిన భాగం అనే భావానికి అనుకూలంగా ఉంది.
    reason: alternative_reading
  - marker: d
    text: లేదా ‘పిలిచాను.’ ఈ భోజన సందర్భంలో ‘ఆహ్వానించాను’ అనేది హీబ్రూ క్రియకు ఉద్దేశించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטַּבָּח
  choice: వంటవాడు
  rationale: బలి విందులో మాంసాన్ని సిద్ధం చేసి వడ్డించే వ్యక్తిని సందర్భానుసారంగా సహజంగా సూచిస్తుంది; ‘కసాయి’ అనేది సాధ్యమైనా ఇక్కడి వడ్డింపు చర్యకు తక్కువ అనుకూలం.
- source_word: הַשּׁוֹק
  choice: కాలి భాగం
  rationale: జంతువు కాలుకు చెందిన మాంసపు భాగాన్ని సూచిస్తుంది. ‘తొడ’ అని మరీ నిర్దిష్టంగా చెప్పకుండా మూలపదపు విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: וְהֶעָלֶיהָ
  choice: దానిమీద ఉన్నదానితో సహా
  rationale: హీబ్రూ వాక్యం వెంట ఉన్న భాగం ఏమిటో పేరు పెట్టదు. అందువల్ల కొవ్వు లేదా తోక అని ఊహించకుండా అస్పష్టతను నిలిపింది.
- source_word: הַנִּשְׁאָר
  choice: నీ కోసం ఉంచబడినది
  rationale: పదానికి ‘మిగిలినది’ అనే అర్థం కూడా ఉంది; అయితే సందర్భంలో సౌలు కోసం ముందుగానే ప్రత్యేకంగా ఉంచిన భాగం భావం బలంగా ఉంది.
- source_word: שִׂים לְפָנֶיךָ
  choice: నీ ముందుంది
  rationale: అక్షరార్థ ఆజ్ఞారూపాన్ని తెలుగులో అసహజంగా పునరుత్పత్తి చేయకుండా, తినేందుకు భాగం అతని ముందు పెట్టబడిన దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַמּוֹעֵד
  choice: నియమిత సమయం కోసం
  rationale: ముందుగా నిర్ణయించబడిన సమయం లేదా సందర్భం అనే భావాన్ని కాపాడుతుంది; దీన్ని ప్రత్యేక పండుగగా పరిమితం చేయదు.
- source_word: שָׁמוּר לְךָ
  choice: నీ కొరకు ఉంచబడింది
  rationale: ఈ భాగాన్ని సౌలు కోసం ప్రత్యేకంగా భద్రపరిచారనే స్థితిని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לֵאמֹר הָעָם קָרָאתִי
  choice: ‘నేను ప్రజలను ఆహ్వానించాను’ అని నేను చెప్పినప్పటి నుంచే
  rationale: భోజన సందర్భంలో קראకు ‘ఆహ్వానించు’ సహజమైన అర్థం. సంక్షిప్తమైన హీబ్రూ నిర్మాణంలోని కాలసంబంధాన్ని తెలుగులో స్పష్టంగా, అయినా అతిగా వ్యాఖ్యానించకుండా వ్యక్తం చేస్తుంది.
- source_word: עִם שְׁמוּאֵל
  choice: సమూయేలుతో కలిసి
  rationale: సమూయేలుతో ఒకే భోజనంలో పాల్గొన్నాడనే సాధారణ సహవాస భావాన్ని నేరుగా తెలియజేస్తుంది.
