translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని ‘దానిమీద ఉన్నది’ అనే అస్పష్టతను ప్రధాన పాఠ్యంలోనే నిలిపి, ‘మిగిలినది/ఉంచబడినది’ మరియు ‘పిలిచాను/ఆహ్వానించాను’ అనే ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఇచ్చాం.
