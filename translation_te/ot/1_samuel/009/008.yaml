revisions:
- from: ఆ యువకుడు సౌలుకు మళ్లీ జవాబిస్తూ, “చూడండి, నా దగ్గర పావు షెకెలు వెండి ఉంది. దాన్ని దేవుని మనిషికి ఇస్తాను; అప్పుడు ఆయన మన దారి ఏమిటో[a] మనకు చెబుతాడు” అన్నాడు.
  to: 'ఆ యువకుడు మళ్లీ సౌలుకు జవాబిచ్చి ఇలా అన్నాడు: “ఇదిగో, నా చేతిలో వెండి షెకెలులో పావు వంతు ఉంది. దానిని దేవుని మనిషికి ఇస్తాను; ఆయన మన దారిని[a] మనకు చెబుతాడు.”'
  rationale: The revision improves Telugu narrative flow, renders הִנֵּה and בְיָדִי more closely, and retains the Hebrew ambiguity of ‘our way’ without adding an explicit question in the main text. The existing footnote anchor is retained and its wording is lightly polished.
