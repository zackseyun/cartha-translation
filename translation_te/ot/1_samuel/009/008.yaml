  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సౌలును ఉద్దేశించిన మాటలో ‘చూడండి’ అనే గౌరవ బహువచనం ఉంచబడింది. ‘షెకెలు’ అనే ప్రాచీన బరువు ప్రమాణాన్ని మార్చకుండా నిలిపి, ‘పావు’ ద్వారా పరిమాణాన్ని స్పష్టం చేశాం.
