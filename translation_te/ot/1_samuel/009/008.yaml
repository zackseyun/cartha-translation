  text: וַ/יֹּ֤סֶף הַ/נַּ֨עַר֙ לַ/עֲנ֣וֹת אֶת שָׁא֔וּל וַ/יֹּ֕אמֶר הִנֵּה֙ נִמְצָ֣א בְ/יָדִ֔/י רֶ֖בַע שֶׁ֣קֶל כָּ֑סֶף וְ/נָֽתַתִּי֙ לְ/אִ֣ישׁ הָ/אֱלֹהִ֔ים וְ/הִגִּ֥יד לָ֖/נוּ אֶת דַּרְכֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
translation:
  language: te
  text: 'ఆ యువకుడు మళ్లీ సౌలుకు జవాబిచ్చి ఇలా అన్నాడు: “ఇదిగో, నా చేతిలో వెండి షెకెలులో పావు వంతు ఉంది. దానిని దేవుని మనిషికి ఇస్తాను; ఆయన మన దారిని[a] మనకు చెబుతాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం ఏ దారిలో వెళ్లాలో.” హీబ్రూలో అక్షరార్థంగా “మన దారి” అని ఉంది; అది ముందున్న ప్రయాణ మార్గాన్నిగానీ, అనుసరించవలసిన కార్యపద్ధతినిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... לַעֲנוֹת
  choice: మళ్లీ జవాబిస్తూ
  rationale: יסף + infinitive అనే హీబ్రూ ప్రయోగం ఒక క్రియను మళ్లీ చేయడం లేదా కొనసాగించడాన్ని సూచిస్తుంది. సౌలు అభ్యంతరం చెప్పిన తర్వాత యువకుడు తిరిగి స్పందిస్తున్న సందర్భానికి ఈ రూపం సహజంగా సరిపోతుంది.
- source_word: הַנַּעַר
  choice: ఆ యువకుడు
  rationale: נער అనే పదం యువకుడు, బాలుడు, పరిచారకుడు అనే అర్థాలను సందర్భానుసారం ఇవ్వగలదు. ఇక్కడ అతడు సౌలు పరిచారకుడే అయినా, మూలపదంలోని వయస్సు సూచనను అతిగా నిర్వచించకుండా ‘యువకుడు’ అని ఉంచడం సముచితం.
- source_word: הִנֵּה
  choice: చూడండి
  rationale: హిన్నే శ్రోత దృష్టిని ఒక విషయంపై నిలిపే ఉద్ఘాటన. ఆధునిక గౌరవప్రద సంభాషణలో ‘చూడండి’ సహజమైన సమానార్థకం.
- source_word: נִמְצָא בְיָדִי
  choice: నా దగ్గర ... ఉంది
  rationale: అక్షరార్థంగా ‘నా చేతిలో కనబడింది/ఉంది’ అయినా, ఇది స్వాధీనాన్ని తెలిపే హీబ్రూ ప్రయోగం. తెలుగులో ‘నా దగ్గర ఉంది’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  choice: పావు షెకెలు వెండి
  rationale: ఇది వెండి బరువును ఆధారంగా చేసుకున్న విలువ. ‘పావు షెకెలు’ మూలంలోని నాలుగవ వంతును సంక్షిప్తంగా, స్పష్టంగా తెలుపుతుంది.
- source_word: וְנָתַתִּי
  choice: దాన్ని ... ఇస్తాను
  rationale: ఈ సందర్భంలో qatal రూపం యువకుని ఉద్దేశించిన తదుపరి చర్యను సూచిస్తుంది. తెలుగులో ‘ఇస్తాను’ ఆ సంకల్పాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషికి
  rationale: ఇది ప్రవక్త లేదా దేవునిచేత నియమించబడిన వ్యక్తికి వాడే స్థిరమైన హీబ్రూ బిరుదు. ‘దేవుని మనిషి’ దాని రూపాన్ని, భావాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: וְהִגִּיד לָנוּ
  choice: మనకు చెబుతాడు
  rationale: נגד యొక్క హిఫీల్ రూపం తెలియజేయడం లేదా చెప్పడం అనే భావాన్ని ఇస్తుంది. కథన సందర్భంలో ‘చెబుతాడు’ సరళమైన, సహజమైన అనువాదం.
- source_word: אֶת דַּרְכֵּנוּ
  choice: మన దారి ఏమిటో
  rationale: అక్షరార్థం ‘మన దారి.’ సందర్భంలో ఇది ముందున్న మార్గాన్నీ, వారు అనుసరించవలసిన కార్యపద్ధతినీ సూచించవచ్చు. ‘మన దారి ఏమిటో’ ఆ రెండు అవకాశాలను ప్రధాన పాఠంలో కొంతవరకు నిలుపుతుంది.
