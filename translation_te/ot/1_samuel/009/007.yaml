source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל לְ/נַעֲר֗/וֹ וְ/הִנֵּ֣ה נֵלֵךְ֮ וּ/מַה נָּבִ֣יא לָ/אִישׁ֒ כִּ֤י הַ/לֶּ֨חֶם֙ אָזַ֣ל מִ/כֵּלֵ֔י/נוּ וּ/תְשׁוּרָ֥ה אֵין לְ/הָבִ֖יא לְ/אִ֣ישׁ הָ/אֱלֹהִ֑ים מָ֖ה אִתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
translation:
  language: te
  text: అప్పుడు సౌలు తనతో ఉన్న యువకునితో, “చూడు, మనం వెళ్తే ఆ మనిషికి ఏమి తీసుకెళ్తాం? మన సంచుల్లో ఉన్న రొట్టె అయిపోయింది[a]. దేవుని మనిషికి తీసుకెళ్లడానికి కానుక[b] ఏదీ లేదు. మన దగ్గర ఏముంది?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా, “మన పాత్రలలోని రొట్టె అయిపోయింది.” ఇక్కడ “పాత్రలు” ప్రయాణ సామాను ఉంచే సంచులు లేదా ఇతర డబ్బాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బహుమతి.” ఈ పదం గౌరవనీయుడైన వ్యక్తి వద్దకు తీసుకెళ్లే కానుకను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: తనతో ఉన్న యువకుడు
  rationale: ఈ పదం యువకుణ్ణి లేదా యువ సహాయకుణ్ణి సూచించగలదు. సందర్భంలో అతడు సౌలుకు సహాయకుడైనా, ‘సేవకుడు’ అని అనువదిస్తే అతని సామాజిక స్థితిని అవసరానికి మించి నిర్దిష్టం చేసినట్లవుతుంది.
- source_word: וְהִנֵּה
  choice: చూడు
  rationale: సౌలు ఒక ఆచరణాత్మక అభ్యంతరంపై దృష్టి నిలిపే భావాన్ని ఆధునిక, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נָבִיא
  choice: తీసుకెళ్తాం
  rationale: బוא అనే క్రియ హిఫీల్ రూపంలో ఇక్కడ ఒకరి వద్దకు ఏదైనా తీసుకురావడం లేదా తీసుకెళ్లడం అనే భావం ఇస్తుంది. తెలుగు కథన దృక్కోణంలో ‘తీసుకెళ్తాం’ సహజంగా ఉంటుంది.
- source_word: לֶחֶם
  choice: రొట్టె
  rationale: ఇది సాధారణంగా ఆహారాన్నంతటినీ సూచించగలిగినా, మూలంలోని నిర్దిష్టమైన concrete పదాన్ని నిలుపుతుంది.
- source_word: כְּלִי
  choice: సంచులు
  rationale: మూలపదానికి పాత్రలు లేదా సామాను ఉంచే సాధనాలు అనే విస్తృత అర్థం ఉంది. ప్రయాణ సందర్భంలో ‘సంచులు’ సహజమైన స్పష్టమైన సమానార్థకం.
- source_word: תְּשׁוּרָה
  choice: కానుక
  rationale: గౌరవనీయుడైన వ్యక్తి వద్దకు తీసుకెళ్లే బహుమతిని సూచిస్తుంది; ‘అర్పణ’ అనడం మూలంలో అవసరం లేని ఆరాధనా భావాన్ని చేర్చవచ్చు.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: మూలంలోని స్థిరమైన బిరుదును నేరుగా నిలుపుతుంది; సందర్భానుసారంగా అతడు ప్రవక్త అయినప్పటికీ, మూలం ఇక్కడ ‘ప్రవక్త’ అనే పదాన్ని వాడలేదు.
- source_word: מָה אִתָּנוּ
  choice: మన దగ్గర ఏముంది?
  rationale: తమ వద్ద ప్రస్తుతం అందుబాటులో ఉన్నది ఏమిటని అడిగే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים అనే బిరుదు
  choice: దేవుని మనిషి
  alternative: ప్రవక్త
  rationale: సమూయేలు ప్రవక్త అనే సందర్భసత్యాన్ని తిరస్కరించకుండా, ఈ వాక్యంలో ఉపయోగించిన ప్రత్యేక బిరుదును అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సంభాషణ శైలిని, అయితే వాక్యానికి తగిన గౌరవభరిత స్వరాన్ని ఉపయోగించాం. ‘దేవుని మనిషి’ అనే గ్రంథపరమైన బిరుదును నిలిపి, అతిగా ప్రాచీనంగా వినిపించే పదజాలాన్ని నివారించాం.
