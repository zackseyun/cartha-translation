base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
translation:
  language: te
  text: వారు ఉదయాన్నే లేచారు. వేకువ పొడుస్తుండగా[a], సమూయేలు మేడమీద ఉన్న సౌలును పిలిచి, “లే, నిన్ను సాగనంపుతాను[b]” అన్నాడు. అప్పుడు సౌలు లేచాడు; అతడూ సమూయేలూ ఇద్దరూ బయటికి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘వేకువ ఉదయిస్తున్నప్పుడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నిన్ను పంపివేస్తాను.’ హెబ్రీ పదానికి ఒకరిని వెళ్లనివ్వడం లేదా పంపివేయడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: వారు ఉదయాన్నే లేచారు
  rationale: שׁכם యొక్క హిఫిల్ రూపం దినారంభంలోనే లేవడం లేదా బయలుదేరడానికి సిద్ధపడడం అనే కాలభావాన్ని ఇస్తుంది. ‘ఉదయాన్నే లేచారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: వేకువ వెలుగు ఉదయిస్తుండగా
  rationale: అక్షరార్థంగా ‘వేకువ పైకి వస్తుండగా.’ ఈ ఎంపిక ఉదయకాలపు దృశ్యాన్ని, జరుగుతున్న ప్రక్రియను రెండింటినీ నిలుపుతుంది.
- source_word: הַגָּג
  choice: మేడమీద
  rationale: ఇది ప్రాచీన ఇళ్ల సమతల పైకప్పును సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘మేడమీద’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: קוּמָה
  choice: లే
  rationale: ఇది లేవమని చెప్పే ప్రత్యక్ష ఆజ్ఞ. ‘లే’ సంక్షిప్తంగా, సహజమైన సంభాషణా రూపంగా ఉంది.
- source_word: וַאֲשַׁלְּחֶךָּ
  choice: నిన్ను సాగనంపుతాను
  rationale: שׁלח ఇక్కడ ఒకరిని వెళ్లనివ్వడం లేదా పంపివేయడం అనే భావం కలిగి ఉంది. ‘సాగనంపుతాను’ మర్యాదగా ప్రయాణానికి పంపే సందర్భాన్ని తెలియజేస్తూ, బలవంతంగా తరిమివేసే భావాన్ని నివారిస్తుంది.
- source_word: וַיֵּצְאוּ ... הַחוּצָה
  choice: బయటికి వెళ్లారు
  rationale: క్రియతో కూడిన దిశాసూచక అవ్యయం బయటికి వెళ్లడాన్ని సూచిస్తుంది. గమ్యస్థానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘బయటికి వెళ్లారు’ మూలార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  choice: సౌలు, సమూయేలు—వారిద్దరూ
  rationale: హెబ్రీలోని ‘వారిద్దరూ, అతడూ సమూయేలూ’ అనే వివరణాత్మక నిర్మాణాన్ని సహజ తెలుగులో స్పష్టంగా అందించేందుకు సర్వనామం సూచించే సౌలు పేరును పునరుక్తి చేశాం.
