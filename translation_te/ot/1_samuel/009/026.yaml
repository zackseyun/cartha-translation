translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని ఉదయకాల పునరుక్తిని తొలగించకుండా ‘ఉదయాన్నే’ మరియు ‘వేకువ వెలుగు ఉదయిస్తుండగా’ అని ఉంచాం. ఇంగ్లీషు సంప్రదింపుపాఠంలో గమనికల సూచికలు వాటి పదబంధాలకు సరిపోని స్థానాల్లో కనిపించినందున, వాటిని సంబంధిత హెబ్రీ పదబంధాలైన ఉదయవర్ణన మరియు ‘సాగనంపుతాను’ వద్ద ఉంచాం.
