  text: וַ/יִּקַּ֤ח שְׁמוּאֵל֙ אֶת שָׁא֣וּל וְ/אֶֽת נַעֲר֔/וֹ וַ/יְבִיאֵ֖/ם לִשְׁכָּ֑תָ/ה וַ/יִּתֵּ֨ן לָ/הֶ֤ם מָקוֹם֙ בְּ/רֹ֣אשׁ הַ/קְּרוּאִ֔ים וְ/הֵ֖מָּה כִּ/שְׁלֹשִׁ֥ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
translation:
  language: te
  text: అప్పుడు సమూయేలు సౌలును, అతని యువకుణ్ణి[a] వెంట తీసుకొని, వారిని విందు మందిరంలోకి[b] తీసుకువచ్చాడు. ఆహ్వానితులలో అగ్రస్థానంలో వారికి చోటు ఇచ్చాడు. వారు దాదాపు ముప్పై మంది ఉన్నారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని సేవకుణ్ణి’ లేదా ‘అతని పరిచారకుణ్ణి.’ హీబ్రూ పదం యువకుణ్ణి, సేవకుణ్ణి, లేదా సహాయకుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘గదిలోకి’ లేదా ‘అంతఃగదిలోకి.’ హీబ్రూ పదం గది, అంతఃగది, లేదా మందిరాన్ని సూచించవచ్చు; ఇక్కడ అది విందు జరిగే స్థలాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ: ‘వారు దాదాపు ముప్పై మంది.’ ఇది బహుశా అక్కడున్న ఆహ్వానితులను సూచిస్తుంది.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: అతని యువ సేవకుణ్ణి
  rationale: נַעַר అనే పదం యువకుడు, సేవకుడు, లేదా పరిచారకుడు అనే అర్థాలను ఇవ్వగలదు. కథా సందర్భంలో అతడు సౌలుతో వచ్చిన అధీన సహాయకుడు; అందువల్ల వయస్సు భావాన్నీ సేవా పాత్రనూ సహజంగా తెలియజేసే ‘యువ సేవకుడు’ ఎంచుకోబడింది.
- source_word: לִשְׁכָּתָה
  choice: విందు మందిరంలోకి
  rationale: לִשְׁכָּה గది, మందిరం, లేదా ప్రత్యేక సమావేశ స్థలాన్ని సూచించవచ్చు. ఇక్కడ భోజన సందర్భం ఉన్నందున ‘విందు మందిరం’ స్థల స్వభావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; మూలపద విస్తృతిని పాదసూచికలో ఉంచాం.
- source_word: מָקוֹם
  choice: చోటు
  rationale: מָקוֹם అక్షరార్థంగా ‘చోటు/స్థానం.’ భోజన సందర్భంలో కూర్చునే చోటును సూచించినా, మూలంలోని సాధారణ పదాన్ని కాపాడేందుకు ‘చోటు’ వాడబడింది.
- source_word: בְּרֹאשׁ
  choice: అగ్రస్థానంలో
  rationale: ‘తల వద్ద’ అనే మూల రూపకం ఇక్కడ గౌరవప్రదమైన ప్రధాన స్థానాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అగ్రస్థానంలో’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַקְּרוּאִים
  choice: ఆహ్వానించబడినవారిలో
  rationale: קרא యొక్క కర్మణి కృదంతం ‘పిలువబడినవారు/ఆహ్వానించబడినవారు’ అని అర్థం. విందు సందర్భంలో ‘ఆహ్వానించబడినవారు’ స్పష్టమైన ఎంపిక.
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  choice: అక్కడ దాదాపు ముప్పై మంది ఉన్నారు
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా ‘వారు దాదాపు ముప్పై మంది’ అని ఉంది; సమీప పూర్వపదమైన ఆహ్వానితులనే సూచించే అవకాశం ఎక్కువ. తెలుగులో సహజత్వం కోసం ‘అక్కడ ... ఉన్నారు’ అని ఇచ్చి, సూచనలోని స్వల్ప అస్పష్టతను పాదసూచికలో తెలిపాం.
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח యొక్క సాధారణ అర్థం ‘తీసుకొను.’ తరువాతి ‘తీసుకువచ్చాడు’ అనే క్రియతో కలిసి కథన క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיְבִיאֵם
  choice: వారిని ... తీసుకువచ్చాడు
  rationale: בוא యొక్క హిఫీల్ రూపం ‘లోపలికి తీసుకురావడం/నడిపించడం.’ గమ్యస్థానంతో కలిపి ‘తీసుకువచ్చాడు’ సరళమైన, విశ్వసనీయమైన అనువాదం.
