reference: 1 Samuel 9:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁמוּאֵ֖ל רָאָ֣ה אֶת שָׁא֑וּל וַ/יהוָ֣ה עָנָ֔/הוּ הִנֵּ֤ה הָ/אִישׁ֙ אֲשֶׁ֣ר אָמַ֣רְתִּי אֵלֶ֔י/ךָ זֶ֖ה יַעְצֹ֥ר בְּ/עַמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/017.yaml
  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
translation:
  language: te
  text: 'సమూయేలు సౌలును చూసినప్పుడు, యాహ్వే అతనికి జవాబిచ్చాడు: “చూడు, నేను నీతో చెప్పిన మనిషి ఇతడే. ఇతడు నా ప్రజలను పరిపాలిస్తాడు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఇతడు నా ప్రజలను అదుపులో ఉంచుతాడు / నియంత్రిస్తాడు.” హీబ్రూ క్రియకు అడ్డుకోవడం, అదుపులో ఉంచడం, నియంత్రించడం లేదా పరిపాలించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: చూసినప్పుడు
  rationale: కథన క్రమంలో దృశ్యగ్రహణాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיהוָה
  choice: యాహ్వే
  rationale: మూలంలోని దైవనామం יְהוָהను బిరుదుగా మార్చకుండా పేరుగానే ప్రతిబింబిస్తుంది.
- source_word: עָנָהוּ
  choice: అతనికి జవాబిచ్చాడు
  rationale: ముందు పలికిన ప్రత్యక్ష ప్రశ్న ఈ వచనంలో లేకపోయినా, ענה యొక్క ‘జవాబివ్వడం/ప్రతిస్పందించడం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: הִנֵּה
  choice: చూడు
  rationale: ఎదుట ఉన్న వ్యక్తివైపు శ్రద్ధను మళ్లించే సూచనాత్మక బలాన్ని సహజంగా అందిస్తుంది.
- source_word: הָאִישׁ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: నేను నీతో చెప్పిన మనిషి
  rationale: మునుపటి దైవిక సమాచారాన్ని సూచించే సంబంధ వాక్యాన్ని స్పష్టంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: זֶה
  choice: ఇతడే
  rationale: హీబ్రూ సూచన సర్వనామంలోని గుర్తింపు మరియు ఉద్ఘాటనను ‘ఏ’ ద్వారా నిలుపుతుంది.
- source_word: יַעְצֹר בְּעַמִּי
  choice: నా ప్రజలను పరిపాలిస్తాడు
  rationale: రాజకీయ నాయకత్వ సందర్భంలో నియంత్రణ లేదా పాలన భావాన్ని సహజంగా తెలియజేస్తుంది; ‘అదుపులో ఉంచడం’ అనే మరింత అక్షరార్థ ఛాయను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగా అందిస్తుంది.
- issue: సౌలు పాత్రకు సంబంధించి יַעְצֹר భావం
  choice: పరిపాలిస్తాడు
  alternative: అదుపులో ఉంచుతాడు; నియంత్రిస్తాడు
  rationale: సౌలు నాయకత్వ నియామక సందర్భంలో పాలనా భావం ప్రధానంగా కనిపిస్తుంది; అయితే క్రియలోని అదుపు/నియంత్రణ ఛాయను పూర్తిగా తొలగించకుండా పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘జవాబిచ్చాడు’ అనే అసాధారణ ప్రయోగాన్ని, అలాగే יַעְצֹרలోని పాలన–అదుపు అర్థసందిగ్ధతను సంరక్షించింది.
