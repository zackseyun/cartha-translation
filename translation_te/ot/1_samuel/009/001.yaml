source:
  edition: WLC
  text: וַֽ/יְהִי אִ֣ישׁ מ/בן ימין וּ֠/שְׁמ/וֹ קִ֣ישׁ בֶּן אֲבִיאֵ֞ל בֶּן צְר֧וֹר בֶּן בְּכוֹרַ֛ת בֶּן אֲפִ֖יחַ בֶּן אִ֣ישׁ יְמִינִ֑י גִּבּ֖וֹר חָֽיִל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: There was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
translation:
  language: te
  text: బెన్యామీను వంశానికి చెందిన ఒక మనిషి ఉండేవాడు; అతని పేరు కీషు. అతడు అబీయేలు కుమారుడు, అబీయేలు సెరోరు కుమారుడు, సెరోరు బెకోరతు కుమారుడు, బెకోరతు అఫీయహు కుమారుడు, అఫీయహు ఒక బెన్యామీనీయుని కుమారుడు. కీషు పరాక్రమశాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బలవంతుడైన యోధుడు,’ ‘ప్రముఖుడు,’ లేదా ‘ధనవంతుడైన ప్రభావశాలి.’ హీబ్రూ పదబంధం సందర్భానుసారం సైనిక శౌర్యం, సామాజిక స్థాయి లేదా ఆర్థిక బలాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אִישׁ מִבֶּן־יָמִין
  choice: బెన్యామీను వంశానికి చెందిన ఒక మనిషి ఉండేవాడు
  rationale: కథలో కొత్త ఘట్టాన్ని ప్రారంభించే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, מִבֶּן־יָמִין సూచించే గోత్ర సంబంధాన్ని స్పష్టంగా తెలిపింది.
- source_word: וּשְׁמוֹ קִישׁ
  choice: అతని పేరు కీషు
  rationale: హీబ్రూ పేరుపరిచయ సూత్రాన్ని సరళంగా నిలిపి, వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בֶּן ... בֶּן ...
  choice: కుమారుడు
  rationale: వంశావళిలో పునరావృతమయ్యే בן ను ఒకే విధంగా ‘కుమారుడు’ అని అనువదించింది; ఇది కొన్నిసార్లు విస్తృతంగా ‘వంశస్థుడు’ అనే భావం ఇవ్వగలిగినా, ఇక్కడ మూలంలోని వంశావళి రూపాన్ని కాపాడటం సముచితం.
- source_word: אֲבִיאֵל / צְרוֹר / בְּכוֹרַת / אֲפִיחַ
  choice: అబీయేలు / సెరోరు / బెకోరతు / అఫీయహు
  rationale: వ్యక్తి పేర్లను అనువదించకుండా, ఆధునిక తెలుగు పఠనానికి అనుకూలంగా లిప్యంతరీకరించింది.
- source_word: אִישׁ יְמִינִי
  choice: బెన్యామీనీయుడు
  rationale: ఈ పదబంధం వ్యక్తి బెన్యామీను గోత్రానికి చెందినవాడని సూచిస్తుంది; తెలుగులో సహజమైన గోత్రనామ రూపాన్ని ఉపయోగించింది.
- source_word: גִּבּוֹר חָיִל
  choice: పరాక్రమశాలి
  rationale: ఈ సంక్షిప్త పదం శౌర్యం, సామర్థ్యం, సామాజిక ప్రాధాన్యం లేదా సంపదను సూచించగలదు. ప్రధాన పాఠంలో గౌరవప్రదమైన విస్తృత పదాన్ని ఎంచుకొని, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: גִּבּוֹר חָיִל యొక్క భావపరిధి
  choice: పరాక్రమశాలి
  alternative: ప్రముఖుడు; ధనవంతుడైన ప్రభావశాలి; బలవంతుడైన యోధుడు
  rationale: సందర్భం కీషు కుటుంబ స్థాయిని పరిచయం చేస్తున్నప్పటికీ, మూలపదం కేవలం సైనిక శౌర్యానికో కేవలం సంపదకో పరిమితం కాదు. అందువల్ల ప్రధాన పాఠం దాని విస్తృతతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- issue: చివరి వర్ణన ఎవరిని సూచిస్తుంది
  choice: హీబ్రూ పదక్రమానికి అనుగుణంగా పేరు చెప్పని బెన్యామీనీయ పూర్వికునితో కలిపి ఉంచడం
  alternative: కీషును నేరుగా ‘పరాక్రమశాలి’గా వర్ణించడం
  rationale: మూలంలోని వరుస నిర్మాణం ‘అఫీయహు కుమారుడు, బెన్యామీనీయుడైన మనిషి కుమారుడు, పరాక్రమశాలి’ అనే అనుబంధాన్ని అనుమతిస్తుంది. కీషునే ఉద్దేశించిందని నిర్ణయించి వాక్యాన్ని మార్చకుండా, మూల నిర్మాణంలోని ఉద్వేగాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. పొడవైన హీబ్రూ వంశావళి గొలుసును స్పష్టత కోసం అర్ధవిరామాలతో విభజించినప్పటికీ, దాని క్రమాన్ని మార్చలేదు.
