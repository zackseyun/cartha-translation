revisions:
- from: బెన్యామీను వంశానికి చెందిన ఒక మనిషి ఉండేవాడు. అతని పేరు కీషు. అతడు అబీయేలు కుమారుడు; అబీయేలు సెరోరు కుమారుడు; సెరోరు బెకోరతు కుమారుడు; బెకోరతు అఫీయహు కుమారుడు; అఫీయహు బెన్యామీనీయుడైన ఒక పరాక్రమశాలి[a] కుమారుడు.
  to: బెన్యామీను వంశానికి చెందిన ఒక మనిషి ఉండేవాడు; అతని పేరు కీషు. అతడు అబీయేలు కుమారుడు, అబీయేలు సెరోరు కుమారుడు, సెరోరు బెకోరతు కుమారుడు, బెకోరతు అఫీయహు కుమారుడు, అఫీయహు ఒక బెన్యామీనీయుని కుమారుడు. కీషు పరాక్రమశాలి.[a]
  rationale: The revision retains every named link in the Hebrew genealogy and its Benjaminite identification, while placing the concluding characterization with Kish, whom the Hebrew verse introduces and describes. ‘పరాక్రమశాలి’ remains suitably broad in the main text; the footnote preserves the lexical range of גִּבּוֹר חָיִל without forcing a narrowly military or economic interpretation.
