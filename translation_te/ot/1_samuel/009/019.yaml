translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. సంభాషణలో సమూయేలు సౌలును ‘నీవు’ రూపంతో సంబోధించడం ప్రాచీన కథనానికి సహజంగా ఉంది; బహువచన క్రియ ఉన్న చోట ‘మీరు’ ఉంచి పాదటిప్పణితో వివరించాం. మూలంలోని ‘జవాబిచ్చి అన్నాడు’ అనే ద్వంద్వ వ్యక్తీకరణను సహజంగా ‘జవాబిస్తూ ఇలా అన్నాడు’గా అందించాం.
