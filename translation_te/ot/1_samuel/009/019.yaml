source:
  edition: WLC
  text: וַ/יַּ֨עַן שְׁמוּאֵ֜ל אֶת שָׁא֗וּל וַ/יֹּ֨אמֶר֙ אָנֹכִ֣י הָ/רֹאֶ֔ה עֲלֵ֤ה לְ/פָנַ/י֙ הַ/בָּמָ֔ה וַ/אֲכַלְתֶּ֥ם עִמִּ֖/י הַ/יּ֑וֹם וְ/שִׁלַּחְתִּ֣י/ךָ בַ/בֹּ֔קֶר וְ/כֹ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ אַגִּ֥יד לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
translation:
  language: te
  text: 'సమూయేలు సౌలుకు జవాబిస్తూ ఇలా అన్నాడు: “దర్శిని[a] నేనే. నాకంటే ముందుగా ఉన్నత స్థలానికి ఎక్కి వెళ్లు. ఈ రోజు మీరు నాతో కలిసి భోజనం చేస్తారు[b]. ఉదయం నేను నిన్ను సాగనంపుతాను; నీ హృదయంలో ఉన్నదంతా నీకు తెలియజేస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దర్శి’ అనేది ప్రవక్తకు పూర్వకాలంలో వాడిన పేరు; 1 సమూయేలు 9:9 చూడండి.
    reason: historical_term
  - marker: b
    text: ‘మీరు ... భోజనం చేస్తారు’ అని అనువదించిన హీబ్రూ క్రియ బహువచనంలో ఉంది; అది సౌలుతోపాటు అతని సేవకుణ్ణి కూడా ఉద్దేశించి ఉండవచ్చు.
    reason: grammatical_number
lexical_decisions:
- source_word: הָרֹאֶה
  choice: దర్శి
  rationale: ఈ పదానికి అక్షరార్థంగా ‘చూచేవాడు’ అని భావం; 1 సమూయేలు 9:9 ప్రకారం ఇది ప్రవక్తకు వాడిన పూర్వకాలపు పేరు. ‘ప్రవక్త’ అని మాత్రమే అనువదించకుండా మూలంలోని చారిత్రక పదభేదాన్ని నిలిపింది.
- source_word: הַבָּמָה
  choice: ఉన్నత స్థలం
  rationale: ఇది సాధారణంగా ఎత్తైన ప్రదేశంలోని ఆరాధనా స్థలాన్ని సూచిస్తుంది. ‘ఉన్నత స్థలం’ హీబ్రూ స్థలచిత్రాన్ని కాపాడుతూ, ‘మందిరం’ వంటి మరీ నిర్దిష్టమైన అర్థాన్ని చేర్చదు.
- source_word: עֲלֵה לְפָנַי
  choice: నాకంటే ముందుగా ఉన్నత స్థలానికి ఎక్కి వెళ్లు
  rationale: ఎత్తైన ప్రదేశానికి వెళ్లే కదలికను, సౌలు సమూయేలు కంటే ముందుగా వెళ్లాలనే సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  choice: ఈ రోజు మీరు నాతో కలిసి భోజనం చేస్తారు
  rationale: హీబ్రూ క్రియ బహువచనంలో ఉంది. తెలుగు ‘మీరు’ గౌరవ ఏకవచనంగానూ బహువచనంగానూ ఉండగలదు కాబట్టి మూలంలోని బహువచనాన్ని పాదటిప్పణిలో స్పష్టం చేశాం; ‘మీరిద్దరూ’ అని పెట్టడం సేవకుడిని ఉద్దేశించాడనే సంభావ్య భావాన్ని నిశ్చయార్థంగా మార్చేస్తుంది.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: నేను నిన్ను సాగనంపుతాను
  rationale: ఇక్కడ క్రియ సౌలును మరుసటి ఉదయం తన ప్రయాణానికి పంపడాన్ని సూచిస్తుంది. ‘సాగనంపుతాను’ అనేది తిరస్కరించి పంపివేయడమనే అనవసర భావం లేకుండా సందర్భోచిత అర్థాన్ని ఇస్తుంది.
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  choice: నీ హృదయంలో ఉన్నదంతా
  rationale: హీబ్రూ ‘హృదయం’ అనే అంతరంగ రూపకాన్ని నిలిపి, కేవలం ‘నీ మనసులోని ఆలోచనలు’ అని అర్థాన్ని కుదించకుండా ఉంచుతుంది.
- source_word: אַגִּיד לָךְ
  choice: నీకు తెలియజేస్తాను
  rationale: హిఫీల్ రూపంలోని ‘తెలియజేయడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
