translation:
  language: te
  text: వారు ఉన్నత స్థలం నుంచి పట్టణంలోకి దిగివచ్చినప్పుడు[a], అతడు ఇంటి మిద్దెమీద సౌలుతో మాట్లాడాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఉన్నత స్థలం నుంచి పట్టణంలోకి దిగివచ్చారు; అతడు ఇంటి మిద్దెమీద సౌలుతో మాట్లాడాడు.”
    reason: హీబ్రూ వాక్య నిర్మాణాన్ని కాలార్థక ఉపవాక్యంగా కాకుండా వరుసగా జరిగిన రెండు కార్యాలుగా కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: వారు… దిగివచ్చినప్పుడు
  rationale: ఈ క్రియ కథనాన్ని ముందుకు నడిపిస్తుంది. తరువాత వచ్చే ఏకవచన క్రియతో సహజంగా అనుసంధానించేందుకు కాలార్థక ఉపవాక్యంగా అనువదించాం; ‘దిగు’ అనే మూల భావాన్ని నిలిపాం.
- source_word: מֵהַבָּמָה
  choice: ఉన్నత స్థలం నుంచి
  rationale: בָּמָה సాధారణంగా బలి లేదా ఆరాధన జరిగే ఎత్తైన స్థలాన్ని సూచిస్తుంది. ‘ఉన్నత స్థలం’ దాని భౌగోళిక, ఆరాధనా నేపథ్యాలను అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: הָעִיר
  choice: పట్టణంలోకి
  rationale: చలనాన్ని తెలిపే క్రియతో కలిసి ఇది ఉన్నత స్థలం నుంచి పట్టణం లోపలికి వెళ్లడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְדַבֵּר
  choice: అతడు… మాట్లాడాడు
  rationale: హీబ్రూలో ఇక్కడ క్రియ ఏకవచనంలో ఉంది. సందర్భంలో వక్త సమూయేలు అయినప్పటికీ, మూలంలోని సర్వనామాత్మక అస్పష్టతను నిలిపేందుకు పేరును చేర్చకుండా ‘అతడు’ అని అనువదించాం.
- source_word: עִם שָׁאוּל
  choice: సౌలుతో
  rationale: עִם అంటే సాధారణంగా ‘తో’; అందువల్ల ఇది కేవలం ఏకపక్షంగా పలకడం కంటే సౌలుతో సంభాషించడాన్ని సూచిస్తుంది.
- source_word: עַל הַגָּג
  choice: ఇంటి మిద్దెమీద
  rationale: גָּג ప్రాచీన ఇంటి సమతల పైభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ఆ స్థలాన్ని స్పష్టంగా తెలియజేయడానికి ‘ఇంటి మిద్దెమీద’ అని ఎంచుకున్నాం.
