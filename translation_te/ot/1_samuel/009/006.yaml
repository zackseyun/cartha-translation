  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ הִנֵּה נָ֤א אִישׁ אֱלֹהִים֙ בָּ/עִ֣יר הַ/זֹּ֔את וְ/הָ/אִ֣ישׁ נִכְבָּ֔ד כֹּ֥ל אֲשֶׁר יְדַבֵּ֖ר בּ֣וֹא יָב֑וֹא עַתָּה֙ נֵ֣לֲכָה שָּׁ֔ם אוּלַי֙ יַגִּ֣יד לָ֔/נוּ אֶת דַּרְכֵּ֖/נוּ אֲשֶׁר הָלַ֥כְנוּ עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: te
  text: 'అతడు అతనితో ఇలా అన్నాడు: “చూడు, ఈ పట్టణంలో దేవుని మనిషి ఒకడు ఉన్నాడు. అతడు ఎంతో గౌరవనీయుడు; అతడు చెప్పేదంతా తప్పకుండా జరుగుతుంది. ఇప్పుడు మనం అక్కడికి వెళ్దాం. బహుశా మనం వెళ్లవలసిన దారిని అతడు మనకు తెలియజేస్తాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: దేవుని మనిషి
  rationale: హీబ్రూ బిరుదును సహజమైన తెలుగులో నేరుగా నిలుపుతుంది; సందర్భంలో దేవుని ప్రవక్తగా గుర్తింపును సూచిస్తుంది.
- source_word: נִכְבָּד
  choice: ఎంతో గౌరవనీయుడు
  rationale: ఆ వ్యక్తి ప్రజల మధ్య ఘనత, గౌరవం పొందినవాడనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בּוֹא יָבוֹא
  choice: తప్పకుండా జరుగుతుంది
  rationale: అదే ధాతువు పునరుక్తితో వచ్చిన హీబ్రూ బలప్రయోగాన్ని తెలుగులో నిశ్చయార్థకంగా అందిస్తుంది.
- source_word: יַגִּיד לָנוּ
  choice: మనకు తెలియజేస్తాడు
  rationale: ‘చెప్పు/వెల్లడించు’ అనే మూలభావాన్ని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: אֶת דַּרְכֵּנוּ אֲשֶׁר הָלַכְנוּ עָלֶיהָ
  choice: మనం వెళ్లవలసిన దారిని
  rationale: అక్షరార్థంగా అసహజంగా ఉండే ‘మనం దానిమీద వెళ్లిన దారి’ కంటే, తప్పిపోయిన గాడిదలను వెదికే ప్రయాణానికి తదుపరి దిశను అడుగుతున్న సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘దేవుని మనిషి’ అనే బిరుదు
  choice: దేవుని మనిషి
  alternative: ప్రవక్త
  rationale: మూలపాఠంలోని బిరుదును మార్చకుండా ఉంచి, తరువాతి వచనంలో వచ్చే ‘దర్శకుడు/ప్రవక్త’ గుర్తింపును ముందుగానే కలిపివేయలేదు.
- issue: ఆ వ్యక్తి మాటల నెరవేర్పు
  choice: అతడు చెప్పేదంతా తప్పకుండా జరుగుతుంది
  alternative: అతడు చెప్పిన ప్రతి మాట నిజమవుతుంది
  rationale: వాక్యంలోని గౌరవప్రకటనను యథాతథంగా ఉంచుతుంది; ఆ నెరవేర్పు అతని స్వశక్తివల్లనే జరుగుతుందని అదనపు సిద్ధాంతార్థం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథనానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘చూడు’, ‘వెళ్దాం’, ‘బహుశా’ వంటి మాటలు సంభాషణ సహజత్వాన్ని నిలుపుతాయి.
