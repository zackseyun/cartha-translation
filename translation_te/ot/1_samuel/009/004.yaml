translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ప్రయాణ క్రమాన్ని ‘తరువాత’తో స్పష్టంగా చూపిస్తూ, మూలంలోని అతడు/వారు అనే ఏకవచన–బహువచన మార్పులను అలాగే నిలిపాం. పాత శైలిలోని ‘దేశము’కు బదులు ప్రస్తుత పాఠకులకు సహజమైన ‘ప్రాంతం’ వాడాం.
