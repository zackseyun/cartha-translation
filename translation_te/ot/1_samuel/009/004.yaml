  text: וַ/יַּעֲבֹ֧ר בְּ/הַר אֶפְרַ֛יִם וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ שָׁלִ֖שָׁה וְ/לֹ֣א מָצָ֑אוּ וַ/יַּעַבְר֤וּ בְ/אֶֽרֶץ שַׁעֲלִים֙ וָ/אַ֔יִן וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ יְמִינִ֖י וְ/לֹ֥א מָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
translation:
  language: te
  text: అతడు ఎఫ్రాయిము కొండప్రాంతం గుండా వెళ్లి, షాలీషా ప్రాంతం గుండా వెళ్లాడు; కానీ వారు వాటిని కనుగొనలేదు.[a] తరువాత వారు షయలీము ప్రాంతం గుండా వెళ్లారు; కానీ అవి అక్కడ లేవు.[b] తరువాత అతడు బెన్యామీను ప్రాంతం గుండా వెళ్లాడు; కానీ వారు వాటిని కనుగొనలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో కర్మ చెప్పబడలేదు; ‘వాటిని’ అనేది ముందరి సందర్భంలో తప్పిపోయిన గాడిదలను సూచిస్తుంది.
    reason: implicit_object
  - marker: b
    text: హీబ్రూ మాటకు అక్షరార్థంగా ‘ఏదీ లేదు’ లేదా ‘లేకపోయింది’; ఇక్కడ గాడిదలు అక్కడ లేవనే సంక్షిప్త సూచన.
    reason: elliptical_expression
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  choice: గుండా వెళ్లాడు / గుండా వెళ్లారు
  rationale: עבר అనే క్రియ בְ ఉపసర్గతో ఇక్కడ ఒక ప్రాంతం గుండా ప్రయాణించడాన్ని సూచిస్తుంది. ఏకవచన, బహువచన క్రియారూపాల మార్పును తెలుగులోనూ నిలిపి ఉంచాం.
- source_word: בְּהַר אֶפְרַיִם
  choice: ఎఫ్రాయిము కొండప్రాంతం గుండా
  rationale: ప్రాంతాన్ని సూచించే ఈ ప్రయోగంలో הַר ఒకే కొండను కాక కొండలతో కూడిన భూభాగాన్ని సూచిస్తుంది; అందువల్ల సహజమైన ఆధునిక తెలుగు రూపంగా ‘కొండప్రాంతం’ ఎంచుకున్నాం.
- source_word: אֶרֶץ שָׁלִשָׁה
  choice: షాలీషా ప్రాంతం
  rationale: אֶרֶץ ఇక్కడ నిర్దిష్ట రాజకీయ హోదా తెలియని పేరుగల భూభాగాన్ని సూచిస్తుంది. ‘ప్రాంతం’ మూలంలోని భౌగోళిక భావాన్ని అతివ్యాఖ్యానం చేయకుండా అందిస్తుంది.
- source_word: וְלֹא מָצָאוּ
  choice: అయినా వారు వాటిని కనుగొనలేదు
  rationale: బహువచన క్రియ సౌలు, అతని సేవకుడు కలిసి వెదికారని చూపుతుంది. కర్మ హీబ్రూలో వ్యక్తంగా లేకపోయినా మునుపటి సందర్భంలోని తప్పిపోయిన గాడిదలను సూచిస్తుంది; తెలుగులో ‘వాటిని’ అని సహజంగా పూరించాం.
- source_word: אֶרֶץ שַׁעֲלִים
  choice: షయలీము ప్రాంతం
  rationale: పేరుగల భూభాగంగా అనువదించి, హీబ్రూ స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం.
- source_word: וָאַיִן
  choice: కానీ అవి అక్కడ లేవు
  rationale: ఈ సంక్షిప్త హీబ్రూ ప్రయోగానికి అక్షరార్థంగా ‘ఏదీ లేదు/లేకపోయింది’ అనే భావం ఉంటుంది. సందర్భంలో వెదుకుతున్న గాడిదలు అక్కడ లేవని సూచిస్తున్నందున, ఆ అంతర్లీన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం; పాదటిప్పణిలో మూలంలోని సంక్షిప్తతను తెలిపాం.
- source_word: אֶרֶץ יְמִינִי
  choice: బెన్యామీను ప్రాంతం
  rationale: יְמִינִי బెన్యామీనుకు సంబంధించిన విశేషణ/జాతివాచక రూపం. భౌగోళిక సందర్భంలో ‘బెన్యామీను ప్రాంతం’ స్పష్టంగా, సహజంగా ఉంటుంది.
