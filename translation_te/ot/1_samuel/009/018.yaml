id: 1SA.9.18
reference: 1 Samuel 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּגַּ֥שׁ שָׁא֛וּל אֶת שְׁמוּאֵ֖ל בְּ/ת֣וֹךְ הַ/שָּׁ֑עַר וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י אֵי זֶ֖ה בֵּ֥ית הָ/רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/018.yaml
  text: Then Saul approached Samuel in the midst of the gate and said[b][a], “Please tell me where the seer’s house is.”
translation:
  language: te
  text: సౌలు ద్వారం మధ్యలో ఉన్న సమూయేలు దగ్గరకు వచ్చి, “దర్శి[a] ఇల్లు ఎక్కడ ఉందో దయచేసి నాకు చెప్పండి” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దర్శి” అనేది తరువాత సాధారణంగా “ప్రవక్త” అని పిలువబడిన వ్యక్తికి వాడిన పూర్వకాలపు పేరు; 1 సమూయేలు 9:9 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: దగ్గరకు వచ్చి
  rationale: నגשׁ ఇక్కడ ఒక వ్యక్తిని సమీపించడాన్ని సూచిస్తుంది; ‘దగ్గరకు వచ్చి’ అనేది సహజమైన ఆధునిక తెలుగు.
- source_word: בְּתוֹךְ הַשָּׁעַר
  choice: ద్వారం మధ్యలో
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘ద్వారం మధ్యలో’ అని ఉంటుంది; ఇక్కడ ‘ద్వారం’ తలుపును మాత్రమే కాక ద్వారప్రాంతాన్ని కూడా సూచించవచ్చు. మూలంలోని స్థలసూచనను వ్యాఖ్యానాత్మకంగా విస్తరించకుండా ఉంచాం.
- source_word: הַגִּידָה נָּא לִי
  choice: దయచేసి నాకు చెప్పండి
  rationale: ఆజ్ఞార్థక క్రియతో ఉన్న נָא మర్యాదపూర్వక అభ్యర్థనను తెలియజేస్తుంది; తెలుగు మర్యాదా బహువచనం సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: אֵי זֶה
  choice: ఎక్కడ ఉందో
  rationale: సందర్భంలో ఈ ప్రశ్న ఒక ప్రదేశాన్ని తెలుసుకోవడానికి అడిగినది; ‘ఎక్కడ ఉందో’ తెలుగు వాక్యనిర్మాణంలో సహజం.
- source_word: בֵּית הָרֹאֶה
  choice: దర్శి ఇల్లు
  rationale: రֹאֶה అనే పాత బిరుదు యొక్క ‘చూచేవాడు/దర్శి’ భావాన్ని నిలుపుతూ, అధ్యాయంలోని చారిత్రక పదభేదాన్ని కాపాడుతుంది. సమాస సంబంధాన్ని తెలుగులో సహజంగా ‘దర్శి ఇల్లు’ అని ఇచ్చాం.
theological_decisions:
- issue: רֹאֶה అనే పదాన్ని ‘ప్రవక్త’గా సాధారణీకరించాలా?
  choice: దర్శి
  alternative: ప్రవక్త
  rationale: 1 సమూయేలు 9:9 స్వయంగా ఈ పాత పదానికి ‘ప్రవక్త’తో ఉన్న సంబంధాన్ని వివరిస్తుంది. అందువల్ల కథనంలోని చారిత్రక పదభేదాన్ని ముందుగానే తొలగించకుండా ‘దర్శి’గా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, మర్యాదపూర్వక సంభాషణను వాడాం. ‘దర్శి’ కొంత అరుదైన పదమైనప్పటికీ మూలంలోని చారిత్రక ప్రత్యేకతను నిలుపుతుంది; దాని అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
