base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/014.yaml
  text: So they went up to the city. As they were entering the city[a], behold, Samuel was coming out to meet them, to go up to the high place.
translation:
  language: te
  text: వారు పట్టణానికి ఎక్కి వెళ్లారు. వారు పట్టణంలోకి ప్రవేశిస్తుండగా[a], ఇదిగో, సమూయేలు వారిని కలవడానికి, ఉన్నత స్థలానికి ఎక్కి వెళ్లడానికి బయటికి వస్తుండగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పట్టణం మధ్యలోకి వస్తుండగా.’ హీబ్రూలో అక్షరార్థంగా, ‘పట్టణం మధ్యలో [వారు] వస్తుండగా’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ఎక్కి వెళ్లారు
  rationale: עלה ఇక్కడ ఎత్తులో ఉన్న పట్టణం వైపు వెళ్లడాన్ని సూచిస్తుంది; ‘ఎక్కి వెళ్లారు’ దిశాభావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הָעִיר
  choice: పట్టణం
  rationale: עיר నగరం లేదా పట్టణాన్ని సూచించగలదు; ఈ కథా సందర్భంలో ఆధునిక తెలుగులో ‘పట్టణం’ సహజంగా ఉంది.
- source_word: הֵמָּה בָּאִים בְּתוֹךְ הָעִיר
  choice: వారు పట్టణంలోకి ప్రవేశిస్తుండగా
  rationale: స్వతంత్ర సర్వనామం, కృదంత రూపం కొనసాగుతున్న చర్యను సూచిస్తాయి. בתוך העיר అనే పదబంధాన్ని ఇక్కడ పట్టణంలోకి ప్రవేశించే సందర్భానికి అనుగుణంగా అనువదించి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: הנה అకస్మాత్తుగా కనిపించిన ముఖ్య దృశ్యంపై దృష్టి నిలిపే కథన సూచకం; ‘ఇదిగో’ దాని సజీవతను కాపాడుతుంది.
- source_word: יֹצֵא לִקְרָאתָם
  choice: వారికి ఎదురుగా బయటికి వస్తున్నాడు
  rationale: יֹצֵא యొక్క కొనసాగుతున్న క్రియాభావాన్ని ‘వస్తున్నాడు’ తెలియజేస్తుంది; לִקְרָאתָם లోని వారి వైపు/వారిని కలుసుకునే భావాన్ని ‘వారికి ఎదురుగా’ నిలుపుతుంది.
- source_word: לַעֲלוֹת
  choice: ఎక్కి వెళ్లడానికి
  rationale: ఉద్దేశాన్ని తెలిపే infinitive రూపంతో పాటు עלה లోని పైకి వెళ్లే దిశాభావాన్ని కాపాడుతుంది.
- source_word: הַבָּמָה
  choice: ఉన్నత స్థలం
  rationale: במה అనేది ఆరాధనకు సంబంధించిన ఎత్తైన స్థలాన్ని సూచించే చారిత్రక పదం; ‘ఉన్నత స్థలం’ దానిని ‘ఆలయం’ లేదా ‘కొండమీది మందిరం’ అని మరీ వ్యాఖ్యానించదు.
theological_decisions:
- issue: ఆరాధనా స్థలమైన במה అనువాదం
  choice: ఉన్నత స్థలం
  alternative: ఆరాధనా స్థలం; కొండమీది పవిత్ర స్థలం
  rationale: ఈ పదం దేవాలయానికి పూర్వకాల ఇశ్రాయేలులో గుర్తింపుపొందిన ఆరాధనా స్థలాన్ని సూచిస్తుంది. ఈ వచనంలో లేని తరువాతి కాలపు అనుకూల లేదా ప్రతికూల తీర్పును చేర్చకుండా చారిత్రక-మతపరమైన వర్గాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని దృష్టి ఆకర్షణను నిలుపుతుంది; ‘ఉన్నత స్థలం’ సాంకేతిక మతపరమైన పదాన్ని అతివ్యాఖ్యానం చేయకుండా అందిస్తుంది.
