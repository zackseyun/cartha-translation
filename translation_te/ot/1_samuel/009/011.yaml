id: 1SA.9.11
reference: 1 Samuel 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֵ֗מָּה עֹלִים֙ בְּ/מַעֲלֵ֣ה הָ/עִ֔יר וְ/הֵ֨מָּה֙ מָצְא֣וּ נְעָר֔וֹת יֹצְא֖וֹת לִ/שְׁאֹ֣ב מָ֑יִם וַ/יֹּאמְר֣וּ לָ/הֶ֔ן הֲ/יֵ֥שׁ בָּ/זֶ֖ה הָ/רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/011.yaml
  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
translation:
  language: te
  text: వారు పట్టణపు ఎత్తుదారిలో ఎక్కుతూ ఉండగా, నీళ్లు తోడడానికి బయటికి వస్తున్న యువతులు వారికి ఎదురయ్యారు. వారు ఆ యువతులతో, “ద్రష్ట[a] ఇక్కడ ఉన్నాడా?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రవక్త.” హీబ్రూ మూలంలో ప్రత్యేకంగా “ద్రష్ట” అని ఉంది; ఇది తరువాత “ప్రవక్త” అని పిలువబడిన వ్యక్తికి వాడిన పూర్వపు పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים
  choice: ఎక్కుతూ ఉండగా
  rationale: సర్వనామంతో వచ్చిన వర్తమాన కృదంతం కథనంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ ప్రగతిశీల భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּמַעֲלֵה הָעִיר
  choice: పట్టణానికి వెళ్లే ఎత్తుదారిలో
  rationale: מַעֲלֶה పట్టణం వైపు ఎక్కి వెళ్లే దారి లేదా ఎత్తును సూచిస్తుంది; ఈ రూపం భౌగోళిక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מָצְאוּ
  choice: వారికి ఎదురయ్యారు
  rationale: మూల క్రియ ప్రాథమికంగా ‘కనుగొన్నారు’ అని అర్థమిచ్చినా, దారిలో వ్యక్తులను కలిసిన ఈ సందర్భంలో ‘ఎదురయ్యారు’ సహజమైన తెలుగు సమానార్థకం.
- source_word: נְעָרוֹת
  choice: యువతులు
  rationale: ఈ పదం యౌవనస్థులైన స్త్రీలను సూచిస్తుంది; ‘యువతులు’ ఆధునిక, గౌరవప్రదమైన సాధారణ తెలుగు.
- source_word: יֹצְאוֹת לִשְׁאֹב מָיִם
  choice: నీళ్లు తోడడానికి బయటికి వస్తున్న
  rationale: కృదంతం కొనసాగుతున్న చర్యను, తరువాతి క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తాయి; అనువాదం రెండింటినీ కాపాడుతుంది.
- source_word: הֲיֵשׁ בָּזֶה
  choice: ఇక్కడ ఉన్నాడా?
  rationale: ఈ హీబ్రూ ప్రయోగం ఆ వ్యక్తి ఈ చోట ఉన్నాడా అని అడుగుతుంది; ‘ఇక్కడ ఉన్నాడా?’ సంక్షిప్తమైన సహజ తెలుగు.
- source_word: הָרֹאֶה
  choice: దర్శకుడు
  rationale: మూలపదం అక్షరార్థంగా ‘చూచేవాడు/దర్శకుడు’; తరువాత ‘ప్రవక్త’ అని పిలువబడిన వ్యక్తికి వాడిన పూర్వపు బిరుదు. చారిత్రక పదభేదాన్ని నిలుపుకోవడానికి ‘దర్శకుడు’ ఎంచుకోబడింది.
theological_decisions:
- issue: הָרֹאֶה అనే పాత బిరుదును ‘ప్రవక్త’గా సాధారణీకరించాలా
  choice: ప్రధాన పాఠ్యంలో ‘దర్శకుడు’ అని ఉంచి, పాదటిప్పణిలో ‘ప్రవక్త’ అనే ప్రత్యామ్నాయాన్ని వివరించడం
  alternative: ప్రధాన పాఠ్యంలో నేరుగా ‘ప్రవక్త’ అని అనువదించడం
  rationale: మూలపాఠంలోని చారిత్రక పదప్రయోగాన్ని, తదుపరి సందర్భంలో కనిపించే ‘దర్శకుడు/ప్రవక్త’ భేదాన్ని ముందుగానే చెరపకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ‘ఎత్తుదారి,’ ‘నీళ్లు తోడడం’ వంటి రూపాలు సందర్భంలోని భౌగోళికతను, దైనందిన చర్యను సహజంగా తెలియజేస్తాయి.
