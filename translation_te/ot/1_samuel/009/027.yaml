source:
  edition: WLC
  text: הֵ֗מָּה יֽוֹרְדִים֙ בִּ/קְצֵ֣ה הָ/עִ֔יר וּ/שְׁמוּאֵ֞ל אָמַ֣ר אֶל שָׁא֗וּל אֱמֹ֥ר לַ/נַּ֛עַר וְ/יַעֲבֹ֥ר לְ/פָנֵ֖י/נוּ וַֽ/יַּעֲבֹ֑ר וְ/אַתָּה֙ עֲמֹ֣ד כַּ/יּ֔וֹם וְ/אַשְׁמִיעֲ/ךָ֖ אֶת דְּבַ֥ר אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
translation:
  language: te
  text: వారు పట్టణం అంచుకు దిగిపోతుండగా, సమూయేలు సౌలుతో, “ఆ యువకుణ్ణి[a] మనకంటే ముందుగా వెళ్లమని చెప్పు” అన్నాడు. అతడు ముందుగా వెళ్లాడు. “నీవైతే ఇప్పుడు ఇక్కడే నిలుచుండు[b]; నేను నీకు దేవుని వాక్యాన్ని వినిపిస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ సేవకుణ్ణి.” హీబ్రూ נַעַר అనే పదం యువకుణ్ణి, పరిచారకుణ్ణి లేదా సేవకుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం అక్షరార్థంగా “ఇప్పుడు/ఈ సమయంలో నిలుచుండు”; ప్రస్తుతానికి ఆగి అక్కడే ఉండమనే నుడికార భావం దీనికి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרְדִים
  choice: దిగిపోతుండగా
  rationale: హీబ్రూ వర్తమాన కృదంతం కథనంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ రూపం ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בִּקְצֵה הָעִיר
  choice: పట్టణం అంచుకు
  rationale: קָצֶה యొక్క ‘అంచు/చివర’ అనే ప్రాథమిక భావాన్ని, ‘పొలిమేరలు’ వంటి అధిక వ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: אֱמֹר לַנַּעַר
  choice: ఆ యువకుణ్ణి ... చెప్పు
  rationale: נַעַר యువకుడు, పరిచారకుడు లేదా సేవకుడు కావచ్చు. ప్రధాన పాఠంలో విస్తృతమైన ‘యువకుడు’ను ఉంచి, సందర్భానుగుణమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְיַעֲבֹר לְפָנֵינוּ
  choice: మనకంటే ముందుగా వెళ్లమని
  rationale: עבר తో לִפְנֵי కలయిక ఇక్కడ వారి ముందుకు సాగడాన్ని సూచిస్తుంది; తెలుగులో ఇది సహజమైన దిశార్థక వ్యక్తీకరణ.
- source_word: וַיַּעֲבֹר
  choice: అతడు ముందుగా వెళ్లాడు
  rationale: యువకుడు ఆజ్ఞను పాటించినట్లు సంక్షిప్తంగా తెలుపుతూ, ముందటి మాటతో పదబంధ అనుసంధానాన్ని కాపాడుతుంది.
- source_word: עֲמֹד כַּיּוֹם
  choice: ఇప్పుడు ఇక్కడే నిలుచుండు
  rationale: అక్షరార్థంగా క్లిష్టమైన כַּיּוֹם ఇక్కడ ప్రస్తుత క్షణానికి ఆగి ఉండమనే నుడికార భావాన్ని ఇస్తుంది; ‘ఇక్కడే’ సందర్భం నుంచి స్పష్టపరచబడింది.
- source_word: וְאַשְׁמִיעֲךָ
  choice: నీకు ... వినిపిస్తాను
  rationale: שׁמע హిఫీల్ రూపంలోని కారణార్థకమైన ‘వినేలా చేస్తాను’ అనే భావాన్ని సహజమైన తెలుగులో ‘వినిపిస్తాను’ అందిస్తుంది.
- source_word: דְּבַר אֱלֹהִים
  choice: దేవుని వాక్యం
  rationale: ప్రవచన సంబంధ సందర్భంలోని దైవిక ప్రకటన బరువును కాపాడే సూటి, గౌరవప్రదమైన అనువాదం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి ఏకవచనార్థంలో సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో సాధారణ రూపం.
theological_decisions:
- issue: דְּבַר אֱלֹהִים అనే ప్రకటన సూత్రం
  choice: దేవుని వాక్యం
  alternative: దేవుని సందేశం
  rationale: ‘వాక్యం’ మూలంలోని דָּבָר కు దగ్గరగా ఉండి, దైవిక ప్రకటనకు ఉన్న ప్రవచనాత్మక బరువును నిలుపుతుంది; దాని విషయాన్ని ముందుగానే విశదీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘యువకుడు/సేవకుడు’ అనే మూలపద ద్వంద్వార్థాన్ని పాదసూచికలో నిలిపాం. వాక్యాంతంలో వక్తను స్పష్టంచేయడానికి రెండో ‘అన్నాడు’ను తెలుగులో సహజ కథన నిర్మాణంగా చేర్చాం.
