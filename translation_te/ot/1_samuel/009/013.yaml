base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
translation:
  language: te
  text: మీరు పట్టణంలోకి ప్రవేశించగానే ఆయనను కనుగొంటారు. ఆయన భోజనం చేయడానికి ఉన్నత స్థలానికి[a] వెళ్లకముందే ఆయనను కనుగొంటారు. ఎందుకంటే ఆయన వచ్చేవరకు ప్రజలు భోజనం చేయరు; బలిని ఆశీర్వదించేది ఆయనే[b]. ఆ తరువాత ఆహ్వానించబడినవారు భోజనం చేస్తారు. కాబట్టి ఇప్పుడు పైకి వెళ్లండి; ఈ రోజే[c] ఆయనను కనుగొంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఉన్నత స్థలం’ అంటే బలులు అర్పించి, వాటికి సంబంధించిన భోజనాలు చేసే ఎత్తైన ఆరాధనా స్థలం.
    reason: cultural_note
  - marker: b
    text: ‘బలిని ఆశీర్వదించడం’ అంటే ఆహ్వానించబడినవారు బలి భోజనం చేయకముందు దానికి సంబంధించిన ఆశీర్వాదం పలకడం కావచ్చు.
    reason: cultural_note
  - marker: c
    text: హీబ్రూ పదబంధాన్ని ‘ఈ సమయానికే’ లేదా ‘ఇప్పుడే’ అని కూడా అర్థం చేసుకోవచ్చు; అది క్యాలెండర్ రోజుకంటే తక్షణతను ఉద్ఘాటించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  choice: మీరు పట్టణంలోకి ప్రవేశించగానే
  rationale: כְּ + infinitive construct temporal forceను సహజమైన ఆధునిక తెలుగులో చూపుతుంది; సందర్భంలోని తక్షణతను కూడా నిలుపుతుంది.
- source_word: כֵּן תִּמְצְאוּן אֹתוֹ
  choice: ఆయన మీకు కనిపిస్తాడు
  rationale: తెలుగులో ‘కనుగొంటారు’ కంటే వ్యక్తిని ఎదురుగా కలుసుకునే భావానికి ‘మీకు కనిపిస్తాడు’ సహజంగా ఉంది; כֵּן యొక్క ఫలిత/నిశ్చయ భావం సందర్భంలోనే వ్యక్తమవుతుంది.
- source_word: בְּטֶרֶם יַעֲלֶה הַבָּמָתָה
  choice: ఆయన ... ఉన్నత స్థలానికి వెళ్లకముందే
  rationale: בְּטֶרֶם యొక్క పూర్వకాల భావాన్ని స్పష్టంగా ఉంచి, במהకు ఆరాధనాస్థలాన్ని సూచించే సంప్రదాయబద్ధమైన ‘ఉన్నత స్థలం’ను ఎంచుకున్నాం.
- source_word: לֹא יֹאכַל הָעָם עַד בֹּאוֹ
  choice: ఆయన వచ్చేవరకు ప్రజలు భోజనం చేయరు
  rationale: హీబ్రూ వాక్య క్రమం, భవిష్యత్ సందర్భం రెండింటినీ సరళమైన తెలుగులో నిలుపుతుంది.
- source_word: כִּי הוּא יְבָרֵךְ הַזֶּבַח
  choice: బలిని ఆశీర్వదించేది ఆయనే
  rationale: הוּא యొక్క ఉద్ఘాటనను ‘ఆయనే’తో నిలిపి, זבח యొక్క ప్రత్యక్ష అర్థమైన ‘బలి’ని కాపాడాం.
- source_word: הַקְּרֻאִים
  choice: ఆహ్వానించబడినవారు
  rationale: కרא passive participleను ప్రత్యక్షంగా అనువదిస్తూ ‘అతిథులు’ అనే అదనపు నామాన్ని చేర్చలేదు.
- source_word: וְעַתָּה עֲלוּ
  choice: కాబట్టి ఇప్పుడు పైకి వెళ్లండి
  rationale: సందర్భంలోని నిర్ధారణాత్మక అనుసంధానాన్ని ‘కాబట్టి’తో, עלה యొక్క దిశాభావాన్ని ‘పైకి’తో వ్యక్తం చేశాం.
- source_word: כְהַיּוֹם
  choice: ఈ రోజే
  rationale: సందర్భంలో కాలతక్షణతను ఉద్ఘాటించే సాధారణ అర్థాన్ని తీసుకున్నాం; ‘ఇప్పుడే/ఈ సమయానికే’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: ‘బలిని ఆశీర్వదించడం’ అనే క్రియ యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘బలిని ఆశీర్వదించేది ఆయనే’ అని ప్రత్యక్షంగా ఉంచడం
  alternative: ‘బలి భోజనానికి ముందు ఆశీర్వాదం పలికేది ఆయనే’
  rationale: మూలంలోని יְבָרֵךְ הַזֶּבַחను సిద్ధాంతపరంగా విస్తరించకుండా ఉంచి, సందర్భసంబంధ వివరణను పాదటిప్పణికి పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఉన్నత స్థలం,’ ‘బలి’ వంటి మూలపాఠ్య సాంస్కృతిక పదాలను ప్రధాన పాఠ్యంలో నిలిపి, అవసరమైన వివరణను పాదటిప్పణుల్లో ఇచ్చాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
