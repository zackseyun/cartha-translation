  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వచన గౌరవాన్ని నిలుపుతూ రూపొందించబడింది. మూలంలోని రూపవర్ణన మరియు ఎత్తు సూచనను అతిశయార్థం జోడించకుండా నేరుగా అందించింది.
