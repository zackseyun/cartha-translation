id: 1SA.9.2
reference: 1 Samuel 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/ל/וֹ הָיָ֨ה בֵ֜ן וּ/שְׁמ֤/וֹ שָׁאוּל֙ בָּח֣וּר וָ/ט֔וֹב וְ/אֵ֥ין אִ֛ישׁ מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל ט֣וֹב מִמֶּ֑/נּוּ מִ/שִּׁכְמ֣/וֹ וָ/מַ֔עְלָ/ה גָּבֹ֖הַּ מִ/כָּל הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/002.yaml
  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
translation:
  language: te
  text: కీషుకు సౌలు అనే కుమారుడు ఉండేవాడు. అతడు అందమైన యువకుడు. ఇశ్రాయేలీయులలో అతనికంటే అందమైనవాడు మరొకడు లేడు; భుజాలనుండి పైకి అతడు ప్రజలందరికంటే ఎత్తుగా ఉండేవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵן
  choice: కుమారుడు
  rationale: కీషుకు పుట్టిన మగ సంతానాన్ని సూచించే సాధారణ కుటుంబార్థం; ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పదం.
- source_word: וּשְׁמוֹ
  choice: సౌలు అనే
  rationale: హీబ్రూ ‘అతని పేరు’ అనే గుర్తింపు వాక్యాన్ని తెలుగులో సహజంగా ‘అనే’ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בָּחוּר
  choice: యువకుడు
  rationale: యౌవన ప్రాయంలోని పురుషుణ్ణి సూచిస్తుంది; ‘ఎన్నుకోబడినవాడు’ అనే సాధ్యమైన మూలసంబంధ భావాన్ని ఇక్కడ అనవసరంగా దిగుమతి చేయదు.
- source_word: טוֹב / וָטוֹב
  choice: అందమైన
  rationale: సందర్భం సౌలు శారీరక రూపాన్ని, తరువాత అతని ఎత్తును వర్ణిస్తోంది; అందువల్ల సాధారణ ‘మంచి’ కంటే ‘అందమైన’ అనేది సందర్భోచితం.
- source_word: וְאֵין אִישׁ מִבְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులలో ... మరొకడు లేడు
  rationale: అస్తిత్వనిరాకరణను సహజ తెలుగులో అందిస్తుంది; ‘ఇశ్రాయేలు కుమారులలో’ అనే అక్షరానువాదం కంటే సమూహసూచన స్పష్టంగా ఉంటుంది.
- source_word: טוֹב מִמֶּנּוּ
  choice: అతనికంటే అందమైనవాడు
  rationale: ముందున్న రూపవర్ణనను కొనసాగిస్తూ హీబ్రూ తులనాత్మక నిర్మాణాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִשִּׁכְמוֹ וָמַעְלָה
  choice: భుజాలనుండి పైకి
  rationale: సౌలు ఇతరులకంటే తల-భుజాల మేర ఎక్కువ ఎత్తున్నాడనే హీబ్రూ శరీరాధారిత నుడికారాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: גָּבֹהַּ
  choice: ఎత్తుగా
  rationale: ప్రజలతో పోల్చిన శారీరక పొడవును సూచిస్తుంది; తెలుగు తులన ‘కంటే’ ద్వారా ఇప్పటికే స్పష్టమవుతుంది.
- source_word: מִכָּל הָעָם
  choice: ప్రజలందరికంటే
  rationale: మొత్తం ప్రజాసమూహంతో చేసిన హీబ్రూ పోలికను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
