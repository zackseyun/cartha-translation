translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సంభాషణ సహజంగా ఉండేందుకు ‘రా, మనం తిరిగి వెళ్దాం’ అని అనువదించాం; హీబ్రూ నుడికారంలోని అస్పష్టతను [a] పాదసూచికలో భద్రపరిచాం.
