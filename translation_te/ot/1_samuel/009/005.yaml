id: 1SA.9.5
reference: 1 Samuel 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֵ֗מָּה בָּ֚אוּ בְּ/אֶ֣רֶץ צ֔וּף וְ/שָׁא֥וּל אָמַ֛ר לְ/נַעֲר֥/וֹ אֲשֶׁר עִמּ֖/וֹ לְכָ֣/ה וְ/נָשׁ֑וּבָה פֶּן יֶחְדַּ֥ל אָבִ֛/י מִן הָ/אֲתֹנ֖וֹת וְ/דָ֥אַג לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
translation:
  language: te
  text: వారు సూఫు ప్రాంతానికి వచ్చినప్పుడు, సౌలు తనతో ఉన్న యువకునితో, “రా, మనం తిరిగి వెళ్దాం. లేకపోతే నా తండ్రి గాడిదల గురించి పట్టించుకోవడం మానేసి[a], మన గురించి ఆందోళన చెందుతాడు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గాడిదల గురించి చింతించడం మానేసి.” హీబ్రూలో అక్షరార్థంగా “గాడిదల నుండి మానుకొని” అని ఉంది; అంటే వాటి విషయమై శ్రద్ధ పెట్టడం ఆపడం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మన విషయమై చింతిస్తాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צוּף
  choice: సూఫు ప్రాంతానికి వచ్చినప్పుడు
  rationale: בוא + ב ఇక్కడ ఒక ప్రాంతంలోకి వచ్చి చేరడాన్ని సూచిస్తుంది. ‘ప్రాంతం’ భౌగోళిక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; צוּף అనే స్థలనామాన్ని ‘సూఫు’గా లిప్యంతరీకరించాం.
- source_word: נַעֲרוֹ
  choice: తనతో ఉన్న యువకునితో
  rationale: נַעַר కు ‘యువకుడు,’ ‘సేవకుడు,’ ‘సహాయకుడు’ అనే భావాలు ఉండవచ్చు. సందర్భం అతడు సౌలుతో వచ్చిన సహాయకుడని చూపించినా, సామాజిక హోదాను అవసరానికి మించి నిర్దిష్టం చేయకుండా మూలపదపు ప్రాథమిక భావమైన ‘యువకుడు’ను నిలిపాం.
- source_word: לְכָה וְנָשׁוּבָה
  choice: రా, మనం తిరిగి వెళ్దాం
  rationale: ఆజ్ఞార్థక రూపం, సంకల్పార్థక రూపం కలిసి ఇచ్చే ప్రోత్సాహక పిలుపును ఈ సహజ తెలుగు నిర్మాణం నిలుపుతుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: פֶּן ప్రతికూలమైన సంభావ్య పరిణామాన్ని పరిచయం చేస్తుంది. ‘లేకపోతే’ ఆధునిక తెలుగులో ఆ హెచ్చరిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יֶחְדַּל ... מִן הָאֲתֹנוֹת
  choice: గాడిదల గురించి పట్టించుకోవడం మానేసి
  rationale: חדל + מן అక్షరార్థంగా ‘గాడిదల నుండి మానుకోవడం’ అయినా, ఇక్కడ వాటి విషయమై శ్రద్ధ పెట్టడం ఆపి మనుషుల విషయమై చింతించడం మొదలుపెట్టే భావం ఉంది.
- source_word: וְדָאַג לָנוּ
  choice: మన గురించి ఆందోళన చెందుతాడు
  rationale: דאג ఆందోళన లేదా చింతను సూచిస్తుంది; לָנוּ ఆ ఆందోళనకు గురైన వారిని సూచిస్తుంది. ‘మన గురించి ఆందోళన చెందుతాడు’ భావోద్వేగ తీవ్రతను సహజంగా అందిస్తుంది.
