id: 1SA.26.17
reference: 1 Samuel 26:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּכֵּ֤ר שָׁאוּל֙ אֶת ק֣וֹל דָּוִ֔ד וַ/יֹּ֕אמֶר הֲ/קוֹלְ/ךָ֥ זֶ֖ה בְּנִ֣/י דָוִ֑ד וַ/יֹּ֣אמֶר דָּוִ֔ד קוֹלִ֖/י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: te
  text: అప్పుడు సౌలు దావీదు స్వరాన్ని గుర్తించి, “నా కుమారుడా దావీదూ, ఇది నీ స్వరమా?” అన్నాడు. దావీదు, “నా స్వరమే, నా ప్రభువైన రాజా” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: గుర్తించి
  rationale: נכר అనే క్రియ ఇక్కడ విని గుర్తుపట్టడాన్ని సూచిస్తుంది. ‘గుర్తించి’ అనేది సందర్భానికి సహజమైన ఆధునిక తెలుగు.
- source_word: קוֹל
  choice: స్వరం
  rationale: ఇక్కడ కేవలం శబ్దం కాదు, మాట్లాడుతున్న వ్యక్తిని గుర్తించగల స్వరం ఉద్దేశించబడింది. సంభాషణలో పదపునరుక్తిని కూడా ‘స్వరం’ నిలుపుతుంది.
- source_word: הֲקוֹלְךָ זֶה
  choice: ఇది నీ స్వరమేనా?
  rationale: హీబ్రూ ప్రశ్నార్థక నిర్మాణాన్ని, సూచక సర్వనామాన్ని నేరుగా ప్రతిబింబిస్తూ తెలుగులో సహజంగా ఉంది. ‘ఏనా’తో గుర్తింపును నిర్ధారించుకునే ప్రశ్నాభావం స్పష్టమవుతుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: పురుషలింగ కుటుంబ సంబోధనను నిలుపుతుంది. సౌలు శత్రుత్వం మధ్య కూడా దావీదును కుటుంబానుబంధంతో సంబోధించడంలోని కథన ఉద్వేగాన్ని కాపాడుతుంది.
- source_word: קוֹלִי
  choice: ఇది నా స్వరమే
  rationale: మూలంలో అక్షరార్థంగా ‘నా స్వరం’ ఉంది. తెలుగులో అవసరమైన సూచక, విధేయ నిర్మాణాన్ని జోడిస్తూ ‘నేనే’ అని అర్థాంతరం చేయకుండా స్వరం అనే పదాన్ని నిలిపింది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: ఇక్కడ אֲדֹנִי దేవుని బిరుదు కాదు; మానవ రాజుకు గౌరవసూచక సంబోధన. ‘నా ప్రభువైన రాజా’ గౌరవాన్ని, రాజబిరుదును రెండింటినీ సహజ తెలుగులో నిలుపుతుంది.
- source_word: דָּוִד / שָׁאוּל
  choice: దావీదు / సౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలు.
theological_decisions:
- issue: సౌలు పలికిన בְּנִי అనే బంధుత్వ సంబోధన
  choice: నా కుమారుడా
  alternative: నా బిడ్డా
  rationale: ‘కుమారుడు’ మూలంలోని పురుషలింగ నిర్దిష్టతను, సౌలు–దావీదు సంబంధంలోని కథన ఉద్వేగాన్ని కాపాడుతుంది; ‘బిడ్డ’ లింగ నిర్దిష్టతను తగ్గించవచ్చు.
- issue: אֲדֹנִי అనే పదం యొక్క సూచన
  choice: నా ప్రభువైన రాజా
  alternative: నా యజమానుడా, రాజా
  rationale: ఇది దైవనామం లేదా దేవునికి మాత్రమే వర్తించే బిరుదుగా కాక, రాజైన సౌలుకు దావీదు పలికిన గౌరవసూచక మానవ సంబోధనగా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవభరిత కథన శైలి. మూలంలోని ‘స్వరం’ అనే పదపునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. ప్రత్యక్ష సంబోధనలకు ‘దావీదూ’, ‘రాజా’ రూపాలు వాడాం.
