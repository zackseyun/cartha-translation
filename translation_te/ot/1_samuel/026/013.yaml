  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
translation:
  language: te
  text: అప్పుడు దావీదు అవతలి వైపుకు దాటి, కొండ శిఖరం మీద వారికి దూరంగా నిలబడ్డాడు[a]; వారి మధ్య చాలా అంతరం ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి మధ్య స్థలం విస్తారంగా ఉంది.” హీబ్రూలో అక్షరార్థంగా, “వారి మధ్య స్థలం గొప్పది” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: దాటి
  rationale: עבר అనే క్రియ ఒక వైపు నుంచి మరో వైపుకు దాటడాన్ని సూచిస్తుంది; సందర్భంలోని దిశాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הָעֵבֶר
  choice: అవతలి వైపుకు
  rationale: నిర్దిష్ట రూపంలోని ఈ పదం ఎదురుగా లేదా అవతల ఉన్న వైపును సూచిస్తుంది; కథన భౌగోళిక సందర్భానికి ఇది సహజమైన తెలుగు.
- source_word: וַיַּעֲמֹד
  choice: నిలబడ్డాడు
  rationale: మూలంలోని సాధారణ అర్థాన్ని అనవసరమైన వ్యాఖ్యానం లేకుండా స్పష్టంగా అందిస్తుంది.
- source_word: עַל רֹאשׁ הָהָר
  choice: కొండ శిఖరంపై
  rationale: రֹאשׁ‌కు ఇక్కడ భూభాగ సంబంధమైన అర్థం ‘పైభాగం/శిఖరం’; הָהָר సందర్భానుసారం కొండను సూచిస్తుంది.
- source_word: מֵרָחֹק
  choice: దూరంగా ఉన్న
  rationale: స్థలపరమైన దూరాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో తెలియజేస్తుంది.
- source_word: רַב הַמָּקוֹם
  choice: చాలా దూరం ఉంది
  rationale: అక్షరార్థంగా ‘స్థలం/అంతరం గొప్పది’; సందర్భంలో ఇరువర్గాల మధ్య ఉన్న విస్తారమైన దూరాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: בֵּינֵיהֶם
  choice: వారి మధ్య
  rationale: దావీదుకు మరియు ఎదురుగా ఉన్నవారికి మధ్యనున్న స్థలపరమైన అంతరాన్ని నేరుగా సూచిస్తుంది.
