reference: 1 Samuel 26:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ שָׁא֨וּל חָטָ֜אתִי שׁ֣וּב בְּנִֽ/י דָוִ֗ד כִּ֠י לֹֽא אָרַ֤ע לְ/ךָ֙ ע֔וֹד תַּ֠חַת אֲשֶׁ֨ר יָקְרָ֥ה נַפְשִׁ֛/י בְּ/עֵינֶ֖י/ךָ הַ/יּ֣וֹם הַ/זֶּ֑ה הִנֵּ֥ה הִסְכַּ֛לְתִּי וָ/אֶשְׁגֶּ֖ה הַרְבֵּ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
translation:
  language: te
  text: 'అప్పుడు సౌలు ఇలా అన్నాడు: “నేను పాపం చేశాను. నా కుమారుడా దావీదూ, తిరిగి రా. ఈ రోజు నా ప్రాణం[a] నీ దృష్టిలో విలువైనదిగా ఉన్నందున ఇక నీకు హాని చేయను. ఇదిగో, నేను మూర్ఖంగా ప్రవర్తించాను, చాలా తప్పుదారి పట్టాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నా ఆత్మ.” ఇక్కడ హెబ్రీ పదం నֶפֶשׁ సందర్భానుసారం సౌలు ప్రాణాన్ని లేదా జీవితాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “నేను ఎంతో తప్పుచేశాను.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: నేను పాపం చేశాను
  rationale: Qal perfect 1cs; సౌలు తాను చేసిన తప్పును నేరుగా పాపంగా ఒప్పుకుంటున్నాడు. సహజమైన ఆధునిక తెలుగులో సంపూర్ణ చర్యగా వ్యక్తపరచబడింది.
- source_word: שׁוּב
  choice: తిరిగి రా
  rationale: שוב యొక్క ఆజ్ఞార్థక రూపం. గమ్యాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా తిరిగి రావాలనే ప్రత్యక్ష పిలుపును నిలుపుతుంది.
- source_word: בְּנִי דָוִד
  choice: నా కుమారుడా దావీదూ
  rationale: సంబోధనలోని బంధ సూచనను, దావీదు పేరును రెండింటినీ సహజ తెలుగు సంబోధన విభక్తులతో నిలుపుతుంది.
- source_word: לֹא אָרַע לְךָ עוֹד
  choice: ఇక నీకు హాని చేయను
  rationale: ఇక్కడ Hiphil రూపం ఒకరికి కీడు లేదా హాని చేయడాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘నీకు హాని చేయను’ సహజంగా ఉంటుంది.
- source_word: תַּחַת אֲשֶׁר
  choice: ఉన్నందున
  rationale: ఈ సందర్భంలో సౌలు చేసిన వాగ్దానానికి కారణాన్ని పరిచయం చేసే కారణార్థక ప్రయోగం.
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶיךָ
  choice: నా ప్రాణం నీ దృష్టిలో అమూల్యమైనదిగా ఉంది
  rationale: దావీదు సౌలు భౌతిక ప్రాణాన్ని కాపాడిన కథా సందర్భంలో נֶפֶשׁ ‘ప్రాణం/జీవితం’ను సూచిస్తుంది. ‘నీ దృష్టిలో’ హెబ్రీయ ఇడియమ్‌ను గౌరవప్రదంగా నిలుపుతుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: హెబ్రీయ నిర్దేశక పదబంధానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: సౌలు చివరి ఒప్పుకోలుపై దృష్టి నిలిపే ప్రవచన సూచిక; తెలుగు బైబిలు శైలిలోనూ సాధారణ పాఠకులకు అర్థమయ్యే పదం.
- source_word: הִסְכַּלְתִּי
  choice: నేను మూర్ఖంగా ప్రవర్తించాను
  rationale: కేవలం తెలివి లేకపోవడం కాకుండా మూర్ఖమైన రీతిలో ప్రవర్తించడాన్ని సూచించే క్రియాత్మక భావాన్ని కాపాడుతుంది.
- source_word: וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: చాలా ఘోరంగా తప్పిపోయాను
  rationale: שגה లోని తప్పుదారి పట్టడం/తప్పిపోవడం అనే భావాన్ని, הַרְבֵּה מְאֹד యొక్క బలమైన తీవ్రతను కలిపి వ్యక్తపరుస్తుంది; దీనిని కేవలం ‘ఒక పెద్ద పొరపాటు చేశాను’గా చదును చేయదు.
theological_decisions:
- issue: సౌలు ఒప్పుకోలులో נֶפֶשׁ అర్థం
  choice: ‘నా ప్రాణం’గా అనువదించడం
  alternative: ‘నా ఆత్మ’
  rationale: ఈ కథా సందర్భంలో దావీదు సౌలు ప్రాణాన్ని తీయకుండా కాపాడాడు. కాబట్టి ఈ పదం ఇక్కడ సౌలు జీవితం లేదా వ్యక్తిని సూచిస్తుంది; మానవ ఆత్మ స్వభావంపై అవసరం లేని సిద్ధాంతార్థాన్ని అనువాదం దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సంబోధనలో ‘నా కుమారుడా దావీదూ’ అని బంధ భావాన్ని నిలిపి, అతిగా ప్రాచీనమైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం. ప్రధాన పాఠంలోని [a], [b] సూచికలు సంబంధిత పాదసూచికలతో సరిపోతాయి.
