  to: 'అప్పుడు సౌలు ఇలా అన్నాడు: “నేను పాపం చేశాను. నా కుమారుడా దావీదూ, తిరిగి రా. ఈ రోజు నా ప్రాణం[a] నీ దృష్టిలో విలువైనదిగా ఉన్నందున ఇక నీకు హాని చేయను. ఇదిగో, నేను మూర్ఖంగా ప్రవర్తించాను, చాలా తప్పుదారి పట్టాను[b].”'
