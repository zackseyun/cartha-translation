source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל אַבְנֵ֜ר הֲ/לוֹא אִ֣ישׁ אַתָּ֗ה וּ/מִ֤י כָמ֨וֹ/ךָ֙ בְּ/יִשְׂרָאֵ֔ל וְ/לָ֨/מָּה֙ לֹ֣א שָׁמַ֔רְתָּ אֶל אֲדֹנֶ֖י/ךָ הַ/מֶּ֑לֶךְ כִּי בָא֙ אַחַ֣ד הָ/עָ֔ם לְ/הַשְׁחִ֖ית אֶת הַ/מֶּ֥לֶךְ אֲדֹנֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
translation:
  language: te
  text: దావీదు అబ్నేరుతో, “నువ్వు మగవాడివి కాదా? ఇశ్రాయేలులో నీలాంటివాడు ఎవడు?[a] అలాంటప్పుడు నీ ప్రభువైన రాజుకు నువ్వెందుకు కాపలా కాయలేదు? ఎందుకంటే ప్రజల్లో ఒకడు[b] నీ ప్రభువైన రాజును నాశనం చేయడానికి వచ్చాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “ఇశ్రాయేలులో నీకు సాటి ఎవడు?”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “ప్రజల్లో ఒకడు”; అంటే శిబిరంలో ఉన్నవారిలో ఒక వ్యక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  choice: నువ్వు మగవాడివి కాదా?
  rationale: אִישׁ ప్రాథమికంగా ‘మనిషి/పురుషుడు’ అని అర్థం. ఇక్కడ దావీదు అబ్నేరు బాధ్యతను ప్రశ్నిస్తూ సవాలు చేస్తున్నాడు; మూలంలో లేని ‘శూరుడు’ వంటి విశేషణాన్ని చేర్చకుండా, తెలుగు వాడుకలో సహజమైన ప్రశ్నగా అనువదించబడింది.
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో నీలాంటివాడు ఎవడు?
  rationale: כָמוֹךָ అనే పోలిక రూపాన్ని నేరుగా నిలుపుతూ, అబ్నేరుకు సాటి ఎవరూ లేరనే వ్యంగ్యభరిత భావాన్ని పరిష్కరించకుండా ఉంచుతుంది.
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  choice: అలాంటప్పుడు ... నువ్వెందుకు కాపలా కాయలేదు?
  rationale: שׁמר ఇక్కడ సైనిక సందర్భంలో రక్షణాత్మకంగా కనిపెట్టుకొని ఉండడం, కాపలా కాయడం అనే భావం ఇస్తుంది. ‘కాపలా కాయలేదు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אֲדֹנֶיךָ הַמֶּלֶךְ
  choice: నీ ప్రభువైన రాజుకు
  rationale: אדון సూచించే అధికార సంబంధాన్ని ‘ప్రభువు’ నిలుపుతుంది; ‘రాజు’తో దాని అన్వయాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘ప్రభువైన రాజు’ అని ఇచ్చాం.
- source_word: כִּי בָא אַחַד הָעָם
  choice: ఎందుకంటే ప్రజల్లో ఒకడు వచ్చాడు
  rationale: అక్షరార్థమైన ‘ప్రజల్లో ఒకడు’ అనే ప్రయోగాన్ని నిలిపి, అతడు శిబిరంలో ఉన్నవారిలో ఒక వ్యక్తి అనే సందర్భార్థాన్ని పాదసూచికలో వివరించాం; ‘సైనికుడు’ అని మూలానికి మించి నిర్దిష్టం చేయలేదు.
- source_word: לְהַשְׁחִית
  choice: నాశనం చేయడానికి
  rationale: שׁחת హిఫిల్ రూపం ‘నాశనం చేయు/పాడుచేయు’ అనే విస్తృత భావం కలిగి ఉంది. సందర్భంలో రాజును చంపడమే ఉద్దేశమైనప్పటికీ, మూలంలోని విస్తృత పదాన్ని ‘నాశనం చేయడానికి’ అని నిలిపాం.
- source_word: הַמֶּלֶךְ אֲדֹנֶיךָ
  choice: నీ ప్రభువైన రాజును
  rationale: రాజు అబ్నేరు ప్రభువు అనే పునరుక్తిని తొలగించకుండా ఉంచి, అబ్నేరు వైఫల్యంపై దావీదు మోపుతున్న బాధ్యతను నిలిపాం.
