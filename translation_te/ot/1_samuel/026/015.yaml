  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. దావీదు మాటల్లోని సూటి సవాలు, వ్యంగ్యభరిత ప్రశ్నలు, ‘నీ ప్రభువైన రాజు’ అనే ఉద్దేశపూర్వక పునరుక్తి నిలుపబడ్డాయి.
