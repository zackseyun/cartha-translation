source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/זִּפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֨וֹא דָוִ֤ד מִסְתַּתֵּר֙ בְּ/גִבְעַ֣ת הַ/חֲכִילָ֔ה עַ֖ל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/001.yaml
  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
translation:
  language: te
  text: అప్పుడు జీఫీయులు గిబియాలో ఉన్న సౌలు దగ్గరికి వచ్చి, “దావీదు బీడు ప్రాంతానికి[a] ఎదురుగా ఉన్న హకీలా కొండపై దాక్కొని ఉన్నాడు కదా?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యెషీమోనుకు ఎదురుగా.” ఇక్కడి హీబ్రూ పదాన్ని “బీడు ప్రాంతం” అనే సాధారణ నామంగానూ, “యెషీమోను” అనే ప్రాంత నామంగానూ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: అప్పుడు ... వచ్చి
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆధునిక తెలుగు కథన ప్రవాహానికి సహజంగా ఉంది, ‘వచ్చి’ మూలంలోని కదలికను నిలుపుతుంది.
- source_word: הַזִּפִים
  choice: జీఫీయులు
  rationale: ఇది జీఫు నివాసులను సూచించే బహువచన ప్రాంతీయ నామం; సంక్షిప్తంగా వారి భౌగోళిక గుర్తింపును నిలుపుతుంది.
- source_word: הַגִּבְעָתָה
  choice: గిబియాలో ఉన్న సౌలు దగ్గరికి
  rationale: స్థలనామానికి జతైన దిశాసూచక రూపం గిబియా వైపు కదలికను సూచిస్తుంది. సౌలు అక్కడ ఉన్నాడనే సందర్భాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: '... అన్నారు'
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ అనంతరూపాన్ని తెలుగులో సహజమైన ఉక్తి నిర్మాణంతో అందిస్తుంది.
- source_word: הֲלוֹא
  choice: '... ఉన్నాడు కదా?'
  rationale: అంగీకార సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్న భావాన్ని తెలుగు ‘కదా?’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִסְתַּתֵּר
  choice: దాక్కొని ఉన్నాడు
  rationale: סתר హిత్పయేల్ కృదంతంలోని తనను తాను మరుగుపరచుకొని కొనసాగుతున్న స్థితిని ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: హకీలా కొండపై
  rationale: גִּבְעָה సాధారణంగా ‘కొండ’ను సూచిస్తుంది; సందర్భంలోని בְּను ‘పై’ అని అనువదించడం భౌగోళిక స్థితికి సరిపోతుంది.
- source_word: עַל פְּנֵי הַיְשִׁימֹן
  choice: బీడు ప్రాంతానికి ఎదురుగా
  rationale: עַל־פְּנֵי అనే భౌగోళిక ప్రయోగానికి ‘ఎదురుగా’ సమీపమైన అర్థం; הַיְשִׁימֹןను సాధారణ నామంగా తీసుకుంటే ‘బీడు ప్రాంతం’ సులభంగా అర్థమవుతుంది. స్థలనామ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
