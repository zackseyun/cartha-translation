  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. అలంకారిక ప్రశ్నను ‘కదా?’తో వ్యక్తం చేశాం; భౌగోళిక పదబంధంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
