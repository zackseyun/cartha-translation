source:
  edition: WLC
  text: וְ/עַתָּ֗ה אַל יִפֹּ֤ל דָּֽמִ/י֙ אַ֔רְצָ/ה מִ/נֶּ֖גֶד פְּנֵ֣י יְהוָ֑ה כִּֽי יָצָ֞א מֶ֣לֶךְ יִשְׂרָאֵ֗ל לְ/בַקֵּשׁ֙ אֶת פַּרְעֹ֣שׁ אֶחָ֔ד כַּ/אֲשֶׁ֛ר יִרְדֹּ֥ף הַ/קֹּרֵ֖א בֶּ/הָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు నా రక్తం యెహోవా సన్నిధి నుండి దూరంగా నేలపై పడకూడదు. ఇశ్రాయేలు రాజు కొండల్లో ఒక కౌజుపిట్టను[a] వేటాడేవాడిలా, ఒక్క గెంతే పేనును వెదకడానికి బయలుదేరాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి అక్షరార్థంగా ‘పిలిచే పక్షి’ అని అర్థం రావచ్చు; ఇక్కడ సూచించిన పక్షి జాతిని సాంప్రదాయంగా కౌజుపిట్టగా గుర్తిస్తారు.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: דָּמִי
  choice: నా రక్తం
  rationale: హింసాత్మక మరణం, రక్తాపరాధం అనే స్పష్టమైన హీబ్రూ చిత్రాన్ని నిలుపుతుంది; ‘నా ప్రాణం’ అని సరళీకరించలేదు.
- source_word: אַל יִפֹּל ... אַרְצָה
  choice: నేలపై పడకూడదు
  rationale: రక్తం నేలపై చిందడం అనే మూలపాఠంలోని దృశ్యాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  choice: యెహోవా సన్నిధికి దూరంగా
  rationale: అక్షరార్థంలోని ‘ముఖం’ అనే పదాన్ని తెలుగు వాడుకలోని ‘సన్నిధి’గా అందిస్తూ, యెహోవా సన్నిధి నుండి దూరమవుతున్న ప్రాదేశిక భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: יָצָא
  choice: బయలుదేరాడు
  rationale: వెంబడించడానికి రాజు తన స్థలం నుంచి వెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְבַקֵּשׁ
  choice: వెదకడానికి
  rationale: పదానికి ఉన్న విస్తృత అర్థాన్ని నిలుపుతుంది; ‘వేటాడి చంపడానికి’ వంటి సందర్భానుమానాన్ని ముందుగానే చేర్చదు.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: ఒక్క గెంతే పేను
  rationale: אֶחָד ఇచ్చే ‘ఒక్క’ అనే నొక్కిచెప్పడాన్ని, దావీదు తనను తాను అల్పమైనవాడిగా చూపే రూపకాన్ని నిలుపుతుంది. ‘గెంతే పేను’ అనేది సాధారణ పేను నుంచి flea‌ను వేరుచేసి తెలుగు పాఠకునికి స్పష్టతనిస్తుంది.
- source_word: הַקֹּרֵא
  choice: ఒక కౌజుపిట్టను
  rationale: వేట ఉపమానానికి సరిపోయే సాంప్రదాయ నిఘంటు గుర్తింపును వాడింది; పక్షి జాతి గుర్తింపులోని అనిశ్చితిని పాదసూచికలో తెలిపింది.
- source_word: יִרְדֹּף ... בֶּהָרִים
  choice: కొండల్లో ... వేటాడినట్టు
  rationale: వెంబడించే చర్యను వేట సందర్భంలో సహజంగా వ్యక్తం చేస్తూ, పర్వత ప్రాంతాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, తెలుగు బైబిల్ పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచింది.
- issue: యెహోవా సన్నిధికి దూరంగా రక్తం పడటం
  choice: ప్రాదేశిక, నిబంధనాత్మక ఉద్వేగాన్ని తెరిచి ఉంచడం
  alternative: యెహోవా చూడని చోట చనిపోవడం
  rationale: వాక్యం దేశం, ఆరాధనా స్థలం, దేవుని సంరక్షణతో సంబంధం కలిగి ఉండవచ్చు; అయితే మూలపాఠం వాటిలో ఒక్కదానికే భావాన్ని పరిమితం చేయదు. కాబట్టి వివరణాత్మక విస్తరణ చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకునికి సులభంగా ఉండే శైలి. రక్తం నేలపై పడటం, ఒక్క చిన్న జీవిని రాజు వెదకడం అనే వ్యంగ్యభరిత చిత్రాలు అలాగే ఉంచబడ్డాయి.
