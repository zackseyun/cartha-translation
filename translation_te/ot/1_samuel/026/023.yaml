source:
  edition: WLC
  text: וַֽ/יהוָה֙ יָשִׁ֣יב לָ/אִ֔ישׁ אֶת צִדְקָת֖/וֹ וְ/אֶת אֱמֻנָת֑/וֹ אֲשֶׁר֩ נְתָנְ/ךָ֨ יְהוָ֤ה הַ/יּוֹם֙ בְּ/יָ֔ד וְ/לֹ֣א אָבִ֔יתִי לִ/שְׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֥יחַ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
translation:
  language: te
  text: యెహోవా ప్రతి మనిషికి అతని నీతికీ అతని విశ్వసనీయతకూ తగిన ప్రతిఫలం ఇస్తాడు[a]. యెహోవా నిన్ను నేడు నా చేతికి అప్పగించినప్పటికీ, యెహోవా అభిషిక్తునిపై నా చేయి చాపడానికి నేను ఇష్టపడలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా ప్రతి మనిషికి అతని నీతిని, అతని విశ్వసనీయతను తిరిగి ఇస్తాడు.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, యెహోవాచేత అభిషేకించబడిన రాజు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיהוָה יָשִׁיב לָאִישׁ
  choice: యెహోవా ప్రతి మనిషికి ... తగిన ప్రతిఫలం ఇస్తాడు
  rationale: שׁוב హిఫీల్ రూపం ఇక్కడ ఒకరి ప్రవర్తనకు తగినదాన్ని తిరిగి ఇవ్వడం, అంటే ప్రతిఫలమివ్వడం అనే భావాన్ని కలిగిస్తుంది. לָאִישׁ లోని సాధారణ ఏకవచన పురుషరూపాన్ని ‘ప్రతి మనిషికి’ అని నిలిపాం.
- source_word: צִדְקָתוֹ
  choice: అతని నీతి
  rationale: ఈ సందర్భంలో ఇది న్యాయమైన, సదాచారమైన ప్రవర్తనను సూచిస్తుంది; ‘నీతి’ మూలపదపు నైతిక బరువును నిలుపుతుంది.
- source_word: אֱמֻנָתוֹ
  choice: అతని విశ్వసనీయత
  rationale: ఇక్కడ אֱמוּנָה విశ్వాస సిద్ధాంతం కంటే ప్రవర్తనలో కనిపించే నమ్మకత్వం లేదా నిష్ఠను సూచిస్తుంది. ఆధునిక తెలుగులో ‘విశ్వసనీయత’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד
  choice: యెహోవా నిన్ను ఈ రోజు నా చేతికి అప్పగించినా
  rationale: ‘చేతికి అప్పగించడం’ అనే హీబ్రూ రూపకాన్ని తెలుగులో నిలిపాం. తరువాతి నిరాకరణతో ఉన్న విరుద్ధ సంబంధాన్ని తెలుగులో సహజంగా చూపేందుకు ‘అప్పగించినా’ వాడాం; ‘నా’ అనేది వక్త సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: וְלֹא אָבִיתִי
  choice: నేను ఇష్టపడలేదు
  rationale: אבה యొక్క ఇష్టపడటం/సమ్మతించడం అనే భావాన్ని, ‘నిరాకరించాను’ కంటే తక్కువ తీవ్రతతో, దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: לִשְׁלֹחַ יָדִי
  choice: నా చెయ్యి చాపడానికి
  rationale: హాని చేయడం లేదా దాడి చేయడం అనే హీబ్రూ జాతీయాన్ని, అర్థమయ్యే విధంగా దాని శరీర రూపకంతోనే నిలిపాం.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: యెహోవా అభిషిక్తుని మీద
  rationale: מָשִׁיחַ ఇక్కడ యెహోవాచేత అభిషేకించబడిన రాజైన సౌలును సూచిస్తుంది; తరువాతి కాలపు ప్రత్యేక ‘మెస్సీయ’ అర్థాన్ని ఇక్కడికి రప్పించకుండా ‘అభిషిక్తుడు’ అని అనువదించాం.
theological_decisions:
- issue: యెహోవా అనే దైవనామం יְהוָה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని ప్రత్యేక ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా చూపించాం.
- issue: אִישׁ లోని సాధారణ పురుష ఏకవచనం
  choice: ప్రతి మనిషి
  alternative: ప్రతి వ్యక్తి
  rationale: మూలంలోని వ్యాకరణపరమైన పురుష ఏకవచన ప్రతినిధి రూపాన్ని నిలిపాం; అదే సమయంలో తెలుగులో సాధారణ సూత్రంగా స్పష్టంగా ఉంటుంది.
- issue: సౌలుకు వాడిన מְשִׁיחַ
  choice: యెహోవా అభిషిక్తుడు
  alternative: యెహోవా మెస్సీయ
  rationale: ఇది సౌలు రాజుగా అభిషేకించబడిన స్థితిని సూచించే చారిత్రక రాజబిరుదు; ప్రత్యక్ష క్రీస్తుసంబంధ ప్రత్యేకార్థాన్ని బలవంతంగా చేర్చలేదు.
- issue: אֲשֶׁר ఉపవాక్యపు సంబంధం
  choice: అప్పగించినా
  alternative: అప్పగించినప్పుడు / అప్పగించినందున
  rationale: సందర్భంలో అవకాశం లభించినప్పటికీ దావీదు హాని చేయలేదనే విరుద్ధత ప్రధానంగా ఉంది. అయినా మూలంలోని సంబంధసూచక పదం కారణార్థం లేదా కాలార్థాన్నీ అనుమతిస్తుందని గమనికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడాం. ‘చెయ్యి చాపడం’ అనే మూలరూపకాన్ని నిలిపి, ‘ప్రతిఫలం ఇస్తాడు’ ద్వారా హీబ్రూ ప్రతిదాన భావాన్ని సహజంగా తెలిపాం.
