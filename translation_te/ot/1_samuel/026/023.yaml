revisions:
- from: యెహోవా ప్రతి మనిషికి అతని నీతికి, అతని విశ్వసనీయతకు తగిన ప్రతిఫలం ఇస్తాడు[a]. యెహోవా నిన్ను ఈ రోజు నా చేతికి అప్పగించినా, యెహోవా అభిషిక్తుని[b] మీద నా చెయ్యి చాపడానికి నేను ఇష్టపడలేదు.
  to: యెహోవా ప్రతి మనిషికి అతని నీతికీ అతని విశ్వసనీయతకూ తగిన ప్రతిఫలం ఇస్తాడు[a]. యెహోవా నిన్ను నేడు నా చేతికి అప్పగించినప్పటికీ, యెహోవా అభిషిక్తునిపై నా చేయి చాపడానికి నేను ఇష్టపడలేదు[b].
