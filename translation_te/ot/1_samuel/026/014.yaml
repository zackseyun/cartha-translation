base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/014.yaml
  text: Then David called to the troops and to Abner son of Ner, saying, “Will you not answer, Abner?” Abner answered and said, “Who are you, calling to the king?”
translation:
  language: te
  text: అప్పుడు దావీదు సైనికులకూ నేరు కుమారుడైన అబ్నేరుకూ వినిపించేలా, “అబ్నేరూ, నువ్వు జవాబివ్వవా?” అని పిలిచాడు. అబ్నేరు జవాబిస్తూ, “రాజును పిలుస్తున్న నువ్వెవరు?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: సైనికులు
  rationale: సాధారణంగా ‘ప్రజలు’ అని అర్థమయ్యే పదమే అయినా, ఇక్కడ సందర్భం సౌలు వెంట ఉన్న సైనిక బృందాన్ని సూచిస్తుంది; అందువల్ల ‘సైనికులు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּקְרָא ... אֶל
  choice: వినిపించేలా ... పిలిచాడు
  rationale: దావీదు దూరం నుంచి ఆ బృందాన్ని, అబ్నేరును ఉద్దేశించి బిగ్గరగా పిలిచిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֲלוֹא תַעֲנֶה
  choice: నువ్వు జవాబివ్వవా?
  rationale: ప్రశ్నలోని ఆశ్చర్యం లేదా గద్దింపు ధ్వనిని ఉంచుతూ, హీబ్రూ ప్రతికూల ప్రశ్న నిర్మాణాన్ని సహజంగా అందిస్తుంది.
- source_word: מִי אַתָּה קָרָאתָ אֶל הַמֶּלֶךְ
  choice: రాజును పిలుస్తున్న నువ్వెవరు?
  rationale: కర్తను ప్రశ్నించే హీబ్రూ వాక్యాన్ని, కొనసాగుతున్న పిలుపు భావంతో సంక్షిప్తంగా మరియు సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. సంభాషణలో ఏకవచన ‘నువ్వు’ మూలభాషలోని ప్రత్యక్ష సంబోధనను సహజంగా ప్రతిబింబిస్తుంది. ‘నేరు’ అనే రూపం హీబ్రూ נֵר పేరుకు దగ్గరైన తెలుగు లిప్యంతరీకరణ.
