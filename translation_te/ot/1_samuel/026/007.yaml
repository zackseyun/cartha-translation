  text: וַ/יָּבֹא֩ דָוִ֨ד וַ/אֲבִישַׁ֥י אֶל הָ/עָם֮ לַיְלָה֒ וְ/הִנֵּ֣ה שָׁא֗וּל שֹׁכֵ֤ב יָשֵׁן֙ בַּ/מַּעְגָּ֔ל וַ/חֲנִית֥/וֹ מְעוּכָֽה בָ/אָ֖רֶץ מראשת/ו וְ/אַבְנֵ֣ר וְ/הָ/עָ֔ם שֹׁכְבִ֖ים סביבת/ו׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
translation:
  language: te
  text: కాబట్టి దావీదు, అబీషై రాత్రివేళ సైనికుల దగ్గరికి వచ్చారు. ఇదిగో, సౌలు శిబిర వలయం లోపల పడుకొని నిద్రపోతున్నాడు[a]. అతని ఈటె అతని తల దగ్గర నేలలో గుచ్చబడి ఉంది; అబ్నేరు, సైనికులు అతని చుట్టూ పడుకొని ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వలయంలో.” హీబ్రూ పదం బహుశా శిబిరపు వృత్తాకార ఏర్పాటును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: సైనికులు
  rationale: ఇక్కడ సైనిక సందర్భంలో ఈ పదం సాధారణ ప్రజలను కాక సౌలు సైన్యంలోని వారిని సూచిస్తుంది.
- source_word: לַיְלָה
  choice: రాత్రివేళ
  rationale: కాలాన్ని తెలిపే క్రియావిశేషణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: దావీదు చూసిన దృశ్యాన్ని సజీవంగా చూపించే హీబ్రూ కథన సూచిక బలాన్ని నిలుపుతుంది.
- source_word: שֹׁכֵב יָשֵׁן
  choice: నిద్రపోతూ పడుకొని ఉన్నాడు
  rationale: సౌలు పడుకొని ఉండడాన్నీ, నిద్రలో ఉండడాన్నీ రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: בַּמַּעְגָּל
  choice: శిబిర వలయం మధ్యలో
  rationale: ఇది శిబిరంలోని వృత్తాకార రక్షణ ఏర్పాటును లేదా దాని లోపలి ప్రదేశాన్ని సూచిస్తుంది; అనిశ్చితిని పాదసూచికలో తెలియజేస్తూ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: חֲנִיתוֹ
  choice: అతని ఈటె
  rationale: సౌలు కథనాల్లో కనిపించే ఆయుధానికి ఆధునిక తెలుగులో సహజమైన సైనిక పదం.
- source_word: מְעוּכָה בָאָרֶץ
  choice: నేలలో దిగగొట్టబడి ఉంది
  rationale: ఈటెను నేలలో నొక్కి లేదా గుచ్చి నిలిపిన స్థితిని హీబ్రూ కృదంత రూపానికి తగినట్లుగా తెలియజేస్తుంది.
- source_word: מראשתו
  choice: అతని తల దగ్గర
  rationale: ఒకరి తలవైపు ఉన్న స్థలాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో ఇస్తుంది.
- source_word: סביבתו
  choice: అతని చుట్టూ
  rationale: అబ్నేరు, సైనికులు సౌలు చుట్టూ పడుకొని ఉన్న ప్రాదేశిక అమరికను స్పష్టంగా తెలియజేస్తుంది.
