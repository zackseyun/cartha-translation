  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛ד אֶל אֲבִישַׁ֖י אַל תַּשְׁחִיתֵ֑/הוּ כִּ֠י מִ֣י שָׁלַ֥ח יָד֛/וֹ בִּ/מְשִׁ֥יחַ יְהוָ֖ה וְ/נִקָּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
translation:
  language: te
  text: కానీ దావీదు అబీషైతో, “అతన్ని నాశనం చేయకు; యెహోవా అభిషిక్తునికి[a] విరోధంగా చేయి చాచి నిర్దోషిగా ఉండగలవాడు ఎవడు?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అభిషిక్తుడు” అనే హీబ్రూ పదం, తరువాత కాలంలో “మెస్సీయ”తో సంబంధం కలిగిన అదే పదకుటుంబానికి చెందింది. ఇక్కడ అది యెహోవా అభిషేకించిన రాజైన సౌలును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే దావీదు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; సందర్భంలో దావీదు అబీషై ఉద్దేశాన్ని వ్యతిరేకిస్తున్నందున ‘అయితే’ ప్రతికూల మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: అతణ్ణి నాశనం చేయకు
  rationale: שׁחת హిఫిల్ రూపానికి ‘నాశనం చేయు’ అనే విస్తృత అర్థం ఉంది. సందర్భంలో ఇది ప్రాణాంతక దాడిని సూచించినా, ‘చంపకు’ అని మరీ నిర్దిష్టం చేయకుండా మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: దావీదు విధించిన నిషేధానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: מִי
  choice: ఎవరు ... ఉండగలవాడు
  rationale: హీబ్రూలో సాధారణ ప్రశ్నార్థక సర్వనామమే ఉన్నా, ఇది సాధ్యతను మరియు నైతిక నిర్దోషిత్వాన్ని ప్రశ్నించే అలంకార ప్రశ్న; తెలుగులో ‘ఉండగలవాడు ఎవరు?’ దాని బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁלַח יָדוֹ
  choice: చెయ్యి చాపి
  rationale: ఎవరిమీదనైనా, ముఖ్యంగా హింసాత్మకంగా, చర్య తీసుకోవడాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులోనూ పారదర్శకంగా నిలుపుతుంది.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: యెహోవా అభిషిక్తునికి విరోధంగా
  rationale: מָשִׁיחַ అంటే ‘అభిషేకించబడినవాడు’; ఇక్కడ అది యెహోవా అభిషేకించిన రాజైన సౌలును సూచిస్తుంది. שָׁלַח יָד నుడికారంతో వచ్చిన בְּ విరోధ చర్యను సూచిస్తున్నందున ‘విరోధంగా’ అని అనువదించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: וְנִקָּה
  choice: నిర్దోషిగా ఉండగలవాడు
  rationale: נקה ఇక్కడ అపరాధం లేదా బాధ్యత నుంచి విముక్తిగా ఉండడాన్ని సూచిస్తుంది. ‘శిక్ష తప్పించుకొను’ అనే సంకుచిత భావం కంటే ‘నిర్దోషిగా ఉండు’ మూలంలోని నైతిక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సౌలును సూచించే מְשִׁיחַ పదం అనువాదం
  choice: యెహోవా అభిషిక్తుడు
  alternative: యెహోవా మెస్సీయ
  rationale: ఇక్కడ ఈ పదం అంత్యకాల మెస్సీయను నేరుగా సూచించకుండా, యెహోవా అభిషేకించిన రాజైన సౌలును సూచిస్తుంది. ‘అభిషిక్తుడు’ తక్షణ చారిత్రక భావాన్ని కాపాడుతుంది; తరువాత ‘మెస్సీయ’తో ఏర్పడే పదసంబంధాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘చెయ్యి చాపి’ అనే నుడికారాన్ని మూలభాష చిత్రణను నిలుపుటకు ఉంచి, ‘విరోధంగా’ ద్వారా దాని అర్థాన్ని స్పష్టం చేసింది.
