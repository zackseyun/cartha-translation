revisions:
- from: యెహోవా అభిషిక్తునిపై నేను చెయ్యెత్తడం యెహోవా దృష్టిలో నాకు తగదు[a]. ఇప్పుడు అతని తలదగ్గర ఉన్న ఈటెను, నీళ్ల కుండను తీసుకో; మనం వెళ్లిపోదాం.
  to: యెహోవా అభిషిక్తునిపై నేను చేయి చాపకుండా యెహోవా నన్ను అడ్డుకొనుగాక[a]! ఇప్పుడు అతని తలదగ్గర ఉన్న ఈటెను, నీళ్ల కుండను తీసుకో; మనం వెళ్లిపోదాం.
  rationale: The revision restores the strong prohibitive force of the Hebrew formula and avoids making “in Yahweh’s sight” the sole interpretation of the debated prepositional phrase. It also uses a more direct Telugu equivalent for the hostile ‘stretch out my hand’ idiom. The remainder retains the draft’s accurate, natural modern Telugu rendering.
