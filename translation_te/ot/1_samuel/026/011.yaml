source:
  edition: WLC
  text: חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/שְּׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֣יחַ יְהוָ֑ה וְ֠/עַתָּה קַח נָ֨א אֶֽת הַ/חֲנִ֜ית אֲשֶׁ֧ר מראשת/ו וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם וְ/נֵ֥לֲכָה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
translation:
  language: te
  text: యెహోవా అభిషిక్తునిపై నేను చేయి చాపకుండా యెహోవా నన్ను అడ్డుకొనుగాక[a]! ఇప్పుడు అతని తలదగ్గర ఉన్న ఈటెను, నీళ్ల కుండను తీసుకో; మనం వెళ్లిపోదాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా అభిషిక్తునిపై నేను చేయి చాపడం నాకు ఎంతో దూరంగా ఉండుగాక.” హీబ్రూ నుడికారం తీవ్రమైన నిరాకరణను లేదా అసహ్యాన్ని తెలియజేస్తుంది. “యెహోవా”తో ఉన్న భాగాన్ని యెహోవాను సాక్షిగా చేసుకొని పలికిన ప్రమాణసదృశ నిషేధంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיהוָה
  choice: యెహోవా దృష్టిలో నాకు తగదు
  rationale: బలమైన నిరాకరణను తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. מֵיְהוָה యొక్క సంబంధాన్ని పూర్తిగా ఒకే విధంగా నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: מִשְּׁלֹחַ יָדִי
  choice: నేను చెయ్యెత్తడం
  rationale: హాని చేయడానికి లేదా కొట్టడానికి చేయి చాపడాన్ని సూచించే హీబ్రూ నుడికారం; ‘చెయ్యెత్తడం’ తెలుగులో శత్రుత్వ చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: యెహోవా అభిషిక్తునిపై
  rationale: ఇక్కడ מָשִׁיחַ సౌలును యెహోవా అభిషేకించిన రాజుగా సూచిస్తుంది; ‘మెస్సీయ’ అనే తరువాతి బిరుదును అనవసరంగా దిగుమతి చేయకుండా మూలపద సంబంధాన్ని కాపాడుతుంది.
- source_word: קַח נָא
  choice: తీసుకో
  rationale: నָא ఆజ్ఞను మృదుపరుస్తుంది; తెలుగు సందర్భంలో సాధారణ ఆజ్ఞారూపమే సహజంగా ఉండి అభ్యర్థన స్వరాన్ని మోయగలదు.
- source_word: הַחֲנִית אֲשֶׁר מראשתו
  choice: అతని తలదగ్గర ఉన్న ఈటెను
  rationale: నిద్రిస్తున్న సౌలు తల పక్కన ఉంచబడిన ఆయుధ స్థానాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: צַפַּחַת הַמַּיִם
  choice: నీళ్ల కుండను
  rationale: చిన్న నీటి పాత్రను సూచించే పదానికి సాధారణ ఆధునిక తెలుగు సమానార్థకం.
- source_word: וְנֵלֲכָה לָּנוּ
  choice: మనం వెళ్లిపోదాం
  rationale: మొదటి పురుష బహువచన cohortative రూపంలోని ప్రతిపాదనను, అక్కడి నుంచి బయలుదేరే భావంతో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వ్యక్తిగత దైవనామాన్ని పేరుగానే నిలుపుతూ, తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే రూపాన్ని ఉపయోగిస్తుంది.
- issue: ఈ రాజసందర్భంలో מְשִׁיחַ అనువాదం
  choice: అభిషిక్తుడు
  alternative: మెస్సీయ
  rationale: ఈ కథనంలో పదం యెహోవా అభిషేకించిన రాజైన సౌలును సూచిస్తుంది; ‘అభిషిక్తుడు’ మూలార్థాన్ని నిలుపుతుంది, ‘మెస్సీయ’ అయితే ఇక్కడ అవసరానికి మించిన భావాన్ని కలిగించవచ్చు.
- issue: חָלִילָה לִּי מֵיהוָה లో מֵיְהוָה సంబంధం
  choice: యెహోవా దృష్టిలో నాకు తగదు
  alternative: యెహోవా తోడు, నేను ఎన్నటికీ అలా చేయను
  rationale: ఈ నిర్మాణం యెహోవా ఎదుట అభ్యంతరాన్ని లేదా ప్రమాణసదృశ ఆహ్వానాన్ని సూచించవచ్చు. ప్రధాన పాఠం దైవసన్నిధిలోని నైతిక అభ్యంతరాన్ని తెలియజేస్తూ, ప్రమాణసదృశ పఠనాన్ని పాదటిప్పణిలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ నుడికారాన్ని పదేపదే కాక సహజంగా అనువదించి, దాని నిజమైన అర్థసందిగ్ధతను పాదటిప్పణిలో నిలిపింది.
