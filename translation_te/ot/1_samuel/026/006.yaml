translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. వ్యక్తి పేర్లు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణకు దగ్గరగా ఉంచబడ్డాయి. హీబ్రూలోని సంబంధ సూచనలు, ‘దిగివెళ్లడం’ అనే దిశాభావం నిలుపబడ్డాయి; పదేపదే అనువదించడం వల్ల కలిగే అసహజతను మాత్రం నివారించాం.
