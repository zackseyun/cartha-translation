  text: וַ/יַּ֨עַן דָּוִ֜ד וַ/יֹּ֣אמֶר אֶל אֲחִימֶ֣לֶךְ הַ/חִתִּ֗י וְ/אֶל אֲבִישַׁ֨י בֶּן צְרוּיָ֜ה אֲחִ֤י יוֹאָב֙ לֵ/אמֹ֔ר מִֽי יֵרֵ֥ד אִתִּ֛/י אֶל שָׁא֖וּל אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּ֣אמֶר אֲבִישַׁ֔י אֲנִ֖י אֵרֵ֥ד עִמָּֽ/ךְ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
translation:
  language: te
  text: 'అప్పుడు దావీదు హిత్తీయుడైన అహీమెలెకుతోనూ, సెరూయా కుమారుడూ యోవాబు సహోదరుడూ అయిన అబీషైతోనూ ఇలా అన్నాడు: “నాతో కలిసి సౌలు దగ్గరకు, శిబిరానికి ఎవరు దిగివెళ్తారు?” అబీషై, “నేను నీతో కలిసి దిగివెళ్తాను” అన్నాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: అప్పుడు దావీదు ... ఇలా అన్నాడు
  rationale: హీబ్రూ కథన సూత్రంలోని ‘జవాబిచ్చి అన్నాడు’ అనే ద్వంద్వ ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఇక్కడ ముందుగా పలికిన ప్రత్యక్ష ప్రశ్న లేకపోవడంతో ‘జవాబిచ్చాడు’ అనడం కృత్రిమంగా ఉంటుంది.
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  choice: హిత్తీయుడైన అహీమెలెకు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, జాతి సూచక విశేషణాన్ని తెలుగులో స్పష్టంగా అనువదించింది.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: సెరూయా కుమారుడూ యోవాబు సహోదరుడూ అయిన అబీషై
  rationale: రెండు కుటుంబ సంబంధాలనూ నిలుపుతూ ఆధునిక తెలుగులో సహజమైన అన్వయాన్ని ఇస్తుంది.
- source_word: מִי יֵרֵד אִתִּי
  choice: నాతో కలిసి ... ఎవరు దిగివస్తారు?
  rationale: יָרַד యొక్క దిశాసూచక భావాన్ని ‘దిగివస్తారు’గా నిలుపుతూ, אִתִּיని సహజమైన ‘నాతో కలిసి’గా అందిస్తుంది.
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  choice: సౌలు దగ్గరికి, శిబిరంలోకి
  rationale: రెండుసార్లు వచ్చిన אֶל‌ను రెండు గమ్యసూచకాలుగా ప్రతిబింబిస్తూ, సౌలు ఉన్న శిబిరంలోకి వెళ్లడమే ఉద్దేశమని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַמַּחֲנֶה
  choice: శిబిరం
  rationale: מחנהకు ఆధునిక ప్రామాణిక తెలుగులో సాధారణమైన, సందర్భోచితమైన పదం.
- source_word: אֲנִי אֵרֵד עִמָּךְ
  choice: నేను నీతో కలిసి దిగివస్తాను
  rationale: దావీదు ప్రశ్నలోని అదే దిశాసూచక క్రియను పునరావృతం చేసి హీబ్రూ సంభాషణ అనుసంధానాన్ని నిలుపుతుంది.
