source:
  edition: WLC
  text: וַ/יָּ֣קָם דָּוִ֗ד וַ/יָּבֹא֮ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר חָנָה שָׁ֣ם שָׁאוּל֒ וַ/יַּ֣רְא דָּוִ֗ד אֶת הַ/מָּקוֹם֙ אֲשֶׁ֣ר שָֽׁכַב שָׁ֣ם שָׁא֔וּל וְ/אַבְנֵ֥ר בֶּן נֵ֖ר שַׂר צְבָא֑/וֹ וְ/שָׁאוּל֙ שֹׁכֵ֣ב בַּ/מַּעְגָּ֔ל וְ/הָ/עָ֖ם חֹנִ֥ים סביבת/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
translation:
  language: te
  text: అప్పుడు దావీదు లేచి, సౌలు మకాం వేసిన చోటికి వచ్చాడు. అక్కడ సౌలు పడుకొని ఉన్న స్థలాన్నీ, అతని సైన్యాధిపతియైన నేరు కుమారుడు అబ్నేరునూ దావీదు చూశాడు. సౌలు శిబిర వలయంలో[a] పడుకొని ఉండగా, ప్రజలు అతని చుట్టూ మకాం వేసి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా “వలయంలో.” ఇది శిబిరంలోని లోపలి వలయాన్ని లేదా మధ్యభాగాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: కథనంలో తదుపరి చర్యను సూచించే సాధారణ రూపం; ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: וַיָּבֹא אֶל־הַמָּקוֹם
  choice: ఆ చోటికి వచ్చాడు
  rationale: בוא + אֶל తెలిపే స్థలంవైపు గమనాన్ని సరళంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: חָנָה
  choice: మకాం వేసిన
  rationale: సౌలు ఆ ప్రదేశంలో శిబిరం ఏర్పాటు చేసుకున్నాడనే ముందస్తు పరిస్థితిని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּרְא ... אֶת־הַמָּקוֹם
  choice: స్థలాన్నీ ... చూశాడు
  rationale: ראה యొక్క సాధారణ దృశ్యగ్రహణ భావాన్ని నిలుపుతుంది.
- source_word: שָׁכַב ... שֹׁכֵב
  choice: పడుకొని ఉన్న ... పడుకొని ఉండగా
  rationale: మొదటి రూపం స్థలాన్ని గుర్తిస్తుండగా, రెండవది సౌలు అప్పటి భంగిమను వర్ణిస్తుంది; రెండింటి సందర్భభేదాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: וְאַבְנֵר בֶּן־נֵר שַׂר צְבָאוֹ
  choice: అతని సైన్యాధిపతియైన నేరు కుమారుడు అబ్నేరునూ
  rationale: అబ్నేరును దావీదు చూసిన మరో వ్యక్తిగా హెబ్రీ సమన్వయాన్ని నిలుపుతూ, అతని హోదాను స్పష్టంగా తెలుపుతుంది; అబ్నేరు సౌలుతో కలిసి పడుకున్నాడని అనవసరంగా నిర్ధారించదు.
- source_word: בַּמַּעְגָּל
  choice: శిబిర వలయంలో
  rationale: מַעְגָּל లోని వృత్తాకార ఏర్పాటు భావాన్ని నిలుపుతూ, సందర్భంలో అది శిబిరపు అమరిక అని స్పష్టం చేస్తుంది.
- source_word: חֹנִים סְבִיבֹתָיו
  choice: అతని చుట్టూ మకాం వేసి ఉన్నారు
  rationale: సైనికులు సౌలు చుట్టూ శిబిరం వేసి ఉన్న స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
