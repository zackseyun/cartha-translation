source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ חַי יְהוָ֔ה כִּ֥י אִם יְהוָ֖ה יִגָּפֶ֑/נּוּ אֽוֹ יוֹמ֤/וֹ יָבוֹא֙ וָ/מֵ֔ת א֧וֹ בַ/מִּלְחָמָ֛ה יֵרֵ֖ד וְ/נִסְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
translation:
  language: te
  text: 'దావీదు ఇలా అన్నాడు: “యాహ్వే జీవముతోడు, నిశ్చయంగా యాహ్వే అతణ్ణి దెబ్బతీస్తాడు[a]; లేదా అతని రోజు వచ్చి అతడు చనిపోతాడు[b]; లేదా అతడు యుద్ధానికి దిగి నశించిపోతాడు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే అతణ్ణి దెబ్బకొట్టి పడేస్తాడు.”
    reason: నָגַף అనే క్రియ నిర్ణాయకంగా కొట్టడం లేదా కూలదోయడం అనే భావాన్ని కూడా ఇవ్వగలదు.
  - marker: b
    text: అక్షరార్థంగా, “అతని రోజు వస్తుంది, అతడు చనిపోతాడు.” లేదా, “అతని సమయం వచ్చి అతడు చనిపోతాడు.”
    reason: ‘అతని రోజు’ అనేది మరణానికి నిర్ణయించబడిన సమయాన్ని సూచించే జాతీయం; హీబ్రూ సమన్వయ వాక్య నిర్మాణాన్ని మరో విధంగా కూడా తెలుగులో వ్యక్తం చేయవచ్చు.
  - marker: c
    text: లేదా, “అతడు యుద్ధానికి దిగి తుడిచిపెట్టబడతాడు.”
    reason: סָפָה క్రియ నశించడం, నిర్మూలించబడడం లేదా తుడిచిపెట్టబడడం అనే ఛాయలను కలిగి ఉంది.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: యాహ్వే జీవిస్తున్నాడని ప్రమాణం చేసి చెబుతున్నాను
  rationale: ఇది హీబ్రూ ప్రమాణ సూత్రంలోని గంభీరతను సాధారణ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; యాహ్వే జీవాన్ని ఆధారంగా చేసుకొని దావీదు నిశ్చయంగా చెబుతున్న భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: כִּי אִם
  choice: నిశ్చయార్థాన్ని ప్రమాణ వాక్య నిర్మాణం ద్వారా వ్యక్తీకరించడం
  rationale: ఈ సందర్భంలో ఇది మినహాయింపుకన్నా దావీదు చెప్పే విషయాన్ని బలంగా నిర్ధారిస్తుంది. తెలుగులో ప్రమాణ వాక్యం మరియు దీర్ఘవిరామం ఆ బలాన్ని సహజంగా మోస్తాయి.
- source_word: יִגָּפֶנּוּ
  choice: అతణ్ణి దెబ్బతీస్తాడు
  rationale: నָגַף సూచించే దేవుని నిర్ణాయక దెబ్బను వ్యక్తం చేస్తూనే, ఆ దెబ్బ ఏ విధంగా సంభవిస్తుందో నిర్దిష్టం చేయదు.
- source_word: יוֹמוֹ יָבוֹא וָמֵת
  choice: అతని రోజు వచ్చినప్పుడు అతడు చనిపోతాడు
  rationale: మరణానికి నిర్ణయించబడిన రోజు వస్తుందనే హీబ్రూ జాతీయాన్ని నిలుపుతూ, వాక్య సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בַמִּלְחָמָה יֵרֵד
  choice: అతడు యుద్ధానికి దిగి
  rationale: సైనిక కదలికకు వాడిన ‘దిగు’ అనే మూల భావాన్ని కాపాడి, తెలుగులో సహజంగా పలికే నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: וְנִסְפָּה
  choice: నశించిపోతాడు
  rationale: ముందున్న ‘చనిపోతాడు’ అనే పదంతో పూర్తిగా సమానీకరించకుండా, యుద్ధంలో తుడిచిపెట్టబడటం లేదా నశించడం అనే ప్రత్యేక ఛాయను నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో మార్చకుండా, సాధారణంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- issue: సౌలు మరణ విధానంపై దావీదు పలికిన మూడు అవకాశాలు
  choice: మూడు అవకాశాల మధ్య ఉన్న భేదాన్ని అలాగే ఉంచడం
  alternative: మూడింటినీ దేవుడు నేరుగా అతణ్ణి చంపుతాడనే ఒకే భావంగా వివరించడం
  rationale: మూలపాఠం దేవుని ప్రత్యక్ష దెబ్బ, సహజంగా మరణదినం రావడం, యుద్ధంలో నశించడం అనే అవకాశాలను పక్కపక్కన ఉంచుతుంది; వాటి మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. ప్రమాణ సూత్రాన్ని పదేపదే అనుకరించకుండా దాని కార్యాన్ని స్పష్టంగా తెలిపింది. ‘అతని రోజు’ అనే మూల జాతీయాన్ని నిలిపి, వెంటనే సహజమైన కాలవాచక నిర్మాణంతో వివరించింది.
