revisions:
- from: 'దావీదు ఇలా అన్నాడు: “యాహ్వే జీవిస్తున్నాడని ప్రమాణం చేసి చెబుతున్నాను—యాహ్వే అతణ్ణి దెబ్బతీస్తాడు[a]; లేదా అతని రోజు వచ్చినప్పుడు అతడు చనిపోతాడు[b]; లేదా అతడు యుద్ధానికి దిగి నశించిపోతాడు[c].”'
  to: 'దావీదు ఇలా అన్నాడు: “యాహ్వే జీవముతోడు, నిశ్చయంగా యాహ్వే అతణ్ణి దెబ్బతీస్తాడు[a]; లేదా అతని రోజు వచ్చి అతడు చనిపోతాడు[b]; లేదా అతడు యుద్ధానికి దిగి నశించిపోతాడు[c].”'
  rationale: సవరణ మూలంలోని ప్రమాణసూత్రాన్ని ప్రత్యక్షంగా ఉంచి, ధృవీకార కణం యొక్క బలాన్ని ‘నిశ్చయంగా’ ద్వారా వ్యక్తం చేస్తుంది. అలాగే రెండవ మరణ-సంభావ్యతలోని హీబ్రూ క్రమాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో కాపాడుతుంది. మూడు అవకాశాల మధ్య ఉన్న ఉద్దేశపూర్వక భేదం మారలేదు; పాదటిప్పణి గుర్తులు వాటి సంబంధిత పదబంధాల వద్దనే ఉన్నాయి.
