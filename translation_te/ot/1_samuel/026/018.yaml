source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֛ה אֲדֹנִ֥/י רֹדֵ֖ף אַחֲרֵ֣י עַבְדּ֑/וֹ כִּ֚י מֶ֣ה עָשִׂ֔יתִי וּ/מַה בְּ/יָדִ֖/י רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/018.yaml
  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “నా ప్రభువు తన సేవకుణ్ణి[a] ఇలా ఎందుకు వెంటాడుతున్నాడు? నేను ఏమి చేశాను? నా చేతిలో ఏ చెడు ఉంది[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘తన సేవకుణ్ణి’ లేదా ‘అతని సేవకుణ్ణి’ అని ఉంది. ప్రత్యక్ష సంబోధనను సులభం చేయడానికి కొన్ని అనువాదాలు ‘నీ సేవకుణ్ణి’ అని ఇస్తాయి; అయితే మసొరెటిక్ పాఠంలో మూడవ పురుష రూపమే ఉంది.
    reason: alternative_reading
  - marker: b
    text: ‘నా చేతిలో’ అనేది ఒక హీబ్రూ నుడికారం. అది చెడు చేయడంలో అపరాధం, ఉద్దేశం లేదా హాని చేసే సామర్థ్యాన్ని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహంలో మాటను పరిచయం చేసే సాధారణ రూపం. తెలుగులో సహజంగా ఉండేలా ‘ఇలా’ చేర్చబడింది; కాలక్రమాన్ని అతిగా వ్యాఖ్యానించలేదు.
- source_word: לָמָּה זֶּה
  choice: ఇలా ఎందుకు
  rationale: ‘ఎందుకు ఇలా?’ అనే నొక్కిచెప్పే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲדֹנִי
  choice: నా ప్రభువు
  rationale: ఇక్కడ దావీదు సౌలును గౌరవంగా సంబోధిస్తున్నాడు; ఇది దేవునికి ఉపయోగించే బిరుదు కాదు. మానవ అధికారి పట్ల గౌరవాన్ని ‘నా ప్రభువు’ తెలియజేస్తుంది.
- source_word: רֹדֵף אַחֲרֵי
  choice: వెంటాడుతున్నాడు
  rationale: కొనసాగుతున్న శత్రుభావపూర్వక అనుసరణను స్పష్టంగా వ్యక్తం చేస్తుంది; ‘హింసిస్తున్నాడు’ వంటి మరింత వ్యాఖ్యానాత్మక పదాన్ని నివారిస్తుంది.
- source_word: עַבְדּוֹ
  choice: తన సేవకుణ్ణి
  rationale: మసొరెటిక్ పాఠంలో ఉన్న మూడవ పురుష ఏకవచన ప్రత్యయాన్ని (‘అతని/తన సేవకుడు’) నిలుపుతుంది. సందర్భంలో ఇది దావీదు తనను తాను వినయంగా సూచించుకోవడం; అందువల్ల ‘బానిస’ కంటే ‘సేవకుడు’ తగినది.
- source_word: כִּי מֶה עָשִׂיתִי
  choice: నేను ఏమి చేశాను?
  rationale: כִּי ఇక్కడ తరువాతి వివరణాత్మక అలంకార ప్రశ్నను పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేక అనుసంధాన పదం లేకుండానే ప్రశ్నల క్రమం ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּמַה בְּיָדִי רָעָה
  choice: నా చేతిలో ఏ చెడు ఉంది
  rationale: ‘నా చేతిలో’ అనే మూలభాషా రూపకాన్ని నిలుపుతూ, רָעָה యొక్క బలమైన ‘చెడు’ భావాన్ని తగ్గించదు.
theological_decisions:
- issue: దావీదు తనను సూచించడానికి మూడవ పురుష రూపం
  choice: తన సేవకుణ్ణి
  alternative: నీ సేవకుణ్ణి
  rationale: ప్రత్యక్ష సంబోధనలో రెండవ పురుష రూపం సహజంగా అనిపించినా, మసొరెటిక్ పాఠం మూడవ పురుష ప్రత్యయాన్నే కలిగి ఉంది. పాఠంలోని అసాధారణతను ప్రధాన వచనంలో నిలిపి, పాదటిప్పణిలో ప్రత్యామ్నాయాన్ని తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. సౌలుపట్ల దావీదు చూపిన మర్యాదను ‘నా ప్రభువు’ నిలుపుతుంది. ‘వెంటాడుతున్నాడు’ క్రియ కొనసాగుతున్న వెంబడింపును స్పష్టంగా చెబుతుంది. మూలంలోని ‘తన సేవకుణ్ణి’ అనే అసాధారణ మూడవ పురుష రూపం మరియు ‘నా చేతిలో’ అనే రూపకం వివరణాత్మక పాదటిప్పణులతో సహా ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
