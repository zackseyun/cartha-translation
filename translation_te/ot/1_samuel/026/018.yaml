  source_fidelity: మూల హీబ్రూ వాక్యనిర్మాణం మరియు ప్రధాన పదార్థం విశ్వసనీయంగా ప్రతిఫలించాయి. לָמָּה זֶּה ను ‘ఇలా ఎందుకు,’ אֲדֹנִי ను సందర్భోచితమైన గౌరవ సంబోధనగా ‘నా ప్రభువు,’ רֹדֵף אַחֲרֵי ను ‘వెంటాడుతున్నాడు,’ మరియు בְּיָדִי రূপకాన్ని ‘నా చేతిలో’గా సరిగ్గా నిలిపారు. עַבְדּוֹలోని అసాధారణ మూడవ-పురుష స్వామ్యప్రత్యయం ‘తన సేవకుణ్ణి’లో సంరక్షించబడింది.
