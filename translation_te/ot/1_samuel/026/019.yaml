source:
  edition: WLC
  text: וְ/עַתָּ֗ה יִֽשְׁמַֽע נָא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י עַבְדּ֑/וֹ אִם יְהוָ֞ה הֱסִֽיתְ/ךָ֥ בִ/י֙ יָרַ֣ח מִנְחָ֔ה וְ/אִ֣ם בְּנֵ֣י הָ/אָדָ֗ם אֲרוּרִ֥ים הֵם֙ לִ/פְנֵ֣י יְהוָ֔ה כִּֽי גֵרְשׁ֣וּ/נִי הַ/יּ֗וֹם מֵ/הִסְתַּפֵּ֜חַ בְּ/נַחֲלַ֤ת יְהוָה֙ לֵ/אמֹ֔ר לֵ֥ךְ עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/019.yaml
  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
translation:
  language: te
  text: ఇప్పుడు నా ప్రభువైన రాజు దయచేసి తన సేవకుని మాటలు వినాలి. యెహోవా మిమ్మల్ని నాకు విరోధంగా ప్రేరేపించి ఉంటే, ఆయన నైవేద్యాన్ని ఆమోదించుగాక[a]. అయితే మనుషులే చేసి ఉంటే, వారు యెహోవా సన్నిధిలో శాపగ్రస్తులు; ఎందుకంటే, వారు నన్ను ఈ రోజు యెహోవా స్వాస్థ్యానికి చేరకుండా వెళ్లగొట్టారు. వారు, ‘వెళ్లి ఇతర దేవుళ్లను సేవించు’ అని చెప్పినట్టే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆయన నైవేద్యాన్ని వాసన చూడుగాక.” ఇది బలి లేదా అర్పణను అంగీకరించడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: దావీదు విజ్ఞప్తిలోని సంభాషణా మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יִשְׁמַע נָא
  choice: దయచేసి ... వినాలి
  rationale: జస్సివ్ రూపం, נָא కణం కలిగిన మర్యాదపూర్వక విజ్ఞప్తిని రాజుతో మాట్లాడే వినయపూర్వక ధోరణిలో నిలుపుతుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: సౌలుకు ఉద్దేశించిన రాజసభా గౌరవ సంబోధన; ఇక్కడ ‘ప్రభువు’ దైవార్థంలో కాదు.
- source_word: דִּבְרֵי עַבְדּוֹ
  choice: తన సేవకుని మాటలు
  rationale: హీబ్రూ మూడవ పురుషంలోని స్వీయవినయ రాజసభా శైలిని ప్రతిబింబిస్తుంది.
- source_word: אִם יְהוָה הֱסִיתְךָ בִי
  choice: యెహోవా మిమ్మల్ని నా మీదికి ప్రేరేపించి ఉంటే
  rationale: הסית లోని ప్రేరేపించడం/రేపడం అనే కారణార్థాన్ని నిలుపుతూ, దైవకారణం స్వభావాన్ని అదనంగా వివరిస్తూ తీర్మానించదు.
- source_word: יָרַח מִנְחָה
  choice: ఆయన నైవేద్యాన్ని ఆమోదించుగాక
  rationale: అక్షరార్థంగా ‘నైవేద్యాన్ని వాసన చూడుగాక’ అయిన బలిసంబంధిత నుడికారానికి ఉద్దేశించిన అంగీకార భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְאִם בְּנֵי הָאָדָם
  choice: అయితే మనుషులే అలా చేసి ఉంటే
  rationale: యెహోవా చర్యకు విరుద్ధంగా మానవ కర్తలను సూచించే సందర్భార్థాన్ని స్పష్టంగా, సహజంగా తెలుపుతుంది.
- source_word: אֲרוּרִים הֵם לִפְנֵי יְהוָה
  choice: వారు యెహోవా సన్నిధిలో శాపగ్రస్తులు
  rationale: దీనిని శాపకాంక్షగా కాక, హీబ్రూ విధేయ విశేషణ నిర్మాణానికి అనుగుణమైన ప్రకటనగా అనువదిస్తుంది.
- source_word: גֵרְשׁוּנִי
  choice: నన్ను వెళ్లగొట్టారు
  rationale: బలవంతపు వెలివేత భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מֵהִסְתַּפֵּחַ
  choice: పాలుపంచుకోకుండా
  rationale: స్వాస్థ్యంతో/ప్రజలతో జతచేయబడటం లేదా అందులో భాగం కలిగి ఉండటం అనే భావాన్ని సందర్భానుగుణంగా అందిస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: בְּנַחֲלַת יְהוָה
  choice: యెహోవా స్వాస్థ్యంలో
  rationale: భూమి, నిబంధన సమాజం రెండింటినీ సూచించగల נחלה పదంలోని విస్తృత దైవశాస్త్రీయ ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: לֵאמֹר לֵךְ עֲבֹד אֱלֹהִים אֲחֵרִים
  choice: ‘వెళ్లి ఇతర దేవుళ్లను సేవించు’ అని చెబుతూ
  rationale: వారి వెలివేత చర్య కలిగించే మతపరమైన ప్రభావాన్ని హీబ్రూ మాటల రూపంలోనే నిలుపుతుంది.
theological_decisions:
- issue: యెహోవా సౌలును దావీదుకు విరోధంగా ప్రేరేపించడం
  choice: షరతుతో చెప్పిన దైవ ప్రేరణ వాక్యాన్ని యథాతథంగా నిలుపడం
  alternative: దీనిని ప్రత్యక్ష దైవ ప్రేరేపణగా లేదా కేవలం అనుమతించే దైవ పరిపాలనగా వివరించడం
  rationale: హీబ్రూ దైవకారణం మరియు మానవ బాధ్యత మధ్య సంబంధాన్ని వివరించదు; అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
- issue: ‘యెహోవా స్వాస్థ్యం’ నుండి వెలివేయబడటం
  choice: యెహోవా స్వాస్థ్యంలో పాలుపంచుకోకుండా చేయబడటంగా విస్తృతంగా అనువదించడం
  alternative: దీనిని కేవలం భూభాగం నుండి లేదా కేవలం ఆరాధనా ప్రవేశం నుండి వెలివేతగా పరిమితం చేయడం
  rationale: ఈ పదబంధం భూమితో పాటు నిబంధన ప్రజల్లో భాగస్వామ్యాన్ని కూడా సూచించగలదు; విస్తృతమైన స్వాస్థ్య భాషను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజుతో మాట్లాడే దావీదు వినయాన్ని ‘దయచేసి,’ ‘నా ప్రభువైన రాజు,’ ‘తన సేవకుడు’ వంటి గౌరవ రూపాలతో నిలిపింది. దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది. భాష గంభీరంగా ఉన్నప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచబడింది.
