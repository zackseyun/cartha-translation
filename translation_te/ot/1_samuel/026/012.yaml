  to: కాబట్టి దావీదు సౌలు తలదగ్గర ఉన్న ఈటెను, నీటి కూజాను తీసుకున్నాడు[a]; తరువాత వారిద్దరూ వెళ్లిపోయారు. ఎవరూ చూడలేదు, ఎవరూ తెలుసుకోలేదు, ఎవరూ మేలుకోలేదు; ఎందుకంటే వారందరూ నిద్రలో ఉన్నారు, ఎందుకంటే యాహ్వే నుండి వచ్చిన గాఢ నిద్ర వారిమీద పడింది[b].
  rationale: దైవనామాన్ని ప్రాజెక్టు-నిర్దేశిత ‘యాహ్వే’ రూపానికి మార్చాం. మూలంలోని వరుస కారణసంబంధాన్ని తెలుగులో స్పష్టంగా చూపేందుకు చివరి వాక్యభాగాలను కలిపాం. పదప్రయోగాలను ఆధునిక ప్రామాణిక తెలుగుకు మృదువుగా సవరించాం; అర్థంలో మార్పు లేదు. [a], [b] గుర్తులు తమ పాదసూచికలతో సరియైన చోట ఉన్నాయి.
