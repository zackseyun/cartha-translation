  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד אֶֽת הַ/חֲנִ֜ית וְ/אֶת צַפַּ֤חַת הַ/מַּ֨יִם֙ מֵרַאֲשֹׁתֵ֣י שָׁא֔וּל וַ/יֵּלְכ֖וּ לָ/הֶ֑ם וְ/אֵ֣ין רֹאֶה֩ וְ/אֵ֨ין יוֹדֵ֜עַ וְ/אֵ֣ין מֵקִ֗יץ כִּ֤י כֻלָּ/ם֙ יְשֵׁנִ֔ים כִּ֚י תַּרְדֵּמַ֣ת יְהוָ֔ה נָפְלָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
translation:
  language: te
  text: కాబట్టి దావీదు సౌలు తలదగ్గర ఉన్న ఈటెను, నీటి కూజాను తీసుకున్నాడు[a]; తరువాత వారిద్దరూ వెళ్లిపోయారు. ఎవరూ చూడలేదు, ఎవరూ తెలుసుకోలేదు, ఎవరూ మేలుకోలేదు; ఎందుకంటే వారందరూ నిద్రలో ఉన్నారు, ఎందుకంటే యాహ్వే నుండి వచ్చిన గాఢ నిద్ర వారిమీద పడింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సౌలు తలవైపు నుండి.” అతడు నిద్రిస్తున్నప్పుడు అతని తల పక్కన ఉన్న స్థలాన్ని ఈ హెబ్రీయ భాషాప్రయోగం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వే యొక్క గాఢ నిద్ర వారిమీద పడింది.” ఈ మాటలు ఆ నిద్ర యాహ్వే వల్ల కలిగిందని సూచిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲנִית
  choice: ఈటెను
  rationale: חֲנִית యుద్ధంలో ఉపయోగించే spear/lanceను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘ఈటె’ సహజమైన, స్పష్టమైన పదం.
- source_word: צַפַּחַת הַמַּיִם
  choice: నీళ్ల కూజాను
  rationale: צַפַּחַת చిన్న పాత్ర, సీసా లేదా కూజాను సూచిస్తుంది. సందర్భంలో తాగునీరు ఉంచే పాత్రకు ‘నీళ్ల కూజా’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  choice: సౌలు తలదగ్గర ఉన్న
  rationale: ఈ హెబ్రీయ భాషాప్రయోగం నిద్రిస్తున్న సౌలు తలవైపు లేదా తల పక్కన ఉన్న స్థలాన్ని సూచిస్తుంది; వస్తువులు అతని తలమీద ఉన్నాయనే అపార్థం రాకుండా ‘తలదగ్గర’ అని అనువదించబడింది.
- source_word: וַיֵּלְכוּ לָהֶם
  choice: వారిద్దరూ వెళ్లిపోయారు
  rationale: బహువచన క్రియ దావీదు, అబీషై ఇద్దరినీ సూచిస్తుంది. తెలుగులో కర్త స్పష్టత కోసం ‘వారిద్దరూ’ చేర్చడం సందర్భానుగుణం.
- source_word: וְאֵין רֹאֶה וְאֵין יוֹדֵעַ וְאֵין מֵקִיץ
  choice: ఎవరూ చూడలేదు, ఎవరూ గమనించలేదు, ఎవరూ మేలుకోలేదు
  rationale: హెబ్రీయ పునరుక్త నిర్మాణాన్ని తెలుగులోనూ నిలిపి, ראהను ‘చూడలేదు,’ ידעను సందర్భానుసారంగా ‘గమనించలేదు,’ קיץను ‘మేలుకోలేదు’గా ఇచ్చాం.
- source_word: כִּי כֻלָּם יְשֵׁנִים
  choice: ఎందుకంటే వారందరూ నిద్రపోతున్నారు
  rationale: ఈ వాక్యభాగం ఎవరూ స్పందించకపోవడానికి తక్షణ కారణాన్ని తెలుపుతుంది; కొనసాగుతున్న స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תַּרְדֵּמַת יְהוָה
  choice: యెహోవా నుండి వచ్చిన గాఢనిద్ర
  rationale: תַּרְדֵּמָה సాధారణ నిద్రకంటే గాఢమైన నిద్రను సూచిస్తుంది. యెహోవాతో ఉన్న నిర్మాణం మూలం లేదా కార్యసాధకత్వాన్ని సూచించగలదు; ‘నుండి వచ్చిన’ ఆ భావాన్ని సహజంగా తెలుపుతూ ప్రత్యక్ష కారణాత్మక పునర్వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చాం.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: వారిమీద పడింది
  rationale: మూలంలోని ‘మీద పడడం’ అనే రూపకాన్ని తెలుగులో సహజంగా, అర్థమయ్యే విధంగా నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధారణ తెలుగు బైబిలు పాఠకులకు పరిచితమైన లిప్యంతరీకరణను ఉపయోగించాం.
- issue: תַּרְדֵּמַת יְהוָהలో దైవ కార్యసాధకత్వం
  choice: యెహోవా నుండి వచ్చిన గాఢనిద్ర
  alternative: యెహోవా గాఢనిద్రను వారిమీదికి రప్పించాడు / యెహోవా యొక్క గాఢనిద్ర
  rationale: హెబ్రీయ సమాసం మూలం, సంబంధం లేదా కార్యసాధకత్వాన్ని సూచించగలదు. ‘నుండి వచ్చిన’ దేవుని కార్యాన్ని సూచిస్తుంది గాని, మూలంలో లేని ప్రత్యక్ష క్రియను చేర్చి అస్పష్టతను పూర్తిగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ఎవరూ... ఎవరూ... ఎవరూ...’ అనే మూలపాఠపు లయాత్మక పునరుక్తిని నిలిపాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలతో సరిపోతాయి.
