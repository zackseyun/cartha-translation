source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כַּ/אֲשֶׁ֨ר גָּדְלָ֧ה נַפְשְׁ/ךָ֛ הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/עֵינָ֑/י כֵּ֣ן תִּגְדַּ֤ל נַפְשִׁ/י֙ בְּ/עֵינֵ֣י יְהוָ֔ה וְ/יַצִּלֵ֖/נִי מִ/כָּל צָרָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
translation:
  language: te
  text: ఇదిగో[a], ఈ రోజు నీ ప్రాణం నా దృష్టిలో ఎంత విలువైనదిగా ఉందో, అలాగే నా ప్రాణం యాహ్వే దృష్టిలో విలువైనదిగా ఉండుగాక; ఆయన నన్ను ప్రతి ఆపదనుండి విడిపించుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చూడు.” హీబ్రూ పదం తరువాతి మాటపై ప్రత్యేకంగా దృష్టి పెట్టమని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే మాటపై గట్టిగా దృష్టి నిలిపే హీబ్రూ సంభాషణ సూచకాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גָּדְלָה ... נַפְשְׁךָ ... בְּעֵינַי
  choice: నీ ప్రాణం నా దృష్టిలో ఎంత విలువైనదిగా ఉందో
  rationale: పదశః ‘గొప్పదైంది’ అనే భావం ఉన్నా, ఈ సందర్భంలో దావీదు సౌలు ప్రాణాన్ని కాపాడి దానికి అధిక విలువ ఇచ్చాడనే హీబ్రూ నుడికార భావాన్ని ‘విలువైనది’ స్పష్టంగా అందిస్తుంది.
- source_word: נֶפֶשׁ
  choice: ప్రాణం
  rationale: ఇక్కడ నెఫెష్ అమూర్తమైన ‘ఆత్మ’ను కాకుండా, చంపకుండా కాపాడబడిన లేదా ఆపదనుండి విడిపించబడే జీవప్రాణాన్ని సూచిస్తుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: మూలంలోని కాల ప్రాధాన్యాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: כֵּן
  choice: అలాగే
  rationale: మొదటి వాక్యభాగంలోని పోలికకు అనుగుణంగా రెండవ వాక్యభాగాన్ని స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: תִּגְדַּל ... נַפְשִׁי ... בְּעֵינֵי יְהוָה
  choice: నా ప్రాణం యెహోవా దృష్టిలో విలువైనదిగా ఉండుగాక
  rationale: అసంపూర్ణ క్రియలోని ఆకాంక్ష లేదా ప్రార్థనా భావాన్ని ‘ఉండుగాక’ నిలుపుతుంది; మొదటి భాగంతో సమాంతరతను కూడా కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ప్రత్యక్ష రూపంతో అందిస్తుంది; బిరుదుతో భర్తీ చేయదు.
- source_word: וְיַצִּלֵנִי
  choice: ఆయన నన్ను ... విడిపించుగాక
  rationale: హిఫీల్ రూపంలోని రక్షించడం లేదా ప్రమాదం నుంచి బయటపడేయడం అనే భావాన్ని ప్రార్థనాత్మక తెలుగులో అందిస్తుంది.
- source_word: מִכָּל צָרָה
  choice: ప్రతి ఆపదనుండి
  rationale: צָרָה సూచించే కష్టం, సంకటం, ప్రమాదం వంటి విస్తృత భావాన్ని సందర్భానుకూలంగా సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగానే ఉంచాం. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ ప్రత్యామ్నాయ లిప్యంతరీకరణ.
- issue: תִּגְדַּל మరియు וְיַצִּלֵנִי యొక్క విధి భావం
  choice: ఆకాంక్ష/ప్రార్థనగా ‘ఉండుగాక ... విడిపించుగాక’
  alternative: భవిష్యత్ ప్రకటనగా ‘విలువైనదిగా ఉంటుంది ... విడిపిస్తాడు’
  rationale: సందర్భంలో దావీదు తన క్రియకు ప్రతిగా దేవుని అనుగ్రహాన్ని కోరుతున్నాడు. హీబ్రూ అసంపూర్ణ రూపాలు ఆకాంక్షను అనుమతిస్తాయి; అయినా భవిష్యత్ భావసాధ్యతను వ్యాకరణం పూర్తిగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. పోలికలోని సమాంతర నిర్మాణం, ప్రార్థనాత్మక ఉద్వేగం నిలుపబడ్డాయి. ప్రధాన పాఠ్యంలో ‘విలువైనది’ నుడికార భావాన్ని సహజంగా తెలియజేస్తుంది.
