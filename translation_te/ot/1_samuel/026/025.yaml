  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד בָּר֤וּךְ אַתָּה֙ בְּנִ֣/י דָוִ֔ד גַּ֚ם עָשֹׂ֣ה תַעֲשֶׂ֔ה וְ/גַ֖ם יָכֹ֣ל תּוּכָ֑ל וַ/יֵּ֤לֶךְ דָּוִד֙ לְ/דַרְכּ֔/וֹ וְ/שָׁא֖וּל שָׁ֥ב לִ/מְקוֹמֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/025.yaml
  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
translation:
  language: te
  text: అప్పుడు సౌలు దావీదుతో ఇలా అన్నాడు, “నా కుమారుడా దావీదూ, నీవు ధన్యుడవు. నీవు తప్పకుండా చేస్తావు; తప్పకుండా జయిస్తావు[a].” తరువాత దావీదు తన దారిన వెళ్లిపోయాడు; సౌలు తన స్థలానికి తిరిగి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “చేయడం చేస్తావు; చేయగలగడం చేయగలవు.” రెండు చోట్లా క్రియానామంతో కూడిన బలప్రయోగ నిర్మాణం దావీదు భవిష్యత్ కార్యసాఫల్యంలోని నిశ్చయాన్ని బలంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ אַתָּה
  choice: నీవు ఆశీర్వదించబడినవాడివి
  rationale: దావీదును నేరుగా ఉద్దేశించిన నిష్క్రియార్థక కృదంత ఆశీర్వాద సూత్రాన్ని కోరికగా కాక ప్రకటనగా నిలుపుతుంది.
- source_word: בְּנִי דָוִד
  choice: నా కుమారుడా దావీదూ
  rationale: సౌలు ఉపయోగించిన కుటుంబసంబంధమైన లేదా సంరక్షకసంబంధమైన సంబోధనను, దానికి అనుబంధంగా ఉన్న దావీదు పేరును సహజమైన తెలుగు సంబోధనలో నిలుపుతుంది.
- source_word: גַּם עָשֹׂה תַעֲשֶׂה
  choice: నీవు తప్పకుండా కార్యాలు చేస్తావు
  rationale: క్రియార్థక నామరూపం మరియు అసంపూర్ణ క్రియ కలయికలోని బలాన్ని ‘తప్పకుండా’ ద్వారా చూపుతుంది. మూలంలో లేని ‘గొప్ప’ అనే విశేషణాన్ని చేర్చకుండా, ఒంటరి ‘చేస్తావు’ కంటే తెలుగులో అర్థవంతంగా ఉండేందుకు ‘కార్యాలు’ వాడబడింది.
- source_word: וְגַם יָכֹל תּוּכָל
  choice: తప్పకుండా విజయం సాధిస్తావు
  rationale: మరో బలప్రయోగ నిర్మాణాన్ని ‘తప్పకుండా’తో నిలుపుతూ, సందర్భంలో సామర్థ్యం ఫలప్రదమై జయించడం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ
  choice: తరువాత దావీదు తన దారిన వెళ్లిపోయాడు
  rationale: హీబ్రూ నుడికారంలోని విడిచి వెళ్లిపోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְשָׁאוּל שָׁב לִמְקוֹמוֹ
  choice: సౌలు తన స్థలానికి తిరిగి వెళ్లాడు
  rationale: ‘ఇంటికి’ అని మూలానికి మించిన నిర్దిష్టతను చేర్చకుండా, שׁוּב మరియు ‘తన స్థలానికి’ అనే పదబంధాన్ని దగ్గరగా అనుసరిస్తుంది.
theological_decisions:
- issue: దావీదు భవిష్యత్తు కార్యసాఫల్యంపై సౌలు పలికిన మాటల బలం
  choice: తప్పకుండా కార్యాలు చేస్తావు; తప్పకుండా విజయం సాధిస్తావు
  alternative: గొప్ప కార్యాలు చేస్తావు; తప్పకుండా జయిస్తావు
  rationale: రెండు హీబ్రూ బలప్రయోగ నిర్మాణాల నిశ్చయాన్ని నిలుపుతూ, మూలంలో స్పష్టంగా లేని ‘గొప్ప’ అనే భావాన్ని చేర్చలేదు; ఈ మాటలను ప్రత్యేకమైన సిద్ధాంత ప్రకటనగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. సంబోధన సహజంగా ఉండేందుకు ‘నా కుమారుడా దావీదూ’ వాడబడింది. మూలంలోని పునరుక్త బలాన్ని ‘తప్పకుండా’ ద్వారా రెండుసార్లు నిలిపి, వివరణాత్మక అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
