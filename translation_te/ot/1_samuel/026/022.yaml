- from: 'దావీదు జవాబిస్తూ ఇలా అన్నాడు: “ఇదిగో, రాజు ఈటె! యువకుల్లో[b] ఒకడు ఇటు దాటి వచ్చి[a] దాన్ని తీసుకుపోవాలి.”'
  to: 'దావీదు జవాబిచ్చి ఇలా అన్నాడు: “ఇదిగో, రాజుగారి ఈటె! యువకుల్లో[b] ఒకడు ఇటు దాటి వచ్చి[a] దాన్ని తీసుకుపోవాలి.”'
  rationale: The revision preserves the source’s two speech verbs with «జవాబిచ్చి ఇలా అన్నాడు» and clarifies the genitive relationship in ‘the king’s spear’ with idiomatic Telugu. No theological or disputed-text issue is involved. Existing footnote markers remain attached to the terms they explain.
