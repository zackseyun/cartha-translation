translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఇదిగో’ ద్వారా ప్రత్యక్ష సూచనను, ‘దాటి వచ్చి’ ద్వారా స్థలాంతరణ భావాన్ని స్పష్టంగా ఉంచాం. మూలంలోని ఆజ్ఞార్థక/అనుమతార్థక భావాన్ని తెలుగులో ‘తీసుకుపోవాలి’తో సహజంగా వ్యక్తం చేశాం.
