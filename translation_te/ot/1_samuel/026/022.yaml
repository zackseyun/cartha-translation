  yaml_path: translation/ot/1_samuel/026/022.yaml
  text: David answered and said[a], “Here is the king’s spear[b]. Let one of the young men come over and take it.”
translation:
  language: te
  text: 'దావీదు జవాబిచ్చి ఇలా అన్నాడు: “ఇదిగో, రాజుగారి ఈటె! యువకుల్లో[b] ఒకడు ఇటు దాటి వచ్చి[a] దాన్ని తీసుకుపోవాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇటు దాటి వచ్చి” అనే మాటకు బదులుగా “దాటి వెళ్లి” అని కూడా అనువదించవచ్చు; హీబ్రూ క్రియకు అక్షరార్థంగా “దాటడం/అవతలికి వెళ్లడం” అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “యువకులు” అనే పదాన్ని సందర్భానుసారం “సేవకులు” లేదా “పరిచారకులు” అని కూడా అనువదించవచ్చు; హీబ్రూ పదం వయస్సునుగానీ, అధీన హోదానుగానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: దావీదు జవాబిస్తూ ఇలా అన్నాడు
  rationale: మూలంలోని ‘జవాబిచ్చాడు’ మరియు ‘అన్నాడు’ అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: సమీపంలో ఉన్న ఈటెవైపు శ్రద్ధ మళ్లించే సూచనాత్మక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַחֲנִית הַמֶּלֶךְ
  choice: రాజు ఈటె
  rationale: ఈటె రాజుకు చెందినదనే సంబంధాన్ని తెలుగులో సహజమైన షష్ఠీ సమాసంతో తెలియజేస్తుంది.
- source_word: וְיַעֲבֹר
  choice: ఇటు దాటి వచ్చి
  rationale: עבר అనే క్రియ యొక్క ‘దాటడం’ అనే మూలభావాన్నీ, దావీదు ఉన్న వైపుకు రావాలనే సందర్భార్థాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: యువకుల్లో ఒకడు
  rationale: אֶחָד యొక్క ఏకవచన భావాన్ని, נְעָרִים యొక్క ప్రాథమిక వయోసూచక అర్థాన్ని కాపాడుతుంది; సేవకులు లేదా పరిచారకులు అనే సందర్భసాధ్య అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְיִקָּחֶהָ
  choice: దాన్ని తీసుకుపోవాలి
  rationale: స్త్రీలింగ ప్రత్యయం ఈటెను సూచిస్తుంది. ‘తీసుకుపోవాలి’ అనేది వస్తువును అక్కడి నుంచి స్వాధీనం చేసుకొని వెళ్లే సందర్భాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
