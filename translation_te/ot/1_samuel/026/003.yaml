translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి పాటించబడింది. హెబ్రీ భౌగోళిక నిర్మాణాన్ని కాపాడుతూ, తెలుగు వాక్యప్రవాహం కోసం స్థానవివరాలను సహజ క్రమంలో అమర్చాం. ప్రధాన పాఠ్యంలోని [a] సూచిక సంబంధిత పాదటిప్పణికి అనుసంధానించబడింది.
