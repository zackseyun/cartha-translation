  edition: WLC
  text: וַ/יִּ֨חַן שָׁא֜וּל בְּ/גִבְעַ֣ת הַ/חֲכִילָ֗ה אֲשֶׁ֛ר עַל פְּנֵ֥י הַ/יְשִׁימֹ֖ן עַל הַ/דָּ֑רֶךְ וְ/דָוִד֙ יֹשֵׁ֣ב בַּ/מִּדְבָּ֔ר וַ/יַּ֕רְא כִּ֣י בָ֥א שָׁא֛וּל אַחֲרָ֖י/ו הַ/מִּדְבָּֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
translation:
  language: te
  text: దారిపక్కన యెషీమోనుకు ఎదురుగా ఉన్న హఖీలా కొండమీద సౌలు మకాం వేశాడు. దావీదు అరణ్యంలో ఉన్నాడు; సౌలు తనను వెంబడిస్తూ అరణ్యంలోకి వచ్చాడని అతడు గ్రహించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యెషీమోను” అనే పదాన్ని స్థలనామంగా కాకుండా “బంజరు ప్రదేశం” లేదా “ఎడారి” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַן
  choice: మకాం వేశాడు
  rationale: సైనిక ప్రయాణ సందర్భంలో חנה శిబిరం వేయడాన్ని సూచిస్తుంది; ‘మకాం వేశాడు’ సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: హఖీలా కొండమీద
  rationale: גִּבְעָה అనే సాధారణ నామవాచకాన్ని ‘కొండ’గా అనువదించి, חֲכִילָה అనే స్థలనామాన్ని ‘హఖీలా’గా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר עַל פְּנֵי הַיְשִׁימֹן
  choice: యెషీమోనుకు ఎదురుగా
  rationale: עַל־פְּנֵי ఇక్కడ ‘ఎదురుగా’ లేదా ‘ముఖంగా’ అనే స్థానార్థాన్ని ఇస్తుంది; הַיְשִׁימֹן ను భౌగోళిక స్థలనామంగా ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: עַל הַדָּרֶךְ
  choice: దారిపక్కన
  rationale: ఈ స్థానవర్ణనలో עַל సమీపాన్ని సూచిస్తుంది; ‘దారిపక్కన’ అనడం సౌలు అక్షరార్థంగా దారిమీదే ఉన్నాడనే అపార్థాన్ని నివారిస్తుంది.
- source_word: יֹשֵׁב
  choice: ఉంటున్నాడు
  rationale: ישב కు కూర్చోవడం, నివసించడం, ఉండడం అనే అర్థాలు ఉన్నాయి; సందర్భంలో కొనసాగుతున్న నివాసస్థితిని ‘ఉంటున్నాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారినే కాక జనావాసం తక్కువైన అరణ్యప్రాంతాన్ని సూచించగలదు; ‘అరణ్యం’ సందర్భోచితం.
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו
  choice: సౌలు తనను వెంబడిస్తూ ... వచ్చాడని అతడు గ్రహించాడు
  rationale: ראה ఇక్కడ కేవలం కంటితో చూడడం కన్నా పరిస్థితిని తెలుసుకోవడం లేదా గ్రహించడం అనే భావం కలిగి ఉండవచ్చు; בוא + אַחֲרָיו లోని రావడం మరియు వెంబడించడం రెండింటినీ తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: הַמִּדְבָּרָה
  choice: అరణ్యంలోకి
  rationale: పదాంతంలోని దిశాసూచక ה, అరణ్యం వైపు లేదా అరణ్యంలోకి కదలికను సూచిస్తుంది; ‘అరణ్యంలోకి’ దాన్ని స్పష్టంగా చూపిస్తుంది.
