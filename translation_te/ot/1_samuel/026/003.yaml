  to: దారిపక్కన యెషీమోనుకు ఎదురుగా ఉన్న హఖీలా కొండమీద సౌలు మకాం వేశాడు. దావీదు అరణ్యంలో ఉన్నాడు; సౌలు తనను వెంబడిస్తూ అరణ్యంలోకి వచ్చాడని అతడు గ్రహించాడు.[a]
