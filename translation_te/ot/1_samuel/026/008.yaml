  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
translation:
  language: te
  text: అప్పుడు అబీషై దావీదుతో, “ఈ రోజు దేవుడు నీ శత్రువును నీ చేతికి అప్పగించాడు[a]. ఇప్పుడు, దయచేసి, ఈటెతో అతణ్ణి ఒక్క దెబ్బతో నేలలోకి గుచ్చివేయడానికి నన్ను అనుమతించు[b]; అతనిపై రెండోసారి దెబ్బ వేయను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ రోజు దేవుడు నీ శత్రువును నీ అధికారానికి అప్పగించాడు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఈటెతో, నేలలోకి, ఒక్కసారి.” ఒకే దెబ్బతో అతణ్ణి నేలలోకి గుచ్చివేయాలని అబీషై చెప్పిన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: סִגַּר
  choice: అప్పగించాడు
  rationale: ఈ సందర్భంలో శత్రువును మరొకరి ఆధీనంలోకి ఇవ్వడం అనే భావం ఉంది. ‘అప్పగించాడు’ సహజమైన ఆధునిక తెలుగు; ‘మూసివేశాడు’ అనే మూలార్థాన్ని యాంత్రికంగా అనుసరించదు.
- source_word: בְּיָדֶךָ
  choice: నీ చేతికి
  rationale: హెబ్రీయుల ‘చేతిలో/చేతికి’ అనే అధికార సూచక రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אַכֶּנּוּ נָא
  choice: దయచేసి ... అతణ్ణి ... గుచ్చివేయనివ్వు
  rationale: కోహోర్టేటివ్ రూపంలోని అబీషై అభ్యర్థనను, స్వయంగా తాను చేయబోయే చర్యగా తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: בַּחֲנִית וּבָאָרֶץ פַּעַם אַחַת
  choice: ఈటెతో ఒక్క దెబ్బలోనే అతణ్ణి నేలకు గుచ్చివేయనివ్వు
  rationale: ఈటెతో కొట్టి నేలకు గుచ్చిపడేయాలనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తూ, ఒక్క ప్రయత్నమే చాలునన్న అబీషై మాటను నిలుపుతుంది.
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  choice: నేను అతణ్ణి రెండోసారి కొట్టను
  rationale: ‘మళ్లీ చేయను’ అనే సంక్షిప్త హెబ్రీయు ప్రయోగంలో సూచితమైన కొట్టే చర్యను తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: సౌలు అబీషైకి అందుబాటులో ఉండటంలో దేవుని కార్యం
  choice: దేవుడు నీ శత్రువును నీ చేతికి అప్పగించాడు
  alternative: దేవుడు నీ శత్రువును నీ అధికారానికి అప్పగించాడు
  rationale: ఇది దేవుని సంకల్పంపై అబీషై చేసిన వ్యాఖ్యగా మాత్రమే అనువదించబడింది. అతని హత్యా ప్రతిపాదనకు దేవుని ఆమోదం ఉందని అదనంగా చెప్పకుండా, మూలపాఠంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి ఉపయోగించబడింది. ‘నీ చేతికి’ అనే బైబిలీయ రూపకం సాధారణ పాఠకుడికి అర్థమయ్యేలా నిలుపబడింది; హింసాత్మక చర్యను మూలపాఠం కంటే మృదువుగానో ఘాటుగానో చేయలేదు.
