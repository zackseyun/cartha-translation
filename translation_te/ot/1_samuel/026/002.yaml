id: 1SA.26.2
reference: 1 Samuel 26:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣קָם שָׁא֗וּל וַ/יֵּ֨רֶד֙ אֶל מִדְבַּר זִ֔יף וְ/אִתּ֛/וֹ שְׁלֹֽשֶׁת אֲלָפִ֥ים אִ֖ישׁ בְּחוּרֵ֣י יִשְׂרָאֵ֑ל לְ/בַקֵּ֥שׁ אֶת דָּוִ֖ד בְּ/מִדְבַּר זִֽיף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
translation:
  language: te
  text: అప్పుడు సౌలు లేచి జీఫు అరణ్యానికి దిగివెళ్లాడు. దావీదును జీఫు అరణ్యంలో వెదకడానికి ఇశ్రాయేలీయుల్లో ఎంపికైన మూడు వేల మంది అతనితో ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ కథనంలో నిర్ణయాత్మక చర్య ప్రారంభాన్ని సూచించే సాధారణ హీబ్రూ ప్రయోగం. ‘లేచి’ దాని రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיֵּרֶד
  choice: దిగివెళ్లాడు
  rationale: ירד లోని దిగువ దిశ భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: אֶל מִדְבַּר זִיף
  choice: జీఫు అరణ్యానికి
  rationale: מִדְבָּר ఇసుక ఎడారిని మాత్రమే కాక జనావాసం తక్కువైన అరణ్య ప్రాంతాన్ని సూచిస్తుంది; అందువల్ల ‘అరణ్యం’ తగిన భౌగోళిక పదం.
- source_word: וְאִתּוֹ
  choice: అతనితో ఉన్నారు
  rationale: సహవాసాన్ని నేరుగా తెలియజేస్తూ, హీబ్రూ పరిస్థితి సూచక నిర్మాణాన్ని తెలుగులో సహజమైన వాక్యంగా అందిస్తుంది.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: మూడు వేల మంది
  rationale: అక్షరార్థంగా ‘మూడు వేల మంది’; సైనిక సందర్భం ఉన్నప్పటికీ మూలంలో లేని ‘సైనికులు’ అనే పదాన్ని చేర్చలేదు.
- source_word: בְּחוּרֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల్లో ఎంపికైన
  rationale: ఈ పదబంధం ఇశ్రాయేలులో నుంచి ఎన్నుకోబడిన శ్రేష్ఠమైన పురుషులను సూచిస్తుంది. ‘ఎంపికైన’ ఎంపిక భావాన్ని నిలుపుతుంది; ‘ఇశ్రాయేలీయుల్లో’ వారి సమూహ మూలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְבַקֵּשׁ
  choice: వెదకడానికి
  rationale: בקש ఈ సందర్భంలో దావీదును కనుగొనే ఉద్దేశంతో వెదకడం లేదా అన్వేషించడం. ‘వెదకడానికి’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: אֶת דָּוִד
  choice: దావీదును
  rationale: అనువదించని ప్రత్యక్ష కర్మ సూచిక אֶת ను తెలుగు ద్వితీయా విభక్తి ‘ను’ ద్వారా వ్యాకరణబద్ధంగా వ్యక్తపరిచింది.
- source_word: בְּמִדְבַּר זִיף
  choice: జీఫు అరణ్యంలో
  rationale: మూలంలోని పునరుక్తిని తొలగించకుండా నిలిపి, בְּ ను సందర్భానుసారంగా ‘లో’ అని అనువదించింది.
