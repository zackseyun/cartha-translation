id: 1SA.26.16
reference: 1 Samuel 26:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא ט֞וֹב הַ/דָּבָ֣ר הַ/זֶּה֮ אֲשֶׁ֣ר עָשִׂיתָ֒ חַי יְהוָ֗ה כִּ֤י בְנֵי מָ֨וֶת֙ אַתֶּ֔ם אֲשֶׁ֧ר לֹֽא שְׁמַרְתֶּ֛ם עַל אֲדֹנֵי/כֶ֖ם עַל מְשִׁ֣יחַ יְהוָ֑ה וְ/עַתָּ֣ה רְאֵ֗ה אֵֽי חֲנִ֥ית הַ/מֶּ֛לֶךְ וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם אֲשֶׁ֥ר מראשת/ו־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
translation:
  language: te
  text: నీవు చేసిన ఈ పని మంచిది కాదు. యాహ్వే జీవముతోడు, మీరు మరణశిక్షకు పాత్రులు[a]. ఎందుకంటే మీరు మీ యజమానిని, యాహ్వే అభిషిక్తుణ్ణి కాపాడలేదు. ఇప్పుడు చూడు—రాజు ఈటె, ఆయన తల దగ్గర ఉన్న నీళ్ల పాత్ర ఎక్కడ ఉన్నాయి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మీరు మరణపు కుమారులు”; ఇది వారు మరణశిక్షకు పాత్రులని లేదా చావుకు అర్హులని సూచించే నుడికారం.
    reason: హీబ్రూ నుడికారం యొక్క అక్షరార్థాన్ని, దాని న్యాయపరమైన భావాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: לֹא טוֹב הַדָּבָר הַזֶּה
  choice: నీవు చేసిన ఈ పని మంచిది కాదు
  rationale: మూలంలోని సరళమైన ప్రతికూల మూల్యాంకనాన్ని నిలుపుతూ, సందర్భంలో ఉద్దేశించిన చర్యను సహజమైన ఆధునిక తెలుగులో ‘పని’గా వ్యక్తం చేస్తుంది.
- source_word: חַי יְהוָה
  choice: యాహ్వే సజీవుడని ప్రమాణం
  rationale: ఇది హీబ్రూ ప్రమాణ సూత్రం. తెలుగులో దాని గంభీరమైన ప్రమాణార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְנֵי מָוֶת אַתֶּם
  choice: మీరు మరణపాత్రులు
  rationale: అక్షరార్థమైన ‘మరణపు కుమారులు’ తెలుగులో అపారదర్శకంగా ఉంటుంది. ‘మరణపాత్రులు’ దోషానికి మరణశిక్ష తగినదనే న్యాయపరమైన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: שְׁמַרְתֶּם עַל
  choice: కాపాడలేదు
  rationale: సైనిక సందర్భంలో అప్రమత్తంగా ఉండి రక్షించాల్సిన బాధ్యతను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֲדֹנֵיכֶם
  choice: మీ యజమానిని
  rationale: ఇక్కడ సౌలును తన సేవకులకు అధిపతిగా సూచిస్తుంది; దైవ బిరుదుతో గందరగోళం రాకుండా ‘యజమాని’ ఎంచుకోబడింది.
- source_word: מְשִׁיחַ יְהוָה
  choice: యాహ్వే అభిషిక్తుణ్ణి
  rationale: సౌలు రాజుగా పొందిన పవిత్ర నియామక స్థితిని కాపాడుతుంది; తరువాతి కాలపు ‘మెస్సీయ’ బిరుదును ఈ సందర్భంలో అనవసరంగా దిగుమతి చేయదు.
- source_word: חֲנִית הַמֶּלֶךְ
  choice: రాజు ఈటె
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; חֲנִיתకు సందర్భోచితమైన సాధారణ అర్థం ‘ఈటె’.
- source_word: צַפַּחַת הַמַּיִם אֲשֶׁר מְרַאֲשֹׁתָיו
  choice: ఆయన తల దగ్గర ఉన్న నీళ్ల పాత్ర
  rationale: పాత్ర యొక్క స్థానం మరియు దాని ఉపయోగాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని పేరుగానే ప్రతిబింబిస్తుంది; సాధారణ బిరుదుతో దానిని భర్తీ చేయదు.
- issue: מְשִׁיחַ יְהוָה అనే రాజసంబంధ పదబంధం
  choice: యాహ్వే అభిషిక్తుడు
  alternative: యాహ్వే అభిషేకించినవాడు; మెస్సీయ
  rationale: సౌలు దేవునిచేత రాజుగా నియమించబడిన స్థితిని నిలుపుతూ, తక్షణ సందర్భం కోరని తరువాతి క్రీస్తుసంబంధ ప్రత్యేకార్థాన్ని రుద్దదు.
- issue: בְנֵי מָוֶת అనే హీబ్రూ నుడికారం
  choice: మరణపాత్రులు
  alternative: మరణపు కుమారులు; మీరు చావుకు అర్హులు
  rationale: నుడికారంలోని మరణశిక్షకు పాత్రత అనే తీవ్రతను నిలుపుతుంది. అక్షరరూపాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా ఉంచకుండా పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కథన-సంభాషణ శైలి. ఏకవచన సంబోధన ‘నీవు’ అబ్నేరును ఉద్దేశిస్తుంది; ‘మీరు’ అతనితో పాటు కాపలా బాధ్యత కలిగిన సమూహాన్ని సూచించే హీబ్రూ బహువచనాన్ని కాపాడుతుంది. చివరి హీబ్రూ ప్రశ్న రెండు వస్తువులను కలిపి అడిగినా, తెలుగులో సంఖ్యా అసౌకర్యాన్ని నివారించి స్పష్టత కోసం రెండు సమాంతర ప్రశ్నలుగా ఇచ్చాం.
