id: 1SA.23.1
reference: 1 Samuel 23:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּגִּ֥דוּ לְ/דָוִ֖ד לֵ/אמֹ֑ר הִנֵּ֤ה פְלִשְׁתִּים֙ נִלְחָמִ֣ים בִּ/קְעִילָ֔ה וְ/הֵ֖מָּה שֹׁסִ֥ים אֶת הַ/גֳּרָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
translation:
  language: te
  text: 'అప్పుడు వారు దావీదుకు ఇలా తెలియజేశారు: “ఇదిగో, ఫిలిష్తీయులు కెయీలాపై యుద్ధం చేస్తున్నారు[a]; వారు కళ్లాలను దోచుకుంటున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కెయీలాలో యుద్ధం చేస్తున్నారు,” లేక “కెయీలా దగ్గర యుద్ధం చేస్తున్నారు.” హెబ్రీ ఉపసర్గ అక్షరార్థంగా “లో/వద్ద” అని అర్థమివ్వగలదు; అయితే ఈ సైనిక సందర్భంలో ఫిలిష్తీయులు పట్టణంపై దాడి చేస్తున్నారని భావించడం సాధ్యం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: అప్పుడు దావీదుకు ఇలా తెలియజేశారు
  rationale: నגד హిఫిల్ రూపం సమాచారాన్ని తెలియజేయడాన్ని సూచిస్తుంది; వావ్-క్రమబద్ధతను ‘అప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది. హెబ్రీలోని బహువచన కర్త అనిర్దిష్టంగా ఉన్నందున తెలుగు కర్మణి ప్రయోగం సహజంగా ఉంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష ఉల్లేఖనాన్ని పరిచయం చేసే హెబ్రీ ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఇలా’ అని వ్యక్తం చేశాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: అత్యవసర వార్తపై దృష్టి నిలిపే సూచనార్థక అవ్యయానికి ‘ఇదిగో’ సహజమైన, గౌరవప్రదమైన సమానం.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ప్రజానామం.
- source_word: נִלְחָמִים בִּקְעִילָה
  choice: కెయీలాపై యుద్ధం చేస్తున్నారు
  rationale: నִלְחָמִים సైనిక పోరాటాన్ని సూచిస్తుంది. ב అక్షరార్థంగా ‘లో/వద్ద’ అయినా, సందర్భంలో పట్టణంపై దాడి జరుగుతోందనే భావం బలంగా ఉంది; అసలు స్థానార్థక సాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: וְהֵמָּה שֹׁסִים
  choice: వారు ... దోచుకుంటున్నారు
  rationale: స్వతంత్ర సర్వనామంలోని కర్త స్పష్టతను ‘వారు’ నిలుపుతుంది; שֹׁסִים యుద్ధకాల దోపిడిని సూచిస్తుంది.
- source_word: אֶת הַגֳּרָנוֹת
  choice: కళ్లాలను
  rationale: గోరెన్ ధాన్యాన్ని నూర్చి వేరుచేసే స్థలాన్ని సూచిస్తుంది. ‘కళ్లాలు’ తెలుగు వ్యవసాయ సందర్భంలో సహజమైన పదం; ధాన్యరాశులు అనే ఊహాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. స్థలనామాన్ని ‘కెయీలా’గా, వ్యవసాయ పదాన్ని ‘కళ్లాలు’గా వాడాం. ప్రధాన పాఠ్యంలో సందర్భానుకూల అర్థాన్ని ఇచ్చి, హెబ్రీ ఉపసర్గలోని నిజమైన స్థానార్థక సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
