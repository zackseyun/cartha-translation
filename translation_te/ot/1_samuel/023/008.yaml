  text: So Saul summoned all the people to war[a], to go down to Keilah, to besiege David and his men.
translation:
  language: te
  text: అప్పుడు సౌలు యుద్ధం కోసం ప్రజలందరినీ సమీకరించాడు[a]. దావీదును, అతని మనుషులను ముట్టడించడానికి కెయీలాకు దిగివెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యుద్ధం కోసం ప్రజలందరికీ పిలుపునిచ్చాడు.’ హీబ్రూ క్రియకు ‘వినిపించేలా చేశాడు’ అనే అర్థం కూడా ఉండవచ్చు; ఈ సందర్భంలో అది సైనిక చర్య కోసం ప్రజలను పిలిపించి కూడగట్టడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: సమీకరించాడు
  rationale: హిఫిల్ రూపానికి అక్షరార్థంగా ‘వినిపించాడు’ అనే భావం ఉన్నా, ఈ సైనిక సందర్భంలో ప్రజలను యుద్ధానికి పిలిపించి కూడగట్టడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సమీకరించాడు’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరినీ
  rationale: హీబ్రూ అక్షరార్థం ‘ప్రజలందరినీ.’ సందర్భంలో యుద్ధానికి సమీకరించబడినవారు ఉద్దేశించబడినా, మూలంలో ‘సైన్యం’ లేదా ‘సైనికులు’ అని లేదు కాబట్టి విస్తృత పదాన్నే నిలిపాం.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం కోసం
  rationale: ఇది సమీకరణ ఉద్దేశాన్ని సూచిస్తుంది. ‘యుద్ధం కోసం’ ఆధునిక తెలుగులో సహజంగా ఉండి, సైనిక చర్య అనే విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: לָרֶדֶת
  choice: దిగివెళ్లాడు
  rationale: ירד సాధారణంగా ‘దిగివెళ్లు’ అని అర్థం. కథనంలోని గమనాన్ని సహజ తెలుగులో వ్యక్తం చేయడానికి ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: קְעִילָה
  choice: కెయీలా
  rationale: హీబ్రూ స్థలనామ ధ్వనికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: לָצוּר
  choice: ముట్టడించడానికి
  rationale: ఈ సందర్భంలో צור దావీదు మరియు అతని మనుషులు ఉన్న ప్రదేశాన్ని చుట్టుముట్టి నిర్బంధించే సైనిక చర్యను సూచిస్తుంది; ‘ముట్టడించు’ దానికి సరైన తెలుగు పదం.
- source_word: אֶל דָּוִד וְאֶל אֲנָשָׁיו
  choice: దావీదును, అతని మనుషులను
  rationale: אֶל లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో ‘ముట్టడించు’ అనే క్రియతో ద్వితీయా విభక్తి సహజం. ‘మనుషులు’ అనే పదం మూలంలోని సాధారణ పదాన్ని కాపాడుతుంది; ‘సైనికులు’ అని ప్రత్యేకీకరించదు.
