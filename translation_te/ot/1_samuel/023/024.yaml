base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/024.yaml
  text: They arose and went to Ziph ahead of Saul[a]. Now David and his men were in the wilderness of Maon, in the Arabah[b], to the south of the Jeshimon.
translation:
  language: te
  text: వారు లేచి సౌలు కంటే ముందుగా జీఫుకు వెళ్లారు. దావీదు మరియు అతని మనుషులు మావోను అరణ్యంలో, అరాబాలో[a], యెషీమోనుకు దక్షిణంగా[b] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అరాబా” అనే పదాన్ని “మైదాన ప్రాంతం” అని కూడా అనువదించవచ్చు; ఇక్కడ అది ఒక భౌగోళిక ప్రాంతం పేరుగా వాడబడినట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “యెషీమోనుకు కుడివైపున.” ప్రాచీన దిక్సూచనలో తూర్పువైపు ముఖం పెట్టినప్పుడు కుడివైపు దక్షిణాన్ని సూచిస్తుంది. “యెషీమోను” అనే పేరును “బంజరు ప్రదేశం” లేదా “ఎడారి” అని కూడా అర్థం చేసుకోవచ్చు; ఇక్కడ అది స్థలపేరుగా వాడబడినట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֛וּמוּ
  choice: వారు లేచి
  rationale: קום క్రియ యొక్క వరుస కథన రూపాన్ని నేరుగా నిలుపుతూ, తదుపరి చర్యకు సిద్ధమై కదలడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיֵּלְכ֥וּ זִ֖יפָה
  choice: జీఫుకు వెళ్లారు
  rationale: స్థలనామానికి జతైన దిశాసూచక ה ను తెలుగులో సహజంగా “-కు” ద్వారా వ్యక్తం చేసింది.
- source_word: לִפְנֵ֣י שָׁא֑וּל
  choice: సౌలు కంటే ముందుగా
  rationale: ఇక్కడ לִפְנֵי స్థలకాల పరంగా సౌలుకు ముందే లేదా అతనికంటే ముందుగా వెళ్లడాన్ని సూచిస్తుంది; ఈ అస్పష్టతను అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: בְּמִדְבַּ֤ר מָעוֹן֙
  choice: మావోను అరణ్యంలో
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారి కాకుండా జనావాసం తక్కువైన అరణ్య లేదా నిర్జన ప్రాంతాన్ని సూచించగలదు; “అరణ్యం” సాధారణ తెలుగు బైబిలు భౌగోళిక వాడుకకు సరిపోతుంది.
- source_word: בָּעֲרָבָ֔ה
  choice: అరాబాలో
  rationale: నిర్దిష్ట ఉపపదంతో వచ్చిన భౌగోళిక పదాన్ని ప్రాంతనామంగా లిప్యంతరీకరించింది; “మైదాన ప్రాంతం” అనే సాధారణ నామ అర్థాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: אֶ֖ל יְמִ֥ין הַיְשִׁימֽוֹן
  choice: యెషీమోనుకు దక్షిణంగా
  rationale: יָמִין అక్షరార్థంగా “కుడివైపు” అయినా, తూర్పుముఖ దిక్సూచనలో అది దక్షిణాన్ని సూచిస్తుంది. స్పష్టమైన భౌగోళిక అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: הַיְשִׁימֽוֹן
  choice: యెషీమోను
  rationale: ఈ సందర్భంలో ఇది స్థలపేరుగా పనిచేసే అవకాశం ఎక్కువ. “బంజరు ప్రదేశం/ఎడారి” అనే పదార్థాన్ని పాదటిప్పణిలో భద్రపరిచింది.
