- from: కాబట్టి ఇప్పుడు రాజా, దిగిరావాలనే మీ మనసులోని కోరికంతటిని బట్టి తప్పకుండా దిగిరండి.[a] అతణ్ణి రాజు చేతికి అప్పగించడం మా బాధ్యత.
  to: ఇప్పుడు రాజా, మీ మనసులోని సమస్త కోరిక ప్రకారం దిగిరావడానికి దిగిరండి.[a] అతణ్ణి రాజు చేతికి అప్పగించడం మా వంతు.
  rationale: The revision removes an unwarranted inferential nuance, preserves the Hebrew ordering more closely, and retains the emphatic repeated verb through “దిగిరావడానికి దిగిరండి.” The footnote remains correctly anchored to that repeated construction.
