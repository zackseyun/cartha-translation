    reason: lexical_alternative
  revision_rationale: The revision removes an unwarranted inferential nuance, preserves the Hebrew ordering more closely, and retains the emphatic repeated verb through “దిగిరావడానికి దిగిరండి.” The footnote remains correctly anchored to that repeated construction.
