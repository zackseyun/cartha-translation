  yaml_path: translation/ot/1_samuel/023/020.yaml
  text: Now then[a], O king, come down according to all the desire of your soul to come down[b], and it is for us to hand him over into the king’s hand.
translation:
  language: te
  text: ఇప్పుడు రాజా, మీ మనసులోని సమస్త కోరిక ప్రకారం దిగిరావడానికి దిగిరండి.[a] అతణ్ణి రాజు చేతికి అప్పగించడం మా వంతు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘దిగిరావడం’ అనే క్రియ అనంతక్రియతో ఆజ్ఞారూపం కలిపి చెప్పబడింది—అక్షరార్థంగా, ‘దిగిరావడానికి, దిగిరండి.’ ఈ పునరుక్తి విజ్ఞప్తిని బలంగా ఉద్ఘాటిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: తక్షణ విజ్ఞప్తికి మారుతున్న సంధాన, సంభాషణ సూచక భావాలను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְכָל אַוַּת נַפְשְׁךָ
  choice: దిగిరావాలనే మీ మనసులోని కోరికంతటిని బట్టి
  rationale: נפשׁ అనే అంతరంగ వ్యక్తిని సూచించే రూపకాన్ని ‘మనసు’తో సహజంగా నిలుపుతూ, לְכָל యొక్క సంపూర్ణ అనుగుణత భావాన్ని ‘కోరికంతటిని బట్టి’ తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజా
  rationale: నిర్దిష్ట ప్రత్యయంతో ఉన్న నామవాచకం ఇక్కడ ప్రత్యక్ష సంబోధనగా పనిచేస్తుంది; తెలుగు సంబోధన రూపం సహజమైనది.
- source_word: לָרֶדֶת רֵד
  choice: తప్పకుండా దిగిరండి
  rationale: అనంతక్రియతో కూడిన ఆజ్ఞారూప పునరుక్తి ఇచ్చే ఉద్ఘాటనను, అసహజమైన పదపునరావృతం లేకుండా ‘తప్పకుండా’తో వ్యక్తం చేస్తుంది.
- source_word: וְלָנוּ
  choice: మా బాధ్యత
  rationale: ఆ పని తమ వంతు లేదా తమపై ఉన్న బాధ్యత అనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַסְגִּירוֹ
  choice: అతణ్ణి ... అప్పగించడం
  rationale: హిఫీల్ రూపం ఒకరిని మరొకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది; ‘అప్పగించడం’ సందర్భానికి సరిపోయే సాధారణ తెలుగు.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: రాజు చేతికి
  rationale: ఒకరి అధికారంలోకి ఇవ్వడం అనే హీబ్రూ రూపకాన్ని తెలుగులోనూ సహజంగా నిలుపుతుంది.
