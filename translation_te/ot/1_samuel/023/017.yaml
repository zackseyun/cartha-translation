reference: 1 Samuel 23:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו אַל תִּירָ֗א כִּ֠י לֹ֤א תִֽמְצָאֲ/ךָ֙ יַ֚ד שָׁא֣וּל אָבִ֔/י וְ/אַתָּה֙ תִּמְלֹ֣ךְ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֖י אֶֽהְיֶה לְּ/ךָ֣ לְ/מִשְׁנֶ֑ה וְ/גַם שָׁא֥וּל אָבִ֖/י יֹדֵ֥עַ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
translation:
  language: te
  text: అతడు అతనితో[a], “భయపడకు. నా తండ్రి సౌలు చేయి నిన్ను చేరదు. నీవు ఇశ్రాయేలుపై రాజ్యమేలుతావు, నేను నీ తర్వాత రెండవ స్థానంలో ఉంటాను[b]. నా తండ్రి సౌలుకు కూడా ఇది తెలుసు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతడు’ అంటే యోనాతాను; ‘అతనితో’ అంటే దావీదుతో.
    reason: referent_clarification
  - marker: b
    text: లేదా, “నేను నీకు రెండవవాడిగా ఉంటాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: భయపడకు
  rationale: నిషేధార్థక ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי
  choice: నా తండ్రి సౌలు చెయ్యి నిన్ను పట్టుకోదు
  rationale: ‘చెయ్యి’ అనే హెబ్రీయ చిత్రాన్ని నిలుపుతూ, מצא యొక్క సందర్భార్థమైన అందుకోవడం లేదా పట్టుకోవడాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘అధికారం’ అని పూర్తిగా వివరణాత్మకంగా మార్చదు.
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: నీవు ఇశ్రాయేలును పరిపాలిస్తావు
  rationale: מלך క్రియలోని రాజుగా పాలించే భావాన్ని తెలుగులో సహజమైన క్రియారూపంతో వ్యక్తపరుస్తుంది.
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  choice: నేను నీకు రెండవవాడిగా ఉంటాను
  rationale: מִשְׁנֶה సూచించే రెండవ స్థానం లేదా అధీన హోదాను కాపాడుతుంది; ఆధునిక అధికారిక బిరుదును అనవసరంగా చేర్చదు.
- source_word: וְגַם שָׁאוּל אָבִי יֹדֵעַ כֵּן
  choice: ఇది నా తండ్రి సౌలుకు కూడా తెలుసు
  rationale: כֵּן ముందున్న ప్రకటనల సత్యాన్ని తిరిగి సూచిస్తుంది; తెలుగు పదక్రమంలో సహజంగా ఉంటుంది.
theological_decisions:
- issue: దావీదు రాజ్యపాలన గురించి యోనాతాను చెప్పిన మాటకు ఇవ్వాల్సిన ధార్మిక స్పష్టత
  choice: దావీదు పాలిస్తాడనీ, యోనాతాను అతనికి రెండవవాడిగా ఉంటాడనీ నేరుగా చెప్పడం
  alternative: దీనిని దేవుని నియామకాన్ని ప్రకటించే స్పష్టమైన ప్రవచనంగా విస్తరించడం
  rationale: ఈ వాక్యంలో యెహోవా పేరు లేదా దైవ నియామకానికి ప్రత్యక్ష ప్రస్తావన లేదు. అందువల్ల రాజకీయమైన, దైవ నిర్వహణకు అనుకూలమైన నిరీక్షణను ఉన్నట్లుగానే ఉంచి, అదనపు నిబంధనా లేదా మెస్సీయ సంబంధ భాషను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. హెబ్రీయ ‘చెయ్యి’ చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని పట్టుబలం అనే భావాన్ని క్రియ ద్వారా స్పష్టం చేసింది.
