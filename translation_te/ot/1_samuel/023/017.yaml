review_pass:
  verdict: revise
  source_fidelity: The draft conveys the verse’s overall sense, but ‘ఇశ్రాయేలును పరిపాలిస్తావు’ can denote governing without explicitly conveying the Hebrew verb מלך, ‘you will reign/be king.’ Also, ‘చెయ్యి నిన్ను పట్టుకోదు’ narrows the Hebrew image ‘the hand ... will not find/reach you’ toward capture. A more literal and equally natural wording can retain the image without deciding its precise implication.
  naturalness: The Telugu is generally clear and modern. ‘నా తండ్రి సౌలు చెయ్యి’ is understandable but benefits from ‘చేయి’ and a verb such as ‘చేరదు’ for a more idiomatic rendering of the Hebrew image. ‘నీకు రెండవవాడిగా’ is understandable; ‘నీ తర్వాత రెండవ స్థానంలో’ more clearly expresses subordinate rank relative to David.
  terminology: Use ‘ఇశ్రాయేలుపై రాజ్యమేలుతావు’ to represent kingship explicitly. The names యోనాతాను, దావీదు, and సౌలు are standard. No theological expansion is needed.
  issues:
  - severity: medium
    issue: ‘ఇశ్రాయేలును పరిపాలిస్తావు’ does not explicitly mark David’s kingship.
    rationale: תִּמְלֹךְ means ‘you will reign/be king.’ ‘రాజ్యమేలుతావు’ preserves this central political claim.
  - severity: low
    issue: ‘చెయ్యి నిన్ను పట్టుకోదు’ interprets the Hebrew ‘hand ... will not find you’ as capture.
    rationale: The Hebrew wording permits several implications—reach, seize, or overpower. ‘చేయి నిన్ను చేరదు’ preserves the concrete metonym and leaves the implication open.
  - severity: low
    issue: The wording for Jonathan’s rank can be made more relationally explicit.
    rationale: לְמִשְׁנֶה denotes second rank in relation to David. ‘నీ తర్వాత రెండవ స్థానంలో ఉంటాను’ clearly conveys this without adding an administrative title.
