  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב דָּוִ֤ד בַּ/מִּדְבָּר֙ בַּ/מְּצָד֔וֹת וַ/יֵּ֥שֶׁב בָּ/הָ֖ר בְּ/מִדְבַּר זִ֑יף וַ/יְבַקְשֵׁ֤/הוּ שָׁאוּל֙ כָּל הַ/יָּמִ֔ים וְ/לֹֽא נְתָנ֥/וֹ אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
translation:
  language: te
  text: దావీదు అరణ్యంలో ఉన్న దుర్గాల్లో ఉండేవాడు; జీఫు అరణ్యంలోని కొండప్రాంతంలోనూ ఉండేవాడు. సౌలు అతని కోసం నిరంతరం వెదికాడు; అయితే దేవుడు దావీదును సౌలు చేతికి అప్పగించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దేవుడు అతన్ని అతని చేతిలోకి ఇవ్వలేదు.”
    reason: హీబ్రూ మూలంలోని ‘చేతిలోకి ఇవ్వడం’ అనే నుడికారపు అక్షరరూపాన్ని చూపించడానికి.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసిస్తూ / ఉండేవాడు
  rationale: ישׁב ఇక్కడ కొంతకాలం ఒక ప్రాంతంలో ఉండడాన్ని సూచిస్తుంది. తెలుగు కథనంలో పునరుక్తి భారాన్ని తగ్గిస్తూ, కొనసాగుతున్న నివాస భావాన్ని ఈ రూపాలు సహజంగా తెలియజేస్తాయి.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారిని కాక, జనావాసం తక్కువైన సాగుచేయని ప్రాంతాన్ని సూచించగలదు; అందువల్ల ‘అరణ్యం’ సందర్భోచితం.
- source_word: בַּמְּצָדוֹת
  choice: దుర్గాల్లో
  rationale: מְצָדוֹת రక్షణకు అనువైన బలమైన స్థలాలను సూచిస్తుంది. ‘దుర్గాలు’ ఆశ్రయం మాత్రమే కాక రక్షణాత్మక భావాన్నీ నిలుపుతుంది.
- source_word: בָּהָר
  choice: కొండప్రాంతంలో
  rationale: הַר ఇక్కడ ఒకే కొండశిఖరంకన్నా జీఫు ప్రాంతంలోని ఎత్తైన భూభాగాన్ని సూచించే అవకాశం ఉంది; ‘కొండప్రాంతం’ సహజమైన భౌగోళిక అనువాదం.
- source_word: בְּמִדְבַּר זִיף
  choice: జీఫు అరణ్యపు
  rationale: ఈ నిర్మాణం జీఫుతో అనుబంధమైన నిర్దిష్ట అరణ్యప్రాంతాన్ని గుర్తిస్తుంది.
- source_word: וַיְבַקְשֵׁהוּ
  choice: అతని కోసం వెదికాడు
  rationale: בקשׁ ఇక్కడ సౌలు దావీదును పట్టుకోవడానికి వెదకడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ ప్రయోగం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כָּל הַיָּמִים
  choice: నిరంతరం
  rationale: అక్షరార్థంగా ‘అన్ని రోజులూ’; సందర్భంలో సాగుతున్న, పదేపదే జరిగిన అన్వేషణ భావాన్ని ‘నిరంతరం’ సంక్షిప్తంగా అందిస్తుంది.
- source_word: וְלֹא נְתָנוֹ
  choice: అప్పగించలేదు
  rationale: נתן + ‘చేతిలోకి’ అనే హీబ్రూ నుడికారం ఒకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. తెలుగులో ‘అప్పగించలేదు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ אֱלֹהִים ఏకవచన భావంతో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది.
- source_word: בְּיָדוֹ
  choice: సౌలు చేతికి
  rationale: అక్షరార్థంగా ‘అతని చేతిలోకి’. తెలుగు నుడికారంలో ‘చేతికి అప్పగించు’ సహజం; సర్వనామ సూచనను స్పష్టంచేయడానికి ‘సౌలు’ అని పేర్కొనబడింది.
theological_decisions:
- issue: కథనంలో దేవుని పరిరక్షణాత్మక కార్యానికి నేర ఆపాదన
  choice: దేవుడు దావీదును సౌలు చేతికి అప్పగించలేదు
  alternative: దేవుడు అతన్ని అతని చేతిలోకి ఇవ్వలేదు
  rationale: మూలపాఠం దావీదు తప్పించుకోవడాన్ని నేరుగా దేవుని కార్యానికి ఆపాదిస్తుంది. అనువాదం ఆ వాదనను విస్తరించకుండా నిలుపుతూ, హీబ్రూ నుడికారాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథనశైలి, అయితే ‘దుర్గాలు’, ‘అరణ్యం’ వంటి గౌరవప్రదమైన బైబిలు భౌగోళిక పదజాలం నిలుపబడింది. ప్రధాన పాఠ్యంలో అస్పష్ట సర్వనామాలను పేర్లతో స్పష్టంచేసి, మూలంలోని అక్షర నుడికారాన్ని పాదసూచికలో ఇచ్చాం.
