  yaml_path: translation/ot/1_samuel/023/022.yaml
  text: Please go and make further preparations[a], and know and see his place where his foot is, who has seen him there; for I am told[c][b], ‘He is very cunning.’
translation:
  language: te
  text: “దయచేసి వెళ్లి, ఇంకా సిద్ధపడండి. అతని స్థలం—అతడు ఎక్కడ అడుగుపెడతాడో[a]—తెలుసుకొని పరిశీలించండి; అక్కడ అతన్ని ఎవరు చూశారో కూడా తెలుసుకోండి. ఎందుకంటే, ‘అతడు ఎంతో కపటబుద్ధితో వ్యవహరిస్తాడు’[c] అని నాకు చెప్పబడింది[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా, “అతని పాదం ఎక్కడ ఉంటుందో.” ఇది అతడు ఎక్కడ ఉన్నాడో లేదా ఎక్కడెక్కడ సంచరిస్తున్నాడో సూచించే ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎందుకంటే, అతడు నాకు చెప్పాడు.” హీబ్రూ క్రియ ఏకవచనంలో ఉన్నప్పటికీ, “చెప్పిన” కర్త ఎవరో స్పష్టంగా పేర్కొనబడలేదు.
    reason: alternative_reading
  - marker: c
    text: హీబ్రూలో ఒకే మూలానికి చెందిన పదాలను జతచేసి, అక్షరార్థంగా “కపటంగా కపటం చేస్తాడు” అన్నట్లుగా బలమైన ఉద్ఘాటన ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכִינוּ עוֹד
  choice: ఇంకా సిద్ధపడండి
  rationale: హిఫీల్ రూపంలోని הכין ఇక్కడ ‘సిద్ధం చేయడం/సిద్ధపడడం’ అనే భావాన్ని ఇస్తుంది; עוֹד మరింతగా లేదా ఇంకా కొనసాగించి చేయాలనే భావాన్ని జోడిస్తుంది.
- source_word: וּדְעוּ וּרְאוּ
  choice: తెలుసుకొని పరిశీలించండి
  rationale: రెండు ఆజ్ఞారూపాల సమిష్టి బలాన్ని నిలుపుతూ, జాగ్రత్తగా సమాచారాన్ని సేకరించి ప్రత్యక్షంగా నిర్ధారించాలనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְקוֹמוֹ אֲשֶׁר תִּהְיֶה רַגְלוֹ
  choice: అతని స్థలం—అతడు ఎక్కడ అడుగుపెడతాడో
  rationale: מְקוֹמוֹ లోని ‘అతని’ అనే ప్రత్యయార్థాన్ని నిలిపి, ‘అతని పాదం ఎక్కడ ఉంటుందో’ అనే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యేలా ‘ఎక్కడ అడుగుపెడతాడో’ అని అందించింది.
- source_word: מִי רָאָהוּ שָׁם
  choice: అక్కడ అతన్ని ఎవరు చూశారో
  rationale: సాక్షిగా చూసిన వ్యక్తి లేదా సమాచారదాత ఎవరో గుర్తించాలనే వాక్యార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: כִּי אָמַר אֵלַי
  choice: ఎందుకంటే … అని అతడు నాకు చెప్పాడు
  rationale: హీబ్రూలో క్రియ మూడవ పురుష ఏకవచనంలో ఉంది; కర్త స్పష్టంగా పేర్కొనబడలేదు. ప్రధాన పాఠంలో వ్యాకరణ రూపాన్ని నిలిపి, అస్పష్టతను పాదటిప్పణిలో తెలిపింది.
- source_word: עָרוֹם יַעְרִם הוּא
  choice: అతడు ఎంతో కపటబుద్ధితో వ్యవహరిస్తాడు
  rationale: విశేషణం మరియు అదే మూలానికి చెందిన క్రియ కలసి ఇచ్చే తీవ్రతను ‘ఎంతో’ ద్వారా వ్యక్తం చేసింది. సౌలు దృష్టిలోని ప్రతికూల అంచనాకు ‘కపటబుద్ధి’ సరిపోతుంది.
