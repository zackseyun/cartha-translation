reference: 1 Samuel 23:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: When Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
translation:
  language: te
  text: అహీమెలెకు కుమారుడైన అబ్యాతారు కెయీలాలో ఉన్న దావీదు దగ్గరికి పారిపోయి వచ్చినప్పుడు, అతడు ఏఫోదును చేతిలో పట్టుకొని దిగివచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, హెబ్రీ పదక్రమానికి మరింత దగ్గరగా: “ఏఫోదు అతని చేతిలో దిగివచ్చింది.” హెబ్రీలో ‘దిగివచ్చింది’ అనే క్రియకు ‘ఏఫోదు’ వ్యాకరణపరంగా కర్తగా చదవబడవచ్చు; సందర్భానుసారంగా అబ్యాతారే ఏఫోదును తీసుకొని దిగివచ్చాడని కూడా అర్థం చేసుకోవచ్చు.'
    reason: హెబ్రీ వాక్యనిర్మాణంలో ఉన్న కర్తసంబంధ అస్పష్టతను, ప్రధాన పాఠంలోని సందర్భానుగుణ పఠనాన్ని మార్చకుండా తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַיְהִי בִּבְרֹחַ
  choice: పారిపోయి వచ్చినప్పుడు
  rationale: ב + క్రియానామ రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది. וַיְהִי కథనాన్ని కొనసాగించే నిర్మాణం; తెలుగులో అదనంగా ‘ఇప్పుడు’ చేర్చకుండా సహజమైన ఉపవాక్యంతో దాని ప్రవాహాన్ని వ్యక్తం చేశాం.
- source_word: אֶבְיָתָר בֶּן אֲחִימֶלֶךְ
  choice: అహీమెలెకు కుమారుడైన అబ్యాతారు
  rationale: వ్యక్తి పేర్లను ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, తండ్రి-కొడుకు సంబంధాన్ని యథాతథంగా ఉంచాం.
- source_word: אֶל דָּוִד קְעִילָה
  choice: దావీదు దగ్గరికి కెయీలా
  rationale: אֶל దావీదువైపు గమనాన్ని సూచిస్తుంది. కְעִילָה దావీదు ఉన్న ప్రదేశంగా అర్థమయ్యేలా తెలుగు పదక్రమాన్ని ఉంచాం; అయితే హెబ్రీ పదక్రమంలోని నిజమైన అస్పష్టతను పాదసూచికలో తెలిపాం.
- source_word: אֵפוֹד
  choice: ఏఫోదు
  rationale: ఇది ప్రత్యేకమైన యాజక సంబంధ పవిత్ర వస్తువు. దాని స్వరూపాన్ని ఈ వచనం చెప్పినదానికంటే సంకుచితం చేయకుండా లిప్యంతరీకరణను నిలిపాం.
- source_word: יָרַד
  choice: దిగివచ్చాడు
  rationale: ירד యొక్క ప్రాథమిక దిశార్థమైన ‘దిగుట’ను నిలిపి, దావీదు ఉన్న చోటుకు వచ్చిన భావాన్ని సహజ తెలుగులో వ్యక్తం చేశాం.
- source_word: בְּיָדוֹ
  choice: తన చేతిలో ... తో
  rationale: ‘అతని చేతిలో’ అనే స్పష్టమైన దృశ్యరూపాన్ని కాపాడుతూ, ఏఫోదును వెంట తెచ్చాడనే భావం తెలుగులో సహజంగా వినిపించేలా నిర్మించాం.
theological_decisions:
- issue: ఈ సందర్భంలో אֵפוֹד స్వరూపం
  choice: ‘ఏఫోదు’ అనే లిప్యంతరీకృత పదాన్నే ఉంచడం
  alternative: ‘యాజక వస్త్రం’ లేదా ‘పవిత్ర అంగీ’ అని వివరించడం
  rationale: సందర్భంలో దీనికి యాజక, దైవవిచారణ సంబంధ ప్రాముఖ్యత ఉన్నా, ఈ వచనం దాని నిర్దిష్ట రూపాన్ని నిర్వచించదు. కాబట్టి మూలంలోని విస్తృతతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వ్యక్తి, స్థల పేర్లు తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. మూలంలో లేని ప్రత్యేక కాలసూచక ‘ఇప్పుడు’ చేర్చలేదు.
