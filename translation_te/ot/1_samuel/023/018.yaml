base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
translation:
  language: te
  text: వారిద్దరూ యాహ్వే సన్నిధిలో నిబంధన చేసుకున్నారు[a]. దావీదు ఆ అరణ్యప్రాంతంలో[b] ఉండిపోయాడు; యోనాతాను తన ఇంటికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నిబంధనను కోశారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “హోరెషులో.” ఇక్కడి హీబ్రూ పదాన్ని స్థలనామంగానైనా, “అరణ్యప్రాంతం” అనే సాధారణ నామంగానైనా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ ... בְּרִית
  choice: నిబంధన చేసుకున్నారు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘నిబంధనను కోశారు’ అని ఉన్నా, నిబంధన స్థాపించడాన్ని ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ‘నిబంధన చేసుకున్నారు’ అని వ్యక్తపరుస్తుంది. అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: שְׁנֵיהֶם
  choice: వారిద్దరూ
  rationale: దావీదు, యోనాతాను ఇద్దరూ కలిసి చేసిన కార్యమని హీబ్రూలోని ద్వివచన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ‘యెహోవా ఎదుట’ అనే మూలభావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది; దేవుని ప్రత్యక్ష సాక్ష్య సమక్షంలో నిబంధన చేసిన గంభీరతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: וַיֵּשֶׁב
  choice: ఉండిపోయాడు
  rationale: ఈ సందర్భంలో క్రియకు అక్షరార్థమైన ‘కూర్చున్నాడు’ కంటే ఒక చోటే కొనసాగి ఉండడం అనే భావం ఉంది; ‘ఉండిపోయాడు’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: בַּחֹרְשָׁה
  choice: ఆ అరణ్యప్రాంతంలో
  rationale: חֹרֶשׁ అడవితో లేదా పొదలతో నిండిన ప్రాంతాన్ని సూచించగలదు. అయితే దీనిని ‘హోరెషులో’ అనే స్థలనామంగా కూడా అర్థం చేసుకోవచ్చు; ఆ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- source_word: הָלַךְ לְבֵיתוֹ
  choice: తన ఇంటికి వెళ్లాడు
  rationale: హీబ్రూ నిర్మాణాన్ని దగ్గరగా అనుసరిస్తూనే, యోనాతాను తన స్వగృహానికి వెళ్లాడని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం దేవుని ప్రత్యేక నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని సాధారణ బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని వాడాం.
- issue: నిబంధనకు దేవుడు సాక్షిగా ఉన్న భావం
  choice: యెహోవా సన్నిధిలో
  alternative: యెహోవా ఎదుట
  rationale: לִפְנֵי అనే పదబంధంలోని ‘ఎదుట/సమక్షంలో’ అనే భావాన్ని నిలుపుతూ, ప్రత్యేకమైన అదనపు ఆచార లేదా సిద్ధాంత భావాన్ని చేర్చకుండా నిబంధన యొక్క గంభీరతను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘నిబంధన’ అనే పదం బంధంలోని గంభీరతను నిలుపుతుంది. మూలపాఠంలోని ‘అరణ్యప్రాంతం/హోరెషు’ సందిగ్ధతను ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా సంరక్షించాం; ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠంలో ఉంది.
