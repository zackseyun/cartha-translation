  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీలో నిర్దిష్టంగా చెప్పని సమాచారదాతల గుర్తింపును నిర్దిష్టం చేయలేదు; స్థలవివరణలోని రాతి ఆకృతి సంబంధమైన అర్థవిస్తృతిని పాదసూచికలో నిలిపాం.
