source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ שָׁא֣וּל וַ/אֲנָשָׁי/ו֮ לְ/בַקֵּשׁ֒ וַ/יַּגִּ֣דוּ לְ/דָוִ֔ד וַ/יֵּ֣רֶד הַ/סֶּ֔לַע וַ/יֵּ֖שֶׁב בְּ/מִדְבַּ֣ר מָע֑וֹן וַ/יִּשְׁמַ֣ע שָׁא֔וּל וַ/יִּרְדֹּ֥ף אַחֲרֵֽי דָוִ֖ד מִדְבַּ֥ר מָעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
translation:
  language: te
  text: అప్పుడు సౌలు, అతని మనుషులు దావీదును వెదకడానికి వెళ్లారు. ఈ విషయం దావీదుకు తెలియజేశారు. అప్పుడు అతడు రాతిబండకు[a] దిగిపోయి మాయోను అరణ్యంలో ఉండిపోయాడు. సౌలు విని, మాయోను అరణ్యంలో దావీదును వెంబడించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాతికొండ,’ ‘కొండచరియ.’ హెబ్రీ పదం గుర్తించదగిన రాతి దుర్గాన్ని లేదా రాతి ఆకృతిని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַקֵּשׁ
  choice: దావీదును వెదకడానికి
  rationale: ఈ క్రియారూపం వెళ్లడంలోని ఉద్దేశాన్ని తెలియజేస్తుంది. హెబ్రీలో కర్మ ప్రత్యక్షంగా లేకపోయినా సందర్భం దావీదునే సూచిస్తున్నందున, సహజమైన తెలుగుకోసం అతని పేరు చేర్చబడింది.
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: ఈ సంగతి దావీదుకు తెలియజేశారు
  rationale: హెబ్రీలో కర్త నిర్దిష్టంగా చెప్పని బహువచన క్రియ ఉంది. తెలుగు వాక్యంలోనూ కర్తను నిర్దిష్టం చేయకుండా ఉంచి, సందర్భంలో తెలిసే సమాచారాన్ని ‘ఈ సంగతి’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: וַיֵּרֶד
  choice: దిగివెళ్లి
  rationale: క్రియలోని కిందికి కదలిక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַסֶּלַע
  choice: రాతిబండ
  rationale: ఈ పదం రాయి, పెద్ద రాతిబండ, రాతికొండ లేదా కొండచరియను సూచించగలదు. ప్రధాన పాఠంలో మూల రూపకాన్ని నేరుగా నిలిపే ‘రాతిబండ’ను ఎంచుకుని, ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో ఇచ్చాం.
- source_word: וַיֵּשֶׁב
  choice: ఉండిపోయాడు
  rationale: ఈ కథన సందర్భంలో కొంతకాలం ఒక చోట ఉండడం లేదా నిలిచి ఉండడం అనే భావం ఉంది. ‘ఉండిపోయాడు’ తాత్కాలిక నివాస భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּמִדְבַּר מָעוֹן / מִדְבַּר מָעוֹן
  choice: మాయోను అరణ్యంలో
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారినే కాక జనావాసం తక్కువైన అరణ్య ప్రాంతాన్ని సూచించగలదు. ‘అరణ్యం’ తెలుగు బైబిలు కథనానికి సహజంగా, విస్తృత అర్థాన్ని నిలుపుతూ ఉంది; మాయోను స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: వెంబడించాడు
  rationale: ఈ హెబ్రీ ప్రయోగం ఒకరి వెంట తరుముతూ వెళ్లడాన్ని సూచిస్తుంది. ‘వెంబడించాడు’ సంక్షిప్తంగా, సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו
  choice: కాబట్టి సౌలు, అతని మనుషులు ... వెళ్లారు
  rationale: వావ్-క్రమరూపం ముందరి సందర్భానికి అనుసంధానంగా కథను ముందుకు నడిపిస్తుంది. ‘కాబట్టి’ ఆ సందర్భానుసార ఫలిత సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
