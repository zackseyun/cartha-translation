  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని భయపూరిత వాదనను సహజమైన తెలుగు ఉద్ధృత నిర్మాణంలో అందించబడింది. పాదసూచిక గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
