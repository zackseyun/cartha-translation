source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י דָוִד֙ אֵלָ֔י/ו הִנֵּ֨ה אֲנַ֥חְנוּ פֹ֛ה בִּֽ/יהוּדָ֖ה יְרֵאִ֑ים וְ/אַף֙ כִּֽי נֵלֵ֣ךְ קְעִלָ֔ה אֶל מַֽעַרְכ֖וֹת פְּלִשְׁתִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/003.yaml
  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
translation:
  language: te
  text: అయితే దావీదు మనుషులు దావీదుతో, “ఇదిగో, ఇక్కడ యూదాలో మనం భయపడుతున్నాం; మరి కెయీలాకు వెళ్లి ఫిలిష్తీయుల యుద్ధ పంక్తులను ఎదుర్కొంటే ఎంత ఎక్కువగా భయపడతామో?” అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫిలిష్తీయుల యుద్ధ పంక్తులను ఎదుర్కొనేందుకు కెయీలాకు వెళ్లడం సంగతి ఇక చెప్పనేల?” హీబ్రూ ప్రయోగం తక్కువ ప్రమాదస్థితి నుంచి ఎక్కువ ప్రమాదస్థితికి సాగే వాదనను వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అయితే ... అన్నారు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ముందటి ఆదేశానికి వారి భయపూరిత ప్రతిస్పందనలోని వ్యత్యాసాన్ని ఆధునిక తెలుగులో ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: אַנְשֵׁי דָוִד
  choice: దావీదు మనుషులు
  rationale: దావీదుకు చెందిన అనుచరుల సమూహాన్ని సూచించే నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతుంది.
- source_word: הִנֵּה
  choice: చూడు
  rationale: వారి వాదనను నొక్కిచెప్పే సూచనాత్మక బలాన్ని, ప్రాచీన శైలికి పోకుండా, ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים
  choice: ఇక్కడ యూదాలోనే మనం భయపడుతున్నాం
  rationale: ‘ఇక్కడ’ అనే స్థల సూచనతో పాటు అల్పస్థితి నుంచి అధికస్థితికి సాగే వాదనను స్పష్టం చేయడానికి ‘నే’ నొక్కును సహజంగా ఉపయోగిస్తుంది.
- source_word: וְאַף כִּי
  choice: ఇక ... వెళ్తే ఇంకెంతగా
  rationale: హీబ్రూ అల్పం నుంచి అధికానికి చేసే వాదనను తెలుగులో సహజమైన తులనాత్మక-ఉద్ధృత నిర్మాణంతో వ్యక్తం చేస్తుంది; భయపడటం రెండో భాగంలో భావపూర్వకంగా పునరుద్ధరించబడింది.
- source_word: נֵלֵךְ קְעִלָה
  choice: కెయీలాకు వెళ్తే
  rationale: స్థల నామంతో ఉన్న గమనార్థక క్రియను గమ్యస్థానాన్ని సూచించే సహజ తెలుగు దత్తివిభక్తితో అనువదిస్తుంది.
- source_word: אֶל מַעַרְכוֹת פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల యుద్ధపంక్తులకు ఎదురుగా
  rationale: מַעַרְכוֹת అనే పదంలోని సైనిక పంక్తులు లేదా యుద్ధవ్యవస్థ అనే నిర్దిష్ట భావాన్ని నిలుపుతూ, אֶל సందర్భంలో సూచితమైన ఎదుర్కొనడాన్ని స్పష్టం చేస్తుంది.
