- from: సౌలు తన ప్రాణం కోసం వెదకడానికి[a] బయలుదేరాడని దావీదు గ్రహించాడు. అప్పుడు దావీదు జీఫు అరణ్యంలో, హోరెషులో[b] ఉన్నాడు.
  to: సౌలు తనను చంపడానికి బయలుదేరాడని దావీదు తెలుసుకున్నాడు.[a] ఇదిలా ఉండగా, దావీదు జీఫు అరణ్యంలోని హోరెషులో[b] ఉన్నాడు.
  rationale: The revision resolves the misleading reflexive pronoun by making David the explicit object of Saul's lethal pursuit. Since a literal Telugu rendering of “seek his life” is liable to be misunderstood, the main text uses the idiom's contextual meaning and footnote a preserves the Hebrew wording. The location clause and lexical alternative for Horesh are retained, with a more natural circumstantial connective.
