  text: David saw that Saul had come out to seek his life[a], while David was in the wilderness of Ziph at Horesh.
translation:
  language: te
  text: సౌలు తనను చంపడానికి బయలుదేరాడని దావీదు తెలుసుకున్నాడు.[a] ఇదిలా ఉండగా, దావీదు జీఫు అరణ్యంలోని హోరెషులో[b] ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘తన ప్రాణం కోసం వెదకడానికి.’ హెబ్రీయ నుడికారంలో ఇది దావీదును చంపాలనే ఉద్దేశంతో అతనిని వెదకడాన్ని సూచిస్తుంది.
    reason: హెబ్రీయ నుడికారాన్ని మరియు దాని ప్రాణహాని భావాన్ని వివరిస్తుంది.
  - marker: b
    text: లేదా ‘అడవిలో’ లేక ‘చెట్లు దట్టంగా ఉన్న చోట.’ ఇక్కడ హెబ్రీయ పదాన్ని సాధారణ నామవాచకంగా అర్థం చేసుకోవచ్చు, కానీ బహుశా అది ‘హోరెషు’ అనే స్థలనామం.
    reason: חֹרְשָׁה అనే పదంలోని సాధారణ నామవాచక/స్థలనామ సందిగ్ధతను సంరక్షిస్తుంది.
lexical_decisions:
- source_word: וַיַּרְא
  choice: గ్రహించాడు
  rationale: ראה అనే క్రియకు ప్రాథమికంగా ‘చూశాడు’ అని అర్థమైనా, ఇక్కడ సౌలు చేసిన కార్యాన్ని దావీదు తెలుసుకున్నాడనే భావం ఉంది. ఆధునిక తెలుగులో ‘గ్రహించాడు’ ఈ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: దావీదు గ్రహించిన విషయాన్ని పరిచయం చేసే content clause‌ను తెలుగులో సహజంగా ‘అని’ సూచిస్తుంది.
- source_word: יָצָא
  choice: బయలుదేరాడని
  rationale: יצא అంటే ‘బయటికి వెళ్లడం/బయలుదేరడం.’ దావీదును వెదకడానికి సౌలు కార్యాచరణకు దిగినట్టు ‘బయలుదేరాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבַקֵּשׁ אֶת נַפְשׁוֹ
  choice: తన ప్రాణం కోసం వెదకడానికి
  rationale: హెబ్రీయ idiom‌ను సాధ్యమైనంతగా నిలుపుతూ, దావీదును చంపాలనే ఉద్దేశం ఉందని పాదటిప్పణిలో వివరిస్తుంది. ‘తన’ అనే సర్వనామం సందర్భంలో దావీదునే సూచిస్తుంది.
- source_word: בְּמִדְבַּר זִיף
  choice: జీఫు అరణ్యంలో
  rationale: מִדְבָּר అనేది ఎడారి మాత్రమే కాక జనావాసం తక్కువైన అరణ్య/బీడు ప్రాంతాన్నీ సూచించగలదు; ‘అరణ్యం’ ఈ కథన సందర్భానికి తగిన విస్తృత పదం.
- source_word: בַּחֹרְשָׁה
  choice: హోరెషులో
  rationale: חֹרְשָׁהను ‘అడవి ప్రాంతం’ అనే సాధారణ నామవాచకంగా అర్థం చేసుకోవచ్చు; అయితే ఈ సందర్భంలో అది స్థలనామంగా ఉండే అవకాశం ఎక్కువ. అందువల్ల ప్రధాన పాఠ్యంలో ‘హోరెషు’ అని లిప్యంతరీకరించబడింది.
- source_word: וְדָוִד
  choice: అప్పుడు దావీదు
  rationale: ఈ సంధి దావీదు ఉన్న ప్రదేశాన్ని తెలిపే నేపథ్య వాక్యాన్ని కలుపుతుంది. ‘అప్పుడు’ తెలుగులో కథన ప్రవాహాన్ని సహజంగా ఉంచుతుంది.
theological_decisions:
- issue: ‘తన ప్రాణం కోసం వెదకడం’ అనే హెబ్రీయ ప్రయోగంలోని ప్రాణహాని భావం
  choice: ప్రధాన పాఠ్యంలో మూలభాషా ప్రయోగాన్ని నిలిపి, ‘చంపడానికి వెదకడం’ అనే భావాన్ని పాదటిప్పణిలో వివరించడం
  alternative: ‘దావీదును చంపడానికి’ అని నేరుగా అనువదించడం
  rationale: సందర్భంలో హత్య ఉద్దేశం స్పష్టమైనప్పటికీ, మూలంలోని ‘ప్రాణం కోసం వెదకడం’ అనే ఉద్దేశపూర్వకమైన ప్రయోగాన్ని పూర్తిగా వ్యాఖ్యానాత్మకంగా మార్చకుండా దాని తీవ్రతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ప్రాణహాని నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి పాదటిప్పణితో స్పష్టం చేశాం; חֹרְשָׁה విషయంలోని నిజమైన భాషాత్మక సందిగ్ధతను కూడా సూచించాం.
