  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל בְּרוּכִ֥ים אַתֶּ֖ם לַֽ/יהוָ֑ה כִּ֥י חֲמַלְתֶּ֖ם עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/021.yaml
  text: Saul said[a], “May you be blessed by Yahweh[b], because you have had compassion on me.”
translation:
  language: te
  text: 'సౌలు ఇలా అన్నాడు: “మీరు యెహోవా చేత ఆశీర్వదించబడుదురు గాక! ఎందుకంటే మీరు నాపై కనికరం చూపించారు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కనికరం చూపించారు” అని అనువదించిన హీబ్రూ క్రియకు కొన్ని సందర్భాల్లో “జాలిపడి విడిచిపెట్టారు” లేదా “కాపాడారు” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన శైలిలోని wayyiqtol రూపాన్ని సహజమైన ఆధునిక తెలుగు కథనంగా అందిస్తుంది; ప్రారంభ וַ భావాన్ని ప్రత్యేకంగా ‘మరియు’ అని చెప్పనవసరం లేదు.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בְּרוּכִים אַתֶּם
  choice: మీరు ... ఆశీర్వదించబడుదురు గాక
  rationale: ఇది కేవలం వారి స్థితిని తెలిపే వాక్యం కాక, ఆశీర్వాద ప్రకటనగా ఉన్న భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవా చేత
  rationale: ఆశీర్వాదానికి మూలం యెహోవా అని సూచించే לַ సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సౌలు పలికిన ఆశీర్వాదానికి కారణాన్ని పరిచయం చేసే కారణార్థక ప్రయోగం.
- source_word: חֲמַלְתֶּם
  choice: కనికరం చూపించారు
  rationale: חמל యొక్క ప్రధాన భావమైన జాలి లేదా కనికరాన్ని ఇక్కడ సహజంగా వ్యక్తపరుస్తుంది; సందర్భానుసారం ‘కాపాడడం/విడిచిపెట్టడం’ అనే ఛాయ కూడా ఉండవచ్చు.
- source_word: עָלָי
  choice: నాపై
  rationale: חמל‌తో వచ్చిన עַל నిర్మాణానికి సహజమైన తెలుగు సమానార్థక ప్రయోగం.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచింది; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’.
- issue: బెరూఖీమ్ అత్తెమ్ ఆశీర్వాద సూత్రం
  choice: మీరు యెహోవా చేత ఆశీర్వదించబడుదురు గాక
  alternative: మీరు యెహోవాకు ఆశీర్వదించబడినవారు
  rationale: హీబ్రూ నిర్మాణంలోని ప్రకటనాత్మకత మరియు ఆశీర్వచన బలం రెండింటినీ నిలుపుతూ, దాన్ని కేవలం ఇప్పటికే ఉన్న స్థితి వివరణగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఆశీర్వాద సూత్రానికి కొంత ఉన్నతమైన ‘ఆశీర్వదించబడుదురు గాక’ రూపాన్ని ఉంచి, మిగతా వాక్యాన్ని సహజమైన సమకాలీన తెలుగులో ఇచ్చాం.
