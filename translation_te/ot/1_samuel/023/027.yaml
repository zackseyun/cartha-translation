  text: But a messenger came to Saul, saying, “Hurry and come, for the Philistines have made a raid against the land.”
translation:
  language: te
  text: అయితే ఒక దూత సౌలు దగ్గరికి వచ్చి, “త్వరగా వెళ్లండి, ఎందుకంటే ఫిలిష్తీయులు దేశంపై దాడి చేశారు” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאָךְ
  choice: దూత
  rationale: ఈ సందర్భంలో వార్త తీసుకొచ్చిన మానవ సందేశకుణ్ణి సూచిస్తుంది; ‘దూత’ సహజంగా ఉండి మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: מַהֲרָה וְלֵכָה
  choice: త్వరగా బయలుదేరి రండి
  rationale: త్వరపడమనే ఆజ్ఞను, వెంటనే వెళ్లాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: פָשְׁטוּ
  choice: దండెత్తారు
  rationale: శత్రు సైన్యం ఆకస్మికంగా దాడికి చొరబడటాన్ని సూచించే క్రియకు సందర్భోచితమైన తెలుగు పదం.
- source_word: עַל הָאָרֶץ
  choice: దేశం మీదికి
  rationale: దాడి దేశానికి వ్యతిరేకంగా, దాని భూభాగంలోకి సాగిందనే దిశాత్మక భావాన్ని నిలుపుతుంది.
