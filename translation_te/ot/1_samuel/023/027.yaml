    issue: ‘దండెత్తారు’ is stronger and less specific than the source’s raiding terminology.
    rationale: The Hebrew verb פשט denotes making a raid/foray. A general hostile attack is preferable to wording that can imply an organized invasion.
  - severity: low
    issue: ‘బయలుదేరి రండి’ adds a departure nuance not explicit in the Hebrew.
    rationale: מַהֲרָה וְלֵכָה means ‘Hurry and go.’ ‘త్వరగా వెళ్లండి’ preserves this more directly.
