  register: ఆధునిక ప్రామాణిక తెలుగులో, చారిత్రక కథనానికి తగిన గౌరవప్రదమైన సరళ శైలి. సౌలును సంబోధించే మాటల్లో తెలుగు వాడుకకు అనుగుణంగా గౌరవ బహువచనం వాడబడింది.
