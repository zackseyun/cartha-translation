  edition: WLC
  text: וַ/יֻּגַּ֣ד לְ/שָׁא֔וּל כִּי בָ֥א דָוִ֖ד קְעִילָ֑ה וַ/יֹּ֣אמֶר שָׁא֗וּל נִכַּ֨ר אֹת֤/וֹ אֱלֹהִים֙ בְּ/יָדִ֔/י כִּ֚י נִסְגַּ֣ר לָ/ב֔וֹא בְּ/עִ֖יר דְּלָתַ֥יִם וּ/בְרִֽיחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
translation:
  language: te
  text: దావీదు కెయీలాకు వచ్చాడని సౌలుకు సమాచారం అందింది. అప్పుడు సౌలు, “దేవుడు అతణ్ణి నా చేతికి అప్పగించాడు[a]. ఎందుకంటే జత ద్వారాలు, అడ్డగడియ ఉన్న పట్టణంలోకి ప్రవేశించి అతడు లోపల చిక్కుకున్నాడు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు అతణ్ణి నా వశం చేశాడు.” దావీదు ఉన్న పరిస్థితిని దేవుడే తనకు అనుకూలంగా మార్చాడని సౌలు భావించాడు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “జత తలుపులు, అడ్డగడియ ఉన్న పట్టణం.” ఇది పట్టణ ద్వారంలో ఉన్న జత తలుపు పలకలను, వాటిని లోపల నుంచి బిగించే అడ్డగడియను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: సమాచారం అందింది
  rationale: హోఫల్ క్రియలోని పరోక్ష/కర్మణి భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా సౌలుకు వార్త చేరిందని తెలియజేస్తుంది.
- source_word: בָא דָוִד קְעִילָה
  choice: దావీదు కెయీలాకు వచ్చాడు
  rationale: בוא ఇక్కడ ఒక గమ్యస్థానానికి రావడం లేదా చేరడాన్ని సూచిస్తుంది; సందర్భానికి ‘వచ్చాడు’ సహజంగా సరిపోతుంది.
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  choice: దేవుడు అతణ్ణి నా చేతికి అప్పగించాడు
  rationale: అరుదైన נכר రూపం ఈ సందర్భంలో అప్పగించడం లేదా వశం చేయడం అనే భావాన్ని ఇస్తుంది. ‘నా చేతికి’ అనే హీబ్రూ అధికార-సామర్థ్య నుడికారాన్ని అలాగే ఉంచింది.
- source_word: נִסְגַּר
  choice: అతడు లోపల చిక్కుకున్నాడు
  rationale: నిఫాల్ రూపంలో కర్మణి లేదా స్వప్రయోజక ఛాయ ఉండవచ్చు. పట్టణంలోకి వెళ్లి తప్పించుకోలేని స్థితిలో పడ్డాడన్న సౌలు భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, అతడు ఉద్దేశపూర్వకంగా తనను తానే బంధించుకున్నాడని అతిగా నిర్ధారించదు.
- source_word: לָבוֹא
  choice: ప్రవేశించి
  rationale: పట్టణంలో ప్రవేశించడమే అతడు చిక్కుకోవడానికి కారణం లేదా విధానం అని అనంతక్రియ సూచిస్తుంది.
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  choice: రెండు తలుపులూ అడ్డగడియా ఉన్న పట్టణం
  rationale: דלתים నగర ద్వారంలోని జత తలుపు పలకలను, בריח వాటిని బిగించే అడ్డగడియను సూచిస్తుంది; హీబ్రూలో అడ్డగడియ ఏకవచనంలో ఉంది.
theological_decisions:
- issue: దావీదు తన వశమయ్యాడని దేవుని చర్యకు సౌలు ఆపాదించడం
  choice: సౌలు పలికిన మాటగానే ‘దేవుడు అతణ్ణి నా చేతికి అప్పగించాడు’ అని నేరుగా అనువదించడం
  alternative: ‘దేవుడు అతణ్ణి తన చేతికి అప్పగించాడని సౌలు భావించాడు’ అని వ్యాఖ్యానాత్మక దూరం చేర్చడం
  rationale: హీబ్రూ వాక్యం సౌలు మాటను నేరుగా ఇస్తుంది; కథకుడు ఆ మాటను సమర్థిస్తున్నాడా లేదా అన్నది అనువాదం ముందుగానే తీర్మానించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నా చేతికి’ అనే బైబిలీయ నుడికారాన్ని అర్థమయ్యేలా నిలిపి, కోటగోడల పట్టణ ద్వారం గురించిన స్పష్టతను పాదటిప్పణిలో ఇచ్చాం.
