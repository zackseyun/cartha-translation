translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గౌరవప్రదమైన సహజ శైలి. హీబ్రూ అలంకార ప్రశ్నను ‘కదా?’తో నిలిపి, חֹרֶשׁ మరియు מִימִין పదాల్లోని నిజమైన అర్థసందిగ్ధతలను పాదటిప్పణుల్లో సంరక్షించాం. ప్రధాన పాఠ్యంలోని [a], [b] సూచికలు సంబంధిత పదబంధాల వద్ద ఉంచబడ్డాయి.
