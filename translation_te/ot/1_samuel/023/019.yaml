source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ זִפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֣וֹא דָ֠וִד מִסְתַּתֵּ֨ר עִמָּ֤/נוּ בַ/מְּצָדוֹת֙ בַּ/חֹ֔רְשָׁה בְּ/גִבְעַת֙ הַֽ/חֲכִילָ֔ה אֲשֶׁ֖ר מִ/ימִ֥ין הַ/יְשִׁימֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
translation:
  language: te
  text: అప్పుడు జీఫీయులు గిబియాలో ఉన్న సౌలు దగ్గరకు ఎక్కి వెళ్లి, “దావీదు మన మధ్య దుర్గాలలో, అడవిగల ప్రాంతంలో[a], యెషీమోనుకు కుడివైపున ఉన్న హకీలా కొండపై[b] దాక్కొని ఉన్నాడు కదా?” అని చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హోరేషులో.” ఇక్కడి హీబ్రూ పదాన్ని ‘అడవిగల ప్రాంతం’ అనే సాధారణ నామంగా గానీ, ‘హోరేషు’ అనే స్థలనామంగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “యెషీమోనుకు కుడివైపున.” హీబ్రూ భౌగోళిక దిశావ్యవహారంలో ఇది “యెషీమోనుకు దక్షిణాన” అని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: వెళ్లి
  rationale: עלה అనే క్రియలోని ప్రయాణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; గిబియాకు ఎక్కి వెళ్లడం సందర్భం ద్వారా గ్రహించవచ్చు.
- source_word: זִפִים
  choice: జీఫీయులు
  rationale: జీఫు నివాసులను సూచించే బహువచన జాతివాచక రూపం.
- source_word: הַגִּבְעָתָה
  choice: గిబియాలో ఉన్న
  rationale: దిశాసూచక రూపం గిబియావైపు ప్రయాణాన్ని సూచిస్తుంది; ‘సౌలు దగ్గరికి’ అనే నిర్మాణంతో తెలుగులో ఈ రూపం సహజంగా సౌలు ఉన్న స్థలాన్ని తెలియజేస్తుంది.
- source_word: הֲלוֹא
  choice: ఉన్నాడు కదా?
  rationale: అంగీకారాన్ని ఆశించే హీబ్రూ అలంకార ప్రశ్నను సహజమైన తెలుగు ప్రశ్నాంతంతో నిలుపుతుంది.
- source_word: מִסְתַּתֵּר
  choice: దాక్కొని ఉన్నాడు
  rationale: తన్ను తాను దాచుకొని కొనసాగుతున్న స్థితిని సూచించే హిత్పయేల్ వర్తమాన క్రియారూప భావాన్ని ఇస్తుంది.
- source_word: עִמָּנוּ
  choice: మా ప్రాంతంలో
  rationale: అక్షరార్థంగా ‘మాతో’; సందర్భంలో జీఫీయుల పరిధిలో దావీదు దాగి ఉన్నాడనే ప్రాదేశిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַמְּצָדוֹת
  choice: దుర్గాల్లో
  rationale: రక్షణకు అనువైన బలమైన స్థలాలు లేదా కొండ దుర్గాలను సూచిస్తుంది.
- source_word: בַּחֹרְשָׁה
  choice: అడవిగల ప్రాంతంలోని
  rationale: సాధారణ నామవాచకమైన ‘అడవి/వనప్రాంతం’ అనే అర్థాన్ని ప్రధాన పాఠ్యంలో తీసుకొని, స్థలనామ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: హకీలా కొండమీద
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, భౌగోళిక స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  choice: అరణ్యానికి కుడివైపున ఉన్న
  rationale: מִימִין యొక్క అక్షరార్థ దిశను నిలుపుతుంది; הַיְשִׁימוֹןను ఈ సందర్భంలో నిర్జన అరణ్యప్రాంతంగా అనువదిస్తుంది. ‘దక్షిణాన’ అనే సంభావ్య భౌగోళిక భావాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
