  text: וַ/יֵּ֨לֶךְ שָׁא֜וּל מִ/צַּ֤ד הָ/הָר֙ מִ/זֶּ֔ה וְ/דָוִ֧ד וַ/אֲנָשָׁ֛י/ו מִ/צַּ֥ד הָ/הָ֖ר מִ/זֶּ֑ה וַ/יְהִ֨י דָוִ֜ד נֶחְפָּ֤ז לָ/לֶ֨כֶת֙ מִ/פְּנֵ֣י שָׁא֔וּל וְ/שָׁא֣וּל וַ/אֲנָשָׁ֗י/ו עֹֽטְרִ֛ים אֶל דָּוִ֥ד וְ/אֶל אֲנָשָׁ֖י/ו לְ/תָפְשָֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
translation:
  language: te
  text: సౌలు కొండకు ఒక వైపున వెళ్తుండగా,[a] దావీదు, అతని మనుషులు కొండకు మరో వైపున ఉన్నారు. దావీదు సౌలు ఎదుటనుండి వెళ్లిపోవడానికి త్వరపడుతున్నాడు; సౌలు, అతని మనుషులు దావీదును, అతని మనుషులను పట్టుకోవడానికి చుట్టుముడుతున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా: “సౌలు కొండ ప్రక్కన, ఈ వైపున వెళ్తున్నాడు; దావీదు, అతని మనుషులు కొండ ప్రక్కన, ఈ వైపున ఉన్నారు.” ఉద్దేశించిన స్థానభేదాన్ని తెలుగులో “ఒక వైపున—మరో వైపున” అని వ్యక్తపరిచాం.'
    reason: lexical_alternative
  - marker: b
    text: లేదా “దావీదును, అతని మనుషులను పట్టుకోవడానికి వారిపై అన్నివైపుల నుంచి దగ్గరపడుతున్నారు.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్తుండగా
  rationale: ఈ కథన సందర్భంలో సౌలు, దావీదు ఒకేసారి కొండకు చెరో వైపున కదులుతున్న దృశ్యాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִצַּד הָהָר מִזֶּה ... מִצַּד הָהָר מִזֶּה
  choice: కొండకు ఒక వైపున ... కొండకు మరో వైపున
  rationale: హీబ్రూలో రెండుసార్లు వచ్చిన ‘ఈ వైపు నుండి’ అనే దిశాసూచక రూపాన్ని పదక్షరంగా అనువదిస్తే తెలుగులో అసహజంగా ఉంటుంది; ఉద్దేశించిన ఎదురెదురు స్థానాలను ‘ఒక వైపు—మరో వైపు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: נֶחְפָּז
  choice: త్వరపడుతున్నాడు
  rationale: నిఫాల్ కృదంతం సూచించే అత్యవసరమైన వేగాన్ని తెలియజేస్తుంది; భయాందోళనను అవసరానికి మించి చేర్చదు.
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  choice: సౌలు ఎదుటనుండి వెళ్లిపోవడానికి
  rationale: ‘సౌలు ముఖము/సన్నిధి ఎదుటనుండి వెళ్లడం’ అనే మూలభావాన్ని కాపాడుతూ, ‘పారిపోవడం’ అనే మరింత బలమైన భావాన్ని చేర్చకుండా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עֹטְרִים
  choice: చుట్టుముడుతున్నారు
  rationale: దావీదు బృందాన్ని పట్టుకోవడానికి సౌలు బలగాలు వారి చుట్టూ వలయాన్ని బిగిస్తున్న కదలికను వ్యక్తపరుస్తుంది; ‘దగ్గరపడుతున్నారు’ కంటే మూలపదంలోని చుట్టుముట్టే భావాన్ని బాగా నిలుపుతుంది.
- source_word: לְתָפְשָׂם
  choice: వారిని పట్టుకోవడానికి
  rationale: సైనిక వెంబడింపు సందర్భంలో ఉద్దేశాన్ని స్పష్టంగా తెలుపుతుంది; సర్వనామ ప్రత్యయాన్ని ‘వారిని’గా నిలుపుతుంది.
