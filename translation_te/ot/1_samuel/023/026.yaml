translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని వర్తమాన కృదంతాల వల్ల కనిపించే కొనసాగుతున్న అత్యవసర కదలికను నిలిపాం. ప్రధాన వాక్యంలో అన్ని పాదసూచిక గుర్తులు చేర్చబడ్డాయి.
