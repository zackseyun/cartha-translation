  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/יַסְגִּרֻ֣/נִי בַעֲלֵי֩ קְעִילָ֨ה בְ/יָד֜/וֹ הֲ/יֵרֵ֣ד שָׁא֗וּל כַּֽ/אֲשֶׁר֙ שָׁמַ֣ע עַבְדֶּ֔/ךָ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַגֶּד נָ֖א לְ/עַבְדֶּ֑/ךָ וַ/יֹּ֥אמֶר יְהוָ֖ה יֵרֵֽד־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
translation:
  language: te
  text: '“కెయీలా ప్రజలు నన్ను అతని చేతికి అప్పగిస్తారా?[a] నీ సేవకుడు విన్నట్టుగా సౌలు దిగివస్తాడా? ఇశ్రాయేలు దేవుడవైన యాహ్వే, దయచేసి నీ సేవకునికి తెలియజేయి.” అప్పుడు యాహ్వే ఇలా చెప్పాడు: “అతడు దిగివస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతని చేతికి’ అనేది సౌలు అధికారానికి లేదా అదుపుకు అప్పగించడాన్ని సూచించే హెబ్రీ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּרֻנִי
  choice: నన్ను … అప్పగిస్తారా
  rationale: హిఫిల్ రూపంలోని ఈ క్రియ, ఒకరిని మరొకరి అధికారానికి లేదా అదుపుకు అప్పగించడాన్ని సూచిస్తుంది. ‘అప్పగిస్తారా’ ఆధునిక తెలుగులో సహజంగా ఉండి, శత్రువు చేతికి ఇచ్చివేయడమనే భావాన్ని నిలుపుతుంది.
- source_word: בַעֲלֵי קְעִילָה
  choice: కెయీలా పట్టణపు పెద్దలు
  rationale: בַעֲלֵי అనే పదానికి అక్షరార్థంగా ‘యజమానులు/ప్రభువులు’ అనే అర్థాలున్నా, ఇక్కడ పట్టణానికి ప్రాతినిధ్యం వహించే ప్రముఖులను సూచిస్తుంది. ‘పెద్దలు’ పౌర నాయకత్వ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; కేవలం పురుష నివాసులందరినీ సూచిస్తున్నట్లు అనిపించనివ్వదు.
- source_word: בְיָדוֹ
  choice: అతని చేతికి
  rationale: ‘చేతికి’ అనే హెబ్రీ నుడికారాన్ని తెలుగులోనూ నిలుపుతూ, సౌలు అధీనానికి అప్పగించడమనే భావాన్ని అందిస్తుంది. ‘అతని’ అనే సర్వనామం సౌలును సూచిస్తుంది.
- source_word: יֵרֵד
  choice: ఇక్కడికి దిగివస్తాడా / దిగివస్తాడు
  rationale: క్రియకు ‘దిగివచ్చు/దిగిపోవు’ అనే ప్రాథమిక అర్థం ఉంది. దావీదు ఉన్న కెయీలాకు సౌలు కదలివస్తున్నందున ప్రశ్నలో ‘ఇక్కడికి దిగివస్తాడా’ సహజం; జవాబులో అదే క్రియను ‘దిగివస్తాడు’గా నిలిపాం.
- source_word: כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ
  choice: నీ సేవకుడు విన్నట్టుగా
  rationale: దావీదుకు అందిన సమాచారాన్ని ఆధారంగా చేసుకున్న ప్రశ్నను ఈ సంక్షిప్త రూపం నమ్మకంగా వ్యక్తం చేస్తుంది.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుడు / నీ సేవకునికి
  rationale: దేవుని ఎదుట వినయపూర్వకంగా తనను తాను సూచించుకునే ప్రార్థనా భాష ఇది. అందువల్ల ‘దాసుడు’ కంటే ‘సేవకుడు’ ఆధునిక పాఠకులకు సందర్భోచితంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ ధ్వన్యనుకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: הַגֶּד נָא
  choice: దయచేసి … తెలియజేయి
  rationale: నָא మర్యాదతో కూడిన అత్యవసర విన్నపాన్ని సూచిస్తుంది; ‘దయచేసి తెలియజేయి’ ఆధునిక, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: וַיֹּאמֶר יְהוָה
  choice: అప్పుడు యాహ్వే … అని చెప్పాడు
  rationale: హెబ్రీ కథన క్రమాన్ని సహజమైన తెలుగు కథన సంధి ‘అప్పుడు’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ధ్వన్యనుకరణ చేయడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది; ‘యాహ్వే’ ప్రస్తుత పండితుల పునర్నిర్మిత ఉచ్చారణకు సమీపమైన తెలుగు రూపం.
- issue: సౌలు దిగివస్తాడనే దైవజవాబు మరియు తరువాతి సంఘటనల మధ్య ఉద్వేగం
  choice: షరతును చేర్చకుండా ‘అతడు దిగివస్తాడు’ అని నేరుగా అనువదించడం
  alternative: ‘పరిస్థితులు మారకపోతే అతడు దిగివస్తాడు’
  rationale: హెబ్రీ పాఠం జవాబులో ఎలాంటి వ్యక్తమైన షరతునూ చేర్చదు. సందర్భం సంభావ్య భవిష్యత్తుతో ఎలా సంబంధించిందనే వేదాంత ప్రశ్నను అనువాదంలో ముందుగానే పరిష్కరించకుండా, మూలంలోని సంక్షిప్తతను మరియు ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా మరియు కథన శైలిని ఉపయోగించాం. ‘కెయీలా పట్టణపు పెద్దలు’ అనే రూపం పట్టణ ప్రతినిధుల భావాన్ని స్పష్టం చేస్తుంది. మూలంలో రెండు ప్రశ్నల క్రమాన్ని, అలాగే దైవజవాబు యొక్క సంక్షిప్తతను నిలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠంలో సంబంధిత నుడికారం వెంట ఉంచబడింది.
