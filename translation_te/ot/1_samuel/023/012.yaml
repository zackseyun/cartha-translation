id: 1SA.23.12
reference: 1 Samuel 23:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/יַסְגִּ֜רוּ בַּעֲלֵ֧י קְעִילָ֛ה אֹתִ֥/י וְ/אֶת אֲנָשַׁ֖/י בְּ/יַד שָׁא֑וּל וַ/יֹּ֥אמֶר יְהוָ֖ה יַסְגִּֽירוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
translation:
  language: te
  text: అప్పుడు దావీదు, “కెయీలా పట్టణస్థులు నన్నూ నా మనుషులనూ సౌలు చేతికి అప్పగిస్తారా?” అని అడిగాడు. యాహ్వే[a], “వారు నిన్ను అప్పగిస్తారు[b]” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇక్కడ ఇశ్రాయేలు దేవుని వ్యక్తిగత నామమైన יהוה (YHWH) ఉంది; దీనిని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
    reason: దైవనామ లిప్యంతరీకరణను స్పష్టం చేయడం.
  - marker: b
    text: హీబ్రూ జవాబు అక్షరార్థంగా, “వారు నిన్ను అప్పగిస్తారు” అని ఏకవచనంలో దావీదును ఉద్దేశిస్తుంది; అతని మనుషులు సందర్భంలో అంతర్భూతంగా ఉన్నారు.
    reason: మూలంలోని ఏకవచన కర్మను మరియు దాని సందర్భార్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: הֲיַסְגִּרוּ / יַסְגִּירוּ
  choice: అప్పగిస్తారా / అప్పగిస్తారు
  rationale: హిఫీల్ రూపంలోని סגר ఇక్కడ ఒకరిని మరొకరి అధికారానికి లేదా అదుపుకు అప్పగించడాన్ని సూచిస్తుంది. ‘అప్పగించు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ప్రశ్నలోను జవాబులోను మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: בַּעֲלֵי קְעִילָה
  choice: కెయీలా పట్టణస్థులు
  rationale: బַּעֲלֵי అనే పదానికి అక్షరార్థంగా ‘యజమానులు/ప్రభువులు’ అనే భావం ఉండగలిగినా, ఈ పౌర సందర్భంలో అది పట్టణ నివాసులను లేదా ప్రముఖులను సూచిస్తుంది. ‘పట్టణస్థులు’ అవసరానికి మించి నాయకులకే పరిమితం చేయదు.
- source_word: אֹתִי וְאֶת אֲנָשַׁי
  choice: నన్నూ నా మనుషులనూ
  rationale: అక్షరార్థమైన ‘నా మనుషులు’ అనే భావాన్ని నిలుపుతూ, వారిని ప్రత్యేకంగా సైనికులని నిర్ధారించకుండా దావీదు అనుచరులను సూచిస్తుంది.
- source_word: בְּיַד שָׁאוּל
  choice: సౌలు చేతికి
  rationale: హీబ్రూ ‘సౌలు చేతిలోకి’ అనే అధికారాన్ని సూచించే నుడికారాన్ని తెలుగులో సహజమైన ‘సౌలు చేతికి’గా ఉంచి, మూలంలోని ‘చేయి’ రూపకాన్ని కాపాడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: יַסְגִּירוּ
  choice: వారు నిన్ను అప్పగిస్తారు
  rationale: హీబ్రూ జవాబులో కర్మ ఏకవచనంగా దావీదునే ఉద్దేశిస్తుంది; అతని మనుషులు సందర్భంలో అంతర్భూతమైనా, మూలంలోని ఏకవచనాన్ని మార్చకుండా నిలిపింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; అందువల్ల ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక ప్రామాణిక తెలుగు బైబిలు పాఠకులకు సహజంగా గుర్తుపడే లిప్యంతరీకరణగా ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: దేవుని జవాబులో ఏకవచన కర్మ
  choice: వారు నిన్ను అప్పగిస్తారు
  alternative: వారు నిన్నూ నీ మనుషులనూ అప్పగిస్తారు
  rationale: ప్రశ్నలో దావీదు తనను, తన మనుషులను ప్రస్తావించినా, హీబ్రూ జవాబులో కర్మ ఏకవచనంగా ఉంది. దావీదు ప్రతినిధి నాయకుడిగా ఉద్దేశించబడి ఉండవచ్చు; ఆ ఉద్వేగాన్ని స్పష్టీకరణ పేరుతో తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అప్పగించు’ శత్రువు అధికారానికి ఇవ్వడం అనే భావాన్ని స్పష్టంగా అందిస్తుంది. కెయీలా అనే స్థలనామ రూపం, సౌలు అనే వ్యక్తినామ రూపం సాధారణ తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఉన్నాయి.
