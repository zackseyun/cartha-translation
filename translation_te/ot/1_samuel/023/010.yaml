id: 1SA.23.10
reference: 1 Samuel 23:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שָׁמֹ֤עַ שָׁמַע֙ עַבְדְּ/ךָ֔ כִּֽי מְבַקֵּ֥שׁ שָׁא֖וּל לָ/ב֣וֹא אֶל קְעִילָ֑ה לְ/שַׁחֵ֥ת לָ/עִ֖יר בַּ/עֲבוּרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
translation:
  language: te
  text: 'అప్పుడు దావీదు ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడవైన యాహ్వే[a], సౌలు కెయీలాకు వచ్చి నా కారణంగా ఆ పట్టణాన్ని నాశనం చేయడానికి ప్రయత్నిస్తున్నాడని నీ సేవకుడు నిశ్చయంగా విన్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామానికి సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు దావీదు ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు తీసుకెళ్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు సమీపమైన వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడవైన
  rationale: సంబోధనలో సహజంగా వినిపిస్తూ ‘ఇశ్రాయేలు దేవుడు’ అనే నిర్మాణ సంబంధాన్ని కాపాడుతుంది.
- source_word: שָׁמֹעַ שָׁמַע
  choice: నిశ్చయంగా విన్నాడు
  rationale: క్రియకు ముందున్న infinitive absolute ఇచ్చే బలాన్ని ‘నిశ్చయంగా’ ద్వారా వ్యక్తం చేసింది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు
  rationale: దేవుని ఎదుట దావీదు తనను తాను వినయంగా సూచించుకునే మూడవ పురుష స్వీయసంబోధనను నిలుపుతుంది.
- source_word: מְבַקֵּשׁ
  choice: చేయాలని చూస్తున్నాడు
  rationale: సాగుతున్న ఉద్దేశం లేదా ప్రయత్నాన్ని సూచించే participle భావాన్ని, అతిగా నిర్ధారించకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָבוֹא אֶל קְעִילָה
  choice: కెయీలాకు వచ్చి
  rationale: בוא యొక్క ‘రావడం’ అనే దృక్కోణాన్ని నిలుపుతూ గమ్యస్థానాన్ని స్పష్టంగా తెలిపింది.
- source_word: לְשַׁחֵת לָעִיר
  choice: ఈ పట్టణాన్ని నాశనం చేయాలని
  rationale: సైనిక సందర్భంలో שׁחת యొక్క విధ్వంస భావాన్ని స్పష్టంగా ఇస్తుంది; నిర్దిష్ట పట్టణం కెయీలాను ‘ఈ పట్టణం’గా సహజంగా సూచిస్తుంది.
- source_word: בַּעֲבוּרִי
  choice: నా కారణంగా
  rationale: దావీదు కారణంగానే పట్టణానికి ప్రమాదం వస్తోందనే కారణార్థాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించిన ఉచ్చారణకు సమీపంగా నిలుపుతుంది.
- issue: దావీదు తనను ‘నీ సేవకుడు’ అని మూడవ పురుషంలో పేర్కొనడం
  choice: నీ సేవకుడు నిశ్చయంగా విన్నాడు
  alternative: నీ సేవకుడైన నేను నిశ్చయంగా విన్నాను
  rationale: తెలుగులో ప్రత్యామ్నాయం మరింత సహజమైనప్పటికీ, మూలంలోని వినయపూర్వక మూడవ పురుష స్వీయసూచనను ప్రధాన పాఠంలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించింది. మూలంలోని బలప్రయోగం, దావీదు వినయపూర్వక స్వీయసూచన, సౌలు ఉద్దేశం ఇంకా కార్యరూపం దాల్చని భావం కాపాడబడ్డాయి.
