  text: וּ/רְא֣וּ וּ/דְע֗וּ מִ/כֹּ֤ל הַ/מַּֽחֲבֹאִים֙ אֲשֶׁ֣ר יִתְחַבֵּ֣א שָׁ֔ם וְ/שַׁבְתֶּ֤ם אֵלַ/י֙ אֶל נָכ֔וֹן וְ/הָלַכְתִּ֖י אִתְּ/כֶ֑ם וְ/הָיָה֙ אִם יֶשְׁנ֣/וֹ בָ/אָ֔רֶץ וְ/חִפַּשְׂתִּ֣י אֹת֔/וֹ בְּ/כֹ֖ל אַלְפֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
translation:
  language: te
  text: అతడు దాక్కునే అన్ని స్థలాల గురించి జాగ్రత్తగా చూసి తెలుసుకోండి. ఆపై నిశ్చయమైన సమాచారంతో నా దగ్గరకు తిరిగి రండి; నేను మీతో వస్తాను. అతడు దేశంలో ఉంటే, యూదా వంశ విభాగాలన్నిటిలోనూ[a] అతని కోసం వెదుకుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “యూదా వేలన్నిటిలోనూ.” ఇక్కడ “వేలు” అనే పదం యూదాలోని వంశ లేదా కుటుంబ విభాగాలను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  choice: జాగ్రత్తగా చూసి తెలుసుకోండి
  rationale: రెండు బహువచన ఆజ్ఞలను నిలుపుతూ, ఈ సందర్భంలోని పరిశీలనాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִכֹּל הַמַּחֲבֹאִים
  choice: దాగుడు స్థలాలన్నిటినీ
  rationale: מַחֲבֹא అనే పదంలోని ‘దాక్కొనే స్థలం’ భావాన్ని స్పష్టంగా అందిస్తుంది. מן యొక్క మూలం/పరిధి భావం తెలుగులో క్రియాసంబంధం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: אֲשֶׁר יִתְחַבֵּא שָׁם
  choice: అతడు అక్కడ దాక్కొనే
  rationale: హిత్పయేల్ రూపంలోని స్వయంగా దాక్కోవడం అనే భావాన్ని ‘దాక్కొనే’ తెలియజేస్తుంది; שָׁם ను ‘అక్కడ’గా ఉంచి హీబ్రూ వాక్యంలోని స్థాన సూచనను కాపాడుతుంది.
- source_word: וְשַׁבְתֶּם אֵלַי אֶל נָכוֹן
  choice: ఆపై నిశ్చయమైన సమాచారంతో నా దగ్గరకు తిరిగి రండి
  rationale: క్రమాన్ని ‘ఆపై’తో చూపి, נָכוֹן లోని స్థిరత్వం/నిశ్చయతను ఈ గూఢచర్య సందర్భానికి తగిన ‘నిశ్చయమైన సమాచారం’గా వ్యక్తం చేస్తుంది.
- source_word: וְהָלַכְתִּי אִתְּכֶם
  choice: నేను మీతో వస్తాను
  rationale: హీబ్రూ భావాన్ని నేరుగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְהָיָה אִם יֶשְׁנוֹ בָאָרֶץ
  choice: అతడు దేశంలో ఉంటే
  rationale: హీబ్రూ షరతు నిర్మాణాన్ని తెలుగులో సహజంగా, అదనపు వివరణ లేకుండా ఇస్తుంది.
- source_word: וְחִפַּשְׂתִּי אֹתוֹ
  choice: అతని కోసం వెదుకుతాను
  rationale: חפשׂ లోని శ్రద్ధగా వెదకడం అనే భావాన్ని అతిగా ‘పట్టుకుంటాను’ అని ఫలితాన్ని చేర్చకుండా నిలుపుతుంది.
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  choice: యూదా వంశ విభాగాలన్నిటిలోనూ
  rationale: אַלְפֵי పదం ఇక్కడ సంఖ్యాపరమైన ‘వేలు’ కంటే యూదాలోని సామాజిక/వంశ సమూహ విభాగాలను సూచించే అవకాశం ఎక్కువ. మూల పదార్థాన్ని పాదసూచికలో ఉంచాం.
