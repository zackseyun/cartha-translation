base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
translation:
  language: te
  text: అప్పుడు దావీదు తన మనుషులతో కయీలాకు వెళ్లి ఫిలిష్తీయులతో యుద్ధం చేశాడు. అతడు వారి పశుసంపదను[a] తోలుకొని వెళ్లి, వారిని ఘోరంగా ఓడించాడు.[b] ఇలా దావీదు కయీలా నివాసులను రక్షించాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి పశువులను’; హీబ్రూ పదం పశువులన్నిటినీ విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘వారిని గొప్ప దెబ్బతో కొట్టాడు’; ‘వారికి ఘోర పరాజయం కలిగించాడు’ లేదా ‘వారిని భారీగా సంహరించాడు’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘విడిపించాడు’ లేదా ‘కాపాడాడు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד וַאֲנָשָׁיו קְעִילָה
  choice: దావీదు తన మనుషులతో కయీలాకు వెళ్లి
  rationale: הלך అనే కథన క్రియకు ‘వెళ్లి’ సహజమైన సమానార్థకం. אֲנָשָׁיו ఇక్కడ దావీదు వెంట ఉన్న పోరాట బృందాన్ని సూచిస్తుంది కాబట్టి ‘తన మనుషులతో’ అని అనువదించాం.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులతో యుద్ధం చేశాడు
  rationale: לחם + ב ఈ సందర్భంలో ప్రత్యర్థులతో యుద్ధం చేయడాన్ని సూచిస్తుంది. తెలుగులో ‘ఫిలిష్తీయులతో యుద్ధం చేశాడు’ అనేది విరోధ సంబంధాన్ని సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  choice: వారి పశుసంపదను తోలుకొని వెళ్లి
  rationale: נהג పశువులను తోలడాన్ని, מִקְנֶה విస్తృతంగా పశుసంపదను సూచిస్తాయి. ‘తోలుకొని వెళ్లి’ వాటిని అక్కడి నుంచి స్వాధీనంగా తరలించిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: వారిని ఘోరంగా ఓడించాడు
  rationale: ‘గొప్ప దెబ్బతో కొట్టాడు’ అనే హీబ్రూ యుద్ధ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఘోరంగా ఓడించాడు’ అని అందించాం; అది పెద్ద ఓటమి లేదా భారీ సంహారం అనే భావ ఛాయలను కలిగి ఉండవచ్చని పాదసూచికలో ఉంచాం.
- source_word: וַיֹּשַׁע
  choice: రక్షించాడు
  rationale: ישע ఈ సైనిక సందర్భంలో ప్రమాదం నుంచి కాపాడటం లేదా విడిపించడాన్ని సూచిస్తుంది. ‘రక్షించాడు’ సూటిగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: יֹשְׁבֵי קְעִילָה
  choice: కయీలా నివాసులను
  rationale: ఈ కృదంత నిర్మాణానికి అక్షరార్థం ‘కయీలాలో నివసించేవారు’; ‘కయీలా నివాసులు’ సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. వరుసగా వచ్చే హీబ్రూ వావ్-కథన రూపాలను తెలుగులో సహజమైన వాక్యప్రవాహంగా మార్చినా, సంఘటనల క్రమాన్ని కాపాడాం.
