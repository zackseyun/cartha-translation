  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక కథనానికి తగిన గౌరవప్రదమైన శైలి. హీబ్రూ నిష్క్రియ నిర్మాణం మరియు చివరి క్రియలోని స్వల్ప అస్పష్టత నిలుపబడ్డాయి.
