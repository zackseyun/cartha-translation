source:
  edition: WLC
  text: וַ/יָּקָם֩ דָּוִ֨ד וַ/אֲנָשָׁ֜י/ו כְּ/שֵׁשׁ מֵא֣וֹת אִ֗ישׁ וַ/יֵּצְאוּ֙ מִ/קְּעִלָ֔ה וַ/יִּֽתְהַלְּכ֖וּ בַּ/אֲשֶׁ֣ר יִתְהַלָּ֑כוּ וּ/לְ/שָׁא֣וּל הֻגַּ֗ד כִּֽי נִמְלַ֤ט דָּוִד֙ מִ/קְּעִילָ֔ה וַ/יֶּחְדַּ֖ל לָ/צֵֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
translation:
  language: te
  text: అప్పుడు దావీదు, అతని మనుషులు—దాదాపు ఆరువందల మంది—లేచి, కెయీలా నుండి బయలుదేరి, ఎక్కడికి వెళ్లగలిగితే అక్కడికి తిరుగుతూ వెళ్లారు.[a] దావీదు కెయీలా నుండి తప్పించుకున్నాడని సౌలుకు తెలియజేయబడింది. అందుచేత అతడు బయలుదేరడం మానుకున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఎక్కడికి వెళ్లగలిగితే అక్కడికి సంచరిస్తూ వెళ్లారు.” హీబ్రూ నుడికారం వారు ఒక చోటు నుండి మరొక చోటుకు నిరంతరం కదులుతూ ఉన్నారని నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “బయలుదేరడం మానుకున్నాడు” అంటే, దావీదు కెయీలా నుండి తప్పించుకున్నాడని విన్న తర్వాత సౌలు అతన్ని పట్టుకోవడానికి బయలుదేరే ప్రయత్నాన్ని విరమించుకున్నాడని సందర్భం సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַאֲנָשָׁיו
  choice: దావీదు, అతని మనుషులు ... లేచి
  rationale: קום యొక్క సాధారణ అర్థమైన ‘లేచారు’ను కథన శైలిలో నిలుపుతూ, దావీదు మరియు అతని మనుషులను సంయుక్త కర్తలుగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: దాదాపు ఆరువందల మంది
  rationale: సంఖ్యకు ముందు ఉన్న כְּ సుమారు అనే భావాన్ని ఇస్తుంది; సైనిక సందర్భంలో אִישׁను ‘మంది’గా లెక్కింపు రూపంలో సహజంగా అనువదించాం.
- source_word: וַיֵּצְאוּ מִקְּעִלָה
  choice: కెయీలా నుండి బయలుదేరి
  rationale: יצא లోని ఒక ప్రదేశం నుంచి బయటకు వెళ్లే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  choice: ఎక్కడికి వెళ్లగలిగితే అక్కడికి తిరుగుతూ వెళ్లారు
  rationale: హిత్పయేల్ రూపంలోని నిరంతర, స్థలం నుంచి స్థలానికి కదలికను ‘తిరుగుతూ వెళ్లారు’ తెలియజేస్తుంది; హీబ్రూ నుడికారంలోని అస్పష్టతను పూర్తిగా నిర్దిష్టం చేయకుండా ‘ఎక్కడికి వెళ్లగలిగితే అక్కడికి’గా ఇచ్చాం.
- source_word: וּלְשָׁאוּל הֻגַּד
  choice: సౌలుకు తెలియజేయబడింది
  rationale: నגד యొక్క హోఫల్ నిష్క్రియ రూపాన్ని నిలుపుతూ, నివేదించబడిన సమాచారాన్ని గౌరవప్రదమైన కథన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי נִמְלַט דָּוִד מִקְּעִילָה
  choice: దావీదు కెయీలా నుండి తప్పించుకున్నాడని
  rationale: נמלט లోని తప్పించుకోవడం/చిక్కకుండా బయటపడడం అనే భావం వెంటాడే సందర్భానికి సరిపోతుంది.
- source_word: וַיֶּחְדַּל לָצֵאת
  choice: అతడు బయలుదేరడం మానుకున్నాడు
  rationale: חדל + క్రియార్థక రూపంలోని ‘చేయడం మానుకొను’ భావాన్ని నిలుపుతుంది; ఏ ప్రయాణం లేదా దండయాత్ర అన్నది ప్రధాన పాఠ్యంలో అనవసరంగా నిర్ధారించదు.
