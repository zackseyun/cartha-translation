- from: అప్పుడు సౌలు కుమారుడైన యోనాతాను లేచి, హోరెషులో ఉన్న దావీదు దగ్గరికి వెళ్లి, దేవునిలో అతని చెయ్యిని బలపరిచాడు.[a]
  to: అప్పుడు సౌలు కుమారుడైన యోనాతాను లేచి, హోరెషులో దావీదు వద్దకు వెళ్లి, దేవునిలో అతని చేతిని బలపరిచాడు.[a]
