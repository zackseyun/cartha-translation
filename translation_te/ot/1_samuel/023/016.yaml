source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יְהוֹנָתָ֣ן בֶּן שָׁא֔וּל וַ/יֵּ֥לֶךְ אֶל דָּוִ֖ד חֹ֑רְשָׁה וַ/יְחַזֵּ֥ק אֶת יָד֖/וֹ בֵּ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
translation:
  language: te
  text: అప్పుడు సౌలు కుమారుడైన యోనాతాను లేచి, హోరెషులో దావీదు వద్దకు వెళ్లి, దేవునిలో అతని చేతిని బలపరిచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవునిలో అతనిని ధైర్యపరిచాడు”; అక్షరార్థంగా, “దేవునిలో అతని చేతిని బలపరిచాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ ఉద్దేశపూర్వక చర్య ఆరంభాన్ని సూచిస్తుంది; ‘లేచి’ కథన క్రమాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  choice: సౌలు కుమారుడైన యోనాతాను
  rationale: హీబ్రూ పుత్రసంబంధ నిర్మాణాన్ని స్పష్టంగా ఉంచుతూ కుటుంబ, రాజకీయ ఉద్రిక్తతను నిలుపుతుంది.
- source_word: וַיֵּלֶךְ אֶל דָּוִד
  choice: దావీదు దగ్గరికి వెళ్లి
  rationale: הלך אל చేరువ కావడం లేదా ఒకరి వద్దకు వెళ్లడాన్ని సూచిస్తుంది; తెలుగులో ‘దగ్గరికి వెళ్లి’ సహజమైన వ్యక్తీకరణ.
- source_word: חֹרְשָׁה
  choice: హోరెషులో ఉన్న
  rationale: ఇక్కడ חֹרְשָׁה సాధారణ నామవాచకంగా కాక స్థలనామంగా గ్రహించబడింది; దిశార్థక రూపం సందర్భంలో దావీదు ఉన్న ప్రదేశాన్ని సూచిస్తుంది.
- source_word: וַיְחַזֵּק
  choice: బలపరిచాడు
  rationale: పియేల్ రూపంలోని חזק ‘బలపరచడం’ అనే ప్రత్యక్ష భావాన్ని ఇస్తుంది; ‘ధైర్యపరిచాడు’ దాని ప్రభావాన్ని తెలిపినా మరింత వ్యాఖ్యానాత్మకం.
- source_word: אֶת יָדוֹ
  choice: అతని చెయ్యిని
  rationale: మూలంలోని ‘అతని చెయ్యి’ అనే రూపకాన్ని నిలుపుతుంది; ఇది దావీదు ధైర్యం లేదా సంకల్పాన్ని బలపరచడాన్ని సూచించే హీబ్రూ నుడికారం.
- source_word: בֵּאלֹהִים
  choice: దేవునిలో
  rationale: ב అనే విభక్తి ఇక్కడ బలానికి ఆధారం లేదా పరిధిని సూచిస్తుంది; ‘దేవునిలో’ మూలానికి దగ్గరగా ఉండి, ‘దేవుని ద్వారా’ వంటి కారణార్థ వ్యాఖ్యానాన్ని తప్పిస్తుంది.
theological_decisions:
- issue: నిర్దిష్ట ఉపపదం లేకుండా వచ్చిన אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: యెహోవా
  rationale: హీబ్రూ పాఠంలో ఇక్కడ אֱלֹהִים ఉంది, יהוה అనే దైవనామం లేదు. కాబట్టి సంప్రదాయ సమన్వయం కోసం ‘యెహోవా’ను చేర్చకుండా ‘దేవుడు’ అని అనువదించబడింది.
- issue: בֵּאלֹהִיםలోని సంబంధ భావం
  choice: దేవునిలో
  alternative: దేవుని ద్వారా
  rationale: ‘దేవునిలో’ అనేది బలపరచబడిన ఆధారం లేదా పరిధిని తెరిచి ఉంచుతుంది; ‘దేవుని ద్వారా’ దేవుణ్ణి ప్రత్యక్ష సాధనకర్తగా మరింత నిర్దిష్టంగా నిర్ణయిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని వాడుతూ, ‘అతని చెయ్యిని బలపరిచాడు’ అనే మూలభాషా రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. అది తెలుగులో కొంత అసాధారణంగా వినిపించవచ్చు కాబట్టి అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం. స్థలనామాన్ని ‘హోరెషు’గా లిప్యంతరీకరించాం.
