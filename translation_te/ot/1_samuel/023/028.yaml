  to: సౌలు దావీదును వెంబడించడం మానుకొని వెనుదిరిగి, ఫిలిష్తీయుల ఎదుటికి వెళ్లాడు. అందుచేత ఆ స్థలానికి “విభజన బండ”[a] అని పేరు పెట్టారు.
