  text: וַ/יָּ֣שָׁב שָׁא֗וּל מִ/רְדֹף֙ אַחֲרֵ֣י דָוִ֔ד וַ/יֵּ֖לֶךְ לִ/קְרַ֣את פְּלִשְׁתִּ֑ים עַל כֵּ֗ן קָֽרְאוּ֙ לַ/מָּק֣וֹם הַ/ה֔וּא סֶ֖לַע הַֽמַּחְלְקֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/028.yaml
  text: So Saul returned from pursuing David and went to meet the Philistines. Therefore that place was called the Rock of Division[a].
translation:
  language: te
  text: సౌలు దావీదును వెంబడించడం మానుకొని వెనుదిరిగి, ఫిలిష్తీయుల ఎదుటికి వెళ్లాడు. అందుచేత ఆ స్థలానికి “విభజన బండ”[a] అని పేరు పెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వేరుపాటు బండ,” “విడిపోవుట బండ.” సౌలు దావీదును వెంబడించడం నిలిపివేసి అతని నుండి విడిపోయి వెళ్లడాన్ని ఈ స్థలనామం సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: వెంబడించడం మానుకొని వెనుదిరిగి
  rationale: שׁוב ఇక్కడ సౌలు తాను సాగిస్తున్న వెంబడింపును నిలిపి వెనుదిరిగినట్లు సూచిస్తుంది; מן‌తో కూడిన క్రియారూపం కారణంగా విరమణ భావాన్ని స్పష్టంగా తెలిపాం.
- source_word: מִרְדֹף אַחֲרֵי דָוִד
  choice: దావీదును వెంబడించడం మానుకొని
  rationale: רדף సైనిక కథన సందర్భంలో ‘వెంబడించు’ అనే అర్థం ఇస్తుంది; מן చర్యనుంచి విరమించడాన్ని సూచిస్తుంది.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులను ఎదుర్కోవడానికి
  rationale: לקראת ఎదుటికి వెళ్లడం లేదా ఎదుర్కోవడం రెండింటినీ సూచించగలదు. ఇక్కడ ఫిలిష్తీయుల దాడికి ప్రతిస్పందించే సందర్భం కావడంతో ‘ఎదుర్కోవడానికి’ సహజంగా సరిపోతుంది.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ఈ సూత్రప్రాయ పదబంధం తరువాత వచ్చే స్థలనామానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: קָרְאוּ לַמָּקוֹם הַהוּא
  choice: ఆ స్థలానికి … అని పేరు పెట్టారు
  rationale: హీబ్రూలోని నిర్దిష్టం కాని బహువచన కర్తను తెలుగులో సహజంగా అలాగే అనామకంగా ఉంచుతుంది.
- source_word: סֶלַע הַמַּחְלְקוֹת
  choice: విభజన బండ
  rationale: סלע అంటే పెద్ద బండ లేదా శిలా నిర్మాణం; מחלקות విభజనలు లేదా వేరుపడటాన్ని సూచిస్తుంది. స్థలనామంగా సంక్షిప్తంగా, అర్థవంతంగా అనువదించాం; అనిశ్చిత నుడికారాన్ని పాదటిప్పణిలో నిలిపాం.
