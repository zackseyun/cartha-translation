  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אֵלֵ֣ךְ וְ/הִכֵּ֔יתִי בַּ/פְּלִשְׁתִּ֖ים הָ/אֵ֑לֶּה וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל דָּוִ֗ד לֵ֚ךְ וְ/הִכִּ֣יתָ בַ/פְּלִשְׁתִּ֔ים וְ/הוֹשַׁעְתָּ֖ אֶת קְעִילָֽהס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
translation:
  language: te
  text: 'అప్పుడు దావీదు యాహ్వేను సంప్రదించి ఇలా అడిగాడు: “నేను వెళ్లి ఈ ఫిలిష్తీయులపై దాడి చేయాలా?” యాహ్వే దావీదుతో, “వెళ్లి ఫిలిష్తీయులపై దాడి చేసి కెయీలాను రక్షించు[a]” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కెయీలాను విడిపించు.”
    reason: וְהוֹשַׁעְתָּ అనే క్రియకు ఈ సైనిక సందర్భంలో ‘రక్షించు’తో పాటు ‘విడిపించు’ అనే అర్థం కూడా సాధ్యమే.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: యాహ్వేను ... విచారించాడు
  rationale: ఇక్కడ שׁאל בַּיהוָה సాధారణంగా ప్రశ్నించడం కాక దేవుని మార్గదర్శకత్వం కోరడాన్ని సూచిస్తుంది; ‘విచారించాడు’ ఆ సంప్రదింపుల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని దేవుని ప్రత్యేక నామమైన יהוהను వ్యక్తినామంగా ప్రతిలిపి చేస్తుంది.
- source_word: הַאֵלֵךְ
  choice: నేను వెళ్లి ... చేయాలా?
  rationale: ప్రశ్నార్థక అవ్యయంతో కూడిన అసంపూర్ణ క్రియ దావీదు కార్యాచరణ గురించి మార్గదర్శకత్వం కోరుతున్న deliberative ప్రశ్నను వ్యక్తం చేస్తుంది.
- source_word: וְהִכֵּיתִי / וְהִכִּיתָ בַפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులపై దాడి చేయాలా? / దాడి చేసి
  rationale: נכהకు అక్షరార్థంగా ‘కొట్టు’ అనే భావం ఉన్నా, ఈ సైనిక సందర్భంలో ‘దాడి చేయు’ సహజంగా ఉంటుంది; ‘ఓడించు’ అని అనువదిస్తే ఫలితాన్ని ముందుగానే నిర్ధారించినట్లవుతుంది. ప్రశ్నలోనూ జవాబులోనూ ఒకే పదబంధాన్ని ఉంచడం మూలంలోని పునరుక్తిని కాపాడుతుంది.
- source_word: הָאֵלֶּה
  choice: ఈ
  rationale: నిర్దిష్టంగా అక్కడున్న ఫిలిష్తీయ దండును సూచించే demonstrativeను నిలుపుతుంది.
- source_word: וְהוֹשַׁעְתָּ
  choice: రక్షించు
  rationale: ישע ఇక్కడ శత్రువుల ప్రమాదం నుంచి పట్టణాన్ని కాపాడడం లేదా విడిపించడం అనే సైనిక భావంలో ఉంది; ‘రక్షించు’ సంక్షిప్తమైన, సహజమైన ప్రధాన పాఠ్య రూపం.
- source_word: קְעִילָה
  choice: కెయీలా
  rationale: హీబ్రూ స్థలనామాన్ని ఆధునిక తెలుగు లిపిలో ధ్వన్యనుకరణగా అందిస్తుంది.
theological_decisions:
- issue: దేవుని నామమైన יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం సాధారణ బిరుదును కాక నాలుగు హీబ్రూ అక్షరాలతో ఉన్న ప్రత్యేక నామాన్ని ఉపయోగిస్తుంది; ‘యాహ్వే’ దాన్ని వ్యక్తినామంగానే కాపాడుతుంది.
- issue: וְהוֹשַׁעְתָּ యొక్క భావపరిధి
  choice: రక్షించు
  alternative: విడిపించు
  rationale: ఈ సందర్భం ఆధ్యాత్మిక రక్షణను మాత్రమే సూచించదు; ఫిలిష్తీయుల ముప్పు నుంచి కెయీలా పట్టణాన్ని కాపాడడం లేదా విడిపించడం రెండూ పదార్థ పరిధిలో ఉన్నాయి. ప్రధాన పాఠ్యంలో సహజమైన ‘రక్షించు’ను ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘దెబ్బకొట్టు’ అనే అసహజ అక్షరానువాదాన్నీ, ఫలితాన్ని అతిగా నిర్ధారించే ‘ఓడించు’నూ నివారించి ‘దాడి చేయు’ను ఎంచుకున్నాం. మూలంలోని ప్రశ్న–జవాబు పదపునరుక్తి నిలుపబడింది.
