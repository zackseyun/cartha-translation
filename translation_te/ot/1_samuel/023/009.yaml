  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּ֣י עָלָ֔י/ו שָׁא֖וּל מַחֲרִ֣ישׁ הָ/רָעָ֑ה וַ/יֹּ֨אמֶר֙ אֶל אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן הַגִּ֖ישָׁ/ה הָ/אֵפֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
translation:
  language: te
  text: 'సౌలు దావీదుకు హాని చేయాలని రహస్యంగా కుట్ర పన్నుతున్నాడని[a] దావీదు తెలుసుకున్నప్పుడు, అతడు అబ్యాతారు యాజకునితో ఇలా అన్నాడు: “ఏఫోదును[b] తీసుకురా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దావీదుకు కీడు తలపెడుతున్నాడని.”
    reason: lexical_alternative
  - marker: b
    text: ఈ కథన సందర్భంలో ఏఫోదు దేవుని మార్గదర్శకత్వం కోరడానికి సంబంధించిన యాజక వస్తువు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  choice: తెలుసుకున్నప్పుడు
  rationale: కథనంలో దావీదుకు ఆ సమయంలో విషయం తెలిసినట్లు సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: כִּי
  choice: అని
  rationale: దావీదు తెలుసుకున్న విషయాన్ని పరిచయం చేసే తెలుగు పూరకార్థక రూపం.
- source_word: עָלָיו
  choice: తనకు
  rationale: సందర్భంలో సౌలు దావీదుకు విరోధంగా హాని తలపెడుతున్నాడనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַחֲרִישׁ
  choice: రహస్యంగా పన్నాగం పన్నుతున్నాడని
  rationale: హిఫీల్ కృదంతంలోని రహస్యంగా యోచించడం లేదా కుట్ర పన్నడం అనే కొనసాగుతున్న చర్యను స్పష్టంగా అందిస్తుంది.
- source_word: הָרָעָה
  choice: హాని చేయడానికి
  rationale: ఇక్కడ ఉద్దేశించబడినది దావీదుకు కలిగించబోయే కీడు; ‘హాని’ సందర్భానికి సహజంగా సరిపోతూ నైతిక భావాన్ని అనవసరంగా అతిశయింపజేయదు.
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  choice: యాజకుడైన అబ్యాతారుతో
  rationale: అబ్యాతారు ఎవరో అతని యాజక పదవితో గుర్తిస్తూ నివేదిత సంభాషణను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַגִּישָׁה
  choice: ఇక్కడికి తీసుకురా
  rationale: దగ్గరకు తీసుకురమ్మనే హిఫీల్ ఆజ్ఞార్థక బలాన్ని సహజమైన ప్రత్యక్ష సంభాషణగా అందిస్తుంది.
- source_word: הָאֵפוֹד
  choice: ఏఫోదు
  rationale: నిర్దిష్టమైన యాజక సంబంధిత వస్త్రం లేదా వస్తువును సూచించే స్థిరమైన లిప్యంతరీకరణ; సాధారణ పదంతో అనువదిస్తే దాని ప్రత్యేకత పోతుంది.
theological_decisions:
- issue: מַחֲרִישׁ הָרָעָה లో సౌలు ఉద్దేశ స్వభావం
  choice: సౌలు దావీదుకు హాని చేయడానికి రహస్యంగా పన్నాగం పన్నుతున్నాడు
  alternative: సౌలు దావీదుకు కీడు తలపెడుతున్నాడు
  rationale: హీబ్రూ పదబంధం రహస్యమైన శత్రుత్వ యోచనను సూచిస్తుంది. ‘హాని’ తక్షణ ప్రమాదాన్ని స్పష్టంగా చూపుతుంది; [a]లో విస్తృతమైన ‘కీడు’ ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పన్నాగం పన్ను’ రహస్య కుట్ర భావాన్ని స్పష్టంగా ఉంచుతుంది; ‘ఏఫోదు’ అనే ప్రత్యేక పదాన్ని నిలిపి, దాని సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
