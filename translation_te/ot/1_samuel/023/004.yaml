  text: וַ/יּ֨וֹסֶף ע֤וֹד דָּוִד֙ לִ/שְׁאֹ֣ל בַּֽ/יהוָ֔ה וַֽ/יַּעֲנֵ֖/הוּ יְהוָ֑ה וַ/יֹּ֗אמֶר ק֚וּם רֵ֣ד קְעִילָ֔ה כִּֽי אֲנִ֥י נֹתֵ֛ן אֶת פְּלִשְׁתִּ֖ים בְּ/יָדֶֽ/ךָס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/004.yaml
  text: David again inquired of the LORD, and the LORD answered him and said, “Rise, go down to Keilah, for I am giving the Philistines into your hand.”
translation:
  language: te
  text: 'దావీదు మళ్లీ యెహోవాను అడిగాడు. యెహోవా అతనికి జవాబిచ్చి ఇలా అన్నాడు: “లేచి కెయీలాకు దిగివెళ్లు; ఎందుకంటే నేను ఫిలిష్తీయులను నీ చేతికి అప్పగిస్తున్నాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁאֹל בַּיהוָה
  choice: యెహోవాను విచారించాడు
  rationale: దైవ మార్గదర్శనం కోసం అడగడాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలపాఠంలోని దేవుని వ్యక్తిగత నామమైన టెట్రాగ్రామటన్‌ను బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన రూపంలో నిలుపుతుంది.
- source_word: קוּם רֵד
  choice: లేచి ... దిగివెళ్లు
  rationale: రెండు హీబ్రూ ఆజ్ఞారూపాల బలాన్ని, కెయీలా వైపు దిగివెళ్లే దిశను నిలుపుతుంది.
- source_word: נֹתֵן
  choice: అప్పగిస్తున్నాను
  rationale: హీబ్రూ క్రియారూపంలోని సమీప భవిష్యత్తు నిశ్చయాన్ని వర్తమాన ప్రగతిశీల రూపంతో సహజంగా తెలియజేస్తుంది.
- source_word: בְּיָדֶךָ
  choice: నీ చేతికి
  rationale: విజయం కోసం శత్రువును ఒకరి అధికారానికి అప్పగించడం అనే హీబ్రూ రూపకాన్ని తెలుగులోనూ నిలుపుతుంది.
theological_decisions:
- issue: దైవ నామం יהוה ప్రతినిధానం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాక దేవుని వ్యక్తిగత నామం ఉంది; అందువల్ల ఆ భేదాన్ని అనువాదంలో నిలిపాం.
- issue: దేవుని వాగ్దానంలోని కాలభావం
  choice: నేను ... అప్పగిస్తున్నాను
  alternative: నేను ... అప్పగిస్తాను
  rationale: נֹתֵן అనే పార్టిసిపిల్ వాగ్దానాన్ని ఇప్పటికే నిశ్చయంగా అమలవుతున్న కార్యంలా చూపుతుంది; దానిని అతిగా సాధారణ భవిష్యత్తుగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే రాజవృత్తాంతానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. మూలంలోని పునరుక్తి, ఆజ్ఞలు, ‘చేతికి అప్పగించడం’ అనే రూపకం నిలుపబడ్డాయి.
