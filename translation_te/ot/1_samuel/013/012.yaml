  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמַ֗ר עַ֠תָּה יֵרְד֨וּ פְלִשְׁתִּ֤ים אֵלַ/י֙ הַ/גִּלְגָּ֔ל וּ/פְנֵ֥י יְהוָ֖ה לֹ֣א חִלִּ֑יתִי וָֽ/אֶתְאַפַּ֔ק וָ/אַעֲלֶ֖ה הָ/עֹלָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
translation:
  language: te
  text: 'నేను ఇలా అన్నాను: “ఇప్పుడు ఫిలిష్తీయులు గిల్గాలులో నా మీదికి దిగివస్తారు; యాహ్వే అనుగ్రహం కోసం నేను వేడుకోలేదు[a].” కాబట్టి నన్ను నేనే బలవంతపరచుకొని[b] దహనబలి అర్పించాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “యాహ్వే ముఖాన్ని నేను వేడుకోలేదు.” ఇది ఆయన అనుగ్రహం కోసం వేడుకోవడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నన్ను నేను అదుపుచేసుకొని.” హీబ్రూ క్రియకు తనను తాను నిగ్రహించుకోవడం లేదా ఒక పని చేయడానికి తనను తాను బలవంతపరచుకోవడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: అందుచేత నేను … అనుకున్నాను
  rationale: వావ్-క్రమరూపం సౌలు చెప్పే కారణానుసారమైన కథనాన్ని ముందుకు తీసుకెళ్తుంది. ఇక్కడ అతడు తనలో తాను చేసిన ఆలోచనను ఉటంకిస్తున్నందున ‘అనుకున్నాను’ సహజమైన ఆధునిక తెలుగు.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: సౌలు భావించిన తక్షణ ప్రమాదాన్ని సూచించే కాలవాచకం.
- source_word: יֵרְדוּ
  choice: దిగివస్తారు
  rationale: ירד అనే క్రియలోని ‘దిగడం’ అనే దిశార్థాన్ని, సౌలు ఉన్న స్థలంవైపు శత్రువుల కదలికను నిలుపుతుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ప్రజావర్గానికి ప్రామాణిక తెలుగు రూపం.
- source_word: אֵלַי
  choice: నా మీదికి
  rationale: అక్షరార్థంగా ‘నా వైపుకు’; సైనిక సందర్భంలో శత్రుత్వ కదలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַגִּלְגָּל
  choice: గిల్గాలులో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, ఎదురుదాడి జరుగుతుందని సౌలు భావించిన ప్రదేశాన్ని సూచిస్తుంది.
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: యాహ్వే అనుగ్రహం కోసం నేను వేడుకోలేదు
  rationale: ‘ముఖాన్ని వేడుకోవడం’ అనే హీబ్రూ నుడికారానికి అనుగ్రహం కోరడం అనే భావం ఉంది; తెలుగులో అర్థవంతంగా, సహజంగా వ్యక్తం చేయబడింది.
- source_word: וָאֶתְאַפַּק
  choice: నన్ను నేనే బలవంతపరచుకొని
  rationale: హిత్పయేల్ రూపం తనను తాను అదుపుచేసుకోవడం లేదా అయిష్టంగానే చర్యకు పురికొల్పుకోవడం అనే భావాలను అనుమతిస్తుంది. సందర్భంలో సౌలు ఒత్తిడివల్ల పని చేశానని సమర్థించుకుంటున్నందున ఈ రూపం సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וָאַעֲלֶה הָעֹלָה
  choice: దహనబలి అర్పించాను
  rationale: עלה మరియు עולה కలయికలోని బలిసంబంధమైన స్థిరార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలో ఉన్న నాలుగు అక్షరాల దైవనామాన్ని బిరుదుతో మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- issue: וָאֶתְאַפַּקలో సౌలు చర్య స్వభావం
  choice: నన్ను నేనే బలవంతపరచుకొని
  alternative: నన్ను నేను అదుపుచేసుకొని
  rationale: ఈ క్రియలో రెండు భావసాధ్యతలు ఉన్నాయి. సందర్భం సౌలు తన చర్యను ఒత్తిడికి లోనై చేసినదిగా సమర్థించుకుంటున్నట్లు సూచిస్తున్నా, ‘అదుపుచేసుకున్నాను’ అనే నిజమైన పదసాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. హీబ్రూ దిశార్థం, బలి పదజాలం, క్రియలోని నిజమైన సందిగ్ధతను సాధ్యమైనంతవరకు నిలుపుకున్నాం. పాదసూచిక సూచికలను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
