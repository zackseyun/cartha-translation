translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి వాడబడింది. సౌలు చెప్పే కారణాల వరుస తెలుగులో సహజంగా ఉండేందుకు చివర ‘అందుకే—’ ఉంచి, వాక్యం తదుపరి వచనంలో కొనసాగుతుందనే నిర్మాణాన్ని నిలుపుకున్నాం. ఇచ్చిన ఆంగ్ల సంప్రదింపుపాఠ్యంలో [a] గుర్తు స్థానం దాని పాదసూచిక విషయంతో సరిపోలకపోవడంతో, దాన్ని נֶאֱסָפִים కు సంబంధించిన ‘సమకూడుతుండడం’ వద్ద ఉంచాం.
