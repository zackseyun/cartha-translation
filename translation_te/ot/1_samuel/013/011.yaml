  edition: WLC
  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל מֶ֣ה עָשִׂ֑יתָ וַ/יֹּ֣אמֶר שָׁא֡וּל כִּֽי רָאִיתִי֩ כִֽי נָפַ֨ץ הָ/עָ֜ם מֵ/עָלַ֗/י וְ/אַתָּה֙ לֹא בָ֨אתָ֙ לְ/מוֹעֵ֣ד הַ/יָּמִ֔ים וּ/פְלִשְׁתִּ֖ים נֶאֱסָפִ֥ים מִכְמָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/011.yaml
  text: Then Samuel said[a], “What have you done?” And Saul said, “Because I saw that the people were scattering from me, and you had not come at the appointed time[b], and the Philistines were gathering at Michmash,”
translation:
  language: te
  text: 'అప్పుడు సమూయేలు, “నీవు ఏమి చేశావు?” అని అడిగాడు. సౌలు ఇలా అన్నాడు: “ఎందుకంటే, ప్రజలు నన్ను విడిచి చెదరిపోతున్నారని, నిర్ణయించిన సమయానికి[b] నీవు రాలేదని, ఫిలిష్తీయులు మిక్మాషులో సమకూడుతున్నారని[a] నేను చూశాను;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మిక్మాషులో కూడివస్తున్నారని.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో “రోజుల నిర్ణయించిన సమయానికి”; ఇది బహుశా ముందుగా అంగీకరించిన కాలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: నీవు చేసిన పని ఏమిటి?
  rationale: సమూయేలు పూర్తయిన చర్యను తీవ్రంగా ప్రశ్నిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כִּי רָאִיתִי
  choice: నేను చూశాను
  rationale: כִּי ఇక్కడ సౌలు తన చర్యకు కారణం వివరించే వాక్యాన్ని ప్రారంభిస్తుంది; తెలుగులో కారణాల జాబితా తరువాత ‘అందుకే’ ఉంచడం సహజంగా ఉంటుంది. רָאִיתִי ప్రత్యక్షంగా గమనించడం లేదా పరిస్థితిని గ్రహించడం రెండింటినీ మోయగల సాధారణ ‘చూశాను’గా అనువదించబడింది.
- source_word: נָפַץ הָעָם מֵעָלַי
  choice: ప్రజలు నన్ను విడిచి చెదరిపోతుండడం
  rationale: సైనికులు విడివిడిగా వెళ్లిపోవడాన్నీ, సౌలు తన మద్దతును కోల్పోతున్న దృక్కోణాన్నీ వ్యక్తం చేస్తుంది.
- source_word: לֹא בָאתָ
  choice: నీవు రాకపోవడం
  rationale: సౌలు గమనించిన కారణాల సమాంతర జాబితాలో సహజంగా సరిపోతుంది; అతడు ఎదురుచూసిన రాక జరగలేదనే భావాన్ని కాపాడుతుంది.
- source_word: לְמוֹעֵד הַיָּמִים
  choice: నిర్ణయించిన రోజుల సమయానికి
  rationale: ‘నిర్ణయించిన సమయం’ అనే భావంతో పాటు హీబ్రూ పదబంధంలోని ‘రోజులు’ అనే అంశాన్నీ ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: נֶאֱסָפִים
  choice: సమకూడుతుండడం
  rationale: నిఫాల్ కృదంతంలోని కొనసాగుతున్న లేదా అభివృద్ధి చెందుతున్న సమీకరణ భావాన్ని తెలియజేస్తుంది.
- source_word: מִכְמָשׂ
  choice: మిక్మాషులో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ప్రతిలిపి చేసి, సందర్భానికి తగిన స్థలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
