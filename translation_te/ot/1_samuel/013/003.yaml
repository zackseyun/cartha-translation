  text: וַ/יַּ֣ךְ יוֹנָתָ֗ן אֵ֣ת נְצִ֤יב פְּלִשְׁתִּים֙ אֲשֶׁ֣ר בְּ/גֶ֔בַע וַֽ/יִּשְׁמְע֖וּ פְּלִשְׁתִּ֑ים וְ/שָׁאוּל֩ תָּקַ֨ע בַּ/שּׁוֹפָ֤ר בְּ/כָל הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר יִשְׁמְע֖וּ הָ/עִבְרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
translation:
  language: te
  text: యోనాతాను గెబాలో ఉన్న ఫిలిష్తీయుల సైనిక స్థావరంపై[a] దాడి చేశాడు. ఆ సంగతి ఫిలిష్తీయులకు తెలిసింది. అప్పుడు సౌలు దేశమంతటా పొట్టేలు కొమ్ముతో చేసిన బూరను[b] ఊదుతూ, “హెబ్రీయులు వినాలి!” అని ప్రకటించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫిలిష్తీయుల అధికారి.” హీబ్రూ పదం ఒక అధికారిని గానీ, అక్కడ నెలకొల్పిన సైనిక స్థావరాన్ని గానీ సూచించవచ్చు. ఈ యుద్ధ సందర్భంలో “సైనిక స్థావరం” బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కొమ్ము బూరను.” హీబ్రూ షోఫార్ అనేది ప్రత్యేకంగా జంతువు కొమ్ముతో, సంప్రదాయకంగా పొట్టేలు కొమ్ముతో చేసిన బూర.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: హతమార్చాడు
  rationale: נכה అనే క్రియ కొట్టడం లేదా యుద్ధంలో దెబ్బతీయడం అనే భావాన్ని ఇస్తుంది. ఇక్కడ సైనిక స్థావరం కర్మగా ఉన్నందున, నిర్ణాయకమైన సైనిక దాడిని సహజమైన తెలుగులో తెలియజేస్తుంది; ప్రతి వ్యక్తి చంపబడ్డాడని తప్పనిసరిగా నిర్ధారించదు.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల సైనిక స్థావరం
  rationale: נְצִיב అనే పదం నియమించబడిన అధికారి లేదా నెలకొల్పబడిన సైనిక స్థావరం అనే రెండు అర్థాలను ఇవ్వగలదు. పరిసర సైనిక సందర్భంలో ‘సైనిక స్థావరం’ ప్రధాన పాఠ్యానికి తగినది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּגֶבַע
  choice: గెబాలో
  rationale: గెబా స్థలనామాన్ని నేరుగా లిప్యంతరీకరించి, తెలుగు స్థానవాచక విభక్తితో సహజంగా ఇచ్చాం.
- source_word: וַיִּשְׁמְעוּ פְּלִשְׁתִּים
  choice: ఆ సంగతి ఫిలిష్తీయులకు తెలిసింది
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఫిలిష్తీయులు విన్నారు.’ సందర్భంలో ముందటి దాడి వార్త తెలిసిందనే అంతర్నిహిత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תָּקַע בַּשּׁוֹפָר
  choice: పొట్టేలు కొమ్ము బూరను ఊదించాడు
  rationale: שׁוֹפָר లోహపు బాకా కాకుండా సాధారణంగా పొట్టేలు కొమ్ముతో చేసిన బూర. సౌలు దేశమంతటా ప్రకటన చేయించిన భావాన్ని తెలుగు ప్రయోజక రూపం సహజంగా తెలియజేస్తుంది.
- source_word: בְּכָל הָאָרֶץ
  choice: దేశమంతటా
  rationale: ఇక్కడ אֶרֶץ భూమి మొత్తాన్ని కాక దేశం లేదా ప్రాంతాన్ని సూచిస్తుంది. ‘దేశమంతటా’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: לֵאמֹר
  choice: అని ప్రకటించాడు
  rationale: ప్రత్యక్ష ఉక్తిని పరిచయం చేసే לֵאמֹר ను సందర్భానుగుణంగా ప్రజా ప్రకటన భావంతో అనువదించాం.
- source_word: יִשְׁמְעוּ הָעִבְרִים
  choice: హెబ్రీయులు వినాలి!
  rationale: అసంపూర్ణ క్రియ ఇక్కడ ఆజ్ఞార్థక లేదా పిలుపు భావంలో ఉంది. ‘వినాలి’ ప్రజలకు చేరవలసిన అత్యవసర ప్రకటనను తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘హెబ్రీయులు’ అనే మూలపదాన్ని ‘ఇశ్రాయేలీయులు’గా మార్చలేదు.
