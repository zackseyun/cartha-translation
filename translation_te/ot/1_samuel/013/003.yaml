translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక కథనానికి తగిన గంభీరతతో రూపొందించాం. వివాదాస్పదమైన נְצִיב అర్థాన్ని ప్రధాన పాఠ్యంలో సైనిక సందర్భానుసారం ఇచ్చి, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
