source:
  edition: WLC
  text: וַ/יֵּרְד֥וּ כָל יִשְׂרָאֵ֖ל הַ/פְּלִשְׁתִּ֑ים לִ֠/לְטוֹשׁ אִ֣ישׁ אֶת מַחֲרַשְׁתּ֤/וֹ וְ/אֶת אֵת/וֹ֙ וְ/אֶת קַרְדֻּמּ֔/וֹ וְ/אֵ֖ת מַחֲרֵשָׁתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/020.yaml
  text: So all Israel went down to the Philistines[a], each man to sharpen his plowshare, his mattock, his axe, and his sickle.
translation:
  language: te
  text: కాబట్టి ఇశ్రాయేలీయులందరూ తమ తమ నాగలి మొనను, గడ్డపారను, గొడ్డలిని, కొడవలిని[a] పదును పెట్టించుకోవడానికి ఫిలిష్తీయుల వద్దకు దిగివెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాగలికి అమర్చే కోయు కత్తి’ లేదా మరొక దున్నే పనిముట్టు; ఇక్కడి హీబ్రూ పదం అర్థం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: వెళ్లారు
  rationale: ירד లోని దిగువకు వెళ్లే భావం ఇక్కడ సందర్భంలో భౌగోళిక లేదా సాధారణ గమనాన్ని సూచించవచ్చు. సహజమైన ఆధునిక తెలుగులో ‘వెళ్లారు’ అనడం స్పష్టంగా ఉంటుంది; ‘దిగివెళ్లారు’ అనడం సందర్భం నిర్ధారించని భౌగోళిక దిశను అధికంగా ముందుకు తెస్తుంది.
- source_word: כָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: సమూహవాచకమైన ‘ఇశ్రాయేలు అంతా’ అనే భావాన్ని సాధారణ తెలుగు పాఠకులకు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַפְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల దగ్గరికి
  rationale: హీబ్రూ ప్రజాసమూహాన్నే గమ్యంగా పేర్కొంటుంది; ‘కమ్మరుల దగ్గరికి’ అని పాఠ్యంలో లేని సమాచారాన్ని చేర్చకుండా, తెలుగులో సహజమైన గమ్యరూపం వాడబడింది.
- source_word: לִלְטוֹשׁ
  choice: పదును పెట్టించుకోవడానికి
  rationale: לטש ఇక్కడ లోహపు పనిముట్లకు పదును పెట్టడాన్ని సూచిస్తుంది. పనిని ఫిలిష్తీయులు చేస్తారనే సందర్భార్థాన్ని తెలుగులో సహజమైన ప్రయోజక-ఆత్మార్థక రూపం తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: తమ … పెట్టించుకోవడానికి
  rationale: సమూహకర్త తర్వాతి పంపిణీ భావమైన ‘ఒక్కొక్కరు తమది’ అనేది తెలుగులో ‘ఇశ్రాయేలీయులందరూ తమ…’ అనే నిర్మాణంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: מַחֲרַשְׁתּוֹ
  choice: తమ నాగలికర్రును
  rationale: మొదటి వ్యవసాయ పరికరం దున్నే పనికి సంబంధించిన నాగలి భాగాన్ని సూచిస్తుంది. ‘నాగలికర్రు’ సాధారణ పాఠకులకు అర్థమయ్యే తెలుగు సమానం.
- source_word: אֵתוֹ
  choice: గడ్డపారను
  rationale: את తవ్వడానికి లేదా నేలను కొట్టడానికి ఉపయోగించే పనిముట్టును సూచిస్తుంది; ‘గడ్డపార’ ఈ సందర్భంలో సహజమైన వ్యవసాయ పదం.
- source_word: קַרְדֻּמּוֹ
  choice: గొడ్డలిని
  rationale: కోయడానికి ఉపయోగించే గొడ్డలి తరహా పరికరానికి ఇది నేరమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: מַחֲרֵשָׁתוֹ
  choice: కొడవలిని
  rationale: చివరి పరికరపదం అర్థం అనిశ్చితం. జాబితాలో ముందున్న దున్నే పరికరాన్ని పునరావృతం చేయకుండా, పదును పెట్టే వ్యవసాయ పరికరంగా ‘కొడవలి’ సందర్భోచితమైన సాధ్యమైన అనువాదం; అనిశ్చితి పాదసూచికలో నిలుపబడింది.
