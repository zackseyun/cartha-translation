  text: సౌలు రాజైనప్పుడు అతనికి ఒక సంవత్సరం వయసు[a]. అతడు ఇశ్రాయేలుమీద రెండు సంవత్సరాలు రాజుగా పరిపాలించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పాఠం క్లిష్టంగా ఉంది; అందులో కొన్ని సంఖ్యలు లుప్తమై ఉండవచ్చు. అక్షరార్థంగా, “సౌలు రాజైనప్పుడు ఒక సంవత్సరం వయసుగలవాడు; అతడు ఇశ్రాయేలుమీద రెండు సంవత్సరాలు రాజుగా పరిపాలించాడు” అని ఉంది. కొన్ని ప్రాచీన పాఠసాక్ష్యాలు, తరువాతి ప్రతిపాదనలు సౌలు వయసుకు “ముప్పై,” అతని పరిపాలన కాలానికి “నలభై రెండు” వంటి పెద్ద సంఖ్యలను సూచిస్తాయి.
    reason: textual_variant
