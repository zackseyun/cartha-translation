  rationale: అందించిన మూలం WLC మసొరా పాఠం. దాని వాక్యం చారిత్రకంగా, పాఠవిమర్శాపరంగా క్లిష్టమైనదైనా, నిర్ధారణలేని సంఖ్యలను ప్రధాన పాఠంలో చేర్చడం కంటే అందుబాటులో ఉన్న హీబ్రూ పాఠాన్ని అనువదించి, ముఖ్యమైన సమస్యను పాదటిప్పణిలో పారదర్శకంగా తెలియజేయడం సముచితం.
