- source_word: מָלַךְ
  choice: రాజుగా పరిపాలించాడు
  rationale: מלך అనే క్రియకు ఇక్కడ ‘రాజుగా పాలించాడు’ అనే భావం; తెలుగులో సహజంగా ఉండేందుకు ‘రాజుగా పరిపాలించాడు’ అని ఇచ్చాం.
- source_word: עַל יִשְׂרָאֵל
