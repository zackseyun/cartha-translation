  text: וַ/יֵּצֵ֧א הַ/מַּשְׁחִ֛ית מִ/מַּחֲנֵ֥ה פְלִשְׁתִּ֖ים שְׁלֹשָׁ֣ה רָאשִׁ֑ים הָ/רֹ֨אשׁ אֶחָ֥ד יִפְנֶ֛ה אֶל דֶּ֥רֶךְ עָפְרָ֖ה אֶל אֶ֥רֶץ שׁוּעָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/017.yaml
  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
translation:
  language: te
  text: ఫిలిష్తీయుల శిబిరం నుండి దోపిడీ దండు[a] మూడు విభాగాలుగా[b] బయలుదేరింది. ఒక విభాగం ఒఫ్రాకు వెళ్లే దారి వైపు, షూయాలు దేశం వైపు దారి పట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః ‘నాశనం చేసేది’ లేదా ‘నాశక దండు’; ఇక్కడ ఫిలిష్తీయుల శిబిరం నుండి బయలుదేరిన దోపిడీ దండును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో పదశః ‘మూడు తలలు’; తరువాత ‘ఒక తల’ అని ఉంది. ఇది సైనిక దండు విభాగాలను లేదా బృందాలను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁחִית
  choice: దోపిడీ దండు
  rationale: పదశః ‘నాశనం చేసేది/నాశక దండు’; ఈ సైనిక సందర్భంలో ఫిలిష్తీయుల శిబిరం నుండి బయలుదేరిన విధ్వంసక దాడి దండును సమష్టిగా సూచిస్తుంది.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: మూడు విభాగాలుగా
  rationale: పదశః ‘మూడు తలలు’; ఇక్కడ సైనిక దండు మూడు బృందాలుగా విడిపోవడాన్ని సూచించే నుడికారం.
- source_word: הָרֹאשׁ אֶחָד
  choice: ఒక విభాగం
  rationale: ముందున్న ‘మూడు తలలు’ అనే నుడికారాన్నే ఏకవచనంలో పునరావృతం చేస్తుంది; సహజమైన తెలుగులో ఒక సైనిక విభాగాన్ని సూచిస్తుంది.
- source_word: יִפְנֶה
  choice: దారి పట్టింది
  rationale: ‘తిరుగు/ముఖం తిప్పు’ అనే భావం; ఒక దండు ఎంచుకున్న ప్రయాణ దిశను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: דֶּרֶךְ עָפְרָה
  choice: ఒఫ్రాకు వెళ్లే దారి
  rationale: ఒఫ్రా వైపు నడిపించే మార్గాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶרֶץ שׁוּעָל
  choice: షూయాలు ప్రాంతం
  rationale: אֶרֶץ ఇక్కడ భూభాగం లేదా ప్రాంతం అనే భావాన్ని ఇస్తుంది; ప్రాంతీయ నామాన్ని లిప్యంతరీకరించాం.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ప్రజాసమూహ నామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: עָפְרָה
  choice: ఒఫ్రా
  rationale: స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: שׁוּעָל
  choice: షూయాలు
  rationale: ప్రాంత నామాన్ని అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
