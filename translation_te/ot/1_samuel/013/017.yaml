  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ సమష్టివాచక ఏకవచనాన్ని ‘దోపిడీ దండు’గా ఉంచి, అది మూడు విభాగాలుగా విడిపోవడాన్ని స్పష్టంగా తెలిపాం. భౌగోళిక క్రమాన్ని మూలంలోని ‘ఒఫ్రా దారి—షూయాలు ప్రాంతం’ భావానికి అనుగుణంగా సహజ తెలుగు వాక్యక్రమంలో అమర్చాం.
