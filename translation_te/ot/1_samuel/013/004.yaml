  text: וְ/כָל יִשְׂרָאֵ֞ל שָׁמְע֣וּ לֵ/אמֹ֗ר הִכָּ֤ה שָׁאוּל֙ אֶת נְצִ֣יב פְּלִשְׁתִּ֔ים וְ/גַם נִבְאַשׁ יִשְׂרָאֵ֖ל בַּ/פְּלִשְׁתִּ֑ים וַ/יִּצָּעֲק֥וּ הָ/עָ֛ם אַחֲרֵ֥י שָׁא֖וּל הַ/גִּלְגָּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
translation:
  language: te
  text: ఇశ్రాయేలీయులందరూ, “సౌలు ఫిలిష్తీయుల సైనిక స్థావరాన్ని[a] దెబ్బతీశాడు; ఇశ్రాయేలు ఫిలిష్తీయులకు అసహ్యమైపోయింది[b]” అనే వార్త విన్నారు. అప్పుడు ప్రజలు సౌలును అనుసరించి గిల్గాలులో సమకూడమని పిలువబడ్డారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఫిలిష్తీయుల అధికారి” లేదా “ఫిలిష్తీయుల పాలకుడు”; హీబ్రూ పదం ఒక అధికారిని గానీ, సైనిక స్థావరాన్ని లేదా ముందస్తు స్థావరాన్ని గానీ సూచించవచ్చు. ఇక్కడి సైనిక సందర్భం “సైనిక స్థావరం” అనే భావానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “ఇశ్రాయేలు ఫిలిష్తీయులకు దుర్వాసనగా మారింది”; అంటే ఇశ్రాయేలు వారికి అత్యంత అసహ్యమైంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “ప్రజలు గిల్గాలులో సౌలు వెనుక సమకూర్చబడ్డారు.” హీబ్రూ మాట సౌలును అనుసరించి యుద్ధానికి ప్రజలను సమీకరించడాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ לֵאמֹר
  choice: అనే వార్త విన్నారు
  rationale: ‘విన్నారు—అని చెప్పబడగా’ అనే హీబ్రూ వార్తా సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִכָּה
  choice: దెబ్బతీశాడు
  rationale: נכה యొక్క ప్రాథమిక ‘కొట్టు/దెబ్బతీయు’ భావాన్ని నిలుపుతూ, సైనిక సందర్భంలో ఓడించాడని అవసరానికి మించి నిర్ధారించదు.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల సైనిక స్థావరం
  rationale: ఈ పదం అధికారి లేదా నెలకొల్పబడిన సైనిక స్థావరం అనే రెండు భావాలు ఇవ్వగలదు; సమీప సైనిక సందర్భం స్థావరం అనే భావానికి మద్దతిస్తుంది, అయితే ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: נִבְאַשׁ
  choice: అసహ్యమైపోయింది
  rationale: అక్షరార్థంగా దుర్వాసన కొట్టడం, రూపకాలంకారంగా అసహ్యకరంగా మారడం అనే భావం; తెలుగులో రూపకార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: בַּפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులకు
  rationale: ఇశ్రాయేలును అసహ్యంగా ఎంచిన సంబంధిత వర్గాన్ని తెలుగులో సంక్షిప్తంగా సూచిస్తుంది.
- source_word: וַיִּצָּעֲקוּ
  choice: సమకూడాలని పిలుపు అందుకున్నారు
  rationale: క్రియకు సాధారణంగా ‘కేకవేయు’ అనే అర్థమున్నా, ఈ సైనిక సందర్భంలో ప్రజలను కూడగట్టడం లేదా సమీకరించడం అనే భావం సముచితం.
- source_word: אַחֲרֵי שָׁאוּל
  choice: సౌలు వెనుక
  rationale: అక్షరార్థమైన ‘సౌలు వెనుక’ను నిలుపుతూ, అతని నాయకత్వంలో సమీకరించబడే భావాన్ని సందర్భం తెలియజేయనిస్తుంది.
- source_word: הַגִּלְגָּל
  choice: గిల్గాలులో
  rationale: సమీకరణ జరిగే ప్రదేశంగా సహజమైన తెలుగు స్థానవిభక్తిని ఉపయోగిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలి. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా వార్తా వాక్యాన్ని సహజీకరించాం; నְצִיב లోని వ్యక్తి/స్థావరం సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం. ప్రధాన వాక్యంలో అన్ని పాదటిప్పణి గుర్తులు [a], [b], [c] చేర్చబడ్డాయి.
