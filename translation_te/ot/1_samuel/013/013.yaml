id: 1SA.13.13
reference: 1 Samuel 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר שְׁמוּאֵ֛ל אֶל שָׁא֖וּל נִסְכָּ֑לְתָּ לֹ֣א שָׁמַ֗רְתָּ אֶת מִצְוַ֞ת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר צִוָּ֔/ךְ כִּ֣י עַתָּ֗ה הֵכִ֨ין יְהוָ֧ה אֶת מַֽמְלַכְתְּ/ךָ֛ אֶל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
translation:
  language: te
  text: 'అప్పుడు సమూయేలు సౌలుతో ఇలా అన్నాడు: “నీవు మూర్ఖంగా ప్రవర్తించావు.[a] నీ దేవుడైన యాహ్వే నీకు ఆజ్ఞాపించిన ఆజ్ఞను నీవు పాటించలేదు. ఎందుకంటే ఇప్పటికి యాహ్వే ఇశ్రాయేలుపై నీ రాజ్యాన్ని శాశ్వతంగా స్థిరపరచి ఉండేవాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు మూర్ఖమైన పని చేశావు.”
    reason: నిఫల్ రూపమైన נִסְכָּלְתָּ చర్యలోని మూర్ఖత్వాన్ని సూచిస్తుంది; ‘మూర్ఖంగా ప్రవర్తించావు’ మరియు ‘మూర్ఖమైన పని చేశావు’ రెండూ సాధ్యమైన అనువాదాలు.
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  choice: నీవు మూర్ఖంగా ప్రవర్తించావు
  rationale: నిఫల్ రూపం ఇక్కడ కేవలం మూర్ఖుడిగా ఉండడాన్ని కాక, మూర్ఖమైన రీతిలో వ్యవహరించడాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం సహజంగా ఆ నైతిక అంచనాను నిలుపుతుంది.
- source_word: שָׁמַרְתָּ
  choice: పాటించలేదు
  rationale: ఆజ్ఞను కాపాడడం లేదా గైకొనడం అనే నిబంధనాత్మక భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; విధేయత భావం అంతర్లీనంగా ఉంటుంది.
- source_word: מִצְוַת
  choice: ఆజ్ఞను
  rationale: ఏకవచన నిర్మాణం సందర్భంలోని నిర్దిష్ట దైవాజ్ఞను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన నామరూపంతో ప్రతిబింబిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన స్వామ్య సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: צִוָּךְ
  choice: నీకు ఆజ్ఞాపించిన
  rationale: צוה అనే క్రియలోని స్పష్టమైన ఆజ్ఞాపన భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: כִּי עַתָּה
  choice: నీవు పాటించి ఉంటే ... ఇప్పుడు
  rationale: సందర్భంలో ఈ వాక్యం సౌలు అవిధేయత వల్ల కోల్పోయిన ఫలితాన్ని సూచిస్తుంది. తెలుగులో ప్రతికల్పిత భావం స్పష్టంగా ఉండేందుకు షరతును వ్యక్తీకరించింది.
- source_word: הֵכִין
  choice: స్థిరపరచి ఉండేవాడు
  rationale: హిఫిల్ రూపంలోని దృఢపరచడం లేదా స్థాపించడం అనే భావాన్ని, సందర్భానుసారమైన ప్రతికల్పిత ఫలితంతో కలిపి అందిస్తుంది.
- source_word: מַמְלַכְתְּךָ
  choice: నీ రాజ్యాన్ని
  rationale: రాజ్యాధికారం లేదా రాజవంశ పాలన అనే భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై
  rationale: రాజ్యాన్ని స్థిరపరచడం అనే సందర్భంలో אֶל పాలనా పరిధిని సూచిస్తుంది; తెలుగులో ‘పై’ సహజమైన రూపం.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: నిరంతరమైన, అంతంలేని కాలవ్యాప్తిని గంభీరమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవ నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ఉచ్చారణ పునర్నిర్మాణంగా ‘యాహ్వే’ కూడా సాధ్యమే.
- issue: כִּי עַתָּה הֵכִין יְהוָה అనే వాక్యభాగంలోని ప్రతికల్పిత భావం
  choice: నీవు పాటించి ఉంటే, యెహోవా ఇప్పుడు ... స్థిరపరచి ఉండేవాడు
  alternative: ఎందుకంటే ఇప్పుడు యెహోవా ... స్థిరపరచాడు
  rationale: విస్తృత సందర్భం ఇది వాస్తవంగా జరిగిన స్థాపన కాదని, సౌలు అవిధేయత వల్ల కోల్పోయిన ఫలితమని చూపుతుంది. తెలుగు పాఠకునికి ఆ సందర్భార్థం స్పష్టమయ్యేలా ప్రతికల్పిత నిర్మాణాన్ని ఉపయోగించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. సంభాషణలో స్పష్టత కోసం ‘ఇలా అన్నాడు’ను ఉపయోగించగా, దైవాజ్ఞ మరియు రాజ్య స్థాపనకు తగిన అధికారిక గౌరవభావం నిలుపబడింది.
