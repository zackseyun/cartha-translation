source:
  edition: WLC
  text: וְ/הָיָה֙ בְּ/י֣וֹם מִלְחֶ֔מֶת וְ/לֹ֨א נִמְצָ֜א חֶ֤רֶב וַ/חֲנִית֙ בְּ/יַ֣ד כָּל הָ/עָ֔ם אֲשֶׁ֥ר אֶת שָׁא֖וּל וְ/אֶת יוֹנָתָ֑ן וַ/תִּמָּצֵ֣א לְ/שָׁא֔וּל וּ/לְ/יוֹנָתָ֖ן בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
translation:
  language: te
  text: యుద్ధ దినాన[a], సౌలు, యోనాతానులతో ఉన్న ప్రజల్లో ఎవరి చేతిలోనూ కత్తిగానీ ఈటెగానీ ఉండలేదు. అయితే అవి సౌలు దగ్గర, అతని కుమారుడైన యోనాతాను దగ్గర ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “యుద్ధ దినాన, ప్రజలందరి చేతిలో కత్తి, ఈటె కనిపించలేదు.” ఇక్కడి హెబ్రీ ప్రయోగం దళంలోని ఎవరి దగ్గరా అలాంటి ఆయుధాలు లేవని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם מִלְחֶמֶת
  choice: యుద్ధం జరిగిన రోజున
  rationale: ఫలితంగా ఏర్పడిన పరిస్థితిని తెలిపే హెబ్రీ కథన ప్రవాహాన్ని సహజమైన తెలుగు కాలవాచక ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: לֹא נִמְצָא
  choice: కనిపించలేదు
  rationale: מצא నిఫల్ రూపంలోని ‘దొరకలేదు/కనిపించలేదు’ అనే నిష్క్రియ భావాన్ని సహజంగా నిలుపుతుంది; ఇక్కడ ఆయుధాలు ఎవరి వద్దా లేవనే భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: חֶרֶב וַחֲנִית
  choice: కత్తిగానీ ఈటెగానీ
  rationale: మూలంలో సంధి ‘మరియు’ అయినా, నిషేధ వాక్యంలో తెలుగు ‘గానీ...గానీ’ ప్రయోగం రెండింటిలో ఏదీ లేదనే పంపిణీ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּיַד כָּל הָעָם
  choice: ప్రజల్లో ఎవరి చేతిలోనూ
  rationale: ‘చేతిలో’ అనే మూల రూపకాన్ని నిలుపుతూ, నిషేధ పరిధిలో כָּל కు ఉన్న ‘ఎవరి...నూ’ అనే పంపిణీ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר אֶת שָׁאוּל וְאֶת יוֹנָתָן
  choice: సౌలు, యోనాతానులతో ఉన్న
  rationale: ఇక్కడ אֶת సహవాసాన్ని సూచించే అసంపూర్ణ నిర్మాణం; ఇద్దరితో ఉన్న దళాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַתִּמָּצֵא לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ
  choice: అయితే సౌలు దగ్గర, అతని కుమారుడు యోనాతాను దగ్గర అవి ఉన్నాయి
  rationale: స్త్రీలింగ ఏకవచన క్రియ ఆయుధ జతను సమష్టిగా తిరిగి సూచిస్తుంది. తెలుగులో బహువచన సూచన ‘అవి’తో స్వాధీనత/అందుబాటును స్పష్టంగా, సహజంగా వ్యక్తం చేసింది.
