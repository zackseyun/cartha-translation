  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘చేతిలో’ అనే హెబ్రీ స్వాధీనతా రూపకాన్ని నిలిపి, నిషేధాన్ని సహజమైన ‘గానీ...గానీ’, ‘ఎవరి...నూ’ నిర్మాణాలతో వ్యక్తం చేశాం.
