  source_fidelity: 'మూల హెబ్రీ భావాన్ని ముసాయిదా ప్రధానంగా సరిగ్గా తెలియజేస్తోంది: యుద్ధ సమయానికి సౌలు, యోనాతానులతో ఉన్న వారిలో ఎవరికీ కత్తి లేదా ఈటె లేదు; ఆ ఆయుధాలు సౌలుకు, అతని కుమారుడైన యోనాతానుకు మాత్రమే ఉన్నాయి. అయితే “యుద్ధం జరిగిన రోజున” అనే రూపం యుద్ధం ఇప్పటికే జరిగిపోయిందనే స్వల్ప సూచన ఇవ్వవచ్చు; బְּיוֹם מִלְחֶמֶת‌కు “యుద్ధ దినాన” మరింత నేరమైనది. “కనిపించలేదు” కూడా దృశ్యమానతను సూచించగలదు; సందర్భంలోని స్వాధీనత భావానికి “ఉండలేదు” స్పష్టమైనది.'
