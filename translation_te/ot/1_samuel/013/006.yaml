source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֤ל רָאוּ֙ כִּ֣י צַר ל֔/וֹ כִּ֥י נִגַּ֖שׂ הָ/עָ֑ם וַ/יִּֽתְחַבְּא֣וּ הָ/עָ֗ם בַּ/מְּעָר֤וֹת וּ/בַֽ/חֲוָחִים֙ וּ/בַ/סְּלָעִ֔ים וּ/בַ/צְּרִחִ֖ים וּ/בַ/בֹּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
translation:
  language: te
  text: ప్రజలు తీవ్ర ఒత్తిడికి గురై ఉండడంతో, ఇశ్రాయేలు పురుషులు తాము ఆపదలో ఉన్నారని చూశారు. అప్పుడు వారు గుహల్లో, ముళ్ల పొదల్లో[a], బండల మధ్య, భూగర్భ గదుల్లో[b], గోతుల్లో[c] దాక్కున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దట్టమైన పొదల్లో.” హీబ్రూ పదం అరుదైనది; ప్రత్యేకంగా ముళ్లతో కూడిన పొదలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రంధ్రాల్లో” లేదా “కోటలాంటి ఆశ్రయాల్లో.” హీబ్రూ పదం అరుదైనది, దాని ఖచ్చితమైన అర్థం అనిశ్చితం; నేలకింద దాక్కునే ప్రదేశాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నీటి తొట్లలో” లేదా “బావుల్లో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: ఏకవచన రూపంలోని אִישׁ ఇక్కడ బహువచన క్రియతో సామూహికంగా వాడబడింది; పురుషులను సూచించే భావాన్ని నిలుపుతూ తెలుగులో సహజమైన బహువచనంగా అనువదించబడింది.
- source_word: רָאוּ
  choice: చూశారు
  rationale: మూలపదంలోని ప్రత్యక్ష గ్రహణ భావాన్ని నిలుపుతుంది; సందర్భంలో తమ పరిస్థితిని గుర్తించారనే భావం కూడా సహజంగా వస్తుంది.
- source_word: כִּי צַר לוֹ
  choice: తాము ఆపదలో ఉన్నామని
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా, సామూహిక కర్తతో ఏకవచన సూచన కలిగి ఉంది. తెలుగులో సామూహిక భావాన్ని సహజంగా వ్యక్తం చేస్తూ కష్టస్థితిని సూచిస్తుంది.
- source_word: כִּי נִגַּשׂ הָעָם
  choice: ప్రజలు తీవ్ర ఒత్తిడికి గురయ్యారు
  rationale: నిఫాల్ రూపం నొక్కిపెట్టబడటం, ఇబ్బందికి గురికావటం అనే భావాన్ని ఇస్తుంది; యుద్ధసందర్భంలోని తీవ్రమైన ఒత్తిడిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּתְחַבְּאוּ
  choice: దాక్కున్నారు
  rationale: హిత్పయేల్ రూపంలోని ఆత్మార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בַּמְּעָרוֹת
  choice: గుహల్లో
  rationale: מְעָרָה పదానికి సూటిగా, సాధారణంగా అర్థమయ్యే సమానార్థకం.
- source_word: וּבַחֲוָחִים
  choice: ముళ్ల పొదల్లో
  rationale: అరుదైన పదం ముళ్లతో కూడిన పొదలు లేదా దట్టమైన వృక్షావరణాన్ని సూచించే అవకాశం ఉంది; ఈ ఎంపిక సాధ్యమైన నిర్దిష్ట భావాన్ని పాఠ్యంలో ఉంచుతుంది.
- source_word: וּבַסְּלָעִים
  choice: బండల మధ్య
  rationale: סֶלַע బండ, శిల, కొండచరియ అనే పరిధి కలిగి ఉంది; దాక్కునే ప్రదేశాల జాబితాలో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: וּבַצְּרִחִים
  choice: భూగర్భ గదుల్లో
  rationale: అత్యంత అరుదైన ఈ పదం నేలకింద నిల్వగదులు, గుహాకార గదులు లేదా రంధ్రాలను సూచించవచ్చు. తరువాతి בֹּרוֹת నుండి వేరుగా ఉంచుతూ సాధ్యమైన అర్థాన్ని ఇస్తుంది; అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
- source_word: וּבַבֹּרוֹת
  choice: గోతుల్లో
  rationale: בּוֹר గోతులు, నీటి తొట్లు లేదా బావుల వంటి తవ్విన ప్రదేశాలను సూచించగలదు; సందర్భానికి అవసరమైన విస్తృత భావాన్ని 'గోతులు' నిలుపుతుంది.
