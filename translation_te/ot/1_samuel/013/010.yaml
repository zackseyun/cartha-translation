  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
translation:
  language: te
  text: అతడు దహనబలిని అర్పించడం ముగించగానే, ఇదిగో, సమూయేలు వచ్చాడు. అప్పుడు సౌలు సమూయేలును కలవడానికి, అతనిని ఆశీర్వదించడానికి[a] బయటికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అభివాదం చేయడానికి.” హీబ్రూ క్రియకు అక్షరార్థంగా “ఆశీర్వదించడం” అని అర్థం; అయితే ఒకరిని కలుసుకునే ఈ సందర్భంలో అది మర్యాదపూర్వకంగా పలకరించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ముగించగానే … వచ్చాడు
  rationale: హీబ్రూ కథనాన్ని కొనసాగించే וַיְהִיని తెలుగులో విడిగా ‘జరిగింది’ అని అనడం కంటే, తరువాతి కాలవాచక వాక్యంతో సహజంగా వ్యక్తం చేశాం.
- source_word: כְּכַלֹּתוֹ
  choice: అతడు … ముగించగానే
  rationale: כְּ + infinitive construct పూర్తయిన వెంటనే జరిగిన కాలక్రమాన్ని సూచిస్తుంది; ‘ముగించగానే’ ఆ తక్షణత్వాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְהַעֲלוֹת הָעֹלָה
  choice: దహనబలిని అర్పించడం
  rationale: עלה యొక్క హిఫిల్ రూపం బలి సందర్భంలో ‘అర్పించు’ అనే అర్థం ఇస్తుంది; עֹלָהకు ‘దహనబలి’ ప్రామాణికమైన, స్పష్టమైన పదం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: సమూయేలు అనూహ్యంగా వచ్చిన దృశ్యానికి హీబ్రూలోని ఆకస్మికతను, సజీవతను నిలుపుతుంది.
- source_word: שְׁמוּאֵל בָּא
  choice: సమూయేలు వచ్చాడు
  rationale: హీబ్రూ పరిపూర్ణ క్రియ కథనంలో వచ్చిన సంఘటనను సూటిగా తెలియజేస్తుంది.
- source_word: וַיֵּצֵא
  choice: బయటికి వెళ్లాడు
  rationale: క్రియలోని బయటికి కదలడమనే దిశార్థాన్ని నిలుపుతుంది.
- source_word: לִקְרָאתוֹ
  choice: అతనిని కలుసుకొని
  rationale: ఎవరినైనా ఎదురుగా వెళ్లి కలుసుకోవడాన్ని తెలిపే హీబ్రూ ప్రయోగాన్ని ప్రతికూల భావం రాకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְבָרֲכוֹ
  choice: ఆశీర్వదించడానికి
  rationale: ברך యొక్క ప్రాథమిక అర్థమైన ‘ఆశీర్వదించు’ను నిలుపుతూ, ఈ సందర్భంలో అది అభివాదాన్ని సూచించే అవకాశాన్ని పాదటిప్పణిలో తెలియజేశాం.
