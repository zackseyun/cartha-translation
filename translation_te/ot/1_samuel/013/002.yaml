  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. సైనిక సందర్భం స్పష్టంగా ఉన్నా הָעָם ను వ్యాఖ్యానాత్మకంగా ‘సైన్యం’గా మార్చలేదు. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలతో సరిపోలుతున్నాయి.
