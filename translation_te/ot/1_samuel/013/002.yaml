source:
  edition: WLC
  text: וַ/יִּבְחַר ל֨/וֹ שָׁא֜וּל שְׁלֹ֣שֶׁת אֲלָפִים֮ מִ/יִּשְׂרָאֵל֒ וַ/יִּהְי֨וּ עִם שָׁא֜וּל אַלְפַּ֗יִם בְּ/מִכְמָשׂ֙ וּ/בְ/הַ֣ר בֵּֽית אֵ֔ל וְ/אֶ֗לֶף הָיוּ֙ עִם י֣וֹנָתָ֔ן בְּ/גִבְעַ֖ת בִּנְיָמִ֑ין וְ/יֶ֣תֶר הָ/עָ֔ם שִׁלַּ֖ח אִ֥ישׁ לְ/אֹהָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
translation:
  language: te
  text: సౌలు ఇశ్రాయేలీయులలోనుండి మూడువేల మందిని తన కోసం ఎంపిక చేసుకున్నాడు. వారిలో రెండువేల మంది మిక్మాషులో, బేతేలు కొండప్రాంతంలో[a] సౌలుతో ఉన్నారు; వెయ్యిమంది బెన్యామీనులోని గిబియాలో యోనాతానుతో ఉన్నారు. మిగిలిన ప్రజల్లో ప్రతి ఒక్కరినీ వారి వారి గుడారాలకు[b] పంపివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బేతేలు కొండపై.” హీబ్రూ పదబంధం బేతేలు చుట్టుపక్కల కొండప్రాంతాన్ని గానీ, బేతేలు దగ్గర ఒక నిర్దిష్టమైన ఎత్తైన ప్రదేశాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “వారి వారి గుడారాలకు” అనేది ప్రజలను వారి వారి నివాసాలకు పంపివేయడాన్ని సూచించే సాధారణ హీబ్రూ నుడికారం.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: తన కోసం ఎంపిక చేసుకున్నాడు
  rationale: בחר అనే క్రియలోని ‘ఎంపికచేయు’ భావాన్ని, לוֹ లోని స్వప్రయోజన దత్తార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שְׁלֹשֶׁת אֲלָפִים מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలీయులలో నుండి మూడువేల మందిని
  rationale: מן మూలం లేదా సమూహం నుండి ఎంపికను సూచిస్తుంది; వ్యక్తుల సంఖ్య కావడంతో ‘మందిని’ సహజంగా ఉంది.
- source_word: וַיִּהְיוּ עִם שָׁאוּל
  choice: సౌలుతో ఉన్నారు
  rationale: మూలంలోని సరళమైన సహవాస/స్థాన భావాన్ని ‘నిలిచారు’ వంటి అదనపు భావం లేకుండా కాపాడుతుంది.
- source_word: בְּמִכְמָשׂ
  choice: మిక్మషులో
  rationale: స్థలాన్ని సూచించే ב ను సహజ తెలుగు స్థానవిభక్తితో అనువదిస్తుంది.
- source_word: וּבְהַר בֵּית אֵל
  choice: బేతేలు కొండప్రాంతంలో
  rationale: הַר ఇక్కడ ఒక కొండను గానీ, బేతేలు పరిసర పర్వత/కొండ ప్రాంతాన్ని గానీ సూచించవచ్చు; ప్రధాన పాఠ్యంలో సందర్భానుకూల ప్రాంతార్థం తీసుకుని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְאֶלֶף הָיוּ עִם יוֹנָתָן
  choice: వెయ్యిమంది ... యోనాతానుతో ఉన్నారు
  rationale: ముందరి దళస్థాన వాక్యానికి సమాంతరమైన సంఖ్యా, సహవాస నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בְּגִבְעַת בִּנְיָמִין
  choice: బెన్యామీనులోని గిబియాలో
  rationale: మసొరా స్వరచిహ్నాలు ‘గిబియా’ను సమర్థిస్తాయి; బెన్యామీను ప్రాంతంతో దాని సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְיֶתֶר הָעָם
  choice: మిగిలిన ప్రజలను
  rationale: הָעָם ను సైన్యం అని విస్తరించకుండా అక్షరార్థమైన ‘ప్రజలు’గా ఉంచుతుంది; సందర్భం వారు సమీకరించబడిన యోధులని సూచిస్తుంది.
- source_word: שִׁלַּח
  choice: పంపివేశాడు
  rationale: ఈ సందర్భంలో మిగిలినవారిని సేవనుండి పంపివేయడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ לְאֹהָלָיו
  choice: ఒక్కొక్కరిని తమ తమ గుడారాలకు
  rationale: ప్రతి వ్యక్తి తన నివాసానికి వెళ్లేలా పంపించాడనే హీబ్రూ నుడికారాన్ని, ‘గుడారాలు’ అనే మూలరూపాన్ని నిలుపుతూ సహజ తెలుగులో అందిస్తుంది.
