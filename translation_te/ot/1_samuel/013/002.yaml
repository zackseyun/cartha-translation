  source_fidelity: మూల హీబ్రూ వచనంలోని ఎంపిక, సంఖ్యలు, దళాల విభజన, స్థలాలు, మిగిలిన ప్రజలను వారి గుడారాలకు పంపివేయడం అనే భావాలు ముసాయిదాలో సరిగ్గా ప్రతిఫలించాయి. అయితే చివరి వాక్యంలోని ‘ప్రజలను ఒక్కొక్కరిని తమ తమ గుడారాలకు’ నిర్మాణం ఆధునిక ప్రామాణిక తెలుగులో వ్యాకరణపరంగా అసహజంగా ఉంది. పేర్లను ప్రామాణిక తెలుగు బైబిలు రూపాలకు దగ్గరగా సవరించాం.
