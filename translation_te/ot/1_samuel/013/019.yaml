  text: No blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
translation:
  language: te
  text: ఇశ్రాయేలు దేశమంతటా ఒక్క కమ్మరి కూడా కనిపించలేదు. ఎందుకంటే ఫిలిష్తీయులు, “లేకపోతే హెబ్రీయులు కత్తులనో ఈటెలనో తయారు చేస్తారు” అని అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “హెబ్రీయులు కత్తినో ఈటెనో తయారు చేస్తారేమో.” హీబ్రూలో ‘కత్తి,’ ‘ఈటె’ ఏకవచనంలో ఉన్నా, అవి ఇక్కడ ఆయుధాలను సాధారణంగా సూచిస్తున్నాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרָשׁ
  choice: కమ్మరి
  rationale: యుద్ధాయుధాలు, పనిముట్ల సందర్భంలో ఇది సాధారణ శిల్పిని కాక లోహంతో పనిచేసే కమ్మరిని సూచిస్తుంది.
- source_word: יִמָּצֵא
  choice: కనిపించలేదు
  rationale: నిఫాల్ రూపం ఎవరూ దొరకకపోవడం లేదా అక్కడ లేకపోవడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘కనిపించలేదు’ సహజంగా ఉంది.
- source_word: בְּכֹל אֶרֶץ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేశమంతటా
  rationale: మొత్తం భూభాగాన్ని సూచించే సహజమైన, సంక్షిప్తమైన తెలుగు ప్రయోగం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: కమ్మరులు లేకపోవడానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: אמר
  choice: అని అన్నారు
  rationale: హీబ్రూ కథనంలోని భూతకాల క్రియను సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో అందిస్తుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: ఫిలిష్తీయులు నివారించదలచిన పరిణామాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הָעִבְרִים
  choice: హెబ్రీయులు
  rationale: మూలపాఠంలోని జాతి-సంబంధ పదాన్ని ‘ఇశ్రాయేలీయులు’గా సమన్వయపరచకుండా యథాతథంగా నిలుపుతుంది.
- source_word: יַעֲשׂוּ
  choice: తయారు చేసుకుంటారు
  rationale: ఆయుధాలను తమ ఉపయోగం కోసం తయారు చేయించుకోవడం లేదా తయారు చేసుకోవడం అనే సందర్భార్థాన్ని సహజంగా తెలుపుతుంది.
- source_word: חֶרֶב אוֹ חֲנִית
  choice: కత్తులనో ఈటెలనో
  rationale: హీబ్రూలో ఏకవచన నామాలు ఇక్కడ ఆయుధవర్గాలను సాధారణంగా సూచిస్తున్నందున తెలుగులో బహువచనం సహజంగా ఉంది.
