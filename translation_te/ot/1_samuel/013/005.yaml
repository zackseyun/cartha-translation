source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֞ים נֶאֶסְפ֣וּ לְ/הִלָּחֵ֣ם עִם יִשְׂרָאֵ֗ל שְׁלֹשִׁ֨ים אֶ֤לֶף רֶ֨כֶב֙ וְ/שֵׁ֤שֶׁת אֲלָפִים֙ פָּרָשִׁ֔ים וְ/עָ֕ם כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַֽת הַ/יָּ֖ם לָ/רֹ֑ב וַֽ/יַּעֲלוּ֙ וַ/יַּחֲנ֣וּ בְ/מִכְמָ֔שׂ קִדְמַ֖ת בֵּ֥ית אָֽוֶן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
translation:
  language: te
  text: 'ఫిలిష్తీయులు ఇశ్రాయేలుతో యుద్ధం చేయడానికి సమకూడారు: ముప్పై వేల రథాలు[a], ఆరు వేల గుర్రపు సైనికులు, సముద్రతీరాన ఉన్న ఇసుక రేణువులంత అసంఖ్యాకమైన సైన్యం. వారు పైకి వెళ్లి బేతావెనుకు తూర్పున ఉన్న మిక్మాషులో శిబిరం వేశారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘ముప్పై వేల రథాలు’ అని ఉంది. ఈ సందర్భంలో ఆ సంఖ్య అసాధారణంగా పెద్దదిగా కనిపిస్తున్నందున, కొందరు వ్యాఖ్యాతలు మరియు కొన్ని ప్రాచీన పాఠసాక్ష్యాల ఆధారంగా ‘మూడు వేల’ వంటి చిన్న సంఖ్యను సూచించారు. అయితే ప్రధాన పాఠం మసొరేటిక్ హీబ్రూ పాఠాన్నే అనుసరిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: נֶאֶסְפוּ
  choice: సమకూడారు
  rationale: నిఫాల్ రూపం యుద్ధం కోసం సమకూడడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండే క్రియను ఎంచుకున్నాం.
- source_word: לְהִלָּחֵם עִם
  choice: ఇశ్రాయేలుతో యుద్ధం చేయడానికి
  rationale: ఈ సందర్భంలో עִם శత్రుత్వపూర్వక పోరాటాన్ని సూచిస్తుంది. తెలుగులో ‘తో యుద్ధం చేయడానికి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: שְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: ముప్పై వేల రథాలు
  rationale: మసొరేటిక్ హీబ్రూ పాఠంలోని సంఖ్యను, רֶכֶב యొక్క సాధారణ అర్థాన్ని ప్రధాన పాఠంలో నేరుగా నిలిపి, పాఠాంతర సమస్యను పాదసూచికలో తెలిపాం.
- source_word: שֵׁשֶׁת אֲלָפִים פָּרָשִׁים
  choice: ఆరు వేల గుర్రపు దళసైనికులు
  rationale: פָּרָשִׁים అనేది గుర్రాలపై యుద్ధం చేసే దళాన్ని సూచిస్తుంది; ‘గుర్రపు దళసైనికులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וְעָם
  choice: సైన్యం
  rationale: పదశః ‘ప్రజలు’ అయినా, యుద్ధ సందర్భంలో ఇది పోరాట బలగాన్ని సూచిస్తుంది; ‘సైన్యం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: సముద్రతీరంలోని ఇసుకంత విస్తారమైన
  rationale: లెక్కించలేనంత పెద్ద సమూహాన్ని తెలిపే హీబ్రూ ఉపమానాన్ని సహజమైన తెలుగు రూపంలో నిలిపాం.
- source_word: וַיַּעֲלוּ
  choice: వారు పైకి వెళ్లి
  rationale: עלה లోని దిశాసూచక భావాన్ని వ్యాఖ్యానాత్మకమైన ‘దండెత్తి’ వంటి పదంతో మార్చకుండా నిలిపాం.
- source_word: וַיַּחֲנוּ
  choice: శిబిరం వేశారు
  rationale: חנה యొక్క అర్థాన్ని ఆధునిక, సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְמִכְמָשׂ
  choice: మిక్మాషులో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, శిబిర స్థలాన్ని తెలుగులో సహజమైన విభక్తితో తెలిపాం.
- source_word: קִדְמַת בֵּית אָוֶן
  choice: బేతావెనుకు తూర్పున
  rationale: ఈ సందర్భంలో קִדְמַת సంబంధిత స్థలానికి తూర్పు వైపును సూచిస్తుంది; ఈ అనువాదం భౌగోళిక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
