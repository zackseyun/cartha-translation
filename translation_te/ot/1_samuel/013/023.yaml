  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన కథనశైలిని ఉపయోగించాం. ‘కనుమదారి’ భౌగోళిక భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని పదసంబంధ అస్పష్టతను పాదసూచికలో నిలిపాం.
