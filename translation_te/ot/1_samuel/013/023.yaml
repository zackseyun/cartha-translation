  revision_rationale: The revision changes the destination from ‘near Michmash pass’ to ‘to the Michmash pass’ and replaces an immobile ‘base’ with a mobile military contingent. It retains the source’s lexical alternatives in the anchored footnote without introducing interpretive military detail.
