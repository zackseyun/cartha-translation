  text: And a garrison of the Philistines went out to the pass of Michmash[a].
translation:
  language: te
  text: ఫిలిష్తీయుల సైనిక దళం మిక్మాషు కనుమదారికి బయలుదేరింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫిలిష్తీయుల ముందరి స్థావరం మిక్మాషు దాటువకు బయలుదేరింది.”
    reason: మַצַּבకు ‘ముందరి స్థావరం’ లేదా ‘సైనిక స్థానం,’ మַעֲבַרకు ‘దాటువ’ అనే అర్థాలు కూడా సాధ్యమైనవి.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరింది
  rationale: יצא అనే క్రియ ఇక్కడ ఒక చోటు నుంచి ముందుకు కదలడాన్ని సూచిస్తుంది. సైనిక భావాన్ని అతిగా చేర్చకుండా సహజమైన తెలుగు కథనశైలిలో ‘బయలుదేరింది’ అని అనువదించాం.
- source_word: מַצַּב
  choice: సైనిక స్థావరం
  rationale: ఈ సైనిక సందర్భంలో מַצַּב అనేది నియమించబడిన సైనిక బలగాన్నిగానీ అది ఉన్న స్థావరాన్నిగానీ సూచించవచ్చు. ఈ అస్పష్టతను కొంతవరకు నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ‘సైనిక స్థావరం’ ఎంచుకున్నాం.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల
  rationale: ప్రజాసమూహం పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపాన్ని ఉపయోగించాం; హెబ్రీ నిర్మాణ సంబంధాన్ని ‘ఫిలిష్తీయుల సైనిక స్థావరం’గా సహజంగా వ్యక్తం చేశాం.
- source_word: אֶל
  choice: దగ్గరికి
  rationale: אֶל గమ్యదిశను సూచిస్తుంది. స్థలపదంతో కలిపి ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘దగ్గరికి’ వాడాం; ‘వైపుకు’ కూడా సాధ్యమే.
- source_word: מַעֲבַר
  choice: కనుమదారి
  rationale: מַעֲבַר అనేది దాటే స్థలం, మార్గం లేదా కనుమదారిని సూచించవచ్చు. మిక్మాషు పరిసరాల భౌగోళిక, సైనిక సందర్భానికి ‘కనుమదారి’ సహజంగా సరిపోతుంది; ‘దాటువ’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: מִכְמָשׂ
  choice: మిక్మాషు
  rationale: హెబ్రీ స్థలనామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
