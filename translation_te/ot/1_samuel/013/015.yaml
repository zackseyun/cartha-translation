source:
  edition: WLC
  text: וַ/יָּ֣קָם שְׁמוּאֵ֗ל וַ/יַּ֛עַל מִן הַ/גִּלְגָּ֖ל גִּבְעַ֣ת בִּנְיָמִ֑ן וַ/יִּפְקֹ֣ד שָׁא֗וּל אֶת הָ/עָם֙ הַ/נִּמְצְאִ֣ים עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/015.yaml
  text: Then Samuel arose and went up from Gilgal to Gibeah of Benjamin[a], and Saul counted the people who were present with him, about six hundred men.
translation:
  language: te
  text: అప్పుడు సమూయేలు లేచి గిల్గాలు నుండి బెన్యామీనులోని గిబియాకు[a] పైకి వెళ్లాడు. సౌలు తనతో ఉన్న ప్రజలను లెక్కించాడు; వారు దాదాపు ఆరువందల మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని పాఠసాక్ష్యాలు మరియు అనువాదాలు “బెన్యామీనులోని గిబియాకు” బదులు “బెన్యామీనులోని గెబాకు” అని చదువుతాయి. ఇక్కడి హీబ్రూ పాఠంలో “గిబియా” ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే సాధారణ కథన క్రియలోని ‘లేచుట’ అనే భావాన్ని సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: וַיַּעַל
  choice: వెళ్లాడు
  rationale: עלהలో ఎత్తైన ప్రదేశానికి ‘పైకి వెళ్లడం’ అనే దిశాభావం ఉన్నప్పటికీ, ఆధునిక తెలుగులో ప్రయాణ సందర్భంలో ‘ఎక్కి వెళ్లాడు’ అసహజంగా లేదా ప్రయాణ విధానాన్ని సూచించేలా వినిపించవచ్చు; ‘వెళ్లాడు’ గమ్యప్రయాణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִן הַגִּלְגָּל
  choice: గిల్గాలు నుండి
  rationale: ప్రయాణం ఆరంభమైన స్థలాన్ని సూచించే מן ఉపసర్గను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: גִּבְעַת בִּנְיָמִן
  choice: బెన్యామీను ప్రాంతంలోని గిబియాకు
  rationale: మసొరెటిక్ పాఠంలోని గిబియా అనే స్థలనామాన్ని అనుసరిస్తూ, బెన్యామీనుతో దాని భౌగోళిక సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘గెబా’ అనే పాఠాంతరాన్ని పాదసూచికలో ఉంచింది.
- source_word: וַיִּפְקֹד
  choice: లెక్కపెట్టగా
  rationale: సైనిక సందర్భంలో פקדకు ‘సమీకరించు/లెక్కించు’ భావాలు సాధ్యమైనా, ఇక్కడ తనతో ఉన్నవారి సంఖ్యను నిర్ధారించడం ప్రధాన భావం; ‘లెక్కపెట్టగా’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: עם అనే విస్తృత పదాన్ని ‘సైనికులు’గా అవసరానికి మించి కుదించకుండా మూలంలోని సాధారణ పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: הַנִּמְצְאִים עִמּוֹ
  choice: తనతో ఉన్న
  rationale: מצא నిఫాల్ రూపంలోని అక్షరార్థమైన ‘కనబడిన’ భావాన్ని సందర్భానుసారంగా ‘తనతో ఉన్న’ అని సహజ తెలుగులో వ్యక్తం చేస్తుంది; వారు మిగిలిపోయారని స్పష్టంగా చెప్పి మూలాన్ని మించదు.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: దాదాపు ఆరువందల మంది
  rationale: כְּ ఉపసర్గలోని సుమారు సంఖ్యాభావాన్ని ‘దాదాపు’ తెలియజేస్తుంది; איש సంఖ్యాప్రయోగాన్ని తెలుగులో సహజమైన ‘మంది’తో వ్యక్తం చేసింది.
