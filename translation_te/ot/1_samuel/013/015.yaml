translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. స్థలనామాలు సాధారణ తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని సుమారు సంఖ్యాభావం, ‘ప్రజలు’ అనే విస్తృత పదం, గిబియా/గెబా పాఠాంతరం సంరక్షించబడ్డాయి.
