  source_fidelity: 'మొత్తంగా మూల హీబ్రూ భావాన్ని నమ్మకంగా ఇస్తోంది: עִבְרִים ను ‘హెబ్రీయులు’గా, חָרְדוּ ను భయంతో వణకడంగా, אַחֲרָיו యొక్క ‘వెనుక/అనుసరిస్తూ’ సందిగ్ధతను పాదసూచికతో నిలుపుతోంది. అయితే אֶרֶץ (‘దేశం/ప్రాంతం’) ఏకవచనంలో ఉండగా ముసాయిదాలోని ‘ప్రాంతాలకు’ బహువచనంగా ఉంది.'
