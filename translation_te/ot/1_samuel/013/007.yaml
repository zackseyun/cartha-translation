  text: וְ/עִבְרִ֗ים עָֽבְרוּ֙ אֶת הַ/יַּרְדֵּ֔ן אֶ֥רֶץ גָּ֖ד וְ/גִלְעָ֑ד וְ/שָׁאוּל֙ עוֹדֶ֣/נּוּ בַ/גִּלְגָּ֔ל וְ/כָל הָ/עָ֖ם חָרְד֥וּ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
translation:
  language: te
  text: హెబ్రీయులు యొర్దాను దాటి గాదు, గిలాదు ప్రాంతానికి వెళ్లారు.[a] అయితే సౌలు ఇంకా గిల్గాలులోనే ఉన్నాడు; ప్రజలందరూ అతని వెనుక భయంతో వణికారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘హెబ్రీయులు’ అనే చోట ‘ఇశ్రాయేలీయులు’ అని కూడా అర్థం చేసుకోవచ్చు. హీబ్రూ మూలపాఠంలో ‘హెబ్రీయులు’ అనే పదమే ఉంది; ఈ కథన సందర్భంలో అది జాతిని సూచించే ప్రత్యేక పదప్రయోగం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అతని వెనుక’ అనే చోట ‘అతనిని అనుసరిస్తూ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִים
  choice: హెబ్రీయులు
  rationale: మూలంలోని జాతిసూచక పదాన్ని వ్యాఖ్యానాత్మకంగా ‘ఇశ్రాయేలీయులు’ అని మార్చకుండా నేరుగా నిలుపుతుంది; ఈ సందర్భంలో అది ఇశ్రాయేలీయులను లేదా వారిలో ఒక వర్గాన్ని సూచించవచ్చు.
- source_word: עָבְרוּ אֶת הַיַּרְדֵּן
  choice: యొర్దాను దాటి
  rationale: యొర్దాను నదిని అవతలి వైపుకు దాటారనే సహజమైన తెలుగు భావాన్ని ఇస్తుంది.
- source_word: אֶרֶץ גָּד וְגִלְעָד
  choice: గాదు, గిలాదు ప్రాంతాలకు
  rationale: אֶרֶץ ఇక్కడ భౌగోళిక భూభాగం లేదా ప్రాంతాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో రెండు పేర్లతో ‘ప్రాంతాలకు’ అనడం సహజంగా ఉంటుంది.
- source_word: עוֹדֶנּוּ
  choice: ఇంకా ... ఉన్నాడు
  rationale: సౌలు ఆ సమయంలోనూ అదే చోట కొనసాగి ఉన్నాడనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַגִּלְגָּל
  choice: గిల్గాలులోనే
  rationale: స్థలనామంతో తెలుగు విభక్తి సహజంగా ఉంది; ‘నే’ కొనసాగింపును నొక్కి చెబుతుంది.
- source_word: חָרְדוּ
  choice: భయంతో వణికారు
  rationale: క్రియలోని భయంతో కలిగే శారీరక వణుకు భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אַחֲרָיו
  choice: అతని వెనుక ఉన్న
  rationale: మూలంలోని ‘వెనుక’ అనే స్థలచిత్రాన్ని కాపాడుతుంది; అదే సమయంలో సౌలును అనుసరిస్తున్న ప్రజలు అనే భావం కూడా సందర్భంలో సాధ్యమే.
