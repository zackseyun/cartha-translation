id: 1SA.13.8
reference: 1 Samuel 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ו/ייחל שִׁבְעַ֣ת יָמִ֗ים לַ/מּוֹעֵד֙ אֲשֶׁ֣ר שְׁמוּאֵ֔ל וְ/לֹא בָ֥א שְׁמוּאֵ֖ל הַ/גִּלְגָּ֑ל וַ/יָּ֥פֶץ הָ/עָ֖ם מֵ/עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/008.yaml
  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
translation:
  language: te
  text: అతడు సమూయేలు నిర్ణయించిన సమయం వరకు ఏడు రోజులు వేచి ఉన్నాడు[a]. అయితే సమూయేలు గిల్గాలుకు రాలేదు, ప్రజలు అతని వద్దనుండి చెదరిపోతూ ఉన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమూయేలు చెప్పిన నిర్ణీత సమయానికి అనుగుణంగా.” హీబ్రూలో ఈ సంబంధవాచక వాక్యభాగం సంక్షిప్తంగా ఉంది; సమూయేలు ఏమి చేశాడో క్రియ స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ప్రజలు సౌలును విడిచి వెళ్లిపోతూ ఉన్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיחֶל
  choice: వేచివున్నాడు
  rationale: కాలవ్యవధిని సూచించే ‘ఏడు రోజులు’ అనే పదబంధంతో కలిసి, ఈ సందర్భంలో క్రియ ఆశించడం కంటే వేచి ఉండడాన్ని సూచిస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులు
  rationale: సౌలు వేచివున్న కాలవ్యవధిని నేరుగా, సహజంగా తెలుపుతుంది.
- source_word: לַמּוֹעֵד
  choice: నిర్ణయించిన సమయం వచ్చేవరకు
  rationale: מוֹעֵד ముందుగా నిర్ణయించబడిన సమయాన్ని సూచిస్తుంది; సందర్భంలో ఆ సమయం వరకు వేచివుండడమే భావం.
- source_word: אֲשֶׁר שְׁמוּאֵל
  choice: సమూయేలు నిర్ణయించిన
  rationale: హీబ్రూ సంబంధవాచక వాక్యభాగం సంక్షిప్తంగా ఉంది. ముందరి ఆజ్ఞ సందర్భాన్ని బట్టి సమూయేలు ఆ సమయాన్ని నిర్ణయించాడనే అంతర్లీన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא בָא שְׁמוּאֵל הַגִּלְגָּל
  choice: అయితే సమూయేలు గిల్గాలుకు రాలేదు
  rationale: సమూయేలు ఆశించిన సమయానికి ఆశించిన స్థలానికి రాకపోవడంలోని వ్యతిరేక భావాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּפֶץ הָעָם
  choice: ప్రజలు ... చెదరిపోతూ ఉన్నారు
  rationale: ప్రజలు ఒక్కసారిగా పూర్తిగా చెదరిపోయారనే దానికంటే, సౌలును విడిచి క్రమంగా వెళ్లిపోతున్న కథన పరిస్థితిని ఈ రూపం వ్యక్తం చేస్తుంది.
- source_word: מֵעָלָיו
  choice: అతని దగ్గరనుండి
  rationale: సర్వనామ ప్రత్యయం సందర్భంలో సౌలును సూచిస్తుంది; మూలంలోని సర్వనామ రూపాన్ని నిలిపి, విడిచి వెళ్లిపోవడాన్ని సహజ తెలుగులో తెలుపుతుంది.
