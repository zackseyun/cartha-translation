translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలోని సంక్షిప్తతను ప్రధాన పాఠంలో స్పష్టంగా అందిస్తూ, దాని నిజమైన నిర్మాణాత్మక అస్పష్టతను పాదటిప్పణిలో నిలిపాం. [b] గుర్తును అది వివరిస్తున్న ‘అతని దగ్గరనుండి’ అనే భాగం వద్ద ఉంచాం.
