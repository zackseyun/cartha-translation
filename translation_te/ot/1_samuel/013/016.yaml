base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/016.yaml
  text: Saul and Jonathan his son[a], and the people who were with them, were staying in Geba of Benjamin[b], while the Philistines had encamped at Michmash.
translation:
  language: te
  text: సౌలు, అతని కుమారుడు యోనాతాను, వారితో ఉన్న ప్రజలు[a] బెన్యామీను ప్రాంతంలోని గెబలో[b] ఉన్నారు; ఫిలిష్తీయులు మిక్మాషులో మకాం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారాన్ని అక్షరార్థంగా అనువదిస్తే, “వారితో కనబడిన ప్రజలు.” అంతకుముందు కొందరు చెదరిపోయిన తర్వాత సౌలు, యోనాతానులతో ఇంకా మిగిలి ఉన్నవారిని ఇది సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ స్థలనామం “గెబ”; “గిబియా” కాదు. ఈ కథన సందర్భంలో అవి పేర్లు దగ్గరగా ఉన్నప్పటికీ వేర్వేరు ప్రదేశాలు.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: ఉన్నారు
  rationale: ישׁב అనే క్రియారూపం ఇక్కడ కేవలం కూర్చోవడాన్ని కాక, ఒక ప్రదేశంలో ఉండడాన్ని సూచిస్తుంది. సైనిక కథన సందర్భంలో సహజమైన తెలుగు కోసం ‘ఉన్నారు’ అని అనువదించాం.
- source_word: הַנִּמְצָא עִמָּם
  choice: వారితో ఉన్న ప్రజలు
  rationale: నిఫాల్ కృదంతానికి అక్షరార్థంగా ‘వారితో కనబడినవారు’ అని చెప్పవచ్చు; అయితే సందర్భంలో ఇది సౌలు, యోనాతానులతో ఇంకా ఉన్నవారిని సూచిస్తుంది. సహజమైన తెలుగులో ప్రధాన పాఠంలో ‘వారితో ఉన్న’ అని ఇచ్చి, మూలభాష నుడికారాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּגֶבַע בִּנְיָמִן
  choice: బెన్యామీను ప్రాంతంలోని గెబలో
  rationale: మూలపాఠం గిబియా కాక ‘గెబ’ అనే ప్రత్యేక స్థలనామాన్ని సూచిస్తుంది. בִּנְיָמִן ఇక్కడ ఆ పట్టణం ఉన్న గోత్రప్రాంతాన్ని తెలియజేస్తుంది.
- source_word: חָנוּ
  choice: మకాం వేశారు
  rationale: חנה అనేది సైన్యం శిబిరం వేసి నిలిచిపోవడానికి వాడే సాధారణ క్రియ. ‘మకాం వేశారు’ ఆధునిక తెలుగులో సైనిక శిబిరస్థాపన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְמִכְמָשׂ
  choice: మిక్మాషులో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, בְ అనే స్థానార్థక ఉపసర్గను తెలుగులో ‘లో’ ద్వారా వ్యక్తం చేశాం.
- source_word: וְ
  choice: మరియు/వాక్య సంబంధం
  rationale: ప్రారంభ וְ కథన కొనసాగింపును సూచిస్తుంది; మూలంలో ప్రత్యేకంగా ‘ఇప్పుడు’ అనే కాలసూచక పదం లేదు. తెలుగులో అనవసరమైన ‘ఇప్పుడు’ చేర్చకుండా వాక్య నిర్మాణం ద్వారా సంబంధాన్ని చూపించాం.
