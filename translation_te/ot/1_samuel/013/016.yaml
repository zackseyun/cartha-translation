translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. స్థలనామాల భేదాన్ని, הַנִּמְצָא עִמָּם లోని మూలభాష నుడికారాన్ని పాదటిప్పణుల్లో సంరక్షించాం.
