  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
translation:
  language: te
  text: నాగలి ఇనుప మొనలకు[a], గడ్డపారలకు, మూడుమొనల కొంకులకు, గొడ్డళ్లకు పదును పెట్టడానికి, అలాగే ములుగర్రులను సరిచేయడానికి వసూలు చేసే ధర ఒక పీము[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నాగలి ఇనుప మొనలు’ అంటే నాగలికి అమర్చే, పదును పెట్టే ఇనుప భాగాలు.
    reason: cultural_note
  - marker: b
    text: పీము ప్రాచీన కాలంలోని చిన్న బరువు లేదా చెల్లింపు ప్రమాణం; అది సాధారణంగా షెకెలులో దాదాపు మూడింట రెండు వంతులని భావిస్తారు. హీబ్రూ వాక్య నిర్మాణం క్లిష్టంగా ఉంది; ఇది పదును పెట్టడానికి వసూలు చేసే ధరను గానీ, పదును పెట్టే పనినే గానీ సూచించవచ్చు.
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: הַפְּצִירָה
  choice: పదును పెట్టించే వెల
  rationale: ఈ అరుదైన పదం పనిముట్లకు పదును పెట్టే పనిని లేదా దానికి వసూలు చేసిన వెలను సూచించవచ్చు. వెంటనే ‘పీము’ అనే పరిమాణం రావడం వల్ల ప్రధాన పాఠంలో సేవకు చెల్లించే వెలగా అనువదించాం; పదును పెట్టడం అనే భావాన్నీ పదబంధంలో నిలిపాం.
- source_word: פִים
  choice: ఒక పీము
  rationale: ఇది ప్రాచీన బరువు లేదా చెల్లింపు ప్రమాణం. ఖచ్చితమైన ఆధునిక సమాన విలువను ప్రధాన పాఠంలో పెట్టకుండా పేరును లిప్యంతరీకరించి, వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: מַחֲרֵשֹׁת
  choice: నాగలి కర్రులు
  rationale: పదును అవసరమైన నాగలి ఇనుప భాగాలను సూచించే సహజమైన తెలుగు పదబంధం.
- source_word: אֵתִים
  choice: గడ్డపారలు
  rationale: తవ్వడానికి లేదా నేలను కొట్టడానికి వాడే వ్యవసాయ పనిముట్టును సూచిస్తుంది; ఖచ్చిత రూపం అనిశ్చితమైనా ‘గడ్డపార’ సందర్భానికి సరిపోతుంది.
- source_word: שְׁלֹשׁ קִלְּשׁוֹן
  choice: మూడుమొనల కొంకులు
  rationale: హీబ్రూ పదబంధంలోని ‘మూడు’ మరియు మొనలు గల పనిముట్టు అనే చిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: קַּרְדֻּמִּים
  choice: గొడ్డళ్లు
  rationale: నరకడానికి లేదా కొట్టడానికి వాడే పనిముట్లకు సాధారణమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: לְהַצִּיב הַדָּרְבָן
  choice: ములుగర్రులను సరిచేయించడానికి
  rationale: క్రియలో అమర్చడం, సరిచేయడం లేదా పనికి తగినట్లు చేయడం అనే విస్తృత భావం ఉంది. కేవలం ‘పదును పెట్టడం’ అని పరిమితం చేయకుండా అనిశ్చితిని కాపాడాం.
