translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గ్రామీణ వ్యవసాయ సందర్భం సాధారణ పాఠకునికి అర్థమయ్యేలా పనిముట్ల పేర్లు ఎంచుకున్నాం. మూలంలోని క్లిష్టతను పూర్తిగా సాఫీ చేయకుండా ప్రధాన పాఠంలో సహజ ప్రవాహం ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
