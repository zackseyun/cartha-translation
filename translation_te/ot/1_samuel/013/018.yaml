source:
  edition: WLC
  text: וְ/הָ/רֹ֤אשׁ אֶחָד֙ יִפְנֶ֔ה דֶּ֖רֶךְ בֵּ֣ית חֹר֑וֹן וְ/הָ/רֹ֨אשׁ אֶחָ֤ד יִפְנֶה֙ דֶּ֣רֶךְ הַ/גְּב֔וּל הַ/נִּשְׁקָ֛ף עַל גֵּ֥י הַצְּבֹעִ֖ים הַ/מִּדְבָּֽרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
translation:
  language: te
  text: ఒక దళం[a] బేత్-హోరోనుకు వెళ్లే దారివైపు తిరిగింది; మరో దళం జెబోయీము లోయపైకి కనిపించే సరిహద్దు దారివైపు, అరణ్యం వైపుకు తిరిగింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక విభాగం,’ ‘ఒక దళం’; అక్షరార్థంగా ‘ఒక తల.’
    reason: lexical_alternative
  - marker: b
    text: ‘జెబోయీము’ బహుశా ఒక స్థలనామం; దాని మూలపదానికి ‘హైనాలు’ అనే అర్థంతో సంబంధం ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ אֶחָד
  choice: ఒక దండు / మరో దండు
  rationale: רֹאשׁ అనే పదానికి అక్షరార్థం ‘తల’; అయితే ఇక్కడ చుట్టుపక్కల వచనాల్లోని దోపిడీ దళాల విభాగాల్లో ఒక్కొక్కదాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సైనిక సందర్భాన్ని సహజంగా తెలియజేయడానికి ‘దండు’ వాడబడింది.
- source_word: יִפְנֶה
  choice: దారివైపు తిరిగింది
  rationale: פנה అంటే ‘తిరుగు’ లేదా ‘ముఖం తిప్పు.’ దళాల కదలికను సూచించే ఈ సందర్భంలో దిశవైపు తిరిగి వెళ్లడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דֶּרֶךְ
  choice: దారి
  rationale: דֶּרֶךְ అంటే దారి, మార్గం. ఇక్కడ ప్రయాణ మార్గాన్ని సూచిస్తున్నందున ‘దారి’ స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: בֵּית חֹרוֹן
  choice: బేత్-హోరోను
  rationale: స్థలనామాన్ని తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַגְּבוּל
  choice: సరిహద్దు
  rationale: גְּבוּל అంటే సరిహద్దు లేదా హద్దు. భౌగోళిక వర్ణనలో ‘సరిహద్దు’ తగినది.
- source_word: הַנִּשְׁקָף
  choice: పైనుంచి చూసే
  rationale: שׁקף నిఫాల్ కృదంతం ఎత్తైన ప్రదేశం నుంచి కిందనున్న ప్రాంతాన్ని చూడడం లేదా దానిపైకి నిలిచి ఉండడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘పైనుంచి చూసే’ ఆ భౌగోళిక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גֵּי הַצְּבֹעִים
  choice: జెబోయీము లోయ
  rationale: ఇది స్థలనామంగా పనిచేస్తున్నందున צְבֹעִים ను ‘జెబోయీము’గా లిప్యంతరీకరించాం; గֵּי ను ‘లోయ’గా అనువదించాం.
- source_word: הַמִּדְבָּרָה
  choice: అరణ్యం వైపున
  rationale: מִדְבָּר పదానికి ఉన్న దిశార్థక ప్రత్యయం అరణ్యం వైపు ఉన్న దిశను సూచిస్తుంది. ఆ దిశాభావాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
