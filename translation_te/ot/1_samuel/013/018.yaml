  to: ఒక దళం[a] బేత్-హోరోనుకు వెళ్లే దారివైపు తిరిగింది; మరో దళం జెబోయీము లోయపైకి కనిపించే సరిహద్దు దారివైపు, అరణ్యం వైపుకు తిరిగింది.[b]
