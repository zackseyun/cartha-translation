translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన కథన శైలిని పాటించాం. హెబ్రీ వాక్యంలోని మూడు దిశల్లో వెళ్లిన దళాల సైనిక సందర్భాన్ని ‘దండు’ ద్వారా స్పష్టం చేశాం; స్థలనామాలను లిప్యంతరీకరించాం.
