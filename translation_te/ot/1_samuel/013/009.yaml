  text: וַ/יֹּ֣אמֶר שָׁא֔וּל הַגִּ֣שׁוּ אֵלַ֔/י הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יַּ֖עַל הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/009.yaml
  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
translation:
  language: te
  text: అప్పుడు సౌలు, “దహనబలిని సమాధాన బలులను[a] నా దగ్గరికి తీసుకురండి” అని చెప్పాడు. అతడు దహనబలిని అర్పించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహవాస బలులను.” హీబ్రూ పదం శాంతి, క్షేమం లేదా పంచుకునే సహవాసంతో సంబంధమున్న బలులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: చివరి వాక్యభాగానికి అత్యంత సహజమైన అర్థం సౌలు స్వయంగా దహనబలిని అర్పించాడనేది; కొందరు దీనిని సౌలు ఆ బలిని అర్పింపజేశాడనే పరోక్ష అర్థంలో గ్రహిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు సౌలు ... అని చెప్పాడు
  rationale: వావ్-క్రమక్రియ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַגִּשׁוּ אֵלַי
  choice: నా దగ్గరికి తీసుకురండి
  rationale: నגשׁ హిఫీల్ ఆజ్ఞారూపం దగ్గరకు తేవడం లేదా సమర్పణార్థం తీసుకురావడం అనే భావం ఇస్తుంది; తెలుగులో ఇది సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עֹלָה పూర్తిగా దహించబడే బలికి ప్రామాణిక బలిసంబంధ పదం.
- source_word: וְהַשְּׁלָמִים
  choice: సమాధాన బలులు
  rationale: שְׁלָמִים శాంతి, క్షేమం, భాగస్వామ్య సహవాసంతో సంబంధమున్న బలులను సూచిస్తుంది; ‘సమాధాన బలులు’ మూలపదానికి దగ్గరగా ఉండే గుర్తించదగిన ఆచారపదం.
- source_word: וַיַּעַל
  choice: అతడు ... అర్పించాడు
  rationale: బలి సందర్భంలో עלה బలిని అర్పించడం అనే సహజార్థాన్ని ఇస్తుంది; ముందు పేర్కొన్న సౌలే వ్యాకరణపరంగా సహజమైన కర్త.
theological_decisions:
- issue: చివరి వాక్యభాగంలో కర్త మరియు చర్య
  choice: సౌలు స్వయంగా దహనబలిని అర్పించాడు
  alternative: సౌలు దహనబలిని ఇతరులతో అర్పింపజేశాడు లేదా సమర్పింపజేశాడు
  rationale: ఏకవచన క్రియకు ముందున్న కర్త సౌలు కావడంతో ప్రత్యక్ష కర్తృత్వమే అత్యంత సహజమైన పఠనం; తరువాత వచ్చే గద్దింపు కూడా దీనికి అనుకూలంగా ఉంటుంది. అయినా పరోక్షంగా అర్పింపజేశాడనే అవగాహనకు స్వల్ప అవకాశం ఉన్నందున పాదసూచికలో దాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. బలిసంబంధ సాంకేతిక పదాలకు గుర్తించదగిన రూపాలు ఉంచబడ్డాయి; మూలంలోని కర్తృత్వ అస్పష్టతను పాదసూచికలో సంరక్షించాం.
