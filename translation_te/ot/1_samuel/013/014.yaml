id: 1SA.13.14
reference: 1 Samuel 13:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֖ה מַמְלַכְתְּ/ךָ֣ לֹא תָק֑וּם בִּקֵּשׁ֩ יְהוָ֨ה ל֜/וֹ אִ֣ישׁ כִּ/לְבָב֗/וֹ וַ/יְצַוֵּ֨/הוּ יְהוָ֤ה לְ/נָגִיד֙ עַל עַמּ֔/וֹ כִּ֚י לֹ֣א שָׁמַ֔רְתָּ אֵ֥ת אֲשֶֽׁר צִוְּ/ךָ֖ יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
translation:
  language: te
  text: అయితే ఇప్పుడు నీ రాజ్యం నిలిచి ఉండదు[a]. యెహోవా తన హృదయానుసారమైన ఒక మనిషిని తన కోసం వెదికి, తన ప్రజలపై అధిపతిగా అతణ్ణి నియమించాడు[b]. ఎందుకంటే యెహోవా నీకు ఆజ్ఞాపించినదాన్ని నీవు పాటించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ రాజ్యం స్థిరపడదు.”
    reason: lexical_alternative
  - marker: b
    text: “తన ప్రజలు” అంటే యెహోవా ప్రజలు.
    reason: referent_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: అయితే ఇప్పుడు
  rationale: ముందటి పరిస్థితి నుంచి తీర్పు ప్రకటనకు వచ్చే స్పష్టమైన వ్యతిరేక మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מַמְלַכְתְּךָ לֹא תָקוּם
  choice: నీ రాజ్యం నిలిచి ఉండదు
  rationale: תקום అనే ‘నిలుచు/స్థిరపడు’ భావాన్ని రాజ్య స్థిరత్వ సందర్భంలో సహజంగా వ్యక్తపరుస్తూ, మూలంలోని రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  choice: యెహోవా ... తన కోసం వెదికి
  rationale: పూర్తయిన చర్య భావాన్ని, అలాగే לוֹ లోని ‘తన కోసం’ అనే ప్రయోజనార్థాన్ని కాపాడుతుంది.
- source_word: אִישׁ כִּלְבָבוֹ
  choice: తన హృదయానుసారమైన ఒక మనిషిని
  rationale: ‘తన హృదయం ప్రకారం’ అనే హీబ్రూ ప్రయోగాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది; సందర్భంలో ‘తన’ యెహోవాను సూచిస్తుంది.
- source_word: וַיְצַוֵּהוּ יְהוָה לְנָגִיד
  choice: అధిపతిగా అతణ్ణి నియమించాడు
  rationale: לְנָגִיד తో వచ్చిన צוה ఇక్కడ పదవికి నియమించడం/ఆదేశించడం అనే భావంలో ఉంది; ‘నియమించాడు’ సందర్భానికి సరిపోతుంది.
- source_word: עַל עַמּוֹ
  choice: తన ప్రజలపై
  rationale: ప్రత్యయం యెహోవాను సూచిస్తుందని సహజంగా తెలియజేస్తూ మూలంలోని సర్వనామ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: לֹא שָׁמַרְתָּ אֵת אֲשֶׁר צִוְּךָ יְהוָה
  choice: యెహోవా నీకు ఆజ్ఞాపించినదాన్ని నీవు పాటించలేదు
  rationale: שמר యొక్క ఆజ్ఞను కాపాడటం/పాటించడం అనే సందర్భార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: כִּלְבָבוֹ లోని సర్వనామ నిర్దేశం
  choice: ‘తన హృదయానుసారమైన’లో ‘తన’ యెహోవాను సూచించేలా అనువదించబడింది.
  alternative: ఆ సర్వనామాన్ని వెదకబడిన మనిషికి సంబంధించినదిగా అర్థం చేసుకోవడం.
  rationale: తక్షణ వాక్యనిర్మాణంలో యెహోవాయే అత్యంత సహజమైన పూర్వపదం. అయితే ‘దేవుని చిత్తమంతా చేసే వ్యక్తి’ వంటి తరువాతి వివరణను వచనంలో చేర్చలేదు.
- issue: נָגִיד పదం యొక్క భావబలం
  choice: అధిపతి
  alternative: నాయకుడు; రాజకుమారుడు
  rationale: ప్రజలపై నియమించబడిన అధికార స్థానాన్ని తెలియజేస్తుంది; తరువాతి రాజవంశీయ లేదా మెస్సీయ సంబంధిత సాంకేతిక భావాలను అనవసరంగా మోపదు.
- issue: מַמְלַכְתְּךָ యొక్క పరిధి
  choice: నీ రాజ్యం
  alternative: నీ రాజరికం; నీ పరిపాలన
  rationale: ఈ పదం సౌలు పాలనతోపాటు అతని రాజాధికార స్థిరత్వాన్ని సూచించగలదు. ‘రాజ్యం’ ఆ పరిధిని ముందుగానే అతిగా నిర్దిష్టం చేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం. మూలంలోని వాక్యక్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు ‘వెదికి ... నియమించాడు’ అనే అనుసంధాన నిర్మాణాన్ని ఉపయోగించాం.
