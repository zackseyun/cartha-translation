source:
  edition: WLC
  text: וַ/תְּהִ֨י חַטַּ֧את הַ/נְּעָרִ֛ים גְּדוֹלָ֥ה מְאֹ֖ד אֶת פְּנֵ֣י יְהוָ֑ה כִּ֤י נִֽאֲצוּ֙ הָֽ/אֲנָשִׁ֔ים אֵ֖ת מִנְחַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
translation:
  language: te
  text: కాబట్టి, ఆ యువకుల పాపం యాహ్వే సన్నిధిలో[a] చాలా తీవ్రమైనది; ఎందుకంటే ఆ మనుషులు యాహ్వే అర్పణను[b] తృణీకరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘యాహ్వే ముఖం ఎదుట’; అంటే ‘యాహ్వే ఎదుట’ లేదా ‘యాహ్వే సన్నిధిలో.’
    reason: lexical_alternative
  - marker: b
    text: ‘అర్పణ’కు మూలమైన హెబ్రీ పదం మిన్హా. ఇది సాధారణంగా అర్పణను, కొన్ని సందర్భాల్లో ప్రత్యేకంగా ధాన్యార్పణను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: పాపం
  rationale: ఇక్కడ ఈ నామవాచకం ఏలీ కుమారుల దుష్కార్యాన్ని సూచిస్తుంది; పాపపరిహార బలిని కాదు.
- source_word: הַנְּעָרִים
  choice: ఆ యువకులు
  rationale: נַעַר అనే పదానికి బాలుడు, యువకుడు, సేవకుడు అనే అర్థపరిధి ఉంది. ఇక్కడ యాజక సేవలో ఉన్న ఏలీ కుమారులను సూచిస్తున్నందున ‘యువకులు’ సహజంగా ఉంది.
- source_word: גְּדוֹלָה מְאֹד
  choice: ఎంతో ఘోరంగా
  rationale: పాపం అత్యంత తీవ్రమైనదనే హెబ్రీ బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం పరిమాణం కంటే నైతిక తీవ్రతను సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: అక్షరార్థంగా ‘యెహోవా ముఖం ఎదుట’ అనే హెబ్రీ నుడికారానికి తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి తీర్పుకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: נִאֲצוּ
  choice: తృణీకరించారు
  rationale: ఈ క్రియలోని నిరాదరణ, ధిక్కారం అనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: సాధారణ అర్థాన్ని నిలుపుతూ, సందర్భంలో ఇంతకుముందు పేర్కొన్న యువకులనే తిరిగి సూచిస్తుంది.
- source_word: מִנְחַת יְהוָה
  choice: యెహోవాకు అర్పించే అర్పణ
  rationale: מִנְחָה పదం సాధారణంగా అర్పణను, కొన్ని సందర్భాల్లో ప్రత్యేకంగా ధాన్యార్పణను సూచించగలదు. ఇక్కడ బలుల విస్తృత సందర్భం ఉన్నందున ప్రత్యేక రకాన్ని నిర్ధారించకుండా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన రూపంలో నిలుపుతుంది.
- issue: పాపం ‘యెహోవా సన్నిధిలో’ ఉండటం
  choice: యెహోవా సన్నిధిలో
  alternative: యెహోవాకు విరోధంగా
  rationale: ‘విరోధంగా’ అనే అర్థసంభావ్యత సందర్భానికి సరిపోయినా, మూలంలోని ‘ముఖం/సన్నిధి ఎదుట’ అనే నుడికారాన్ని నిలుపుతూ నైతిక తీర్పును అతిగా నిర్ధారించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని ‘యువకులు/మనుషులు’ అనే పదమార్పును అలాగే నిలిపి, మిన్హా యొక్క అర్థపరిధిని పాదటిప్పణిలో తెలిపింది.
