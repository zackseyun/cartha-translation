- from: కాబట్టి ఆ యువకుల పాపం యెహోవా సన్నిధిలో[a] ఎంతో ఘోరంగా ఉంది. ఎందుకంటే ఆ మనుషులు యెహోవాకు అర్పించే అర్పణను[b] తృణీకరించారు.
  to: కాబట్టి, ఆ యువకుల పాపం యాహ్వే సన్నిధిలో[a] చాలా తీవ్రమైనది; ఎందుకంటే ఆ మనుషులు యాహ్వే అర్పణను[b] తృణీకరించారు.
  rationale: The revision aligns the divine name with the project’s Yahweh policy, restores the concise Hebrew construct sense in ‘యాహ్వే అర్పణ,’ and uses a more natural Telugu predicate for the grave assessment of the sin. It preserves the source’s distinction between ‘young men’ and ‘men,’ as well as the ambiguity of מִנְחָה.
