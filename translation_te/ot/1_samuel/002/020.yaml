  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
translation:
  language: te
  text: 'ఏలీ ఎల్కానాను, అతని భార్యను దీవించి ఇలా చెప్పేవాడు: “ఈ స్త్రీ ద్వారా యెహోవా నీకు సంతానాన్ని అనుగ్రహించుగాక; యెహోవా వద్ద అడిగిన ఆ విన్నపానికి బదులుగా.”[a][b] ఆ తర్వాత వారు అతని ఇంటికి వెళ్లేవారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని అక్షరార్థానికి దగ్గరగా ‘యెహోవా వద్ద అడిగిన విన్నపం స్థానంలో’ అని అనువదించవచ్చు. ‘విన్నపం’ అనే పదం ‘అడుగు’ అనే మూలపదంతో సంబంధం కలిగి ఉంది; సమూయేలు జననకథలో ఈ పదప్రయోగం, అడిగి పొందిన సమూయేలును యెహోవాకు అర్పించిన సందర్భాన్ని ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అడిగాడు’ అనే హీబ్రూ క్రియ పుంలింగ ఏకవచనంలో ఉంది. అయితే 1 సమూయేలు 1:20, 27–28 సందర్భం ప్రకారం బిడ్డను అడిగింది హన్నా. అందుకే ప్రధాన పాఠంలో కర్తను స్పష్టంగా పేర్కొనలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֵרַךְ
  choice: దీవిస్తూ ... చెప్పేవాడు
  rationale: చుట్టుపక్కల సందర్భంలో ఏటా జరిగే ఆచారాన్ని సూచిస్తున్నందున, ఒక్కసారి జరిగిన గత చర్యగా కాక పునరావృత చర్యగా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶת אֶלְקָנָה וְאֶת אִשְׁתּוֹ
  choice: ఎల్కానాను, అతని భార్యను
  rationale: మూలపాఠం హన్నా అనే పేరును వాడకుండా ‘అతని భార్య’ అని స్పష్టంగా చెబుతుంది.
- source_word: יָשֵׂם יְהוָה לְךָ
  choice: యెహోవా నీకు ... అనుగ్రహించుగాక
  rationale: שׂים యొక్క మూలభావం ‘ఉంచు/నియమించు’; అయితే ఆశీర్వాద సందర్భంలో సంతానాన్ని ప్రసాదించాలనే భావాన్ని ‘అనుగ్రహించుగాక’ సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: זֶרַע
  choice: సంతానం
  rationale: ఇక్కడ זֶרַע విత్తనం అనే అక్షరార్థంలో కాక సమష్టిగా పిల్లలు/సంతతిని సూచిస్తుంది; కుటుంబ ఆశీర్వాద సందర్భంలో ‘సంతానం’ సహజమైనది.
- source_word: מִן הָאִשָּׁה הַזֹּאת
  choice: ఈ స్త్రీ ద్వారా
  rationale: ఆ సంతానం హన్నా ద్వారా కలగాలని సూచించే మూలభాషా సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: תַּחַת
  choice: బదులుగా
  rationale: ఇక్కడ תחת ‘స్థానంలో/ప్రతిగా’ అనే ప్రత్యామ్నాయ భావాన్ని కలిగిస్తుంది.
- source_word: הַשְּׁאֵלָה אֲשֶׁר שָׁאַל לַיהוָה
  choice: యెహోవా కోసం అడిగి అప్పగించిన దానికి
  rationale: శאל ధాతువులోని ‘అడగడం’ మరియు సందర్భంలో యెహోవాకు సమర్పించడం/అప్పగించడం అనే పదప్రయోగ ప్రతిధ్వనిని సాధ్యమైనంతవరకు నిలుపుతుంది; సూచ్యార్థాన్ని ‘బిడ్డ’గా పూర్తిగా విప్పకుండా ‘దానికి’ అని ఉంచింది.
- source_word: וְהָלְכוּ לִמְקֹמוֹ
  choice: ఆ తర్వాత వారు తమ ఇంటికి వెళ్లేవారు
  rationale: క్రియ బహువచనం ఎల్కానా, అతని భార్య ఇద్దరినీ సూచిస్తుంది. ‘అతని స్థలానికి’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా ‘తమ ఇంటికి’ అని అందించాం; పునరావృత సందర్భాన్ని ‘వెళ్లేవారు’ నిలుపుతుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచుతూ, తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: אֲשֶׁר שָׁאַל లోని కర్త
  choice: తెలుగు ప్రధాన వాక్యంలో కర్తను పేర్కొనకుండా ‘అడిగి అప్పగించిన’
  alternative: ‘ఆమె యెహోవాను అడిగిన’ లేదా ‘అతడు యెహోవాను అడిగిన’
  rationale: హీబ్రూ క్రియ వ్యాకరణపరంగా పుంలింగ ఏకవచనం; అయితే కథాసందర్భం హన్నానే అడిగిన వ్యక్తిగా చూపుతుంది. ప్రధాన పాఠంలో కర్తను బలవంతంగా నిర్ణయించకుండా నిజమైన వ్యాకరణ-సందర్భ ఉద్రిక్తతను నిలిపి, పాదటిప్పణిలో వివరించాం.
- issue: הַשְּׁאֵלָה యొక్క సూచన
  choice: అడిగి అప్పగించిన దానికి
  alternative: విన్నపానికి / అడిగి పొందిన బిడ్డకు / అప్పుగా ఇచ్చిన దానికి
  rationale: ఈ నామవాచకం ‘అడుగు’ అనే ధాతువుతో పదప్రయోగ సంబంధం కలిగి ఉంది; సందర్భంలో సమూయేలును అడిగి పొంది యెహోవాకు అప్పగించడాన్ని ప్రతిధ్వనిస్తుంది. ఒక్క భావానికే పరిమితం చేయకుండా అస్పష్టతను కొంత నిలిపాం.
