    text: హీబ్రూ పదబంధాన్ని అక్షరార్థానికి దగ్గరగా ‘యెహోవా వద్ద అడిగిన విన్నపం స్థానంలో’ అని అనువదించవచ్చు. ‘విన్నపం’ అనే పదం ‘అడుగు’ అనే మూలపదంతో సంబంధం కలిగి ఉంది; సమూయేలు జననకథలో ఈ పదప్రయోగం, అడిగి పొందిన సమూయేలును యెహోవాకు అర్పించిన సందర్భాన్ని ప్రతిధ్వనిస్తుంది.
