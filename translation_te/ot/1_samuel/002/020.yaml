  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. వార్షికంగా పునరావృతమయ్యే చర్యను ‘చెప్పేవాడు/వెళ్లేవారు’తో చూపించాం. ప్రధాన పాఠంలో [a], [b] గుర్తులు రెండూ ఉన్నాయి.
