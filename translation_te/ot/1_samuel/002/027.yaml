  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֥א אִישׁ אֱלֹהִ֖ים אֶל עֵלִ֑י וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/נִגְלֹ֤ה נִגְלֵ֨יתִי֙ אֶל בֵּ֣ית אָבִ֔י/ךָ בִּֽ/הְיוֹתָ֥/ם בְּ/מִצְרַ֖יִם לְ/בֵ֥ית פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: te
  text: 'దేవుని మనిషి ఒకడు ఏలీ దగ్గరికి వచ్చి అతనితో ఇలా అన్నాడు: “యెహోవా ఇలా అంటున్నాడు: నీ తండ్రి ఇంటివారు ఐగుప్తులో ఫరో ఇంటివారిగా ఉన్నప్పుడు, నేను నిజంగానే వారికి ప్రత్యక్షం కాలేదా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ప్రవక్తగా దేవుని సందేశాన్ని మోసుకొచ్చే వ్యక్తిని సూచించే హీబ్రూ బిరుదును సూటిగా, సహజంగా నిలుపుతుంది.
- source_word: בֵּית אָבִיךָ
  choice: నీ పూర్వికుని కుటుంబం
  rationale: ఇక్కడ אָב ఏలీ వంశపు పూర్వికుడిని, בֵּית అతని కుటుంబం/వంశాన్ని సూచిస్తాయి; ‘నీ తండ్రి ఇల్లు’ అనే అసహజమైన అక్షరానువాదాన్ని నివారిస్తుంది.
- source_word: הֲנִגְלֹה נִגְלֵיתִי
  choice: నేను వారికి నన్ను స్పష్టంగా బయలుపరచుకోలేదా?
  rationale: అనంత క్రియారూపం మరియు సమాపక క్రియ కలయికలోని ఉద్ఘాటనను ‘స్పష్టంగా’ ద్వారా వ్యక్తం చేస్తూ, సమాధానం అవుననే భావాన్ని ఆశించే ప్రశ్నారూపాన్ని కాపాడుతుంది.
- source_word: לְבֵית פַּרְעֹה
  choice: ఫరో ఇంటివారికి లోబడి
  rationale: לְ సంబంధం సందర్భంలో ఇశ్రాయేలీయులు ఫరో రాజగృహ అధికార పరిధిలో ఉన్నారని సూచిస్తుంది; తెలుగులో ‘ఫరో ఇంటికి’ అన్నదానికంటే ఈ భావం స్పష్టంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ వ్యక్తినామమైన దైవనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో నిలుపుతుంది.
theological_decisions:
- issue: ప్రశ్నార్థక వాక్యంలోని దైవిక ప్రత్యక్షత
  choice: ‘నేను వారికి నన్ను స్పష్టంగా బయలుపరచుకోలేదా?’ అనే ఉద్ఘాటిత ప్రశ్న
  alternative: ‘నేను నిజంగా బయలుపరచుకున్నాను’ అనే ప్రకటన
  rationale: మూలంలోని הֲ ప్రశ్నార్థక నిర్మాణాన్ని, అలాగే נִגְלֹה נִגְלֵיתִי ఉద్ఘాటనను రెండింటినీ నిలుపుతుంది; వాక్యాన్ని వ్యాఖ్యానాత్మక ప్రకటనగా మార్చదు.
- issue: ‘నీ పూర్వికుని కుటుంబం’ యొక్క గుర్తింపు
  choice: ఆ పూర్వికుడు అహరోను అని వచనంలో చేర్చలేదు
  alternative: ‘నీ పూర్వికుడైన అహరోను కుటుంబం’
  rationale: తదుపరి సందర్భం యాజక వంశాన్ని సూచించినా, ఈ వచనంలోని హీబ్రూ పాఠం పూర్వికుని పేరు చెప్పదు; అందువల్ల అవసరం లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: ఫరో ఇంటితో సంబంధం
  choice: ‘ఫరో ఇంటివారికి లోబడి ఉన్నప్పుడు’
  alternative: ‘ఫరో ఇంటిలో ఉన్నప్పుడు’ లేదా ‘ఫరో ఇంటికి చెందినప్పుడు’
  rationale: హీబ్రూ సంక్షిప్త నిర్మాణం సంబంధ స్వభావాన్ని పూర్తిగా నిర్దిష్టం చేయదు. ఐగుప్తులో ఫరో అధికారం కింద ఉన్న భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, వారు అక్షరార్థంగా రాజభవనంలో నివసించారని చెప్పకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం వాడబడింది. ప్రవక్తీయ సందేశ సూత్రాన్ని ‘యెహోవా ఇలా అంటున్నాడు’గా నిలిపి, హీబ్రూ ప్రశ్నలోని ఉద్ఘాటనను సహజ తెలుగులో వ్యక్తం చేశాం.
