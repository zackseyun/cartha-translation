  to: 'దేవుని మనిషి ఒకడు ఏలీ దగ్గరికి వచ్చి అతనితో ఇలా అన్నాడు: “యెహోవా ఇలా అంటున్నాడు: నీ తండ్రి ఇంటివారు ఐగుప్తులో ఫరో ఇంటివారిగా ఉన్నప్పుడు, నేను నిజంగానే వారికి ప్రత్యక్షం కాలేదా?”'
