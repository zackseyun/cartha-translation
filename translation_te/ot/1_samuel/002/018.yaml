  yaml_path: translation/ot/1_samuel/002/018.yaml
  text: Samuel was ministering before Yahweh[a], a boy clothed with a linen ephod.
translation:
  language: te
  text: సమూయేలు యాహ్వే[a] సన్నిధిలో పరిచర్య చేస్తున్నాడు; అతడు నార ఏఫోదును ధరించిన బాలుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “యాహ్వే ముఖం/సన్నిధి ఎదుట.”'
    reason: హీబ్రూ నుడికారమైన אֶת פְּנֵי יְהוָה యొక్క అక్షరార్థ/ప్రత్యామ్నాయ భావాన్ని సూచించడానికి.
lexical_decisions:
- source_word: וּ/שְׁמוּאֵל
  choice: సమూయేలు
  rationale: ו అనే సంధానార్థక అవ్యయాన్ని తెలుగులో ప్రత్యేకంగా అనువదించకపోయినా సందర్భంలోని కథన అనుసంధానం నిలుస్తుంది; పేరును ప్రాచుర్యంలో ఉన్న తెలుగు రూపంలో ఇచ్చాం.
- source_word: מְשָׁרֵת
  choice: పరిచర్య చేస్తూ ఉన్నాడు
  rationale: ఈ కృదంతం కొనసాగుతున్న సేవను సూచిస్తుంది; ఆరాధనా సంబంధమైన సందర్భానికి ‘పరిచర్య’ తగినది.
- source_word: אֶת פְּנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ‘యెహోవా ముఖం/సన్నిధి ఎదుట’ అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో ‘సన్నిధిలో’ అని అనువదించాం.
- source_word: נַעַר
  choice: బాలుడు
  rationale: సమూయేలు చిన్నవాడని సహజంగా తెలియజేస్తుంది; సేవకుడు అనే అదనపు భావాన్ని చేర్చదు.
- source_word: חָגוּר
  choice: ధరించిన
  rationale: మూలంలోని ‘నడుముకు కట్టుకున్న’ భావాన్ని వస్త్ర సందర్భంలో సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֵפוֹד
  choice: ఏఫోదు
  rationale: ఇది నిర్దిష్టమైన ఇశ్రాయేలీయ ఆరాధనా వస్త్రం; ఖచ్చితమైన తెలుగు సమానార్థకం లేనందున లిప్యంతరీకరించాం.
- source_word: בָּד
  choice: నారతో చేసిన
  rationale: యాజక వస్త్ర సందర్భంలో ఈ పదం నార వస్త్ర పదార్థాన్ని సూచిస్తుంది; ‘శ్రేష్ఠమైన’ వంటి మూలంలో లేని విశేషణాన్ని చేర్చలేదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తినామంగానే ఉంచాం; తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని కొనసాగుతున్న చర్యను నిలుపుతూ, హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో అందించాం.
