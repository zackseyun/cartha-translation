id: 1SA.2.31
reference: 1 Samuel 2:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּה֙ יָמִ֣ים בָּאִ֔ים וְ/גָֽדַעְתִּי֙ אֶת זְרֹ֣עֲ/ךָ֔ וְ/אֶת זְרֹ֖עַ בֵּ֣ית אָבִ֑י/ךָ מִֽ/הְי֥וֹת זָקֵ֖ן בְּ/בֵיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
translation:
  language: te
  text: “ఇదిగో, రోజులు వచ్చుచున్నాయి; నేను నీ బలాన్ని, నీ పితృకుటుంబపు బలాన్ని[a] నరికివేస్తాను; ఫలితంగా నీ కుటుంబంలో వృద్ధుడెవడూ ఉండడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ బాహువును, నీ పితృకుటుంబపు బాహువును.” ఇక్కడ “బాహువు” బలం లేదా శక్తికి హీబ్రూ రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: గంభీరమైన ప్రవచన ప్రకటన వైపు శ్రద్ధను మళ్లించే హీబ్రూ సూచనాత్మక పదబలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יָמִים בָּאִים
  choice: రోజులు రాబోతున్నాయి
  rationale: రాబోయే తీర్పును ప్రకటించే సాధారణ ప్రవచన సూత్రాన్ని, దాని భవిష్యదర్థంతో సహా స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: גָדַעְתִּי
  choice: నేను నరికివేస్తాను
  rationale: మూల క్రియలోని నరికివేయడం లేదా పూర్తిగా తొలగించడం అనే బలమైన తీర్పు భావాన్ని నిలుపుతుంది.
- source_word: זְרֹעֲךָ
  choice: నీ బలాన్ని
  rationale: అక్షరార్థంగా ‘నీ బాహువును’ అయినా, ఇక్కడ బాహువు శక్తి లేదా సామర్థ్యానికి రూపకం; ‘బలం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: זְרֹעַ בֵּית אָבִיךָ
  choice: నీ పితృకుటుంబపు బలాన్ని
  rationale: ఏలీ పూర్వీకుల కుటుంబ వంశానికి చెందిన శక్తి, నిలకడను సూచించే సమాంతర రూపకాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: בֵּית אָבִיךָ
  choice: నీ పితృకుటుంబం
  rationale: కేవలం భవనాన్ని కాక పితృవంశ కుటుంబాన్ని సూచించే హీబ్రూ బంధుత్వ ప్రయోగానికి ఇది సహజమైన తెలుగు సమానం.
- source_word: מִהְיוֹת זָקֵן בְּבֵיתֶךָ
  choice: దాంతో నీ కుటుంబంలో వృద్ధుడెవడూ ఉండడు
  rationale: బలం నరికివేయబడటానికి కలిగే ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, కుటుంబంలోని పురుషులు వృద్ధాప్యానికి చేరరనే భావాన్ని నిలుపుతుంది.
- source_word: זָקֵן
  choice: వృద్ధుడు
  rationale: ఇక్కడ పదవి లేదా నాయకత్వ హోదా కాదు, ముదిరిన వయస్సుగల పురుషుడు ఉద్దేశం; ‘వృద్ధుడు’ గౌరవప్రదమైన ప్రామాణిక తెలుగు పదం.
theological_decisions:
- issue: తీర్పు ప్రవచనంలో ‘బాహువు’ అనే రూపకం
  choice: రెండు చోట్లా భావార్థంగా ‘బలం’ అని అనువదించడం
  alternative: రెండు చోట్లా అక్షరార్థంగా ‘బాహువు’ అని అనువదించడం
  rationale: హీబ్రూలో బాహువు సాధారణంగా శక్తి లేదా సామర్థ్యానికి రూపకం. ఏలీ కుటుంబంపై వచ్చిన ఈ తీర్పులో అధికారమూ వంశస్థైర్యమూ తొలగిపోవడం ప్రధాన భావం; వెంటనే వచ్చే ‘వృద్ధుడెవడూ ఉండడు’ అనే వాక్యం దీనిని బలపరుస్తుంది. ‘బలం’ అని అనువదించడం అదనపు సిద్ధాంతాన్ని చేర్చకుండా రూపక భావాన్ని ఆధునిక పాఠకులకు స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రవచన తీర్పుకు తగిన గంభీరతను నిలిపాం. ‘పితృకుటుంబం’ వంశపరమైన భావాన్ని, ‘వృద్ధుడు’ వయస్సును సూచిస్తాయి; హోదాపరమైన ‘పెద్ద’ అనే అర్థాన్ని నివారించాం.
