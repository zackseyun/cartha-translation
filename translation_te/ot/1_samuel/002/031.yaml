  source_fidelity: 'The Hebrew has a single continuous prophetic announcement: “Look, days are coming, and I will cut off your arm and the arm of your father''s house, so that no old man will be in your house.” The draft accurately conveys the metaphorical sense of “arm” as strength and correctly retains the male-specific “old man.” However, “రాబోతున్నాయి” can suggest imminence more strongly than the source, and “దాంతో” is slightly conversational for this solemn oracle.'
