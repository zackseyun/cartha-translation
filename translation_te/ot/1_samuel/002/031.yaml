    issue: “రోజులు రాబోతున్నాయి” adds a somewhat stronger sense of imminence than the Hebrew participial formula.
    rationale: יָמִים בָּאִים means literally “days are coming”; “రోజులు వచ్చుచున్నాయి” preserves the ongoing, forward-looking formula without implying that they are immediately about to arrive.
  - severity: low
    issue: “దాంతో” is somewhat colloquial and the period divides a syntactically continuous oracle.
    rationale: The Hebrew coordinates the coming days with the divine action and then states the result. A continuous sentence with “ఫలితంగా” better suits the prophetic register and expresses the result relation.
