  terminology: “బలం” is a defensible sense rendering of זְרוֹעַ, with the literal metaphor preserved in the footnote. “పితృకుటుంబం” appropriately conveys the ancestral household/line. “వృద్ధుడు” correctly denotes an aged man rather than an elder as an office.
  issues:
