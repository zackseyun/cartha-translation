reference: 1 Samuel 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוָ֞ה יֵחַ֣תּוּ מריב/ו על/ו בַּ/שָּׁמַ֣יִם יַרְעֵ֔ם יְהוָ֖ה יָדִ֣ין אַפְסֵי אָ֑רֶץ וְ/יִתֶּן עֹ֣ז לְ/מַלְכּ֔/וֹ וְ/יָרֵ֖ם קֶ֥רֶן מְשִׁיחֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
translation:
  language: te
  text: 'యెహోవాతో పోరాడేవారు[a] ఛిన్నాభిన్నమవుతారు;


    ఆకాశం నుండి[b] ఆయన వారిమీద ఉరుముతాడు.


    యెహోవా భూమి దిగంతాలకు తీర్పు తీర్చుతాడు;


    తన రాజుకు బలాన్ని అనుగ్రహిస్తాడు,


    తన అభిషిక్తుని[c] కొమ్మును పైకెత్తుతాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: “యెహోవా విరోధులు.” ఇక్కడి హెబ్రీ లిఖిత-పఠిత పాఠసంప్రదాయం ఆయనతో పోరాడేవారు లేదా ఆయనను ఎదిరించేవారు అనే భావాన్ని ఇస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా: “ఆకాశంలో.” ఉరుము వచ్చే మూలాన్ని తెలుగులో సహజంగా తెలిపేందుకు “ఆకాశం నుండి” అని అనువదించబడింది.'
    reason: lexical_alternative
  - marker: c
    text: “అభిషిక్తుడు” అనే పదానికి ఉన్న హెబ్రీ రూపమే “మెస్సీయ” అనే బిరుదుకు మూలం. ఇక్కడ అది యెహోవా అభిషేకించిన రాజును సూచిస్తుంది; మెస్సీయ బిరుదుతో దాని పదసంబంధాన్ని కూడా గమనించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దేవుని ప్రత్యేక నామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో నిలుపుతుంది.
- source_word: יֵחַתּוּ
  choice: ఛిన్నాభిన్నమవుతారు
  rationale: నిఫల్ రూపం ఇక్కడ ఓటమిలో విరగగొట్టబడడం లేదా పూర్తిగా కూల్చివేయబడడం అనే బలమైన భావాన్ని ఇస్తుంది.
- source_word: מריבו עליו (మసొరేటిక్ కతీవ్/కెరే సంప్రదాయం)
  choice: యెహోవాతో పోరాడేవారు
  rationale: దేవునికి వ్యతిరేకంగా వాదించే లేదా పోరాడే వారనే భావాన్ని సహజంగా వ్యక్తం చేస్తూ, పాఠంలోని రూపభేదాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: בַּשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: హెబ్రీలో అక్షరార్థంగా ‘ఆకాశంలో’ ఉన్నప్పటికీ, ఉరుము వచ్చే మూలాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘నుండి’ వాడబడింది.
- source_word: יַרְעֵם
  choice: ఆయన వారిమీద ఉరుముతాడు
  rationale: రעם ధాతువు ఉరుమడాన్ని సూచిస్తుంది; ప్రత్యర్థులపై దిశానిర్దేశితమైన దైవిక చర్యను ‘వారిమీద’ స్పష్టం చేస్తుంది.
- source_word: יָדִין אַפְסֵי אָרֶץ
  choice: భూమి దిగంతాలకు తీర్పు తీరుస్తాడు
  rationale: దేవుని న్యాయాధికారం భూమి అత్యంత సుదూర ప్రాంతాలవరకు వ్యాపిస్తుందనే విశ్వవ్యాప్త భావాన్ని నిలుపుతుంది.
- source_word: וְיִתֶּן עֹז לְמַלְכּוֹ
  choice: తన రాజుకు బలాన్ని అనుగ్రహిస్తాడు
  rationale: עֹז అనే బలం/శక్తి భావాన్నీ, ఇంకా రాజ్యవ్యవస్థ స్థాపించబడకముందే కవితలో కనిపించే ‘తన రాజు’ అనే ఉద్విగ్నతనూ యథాతథంగా ఉంచుతుంది.
- source_word: וְיָרֵם קֶרֶן
  choice: కొమ్మును పైకెత్తుతాడు
  rationale: బలం, ఘనత, విజయాన్ని సూచించే హెబ్రీ కవితా రూపకాన్ని వివరణాత్మక పదంతో భర్తీ చేయకుండా నిలుపుతుంది.
- source_word: מְשִׁיחוֹ
  choice: తన అభిషిక్తుని
  rationale: పదానికి ప్రత్యక్ష అర్థమైన ‘అభిషేకించబడినవాడు’ను ఇక్కడి రాజసంబంధ సందర్భంలో నిలుపుతూ, దాని మెస్సీయ సంబంధ ప్రతిధ్వనిని పాదసూచికలో సూచిస్తుంది.
theological_decisions:
- issue: מְשִׁיחוֹ అనే పదంలో తక్షణ రాజసంబంధ అర్థం మరియు మెస్సీయ సంబంధ ప్రతిధ్వని
  choice: తన అభిషిక్తుని
  alternative: తన మెస్సీయ యొక్క
  rationale: ‘తన రాజు’తో సమాంతరంగా ఉన్న ఈ సందర్భంలో ‘అభిషిక్తుడు’ ప్రత్యక్ష పదార్థాన్ని, చారిత్రక రాజసంబంధ సూచనను కాపాడుతుంది. అదే హెబ్రీ పదం ‘మెస్సీయ’ అనే బిరుదుకు మూలమైనందున ఆ ప్రాముఖ్యతను పాదసూచికలో తెలియజేస్తుంది; ఒకే సూచనను బలవంతంగా నిర్ణయించదు.
- issue: ఇశ్రాయేలులో రాజ్యవ్యవస్థ ఏర్పడకముందు ‘తన రాజు’ అనే ప్రస్తావన
  choice: తన రాజు
  alternative: తన పాలకుడు
  rationale: హెబ్రీ מֶלֶךְ స్పష్టంగా ‘రాజు’ అని అర్థం; కాలక్రమ సంబంధ ఉద్విగ్నతను సాఫీ చేయకుండా మూలపాఠంలోని రాజసంబంధ భాషను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణి వాడబడింది. ‘కొమ్ము’ అనే హెబ్రీ రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది. పాదసూచిక గుర్తులన్నీ ప్రధాన పాఠంలో సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
