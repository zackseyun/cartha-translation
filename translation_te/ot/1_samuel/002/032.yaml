id: 1SA.2.32
reference: 1 Samuel 2:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִבַּטְתָּ֙ צַ֣ר מָע֔וֹן בְּ/כֹ֥ל אֲשֶׁר יֵיטִ֖יב אֶת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה זָקֵ֛ן בְּ/בֵיתְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
translation:
  language: te
  text: ఇశ్రాయేలుకు ఆయన చేసే మేలంతటిలోనూ నివాసస్థలపు కష్టాన్ని నీవు చూస్తావు[a]. నీ వంశంలో ముసలివాడు ఎన్నటికీ ఉండడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నివాసస్థలంలో ఒక విరోధిని,” “పరిశుద్ధస్థలంలో కష్టాన్ని,” లేదా ఇలాంటి భావం; ఈ హీబ్రూ పదబంధం క్లిష్టమైనది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  choice: నీవు చూస్తావు
  rationale: נבט హిఫీల్ రూపం ‘చూడు, దృష్టిపెట్టు’ అనే భావాన్ని ఇస్తుంది. తీర్పును ఏలీ ప్రత్యక్షంగా చూడబోతున్నాడనే నేర భావాన్ని ఇది నిలుపుతుంది.
- source_word: צַר
  choice: కష్టం
  rationale: ఈ పదానికి ‘విరోధి’ లేదా ‘కష్టం/బాధ’ అనే అర్థాలు సాధ్యమైనవి. సందర్భంలో తీర్పువల్ల నివాసస్థలానికి సంబంధించిన కష్టమనే పఠనం ప్రధాన పాఠ్యంలో సహజంగా ఉంది; ఇతర సాధ్యతను పాదటిప్పణి నిలుపుతుంది.
- source_word: מָעוֹן
  choice: నివాసస్థలం
  rationale: మָעוֹן అంటే నివాసం లేదా నివాసస్థలం. సందర్భం ఆరాధనా స్థలాన్ని సూచించినా, ‘పరిశుద్ధస్థలం’ అని మరీ నిర్దిష్టం చేయకుండా మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు ఆయన చేసే మేలంతటిలోనూ
  rationale: మూలంలోని విస్తృత భావాన్నీ, మేలు చేసే కర్తను స్పష్టంగా పేర్కొనని నిర్మాణాన్నీ నిలుపుతుంది; సందర్భంలో ఆ కర్త దేవుడని సహజంగా అర్థమవుతుంది.
- source_word: זָקֵן
  choice: ముసలివాడు
  rationale: ఇక్కడ పదం పదవిగా ఉన్న ‘పెద్ద’ను కాక, వృద్ధాప్యానికి చేరిన పురుషుణ్ణి సూచిస్తుంది.
- source_word: בְּבֵיתְךָ
  choice: నీ వంశంలో
  rationale: בַּיִת ఇక్కడ భవనం కంటే ఏలీ కుటుంబ పరంపరను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి ఉద్దేశిత భావాన్ని ‘వంశం’ స్పష్టంగా అందిస్తుంది.
- source_word: כָּל הַיָּמִים
  choice: ఎన్నటికీ
  rationale: ‘అన్ని దినాలు’ అనే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం; నిరంతరంగా కొనసాగబోయే కుటుంబ తీర్పును సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: צַר מָעוֹן అనే క్లిష్ట పదబంధపు అర్థం
  choice: నివాసస్థలపు కష్టం
  alternative: నివాసస్థలంలో ఒక విరోధి; పరిశుద్ధస్థలంలో కష్టం
  rationale: హీబ్రూ పదబంధం వ్యాకరణపరంగానూ భావపరంగానూ క్లిష్టమైనది. ప్రధాన పాఠ్యం తక్కువ వ్యాఖ్యానంతో ‘కష్టం’ అనే భావాన్ని తీసుకుంటుంది; వ్యక్తిగత విరోధి లేదా పరిశుద్ధస్థల తీర్పు అని ఖచ్చితంగా నిర్ణయించకుండా ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకునికి అర్థమయ్యే శైలి. క్లిష్టమైన మొదటి భాగాన్ని ఉద్దేశపూర్వకంగా అతిగా వివరణాత్మకం చేయలేదు. ‘నీ వంశంలో’ అన్నది కుటుంబ పరంపర భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
