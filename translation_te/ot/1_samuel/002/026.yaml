source:
  edition: WLC
  text: וְ/הַ/נַּ֣עַר שְׁמוּאֵ֔ל הֹלֵ֥ךְ וְ/גָדֵ֖ל וָ/ט֑וֹב גַּ֚ם עִם יְהוָ֔ה וְ/גַ֖ם עִם אֲנָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/026.yaml
  text: The boy Samuel continued to grow, and he was good in the sight of both Yahweh and men[a][b].
translation:
  language: te
  text: బాలుడైన సమూయేలు అంతకంతకు ఎదుగుతూ, యహ్వే మెప్పునూ మనుషుల మెప్పునూ పొందుతూ వచ్చాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంతకంతకు ఎదుగుతూ, మంచివాడిగా ఉంటూ వచ్చాడు.” ఇది హీబ్రూ పదక్రమాన్నీ ‘మంచి’ అనే పదాన్నీ మరింత స్పష్టంగా నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ పదక్షరార్థం: “యహ్వేతోనూ మనుషులతోనూ.” ఇక్కడ “తో” అనేది వారి దృష్టిలో అనుకూలంగా లేదా ప్రీతికరంగా ఉండడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: బాలుడైన
  rationale: నַעַר అనేది బాలుడు, యువకుడు లేదా యువ సేవకుడు అనే అర్థాలు ఇవ్వగలదు. ఈ సందర్భంలో సమూయేలు ఇంకా చిన్నవాడిగా మందిరంలో సేవ చేస్తున్నందున ‘బాలుడైన’ అనేది సందర్భోచితం. ఆరంభంలోని וְ అనే అనుసంధానాన్ని తెలుగులో ప్రత్యేక పదంతో అనువదించకుండానే సహజ కథన ప్రవాహంలో వ్యక్తం చేశాం.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపాన్ని ఉంచాం.
- source_word: הֹלֵךְ וְגָדֵל
  choice: అంతకంతకు ఎదుగుతూ ... వచ్చాడు
  rationale: הֹלֵךְ తో కూడిన నిర్మాణం కొనసాగుతూ పురోగమించే భావాన్ని ఇస్తుంది. ‘అంతకంతకు ... వచ్చాడు’ ఆ దశలవారీ కొనసాగింపును సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וָטוֹב
  choice: మెప్పును పొందుతూ
  rationale: טוֹב ఇక్కడ עִם తో కలిసి సంబంధపరంగా ‘మంచిగా ఉండడం, అనుకూలంగా లేదా ప్రీతికరంగా ఉండడం’ అనే భావాన్ని ఇస్తుంది. దేవునికీ మనుషులకీ వర్తించే సహజ తెలుగు వ్యక్తీకరణగా ‘మెప్పును పొందుతూ’ ఎంచుకున్నాం; ‘మంచివాడిగా ఉంటూ’ అనే మరింత రూపసన్నిహిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: גַּם עִם יְהוָה וְגַם עִם אֲנָשִׁים
  choice: యహ్వే మెప్పునూ మనుషుల మెప్పునూ
  rationale: గַּם ... וְגַם సమతుల్యమైన ‘ఇద్దరి దగ్గరా/రెండింటిలోనూ’ భావాన్ని ఇస్తుంది. עִם సంబంధాన్ని సూచిస్తుంది. אֲנָשִׁים ను మూలంలోని సాధారణ మానవ సూచనకు అనుగుణంగా ‘మనుషులు’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ కు సమీపమైన తెలుగు లిప్యంతరీకరణగా ‘యహ్వే’ అని ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు; ‘Jehovah’ రూపానికి బదులుగా ‘Yahweh’ ఉచ్చారణకు సమీపమైన ‘యహ్వే’ రూపాన్ని వాడాం.
- issue: וָטוֹב עִם అనే సంబంధపరమైన భావం
  choice: మెప్పును పొందుతూ
  alternative: మంచివాడిగా ఉంటూ; అనుగ్రహం పొందుతూ
  rationale: ఈ పదబంధం సమూయేలు దేవునితోను మనుషులతోను అనుకూలంగా, ప్రీతికరంగా ఉన్నాడని సూచిస్తుంది. ‘అనుగ్రహం’ అనడం మూలంలో స్పష్టంగా లేని కృపాపరమైన భావాన్ని బలపరచవచ్చు; కాబట్టి ‘మెప్పు’ ఎంచుకొని, ‘మంచివాడిగా’ అనే రూపసన్నిహిత అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని వాడాం. ‘అంతకంతకు’ ద్వారా కొనసాగుతున్న పురోగతిని, ‘మెప్పును పొందుతూ’ ద్వారా దేవునితోను మనుషులతోను ఉన్న అనుకూల సంబంధాన్ని వ్యక్తం చేశాం. మూలంలోని ‘మంచి’ మరియు ‘తో’ అనే రూపాలను పాదసూచికల్లో భద్రపరిచాం.
