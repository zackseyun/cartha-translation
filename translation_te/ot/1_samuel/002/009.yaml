  variant: modern standard Telugu
source:
  edition: WLC
  text: רַגְלֵ֤י חסיד/ו יִשְׁמֹ֔ר וּ/רְשָׁעִ֖ים בַּ/חֹ֣שֶׁךְ יִדָּ֑מּוּ כִּֽי לֹ֥א בְ/כֹ֖חַ יִגְבַּר אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
translation:
  language: te
  text: 'ఆయన తన నమ్మకమైనవారి పాదాలను కాపాడుతాడు[a];

    కాని దుష్టులు చీకటిలో నిశ్శబ్దమవుతారు[b].

    ఎందుకంటే బలంతో మనిషి విజయం సాధించడు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పాఠ సంప్రదాయంలో దీనిని ఏకవచనంగా కూడా చదవవచ్చు: ‘తన నమ్మకమైనవాని పాదాలను.’ అయితే కవితా సమాంతరతకు, ఉద్దేశించిన సమూహార్థానికి సరిపోవడంతో ఇక్కడ బహువచనం తీసుకోబడింది.'
    reason: textual_variant
  - marker: b
    text: లేదా, ‘నిశ్చలమవుతారు’; హీబ్రూ క్రియ మౌనమవడం లేదా నిశ్చలమవడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: c
    text: ‘మనిషి’కి మూలమైన హీబ్రూ పదం వ్యాకరణపరంగా పురుషలింగ ఏకవచనం; ఇక్కడ అది సాధారణ ప్రతినిధి అర్థంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  choice: పాదాలను
  rationale: ‘పాదాలు’ అనే స్పష్టమైన హీబ్రూ రూపకాన్ని నిలుపుతుంది; ‘అడుగులు’ అనేది సాధ్యమైన భావానువాదమైనా, మూలంలోని శరీరాంగ చిత్రాన్ని తగ్గిస్తుంది.
- source_word: חסידו
  choice: తన నమ్మకమైనవారి
  rationale: חסיד అనే పదంలోని నిబద్ధత, విశ్వసనీయత భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాతి కాలపు మతపరమైన ప్రత్యేకార్థాలు కలిగే పదాలను నివారిస్తుంది. సందర్భం, కవితా సమాంతరత దృష్ట్యా సమూహార్థక బహువచనం స్వీకరించబడింది.
- source_word: יִשְׁמֹר
  choice: కాపాడుతాడు
  rationale: దేవుని సంరక్షణ భావాన్ని సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וּרְשָׁעִים
  choice: కాని దుష్టులు
  rationale: వావ్ సంధి ఇక్కడ నమ్మకమైనవారికీ దుష్టులకీ మధ్య వ్యతిరేకతను చూపుతుంది; అందువల్ల ‘కాని’ అనుకూలం.
- source_word: בַּחֹשֶׁךְ
  choice: చీకటిలో
  rationale: తీర్పు, అంధకారం అనే కవితాత్మక చిత్రాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יִדָּמּוּ
  choice: నిశ్శబ్దమవుతారు
  rationale: דמם నిఫాల్ రూపం మౌనమవడం లేదా నిశ్చలమవడం అనే భావాలను కలిగి ఉంది. ప్రధాన పాఠంలో మౌన భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో చూపించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా ఆధారం తెలిపే సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא בְכֹחַ
  choice: బలంతో ... కాదు
  rationale: כֹּחַ లోని శక్తి/బలం భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: יִגְבַּר
  choice: విజయం సాధించడు
  rationale: కేవలం బలంగా ఉండడం కాక, పైచేయి పొందడం లేదా నెగ్గడం అనే సందర్భోచిత భావాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: אִישׁ
  choice: మనిషి
  rationale: హీబ్రూలోని ఏకవచన ప్రతినిధి ప్రయోగాన్ని సహజమైన తెలుగు సామాన్యార్థక పదంతో వ్యక్తం చేస్తుంది; అది పురుషలింగ రూపమని పాదసూచికలో తెలియజేయబడింది.
theological_decisions:
- issue: חסידו పదంలోని వచనం మరియు భావం
  choice: 'సమూహార్థక బహువచనం: ‘తన నమ్మకమైనవారి’'
  alternative: 'ఏకవచనం: ‘తన నమ్మకమైనవాని’'
  rationale: లిఖిత/పఠిత పాఠ సంప్రదాయం వచన విషయంలో భేదానికి అవకాశం ఇస్తుంది. దుష్టులు అనే బహువచన సమాంతరత, ప్రాచీన పాఠ సాక్ష్యాల దృష్ట్యా ప్రధాన పాఠంలో బహువచనం తీసుకున్నాం; ఏకవచనాన్ని పాదసూచికలో నిలిపాం.
- issue: אִישׁ యొక్క ప్రతినిధి ప్రయోగం
  choice: ‘మనిషి’ అనే సామాన్యార్థక ఏకవచనం
  alternative: ‘ఒక పురుషుడు’
  rationale: మూలంలో వ్యాకరణపరంగా పురుషలింగ ఏకవచనం ఉన్నా, వాక్యం సాధారణ సూత్రంగా పనిచేస్తుంది. తెలుగులో ‘మనిషి’ ఆ సామాన్యార్థాన్ని సహజంగా తెలియజేస్తుంది; మూలరూపాన్ని పాదసూచికలో పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా వాక్య నిర్మాణం వాడబడింది. ‘పాదాలు,’ ‘చీకటి,’ ‘బలం’ అనే మూల చిత్రాలు నిలుపబడ్డాయి. పాఠభేదం మరియు דמם క్రియలోని నిజమైన భావవిస్తృతి పాదసూచికల్లో స్పష్టంగా సంరక్షించబడ్డాయి.
