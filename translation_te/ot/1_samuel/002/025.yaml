  to: ఒక మనిషి మరొక మనిషికి విరోధంగా పాపం చేస్తే, దేవుడు[a] అతని విషయంలో తీర్పు తీరుస్తాడు. అయితే ఒక మనిషి యెహోవాకు విరోధంగా పాపం చేస్తే, అతని కోసం ఎవరు ప్రార్థిస్తారు?[b] అయినా వారు తమ తండ్రి మాట వినడానికి ఒప్పుకోలేదు; ఎందుకంటే యెహోవా వారిని చంపాలని కోరుకున్నాడు.
