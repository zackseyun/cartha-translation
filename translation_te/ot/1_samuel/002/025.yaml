id: 1SA.2.25
reference: 1 Samuel 2:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
translation:
  language: te
  text: ఒక మనిషి మరొక మనిషికి విరోధంగా పాపం చేస్తే, దేవుడు[a] అతని విషయంలో తీర్పు తీరుస్తాడు. అయితే ఒక మనిషి యెహోవాకు విరోధంగా పాపం చేస్తే, అతని కోసం ఎవరు ప్రార్థిస్తారు?[b] అయినా వారు తమ తండ్రి మాట వినడానికి ఒప్పుకోలేదు; ఎందుకంటే యెహోవా వారిని చంపాలని కోరుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘న్యాయాధిపతులు అతని విషయంలో తీర్పు తీరుస్తారు.’ హీబ్రూ אֱלֹהִים కొన్ని సందర్భాల్లో మానవ న్యాయాధిపతులను సూచించవచ్చు. అయితే ఇక్కడ యెహోవాతో ఉన్న వ్యత్యాసం కారణంగా ప్రధాన పాఠంలో ‘దేవుడు’ అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘అతని కోసం ఎవరు విజ్ఞాపన చేస్తారు?’ హీబ్రూ క్రియకు ప్రార్థించడం లేదా ఒకరి పక్షంగా విజ్ఞాపన చేయడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: పాపం చేస్తే
  rationale: חטא అనే క్రియలోని నైతిక, ధార్మిక బలాన్ని ‘పాపం చేయడం’ సహజంగా నిలుపుతుంది.
- source_word: אִישׁ לְאִישׁ
  choice: ఒక మనిషి మరొక మనిషికి విరోధంగా
  rationale: హీబ్రూ పుంలింగ ఏకవచన నిర్మాణాన్ని, వ్యక్తుల మధ్య జరిగిన అపరాధ భావాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: וּפִלְלוֹ אֱלֹהִים
  choice: దేవుడు అతని కోసం మధ్యవర్తిగా వ్యవహరిస్తాడు
  rationale: పియేల్ రూపంలోని న్యాయనిర్ణయ–మధ్యవర్తిత్వ భావాన్ని నిలుపుతూ, కేవలం దోషిగా తీర్పు ఇవ్వడమే అన్న భావాన్ని రానివ్వదు.
- source_word: לַיהוָה
  choice: యెహోవాకు విరోధంగా
  rationale: לְ ఉపసర్గ అపరాధం ఎవరికి విరోధంగా జరిగిందో సూచిస్తుంది; దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: מִי יִתְפַּלֶּל לוֹ
  choice: అతని కోసం ఎవరు ప్రార్థిస్తారు?
  rationale: హిత్పయేల్ రూపానికి సహజమైన ‘ప్రార్థించడం’ అనే భావాన్ని, ప్రశ్నలోని తీవ్రతను నిలుపుతుంది; ‘విజ్ఞాపన/మధ్యవర్తిత్వం’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם
  choice: వారు తమ తండ్రి మాట వినడానికి ఒప్పుకోలేదు
  rationale: కేవలం వినకపోవడం కాక ఉద్దేశపూర్వక నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי חָפֵץ יְהוָה לַהֲמִיתָם
  choice: ఎందుకంటే యెహోవా వారిని చంపాలని కోరుకున్నాడు
  rationale: חפץ లోని ‘కోరడం/సంకల్పించడం’ భావాన్ని మెత్తబరచకుండా, מות హిఫీల్‌లోని మరణింపజేసే కారక భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలుపుతుంది.
theological_decisions:
- issue: మొదటి వాక్యభాగంలోని אֱלֹהִים అర్థం
  choice: దేవుడు
  alternative: న్యాయాధిపతులు
  rationale: మనిషికి విరోధంగా చేసిన పాపం మరియు యెహోవాకు విరోధంగా చేసిన పాపం మధ్య ఉన్న వ్యత్యాసానికి ‘దేవుడు’ బాగా సరిపోతుంది. అయితే ‘న్యాయాధిపతులు’ అనే చారిత్రకంగా సమర్థితమైన పఠనాన్ని పాదసూచికలో నిలిపాం.
- issue: כִּי חָפֵץ יְהוָה לַהֲמִיתָם లోని దైవ సంకల్పం
  choice: యెహోవా వారిని చంపాలని కోరుకున్నాడు
  alternative: యెహోవా వారిని చంపాలని నిర్ణయించాడు
  rationale: వాక్యం దైవ సంకల్పాన్ని బలంగా చెబుతుంది. ‘కోరుకున్నాడు’ మూలపదానికి దగ్గరగా ఉండి, దైవ సార్వభౌమత్వం మరియు మానవ బాధ్యత మధ్య ఉన్న ఉద్రిక్తతను వివరణతో తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని ఉపయోగించాం. ‘తండ్రి స్వరం’ అనే పదానువాదం బదులు సహజమైన ‘తండ్రి మాట’ వాడాం. చివరి వాక్యంలోని కఠినమైన దైవ తీర్పును మెత్తబరచకుండా నేరుగా ఉంచాం.
