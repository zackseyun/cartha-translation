id: 1SA.2.6
reference: 1 Samuel 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוָ֖ה מֵמִ֣ית וּ/מְחַיֶּ֑ה מוֹרִ֥יד שְׁא֖וֹל וַ/יָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/006.yaml
  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
translation:
  language: te
  text: 'యెహోవా చంపుతాడు, బతికిస్తాడు;

    షెయోల్‌కు[a] దింపుతాడు, పైకి లేపుతాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘షెయోల్’ అంటే మృతుల లోకం; దీనికి ‘సమాధి’ అని కూడా అర్థం కావచ్చు. ఈ హెబ్రీ పదాన్ని తప్పనిసరిగా ‘నరకం’ అని అర్థం చేసుకోకూడదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: מֵמִית
  choice: చంపుతాడు
  rationale: מות యొక్క హిఫీల్ కారణార్థక భావాన్ని నేరుగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּמְחַיֶּה
  choice: బతికిస్తాడు
  rationale: חיה రూపంలోని కారణార్థక భావాన్ని కాపాడుతూ, ‘చంపుతాడు’తో సమాంతరంగా సహజంగా వినిపిస్తుంది; పునరుత్థానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: מוֹרִיד
  choice: దింపుతాడు
  rationale: ירד యొక్క కారణార్థక భావాన్ని, దేవుని క్రియాశీల అధికారాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁאוֹל
  choice: పాతాళం
  rationale: మృతుల లోకాన్ని సూచించే హెబ్రీ భావానికి తెలుగు బైబిలు వాడుకలో స్థిరమైన సమానార్థకం; దీన్ని స్వయంచాలకంగా ‘నరకం’గా పరిమితం చేయదు.
- source_word: וַיָּעַל
  choice: పైకి లేపుతాడు
  rationale: ‘దింపుతాడు’కు కవితాత్మక ప్రతిసమాంతరంగా ఉండి, షెయోల్ నుండి పైకి తేవడం అనే భావాన్ని కాపాడుతుంది; శరీర పునరుత్థానాన్ని మాత్రమే నిర్దేశించదు.
theological_decisions:
- issue: ఈ వాక్యాన్ని స్పష్టమైన శరీర పునరుత్థాన భాషలో అనువదించాలా?
  choice: ‘బతికిస్తాడు’, ‘పైకి లేపుతాడు’ అనే విస్తృతమైన కవితాత్మక భాషను ఉంచడం.
  alternative: ‘మృతులలోనుండి పునరుత్థానం చేస్తాడు’ అని స్పష్టీకరించడం.
  rationale: హెబ్రీ పాఠం మరణం మరియు షెయోల్‌పై యెహోవా అధికారాన్ని ప్రకటిస్తుంది; అయితే అది శరీర పునరుత్థానాన్ని మాత్రమే నిర్దిష్టంగా చెప్పదు. అందువల్ల మూలంలోని విస్తృతి, ఉద్వేగం అలాగే నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, హన్నా గీతంలోని సంక్షిప్త కవితాత్మక సమాంతర నిర్మాణాన్ని కాపాడాం. ‘చంపుతాడు/బతికిస్తాడు’ మరియు ‘దింపుతాడు/పైకి లేపుతాడు’ అనే జతలు మూలంలోని కారణార్థక విరుద్ధ సమాంతరతను సహజంగా వ్యక్తం చేస్తాయి.
