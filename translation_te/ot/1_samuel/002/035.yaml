language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲקִימֹתִ֥י לִ/י֙ כֹּהֵ֣ן נֶאֱמָ֔ן כַּ/אֲשֶׁ֛ר בִּ/לְבָבִ֥/י וּ/בְ/נַפְשִׁ֖/י יַעֲשֶׂ֑ה וּ/בָנִ֤יתִי ל/וֹ֙ בַּ֣יִת נֶאֱמָ֔ן וְ/הִתְהַלֵּ֥ךְ לִ/פְנֵֽי מְשִׁיחִ֖/י כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
translation:
  language: te
  text: నేను నా కొరకు నమ్మకమైన యాజకుణ్ణి నిలబెడతాను[a]. అతడు నా హృదయంలోను నా ప్రాణంలోను ఉన్నదానికి అనుగుణంగా చేస్తాడు. నేను అతని కొరకు స్థిరమైన గృహాన్ని కడతాను[b]. అతడు నా అభిషిక్తుని ఎదుట ఎల్లప్పుడూ నడుస్తాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా కొరకు నమ్మకమైన యాజకుణ్ణి నియమిస్తాను.”
    reason: హెబ్రీ క్రియ ఒకరిని నిలబెట్టడం, స్థాపించడం లేదా పదవిలో నియమించడం అనే భావాలను కలిగి ఉంది.
  - marker: b
    text: “స్థిరమైన గృహం” అంటే నిలిచే కుటుంబం లేదా వంశపరంపర కావచ్చు.
    reason: ‘గృహం’ ఇక్కడ కేవలం భవనాన్ని కాక కుటుంబం లేదా యాజక వంశాన్ని సూచించే రూపకం.
  - marker: c
    text: “నా అభిషిక్తుడు” అనే మాటను “నా మెస్సీయ” అని కూడా అనువదించవచ్చు; ఈ సందర్భంలో “నా రాజు” అనే భావం ఉండవచ్చు.
    reason: మషీయఖ్ అనే హెబ్రీ పదం అభిషేకించబడిన వ్యక్తిని సూచిస్తుంది; సందర్భం దాని నిర్దిష్ట సూచనను పూర్తిగా తేల్చదు.
lexical_decisions:
- source_word: וַהֲקִימֹתִי
  choice: నియమిస్తాను
  rationale: ఈ సందర్భంలో హిఫీల్ రూపం ఒక వ్యక్తిని పదవిలో నిలబెట్టడం లేదా నియమించడం సూచిస్తుంది. తెలుగు సహజ వాడుకలో ‘నియమిస్తాను’ యాజక పదవిని స్పష్టంగా తెలియజేస్తుంది; ‘లేపుతాను’ అనే అక్షరార్థం కలిగించే అపార్థాన్ని నివారిస్తుంది.
- source_word: לִי
  choice: నా కోసం
  rationale: దైవిక చొరవతో తన సేవకై యాజకుణ్ణి నియమించడాన్ని మొదటి పురుష దత్తివాచకం సూచిస్తుంది.
- source_word: כֹּהֵן נֶאֱמָן
  choice: నమ్మకమైన యాజకుడు
  rationale: נֶאֱמָן విశ్వసనీయతను, విధేయతను సూచిస్తుంది. ‘నమ్మకమైన’ అనే పదం ఈ రెండు భావాలను సహజంగా మోస్తుంది.
- source_word: כַּאֲשֶׁר בִּלְבָבִי וּבְנַפְשִׁי
  choice: నా హృదయంలో, నా ప్రాణంలో ఉన్నదాని ప్రకారం
  rationale: దైవ సంకల్పాన్ని తెలిపే హృదయం–ప్రాణం జంటను తగ్గించకుండా, మూలంలోని మానవరూపక భాషను నిలుపుతుంది.
- source_word: וּבָנִיתִי לוֹ בַּיִת נֶאֱמָן
  choice: నేను అతనికి స్థిరమైన గృహాన్ని కట్టిస్తాను
  rationale: ‘కట్టు’ అనే రూపకాన్ని నిలుపుతూ, ఇక్కడ נֶאֱמָן గృహం లేదా వంశం నిలకడగా కొనసాగడాన్ని సూచించే భావాన్ని ‘స్థిరమైన’ సహజంగా అందిస్తుంది.
- source_word: וְהִתְהַלֵּךְ לִפְנֵי
  choice: సన్నిధిలో నడుస్తాడు
  rationale: హిత్పయేల్ రూపంలోని నిరంతర ప్రవర్తన లేదా సేవ భావాన్ని ‘నడుస్తాడు’ నిలుపుతుంది; לִפְנֵי యొక్క సన్నిధి/సేవ సంబంధాన్ని ‘సన్నిధిలో’ తెలియజేస్తుంది.
- source_word: מְשִׁיחִי
  choice: నా అభిషిక్తుడు
  rationale: పదానికి ప్రాథమిక అర్థమైన ‘అభిషేకించబడినవాడు’ను నిలుపుతుంది; సందర్భాన్ని ముందుగానే ‘మెస్సీయ’ లేదా ‘రాజు’గా పరిమితం చేయదు.
- source_word: כָּל הַיָּמִים
  choice: ఎల్లకాలం
  rationale: అక్షరార్థంగా ‘అన్ని దినాలు’; సందర్భంలో నిరంతర లేదా జీవితాంత సేవను తెలిపే సహజ తెలుగు రూపం.
theological_decisions:
- issue: ‘నా అభిషిక్తుడు’ అనే పదబంధం ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠంలో ‘నా అభిషిక్తుడు’ అని సాధారణంగా ఉంచడం
  alternative: ‘నా మెస్సీయ’ లేదా సందర్భానుసారం ‘నా రాజు’
  rationale: తక్షణ చారిత్రక సందర్భంలో ఇది యెహోవా అభిషేకించిన పాలకుణ్ణి సూచించవచ్చు; విస్తృత గ్రంథసందర్భంలో మెస్సీయ సంబంధమైన ప్రతిధ్వని ఉండవచ్చు. ప్రధాన పాఠం ఏ ఒక్క గుర్తింపునూ బలవంతంగా నిర్ణయించదు.
- issue: ‘స్థిరమైన గృహం’ యొక్క భావం
  choice: గృహం అనే రూపకాన్ని ప్రధాన పాఠంలో నిలుపుతూ ‘స్థిరమైన’ అని అనువదించడం
  alternative: ‘నమ్మకమైన గృహం’ లేదా ‘నిలిచే వంశం’
  rationale: ‘గృహం’ కుటుంబం, వంశం లేదా యాజక పరంపరను సూచించగలదు. ‘స్థిరమైన’ దాని కొనసాగింపును తెలియజేస్తుంది; అడుగుటిప్పణి రూపకార్థాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హృదయం–ప్రాణం, గృహం, నడవడం వంటి హెబ్రీ రూపకాలను సాధ్యమైనంతవరకు నిలిపి, అస్పష్టతలను అడుగుటిప్పణుల్లో చూపించాం.
