  text: וַ/תִּתְפַּלֵּ֤ל חַנָּה֙ וַ/תֹּאמַ֔ר עָלַ֤ץ לִבִּ/י֙ בַּֽ/יהוָ֔ה רָ֥מָה קַרְנִ֖/י בַּֽ/יהוָ֑ה רָ֤חַב פִּ/י֙ עַל א֣וֹיְבַ֔/י כִּ֥י שָׂמַ֖חְתִּי בִּ/ישׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
translation:
  language: te
  text: 'హన్నా ప్రార్థించి ఇలా అంది:


    “యాహ్వేలో నా హృదయం ఉప్పొంగుతోంది;

    యాహ్వేలో నా కొమ్ము పైకెత్తబడింది.[a]

    నా శత్రువుల మీద నా నోరు వెడల్పుగా తెరుచుకుంది.[b]

    ఎందుకంటే నీ రక్షణలో నేను ఆనందిస్తున్నాను.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కొమ్ము’ అనేది బలం, గౌరవం లేదా ఉన్నత స్థితిని సూచించే హీబ్రూ రూపకం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘నా శత్రువులపై నేను గొప్పగా మాట్లాడుతున్నాను,’ లేక ‘నా శత్రువులకు ఎదురుగా నేను ధైర్యంగా మాట్లాడుతున్నాను.’ హీబ్రూలో అక్షరార్థంగా ‘నా శత్రువుల మీద నా నోరు వెడల్పుగా తెరుచుకుంది’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నీ విడుదలలో.’ హీబ్రూ పదం విస్తృతార్థంలో రక్షణను లేదా కష్టంనుంచి నిర్దిష్టమైన విడుదలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  choice: ప్రార్థించి
  rationale: פלל హిత్పయేల్ రూపం సాధారణంగా ‘ప్రార్థించు’ అని అర్థం. తరువాతి మాటలు కవితాత్మక స్తుతిగా ఉన్నప్పటికీ, కథన క్రియ వాటిని ప్రార్థనగా పరిచయం చేస్తుంది.
- source_word: וַתֹּאמַר
  choice: ఇలా అంది
  rationale: ఇది సాధారణంగా ‘చెప్పింది’ అనే క్రియ. ఇక్కడ పాడటానికి ప్రత్యేకమైన క్రియ వాడబడలేదు; తెలుగులో సహజమైన పరిచయంగా ‘ఇలా అంది’ అని అనువదించబడింది.
- source_word: עָלַץ לִבִּי
  choice: నా హృదయం ఉప్పొంగుతోంది
  rationale: עָלַץ ఉల్లాసంతో పొంగిపొర్లే ఆనందాన్ని సూచిస్తుంది. ‘ఉప్పొంగుతోంది’ అనే పదం కవితాత్మక బలాన్ని, హృదయమే కర్తగా ఉన్న మూలవాక్య చిత్రాన్ని నిలుపుతుంది.
- source_word: בַּיהוָה
  choice: యాహ్వేలో
  rationale: ב ఇక్కడ ఆనందం మరియు ఘనతకు ఆధారమైన పరిధిని సూచిస్తుంది. ‘యాహ్వేలో’ మూలంలోని సంక్షిప్త నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ మూలంలో ఉన్న దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
- source_word: רָמָה קַרְנִי
  choice: నా కొమ్ము పైకెత్తబడింది
  rationale: ‘కొమ్ము’ బలం, గౌరవం లేదా ఉన్నత స్థితికి హీబ్రూ రూపకం. దాన్ని ‘బలం’ అని వ్యాఖ్యానించి మార్చకుండా కవితాత్మక చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: רָחַב פִּי עַל אֹיְבַי
  choice: నా శత్రువుల మీద నా నోరు వెడల్పుగా తెరుచుకుంది
  rationale: హీబ్రూ వాక్యం నోరు వెడల్పుగా తెరుచుకోవడం అనే శరీరరూపకంతో ధైర్యమైన విజయోత్సాహపు మాటను వ్యక్తం చేస్తుంది. మూలచిత్రాన్ని నిలిపి, భావవ్యాఖ్యానాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי హన్నా ఆనందానికి, ధైర్యమైన మాటకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: שָׂמַחְתִּי
  choice: నేను ఆనందిస్తున్నాను
  rationale: పూర్తిక్రియా రూపం కవితా సందర్భంలో ఫలితంగా కొనసాగుతున్న ఆనందస్థితిని తెలుపగలదు. ఆధునిక తెలుగులో ‘ఆనందిస్తున్నాను’ సహజంగా ఆ స్థితిని వ్యక్తం చేస్తుంది.
- source_word: בִּישׁוּעָתֶךָ
  choice: నీ రక్షణలో
  rationale: יְשׁוּעָה విస్తృతమైన రక్షణను లేదా నిర్దిష్టమైన విమోచనను సూచించగలదు. ‘రక్షణ’ విస్తృత భావాన్ని నిలుపుతుండగా, ‘విడుదల’ సాధ్యమైన ప్రత్యామ్నాయంగా పాదసూచికలో ఉంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలవాక్యంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించడం మూలానికి పారదర్శకంగా ఉంటుంది.
- issue: יְשׁוּעָה యొక్క విస్తృతి
  choice: రక్షణ
  alternative: విడుదల
  rationale: హన్నా అనుభవించిన నిర్దిష్ట దైవిక సహాయం సందర్భంలో ఉన్నప్పటికీ, హీబ్రూ పదానికి రక్షణ అనే విస్తృత భావం కూడా ఉంది. ప్రధాన పాఠ్యం ఆ విస్తృతిని నిలుపుతుంది; నిర్దిష్ట భావాన్ని పాదసూచిక సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. సమాంతర పాదాలను నిలిపి, ‘హృదయం ఉప్పొంగడం,’ ‘కొమ్ము పైకెత్తబడడం,’ ‘నోరు వెడల్పుగా తెరుచుకోవడం’ వంటి హీబ్రూ శరీరరూపకాలను సాధ్యమైనంత పారదర్శకంగా ఉంచాం. అస్పష్టత లేదా ప్రత్యామ్నాయ భావం ఉన్న చోట పాదసూచికలను జోడించాం.
