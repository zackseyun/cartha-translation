review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the sacrifice/offering pair, the contemptuous force of תבעṭו, the singular address to Eli after the plural opening, the plural self-enrichment, and the likely ‘first/choice portion’ sense. ‘Israel brings’ slightly adds an action not expressed by the Hebrew; ‘Israel, my people’ is better retained as the source’s possessive/appositional identification. The difficult מעון relation is appropriately left open, but the footnote should describe the Hebrew more precisely.
  naturalness: 'The main issue is punctuation and syntax: the first question is closed after ‘అవమానిస్తున్నారు,’ leaving the following singular-to-plural participial sequence as an incomplete second question. Keeping the entire accusation within one question makes the Telugu coherent while preserving the Hebrew’s number shifts. Moving footnote b to the phrase it explains also improves anchoring.'
  terminology: ‘బలి,’ ‘అర్పణ,’ ‘గౌరవం,’ and ‘కొవ్వబెట్టుకోవడం’ are suitable in modern standard Telugu and preserve the cultic and accusatory register. ‘నివాసస్థలానికి సంబంధించి’ is intentionally cautious, though somewhat formal; it is acceptable in this textual-critical context.
  issues:
  - severity: medium
    issue: The question is incorrectly split after the opening plural clause.
    rationale: The Hebrew poses one continuing rhetorical question, moving from plural ‘you all’ to singular Eli and then plural ‘yourselves.’ The Telugu full stop/question mark after ‘అవమానిస్తున్నారు’ makes the rest syntactically disconnected.
  - severity: low
    issue: ‘ఇశ్రాయేలు తెచ్చే’ adds an explicit verbal notion absent from the source.
    rationale: The Hebrew says ‘every offering of Israel, my people.’ Using ‘నా ప్రజలైన ఇశ్రాయేలు యొక్క ప్రతి అర్పణ’ is closer and remains natural.
  - severity: low
