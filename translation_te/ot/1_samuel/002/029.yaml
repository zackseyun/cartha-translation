base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
translation:
  language: te
  text: “నివాసస్థలానికి సంబంధించి నేను ఆజ్ఞాపించిన[b] నా బలిని, నా అర్పణను మీరు ఎందుకు అవమానిస్తున్నారు[a], నీవు నీ కుమారులను నాకంటే ఎక్కువగా గౌరవిస్తూ, నా ప్రజలైన ఇశ్రాయేలు యొక్క ప్రతి అర్పణలోని ప్రథమ భాగంతో మిమ్మల్ని మీరు కొవ్వబెట్టుకుంటున్నారు[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “కాలితో తన్నుతున్నారు.” అంటే దేవుడు ఆజ్ఞాపించిన బలి అర్పణలను తిరస్కారంగా చూస్తున్నారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘నేను ఆజ్ఞాపించిన’ అనే మాటకు ‘నివాసస్థలం’ అనే పదానికి మధ్య సంబంధం సంక్షిప్తంగా ఉంది. దీన్ని “నివాసస్థలంలో నేను ఆజ్ఞాపించిన” లేదా “నివాసస్థలం కోసం నేను ఆజ్ఞాపించిన” అని కూడా అర్థం చేసుకోవచ్చు. ‘నివాసస్థలం’ దేవుని పరిశుద్ధస్థలాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: “ప్రథమ భాగం” ఇక్కడ “శ్రేష్ఠమైన భాగం” లేదా “ఎంపికైన భాగం” అని కూడా అర్థం కావచ్చు; భావం, ఆ భాగాలతో తమను తాము బాగా పోషించుకోవడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְעֲטוּ
  choice: అవమానిస్తున్నారు
  rationale: ఈ క్రియ అక్షరార్థంగా ‘కాలితో తన్నడం’ అనే బలమైన చిత్రాన్ని ఇస్తుంది; ఇక్కడ అది దేవుడు ఆజ్ఞాపించిన వాటిని తిరస్కారంగా చూడడాన్ని సూచిస్తుంది. సహజమైన తెలుగు ప్రధాన పాఠంలో భావాన్ని ఉంచి, చిత్రాన్ని పాదసూచికలో నిలిపాం.
- source_word: זִבְחִי
  choice: నా బలి
  rationale: జంతువును వధించి అర్పించే బలిని సాధారణంగా సూచిస్తుంది; ‘బలి’ సహజమైనదీ సందర్భానికి తగినదీ.
- source_word: מִנְחָתִי
  choice: నా అర్పణ
  rationale: ఈ పదం ధాన్యార్పణను ప్రత్యేకంగా సూచించగలిగినా, ఇక్కడ బలితో జతగా విస్తృత అర్థంలో ఉంది. అందువల్ల సంకుచితం చేయకుండా ‘అర్పణ’ అని అనువదించాం.
- source_word: אֲשֶׁר צִוִּיתִי מָעוֹן
  choice: నివాసస్థలానికి సంబంధించి నేను ఆజ్ఞాపించిన
  rationale: హీబ్రూ నిర్మాణం సంక్షిప్తంగానూ క్లిష్టంగానూ ఉంది. מָעוֹן దేవుని నివాసమైన పరిశుద్ధస్థలాన్ని సూచించే అవకాశముంది; ‘సంబంధించి’ అనేది ‘లో’ లేదా ‘కోసం’ అని అతిగా నిర్ణయించకుండా సంబంధాన్ని నిలుపుతుంది.
- source_word: וַתְּכַבֵּד אֶת בָּנֶיךָ מִמֶּנִּי
  choice: నాకంటే నీ కుమారులకే ఎక్కువ గౌరవమిస్తూ
  rationale: כבד ఇక్కడ ‘గౌరవించడం’; מִמֶּנִּי స్పష్టమైన తులనను చూపుతుంది. తెలుగు వాక్యం దేవునికంటే కుమారులకు అధిక ప్రాధాన్యం ఇచ్చిన నైతిక విరుద్ధతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְהַבְרִיאֲכֶם
  choice: మిమ్మల్ని మీరు కొవ్వబెట్టుకుంటున్నారు
  rationale: అర్పణల వల్ల బాగా తిని లావవుతున్నారనే స్పష్టమైన, నిందాత్మక చిత్రాన్ని మృదువుచేయకుండా నిలిపింది.
- source_word: מֵרֵאשִׁית
  choice: ప్రథమ భాగంతో
  rationale: రֵאשִׁית అంటే మొదటి భాగం; సందర్భంలో అది శ్రేష్ఠమైన భాగాన్ని కూడా సూచించవచ్చు. ప్రధాన పాఠం మూలార్థానికి దగ్గరగా ఉండగా ప్రత్యామ్నాయ భావం పాదసూచికలో ఉంది.
- source_word: כָּל מִנְחַת יִשְׂרָאֵל לְעַמִּי
  choice: నా ప్రజలైన ఇశ్రాయేలు తెచ్చే ప్రతి అర్పణ
  rationale: ఇశ్రాయేలు దేవుని ప్రజలని అనుబంధంగా గుర్తిస్తూ, వారు తెచ్చే అర్పణలనే ఉద్దేశించిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఏలీపై మరియు అతని ఇంటివారిపై నింద యొక్క పరిధి
  choice: ప్రారంభంలోని బహువచనాన్ని ‘మీరు’గా, ఏలీపై కేంద్రీకరించిన తదుపరి ఏకవచనాన్ని ‘నీ’గా, చివరి బహువచనాన్ని ‘మిమ్మల్ని మీరు’గా నిలిపాం.
  alternative: వచనమంతటినీ ఏలీ ఒక్కడికే సంబోధించినట్లు ఏకవచనంలో లేదా అతని ఇంటివారందరికీ అన్నట్లు బహువచనంలో సమతలీకరించడం.
  rationale: హీబ్రూలో బహువచనం నుండి ఏకవచనానికి, తిరిగి బహువచన భావానికి వచ్చే మార్పు నిజమైన పాఠ్య లక్షణం. అది ఏలీ వ్యక్తిగత బాధ్యతతో పాటు అతని ఇంటివారి భాగస్వామ్యాన్ని ఉద్విగ్నంగా ఉంచుతుంది; దానిని పరిష్కరించకుండా అనువాదంలో చూపాం.
- issue: מָעוֹן అనే పదం మరియు ఆజ్ఞతో దాని సంబంధం
  choice: ‘నివాసస్థలానికి సంబంధించి’ అని అనువదించి, అది పరిశుద్ధస్థలాన్ని సూచించే అవకాశాన్ని నిలిపాం.
  alternative: ‘నివాసస్థలంలో’ లేదా ‘నివాసస్థలం కోసం’ అని స్పష్టంగా నిర్ణయించడం.
  rationale: మూలంలోని సంబంధం వ్యాకరణపరంగా సంక్షిప్తంగా ఉంది. ఒకే నిర్దిష్ట సంబంధాన్ని సిద్ధాంతపరంగా లేదా వ్యాఖ్యానాత్మకంగా రుద్దకుండా అస్పష్టతను పాదసూచికతో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష గద్దింపు ధోరణి ఉంచబడింది. ‘మీరు/నీ/మిమ్మల్ని మీరు’ అనే మార్పులు హీబ్రూలోని బహువచన–ఏకవచన మార్పును ఉద్దేశపూర్వకంగా ప్రతిబింబిస్తాయి. ‘ప్రథమ భాగం,’ ‘కొవ్వబెట్టుకోవడం’ వంటి పదాలు మూలంలోని బలి సంబంధిత మరియు నిందాత్మక చిత్రాలను మృదువుచేయకుండా సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచుతాయి.
