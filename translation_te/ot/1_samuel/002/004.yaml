  yaml_path: translation/ot/1_samuel/002/004.yaml
  text: The bows of the mighty are shattered[b][a], but those who stumble are girded with strength.
translation:
  language: te
  text: 'బలవంతుల విల్లులు విరిగిపోయాయి[a];

    తడబడేవారు బలాన్ని నడుముకు బిగించుకున్నారు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముక్కలయ్యాయి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బలంతో నడుము బిగించుకున్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: విల్లు
  rationale: హీబ్రూలో ఏకవచన రూపమే ఉండి, సమూహార్థకంగా బలవంతులకు చెందిన ఆయుధాన్ని సూచిస్తుంది. తెలుగు కవిత్వంలో ఏకవచన సమూహార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: גִּבֹּרִים
  choice: బలవంతులు
  rationale: ఈ పదం వీరులు, యోధులు, శక్తిమంతులు అనే విస్తృత అర్థాలను కలిగి ఉంది. కేవలం సైనికులకు పరిమితం చేయకుండా కవితాత్మక వ్యాప్తిని నిలుపుతుంది.
- source_word: חַתִּים
  choice: విరిగిపోయింది
  rationale: విల్లుతో కలిసిన సందర్భంలో భయపడటం కంటే విరగడం అనే అర్థమే సహజం. తెలుగు ఏకవచన ‘విల్లు’కు అనుగుణంగా క్రియను ఏకవచనంలో ఉంచాం.
- source_word: נִכְשָׁלִים
  choice: తడబడేవారు
  rationale: మూలంలోని తొట్రుపాటు లేదా తడబాటు రూపకాన్ని ‘బలహీనులు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: אָזְרוּ
  choice: నడుముకు కట్టుకున్నారు
  rationale: ఈ క్రియ నడుము బిగించుకోవడం లేదా కట్టుకోవడం అనే సజీవ రూపకాన్ని వ్యక్తం చేస్తుంది. హీబ్రూ క్రియ క్రియాశీల బహువచన రూపంలో ఉన్నందున తెలుగు ప్రతిబింబార్థక క్రియ సహజంగా సరిపోతుంది.
- source_word: חָיִל
  choice: బలం
  rationale: శక్తి, పరాక్రమం, సైనిక సామర్థ్యం వంటి అర్థాలు సాధ్యమైనా, ఇక్కడ తారుమారు చిత్రణకు సరిపోయే విస్తృతమైన పదం ‘బలం’.
theological_decisions:
- issue: హన్నా గీతంలోని తారుమారు కవితా చిత్రణ
  choice: ‘విల్లు,’ ‘తడబడేవారు,’ ‘నడుముకు కట్టుకున్నారు’ అనే స్పష్టమైన ఆయుధ, శరీర రూపకాలను నిలుపడం
  alternative: బలవంతుల ఆయుధాలు విరిగాయి; బలహీనులు బలపడ్డారు
  rationale: మానవ బలం, బలహీనతల తారుమారును వచనం స్పష్టమైన కవితా చిత్రాల ద్వారా చూపుతుంది. వాటిని అమూర్తమైన వివరణగా మార్చకుండా ఉంచడం సాహిత్య, దైవశాస్త్ర ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా సమాంతరతను ఉపయోగించాం. మూలంలోని ఏకవచన సమూహార్థక ‘విల్లు’ను, క్రియాశీలమైన ‘కట్టుకున్నారు’ రూపాన్ని నిలిపి, రూపకాలను వ్యాఖ్యానాత్మకంగా సరళీకరించలేదు.
