  to: 'అతి గర్వంగా పదేపదే మాట్లాడకండి;

    మీ నోటి నుండి ధిక్కారపు మాట రానివ్వకండి.

    ఎందుకంటే యాహ్వే సర్వజ్ఞానముగల దేవుడు;

    ఆయనచేత క్రియలు తూచబడతాయి.[a]'
  rationale: The revision aligns the divine name with the project policy, removes an added deictic nuance, more precisely represents insolent speech, and retains the traditional reading’s passive imagery in the final clause. The meaningful ketiv/qere-related alternative remains explicitly anchored to the final clause in the footnote.
