  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תַּרְבּ֤וּ תְדַבְּרוּ֙ גְּבֹהָ֣ה גְבֹהָ֔ה יֵצֵ֥א עָתָ֖ק מִ/פִּי/כֶ֑ם כִּ֣י אֵ֤ל דֵּעוֹת֙ יְהוָ֔ה ו/לא נִתְכְּנ֖וּ עֲלִלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
translation:
  language: te
  text: 'అతి గర్వంగా పదేపదే మాట్లాడకండి;

    మీ నోటి నుండి ధిక్కారపు మాట రానివ్వకండి.

    ఎందుకంటే యాహ్వే సర్వజ్ఞానముగల దేవుడు;

    ఆయనచేత క్రియలు తూచబడతాయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, వ్యంజన పాఠాన్ని కఠినంగా అనుసరిస్తే, “క్రియలు తూచబడవు.” ప్రధాన పాఠం యాహ్వే మానవుల క్రియలను మూల్యాంకనం చేస్తాడనే సాంప్రదాయ పఠనాన్ని అనుసరిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  choice: పదేపదే మాట్లాడకండి
  rationale: רבה తో కూడిన క్రియ నిరంతరమైన లేదా మళ్లీమళ్లీ జరిగే మాటలను సూచిస్తుంది. తెలుగు సహజత్వంతో నిషేధార్థాన్ని నిలుపుతుంది.
- source_word: גְּבֹהָה גְבֹהָה
  choice: ఇంత గర్వంగా
  rationale: రెట్టింపు ప్రయోగం మాటల్లోని తీవ్రమైన గర్వాన్ని బలపరుస్తుంది; ‘ఇంత గర్వంగా’ ఆధునిక తెలుగులో ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: יֵצֵא עָתָק מִפִּיכֶם
  choice: మీ నోటి నుండి అహంకారపు మాట రానివ్వకండి
  rationale: עָתָק ఇక్కడ గర్వపూరితమైన, ధిక్కారభరితమైన మాటను సూచిస్తుంది. ముందరి నిషేధాన్ని ఈ వాక్యానికి కొనసాగించడం తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֵל דֵּעוֹת יְהוָה
  choice: యెహోవా సమస్తం తెలిసిన దేవుడు
  rationale: ‘జ్ఞానముల దేవుడు’ అనే నిర్మాణం దేవుని సంపూర్ణ జ్ఞానాన్ని సూచిస్తుంది. ‘సమస్తం తెలిసిన దేవుడు’ ఆ భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְלֹא נִתְכְּנוּ עֲלִלוֹת
  choice: ఆయనే క్రియలను తూచి చూస్తాడు
  rationale: సాంప్రదాయ పఠనానుసారం దేవుడు మానవ క్రియలను కొలిచి మూల్యాంకనం చేస్తాడనే భావం. ‘తూచి చూస్తాడు’ తూకం రూపకాన్నీ, పరిశీలన భావాన్నీ నిలుపుతుంది; వ్యంజన పాఠంలోని ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఒడంబడిక దైవనామం నేరుగా ఉంది. తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపం దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
- issue: וְלֹא נִתְכְּנוּ עֲלִילוֹת పాఠభేదం
  choice: ఆయనే క్రియలను తూచి చూస్తాడు
  alternative: క్రియలు తూచబడవు
  rationale: సందర్భానికి అనుగుణమైన సాంప్రదాయ పఠనం దేవుడు క్రియలను అంచనా వేస్తాడని చెబుతుంది. అయితే వ్యంజన పాఠాన్ని మరింత కఠినంగా అనుసరించినప్పుడు వచ్చే నిషేధార్థం నిజమైన పాఠభేదం కాబట్టి పాదటిప్పణిలో స్పష్టంగా భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా స్వభావానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదప్రయోగం. సమాంతర పాద నిర్మాణం నిలుపబడింది; పాఠభేదం ప్రధాన పాఠంలో పరిష్కరించివేయకుండా పాదటిప్పణిలో భద్రపరచబడింది.
