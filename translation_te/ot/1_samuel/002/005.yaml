  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
translation:
  language: te
  text: 'కడుపునిండినవారు రొట్టె కోసం కూలి పనికి చేరారు;

    ఆకలితో ఉన్నవారు ఇక మానుకున్నారు.[a]

    సంతానం లేని స్త్రీ కూడా ఏడుగురిని కనింది.[b][c]

    అనేకమంది కుమారులున్న స్త్రీ వాడిపోయింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మానుకున్నారు.” దేనిని మానుకున్నారో హీబ్రూ పాఠ్యం చెప్పదు; ఆకలి ఇక లేకపోవడం లేదా లేమి తీరడం అనే భావం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఏడు” అక్షరార్థ సంఖ్య కావచ్చు; కవితలో సంపూర్ణత లేదా నిండుదనాన్ని సూచించే సంఖ్యగానూ ఉండవచ్చు.
    reason: cultural_note
  - marker: c
    text: హీబ్రూలో “ఏడు” అనే పదం పురుషలింగ రూపంలో ఉంది; సందర్భంలో కుమారుల భావం సూచించబడవచ్చు. అయితే ఈ భాగంలో నామవాచకం స్పష్టంగా చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבֵעִים
  choice: తృప్తిగా ఉన్నవారు
  rationale: సమృద్ధిగా తిని నిండుగా ఉన్నవారిని సూచించే విశేషణాన్ని వ్యక్తులను సూచించేలా అనువదించి, కవితలోని స్థితి తారుమారును నిలిపింది.
- source_word: בַּלֶּחֶם
  choice: రొట్టె కోసం
  rationale: לֶחֶם అనే స్పష్టమైన ఆహారచిత్రాన్ని ‘రొట్టె’గా నిలిపి, జీవనాధారం కోసం కూలిపనికి దిగిన దుస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נִשְׂכָּרוּ
  choice: కూలికి చేరారు
  rationale: కూలికి పనిలో చేరడం అనే నిఫాల్ రూప భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపి, గత సమృద్ధి నుంచి పరాధీనతకు వచ్చిన మార్పును చూపుతుంది.
- source_word: וּרְעֵבִים
  choice: ఆకలితో ఉన్నవారు
  rationale: మొదటి పాదంలోని ‘తృప్తిగా ఉన్నవారు’కు సమాంతరంగా వ్యక్తులను సూచించే రూపంలో ఇచ్చింది.
- source_word: חָדֵלּוּ
  choice: ఇక మానుకున్నారు
  rationale: హీబ్రూలో క్రియకు కర్మ లేదా పూరక భావం చెప్పబడలేదు. తెలుగు వాక్యం సహజంగా ఉండేంత మాత్రాన వ్యక్తీకరించి, వారు ఆకలితో ఉండడం మానిందా లేక లేమి తీరిందా అనే అస్పష్టతను పాదటిప్పణిలో నిలిపింది.
- source_word: עַד
  choice: కూడా
  rationale: ఇక్కడ ‘అంతవరకు’ అనే కాలార్థం కంటే, తారుమారు ఎంతదూరం వెళ్లిందో తెలిపే ‘కూడా/సైతం’ భావం సందర్భానికి సరిపోతుంది.
- source_word: עֲקָרָה
  choice: గొడ్రాలు
  rationale: సంతానం కనలేని స్త్రీని సూచించే సంక్షిప్తమైన సంప్రదాయ తెలుగు పదం; కవితా సమాంతరతను కాపాడుతుంది.
- source_word: יָלְדָה שִׁבְעָה
  choice: ఏడుగురిని కనింది
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్తతను నిలిపింది. ‘ఏడు’ అక్షరార్థ సంఖ్యగానూ సంపూర్ణత సూచకంగానూ వినిపించే అవకాశాన్ని తెరిచి ఉంచింది.
- source_word: וְרַבַּת בָּנִים
  choice: అనేకమంది కుమారులు గలది
  rationale: בָּנִים అనే పురుషలింగ బహువచనాన్ని ‘కుమారులు’గా ఖచ్చితంగా నిలిపింది; ‘పిల్లలు’గా సాధారణీకరించలేదు.
- source_word: אֻמְלָלָה
  choice: వాడిపోయింది
  rationale: బలహీనమై క్షీణించడం, దుస్థితికి చేరడం అనే భావాన్ని కవితాత్మకంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: שִׁבְעָה (‘ఏడు’) అక్షరార్థ సంఖ్యా, సంపూర్ణతను సూచించే కవితాత్మక సంఖ్యా
  choice: ప్రధాన పాఠ్యంలో ‘ఏడుగురిని’ అని యథాతథంగా ఉంచడం
  alternative: పూర్తి ఫలవంతతను సూచించే ప్రతీకాత్మక సంఖ్యగా వివరించడం
  rationale: మూలపాఠ్యం సంఖ్యను నేరుగా ఇస్తుంది; అక్షరార్థం, కవితాత్మక సంపూర్ణత అనే రెండు ప్రతిధ్వనులనూ అనువాదం ముందుగానే తీర్మానించకుండా నిలిపింది.
- issue: בָּנִים ను లింగనిరపేక్షంగా సాధారణీకరించాలా
  choice: ‘కుమారులు’ అని అనువదించడం
  alternative: ‘పిల్లలు’ అని అనువదించడం
  rationale: మూలపదం స్పష్టంగా పురుషలింగ బహువచనం. దానిని సాధారణీకరించాల్సిన సందర్భబద్ధమైన అవసరం లేకపోవడంతో మూలంలోని లింగసూచనను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. సమాంతర పాదాలు, స్థితి తారుమారు, మూలంలోని సంక్షిప్తతను సాధ్యమైనంతగా నిలిపాం. ‘గొడ్రాలు’ సంప్రదాయమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే సంక్షిప్త పదంగా ఎంచుకున్నాం; חָדֵלּוּ లోని ఉద్దేశపూర్వక అస్పష్టతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా కాపాడాం.
