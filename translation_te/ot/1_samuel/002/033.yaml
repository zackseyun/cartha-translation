id: 1SA.2.33
reference: 1 Samuel 2:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
translation:
  language: te
  text: అయితే నీ కళ్లను క్షీణింపజేయడానికి, నీ ప్రాణాన్ని బాధపెట్టడానికి, నా బలిపీఠం దగ్గరనుండి నీ వారిలో అందరినీ నేను తొలగించను; నీ ఇంటి సంతానమంతా మనుష్యులుగా మరణిస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మనుష్యులుగా మరణిస్తారు.” దీనికి “నిండు యౌవనంలో మరణిస్తారు” అనే భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ מֵעִם מִזְבְּחִי
  choice: నా బలిపీఠం దగ్గరనుండి నీ వారిలో ప్రతి పురుషుణ్ణీ నేను తొలగించను
  rationale: నిరాకరణతో వచ్చిన אִישׁ‌కు ఉన్న పంపిణీ భావాన్ని ‘ప్రతి పురుషుణ్ణీ ... తొలగించను’ అని వ్యక్తం చేశాం. מֵעִם సూచించే బలిపీఠం సమీప భావాన్ని ‘దగ్గరనుండి’ నిలిపాం.
- source_word: לְכַלּוֹת אֶת עֵינֶיךָ
  choice: నీ కళ్లు క్షీణించేలా
  rationale: కళ్లను ‘అంతం చేయడం/క్షయింపజేయడం’ అనే హీబ్రూ చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; దుఃఖంతో చూపు క్షీణించే భావాన్ని అతిగా వివరించదు.
- source_word: וְלַאֲדִיב אֶת נַפְשֶׁךָ
  choice: నీ ప్రాణం దుఃఖించేలా
  rationale: అరుదైన క్రియలోని బాధ లేదా దుఃఖం కలిగించే భావాన్ని, נֶפֶשׁ‌కు సందర్భానుకూలమైన ‘ప్రాణం’తో అందించాం.
- source_word: וְכָל מַרְבִּית בֵּיתְךָ
  choice: నీ ఇంటి సంతానమంతా
  rationale: מַרְבִּית యొక్క ‘వృద్ధి/పెరుగుదల’ రూపకం ఈ సందర్భంలో ఏలీ ఇంటి వారసులను సూచిస్తుంది. అర్థం స్పష్టంగా, సహజంగా ఉండేందుకు ‘సంతానమంతా’ ఎంచుకున్నాం.
- source_word: יָמֻתוּ אֲנָשִׁים
  choice: పురుషులుగా చనిపోతారు
  rationale: హీబ్రూ పదబంధంలోని అసాధారణమైన, సంక్షిప్తమైన రూపాన్ని ప్రధాన పాఠంలో సాధ్యమైనంత దగ్గరగా నిలిపి, ‘నిండు యౌవనంలో’ అనే సంభావ్య భావాన్ని పాదసూచికలో ఉంచాం. మూలంలో లేని ‘కత్తిచేత’ అనే భావాన్ని చేర్చలేదు.
theological_decisions:
- issue: ఏలీ యాజక వంశంపై తీర్పు స్వరూపం
  choice: బలిపీఠం దగ్గరనుండి అతని వారందరినీ పూర్తిగా తొలగించకుండా, మిగిలినవారి ఉనికే దుఃఖానికి కారణమయ్యే తీర్పుగా పాఠాన్ని ఉంచడం
  alternative: అతని వంశం యాజక సేవనుండి పూర్తిగా తొలగించబడుతుందని అనువదించడం
  rationale: ‘ప్రతి పురుషుణ్ణీ ... తొలగించను’ అనే నిరాకరణ ఒక మిగులు వర్గాన్ని సూచిస్తుంది; తరువాతి ఉద్దేశ్య వాక్యాలు వారి మిగిలి ఉండడంలోనే కొనసాగుతున్న దుఃఖం ఉందని చూపుతాయి. అంతకంటే ఎక్కువ సిద్ధాంత నిర్ణయాన్ని అనువాదం విధించదు.
- issue: אֲנָשִׁים అనే చివరి పదం భావం
  choice: ప్రధాన పాఠంలో ‘పురుషులుగా’ అని దగ్గరగా అనువదించి, ‘నిండు యౌవనంలో’ అనే భావాన్ని పాదసూచికలో ఇవ్వడం
  alternative: ప్రధాన పాఠంలోనే ‘నిండు యౌవనంలో’ లేదా ‘మనుషుల కత్తిచేత’ అని అనువదించడం
  rationale: మూల పదబంధం సందిగ్ధమైనది. ‘నిండు యౌవనంలో’ అనేది సముచిత సందర్భార్థం కావచ్చు; అయితే ‘కత్తిచేత’ అన్నది హీబ్రూ పదాల్లో ప్రత్యక్షంగా లేదు. అందువల్ల సందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ వాక్యంలోని తీర్పు-మధ్య మిగులు అనే ఉద్రిక్తతను, అలాగే చివరి పదబంధంలోని సందిగ్ధతను నిలిపాం.
