source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם לָ֥/מָּה תַעֲשׂ֖וּ/ן כַּ/דְּבָרִ֣ים הָ/אֵ֑לֶּה אֲשֶׁ֨ר אָנֹכִ֤י שֹׁמֵ֨עַ֙ אֶת דִּבְרֵי/כֶ֣ם רָעִ֔ים מֵ/אֵ֖ת כָּל הָ/עָ֥ם אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/023.yaml
  text: And he said to them[a], “Why do you do such things? For I hear from all these people about your evil deeds.”
translation:
  language: te
  text: అతడు వారితో, “మీరు ఇలాంటి పనులు ఎందుకు చేస్తున్నారు? ఈ ప్రజలందరి నుంచీ మీ చెడ్డ ప్రవర్తన గురించి నేను వింటున్నాను.[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, “ఈ ప్రజలందరి నుంచీ మీ చెడ్డ విషయాలు/మాటలు నేను వింటున్నాను.” సందర్భంలో ఏలీ తన కుమారుల దుష్ట ప్రవర్తన గురించిన నివేదికలను వింటున్నాడనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: అతడు వారితో ... అని అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణంలో వ్యక్తపరుస్తుంది; సందర్భంలో ‘అతడు’ ఏలీని, ‘వారు’ అతని కుమారులను సూచిస్తారు.
- source_word: לָמָּה תַעֲשׂוּן כַּדְּבָרִים הָאֵלֶּה
  choice: మీరు ఇలాంటి పనులు ఎందుకు చేస్తున్నారు?
  rationale: అసంపూర్ణ క్రియారూపం కొనసాగుతున్న ప్రవర్తనపై గద్దింపును సూచిస్తుంది. דְּבָרִים ఇక్కడ మాటలకన్నా వారు చేస్తున్న విషయాలు లేదా పనులను సూచిస్తుంది.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: నేను వింటున్నాను
  rationale: స్వతంత్ర సర్వనామంతో కూడిన కృదంతం ప్రస్తుతం కొనసాగుతున్న వినికిడిని, అంటే వస్తున్న నివేదికలను, సహజంగా తెలియజేస్తుంది.
- source_word: אֶת דִּבְרֵיכֶם רָעִים
  choice: మీ చెడ్డ ప్రవర్తన గురించి
  rationale: పదశః ‘మీ చెడ్డ విషయాలు/మాటలు’ అనే అస్పష్ట నిర్మాణం సందర్భంలో కుమారుల దుష్కార్యాల గురించిన నివేదికలను సూచిస్తుంది. ‘ప్రవర్తన’ ఆ భావాన్ని సహజంగా అందిస్తూ, పదశః రూపాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: מֵאֵת כָּל הָעָם אֵלֶּה
  choice: ఈ ప్రజలందరి నుంచీ
  rationale: מֵאֵת నివేదికకు మూలాన్ని, כָּל הָעָם సమస్త ప్రజలను, אֵלֶּה సూచనాత్మక బలాన్ని తెలియజేస్తాయి.
