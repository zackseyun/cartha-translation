id: 1SA.2.11
reference: 1 Samuel 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֧לֶךְ אֶלְקָנָ֛ה הָ/רָמָ֖תָ/ה עַל בֵּית֑/וֹ וְ/הַ/נַּ֗עַר הָיָ֤ה מְשָׁרֵת֙ אֶת יְהוָ֔ה אֶת פְּנֵ֖י עֵלִ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/011.yaml
  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
translation:
  language: te
  text: అప్పుడు ఎల్కానా రామాలోని తన ఇంటికి వెళ్లాడు. ఆ బాలుడు యాజకుడైన ఏలీ సమక్షంలో యాహ్వేకు సేవ చేస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: הלך క్రియ ఇక్కడ కథనాన్ని ముందుకు నడిపిస్తూ సాధారణంగా ‘వెళ్లాడు’ అనే అర్థాన్నిస్తుంది; సందర్భాన్ని బట్టి ‘తిరిగి వెళ్లాడు’ అనిపించినా, తిరుగు భావం క్రియలో స్పష్టంగా లేదు.
- source_word: הָרָמָתָה עַל בֵּיתוֹ
  choice: రామాలోని తన ఇంటికి
  rationale: స్థలనామానికి జోడించిన దిశాసూచక ה రామా వైపు గమనాన్ని సూచిస్తుంది; עַל בֵּיתוֹ ఈ సందర్భంలో తన ఇంటికి/నివాసానికి వెళ్లడాన్ని తెలిపే ప్రయోగం. సహజమైన తెలుగులో రెండింటినీ కలిపి ‘రామాలోని తన ఇంటికి’ అని ఇచ్చాం.
- source_word: וְהַנַּעַר
  choice: ఆ బాలుడు
  rationale: נַעַר పదానికి బాలుడు నుండి యువకుడు వరకు అర్థపరిధి ఉన్నా, ఈ కథన దశలో సమూయేలు చిన్నవాడిగా చిత్రించబడుతున్నందున ‘బాలుడు’ సముచితం.
- source_word: הָיָה מְשָׁרֵת
  choice: సేవ చేస్తూ ఉన్నాడు
  rationale: היה + కృదంత నిర్మాణం కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘సేవ చేస్తూ ఉన్నాడు’ ఆ దైర్ఘ్యార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֶת יְהוָה
  choice: యెహోవాకు
  rationale: שרת తో వచ్చిన ప్రత్యక్ష కర్మ సూచిక దేవుడే సేవను స్వీకరించేవాడని తెలియజేస్తుంది. దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֶת פְּנֵי עֵלִי הַכֹּהֵן
  choice: యాజకుడైన ఏలీ సమక్షంలో
  rationale: పదబంధం అక్షరార్థంగా ఏలీ ముఖం/సన్నిధిని సూచిస్తుంది. ‘సమక్షంలో’ స్థల-సంబంధ భావాన్ని నిలుపుతూ, ‘ఆధ్వర్యంలో’ వంటి అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం; ఆధునిక ప్రామాణిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: ఏలీతో సమూయేలు సేవకు ఉన్న సంబంధం
  choice: ఏలీ సమక్షంలో
  alternative: ఏలీ ఆధ్వర్యంలో
  rationale: మూలంలోని אֶת־פְּנֵי సమక్షం లేదా సన్నిధిని స్పష్టంగా చెబుతుంది; పర్యవేక్షణ భావం సందర్భంలో సాధ్యమైనప్పటికీ దానిని పాఠ్యంలో నిర్బంధంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. కొనసాగుతున్న సేవను స్పష్టంగా చూపించాం; మూలంలో లేని ‘తిరిగి’ లేదా ‘ఆధ్వర్యంలో’ వంటి వివరణాత్మక భావాలను చేర్చలేదు.
