source:
  edition: WLC
  text: כִּֽי פָקַ֤ד יְהוָה֙ אֶת חַנָּ֔ה וַ/תַּ֛הַר וַ/תֵּ֥לֶד שְׁלֹשָֽׁה בָנִ֖ים וּ/שְׁתֵּ֣י בָנ֑וֹת וַ/יִּגְדַּ֛ל הַ/נַּ֥עַר שְׁמוּאֵ֖ל עִם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
translation:
  language: te
  text: ఎందుకంటే యాహ్వే హన్నాను కటాక్షించాడు[a]; ఆమె గర్భం దాల్చి ముగ్గురు కుమారులను, ఇద్దరు కుమార్తెలను కనింది. బాలుడైన సమూయేలు యాహ్వే సమక్షంలో పెరిగాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే హన్నాను దయతో ఆదుకున్నాడు,” “యాహ్వే హన్నా విషయమై శ్రద్ధ వహించాడు.” హీబ్రూ క్రియ ఒకరి మేలు కోసం దేవుడు దయతో జోక్యం చేసుకోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “యాహ్వేతో.” ఈ సందర్భంలో సమూయేలు పవిత్రస్థలంలో యాహ్వే సన్నిధిలో పెరిగాడనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి వివరణాత్మకమైన లేదా కారణార్థకమైన కొనసాగింపును సూచిస్తుంది.
- source_word: פָקַד
  choice: శ్రద్ధ చూపాడు
  rationale: ఈ సందర్భంలో హన్నా పక్షంగా యాహ్వే దయతో జోక్యం చేసుకున్నాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం గమనించాడనే అర్థానికి పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַתַּהַר
  choice: ఆమె గర్భం దాల్చి
  rationale: గర్భవతి కావడాన్ని స్పష్టంగా, సహజంగా తెలిపే తెలుగు ప్రయోగం.
- source_word: וַתֵּלֶד
  choice: కనింది
  rationale: పిల్లలకు జన్మనివ్వడాన్ని కథనశైలికి తగిన సంక్షిప్తమైన తెలుగులో అందిస్తుంది.
- source_word: שְׁלֹשָׁה בָנִים וּשְׁתֵּי בָנוֹת
  choice: ముగ్గురు కుమారులను, ఇద్దరు కుమార్తెలను
  rationale: సంఖ్యలను, కుటుంబ సంబంధ పదాలను నేరుగా మరియు సహజంగా అనువదిస్తుంది.
- source_word: הַנַּעַר שְׁמוּאֵל
  choice: బాలుడైన సమూయేలు
  rationale: హీబ్రూ పదబంధంలోని సమూయేలు ఇంకా బాలుడనే కథన సమాచారాన్ని నిలుపుతుంది.
- source_word: וַיִּגְדַּל
  choice: పెరిగాడు
  rationale: ఇక్కడ సమూయేలు శారీరకంగా మరియు వయస్సులో ఎదగడాన్ని సూచించే సహజమైన తెలుగు సమానార్థకం.
- source_word: עִם יְהוָה
  choice: యాహ్వేతో ఉంటూ
  rationale: అక్షరార్థమైన ‘యాహ్వేతో’ అనే భావాన్ని నిలుపుతూ, సమూయేలు దేవుని సన్నిధికి సంబంధించిన ఆలయస్థలంలో పెరిగాడనే సందర్భార్థానికీ చోటిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- issue: עִם יְהוָה యొక్క భావం
  choice: యాహ్వేతో ఉంటూ
  alternative: యాహ్వే సన్నిధిలో / యాహ్వే ఎదుట
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘యాహ్వేతో’ అని ఉంటుంది. ప్రధాన పాఠం ఈ సంబంధాత్మక-స్థలాత్మక అస్పష్టతను నిలుపుతుంది; పాదటిప్పణి ఆలయస్థల సందర్భాన్ని వివరిస్తుంది, కానీ దానిని పాఠంలోనే ఖరారు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే గౌరవప్రదమైన కథనశైలిలో రూపొందించబడింది. మూలంలోని ‘యాహ్వేతో’ అనే పదబంధాన్ని అతిగా వివరణాత్మకంగా మార్చకుండా దాని భావసంభావ్యతను నిలిపింది.
