revisions:
- from: 'కాబట్టి ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా ప్రకటిస్తున్నాడు: “నీ ఇంటివారూ నీ తండ్రి ఇంటివారూ ఎప్పటికీ నా సన్నిధిలో నడుచుకుంటారని నేను నిశ్చయంగా చెప్పాను. అయితే ఇప్పుడు యాహ్వే ఇలా ప్రకటిస్తున్నాడు: ‘అది నా వల్ల ఎన్నటికీ జరగదు! ఎందుకంటే నన్ను ఘనపరచేవారిని నేను ఘనపరుస్తాను; నన్ను తృణీకరించేవారు అల్పులుగా ఎంచబడతారు[a].’”'
  to: 'కాబట్టి ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా అంటున్నాడు: “నీ ఇంటివారూ, నీ తండ్రి ఇంటివారూ ఎప్పటికీ నా సన్నిధిలో నడుచుకుంటారని నేను నిజంగానే చెప్పాను. కానీ ఇప్పుడు యాహ్వే ఇలా అంటున్నాడు: అలా జరగడం నాకు దూరం! ఎందుకంటే నన్ను ఘనపరచేవారిని నేను ఘనపరుస్తాను; నన్ను తృణీకరించేవారు అల్పంగా పరిగణించబడతారు[a].”'
  rationale: చివరి వాక్యంలోని మూలార్థానికి విరుద్ధంగా చేరిన ‘ఎంచబడతారు’ అనే భావాన్ని తొలగించి, హెబ్రీ క్రియలోని అల్పంగా పరిగణించబడటం అనే భావాన్ని స్పష్టంగా ఇచ్చాం. దైవ వాక్యంలోని ఉద్ధరణ నిర్మాణాన్ని కూడా ఆధునిక తెలుగు పఠనానికి సహజంగా సవరించాం; పూర్వ వాగ్దానం మరియు ప్రస్తుత నిరాకరణ మధ్యనున్న వ్యాఖ్యానాత్మక ఉద్రిక్తతను మార్చలేదు.
