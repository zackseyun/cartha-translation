source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻם יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ אָמ֣וֹר אָמַ֔רְתִּי בֵּֽיתְ/ךָ֙ וּ/בֵ֣ית אָבִ֔י/ךָ יִתְהַלְּכ֥וּ לְ/פָנַ֖/י עַד עוֹלָ֑ם וְ/עַתָּ֤ה נְאֻם יְהוָה֙ חָלִ֣ילָ/ה לִּ֔/י כִּֽי מְכַבְּדַ֥/י אֲכַבֵּ֖ד וּ/בֹזַ֥/י יֵקָֽלּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
translation:
  language: te
  text: 'కాబట్టి ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా అంటున్నాడు: “నీ ఇంటివారూ, నీ తండ్రి ఇంటివారూ ఎప్పటికీ నా సన్నిధిలో నడుచుకుంటారని నేను నిజంగానే చెప్పాను. కానీ ఇప్పుడు యాహ్వే ఇలా అంటున్నాడు: అలా జరగడం నాకు దూరం! ఎందుకంటే నన్ను ఘనపరచేవారిని నేను ఘనపరుస్తాను; నన్ను తృణీకరించేవారు అల్పంగా పరిగణించబడతారు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అవమానించబడతారు,” లేదా “ప్రాముఖ్యతలేనివారిగా చూడబడతారు.” హెబ్రీ క్రియకు ‘తేలికగా కావడం,’ ‘అల్పంగా లేదా లెక్కలేనిదిగా పరిగణించబడడం’ అనే భావం ఉంది; ఇది “ఘనపరుస్తాను” అన్న మాటకు విరుద్ధంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి అభియోగం ఆధారంగా వచ్చే దైవిక తీర్పును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: נְאֻם יְהוָה
  choice: యాహ్వే ఇలా ప్రకటిస్తున్నాడు
  rationale: దైవ ప్రకటన సూత్రంలోని అధికారపూర్వక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: אָמֹר אָמַרְתִּי
  choice: నేను నిశ్చయంగా చెప్పాను
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే ఉద్ఘాటనను తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: בֵּיתְךָ וּבֵית אָבִיךָ
  choice: నీ ఇంటివారూ నీ తండ్రి ఇంటివారూ
  rationale: ‘ఇల్లు’ అనే హెబ్రీ కుటుంబ/వంశార్థాన్ని వ్యక్తుల సమూహంగా సహజ తెలుగులో తెలియజేస్తూ పునరుక్తిని నిలుపుతుంది.
- source_word: יִתְהַלְּכוּ לְפָנַי
  choice: నా సన్నిధిలో నడుచుకుంటారు
  rationale: దేవుని సమక్షంలో నిరంతర జీవనం, ప్రవర్తన లేదా సేవ అనే విస్తృతమైన హెబ్రీ భావాన్ని కేవలం యాజక పరిచర్యకే పరిమితం చేయదు.
- source_word: עַד עוֹלָם
  choice: ఎప్పటికీ
  rationale: దీర్ఘకాలిక నిబంధనాత్మక భాషకు సహజమైన తెలుగు సమానార్థకం.
- source_word: חָלִילָה לִּי
  choice: అది నా వల్ల ఎన్నటికీ జరగదు!
  rationale: మునుపటి ప్రకటన యథాతథంగా కొనసాగుతుందనే భావాన్ని దేవుడు బలంగా తిరస్కరించడాన్ని ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מְכַבְּדַי אֲכַבֵּד
  choice: నన్ను ఘనపరచేవారిని నేను ఘనపరుస్తాను
  rationale: כבד ధాతువు పునరుక్తినీ, పరస్పర ప్రతిస్పందననూ ఒకే తెలుగు పదంతో నిలుపుతుంది.
- source_word: וּבֹזַי יֵקָלּוּ
  choice: నన్ను తృణీకరించేవారు అల్పులుగా ఎంచబడతారు
  rationale: ‘తృణీకరించడం’ ధిక్కారాన్ని, ‘అల్పులుగా ఎంచబడడం’ כבדకు విరుద్ధమైన ‘తేలిక/ప్రాముఖ్యతలేమి’ భావాన్ని నిలుపుతాయి.
theological_decisions:
- issue: ఏలీ ఇంటివారికి చేసిన మునుపటి వాగ్దానం స్వభావం
  choice: ‘నేను నిశ్చయంగా చెప్పాను ... ఎప్పటికీ’ అనే నిజమైన పూర్వ దైవ ప్రకటనను, ‘అయితే ఇప్పుడు ... అది నా వల్ల ఎన్నటికీ జరగదు’ అనే ప్రస్తుత తిరస్కరణతో నేరుగా ఎదురెదురుగా ఉంచడం.
  alternative: ‘ఎప్పటికీ’ అన్నది మొదటినుంచే అతిశయోక్తి అని భావించడం, లేదా ప్రస్తుత మాటలను వాగ్దాన రద్దుగా కాక కేవలం ఆధిక్యత పరిమితిగా మృదువుగా అనువదించడం.
  rationale: హెబ్రీ వాక్యమే పూర్వ ప్రకటనకూ ప్రస్తుత తీర్పుకూ మధ్య తీవ్రమైన ఉద్రిక్తతను ఉంచి, దేవుణ్ణి ఘనపరచడం లేదా తృణీకరించడం అనే సూత్రంతో దానిని వివరిస్తుంది. విస్తృత సిద్ధాంత వ్యవస్థ ద్వారా ఆ ఉద్రిక్తతను అనువాదం పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘నా సన్నిధిలో నడుచుకోవడం’ అనే నిబంధనాత్మక రూపకాన్ని నిలిపి, అవసరానికి మించిన యాజకార్థ సంకుచితీకరణను నివారించింది. దైవనామం יהוה ‘యాహ్వే’గా ప్రత్యక్షంగా ఇవ్వబడింది.
