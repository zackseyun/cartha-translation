  text: גַּם֮ בְּ/טֶרֶם֮ יַקְטִר֣וּ/ן אֶת הַ/חֵלֶב֒ וּ/בָ֣א נַ֣עַר הַ/כֹּהֵ֗ן וְ/אָמַר֙ לָ/אִ֣ישׁ הַ/זֹּבֵ֔חַ תְּנָ֣/ה בָשָׂ֔ר לִ/צְל֖וֹת לַ/כֹּהֵ֑ן וְ/לֹֽא יִקַּ֧ח מִמְּ/ךָ֛ בָּשָׂ֥ר מְבֻשָּׁ֖ל כִּ֥י אִם חָֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/015.yaml
  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
translation:
  language: te
  text: అంతేకాదు, వారు కొవ్వును దహించి అర్పించకముందే యాజకుని పరిచారకుడు[a] వచ్చి, బలి అర్పిస్తున్న వ్యక్తితో, “యాజకుడు కాల్చుకోవడానికి మాంసం ఇవ్వు. అతడు నీ దగ్గర ఉడికించిన మాంసాన్ని తీసుకోడు; పచ్చి మాంసమే తీసుకుంటాడు” అనేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యాజకుని యువకుడు’ లేదా ‘యాజకుని సేవకుడు.’ హీబ్రూ పదం נַעַר యువకుణ్ణి, సేవకుణ్ణి లేదా పరిచారకుణ్ణి సూచించవచ్చు; ఇక్కడ యాజకుని తరఫున పనిచేసే సహాయకుడనే భావం సందర్భానికి సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בְּטֶרֶם
  choice: అంతేకాదు, ... ముందే
  rationale: גַּם ఇక్కడ ముందున్న దురాచారానికి మరొక తీవ్రమైన అంశాన్ని జోడిస్తుంది; בְּטֶרֶם ఆచారం జరగకముందే ఈ చర్య జరిగినట్లు తెలియజేస్తుంది.
- source_word: יַקְטִרוּן אֶת־הַחֵלֶב
  choice: వారు కొవ్వును ధూపంగా అర్పించకముందే
  rationale: క్రియ బలిలోని కొవ్వు భాగాలను పొగగా దేవునికి అర్పించే ఆచారాన్ని సూచిస్తుంది. కేవలం ‘కాల్చడం’ కంటే ‘ధూపంగా అర్పించడం’ ఆ బలిసంబంధ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: נַעַר הַכֹּהֵן
  choice: యాజకుని పరిచారకుడు
  rationale: נַעַר అంటే యువకుడు, సేవకుడు లేదా పరిచారకుడు కావచ్చు. ఇక్కడ యాజకుని తరఫున పనిచేసే సహాయకుని పాత్ర ప్రధానంగా కనిపిస్తుంది; ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לָאִישׁ הַזֹּבֵחַ
  choice: బలి అర్పిస్తున్న వ్యక్తితో
  rationale: హీబ్రూ కృదంతం ఆ సమయంలో బలి అర్పిస్తున్న ఆరాధకుణ్ణి సూచిస్తుంది; లింగాన్ని అనవసరంగా ముందుకు తేవకుండా సహజమైన తెలుగు వాడాం.
- source_word: תְּנָה בָשָׂר לִצְלוֹת לַכֹּהֵן
  choice: యాజకుడు కాల్చుకోవడానికి మాంసం ఇవ్వు
  rationale: ఆజ్ఞలోని ముక్కుసూటితనాన్ని ‘ఇవ్వు’ నిలుపుతుంది; לִצְלוֹת మాంసాన్ని కాల్చి సిద్ధం చేయడాన్ని సూచిస్తుంది.
- source_word: וְלֹא יִקַּח מִמְּךָ בָּשָׂר מְבֻשָּׁל
  choice: అతడు నీ దగ్గర ఉడికించిన మాంసాన్ని తీసుకోడు
  rationale: מְבֻשָּׁל సాధారణంగా వండినది అనే విస్తృతార్థం కలిగినా, ఇక్కడ కాల్చే మాంసానికి విరుద్ధంగా ఉడికించిన మాంసాన్ని సూచిస్తుంది.
- source_word: כִּי אִם חָי
  choice: పచ్చి మాంసమే తీసుకుంటాడు
  rationale: హీబ్రూ exceptive నిర్మాణం ‘ఉడికించినది కాదు, పచ్చిదే’ అనే గట్టి వ్యత్యాసాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కొవ్వును అర్పించకముందే మాంసం కోరడం ద్వారా కనిపించే ఆచార ఉల్లంఘన
  choice: సంఘటనల క్రమాన్ని స్పష్టంగా నిలుపుతూ ‘కొవ్వును ధూపంగా అర్పించకముందే’ అని అనువదించాం.
  alternative: కొవ్వును కాల్చకముందే
  rationale: కొవ్వు దేవునికి అర్పించాల్సిన బలి భాగమనే నేపథ్యాన్ని అనువాదం సూచిస్తుంది; అయితే వచనంలో లేని తీర్పు లేదా వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. ప్రత్యక్ష సంభాషణలోని దురుసైన ఆజ్ఞను మృదువుచేయకుండా ఉంచాం. ‘పరిచారకుడు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండడంతో పాటు సేవకుడు/యువకుడు అనే మూలపదంలోని పరిధిని పాదసూచికలో భద్రపరుస్తుంది.
