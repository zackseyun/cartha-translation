source:
  edition: WLC
  text: וּ/מְעִ֤יל קָטֹן֙ תַּעֲשֶׂה לּ֣/וֹ אִמּ֔/וֹ וְ/הַעַלְתָ֥ה ל֖/וֹ מִ/יָּמִ֣ים יָמִ֑ימָ/ה בַּֽ/עֲלוֹתָ/הּ֙ אֶת אִישָׁ֔/הּ לִ/זְבֹּ֖חַ אֶת זֶ֥בַח הַ/יָּמִֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/019.yaml
  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
translation:
  language: te
  text: అతని తల్లి అతనికోసం ఒక చిన్న పైవస్త్రాన్ని తయారుచేసి, ప్రతి సంవత్సరం[a] తన భర్తతో కలిసి వార్షిక బలి అర్పించడానికి పైకి వెళ్లినప్పుడు, దానిని అతనికి తీసుకువచ్చేది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘దినాలనుండి దినాలకు’; ఇది ‘ప్రతి సంవత్సరం’ లేదా ‘ఏటేటా’ అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ‘పైవస్త్రం’ అని అనువదించిన హెబ్రీ పదం బయట ధరించే వస్త్రాన్ని సూచిస్తుంది; ‘అంగీ’ లేదా ‘కప్పుకునే వస్త్రం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל
  choice: అంగీ
  rationale: ఈ హెబ్రీ పదం పైవస్త్రాన్ని సూచిస్తుంది. ఆలయ సంబంధ సందర్భంలో బాలుడైన సమూయేలు ధరించే వస్త్రానికి ‘అంగీ’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: קָטֹן
  choice: చిన్న
  rationale: బాలుని కొలతకు తగిన వస్త్రమని సూటిగా, సహజంగా తెలియజేస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: తయారుచేసి … తీసుకువచ్చేది
  rationale: హెబ్రీ అసంపూర్ణ క్రియ ఇక్కడ గతంలో అలవాటుగా పునరావృతమైన చర్యను సూచిస్తుంది; తెలుగు ‘తీసుకువచ్చేది’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהַעַלְתָה לּוֹ
  choice: దానిని అతని దగ్గరికి తీసుకువచ్చేది
  rationale: עלהలోని పైకి వెళ్లే భావం సమీపంలోని בַּעֲלוֹתָהּ అనువాదంలో నిలుపబడింది; వస్త్రాన్ని సమూయేలు దగ్గరికి తీసుకురావడాన్ని తెలుగులో సహజంగా చెప్పింది.
- source_word: מִיָּמִים יָמִימָה
  choice: ప్రతి సంవత్సరం
  rationale: అక్షరార్థంగా ‘దినాలనుండి దినాలకు’ అయినా, ఇది ఏటేటా జరిగే చర్యను సూచించే హెబ్రీ నుడికారం.
- source_word: בַּעֲלוֹתָהּ
  choice: పైకి వెళ్లినప్పుడు
  rationale: కాలసూచక భావంతో పాటు ఆరాధనాస్థలానికి ఎక్కి వెళ్లే యాత్రాభావాన్ని నిలుపుతుంది.
- source_word: אִישָׁהּ
  choice: తన భర్తతో కలిసి
  rationale: ఈ సంబంధ సందర్భంలో אִישָׁהּ అంటే ‘ఆమె భర్త’; ‘కలిసి’ అనే పదం సహగమనాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לִזְבֹּחַ
  choice: బలి అర్పించడానికి
  rationale: బలిగా వధించడం/అర్పించడం అనే ఆరాధనా చర్యను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: זֶבַח הַיָּמִים
  choice: వార్షిక బలి
  rationale: క్రమంగా ప్రతి సంవత్సరం జరిగే బలిని సూచించే పదబంధానికి సంక్షిప్తమైన, స్పష్టమైన తెలుగు సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘పైకి వెళ్లినప్పుడు’ ద్వారా తీర్థయాత్ర/ఆరాధనాస్థలానికి ఎక్కి వెళ్లే మూలభాషా భావం నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
