  rationale: మְעִיל యొక్క ‘బయట ధరించే వస్త్రం/రోబ్’ అనే భావాన్ని ఖచ్చితంగా చూపడానికి అంగీ స్థానంలో పైవస్త్రం వాడబడింది. ఇతర పదబంధాలు మూలంలోని ఆచారబద్ధ గతకాల భావం, వార్షిక నుడికారం, మరియు యాత్రాభావాన్ని తగినట్లే నిలుపుతున్నాయి.
