- from: అతని తల్లి అతనికోసం ఒక చిన్న అంగీని తయారుచేసి, ప్రతి సంవత్సరం[a] తన భర్తతో కలిసి వార్షిక బలి అర్పించడానికి పైకి వెళ్లినప్పుడు, దానిని అతని దగ్గరికి తీసుకువచ్చేది.[b]
