source:
  edition: WLC
  text: אֵין קָד֥וֹשׁ כַּ/יהוָ֖ה כִּ֣י אֵ֣ין בִּלְתֶּ֑/ךָ וְ/אֵ֥ין צ֖וּר כֵּ/אלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/002.yaml
  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
translation:
  language: te
  text: 'యాహ్వే[a]వంటి పరిశుద్ధుడు ఎవరూ లేరు;

    ఎందుకంటే నీవు తప్ప మరెవరూ లేరు;

    మన దేవునివంటి బండ మరొకటి లేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: יהוה (YHWH), దైవనామం; ఇక్కడ “యాహ్వే”గా ధ్వన్యనువదించబడింది.'
    reason: మూలంలోని దైవనామాన్ని గుర్తించి, ప్రధాన పాఠంలోని ధ్వన్యనువాదాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: אֵין
  choice: ఎవరూ లేరు / మరొకటి లేదు
  rationale: హీబ్రూ అస్తిత్వనిరాకరణను సహజమైన తెలుగులో వ్యక్తపరుస్తూ, మూడు పాదాల్లోని పునరుక్తి మరియు సమాంతరతను నిలుపుతుంది.
- source_word: קָדוֹשׁ
  choice: పరిశుద్ధుడు
  rationale: దేవుని ప్రత్యేకతను, పవిత్రతను సూచించే ప్రామాణికమైన మరియు గంభీరమైన తెలుగు పదం.
- source_word: כַּיהוָה
  choice: యెహోవావంటి
  rationale: כְּ అనే పోలిక సూచకాన్ని ‘వంటి’గా చూపించి, יהוה అనే దైవనామాన్ని ధ్వన్యనువాదంగా నిలుపుతుంది.
- source_word: כִּי
  choice: పాద విభజనలో అంతర్భూతమైన వివరణాత్మక సంబంధం
  rationale: ఇక్కడి כִּי ముందటి ప్రకటనకు ఆధారాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఎందుకంటే’ చేర్చడం కవితా ప్రవాహాన్ని భారంగా చేయగలదు; సెమికోలన్‌తో సంబంధం సహజంగా గ్రహింపబడుతుంది.
- source_word: בִּלְתֶּךָ
  choice: నీవు తప్ప
  rationale: మినహాయింపు భావాన్ని, అలాగే దేవునితో నేరుగా మాట్లాడే రెండవ పురుష సంబోధనను స్పష్టంగా కాపాడుతుంది.
- source_word: צוּר
  choice: ఆశ్రయదుర్గం
  rationale: మూలంలోని ‘బండ/శిల’ రూపకాన్ని తెలుగులో దేవుడు ఇచ్చే స్థిరత్వం, రక్షణ అనే భావాలతో సహజంగా వ్యక్తపరుస్తుంది; అయితే రూపకాన్ని అక్షరార్థంగా ఉంచే ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: כֵּאלֹהֵינוּ
  choice: మన దేవునివంటి
  rationale: כְּ పోలికను ‘వంటి’గా, אֱלֹהִיםను ఇశ్రాయేలు దేవునికి సంబంధించిన ఏకవచన బిరుదుగా, మొదటి పురుష బహువచన ప్రత్యయాన్ని ‘మన’గా అందిస్తుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలుపుతుంది. ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఉంచి, మూల అక్షరాలు మరియు మరో ధ్వన్యనువాదాన్ని పాదటిప్పణిలో సూచిస్తుంది.
- issue: צוּר అనే దేవుని రూపకం
  choice: ఆశ్రయదుర్గం
  alternative: బండ / శిల
  rationale: దేవుని స్థిరత్వం, బలం, రక్షణను సూచించే రూపక ప్రభావాన్ని సాధారణ ఆధునిక తెలుగు పాఠకునికి తెలియజేస్తుంది. అక్షరార్థ రూపాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
- issue: אֱלֹהִים యొక్క సంఖ్య
  choice: దేవుడు
  alternative: దేవతలు
  rationale: రూపపరంగా బహువచనాకారం ఉన్నా, ఇక్కడ ఇశ్రాయేలు దేవుని సూచించే ఏకవచన బిరుదుగా పనిచేస్తుంది.
translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని అనుసరించాం. హీబ్రూ మూడు పాదాల సమాంతర నిర్మాణాన్ని నిలిపాం. అయితే ప్రధాన పాఠంలో [b] గుర్తు అవసరం: ‘ఆశ్రయదుర్గం[b]’గా చదవాలి.'
