translation:
  language: te
  text: ఏలీ కుమారులు నీచులు[a]; వారు యెహోవాను ఎరుగలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘బెలీయాలు కుమారులు’; అక్షరార్థంగా ‘నికృష్టతకు కుమారులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యెహోవాను అంగీకరించలేదు’ లేదా ‘యెహోవాపట్ల వారికి గౌరవం లేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי עֵלִי
  choice: ఏలీ కుమారులు
  rationale: בְנֵי עֵלִי అంటే ‘ఏలీ కుమారులు.’ వాక్యారంభంలోని ו అనేది సందర్భాన్ని కలిపే సంధి; తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండానే సహజంగా భావం వస్తుంది.
- source_word: בְּנֵי בְלִיָּעַל
  choice: పనికిమాలినవారు
  rationale: అక్షరార్థంగా ‘పనికిమాలినతనపు కుమారులు’ అనే ఈ హీబ్రూ నుడికారం నీచమైన, దుష్ట స్వభావంగల మనుషులను సూచిస్తుంది. ‘బెలీయాలు కుమారులు’ అని వ్యక్తినామంగా మార్చకుండా, నుడికారపు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: לֹא יָדְעוּ
  choice: ఎరుగలేదు
  rationale: יָדַע యొక్క ప్రాథమిక భావమైన ‘తెలుసుకొను/ఎరుగు’ను నిలుపుతూ, ఇక్కడ ఉండగల సంబంధపూర్వక గుర్తింపు మరియు గౌరవం అనే భావాలను స్పష్టీకరించి కుదించకుండా ఉంచుతుంది.
- source_word: אֶת יְהוָה
  choice: యెహోవాను
  rationale: దైవనామం יהוה ను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం; אֶת కర్మ సూచిక కావడంతో విడిగా అనువదించలేదు.
theological_decisions:
- issue: בְּלִיָּעַל ను సాధారణ నామార్థ నుడికారంగా తీసుకోవాలా, ‘బెలీయాలు’ అనే వ్యక్తినామంగా తీసుకోవాలా
  choice: నైతిక పనికిమాలినతనాన్ని సూచించే సాధారణ నామార్థ నుడికారం
  alternative: ‘బెలీయాలు కుమారులు’
  rationale: ఈ సందర్భంలో ఈ పదబంధం ఒక పేరుగల దుష్టాత్మను స్పష్టంగా సూచించకుండా, ఏలీ కుమారుల నీచ స్వభావాన్ని వర్ణిస్తుంది. తరువాతి కాలపు వ్యక్తీకృత భావాన్ని వచనంలోకి దిగుమతి చేయలేదు.
- issue: ‘యెహోవాను ఎరుగలేదు’ అనే మాటను సంబంధపూర్వక అర్థంతో విపులీకరించాలా
  choice: ‘యెహోవాను ఎరుగలేదు’ అని మూలంలోని జ్ఞాన భాషను నిలుపుట
  alternative: ‘యెహోవాను అంగీకరించలేదు’ / ‘యెహోవాపట్ల వారికి గౌరవం లేదు’
  rationale: ‘ఎరుగుట’ ఇక్కడ సంబంధం, అంగీకారం, విధేయత అనే భావాలను మోసే అవకాశం ఉంది. వాటిలో ఒక్కదానినే ప్రధాన పాఠ్యంలో నిర్ణయించకుండా మూలంలోని ధార్మిక ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరతతో అనువదించబడింది. ‘ఎరుగలేదు’ అనే కొద్దిగా శాస్త్రగ్రంథోచితమైన రూపం మూలంలోని ‘తెలుసుకొను’ భావాన్నీ దాని సంబంధపూర్వక ధార్మిక బరువునీ సంక్షిప్తంగా నిలుపుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
