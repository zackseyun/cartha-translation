  terminology: “యాహ్వే” appropriately preserves the divine name. “పేదవారిగా చేస్తాడు / ధనవంతులుగా చేస్తాడు” accurately conveys the economic antithesis. The alternative in footnote a is better phrased as a verbal lexical alternative rather than merely a near-synonymous adjectival expression.
  issues:
