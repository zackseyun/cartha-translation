source:
  edition: WLC
  text: יְהוָ֖ה מוֹרִ֣ישׁ וּ/מַעֲשִׁ֑יר מַשְׁפִּ֖יל אַף מְרוֹמֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/007.yaml
  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
translation:
  language: te
  text: యాహ్వే పేదవారిగా చేస్తాడు[a], ధనవంతులుగా చేస్తాడు; ఆయన కిందికి దింపుతాడు, కూడా పైకి లేపుతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దరిద్రపరుస్తాడు.” ఈ హీబ్రూ క్రియకు నష్టం కలిగించడం లేదా స్వాధీనాన్ని కోల్పోయేలా చేయడం అనే విస్తృత భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఉన్నతపరుస్తాడు” లేదా “పైకెత్తుతాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מוֹרִישׁ
  choice: పేదవారిగా చేస్తాడు
  rationale: ירשׁ ధాతువు హిఫీల్ రూపానికి స్వాధీనం కోల్పోయేలా చేయడం అనే విస్తృత అర్థం ఉండవచ్చు; అయితే ‘ధనవంతులుగా చేస్తాడు’ అనే వ్యతిరేక సమాంతర పదబంధం ఇక్కడ పేదరికానికి గురిచేయడం అనే భావాన్ని సూచిస్తుంది.
- source_word: וּמַעֲשִׁיר
  choice: ధనవంతులుగా చేస్తాడు
  rationale: עשׁר హిఫీల్ రూపంలోని కారణార్థాన్ని స్పష్టంగా తెలియజేస్తూ, ముందున్న ‘పేదవారిగా చేస్తాడు’ అనే పదబంధంతో కవితాత్మక సమతూకాన్ని నిలుపుతుంది.
- source_word: מַשְׁפִּיל
  choice: కిందికి దింపుతాడు
  rationale: ఈ క్రియలోని దిగువకు తీసుకురావడం లేదా స్థాయిని తగ్గించడం అనే రూపకాన్ని నిలుపుతూ, తరువాతి ‘పైకి లేపుతాడు’తో ఉన్న వ్యతిరేక సమాంతరతను కాపాడుతుంది.
- source_word: אַף
  choice: —
  rationale: ఈ సందర్భంలో אַף ఇచ్చే కూడిక లేదా ఉద్ఘాటన భావం, తెలుగు సమాంతర వాక్య నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది; ప్రత్యేకంగా ‘కూడా’ చేరిస్తే పాదం భారంగా మారుతుంది.
- source_word: מְרוֹמֵם
  choice: పైకి లేపుతాడు
  rationale: రום యొక్క కారణార్థాన్ని, అలాగే ‘కిందికి దింపుతాడు’తో ఉన్న నిలువు దిశ రూపకాన్ని స్పష్టంగా నిలుపుతుంది; సందర్భానుసారం ఇది ఘనపరచడం అనే భావాన్నీ కలిగి ఉండవచ్చు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో దేవుని వ్యక్తిగత నామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, తెలుగు లిపిలో ‘యాహ్వే’గా అందించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితాత్మక సమాంతర నిర్మాణం వాడబడింది. హీబ్రూ పాదాల్లో కర్మ స్పష్టంగా చెప్పబడనందున తెలుగులోనూ నిర్దిష్ట వ్యక్తి లేదా వర్గాన్ని చేర్చలేదు. ‘కిందికి దింపుతాడు/పైకి లేపుతాడు’ అనే జత మూలంలోని నిలువు దిశ రూపకాన్ని కాపాడుతుంది.
