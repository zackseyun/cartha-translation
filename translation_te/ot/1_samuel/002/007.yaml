  source_fidelity: The paired causatives are represented accurately, and the vertical imagery of מַשְׁפִּיל / מְרוֹמֵם is retained. However, אַף has been left unexpressed; in this concise Hebrew poetic line its additive/emphatic force can be naturally retained with “కూడా.”
