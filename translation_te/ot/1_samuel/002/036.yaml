  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ בְּ/בֵ֣יתְ/ךָ֔ יָבוֹא֙ לְ/הִשְׁתַּחֲוֺ֣ת ל֔/וֹ לַ/אֲג֥וֹרַת כֶּ֖סֶף וְ/כִכַּר לָ֑חֶם וְ/אָמַ֗ר סְפָחֵ֥/נִי נָ֛א אֶל אַחַ֥ת הַ/כְּהֻנּ֖וֹת לֶ/אֱכֹ֥ל פַּת לָֽחֶם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
translation:
  language: te
  text: నీ ఇంటివారిలో మిగిలిన ప్రతి వ్యక్తీ చిన్న వెండి నాణెం కోసం, ఒక రొట్టె కోసం అతని ఎదుట వంగి నమస్కరించడానికి వచ్చి, ‘దయచేసి, రొట్టె ముక్క తినడానికి నన్ను యాజక పదవుల్లో ఏదో ఒకదానికి చేర్చుకోండి’ అని అంటాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנּוֹתָר בְּבֵיתְךָ
  choice: నీ ఇంటివారిలో మిగిలిన ప్రతివాడూ
  rationale: ఇక్కడ ‘ఇల్లు’ భవనాన్ని కాక ఏలీ వంశాన్ని లేదా కుటుంబాన్ని సూచిస్తుంది; הַנּוֹתָר తీర్పు తరువాత మిగిలిన వారిని సూచిస్తుంది.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: అతని ఎదుట వంగి నమస్కరించడానికి
  rationale: ఈ క్రియలో శారీరకంగా వంగడం, వినయంతో వేడుకోవడం అనే రెండు భావాలూ ఉన్నాయి. ‘అతని’ అనే ఏకవచన సూచనను మూలపాఠం ప్రకారమే నిర్దిష్ట గుర్తింపు లేకుండా ఉంచింది.
- source_word: לַאֲגֹרַת כֶּסֶף
  choice: వెండి నాణెం ముక్కకోసం
  rationale: אֲגוֹרָה చిన్న వెండి ద్రవ్య ప్రమాణాన్ని సూచిస్తుంది. ఆధునిక పాఠకునికి అర్థమయ్యేలా నాణెపు భావాన్ని తెలిపి, ఖచ్చిత ప్రమాణంపై ఉన్న అనిశ్చితిని పాదసూచికలో నిలిపింది.
- source_word: וְכִכַּר לָחֶם
  choice: ఒక రొట్టెకోసం
  rationale: כִּכָּר ఇక్కడ ఒక గుండ్రని రొట్టె లేదా రొట్టె పరిమాణాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘ఒక రొట్టె’ స్పష్టంగా ఉంటుంది.
- source_word: סְפָחֵנִי נָא
  choice: దయచేసి నన్ను … చేర్చుకోండి
  rationale: ספח ఒక వ్యక్తిని సమూహానికి లేదా పనికి జతచేయడం అనే భావాన్ని కలిగి ఉంది; נָא వినయపూర్వక విన్నపాన్ని సూచిస్తుంది.
- source_word: אַחַת הַכְּהֻנּוֹת
  choice: యాజక సేవల్లో ఒకదానికి
  rationale: బహువచన రూపం అనేక వేర్వేరు యాజకత్వాలకన్నా యాజక సంబంధమైన సేవలు, విధులు లేదా స్థానాలను సూచించే అవకాశం ఉంది. ప్రధాన పాఠంలో సహజమైన ‘సేవలు’ను ఎంచుకుని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: לֶאֱכֹל פַּת לָחֶם
  choice: ఒక ముక్క రొట్టె తినేలా
  rationale: פַּת చిన్న ముక్కను సూచిస్తుంది; ఈ మాట తీర్పు వల్ల కలిగే దారిద్ర్యాన్ని, దయనీయమైన విన్నపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘అతని’ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ఏలీ వంశస్థులు ఎవరి ఎదుట ఆధారపడతారో ఆ యాజక అధికారిని నిర్దిష్టంగా గుర్తించకుండా ఏకవచనంగా ఉంచడం
  alternative: ఆ కాలంలో యాజక అధికారాన్ని నిర్వహించే ఎవరినైనా సాధారణంగా సూచించడం
  rationale: మూలపాఠం ఏకవచన సర్వనామాన్ని వాడినా వ్యక్తి పేరును చెప్పదు. అనువాదం ఆ అస్పష్టతను కాపాడి, ఏలీ ఇంటి స్థితి తలకిందులవుతుందనే అంశాన్ని మాత్రమే స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే శైలి వాడబడింది. తీర్పు వాక్యంలోని స్థితి విపర్యయం, ఆకలి వల్ల కలిగిన దీనమైన విన్నపం నిలుపబడ్డాయి.
