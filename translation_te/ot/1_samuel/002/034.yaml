id: 1SA.2.34
reference: 1 Samuel 2:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֣ הָ/א֗וֹת אֲשֶׁ֤ר יָבֹא֙ אֶל שְׁנֵ֣י בָנֶ֔י/ךָ אֶל חָפְנִ֖י וּ/פִֽינְחָ֑ס בְּ/י֥וֹם אֶחָ֖ד יָמ֥וּתוּ שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
translation:
  language: te
  text: 'నీ ఇద్దరు కుమారులైన హొఫ్నీ, ఫీనెహాసులకు సంభవించేదే నీకు సూచనగా ఉంటుంది: వారిద్దరూ ఒకే రోజున చనిపోతారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאוֹת
  choice: సూచన
  rationale: אוֹת ఇక్కడ ముందుగా ప్రకటించిన తీర్పు నెరవేరుతుందనే నిర్ధారణనిచ్చే గుర్తును సూచిస్తుంది; ఆధునిక తెలుగులో ‘సూచన’ సహజంగా ఉండి, భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֲשֶׁר יָבֹא אֶל שְׁנֵי בָנֶיךָ
  choice: నీ ఇద్దరు కుమారులకు సంభవించేది
  rationale: ‘వారి మీదికి వచ్చేది’ అనే అక్షరార్థ రూపం తెలుగులో అసహజంగా ఉంటుంది; ‘సంభవించేది’ హీబ్రూ ప్రయోగంలోని ఘటన లేదా తీర్పు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶל חָפְנִי וּפִינְחָס
  choice: అయిన హొఫ్నీ, ఫీనెహాసులకు
  rationale: రెండవ אֶל ఇద్దరు కుమారులు ఎవరో వివరించే సమానాధికార సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘అయిన’తో పేర్లను నేరుగా జతచేయడం సహజం.
- source_word: בְּיוֹם אֶחָד
  choice: ఒకే రోజున
  rationale: అక్షరార్థంగా ‘ఒక రోజున’; సందర్భంలో ఇద్దరూ అదే రోజున మరణిస్తారనే ఉద్దేశాన్ని ‘ఒకే రోజున’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יָמוּתוּ שְׁנֵיהֶם
  choice: వారిద్దరూ చనిపోతారు
  rationale: שְׁנֵיהֶם ఇద్దరినీ సమగ్రంగా ఉద్ఘాటిస్తుంది; ‘వారిద్దరూ’ ఆ బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ‘సూచన’ స్వభావం
  choice: ఏలీ ఇంటిమీద ప్రకటించిన తీర్పును నిర్ధారించే సూచన
  alternative: నిర్ధారణ భావం లేని కేవలం ముందస్తు శకునం
  rationale: సందర్భంలో కుమారుల మరణం ప్రవచన వాక్యం నెరవేరుతుందనే నిర్ధారణగా పనిచేస్తుంది. అయితే ప్రధాన పాఠంలో విస్తృతార్థకమైన ‘సూచన’నే ఉంచి దాని భావాన్ని మరింత సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన ప్రవచన శైలి. పేర్లను ‘హొఫ్నీ, ఫీనెహాసు’గా లిప్యంతరీకరించాం.
