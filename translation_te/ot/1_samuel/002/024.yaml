  text: No[a], my sons; for the report that I hear is not good. You are making Yahweh’s people transgress.
translation:
  language: te
  text: “వద్దు[a], నా కుమారులారా! నేను వింటున్న వార్త మంచిది కాదు. మీరు యాహ్వే ప్రజలను అతిక్రమించేలా చేస్తున్నారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీయ వాక్యాన్ని మరో విధంగా అర్థం చేసుకుంటే: “నేను వింటున్న వార్త మంచిది కాదు; యాహ్వే ప్రజలు దానిని వ్యాప్తి చేస్తున్నారు.”'
    reason: מַעֲבִרִים עַם יְהוָה అనే పదబంధంలో ‘యాహ్వే ప్రజలు’ కృదంతానికి కర్తగా ఉండే ప్రత్యామ్నాయ వాక్యనిర్మాణాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: אַל
  choice: వద్దు
  rationale: ఇక్కడ ఇది ఒక నిర్దిష్ట క్రియను నిషేధించడం కంటే, ఏలీ తన కుమారులను గట్టిగా వారించే నిషేధార్థక ఉద్గారంగా ఉంది. ఆధునిక తెలుగులో ‘వద్దు’ ఆ తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: בָּנָי
  choice: నా కుమారులారా
  rationale: ఏలీ తన కుమారులనే నేరుగా సంబోధిస్తున్నాడు; సంబోధన రూపం తెలుగులో సహజంగా, మూలానికి నమ్మకంగా ఉంది.
- source_word: כִּי לֹא טוֹבָה הַשְּׁמֻעָה
  choice: నేను వింటున్న వార్త మంచిది కాదు
  rationale: ‘వార్త మంచిది కాదు’ అనే హెబ్రీయ మూలంలోని మితమైన కానీ స్పష్టమైన నైతిక అంచనాను నిలుపుతుంది; ‘చెడ్డది’ అని బలపరచలేదు.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: నేను వింటున్న
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న వినికిడిని తెలుగులో సహజమైన రూపంతో వ్యక్తం చేస్తుంది.
- source_word: מַעֲבִרִים
  choice: అతిక్రమించేలా చేస్తున్నారు
  rationale: עבר యొక్క హిఫీల్ రూపాన్ని ‘అతిక్రమించడానికి కారణమవడం’ అనే భావంలో గ్రహించి, సాధారణ పాపం కంటే హద్దు లేదా ఆజ్ఞను దాటే భావాన్ని నిలిపింది. వాక్యనిర్మాణంలోని నిజమైన సందిగ్ధతను పాదసూచికలో ఉంచింది.
- source_word: עַם יְהוָה
  choice: యాహ్వే ప్రజలు
  rationale: సంబంధాన్ని తెలుగులో సహజమైన సమాసరూపంలో తెలిపింది; దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయలేదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీయ దైవనామం יהוה ను తెలుగులో ధ్వన్యంతరీకరించి, ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా నిలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత నామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక పండితలోకంలో సాధారణమైన ఉచ్చారణకు దగ్గరగా తెలుగులో ధ్వన్యంతరీకరించింది.
- issue: מַעֲבִרִים עַם יְהוָה యొక్క వాక్యనిర్మాణం
  choice: మీరు యాహ్వే ప్రజలను అతిక్రమించేలా చేస్తున్నారు
  alternative: యాహ్వే ప్రజలు ఆ వార్తను వ్యాప్తి చేస్తున్నారు
  rationale: సందర్భంలో ఏలీ తన కుమారుల ప్రవర్తన ప్రజలను అతిక్రమణకు నడిపిస్తోందని వారిస్తున్నట్లు ప్రధాన పాఠం గ్రహిస్తుంది. అయితే హెబ్రీయ కృదంతం, దాని తరువాతి నామవాచక సమూహం మరో వాక్యనిర్మాణానికి కూడా వీలు ఇస్తాయి; దానిని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే సంభాషణ శైలి వాడబడింది. ‘వద్దు’ ఏలీ గట్టి వారింపును, ‘నా కుమారులారా’ అతని తండ్రి సంబంధాన్ని నిలుపుతాయి. ప్రధాన పాఠం సంక్షిప్తంగా ఉంచి, హెబ్రీయ వాక్యనిర్మాణ సందిగ్ధతను [a] పాదసూచికలో స్పష్టంగా సంరక్షించింది.
