  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עֵלִ֖י זָקֵ֣ן מְאֹ֑ד וְ/שָׁמַ֗ע אֵת֩ כָּל אֲשֶׁ֨ר יַעֲשׂ֤וּ/ן בָּנָי/ו֙ לְ/כָל יִשְׂרָאֵ֔ל וְ/אֵ֤ת אֲשֶֽׁר יִשְׁכְּבוּ/ן֙ אֶת הַ/נָּשִׁ֔ים הַ/צֹּ֣בְא֔וֹת פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
translation:
  language: te
  text: ఏలీ చాలా వృద్ధుడు. అతని కుమారులు ఇశ్రాయేలీయులందరికీ చేస్తున్నదంతా, అలాగే సమావేశపు గుడారం ప్రవేశద్వారం వద్ద సేవచేస్తున్న స్త్రీలతో[a] వారు శయనిస్తున్నారనే సంగతిని కూడా అతడు విన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమావేశపు గుడారం ప్రవేశద్వారం వద్ద సమకూడే స్త్రీలతో.” హీబ్రూ కృదంతం వ్యవస్థీకృతంగా సమకూడడాన్ని లేదా సేవచేయడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: చాలా ముసలివాడయ్యాడు
  rationale: హీబ్రూ విశేషణం మరియు తీవ్రతను సూచించే పదాన్ని సహజమైన ఆధునిక తెలుగులో బలాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: וְשָׁמַע
  choice: అతడు విన్నాడు
  rationale: కథనంలోని qatal రూపం ఏలీ ఈ విషయాలను విన్నాడనే వాస్తవాన్ని తెలియజేస్తుంది; సాధారణ భూతకాలం దీనికి సరిపోతుంది.
- source_word: כָּל אֲשֶׁר יַעֲשׂוּן
  choice: చేస్తున్నదంతా
  rationale: కుమారుల కొనసాగుతున్న ప్రవర్తనను సమగ్రంగా సూచించే హీబ్రూ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరికీ
  rationale: לְ యొక్క సంబంధార్థాన్ని దగ్గరగా నిలుపుతుంది; ‘వారికి విరోధంగా’ అని అనువదించడం మూలంలోని సూక్ష్మతను అవసరానికి మించి నిర్ణయిస్తుంది.
- source_word: יִשְׁכְּבוּן אֶת־הַנָּשִׁים
  choice: స్త్రీలతో వారు శయనిస్తున్నారు
  rationale: שׁכב ఇక్కడ లైంగిక భావంలోని సంప్రదాయ సౌమ్యోక్తి. ‘శయనిస్తున్నారు’ ఆ భావాన్ని గౌరవప్రదంగా, మూలం కంటే మరీ బహిరంగంగా కాకుండా తెలియజేస్తుంది.
- source_word: הַצֹּבְאוֹת
  choice: సేవచేస్తున్న
  rationale: ఈ కృదంతం వ్యవస్థీకృత సేవను లేదా సమకూడడాన్ని సూచించగలదు. పరిశుద్ధస్థల సందర్భంలో ‘సేవచేస్తున్న’ అనేది స్పష్టమైన ప్రధాన పఠనం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారం ప్రవేశద్వారం దగ్గర
  rationale: పరిశుద్ధస్థలానికి సంబంధించిన స్థిరమైన పదబంధాన్ని ఆధునిక తెలుగులో సహజంగా, సాంకేతిక సూచనను నిలుపుతూ అందిస్తుంది.
theological_decisions:
- issue: పరిశుద్ధస్థలం దగ్గర ఉన్న స్త్రీల పాత్ర
  choice: ప్రవేశద్వారం దగ్గర సేవచేస్తున్న స్త్రీలు
  alternative: ప్రవేశద్వారం దగ్గర సమకూడే స్త్రీలు
  rationale: హీబ్రూ కృదంతం రెండు భావాలనూ అనుమతిస్తుంది. నిర్గమకాండం 38:8లోని సమాంతర వాడుక మరియు ఆరాధనా సందర్భం వల్ల ‘సేవచేస్తున్న’ అనే పఠనం ప్రధాన అనువాదంగా సముచితం; అయితే ‘యాజకురాళ్లు’ వంటి తరువాతి సంస్థాగత భావాన్ని చేర్చలేదు.
- issue: లైంగిక దుష్ప్రవర్తనను ఎంత స్పష్టంగా చెప్పాలి
  choice: శయనిస్తున్నారు
  alternative: లైంగిక సంబంధాలు పెట్టుకుంటున్నారు
  rationale: మూల హీబ్రూ సౌమ్యోక్తిని వాడుతుంది. ఈ ఎంపిక పాపాన్ని దాచకుండా, మూలం కంటే మరింత వైద్యపరంగా లేదా బహిరంగంగా చేయకుండా అదే శైలిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలో స్పష్టమైన ‘ఇప్పుడు’ అనే కాలసూచక పదం లేనందున అలాంటి ఆరంభ పదాన్ని చేర్చలేదు. స్త్రీల పాత్రకు సంబంధించిన నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం; పాదటిప్పణి గుర్తును సంబంధిత పదబంధం వద్ద ఉంచాం.
