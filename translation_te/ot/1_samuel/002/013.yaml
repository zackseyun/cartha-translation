translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీ వాక్యంలో ఉన్న ఆనవాయితీ భావం, పునరావృత చర్య, పనిముట్టు ఆకారం నిలుపబడ్డాయి.
