source:
  edition: WLC
  text: וּ/מִשְׁפַּ֥ט הַ/כֹּהֲנִ֖ים אֶת הָ/עָ֑ם כָּל אִ֞ישׁ זֹבֵ֣חַ זֶ֗בַח וּ/בָ֨א נַ֤עַר הַ/כֹּהֵן֙ כְּ/בַשֵּׁ֣ל הַ/בָּשָׂ֔ר וְ/הַ/מַּזְלֵ֛ג שְׁלֹ֥שׁ הַ/שִּׁנַּ֖יִם בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'The custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
translation:
  language: te
  text: 'యాజకులు ప్రజలతో వ్యవహరించే పద్ధతి ఇలా ఉండేది: ఏ పురుషుడైనా బలి అర్పిస్తున్నప్పుడు, మాంసం ఉడుకుతూ ఉండగా యాజకుని సేవకుడు మూడు పళ్లు గల ఫోర్కును[a] చేతిలో పట్టుకొని వచ్చేవాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాంసపు కొక్కెం”; హెబ్రీ పదం పాత్రలోని మాంసాన్ని తీయడానికి ఉపయోగించే ఫోర్కు వంటి పనిముట్టును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפַּט
  choice: వ్యవహరించే పద్ధతి
  rationale: מִשְׁפָּט అనే పదానికి తీర్పు, నియమం, హక్కు, ఆనవాయితీ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ యాజకులు ప్రజల విషయంలో పాటిస్తూ వచ్చిన చర్యను పరిచయం చేస్తున్నందున ‘వ్యవహరించే పద్ధతి’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: הַכֹּהֲנִים אֶת־הָעָם
  choice: యాజకులు ప్రజలతో వ్యవహరించే
  rationale: ఈ పదబంధం యాజకులు ప్రజల పట్ల లేదా ప్రజలతో పాటించిన ఆచరణను సూచిస్తుంది; ‘ప్రజలతో వ్యవహరించే’ అనేది సంబంధ భావాన్ని అతిగా వ్యాఖ్యానించకుండా స్పష్టంగా తెలుపుతుంది.
- source_word: כָּל־אִישׁ
  choice: ఏ పురుషుడైనా
  rationale: אִישׁ యొక్క ఏకవచన పుంలింగ రూపాన్ని నిలుపుతూ, כָּל యొక్క విభజనాత్మక భావాన్ని ‘ఏ...అయినా’ సహజంగా తెలియజేస్తుంది.
- source_word: זֹבֵחַ זֶבַח
  choice: బలి అర్పిస్తున్నప్పుడు
  rationale: హెబ్రీలో ఒకే మూలానికి చెందిన క్రియా-నామ కలయిక ఉంది. తెలుగులో దానిని పదేపదే అనువదించడం కృత్రిమంగా ఉండేందున, కొనసాగుతున్న బలి చర్యను సహజంగా తెలిపే రూపం వాడబడింది.
- source_word: וּבָא
  choice: వచ్చేవాడు
  rationale: వచనం పదేపదే జరిగే ఆనవాయితీని వివరిస్తోంది కాబట్టి, అలవాటుగా జరిగే గత చర్యను ‘వచ్చేవాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: נַעַר הַכֹּהֵן
  choice: యాజకుని సేవకుడు
  rationale: נַעַר యువకుడిని లేదా సేవకుణ్ణి సూచించవచ్చు. ఇక్కడ యాజకుని తరఫున బలి మాంసాన్ని తీసే విధి ప్రధానంగా ఉన్నందున ‘సేవకుడు’ తగినది.
- source_word: כְּבַשֵּׁל הַבָּשָׂר
  choice: మాంసం ఉడుకుతూ ఉండగా
  rationale: כְּ తో కూడిన infinitive construct కాలసంబంధమైన ‘ఉడుకుతున్నప్పుడు/ఉండగా’ భావాన్ని ఇస్తుంది; בָּשָׂר ఇక్కడ బలి జంతువు మాంసం.
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  choice: మూడు మొనలు గల గరిటె
  rationale: అక్షరార్థంగా ‘మూడు పళ్లు గల మజ్లేగ్’ అని ఉంది. మాంసాన్ని పాత్రలోనుంచి తీయడానికి ఉపయోగించే fork వంటి పనిముట్టును ఆధునిక తెలుగులో ‘మూడు మొనలు గల గరిటె’ స్పష్టంగా తెలియజేస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: בְּיָדוֹ
  choice: చేతిలో పట్టుకొని
  rationale: సేవకుడు ఆ పనిముట్టును తన చేతిలో ఉంచుకొని రావడాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
