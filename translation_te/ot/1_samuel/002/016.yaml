  rationale: כַּיּוֹםను “ఈ రోజే”గా పునరుద్ధరించి, సందర్భం సూచించే క్రమాన్ని “ముందుగా ... ఆ తర్వాత” ద్వారా ఉంచాం. “నీ మనసు కోరినదేదైనా” మూలంలోని “నీ ప్రాణం/మనసు కోరినట్లు” అనే ప్రయోగాన్ని సహజంగా ప్రతిబింబిస్తుంది. సేవకుని డిమాండును స్పష్టమైన ప్రత్యక్ష ఆజ్ఞగా “ఇప్పుడే ఇవ్వు” అని ఇచ్చాం. పాదటిప్పణి నుండి כַּיּוֹםకు అసమర్థమైన “ముందుగా” అనే ప్రత్యామ్నాయాన్ని తొలగించాం.
