  terminology: “కొవ్వు” బలి సందర్భానికి సరైన పదం. “దహించనివ్వండి” మూలంలోని బహువచన క్రియను, “నీ/తీసుకో” తరువాతి ఏకవచన సంబోధనను కాపాడుతుంది. పాదటిప్పణి హీబ్రూ emphatic క్రియా నిర్మాణాన్ని మాత్రమే వివరిస్తుంది; כַּיּוֹםను “ముందుగా” అని అర్థం చేసుకోవచ్చనే అసురక్షిత వ్యాఖ్యను తొలగించింది.
