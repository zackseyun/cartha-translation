  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו הָ/אִ֗ישׁ קַטֵּ֨ר יַקְטִיר֤וּ/ן כַּ/יּוֹם֙ הַ/חֵ֔לֶב וְ/קַ֨ח לְ/ךָ֔ כַּ/אֲשֶׁ֥ר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/אָמַ֥ר ל/ו כִּ֚י עַתָּ֣ה תִתֵּ֔ן וְ/אִם לֹ֖א לָקַ֥חְתִּי בְ/חָזְקָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
translation:
  language: te
  text: ఆ మనిషి అతనితో, “ముందుగా, ఈ రోజే కొవ్వును తప్పకుండా దహించనివ్వండి[a]; ఆ తర్వాత నీ మనసు కోరినదేదైనా తీసుకో” అనేవాడు. అయితే అతడు, “కాదు, ఇప్పుడే ఇవ్వు; లేకపోతే బలవంతంగా తీసుకుంటాను” అనేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ రోజే కొవ్వును తప్పకుండా దహించనివ్వండి.” హీబ్రూలో క్రియను నొక్కిచెప్పే రూపం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: నిర్దిష్ట ఏకవచన పురుషలింగ నామవాచకం; సందర్భంలో బలి అర్పిస్తున్న వ్యక్తిని సూచిస్తుంది.
- source_word: קַטֵּר יַקְטִירוּן
  choice: తప్పకుండా దహించనివ్వండి
  rationale: క్రియకు ముందు అదే ధాతువుకు చెందిన infinitive absolute ఉండడం వల్ల కలిగే నొక్కిచెప్పే భావాన్ని ‘తప్పకుండా’ ద్వారా వ్యక్తం చేసింది.
- source_word: כַּיּוֹם
  choice: ముందుగా
  rationale: ఈ సందర్భంలో బలి కొవ్వును దహించిన తరువాతనే మాంసం తీసుకోవాలనే క్రమాన్ని సూచించే కాలసంబంధ భావాన్ని సహజమైన తెలుగులో తెలిపింది; పదానికి ఉన్న అసాధారణ రూపం కారణంగా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: הַחֵלֶב
  choice: కొవ్వు
  rationale: బలిలో దహించవలసిన కొవ్వు భాగాలను సూచించే సందర్భోచితమైన సాధారణ పదం.
- source_word: וְקַח לְךָ
  choice: ఆ తర్వాత ... తీసుకో
  rationale: కొవ్వు దహనం జరిగిన తరువాత తీసుకోవచ్చనే వరుసను తెలుగులో స్పష్టంగా, అదనపు ఆచార వివరణ లేకుండా తెలిపింది.
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: నీ మనసు కోరినంత
  rationale: అక్షరార్థంగా ‘నీ ప్రాణం/ఆత్మ కోరినట్లు’; ఆధునిక తెలుగులో కోరికను సహజంగా తెలిపే ‘మనసు కోరినంత’ మూలభావాన్ని నిలుపుతుంది.
- source_word: וְאָמַר לוֹ
  choice: అయితే అతడు ... అనేవాడు
  rationale: చుట్టుపక్కల వచనాల్లోని అలవాటుగా జరిగే చర్యను ‘అనేవాడు’ తెలియజేస్తుంది; ప్రతివాద భావాన్ని ‘అయితే’ సూచిస్తుంది.
- source_word: כִּי עַתָּה תִתֵּן
  choice: కాదు, ఇప్పుడే ఇవ్వాలి
  rationale: כִּי ఇక్కడ ఎదురుదెబ్బ లేదా పట్టుదలతో చేసిన డిమాండును ప్రవేశపెడుతుంది; తెలుగులో సహజమైన ప్రత్యుత్తరంగా ‘కాదు’ను ఉపయోగించి, బలవంతపు ఆజ్ఞను ‘ఇవ్వాలి’తో తెలిపింది.
- source_word: וְאִם לֹא
  choice: ఇవ్వకపోతే
  rationale: షరతును సంక్షిప్తమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָקַחְתִּי בְחָזְקָה
  choice: బలవంతంగా తీసుకుంటాను
  rationale: పూర్తిక్రియా రూపం బెదిరింపులో భవిష్యత్తు/నిశ్చయార్థక బలాన్ని కలిగి ఉంది; בְחָזְקָה బలప్రయోగంతో స్వాధీనం చేసుకోవడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: బలి అర్పణలో కొవ్వు దహనం మరియు మాంసం తీసుకోవడం మధ్య క్రమం
  choice: ముందుగా కొవ్వును దహించనిచ్చి, ఆ తరువాత మాంసం తీసుకోవాలనే నిరసనగా అనువదించడం
  alternative: కాలక్రమాన్ని స్పష్టం చేయకుండా మరింత పదానువాదంగా ఇవ్వడం
  rationale: వచనంలోని ఘర్షణ సరైన బలి క్రమాన్ని సేవకుని బలవంతపు డిమాండుతో పోలుస్తుంది. క్రమాన్ని స్పష్టపరచడం సందర్భాన్ని అర్థమయ్యేలా చేస్తుంది; అయితే ప్రధాన పాఠ్యంలో అదనపు ఆచారశాస్త్ర వివరణను చేర్చలేదు.
- issue: ప్రత్యుత్తరం చెప్పే వ్యక్తి గుర్తింపు
  choice: ‘అతడు’ అని మూలంలోని సర్వనామ అస్పష్టతను నిలుపడం
  alternative: ‘సేవకుడు’ అని సందర్భార్థాన్ని స్పష్టంగా చేర్చడం
  rationale: సందర్భం యాజకుని సేవకుని సూచించినప్పటికీ, ఈ వచనంలోని హీబ్రూ వాక్యం పేరును మళ్లీ చెప్పకుండా సర్వనామాన్నే ఉపయోగిస్తుంది; అందువల్ల అనువాదం అనవసరంగా స్పష్టీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి. సంభాషణలోని మర్యాదపూర్వక బహువచనం (‘దహించనివ్వండి’) మరియు సేవకునితో ఏకవచన సంబోధన (‘నీ’, ‘తీసుకో’) మూలంలోని సంభాషణ గమనాన్ని సహజంగా ప్రతిబింబిస్తాయి.
