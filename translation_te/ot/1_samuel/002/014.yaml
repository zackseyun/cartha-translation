revisions:
- from: అతడు ఆ మూడుమొనల కొంకిని[a] గంగాళంలోనైనా, కుండలోనైనా, బానలోనైనా, వంటపాత్రలోనైనా గుచ్చేవాడు. ఆ కొంకికి తగిలి పైకి వచ్చినదంతా యాజకుడు దానితో తీసుకునేవాడు. షిలోహుకు అక్కడికి వచ్చిన ఇశ్రాయేలీయులందరికీ వారు ఇలాగే చేసేవారు.[b]
  to: అతడు ఆ మూడుమొనల కొంకిని[a] గంగాళంలోనైనా, కుండలోనైనా, బానలోనైనా, వంటపాత్రలోనైనా గుచ్చేవాడు. కొంకి పైకి తీసుకొచ్చినదంతా యాజకుడు తీసుకునేవాడు. షిలోహుకు వచ్చిన ఇశ్రాయేలీయులందరికీ వారు ఇలాగే చేసేవారు.[b]
  rationale: సవరణలు అర్థాన్ని మార్చవు. షిలోహుకు సంబంధించి ఉన్న అనవసర పునరుక్తిని తొలగించాం. కొంకి ద్వారా పైకి వచ్చినదాన్ని యాజకుడు తీసుకోవడాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంతో చెప్పి, మూలంలోని సాధనార్థక సంబంధాన్ని సందర్భంలో స్పష్టంగా ఉంచాం. హీబ్రూలోని ఏకవచన–బహువచన మార్పును అలాగే నిలిపాం.
