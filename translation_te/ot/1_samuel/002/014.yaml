  text: וְ/הִכָּ֨ה בַ/כִּיּ֜וֹר א֣וֹ בַ/דּ֗וּד א֤וֹ בַ/קַּלַּ֨חַת֙ א֣וֹ בַ/פָּר֔וּר כֹּ֚ל אֲשֶׁ֣ר יַעֲלֶ֣ה הַ/מַּזְלֵ֔ג יִקַּ֥ח הַ/כֹּהֵ֖ן בּ֑/וֹ כָּ֚כָה יַעֲשׂ֣וּ לְ/כָל יִשְׂרָאֵ֔ל הַ/בָּאִ֥ים שָׁ֖ם בְּ/שִׁלֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/014.yaml
  text: and he would thrust it into the basin[a], or the pot, or the kettle, or the cooking pan; all that the fork brought up, the priest would take with it[b]. Thus they did to all Israel who came there to Shiloh.
translation:
  language: te
  text: అతడు ఆ మూడుమొనల కొంకిని[a] గంగాళంలోనైనా, కుండలోనైనా, బానలోనైనా, వంటపాత్రలోనైనా గుచ్చేవాడు. కొంకి పైకి తీసుకొచ్చినదంతా యాజకుడు తీసుకునేవాడు. షిలోహుకు వచ్చిన ఇశ్రాయేలీయులందరికీ వారు ఇలాగే చేసేవారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కొంకి’ అంటే బలి మాంసాన్ని పాత్రలోనుండి తీయడానికి ఉపయోగించే మూడుమొనల పనిముట్టు.
    reason: lexical_alternative
  - marker: b
    text: ఈ వాక్యంలో చెప్పబడిన పాత్రల హీబ్రూ పేర్ల మధ్య ఖచ్చితమైన తేడాలు తెలియవు; అవి వివిధ రకాల వంటపాత్రలను సూచిస్తాయి.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכָּה
  choice: గుచ్చేవాడు
  rationale: హిఫీల్ రూపం ఇక్కడ పాత్రలోకి పనిముట్టును బలంగా దూర్చే, పదేపదే జరిగే ఆచారాన్ని సూచిస్తుంది; సాధారణమైన ‘కొట్టేవాడు’ కంటే ‘గుచ్చేవాడు’ సందర్భానికి సరిపోతుంది.
- source_word: בַכִּיּוֹר
  choice: గంగాళంలోనైనా
  rationale: כִּיּוֹר ఒక పెద్ద గిన్నె లేదా గంగాళాన్ని సూచిస్తుంది. బలి మాంసం ఉడికించే సందర్భంలో ‘గంగాళం’ సహజమైన ఆధునిక తెలుగు పదం.
- source_word: בַדּוּד
  choice: కుండలోనైనా
  rationale: דּוּד ఉడికించడానికి ఉపయోగించే కుండ లేదా పెద్ద పాత్రను సూచిస్తుంది.
- source_word: בַקַּלַּחַת
  choice: బానలోనైనా
  rationale: קַלַּחַת ఒక విధమైన వంటపాత్ర. ఇతర పాత్రలతో భేదాన్ని నిలుపుతూ ‘బాన’ సహజంగా ఉంటుంది; ఖచ్చితమైన ఆకారం తెలియదు.
- source_word: בַפָּרוּר
  choice: వంటపాత్రలోనైనా
  rationale: פָּרוּר మరో రకమైన వంటపాత్రను సూచిస్తుంది, కాని దాని ఖచ్చిత రూపం అనిశ్చితం. అందువల్ల అతిగా నిర్దిష్టం చేయకుండా కార్యాన్ని తెలిపే పదం వాడబడింది.
- source_word: כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג
  choice: ఆ కొంకికి తగిలి పైకి వచ్చినదంతా
  rationale: పాత్రలోని మాంసంలో పనిముట్టుకు చిక్కి పైకి వచ్చినదంతా అనే హీబ్రూ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמַּזְלֵג
  choice: మూడుమొనల కొంకి
  rationale: מַזְלֵג ఇక్కడ బలి మాంసాన్ని తీయడానికి ఉపయోగించిన పనిముట్టు; ముందరి వచనం దానికి మూడు మొనలు ఉన్నాయని చెబుతుంది. సాధారణ ‘ముళ్ల చెంచా’ కంటే ‘మూడుమొనల కొంకి’ కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  choice: యాజకుడు దానితో తీసుకునేవాడు
  rationale: בּוֹ పనిముట్టును సాధనంగా సూచిస్తుంది. హీబ్రూలో లేని ‘తనకొరకు’ అనే భావాన్ని చేర్చకుండా సాధనార్థాన్ని నిలుపుతుంది.
- source_word: כָּכָה יַעֲשׂוּ
  choice: వారు ఇలాగే చేసేవారు
  rationale: హీబ్రూ బహువచన క్రియను, అలాగే పదేపదే జరిగే ఆచారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְכָל יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה
  choice: షిలోహుకు అక్కడికి వచ్చిన ఇశ్రాయేలీయులందరికీ
  rationale: ‘ఇశ్రాయేలు అంతటికీ’ అనే సమూహార్థాన్ని ఆధునిక తెలుగులో వ్యక్తుల సమూహంగా స్పష్టంగా తెలుపుతుంది; שָׁם ‘అక్కడికి’ అనే సూచనను కూడా నిలుపుతుంది.
theological_decisions:
- issue: ప్రధాన చర్యలో ఏకవచనం, సారాంశంలో బహువచనం
  choice: ‘యాజకుడు ... తీసుకునేవాడు’ అని ఏకవచనాన్ని, ‘వారు ... చేసేవారు’ అని బహువచనాన్ని నిలుపడం
  alternative: రెండింటినీ ‘యాజకుడు చేసేవాడు’ అని ఏకవచనంగా సమన్వయపరచడం
  rationale: మూల హీబ్రూ ఉద్దేశపూర్వకంగా ఏకవచనం నుండి బహువచనానికి మారుతుంది. ఈ మార్పు యాజకుని చర్యను చెప్పి, తరువాత విస్తృతమైన ఆచారాన్ని సంగ్రహిస్తుంది; దానిని సవరించి ఒకే సంఖ్యగా మార్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలి. పునరావృత చర్యను ‘-ేవాడు/చేసేవారు’ రూపాలతో తెలిపింది. పాత్రల పేర్ల అనిశ్చితిని ప్రధాన పాఠంలో సహజమైన భిన్న పదాలతో, పాదసూచికలో స్పష్టీకరణతో నిలిపింది.
