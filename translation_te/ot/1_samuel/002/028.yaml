  to: ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి అతణ్ణి నాకు యాజకుడిగా ఉండటానికి, నా బలిపీఠంపైకి ఎక్కడానికి, ధూపం అర్పించడానికి, నా సన్నిధిలో ఏఫోదు ధరించడానికి నేను ఎన్నుకోలేదా? ఇశ్రాయేలీయుల అగ్ని అర్పణలన్నిటిని నీ పితృకుటుంబానికి ఇచ్చాను.[a]
  rationale: The revision removes the unsupported addition “share,” retains the source’s broad sacrificial expression, and adjusts the altar phrase to reflect the Hebrew preposition. The ephod is rendered as worn, a natural and contextually appropriate Telugu expression for the priestly function, without requiring a doctrinal inference.
