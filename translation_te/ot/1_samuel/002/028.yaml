reference: 1 Samuel 2:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בָחֹ֣ר אֹ֠ת/וֹ מִ/כָּל שִׁבְטֵ֨י יִשְׂרָאֵ֥ל לִ/י֙ לְ/כֹהֵ֔ן לַ/עֲל֣וֹת עַֽל מִזְבְּחִ֗/י לְ/הַקְטִ֥יר קְטֹ֛רֶת לָ/שֵׂ֥את אֵפ֖וֹד לְ/פָנָ֑/י וָֽ/אֶתְּנָ/ה֙ לְ/בֵ֣ית אָבִ֔י/ךָ אֶת כָּל אִשֵּׁ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
translation:
  language: te
  text: ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి అతణ్ణి నాకు యాజకుడిగా ఉండటానికి, నా బలిపీఠంపైకి ఎక్కడానికి, ధూపం అర్పించడానికి, నా సన్నిధిలో ఏఫోదు ధరించడానికి నేను ఎన్నుకోలేదా? ఇశ్రాయేలీయుల అగ్ని అర్పణలన్నిటిని నీ పితృకుటుంబానికి ఇచ్చాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఇశ్రాయేలు కుమారుల అగ్ని ద్వారా అర్పించబడే అర్పణలన్నిటిని.”
    reason: అִשֵּׁי అనే హీబ్రూ పదం అగ్నితో అర్పించే బలులను విస్తృతంగా సూచిస్తుంది; ఇది కేవలం దహనబలులను మాత్రమే సూచించదు.
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ
  choice: అతణ్ణి ... నేను ఎన్నుకోలేదా?
  rationale: సందర్భంలోని గద్దింపు ధోరణిలో ఈ రూపం గతంలో దేవుడు చేసిన ఎంపికను గుర్తుచేసే అలంకార ప్రశ్నగా సహజంగా వ్యక్తమవుతుంది.
- source_word: מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి
  rationale: అన్ని గోత్రాల మధ్యనుండి చేసిన ఎంపిక అనే విభాజక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לִי לְכֹהֵן
  choice: నాకు యాజకుడిగా ఉండటానికి
  rationale: దేవునితో సంబంధాన్ని, యాజక పదవిని, ప్రయోజన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַעֲלוֹת עַל מִזְבְּחִי
  choice: నా బలిపీఠం దగ్గరికి ఎక్కడానికి
  rationale: עלה అనే ‘ఎక్కు’ భావాన్ని కాపాడుతూ, దానిని ‘బలి అర్పించడానికి’ అని అతిగా వ్యాఖ్యానించదు.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: ధూపం వేయడానికి
  rationale: ధూపాన్ని పొగగా పైకి లేపే ఆచారాన్ని ఆధునిక తెలుగు ఆరాధనా వాడుకలో సహజంగా తెలియజేస్తుంది.
- source_word: לָשֵׂאת אֵפוֹד לְפָנַי
  choice: నా సన్నిధిలో ఏఫోదు ధరించడానికి
  rationale: యాజక సందర్భంలో נשא వస్త్రాన్ని మోయడం/ధరించడం అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘ధరించడం’ సహజంగా, స్పష్టంగా ఉంటుంది. ప్రత్యేక యాజక వస్త్రపేరును లిప్యంతరీకరించింది.
- source_word: לְבֵית אָבִיךָ
  choice: నీ పితరుల కుటుంబానికి
  rationale: ఏలీకి చెందిన పూర్వీకుల యాజక వంశాన్ని సూచిస్తుంది; ‘తండ్రి ఇంటికి’ అనే అపార్థాన్ని నివారిస్తూ కుటుంబ-వంశ భావాన్ని తెలియజేస్తుంది.
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు అగ్నితో అర్పించే అర్పణలన్నిటిలోని వాటాను
  rationale: אִשֵּׁי అనే పదంలోని అగ్ని-అర్పణ భావాన్ని నిలుపుతుంది. ‘వాటాను’ అనేది యాజక కుటుంబానికి అర్పణలు మొత్తం కాక, వాటిలో నియమిత భాగాలు ఇవ్వబడిన సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; దీనికి పాదటిప్పణిలో మరింత అక్షరార్థ రూపం ఇవ్వబడింది.
theological_decisions:
- issue: אִשֵּׁי అనే బలి సంబంధిత పదం
  choice: అగ్నితో అర్పించే అర్పణలన్నిటిలోని వాటాను
  alternative: ఇశ్రాయేలీయుల అగ్ని అర్పణలన్నిటిని
  rationale: ఈ పదాన్ని కేవలం ‘దహనబలులు’గా పరిమితం చేయకుండా వివిధ అగ్ని అర్పణలను సూచించే విస్తృత భావంలో అనువదించింది. యాజకులకు దక్కే భాగాల సందర్భాన్ని ప్రధాన పాఠంలో స్పష్టం చేసి, రూపపరంగా దగ్గరైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- issue: בְּנֵי יִשְׂרָאֵל అనే జాతీయ సమూహపదం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ స్థిర హీబ్రూ జాతీయ నామాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఇశ్రాయేలీయులు’ అని అందించింది; ఇది కేవలం పురుష సంతానానికే పరిమితం చేయకుండా మొత్తం ఒడంబడిక సమాజాన్ని సూచిస్తుంది.
- issue: ఏఫోదును ‘మోయడం’ లేదా ‘ధరించడం’
  choice: ఏఫోదు ధరించడానికి
  alternative: ఏఫోదు మోయడానికి
  rationale: נשא యొక్క మూల భావం ‘మోయు’ అయినప్పటికీ, యాజక వస్త్రానికి సంబంధించిన ఈ సందర్భంలో ‘ధరించు’ అనేది ఉద్దేశించిన కార్యాన్ని సహజంగా తెలియజేస్తుంది; సాధ్యమైన మూలార్థాన్ని నిశ్శబ్దంగా తొలగించకుండా నిర్ణయ పట్టికలో నమోదు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘యాజకుడు,’ ‘బలిపీఠం,’ ‘ధూపం,’ ‘ఏఫోదు’ వంటి స్థిర బైబిలు పదాలను నిలిపి, హీబ్రూ అలంకార ప్రశ్నను సహజ తెలుగు క్రమంలో అందించింది.
