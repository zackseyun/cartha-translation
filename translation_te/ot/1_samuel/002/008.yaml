base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
translation:
  language: te
  text: 'ఆయన బీదవాణ్ణి దుమ్ములోనుండి లేపుతాడు;

    అవసరంలో ఉన్నవాణ్ణి చెత్తకుప్పలోనుండి పైకెత్తుతాడు.

    వారిని ఉన్నతులతో కూర్చోబెట్టి,

    గౌరవాసనాన్ని వారికి వారసత్వంగా ఇస్తాడు.[a]

    ఎందుకంటే భూమి స్తంభాలు[b] యెహోవావే;

    వాటి మీద ఆయన లోకాన్ని నిలిపాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గౌరవ సింహాసనాన్ని వారికి వారసత్వంగా ఇస్తాడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘భూమి పునాదులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים מֵעָפָר דָּל
  choice: బీదవాణ్ణి దుమ్ములోనుండి లేపుతాడు
  rationale: హిఫీల్ రూపంలోని מֵקִים అణగారిన వ్యక్తిని పైకి లేపడాన్ని సూచిస్తుంది. దుమ్ము అనే స్పష్టమైన కవితాత్మక చిత్రాన్ని అలాగే ఉంచుతూ, דָּל ను సామాజికంగా బలహీనుడైన బీదవాడిగా సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: מֵאַשְׁפֹּת יָרִים אֶבְיוֹן
  choice: అవసరంలో ఉన్నవాణ్ణి చెత్తకుప్పలోనుండి పైకెత్తుతాడు
  rationale: אַשְׁפֹּת వ్యర్థాలు పోసే కుప్పను సూచిస్తుంది; ‘చెత్తకుప్ప’ ఆధునిక పాఠకునికి స్పష్టంగా ఉంటుంది. אֶבְיוֹן లోని లేమి భావాన్ని ‘అవసరంలో ఉన్నవాడు’ తెలియజేస్తుంది; יָרִים కు ‘పైకెత్తుతాడు’ మొదటి పాదంతో కవితాత్మక సమాంతరాన్ని నిలుపుతుంది.
- source_word: לְהוֹשִׁיב עִם נְדִיבִים
  choice: వారిని ఉన్నతులతో కూర్చోబెట్టి
  rationale: נְדִיבִים ఇక్కడ ఉన్నత సామాజిక స్థానం కలవారిని సూచిస్తుంది. ‘ఉన్నతులు’ అనేది రాజకుమారులనే పరిమిత అర్థం విధించకుండా సామాజిక ఉన్నతిని తెలియజేస్తుంది.
- source_word: וְכִסֵּא כָבוֹד יַנְחִלֵם
  choice: గౌరవాసనాన్ని వారికి స్వాస్థ్యంగా ఇస్తాడు
  rationale: כִּסֵּא కు ఆసనం లేదా సింహాసనం అనే రెండు భావాలు సాధ్యమైనందున ప్రధాన పాఠ్యంలో విస్తృతమైన ‘గౌరవాసనం’ ఎంచుకోబడింది. נחל హిఫీల్ రూపంలోని వారసత్వంగా పొందే భావాన్ని ‘స్వాస్థ్యంగా ఇస్తాడు’ నిలుపుతుంది.
- source_word: מְצֻקֵי אֶרֶץ
  choice: భూమి స్తంభాలు
  rationale: భూమిని మోసే ఆధారాలనే ప్రాచీన కవితాత్మక చిత్రాన్ని ‘స్తంభాలు’ ప్రత్యక్షంగా నిలుపుతుంది; ‘పునాదులు’ అనే సాధ్యమైన భావం పాదసూచికలో ఇవ్వబడింది.
- source_word: לַיהוָה
  choice: యెహోవావే
  rationale: మూలంలోని దైవనామం יהוה ను సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘యెహోవా’గా వ్యక్తం చేసింది; ‘-వే’ అవి ఆయనకే చెందినవని హెబ్రీ వాక్యంలోని ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: תֵּבֵל
  choice: లోకం
  rationale: תֵּבֵל క్రమబద్ధమైన నివాసలోకాన్ని సూచిస్తుంది; ‘లోకం’ సంక్షిప్తమైన, సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: מְצֻקֵי אֶרֶץ లోని విశ్వనిర్మాణ చిత్రం
  choice: ‘భూమి స్తంభాలు’ అనే కవితాత్మక చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలపడం
  alternative: ‘భూమి పునాదులు’
  rationale: ఈ పద్యం యెహోవా సార్వభౌమాధికారాన్ని ప్రాచీన కవితాత్మక ప్రపంచచిత్రం ద్వారా ప్రకటిస్తుంది. దానిని నైరూప్య వాక్యంగా మార్చకుండా మూలంలోని రూపకాన్ని నిలపడం పారదర్శకంగా ఉంటుంది.
- issue: כִסֵּא כָבוֹד సూచించే స్థానం
  choice: ‘గౌరవాసనం’
  alternative: ‘గౌరవ సింహాసనం’
  rationale: כִּסֵּא ఆసనం లేదా సింహాసనం కావచ్చు. ఇక్కడ బీదలు, అవసరంలో ఉన్నవారు ఉన్నత స్థితికి తీసుకురాబడుతున్నారు; కాబట్టి రాజాధికారాన్ని తప్పనిసరిగా విధించని ‘గౌరవాసనం’ ప్రధాన పాఠ్యానికి తగినది, మరింత రాజసంబంధమైన ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- issue: ఏకవచన బీద/అవసరస్థుడు నుండి బహువచన ప్రత్యయానికి మార్పు
  choice: మొదటి రెండు పాదాల్లో ప్రతినిధి ఏకవచనం, తరువాత ‘వారిని/వారికి’ అనే బహువచనం
  alternative: పద్యమంతా బహువచనంగా సమతలీకరించడం
  rationale: హెబ్రీలో דָּל, אֶבְיוֹן ఏకవచన రూపాల్లో ఉన్నా יַנְחִלֵם లో బహువచన ప్రత్యయం ఉంది. ఈ వ్యాకరణ మార్పును నిశ్శబ్దంగా తొలగించకుండా తెలుగులోనూ కనిపించేలా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ కీర్తనా-కవిత్వానికి తగిన గంభీరతను నిలుపుకుంది. సమాంతర పాద నిర్మాణం, దుమ్ము–చెత్తకుప్ప–ఉన్నతాసనం అనే స్థితిమార్పు చిత్రాలు, అలాగే భూమి స్తంభాల రూపకం సంరక్షించబడ్డాయి.
