  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א שְׁמוּאֵל֙ אֶל יְהוָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה קֹלֹ֥ת וּ/מָטָ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּירָ֨א כָל הָ/עָ֥ם מְאֹ֛ד אֶת יְהוָ֖ה וְ/אֶת שְׁמוּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
translation:
  language: te
  text: అప్పుడు సమూయేలు యాహ్వేకు మొరపెట్టాడు. ఆ రోజున యాహ్వే ఉరుములను[a], వర్షాన్ని పంపించాడు. ప్రజలందరూ యాహ్వేకు, సమూయేలుకు ఎంతో భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘స్వరాలు’ లేదా ‘శబ్దాలు’; ఈ తుఫాను సందర్భంలో ఉరుములను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל־יְהוָה
  choice: యెహోవాకు మొరపెట్టాడు
  rationale: קרא אל־יהוה అనేది ప్రార్థనలో యెహోవాను పిలవడం లేదా ఆయనకు మొరపెట్టడం అనే భావాన్ని ఇస్తుంది. సందర్భంలోని అత్యవసర విజ్ఞాపనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: וַיִּתֵּן
  choice: పంపించాడు
  rationale: అక్షరార్థంగా ‘ఇచ్చాడు’; అయితే ఉరుములు, వర్షం కలిగేలా దేవుడు చేశాడనే హీబ్రూ ప్రయోగాన్ని తెలుగులో ‘పంపించాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: קֹלוֹת
  choice: ఉరుములను
  rationale: మూలపదానికి ‘స్వరాలు/శబ్దాలు’ అనే విస్తృత అర్థం ఉన్నా, వర్షంతో కూడిన తుఫాను సందర్భంలో అది ఉరుములను సూచిస్తుంది. ఈ మూలరూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: וּמָטָר
  choice: వర్షాన్ని
  rationale: מָטָר కు నేరమైన, సహజమైన తెలుగు సమానార్థకం; మూలంలో లేని తీవ్రతను చేర్చదు.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: హీబ్రూ కాలనిర్దేశాన్ని సహజమైన తెలుగు పదక్రమంలో స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּירָא ... מְאֹד
  choice: ఎంతో భయపడ్డారు
  rationale: ירא లోని భయం/భక్తిపూర్వక భయ భావాన్ని మృదువుచేయకుండా, מְאֹד యొక్క తీవ్రతను ‘ఎంతో’ ద్వారా అందిస్తుంది.
- source_word: כָל־הָעָם
  choice: ప్రజలందరూ
  rationale: సమూహమంతటినీ సూచించే హీబ్రూ భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֶת־יְהוָה וְאֶת־שְׁמוּאֵל
  choice: యెహోవాకు, సమూయేలుకు
  rationale: ఒకే భయక్రియకు యెహోవా, సమూయేలు ఇద్దరూ కర్మలుగా ఉన్న హీబ్రూ నిర్మాణాన్ని నిలుపుతుంది; వారి స్థానం లేదా భయ స్వభావం ఒకటేనని అదనంగా నిర్ణయించదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: యెహోవాకు, సమూయేలుకు ప్రజలు భయపడడం
  choice: ఇద్దరికీ ‘భయపడ్డారు’ అనే ఒకే క్రియను వర్తింపజేయడం
  alternative: యెహోవాకు భయపడి, సమూయేలును గౌరవించారు
  rationale: హీబ్రూ పాఠం ఒకే ירא క్రియను ఇద్దరికీ వర్తింపజేస్తుంది. దేవునిపట్ల భయం, ప్రవక్తపట్ల గౌరవం అని విడదీసి చెప్పడం సందర్భానుకూల వివరణ కావచ్చుగాని, మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరిస్తుంది; అందువల్ల దానిని ప్రధాన పాఠంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. ‘మొరపెట్టాడు’ ప్రార్థనా సందర్భాన్ని సహజంగా తెలియజేస్తుంది; ‘ఎంతో భయపడ్డారు’ మూలంలోని తీవ్రతను నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత పదం వెంట ఉంచబడింది.
