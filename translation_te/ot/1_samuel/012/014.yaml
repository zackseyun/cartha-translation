  text: אִם תִּֽירְא֣וּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֤ם אֹת/וֹ֙ וּ/שְׁמַעְתֶּ֣ם בְּ/קֹל֔/וֹ וְ/לֹ֥א תַמְר֖וּ אֶת פִּ֣י יְהוָ֑ה וִ/הְיִתֶ֣ם גַּם אַתֶּ֗ם וְ/גַם הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר מָלַ֣ךְ עֲלֵי/כֶ֔ם אַחַ֖ר יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
translation:
  language: te
  text: మీరు యెహోవాకు భయపడి, ఆయనను సేవించి, ఆయన స్వరాన్ని ఆలకించి[a], యెహోవా ఆజ్ఞకు తిరుగుబాటు చేయకుండా ఉంటే, మీరూ మీపై రాజుగా పరిపాలిస్తున్న రాజూ మీ దేవుడైన యెహోవాను అనుసరిస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆయన స్వరాన్ని ఆలకించి” అంటే ఆయన మాట విని దానికి విధేయులవడం అనే భావం కూడా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “మీరూ మీపై రాజుగా పరిపాలించిన రాజూ మీ దేవుడైన యెహోవా తరువాత ఉంటారు.” దీని భావం ప్రజలూ రాజూ యెహోవాను అనుసరిస్తూ ఆయనకు విధేయులుగా ఉండడమని గ్రహించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: ఉంటే
  rationale: షరతును సూచించే אִם భావాన్ని తెలుగులో సహజమైన షరతు నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: תִּירְאוּ אֶת־יְהוָה
  choice: యెహోవాకు భయపడి
  rationale: దేవునిపట్ల భయభక్తులతో కూడిన గౌరవాన్ని సూచించే ירא యొక్క బలాన్ని నిలుపుతుంది; కేవలం ‘గౌరవించి’ అని మృదువుగా చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో అందిస్తుంది.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: ఆయనను సేవించి
  rationale: עבד లోని ఆరాధనతో కూడిన సేవ భావాన్ని విస్తృతంగా, మూలానికి సమీపంగా ఉంచుతుంది.
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  choice: ఆయన స్వరాన్ని ఆలకించి
  rationale: మూలంలోని ‘స్వరాన్ని వినడం’ అనే రూపకాన్ని నిలుపుతూ, శ్రద్ధగా విని విధేయత చూపే భావాన్ని ‘ఆలకించి’ తెలియజేస్తుంది.
- source_word: וְלֹא תַמְרוּ אֶת־פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞకు తిరుగుబాటు చేయకుండా
  rationale: ‘యెహోవా నోరు’ అనే హీబ్రూ ప్రయోగాన్ని సందర్భానుసారంగా ‘ఆజ్ఞ’గా అందించి, מרה లోని సాధారణ అవిధేయతకన్నా బలమైన తిరుగుబాటు భావాన్ని కాపాడుతుంది.
- source_word: גַּם אַתֶּם וְגַם הַמֶּלֶךְ
  choice: మీరూ ... రాజూ
  rationale: గַּם ... וְגַם అనే జత నిర్మాణంలోని ‘ఇద్దరూ’ అనే సమాంతర బలాన్ని సహజమైన తెలుగు రూపంలో చూపుతుంది.
- source_word: אֲשֶׁר מָלַךְ עֲלֵיכֶם
  choice: మీపై రాజుగా పరిపాలిస్తున్న
  rationale: పదరూపం సంపూర్ణ క్రియ అయినప్పటికీ, సందర్భంలో ప్రస్తుతం పదవిలో ఉన్న రాజును సూచిస్తుంది; తెలుగు వర్తమాన కొనసాగింపు దాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וִהְיִתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యెహోవాను అనుసరిస్తారు
  rationale: అక్షరార్థంగా క్లిష్టమైన ‘మీరు ... యెహోవా తరువాత ఉంటారు’ అనే వాక్యాన్ని, אַחַר సూచించే విధేయ అనుబంధం/వెంబడింపు భావంతో సహజంగా అందిస్తుంది; మూలంలోని అసాధారణ నిర్మాణాన్ని పాదటీపులో తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి పదబంధమైన אַחַר יְהוָה אֱלֹהֵיכֶם యొక్క భావం
  choice: ‘మీ దేవుడైన యెహోవాను అనుసరిస్తారు’ అనే సానుకూల విధేయత భావం
  alternative: ‘మీరూ రాజూ మీ దేవుడైన యెహోవా తరువాత ఉంటారు’ అనే అక్షరార్థ, కానీ తెలుగులో అస్పష్టమైన నిర్మాణం; లేదా ‘మీరు యెహోవాకు విధేయులుగా కొనసాగుతారు’ అనే వివరణాత్మక రూపం
  rationale: వ్యక్తిని అనుసరించే సందర్భంలో אַחַר విధేయతతో వెంబడించడాన్ని సూచించగలదు. అయితే MT వాక్యనిర్మాణం అసాధారణంగా ఉన్నందున దాని అక్షరరూపం మరియు అంతర్లీన అస్పష్టతను పాదటీపులో సంరక్షించాం.
- issue: ‘ఆయన స్వరాన్ని ఆలకించడం’లోని విధేయత భావం
  choice: మూల రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి, విధేయత నిగూఢార్థాన్ని పాదటీపులో తెలపడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘ఆయన మాటకు విధేయులై’ అని అనువదించడం
  rationale: שׁמע בקול తరచుగా విధేయతతో వినడాన్ని సూచించినప్పటికీ, ‘స్వరం’ అనే మూల చిత్రాన్ని తొలగించకుండా భావవ్యాప్తిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘భయపడి,’ ‘సేవించి,’ ‘తిరుగుబాటు’ వంటి ఒడంబడిక సందర్భపు బలమైన పదాలను నిలిపి, క్లిష్టమైన అంతిమ హీబ్రూ నిర్మాణాన్ని ప్రధాన పాఠ్యంలో సహజంగా చేసి పాదటీపులో దాని అక్షరరూపాన్ని భద్రపరిచాం.
