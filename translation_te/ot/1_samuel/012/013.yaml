base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
translation:
  language: te
  text: ఇప్పుడు ఇదిగో, మీరు ఎంచుకున్న, మీరు కోరిన రాజు; ఇదిగో, యాహ్వే మీపై ఒక రాజును ఉంచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
