revisions:
- from: ఇప్పుడు, ఇదిగో మీరు ఎంచుకున్న, మీరు అడిగిన రాజు! ఇదిగో, యాహ్వే మీపై ఒక రాజును ఉంచాడు.[a]
  to: ఇప్పుడు ఇదిగో, మీరు ఎంచుకున్న, మీరు కోరిన రాజు; ఇదిగో, యాహ్వే మీపై ఒక రాజును ఉంచాడు.[a]
  rationale: Replaced the potentially misleading “మీరు అడిగిన” with “మీరు కోరిన” to express requesting a king, and replaced the exclamation mark with a semicolon to retain the source’s continuous proclamation. No theological or interpretive expansion has been introduced.
  reviewer_model: gpt-5.6-terra
