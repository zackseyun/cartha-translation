  to: ఇప్పుడైతే, నిలిచి, యాహ్వే[a] మీ కళ్ల ఎదుట చేస్తున్న ఈ గొప్ప సంగతిని చూడండి.
  rationale: The revision removes the unsupported causal nuance, preserves the summons to stand attentively and observe, uses a broad equivalent for ‘this great thing,’ and aligns the rendering of the divine name with the POB audit trail. The footnote remains correctly anchored to the divine name and avoids identifying a later vocalized form as the Hebrew consonantal text.
