id: 1SA.12.16
reference: 1 Samuel 12:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּם עַתָּה֙ הִתְיַצְּב֣וּ וּ/רְא֔וּ אֶת הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה אֲשֶׁ֣ר יְהוָ֔ה עֹשֶׂ֖ה לְ/עֵינֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/016.yaml
  text: Now then[a], stand still and see this great thing that Yahweh is doing before your eyes.
translation:
  language: te
  text: ఇప్పుడైతే, నిలిచి, యాహ్వే[a] మీ కళ్ల ఎదుట చేస్తున్న ఈ గొప్ప సంగతిని చూడండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామం యాహ్వేకు సంబంధించిన హీబ్రూ రూపాన్ని మరియు సంప్రదాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ఈ పదబంధం తదుపరి గంభీరమైన పిలుపును పరిచయం చేసే సంభాషణా సంధిగా పనిచేస్తుంది; సందర్భంలో ‘కాబట్టి ఇప్పుడు’ సహజంగా ఆ మార్పును తెలియజేస్తుంది.
- source_word: הִתְיַצְּבוּ
  choice: నిలబడి
  rationale: హిత్పయేల్ ఆజ్ఞారూపం ప్రజలు తమ స్థానంలో నిలిచి శ్రద్ధగా గమనించాలని పిలుస్తుంది; తెలుగులో ‘నిలబడి’ సహజంగా ఉంది.
- source_word: וּרְאוּ
  choice: చూడండి
  rationale: జరగబోయే సూచక కార్యాన్ని ప్రత్యక్షంగా గమనించమనే ఆజ్ఞను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: ఈ గొప్ప కార్యాన్ని
  rationale: דבר అనే పదానికి ‘విషయం/సంగతి/కార్యం’ అనే విస్తృత అర్థాలు ఉన్నాయి. ఇక్కడ దేవుడు చేయబోయే అసాధారణ క్రియను సూచిస్తున్నందున ‘కార్యం’ సందర్భానుకూలం, అయితే దానిని మరీ నిర్దిష్టంగా ‘అద్భుతం’ అని చేయదు.
- source_word: אֲשֶׁר יְהוָה עֹשֶׂה
  choice: యెహోవా చేస్తున్న
  rationale: עֹשֶׂה వర్తమాన కృదంతం; కార్యాన్ని వక్త దృష్టిలో ప్రారంభమవుతున్నదిగా లేదా సన్నిహితంగా జరుగుతున్నదిగా సజీవంగా చూపుతుంది. అందువల్ల వర్తమాన కొనసాగింపు భావాన్ని ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: לְעֵינֵיכֶם
  choice: మీ కళ్ల ఎదుట
  rationale: ప్రజలు స్వయంగా, బహిరంగంగా చూడబోయే కార్యమనే హీబ్రూ దృశ్యాత్మక నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. బిరుదైన ‘ప్రభువు’తో దానిని మార్చకుండా పేరు రూపాన్ని నిలిపాం; తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరణను ప్రధాన పాఠంలో వాడి, ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో ఇచ్చాం.
- issue: עֹשֶׂה యొక్క కాలభావం
  choice: చేస్తున్న
  alternative: చేయబోతున్నాడు / చేస్తాడు
  rationale: హీబ్రూ కృదంతం జరుగుతున్న లేదా అతి సమీపంలో ఉన్న కార్యాన్ని సజీవంగా చూపగలదు. సందర్భం భవిష్యత్ సూచనకు వీలు ఇచ్చినా, రూపంలోని వర్తమాన దృక్కోణాన్ని ప్రధాన పాఠంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఈ గొప్ప కార్యం’ మూలంలోని דבר యొక్క సందర్భార్థాన్ని తెలియజేస్తూ, దానిని ‘అద్భుతం’ లేదా ‘సూచకక్రియ’గా మరీ నిర్దిష్టం చేయకుండా ఉంచుతుంది.
