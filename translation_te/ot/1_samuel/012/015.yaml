id: 1SA.12.15
reference: 1 Samuel 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם לֹ֤א תִשְׁמְעוּ֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/מְרִיתֶ֖ם אֶת פִּ֣י יְהוָ֑ה וְ/הָיְתָ֧ה יַד יְהוָ֛ה בָּ/כֶ֖ם וּ/בַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
translation:
  language: te
  text: అయితే మీరు యెహోవా స్వరాన్ని వినకపోతే, యెహోవా ఆజ్ఞను ధిక్కరిస్తే, యెహోవా హస్తం మీకూ మీ పితరులకూ[a] విరోధంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పాఠం: “మీ పితరులు.” కొన్ని ప్రాచీన అనువాదాలు, అనేకమంది వ్యాఖ్యాతలు “మీ రాజు” అని చదువుతారు; ప్రజలకూ వారి రాజుకూ సమూయేలు చేసిన హెచ్చరిక అనే తక్షణ సందర్భానికి అది సరిపోతుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: మునుపటి వచనంలోని షరతుకు విరుద్ధమైన షరతును పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  choice: మీరు యెహోవా స్వరాన్ని వినకుండా
  rationale: שׁמע בְּקוֹל అనే ‘స్వరాన్ని వినడం’ నుడికారంలో విధేయత భావం ఉంది. ‘వినకుండా’ మూలరూపకాన్ని నిలుపుతూ ఆ సందర్భార్థాన్ని కూడా సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించి, సాధారణ బిరుదుతో భర్తీ చేయలేదు.
- source_word: וּמְרִיתֶם
  choice: ఎదురుతిరిగితే
  rationale: מרה సాధారణ అవిధేయతకన్నా ధిక్కారంతో తిరుగుబాటు చేయడాన్ని సూచిస్తుంది; ‘ఎదురుతిరగడం’ ఆధునిక తెలుగులో ఆ తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞకు
  rationale: అక్షరార్థంగా ‘యెహోవా నోరు’ అయినా, ఇక్కడ ఆయన పలికిన ఆజ్ఞను సూచించే నుడికారం. ‘ఆజ్ఞ’ తెలుగులో స్పష్టంగా, సందర్భోచితంగా ఉంది.
- source_word: וְהָיְתָה יַד יְהוָה
  choice: యెహోవా హస్తం ... ఉంటుంది
  rationale: దేవుని క్రియాశీల శక్తి లేదా తీర్పును సూచించే ‘హస్తం’ అనే బైబిలు రూపకాన్ని నిలిపింది.
- source_word: בָּכֶם
  choice: మీకు ... విరోధంగా
  rationale: తీర్పు సందర్భంలో בְּ ప్రతికూల దిశను సూచిస్తుంది; ‘విరోధంగా’ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּבַאֲבֹתֵיכֶם
  choice: మీ పితరులకూ
  rationale: WLC/మసోరా పాఠంలోని ‘మీ పితరులు’ అనే అర్థాన్ని ప్రధాన పాఠంలో నిలిపింది; పాఠాంతరాన్ని పాదసూచికలో ఇచ్చింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తినామంగానే ఉంచి, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: చివరి పదబంధం וּבַאֲבֹתֵיכֶם
  choice: మీ పితరులకూ
  alternative: మీ రాజుకూ
  rationale: అందించిన WLC/మసోరా పాఠం ‘మీ పితరులు’ అని చదువుతుంది. తక్షణ సందర్భానికి సరిపడే ‘మీ రాజు’ అనే ప్రాచీన పాఠాంతరాన్ని ప్రధాన పాఠంలో కలపకుండా పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగిస్తూ, ‘స్వరం,’ ‘హస్తం’ వంటి మూలభాషా బైబిలు రూపకాలను నిలిపింది. ‘పితరులు’ గౌరవప్రదమైన ధార్మిక-చారిత్రక సందర్భానికి సరిపడే పదం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
