id: 1SA.12.19
reference: 1 Samuel 12:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ כָל הָ/עָ֜ם אֶל שְׁמוּאֵ֗ל הִתְפַּלֵּ֧ל בְּעַד עֲבָדֶ֛י/ךָ אֶל יְהוָ֥ה אֱלֹהֶ֖י/ךָ וְ/אַל נָמ֑וּת כִּֽי יָסַ֤פְנוּ עַל כָּל חַטֹּאתֵ֨י/נוּ֙ רָעָ֔ה לִ/שְׁאֹ֥ל לָ֖/נוּ מֶֽלֶךְ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
translation:
  language: te
  text: 'అప్పుడు ప్రజలందరూ సమూయేలుతో ఇలా అన్నారు: “నీ సేవకులమైన మా కొరకు నీ దేవుడైన యెహోవాకు ప్రార్థించు, మేము చనిపోకుండా ఉండేలా. ఎందుకంటే, మాకోసం ఒక రాజును అడగడం అనే ఈ చెడును మా పాపాలన్నిటికీ తోడు చేసుకున్నాం.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְפַּלֵּל
  choice: ప్రార్థించు
  rationale: సమూయేలుకు చెప్పిన ఆజ్ఞ. తరువాతి בְּעַד పదబంధం ప్రార్థనలో మధ్యవర్తిత్వ భావాన్ని స్పష్టం చేస్తుంది; అందువల్ల సహజమైన ‘ప్రార్థించు’ను ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: בְּעַד עֲבָדֶיךָ
  choice: నీ సేవకులమైన మా పక్షంగా
  rationale: בְּעַד యొక్క ‘పక్షంగా/తరఫున’ భావాన్ని, ప్రజలు తమను సమూయేలు సేవకులుగా వినయంగా పేర్కొన్న ధోరణిని రెండింటినీ తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని యథాతథంగా నిలిపి, ప్రజలు సమూయేలును ఆశ్రయిస్తున్న సందర్భంలోని ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది.
- source_word: וְאַל נָמוּת
  choice: మేము చనిపోకుండా ఉండేలా
  rationale: ప్రార్థన కోరడంలోని ఆశించిన ప్రతికూల ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יָסַפְנוּ עַל כָּל חַטֹּאתֵינוּ
  choice: మా పాపాలన్నిటికీ తోడు చేసుకున్నాం
  rationale: ఇప్పటికే ఉన్న పాపాలకు మరొక చెడును జోడించుకున్న సంచిత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: רָעָה
  choice: ఈ చెడు
  rationale: నైతిక తప్పిదపు తీవ్రతను ‘తప్పు’ కంటే బలంగా, అయితే అతివ్యాఖ్యానం లేకుండా వ్యక్తపరుస్తుంది.
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  choice: మాకోసం ఒక రాజును అడగడం
  rationale: చెడుకు వివరణగా ఉన్న క్రియానామ భావాన్ని, לָנוּ లోని ‘మనకొరకు’ భావంతో సహా నిలుపుతుంది.
- source_word: כָל הָעָם
  choice: ప్రజలందరూ
  rationale: సామూహిక పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు ... అన్నారు
  rationale: వావ్-కన్సెక్యూటివ్ తెలిపే కథన క్రమాన్ని తెలుగులో సహజంగా ముందుకు తీసుకెళ్తుంది.
theological_decisions:
- issue: ‘నీ దేవుడు’ అనే సంబంధపదంలోని ఉద్వేగం
  choice: నీ దేవుడైన యెహోవా
  alternative: మన దేవుడైన యెహోవా
  rationale: మూలంలోని రెండవ పురుష రూపాన్ని మార్చకుండా ఉంచడం ద్వారా ప్రజలు సమూయేలును మధ్యవర్తిగా ఆశ్రయిస్తున్న వాక్చాతుర్య మరియు ఆధ్యాత్మిక ఉద్వేగం నిలుస్తుంది; దీనివల్ల యెహోవా ఇశ్రాయేలు దేవుడు కాదని నిర్ధారించడం లేదు.
- issue: రాజును అడగడంపై ప్రజల నైతిక అంగీకారం
  choice: ఈ చెడు
  alternative: ఈ తప్పు
  rationale: రָעָה యొక్క నైతిక గంభీరతను నిలుపుతూ, దాని స్వరూపాన్ని పాఠ్యానికి మించి సిద్ధాంతపరంగా వివరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని అంగీకారం, వినయభావం, ‘నీ దేవుడు’ అనే సంబంధ ఉద్వేగం నిలుపబడ్డాయి.
