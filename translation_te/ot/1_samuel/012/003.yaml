source:
  edition: WLC
  text: הִנְ/נִ֣י עֲנ֣וּ בִ/י֩ נֶ֨גֶד יְהוָ֜ה וְ/נֶ֣גֶד מְשִׁיח֗/וֹ אֶת שׁוֹר֩ מִ֨י לָקַ֜חְתִּי וַ/חֲמ֧וֹר מִ֣י לָקַ֗חְתִּי וְ/אֶת מִ֤י עָשַׁ֨קְתִּי֙ אֶת מִ֣י רַצּ֔וֹתִי וּ/מִ/יַּד מִי֙ לָקַ֣חְתִּי כֹ֔פֶר וְ/אַעְלִ֥ים עֵינַ֖/י בּ֑/וֹ וְ/אָשִׁ֖יב לָ/כֶֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
translation:
  language: te
  text: '“ఇదిగో, నేను ఇక్కడ ఉన్నాను. యాహ్వే ఎదుట, ఆయన అభిషిక్తుని ఎదుట నాపై సాక్ష్యం చెప్పండి: నేను ఎవరి ఎద్దును తీసుకున్నాను? ఎవరి గాడిదను తీసుకున్నాను? ఎవరిని అణచివేశాను? ఎవరిని నలిపివేశాను[a]? ఎవరి చేతిలోనుండి లంచం[b] తీసుకొని, దాని కారణంగా కళ్లు మూసుకున్నానా? నేను మీకు తిరిగి ఇచ్చేస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నలిపివేశాను” అని అనువదించిన హీబ్రూ క్రియ అర్థం నిర్ధారించడం కష్టం. దాన్ని “దుర్వ్యవహారం చేశాను” లేదా “అన్యాయం చేశాను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “లంచం” అని అనువదించిన పదానికి “విమోచన వెల” లేదా “చెల్లింపు” అనే అర్థాలు కూడా ఉండవచ్చు. అయితే దాని కారణంగా “కళ్లు మూసుకోవడం” అనే సందర్భం, న్యాయాన్ని వక్రీకరించే అక్రమ చెల్లింపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: ఇదిగో, నేను ఇక్కడ ఉన్నాను
  rationale: ప్రజల ఎదుట విచారణకు తాను సిద్ధంగా, అందుబాటులో ఉన్నాననే స్వీయప్రకటన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲנוּ בִי
  choice: నాపై సాక్ష్యం చెప్పండి
  rationale: యాహ్వే మరియు ఆయన అభిషిక్తుని సమక్షంలో జరిగే బహిరంగ న్యాయపరమైన సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగా లిప్యంతరీకరిస్తుంది.
- source_word: מְשִׁיחוֹ
  choice: ఆయన అభిషిక్తుడు
  rationale: ఈ చారిత్రక సందర్భంలో అభిషేకించబడిన రాజును సూచిస్తుంది; తరువాతి ప్రత్యేక మెస్సీయ బిరుదును అనవసరంగా ఇక్కడికి దిగుమతి చేయదు.
- source_word: עָשַׁקְתִּי
  choice: అణచివేశాను
  rationale: సామాజికంగా లేదా ఆర్థికంగా పీడించడం, దోచుకోవడం అనే విస్తృత నైతిక-న్యాయ భావాన్ని నిలుపుతుంది.
- source_word: רַצּוֹתִי
  choice: దుర్వ్యవహారం చేశాను
  rationale: అర్థనిర్ణయం కష్టమైన ఈ క్రియను అతిగా నిర్దిష్టం చేయకుండా, కఠినంగా ప్రవర్తించడం లేదా హాని చేయడం అనే విస్తృత భావంతో అందిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: כֹפֶר
  choice: లంచం
  rationale: ఈ పదానికి విమోచన వెల లేదా చెల్లింపు అనే అర్థాలు ఉండగలిగినా, దాని వల్ల కళ్లు మూసుకోవడం అనే న్యాయసంబంధ సందర్భంలో అక్రమ చెల్లింపు భావమే అనుకూలం.
- source_word: וְאַעְלִים עֵינַי בּוֹ
  choice: దాని కారణంగా కళ్లు మూసుకున్నానా
  rationale: చెల్లింపు కారణంగా తప్పును పట్టించుకోకపోవడమనే నుడికారార్థాన్ని, మూలంలోని కళ్ల రూపకాన్ని నిలుపుతూ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְאָשִׁיב לָכֶם
  choice: నేను మీకు తిరిగి ఇచ్చేస్తాను
  rationale: నష్టపరిహారం లేదా తీసుకున్నదాన్ని తిరిగి ఇవ్వడానికి సిద్ధమనే సూటి వాగ్దానాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తున్నందున దాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగా అందించడం సముచితం.
- issue: מְשִׁיחוֹ అనే పదం యొక్క చారిత్రక సూచన
  choice: ఆయన అభిషిక్తుడు
  alternative: ఆయన మెస్సీయ
  rationale: తక్షణ సందర్భంలో ఇది యాహ్వే అభిషేకించిన రాజును సూచిస్తుంది. ‘అభిషిక్తుడు’ మూలపద భావాన్ని నిలుపుతూ, తరువాతి మెస్సీయ సంబంధ ప్రత్యేకతను ఈ వాక్యంలో బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ న్యాయవిచారణకు తగిన గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. వరుస ప్రశ్నల న్యాయపరమైన బలాన్ని, మూలంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలిపాం.
