source:
  edition: WLC
  text: כִּ֠י לֹֽא יִטֹּ֤שׁ יְהוָה֙ אֶת עַמּ֔/וֹ בַּ/עֲב֖וּר שְׁמ֣/וֹ הַ/גָּד֑וֹל כִּ֚י הוֹאִ֣יל יְהוָ֔ה לַ/עֲשׂ֥וֹת אֶתְ/כֶ֛ם ל֖/וֹ לְ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
translation:
  language: te
  text: ఎందుకంటే యాహ్వే తన గొప్ప నామం నిమిత్తం తన ప్రజలను విడిచిపెట్టడు[a]; ఎందుకంటే మిమ్మల్ని తన కొరకు ఒక ప్రజగా చేసుకోవడం యాహ్వేకు ఇష్టమైంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిత్యజించడు’ లేదా ‘వదిలివేయడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మిమ్మల్ని తన కొరకు ఒక ప్రజగా చేసుకోవాలని యాహ్వే సంకల్పించాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטֹּשׁ
  choice: విడిచిపెట్టడు
  rationale: נטש ఇక్కడ ఒక ప్రజను వదిలివేయడం లేదా పరిత్యజించడం అనే భావాన్ని ఇస్తుంది. ‘విడిచిపెట్టడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, నిబంధన సంబంధమైన గంభీరతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందించాం.
- source_word: עַמּוֹ
  choice: తన ప్రజలను
  rationale: עַם ఇక్కడ దేవునితో ప్రత్యేక సంబంధం కలిగిన సమాజాన్ని సూచిస్తుంది; ‘తన ప్రజలు’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּעֲבוּר שְׁמוֹ הַגָּדוֹל
  choice: తన గొప్ప నామం నిమిత్తం
  rationale: בַּעֲבוּר కారణం లేదా నిమిత్తాన్ని సూచిస్తుంది; ‘నామం’ అనే హీబ్రూ భావచిత్రాన్ని అలాగే ఉంచుతూ ‘నిమిత్తం’ ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הוֹאִיל
  choice: ఇష్టపడ్డాడు
  rationale: הוֹאִיל ఇక్కడ స్వచ్ఛందంగా సంకల్పించడం లేదా సంతోషపూర్వకంగా నిర్ణయించడం అనే భావాన్ని కలిగి ఉంది. ‘ఇష్టపడ్డాడు’ ఆ దైవిక సంకల్పాన్ని అతిగా సిద్ధాంతీకరించకుండా తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם
  choice: మిమ్మల్ని తనకు ప్రజగా చేసుకోవడానికి
  rationale: לוֹలోని ‘తన కొరకు/తనకు’ భావాన్ని స్పష్టంగా ఉంచి, ఇశ్రాయేలును తన ప్రజగా ఏర్పరచిన దేవుని చర్యను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: הוֹאִילలోని దైవిక సంకల్ప భావం
  choice: ఇష్టపడ్డాడు
  alternative: ఎంచుకున్నాడు / సంకల్పించాడు
  rationale: ఈ క్రియ దేవుని స్వచ్ఛందమైన అనుకూల సంకల్పాన్ని సూచిస్తుంది. ‘ఇష్టపడ్డాడు’ ఆ భావాన్ని నిలుపుతూ, మూలంలో లేని సాంకేతిక ఎన్నిక సిద్ధాంతాన్ని బలవంతంగా చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్యంలోని నిబంధన సంబంధమైన గంభీరతను నిలుపుతూ అనువదించబడింది. ‘తనకు ప్రజగా’ ద్వారా לוֹ యొక్క భావం స్పష్టంగా నిలుపబడింది.
