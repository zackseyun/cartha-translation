id: 1SA.12.1
reference: 1 Samuel 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל כָּל יִשְׂרָאֵ֔ל הִנֵּה֙ שָׁמַ֣עְתִּי בְ/קֹֽלְ/כֶ֔ם לְ/כֹ֥ל אֲשֶׁר אֲמַרְתֶּ֖ם לִ֑/י וָ/אַמְלִ֥יךְ עֲלֵי/כֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/001.yaml
  text: Then Samuel said to all Israel, “Look, I have listened to your voice in all that you have said to me, and I have made a king reign over you.”
translation:
  language: te
  text: 'అప్పుడు సమూయేలు ఇశ్రాయేలీయులందరితో ఇలా అన్నాడు: “చూడండి, మీరు నాతో చెప్పిన ప్రతిదానిలో నేను మీ మాట విన్నాను; మీ మీద పరిపాలించడానికి ఒక రాజును నియమించాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: చూడండి
  rationale: శ్రోతల దృష్టిని తాను చెప్పబోయే విషయంపై నిలిపే హీబ్రూ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగు సంబోధనతో వ్యక్తం చేస్తుంది.
- source_word: שָׁמַעְתִּי בְקֹלְכֶם
  choice: నేను మీ మాట విన్నాను
  rationale: ‘స్వరాన్ని వినడం’ అనే హీబ్రూ ప్రయోగం ఇక్కడ వారి అభ్యర్థనను ఆలకించి అంగీకరించడాన్ని సూచిస్తుంది; ‘మీ మాట విన్నాను’ తెలుగు భాషలో సహజంగా ఉండి మూల భావాన్ని నిలుపుతుంది.
- source_word: וָאַמְלִיךְ עֲלֵיכֶם מֶלֶךְ
  choice: మీపై ఒక రాజును రాజుగా నియమించాను
  rationale: హిఫిల్ క్రియలోని ‘రాజుగా చేయడం/పాలింపజేయడం’ భావాన్ని, అలాగే מֶלֶךְ అనే నామవాచక పునరుక్తిని సాధ్యమైనంత స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: రాజును ఎవరు నియమించారనే వాక్యంలోని బాధ్యత
  choice: సమూయేలు ప్రథమ పురుషంలో ‘నియమించాను’ అని చెప్పినట్టే అనువదించడం
  alternative: దేవుడు రాజును నియమించాడని వివరణాత్మకంగా మార్చడం
  rationale: ఈ వచనంలో వక్త సమూయేలు తన కార్యాన్ని ప్రథమ పురుషంలో చెబుతున్నాడు. విస్తృత కథనంలో దేవుని పాత్ర ఉన్నప్పటికీ, దానిని ఇక్కడ చొప్పించడం మూల వాక్యంలోని ఉద్రిక్తతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘ఇశ్రాయేలీయులందరితో’ అనేది ‘ఇశ్రాయేలు అంతటితో’ కంటే ప్రజలను ఉద్దేశించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
