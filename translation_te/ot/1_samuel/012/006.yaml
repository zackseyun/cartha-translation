id: 1SA.12.6
reference: 1 Samuel 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל אֶל הָ/עָ֑ם יְהוָ֗ה אֲשֶׁ֤ר עָשָׂה֙ אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֔ן וַ/אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת אֲבֹתֵי/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
translation:
  language: te
  text: అప్పుడు సమూయేలు ప్రజలతో, “మోషేను, అహరోనును నియమించినవాడు[a], మీ పితరులను[b] ఐగుప్తు దేశం నుండి పైకి తీసుకొచ్చినవాడు యాహ్వేయే” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “మోషేను, అహరోనును చేసినవాడు.” ఇక్కడ హీబ్రూ క్రియ వారిని వారి బాధ్యతల్లో నియమించడం లేదా నిలబెట్టడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మీ పితరులు” అనే మాటను విస్తృతార్థంలో “మీ పూర్వీకులు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל הָעָם
  choice: అప్పుడు సమూయేలు ప్రజలతో ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణం కోసం పలికిన మాటల తరువాత ‘అన్నాడు’ ఉంచబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: మోషేను, అహరోనును నియమించినవాడు
  rationale: עָשָׂה యొక్క ప్రాథమిక అర్థం ‘చేశాడు’; అయితే ఇక్కడ మోషే, అహరోనులను వారి నాయకత్వ పాత్రల్లో నిలబెట్టిన కార్యాన్ని సూచించడం వల్ల ‘నియమించినవాడు’ సందర్భానుకూలంగా స్పష్టంగా ఉంది. అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַאֲשֶׁר הֶעֱלָה
  choice: పైకి తీసుకొచ్చినవాడు
  rationale: హిఫిల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే నిర్గమన ప్రయోగాన్ని తెలుగులో సాధ్యమైనంత దగ్గరగా నిలిపాం.
- source_word: אֶת אֲבֹתֵיכֶם
  choice: మీ పితరులను
  rationale: హీబ్రూ పురుషలింగ పదాన్ని నేరుగా ప్రతిబింబిస్తుంది; విస్తృతార్థమైన ‘పూర్వీకులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: ‘ఐగుప్తు దేశం నుండి’ అనే రూపం మూలంలోని אֶרֶץ‌ను, నిర్గమన సూత్రీకరణను రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: మోషే, అహరోనులతో עָשָׂה క్రియ యొక్క భావం
  choice: నియమించినవాడు
  alternative: చేసినవాడు
  rationale: వారిని వ్యక్తులుగా సృష్టించాడనే భావం కాకుండా, ఇశ్రాయేలు నాయకులుగా నిలబెట్టిన దేవుని కార్యమే సందర్భంలో ఉద్దేశించబడినట్లు కనిపిస్తుంది. అయినా మూలంలోని ‘చేశాడు’ అనే నిజమైన పదార్థాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: యాహ్వేనే కర్త అని తెలిపే క్రియలేని హీబ్రూ వాక్యం
  choice: '...వాడు యాహ్వేయే'
  alternative: యాహ్వే ... చేశాడు
  rationale: తెలుగులో ‘యాహ్వేయే’ అనే ఉద్ఘాటన ద్వారా ఆ కార్యాలకు యాహ్వేనే కర్త అని హీబ్రూ వాక్యం గుర్తింపజేసే బలాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని ఉద్ఘాటనను ‘యాహ్వేయే’తో, నిర్గమన దిశాసూచక భావాన్ని ‘పైకి తీసుకొచ్చినవాడు’తో నిలిపాం; నిజమైన పదార్థ ప్రత్యామ్నాయాలను పాదసూచికల్లో స్పష్టంచేశాం.
