id: 1SA.12.11
reference: 1 Samuel 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יְרֻבַּ֣עַל וְ/אֶת בְּדָ֔ן וְ/אֶת יִפְתָּ֖ח וְ/אֶת שְׁמוּאֵ֑ל וַ/יַּצֵּ֨ל אֶתְ/כֶ֜ם מִ/יַּ֤ד אֹֽיְבֵי/כֶם֙ מִ/סָּבִ֔יב וַ/תֵּשְׁב֖וּ בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
translation:
  language: te
  text: యెహోవా యెరుబ్బయలును[a], బెదానును[b], యెఫ్తాను, సమూయేలును పంపించాడు. ఆయన మీ చుట్టుపక్కల ఉన్న శత్రువుల చేతిలోనుండి మిమ్మల్ని విడిపించాడు; మీరు సురక్షితంగా నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యెరుబ్బయలు అనేది గిద్యోనుకు ఉన్న మరో పేరు (న్యాయాధిపతులు 6:32; 7:1 చూడండి).
    reason: cross_reference
  - marker: b
    text: హీబ్రూ పాఠంలో ‘బెదాను’ అని ఉంది. ఇతడు ఎవరో ఖచ్చితంగా తెలియదు; కొందరు వ్యాఖ్యాతలు ఇతడిని బారాకు అని, మరికొందరు—అయితే తక్కువగా—అబ్దోను అని భావిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన రూపంలో ఉంచి, మూలపాఠంలోని వ్యక్తిగత నామ స్వభావాన్ని నిలుపుతుంది.
- source_word: וַיִּשְׁלַח
  choice: పంపించాడు
  rationale: שׁלח అనే క్రియకు ఈ సందర్భంలో సహజమైన, నేరమైన తెలుగు అర్థం.
- source_word: יְרֻבַּעַל
  choice: యెరుబ్బయలు
  rationale: మూలపాఠంలో ఉన్న పేరునే ప్రధాన వాక్యంలో ఉంచి, గిద్యోనుతో దాని సంబంధాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: בְּדָן
  choice: బెదాను
  rationale: మసొరెటిక్ పాఠంలోని పేరును సవరించకుండా ఉంచుతుంది; అనిశ్చిత గుర్తింపులను పాదసూచికలో సూచిస్తుంది.
- source_word: יִפְתָּח
  choice: యెఫ్తా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: וַיַּצֵּל
  choice: విడిపించాడు
  rationale: ప్రమాదకరమైన శత్రు ఆధిపత్యం నుండి రక్షించి బయటకు తేవడం అనే נצל భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִיַּד אֹיְבֵיכֶם
  choice: మీ శత్రువుల చేతిలోనుండి
  rationale: ‘చేతి’ అంటే అధికారం లేదా పట్టుదల అనే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: מִסָּבִיב
  choice: చుట్టూ ఉన్న
  rationale: శత్రువులు అన్ని వైపులా ఉన్నారనే స్థలార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַתֵּשְׁבוּ בֶּטַח
  choice: మీరు సురక్షితంగా నివసించారు
  rationale: ישׁב యొక్క నివసించడం అనే భావాన్నీ, בֶּטַח యొక్క భద్రత భావాన్నీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: בְּדָן అనే వ్యక్తి గుర్తింపు
  choice: ప్రధాన పాఠంలో ‘బెదాను’ అని మసొరెటిక్ పాఠరూపాన్ని నిలుపడం
  alternative: బారాకు లేదా, తక్కువగా, అబ్దోను అని గుర్తించడం
  rationale: మూల హీబ్రూ పాఠమే అనువాదానికి ఆధారం. వ్యక్తి గుర్తింపు వివాదాస్పదమైనందున దానిని ప్రధాన పాఠంలో నిశ్చయించకుండా ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వరుస సంధులను తెలుగులో సహజమైన రెండు వాక్యాలుగా మలిచినా, సంఘటనల క్రమాన్నీ కారణార్థాన్ని చేర్చకుండా మూలంలోని భావాన్నీ నిలుపుకుంది. పాదసూచిక సూచికలు అవి వివరిస్తున్న పేర్ల వెంటనే ఉంచబడ్డాయి.
