id: 1SA.12.25
reference: 1 Samuel 12:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם הָרֵ֖עַ תָּרֵ֑עוּ גַּם אַתֶּ֥ם גַּֽם מַלְכְּ/כֶ֖ם תִּסָּפֽוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/025.yaml
  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
translation:
  language: te
  text: కాని మీరు చెడు చేయడంలో కొనసాగితే[a], మీరూ మీ రాజూ తుడిచిపెట్టుకుపోతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీరు చెడు చేస్తే’ లేదా ‘మీరు దుర్మార్గంగా ప్రవర్తిస్తే.’ హెబ్రీలో infinitive absoluteతో క్రియను బలపరిచారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నశించిపోతారు’ లేదా ‘నాశనం చేయబడతారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: కాని … అయితే
  rationale: ముందటి వచనంలోని వాగ్దానానికి విరుద్ధమైన షరతును సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది; అక్షరార్థంగా ఇది ‘మరియు ఒకవేళ’ అని కూడా అనువదించవచ్చు.
- source_word: הָרֵעַ תָּרֵעוּ
  choice: చెడు చేయడంలో కొనసాగితే
  rationale: רעע క్రియకు ముందు అదే క్రియకు చెందిన infinitive absolute రావడం క్రియను బలపరుస్తుంది. ‘కొనసాగితే’ అనే మాట ఆ తీవ్రతను సహజంగా వ్యక్తపరుస్తుంది; అయితే హెబ్రీ నిర్మాణం తప్పనిసరిగా కాలవ్యవధినే సూచించదు కాబట్టి ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  choice: మీరూ మీ రాజూ
  rationale: రెండుసార్లు వచ్చిన גַּם ప్రజలనూ వారి రాజునూ ఒకే హెచ్చరికలో చేర్చుతుంది. తెలుగు ‘మీరూ … రాజూ’ నిర్మాణం ఈ సమాన చేర్పును సహజంగా నిలుపుతుంది.
- source_word: תִּסָּפוּ
  choice: తుడిచిపెట్టుకుపోతారు
  rationale: ספה నిఫాల్ రూపం తీర్పులో తొలగించబడడం, నశించడం అనే భావాన్ని ఇస్తుంది. ఈ ఎంపిక క్రియలోని కర్మణి భావాన్నీ తీర్పు తీవ్రతనూ నిలుపుతుంది.
theological_decisions:
- issue: ప్రజలకూ రాజుకూ ప్రకటించిన తీర్పు స్వరూపం
  choice: ప్రజలనూ వారి రాజునూ కలిపి తొలగించే విస్తృతమైన తీర్పు హెచ్చరిక
  alternative: కేవలం సైనిక ఓటమి; లేదా కేవలం ఆధ్యాత్మిక నాశనం
  rationale: హెబ్రీ వాక్యం తీర్పు ఏ రూపంలో అమలవుతుందో నిర్దిష్టంగా చెప్పదు. అందువల్ల అనువాదం దానిని ఒక్క విధమైన శిక్షకు పరిమితం చేయకుండా, నాశనం లేదా తొలగింపు అనే విస్తృత భావాన్ని ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన హెచ్చరిక ధోరణి ఉంచబడింది. ‘మీరూ మీ రాజూ’ సాధారణ పాఠకులకు సహజంగా ఉండి మూలంలోని పునరుక్త చేర్పును కాపాడుతుంది. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
