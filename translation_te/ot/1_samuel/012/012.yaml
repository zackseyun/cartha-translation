id: 1SA.12.12
reference: 1 Samuel 12:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּרְא֗וּ כִּֽי נָחָ֞שׁ מֶ֣לֶךְ בְּנֵֽי עַמּוֹן֮ בָּ֣א עֲלֵי/כֶם֒ וַ/תֹּ֣אמְרוּ לִ֔/י לֹ֕א כִּי מֶ֖לֶךְ יִמְלֹ֣ךְ עָלֵ֑י/נוּ וַ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם מַלְכְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
translation:
  language: te
  text: అమ్మోనీయుల రాజైన నాహాషు మీ మీదికి వస్తున్నాడని మీరు చూసినప్పుడు, మీరు నాతో, ‘కాదు, కానీ మా మీద ఒక రాజు పరిపాలించాలి’ అన్నారు—అయినప్పటికీ మీ దేవుడైన యెహోవాయే మీ రాజుగా ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ దేవుడైన యెహోవాయే మీ రాజు.” హీబ్రూ వాక్యంలో స్పష్టమైన క్రియ లేదు; కాబట్టి సందర్భానుసారం గతకాలం లేదా వర్తమానకాలం భావాన్ని గ్రహించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ כִּי
  choice: మీ మీదికి వస్తున్నాడని మీరు చూసినప్పుడు
  rationale: כִּי చూసిన విషయాన్ని పరిచయం చేస్తుంది; వావ్-వరుస రూపం సందర్భాన్ని కాలసంబంధ ఉపవాక్యంగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נָחָשׁ מֶלֶךְ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల రాజైన నాహాషు
  rationale: వ్యక్తి పేరును తెలుగు లిప్యంతరీకరణలో ఉంచి, జాతి-రాజ్య సూచనను సహజమైన ఆధునిక తెలుగులో ఇచ్చింది.
- source_word: בָּא עֲלֵיכֶם
  choice: మీ మీదికి వస్తున్నాడు
  rationale: בוא + עַל ఇక్కడ శత్రుత్వంతో ముందుకు రావడాన్ని సూచిస్తుంది; ‘మీ మీదికి’ ఆ సైనిక భావాన్ని సందర్భంలో నిలుపుతుంది.
- source_word: לֹא כִּי
  choice: కాదు
  rationale: ప్రజలు దేవుని రాజత్వానికి బదులుగా మానవ రాజును పట్టుబట్టిన నిరాకరణాత్మక మలుపును సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  choice: మా మీద ఒక రాజు పరిపాలించాలి
  rationale: సమాన మూలాక్షరాలున్న నామవాచక-క్రియా నిర్మాణం రాజు కావాలన్న వారి దృఢమైన డిమాండును వ్యక్తం చేస్తుంది; తెలుగులో ‘పరిపాలించాలి’ ఆ సంకల్ప బలాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם
  choice: అయితే మీ దేవుడైన యెహోవాయే మీకు రాజుగా ఉన్నాడు
  rationale: హీబ్రూ నామవాచక వాక్యంలో క్రియ స్పష్టంగా లేదు. కథనంలోని గత సందర్భానికి ‘ఉన్నాడు’ సరిపోతుంది; ‘యే’ దేవుడే వారి రాజు అనే వ్యతిరేకతను ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם లో అంతర్లీన సంధానక్రియ యొక్క కాలం
  choice: మీ దేవుడైన యెహోవాయే మీకు రాజుగా ఉన్నాడు
  alternative: మీ దేవుడైన యెహోవాయే మీకు రాజు
  rationale: హీబ్రూ వాక్యంలో స్పష్టమైన క్రియ లేకపోవడంతో గతకాల, వర్తమాన/కాలాతీత భావాలు రెండూ సాధ్యమే. సమూయేలు గత ఘటనను జ్ఞాపకం చేస్తున్నందున ప్రధాన పాఠ్యంలో గత సందర్భాన్ని అనుసరించాం; కొనసాగుతున్న దైవ రాజత్వ భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘యెహోవా’ అనే దైవనామాన్ని మూలంలోని יהוהకు ప్రత్యక్ష లిప్యంతరీకరణగా వాడాం. వాక్యంలోని మందలింపు మరియు దైవ రాజత్వానికి మానవ రాజత్వం మధ్య ఉన్న ఉద్రిక్తతను కాపాడాం.
