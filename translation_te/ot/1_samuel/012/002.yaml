  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
translation:
  language: te
  text: ఇప్పుడు చూడండి, రాజు మీ ముందు నడుస్తున్నాడు[a]. నేను ముసలివాడనై నెరిసిపోయాను[b]; ఇదిగో, నా కుమారులు మీతో ఉన్నారు. నేను నా యౌవనం మొదలుకొని ఈ రోజు వరకు మీ ముందు నడిచాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాజు మీ ముందు వెళ్తున్నాడు’ లేదా ‘రాజు మిమ్మల్ని నడిపిస్తున్నాడు’ అని కూడా అనువదించవచ్చు. ‘మీ ముందు నడవడం’ అనే హీబ్రూ నుడికారం ప్రజా నాయకత్వాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నేను ముసలివాడనై, నెరిసినవాడనయ్యాను.’
    reason: lexical_alternative
  - marker: c
    text: ‘నేను మీ ముందు వెళ్లాను’ లేదా ‘నేను మిమ్మల్ని నడిపించాను’ అని కూడా అనువదించవచ్చు. సమూయేలు తన ప్రజాపాత్రను రాజు పాత్రతో ఉద్దేశపూర్వకంగా సమాంతరంగా చెబుతున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సమూయేలు ప్రస్తుత పరిస్థితి నుండి తన విజ్ఞాపనను ప్రారంభిస్తున్న సంభాషణ సూచకం; తెలుగులో ‘ఇప్పుడు’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: הִנֵּה
  choice: చూడండి
  rationale: శ్రోతల దృష్టిని రాజువైపు మళ్లించే సూచనాత్మక అవ్యయం; ప్రాచీన శైలికి పోకుండా దాని ఆహ్వాన బలాన్ని నిలుపుతుంది.
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  choice: మీ ముందు నడుస్తున్నాడు
  rationale: హిత్పయేల్ వర్తమాన కృదంత రూపాన్ని కొనసాగుతున్న చర్యగా చూపుతూ, ‘ముందు నడవడం’ అనే నాయకత్వసూచక హీబ్రూ నుడికారాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: זָקַנְתִּי וָשַׂבְתִּי
  choice: నేను ముసలివాడనై నెరిసిపోయాను
  rationale: వృద్ధాప్య స్థితికి చేరడాన్నీ, వెంట్రుకలు నెరవడాన్నీ తెలిపే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּבָנַי הִנָּם אִתְּכֶם
  choice: ఇదిగో, నా కుమారులు మీతో ఉన్నారు
  rationale: הִנָּם లోని సమర్పణాత్మక ఉద్ఘాటనను ‘ఇదిగో’ నిలుపుతుంది; కుమారులు ప్రజల మధ్య ఉన్నారనే అర్థాన్ని నేరుగా అందిస్తుంది.
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  choice: మీ ముందు నడిచాను
  rationale: రాజును గురించి వాడిన అదే నుడికారాన్ని సమూయేలు తన గత ప్రజాపాత్రకు వాడిన సమాంతర నిర్మాణంగా నిలుపుతుంది.
- source_word: מִנְּעֻרַי עַד הַיּוֹם הַזֶּה
  choice: నా యౌవనం మొదలుకొని ఈ రోజు వరకు
  rationale: ఆయన యౌవనం నుండి ప్రస్తుత దినం వరకు సాగిన కాలవ్యాప్తిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: రాజు మరియు సమూయేలు ‘ప్రజల ముందు నడవడం’ మధ్య సమాంతరత
  choice: రెండు చోట్లా ‘మీ ముందు నడవడం’ అనే ఒకే పదబంధాన్ని నిలుపడం
  alternative: రెండు చోట్లా ‘మిమ్మల్ని నడిపించడం’ అని స్పష్టీకరించడం
  rationale: మూలపాఠం ఒకే హీబ్రూ నుడికారంతో రాజు ప్రస్తుత పాత్రను, సమూయేలు దీర్ఘకాల ప్రజాపాత్రను ఉద్దేశపూర్వకంగా సమాంతరంగా ఉంచుతుంది. ‘నడిపించడం’ నాయకత్వ భావాన్ని స్పష్టం చేసినా, నుడికారంలోని దృశ్యార్థం మరియు స్వల్ప అనిశ్చితిని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ‘చూడండి’ మరియు ‘ఇదిగో’ మూలంలోని రెండు వేర్వేరు సమర్పణాత్మక ప్రయోగాలకు సహజమైన సందర్భోచిత రూపాలు. ‘మీ ముందు నడవడం’ అనే పదబంధం కొంత అసాధారణంగా అనిపించినా, మూలంలోని నాయకత్వ నుడికారాన్నీ రాజు–సమూయేలు సమాంతరతనూ నిలుపడానికి ఉద్దేశపూర్వకంగా ఉంచబడింది.
