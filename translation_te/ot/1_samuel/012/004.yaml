id: 1SA.12.4
reference: 1 Samuel 12:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ לֹ֥א עֲשַׁקְתָּ֖/נוּ וְ/לֹ֣א רַצּוֹתָ֑/נוּ וְ/לֹֽא לָקַ֥חְתָּ מִ/יַּד אִ֖ישׁ מְאֽוּמָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/004.yaml
  text: And they said[a], “You have not oppressed us, and you have not mistreated us, and you have not taken anything from any man's hand.”
translation:
  language: te
  text: అప్పుడు వారు, “నీవు మమ్మల్ని అణచివేయలేదు, మమ్మల్ని బాధించలేదు, ఎవరి చేతిలోనుంచీ ఏమీ తీసుకోలేదు[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “ఏ మనిషి చేతిలోనుంచీ.” ఈ మాట ఎవరి నుంచైనా చెల్లింపు, కానుక లేదా లంచం తీసుకోవడాన్ని సూచిస్తుండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు వారు ... అన్నారు
  rationale: వయ్యిక్తోల్ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో చూపిస్తుంది.
- source_word: עֲשַׁקְתָּנוּ
  choice: నీవు మమ్మల్ని అణచివేయలేదు
  rationale: అధికార దుర్వినియోగం ద్వారా పీడించడం, దోచుకోవడం లేదా అణచివేయడం అనే విస్తృత భావాన్ని ప్రజా న్యాయ సందర్భంలో నిలుపుతుంది.
- source_word: רַצּוֹתָנוּ
  choice: మమ్మల్ని బాధించలేదు
  rationale: רצץ అనే క్రియలోని నలగగొట్టడం లేదా కృంగదీయడం అనే బలమైన రూపక భావాన్ని, ఇక్కడ దుర్వ్యవహారం చేయడం అనే సందర్భార్థానికి తగిన సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  choice: ఎవరి చేతిలోనుంచీ ఏమీ తీసుకోలేదు
  rationale: ‘ఒక మనిషి చేతిలోనుంచి’ అనే హీబ్రూ నిర్దిష్ట ప్రయోగాన్ని సాధ్యమైనంత దగ్గరగా ఉంచుతూ, ఎవరి నుంచైనా చెల్లింపు, కానుక లేదా లంచం స్వీకరించలేదనే సందర్భసూచనను అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: אִישׁ
  choice: ఎవరి
  rationale: హీబ్రూలో ఏకవచన పుంలింగ రూపం ఉన్నప్పటికీ, నిరాకరణ వాక్యంలో అది ప్రతినిధి భావంతో ‘ఎవరి నుంచీ’ అని సహజ తెలుగులో వ్యక్తమవుతుంది.
- source_word: מְאוּמָה
  choice: ఏమీ
  rationale: నిరాకరణ వాక్యంలో ‘ఏదైనా సరే’ అనే అనిర్దిష్ట భావానికి సహజమైన తెలుగు రూపం.
