id: 1SA.12.10
reference: 1 Samuel 12:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ אֶל יְהוָה֙ ו/יאמר חָטָ֔אנוּ כִּ֤י עָזַ֨בְנוּ֙ אֶת יְהוָ֔ה וַ/נַּעֲבֹ֥ד אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּר֑וֹת וְ/עַתָּ֗ה הַצִּילֵ֛/נוּ מִ/יַּ֥ד אֹיְבֵ֖י/נוּ וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: te
  text: అప్పుడు వారు యెహోవాకు మొరపెట్టి, “మేము పాపం చేశాము, ఎందుకంటే మేము యెహోవాను విడిచిపెట్టి బయలులను, అష్తారోతులను సేవించాము. ఇప్పుడు మా శత్రువుల చేతిలోనుండి మమ్మల్ని విడిపించు; మేము నిన్ను సేవిస్తాము” అని అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: మొరపెట్టి
  rationale: ఆపదలో సహాయం కోసం బిగ్గరగా వేడుకోవడం అనే హెబ్రీయ క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామాన్ని సాధారణ తెలుగు బైబిల్ సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: הַבְּעָלִים
  choice: బయలులను
  rationale: బహువచన రూపాన్ని నిలిపి, వివిధ స్థానిక బయలు ఆరాధనా రూపాలను సూచించే మూలార్థాన్ని సంరక్షిస్తుంది.
- source_word: הָעַשְׁתָּרוֹת
  choice: అష్తారోతులను
  rationale: మూలంలోని బహువచన దేవతా నామాన్ని వివరణతో భర్తీ చేయకుండా లిప్యంతరీకరించి దాని చారిత్రక ప్రత్యేకతను నిలిపింది.
- source_word: מִיַּד אֹיְבֵינוּ
  choice: మా శత్రువుల చేతిలోనుండి
  rationale: ‘చేతి’ అనే మూల రూపకాన్ని నిలిపి, శత్రువుల అధికారం లేదా పట్టు నుండి విమోచన అనే భావాన్ని స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలీయుల పాపస్వీకారానికి ఇచ్చిన కారణం
  choice: ఎందుకంటే మేము యెహోవాను విడిచిపెట్టి
  alternative: మేము యెహోవాను విడిచిపెట్టాము గనుక
  rationale: כִּי ను కారణార్థకంగా అనువదిస్తూ, పాపమేమిటో—యెహోవాను విడిచి ఇతర దేవతలను సేవించడం—స్పష్టంగా నిలిపింది.
- issue: చివరి వాగ్దానంలోని సేవ భావం
  choice: మేము నిన్ను సేవిస్తాము
  alternative: మేము నిన్నే ఆరాధిస్తాము
  rationale: עבד క్రియలో సేవ మరియు ఆరాధన రెండింటి నేపథ్యం ఉన్నప్పటికీ, ముందున్న అన్యదేవతల ‘సేవ’తో ఉన్న పదబంధ సమాంతరతను కాపాడేందుకు ‘సేవిస్తాము’ ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. పాపస్వీకారం, విమోచన విజ్ఞప్తి, సేవ వాగ్దానం అనే మూడు భాగాల ప్రవాహం స్పష్టంగా ఉంచబడింది; చారిత్రక దేవతా నామాలు వివరణాత్మక పదాలతో మార్చబడలేదు.
