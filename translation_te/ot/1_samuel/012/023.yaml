id: 1SA.12.23
reference: 1 Samuel 12:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּ֣ם אָנֹכִ֗י חָלִ֤ילָ/ה לִּ/י֙ מֵ/חֲטֹ֣א לַֽ/יהוָ֔ה מֵ/חֲדֹ֖ל לְ/הִתְפַּלֵּ֣ל בַּעַדְ/כֶ֑ם וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם בְּ/דֶ֥רֶךְ הַ/טּוֹבָ֖ה וְ/הַ/יְשָׁרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
translation:
  language: te
  text: “ఇక నా విషయానికొస్తే, మీ కోసం ప్రార్థించడం మానివేసి యహ్వేకు[a] విరోధంగా పాపం చేయడం నాకు ఎన్నటికీ తగదు! మంచి, సరైన మార్గాన్ని నేను మీకు బోధిస్తాను[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలపాఠంలో దేవుని వ్యక్తిగత నామం YHWH ఉంది; దీనిని సాధారణంగా ‘యహ్వే’ అని ఉచ్చరిస్తారు.
    reason: divine_name
  - marker: b
    text: ‘బోధిస్తాను’ అనే హీబ్రూ క్రియకు ‘నేర్పిస్తాను’ లేదా ‘దారి చూపిస్తాను’ అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: ఇక నా విషయానికొస్తే
  rationale: Marked first-person emphasis and contrast are conveyed naturally in modern Telugu without a wooden rendering of ‘also I.’
- source_word: חָלִילָה לִּי
  choice: అది నా వల్ల ఎన్నటికీ జరగకూడదు!
  rationale: This forceful Telugu repudiation communicates the Hebrew idiom’s abhorrence more naturally than a literal expression such as ‘అది నాకు దూరమగుగాక.’
- source_word: מֵחֲטֹא לַיהוָה
  choice: యెహోవాకు విరోధంగా పాపం చేయడం
  rationale: The wording retains the explicit theological claim that ceasing intercession would be a personal sin against YHWH, not merely neglect of leadership duty.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: This familiar Telugu form represents the divine name rather than replacing it with the title ‘ప్రభువు.’ A footnote gives the probable form ‘యహ్వే.’
- source_word: מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  choice: మీ కోసం ప్రార్థించడం మానేసి
  rationale: This clearly identifies cessation of intercession on the people’s behalf as the act by which Samuel would sin.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: నేను మీకు బోధిస్తాను
  rationale: The Hiphil of ירה includes teaching and directing; ‘బోధిస్తాను’ is natural here and retains the prophetic-instruction sense.
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  choice: మంచి, సరైన మార్గాన్ని
  rationale: ‘మార్గం’ preserves the conduct metaphor, while ‘మంచి, సరైన’ expresses the moral qualities in clear modern Telugu.
theological_decisions:
- issue: 'Samuel’s failure to intercede: neglect or sin against God'
  choice: యెహోవాకు విరోధంగా పాపం
  alternative: నాయకత్వ బాధ్యతను నిర్లక్ష్యం చేయడం
  rationale: The Hebrew explicitly calls the contemplated failure ‘sin against YHWH’; the translation preserves that theological weight.
- issue: Rendering the divine name יְהוָה
  choice: యెహోవా, with a footnote noting యహ్వే
  alternative: ప్రభువు
  rationale: The source text uses the divine personal name. The translation does not silently substitute a title, while the note acknowledges the probable pronunciation.
- issue: Force of חָלִילָה לִּי
  choice: అది నా వల్ల ఎన్నటికీ జరగకూడదు!
  alternative: అది నాకు దూరమగుగాక
  rationale: The chosen wording preserves Samuel’s emphatic repudiation in natural Telugu without turning the idiom into an obscure literalism.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మార్గం’ అనే నైతిక జీవనరూపకం నిలుపబడింది; బలమైన హీబ్రూ నిరాకరణను ఆశ్చర్యార్థక వాక్యంతో వ్యక్తం చేశాం.
