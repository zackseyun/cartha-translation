- from: “ఇక నా విషయానికొస్తే, మీ కోసం ప్రార్థించడం మానేసి యెహోవాకు[a] విరోధంగా పాపం చేయడం—అది నా వల్ల ఎన్నటికీ జరగకూడదు! మంచి, సరైన మార్గాన్ని నేను మీకు బోధిస్తాను[b].”
  to: “ఇక నా విషయానికొస్తే, మీ కోసం ప్రార్థించడం మానివేసి యహ్వేకు[a] విరోధంగా పాపం చేయడం నాకు ఎన్నటికీ తగదు! మంచి, సరైన మార్గాన్ని నేను మీకు బోధిస్తాను[b].”
  rationale: The revision standardizes the rendering of יהוה as “యహ్వే,” in accordance with the source-oriented project decision and the footnote. It also slightly refines the repudiation idiom while retaining the verse’s emphatic force, its explicit identification of ceasing intercession as sin against Yahweh, and the moral metaphor of the good and upright way.
