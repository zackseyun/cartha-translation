id: 1SA.12.7
reference: 1 Samuel 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִֽתְיַצְּב֛וּ וְ/אִשָּׁפְטָ֥ה אִתְּ/כֶ֖ם לִ/פְנֵ֣י יְהוָ֑ה אֵ֚ת כָּל צִדְק֣וֹת יְהוָ֔ה אֲשֶׁר עָשָׂ֥ה אִתְּ/כֶ֖ם וְ/אֶת אֲבוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/007.yaml
  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు మీరు నిలబడండి. యెహోవా మీకూ మీ పూర్వీకులకూ చేసిన నీతికార్యాలన్నిటి[b] గురించి యెహోవా సన్నిధిలో మీతో వాదిస్తాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీకు తీర్పు తీరుస్తాను,’ ‘మీతో తర్కిస్తాను,’ లేదా ‘మీతో నా వ్యాజ్యం వినిపిస్తాను.’ హీబ్రూ పదబంధానికి యెహోవా సన్నిధిలో ఒక వ్యాజ్యాన్ని విచారణకు ఉంచే న్యాయపరమైన భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నీతికార్యాలు’ అంటే యెహోవా తన ప్రజల పక్షంగా చేసిన న్యాయమైన, నిబంధనకు నమ్మకమైన కార్యాలు.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ఇది సమూయేలు ప్రసంగంలో కాలసూచనతో పాటు ముందటి మాటల నుంచి వచ్చే తార్కిక పరిణామాన్ని కూడా సూచిస్తుంది.
- source_word: הִתְיַצְּבוּ
  choice: మీరు నిలబడండి
  rationale: బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, అధికారిక విచారణకు సిద్ధంగా నిలిచే భావాన్ని సందర్భం ద్వారా నిలుపుతుంది.
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  choice: మీతో వాదిస్తాను[a]
  rationale: שפט రూపానికి ఇక్కడ న్యాయస్థాన సంబంధమైన వ్యాజ్యార్థం ఉంది. కేవలం తీర్పు ప్రకటించడం అనే అర్థం రాకుండా, ఒక పక్షంగా విషయాన్ని విచారణకు ఉంచే భావాన్ని ‘వాదిస్తాను’ తెలియజేస్తుంది; ఇతర సాధ్యార్థాలు పాదటిప్పణిలో ఉన్నాయి.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దేవుని సమక్షంలో జరిగే నిబంధనాత్మక లేదా న్యాయపరమైన చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో ఉంచుతుంది.
- source_word: אֵת כָּל צִדְקוֹת יְהוָה
  choice: యెహోవా ... చేసిన నీతికార్యాలన్నిటిని[b]
  rationale: צִדְקוֹת అనేది ఇక్కడ అమూర్తమైన నీతిగుణం కాక, యెహోవా న్యాయాన్నీ నిబంధన విశ్వసనీయతనూ చూపిన కార్యాలను సూచిస్తుంది. ‘రక్షణ కార్యాలు’ అనే సంకుచిత వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: אֲשֶׁר עָשָׂה אִתְּכֶם וְאֶת אֲבוֹתֵיכֶם
  choice: మీకూ మీ పూర్వీకులకూ చేసిన
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మీతో, మీ పితరులతో చేసిన’ అని ఉన్నా, సందర్భంలో వారికి అనుకూలంగా చేసిన కార్యాలనే భావం. ‘పూర్వీకులు’ ఆధునిక పాఠకులకు వంశపూర్వ తరాల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత నిబంధన నామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల దానిని సాధారణ బిరుదుగా మార్చలేదు.
- issue: צִדְקוֹת יְהוָה యొక్క భావం
  choice: యెహోవా చేసిన నీతికార్యాలు
  alternative: యెహోవా చేసిన రక్షణ కార్యాలు
  rationale: ఈ పదబంధం ఇశ్రాయేలు చరిత్రలో దేవుని న్యాయమైన, నిబంధనకు నమ్మకమైన కార్యాలను సూచిస్తుంది. ‘నీతికార్యాలు’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది; ‘రక్షణ కార్యాలు’ దానిని ఒకే అంశానికి పరిమితం చేయవచ్చు.
- issue: וְאִשָּׁפְטָה אִתְּכֶם యొక్క న్యాయపరమైన ఉద్రిక్తత
  choice: మీతో వాదిస్తాను
  alternative: మీకు తీర్పు తీరుస్తాను / మీతో నా వ్యాజ్యం వినిపిస్తాను
  rationale: సమూయేలు వెంటనే శిక్షాతీర్పు ప్రకటిస్తున్నాడనే భావాన్ని రుద్దకుండా, యెహోవా సన్నిధిలో చారిత్రక సాక్ష్యాలతో విషయాన్ని విచారణకు ఉంచే న్యాయపరమైన భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ ప్రసంగానికి తగిన శైలి వాడబడింది. ‘పూర్వీకులు’ సాధారణ పాఠకులకు సహజంగా ఉండగా మూలంలోని వంశపారంపర్య భావాన్ని నిలుపుతుంది. న్యాయస్థాన నేపథ్యాన్ని అతిగా సాంకేతికంగా చేయకుండా ప్రధాన పాఠ్యంలో ‘వాదిస్తాను’ అని, దాని అర్థవిస్తృతిని పాదటిప్పణిలో ఇచ్చాం.
