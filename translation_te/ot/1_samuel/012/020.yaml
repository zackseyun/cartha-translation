id: 1SA.12.20
reference: 1 Samuel 12:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל הָ/עָם֙ אַל תִּירָ֔אוּ אַתֶּ֣ם עֲשִׂיתֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּ֑את אַ֗ךְ אַל תָּס֨וּרוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/עֲבַדְתֶּ֥ם אֶת יְהוָ֖ה בְּ/כָל לְבַבְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
translation:
  language: te
  text: 'సమూయేలు ప్రజలతో ఇలా అన్నాడు: “భయపడకండి.[a] మీరు ఈ చెడంతా చేశారు. అయినా యాహ్వేను అనుసరించడం మానివేయకండి; మీ పూర్ణ హృదయంతో యాహ్వేను సేవించండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భయపడవద్దు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל הָעָם
  choice: సమూయేలు ప్రజలతో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది; הָעָם ఇక్కడ సమకూడిన ఇశ్రాయేలీయులను సూచిస్తుంది.
- source_word: אַל תִּירָאוּ
  choice: భయపడకండి
  rationale: యרא క్రియలోని నిషేధాత్మక ఆజ్ఞను సహజంగా, గౌరవప్రదమైన బహువచన సంబోధనతో అందిస్తుంది.
- source_word: אַתֶּם עֲשִׂיתֶם אֵת כָּל הָרָעָה הַזֹּאת
  choice: మీరు ఈ చెడు అంతా చేశారు
  rationale: స్వతంత్ర సర్వనామమైన אַתֶּם ఇచ్చే ఉద్ఘాటనను ‘మీరు’ నిలుపుతుంది; רָעָה యొక్క నైతిక తీవ్రతను ‘చెడు’ తగ్గించకుండా తెలియజేస్తుంది.
- source_word: אַךְ
  choice: అయినా
  rationale: వారి చెడును అంగీకరించిన తరువాత వచ్చే బలమైన ప్రతికూల-రాయితీ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַל תָּסוּרוּ מֵאַחֲרֵי יְהוָה
  choice: యెహోవాను అనుసరించడం మానివేయకండి
  rationale: ‘యెహోవా వెనుకనుండి తొలగిపోవద్దు’ అనే హీబ్రూ నుడికారంలోని అనుసరణ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: וַעֲבַדְתֶּם אֶת יְהוָה
  choice: యెహోవాను సేవించండి
  rationale: עבד యొక్క ఒడంబడిక సంబంధమైన విస్తృత అర్థాన్ని ‘ఆరాధించండి’ అని కుదించకుండా ‘సేవించండి’గా అందిస్తుంది.
- source_word: בְּכָל לְבַבְכֶם
  choice: మీ పూర్ణహృదయంతో
  rationale: సంపూర్ణ అంతరంగ భక్తి, విధేయత అనే హీబ్రూ నుడికార భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని చతురక్షర దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం. ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; ‘యాహ్వే’ మూల ఉచ్చారణకు సమీపమైన ప్రత్యామ్నాయం.
- issue: רָעָה యొక్క నైతిక బలం
  choice: చెడు
  alternative: దుష్టత్వం
  rationale: సందర్భంలో ప్రజల కార్యంపై ఉన్న నైతిక తీర్పును ‘చెడు’ స్పష్టంగా నిలుపుతుంది; ‘దుష్టత్వం’ ఇక్కడ అవసరానికి మించిన వ్యక్తిత్వ-తీర్పుగా వినిపించవచ్చు.
- issue: וַעֲבַדְתֶּם లోని waw సంబంధం
  choice: సెమికోలన్ ద్వారా సానుకూల ఆజ్ఞగా అనుసంధానం
  alternative: ‘మరియు సేవించండి’
  rationale: హీబ్రూ waw ను విరోధార్థక ‘కాని’గా అతిగా నిర్ణయించకుండా, ముందున్న నిషేధానికి అనుసరించే సానుకూల ఆజ్ఞగా విరామచిహ్నంతో సహజంగా కలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రజలను ఉద్దేశించిన బహువచన గౌరవ రూపాలు వాడబడ్డాయి. వాక్యం గంభీరంగా ఉన్నా సాధారణ పాఠకులకు సులభంగా ఉండేలా రూపొందించబడింది. మూలంలోని అనుసరణ నుడికారాన్ని అర్థస్పష్టంగా వ్యక్తం చేసి, దైవనామాన్ని పేరుగా నిలిపింది.
