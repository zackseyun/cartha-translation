revisions:
- from: 'సమూయేలు ప్రజలతో ఇలా అన్నాడు: “భయపడకండి.[a] మీరు ఈ చెడు అంతా చేశారు. అయినా యెహోవాను అనుసరించడం మానివేయకండి; మీ పూర్ణహృదయంతో యెహోవాను సేవించండి.”'
  to: 'సమూయేలు ప్రజలతో ఇలా అన్నాడు: “భయపడకండి.[a] మీరు ఈ చెడంతా చేశారు. అయినా యాహ్వేను అనుసరించడం మానివేయకండి; మీ పూర్ణ హృదయంతో యాహ్వేను సేవించండి.”'
