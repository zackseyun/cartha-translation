  text: הֲ/ל֤וֹא קְצִיר חִטִּים֙ הַ/יּ֔וֹם אֶקְרָא֙ אֶל יְהוָ֔ה וְ/יִתֵּ֥ן קֹל֖וֹת וּ/מָטָ֑ר וּ/דְע֣וּ וּ/רְא֗וּ כִּֽי רָעַתְ/כֶ֤ם רַבָּה֙ אֲשֶׁ֤ר עֲשִׂיתֶם֙ בְּ/עֵינֵ֣י יְהוָ֔ה לִ/שְׁא֥וֹל לָ/כֶ֖ם מֶֽלֶךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
translation:
  language: te
  text: “ఈ రోజు గోధుమల కోత కాదా? నేను యాహ్వేకు మొరపెడతాను; ఆయన ఉరుములను, వానను కురిపిస్తాడు.[a] అప్పుడు మీ కోసం రాజును అడగడం ద్వారా యాహ్వే దృష్టిలో మీరు చేసిన దుష్టత్వం గొప్పదని తెలుసుకోండి, చూడండి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆయన ధ్వనులను, వానను ఇస్తాడు.” ఇక్కడ “ధ్వనులు” అంటే ఉరుములు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא קְצִיר חִטִּים הַיּוֹם
  choice: ఈ రోజు గోధుమ కోతకాలం కాదా?
  rationale: హలో అనే ప్రశ్నార్థక రూపం సమ్మతిని ఆశించే అలంకారిక ప్రశ్నను సూచిస్తుంది; తెలుగు సహజ వాక్యనిర్మాణంలో దాని ప్రశ్నార్థక బలాన్ని నిలిపింది.
- source_word: אֶקְרָא אֶל־יְהוָה
  choice: నేను యెహోవాకు మొరపెడతాను
  rationale: קרא אל ఇక్కడ ప్రార్థనలో దేవునికి మొరపెట్టడాన్ని సూచిస్తుంది. 'పిలుస్తాను' కంటే 'మొరపెడతాను' సందర్భానికి సహజంగా, దిశార్థాన్ని కూడా తెలియజేస్తుంది.
- source_word: וְיִתֵּן קֹלוֹת וּמָטָר
  choice: ఆయన ఉరుములను, వానను పంపిస్తాడు
  rationale: נתן అక్షరార్థంగా 'ఇస్తాడు'; వాతావరణ ఘటనల విషయంలో తెలుగులో 'పంపిస్తాడు' సహజం. קֹלוֹת అక్షరార్థంగా 'స్వరాలు/ధ్వనులు' అయినా, వాన సందర్భంలో ఉరుములను సూచిస్తుంది.
- source_word: וּדְעוּ וּרְאוּ
  choice: మీరు తెలుసుకొని గ్రహిస్తారు
  rationale: రెండు ఆజ్ఞారూప క్రియల సంయుక్త బలాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. 'చూడండి' అనే అక్షరార్థం ఇక్కడ గుర్తించి నిశ్చయించుకోవడం అనే భావాన్ని కలిగి ఉంది.
- source_word: כִּי רָעַתְכֶם רַבָּה
  choice: మీరు చేసిన దుష్టత్వం ఎంత గొప్పదో
  rationale: רָעָה ఇక్కడ విపత్తును కాక నైతిక చెడును సూచిస్తుంది; רַבָּה దాని తీవ్రతను తెలియజేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: హీబ్రూ 'యెహోవా కళ్లలో' అనే నుడికారానికి సహజమైన తెలుగు సమానార్థకం; దేవుని నైతిక అంచనాను నిలుపుతుంది.
- source_word: לִשְׁאֹל לָכֶם מֶלֶךְ
  choice: మీ కోసం ఒక రాజును అడగడం ద్వారా
  rationale: לִשְׁאֹל అనే infinitive వారి దుష్టత్వం ఏ చర్యలో ఉందో వివరిస్తుంది; לָכֶם లోని స్వప్రయోజన భావాన్ని 'మీ కోసం' నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు సుపరిచితమైన 'యెహోవా' రూపంలో ఉంచింది.
- issue: రాజును అడగడం యొక్క నైతిక అంచనా
  choice: యెహోవా దృష్టిలో మీరు చేసిన దుష్టత్వం
  alternative: రాజ్యవ్యవస్థ స్వతహాగా దుష్టమని స్పష్టీకరించడం
  rationale: వాక్యం ప్రజల అభ్యర్థనను దుష్టత్వంగా నిర్ధారిస్తుంది; అయితే రాజ్యవ్యవస్థ అంతటినీ సిద్ధాంతపరంగా ఖండిస్తున్నదని అదనంగా చెప్పదు. మూలంలోని ఉద్రిక్తతను అలాగే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ అలంకారిక ప్రశ్నను, నైతిక తీవ్రతను, దైవనామాన్ని నిలిపింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
