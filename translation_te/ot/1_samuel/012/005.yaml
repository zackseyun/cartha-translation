  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
translation:
  language: te
  text: 'అతడు వారితో[a] ఇలా అన్నాడు: “నా చేతిలో మీరు ఏదీ కనుగొనలేదని యెహోవా మీకు వ్యతిరేకంగా సాక్షి; ఆయన అభిషిక్తుడూ[b] ఈ రోజు సాక్షి.” అప్పుడు వారు[c], “ఆయనే సాక్షి” అన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా, “యెహోవా మీ మధ్యలో/మీతో సాక్షి.” ఈ సందర్భంలో భావం న్యాయపరమైనది: వారికి సంబంధించిన ఈ వ్యవహారంలో యెహోవా సాక్షిగా నిలుస్తాడు.'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఆయన అభిషిక్తుడు.” ఇక్కడ ఇది రాజైన సౌలును సూచిస్తుంది; తరువాతి కాలంలోని మెస్సీయ బిరుదును నేరుగా సూచించడం లేదు.
    reason: cultural_note
  - marker: c
    text: చివరి హీబ్రూ క్రియ ఏకవచనంలో ఉంది—అక్షరార్థంగా, “అతడు అన్నాడు.” అయితే సందర్భంలో అది ప్రజల సామూహిక జవాబుగా పనిచేస్తుంది; అందుకే ప్రధాన పాఠంలో “వారు ... అన్నారు” అని అనువదించాం.
    reason: textual_note
lexical_decisions:
- source_word: עֵד
  choice: సాక్షి
  rationale: న్యాయపరమైన లేదా నిబంధన సంబంధమైన సందర్భంలో సాక్ష్యమిచ్చే వ్యక్తిని ఈ నామవాచకం సూచిస్తుంది. సమూయేలు బహిరంగంగా తన నిర్దోషిత్వాన్ని నిరూపించుకునే ఈ సందర్భానికి ‘సాక్షి’ సహజంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: בָּכֶם
  choice: మీకు వ్యతిరేకంగా
  rationale: עֵדతో కలిసి వచ్చిన ఈ విభక్తి న్యాయపరమైన సందర్భంలో వారి విషయంలో, వారిని బాధ్యులుగా నిలిపే సాక్షి అనే భావాన్ని ఇస్తుంది. మూలంలోని ‘మీలో/మీతో’ అనే స్థానార్థక అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
- source_word: מְשִׁיחוֹ
  choice: ఆయన అభిషిక్తుడు
  rationale: ఇక్కడ ఇది అప్పుడే రాజుగా స్థాపించబడిన సౌలును సూచిస్తుంది. ‘మెస్సీయ’ అని చేయకుండా ‘అభిషిక్తుడు’ అని అనువదించడం మూలపద భావాన్ని కాపాడుతూ, తరువాతి మెస్సీయ సంబంధ భావాన్ని అనవసరంగా ఈ వచనంలోకి తీసుకురాదు.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: బహిరంగ ప్రకటన జరుగుతున్న ప్రస్తుత దినాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: מְצָאתֶם
  choice: మీరు ... కనుగొనలేదు
  rationale: ప్రజలు చేసిన పరిశీలన ఇప్పటి ప్రకటన నాటికి పూర్తయిందనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיָדִי
  choice: నా చేతిలో
  rationale: స్వాధీనంలో లేదా ఆధీనంలో ఉన్నదాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులోనూ అర్థమయ్యే ‘నా చేతిలో’ అనే రూపంలో నిలిపాం.
- source_word: מְאוּמָה
  choice: ఏదీ
  rationale: నిషేధంతో కలిసి ‘ఏదైనా సరే’ అనే భావాన్ని ఇస్తుంది; తెలుగు నిషేధ వాక్యంలో ‘ఏదీ ... లేదు’ సహజమైన సమానం.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: అతడు ... అన్నాడు; వారు ... అన్నారు
  rationale: మొదటి ఏకవచన క్రియ సమూయేలును సూచిస్తుంది. చివరి క్రియ మసొరేటిక్ పాఠంలో ఏకవచనమైనప్పటికీ, సందర్భంలో అది ప్రజల సామూహిక జవాబుగా పనిచేస్తుంది; అందుకే ప్రధాన పాఠంలో బహువచనం వాడి, అక్షరార్థ రూపాన్ని పాదటిప్పణిలో తెలిపాం.
