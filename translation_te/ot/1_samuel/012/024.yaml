source:
  edition: WLC
  text: אַ֣ךְ יְר֣אוּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֥ם אֹת֛/וֹ בֶּ/אֱמֶ֖ת בְּ/כָל לְבַבְ/כֶ֑ם כִּ֣י רְא֔וּ אֵ֥ת אֲשֶׁר הִגְדִּ֖ל עִמָּ/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/024.yaml
  text: Only fear Yahweh and serve him faithfully with all your heart[a], for consider what great things he has done with you.
translation:
  language: te
  text: కేవలం యాహ్వేకు భయపడండి; మీ పూర్తి హృదయంతో ఆయనను నమ్మకంగా సేవించండి. ఆయన మీతో[a] చేసిన గొప్ప కార్యాలను ఆలోచించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ కోసం”; హీబ్రూలో, “మీతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి హెచ్చరిక తరువాత వచ్చే ప్రధాన ప్రోత్సాహాన్ని తెలుగులో సహజంగా అనుసంధానిస్తుంది; ఈ సందర్భంలో కణానికి ఉన్న నిర్బంధాత్మక బలాన్ని వాక్య నిర్మాణం కూడా తెలియజేస్తుంది.
- source_word: יְרְאוּ אֶת־יְהוָה
  choice: యెహోవాకు భయపడి
  rationale: יִרְאוּ లోని భక్తిపూర్వక భయం, విధేయతతో కూడిన గౌరవం అనే నిబంధనాత్మక భావాన్ని ‘భయపడడం’ అనే బైబిలు పదప్రయోగం నిలుపుతుంది; దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: ఆయనను ... సేవించండి
  rationale: עבד యొక్క విస్తృత నిబంధనాత్మక భావం ఆరాధనతోపాటు విధేయమైన సేవను కలిగి ఉంది; అందువల్ల ‘సేవించండి’ ప్రత్యక్షమైన, సహజమైన సమానార్థకం.
- source_word: בֶּאֱמֶת
  choice: నమ్మకంగా
  rationale: ఈ సందర్భంలో אֱמֶת సేవ యొక్క నిజాయితీ, స్థిరత్వం, విశ్వసనీయతను సూచిస్తుంది; ‘నమ్మకంగా’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּכָל לְבַבְכֶם
  choice: మీ పూర్ణహృదయంతో
  rationale: సంపూర్ణ అంతరంగ సమర్పణను సూచించే హీబ్రూ నుడికారాన్ని గంభీరమైన, అర్థమయ్యే తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: רְאוּ
  choice: ఆలోచించండి
  rationale: అక్షరార్థంగా ‘చూడండి’ అయినప్పటికీ, ఇక్కడ దేవుని కార్యాలను గుర్తించి మననం చేయాలనే ఆజ్ఞార్థక భావం ఉంది; ‘ఆలోచించండి’ దాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵת אֲשֶׁר הִגְדִּיל
  choice: చేసిన గొప్ప కార్యాలను
  rationale: הגדיל అనే హిఫీల్ రూపం ఇక్కడ ‘గొప్ప కార్యాలు చేయడం’ అనే నుడికారార్థాన్ని ఇస్తుంది.
- source_word: עִמָּכֶם
  choice: మీతో
  rationale: עם అనే విభక్తి యొక్క ప్రత్యక్ష అర్థమైన ‘తో’ను నిలుపుతుంది; దేవుడు ఇశ్రాయేలుతో వ్యవహరించిన కార్యాలను సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత నిబంధన నామం నేరుగా ఉంది. తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపం దానిని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
- issue: בֶּאֱמֶת లోని సేవ స్వభావం
  choice: నమ్మకంగా
  alternative: సత్యంగా / యథార్థంగా
  rationale: ఇక్కడ పదం కేవలం వాస్తవ సత్యాన్ని కాక, దేవునిపట్ల స్థిరమైన నిజాయితీగల సేవను సూచించగలదు. ‘నమ్మకంగా’ ఆ నిబంధనాత్మక విస్తృతిని కాపాడుతుంది.
- issue: עִמָּכֶם లో దేవుని కార్యాల సంబంధం
  choice: మీతో
  alternative: మీ కోసం
  rationale: మూలంలోని ‘తో’ అనే నిజమైన అస్పష్టతను నిలుపుతూ, దేవుడు వారి మధ్యనూ వారి పక్షానూ చేసిన కార్యాల భావాన్ని ముందుగానే ఒకే విధంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్య గాంభీర్యం మరియు నిబంధనాత్మక పదబలం నిలిచేలా రూపొందించబడింది.
