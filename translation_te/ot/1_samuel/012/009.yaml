id: 1SA.12.9
reference: 1 Samuel 12:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּמְכֹּ֣ר אֹתָ֡/ם בְּ/יַ֣ד סִֽיסְרָא֩ שַׂר צְבָ֨א חָצ֜וֹר וּ/בְ/יַד פְּלִשְׁתִּ֗ים וּ/בְ/יַד֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּֽלָּחֲמ֖וּ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
translation:
  language: te
  text: కాని వారు తమ దేవుడైన యాహ్వేను మరచిపోయారు. అప్పుడు ఆయన వారిని హాసోరు సైన్యాధిపతి సీసెరా చేతికి, ఫిలిష్తీయుల చేతికి, మోయాబు రాజు చేతికి అమ్మివేశాడు[a]; ఆ శత్రువులు వారిపై యుద్ధం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిని అప్పగించాడు.’ హీబ్రూలో అక్షరార్థంగా ‘వారిని అమ్మివేశాడు’ అని ఉంది; ఇది ఒక ప్రజను వారి శత్రువుల అధికారానికి అప్పగించడాన్ని సూచించే నిబంధన-తీర్పు నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: మరచిపోయారు
  rationale: שׁכח అనే క్రియకు ప్రాథమిక అర్థం ‘మరచిపోవడం.’ నిబంధన సంబంధ సందర్భంలో నిర్లక్ష్యం లేదా విశ్వాసద్రోహ భావం ఉన్నప్పటికీ, మూలపదాన్ని యథాతథంగా ఉంచడం ద్వారా ఆ భావం సందర్భం నుంచే వినిపిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ధ్వన్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: אֱלֹהֵיהֶם
  choice: తమ దేవుడైన
  rationale: స్వవాచక కర్తతో సహజ తెలుగు ప్రయోగం కోసం ‘వారి దేవుడు’ అనే భావాన్ని ‘తమ దేవుడైన’గా వ్యక్తం చేసి, నిబంధన సంబంధాన్ని నిలిపాం.
- source_word: וַיִּמְכֹּר
  choice: అమ్మివేశాడు
  rationale: מכר అక్షరార్థంగా ‘అమ్మడం.’ ఇక్కడ ప్రజలను శత్రువుల అధికారానికి అప్పగించే నిబంధన తీర్పు రూపకం; ప్రధాన పాఠ్యంలో ఆ రూపకాన్నే నిలిపి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: בְּיַד
  choice: చేతికి
  rationale: ‘చేతిలో/చేతికి’ అనే హీబ్రూ నుడికారం మరొకరి అధికారానికి అప్పగించబడటాన్ని సూచిస్తుంది. తెలుగులో ‘చేతికి’ సహజంగా ఉండి మూలచిత్రాన్ని కూడా కాపాడుతుంది.
- source_word: סִיסְרָא
  choice: సీసెరా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు ధ్వన్యంతరీకరణ.
- source_word: שַׂר צְבָא חָצוֹר
  choice: హాసోరు సైన్యాధిపతి
  rationale: నిర్మాణ సంబంధాన్ని సహజ తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తూ, హాసోరు సైన్యానికి అధిపతి అనే అర్థాన్ని ఇస్తుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ప్రజానామానికి ప్రాచుర్యంలో ఉన్న తెలుగు రూపం.
- source_word: מֶלֶךְ מוֹאָב
  choice: మోయాబు రాజు
  rationale: హీబ్రూ నిర్మాణ శ్రేణిని సహజ తెలుగులో నేరుగా అందిస్తుంది.
- source_word: וַיִּלָּחֲמוּ בָם
  choice: వారు వారిపై యుద్ధం చేశారు
  rationale: బహువచన కర్త తాజాగా పేర్కొన్న అణచివేసిన శక్తులను, కర్మ ఇశ్రాయేలీయులను సూచిస్తుంది. మూలంలోని సర్వనామాలను అలాగే ఉంచి, לחם ב యొక్క విరోధార్థాన్ని ‘వారిపై యుద్ధం చేశారు’గా ఇచ్చాం.
theological_decisions:
- issue: ‘అమ్మివేశాడు’ అనే క్రియకు కర్త
  choice: అవ్యక్తంగా ఉన్న ఏకవచన కర్త యాహ్వే
  alternative: 'కర్తను చెప్పని కర్మణి రూపం: ‘వారు అమ్మివేయబడ్డారు’'
  rationale: ముందటి ఉపవాక్యంలో ‘వారి దేవుడైన యాహ్వే’ అని ఉంది; తరువాతి ఏకవచన క్రియ సహజంగా ఆయన్నే కర్తగా కొనసాగిస్తుంది. దేవుడు ఇశ్రాయేలును తీర్పుగా శత్రువుల అధికారానికి అప్పగించాడనే న్యాయాధిపతులు–సమూయేలు గ్రంథాల నమూనాకూ ఇది సరిపోతుంది.
- issue: ‘యాహ్వేను మరచిపోయారు’ అనే మాటలోని భావబలం
  choice: నిబంధన సంబంధ అవిశ్వాసాన్ని సూచించగల అక్షరార్థమైన ‘మరచిపోయారు’
  alternative: ‘యాహ్వేను విడిచిపెట్టారు’ లేదా ‘ఆయనను నిర్లక్ష్యం చేశారు’
  rationale: సందర్భంలో ఈ క్రియకు విశ్వాసద్రోహ భావఛాయ ఉండవచ్చు; అయినా హీబ్రూ పాఠం ‘మరచిపోయారు’ అనే మాటనే వాడుతుంది. మరింత బలమైన వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
- issue: చివరి బహువచన కర్త యొక్క సూచన
  choice: సీసెరా, ఫిలిష్తీయులు, మోయాబు రాజు అనే అణచివేసిన శక్తులు
  alternative: సర్వనామ సంబంధాన్ని పూర్తిగా స్పష్టీకరించి ‘ఆ శత్రువులు ఇశ్రాయేలీయులపై’ అని అనువదించడం
  rationale: హీబ్రూలో బహువచన క్రియ తాజాగా పేర్కొన్న శక్తులను సహజంగా సూచిస్తుంది; ‘వారిపై’ అనే కర్మ ఇశ్రాయేలీయులను సూచిస్తుంది. ప్రధాన పాఠ్యంలో పేర్లను మళ్లీ చేర్చి మూలం కంటే ఎక్కువ స్పష్టీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడాం. ‘యాహ్వే’ ద్వారా వ్యక్తిగత దైవనామాన్ని నిలిపాం; ‘చేతికి,’ ‘అమ్మివేశాడు’ వంటి మూలచిత్రాలను అర్థవంతంగా కాపాడాం. చివరి సర్వనామాల విషయంలో మూలంలోని సూచన సంబంధాన్ని అతిగా వివరణాత్మకం చేయకుండా ఉంచాం.
