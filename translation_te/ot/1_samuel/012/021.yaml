  yaml_path: translation/ot/1_samuel/012/021.yaml
  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
translation:
  language: te
  text: పనికిరాని వాటి వెంట[a] తిరగకండి. అవి మీకు మేలు చేయలేవు, మిమ్మల్ని విడిపించలేవు[b], ఎందుకంటే అవి పనికిరానివే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పనికిరాని వాటి’ అనే మాటకు ‘శూన్యమైన వాటి,’ ‘వ్యర్థమైన వాటి’ లేదా సందర్భానుసారంగా ‘విగ్రహాల’ అని కూడా అర్థం కావచ్చు. హెబ్రీ పదం శూన్యత, నిస్సారత లేదా వ్యర్థతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘రక్షించలేవు’ లేదా ‘కాపాడలేవు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  choice: దారి తొలగకండి
  rationale: סור అనే క్రియ సరైన మార్గం లేదా విధేయత నుంచి పక్కకు తొలగడాన్ని సూచిస్తుంది; ఒడంబడిక సంబంధ హెచ్చరికలోని మార్గ రూపకాన్ని ఈ పదబంధం నిలుపుతుంది.
- source_word: אַחֲרֵי
  choice: అనుసరిస్తూ
  rationale: మూలార్థం ‘వెనుక/తరువాత’; ఇక్కడ ఏదో ఒకదాని వెంట వెళ్లడం లేదా దానిని ఆశ్రయించడం అనే భావం సహజమైన తెలుగులో వ్యక్తమవుతుంది.
- source_word: הַתֹּהוּ / תֹהוּ
  choice: పనికిరాని వాటిని / పనికిరానివే
  rationale: תֹהוּ శూన్యత, వ్యర్థత, నిస్సారత అనే విస్తృత భావాలను కలిగి ఉంది. సందర్భంలో ప్రయోజనం చేయలేని తప్పుడు ఆశ్రయాలను సూచిస్తుంది; విగ్రహాలు అని మరీ నిర్దిష్టం చేయకుండా మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא יוֹעִילוּ
  choice: అవి మీకు మేలు చేయలేవు
  rationale: ఈ క్రియ ప్రయోజనం లేదా లాభం కలిగించడాన్ని సూచిస్తుంది. సందర్భంలోని ప్రజలపట్ల దాని సంబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘మీకు’ చేర్చబడింది.
- source_word: וְלֹא יַצִּילוּ
  choice: మిమ్మల్ని విడిపించలేవు
  rationale: Hiphil రూపంలోని נצל ఆపద నుంచి విడిపించడం లేదా రక్షించడాన్ని సూచిస్తుంది. ‘విడిపించు’ ఇక్కడి కార్యసామర్థ్య భావాన్ని నిలుపుతూ తరువాతి సిద్ధాంతార్థాన్ని అనవసరంగా రుద్దదు.
- source_word: הֵמָּה
  choice: అవి
  rationale: పుంలింగ బహువచన సర్వనామం ముందున్న పనికిరాని వాటిని తిరిగి సూచిస్తుంది; తెలుగులో ‘అవి’ సహజం.
theological_decisions:
- issue: ‘పనికిరాని వాటి’ నిర్దిష్ట సూచన
  choice: విగ్రహాలు లేదా తప్పుడు ఆశ్రయాలు కావచ్చనే భావాన్ని అనువాదంలో నిర్దిష్టం చేయకుండా ‘పనికిరాని వాటిని’ అని ఉంచడం
  alternative: విగ్రహాలు; వ్యర్థమైనవి; శూన్యమైనవి
  rationale: సందర్భం యెహోవాను విడిచి సహాయం చేయలేని వాటిని అనుసరించడాన్ని గూర్చినప్పటికీ, హెబ్రీ పదం విగ్రహాలకు ప్రత్యేకమైన పదం కాదు. అందువల్ల మూలంలోని విస్తృతి, ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన హెచ్చరిక స్వరాన్ని నిలుపుతూ రూపొందించబడింది. మూలంలోని ‘తిరిగి వెళ్లడం’ అనే కదలిక రూపకానికి ‘దారి తొలగడం’ ఉపయోగించబడింది; תֹהוּ పదంలోని పునరుక్తి ‘పనికిరాని’ అనే పదాన్ని రెండుసార్లు వాడి నిలుపబడింది.
