id: 1SA.12.8
reference: 1 Samuel 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּֽ/אֲשֶׁר בָּ֥א יַעֲקֹ֖ב מִצְרָ֑יִם וַ/יִּזְעֲק֤וּ אֲבֽוֹתֵי/כֶם֙ אֶל יְהוָ֔ה וַ/יִּשְׁלַ֨ח יְהוָ֜ה אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֗ן וַ/יּוֹצִ֤יאוּ אֶת אֲבֹֽתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/יֹּשִׁב֖וּ/ם בַּ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
translation:
  language: te
  text: యాకోబు ఐగుప్తుకు వచ్చినప్పుడు, మీ పూర్వీకులు యాహ్వేకు మొరపెట్టుకున్నారు. అప్పుడు యాహ్వే మోషేను, అహరోనును పంపాడు. వారు మీ పూర్వీకులను ఐగుప్తు నుండి బయటికి తీసుకొచ్చి, ఈ స్థలంలో నివసింపజేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “వారిని ఈ స్థలంలో స్థిరపరిచారు,” లేదా “వారిని ఇక్కడ నివసించేలా చేశారు.”'
    reason: וַיֹּשִׁבוּם అనే కారణార్థక క్రియకు తెలుగులో సాధ్యమైన సమానార్థక వ్యక్తీకరణలను చూపుతుంది.
lexical_decisions:
- source_word: כַּאֲשֶׁר בָּא
  choice: వచ్చినప్పుడు
  rationale: ఈ సందర్భంలో כַּאֲשֶׁר కాలసంబంధ ఉపవాక్యాన్ని ప్రవేశపెడుతుంది; సహజమైన ఆధునిక తెలుగులో ‘వచ్చినప్పుడు’ మూల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲבוֹתֵיכֶם
  choice: మీ పూర్వీకులు
  rationale: అక్షరార్థంగా ‘మీ తండ్రులు’; ఇక్కడ పూర్వ తరాల ఇశ్రాయేలీయులను సూచిస్తున్నందున ‘మీ పూర్వీకులు’ ఆధునిక పాఠకులకు సహజంగా, సందర్భానికి కచ్చితంగా ఉంటుంది.
- source_word: וַיִּזְעֲקוּ
  choice: మొరపెట్టుకున్నారు
  rationale: זעק ఆపదలో సహాయం కోరుతూ చేసే తీవ్రమైన మొరను సూచిస్తుంది; ‘మొరపెట్టుకున్నారు’ ఆ విజ్ఞాపనాత్మక తీవ్రతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: మోషే, అహరోనులను దేవుడు నియోగించి పంపిన సాధారణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיּוֹצִיאוּ
  choice: బయటికి తీసుకొచ్చి
  rationale: హిఫిల్ రూపంలోని ‘బయటకు రప్పించడం/తీసుకురావడం’ అనే కారణార్థక భావాన్ని నిలుపుతుంది; బహువచన కర్త మోషే, అహరోనులను సూచిస్తుంది.
- source_word: וַיֹּשִׁבוּם
  choice: నివసింపజేశారు
  rationale: ישׁב యొక్క కారణార్థక రూపం ‘వారిని నివసించేలా చేయడం’ అనే భావాన్ని ఇస్తుంది; తెలుగు రూపం ఆ కారణార్థకతను స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దేవుని ప్రత్యేక ఒడంబడిక నామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, ‘యెహోవా’ అనే తరువాతి మిశ్రిత ఉచ్చారణను అనుసరించకుండా ప్రతిబింబిస్తుంది.
- issue: మోషే, అహరోనుల కార్యసాధక పాత్ర
  choice: వారు ... బయటికి తీసుకొచ్చి ... నివసింపజేశారు
  alternative: యాహ్వే వారి ద్వారా ... తీసుకొచ్చాడు
  rationale: మూలంలోని క్రియలు బహువచనంలో ఉండి వ్యాకరణపరంగా మోషే, అహరోనులను కర్తలుగా చూపుతాయి. దేవుడే అంతిమ విమోచకుడు అనే విస్తృత సందర్భాన్ని తిరస్కరించకుండానే వాక్యంలోని మానవ కార్యసాధకత్వాన్ని అలాగే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘పితరులు’ కంటే సామాన్య పాఠకులకు సహజమైన ‘పూర్వీకులు’ను ఎంచుకుంది. హీబ్రూ కథనంలోని వరుస వావ్-క్రియలను తెలుగులో చిన్న వాక్యాలుగా విభజించి ప్రవాహాన్ని మెరుగుపరిచింది; భావక్రమం మాత్రం యథాతథంగా ఉంది.
