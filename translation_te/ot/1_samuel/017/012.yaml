translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. కఠినమైన చివరి హీబ్రూ నానుడికి సందర్భోచిత ప్రధాన అనువాదం ఇచ్చి, మూలంలోని అసాధారణతను పాదసూచికలో భద్రపరిచాం.
