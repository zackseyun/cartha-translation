source:
  edition: WLC
  text: וְ/דָוִד֩ בֶּן אִ֨ישׁ אֶפְרָתִ֜י הַ/זֶּ֗ה מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה וּ/שְׁמ֣/וֹ יִשַׁ֔י וְ/ל֖/וֹ שְׁמֹנָ֣ה בָנִ֑ים וְ/הָ/אִישׁ֙ בִּ/ימֵ֣י שָׁא֔וּל זָקֵ֖ן בָּ֥א בַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
translation:
  language: te
  text: దావీదు యూదాలోని బేత్లెహేముకు చెందిన ఎఫ్రాతీయుడైన ఒక మనిషి కుమారుడు. ఆ మనిషి పేరు యెష్షయి; అతనికి ఎనిమిది మంది కుమారులు. సౌలు కాలంలో ఆ మనిషి వృద్ధుడు, వయసులో బాగా ముదిరినవాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ హీబ్రూ మాట అసాధారణంగా ఉంది; అక్షరాలా, “మనుష్యుల మధ్యకు వచ్చినవాడు” అని ఉంటుంది. సందర్భంలో ఇది అతడు వయసులో బాగా ముదిరినవాడని సూచిస్తున్నట్లు సాధారణంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: ఎఫ్రాతీయుడు
  rationale: యూదాలోని బేత్లెహేముతో ఉన్న సందర్భ సంబంధాన్ని బట్టి ఇది ఎఫ్రాతా/బేత్లెహేముకు చెందిన వ్యక్తిని సూచిస్తుంది; ‘ఎఫ్రాయిమీయుడు’ అనే గోత్రార్థాన్ని ఇక్కడ తీసుకోలేదు.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: యూదాలోని బేత్లెహేముకు చెందిన
  rationale: స్థల సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, మరో బేత్లెహేము నుండి ఈ ఊరిని వేరుచేస్తుంది.
- source_word: וּשְׁמוֹ יִשַׁי
  choice: అతని పేరు యెష్షయి
  rationale: హీబ్రూ సమన్వయ నిర్మాణాన్ని స్పష్టమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: וְלוֹ שְׁמֹנָה בָנִים
  choice: అతనికి ఎనిమిది మంది కుమారులు
  rationale: హీబ్రూ స్వామ్య నిర్మాణానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: בִּימֵי שָׁאוּל
  choice: సౌలు కాలంలో
  rationale: కాలాన్ని సూచించే హీబ్రూ నానుడికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: זָקֵן
  choice: ముసలివాడై
  rationale: వ్యక్తి వృద్ధాప్యాన్ని నేరుగా సూచిస్తుంది; తరువాతి కఠినమైన నానుడితో సహజంగా కలుస్తుంది.
- source_word: בָּא בַאֲנָשִׁים
  choice: వయసు బాగా ముదిరినవాడు
  rationale: అసాధారణమైన హీబ్రూ నానుడి సందర్భార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది; దాని అక్షరార్థపు అస్పష్టతను పాదసూచికలో నిలిపింది.
- source_word: וְהָאִישׁ
  choice: ఆ మనిషి
  rationale: ఇది యెష్షయిని తిరిగి సూచిస్తుంది; హీబ్రూలోని నామవాచక పునరుక్తిని నిలుపుతుంది.
