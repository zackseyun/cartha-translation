revisions:
- from: దావీదు యూదాలోని బేత్లెహేముకు చెందిన ఎఫ్రాతీయుడైన ఒక మనిషి కుమారుడు. అతని పేరు యెష్షయి; అతనికి ఎనిమిది మంది కుమారులు. సౌలు కాలంలో ఆ మనిషి ముసలివాడై, వయసు బాగా ముదిరినవాడు[a].
  to: దావీదు యూదాలోని బేత్లెహేముకు చెందిన ఎఫ్రాతీయుడైన ఒక మనిషి కుమారుడు. ఆ మనిషి పేరు యెష్షయి; అతనికి ఎనిమిది మంది కుమారులు. సౌలు కాలంలో ఆ మనిషి వృద్ధుడు, వయసులో బాగా ముదిరినవాడు[a].
