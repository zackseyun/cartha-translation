source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע שָׁאוּל֙ וְ/כָל יִשְׂרָאֵ֔ל אֶת דִּבְרֵ֥י הַ/פְּלִשְׁתִּ֖י הָ/אֵ֑לֶּה וַ/יֵּחַ֥תּוּ וַ/יִּֽרְא֖וּ מְאֹֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/011.yaml
  text: When Saul and all Israel heard these words of the Philistine[a], they were dismayed and greatly afraid.
translation:
  language: te
  text: సౌలు, ఇశ్రాయేలీయులందరూ ఆ ఫిలిష్తీయుడు పలికిన ఈ మాటలు విన్నప్పుడు, ధైర్యం కోల్పోయి[a] ఎంతో భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘హతాశులయ్యారు’ లేదా అక్షరార్థానికి దగ్గరగా ‘కృంగిపోయారు’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియ మనోధైర్యం కూలిపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నప్పుడు
  rationale: שׁמע అనే క్రియకు ఇక్కడ సాధారణ అర్థం ‘వినడం.’ వరుసగా జరిగిన చర్యలను తెలుగులో సహజంగా అనుసంధానించడానికి కాలసూచక క్రియారూపం వాడబడింది.
- source_word: שָׁאוּל וְכָל יִשְׂרָאֵל
  choice: సౌలు, ఇశ్రాయేలీయులందరూ
  rationale: ‘ఇశ్రాయేలు అంతా’ అనే సమూహవాచక భావాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఇశ్రాయేలీయులందరూ’ అని వ్యక్తం చేస్తుంది; సందర్భంలో ఇది అక్కడున్న ఇశ్రాయేలు సైన్యాన్ని సమష్టిగా సూచిస్తుంది.
- source_word: דִּבְרֵי הַפְּלִשְׁתִּי הָאֵלֶּה
  choice: ఆ ఫిలిష్తీయుడు పలికిన ఈ మాటలు
  rationale: నిర్దిష్టంగా ముందే ప్రస్తావించబడిన ఫిలిష్తీయుణ్ణి సూచించే article భావాన్ని ‘ఆ’ తెలియజేస్తుంది. Construct phrase ను సహజమైన తెలుగు సంబంధ వాక్యంగా మార్చినా ‘ఈ మాటలు’ అనే demonstrative భావం నిలిచింది.
- source_word: וַיֵּחַתּוּ
  choice: ధైర్యం కోల్పోయి
  rationale: חתת ఇక్కడ మనోధైర్యం కూలిపోవడం, దిగులుచెందడం అనే ఫలితస్థితిని సూచిస్తుంది. ‘ధైర్యం కోల్పోయి’ అనేది తరువాతి ‘భయపడ్డారు’తో అనవసర పునరుక్తి రాకుండా, మూలంలోని బలమైన భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: וַיִּירְאוּ מְאֹד
  choice: ఎంతో భయపడ్డారు
  rationale: ירא కు ‘భయపడడం,’ מְאֹד కు తీవ్రతను తెలిపే ‘ఎంతో’ అనే సహజ తెలుగు సమానార్థాలు ఎంచుకోబడ్డాయి.
