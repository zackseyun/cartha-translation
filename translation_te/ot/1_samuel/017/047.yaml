base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
translation:
  language: te
  text: ఈ సమూహమంతా, యాహ్వే కత్తితో గానీ ఈటెతో గానీ రక్షించడని తెలుసుకుంటుంది[a]. ఎందుకంటే యుద్ధం యాహ్వేదే[b]; ఆయన మిమ్మల్ని మా చేతికి అప్పగిస్తాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘కత్తితోను ఈటెతోను విడిపించడని.’'
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ అక్షరార్థం: ‘యుద్ధం యాహ్వేది.’'
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ అక్షరార్థం: ‘మా చేతికి ఇస్తాడు’; అంటే ‘మా అధికారానికి అప్పగిస్తాడు.’'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: తెలుసుకుంటుంది
  rationale: ידע యొక్క Qal imperfect ఇక్కడ దావీదు పలికిన భవిష్యత్ ఫలితాన్ని సూచిస్తుంది. ‘తెలుసుకుంటుంది’ అనేది ఆ సభ ఒక సత్యాన్ని గ్రహించబోతుందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: ఈ సభ అంతా
  rationale: קהל ఇక్కడ యుద్ధస్థలంలో కూడిన ప్రజాసమూహాన్ని సూచిస్తుంది. ‘సభ’ గౌరవప్రదంగా, మతసంఘార్థాన్ని అనవసరంగా రుద్దకుండా మూలభావాన్ని అందిస్తుంది.
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית
  choice: కత్తితోనో ఈటెతోనో ... కాదని
  rationale: בְ ఆయుధాలను సాధనాలుగా చూపుతుంది. నిషేధ వాక్యంలో ‘తోనో ... తోనో’ సహజ తెలుగు ప్రయోగం; ఇది కత్తి, ఈటె అనే జతను నిలుపుతుంది.
- source_word: יְהוֹשִׁיעַ
  choice: రక్షించడు
  rationale: ישׁע యొక్క Hiphil రూపం రక్షించడం లేదా విడిపించడం అనే భావాన్ని ఇస్తుంది. సైనిక సందర్భానికి సరిపోతూనే పదంలోని విస్తృత రక్షణ భావాన్ని ‘రక్షించడు’ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’గా ఇచ్చాం.
- source_word: כִּי לַיהוָה הַמִּלְחָמָה
  choice: ఎందుకంటే యుద్ధం యాహ్వేదే
  rationale: రెండవ כִּי కారణాన్ని పరిచయం చేస్తుంది; לַיהוָה స్వామ్యాన్ని సూచిస్తుంది. ‘యుద్ధం యాహ్వేదే’ హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: הַמִּלְחָמָה
  choice: యుద్ధం
  rationale: ఈ సందర్భంలో מִלְחָמָה మొత్తం పోరాటాన్ని సూచిస్తుంది. ‘యుద్ధం’ ఆధునిక తెలుగులో స్పష్టమైన, సాధారణ పదం.
- source_word: וְנָתַן
  choice: అప్పగిస్తాడు
  rationale: రూపపరంగా qatal అయినా, భవిష్యత్ ఫలితాన్ని ప్రకటించే ఈ ప్రసంగ సందర్భంలో ఇది ముందుగా నిశ్చయంగా చెప్పబడిన చర్య. ‘అప్పగిస్తాడు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֶתְכֶם בְּיָדֵנוּ
  choice: మిమ్మల్ని మా చేతికి
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ నుడికారం ఒకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. ఏకవచన ‘మా చేతికి’ మూలరూపాన్ని నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను వాడటం మూలానికి నేరుగా నిబద్ధంగా ఉంటుంది.
- issue: సైనిక సందర్భంలో יְהוֹשִׁיעַ భావపరిధి
  choice: రక్షించడు
  alternative: విడిపించడు / విజయం ఇస్తాడు
  rationale: సందర్భం యుద్ధానికి సంబంధించినదైనా, క్రియ కేవలం విజయాన్ని ఇవ్వడం కంటే విస్తృతమైన రక్షణ భావాన్ని కలిగి ఉంది. ‘రక్షించడు’ ఆ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని ప్రకటనాత్మక బలం, యుద్ధసందర్భం, దైవనామం, ‘చేతిలో ఇవ్వడం’ అనే నుడికారం నిలుపబడ్డాయి.
