  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי קָ֣ם הַ/פְּלִשְׁתִּ֔י וַ/יֵּ֥לֶךְ וַ/יִּקְרַ֖ב לִ/קְרַ֣את דָּוִ֑ד וַ/יְמַהֵ֣ר דָּוִ֔ד וַ/יָּ֥רָץ הַ/מַּעֲרָכָ֖ה לִ/קְרַ֥את הַ/פְּלִשְׁתִּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/048.yaml
  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
translation:
  language: te
  text: ఫిలిష్తీయుడు లేచి దావీదును ఎదుర్కోవడానికి ముందుకు వచ్చి సమీపించినప్పుడు, దావీదు త్వరపడి ఫిలిష్తీయుణ్ణి ఎదుర్కోవడానికి యుద్ధశ్రేణి వైపు పరుగెత్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సైనిక పంక్తుల వైపు.” హీబ్రూ నామవాచకం యుద్ధశ్రేణిని లేదా యుద్ధానికి అమర్చిన సైనిక పంక్తులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …చేసినప్పుడు
  rationale: హీబ్రూ కథన సూత్రంలోని కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ‘అప్పుడు ఇలా జరిగింది’ అనే బరువైన పదబంధాన్ని నివారిస్తుంది.
- source_word: קָם
  choice: లేచి
  rationale: లేవడం లేదా కార్యానికి సిద్ధంగా నిలబడడం అనే మూలభావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הַפְּלִשְׁתִּי
  choice: ఫిలిష్తీయుడు
  rationale: మూలపాఠం కేవలం ‘ఫిలిష్తీయుడు’ అని చెబుతుంది; ‘వీరుడు’ లేదా ‘యోధుడు’ అని సందర్భార్థాన్ని అదనంగా చేర్చలేదు.
- source_word: וַיֵּלֶךְ וַיִּקְרַב
  choice: ముందుకు వచ్చి సమీపించినప్పుడు
  rationale: వరుసగా ఉన్న కదలికలను—వచ్చడం/సాగడం, దగ్గరకు రావడం—సహజమైన తెలుగులో వేర్వేరుగా నిలుపుతుంది.
- source_word: לִקְרַאת
  choice: ఎదుర్కోవడానికి
  rationale: రెండు పక్షాలు పోరాటంలో ఒకరినొకరు ఎదుర్కొనే సందర్భానికి తగిన దిశా-సమాగమ భావాన్ని ఇస్తుంది; రెండు occurrencesలోనూ ఒకే విధంగా అనువదించబడింది.
- source_word: וַיְמַהֵר
  choice: త్వరపడి
  rationale: వేగంగా చర్య తీసుకున్నాడనే భావాన్ని ఆధునిక, సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיָּרָץ
  choice: పరుగెత్తాడు
  rationale: క్రియ యొక్క నేరమైన అర్థాన్ని నిలుపుతుంది; ‘దూసుకెళ్లాడు’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: הַמַּעֲרָכָה
  choice: యుద్ధశ్రేణి వైపు
  rationale: ఈ నామవాచకం సైనికుల యుద్ధశ్రేణి లేదా యుద్ధవ్యవస్థను సూచించగలదు. సందర్భంలో దావీదు పోరాటం జరిగే శ్రేణి దిశగా పరుగెత్తుతున్న భావాన్ని అందిస్తుంది.
