translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వేగవంతమైన వరుస కదలికలను నిలుపుతూ, అనవసరమైన సందర్భ విస్తరణను నివారించాం. ఫుట్‌నోట్ సూచిక ప్రధాన వాక్యంలోని సంబంధిత పదబంధం తరువాత ఉంచబడింది.
