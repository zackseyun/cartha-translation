id: 1SA.17.55
reference: 1 Samuel 17:55
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִ/רְא֨וֹת שָׁא֜וּל אֶת דָּוִ֗ד יֹצֵא֙ לִ/קְרַ֣את הַ/פְּלִשְׁתִּ֔י אָמַ֗ר אֶל אַבְנֵר֙ שַׂ֣ר הַ/צָּבָ֔א בֶּן מִי זֶ֥ה הַ/נַּ֖עַר אַבְנֵ֑ר וַ/יֹּ֣אמֶר אַבְנֵ֔ר חֵֽי נַפְשְׁ/ךָ֥ הַ/מֶּ֖לֶךְ אִם יָדָֽעְתִּי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
translation:
  language: te
  text: సౌలు దావీదు ఆ ఫిలిష్తీయుణ్ణి ఎదుర్కోవడానికి బయలుదేరడం చూసినప్పుడు, సైన్యాధిపతి అబ్నేరుతో, “అబ్నేరూ, ఈ యువకుడు ఎవరి కుమారుడు?” అని అడిగాడు. అబ్నేరు, “రాజా, మీ ప్రాణం తోడు[a], నాకు తెలియదు” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ ప్రమాణ వాక్యం అక్షరార్థంగా, “మీ ప్రాణం జీవిస్తున్నంత నిజంగా” అని ఉంటుంది; భావం, “మీరు జీవించడం ఎంత నిశ్చయమో అంత నిశ్చయంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִ/רְאוֹת
  choice: చూసినప్పుడు
  rationale: సంయోజక అవ్యయంతో కూడిన infinitive construct కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘చూసినప్పుడు’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: יֹצֵא לִקְרַאת
  choice: ఎదుర్కోవడానికి బయలుదేరడం
  rationale: יֹצֵא దావీదు బయటకు వెళ్తున్న చర్యను, לִקְרַאת అతడు ఫిలిష్తీయుని వైపు ముఖాముఖిగా వెళ్తున్న ఉద్దేశాన్ని సూచిస్తాయి. యుద్ధ సందర్భంలో ‘ఎదుర్కోవడానికి’ సహజమైనదే గాని ఫలితాన్ని ముందుగానే జోడించదు.
- source_word: הַפְּלִשְׁתִּי
  choice: ఆ ఫిలిష్తీయుణ్ణి
  rationale: మూలంలో విశేషణాత్మక జాతినామం ఏకవచన నిర్దిష్ట రూపంలో ఉంది. సందర్భంలో ముందే తెలిసిన వ్యక్తిని సూచించేందుకు ‘ఆ’ వాడబడింది; మూలంలో లేని ‘వీరుడు’ వంటి బిరుదు చేర్చలేదు.
- source_word: שַׂר הַצָּבָא
  choice: సైన్యాధిపతి
  rationale: ఇది సైన్యంపై అధికారమున్న నాయకుని అధికారిక హోదా; ‘సైన్యాధిపతి’ సంక్షిప్తమైన, ప్రస్తుత ప్రామాణిక తెలుగు పదం.
- source_word: בֶּן מִי זֶה הַנַּעַר
  choice: ఈ యువకుడు ఎవరి కుమారుడు?
  rationale: హీబ్రూ పదక్రమాన్ని సహజ తెలుగు ప్రశ్నారూపంలో మార్చినా ‘ఎవరి కుమారుడు’ అనే వంశ/కుటుంబ గుర్తింపు ప్రశ్నను యథాతథంగా నిలిపింది. נַעַר కు ఈ సందర్భంలో ‘బాలుడు’ కంటే ‘యువకుడు’ తగినది.
- source_word: חֵי נַפְשְׁךָ
  choice: మీ ప్రాణం తోడు
  rationale: సంబోధించబడిన వ్యక్తి ప్రాణాన్ని సాక్షిగా ఉంచే హీబ్రూ ప్రమాణ సూత్రాన్ని, తెలుగులో అర్థమయ్యే గంభీరమైన ప్రమాణ ప్రయోగంగా అందించింది; దాని మరింత అక్షరార్థ వివరణను పాదసూచికలో ఇచ్చింది.
- source_word: אִם יָדָעְתִּי
  choice: నాకు తెలియదు
  rationale: ప్రమాణ సందర్భంలో אִם తో వచ్చిన ఈ అసంపూర్ణ షరతు వాక్యం బలమైన నిరాకరణను వ్యక్తం చేస్తుంది. అక్షరార్థంగా ‘నాకు తెలిసి ఉంటే’ అనడం తెలుగులో అపూర్ణంగా, అస్పష్టంగా ఉంటుంది కాబట్టి ఉద్దేశిత భావాన్ని సహజంగా తెలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. రాజును ఉద్దేశించిన మాటలో గౌరవ బహువచనం వాడబడింది. ‘ఫిలిష్తీయుడు,’ ‘సైన్యాధిపతి,’ ‘యువకుడు’ వంటి సాధారణంగా అర్థమయ్యే పదాలు ఎంచుకోబడ్డాయి; మూలంలో లేని వివరణాత్మక బిరుదులు చేర్చలేదు.
