  to: 'దావీదు తనతో నిలబడి ఉన్న మనుషులతో ఇలా అన్నాడు: “ఈ ఫిలిష్తీయుణ్ణి హతమార్చి ఇశ్రాయేలుకు కలిగిన అవమానాన్ని తొలగించే వ్యక్తికి ఏమి చేయబడుతుంది? సజీవుడైన దేవుని యుద్ధపంక్తులను ధిక్కరించిన ఈ సున్నతిలేని ఫిలిష్తీయుడు అసలు ఎవడు?”'
  rationale: Only the rendering of מַעַרְכוֹת is revised, from a term that can mean military strategies to one denoting battle lines. No footnotes are required, and the translation preserves the source’s historical and covenantal language without interpretive expansion.
