  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶֽל הָ/אֲנָשִׁ֞ים הָ/עֹמְדִ֣ים עִמּ/וֹ֮ לֵ/אמֹר֒ מַה יֵּעָשֶׂ֗ה לָ/אִישׁ֙ אֲשֶׁ֤ר יַכֶּה֙ אֶת הַ/פְּלִשְׁתִּ֣י הַלָּ֔ז וְ/הֵסִ֥יר חֶרְפָּ֖ה מֵ/עַ֣ל יִשְׂרָאֵ֑ל כִּ֣י מִ֗י הַ/פְּלִשְׁתִּ֤י הֶֽ/עָרֵל֙ הַ/זֶּ֔ה כִּ֣י חֵרֵ֔ף מַעַרְכ֖וֹת אֱלֹהִ֥ים חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: te
  text: 'దావీదు తనతో నిలబడి ఉన్న మనుషులతో ఇలా అన్నాడు: “ఈ ఫిలిష్తీయుణ్ణి హతమార్చి ఇశ్రాయేలుకు కలిగిన అవమానాన్ని తొలగించే వ్యక్తికి ఏమి చేయబడుతుంది? సజీవుడైన దేవుని యుద్ధపంక్తులను ధిక్కరించిన ఈ సున్నతిలేని ఫిలిష్తీయుడు అసలు ఎవడు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַכֶּה
  choice: హతమార్చి
  rationale: ఈ యుద్ధ సందర్భంలో హీబ్రూ క్రియ కేవలం కొట్టడం కాకుండా ప్రత్యర్థిని సంహరించడం అనే అర్థాన్ని ఇస్తుంది.
- source_word: חֶרְפָּה
  choice: అవమానం
  rationale: ఇశ్రాయేలుపై మోపబడిన నింద, అపకీర్తి అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מַעַרְכוֹת
  choice: సైన్యవ్యూహాలు
  rationale: ఈ బహువచన పదం యుద్ధానికి అమర్చబడిన సైనిక వరుసలు లేదా దళాలను సూచిస్తుంది; ‘సైన్యవ్యూహాలు’ మూలంలోని యుద్ధ అమరిక భావాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים חַיִּים
  choice: సజీవుడైన దేవుడు
  rationale: ‘జీవముగల దేవుడు’ అనే హీబ్రూ బిరుదును సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: הֶעָרֵל
  choice: సున్నతిలేని
  rationale: ఒడంబడిక గుర్తు లేనివాడనే మూలంలోని ప్రత్యక్ష శారీరక-మతపరమైన విశేషణాన్ని వ్యాఖ్యానించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘సున్నతిలేని’ అనే వర్ణనలోని ఒడంబడిక సంబంధిత ఉద్రిక్తత
  choice: సున్నతిలేని ఫిలిష్తీయుడు
  alternative: ఒడంబడికకు వెలుపల ఉన్న ఫిలిష్తీయుడు
  rationale: మూలంలోని స్పష్టమైన పదాన్ని రూపకాల వ్యాఖ్యానంతో భర్తీ చేయకుండా ఉంచడం ద్వారా దాని చారిత్రక, శారీరక, ధార్మిక పార్శ్వాలన్నీ పాఠకునికి అందుబాటులో ఉంటాయి.
- issue: חֵרֵף క్రియ యొక్క కాలరూపం
  choice: ధిక్కరించిన
  alternative: ధిక్కరిస్తున్న
  rationale: హీబ్రూ సంపూర్ణ క్రియను పూర్తైన చర్యగా తెలుగులో సహజంగా ప్రతిబింబిస్తుంది; దాని కొనసాగుతున్న ప్రభావాన్ని సందర్భం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యుద్ధ వర్ణనకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని రెండు ప్రశ్నలు, దావీదు ఆగ్రహభరిత సవాలు, ఒడంబడిక సంబంధిత పదప్రయోగం నిలుపబడ్డాయి.
