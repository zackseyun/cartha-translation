  source_fidelity: దావీదు రాజుతో వినయపూర్వకంగా తనను ‘మీ సేవకుడు’గా పేర్కొనడం, తండ్రి గొర్రెలను కాస్తున్న గతకాలపు నిరంతర పని, అలాగే సింహం లేదా ఎలుగుబంటి మందలోనుండి ఒక జంతువును తీసుకుపోయే సందర్భం—అన్నీ హీబ్రూ మూలపాఠానికి నమ్మకంగా ఉన్నాయి. ‘వచ్చి … ఎత్తుకుపోయినప్పుడు’ అనే అసంపూర్ణ సందర్భనిర్మాణం తరువాతి వచనంలో కొనసాగే వాక్యానికి తగినది.
