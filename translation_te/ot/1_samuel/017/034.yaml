source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל רֹעֶ֨ה הָיָ֧ה עַבְדְּ/ךָ֛ לְ/אָבִ֖י/ו בַּ/צֹּ֑אן וּ/בָ֤א הָֽ/אֲרִי֙ וְ/אֶת הַ/דּ֔וֹב וְ/נָשָׂ֥א שֶׂ֖ה מֵ/הָ/עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/034.yaml
  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
translation:
  language: te
  text: దావీదు సౌలుతో, “మీ సేవకుడనైన నేను నా తండ్రి గొర్రెలను కాస్తూ ఉండేవాణ్ణి. ఒక సింహమైనా ఎలుగుబంటైనా[a] వచ్చి మందలోనుండి ఒక గొర్రెపిల్లను[b] ఎత్తుకుపోయినప్పుడు,” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “సింహం మరియు ఎలుగుబంటి.” హీబ్రూలో “మరియు” ఉంది; అయితే సింహంగానీ ఎలుగుబంటిగానీ—వాటిలో ఏదో ఒక మృగం వచ్చేదనే భావం ఇక్కడ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “గొర్రెపిల్ల” అనే పదాన్ని “ఒక గొర్రె” లేదా “మందలోని ఒక జంతువు” అని కూడా అనువదించవచ్చు; హీబ్రూ పదం చిన్న గొర్రె కంటే విస్తృతమైన అర్థాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה הָיָה
  choice: గొర్రెలను కాస్తూ ఉండేవాణ్ణి
  rationale: ఈ నిర్మాణం దావీదు గతంలో నిరంతరంగా చేసిన కాపరి పనిని సూచిస్తుంది. తెలుగులో వృత్తినామాన్ని విడిగా పునరుక్తి చేయకుండా ఈ రూపం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: עַבְדְּךָ
  choice: మీ సేవకుడనైన నేను
  rationale: రాజుతో మాట్లాడేటప్పుడు వినయాన్ని తెలిపే సంప్రదాయ స్వీయ సంబోధన ఇది; బానిసత్వాన్ని అనవసరంగా ముందుకు తేవకుండా గౌరవభావాన్ని నిలుపుతుంది.
- source_word: לְאָבִיו בַּצֹּאן
  choice: నా తండ్రి గొర్రెలను
  rationale: దావీదు తన తండ్రికి చెందిన మందను కాసేవాడనే సంబంధాన్ని సహజమైన తెలుగు వ్యక్తీకరణలో తెలియజేస్తుంది.
- source_word: וּבָא
  choice: వచ్చి … ఎత్తుకుపోయినప్పుడు
  rationale: గతంలో సంభవించే సాధారణ పరిస్థితిని తెలుగు సందర్భవాచక నిర్మాణంతో వ్యక్తం చేస్తుంది; తరువాతి వచనంలో కొనసాగే వాక్యప్రవాహాన్ని కూడా నిలుపుతుంది.
- source_word: הָאֲרִי וְאֶת הַדּוֹב
  choice: ఒక సింహమైనా ఎలుగుబంటైనా
  rationale: హీబ్రూలో ‘మరియు’ ఉన్నప్పటికీ ఏదో ఒక మృగం వచ్చేదనే పంపిణీ భావం సందర్భానికి సరిపోతుంది. ‘అయినా…అయినా’ తెలుగులో ఆ ప్రత్యామ్నాయ భావాన్ని సహజంగా ఇస్తుంది.
- source_word: וְנָשָׂא
  choice: ఎత్తుకుపోయినప్పుడు
  rationale: మృగం తన ఆహారాన్ని పట్టుకొని తీసుకుపోవడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שֶׂה
  choice: ఒక గొర్రెపిల్లను
  rationale: ఈ పదం మందలోని ఒక జంతువును, గొర్రెను లేదా మేకను విస్తృతంగా సూచించగలిగినా, ఈ మేత సందర్భంలో ‘గొర్రెపిల్ల’ సహజమైన అనువాదం; విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: מֵהָעֵדֶר
  choice: మందలోనుండి
  rationale: మందలోని ఒక జంతువును మృగం తీసుకుపోయిందనే మూలపాఠ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
