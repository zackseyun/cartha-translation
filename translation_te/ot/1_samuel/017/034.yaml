translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. రాజు ఎదుట దావీదు చూపిన వినయాన్ని ‘మీ సేవకుడనైన నేను’తో నిలిపాం. వచనం తరువాతి వాక్యంతో కొనసాగుతున్నందున ముగింపులో అసంపూర్ణ ఉద్ధరణ నిర్మాణాన్ని ఉంచాం.
