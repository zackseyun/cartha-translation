translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. రాజుతో దావీదు మాట్లాడే వినయాన్ని ‘మీ సేవకుడు’ నిలుపుతుంది; స్థలనామం ‘బేత్లెహేము’, వ్యక్తినామం ‘యెష్షయి’గా సాంప్రదాయ తెలుగు బైబిలు పరిచయాన్ని దృష్టిలో ఉంచి ఇచ్చాం.
