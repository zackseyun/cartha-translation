  yaml_path: translation/ot/1_samuel/017/058.yaml
  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
translation:
  language: te
  text: సౌలు అతనితో, “యువకుడా, నువ్వు ఎవరి కుమారుడివి?” అని అడిగాడు. దావీదు, “నేను బేత్లెహేమువాడైన మీ సేవకుడు యెష్షయి కుమారుణ్ణి[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “బేత్లెహేమువాడైన మీ సేవకుడు యెష్షయి కుమారుణ్ణి.” హీబ్రూ సమాధానంలో “నేను ...ను” అనే స్పష్టమైన క్రియ లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן מִי
  choice: ఎవరి కుమారుడివి
  rationale: హీబ్రూ నుడికారం తండ్రి వంశసంబంధాన్ని నేరుగా అడుగుతుంది. ‘ఎవరి కుమారుడివి’ అనేది ఆ దృష్టిని నిలుపుతూ సహజమైన ఆధునిక తెలుగు.
- source_word: הַנָּעַר
  choice: యువకుడా
  rationale: נַעַר సందర్భానుసారం బాలుడు, యువకుడు అనే అర్థాలు కలిగి ఉంటుంది. ఈ కథనంలో దావీదు యౌవనాన్ని సూచించడానికి ‘యువకుడా’ సముచితం.
- source_word: עַבְדְּךָ
  choice: మీ సేవకుడు
  rationale: ఇక్కడ ఈ పదం బానిసత్వ స్థితికన్నా రాజుతో వినయపూర్వకంగా మాట్లాడే సభామర్యాదను తెలియజేస్తుంది.
- source_word: בֵּית הַלַּחְמִי
  choice: బేత్లెహేమువాడైన
  rationale: హీబ్రూ జాతివాచక రూపం యెష్షయి స్వస్థలాన్ని సూచిస్తుంది. ‘బేత్లెహేమువాడైన’ తెలుగు వాక్యంలో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: అని అడిగాడు ... అని చెప్పాడు
  rationale: మూలంలో రెండుచోట్లా ‘చెప్పు’ అనే సాధారణ క్రియ ఉన్నా, మొదటి మాట ప్రశ్నగా పనిచేస్తుంది. సహజ తెలుగులో సంభాషణ పాత్రలను స్పష్టంగా చూపడానికి ‘అడిగాడు ... చెప్పాడు’ వాడబడింది.
- source_word: בֶּן עַבְדְּךָ יִשַׁי
  choice: నేను ... మీ సేవకుడు యెష్షయి కుమారుణ్ణి
  rationale: హీబ్రూలో ప్రత్యక్షంగా ‘నేను’ లేదా సంధానక్రియ లేదు; తెలుగులో పూర్తి, సహజ సమాధానం కోసం అంతర్లీనమైన ‘నేను ... కుమారుణ్ణి’ భావం వ్యక్తం చేయబడింది.
