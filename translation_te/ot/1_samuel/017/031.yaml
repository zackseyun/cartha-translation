translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైన కథనశైలి, గౌరవప్రదమైన పదప్రయోగం. హీబ్రూలో వినినవారు ఎవరో చెప్పనందున ‘వారు’ అనే అనిర్దిష్ట కర్తను అలాగే ఉంచాం. పాదసూచిక గుర్తును అది వివరించే చివరి క్రియ వద్ద ఉంచాం.
