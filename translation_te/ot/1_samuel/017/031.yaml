  yaml_path: translation/ot/1_samuel/017/031.yaml
  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
translation:
  language: te
  text: దావీదు చెప్పిన మాటలను వారు విని, వాటిని సౌలు ఎదుట తెలియజేశారు. అప్పుడు సౌలు అతన్ని రప్పించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అతడు అతన్ని తీసుకున్నాడు.” ఈ సందర్భంలో సౌలు దావీదును తన సమక్షానికి రప్పించాడని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ
  choice: వారు విని
  rationale: హీబ్రూ క్రియ బహువచన కర్తతో క్రియాశీల రూపంలో ఉంది. కర్త ఎవరో వాక్యంలో పేర్కొనబడలేదు; అందువల్ల తెలుగులో కూడా ‘వారు’ అని అనిర్దిష్టంగానే ఉంచబడింది.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבֶּר דָּוִד
  choice: దావీదు చెప్పిన మాటలను
  rationale: דברים ఇక్కడ దావీదు పలికిన మాటలను సూచిస్తుంది. ‘చెప్పిన మాటలు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని మాటల సందర్భాన్ని నిలుపుతుంది.
- source_word: וַיַּגִּדוּ
  choice: తెలియజేశారు
  rationale: נגד యొక్క ‘తెలియజేయడం, నివేదించడం’ అనే భావాన్ని సందర్భానుకూలంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי שָׁאוּל
  choice: సౌలు ఎదుట
  rationale: మూలంలోని ‘సౌలు సమక్షంలో/ఎదుట’ అనే ప్రాదేశిక-సభాసంబంధ వ్యక్తీకరణను నేరుగా నిలుపుతుంది.
- source_word: וַיִּקָּחֵהוּ
  choice: సౌలు అతన్ని రప్పించాడు
  rationale: לקח యొక్క ప్రాథమిక అర్థం ‘తీసుకొను’; అయితే రాజసభ సందర్భంలో సౌలు దావీదును తన సమక్షానికి రప్పించాడనే కారణార్థక భావం సహజంగా సరిపోతుంది. మూలంలోని మరింత అక్షరార్థ అవకాశాన్ని పాదసూచికలో ఉంచాం.
