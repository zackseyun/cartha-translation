translation:
  language: te
  text: అతని కాళ్లపై కంచు కాలి కవచాలు ఉన్నాయి; అతని భుజాల మధ్య కంచు బల్లెం[a] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కంచు ఈటె.’ హీబ్రూ పదం తేలికపాటి ఈటెవంటి ఆయుధాన్ని సూచించవచ్చు. కొందరు దీనిని మరొక రకమైన ఆయుధంగా కూడా అర్థం చేసుకున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְחַת
  choice: కాళ్ల కవచాలు
  rationale: ఈ పదం కాలి కింది భాగాన్ని కాపాడే జత కవచాలను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా ‘కాళ్ల కవచాలు’ అని అనువదించాం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ప్రాచీన యుద్ధ సామగ్రి సందర్భంలో ఈ పదం సాధారణంగా కంచును సూచిస్తుంది; ‘ఇత్తడి’ కాలవిరుద్ధంగా ఉండవచ్చు.
- source_word: עַל רַגְלָיו
  choice: అతని కాళ్లకు
  rationale: కాళ్ల కవచాల సందర్భంలో רֶגֶל పాదాలను మాత్రమే కాక కాలి కింది భాగాన్ని సూచిస్తుంది.
- source_word: כִידוֹן
  choice: బల్లెం
  rationale: ఈ పదం తేలికపాటి ఈటెవంటి ఆయుధాన్ని సూచించవచ్చు. పెద్ద ఈటెకు భిన్నమైన ఆయుధమనే సందర్భాన్ని ‘బల్లెం’ సహజంగా తెలియజేస్తుంది; పదార్థంలో ఉన్న అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: בֵּין כְּתֵפָיו
  choice: అతని భుజాల మధ్య
  rationale: హీబ్రూ పదబంధాన్ని నేరుగా నిలుపుతూ, మూలంలో స్పష్టంగా లేని ‘వీపున వేలాడదీసుకున్నాడు’ వంటి భావాన్ని చేర్చలేదు.
