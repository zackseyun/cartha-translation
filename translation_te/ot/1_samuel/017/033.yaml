source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד לֹ֤א תוּכַל֙ לָ/לֶ֨כֶת֙ אֶל הַ/פְּלִשְׁתִּ֣י הַ/זֶּ֔ה לְ/הִלָּחֵ֖ם עִמּ֑/וֹ כִּֽי נַ֣עַר אַ֔תָּה וְ/ה֛וּא אִ֥ישׁ מִלְחָמָ֖ה מִ/נְּעֻרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
translation:
  language: te
  text: సౌలు దావీదుతో, “ఈ ఫిలిష్తీయునికి ఎదిరిగా వెళ్లి అతనితో పోరాడలేవు; ఎందుకంటే నీవు యువకుడివి[a], అతడు తన యౌవనం నుంచే యుద్ధవీరుడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యువకుడు’ అని అనువదించిన హీబ్రూ పదం נַעַר (నఅర్); సందర్భాన్ని బట్టి దీనికి ‘యువకుడు,’ ‘కుర్రవాడు,’ లేదా ‘బాలుడు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: నీవు ... వెళ్లలేవు
  rationale: ఇది నిషేధాన్ని కాక సామర్థ్యలేమిని వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే రూపం.
- source_word: לָלֶכֶת אֶל
  choice: అతనిపైకి వెళ్లడం
  rationale: యుద్ధ సందర్భంలో ప్రత్యర్థిని ఎదుర్కొనేందుకు అతనిపైకి వెళ్లడమనే వైరి భావాన్ని తెలియజేస్తుంది.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: ఈ ఫిలిష్తీయుడు
  rationale: జాతి గుర్తింపుతో కూడిన నిర్దేశకాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: לְהִלָּחֵם עִמּוֹ
  choice: అతనితో పోరాడడానికి
  rationale: עִם లోని ‘తో’ భావాన్ని నిలుపుతూ ప్రత్యక్ష పోరాటాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: దావీదు వెళ్లలేడని సౌలు చెప్పిన కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: נַעַר
  choice: యువకుడు
  rationale: ఈ పదం బాలుడు నుంచి యువకుడు వరకు అర్థం ఇవ్వగలదు; యుద్ధానికి ముందుకొచ్చిన దావీదు సందర్భంలో ‘యువకుడు’ సహజమైనది, అయితే వయస్సు పరిధిలోని అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: אִישׁ מִלְחָמָה
  choice: యుద్ధవీరుడు
  rationale: అక్షరార్థమైన ‘యుద్ధపు మనిషి’ కంటే ఆధునిక తెలుగులో సహజంగా, సైనిక అనుభవమున్న పోరాటయోధుడనే భావాన్ని ఇస్తుంది.
- source_word: מִנְּעֻרָיו
  choice: తన యౌవనం నుంచే
  rationale: యౌవనంలో ప్రారంభమై కొనసాగిన యుద్ధ అనుభవాన్ని, మూలంలోని కాలవ్యాప్తిని నిలుపుతుంది.
