translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. ‘యుద్ధవీరుడు’ అనే సహజమైన పదంతో אִישׁ מִלְחָמָה భావాన్ని అందించాం; נַעַר యొక్క వయస్సు సంబంధిత విస్తృతిని పాదసూచికలో సంరక్షించాం.
