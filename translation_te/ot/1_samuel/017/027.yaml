translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని పునరుక్తి భావాన్ని సహజంగా సంక్షిప్తం చేసింది; ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా ఉంచింది.
