  text: The people told him the same thing, saying, “This is what will be done for the man who strikes him down.”
translation:
  language: te
  text: 'ప్రజలు అతనికి అదే విషయం చెప్పారు: “అతన్ని సంహరించే వ్యక్తికి ఇలా చేయబడుతుంది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּדָּבָר הַזֶּה
  choice: అదే విషయం
  rationale: ముందటి వచనాల్లో చెప్పబడిన బహుమతిని సూచించే ఈ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: יַכֶּנּוּ
  choice: అతన్ని చంపిన
  rationale: נכה అనే క్రియ సాధారణంగా ‘కొట్టు’ అని అర్థమిచ్చినా, ఈ యుద్ధ సందర్భంలో గొల్యాతును సంహరించడమే ఉద్దేశం; అందువల్ల ‘చంపిన’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כֹּה יֵעָשֶׂה
  choice: ఈ విధంగా జరుగుతుంది
  rationale: హీబ్రూ నిష్క్రియ నిర్మాణాన్ని నిలుపుతూ, ముందుగా వివరించిన ప్రతిఫలం ఆ వ్యక్తికి కలుగుతుందని తెలియజేస్తుంది.
