  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూలో మొదట ఏకవచన సమూహపదబంధం ఉండి, తరువాత బహువచన క్రియలు రావడాన్ని తెలుగులో సహజమైన బహువచన నిర్మాణంతో వ్యక్తం చేశాం.
