  source_fidelity: The draft accurately conveys the collective subject, seeing the man, fleeing from before him, and intense fear. However, చూడగానే adds an immediate ‘as soon as’ nuance not explicit in the Hebrew temporal construction (בִּרְאוֹתָם, ‘when/at their seeing’).
