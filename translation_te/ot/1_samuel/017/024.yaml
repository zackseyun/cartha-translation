  text: And every man of Israel, when they saw the man, fled from before him and were very afraid.
translation:
  language: te
  text: ఇశ్రాయేలు పురుషులందరూ ఆ మనిషిని చూసినప్పుడు, అతని ఎదుటనుండి పారిపోయి చాలా భయపడ్డారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరూ
  rationale: హీబ్రూ పదబంధంలోని ‘ప్రతి ఇశ్రాయేలు పురుషుడు’ అనే సమూహార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలో ఉన్న సైనికులను సూచిస్తుంది.
- source_word: בִּרְאוֹתָם
  choice: చూడగానే
  rationale: ‘వారు చూసినప్పుడు’ అనే కాలసంబంధ భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషిని
  rationale: మూలంలోని సాధారణ ‘ఆ మనిషి’ అనే సూచనను గోల్యాతు అనే పేరుతో విపులీకరించకుండా నిలుపుతుంది.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: అతని ఎదుటనుంచి పారిపోయి
  rationale: ‘అతని సన్నిధి/ముఖం ఎదుటనుంచి పారిపోయారు’ అనే మూలభావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַיִּירְאוּ מְאֹד
  choice: చాలా భయపడ్డారు
  rationale: తీవ్రమైన భయాన్ని సూచించే హీబ్రూ క్రియావిశేషణాన్ని నేరుగా ప్రతిబింబిస్తుంది.
