source:
  edition: WLC
  text: וַ/יִּקַּ֤ח דָּוִד֙ אֶת רֹ֣אשׁ הַ/פְּלִשְׁתִּ֔י וַ/יְבִאֵ֖/הוּ יְרוּשָׁלִָ֑ם וְ/אֶת כֵּלָ֖י/ו שָׂ֥ם בְּ/אָהֳלֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
translation:
  language: te
  text: దావీదు ఆ ఫిలిష్తీయుని తలను తీసుకొని యెరూషలేముకు తెచ్చాడు[b]. అతని యుద్ధ సామగ్రిని[a] తన గుడారంలో ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని ఆయుధాలను,’ ‘అతని సామానును.’ హీబ్రూ పదం విస్తృతార్థకమైనది; అది ఆయుధాలు, కవచం లేదా ఇతర సైనిక వస్తువులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: విస్తృత కథనంలోని ఈ దశలో యెరూషలేము ఇంకా పూర్తిగా ఇశ్రాయేలు ఆధీనంలో లేదు కాబట్టి, ‘యెరూషలేముకు తెచ్చాడు’ అనే మాటలో కొందరు కాలక్రమానికి సంబంధించిన ఇబ్బందిని గమనిస్తారు. దాన్ని సమన్వయపరచకుండా, అనువాదం హీబ్రూ పాఠంలోని పదప్రయోగాన్నే నిలుపుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ కథన క్రియకు సందర్భానుగుణమైన సహజ తెలుగు సమానార్థకం.
- source_word: רֹאשׁ
  choice: తలను
  rationale: ఇక్కడ శరీర భాగమైన తలనే అక్షరార్థంగా సూచిస్తోంది.
- source_word: הַפְּלִשְׁתִּי
  choice: ఆ ఫిలిష్తీయుని
  rationale: గొల్యాతును సూచించే జాతివాచక నామపదం; తెలుగు కథనంలో నిర్దిష్ట వ్యక్తిని సహజంగా సూచించేందుకు ‘ఆ’ వాడబడింది.
- source_word: וַיְבִאֵהוּ
  choice: తెచ్చాడు
  rationale: పుంలింగ ప్రత్యయం పుంలింగ నామమైన ‘తల’ను సూచిస్తుంది; తెలుగులో సహజంగా కర్మను ముందే పేర్కొని ‘తెచ్చాడు’ అని అనువదించవచ్చు.
- source_word: יְרוּשָׁלִָם
  choice: యెరూషలేము
  rationale: తెలుగులో స్థిరపడిన బైబిలు స్థలనామ రూపం.
- source_word: כֵּלָיו
  choice: అతని యుద్ధ సామగ్రిని
  rationale: כְּלִי విస్తృతార్థ పదం; ఆయుధాలు, కవచం, ఇతర సైనిక వస్తువులను కలుపగలదు. ‘యుద్ధ సామగ్రి’ ఈ సందర్భంలో ఆ విస్తృతిని కాపాడుతుంది.
- source_word: שָׂם
  choice: ఉంచాడు
  rationale: ఒకచోట పెట్టడం అనే సాధారణ అర్థాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּאָהֳלוֹ
  choice: తన గుడారంలో
  rationale: సందర్భంలో గుడారం దావీదుదిగా గ్రహించడం అత్యంత సహజం; కర్తను తిరిగి సూచించేందుకు తెలుగు ‘తన’ స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: చివరి వాక్యభాగంలోని స్వామ్య ప్రత్యయాల సూచన
  choice: యుద్ధ సామగ్రి ఫిలిష్తీయునిది; గుడారం దావీదుది.
  alternative: సామగ్రి, గుడారం రెండూ దావీదుకు చెందినవి; లేదా గుడారం సామూహిక/సైనిక గుడారం.
  rationale: సమీప సందర్భం దావీదు గొల్యాతు నుంచి యుద్ధ విజయచిహ్నాలను తీసుకోవడాన్ని వివరిస్తుంది. అందువల్ల సామగ్రి ఫిలిష్తీయునిది, దాన్ని ఉంచిన గుడారం దావీదుది అనే పఠనం సందర్భానికి అత్యంత సహజం.
- issue: యెరూషలేము ఇంకా పూర్తిగా ఇశ్రాయేలు ఆధీనంలో లేని కాలంతో కనిపించే కాలక్రమ ఉద్రిక్తత
  choice: ‘యెరూషలేముకు తెచ్చాడు’ అని హీబ్రూ వాక్యాన్ని నేరుగా అనువదించడం.
  alternative: ‘తరువాత యెరూషలేముకు తెచ్చాడు’ లేదా ‘యెరూషలేము వైపుకు తెచ్చాడు’ అని సమన్వయపరచడం.
  rationale: హీబ్రూ పాఠం చర్యను నేరుగా చెబుతుంది. చారిత్రక లేదా రచనాసంబంధ ఉద్రిక్తతను పరిష్కరించే పదాలను చేర్చకుండా పాఠ్యరూపాన్ని నిలుపుకోవాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘యుద్ధ సామగ్రి’ ద్వారా మూలపదపు విస్తృతిని ప్రధాన పాఠంలో నిలిపి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం. హీబ్రూలోని సాధారణ సంధిని తెలుగులో రెండు వరుస వాక్యాలుగా సహజంగా వ్యక్తం చేశాం; విరోధార్థాన్ని చేర్చలేదు.
