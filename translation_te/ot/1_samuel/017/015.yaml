  text: David went back and forth from Saul to shepherd his father's flock at Bethlehem[a].
translation:
  language: te
  text: దావీదు సౌలు వద్దనుండి బేత్లెహేములోని తన తండ్రి మందను మేపడానికి రాకపోకలు సాగించేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “దావీదు సౌలు వద్దనుండి వెళ్లి తిరిగి వచ్చేవాడు, బేత్లెహేములో తన తండ్రి మందను మేపడానికి.”'
    reason: హీబ్రూ הֹלֵךְ וָשָׁב యొక్క “వెళ్లి తిరిగి వచ్చేవాడు” అనే నిర్మాణాన్ని చూపుతూ, לִרְעוֹת యొక్క ఉద్దేశార్థాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: הֹלֵךְ וָשָׁב
  choice: రాకపోకలు సాగిస్తూ
  rationale: הלך మరియు שוב కలయిక ఇక్కడ ఒకసారి వెళ్లి తిరిగిరావడాన్ని కాక, అలవాటుగా లేదా పదేపదే జరిగే రాకపోకలను సూచిస్తుంది. ఈ పునరావృత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מֵעַל שָׁאוּל
  choice: సౌలు దగ్గరనుంచి
  rationale: מֵעַל యొక్క మూలార్థం ‘మీదనుంచి’ అయినా, ఈ సందర్భంలో సౌలు సన్నిధి లేదా సేవనుంచి బయలుదేరడాన్ని సూచిస్తుంది. ‘దగ్గరనుంచి’ వ్యక్తితో ఉన్న సాన్నిధ్యాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לִרְעוֹת
  choice: మేపేవాడు
  rationale: רעה కాపరి చేసే పనిని సూచిస్తుంది. ‘మేపేవాడు’ మందను కాచడం, మేతకు నడిపించడం అనే సందర్భార్థాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: צֹאן
  choice: మందను
  rationale: צֹאן సాధారణంగా గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచించగలదు. జాతిని అనవసరంగా పరిమితం చేయకుండా ‘మంద’ అనే సామూహిక పదం మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని తెలుగులో సహజమైన స్వీయసంబంధ రూపమైన ‘తన తండ్రి’గా అందించింది.
- source_word: בֵּית לָחֶם
  choice: బేత్లెహేము
  rationale: స్థల నామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: וְ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఈ వావ్ కథన అనుసంధానాన్ని అందిస్తుంది; తెలుగులో వాక్యప్రవాహమే దానిని సహజంగా మోస్తుంది. మూలంలో లేని ‘ఇప్పుడు’ వంటి కాలసూచక పదాన్ని చేర్చలేదు.
