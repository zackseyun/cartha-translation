source:
  edition: WLC
  text: הַ/יּ֣וֹם הַ/זֶּ֡ה יְסַגֶּרְ/ךָ֩ יְהוָ֨ה בְּ/יָדִ֜/י וְ/הִכִּיתִ֗/ךָ וַ/הֲסִרֹתִ֤י אֶת רֹֽאשְׁ/ךָ֙ מֵ/עָלֶ֔י/ךָ וְ/נָ֨תַתִּ֜י פֶּ֣גֶר מַחֲנֵ֤ה פְלִשְׁתִּים֙ הַ/יּ֣וֹם הַ/זֶּ֔ה לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/חַיַּ֣ת הָ/אָ֑רֶץ וְ/יֵֽדְעוּ֙ כָּל הָ/אָ֔רֶץ כִּ֛י יֵ֥שׁ אֱלֹהִ֖ים לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
translation:
  language: te
  text: ఈ రోజే యాహ్వే నిన్ను నా చేతికి అప్పగిస్తాడు. నేను నిన్ను కొట్టి, నీ తలను నీ శరీరం నుండి తీసివేస్తాను. ఈ రోజే ఫిలిష్తీయుల శిబిరంలోని శవాలను ఆకాశ పక్షులకు, భూమిమీది అడవి జంతువులకు ఇస్తాను. అప్పుడు ఇశ్రాయేలుకు దేవుడు ఉన్నాడని[a] భూమంతా తెలుసుకుంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలులో దేవుడు ఉన్నాడని.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలుకు” అని ఉంది; ఇది ఇశ్రాయేలుతో దేవుని సంబంధాన్ని లేదా ఇశ్రాయేలు పక్షాన ఆయన ఉండడాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְסַגֶּרְךָ ... בְּיָדִי
  choice: నిన్ను నా చేతికి అప్పగిస్తాడు
  rationale: సגר హిఫిల్ రూపం ఇక్కడ శత్రువును మరొకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. ‘నా చేతికి’ అనే హీబ్రూ అధికార-రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: וְהִכִּיתִךָ
  choice: నేను నిన్ను కొట్టి
  rationale: נכה అనే క్రియకు ‘కొట్టు/దెబ్బకొట్టు/హతమార్చు’ అనే అర్థపరిధి ఉంది. తరువాతి శిరస్సు తొలగింపు మరణాన్ని స్పష్టం చేస్తుంది కాబట్టి, క్రియను అతిగా నిర్దిష్టం చేయకుండా ‘కొట్టి’ అని అనువదించింది.
- source_word: וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ
  choice: నీ తలను నీ మీదనుంచి తీసివేస్తాను
  rationale: మూలంలో ‘నరికి వేస్తాను’ అనే ప్రత్యేక క్రియ కాకుండా ‘తొలగించు’ అనే סור ఉంది. భావం స్పష్టంగా ఉండేలా, అయినా మూలంలోని పదప్రయోగానికి దగ్గరగా ఉండేలా ‘తీసివేస్తాను’ వాడింది.
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల శిబిరంలోని శవాలను
  rationale: ఏకవచన రూపమైన פֶּגֶר ఇక్కడ సమూహార్థకంగా శిబిరంలోని మృతదేహాలను సూచిస్తుంది. తెలుగులో సందర్భానుగుణంగా బహువచనమైన ‘శవాలను’ సహజంగా ఉంటుంది.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: ఆకాశ పక్షులకు
  rationale: హీబ్రూ స్థిరపదబంధంలోని ఆకాశ చిత్రణను సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: וּלְחַיַּת הָאָרֶץ
  choice: భూమిమీది అడవి జంతువులకు
  rationale: ఈ సందర్భంలో חַיָּה పెంపుడు జంతువులను కాక అడవి జంతువులను సూచిస్తుంది; ‘భూమిమీది’ మూలంలోని భూమి సూచనను కాపాడుతుంది.
- source_word: וְיֵדְעוּ כָּל־הָאָרֶץ
  choice: అప్పుడు ... భూమంతా తెలుసుకుంటుంది
  rationale: వావ్‌తో కూడిన అసంపూర్ణ క్రియ ఇక్కడ ముందరి కార్యాల ఫలితాన్ని తెలియజేస్తుంది. ‘అప్పుడు’ ఆ ఫలిత సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు దేవుడు ఉన్నాడు
  rationale: לְ అనే ఉపసర్గలోని ‘కు/కోసం’ అనే సంబంధార్థాన్ని ‘ఇశ్రాయేలుకు’ నిలుపుతుంది; ఇది స్వామ్యాన్ని లేదా ఇశ్రాయేలు పక్షాన దేవుని సంబంధాన్ని సూచించగలదు.
theological_decisions:
- issue: יְהוָה దైవనామపు అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- issue: לְיִשְׂרָאֵל తెలియజేసే సంబంధం
  choice: ఇశ్రాయేలుకు దేవుడు ఉన్నాడు
  alternative: ఇశ్రాయేలులో దేవుడు ఉన్నాడు
  rationale: לְ సాధారణంగా ‘కు/కోసం’ అనే సంబంధం లేదా స్వామ్యాన్ని సూచిస్తుంది. అయితే సందర్భంలో ‘ఇశ్రాయేలులో’ అనే స్థానార్థక అవగాహన కూడా ప్రాచీనంగా, సాధ్యంగా ఉంది; అందుకే దానిని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. యుద్ధసందర్భంలోని తీవ్రతను తగ్గించలేదు; అదే సమయంలో మూలంలో లేని మరింత స్పష్టమైన హింసాత్మక క్రియలను చేర్చలేదు. పాదసూచిక గుర్తు దానికి సంబంధించిన చివరి వాక్యభాగానికే జతచేయబడింది.
