  text: וַ/יָּ֣רָץ דָּ֠וִד וַ/יַּעֲמֹ֨ד אֶל הַ/פְּלִשְׁתִּ֜י וַ/יִּקַּ֣ח אֶת חַ֠רְבּ/וֹ וַֽ/יִּשְׁלְפָ֤/הּ מִ/תַּעְרָ/הּ֙ וַ/יְמֹ֣תְתֵ֔/הוּ וַ/יִּכְרָת בָּ֖/הּ אֶת רֹאשׁ֑/וֹ וַ/יִּרְא֧וּ הַ/פְּלִשְׁתִּ֛ים כִּֽי מֵ֥ת גִּבּוֹרָ֖/ם וַ/יָּנֻֽסוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
translation:
  language: te
  text: అప్పుడు దావీదు పరుగెత్తి వెళ్లి ఆ ఫిలిష్తీయుని దగ్గర నిలబడ్డాడు[a]. అతని కత్తిని తీసుకొని, దాని ఒరలోనుంచి దాన్ని బయటికి తీశాడు; అతన్ని చంపాడు. ఆ కత్తితో అతని తలను నరికివేశాడు. వారి వీరుడు చనిపోయాడని ఫిలిష్తీయులు చూసినప్పుడు పారిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ ఫిలిష్తీయుని మీద నిలబడ్డాడు.” హీబ్రూ పదబంధం అతని దగ్గర స్థానం తీసుకోవడాన్ని సూచించవచ్చు; పడిపోయిన గొల్యాతు మీద దావీదు నిలబడ్డాడనే దృశ్యానికి “మీద” సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: పరుగెత్తి వెళ్లి
  rationale: רוץ అనే సాధారణ కథన క్రియలోని వేగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  choice: ఆ ఫిలిష్తీయుని దగ్గర నిలబడ్డాడు
  rationale: עמד אל ఇక్కడ పడిపోయిన ఫిలిష్తీయుని వద్ద స్థానం తీసుకోవడాన్ని సూచిస్తుంది. ‘దగ్గర’ అనే అనువాదం మూలంలోని స్థలసంబంధ అస్పష్టతను కాపాడుతుంది; ‘మీద’ అని నిర్ణయించడం కంటే ఇది తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: חַרְבּוֹ
  choice: అతని కత్తిని
  rationale: సర్వనామ ప్రత్యయం ఫిలిష్తీయునికి చెందిన కత్తిని సూటిగా సూచిస్తుంది.
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  choice: దాని ఒరలోనుంచి దాన్ని దూసి
  rationale: שלף ఆయుధాన్ని ఒరనుంచి దూయడాన్ని, תער కత్తి ఒరను సూచిస్తాయి.
- source_word: וַיְמֹתְתֵהוּ
  choice: అతన్ని చంపాడు
  rationale: מות యొక్క కారణార్థక రూపాన్ని సహజంగా వ్యక్తపరుస్తూ, ముందు వచనంలో అతడు నేలకూలినప్పటికీ ఇక్కడ చెప్పబడిన తుదిచర్యను కథన క్రమంలోనే ఉంచుతుంది.
- source_word: וַיִּכְרָת בָּהּ אֶת רֹאשׁוֹ
  choice: ఆ కత్తితోనే అతని తలను నరికివేశాడు
  rationale: כרת את ראשׁ తలను నరికివేయడాన్ని సూచిస్తుంది; בָהּ ముందు పేర్కొన్న కత్తినే సూచిస్తుందని స్పష్టం చేయబడింది.
- source_word: גִּבּוֹרָם
  choice: తమ బలశాలి
  rationale: גבור యొక్క ప్రాథమిక భావమైన బలవంతుడు/పరాక్రమవంతుడు అనే అర్థాన్ని నిలుపుతుంది; సందర్భానుసారంగా ‘వీరయోధుడు’ లేదా ‘ప్రతినిధి యోధుడు’ అనే భావం ఉండవచ్చు.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయారు
  rationale: యుద్ధరంగం నుంచి భయంతో పారిపోవడాన్ని తెలిపే נוס యొక్క సహజమైన తెలుగు రూపం.
