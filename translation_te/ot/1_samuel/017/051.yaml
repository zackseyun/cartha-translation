translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. హింసాత్మక చర్యలను మూలపాఠం చెప్పినంత స్పష్టంగానే, అదనపు తీవ్రత లేకుండా అనువదించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
