  to: అప్పుడు దావీదు పరుగెత్తి వెళ్లి ఆ ఫిలిష్తీయుని దగ్గర నిలబడ్డాడు[a]. అతని కత్తిని తీసుకొని, దాని ఒరలోనుంచి దాన్ని బయటికి తీశాడు; అతన్ని చంపాడు. ఆ కత్తితో అతని తలను నరికివేశాడు. వారి వీరుడు చనిపోయాడని ఫిలిష్తీయులు చూసినప్పుడు పారిపోయారు.
