id: 1SA.17.45
reference: 1 Samuel 17:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/פְּלִשְׁתִּ֔י אַתָּה֙ בָּ֣א אֵלַ֔/י בְּ/חֶ֖רֶב וּ/בַ/חֲנִ֣ית וּ/בְ/כִיד֑וֹן וְ/אָנֹכִ֣י בָֽא אֵלֶ֗י/ךָ בְּ/שֵׁם֙ יְהוָ֣ה צְבָא֔וֹת אֱלֹהֵ֛י מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר חֵרַֽפְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
translation:
  language: te
  text: 'అప్పుడు దావీదు ఆ ఫిలిష్తీయునితో ఇలా అన్నాడు: “నీవు కత్తితో, ఈటెతో, బల్లెంతో నా దగ్గరికి వస్తున్నావు. కానీ నీవు ధిక్కరించిన ఇశ్రాయేలు యుద్ధశ్రేణుల దేవుడైన సైన్యాల యాహ్వే[a] నామంలో నేను నీ దగ్గరికి వస్తున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సైన్యాల యెహోవా”; సంప్రదాయ అనువాదంలో “సేనల ప్రభువు.”
    reason: దైవనామం మరియు צְבָאוֹת బిరుదుకు ఉన్న ప్రత్యామ్నాయ రూపాలను తెలియజేయడం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమానుగత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַפְּלִשְׁתִּי
  choice: ఆ ఫిలిష్తీయుడు
  rationale: ఇది గోల్యాతును అతని జాతి/ప్రజా గుర్తింపుతో సూచిస్తుంది; మూలంలో లేని ‘యోధుడు’ అనే పదాన్ని చేర్చలేదు.
- source_word: בָּא אֵלַי / בָא אֵלֶיךָ
  choice: నా దగ్గరికి వస్తున్నావు / నీ దగ్గరికి వస్తున్నాను
  rationale: పార్టిసిపిల్ వర్తమాన లేదా సమీప చర్యను సూచిస్తుంది. శత్రుత్వ భావం సందర్భంలోనే స్పష్టంగా ఉన్నందున ‘ఎదురుగా’ అని అదనంగా చేర్చలేదు.
- source_word: בְּחֶרֶב
  choice: కత్తితో
  rationale: בְּ సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది; ‘కత్తితో’ సహజమైన తెలుగు రూపం.
- source_word: וּבַחֲנִית
  choice: ఈటెతో
  rationale: חֲנִית పొడవైన కుంతం/స్పియర్‌ను సూచిస్తుంది; ‘ఈటె’ స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: וּבְכִידוֹן
  choice: బల్లెంతో
  rationale: כִּידוֹן తేలికైన లేదా విసిరే కుంతవంటి ఆయుధాన్ని సూచిస్తుంది; חֲנִיתతో భేదాన్ని నిలుపుతూ ‘బల్లెం’ సహజంగా ఉంది.
- source_word: בְּשֵׁם
  choice: నామంలో
  rationale: అధికారం, ప్రతినిధిత్వం, ఆధారం అనే భావాలను మోసే బైబిలీయ ప్రయోగాన్ని ‘నామంలో’ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన వ్యక్తినామ రూపంతో అందించబడింది.
- source_word: צְבָאוֹת
  choice: సైన్యాల
  rationale: צְבָאוֹת యొక్క సైనిక మరియు సార్వభౌమ భావాన్ని ఆధునిక పాఠకుడికి పారదర్శకంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు యుద్ధశ్రేణుల దేవుడు
  rationale: מַעַרְכוֹת అనేది అమర్చబడిన సైనిక శ్రేణులు లేదా యుద్ధపంక్తులను సూచిస్తుంది; సాధారణ ‘సైన్యాలు’లో కలిపేయకుండా యుద్ధరంగ దృశ్యాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר חֵרַפְתָּ
  choice: నీవు ధిక్కరించిన
  rationale: חרף ఇక్కడ కేవలం దూషించడం కాక, దేవుని పట్ల అవమానకరమైన సవాలు చేయడాన్ని సూచిస్తుంది; ‘ధిక్కరించిన’ ఆ ఘర్షణాత్మక బలాన్ని అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచడం మూలానికి దగ్గరగా ఉంటుంది; తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: יְהוָה צְבָאוֹת అనే బిరుదు
  choice: సైన్యాల యెహోవా
  alternative: సేనల యెహోవా; సైన్యాలకు అధిపతియైన యెహోవా
  rationale: ‘సైన్యాల’ అనే రూపం మూలంలోని నామవాచక సంబంధాన్ని నిలుపుతుంది; ‘అధిపతి’ అనే వివరణాత్మక పదాన్ని మూలంలో లేనందున ప్రధాన పాఠంలో చేర్చలేదు.
- issue: אֲשֶׁר యొక్క పూర్వపద సంబంధం
  choice: యెహోవాను సూచించేలా వాక్య నిర్మాణం
  alternative: ఇశ్రాయేలు యుద్ధశ్రేణులను ధిక్కరించినట్లు అనుసంధానం
  rationale: హీబ్రూలో సంబంధసర్వనామం ఏకవచన ప్రత్యయంతో ఉండి సమీపంలోని బహువచన ‘యుద్ధశ్రేణులు’ కంటే ‘దేవుడు/యెహోవా’తో సహజంగా అనుసంధానమవుతుంది; సందర్భంలో గోల్యాతు దేవునినే ధిక్కరించిన భావం ప్రధానంగా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి స్పష్టంగా ఉండే శైలి. ఆయుధాల మధ్య మూలపాఠంలోని భేదాన్ని ‘ఈటె/బల్లెం’తో నిలిపాం; మַעַרְכוֹת యొక్క అమర్చిన యుద్ధశ్రేణుల భావాన్ని ప్రధాన పాఠంలో ఉంచాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత దైవబిరుదు వెంట ఉంది.
