  text: וַ/יַּחְגֹּ֣ר דָּוִ֣ד אֶת חַ֠רְבּ/וֹ מֵ/עַ֨ל לְ/מַדָּ֜י/ו וַ/יֹּ֣אֶל לָ/לֶכֶת֮ כִּ֣י לֹֽא נִסָּה֒ וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל שָׁא֗וּל לֹ֥א אוּכַ֛ל לָ/לֶ֥כֶת בָּ/אֵ֖לֶּה כִּ֣י לֹ֣א נִסִּ֑יתִי וַ/יְסִרֵ֥/ם דָּוִ֖ד מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
translation:
  language: te
  text: దావీదు తన కత్తిని తన కవచం మీద బిగించుకొని నడవడానికి ప్రయత్నించాడు[a], ఎందుకంటే అతడు వాటిని వాడి చూడలేదు. అప్పుడు దావీదు సౌలుతో, “నేను వీటితో వెళ్లలేను[b], ఎందుకంటే నేను వీటిని వాడి చూడలేదు” అన్నాడు. ఆపై దావీదు తన మీదనుండి వాటిని తీసివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వెళ్లడానికి పూనుకున్నాడు”; హీబ్రూ పదబంధం ఒక పనిని చేపట్టడం, ప్రయత్నించడం లేదా సాహసించడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: “వీటితో” అనేది సౌలు దావీదుకు తొడిగించిన కవచం, ఆయుధ సామగ్రిని సూచిస్తుంది. “కవచం”గా అనువదించిన హీబ్రూ పదం విస్తృతంగా వస్త్రాలు లేదా దుస్తులు అని కూడా అర్థమివ్వగలదు; ఇక్కడి సైనిక సందర్భం “కవచం” అనే అర్థాన్ని సమర్థిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְגֹּר
  choice: కట్టుకొని
  rationale: חגר అనేది ఆయుధాన్ని నడుముకు బిగించుకోవడం లేదా కట్టుకోవడం సూచిస్తుంది; ఆధునిక తెలుగులో ‘కత్తిని కట్టుకొని’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: חַרְבּוֹ
  choice: తన కత్తిని
  rationale: חֶרֶב యొక్క సాధారణ అర్థం ‘కత్తి’; మూడవ పురుష ఏకవచన ప్రత్యయం ‘తన’గా వ్యక్తమైంది.
- source_word: מֵעַל לְמַדָּיו
  choice: తన కవచం మీద
  rationale: לְמַדִּים విస్తృతంగా వస్త్రాలు లేదా దుస్తులు అని అర్థమివ్వగలిగినా, ముందున్న సైనిక సామగ్రి సందర్భం ఇక్కడ ‘కవచం’ను సమర్థిస్తుంది.
- source_word: וַיֹּאֶל לָלֶכֶת
  choice: నడవడానికి ప్రయత్నించాడు
  rationale: יאל + క్రియార్థకం చేపట్టడం, సాహసించడం లేదా ప్రయత్నించడం అనే భావాలు ఇవ్వగలదు; ఇక్కడ దావీదు అపరిచిత కవచంతో కదిలి చూడడాన్ని ‘నడవడానికి ప్రయత్నించాడు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כִּי לֹא נִסָּה
  choice: ఎందుకంటే అతడు వాటిని పరీక్షించి చూడలేదు
  rationale: נסה పియేల్ రూపం వాడి పరీక్షించడం లేదా ప్రయత్నించి చూడడం సూచిస్తుంది. తెలుగులో ‘పరీక్షించి చూడలేదు’ వాడుక ద్వారా అనుభవపూర్వకంగా ప్రయత్నించని భావం నిలుస్తుంది.
- source_word: לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה
  choice: వీటితో నేను వెళ్లలేను
  rationale: הלך ఇక్కడ వెళ్లడం లేదా కదలడం; בָּאֵלֶּה ఆయుధకవచ సామగ్రిని సూచిస్తుంది. ‘వీటితో వెళ్లలేను’ యుద్ధానికి వెళ్లడం సహా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: לֹא נִסִּיתִי
  choice: నేను వీటిని పరీక్షించి చూడలేదు
  rationale: ముందటి נסה క్రియనే మొదటి పురుషంలో పునరావృతం చేస్తుంది; ఒకే తెలుగు పదబంధాన్ని ఉంచడం మూలంలోని పునరుక్తిని కాపాడుతుంది.
- source_word: וַיְסִרֵם ... מֵעָלָיו
  choice: వాటిని తీసివేశాడు
  rationale: హిఫీల్ రూపంలోని סור తొలగించడం సూచిస్తుంది. ‘తీసివేశాడు’ ధరించిన కవచం, సామగ్రిని ఒంటిమీద నుంచి తొలగించిన చర్యను సహజ తెలుగులో తెలియజేస్తుంది.
