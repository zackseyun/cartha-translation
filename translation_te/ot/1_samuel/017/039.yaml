translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘పరీక్షించి చూడలేదు’ అనే ప్రయోగం נסה యొక్క పరీక్షించడం/వాడి చూడడం అనే భావవ్యాప్తిని కాపాడుతుంది. మూలంలోని కారణవాచక పునరుక్తి రెండుసార్లూ నిలుపబడింది; సర్వనామ సూచన స్పష్టత కోసం ‘వాటిని/వీటిని’ వ్యక్తం చేయబడింది.
