source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ שְׁלֹ֤שֶׁת בְּנֵֽי יִשַׁי֙ הַ/גְּדֹלִ֔ים הָלְכ֥וּ אַחֲרֵי שָׁא֖וּל לַ/מִּלְחָמָ֑ה וְ/שֵׁ֣ם שְׁלֹ֣שֶׁת בָּנָ֗י/ו אֲשֶׁ֤ר הָלְכוּ֙ בַּ/מִּלְחָמָ֔ה אֱלִיאָ֣ב הַ/בְּכ֗וֹר וּ/מִשְׁנֵ֨/הוּ֙ אֲבִ֣ינָדָ֔ב וְ/הַ/שְּׁלִשִׁ֖י שַׁמָּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
translation:
  language: te
  text: 'యెష్షయి కుమారుల్లో వయసులో పెద్దవారైన ముగ్గురు సౌలు వెంట[a] యుద్ధానికి వెళ్లారు. యుద్ధానికి వెళ్లిన అతని ముగ్గురు కుమారుల పేర్లు ఇవి: మొదట పుట్టినవాడు ఏలీయాబు, రెండవవాడు అబీనాదాబు, మూడవవాడు షమ్మా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సౌలును అనుసరించి.”
    reason: אַחֲרֵי అనే పదబంధం అక్షరార్థంగా ‘వెనుక/వెంట’ అని, సందర్భంలో నాయకునిగా సౌలును అనుసరించారని అర్థం కావచ్చు.
lexical_decisions:
- source_word: וַיֵּלְכוּ / הָלְכוּ
  choice: వెళ్లారు
  rationale: הלך అనే క్రియ ఇక్కడ సౌలుతో కలిసి సైనిక యాత్రకు వెళ్లడాన్ని సూచిస్తుంది. తెలుగు కథనంలో సాధారణ భూతకాల రూపం సహజంగా ఉంటుంది; పూర్వభూతకాల భావం సందర్భం నుంచే స్పష్టమవుతుంది.
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  choice: యెష్షయి కుమారుల్లో వయసులో పెద్దవారైన ముగ్గురు
  rationale: הַגְּדֹלִים కుటుంబ సందర్భంలో శరీర పరిమాణం లేదా గొప్పతనం కాక వయస్సులో పెద్దవారిని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ భావాన్ని సందేహం లేకుండా తెలియజేస్తుంది.
- source_word: אַחֲרֵי שָׁאוּל
  choice: సౌలు వెంట
  rationale: אַחֲרֵי యొక్క ‘వెనుక/తర్వాత’ అనే స్థానిక రూపకాన్ని ‘వెంట’ సహజమైన తెలుగులో నిలుపుతూ, సౌలును అనుసరించి వెళ్లారనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: מִלְחָמָה యుద్ధం లేదా నిర్దిష్ట పోరాటాన్ని సూచించగలదు. ఇక్కడ సైనిక సంగ్రామానికి వెళ్లడమే ప్రధాన భావం; ‘యుద్ధానికి’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: וְשֵׁם
  choice: పేర్లు ఇవి
  rationale: హీబ్రూలో ‘పేరు’ ఏకవచనంగా ఉన్నా, తరువాత ముగ్గురి పేర్ల జాబితా వస్తుంది. తెలుగులో బహువచనంతో ‘పేర్లు ఇవి’ అనడం సహజం.
- source_word: בָּנָיו
  choice: అతని ముగ్గురు కుమారులు
  rationale: సర్వనామ ప్రత్యయం యెష్షయిని సూచిస్తుంది. సమీప సందర్భంలో సూచన స్పష్టంగా ఉన్నందున ‘అతని’ అని నిలుపబడింది.
- source_word: הַבְּכוֹר
  choice: మొదట పుట్టినవాడు
  rationale: בכור కేవలం వయసులో పెద్దవాడని కాక మొదట జన్మించినవాడనే కుటుంబ స్థానాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు ‘మొదట పుట్టినవాడు’ స్పష్టంగా ఉంటుంది.
- source_word: וּמִשְׁנֵהוּ
  choice: రెండవవాడు
  rationale: ఇది మొదట పుట్టినవాని తరువాతి క్రమస్థానాన్ని సూచిస్తుంది. ‘రెండవవాడు’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఆ క్రమాన్ని తెలుపుతుంది.
- source_word: וְהַשְּׁלִשִׁי
  choice: మూడవవాడు
  rationale: పేర్ల క్రమజాబితాను స్పష్టంగా కొనసాగించే సహజ తెలుగు రూపం.
- source_word: שַׁמָּה
  choice: షమ్మా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన, తెలుగులో చదవడానికి సహజమైన లిప్యంతరీకరణ.
