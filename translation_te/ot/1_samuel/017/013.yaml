translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని పునరుక్త ‘వెళ్లారు’ రూపాన్ని తెలుగులో అసహజంగా పునరావృతం చేయకుండా భావాన్ని ఒకసారి ప్రధాన వాక్యంలో చెప్పి, గుర్తింపు ఉపవాక్యంలో ‘యుద్ధానికి వెళ్లిన’ అని నిలుపబడింది.
