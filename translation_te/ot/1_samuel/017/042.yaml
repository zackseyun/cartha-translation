revisions:
- from: ఆ ఫిలిష్తీయుడు దావీదును తదేకంగా చూసి, అతడు యువకుడనీ, ఎర్రని ఛాయగలవాడనీ[a], చూడటానికి అందంగా ఉన్నాడనీ గ్రహించి, అతణ్ణి తృణీకరించాడు.
  to: ఆ ఫిలిష్తీయుడు చూసి దావీదును గమనించినప్పుడు, అతడు యువకుడు, ఎర్రని వర్ణఛాయగలవాడు[a], రూపంలో అందమైనవాడు కావడంతో అతణ్ణి తృణీకరించాడు.
  rationale: The revision preserves the Hebrew narrative progression (‘looked’ and ‘saw David’) and explicitly attaches the following descriptions to the reason for the Philistine’s contempt. It avoids adding an act of inference while retaining the lexical ambiguity of the reddish descriptor.
  reviewer_model: gpt-5.6-terra
