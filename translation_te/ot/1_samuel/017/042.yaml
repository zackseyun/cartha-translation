translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూలోని ‘చూశాడు—చూశాడు’ అనే వరుసను యాంత్రికంగా పునరావృతం చేయకుండా, దాని పరిశీలనాత్మక క్రమాన్ని ‘తదేకంగా చూసి ... గ్రహించి’గా వ్యక్తపరిచాం. పాఠంలో అడుగుటి సూచిక [a] సంబంధిత పదబంధం వెంట ఉంచబడింది.
