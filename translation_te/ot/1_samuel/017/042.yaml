source:
  edition: WLC
  text: וַ/יַּבֵּ֧ט הַ/פְּלִשְׁתִּ֛י וַ/יִּרְאֶ֥ה אֶת דָּוִ֖ד וַ/יִּבְזֵ֑/הוּ כִּֽי הָיָ֣ה נַ֔עַר וְ/אַדְמֹנִ֖י עִם יְפֵ֥ה מַרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/042.yaml
  text: When the Philistine looked and saw David[a], he despised him, because he was a youth, ruddy and handsome in appearance.
translation:
  language: te
  text: ఆ ఫిలిష్తీయుడు చూసి దావీదును గమనించినప్పుడు, అతడు యువకుడు, ఎర్రని వర్ణఛాయగలవాడు[a], రూపంలో అందమైనవాడు కావడంతో అతణ్ణి తృణీకరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎర్రటి జుట్టుగలవాడు’; హీబ్రూ విశేషణం జుట్టు రంగును మాత్రమే కాకుండా, సాధారణంగా ఎర్రని వర్ణఛాయను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: తదేకంగా చూసి
  rationale: נבט అంటే చూపును ఒకరిపై నిలిపి చూడడం. తరువాత వచ్చే ראהతో ఉన్న క్రమాన్ని తెలుగులో సహజంగా ఉంచేందుకు ‘తదేకంగా చూసి ... గ్రహించి’ అని అనువదించాం.
- source_word: הַפְּלִשְׁתִּי
  choice: ఆ ఫిలిష్తీయుడు
  rationale: హీబ్రూ పాఠంలో ఉన్న జాతివాచకాన్నే నిలిపి ఉంచాం; సందర్భం ద్వారా ఇతడు గొల్యాతు అని తెలుస్తున్నా ‘వీరుడు’ వంటి అదనపు బిరుదు చేర్చలేదు.
- source_word: וַיִּרְאֶה אֶת־דָּוִד
  choice: దావీదును ... గ్రహించి
  rationale: ראה సాధారణంగా ‘చూడు’ అని అర్థం. అయితే ముందున్న ‘చూశాడు’ అనే క్రియతో అనవసర పునరుక్తి రాకుండా, చూసి అతని లక్షణాలను గుర్తించిన భావాన్ని ‘గ్రహించి’ సహజంగా వ్యక్తపరిచాం.
- source_word: וַיִּבְזֵהוּ
  choice: అతణ్ణి తృణీకరించాడు
  rationale: בזה ఒకరిని నీచంగా ఎంచడం లేదా చిన్నచూపు చూడడం అనే బలమైన భావాన్ని ఇస్తుంది; ‘తృణీకరించాడు’ దాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי
  choice: అతడు ... అని గ్రహించి
  rationale: ఇక్కడ כִּי తృణీకరణకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో కారణలక్షణాలను ‘అనీ ... గ్రహించి’ అనే నిర్మాణంలో సహజంగా కలిపాం.
- source_word: הָיָה נַעַר
  choice: అతడు యువకుడు
  rationale: נַעַר సందర్భానుసారం బాలుడు, యువకుడు, లేదా యువ సేవకుడు కావచ్చు. దావీదు చిన్నపిల్లవాడే అని నిర్దిష్టం చేయకుండా ‘యువకుడు’ అతని యౌవనాన్ని సముచితంగా తెలియజేస్తుంది.
- source_word: אַדְמֹנִי
  choice: ఎర్రని ఛాయగలవాడు
  rationale: ఈ విశేషణం ఎర్రటి లేదా ఎర్రని వర్ణఛాయను సూచిస్తుంది; అది తప్పనిసరిగా జుట్టు రంగునే సూచించదు. అందువల్ల విస్తృత భావాన్ని నిలిపే పదబంధాన్ని ఎంచుకున్నాం.
- source_word: עִם יְפֵה מַרְאֶה
  choice: చూడటానికి అందంగా ఉన్నవాడు
  rationale: ఈ పదబంధం రూపంలో అందంగా లేదా ఆకర్షణీయంగా ఉండడాన్ని సూచిస్తుంది. ‘చూడటానికి అందంగా’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని రూపవర్ణనను కాపాడుతుంది.
