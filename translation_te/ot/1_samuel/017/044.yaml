base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
translation:
  language: te
  text: ఆ ఫిలిష్తీయుడు దావీదుతో, “నా దగ్గరికి రా; నీ మాంసాన్ని ఆకాశ పక్షులకు[a], పొలంలోని జంతువులకు[b] ఇస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆకాశంలో ఎగిరే జీవులకు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “పొలంలోని మృగాలకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: ఆ ఫిలిష్తీయుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న నామవాచకం సందర్భంలో గొల్యాతును సూచిస్తుంది; ‘యోధుడు’ అనే అదనపు భావాన్ని చేర్చకుండా మూలాన్ని అనుసరిస్తుంది.
- source_word: לְכָה אֵלַי
  choice: నా దగ్గరికి రా
  rationale: సవాలు విసిరే సందర్భంలోని దిశాత్మక ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶתְּנָה
  choice: ఇస్తాను
  rationale: ఈ రూపం ఇక్కడ మొదటి వ్యక్తి దృఢ సంకల్పంతో కూడిన బెదిరింపును తెలియజేస్తుంది; తెలుగు భవిష్యత్ రూపం దానిని సహజంగా అందిస్తుంది.
- source_word: בְּשָׂרְךָ
  choice: నీ మాంసాన్ని
  rationale: ‘మాంసం’ మూలంలోని భయానకమైన శరీర సంబంధ చిత్రణను ‘దేహం’ కంటే మరింత నేరుగా నిలుపుతుంది.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: ఆకాశ పక్షులకు
  rationale: హీబ్రూ పదబంధానికి సహజమైన తెలుగు సమానార్థకం; ఎగిరే జీవులను ఈ సందర్భంలో ‘పక్షులు’గా అనువదించడం సముచితం.
- source_word: וּלְבֶהֱמַת הַשָּׂדֶה
  choice: పొలంలోని జంతువులకు
  rationale: ‘జంతువులు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, పొలప్రాంతంలోని జంతువులను సూచించే హీబ్రూ పదబంధాన్ని అతివ్యాఖ్య లేకుండా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బెదిరింపు యొక్క నేరుతనాన్ని మరియు మూలంలోని క్రూరమైన చిత్రణను నిలుపుతూ రూపొందించబడింది. ‘ఆహారంగా’ అనేది తెలుగులో ‘పక్షులకు/జంతువులకు మాంసాన్ని ఇవ్వడం’ అనే ఉద్దేశాన్ని సహజంగా స్పష్టం చేస్తుంది; ఇది సందర్భసిద్ధమైన అర్థం.
