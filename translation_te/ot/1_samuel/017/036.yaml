source:
  edition: WLC
  text: גַּ֧ם אֶֽת הָ/אֲרִ֛י גַּם הַ/דּ֖וֹב הִכָּ֣ה עַבְדֶּ֑/ךָ וְֽ֠/הָיָה הַ/פְּלִשְׁתִּ֨י הֶ/עָרֵ֤ל הַ/זֶּה֙ כְּ/אַחַ֣ד מֵ/הֶ֔ם כִּ֣י חֵרֵ֔ף מַעַרְכֹ֖ת אֱלֹהִ֥ים חַיִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
translation:
  language: te
  text: సింహాన్నీ ఎలుగుబంటినీ మీ సేవకుడు కొట్టాడు. సజీవుడైన దేవుని యుద్ధ శ్రేణులను[a] ధిక్కరించిన ఈ సున్నతి లేని ఫిలిష్తీయుడు వాటిలో ఒకదానిలా అవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సజీవుడైన దేవుని సైన్యాలను.’ హీబ్రూ పదానికి ‘యుద్ధ శ్రేణులు,’ ‘సైనిక పంక్తులు,’ లేదా విస్తృతార్థంలో ‘సైన్యాలు’ అని అర్థం రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: נכה అనే క్రియకు ‘కొట్టు,’ ‘దెబ్బతీయు,’ ‘హతమార్చు’ అనే అర్థాలు ఉన్నాయి. ప్రాణాంతక జంతువులను జయించిన సందర్భంలో ‘హతమార్చాడు’ సహజంగా ఉండి, క్రియ యొక్క సందర్భోచిత బలాన్ని తెలియజేస్తుంది.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుడు
  rationale: సౌలుతో నేరుగా మాట్లాడుతున్నప్పుడు ఇది దావీదు తనను తాను వినయంగా సూచించుకునే రాజసభా ప్రయోగం; ఇక్కడ బానిసత్వ స్థితికన్నా గౌరవపూర్వక వినయమే ప్రధానమైనది.
- source_word: הָאֲרִי ... הַדּוֹב
  choice: సింహాన్నీ ఎలుగుబంటినీ
  rationale: రెండు నామవాచకాలకూ Hebrewలో నిర్దిష్ట ఉపపదం ఉంది. తెలుగులో ద్వంద్వ సముచ్చయమైన ‘-నీ ... -నీ’ రెండింటినీ స్పష్టంగా కలిపి సహజంగా వినిపిస్తుంది.
- source_word: וְהָיָה
  choice: అవుతాడు
  rationale: ఈ సందర్భంలో ఈ రూపం భవిష్యత్తు ఫలితంపై దావీదు కలిగిన నిశ్చయాన్ని వ్యక్తం చేస్తుంది.
- source_word: הֶעָרֵל
  choice: సున్నతి లేని
  rationale: మూలంలోని శారీరకమైన నిబంధన-గుర్తును నేరుగా నిలుపుతుంది; ‘దైవభక్తి లేని’ వంటి వ్యాఖ్యానాత్మక విస్తరణను చేర్చదు.
- source_word: כְּאַחַד מֵהֶם
  choice: వాటిలో ఒకదానిలా
  rationale: ఫిలిష్తీయుని గతి సింహం, ఎలుగుబంటి గతులలో ఒకదానితో పోల్చబడుతోంది. తెలుగులో జంతువులను సూచిస్తూ ‘వాటిలో ఒకదానిలా’ సహజంగా ఉంటుంది.
- source_word: חֵרֵף
  choice: ధిక్కరించిన
  rationale: חרף అవమానించడం, దూషించడం, సవాలు చేయడం అనే భావాలను కలిగి ఉంటుంది. ఈ సైనిక-దైవశాస్త్రీయ సందర్భంలో ‘ధిక్కరించిన’ శత్రుత్వపూర్వక అవహేళనను సముచితంగా తెలియజేస్తుంది.
- source_word: מַעַרְכֹת
  choice: యుద్ధ శ్రేణులను
  rationale: מערכה యుద్ధ ఏర్పాట్లు, పంక్తులు లేదా శ్రేణులను సూచిస్తుంది. ‘యుద్ధ శ్రేణులు’ మూలంలోని దృశ్యమైన సైనిక రూపకాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים חַיִּים
  choice: సజీవుడైన దేవుడు
  rationale: ఇది విగ్రహాలకు భిన్నంగా దేవుని నిజమైన సజీవ ఉనికిని నొక్కిచెప్పే ప్రామాణిక Hebrew అభివ్యక్తి; భావానుసారం ఏకవచనంగా అనువదించబడింది.
theological_decisions:
- issue: గొల్యాతును వర్ణించే ‘సున్నతి లేని’ అనే మాటలోని నిబంధన సంబంధిత బలం
  choice: ప్రధాన పాఠ్యంలో ‘సున్నతి లేని’ అనే అక్షరార్థ పదబంధాన్ని నిలుపడం
  alternative: నిబంధనకు వెలుపల ఉన్నవాడు; దైవభక్తి లేని ఫిలిష్తీయుడు
  rationale: Hebrew పాఠ్యం శారీరకమైన నిబంధన-గుర్తునే దైవశాస్త్రీయ అవమానంగా ఉపయోగిస్తుంది. వ్యాఖ్యానాత్మక పర్యాయపదం మూలంలోని వాగ్బలాన్ని తగ్గించి, పాఠ్యంలో లేని వివరణను చేర్చుతుంది.
- issue: దేవునికి చెందిన מַעַרְכֹת అనే పదం యొక్క భావం
  choice: ‘సైన్యాలు’కు బదులు ‘యుద్ధ శ్రేణులు’
  alternative: సజీవుడైన దేవుని సైన్యాలు; సజీవుడైన దేవుని పంక్తులు
  rationale: ఈ పదబంధం సజీవుడైన దేవునికి చెందిన ఇశ్రాయేలు యుద్ధ ఏర్పాట్లను సూచిస్తుంది. ‘యుద్ధ శ్రేణులు’ Hebrew నామవాచకంలోని స్పష్టమైన సైనిక చిత్రాన్ని కాపాడుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘నీ సేవకుడు’ దావీదు వినయపూర్వక స్వీయసూచనను, ‘సున్నతి లేని’ మూలంలోని నిబంధనాత్మక వాగ్బలాన్ని నిలుపుతాయి. పాదటిప్పణి గుర్తు దానికి సంబంధించిన ‘యుద్ధ శ్రేణులను’ అన్న పదబంధం వద్ద ఉంచబడింది.
