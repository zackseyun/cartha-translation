  yaml_path: translation/ot/1_samuel/017/029.yaml
  text: David said[a], “What have I done now? Was it not just a word?”
translation:
  language: te
  text: 'దావీదు ఇలా అన్నాడు: “ఇప్పుడు నేనేం చేశాను? నేను అన్నది ఒక మాటే కదా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది కేవలం ఒక విషయమే కదా?” హీబ్రూ పదం דָּבָר అంటే “మాట,” “విషయం,” లేదా “సంగతి” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సాధారణ హీబ్రూ కథన రూపం; ఆధునిక తెలుగు కథనంలో సహజంగా ఉంది.
- source_word: דָּוִד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: מֶה עָשִׂיתִי עָתָּה
  choice: ఇప్పుడు నేనేం చేశాను?
  rationale: దావీదు అభ్యంతరంతో అడిగిన ప్రశ్నను, עָתָּה లోని ‘ఇప్పుడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הֲלוֹא
  choice: కదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే అలంకారప్రశ్న బలాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דָּבָר
  choice: ఒక మాట
  rationale: ఈ సందర్భంలో తన చర్య కేవలం తాను అన్న మాట మాత్రమేనని దావీదు తగ్గించి చెప్పే భావానికి సరిపోతుంది; అయితే ఈ పదానికి ‘విషయం’ అనే అర్థమూ ఉండగలదు.
- source_word: הוּא
  choice: నేను అన్నది ... ఏ
  rationale: చర్చలో ఉన్న దానిని సూచించే సర్వనామ భావాన్ని తెలుగులో సహజమైన వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘నేనేం చేశాను?’ మరియు ‘కదా?’ అనే రూపాలు దావీదు అభ్యంతర స్వరాన్ని స్పష్టంగా వినిపిస్తాయి; דָּבָר లోని నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
