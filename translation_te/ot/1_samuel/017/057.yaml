translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘ఫిలిష్తీయుడు’ అనే పదాన్ని నిలిపి, గోల్యాతు అనే పేరును చేర్చలేదు. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
