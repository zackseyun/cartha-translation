base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/057.yaml
  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
translation:
  language: te
  text: దావీదు ఆ ఫిలిష్తీయుణ్ణి హతమార్చి తిరిగి వచ్చినప్పుడు, అబ్నేరు అతణ్ణి తీసుకొని, ఫిలిష్తీయుని తల దావీదు చేతిలో ఉండగా, సౌలు ఎదుటికి తీసుకువచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఫిలిష్తీయుని తల అతని చేతిలో ఉంది.” హీబ్రూలో ఇది క్రియలేని ఉపవాక్యం; దీనిని సందర్భాన్ని తెలిపే పదబంధంగానైనా, స్వతంత్ర సమన్వయ వాక్యంగానైనా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְשׁוּב
  choice: తిరిగి వచ్చినప్పుడు
  rationale: ו conjunctionతో కూడిన שוב infinitive construct కాలసూచక ఉపవాక్యాన్ని ప్రవేశపెడుతుంది; ఆధునిక తెలుగులో ‘తిరిగి వచ్చినప్పుడు’ సహజంగా కాలసంబంధాన్ని తెలియజేస్తుంది.
- source_word: מֵהַכּוֹת
  choice: హతమార్చి
  rationale: נכה అంటే కొట్టు/దెబ్బతీయు; ఈ సందర్భంలో దాని ఫలితం మరణం కావడంతో ‘హతమార్చి’ సందర్భార్థాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: הַפְּלִשְׁתִּי
  choice: ఆ ఫిలిష్తీయుణ్ణి
  rationale: మూలంలో వ్యక్తిపేరు కాక ‘ఫిలిష్తీయుడు’ అనే నిర్దిష్ట సంబోధనే ఉంది; పూర్వసందర్భంలోని వ్యక్తిని సూచించేందుకు తెలుగులో ‘ఆ’ సహజం.
- source_word: וַיִּקַּח אֹתוֹ
  choice: అబ్నేరు అతణ్ణి తీసుకొని
  rationale: לקח యొక్క సాధారణ అర్థమైన ‘తీసుకొను’ను నిలుపుతుంది; ‘పట్టుకున్నాడు’ అనవసరమైన బలవంతపు భావాన్ని కలిగించవచ్చు.
- source_word: וַיְבִאֵהוּ לִפְנֵי שָׁאוּל
  choice: సౌలు ఎదుటికి తీసుకువచ్చాడు
  rationale: בוא hiphil ‘తీసుకురావడం’ను, לִפְנֵי ‘ఎదుట/సన్నిధికి’ అనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  choice: అప్పుడు ఆ ఫిలిష్తీయుని తల దావీదు చేతిలో ఉంది
  rationale: మూలంలోని క్రియలేని సమన్వయ వాక్యాన్ని తెలుగులో పూర్తి వాక్యంగా అందించింది. ‘అతని’ అనే సర్వనామంలోని సంభావ్య అయోమయాన్ని నివారించేందుకు సమీపమైన తార్కిక పూర్వపదమైన దావీదును స్పష్టం చేసింది.
