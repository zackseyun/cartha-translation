  yaml_path: translation/ot/1_samuel/017/002.yaml
  text: And Saul and the men of Israel gathered together and camped in the Valley of Elah[a], and they drew up for battle against the Philistines.
translation:
  language: te
  text: సౌలు మరియు ఇశ్రాయేలు పురుషులు సమకూడి ఏలా లోయలో మకాం వేశారు; ఫిలిష్తీయుల ఎదురుగా యుద్ధానికి వరుసగా నిలబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫిలిష్తీయులను ఎదుర్కొనేందుకు యుద్ధానికి వరుసగా నిలబడ్డారు.”
    reason: לִקְרַאת అనే పదబంధం ‘ఎదురుగా/ముఖంగా’ అనే స్థానిక-సైనిక భావాన్నీ, ‘ఎదుర్కొనేందుకు’ అనే దిశాత్మక భావాన్నీ సూచించగలదు.
lexical_decisions:
- source_word: וְשָׁאוּל
  choice: సౌలు
  rationale: హీబ్రూ సంధాయకం కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా సహజ కథన ప్రవాహంతో వ్యక్తమవుతుంది.
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: ఏకవచన రూపంలోని אִישׁ ఇక్కడ సమష్టి భావంలో యుద్ధానికి కూడిన పురుషులను సూచిస్తుంది; ‘సైన్యం’ అని అర్థాన్ని విస్తరించకుండా మూలానికి దగ్గరగా ఉంచింది.
- source_word: נֶאֶסְפוּ
  choice: సమకూడి
  rationale: నిఫాల్ రూపంలోని సమీకరణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: శిబిరం ఏర్పాటు చేసి నిలిచారనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: ఏలా లోయలో
  rationale: עֵמֶק ను ‘లోయ’గా అనువదించి, స్థలనామమైన הָאֵלָה ను ‘ఏలా’గా లిప్యంతరీకరించింది.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: యుద్ధపంక్తులు తీర్చారు
  rationale: సైనికులను యుద్ధ వ్యూహంలో వరుసగా నిలిపారనే హీబ్రూ ప్రయోగార్థాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులను ఎదుర్కొనేందుకు
  rationale: לִקְרַאת లోని ‘ఎదురుగా వెళ్లడం/ఎదుర్కోవడం’ అనే దిశాత్మక భావాన్ని నిలుపుతూ, సైనిక సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
