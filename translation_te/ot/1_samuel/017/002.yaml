translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభమైన శైలి. సైనిక సందర్భాన్ని స్పష్టంగా ఉంచుతూ మూలంలోని దిశాత్మక సందిగ్ధతను పాదసూచికలో నిలిపింది.
