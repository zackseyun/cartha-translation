  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
translation:
  language: te
  text: అతడు వారితో మాట్లాడుతుండగా, ఇదిగో, గాతుకు చెందిన గొల్యాతు అనే ఫిలిష్తీయ ద్వంద్వయుద్ధ వీరుడు[a], ఫిలిష్తీయుల యుద్ధశ్రేణులలోనుంచి[b] పైకి వచ్చాడు. అతడు ఈ మాటలనే పలికాడు; దావీదు విన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘రెండు పక్షాల మధ్యనున్న మనిషి’; రెండు సైన్యాల తరఫున ఒంటరి పోరాటం చేసే ప్రతినిధి యోధుడిని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పాఠరూపం క్లిష్టమైనది. ఇది బహుశా ఫిలిష్తీయుల యుద్ధశ్రేణులను లేదా సైనిక వరుసలను సూచిస్తుంది; కొందరు ‘ఫిలిష్తీయుల శిబిరాలనుంచి’ అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: מְדַבֵּר עִמָּם
  choice: వారితో మాట్లాడుతుండగా
  rationale: הוּא తో కూడిన కృదంతం కొనసాగుతున్న చర్యను సూచిస్తుంది; עִם పరస్పర సంభాషణ భావంతో ‘వారితో’ అని అనువదించబడింది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా దృష్టిని ఆకర్షించే సూచకపదం యొక్క సజీవతను నిలుపుతుంది.
- source_word: אִישׁ הַבֵּנַיִם
  choice: ద్వంద్వయుద్ధ వీరుడు
  rationale: రెండు సైన్యాల తరఫున ఒంటరి పోరాటానికి నిలిచే ప్రతినిధి యోధుడిని సూచించే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: עוֹלֶה
  choice: పైకి వచ్చాడు
  rationale: కృదంతంలోని దృశ్యాత్మక భావాన్ని సందర్భానుగుణమైన సహజ తెలుగు కథనరూపంలో వ్యక్తం చేస్తుంది.
- source_word: גָּלְיָת הַפְּלִשְׁתִּי שְׁמוֹ מִגַּת
  choice: గాతుకు చెందిన గొల్యాతు అనే ఫిలిష్తీయ
  rationale: వ్యక్తి పేరు, జాతి గుర్తింపు, స్వస్థలం అన్నింటినీ సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: ממערות פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల యుద్ధశ్రేణులలోనుంచి
  rationale: ఇక్కడి క్లిష్టమైన పాఠరూపం సందర్భంలో ఫిలిష్తీయుల సైనిక వ్యూహం లేదా వరుసలను సూచిస్తుంది; భిన్న సాధ్యార్థం పాదసూచికలో ఉంచబడింది.
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  choice: అతడు ఈ మాటలనే పలికాడు
  rationale: ఇంతకు ముందు చెప్పబడిన గొల్యాతు సవాలు మాటలనే మళ్లీ పలికాడనే వెనుకసూచనను ‘నే’ ద్వారా సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: దావీదు విన్నాడు
  rationale: హీబ్రూలోలాగే కర్మను సందర్భానికి వదిలి, సరళమైన కథన వాక్యంగా ఉంచుతుంది.
