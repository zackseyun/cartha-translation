  text: And the Philistine came on[a], coming closer to David[b], with the man carrying the shield before him.
translation:
  language: te
  text: ఆ ఫిలిష్తీయుడు దావీదు వైపు ముందుకు సాగుతూ దగ్గరికి వచ్చాడు; డాలు[a] మోసే వ్యక్తి అతని ముందు ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘డాలు’ అని అనువదించిన హీబ్రూ పదం (צִנָּה) ప్రత్యేకంగా పెద్ద డాలును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַפְּלִשְׁתִּי
  choice: ఆ ఫిలిష్తీయుడు ... ముందుకు సాగుతూ
  rationale: הלך అనే క్రియకు ప్రాథమికంగా ‘వెళ్లాడు’ అనే అర్థం ఉన్నా, యుద్ధ సందర్భంలో తరువాతి కృదంతాలతో కలిసి ప్రత్యర్థి వైపు నిరంతరంగా ముందుకు కదలడాన్ని సూచిస్తుంది.
- source_word: הֹלֵךְ וְקָרֵב אֶל דָּוִד
  choice: దావీదు వైపు ముందుకు సాగుతూ, అతనికి మరింత దగ్గరగా వచ్చాడు
  rationale: రెండు కృదంతాల వరుస కొనసాగుతున్న కదలికను, క్రమంగా సమీపించడాన్ని చిత్రిస్తుంది. ‘వైపు’ אֶל యొక్క దిశార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָאִישׁ נֹשֵׂא הַצִּנָּה
  choice: అతని డాలు మోసే వ్యక్తి
  rationale: ఈ ఉపవాక్యం ఫిలిష్తీయుని ముందడుగుతో సమకాలికమైన పరిస్థితిని తెలుపుతుంది. נֹשֵׂא అంటే ‘మోసేవాడు’; צִנָּה సాధారణంగా పెద్ద రక్షణ డాలును సూచిస్తుంది.
- source_word: לְפָנָיו
  choice: అతని ముందు నడిచాడు
  rationale: ఈ పదబంధం డాలు మోసేవాని స్థానం ఫిలిష్తీయుని ముందునని స్పష్టం చేస్తుంది; ‘నడిచాడు’ అనేది సందర్భంలో అంతర్లీనమైన సహగమనాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. హీబ్రూలోని కొనసాగుతున్న ముందడుగు భావాన్ని సహజమైన తెలుగు క్రియాక్రమంతో నిలిపాం.
