  text: Then he turned away from him toward another and said the same thing[a], and the people answered him as before.
translation:
  language: te
  text: అప్పుడు అతడు అతని దగ్గర నుండి మరొకరి వైపు తిరిగి, అదే మాట చెప్పాడు[a]. ప్రజలు అతనికి మునుపటిలాగే జవాబిచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఈ మాటలాగే చెప్పాడు.” సందర్భంలో, అతడు ముందుగా చెప్పినదానినే మళ్లీ చెప్పాడనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵאֶצְלוֹ
  choice: అతని దగ్గరనుండి ... వైపు తిరిగి
  rationale: దావీదు ఏలీయాబు దగ్గరనుండి శారీరకంగా మరొకరి వైపు తిరిగిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל מוּל אַחֵר
  choice: మరొకరి వైపు
  rationale: מוּל లోని ఎదురుగా లేదా వైపుగా తిరిగే దిశాభావాన్ని నిలుపుతూ, אַחֵר ను సందర్భానుసారంగా మరొక వ్యక్తిగా చూపిస్తుంది.
- source_word: וַיֹּאמֶר כַּדָּבָר הַזֶּה
  choice: అదే మాట అడిగాడు
  rationale: మూలంలో సాధారణంగా 'చెప్పాడు' అనే క్రియ ఉన్నా, సందర్భంలో దావీదు ముందటి ప్రశ్ననే మరొకరిని అడుగుతున్నాడు; అందువల్ల తెలుగులో 'అడిగాడు' సహజంగా భావాన్ని అందిస్తుంది. 'అదే మాట' דבר యొక్క పదం/విషయం అనే పరిధిని కాపాడుతుంది.
- source_word: וַיְשִׁבֻהוּ הָעָם
  choice: ప్రజలు అతనికి ... జవాబిచ్చారు
  rationale: హిఫిల్ రూపం ఇక్కడ ప్రతిస్పందించడం లేదా జవాబు ఇవ్వడం అనే అర్థంలో ఉంది. הָעָם ను సైనిక సందర్భమున్నప్పటికీ మూలానికి దగ్గరగా 'ప్రజలు' అని ఉంచాం.
- source_word: דָּבָר כַּדָּבָר הָרִאשׁוֹן
  choice: మునుపటిలాగే
  rationale: అక్షరార్థంగా 'మొదటి మాటవంటి మాట' అయిన ఈ పదబంధం, వారు ముందటివలె అదే జవాబు ఇచ్చారని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
