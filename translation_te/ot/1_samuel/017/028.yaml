language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
translation:
  language: te
  text: దావీదు ఆ మనుషులతో మాట్లాడుతుండగా, దావీదు పెద్ద సోదరుడు ఏలీయాబు విన్నాడు.[a] ఏలీయాబుకు దావీదు మీద కోపం మండింది. అతడు, “నువ్వు ఇక్కడికి ఎందుకు దిగివచ్చావు? అరణ్యంలో ఉన్న ఆ కొద్దిపాటి గొర్రెలను ఎవరి దగ్గర వదిలివచ్చావు? నీ అహంకారం, నీ హృదయంలోని చెడుతనం నాకు తెలుసు.[b] యుద్ధాన్ని చూడటానికి నువ్వు దిగివచ్చావు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “అతడు మాట్లాడుతుండగా” అనే భాగంలోని సర్వనామం దావీదునే సూచిస్తుంది; దీనిని “దావీదు ఆ మనుషులతో మాట్లాడుతున్నప్పుడు” అని కూడా అనువదించవచ్చు.
    reason: The attached pronoun in the Hebrew infinitive construction refers to David, and the construction has a temporal/circumstantial sense.
  - marker: b
    text: “నీ అహంకారం” అనే మాటను “నీ దురహంకారం” లేదా “నీ మితిమీరిన ధైర్యం” అని కూడా అనువదించవచ్చు; “నీ హృదయంలోని చెడుతనం” అనే మాటకు “నీ హృదయ దుష్టత్వం” అని కూడా అర్థం రావచ్చు.
    reason: The Hebrew terms זָדוֹן and רֹעַ have overlapping lexical ranges including presumption, insolence, wickedness, and evil; the note preserves these alternatives.
lexical_decisions:
- source_word: בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים
  choice: దావీదు ఆ మనుషులతో మాట్లాడుతుండగా
  rationale: ב prefixed infinitive construct conveys a contemporaneous circumstance. Telugu ‘మాట్లాడుతుండగా’ naturally preserves the ongoing temporal sense; ‘మనుషులు’ avoids specifying soldiers beyond the Hebrew.
- source_word: אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל
  choice: అతని పెద్ద అన్న ఏలీయాబు
  rationale: The phrase identifies Eliab as David’s elder/oldest brother. In this context modern Telugu naturally uses ‘పెద్ద అన్న’; the name is transliterated ఏలీయాబు.
- source_word: וַ/יִּֽחַר אַף
  choice: కోపం మండింది
  rationale: Preserves the vivid Hebrew burning-anger idiom in a natural Telugu expression.
- source_word: לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ
  choice: నువ్వు ఇక్కడికి ఎందుకు దిగివచ్చావు?
  rationale: ‘దిగివచ్చావు’ reflects ירד and the speaker-oriented arrival, while ‘ఇక్కడికి’ idiomatically conveys the demonstrative force.
- source_word: וְ/עַל מִ֨י נָטַ֜שְׁתָּ
  choice: ఎవరి దగ్గర వదిలివచ్చావు?
  rationale: This is natural Telugu for leaving the flock in someone’s care, without strengthening the verb into complete abandonment or explicit entrusting.
- source_word: מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙
  choice: ఆ కొద్దిపాటి గొర్రెలను
  rationale: ‘కొద్దిపాటి’ conveys the fewness and Eliab’s dismissive tone; ‘ఆ’ represents the demonstrative referring to the sheep.
- source_word: בַּ/מִּדְבָּ֔ר
  choice: అరణ్యంలో ఉన్న
  rationale: ‘అరణ్యం’ is the standard dignified Telugu equivalent for wilderness and remains suitable for uncultivated grazing country.
- source_word: זְדֹנְ/ךָ֗
  choice: నీ అహంకారం
  rationale: The noun can denote presumption, pride, arrogance, or insolence. ‘అహంకారం’ is clear, current Telugu and preserves the accusatory moral force without overdefining it.
- source_word: רֹ֣עַ לְבָבֶ֔/ךָ
  choice: నీ హృదయంలోని చెడుతనం
  rationale: Closely represents moral evil located in the inner person while sounding natural in modern Telugu.
- source_word: לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה
  choice: యుద్ధాన్ని చూడటానికే
  rationale: The construction expresses purpose. ‘-టానికే’ naturally carries Eliab’s emphatic accusation, while ‘యుద్ధం’ denotes the present battle or fighting without adding explanation.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ఏలీయాబు పలికిన మాటల్లో అన్నదమ్ముల మధ్య నేరుగా వినిపించే ‘నువ్వు’ రూపం ఉంచబడింది. హీబ్రూ వాక్యంలోని వరుస ‘మరియు’ అనుసంధానాలను తెలుగులో చిన్న వాక్యాలుగా మలిచి పఠన సౌలభ్యం కలిగించాం; భావ సంబంధం మాత్రం నిలుపుకున్నాం. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
