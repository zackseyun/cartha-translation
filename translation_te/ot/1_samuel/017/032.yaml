  to: 'దావీదు సౌలుతో ఇలా అన్నాడు: “అతని కారణంగా ఎవరి ధైర్యమూ దిగజారకూడదు. మీ సేవకుడు వెళ్లి ఈ ఫిలిష్తీయునితో పోరాడతాడు.”'
