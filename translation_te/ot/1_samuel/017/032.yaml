language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל אַל יִפֹּ֥ל לֵב אָדָ֖ם עָלָ֑י/ו עַבְדְּ/ךָ֣ יֵלֵ֔ךְ וְ/נִלְחַ֖ם עִם הַ/פְּלִשְׁתִּ֥י הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/032.yaml
  text: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
translation:
  language: te
  text: 'దావీదు సౌలుతో ఇలా అన్నాడు: “అతని కారణంగా ఎవరి ధైర్యమూ దిగజారకూడదు. మీ సేవకుడు వెళ్లి ఈ ఫిలిష్తీయునితో పోరాడతాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: దావీదు సౌలుతో ... అన్నాడు
  rationale: వావ్-క్రమ నిర్మాణం కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగు కథన శైలిలో ప్రత్యక్ష సంభాషణ తరువాత ‘అన్నాడు’ ఉంచడం సహజంగా ఉంటుంది.
- source_word: אַל יִפֹּל לֵב אָדָם
  choice: ఎవరి ధైర్యమూ దిగజారనివ్వకండి
  rationale: ‘ఒక మనిషి హృదయం పడిపోకూడదు’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా అర్థమయ్యేలా ‘ధైర్యం దిగజారడం’గా వ్యక్తం చేశాం; నిషేధాత్మక ఆజ్ఞ భావాన్ని నిలిపాం.
- source_word: עָלָיו
  choice: అతని కారణంగా
  rationale: సర్వనామ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో అది గోల్యాతు/ఈ ఫిలిష్తీయుణ్ణి సూచిస్తుందని పాఠకుడు గ్రహించేలా చేశాం.
- source_word: עַבְדְּךָ
  choice: మీ సేవకుడు
  rationale: రాజుతో మాట్లాడుతున్న సందర్భంలోని వినయపూర్వక స్వీయసూచనకు ‘మీ సేవకుడు’ సహజమైనది; ఇక్కడ బానిసత్వ భావం ప్రధానంగా లేదు.
- source_word: יֵלֵךְ
  choice: వెళ్లి
  rationale: ఈ అసంపూర్ణ క్రియ దావీదు సంకల్పాన్ని తెలియజేస్తుంది; తరువాతి క్రియతో కలిపి తెలుగు వాక్యంలో ‘వెళ్లి ... పోరాడతాడు’ సహజంగా ఉంటుంది.
- source_word: וְנִלְחַם
  choice: పోరాడతాడు
  rationale: దావీదు తాను చేయబోయే పనిపై వ్యక్తం చేసిన దృఢ సంకల్పాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עִם הַפְּלִשְׁתִּי הַזֶּה
  choice: ఈ ఫిలిష్తీయునితో
  rationale: పోరాట సందర్భంలో עִם యొక్క మూలార్థమైన ‘తో’ను నిలిపి, ప్రత్యర్థితో తలపడే భావాన్ని సహజంగా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి ఉపయోగించబడింది. సౌలుతో సంభాషణలో గౌరవ బహువచనం వాడబడింది. హీబ్రూ నుడికారాన్ని పదక్షరంగా కాకుండా సహజమైన తెలుగు నుడికారంతో అందించి, అక్షరార్థ చిత్రాన్ని పాదటిప్పణిలో భద్రపరిచాం.
