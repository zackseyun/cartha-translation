source:
  edition: WLC
  text: וַ/יִּטֹּשׁ֩ דָּוִ֨ד אֶת הַ/כֵּלִ֜ים מֵ/עָלָ֗י/ו עַל יַד֙ שׁוֹמֵ֣ר הַ/כֵּלִ֔ים וַ/יָּ֖רָץ הַ/מַּעֲרָכָ֑ה וַ/יָּבֹ֕א וַ/יִּשְׁאַ֥ל לְ/אֶחָ֖י/ו לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/022.yaml
  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
translation:
  language: te
  text: దావీదు తాను మోసుకొచ్చిన సామగ్రిని సామగ్రి కాపలాదారుని దగ్గర ఉంచి[a], యుద్ధపంక్తి[b] వైపు పరుగెత్తాడు. అక్కడికి చేరుకున్నాక, తన అన్నలు క్షేమంగా ఉన్నారా అని అడిగాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సామగ్రి’ అని అనువదించిన హీబ్రూ పదం వస్తువులు, సరంజామా లేదా పరికరాలు అనే విస్తృతార్థాన్ని కలిగి ఉంది. ఇక్కడ దావీదు మోసుకొచ్చిన సరుకును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సైనిక పంక్తి’; హీబ్రూ పదం యుద్ధానికి అమర్చబడిన దళాల పంక్తిని లేదా వ్యూహరచనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘తన అన్నలను క్షేమం గురించి అడిగాడు’; ఇది వారి బాగోగులు తెలుసుకోవడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: ఉంచి
  rationale: ఈ సందర్భంలో వస్తువులను విడిచిపెట్టడం లేదా పరిత్యజించడం కాదు; కాపలాదారుని వద్ద తాత్కాలికంగా ఉంచడం భావం.
- source_word: הַכֵּלִים ... מֵעָלָיו
  choice: తాను మోసుకొచ్చిన సామగ్రిని
  rationale: כֵּלִים అనేది వస్తువులు, సామగ్రి, పరికరాలు వంటి విస్తృతార్థ పదం; מֵעָלָיו అతడు వాటిని మోస్తున్నాడనే భావాన్ని ఇస్తుంది. సందర్భానికి సరిపోయేలా రెండింటినీ సహజమైన తెలుగులో కలిపి అనువదించాం.
- source_word: עַל יַד שׁוֹמֵר הַכֵּלִים
  choice: సామగ్రి కాపలాదారుని దగ్గర
  rationale: అక్షరార్థంగా ‘చేతి వద్ద’ అనే ఈ ప్రయోగం ఒకరి సంరక్షణలో ఉంచడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దగ్గర ఉంచి’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: וַיָּרָץ הַמַּעֲרָכָה
  choice: యుద్ధపంక్తి వైపు పరుగెత్తాడు
  rationale: מַעֲרָכָה ఇక్కడ యుద్ధానికి అమర్చబడిన సైనికుల పంక్తి లేదా వ్యూహరచనను సూచిస్తుంది.
- source_word: וַיָּבֹא
  choice: అక్కడికి చేరుకున్నాక
  rationale: హీబ్రూ కథన క్రమంలోని ‘వచ్చాడు’ అనే క్రియను తెలుగులో సహజమైన కాలసంబంధ ఉపవాక్యంగా వ్యక్తపరిచాం.
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  choice: తన అన్నలు క్షేమంగా ఉన్నారా అని అడిగాడు
  rationale: అక్షరార్థంగా ‘శాంతి గురించి అడిగాడు’ అనే హీబ్రూ నుడికారం వారి బాగోగులు లేదా క్షేమం గురించి విచారించడాన్ని సూచిస్తుంది. సందర్భంలోని వారు దావీదు పెద్ద అన్నలు కాబట్టి ‘అన్నలు’ ఎంచుకున్నాం.
