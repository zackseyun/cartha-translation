translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘యుద్ధపంక్తి’ వంటి పదానికి పాదటిప్పణిలో సరళమైన ప్రత్యామ్నాయం ఇచ్చాం; హీబ్రూ నుడికారాన్ని సహజ తెలుగులో వ్యక్తపరుస్తూనే దాని అక్షరరూపాన్ని పాదటిప్పణిలో నిలిపాం.
