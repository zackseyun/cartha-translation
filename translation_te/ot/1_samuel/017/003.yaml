id: 1SA.17.3
reference: 1 Samuel 17:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֞ים עֹמְדִ֤ים אֶל הָ/הָר֙ מִ/זֶּ֔ה וְ/יִשְׂרָאֵ֛ל עֹמְדִ֥ים אֶל הָ/הָ֖ר מִ/זֶּ֑ה וְ/הַ/גַּ֖יְא בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: The Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
translation:
  language: te
  text: ఫిలిష్తీయులు ఒక వైపున ఉన్న కొండమీద[a] నిలబడి ఉన్నారు; ఇశ్రాయేలు మరో వైపున ఉన్న కొండమీద నిలబడి ఉంది. వారి మధ్య లోయ[b] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కొండ’కు బదులుగా ‘పర్వతం’ అని కూడా అనువదించవచ్చు. హీబ్రూ הַר సందర్భాన్ని బట్టి ఈ రెండింటినీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘లోయ’కు బదులుగా ‘కనుమ’ అని కూడా అనువదించవచ్చు. హీబ్రూ גַּיְא నిటారైన ప్రక్కలుగల లోయను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ప్రజాసమూహపు పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంతో ఇచ్చాం. ఆరంభంలోని וְ కథన అనుసంధానాన్ని సూచిస్తుంది; ఈ వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలబెట్టడానికి ప్రత్యేకంగా ‘మరియు’ అని పెట్టలేదు.
- source_word: עֹמְדִים
  choice: నిలబడి ఉన్నారు / నిలబడి ఉంది
  rationale: వర్తమాన కృదంత రూపం దృశ్యంలో కొనసాగుతున్న స్థితిని సూచిస్తుంది. మొదటి చోట బహువచన సమూహానికి ‘ఉన్నారు’, రెండవ చోట సమష్టివాచకమైన ‘ఇశ్రాయేలు’కు సహజ తెలుగు ఏకవచన క్రియ ‘ఉంది’ వాడాం.
- source_word: אֶל הָהָר מִזֶּה
  choice: ఒక వైపున ఉన్న కొండమీద
  rationale: עמדతో కూడిన אֶל ఇక్కడ ప్రదేశ సంబంధాన్ని సూచిస్తుంది; מִזֶּה ఎదురెదురు వైపుల వ్యత్యాసాన్ని తెలియజేస్తుంది. యుద్ధభూమి సందర్భంలో הַרకు సహజంగా ‘కొండ’ను ఎంచుకున్నాం; ‘పర్వతం’ సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: וְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలంలో ఉన్న సమష్టివాచక పేరును అలాగే ఉంచాం; సందర్భంలో అది ఇశ్రాయేలు సైన్యాన్ని లేదా ప్రజలను సమష్టిగా సూచిస్తుంది.
- source_word: אֶל הָהָר מִזֶּה
  choice: మరో వైపున ఉన్న కొండమీద
  rationale: మొదటి పదబంధానికి సమాంతరంగా అనువదించి, పక్షాలు ఎదురెదురు వైపుల ఉన్నాయని సహజ తెలుగులో తెలిపాం.
- source_word: וְהַגַּיְא
  choice: లోయ
  rationale: גַּיְא లోయను లేదా నిటారైన ప్రక్కలుగల లోయను సూచించవచ్చు. ప్రధాన పాఠ్యంలో సాధారణ పాఠకులకు సులభమైన ‘లోయ’ను ఉంచాం.
- source_word: בֵּינֵיהֶם
  choice: వారి మధ్య
  rationale: రెండు పక్షాల మధ్య లోయ ఉన్నదనే స్థాన సంబంధాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలిని వాడాం. ఎదురెదురు స్థానాలను తెలుగులో సహజంగా చూపేందుకు రెండు సమాంతర వాక్యభాగాలను నిలబెట్టాం. మూలంలోని స్థితివర్ణనను ‘నిలబడి ఉన్నారు/ఉంది’తో కాపాడాం.
