source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַ/פְּלִשְׁתִּ֔י אֲנִ֗י חֵרַ֛פְתִּי אֶת מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל הַ/יּ֣וֹם הַ/זֶּ֑ה תְּנוּ לִ֣/י אִ֔ישׁ וְ/נִֽלָּחֲמָ֖ה יָֽחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/010.yaml
  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
translation:
  language: te
  text: 'అప్పుడు ఆ ఫిలిష్తీయుడు ఇలా అన్నాడు: “ఈ రోజున నేను ఇశ్రాయేలు యుద్ధ శ్రేణులను ధిక్కరించాను.[a] నాకు ఒక మనిషిని ఇవ్వండి; మనమిద్దరం ఒకరితో ఒకరం పోరాడుదాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ధిక్కరించాను” అనే హీబ్రూ క్రియను “దూషించాను,” “నిందించాను,” లేదా “అపహసించాను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: ఆ ఫిలిష్తీయుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ పదం గోల్యాతును అతని జాతి ద్వారా సూచిస్తుంది; ‘వీరుడు’ అనే భావం ఈ పదంలో స్వయంగా లేదు.
- source_word: חֵרַפְתִּי
  choice: నేను ... ధిక్కరించాను
  rationale: సైనిక సవాలు సందర్భంలో ఈ క్రియ బహిరంగ అవమానం, సవాలు రెండింటినీ సూచిస్తుంది; ‘ధిక్కరించాను’ ఆ బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מַעַרְכוֹת
  choice: యుద్ధ శ్రేణులను
  rationale: ఈ బహువచన పదం యుద్ధానికి క్రమంగా అమర్చబడిన సైనిక పంక్తులను సూచిస్తుంది; విస్తృతార్థమైన ‘సైన్యాలు’ కంటే ‘యుద్ధ శ్రేణులు’ మూలానికి దగ్గరగా ఉంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజున
  rationale: మూలంలోని నిర్దేశక ఉద్ఘాటనను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: תְּנוּ לִי אִישׁ
  choice: నాకు ఒక మనిషిని అప్పగించండి
  rationale: అక్షరార్థంగా ‘నాకు ఒక మనిషిని ఇవ్వండి’; సందర్భంలో ప్రత్యర్థి యోధుణ్ణి తనతో తలపడేందుకు ముందుకు పంపాలనే సవాలు. ‘అప్పగించండి’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְנִלָּחֲמָה
  choice: మేమిద్దరం ... పోరాడతాం
  rationale: కోహోర్టేటివ్ రూపం తలపడాలనే సవాలు లేదా సంకల్పాన్ని వ్యక్తం చేస్తుంది; తెలుగులో ఈ ప్రత్యక్ష సవాలుకు ‘పోరాడతాం’ సహజంగా సరిపోతుంది.
- source_word: יָחַד
  choice: ఒకరితో ఒకరం
  rationale: ఇక్కడ ఇద్దరూ కలిసి ఒకే పక్షంగా పోరాడటం కాదు, పరస్పరం ఏకయుద్ధం చేయడం భావం; అందువల్ల ‘ఒకరితో ఒకరం’ అస్పష్టతను నివారిస్తుంది.
