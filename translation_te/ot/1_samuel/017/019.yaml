  yaml_path: translation/ot/1_samuel/017/019.yaml
  text: Saul and they and all the men of Israel were in the Valley of Elah[a], fighting with the Philistines.
translation:
  language: te
  text: సౌలు, వారు, ఇశ్రాయేలు పురుషులందరూ ఏలా లోయలో ఫిలిష్తీయులతో[a] పోరాడుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫిలిష్తీయులకు వ్యతిరేకంగా.” హెబ్రీ పదానికి అక్షరార్థంగా “తో” అని అర్థం; అయితే యుద్ధ సందర్భంలో అది శత్రువుతో జరిగే పోరాటాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל וְ/הֵמָּה וְ/כָל אִישׁ יִשְׂרָאֵל
  choice: సౌలు, వారు, ఇశ్రాయేలు పురుషులందరూ
  rationale: మూలంలోని సౌలు, ‘వారు’ అనే స్వతంత్ర సర్వనామం, ఇశ్రాయేలు పురుషుల సమూహం—ఈ మూడు అంశాలనూ నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన జాబితాగా ఇచ్చాం. ‘వారు’ ముందు సందర్భంలోని యెష్షయి కుమారులను సూచిస్తుంది.
- source_word: בְּ/עֵמֶק הָאֵלָה
  choice: ఏలా లోయలో
  rationale: עֵמֶק అంటే ‘లోయ’; אֵלָהను సాంప్రదాయిక స్థలనామంగా ‘ఏలా’ అని లిప్యంతరీకరించాం.
- source_word: נִלְחָמִים
  choice: పోరాడుతున్నారు
  rationale: హెబ్రీ భాగధాతువు కొనసాగుతున్న చర్యను సూచిస్తుంది; తెలుగు వర్తమాన ప్రగతిశీల రూపం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עִם פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులతో
  rationale: עִם అనే విభక్త్యర్థం అక్షరార్థంగా ‘తో’; యుద్ధ సందర్భంలో ప్రత్యర్థులపై పోరాటాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో మూల రూపాన్ని నిలిపి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘వారు’ అనే స్పష్టమైన సర్వనామాన్ని తొలగించకుండా ఉంచాం; వావ్ సంధులను తెలుగులో అసహజంగా వరుసగా ‘మరియు’ అని పునరావృతం చేయకుండా విరామచిహ్నాలతో సహజీకరించాం.
