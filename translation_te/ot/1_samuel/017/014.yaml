translation:
  language: te
  text: దావీదు అందరికంటే చిన్నవాడు[a], పెద్దవారైన ఆ ముగ్గురు సౌలు వెంట వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు దావీదు అందరికంటే చిన్నవాడు, పెద్దవారైన ఆ ముగ్గురు సౌలును అనుసరించారు.” హీబ్రూ సంధానపదాన్ని ‘మరియు’ అని స్పష్టంగా అనువదించవచ్చు; చివరి క్రియను సందర్భానుసారం ‘అనుసరించారు’ అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/דָוִד
  choice: దావీదు
  rationale: వావ్ సంధానాన్ని తెలుగులో తప్పనిసరిగా ‘మరియు’ అని వ్యక్తం చేయకుండానే కథన సంబంధాన్ని సహజంగా తెలియజేయవచ్చు. దాని ప్రత్యక్ష సంధానార్థాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: הוּא הַ/קָּטָן
  choice: అందరికంటే చిన్నవాడు
  rationale: అక్షరార్థంగా ‘అతడు చిన్నవాడు’ అయినా, సోదరుల మధ్య పోలికలో ఇది ‘అందరికంటే చిన్నవాడు’ అనే అర్థాన్ని ఇస్తుంది. స్వతంత్ర సర్వనామం ఇచ్చే స్వల్ప ఉద్ఘాటనను సహజ తెలుగు వాక్యనిర్మాణంలో అంతర్లీనంగా ఉంచాం.
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  choice: పెద్దవారైన ఆ ముగ్గురు
  rationale: కుటుంబ సందర్భంలో גְּדֹלִים వయసులో పెద్ద సోదరులను సూచిస్తుంది. ‘ఆ ముగ్గురు’ అనేది ముందే ప్రస్తావించబడిన ముగ్గురు అన్నలను సహజంగా సూచిస్తుంది.
- source_word: הָלְכוּ אַחֲרֵי
  choice: వెంట వెళ్లారు
  rationale: ఈ పదబంధం అక్షరార్థమైన ‘వెంట వెళ్లడం’తో పాటు ఒక నాయకుణ్ణి అనుసరించడం అనే భావాన్నీ కలిగి ఉంటుంది. ‘వెంట వెళ్లారు’ ఈ రెండు సాధ్యతలను నిలుపుతుంది; హీబ్రూ సాధారణ గతకాల రూపాన్నీ నేరుగా ప్రతిబింబిస్తుంది.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగు బైబిల్ వాడుకకు అనుగుణమైన వ్యక్తినామ రూపం.
