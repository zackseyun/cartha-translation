source:
  edition: WLC
  text: וְ֠/אֵת עֲשֶׂ֜רֶת חֲרִצֵ֤י הֶֽ/חָלָב֙ הָ/אֵ֔לֶּה תָּבִ֖יא לְ/שַׂר הָ/אָ֑לֶף וְ/אֶת אַחֶ֨י/ךָ֙ תִּפְקֹ֣ד לְ/שָׁל֔וֹם וְ/אֶת עֲרֻבָּתָ֖/ם תִּקָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/018.yaml
  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
translation:
  language: te
  text: ఈ పది జున్ను ముక్కలను వెయ్యిమంది సైనికుల అధికారికి తీసుకెళ్లు. నీ అన్నలు క్షేమంగా ఉన్నారో తెలుసుకో, వారి దగ్గర నుంచి ఏదైనా గుర్తును తీసుకురా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి పూచీని తీసుకురా”; అంటే నీ అన్నల పరిస్థితికి నిదర్శనంగా వారి దగ్గర నుంచి ఏదైనా వస్తువు లేదా గుర్తు తీసుకురా.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  choice: జున్ను ముక్కలు
  rationale: חֲרִצִים అనేది కోసిన ముక్కలు లేదా గడ్డలుగా చేసిన పదార్థాన్ని సూచించగలదు; הֶחָלָב తో కలిసి ఇక్కడ భాగాలుగా చేసిన జున్ను భావం సహజంగా సరిపోతుంది.
- source_word: שַׂר הָאָלֶף
  choice: సహస్రాధిపతి
  rationale: שַׂר నాయకుడు లేదా సైనిక అధికారి; הָאָלֶף వెయ్యిమంది గల సైనిక విభాగాన్ని సూచిస్తుంది. ‘సహస్రాధిపతి’ ఈ సైనిక నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: תִּפְקֹד לְשָׁלוֹם
  choice: నీ అన్నల క్షేమం తెలుసుకొని
  rationale: פקד ఇక్కడ వారి పరిస్థితిని విచారించడం లేదా తెలుసుకోవడం; לְשָׁלוֹם వారి క్షేమాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ ప్రయోగం సహజంగా అర్థమవుతుంది.
- source_word: עֲרֻבָּתָם
  choice: వారి దగ్గర నుంచి ఏదైనా ఆనవాలు
  rationale: ఈ అరుదైన పదం పూచీ, గుర్తు, లేదా వారి స్థితికి నిదర్శనంగా తిరిగి తెచ్చే వస్తువును సూచించవచ్చు. ‘ఆనవాలు’ ఆ ఉద్దేశాన్ని తెలుపుతూ మూలంలోని అనిశ్చితిని పూర్తిగా తొలగించదు.
- source_word: תָּבִיא
  choice: తీసుకెళ్లు
  rationale: యెష్షయి ఉన్న చోటు నుంచి సైనిక శిబిరంలోని అధికారి దగ్గరికి చేర్చమనే సందర్భంలో తెలుగు దిశాప్రయోగానికి ‘తీసుకెళ్లు’ సహజం.
- source_word: תִּקָּח
  choice: తీసుకురా
  rationale: לקח ప్రాథమికంగా ‘తీసుకో’ అయినా, ఇక్కడ కుమారుల దగ్గర నుంచి యెష్షయి వద్దకు తిరిగి తేవడం సందర్భంలో అంతర్లీనంగా ఉంది; ‘తీసుకురా’ దానిని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
