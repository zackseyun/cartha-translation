translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వరుస ఆదేశాలను స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం. ‘సహస్రాధిపతి’ సైనిక హోదాను నిలుపుతుంది; ‘ఆనవాలు’ అనే ఎంపికకు మూలంలోని అరుదైన עֲרֻבָּתָם పదార్థాన్ని వివరించే పాదటిప్పణి జోడించబడింది.
