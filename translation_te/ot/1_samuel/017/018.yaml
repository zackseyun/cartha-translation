- from: ఈ పది జున్ను ముక్కలను సహస్రాధిపతి దగ్గరికి తీసుకెళ్లు. నీ అన్నల క్షేమం తెలుసుకొని, వారి దగ్గర నుంచి ఏదైనా ఆనవాలు తీసుకురా.[a]
