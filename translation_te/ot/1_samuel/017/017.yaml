  text: וַ/יֹּ֨אמֶר יִשַׁ֜י לְ/דָוִ֣ד בְּנ֗/וֹ קַח נָ֤א לְ/אַחֶ֨י/ךָ֙ אֵיפַ֤ת הַ/קָּלִיא֙ הַ/זֶּ֔ה וַ/עֲשָׂרָ֥ה לֶ֖חֶם הַ/זֶּ֑ה וְ/הָרֵ֥ץ הַֽ/מַּחֲנֶ֖ה לְ/אַחֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/017.yaml
  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
translation:
  language: te
  text: యెష్షయి తన కుమారుడైన దావీదుతో, “దయచేసి ఈ ఏఫా కొలత కాల్చిన ధాన్యాన్ని[a], ఈ పది రొట్టెలను తీసుకొని, శిబిరంలో ఉన్న నీ అన్నల దగ్గరికి పరుగెత్తు” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఏఫా అనేది ప్రాచీన కాలపు పొడి కొలమానం; అది సుమారు 22 లీటర్లు. లేదా “వేయించి సిద్ధం చేసిన ధాన్యం.”
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  choice: దయచేసి ... తీసుకొని
  rationale: ఆజ్ఞతో కూడిన נָא మాటలోని మృదుత్వాన్ని, అభ్యర్థన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְאַחֶיךָ
  choice: నీ అన్నలకు / నీ అన్నల దగ్గరికి
  rationale: ఇక్కడ సందర్భం దావీదు కన్నా పెద్దవారైన అతని సహోదరులను సూచిస్తుంది; మొదటి ప్రయోగంలో ל గ్రహీతలను, రెండవ ప్రయోగంలో గమ్యాన్ని సూచిస్తుంది.
- source_word: אֵיפַת
  choice: ఈ ఏఫా
  rationale: ప్రాచీన పొడి కొలమానాన్ని సాధారణ అంచనాగా మార్చకుండా మూలంలోని నిర్దిష్ట కొలత పేరును నిలుపుతుంది; దాని పరిమాణం పాదసూచికలో వివరించబడింది.
- source_word: הַקָּלִיא
  choice: వేయించిన ధాన్యం
  rationale: కాల్చి లేదా వేయించి సిద్ధం చేసిన ధాన్యాన్ని సూచించే పదానికి ఇది స్పష్టమైన ఆధునిక తెలుగు రూపం; మరో సాధ్యమైన రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: וַעֲשָׂרָה לֶחֶם
  choice: ఈ పది రొట్టెలు
  rationale: సరఫరా సందర్భంలో לֶחֶם సాధారణంగా రొట్టెను సూచించినా, సంఖ్యతో కలిసి ఇక్కడ విడివిడిగా లెక్కించగల రొట్టెలనే సూచిస్తుంది.
- source_word: וְהָרֵץ
  choice: పరుగెత్తు
  rationale: రוץ హిఫీల్ ఆజ్ఞారూపంలోని వేగం, అత్యవసరతలను ‘త్వరగా వెళ్లు’ అని సడలించకుండా సజీవంగా నిలుపుతుంది.
- source_word: הַמַּחֲנֶה
  choice: శిబిరం
  rationale: సైనిక సందర్భంలోని מַחֲנֶהకు సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: בְּנוֹ
  choice: తన కుమారుడైన
  rationale: దావీదును యెష్షయితో ఉన్న సంబంధం ద్వారా గుర్తించే అన్వయ పదబంధాన్ని తెలుగులో సహజంగా అందిస్తుంది.
