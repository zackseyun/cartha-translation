translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని ఆజ్ఞ తీవ్రతను ‘పరుగెత్తు’ అని, נָא వల్ల వచ్చే మృదుత్వాన్ని ‘దయచేసి’ అని నిలిపాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో కనిపించినందున, తెలుగు ప్రధాన పాఠ్యంలో [a]ను ‘ఏఫా’ తరువాత, [b]ను ‘వేయించిన ధాన్యం’ తరువాత ఉంచాం.
