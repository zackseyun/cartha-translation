translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గౌరవప్రదమైన సరళ శైలి. ‘ఇశ్రాయేలు కుమారులు’ అనే కఠిన అక్షరానువాదం బదులు ప్రజాసమూహాన్ని సహజంగా సూచించే ‘ఇశ్రాయేలీయులు’ వాడబడింది. అడిక్కുറിപ്പ് గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
