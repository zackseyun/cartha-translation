  yaml_path: translation/ot/1_samuel/017/053.yaml
  text: The sons of Israel returned from pursuing the Philistines[a], and they plundered their camps.
translation:
  language: te
  text: ఇశ్రాయేలీయులు ఫిలిష్తీయులను వెంబడించడం నుంచి తిరిగి వచ్చి, వారి శిబిరాలను దోచుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు ఫిలిష్తీయులను తరుమడం నుంచి తిరిగి వచ్చి, వారి శిబిరాన్ని [లేదా, శిబిరాలను] కొల్లగొట్టారు.”
    reason: ‘వెంబడించడం’కు ‘తరుమడం’ ప్రత్యామ్నాయ పదం; సందర్భాన్ని బట్టి చివరి నామవాచకాన్ని ఏకవచన శిబిరంగా కూడా అర్థం చేసుకోవచ్చని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיָּשֻבוּ
  choice: తిరిగి వచ్చి
  rationale: שׁוב అనే క్రియకు ప్రాథమిక అర్థం ‘తిరిగి రావడం.’ వరుసగా జరిగిన చర్యలను తెలుగులో సహజంగా కలిపేందుకు అసమాపక రూపం వాడబడింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఇక్కడ ప్రజాసమూహాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన ‘ఇశ్రాయేలీయులు’ ఎంచుకోబడింది.
- source_word: מִדְּלֹק אַחֲרֵי
  choice: వెంబడించడం మానుకొని
  rationale: דלק + אחרי నిర్మాణం తీవ్రంగా వెంబడించడాన్ని సూచిస్తుంది. מן ఇక్కడ ఆ చర్య నుంచి తిరిగి రావడాన్ని తెలియజేస్తుంది; తెలుగులో ‘వెంబడించడం మానుకొని తిరిగి వచ్చి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులను
  rationale: ఈ ప్రజాసమూహ నామానికి తెలుగులో సాధారణంగా ఉపయోగించే రూపం.
- source_word: וַיָּשֹׁסּוּ
  choice: దోచుకున్నారు
  rationale: שסס అంటే యుద్ధ సందర్భంలో దోచుకోవడం లేదా కొల్లగొట్టడం. ‘దోచుకున్నారు’ సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక పదం.
- source_word: מַחֲנֵיהֶם
  choice: వారి శిబిరాలను
  rationale: మసొరేటిక్ పాఠంలోని రూపం బహువచనంగా ‘వారి శిబిరాలు’ అని సహజంగా అర్థమవుతుంది; సందర్భంలో సర్వనామం ఫిలిష్తీయులను సూచిస్తుంది.
