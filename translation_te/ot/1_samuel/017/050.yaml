source:
  edition: WLC
  text: וַ/יֶּחֱזַ֨ק דָּוִ֤ד מִן הַ/פְּלִשְׁתִּי֙ בַּ/קֶּ֣לַע וּ/בָ/אֶ֔בֶן וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י וַ/יְמִיתֵ֑/הוּ וְ/חֶ֖רֶב אֵ֥ין בְּ/יַד דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
translation:
  language: te
  text: ఈ విధంగా దావీదు వడిసెలతోను ఒక రాయితోను ఫిలిష్తీయునిపై పైచేయి సాధించాడు; అతడు ఫిలిష్తీయుణ్ణి కొట్టి చంపాడు, మరియు దావీదు చేతిలో కత్తి లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఫిలిష్తీయుణ్ణి కొట్టి చంపాడు, దావీదు చేతిలో కత్తి లేకపోయినా.” హీబ్రూలోని అనుసంధాన పదాన్ని సాధారణంగా “మరియు” అని, సందర్భానుసారంగా concessive భావంలో “లేకపోయినా” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק דָּוִד מִן הַפְּלִשְׁתִּי
  choice: దావీదు ... ఫిలిష్తీయునిపై విజయం సాధించాడు
  rationale: חזק తో కూడిన מן ఇక్కడ ప్రత్యర్థికంటే బలవంతుడిగా నిరూపించుకొని అతనిపై పైచేయి సాధించడాన్ని సూచిస్తుంది. యుద్ధ సందర్భంలో ‘విజయం సాధించాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: בַּקֶּלַע
  choice: వడిసెలతో
  rationale: ב ఇక్కడ సాధనార్థకం. קלע అనేది రాయిని విసిరే వడిసెల; ‘వడిసెలతో’ ఆ సాధనాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וּבָאֶבֶן
  choice: ఒక రాయితో
  rationale: ఇక్కడ కూడా ב సాధనార్థకం. హీబ్రూలో ఏకవచనం ఉన్నందున ‘ఒక రాయి’ అని దాని సంఖ్యను నిలిపాము.
- source_word: וַיַּךְ
  choice: కొట్టి
  rationale: נכה అంటే కొట్టడం లేదా దెబ్బతీయడం. ‘కొట్టి’ సరళమైన, ప్రస్తుత తెలుగు ప్రయోగం.
- source_word: וַיְמִיתֵהוּ
  choice: చంపాడు
  rationale: מות హిఫీల్ రూపం ‘చనిపోయేలా చేయడం’, అంటే ‘చంపడం’ అని స్పష్టంగా సూచిస్తుంది.
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  choice: దావీదు చేతిలో కత్తి లేదు
  rationale: వాక్యంలోని వְ ను సాధారణ అనుసంధానంగా అర్థం చేసుకొని, తెలుగు కథనంలో సహజంగా ప్రత్యేక వాక్యంగా ఇచ్చాము. ‘చేతిలో’ అనే భౌతిక చిత్రాన్ని నిలిపాము.
theological_decisions:
- issue: చివరి వాక్యంలోని וְ యొక్క సంబంధం
  choice: ‘దావీదు చేతిలో కత్తి లేదు’ అనే సాధారణ అనుసంధాన భావం
  alternative: ‘దావీదు చేతిలో కత్తి లేకపోయినా’ అనే concessive భావం
  rationale: హీబ్రూ וְ సాధారణంగా ‘మరియు’ అని అనుసంధానించగలదు; సందర్భంలో concessive భావం సాధ్యమే కానీ వ్యాకరణపరంగా తప్పనిసరి కాదు. ప్రధాన పాఠంలో తక్కువ వ్యాఖ్యానాత్మకమైన రూపాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘వడిసెల’ ఆయుధానికి ఖచ్చితమైన తెలుగు పదంగా, ‘చేతిలో కత్తి లేదు’ మూలంలోని స్పష్టమైన చిత్రాన్ని నిలిపేలా ఉపయోగించబడ్డాయి.
