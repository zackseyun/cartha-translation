    rationale: విడిగా వాక్యం చేయడం సాధ్యమే అయినా, ‘మరియు’ని ఉంచడం మూలంలోని సాధారణ అనుసంధానాన్ని కాపాడుతూ concessive పఠనాన్ని పాదసూచికలో పరిమితం చేస్తుంది.
