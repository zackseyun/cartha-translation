  to: ఈ విధంగా దావీదు వడిసెలతోను ఒక రాయితోను ఫిలిష్తీయునిపై పైచేయి సాధించాడు; అతడు ఫిలిష్తీయుణ్ణి కొట్టి చంపాడు, మరియు దావీదు చేతిలో కత్తి లేదు.[a]
  rationale: హీబ్రూ వాక్యంలోని సాధనార్థక పదబంధాలు, ఏకవచనమైన ‘ఒక రాయి,’ కొట్టడం మరియు చంపడం అనే రెండు క్రియలు, అలాగే ‘దావీదు చేతిలో కత్తి లేదు’ అనే భౌతిక చిత్రం నిలిపాం. చివరి וְ యొక్క వివాదరహిత సాధారణ అనుసంధానాన్ని ప్రధాన పాఠంలో ఉంచి, సందర్భసిద్ధమైన concessive పఠనాన్ని మాత్రమే పాదసూచికలో ఇచ్చాం. మూలంలో లేని అదనపు వివరణను తొలగించాం.
