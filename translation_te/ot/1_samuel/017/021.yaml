- from: ఇశ్రాయేలీయులు, ఫిలిష్తీయులు యుద్ధపంక్తులను ఏర్పరచుకొని, పంక్తికి ఎదురుగా పంక్తిగా నిలిచారు.[a]
  to: ఇశ్రాయేలు మరియు ఫిలిష్తీయులు యుద్ధపంక్తికి ఎదురుగా యుద్ధపంక్తిగా తమ సైన్యాలను అమర్చారు.[a]
