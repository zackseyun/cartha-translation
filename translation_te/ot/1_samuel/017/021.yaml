  text: And Israel and the Philistines drew up battle line against battle line[a].
translation:
  language: te
  text: ఇశ్రాయేలు మరియు ఫిలిష్తీయులు యుద్ధపంక్తికి ఎదురుగా యుద్ధపంక్తిగా తమ సైన్యాలను అమర్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధవ్యూహానికి ఎదురుగా యుద్ధవ్యూహంగా.”
    reason: మַעֲרָכָה పదం ‘యుద్ధపంక్తి’తో పాటు అమర్చబడిన సైనిక వ్యూహం లేదా దళవ్యవస్థను కూడా సూచించగలదు.
lexical_decisions:
- source_word: וַתַּעֲרֹךְ
  choice: యుద్ధపంక్తులను ఏర్పరచుకొని… నిలిచారు
  rationale: ערך అనే క్రియ సైనిక సందర్భంలో దళాలను క్రమంగా అమర్చి యుద్ధానికి సిద్ధంగా నిలపడం సూచిస్తుంది. హీబ్రూలో ఏకవచన క్రియ ఉన్నప్పటికీ సంయుక్త కర్తను ఆధునిక తెలుగులో సహజంగా బహువచనంగా వ్యక్తం చేశాం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: ఇక్కడ ప్రదేశం కన్నా యుద్ధానికి సమకూడిన ఇశ్రాయేలు ప్రజలను సూచిస్తున్నందున తెలుగు సందర్భానికి సహజమైన జనవాచక రూపం వాడాం.
- source_word: וּפְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: జాతి పేరుకు ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: מַעֲרָכָה
  choice: యుద్ధపంక్తి / పంక్తి
  rationale: ఈ నామవాచకం యుద్ధానికి అమర్చిన సైనిక శ్రేణిని సూచిస్తుంది. మొదటిసారి ‘యుద్ధపంక్తులు’ అని స్పష్టం చేసి, పునరుక్త నిర్మాణంలో ‘పంక్తికి ఎదురుగా పంక్తి’ అని సహజంగా ఉంచాం.
- source_word: לִקְרַאת
  choice: ఎదురుగా
  rationale: మూలంగా ‘ఎదుర్కొనేందుకు/కలిసేందుకు’ అనే దిశార్థం ఉన్నా, ఇక్కడ పరస్పరం ఎదురెదురుగా ఉన్న సైనిక పంక్తుల భావాన్ని ‘ఎదురుగా’ స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. మూలంలోని సైనిక దృశ్యాన్ని, ‘పంక్తి… పంక్తి’ అనే పునరుక్తిని సాధ్యమైనంతవరకు నిలిపి, సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం ఎంచుకున్నాం.
