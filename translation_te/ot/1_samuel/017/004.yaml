translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ప్రతినిధి యోధుడు’ అనే రూపం సందర్భాన్ని స్పష్టం చేస్తూనే, హీబ్రూ పదబంధంలోని ప్రత్యేకతను పాదటిప్పణి ద్వారా నిలుపుతుంది. ప్రాచీన కొలతలకు తెలుగులో సుపరిచితమైన ‘మూర’, ‘జానెడు’ పదాలను వాడాం.
