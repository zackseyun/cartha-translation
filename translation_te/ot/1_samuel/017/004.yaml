language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵ֤א אִֽישׁ הַ/בֵּנַ֨יִם֙ מִ/מַּחֲנ֣וֹת פְּלִשְׁתִּ֔ים גָּלְיָ֥ת שְׁמ֖/וֹ מִ/גַּ֑ת גָּבְה֕/וֹ שֵׁ֥שׁ אַמּ֖וֹת וָ/זָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/004.yaml
  text: Then a champion came out from the camps of the Philistines[a]; his name was Goliath, from Gath[b]. His height was six cubits and a span.
translation:
  language: te
  text: అప్పుడు ఫిలిష్తీయుల శిబిరాల నుండి ఒక ప్రతినిధి యోధుడు[a] బయటకు వచ్చాడు. అతని పేరు గొల్యాతు; అతడు గాతు పట్టణానికి చెందినవాడు. అతని ఎత్తు ఆరు మూరలు, ఒక జానెడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘మధ్యనున్న మనిషి.’ బహుశా రెండు సైన్యాల మధ్యకు వచ్చి తన పక్షం తరఫున పోరాడే యోధుణ్ణి ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఆరు మూరలు, ఒక జానెడు అంటే—ఉపయోగించిన మూర కొలతను బట్టి—సుమారు 9 అడుగుల 9 అంగుళాలు (దాదాపు 3.0 మీటర్లు).
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ הַבֵּנַיִם
  choice: ప్రతినిధి యోధుడు
  rationale: ఈ హీబ్రూ పదబంధానికి అక్షరార్థంగా ‘మధ్యనున్న మనిషి’ అనే భావం ఉంది. రెండు సైన్యాల మధ్యకు వచ్చి తన పక్షం తరఫున పోరాడే యోధుణ్ణి సందర్భం సూచిస్తున్నందున, సహజమైన తెలుగులో ‘ప్రతినిధి యోధుడు’ అని అనువదించాం; పదబంధంలోని అసాధారణతను పాదటిప్పణిలో ఉంచాం.
- source_word: וַיֵּצֵא
  choice: బయటకు వచ్చాడు
  rationale: ఫిలిష్తీయుల శిబిరాల నుండి యోధుడు ముందుకు రావడాన్ని సహజమైన తెలుగు కథన శైలిలో వ్యక్తం చేస్తుంది.
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల శిబిరాల నుండి
  rationale: మూలంలోని ‘శిబిరాలు’ అనే బహువచనాన్ని నిలుపుతూ ప్రజల పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: גָּלְיָת שְׁמוֹ
  choice: అతని పేరు గొల్యాతు
  rationale: హీబ్రూ వాక్య నిర్మాణాన్ని సహజమైన తెలుగులో సూటిగా ప్రతిబింబిస్తుంది.
- source_word: מִגַּת
  choice: అతడు గాతు పట్టణానికి చెందినవాడు
  rationale: మూలంలోని ‘గాతు నుండి’ అనే Herkunft భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גָּבְהוֹ
  choice: అతని ఎత్తు
  rationale: ఈ నామవాచకం అతని ఎత్తు లేదా దేహప్రమాణాన్ని సూచిస్తుంది; ‘ఎత్తు’ సాధారణ పాఠకులకు నేరుగా అర్థమవుతుంది.
- source_word: שֵׁשׁ אַמּוֹת וָזָרֶת
  choice: ఆరు మూరలు, ఒక జానెడు
  rationale: మూలంలోని ప్రాచీన కొలతలను ప్రధాన పాఠ్యంలో నిలిపి, ఆధునిక అంచనాను పాదటిప్పణిలో ఇచ్చాం.
