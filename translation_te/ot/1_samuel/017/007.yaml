  yaml_path: translation/ot/1_samuel/017/007.yaml
  text: The shaft of his spear was like a weaver’s beam[a], and the iron head of his spear weighed six hundred shekels; and the bearer of the shield went before him.
translation:
  language: te
  text: అతని ఈటె కాడ నేతగాడి మగ్గపు దూలంలా ఉంది. అతని ఈటె ఇనుప మొన ఆరువందల షెకెల్ల బరువుండేది. డాలు[a] మోసేవాడు అతని ముందుగా నడిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పెద్ద డాలు’; హీబ్రూ పదం చిన్న చేతి డాలు కంటే శరీరాన్ని కప్పే పూర్తి పరిమాణపు డాలును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חץ חֲנִיתוֹ
  choice: అతని ఈటె కాడ
  rationale: ఈ సందర్భంలో חץ బాణాన్ని కాక, ఈటె యొక్క పొడవైన కాడను సూచిస్తుంది; మగ్గపు దూలంతో చేసిన పోలిక కూడా ఇదే అర్థాన్ని బలపరుస్తుంది.
- source_word: כמנור ארגים
  choice: నేతగాడి మగ్గపు దూలంలా
  rationale: మూలంలోని నేత పనికి సంబంధించిన దృశ్యరూపాన్ని నిలుపుతూ, ఈటె కాడ మందాన్ని, భారీతనాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: להבת חניתו
  choice: అతని ఈటె ... మొన
  rationale: להבת అక్షరార్థంగా కత్తి అంచు లేదా జ్వాలవంటి లోహ భాగాన్ని సూచించగలదు; ఈటె సందర్భంలో ‘మొన’ దాని దాడి చేసే లోహ భాగాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שש מאות שקלים ברזל
  choice: ఇనుప మొన బరువు ఆరువందల షెకెల్లు
  rationale: హీబ్రూలో ‘ఆరువందల షెకెల్ల ఇనుము’ అని సంక్షిప్తంగా ఉంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘బరువు’ చేర్చబడింది; ‘ఇనుప’ ఈటె మొన పదార్థాన్ని సూచిస్తుంది.
- source_word: נשא הצנה
  choice: డాలు మోసేవాడు
  rationale: గొల్యాతు యొక్క రక్షణ డాలును మోసే పరిచారకుడిని సూచించే మూలపదబంధాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: צנה
  choice: డాలు
  rationale: సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే పదాన్ని ప్రధాన వాక్యంలో వాడి, అది పెద్ద శరీర రక్షణ డాలు కావచ్చనే నిర్దిష్ట భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הלך לפניו
  choice: అతని ముందుగా నడిచాడు
  rationale: ఆ వ్యక్తి గొల్యాతుకు ముందు కదులుతూ వెళ్లాడనే మూలంలోని భావాన్ని నేరుగా తెలియజేస్తుంది.
