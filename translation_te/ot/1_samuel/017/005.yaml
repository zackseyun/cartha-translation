translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ప్రాచీన బరువు ప్రమాణాన్ని ప్రధాన పాఠ్యంలో ఉంచి, పాఠకునికి ఉపయోగకరమైన ఆధునిక సమానాన్ని పాదటిప్పణిలో ఇచ్చాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
