  text: וְ/כ֤וֹבַע נְחֹ֨שֶׁת֙ עַל רֹאשׁ֔/וֹ וְ/שִׁרְי֥וֹן קַשְׂקַשִּׂ֖ים ה֣וּא לָב֑וּשׁ וּ/מִשְׁקַל֙ הַ/שִּׁרְי֔וֹן חֲמֵשֶׁת אֲלָפִ֥ים שְׁקָלִ֖ים נְחֹֽשֶֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/005.yaml
  text: He had a bronze helmet on his head[a], and he was clothed with a coat of scale armor[b]; and the weight of the coat was five thousand shekels of bronze.
translation:
  language: te
  text: అతని తలపై కంచు శిరస్త్రాణం ఉంది; అతడు పొలుసుల కవచం[a] ధరించి ఉన్నాడు. ఆ కవచం బరువు ఐదువేల కంచు షెకెలులు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఒకదానిపై మరొకటి అమర్చిన లోహపు పొలుసులతో చేసిన శరీర కవచం.
    reason: lexical_clarification
  - marker: b
    text: ఐదువేల షెకెలులు సుమారు 57 కిలోగ్రాములు.
    reason: cultural_note
lexical_decisions:
- source_word: כּוֹבַע
  choice: శిరస్త్రాణం
  rationale: సైనిక సందర్భంలో తలను కాపాడే రక్షణ సామగ్రిని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘శిరస్త్రాణం’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: బైబిలు కాలపు లోహ వస్తువుల సందర్భంలో ఈ పదం రాగి లేదా కంచును సూచించగలదు; యుద్ధ కవచానికి సంప్రదాయబద్ధంగా, సందర్భోచితంగా ‘కంచు’ సరిపోతుంది.
- source_word: שִׁרְיוֹן קַשְׂקַשִּׂים
  choice: పొలుసుల కవచం
  rationale: మూలంలోని పదబంధం పొలుసుల్లా ఒకదానిపై మరొకటి అమర్చిన పలకలతో చేసిన శరీర కవచాన్ని సూచిస్తుంది. ‘గొలుసు కవచం’ అని అనడం నిర్మాణాన్ని తప్పుగా సూచించవచ్చు.
- source_word: הוּא לָבוּשׁ
  choice: ధరించి ఉన్నాడు
  rationale: అతడు ఆ కవచాన్ని వేసుకొని ఉన్న స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִשְׁקַל
  choice: బరువు
  rationale: కొలిచిన భారాన్ని తెలిపే సహజమైన తెలుగు పదం.
- source_word: חֲמֵשֶׁת אֲלָפִים שְׁקָלִים
  choice: ఐదువేల షెకెలులు
  rationale: మూలంలోని ప్రాచీన కొలమానాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, ఆధునిక అంచనాను పాదటిప్పణిలో ఇస్తుంది.
