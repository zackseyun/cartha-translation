id: 1SA.17.8
reference: 1 Samuel 17:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יַּעֲמֹ֗ד וַ/יִּקְרָא֙ אֶל מַעַרְכֹ֣ת יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר לָ/הֶ֔ם לָ֥/מָּה תֵצְא֖וּ לַ/עֲרֹ֣ךְ מִלְחָמָ֑ה הֲ/ל֧וֹא אָנֹכִ֣י הַ/פְּלִשְׁתִּ֗י וְ/אַתֶּם֙ עֲבָדִ֣ים לְ/שָׁא֔וּל בְּרוּ לָ/כֶ֥ם אִ֖ישׁ וְ/יֵרֵ֥ד אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not servants of Saul? Choose a man for yourselves[b], and let him come down to me.”
translation:
  language: te
  text: 'అతడు నిలబడి ఇశ్రాయేలు యుద్ధ శ్రేణులను ఉద్దేశించి బిగ్గరగా ఇలా అన్నాడు: “యుద్ధానికి బారులు తీరడానికి మీరెందుకు బయలుదేరి వస్తున్నారు? నేను ఆ ఫిలిష్తీయుణ్ణి కాదా? మీరు సౌలు దాసులు[a] కారా? మీ కోసం ఒక మనిషిని ఎంచుకోండి; అతడు నా దగ్గరకు దిగిరావాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకులు.” హెబ్రీ పదం עֲבָדִים సేవకులను లేదా దాసులను సూచించగలదు; ఇక్కడ “దాసులు” అనే పదం గొల్యాతు ఎగతాళిలోని అవమానకర బలాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: అతడు నిలబడి
  rationale: సందర్భంలోని శారీరక, సవాలు చేసే భంగిమను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיִּקְרָא אֶל־מַעַרְכוֹת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు యుద్ధ శ్రేణులను ఉద్దేశించి బిగ్గరగా
  rationale: קרא ఇక్కడ ప్రత్యర్థి శ్రేణులకు వినిపించే బహిరంగ పిలుపు; מַעַרְכוֹת అనేది సైనికంగా అమర్చిన శ్రేణులను సూచిస్తుంది.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: యుద్ధానికి బారులు తీరడానికి
  rationale: యుద్ధం కోసం క్రమంగా అమరడం అనే ערך పదచిత్రాన్ని సహజమైన తెలుగు సైనిక నుడికారంతో తెలియజేస్తుంది.
- source_word: אָנֹכִי הַפְּלִשְׁתִּי
  choice: నేను ఆ ఫిలిష్తీయుణ్ణి కాదా?
  rationale: నిర్దిష్ట ఉపపదాన్ని ‘ఆ’తో సూచించి, ఫిలిష్తీయుల ప్రతినిధి యోధునిగా అతడు తనను చూపించుకునే భావాన్ని నిలుపుతుంది.
- source_word: עֲבָדִים לְשָׁאוּל
  choice: సౌలు దాసులు
  rationale: עֲבָדִיםకు ‘సేవకులు’ లేదా ‘దాసులు’ అనే భావాలు ఉండవచ్చు; గొల్యాతు అవమానకరమైన ఎగతాళిలో ‘దాసులు’ అధీనస్థితి బలాన్ని మెరుగుగా తెలియజేస్తుంది.
- source_word: בְּרוּ לָכֶם אִישׁ
  choice: మీ కోసం ఒక మనిషిని ఎంచుకోండి
  rationale: ఏకవచన పురుషవాచక אִישׁను నిలుపుతూ, ప్రతినిధిగా ఒంటరి పోరాటం చేసే పురుషుణ్ణి ఎంచుకోవాలనే ఆజ్ఞను స్పష్టంగా చెబుతుంది.
- source_word: וְיֵרֵד אֵלָי
  choice: అతడు నా దగ్గరికి దిగిరానివ్వండి
  rationale: ఆజ్ఞ తరువాత వచ్చే అనుమతి/ఆదేశార్థక భావాన్ని, అలాగే ירדలోని ‘దిగివచ్చు’ దిశాభావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: עֲבָדִיםలోని సేవకత్వం లేదా దాసత్వం భావం
  choice: దాసులు
  alternative: సేవకులు
  rationale: ఇక్కడ సిద్ధాంతపరమైన నిర్ణయం కంటే గొల్యాతు ఎగతాళి యొక్క అవమానకర బలం ప్రధానమైనది. అయినా హెబ్రీ పదంలోని విస్తృతార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: אִישׁ యొక్క లింగ-నిర్దిష్టత
  choice: ఒక మనిషి
  alternative: ఒక యోధుడు / ఒకరు
  rationale: మూలపాఠం పురుష ఏకవచనాన్ని వాడుతుంది; సందర్భం ఒంటరి పురుష పోరాట యోధుని ఎంపికను సూచిస్తుంది కాబట్టి దాన్ని తటస్థీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి, కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం. ‘యుద్ధ శ్రేణులు,’ ‘బారులు తీరడం’ ద్వారా మూలంలోని సైనిక అమరిక భావం నిలుపబడింది.
