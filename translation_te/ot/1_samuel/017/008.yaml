  terminology: ఫిలిష్తీయుడు, ఇశ్రాయేలు, సౌలు రూపాలు సరైనవి. עֲבָדִיםకు ‘దాసులు’ అనేది ఈ ఎగతాళి సందర్భంలో తగిన ఎంపిక; ‘సేవకులు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణి సముచితంగా ఇస్తోంది. אִישׁకు ‘ఒక మనిషి’ పురుష ఏకవచనాన్ని నిలుపుతోంది.
