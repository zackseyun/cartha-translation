revisions:
- from: 'ఇశ్రాయేలీయులు ఇలా అన్నారు: “పైకి వస్తున్న ఈ మనిషిని చూశారా? ఇతడు ఇశ్రాయేలును ధిక్కరించడానికే పైకి వస్తున్నాడు. ఇతన్ని కొట్టి పడగొట్టే వ్యక్తిని రాజు అపారమైన ధనంతో ధనవంతుణ్ణి చేస్తాడు; తన కుమార్తెను అతనికి ఇస్తాడు; అతని తండ్రి కుటుంబాన్ని ఇశ్రాయేలులో బాధ్యతల నుంచి విముక్తం చేస్తాడు[a].”'
  to: 'ఇశ్రాయేలీయులు ఇలా అన్నారు: “పైకి వస్తున్న ఈ మనిషిని చూశారా? ఇతడు ఇశ్రాయేలును ధిక్కరించడానికే పైకి వస్తున్నాడు. ఇతన్ని కొట్టి పడగొట్టే వ్యక్తిని రాజు గొప్ప సంపదతో ధనవంతుణ్ణి చేస్తాడు; తన కుమార్తెను అతనికి ఇస్తాడు; ఇశ్రాయేలులో అతని తండ్రి ఇంటివారికి స్వేచ్ఛ కలిగిస్తాడు[a].”'
  rationale: ముఖ్య సవరణ חָפְשִׁי యొక్క మూలపాఠ్య విస్తృతతను ప్రధాన పాఠంలో కాపాడటం. ‘బాధ్యతల నుంచి’ అనే వ్యాఖ్యానాత్మక అంశాన్ని తీసివేసి, సంభావ్య పరిపాలనా అర్థాన్ని పాదసూచికలో ఉంచాం. ‘తండ్రి ఇంటివారు’ ద్వారా పితృకుటుంబం/కుటుంబగృహం అనే భావం ఆధునిక తెలుగులో సహజంగా వ్యక్తమవుతుంది.
