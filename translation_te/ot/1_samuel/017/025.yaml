source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אִ֣ישׁ יִשְׂרָאֵ֗ל הַ/רְּאִיתֶם֙ הָ/אִ֤ישׁ הָֽ/עֹלֶה֙ הַ/זֶּ֔ה כִּ֛י לְ/חָרֵ֥ף אֶת יִשְׂרָאֵ֖ל עֹלֶ֑ה וְֽ֠/הָיָה הָ/אִ֨ישׁ אֲשֶׁר יַכֶּ֜/נּוּ יַעְשְׁרֶ֥/נּוּ הַ/מֶּ֣לֶךְ עֹ֣שֶׁר גָּד֗וֹל וְ/אֶת בִּתּ/וֹ֙ יִתֶּן ל֔/וֹ וְ/אֵת֙ בֵּ֣ית אָבִ֔י/ו יַעֲשֶׂ֥ה חָפְשִׁ֖י בְּ/יִשְׂרָאֵֽל׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
translation:
  language: te
  text: 'ఇశ్రాయేలీయులు ఇలా అన్నారు: “పైకి వస్తున్న ఈ మనిషిని చూశారా? ఇతడు ఇశ్రాయేలును ధిక్కరించడానికే పైకి వస్తున్నాడు. ఇతన్ని కొట్టి పడగొట్టే వ్యక్తిని రాజు గొప్ప సంపదతో ధనవంతుణ్ణి చేస్తాడు; తన కుమార్తెను అతనికి ఇస్తాడు; ఇశ్రాయేలులో అతని తండ్రి ఇంటివారికి స్వేచ్ఛ కలిగిస్తాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలులో అతని తండ్రి ఇంటివారికి మినహాయింపు ఇస్తాడు.” ఇది బహుశా పన్నులు లేదా రాజసేవ వంటి బాధ్యతల నుంచి మినహాయింపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: రూపపరంగా ఏకవచనమైనా, వెంట వచ్చే బహువచన ప్రశ్న మరియు సంభాషణ సందర్భంలో ఇది సమూహార్థకంగా పనిచేస్తుంది. ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: הַרְּאִיתֶם
  choice: చూశారా?
  rationale: రెండవ పురుష బహువచన ప్రశ్నార్థక రూపాన్ని సహజమైన తెలుగు సంభాషణ శైలిలో వ్యక్తం చేస్తుంది.
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  choice: పైకి వస్తున్న ఈ మనిషి
  rationale: עֹלֶה అనే వర్తమాన క్రియార్థక రూపంలోని కొనసాగుతున్న కదలికను ‘పైకి వస్తున్న’ అని నిలుపుతుంది.
- source_word: כִּי
  choice: కే
  rationale: ఇక్కడి వివరణాత్మక-ఉద్ఘాటన బలాన్ని తెలుగులో ‘ధిక్కరించడానికే’ అనే నిశ్చయార్థక రూపం సహజంగా తెలియజేస్తుంది.
- source_word: לְחָרֵף
  choice: ధిక్కరించడానికి
  rationale: బహిరంగంగా అవమానిస్తూ సవాలు చేయడం అనే సందర్భార్థాన్ని ‘ధిక్కరించడం’ సంక్షిప్తంగా, గౌరవప్రదమైన శైలిలో అందిస్తుంది.
- source_word: יַכֶּנּוּ
  choice: ఇతన్ని కొట్టి పడగొట్టే
  rationale: נכה అనే క్రియలోని ‘కొట్టు/కొట్టి పడగొట్టు/హతమార్చు’ పరిధిలో మరణాన్ని అనవసరంగా స్పష్టీకరించకుండా నిర్ణాయకంగా ఓడించే భావాన్ని నిలుపుతుంది.
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  choice: అపారమైన ధనంతో ధనవంతుణ్ణి చేస్తాడు
  rationale: మూలంలోని క్రియ-నామపద పునరుక్తి ఇచ్చే తీవ్రతను తెలుగులో సహజంగా ఉండే విధంగా ‘అపారమైన ధనం’ మరియు ‘ధనవంతుణ్ణి చేస్తాడు’తో వ్యక్తం చేస్తుంది.
- source_word: בֵּית אָבִיו
  choice: అతని తండ్రి కుటుంబం
  rationale: ఇది కేవలం భవనాన్ని కాక పితృసంబంధ కుటుంబ గృహాన్ని సూచిస్తుంది; ‘కుటుంబం’ ఆధునిక తెలుగు పాఠకునికి ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో బాధ్యతల నుంచి విముక్తం చేస్తాడు
  rationale: חָפְשִׁי యొక్క ‘స్వేచ్ఛ/మినహాయింపు’ భావాన్ని ఈ పరిపాలనా సందర్భంలో సహజమైన తెలుగులో అందిస్తుంది; ఏ బాధ్యతలన్నది మూలంలో స్పష్టంగా లేనందున పాదసూచికలో సంభావ్య అర్థాన్ని వివరిస్తుంది.
theological_decisions:
- issue: కుటుంబాన్ని ‘స్వతంత్రం చేయడం’ అనే వాగ్దానం యొక్క పరిధి
  choice: బాధ్యతల నుంచి విముక్తం చేస్తాడు
  alternative: ఇశ్రాయేలులో స్వతంత్రంగా చేస్తాడు / మినహాయింపు ఇస్తాడు
  rationale: ఇది ఆధ్యాత్మిక లేదా బానిసత్వ విమోచనగా తప్పుగా నిర్ధారించకుండా, రాజుకు చెల్లించాల్సిన పన్నులు లేదా సేవల వంటి బాధ్యతల నుంచి మినహాయింపును సూచించే అవకాశం ఉంచుతుంది. నిర్దిష్ట బాధ్యత మూలపాఠ్యంలో చెప్పబడనందున పాదసూచిక ఆ అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన సంభాషణ శైలి ఉపయోగించబడింది. ‘ఇతడు/ఇతన్ని’ రూపాలు దూరంలో కనిపిస్తున్న వ్యక్తిని సూచించే సందర్భానికి సరిపోతాయి. మూలంలోని ప్రకటనాత్మక లయను సెమీకోలన్‌లతో నిలుపుతూ, అసహజమైన హీబ్రూ శబ్దానుకరణను నివారించాం.
