source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָ֗ה אֲשֶׁ֨ר הִצִּלַ֜/נִי מִ/יַּ֤ד הָֽ/אֲרִי֙ וּ/מִ/יַּ֣ד הַ/דֹּ֔ב ה֣וּא יַצִּילֵ֔/נִי מִ/יַּ֥ד הַ/פְּלִשְׁתִּ֖י הַ/זֶּ֑ה וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל דָּוִד֙ לֵ֔ךְ וַֽ/יהוָ֖ה יִהְיֶ֥ה עִמָּֽ/ךְס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
translation:
  language: te
  text: 'దావీదు ఇలా అన్నాడు: “సింహపు పంజా నుండి, ఎలుగుబంటి పంజా నుండి నన్ను విడిపించిన యహ్వేయే ఈ ఫిలిష్తీయుని చేతిలో నుండి నన్ను విడిపిస్తాడు.” అప్పుడు సౌలు దావీదుతో, “వెళ్లు; యహ్వే నీకు తోడుగా ఉండుగాక[a]” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వే నీకు తోడుగా ఉంటాడు.” హీబ్రూ వాక్యాన్ని ఆశీర్వాదం లేదా కోరికగానూ, సాధారణ భవిష్యత్ ప్రకటనగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమున్న నామరూపంగా అందిస్తుంది.
- source_word: הִצִּלַנִי / יַצִּילֵנִי
  choice: నన్ను విడిపించిన / నన్ను విడిపిస్తాడు
  rationale: ప్రమాదం లేదా శత్రువు అధీనంనుంచి రక్షించి బయటకు తేవడం అనే హిఫీల్ క్రియ భావాన్ని వ్యక్తపరుస్తూ, గత విమోచనకూ భవిష్యత్తుపై నమ్మకానికీ మధ్య ఉన్న పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: מִיַּד
  choice: పంజా నుండి / చేతి నుండి
  rationale: మూలంలో రెండుచోట్లా ‘చేతి’ అనే రూపకం ఉంది. జంతువుల విషయంలో సహజమైన తెలుగు కోసం ‘పంజా’, ఫిలిష్తీయుని విషయంలో మూల రూపకాన్ని నిలుపుతూ ‘చేతి’ వాడబడ్డాయి.
- source_word: הָאֲרִי
  choice: సింహం
  rationale: నిర్దిష్టంగా ప్రస్తావించిన జంతువును సహజమైన తెలుగు నామంతో అందిస్తుంది.
- source_word: הַדֹּב
  choice: ఎలుగుబంటి
  rationale: మూలపదానికి నేరమైన, సాధారణ ఆధునిక తెలుగు సమానం.
- source_word: הוּא
  choice: యెహోవాయే
  rationale: 'స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘-యే’ ద్వారా సహజంగా వ్యక్తపరుస్తుంది: గతంలో విడిపించిన ఆయనే ఇప్పుడు కూడా విడిపిస్తాడు.'
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: ఈ ఫిలిష్తీయుడు
  rationale: సూచక విశేషణాన్ని సహజమైన తెలుగు క్రమంలో ఉంచి, దావీదు గోల్యాతును నిర్దిష్టంగా సూచించిన భావాన్ని నిలుపుతుంది.
- source_word: לֵךְ
  choice: వెళ్లు
  rationale: సౌలు ఇచ్చిన సంక్షిప్తమైన, ప్రత్యక్ష ఆజ్ఞను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יִהְיֶה עִמָּךְ
  choice: నీకు తోడుగా ఉండుగాక
  rationale: ఈ సందర్భంలో అసంపూర్ణ క్రియారూపం ఆశీర్వాదం లేదా కోరిక భావాన్ని కలిగి ఉండవచ్చు; ‘ఉండుగాక’ ఆ వీడ్కోలు ఆశీర్వాదాన్ని గౌరవప్రదంగా తెలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం దైవిక వ్యక్తినామాన్ని నేరుగా ఉపయోగిస్తున్నందున, దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచయమున్న నామరూపంతో నిలుపుతుంది.
- issue: సౌలు చివరి మాటల భావబలం
  choice: యెహోవా నీకు తోడుగా ఉండుగాక
  alternative: యెహోవా నీకు తోడుగా ఉంటాడు
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం సందర్భానుసారం ఆశీర్వాద కోరికగానూ సాధారణ భవిష్యత్ ప్రకటనగానూ అర్థమవుతుంది. ప్రధాన పాఠంలో వీడ్కోలు ఆశీర్వాదాన్ని ఎంచుకుని, మరో సాధ్యమైన పఠనాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన గ్రంథశైలితో రూపొందించబడింది. ‘యెహోవాయే’ మూలంలోని ఉద్ఘాటనను సహజంగా నిలుపుతుంది; జంతువులకు ‘పంజా’, మనిషికి ‘చేతి’ అని వాడటం తెలుగు సహజత్వాన్నీ మూల రూపకాన్నీ సమతుల్యం చేస్తుంది.
