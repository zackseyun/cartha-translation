  terminology: యְהוָהను ‘యహ్వే’గా మార్చడం POB యొక్క నిర్ణీత దైవనామ విధానానికి అనుగుణం. ‘విడిపించిన/విడిపిస్తాడు’ మూలంలోని నצל క్రియకు గత–భవిష్యత్ పదసంబంధాన్ని నిలుపుతుంది; జంతువులకు ‘పంజా,’ మనిషికి ‘చెయ్యి’ బదులు సందర్భసహజంగా ‘చేతిలో నుండి’ వాడటం తగినది.
