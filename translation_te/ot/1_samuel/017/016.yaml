revisions:
- from: ఆ ఫిలిష్తీయుడు ఉదయం, సాయంత్రం ముందుకు వచ్చి, నలభై రోజులపాటు తన స్థానంలో నిలబడేవాడు.[a]
  to: ఆ ఫిలిష్తీయుడు ఉదయం సాయంత్రం ముందుకు వచ్చి నలభై రోజులపాటు నిలిచేవాడు.[a]
  rationale: The revision preserves the Hebrew’s repeated morning-and-evening presentation over forty days, while avoiding the added locative/possessive sense in ‘తన స్థానంలో.’ The footnote now offers a natural Telugu equivalent for the alternative ‘approached’ reading without adding ‘there’ or using an unnatural reflexive construction.
