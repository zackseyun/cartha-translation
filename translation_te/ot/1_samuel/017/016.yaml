  text: The Philistine came forward morning and evening and took his stand for forty days[a].
translation:
  language: te
  text: ఆ ఫిలిష్తీయుడు ఉదయం సాయంత్రం ముందుకు వచ్చి నలభై రోజులపాటు నిలిచేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దగ్గరకు వచ్చి ... నలభై రోజులపాటు నిలిచేవాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: ముందుకు వచ్చి
  rationale: נגשׁ అంటే సమీపించడం లేదా ముందుకు రావడం. రెండు సైన్యాల మధ్యకు అతడు పదేపదే వచ్చి సవాలు చేసిన సందర్భాన్ని ‘ముందుకు వచ్చి’ సహజంగా తెలియజేస్తుంది.
- source_word: הַפְּלִשְׁתִּי
  choice: ఆ ఫిలిష్తీయుడు
  rationale: హీబ్రూ పాఠంలో కేవలం ‘ఆ ఫిలిష్తీయుడు’ అని ఉంది. సమీప వచనాల ఆధారంగా ‘వీరుడు’ లేదా ‘యోధుడు’ అని చేర్చలేదు.
- source_word: הַשְׁכֵּם וְהַעֲרֵב
  choice: ఉదయం, సాయంత్రం
  rationale: ఈ జంట పదబంధం ప్రతిరోజూ ఉదయం మరియు సాయంత్రం జరిగిన పునరావృత చర్యను సహజమైన ఆధునిక తెలుగు శైలిలో తెలియజేస్తుంది.
- source_word: וַיִּתְיַצֵּב
  choice: తన స్థానంలో నిలబడేవాడు
  rationale: יצב యొక్క హిత్పయేల్ రూపం తనను తాను ఒక స్థానంలో నిలుపుకోవడం లేదా నిలబడడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యంలో పునరావృత చర్యను ‘నిలబడేవాడు’ తెలియజేస్తుంది.
- source_word: אַרְבָּעִים יוֹם
  choice: నలభై రోజులపాటు
  rationale: ఈ పదబంధం చర్య కొనసాగిన కాలవ్యవధిని సూచిస్తుంది; ‘రోజులపాటు’ తెలుగు నుడికారంలో ఆ వ్యవధిని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూలోని వరుస కథన క్రియలు సందర్భంలో పునరావృత చర్యను సూచిస్తున్నందున ‘నిలబడేవాడు’ అనే రూపం ఎంచుకోబడింది; పాదసూచికలో మరింత అక్షరార్థమైన ప్రత్యామ్నాయం ఇవ్వబడింది.
