  text: וְ/יָצָ֧אתִי אַחֲרָ֛י/ו וְ/הִכִּתִ֖י/ו וְ/הִצַּ֣לְתִּי מִ/פִּ֑י/ו וַ/יָּ֣קָם עָלַ֔/י וְ/הֶחֱזַ֨קְתִּי֙ בִּ/זְקָנ֔/וֹ וְ/הִכִּתִ֖י/ו וַ/הֲמִיתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/035.yaml
  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
translation:
  language: te
  text: నేను దాని వెంట వెళ్లి, దాన్ని కొట్టి, దాని నోటిలోనుండి గొర్రెపిల్లను రక్షించాను. అది నా మీదికి లేచినప్పుడు, దాని గడ్డం పట్టుకొని, దాన్ని కొట్టి చంపాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘దాని గడ్డం’ అని ఉంది. కొందరు దీనిని భావానుసారంగా ‘దాని జూలు’ లేదా ‘దాని దవడ’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי אַחֲרָיו
  choice: నేను దాని వెంట వెళ్లి
  rationale: יצא + אחרי ఇక్కడ మృగాన్ని వెంబడిస్తూ వెళ్లడాన్ని సూచిస్తుంది. పుంలింగ ఏకవచన ప్రత్యయం ముందు వచనంలోని సింహం లేదా ఎలుగుబంటిని సూచిస్తుంది; తెలుగులో జంతువుకు సహజంగా ‘దాని’ వాడబడింది.
- source_word: וְהִכִּתִיו
  choice: దాన్ని కొట్టి
  rationale: נכה అంటే కొట్టడం లేదా దెబ్బతీయడం. తరువాత ‘చంపాను’ అని స్పష్టంగా ఉన్నందున, ఇక్కడే ప్రాణాంతక భావాన్ని చేర్చలేదు; రెండు సందర్భాల్లోనూ ఒకే విధంగా అనువదించబడింది.
- source_word: וְהִצַּלְתִּי מִפִּיו
  choice: దాని నోటిలోనుండి గొర్రెపిల్లను రక్షించాను
  rationale: Hiphil נצל ‘రక్షించు/విడిపించు’; מִפִּיו అక్షరార్థంగా ‘దాని నోటిలోనుండి.’ హీబ్రూలో కర్మ ప్రత్యక్షంగా పునరుక్తం కాకపోయినా, 34వ వచనంలోని గొర్రెపిల్లే ఉద్దేశమని స్పష్టత కోసం తెలుగులో దాన్ని పేర్కొన్నాం.
- source_word: וַיָּקָם עָלַי
  choice: అది నా మీదికి లేచినప్పుడు
  rationale: קום על శత్రుత్వంతో ఎదిరించి పైకి రావడాన్ని సూచిస్తుంది. సందర్భంలోని కాల సంబంధాన్ని సహజ తెలుగులో ‘లేచినప్పుడు’గా వ్యక్తం చేశాం.
- source_word: וְהֶחֱזַקְתִּי בִּזְקָנוֹ
  choice: దాని గడ్డం పట్టుకొని
  rationale: חזק Hiphil ఇక్కడ గట్టిగా పట్టుకోవడం; זקן సాధారణంగా ‘గడ్డం.’ ‘జూలు’ లేదా ‘దవడ’గా వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలంలోని స్పష్టమైన చిత్రాన్ని నిలిపాం.
- source_word: וַהֲמִיתִּיו
  choice: చంపాను
  rationale: מות Hiphil స్పష్టంగా ‘చనిపోయేలా చేయడం/చంపడం.’ ముందున్న ‘కొట్టడం’తో తేడా నిలిచేలా ప్రత్యక్షంగా అనువదించాం.
