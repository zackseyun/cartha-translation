translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యలు, ‘కొట్టడం’ మరియు ‘చంపడం’ మధ్య తేడా, అలాగే ‘గడ్డం’ అనే స్పష్టమైన పదచిత్రం నిలుపబడ్డాయి. ప్రతి పుంలింగ హీబ్రూ ప్రత్యయానికి తెలుగులో జంతువును సూచించే సహజ నపుంసక రూపం వాడబడింది.
