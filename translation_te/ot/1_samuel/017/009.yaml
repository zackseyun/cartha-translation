  text: אִם יוּכַ֞ל לְ/הִלָּחֵ֤ם אִתִּ/י֙ וְ/הִכָּ֔/נִי וְ/הָיִ֥ינוּ לָ/כֶ֖ם לַ/עֲבָדִ֑ים וְ/אִם אֲנִ֤י אֽוּכַל ל/וֹ֙ וְ/הִכִּיתִ֔י/ו וִ/הְיִ֤יתֶם לָ֨/נוּ֙ לַ/עֲבָדִ֔ים וַ/עֲבַדְתֶּ֖ם אֹתָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your servants. But if I prevail against him and strike him down[c][b], then you will be our servants and serve us.
translation:
  language: te
  text: అతడు నాతో పోరాడి నన్ను పడగొట్టగలిగితే[a], మేము మీకు దాసులమవుతాం[b]. కాని నేను అతనిపై పైచేయి సాధించి[c] అతన్ని పడగొడితే, మీరు మాకు దాసులై మమ్మల్ని సేవిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పడగొట్టు” అని అనువదించిన హీబ్రూ క్రియకు సందర్భానుసారం “చంపు” లేదా “ఓడించు” అనే అర్థాలు కూడా రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “దాసులు” అని అనువదించిన పదాన్ని “సేవకులు” అని కూడా అనువదించవచ్చు; అయితే ఇక్కడ యుద్ధంలో ఓడిన ప్రజలు బంధిత అధీనంలో సేవ చేయడం ఉద్దేశం.
    reason: lexical_alternative
  - marker: c
    text: మరింత అక్షరార్థంగా, “నేను అతనిపై సమర్థుడనైతే”; ఈ పోరాట సందర్భంలో అది అతనిపై నెగ్గడం లేదా పైచేయి సాధించడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל לְהִלָּחֵם אִתִּי
  choice: నాతో పోరాడి ... గలిగితే
  rationale: יכל సామర్థ్యాన్ని, לחם עם పరస్పర పోరాటాన్ని సూచిస్తాయి. సహజమైన తెలుగులో షరతుతో కూడిన ద్వంద్వయుద్ధ సవాలును వ్యక్తపరుస్తుంది.
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  choice: నన్ను పడగొట్టగలిగితే / అతన్ని పడగొడితే
  rationale: נכה కొట్టడం, ఓడించడం లేదా సందర్భానుసారం చంపడం అనే నిర్ణాయక ఫలితాన్ని సూచించగలదు. ‘పడగొట్టు’ యుద్ధంలోని నిర్ణాయక దెబ్బను తెలియజేస్తూనే ‘చంపు’ అని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: עֲבָדִים
  choice: దాసులు
  rationale: ఇక్కడ ఒక ప్రజాసమూహం యుద్ధఫలితంగా మరొక సమూహానికి బంధిత అధీనంలోకి రావడం ఉద్దేశం. ‘దాసులు’ ఆ స్థితిని ‘సేవకులు’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲנִי אוּכַל לוֹ
  choice: నేను అతనిపై పైచేయి సాధించి
  rationale: יכל + ל ఈ పోరాట సందర్భంలో కేవలం సాధారణ సామర్థ్యం కాక ప్రత్యర్థిపై నెగ్గడం లేదా పైచేయి సాధించడం అనే భావాన్ని ఇస్తుంది.
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  choice: మమ్మల్ని సేవించాలి
  rationale: עבד అనే క్రియ అధీనస్థులుగా సేవ చేయడాన్ని సూచిస్తుంది. ముందు ఉన్న ‘దాసులై’ అనే స్థితికి అనుగుణంగా సహజమైన తెలుగు రూపం.
