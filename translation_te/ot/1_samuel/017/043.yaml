  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/פְּלִשְׁתִּי֙ אֶל דָּוִ֔ד הֲ/כֶ֣לֶב אָנֹ֔כִי כִּֽי אַתָּ֥ה בָֽא אֵלַ֖/י בַּ/מַּקְל֑וֹת וַ/יְקַלֵּ֧ל הַ/פְּלִשְׁתִּ֛י אֶת דָּוִ֖ד בֵּ/אלֹהָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
translation:
  language: te
  text: అప్పుడు ఫిలిష్తీయుడు దావీదుతో, “నువ్వు కర్రలతో నా దగ్గరకు వస్తున్నావని నేనేమైనా కుక్కనా?” అన్నాడు. ఆ ఫిలిష్తీయుడు తన దేవుళ్ల పేరట దావీదును శపించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: ఫిలిష్తీయుడు
  rationale: గొల్యాతు జాతిగత గుర్తింపును మాత్రమే తెలిపే సాధారణ కథన పదం; ‘యోధుడు’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: הֲכֶלֶב אָנֹכִי
  choice: నేనేమైనా కుక్కనా?
  rationale: అవమానంతో కూడిన అలంకారిక ప్రశ్నను, సాంస్కృతికంగా ముఖ్యమైన ‘కుక్క’ రూపకాన్ని అలాగే ఉంచి సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי אַתָּה בָא אֵלַי
  choice: నువ్వు ... నా మీదికి రావడానికి
  rationale: ఇక్కడ כִּי ప్రశ్నకు కారణం లేదా ఆధారాన్ని పరిచయం చేస్తుంది. యుద్ధసందర్భంలో אֵלַי ని ‘నా మీదికి’ అని అనడం సహజంగా ఉండి, సమీపిస్తున్న చర్యను స్పష్టపరుస్తుంది.
- source_word: בַּמַּקְלוֹת
  choice: కర్రలు పట్టుకొని
  rationale: מַקֵּל దండం, చేతికర్ర లేదా కర్రను సూచించగలదు. బహువచనాన్ని నిలిపి, ఫిలిష్తీయుని తృణీకార ధోరణిని సహజంగా తెలియజేస్తుంది.
- source_word: וַיְקַלֵּל
  choice: శపించాడు
  rationale: కేవలం దూషించడం కాకుండా దేవతలను ఆశ్రయించి శాపం పలికే బలమైన మతపరమైన భావాన్ని నిలుపుతుంది.
- source_word: בֵּאלֹהָיו
  choice: తన దేవుళ్ల పేరట
  rationale: בְּ ఉపసర్గను ఆహ్వానాత్మక/సాధనార్థకంగా గ్రహించి, ఫిలిష్తీయుడు తన దేవతలను ఆధారంగా చేసుకొని శపించాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఫిలిష్తీయ సందర్భంలో 3ms ప్రత్యయం గల אֱלֹהִים యొక్క సంఖ్య
  choice: తన దేవుళ్లు
  alternative: తన దేవుడు
  rationale: אֱלֹהִים ఏకవచనార్థంలోనూ రావచ్చు; అయినా ఈ అన్యజన సందర్భంలో బహువచన భావం సహజమైనది. మూలంలోని సంఖ్యాసంబంధ సాధ్యతను సిద్ధాంతపరంగా ఏకవచనంగా మార్చకుండా బహువచనాన్ని అనుసరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; నేరుగా, గౌరవప్రదంగా, కథన ప్రవాహానికి తగిన శైలి. సంభాషణలోని తృణీకారం స్పష్టంగా ఉండేలా ‘నేనేమైనా కుక్కనా?’ అని సహజీకరించాం. అందించిన ఆంగ్ల పాఠంలోని పాదసూచిక గుర్తులు వాటి పాఠ్యాలతో సరిపోలక మారిపోయినట్లు కనిపించినందున, మూల హీబ్రూ ఆధారంగా అవసరం లేని పాదసూచికలను చేర్చలేదు.
