lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు ... అన్నాడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూ మూలంలో వ్యక్తిగత పేరు కాకుండా నిర్దిష్ట బిరుదే ఉంది; అందువల్ల ‘సౌలు’ అని స్పష్టీకరించకుండా ‘రాజు’ అని ఉంచాం.
- source_word: שְׁאַל
  choice: అడిగి తెలుసుకో
  rationale: ఈ ఆజ్ఞారూప క్రియకు ‘అడుగు/విచారించు’ అనే అర్థం ఉంది. పరోక్ష ప్రశ్నతో కూడిన ఈ సందర్భంలో ‘అడిగి తెలుసుకో’ అనేది ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אַתָּה
  choice: నువ్వే
  rationale: హీబ్రూలో స్వతంత్ర సర్వనామం స్పష్టంగా ఉండి ఆజ్ఞ ఎవరికి ఇవ్వబడిందో నొక్కిచెబుతుంది. తెలుగు ‘నువ్వే’ ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: בֶּן מִי
  choice: ఎవరి కుమారుడు
  rationale: ఇది తండ్రి వంశసంబంధాన్ని అడిగే హీబ్రూ నుడికారం; ‘ఎవరి కుమారుడు’ దానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: זֶה
  choice: ఈ
  rationale: సమీపంలో ఉన్న లేదా దృష్టిలో ఉన్న యువకుణ్ణి సూచించే ఏకవచన పుంలింగ నిర్దేశకానికి ‘ఈ’ సరిపోతుంది.
- source_word: הָעָלֶם
  choice: యువకుడు
  rationale: ఈ నామవాచకం యౌవనస్థుడైన పురుషుణ్ణి సూచిస్తుంది. ‘యువకుడు’ ఆధునిక, స్పష్టమైన, గౌరవప్రదమైన తెలుగు పదం.
