  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד אֶת יָד֜/וֹ אֶל הַ/כֶּ֗לִי וַ/יִּקַּ֨ח מִ/שָּׁ֥ם אֶ֨בֶן֙ וַ/יְקַלַּ֔ע וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י אֶל מִצְח֑/וֹ וַ/תִּטְבַּ֤ע הָ/אֶ֨בֶן֙ בְּ/מִצְח֔/וֹ וַ/יִּפֹּ֥ל עַל פָּנָ֖י/ו אָֽרְצָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
translation:
  language: te
  text: అప్పుడు దావీదు తన చెయ్యిని సంచిలోకి చాపి[a], అందులోనుండి ఒక రాయి తీసి, వడిసెలతో దాన్ని విసిరి, ఫిలిష్తీయుని నుదుటిపై కొట్టాడు. ఆ రాయి అతని నుదుటిలో దిగిపోయింది[b]; అతడు నేలమీద బోర్లా పడ్డాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన చెయ్యిని రాళ్ల సంచిలో పెట్టి.” ఇక్కడి హీబ్రూ పదానికి “పాత్ర,” “వస్తువు,” లేదా “సామాను” అనే విస్తృత అర్థాలున్నాయి; సందర్భంలో ఇది దావీదు రాళ్లు ఉంచుకున్న సంచిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆ రాయి అతని నుదుటిలో నాటుకుపోయింది.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “అతడు తన ముఖంపైనే, నేలవైపు పడ్డాడు.”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ אֶל הַכֶּלִי
  choice: తన చెయ్యిని సంచిలోకి చాపి
  rationale: హీబ్రూ ప్రయోగం అక్షరార్థంగా ‘తన చెయ్యిని పాత్ర/సామాను వైపు పంపాడు’ అని ఉన్నా, రాళ్లు ఉంచిన సంచిలో చెయ్యి పెట్టిన చర్యను సహజమైన ఆధునిక తెలుగులో ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַכֶּלִי
  choice: సంచి
  rationale: כְּלִי అనే పదానికి పాత్ర, వస్తువు, సామాను వంటి విస్తృత అర్థాలున్నాయి; ఈ సందర్భంలో అది దావీదు రాళ్లు ఉంచుకున్న సంచిని సూచిస్తుంది.
- source_word: אֶבֶן
  choice: ఒక రాయి
  rationale: ఎంచుకున్న ప్రక్షేపకాన్ని సూచించే సాధారణమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: וַיְקַלַּע
  choice: వడిసెలతో దాన్ని విసిరి
  rationale: ఈ క్రియ వడిసెలను ఉపయోగించి విసరడాన్ని సూచిస్తుంది. తెలుగులో సాధనాన్ని స్పష్టంగా చెప్పడం చర్యను సహజంగా, సందిగ్ధత లేకుండా తెలియజేస్తుంది.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי אֶל מִצְחוֹ
  choice: ఫిలిష్తీయుని నుదుటిపై కొట్టాడు
  rationale: אֶל ఇక్కడ దెబ్బ తగిలిన స్థానాన్ని సూచిస్తుంది; ‘నుదుటిపై కొట్టాడు’ ఆధునిక తెలుగులో సహజమైన నిర్మాణం.
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  choice: ఆ రాయి అతని నుదుటిలో దిగబడింది
  rationale: טבע క్రియలోని లోపలికి దిగిపోవడం లేదా గట్టిగా నాటుకుపోవడం అనే భావాన్ని, అనవసరమైన శరీర నిర్మాణ వివరాలు చేర్చకుండా, ‘దిగబడింది’ నిలుపుతుంది.
- source_word: וַיִּפֹּל עַל פָּנָיו אָרְצָה
  choice: అతడు నేలమీద బోర్లా పడ్డాడు
  rationale: అక్షరార్థమైన ‘తన ముఖం మీద నేలవైపు పడ్డాడు’ అనే భంగిమను సహజమైన ఆధునిక తెలుగులో ‘బోర్లా పడ్డాడు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
