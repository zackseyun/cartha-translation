translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘వడిసెల’ అనే సుపరిచిత బైబిలు పదాన్ని ఉంచి, దాని వినియోగాన్ని క్రియలో స్పష్టంచేశాం. ప్రధాన పాఠంలో సహజమైన ‘బోర్లా పడ్డాడు’ను ఎంచుకొని, హీబ్రూ అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
