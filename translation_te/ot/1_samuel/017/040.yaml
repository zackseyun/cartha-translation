translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వడిసెల’ బైబిలు సందర్భంలో సుపరిచితమైన, ఖచ్చితమైన పదంగా ఉంచబడింది. వాగు స్వభావంపై మూలపాఠంలో ఉన్న విస్తృతార్థాన్ని అనవసరంగా నిర్దిష్టం చేయలేదు.
