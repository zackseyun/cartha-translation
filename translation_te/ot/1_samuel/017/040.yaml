source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מַקְל֜/וֹ בְּ/יָד֗/וֹ וַ/יִּבְחַר ל֣/וֹ חֲמִשָּׁ֣ה חַלֻּקֵֽי אֲבָנִ֣ים מִן הַ/נַּ֡חַל וַ/יָּ֣שֶׂם אֹ֠תָ/ם בִּ/כְלִ֨י הָ/רֹעִ֧ים אֲשֶׁר ל֛/וֹ וּ/בַ/יַּלְק֖וּט וְ/קַלְּע֣/וֹ בְ/יָד֑/וֹ וַ/יִּגַּ֖שׁ אֶל הַ/פְּלִשְׁתִּֽי־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
translation:
  language: te
  text: అతడు తన కర్రను చేతిలో తీసుకొని, వాగునుండి నునుపైన ఐదు రాళ్లను తనకోసం ఎంచుకున్నాడు. వాటిని తన దగ్గరున్న కాపరి సంచిలోని జోలెలో[a] ఉంచాడు. అతని వడిసెల అతని చేతిలో ఉంది. ఆ తరువాత అతడు ఫిలిష్తీయుని దగ్గరకు వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘జోలె’ అనే హీబ్రూ పదం (יַלְקוּט) చిన్న వస్తువులను మోసే చిన్న సంచి లేదా చేతిసంచిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  choice: తన కర్రను
  rationale: מַקֵּל కర్ర లేదా చేతికర్రను సూచిస్తుంది. కాపరి సందర్భంలో ఆధునిక తెలుగులో ‘కర్ర’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַיִּבְחַר לוֹ
  choice: తనకోసం ఎంచుకున్నాడు
  rationale: לוֹ లోని ప్రయోజనార్థక/స్వార్థక భావాన్ని నిలుపుతూ, అతడు ఉద్దేశపూర్వకంగా ఎంపిక చేసుకున్నాడనే భావాన్ని తెలుపుతుంది.
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  choice: నునుపైన ఐదు రాళ్లను
  rationale: חַלֻּקֵי ఇక్కడ నీటి ప్రవాహంలో నునుపైన రాళ్లను సూచిస్తుంది; ‘నునుపైన రాళ్లు’ సహజమైన తెలుగు రూపం.
- source_word: מִן הַנַּחַל
  choice: వాగులోనుండి
  rationale: נַחַל లోయలో ప్రవహించే వాగు లేదా కాలానుగుణ జలమార్గాన్ని సూచించగలదు. ‘వాగు’ తెలుగు భౌగోళిక వాడుకలో సహజంగా ఉండి, ప్రవాహం/వాగుపడక అనే పరిధిని తగినంతగా నిలుపుతుంది.
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ
  choice: తన దగ్గరున్న గొర్రెల కాపరి సంచిలో
  rationale: כְּלִי విస్తృతార్థకమైన ‘పాత్ర/సామగ్రి’; రాళ్లు పెట్టే సందర్భంలో సంచి భావం సరిపోతుంది. אֲשֶׁר לוֹ దాని యాజమాన్యాన్ని సూచిస్తుంది.
- source_word: וּבַיַּלְקוּט
  choice: అంటే చిన్న సంచిలో
  rationale: יַלְקוּט చిన్న వస్తువులు మోసే సంచి లేదా జోలె. ముందున్న విస్తృత పదాన్ని ఇది మరింత నిర్దిష్టంగా వివరిస్తున్న అవకాశాన్ని ‘అంటే’ ద్వారా సహజంగా చూపించాం.
- source_word: וְקַלְּעוֹ בְיָדוֹ
  choice: అతని వడిసెల అతని చేతిలో ఉంది
  rationale: హీబ్రూలో ఇది క్రియలేని వాక్యం. తెలుగులో స్పష్టత కోసం ‘ఉంది’ చేర్చి, చేతిలో ఉందనే పునరుక్త దృశ్యవివరాన్ని నిలిపాం.
- source_word: וַיִּגַּשׁ אֶל הַפְּלִשְׁתִּי
  choice: ఆ తరువాత అతడు ఫిలిష్తీయుని వైపు వెళ్లాడు
  rationale: נגשׁ దగ్గరకు వెళ్లడం లేదా సమీపించడాన్ని సూచిస్తుంది. ‘వైపు వెళ్లాడు’ సహజమైన ఆధునిక తెలుగు; కథన క్రమాన్ని ‘ఆ తరువాత’ తెలియజేస్తుంది.
