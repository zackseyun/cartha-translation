base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
translation:
  language: te
  text: దావీదు తెల్లవారగానే లేచి, గొర్రెలను ఒక కాపలాదారుని వద్ద వదిలి, సామగ్రిని తీసుకొని, యెష్షయి తనకు ఆజ్ఞాపించినట్టే బయలుదేరాడు. సైన్యం యుద్ధ పంక్తిలోకి బయలుదేరి యుద్ధనినాదం చేస్తుండగా, అతడు శిబిరానికి[a] వచ్చాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శిబిర వలయం,’ ‘బండ్లతో ఏర్పరచిన రక్షణ వలయం.’ హీబ్రూ పదం శిబిరపు వలయాకార అమరికను లేదా దాని రక్షణ పరిధిని మరింత నిర్దిష్టంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారు యుద్ధంలో లేదా యుద్ధం కోసం కేకలు వేస్తున్నారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם דָּוִד בַּבֹּקֶר
  choice: దావీదు తెల్లవారగానే లేచి
  rationale: ‘పొద్దున్నే లేచాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, దావీదు వెంటనే కార్యానికి సిద్ధమైన కథన ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: וַיִּטֹּשׁ אֶת־הַצֹּאן עַל־שֹׁמֵר
  choice: గొర్రెలను ఒక కాపరి సంరక్షణలో వదిలి
  rationale: గొర్రెలను నిర్లక్ష్యంగా విడిచిపెట్టడం కాక, మరొకరి కాపుదలలో ఉంచాడనే హీబ్రూ ప్రయోగ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּשָּׂא
  choice: సామగ్రిని తీసుకొని
  rationale: క్రియకు కర్మ ప్రత్యక్షంగా లేకపోయినా, ముందరి వచనంలోని ఆహార సామగ్రి సందర్భం దానిని సూచిస్తుంది. ‘సామగ్రి’ ఆ అంతర్నిహిత కర్మను సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר צִוָּהוּ יִשָׁי
  choice: యెష్షయి తనకు ఆజ్ఞాపించినట్టే
  rationale: צוה అనే పదంలోని ‘ఆజ్ఞాపించు’ భావాన్నీ, כַּאֲשֶׁר లోని ఖచ్చిత అనుసరణ భావాన్నీ నిలుపుతుంది.
- source_word: הַמַּעְגָּלָה
  choice: శిబిరం
  rationale: ఈ సందర్భంలో సైనిక శిబిరాన్ని సూచించే సహజమైన తెలుగు పదం. మూలపదం సూచించగల వలయాకార శిబిరం లేదా రక్షణ వలయం అనే నిర్దిష్ట అర్థాలను పాదసూచికలో ఉంచాం.
- source_word: הַחַיִל הַיֹּצֵא אֶל־הַמַּעֲרָכָה
  choice: సైన్యం యుద్ధ పంక్తిలోకి బయలుదేరి
  rationale: הַחַיִל ను సందర్భానుసారంగా ‘సైన్యం’గా, מַעֲרָכָה ను యుద్ధానికి అమర్చిన పంక్తిగా అనువదిస్తుంది.
- source_word: וְהֵרֵעוּ בַּמִּלְחָמָה
  choice: యుద్ధనినాదం చేస్తుండగా
  rationale: רוע హిఫీల్ రూపం సూచించే బిగ్గర యుద్ధకేకను సహజంగా తెలియజేస్తుంది; మరింత అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో భద్రపరుస్తుంది.
