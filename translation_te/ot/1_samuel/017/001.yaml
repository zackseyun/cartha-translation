revisions:
- from: ఫిలిష్తీయులు యుద్ధం కోసం తమ సైన్యాలను సమకూర్చారు[a]. వారు యూదాకు చెందిన శోకో దగ్గర సమావేశమై, శోకోకు అజేకాకు మధ్య[b], ఎఫెస్‌-దమ్మీము వద్ద మకాం వేశారు.
  to: ఫిలిష్తీయులు యుద్ధం కోసం తమ సైన్యాలను సమకూర్చారు[a]. వారు యూదాకు చెందిన శోకోలో సమకూడి, శోకోకూ అజేకాకూ మధ్యనున్న ఎఫెస్-దమ్మీము వద్ద మకాం వేశారు[b].
