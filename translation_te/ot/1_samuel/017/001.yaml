id: 1SA.17.1
reference: 1 Samuel 17:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּאַסְפ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/מִּלְחָמָ֔ה וַ/יֵּאָ֣סְפ֔וּ שֹׂכֹ֖ה אֲשֶׁ֣ר לִ/יהוּדָ֑ה וַֽ/יַּחֲנ֛וּ בֵּין שׂוֹכֹ֥ה וּ/בֵין עֲזֵקָ֖ה בְּ/אֶ֥פֶס דַּמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: The Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
translation:
  language: te
  text: ఫిలిష్తీయులు యుద్ధం కోసం తమ సైన్యాలను సమకూర్చారు[a]. వారు యూదాకు చెందిన శోకోలో సమకూడి, శోకోకూ అజేకాకూ మధ్యనున్న ఎఫెస్-దమ్మీము వద్ద మకాం వేశారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తమ శిబిరాలను’ లేదా ‘తమ దళాలను’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం సైనిక శిబిరాలను గానీ సైన్యాలను గానీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: శోకో యూదా ప్రాంతంలోని ఒక పట్టణం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: సమకూర్చారు
  rationale: ఆసఫ్ అనే క్రియకు ‘కూడగట్టు, సమకూర్చు’ అనే భావం ఉంది; సైన్యాలను యుద్ధానికి సిద్ధంగా ఒకచోట చేర్చడాన్ని ఈ పదం సహజంగా తెలియజేస్తుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహానికి తెలుగులో సాధారణంగా వాడే పేరు.
- source_word: מַחֲנֵיהֶם
  choice: తమ సైన్యాలను
  rationale: మహనె అనే పదం ‘శిబిరం’ లేదా ‘సైన్యం/దళం’ అని సూచించగలదు. యుద్ధం కోసం సమకూర్చడం అనే సందర్భంలో ‘సైన్యాలు’ సహజమైన భావం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం కోసం
  rationale: తక్షణ సైనిక సందర్భంలో మిల్హామా అనే పదానికి స్పష్టమైన, సహజమైన అనువాదం.
- source_word: וַיֵּאָסְפוּ
  choice: సమావేశమై
  rationale: అదే మూలక్రియ రెండోసారి రావడాన్ని నిలుపుతూ, తెలుగులో అనవసర పునరుక్తి లేకుండా ఒకచోట కూడిన భావాన్ని తెలియజేస్తుంది.
- source_word: שֹׂכֹה
  choice: శోకో
  rationale: హీబ్రూ స్థలనామానికి ధ్వన్యనుసార రూపం.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: యూదాకు చెందిన
  rationale: లామెద్ నిర్మాణంలోని ప్రాదేశిక అనుబంధం లేదా స్వామ్య భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: హనా అంటే శిబిరం వేయడం; ఆధునిక తెలుగులో ‘మకాం వేశారు’ సహజంగా, గౌరవప్రదంగా వినిపిస్తుంది.
- source_word: בֵּין ... וּבֵין
  choice: …కు …కు మధ్య
  rationale: రెండు ప్రదేశాల మధ్యనున్న స్థితిని తెలిపే సహజ తెలుగు నిర్మాణం.
- source_word: עֲזֵקָה
  choice: అజేకా
  rationale: హీబ్రూ స్థలనామానికి ధ్వన్యనుసార రూపం.
- source_word: בְּאֶפֶס דַּמִּים
  choice: ఎఫెస్‌-దమ్మీము వద్ద
  rationale: దీనిని పదార్థానువాదం చేయకుండా స్థలనామంగా తీసుకున్నాం; శిబిర స్థలాన్ని తెలపడానికి ‘వద్ద’ సహజం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వావ్-క్రమ కథన రూపానికి మూలంలో ప్రత్యేకమైన ‘ఇప్పుడు’ పదం లేనందున అలాంటి కాలసూచక పదాన్ని చేర్చలేదు. స్థలనామాలు మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
