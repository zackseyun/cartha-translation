source:
  edition: WLC
  text: וַ/יָּקֻ֣מוּ אַנְשֵׁי֩ יִשְׂרָאֵ֨ל וִ/יהוּדָ֜ה וַ/יָּרִ֗עוּ וַֽ/יִּרְדְּפוּ֙ אֶת הַ/פְּלִשְׁתִּ֔ים עַד בּוֹאֲ/ךָ֣ גַ֔יְא וְ/עַ֖ד שַׁעֲרֵ֣י עֶקְר֑וֹן וַֽ/יִּפְּל֞וּ חַֽלְלֵ֤י פְלִשְׁתִּים֙ בְּ/דֶ֣רֶךְ שַׁעֲרַ֔יִם וְ/עַד גַּ֖ת וְ/עַד עֶקְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/052.yaml
  text: Then the men of Israel and Judah rose up and shouted[a], and they pursued the Philistines as far as Gai and as far as the gates of Ekron. The slain Philistines fell along the road to Shaaraim[b], as far as Gath and as far as Ekron.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు మరియు యూదా పురుషులు లేచి యుద్ధకేకలు వేసి[a], ఫిలిష్తీయులను గయి వరకు[b], ఎక్రోను ద్వారాల వరకు తరిమారు. హతమైన ఫిలిష్తీయులు షారయిముకు వెళ్లే దారి పొడవునా, గాతు వరకు, ఎక్రోను వరకు పడిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గట్టిగా కేకలు వేశారు.’ హీబ్రూ క్రియ ఇక్కడ సమర కేకను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘నీవు లోయకు వచ్చేవరకు.’ ఈ పదబంధం పాఠ్యపరంగానూ వాక్యనిర్మాణపరంగానూ క్లిష్టమైనది; కొందరు దీనిని ‘గయి’ అనే స్థలనామంగా గ్రహిస్తారు.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: లేచి
  rationale: קום అనే క్రియకు కథన క్రమంలో సహజమైన అర్థం ‘లేచారు’; గొల్యాతు పతనం తరువాత సైనికులు వెంటనే కార్యానికి దిగడాన్ని ఇది సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה
  choice: ఇశ్రాయేలు, యూదా పురుషులు
  rationale: אַנְשֵׁי అంటే అక్షరార్థంగా ‘పురుషులు’; ఇక్కడ సైనిక సందర్భం ఉన్నందున లింగ సూచనను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఇచ్చాం.
- source_word: וַיָּרִעוּ
  choice: యుద్ధకేకలు వేసి
  rationale: רוע ఇక్కడ సాధారణంగా అరవడం కంటే సైనిక విజయోత్సాహపు లేదా సమరపు కేకను సూచిస్తుంది. సందర్భార్థాన్ని స్పష్టంగా తెలిపే సహజ తెలుగు ప్రయోగం ఇది.
- source_word: וַיִּרְדְּפוּ
  choice: తరిమారు
  rationale: רדף సైనిక సందర్భంలో వెంబడించడం లేదా తరమడం. పారిపోతున్న ఫిలిష్తీయుల నేపథ్యానికి ‘తరిమారు’ సహజంగా సరిపోతుంది.
- source_word: עַד בּוֹאֲךָ גַיְא
  choice: లోయ ప్రవేశం వరకు
  rationale: ఈ హీబ్రూ పదబంధం పాఠ్యపరంగానూ వాక్యనిర్మాణపరంగానూ క్లిష్టమైనది. సందర్భంలో ‘లోయలోకి ప్రవేశించే చోటు వరకు’ అనే భావం సుస్పష్టంగా ఉంటుంది; స్థలనామంగా గ్రహించే అవకాశాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: וְעַד שַׁעֲרֵי עֶקְרוֹן
  choice: ఎక్రోను ద్వారాల వరకు
  rationale: పట్టణానికి చేరుకునే భౌగోళిక హద్దును నేరుగా తెలియజేస్తుంది; ‘ద్వారాలు’ అనే బహువచనాన్ని నిలిపాం.
- source_word: וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయులలో హతులైనవారు ... పడిపోయారు
  rationale: חַלְלֵי అనేది కేవలం గాయపడినవారిని కాక, ఆయుధాల చేత హతమైనవారిని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో స్పష్టత కోసం సంబంధవాచక రూపాన్ని వాడాం.
- source_word: בְּדֶרֶךְ שַׁעֲרַיִם
  choice: షారయిముకు వెళ్లే దారి పొడవునా
  rationale: בְּדֶרֶךְ తో కూడిన స్థలనామం ఆ ప్రదేశానికి వెళ్లే మార్గాన్ని సూచిస్తుంది. ‘దారి పొడవునా’ మృతులు మార్గమంతటా పడిన భావాన్ని సహజంగా ఇస్తుంది.
- source_word: וְעַד גַּת וְעַד עֶקְרוֹן
  choice: గాతు వరకు, ఎక్రోను వరకు
  rationale: మూలంలోని పునరుక్త עַד ను రెండు సార్లు ‘వరకు’గా నిలిపి, నష్టాల విస్తృతిని సూచించే ఉద్ఘాటనను కాపాడాం.
