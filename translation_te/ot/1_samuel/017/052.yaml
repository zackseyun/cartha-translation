translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. సైనిక సందర్భం స్పష్టంగా ఉండేలా ‘యుద్ధకేకలు’, ‘తరిమారు’, ‘హతులైనవారు’ అనే సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. క్లిష్టమైన భౌగోళిక పదబంధాన్ని ప్రధాన పాఠ్యంలో చదవడానికి సహజంగా ఇచ్చి, దాని నిజమైన అనిశ్చితిని పాదటిప్పణిలో భద్రపరిచాం.
