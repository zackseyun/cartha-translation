  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף יְהוָ֥ה קְרֹא שְׁמוּאֵל֮ בַּ/שְּׁלִשִׁית֒ וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יָּ֣בֶן עֵלִ֔י כִּ֥י יְהוָ֖ה קֹרֵ֥א לַ/נָּֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: te
  text: యాహ్వే సమూయేలును మళ్లీ పిలిచాడు—ఇది మూడోసారి. అతడు లేచి ఏలీ దగ్గరికి వెళ్లి, “ఇదిగో, నేను ఇక్కడ ఉన్నాను; ఎందుకంటే మీరు నన్ను పిలిచారు” అన్నాడు. అప్పుడు యాహ్వే ఆ బాలుణ్ణి పిలుస్తున్నాడని ఏలీ గ్రహించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא
  choice: మళ్లీ పిలిచాడు
  rationale: יָסַף + క్రియావాచక రూపం ఇక్కడ చర్య పునరావృతమైందని సూచిస్తుంది. తెలుగు కథనంలో ‘మళ్లీ పిలిచాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: בַּשְּׁלִשִׁית
  choice: మూడోసారి
  rationale: ఇది పిలుపు మూడవసారి జరిగినట్లు తెలిపే క్రియావిశేషణ ప్రయోగం; ‘మూడోసారి’ ఆధునిక తెలుగులో సహజం.
- source_word: וַיָּקָם
  choice: అతడు లేచి
  rationale: కథన క్రమాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיֵּלֶךְ אֶל־עֵלִי
  choice: ఏలీ దగ్గరికి వెళ్లి
  rationale: ఏలీ వైపు వెళ్లిన కదలికను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִנְנִי
  choice: ఇదిగో, నేనున్నాను
  rationale: పిలుపుకు సిద్ధతతో ఇచ్చే ప్రత్యుత్తరాన్ని వ్యక్తపరుస్తూ, హీబ్రూ ప్రయోగంలోని దృష్టి ఆకర్షణ భావాన్నీ నిలుపుతుంది.
- source_word: כִּי קָרָאתָ לִי
  choice: మీరు నన్ను పిలిచారు కదా
  rationale: כִּי ఇక్కడ సమూయేలు రావడానికి కారణాన్ని తెలుపుతుంది. ఏలీ పట్ల గౌరవార్థక బహువచనం సహజ తెలుగు సంభాషణకు అనుగుణం; ‘కదా’ అతని నిశ్చయాన్ని వ్యక్తపరుస్తుంది.
- source_word: וַיָּבֶן
  choice: గ్రహించాడు
  rationale: ఏలీ పరిస్థితిని అప్పుడే అర్థం చేసుకున్నాడనే భావాన్ని ‘గ్రహించాడు’ చక్కగా తెలియజేస్తుంది.
- source_word: קֹרֵא
  choice: పిలుస్తున్నాడని
  rationale: హీబ్రూ కర్తరి వర్తమాన రూపంలోని కొనసాగుతున్న చర్య భావాన్ని తెలుగు ప్రగతిశీల రూపం నిలుపుతుంది.
- source_word: לַנָּעַר
  choice: ఆ బాలుణ్ణి
  rationale: ఈ సందర్భంలో נַעַר ఏలీ సంరక్షణలో ఉన్న యువ సమూయేలును సూచిస్తుంది; ‘బాలుడు’ వయస్సు, కథన సందర్భానికి తగినది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: కర్తను స్పష్టం చేయడం
  choice: యెహోవాయే ... పిలుస్తున్నాడని
  alternative: యెహోవా ... పిలుస్తున్నాడని
  rationale: హీబ్రూ వాక్యంలో ఏలీకి కలిగిన కొత్త అవగాహన—పిలుస్తున్నది తాను కాదు, యెహోవా—అనే వ్యత్యాసం సందర్భంలో అంతర్భూతంగా ఉంది. తెలుగు ‘యే’ ఆ వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది, కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. ఏలీని ఉద్దేశించిన మాటలో తెలుగు సామాజిక గౌరవానికి అనుగుణంగా ‘మీరు’ వాడబడింది. మూలపాఠంలోని పునరుక్తి, చర్యల క్రమం, కర్తరి వర్తమాన రూప భావం నిలుపబడ్డాయి.
