revisions:
- from: యెహోవా మూడోసారి సమూయేలును మళ్లీ పిలిచాడు. అతడు లేచి ఏలీ దగ్గరికి వెళ్లి, “ఇదిగో, నేనున్నాను; మీరు నన్ను పిలిచారు కదా” అన్నాడు. అప్పుడు యెహోవాయే ఆ బాలుణ్ణి పిలుస్తున్నాడని ఏలీ గ్రహించాడు.
  to: యాహ్వే సమూయేలును మళ్లీ పిలిచాడు—ఇది మూడోసారి. అతడు లేచి ఏలీ దగ్గరికి వెళ్లి, “ఇదిగో, నేను ఇక్కడ ఉన్నాను; ఎందుకంటే మీరు నన్ను పిలిచారు” అన్నాడు. అప్పుడు యాహ్వే ఆ బాలుణ్ణి పిలుస్తున్నాడని ఏలీ గ్రహించాడు.
  rationale: The revision aligns the divine name with the POB’s required Yahweh rendering, removes an added conversational nuance, and improves the Telugu handling of the Hebrew idiom וַיֹּסֶף ... בַּשְּׁלִשִׁית while retaining both “again” and “a third time.” No footnotes are required because the source text is not textually disputed here.
  reviewer_model: gpt-5.6-terra
