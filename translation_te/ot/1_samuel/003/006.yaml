id: 1SA.3.6
reference: 1 Samuel 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣סֶף יְהוָ֗ה קְרֹ֣א עוֹד֮ שְׁמוּאֵל֒ וַ/יָּ֤קָם שְׁמוּאֵל֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יֹּ֛אמֶר לֹֽא קָרָ֥אתִי בְנִ֖/י שׁ֥וּב שְׁכָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: te
  text: అప్పుడు యెహోవా సమూయేలును మళ్లీ పిలిచాడు. సమూయేలు లేచి ఏలీ దగ్గరికి వెళ్లి, “ఇదిగో, నేనున్నాను; మీరు నన్ను పిలిచారని” అన్నాడు. అయితే ఏలీ, “నా కుమారుడా, నేను పిలవలేదు. తిరిగి వెళ్లి పడుకో” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף יְהוָה קְרֹא עוֹד
  choice: అప్పుడు యెహోవా మళ్లీ ... పిలిచాడు
  rationale: హెబ్రీయులోని ‘మరల చేశాడు’ అనే కొనసాగింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘మళ్లీ’తో వ్యక్తం చేశాం; దైవనామం יהוהను ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: הִנְנִי
  choice: ఇదిగో, నేనున్నాను
  rationale: పిలుపుకు సిద్ధతతో ఇచ్చే సాంప్రదాయ హెబ్రీయ ప్రతిస్పందనను అర్థవంతంగా, గౌరవభరితంగా నిలుపుతుంది.
- source_word: כִּי קָרָאתָ לִי
  choice: మీరు నన్ను పిలిచారు కదా
  rationale: כִּי ఇక్కడ సమూయేలు రావడానికి కారణాన్ని సూచిస్తుంది; సంభాషణలో సహజంగా వినిపించే ‘కదా’ అతని నిశ్చయాన్ని కూడా తెలియజేస్తుంది.
- source_word: בְנִי
  choice: నా కుమారుడా
  rationale: ఏలీ పలికిన ఆప్యాయ సంబోధనను యథాతథంగా నిలిపాం.
- source_word: שׁוּב שְׁכָב
  choice: తిరిగి వెళ్లి పడుకో
  rationale: ‘తిరిగి వెళ్లి పడుకో’ అనే సందర్భార్థాన్ని సహజమైన తెలుగు ఆజ్ఞారూపంలో అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపంలో నిలిపాం.
- issue: పిలుపు యొక్క ప్రత్యక్ష వాక్యరూపం
  choice: “సమూయేలు!” అని పిలిచాడు
  alternative: సమూయేలును పిలిచాడు
  rationale: మసొరా విభజనలో ‘సమూయేలు’ తదుపరి చర్యకు కర్తగా కూడా చదవబడగలిగినా, కథా సందర్భం దేవుడు అతని పేరును పలికి పిలిచాడని సూచిస్తుంది; ప్రత్యక్ష పిలుపు తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవార్థక సంభాషణలో సమూయేలు ఏలీని ‘మీరు’ అని సంబోధిస్తాడు. వాక్యశైలి సరళంగా ఉన్నా కథన గౌరవాన్ని నిలుపుతుంది.
