  terminology: ‘ఏలీ,’ ‘తన స్థలంలో,’ and ‘చూడలేకపోయాడు’ are appropriate. ‘కళ్ల చూపు’ naturally expresses the collective visual sense while avoiding an unnatural literal plural construction.
