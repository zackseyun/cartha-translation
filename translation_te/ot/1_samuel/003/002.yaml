  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/עֵלִ֖י שֹׁכֵ֣ב בִּ/מְקֹמ֑/וֹ ו/עינ/ו הֵחֵ֣לּוּ כֵה֔וֹת לֹ֥א יוּכַ֖ל לִ/רְאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/002.yaml
  text: On that day[a], Eli was lying down in his place, and his eyes had begun to grow dim; he could not see.
translation:
  language: te
  text: ఆ రోజున ఏలీ తన స్థలంలో పడుకొని ఉన్నాడు; అతని కళ్ల చూపు మందగించడం మొదలైంది[a], అతడు చూడలేకపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఒక హీబ్రూ పఠనం ప్రకారం, ‘అతని కన్ను మసకబారడం మొదలైంది.’ ఈ పదం చూపును సమష్టిగా సూచించవచ్చు; అందువల్ల ప్రధాన పాఠంలో ‘కళ్ల చూపు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఈ కథన సూత్రం నేపథ్య పరిస్థితిని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో తదుపరి కాలవాచక వాక్యంతోనే దాని కథన కార్యం సహజంగా వ్యక్తమవుతుంది; అదనంగా ‘అప్పుడు’ చేరిస్తే మూలంలో లేని స్పష్టమైన కాలసూచన వచ్చినట్లు అవుతుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: ఉపసర్గ, ‘రోజు’ అనే నామవాచకం, సూచకపదం కలిగిన మూలవ్యక్తీకరణకు నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: שֹׁכֵב
  choice: పడుకొని ఉన్నాడు
  rationale: వర్తమాన కృదంతం ఏలీ అప్పటికి కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘పడుకొని ఉన్నాడు’ ఆ అవధిసూచక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בִּמְקֹמוֹ
  choice: తన స్థలంలో
  rationale: מָקוֹם అంటే ‘స్థలం’. మూలపాఠం ‘గది’ అని నిర్దిష్టంగా చెప్పనందున దానిని చేర్చలేదు; తెలుగు వాక్యంలో కర్తను తిరిగి సూచించడానికి ‘తన’ సహజంగా ఉంది.
- source_word: וְעֵינוֹ
  choice: అతని కన్నులు
  rationale: రూపం ఏకవచనంగా అర్థమయ్యే అవకాశమున్నా, సందర్భంలో అది చూపును సమష్టిగా సూచిస్తుంది; తెలుగులో ఈ సందర్భానికి బహువచనం సహజం. మూలరూపంలోని ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: הֵחֵלּוּ כֵהוֹת
  choice: మసకబారడం మొదలైంది
  rationale: ఈ నిర్మాణం చూపు మందగించడం ప్రారంభమైనదనే ఆరంభాత్మక, క్రమవికాస భావాలను రెండింటినీ తెలియజేస్తుంది.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: అతడు చూడలేకపోయాడు
  rationale: ఏలీ చూపు క్షీణించిన ఫలితంగా అతనికి చూడగల సామర్థ్యం లేకపోయిందని ఈ నేరమైన తెలుగు రూపం తెలియజేస్తుంది; మూలంలోని వాక్య విభాగాన్ని స్వతంత్రంగా ఉంచుతుంది.
