    rationale: ‘కన్నులు’ is plural, while ‘మొదలైంది’ is singular. Although the intended sense is clear, the construction does not read naturally as modern standard Telugu. Recasting it as collective ‘కళ్ల చూపు’ also reflects the source’s idiomatic reference to eyesight.
