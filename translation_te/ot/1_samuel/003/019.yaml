  text: וַ/יִּגְדַּ֖ל שְׁמוּאֵ֑ל וַֽ/יהוָה֙ הָיָ֣ה עִמּ֔/וֹ וְ/לֹֽא הִפִּ֥יל מִ/כָּל דְּבָרָ֖י/ו אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
translation:
  language: te
  text: సమూయేలు ఎదిగాడు. యాహ్వే అతనితో ఉన్నాడు; ఆయన అతని మాటల్లో ఒక్కటి కూడా నేలపై పడనివ్వలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని మాటల్లో ఏదీ విఫలమవనివ్వలేదు.” హీబ్రూ నుడికారం అక్షరార్థంగా, “అతని మాటల్లో ఒక్కటి కూడా నేలపై పడనివ్వలేదు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: ఎదుగుతూ వచ్చాడు
  rationale: גדל ఇక్కడ సమూయేలు వయస్సులోను పరిపక్వతలోను ఎదగడాన్ని సూచిస్తుంది. కేవలం శారీరక ఎదుగుదలకో, గొప్పవాడవడానికో పరిమితం చేయకుండా సంక్షిప్త కథన భావాన్ని నిలుపుతుంది.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: తెలుగులో స్థిరపడిన బైబిలు వ్యక్తినామ రూపం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించిన రూపం.
- source_word: הָיָה עִמּוֹ
  choice: అతనికి తోడుగా ఉండి
  rationale: దేవుని సన్నిధి, సహాయం, అనుగ్రహం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ మూలంలోని ‘అతనితో ఉన్నాడు’ అనే భావాన్ని కాపాడుతుంది.
- source_word: וְלֹא הִפִּיל
  choice: ఒక్కటి కూడా ... పడనివ్వలేదు
  rationale: נפל యొక్క హిఫీల్ రూపంలోని కారణార్థాన్ని, నిరాకరణను స్పష్టంగా నిలుపుతుంది.
- source_word: מִכָּל דְּבָרָיו
  choice: అతని మాటల్లో ఒక్కటి కూడా
  rationale: ‘అతని మాటలన్నిటిలోనుండి ఏదీ కాదు’ అనే హీబ్రూ నిర్మాణానికి సహజమైన తెలుగు రూపం; ‘ప్రవచనాలు’ అని భావాన్ని అనవసరంగా కుదించదు.
- source_word: אָרְצָה
  choice: నేలపడ
  rationale: దిశను సూచించే రూపాన్ని ‘నేలపడటం’ అనే చిత్రాత్మక నుడికారంలో నిలుపుతుంది; ఇక్కడ మాట విఫలం కాకపోవడం అంతర్లీన భావం.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా అందించడం మూలరూపానికి దగ్గరగా ఉంటుంది.
- issue: ‘అతని మాటల్లో ఒక్కటి కూడా నేలపడనివ్వలేదు’ అనే నుడికారం
  choice: హీబ్రూ చిత్రాత్మక నుడికారాన్ని ప్రధాన పాఠంలో నిలుపడం
  alternative: అతని మాటల్లో ఏదీ విఫలం కానివ్వలేదు; అతని మాటలన్నీ నెరవేరేలా చేశాడు
  rationale: సందర్భం సమూయేలు ప్రవక్తగా నమ్మదగినవాడని సూచించినప్పటికీ, మూలం ‘నేలపడటం’ అనే విస్తృత చిత్రాన్ని వాడుతుంది. దాన్ని నిలుపడం సాహిత్య రూపాన్ని, భావ విస్తృతిని కాపాడుతుంది; పాదటిప్పణి దాని అర్థాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో నిలుపుతూ, దాని భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
