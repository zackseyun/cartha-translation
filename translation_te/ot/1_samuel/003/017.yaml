source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מָ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֵלֶ֔י/ךָ אַל נָ֥א תְכַחֵ֖ד מִמֶּ֑/נִּי כֹּ֣ה יַעֲשֶׂה לְּ/ךָ֤ אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם תְּכַחֵ֤ד מִמֶּ֨/נִּי֙ דָּבָ֔ר מִ/כָּל הַ/דָּבָ֖ר אֲשֶׁר דִּבֶּ֥ר אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “ఆయన నీతో చెప్పిన మాట ఏమిటి? దయచేసి దాన్ని నాకు దాచవద్దు. ఆయన నీతో చెప్పిన మాటంతటిలో ఒక్క మాటనైనా నాకు దాచితే, దేవుడు నీకు అలాగే చేసి, అంతకంటే ఎక్కువగా కూడా చేయుగాక!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది శాపాన్ని తనపైకి ఆహ్వానిస్తూ చేసే ప్రమాణ సూత్రం; చేయబోయేది ఏమిటో వాక్యం స్పష్టంగా చెప్పదు.
    reason: cultural_and_idiomatic_clarification
lexical_decisions:
- source_word: מָה הַדָּבָר
  choice: చెప్పిన మాట ఏమిటి?
  rationale: דָּבָרకు ‘మాట, విషయం, సందేశం’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ ‘మాట’ అని అనువదించడం దైవిక పలుకుతో ఉన్న సందర్భ సంబంధాన్నీ, వాక్యంలోని పదపునరుక్తినీ కాపాడుతుంది.
- source_word: דִּבֶּר אֵלֶיךָ
  choice: నీతో చెప్పిన
  rationale: דבר అనే క్రియకు సహజమైన ఆధునిక తెలుగు రూపంగా ‘చెప్పిన’ను వాడి, ముందున్న ‘మాట’తో అర్థ సంబంధాన్ని నిలిపాం.
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  choice: దయచేసి దాన్ని నాకు దాచవద్దు
  rationale: כחדలోని ‘దాచు/మరుగుపరచు’ భావాన్ని ‘దాచవద్దు’ స్పష్టంగా అందిస్తుంది; נָאలోని అభ్యర్థనా భావాన్ని ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: כֹּה יַעֲשֶׂה לְּךָ אֱלֹהִים וְכֹה יוֹסִיף
  choice: దేవుడు నీకు అలాగే, అంతకంటే ఎక్కువగా కూడా చేయుగాక
  rationale: ఇది శాపాన్ని తనపైకి ఆహ్వానిస్తూ చేసే స్థిరమైన ప్రమాణ సూత్రం. శిక్ష స్వరూపాన్ని మూలం స్పష్టంగా చెప్పనందున ‘అలాగే’ అనే ఉద్దేశపూర్వక అస్పష్టతను నిలిపి, తెలుగులో సహజంగా వినిపించేలా అనువదించాం.
- source_word: תְּכַחֵד מִמֶּנִּי דָּבָר מִכָּל הַדָּבָר
  choice: మాటంతటిలో ఒక్క మాటనైనా నాకు దాచితే
  rationale: మూలంలోని ఏకవచన דָּבָר పునరుక్తిని ‘మాటంతటిలో ఒక్క మాటనైనా’ అని సహజమైన తెలుగులో కాపాడి, వెల్లడిలో ఏ భాగాన్నీ దాచకూడదనే సంపూర్ణతను వ్యక్తం చేశాం.
theological_decisions:
- issue: ప్రమాణ సూత్రంలోని אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: దేవతలు
  rationale: సందర్భంలో ఏలీ ఇశ్రాయేలు దేవుణ్ణి ఉద్దేశించి సాధారణ హెబ్రీ ప్రమాణ సూత్రాన్ని ఉపయోగిస్తున్నాడు. అందువల్ల బహుదేవతార్థాన్ని సూచించే రూపం కాకుండా ‘దేవుడు’ సరైనది.
- issue: దేవుడు చేయబోయేదాని స్వరూపం
  choice: ‘అలాగే’ అని అస్పష్టంగానే ఉంచడం
  alternative: ‘శిక్షించుగాక’ అని స్పష్టీకరించడం
  rationale: ఈ సూత్రం శాపార్థకమైనదైనా, హెబ్రీ పాఠం శిక్షను నేరుగా పేర్కొనదు. కాబట్టి దాని ఉద్దేశపూర్వక అస్పష్టతను అనువాదంలో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. హెబ్రీలోని ‘మాట’ పునరుక్తి నిలిపి ఉంచబడింది; అయితే సహజ తెలుగు వాక్యక్రమం కోసం షరతు భాగాన్ని ప్రమాణ సూత్రానికి ముందు ఉంచాం.
