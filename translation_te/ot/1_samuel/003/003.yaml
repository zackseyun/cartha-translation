  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נֵ֤ר אֱלֹהִים֙ טֶ֣רֶם יִכְבֶּ֔ה וּ/שְׁמוּאֵ֖ל שֹׁכֵ֑ב בְּ/הֵיכַ֣ל יְהוָ֔ה אֲשֶׁר שָׁ֖ם אֲר֥וֹן אֱלֹהִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
translation:
  language: te
  text: దేవుని దీపం ఇంకా ఆరిపోకముందే, దేవుని మందసం ఉన్న యహ్వే మందిరంలో[a] సమూయేలు పడుకొని ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యహ్వే పరిశుద్ధ స్థలంలో.’ ఇక్కడ హెబ్రీ הֵיכַל (హేఖాల్) అనే పదం షిలోహులోని యహ్వే ఆరాధనా స్థలాన్ని, అంటే మందిరాన్ని లేదా పరిశుద్ధ స్థలాన్ని, సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  choice: దేవుని దీపం
  rationale: נֵר అనే నిర్దిష్టమైన ‘దీపం’ భావాన్ని, దేవునితో ఉన్న సంబంధాన్ని నేరుగా నిలుపుతుంది; ఇది ఆరాధనా స్థలంలోని దీపాన్ని సూచిస్తుంది.
- source_word: טֶרֶם יִכְבֶּה
  choice: ఇంకా ఆరిపోలేదు
  rationale: టֶרֶם తెలిపే ‘ఇంకా జరగలేదు’ అనే కాలభావాన్ని, దీపం సందర్భంలో כבהకు సహజమైన ‘ఆరిపోవడం’ అనే ప్రయోగంతో అందిస్తుంది.
- source_word: שֹׁכֵב
  choice: పడుకొని ఉన్నాడు
  rationale: ఈ కృదంతం నిద్రపోతున్నాడని తప్పనిసరిగా చెప్పకుండా, సమూయేలు పడుకొని ఉన్న స్థితిని తెలియజేస్తుంది.
- source_word: הֵיכַל יְהוָה
  choice: యహ్వే మందిరం
  rationale: הֵיכַלకు ఈ ఆరాధనా సందర్భంలో ‘మందిరం’ సహజమైన అర్థం. ఇది సొలొమోను కట్టించిన తరువాతి దేవాలయాన్ని తప్పనిసరిగా సూచించదు; షిలోహులోని యహ్వే నివాసస్థలాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ వ్యక్తిగత నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా నిలుపుతుంది.
- source_word: אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  choice: దేవుని మందసం ఉన్న
  rationale: సంబంధవాక్యంలోని స్థలార్థాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తూ, אֲרוֹן אֱלֹהִיםను ‘దేవుని మందసం’గా నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: రాజరికానికి పూర్వకాలంలోని షిలోహు ఆరాధనా స్థలానికి הֵיכַל יְהוָה అనే పదబంధం
  choice: యహ్వే మందిరం
  alternative: యహ్వే పరిశుద్ధ స్థలం
  rationale: הֵיכַלకు ‘మందిరం’ అనే అర్థం సాధ్యమే; అయితే ఇది సొలొమోను దేవాలయాన్ని సూచిస్తున్నట్లు అపార్థం కాకుండా, ‘పరిశుద్ధ స్థలం’ అనే సాధ్యమైన అనువాదాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైన శైలిని వాడాం. ‘పడుకొని ఉన్నాడు’ అని అనువదించడం ద్వారా అతడు అప్పటికే నిద్రపోతున్నాడనే అదనపు వ్యాఖ్యానాన్ని నివారించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘మందిరంలో’ అనే పదానికే జతచేశాం.
