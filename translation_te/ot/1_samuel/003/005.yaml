  yaml_path: translation/ot/1_samuel/003/005.yaml
  text: He ran to Eli and said, “Here I am, because you called me.” But he said, “I did not call. Go back; lie down.” So he went and lay down.
translation:
  language: te
  text: అతడు ఏలీ దగ్గరికి పరుగెత్తి వెళ్లి, “ఇదిగో, నేను వచ్చాను; ఎందుకంటే మీరు నన్ను పిలిచారు” అన్నాడు. అయితే ఏలీ, “నేను పిలవలేదు. తిరిగి వెళ్లి పడుకో” అన్నాడు. కాబట్టి అతడు వెళ్లి పడుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: ఇదిగో, నేను వచ్చాను
  rationale: హీబ్రూ ప్రత్యుత్తరం ‘ఇదిగో నేను’ అనేది పిలుపుకు సిద్ధంగా హాజరైన భావాన్ని వ్యక్తం చేస్తుంది; తెలుగు సందర్భంలో ‘ఇదిగో, నేను వచ్చాను’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ సమూయేలు ఏలీ దగ్గరికి రావడానికి కారణాన్ని తెలియజేస్తోంది; మూలంలోని కారణార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: שׁוּב שְׁכָב
  choice: తిరిగి వెళ్లి పడుకో
  rationale: שׁוּב ఇక్కడ మునుపటి చోటుకు తిరిగి వెళ్లమనే భావంలో ఉంది; ఆపై שְׁכָב అనే ఆజ్ఞను సహజమైన తెలుగులో కలిపి అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ఏలీని ఉద్దేశించిన మాటలో గౌరవార్థక ‘మీరు’ వాడబడింది; కథనంలోని కర్తలు స్పష్టంగా ఉండేందుకు రెండవ సంభాషణలో ‘ఏలీ’ని పునరుక్తి చేశాం.
