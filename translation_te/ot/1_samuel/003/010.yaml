source:
  edition: WLC
  text: וַ/יָּבֹ֤א יְהוָה֙ וַ/יִּתְיַצַּ֔ב וַ/יִּקְרָ֥א כְ/פַֽעַם בְּ/פַ֖עַם שְׁמוּאֵ֣ל שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ דַּבֵּ֔ר כִּ֥י שֹׁמֵ֖עַ עַבְדֶּֽ/ךָ־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
translation:
  language: te
  text: అప్పుడు యెహోవా వచ్చి అక్కడ నిలబడి, మునుపటి సార్లలోలాగే[a], “సమూయేలూ! సమూయేలూ!” అని పిలిచాడు. సమూయేలు, “మాట్లాడు, ఎందుకంటే నీ సేవకుడు వింటున్నాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మునుపటిలాగే.” హీబ్రూ నుడికారం ఈ పిలుపును అంతకుముందు జరిగిన పిలుపులతో పోలుస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు హల్లుల పేరును ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా వ్యక్తపరుస్తుంది.
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא అనే సాధారణ గమన క్రియను కథన సందర్భంలో సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּתְיַצַּב
  choice: అక్కడ నిలబడి
  rationale: హిత్పయేల్ రూపం ఒక స్థానంలో నిలబడడం లేదా తన స్థానం తీసుకోవడం సూచిస్తుంది; ‘అక్కడ’ సందర్భంలోని ప్రత్యక్ష సన్నిధిని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּקְרָא
  choice: పిలిచాడు
  rationale: సమూయేలును పేరుపెట్టి సంబోధించిన సాధారణ వాచిక చర్యను అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: כְפַעַם בְּפַעַם
  choice: మునుపటి సార్లలోలాగే
  rationale: ఈ పిలుపును కథనంలోని అంతకుముందు జరిగిన పిలుపులతో పోల్చే హీబ్రూ నుడికార భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שְׁמוּאֵל שְׁמוּאֵל
  choice: సమూయేలూ! సమూయేలూ!
  rationale: పేరును రెండుసార్లు పలికిన వ్యక్తిగత, బలమైన పిలుపును అలాగే నిలుపుతుంది; సంబోధనను తెలుగు విభక్తితో వ్యక్తపరుస్తుంది.
- source_word: דַּבֵּר
  choice: మాట్లాడు
  rationale: సరళమైన ఆజ్ఞారూపాన్ని సహజమైన, గౌరవభరిత తెలుగు మాటగా ఇస్తుంది.
- source_word: כִּי
  choice: ;
  rationale: కారణార్థక సంబంధాన్ని తెలుగులో అసహజమైన సంధానపదం చేర్చకుండా విరామచిహ్నం ద్వారా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שֹׁמֵעַ
  choice: వింటున్నాడు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న శ్రద్ధను, వినడానికి సిద్ధంగా ఉండడాన్ని తెలియజేస్తుంది.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుడు
  rationale: ఈ వినయపూర్వక సంబోధనలో עבד సూచించే సేవ, విధేయత భావాలకు సందర్భోచితమైన తెలుగు రూపం.
theological_decisions:
- issue: యెహోవా రావడం, నిలబడడం అనే మానవరూప వర్ణన
  choice: ‘వచ్చి అక్కడ నిలబడి’ అనే స్పష్టమైన కథన భాషను నిలుపడం
  alternative: ‘ప్రత్యక్షమయ్యాడు’ లేదా ‘తన సన్నిధిని కనబరిచాడు’ అని నైరూప్యంగా అనువదించడం
  rationale: హీబ్రూ పాఠం యెహోవా చర్యను స్పష్టమైన వ్యక్తిగత పదాలతో వర్ణిస్తుంది. దానిలోని దైవశాస్త్రీయ ఉద్రిక్తతను తగ్గించకుండా అదే చిత్రాన్ని అనువాదం నిలుపుతుంది.
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు పాఠకులకు సుపరిచితమైన బైబిలు రూపాన్ని ఉపయోగిస్తూ, ఇది సాధారణ బిరుదు కాదని, ప్రత్యేక దైవనామమని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరిత కథన శైలి. ‘మాట్లాడు; నీ సేవకుడు వింటున్నాడు’ అనే వాక్యం సంక్షిప్తతను, వినయాన్ని నిలుపుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
