  yaml_path: translation/ot/1_samuel/003/007.yaml
  text: Samuel did not yet know Yahweh[b][a], and the word of Yahweh had not yet been revealed to him.
translation:
  language: te
  text: సమూయేలు ఇంకా యెహోవాను తెలుసుకోలేదు[a]; యెహోవా[b] వాక్యం అతనికి ఇంకా వెల్లడి కాలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమూయేలు ఇంకా యెహోవాను గుర్తించలేదు.” ఇక్కడి హెబ్రీ ‘తెలుసుకొను’ అనే పదం, ముఖ్యంగా దైవప్రత్యక్షత సందర్భంలో, అనుభవం లేదా సంబంధం ద్వారా తెలుసుకోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీ: YHWH; సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: טֶרֶם
  choice: ఇంకా … లేదు
  rationale: ఈ కథన దశవరకు ఆ స్థితి సంభవించలేదనే కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హెబ్రీ పాఠ్యంలో రెండుసార్లు వచ్చిన భావాన్ని రెండు ఉపవాక్యాల్లోనూ నిలుపుతుంది.
- source_word: יָדַע אֶת־יְהוָה
  choice: యెహోవాను తెలుసుకోలేదు
  rationale: יָדַע వ్యక్తిని కర్మగా తీసుకున్నప్పుడు సంబంధపూర్వకమైన లేదా అనుభవపూర్వకమైన ఎరుగుదలను సూచించగలదు. ‘తెలుసుకోలేదు’ మూలంలోని విస్తృతార్థాన్ని ఉంచుతుంది; దాన్ని కేవలం సమాచార జ్ఞానంగా గానీ, మారుమనస్సు గురించిన ప్రకటనగా గానీ పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: יִגָּלֶה
  choice: వెల్లడి కాలేదు
  rationale: גלה నిఫాల్ రూపంలోని వెల్లడించబడుట అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఇది సమూయేలుకు అప్పటివరకు దైవవాక్య ప్రత్యక్షత కలగలేదని సూచిస్తుంది.
- source_word: אֵלָיו
  choice: అతనికి
  rationale: దిశ లేదా గ్రహీతను సూచించే హెబ్రీ పూర్వప్రత్యయ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: דְּבַר יְהוָה
  choice: యెహోవా వాక్యం
  rationale: ప్రవచన సందర్భంలో స్థిరమైన బైబిలు పదబంధాన్ని కాపాడుతుంది; ‘సందేశం’ అని వివరణాత్మకంగా కుదించదు.
- source_word: וּשְׁמוּאֵל
  choice: సమూయేలు
  rationale: ו ఇక్కడ వివరణాత్మక ఉపవాక్యాన్ని కలుపుతోంది. తెలుగులో అదనపు ‘ఇప్పుడు’ లేదా యాంత్రికమైన ‘మరియు’ లేకుండానే ఈ సంబంధం సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: ‘సమూయేలు ఇంకా యెహోవాను తెలుసుకోలేదు’ అనే మాట అర్థం
  choice: ప్రత్యక్ష ప్రకటన ద్వారా యెహోవాను వ్యక్తిగతంగా గుర్తించే లేదా అనుభవించే పరిచయం సమూయేలుకు అప్పటివరకు కలగలేదనే అర్థాన్ని తెరిచి ఉంచడం
  alternative: సమూయేలుకు యెహోవా గురించి అసలు ఏ జ్ఞానమూ లేదని, లేదా అతని ఆత్మీయ పరివర్తన ఇంకా జరగలేదని నిర్ణయించడం
  rationale: తరువాతి సమాంతర ఉపవాక్యం యెహోవా వాక్యం అతనికి ఇంకా వెల్లడి కాలేదని వివరిస్తుంది. అందువల్ల అనుభవపూర్వక లేదా ప్రత్యక్ష ప్రకటన సంబంధమైన భావం సందర్భానికి సరిపోతుంది; అయితే అనువాదం హెబ్రీ ‘తెలుసుకొను’ అనే పదంలోని ఉద్దేశపూర్వక అస్పష్టతను తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘తెలుసుకోలేదు’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి, సంబంధపూర్వక లేదా అనుభవపూర్వక అర్థాన్ని పాదటిప్పణి ద్వారా కాపాడుతుంది. మూలంలో లేని ప్రారంభ కాలసూచక పదం చేర్చలేదు.
