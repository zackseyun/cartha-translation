  to: 'నేను అతనికి తెలియజేశాను: అతనికి తెలిసిన దోషాన్ని బట్టి నేను అతని ఇంటిమీద శాశ్వతంగా తీర్పు విధిస్తున్నాను. ఎందుకంటే అతని కుమారులు తమ మీదికి తామే శాపం తెచ్చుకుంటున్నారు[a], కానీ అతడు వారిని అడ్డుకోలేదు.'
  rationale: మసొరెతిక్ పాఠంలోని కఠినమైన ‘తమకే శాపం’ భావాన్ని ప్రధాన వచనంలో, ప్రత్యామ్నాయంగా ‘దేవుణ్ణి శపిస్తున్నారు’ అనే పాఠాన్ని పాదటిప్పణిలో ఉంచాం. సవరణలు తెలుగు వాక్యనిర్మాణం మరియు ‘తీర్పు’తో సహజమైన క్రియాప్రయోగం కోసం మాత్రమే చేయబడ్డాయి; అర్థపరిధి లేదా పాఠభేద నిర్ణయం మార్చబడలేదు.
