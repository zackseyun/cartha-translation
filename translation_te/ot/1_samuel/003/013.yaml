id: 1SA.3.13
reference: 1 Samuel 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִגַּ֣דְתִּי ל֔/וֹ כִּֽי שֹׁפֵ֥ט אֲנִ֛י אֶת בֵּית֖/וֹ עַד עוֹלָ֑ם בַּ/עֲוֺ֣ן אֲשֶׁר יָדַ֗ע כִּֽי מְקַֽלְלִ֤ים לָ/הֶם֙ בָּנָ֔י/ו וְ/לֹ֥א כִהָ֖ה בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
translation:
  language: te
  text: 'నేను అతనికి తెలియజేశాను: అతనికి తెలిసిన దోషాన్ని బట్టి నేను అతని ఇంటిమీద శాశ్వతంగా తీర్పు విధిస్తున్నాను. ఎందుకంటే అతని కుమారులు తమ మీదికి తామే శాపం తెచ్చుకుంటున్నారు[a], కానీ అతడు వారిని అడ్డుకోలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన సాక్ష్యాల్లో ప్రతిబింబించే మరో పాఠం ప్రకారం, “అతని కుమారులు దేవుణ్ణి శపిస్తున్నారు” లేదా “దేవదూషణ చేస్తున్నారు.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  choice: నేను అతనికి తెలియజేశాను
  rationale: נגד హిఫీల్ రూపం ‘తెలియజేయడం, ప్రకటించడం’ అనే భావాన్ని ఇస్తుంది. తెలుగు సందర్భంలో పూర్తి క్రియగా సహజంగా అందించబడింది.
- source_word: שֹׁפֵט אֲנִי
  choice: నేను ... తీర్పు తీరుస్తున్నాను
  rationale: స్పష్ట సర్వనామంతో ఉన్న కృదంత రూపం కొనసాగుతున్న లేదా సమీపిస్తున్న న్యాయచర్యను సూచించగలదు; వర్తమాన కొనసాగింపు రూపం దాని గంభీర తక్షణత్వాన్ని నిలుపుతుంది.
- source_word: בֵּיתוֹ
  choice: అతని ఇంటికి
  rationale: ‘ఇల్లు’ అనే హెబ్రీయ భాషాప్రయోగం కుటుంబం, ఇంటివారు, వంశం అనే విస్తృత పరిధిని కలిగి ఉండగలదు. ‘కుటుంబం’ లేదా ‘వంశం’ అని పరిమితం చేయకుండా ఆ విస్తృతిని నిలిపింది.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: దీర్ఘకాలికంగా నిలిచే తీర్పు తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּעֲוֺן
  choice: దోషాన్ని బట్టి
  rationale: עָוֹן నైతిక అపరాధం మరియు దాని బాధ్యత అనే భావాలను కలిగి ఉంటుంది; ‘దోషం’ ఈ సందర్భంలో స్పష్టంగా, గంభీరంగా ఉంది.
- source_word: אֲשֶׁר יָדַע
  choice: అతనికి తెలిసిన
  rationale: ఏలీకి తన కుమారుల అపరాధం తెలిసి ఉండడమే అతని బాధ్యతను పెంచిందనే సరళ భావాన్ని నిలుపుతుంది.
- source_word: מְקַלְלִים לָהֶם
  choice: తమ మీదికి తామే శాపం తెచ్చుకుంటున్నారు
  rationale: లభ్యమైన వ్యంజన పాఠంలోని לָהֶם ను గౌరవిస్తూ, తమ చర్యల ద్వారా తమపై శాపం తెచ్చుకోవడం అనే సహజ తెలుగు భావాన్ని ఇచ్చింది. ‘దేవుణ్ణి శపిస్తున్నారు’ అనే ప్రాచీన ప్రత్యామ్నాయ పాఠాన్ని ప్రధాన వచనంలో కలపకుండా పాదటిప్పణిలో ఉంచింది.
- source_word: וְלֹא כִהָה בָּם
  choice: అయినా అతడు వారిని అడ్డుకోలేదు
  rationale: כּהה ఇక్కడ మందగింపజేయడం, అదుపు చేయడం లేదా నిరోధించడం అనే సందర్భార్థాన్ని ఇస్తుంది; ‘అడ్డుకోలేదు’ సాధారణ పాఠకులకు ఏలీ వైఫల్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: కుమారుల అపరాధాన్ని మసొరెతిక్ వ్యంజన పాఠం ప్రకారమా, ప్రాచీన ప్రత్యామ్నాయ పాఠం ప్రకారమా అనువదించాలి
  choice: ప్రధాన వచనంలో ‘తమ మీదికి తామే శాపం తెచ్చుకుంటున్నారు’
  alternative: ‘దేవుణ్ణి శపిస్తున్నారు’ లేదా ‘దేవదూషణ చేస్తున్నారు’
  rationale: WLCలోని వ్యంజన పాఠం తమపై శాపం తెచ్చుకోవడం అనే భావానికి అనుకూలంగా ఉంది. కొన్ని ప్రాచీన సాక్ష్యాలు దేవుణ్ణి శపించడం అనే పాఠాన్ని ప్రతిబింబిస్తాయి. మూలపాఠ ప్రాధాన్యాన్ని, పాఠభేదంలోని ఉద్విగ్నతను రెండింటినీ నిలుపడానికి ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- issue: ‘అతని ఇల్లు’ మీద తీర్పు పరిధి
  choice: ‘అతని ఇంటికి’ అనే విస్తృత భాషాప్రయోగాన్ని నిలుపడం
  alternative: ‘అతని కుటుంబానికి’ లేదా ‘అతని వంశానికి’
  rationale: హెబ్రీయ పదం తక్షణ ఇంటివారినీ కొనసాగుతున్న కుటుంబ వంశాన్నీ సూచించగలదు. ఒకే పరిధికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. హెబ్రీయ వాక్య నిర్మాణం పూర్తిగా యాంత్రికంగా అనుకరించకుండా, కారణం మరియు విరుద్ధత స్పష్టంగా ఉండేలా రెండు వాక్యాలుగా అమర్చబడింది; అయినప్పటికీ మూలంలోని భావక్రమం, న్యాయతీర్పు గంభీరత, పాఠభేదం నిలుపబడ్డాయి.
