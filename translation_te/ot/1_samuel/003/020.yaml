  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֨דַע֙ כָּל יִשְׂרָאֵ֔ל מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כִּ֚י נֶאֱמָ֣ן שְׁמוּאֵ֔ל לְ/נָבִ֖יא לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/020.yaml
  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
translation:
  language: te
  text: దాను నుండి బెయేరు-షెబా వరకు ఇశ్రాయేలీయులందరూ, సమూయేలు యాహ్వే ప్రవక్తగా స్థిరపరచబడ్డాడని తెలుసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమూయేలు యాహ్వేకు నమ్మదగిన ప్రవక్తగా నిరూపించబడ్డాడని.” హెబ్రీ పదానికి నమ్మదగినవాడిగా గుర్తించబడడం, స్థిరపరచబడడం లేదా ధ్రువీకరించబడడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: తెలుసుకున్నారు
  rationale: ידע క్రియ ఇక్కడ సమూయేలు ప్రవక్తగా స్థిరపరచబడిన విషయం దేశమంతటా గుర్తించబడిందనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘తెలుసుకున్నారు’ సహజంగా ఉంది.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: సామూహిక జాతీయ సూచనను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: దాను మొదలుకొని బెయేరు-షెబా వరకు
  rationale: దేశపు ఉత్తర, దక్షిణ సరిహద్దులను సూచించే భౌగోళిక నానుడిని స్థలాల పేర్లతోనే నిలుపుతుంది.
- source_word: נֶאֱמָן
  choice: స్థిరపరచబడ్డాడు
  rationale: Niphal రూపం నమ్మదగినవాడిగా నిరూపించబడడం, స్థిరపరచబడడం లేదా ధ్రువీకరించబడడం అనే భావాలను కలిగి ఉంది; ఈ సందర్భంలో సమూయేలు ప్రవక్తత్వం నిజమైనదిగా స్థాపించబడినదనే భావం ప్రధానమైనది.
- source_word: לְנָבִיא
  choice: ప్రవక్తగా
  rationale: లామెద్ ఇక్కడ పాత్ర లేదా హోదాను సూచిస్తుంది; ‘ప్రవక్తగా’ దానిని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: లామెద్ ద్వారా వ్యక్తమయ్యే సంబంధాన్ని నేరుగా నిలుపుతూ, సమూయేలు యెహోవాకు చెందిన లేదా ఆయనచే నియమించబడిన ప్రవక్త అనే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో నిలిపింది.
- issue: נֶאֱמָן ద్వారా సమూయేలు ప్రవక్తత్వానికి ఇచ్చిన భావం
  choice: ప్రవక్తగా స్థిరపరచబడ్డాడు
  alternative: నమ్మకమైన ప్రవక్తగా ఉన్నాడు / ప్రవక్తగా ధ్రువీకరించబడ్డాడు
  rationale: ముందటి వచనంలో అతని మాటలేవీ నెరవేరకుండా పోనివ్వలేదనే సందర్భం, అతని ప్రవక్తత్వం నిజమైనదిగా స్థాపించబడిందనే భావాన్ని బలపరుస్తుంది; అయినా హెబ్రీ పదంలోని ‘నమ్మదగిన’ భావసాధ్యతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘దాను ... బెయేరు-షెబా’ అనే భౌగోళిక సమగ్రతా నానుడి యథాతథంగా నిలుపబడింది; נֶאֱמָן యొక్క నిజమైన భావవ్యాప్తి పాదటిప్పణిలో సంరక్షించబడింది.
