  text: וְ/לָ/כֵ֥ן נִשְׁבַּ֖עְתִּי לְ/בֵ֣ית עֵלִ֑י אִֽם יִתְכַּפֵּ֞ר עֲוֺ֧ן בֵּית עֵלִ֛י בְּ/זֶ֥בַח וּ/בְ/מִנְחָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/014.yaml
  text: 'Therefore I have sworn to the house of Eli: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering[a][b].'
translation:
  language: te
  text: కాబట్టి ఏలీ ఇంటివారి దోషానికి బలి వల్లగానీ అర్పణ వల్లగానీ ఎన్నటికీ ప్రాయశ్చిత్తం కలగదని నేను ఏలీ ఇంటివారి విషయంలో ప్రమాణం చేశాను[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏలీ ఇంటివారి దోషానికి తప్పకుండా ప్రాయశ్చిత్తం కలగదు.” హీబ్రూలో “నేను ప్రమాణం చేశాను” అనే మాట తరువాత సాధారణంగా “ఒకవేళ” అని అర్థమిచ్చే పదాన్ని ఉపయోగించి బలమైన నిరాకరణను వ్యక్తం చేశారు.
    reason: lexical_alternative
  - marker: b
    text: “అర్పణ” అని అనువదించిన హీబ్రూ పదం మిన్హా; అది తరచుగా ప్రత్యేకంగా “ధాన్యార్పణ”ను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: కాబట్టి
  rationale: ముందుగా ప్రకటించిన తీర్పుకు ఇది పరిణామమని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נִשְׁבַּעְתִּי
  choice: నేను ప్రమాణం చేశాను
  rationale: పూర్తయినప్పటికీ కొనసాగుతున్న బలమున్న దైవిక ప్రమాణపు గంభీరతను నిలుపుతుంది.
- source_word: לְבֵית עֵלִי
  choice: ఏలీ ఇంటివారి విషయంలో
  rationale: לְ సూచించే ప్రమాణపు లక్ష్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ప్రమాణం ప్రతికూలమైనదని తరువాతి వాక్యం స్పష్టం చేస్తుంది.
- source_word: אִם
  choice: కలగదని
  rationale: ప్రమాణ క్రియ తరువాత אִם బలమైన నిరాకరణ సూత్రంగా పనిచేస్తుంది; దానిని షరతార్థకంగా అనువదించడం భావాన్ని మరుగుపరుస్తుంది.
- source_word: יִתְכַּפֵּר
  choice: ప్రాయశ్చిత్తం కలగదు
  rationale: దోషం బలి సంబంధమైన మార్గంలో పరిహరించబడటం లేదా తొలగించబడటం అనే భావాన్ని గంభీరమైన, సాధారణంగా అర్థమయ్యే తెలుగులో అందిస్తుంది.
- source_word: עֲוֺן
  choice: దోషం
  rationale: ఈ పదంలో ఉన్న అపరాధం మరియు దానికి సంబంధించిన బాధ్యత అనే రెండు ఛాయలనూ సందర్భానుకూలంగా మోయగల సహజ తెలుగు పదం.
- source_word: בֵּית עֵלִי
  choice: ఏలీ ఇంటివారి
  rationale: కేవలం భవనం కాక ఏలీ కుటుంబం లేదా వంశాన్ని సూచించే בית భావాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּזֶבַח
  choice: బలి వల్ల
  rationale: בְ ఇక్కడ సాధనాన్ని సూచిస్తుంది; ప్రాయశ్చిత్తాన్ని సాధించలేని బలి మార్గాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּבְמִנְחָה
  choice: అర్పణ వల్ల
  rationale: מִנְחָהకు ఉన్న విస్తృత అర్పణ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ధాన్యార్పణ అనే ప్రత్యేక అర్థాన్ని పాదటిప్పణిలో పరిరక్షిస్తుంది.
- source_word: עַד עוֹלָם
  choice: ఎన్నటికీ
  rationale: ప్రతికూల ప్రమాణ సందర్భంలో ప్రాయశ్చిత్తం ఎన్నడూ కలగదనే శాశ్వత నిరాకరణను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఏలీ ఇంటివారిపై తీర్పు స్వభావం
  choice: ఏలీ ఇంటివారి దోషానికి బలి లేదా అర్పణ ద్వారా ఎన్నటికీ ప్రాయశ్చిత్తం కలగదని వచనం ప్రకటిస్తుంది.
  alternative: ఇది దేవుని క్షమాపణకు సంబంధించిన అన్ని అవకాశాలనూ నిరాకరించకుండా, పేర్కొన్న ఆరాధనా అర్పణల ద్వారా పరిహారాన్ని మాత్రమే నిరాకరిస్తుందని మరింత సంకుచితంగా చదవవచ్చు.
  rationale: హీబ్రూ పాఠ్యం ప్రత్యేకంగా బలి మరియు అర్పణను ప్రస్తావిస్తుంది. అందువల్ల అనువాదం ఆ ఆరాధనా సాధనాల అసమర్థతను స్పష్టంగా ఉంచుతుంది; అయితే దేవుని కరుణ గురించి పాఠ్యం చెప్పనిదాన్ని అదనంగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. “ఇంటివారు” కుటుంబం/వంశం అనే בית భావాన్ని స్పష్టం చేస్తుంది. హీబ్రూ ప్రమాణ సూత్రంలోని బలమైన నిరాకరణను ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేసి, దాని రూపాన్ని పాదటిప్పణిలో వివరించాం.
