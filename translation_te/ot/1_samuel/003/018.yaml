  text: וַ/יַּגֶּד ל֤/וֹ שְׁמוּאֵל֙ אֶת כָּל הַ/דְּבָרִ֔ים וְ/לֹ֥א כִחֵ֖ד מִמֶּ֑/נּוּ וַ/יֹּאמַ֕ר יְהוָ֣ה ה֔וּא הַ/טּ֥וֹב בְּ/עֵינָ֖/ו יַעֲשֶֽׂה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
translation:
  language: te
  text: అప్పుడు సమూయేలు ఆ మాటలన్నీ అతనికి చెప్పాడు; అతనికి ఏదీ దాచలేదు. ఏలీ, “ఆయనే యాహ్వే; ఆయన దృష్టికి[a] ఏది మంచిదో అది ఆయన చేయనివ్వు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆయన కళ్లలో.” ఇది ఆయన స్వంత నిర్ణయం ప్రకారం లేదా ఆయనకు మంచిదిగా తోచినదాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయన దృష్టికి ఏది మంచిదో అది ఆయన చేస్తాడు.” హీబ్రూ అసంపూర్ణ క్రియారూపాన్ని లోబడే ఆకాంక్షగా (“చేయనివ్వు”) లేదా సాధారణ భవిష్యత్తుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: చెప్పాడు
  rationale: נגד హిఫీల్ రూపం ఇక్కడ తెలియజేయడం లేదా చెప్పడం అనే అర్థం ఇస్తుంది. వ్యక్తిగత సంభాషణ సందర్భంలో ‘చెప్పాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: אֶת כָּל הַדְּבָרִים
  choice: ఆ మాటలన్నీ
  rationale: దేవుడు పలికిన సందేశంలోని మాటలన్నిటినీ సూచిస్తుంది. ‘ఆ మాటలన్నీ’ మూలంలోని דְּבָרִים పదానికి దగ్గరగా ఉండి, సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  choice: అతని దగ్గర ఏదీ దాచలేదు
  rationale: כחד అంటే దాచడం లేదా చెప్పకుండా ఉంచడం. ఈ రూపం సమూయేలు సందేశంలో ఏ భాగాన్నీ ఏలీకి దాచలేదనే సంపూర్ణతను సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה הוּא
  choice: ఆయనే యాహ్వే
  rationale: హీబ్రూ పదక్రమంలోని సర్వనామ బలాన్ని ‘ఆయనే’ తెలియజేస్తుంది; יְהוָה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: ఆయన దృష్టికి ఏది మంచిదో
  rationale: అక్షరార్థంగా ‘ఆయన కళ్లలో మంచిది.’ తెలుగులో ‘ఆయన దృష్టికి ఏది మంచిదో’ అనే నుడికారం, యాహ్వే స్వయంగా మంచిదని నిర్ణయించేదాన్ని సూచిస్తూ మూల భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יַעֲשֶׂה
  choice: చేయనివ్వు
  rationale: ఈ అసంపూర్ణ క్రియారూపం సందర్భంలో ఏలీ తీర్పుకు లోబడుతున్న ఆకాంక్షార్థక భావాన్ని ఇవ్వవచ్చు. ‘చేయనివ్వు’ దాన్ని తెలియజేస్తుంది; సాధారణ భవిష్యత్ అర్థం పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో దైవనామమే ప్రత్యక్షంగా ఉంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు లిపిలో ‘యాహ్వే’గా ఇచ్చాం.
- issue: ఏలీ చివరి మాటలో יַעֲשֶׂה క్రియ బలం
  choice: లోబడే ఆకాంక్షగా ‘చేయనివ్వు’
  alternative: భవిష్యత్ ప్రకటనగా ‘ఆయన చేస్తాడు’
  rationale: సందర్భం ఏలీ ప్రకటించబడిన తీర్పును అంగీకరించడాన్ని సూచిస్తుంది; అయితే హీబ్రూ అసంపూర్ణ క్రియారూపం సాధారణ భవిష్యత్ భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠంలో సందర్భోచిత పఠనాన్ని, పాదసూచికలో ప్రత్యామ్నాయాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ఆయనే’ మూలంలోని సర్వనామ బలాన్ని నిలుపుతుంది; ‘ఆయన దృష్టికి’ హీబ్రూ నుడికారాన్ని తెలుగులో అర్థవంతంగా అందిస్తుంది. ఏలీ మాటలోని లోబడే భావం ప్రధాన పాఠంలో ఉండగా, క్రియారూపంలోని నిజమైన ద్వంద్వార్థం పాదసూచికలో భద్రపరచబడింది.
