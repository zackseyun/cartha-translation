    issue: Ambiguous referent in “అది చేయనివ్వు”
    rationale: In Telugu, the immediately preceding neuter expression “అది” can be read as the grammatical subject of “చేయనివ్వు.” Adding “ఆయన” clarifies that Yahweh is the one who is to act, without adding meaning.
