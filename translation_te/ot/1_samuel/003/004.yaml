  text: Then Yahweh called to Samuel[a], and he said, “Here I am.”
translation:
  language: te
  text: అప్పుడు యాహ్వే[a] సమూయేలును పిలిచాడు. సమూయేలు, “ఇదిగో, నేనున్నాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH; దీనిని ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచాడు
  rationale: קרא క్రియ యొక్క Qal wayyiqtol రూపం కథన క్రమాన్ని కొనసాగిస్తూ వినిపించే పిలుపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘పిలిచాడు’ సహజమైన సమానార్థకం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామం YHWHను తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం; బిరుదుతో భర్తీ చేయలేదు.
- source_word: אֶל שְׁמוּאֵל
  choice: సమూయేలును
  rationale: אֶל పిలుపు ఎవరిని ఉద్దేశించిందో సూచిస్తుంది. తెలుగు సకర్మక ‘పిలుచు’తో కర్మవిభక్తి సహజంగా ఉండడంతో ‘సమూయేలును’ అని ఇచ్చాం.
- source_word: וַיֹּאמֶר
  choice: అతడు … అన్నాడు
  rationale: אמר యొక్క wayyiqtol రూపం. హీబ్రూలో కర్త అంతర్గతంగా ఉన్నా, సందర్భంలో ప్రత్యుత్తరం చెప్పేది సమూయేలే; తెలుగులో స్పష్టత కోసం ‘అతడు’ అని వ్యక్తం చేశాం.
- source_word: הִנֵּנִי
  choice: ఇదిగో, నేనున్నాను
  rationale: సన్నిధి, స్పందించడానికి సిద్ధతను తెలిపే హీబ్రూ ప్రత్యుత్తర సూత్రాన్ని ‘ఇదిగో, నేనున్నాను’ సహజంగా, గౌరవప్రదమైన బైబిలు శైలిలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో సాధారణ బిరుదు కాక YHWH అనే దైవనామమే ఉంది. దానిని బిరుదుతో మార్చకుండా తెలుగులో స్థిరంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చి, ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదసూచికలో తెలిపాం.
- issue: וַיֹּאמֶר లో అంతర్గత కర్త
  choice: సమూయేలును సూచించే ‘అతడు’
  alternative: కర్తను పేర్కొనకుండా ‘అన్నాడు’
  rationale: ‘ఇదిగో, నేనున్నాను’ అనేది పిలుపు విన్న సమూయేలు ఇచ్చిన సమాధానమని సమీప సందర్భం సూచిస్తుంది. ఇది సందర్భాన్ని స్పష్టం చేస్తుంది గాని వచనంలో లేని కొత్త వక్తను ప్రవేశపెట్టదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని, అదే సమయంలో గౌరవప్రదమైన బైబిలు ధ్వనిని పాటించాం. మూలంలోని వరుస wayyiqtol క్రియలకు ‘అప్పుడు’ మరియు విడి వాక్యాల ద్వారా స్పష్టమైన కథన ప్రవాహం ఇచ్చాం.
