  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ אָקִ֣ים אֶל עֵלִ֔י אֵ֛ת כָּל אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל בֵּית֑/וֹ הָחֵ֖ל וְ/כַלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/012.yaml
  text: On that day I will carry out against Eli all that I have spoken concerning his house[b][a], from beginning to end.
translation:
  language: te
  text: ఆ రోజున ఏలీకి వ్యతిరేకంగా[a], అతని ఇంటి[b] గురించి నేను చెప్పినదంతా మొదటి నుంచి చివరి వరకు అమలు చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏలీ విషయంలో, అతని ఇంటి గురించి నేను చెప్పినదంతా నెరవేరుస్తాను.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “అతని ఇల్లు” అనేది అతని ఇంటివారిని, కుటుంబ వంశాన్ని, లేదా యాజక కుటుంబాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: నిర్దిష్టమైన రాబోయే సమయాన్ని సూచించే హీబ్రూ కాలవాచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָקִים
  choice: అమలు చేస్తాను
  rationale: హిఫిల్ రూపమైన ఈ క్రియ ఇక్కడ దేవుడు తాను పలికిన మాటను నిలబెట్టి కార్యరూపంలో నెరవేర్చడాన్ని సూచిస్తుంది. తీర్పు సందర్భంలో ‘అమలు చేస్తాను’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֶל עֵלִי
  choice: ఏలీకి వ్యతిరేకంగా
  rationale: אֶל సాధారణంగా ‘వైపు/కు’ అని అర్థమిచ్చినా, ఇక్కడ ప్రకటించబడిన తీర్పు ఏలీపై ప్రతికూలంగా అమలవుతున్న సందర్భం ఉంది. అందువల్ల ప్రధాన పాఠంలో సందర్భానుగుణమైన అర్థాన్ని ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֵת כָּל אֲשֶׁר דִּבַּרְתִּי
  choice: నేను చెప్పినదంతా
  rationale: כָּל אֲשֶׁר లోని సంపూర్ణతను, దైవిక ప్రకటనగా ముందే పలికిన మాటను సరళంగా కాపాడుతుంది.
- source_word: אֶל בֵּיתוֹ
  choice: అతని ఇంటి గురించి
  rationale: דבר తో వచ్చిన אֶל మాటల విషయాన్ని సూచించగలదు. ఇక్కడ దేవుడు ఏలీ ఇంటిని గూర్చి ముందుగా పలికిన మాటలను సూచిస్తుంది.
- source_word: בֵּיתוֹ
  choice: అతని ఇల్లు
  rationale: హీబ్రూ בַּיִת యొక్క కుటుంబం, వంశపరంపర, యాజక కుటుంబం అనే విస్తృత భావాన్ని సంకుచితం చేయకుండా ‘ఇల్లు’ నిలుపుతుంది.
- source_word: הָחֵל וְכַלֵּה
  choice: మొదటి నుంచి చివరి వరకు
  rationale: ప్రకటించినదాన్ని సంపూర్ణంగా కార్యరూపంలోకి తేవడం అనే జంట క్రియల భావాన్ని సహజమైన తెలుగు నానుడితో తెలియజేస్తుంది.
theological_decisions:
- issue: ఏలీపై మరియు అతని ఇంటిపై తీర్పు పరిధి
  choice: ఏలీ ఇంటి గురించి ముందుగా పలికినదంతా దేవుడు పూర్తిగా అమలు చేస్తాడని పాఠం చెబుతుంది; ‘ఇల్లు’ అనే పదాన్ని ప్రధాన పాఠంలోనే ఉంచాం.
  alternative: దీనిని ఏలీ తక్షణ కుటుంబానికే పరిమితం చేయడం, లేదా విస్తృత యాజక వ్యవస్థ మొత్తానికి వర్తింపజేయడం.
  rationale: בֵּיתוֹ అనే పదం కుటుంబాన్ని, వంశపరంపరను, సందర్భంలో యాజక కుటుంబాన్ని కూడా సూచించగలదు. ఒకే వ్యాఖ్యానానికి పరిమితం చేయకుండా మూలంలోని విస్తృతతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘అతని ఇల్లు’ అనే బైబిలీయ కుటుంబ-వంశ భావాన్ని నిలుపుతూ, దాని విస్తృతిని పాదటిప్పణిలో వివరించాం.
