  text: וַ/יִּשְׁכַּ֤ב שְׁמוּאֵל֙ עַד הַ/בֹּ֔קֶר וַ/יִּפְתַּ֖ח אֶת דַּלְת֣וֹת בֵּית יְהוָ֑ה וּ/שְׁמוּאֵ֣ל יָרֵ֔א מֵ/הַגִּ֥יד אֶת הַ/מַּרְאָ֖ה אֶל עֵלִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
translation:
  language: te
  text: సమూయేలు ఉదయం వరకు పడుకున్నాడు. తరువాత అతడు యెహోవా ఇంటి తలుపులు తెరిచాడు. అయితే సమూయేలు ఆ దర్శనాన్ని ఏలీకి చెప్పడానికి భయపడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కనిపించినది.” హీబ్రూ పదం దర్శనాన్ని లేదా కనిపించడాన్ని సూచించగలదు; ఇక్కడ సమూయేలుకు రాత్రివేళ కలిగిన ప్రకటన సందర్భంలో “దర్శనం” సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: పడుకొని ఉన్నాడు
  rationale: שׁכב యొక్క ప్రాథమిక భావమైన ‘పడుకొను’ను నిలుపుతుంది; సమూయేలు నిద్రపోయాడని మూలపాఠం స్పష్టంగా చెప్పనందున ‘నిద్రపోయాడు’ అని వ్యాఖ్యానించలేదు.
- source_word: עַד הַבֹּקֶר
  choice: ఉదయం వరకు
  rationale: కాలపరిమితిని సహజమైన ఆధునిక తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: וַיִּפְתַּח
  choice: తెరిచాడు
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజమైన భూతకాల క్రియతో తెలియజేస్తుంది.
- source_word: דַּלְתוֹת
  choice: తలుపులు
  rationale: బహువచనాన్ని నేరుగా నిలుపుతూ ఆలయ ప్రవేశ నిర్మాణాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: ఇక్కడ בַּיִת అంటే ఆరాధనా స్థలం; ‘మందిరం’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాతి సొలొమోను దేవాలయాన్ని తప్పనిసరిగా సూచించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని సాధారణ తెలుగు బైబిలు రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: יָרֵא
  choice: భయపడ్డాడు
  rationale: సమూయేలు అనుభవించిన భయాన్ని సహజమైన తెలుగు క్రియతో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵהַגִּיד
  choice: చెప్పడానికి
  rationale: ירא తరువాత מן + infinitive నిర్మాణం తెలుగులో ‘చేయడానికి భయపడు’ అనే సహజ రూపంలో వ్యక్తమవుతుంది.
- source_word: הַמַּרְאָה
  choice: దర్శనం
  rationale: מַרְאָהకు ‘కనిపించడం’ లేదా ‘దర్శనాత్మక ప్రకటన’ అనే పరిధి ఉంది; ఈ రాత్రివేళ దైవప్రకటన సందర్భంలో ‘దర్శనం’ సరిపోతుంది, కాగా ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణి నిలుపుతుంది.
- source_word: אֶל עֵלִי
  choice: ఏలీకి
  rationale: הגיד తో వచ్చిన లక్ష్య వ్యక్తిని తెలుగులో సహజమైన సంప్రదాన విభక్తితో సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలిపి, ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించింది.
- issue: הַמַּרְאָה యొక్క ప్రకటన స్వభావం
  choice: దర్శనం
  alternative: కనిపించినది
  rationale: సందర్భం దీనిని సమూయేలుకు రాత్రివేళ లభించిన దైవప్రకటనగా చూపుతుంది; అయినా పదంలోని ‘కనిపించడం’ అనే భావసాధ్యతను పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘పడుకొని ఉన్నాడు’ అనే రూపం నిద్రపోయాడనే అదనపు భావాన్ని చేర్చదు. పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
