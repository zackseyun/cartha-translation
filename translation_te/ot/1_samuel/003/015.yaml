revisions:
- from: సమూయేలు ఉదయం వరకు పడుకొని ఉన్నాడు. తరువాత అతడు యెహోవా మందిరపు తలుపులు తెరిచాడు. అయితే సమూయేలు ఆ దర్శనం గురించి ఏలీకి చెప్పడానికి భయపడ్డాడు.[a]
  to: సమూయేలు ఉదయం వరకు పడుకున్నాడు. తరువాత అతడు యెహోవా ఇంటి తలుపులు తెరిచాడు. అయితే సమూయేలు ఆ దర్శనాన్ని ఏలీకి చెప్పడానికి భయపడ్డాడు.[a]
  rationale: The revision maintains the Hebrew narrative sequence and ambiguity while using a completed Telugu verb for Samuel's lying down, a less historically specific equivalent for 'house of Yahweh,' and a footnote that states the lexical alternative without adding meaning.
