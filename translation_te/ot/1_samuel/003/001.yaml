revisions:
- from: బాలుడైన సమూయేలు ఏలీ సమక్షంలో యెహోవాకు పరిచర్య చేస్తూ ఉన్నాడు. ఆ రోజుల్లో యెహోవా వాక్యం అరుదుగా ఉండేది; దర్శనాలు విస్తృతంగా కలిగేవి కావు.[a]
