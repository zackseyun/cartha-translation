id: 1SA.3.1
reference: 1 Samuel 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/נַּ֧עַר שְׁמוּאֵ֛ל מְשָׁרֵ֥ת אֶת יְהוָ֖ה לִ/פְנֵ֣י עֵלִ֑י וּ/דְבַר יְהוָ֗ה הָיָ֤ה יָקָר֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין חָז֖וֹן נִפְרָֽץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: The boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
translation:
  language: te
  text: బాలుడైన సమూయేలు ఏలీ సమక్షంలో యెహోవాకు పరిచర్య చేస్తూ ఉన్నాడు. ఆ రోజుల్లో యెహోవా వాక్యం అరుదుగా ఉండేది; దర్శనాలు విస్తృతంగా ఉండేవి కావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తరచుగా దర్శనం కలిగేది కాదు,” లేదా “దర్శనం విస్తరించేది కాదు.” హెబ్రీయ నుడికారం ప్రకటనాత్మక దర్శనాలు అరుదుగా ఉండేవని, అవి విస్తృతంగా ప్రబలంగా ఉండేవి కావని సూచిస్తుంది.
    reason: నִפְרָץ‌లోని ‘బయటికి విస్తరించడం/ప్రబలడం’ అనే భావాన్ని సహజమైన తెలుగులో తెలియజేయడానికి మరియు నుడికారంలోని ప్రత్యామ్నాయ భావాన్ని నిలుపడానికి.
lexical_decisions:
- source_word: וְ/הַ/נַּעַר שְׁמוּאֵל
  choice: బాలుడైన సమూయేలు
  rationale: הַנַּעַר అంటే బాలుడు లేదా యువకుడు. కథలో సమూయేలు ఉన్న దశకు ‘బాలుడు’ సహజంగా సరిపోతుంది. వావ్‌ను అవసరం లేని ‘మరియు’ లేదా మూలంలో లేని కాలసూచక ‘ఇప్పుడు’గా విడిగా అనువదించలేదు.
- source_word: מְשָׁרֵת אֶת יְהוָה
  choice: యెహోవాకు పరిచర్య చేస్తూ ఉన్నాడు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న సేవను సూచిస్తుంది. ‘పరిచర్య’ ఆలయ సంబంధమైన సేవాభావాన్ని నిలుపుతుంది; אֶת ఇక్కడ సేవ పొందుతున్న వ్యక్తిని సూచిస్తుంది.
- source_word: לִפְנֵי עֵלִי
  choice: ఏలీ సమక్షంలో
  rationale: לִפְנֵי యొక్క ప్రాథమిక భావం ‘ఎదుట/సమక్షంలో.’ ఇది ఏలీ పర్యవేక్షణలో సేవ చేసిన సందర్భార్థాన్ని సూచించగలిగినా, దానిని పాఠ్యంలో మరీ స్పష్టీకరించకుండా మూలంలోని సంబంధాన్ని కాపాడుతుంది.
- source_word: וּ/דְבַר יְהוָה
  choice: యెహోవా వాక్యం
  rationale: దైవిక ప్రకటనను సూచించే హెబ్రీయ నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: יָקָר
  choice: అరుదుగా ఉండేది
  rationale: ఈ పదానికి ‘విలువైనది’ అనే అర్థం ఉన్నప్పటికీ, తరువాతి దర్శనాల కొరత సందర్భంలో ‘అరుదైనది’ అనే భావమే ప్రధానంగా ఉంది.
- source_word: בַּ/יָּמִים הָ/הֵם
  choice: ఆ రోజుల్లో
  rationale: కాలసూచక పదబంధానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: אֵין חָזוֹן נִפְרָץ
  choice: దర్శనాలు విస్తృతంగా కలిగేవి కావు
  rationale: חָזוֹן‌ను ఇక్కడ ప్రకటనాత్మక దర్శనాలకు సమష్టిగా తీసుకున్నాం. נִפְרָץ‌లో బయటికి వ్యాపించడం లేదా విస్తరించడం అనే భావం ఉంది; ఈ అనువాదం అవి సామాన్యంగా లేదా బహిరంగంగా కలగలేదనే సందర్భార్థాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో ఒడంబడిక నామం నేరుగా ఉంది. తెలుగులో సాధారణ పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’ను ఉపయోగించి, దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- issue: לִפְנֵי עֵלִי లోని సంబంధం
  choice: ఏలీ సమక్షంలో
  alternative: ఏలీ ఆధ్వర్యంలో
  rationale: సందర్భం ఏలీ పర్యవేక్షణను సూచించినా, హెబ్రీయ పదబంధం నేరుగా ‘సమక్షంలో/ఎదుట’ అంటుంది. వ్యాఖ్యానాత్మకమైన ‘ఆధ్వర్యంలో’ను ప్రధాన పాఠ్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. కొనసాగుతున్న క్రియను ‘చేస్తూ ఉన్నాడు’తో, ప్రకటన కొరతను సహజమైన ‘అరుదుగా ఉండేది’తో తెలిపాం. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
