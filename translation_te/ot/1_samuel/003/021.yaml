reference: 1 Samuel 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥סֶף יְהוָ֖ה לְ/הֵרָאֹ֣ה בְ/שִׁלֹ֑ה כִּֽי נִגְלָ֨ה יְהוָ֧ה אֶל שְׁמוּאֵ֛ל בְּ/שִׁל֖וֹ בִּ/דְבַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/021.yaml
  text: And Yahweh continued to appear at Shiloh[a], for Yahweh revealed himself to Samuel at Shiloh by the word of Yahweh.
translation:
  language: te
  text: యెహోవా షిలోహులో ప్రత్యక్షమవుతూనే ఉన్నాడు; ఎందుకంటే యెహోవా షిలోహులో సమూయేలుకు యెహోవా వాక్కు ద్వారా తనను తాను వెల్లడించుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా వాక్కులో షిలోహులో సమూయేలుకు తనను తాను వెల్లడించుకున్నాడు.”
    reason: בִּדְבַר יְהוָה అనే పదబంధంలోని בְּను ‘ద్వారా’ అనే సాధనార్థకంగా లేదా ‘లో’ అనే పరిధి/మాధ్యమార్థకంగా గ్రహించే అవకాశం ఉంది.
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: మళ్లీ మళ్లీ ... ఉంటూ ఉన్నాడు
  rationale: יָסַף + క్రియార్థక రూపం ఇక్కడ పునరావృతంగా కొనసాగిన చర్యను సూచిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఆ కొనసాగింపును, పునరావృతిని తెలియజేస్తుంది.
- source_word: לְהֵרָאֹה
  choice: ప్రత్యక్షమవుతూ
  rationale: ראה యొక్క నిఫల్ రూపం దైవ ప్రత్యక్షతను సూచిస్తుంది; ‘ప్రత్యక్షమవు’ ఆధునిక గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: בְשִׁלֹה / בְשִׁלוֹ
  choice: షిలోహులో
  rationale: בְ ఇక్కడ స్థలార్థకం; షిలోహు అనే ప్రదేశంలో జరిగినదని సహజ తెలుగులో తెలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణం లేదా వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: נִגְלָה
  choice: తనను తాను వెల్లడించుకున్నాడు
  rationale: גלה నిఫల్ రూపంలోని స్వీయ-ప్రకటన భావాన్ని నిలుపుతూ, ముందున్న ‘ప్రత్యక్షమవు’తో ఉన్న పదార్థ భేదాన్ని కాపాడుతుంది.
- source_word: אֶל שְׁמוּאֵל
  choice: సమూయేలుకు
  rationale: אֶל యొక్క దిశాత్మక/సంబంధార్థాన్ని సహజమైన తెలుగు విభక్తితో వ్యక్తం చేస్తుంది.
- source_word: בִּדְבַר יְהוָה
  choice: తన వాక్కు ద్వారా
  rationale: בְּను సాధనార్థకంగా తీసుకొని, యెహోవా వాక్కు ప్రకటనకు మాధ్యమమని తెలియజేస్తుంది; పునరుక్త దైవనామాన్ని తెలుగు సహజత్వం కోసం ‘తన’తో వ్యక్తం చేసింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; దాన్ని బిరుదుగా మార్చకుండా తెలుగులో సంప్రదాయంగా స్థిరపడిన లిప్యంతరీకరణను ఉంచాం.
- issue: దైవ ప్రత్యక్షత స్వభావం
  choice: ‘ప్రత్యక్షమవుతూ ఉన్నాడు’ మరియు ‘తనను తాను వెల్లడించుకున్నాడు’ అనే రెండు భావాలనూ నిలుపడం
  alternative: దీనిని కేవలం దర్శనంగా లేదా శరీరరూప ప్రత్యక్షతగా నిర్దిష్టీకరించడం
  rationale: హీబ్రూ పాఠం ప్రత్యక్షతనూ, వాక్కు ద్వారా స్వీయ-ప్రకటననూ చెబుతుంది; అయితే దాని ఖచ్చితమైన విధానాన్ని నిర్దేశించదు.
- issue: בִּדְבַר יְהוָה యొక్క సంబంధం
  choice: యెహోవా తన వాక్కు ద్వారా తనను వెల్లడించుకున్నాడు
  alternative: షిలోహులో యెహోవా వాక్కుగా ప్రత్యక్షమయ్యాడు
  rationale: సాధనార్థక పఠనం వ్యాకరణపరంగా సహజమైనది; అయినప్పటికీ హెబ్రీయు పదబంధం సంక్షిప్తత వల్ల ప్రత్యామ్నాయ సంబంధాన్ని పూర్తిగా తొలగించకుండా పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే దైవ ప్రత్యక్షతకు తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ‘వాక్కు’ అనే రూపం ఇక్కడ దైవ ప్రకటనను సూచించే గంభీర సందర్భానికి సరిపోతుంది.
