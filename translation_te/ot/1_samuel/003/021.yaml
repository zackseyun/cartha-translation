revisions:
- from: యెహోవా షిలోహులో మళ్లీ మళ్లీ ప్రత్యక్షమవుతూ ఉన్నాడు; ఎందుకంటే యెహోవా తన వాక్కు ద్వారా షిలోహులో సమూయేలుకు తనను తాను వెల్లడించుకున్నాడు.[a]
  to: యెహోవా షిలోహులో ప్రత్యక్షమవుతూనే ఉన్నాడు; ఎందుకంటే యెహోవా షిలోహులో సమూయేలుకు యెహోవా వాక్కు ద్వారా తనను తాను వెల్లడించుకున్నాడు.[a]
