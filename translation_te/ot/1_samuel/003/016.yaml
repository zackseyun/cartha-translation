source:
  edition: WLC
  text: וַ/יִּקְרָ֤א עֵלִי֙ אֶת שְׁמוּאֵ֔ל וַ/יֹּ֖אמֶר שְׁמוּאֵ֣ל בְּנִ֑/י וַ/יֹּ֖אמֶר הִנֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/016.yaml
  text: Then Eli called Samuel and said, “Samuel, my son.” And he said, “Here I am.”
translation:
  language: te
  text: అప్పుడు ఏలీ సమూయేలును పిలిచి, “సమూయేలూ, నా కుమారుడా,” అన్నాడు. అతడు, “ఇదిగో, నేనున్నాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: కרא అనే క్రియ ఈ కథన సందర్భంలో మాటతో పిలవడాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో తరువాతి וַיֹּאמֶרతో కలిపి ‘పిలిచి ... అన్నాడు’ అనడం సహజంగా ఉంటుంది.
- source_word: עֵלִי
  choice: ఏలీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶת שְׁמוּאֵל
  choice: సమూయేలును
  rationale: אֶת అనే ప్రత్యక్ష కర్మ సూచికకు ప్రత్యేక పదం అవసరం లేదు; తెలుగు విభక్తి ‘-ను’తో కర్మను సూచించాం. పేరును ‘సమూయేలు’గా లిప్యంతరీకరించాం.
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: אמר సాధారణ కథన సంభాషణ క్రియ. ప్రత్యక్ష సంభాషణలో ఆధునిక తెలుగుకు ‘అన్నాడు’ సహజమైనది.
- source_word: שְׁמוּאֵל בְּנִי
  choice: సమూయేలూ, నా కుమారుడా!
  rationale: בְּנִי యొక్క ‘నా కుమారుడు’ అనే మూలార్థాన్నీ, ఏలీ ప్రేమతో సంబోధిస్తున్న భావాన్నీ తెలుగు సంబోధన రూపాలు సహజంగా నిలుపుతాయి.
- source_word: הִנֵּנִי
  choice: ఇదిగో, నేనున్నాను
  rationale: హీబ్రూ పదబంధం కేవలం ఉన్న ప్రదేశాన్ని కాక, పిలుపుకు స్పందిస్తూ తన సమక్షతను మరియు సిద్ధతను తెలియజేస్తుంది. ‘ఇదిగో, నేనున్నాను’ ఆ సంప్రదాయ భావబలాన్ని నిలుపుతుంది.
- source_word: וַ
  choice: అప్పుడు / వాక్య అనుసంధానం
  rationale: మొదటి వావ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది కాబట్టి ‘అప్పుడు’గా అనువదించాం. తరువాతి వావ్‌లను తెలుగు సహజ వాక్య నిర్మాణంలో క్రియల అనుసంధానం మరియు కొత్త వాక్యంతో వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నా కుమారుడా’ అనే సంబోధన మూలంలోని సంబంధపూర్వక ఆప్యాయతను అతిశయింపకుండా నిలుపుతుంది; ‘ఇదిగో, నేనున్నాను’ హీబ్రూ జవాబులోని సిద్ధత భావాన్ని కాపాడుతుంది.
