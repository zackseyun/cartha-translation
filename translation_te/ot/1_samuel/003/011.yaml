language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל הִנֵּ֧ה אָנֹכִ֛י עֹשֶׂ֥ה דָבָ֖ר בְּ/יִשְׂרָאֵ֑ל אֲשֶׁר֙ כָּל שֹׁ֣מְע֔/וֹ תְּצִלֶּ֖ינָה שְׁתֵּ֥י אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/011.yaml
  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: te
  text: 'అప్పుడు యెహోవా సమూయేలుతో ఇలా అన్నాడు: “ఇదిగో, నేను ఇశ్రాయేలులో ఒక కార్యం చేయబోతున్నాను. దాని గురించి వినే ప్రతి ఒక్కరి రెండు చెవులూ గింగురుమంటాయి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను బిరుదుగా మార్చకుండా, తెలుగులో సుపరిచితమైన రూపంలో సూచిస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ సూచక పదం యొక్క బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עֹשֶׂה דָבָר
  choice: ఒక కార్యం చేయబోతున్నాను
  rationale: ప్రస్తుత కృదంతం సందర్భంలో సమీప భవిష్యత్తు ఉద్దేశాన్ని తెలియజేస్తుంది; דָבָר ఇక్కడ సంఘటన లేదా కార్యాన్ని సూచిస్తుంది.
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  choice: రెండు చెవులూ గింగురుమంటాయి
  rationale: భయంకరమైన వార్త విని దిగ్భ్రాంతి చెందడాన్ని తెలిపే హీబ్రూ దేహాత్మక నుడికారాన్ని స్పష్టమైన తెలుగు ప్రతిరూపంతో నిలుపుతుంది.
theological_decisions:
- issue: దేవుని కార్య స్వభావం
  choice: ఒక కార్యం
  alternative: ఒక భయంకరమైన కార్యం
  rationale: మూల వాక్యం కార్యాన్ని విశేషణంతో ముందుగానే భయంకరమని పేర్కొనదు; దాని ప్రభావాన్ని తరువాతి నుడికారం ద్వారా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను కాపాడే వాక్య నిర్మాణం ఉపయోగించబడింది. ప్రత్యక్ష సంభాషణ స్పష్టంగా ఉంచబడింది; మూలంలోని శ్రద్ధాకర్షక పదం మరియు చెవులు గింగురుమనే దృశ్యాత్మక నుడికారం నిలుపబడ్డాయి.
