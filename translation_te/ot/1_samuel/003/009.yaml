id: 1SA.3.9
reference: 1 Samuel 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵלִ֣י לִ/שְׁמוּאֵל֮ לֵ֣ךְ שְׁכָב֒ וְ/הָיָה֙ אִם יִקְרָ֣א אֵלֶ֔י/ךָ וְ/אָֽמַרְתָּ֙ דַּבֵּ֣ר יְהוָ֔ה כִּ֥י שֹׁמֵ֖עַ עַבְדֶּ֑/ךָ וַ/יֵּ֣לֶךְ שְׁמוּאֵ֔ל וַ/יִּשְׁכַּ֖ב בִּ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
translation:
  language: te
  text: అప్పుడు ఏలీ సమూయేలుతో, “వెళ్లి పడుకో. అతడు నిన్ను పిలిస్తే, ‘యాహ్వే[a], మాట్లాడు; నీ సేవకుడు వింటున్నాడు’ అని చెప్పు” అన్నాడు. కాబట్టి సమూయేలు వెళ్లి తన స్థలంలో పడుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇక్కడ దేవుని వ్యక్తిగత నామం יהוה ఉంది. దీన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం; అనేక అనువాదాలు దీనికి బదులుగా ‘ప్రభువు’ అని వాడతాయి.
    reason: దైవనామాన్ని ‘యాహ్వే’గా అనువదించిన విధానాన్ని, ‘ప్రభువు’ అనే సంప్రదాయ ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ఏలీ ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని సూచిస్తుంది.
- source_word: לֵךְ שְׁכָב
  choice: వెళ్లి పడుకో
  rationale: వరుసగా ఉన్న రెండు ఆజ్ఞార్థక క్రియల ప్రత్యక్షతను కాపాడుతూ, మూలంలో లేని ‘నిద్రపో’ అనే భావాన్ని జోడించలేదు.
- source_word: וְהָיָה אִם
  choice: పిలిస్తే
  rationale: ఈ నిర్మాణం షరతును సూచిస్తుంది. ‘పిలిచినప్పుడు’ అని అనువదిస్తే జరగడం నిశ్చయమనే భావం పెరుగుతుంది; ‘పిలిస్తే’ మూలంలోని షరతును నిలుపుతుంది.
- source_word: יִקְרָא אֵלֶיךָ
  choice: అతడు నిన్ను పిలిస్తే
  rationale: మూలంలో కర్త 3వ పురుష ఏకవచనంగా అంతర్లీనంగా ఉంది. సందర్భంలో పిలిచేవాడు యెహోవా అని ఏలీ గ్రహించినందున ‘అతడు’ సముచితం; అయినా ఈ ఉపవాక్యంలో దైవనామాన్ని అదనంగా చేర్చలేదు.
- source_word: וְאָמַרְתָּ
  choice: అని చెప్పు
  rationale: షరతుకు అనుసరించే ఆదేశాన్ని సహజమైన తెలుగు ఆజ్ఞారూపంలో వ్యక్తం చేస్తుంది.
- source_word: דַּבֵּר
  choice: మాట్లాడవయ్యా
  rationale: దైవాన్ని నేరుగా సంబోధించే ఆజ్ఞార్థక రూపం. తెలుగు వినియోగంలో ‘మాట్లాడు’ కఠిన ఆజ్ఞలా వినిపించగలదు; ‘మాట్లాడవయ్యా’ వినయపూర్వక విజ్ఞప్తి స్వరాన్ని ఇస్తుంది, కాని అదనపు విషయాన్ని చేర్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన వ్యక్తినామ రూపంలో ఉంచింది.
- source_word: כִּי
  choice: ;
  rationale: కారణ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి విరామచిహ్నంతో రెండు భాగాలను అనుసంధానించాం; ‘ఎందుకంటే’ అని పెట్టడం ఈ ప్రత్యక్ష సంభాషణలో భారంగా ఉంటుంది.
- source_word: שֹׁמֵעַ
  choice: వింటున్నాడు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న శ్రద్ధను సూచిస్తుంది; ‘విన్నాడు’ కాకుండా ‘వింటున్నాడు’ సిద్ధంగా ఆలకిస్తున్న భావాన్ని నిలుపుతుంది.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుడు
  rationale: ఇక్కడ עבד దేవుని ఎదుట వినయపూర్వక స్వీయపరిచయం; బానిసత్వ స్థితిని ప్రధానంగా చూపడం లేదు.
- source_word: וַיֵּלֶךְ ... וַיִּשְׁכַּב
  choice: కాబట్టి సమూయేలు వెళ్లి ... పడుకున్నాడు
  rationale: వరుస కథన క్రియలను, ఏలీ ఆదేశానికి సమూయేలు ఇచ్చిన ప్రతిస్పందనను సహజంగా కలుపుతుంది.
- source_word: בִּמְקוֹמוֹ
  choice: తన స్థలంలో
  rationale: సమూయేలుకు కేటాయించిన స్థలాన్ని మూలానికి దగ్గరగా సూచిస్తుంది; ‘తన మామూలు స్థలంలో’ వంటి అదనపు వివరణను చేర్చలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం బిరుదును కాకుండా చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దైవనామాన్ని పాఠ్యంలో నిలిపాం; ఉచ్చారణ సంప్రదాయ భేదాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: יִקְרָא యొక్క అంతర్లీన కర్త
  choice: అతడు నిన్ను పిలిస్తే
  alternative: ఎవరైనా నిన్ను పిలిస్తే; యెహోవా నిన్ను పిలిస్తే
  rationale: హీబ్రూలో కర్త స్పష్టంగా నామవాచకంగా లేదు, కానీ పురుష ఏకవచనం అంతర్లీనంగా ఉంది; తక్షణ సందర్భం యెహోవాను సూచిస్తుంది. ‘అతడు’ వ్యాకరణాన్ని, సందర్భోచిత సూచనను రెండింటినీ నిలుపుతుంది.
- issue: דַּבֵּר అనే ఆజ్ఞను దేవునికి సంబోధించడం
  choice: మాట్లాడవయ్యా
  alternative: మాట్లాడు; సెలవియ్యి
  rationale: మూలంలోని ప్రత్యక్ష ఆజ్ఞార్థకతను ఉంచుతూ, ఆధునిక తెలుగులో దేవునితో వినయపూర్వకంగా మాట్లాడే స్వరాన్ని అందిస్తుంది; అతి ప్రాచీనమైన ‘సెలవియ్యి’ని నివారించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనా గౌరవప్రదమైన కథన శైలి. సంభాషణలో సహజత్వం కోసం ‘మాట్లాడవయ్యా’ వాడబడింది. దైవనామం పాఠ్యంలో వ్యక్తినామంగానే నిలుపబడింది; పాదటిప్పణి గుర్తు సంబంధిత పదం వెంట ఉంచబడింది.
