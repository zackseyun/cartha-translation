  to: అప్పుడు ఏలీ సమూయేలుతో, “వెళ్లి పడుకో. అతడు నిన్ను పిలిస్తే, ‘యాహ్వే[a], మాట్లాడు; నీ సేవకుడు వింటున్నాడు’ అని చెప్పు” అన్నాడు. కాబట్టి సమూయేలు వెళ్లి తన స్థలంలో పడుకున్నాడు.
  rationale: సవరించిన పాఠ్యం మూలంలోని షరతు, ప్రత్యక్ష సంబోధన, మరియు గౌరవప్రదమైన ‘నీ సేవకుడు’ అనే స్వీయసంబోధనను నిలుపుతుంది. దైవనామాన్ని English POB audit trailతో సమానంగా ‘యాహ్వే’గా చేసింది. ‘వయ్యా’ను తొలగించడం ద్వారా మూలంలో లేని సన్నిహిత సంభాషణా స్వరాన్ని నివారించాం.
