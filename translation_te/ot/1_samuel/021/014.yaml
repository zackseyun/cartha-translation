  edition: WLC
  text: וַ/יְשַׁנּ֤/וֹ אֶת טַעְמ/וֹ֙ בְּ/עֵ֣ינֵי/הֶ֔ם וַ/יִּתְהֹלֵ֖ל בְּ/יָדָ֑/ם ו/יתו עַל דַּלְת֣וֹת הַ/שַּׁ֔עַר וַ/יּ֥וֹרֶד רִיר֖/וֹ אֶל זְקָנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
translation:
  language: te
  text: అప్పుడు అతడు వారి కళ్ల ఎదుట తన ప్రవర్తనను మార్చుకొని, వారి చేతుల్లో ఉండగా పిచ్చివాడిలా ప్రవర్తించాడు[a]. ద్వారపు తలుపుల మీద గీతలు గీశాడు[b]; తన లాలాజలం తన గడ్డం మీదికి కారనిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పిచ్చి పట్టినట్లు నటించాడు.” హీబ్రూ క్రియ పిచ్చిగా ప్రవర్తించడాన్ని వర్ణిస్తుంది; అది ఉద్దేశపూర్వక నటన అని విస్తృత సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ క్రియ అర్థం క్లిష్టమైనది. దీనిని “ద్వారపు తలుపులను గోకాడు” లేదా “వాటిమీద రాతలు గీశాడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ אֶת־טַעְמוֹ
  choice: తన ప్రవర్తనను మార్చుకొని
  rationale: טַעַם సాధారణంగా ‘రుచి’ లేదా ‘వివేచన’ను సూచించగలిగినా, ఇక్కడ ఇతరులకు కనిపించిన అతని తీరు లేదా ప్రవర్తన భావం సందర్భానికి సరిపోతుంది. అంతర్గత మానసిక స్థితిని ఖచ్చితంగా నిర్ణయించకుండా దృశ్యమైన మార్పును తెలియజేస్తుంది.
- source_word: בְּעֵינֵיהֶם
  choice: వారి కళ్ల ఎదుట
  rationale: ‘వారి దృష్టిలో/వారి సమక్షంలో’ అనే హీబ్రూ నుడికారంలోని దృశ్యరూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיִּתְהֹלֵל
  choice: పిచ్చివాడిలా ప్రవర్తించాడు
  rationale: ఈ సందర్భంలో התפעל రూపం పిచ్చిగా లేదా ఉన్మాదంగా ప్రవర్తించడాన్ని సూచిస్తుంది. ఇది నటన అని విస్తృత సందర్భం తెలియజేసినా, క్రియలోనే ఉద్దేశపూర్వక నటనను పూర్తిగా నింపకుండా ప్రధాన పాఠం ఉంచబడింది.
- source_word: בְּיָדָם
  choice: వారి చేతుల్లో ఉన్నప్పుడు
  rationale: ‘వారి చేతుల్లో’ అనే మూల రూపకాన్ని నిలుపుతూ, వారి ఆధీనంలో లేదా పట్టులో ఉన్న స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: ויתו
  choice: గీతలు గీశాడు
  rationale: మసొరేటిక్ రూపం క్లిష్టమైనది. సందర్భంలో ద్వారాలపై ఏవో గుర్తులు వేయడాన్ని సూచించవచ్చు; ‘గీతలు గీశాడు’ అనేది చెక్కడం లేదా రాయడం వంటి మరింత నిర్దిష్ట అర్థాన్ని బలవంతంగా నిర్ణయించని విస్తృత ఎంపిక.
- source_word: דַּלְתוֹת הַשַּׁעַר
  choice: ద్వారపు తలుపులు
  rationale: పట్టణ ద్వారంలోని తలుపు పలకలను సూచించే పదబంధానికి స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: וַיּוֹרֶד רִירוֹ
  choice: తన లాలాజలం ... కారనిచ్చాడు
  rationale: ‘కిందికి దిగేలా చేశాడు’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; רִירוֹకు ‘లాలాజలం’ స్పష్టమైన, గౌరవప్రదమైన ఆధునిక పదం.
- source_word: אֶל־זְקָנוֹ
  choice: తన గడ్డం మీదికి
  rationale: లాలాజలం కిందికి ప్రవహించి గడ్డం మీదికి చేరిన దిశను సహజంగా తెలియజేస్తుంది.
