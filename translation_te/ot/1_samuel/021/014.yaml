translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ నుడికారమైన ‘వారి చేతుల్లో’ను అర్థస్పష్టత కోసం ‘వారి చేతుల్లో ఉన్నప్పుడు’గా ఉంచాం. క్లిష్టమైన ויתו విషయంలో ప్రధాన పాఠం జాగ్రత్తగా విస్తృత అర్థాన్ని ఇస్తూ, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నిలిపింది.
