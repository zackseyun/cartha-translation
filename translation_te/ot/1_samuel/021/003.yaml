source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד לַ/אֲחִימֶ֣לֶךְ הַ/כֹּהֵ֗ן הַ/מֶּלֶךְ֮ צִוַּ֣/נִי דָבָר֒ וַ/יֹּ֣אמֶר אֵלַ֗/י אִ֣ישׁ אַל יֵ֧דַע מְא֛וּמָה אֶת הַ/דָּבָ֛ר אֲשֶׁר אָנֹכִ֥י שֹׁלֵֽחֲ/ךָ֖ וַ/אֲשֶׁ֣ר צִוִּיתִ֑/ךָ וְ/אֶת הַ/נְּעָרִ֣ים יוֹדַ֔עְתִּי אֶל מְק֥וֹם פְּלֹנִ֖י אַלְמוֹנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
translation:
  language: te
  text: 'దావీదు యాజకుడైన అహీమెలెకుతో ఇలా అన్నాడు: “రాజు నాకు ఒక పని అప్పగించి, ‘నేను నిన్ను పంపుతున్న ఈ పని గురించీ, నీకు ఇచ్చిన ఆజ్ఞ గురించీ ఎవరికీ ఏమీ తెలియనివ్వకు’ అని నాతో చెప్పాడు. యువకులకు ఫలానా చోటును[a] నేను తెలియజేశాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “ఫలానా-ఫలానా ప్రదేశం”; ఇది పేరు చెప్పని లేదా వెల్లడించని ప్రదేశాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוַּנִי דָבָר
  choice: నాకు ఒక పని అప్పగించి
  rationale: צוה ఆజ్ఞాపించడం లేదా బాధ్యత అప్పగించడం అనే భావాన్ని కలిగిస్తుంది; דָבָר ఇక్కడ రాజు అప్పగించిన పని లేదా వ్యవహారాన్ని సూచిస్తుంది. సహజమైన తెలుగులో రెండింటి భావాన్నీ ఈ రూపం అందిస్తుంది.
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  choice: ఎవరికీ ఏమీ తెలియనివ్వకు
  rationale: ఇది నిషేధార్థక ఆజ్ఞ. אִישׁ ఇక్కడ సాధారణీకరణతో ‘ఎవరూ’ అనే భావంలో ఉంది; ఆధునిక తెలుగులో లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా మూలార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַדָּבָר
  choice: ఈ పని
  rationale: דבר ఇక్కడ మాటను కాక, దావీదు పంపబడుతున్న పని లేదా వ్యవహారాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחֲךָ
  choice: నేను నిన్ను పంపుతున్న
  rationale: రాజు దావీదును ఏ పని నిమిత్తం పంపుతున్నాడో తెలిపే సంబంధ వాక్యంగా సరళంగా అనువదించబడింది.
- source_word: וַאֲשֶׁר צִוִּיתִךָ
  choice: నీకు ఇచ్చిన ఆజ్ఞ
  rationale: צוה యొక్క ఆజ్ఞాపన భావాన్ని స్పష్టంగా నిలుపుతుంది; ముందటి వాడుకతో భావసంబంధాన్ని కాపాడుతుంది.
- source_word: וְאֶת־הַנְּעָרִים
  choice: యువకులను
  rationale: נְעָרִים అనేది యువకులు, సేవకులు లేదా సహాయకులు కావచ్చు. సందర్భం సామాజిక హోదాను ఖచ్చితంగా నిర్ణయించనందున ప్రత్యక్షమైన ‘యువకులు’ అనే పదం ఎంచుకోబడింది.
- source_word: יוֹדַעְתִּי
  choice: వెళ్లమని నేను చెప్పాను
  rationale: ידע హిఫీల్ సాధారణంగా ‘తెలియజేయడం’ అయినప్పటికీ, אֶל־מְקוֹם తో ఇక్కడ వారిని నిర్ణీత ప్రదేశానికి నిర్దేశించిన భావం సహజం. తెలుగు వాక్యంలో అవసరమైన గమనార్థాన్ని స్పష్టంగా చేస్తుంది.
- source_word: אֶל־מְקוֹם פְּלֹנִי אַלְמוֹנִי
  choice: ఫలానా చోటికి
  rationale: ఈ జంట పదబంధం పేరు చెప్పని లేదా వెల్లడించని ప్రదేశాన్ని సూచించే హీబ్రూ నుడికారం. ‘ఫలానా చోటు’ తెలుగులో దానికి దగ్గరైన సహజ నుడికారం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. రాజాజ్ఞకు తగిన అధికారిక స్వరం నిలుపుతూ, హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో తెలుగు సమాన నుడికారంతో ప్రతిబింబించాం. అందించిన ఇంగ్లీషు పాఠ్యంలో పాదసూచిక గుర్తుల అమరిక విషయంతో సరిపోలకపోవడంతో, మూల హీబ్రూ ఆధారంగా ప్రదేశ నుడికారానికే [a] గుర్తు ఉంచబడింది.
