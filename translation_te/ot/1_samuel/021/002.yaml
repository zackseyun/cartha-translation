base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: te
  text: దావీదు నోబుకు, యాజకుడైన అహీమెలెకు దగ్గరకు వచ్చాడు. అహీమెలెకు దావీదును ఎదుర్కొనగా వణికిపోయి అతనితో, “నీవు ఎందుకు ఒంటరిగా ఉన్నావు? నీతో ఒక్క మనిషీ ఎందుకు లేడు?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד
  choice: వణుకుతూ వచ్చి
  rationale: ఈ క్రియ భయం లేదా తీవ్ర కలవరంతో వణకడాన్ని సూచిస్తుంది. సందర్భంలో అహీమెలెకు దావీదును ఎదుర్కొనడానికి భయంతో వచ్చిన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לִקְרַאת דָּוִד
  choice: దావీదును కలుసుకోవడానికి
  rationale: ఈ పదబంధానికి ‘దావీదును ఎదుర్కొనడానికి/కలుసుకోవడానికి’ అనే భావం ఉంది; సందర్భానికి తటస్థంగా, సహజంగా ‘కలుసుకోవడానికి’ ఎంచుకున్నాం.
- source_word: וְאִישׁ אֵין אִתָּךְ
  choice: నీతో ఎవరూ లేరేమిటి?
  rationale: అక్షరార్థంగా ‘నీతో ఒక మనిషి కూడా లేడు’; తెలుగులో లింగ-నిరపేక్షంగా, సహజంగా అదే సంపూర్ణ ఒంటరితనాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘యాజకుడైన అహీమెలెకు దగ్గరికి’ అనే నిర్మాణం గమ్యస్థానాన్ని స్పష్టంగా తెలియజేస్తుంది; ప్రశ్నలను ప్రత్యక్ష సంభాషణలో సహజంగా మలిచాం.
