id: 1SA.21.1
reference: 1 Samuel 21:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וִ/יהוֹנָתָ֖ן בָּ֥א הָ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/001.yaml
  text: Then he arose and went away[a], and Jonathan entered the city.
translation:
  language: te
  text: అప్పుడు అతడు లేచి వెళ్లిపోయాడు; యోనాతాను పట్టణానికి వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టణంలోకి వెళ్లాడు.” హీబ్రూలో అక్షరార్థంగా “పట్టణానికి వచ్చాడు.”
    reason: בוא క్రియను గమనం ఎవరి దృక్కోణం నుంచి వర్ణించబడుతుందో అనుసరించి తెలుగులో ‘వచ్చాడు’ లేదా ‘వెళ్లాడు’ అని వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: וַיָּקָם
  choice: అప్పుడు అతడు లేచి
  rationale: קום క్రియ యొక్క ఖల్ వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తూ ‘లేచాడు’ అనే భావాన్ని ఇస్తుంది. తెలుగులో క్రియకు అవసరమైన కర్తను ‘అతడు’గా ఉంచాం; సందర్భం అతడు దావీదు అని తెలియజేస్తున్నా, హీబ్రూ పాఠంలో పేరు ఇక్కడ ప్రత్యక్షంగా లేదు.
- source_word: וַיֵּלַךְ
  choice: వెళ్లిపోయాడు
  rationale: הלך అంటే ‘వెళ్లు/నడుచు.’ ఈ వీడ్కోలు సందర్భంలో ‘వెళ్లిపోయాడు’ విడిచి వెళ్లిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וִיהוֹנָתָן
  choice: యోనాతాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בָּא
  choice: వచ్చాడు
  rationale: בוא ఖల్ పర్ఫెక్ట్ రూపానికి నేరమైన అర్థం ‘వచ్చాడు.’ మూలపాఠంలోని దిశాసూచక దృక్కోణాన్ని నిలుపుతూ ఇదే రూపాన్ని ప్రధాన పాఠంలో ఉంచాం.
- source_word: הָעִיר
  choice: పట్టణానికి
  rationale: עיר అంటే సందర్భానుసారం ‘పట్టణం’ లేదా ‘నగరం.’ ఇక్కడ నిర్దిష్ట గమ్యస్థానాన్ని సహజ తెలుగులో ‘పట్టణానికి’ అని వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడాం. మొదటి కర్తను సందర్భం దావీదుగా గుర్తించినప్పటికీ, మూలపాఠంలో పేరు లేకపోవడంతో ‘అతడు’ అని ఉంచాం. రెండు చర్యల మధ్య కర్త మార్పు స్పష్టంగా ఉండేందుకు అర్ధవిరామం వాడాం.
