translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన-సంభాషణ శైలి వాడబడింది. హీబ్రూ నుడికారాలను పదానువాదంగా కాకుండా సహజమైన తెలుగు ప్రయోగాలతో అందించి, అక్షరార్థాలను పాదసూచికల్లో నిలిపాం.
