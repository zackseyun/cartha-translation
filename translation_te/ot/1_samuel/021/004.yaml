id: 1SA.21.4
reference: 1 Samuel 21:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה מַה יֵּ֧שׁ תַּֽחַת יָדְ/ךָ֛ חֲמִשָּׁה לֶ֖חֶם תְּנָ֣/ה בְ/יָדִ֑/י א֖וֹ הַ/נִּמְצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/004.yaml
  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
translation:
  language: te
  text: “ఇప్పుడు అయితే, నీ దగ్గర[a] ఏమి ఉంది? ఐదు రొట్టెలు నాకు ఇవ్వు[b]; లేదా అందుబాటులో ఉన్నది ఏదైనా ఇవ్వు[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నీ చేతి కింద ఏముంది?’ ఇది ఒకరి వద్ద వెంటనే అందుబాటులో ఉన్నదానిని లేదా వారి అధీనంలో ఉన్నదానిని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా చేతిలో పెట్టు’; భావం, ‘నాకు ఇవ్వు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దొరికినది ఏదైనా.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: కాలసూచనతో పాటు ముందటి సంభాషణ నుంచి తక్షణ అభ్యర్థనకు మార్పును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מַה יֵּשׁ תַּחַת יָדְךָ
  choice: నీ దగ్గర ఏముంది?
  rationale: ‘నీ చేతి కింద ఏముంది?’ అనే హీబ్రూ నుడికారం ఒకరి వద్ద ప్రస్తుతం ఉన్నదానిని లేదా వెంటనే అందుబాటులో ఉన్నదానిని సూచిస్తుంది. ‘నీ దగ్గర’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: חֲמִשָּׁה לֶחֶם
  choice: ఐదు రొట్టెలు
  rationale: హీబ్రూలో ‘రొట్టె’ సమాహారార్థకంగా ఉన్నా, ఐదు అనే సంఖ్యతో కూడిన నిర్దిష్ట ఆహారవస్తువులను తెలుగులో ‘ఐదు రొట్టెలు’ అని సహజంగా చెప్పవచ్చు.
- source_word: תְּנָה בְיָדִי
  choice: నాకు ఇవ్వు
  rationale: అక్షరార్థంగా ‘నా చేతిలో పెట్టు’ అయిన ఈ ప్రయోగం వ్యక్తికి ఇవ్వడాన్ని సూచిస్తుంది; ‘నాకు ఇవ్వు’ సహజమైన తెలుగు సమానార్థకం.
- source_word: אוֹ הַנִּמְצָא
  choice: లేదా ఏది అందుబాటులో ఉంటే అది ఇవ్వు
  rationale: מצא ధాతువు యొక్క నిష్క్రియ కృదంతం ‘దొరికేది/కనబడేది’ అనే భావం ఇస్తుంది. సందర్భంలో ప్రస్తుతం లభ్యమయ్యే దేనినైనా ఇవ్వమనే అభ్యర్థనను ఇది స్పష్టం చేస్తుంది.
