source:
  edition: WLC
  text: וְ/שָׁ֡ם אִישׁ֩ מֵ/עַבְדֵ֨י שָׁא֜וּל בַּ/יּ֣וֹם הַ/ה֗וּא נֶעְצָר֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/שְׁמ֖/וֹ דֹּאֵ֣ג הָ/אֲדֹמִ֑י אַבִּ֥יר הָ/רֹעִ֖ים אֲשֶׁ֥ר לְ/שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: A man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
translation:
  language: te
  text: ఆ రోజున సౌలు సేవకుల్లో ఒకడు అక్కడ యాహ్వే సన్నిధిలో నిలిపివేయబడి ఉన్నాడు[a]; అతని పేరు ఎదోమీయుడైన దోయేగు. అతడు సౌలుకు చెందిన కాపరుల అధిపతి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే సన్నిధిలో ఆపి ఉంచబడ్డాడు” లేదా “యాహ్వే సన్నిధిలో నిరోధించబడ్డాడు.” దోయేగు ఎందుకు నిలిపివేయబడ్డాడో హెబ్రీ మూలపాఠం చెప్పదు.
    reason: నֶעְצָרకు నిలిపివేయబడడం, ఆపి ఉంచబడడం, నిరోధించబడడం వంటి అర్థసంభావ్యతలు ఉన్నాయి; అతడు ఎందుకు అలా ఉన్నాడో మూలపాఠం నిర్దిష్టంగా చెప్పదు.
lexical_decisions:
- source_word: וְשָׁם אִישׁ מֵעַבְדֵי שָׁאוּל
  choice: సౌలు సేవకుల్లో ఒకడు అక్కడ ఉన్నాడు
  rationale: מִן‌ను భాగసూచకంగా తీసుకొని, అతడు సౌలు సేవకుల్లో ఒకడని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; וְשָׁם‌లోని కథన అనుసంధానాన్ని ప్రత్యేకంగా ‘ఇప్పుడు’ అని చేర్చకుండా వాక్యప్రవాహంలో ఉంచింది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: కాలసూచక హెబ్రీ పదబంధానికి సరళమైన, సహజమైన తెలుగు రూపం.
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో ఆపి ఉంచబడ్డాడు
  rationale: నిష్క్రియ రూపంలోని ‘ఆపబడడం/నిలిపివేయబడడం’ అనే భావాన్ని నిలుపుతూ, దానికి గల ఆచారపరమైన లేదా ఇతర కారణాన్ని ఊహించి చేర్చదు. לִפְנֵי అనే సన్నిధి భావాన్ని ‘సన్నిధిలో’గా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ చతురక్షర నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇస్తుంది.
- source_word: וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי
  choice: అతని పేరు ఎదోమీయుడైన దోయేగు
  rationale: పేరు పరిచయ సూత్రాన్ని సహజమైన తెలుగులోనూ, జాతిసూచక పదాన్ని స్పష్టంగానూ అందిస్తుంది.
- source_word: אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל
  choice: అతడు సౌలు కాపరులకు అధిపతి
  rationale: ఈ పరిపాలనా సందర్భంలో אַבִּיר శారీరక బలం కన్నా ప్రముఖ స్థానం లేదా నాయకత్వాన్ని సూచించే అవకాశం ఎక్కువ; ‘అధిపతి’ ఆ హోదాను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యాహ్వే’ హెబ్రీ నామానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణ.
- issue: נֶעְצָר לִפְנֵי יְהוָה యొక్క అర్థం
  choice: యాహ్వే సన్నిధిలో ఆపి ఉంచబడ్డాడు
  alternative: యాహ్వే సన్నిధిలో నిలిపివేయబడ్డాడు / అక్కడే ఉండేలా చేయబడ్డాడు
  rationale: దోయేగు అక్కడ ఎందుకు ఉండవలసి వచ్చిందో మూలపాఠం వివరించదు. అందువల్ల నిర్దిష్టమైన ఆచార కారణాన్ని లేదా శిక్షారూప నిర్బంధాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి. అస్పష్టమైన హెబ్రీ నిష్క్రియ పదబంధాన్ని వివరణాత్మకంగా పరిష్కరించకుండా పాదసూచికతో నిలిపింది.
