translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యంలోని వరుస చర్యలను తెలుగు అసమాపక క్రియలతో నిలుపుతూ, చివరి క్రియను సమాపక రూపంలో ఇచ్చాం.
