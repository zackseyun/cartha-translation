  yaml_path: translation/ot/1_samuel/021/011.yaml
  text: So David arose and fled that day from Saul, and he came to Achish king of Gath.
translation:
  language: te
  text: దావీదు లేచి, ఆ రోజున సౌలు నుండి పారిపోయి, గాతు రాజైన ఆకీషు దగ్గరకు వచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియకు ప్రాథమికంగా ‘లేచు’ అనే అర్థం ఉంది. ఇక్కడ ‘లేచి’ అని అనువదించడం హెబ్రీ కథన క్రమాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיִּבְרַח
  choice: పారిపోయి
  rationale: ברח సాధారణంగా ప్రమాదం లేదా శత్రువు నుండి ‘పారిపోవడం’ను సూచిస్తుంది; సందర్భంలోని అత్యవసరతను ఈ ఎంపిక స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజే
  rationale: ఈ కాలసూచక పదబంధం ‘ఆ రోజున’ అని అర్థం. ‘ఆ రోజే’ అనేది అదే రోజు జరిగిన చర్యను సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִפְּנֵי שָׁאוּל
  choice: సౌలు ఎదుటనుండి
  rationale: మూలంలోని ‘సౌలు ముఖము/సన్నిధి నుండి’ అనే రూపకాన్ని తెలుగు నుడికారానికి అనుగుణంగా ఉంచుతూ, దావీదు సౌలు సమక్షం మరియు ముప్పు నుండి పారిపోయాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: וַיָּבֹא אֶל
  choice: దగ్గరికి వచ్చాడు
  rationale: בוא + אֶל అంటే ఒక వ్యక్తి లేదా స్థలానికి రావడం/వెళ్లడం. ఆకీషు అనే వ్యక్తిని లక్ష్యంగా చూపించడానికి ‘దగ్గరికి వచ్చాడు’ సహజమైన తెలుగు.
- source_word: אָכִישׁ
  choice: ఆకీషు
  rationale: హెబ్రీ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: מֶלֶךְ גַּת
  choice: గాతు రాజైన
  rationale: హెబ్రీ సమాసం ఆకీషును గాతు పట్టణపు రాజుగా గుర్తిస్తుంది. తెలుగులో వ్యక్తినామానికి ముందు ‘గాతు రాజైన’ అని చెప్పడం స్పష్టంగా, సహజంగా ఉంటుంది.
