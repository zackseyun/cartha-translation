id: 1SA.21.9
reference: 1 Samuel 21:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לַ/אֲחִימֶ֔לֶךְ וְ/אִ֛ין יֶשׁ פֹּ֥ה תַֽחַת יָדְ/ךָ֖ חֲנִ֣ית אוֹ חָ֑רֶב כִּ֣י גַם חַרְבִּ֤/י וְ/גַם כֵּלַ/י֙ לֹֽא לָקַ֣חְתִּי בְ/יָדִ֔/י כִּֽי הָיָ֥ה דְבַר הַ/מֶּ֖לֶךְ נָחֽוּץ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
translation:
  language: te
  text: 'దావీదు అహీమెలెకుతో ఇలా అన్నాడు: “ఇక్కడ నీ దగ్గర ఈటెగానీ ఖడ్గంగానీ ఏదైనా ఉందా?[a] రాజు పని అత్యవసరం కావడంతో నా ఖడ్గాన్నీ, నా ఆయుధ సామగ్రినీ[b] వెంట తీసుకురాలేదు.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘నీ చేతి కింద’; అంటే ‘నీ దగ్గర’ లేదా ‘నీ అధీనంలో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా సామగ్రిని’; హీబ్రూ పదం పరికరాలు, సామగ్రి లేదా ఆయుధాలను విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: ‘రాజు పని’ అనే హీబ్రూ పదబంధాన్ని ‘రాజు విషయం,’ ‘రాజు కార్యం,’ లేదా ‘రాజు ఆజ్ఞ’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לַאֲחִימֶלֶךְ
  choice: దావీదు అహీమెలెకుతో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్య నిర్మాణంలో అందిస్తుంది; వ్యక్తి పేరును అహీమెలెకు అని లిప్యంతరీకరించింది.
- source_word: וְאִין יֶשׁ פֹּה
  choice: ఇక్కడ ... ఏదైనా ఉందా?
  rationale: హీబ్రూలోని ప్రతికూల అస్తిత్వ ప్రశ్నను తెలుగులో సహజమైన అభ్యర్థనాత్మక ప్రశ్నగా అందించింది; ఆయుధం ఏదైనా అందుబాటులో ఉందా అన్న భావం నిలిచింది.
- source_word: תַחַת יָדְךָ
  choice: నీ దగ్గర
  rationale: అక్షరార్థంగా ‘నీ చేతి కింద’; సందర్భంలో ‘నీ వద్ద/నీ అధీనంలో’ అనే నుడికార భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֲנִית אוֹ חָרֶב
  choice: ఈటెగానీ ఖడ్గంగానీ
  rationale: రెండు ఏకవచన ఆయుధ పదాలను నేరుగా, ప్రశ్నకు సహజంగా సరిపోయే తెలుగు జత నిర్మాణంతో అనువదించింది.
- source_word: גַם חַרְבִּי וְגַם כֵּלַי
  choice: నా ఖడ్గాన్నీ, నా ఆయుధ సామగ్రినీ
  rationale: כְּלִי అనే విస్తృత పదానికి సందర్భానుగుణంగా ‘ఆయుధ సామగ్రి’ ఎంచుకుంది; అది కేవలం ఒక్క ఆయుధానికి పరిమితం కాకుండా పరికరాలు/సామగ్రి అనే విస్తృతిని కొంత నిలుపుతుంది.
- source_word: לֹא לָקַחְתִּי בְיָדִי
  choice: వెంట తీసుకురాలేదు
  rationale: ‘నా చేతిలో తీసుకోలేదు’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דְבַר הַמֶּלֶךְ
  choice: రాజు పని
  rationale: דָּבָר ఇక్కడ మాట, విషయం, పని లేదా ఆజ్ఞను సూచించవచ్చు; ‘పని’ సందర్భానికి సహజంగా ఉండి, దాన్ని నిర్దిష్టంగా ‘ఆజ్ఞ’గా పరిమితం చేయదు.
- source_word: נָחוּץ
  choice: అత్యవసరం
  rationale: త్వరగా చేయవలసిన, ఆలస్యం సహించని పరిస్థితిని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని నుడికారాలను పదేపదే అనుకరించకుండా వాటి భావాన్ని స్పష్టంగా అందిస్తూ, כְּלִי మరియు דְבַר అనే విస్తృత పదాల అనిశ్చితిని పాదసూచికల్లో నిలిపింది.
