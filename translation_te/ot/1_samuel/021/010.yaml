source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/כֹּהֵ֗ן חֶרֶב֩ גָּלְיָ֨ת הַ/פְּלִשְׁתִּ֜י אֲשֶׁר הִכִּ֣יתָ בְּ/עֵ֣מֶק הָאֵלָ֗ה הִנֵּה הִ֞יא לוּטָ֣ה בַ/שִּׂמְלָה֮ אַחֲרֵ֣י הָ/אֵפוֹד֒ אִם אֹתָ֤/הּ תִּֽקַּח לְ/ךָ֙ קָ֔ח כִּ֣י אֵ֥ין אַחֶ֛רֶת זוּלָתָ֖/הּ בָּ/זֶ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אֵ֥ין כָּמ֖וֹ/הָ תְּנֶ֥/נָּה לִּֽ/י־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/010.yaml
  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
translation:
  language: te
  text: యాజకుడు, “నీవు ఏలా లోయలో కొట్టి పడగొట్టిన ఫిలిష్తీయుడైన గొల్యాతు ఖడ్గం ఇదిగో! అది ఏఫోదు వెనుక ఒక పైవస్త్రంలో[a] చుట్టి ఉంది. నీవు దాన్ని నీ కోసం తీసుకోవాలనుకుంటే తీసుకో; అది తప్ప ఇక్కడ మరొక ఖడ్గం లేదు” అన్నాడు. దావీదు, “దానికి సాటైనది లేదు; దాన్ని నాకు ఇవ్వండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి ‘వస్త్రం,’ ‘పైవస్త్రం,’ లేదా ‘అంగీ’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: ఫిలిష్తీయుడైన గొల్యాతు ఖడ్గం
  rationale: హీబ్రూ సమాస సంబంధాన్ని సహజమైన తెలుగులో చూపుతూ, గొల్యాతును గుర్తించే జాతి సూచనను నిలుపుతుంది.
- source_word: הִכִּיתָ
  choice: కొట్టి పడగొట్టిన
  rationale: נכה అనే క్రియలోని ‘కొట్టు’ అనే ప్రాథమిక భావాన్నీ, యుద్ధ సందర్భంలోని ఓటమి/వధ సూచననూ ఉంచుతుంది; ‘చంపిన’ అని మాత్రమే చెప్పి భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: ఏలా లోయలో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, עֵמֶקకు సహజమైన ఆధునిక తెలుగు పదమైన ‘లోయ’ను వాడుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: వస్తువువైపు దృష్టి మళ్లించే హీబ్రూ అవ్యయపు సంభాషణాత్మక విధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לוּטָה בַשִּׂמְלָה
  choice: ఒక పైవస్త్రంలో చుట్టి ఉంది
  rationale: לוּטָהలోని కప్పి/చుట్టి ఉంచిన స్థితిని, שִׂמְלָהలోని వస్త్రం లేదా పైవస్త్రం భావాన్ని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: אַחֲרֵי הָאֵפוֹד
  choice: ఏఫోదు వెనుక
  rationale: אַחֲרֵיకి ఇక్కడ ఉన్న స్థానార్థాన్ని స్పష్టంగా ఉంచి, ఆచార సంబంధ పదాన్ని అనువదించకుండా లిప్యంతరీకరిస్తుంది.
- source_word: אִם אֹתָהּ תִּקַּח לְךָ קָח
  choice: నీవు దాన్ని నీ కోసం తీసుకోవాలనుకుంటే తీసుకో
  rationale: షరతుతో కూడిన అనుమతి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, לְךָలోని ‘నీ కోసం’ భావాన్ని నిలుపుతుంది.
- source_word: כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה
  choice: అది తప్ప ఇక్కడ మరొక ఖడ్గం లేదు
  rationale: మినహాయింపు భావాన్నీ, సందర్భంలోని స్థల సూచననూ స్పష్టంగా ఇస్తుంది; తెలుగులో సందిగ్ధత లేకుండా సూచిత నామవాచకమైన ‘ఖడ్గం’ను పునరుక్తం చేస్తుంది.
- source_word: אֵין כָּמוֹהָ
  choice: దానికి సాటైనది లేదు
  rationale: ఖడ్గపు ప్రత్యేకత లేదా శ్రేష్ఠతను తెలిపే హీబ్రూ నానుడికి సహజమైన తెలుగు సమానార్థకం.
- source_word: תְּנֶנָּה לִּי
  choice: దాన్ని నాకు ఇవ్వండి
  rationale: స్త్రీలింగ ప్రత్యయం ఖడ్గాన్ని సూచిస్తుంది; తెలుగులో నిర్జీవ వస్తువుకు సహజమైన ‘దాన్ని’ వాడి, యాజకునితో మాట్లాడే సందర్భానికి తగిన గౌరవ బహువచనాన్ని ఉపయోగిస్తుంది.
