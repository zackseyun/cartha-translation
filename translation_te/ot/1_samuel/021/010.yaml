translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని అనుసరించాం. ‘ఇదిగో,’ ‘ఏఫోదు,’ ‘ఖడ్గం’ వంటి పదాలు మూలపాఠపు చారిత్రక-ఆచార వాతావరణాన్ని నిలుపుతాయి; వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఉంచాం.
