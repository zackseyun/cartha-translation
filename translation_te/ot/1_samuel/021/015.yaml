id: 1SA.21.15
reference: 1 Samuel 21:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אָכִ֖ישׁ אֶל עֲבָדָ֑י/ו הִנֵּ֤ה תִרְאוּ֙ אִ֣ישׁ מִשְׁתַּגֵּ֔עַ לָ֛/מָּה תָּבִ֥יאוּ אֹת֖/וֹ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/015.yaml
  text: And Achish said to his servants[a], “Look, you see a man acting like a madman. Why do you bring him to me?”
translation:
  language: te
  text: 'అప్పుడు ఆకీషు తన సేవకులతో ఇలా అన్నాడు: “చూడండి, పిచ్చివాడిలా ప్రవర్తిస్తున్న ఒక మనిషిని మీరు చూస్తున్నారు[a]. అతన్ని నా దగ్గరికి ఎందుకు తీసుకొస్తున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పిచ్చివాడైన ఒక మనిషి.” హీబ్రూ కృదంతం నిజంగా పిచ్చి పట్టిన వ్యక్తినిగానీ, పిచ్చివాడిలా ప్రవర్తిస్తున్న వ్యక్తినిగానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్‌తో సాగే హీబ్రూ కథన ప్రవాహాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אָכִישׁ
  choice: ఆకీషు
  rationale: వ్యక్తి పేరును తెలుగులో సహజమైన ధ్వన్యంతరీకరణతో ఇచ్చాం.
- source_word: עֲבָדָיו
  choice: తన సేవకులతో
  rationale: రాజసభ సందర్భంలో రాజు సేవలో ఉన్నవారిని సూచించే నేరమైన, సాధారణ తెలుగు పదప్రయోగం.
- source_word: הִנֵּה תִרְאוּ
  choice: చూడండి, ... మీరే చూస్తున్నారు
  rationale: హిన్నే యొక్క దృష్టి ఆకర్షించే బలాన్నీ, రెండవ పురుష బహువచన క్రియనూ రెండింటినీ నిలుపుతుంది.
- source_word: אִישׁ מִשְׁתַּגֵּעַ
  choice: ఇతడు పిచ్చివాడిలా ప్రవర్తిస్తున్నాడు
  rationale: హిత్పయేల్ వర్తమాన కృదంతం నిజమైన పిచ్చినీ లేదా పిచ్చివాడిలా నటించే ప్రవర్తననీ సూచించగలదు; ప్రధాన పాఠం సందర్భానుగుణమైన ప్రవర్తనా భావాన్ని ఉంచుతుంది.
- source_word: לָמָּה תָּבִיאוּ אֹתוֹ אֵלָי
  choice: ఇతన్ని నా దగ్గరికి ఎందుకు తీసుకొస్తున్నారు?
  rationale: అసంపూర్ణ క్రియారూపాన్ని ప్రస్తుత సందర్భంలో నేరుగా, సహజంగా వ్యక్తం చేస్తూ కర్మను, గమ్యాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. సంభాషణలో బహువచన సంబోధనను స్పష్టంగా ఉంచాం; మూలంలోని సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
