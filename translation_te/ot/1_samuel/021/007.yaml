source:
  edition: WLC
  text: וַ/יִּתֶּן ל֥/וֹ הַ/כֹּהֵ֖ן קֹ֑דֶשׁ כִּי֩ לֹא הָ֨יָה שָׁ֜ם לֶ֗חֶם כִּֽי אִם לֶ֤חֶם הַ/פָּנִים֙ הַ/מּֽוּסָרִים֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה לָ/שׂוּם֙ לֶ֣חֶם חֹ֔ם בְּ/י֖וֹם הִלָּקְחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
translation:
  language: te
  text: కాబట్టి యాజకుడు అతనికి పవిత్రమైన రొట్టె ఇచ్చాడు; ఎందుకంటే యహ్వే సన్నిధి ఎదుటనుండి తొలగించబడిన సన్నిధి రొట్టెలు[a] తప్ప అక్కడ మరే రొట్టె లేదు. వాటిని తీసివేసిన రోజున అక్కడ వేడి రొట్టె ఉంచడానికి వాటిని తొలగించేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సన్నిధి రొట్టె”; సంప్రదాయంగా, “సముఖపు రొట్టెలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: పవిత్రమైన రొట్టె
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘పవిత్రమైనది’; ఈ సందర్భంలో అది ప్రతిష్ఠించబడిన రొట్టెనే సూచిస్తున్నందున సహజమైన తెలుగులో దాని సూచ్యార్థాన్ని స్పష్టంచేశాం.
- source_word: לֶחֶם הַפָּנִים
  choice: సన్నిధి రొట్టెలు
  rationale: యహ్వే ఎదుట ఉంచే ఆరాధనా సంబంధమైన రొట్టెలకు ఇది పారదర్శకమైన తెలుగు వ్యక్తీకరణ. హీబ్రూ పదబంధంలోని ‘సన్నిధి/ముఖము’ భావాన్ని నిలుపుతుంది.
- source_word: הַמּוּסָרִים
  choice: తొలగించబడినవి
  rationale: మూలంలోని నిష్క్రియార్థక బహువచన కృదంతాన్ని నిలిపి, రొట్టెల సాధారణ మార్పిడి ప్రక్రియను సూచిస్తుంది.
- source_word: מִלִּפְנֵי יְהוָה
  choice: యహ్వే సన్నిధి నుండి
  rationale: స్థలసంబంధమైన ఆరాధనా భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, దైవనామాన్ని పేరుగానే ఉంచుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: לֶחֶם חֹם
  choice: వేడి రొట్టెలు
  rationale: חֹם అనే విశేషణం ప్రత్యక్షంగా ‘వేడి’ అని అర్థం. ‘తాజా’ అనే సందర్భార్థాన్ని పాఠ్యంలోకి చేర్చకుండా మూలరూపాన్ని నిలిపాం.
- source_word: בְּיוֹם הִלָּקְחוֹ
  choice: వాటిని తీసివేసిన రోజునే
  rationale: మూలంలోని కాలసూచక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; తెలుగు వాక్యసమ్మతికి సమూహార్థక ఏకవచనాన్ని బహువచనంగా తెలిపాం.
- source_word: כִּי לֹא הָיָה שָׁם לֶחֶם כִּי אִם
  choice: అక్కడ ... తప్ప మరే రొట్టె లేదు
  rationale: యాజకుడు పవిత్ర రొట్టె ఇవ్వడానికి గల కారణాన్నీ, మినహాయింపు భావాన్నీ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు లిపిలో దగ్గరగా ప్రతిబింబించాం.
- issue: לֶחֶם הַפָּנִים అనే ఆరాధనా పదబంధం
  choice: సన్నిధి రొట్టెలు
  alternative: సముఖపు రొట్టెలు / దర్శనపు రొట్టెలు
  rationale: ఆ రొట్టెలు దేవుని సన్నిధిలో ఉంచబడతాయనే భావాన్ని తెలియజేస్తూ, ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ఆరాధనా సందర్భంలోని సాంకేతిక భావాన్ని ‘సన్నిధి రొట్టెలు’ ద్వారా నిలిపి, హీబ్రూలోని బహువచన సూచనను తెలుగులో సహజంగా వ్యక్తం చేశాం.
