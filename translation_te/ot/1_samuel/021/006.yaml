  text: וַ/יַּעַן֩ דָּוִ֨ד אֶת הַ/כֹּהֵ֜ן וַ/יֹּ֣אמֶר ל֗/וֹ כִּ֣י אִם אִשָּׁ֤ה עֲצֻֽרָה לָ֨/נוּ֙ כִּ/תְמ֣וֹל שִׁלְשֹׁ֔ם בְּ/צֵאתִ֕/י וַ/יִּהְי֥וּ כְלֵֽי הַ/נְּעָרִ֖ים קֹ֑דֶשׁ וְ/הוּא֙ דֶּ֣רֶךְ חֹ֔ל וְ/אַ֕ף כִּ֥י הַ/יּ֖וֹם יִקְדַּ֥שׁ בַּ/כֶּֽלִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
translation:
  language: te
  text: 'దావీదు యాజకునికి జవాబిచ్చి ఇలా అన్నాడు[a]: “నిజమే, నేను బయలుదేరినప్పుడు మునుపటిలాగే స్త్రీలు మాకు దూరంగా ఉంచబడ్డారు[b]; యువకుల సామగ్రి పవిత్రమైనదే. ఇది సాధారణ ప్రయాణమే అయినా, నేడు అది సామగ్రి విషయంలో మరింతగా పవిత్రపరచబడుతుంది[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దావీదు యాజకునికి జవాబిచ్చి అతనితో అన్నాడు.”
    reason: హెబ్రీ సంభాషణా సూత్రంలోని పునరుక్తిని సూచిస్తుంది.
  - marker: b
    text: లేదా, “ఒక స్త్రీ మాకు దూరంగా ఉంచబడింది,” లేదా “మేము స్త్రీలకు దూరంగా ఉన్నాం.” ఈ హెబ్రీ వ్యక్తీకరణ పవిత్రమైన వాటిని నిర్వహించడానికి సిద్ధపడే సందర్భంలోని లైంగిక సంయమనాన్ని సూచిస్తుంది. “మునుపటిలాగే” అనే మాటకు అక్షరార్థం “నిన్న, మొన్నలాగే”; కొందరు దీన్ని “దాదాపు మూడు రోజులుగా” అని అర్థం చేసుకుంటారు.
    reason: ఏకవచన సామూహిక నామవాచకం, కర్మణి నిర్మాణం, కాలసూచక నుడికారం అన్నింటిలోని అర్థసాధ్యతలను తెలియజేస్తుంది.
  - marker: d
    text: హెబ్రీ చివరి వాక్యభాగం క్లిష్టమైనది. దీనిని, “ప్రయాణం సాధారణమైనదే అయినా, నేడు అది సామగ్రి విషయంలో పవిత్రంగా ఉంటుంది,” అని లేదా దానికి సమానంగా కూడా అర్థం చేసుకోవచ్చు. “సామగ్రి” అనే పదం యువకుల పరికరాలను సూచించవచ్చు; కొందరు దానిని వారి శరీరాలు లేదా వ్యక్తుల గురించిన సౌమ్యోక్తిగా అర్థం చేసుకుంటారు.
    reason: వాక్యనిర్మాణం, చివరి పదబంధంలోని సూచన, మరియు כְלִי అనే పదం యొక్క ఉద్దేశ్యం అస్పష్టంగా ఉన్నాయి.
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  choice: స్త్రీలు మాకు దూరంగా ఉంచబడ్డారు
  rationale: ఏకవచన రూపం సామూహిక భావంలో ఉండవచ్చు. ఈ సందర్భంలో పవిత్రమైన వాటిని నిర్వహించడానికి ముందున్న లైంగిక సంయమనాన్ని సూచిస్తూ, హెబ్రీ క్రియారూపంలోని కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: మునుపటిలాగే
  rationale: అక్షరార్థంగా గత దినాలను సూచించే హెబ్రీ నుడికారమిది. ఖచ్చితంగా మూడు రోజులని బలవంతంగా నిర్ణయించకుండా, ఇంతకుముందు నుంచీ కొనసాగుతున్న పరిస్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּצֵאתִי
  choice: నేను బయలుదేరినప్పటి నుంచి
  rationale: బయలుదేరిన సమయానికి సంబంధించిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలో అప్పటి నుంచి కొనసాగుతున్న సంయమనాన్ని కూడా తెలియజేస్తుంది.
- source_word: כְלֵי הַנְּעָרִים
  choice: యువకుల పాత్రలు
  rationale: כְּלִי అనే పదానికి పాత్ర, వస్తువు, పనిముట్టు, సామగ్రి వంటి అర్థాలున్నాయి. ఇక్కడ అది సామగ్రినో, రూపకాలంకారంగా వారి శరీరాలనో సూచించవచ్చు; ‘పాత్రలు’ మూలపదానికి దగ్గరగా ఉండి అస్పష్టతను కాపాడుతుంది.
- source_word: קֹדֶשׁ
  choice: పవిత్రంగా
  rationale: నైతిక శుభ్రతకే పరిమితం చేయకుండా, పవిత్రమైన లేదా ప్రతిష్ఠితమైన స్థితిని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וְהוּא דֶּרֶךְ חֹל
  choice: ఇది సాధారణ ప్రయాణమే అయినా
  rationale: חֹל ఇక్కడ చెడ్డది అనే భావం కాకుండా పవిత్రమైనదానికి వ్యతిరేకంగా సాధారణమైనది అనే భావం ఇస్తుంది; דֶּרֶךְ సందర్భానుసారం ప్రయాణాన్ని సూచిస్తుంది.
- source_word: וְאַף כִּי
  choice: మరింతగా
  rationale: వాదనను బలపరిచే హెబ్రీ పదబంధంలోని ‘అంతకంటే ఎక్కువగా’ అనే భావాన్ని సంక్షిప్తంగా తెలుపుతుంది; అయితే మొత్తం చివరి వాక్యభాగం క్లిష్టమైనదని పాదసూచిక తెలియజేస్తుంది.
- source_word: הַיּוֹם יִקְדַּשׁ
  choice: నేడు ... పవిత్రపరచబడుతుంది
  rationale: קדשׁ క్రియలోని కర్మణి లేదా ఆత్మనేపద భావాన్ని నిలుపుతూ, దానిని కేవలం స్థితివాచక విశేషణంగా మార్చకుండా అనువదిస్తుంది.
- source_word: בַּכֶּלִי
  choice: పాత్రలో
  rationale: ముందున్న כְלֵי పదంతో పదసంబంధాన్ని నిలుపుతుంది. సామగ్రి, శరీరం లేదా మరొక వస్తువు అనే అవకాశాల్లో దేనినీ అనవసరంగా ఖరారు చేయదు.
theological_decisions:
- issue: పవిత్ర రొట్టెల సందర్భంలో లైంగిక సంయమనం మరియు ఆచారపరమైన పవిత్రత
  choice: ఈ వాక్యాన్ని నైతిక అపరాధరాహిత్యంగా కాకుండా ఆచారపరమైన పవిత్రత/ప్రతిష్ఠ భాషలో అనువదించడం
  alternative: దీనిని ప్రధానంగా నైతిక పవిత్రతగా లేదా కేవలం శారీరక శుభ్రతగా అర్థం చేయడం
  rationale: సందర్భం ప్రతిష్ఠిత రొట్టెలను స్వీకరించే అర్హతకు సంబంధించినది. హెబ్రీ పాఠం పవిత్రమైనది–సాధారణమైనది అనే వ్యత్యాసంతో పాటు లైంగిక సంయమనాన్ని సూచిస్తుంది; తరువాతి కాలపు సిద్ధాంత వర్గాలను పాఠంలోకి చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘యాజకుడు’, ‘పవిత్రం’, ‘సాధారణం’, ‘పాత్ర’ వంటి పదాలు మూలంలోని ఆచారపరమైన వ్యత్యాసాన్ని నిలుపుతాయి. హెబ్రీ చివరి భాగంలోని నిజమైన అస్పష్టతను ప్రధాన పాఠంలో అతిగా పరిష్కరించకుండా, పాదసూచికలో ప్రత్యామ్నాయాన్ని ఇచ్చాం.
