source:
  edition: WLC
  text: וַ/יַּ֨עַן הַ/כֹּהֵ֤ן אֶת דָּוִד֙ וַ/יֹּ֔אמֶר אֵֽין לֶ֥חֶם חֹ֖ל אֶל תַּ֣חַת יָדִ֑/י כִּֽי אִם לֶ֤חֶם קֹ֨דֶשׁ֙ יֵ֔שׁ אִם נִשְׁמְר֥וּ הַ/נְּעָרִ֖ים אַ֥ךְ מֵ/אִשָּֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
translation:
  language: te
  text: 'యాజకుడు దావీదుకు ఇలా జవాబిచ్చాడు: “నా దగ్గర సాధారణ రొట్టె లేదు; కానీ ప్రతిష్ఠిత రొట్టె ఉంది—యువకులు కనీసం స్త్రీలకు దూరంగా ఉండి ఉంటే[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒక స్త్రీకి దూరంగా”; సందర్భంలో ఇది కర్మకాండ శుద్ధి నిమిత్తం లైంగిక సంబంధాలకు దూరంగా ఉండడాన్ని సూచిస్తుంది.
    reason: మూలంలోని ఏకవచన రూపాన్నీ, సందర్భానుసారమైన భావాన్నీ తెలియజేయడానికి.
lexical_decisions:
- source_word: לֶחֶם חֹל
  choice: సాధారణ రొట్టె
  rationale: חֹל ఇక్కడ קֹדֶשׁ‌కు విరుద్ధంగా, ప్రతిష్ఠించబడని సాధారణ రొట్టెను సూచిస్తుంది; నైతికంగా అపవిత్రమైనదనే భావాన్ని ఇవ్వదు.
- source_word: אֶל תַּחַת יָדִי
  choice: నా దగ్గర
  rationale: అక్షరార్థంగా ‘నా చేతి కింద’ అనే హీబ్రూ నుడికారం ఇక్కడ అందుబాటులో లేదా స్వాధీనంలో ఉండటాన్ని సూచిస్తుంది.
- source_word: לֶחֶם קֹדֶשׁ
  choice: ప్రతిష్ఠితమైన రొట్టె
  rationale: కర్మకాండ సంబంధంగా దేవునికోసం ప్రత్యేకపరచబడిన రొట్టె అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַנְּעָרִים
  choice: యువకులు
  rationale: ఈ పదం యువకులు లేదా పరిచారకులు అని అర్థమివ్వగలదు; సందర్భాన్ని అతిగా నిర్దిష్టం చేయకుండా ప్రాథమిక భావాన్ని నిలుపుతుంది.
- source_word: אִם נִשְׁמְרוּ ... אַךְ מֵאִשָּׁה
  choice: యువకులు స్త్రీలకు దూరంగా ఉండి ఉంటే
  rationale: తమను తాము కాపాడుకోవడం లేదా విరమించుకోవడం అనే భావాన్ని నిలుపుతూ, లైంగిక సంబంధాల నుండి విరమించడాన్ని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
- source_word: כִּי אִם
  choice: మాత్రం
  rationale: సాధారణ రొట్టె లేదనే మాటకు విరుద్ధంగా ప్రతిష్ఠితమైన రొట్టె అందుబాటులో ఉందనే మినహాయింపు/వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రతిష్ఠితమైన రొట్టెను పొందడానికి కర్మకాండ సంబంధమైన పరిశుద్ధత నిబంధన
  choice: యువకులు స్త్రీలకు దూరంగా ఉండి ఉంటే రొట్టె తీసుకోవచ్చని షరతుగా అనువదించడం
  alternative: కర్మకాండ శుద్ధి కోసం లైంగిక సంబంధాలకు దూరంగా ఉండి ఉంటే అని ప్రధాన వాక్యంలోనే పూర్తిగా స్పష్టం చేయడం
  rationale: మూలంలోని సంక్షిప్తతను, కర్మకాండ సంబంధమైన భావాన్ని నిలుపుతుంది; స్త్రీలు లేదా లైంగికత గురించి విస్తృతమైన సిద్ధాంతార్థాన్ని చేర్చకుండా అవసరమైన వివరణను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పవిత్ర రొట్టె’ కంటే ‘ప్రతిష్ఠితమైన రొట్టె’ కర్మకాండ సంబంధంగా ప్రత్యేకపరచబడినదనే భావాన్ని స్పష్టంగా ఇస్తుంది. మూలంలో ప్రత్యక్షంగా లేని ‘దాన్ని తీసుకోవచ్చు’ భావం షరతు యొక్క సహజ తెలుగు వాక్యనిర్మాణం కోసం స్వల్పంగా పూరించబడింది.
