  text: וַ/יָּ֧שֶׂם דָּוִ֛ד אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בִּ/לְבָב֑/וֹ וַ/יִּרָ֣א מְאֹ֔ד מִ/פְּנֵ֖י אָכִ֥ישׁ מֶֽלֶךְ גַּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/013.yaml
  text: David took these words to heart[a], and he was very much afraid of Achish king of Gath.
translation:
  language: te
  text: దావీదు ఈ మాటలను మనసుకు తీసుకొని[a], గాతు రాజైన ఆకీషుకు ఎంతో భయపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఈ మాటలను తన హృదయంలో ఉంచుకున్నాడు.” అంటే, అతడు వాటిని తీవ్రంగా పరిగణించి తనలో తాను ఆలోచించాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... בִּלְבָבוֹ
  choice: మనసుకు తీసుకొని
  rationale: ‘తన హృదయంలో ఉంచుకున్నాడు’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ఈ మాటలను దావీదు తీవ్రంగా పరిగణించి, అంతరంగంలో ఆలోచించాడనే భావాన్ని నిలుపుతుంది.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలను
  rationale: דְּבָרִים అనే పదానికి ‘మాటలు,’ ‘విషయాలు’ అనే అర్థాలు ఉండగలవు. ముందరి వచనంలో సేవకులు పలికిన మాటలే ఇక్కడ ఉద్దేశం కాబట్టి ‘ఈ మాటలను’ అని అనువదించబడింది.
- source_word: וַיִּרָא מְאֹד
  choice: ఎంతో భయపడ్డాడు
  rationale: מְאֹד భయపు తీవ్రతను సూచిస్తుంది; ‘ఎంతో భయపడ్డాడు’ సహజమైన తెలుగులో ఆ బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִפְּנֵי
  choice: ఆకీషుకు
  rationale: భయాన్ని తెలిపే ఈ నిర్మాణంలో మִפְּנֵי అక్షరార్థంగా ‘ముఖం ఎదుటనుండి’ అన్న భావం కలిగినప్పటికీ, తెలుగులో భయానికి కారణమైన వ్యక్తిని ‘-కు’ విభక్తితో సహజంగా సూచించవచ్చు.
- source_word: אָכִישׁ
  choice: ఆకీషు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని పద్ధతికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: מֶלֶךְ גַּת
  choice: గాతు రాజైన
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణబంధంగా వ్యక్తం చేస్తూ, ఆకీషు గాతుకు రాజని స్పష్టం చేస్తుంది.
