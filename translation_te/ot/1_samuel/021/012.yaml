source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ עַבְדֵ֤י אָכִישׁ֙ אֵלָ֔י/ו הֲ/לוֹא זֶ֥ה דָוִ֖ד מֶ֣לֶךְ הָ/אָ֑רֶץ הֲ/ל֣וֹא לָ/זֶ֗ה יַעֲנ֤וּ בַ/מְּחֹלוֹת֙ לֵ/אמֹ֔ר הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד ב/רבבת/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: te
  text: 'ఆకీషు సేవకులు అతనితో ఇలా అన్నారు: “ఇతడు ఈ దేశపు రాజు దావీదు కాదా? నాట్యాల్లో వారు, ‘సౌలు తన వేలమందిని హతమార్చాడు, దావీదు తన పదివేల మందిని[b]’ అని పాడినవాడు[a] ఇతడే కాదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాట్యాల్లో ఒకరికొకరు ప్రతిస్పందిస్తూ పాడినవాడు”; అంటే, నాట్యం చేస్తున్నప్పుడు వారు ప్రతిస్పందనాత్మకంగా పాడారు.
    reason: lexical_alternative
  - marker: b
    text: “పదివేల మంది”ని “మిరియాదులు” లేదా “పదుల వేల మంది” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: సేవకులు
  rationale: ఈ పదం ఆకీషు రాజగృహానికి లేదా ఆస్థానానికి చెందినవారిని సూచించగలదు. సందర్భం వారి అధికారిక పాత్రను సూచించినా, మూలపదాన్ని అనవసరంగా సంకుచితం చేయకుండా ‘సేవకులు’ అని నేరుగా అనువదించాం.
- source_word: הֲלוֹא
  choice: కాదా?
  rationale: అంగీకార సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో ప్రశ్నారూపంగానే నిలిపింది.
- source_word: מֶלֶךְ הָאָרֶץ
  choice: ఈ దేశపు రాజు
  rationale: దావీదు అప్పటికే అధికారికంగా రాజని నిర్ణయించకుండా, ఫిలిష్తీయ సేవకులు పలికిన అతిశయోక్తి లేదా వారి అవగాహనగా ఉండగల మూలభాషా ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- source_word: לָזֶה
  choice: ఇతని గురించే
  rationale: తరువాత వచ్చే గీతానికి దావీదే విషయమని సూచించే సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יַעֲנוּ
  choice: పాడింది
  rationale: నాట్య సందర్భంలో ఈ క్రియ ప్రతిస్పందనాత్మకంగా పాడడం లేదా గానం చేయడాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ‘పాడింది’ వాడి, ప్రతిస్పందన భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בַמְּחֹלוֹת
  choice: నాట్యాల్లో
  rationale: నృత్యంతో కూడిన విజయోత్సవ గాన సందర్భాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: ఈ విజయగీత సందర్భంలో యుద్ధంలో కొట్టి చంపడమే భావం. ‘హతమార్చాడు’ గంభీరంగానూ స్పష్టంగానూ ఉంది.
- source_word: באלפו
  choice: తన వేలమందిని
  rationale: సౌలుకు ఆపాదించిన యుద్ధ విజయాల సంఖ్యను తెలుగులో సహజంగా తెలియజేస్తూ, తదుపరి సంఖ్యతో సమాంతరతను కాపాడుతుంది.
- source_word: ברבבתו
  choice: తన పదివేల మందిని
  rationale: רבבה యొక్క ప్రాథమిక సంఖ్యార్థాన్ని నిలిపి, ‘వేలమంది—పదివేల మంది’ అనే గీతపు సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దావీదును ‘దేశపు రాజు’ అని పిలవడం అధికారిక బిరుదా, ఫిలిష్తీయ సేవకుల అభిప్రాయమా?
  choice: ఈ దేశపు రాజైన దావీదు
  alternative: ఈ దేశంలో ప్రముఖుడైన దావీదు
  rationale: మూలపాఠ్యం సేవకుల మాటలను మాత్రమే నివేదిస్తుంది; అది అధికారిక రాజబిరుదా, అతిశయోక్తియా అని తేల్చదు. అందువల్ల వ్యాఖ్యానంతో ఉద్రిక్తతను తొలగించకుండా బిరుదును యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. విజయగీతంలోని సంఖ్యా సమాంతరతను, రెండో భాగంలోని క్రియా-లోపాన్ని తెలుగులోనూ నిలిపాం. పాదసూచిక గుర్తులను వాటికి సంబంధించిన ‘పాడింది’ మరియు ‘పదివేల మంది’ పదాల వద్ద ఉంచాం.
