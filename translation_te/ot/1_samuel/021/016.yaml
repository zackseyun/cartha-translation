source:
  edition: WLC
  text: חֲסַ֤ר מְשֻׁגָּעִים֙ אָ֔נִי כִּי הֲבֵאתֶ֣ם אֶת זֶ֔ה לְ/הִשְׁתַּגֵּ֖עַ עָלָ֑/י הֲ/זֶ֖ה יָב֥וֹא אֶל בֵּיתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/016.yaml
  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
translation:
  language: te
  text: “నాకు పిచ్చివాళ్ల కొదువా? నా ఎదుట పిచ్చివాడిలా ప్రవర్తించడానికి వీణ్ణి తీసుకొచ్చారేమిటి?[a] వీడు నా ఇంట్లోకి రావాలా?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా సమక్షంలో పిచ్చిగా ప్రవర్తించడానికి.” హీబ్రూ క్రియారూపం సాధారణంగా పిచ్చిగా ప్రవర్తించడాన్ని సూచించవచ్చు; సందర్భం మాత్రం ఉద్దేశపూర్వకంగా నటించిన పిచ్చితనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲסַר מְשֻׁגָּעִים
  choice: నా దగ్గర పిచ్చివాళ్లు తక్కువగా ఉన్నారా?
  rationale: హీబ్రూ విధేయ విశేషణ ప్రయోగాన్ని సహజమైన తెలుగు అలంకారప్రశ్నగా అందించి, ఆకీషు వ్యంగ్యాన్ని నిలుపుతుంది.
- source_word: הֲבֵאתֶם אֶת זֶה
  choice: వీణ్ణి నా దగ్గరికి తీసుకొచ్చారేమిటి?
  rationale: אֶת זֶה లోని నిరాదరణతో కూడిన సూచనను ‘వీణ్ణి’ సహజంగా వ్యక్తం చేస్తుంది; ప్రశ్నార్థక నిర్మాణం ఫిర్యాదు ధోరణిని కాపాడుతుంది.
- source_word: לְהִשְׁתַּגֵּעַ
  choice: పిచ్చివాడిలా ప్రవర్తించడానికి
  rationale: హిత్పయేల్ రూపం ఇక్కడ పిచ్చిగా ప్రవర్తించడాన్ని సూచిస్తుంది; సందర్భంలో దావీదు నటిస్తున్నప్పటికీ, మూలపదం స్వయంగా ఉద్దేశపూర్వక నటనను స్పష్టంగా చెప్పదు.
- source_word: עָלָי
  choice: నా ఎదుట
  rationale: అక్షరార్థమైన ‘నా మీద’ కంటే రాజు సమక్షంలో అతని వైపు ఉద్దేశించిన ప్రవర్తనను ‘నా ఎదుట’ సహజంగా తెలియజేస్తుంది.
- source_word: הֲזֶה יָבֹא אֶל־בֵּיתִי
  choice: వీడు నా ఇంట్లోకి రావాలా?
  rationale: పునరుక్త సూచనలోని తిరస్కారాన్ని ‘వీడు’ నిలుపుతుంది; ‘ఇంట్లోకి’ ప్రవేశ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడుతూ, ఆకీషు మాటల్లోని వ్యంగ్యం మరియు నిరాదరణను ‘వీణ్ణి/వీడు’ ద్వారా నిలిపాం. మానసిక ఆరోగ్యానికి సంబంధించిన ఆధునిక వైద్యపదజాలాన్ని దిగుమతి చేయకుండా, ప్రాచీన సందర్భంలోని అవమానకర వాడుకను ‘పిచ్చివాళ్లు’గా నేరుగా అనువదించాం.
