revisions:
- from: 'అప్పుడు సమూయేలు ఇశ్రాయేలు ఇంటివారందరితో ఇలా అన్నాడు: “మీరు మీ హృదయమంతటితో యాహ్వే వైపు తిరిగి వస్తున్నట్లయితే[a], మీ మధ్యనుండి అన్య దేవుళ్లను, అష్టారోతులను[b] తొలగించండి. మీ హృదయాన్ని యాహ్వే వైపు స్థిరపరచుకొని[c], ఆయనను మాత్రమే సేవించండి. అప్పుడు ఆయన మిమ్మల్ని ఫిలిష్తీయుల చేతిలోనుండి[d] విడిపిస్తాడు.”


    [a] లేదా “యాహ్వే వైపు తిరుగుతున్నట్లయితే.” ఇక్కడి హీబ్రూ క్రియకు “తిరిగి రావడం,” “తిరగడం” అనే భావాలు ఉన్నాయి.

    [b] “అష్టారోతులు” అనే హీబ్రూ బహువచనం అష్టారెతు/అస్టార్టే అనే దేవతకు సంబంధించిన రూపాలు, విగ్రహాలు లేదా ఆరాధనా రూపాలను సూచించే అవకాశం ఉంది.

