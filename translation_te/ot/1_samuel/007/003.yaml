source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
translation:
  language: te
  text: 'అప్పుడు సమూయేలు ఇశ్రాయేలు ఇంటివారందరితో ఇలా అన్నాడు: “మీరు మీ హృదయమంతటితో యాహ్వే వైపు తిరిగి వస్తున్నట్లయితే[a], మీ మధ్యనుండి అన్య దేవుళ్లను, అష్టారోతులను[b] తొలగించండి. మీ హృదయాన్ని యాహ్వే వైపు స్థిరపరచండి[c]; ఆయనను మాత్రమే సేవించండి. అప్పుడు ఆయన మిమ్మల్ని ఫిలిష్తీయుల చేతిలోనుండి[d] విడిపిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ హృదయమంతటితో యాహ్వే వైపు తిరుగుతున్నట్లయితే.” ఇక్కడి హీబ్రూ క్రియకు “తిరిగి రావడం,” “తిరగడం” అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: “అష్టారోతులు” అనే హీబ్రూ బహువచనం అష్టారెతు/అస్టార్టే అనే దేవతకు సంబంధించిన రూపాలు, విగ్రహాలు లేదా ఆరాధనా రూపాలను సూచించే అవకాశం ఉంది.
    reason: cultural_note
  - marker: c
    text: లేదా “మీ హృదయాన్ని యాహ్వే వైపు సిద్ధపరచండి.”
    reason: lexical_alternative
  - marker: d
    text: “ఫిలిష్తీయుల చేతిలోనుండి” అనేది వారి అధికారం లేదా అణచివేతనుండి విడిపించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: idiom_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు సమూయేలు ... ఇలా అన్నాడు
  rationale: వావ్-కాన్సెక్యూటివ్ కథనాన్ని ముందుకు తీసుకెళ్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని చూపుతుంది.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారందరితో
  rationale: ‘ఇశ్రాయేలు ఇల్లు’ అనే సమష్టి-కుటుంబ భావాన్ని పూర్తిగా ‘ఇశ్రాయేలీయులందరు’గా సరళీకరించకుండా సహజ తెలుగులో నిలుపుతుంది.
- source_word: אִם בְּכָל לְבַבְכֶם אַתֶּם שָׁבִים אֶל יְהוָה
  choice: మీరు మీ హృదయమంతటితో యాహ్వే వైపు తిరిగి వస్తున్నట్లయితే
  rationale: శׁוב్ క్రియలోని ‘తిరిగి రావడం/తిరగడం’ భావాన్ని, కృదంత రూపంలోని కొనసాగుతున్న చర్యను, సంపూర్ణ హృదయ నిబద్ధతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: הָסִירוּ
  choice: తొలగించండి
  rationale: విగ్రహారాధనకు సంబంధించిన వస్తువులు, ఆచారాలను తమ మధ్యనుండి తీసివేయాలనే ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: అన్య దేవుళ్లు
  rationale: ఇది కేవలం విచిత్రమైన దేవుళ్లను కాక, ఇశ్రాయేలుకు అన్యమైన దేవతలను సూచిస్తుంది; ‘అన్య దేవుళ్లు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: וְהָעַשְׁתָּרֹת
  choice: అష్టారోతులు
  rationale: హీబ్రూ బహువచనాన్ని వ్యాఖ్యానాత్మకంగా ‘విగ్రహాలు’ అని మార్చకుండా లిప్యంతరీకరించి, సాంస్కృతిక వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  choice: మీ హృదయాన్ని యాహ్వే వైపు స్థిరపరచుకొని
  rationale: కూన్ క్రియలోని సిద్ధపరచడం, స్థిరపరచడం, ఒక దిశగా నిలపడం అనే అర్థ పరిధిని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  choice: ఆయనను మాత్రమే సేవించండి
  rationale: ఆరాధనకే పరిమితం కాకుండా విధేయత, సేవ, ప్రత్యేక నిబద్ధతను కలిగిన עבד యొక్క విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וְיַצֵּל אֶתְכֶם
  choice: అప్పుడు ఆయన మిమ్మల్ని ... విడిపిస్తాడు
  rationale: ఆజ్ఞలకు అనుసరించే ఆశించిన ఫలితాన్ని సహజ తెలుగులో తెలియజేస్తుంది; హిఫిల్ రూపంలోని రక్షించడం/విడిపించడం భావాన్ని నిలుపుతుంది.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల చేతిలోనుండి
  rationale: మూలంలోని స్పష్టమైన ‘చేతిలోనుండి’ నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని అధికార భావాన్ని పాదసూచికలో వివరిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה ను ఎలా అందించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించడం మూలానికి పారదర్శకంగా ఉంటుంది.
- issue: שָׁבִים లో ఇశ్రాయేలు స్పందన స్వభావం
  choice: యాహ్వే వైపు తిరిగి వస్తున్నారు
  alternative: యాహ్వే వైపు తిరుగుతున్నారు
  rationale: ఇది ఒడంబడిక నిబద్ధతకు తిరిగి రావడాన్ని సూచిస్తుంది; తరువాతి కాలపు ప్రత్యేక సిద్ధాంత పదజాలాన్ని చేర్చకుండా హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- issue: ఈ సందర్భంలో עבד అర్థం
  choice: ఆయనను మాత్రమే సేవించండి
  alternative: ఆయనను మాత్రమే ఆరాధించండి
  rationale: ఆజ్ఞలో ఆరాధనతో పాటు విధేయత, ప్రత్యేక నిబద్ధత కూడా ఉన్నాయి. ‘సేవించండి’ హీబ్రూ పదం యొక్క విస్తృత పరిధిని కాపాడుతుంది.
- issue: ఆజ్ఞలు మరియు విడిపింపు మధ్య సంబంధం
  choice: అప్పుడు ఆయన ... విడిపిస్తాడు
  alternative: ఆయన మిమ్మల్ని విడిపించేలా
  rationale: హీబ్రూ వావ్ రూపం ఆజ్ఞల తరువాత వచ్చే ఫలితం లేదా వాగ్దానాన్ని సూచించగలదు. తెలుగు ‘అప్పుడు’ దానిని సహజంగా చూపుతుంది, కానీ యాంత్రిక కారణ-ఫలిత సిద్ధాంతాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘ఇశ్రాయేలు ఇంటివారు,’ ‘హృదయమంతటితో,’ ‘చేతిలోనుండి’ వంటి మూలభాషా రూపకాలు తెలుగులో అర్థవంతంగా ఉన్నంతవరకు నిలుపబడ్డాయి; అస్పష్టత లేదా సాంస్కృతిక నేపథ్యం అవసరమైన చోట పాదసూచికలు ఇచ్చబడ్డాయి.
