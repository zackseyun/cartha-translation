  text: וַ/יֵּ֨צְא֜וּ אַנְשֵׁ֤י יִשְׂרָאֵל֙ מִן הַ/מִּצְפָּ֔ה וַֽ/יִּרְדְּפ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יַּכּ֕וּ/ם עַד מִ/תַּ֖חַת לְ/בֵ֥ית כָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/011.yaml
  text: Then the men of Israel went out from Mizpah[a], pursued the Philistines[b], and struck them down as far as below Beth-car.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు పురుషులు మిస్పా నుండి బయలుదేరి, ఫిలిష్తీయులను తరిమి, బేత్-కారు దిగువ[b] వరకు వారిని కొట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని ఓడించారు.” హీబ్రూ క్రియ యుద్ధంలో కొట్టడాన్ని లేదా ఓడించడాన్ని సూచించవచ్చు; ప్రతి ఒక్కరినీ చంపారనే అర్థం తప్పనిసరి కాదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “బేత్-కారు దిగువ”; బహుశా బేత్-కారు కంటే తక్కువ ఎత్తులో ఉన్న స్థలాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: బయలుదేరి
  rationale: יצא అనే సాధారణ కథన క్రియ ఇక్కడ ఒక స్థలం నుండి బయలుదేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు పురుషులు’; యుద్ధానికి వెళ్లిన పురుషులనే సూచించే లింగ నిర్దిష్టతను నిలిపింది.
- source_word: מִן הַמִּצְפָּה
  choice: మిస్పా నుండి
  rationale: మిస్పా ఒక స్థలనామం; దాని పదార్థాన్ని అనువదించకుండా ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను వాడింది.
- source_word: וַיִּרְדְּפוּ
  choice: తరుముతూ
  rationale: רדף సైనిక సందర్భంలో వెంబడించడం లేదా తరుమడం; తెలుగు వాక్యప్రవాహంలో ‘తరుముతూ’ సహజంగా ఉంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులను
  rationale: ఈ ప్రజాసమూహానికి తెలుగులో సాధారణంగా వాడే పేరు.
- source_word: וַיַּכּוּם
  choice: వారిని హతమార్చారు
  rationale: נכה యుద్ధ సందర్భంలో కొట్టడం, సంహరించడం లేదా ఓడించడం అనే విస్తృత భావం కలిగి ఉంటుంది; ‘హతమార్చారు’ సందర్భంలోని బలాన్ని తెలియజేస్తుంది, అయితే ప్రత్యామ్నాయమైన ‘ఓడించారు’ను పాదటిప్పణిలో ఉంచింది.
- source_word: עַד
  choice: వరకు
  rationale: స్థల సూచనతో కలిసి వెంబడింపు చేరిన హద్దును తెలియజేస్తుంది.
- source_word: מִתַּחַת
  choice: దిగువ
  rationale: బేత్-కారుతో పోలిస్తే తక్కువ ఎత్తులో ఉన్న ప్రదేశాన్ని సూచించే భౌగోళిక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְבֵית כָּר
  choice: బేత్-కారు
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా లిప్యంతరీకరించింది.
