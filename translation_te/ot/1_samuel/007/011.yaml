translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగు ప్రవాహం కోసం క్రియలను అనుసంధానించింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణికి సరిపోతుంది.
