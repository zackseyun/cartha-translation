id: 1SA.7.4
reference: 1 Samuel 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּרֹ֑ת וַ/יַּעַבְד֥וּ אֶת יְהוָ֖ה לְ/בַדּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/004.yaml
  text: So the sons of Israel removed the Baals and the Ashtaroths[a], and they served Yahweh alone.
translation:
  language: te
  text: కాబట్టి ఇశ్రాయేలు ప్రజలు బయలులను, అష్తారోతులను తొలగించారు; యాహ్వేను మాత్రమే సేవించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేను మాత్రమే ఆరాధించారు.” దేవుని గురించి వాడినప్పుడు ఈ హెబ్రీ క్రియ సేవించడాన్ని, ఆరాధించడాన్ని రెండింటినీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: తొలగించి
  rationale: హిఫిల్ రూపంలోని సוּר ఇక్కడ విగ్రహాలను తమ మధ్యనుండి తీసివేయడం లేదా వదిలించుకోవడం అనే క్రియాత్మక భావాన్ని ఇస్తుంది; ‘తొలగించి’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఇది మొత్తం ఒడంబడిక సమాజాన్ని సూచించే స్థిర జాతీయ పదబంధం కాబట్టి, సహజమైన మరియు సమగ్ర ఆధునిక తెలుగు రూపంగా ‘ఇశ్రాయేలు ప్రజలు’ ఎంచుకున్నాం.
- source_word: הַבְּעָלִים
  choice: బయలులను
  rationale: హెబ్రీ పాఠంలోని బహువచనాన్ని నిలుపుతూ, స్థానిక బయలు రూపాలా లేక వాటి విగ్రహాలా అన్న విషయాన్ని అనవసరంగా నిర్ణయించకుండా దేవతా నామాన్ని లిప్యంతరీకరించాం.
- source_word: הָעַשְׁתָּרֹת
  choice: అష్తారోతులను
  rationale: నిర్దిష్ట అన్యదేవతారాధనా సూచనను కాపాడేందుకు హెబ్రీ బహువచన నామాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: וַיַּעַבְדוּ
  choice: సేవించారు
  rationale: עבד దేవుణ్ణి కర్మగా తీసుకున్నప్పుడు సేవించడం, ఆరాధించడం రెండింటినీ సూచించగలదు. ‘సేవించారు’ మూల క్రియ యొక్క విస్తృతమైన విధేయత, నిబద్ధత భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలిపాం.
- source_word: לְבַדּוֹ
  choice: మాత్రమే
  rationale: ఇక్కడ భావం ఒంటరితనం కాదు, భక్తి మరియు సేవలో ప్రత్యేకత; ‘మాత్రమే’ ఆ ఏకైక నిబద్ధతను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה ను ఎలా ఇవ్వాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగు పాఠకులకు స్థిరంగా పరిచయమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఉపయోగించడం ద్వారా ‘ప్రభువు’ అనే బిరుదుతో దానిని భర్తీ చేయలేదు.
- issue: עבד ను ‘సేవించారు’గా లేక ‘ఆరాధించారు’గా అనువదించడం
  choice: సేవించారు
  alternative: ఆరాధించారు
  rationale: ఈ సందర్భంలో విగ్రహాలను విడిచిపెట్టి యెహోవాకు మాత్రమే అంకితమవడం ఉన్నందున ఆరాధన భావం స్పష్టంగా అంతర్భాగమే; అయినప్పటికీ ‘సేవించారు’ అనే రూపం క్రియలోని విస్తృత ఒడంబడిక విధేయతను నిలుపుతుంది. ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. దేవతా నామాల బహువచనం మరియు עבד లోని సేవ/ఆరాధన అస్పష్టత కాపాడబడ్డాయి.
