  source_fidelity: 'మూల హీబ్రూ క్రమం, క్రియలు, స్థలసూచనలు నమ్మకంగా ప్రతిఫలించాయి: మిస్పాకు సమకూడడం, నీళ్లు తోడడం మరియు యాహ్వే సన్నిధిలో కుమ్మరించడం, ఆ రోజు ఉపవాసం, పాపఒప్పుకోలు, మిస్పాలో సమూయేలు ఇశ్రాయేలు ప్రజలకు న్యాయం తీర్చడం అన్నీ ఉన్నాయి. మొదటి ‘మిస్పాకు’లోని దిశార్థక హేను కూడా సరిగ్గా నిలిపారు. నీళ్లు కుమ్మరించిన చర్యకు ప్రధాన పాఠ్యంలో వ్యాఖ్యానాన్ని జోడించలేదు.'
