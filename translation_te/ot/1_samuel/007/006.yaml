  text: וַ/יִּקָּבְצ֣וּ הַ֠/מִּצְפָּתָ/ה וַ/יִּֽשְׁאֲבוּ מַ֜יִם וַֽ/יִּשְׁפְּכ֣וּ לִ/פְנֵ֣י יְהוָ֗ה וַ/יָּצ֨וּמוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא וַ/יֹּ֣אמְרוּ שָׁ֔ם חָטָ֖אנוּ לַ/יהוָ֑ה וַ/יִּשְׁפֹּ֧ט שְׁמוּאֵ֛ל אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/מִּצְפָּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
translation:
  language: te
  text: వారు మిస్పాకు కూడివచ్చి, నీళ్లు తోడి, యాహ్వే సన్నిధిలో వాటిని కుమ్మరించారు.[a] ఆ రోజున వారు ఉపవాసముండి, “మేము యాహ్వేకు విరోధంగా పాపం చేశాం” అని అక్కడ అన్నారు. సమూయేలు మిస్పాలో ఇశ్రాయేలు ప్రజలకు న్యాయం తీర్చాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యాహ్వే సన్నిధిలో నీళ్లు కుమ్మరించడం పశ్చాత్తాపం లేదా విలాపానికి సంబంధించిన ఆచారంగా ఉండవచ్చు; అయితే దాని సంకేతార్థాన్ని ఈ వచనం స్పష్టంగా వివరించదు.
    reason: cultural_note
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులకు.” ఇక్కడ అది ఇశ్రాయేలు ప్రజలందరినీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ הַמִּצְפָּתָה
  choice: వారు మిస్పాకు కూడివచ్చి
  rationale: నిఫాల్ క్రియ ప్రజలు సమకూడడాన్ని సూచిస్తుంది; స్థలనామానికి ఉన్న దిశార్థక ప్రత్యయం ‘మిస్పాకు’ అనే గమ్యార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: నీళ్లు తోడి
  rationale: שׁאב అనేది బావి లేదా నీటి వనరు నుంచి నీళ్లు తోడడాన్ని నేరుగా సూచిస్తుంది; ఇది సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో వాటిని కుమ్మరించారు
  rationale: చర్యను ఉన్నదున్నట్లుగా ఉంచుతూ, לִפְנֵי అనే పదబంధాన్ని సహజంగా ‘సన్నిధిలో’ అని అనువదించింది; ‘వాటిని’ అనేది ముందున్న నీళ్లను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: וַיָּצוּמוּ בַּיּוֹם הַהוּא
  choice: ఆ రోజున వారు ఉపవాసముండి
  rationale: మూలంలోని ఉపవాస చర్యను సరళంగా, సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలిపింది.
- source_word: חָטָאנוּ לַיהוָה
  choice: మేము యాహ్వేకు విరోధంగా పాపం చేశాం
  rationale: חטא తో కూడిన לְ ఇక్కడ ఎవరికైనా విరోధంగా పాపం చేయడాన్ని తెలియజేస్తుంది; ఒప్పుకోలులోని పూర్తి చేసిన దోషభావాన్ని తెలుగు భూతకాలం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׁפֹּט
  choice: న్యాయం తీర్చాడు
  rationale: שׁפט న్యాయనిర్ణయం చేయడం, నాయకత్వం వహించడం అనే విస్తృత భావాలను కలిగి ఉండగలదు; ‘న్యాయం తీర్చాడు’ న్యాయపరమైన ప్రధాన భావాన్ని కాపాడుతూ సందర్భాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలకు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: నీళ్లు కుమ్మరించిన ఆచారం యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో చర్యను మాత్రమే యథాతథంగా తెలపడం
  alternative: దానిని పశ్చాత్తాపం, విలాపం, పానార్పణ లేదా తమను తాము ధారపోయడంగా స్పష్టీకరించడం
  rationale: ఈ ఆచారానికి గల సంకేతార్థాన్ని వచనం స్వయంగా వివరించదు. అందువల్ల ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చకుండా, సాధ్యమైన నేపథ్యాన్ని పాదసూచికలో మాత్రమే పేర్కొంది.
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు లేదా యెహోవా
  rationale: హీబ్రూ వ్యక్తినామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం ద్వారా మూలంలోని వ్యక్తిగత దైవనామాన్ని నిలిపింది.
- issue: సమూయేలు చేసిన שׁפט కార్యం
  choice: న్యాయం తీర్చాడు
  alternative: పరిపాలించాడు లేదా న్యాయాధిపతిగా వ్యవహరించాడు
  rationale: మూలక్రియ న్యాయనిర్ణయం మరియు నాయకత్వం రెండింటినీ సూచించగలదు. అనువాదం దాని ప్రాథమిక న్యాయార్థాన్ని ఉంచి, దానిని కేవలం రాజకీయ పరిపాలనగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘మిస్పాకు’ ద్వారా హీబ్రూ దిశార్థక రూపాన్ని నేరుగా నిలిపింది. ఆచార సంకేతార్థాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు; ‘న్యాయం తీర్చాడు’ అనే ప్రయోగం שׁפט పదంలోని న్యాయపరమైన భావాన్ని కాపాడుతుంది.
