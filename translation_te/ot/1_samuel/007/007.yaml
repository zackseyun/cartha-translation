id: 1SA.7.7
reference: 1 Samuel 7:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּֽי הִתְקַבְּצ֤וּ בְנֵֽי יִשְׂרָאֵל֙ הַ/מִּצְפָּ֔תָ/ה וַ/יַּעֲל֥וּ סַרְנֵֽי פְלִשְׁתִּ֖ים אֶל יִשְׂרָאֵ֑ל וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּֽרְא֖וּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
translation:
  language: te
  text: ఫిలిష్తీయులు ఇశ్రాయేలు ప్రజలు మిస్పాలో[a] సమావేశమయ్యారని విన్నప్పుడు, ఫిలిష్తీయుల పాలకులు[b] ఇశ్రాయేలుపైకి దండెత్తారు. ఇశ్రాయేలు ప్రజలు అది విని, ఫిలిష్తీయులకు భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిస్పాకు.’ హీబ్రూ రూపంలో దిశను సూచించే ప్రత్యయం ఉంది; అయితే ప్రజలు అక్కడ సమావేశమై ఉన్నారని సందర్భం తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఫిలిష్తీయుల అధిపతులు.’ హీబ్రూ పదం ఫిలిష్తీయుల గుర్తింపు పొందిన పాలకులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: విన్నప్పుడు / విని
  rationale: శׁמע అనే క్రియను కథన సందర్భంలో సహజంగా ‘విను’ అని అనువదించి, మూలంలోని పునరుక్తిని రెండు చోట్లా నిలిపాం.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజావర్గపు పేరుకు ప్రామాణికమైన తెలుగు రూపం.
- source_word: הִתְקַבְּצוּ
  choice: సమావేశమయ్యారని
  rationale: హిత్పయేల్ రూపం ప్రజలు ఒకచోట కూడడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ సందర్భానికి ‘సమావేశమయ్యారు’ సహజంగా ఉంటుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ కంటే, ఇక్కడ సమూహంగా ఇశ్రాయేలీయులను సూచించే భావాన్ని లింగపరంగా అపార్థం రాకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמִּצְפָּתָה
  choice: మిస్పాలో
  rationale: స్థలనామానికి దిశార్థక ప్రత్యయం ఉన్నప్పటికీ, ప్రజలు అక్కడ సమావేశమై ఉన్నారనే సందర్భార్థాన్ని ప్రధాన పాఠంలో ఇచ్చాం; ‘మిస్పాకు’ అనే రూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיַּעֲלוּ ... אֶל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుపైకి దండెత్తారు
  rationale: עלה యొక్క పైకి వెళ్లే కదలికను ‘పైకి’ నిలుపుతూ, אֶל యొక్క సైనిక సందర్భంలోని ప్రతికూల దిశను ‘దండెత్తారు’ సహజంగా తెలియజేస్తుంది.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల పాలకులు
  rationale: సְרָנִים ఫిలిష్తీయుల గుర్తింపు పొందిన రాజకీయ లేదా సైనిక అధిపతులను సూచిస్తుంది; ‘పాలకులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וַיִּירְאוּ מִפְּנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయులకు భయపడ్డారు
  rationale: מִפְּנֵי అనే హీబ్రూ నుడికారాన్ని అక్షరానువాదం చేయకుండా, ఫిలిష్తీయుల కారణంగా కలిగిన భయాన్ని సహజ తెలుగులో తెలిపాం.
