translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ఇశ్రాయేలు ప్రజలు’ అనే రూపం మూలంలోని సామూహిక సూచనను స్పష్టంగా అందిస్తుంది. ఆంగ్ల సంప్రదింపు పాఠంలో [b] గుర్తు ‘విన్నారు’ తర్వాత ఉన్నప్పటికీ, దాని పాదసూచిక సַרְנֵי అనే ‘పాలకులు’ పదానికి సంబంధించినందున తెలుగులో ఆ పదం తర్వాత సరిగా ఉంచాం.
