reference: 1 Samuel 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח שְׁמוּאֵ֗ל טְלֵ֤ה חָלָב֙ אֶחָ֔ד ו/יעלה עוֹלָ֛ה כָּלִ֖יל לַֽ/יהוָ֑ה וַ/יִּזְעַ֨ק שְׁמוּאֵ֤ל אֶל יְהוָה֙ בְּעַ֣ד יִשְׂרָאֵ֔ל וַֽ/יַּעֲנֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
translation:
  language: te
  text: అప్పుడు సమూయేలు ఇంకా పాలు తాగే ఒక గొర్రెపిల్లను[a] తీసుకొని, దానిని యహ్వేకు సంపూర్ణ దహనబలిగా అర్పించాడు. సమూయేలు ఇశ్రాయేలు తరఫున యహ్వేకు మొరపెట్టాడు; యహ్వే అతనికి జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థానికి దగ్గరగా, “పాల గొర్రెపిల్ల”; హెబ్రీ మాటబంధం ఇంకా పాలు తాగే వయసులో ఉన్న గొర్రెపిల్లను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  choice: ఇంకా పాలు తాగే ఒక గొర్రెపిల్ల
  rationale: טְלֶה అంటే చిన్న గొర్రెపిల్ల; חָלָב పాలను సూచిస్తుంది. ఈ మాటబంధం ఇంకా పాలు తాగే వయసులో ఉన్న గొర్రెపిల్లను సూచిస్తుంది. తెలుగు పాఠకులకు సహజంగా, స్పష్టంగా ఉండేలా ఈ రూపం ఎంచుకోబడింది.
- source_word: וַיַּעֲלֵה
  choice: అర్పించాడు
  rationale: עלה హిఫీల్ రూపం బలి అర్పణ సందర్భంలో సాధారణంగా ‘అర్పించడం’ అనే అర్థాన్నిస్తుంది. తెలుగులో ‘అర్పించాడు’ సహజమైన బలిసంబంధ పదం.
- source_word: עֹלָה כָּלִיל
  choice: సంపూర్ణ దహనబలి
  rationale: עֹלָה దహనబలిని, כָּלִיל అది పూర్తిగా అర్పించబడినదని సూచిస్తాయి. ‘సంపూర్ణ దహనబలి’ ఈ రెండు భావాలను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיִּזְעַק
  choice: మొరపెట్టాడు
  rationale: זעק అత్యవసర సహాయం కోసం గట్టిగా వేడుకోవడం లేదా మొరపెట్టడం అనే తీవ్రతను కలిగి ఉంది. ‘ప్రార్థించాడు’ కంటే ‘మొరపెట్టాడు’ ఆ తీవ్రతను మెరుగ్గా కాపాడుతుంది.
- source_word: בְּעַד יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పక్షంగా
  rationale: בְּעַד ఇక్కడ ఇశ్రాయేలు తరఫున చేసే విజ్ఞాపనను సూచిస్తుంది. ‘పక్షంగా’ ప్రతినిధిత్వ భావాన్ని అతిగా వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: וַיַּעֲנֵהוּ יְהוָה
  choice: యహ్వే అతనికి జవాబిచ్చాడు
  rationale: క్రియలోని సర్వనామ ప్రత్యయం సమూయేలే జవాబు పొందిన వ్యక్తి అని తెలియజేస్తుంది; తెలుగు వాక్యం దానిని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హెబ్రీ పాఠంలో దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు దగ్గరగా తెలుగులో ‘యహ్వే’ అని లిప్యంతరీకరించబడింది.
- issue: సమూయేలు ఇశ్రాయేలు తరఫున చేసిన చర్య స్వభావం
  choice: ఇశ్రాయేలు పక్షంగా యహ్వేకు మొరపెట్టాడు
  alternative: ఇశ్రాయేలు కోసం ప్రార్థించాడు
  rationale: మూలపాఠంలోని זעק యొక్క అత్యవసర మొర భావాన్నీ, בְּעַד యొక్క తరఫున/పక్షంగా అనే భావాన్నీ నిలుపుతూ, ప్రత్యేకమైన మధ్యవర్తిత్వ సిద్ధాంతాన్ని పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. బలిసంబంధ పదజాలంలో స్థిరత్వం కోసం ‘దహనబలి’, అత్యవసర విజ్ఞాపన తీవ్రత కోసం ‘మొరపెట్టాడు’ ఉపయోగించబడ్డాయి.
