revisions:
- from: అప్పుడు సమూయేలు ఒక రాయిని తీసుకొని మిస్పాకు షేనుకు మధ్య దానిని నిలబెట్టాడు. “ఇంతవరకు యెహోవా మనకు సహాయం చేశాడు” అని చెప్పి, దానికి ఎబెనెజెరు[a] అని పేరు పెట్టాడు.
  to: అప్పుడు సమూయేలు ఒక రాయిని తీసుకొని మిస్పాకూ షేనుకూ మధ్యలో ఉంచి, దానికి ఎబెనెజెరు[a] అని పేరు పెట్టాడు. అతడు, “ఇంతవరకు యెహోవా మనకు సహాయం చేశాడు” అని చెప్పాడు.
  rationale: స్థలాన్ని సూచించే పదబంధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా సవరించాను. అలాగే మూలపాఠంలోని ‘పేరు పెట్టాడు; చెప్పాడు’ అనే క్రమాన్ని పునరుద్ధరించాను. దైవనామం, సంఖ్యావాచకం, స్మారక నామం, మరియు ‘ఇంతవరకు’లోని విస్తృత భావం యథాతథంగా ఉంచబడ్డాయి.
