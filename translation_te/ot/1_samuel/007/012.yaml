id: 1SA.7.12
reference: 1 Samuel 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶ֣בֶן אַחַ֗ת וַ/יָּ֤שֶׂם בֵּֽין הַ/מִּצְפָּה֙ וּ/בֵ֣ין הַ/שֵּׁ֔ן וַ/יִּקְרָ֥א אֶת שְׁמָ֖/הּ אֶ֣בֶן הָעָ֑זֶר וַ/יֹּאמַ֕ר עַד הֵ֖נָּה עֲזָרָ֥/נוּ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/012.yaml
  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: te
  text: అప్పుడు సమూయేలు ఒక రాయిని తీసుకొని మిస్పాకూ షేనుకూ మధ్యలో ఉంచి, దానికి ఎబెనెజెరు[a] అని పేరు పెట్టాడు. అతడు, “ఇంతవరకు యెహోవా మనకు సహాయం చేశాడు” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఎబెనెజెరు” అంటే “సహాయపు రాయి.”
    reason: హీబ్రూ పేరులోని పదప్రయోగాన్ని తెలుగు పాఠకునికి తెలియజేస్తుంది; తరువాతి మాటలతో దాని సంబంధాన్ని స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: אֶבֶן אַחַת
  choice: ఒక రాయిని
  rationale: హీబ్రూ పాఠంలోని సంఖ్యావాచకాన్ని స్పష్టంగా నిలుపుతూ సహజమైన తెలుగు ప్రయోగాన్ని వాడింది.
- source_word: וַיָּשֶׂם
  choice: నిలబెట్టాడు
  rationale: స్మారక రాయిని ఒక చోట ఉంచి నెలకొల్పిన సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶבֶן הָעָזֶר
  choice: ఎబెనెజెరు
  rationale: స్థల/స్మారక నామాన్ని లిప్యంతరీకరించింది; దాని హీబ్రూ అర్థాన్ని పాదటిప్పణిలో ఇచ్చింది.
- source_word: עַד הֵנָּה
  choice: ఇంతవరకు
  rationale: స్థల లేదా కాల పరిమితి రెండింటినీ సూచించగల మూలపాఠపు సంక్షిప్తతను నిలుపుతుంది.
- source_word: עֲזָרָנוּ
  choice: మనకు సహాయం చేశాడు
  rationale: ‘మాకు తోడ్పడ్డాడు’ అనే మూల క్రియార్థాన్ని సాధారణ ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: ఇక్కడ మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని స్పష్టంగా నిలుపుతుంది; ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ చేర్చదు.
- issue: עַד הֵנָּה లోని స్థల/కాల భావం
  choice: ఇంతవరకు
  alternative: ఈ స్థలం వరకు
  rationale: సందర్భంలో విజయప్రయాణం మరియు గత సహాయం రెండూ ప్రతిధ్వనించవచ్చు; ‘ఇంతవరకు’ ఆ ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా చదవగల కథన శైలి. వ్యక్తి, స్థల నామాలకు సాధారణ తెలుగు రూపాలు వాడబడ్డాయి. మూలంలోని క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగు సహజత్వం కోసం ఉద్ధరణను పేరు పెట్టే క్రియకు ముందు అమర్చింది.
