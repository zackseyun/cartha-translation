  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
translation:
  language: te
  text: ఫిలిష్తీయులు ఇశ్రాయేలు నుండి స్వాధీనం చేసుకున్న పట్టణాలు ఎక్రోను నుండి గాతు వరకు తిరిగి ఇశ్రాయేలు వశమయ్యాయి. ఆ పట్టణాల భూభాగాన్ని ఇశ్రాయేలు ఫిలిష్తీయుల చేతిలో నుండి విడిపించింది. ఇశ్రాయేలుకూ అమోరీయులకూ[a] మధ్య శాంతి నెలకొంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఇక్కడ ‘అమోరీయులు’ అనే పదం ఆ దేశ ప్రజలను విస్తృతంగా సూచిస్తే, ‘కనానీయులు.’
    reason: 'ప్రత్యామ్నాయ అర్థం: నిర్దిష్ట జాతిపేరైన ‘అమోరీయులు’ ఇక్కడ విస్తృతంగా కనానీయ ప్రజలను సూచించే పదంగా ఉండవచ్చు.'
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  choice: తిరిగి ఇశ్రాయేలు వశమయ్యాయి
  rationale: పట్టణాలే కర్తలుగా ఉన్న హెబ్రీ నిర్మాణాన్ని భావపరంగా నిలుపుతూ, అవి తిరిగి ఇశ్రాయేలు ఆధీనంలోకి వచ్చాయని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הֶעָרִים
  choice: పట్టణాలు
  rationale: ఈ భౌగోళిక, రాజకీయ సందర్భంలో ערים అనే పదానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: אֲשֶׁר לָקְחוּ פְלִשְׁתִּים מֵאֵת יִשְׂרָאֵל
  choice: ఫిలిష్తీయులు ఇశ్రాయేలు నుండి స్వాధీనం చేసుకున్న
  rationale: పట్టణాలు తిరిగి రావడానికి ముందు జరిగిన స్వాధీనాన్ని స్పష్టంగా చూపిస్తుంది; ‘స్వాధీనం చేసుకున్న’ అనేది కేవలం తీసుకోవడం కంటే రాజకీయ-సైనిక సందర్భాన్ని సరిగ్గా వ్యక్తం చేస్తుంది.
- source_word: מֵעֶקְרוֹן וְעַד גַּת
  choice: ఎక్రోను మొదలుకొని గాతు వరకు
  rationale: తిరిగి వచ్చిన పట్టణాల భౌగోళిక పరిధిని సహజంగా తెలియజేస్తుంది.
- source_word: וְאֶת גְּבוּלָן
  choice: ఆ పట్టణాల భూభాగాన్ని
  rationale: స్త్రీలింగ బహువచన ప్రత్యయం పట్టణాలను సూచిస్తుంది. גבול ఇక్కడ సరిహద్దు రేఖను మాత్రమే కాక వాటికి చెందిన ప్రాంతాన్ని కూడా సూచించగలదు; అందువల్ల ‘భూభాగం’ ఎంచుకోబడింది.
- source_word: הִצִּיל
  choice: విడిపించింది
  rationale: נצל హిఫిల్ రూపంలోని శత్రు ఆధిపత్యం నుండి రక్షించి వెలుపలికి తేవడం అనే భావాన్ని నిలుపుతుంది.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల చేతిలో నుండి
  rationale: హెబ్రీలోని స్పష్టమైన ‘చేతిలో నుండి’ అనే ఆధిపత్య సూచక నుడికారాన్ని తెలుగులోనూ సహజంగా నిలుపుతుంది.
- source_word: וַיְהִי שָׁלוֹם
  choice: శాంతి నెలకొంది
  rationale: వైరాలు లేక స్థిరమైన శాంతియుత సంబంధం ఏర్పడిన భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులు
  rationale: హెబ్రీ పాఠంలోని నిర్దిష్ట జాతిపేరును ప్రధాన పాఠ్యంలో యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: వచనం చివరనున్న הָאֱמֹרִי అనే జాతిపేరు
  choice: అమోరీయులు
  alternative: కనానీయులు
  rationale: హెబ్రీ పాఠం ప్రత్యేకంగా అమోరీయులను పేర్కొంటుంది. అయితే ఈ పదాన్ని ఆ దేశంలోని కనానీయ ప్రజలకు విస్తృత సూచనగా అర్థం చేసుకునే అవకాశం ఉన్నందున, ఆ భావాన్ని ప్రధాన పాఠ్యంలో కలపకుండా పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వచనశైలి ఉపయోగించబడింది. ‘చేతిలో నుండి’ అనే మూలభాషా నుడికారం సహజంగా నిలుపబడింది; అస్పష్టమైన బహువచన ప్రత్యయాన్ని ‘ఆ పట్టణాల’ అని స్పష్టం చేసి దాని మూల వ్యాకరణ సూచనను కాపాడాం.
