  terminology: ఫిలిష్తీయులు, ఇశ్రాయేలు, ఎక్రోను, గాతు, అమోరీయులు అనే పేర్లు స్థిరంగా, తగిన విధంగా ఉన్నాయి. ‘భూభాగం’ గְּבוּלָן‌కు ఈ సందర్భంలో సరైన అర్థాన్ని ఇస్తుంది. పాదటిప్పణి మూలపాఠంలోని జాతిపేరును మార్చకుండా వ్యాఖ్యాన ప్రత్యామ్నాయాన్ని కాపాడుతోంది.
