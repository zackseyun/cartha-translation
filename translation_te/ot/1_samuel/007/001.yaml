source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ אַנְשֵׁ֣י קִרְיַ֣ת יְעָרִ֗ים וַֽ/יַּעֲלוּ֙ אֶת אֲר֣וֹן יְהוָ֔ה וַ/יָּבִ֣אוּ אֹת֔/וֹ אֶל בֵּ֥ית אֲבִינָדָ֖ב בַּ/גִּבְעָ֑ה וְ/אֶת אֶלְעָזָ֤ר בְּנ/וֹ֙ קִדְּשׁ֔וּ לִ/שְׁמֹ֖ר אֶת אֲר֥וֹן יְהוָֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
translation:
  language: te
  text: అప్పుడు కిర్యత్-యెయారీము మనుషులు వచ్చి యహ్వే[a] మందసాన్ని పైకి తీసుకొచ్చారు. వారు దానిని కొండమీద[b] ఉన్న అబీనాదాబు ఇంటికి తీసుకొచ్చారు. యహ్వే మందసానికి కాపలా కాయడానికి అబీనాదాబు కుమారుడైన ఎలియాజరును పవిత్ర సేవకు ప్రతిష్ఠించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో దేవుని ప్రత్యేక నామమైన YHWH ఉంది; దాన్ని ఇక్కడ “యహ్వే” అని లిప్యంతరీకరించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, בַּגִּבְעָה ను సాధారణ నామవాచకం ‘కొండమీద’గా కాక స్థలనామంగా తీసుకుంటే, “గిబ్యాలో.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చి
  rationale: కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు సంయోజక క్రియారూపంతో తెలియజేస్తుంది.
- source_word: אַנְשֵׁי קִרְיַת יְעָרִים
  choice: కిర్యత్-యెయారీము మనుషులు
  rationale: אַנְשֵׁי అనే పదంలోని ‘మనుషులు/పురుషులు’ భావాన్ని నిలుపుతూ స్థలనామాన్ని లిప్యంతరీకరించింది.
- source_word: וַיַּעֲלוּ
  choice: పైకి తీసుకొచ్చారు
  rationale: עלה లోని పైదిశగా తరలించే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֲרוֹן יְהוָה
  choice: యహ్వే మందసం
  rationale: ఆరాధనా సందర్భంలోని אֲרוֹן కు సుపరిచితమైన ‘మందసం’ను, దేవుని ప్రత్యేక నామానికి ‘యహ్వే’ను వాడింది.
- source_word: אֶל בֵּית אֲבִינָדָב
  choice: అబీనాదాబు ఇంటికి
  rationale: తీసుకురావడం అనే క్రియతో గమ్యస్థానాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בַּגִּבְעָה
  choice: కొండమీద
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న సాధారణ నామవాచకాన్ని ప్రాథమిక పఠనంగా తీసుకుంది; స్థలనామ పఠనాన్ని పాదసూచికలో ఉంచింది.
- source_word: קִדְּשׁוּ
  choice: ప్రతిష్ఠించారు
  rationale: పవిత్రమైన బాధ్యత కోసం ఒకరిని ప్రత్యేకంగా నియమించే ఆరాధనా భావాన్ని నిలుపుతుంది.
- source_word: לִשְׁמֹר
  choice: కాపలా కాయడానికి
  rationale: మందసాన్ని భద్రంగా చూసే, కాపాడే బాధ్యతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని ప్రత్యేక నామం יְהוָה ను ఎలా అందించాలి
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సులభంగా గుర్తించగల లిప్యంతరీకరణతో నిలుపుతుంది.
- issue: בַּגִּבְעָה సాధారణ నామమా, స్థలనామమా
  choice: కొండమీద
  alternative: గిబ్యాలో
  rationale: హీబ్రూలోని నిర్దిష్ట ఉపపదం సాధారణ నామవాచక పఠనానికి సహజంగా సరిపోతుంది; అయినా స్థలనామ పఠనం సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో తెలిపింది.
- issue: בְּנוֹ లోని ‘అతని’ ఎవరిని సూచిస్తుంది
  choice: అబీనాదాబును సూచించే ‘అతని కుమారుడు’
  alternative: సంబంధాన్ని స్పష్టీకరించకుండా ‘ఎలియాజరును’ మాత్రమే పేర్కొనడం
  rationale: సమీప పూర్వపదమైన అబీనాదాబే సహజ సూచ్యుడు; మూలంలోని బంధుత్వ సమాచారాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే కథన శైలి. హీబ్రూ క్రియాక్రమాన్ని తెలుగులో సహజంగా విభజించిన వాక్యాలతో అందించాం; ‘మందసం,’ ‘ప్రతిష్ఠించారు’ వంటి పదాలు పవిత్ర సందర్భ గంభీరతను నిలుపుతాయి.
