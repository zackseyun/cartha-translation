  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/יּ֞וֹם שֶׁ֤בֶת הָֽ/אָרוֹן֙ בְּ/קִרְיַ֣ת יְעָרִ֔ים וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/יִּֽהְי֖וּ עֶשְׂרִ֣ים שָׁנָ֑ה וַ/יִּנָּה֛וּ כָּל בֵּ֥ית יִשְׂרָאֵ֖ל אַחֲרֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
translation:
  language: te
  text: మందసం కిర్యత్-యెయారీములో ఉన్న నాటి నుండి రోజులు అధికమై[a], ఇరవై సంవత్సరాలు అయ్యాయి; ఇశ్రాయేలు వంశమంతా యెహోవా కోసం విలపించింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘రోజులు అధికమయ్యాయి’; భావం, ‘చాలా కాలం గడిచింది.’
    reason: lexical_alternative
  - marker: b
    text: ‘యెహోవా కోసం ఆరాటపడింది’ లేదా ‘యెహోవా వైపు తిరిగి దుఃఖించింది’ అని కూడా అర్థం కావచ్చు. హీబ్రూ ప్రయోగం విలాపంతోపాటు ఆయనవైపు మళ్లడాన్ని లేదా ఆయన కోసం తపించడాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁבֶת
  choice: నిలిచిన
  rationale: మందసం ఒక చోట కొనసాగి ఉండడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అక్షరార్థమైన ‘కూర్చున్న’ అనే రూపాన్ని నివారిస్తుంది.
- source_word: הָאָרוֹן
  choice: మందసం
  rationale: హీబ్రూలో ఈ వచనంలో అదనపు వివరణ లేకుండా ‘మందసం’ మాత్రమే ఉంది; కథన సందర్భానికి స్థిరపడిన తెలుగు పదాన్ని వాడాం.
- source_word: בְּקִרְיַת יְעָרִים
  choice: కిర్యత్-యెయారీములో
  rationale: హీబ్రూ స్థలనామాన్ని ధ్వన్యనుసారంగా ఇచ్చి, בְ సూచించే స్థానాన్ని ‘లో’తో తెలిపాం.
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: రోజులు అధికమై
  rationale: ‘రోజులు ఎక్కువయ్యాయి’ అనే హీబ్రూ చిత్రాన్ని నిలుపుతూ, కాలం గడిచిందనే భావం సందర్భంలో స్పష్టంగా ఉండేలా చేశాం.
- source_word: וַיִּהְיוּ עֶשְׂרִים שָׁנָה
  choice: ఇరవై సంవత్సరాలు అయ్యాయి
  rationale: ముందటి కాలవ్యవధిని సహజమైన తెలుగులో స్పష్టీకరిస్తూ హీబ్రూ వాక్యక్రమానికి దగ్గరగా ఉంది.
- source_word: וַיִּנָּהוּ
  choice: విలపించారు
  rationale: נהה యొక్క ప్రధానమైన విలాపం లేదా దుఃఖం భావాన్ని ఇస్తుంది; దానిని కేవలం కోరికగా పరిమితం చేయదు.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారందరూ
  rationale: ‘ఇశ్రాయేలు ఇల్లు’ అనే సమష్టి, ఒడంబడిక-జాతీయ వ్యక్తీకరణను సహజమైన తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: אַחֲרֵי יְהוָה
  choice: యెహోవా కోసం
  rationale: అక్షరార్థంగా ‘యెహోవా వెనుక/వెంబడి’ అనే అసహజ రూపం బదులు, విలాపం మరియు ఆయనవైపు ఆకాంక్ష రెండింటికీ చోటిచ్చే తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న ధ్వన్యనుసార రూపంలో ఇచ్చాం.
theological_decisions:
- issue: וַיִּנָּהוּ ... אַחֲרֵי יְהוָה లో ఇశ్రాయేలు స్పందన స్వభావం
  choice: యెహోవా కోసం విలపించారు
  alternative: యెహోవా కోసం ఆరాటపడ్డారు; యెహోవా వైపు తిరిగి దుఃఖించారు
  rationale: వాక్యం దుఃఖం, ఆకాంక్ష, దేవునివైపు మళ్లడం వంటి భావాలకు అవకాశం ఇస్తుంది. ఈ వచనంలో స్పష్టంగా లేని సంపూర్ణ పశ్చాత్తాప సూత్రాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన కథన శైలి. మూలంలోని కాలవ్యవధి నిర్మాణాన్ని కొంతవరకు నిలిపి, అసహజమైన అక్షరానువాదాన్ని నివారించాం. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంటనే ఉంచబడ్డాయి.
