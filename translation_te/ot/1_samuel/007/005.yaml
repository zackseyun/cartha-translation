  revision_rationale: సురక్షితమైన సవరణ అవసరం లేదు. ముసాయిదా మూలపాఠార్థాన్ని, దిశాసూచక భావాన్ని, ఆజ్ఞ యొక్క బహువచనాన్ని, ప్రార్థనలోని మధ్యవర్తిత్వ భావాన్ని తగిన రీతిలో నిలుపుతుంది. ఆంగ్ల ఆడిట్‌లోని ఫుట్‌నోట్ ప్రధాన పాఠంతో అసంగతంగా కనిపించినప్పటికీ, తెలుగు ముసాయిదాలో ఫుట్‌నోట్ లేదా యాంకర్ లేదు; ఈ వచనానికి పాఠాంతర-సంబంధిత గమనిక అవసరం లేదు.
