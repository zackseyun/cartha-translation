id: 1SA.7.5
reference: 1 Samuel 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל קִבְצ֥וּ אֶת כָּל יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑תָ/ה וְ/אֶתְפַּלֵּ֥ל בַּעַדְ/כֶ֖ם אֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/005.yaml
  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
translation:
  language: te
  text: అప్పుడు సమూయేలు, “ఇశ్రాయేలీయులందరినీ మిస్పాకు సమకూర్చండి; నేను మీ తరఫున యాహ్వేకు ప్రార్థిస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు ... అన్నాడు’ దాని క్రమానుగత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: ఈ వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: קִבְצוּ
  choice: సమకూర్చండి
  rationale: ఇది బహువచన ఆజ్ఞారూపం. ప్రజలందరినీ ఒకచోటికి పిలిచి చేర్చాలనే భావాన్ని ‘సమకూర్చండి’ సహజంగా తెలియజేస్తుంది.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరినీ
  rationale: దేశప్రజల సమష్టిని సూచించే ‘ఇశ్రాయేలు అంతటినీ’ అనే భావాన్ని సాధారణ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַמִּצְפָּתָה
  choice: మిస్పాకు
  rationale: స్థలపేరుకు జతచేసిన దిశాసూచక రూపం అక్కడికి వెళ్లడాన్ని సూచిస్తుంది; అందువల్ల ‘మిస్పాకు’ అని అనువదించబడింది.
- source_word: וְאֶתְפַּלֵּל
  choice: నేను ... ప్రార్థిస్తాను
  rationale: ఆజ్ఞ తరువాత సమూయేలు చేయబోయే కార్యాన్ని ప్రథమ పురుష భవిష్యదర్థంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּעַדְכֶם
  choice: మీ తరఫున
  rationale: בְּעַד్‌లోని మధ్యవర్తిత్వ లేదా విజ్ఞాపన భావాన్ని కేవలం ‘మీ కోసం’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: אֶל יְהוָה
  choice: యాహ్వేకు
  rationale: אֶל అనే సంబంధార్థక అవ్యయం ప్రార్థన ఎవరికి ఉద్దేశించబడిందో సూచిస్తుంది. יְהוָה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి దగ్గరైన ‘యాహ్వే’గా ఉంచడం మూలంలోని నామస్వరూపాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ఆజ్ఞ బహువచనంగా నిలుపబడింది; మిస్పాకు వెళ్లే దిశా భావం, సమూయేలు చేసే మధ్యవర్తిత్వ ప్రార్థన రెండూ స్పష్టంగా సంరక్షించబడ్డాయి.
