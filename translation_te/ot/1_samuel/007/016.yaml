  text: וְ/הָלַ֗ךְ מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/סָבַב֙ בֵּֽית אֵ֔ל וְ/הַ/גִּלְגָּ֖ל וְ/הַ/מִּצְפָּ֑ה וְ/שָׁפַט֙ אֶת יִשְׂרָאֵ֔ל אֵ֥ת כָּל הַ/מְּקוֹמ֖וֹת הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/016.yaml
  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
translation:
  language: te
  text: అతడు ఏటేట[a] బేతేలు, గిల్గాలు, మిస్పా అనే స్థలాలను చుట్టివచ్చేవాడు[b]; ఆ స్థలాలన్నిటిలో ఇశ్రాయేలీయులకు న్యాయం తీర్చేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “సంవత్సరం తర్వాత సంవత్సరం”; భావం: ప్రతి సంవత్సరం.'
    reason: lexical_alternative
  - marker: b
    text: లేదా “క్రమంగా పర్యటించేవాడు” లేదా “చుట్టి వచ్చేవాడు”; హీబ్రూ పదం ఈ పట్టణాల మధ్య అతడు నియమిత పర్యటన చేసేవాడని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַךְ
  choice: అతడు ... పర్యటిస్తూ
  rationale: కాలసూచకమైన వార్షిక పదబంధంతో కలిసి ఇది సమూయేలు అలవాటుగా చేసిన పనిని సూచిస్తుంది; తెలుగు వాక్యంలో ‘పర్యటిస్తూ ... తీర్చేవాడు’ ఆ పునరావృత గత చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: ఏటేట
  rationale: హీబ్రూ నుడికారం క్రమమైన వార్షిక పునరావృతిని సూచిస్తుంది; ‘ఏటేట’ సంక్షిప్తంగా, సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: וְסָבַב
  choice: క్రమంగా పర్యటిస్తూ
  rationale: ఈ క్రియ ఇక్కడ పేర్కొన్న పట్టణాల మధ్య స్థిరమైన పర్యటన మార్గాన్ని అనుసరించడాన్ని సూచిస్తుంది. ‘క్రమంగా పర్యటిస్తూ’ సాధారణంగా చుట్టూ తిరగడంకన్నా ఆ నియమిత పర్యటన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: ఈ స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: הַגִּלְגָּל
  choice: గిల్గాలు
  rationale: ఈ స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: הַמִּצְפָּה
  choice: మిస్పా
  rationale: ఈ స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: וְשָׁפַט
  choice: న్యాయం తీర్చేవాడు
  rationale: שׁפט న్యాయవిచారణతో కూడిన నాయకత్వాన్ని సూచిస్తుంది. ‘న్యాయం తీర్చేవాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, న్యాయాధిపత్య భావాన్ని నిలుపుతుంది.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులకు
  rationale: ఇక్కడ ‘ఇశ్రాయేలు’ అనేది సమూయేలు న్యాయం తీర్చిన ప్రజలను సూచిస్తుంది; తెలుగులో వ్యక్తుల సమూహంగా ‘ఇశ్రాయేలీయులకు’ అనడం సహజం.
- source_word: אֵת כָּל הַמְּקוֹמוֹת הָאֵלֶּה
  choice: ఆ స్థలాలన్నిటిలో
  rationale: ఈ పదబంధం సమూయేలు న్యాయం తీర్చిన ప్రదేశాలను క్రియావిశేషణాత్మకంగా సూచిస్తుంది.
