source:
  edition: WLC
  text: וַ/יִּכָּֽנְעוּ֙ הַ/פְּלִשְׁתִּ֔ים וְ/לֹא יָסְפ֣וּ ע֔וֹד לָ/ב֖וֹא בִּ/גְב֣וּל יִשְׂרָאֵ֑ל וַ/תְּהִ֤י יַד יְהוָה֙ בַּ/פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֥י שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
translation:
  language: te
  text: కాబట్టి ఫిలిష్తీయులు అణచివేయబడ్డారు; వారు మళ్లీ ఇశ్రాయేలు భూభాగంలోకి రాలేదు. సమూయేలు కాలమంతా యాహ్వే హస్తం[a] ఫిలిష్తీయులకు విరోధంగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “యాహ్వే హస్తం ఫిలిష్తీయుల మీద ఉంది.” ఇది యాహ్వే కార్యశీలమైన శక్తిని సూచించే నానుడి; ఇక్కడ ఆ శక్తి వారికి విరోధంగా పనిచేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: అణచివేయబడ్డారు
  rationale: כנע నిఫాల్ రూపం ఓటమి తరువాత లోబరచబడిన స్థితిని సూచిస్తుంది. సైనిక-రాజకీయ సందర్భంలో ‘అణచివేయబడ్డారు’ అనే పదం దాని నిష్క్రియాత్మక, ఫలితార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא יָסְפוּ עוֹד
  choice: మళ్లీ … రాలేదు
  rationale: יסף + עוד అనే హీబ్రూ నానుడి ఒక చర్య ఇకపై పునరావృతం కాలేదని సూచిస్తుంది; తెలుగులో ‘మళ్లీ … రాలేదు’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: בִּגְבוּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు భూభాగంలోకి
  rationale: גְּבוּל పదానికి సరిహద్దు లేదా భూభాగం అనే అర్థాలు ఉన్నాయి. ఇక్కడ కేవలం సరిహద్దు రేఖ దగ్గరకు రావడం కాక ఇశ్రాయేలు దేశంలోకి ప్రవేశించడం ఉద్దేశం కాబట్టి ‘భూభాగంలోకి’ ఎంచుకోబడింది.
- source_word: וַתְּהִי יַד יְהוָה
  choice: యాహ్వే హస్తం … ఉంది
  rationale: దేవుని కార్యశీల శక్తిని తెలిపే హీబ్రూ రూపకాన్ని ‘హస్తం’ అని నిలిపి ఉంచడం ద్వారా మూలపాఠపు బింబం సంరక్షించబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בַּפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులకు విరోధంగా
  rationale: ‘మీద’ అనే ఉపసర్గ ఈ సందర్భంలో ప్రతికూలమైన, శిక్షాత్మకమైన దైవ చర్యను సూచిస్తుంది. ‘విరోధంగా’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֹּל יְמֵי שְׁמוּאֵל
  choice: సమూయేలు దినాలన్నిటిలోనూ
  rationale: హీబ్రూ కాలవ్యక్తీకరణను సాధ్యమైనంత దగ్గరగా ఉంచుతూ, అది సమూయేలు జీవితమంతటినే తప్పనిసరిగా సూచిస్తుందని అదనంగా నిర్ణయించకుండా అనువదించబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: ‘యాహ్వే హస్తం ఫిలిష్తీయుల మీద ఉంది’ అనే నానుడి భావం
  choice: యాహ్వే హస్తం ఫిలిష్తీయులకు విరోధంగా ఉంది
  alternative: యాహ్వే హస్తం ఫిలిష్తీయుల మీద ఉంది
  rationale: సైనిక అణచివేత సందర్భంలో ఈ నానుడి దైవిక శక్తి వారికి ప్రతికూలంగా పనిచేసిందని సూచిస్తుంది. రూపకాన్ని ‘హస్తం’ ద్వారా నిలిపి, సంబంధబలాన్ని ‘విరోధంగా’ అని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘హస్తం’ అనే బైబిలీయ రూపకాన్ని నిలిపి ఉంచగా, దాని సందర్భార్థాన్ని పాదటిప్పణిలో వివరించాం. పాదటిప్పణి సూచికను అది వివరించే ‘యాహ్వే హస్తం’ వాక్యభాగం వద్ద ఉంచాం.
