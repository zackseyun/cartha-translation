translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘తీర్పు తీర్చాడు’ కంటే విస్తృతమైన న్యాయాధిపతి పాత్రను తెలియజేయడానికి ‘న్యాయాధిపతిగా వ్యవహరించాడు’ ఎంచుకోబడింది.
