  text: And Samuel judged Israel all the days of his life[a].
translation:
  language: te
  text: సమూయేలు తన జీవితకాలమంతా ఇశ్రాయేలుకు న్యాయాధిపతిగా వ్యవహరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలుకు న్యాయం తీర్చాడు,’ లేదా ‘న్యాయాధిపతిగా ఇశ్రాయేలును నడిపించాడు’; హీబ్రూ క్రియలో న్యాయం తీర్చడం, పరిపాలించడం అనే రెండు భావాలూ ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: న్యాయాధిపతిగా వ్యవహరించాడు
  rationale: שׁפט అనే క్రియలో న్యాయం తీర్చడం, న్యాయాధిపతిగా నాయకత్వం వహించడం, పరిపాలించడం అనే భావాలు ఉన్నాయి. సమూయేలు–ఇశ్రాయేలు సందర్భంలో ‘న్యాయాధిపతిగా వ్యవహరించాడు’ అనేది ఆ కాలపు పాత్రను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ న్యాయపరమైన భావాన్ని కాపాడుతుంది.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: హీబ్రూలో ప్రత్యక్ష కర్మగా ఉన్న ‘ఇశ్రాయేలు’ను, ‘న్యాయాధిపతిగా వ్యవహరించు’ అనే సహజ తెలుగు నిర్మాణానికి తగినట్లు ‘ఇశ్రాయేలుకు’ అని ఇచ్చాం.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: తన జీవితకాలమంతా
  rationale: ‘అతని జీవితం యొక్క రోజులన్నీ’ అనే హీబ్రూ కాలవ్యాప్తి నుడికారాన్ని సహజంగా, సంపూర్ణ వ్యవధి భావం నిలిచేలా అనువదించాం.
