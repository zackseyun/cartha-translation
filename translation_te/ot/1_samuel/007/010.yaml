id: 1SA.7.10
reference: 1 Samuel 7:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֤י שְׁמוּאֵל֙ מַעֲלֶ֣ה הָ/עוֹלָ֔ה וּ/פְלִשְׁתִּ֣ים נִגְּשׁ֔וּ לַ/מִּלְחָמָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יַּרְעֵ֣ם יְהוָ֣ה בְּ/קוֹל גָּ֠דוֹל בַּ/יּ֨וֹם הַ/ה֤וּא עַל פְּלִשְׁתִּים֙ וַ/יְהֻמֵּ֔/ם וַ/יִּנָּגְפ֖וּ לִ/פְנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
translation:
  language: te
  text: సమూయేలు దహనబలిని అర్పిస్తూ ఉండగా, ఫిలిష్తీయులు ఇశ్రాయేలుపై యుద్ధానికి సమీపించారు. అయితే ఆ రోజు యాహ్వే ఫిలిష్తీయుల మీద గొప్ప శబ్దంతో[a] ఉరిమాడు; వారిని గందరగోళానికి గురిచేశాడు. వారు ఇశ్రాయేలు ఎదుట ఓడిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలమైన ఉరుముతో,” లేదా “గొప్ప ధ్వనితో.” హీబ్రూ మూలంలో అక్షరార్థంగా “గొప్ప శబ్దంతో” అని ఉంది.
    reason: קוֹל גָּדוֹל అనే పదబంధం సందర్భంలో ఉరుమును సూచించవచ్చు; అయితే దాని అక్షరార్థం మరింత విస్తృతమైనది. ప్రత్యామ్నాయాలను చూపడం మూలంలోని భావవిస్తృతిని నిలుపుతుంది.
lexical_decisions:
- source_word: מַעֲלֶה הָעוֹלָה
  choice: దహనబలిని అర్పిస్తూ ఉండగా
  rationale: హిఫీల్ కృదంతం బలి అర్పణ కొనసాగుతున్న సమయంలో తరువాతి సంఘటన జరిగిందని సూచిస్తుంది; עֹלָה బలిపీఠంపై పూర్తిగా దహనం చేసే బలి రకాన్ని సూచిస్తుంది.
- source_word: נִגְּשׁוּ לַמִּלְחָמָה בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో యుద్ధం చేయడానికి దగ్గరికి వచ్చారు
  rationale: సైనిక సందర్భంలో נגשׁ למלחמה యుద్ధానికి సమీపించడాన్ని సూచిస్తుంది; ב ఇక్కడ ప్రత్యర్థితో యుద్ధం అనే భావాన్ని ఇస్తుంది.
- source_word: וַיַּרְעֵם
  choice: ఉరిమి
  rationale: רעם దేవుడు ఉరుము కలిగించడాన్ని లేదా ఉరుమడాన్ని సూచిస్తుంది; తెలుగులో ‘ఉరిమి’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּקוֹל גָּדוֹל
  choice: గొప్ప ధ్వనితో
  rationale: קוֹל అనే పదానికి ధ్వని లేదా స్వరం అనే విస్తృతార్థం ఉంది. సందర్భం ఉరుమును సూచించినప్పటికీ, మూలంలోని పదబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా ఈ అనువాదం దాని విస్తృతిని నిలుపుతుంది.
- source_word: וַיְהֻמֵּם
  choice: వారిని గందరగోళానికి గురిచేశాడు
  rationale: המם యుద్ధంలో భయం, కలవరం లేదా అస్తవ్యస్తత కలిగించే కారణార్థక భావాన్ని కలిగి ఉంది; తరువాతి ఓటమి వాక్యానికి వేరుగా ఈ భావాన్ని నిలుపుతుంది.
- source_word: וַיִּנָּגְפוּ לִפְנֵי יִשְׂרָאֵל
  choice: వారు ఇశ్రాయేలు ఎదుట ఓడిపోయారు
  rationale: నిఫాల్ రూపం యుద్ధంలో ఓడిపోవడాన్ని సూచిస్తుంది; לִפְנֵי ఇక్కడ ప్రత్యర్థి ఎదుట పరాజయం పొందడం అనే సాధారణ హీబ్రూ ప్రయోగం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణ ‘Yahweh’కు అనుగుణంగా తెలుగులో ‘యాహ్వే’గా ఇచ్చింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
- issue: దైవిక ఉరుము మరియు ఫిలిష్తీయుల ఓటమి మధ్య సంబంధం
  choice: ఉరుము వారిని గందరగోళానికి గురిచేసింది; తరువాత వారు ఓడిపోయారు అనే వరుసను నిలుపడం
  alternative: ఉరుమే వారిని నేరుగా సంహరించిందని చెప్పడం
  rationale: హీబ్రూ పాఠం గందరగోళం కలిగించడం మరియు ఇశ్రాయేలు ఎదుట ఓడిపోవడం అనే రెండు వరుస క్రియలను చెబుతుంది; సంహారం లేదా సంపూర్ణ నాశనం అని పాఠానికి మించిన భావాన్ని చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అర్పిస్తూ ఉండగా’ సమకాలీన చర్యను స్పష్టం చేస్తుంది. మూలంలోని రెండు అనుసంధాన వాక్యాల ప్రవాహాన్ని తెలుగులో సహజంగా చూపేందుకు చివరి వాక్యానికి ‘దాంతో’ వాడబడింది. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచిక గుర్తు దహనబలి తరువాత ఉన్నప్పటికీ, పాదసూచిక విషయం בְּקוֹל גָּדוֹל గురించి కావడంతో గుర్తును ‘గొప్ప ధ్వనితో’ తరువాత ఉంచబడింది.
