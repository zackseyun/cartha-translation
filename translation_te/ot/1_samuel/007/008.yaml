id: 1SA.7.8
reference: 1 Samuel 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל שְׁמוּאֵ֔ל אַל תַּחֲרֵ֣שׁ מִמֶּ֔/נּוּ מִ/זְּעֹ֖ק אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు ప్రజలు సమూయేలుతో ఇలా అన్నారు: “మా కోసం మన దేవుడైన యాహ్వేకు మొరపెట్టడం మానకు; ఆయన ఫిలిష్తీయుల చేతిలోనుండి మమ్మల్ని రక్షించాలని మొరపెట్టు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, ఈ సందర్భంలో సమస్త ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אַל תַּחֲרֵשׁ מִמֶּנּוּ מִזְּעֹק
  choice: మా కోసం మొరపెట్టకుండా మౌనంగా ఉండకు
  rationale: חרשׁ లోని ‘మౌనంగా ఉండు’ అనే రూపకాన్ని నిలుపుతూ, מִמֶּנּוּను సందర్భానుసారంగా ‘మా కోసం’ అని, זעקను సహాయం కోసం చేసే బలమైన ప్రార్థనగా ‘మొరపెట్టు’ అని అనువదించింది. హెబ్రీ వాక్యనిర్మాణంలోని అసాధారణతను పూర్తిగా చెరపకుండా తెలుగులో అర్థమయ్యేలా చేసింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణానుసార రూపమైన ‘యాహ్వే’గా ఇచ్చింది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: ఇశ్రాయేలు ప్రజల సమిష్టి, నిబంధనాత్మక అనుబంధాన్ని సహజమైన తెలుగు స్వామ్యరూపంలో వ్యక్తం చేస్తుంది.
- source_word: וְיֹשִׁעֵנוּ
  choice: ఆయన ... మమ్మల్ని రక్షించాలి
  rationale: ఇక్కడి క్రియ ప్రార్థన యొక్క ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని తెలియజేస్తుంది. ‘రక్షించాలి’ అనే రూపం ఆ విన్నపభావాన్ని నిలుపుతుంది; దానిని ఖచ్చితమైన భవిష్యద్వాక్యంగా మార్చదు.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల చేతిలోనుండి
  rationale: ‘చేతిలోనుండి’ అనే హెబ్రీ అధికార/ఆధీనత రూపకాన్ని తెలుగులోనూ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, మూలనామానికి దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- issue: וְיֹשִׁעֵנוּలోని భావం
  choice: ఆయన ... మమ్మల్ని రక్షించాలి
  alternative: ఆయన ... మమ్మల్ని రక్షిస్తాడు
  rationale: ఈ రూపం ఉద్దేశం, ఆశ లేదా విన్నపాన్ని సూచించగలదు. దానిని నిశ్చితమైన వాగ్దానంగా మార్చకుండా ఆ భావతీవ్రతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. మూలంలోని ‘మౌనంగా ఉండడం,’ ‘చేతిలోనుండి’ అనే రూపకాలను నిలుపుతూ, అసహజమైన పదానువాదాన్ని పరిమితం చేసింది.
