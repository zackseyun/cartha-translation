  text: וּ/תְשֻׁבָת֤/וֹ הָ/רָמָ֨תָ/ה֙ כִּֽי שָׁ֣ם בֵּית֔/וֹ וְ/שָׁ֖ם שָׁפָ֣ט אֶת יִשְׂרָאֵ֑ל וַ/יִּֽבֶן שָׁ֥ם מִזְבֵּ֖חַ לַֽ/יהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/017.yaml
  text: Then he would return to Ramah[a], for his house was there, and there he judged Israel. He built there an altar to Yahweh.
translation:
  language: te
  text: తర్వాత అతడు రామాకు తిరిగి వచ్చేవాడు[a], ఎందుకంటే అతని ఇల్లు అక్కడ ఉండేది; అక్కడే అతడు ఇశ్రాయేలుకు న్యాయం తీర్చేవాడు. అక్కడ అతడు యెహోవాకు ఒక బలిపీఠం కట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అతని తిరుగు రామాకు ఉండేది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  choice: తర్వాత అతడు ... తిరిగి వచ్చేవాడు
  rationale: నామవాచక రూపానికి అక్షరార్థం ‘అతని తిరుగు’. ముందరి వచనంలోని క్రమమైన సంచారాన్ని బట్టి, తెలుగులో పునరావృత చర్యను సహజంగా తెలియజేయడానికి క్రియారూపంగా అనువదించాం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הָרָמָתָה
  choice: రామాకు
  rationale: స్థలనామానికి జోడించిన దిశాసూచక ה, రామా వైపు కదలికను సూచిస్తుంది; తెలుగులో ‘రామాకు’ సహజమైన రూపం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: అతడు రామాకు తిరిగి రావడానికి గల కారణాన్ని పరిచయం చేస్తుంది.
- source_word: בֵּיתוֹ
  choice: అతని ఇల్లు
  rationale: ఇక్కడ בַּיִת ప్రధానంగా అతని నివాసస్థలాన్ని సూచిస్తుంది; ‘ఇల్లు’ మూలపదంలోని స్పష్టతను నిలుపుతుంది.
- source_word: וְשָׁם
  choice: అక్కడే
  rationale: శమూయేలు నివాసం, న్యాయాధిపత్య కార్యం, బలిపీఠ నిర్మాణం అన్నీ రామాతో ముడిపడి ఉన్నాయని చూపే שָׁם పునరుక్తిని నిలిపాం.
- source_word: שָׁפַט אֶת־יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు న్యాయాధిపతిగా వ్యవహరించేవాడు
  rationale: שׁפט ఇక్కడ కేవలం న్యాయవిచారణనే కాక ఇశ్రాయేలుపై శమూయేలు నిర్వహించిన న్యాయాధిపతి పాత్రను సూచిస్తుంది. తెలుగులో పాత్రార్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేశాం.
- source_word: וַיִּבֶן
  choice: కట్టించాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. మూలంలో లేని ‘కూడా’ అనే భావాన్ని చేర్చలేదు. బలిపీఠం విషయంలో సహజ తెలుగు వాడుకగా ‘కట్టించాడు’ ఎంచుకున్నాం.
- source_word: מִזְבֵּחַ
  choice: ఒక బలిపీఠాన్ని
  rationale: מִזְבֵּחַకు ప్రామాణిక తెలుగు సమానార్థకం ‘బలిపీఠం’.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל అంకితం లేదా ఉద్దేశాన్ని సూచిస్తుంది; יהוה అనే దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం చతురక్షర దైవనామాన్ని నేరుగా వాడుతుంది. దానిని బిరుదుతో భర్తీ చేయకుండా, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఉపయోగించాం.
- issue: శమూయేలు చేసిన שׁפט కార్యం యొక్క పరిధి
  choice: న్యాయాధిపతిగా వ్యవహరించేవాడు
  alternative: తీర్పు తీర్చేవాడు; పరిపాలించేవాడు
  rationale: ఈ పదం న్యాయవిచారణకంటే విస్తృతమైన నాయకత్వ పాత్రను సూచించగలదు. ‘న్యాయాధిపతిగా వ్యవహరించేవాడు’ ఆ పదవిని తెలియజేస్తూనే దానిని కేవలం రాజకీయ పరిపాలనగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘అక్కడే’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, రామా శమూయేలు నివాసం మరియు సేవకు కేంద్రంగా ఉన్నదనే మూలపాఠ నిర్మాణాన్ని ప్రతిబింబించాం.
