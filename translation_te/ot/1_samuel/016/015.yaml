  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ עַבְדֵֽי שָׁא֖וּל אֵלָ֑י/ו הִנֵּה נָ֧א רֽוּחַ אֱלֹהִ֛ים רָעָ֖ה מְבַעִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/015.yaml
  text: And Saul’s servants said to him[a], “Look now, an evil spirit from God is terrifying you.”
translation:
  language: te
  text: అప్పుడు సౌలు సేవకులు అతనితో, “చూడండి, దేవుని నుండి వచ్చిన దుష్టాత్మ[a] నిన్ను భయభ్రాంతులకు గురిచేస్తోంది” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని నుండి వచ్చిన హానికరమైన లేదా బాధ కలిగించే ఆత్మ.” హీబ్రూ పదం ఆ ఆత్మను దుష్టమైనదిగా గానీ, హాని లేదా బాధ కలిగించేదిగా గానీ వర్ణించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు ... అన్నారు
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని సూచిస్తుంది.
- source_word: עַבְדֵי שָׁאוּל
  choice: సౌలు సేవకులు
  rationale: రాజసభ సందర్భంలో עֶבֶד అనే పదానికి ‘సేవకులు’ సహజమైనది; ఇక్కడ బానిసత్వాన్ని ప్రధానంగా సూచించదు.
- source_word: אֵלָיו
  choice: అతనితో
  rationale: మాట్లాడే క్రియతో కలిపి ‘అతనితో ... అన్నారు’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: הִנֵּה נָא
  choice: ఇదిగో
  rationale: ఈ పదజంట శ్రద్ధను ఆకర్షించి పరిస్థితి తక్షణతను తెలియజేస్తుంది; ‘ఇదిగో’ దాని సంభాషణాత్మక బలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: רוּחַ אֱלֹהִים
  choice: దేవుని నుండి వచ్చిన ... ఆత్మ
  rationale: ఈ సందర్భంలో దేవునితో సంబంధాన్ని మూలం లేదా పంపింపు భావంగా స్పష్టం చేస్తుంది; దీనిని దేవుని స్వీయ ఆత్మతో నేరుగా సమానపరచకుండా ఉంటుంది.
- source_word: רָעָה
  choice: దుష్ట
  rationale: רָעָה కు ‘చెడు/దుష్ట’ అనే ప్రత్యక్ష అర్థం ఉంది; హానికరమైన లేదా బాధ కలిగించే అనే సందర్భోచిత భావాన్ని పాదసూచికలో నిలుపుతున్నాం.
- source_word: מְבַעִתֶּךָ
  choice: నిన్ను భయభ్రాంతుణ్ణి చేస్తోంది
  rationale: భయపెట్టడం కంటే తీవ్రమైన భయాన్ని కలిగించే కొనసాగుతున్న చర్యను ఈ ప్రయోగం వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה లో దేవునితో ఆత్మకున్న సంబంధాన్ని, తరువాతి సిద్ధాంత నిర్ణయాలను రుద్దకుండా ఎలా అనువదించాలి
  choice: దేవుని నుండి వచ్చిన దుష్టాత్మ
  alternative: దేవుని నుండి వచ్చిన హానికరమైన/బాధ కలిగించే ఆత్మ
  rationale: హీబ్రూ పాఠం ఆ ఆత్మ దేవుని నుండి వచ్చిందని ఏదో అర్థంలో చెబుతుంది; ఆ సంబంధాన్ని మృదువుగా తొలగించకూడదు. అదే సమయంలో ‘నుండి వచ్చిన’ అనడం దానిని దేవుని స్వీయ ఆత్మతో సమానపరచదు. רָעָה లోని ‘దుష్ట’ మరియు ‘హానికరమైన/బాధ కలిగించే’ భావాల మధ్య ఉన్న నిజమైన సందిగ్ధతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఇదిగో’ శ్రద్ధాకర్షణను నిలుపుతుంది; ‘భయభ్రాంతుణ్ణి చేస్తోంది’ మూలంలోని తీవ్రమైన, కొనసాగుతున్న భయాన్ని వ్యక్తం చేస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదానికే జతచేయబడింది.
