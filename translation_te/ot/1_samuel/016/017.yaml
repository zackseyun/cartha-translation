translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘వాయించు’ అనే పదం మూలంలోని సాధారణ సంగీత క్రియను నిలుపుతుంది; ఈ వచనంలో లేని నిర్దిష్ట వాయిద్యాన్ని చేర్చలేదు. పాదసూచిక గుర్తును సంబంధిత వాక్యం చివర ఉంచాం.
