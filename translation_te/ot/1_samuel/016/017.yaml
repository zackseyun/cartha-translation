source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שָׁא֖וּל אֶל עֲבָדָ֑י/ו רְאוּ נָ֣א לִ֗/י אִ֚ישׁ מֵיטִ֣יב לְ/נַגֵּ֔ן וַ/הֲבִיאוֹתֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/017.yaml
  text: Then Saul said to his servants[a], “Please find for me a man who can play well, and bring him to me.”
translation:
  language: te
  text: అప్పుడు సౌలు తన సేవకులతో, “నా కోసం బాగా వాయించగల ఒక మనిషిని వెదికి, నా దగ్గరికి తీసుకురండి” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “వాయించడంలో బాగా చేసేవాడైన ఒక మనిషి”; అంటే నైపుణ్యంగా వాయించే వ్యక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: עֲבָדָיו
  choice: తన సేవకులతో
  rationale: עֶבֶד యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతుంది; రాజసభ సందర్భంలో వీరు సౌలు సేవలో ఉన్న పరిచారకులు లేదా ఆస్థాన సేవకులు.
- source_word: רְאוּ נָא
  choice: వెదికి
  rationale: ראה ఆజ్ఞారూపం నָאతో కలిసి ఇక్కడ తగిన వ్యక్తిని వెదికి గుర్తించమనే మర్యాదపూర్వక అభ్యర్థనగా పనిచేస్తుంది. తెలుగు ఆజ్ఞా నిర్మాణంలో తరువాతి ‘తీసుకురండి’తో కలిపి సహజంగా వ్యక్తమవుతుంది.
- source_word: לִי
  choice: నా కోసం
  rationale: లబ్ధిదారు లేదా ప్రయోజనార్థక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ఒక మనిషిని
  rationale: హీబ్రూ పదంలోని ఏకవచన పురుష సూచనను నిలుపుతుంది.
- source_word: מֵיטִיב לְנַגֵּן
  choice: బాగా వాయించగల
  rationale: అక్షరార్థంగా ‘వాయించడంలో మేలు చేసేవాడు’; సందర్భంలో సంగీతాన్ని నైపుణ్యంగా వాయించే సామర్థ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ఈ వచనంలో వాయిద్యాన్ని ప్రత్యేకంగా చేర్చదు.
- source_word: וַהֲבִיאוֹתֶם אֵלָי
  choice: నా దగ్గరికి తీసుకురండి
  rationale: సేవకులందరిని ఉద్దేశించిన బహువచన ఆజ్ఞను, ముందున్న ఏకవచన వ్యక్తిని కర్మగా ఉంచి నేరుగా తెలుగులో అందిస్తుంది.
