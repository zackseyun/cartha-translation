source:
  edition: WLC
  text: וַ/יַּעֲבֵ֥ר יִשַׁ֛י שִׁבְעַ֥ת בָּנָ֖י/ו לִ/פְנֵ֣י שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל יִשַׁ֔י לֹא בָחַ֥ר יְהוָ֖ה בָּ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: te
  text: కాబట్టి యెష్షయి తన ఏడుగురు కుమారులను సమూయేలు ఎదుటుగా వెళ్లించాడు. అప్పుడు సమూయేలు యెష్షయితో, “యాహ్వే వీరిలో ఎవరినీ ఎన్నుకోలేదు” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: ఎదుటుగా వెళ్లేలా చేశాడు
  rationale: 'עבר క్రియ యొక్క హిఫీల్ రూపం ఇక్కడ కారణార్థకంగా ఉంది: యెష్షయి తన కుమారులను సమూయేలు ఎదుటుగా వెళ్లేలా చేశాడు. ఈ తెలుగు రూపం ఆ కారణార్థాన్ని సహజంగా నిలుపుతుంది.'
- source_word: שִׁבְעַת בָּנָיו
  choice: తన కుమారుల్లో ఏడుగురిని
  rationale: నిర్మాణ పదబంధం ‘అతని కుమారుల్లో ఏడుగురు’ అనే భావాన్ని ఇస్తుంది. తరువాత దావీదు ఇంకా ఉన్నాడని కథ తెలియజేస్తుంది కాబట్టి, వీరే అతని మొత్తం కుమారులన్న అపార్థాన్ని ఈ రూపం నివారిస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుటుగా
  rationale: ఇక్కడ సమూయేలు సమక్షంలో ఒక్కొక్కరిని చూపించేందుకు అతని ఎదుటుగా తీసుకువెళ్లడాన్ని సూచించే సహజ తెలుగు ప్రయోగం.
- source_word: לֹא בָחַר
  choice: ఎన్నుకోలేదు
  rationale: בחר అంటే ‘ఎన్నుకొను/ఎంపికచేయు.’ దైవిక ఎంపిక భావాన్ని సహజంగా తెలిపేందుకు ‘ఎన్నుకోలేదు’ వాడబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: בָּאֵלֶּה
  choice: వీరిలో ఎవరినీ
  rationale: ב ఉపసర్గతో కూడిన సూచన సర్వనామం సందర్భంలో సమర్పించబడిన వారిలో ఒక్కరినీ దేవుడు ఎన్నుకోలేదనే సమగ్ర నిరాకరణను సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నిలిపాం. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా గుర్తుపట్టదగిన లిప్యంతరీకరణ; మూల ఉచ్చారణను సూచించేందుకు ‘యాహ్వే’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. కారణార్థక క్రియను స్పష్టంగా ఉంచి, ‘వీరిలో ఎవరినీ’ ద్వారా హీబ్రూ సందర్భంలోని సమగ్ర నిరాకరణను సహజంగా తెలిపాం.
