source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת קֶ֣רֶן הַ/שֶּׁ֗מֶן וַ/יִּמְשַׁ֣ח אֹת/וֹ֮ בְּ/קֶ֣רֶב אֶחָי/ו֒ וַ/תִּצְלַ֤ח רֽוּחַ יְהוָה֙ אֶל דָּוִ֔ד מֵ/הַ/יּ֥וֹם הַ/ה֖וּא וָ/מָ֑עְלָ/ה וַ/יָּ֣קָם שְׁמוּאֵ֔ל וַ/יֵּ֖לֶךְ הָ/רָמָֽתָ/ה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
translation:
  language: te
  text: అప్పుడు సమూయేలు నూనె కొమ్మును తీసుకొని, అతని సోదరుల మధ్య అతనికి అభిషేకం చేశాడు. ఆ రోజు మొదలుకొని యెహోవా ఆత్మ దావీదు మీదికి శక్తివంతంగా వచ్చింది[a]. తరువాత సమూయేలు లేచి రామాకు వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు మీదికి దూసుకొచ్చింది.” ఇక్కడి హీబ్రూ క్రియ ఆత్మ బలంగా వచ్చి సామర్థ్యమివ్వడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: నూనె కొమ్ము
  rationale: קֶרֶן అంటే అక్షరార్థంగా ‘కొమ్ము’; ఇక్కడ నూనె ఉంచే జంతు కొమ్ముతో చేసిన పాత్రను సూచిస్తుంది. ‘నూనె కొమ్ము’ మూలంలోని స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: וַיִּמְשַׁח
  choice: అభిషేకం చేశాడు
  rationale: משׁח ఆచారపూర్వకంగా నూనెతో అభిషేకించే ప్రామాణిక క్రియ. ఈ ఎంపిక భౌతిక కార్యాన్నీ దాని రాజసంబంధమైన ప్రాధాన్యాన్నీ నిలుపుతుంది.
- source_word: בְּקֶרֶב אֶחָיו
  choice: అతని సోదరుల మధ్య
  rationale: בקרב అంటే ‘మధ్యలో/మధ్య’; אֶחָיו సందర్భంలో దావీదు సోదరులను సూచిస్తుంది. మూలపాఠం చెప్పిన కుటుంబ సమక్షాన్ని దీనికి మించి విస్తరించకుండా వ్యక్తం చేస్తుంది.
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  choice: యెహోవా ఆత్మ దావీదు మీదికి శక్తివంతంగా వచ్చింది
  rationale: צלח + רוח יהוה సమూయేలు గ్రంథాల్లో ఆత్మ బలప్రదంగా రావడాన్ని సూచిస్తుంది. తెలుగులో ‘దూసుకొచ్చింది’ అనేది అనవసరమైన హింసాత్మక ఛాయ ఇవ్వవచ్చు; ‘శక్తివంతంగా వచ్చింది’ బలప్రదమైన రాకను సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో నిలుపుతుంది.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: ఆ రోజు మొదలుకొని
  rationale: ఈ పదబంధం ఆ రోజున ప్రారంభమైన కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘ఆ రోజు మొదలుకొని’ ఆధునిక తెలుగులో సహజంగా ఆ కాలబలాన్ని అందిస్తుంది.
- source_word: וַיָּקָם
  choice: లేచి
  rationale: కథన క్రమంలో קום తదుపరి చర్యకు లేచి బయలుదేరడాన్ని సూచిస్తుంది; ‘లేచి’ సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: הָרָמָתָה
  choice: రామాకు
  rationale: చివరి దిశాసూచక ה ఆ స్థలంవైపు కదలికను తెలియజేస్తుంది; అందువల్ల ‘రామాకు వెళ్లాడు’ సరైన సహజ రూపం.
theological_decisions:
- issue: רוּחַ יְהוָה యొక్క అర్థం మరియు లిపిరూపం
  choice: యెహోవా ఆత్మ
  alternative: యెహోవా యొక్క ఆత్మ/ప్రాణవాయువు
  rationale: ఈ కథన సందర్భంలో ఇది దావీదును బలపరుస్తూ పనిచేసే దేవుని ఆత్మను సూచిస్తుంది. తెలుగులో పెద్ద/చిన్న అక్షరాల భేదం లేకపోవడం వల్ల ఇంగ్లీషులోని capitalization సమస్యను కృత్రిమంగా పరిష్కరించాల్సిన అవసరం లేదు; పదబంధాన్ని నేరుగా నిలుపుతున్నాం.
- issue: దావీదు అభిషేకం జరిగిన సమక్షం
  choice: అతని సోదరుల మధ్య
  alternative: అతని కుటుంబం సమక్షంలో వ్యక్తిగతంగా
  rationale: పాఠం స్పష్టంగా అతని సోదరుల మధ్య అని మాత్రమే చెబుతుంది. దాని బహిరంగత లేదా రాజకీయ గుర్తింపు ఎంతవరకు ఉన్నదో అనువాదం అదనంగా నిర్ణయించదు.
- issue: צלח క్రియలోని బలప్రదమైన భావం
  choice: శక్తివంతంగా వచ్చింది
  alternative: దావీదు మీదికి దూసుకొచ్చింది
  rationale: మూలక్రియలోని బలమైన, సామర్థ్యమిచ్చే రాకను ప్రధాన పాఠ్యంలో సహజమైన తెలుగులో వ్యక్తం చేశాం; మరింత సజీవమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలి. ‘నూనె కొమ్ము’ అనే స్పష్టమైన మూలచిత్రం, ‘అభిషేకం’ అనే స్థిరమైన ఆచారపదం నిలుపబడ్డాయి. తెలుగు లిపిలో capitalization లేకపోవడం వల్ల רוּחַ యొక్క వ్యాఖ్యానభేదానికి ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
