  text: וַ/יָּבֹ֤א דָוִד֙ אֶל שָׁא֔וּל וַֽ/יַּעֲמֹ֖ד לְ/פָנָ֑י/ו וַ/יֶּאֱהָבֵ֣/הֽוּ מְאֹ֔ד וַֽ/יְהִי ל֖/וֹ נֹשֵׂ֥א כֵלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/021.yaml
  text: So David came to Saul and stood before him[a], and Saul loved him greatly, and he became his armor-bearer.
translation:
  language: te
  text: దావీదు సౌలు దగ్గరకు వచ్చి అతని ఎదుట నిలిచాడు. సౌలు అతన్ని ఎంతో ప్రేమించాడు; అతడు సౌలుకు ఆయుధాలు మోసేవాడయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని యుద్ధ సామగ్రి మోసేవాడయ్యాడు.” హీబ్రూ పదబంధం అక్షరార్థంగా సైనిక సామగ్రిని మోసే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: దగ్గరికి వచ్చి
  rationale: בוא అనేది ఇక్కడ సౌలు వైపు రావడాన్ని సూచిస్తుంది; אֶל־שָׁאוּל‌తో కలిసి ‘సౌలు దగ్గరికి వచ్చి’ సహజమైన తెలుగు.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: అతని ఎదుట సేవలో నిలిచాడు
  rationale: ‘ఎదుట నిలుచుట’ అనే హీబ్రూ రూపకాన్ని ఉంచుతూనే, రాజసభలో హాజరై సేవచేసే భావాన్ని ‘సేవలో’ స్పష్టం చేస్తుంది.
- source_word: וַיֶּאֱהָבֵהוּ מְאֹד
  choice: సౌలు అతన్ని ఎంతో ప్రేమించాడు
  rationale: సందర్భం ప్రకారం క్రియకు కర్త సౌలు; אהב + מאד బలమైన ప్రేమను లేదా అభిమానాన్ని తెలియజేస్తుంది. అస్పష్ట సర్వనామం రాకుండా పేరును పునరుక్తి చేశాం.
- source_word: וַיְהִי לוֹ
  choice: అతని … అయ్యాడు
  rationale: ఈ నిర్మాణం ఏర్పడిన కొత్త స్థితిని లేదా నియామకాన్ని సూచిస్తుంది; తెలుగులో ‘అయ్యాడు’ సహజంగా ఆ ఫలితాన్ని వ్యక్తం చేస్తుంది.
- source_word: נֹשֵׂא כֵלִים
  choice: ఆయుధాలు మోసేవాడు
  rationale: పదబంధం అక్షరార్థంగా సైనిక సామగ్రి లేదా ఆయుధాలు మోసే వ్యక్తిని సూచిస్తుంది. ఆధునిక సాధారణ పాఠకునికి ‘కవచధారి’ కంటే ఇది స్పష్టంగా ఉంటుంది; సామగ్రి అనే విస్తృత అర్థాన్ని పాదటిప్పణి తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. రాజసేవ భావాన్ని తెలిపేందుకు ‘సేవలో నిలిచాడు’ అని, సాంకేతికంగా లేదా పాతకాలపు పదంగా అనిపించగల ‘కవచధారి’కి బదులుగా ‘ఆయుధాలు మోసేవాడు’ అని అనువదించబడింది.
