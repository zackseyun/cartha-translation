  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: The Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
translation:
  language: te
  text: యెహోవా ఆత్మ సౌలును విడిచిపోయింది; యెహోవా నుండి వచ్చిన ఒక దుష్టాత్మ[a] అతన్ని భయభ్రాంతులకు గురిచేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హానికరమైన ఆత్మ,’ లేదా ‘బాధ కలిగించే ఆత్మ.’ ఇక్కడి హీబ్రూ విశేషణం నైతికంగా చెడ్డదానినే కాకుండా, ప్రభావంలో హానికరమైనదాన్ని లేదా విపత్తు కలిగించేదాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: యెహోవా ఆత్మ
  rationale: רוּחַకు ‘ఆత్మ,’ ‘గాలి,’ ‘ఊపిరి’ అనే అర్థాలు ఉండవచ్చు. ఈ కథన సందర్భంలో సౌలుకు ముందుగా అనుగ్రహించబడిన దేవుని శక్తినిచ్చే సన్నిధిని సూచిస్తున్నందున ‘ఆత్మ’ సహజమైన ఎంపిక. יהוה అనే దైవనామాన్ని ‘యెహోవా’గా ప్రత్యక్షంగా ఉంచాం.
- source_word: סָרָה מֵעִם
  choice: విడిచిపోయింది
  rationale: סוּר అంటే పక్కకు తొలగడం, వెళ్లిపోవడం, విడిచిపెట్టడం. מֵעִםతో కలిసినప్పుడు సౌలుతో ఉన్న ఆత్మసన్నిధి తొలగిపోయిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగులో స్థిరపడిన బైబిలు వ్యక్తినామ రూపం.
- source_word: וּבִעֲתַתּוּ
  choice: అతన్ని భయభ్రాంతుణ్ణి చేసింది
  rationale: בעת తీవ్రమైన భయం లేదా దిగ్భ్రాంతి కలిగించడాన్ని సూచిస్తుంది. ‘వేధించింది’ అనేది సందర్భానుసారంగా సాధ్యమైనా, మూలపదంలోని భయార్థాన్ని ఈ అనువాదం స్పష్టంగా నిలుపుతుంది.
- source_word: רוּחַ רָעָה
  choice: ఒక దుష్టాత్మ
  rationale: רָעָה నైతికంగా చెడ్డదనే భావంతో పాటు హానికరమైనది లేదా విపత్తు కలిగించేది అనే భావాన్నీ ఇవ్వగలదు. ప్రధాన పాఠంలో నేరుగా ‘దుష్టాత్మ’ అని ఉంచి, ఇతర సాధ్యమైన భావాలను పాదసూచికలో ఇచ్చాం.
- source_word: מֵאֵת יְהוָה
  choice: యెహోవా నుండి వచ్చిన
  rationale: מֵאֵת మూలం లేదా ఉద్భవాన్ని, ‘నుండి’ అనే భావాన్ని సూచిస్తుంది. ‘యెహోవా పంపిన’ అని అనడం మూలంలో స్పష్టంగా లేని క్రియను చేర్చుతుంది; అందువల్ల ‘యెహోవా నుండి వచ్చిన’ అని అనువదించాం.
theological_decisions:
- issue: బాధ కలిగించే ఆత్మకు యెహోవాయే మూలమని చెప్పే వాక్యాన్ని మృదువుచేయకుండా ఎలా అనువదించాలి
  choice: యెహోవా నుండి వచ్చిన ఒక దుష్టాత్మ
  alternative: యెహోవా నుండి వచ్చిన ఒక హానికరమైన లేదా బాధ కలిగించే ఆత్మ; యెహోవా పంపిన ఒక దుష్టాత్మ
  rationale: హీబ్రూ పాఠం ఆ ఆత్మ యెహోవా నుండి వచ్చిందని స్పష్టంగా చెబుతుంది. ఆ వేదాంతపరమైన ఉద్రిక్తతను తొలగించకుండా ప్రధాన పాఠంలో నిలిపాం. అయితే רָעָהకు హానికరమైనది లేదా బాధ కలిగించేది అనే అర్థాలు కూడా ఉండగలవని పాదసూచికలో తెలిపాం. ‘పంపిన’ అనేది సాధ్యమైన వ్యాఖ్యానం అయినా మూలపాఠం కంటే ఎక్కువ స్పష్టీకరణ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించాం. మూలంలో ప్రత్యేక కాలసూచక పదం లేనందున వాక్యారంభంలో ‘ఇప్పుడు’ చేర్చలేదు. రెండు సమన్వయ వాక్యభాగాలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం.
