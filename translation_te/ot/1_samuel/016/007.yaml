revisions:
- from: 'అయితే యెహోవా సమూయేలుతో ఇలా అన్నాడు: “అతని రూపాన్ని గానీ, అతని ఎత్తైన దేహాన్ని గానీ చూడకు; ఎందుకంటే నేను అతన్ని తిరస్కరించాను. మనిషి చూసినట్లు కాదు[a]; మనిషి కళ్లకు కనిపించేదాన్ని చూస్తాడు[b], కానీ యెహోవా హృదయాన్ని చూస్తాడు.”'
  to: 'అయితే యెహోవా సమూయేలుతో ఇలా అన్నాడు: “అతని రూపాన్ని గానీ, అతని ఎత్తును గానీ చూడకు; ఎందుకంటే నేను అతనిని తిరస్కరించాను. ఎందుకంటే యెహోవా మనిషి చూసినట్లు చూడడు: మనిషి కళ్లకు కనిపించేదానిని చూస్తాడు, కానీ యెహోవా హృదయాన్ని చూస్తాడు.”'
  rationale: The revision resolves the Telugu fragment by stating the subject already supplied by the Hebrew context, while retaining the human-versus-Yahweh contrast and the imagery of eyes and heart. It also replaces an awkward expression for stature with natural modern Telugu. No footnotes are necessary after this clarification.
  reviewer_model: gpt-5.6-terra
