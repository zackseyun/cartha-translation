reference: 1 Samuel 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל אַל תַּבֵּ֧ט אֶל מַרְאֵ֛/הוּ וְ/אֶל גְּבֹ֥הַּ קוֹמָת֖/וֹ כִּ֣י מְאַסְתִּ֑י/הוּ כִּ֣י לֹ֗א אֲשֶׁ֤ר יִרְאֶה֙ הָ/אָדָ֔ם כִּ֤י הָֽ/אָדָם֙ יִרְאֶ֣ה לַ/עֵינַ֔יִם וַ/יהוָ֖ה יִרְאֶ֥ה לַ/לֵּבָֽב־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
translation:
  language: te
  text: 'అయితే యెహోవా సమూయేలుతో ఇలా అన్నాడు: “అతని రూపాన్ని గానీ, అతని ఎత్తును గానీ చూడకు; ఎందుకంటే నేను అతనిని తిరస్కరించాను. ఎందుకంటే యెహోవా మనిషి చూసినట్లు చూడడు: మనిషి కళ్లకు కనిపించేదానిని చూస్తాడు, కానీ యెహోవా హృదయాన్ని చూస్తాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: תַּבֵּט
  choice: చూడకు
  rationale: బాహ్య లక్షణాలపై దృష్టి నిలపవద్దనే నిషేధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַרְאֵהוּ
  choice: అతని రూపం
  rationale: కంటికి కనిపించే బాహ్య రూపాన్ని సూచిస్తుంది; తరువాతి ఎత్తు ప్రస్తావనతో సహజంగా జతకడుతుంది.
- source_word: גְּבֹהַּ קוֹמָתוֹ
  choice: అతని ఎత్తైన దేహం
  rationale: శరీరపు పొడవు లేదా ఎత్తును సూచించే హెబ్రీ పదబంధాన్ని సాధారణ పాఠకునికి స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: מְאַסְתִּיהוּ
  choice: నేను అతన్ని తిరస్కరించాను
  rationale: రాజుగా ఎంపిక చేయడానికి అనర్హుడిగా నిరాకరించడమే సందర్భార్థం; ‘తిరస్కరించాను’ దాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאָדָם
  choice: మనిషి
  rationale: ఇక్కడ ఒక వ్యక్తిని కాక మానవుల సాధారణ దృష్టిని సూచించే ఏకవచన సామాన్య ప్రయోగం.
- source_word: לֹא אֲשֶׁר יִרְאֶה הָאָדָם
  choice: మనిషి చూసినట్లు కాదు
  rationale: మూలంలోని ఉద్దేశపూర్వకంగా సంక్షిప్తమైన వాక్య నిర్మాణాన్ని అనవసరంగా పూరించకుండా నిలుపుతుంది; దేవుని దృష్టి మానవ దృష్టికి భిన్నమనే భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: לַעֵינַיִם
  choice: కళ్లకు కనిపించేది
  rationale: అక్షరార్థమైన ‘కళ్లకు’ అనే దృశ్యరూపాన్ని కాపాడుతూ సహజమైన తెలుగులో అర్థాన్ని తెలియజేస్తుంది.
- source_word: לַלֵּבָב
  choice: హృదయం
  rationale: ఆలోచన, సంకల్పం, స్వభావం కలిగిన అంతరంగ కేంద్రాన్ని సూచించే సంప్రదాయబద్ధమైన, విస్తృతార్థక తెలుగు పదం.
theological_decisions:
- issue: మానవ దృష్టి మరియు యెహోవా దృష్టి మధ్య వ్యత్యాసం
  choice: “మనిషి చూసినట్లు కాదు; మనిషి కళ్లకు కనిపించేదాన్ని చూస్తాడు, కానీ యెహోవా హృదయాన్ని చూస్తాడు”
  alternative: “యెహోవా మనిషి చూసినట్లు చూడడు”
  rationale: హెబ్రీ వాక్యం ‘మనిషి చూసేది కాదు’ అనే సంక్షిప్త, కొంత అసంపూర్ణ నిర్మాణంలో ఉంది. యెహోవాను మొదటి భాగంలో స్పష్టంగా చేర్చడం సాధ్యమైన వివరణ అయినప్పటికీ, మూలంలోని అస్పష్టతను కాపాడటానికి సంక్షిప్త రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే శైలి. హెబ్రీ సమాంతరతను నిలుపుతూ, ‘రూపం—కళ్లకు కనిపించేది—హృదయం’ అనే బాహ్య/అంతరంగ వ్యత్యాసాన్ని స్పష్టంగా ఉంచాం.
