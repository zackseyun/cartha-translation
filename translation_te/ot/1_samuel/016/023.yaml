base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/023.yaml
  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
translation:
  language: te
  text: దేవుని ఆత్మ సౌలుమీదికి వచ్చినప్పుడల్లా, దావీదు కిన్నోరు[a] తీసుకొని తన చేతితో వాయించేవాడు. అప్పుడు సౌలుకు ఉపశమనం కలిగేది, అతడు కుదుటపడేవాడు; హానికరమైన ఆత్మ[b] అతని మీదినుంచి తొలగిపోయేది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కిన్నోరు’ అనేది ప్రాచీన తంతివాద్యం. అది ఆధునిక హార్పు కంటే లైర్‌ను పోలి ఉండి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చెడు ఆత్మ.’ హీబ్రూ పదం నైతికంగా చెడ్డదానినీ, హాని లేదా బాధ కలిగించేదానినీ సూచించగలదు; ఇక్కడ సౌలును బాధించే ప్రభావం ప్రధానంగా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: మొదటి భాగంలో హీబ్రూ పాఠం ‘దేవుని ఆత్మ’ అని, చివరి భాగంలో ‘హానికరమైన ఆత్మ’ అని చెబుతుంది. ఈ అనువాదం ఆ రెండు వ్యక్తీకరణలను ఒకేలా మార్చకుండా వాటి భేదాన్ని నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  choice: వచ్చినప్పుడల్లా
  rationale: היה + infinitive construct ఇక్కడ పునరావృతమయ్యే సందర్భాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వచ్చినప్పుడల్లా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: רוּחַ אֱלֹהִים
  choice: దేవుని ఆత్మ
  rationale: హీబ్రూ పాఠంలో ఉన్న మాటలను నేరుగా నిలుపుతుంది; సమీప వచనాల నుంచి ‘హానికరమైన’ లేదా ‘చెడు’ అనే విశేషణాన్ని ఇక్కడికి దిగుమతి చేయదు.
- source_word: אֶל שָׁאוּל
  choice: సౌలుమీదికి వచ్చిన
  rationale: ఈ కథన సందర్భంలో ఆత్మ సౌలును ప్రభావితం చేయడం ప్రారంభించిన భావాన్ని ‘మీదికి వచ్చిన’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַכִּנּוֹר
  choice: కిన్నోరు
  rationale: ఇది ప్రాచీన తంతివాద్యానికి హీబ్రూ పేరు. ఆధునిక హార్పుతో తప్పుగా సమీకరించకుండా మూలపదాన్ని లిప్యంతరీకరించి, పాదసూచికలో వివరణ ఇచ్చాం.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: తన చేతితో వాయించేవాడు
  rationale: נגן తంతివాద్యాన్ని వాయించడాన్ని సూచిస్తుంది; ‘తన చేతితో’ మూలంలోని స్పష్టమైన వ్యక్తీకరణను నిలుపుతుంది.
- source_word: וְרָוַח לְשָׁאוּל
  choice: సౌలుకు ఉపశమనం కలిగి
  rationale: רוּחַ/רוח మూలానికి సంబంధించిన ఈ క్రియ ఇక్కడ బాధ నుంచి ఊరట లేదా విరామం కలగడాన్ని సూచిస్తుంది.
- source_word: וְטוֹב לוֹ
  choice: అతడు కుదుటపడేవాడు
  rationale: అతని పరిస్థితి మెరుగుపడిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం భావోద్వేగానికి పరిమితం చేయదు.
- source_word: רוּחַ הָרָעָה
  choice: హానికరమైన ఆత్మ
  rationale: רָעָה అనే పదం నైతిక చెడునూ, హాని లేదా బాధ కలిగించే స్వభావాన్నీ సూచించగలదు. ఈ సందర్భంలో సౌలుపై కలిగే బాధాకర ప్రభావాన్ని ముందుకు తెస్తూ, ఆ ఆత్మ నైతిక స్వరూపంపై అవసరానికి మించిన నిర్ణయం చేయదు.
- source_word: וְסָרָה מֵעָלָיו
  choice: అతని మీదినుంచి తొలగిపోయేది
  rationale: סור ఇక్కడ దూరమవడం లేదా తొలగిపోవడాన్ని సూచిస్తుంది; పునరావృత కథన రూపానికి అనుగుణంగా ‘తొలగిపోయేది’ వాడాం.
theological_decisions:
- issue: మొదటి భాగంలోని רוּחַ אֱלֹהִים ను చివరి భాగంలోని רוּחַ הָרָעָה తో ఎలా సంబంధపరచాలి
  choice: మొదటి దానిని ‘దేవుని ఆత్మ’గా, తరువాతిదానిని ‘హానికరమైన ఆత్మ’గా అనువదించి, హీబ్రూలోని పదభేదాన్ని నిలుపడం
  alternative: మొదటి దానిని సందర్భానుసారంగా ‘దేవుని నుండి వచ్చిన హానికరమైన ఆత్మ’గా సమన్వయపరచడం, లేదా చివరి దానిని ‘చెడు ఆత్మ’గా అనువదించడం
  rationale: హీబ్రూ వచనం రెండు చోట్ల భిన్నమైన పదబంధాలను ఉపయోగిస్తుంది. వాటిని ఒకేలా మార్చకుండా ఉంచడం మూలపాఠంలోని ఉత్కంఠను, అస్పష్టతను కాపాడుతుంది; ‘హానికరమైన’ అనేది నైతిక స్వరూపంపై అనవసరమైన సిద్ధాంత నిర్ణయం చేయకుండా సందర్భంలోని బాధాకర ప్రభావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. పునరావృత చర్యలను ‘వచ్చినప్పుడల్లా/వాయించేవాడు/తొలగిపోయేది’ రూపాలతో స్పష్టపరిచాం. ప్రాచీన వాద్యానికి మూలపేరును ఉంచి పాదసూచికలో వివరణ ఇచ్చాం.
