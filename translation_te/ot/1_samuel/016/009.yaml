  yaml_path: translation/ot/1_samuel/016/009.yaml
  text: Then Jesse made Shammah pass by, and he said, “Yahweh has not chosen this one either.”
translation:
  language: te
  text: తర్వాత యెష్షయి షమ్మాను ముందుకు రప్పించాడు. అప్పుడు సమూయేలు, “యాహ్వే ఈయనను కూడా ఎన్నుకోలేదు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: ముందుకు రప్పించాడు
  rationale: עבר హిఫీల్ రూపంలోని కారక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; యెష్షయి షమ్మాను సమూయేలు ఎదుటికి వచ్చేలా చేశాడనే భావం నిలుస్తుంది.
- source_word: יִשַׁי
  choice: యెష్షయి
  rationale: హీబ్రూ వ్యక్తిపేరు יִשַׁיకి తెలుగు లిప్యంతరీకరణ.
- source_word: שַׁמָּה
  choice: షమ్మా
  rationale: హీబ్రూ వ్యక్తిపేరు שַׁמָּהలోని ద్విత్వ మ ధ్వనిని నిలిపే తెలుగు లిప్యంతరీకరణ.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ... అన్నాడు
  rationale: మూలంలో కర్త సర్వనామంగానే సూచించబడింది. సందర్భంలో అది సమూయేలు అయినప్పటికీ, మూలపాఠానికి మించి పేరును చేర్చకుండా సహజంగా ఉంచబడింది.
- source_word: גַּם בָּזֶה
  choice: ఇతణ్ణి కూడా
  rationale: గతంలో పరిశీలించిన కుమారులకు ఇతణ్ణి జోడించే גַּם భావాన్ని ‘కూడా’ తెలియజేస్తుంది; בָּזֶה ఇక్కడ పరిశీలనలో ఉన్న పురుషుణ్ణి సూచిస్తుంది.
- source_word: לֹא בָחַר
  choice: ఎన్నుకోలేదు
  rationale: בחר యొక్క ‘ఎంచుకొను/ఎన్నుకొను’ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన వ్యక్తినామ రూపంలో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించేందుకు ఉపయోగించే ప్రత్యామ్నాయ లిప్యంతరీకరణ.
- issue: וַיֹּאמֶר లోని వక్త గుర్తింపు
  choice: అతడు
  alternative: సమూయేలు
  rationale: సందర్భం వక్త సమూయేలు అని సూచించినా, హీబ్రూ వాక్యం పేరును పునరుక్తి చేయదు. అందువల్ల మూలంలోని సూచనాత్మక అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ కారక క్రియను కృత్రిమ పదానువాదంగా కాకుండా ‘ముందుకు రప్పించాడు’ అని సహజంగా వ్యక్తం చేశాం.
