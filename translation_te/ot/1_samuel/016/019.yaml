  yaml_path: translation/ot/1_samuel/016/019.yaml
  text: So Saul sent messengers to Jesse and said[a], “Send me your son David, who is with the flock.”
translation:
  language: te
  text: అప్పుడు సౌలు యెష్షయి దగ్గరికి సందేశకులను పంపి, “మందతో ఉన్న నీ కుమారుడైన దావీదును నా దగ్గరికి పంపు[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మందలో ఉన్న.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపి
  rationale: שׁלח క్రియ యొక్క కథన రూపం గతంలో జరిగిన సాధారణ చర్యను సూచిస్తుంది; వరుస కథన ప్రవాహంలో ‘పంపి’ సహజంగా ఉంటుంది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఇక్కడ మానవ సందేశవాహకులను సూచిస్తుంది. ‘దూతలు’ ఆధునిక తెలుగు బైబిలు శైలిలో పారదర్శకమైన పదం; సందర్భం వీరు దేవదూతలు కాదని స్పష్టం చేస్తుంది.
- source_word: אֶל יִשָׁי
  choice: యెష్షయి దగ్గరికి
  rationale: אֶל దిశను సూచిస్తుంది; వ్యక్తి వద్దకు పంపడాన్ని తెలుగులో ‘దగ్గరికి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అని చెప్పాడు
  rationale: אמר నేరుగా పలికిన మాటను పరిచయం చేస్తుంది; తెలుగు ఉద్ధరణ నిర్మాణంలో ‘అని చెప్పాడు’ సహజమైన సమానం.
- source_word: שִׁלְחָה אֵלַי
  choice: నా దగ్గరికి పంపు
  rationale: ఆజ్ఞార్థక שׁלח మరియు אֵלַי లోని దిశాభావం రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: אֶת דָּוִד בִּנְךָ
  choice: నీ కుమారుడు దావీదును
  rationale: దావీదు అనే ప్రత్యక్ష కర్మను, בִּנְךָ సూచించే యెష్షయితోని కుమార సంబంధాన్ని సహజ తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: אֲשֶׁר בַּצֹּאן
  choice: మంద దగ్గర ఉన్న
  rationale: צֹאן గొర్రెలు/మేకల చిన్న పశువుల మందను సూచించగల సమూహపదం. בְּ యొక్క స్థలసంబంధ భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘మంద దగ్గర’గా ఇచ్చాం.
