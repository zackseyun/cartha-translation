translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మంద’ అనే పదం צֹאן యొక్క సమూహార్థాన్ని నిలుపుతుంది. ప్రధాన పాఠంలోని ‘దగ్గర’ మరియు పాదసూచికలోని ‘మందలో’ అనే ప్రత్యామ్నాయం בַּצֹּאן లోని స్థలసంబంధ అస్పష్టతను ప్రతిబింబిస్తాయి.
