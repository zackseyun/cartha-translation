id: 1SA.16.8
reference: 1 Samuel 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א יִשַׁי֙ אֶל אֲבִ֣ינָדָ֔ב וַ/יַּעֲבִרֵ֖/הוּ לִ/פְנֵ֣י שְׁמוּאֵ֑ל וַ/יֹּ֕אמֶר גַּם בָּ/זֶ֖ה לֹֽא בָחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
translation:
  language: te
  text: అప్పుడు యెష్షయి అబీనాదాబును పిలిచి, అతనిని సమూయేలు ఎదుటుగా వెళ్లేలా చేశాడు. ఆయన, “యాహ్వే ఇతనిని కూడా ఎన్నుకోలేదు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא יִשַׁי אֶל אֲבִינָדָב
  choice: యెష్షయి అబీనాదాబును పిలిచి
  rationale: קרא ఇక్కడ ఒకరిని పిలవడం అనే సాధారణ భావాన్ని ఇస్తుంది. אֶל తెలుగులో సకర్మక నిర్మాణంలో సహజంగా కర్మవిభక్తితో వ్యక్తమవుతుంది.
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  choice: సమూయేలు ఎదుటగా అతణ్ణి వెళ్లేలా చేశాడు
  rationale: עבר హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతూ, యెష్షయి అబీనాదాబు సమూయేలు ఎదుటగా వెళ్లేలా చేశాడని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: וַיֹּאמֶר
  choice: ఆయన ... అన్నాడు
  rationale: హీబ్రూలో కర్త స్పష్టంగా చెప్పబడలేదు. తెలుగులో గౌరవప్రదమైన సర్వనామాన్ని వాడి ఆ అనిశ్చితిని నిలిపాం; సందర్భం దానిని సమూయేలుతో అనుసంధానిస్తుంది.
- source_word: גַּם בָּזֶה
  choice: ఇతణ్ణి కూడా
  rationale: నిషేధ వాక్యంలో గַּם యొక్క సంకలనార్థాన్ని తెలుగులో ‘కూడా’ సహజంగా వ్యక్తం చేస్తుంది; בָּזֶה వ్యక్తిని సూచిస్తున్నందున ‘ఇతణ్ణి’ అని ఇచ్చాం.
- source_word: לֹא בָחַר
  choice: ఎన్నుకోలేదు
  rationale: בחר ఇక్కడ రాజుగా ఎంపిక చేయడాన్ని సూచిస్తుంది. తెలుగు భూతకాల నిషేధరూపం నిర్ణయ ఫలితాన్ని సందర్భానుగుణంగా సహజంగా తెలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచడం మూలరూపాన్ని గౌరవిస్తుంది; ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణగా ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: וַיֹּאמֶר లో అంతర్నిహిత కర్త
  choice: ఆయన
  alternative: సమూయేలు
  rationale: సందర్భం సమూయేలును సూచించినా, హీబ్రూ వాక్యం పేరును పునరుక్తి చేయదు. అందువల్ల పేరును చేర్చి మూలంలోని సూచనాత్మకతను పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. కారణార్థక క్రియను స్పష్టంగా ఉంచి, మూలంలోని అంతర్నిహిత కర్తను అతిగా వివరించలేదు.
