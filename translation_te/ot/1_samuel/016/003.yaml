base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/003.yaml
  text: Invite Jesse to the sacrifice[a], and I will make known to you what you shall do[c][b]; and you shall anoint for me the one whom I tell you.
translation:
  language: te
  text: యెష్షయిని బలి అర్పణకు ఆహ్వానించు[a], నీవు ఏమి చేయాలో నేను నీకు తెలియజేస్తాను[b]; నేను నీకు చెప్పే వ్యక్తిని నా కోసం అభిషేకించు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెష్షయిని బలి అర్పణ కోసం పిలువు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీవు చేయవలసినదాన్ని నేను నీకు చూపిస్తాను.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నేను నీకు ఎవరిని చెబుతానో అతనిని నా కోసం అభిషేకించు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָאתָ לְיִשַׁי
  choice: యెష్షయిని ... ఆహ్వానించు
  rationale: కרא అనే క్రియ ఈ బలి సందర్భంలో ఒకరిని కార్యక్రమానికి పిలవడం లేదా ఆహ్వానించడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘ఆహ్వానించు’ సహజంగా ఉంది; ఆజ్ఞార్థక బలాన్నీ నిలుపుతుంది.
- source_word: בַּזָּבַח
  choice: బలి అర్పణకు
  rationale: זבח ఇక్కడ బలి అర్పించే కార్యాన్నీ, ఆ సందర్భాన్నీ సూచించగలదు. ‘బలి అర్పణకు’ అనే రూపం యెష్షయి ఆ సందర్భంలో పాల్గొనడానికి పిలువబడుతున్నాడనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְאָנֹכִי אוֹדִיעֲךָ
  choice: నేను నీకు తెలియజేస్తాను
  rationale: ידע హిఫీల్ రూపానికి ‘తెలియజేయడం’ అనే causative భావం ఉంది. స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు వాక్యంలోని స్పష్టమైన ‘నేను’ నిలుపుతుంది.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: నీవు ఏమి చేయాలో
  rationale: ఈ సంబంధవాచక వాక్యభాగం సమూయేలు చేయవలసిన కార్యాన్ని సూచిస్తుంది. ‘ఏమి చేయాలో’ ఆధునిక తెలుగులో సహజంగా ఉండి, సూచనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: וּמָשַׁחְתָּ
  choice: అభిషేకించు
  rationale: משׁח ప్రతిష్ఠాపన సంబంధమైన అభిషేకానికి ప్రామాణిక క్రియ. సందర్భంలో రాజాభిషేక భావం ఉన్నప్పటికీ, వచనం పేర్కొనని ‘రాజుగా’ అనే పదాన్ని చేర్చలేదు.
- source_word: לִי
  choice: నా కోసం
  rationale: ఈ కార్యం దేవుని తరఫున, ఆయన ఉద్దేశం కోసం జరుగుతుందనే దత్తివాచక భావాన్ని ‘నా కోసం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: నేను నీకు ఎవరి గురించి చెబుతానో అతనిని
  rationale: హీబ్రూ వాక్యం దేవుడు సూచించే వ్యక్తిని సంబంధవాచక నిర్మాణంతో గుర్తిస్తుంది. ‘ఎవరి గురించి చెబుతానో అతనిని’ అనేది వ్యక్తిని దేవుడే నిర్దేశిస్తాడనే భావాన్ని, ‘పేరు చెబుతాను’ వంటి అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: అభిషేక స్వరూపం
  choice: వచనంలో ఉన్నట్లే ‘అభిషేకించు’ అని ఉంచి, పదవిని స్పష్టంగా పేర్కొనకపోవడం
  alternative: ‘రాజుగా అభిషేకించు’ అని సందర్భార్థాన్ని వచనంలోనే చేర్చడం
  rationale: సమీప కథన సందర్భం రాజాభిషేకాన్ని సూచించినా, ఈ వచనం స్వయంగా ఆ పదవిని పేర్కొనదు. అందువల్ల కథన సందర్భమే ఆ భావాన్ని అందించనివ్వడం మూలపాఠానికి నిష్ఠగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని ఆజ్ఞార్థక భావం, దేవుని స్వీయ ఉద్ఘాటన, అభిషేకంలోని ఉద్దేశ్యార్థం నిలుపబడ్డాయి. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
