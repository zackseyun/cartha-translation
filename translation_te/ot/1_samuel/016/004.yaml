id: 1SA.16.4
reference: 1 Samuel 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁמוּאֵ֗ל אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה וַ/יָּבֹ֖א בֵּ֣ית לָ֑חֶם וַ/יֶּחֶרְד֞וּ זִקְנֵ֤י הָ/עִיר֙ לִ/קְרָאת֔/וֹ וַ/יֹּ֖אמֶר שָׁלֹ֥ם בּוֹאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
translation:
  language: te
  text: సమూయేలు యాహ్వే చెప్పినది చేసి బేత్లెహేముకు వచ్చాడు. అతన్ని ఎదుర్కొనడానికి పట్టణపు పెద్దలు వణికిపోయారు[a]. వారు, “నీ రాక క్షేమమా?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టణపు పెద్దలు అతని రాకకు వణికిపోయారు.”
    reason: לִקְרָאתוֹ సాధారణంగా ‘అతన్ని ఎదుర్కొనడానికి/కలుసుకోవడానికి’ అని అర్థమిస్తుంది; సందర్భంలో ‘అతని రాకకు’ అనే భావప్రకటన కూడా సాధ్యమే.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేసి
  rationale: కథన క్రమంలో עשה యొక్క సాధారణ అర్థాన్ని సహజంగా తెలియజేస్తూ, సమూయేలు విధేయతను అతిగా వ్యాఖ్యానించకుండా ఉంచుతుంది.
- source_word: אֵת אֲשֶׁר דִּבֶּר יְהוָה
  choice: యెహోవా చెప్పినదాన్ని
  rationale: דִּבֶּר అనే ‘మాట్లాడు/చెప్పు’ భావాన్ని నిలుపుతుంది; ‘ఆజ్ఞాపించినదాన్ని’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని భావం చేరుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: וַיָּבֹא בֵּית לָחֶם
  choice: బేత్లెహేముకు వచ్చాడు
  rationale: בוא యొక్క సందర్భోచిత భావాన్ని సహజమైన తెలుగు కథన శైలిలో అందిస్తుంది.
- source_word: וַיֶּחֶרְדוּ
  choice: వణుకుతూ వచ్చి
  rationale: חרד సూచించే భయంతో కూడిన శారీరక కలవరాన్ని సజీవంగా నిలుపుతుంది; తరువాతి לִקְרָאתוֹతో సహజంగా అనుసంధానమవుతుంది.
- source_word: זִקְנֵי הָעִיר
  choice: పట్టణ పెద్దలు
  rationale: ఆ పట్టణంలోని గుర్తింపు పొందిన నాయకుల సామాజిక పాత్రను ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לִקְרָאתוֹ
  choice: అతన్ని ఎదుర్కోవడానికి
  rationale: לקראת యొక్క ‘ఎదురుగా వెళ్లి కలుసుకోవడం’ అనే దిశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: שָׁלוֹם בּוֹאֶךָ
  choice: నీ రాక క్షేమకరమైనదేనా?
  rationale: శబ్దార్థంలోని ‘నీ రాక శాంతేనా?’ అనే సంక్షిప్త ప్రశ్నను తెలుగులో సహజంగా చేస్తూ, అతని రాక మేలు కోసమా హాని కోసమా అన్న పెద్దల ఆందోళనను తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో బిరుదు కాక వ్యక్తిగత దైవనామం ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపాన్ని వాడుతూ దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- issue: שָׁלוֹם యొక్క సందర్భార్థం
  choice: క్షేమకరమైనదేనా
  alternative: శాంతితో వచ్చావా?
  rationale: ఇక్కడ ప్రశ్న కేవలం సమూయేలు మనోభావం గురించి కాక, అతని రాక తమకు క్షేమాన్ని తెస్తుందా అనే ఆందోళనను వ్యక్తం చేస్తుంది. అయినప్పటికీ ‘శాంతితో’ అనే అర్థసంభావ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. ‘వణుకుతూ’ మూలంలోని భయకంపనాన్ని, ‘క్షేమకరమైనదేనా’ שָׁלוֹם యొక్క విస్తృత సందర్భార్థాన్ని నిలుపుతాయి.
