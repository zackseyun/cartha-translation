source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֵ֣יךְ אֵלֵ֔ךְ וְ/שָׁמַ֥ע שָׁא֖וּל וַ/הֲרָגָ֑/נִי וַ/יֹּ֣אמֶר יְהוָ֗ה עֶגְלַ֤ת בָּקָר֙ תִּקַּ֣ח בְּ/יָדֶ֔/ךָ וְ/אָ֣מַרְתָּ֔ לִ/זְבֹּ֥חַ לַֽ/יהוָ֖ה בָּֽאתִיס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
translation:
  language: te
  text: సమూయేలు ఇలా అన్నాడు, “నేను ఎలా వెళ్లగలను? సౌలు వింటే నన్ను చంపుతాడు.” అప్పుడు యాహ్వే ఇలా అన్నాడు, “ఒక పెయ్యను[a] నీతో తీసుకెళ్లి, ‘యాహ్వేకు బలి అర్పించడానికి వచ్చాను’ అని చెప్పు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, చిన్న ఆవును.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  choice: నేను ఎలా వెళ్లగలను?
  rationale: ప్రశ్న ప్రయాణ విధానాన్ని కాక, సౌలు వల్ల వెళ్లడం సాధ్యమేనా అనే సమూయేలు ఆందోళనను వ్యక్తం చేస్తుంది; ‘ఎలా వెళ్లగలను?’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: וְשָׁמַע שָׁאוּל
  choice: సౌలు వింటే
  rationale: రూపపరంగా సంయోజకంతో కూడిన క్రియ అయినా, సందర్భంలో ఇది షరతును సూచిస్తుంది; తెలుగులో ‘వింటే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַהֲרָגָנִי
  choice: నన్ను చంపేస్తాడు
  rationale: సౌలు వింటే ఎదురయ్యే నిజమైన, తక్షణ ప్రమాదాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష నామరూపంతో అందిస్తుంది.
- source_word: עֶגְלַת בָּקָר
  choice: ఒక పెయ్యను
  rationale: ఈ పదబంధం చిన్న వయసున్న ఆడ పశువును సూచిస్తుంది; ‘పెయ్య’ ఖచ్చితమైన తెలుగు పదం, అయితే అందరికీ పరిచయం ఉండకపోవచ్చు కాబట్టి పాదటిప్పణి ఇచ్చాం.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: నీతో తీసుకెళ్లి
  rationale: అక్షరార్థంగా ‘నీ చేతిలో తీసుకో’; ఇక్కడ ఉద్దేశం వెంట తీసుకెళ్లడం కాబట్టి తెలుగు నుడికారానికి అనుగుణంగా అనువదించాం.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: యెహోవాకు బలి అర్పించడానికి
  rationale: బలిగా వధించి అర్పించే ఆరాధనా చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָּאתִי
  choice: వచ్చాను
  rationale: చేరుకున్న తరువాత తన రాక ఉద్దేశాన్ని ప్రకటించే సందర్భంలో తెలుగు భూతకాల రూపం సహజంగా సరిపోతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఉంచాం.
- issue: సమూయేలుకు దేవుడు చెప్పిన మాట యొక్క నైతిక స్వరూపం
  choice: మూలంలోని పరిమిత ప్రకటనను యథాతథంగా ఉంచడం
  alternative: ఇది మోసం కాదని లేదా ఒక ఉపాయమని వివరణను వచనంలో చేర్చడం
  rationale: వచనం సమూయేలు బలి అర్పించడానికి వచ్చానని చెప్పాలని మాత్రమే ఆదేశిస్తుంది; దాని నైతిక అర్థాన్ని ఇక్కడ స్పష్టంగా తీర్మానించదు. అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. సంభాషణలో ‘చంపేస్తాడు’ తక్షణ ప్రమాదాన్ని సహజంగా తెలియజేస్తుంది. ‘పెయ్య’ ఖచ్చితమైన పశుసంబంధ పదం కావడంతో సాధారణ పాఠకుని కోసం వివరణాత్మక పాదటిప్పణి జోడించబడింది.
