translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. మూలంలోని అస్పష్టమైన ‘గాడిద—రొట్టె’ సంబంధాన్ని ప్రధాన పాఠ్యంలో సందర్భానుగుణంగా స్పష్టం చేసి, అక్షర నిర్మాణాన్ని పాదటీకాలో ఇచ్చాం. ‘చేత’ అనే స్వల్పంగా సాంప్రదాయికమైన రూపం హీబ్రూ నుడికారపు వర్ణాన్ని నిలుపుతూనే సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంది.
