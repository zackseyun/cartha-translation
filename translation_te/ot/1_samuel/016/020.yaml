  text: וַ/יִּקַּ֨ח יִשַׁ֜י חֲמ֥וֹר לֶ֨חֶם֙ וְ/נֹ֣אד יַ֔יִן וּ/גְדִ֥י עִזִּ֖ים אֶחָ֑ד וַ/יִּשְׁלַ֛ח בְּ/יַד דָּוִ֥ד בְּנ֖/וֹ אֶל שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/020.yaml
  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
translation:
  language: te
  text: కాబట్టి యెష్షయి రొట్టెలు మోసే ఒక గాడిదను,[a] ద్రాక్షామద్యం నింపిన ఒక తోలుతిత్తిని, ఒక మేకపిల్లను తీసుకొని, తన కుమారుడైన దావీదు చేత వాటిని సౌలుకు పంపించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “ఒక గాడిద, రొట్టె”; అంటే రొట్టెలు మోసే లేదా రొట్టెలు ఎక్కించిన గాడిద.
    reason: lexical_alternative
  - marker: b
    text: “దావీదు చేత” అనే హీబ్రూ నుడికారం, అతని ద్వారా వాటిని పంపించాడనే భావాన్ని కూడా ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: కాబట్టి యెష్షయి ... తీసుకొని
  rationale: వయ్యిక్టోల్ కథనాన్ని ముందుకు నడిపిస్తుంది; ముందు సందర్భానికి సహజమైన అనుసంధానంగా ‘కాబట్టి’ వాడబడింది.
- source_word: חֲמוֹר לֶחֶם
  choice: రొట్టెలు మోసే ఒక గాడిదను
  rationale: హీబ్రూలో ‘గాడిద, రొట్టె’ అని సంబంధాన్ని స్పష్టంగా చెప్పకుండా పక్కపక్కనే ఉన్నాయి. సందర్భానుసారం గాడిద సరుకైన రొట్టెలను మోస్తోందని తెలుగులో సహజంగా వ్యక్తం చేయబడింది; మూలంలోని సంక్షిప్త నిర్మాణం పాదటీకాలో నిలుపబడింది.
- source_word: נֹאד יַיִן
  choice: ద్రాక్షారసం నింపిన ఒక తోలుతిత్తిని
  rationale: נֹאד అనేది జంతు చర్మంతో చేసిన ద్రవపాత్ర. ఆధునిక పాఠకునికి పాత్ర స్వరూపం, దానిలోని ద్రాక్షారసం రెండూ స్పష్టంగా ఉండేలా అనువదించబడింది.
- source_word: גְּדִי עִזִּים אֶחָד
  choice: ఒక మేకపిల్లను
  rationale: ఈ పదబంధం ఒక చిన్న మేకను సూచిస్తుంది; సంఖ్యనూ వయస్సునూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיִּשְׁלַח
  choice: వాటిని ... పంపించాడు
  rationale: క్రియకు సంబంధించిన కర్మ ముందుగా పేర్కొన్న కానుకలే; తెలుగులో వాక్యం స్పష్టంగా ఉండేందుకు ‘వాటిని’ చేర్చబడింది.
- source_word: בְּיַד
  choice: దావీదు చేత
  rationale: అక్షరార్థంగా ‘చేతిలో/చేతిద్వారా’; ఇక్కడ పంపిణీ లేదా ప్రతినిధిత్వ సాధనాన్ని తెలిపే హీబ్రూ నుడికారం. ‘చేత’ తెలుగు బైబిలు శైలిలో సంక్షిప్తంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: דָּוִד בְּנוֹ
  choice: తన కుమారుడైన దావీదు
  rationale: ‘తన కుమారుడు దావీదు’ అనే సంబంధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֶל שָׁאוּל
  choice: సౌలుకు
  rationale: దిశ లేదా గ్రహీతను తెలిపే సాధారణ రూపం.
