source:
  edition: WLC
  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/הַ/נְּעָרִ֜ים וַ/יֹּ֗אמֶר הִנֵּ֨ה רָאִ֜יתִי בֵּ֣ן לְ/יִשַׁי֮ בֵּ֣ית הַלַּחְמִי֒ יֹדֵ֣עַ נַ֠גֵּן וְ/גִבּ֨וֹר חַ֜יִל וְ/אִ֧ישׁ מִלְחָמָ֛ה וּ/נְב֥וֹן דָּבָ֖ר וְ/אִ֣ישׁ תֹּ֑אַר וַ/יהוָ֖ה עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
translation:
  language: te
  text: 'అప్పుడు ఆ యువకుల్లో ఒకడు ఇలా జవాబిచ్చాడు: “ఇదిగో, బేత్లెహేమీయుడైన యెష్షయి కుమారుల్లో ఒకణ్ణి నేను చూశాను. అతడు వాయించడంలో నిపుణుడు,[a] శౌర్యవంతుడు,[b] యుద్ధవీరుడు, మాటలో వివేకి, అందగాడు; యాహ్వే అతనితో ఉన్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలో అతడు ఏ వాయిద్యాన్ని వాయించాడో చెప్పలేదు; సందర్భంలో మాత్రం సౌలు ఎదుట తంతివాయిద్యం వాయించడం ప్రస్తావనలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “శౌర్యవంతుడు” అనే హెబ్రీ పదబంధాన్ని “పరాక్రమవంతుడు,” “సమర్థుడు,” లేదా “వీరుడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵהַנְּעָרִים וַיֹּאמֶר
  choice: అప్పుడు ఆ యువకుల్లో ఒకడు ఇలా జవాబిచ్చాడు
  rationale: ענה ... ויאמר అనే హెబ్రీ కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది; נְעָרִים ను సామాజిక హోదాగా అతిగా నిర్దిష్టం చేయకుండా ‘యువకులు’గా ఉంచింది.
- source_word: הִנֵּה רָאִיתִי
  choice: చూడండి ... నేను చూశాను
  rationale: הִנֵּה యొక్క శ్రద్ధ ఆకర్షించే బలాన్ని ‘చూడండి’ నిలుపుతుంది; perfect రూపానికి ఈ సందర్భంలో సహజమైన భూతకాలం వాడబడింది.
- source_word: בֵּן לְיִשַׁי בֵּית הַלַּחְמִי
  choice: బేత్లెహేమువాడైన యెష్షయి కుమారుల్లో ఒకణ్ణి
  rationale: Gentilic విశేషణం యెష్షయిని సూచిస్తుందని హెబ్రీ పదక్రమం సూచిస్తుంది. ‘ఒక కుమారుణ్ణి’ అనే భావాన్ని తెలుగులో సహజంగా ‘కుమారుల్లో ఒకణ్ణి’గా వ్యక్తం చేసింది.
- source_word: יֹדֵעַ נַגֵּן
  choice: వాయించడంలో నిపుణుడు
  rationale: ఈ వచనంలో వాయిద్యం పేరు లేదు; అందువల్ల దానిని చేర్చకుండా, ידע + infinitive యొక్క నైపుణ్య భావాన్ని స్పష్టంగా తెలిపింది.
- source_word: גִּבּוֹר חַיִל
  choice: శౌర్యవంతుడు
  rationale: ఈ స్థిరపదబంధంలో సామర్థ్యం, పరాక్రమం, వీరత్వం అనే విస్తృత భావం ఉంది. తరువాతి ‘యుద్ధవీరుడు’తో అనవసర పునరుక్తిని తగ్గిస్తూ ప్రశంసాత్మక బలాన్ని నిలిపింది.
- source_word: אִישׁ מִלְחָמָה
  choice: యుద్ధవీరుడు
  rationale: ‘యుద్ధపు మనిషి’ అనే అసహజ పదశః రూపం కాకుండా స్పష్టమైన సైనిక భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: נְבוֹן דָּבָר
  choice: మాటలో వివేకి
  rationale: דָּבָר ఇక్కడ మాట లేదా విషయం రెండింటినీ సూచించగలిగినా, నבון తో కలిసినప్పుడు మాటతీరులో వివేకం అనే భావం సందర్భోచితం; విస్తృత ప్రత్యామ్నాయం అవసరమైతే పాదసూచికలో ఇవ్వవచ్చు.
- source_word: אִישׁ תֹּאַר
  choice: అందగాడు
  rationale: ఆకృతి లేదా చూడచక్కని రూపాన్ని సూచించే హెబ్రీ నుడికారానికి సంక్షిప్తమైన సహజ తెలుగు రూపం.
- source_word: וַיהוָה עִמּוֹ
  choice: యెహోవా అతనికి తోడుగా ఉన్నాడు
  rationale: దైవనామాన్ని వ్యక్తినామంగా ‘యెహోవా’ అని ఉంచి, עִם యొక్క సన్నిధి మరియు అనుకూల సహవాస భావాన్ని ‘తోడుగా’ ద్వారా తెలిపింది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చింది; ఖచ్చిత ఉచ్చారణపై ఉన్న అనిశ్చితిని సిద్ధాంతపరంగా పరిష్కరించలేదు.
- issue: ‘యెహోవా అతనికి తోడుగా ఉన్నాడు’ అనే వాక్యభావం
  choice: దైవసన్నిధి లేదా అనుగ్రహాన్ని తెలిపే సూటి వాక్యంగా ఉంచడం
  alternative: దావీదు కార్యాలన్నిటికీ దైవ ఆమోదం ఉందని విస్తరించడం
  rationale: మూలంలోని సంక్షిప్తమైన verbless clause కంటే మించి సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. ప్రశంసల జాబితాలో సమాంతర నామవాచక రూపాలను సాధ్యమైనంతవరకు నిలిపింది. ‘చూడండి’ సంభాషణలో శ్రద్ధ ఆకర్షించే సహజ బహువచన గౌరవ రూపం.
