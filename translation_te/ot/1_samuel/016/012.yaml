id: 1SA.16.12
reference: 1 Samuel 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח וַ/יְבִיאֵ֨/הוּ֙ וְ/ה֣וּא אַדְמוֹנִ֔י עִם יְפֵ֥ה עֵינַ֖יִם וְ/ט֣וֹב רֹ֑אִי וַ/יֹּ֧אמֶר יְהוָ֛ה ק֥וּם מְשָׁחֵ֖/הוּ כִּֽי זֶ֥ה הֽוּא־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
translation:
  language: te
  text: అతడు పంపించి అతణ్ణి తీసుకువచ్చాడు. అతడు ఎర్రని ఛాయగలవాడు, అందమైన కళ్లున్నవాడు, చూడముచ్చటైనవాడు. అప్పుడు యాహ్వే, “లేచి, ఇతనికి అభిషేకం చెయ్యి; ఇతడే ఆ వ్యక్తి[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతడే అతడు.”
    reason: כִּי זֶה הוּא అనే సంక్షిప్త హెబ్రీ గుర్తింపు పదబంధానికి మరింత పదశః సమీపమైన ప్రత్యామ్నాయ రూపం.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు అతడు కబురు పంపి
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ తెలుగు కథన ప్రవాహంలో దాని క్రమబద్ధతను సహజంగా తెలియజేస్తుంది.
- source_word: וַיְבִיאֵהוּ
  choice: అతణ్ణి తీసుకురప్పించాడు
  rationale: בוא హిఫీల్ రూపానికి ‘తీసుకురావడం’ అనే భావం ఉంది. సందర్భంలో యెస్సయి దావీదును పిలిపించి సమూయేలు ఎదుటికి రప్పించిన భావాన్ని ఈ ప్రయోజక రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַדְמוֹנִי
  choice: ఎర్రని ఛాయగలవాడు
  rationale: ఈ పదం ఎర్రటి లేదా ఎర్రని శరీర ఛాయను సూచించగలదు. హెబ్రీ పదం తప్పనిసరిగా జుట్టు రంగును సూచించదు కాబట్టి ‘ఎర్రజుట్టుగలవాడు’ అని ప్రత్యేకీకరించలేదు.
- source_word: עִם יְפֵה עֵינַיִם
  choice: అందమైన కళ్లున్నవాడు
  rationale: ‘అందమైన కళ్లు కలవాడు’ అనే మూల భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וְטוֹב רֹאִי
  choice: చూడముచ్చటైనవాడు
  rationale: చూడడానికి ఆకర్షణీయమైన రూపాన్ని సూచించే హెబ్రీ పదబంధాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని వ్యక్తినామ రూపాన్ని లిప్యంతరీకరించింది.
- source_word: קוּם
  choice: లేచి
  rationale: సమూయేలుకు ఇచ్చిన సంక్షిప్త ఆజ్ఞను ప్రత్యక్షంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מְשָׁחֵהוּ
  choice: ఇతనికి అభిషేకం చెయ్యి
  rationale: రాజుగా ఎంపిక చేసే ఈ సందర్భంలో משׁח అనే క్రియకు ఖచ్చితమైన సాంప్రదాయిక అర్థాన్ని నిలుపుతుంది.
- source_word: כִּי זֶה הוּא
  choice: ఇతడే అతడు
  rationale: దైవిక గుర్తింపులోని సంక్షిప్తతను, ఉద్ఘాటనను నిలుపుతుంది. తెలుగు వాక్యప్రవాహం కోసం కారణార్థక సంబంధాన్ని సెమికోలన్ ద్వారా సూచించింది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలపాఠానికి దగ్గరగా ఉంటుంది.
- issue: దావీదు రూపవర్ణన
  choice: భౌతిక వర్ణనగానే నిలుపడం
  alternative: אַדְמוֹנִיని ప్రత్యేకంగా జుట్టు రంగుగా భావించడం లేదా రూపవర్ణనకు నైతిక ప్రతీకార్థం జోడించడం
  rationale: వచనం దావీదు బాహ్యరూపాన్ని వర్ణిస్తుంది; జుట్టు రంగునో నైతిక గుణాలనో స్పష్టంగా చెప్పదు. అందువల్ల మూలంలోని పరిమితినీ, పరిసర సందర్భంలోని ఉద్విగ్నతనూ అలాగే ఉంచింది.
- issue: כִּי זֶה הוּא లోని గుర్తింపు పదబంధం
  choice: ఇతడే అతడు
  alternative: ఇతడే ఆ వ్యక్తి
  rationale: హెబ్రీలోని సంక్షిప్తమైన, ఉద్ఘాటనగల గుర్తింపును వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథనశైలి, దైవ వాక్యానికి తగిన గౌరవప్రదమైన ప్రత్యక్ష భాష ఉపయోగించబడింది. మూలంలో లేని జుట్టు రంగు లేదా నైతిక ప్రతీకార్థం చేర్చలేదు.
