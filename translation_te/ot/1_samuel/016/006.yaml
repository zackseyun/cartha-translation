id: 1SA.16.6
reference: 1 Samuel 16:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/בוֹאָ֔/ם וַ/יַּ֖רְא אֶת אֱלִיאָ֑ב וַ/יֹּ֕אמֶר אַ֛ךְ נֶ֥גֶד יְהוָ֖ה מְשִׁיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/006.yaml
  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
translation:
  language: te
  text: వారు వచ్చినప్పుడు సమూయేలు ఎలీయాబును చూసి, “నిశ్చయంగా యెహోవా అభిషిక్తుడు[a] యెహోవా సమక్షంలో ఉన్నాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా మెస్సీయ.” ఇక్కడ “అభిషిక్తుడు”గా అనువదించిన హీబ్రూ పదమే తరువాత “మెస్సీయ” అనే బిరుదుకు ఉపయోగించబడింది. అయితే ఈ సందర్భంలో, యెహోవా రాజుగా ఎన్నుకొని అభిషేకించబోయే వ్యక్తి ఇతడేనని సమూయేలు భావిస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאָם
  choice: వారు వచ్చినప్పుడు
  rationale: వావ్-క్రమంతో కూడిన היה మరియు בוא ధాతువు యొక్క కాలార్థక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది. మూలంలో ప్రవేశించడం స్పష్టంగా లేకపోవడంతో ‘లోపలికి వచ్చినప్పుడు’ అని అదనంగా చెప్పలేదు.
- source_word: וַיַּרְא אֶת אֱלִיאָב
  choice: సమూయేలు ఎలీయాబును చూసి
  rationale: ראה యొక్క సాధారణ అర్థమైన ‘చూశాడు’ను నిలుపుతుంది. తెలుగులో కర్త స్పష్టత కోసం సందర్భం ద్వారా తెలిసే ‘సమూయేలు’ పేరును చేర్చింది.
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: אמרను అంతరంగ ఆలోచనగా వ్యాఖ్యానించకుండా, మూలంలోని సాధారణ ‘చెప్పాడు’ భావాన్నే నిలిపింది.
- source_word: אַךְ
  choice: నిశ్చయంగా
  rationale: ఎలీయాబును చూసిన వెంటనే సమూయేలు వ్యక్తం చేసిన బలమైన నమ్మకాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన నామరూపంగా లిప్యంతరీకరించింది.
- source_word: מְשִׁיחוֹ
  choice: యెహోవా అభిషిక్తుడు
  rationale: మూడవ పురుష ఏకవచన సంబంధాన్ని స్పష్టంగా యెహోవాకు అన్వయిస్తూ, ఈ రాజు-ఎంపిక సందర్భంలో ‘అభిషిక్తుడు’ అనే చారిత్రక అర్థాన్ని నిలుపుతుంది.
- source_word: נֶגֶד יְהוָה
  choice: యెహోవా సమక్షంలో
  rationale: נֶגֶד యొక్క ‘ఎదుట, సమక్షంలో’ భావాన్ని మరియు యెహోవా అనే స్పష్ట నామాన్ని రెండింటినీ నిలుపుతుంది; అస్పష్టమైన సర్వనామాన్ని ఉపయోగించదు.
theological_decisions:
- issue: మְשִׁיחוֹ అనే పదాన్ని రాజు ఎంపిక సందర్భంలో అనువదించడం
  choice: యెహోవా అభిషిక్తుడు
  alternative: యెహోవా మెస్సీయ
  rationale: ఇక్కడ సమూయేలు యెహోవా రాజుగా ఎన్నుకొని అభిషేకించబోయే వ్యక్తిని ఉద్దేశిస్తున్నాడు. ‘అభిషిక్తుడు’ తక్షణ చారిత్రక భావాన్ని నిలుపుతుంది; తరువాతి ‘మెస్సీయ’ అనే బిరుదుతో ఉన్న పదసంబంధాన్ని పాదసూచిక తెలియజేస్తుంది.
- issue: נֶגֶד יְהוָה లోని సంబంధం
  choice: యెహోవా సమక్షంలో
  alternative: ఆయన ఎదుట
  rationale: మూలపాఠంలో యెహోవా అనే నామం స్పష్టంగా ఉంది. దానిని పునరుక్తి చేయడం తెలుగులో కొద్దిగా గంభీరంగా ఉన్నప్పటికీ, సూచనలోని అస్పష్టతను నివారించి మూల నిర్మాణాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథన వాక్యనిర్మాణం, దైవనామం మరియు రాజాభిషేక పదజాలానికి తగిన గౌరవప్రదమైన శైలి ఉపయోగించబడింది.
