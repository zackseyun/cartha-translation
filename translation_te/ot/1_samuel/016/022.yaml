source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח שָׁא֔וּל אֶל יִשַׁ֖י לֵ/אמֹ֑ר יַעֲמָד נָ֤א דָוִד֙ לְ/פָנַ֔/י כִּֽי מָ֥צָא חֵ֖ן בְּ/עֵינָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/022.yaml
  text: Then Saul sent to Jesse[a], saying, “Please let David stand before me, for he has found favor in my eyes.”
translation:
  language: te
  text: 'అప్పుడు సౌలు యెష్షయికి ఇలా కబురు పంపించాడు: “దయచేసి దావీదు నా ఎదుట నిలిచి ఉండనివ్వు[a], ఎందుకంటే అతడు నా దృష్టిలో మెప్పు పొందాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు నా ఎదుట ఉండనివ్వు”; ఇది సౌలు సేవలో అతడు కొనసాగడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח שָׁאוּל אֶל יִשַׁי לֵאמֹר
  choice: అప్పుడు సౌలు యెష్షయికి కబురు పంపి ... అని చెప్పాడు
  rationale: క్రమాన్ని ముందుకు నడిపే wayyiqtol రూపాన్ని ‘అప్పుడు’తో తెలిపి, తెలుగులో సహజంగా ఉండేందుకు ‘కబురు పంపి ... అని చెప్పాడు’ అనే సందేశ నిర్మాణాన్ని వాడాం.
- source_word: יַעֲמָד נָא
  choice: సేవచేస్తూ ఉండడానికి దయచేసి అనుమతించు
  rationale: עמד యొక్క మూలార్థం ‘నిలుచుట’; రాజసభ సందర్భంలో ఇది ఒకరి సమక్షంలో పరిచారకునిగా కొనసాగడాన్ని సూచిస్తుంది. נָא లోని మర్యాదపూర్వక అభ్యర్థన భావాన్ని ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: לְפָנַי
  choice: నా సమక్షంలో
  rationale: అక్షరార్థంగా ‘నా ముందు’; ఆధునిక తెలుగులో రాజసేవ సందర్భాన్ని సహజంగా తెలిపేందుకు ‘నా సమక్షంలో’ ఎంచుకున్నాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సౌలు చేసిన అభ్యర్థనకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: מָצָא חֵן בְּעֵינָי
  choice: నా దృష్టిలో అనుగ్రహం పొందాడు
  rationale: ‘నా కళ్లలో కృపను కనుగొన్నాడు’ అనే హీబ్రూ నుడికారానికి సమానంగా, వ్యక్తిగత ఆమోదం/మెప్పు భావాన్ని గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: דָוִד / שָׁאוּל / יִשַׁי
  choice: దావీదు / సౌలు / యెష్షయి
  rationale: తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన వ్యక్తినామ రూపాలను ఉపయోగించాం.
