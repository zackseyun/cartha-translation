translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, రాజసభకు తగిన గౌరవప్రదమైన శైలిని పాటించాం. మూలంలోని ‘నా ముందు నిలుచుట’ అనే రూపకాన్ని ప్రధాన వచనంలో సందర్భార్థంగా తెలిపి, అక్షరార్థాన్ని పాదసూచికలో భద్రపరచాం.
