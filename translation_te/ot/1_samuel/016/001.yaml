id: 1SA.16.1
reference: 1 Samuel 16:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
translation:
  language: te
  text: 'యాహ్వే సమూయేలుతో ఇలా అన్నాడు: “నేను సౌలును ఇశ్రాయేలుకు రాజుగా ఉండకుండా తిరస్కరించాను కదా; ఇంకా ఎంతకాలం నువ్వు సౌలు కోసం దుఃఖిస్తూ ఉంటావు? నీ కొమ్మును నూనెతో నింపు, వెళ్లు. నేను నిన్ను బేత్లెహేమువాడైన యెష్షయి దగ్గరికి పంపుతున్నాను; ఎందుకంటే అతని కుమారులలో నా కోసం ఒక రాజును నేను ఎంచుకున్నాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా కోసం ఒక రాజును నేను ఏర్పాటు చేశాను.” హెబ్రీ క్రియకు అక్షరార్థంగా ‘చూశాను’ అని అర్థం; ఈ సందర్భంలో అది ఎంపిక లేదా ఏర్పాటు భావాన్ని సూచించవచ్చు.
    reason: ראה అనే క్రియలోని అక్షరార్థమైన ‘చూడటం’ భావానికీ, సందర్భానుసారమైన ‘ఎంచుకోవడం/ఏర్పాటు చేయడం’ భావానికీ మధ్య ఉన్న అనిశ్చితిని చూపించడానికి.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు దగ్గరైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: מִתְאַבֵּל
  choice: దుఃఖిస్తూ ఉంటావు
  rationale: ఈ రూపం కొనసాగుతున్న శోకాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: מְאַסְתִּיו מִמְּלֹךְ עַל־יִשְׂרָאֵל
  choice: సౌలును ఇశ్రాయేలుమీద రాజుగా ఉండకుండా తిరస్కరించాను
  rationale: తిరస్కరణ ఇక్కడ ప్రత్యేకంగా సౌలు రాజుగా ఉండటానికి సంబంధించినదని స్పష్టంగా ఉంచి, దాని పరిధిని వేదాంతపరంగా విస్తరించలేదు.
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  choice: నీ కొమ్మును నూనెతో నింపుకొని
  rationale: కֶרֶן అనే పదంలోని చారిత్రకమైన ‘కొమ్ము’ చిత్రాన్ని సాధారణ పాత్రగా మార్చకుండా నిలిపాం.
- source_word: אֶשְׁלָחֲךָ
  choice: నేను నిన్ను ... పంపుతున్నాను
  rationale: సమీపమైన, నిర్ణయాత్మక దైవ నియామకాన్ని సహజమైన వర్తమాన రూపంలో వ్యక్తం చేస్తుంది.
- source_word: יִשַׁי בֵּית הַלַּחְמִי
  choice: బేత్లెహేమీయుడైన యెష్షయి
  rationale: యెష్షయి స్వస్థలాన్ని సూచించే హెబ్రీ జాతివాచక రూపాన్ని తెలుగులో సహజమైన విశేషణ రూపంతో ఇచ్చాం.
- source_word: רָאִיתִי לִי
  choice: నా కోసం ... నేను చూసుకున్నాను
  rationale: ראה యొక్క ప్రాథమిక ‘చూడటం’ చిత్రాన్ని నిలుపుతూ, ‘చూసుకోవడం’ ద్వారా సందర్భంలోని ఎంపిక లేదా ఏర్పాటు భావాన్నీ తెలుగులో సూచిస్తుంది.
- source_word: בְּבָנָיו
  choice: అతని కుమారులలో
  rationale: యెష్షయి కుమారుల సమూహంలో ఒకరిని ఉద్దేశిస్తున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֶלֶךְ
  choice: ఒక రాజును
  rationale: హెబ్రీలోని అనిర్దిష్ట రూపాన్ని నిలుపుతుంది; ఈ దశలో ఆ రాజు పేరు ఇంకా వెల్లడించబడలేదు.
theological_decisions:
- issue: సౌలును యాహ్వే తిరస్కరించిన దాని పరిధి
  choice: రాజుగా ఉండకుండా తిరస్కరించాను
  alternative: పూర్తిగా తిరస్కరించాను
  rationale: సందర్భం సౌలు రాజ్యాధికారాన్ని గురించే చెబుతుంది. అతని అంతిమ ఆత్మీయ స్థితి గురించి పాఠం చెప్పని నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
- issue: רָאִיתִי לִי లోని చూడటం–ఎంపిక భావసమ్మేళనం
  choice: నా కోసం ఒక రాజును నేను చూసుకున్నాను
  alternative: నా కోసం ఒక రాజును ఏర్పాటుచేసుకున్నాను / ఎంచుకున్నాను
  rationale: మూలపదంలోని ‘చూశాను’ అనే చిత్రాన్ని కోల్పోకుండా, సందర్భంలో ఉండగల ఎంపిక లేదా సమకూర్చుకోవడం అనే భావాన్ని ‘చూసుకున్నాను’ ద్వారా తెరిచి ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడాం. ప్రత్యక్ష సంభాషణలో ‘నువ్వు’ రూపం హెబ్రీ ఏకవచన సంబోధనను సహజంగా ప్రతిబింబిస్తుంది. సంప్రదాయ బైబిలు పేర్లలో విస్తృతంగా గుర్తించదగిన ‘సమూయేలు,’ ‘సౌలు,’ ‘యెష్షయి,’ ‘బేత్లెహేము’ ఆధార రూపాలను ఉపయోగించాం.
