  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם לִ/זְבֹּ֤חַ לַֽ/יהוָה֙ בָּ֔אתִי הִֽתְקַדְּשׁ֔וּ וּ/בָאתֶ֥ם אִתִּ֖/י בַּ/זָּ֑בַח וַ/יְקַדֵּ֤שׁ אֶת יִשַׁי֙ וְ/אֶת בָּנָ֔י/ו וַ/יִּקְרָ֥א לָ/הֶ֖ם לַ/זָּֽבַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
translation:
  language: te
  text: అతడు, “శాంతి.[a] యెహోవాకు బలి అర్పించడానికి వచ్చాను. మిమ్మల్ని మీరు పవిత్రపరచుకొని, నాతోపాటు బలికి రండి” అన్నాడు. తరువాత అతడు యెష్షయిని, అతని కుమారులను పవిత్రపరిచి, బలికి వారిని ఆహ్వానించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్షేమమే,” “శాంతితోనే వచ్చాను.” హీబ్రూలో కేవలం “శాంతి” అని ఉంది; సమూయేలు శత్రుభావంతో రాలేదనే భరోసా ఇది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: శాంతి
  rationale: మునుపటి వచనంలోని ప్రశ్నకు సమాధానంగా వచ్చిన ఈ ఏకపద నామవాచకం సమూయేలు శత్రుభావంతో రాలేదని భరోసా ఇస్తుంది. మూలంలోని సంక్షిప్తతను, అర్థవిస్తృతిని నిలుపుతుంది.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: యెహోవాకు బలి అర్పించడానికి
  rationale: ל తో కూడిన క్రియార్థక రూపం రాక యొక్క ఉద్దేశాన్ని సూచిస్తుంది. తెలుగులో ‘బలి అర్పించడానికి’ సహజంగా ఉండి ఆరాధనా సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּאתִי
  choice: వచ్చాను
  rationale: హీబ్రూ సంపూర్ణ క్రియ ప్రస్తుత రాకకు కారణాన్ని వివరిస్తోంది; తెలుగు భూతకాల రూపం సంభాషణలో సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: הִתְקַדְּשׁוּ
  choice: మిమ్మల్ని మీరు ప్రతిష్ఠించుకొని
  rationale: హిత్పయేల్ రూపం బలిలో పాల్గొనడానికి తమను తాము ఆచారపరంగా సిద్ధపరచుకొని ప్రత్యేకించుకోవడాన్ని సూచిస్తుంది. ‘శుద్ధి చేసుకొని’ అనడం శుద్ధీకరణకే అర్థాన్ని పరిమితం చేయవచ్చు.
- source_word: וּבָאתֶם אִתִּי בַּזָּבַח
  choice: నాతోపాటు బలికి రండి
  rationale: సిద్ధపడమనే ఆదేశం తరువాత వచ్చే ఆహ్వానం/నిర్దేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, ‘రావడం’ అనే దిశార్థాన్ని నిలుపుతుంది.
- source_word: וַיְקַדֵּשׁ
  choice: ప్రతిష్ఠించి
  rationale: పియేల్ రూపం యెష్షయిని, అతని కుమారులను బలి సందర్భంలో పవిత్ర భాగస్వామ్యానికి ఆచారపరంగా ప్రత్యేకించడాన్ని సూచిస్తుంది.
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  choice: బలికి వారిని ఆహ్వానించాడు
  rationale: קרא + ל ఈ సందర్భంలో పిలవడం లేదా ఆహ్వానించడం అనే భావం కలిగిస్తుంది. ‘ఆహ్వానించాడు’ బలిలో వారిని చేర్చిన భావాన్ని సహజంగా తెలియజేస్తుంది; బలవంతపు సమనును సూచించదు.
- source_word: יִשַׁי
  choice: యెష్షయి
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం పురుష సంతానాన్ని స్పష్టంగా సూచిస్తుంది; కథనంలో యెష్షయి కుమారులే సమూయేలు ఎదుటికి రావడం ముఖ్యమైనది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో నిబంధన సంబంధమైన దైవనామం నేరుగా ఉంది. తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపం దానిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగానే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ఆచారపరమైన קדשׁ పదసంబంధాన్ని రెండు చోట్లా ‘ప్రతిష్ఠించు’తో ఏకరీతిగా నిలిపి, మూలంలోని సంక్షిప్త ‘శాంతి’కి వివరణను పాదసూచికలో ఇచ్చాం.
