source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֣ל אֶל יִשַׁי֮ הֲ/תַ֣מּוּ הַ/נְּעָרִים֒ וַ/יֹּ֗אמֶר ע֚וֹד שָׁאַ֣ר הַ/קָּטָ֔ן וְ/הִנֵּ֥ה רֹעֶ֖ה בַּ/צֹּ֑אן וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל יִשַׁי֙ שִׁלְחָ֣/ה וְ/קָחֶ֔/נּוּ כִּ֥י לֹא נָסֹ֖ב עַד בֹּא֥/וֹ פֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
translation:
  language: te
  text: అప్పుడు సమూయేలు యెష్షయితో, “ఈ యువకులే అందరూనా?” అని అడిగాడు. అతడు, “ఇంకా అతి చిన్నవాడు మిగిలి ఉన్నాడు. ఇదిగో, అతడు మందను మేపుతున్నాడు[a]” అని చెప్పాడు. అప్పుడు సమూయేలు యెష్షయితో, “ఎవరినైనా పంపి అతన్ని తీసుకురమ్ము. అతడు ఇక్కడికి వచ్చేవరకు మనం కూర్చోము[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గొర్రెలను కాస్తున్నాడు.” హిబ్రూలో అక్షరార్థంగా “మందను మేపుతున్నాడు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మనం మన స్థానాల్లో కూర్చోము.” ఇక్కడ వారు అతడు వచ్చేవరకు భోజనాన్ని లేదా ఆచారబద్ధమైన సమావేశాన్ని ప్రారంభించరనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ הַנְּעָרִים
  choice: యువకులు వీరేనా, అందరూ వచ్చారా?
  rationale: תמם యొక్క ‘పూర్తి కావడం’ అనే భావాన్ని కుటుంబంలోని కుమారులందరూ హాజరయ్యారా అనే సందర్భానుసార ప్రశ్నగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; נְעָרִים ను ‘యువకులు’గా నిలుపుతుంది.
- source_word: עוֹד שָׁאַר הַקָּטָן
  choice: ఇంకా చిన్నవాడు మిగిలి ఉన్నాడు
  rationale: עוֹד שָׁאַר లోని ‘ఇంకా ఒకడు మిగిలాడు’ అనే నొక్కును నిలుపుతూ, הַקָּטָן ను సందర్భానికి తగిన ‘చిన్నవాడు’గా అనువదించింది. ఇది వయస్సులో చిన్నవాడనే భావాన్ని ఇస్తూనే మూలంలోని రూపాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తదుపరి సమాచారంపై దృష్టి నిలిపే హిబ్రూ సూచనాత్మక పదానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: רֹעֶה בַּצֹּאן
  choice: మందను మేపుతున్నాడు
  rationale: కొనసాగుతున్న కాపరి కార్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; צֹאן అనే సమూహవాచక భావాన్ని ‘మంద’ నిలుపుతుంది.
- source_word: שִׁלְחָה וְקָחֶנּוּ
  choice: అతని కోసం మనిషిని పంపి, అతన్ని తీసుకురా
  rationale: పంపడం, తీసుకురావడం అనే రెండు ఆజ్ఞాంశాలనూ స్పష్టంగా నిలుపుతుంది. పంపబడే వ్యక్తి మూలంలో అంతర్లీనంగా ఉన్నందున ‘మనిషిని’ సందర్భార్థంగా చేర్చబడింది.
- source_word: לֹא נָסֹב
  choice: మనం కూర్చోము
  rationale: సందర్భంలో సమూహం తన స్థానాన్ని స్వీకరించడం లేదా భోజనాన్ని/సభను ప్రారంభించడం అనే సంభావ్య నుడికార భావాన్ని ప్రధాన పాఠంలో సంక్షిప్తంగా ఇస్తుంది; విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: עַד בֹּאוֹ פֹה
  choice: అతడు ఇక్కడికి వచ్చేవరకు
  rationale: కాలపరమైన ఉపవాక్యాన్ని నేరుగా, సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హిబ్రూ వాక్యంలోని వరుస సంభాషణను నిలిపి, ‘ఇదిగో’ ద్వారా הִנֵּה యొక్క దృష్టి ఆకర్షణను కాపాడాం. לֹא נָסֹב లోని నుడికార అనిశ్చితిని ప్రధాన పాఠంలో అతిగా వివరణ చేయకుండా పాదటిప్పణిలో సూచించాం.
