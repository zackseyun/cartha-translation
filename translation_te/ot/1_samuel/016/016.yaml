source:
  edition: WLC
  text: יֹאמַר נָ֤א אֲדֹנֵ֨/נוּ֙ עֲבָדֶ֣י/ךָ לְ/פָנֶ֔י/ךָ יְבַקְשׁ֕וּ אִ֕ישׁ יֹדֵ֖עַ מְנַגֵּ֣ן בַּ/כִּנּ֑וֹר וְ/הָיָ֗ה בִּֽ/הְי֨וֹת עָלֶ֤י/ךָ רֽוּחַ אֱלֹהִים֙ רָעָ֔ה וְ/נִגֵּ֥ן בְּ/יָד֖/וֹ וְ/ט֥וֹב לָֽ/ךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
translation:
  language: te
  text: “మా ప్రభువు దయచేసి తన సమక్షంలో ఉన్న తన సేవకులకు వీణ వాయించడంలో నైపుణ్యం ఉన్న ఒక వ్యక్తిని వెదకమని చెప్పాలి. దేవుని నుండి హానికరమైన ఆత్మ మీ మీద ఉన్నప్పుడు[a], అతడు తన చేతితో వాయిస్తాడు; అప్పుడు మీకు మేలు కలుగుతుంది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని నుండి దుష్టమైన ఆత్మ మీ మీద ఉన్నప్పుడు.” హీబ్రూ పదబంధాన్ని “దేవునికి చెందిన హానికరమైన/దుష్టమైన ఆత్మ” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: רָעָה అనే పదం ‘హానికరమైన’ లేదా ‘దుష్టమైన’ అనే భావాలను ఇవ్వగలదు; אֱלֹהִיםతో సంబంధం ‘దేవుని నుండి’ లేదా ‘దేవునికి చెందిన’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: יֹאמַר נָא אֲדֹנֵינוּ
  choice: మా ప్రభువు ... ఆజ్ఞ ఇవ్వ దయచేయాలి
  rationale: నָאతో కూడిన క్రియ మర్యాదపూర్వక అభ్యర్థనను తెలియజేస్తుంది. రాజసభ సందర్భంలో ‘ప్రభువు’ సౌలుకు ఇచ్చే గౌరవ బిరుదు; ‘ఆజ్ఞ ఇవ్వ దయచేయాలి’ అనేది సేవకులను వెదకమని చెప్పే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  choice: తన సమక్షంలో ఉన్న తన సేవకులకు
  rationale: అక్షరార్థంగా ‘నీ ఎదుటనున్న నీ సేవకులు’; రాజు సమక్షంలో పరిచర్య చేసే ఆస్థాన సేవకులను సూచించే హీబ్రూ స్థలవాచక నుడికారాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְבַקְשׁוּ אִישׁ
  choice: ఒక మనిషిని వారు వెదకాలి
  rationale: ఒక తగిన వ్యక్తిని ఉద్దేశపూర్వకంగా వెదికి కనుగొనాలనే ప్రతిపాదనను నిలుపుతుంది.
- source_word: יֹדֵעַ מְנַגֵּן
  choice: వాయించడం తెలిసిన
  rationale: ఈ నిర్మాణం వాయించగల నేర్పు లేదా సామర్థ్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన ప్రయోగం.
- source_word: כִּנּוֹר
  choice: వీణ
  rationale: ఇది ప్రాచీన తంత్రీ వాద్యాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు అర్థమయ్యే సాధారణ తంత్రీ వాద్యపదంగా ‘వీణ’ను వాడుతున్నాం; ఇది ఆధునిక భారతీయ వీణతో పూర్తిగా సమానమైన వాద్యమని ఉద్దేశం కాదు.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: దేవుని నుండి హానికరమైన ఆత్మ
  rationale: אֱלֹהִים అనే సంబంధరూపాన్ని సందర్భానుసారంగా ‘దేవుని నుండి’ అని అందించి మూలం/ఆరంభాన్ని నిలుపుతుంది. רָעָהకు ఇక్కడ కలిగించే కీడు లేదా బాధను ప్రధానంగా చూపే ‘హానికరమైన’ను ఎంచుకున్నాం; ‘దుష్టమైన’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: עָלֶיךָ
  choice: నీ మీదికి వచ్చినప్పుడు
  rationale: ఆత్మ సౌలును ఆవరించే లేదా బాధించే సందర్భాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: అతడు తన చేతితో వాయిస్తాడు
  rationale: హీబ్రూలోని స్పష్టమైన ‘తన చేతితో’ అనే అభివ్యక్తిని నిలుపుతూ వాద్యవాయనాన్ని సూచిస్తుంది.
- source_word: וְטוֹב לָךְ
  choice: నీకు ఉపశమనం కలుగుతుంది
  rationale: ఈ సందర్భంలో వాయన ఫలితంగా సౌలు పరిస్థితి మెరుగుపడుతుందని సూచిస్తుంది. సాధారణ ‘నీకు మేలు కలుగుతుంది’ కంటే సందర్భానుకూలంగా సహజమైన తెలుగు.
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָהలో ఆత్మ స్వభావం మరియు దేవునితో దాని సంబంధాన్ని ఎలా వ్యక్తపరచాలి
  choice: దేవుని నుండి హానికరమైన ఆత్మ
  alternative: దేవుని నుండి దుష్టమైన ఆత్మ; దేవునికి చెందిన హానికరమైన ఆత్మ
  rationale: వాక్యం ఆ ఆత్మకు దేవునితో ఉన్న సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; అందువల్ల దాన్ని తొలగించలేదు లేదా కేవలం మానసిక స్థితిగా మార్చలేదు. ‘నుండి’ మూలాన్ని సహజంగా తెలియజేస్తుంది. רָעָה నైతిక దుష్టత్వాన్నీ, హానికర ప్రభావాన్నీ సూచించగలదు; ప్రధాన పాఠంలో ‘హానికరమైన’ను ఉంచి, ‘దుష్టమైన’ను పాదటిప్పణిలో ఇచ్చి అసలు భావ పరిధినీ వేదాంత ఉద్రిక్తతనూ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన రాజసభ శైలిని పాటించాం. ‘ప్రభువు’ ఇక్కడ దేవుని పేరు కాదు, సౌలుకు ఇచ్చే గౌరవ సంబోధన. వాక్య నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం ప్రత్యక్ష ఆజ్ఞ రూపానికి దగ్గరగా అమర్చాం; మూలంలోని మర్యాదపూర్వక అభ్యర్థనను ‘దయచేయాలి’తో నిలిపాం.
