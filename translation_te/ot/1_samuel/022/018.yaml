translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలిని ఉపయోగించాం. రాజు ఆజ్ఞలోని ఆకస్మికతను నిలిపి, פגע అనే క్రియను వెంటనే ‘చంపు’గా సంకుచితం చేయకుండా తరువాతి మరణసారాంశంతో ఉన్న భేదాన్ని కాపాడాం.
