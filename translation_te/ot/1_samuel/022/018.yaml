source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ ל/דויג סֹ֣ב אַתָּ֔ה וּ/פְגַ֖ע בַּ/כֹּהֲנִ֑ים וַ/יִּסֹּ֞ב דויג הָ/אֲדֹמִ֗י וַ/יִּפְגַּע הוּא֙ בַּ/כֹּ֣הֲנִ֔ים וַ/יָּ֣מֶת בַּ/יּ֣וֹם הַ/ה֗וּא שְׁמֹנִ֤ים וַ/חֲמִשָּׁה֙ אִ֔ישׁ נֹשֵׂ֖א אֵפ֥וֹד בָּֽד־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
translation:
  language: te
  text: అప్పుడు రాజు దోయేగుతో, “నువ్వే యాజకుల వైపు తిరిగి, వారిపై దాడి చేయి[a]” అన్నాడు. అప్పుడు ఎదోమీయుడైన దోయేగు యాజకుల వైపు తిరిగి వారిపై దాడి చేశాడు. ఆ రోజున నారతో చేసిన ఏఫోదు[b] ధరించిన ఎనభై ఐదుగురు పురుషులను అతడు చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారిపై పడి వారిని కొట్టు.’ హీబ్రూ క్రియ హింసాత్మకంగా మీదపడడం, దాడి చేయడం లేదా కొట్టడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఏఫోదు యాజకులు ధరించే ప్రత్యేక వస్త్రం.
    reason: cultural_term
lexical_decisions:
- source_word: סֹב אַתָּה
  choice: నువ్వే ... వైపు తిరిగి
  rationale: సֹב అనే ఆజ్ఞ లక్ష్యం వైపు తిరగడాన్ని సూచిస్తుంది. ప్రత్యేకంగా ఉన్న אַתָּהను, రాజసేవకులు నిరాకరించిన నేపథ్యంలోని వ్యత్యాసాన్ని నిలుపుతూ, తెలుగులో సహజమైన ‘నువ్వే’తో వ్యక్తం చేశాం.
- source_word: וּפְגַע / וַיִּפְגַּע
  choice: వారిపై దాడి చేయి / వారిపై దాడి చేశాడు
  rationale: פגע ఇక్కడ హింసాత్మకంగా మీదపడడం లేదా దాడి చేయడం అనే భావం ఇస్తుంది. తరువాతి וַיָּמֶתలోని చంపిన ఫలితాన్ని ముందుగానే ఈ క్రియలో కలపకుండా ‘దాడి’ అని అనువదించాం.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: నిర్దిష్ట బహువచన నామవాచకానికి ఆధునిక ప్రామాణిక తెలుగు పదం.
- source_word: הָאֲדֹמִי
  choice: ఎదోమీయుడు
  rationale: దోయేగు జాతి లేదా ప్రాంతీయ గుర్తింపును తెలిపే gentilic రూపాన్ని నేరుగా అనువదించాం.
- source_word: וַיָּמֶת
  choice: అతడు చంపాడు
  rationale: హిఫీల్ రూపం కారణక చర్యగా ‘చంపాడు’ అని అర్థమిస్తుంది. తెలుగులో ఇది సహజంగా ఉండి, ముందున్న ‘దాడి చేశాడు’ అనే చర్య తరువాత వచ్చిన ప్రాణాంతక ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁמֹנִים וַחֲמִשָּׁה אִישׁ
  choice: ఎనభై ఐదుగురు పురుషులను
  rationale: సంఖ్య తరువాత ఉన్న אִישׁను లింగసంబంధ వివరంతో సహా స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: נֹשֵׂא אֵפוֹד בָּד
  choice: నారతో చేసిన ఏఫోదు ధరించిన
  rationale: వస్త్ర సందర్భంలో נשׂא ‘ధరించడం’ అనే అర్థం ఇస్తుంది; בָּד నార వస్త్రాన్ని సూచిస్తుంది. ‘ఏఫోదు’ అనే యాజక వస్త్రనామాన్ని లిప్యంతరీకరించి, సంక్షిప్త వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: అప్పుడు రాజు ... అన్నాడు
  rationale: వావ్-క్రమకథన రూపం కథను ముందుకు నడిపే వరుసను తెలుగులో సహజమైన ‘అప్పుడు’తో తెలిపాం.
