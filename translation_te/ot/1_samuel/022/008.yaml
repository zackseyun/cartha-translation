  to: ఎందుకంటే మీరందరూ నాకు వ్యతిరేకంగా కుట్ర పన్నారు; నా కుమారుడు యెష్షయి కుమారునితో[c] ఒడంబడిక చేసుకున్నప్పుడు, మీలో ఎవరూ నాకు తెలియజేయలేదు.[a] మీలో ఎవరికీ నా పట్ల చింతలేదు[b]; నా కుమారుడు నా సేవకుణ్ణి నాకు వ్యతిరేకంగా మాటువేయడానికి పురికొల్పాడని[d] కూడా ఎవరూ నాకు తెలియజేయలేదు—ఈనాడు ఉన్నట్లుగా.
