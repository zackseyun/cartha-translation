base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
translation:
  language: te
  text: ఎందుకంటే మీరందరూ నాకు వ్యతిరేకంగా కుట్ర పన్నారు; నా కుమారుడు యెష్షయి కుమారునితో[c] ఒడంబడిక చేసుకున్నప్పుడు, మీలో ఎవరూ నాకు తెలియజేయలేదు.[a] మీలో ఎవరికీ నా పట్ల చింతలేదు[b]; నా కుమారుడు నా సేవకుణ్ణి నాకు వ్యతిరేకంగా మాటువేయడానికి పురికొల్పాడని[d] కూడా ఎవరూ నాకు తెలియజేయలేదు—ఈనాడు ఉన్నట్లుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘నా చెవిని తెరవడం’; అంటే ‘నాకు తెలియజేయడం’ లేదా ‘నాకు వెల్లడించడం.’
    reason: lexical_alternative
  - marker: b
    text: ‘నా పట్ల చింతలేదు’ అనే మాటకు ‘నాపై జాలి చూపలేదు’ లేదా ‘నా గురించి శ్రద్ధ చూపలేదు’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘యెష్షయి కుమారుడు’ అంటే దావీదు. సౌలు ఇక్కడ దావీదు పేరును ఉపయోగించకుండా అతని తండ్రి పేరుతో పిలుస్తున్నాడు.
    reason: cultural_note
  - marker: d
    text: లేదా, ‘నా సేవకుణ్ణి నాకు వ్యతిరేకంగా మాటువేయడానికి నిలబెట్టాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: కుట్ర పన్నారు
  rationale: ఈ సందర్భంలో קשר సాధారణంగా కలిసికట్టుగా ఉండడాన్ని కాక, సౌలుకు వ్యతిరేకంగా రహస్యంగా పన్నిన కుట్రను సూచిస్తుంది.
- source_word: גֹּלֶה אֶת אָזְנִי
  choice: నాకు తెలియజేయలేదు
  rationale: అక్షరార్థంగా ‘నా చెవిని తెరవడం’ అనే హీబ్రూ నుడికారం సమాచారాన్ని వెల్లడించడం లేదా తెలియజేయడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘తెలియజేయడం’ సహజంగా ఉంది.
- source_word: בִּכְרָת
  choice: ఒడంబడిక చేసుకున్నప్పుడు
  rationale: בְּ తో కూడిన infinitive construct కాలం లేదా సందర్భాన్ని సూచిస్తుంది. ‘ఒడంబడికను కోయడం’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా ‘ఒడంబడిక చేసుకోవడం’గా ఇచ్చాం.
- source_word: בְּנִי עִם בֶּן יִשַׁי
  choice: నా కుమారుడు యెష్షయి కుమారునితో
  rationale: ‘నా కుమారుడు’ యోనాతానును సూచిస్తుంది; సౌలు దావీదు పేరును పలకకుండా ‘యెష్షయి కుమారుడు’ అంటున్న దూరీకరణ ధోరణిని అనువాదంలో నిలిపాం.
- source_word: חֹלֶה ... עָלַי
  choice: నా విషయంలో బాధపడలేదు
  rationale: ఇక్కడ חלה శారీరక అనారోగ్యాన్ని కాక, సౌలు పట్ల సానుభూతితో కలిగే బాధ లేదా శ్రద్ధను సూచిస్తుంది. ‘బాధపడడం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הֵקִים
  choice: లేపాడు
  rationale: మూలంలోని ‘లేపడం/నిలబెట్టడం’ అనే రూపకాన్ని నిలిపి, సౌలు ఆరోపిస్తున్న విరోధ చర్యను సందర్భం స్పష్టం చేసేలా ఉంచాం; ‘రెచ్చగొట్టాడు’ అనే అర్థాన్ని అనవసరంగా ఖరారు చేయలేదు.
- source_word: עַבְדִּי
  choice: నా సేవకుణ్ణి
  rationale: ఇక్కడ עבד రాజసేవలో ఉన్న అధీనస్థుడైన దావీదును సూచిస్తుంది; ‘సేవకుడు’ రాజకీయ-సామాజిక సంబంధానికి తగినది.
- source_word: לְאֹרֵב
  choice: పొంచి ఉండేలా
  rationale: ארב దాడి కోసం మాటువేసి లేదా పొంచి ఉండడాన్ని సూచిస్తుంది. వాక్య నిర్మాణంలో ‘పొంచి ఉండేలా’ సహజంగా సరిపోతుంది.
- source_word: כַּיּוֹם הַזֶּה
  choice: ఈనాడు ఉన్నట్టుగా
  rationale: ఈ నాటి పరిస్థితి సౌలు చేసిన ఆరోపణకు నిదర్శనమని సూచించే హీబ్రూ ప్రయోగాన్ని సంక్షిప్తంగా, గంభీరంగా నిలిపాం.
theological_decisions:
- issue: సౌలు చేసిన ఆరోపణ వాస్తవమా లేక అతని అనుమానమా
  choice: ఆరోపణను సౌలు మాటగానే అనువదించాం; దాని నిజానిజాలను అనువాదం నిర్ణయించలేదు.
  alternative: దావీదు నిజంగా సౌలుపై దాడి చేయడానికి పొంచి ఉన్నాడని స్పష్టీకరించడం.
  rationale: హీబ్రూ పాఠ్యం ఇక్కడ సౌలు పలికిన ఆరోపణను నమోదు చేస్తుంది. కథనకర్త ఆ ఆరోపణను ఈ వాక్యంలో ధృవీకరించడు; కాబట్టి ఆ ఉద్రిక్తతను అలాగే ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజసభలో సౌలు పలికే నిందారోపణకు తగిన గంభీర స్వరం పాటించబడింది. ‘యెష్షయి కుమారుడు,’ ‘నా సేవకుడు,’ ‘ఈనాడు’ వంటి పదబంధాలు మూలంలోని దూరీకరణ, అధికారం, వాక్చాతుర్యాన్ని నిలుపుతాయి.
