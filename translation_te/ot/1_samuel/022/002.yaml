source:
  edition: WLC
  text: וַ/יִּֽתְקַבְּצ֣וּ אֵ֠לָי/ו כָּל אִ֨ישׁ מָצ֜וֹק וְ/כָל אִ֨ישׁ אֲשֶׁר ל֤/וֹ נֹשֶׁא֙ וְ/כָל אִ֣ישׁ מַר נֶ֔פֶשׁ וַ/יְהִ֥י עֲלֵי/הֶ֖ם לְ/שָׂ֑ר וַ/יִּהְי֣וּ עִמּ֔/וֹ כְּ/אַרְבַּ֥ע מֵא֖וֹת אִֽישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/002.yaml
  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
translation:
  language: te
  text: కష్టాల్లో ఉన్నవారందరూ, అప్పుల్లో ఉన్నవారందరూ[a], మనసులో చేదు ఉన్నవారందరూ[b] అతని దగ్గరకు సమకూడారు. అతడు వారికి నాయకుడయ్యాడు. దాదాపు నాలుగు వందల మంది పురుషులు అతనితో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘రుణదాత లేదా వసూలుదారు ఉన్న ప్రతి వ్యక్తి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘ప్రాణంలో చేదుగా ఉన్నవారు’; ఇది తీవ్రమైన అంతరంగ వేదన లేదా కసిని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  choice: అతని దగ్గరకు సమకూడారు
  rationale: ఈ రూపం ప్రజలు ఒకరి దగ్గరకు వచ్చి గుంపుగా చేరడాన్ని సూచిస్తుంది. ‘సమకూడారు’ సమూహంగా చేరడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; אֵלָיו లోని గమనదిశను ‘అతని దగ్గరకు’ నిలుపుతుంది.
- source_word: כָּל אִישׁ מָצוֹק
  choice: కష్టాల్లో ఉన్నవారందరూ
  rationale: מָצוֹק ఒత్తిడి, ఇరుకు పరిస్థితి, ఆపద వంటి విస్తృత కష్టస్థితిని సూచిస్తుంది. ‘కష్టాల్లో’ సామాజిక, ఆర్థిక లేదా వ్యక్తిగత ఇబ్బందులను ముందుగానే పరిమితం చేయకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כָל אִישׁ אֲשֶׁר לוֹ נֹשֶׁא
  choice: అప్పుల ఒత్తిడిలో ఉన్నవారందరూ
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ఒక రుణదాత లేదా వసూలుదారు ఉన్నవారిని సూచిస్తుంది. సందర్భార్థమైన అప్పును, ఆ రుణదాత కలిగించే ఒత్తిడిని రెండింటినీ ఈ అనువాదం సహజంగా అందిస్తుంది; అక్షరార్థ నిర్మాణాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: מַר נֶפֶשׁ
  choice: మనసులో చేదు నిండిన వారందరూ
  rationale: ఈ హీబ్రూ నుడికారం అక్షరార్థంగా ‘ప్రాణంలో/అంతరంగంలో చేదుగా ఉన్నవారు’ అని చెబుతుంది. ‘మనసులో చేదు నిండిన’ అనే రూపం మూలభాష చిత్రాన్ని నిలుపుతూ తీవ్ర అంతరంగ వేదన లేదా కసిని సూచిస్తుంది.
- source_word: וַיְהִי עֲלֵיהֶם לְשָׂר
  choice: అతడు వారికి అధిపతి అయ్యాడు
  rationale: שַׂר నాయకుడు, అధికారి లేదా సైనిక దళాధిపతిని సూచించవచ్చు. ‘అధిపతి’ ఈ నాయకత్వ సంబంధాన్ని నిలుపుతుంది; ‘సేనాధిపతి’ అని మరీ నిర్దిష్టంగా పరిమితం చేయదు.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: దాదాపు నాలుగు వందల మంది
  rationale: ఉపసర్గ כְּ ఇక్కడ సుమారు అనే భావాన్ని ఇస్తుంది. ‘దాదాపు’ ఆ అంచనాను స్పష్టంగా తెలియజేస్తుంది; సందర్భంలో వీరు దావీదు దళంలోని పురుషులే అయినప్పటికీ తెలుగులో సంఖ్యతో ‘మంది’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: מַר נֶפֶשׁ అనే నుడికారంలో భావస్థితి
  choice: మనసులో చేదు నిండిన
  alternative: తీవ్ర మనోవేదనలో ఉన్న / అసంతృప్తులైన
  rationale: ఒకే నిర్దిష్ట మానసిక లేదా నైతిక స్థితిగా నిర్ణయించకుండా, అంతరంగ చేదు, వేదన, కసి అన్న భావసాధ్యతలను మూలభాషలాగే తెరిచి ఉంచింది.
- issue: שַׂר యొక్క నాయకత్వ స్వరూపం
  choice: అధిపతి
  alternative: సేనాధిపతి / నాయకుడు
  rationale: సందర్భం సైనిక బృందాన్ని సూచించినా, మూలపదం విస్తృతార్థమైంది. ‘అధిపతి’ అధికార నాయకత్వాన్ని తెలియజేస్తూ పదాన్ని అవసరానికి మించి సైనిక హోదాగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గంభీరమైన కథన శైలిని వాడాం. మూలంలోని మూడు సార్లు వచ్చే כָּל אִישׁ నిర్మాణాన్ని ‘వారందరూ’ అనే పునరుక్తితో నిలిపాం. సర్వనామాన్ని మూలంలాగే ‘అతడు/అతని’గా ఉంచి, ఈ వచనంలో పేరును చేర్చలేదు.
