- from: కష్టాల్లో ఉన్నవారందరూ, అప్పుల ఒత్తిడిలో ఉన్నవారందరూ[a], మనసులో చేదు నిండిన వారందరూ[b] అతని దగ్గరకు సమకూడారు. అతడు వారికి అధిపతి అయ్యాడు. దాదాపు నాలుగు వందల మంది అతనితో ఉన్నారు.
