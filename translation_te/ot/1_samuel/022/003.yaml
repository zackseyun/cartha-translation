id: 1SA.22.3
reference: 1 Samuel 22:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֧לֶךְ דָּוִ֛ד מִ/שָּׁ֖ם מִצְפֵּ֣ה מוֹאָ֑ב וַ/יֹּ֣אמֶר אֶל מֶ֣לֶךְ מוֹאָ֗ב יֵֽצֵא נָ֞א אָבִ֤/י וְ/אִמִּ/י֙ אִתְּ/כֶ֔ם עַ֚ד אֲשֶׁ֣ר אֵדַ֔ע מַה יַּֽעֲשֶׂה לִּ֖/י אֱלֹהִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/003.yaml
  text: Then David went from there to Mizpeh of Moab[a], and he said to the king of Moab[b], “Please let my father and my mother come out and stay with you until I know what God will do for me.”
translation:
  language: te
  text: అప్పుడు దావీదు అక్కడి నుంచి మోయాబు దేశంలోని మిస్పేకు వెళ్లి, మోయాబు రాజుతో, “దయచేసి నా తండ్రి, నా తల్లి మీ దగ్గరకు వచ్చి, దేవుడు నా విషయంలో ఏమి చేస్తాడో నేను తెలుసుకునే వరకు మీతో ఉండనివ్వండి[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మీ దగ్గరకు వచ్చి, ... మీతో ఉండనివ్వండి” — హీబ్రూ క్రియకు అక్షరార్థంగా “బయటికి రానివ్వండి” లేదా “బయటికి వెళ్లనివ్వండి” అని కూడా అనువదించవచ్చు. ఇక్కడ వారు మోయాబు రాజు సంరక్షణలో ఉండాలనేది భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... מִשָּׁם
  choice: అక్కడి నుంచి ... వెళ్లి
  rationale: వరుసగా జరిగిన సాధారణ ప్రయాణాన్ని తెలిపే హీబ్రూ కథన రూపాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: מִצְפֵּה מוֹאָב
  choice: మోయాబు దేశంలోని మిస్పేకు
  rationale: స్థలనామాన్ని లిప్యంతరీకరిస్తూ, అది మోయాబుకు చెందిన ప్రదేశమని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מֶלֶךְ מוֹאָב
  choice: మోయాబు రాజుతో
  rationale: రాజును సూచించే హీబ్రూ సమాస పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: יֵצֵא נָא
  choice: దయచేసి ... మీ దగ్గరకు వచ్చి ... ఉండనివ్వండి
  rationale: יֵצֵא అనే క్రియకు అక్షరార్థంగా ‘బయలుదేరి రావడం/వెళ్లడం’ అనే భావం ఉంది; సందర్భంలో దావీదు తన తల్లిదండ్రులను రాజు సంరక్షణలో ఉండనివ్వమని కోరుతున్నాడు. అనువాదం కదలికనూ, ఉద్దేశించిన నివాసాన్నీ నిలుపుతుంది.
- source_word: אָבִי וְאִמִּי
  choice: నా తండ్రి, నా తల్లి
  rationale: మూలంలో ఇద్దరినీ విడివిడిగా పేర్కొన్న రూపాన్నీ ప్రాధాన్యాన్నీ కాపాడుతుంది.
- source_word: אִתְּכֶם
  choice: మీతో
  rationale: హీబ్రూలో సర్వనామం బహువచనమైనది; గౌరవార్థక తెలుగు ‘మీతో’ రాజుతోపాటు అతని పరివారాన్ని కూడా సూచించగలదు.
- source_word: עַד אֲשֶׁר אֵדַע
  choice: నేను తెలుసుకునే వరకు
  rationale: వారు అక్కడ ఉండవలసిన కాలపరిమితిని మూలానికి దగ్గరగా, సహజంగా తెలుపుతుంది.
- source_word: מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: దేవుడు నా విషయంలో ఏమి చేస్తాడో
  rationale: לִי వల్ల కలిగే ‘నాకు/నా కోసం/నా విషయంలో’ అనే విస్తృత భావాన్ని ఒకే సానుకూల ఫలితంగా పరిమితం చేయకుండా కాపాడుతుంది.
theological_decisions:
- issue: దావీదు మాటల్లో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: దేవుళ్లు; ఒక దేవుడు
  rationale: నామవాచకం రూపరీత్యా బహువచనమైనా, దానితో ఉన్న క్రియ ఏకవచనంలో ఉంది; ఈ సందర్భంలో అది ఇశ్రాయేలు దేవుణ్ణే సూచిస్తుంది.
- issue: מַה יַּעֲשֶׂה לִּי లో దేవుని చర్య స్వభావం
  choice: నా విషయంలో ఏమి చేస్తాడో
  alternative: నా కోసం ఏమి చేస్తాడో; నాకు ఏమి చేస్తాడో
  rationale: దేవుని చర్య తప్పనిసరిగా అనుకూలమైనదని ముందుగానే నిర్ణయించకుండా, హీబ్రూ దత్తివాచక ప్రయోగంలోని భావసందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. ‘నా విషయంలో’ అనే ప్రయోగం దేవుడు దావీదు కోసం, అతనికి, లేదా అతని సంబంధంగా ఏమి చేస్తాడనే మూలంలోని విస్తృతతను నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
