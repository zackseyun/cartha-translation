base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
translation:
  language: te
  text: 'సౌలు అతనితో ఇలా అన్నాడు: “నీవు, యెస్సయి కుమారుడు నాకు విరోధంగా ఎందుకు కుట్ర పన్నారు? నీవు అతనికి రొట్టెను, ఖడ్గాన్ని ఇచ్చి, అతని కోసం దేవుని వద్ద విచారించి, ఈనాడు ఉన్నట్లుగా అతడు నాకు విరోధంగా లేచి మాటువేయడానికి ఎందుకు చేశావు?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నీవు అతనికి రొట్టెను, ఖడ్గాన్ని ఇచ్చి, అతని కోసం దేవుని వద్ద విచారించినందువల్ల, ఈనాడు ఉన్నట్లుగా అతడు నాకు విరోధంగా లేచి మాటువేస్తున్నాడు.”'
    reason: లָקוּם ... לְאֹרֵב అనే నిర్మాణం ఉద్దేశాన్ని గానీ, సౌలు దృష్టిలో ప్రస్తుతం కనిపిస్తున్న ఫలితాన్ని గానీ సూచించగలదు.
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: కుట్ర చేశారు
  rationale: రాజుకు వ్యతిరేకంగా రహస్యంగా కలిసిపోవడం అనే రాజకీయ, శత్రుత్వ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֶן־יִשָׁי
  choice: యెస్సయి కుమారుడు
  rationale: దావీదు పేరు బదులు సౌలు వాడిన పితృనామాన్ని నిలుపుతూ, అతని దూరీకరణతో కూడిన తృణీకార స్వరాన్ని సంరక్షిస్తుంది.
- source_word: בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב
  choice: నీవు అతనికి రొట్టెను, ఖడ్గాన్ని ఇచ్చి
  rationale: ב ఉపసర్గతో ఉన్న క్రియానామ రూపం సూచించే సాధనాన్ని లేదా అనుబంధ పరిస్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  choice: అతని కోసం దేవుని దగ్గర విచారణ చేసి
  rationale: యాజకుని ద్వారా దైవ మార్గదర్శకత్వం కోరే సందర్భాన్ని ‘విచారణ చేసి’ స్పష్టంగా తెలియజేస్తుంది; అహీమెలెకు దావీదు పక్షాన అడిగాడనే భావాన్ని కూడా నిలుపుతుంది.
- source_word: בֵּאלֹהִים
  choice: దేవుని దగ్గర
  rationale: మూలంలో ఉన్న אֱלֹהִיםను అనుసరిస్తుంది; యెహోవా అనే దైవనామాన్ని చేర్చదు.
- source_word: לָקוּם אֵלַי
  choice: అతడు నాకు విరోధంగా లేచి
  rationale: సౌలు ఆరోపణలోని తిరుగుబాటు భావాన్ని నిలుపుతుంది. ఈ క్రియానామం ఉద్దేశం లేదా ఫలితం రెండింటినీ సూచించగలదు.
- source_word: לְאֹרֵב
  choice: మాటువేయడానికి
  rationale: దాడి కోసం దాగి వేచి ఉండే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; మూలంలోని క్రియానామ రూపాన్ని కాపాడుతుంది.
- source_word: כַּיּוֹם הַזֶּה
  choice: ఈ రోజు జరుగుతున్నట్టుగా
  rationale: సౌలు దృష్టిలో ఆరోపిత కుట్ర ప్రస్తుతం ప్రత్యక్షమైందనే కాలసూచనను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: בֵּאלֹהִיםలో దేవుని సూచన
  choice: దేవుడు
  alternative: యెహోవా
  rationale: మూలపాఠంలో దైవనామమైన YHWH కాక אֱלֹהִים ఉంది; అందువల్ల ‘దేవుడు’ అని అనువదించడం మూలానికి నిబద్ధమైనది.
- issue: לָקוּם אֵלַי לְאֹרֵב యొక్క ఉద్దేశం/ఫలితం
  choice: లేచి మాటువేయడానికి
  alternative: లేచి మాటువేస్తున్నాడు
  rationale: హీబ్రూ క్రియానామాలు ఉద్దేశం లేదా ఫలితాన్ని అనుమతిస్తాయి. ప్రధాన పాఠం ఉద్దేశార్థాన్ని సహజంగా ఉంచగా, పాదటిప్పణి ఫలితార్థాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘యెస్సయి కుమారుడు’ అనే ఉద్దేశపూర్వక పితృనామం, ‘దేవుడు’ అనే మూలపద భేదం, అలాగే ఉద్దేశం/ఫలితం మధ్య ఉన్న అస్పష్టత సంరక్షించబడ్డాయి.
