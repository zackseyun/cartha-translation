  text: הַ/יּ֧וֹם הַחִלֹּ֛תִי ל/שאול ל֥/וֹ בֵ/אלֹהִ֖ים חָלִ֣ילָ/ה לִּ֑/י אַל יָשֵׂם֩ הַ/מֶּ֨לֶךְ בְּ/עַבְדּ֤/וֹ דָבָר֙ בְּ/כָל בֵּ֣ית אָבִ֔/י כִּ֠י לֹֽא יָדַ֤ע עַבְדְּ/ךָ֙ בְּ/כָל זֹ֔את דָּבָ֥ר קָטֹ֖ן א֥וֹ גָדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
translation:
  language: te
  text: “నేను అతని కోసం దేవుని వద్ద విచారణ చేయడం ఈ రోజే మొదటిసారి చేశానా?[a] అలా కానే కాదు! రాజు తన సేవకునిమీద గానీ, నా తండ్రి ఇంటివారందరిమీద గానీ ఏ అభియోగమూ మోపవద్దు. ఎందుకంటే ఈ సంగతులన్నిటిలో చిన్న విషయమైనా పెద్ద విషయమైనా మీ సేవకునికి ఏమీ తెలియదు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత పదానుసారంగా, “నేను ఈ రోజు అతని కోసం దేవుని వద్ద విచారణ చేయడం మొదలుపెట్టానా?” ఈ అలంకారిక ప్రశ్న, అహీమెలెకు ఇంతకుముందు కూడా ఇలా చేశాడని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַחִלֹּתִי
  choice: నేను ఈ రోజే మొదలుపెట్టానా?
  rationale: హీబ్రూ రూపాన్ని ప్రశ్నగానే ఉంచుతూ, సందర్భంలోని అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇది అంతకుముందు చేయని కొత్త పని కాదనే భావం సందర్భం ద్వారా తెలుస్తుంది.
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  choice: అతని కోసం దేవుని దగ్గర విచారణ చేయడం
  rationale: దేవుని మార్గదర్శకత్వం లేదా దైవోక్తిని కోరడాన్ని ‘విచారణ చేయడం’ సూచిస్తుంది; לוֹ లోని ప్రయోజనార్థక భావాన్ని ‘అతని కోసం’ నిలుపుతుంది.
- source_word: חָלִילָה לִּי
  choice: అలా ఎన్నటికీ కాదు!
  rationale: బలమైన నిరాకరణను సహజమైన, గంభీరమైన తెలుగులో తెలియజేస్తుంది; మూలంలోని ఆశ్చర్యార్థక తీవ్రతను నిలుపుతుంది.
- source_word: אַל יָשֵׂם ... דָבָר
  choice: ఏ నేరాన్నీ మోపవద్దు
  rationale: ఒకరి మీద అభియోగం లేదా అపరాధాన్ని ఉంచడం అనే సందర్భోచిత న్యాయార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּעַבְדּוֹ
  choice: తన సేవకుని మీద
  rationale: రాజుతో మాట్లాడుతున్న అహీమెలెకు వినయపూర్వక స్వీయసూచనను, అలాగే ב యొక్క వ్యతిరేక లేదా అభియోగ సంబంధాన్ని నిలుపుతుంది.
- source_word: בְּכָל בֵּית אָבִי
  choice: నా తండ్రి ఇంటివారందరి మీద
  rationale: ‘తండ్రి ఇల్లు’ అనే హీబ్రూ కుటుంబ లేదా వంశగృహ భావాన్ని సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే రీతిలో అందిస్తుంది.
- source_word: לֹא יָדַע עַבְדְּךָ בְּכָל זֹאת
  choice: ఈ మొత్తం విషయం గురించి మీ సేవకునికి ఏమీ తెలియదు
  rationale: ఆ వ్యవహారం అంతటినీ గురించి తనకు జ్ఞానం లేదనే సంపూర్ణ నిరాకరణను, రాజు ఎదుటి వినయపూర్వక సంబోధనతో సహా నిలుపుతుంది.
- source_word: דָּבָר קָטֹן אוֹ גָדוֹל
  choice: చిన్నదైనా పెద్దదైనా
  rationale: ఏ స్థాయిలోనూ ఏమీ తెలియదని తెలిపే హీబ్రూ సమగ్రతా ప్రయోగాన్ని దాని పరిమాణ వ్యత్యాసంతో సహా కాపాడుతుంది.
theological_decisions:
- issue: అలంకారిక ప్రశ్నలోని అంతర్నిహిత భావం
  choice: ప్రధాన వాక్యంలో ప్రశ్నను యథాతథంగా ఉంచి, దాని సందర్భార్థాన్ని పాదసూచికలో వివరించడం
  alternative: ‘ఇది నేను అతని కోసం దేవుని దగ్గర విచారణ చేయడం మొదటిసారి కాదు’ అని ప్రకటనగా మార్చడం
  rationale: ప్రశ్నారూపంలోని వక్తృత్వ బలాన్ని, అలాగే ‘ఈ రోజే మొదలుపెట్టానా?’ అనే మూలభాషా నిర్మాణాన్ని కాపాడుతూ, అది గతంలోనూ జరిగినదనే సందర్భార్థాన్ని పాఠకునికి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజసభ సందర్భానికి తగిన గంభీరతను ఉంచాం. ‘సేవకుడు’ అనే వినయపూర్వక స్వీయసూచనను రెండుచోట్లా నిలిపాం; కుటుంబ లేదా వంశగృహ భావానికి ‘తండ్రి ఇంటివారు’ అని స్పష్టమైన సాధారణ ప్రయోగాన్ని ఎంచుకున్నాం.
