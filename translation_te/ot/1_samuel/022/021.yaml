  yaml_path: translation/ot/1_samuel/022/021.yaml
  text: Abiathar told David that Saul had killed the priests of Yahweh.
translation:
  language: te
  text: అబ్యాతారు దావీదుకు సౌలు యాహ్వే యాజకులను చంపాడని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: చెప్పాడు
  rationale: נגד హిఫిల్ రూపం ఇక్కడ ఒక విషయాన్ని తెలియజేయడం అనే అర్థం ఇస్తుంది. ఆధునిక తెలుగులో ‘చెప్పాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֶבְיָתָר
  choice: అబ్యాతారు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సులభంగా పలికే సంప్రదాయ రూపంలో లిప్యంతరీకరించాం.
- source_word: לְדָוִד
  choice: దావీదుతో
  rationale: లְ ఉపసర్గ సూచించే గ్రహీతను తెలుగు వాక్య నిర్మాణంలో ‘దావీదుతో ... చెప్పాడు’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: כִּי
  choice: అని
  rationale: ఇది అబ్యాతారు తెలిపిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో పరోక్ష వాక్యానికి ‘అని’ సహజమైన అనుసంధానం.
- source_word: הָרַג
  choice: చంపాడని
  rationale: הרג ఇక్కడ ప్రాణం తీయడం అనే సాధారణ అర్థంలో ఉంది. అబ్యాతారు చెప్పకముందే జరిగిన చర్య అనే కాలక్రమం సందర్భం ద్వారా స్పష్టమవుతుంది; తెలుగులో ప్రత్యేక భూతపూర్వ రూపం అవసరం లేదు.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగులో స్థిరపడిన రూపాన్ని ఉపయోగించాం.
- source_word: כֹּהֲנֵי יְהוָה
  choice: యెహోవా యాజకులను
  rationale: హీబ్రూ సమాస సంబంధాన్ని తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో వ్యక్తం చేశాం; את్ కారణంగా వచ్చిన ప్రత్యక్ష కర్మను ‘యాజకులను’గా గుర్తించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా ఇవ్వాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; అందువల్ల ‘ప్రభువు’ వంటి బిరుదుతో మార్చలేదు. ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం, అయితే ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గంభీరంగా, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. మూల వాక్యంలో ఉన్న నివేదిక స్వరూపాన్ని నేరుగా నిలిపాం.
