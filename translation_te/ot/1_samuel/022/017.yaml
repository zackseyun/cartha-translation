  text: וַ/יֹּ֣אמֶר הַ/מֶּ֡לֶךְ לָ/רָצִים֩ הַ/נִּצָּבִ֨ים עָלָ֜י/ו סֹ֥בּוּ וְ/הָמִ֣יתוּ כֹּהֲנֵ֣י יְהוָ֗ה כִּ֤י גַם יָדָ/ם֙ עִם דָּוִ֔ד וְ/כִ֤י יָֽדְעוּ֙ כִּֽי בֹרֵ֣חַ ה֔וּא וְ/לֹ֥א גָל֖וּ אֶת אזנ/ו וְ/לֹֽא אָב֞וּ עַבְדֵ֤י הַ/מֶּ֨לֶךְ֙ לִ/שְׁלֹ֣חַ אֶת יָדָ֔/ם לִ/פְגֹ֖עַ בְּ/כֹהֲנֵ֥י יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
translation:
  language: te
  text: అప్పుడు రాజు తన చుట్టూ నిలబడి ఉన్న పరుగువారితో[a], “యాజకుల మీదికి తిరిగి యాహ్వే యాజకులను చంపండి. ఎందుకంటే వారు కూడా దావీదు పక్షాన ఉన్నారు[b], అతడు పారిపోతున్నాడని తెలిసినా వారు నాకు తెలియజేయలేదు” అన్నాడు. అయితే రాజు సేవకులు యాహ్వే యాజకుల మీద చేయి చాచి దాడి చేయడానికి ఇష్టపడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘పరుగెత్తువారు’; రాజు సమక్షంలో సేవచేసే రక్షకులు లేదా దూతలను ఈ పదం సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘వారి చేయి కూడా దావీదుతో ఉంది’; అంటే వారు దావీదుకు మద్దతుగా లేదా అతని పక్షాన ఉన్నారని భావం.
    reason: idiom
lexical_decisions:
- source_word: לָרָצִים
  choice: పరుగువారితో
  rationale: మూలంలోని ‘పరుగెత్తువారు’ అనే రాజసభా పదవిని నిలుపుతుంది; సందర్భంలో వీరు రాజు పరివారంలోని రక్షకులు లేదా దూతలు కావచ్చు.
- source_word: הַנִּצָּבִים עָלָיו
  choice: తన చుట్టూ నిలబడి ఉన్న
  rationale: రాజు సమక్షంలో అతని వద్ద నిలిచి సేవచేస్తున్న పరివారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: סֹבּוּ וְהָמִיתוּ
  choice: తిరిగి ... చంపండి
  rationale: ఆజ్ఞలోని ప్రత్యక్షతను, క్రూరత్వాన్ని తగ్గించకుండా తెలియజేస్తుంది.
- source_word: כִּי גַם יָדָם עִם דָּוִד
  choice: వారు కూడా దావీదు పక్షాన ఉన్నారు
  rationale: ‘వారి చేయి దావీదుతో ఉంది’ అనే హీబ్రూ నుడికారానికి ఉద్దేశించిన మద్దతు లేదా పక్షపాత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְכִי יָדְעוּ כִּי בֹרֵחַ הוּא
  choice: అతడు పారిపోతున్నాడని తెలిసినా
  rationale: בֹרֵחַ అనే వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను నిలుపుతుంది.
- source_word: וְלֹא גָלוּ אֶת־אָזְנוֹ
  choice: వారు నాకు తెలియజేయలేదు
  rationale: ‘అతని చెవిని బయలుపరచలేదు’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో స్పష్టంగా అనువదిస్తుంది; మాటలాడుతున్నవాడు రాజే కాబట్టి ‘నాకు’ సరిపోతుంది.
- source_word: וְלֹא אָבוּ
  choice: ఇష్టపడలేదు
  rationale: చేయడానికి సమ్మతించకపోవడం లేదా సిద్ధపడకపోవడం అనే אבה భావాన్ని కాపాడుతుంది.
- source_word: לִשְׁלֹחַ אֶת־יָדָם לִפְגֹעַ
  choice: చేయి ఎత్తి వారిని హతమార్చడానికి
  rationale: ‘చేయి చాపడం’ అనే హింసాత్మక నుడికారాన్ని తెలుగులో సహజమైన ‘చేయి ఎత్తడం’తో అందించి, פגע యొక్క ప్రాణాంతక భావాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం ఒడంబడిక దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. ‘ప్రభువు’ అనే బిరుదుతో దాన్ని భర్తీ చేయకుండా, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని వాడాం.
- issue: యాజకులపై సౌలు మోపిన సహకార ఆరోపణ
  choice: వారు కూడా దావీదు పక్షాన ఉన్నారు
  alternative: వారి చేయి కూడా దావీదుతో ఉంది
  rationale: ఇది సౌలు చేసిన ఆరోపణగా మాత్రమే నిలుస్తుంది; కథకుడు దానిని నిజమని ధృవీకరించినట్లు అదనపు వ్యాఖ్యను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కథనశైలి. హీబ్రూ రాజసభా పదమైన ‘పరుగువారు’ను పాదటిప్పణితో నిలిపి, అపార్థమయ్యే హీబ్రూ నుడికారాలను ప్రధాన పాఠ్యంలో సహజమైన తెలుగులో అందించాం.
