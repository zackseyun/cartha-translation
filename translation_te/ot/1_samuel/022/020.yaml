source:
  edition: WLC
  text: וַ/יִּמָּלֵ֣ט בֵּן אֶחָ֗ד לַ/אֲחִימֶ֨לֶךְ֙ בֶּן אֲחִט֔וּב וּ/שְׁמ֖/וֹ אֶבְיָתָ֑ר וַ/יִּבְרַ֖ח אַחֲרֵ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/020.yaml
  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
translation:
  language: te
  text: అయితే అహీటూబు కుమారుడైన అహీమెలెకు ఒక కుమారుడు తప్పించుకున్నాడు. అతని పేరు అబ్యాతారు. అతడు దావీదు వెంబడి పారిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు దగ్గరికి పారిపోయాడు.” హీబ్రూలో అక్షరార్థంగా “దావీదు వెంబడి పారిపోయాడు” అని ఉంది; ఇది అతనితో చేరడానికి దావీదును అనుసరించి వెళ్లాడనే అర్థాన్ని ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵט
  choice: తప్పించుకున్నాడు
  rationale: నిఫల్ రూపం ఇంతకుముందు వివరించిన సంహారం నుంచి విజయవంతంగా తప్పించుకోవడాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ఈ భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: בֵּן אֶחָד
  choice: కుమారుల్లో ఒకడు
  rationale: అక్షరార్థంగా ‘ఒక కుమారుడు.’ తెలుగు వాక్యంలో సంబంధాన్ని స్పష్టంగా, సహజంగా చూపుతూ ఒక్క కుమారుడే తప్పించుకున్నాడనే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: לַאֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: అహీటూబు కుమారుడైన అహీమెలెకు
  rationale: ל ఉపసర్గ ఇక్కడ కుటుంబ సంబంధాన్ని సూచిస్తుంది. హీబ్రూ వంశపరమైన గుర్తింపును తెలుగులో సహజ క్రమంలో నిలుపుతుంది.
- source_word: וּשְׁמוֹ אֶבְיָתָר
  choice: అతని పేరు అబ్యాతారు
  rationale: సరళమైన నామకరణ వాక్యాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּבְרַח
  choice: పారిపోయాడు
  rationale: ברח అంటే పారిపోవడం. ముందున్న מלטకు వాడిన ‘తప్పించుకున్నాడు’ అనే పదంతో భేదాన్ని కాపాడుతుంది.
- source_word: אַחֲרֵי דָוִד
  choice: దావీదు వెనుకగా
  rationale: אַחֲרֵי యొక్క అక్షరార్థమైన ‘వెనుక/తర్వాత’ భావాన్ని నిలుపుతుంది; సందర్భంలో దావీదును అనుసరించి అతనితో చేరడానికి వెళ్లాడనే అర్థం ఉండవచ్చు.
- source_word: וַ
  choice: అయితే
  rationale: మునుపటి సంహారానికి విరుద్ధంగా ఒకడు తప్పించుకున్నాడనే స్వల్ప వ్యత్యాసాన్ని ప్రారంభ వావ్ సందర్భంలో తెలియజేస్తుంది.
- source_word: אֶבְיָתָר
  choice: అబ్యాతారు
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: אֲחִימֶלֶךְ
  choice: అహీమెలెకు
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: אֲחִיטוּב
  choice: అహీటూబు
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
theological_decisions:
- issue: אַחֲרֵי דָוִד అనే పదబంధం గమ్యాన్ని సూచిస్తుందా లేక అనుసరణను సూచిస్తుందా
  choice: దావీదు వెనుకగా
  alternative: దావీదు దగ్గరికి
  rationale: మూలంలోని ‘వెనుక/తర్వాత’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దావీదుతో చేరడానికి అతని వెంట వెళ్లాడనే సందర్భార్థాన్ని పాదసూచికలో తెలియజేయడం ద్వారా నిజమైన భాషాపరమైన సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు చిన్న వాక్యాలుగా విభజించాం; సంఘటనల క్రమం మాత్రం నిలుపబడింది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
