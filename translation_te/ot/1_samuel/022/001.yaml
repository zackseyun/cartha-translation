translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ అనువదించబడింది. కథన క్రమం, స్థలదిశ, కుటుంబ సంబంధం మూలానికి దగ్గరగా ఉంచబడ్డాయి. ఇచ్చిన ఆంగ్ల పాదసూచిక గుర్తు వాక్యంలోని ‘heard’ వద్ద ఉండగా దాని పాఠం వాస్తవానికి ‘escaped’ గురించినదిగా అసంగతంగా ఉంది; మూల హీబ్రూ భావాన్ని ప్రధాన పాఠంలో స్పష్టంగా తెలిపినందున పాదసూచిక చేర్చలేదు.
