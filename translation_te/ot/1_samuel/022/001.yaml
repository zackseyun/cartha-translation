revisions:
- from: కాబట్టి దావీదు అక్కడి నుంచి వెళ్లి అదుల్లాము గుహకు తప్పించుకున్నాడు. అతని సహోదరులు, అతని తండ్రి ఇంటివారందరూ అది విని, అక్కడ అతని దగ్గరికి దిగివచ్చారు.
  to: దావీదు అక్కడి నుంచి వెళ్లి అదుల్లాము గుహకు తప్పించుకున్నాడు. అతని సోదరులు, అతని తండ్రి ఇంటివారందరూ ఈ సంగతి విని, అక్కడ అతని దగ్గరికి దిగివచ్చారు.
  rationale: 'The revision removes the non-source-based causal ‘కాబట్టి,’ retains the sequential narrative movement, and expresses the implicit object of ‘heard’ naturally in Telugu. No footnote is needed: the lexical ambiguity of ‘escaped/fled’ is adequately represented by ‘తప్పించుకున్నాడు,’ and the English audit footnote’s anchor is internally mismatched and should not be reproduced.'
