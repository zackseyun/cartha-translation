id: 1SA.22.1
reference: 1 Samuel 22:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֤לֶךְ דָּוִד֙ מִ/שָּׁ֔ם וַ/יִּמָּלֵ֖ט אֶל מְעָרַ֣ת עֲדֻלָּ֑ם וַ/יִּשְׁמְע֤וּ אֶחָי/ו֙ וְ/כָל בֵּ֣ית אָבִ֔י/ו וַ/יֵּרְד֥וּ אֵלָ֖י/ו שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
translation:
  language: te
  text: దావీదు అక్కడి నుంచి వెళ్లి అదుల్లాము గుహకు తప్పించుకున్నాడు. అతని సోదరులు, అతని తండ్రి ఇంటివారందరూ ఈ సంగతి విని, అక్కడ అతని దగ్గరికి దిగివచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: הלך అనే సాధారణ కథన గమన క్రియను సహజమైన తెలుగు వరుసక్రియగా అనువదించింది.
- source_word: מִשָּׁם
  choice: అక్కడి నుంచి
  rationale: మునుపటి స్థలం నుంచి బయలుదేరినట్లు సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וַיִּמָּלֵט
  choice: తప్పించుకున్నాడు
  rationale: מלט నిఫాల్ రూపంలోని ప్రమాదం నుంచి విజయవంతంగా తప్పించుకోవడం అనే ఫలితార్థాన్ని నిలుపుతుంది; కేవలం పారిపోవడం కంటే స్పష్టమైనది.
- source_word: מְעָרַת עֲדֻלָּם
  choice: అదుల్లాము గుహకు
  rationale: స్థలనామంతో కూడిన సమాసాన్ని నేరుగా, తెలుగు విభక్తి నిర్మాణానికి అనుగుణంగా అందించింది.
- source_word: וַיִּשְׁמְעוּ
  choice: అది విని
  rationale: హీబ్రూలో కర్మ స్పష్టంగా చెప్పబడకపోయినా, దావీదు అక్కడికి చేరిన సంగతి విన్నారనే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶחָיו
  choice: అతని సహోదరులు
  rationale: పురుష బహువచనమైన మూలపదాన్ని గౌరవప్రదమైన, స్పష్టమైన ఆధునిక తెలుగు పదంతో అందించింది.
- source_word: כָל־בֵּית אָבִיו
  choice: అతని తండ్రి ఇంటివారందరూ
  rationale: בֵּית אָבִיו భౌతిక గృహాన్ని కాక పితృకుటుంబం లేదా ఇంటివారిని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ సామాజిక-కుటుంబ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּרְדוּ
  choice: దిగివచ్చారు
  rationale: ירד లోని కిందికి కదలికను నిలుపుతూ, దావీదు ఉన్న చోటుకు రావడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵלָיו שָׁמָּה
  choice: అక్కడ అతని దగ్గరికి
  rationale: దావీదు వైపు దిశను, అతడు ఉన్న స్థలాన్ని రెండింటినీ తెలుగు పదక్రమంలో స్పష్టంగా నిలుపుతుంది.
