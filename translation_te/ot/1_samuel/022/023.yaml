source:
  edition: WLC
  text: שְׁבָ֤/ה אִתִּ/י֙ אַל תִּירָ֔א כִּ֛י אֲשֶׁר יְבַקֵּ֥שׁ אֶת נַפְשִׁ֖/י יְבַקֵּ֣שׁ אֶת נַפְשֶׁ֑/ךָ כִּֽי מִשְׁמֶ֥רֶת אַתָּ֖ה עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/023.yaml
  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
translation:
  language: te
  text: నాతో ఉండు; భయపడకు. ఎందుకంటే నా ప్రాణం తీయాలని ప్రయత్నించేవాడు నీ ప్రాణం తీయాలని కూడా ప్రయత్నిస్తున్నాడు. నీవు నా సంరక్షణలో ఉన్నావు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నాతో నీవు కాపుదలలో ఉన్నావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה אִתִּי
  choice: నాతోనే ఉండు
  rationale: ישׁב అనే క్రియకు ప్రాథమికంగా ‘కూర్చో’ అనే అర్థం ఉన్నా, ఈ సందర్భంలో దావీదు దగ్గరే నిలిచి ఉండమనే భావం ఉంది. ‘నాతోనే ఉండు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: אַל תִּירָא
  choice: భయపడకు
  rationale: నిషేధార్థక ఆజ్ఞను సహజమైన ఏకవచన సంబోధనతో అందిస్తుంది.
- source_word: אֲשֶׁר יְבַקֵּשׁ אֶת נַפְשִׁי
  choice: నా ప్రాణం తీయాలని చూసేవాడు
  rationale: ‘ప్రాణాన్ని వెదుకు’ అనే హీబ్రూ నుడికారం ఒకరిని చంపడానికి ప్రయత్నించడాన్ని సూచిస్తుంది. పదచిత్రాన్ని పూర్తిగా యాంత్రికంగా అనువదించకుండా, ఉద్దేశాన్ని స్పష్టంగా తెలిపే తెలుగు ప్రయోగం ఎంచుకోబడింది.
- source_word: יְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: నీ ప్రాణం తీయాలని కూడా చూస్తున్నాడు
  rationale: హీబ్రూలోని సమాంతర పునరుక్తిని నిలుపుతూ, ఇద్దరికీ ఒకే శత్రువు ఉన్నాడనే సంబంధాన్ని తెలుగులో ‘కూడా’ ద్వారా స్పష్టం చేస్తుంది.
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  choice: నాతో ఉంటే నీవు సురక్షితంగా ఉంటావు
  rationale: מִשְׁמֶרֶת ఇక్కడ కాపుదల లేదా భద్రతను సూచిస్తుంది. అసాధారణమైన హీబ్రూ నామవాచక వాక్యాన్ని ఆధునిక తెలుగులో అర్థవంతంగా అందిస్తూ, దావీదు ఇచ్చిన రక్షణ హామీని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దావీదు రక్షణ హామీ యొక్క స్వరూపం
  choice: నాతో ఉంటే నీవు సురక్షితంగా ఉంటావు
  alternative: నీవు నా రక్షణలో ఉన్నావు
  rationale: మూలంలోని ‘నాతో’ అనే భావాన్ని నిలుపుతూ, దావీదు తన సమక్షంలో అబ్యాతారుకు భద్రత ఉంటుందని చెప్పిన మాటగా అనువదించబడింది. ఇది సంపూర్ణమైన దైవిక భద్రత గురించిన సిద్ధాంత ప్రకటనగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; దావీదు అబ్యాతారుతో మాట్లాడుతున్నందున సహజమైన ఏకవచన సంబోధన వాడబడింది. భాష గౌరవప్రదంగా ఉన్నప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా ఉంచబడింది.
