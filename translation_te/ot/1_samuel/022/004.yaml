  text: He brought them before the king of Moab[a], and they stayed with him all the days that David was in the stronghold.
translation:
  language: te
  text: అతడు వారిని మోయాబు రాజు సమక్షానికి తీసుకువచ్చాడు[a]. దావీదు దుర్గంలో ఉన్నంతకాలం వారు మోయాబు రాజు వద్ద నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు వారిని మోయాబు రాజు సమక్షానికి నడిపించాడు.” హీబ్రూ క్రియకు ఒకరి సమక్షానికి నడిపించడం లేదా తీసుకురావడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: అతడు వారిని ... తీసుకువచ్చాడు
  rationale: సందర్భంలో ఈ క్రియ దావీదు తన తల్లిదండ్రులను మోయాబు రాజు సమక్షానికి తీసుకురావడం లేదా నడిపించడం అనే భావాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘తీసుకువచ్చాడు’ ప్రధాన పాఠానికి తగినది; ‘నడిపించి తీసుకెళ్లాడు’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֶת־פְּנֵי
  choice: సమక్షానికి
  rationale: వ్యక్తి సన్నిధికి లేదా ఎదుటికి తీసుకురావడాన్ని సూచించే హీబ్రూ నుడికారానికి ‘సమక్షానికి’ సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: מֶלֶךְ מוֹאָב
  choice: మోయాబు రాజు
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని సహజంగా ప్రతిబింబించే ప్రత్యక్ష అనువాదం.
- source_word: וַיֵּשְׁבוּ עִמּוֹ
  choice: వారు అతని దగ్గరే ఉన్నారు
  rationale: ישב ఇక్కడ కొంతకాలం నివసించడం లేదా ఉండిపోవడం అనే భావంలో ఉంది. ‘అతని దగ్గరే ఉన్నారు’ అనేది కొనసాగిన ఆశ్రయాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל יְמֵי
  choice: ఉన్న రోజులన్నీ
  rationale: తరువాతి కాలవాచక ఉపవాక్యంతో కలిసి పేర్కొన్న మొత్తం కాలవ్యవధిని సూచిస్తుంది.
- source_word: הֱיוֹת דָּוִד
  choice: దావీదు ... ఉన్న
  rationale: היה క్రియ యొక్క infinitive construct ఇక్కడ కాలసంబంధ ఉపవాక్యంగా పనిచేస్తుంది; తెలుగులో finite రూపం సహజం.
- source_word: בַּמְּצוּדָה
  choice: దుర్గంలో
  rationale: מְצוּדָה దావీదు కథనాల్లో రక్షణనిచ్చే పటిష్ఠ స్థలాన్ని సూచిస్తుంది. ‘దుర్గం’ ఆ స్థలపు కోటసదృశ స్వభావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
