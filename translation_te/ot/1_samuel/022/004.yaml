  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు వరుస చర్యలు, కాలవ్యాప్తి, ‘దుర్గం’ అనే కథనపరమైన స్థలసూచన నిలుపబడ్డాయి.
