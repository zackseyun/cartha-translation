  yaml_path: translation/ot/1_samuel/022/016.yaml
  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
translation:
  language: te
  text: అప్పుడు రాజు, “అహీమెలెకు, నీవు, నీ తండ్రి ఇంటివారందరూ తప్పక చనిపోవాలి[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిశ్చయంగా చనిపోతావు.” హీబ్రూలో ‘చావు’ అనే క్రియను ఉద్ఘాటక రూపంతోను పరిమిత క్రియతోను కలిపి వాడటం వల్ల బలమైన నిశ్చయార్థం వ్యక్తమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అని అన్నాడు
  rationale: హీబ్రూ కథనంలో אמר యొక్క సాధారణ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగు కథనరీతిలో వ్యక్తం చేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న నామవాచకం; సందర్భంలో మాట్లాడుతున్న వ్యక్తిని రాజుగా స్పష్టంగా గుర్తిస్తుంది.
- source_word: מוֹת תָּמוּת
  choice: తప్పక చనిపోవాలి
  rationale: క్రియానామ అవ్యయం మరియు పరిమిత క్రియ కలయిక ఇచ్చే బలమైన నిశ్చయార్థాన్ని, ఈ సందర్భంలోని రాజాజ్ఞ లేదా మరణశిక్ష భావాన్ని నిలుపుతుంది.
- source_word: אֲחִימֶלֶךְ
  choice: అహీమెలెకు
  rationale: వ్యక్తి పేరును తెలుగు ధ్వని-లిపి సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: אַתָּה
  choice: నీవు
  rationale: మూలంలో ప్రత్యేకంగా ఉన్న సర్వనామం అహీమెలెకుపై పెట్టిన ఉద్ఘాటనను నిలుపుతుంది.
- source_word: וְכָל בֵּית אָבִיךָ
  choice: నీ తండ్రి ఇంటివారందరూ
  rationale: అక్షరార్థమైన ‘నీ తండ్రి ఇల్లు’ అనే హీబ్రూ నుడికారాన్ని సాధారణ పాఠకులకు స్పష్టంగా, పితృవంశ కుటుంబం లేదా ఇంటివారు అనే భావంతో అందిస్తుంది.
theological_decisions:
- issue: מוֹת תָּמוּת లోని నిశ్చయార్థం మరియు విధ్యర్థం
  choice: తప్పక చనిపోవాలి
  alternative: నిశ్చయంగా చనిపోతావు
  rationale: రూపం బలమైన నిశ్చయాన్ని సూచించినప్పటికీ, రాజు ప్రకటిస్తున్న తీర్పు సందర్భంలో తెలుగు ‘చనిపోవాలి’ విధించబడిన మరణశిక్ష భావాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ నిశ్చయార్థాన్ని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయతీర్పు ధోరణి వాడబడింది. ‘నీ తండ్రి ఇంటివారందరూ’ అనే రూపం హీబ్రూ కుటుంబ నుడికారాన్ని అర్థవంతంగా ఉంచుతుంది.
