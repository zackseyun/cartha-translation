source:
  edition: WLC
  text: וְ/אֵ֨ת נֹ֤ב עִיר הַ/כֹּֽהֲנִים֙ הִכָּ֣ה לְ/פִי חֶ֔רֶב מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מֵ/עוֹלֵ֖ל וְ/עַד יוֹנֵ֑ק וְ/שׁ֧וֹר וַ/חֲמ֛וֹר וָ/שֶׂ֖ה לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
translation:
  language: te
  text: అతడు నోబు అనే యాజకుల పట్టణాన్ని కత్తి ధారతో[a] హతమార్చాడు—పురుషుని మొదలుకొని స్త్రీ వరకు, చిన్నపిల్ల మొదలుకొని పాలుతాగే పసిబిడ్డ వరకు; ఎద్దును, గాడిదను, గొర్రెను కూడా కత్తి ధారతో హతమార్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “కత్తి నోటికి”; ఇది కత్తితో చంపడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹב
  choice: నోబు
  rationale: స్థలనామాన్ని ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עִיר הַכֹּהֲנִים
  choice: యాజకుల పట్టణమైన
  rationale: నోబును యాజకులకు చెందిన లేదా వారిచేత ప్రత్యేకంగా గుర్తింపబడిన పట్టణంగా తెలిపే నిర్మాణాన్ని సహజమైన తెలుగులో విశేషణ రూపంలో ఇచ్చాం.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: నכה అనే క్రియ విస్తృతంగా ‘కొట్టు’ అని అర్థమివ్వగలిగినా, కత్తితో మనుషులను మరియు జంతువులను సమగ్రంగా సంహరించిన ఈ సందర్భంలో ప్రాణహానిని స్పష్టంగా తెలిపే ‘హతమార్చాడు’ సహజమైన సమానార్థకం.
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  choice: కత్తివాత
  rationale: అక్షరార్థంగా ‘కత్తి నోటికి’ అనే హీబ్రూ నుడికారానికి, కత్తి ధారచేత చంపడాన్ని సూచించే సంక్షిప్తమైన, చిత్రాత్మక తెలుగు సమానం. మూలంలోని పునరుక్తిని నిలిపాం.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: పురుషుని మొదలుకొని స్త్రీ వరకు
  rationale: రెండు లింగాల వారందరినీ సూచించే హీబ్రూ సమగ్రతా ప్రయోగాన్ని ఏకవచన రూపాలతో నిలిపి, తెలుగులో సహజంగా అందించాం.
- source_word: מֵעוֹלֵל וְעַד יוֹנֵק
  choice: చిన్నపిల్ల మొదలుకొని పాలుతాగే పసిబిడ్డ వరకు
  rationale: עוֹלֵל చిన్నబిడ్డను, יוֹנֵק పాలు తాగే శిశువును సూచిస్తాయి. వయస్సులోని సున్నిత భేదాన్ని, విచక్షణలేని హత్య యొక్క భీకరతను ఈ పదాలు స్పష్టంగా నిలుపుతాయి.
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  choice: ఎద్దును, గాడిదను, గొర్రెను కూడా
  rationale: ప్రతినిధి గృహపశువుల జాబితాను ఏకవచనంలో నిలిపాం. שֶׂה గొర్రె లేదా మేక వంటి చిన్న పశువును సూచించగలిగినా, సందర్భంలో నిర్దిష్టత లేనందున సాధారణ సమానార్థకంగా ‘గొర్రె’ ఎంచుకున్నాం; ‘కూడా’ మనుషులతో పాటు జంతువులనూ చంపిన భావాన్ని సహజంగా కలుపుతుంది.
theological_decisions:
- issue: లింగాన్ని సూచించే మానవ పదాలతో ఏర్పడిన సమగ్రతా ప్రయోగం
  choice: పురుషుని మొదలుకొని స్త్రీ వరకు
  alternative: పురుషులనూ స్త్రీలనూ
  rationale: మూలంలోని ఏకవచన జంటను, ‘ఒక చివర నుంచి మరొక చివర వరకు’ అనే సమగ్రతా నిర్మాణాన్ని నిలిపాం. ఇది లింగంపై సిద్ధాంత ప్రకటన కాదు; ఎవరినీ విడిచిపెట్టని సంహారాన్ని సూచిస్తుంది.
- issue: సంహార సూత్రంలో రూపపరమైన పునరుక్తి
  choice: ‘కత్తివాత’ అనే పదబంధాన్ని రెండుసార్లు నిలపడం
  alternative: ఒక్కసారి మాత్రమే ‘కత్తితో అందరినీ సంహరించాడు’ అని సంక్షిప్తీకరించడం
  rationale: మూలవచనంలోని పునరుక్తి సమగ్ర విధ్వంసాన్ని బలంగా నొక్కిచెబుతుంది. దానిని తొలగించకుండా సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపాం.
- issue: שֶׂה యొక్క సూచన పరిధి
  choice: గొర్రె
  alternative: గొర్రె లేదా మేక
  rationale: ఈ హీబ్రూ పదం చిన్న పశువును, అంటే గొర్రెను లేదా మేకను సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన సాధారణ ఎంపికగా ‘గొర్రె’ వాడి, పదానికి లేని నిర్దిష్టతను సిద్ధాంతపరంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలి. ‘హతమార్చాడు’ సందర్భంలోని మరణార్థాన్ని స్పష్టం చేస్తుంది; ‘కత్తివాత’ మూల నుడికారంలోని చిత్రాన్ని కొంతవరకు నిలుపుతుంది. విరామచిహ్నాలు బాధితుల రెండు సమూహాలను స్పష్టంగా విభజిస్తాయి.
