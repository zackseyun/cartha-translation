  to: అతని కోసం యెహోవా దగ్గర[a] విచారించాడు; అతనికి ఆహార సామగ్రి ఇచ్చాడు; ఫిలిష్తీయుడైన గొల్యాతు ఖడ్గాన్ని అతనికి ఇచ్చాడు.
