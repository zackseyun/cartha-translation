  yaml_path: translation/ot/1_samuel/022/010.yaml
  text: And he inquired of Yahweh for him[a], and gave him provisions, and gave him the sword of Goliath the Philistine.
translation:
  language: te
  text: అతని కోసం యెహోవా దగ్గర[a] విచారించాడు; అతనికి ఆహార సామగ్రి ఇచ్చాడు; ఫిలిష్తీయుడైన గొల్యాతు ఖడ్గాన్ని అతనికి ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని కోసం యెహోవాను సంప్రదించాడు.”
    reason: שׁאל ... בַּיהוָה అనే నిర్మాణం యెహోవా దగ్గర విచారించడం లేదా యెహోవాను సంప్రదించడం అనే భావాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַיִּשְׁאַל לוֹ בַּיהוָה
  choice: అతడు అతని తరఫున యెహోవాను విచారించాడు
  rationale: שׁאל + ב + దైవనామం ఇక్కడ దేవుని చిత్తం లేదా మార్గదర్శనం కోసం విచారించడాన్ని సూచిస్తుంది. לּוֹ ను సందర్భానుసారంగా ‘అతని తరఫున’ అని అనువదించడం ద్వారా ఆ విచారణ దావీదు పక్షంగా జరిగినదనే భావం నిలుస్తుంది.
- source_word: בַּיהוָה
  choice: యెహోవాను
  rationale: మూలపాఠంలోని יְהוָה అనే వ్యక్తిగత దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: צֵידָה
  choice: ప్రయాణానికి కావలసిన ఆహారం
  rationale: צֵידָה సాధారణంగా ప్రయాణానికి లేదా మార్గమధ్య అవసరానికి తీసుకెళ్లే ఆహార సరఫరాను సూచిస్తుంది. ‘ఆహారం’ మాత్రమే అన్నదానికంటే ఈ సందర్భంలో ఉద్దేశం స్పష్టమవుతుంది.
- source_word: נָתַן לוֹ
  choice: అతనికి ... ఇచ్చాడు
  rationale: נתן యొక్క సాధారణ అర్థాన్ని సహజమైన తెలుగులో నిలిపి, మూలంలోని రెండుసార్ల పునరుక్తిని రెండు క్రియల ద్వారా కాపాడాం.
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: ఫిలిష్తీయుడైన గొల్యాతు ఖడ్గాన్ని కూడా
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో ఇచ్చి, ఖడ్గం ఎవరిదో స్పష్టంగా నిలిపాం. וְ ను ఇక్కడ సముచ్చయార్థకమైన ‘కూడా’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని ఎలా పలకాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగానే ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా తెలిసిన రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయం.
- issue: విచారణ ఎవరి ప్రయోజనార్థం జరిగింది
  choice: అతని తరఫున
  alternative: అతని కోసం
  rationale: לּוֹ లోని ప్రయోజనార్థక భావాన్ని స్పష్టంగా చూపుతూ, అహీమెలెకు దావీదు పక్షంగా దేవునిని విచారించాడనే వాక్యార్థాన్ని నిలిపాం; ‘అతని కోసం’ కూడా సాధ్యమైన సహజ అనువాదం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను నిలుపుకుంటూనే సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ఆరోపణలోని వరుస చర్యలను సెమీకోలన్లతో వేరు చేసి, హీబ్రూ వాక్య లయను సాధ్యమైనంతవరకు నిలిపాం.
