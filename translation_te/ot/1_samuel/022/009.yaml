id: 1SA.22.9
reference: 1 Samuel 22:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֜עַן דֹּאֵ֣ג הָ/אֲדֹמִ֗י וְ/ה֛וּא נִצָּ֥ב עַל עַבְדֵֽי שָׁא֖וּל וַ/יֹּאמַ֑ר רָאִ֨יתִי֙ אֶת בֶּן יִשַׁ֔י בָּ֣א נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ בֶּן אֲחִטֽוּב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
translation:
  language: te
  text: 'అప్పుడు ఎదోమీయుడైన దోయేగు—అతడు సౌలు సేవకుల మధ్య నిలబడి ఉన్నాడు[a]—ఇలా జవాబిచ్చాడు: “యెష్షయి కుమారుడు నోబుకు వచ్చి, అహీటూబు కుమారుడైన అహీమెలెకు దగ్గరకు వస్తుండగా నేను చూశాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు సౌలు సేవకులపై నియమించబడి ఉన్నాడు.” ఈ హీబ్రూ పదబంధం దోయేగు సేవకుల మధ్య ఉన్నాడని గానీ, వారిపై పర్యవేక్షణ బాధ్యతలో ఉన్నాడని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూలోని ‘జవాబిచ్చి చెప్పాడు’ అనే వరుసను సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది; ప్రతిస్పందన భావాన్ని నిలుపుతుంది.
- source_word: הָאֲדֹמִי
  choice: ఎదోమీయుడైన
  rationale: దోయేగు జాతి గుర్తింపును విశేషణ రూపంలో సహజంగా తెలియజేస్తుంది.
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  choice: అతడు సౌలు సేవకుల మధ్య నిలబడి ఉన్నాడు
  rationale: נִצָּב యొక్క ‘నిలబడి/నియమించబడి’ భావంలో ప్రాథమిక స్థానార్థాన్ని తీసుకుంటూ, עַל వల్ల సాధ్యమైన పర్యవేక్షణ భావాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: עַבְדֵי שָׁאוּל
  choice: సౌలు సేవకులు
  rationale: రాజసభ సందర్భంలో అధికారులు లేదా పరిచారకులు అనే భావాలు సాధ్యమైనా, ‘సేవకులు’ మూలపదానికి నేరమైన మరియు విస్తృతమైన సమానార్థకం.
- source_word: בֶּן יִשַׁי
  choice: యెష్షయి కుమారుడు
  rationale: ‘దావీదు’ అని స్పష్టీకరించకుండా, మూలంలోని ఉద్దేశపూర్వక సంబంధపూర్వక సంబోధనను నిలుపుతుంది.
- source_word: בָּא נֹבֶה
  choice: నోబుకు ... రావడం
  rationale: క్రియావిశేషణాత్మక participle భావాన్ని ‘రావడం చూశాను’గా, దిశాసూచక ה ను ‘నోబుకు’గా సహజంగా అందిస్తుంది.
- source_word: אֶל אֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: అహీటూబు కుమారుడైన అహీమెలెకు దగ్గరకు
  rationale: אֶל సూచించే వ్యక్తివైపు గమనాన్ని ‘దగ్గరకు’ స్పష్టంగా తెలుపుతూ వంశసంబంధాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. వ్యక్తి, స్థలనామాలకు తెలుగు బైబిలు సంప్రదాయానికి దగ్గరైన రూపాలు వాడబడ్డాయి; మూలంలోని స్థానార్థం/అధికారార్థం సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
