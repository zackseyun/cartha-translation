  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד לְ/אֶבְיָתָ֗ר יָדַ֜עְתִּי בַּ/יּ֤וֹם הַ/הוּא֙ כִּֽי שָׁם֙ דויג הָ/אֲדֹמִ֔י כִּֽי הַגֵּ֥ד יַגִּ֖יד לְ/שָׁא֑וּל אָנֹכִ֣י סַבֹּ֔תִי בְּ/כָל נֶ֖פֶשׁ בֵּ֥ית אָבִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
translation:
  language: te
  text: దావీదు అబ్యాతారుతో, “ఆ రోజు ఎదోమీయుడైన దోయేగు అక్కడ ఉన్నప్పుడు[a], అతడు సౌలుకు తప్పకుండా తెలియజేస్తాడని[b] నాకు తెలిసింది. నీ తండ్రి ఇంటివారి ప్రాణాలు పోవడానికి నేనే కారణం[c]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎదోమీయుడైన దోయేగు అక్కడ ఉన్నాడని ఆ రోజు నాకు తెలిసింది.” హీబ్రూ సంధిపదం దావీదుకు తెలిసిన విషయాన్ని పరిచయం చేస్తున్నదిగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అనంత క్రియారూపాన్ని పరిమిత క్రియతో కలిపి బలంగా చెప్పబడింది; అక్షరార్థంగా, “తెలియజేస్తూ తెలియజేస్తాడు,” అంటే “తప్పకుండా తెలియజేస్తాడు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నీ తండ్రి ఇంటివారందరి మరణానికి నేనే కారణమయ్యాను.” హీబ్రూ పదబంధాన్ని “నీ తండ్రి ఇంటివారందరికీ నేను బాధ్యుణ్ణి” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: హీబ్రూ పరిపూర్ణ క్రియ గతంలో దావీదుకు ఉన్న అవగాహనను సూచిస్తుంది; తెలుగులో సందర్భంతో గతకాల భావం స్పష్టమవుతుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: నిర్దిష్టమైన గత దినాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: כִּי שָׁם דויג הָאֲדֹמִי
  choice: ఎదోమీయుడైన దోయేగు అక్కడ ఉన్నప్పుడు
  rationale: మొదటి כִּי‌ను సందర్భార్థకమైన కాలసూచక భావంలో అనువదించింది; అది దావీదు తెలిసిన విషయాన్ని పరిచయం చేసే ‘అని’ అనే అర్థంలోనూ ఉండగలదు కాబట్టి ఆ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: כִּי הַגֵּד יַגִּיד לְשָׁאוּל
  choice: అతడు సౌలుకు తప్పకుండా తెలియజేస్తాడని
  rationale: క్రియానామ ధాతురూపం మరియు పరిమిత క్రియ కలయికలోని బలాన్ని ‘తప్పకుండా’ తెలియజేస్తుంది; హీబ్రూలో స్పష్టమైన కర్మ లేకపోవడంతో తెలుగులోనూ దానిని చేర్చలేదు.
- source_word: אָנֹכִי
  choice: నేనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు ‘నేనే’ సహజంగా నిలుపుతుంది.
- source_word: סַבֹּתִי
  choice: కారణం
  rationale: ఈ సందర్భంలో దావీదు జరిగిన మరణాలకు తన బాధ్యతను ఒప్పుకుంటున్న ఫలితార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యక్షంగా చంపానని అతిశయంగా నిర్ధారించదు.
- source_word: בְּכָל נֶפֶשׁ
  choice: ప్రాణాలన్నిటికీ
  rationale: נֶפֶשׁ ఇక్కడ వ్యక్తుల ప్రాణాలను సూచిస్తుంది; ‘ఆత్మలు’ అనే ఆధ్యాత్మిక అపార్థాన్ని నివారిస్తూ నష్టం యొక్క తీవ్రతను నిలుపుతుంది.
- source_word: בֵּית אָבִיךָ
  choice: నీ తండ్రి ఇంటివారి
  rationale: కుటుంబం లేదా పితృగృహానికి చెందిన వారిని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దావీదు ఒప్పుకున్న బాధ్యత స్వరూపం
  choice: నీ తండ్రి ఇంటివారి ప్రాణాలన్నిటికీ నేనే కారణం
  alternative: నీ తండ్రి ఇంటివారందరి మరణానికి నేనే కారణమయ్యాను
  rationale: మూలంలోని సַבֹּתִי బాధ్యత లేదా కారణత్వాన్ని తెలుపుతుంది గాని ‘మరణం’ అనే పదం స్పష్టంగా లేదు. ప్రధాన పాఠం ఆ సంక్షిప్తతను నిలుపుతుంది; సందర్భంలో ఉద్దేశించిన మరణార్థాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం వాడబడింది. వ్యక్తిపేర్లకు ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపాలు—అబ్యాతారు, దోయేగు, సౌలు—ఉంచబడ్డాయి. మూలంలోని కారణత్వం మరియు మొదటి כִּי యొక్క వ్యాకరణ సందిగ్ధత పాదసూచికల ద్వారా సంరక్షించబడ్డాయి.
