source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע שָׁא֔וּל כִּ֚י נוֹדַ֣ע דָּוִ֔ד וַ/אֲנָשִׁ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וְ/שָׁאוּל֩ יוֹשֵׁ֨ב בַּ/גִּבְעָ֜ה תַּֽחַת הָ/אֶ֤שֶׁל בָּֽ/רָמָה֙ וַ/חֲנִית֣/וֹ בְ/יָד֔/וֹ וְ/כָל עֲבָדָ֖י/ו נִצָּבִ֥ים עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
translation:
  language: te
  text: దావీదు, అతనితో ఉన్న మనుషులు ఎక్కడున్నారో తెలిసిందని సౌలు విన్నాడు.[a] అప్పుడు సౌలు గిబియాలో, ఎత్తైన ప్రదేశంలో ఉన్న పిచుల చెట్టు కింద కూర్చొని ఉన్నాడు.[b] అతని చేతిలో ఈటె ఉంది; అతని సేవకులందరూ అతని చుట్టూ నిలబడి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు, అతనితో ఉన్న మనుషులు కనుగొనబడ్డారని.” హీబ్రూ క్రియకు వారు ఉన్న చోటు తెలిసిపోయిందనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఎత్తైన ప్రదేశంలో” అనే మాటను స్థలనామంగా తీసుకుంటే, “రామాలోని పిచుల చెట్టు కింద” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నాడు
  rationale: వార్త అందుకోవడం అనే సందర్భార్థంతో కూడిన שׁמע యొక్క ప్రాథమిక భావాన్ని సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: כִּי נוֹדַע דָּוִד וַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: దావీదు, అతనితో ఉన్న మనుషులు ఎక్కడున్నారో తెలిసిందని
  rationale: ידע నిఫాల్ రూపానికి ‘తెలియబడడం’ లేదా ‘కనుగొనబడడం’ అనే భావాలు ఉన్నాయి. ఇక్కడ సౌలుకు వారి ఉనికి లేదా ఆచూకీ తెలిసిన సందర్భం కావడంతో, తెలుగులో సహజంగా ఉండేలా అంతర్లీన స్థానార్థాన్ని వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: יוֹשֵׁב
  choice: కూర్చొని ఉన్నాడు
  rationale: వర్తమాన కృదంతం ఇచ్చే కొనసాగుతున్న నేపథ్య దృశ్యాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בַּגִּבְעָה
  choice: గిబియాలో
  rationale: స్థలనామాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజమైన స్థల విభక్తితో అందిస్తుంది.
- source_word: תַּחַת הָאֶשֶׁל
  choice: పిచుల వృక్షం కింద
  rationale: אשל సాధారణంగా tamarisk చెట్టుగా గుర్తించబడుతుంది; తెలుగులో దానికి వాడుకలో ఉన్న ‘పిచుల వృక్షం’ అనే పేరును ఉపయోగించడం పాఠకులకు అనువుగా ఉంటుంది.
- source_word: בָּרָמָה
  choice: ఎత్తైన స్థలంలోని
  rationale: ఉపపదంతో కూడిన రూపం ఇక్కడ ‘ఎత్తైన స్థలం’ అనే సామాన్య నామార్థానికి అనుకూలంగా ఉంది. అయితే ‘రామాలో’ అనే స్థలనామ పఠనం సాధ్యమే కాబట్టి పాదసూచికలో సూచించబడింది.
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  choice: అతని చేతిలో ఈటె ఉంది
  rationale: హీబ్రూలోని క్రియలేని వాక్యభాగాన్ని, సౌలు భంగిమను మరియు యుద్ధాధికార సూచనను నిలుపుతూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְכָל עֲבָדָיו
  choice: అతని సేవకులందరూ
  rationale: עבדים రాజసభ సందర్భంలో సేవకులు, పరిచారకులు లేదా అధికారులు కావచ్చు; ‘సేవకులు’ విస్తృతమైన, మూలానికి పారదర్శకమైన ఎంపిక.
- source_word: נִצָּבִים עָלָיו
  choice: అతని చుట్టూ నిలబడి ఉన్నారు
  rationale: సౌలు సమక్షంలో పరిచారకులు స్థానాలు చేపట్టి నిలిచి ఉన్న దృశ్యాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
