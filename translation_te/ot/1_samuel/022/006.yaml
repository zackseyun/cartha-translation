  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన కథన శైలి, అయితే రాజసభ దృశ్యానికి తగిన గంభీరతను నిలిపింది. మూలంలోని నేపథ్య కృదంత నిర్మాణాలు ‘కూర్చొని ఉన్నాడు’, ‘నిలబడి ఉన్నారు’గా వ్యక్తమయ్యాయి.
