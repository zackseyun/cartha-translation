source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ גָּ֨ד הַ/נָּבִ֜יא אֶל דָּוִ֗ד לֹ֤א תֵשֵׁב֙ בַּ/מְּצוּדָ֔ה לֵ֥ךְ וּ/בָֽאתָ לְּ/ךָ֖ אֶ֣רֶץ יְהוּדָ֑ה וַ/יֵּ֣לֶךְ דָּוִ֔ד וַ/יָּבֹ֖א יַ֥עַר חָֽרֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
translation:
  language: te
  text: అప్పుడు గాదు ప్రవక్త దావీదుతో, “నీవు దుర్గంలో ఉండవద్దు. బయలుదేరి యూదా దేశంలోకి వెళ్లు[a]” అని చెప్పాడు. కాబట్టి దావీదు బయలుదేరి హారెతు అడవికి చేరుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదా దేశంలోకి ప్రవేశించు.” హెబ్రీ క్రియను సందర్భాన్ని బట్టి “రా,” “చేరు,” “ప్రవేశించు,” లేదా సాధారణంగా “వెళ్లు” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: ప్రవక్త
  rationale: נָבִיאకు సాధారణమైన, సందర్భోచితమైన తెలుగు పదం ‘ప్రవక్త’; వేరే హెబ్రీ పదాన్ని సూచించే ‘దీర్ఘదర్శి’ ఇక్కడ తగదు.
- source_word: לֹא תֵשֵׁב
  choice: ఉండవద్దు
  rationale: ఇక్కడ ישב అనేది ఒక ప్రదేశంలో కొనసాగి ఉండడాన్ని సూచిస్తుంది; ‘ఉండవద్దు’ సహజమైన ఆధునిక తెలుగు ఆజ్ఞ.
- source_word: בַּמְּצוּדָה
  choice: ఈ దుర్గంలో
  rationale: מְצוּדָה అనేది రక్షణనిచ్చే బలమైన ఆశ్రయస్థలాన్ని సూచిస్తుంది. నిర్దిష్ట ప్రత్యయాన్ని తెలుగులో సహజంగా చూపేందుకు ‘ఈ’ ఉపయోగించబడింది.
- source_word: לֵךְ
  choice: బయలుదేరు
  rationale: הלך ఆజ్ఞారూపం వెళ్లమనే ఆదేశం; ప్రస్తుత స్థలాన్ని విడిచిపోవాలనే సందర్భార్థాన్ని ‘బయలుదేరు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּבָאתָ לְּךָ אֶרֶץ יְהוּדָה
  choice: యూదా దేశంలోకి వెళ్లు
  rationale: בואకు ‘రా/ప్రవేశించు/చేరు’ అనే పరిధి ఉంది. గాదు ఉన్న స్థానాన్ని నిర్దేశక కేంద్రంగా తీసుకోవాల్సిన అవసరం లేకుండా, లక్ష్యస్థానానికి కదలికను సహజ తెలుగులో ‘దేశంలోకి వెళ్లు’ తెలియజేస్తుంది. לְךָ ఇచ్చే వ్యక్తిగత దిశాబలాన్ని ప్రత్యేక అసహజ సర్వనామంతో విస్తరించలేదు.
- source_word: אֶרֶץ יְהוּדָה
  choice: యూదా దేశం
  rationale: אֶרֶץతో కూడిన గోత్రనామం ప్రాదేశిక భావాన్ని కలిగి ఉంది; ‘యూదా దేశం’ దానిని నిలుపుతుంది.
- source_word: יַעַר חָרֶת
  choice: హారెతు అడవి
  rationale: יַעַרకు ‘అడవి’ సహజమైన తెలుగు సమానం; חָרֶתను స్థలనామంగా ‘హారెతు’ అని లిప్యంతరీకరించాం.
- source_word: וַיָּבֹא
  choice: చేరుకున్నాడు
  rationale: בוא ఇక్కడ ఒక గమ్యస్థానానికి రావడం లేదా ప్రవేశించడాన్ని సూచిస్తుంది; ‘అడవికి చేరుకున్నాడు’ సహజంగా ఉండి, గమనార్థాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యంలోని వరుస కదలికలను సహజ తెలుగు ప్రయోగాలతో అందిస్తూ, בוא క్రియలోని భావపరిధిని పాదటిప్పణిలో నిలిపాం.
