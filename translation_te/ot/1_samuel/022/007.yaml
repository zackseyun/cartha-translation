base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/007.yaml
  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: te
  text: 'అప్పుడు సౌలు తన చుట్టూ నిలబడి ఉన్న సేవకులతో ఇలా అన్నాడు: “బెన్యామీను కుమారులారా, దయచేసి వినండి! యెష్షయి కుమారుడు కూడా మీ అందరికీ పొలాలనూ ద్రాక్షతోటలనూ ఇస్తాడా? మీ అందరినీ వేలమందికి అధిపతులుగానూ వందమందికి అధిపతులుగానూ నియమిస్తాడా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: తన సేవకులతో
  rationale: ఇక్కడ రాజు సమక్షంలో ఉన్న అధికారులను లేదా అనుచరులను సూచిస్తుంది; ‘సేవకులు’ మూలపదంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: הַנִּצָּבִים עָלָיו
  choice: తన చుట్టూ నిలబడి ఉన్న
  rationale: రాజు సమక్షంలో, అతని వద్ద విధిగా నిలిచిన వారనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שִׁמְעוּ נָא
  choice: దయచేసి వినండి
  rationale: נָא ఇచ్చే విజ్ఞాపనాత్మక లేదా వాక్పటుత్వపు మృదుత్వాన్ని నిలుపుతుంది; సందర్భంలో ఇది అధికారపూర్వక పిలుపు కూడా.
- source_word: בְּנֵי יְמִינִי
  choice: బెన్యామీను కుమారులారా
  rationale: హెబ్రీయ భాషలోని వంశీయ సంబోధనను నేరుగా నిలుపుతుంది; ఇది బెన్యామీను గోత్రస్థులను సూచిస్తుంది.
- source_word: בֶּן יִשַׁי
  choice: యెష్షయి కుమారుడు
  rationale: సౌలు దావీదు పేరును పలకకుండా అతని తండ్రి ద్వారా సూచించిన మూలంలోని భావాన్ని అలాగే ఉంచుతుంది.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: వేలమందికి అధిపతులుగానూ వందమందికి అధిపతులుగానూ
  rationale: సైనిక లేదా పరిపాలనా విభాగాల నాయకులను సూచించే హోదాలను సంఖ్యాపరమైన మూలరూపానికి దగ్గరగా అనువదిస్తుంది.
