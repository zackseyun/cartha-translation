  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל שְֽׁמַֽע נָ֖א בֶּן אֲחִיט֑וּב וַ/יֹּ֖אמֶר הִנְ/נִ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/012.yaml
  text: Then Saul said, “Listen, please, son of Ahitub.” And he answered, “Here I am, my lord.”
translation:
  language: te
  text: అప్పుడు సౌలు, “అహీటూబు కుమారుడా, దయచేసి విను” అన్నాడు. అతడు, “నా ప్రభూ, ఇదిగో నేనున్నాను” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: దయచేసి విను
  rationale: שמע అనే ఆజ్ఞార్థక రూపాన్ని ‘విను’గా, అభ్యర్థన లేదా వినయసూచక నుడికారమైన נאను ‘దయచేసి’గా సహజమైన ఆధునిక తెలుగులో అందించింది.
- source_word: בֶּן אֲחִיטוּב
  choice: అహీటూబు కుమారుడా
  rationale: నేరుగా సంబోధిస్తున్న హీబ్రూ నిర్మాణాన్ని తెలుగు సంబోధన రూపంతో నిలిపింది.
- source_word: הִנְנִי
  choice: ఇదిగో నేనున్నాను
  rationale: హాజరు, శ్రద్ధ, స్పందించడానికి సిద్ధతను తెలిపే హీబ్రూ స్థిరప్రయోగానికి సమీపమైన తెలుగు వ్యక్తీకరణ.
- source_word: אֲדֹנִי
  choice: నా ప్రభూ
  rationale: ఇక్కడ సౌలును గౌరవంగా సంబోధించే మానవాధిపతి భావం; దైవనామంగా అనువదించలేదు.
theological_decisions:
- issue: אֲדֹנִי అనే పదం సూచించే వ్యక్తి
  choice: నా ప్రభూ
  alternative: నా యజమానీ
  rationale: సందర్భంలో ఇది రాజైన సౌలుకు చేసిన గౌరవ సంబోధన. ‘ప్రభూ’ ఆ గౌరవాన్ని సహజంగా తెలియజేస్తుంది; ఇది దేవుని ప్రత్యేక నామాన్ని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని ప్రత్యక్ష సంబోధన, వినయసూచక נא, మరియు హిన్నేని ప్రతిస్పందనను స్పష్టంగా నిలిపింది.
