- from: 'అహీమెలెకు రాజుకు ఇలా జవాబిచ్చాడు: “మీ సేవకులందరిలో దావీదులా నమ్మకమైనవాడు ఎవరు? అతడు రాజు అల్లుడు, మీ ఆజ్ఞకు లోబడి నడుచుకునేవాడు[a], మీ ఇంటిలో గౌరవం పొందినవాడు[b] కదా!”'
  to: 'అహీమెలెకు రాజుకు ఇలా జవాబిచ్చాడు: “మీ సేవకులందరిలో దావీదులా నమ్మకమైనవాడు ఎవరు? అతడు రాజు అల్లుడు, మీ ఆజ్ఞకు లోబడేవాడు[a], మీ ఇంటిలో గౌరవం పొందినవాడు[b].”'
