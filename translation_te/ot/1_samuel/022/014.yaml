source:
  edition: WLC
  text: וַ/יַּ֧עַן אֲחִימֶ֛לֶךְ אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר וּ/מִ֤י בְ/כָל עֲבָדֶ֨י/ךָ֙ כְּ/דָוִ֣ד נֶאֱמָ֔ן וַ/חֲתַ֥ן הַ/מֶּ֛לֶךְ וְ/סָ֥ר אֶל מִשְׁמַעְתֶּ֖/ךָ וְ/נִכְבָּ֥ד בְּ/בֵיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
translation:
  language: te
  text: 'అహీమెలెకు రాజుకు ఇలా జవాబిచ్చాడు: “మీ సేవకులందరిలో దావీదులా నమ్మకమైనవాడు ఎవరు? అతడు రాజు అల్లుడు, మీ ఆజ్ఞకు లోబడేవాడు[a], మీ ఇంటిలో గౌరవం పొందినవాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ హీబ్రూ పదబంధానికి “మీ ఆజ్ఞకు వెంటనే స్పందించేవాడు” లేదా “మీ పిలుపుకు సిద్ధంగా ఉండేవాడు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మీ ఇంటిలో” అంటే ఇక్కడ రాజ కుటుంబంలో లేదా రాజాస్థానంలో అని కూడా భావించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: అహీమెలెకు రాజుకు ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ కథన శైలిలోని ‘జవాబిచ్చి అన్నాడు’ అనే ద్వంద్వ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఇలా జవాబిచ్చాడు’గా అందించింది.
- source_word: וּמִי בְכָל־עֲבָדֶיךָ כְּדָוִד נֶאֱמָן
  choice: మీ సేవకులందరిలో దావీదులా నమ్మకమైనవాడు ఎవరు?
  rationale: ప్రశ్నలోని భాగసూచక నిర్మాణాన్ని సహజంగా ఉంచి, נֶאֱמָן సూచించే విశ్వసనీయత మరియు విధేయత రెండింటినీ ‘నమ్మకమైనవాడు’తో వ్యక్తం చేసింది.
- source_word: וַחֲתַן הַמֶּלֶךְ
  choice: అతడు రాజు అల్లుడు
  rationale: దావీదుకు రాజుతో ఉన్న కుటుంబ సంబంధాన్ని నేరుగా, స్పష్టంగా తెలిపింది.
- source_word: וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: మీ ఆజ్ఞకు లోబడి నడుచుకునేవాడు[a]
  rationale: సందిగ్ధమైన హీబ్రూ నుడికారంలో వినడం, విధేయత, రాజు పిలుపుకు సిద్ధంగా ఉండడం అనే భావాలు ఉన్నాయి. ప్రధాన పాఠంలో సహజమైన విధేయత భావాన్ని ఉంచి, ఇతర సాధ్యార్థాన్ని పాదసూచికలో భద్రపరిచింది.
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  choice: మీ ఇంటిలో గౌరవం పొందినవాడు[b]
  rationale: נִכְבָּד యొక్క గౌరవింపబడే భావాన్ని, בֵּיתֶךָ యొక్క ‘ఇల్లు’ రూపకాన్ని నిలిపింది; అది రాజ కుటుంబాన్ని లేదా ఆస్థానాన్ని సూచించవచ్చని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: וְסָר אֶל־מִשְׁמַעְתֶּךָ అనే అరుదైన రాజాస్థాన నుడికారం
  choice: మీ ఆజ్ఞకు లోబడి నడుచుకునేవాడు
  alternative: మీ అంతరంగ సలహాలో పాలుపంచుకునేవాడు / మీ సమక్షంలో ప్రవేశం ఉన్నవాడు
  rationale: ఈ పదబంధాన్ని కేవలం రాజసభ సభ్యత్వంగా నిర్ధారించడం మూలంలోని అనిశ్చితిని తొలగిస్తుంది. అందువల్ల ప్రధాన పాఠంలో విధేయతకు సంబంధించిన సాధారణ అర్థాన్ని ఇచ్చి, రాజు సన్నిధి లేదా సలహాకు ప్రవేశం అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. అలంకారప్రశ్న యొక్క బలాన్ని ‘కదా!’తో నిలిపి, హీబ్రూ సమన్వయ నిర్మాణాన్ని తెలుగులో చదవడానికి సులభంగా విభజించింది.
