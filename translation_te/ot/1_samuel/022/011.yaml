id: 1SA.22.11
reference: 1 Samuel 22:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח הַ/מֶּ֡לֶךְ לִ/קְרֹא֩ אֶת אֲחִימֶ֨לֶךְ בֶּן אֲחִיט֜וּב הַ/כֹּהֵ֗ן וְ/אֵ֨ת כָּל בֵּ֥ית אָבִ֛י/ו הַ/כֹּהֲנִ֖ים אֲשֶׁ֣ר בְּ/נֹ֑ב וַ/יָּבֹ֥אוּ כֻלָּ֖/ם אֶל הַ/מֶּֽלֶךְ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
translation:
  language: te
  text: అప్పుడు రాజు, అహీటూబు కుమారుడైన యాజకుడు అహీమెలెకును, నోబులో ఉన్న అతని తండ్రి ఇంటివారైన యాజకులందరినీ[a] పిలిపించమని పంపించాడు. వారందరూ రాజు దగ్గరకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తండ్రి ఇంటివారు” అనేది అతని సన్నిహిత కుటుంబాన్ని మాత్రమే కాక, తండ్రి వైపు ఉన్న విస్తృత కుటుంబ సమూహాన్ని లేదా వంశాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לִקְרֹא
  choice: పిలిపించడానికి మనుషులను పంపించాడు
  rationale: రాజు అధికారపూర్వకంగా వారిని తన దగ్గరకు రప్పించేందుకు పంపాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘మనుషులను’ అనేది తెలుగులో ఈ పంపించే చర్యకు సహజంగా అంతర్భావితమైన కర్తృసాధనం.
- source_word: אֲחִימֶלֶךְ בֶּן אֲחִיטוּב הַכֹּהֵן
  choice: అహీటూబు కుమారుడైన యాజకుడు అహీమెలెకు
  rationale: వ్యక్తి పేర్లను లిప్యంతరీకరిస్తూ, తండ్రి-కుమార సంబంధాన్నీ అహీమెలెకు యాజకుడనే గుర్తింపునూ స్పష్టంగా నిలుపుతుంది.
- source_word: כָּל בֵּית אָבִיו
  choice: అతని తండ్రి వంశస్థులందరినీ
  rationale: ‘తండ్రి ఇల్లు’ అనే హీబ్రూ సామాజిక పదబంధం కేవలం సన్నిహిత కుటుంబాన్ని కాక పితృవంశ కుటుంబ సమూహాన్ని సూచిస్తుంది; ‘వంశస్థులు’ ఆధునిక తెలుగు పాఠకులకు ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַכֹּהֲנִים אֲשֶׁר בְּנֹב
  choice: నోబులో ఉన్న యాజకులైన
  rationale: నోబులో నివసించిన ఆ పితృవంశ సమూహం యాజకులని వివరించే అన్వయాన్ని నిలుపుతుంది.
- source_word: וַיָּבֹאוּ כֻלָּם אֶל הַמֶּלֶךְ
  choice: వారందరూ రాజు దగ్గరకు వచ్చారు
  rationale: כֻלָּם లోని సంపూర్ణత ఉద్ఘాటనను ‘వారందరూ’ ద్వారా కాపాడి, אֶל సూచించే రాజువైపు గమనాన్ని ‘రాజు దగ్గరకు’గా సహజంగా అనువదిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. రాజాజ్ఞ భావానికి ‘పిలిపించడానికి’ను, పితృవంశ సామాజిక భావానికి ‘తండ్రి వంశస్థులు’ను ఉపయోగించాం.
