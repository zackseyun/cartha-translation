revisions:
- from: 'వారు వస్తున్న సందేశకులతో, “మీరు గిలాదు యాబేషు ప్రజలకు[a] ఇలా చెప్పాలి: ‘రేపు ఎండ వేడెక్కే సమయానికల్లా[b] మీకు విముక్తి కలుగుతుంది’” అన్నారు. అప్పుడు ఆ సందేశకులు వెళ్లి యాబేషు ప్రజలకు ఆ మాట తెలియజేశారు; వారు సంతోషించారు.'
  to: 'వచ్చిన సందేశకులతో వారు ఇలా అన్నారు: “మీరు యాబేషు-గిలాదు ప్రజలకు ఇలా చెప్పండి: ‘రేపు సూర్యుడు వేడిగా ఉన్నప్పుడు మీకు రక్షణ కలుగుతుంది.’” అప్పుడు ఆ సందేశకులు వచ్చి యాబేషు ప్రజలకు ఈ సంగతి తెలియజేశారు; వారు సంతోషించారు.'
  rationale: The revision restores ‘came’ for the Hebrew wayyabo'u, removes the added deadline force in the sun-heat phrase, and uses contextually precise terminology for military deliverance. Footnotes retain the collective singular and the literal sun-heat expression. Footnote anchors should be placed after ప్రజలకు[a] and ఉన్నప్పుడు[b], respectively.
  reviewer_model: gpt-5.6-terra
