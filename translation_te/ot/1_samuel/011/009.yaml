translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. స్థలనామం יָבֵישׁ גִּלְעָד మూలక్రమానికి అనుగుణంగా ‘గిలాదు యాబేషు’గా ఇవ్వబడింది. మూలంలోని సామూహిక ఏకవచనం మరియు సూర్యుని వేడి సూచించే కాలపదబంధంలోని ప్రత్యామ్నాయ భావాలు పాదసూచికల్లో నిలుపబడ్డాయి.
