source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ לַ/מַּלְאָכִ֣ים הַ/בָּאִ֗ים כֹּ֤ה תֹֽאמְרוּ/ן֙ לְ/אִישׁ֙ יָבֵ֣ישׁ גִּלְעָ֔ד מָחָ֛ר תִּהְיֶֽה לָ/כֶ֥ם תְּשׁוּעָ֖ה ב/חם הַ/שָּׁ֑מֶשׁ וַ/יָּבֹ֣אוּ הַ/מַּלְאָכִ֗ים וַ/יַּגִּ֛ידוּ לְ/אַנְשֵׁ֥י יָבֵ֖ישׁ וַ/יִּשְׂמָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
translation:
  language: te
  text: 'వచ్చిన సందేశకులతో వారు ఇలా అన్నారు: “మీరు యాబేషు-గిలాదు ప్రజలకు ఇలా చెప్పండి: ‘రేపు సూర్యుడు వేడిగా ఉన్నప్పుడు మీకు రక్షణ కలుగుతుంది.’” అప్పుడు ఆ సందేశకులు వచ్చి యాబేషు ప్రజలకు ఈ సంగతి తెలియజేశారు; వారు సంతోషించారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: సందేశకులు
  rationale: ఈ యుద్ధకథన సందర్భంలో ఈ పదం పరలోక దూతలను కాక, సందేశం మోసుకువచ్చిన మనుషులను సూచిస్తుంది.
- source_word: הַבָּאִים
  choice: వస్తున్న
  rationale: హీబ్రూ వర్తమాన కృదంత భావాన్ని నిలుపుతూ, వీరు అక్కడికి వస్తున్న సందేశకులని సూచిస్తుంది.
- source_word: כֹּה תֹאמְרוּן
  choice: మీరు ... ఇలా చెప్పాలి
  rationale: ప్రత్యక్ష సందేశాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לְאִישׁ יָבֵישׁ גִּלְעָד
  choice: గిలాదు యాబేషు ప్రజలకు
  rationale: హీబ్రూలో ‘మనిషి’ ఏకవచనంగా ఉన్నా, సందర్భంలో అది పట్టణ నివాసులను సమష్టిగా సూచిస్తుంది; తెలుగు పాఠకుడిని తప్పుదారి పట్టించకుండా సమూహార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: תִּהְיֶה לָכֶם תְּשׁוּעָה
  choice: మీకు విముక్తి కలుగుతుంది
  rationale: ఇక్కడ תְּשׁוּעָה సైనిక ముట్టడి నుంచి రక్షణ లేదా విడిపింపును సూచిస్తుంది. ‘విముక్తి’ ఆ సందర్భార్థాన్ని గంభీరంగా, సహజంగా అందిస్తుంది.
- source_word: בְּחֹם הַשָּׁמֶשׁ
  choice: ఎండ వేడెక్కే సమయానికల్లా
  rationale: సూర్యుని వేడి అనే మూలచిత్రాన్ని ఉంచుతూ, ఈ పదబంధంలోని కాలసూచక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיַּגִּידוּ
  choice: ఆ మాట తెలియజేశారు
  rationale: సందేశాన్ని వారికి వెల్లడించడం అనే కథనార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְאַנְשֵׁי יָבֵישׁ
  choice: యాబేషు ప్రజలకు
  rationale: అక్షరార్థంగా ‘యాబేషు మనుషులకు’; సందర్భంలో పట్టణ ప్రజలను సూచిస్తున్నందున సహజమైన సమష్టి రూపం వాడబడింది.
- source_word: וַיִּשְׂמָחוּ
  choice: వారు సంతోషించారు
  rationale: వారికి కలిగిన ఆనందాన్ని ఆధునిక, సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
