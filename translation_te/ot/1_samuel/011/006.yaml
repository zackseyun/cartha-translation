  text: And the Spirit of God rushed upon Saul when he heard these words[b][a], and his anger burned greatly.
translation:
  language: te
  text: సౌలు ఈ మాటలు విన్నప్పుడు దేవుని ఆత్మ అతని మీదికి శక్తివంతంగా వచ్చింది[a]; అతని కోపం ఎంతో రగిలింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సౌలు మీదికి శక్తివంతంగా వచ్చింది.” హీబ్రూ క్రియ దేవుని ఆత్మ ఒకరిమీదికి బలంగా వచ్చి కార్యసామర్థ్యం ఇవ్వడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతని ముక్కు బాగా మండింది.” ఇది తీవ్రమైన కోపాన్ని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח
  choice: బలంగా దిగివచ్చాడు
  rationale: רוח అనే హీబ్రూ పదం వ్యాకరణపరంగా స్త్రీలింగమైనప్పటికీ, తెలుగులో ‘ఆత్మ’ పుంలింగ ప్రయోగం పొందుతుంది. צלח ఇక్కడ ఆత్మ అకస్మాత్తుగా, శక్తిమంతంగా ఒక వ్యక్తిమీదికి రావడాన్ని సూచిస్తుంది; అందుకే సాధారణ ‘వచ్చాడు’ కంటే ‘బలంగా దిగివచ్చాడు’ ఎంచుకున్నాం.
- source_word: רוּחַ אֱלֹהִים
  choice: దేవుని ఆత్మ
  rationale: ఈ నిర్మాణం దేవునికి చెందిన ఆత్మను సూటిగా సూచిస్తుంది. ‘దేవుని ఆత్మ’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, దైవిక శక్తినిచ్చే భావాన్ని కాపాడుతుంది.
- source_word: עַל
  choice: అతని మీదికి
  rationale: ఆత్మ ఒక వ్యక్తిమీదికి శక్తిమంతంగా రావడాన్ని తెలిపే హీబ్రూ ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּשָׁמְעוֹ
  choice: విన్నప్పుడు
  rationale: ב + క్రియానామ రూపం ఇక్కడ కాలసంబంధ అర్థాన్ని ఇస్తుంది. ‘విన్నప్పుడు’ సంఘటనల సంబంధాన్ని స్పష్టంగా, సహజంగా చూపుతుంది.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలు
  rationale: דברים అంటే ‘విషయాలు’ అని కూడా ఉండవచ్చు; అయితే ఇక్కడ వినబడిన సమాచారాన్ని సూచిస్తున్నందున ‘ఈ మాటలు’ మూలపదానికి సమీపంగా, సందర్భానుకూలంగా ఉంది.
- source_word: וַיִּחַר אַפּוֹ
  choice: అతనికి కోపం ... రగిలింది
  rationale: అక్షరార్థంగా ‘అతని ముక్కు మండింది’ అనే హీబ్రూ నుడికారం తీవ్రమైన కోపాన్ని సూచిస్తుంది. ‘కోపం రగిలింది’ రూపకాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: מְאֹד
  choice: తీవ్రంగా
  rationale: ఈ పదం కోపం ఎంత ఎక్కువగా రగిలిందో బలపరుస్తుంది. తెలుగులో ‘తీవ్రంగా’ ఈ ఉద్ధృతిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ కథనంలో רוּחַ אֱלֹהִים స్వభావం
  choice: సౌలుకు కార్యసామర్థ్యాన్ని ఇచ్చేందుకు అతని మీదికి వచ్చిన దేవుని ఆత్మ
  alternative: దేవుని నుండి వచ్చిన ఒక ఆత్మ
  rationale: నాయకత్వం మరియు విమోచన కార్యానికి సౌలును ప్రేరేపించే ఈ సందర్భంలో, ఈ పదబంధం కేవలం ఒక ప్రేరణను లేదా అనిర్దిష్ట ఆత్మను కాక దేవుని ఆత్మనే సూచించడం అత్యంత సహజం. అయినా మూలంలో లేనంతగా ఆత్మ కార్యాన్ని ప్రధాన వాక్యంలో వివరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా సహజ తెలుగు క్రమం ఎంచుకున్నాం; అయితే ఆత్మ శక్తిమంతంగా రావడం మరియు కోపం రగలడం అనే మూల రూపకాలను సాధ్యమైనంతవరకు నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
