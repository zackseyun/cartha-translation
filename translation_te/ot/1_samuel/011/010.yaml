id: 1SA.11.10
reference: 1 Samuel 11:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יֹּאמְרוּ֙ אַנְשֵׁ֣י יָבֵ֔ישׁ מָחָ֖ר נֵצֵ֣א אֲלֵי/כֶ֑ם וַ/עֲשִׂיתֶ֣ם לָּ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/010.yaml
  text: So the men of Jabesh said[a], “Tomorrow we will come out to you, and you may do to us whatever seems good in your eyes.”
translation:
  language: te
  text: అప్పుడు యాబేషు పురుషులు, “రేపు మేము మీ వద్దకు బయటికి వస్తాం[a]; మాపట్ల మీ దృష్టికి మంచిదనిపించినదంతా చేయండి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మేము మీ దగ్గరికి వెళ్తాం.’ హెబ్రీ పాఠంలో ‘లొంగిపోతాం’ అని స్పష్టంగా లేదు; అయితే సందర్భం లొంగుబాటును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు ... అన్నారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా ఉంటుంది.
- source_word: אַנְשֵׁי יָבֵישׁ
  choice: యాబేషు పురుషులు
  rationale: అక్షరార్థంగా ‘యాబేషు పురుషులు’; ఈ వచనంలో లేని ‘గిలాదు’ అనే విస్తృత స్థలనామాన్ని చేర్చలేదు.
- source_word: מָחָר
  choice: రేపు
  rationale: తరువాతి దినాన్ని సూచించే సాధారణ కాలవాచకం.
- source_word: נֵצֵא אֲלֵיכֶם
  choice: మేము మీ దగ్గరికి బయలుదేరి వస్తాం
  rationale: יצא అంటే ‘బయటికి వెళ్లడం/రావడం.’ సంబోధితుల దృక్కోణంలో ‘మీ దగ్గరికి ... వస్తాం’ సహజం; సందర్భం లొంగుబాటును సూచించినా మూలంలో అది స్పష్టంగా లేదు.
- source_word: וַעֲשִׂיתֶם לָּנוּ
  choice: మాకు చేయండి
  rationale: వారు బయటికి వచ్చిన తరువాత ప్రత్యర్థులు తమకు చేయడానికి అనుమతిస్తున్న లేదా అప్పగిస్తున్న భావాన్ని తెలుగు ఆజ్ఞార్థక రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  choice: మీ దృష్టికి ఏది మంచిదనిపిస్తే అది
  rationale: ‘మీ కళ్లలో మంచిది’ అనే హెబ్రీయ భావవ్యక్తీకరణను తెలుగు సహజత్వంతో పాటు దాని దృక్కోణార్థాన్ని నిలుపుతూ అనువదించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘మీ దృష్టికి మంచిది’ అనే నుడికారాన్ని కొంతవరకు నిలిపింది.
