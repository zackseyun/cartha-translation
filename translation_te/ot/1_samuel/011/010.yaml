revisions:
- from: అప్పుడు యాబేషు పురుషులు, “రేపు మేము మీ దగ్గరికి బయలుదేరి వస్తాం[a]; మీ దృష్టికి ఏది మంచిదనిపిస్తే అది మాకు చేయండి” అన్నారు.
  to: అప్పుడు యాబేషు పురుషులు, “రేపు మేము మీ వద్దకు బయటికి వస్తాం[a]; మాపట్ల మీ దృష్టికి మంచిదనిపించినదంతా చేయండి” అన్నారు.
  rationale: The revision explicitly represents the Hebrew “come/go out” while retaining its contextual ambiguity. It also clarifies that the requested action is to be done to the people of Jabesh, not for them, and preserves the source idiom concerning what appears good in the opponents’ eyes.
