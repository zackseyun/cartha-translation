translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సైనిక సందర్భం స్పష్టంగా ఉండేలా ‘ఎదురుగా శిబిరం వేశాడు’ అని ఇచ్చి, మూలంలో లేని పూర్తి ముట్టడి భావాన్ని చేర్చలేదు. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
