source:
  edition: WLC
  text: וַ/יַּ֗עַל נָחָשׁ֙ הָֽ/עַמּוֹנִ֔י וַ/יִּ֖חַן עַל יָבֵ֣שׁ גִּלְעָ֑ד וַ/יֹּ֨אמְר֜וּ כָּל אַנְשֵׁ֤י יָבֵישׁ֙ אֶל נָחָ֔שׁ כְּרָת לָ֥/נוּ בְרִ֖ית וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
translation:
  language: te
  text: అప్పుడు అమ్మోనీయుడైన నాహాషు పైకి వచ్చి యాబేషు-గిలాదుకు ఎదురుగా శిబిరం వేశాడు. యాబేషు పురుషులందరూ నాహాషుతో, “మాతో నిబంధన చేయి[a]; మేము నీకు సేవ చేస్తాం” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ మూలంలో అక్షరార్థంగా, “మాతో నిబంధన కోయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వచ్చి
  rationale: עלה కథన సందర్భంలో ‘పైకి రావడం/వెళ్లడం’ అని అర్థం; ఇక్కడ సైనిక కదలికను సూచించినా, ‘దండెత్తి’ అని మరింత వ్యాఖ్యానించకుండా హెబ్రీయ భావాన్ని నిలుపుతుంది.
- source_word: נָחָשׁ הָעַמּוֹנִי
  choice: అమ్మోనీయుడైన నాహాషు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, జాతివాచకాన్ని సహజమైన తెలుగు విశేషణ రూపంలో ఇచ్చాం.
- source_word: וַיִּחַן עַל
  choice: ఎదురుగా శిబిరం వేశాడు
  rationale: సైనిక సందర్భంలో חנה עם עַל ప్రత్యర్థికి ఎదురుగా మకాం వేయడాన్ని సూచిస్తుంది; ‘ముట్టడించాడు’ అనే బలమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: יָבֵשׁ גִּלְעָד
  choice: యాబేషు-గిలాదు
  rationale: సంయుక్త స్థలనామాన్ని తెలుగు లిప్యంతరీకరణలో స్పష్టంగా నిలిపాం.
- source_word: כָּל אַנְשֵׁי יָבֵישׁ
  choice: యాబేషు పురుషులందరూ
  rationale: אַנְשֵׁי అనే పదంలోని స్పష్టమైన పురుష లింగ సూచనను, ఈ పౌర-సైనిక చర్చ సందర్భానికి అనుగుణంగా నిలుపుతుంది.
- source_word: כְּרָת לָנוּ בְרִית
  choice: మాతో నిబంధన చేయి
  rationale: హెబ్రీయ నుడికారం అక్షరార్థంగా ‘నిబంధన కోయి’; సహజ తెలుగులో covenant భావాన్ని ‘నిబంధన చేయి’ స్పష్టంగా అందిస్తుంది.
- source_word: וְנַעַבְדֶךָּ
  choice: మేము నీకు సేవ చేస్తాం
  rationale: עבד + వ్యక్తి కర్మకు నేరుగా ‘సేవ చేయడం’ సరిపోతుంది; ‘లొంగిపోతాం’ లేదా ‘దాసులమవుతాం’ అనే అదనపు వ్యాఖ్యానాన్ని నివారిస్తుంది.
