id: 1SA.11.4
reference: 1 Samuel 11:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/מַּלְאָכִים֙ גִּבְעַ֣ת שָׁא֔וּל וַ/יְדַבְּר֥וּ הַ/דְּבָרִ֖ים בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂא֧וּ כָל הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
translation:
  language: te
  text: ఆ దూతలు సౌలు గిబియాకు వచ్చి, ప్రజలకు వినిపించేలా ఆ మాటలు చెప్పారు. అప్పుడు ప్రజలందరూ గొంతెత్తి ఏడ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: దూతలు
  rationale: ఈ సందర్భంలో వీరు యాబేషు నుండి పంపబడిన మానవ సందేశవాహకులు; తెలుగు వాడుకలో ‘దూతలు’ సందర్భానుసారంగా ఈ అర్థాన్ని సహజంగా ఇస్తుంది.
- source_word: גִּבְעַת שָׁאוּל
  choice: సౌలు గిబియా
  rationale: ఈ నిర్మాణం సౌలుతో సంబంధమున్న గిబియా పట్టణాన్ని సూచిస్తుంది. ‘సౌలు గిబియా’ హీబ్రూ సంబంధ నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיְדַבְּרוּ הַדְּבָרִים
  choice: ఆ మాటలు చెప్పారు
  rationale: ముందు తెలిపిన సందేశాన్ని సూచించే హీబ్రూ ‘ఆ మాటలు’ అనే భావాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: בְּאָזְנֵי הָעָם
  choice: ప్రజలకు వినిపించేలా
  rationale: అక్షరార్థంగా ‘ప్రజల చెవుల్లో’ అనే హీబ్రూ నుడికారం, వారు వినేలా బహిరంగంగా చెప్పడాన్ని సూచిస్తుంది; ఈ ఎంపిక శ్రవణ సంబంధ ఛాయను సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׂאוּ ... אֶת קוֹלָם
  choice: గొంతెత్తి
  rationale: ‘తమ స్వరాన్ని ఎత్తారు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; సామూహికంగా బిగ్గరగా విలపించడం అనే భావాన్ని అందిస్తుంది.
- source_word: וַיִּבְכּוּ
  choice: ఏడ్చారు
  rationale: ఈ క్రియ దుఃఖంతో ఏడవడాన్ని సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘ఏడ్చారు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כָל הָעָם
  choice: ప్రజలందరూ
  rationale: సమూహంలోని వారందరినీ సూచించే כָל భావాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
