translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ నుడికారాలను యాంత్రికంగా కాకుండా వాటి దృశ్య, శ్రవణ భావాలను నిలుపుతూ అనువదించబడింది.
