source:
  edition: WLC
  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם הַ/גִּלְגָּ֗ל וַ/יַּמְלִכוּ֩ שָׁ֨ם אֶת שָׁא֜וּל לִ/פְנֵ֤י יְהוָה֙ בַּ/גִּלְגָּ֔ל וַ/יִּזְבְּחוּ שָׁ֛ם זְבָחִ֥ים שְׁלָמִ֖ים לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּשְׂמַ֨ח שָׁ֥ם שָׁא֛וּל וְ/כָל אַנְשֵׁ֥י יִשְׂרָאֵ֖ל עַד מְאֹֽד־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
translation:
  language: te
  text: అప్పుడు ప్రజలందరూ గిల్గాలుకు వెళ్లారు. అక్కడ గిల్గాలులో యాహ్వే సన్నిధిలో సౌలును రాజుగా చేశారు. అక్కడ వారు యాహ్వే సన్నిధిలో సమాధాన బలులు[a] అర్పించారు. అక్కడ సౌలు, ఇశ్రాయేలు పురుషులందరూ ఎంతో ఆనందించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహవాస బలులు’ లేదా ‘క్షేమ బలులు.’ ఈ హీబ్రూ పదం సమాధానం, సంపూర్ణ క్షేమం, దేవుని సన్నిధిలో కలిసి పంచుకునే ఉత్సవంతో ముడిపడిన ఒక బలి వర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל־הָעָם
  choice: ప్రజలందరూ వెళ్లారు
  rationale: הלך అనే సాధారణ గమన క్రియను సహజమైన తెలుగు కథన శైలిలో ‘వెళ్లారు’గా, עָם అనే సమూహపదాన్ని ‘ప్రజలు’గా అనువదించాం.
- source_word: הַגִּלְגָּל
  choice: గిల్గాలు
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం; విభక్తితో ‘గిల్గాలుకు/గిల్గాలులో’ అని వాడాం.
- source_word: וַיַּמְלִכוּ ... אֶת־שָׁאוּל
  choice: సౌలును రాజుగా చేశారు
  rationale: מלך హిఫిల్ రూపం ‘పరిపాలించేలా చేయడం/రాజుగా చేయడం’ అనే అర్థాన్ని ఇస్తుంది. మూలంలో లేని అభిషేకం లేదా ప్రకటన భావాన్ని చేర్చలేదు.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: దేవుని సమక్షంలో జరిగిన బహిరంగ, ఆరాధనాపరమైన కార్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం.
- source_word: וַיִּזְבְּחוּ ... זְבָחִים שְׁלָמִים
  choice: సమాధాన బలులు అర్పించారు
  rationale: זבח యొక్క బలి సందర్భాన్ని ‘అర్పించారు’ సహజంగా వ్యక్తపరుస్తుంది; שְׁלָמִיםకు పరిచితమైన ‘సమాధాన బలులు’ను ఎంచుకుని ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: וְכָל אַנְשֵׁי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరూ
  rationale: אַנְשֵׁי అనే స్పష్టమైన పుంలింగ పదాన్ని తటస్థ సమూహపదంగా మార్చకుండా నిలిపాం.
- source_word: וַיִּשְׂמַח ... עַד־מְאֹד
  choice: ఎంతో ఆనందించారు
  rationale: తీవ్ర ఆనందాన్ని సూచించే עַד־מְאֹד బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపాం; తరువాత వచ్చే సంయుక్త కర్తకు అనుగుణంగా బహువచన క్రియను వాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ధ్వన్యనుకరణ చేశాం.
- issue: זְבָחִים שְׁלָמִים అనే బలి వర్గం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: ఈ పదంలో సమాధానం, సంపూర్ణ క్షేమం, దేవుని సన్నిధిలో పంచుకునే ఉత్సవ భోజనం వంటి అనుబంధ భావాలు ఉన్నాయి. ప్రధాన పాఠంలో పరిచిత పదాన్ని ఉంచి భావ పరిధిని పాదసూచికలో తెలిపాం.
- issue: אַנְשֵׁי יִשְׂרָאֵל లోని లింగ సూచన
  choice: ఇశ్రాయేలు పురుషులందరూ
  alternative: ఇశ్రాయేలీయులందరూ; ఇశ్రాయేలు ప్రజలందరూ
  rationale: మూలపదం నిర్దిష్టంగా ‘పురుషులు’ అని ఉన్నందున దాని లింగ సూచనను నిలిపాం; విస్తృత సమాజాన్ని సూచిస్తుందని ఊహించి తటస్థీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలిని వాడాం. ‘యాహ్వే సన్నిధిలో’ అనే పదబంధం ఆరాధనాపరమైన సందర్భాన్ని నిలుపుతుంది. మొదటి వాక్యంలోని ‘ప్రజలందరూ’ మరియు చివరి వాక్యంలోని నిర్దిష్టమైన ‘ఇశ్రాయేలు పురుషులందరూ’ మధ్య మూలపాఠంలో ఉన్న భేదాన్ని అలాగే ఉంచాం.
