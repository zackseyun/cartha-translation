base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/008.yaml
  text: He mustered them at Bezek[a], and the sons of Israel were three hundred thousand, and the men of Judah thirty thousand.
translation:
  language: te
  text: అతడు వారిని బేజెక్‌లో సమీకరించాడు. ఇశ్రాయేలు కుమారులు[a] మూడు లక్షల మంది, యూదా పురుషులు ముప్పై వేల మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయులు.’ హీబ్రూ మూలంలో ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  choice: వారిని సైన్యంగా సమీకరించి లెక్కించాడు
  rationale: פקד అనే క్రియ సైనిక సందర్భంలో కేవలం సంఖ్య లెక్కించడాన్ని కాక, యుద్ధానికి కూడినవారిని నమోదు చేసి లెక్కించడాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు ఈ సైనిక భావం స్పష్టంగా ఉండేందుకు ఈ సహజమైన పదబంధం వాడబడింది.
- source_word: בְּבָזֶק
  choice: బేజెకులో
  rationale: בָזֶק స్థలనామం కాబట్టి ‘బేజెక్’ అని లిప్యంతరీకరించబడింది; ב ఉపసర్గ ఇక్కడ సమీకరణ జరిగిన ప్రదేశాన్ని సూచిస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధమైన సామూహిక వ్యక్తీకరణను ప్రత్యక్షంగా నిలుపుతూ, ఈ వచనంలో యూదావారితో చూపిన సాహిత్యపరమైన భేదాన్ని సంరక్షిస్తుంది.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: మూడు లక్షల మంది
  rationale: హీబ్రూ సంఖ్య 300,000ను తెలుగులో సహజమైన భారతీయ సంఖ్యా పద్ధతిలో ‘మూడు లక్షలు’గా, వ్యక్తులను సూచించేందుకు ‘మంది’తో అనువదించాం.
- source_word: וְאִישׁ יְהוּדָה
  choice: యూదా పురుషులు
  rationale: אִישׁ ఏకవచన రూపంలో ఉన్నప్పటికీ ఇక్కడ సామూహిక అర్థంలో యూదాకు చెందిన పురుషులను సూచిస్తుంది.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: ముప్పై వేల మంది
  rationale: 30,000 అనే సంఖ్యను నేరుగా, వ్యక్తులకు తగిన ‘మంది’తో అనువదించాం.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל అనే గోత్రసంబంధమైన సామూహిక వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: ఇక్కడ సిద్ధాంతపరమైన వివాదం లేదు. అయితే మూలంలోని పురుషలింగ కుటుంబసంబంధ వ్యక్తీకరణను నిలుపుకోవడం వల్ల ఇశ్రాయేలు–యూదా విభజనకు సంబంధించిన వచన నిర్మాణం పారదర్శకంగా ఉంటుంది; సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. సైనిక సందర్భాన్ని స్పష్టం చేస్తూనే మూలంలోని సామూహిక పదప్రయోగం మరియు ఇశ్రాయేలు–యూదా భేదం నిలుపబడ్డాయి.
