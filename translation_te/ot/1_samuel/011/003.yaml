id: 1SA.11.3
reference: 1 Samuel 11:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו זִקְנֵ֣י יָבֵ֗ישׁ הֶ֤רֶף לָ֨/נוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/נִשְׁלְחָה֙ מַלְאָכִ֔ים בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/אִם אֵ֥ין מוֹשִׁ֛יעַ אֹתָ֖/נוּ וְ/יָצָ֥אנוּ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: te
  text: 'యాబేషు పెద్దలు అతనితో ఇలా అన్నారు: “మాకు ఏడు రోజుల విరామం ఇవ్వు. ఇశ్రాయేలు భూభాగమంతటా దూతలను పంపుతాం. మమ్మల్ని రక్షించేవాడు ఎవరూ లేకపోతే, మేము బయటికి వచ్చి నీ దగ్గరకు వస్తాం.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף לָנוּ
  choice: మాకు ... గడువు ఇవ్వు
  rationale: హెరెఫ్ అనే క్రియకు ఇక్కడ ‘విడిచిపెట్టు/విరామమివ్వు’ అనే భావం ఉంది. ముట్టడి సందర్భంలో సహజమైన ఆధునిక తెలుగులో తాత్కాలిక విరామాన్ని ‘గడువు ఇవ్వు’ అని తెలిపాం.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రాంతమంతటా
  rationale: గెవూల్ పదం సందర్భానుసారంగా సరిహద్దు, భూభాగం లేదా ప్రాంతం అని అర్థమిస్తుంది; దూతలను పంపే పరిధిని ఇక్కడ ‘ప్రాంతమంతటా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מוֹשִׁיעַ
  choice: రక్షించేవాడు
  rationale: హోషీయ మూలంలోని హిఫీల్ రూపం ‘విడిపించేవాడు/రక్షించేవాడు’ అని సూచిస్తుంది. సైనిక ఆపద నుంచి రక్షణ అనే సందర్భార్థాన్ని ఉంచాం.
- source_word: וְיָצָאנוּ אֵלֶיךָ
  choice: మేము నీ దగ్గరికి బయటికి వస్తాం
  rationale: ముట్టడిలో ఉన్న పట్టణం నుంచి శత్రువు వద్దకు బయలుదేరి రావడం అనే మూలపాఠంలోని దృశ్యాన్ని ‘బయటికి వస్తాం’ నిలుపుతుంది; ఇది లొంగిపోవడాన్ని సందర్భం సూచించినా, ఆ భావాన్ని పాఠ్యంలో అదనంగా చేర్చలేదు.
theological_decisions:
- issue: מוֹשִׁיעַ అనే పదంలో రక్షకుని గుర్తింపు
  choice: మమ్మల్ని రక్షించేవాడు ఎవడూ లేకపోతే
  alternative: మాకు సహాయం చేసేవాడు ఎవడూ లేకపోతే
  rationale: మూలపాఠం రక్షించే వ్యక్తిని సాధారణంగా సూచిస్తుంది; అది దేవుడా, మానవ విమోచకుడా అని ఈ వాక్యం నిర్దిష్టంగా చెప్పదు. కాబట్టి ఆ అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే సంభాషణ శైలిని వాడాం. మూలంలోని బహువచన వక్తలు, ఏడు రోజుల వ్యవధి, దూతల పంపకం, రక్షకుడు లేకపోవడం, పట్టణం నుంచి బయటికి రావడం అన్నీ నిలుపబడ్డాయి.
