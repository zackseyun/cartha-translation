id: 1SA.11.13
reference: 1 Samuel 11:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל לֹֽא יוּמַ֥ת אִ֖ישׁ בַּ/יּ֣וֹם הַ/זֶּ֑ה כִּ֥י הַ/יּ֛וֹם עָשָֽׂה יְהוָ֥ה תְּשׁוּעָ֖ה בְּ/יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
translation:
  language: te
  text: అయితే సౌలు, “ఈ రోజున ఏ ఒక్కరినీ మరణశిక్షకు గురిచేయకూడదు; ఎందుకంటే ఈ రోజు యహ్వే ఇశ్రాయేలులో రక్షణ[a] కార్యం చేశాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విడుదల కార్యం చేశాడు’; లేదా, ‘ఇశ్రాయేలులో విజయం ఇచ్చాడు.’
    reason: תְּשׁוּעָה సైనిక సందర్భంలో ‘రక్షణ,’ ‘విడుదల,’ లేదా ‘విజయం’ అని అర్థమివ్వగలదు; עָשָׂה תְּשׁוּעָה అనేది దేవుడు రక్షణను కార్యరూపంలో కలిగించాడనే భావాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే సౌలు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ముందు వచనంలోని ప్రజల ప్రతిపాదనకు సౌలు పలికిన మాట వ్యతిరేకంగా ఉన్నందున ‘అయితే’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: לֹא יוּמַת אִישׁ
  choice: ఏ ఒక్కరికీ మరణశిక్ష విధించకూడదు
  rationale: יוּמַת అనేది מות ధాతువు యొక్క హోఫల్ రూపం; కేవలం ‘చనిపోవడం’ కాక, ఒకరిని చంపించడం లేదా న్యాయపరంగా మరణశిక్ష అమలు చేయడం అనే భావాన్ని ఇస్తుంది. אִישׁ ఇక్కడ సాధారణ పంపిణీ భావంలో ‘ఏ ఒక్కరికీ’ అని అనువదించబడింది.
- source_word: בַּיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: తెలుగులో సహజమైన కాల సూచన; హెబ్రీలోని నిర్దిష్ట దిన ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సౌలు వారిని ఎందుకు చంపకూడదో తెలిపే కారణార్థక సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: మూలంలోని పునరుక్తిని ఉద్దేశపూర్వకంగా నిలుపుతూ ఆ దినానికున్న ప్రాధాన్యాన్ని తెలియజేస్తుంది.
- source_word: עָשָׂה יְהוָה תְּשׁוּעָה
  choice: యహ్వే ... రక్షణ కలిగించాడు
  rationale: עשה תשועה అనే ప్రయోగం రక్షణను లేదా విడుదలను కార్యరూపంలో కలిగించడాన్ని సూచిస్తుంది. ‘రక్షణ’ సైనిక విజయానికి మించిన హెబ్రీ పదపు విస్తృత భావాన్ని నిలుపుతుంది; ‘కలిగించాడు’ దైవ కార్యసాధకత్వాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: בְּ ఉపసర్గ యొక్క ప్రత్యక్ష స్థానార్థాన్ని నిలుపుతుంది; ‘ఇశ్రాయేలు కొరకు’ అనే ప్రయోజనార్థక వివరణను ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల బిరుదైన ‘ప్రభువు’తో దాన్ని భర్తీ చేయకుండా, ‘Jehovah’ రూపానికి బదులు సాధారణంగా పునర్నిర్మించిన ‘Yahweh’ ఉచ్చారణను తెలుగులో ‘యహ్వే’గా ఇచ్చాం.
- issue: సైనిక విమోచన సందర్భంలో תְּשׁוּעָה అనువాదం
  choice: రక్షణ
  alternative: విడుదల; విజయం
  rationale: సందర్భంలో అమ్మోనీయులపై సాధించిన విజయం ఉద్దేశంలో ఉన్నప్పటికీ, תְּשׁוּעָה పదానికి ఉన్న విస్తృతమైన రక్షణ/విమోచన భావాన్ని ‘రక్షణ’ నిలుపుతుంది. ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చి సందర్భంలోని భావసాధ్యతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఏ ఒక్కరికీ మరణశిక్ష విధించకూడదు’ అనే రూపం మూలంలోని న్యాయపరమైన నిష్క్రియార్థాన్ని సహజంగా నిలుపుతుంది. మూలంలోని ‘ఈ రోజు’ పునరుక్తి ఉద్దేశపూర్వకంగా కాపాడబడింది.
