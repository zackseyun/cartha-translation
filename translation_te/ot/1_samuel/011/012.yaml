reference: 1 Samuel 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/עָם֙ אֶל שְׁמוּאֵ֔ל מִ֣י הָ/אֹמֵ֔ר שָׁא֖וּל יִמְלֹ֣ךְ עָלֵ֑י/נוּ תְּנ֥וּ הָ/אֲנָשִׁ֖ים וּ/נְמִיתֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/012.yaml
  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
translation:
  language: te
  text: అప్పుడు ప్రజలు సమూయేలుతో, “సౌలు మన మీద రాజ్యమేలుతాడా?[a] అని అన్నవాడు ఎవరు? ఆ మనుష్యులను అప్పగించండి; మేము వారిని చంపుతాం” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సౌలు మన మీద రాజ్యమేలుతాడా?”ను “సౌలు మన మీద రాజ్యమేలుతాడు” అని అనువదించవచ్చు. హీబ్రూ అసంపూర్ణ క్రియారూపం ఇక్కడ భవిష్యత్తును సూచించే ప్రశ్నగా లేదా—ఈ సందర్భంలో తక్కువ సంభావ్యంగా—ఒక ప్రకటనగా అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది. ‘ప్రజలు’ సమూహవాచకం కావడంతో తెలుగులో బహువచన క్రియ సహజం.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇక్కడ సమక్షంలో ఉన్న ఇశ్రాయేలు ప్రజలను సమిష్టిగా సూచించే సాధారణ, సహజమైన పదం.
- source_word: אֶל שְׁמוּאֵל
  choice: సమూయేలుతో
  rationale: మాట్లాడే వ్యక్తి ఎవరనే దిశను אֶל సూచిస్తుంది; తెలుగులో ‘సమూయేలుతో ... అన్నారు’ సహజమైన వాక్యనిర్మాణం.
- source_word: מִי הָאֹמֵר
  choice: అన్నది ఎవరు?
  rationale: ప్రశ్నార్థక పదం మరియు నిర్దిష్ట కృదంతం కలిసి ‘అలా అన్న వ్యక్తి ఎవరు?’ అనే గుర్తింపు ప్రశ్నను వ్యక్తం చేస్తాయి; తెలుగు ప్రత్యక్ష సంభాషణలో ‘అన్నది ఎవరు?’ సహజంగా ఉంటుంది.
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: సౌలు మన మీద రాజుగా పరిపాలిస్తాడా?
  rationale: మునుపటి వ్యతిరేకతను గుర్తుచేసే ప్రశ్నగా సందర్భం బలంగా సూచిస్తుంది. ‘రాజుగా పరిపాలించు’ అనేది מלך లోని రాజరిక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: תְּנוּ
  choice: అప్పగించండి
  rationale: దోషులుగా భావించిన వారిని తీర్పు కోసం తమ చేతికి ఇవ్వాలనే ఆజ్ఞార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుష్యులను
  rationale: ఇప్పుడే ప్రస్తావించిన వ్యతిరేకులను నిర్దిష్టంగా సూచిస్తుంది; తెలుగు సందర్భంలో ‘ఆ’ అనేది ఆ నిర్దిష్టతను స్పష్టం చేస్తుంది.
- source_word: וּנְמִיתֵם
  choice: మేము వారిని చంపుతాం
  rationale: מות హిఫిల్ రూపం ‘చనిపోయేలా చేయడం’ అని అర్థం. ఇక్కడ ప్రజలు స్వయంగా మరణశిక్ష అమలు చేయాలనే ఉద్దేశాన్ని సూటిగా, సహజంగా ‘చంపుతాం’ తెలియజేస్తుంది.
theological_decisions:
- issue: יִמְלֹךְ యొక్క విధి—ప్రశ్నా లేక ప్రకటన
  choice: ‘సౌలు మన మీద రాజుగా పరిపాలిస్తాడా?’ అనే ప్రశ్న
  alternative: ‘సౌలు మన మీద రాజుగా పరిపాలిస్తాడు’ అనే ప్రకటన; లేదా ‘పరిపాలిస్తాడా?’ను ‘పరిపాలించాలా?’గా అర్థం చేయడం
  rationale: హీబ్రూ ఇంపర్ఫెక్ట్ రూపం స్వతహాగా ప్రశ్నార్థక కణం లేకపోయినా, 1 సమూయేలు 10:27లోని వ్యతిరేక స్వరాన్ని ఈ సందర్భం తిరిగి ప్రస్తావిస్తున్నందున ప్రశ్నార్థక పఠనం అత్యంత సంభావ్యం. అయినా వ్యాకరణ రూపంలో ఉన్న నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘రాజుగా పరిపాలిస్తాడా’ రాజరిక భావాన్ని నిలుపుతుంది; ‘అప్పగించండి’ న్యాయాత్మక సందర్భాన్ని, ‘చంపుతాం’ మూలంలోని నేరుగా ఉన్న తీవ్రతను వ్యక్తం చేస్తాయి. పాదసూచిక గుర్తు సంబంధిత ఉల్లేఖన ప్రశ్న వెంట ఉంచబడింది.
