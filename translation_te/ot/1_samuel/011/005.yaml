id: 1SA.11.5
reference: 1 Samuel 11:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה שָׁא֗וּל בָּ֣א אַחֲרֵ֤י הַ/בָּקָר֙ מִן הַ/שָּׂדֶ֔ה וַ/יֹּ֣אמֶר שָׁא֔וּל מַה לָּ/עָ֖ם כִּ֣י יִבְכּ֑וּ וַ/יְסַ֨פְּרוּ ל֔/וֹ אֶת דִּבְרֵ֖י אַנְשֵׁ֥י יָבֵֽישׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
translation:
  language: te
  text: ఇదిగో, సౌలు పొలం నుండి పశువుల వెనుక వస్తున్నాడు.[a] అప్పుడు సౌలు, “ప్రజలకు ఏమైంది? వారు ఎందుకు ఏడుస్తున్నారు?” అని అడిగాడు. వారు యాబేషు మనుష్యుల మాటలను[b] అతనికి తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎద్దులను అనుసరిస్తూ పొలం నుండి వస్తున్నాడు.” హీబ్రూ పదబంధం సౌలు పశువుల వెనుక నడుచుకుంటూ వస్తున్న దృశ్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాబేషు మనుష్యుల సందేశాన్ని.” అక్షరార్థంగా, “యాబేషు మనుష్యుల మాటలను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కథనంలో దృశ్యమార్పును సూచిస్తూ, సంఘటనను సజీవంగా పాఠకుని ముందుకు తెచ్చే హీబ్రూ ప్రయోగాన్ని నిలుపుతుంది.
- source_word: בָּא
  choice: వస్తున్నాడు
  rationale: హీబ్రూ కృదంతం సూచించే కొనసాగుతున్న నేపథ్య చర్యను సహజమైన తెలుగు వర్తమాన కొనసాగింపు రూపంతో వ్యక్తం చేస్తుంది.
- source_word: אַחֲרֵי הַבָּקָר
  choice: పశువుల వెనుక
  rationale: אַחֲרֵי అనే పదంలోని స్థలార్థమైన ‘వెనుక’ భావాన్ని నిలుపుతుంది; בָּקָרను కేవలం ఎద్దులకే పరిమితం చేయకుండా గోవుల వర్గానికి చెందిన పశువులుగా అనువదిస్తుంది.
- source_word: מִן הַשָּׂדֶה
  choice: పొలం నుండి
  rationale: సౌలు వస్తున్న ప్రదేశాన్ని నేరుగా, సహజంగా సూచిస్తుంది.
- source_word: מַה לָעָם כִּי יִבְכּוּ
  choice: ప్రజలకు ఏమైంది? వారు ఎందుకు ఏడుస్తున్నారు?
  rationale: హీబ్రూ ప్రశ్నలోని ‘ప్రజలకు ఏమైంది, వారు ఏడుస్తుండటానికి?’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో రెండు అనుసంధాన ప్రశ్నలుగా వ్యక్తం చేస్తుంది.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: వారు అతనికి తెలియజేశారు
  rationale: విన్న విషయాన్ని సౌలుకు వివరించి చెప్పారనే కథన భావాన్ని స్పష్టమైన సాధారణ తెలుగులో అందిస్తుంది.
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  choice: యాబేషు మనుష్యుల మాటలను
  rationale: దִּבְרֵי యొక్క అక్షరార్థమైన ‘మాటలు’ను నిలుపుతూ, యాబేషు పట్టణపు పురుషులు లేదా ప్రతినిధులను సూచించే אַנְשֵׁיను ‘మనుష్యులు’గా అనువదిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా హీబ్రూ దృశ్యమార్పు సూచికను నిలిపి, కొనసాగుతున్న చర్యకు ‘వస్తున్నాడు’ను ఉపయోగించాం. మూలంలోని పునరుక్తమైన ‘సౌలు’ను తెలుగులో సహజంగా ఉంచాం.
