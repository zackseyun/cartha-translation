source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל הָ/עָ֔ם לְכ֖וּ וְ/נֵלְכָ֣ה הַ/גִּלְגָּ֑ל וּ/נְחַדֵּ֥שׁ שָׁ֖ם הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/014.yaml
  text: Then Samuel said to the people[a], “Come, let us go to Gilgal, and there renew the kingship.”
translation:
  language: te
  text: 'అప్పుడు సమూయేలు ప్రజలతో ఇలా అన్నాడు: “రండి, మనం గిల్గాలుకు వెళ్లి అక్కడ రాజరికాన్ని పునరుద్ధరిద్దాం[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజరికాన్ని మళ్లీ ధృవీకరిద్దాం”; లేదా, “రాజ్యాన్ని పునరుద్ధరిద్దాం.”
    reason: חדש మరియు מְלוּכָה పదాల కలయిక సందర్భంలో రాజపదవిని మళ్లీ ధృవీకరించడం, రాజరికాన్ని పునరుద్ధరించడం, లేదా రాజ్యాన్ని నూతనీకరించడం అనే సమీపార్థాలకు అవకాశం ఇస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֶל הָעָם
  choice: ప్రజలతో
  rationale: עָם ఇక్కడ కూడివున్న ఇశ్రాయేలు ప్రజలను సూచిస్తుంది; ‘ప్రజలు’ సాధారణమైన, సందర్భోచితమైన అర్థం.
- source_word: לְכוּ וְנֵלְכָה
  choice: రండి, మనం ... వెళ్దాం
  rationale: ఆహ్వానార్థక ఆజ్ఞతో పాటు ఉన్న ప్రథమ పురుష బహువచన కోహోర్టేటివ్‌ను సహజమైన తెలుగు సంయుక్త ఆహ్వానంగా వ్యక్తం చేస్తుంది.
- source_word: הַגִּלְגָּל
  choice: గిల్గాలు
  rationale: స్థలనామానికి తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: וּנְחַדֵּשׁ
  choice: పునరుద్ధరిద్దాం
  rationale: חדש పియేల్ రూపం ‘మళ్లీ కొత్తగా చేయడం/పునరుద్ధరించడం’ అనే భావాన్ని ఇస్తుంది; సందర్భంలో సౌలు రాజరికాన్ని బహిరంగంగా మళ్లీ స్థిరపరచడం సూచితమవుతుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: గిల్గాలును సూచించే స్థానవాచక క్రియావిశేషణానికి నేరమైన తెలుగు సమానం.
- source_word: הַמְּלוּכָה
  choice: రాజరికం
  rationale: מְלוּכָה ఇక్కడ భూభాగమైన రాజ్యం కంటే రాజపదవి లేదా రాజపాలనా వ్యవస్థను సూచిస్తుంది; ‘రాజరికం’ ఆ సంస్థాగత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: הַמְּלוּכָהను పునరుద్ధరించడం అనే భావం
  choice: సౌలు రాజరికాన్ని బహిరంగంగా పునరుద్ధరించడం లేదా మళ్లీ స్థిరపరచడం
  alternative: రాజ్యాన్ని తిరిగి నెలకొల్పడం; రాజరిక వ్యవస్థను విస్తృత జాతీయ అర్థంలో నూతనీకరించడం
  rationale: ఈ వాక్యం యాబేషు-గిలాదు విమోచన తర్వాత ప్రజలు సౌలుకు తిరిగి మద్దతు తెలిపిన సందర్భంలో ఉంది. అనువాదం పట్టాభిషేక కర్మను అతిగా నిర్దిష్టీకరించకుండా, హెబ్రీ పదంలోని పునరుద్ధరణ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘రండి, మనం ... వెళ్దాం’ సాధారణ పాఠకుడికి స్పష్టంగా ఉండే ఆహ్వాన రూపం; ‘రాజరికం’ రాజ్యం అనే భూభాగ భావం కంటే రాజపదవి/రాజపాలనా వ్యవస్థ భావాన్ని కాపాడుతుంది.
