id: 1SA.11.2
reference: 1 Samuel 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: te
  text: 'అమ్మోనీయుడైన నాహాషు వారితో ఇలా అన్నాడు: “ఈ షరతుమీద నేను మీతో ఒప్పందం చేసుకుంటాను: మీలో ప్రతి ఒక్కరి కుడి కన్ను పొడిచి తీయాలి; అలా నేను ఇశ్రాయేలు అంతటికీ అవమానం కలిగిస్తాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּזֹאת אֶכְרֹת לָכֶם
  choice: ఈ షరతుమీద నేను మీతో ఒప్పందం చేసుకుంటాను
  rationale: ‘దీనితో/ఈ విధంగా మీతో నిబంధన కుదుర్చుకుంటాను’ అనే హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో షరతుతో కూడిన ఒప్పందంగా వ్యక్తం చేస్తుంది.
- source_word: בִּנְקוֹר לָכֶם כָּל־עֵין יָמִין
  choice: మీలో ప్రతి ఒక్కరి కుడి కన్ను పొడిచి తీయాలి
  rationale: נקר క్రియలోని కన్నును పొడిచి నాశనం చేయడం లేదా తీసివేయడం అనే హింసాత్మక భావాన్ని స్పష్టంగా ఉంచుతుంది; כָּל־עֵין יָמִיןను ప్రతి వ్యక్తి కుడి కన్నుగా సహజంగా అందిస్తుంది.
- source_word: וְשַׂמְתִּיהָ חֶרְפָּה עַל כָּל־יִשְׂרָאֵל
  choice: అలా నేను ఇశ్రాయేలు అంతటికీ అవమానం కలిగిస్తాను
  rationale: ప్రత్యయానికి సూచితమైన చర్యను తెలుగులో ‘అలా’ అని సహజంగా పునరుద్ధరించి, חֶרְפָּהను ప్రజలపై మోపబడే ‘అవమానం’గా అనువదిస్తుంది.
theological_decisions:
- issue: కుడి కన్ను తొలగించే క్రియను ఎవరు నిర్వహిస్తారన్న వ్యాకరణ సంబంధం
  choice: ‘పొడిచి తీయాలి’ అనే షరతుగా ఉంచడం
  alternative: ‘నేను మీ కుడి కళ్లన్నిటినీ పొడిచి తీస్తాను’
  rationale: בִּנְקוֹר అనే ఇన్ఫినిటివ్ నిర్మాణం ఒప్పందపు షరతును తెలుపుతుంది; కార్యనిర్వాహకుడిని మూలం స్పష్టంగా పేర్కొననందున తెలుగులో అనవసరంగా నిర్ణయించలేదు.
- issue: అవమానం కలిగించే చర్యతో రెండో వాక్యభాగపు సంబంధం
  choice: ‘అలా నేను... అవమానం కలిగిస్తాను’
  alternative: ‘మరియు దానిని... అవమానంగా ఉంచుతాను’
  rationale: וְשַׂמְתִּיהָలోని స్త్రీలింగ ప్రత్యయం ముందున్న కన్ను పొడిచే చర్య లేదా పరిస్థితిని సూచించే అవకాశముంది; సహజ తెలుగులో దాని సూచనను నిలిపి, ప్రత్యేక సిద్ధాంతార్థం జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కథన శైలి. ‘ఒప్పందం’, ‘షరతు’, ‘అవమానం’ వంటి సాధారణంగా అర్థమయ్యే పదాలు వాడబడ్డాయి. మూలంలోని క్రూరమైన బెదిరింపును మృదూకరించకుండా, అయితే అసహజ పదప్రయోగం లేకుండా అందించబడింది.
