source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּ֨שֶׂם שָׁא֣וּל אֶת הָ/עָם֮ שְׁלֹשָׁ֣ה רָאשִׁים֒ וַ/יָּבֹ֤אוּ בְ/תוֹךְ הַֽ/מַּחֲנֶה֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּכּ֥וּ אֶת עַמּ֖וֹן עַד חֹ֣ם הַ/יּ֑וֹם וַ/יְהִ֤י הַ/נִּשְׁאָרִים֙ וַ/יָּפֻ֔צוּ וְ/לֹ֥א נִשְׁאֲרוּ בָ֖/ם שְׁנַ֥יִם יָֽחַד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/011.yaml
  text: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
translation:
  language: te
  text: మరుసటి రోజు సౌలు ప్రజలను మూడు దళాలుగా[a] విభజించాడు. వారు తెల్లవారుజాము కావలి సమయంలో[b] శిబిరం మధ్యలోకి ప్రవేశించి, పగలు వేడెక్కే వరకు[c] అమ్మోనీయులపై దాడి చేశారు. మిగిలినవారు చెదిరిపోయారు; వారిలో ఇద్దరు కూడా కలిసి మిగలలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘మూడు తలలుగా’; ఇది మూడు విభాగాలు లేదా దళాలు అనే సైనిక నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ‘తెల్లవారుజాము కావలి’ అనేది ఉదయానికి ముందు లేదా ఉదయం ఆరంభంలోని సైనిక కావలి కాలం.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా ‘దినపు వేడి వరకు’; అంటే పగలు వేడెక్కిన సమయం, బహుశా మధ్యాహ్నానికి సమీపంగా.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: మునుపటి సంఘటనల తరువాతి రోజును సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וַיָּשֶׂם ... שְׁלֹשָׁה רָאשִׁים
  choice: ప్రజలను మూడు దళాలుగా విభజించాడు
  rationale: అక్షరార్థంగా ‘మూడు తలలు’ అనే హీబ్రూ సైనిక నుడికారం మూడు విభాగాలు లేదా దళాలను సూచిస్తుంది.
- source_word: בְתוֹךְ הַמַּחֲנֶה
  choice: శిబిరం మధ్యలోకి చొరబడి
  rationale: శత్రు శిబిరం లోపలికి ప్రవేశించిన భావాన్ని, సందర్భంలోని దాడి తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: తెల్లవారుజాము కావలి సమయంలో
  rationale: ఉదయానికి ముందు లేదా ఉదయం ఆరంభంలో ఉండే సైనిక కావలి కాలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּכּוּ אֶת עַמּוֹן
  choice: అమ్మోనీయులను హతమార్చారు
  rationale: ‘అమ్మోను’ ఇక్కడ అమ్మోనీయుల సైన్యానికి సమష్టి నామంగా ఉంది; נכה యొక్క ఈ యుద్ధ సందర్భంలోని ప్రాణాంతక దాడి భావాన్ని తెలియజేస్తుంది.
- source_word: עַד חֹם הַיּוֹם
  choice: పగలు వేడెక్కే వరకు
  rationale: ‘దినపు వేడి వరకు’ అనే హీబ్రూ చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ఖచ్చితంగా మధ్యాహ్నం అని అతిగా నిర్ధారించదు.
- source_word: הַנִּשְׁאָרִים וַיָּפֻצוּ
  choice: మిగిలినవారు చెదిరిపోయారు
  rationale: యుద్ధం తరువాత బతికి మిగిలినవారు పూర్తిగా చెల్లాచెదరైన భావాన్ని సంక్షిప్తంగా ఇస్తుంది.
- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  choice: వారిలో ఇద్దరు కూడా కలిసి మిగలలేదు
  rationale: శత్రు బలగం ఎంత సంపూర్ణంగా చెదిరిపోయిందో తెలిపే హీబ్రూ దృశ్యాన్ని నిలుపుతుంది.
