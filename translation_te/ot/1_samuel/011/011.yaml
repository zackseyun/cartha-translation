translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. హీబ్రూ వరుస కథన సూత్రాలను తెలుగులో పదేపదే ‘అలా జరిగింది’ అని యాంత్రికంగా పునరుత్పత్తి చేయకుండా, సంఘటనల క్రమాన్ని స్పష్టంగా ఉంచాం. సైనిక సందర్భాన్ని తెలియజేయడానికి ‘దళాలు’, ‘కావలి’, ‘శిబిరం’ వంటి సాధారణంగా అర్థమయ్యే పదాలు వాడాం.
