id: 1SA.25.15
reference: 1 Samuel 25:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ֣/אֲנָשִׁ֔ים טֹבִ֥ים לָ֖/נוּ מְאֹ֑ד וְ/לֹ֤א הָכְלַ֨מְנוּ֙ וְ/לֹֽא פָקַ֣דְנוּ מְא֔וּמָה כָּל יְמֵי֙ הִתְהַלַּ֣כְנוּ אִתָּ֔/ם בִּֽ/הְיוֹתֵ֖/נוּ בַּ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/015.yaml
  text: Yet the men were very good to us[a], and we were not mistreated[b], nor did we miss anything all the days we went about with them while we were in the field.
translation:
  language: te
  text: అయినా, ఆ మనుషులు మాతో చాలా మంచిగా ప్రవర్తించారు; వారు మమ్మల్ని అవమానించలేదు[a], మేము పొలంలో వారితో కలిసి తిరిగిన రోజులన్నిటిలో ఏదీ కోల్పోలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు మమ్మల్ని సిగ్గుపరచలేదు” లేదా “మాకు ఎలాంటి అవమానమూ కలగలేదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఏదీ కనిపించకుండా పోలేదు” లేదా “మాకు ఏదీ లోటు కాలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: అయినా, ఆ మనుషులు
  rationale: వావ్‌ను సందర్భంలోని వ్యతిరేక భావానికి అనుగుణంగా ‘అయినా’ అని ఇచ్చి, אֲנָשִׁיםను సహజంగా ‘ఆ మనుషులు’ అని అనువదించాం.
- source_word: טֹבִים לָנוּ מְאֹד
  choice: మాతో చాలా మంచిగా ప్రవర్తించారు
  rationale: టోవ్ + లె నిర్మాణం వారికి మేలు చేసే విధంగా ప్రవర్తించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: וְלֹא הָכְלַמְנוּ
  choice: వారు మమ్మల్ని అవమానించలేదు
  rationale: כלם హోఫాల్ రూపంలోని ‘సిగ్గుపరచబడలేదు/అవమానించబడలేదు’ అనే నిష్క్రియ భావాన్ని తెలుగులో సహజమైన కర్తరి వాక్యంగా వ్యక్తం చేశాం; విస్తృతమైన ‘హాని చేయలేదు’ అనే భావాన్ని ప్రధాన పాఠ్యంలోకి తేవలేదు.
- source_word: וְלֹא פָקַדְנוּ מְאוּמָה
  choice: మా వస్తువేదీ కనిపించకుండా పోలేదు
  rationale: ఈ సందర్భంలో פקד + ప్రతికూలత + מְאוּמָה ఏ వస్తువూ తప్పిపోలేదని లేదా లెక్కలో తగ్గలేదని సూచిస్తుంది. ‘మాకు ఏ కొరతా రాలేదు’ అనే సాధ్యమైన విస్తృత అర్థాన్ని కాక, మందకాపరుల ఆస్తి భద్రత సందర్భాన్ని ప్రతిబింబించాం.
- source_word: כָּל יְמֵי הִתְהַלַּכְנוּ אִתָּם
  choice: వారితో కలిసి తిరిగిన రోజులన్నిటిలో
  rationale: హిత్పయేల్ రూపంలోని కొనసాగిన సంచారం/సహవాస భావాన్ని ‘కలిసి తిరిగిన’ అని నిలిపాం.
- source_word: בִּהְיוֹתֵנוּ בַּשָּׂדֶה
  choice: మేము పొలాల్లో ఉన్నప్పుడు
  rationale: שׂדה ఇక్కడ మేతభూములు లేదా బహిరంగ ప్రదేశాన్ని సూచించవచ్చు; సందర్భానికి సహజంగా బహువచన ‘పొలాల్లో’ వాడాం.
