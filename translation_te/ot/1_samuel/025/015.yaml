translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హెబ్రీ మూలంలోని వరుస వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు ఉంచుతూ, తెలుగు సహజత్వం కోసం కర్తను స్పష్టంచేశాం.
