id: 1SA.25.18
reference: 1 Samuel 25:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּמַהֵ֣ר אבוגיל וַ/תִּקַּח֩ מָאתַ֨יִם לֶ֜חֶם וּ/שְׁנַ֣יִם נִבְלֵי יַ֗יִן וְ/חָמֵ֨שׁ צֹ֤אן עשוות וְ/חָמֵ֤שׁ סְאִים֙ קָלִ֔י וּ/מֵאָ֥ה צִמֻּקִ֖ים וּ/מָאתַ֣יִם דְּבֵלִ֑ים וַ/תָּ֖שֶׂם עַל הַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
translation:
  language: te
  text: అప్పుడు అబీగయీలు త్వరపడి రెండువందల రొట్టెలు, రెండు ద్రాక్షారసపు తోలు తిత్తులు, సిద్ధం చేసిన ఐదు గొర్రెలు, వేయించిన ధాన్యం ఐదు సేయాలు[a], వంద ఎండుద్రాక్ష గుత్తులు, రెండువందల అత్తిపండ్ల ముద్దలు తీసుకొని, వాటిని గాడిదల మీద పెట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేయించిన ధాన్యం ఐదు కొలతలు.’ సేయా అనేది పురాతన కాలంలోని ఒక పొడి కొలమానం.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: అప్పుడు అబీగయీలు త్వరపడి
  rationale: ఈ క్రియకు ‘త్వరపడు’ అనే అర్థం ఉంది. ‘అప్పుడు’ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘త్వరపడి’ సందర్భంలోని ఆవశ్యకతను నిలుపుతుంది.
- source_word: וַתִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ క్రియకు నేరమైన అర్థం ‘తీసుకొను’. తరువాత వచ్చే సరఫరాల జాబితాతో తెలుగులో సహజంగా కలిసేలా అసమాపక రూపం వాడబడింది.
- source_word: מָאתַיִם לֶחֶם
  choice: రెండువందల రొట్టెలు
  rationale: לֶחֶם ప్రాథమికంగా ‘రొట్టె/ఆహారం’; సంఖ్యతో లెక్కించబడుతున్న ఈ సందర్భంలో విడివిడిగా ఉన్న రొట్టెలు ఉద్దేశించబడ్డాయని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁנַיִם נִבְלֵי יַיִן
  choice: రెండు ద్రాక్షారసపు తోలు తిత్తులు
  rationale: נֵבֶל ఇక్కడ ద్రవాన్ని ఉంచే పురాతన తోలు పాత్రను సూచిస్తుంది. ‘తోలు తిత్తులు’ అనేది ఆధునిక సీసా లేదా జాడీ అనే కాలవిరుద్ధ భావాన్ని నివారిస్తుంది.
- source_word: חָמֵשׁ צֹאן עֲשׂוּיוֹת
  choice: సిద్ధం చేసిన ఐదు గొర్రెలు
  rationale: עֲשׂוּיוֹת గొర్రెలు ఆహారంగా ఉపయోగించడానికి సిద్ధం చేయబడ్డాయని సూచిస్తుంది. అవి ఖచ్చితంగా వండబడ్డాయా లేక వేరే దశ వరకు సిద్ధం చేయబడ్డాయా అని మూలపాఠం నిర్దిష్టం చేయనందున ‘సిద్ధం చేసిన’ అని ఉంచబడింది.
- source_word: חָמֵשׁ סְאִים קָלִי
  choice: వేయించిన ధాన్యం ఐదు సేయాలు
  rationale: סְאִים ఒక నిర్దిష్ట పురాతన పొడి కొలమానం యొక్క బహువచనం; అందుకే ‘సేయాలు’ అని లిప్యంతరీకరించబడింది. קָלִי వేయించిన లేదా పొడిగా కాల్చిన ధాన్యాన్ని సూచిస్తుంది.
- source_word: מֵאָה צִמֻּקִים
  choice: వంద ఎండుద్రాక్ష గుత్తులు
  rationale: צִמֻּקִים ఎండుద్రాక్షను సూచిస్తుంది. లెక్కించదగిన వంద యూనిట్లుగా జాబితా చేయబడినందున, ఒత్తి సమూహాలుగా చేసిన ఎండుద్రాక్ష అనే భావాన్ని ‘గుత్తులు’ సహజంగా అందిస్తుంది; తరువాతి అత్తిపండ్ల ముద్దలతో భేదాన్ని కూడా నిలుపుతుంది.
- source_word: מָאתַיִם דְּבֵלִים
  choice: రెండువందల అత్తిపండ్ల ముద్దలు
  rationale: דְּבֵלָה ఒత్తి ముద్దగా చేసిన అత్తిపండ్లను సూచిస్తుంది. ‘అత్తిపండ్ల ముద్దలు’ ఆధునిక తెలుగు పాఠకులకు ఆ ఆహార రూపాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  choice: వాటిని గాడిదల మీద పెట్టింది
  rationale: שׂים అనే క్రియకు ‘పెట్టు/ఉంచు’ అనే సాధారణ అర్థం ఉంది. సరఫరాలను గాడిదలపై ఎక్కించిందనే సందర్భార్థం సహజంగానే తెలుస్తుంది; మూలంలో లేని అదనపు సేవకులను చేర్చకుండా స్త్రీలింగ ఏకవచన క్రియను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలి వాడబడింది. పురాతన కొలమానం మరియు తోలు పాత్ర వంటి సాంస్కృతిక అంశాలు నిలుపబడ్డాయి; తెలియని కొలమానానికి పాదసూచిక ఇచ్చబడింది. పాదసూచిక గుర్తు సంబంధిత ‘సేయాలు’ పదం తరువాత ఉంచబడింది.
