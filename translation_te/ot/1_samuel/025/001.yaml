source:
  edition: WLC
  text: וַ/יָּ֣מָת שְׁמוּאֵ֔ל וַ/יִּקָּבְצ֤וּ כָל יִשְׂרָאֵל֙ וַ/יִּסְפְּדוּ ל֔/וֹ וַ/יִּקְבְּרֻ֥/הוּ בְּ/בֵית֖/וֹ בָּ/רָמָ֑ה וַ/יָּ֣קָם דָּוִ֔ד וַ/יֵּ֖רֶד אֶל מִדְבַּ֥ר פָּארָֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
translation:
  language: te
  text: సమూయేలు చనిపోయాడు. ఇశ్రాయేలీయులందరూ సమావేశమై, అతని కోసం దుఃఖించారు[a]. రామాలోని అతని ఇంటి దగ్గర అతన్ని పాతిపెట్టారు. తరువాత దావీదు లేచి పారాను అరణ్యానికి దిగివెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని కోసం విలపించారు.’ ఇక్కడి హీబ్రూ క్రియ మృతుని కోసం చేసే శోకాచరణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת שְׁמוּאֵל
  choice: సమూయేలు చనిపోయాడు
  rationale: మరణాన్ని తెలిపే సాధారణ క్రియను ఆధునిక, గౌరవప్రదమైన తెలుగులో నేరుగా అందిస్తుంది; వావ్ వరుస కథనాన్ని కొనసాగిస్తుంది గాని ప్రత్యేకమైన ‘ఇప్పుడు’ అనే కాలసూచక పదాన్ని చేర్చాల్సిన అవసరం లేదు.
- source_word: וַיִּקָּבְצוּ כָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ సమావేశమై
  rationale: ‘ఇశ్రాయేలు అంతా’ అనే సామూహిక జాతీయ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; నిఫ్అల్ క్రియలోని కూడివచ్చే భావాన్ని ‘సమావేశమై’ నిలుపుతుంది.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: అతని కోసం దుఃఖించారు
  rationale: ఈ క్రియ మృతుని కోసం జరిగే శోకాచరణను సూచిస్తుంది. ‘దుఃఖించారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, శోకగీతం పాడడం లేదా విలపించడం అనే ప్రత్యేక రూపానికే భావాన్ని పరిమితం చేయదు.
- source_word: וַיִּקְבְּרֻהוּ בְּבֵיתוֹ בָּרָמָה
  choice: రామాలోని అతని ఇంటి దగ్గర అతన్ని పాతిపెట్టారు
  rationale: בְּבֵיתוֹ ను నివాసగృహం లోపల అని నిర్బంధంగా అర్థం చేసుకోకుండా, అతని ఇంటికి లేదా కుటుంబ ఆస్తికి సంబంధించిన స్థలంలో అనే సంభావ్య భావాన్ని ‘ఇంటి దగ్గర’ సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּקָם דָּוִד
  choice: తరువాత దావీదు లేచి
  rationale: కథనంలోని తదుపరి కదలికను ‘తరువాత’ తెలియజేస్తుంది; ‘లేచి’ ప్రయాణానికి పూనుకున్న భావాన్ని నిలుపుతుంది.
- source_word: וַיֵּרֶד אֶל מִדְבַּר פָּארָן
  choice: పారాను అరణ్యానికి దిగివెళ్లాడు
  rationale: ירד లోని ‘దిగు’ అనే భౌగోళిక కదలికను నిలుపుతూ, מִדְבַּר ను నివాసరహిత అడవి/ఎడారి ప్రాంతం అనే విస్తృత భావంలో ‘అరణ్యం’గా అందిస్తుంది; పారాను అనే స్థలనామాన్ని లిప్యంతరీకరిస్తుంది.
