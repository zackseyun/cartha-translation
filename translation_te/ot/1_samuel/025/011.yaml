source:
  edition: WLC
  text: וְ/לָקַחְתִּ֤י אֶת לַחְמִ/י֙ וְ/אֶת מֵימַ֔/י וְ/אֵת֙ טִבְחָתִ֔/י אֲשֶׁ֥ר טָבַ֖חְתִּי לְ/גֹֽזְזָ֑/י וְ/נָֽתַתִּי֙ לַֽ/אֲנָשִׁ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתִּי אֵ֥י מִ/זֶּ֖ה הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
translation:
  language: te
  text: “నా రొట్టెను, నా నీళ్లను, నా గొర్రెల ఉన్ని కత్తిరించేవారి కోసం నేను వధించిన మాంసాన్ని తీసుకొని, ఎక్కడివారో నాకు తెలియని మనుషులకు ఇవ్వాలా?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నేను తీసుకుంటాను ... నేను ఇస్తాను.” హీబ్రూలో perfect క్రియారూపాలు ఇక్కడ అలంకారప్రశ్నలో వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי ... וְנָתַתִּי
  choice: తీసుకొని ... ఇవ్వాలా?
  rationale: సంయోజకంతో కూడిన ప్రథమ పురుష ఏకవచన perfect రూపాలను సందర్భంలోని ఆగ్రహభరిత అలంకారప్రశ్నగా సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘నేను తీసుకొని... ఇస్తానా?’ కూడా సాధ్యమే.
- source_word: לַחְמִי
  choice: నా రొట్టెను
  rationale: ‘రొట్టె’ అనే నిర్దిష్ట పదాన్ని నిలుపుతూ నాబాలు పలికిన ‘నా’ అనే స్వామ్య ఉద్ఘాటనను కాపాడుతుంది.
- source_word: מֵימַי
  choice: నా నీళ్లను
  rationale: మూలంలోని నిర్దిష్టమైన ‘నీరు’ అర్థాన్నీ స్వామ్య ఉద్ఘాటననూ సహజ తెలుగు బహువచన రూపంలో నిలుపుతుంది.
- source_word: טִבְחָתִי אֲשֶׁר טָבַחְתִּי
  choice: నేను వధించిన మాంసాన్ని
  rationale: నామవాచక-క్రియల slaughter మూలభావాన్ని ‘వధించిన మాంసం’గా సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: לְגֹזְזָי
  choice: నా గొర్రెల బొచ్చు కత్తిరించేవారి కోసం
  rationale: ‘కత్తిరించేవారు’ అనే రూపానికి సందర్భానుసారంగా ‘గొర్రెల బొచ్చు’ను స్పష్టపరుస్తుంది; సాధారణ పాఠకునికి వృత్తి వెంటనే అర్థమవుతుంది.
- source_word: לָאֲנָשִׁים
  choice: మనుషులకు
  rationale: మూలంలోని పురుష బహువచనాన్ని సాధారణమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי אֵי מִזֶּה הֵמָּה
  choice: ఎక్కడివారో నాకు తెలియని
  rationale: వారి పరిచయం మరియు మూలస్థానం తెలియదని చెప్పే హీబ్రూ భావాన్ని సహజ తెలుగు సంబంధవాక్యంగా వ్యక్తం చేస్తుంది.
