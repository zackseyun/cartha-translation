revisions:
- from: అబీగయీలు నాబాలు దగ్గరికి వచ్చినప్పుడు, అతడు తన ఇంట్లో ఒక రాజు ఇచ్చే విందులాంటి విందు చేస్తున్నాడు. నాబాలు మనసు ఉల్లాసంగా ఉంది; అతడు బాగా మద్యం మత్తులో ఉన్నాడు. అందువల్ల ఆమె చిన్న విషయం గానీ పెద్ద విషయం గానీ[a] అతనికి ఏమీ చెప్పకుండా, తెల్లవారే వరకు[b] వేచి ఉంది.
  to: అబీగయీలు నాబాలు దగ్గరకు వచ్చినప్పుడు, అక్కడ అతడు తన ఇంట్లో రాజు విందులాంటి విందు చేస్తున్నాడు. నాబాలు మనసు ఉల్లాసంగా ఉంది; అతడు బాగా మద్యం మత్తులో ఉన్నాడు. కాబట్టి ఆమె చిన్నదైనా పెద్దదైనా ఏ విషయమూ[a] అతనికి ఉదయపు వెలుగు వరకు[b] చెప్పలేదు.
  rationale: The revision removes the unsupported idea that Abigail waited, restoring the Hebrew assertion that she told Nabal nothing until morning. It also represents the scene-setting particle naturally, improves the feast expression, and aligns the footnotes with their anchored phrases and functions.
