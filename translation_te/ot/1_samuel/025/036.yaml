source:
  edition: WLC
  text: וַ/תָּבֹ֣א אֲבִיגַ֣יִל אֶל נָבָ֡ל וְ/הִנֵּה ל/וֹ֩ מִשְׁתֶּ֨ה בְּ/בֵית֜/וֹ כְּ/מִשְׁתֵּ֣ה הַ/מֶּ֗לֶךְ וְ/לֵ֤ב נָבָל֙ ט֣וֹב עָלָ֔י/ו וְ/ה֥וּא שִׁכֹּ֖ר עַד מְאֹ֑ד וְ/לֹֽא הִגִּ֣ידָה לּ֗/וֹ דָּבָ֥ר קָטֹ֛ן וְ/גָד֖וֹל עַד א֥וֹר הַ/בֹּֽקֶר׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
translation:
  language: te
  text: అబీగయీలు నాబాలు దగ్గరకు వచ్చినప్పుడు, అక్కడ అతడు తన ఇంట్లో రాజు విందులాంటి విందు చేస్తున్నాడు. నాబాలు మనసు ఉల్లాసంగా ఉంది; అతడు బాగా మద్యం మత్తులో ఉన్నాడు. కాబట్టి ఆమె చిన్నదైనా పెద్దదైనా ఏ విషయమూ[a] అతనికి ఉదయపు వెలుగు వరకు[b] చెప్పలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “చిన్నదైనా పెద్దదైనా” అనే నుడికారం; అంటే, ఏ విషయమూ కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తెల్లవారే వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: అబీగయీలు ... వచ్చినప్పుడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; తరువాతి దృశ్యంతో సహజమైన కాలసంబంధాన్ని తెలుగులో చూపిస్తుంది.
- source_word: וְהִנֵּה
  choice: అతడు ... చేస్తున్నాడు
  rationale: హిన్నే సూచించే అకస్మాత్తు దృశ్యావిష్కరణను తెలుగులో సహజమైన వాక్యనిర్మాణం ద్వారా వ్యక్తం చేసింది; కృత్రిమమైన ‘ఇదిగో’ను నివారించింది.
- source_word: מִשְׁתֶּה
  choice: విందు
  rationale: పానంతో కూడిన భోజన విందును సూచిస్తుంది; తరువాత అతని తీవ్రమైన మత్తు స్పష్టంగా చెప్పబడుతున్నందున ఇక్కడ ‘మద్యవిందు’ అని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: כְּמִשְׁתֵּה הַמֶּלֶךְ
  choice: ఒక రాజు ఇచ్చే విందులాంటి విందు
  rationale: రాజవైభవంతో కూడిన విందనే ఉపమానాన్ని, నిర్దిష్ట రాజును సూచించకుండా, సహజ తెలుగులో నిలుపుతుంది.
- source_word: לֵב נָבָל טוֹב עָלָיו
  choice: నాబాలు మనసు ఉల్లాసంగా ఉంది
  rationale: హృదయం ‘మంచిగా’ ఉండటమనే హీబ్రూ నుడికారాన్ని విందు సందర్భానికి తగిన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שִׁכֹּר עַד מְאֹד
  choice: బాగా మద్యం మత్తులో ఉన్నాడు
  rationale: తీవ్రమైన తాగుబోతు మత్తును స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: דָּבָר קָטֹן וְגָדוֹל
  choice: చిన్న విషయం గానీ పెద్ద విషయం గానీ ... ఏమీ
  rationale: ఏ విషయమూ చెప్పలేదనే సమగ్రార్థంతో పాటు హీబ్రూ ద్వంద్వ నుడికారాన్ని కూడా నిలుపుతుంది.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: తెల్లవారే వరకు
  rationale: అక్షరార్థంగా ‘ఉదయపు వెలుగు వరకు’; తెలుగులో సహజమైన ‘తెల్లవారే వరకు’ అదే కాలబిందువును తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. మూలంలోని విందు, ఉల్లాసం, తీవ్రమైన మత్తు, ‘చిన్నది–పెద్దది’ అనే సమగ్ర నుడికారం నిలుపబడ్డాయి.
