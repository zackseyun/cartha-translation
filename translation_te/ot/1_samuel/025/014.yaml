- from: 'అయితే నాబాలు భార్య అబీగయీలుతో పనివారిలో ఒక యువకుడు ఇలా చెప్పాడు: “ఇదిగో, దావీదు అరణ్యం నుండి మన యజమానిని పలకరించడానికి[a] దూతలను పంపాడు; కానీ మన యజమాని వారిమీద విరుచుకుపడ్డాడు[b].”'
  to: 'అయితే నాబాలు భార్య అయిన అబీగయీలుకు పనివారిలో ఒక యువకుడు ఇలా చెప్పాడు: “ఇదిగో, దావీదు అరణ్యం నుండి మన యజమానిని పలకరించడానికి[a] దూతలను పంపాడు; మన యజమాని వారిపై విరుచుకుపడ్డాడు[b].”'
  rationale: 'The revision corrects the grammatical relation required by the Hebrew: a household young man reported to Abigail, rather than speaking with her. It also makes the apposition and hostile-response idiom more natural while retaining the source’s vivid ambiguity. The adversative “కానీ” before the final clause has been removed because the Hebrew uses a simple narrative conjunction there; the hostility is already clear from the verb and context.'
