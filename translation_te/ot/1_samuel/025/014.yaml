- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఇక్కడ మనుష్య ప్రతినిధులే ఉద్దేశించబడ్డారు; ‘దూతలు’ ఆ సందర్భార్థాన్ని సరియైన రీతిలో తెలియజేస్తుంది.
- source_word: מֵהַמִּדְבָּר
  choice: అరణ్యం నుండి
  rationale: దావీదు తన మనుషులతో ఉన్న జనావాసానికి వెలుపలి ప్రాంతాన్ని సూచించే מִדְבָּר పదానికి సందర్భోచితమైన అనువాదం.
- source_word: לְבָרֵךְ
  choice: పలకరించడానికి
  rationale: ברך సాధారణంగా ‘ఆశీర్వదించు’ అని అర్థమైనా, సామాజిక భేటీ సందర్భంలో మర్యాదపూర్వకంగా అభివాదం చేయడాన్ని సూచిస్తుంది; ప్రత్యక్ష పదార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֶת אֲדֹנֵינוּ
  choice: మన యజమానిని
  rationale: ఇది దైవ బిరుదు కాదు; పనివారు నాబాలుతో కలిగిన గృహసంబంధ అధికార బంధాన్ని ‘మన యజమాని’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיָּעַט בָּהֶם
  choice: కానీ మన యజమాని వారిమీద విరుచుకుపడ్డాడు
  rationale: అరుదైన עוט క్రియలో దూసుకుపడటం లేదా తీవ్రంగా విరుచుకుపడటం అనే సజీవ భావం ఉంది. ‘విరుచుకుపడ్డాడు’ అది కేవలం గట్టిగా అరవడమేనని పరిమితం చేయకుండా, సందర్భంలోని కఠినమైన ప్రతిస్పందనను నిలుపుతుంది; స్పష్టత కోసం కర్తను మళ్లీ పేర్కొన్నాం.
