  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
translation:
  language: te
  text: 'అయితే నాబాలు భార్య అయిన అబీగయీలుకు పనివారిలో ఒక యువకుడు ఇలా చెప్పాడు: “ఇదిగో, దావీదు అరణ్యం నుండి మన యజమానిని పలకరించడానికి[a] దూతలను పంపాడు; మన యజమాని వారిపై విరుచుకుపడ్డాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మన యజమానిని ఆశీర్వదించడానికి.’ హీబ్రూ క్రియకు సాధారణంగా ‘ఆశీర్వదించు’ అని అర్థం; ఇక్కడ అది మర్యాదపూర్వక అభివాదాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారిని తీవ్రంగా గద్దించాడు’ లేదా ‘వారిపై మండిపడ్డాడు.’ హీబ్రూ క్రియ దూసుకుపడటం వంటి సజీవ చిత్రాన్ని ఇస్తుంది; ఇక్కడ అది నాబాలు చేసిన తీవ్రమైన, అవమానకరమైన ప్రతిస్పందనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל
  choice: అయితే ... అబీగయీలుతో
  rationale: וְ కథన కొనసాగింపుతో పాటు ముందటి వాక్యంలోని నాబాలు తిరస్కారానికి భిన్నంగా అబీగయీలుకు సమాచారం అందడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ ఈ మలుపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵשֶׁת נָבָל
  choice: నాబాలు భార్య
  rationale: సంబంధాన్ని తెలిపే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్యబంధంతో అందిస్తుంది.
