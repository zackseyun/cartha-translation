source:
  edition: WLC
  text: וּ/בָר֥וּךְ טַעְמֵ֖/ךְ וּ/בְרוּכָ֣ה אָ֑תְּ אֲשֶׁ֨ר כְּלִתִ֜/נִי הַ/יּ֤וֹם הַ/זֶּה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הֹשֵׁ֥עַ יָדִ֖/י לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
translation:
  language: te
  text: నీ వివేచన ఆశీర్వదించబడుగాక[a]; ఈ రోజు నేను రక్తపాతంలోకి దిగకుండా[b], నా స్వహస్తంతో నన్ను నేనే రక్షించుకోకుండా[c] నన్ను అడ్డుకున్న నీవు ధన్యురాలివి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ సుబుద్ధి’, ‘నీ విచక్షణ’.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా ‘రక్తాలలోకి రావడం’; ఇది రక్తపాతంతోపాటు రక్తాపరాధానికి లోనవడం అనే భావాన్నీ ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'సందర్భార్థం: ‘నా స్వహస్తంతో ప్రతీకారం తీర్చుకోకుండా’ లేదా ‘నా చేతితో నాకు నేనే న్యాయం చేసుకోకుండా’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ טַעְמֵךְ
  choice: నీ వివేచన ఆశీర్వదించబడుగాక
  rationale: טַעַם ఇక్కడ అబీగయీలు చూపిన మంచి విచక్షణను, పరిస్థితిని సరిగా అంచనా వేసే వివేచనను సూచిస్తుంది. ఆధునిక తెలుగులో ‘వివేచన’ సహజంగా, గౌరవప్రదంగా ఉంటుంది; ఆశీర్వచన సూత్రాన్ని ‘ఆశీర్వదించబడుగాక’ నిలుపుతుంది.
- source_word: וּבְרוּכָה אָתְּ
  choice: నీవూ ఆశీర్వదించబడుదువు
  rationale: అబీగయీలును నేరుగా ధన్యురాలిగా ప్రకటించే స్త్రీలింగ ఏకవచన రూపం. ముందటి ఆశీర్వచనంతో సమాంతరతను కాపాడుతుంది.
- source_word: אֲשֶׁר כְּלִתִנִי
  choice: నన్ను అడ్డుకున్నది నీవే
  rationale: כלא ఇక్కడ ఒక కార్యం చేయకుండా నిరోధించడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్య నిర్మాణంలో సంబంధవాచక భావాన్ని సహజంగా తెలియజేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: హీబ్రూ కాలవాచక ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִבּוֹא בְדָמִים
  choice: రక్తపాతంలోకి దిగకుండా
  rationale: మూలంలోని ‘రక్తాలలోకి రావడం’ అనే చలన రూపకాన్ని కొంతవరకు నిలుపుతూ, తెలుగులో అర్థవంతంగా ఉండే ‘రక్తపాతంలోకి దిగడం’ వాడబడింది. דָּמִים రక్తపాతాన్నీ రక్తాపరాధాన్నీ సూచించగలదు.
- source_word: וְהֹשֵׁעַ יָדִי לִי
  choice: నా స్వహస్తంతో నన్ను నేనే రక్షించుకోకుండా
  rationale: ישׁע యొక్క ప్రాథమిక ‘రక్షించు/విడిపించు’ భావాన్ని నిలుపుతుంది. సందర్భంలో ఇది తన చేతితో ప్రతీకారం తీర్చుకొని తనకు తానే న్యాయం చేసుకోవడాన్ని సూచిస్తుంది; ఆ సందర్భార్థం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: בְדָמִים లో రక్తపాతం–రక్తాపరాధం ద్వంద్వార్థం
  choice: ప్రధాన పాఠ్యంలో ‘రక్తపాతం’
  alternative: ‘రక్తాపరాధం’
  rationale: సందర్భంలో దావీదు చేయబోయిన హింసాత్మక హత్య ముందుగా కనిపిస్తుంది. అయితే ఆ చర్యవల్ల కలిగే రక్తాపరాధ భావం హీబ్రూ బహువచనంలో ఉండవచ్చు కాబట్టి దానిని పాదసూచికలో నిలుపుతున్నాం.
- issue: וְהֹשֵׁעַ יָדִי לִי యొక్క రక్షణ–ప్రతీకార సందర్భార్థం
  choice: ‘నా స్వహస్తంతో నన్ను నేనే రక్షించుకోవడం’
  alternative: ‘నా స్వహస్తంతో ప్రతీకారం తీర్చుకోవడం’
  rationale: మూల క్రియలోని ‘రక్షించు’ భావాన్నీ దానిలోని సందర్భోచిత వ్యంగ్య ఉద్వేగాన్నీ ప్రధాన పాఠ్యంలో ఉంచి, స్పష్టమైన ప్రతీకార భావాన్ని పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణంతో పాటు ఆశీర్వచనానికి తగిన గౌరవప్రదమైన, స్వల్పంగా ఉన్నతమైన శైలి పాటించబడింది. మూలంలోని రక్తపాతం/రక్తాపరాధం మరియు రక్షణ/ప్రతీకారం ఉద్వేగాలను పాదసూచికలతో సంరక్షించాం.
