  yaml_path: translation/ot/1_samuel/025/019.yaml
  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
translation:
  language: te
  text: 'ఆమె తన యువకులతో[a] ఇలా చెప్పింది: “మీరు నాకు ముందుగా వెళ్లండి. ఇదిగో, నేను మీ వెనుక వస్తున్నాను.” అయితే ఆమె తన భర్త నాబాలుకు చెప్పలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన సేవకులతో” లేదా “తన పరిచారకులతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: ఆమె ... అని చెప్పింది
  rationale: హీబ్రూ కథనంలోని తదుపరి చర్యను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: לִנְעָרֶיהָ
  choice: తన యువకులతో
  rationale: נַעַר అనే పదానికి యువకుడు, సేవకుడు, పరిచారకుడు అనే అర్థాలు ఉండవచ్చు; ఇక్కడ సరుకులు మోసుకుంటూ ముందుకు వెళ్లే ఆమెకు చెందిన యువకులను సూచిస్తున్నందున మూలంలోని వయోసూచనను నిలుపుతుంది.
- source_word: עִבְרוּ לְפָנַי
  choice: మీరు నాకు ముందుగా వెళ్లండి
  rationale: మాట్లాడుతున్న వ్యక్తికంటే ముందుగా కదలమనే సందర్భోచిత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: మాట్లాడే వ్యక్తి తన తదుపరి చర్యపై దృష్టి ఆకర్షించే హీబ్రూ సూచక పదబంధ బలాన్ని నిలుపుతుంది.
- source_word: אַחֲרֵיכֶם בָּאָה
  choice: నేను మీ వెనుక వస్తున్నాను
  rationale: ఆమె వారిని అనుసరించి వస్తోందనే స్థానిక, కొనసాగుతున్న చర్య భావాలను రెండింటినీ నిలుపుతుంది.
- source_word: וּלְאִישָׁהּ
  choice: అయితే ఆమె తన భర్త ... కు
  rationale: אִישׁ ఇక్కడ సందర్భానుసారంగా ‘భర్త’; సంధిని ‘అయితే’గా అనువదించడం యువకులకు చెప్పినదానికీ భర్తకు చెప్పనిదానికీ మధ్య వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: נָבָל
  choice: నాబాలు
  rationale: వ్యక్తి పేరును తెలుగులో సహజంగా లిప్యంతరీకరించింది; విభక్తి చేరిన రూపంలో ‘నాబాలుకు’ అవుతుంది.
- source_word: לֹא הִגִּידָה
  choice: ఈ విషయం చెప్పలేదు
  rationale: Hiphil రూపంలోని ‘తెలియజేయు/చెప్పు’ భావాన్ని గృహసంబంధ కథన సందర్భంలో సహజంగా అందిస్తుంది; ‘ఈ విషయం’ అనేది తెలుగులో అవసరమైన సూచనాత్మక పూరకం.
