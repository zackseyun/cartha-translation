  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా הִנְנִי యొక్క దృష్టి-ఆకర్షణ బలం నిలుపబడింది. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
