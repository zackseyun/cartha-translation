id: 1SA.25.26
reference: 1 Samuel 25:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: '[A], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.'
translation:
  language: te
  text: ఇప్పుడు, నా ప్రభువా, యెహోవా జీవిస్తున్నంత నిశ్చయంగా, నీవు జీవిస్తున్నంత నిశ్చయంగా, యెహోవా నిన్ను రక్తాపరాధానికి పాల్పడకుండా, నీ సొంత చేతితో నీకోసం నీవే రక్షణ సాధించకుండా[a] అడ్డుకున్నాడు. ఇప్పుడు నీ శత్రువులూ, నా ప్రభువుకు కీడు చేయాలని చూసేవారూ నాబాలు వలె[b] ఉండుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భాన్ని మరింత స్పష్టంగా వ్యక్తం చేస్తే, “నీ సొంత చేతితో ప్రతీకారం తీర్చుకోకుండా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నాబాలు వలె” అనేది ప్రధానంగా నాబాలు అనే వ్యక్తిని సూచిస్తుంది; అయితే నాబాలు అనే పేరు “మూర్ఖుడు” అనే హీబ్రూ పదాన్ని కూడా ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు / కాబట్టి ఇప్పుడు
  rationale: ఈ పదం వచనంలో రెండుసార్లు ఉంది. మొదటిది అబీగయీలు తన విజ్ఞప్తిలో కొత్త అంశానికి మారడాన్ని సూచిస్తుంది; రెండవది ముందున్న ప్రమాణ వాక్యంపై ఆధారపడిన ఫలితార్థాన్ని కలిగి ఉంది. అందువల్ల రెండింటినీ ఉంచి, రెండవదానిలో సహజమైన తెలుగు కోసం ‘కాబట్టి’ చేర్చాం.
- source_word: אֲדֹנִי
  choice: నా ప్రభువా
  rationale: దావీదును గౌరవంగా సంబోధించే పదం. ఇది ఇక్కడ దైవసంబోధన కాదు; ఆధునిక తెలుగులో గౌరవభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: యెహోవా జీవిస్తున్నంత నిశ్చయంగా, నీవు జీవిస్తున్నంత నిశ్చయంగా
  rationale: ఇది యెహోవా జీవాన్నీ, సంబోధితుని జీవాన్నీ సాక్షిగా పెట్టే ప్రమాణ సూత్రం. ‘నీ ప్రాణం జీవిస్తున్నంత’ అనే అసహజ పదానువాదానికి బదులు נַפְשְׁךָ యొక్క వ్యక్తిని సూచించే భావాన్ని స్పష్టంగా ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: מְנָעֲךָ
  choice: నిన్ను అడ్డుకున్నాడు
  rationale: ఈ క్రియ నిరోధించడం లేదా ఒక పని చేయకుండా నిలువరించడం అనే భావాన్ని తెలియజేస్తుంది.
- source_word: מִבּוֹא בְדָמִים
  choice: రక్తాపరాధంలో పడకుండా
  rationale: అక్షరార్థంగా ‘రక్తాల్లోకి రావడం’ అనే అసహజ నిర్మాణం. సందర్భంలో అన్యాయంగా రక్తం చిందించి దాని అపరాధాన్ని మోసే భావం ఉన్నందున ‘రక్తాపరాధం’ నైతిక-న్యాయపరమైన బలాన్ని కాపాడుతుంది.
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: నీ సొంత చేతితో నిన్ను నీవే రక్షించుకోకుండా
  rationale: కష్టమైన ఈ పదబంధంలో ישׁע యొక్క ‘రక్షించు/విడిపించు’ అనే ప్రాథమిక భావాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. సందర్భంలో ఇది స్వయంగా ప్రతీకారం తీర్చుకోవడాన్ని సూచించవచ్చు; ఆ భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יִהְיוּ כְנָבָל
  choice: నాబాలులా ఉండుగాక
  rationale: సమీప సందర్భంలో נָבָל అబీగయీలు భర్త పేరు. కాబట్టి పేరునే ప్రధాన పాఠ్యంలో ఉంచాం; ‘మూర్ఖుడు’ అనే పదంతో ఉన్న ధ్వన్యర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: אֹיְבֶיךָ וְהַמְבַקְשִׁים אֶל אֲדֹנִי רָעָה
  choice: నీ శత్రువులూ, నా ప్రభువుకు కీడు చేయాలని చూసేవారూ
  rationale: రెండు సమాంతర గుంపులను స్పష్టంగా ఉంచుతూ, רָעָהను సందర్భానుగుణంగా ‘కీడు’ అని అనువదించాం.
theological_decisions:
- issue: దైవ నామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; తెలుగులో ‘యెహోవా’ సుపరిచిత రూపం.
- issue: దావీదు చేయకుండా ఆపబడిన చర్య యొక్క అర్థం
  choice: రక్తాపరాధంలో పడటం మరియు తన సొంత చేతితో తనను తానే రక్షించుకోవడం
  alternative: తన సొంత చేతితో ప్రతీకారం తీర్చుకోవడం
  rationale: ప్రధాన పాఠ్యం ישׁע యొక్క ‘రక్షించు’ అనే మూలార్థాన్ని కాపాడుతుంది; కథా సందర్భం సూచించే ప్రతీకార భావాన్ని పాదసూచికలో ఉంచి అస్పష్టతను నిలిపాం.
- issue: నాబాలు అనే పేరులోని పదప్రయోగం
  choice: వ్యక్తి పేరుగా ‘నాబాలు’
  alternative: ‘మూర్ఖుడు’ అని సాధారణ నామవాచకంగా అనువదించడం
  rationale: తక్షణ సందర్భంలో అబీగయీలు తన భర్త నాబాలును సూచిస్తోంది. అయితే ఆ పేరు ‘మూర్ఖుడు’ అనే హీబ్రూ పదాన్ని కూడా ప్రతిధ్వనింపజేస్తుంది; దాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైన కథన శైలి. పాతకాలపు ‘జీవముతోడు’ వంటి రూపాలను నివారించి, ప్రమాణ సూత్రాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా ఇచ్చాం. మూలంలోని రెండు וְעַתָּה పదాలనూ అనువదించాం.
