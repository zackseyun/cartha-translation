reference: 1 Samuel 25:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/דָוִ֣ד אָמַ֗ר אַךְ֩ לַ/שֶּׁ֨קֶר שָׁמַ֜רְתִּי אֶֽת כָּל אֲשֶׁ֤ר לָ/זֶה֙ בַּ/מִּדְבָּ֔ר וְ/לֹא נִפְקַ֥ד מִ/כָּל אֲשֶׁר ל֖/וֹ מְא֑וּמָה וַ/יָּֽשֶׁב לִ֥/י רָעָ֖ה תַּ֥חַת טוֹבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/021.yaml
  text: David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: te
  text: 'దావీదు ఇలా అన్నాడు: “నిజంగా, అరణ్యంలో ఈ మనిషికి చెందినదంతా నేను వ్యర్థంగానే కాపాడాను. అతనికి చెందిన వాటిలో ఏదీ లోటుపడలేదు; అయినా అతడు మేలుకు ప్రతిగా నాకు కీడు చేశాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַר
  choice: ఇలా అనుకున్నాడు
  rationale: ఈ సందర్భంలో దావీదు తనలో తాను చెప్పుకున్న మాటలను పరిచయం చేస్తోంది; సహజమైన ఆధునిక తెలుగులో ‘అనుకున్నాడు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַךְ לַשֶּׁקֶר
  choice: నిజంగా ... వ్యర్థంగానే
  rationale: אַךְ ఇచ్చే బలాన్ని ‘నిజంగా’తో, לַשֶּׁקֶר యొక్క ఫలితం లేకపోవడాన్ని ‘వ్యర్థంగానే’తో నిలిపాం.
- source_word: שָׁמַרְתִּי
  choice: కాపాడాను
  rationale: ఇక్కడ నాబాలుకు చెందిన ఆస్తిని రక్షించి భద్రంగా ఉంచిన భావం ఉంది.
- source_word: לֹא נִפְקַד ... מְאוּמָה
  choice: ఏ ఒక్కటీ కనబడకుండా పోలేదు
  rationale: నిఫాల్ రూపమైన נִפְקַד ఇక్కడ ఏదీ లెక్కలో లేకుండా పోవడం లేదా తప్పిపోవడం లేదనే భావం ఇస్తుంది; తెలుగు సహజ ప్రయోగంలో దాన్ని స్పష్టంగా తెలిపాం.
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  choice: అయినా అతడు మేలుకు బదులుగా నాకు కీడు చేశాడు
  rationale: ప్రతిఫలంగా తిరిగి ఇవ్వడం అనే హీబ్రూ భావాన్ని సహజమైన తెలుగు విరుద్ధ జంట ‘మేలు/కీడు’తో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. సందర్భంలోని దావీదు అసంతృప్తి నిలిచేలా బలప్రయోగాలను కాపాడాం.
