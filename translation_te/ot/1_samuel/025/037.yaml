base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/037.yaml
  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
translation:
  language: te
  text: ఉదయాన్నే, నాబాలు మద్యం మత్తు దిగిన తరువాత[a], అతని భార్య ఈ సంగతులను అతనికి చెప్పింది. అప్పుడు అతని హృదయం అతనిలోనే చచ్చిపోయింది[b], అతడు రాయివలె అయిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ద్రాక్షారసం నాబాలు నుండి బయటికి వెళ్లినప్పుడు”; అంటే అతని మద్యం మత్తు దిగిపోయినప్పుడు లేదా దాని ప్రభావం తొలగిపోయినప్పుడు.
    reason: lexical_alternative
  - marker: b
    text: “అతని హృదయం అతనిలోనే విఫలమైంది” అని కూడా అనువదించవచ్చు. హీబ్రూ ఇక్కడ నిర్దిష్టమైన వైద్య వివరణ ఇవ్వకుండా సజీవమైన చిత్రణను ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַבֹּקֶר
  choice: ఉదయం
  rationale: ఇది సాధారణ కాలసూచక పదబంధం; హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  choice: నాబాలు నుండి ద్రాక్షారసం మత్తు తొలగిపోయినప్పుడు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ద్రాక్షారసం నాబాలు నుండి బయటికి వెళ్లినప్పుడు’ అనే సజీవమైన ప్రయోగం ఉంది. తెలుగులో ఆ అక్షరార్థ రూపం అపార్థానికి దారితీయవచ్చు కాబట్టి, మద్యం ప్రభావం తొలగిపోయిందనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో సహజంగా తెలిపి, మూలంలోని రూపకాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַתַּגֶּד לוֹ אִשְׁתּוֹ
  choice: అతని భార్య ... అతనికి చెప్పింది
  rationale: נגד అనే హిఫీల్ క్రియకు ఇక్కడ ‘చెప్పు, తెలియజేయు’ అనే సాధారణ కథనార్థం సరిపోతుంది.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులను
  rationale: דברים అనేది ‘మాటలు’ లేదా ‘సంగతులు/విషయాలు’ అని అర్థమవుతుంది. అబీగయీలు గత రాత్రి జరిగిన వాటిని తెలియజేస్తున్నందున ‘సంగతులు’ సందర్భానికి బాగా సరిపోతుంది.
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  choice: అతని హృదయం అతనిలోనే చచ్చిపోయింది
  rationale: మూలంలోని బలమైన, సజీవమైన రూపకాన్ని వైద్యపరమైన నిర్ధారణగా మార్చకుండా నిలిపింది. ‘హృదయం’ ఇక్కడ శారీరక అవయవాన్నే కాక అంతరంగం, ధైర్యం లేదా జీవశక్తిని కూడా సూచించవచ్చు.
- source_word: וְהוּא הָיָה לְאָבֶן
  choice: అతడు రాయిలా అయిపోయాడు
  rationale: హీబ్రూ ఉపమానాన్ని సహజమైన తెలుగులో నిలిపి, పక్షవాతం వంటి నిర్దిష్ట వైద్యార్థాన్ని జోడించకుండా ఉంచుతుంది.
theological_decisions:
- issue: నాబాలు పరిస్థితిని నిర్దిష్ట వైద్య ఘటనగా వివరించాలా, లేక హీబ్రూ కథన రూపకాన్ని నిలపాలా
  choice: ‘అతని హృదయం అతనిలోనే చచ్చిపోయింది; అతడు రాయిలా అయిపోయాడు’ అనే మూల చిత్రణను నిలపడం
  alternative: ‘అతనికి గుండెపోటు వచ్చింది’ లేదా ‘అతనికి పక్షవాతం వచ్చింది’ అని అనువదించడం
  rationale: మూలపాఠం వైద్యపరమైన నిర్ధారణ ఇవ్వదు. అది దిగ్భ్రాంతి, శారీరక కుప్పకూలడం, ధైర్యం నశించడం లేదా పక్షవాతం వంటి స్థితిని సూచించవచ్చు; అయితే వాటిలో దేనినీ స్పష్టంగా నిర్ణయించదు. కాబట్టి నిజమైన అస్పష్టతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని వైద్యపరంగా నిర్ధారించలేని రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
