source:
  edition: WLC
  text: וְ/לֹ֣א תִהְיֶ֣ה זֹ֣את לְ/ךָ֡ לְ/פוּקָה֩ וּ/לְ/מִכְשׁ֨וֹל לֵ֜ב לַ/אדֹנִ֗/י וְ/לִ/שְׁפָּךְ דָּם֙ חִנָּ֔ם וּ/לְ/הוֹשִׁ֥יעַ אֲדֹנִ֖/י ל֑/וֹ וְ/הֵיטִ֤ב יְהוָה֙ לַֽ/אדֹנִ֔/י וְ/זָכַרְתָּ֖ אֶת אֲמָתֶֽ/ךָ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/031.yaml
  text: 'And this will not be a cause of grief to you or a stumbling block of heart to my lord: either that you have shed blood without cause or that my lord has avenged himself[a]. And when Yahweh has dealt well with my lord[d][c][b], then remember your servant.'
translation:
  language: te
  text: మీరు కారణం లేకుండా రక్తం చిందించినందువల్లగానీ, నా ప్రభువు తనకు తానే ప్రతీకారం తీర్చుకున్నందువల్లగానీ[a], ఈ విషయం నా ప్రభువైన మీకు వేదనకూ హృదయానికి తొట్రుపాటుకూ[b] కారణం కాదు. యాహ్వే నా ప్రభువుకు మేలు చేసినప్పుడు, మీ దాసిని[c] జ్ఞాపకం చేసుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, ‘నా ప్రభువు తనను తానే రక్షించుకున్నందువల్ల.’ ఈ సందర్భంలో అది తన చేతులతోనే ప్రతీకారం తీర్చుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: పదశః, ‘హృదయానికి తొట్రుపాటు.’ ‘వేదన’గా అనువదించిన హీబ్రూ పదం కూడా అరుదైనది; అది తొట్రుపాటు, మనోవ్యథ, లేదా పశ్చాత్తాపానికి కారణం అనే భావాలను కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో స్త్రీలింగంలో ‘మీ దాసిని’; ఇది అబీగయీలు తనను తాను వినయంగా పేర్కొన్న మాట.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפוּקָה
  choice: వేదన
  rationale: ఈ అరుదైన నామవాచకం తడబడటం, మనోవ్యథ లేదా తర్వాత కలిగే పశ్చాత్తాపానికి కారణమయ్యే విషయాన్ని సూచించవచ్చు. సందర్భంలో అబీగయీలు దావీదుకు భవిష్యత్తులో కలిగే నైతిక వేదనను హెచ్చరిస్తోంది; అందువల్ల సహజమైన తెలుగులో ‘వేదన’ను ఎంచుకున్నాం.
- source_word: מִכְשׁוֹל לֵב
  choice: హృదయానికి అడ్డంకి
  rationale: మూలంలోని ‘హృదయానికి తొట్రుపాటు’ అనే రూపకాన్ని పూర్తిగా వ్యాఖ్యానించి ‘మనస్సాక్షి బాధ’గా మార్చకుండా, తెలుగులో అర్థమయ్యే విధంగా ‘హృదయానికి అడ్డంకి’గా ఉంచాం.
- source_word: לַאדֹנִי / אֲדֹנִי
  choice: నా ప్రభువు
  rationale: అబీగయీలు దావీదును గౌరవపూర్వకంగా సంబోధిస్తోంది. ఇక్కడ ‘ప్రభువు’ దైవత్వాన్ని కాక సామాజిక గౌరవాన్ని సూచిస్తుంది.
- source_word: לִשְׁפָּךְ דָּם חִנָּם
  choice: కారణం లేకుండా రక్తం చిందించడం
  rationale: חִנָּם ఇక్కడ న్యాయమైన కారణం లేకుండా, అనవసరంగా అనే భావాన్ని ఇస్తుంది. మూలంలోని సాధారణ ‘రక్తం’ అనే పదాన్ని ‘నిరపరాధుల రక్తం’గా విస్తరించకుండా అనువదించాం.
- source_word: לְהוֹשִׁיעַ ... לוֹ
  choice: తనకు తానే ప్రతీకారం తీర్చుకోవడం
  rationale: יָשַׁע సాధారణంగా ‘రక్షించు/విడిపించు’ అని అర్థమైనా, ఈ సందర్భంలో దావీదు దేవుని తీర్పుకోసం వేచి ఉండకుండా తన చేతుల్లోనే న్యాయం తీసుకోవడాన్ని సూచిస్తుంది. సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְהֵיטִב יְהוָה
  choice: యెహోవా ... మేలు చేసినప్పుడు
  rationale: వావ్‌తో కూడిన క్రియ ఇక్కడ అబీగయీలు ఎదురుచూస్తున్న భవిష్యత్ సందర్భాన్ని తెలియజేస్తుంది. తెలుగులో కాలవాచక ఉపవాక్యంగా సహజంగా అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తినామంగా ఇచ్చాం.
- source_word: אֲמָתֶךָ
  choice: మీ దాసిని
  rationale: ఈ పదం స్త్రీలింగ దాసిని స్పష్టంగా సూచిస్తుంది; అబీగయీలు తనను తాను వినయంగా పేర్కొనే భావాన్ని తెలుగులో అలాగే నిలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో బిరుదు కాక దేవుని వ్యక్తినామమైన చతురక్షరం ఉంది. కాబట్టి దానిని తెలుగులో పరిచితమైన లిప్యంతరీకరణతో ఇచ్చాం.
- issue: לְהוֹשִׁיעַ ... לוֹ లో స్వరక్షణ–ప్రతీకార భావ ఉద్రిక్తత
  choice: తనకు తానే ప్రతీకారం తీర్చుకోవడం
  alternative: తనను తానే రక్షించుకోవడం
  rationale: కథా సందర్భంలో దావీదు నాబాలు ఇంటివారిపై రక్తపాతం చేసి తన అవమానానికి తానే ప్రతీకారం తీర్చుకోవాలని బయలుదేరాడు. అయినా హీబ్రూ క్రియ యొక్క సాధారణ ‘రక్షించు’ భావాన్ని పాదసూచికలో ఉంచి అసలు పదంలోని ఉద్రిక్తతను సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వకమైన ‘మీరు’ సంబోధనను ఉపయోగించాం. అబీగయీలు మాటల్లోని వినయం, దావీదుకు ఇచ్చే గౌరవం నిలిచేలా ‘నా ప్రభువు’, ‘మీ దాసిని’ అన్న రూపాలను ఉంచాం. వాక్యం పొడవుగా ఉన్నప్పటికీ, మూలంలోని కారణ–ఫల సంబంధం స్పష్టంగా ఉండేందుకు విరామచిహ్నాలతో సహజంగా అమర్చాం.
