source:
  edition: WLC
  text: וַ/תָּ֕קָם וַ/תִּשְׁתַּ֥חוּ אַפַּ֖יִם אָ֑רְצָ/ה וַ/תֹּ֗אמֶר הִנֵּ֤ה אֲמָֽתְ/ךָ֙ לְ/שִׁפְחָ֔ה לִ/רְחֹ֕ץ רַגְלֵ֖י עַבְדֵ֥י אֲדֹנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/041.yaml
  text: She rose and bowed with her face to the ground and said[a], “Behold[b], your servant is a maidservant to wash the feet of the servants of my lord.”
translation:
  language: te
  text: 'ఆమె లేచి, ముఖం నేలకు ఆనేటట్లు సాగిలపడి ఇలా అంది: “ఇదిగో, మీ దాసి నా ప్రభువు సేవకుల పాదాలు కడగడానికి సేవకురాలిగా ఉంది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: ఆమె లేచి
  rationale: קום అనే క్రియ యొక్క కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: ముఖం నేలకు ఆనేటట్లు సాగిలపడి
  rationale: ముఖం నేలవైపు ఉండే గాఢమైన వినయపూర్వక ప్రణామ భంగిమను స్పష్టంగా నిలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి వినయ ప్రకటనపై దృష్టి నిలిపే హీబ్రూ సూచనార్థక ఉద్గారానికి సహజమైన, గంభీరమైన తెలుగు సమానం.
- source_word: אֲמָתְךָ
  choice: నీ దాసి
  rationale: స్త్రీలింగ సేవకత్వాన్ని, అబీగయీలు దావీదుతో మాట్లాడుతున్న వినయపూర్వక సంబోధనను సంక్షిప్తంగా కాపాడుతుంది.
- source_word: לְשִׁפְחָה
  choice: ఒక పనికత్తెగా ఉంటుంది
  rationale: అదే వాక్యంలో ఉన్న אמה పదంతో పూర్తిగా కలిపివేయకుండా, తక్కువ స్థాయి గృహసేవ చేయడానికి సిద్ధమనే స్వీయనమ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לִרְחֹץ רַגְלֵי
  choice: పాదాలు కడగడానికి
  rationale: లక్ష్యార్థక క్రియారూపాన్ని మరియు పాదాలు కడిగే సేవను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: עַבְדֵי אֲדֹנִי
  choice: నా ప్రభువు సేవకుల
  rationale: עבד కు ఈ రాజసభా సందర్భంలో ‘సేవకులు’ సహజం; אֲדֹנִי లోని గౌరవపూర్వక భావాన్ని ‘నా ప్రభువు’ నిలుపుతుంది.
theological_decisions:
- issue: אמה మరియు שפחה అనే రెండు స్త్రీ సేవకత్వ పదాల అనువాదం
  choice: ‘నీ దాసి’ మరియు ‘ఒక పనికత్తెగా’ అని భేదపరచడం
  alternative: రెండింటినీ ‘దాసి’ లేదా ‘పనికత్తె’ అని ఒకేలా అనువదించడం
  rationale: మూలంలో దగ్గరి అర్థాలున్నా వేర్వేరు పదాలు ఉన్నాయి. తెలుగు సహజత్వాన్ని కోల్పోకుండా వాటి భేదాన్ని ఉంచడం అబీగయీలు తనను తాను తగ్గించుకొని చెప్పిన మాటల బలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనంలో గంభీరతతో కూడిన సహజ వాక్యనిర్మాణం. ‘సాగిలపడి,’ ‘దాసి,’ ‘ప్రభువు’ వంటి పదాలు సందర్భానుకూల గౌరవభాషను నిలుపుతాయి; అతిగా ప్రాచీనమైన శైలిని నివారించాం.
