id: 1SA.25.43
reference: 1 Samuel 25:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת אֲחִינֹ֛עַם לָקַ֥ח דָּוִ֖ד מִֽ/יִּזְרְעֶ֑אל וַ/תִּהְיֶ֛יןָ גַּֽם שְׁתֵּי/הֶ֥ן ל֖/וֹ לְ/נָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/043.yaml
  text: David also took Ahinoam of Jezreel[b][a], and both of them became his wives.
translation:
  language: te
  text: దావీదు యెజ్రెయేలుకు చెందిన అహీనోయమును కూడా తీసుకున్నాడు[a]. ఆ ఇద్దరూ అతనికి భార్యలయ్యారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెజ్రెయేలు నుండి వచ్చిన అహీనోయమును”; లేదా, “యెజ్రెయేలీయురాలైన అహీనోయమును.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆ ఇద్దరూ కూడా అతనికి భార్యలుగా అయ్యారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח
  choice: తీసుకున్నాడు
  rationale: హీబ్రూ క్రియకు ప్రాథమిక అర్థం ‘తీసుకున్నాడు’. ఇక్కడ వివాహ సందర్భం ఉందని తరువాతి వాక్యం స్పష్టం చేస్తుంది; అందువల్ల మూలంలోని పదప్రయోగాన్ని నిలుపుతూ నేరుగా ‘పెళ్లి చేసుకున్నాడు’ అని విపులీకరించలేదు.
- source_word: אֲחִינֹעַם
  choice: అహీనోయము
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం; విభక్తి సందర్భంలో ‘అహీనోయమును’ అయింది.
- source_word: מִיִּזְרְעֶאל
  choice: యెజ్రెయేలుకు చెందిన
  rationale: מִן ఉపసర్గతో కూడిన స్థలనామం ఆమె యెజ్రెయేలు ప్రాంతానికి చెందినదని సూచిస్తుంది. సహజమైన తెలుగులో ‘యెజ్రెయేలుకు చెందిన’ అని ఇచ్చాం; ‘యెజ్రెయేలు నుండి’ అనేది మరింత అక్షరార్థ ప్రత్యామ్నాయం.
- source_word: וַתִּהְיֶיןָ גַּם שְׁתֵּיהֶן
  choice: ఆ ఇద్దరూ ... అయ్యారు
  rationale: స్త్రీలింగ ద్వయాన్ని సూచించే భావాన్ని తెలుగులో సహజంగా ‘ఆ ఇద్దరూ’ అని వ్యక్తం చేశాం. సందర్భంలో వీరు అబీగయీలు, అహీనోయము.
- source_word: לְנָשִׁים
  choice: అతనికి భార్యలయ్యారు
  rationale: לוֹ לְנָשִׁים అనే నిర్మాణాన్ని సహజమైన తెలుగులో ‘అతనికి భార్యలయ్యారు’ అని ఇచ్చాం; భార్యల బహువచనాన్ని స్పష్టంగా నిలిపాం.
- source_word: גַּם
  choice: కూడా
  rationale: అబీగయీలుతోపాటు అహీనోయమును తీసుకున్నాడనే అదనపు భావాన్ని ‘కూడా’ తెలియజేస్తుంది.
theological_decisions:
- issue: బహుభార్యత్వ వివాహ వర్ణన
  choice: ఇద్దరూ దావీదుకు భార్యలయ్యారని వచనం వర్ణనాత్మకంగా స్పష్టంగా చెబుతుంది.
  alternative: బహువచన వివాహ సూచనను మృదువుగా లేదా అస్పష్టంగా చెప్పడం.
  rationale: హీబ్రూ మూలం ఇద్దరు స్త్రీలూ అతనికి భార్యలయ్యారని నేరుగా చెబుతుంది. అనువాదం దీనిని మరుగుపరచదు; అలాగే వచనంలో లేని నైతిక తీర్పును చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘తీసుకున్నాడు’ మూలంలోని לָקַח పదాన్ని నిలుపుతుంది; తరువాతి వాక్యం దాని వివాహార్థాన్ని స్పష్టం చేస్తుంది. పేర్లను సంప్రదాయ బైబిల్ తెలుగు రూపాలకు సమీపంగా ఉంచాం.
