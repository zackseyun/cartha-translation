translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఏకవచన సంబోధనను మూలంలోని రెండవ పురుష ఏకవచనానికి అనుగుణంగా ఉంచాం; హీబ్రూ నుడికారాలను వీలైనంత వరకు కనిపించేలా నిలిపి, అవసరమైన సాంస్కృతిక వివరణను పాదసూచికలో ఇచ్చాం.
