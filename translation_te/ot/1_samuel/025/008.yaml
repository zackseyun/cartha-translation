source:
  edition: WLC
  text: שְׁאַ֨ל אֶת נְעָרֶ֜י/ךָ וְ/יַגִּ֣ידוּ לָ֗/ךְ וְ/יִמְצְא֨וּ הַ/נְּעָרִ֥ים חֵן֙ בְּ/עֵינֶ֔י/ךָ כִּֽי עַל י֥וֹם ט֖וֹב בָּ֑נוּ תְּנָ/ה נָּ֗א אֵת֩ אֲשֶׁ֨ר תִּמְצָ֤א יָֽדְ/ךָ֙ לַ/עֲבָדֶ֔י/ךָ וּ/לְ/בִנְ/ךָ֖ לְ/דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
translation:
  language: te
  text: నీ యువకులను అడుగు[a]; వారు నీకు చెబుతారు. కాబట్టి ఈ యువకుల పట్ల దయ చూపించు; ఎందుకంటే మేము పండుగ రోజున వచ్చాము[b]. దయచేసి నీ చేతికి దొరికినదేదైనా నీ సేవకులకూ, నీ కుమారుడైన దావీదుకూ ఇవ్వు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘యువకులు’ అంటే నాబాలు వద్దనున్న యువ సేవకులు లేదా పరిచారకులు.
    reason: lexical_clarification
  - marker: b
    text: అక్షరార్థంగా ‘మంచి రోజు.’ గొర్రెల బొచ్చు కత్తిరించే సందర్భం విందు, సంబరాలతో కూడినది కాబట్టి ప్రధాన పాఠంలో ‘పండుగ రోజు’ అని అనువదించబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁאַל אֶת נְעָרֶיךָ
  choice: నీ యువకులను అడుగు
  rationale: నేరమైన ఆజ్ఞారూపాన్ని నిలుపుతూ, నాబాలు వద్దనున్న యువ సేవకులను సూచించే נְעָרִים పదాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా అనువదిస్తుంది.
- source_word: וְיַגִּידוּ לָךְ
  choice: వారు నీకు చెబుతారు
  rationale: נגד హిఫీల్ రూపంలోని ‘తెలియజేయు/చెప్పు’ భావాన్ని సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ
  choice: కాబట్టి ఈ యువకులు నీ దృష్టిలో దయ పొందనివ్వు
  rationale: ‘కళ్లలో కృప పొందడం’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజమైన ‘నీ దృష్టిలో దయ పొందడం’గా, జస్సివ్ అభ్యర్థనను ‘పొందనివ్వు’గా అందిస్తుంది. ‘ఈ యువకులు’ ఇక్కడ దావీదు పంపిన వారిని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: כִּי עַל יוֹם טוֹב בָּאנוּ
  choice: ఎందుకంటే మేము పండుగ రోజున వచ్చాము
  rationale: יוֹם טוֹב అక్షరార్థంగా ‘మంచి రోజు’; గొర్రెల బొచ్చు కత్తిరింపు సందర్భంలోని విందు, సంబరాల నేపథ్యాన్ని ‘పండుగ రోజు’ సహజంగా తెలియజేస్తుంది.
- source_word: תְּנָה נָּא
  choice: దయచేసి ... ఇవ్వు
  rationale: ఆజ్ఞారూపంతో కూడిన נָא యొక్క మర్యాదపూర్వక వేడుకోలును ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  choice: నీ చేతికి దొరికినదేదైనా
  rationale: ‘నీ చేయి కనుగొనేది’ అనే హీబ్రూ చిత్రాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతూ, అందుబాటులో ఉన్నదేదైనా ఇవ్వమనే భావాన్ని సూచిస్తుంది.
- source_word: לַעֲבָדֶיךָ
  choice: నీ సేవకులకు
  rationale: దావీదు మనుషులు వినయపూర్వకంగా తమను నాబాలు సేవకులుగా పేర్కొనే సందర్భానికి ‘సేవకులు’ సరిపోతుంది; బానిసత్వాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וּלְבִנְךָ לְדָוִד
  choice: నీ కుమారుడైన దావీదుకు
  rationale: ఇది నిజమైన కుటుంబ సంబంధం కాకుండా దావీదు వినయపూర్వక స్వీయసంబోధన. మూలంలోని వాక్చాతుర్యాన్ని స్పష్టంగా నిలుపుతుంది.
