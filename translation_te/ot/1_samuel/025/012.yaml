source:
  edition: WLC
  text: וַ/יַּהַפְכ֥וּ נַעֲרֵֽי דָוִ֖ד לְ/דַרְכָּ֑/ם וַ/יָּשֻׁ֨בוּ֙ וַ/יָּבֹ֔אוּ וַ/יַּגִּ֣דוּ ל֔/וֹ כְּ/כֹ֖ל הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/012.yaml
  text: So David’s young men turned back on their way[a], and they returned and came and told him all these words.
translation:
  language: te
  text: కాబట్టి దావీదు యువకులు తమ దారిన వెనుదిరిగారు. వారు తిరిగి వచ్చి, ఈ మాటలన్నిటినీ[a] అతనికి తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ సంగతులన్నిటినీ.’ హీబ్రూ పదం పలికిన మాటలను గానీ, విషయాలు లేదా సంగతులను గానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  choice: వెనుదిరిగారు
  rationale: הפך ఇక్కడ ప్రయాణ దిశను మార్చుకొని వెనక్కి వెళ్లడాన్ని సూచిస్తుంది; ‘వెనుదిరిగారు’ ఈ సందర్భానికి సహజమైన తెలుగు ప్రయోగం.
- source_word: נַעֲרֵי דָוִד
  choice: దావీదు యువకులు
  rationale: נַעַר అనే పదం యువకుడు, పరిచారకుడు లేదా సేవకుడు అనే అర్థాలు ఇవ్వగలదు. ఇక్కడ ‘యువకులు’ మూలపద భావాన్ని నిలుపుతూ వారి సేవక హోదాను అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: לְדַרְכָּם
  choice: తమ దారిన
  rationale: అక్షరార్థంగా ‘తమ దారికి’; వెనుదిరిగే ప్రయాణ సందర్భంలో ‘తమ దారిన’ సహజంగా వారి తిరుగు మార్గాన్ని సూచిస్తుంది.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ
  choice: వారు తిరిగి వచ్చి
  rationale: హీబ్రూ పాఠంలోని ‘తిరిగారు, వచ్చారు’ అనే వరుస గమన క్రియలను తెలుగులో సహజంగా, సంక్షిప్తంగా ‘తిరిగి వచ్చి’ అని వ్యక్తం చేశాం.
- source_word: וַיַּגִּדוּ לוֹ
  choice: అతనికి తెలియజేశారు
  rationale: נגד ఇక్కడ జరిగిన సంభాషణను నివేదించడాన్ని సూచిస్తుంది; ‘తెలియజేశారు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలన్నిటినీ
  rationale: דְּבָרִים ‘మాటలు’ లేదా ‘సంగతులు/విషయాలు’ అని అర్థం ఇవ్వగలదు. ముందున్న నాబాలు పలికిన జవాబును నివేదిస్తున్నందున ‘మాటలు’ ప్రధాన పాఠంలో అనుకూలం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
