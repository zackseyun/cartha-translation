id: 1SA.25.34
reference: 1 Samuel 25:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אוּלָ֗ם חַי יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר מְנָעַ֔/נִי מֵ/הָרַ֖ע אֹתָ֑/ךְ כִּ֣י לוּלֵ֣י מִהַ֗רְתְּ ו/תבאתי לִ/קְרָאתִ֔/י כִּ֣י אִם נוֹתַ֧ר לְ/נָבָ֛ל עַד א֥וֹר הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/034.yaml
  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
translation:
  language: te
  text: 'అయితే, ఇశ్రాయేలు దేవుడైన యాహ్వే జీవించి ఉన్నాడని ప్రమాణంగా చెబుతున్నాను: నిన్ను హాని చేయకుండా ఆయన నన్ను అడ్డుకున్నాడు. నువ్వు త్వరపడి నన్ను ఎదుర్కోవడానికి వచ్చి ఉండకపోతే, తెల్లవారే సమయానికి నాబాలుకు చెందిన మగవారిలో ఒక్కడు కూడా[a] మిగిలి ఉండేవాడు కాదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “గోడకు మూత్రం పోసేవాడు.” ఇది “ఏ మగవాడైనా” అనే అర్థమిచ్చే మొరటైన నానుడి.
    reason: మూలంలోని చిత్రాత్మకమైన, మొరటైన నానుడిని ప్రధాన పాఠంలో సహజమైన అర్థంతో అనువదించి, దాని అక్షర రూపాన్ని పాఠకునికి అందించడం.
lexical_decisions:
- source_word: וְאוּלָם
  choice: అయితే
  rationale: దావీదు చెప్పబోయే గంభీరమైన ప్రమాణ వాక్యాన్ని ముందున్న పరిస్థితికి వ్యతిరేకంగా పరిచయం చేసే సహజమైన తెలుగు అనుసంధానం.
- source_word: חַי יְהוָה
  choice: యాహ్వే జీవం తోడు
  rationale: హీబ్రూ ప్రమాణ సూత్రంలోని గంభీరతను, సహజమైన తెలుగు ప్రమాణ వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తినామంగా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר מְנָעַנִי
  choice: నన్ను అడ్డుకున్నది ఆయనే
  rationale: מנע అనే క్రియలోని నిరోధించడం లేదా నిలువరించడం అనే భావాన్ని తెలియజేస్తూ, ప్రమాణ వాక్యంతో సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מֵהָרַע אֹתָךְ
  choice: నిన్ను హాని చేయకుండా
  rationale: అక్షరార్థంగా ‘నీకు కీడు చేయడం నుండి’ అనే భావం; సందర్భంలోని హింసాత్మక హానిని అతిగా నిర్దిష్టం చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: כִּי לוּלֵי מִהַרְתְּ וַתָּבֹאתִי לִקְרָאתִי
  choice: నువ్వు త్వరపడి నన్ను ఎదుర్కోవడానికి వచ్చి ఉండకపోతే
  rationale: అబీగయీలును ఉద్దేశించిన స్త్రీలింగ ఏకవచన సంబోధనను ‘నువ్వు’తో, జరగని గత పరిస్థితిని తెలుగు వ్యతిరేక షరతు నిర్మాణంతో తెలియజేస్తుంది.
- source_word: נוֹתַר לְנָבָל
  choice: నాబాలుకు చెందిన ... మిగిలి ఉండేవాడు కాదు
  rationale: לְ ద్వారా వ్యక్తమయ్యే నాబాలు ఇంటివారితో సంబంధాన్ని ‘చెందిన’ అని స్పష్టం చేస్తూ, వ్యతిరేక షరతుకు తగిన ఫలిత వాక్యాన్ని ఇస్తుంది.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: తెల్లవారే సమయానికి
  rationale: ఉదయపు వెలుగు వచ్చే గడువును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מַשְׁתִּין בְּקִיר
  choice: మగవారిలో ఒక్కడు కూడా[a]
  rationale: మూలంలోని మొరటైన పదబంధం సందర్భంలో ‘ఏ మగవాడూ’ అనే జాతీయార్థాన్ని ఇస్తుంది; ప్రధాన పాఠాన్ని సహజంగా ఉంచి అక్షరార్థాన్ని పాదసూచికలో భద్రపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాక దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా, ఆధునికంగా ఆమోదయోగ్యమైన రూపంలో లిప్యంతరీకరించాం.
- issue: యాహ్వే నిరోధించిన హాని పరిధి
  choice: నిన్ను హాని చేయకుండా
  alternative: నీ ఇంటివారిని చంపకుండా
  rationale: మూలంలో రెండవ స్త్రీలింగ ఏకవచన ప్రత్యయం ఉంది. సందర్భం అబీగయీలు మరియు ఆమె ఇంటివారిపై ప్రమాదాన్ని సూచించినా, అనువాదంలో దానిని ‘ఇంటివారిని చంపడం’గా విస్తరించి మూలంలోని రూపాన్ని పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రమాణ స్వరాన్ని నిలుపుతూ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం. దైవనామాన్ని ‘యాహ్వే’గా ఉంచాం. అసభ్యంగా వినిపించగల హీబ్రూ నానుడిని ప్రధాన పాఠంలో అర్థానువాదం చేసి పాదసూచికలో వివరించాం.
