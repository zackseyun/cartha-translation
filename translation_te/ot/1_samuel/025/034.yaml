    rationale: The antecedent is “యాహ్వే,” a personal masculine subject. Telugu requires a personal/masculine form such as “అడ్డుకున్నవాడు ఆయనే” or a recast clause such as “ఆయనే నన్ను అడ్డుకున్నాడు.”
