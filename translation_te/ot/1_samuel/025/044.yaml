  edition: WLC
  text: וְ/שָׁא֗וּל נָתַ֛ן אֶת מִיכַ֥ל בִּתּ֖/וֹ אֵ֣שֶׁת דָּוִ֑ד לְ/פַלְטִ֥י בֶן לַ֖יִשׁ אֲשֶׁ֥ר מִ/גַּלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/044.yaml
  text: Saul had given Michal his daughter[a], David’s wife, to Palti son of Laish, who was from Gallim.
translation:
  language: te
  text: సౌలు దావీదు భార్య అయిన తన కుమార్తె మీకాలును గల్లీముకు చెందిన లాయీషు కుమారుడు పల్తీకి[a] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని అనువాద సంప్రదాయాల్లో ఈ పేరు ‘ఫల్తీ’ అని కనిపిస్తుంది; ఇక్కడి హీబ్రూ రూపం ‘పల్తీ’కి మద్దతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: సౌలు
  rationale: וְ అనే అనుసంధాన అవ్యయాన్ని సందర్భంలోని కథన ప్రవాహమే తెలియజేస్తుంది; తెలుగులో అనవసరంగా ‘ఇప్పుడు’ అని చేర్చకుండా సహజంగా వాక్యాన్ని ప్రారంభించాం.
- source_word: נָתַן
  choice: ఇచ్చివేశాడు
  rationale: ఇది అప్పటికే పూర్తయిన చర్యను సూచిస్తుంది. ‘ఇచ్చివేశాడు’ అనే రూపం మీకాలును మరొక పురుషునికి ఇచ్చిన పూర్తయిన చర్యను సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִיכַל בִּתּוֹ
  choice: తన కుమార్తె మీకాలును
  rationale: మీకాలు సౌలు కుమార్తె అని తెలిపే సమానాధికరణాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచాం.
- source_word: אֵשֶׁת דָּוִד
  choice: ఆమె దావీదు భార్య
  rationale: మీకాలుకు దావీదుతో ఉన్న వివాహ సంబంధాన్ని మూలంలోని విధంగానే స్పష్టంగా ఉంచాం; ఈ సంబంధంలో ఉన్న ఉద్రిక్తతను తొలగించలేదు.
- source_word: לְפַלְטִי
  choice: పల్తీకి[a]
  rationale: హీబ్రూ פַלְטִי పేరును నేరుగా ‘పల్తీ’గా లిప్యంతరీకరించాం; సంప్రదాయ ప్రభావంతో కనిపించే ‘ఫల్తీ’ రూపాన్ని పాఠ్యంలో స్వీకరించలేదు.
- source_word: בֶן לַיִשׁ
  choice: లాయీషు కుమారుడు
  rationale: హీబ్రూ వంశనామ నిర్మాణాన్ని సాధారణ తెలుగు రూపంలో అనువదించాం.
- source_word: אֲשֶׁר מִגַּלִּים
  choice: గల్లీముకు చెందిన
  rationale: מִן ఉపసర్గ సూచించే స్థల మూలాన్ని ‘చెందిన’ అనే సహజ తెలుగు వ్యక్తీకరణతో తెలిపాం.
theological_decisions:
- issue: మీకాలు దావీదు భార్యగా పేర్కొనబడినప్పటికీ సౌలు ఆమెను పల్తీకి ఇవ్వడం
  choice: ‘ఆమె దావీదు భార్య’ అనే గుర్తింపును యథాతథంగా నిలిపాం
  alternative: ఆమెను ‘దావీదు మాజీ భార్య’గా పేర్కొనడం
  rationale: హీబ్రూ పాఠం אֵשֶׁת דָּוִד అని వర్తమాన సంబంధ పదబంధాన్నే ఉపయోగిస్తుంది. వివాహ స్థితిలోని కథనాత్మక, ధార్మిక ఉద్రిక్తతను అనువాదం స్వయంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మధ్యనున్న డాష్‌లతో ‘ఆమె దావీదు భార్య’ అనే సమానాధికరణాన్ని స్పష్టంగా చూపించి, మూలపాఠంలోని సంబంధ ఉద్రిక్తతను కాపాడాం.
