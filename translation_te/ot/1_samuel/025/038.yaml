  text: And about ten days later[a], Yahweh struck Nabal, and he died.
translation:
  language: te
  text: దాదాపు పది రోజుల తర్వాత[a], యాహ్వే నాబాలును కొట్టాడు; అతడు చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
