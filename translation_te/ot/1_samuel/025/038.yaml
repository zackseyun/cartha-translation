    text: లేదా, ‘దాదాపు పది రోజులు గడిచిన తర్వాత.’ హీబ్రూ పదబంధం సుమారు పది రోజుల కాలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: తర్వాత
  rationale: కథనంలో తదుపరి సంఘటనను సూచించే సహజమైన తెలుగు కాలసంధిగా అనువదించబడింది; వַיְהִי అనే హీబ్రూ కథన సూత్రాన్ని పదశః కాకుండా దాని కార్యాన్ని నిలుపుతుంది.
- source_word: כַּעֲשֶׂרֶת הַיָּמִים
  choice: దాదాపు పది రోజుల తర్వాత
  rationale: כְּ ఉపసర్గ సూచించే సుమారు అనే భావాన్ని ‘దాదాపు’ నిలుపుతుంది; కాల సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా ‘తర్వాత’ తెలియజేస్తుంది.
- source_word: וַיִּגֹּף
  choice: మొత్తాడు
  rationale: נָגַף అనే క్రియలోని ప్రత్యక్షంగా దెబ్బకొట్టడం లేదా కూలదోయడం అనే బలమైన భావాన్ని నిలుపుతూ, వ్యాధి వంటి నిర్దిష్ట సాధనాన్ని పాఠ్యంలోకి చేర్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపంగా అందిస్తుంది; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
- source_word: אֶת נָבָל
  choice: నాబాలును
  rationale: אֶת ప్రత్యేకంగా అనువదించబడదు; ప్రత్యక్ష కర్మను తెలుగు విభక్తి సూచిస్తుంది, వ్యక్తినామం ‘నాబాలు’గా లిప్యంతరీకరించబడింది.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: రెండవ వరుస కథన క్రియను సూటిగా నిలుపుతుంది; ‘చంపాడు’ లేదా ‘చచ్చేలా మొత్తాడు’ అని రెండు క్రియలను ఒకే కారణాత్మక వాక్యంగా కలపదు.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: పాఠ్యంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా స్పష్టంగా ఉంచింది. ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణ.
- issue: దైవ తీర్పులో కారణత్వం యొక్క స్థాయి
  choice: యెహోవా నాబాలును మొత్తాడు; అతడు చనిపోయాడు
  alternative: యెహోవా నాబాలును చచ్చేలా మొత్తాడు; యెహోవా నాబాలును చంపాడు
  rationale: హీబ్రూలో ‘మొత్తాడు’ మరియు ‘చనిపోయాడు’ అనే రెండు వరుస క్రియలు ఉన్నాయి. అనువాదం దైవ చర్యను, దాని తరువాతి మరణాన్ని స్పష్టంగా చెబుతుంది; అయితే వాటిని పాఠ్యానికంటే ఎక్కువగా ఒకే కారణాత్మక క్రియగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘మొత్తాడు’ అనే పదం మూలంలోని బలమైన אך నిర్దిష్ట విధానాన్ని చెప్పని దైవ చర్యను నిలుపుతుంది. ప్రధాన పాఠ్యంలోని [a] సూచిక పాదసూచికతో సరిపోలుతుంది.
