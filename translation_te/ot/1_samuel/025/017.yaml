id: 1SA.25.17
reference: 1 Samuel 25:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה דְּעִ֤י וּ/רְאִי֙ מַֽה תַּעֲשִׂ֔י כִּֽי כָלְתָ֧ה הָ/רָעָ֛ה אֶל אֲדֹנֵ֖י/נוּ וְ/עַ֣ל כָּל בֵּית֑/וֹ וְ/הוּא֙ בֶּן בְּלִיַּ֔עַל מִ/דַּבֵּ֖ר אֵלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
translation:
  language: te
  text: “ఇప్పుడు నువ్వు సంగతి తెలుసుకొని, ఏమి చేయాలో ఆలోచించు. ఎందుకంటే మన యజమానిమీద, అతని ఇంటివారందరిమీద విపత్తు రావడం ఖాయమైంది. అతడు ఎంత నీచుడంటే[a], అతనితో మాట్లాడడం ఎవరికీ సాధ్యం కాదు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధానికి అక్షరార్థం ‘పనికిమాలినతనపు కుమారుడు’; సంప్రదాయంగా ‘బెలీయాలు కుమారుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సేవకుని మాటలో అత్యవసరమైన మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: דְּעִי וּרְאִי
  choice: సంగతి తెలుసుకొని … ఆలోచించు
  rationale: స్త్రీలింగ ఏకవచన ఆజ్ఞారూపాలు అబీగయీలును ఉద్దేశించినవి. ‘చూడు’ అనే అక్షరార్థం ఇక్కడ పరిశీలించి నిర్ణయించుకోవడం అనే భావంలో ఉంది; అందువల్ల ‘ఆలోచించు’ సందర్భానుకూలం.
- source_word: מַה תַּעֲשִׂי
  choice: ఏమి చేయాలో
  rationale: చేయబోయే కార్యాన్ని వివేకంతో నిర్ణయించుకోవాలనే అత్యవసర విజ్ఞప్తిని, అవసరానికి మించిన నిర్బంధ భావం లేకుండా వ్యక్తపరుస్తుంది.
- source_word: כָלְתָה הָרָעָה
  choice: విపత్తు రావడం ఖాయమైంది
  rationale: హానికరమైన పరిణామం నిర్ణీతమైందని లేదా ఇక తప్పదని తెలిపే హీబ్రూ నుడికారాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶל אֲדֹנֵינוּ וְעַל כָּל בֵּיתוֹ
  choice: మన యజమానిమీద, అతని ఇంటివారందరిమీద
  rationale: ‘ఇల్లు’ ఇక్కడ కట్టడాన్ని కాక నాబాలు ఆధీనంలోని ఇంటివారిని సూచిస్తుంది; ‘యజమాని’ సేవకుడు–గృహాధిపతి సంబంధానికి తగినది.
- source_word: בֶּן בְּלִיַּעַל
  choice: నీచుడు
  rationale: ఈ సందర్భంలో ఇది ఒక దుష్టమైన, మొండివైన, అధమ వ్యక్తిని సూచించే హీబ్రూ నుడికారం. ‘నీచుడు’ తెలుగులో దాని నైతిక భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: מִדַּבֵּר אֵלָיו
  choice: అతనితో మాట్లాడడం ఎవరికీ సాధ్యం కాదు
  rationale: అతని స్వభావం కారణంగా అతనితో హేతుబద్ధంగా మాట్లాడలేమనే ఫలిత భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: בְּלִיַּעַל అనే నుడికారం
  choice: నీచుడు
  alternative: బెలియాలు కుమారుడు / పనికిమాలినవాడు
  rationale: ఇక్కడ בְּלִיַּעַל ప్రత్యేక దుష్టశక్తి పేరుగా తప్పనిసరిగా వాడబడలేదు; అధముడైన వ్యక్తిని సూచించే నుడికారంగా ఉంది. కాబట్టి తరువాతి కాలపు దయ్యశాస్త్ర సంబంధ అర్థాన్ని వాక్యంలోకి తీసుకురాకుండా సందర్భార్థాన్ని అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలితో అనువదించబడింది. అత్యవసరతను నిలుపుతూ అతిగా గ్రాంథికమైన పదాలను నివారించాం. మూలంలోని నుడికారానికి సంబంధించిన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
