source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַבְדֵ֥י דָוִ֛ד אֶל אֲבִיגַ֖יִל הַ/כַּרְמֶ֑לָ/ה וַ/יְדַבְּר֤וּ אֵלֶ֨י/הָ֙ לֵ/אמֹ֔ר דָּוִד֙ שְׁלָחָ֣/נוּ אֵלַ֔יִ/ךְ לְ/קַחְתֵּ֥/ךְ ל֖/וֹ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
translation:
  language: te
  text: 'దావీదు సేవకులు కర్మెలులో అబీగయీలు దగ్గరకు వచ్చి ఆమెతో ఇలా అన్నారు: “నిన్ను తనకు భార్యగా తీసుకోవడానికి దావీదు మమ్మల్ని నీ దగ్గరకు పంపాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చి
  rationale: בוא సందర్భాన్ని బట్టి ‘రావడం’ లేదా ‘వెళ్లడం’ అని అర్థమవుతుంది. కథనం అబీగయీలు ఉన్న స్థలాన్ని గమ్యంగా చూపుతున్నందున ‘వచ్చి’ సహజంగా ఉంది.
- source_word: עַבְדֵי דָוִד
  choice: దావీదు సేవకులు
  rationale: עֶבֶד అనే పదానికి సేవకుడు, దాసుడు, అధికారి అనే అర్థాలు ఉండవచ్చు. ఇక్కడ వారు దావీదు తరఫున వచ్చిన దూతలు; బానిసత్వ స్థితిపై ప్రత్యేక దృష్టి లేదు.
- source_word: הַכַּרְמֶלָה
  choice: కర్మెలులో ఉన్న
  rationale: స్థలనామానికి ఉన్న దిశాసూచక ప్రత్యయం కర్మెలు వైపు ప్రయాణాన్ని సూచిస్తుంది. తెలుగులో చేరుకున్న సందర్భాన్ని సహజంగా తెలియజేయడానికి అబీగయీలు ‘కర్మెలులో ఉన్న’దని చెప్పబడింది.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר
  choice: ఆమెతో ఇలా అన్నారు
  rationale: హీబ్రూ మాటల పరిచయ సూత్రాన్ని ఆధునిక, సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: שְׁלָחָנוּ
  choice: మమ్మల్ని ... పంపాడు
  rationale: పూర్తయిన పంపింపు చర్యను తెలుగు భూతకాలం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְקַחְתֵּךְ
  choice: నిన్ను ... తీసుకువెళ్లడానికి
  rationale: לקח వివాహ సందర్భంలో స్త్రీని భార్యగా స్వీకరించడాన్ని సూచిస్తుంది. ‘భార్యగా’ అనే తరువాతి పదబంధంతో కలిపి మూలంలోని ‘తీసుకోవడం’ భావాన్ని నిలుపుతుంది; దూతల రాక సందర్భంలో ‘తీసుకువెళ్లడానికి’ సహజంగా ఉంది.
- source_word: לוֹ
  choice: తనకు
  rationale: సర్వనామం దావీదును సూచిస్తుంది; తెలుగులో ‘తనకు’ ప్రతిఫలిత సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: ఇది వివాహాన్ని సూచించే సాధారణ హీబ్రూ పదబంధం; ‘భార్యగా’ స్పష్టమైన, సహజమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని వివాహ పదబంధాన్ని వివరణాత్మక సిద్ధాంత భాష లేకుండా నేరుగా నిలుపుతుంది.
