translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలో రెండుసార్లు వచ్చిన ‘ఇప్పుడు’ అనే మాట వాక్చాతుర్యాన్ని నిలుపుటకు రెండుసార్లూ ఉంచబడింది. ‘కర్మెలు’ను స్థలనామంగా లిప్యంతరీకరించాం.
