source:
  edition: WLC
  text: וְ/עַתָּ֣ה שָׁמַ֔עְתִּי כִּ֥י גֹזְזִ֖ים לָ֑/ךְ עַתָּ֗ה הָ/רֹעִ֤ים אֲשֶׁר לְ/ךָ֙ הָי֣וּ עִמָּ֔/נוּ לֹ֣א הֶכְלַמְנ֗וּ/ם וְ/לֹֽא נִפְקַ֤ד לָ/הֶם֙ מְא֔וּמָה כָּל יְמֵ֖י הֱיוֹתָ֥/ם בַּ/כַּרְמֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
translation:
  language: te
  text: ఇప్పుడు నీ గొర్రెల బొచ్చు కత్తిరించే వాళ్లు ఉన్నారని విన్నాను. ఇప్పుడు, మాతో ఉన్న నీ కాపరులను మేము బాధపెట్టలేదు[a]; వారు కర్మెలులో ఉన్న రోజులన్నిటిలో వారి వస్తువులలో ఏదీ పోయిపోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘వారిని అవమానపరచలేదు.’ ఈ హీబ్రూ పదం అవమానం కలిగించడాన్ని సూచించగలదు; ఈ సందర్భంలో నాబాలు కాపరులకు హాని చేయకపోవడం లేదా వారితో చెడుగా ప్రవర్తించకపోవడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సంభాషణలో ప్రస్తుత విజ్ఞప్తికి మార్పును సూచిస్తుంది; హీబ్రూ సంధానార్థం తెలుగులో సందర్భానుసారంగా అంతర్లీనంగా ఉంది.
- source_word: שָׁמַעְתִּי
  choice: విన్నాను
  rationale: ఇటీవల తెలిసిన వార్తను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: גֹזְזִים לָךְ
  choice: నీ గొర్రెల బొచ్చు కత్తిరిస్తున్నారని
  rationale: హీబ్రూ దత్తివాచక నిర్మాణం నాబాలు గొర్రెల బొచ్చు కత్తిరించే కాలాన్ని సూచిస్తుంది; సందర్భంలో అంతర్లీనంగా ఉన్న ‘గొర్రెలు’ను తెలుగులో స్పష్టత కోసం పేర్కొన్నాం.
- source_word: הָרֹעִים אֲשֶׁר לְךָ
  choice: నీ కాపరులను
  rationale: స్వామ్య సంబంధాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: הָיוּ עִמָּנוּ
  choice: మాతో ఉన్న
  rationale: עִם అనే సంబంధార్థాన్ని అదనపు నివాస లేదా కాలవ్యాప్త భావం చేర్చకుండా నేరుగా నిలుపుతుంది.
- source_word: לֹא הֶכְלַמְנוּם
  choice: మేము బాధపెట్టలేదు
  rationale: కారణార్థక క్రియ యొక్క అవమానం లేదా హాని కలిగించడం అనే భావాన్ని ఈ కాపరుల సంరక్షణ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  choice: వారిదేదీ తప్పిపోలేదు
  rationale: వారి ఆస్తిలో ఏదీ కనిపించకుండా పోలేదనే నిఫ్అల్ భావాన్ని సహజంగా, స్పష్టంగా తెలుపుతుంది.
- source_word: כָּל יְמֵי הֱיוֹתָם
  choice: వారు ... ఉన్న రోజులన్నిటిలో
  rationale: మూలంలోని కాలవ్యాప్త నుడికారాన్ని తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా నిలుపుతుంది.
- source_word: בַּכַּרְמֶל
  choice: కర్మెలులో
  rationale: ఇది సాధారణ నామవాచకం కాదు, యూదాలోని కర్మెలు అనే స్థలనామం; స్థానార్థక విభక్తితో అనువదించబడింది.
