- from: ఇప్పుడు నీ గొర్రెల బొచ్చు కత్తిరిస్తున్నారని విన్నాను. ఇప్పుడు, మాతో ఉన్న నీ కాపరులను మేము బాధపెట్టలేదు[a]; వారు కర్మెలులో ఉన్న రోజులన్నిటిలో వారిదేదీ తప్పిపోలేదు.
  to: ఇప్పుడు నీ గొర్రెల బొచ్చు కత్తిరించే వాళ్లు ఉన్నారని విన్నాను. ఇప్పుడు, మాతో ఉన్న నీ కాపరులను మేము బాధపెట్టలేదు[a]; వారు కర్మెలులో ఉన్న రోజులన్నిటిలో వారి వస్తువులలో ఏదీ పోయిపోలేదు.
