source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ נַעֲרֵ֣י דָוִ֔ד וַ/יְדַבְּר֧וּ אֶל נָבָ֛ל כְּ/כָל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/שֵׁ֣ם דָּוִ֑ד וַ/יָּנֽוּחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/009.yaml
  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
translation:
  language: te
  text: దావీదు యువకులు వచ్చి, దావీదు పేరున నాబాలుకు ఈ మాటలన్నీ చెప్పి, ఆగారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశ్రమించారు.’ ఇక్కడి హీబ్రూ క్రియకు ‘విశ్రమించారు’ లేదా ‘ఆగారు’ అనే అర్థం రావచ్చు. ఈ సందర్భంలో వారు తమ మాటలు ముగించి నాబాలు జవాబు చెప్పేవరకు ఆగారని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  choice: యువకులు
  rationale: נַעַר అనే పదం యువకుడు, సేవకుడు లేదా పరిచారకుడు అనే అర్థాలను ఇవ్వగలదు. ఇక్కడ దావీదు పంపిన మనుషులను సూచిస్తున్నందున, మూలపదంలోని వయస్సు భావాన్ని చెరపకుండా ‘యువకులు’ అని అనువదించాం.
- source_word: וַיָּבֹאוּ
  choice: వచ్చి
  rationale: בוא అనే సాధారణ క్రియకు ‘వచ్చారు’ అనే అర్థం ఉంది. తరువాతి వరుస చర్యలతో సహజంగా కలిసేందుకు తెలుగులో ‘వచ్చి’ అని ఇచ్చాం.
- source_word: וַיְדַבְּרוּ אֶל
  choice: నాబాలుతో చెప్పి
  rationale: דבר אֶל అంటే ఒకరిని ఉద్దేశించి మాట్లాడడం. తెలుగు కథనంలో సందేశంలోని మాటలను తెలియజేయడాన్ని ‘నాబాలుతో చెప్పి’ అనడం సహజం.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలన్నీ
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘ఈ మాటలన్నిటి ప్రకారం’ అని ఉన్నా, వారు అందించిన సందేశాన్ని తెలుగులో సహజంగా, మూలంలోని ‘మాటలు’ అనే నిర్దిష్టతతో తెలిపేందుకు ‘ఈ మాటలన్నీ’ అని ఇచ్చాం.
- source_word: בְּשֵׁם דָּוִד
  choice: దావీదు పేరట
  rationale: בְּשֵׁם ఇక్కడ దావీదు ప్రతినిధులుగా, అతని అధికారంతో మాట్లాడారని సూచిస్తుంది. ‘దావీదు పేరట’ ఈ ప్రతినిధిత్వ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּנוּחוּ
  choice: ఆగారు
  rationale: נוח సాధారణంగా ‘విశ్రమించు, నిలిచిపోవు’ అని అర్థమిస్తుంది. సందేశం చెప్పిన తరువాతి సందర్భంలో వారు మాట్లాడడం ఆపి ప్రతిస్పందన కోసం నిలిచారని ‘ఆగారు’ సహజంగా సూచిస్తుంది; ‘విశ్రమించారు’ అనే మరింత అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
