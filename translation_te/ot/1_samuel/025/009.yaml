translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. వరుస హీబ్రూ క్రియలను తెలుగులో సహజమైన ‘వచ్చి… చెప్పి… ఆగారు’ నిర్మాణంగా మలిచాం. మూలంలోని చివరి క్రియకు ఉన్న అర్థసందిగ్ధతను పాదసూచికలో నిలిపాం.
