  - severity: low
    issue: ‘దావీదు పేరట’ is somewhat dated in modern standard Telugu.
    rationale: ‘దావీదు పేరున’ retains the formal representative force of בְּשֵׁם while sounding more natural in contemporary elevated narrative prose.
