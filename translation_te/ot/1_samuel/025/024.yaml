  edition: WLC
  text: וַ/תִּפֹּל֙ עַל רַגְלָ֔י/ו וַ/תֹּ֕אמֶר בִּ/י אֲנִ֥י אֲדֹנִ֖/י הֶֽ/עָוֺ֑ן וּֽ/תְדַבֶּר נָ֤א אֲמָֽתְ/ךָ֙ בְּ/אָזְנֶ֔י/ךָ וּ/שְׁמַ֕ע אֵ֖ת דִּבְרֵ֥י אֲמָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/024.yaml
  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
translation:
  language: te
  text: 'ఆమె అతని పాదాల దగ్గర పడి ఇలా అంది[a]: “నా ప్రభువా, అపరాధం నామీదే. దయచేసి మీ దాసి మీ చెవిన పడేలా మాట్లాడటానికి అనుమతించండి[b]; మీ దాసి మాటలు వినండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ప్రభువా, అపరాధం నాదే.” హీబ్రూలో ఇది అపరాధ బాధ్యతను తనపై వేసుకునే సంక్షిప్త నుడికారం; అక్షరార్థంగా, “నామీద, నా ప్రభువా, అపరాధం.”
    reason: lexical_alternative
  - marker: b
    text: “దాసి” అని అనువదించిన హీబ్రూ పదం ప్రత్యేకంగా స్త్రీ దాసిని సూచిస్తుంది; ఇక్కడ అది అబీగయీలు వినయంగా తనను తాను సంబోధించుకున్న మాట.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: ఆమె అతని పాదాల దగ్గర పడి
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘అతని పాదాలపై పడింది’ అని ఉన్నా, ఇది విన్నపం లేదా వినయాన్ని సూచించే భంగిమ. ‘పాదాల దగ్గర పడి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భంగిమను నిలుపుతుంది.
- source_word: בִּי אֲנִי אֲדֹנִי הֶעָוֹן
  choice: నా ప్రభువా, ఈ అపరాధం నామీదే ఉండనివ్వండి
  rationale: సంక్షిప్తమైన హీబ్రూ వాక్యం అపరాధ బాధ్యతను తనపై వేసుకోవడాన్ని సూచిస్తుంది. ‘నామీదే ఉండనివ్వండి’ בִּי అనే విభక్తి భావాన్ని, అబీగయీలు వినయపూర్వకంగా బాధ్యత స్వీకరించడాన్ని కాపాడుతుంది.
- source_word: אֲדֹנִי
  choice: నా ప్రభువా
  rationale: ఇక్కడ ఇది దావీదుకు ఇచ్చిన గౌరవపూర్వక సంబోధన; దేవునికి ఉపయోగించే బిరుదు కాదు. ‘నా ప్రభువా’ కథనంలోని విధేయతతో కూడిన గౌరవ స్థాయిని నిలుపుతుంది.
- source_word: וּתְדַבֶּר נָא
  choice: దయచేసి ... మాట్లాడనివ్వండి
  rationale: נָא తో కూడిన అభ్యర్థన వినయపూర్వక విన్నపాన్ని వ్యక్తం చేస్తుంది. తెలుగు అనుమతి నిర్మాణం దీనిని సహజంగా తెలియజేస్తుంది.
- source_word: אֲמָתְךָ / אֲמָתֶךָ
  choice: మీ దాసి
  rationale: హీబ్రూ పదం ప్రత్యేకంగా స్త్రీ దాసిని సూచిస్తుంది. ‘దాసి’ లింగ సూచనను, అబీగయీలు తనను తాను తగ్గించుకొని మాట్లాడే ధోరణిని కాపాడుతూ ఆధునిక తెలుగులో సంక్షిప్తంగా ఉంటుంది.
- source_word: בְּאָזְנֶיךָ
  choice: మీకు వినిపించేలా
  rationale: అక్షరార్థంగా ‘మీ చెవుల్లో’ అనే హీబ్రూ నుడికారం ఎదుటివారు వినేలా మాట్లాడటాన్ని సూచిస్తుంది. ‘మీకు వినిపించేలా’ తెలుగులో సహజమైన భావసమానం.
- source_word: וּשְׁמַע אֵת דִּבְרֵי
  choice: మాటలు వినండి
  rationale: שׁמע అనే ఆజ్ఞారూపాన్ని, ‘మాటలు’ అనే కర్మను నేరుగా మరియు సహజంగా ప్రతిబింబిస్తుంది.
