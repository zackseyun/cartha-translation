  text: וַ/יִּשְׁמַ֣ע דָּוִד֮ כִּ֣י מֵ֣ת נָבָל֒ וַ/יֹּ֡אמֶר בָּר֣וּךְ יְהוָ֡ה אֲשֶׁ֣ר רָב֩ אֶת רִ֨יב חֶרְפָּתִ֜/י מִ/יַּ֣ד נָבָ֗ל וְ/אֶת עַבְדּ/וֹ֙ חָשַׂ֣ךְ מֵֽ/רָעָ֔ה וְ/אֵת֙ רָעַ֣ת נָבָ֔ל הֵשִׁ֥יב יְהוָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּשְׁלַ֤ח דָּוִד֙ וַ/יְדַבֵּ֣ר בַּ/אֲבִיגַ֔יִל לְ/קַחְתָּ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
translation:
  language: te
  text: 'నాబాలు చనిపోయాడని దావీదు విన్నప్పుడు, అతడు ఇలా అన్నాడు: “నాబాలు చేసిన అవమానం విషయంలో నా పక్షాన వాదించిన యెహోవా స్తుతింపబడుగాక![a] ఆయన తన సేవకుణ్ణి చెడు చేయకుండా అడ్డుకున్నాడు.[b] నాబాలు చేసిన చెడును యెహోవా అతని తలమీదకే తిరిగి రప్పించాడు.”[c] ఆ తర్వాత దావీదు అబీగయీలును తనకు భార్యగా చేసుకోవడానికి ఆమెతో మాట్లాడేందుకు కబురు పంపాడు.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో న్యాయవివాదానికి సంబంధించిన మాటలు ఉన్నాయి; అక్షరార్థానికి దగ్గరగా, “నా అవమానపు వ్యాజ్యాన్ని నాబాలు చేతినుండి వాదించినవాడు” అని చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన సేవకుణ్ణి హాని చేయకుండా నిలువరించాడు.”
    reason: lexical_alternative
  - marker: c
    text: “అతని తలమీదకే తిరిగి రప్పించాడు” అనేది, తప్పు చేసినవానికే దాని ప్రతిఫలం తిరిగి వచ్చిందని తెలిపే హీబ్రూ నానుడి.
    reason: cultural_note
  - marker: d
    text: అక్షరార్థానికి దగ్గరగా, “దావీదు పంపి, అబీగయీలుతో మాట్లాడాడు—ఆమెను తనకు భార్యగా తీసుకోవడానికి.” అంటే, దూతల ద్వారా ఆమెను వివాహం చేసుకోవాలనే మాట పంపాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: యెహోవా స్తుతింపబడుగాక
  rationale: హీబ్రూ ఆశీర్వాద-స్తుతి సూత్రంలోని స్తుత్యర్థాన్ని ఆధునిక తెలుగులో సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: רָב אֶת רִיב חֶרְפָּתִי
  choice: నాబాలు చేసిన అవమానం విషయంలో నా పక్షాన వాదించిన
  rationale: ריב పదంలోని న్యాయవివాద భావాన్ని ‘నా పక్షాన వాదించిన’ అని నిలుపుతూ, חֶרְפָּהను సందర్భానుసారంగా ‘అవమానం’గా అందిస్తుంది.
- source_word: מִיַּד נָבָל
  choice: నాబాలు చేసిన
  rationale: ‘నాబాలు చేతినుండి’ అనే హీబ్రూ ప్రయోగాన్ని పదశః అనుసరించకుండా, అవమానానికి నాబాలే కారకుడన్న భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְאֶת עַבְדּוֹ חָשַׂךְ מֵרָעָה
  choice: తన సేవకుణ్ణి చెడు చేయకుండా అడ్డుకున్నాడు
  rationale: חָשַׂךְలోని నిలువరింపు భావాన్నీ, רָעָהలోని నైతిక చెడు భావాన్నీ స్పష్టంగా ఉంచుతుంది.
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  choice: నాబాలు చేసిన చెడును యెహోవా అతని తలమీదకే తిరిగి రప్పించాడు
  rationale: చేసిన చెడు చేసినవానికే ప్రతిఫలంగా తిరిగివచ్చిందనే హీబ్రూ రూపకాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: וַיִּשְׁלַח דָּוִד וַיְדַבֵּר בַּאֲבִיגַיִל
  choice: దావీదు ... ఆమెతో మాట్లాడేందుకు కబురు పంపాడు
  rationale: దావీదు దూతల ద్వారా అబీగయీలుతో మాట్లాడాడనే భావాన్ని, ‘ప్రతిపాదించాడు’ అనే అదనపు వ్యాఖ్యానాన్ని చేర్చకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  choice: ఆమెను తనకు భార్యగా చేసుకోవడానికి
  rationale: హీబ్రూ వివాహ ప్రయోగాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: నాబాలు మరణంలో దైవిక తీర్పు, ప్రతిఫలం
  choice: దావీదు మాటల ప్రకారం యెహోవా అతని పక్షాన వాదించి నాబాలు చేసిన చెడును అతనికే తిరిగి రప్పించాడని స్పష్టంగా ఉంచడం
  alternative: నాబాలును యెహోవా నేరుగా శిక్షించి చంపాడని మరింత వివరణాత్మకంగా చెప్పడం
  rationale: మూలపాఠం దైవిక న్యాయప్రతిఫలాన్ని స్పష్టంగా పేర్కొంటుంది; అయితే నాబాలు మరణించిన విధానంపై ఈ వాక్యానికి మించిన సిద్ధాంతాత్మక వివరణను జోడించదు.
- issue: దావీదు רָעָה నుండి నిలువరించబడటం
  choice: ‘చెడు చేయకుండా అడ్డుకున్నాడు’
  alternative: ‘హాని చేయకుండా అడ్డుకున్నాడు’ లేదా ‘పగ తీర్చుకోకుండా అడ్డుకున్నాడు’
  rationale: רָעָהలోని నైతిక తీవ్రతను నిలుపుతూ, దావీదు చేయబోయిన పని కేవలం హాని మాత్రమే కాదని వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం. న్యాయవివాద రూపకాన్ని ప్రధాన పాఠ్యంలో సహజీకరించి, దాని అక్షరార్థ స్వరూపాన్ని పాదటిప్పణిలో నిలిపాం.
