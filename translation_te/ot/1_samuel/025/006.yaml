translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆశీర్వాద శైలిని వాడాం. హెబ్రీలోని మూడుసార్ల שָׁלוֹם పునరుక్తిని ‘క్షేమం’ మూడుసార్లు ఉంచి కాపాడాం. చివరి ‘కలుగుగాక’ సమాంతరమైన మూడు ఆశీస్సులకూ వ్యాకరణపరంగా వర్తిస్తుంది.
