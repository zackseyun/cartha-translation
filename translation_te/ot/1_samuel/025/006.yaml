reference: 1 Samuel 25:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֥ם כֹּ֖ה לֶ/חָ֑י וְ/אַתָּ֤ה שָׁלוֹם֙ וּ/בֵיתְ/ךָ֣ שָׁל֔וֹם וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
translation:
  language: te
  text: 'ఇలా చెప్పండి: ‘మీకు దీర్ఘాయువు కలుగుగాక![a] మీకు క్షేమం, మీ ఇంటివారికి క్షేమం, మీకు చెందిన సమస్తానికీ క్షేమం కలుగుగాక.[b]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘జీవానికి’ లేదా ‘జీవించువానికి’ అనే అసాధారణ పదబంధం ఉంది. ఇది బహుశా పలకరింపు లేదా ఆశీర్వాదం; అందుకే ‘మీకు దీర్ఘాయువు కలుగుగాక’ అని అనువదించబడింది. ‘శుభాకాంక్షలు’ లేదా ‘జీవించువానికి’ అనేవి ఇతర సాధ్యమైన అనువాదాలు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ ‘క్షేమం’గా అనువదించిన హెబ్రీ షాలోమ్ అనే పదం శాంతితోపాటు సౌఖ్యం, సంపూర్ణత, భద్రత, అభివృద్ధి అనే భావాలనూ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם כֹּה
  choice: వారితో ఇలా చెప్పండి
  rationale: వావ్‌తో కూడిన పరిపూర్ణ క్రియ ఇక్కడ ముందున్న ఆజ్ఞను కొనసాగించే ఆదేశ భావాన్ని ఇస్తుంది. ‘ఇలా చెప్పండి’ ఆధునిక తెలుగులో సహజంగా ఉండి, כֹּה యొక్క సూచనార్థాన్ని నిలుపుతుంది.
- source_word: לֶחָי
  choice: మీకు దీర్ఘాయువు కలుగుగాక
  rationale: అక్షరార్థంగా అస్పష్టమైన ‘జీవానికి/జీవించువానికి’ అనే రూపం సందర్భంలో పలకరింపు లేదా ఆశీర్వాద సూత్రంగా కనిపిస్తుంది. ఈ అనువాదం జీవితం అనే భావాన్ని, శుభాకాంక్ష స్వరాన్ని రెండింటినీ నిలుపుతుంది; అస్పష్టతను పాదటిప్పణిలో సూచించాం.
- source_word: וְאַתָּה שָׁלוֹם
  choice: మీకు క్షేమం ... కలుగుగాక
  rationale: క్రియలేని హెబ్రీ వాక్యం శుభాశీస్సును వ్యక్తం చేస్తుంది. తెలుగులో చివర ఉంచిన ‘కలుగుగాక’ మూడు సమాంతర భాగాలకూ వర్తిస్తుంది.
- source_word: וּבֵיתְךָ שָׁלוֹם
  choice: మీ ఇంటివారికి క్షేమం
  rationale: בֵּיתְךָ అక్షరార్థంగా ‘నీ ఇల్లు’ అయినా, ఇక్కడ ఇంటివారిని లేదా కుటుంబాన్ని సూచిస్తుంది. ‘ఇంటివారు’ ఆధునిక తెలుగులో ఉద్దేశిత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְכֹל אֲשֶׁר לְךָ שָׁלוֹם
  choice: మీకు చెందిన సమస్తానికీ క్షేమం
  rationale: ఈ విస్తృత పదబంధం అతనికి చెందినవారినీ ఆస్తినీ కలుపుకోగలదు. ‘సమస్తం’ ఆ పరిధిని అనవసరంగా కుదించదు.
- source_word: שָׁלוֹם
  choice: క్షేమం
  rationale: ఈ పలకరింపు సందర్భంలో שָׁלוֹם కేవలం కలహం లేకపోవడమే కాక సౌఖ్యం, సంపూర్ణ శ్రేయస్సు, భద్రత అనే భావాలను కలిగి ఉంది. తెలుగు ఆశీర్వాద భాషలో ‘క్షేమం’ ఈ విస్తృత భావానికి సహజంగా సరిపోతుంది.
