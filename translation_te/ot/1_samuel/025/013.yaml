translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, దావీదు సహా ఒక్కొక్కరు కత్తి కట్టుకున్న చర్యను స్పష్టంగా చూపించాం.
