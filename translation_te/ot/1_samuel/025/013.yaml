id: 1SA.25.13
reference: 1 Samuel 25:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ דָּוִ֨ד לַ/אֲנָשָׁ֜י/ו חִגְר֣וּ אִ֣ישׁ אֶת חַרְבּ֗/וֹ וַֽ/יַּחְגְּרוּ֙ אִ֣ישׁ אֶת חַרְבּ֔/וֹ וַ/יַּחְגֹּ֥ר גַּם דָּוִ֖ד אֶת חַרְבּ֑/וֹ וַֽ/יַּעֲל֣וּ אַחֲרֵ֣י דָוִ֗ד כְּ/אַרְבַּ֤ע מֵאוֹת֙ אִ֔ישׁ וּ/מָאתַ֖יִם יָשְׁב֥וּ עַל הַ/כֵּלִֽים׀־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
translation:
  language: te
  text: 'అప్పుడు దావీదు తన మనుష్యులతో ఇలా అన్నాడు: “మీలో ప్రతి ఒక్కరూ తన కత్తిని నడుముకు కట్టుకోండి.” వారిలో ప్రతి ఒక్కరూ తన కత్తిని నడుముకు కట్టుకున్నారు; దావీదు కూడా తన కత్తిని నడుముకు కట్టుకున్నాడు. దాదాపు నాలుగు వందల మంది దావీదును అనుసరించి పైకి వెళ్లారు; రెండు వందల మంది సామగ్రి వద్ద ఉండిపోయారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సామాను దగ్గర” లేదా “పరికరాల దగ్గర.”
    reason: כֵּלִים అనే పదానికి సామాను, పరికరాలు, సామగ్రి వంటి విస్తృత అర్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: חִגְרוּ / וַיַּחְגְּרוּ / וַיַּחְגֹּר
  choice: నడుముకు కట్టుకోండి / నడుముకు కట్టుకున్నారు / నడుముకు కట్టుకున్నాడు
  rationale: חגר అనే క్రియ ఆయుధాన్ని నడుముకు బిగించుకోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, క్రియలోని స్పష్టమైన శారీరక చర్యను నిలుపుతుంది.
- source_word: אִישׁ אֶת־חַרְבּוֹ
  choice: ప్రతి ఒక్కరూ తమ కత్తిని
  rationale: ఇది పంపిణీ భావాన్ని వ్యక్తం చేస్తుంది—గుంపులోని ఒక్కొక్కరు తమ సొంత కత్తిని కట్టుకున్నారు. తెలుగు వాక్య నిర్మాణానికి సహజంగా ఉండేందుకు బహువచన గౌరవ/సామాన్య రూపం వాడబడింది.
- source_word: חַרְבּוֹ
  choice: తన/తమ కత్తి
  rationale: חֶרֶב ప్రత్యేకంగా కత్తిని సూచిస్తుంది; సాధారణమైన ‘ఆయుధం’ అని విస్తరించలేదు.
- source_word: גַּם
  choice: కూడా
  rationale: దావీదు సైతం తన మనుషులతో పాటు ఆయుధం ధరించాడనే భాగస్వామ్య భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: וַיַּעֲלוּ אַחֲרֵי דָוִד
  choice: దావీదు వెనుక బయలుదేరారు
  rationale: אַחֲרֵי లోని అనుసరించే భావాన్ని ‘వెనుక’ నిలుపుతుంది. עלה లోని పైకి వెళ్లడం సందర్భంలో భౌగోళికంగా స్పష్టంగా లేకపోవడంతో, సహజమైన కథన తెలుగులో ‘బయలుదేరారు’ అని ఇచ్చాం.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: దాదాపు నాలుగు వందల మంది
  rationale: సంఖ్యకు ముందు ఉన్న כְּ సుమారు అనే భావాన్ని సూచించగలదు; ‘దాదాపు’ ఆ అనిశ్చితిని నిలుపుతుంది.
- source_word: יָשְׁבוּ
  choice: ఉండిపోయారు
  rationale: మూల క్రియ అక్షరార్థంగా ‘కూర్చున్నారు’ అని ఉన్నా, ఇక్కడ ముందుకు వెళ్లకుండా వెనుకనే మిగిలారనే సందర్భార్థం ఉంది.
- source_word: עַל־הַכֵּלִים
  choice: సామగ్రి దగ్గర
  rationale: כֵּלִים అనేది వస్తువులు, పరికరాలు, సామాను వంటి విస్తృతార్థ పదం. ప్రయాణ/సైనిక సందర్భంలో ‘సామగ్రి’ సహజంగా ఉంది; עַל‌ను సందర్భానుసారం ‘దగ్గర’గా ఇచ్చాం.
- source_word: לַאֲנָשָׁיו
  choice: తన మనుషులతో
  rationale: ఇక్కడ אֲנָשִׁים దావీదుతో ఉన్న పురుషుల బృందాన్ని సూచిస్తుంది. ‘మనుషులు’ మూలంలోని సాధారణ పదాన్ని నిలుపుతూ సందర్భానికి సరిపోతుంది.
