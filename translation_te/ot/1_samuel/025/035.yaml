id: 1SA.25.35
reference: 1 Samuel 25:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח דָּוִד֙ מִ/יָּדָ֔/הּ אֵ֥ת אֲשֶׁר הֵבִ֖יאָה ל֑/וֹ וְ/לָ֣/הּ אָמַ֗ר עֲלִ֤י לְ/שָׁלוֹם֙ לְ/בֵיתֵ֔/ךְ רְאִי֙ שָׁמַ֣עְתִּי בְ/קוֹלֵ֔/ךְ וָ/אֶשָּׂ֖א פָּנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
translation:
  language: te
  text: దావీదు ఆమె చేతిలోనుంచి ఆమె అతనికి తెచ్చినదాన్ని తీసుకున్నాడు. తరువాత అతడు ఆమెతో, “నీ ఇంటికి క్షేమంగా వెళ్లు. చూడు, నేను నీ మాట విన్నాను; నీ పట్ల అనుగ్రహం చూపాను[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “నిన్ను అంగీకరించాను.” హీబ్రూలో అక్షరార్థం: “నీ ముఖాన్ని ఎత్తాను.”'
    reason: హీబ్రూ నుడికారంలోని అక్షరార్థాన్ని, దాని సాధ్యమైన ప్రత్యామ్నాయ భావాన్ని సంరక్షించడానికి.
lexical_decisions:
- source_word: וַיִּקַּח ... מִיָּדָהּ
  choice: ఆమె చేతిలోనుంచి ... తీసుకున్నాడు
  rationale: ‘తీసుకొను’ అనే మూల క్రియార్థాన్ని, అలాగే ‘ఆమె చేతిలోనుంచి’ అనే సజీవమైన హీబ్రూ వ్యక్తీకరణను నిలుపుతుంది.
- source_word: אֵת אֲשֶׁר הֵבִיאָה לוֹ
  choice: ఆమె తన కోసం తెచ్చినదాన్ని
  rationale: అబీగయీలు దావీదు కోసం తెచ్చిన ఆహారసామగ్రిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; మూలంలో లేని నిర్దిష్ట నామవాచకాన్ని చేర్చదు.
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  choice: నీ ఇంటికి క్షేమంగా వెళ్లు
  rationale: עֲלִי అక్షరార్థంగా ‘పైకి వెళ్లు’ అయినా, ఇక్కడ విడిచి ఇంటికి వెళ్లడాన్ని సూచిస్తుంది. ‘క్షేమంగా వెళ్లు’ అనేది ప్రయాణానికి శాంతి, భద్రత కలగాలనే హీబ్రూ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: רְאִי
  choice: చూడు
  rationale: వినేవారి దృష్టిని తరువాతి మాటపై నిలిపే ఆజ్ఞార్థక ప్రయోగాన్ని నేరుగా నిలుపుతుంది.
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  choice: నేను నీ మాట విన్నాను
  rationale: అక్షరార్థంలోని ‘నీ స్వరం విన్నాను’ అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, సందర్భంలో ఆమె విజ్ఞప్తిని ఆలకించి దానికి సమ్మతించిన అర్థాన్నీ అందిస్తుంది.
- source_word: וָאֶשָּׂא פָנָיִךְ
  choice: నీ పట్ల అనుగ్రహం చూపాను
  rationale: ‘నీ ముఖాన్ని ఎత్తాను’ అనే హీబ్రూ నుడికారానికి సందర్భానుగుణమైన భావం—ఆమెను ఆదరించి ఆమె విజ్ఞప్తిని అనుకూలంగా స్వీకరించడం—స్పష్టంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: וָאֶשָּׂא פָנָיִךְ అనే ‘ముఖాన్ని ఎత్తడం’ నుడికారపు భావం
  choice: నీ పట్ల అనుగ్రహం చూపాను
  alternative: నిన్ను అంగీకరించాను; నీ ముఖాన్ని ఎత్తాను
  rationale: అక్షరానువాదం ఆధునిక తెలుగులో అస్పష్టంగా ఉంటుంది. ఎంపిక చేసిన రూపం దావీదు అబీగయీలును ఆదరించి ఆమె విజ్ఞప్తిని మన్నించిన భావాన్ని తెలియజేస్తుంది; ‘అంగీకరించడం’ మరియు ‘అనుగ్రహం చూపడం’ మధ్య ఉన్న భావపరిధిని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ నుడికారాలను అవసరమైన చోట సహజ తెలుగులో తెలిపి, ముఖ్యమైన అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
