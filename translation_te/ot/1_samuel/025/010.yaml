source:
  edition: WLC
  text: וַ/יַּ֨עַן נָבָ֜ל אֶת עַבְדֵ֤י דָוִד֙ וַ/יֹּ֔אמֶר מִ֥י דָוִ֖ד וּ/מִ֣י בֶן יִשָׁ֑י הַ/יּוֹם֙ רַבּ֣וּ עֲבָדִ֔ים הַ/מִּתְפָּ֣רְצִ֔ים אִ֖ישׁ מִ/פְּנֵ֥י אֲדֹנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
translation:
  language: te
  text: 'నాబాలు దావీదు సేవకులకు జవాబిచ్చి ఇలా అన్నాడు: “దావీదు ఎవడు? యెష్షయి కుమారుడు ఎవడు? ఈ రోజుల్లో తమ తమ యజమానుల దగ్గర నుంచి విడిపోయిపోతున్న సేవకులు చాలామంది ఉన్నారు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ రోజుల్లో తమ తమ యజమానుల దగ్గర నుంచి విడిపోయిపోతున్న సేవకులు ఎక్కువయ్యారు.”
    reason: రַבּוּ అనే క్రియను ప్రధాన పాఠంలో సహజంగా ‘చాలామంది ఉన్నారు’ అని, మరింత క్రియారూపానికి దగ్గరగా ‘ఎక్కువయ్యారు’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: జవాబిస్తూ ఇలా అన్నాడు
  rationale: హీబ్రూ కథన సూత్రంలోని ‘జవాబిచ్చి అన్నాడు’ అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עַבְדֵי דָוִד
  choice: దావీదు సేవకులు
  rationale: ఈ సందర్భంలో వారు దావీదు పంపిన అనుచరులు; ‘సేవకులు’ మూలపదానికి పారదర్శకంగా ఉండి, అవసరం లేని బానిసత్వ భావాన్ని బలవంతంగా రుద్దదు.
- source_word: מִי דָוִד וּמִי בֶן־יִשָׁי
  choice: దావీదు ఎవడు? యెష్షయి కుమారుడు ఎవడు?
  rationale: పునరుక్త ప్రశ్నల రూపాన్ని అలాగే ఉంచి నాబాలు చూపిన తిరస్కారాన్ని తెలియజేస్తుంది. ‘ఎవడు’ అనే రూపం అతని అవమానకర స్వరాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజుల్లో
  rationale: అక్షరార్థంగా ‘ఈ రోజు’ అయినా, ఇక్కడ సాధారణ సామాజిక వ్యాఖ్యలో ‘ఈ రోజుల్లో’ అనే కాలవ్యాప్త భావం సహజం.
- source_word: רַבּוּ עֲבָדִים
  choice: సేవకులు చాలామంది అయ్యారు
  rationale: רבה క్రియలోని ‘అనేకులయ్యారు/విస్తరించారు’ అనే పరిమాణ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמִּתְפָּרְצִים
  choice: విడిపోయి పోతున్న
  rationale: ప్రభువు ఆధీనంనుంచి బలంగా బయటపడటం అనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది; ‘తిరుగుబాటు చేస్తున్నారు’ అని అతిగా నిర్దిష్టీకరించదు.
- source_word: אִישׁ מִפְּנֵי אֲדֹנָיו
  choice: ఒక్కొక్కరూ తమ యజమాని దగ్గర నుంచి
  rationale: אישׁ పదంలోని పంపిణీ భావాన్ని ‘ఒక్కొక్కరూ’ నిలుపుతుంది. ‘సన్నిధి నుంచి’ అనే అక్షరానువాదం కంటే ‘దగ్గర నుంచి’ తెలుగులో సహజంగా ఉండి విడిచి వెళ్లే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: దావీదు స్థితిపై నాబాలు చేసిన వ్యాఖ్య
  choice: అతని మాటలను అవమానకర ప్రశ్నలుగానే ఉంచడం
  alternative: దావీదు నిజంగా ఎవరో నాబాలుకు తెలియదన్నట్లుగా వివరణాత్మకంగా అనువదించడం
  rationale: మూలం నాబాలు నిజంగా తెలియక అడిగాడా లేక తెలిసే తృణీకరించాడా అని ప్రత్యక్షంగా వివరించదు; ప్రశ్నారూపాన్ని నిలపడం ఆ కథన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన శైలి. నాబాలు పలికిన తృణీకారాన్ని చూపేందుకు ప్రశ్నల్లో ‘ఎవడు’ వాడబడింది. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని పునరుక్తి, పంపిణీ భావం, సామాజిక ఉద్రిక్తతలను నిలుపుకున్నాం.
