  yaml_path: translation/ot/1_samuel/025/042.yaml
  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: te
  text: అబీగయీలు త్వరపడి లేచి గాడిదపై ఎక్కింది; ఆమెతో పాటు ఆమె ఐదుగురు యువతులు నడుస్తూ ఉన్నారు. ఆమె దావీదు దూతల వెంటే వెళ్లి అతనికి భార్య అయింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  choice: త్వరపడి లేచి
  rationale: రెండు వరుస క్రియలైన ‘త్వరపడింది’ మరియు ‘లేచింది’ అనే భావాలను సహజమైన ఆధునిక తెలుగు క్రియాసముచ్చయంగా నిలిపింది.
- source_word: נַעֲרֹתֶיהָ
  choice: ఆమె పనికత్తెలు
  rationale: సందర్భంలో ఆమెకు సేవచేసే యువతులను సూచిస్తుంది; ‘పనికత్తెలు’ సాధారణ పాఠకుడికి వారి పాత్రను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַהֹלְכוֹת לְרַגְלָהּ
  choice: ఆమె వెనుక నడుస్తున్న
  rationale: అక్షరార్థంగా ‘ఆమె పాదాల దగ్గర/వెంట నడిచేవారు’; ఇక్కడ పరివారంగా వెంబడించడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַחֲרֵי מַלְאֲכֵי דָוִד
  choice: దావీదు దూతల వెంట
  rationale: מַלְאָךְ ఇక్కడ దేవదూతను కాక మానవ సందేశవాహకులను సూచిస్తుంది; ‘దూతలు’ సందర్భానికి సరిపోతుంది.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: అతనికి భార్య అయింది
  rationale: హీబ్రూ వివాహ సూత్రాన్ని సరళంగా, నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభమైన శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని ప్రతి ప్రధాన భావాన్ని నిలిపి సహజమైన తెలుగు వాక్యాలుగా విభజించబడింది.
