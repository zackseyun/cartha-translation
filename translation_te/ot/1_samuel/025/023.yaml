  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
translation:
  language: te
  text: అబీగయీ దావీదును చూసి, త్వరపడి గాడిదపై నుంచి దిగింది. ఆమె ముఖం నేలకు ఆనించి దావీదు ఎదుట పడిపోయి, నేలవరకు వంగి నమస్కరించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేలమీద సాష్టాంగపడింది.” హీబ్రూ క్రియ లోతుగా వంగడాన్నీ, పూర్తిగా సాష్టాంగపడడాన్నీ సూచించగలదు. ఇక్కడ అది దావీదుకు చేసిన గౌరవపూర్వక నమస్కారం; తప్పనిసరిగా ఆరాధన కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: చూడగానే
  rationale: ראה ఇక్కడ సాధారణంగా ‘చూచుట’ అనే అర్థమే ఇస్తుంది; తరువాతి చర్య వెంటనే జరిగినట్లు వాక్యప్రవాహంలో ‘చూడగానే’ సహజంగా తెలియజేస్తుంది.
- source_word: וַתְּמַהֵר
  choice: త్వరగా
  rationale: מהר చర్యలోని వేగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘త్వరగా’ సహజమైనది.
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  choice: గాడిదపై నుంచి దిగింది
  rationale: మూలంలోని ‘గాడిద మీదనుండి దిగింది’ అనే స్థలార్థాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: וַתִּפֹּל לְאַפֵּי דָוִד עַל פָּנֶיהָ
  choice: దావీదు ఎదుట సాష్టాంగపడింది
  rationale: దావీదు ముందు ముఖం నేలకు ఆనేటట్లు పడిన భంగిమను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘పాదాల దగ్గర’ అనే భావాన్ని చేర్చదు.
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  choice: నేలవరకు వంగి నమస్కరించింది
  rationale: שׁחה సూచించే లోతైన వంగడం లేదా సాష్టాంగ నమస్కారాన్ని తెలియజేస్తూ, దైవారాధన అనే అవసరం లేని భావాన్ని మోపదు.
theological_decisions:
- issue: మనిషి ఎదుట చేసిన שׁחה క్రియను ఎలా అనువదించాలి
  choice: నేలవరకు వంగి నమస్కరించింది
  alternative: నేలమీద సాష్టాంగపడింది; ఆరాధించింది
  rationale: ఈ సందర్భంలో అబీగయీలు దావీదుకు గౌరవం, విధేయత చూపుతోంది. కాబట్టి ‘ఆరాధించింది’ అనడం దైవారాధన భావాన్ని అనవసరంగా దిగుమతి చేస్తుంది; అయితే లోతైన నమస్కారం అనే మూలభావం నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘సాష్టాంగపడింది’ భంగిమను స్పష్టంచేస్తుంది; ‘నమస్కరించింది’ మానవునికి చూపిన గౌరవాన్ని తెలియజేస్తుంది.
