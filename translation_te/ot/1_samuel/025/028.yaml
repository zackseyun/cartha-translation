id: 1SA.25.28
reference: 1 Samuel 25:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
translation:
  language: te
  text: దయచేసి మీ దాసి చేసిన అపరాధాన్ని క్షమించండి. యెహోవా నా ప్రభువుకు నిలకడైన గృహాన్ని[a] తప్పకుండా ఏర్పరుస్తాడు. ఎందుకంటే నా ప్రభువు యెహోవా యుద్ధాలను పోరాడుతున్నారు; మీ జీవితమంతా మీలో ఏ చెడూ కనబడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, స్థిరంగా కొనసాగిపోయే వంశం లేదా రాజవంశం. ఇక్కడ ‘గృహం’ అనేది కేవలం నివాసాన్ని కాదు, నిలిచివుండే కుటుంబ వంశపరంపరను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע אֲמָתֶךָ
  choice: దయచేసి మీ దాసి చేసిన అపరాధాన్ని క్షమించండి
  rationale: ‘ఎత్తు/భరించు’ అనే హీబ్రూ ప్రయోగం ఇక్కడ అపరాధాన్ని క్షమించమనే వినయపూర్వక విజ్ఞప్తి. ‘దాసి’ అబీగయీలు తనను తాను తగ్గించుకొని మాట్లాడిన స్త్రీలింగ రూపాన్ని నిలుపుతుంది.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: తప్పకుండా ఏర్పరుస్తాడు
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే బలమైన నిశ్చయాన్ని ‘తప్పకుండా’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בַּיִת נֶאֱמָן
  choice: నిలకడైన గృహం
  rationale: ‘గృహం’ అనే మూల రూపకాన్ని, దావీదు వంశం స్థిరంగా కొనసాగుతుందనే భావాన్ని రెండింటినీ నిలుపుతుంది; భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: מִלְחֲמוֹת יְהוָה ... נִלְחָם
  choice: యెహోవా యుద్ధాలు చేస్తున్నారు
  rationale: ఈ పదబంధం యెహోవా పక్షాన లేదా ఆయన కార్యం కోసం జరిగే యుద్ధాలను సూచిస్తుంది. వర్తమాన కొనసాగింపు రూపం హీబ్రూ participle తెలిపే అలవాటైన/కొనసాగుతున్న కార్యాన్ని అందిస్తుంది.
- source_word: וְרָעָה לֹא תִמָּצֵא בְךָ
  choice: మీలో ఏ చెడూ కనబడదు
  rationale: רָעָהకు చెడు, కీడు, ఆపద అనే విస్తృతార్థాలు ఉండగలవు. సందర్భంలో దావీదు రక్తాపరాధానికి పాల్పడకూడదనే నైతిక అంశం ప్రధానంగా ఉన్నందున ‘చెడు’ ఆ భావాన్ని నిలుపుతూ కొంత అర్థవిస్తృతిని కూడా కాపాడుతుంది.
- source_word: מִיָּמֶיךָ
  choice: మీ జీవితమంతా
  rationale: ‘మీ రోజులన్నిటిలో’ అనే హీబ్రూ నుడికారానికి ఆధునిక తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో అందిస్తుంది.
theological_decisions:
- issue: ‘గృహం’ అనే పదంలోని వంశపారంపర్య భావం
  choice: ప్రధాన పాఠ్యంలో ‘నిలకడైన గృహం’ అని రూపకాన్ని నిలిపి, పాదసూచికలో వంశార్థాన్ని వివరించడం
  alternative: ‘శాశ్వతంగా నిలిచే వంశం’ లేదా ‘స్థిరమైన రాజవంశం’
  rationale: ఈ మాట దావీదుకు స్థిరమైన వంశపరంపర ఏర్పడటాన్ని సూచించినా, ‘గృహం’ అనే బైబిలీయ రూపకాన్ని నేరుగా ‘రాజవంశం’గా మార్చడం మూలంలోని అంతర్గ్రంథ సంబంధాన్ని తగ్గిస్తుంది.
- issue: רָעָה యొక్క నైతిక చెడు/కీడు అనే అర్థసంభావ్యత
  choice: చెడు
  alternative: కీడు లేదా దుర్మార్గం
  rationale: ‘చెడు’ నైతిక తప్పును సూచించగలదు; అదే సమయంలో హీబ్రూ పదానికి ఉన్న విస్తృతిని ‘దుర్మార్గం’ కంటే మెరుగ్గా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన సంభోదనను ఉపయోగించాం. ‘మీ దాసి,’ ‘నా ప్రభువు’ అనే రాజసభా వినయభాషను పురాతనంగా లేదా అసహజంగా మారకుండా నిలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత ‘గృహం’ పదానికే జోడించబడింది.
