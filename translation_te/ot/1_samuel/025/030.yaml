id: 1SA.25.30
reference: 1 Samuel 25:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יַעֲשֶׂ֤ה יְהוָה֙ לַֽ/אדֹנִ֔/י כְּ/כֹ֛ל אֲשֶׁר דִּבֶּ֥ר אֶת הַ/טּוֹבָ֖ה עָלֶ֑י/ךָ וְ/צִוְּ/ךָ֥ לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
translation:
  language: te
  text: మరియు యాహ్వే నా ప్రభువైన నీకు, నిన్నుగూర్చి తాను పలికిన మేలంతటి ప్రకారం చేసి, నిన్ను ఇశ్రాయేలుపై నాయకునిగా నియమించినప్పుడు[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిన్ను ఇశ్రాయేలుపై నాయకునిగా ఉండమని ఆజ్ఞాపించినప్పుడు,” లేదా “నాయకత్వ బాధ్యతను నీకు అప్పగించినప్పుడు.” హీబ్రూ క్రియ సాధారణంగా ‘ఆజ్ఞాపించు’ అని అర్థమివ్వగలదు; ఇక్కడ అది నాయకత్వానికి నియమించడం లేదా అధికార బాధ్యత అప్పగించడం అనే భావంలో ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: అప్పుడు
  rationale: భవిష్యత్తులో జరగబోయే సందర్భాన్ని పరిచయం చేసే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున సందర్భార్థక నిర్మాణం ఉంచబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలిపింది.
- source_word: לַאדֹנִי
  choice: నా ప్రభువైన నీ
  rationale: అబీగయీలు దావీదును గౌరవంగా సంబోధిస్తున్న భావాన్ని తెలుగులో సహజంగా చూపుతుంది; తరువాతి ద్వితీయ పురుష ఏకవచన సూచనతో వాక్యాన్ని సాఫీగా కలుపుతుంది.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר אֶת־הַטּוֹבָה עָלֶיךָ
  choice: నీ గురించి చెప్పిన మేలంతటినీ
  rationale: דבר అనే సాధారణ ‘చెప్పు/మాట్లాడు’ క్రియను ‘వాగ్దానం చేయు’గా మరీ స్పష్టీకరించకుండా, הַטּוֹבָה యొక్క అనుకూలమైన విషయార్థాన్ని ‘మేలు’గా నిలుపుతుంది.
- source_word: וְצִוְּךָ
  choice: నిన్ను ... నియమించినప్పుడు
  rationale: צוה సాధారణంగా ‘ఆజ్ఞాపించు’ అని అర్థమిచ్చినా, לְנָגִידతో కూడిన ఈ నిర్మాణంలో అధికార స్థానానికి నియమించడం లేదా బాధ్యత అప్పగించడం అనే సందర్భార్థాన్ని ‘నియమించు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְנָגִיד עַל־יִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై నాయకునిగా
  rationale: נָגִיד అధికారమున్న నాయకుణ్ణి సూచిస్తుంది. ‘నాయకుడు’ ఆధునికంగా, సహజంగా ఉండి, עַל సూచించే అధికార సంబంధాన్ని ‘పై’ నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఉపయోగించింది.
- issue: దేవుడు పలికిన ‘మేలు’ వాగ్దానమా లేక సాధారణంగా చెప్పిన అనుకూల విషయమా
  choice: చెప్పిన మేలు
  alternative: వాగ్దానం చేసిన మేలు
  rationale: సందర్భం దైవ వాగ్దానాన్ని సూచించినప్పటికీ, మూలంలోని דבר స్వయంగా ‘వాగ్దానం చేయు’ అని తప్పనిసరిగా అర్థం కాదు. కాబట్టి మూలంలోని విస్తృతతను ప్రధాన పాఠంలో నిలిపింది.
- issue: וְצִוְּךָ యొక్క అధికార సంబంధిత భావం
  choice: నియమించినప్పుడు
  alternative: నిన్ను నాయకునిగా ఉండమని ఆజ్ఞాపించినప్పుడు / బాధ్యత అప్పగించినప్పుడు
  rationale: నాయకత్వ పదవితో కూడిన సందర్భంలో ‘నియమించు’ అనేది ఉద్దేశించిన అధికార నియోగాన్ని సహజంగా తెలియజేస్తుంది; మూలక్రియలోని ‘ఆజ్ఞాపించు/బాధ్యత అప్పగించు’ సాధ్యతను పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది తరువాతి వచనానికి అనుసంధానమైన ఆధీన వాక్యం కావడంతో చివర కామా ఉంచబడింది. ‘నా ప్రభువైన నీ’ అనే నిర్మాణం అబీగయీలు దావీదుతో మాట్లాడుతున్న గౌరవాన్ని, తరువాతి ద్వితీయ పురుష సూచనను సహజంగా కలుపుతుంది.
