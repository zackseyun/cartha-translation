source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע דָּוִ֖ד בַּ/מִּדְבָּ֑ר כִּֽי גֹזֵ֥ז נָבָ֖ל אֶת צֹאנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/004.yaml
  text: David heard in the wilderness that Nabal was shearing his sheep[a].
translation:
  language: te
  text: దావీదు అరణ్యంలో ఉండగా, నాబాలు తన గొర్రెల ఉన్ని కత్తిరిస్తున్నాడని విన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, విస్తృత అర్థంలో, ‘తన మంద.’ హీబ్రూ צֹאן అనే పదం గొర్రెలు, మేకలు వంటి చిన్న పశువులను సమష్టిగా సూచించగలదు; అయితే ఉన్ని కత్తిరించే ఈ సందర్భంలో ‘గొర్రెలు’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నాడు
  rationale: שׁמע క్రియ ఇక్కడ కథనంలోని సాధారణ భూతకాల సంఘటనను తెలియజేస్తుంది; ‘విన్నాడు’ నేరుగా, సహజంగా ఉంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో ఉన్నప్పుడు
  rationale: מִדְבָּר సాధారణంగా ఎడారి ఇసుకప్రాంతాన్ని మాత్రమే కాక జనావాసం తక్కువైన అరణ్య ప్రదేశాన్ని సూచిస్తుంది. ఈ పదబంధం దావీదు వార్త విన్నప్పటి స్థానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי దావీదు విన్న వార్తలోని విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘అని’ దానికి సహజమైన సమానం.
- source_word: גֹזֵז
  choice: ఉన్ని కత్తిరిస్తున్నాడు
  rationale: గొర్రెల సందర్భంలో גזז అంటే ఉన్ని కత్తిరించడం; కృదంత రూపం కొనసాగుతున్న చర్యను సూచిస్తున్నందున ‘కత్తిరిస్తున్నాడు’ అని అనువదించాం.
- source_word: נָבָל
  choice: నాబాలు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶת צֹאנוֹ
  choice: తన గొర్రెలకు
  rationale: צֹאן చిన్న పశువుల మందను సమష్టిగా సూచించవచ్చు; అయితే ఉన్ని కత్తిరించే సందర్భంలో ‘గొర్రెలు’ అత్యంత సహజమైన నిర్దిష్ట అర్థం. తెలుగు వాక్యనిర్మాణంలో ‘గొర్రెలకు ఉన్ని కత్తిరించడం’ సహజంగా ఉంటుంది.
