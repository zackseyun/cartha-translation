- from: దావీదు అరణ్యంలో ఉన్నప్పుడు, నాబాలు తన గొర్రెలకు ఉన్ని కత్తిరిస్తున్నాడని విన్నాడు.[a]
  to: దావీదు అరణ్యంలో ఉండగా, నాబాలు తన గొర్రెల ఉన్ని కత్తిరిస్తున్నాడని విన్నాడు.[a]
  rationale: 'The revision preserves the Hebrew syntax and aspect while correcting the Telugu expression for shearing: the wool is understood as belonging to the sheep, rather than being cut for them. The footnote retains the broader lexical range of צֹאן and removes the misleading dative wording.'
