translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘అరణ్యం’ హీబ్రూ מִדְבָּר యొక్క విస్తృత భౌగోళిక భావాన్ని నిలుపుతుంది; ‘ఉన్ని కత్తిరిస్తున్నాడు’ కొనసాగుతున్న గొర్రెల ఉన్ని కత్తిరింపు చర్యను స్పష్టంగా తెలియజేస్తుంది.
