  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֤קָם אָדָם֙ לִ/רְדָפְ/ךָ֔ וּ/לְ/בַקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וְֽ/הָיְתָה֩ נֶ֨פֶשׁ אֲדֹנִ֜/י צְרוּרָ֣ה בִּ/צְר֣וֹר הַ/חַיִּ֗ים אֵ֚ת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/אֵ֨ת נֶ֤פֶשׁ אֹיְבֶ֨י/ךָ֙ יְקַלְּעֶ֔/נָּה בְּ/ת֖וֹךְ כַּ֥ף הַ/קָּֽלַע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
translation:
  language: te
  text: ఒక మనిషి మిమ్మల్ని తరమడానికి, మీ ప్రాణం తీయడానికి లేచినా, నా ప్రభువు ప్రాణం మీ దేవుడైన యాహ్వేతో సజీవుల మూటలో భద్రంగా కట్టబడి ఉంటుంది[a]. అయితే మీ శత్రువుల ప్రాణాలను ఆయన వడిసెల గూటిలోనుండి విసిరివేస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సజీవుల మూటలో కట్టబడి ఉంటుంది.” హీబ్రూ రూపకం ఏదైనా వస్తువును భద్రపరచడానికి మూటలో గట్టిగా కట్టి ఉంచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూలంలోని క్రియ ప్రత్యేకంగా వడిసెలతో విసరడాన్ని సూచిస్తుంది. ఇది “మూటలో కట్టబడి” ఉండటానికి ఉద్దేశపూర్వకమైన విరుద్ధ చిత్రాన్ని సృష్టిస్తుంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  choice: ఒక మనిషి ... లేచినా
  rationale: వావ్‌తో కూడిన సంపూర్ణ క్రియ ఇక్కడ వరుస కథనాన్ని కాక రాయితీ భావాన్ని తెలియజేస్తుంది; אָדָם ఏకవచనంలోని నిర్దిష్ట పురుష విరోధిని సూచిస్తుంది.
- source_word: לִרְדָפְךָ
  choice: మిమ్మల్ని తరమడానికి
  rationale: శత్రుత్వంతో వెంబడించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּלְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: మీ ప్రాణం తీయడానికి
  rationale: నెఫెష్ ఇక్కడ ఆత్మ అనే తాత్త్విక అర్థంలో కాక ప్రాణం/జీవితం అనే అర్థంలో ఉంది; బకేష్‌తో కలిసి ప్రాణహాని ఉద్దేశాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: נֶפֶשׁ אֲדֹנִי
  choice: నా ప్రభువు ప్రాణం
  rationale: అబీగయీలు దావీదును గౌరవంగా సంబోధించడాన్ని, అలాగే నెఫెష్ యొక్క ప్రాణం అనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  choice: సజీవుల మూటలో భద్రంగా కట్టబడి ఉంటుంది
  rationale: కట్టడం–మూట అనే స్పష్టమైన హీబ్రూ రూపకాన్ని నిలుపుతూ, భద్రపరచడం అనే సందర్భార్థాన్ని పాఠకునికి అర్థమయ్యేలా చేస్తుంది.
- source_word: אֵת יְהוָה אֱלֹהֶיךָ
  choice: మీ దేవుడైన యాహ్వే దగ్గర
  rationale: אֵת ఇక్కడ సహవాసం లేదా సన్నిధిని సూచిస్తుంది. 'దగ్గర' అనేది దేవుని సంరక్షణలో సురక్షితంగా ఉండే రూపకాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; యాహ్వే అనే దైవనామాన్ని నిలుపుతుంది.
- source_word: וְאֵת נֶפֶשׁ אֹיְבֶיךָ
  choice: అయితే మీ శత్రువుల ప్రాణాలను
  rationale: ఏకవచన నెఫెష్ బహువచన శత్రువులతో సమష్టిగా వాడబడింది; తెలుగులో సహజ అంగీకారం కోసం 'ప్రాణాలను' ఉపయోగించబడింది. విరుద్ధతను 'అయితే' స్పష్టం చేస్తుంది.
- source_word: יְקַלְּעֶנָּה
  choice: విసిరినట్టు విసిరివేస్తాడు
  rationale: కלע వడిసెలతో విసరడాన్ని సూచిస్తుంది; తరువాతి వడిసెల రూపకంతో అనుసంధానం నిలిచేలా అనువదించబడింది.
- source_word: בְּתוֹךְ כַּף הַקָּלַע
  choice: వడిసెల ఒడిలోనుంచి
  rationale: כף యొక్క అరచేయి/లోపలి వంపు భావాన్ని, రాయిని ఉంచే వడిసెల మధ్యభాగాన్ని 'ఒడి' అనే సజీవమైన తెలుగు రూపంతో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: దావీదు భద్రతకు, శత్రువుల తొలగింపుకు మధ్యనున్న రూపకాల విరుద్ధత
  choice: మూటలో భద్రంగా కట్టబడటం, వడిసెల నుంచి విసిరివేయబడటం అనే రెండు స్పష్టమైన రూపకాలనూ నిలుపడం
  alternative: దీనిని సాధారణంగా దేవుని రక్షణ మరియు శత్రువుల ఓటమి అని మాత్రమే అనువదించడం; లేదా 'సజీవుల మూట'ను పరలోక నిత్యజీవం గురించిన ప్రత్యక్ష ప్రకటనగా వివరించడం
  rationale: హీబ్రూ వాక్యం దేవుని సంరక్షణను, శత్రువుల తొలగింపును బలమైన భౌతిక రూపకాలతో చెబుతుంది; అది స్పష్టంగా చెప్పని పరలోక సిద్ధాంతాన్ని అనువాదంలో చేర్చకూడదు.
- issue: אָדָם యొక్క లింగం మరియు నిర్దిష్టత
  choice: ఒక మనిషి
  alternative: ఎవరైనా; ఒక వ్యక్తి
  rationale: మూలపాఠం వ్యాకరణపరంగా పుంలింగ ఏకవచనం; సందర్భంలో ఒక పురుష విరోధిని సూచిస్తుంది.
- issue: נֶפֶשׁ యొక్క అర్థం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: ఈ సందర్భంలో లక్ష్యంగా చేసుకున్న జీవితం/ప్రాణాన్ని సూచిస్తుంది; శరీరానికి భిన్నమైన ఆత్మ అనే తరువాతి తాత్త్విక భావాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. 'వడిసెల' వంటి సాంస్కృతికంగా స్థిరపడిన పదంతో మూలంలోని స్పష్టమైన ఆయుధ-రూపకాన్ని నిలిపాం. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో [a], [b]గా ఉంచబడ్డాయి.
