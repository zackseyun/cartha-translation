revisions:
- from: ఒక మనిషి మిమ్మల్ని తరమడానికి, మీ ప్రాణం తీయడానికి లేచినా, నా ప్రభువు ప్రాణం మీ దేవుడైన యాహ్వే దగ్గర సజీవుల మూటలో భద్రంగా కట్టబడి ఉంటుంది[a]. అయితే మీ శత్రువుల ప్రాణాలను ఆయన వడిసెల ఒడిలోనుంచి విసిరినట్టు విసిరివేస్తాడు[b].
  to: ఒక మనిషి మిమ్మల్ని తరమడానికి, మీ ప్రాణం తీయడానికి లేచినా, నా ప్రభువు ప్రాణం మీ దేవుడైన యాహ్వేతో సజీవుల మూటలో భద్రంగా కట్టబడి ఉంటుంది[a]. అయితే మీ శత్రువుల ప్రాణాలను ఆయన వడిసెల గూటిలోనుండి విసిరివేస్తాడు[b].
  rationale: వడిసెలతో విసిరే హీబ్రూ క్రియను నేరుగా అనువదించి, మూలంలోని సంరక్షణ–తొలగింపు రూపకాల విరుద్ధతను స్పష్టంగా నిలిపాం. ‘యాహ్వేతో’ అనే రూపం మూలంలోని సహవాస/సంబంధ భావాన్ని మరింత సమీపంగా వ్యక్తం చేస్తుంది. ఇతర పదజాలం, గౌరవసంబోధన, మరియు పాదసూచికల అర్థం మార్చలేదు.
