  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שֵׁ֤ם הָ/אִישׁ֙ נָבָ֔ל וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ אֲבִגָ֑יִל וְ/הָ/אִשָּׁ֤ה טֽוֹבַת שֶׂ֨כֶל֙ וִ֣/יפַת תֹּ֔אַר וְ/הָ/אִ֥ישׁ קָשֶׁ֛ה וְ/רַ֥ע מַעֲלָלִ֖ים וְ/ה֥וּא כ/לב/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: The man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
translation:
  language: te
  text: ఆ మనిషి పేరు నాబాలు, అతని భార్య పేరు అబీగయీలు. ఆ స్త్రీ మంచి వివేకం గలది, చూడటానికి అందమైనది. అయితే ఆ మనిషి కఠిన స్వభావం గలవాడు, అతని ప్రవర్తన చెడ్డది; అతడు కాలేబీయుడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ సాంప్రదాయ పఠనం ప్రకారం ‘కాలేబీయుడు,’ అంటే కాలేబు వంశానికి చెందినవాడు. అయితే లిఖితరూపం అసాధారణంగా ఉండడంతో దీనిని వేరుగా చదివే అవకాశం ఉందని కొందరు భావిస్తారు.
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  choice: నాబాలు
  rationale: వ్యక్తి పేరు; తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా హీబ్రూ పేరును లిప్యంతరీకరించాం.
- source_word: אֲבִגָיִל
  choice: అబీగయీలు
  rationale: వ్యక్తి పేరు; హీబ్రూ పేరును సహజమైన తెలుగు బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: טוֹבַת שֶׂכֶל
  choice: మంచి వివేకం గలది
  rationale: ఈ పదబంధం మంచి అవగాహన, విచక్షణ లేదా వివేకాన్ని సూచిస్తుంది; మూలంలోని ప్రశంసాత్మక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וִיפַת תֹּאַר
  choice: చూడటానికి అందమైనది
  rationale: శారీరక రూపసౌందర్యాన్ని సూచించే పదబంధం; ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తమవుతుంది.
- source_word: קָשֶׁה
  choice: కఠినుడు
  rationale: నాబాలు స్వభావంలోని కాఠిన్యాన్ని, ఇతరులతో వ్యవహరించే తీరులోని మొరటుదనాన్ని సూచిస్తుంది.
- source_word: רַע מַעֲלָלִים
  choice: తన క్రియల్లో చెడ్డవాడు
  rationale: מַעֲלָלִים అనేది క్రియలు, ప్రవర్తన లేదా ఆచరణలను సూచిస్తుంది; మూలపాఠానికి దగ్గరగా ఉండేందుకు ‘క్రియల్లో’ అని ఇచ్చాం.
- source_word: כלבו
  choice: కాలేబీయుడు
  rationale: సాంప్రదాయ పఠనం దీనిని కాలేబు వంశం లేదా గోత్రానికి చెందినవాడనే జాతి/వంశ సూచనగా గ్రహిస్తుంది; అసాధారణ లిఖితరూపాన్ని పాదసూచికలో పేర్కొన్నాం.
theological_decisions:
- issue: וְהוּא כלבו అనే అసాధారణ రూపం యొక్క అర్థం
  choice: అతడు కాలేబీయుడు
  alternative: కాలేబు వంశానికి చెందినవాడు; లేదా లిఖితరూపాన్ని వేరుగా చదివే అవకాశం
  rationale: సందర్భానికీ సాంప్రదాయ పఠనానికీ ‘కాలేబీయుడు’ బాగా సరిపోతుంది. అయినా హీబ్రూ లిఖితరూపం అసాధారణంగా ఉన్నందున పాఠ్య సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. స్త్రీ గుణాలకూ పురుషుని స్వభావానికీ మధ్య మూలంలోని వ్యత్యాసాన్ని ‘అయితే’ ద్వారా స్పష్టంగా నిలిపాం.
