  text: כֹּה יַעֲשֶׂ֧ה אֱלֹהִ֛ים לְ/אֹיְבֵ֥י דָוִ֖ד וְ/כֹ֣ה יֹסִ֑יף אִם אַשְׁאִ֧יר מִ/כָּל אֲשֶׁר ל֛/וֹ עַד הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
translation:
  language: te
  text: నేను తెల్లవారేసరికి అతనికి చెందిన వారందరిలో ఒక్క మగవాణ్ణి అయినా మిగిలిస్తే, దేవుడు దావీదు శత్రువులకు[a] ఇలా చేసి, ఇంకా ఎక్కువ చేయుగాక!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొంతమంది వ్యాఖ్యాతల అభిప్రాయం ప్రకారం, సాధారణంగా ఇటువంటి ప్రమాణం తనమీదకే శాపాన్ని ఆహ్వానించేది కాబట్టి, ‘దావీదు శత్రువులకు’ అనేది ‘దావీదుకు’ లేదా ‘నాకు’ అనే భావానికి లేఖకులు వాడిన మర్యాదోక్తి కావచ్చు.
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה ... וְכֹה יֹסִיף
  choice: ఇలాగే చేసి, ఇంకా ఎక్కువ చేయుగాక
  rationale: ఇది శాపంతో కూడిన ప్రామాణిక హీబ్రూ ప్రమాణ సూత్రం. తెలుగు పాఠకులకు సహజంగా ఉండేలా చేస్తూనే దాని శాపార్థక బలాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపరీత్యా బహువచనంగా కనిపించినా, క్రియ ఏకవచనంలో ఉంది; ఇక్కడ ప్రమాణంలో ఏకవచన దేవునినే సూచిస్తుంది.
- source_word: לְאֹיְבֵי דָוִד
  choice: దావీదు శత్రువులకు
  rationale: మసొరేటిక్ పాఠంలోని క్లిష్టమైన పదప్రయోగాన్ని సవరించకుండా ప్రధాన పాఠంలో యథాతథంగా నిలిపింది.
- source_word: אִם
  choice: మిగిలిస్తే అలాగే జరగుగాక
  rationale: ప్రమాణ సందర్భంలో אִם షరతును ప్రవేశపెడుతుంది; ముందు పలికిన శాపం ఆ షరతు నెరవేరితే వర్తిస్తుందనే అంతర్లీన భావాన్ని తెలుగులో స్పష్టంగా, కానీ అతిగా వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: אַשְׁאִיר
  choice: నేను మిగిలిస్తే
  rationale: హిఫీల్ రూపానికి ‘మిగిలేలా చేయడం/మిగిలించడం’ అనే ప్రత్యక్ష అర్థం ఉంది. ‘ప్రాణాలతో విడిచిపెడితే’ అనడం కంటే ఇది తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: అతనికి చెందిన వారందరిలో
  rationale: తరువాతి పదబంధం వ్యక్తులను, ముఖ్యంగా మగవారిని, నిర్దేశిస్తున్నందున స్వామ్య భావాన్ని వ్యక్తిగత బహువచనంగా సహజంగా అందిస్తుంది.
- source_word: עַד הַבֹּקֶר
  choice: తెల్లవారేసరికి
  rationale: ఉదయం వరకున్న కాలపరిమితిని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ఒక్క మగవాణ్ణయినా
  rationale: అక్షరార్థంగా ‘గోడమీద మూత్రం పోసేవాడు’ అనే మొరటైన హీబ్రూ నుడికారం మగవాణ్ణి సూచిస్తుంది. ప్రధాన పాఠంలో ఉద్దేశిత వ్యక్తిని స్పష్టంగా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: ప్రమాణ సూత్రంలో మసొరేటిక్ పాఠమైన ‘దావీదు శత్రువులకు’
  choice: ప్రధాన పాఠంలో ‘దావీదు శత్రువులకు’ అని నిలుపడం
  alternative: స్వీయశాప ప్రమాణానికి అనుగుణంగా ‘దావీదుకు’ లేదా ‘నాకు’ అని అంతర్లీనంగా సవరించడం
  rationale: అందించిన WLC పాఠం ‘దావీదు శత్రువులకు’ అని చదువుతుంది. సందర్భపరమైన ఉద్రిక్తతను మౌనంగా పరిష్కరించకుండా ఆ పాఠాన్నే అనువదించి, సాధ్యమైన లేఖకుల మర్యాదోక్తి వివరణను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రమాణంలోని గంభీరమైన శాప స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణం వాడబడింది. మూలంలోని మొరటైన నుడికారాన్ని ప్రధాన పాఠంలో సహజమైన ‘మగవాడు’గా అనువదించి పాదసూచికలో పారదర్శకంగా వివరించింది.
