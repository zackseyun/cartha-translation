id: 1SA.25.32
reference: 1 Samuel 25:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּוִ֖ד לַ/אֲבִיגַ֑ל בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֧ר שְׁלָחֵ֛/ךְ הַ/יּ֥וֹם הַ/זֶּ֖ה לִ/קְרָאתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/032.yaml
  text: David said to Abigail[a], “Blessed be Yahweh, the God of Israel, who sent you this day to meet me.”
translation:
  language: te
  text: 'దావీదు అబీగయీలుతో ఇలా అన్నాడు: “ఈ రోజున[a] నన్ను కలవడానికి నిన్ను పంపిన ఇశ్రాయేలు దేవుడైన యాహ్వే స్తుతింపబడుగాక!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఈ రోజు’; లేదా, ‘నేడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: వరుస కథనంలోని తదుపరి మాటను సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది; హీబ్రూ వావ్‌ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: לַאֲבִיגַל
  choice: అబీగయీలుతో
  rationale: לְ ఇక్కడ మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సూచిస్తుంది; తెలుగులో ‘తో అన్నాడు’ సహజమైన ప్రయోగం.
- source_word: בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: దేవుని గురించిన స్తుతి-ఆశీర్వాద సూత్రాన్ని గౌరవప్రదంగా, సహజంగా వ్యక్తం చేస్తుంది; కేవలం మానవ సంతోషాన్ని సూచించే ‘ధన్యుడు’ అనే భావానికి పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన విశేషణాత్మక రూపంలో చూపి, యాహ్వేను ఇశ్రాయేలు దేవునిగా గుర్తిస్తుంది.
- source_word: שְׁלָחֵךְ
  choice: నిన్ను పంపిన
  rationale: స్త్రీ ఏకవచన కర్మప్రత్యయాన్ని ‘నిన్ను’గా, పూర్తయిన కార్యాన్ని సంబంధార్థక భూతకాల రూపంగా స్పష్టంగా అందిస్తుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజున
  rationale: మూలంలోని ‘ఈ రోజు’ అనే నిర్దిష్ట కాలవ్యక్తీకరణను గంభీరత కోల్పోకుండా తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: לִקְרָאתִי
  choice: నన్ను కలవడానికి
  rationale: అబీగయీలు పంపబడిన ఉద్దేశాన్ని సందర్భానుసారంగా స్పష్టమైన, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరిస్తుంది.
- issue: בָּרוּךְ అనే దేవుని స్తుతి సూత్రం
  choice: స్తుతింపబడుగాక
  alternative: ధన్యుడు / ఆశీర్వదింపబడుగాక
  rationale: ఇది దేవుడు మరొకరి నుండి ఆశీర్వాదం పొందాలని చెప్పడం కంటే ఆయనను స్తుతిస్తూ ఘనపరిచే దైవస్తుతి సూత్రం. ఎంపిక చేసిన రూపం ఆ ప్రయోగార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన భాగంలో సరళతను, దావీదు పలికిన దైవస్తుతిలో గౌరవప్రదమైన గంభీరతను కాపాడింది. ఆంగ్ల సంప్రదింపు పాఠంలోని పాదసూచిక గుర్తు విషయానికి సరిపడే ‘ఈ రోజున’ తరువాత ఉంచబడింది.
