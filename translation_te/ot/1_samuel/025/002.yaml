  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. స్థల నామాలు తెలుగు బైబిల్ వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి; మూలంలోని భావసందిగ్ధతలు పాదసూచికల్లో నిలుపబడ్డాయి.
