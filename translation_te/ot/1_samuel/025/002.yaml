base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: There was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
translation:
  language: te
  text: మాయోనులో ఒక మనిషి ఉండేవాడు; అతని వ్యాపారం కర్మెలులో ఉండేది[a]. అతడు చాలా ధనవంతుడు[b]. అతనికి మూడు వేల గొర్రెలు, వెయ్యి మేకలు ఉండేవి. అతడు కర్మెలులో తన గొర్రెల బొచ్చు కత్తిరిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని పని/ఆస్తి కర్మెలులో ఉండేది.’ హీబ్రూ పదం ఒక వ్యక్తి పని, వ్యవహారాలు లేదా ఆస్తిని విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘అతడు చాలా గొప్పవాడు’; అంటే సామాజికంగా లేదా ఆర్థికంగా ప్రముఖుడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ఒక మనిషి
  rationale: కథనంలో నిర్దిష్టంగా పరిచయం కాని వ్యక్తిని సూచించే సాధారణ హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּמָעוֹן
  choice: మాయోనులో
  rationale: స్థల నామాన్ని అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: מַעֲשֵׂהוּ
  choice: అతని వ్యాపారం
  rationale: ఈ పదం పని, కార్యకలాపాలు, వ్యవహారాలు లేదా ఆస్తిని సూచించగలదు. పశుసంపద నేపథ్యాన్ని బట్టి ‘వ్యాపారం’ సహజంగా ఉంది; విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בַכַּרְמֶל
  choice: కర్మెలులో
  rationale: ఇక్కడ ఇది సాధారణ నామవాచకం కాదు, స్థల నామం; అందువల్ల లిప్యంతరీకరించబడింది.
- source_word: הָאִישׁ גָּדוֹל מְאֹד
  choice: అతడు చాలా ధనవంతుడు
  rationale: అక్షరార్థంగా ‘చాలా గొప్పవాడు’ అయినా, వెంటనే పేర్కొన్న విస్తారమైన పశుసంపద ఈ సందర్భంలో ఆర్థిక స్థితిని ప్రధానంగా సూచిస్తుంది.
- source_word: וְלוֹ צֹאן שְׁלֹשֶׁת אֲלָפִים וְאֶלֶף עִזִּים
  choice: అతనికి మూడు వేల గొర్రెలు, వెయ్యి మేకలు ఉండేవి
  rationale: స్వామ్యాన్ని తెలిపే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్య వాక్యంగా అందించింది.
- source_word: וַיְהִי בִּגְזֹז אֶת צֹאנוֹ
  choice: అతడు తన గొర్రెల బొచ్చు కత్తిరిస్తున్నాడు
  rationale: కొనసాగుతున్న గొర్రెల బొచ్చు కత్తిరింపు సందర్భాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
