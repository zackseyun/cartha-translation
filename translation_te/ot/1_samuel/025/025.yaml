  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. అబీగయీలు దావీదుతో మాట్లాడే వినయాన్ని ‘నా ప్రభువా,’ ‘మీ దాసినైన నేను’ అనే రూపాలతో నిలిపాం. హీబ్రూ హృదయ నుడికారాన్ని తెలుగు ‘మనసులో పెట్టుకోవద్దు’ ద్వారా, నాబాలు పేరుతో ఉన్న పదప్రయోగాన్ని పాదసూచికతో స్పష్టం చేశాం.
