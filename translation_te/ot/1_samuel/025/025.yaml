language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל נָ֣א יָשִׂ֣ים אֲדֹנִ֣/י אֶת לִבּ֡/וֹ אֶל אִישׁ֩ הַ/בְּלִיַּ֨עַל הַ/זֶּ֜ה עַל נָבָ֗ל כִּ֤י כִ/שְׁמ/וֹ֙ כֶּן ה֔וּא נָבָ֣ל שְׁמ֔/וֹ וּ/נְבָלָ֖ה עִמּ֑/וֹ וַֽ/אֲנִי֙ אֲמָ֣תְ/ךָ֔ לֹ֥א רָאִ֛יתִי אֶת נַעֲרֵ֥י אֲדֹנִ֖/י אֲשֶׁ֥ר שָׁלָֽחְתָּ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
translation:
  language: te
  text: నా ప్రభువా, దయచేసి ఈ పనికిమాలిన మనిషిని, నాబాలును[a], మనసులో పెట్టుకోవద్దు. అతని పేరు ఎలాంటిదో అతడూ అలాంటివాడే. నాబాలు అతని పేరు; మూర్ఖత్వం అతనితో ఉంది. అయితే మీ దాసినైన నేను, నా ప్రభువైన మీరు పంపిన యువకులను చూడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నాబాలు’ అనే పేరు, ‘మూర్ఖుడు’ లేదా ‘మూర్ఖత్వం’ అనే అర్థమిచ్చే హీబ్రూ పదంతో ముడిపడి ఉంది. అబీగయీలు ఇక్కడ ఉద్దేశపూర్వకంగా పదప్రయోగం చేస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂים אֶת־לִבּוֹ אֶל
  choice: మనసులో పెట్టుకోవద్దు
  rationale: హృదయాన్ని ఒకరి వైపు ఉంచడం అనే హీబ్రూ నుడికారంలోని అంతరంగ శ్రద్ధ భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ‘తీవ్రంగా పట్టించుకోవద్దు/మనసుకు తీసుకోవద్దు’ అనే అర్థాన్ని ఇస్తుంది.
- source_word: אִישׁ הַבְּלִיַּעַל
  choice: పనికిమాలిన మనిషి
  rationale: ఇక్కడ בְּלִיַּעַל వ్యక్తినామం కాదు; నీచత్వం లేదా విలువలేమిని సూచించే నైతిక వర్ణన. ‘పనికిమాలిన మనిషి’ మూలంలోని అవమానకర భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: נָבָל
  choice: నాబాలు
  rationale: ఇది వ్యక్తినామం కాబట్టి లిప్యంతరీకరించబడింది. పేరుకూ ‘మూర్ఖత్వం’ అనే భావానికీ ఉన్న హీబ్రూ పదప్రయోగం ప్రధాన వాక్యంలోనూ పాదసూచికలోనూ నిలుపబడింది.
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא
  choice: అతని పేరు ఎలాంటిదో అతడూ అలాంటివాడే
  rationale: పేరుకూ వ్యక్తిత్వానికీ మధ్య మూలపాఠం చూపే సామెతలాటి సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּנְבָלָה עִמּוֹ
  choice: మూర్ఖత్వం అతనితోనే ఉంది
  rationale: נְבָלָה అనే పదానికి మూర్ఖత్వం, అవమానకర ప్రవర్తన అనే భావాలు ఉండవచ్చు. సమీపంలోని ‘నాబాలు’ అనే పేరుతో ఉన్న పదప్రయోగం దృష్ట్యా ‘మూర్ఖత్వం’ తగినది; ‘అతనితోనే ఉంది’ అనే రూపం మూలంలోని עִמּוֹ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: אֲמָתְךָ
  choice: మీ దాసినైన నేను
  rationale: హీబ్రూ పదం స్త్రీ దాసిని ప్రత్యేకంగా సూచిస్తుంది. ‘దాసినైన నేను’ అబీగయీలు పలికే వినయపూర్వక స్వీయసంబోధనను, స్త్రీలింగాన్ని రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: נַעֲרֵי
  choice: యువకులను
  rationale: נַעַר యువకులను లేదా యువ పరిచారకులను సూచించగలదు. ఈ సందర్భంలో వారు దావీదు పంపిన ప్రతినిధులైనా, ‘యువకులు’ మూలపదానికి దగ్గరగా ఉంటుంది.
- source_word: אֲדֹנִי
  choice: నా ప్రభువా / నా ప్రభువైన మీరు
  rationale: అబీగయీలు దావీదును గౌరవంగా సంబోధిస్తోంది. తెలుగు సందర్భానుసారం మొదట సంబోధన రూపం, తరువాత వినయపూర్వక గౌరవ రూపం వాడబడ్డాయి.
