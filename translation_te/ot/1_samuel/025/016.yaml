translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. ‘గోడ’ అనే మూల రూపకం నిలుపబడింది; צאן యొక్క విస్తృత సమూహార్థం కోసం ‘మంద’ వాడబడింది.
