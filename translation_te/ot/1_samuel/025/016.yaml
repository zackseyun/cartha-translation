  text: They were a wall around us both by night and by day[b][a], all the days we were with them tending the flock.
translation:
  language: te
  text: మేము వారితో ఉండి మందను కాస్తున్న రోజులన్నిటిలో, వారు రాత్రింబగళ్లు మా చుట్టూ గోడగా ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మాపై గోడగా’; సందర్భంలో వారు రక్షణగా మమ్మల్ని చుట్టుముట్టారని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: గోడలా
  rationale: ‘గోడ’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, రక్షణ అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָיוּ
  choice: ఉన్నారు
  rationale: ఇక్కడ היה క్రియ గతకాలంలో కొనసాగిన స్థితిని తెలిపే సంధానక్రియగా ఉంది.
- source_word: עָלֵינוּ
  choice: మా చుట్టూ
  rationale: על యొక్క సాధారణ అర్థం ‘మాపై’ అయినా, ‘గోడ’తో కలిసినప్పుడు రక్షణగా చుట్టుముట్టిన భావం సందర్భానికి తగినది.
- source_word: גַּם לַיְלָה גַּם יוֹמָם
  choice: రాత్రింబగళ్లు
  rationale: రాత్రి, పగలు రెండింటిలోనూ నిరంతరంగా ఉన్న రక్షణను సహజమైన ఆధునిక తెలుగు ప్రయోగం వ్యక్తం చేస్తుంది.
- source_word: כָּל יְמֵי
  choice: రోజులన్నిటిలో
  rationale: మూలంలోని కాలవ్యాప్తిని సన్నిహితంగా నిలుపుతుంది.
- source_word: הֱיוֹתֵנוּ עִמָּם
  choice: మేము వారితో కలిసి … ఉన్న
  rationale: ప్రత్యయంతో కూడిన infinitive construct తెలిపే కాలపరిస్థితిని తెలుగులో సహజమైన ఉపవాక్యంగా అందిస్తుంది.
- source_word: רֹעִים
  choice: మేపిన
  rationale: רעה ఇక్కడ పశుమందను కాయడం లేదా మేపడం అనే కార్యాన్ని సూచిస్తుంది; ‘మేపిన’ సందర్భంలో సహజంగా ఉంది.
- source_word: הַצֹּאן
  choice: మందను
  rationale: צאן గొర్రెలు, మేకలు రెండింటినీ కలుపుకోగల సమూహవాచకం; ‘మంద’ దాని విస్తృతిని నిలుపుతుంది.
