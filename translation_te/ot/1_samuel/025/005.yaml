translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూలో ‘దావీదు’, ‘యువకులు’ పునరుక్తిని వాక్య నిర్మాణంలో నిలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న క్షేమాభివాద పదబంధం వెంట ఉంచాం.
