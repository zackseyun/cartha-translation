source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח דָּוִ֖ד עֲשָׂרָ֣ה נְעָרִ֑ים וַ/יֹּ֨אמֶר דָּוִ֜ד לַ/נְּעָרִ֗ים עֲל֤וּ כַרְמֶ֨לָ/ה֙ וּ/בָאתֶ֣ם אֶל נָבָ֔ל וּ/שְׁאֶלְתֶּם ל֥/וֹ בִ/שְׁמִ֖/י לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
translation:
  language: te
  text: దావీదు పదిమంది యువకులను పంపాడు. దావీదు ఆ యువకులతో, “మీరు కర్మెలుకు వెళ్లి నాబాలు దగ్గరకు వెళ్లండి. నా పేరుతో అతని క్షేమం విచారించండి.[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా పేరుతో అతని క్షేమం గురించి అడగండి”; అంటే, శాంతి-క్షేమాల అభివాదంతో అతని బాగోగులు విచారించండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: కథన సందర్భంలో שׁלח తెలిపే సాధారణ చర్యను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: עֲשָׂרָה נְעָרִים
  choice: పదిమంది యువకులు
  rationale: נְעָרִים అనే పదం సందర్భానుసారం యువకులు లేదా సేవకులు అని సూచించగలదు. ఇక్కడ వారి సేవక హోదాను అనవసరంగా నిర్దిష్టం చేయకుండా ప్రాథమిక అర్థాన్ని నిలుపుతుంది.
- source_word: עֲלוּ כַרְמֶלָה
  choice: కర్మెలుకు వెళ్లండి
  rationale: עלה లోని ‘పైకి వెళ్లడం’ భావం ప్రయాణ దిశ లేదా ఎత్తును సూచించవచ్చు; గమ్యాన్ని సూచించే ה־ను కలిపి సహజ తెలుగులో ‘కర్మెలుకు వెళ్లండి’ అని ఇచ్చాం.
- source_word: וּבָאתֶם אֶל נָבָל
  choice: నాబాలు దగ్గరకు వెళ్లండి
  rationale: בוא అక్షరార్థంగా ‘రండి/చేరండి’ అయినా, దావీదు పంపుతున్నవారి దృష్టిలో తెలుగులో ‘దగ్గరకు వెళ్లండి’ అనడం సహజం.
- source_word: וּשְׁאֶלְתֶּם לוֹ ... לְשָׁלוֹם
  choice: అతని క్షేమం అడగండి
  rationale: ఈ సందర్భంలో שאל ... לשלום అనేది ఒకరి శాంతి, క్షేమం లేదా బాగోగులు విచారించే అభివాద ప్రయోగం. ‘క్షేమం అడగండి’ దాని సందర్భార్థాన్ని సహజంగా అందిస్తుంది; అక్షరార్థపు ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: בִשְׁמִי
  choice: నా పేరుతో
  rationale: హీబ్రూ పదబంధంలోని ‘నా పేరులో/నా పేరుతో’ అనే ప్రతినిధిత్వ భావాన్ని నేరుగా నిలుపుతుంది.
