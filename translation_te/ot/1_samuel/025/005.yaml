revisions:
- from: దావీదు పదిమంది యువకులను పంపాడు. దావీదు ఆ యువకులతో, “మీరు కర్మెలుకు వెళ్లి నాబాలు దగ్గరకు వెళ్లండి. నా పేరుతో అతని క్షేమం అడగండి.[a]” అని చెప్పాడు.
  to: దావీదు పదిమంది యువకులను పంపాడు. దావీదు ఆ యువకులతో, “మీరు కర్మెలుకు వెళ్లి నాబాలు దగ్గరకు వెళ్లండి. నా పేరుతో అతని క్షేమం విచారించండి.[a]” అని చెప్పాడు.
  rationale: The revision preserves the Hebrew greeting formula’s sense—an inquiry after Nabal’s welfare made in David’s name—while using idiomatic modern Telugu. The footnote now gives a viable alternative and explains the greeting force without introducing an abstract sense of “peace.”
