  text: וְ/הָיָ֞ה הִ֣יא רֹכֶ֣בֶת עַֽל הַ/חֲמ֗וֹר וְ/יֹרֶ֨דֶת֙ בְּ/סֵ֣תֶר הָ/הָ֔ר וְ/הִנֵּ֤ה דָוִד֙ וַ/אֲנָשָׁ֔י/ו יֹרְדִ֖ים לִ/קְרָאתָ֑/הּ וַ/תִּפְגֹּ֖שׁ אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
translation:
  language: te
  text: ఆమె గాడిదపై స్వారీ చేస్తూ, కొండ చాటున[a] దిగిపోతుండగా, ఇదిగో, దావీదు మరియు అతని మనుషులు ఆమెను కలవడానికి దిగివస్తున్నారు; ఆమె వారిని కలుసుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొండకు అవతల దాగి ఉన్న వైపున.” హీబ్రూ పదబంధం కొండలో కనబడకుండా ఉండే లేదా ఆశ్రయం కలిగించే ప్రదేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הִיא
  choice: ఆమె … దిగిపోతుండగా
  rationale: వావ్ + היה కథనంలో పరిస్థితిని పరిచయం చేస్తుంది. తెలుగులో సహజమైన కాలసంబంధ ఉపవాక్యంతో దాని కథన, కాల భావాలను వ్యక్తం చేశాం.
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  choice: గాడిదమీద స్వారీ చేస్తూ
  rationale: רכב అంటే స్వారీ చేయడం; חמור సాధారణంగా గాడిదను సూచిస్తుంది. ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְיֹרֶדֶת
  choice: దిగిపోతుండగా
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న చర్యను సూచిస్తుంది; తెలుగు రూపం ఆ నిరంతర భావాన్ని నిలుపుతుంది.
- source_word: בְּסֵתֶר הָהָר
  choice: కొండ చాటున
  rationale: סתרలో దాగిన, కప్పబడిన, కనబడని ప్రదేశం అనే భావాలున్నాయి. ‘కొండ చాటున’ భౌగోళిక సందర్భంలో ఆ భావాన్ని సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: הנה అకస్మాత్తుగా దృష్టిని కొత్త పరిణామంపైకి మళ్లిస్తుంది. ‘ఇదిగో’ దాని ప్రత్యక్ష, సజీవ కథన బలాన్ని నిలుపుతుంది.
- source_word: יֹרְדִים לִקְרָאתָהּ
  choice: ఆమెకు ఎదురుగా దిగివస్తున్నారు
  rationale: ירד దిగడాన్ని, לקראת ఆమె వైపుగా ఎదురుపడేలా కదలడాన్ని సూచిస్తాయి. ఉద్దేశపూర్వకంగా ఆమెను కలవడానికి వచ్చారని అవసరానికి మించి చెప్పకుండా ఈ రూపం దిశను తెలియజేస్తుంది.
- source_word: וַתִּפְגֹּשׁ אֹתָם
  choice: ఆమె వారిని కలుసుకుంది
  rationale: פגש అంటే కలుసుకోవడం లేదా ఎదురుపడడం. ఇక్కడ సరళమైన కథనానికి ‘కలుసుకుంది’ సహజమైన ఎంపిక.
