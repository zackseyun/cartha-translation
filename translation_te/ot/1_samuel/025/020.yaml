translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని సజీవ దృష్టి-ఆకర్షణ సూచకాన్ని నిలిపాం.
