revisions:
- from: వారు అతని తలను నరికి, అతని యుద్ధ సామగ్రిని తీసివేశారు. ఆ శుభవార్తను తమ విగ్రహాల మందిరాలకు, ప్రజలకు ప్రకటించడానికి ఫిలిష్తీయుల దేశమంతటా దూతలను పంపారు.
  to: వారు అతని తలను నరికి వేశారు, అతని యుద్ధ సామగ్రిని తీసివేశారు. ఆ శుభవార్తను వారి విగ్రహాల మందిరానికీ ప్రజలకూ ప్రకటించడానికి, ఫిలిష్తీయుల దేశమంతటా దూతలను పంపారు.
  rationale: The revision corrects the singular number of the cultic ‘house’ and makes the decapitation explicit, while retaining the draft’s sound rendering of military equipment, the broad territorial scope, and the Philistines’ triumphal announcement.
