id: 1SA.31.9
reference: 1 Samuel 31:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּכְרְתוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יַּפְשִׁ֖יטוּ אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְּלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר בֵּ֥ית עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
translation:
  language: te
  text: వారు అతని తలను నరికి వేశారు, అతని యుద్ధ సామగ్రిని తీసివేశారు. ఆ శుభవార్తను వారి విగ్రహాల మందిరానికీ ప్రజలకూ ప్రకటించడానికి, ఫిలిష్తీయుల దేశమంతటా దూతలను పంపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ
  choice: అతని తలను నరికి
  rationale: כרת అనే క్రియకు ‘నరికివేయడం’ అనే భావం ఉంది; ‘అతని తల’ కర్మగా ఉన్నందున తెలుగు సహజ ప్రయోగమైన ‘తలను నరికి’ స్పష్టంగా సరిపోతుంది.
- source_word: וַיַּפְשִׁיטוּ אֶת־כֵּלָיו
  choice: అతని యుద్ధ సామగ్రిని తీసివేశారు
  rationale: פשׁט అంటే ఒంటిమీద ఉన్నదాన్ని ఒలిచివేయడం లేదా తీసివేయడం. כֵּלָיוకు ఆయుధాలు, కవచం, సామగ్రి అనే విస్తృత అర్థాలు ఉండగలవు; యుద్ధ సందర్భంలో ‘యుద్ధ సామగ్రి’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: וַיְשַׁלְּחוּ
  choice: దూతలను పంపారు
  rationale: మూలంలో కేవలం ‘పంపారు’ అని ఉన్నా, దేశమంతటా వార్త ప్రకటించడం అనే సందర్భం పంపబడినవారు దూతలని సూచిస్తుంది; తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు ‘దూతలను’ స్పష్టీకరించబడింది.
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: ఫిలిష్తీయుల దేశమంతటా
  rationale: סָבִיב ఇక్కడ అన్ని వైపులా వ్యాపించిన పరిధిని సూచిస్తుంది; ‘దేశమంతటా’ ఆధునిక తెలుగులో సహజంగా ఆ పంపిణీ భావాన్ని అందిస్తుంది.
- source_word: לְבַשֵּׂר
  choice: ఆ శుభవార్తను ... ప్రకటించడానికి
  rationale: בשר యొక్క పీయేల్ రూపం శుభవార్త లేదా విజయవార్త ప్రకటించడాన్ని సూచిస్తుంది. ఇది ఫిలిష్తీయుల దృష్టిలో శుభవార్త అనే సందర్భార్థం; కథకుని నైతిక సమ్మతిని సూచించదు.
- source_word: בֵּית עֲצַבֵּיהֶם
  choice: తమ విగ్రహాల మందిరాలకు
  rationale: בֵּית అక్షరార్థంగా ‘ఇల్లు’ అయినా ఆరాధనా సందర్భంలో మందిరం లేదా ఆలయాన్ని సూచిస్తుంది; עֲצַבִּים విగ్రహాలు. బహువచన స్వామ్య నిర్మాణాన్ని తెలుగులో సహజంగా ‘విగ్రహాల మందిరాలకు’ అని ఇచ్చాం.
- source_word: וְאֶת־הָעָם
  choice: ప్రజలకు
  rationale: ప్రకటనకు సంబంధించిన రెండవ గ్రాహక వర్గంగా ‘ప్రజలు’ ఉన్నారు; ముందున్న לְבַשֵּׂרతో సంబంధాన్ని తెలుగులో ‘ప్రజలకు ప్రకటించడానికి’ సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఫిలిష్తీయుల ఆరాధనా స్థలాలు, ప్రతిమలకు వాడిన పదాలు
  choice: విగ్రహాల మందిరాలు
  alternative: వారి ప్రతిమల ఇళ్లు
  rationale: עֲצַבִּיםకు ‘విగ్రహాలు’ లెక్సికల్‌గా సముచితం; בֵּית ఆరాధనా సందర్భంలో మందిరాన్ని సూచిస్తుంది. ఈ అనువాదం ఆ దేవతల వాస్తవికతను సమర్థించకుండా మూలంలోని ఆరాధనా సందర్భాన్ని తెలియజేస్తుంది.
- issue: בשרను శుభవార్తగా అనువదించడం
  choice: శుభవార్త
  alternative: వార్త
  rationale: పీయేల్ రూపం విజయాన్ని సంతోషకరమైన వార్తగా ప్రకటించే భావాన్ని కలిగిస్తుంది. ఇక్కడ ‘శుభ’ అనేది ఫిలిష్తీయుల దృష్టికోణాన్ని సూచిస్తుంది, ధార్మిక సువార్త అనే ప్రత్యేకార్థాన్ని కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘కవచం’ కంటే మూలంలోని כֵּלִים విస్తృతిని నిలుపుకోవడానికి ‘యుద్ధ సామగ్రి’ ఎంచుకోబడింది. వివరణ అవసరమైన పాఠాంతరం లేకపోవడంతో పాదటిప్పణులు ఇవ్వలేదు.
