  yaml_path: translation/ot/1_samuel/031/003.yaml
  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
translation:
  language: te
  text: సౌలుకు వ్యతిరేకంగా యుద్ధం తీవ్రమైంది. విలుకాండ్రు అతనిని కనుగొన్నారు; వారి వల్ల అతడు ఎంతో గాయపడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విలుకాండ్ర వల్ల అతడు తీవ్రమైన వేదనకు లేదా కలవరానికి గురయ్యాడు.” ఇక్కడి హెబ్రీ క్రియ కష్టమైనది; అది స్పష్టమైన శారీరక గాయం కాకుండా తీవ్రమైన నొప్పి, వణుకు లేదా వేదనను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאוּל
  choice: సౌలుకు వ్యతిరేకంగా యుద్ధం తీవ్రమైంది
  rationale: כבד అనే క్రియ యొక్క ‘భారమైంది’ అనే మూలచిత్రం ఇక్కడ యుద్ధం తీవ్రంగా మారి సౌలుపై బలంగా పడిందనే భావాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘తీవ్రమైంది’ ఆ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּמְצָאֻהוּ
  choice: అతణ్ణి సమీపించారు
  rationale: מצא అక్షరార్థంగా ‘కనుగొన్నారు’; యుద్ధ సందర్భంలో విలుకాండ్రు సౌలును చేరుకోవడం లేదా అతని మీదికి రావడం అనే భావం ఉంది. ‘సమీపించారు’ అనేది వారు అతని వద్దకు చేరిన భావాన్ని సహజంగా అందిస్తుంది, కానీ బాణాలు తప్పక తగిలాయని ఈ క్రియలోనే చేర్చదు.
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  choice: విలుకాండ్రు
  rationale: మూలంలోని ‘బాణాలు వేసేవారు, విల్లు గల మనుషులు’ అనే వివరణాత్మక సమాసాన్ని తెలుగులో ‘విలుకాండ్రు’ సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּחֶל מְאֹד מֵהַמּוֹרִים
  choice: వారి వల్ల అతడు ఎంతో గాయపడ్డాడు
  rationale: కష్టమైన ויחל రూపాన్ని సందర్భం మరియు 1 దినవృత్తాంతాలు 10:3లోని సమాంతర వర్ణన దృష్ట్యా శారీరక గాయంగా ప్రధాన పాఠ్యంలో ఇచ్చాం. అయితే అది తీవ్రమైన వేదన, భయం లేదా కలవరాన్ని కూడా సూచించవచ్చు; ఆ నిజమైన అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: וַיָּחֶל అనే కష్టమైన క్రియ శారీరక గాయాన్నా, మానసిక/శారీరక వేదననో సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘ఎంతో గాయపడ్డాడు’
  alternative: ‘విలుకాండ్రను బట్టి అతడు ఎంతో వేదనపడ్డాడు/కలవరపడ్డాడు’
  rationale: విలుకాండ్ర సందర్భం మరియు 1 దినవృత్తాంతాలు 10:3 సమాంతర పాఠ్యం గాయార్థానికి మద్దతిస్తాయి. అయినా హెబ్రీ రూపం స్పష్టంగా ఒక్క అర్థానికే పరిమితం కానందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి. ‘విలుకాండ్రు’ సాధారణంగా అర్థమయ్యే సాహిత్యపదం; మూలంలోని పునరుక్త appositionను సహజమైన తెలుగు కోసం సంక్షిప్తం చేశాం. నిజమైన పదార్థ అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
