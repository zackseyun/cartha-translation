    rationale: The Hebrew verb means 'they found/came upon,' not merely 'saw.' "కనుగొన్నారు" preserves the narrative action.
  - severity: low
    issue: The draft adds "చనిపోయి" in the main text for נֹפְלִים.
    rationale: In this battle context 'fallen' clearly concerns the slain, but the Hebrew retains the image of being fallen. "పడి ఉన్న" preserves that wording and lets the context carry the implication.
  - severity: low
    issue: The draft's "గిల్బోవ" lacks the customary Telugu final vowel for the place name.
    rationale: '"గిల్బోవా" is more natural as a Telugu transliteration of Gilboa.'
