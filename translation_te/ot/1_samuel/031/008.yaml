source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים לְ/פַשֵּׁ֖ט אֶת הַ/חֲלָלִ֑ים וַֽ/יִּמְצְא֤וּ אֶת שָׁאוּל֙ וְ/אֶת שְׁלֹ֣שֶׁת בָּנָ֔י/ו נֹפְלִ֖ים בְּ/הַ֥ר הַ/גִּלְבֹּֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/008.yaml
  text: The next day[a], the Philistines came to strip the slain, and they found Saul and his three sons fallen on Mount Gilboa.
translation:
  language: te
  text: మరుసటి రోజు[a] ఫిలిష్తీయులు హతులైనవారి వస్త్రాలు, ఆయుధాలు తీసుకోవడానికి వచ్చారు. వారు గిల్బోవా పర్వతం మీద పడి ఉన్న సౌలును, అతని ముగ్గురు కుమారులను కనుగొన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హతులైనవారిని దోచుకోవడానికి.’ హీబ్రూ క్రియ యుద్ధంలో హతులైనవారి దుస్తులు లేదా కవచం, ఆయుధాలు తొలగించి తీసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: ఇంతకుముందు వివరించిన యుద్ధం తర్వాతి రోజును సూచించే సహజమైన ఆధునిక తెలుగు కాలవాచకం.
- source_word: לְפַשֵּׁט
  choice: వస్త్రాలను, ఆయుధాలను తీసుకోవడానికి
  rationale: యుద్ధంలో మరణించినవారి మీదున్న దుస్తులు లేదా కవచాలు, ఆయుధాలు తొలగించి స్వాధీనం చేసుకోవడాన్ని ఈ సందర్భంలో క్రియ సూచిస్తుంది; తెలుగులో కేవలం ‘ఒలిచివేయడానికి’ అనడం అసహజంగా లేదా తప్పుగా అర్థమయ్యే అవకాశం ఉన్నందున భావాన్ని స్పష్టంగా వ్యక్తం చేసింది.
- source_word: הַחֲלָלִים
  choice: యుద్ధంలో చనిపోయినవారి
  rationale: యుద్ధంలో హతులైనవారనే సందర్భార్థాన్ని స్పష్టంగా, సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּמְצְאוּ
  choice: వారు చూశారు
  rationale: ఇక్కడ శవాలను కనుగొనడం లేదా ఎదురుగా చూడడం అనే కథనార్థం; సహజమైన తెలుగు కథనంలో ‘చూశారు’ సరళంగా సరిపోతుంది.
- source_word: נֹפְלִים
  choice: చనిపోయి పడి ఉండడం
  rationale: ‘పడిపోయినవారు’ అనే హీబ్రూ యుద్ధచిత్రాన్ని ‘పడి ఉండడం’ ద్వారా నిలుపుతూ, ఈ సందర్భంలో వారు మరణించారనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: గిల్బోవ పర్వతం మీద
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, పర్వతం మీద అనే భౌగోళిక సంబంధాన్ని సహజ తెలుగులో తెలిపింది.
- source_word: שְׁלֹשֶׁת בָּנָיו
  choice: అతని ముగ్గురు కుమారులు
  rationale: సంబంధాన్ని మరియు సంఖ్యను నేరుగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
