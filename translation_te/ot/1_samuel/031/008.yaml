translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, గంభీరమైన కథనశైలిని ఉపయోగించాం. ‘పడిపోయి ఉన్నారు’ అనే అక్షరార్థం తెలుగులో వారు ఇంకా జీవించి ఉండవచ్చనే సందిగ్ధత కలిగించగలదని ‘చనిపోయి పడి ఉండడం’గా స్పష్టం చేశాం; అదే సమయంలో మూలంలోని ‘పడిన’ దృశ్యాన్ని నిలిపాం.
