  text: וַ/יָּשִׂ֨מוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית עַשְׁתָּר֑וֹת וְ/אֶת גְּוִיָּת/וֹ֙ תָּקְע֔וּ בְּ/חוֹמַ֖ת בֵּ֥ית שָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/010.yaml
  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
translation:
  language: te
  text: వారు అతని యుద్ధసామగ్రిని[a] అష్టారోతుల ఆలయంలో[b] ఉంచి, అతని మృతదేహాన్ని బేత్‌షాను ప్రాకారానికి బిగించారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని ఆయుధాలను,’ లేదా మరింత విస్తృతంగా, ‘అతని సామగ్రిని.’ హీబ్రూ పదం వివిధ రకాల సైనిక సామగ్రిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అష్టారోతుల ఇల్లు.’ హీబ్రూలో అక్షరార్థంగా ‘అష్టారోతుల ఇల్లు’; ఇక్కడ అది ఒక ఆలయాన్ని లేదా పుణ్యస్థలాన్ని సూచించవచ్చు. ఈ పేరు హీబ్రూలో బహువచన రూపంలో ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అతని మృతదేహాన్ని బేత్‌షాను ప్రాకారానికి గుచ్చి నిలిపారు.’ హీబ్రూ క్రియకు ‘దింపు,’ ‘గుచ్చు,’ లేదా ‘బిగించు’ అనే అర్థాలు రావచ్చు; దేహాన్ని ఏ విధంగా ప్రదర్శించారో ఖచ్చితంగా చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: ఉంచి
  rationale: שׂוּם అంటే ‘పెట్టు, ఉంచు’ అని సాధారణంగా అర్థం; ఇక్కడ కథన ప్రవాహానికి ‘ఉంచి’ సహజంగా సరిపోతుంది.
- source_word: כֵּלָיו
  choice: అతని యుద్ధసామగ్రిని
  rationale: כְּלִי అనే పదం ఆయుధాలు, కవచం లేదా విస్తృతంగా సామగ్రిని సూచించగలదు. సైనిక సందర్భాన్ని నిలుపుతూ ఏ ఒక్క రకానికీ పరిమితం చేయకుండా ‘యుద్ధసామగ్రి’గా అనువదించబడింది.
- source_word: בֵּית עַשְׁתָּרוֹת
  choice: అష్టారోతు ఆలయంలో
  rationale: בֵּית అక్షరార్థంగా ‘ఇల్లు’; దేవతాపూజా సందర్భంలో ఆలయాన్ని సూచిస్తుంది. עַשְׁתָּרוֹת పేరును తెలుగు లిప్యంతరీకరణలో ‘అష్టారోతు’గా నిలిపాం.
- source_word: גְּוִיָּתוֹ
  choice: అతని మృతదేహాన్ని
  rationale: גְּוִיָּה ఇక్కడ చనిపోయిన శరీరాన్ని సూచిస్తుంది; సందర్భాన్ని స్పష్టంగా తెలియజేయడానికి ‘మృతదేహం’ సహజమైన ఎంపిక.
- source_word: תָּקְעוּ
  choice: బిగించారు
  rationale: תקע అంటే దింపడం, గుచ్చడం లేదా స్థిరంగా బిగించడం కావచ్చు. ప్రదర్శన విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ఫలితాన్ని తెలిపేందుకు ‘బిగించారు’ ఎంచుకున్నాం.
- source_word: בְּחוֹמַת
  choice: ప్రాకారానికి
  rationale: חוֹמָה పట్టణాన్ని చుట్టిన గోడ లేదా ప్రాకారం. תקעతో వచ్చిన ב ఇక్కడ దానికి అమర్చడాన్ని సూచిస్తుంది.
- source_word: בֵּית שָׁן
  choice: బేత్‌షాను
  rationale: స్థలనామాన్ని మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
