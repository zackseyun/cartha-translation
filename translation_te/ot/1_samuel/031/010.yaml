translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆలయం’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ‘యుద్ధసామగ్రి’ మరియు ‘బిగించారు’ మూలంలోని భావ విస్తృతిని కాపాడుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
