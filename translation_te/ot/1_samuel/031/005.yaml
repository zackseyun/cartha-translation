translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ఆయుధాలు మోసేవాడు’ అనే రూపం సైనిక పాత్రను పారదర్శకంగా తెలియజేస్తుంది; ‘ఖడ్గం’ బైబిలు కథనానికి తగిన గంభీరతను నిలుపుతుంది.
