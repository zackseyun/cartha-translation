  yaml_path: translation/ot/1_samuel/031/005.yaml
  text: When his armor-bearer saw that Saul was dead[a], he too fell on his sword and died with him.
translation:
  language: te
  text: సౌలు చనిపోయాడని[a] అతని ఆయుధాలు మోసేవాడు చూసినప్పుడు, అతడు కూడా తన ఖడ్గం మీద పడి, సౌలుతోపాటు చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సౌలు చనిపోయి ఉన్నాడని.’ హీబ్రూ మాటను మృతస్థితి వర్ణనగా గానీ, ఆయుధాలు మోసేవాని చర్యకు ఆధారమైన పూర్తయిన సంఘటనగా గానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: అతని ఆయుధాలు మోసేవాడు
  rationale: ఈ నిర్మాణ పదబంధానికి అక్షరార్థంగా ‘అతని సామగ్రి/ఆయుధాలు మోసేవాడు’ అని అర్థం. ఆధునిక సాధారణ తెలుగులో పాత్రను స్పష్టంగా తెలియజేయడానికి ఈ సహజమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: כִּי
  choice: అని
  rationale: 'ఇక్కడ כִּי అతడు చూసిన విషయాన్ని పరిచయం చేస్తోంది: సౌలు చనిపోయాడని అతడు చూశాడు. అందువల్ల ‘అని’ తెలుగు వాక్యనిర్మాణానికి సరిపోతుంది.'
- source_word: מֵת
  choice: చనిపోయాడని
  rationale: ఈ రూపం సౌలు అప్పటికే మృతుడై ఉన్న స్థితిని సూచించగలదు; పూర్తయిన మరణ సంఘటనగా కూడా అర్థం చేసుకోవచ్చు. ప్రధాన పాఠంలో సహజమైన తెలుగు రూపాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: גַּם הוּא
  choice: అతడు కూడా
  rationale: సౌలు చేసిన చర్యకు అనుగుణంగా ఆయుధాలు మోసేవాడు కూడా అలాగే చేశాడనే అదనపు నొక్కును నిలుపుతుంది.
- source_word: עַל חַרְבּוֹ
  choice: తన ఖడ్గం మీద
  rationale: עַל అనే పూర్వప్రత్యయం మరియు ఈ సందర్భంలోని చర్యను నేరుగా ప్రతిబింబించే సహజమైన తెలుగు ప్రయోగం.
- source_word: וַיָּמָת עִמּוֹ
  choice: సౌలుతోపాటు చనిపోయాడు
  rationale: עִם సహచర్యాన్ని సూచిస్తుంది. తెలుగులో కర్తల గందరగోళం రాకుండా ‘అతనితో’ బదులు ‘సౌలుతోపాటు’ అని స్పష్టం చేశాం; స్థల సంబంధమైన అదనపు భావాన్ని చేర్చలేదు.
- source_word: וַיַּרְא
  choice: చూసినప్పుడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. గమనించిన వెంటనే జరిగిన తదుపరి చర్యతో కాలసంబంధాన్ని సహజంగా కలపడానికి ‘చూసినప్పుడు’ అని అనువదించాం.
