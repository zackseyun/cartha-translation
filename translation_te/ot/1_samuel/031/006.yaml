translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన క్రమాన్ని అనుసరించి, సంయుక్త కర్తల తర్వాత క్రియను చివర ఉంచాం. ‘ఆయుధవాహకుడు’ గౌరవప్రదమైన సైనిక పదం; ‘మనుషులందరూ’ మూలంలోని పదార్థ విస్తృతిని నిలుపుతుంది. పాదసూచిక గుర్తులను అవి వివరించే పదబంధం వద్ద ఉంచాం.
