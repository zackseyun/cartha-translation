  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣מָת שָׁא֡וּל וּ/שְׁלֹ֣שֶׁת בָּנָי/ו֩ וְ/נֹשֵׂ֨א כֵלָ֜י/ו גַּ֧ם כָּל אֲנָשָׁ֛י/ו בַּ/יּ֥וֹם הַ/ה֖וּא יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/006.yaml
  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
translation:
  language: te
  text: సౌలు, అతని ముగ్గురు కుమారులు, అతని ఆయుధవాహకుడు, అతని మనుషులందరూ[a][b] ఆ రోజున కలిసి మరణించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని సైనికులందరూ.’ హీబ్రూలో అక్షరార్థంగా ‘అతని మనుషులందరూ’ అని ఉంది. ఈ యుద్ధ సందర్భంలో అది సౌలు సైనికులను లేదా అతని అనుచరులను సూచించే అవకాశం ఉంది; అతనితో సంబంధమున్న ప్రతి వ్యక్తినీ కాదు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని గ్రీకు ప్రతుల్లో ‘అతని మనుషులందరూ’ అనే దానికి బదులు ‘అతని ఆయుధాలన్నీ’ అని ఉంది. హీబ్రూ పాఠం ‘అతని మనుషులందరూ’ అనే పఠనానికి మద్దతిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: అలా ... చనిపోయారు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపి, మునుపటి సంఘటన ఫలితాన్ని తెలియజేస్తుంది. తెలుగు కథన ప్రవాహంలో ‘అలా’ సహజంగా ఆ సంబంధాన్ని చూపుతుంది; జాబితాలోని వారందరికీ వర్తించేలా క్రియను చివర ఉంచాం.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: అతని ముగ్గురు కుమారులు
  rationale: సంఖ్య, నామవాచకం, స్వామ్య ప్రత్యయం కలిగిన హీబ్రూ పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: అతని ఆయుధవాహకుడు
  rationale: అక్షరార్థంగా ‘అతని సామగ్రి/ఆయుధాలు మోసేవాడు.’ సైనిక సందర్భంలో ‘ఆయుధవాహకుడు’ సంక్షిప్తంగా, గౌరవప్రదంగా, ఖచ్చితంగా ఉంటుంది.
- source_word: גַּם כָּל אֲנָשָׁיו
  choice: అతని మనుషులందరూ
  rationale: גַּם యొక్క చేర్పు భావం జాబితా సమన్వయంలో సహజంగా వ్యక్తమవుతుంది. אֲנָשָׁיו ను ‘మనుషులు’గా ఉంచడం మూలంలోని విస్తృత పదాన్ని కాపాడుతుంది; యుద్ధ సందర్భంలో అది సైనికులు లేదా అనుచరులను సూచించవచ్చు.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాలాన్ని సూచించే హీబ్రూ పదబంధానికి స్పష్టమైన, సహజమైన తెలుగు సమానం.
- source_word: יַחְדָּו
  choice: కలిసి
  rationale: వారందరి మరణాలు ఒకే రోజు సంయుక్తంగా సంభవించాయని తెలిపే క్రియావిశేషణ భావాన్ని నిలుపుతుంది; తప్పనిసరిగా ఒకే క్షణంలో మరణించారనే అదనపు భావాన్ని చేర్చదు.
