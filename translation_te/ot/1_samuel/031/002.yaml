  yaml_path: translation/ot/1_samuel/031/002.yaml
  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
translation:
  language: te
  text: ఫిలిష్తీయులు సౌలును, అతని కుమారులను తరుముతూ పట్టుకున్నారు[a]. ఫిలిష్తీయులు సౌలు కుమారులైన యోనాతాను, అబీనాదాబు, మల్కీ-షూవాలను హతమార్చారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సౌలును, అతని కుమారులను చేరుకున్నారు,” లేదా “సౌలును, అతని కుమారులను విడవకుండా తరిమారు.” హీబ్రూ క్రియ లక్ష్యాన్ని చేరుకునేంత దగ్గరగా వెంబడించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “యోనాతాను, అబీనాదాబు, మల్కీ-షూవాలను కొట్టారు.” అయితే ఈ యుద్ధ సందర్భంలో అది వారిని చంపారని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  choice: తరుముతూ పట్టుకున్నారు
  rationale: דבק అనే క్రియ ఇక్కడ యుద్ధంలో దగ్గరగా తరిమి లక్ష్యాన్ని చేరుకోవడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం వెంబడింపు, పట్టుకోవడం అనే రెండు భావాలనూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహానికి ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన రూపం.
- source_word: אֶת שָׁאוּל וְאֶת בָּנָיו
  choice: సౌలును అతని కుమారులను
  rationale: בניו ఇక్కడ సాధారణంగా పిల్లలు అని కాకుండా కుమారులు అని స్పష్టంగా సూచిస్తుంది; తరువాతి భాగంలో వారి పేర్లు ఇవ్వబడ్డాయి.
- source_word: וַיַּכּוּ
  choice: హతమార్చారు
  rationale: נכה అక్షరార్థంగా కొట్టడం లేదా దెబ్బతీయడం కావచ్చు; అయితే ఈ యుద్ధ సందర్భంలో పేరుపేరునా చెప్పబడినవారి మరణాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ఫలితార్థాన్ని ఇచ్చి, విస్తృత అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: אֲבִינָדָב
  choice: అబీనాదాబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించిన రూపం.
- source_word: מַלְכִּי שׁוּעַ
  choice: మల్కీషూవ
  rationale: సంయుక్త హీబ్రూ వ్యక్తినామంలోని ధ్వనులను తెలుగులో దగ్గరగా ప్రతిబింబించే రూపం.
- source_word: בְּנֵי שָׁאוּל
  choice: సౌలు కుమారులైన
  rationale: పేర్లు చెప్పబడిన ముగ్గురూ సౌలు కుమారులని గుర్తించే అన్వయ పదబంధాన్ని తెలుగులో సహజంగా తెలిపింది.
