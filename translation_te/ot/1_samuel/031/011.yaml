- from: యాబేష్గిలాదులో నివసించేవారు ఫిలిష్తీయులు సౌలుకు చేసినదాని గురించి విన్నప్పుడు,
  to: యాబేషు-గిలాదు నివాసులు ఫిలిష్తీయులు సౌలుపట్ల చేసినదాని గురించి విన్నప్పుడు,
