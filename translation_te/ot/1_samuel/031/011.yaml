  text: When the inhabitants of Jabesh-gilead heard about what the Philistines had done to Saul,
translation:
  language: te
  text: యాబేషు-గిలాదు నివాసులు ఫిలిష్తీయులు సౌలుపట్ల చేసినదాని గురించి విన్నప్పుడు,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשְׁבֵי יָבֵשׁ גִּלְעָד
  choice: యాబేష్గిలాదులో నివసించేవారు
  rationale: స్థలనామాన్ని నిలుపుతూ, ‘నివాసులు’ అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֵת אֲשֶׁר עָשׂוּ
  choice: చేసినదాని గురించి
  rationale: שמע אל అనే నిర్మాణంలోని ‘గురించి విన్నారు’ భావాన్ని స్పష్టంగా అందిస్తూ, వారు చేసిన కార్యం ఏమిటో ఈ వచనంలో ముందుగానే నిర్ధారించదు.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రజానామం.
- source_word: לְשָׁאוּל
  choice: సౌలుకు
  rationale: లְ ఉపసర్గంలోని లక్ష్య/సంబంధ భావాన్ని ‘కు’తో నేరుగా అందిస్తుంది.
