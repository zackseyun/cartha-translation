  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి. వాక్యం తరువాతి వచనంతో కొనసాగుతుందని సూచించేందుకు చివర కామా ఉంచబడింది.
