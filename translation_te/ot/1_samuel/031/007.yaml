source:
  edition: WLC
  text: וַ/יִּרְא֣וּ אַנְשֵֽׁי יִ֠שְׂרָאֵל אֲשֶׁר בְּ/עֵ֨בֶר הָ/עֵ֜מֶק וַ/אֲשֶׁ֣ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן כִּֽי נָ֨סוּ֙ אַנְשֵׁ֣י יִשְׂרָאֵ֔ל וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ אֶת הֶֽ/עָרִים֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּֽשְׁב֖וּ בָּ/הֶֽן־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
translation:
  language: te
  text: లోయకు అవతల ఉన్న ఇశ్రాయేలు పురుషులూ, యొర్దాను అవతల ఉన్న ఇశ్రాయేలు పురుషులూ, ఇశ్రాయేలు పురుషులు పారిపోయారనీ, సౌలు మరియు అతని కుమారులు చనిపోయారనీ చూసినప్పుడు, వారు పట్టణాలను విడిచిపెట్టి పారిపోయారు. అప్పుడు ఫిలిష్తీయులు వచ్చి వాటిలో నివసించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: చూసినప్పుడు
  rationale: ראה అనే క్రియ యొక్క ప్రత్యక్షమైన ‘చూచుట’ భావాన్ని నిలుపుతూ, తరువాతి כִּי ఉపవాక్యాలు వారు గ్రహించిన విషయాన్ని తెలుపుతున్నట్లు సహజమైన తెలుగు వాక్యనిర్మాణంలో ఇచ్చాం.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు పురుషులు.’ ఈ సైనిక సందర్భంలోని లింగసూచక, సమూహార్థక రూపాన్ని సాధ్యమైనంతగా నిలిపాం.
- source_word: בְּעֵבֶר הָעֵמֶק
  choice: లోయకు అవతల
  rationale: עֵבֶר సూచించే ఎదురువైపు లేదా అవతలి ప్రాంతం అనే భౌగోళిక భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దానుకు అవతల
  rationale: మూలంలో పునరావృతమైన עֵבֶר భావాన్ని ‘అవతల’ అని మళ్లీ వాడి నిలిపాం.
- source_word: כִּי נָסוּ
  choice: పారిపోయారనీ
  rationale: వారు చూసి గ్రహించిన విషయాన్ని తెలిపే ఉపవాక్యంగా తెలుగులో సహజంగా అమర్చాం; נוס యొక్క ‘పారిపోవు’ భావాన్ని నేరుగా నిలిపాం.
- source_word: מֵתוּ
  choice: చనిపోయారనీ
  rationale: מות మరణాన్ని మాత్రమే తెలుపుతుంది; మరణ విధానాన్ని ‘చంపబడ్డారు’ అని అదనంగా నిర్దేశించకుండా ఉంచాం.
- source_word: וּבָנָיו
  choice: అతని కుమారులు
  rationale: సౌలుతో అతని కుమారులను సాధారణ సముచ్చయంగా కలిపే మూల నిర్మాణాన్ని అనుసరించాం.
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  choice: పట్టణాలను విడిచిపెట్టి
  rationale: עזב యొక్క వదిలివేయడం/త్యజించడం అనే భావాన్ని యుద్ధభయంతో ఖాళీ చేసిన సందర్భానికి సరిపోయే ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయారు
  rationale: נוס యొక్క సాధారణ అర్థాన్ని స్పష్టమైన, గౌరవప్రదమైన కథనశైలిలో అందిస్తుంది.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: అప్పుడు ఫిలిష్తీయులు వచ్చి
  rationale: בוא యొక్క విస్తృతమైన ‘వచ్చు/ప్రవేశించు’ భావంలో మూలానికి దగ్గరైన ‘వచ్చి’ని ఎంచుకున్నాం; తెలుగు కథన ప్రవాహం కోసం ‘అప్పుడు’ వాడాం.
- source_word: וַיֵּשְׁבוּ בָּהֶן
  choice: వాటిలో నివసించారు
  rationale: ישב ఇక్కడ నివసించడం లేదా స్థిరపడడం రెండింటినీ సూచించగలదు. ‘నివసించారు’ మూలంలోని విస్తృత భావాన్ని అనవసరంగా శాశ్వత స్థిరనివాసంగా నిర్ధారించదు.
