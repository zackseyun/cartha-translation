translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. భౌగోళిక పునరుక్తిని నిలిపి, సైనిక సందర్భంలోని ‘ఇశ్రాయేలు పురుషులు’ అనే రూపాన్ని సాధ్యమైనంత సూటిగా ఉంచాం. ఈ వచనానికి పాఠ్య లేదా సిద్ధాంతపరమైన వివరణ అవసరమైన అస్పష్టత లేకపోవడంతో పాదటిప్పణులు చేర్చలేదు.
