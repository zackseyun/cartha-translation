    issue: “దించారు” is more specific than the source.
    rationale: וַיִּקְחוּ means ‘they took’; it does not explicitly state that the bodies were taken down from the wall. The supplied detail should be removed to preserve source fidelity.
  revised_text: అప్పుడు శౌర్యవంతులైన పురుషులందరూ లేచి, రాత్రంతా ప్రయాణించి, బేత్షాను గోడనుండి సౌలు మృతదేహాన్ని, అతని కుమారుల మృతదేహాలను తీసుకున్నారు. వారు యాబేషుకు[a] వచ్చి, అక్కడ వాటిని కాల్చివేశారు.
