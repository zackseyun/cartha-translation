  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּק֜וּמוּ כָּל אִ֣ישׁ חַיִל֮ וַ/יֵּלְכ֣וּ כָל הַ/לַּיְלָה֒ וַ/יִּקְח֞וּ אֶת גְּוִיַּ֣ת שָׁא֗וּל וְ/אֵת֙ גְּוִיֹּ֣ת בָּנָ֔י/ו מֵ/חוֹמַ֖ת בֵּ֣ית שָׁ֑ן וַ/יָּבֹ֣אוּ יָבֵ֔שָׁ/ה וַ/יִּשְׂרְפ֥וּ אֹתָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
translation:
  language: te
  text: అప్పుడు శౌర్యవంతులైన పురుషులందరూ లేచి, రాత్రంతా ప్రయాణించి, బేత్షాను గోడనుండి సౌలు మృతదేహాన్ని, అతని కుమారుల మృతదేహాలను తీసుకున్నారు. వారు యాబేషుకు[a] వచ్చి, అక్కడ వాటిని కాల్చివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘యాబేషు’ అంటే సందర్భానుసారం ‘యాబేషు-గిలాదు’.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: శౌర్యవంతులైన పురుషులందరూ
  rationale: ఈ సైనిక సందర్భంలో ఈ హీబ్రూ నుడికారం ధైర్యశౌర్యాలు గల యోధులను సూచిస్తుంది. మూలంలోని పురుషలింగ నిర్దిష్టతను కూడా ఈ రూపం నిలుపుతుంది.
- source_word: וַיָּקוּמוּ
  choice: లేచి
  rationale: క్రియ యొక్క ప్రాథమిక అర్థమైన ‘లేచారు’ను సహజమైన తెలుగు కథన క్రమంలో ‘లేచి’గా ఇచ్చాం.
- source_word: וַיֵּלְכוּ כָל הַלַּיְלָה
  choice: రాత్రంతా ప్రయాణించి
  rationale: వారు రాత్రి పొడవునా సాగిన విషయాన్ని తెలియజేస్తుంది; ప్రయాణ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: גְּוִיַּת ... גְּוִיֹּת
  choice: మృతదేహాన్ని ... మృతదేహాలను
  rationale: గְּוִיָּה ప్రత్యేకంగా చనిపోయిన శరీరాన్ని సూచిస్తుంది. ‘మృతదేహం’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: מֵחוֹמַת בֵּית שָׁן
  choice: బేత్‌షాను గోడ మీద నుంచి
  rationale: מִן + חוֹמָה గోడ నుంచి లేదా గోడ మీద నుంచి అని అర్థం. శవాలు గోడకు ప్రదర్శింపబడిన సందర్భానికి ‘గోడ మీద నుంచి’ సహజంగా సరిపోతుంది.
- source_word: יָבֵשָׁה
  choice: యాబేషుకు
  rationale: దిశార్థక ప్రత్యయం యాబేషు వైపు లేదా యాబేషుకు వెళ్లడాన్ని సూచిస్తుంది. మూలపాఠంలో ఉన్న సంక్షిప్త స్థలనామాన్నే ప్రధాన వచనంలో ఉంచాం.
- source_word: וַיִּשְׂרְפוּ אֹתָם שָׁם
  choice: అక్కడ వాటిని కాల్చివేశారు
  rationale: క్రియకు నేరుగా ‘కాల్చారు’ అనే అర్థం ఉంది. సర్వనామ సూచనను నిలుపుతూ, దహన విధానం గురించి మూలంలో లేని వివరాన్ని చేర్చలేదు.
theological_decisions:
- issue: రక్షణ చర్యలో పాల్గొన్నవారిని సూచించే పురుషలింగ సమూహ పదబంధం
  choice: శౌర్యవంతులైన పురుషులందరూ
  alternative: ధైర్యవంతులందరూ
  rationale: హీబ్రూ పాఠం పురుషలింగ రూపాన్ని వాడి, సైనిక సందర్భంలో పురుష యోధులను సూచిస్తుంది. లింగనిరపేక్ష అనువాదం మూలంలోని నిర్దిష్టతను మందగింపజేస్తుంది.
- issue: మృతదేహాలను కాల్చడం అనే చర్యను వివరించే స్థాయి
  choice: కాల్చివేశారు
  alternative: దహనం చేశారు
  rationale: మూలంలోని שׂרף సాధారణంగా ‘కాల్చు’ అని అర్థం. ‘దహనం చేశారు’ అనేది సంపూర్ణ అంత్యక్రియల విధానాన్ని మరింత నిర్దిష్టంగా సూచించవచ్చు; అందువల్ల మూలంలోని విస్తృత అర్థాన్నే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘శౌర్యవంతులైన పురుషులు’ మూలంలోని సైనిక మరియు పురుషలింగ భావాన్ని నిలుపుతుంది. మృతదేహం అనే అర్థం ప్రధాన వచనంలోనే స్పష్టంగా ఉన్నందున దానికి ప్రత్యేక పాదసూచిక అవసరం లేదు. పాదసూచిక గుర్తు [a] ప్రధాన వచనంలో సంబంధిత స్థలనామం వద్ద ఉంచబడింది.
