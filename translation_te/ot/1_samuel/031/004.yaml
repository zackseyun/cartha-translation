source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ לְ/נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָ֠בוֹאוּ הָ/עֲרֵלִ֨ים הָ/אֵ֤לֶּה וּ/דְקָרֻ֨/נִי֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
translation:
  language: te
  text: అప్పుడు సౌలు తన ఆయుధాలు మోసేవానితో, “నీ కత్తిని ఒరలోనుండి తీసి, దానితో నన్ను పొడువు. లేకపోతే ఈ సున్నతి లేనివారు వచ్చి నన్ను పొడిచి, నన్ను అవమానపరుస్తారు[a]” అన్నాడు. అయితే అతని ఆయుధాలు మోసేవాడు చాలా భయపడ్డందున అందుకు ఒప్పుకోలేదు. కాబట్టి సౌలు ఆ కత్తిని తీసుకొని దానిమీద పడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నన్ను ఆటపట్టిస్తారు,” “నాతో దారుణంగా వ్యవహరిస్తారు,” లేదా “నన్ను అవమానకరంగా ప్రవర్తిస్తారు.”
    reason: వְהִתְעַלְּלוּ בִי అవమానకరమైన, దుర్వ్యవహారాన్ని సూచిస్తుంది; దాని ఖచ్చితమైన రూపాన్ని సందర్భం నిర్దిష్టంగా చెప్పదు.
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: తన ఆయుధాలు మోసేవాడు
  rationale: రాజు లేదా యోధుని ఆయుధ సామగ్రిని మోసే సైనిక సహాయకుణ్ణి సూచించే హీబ్రూ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: నీ కత్తిని దూసి
  rationale: ఒరలోనుంచి కత్తిని బయటకు తీయమనే సైనిక సందర్భంలోని ఆజ్ఞను సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: וְדָקְרֵנִי בָהּ / וּדְקָרֻנִי
  choice: దానితో నన్ను పొడిచివేయి / నన్ను పొడిచి
  rationale: דקר అనే క్రియలోని ఆయుధంతో చీల్చి పొడిచే భావాన్ని, అలాగే వాక్యంలో దాని పునరుక్తిని నిలుపుతుంది.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: సున్నతి లేని వీరు
  rationale: హీబ్రూలోని నిందార్థకమైన ఒడంబడిక సంబంధిత వర్ణనను ‘ఫిలిష్తీయులు’ అని సందర్భానుసారంగా మార్చకుండా యథాతథ భావంతో ఉంచుతుంది.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: నన్ను అవమానకరంగా హింసిస్తారు
  rationale: క్రియ సూచించే అవమానకరమైన, క్రూరమైన దుర్వ్యవహారాన్ని తెలియజేస్తూ, అది ఎలాంటి రూపం దాల్చుతుందో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וְלֹא אָבָה
  choice: అందుకు ఒప్పుకోలేదు
  rationale: అతని అయిష్టత లేదా నిరాకరణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי יָרֵא מְאֹד
  choice: చాలా భయపడి
  rationale: అతడు ఒప్పుకోకపోవడానికి కారణాన్నీ מְאֹד అనే తీవ్రతనూ స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: దానిమీద పడ్డాడు
  rationale: ‘దానిమీద పడ్డాడు’ అనే హీబ్రూ వ్యక్తీకరణను, అదనపు వివరణ లేకుండా సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: సౌలు భయపడిన అవమానకర ప్రవర్తన స్వరూపాన్ని అతిగా నిర్దిష్టం చేసే అవకాశం
  choice: అవమానకరంగా హింసిస్తారు
  alternative: నన్ను ఆటపట్టిస్తారు; నన్ను అవమానిస్తారు; నాతో దారుణంగా వ్యవహరిస్తారు
  rationale: మూలక్రియ అవమానకరమైన దుర్వ్యవహారాన్ని సూచిస్తుంది; అయితే అది హేళన, చిత్రహింస లేదా మరేదైనా నిర్దిష్ట చర్య అని పాఠ్యం చెప్పదు. అందువల్ల తీవ్రతతోపాటు అస్పష్టతను కూడా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా వర్ణన గంభీరతను నిలిపే శైలి. ‘ఆయుధాలు మోసేవాడు’ అనే రూపం సాంకేతిక బిరుదుకన్నా పాత్రను వెంటనే స్పష్టంచేస్తుంది.
