- from: ఫిలిష్తీయులు ఇశ్రాయేలుతో యుద్ధం చేస్తూ ఉన్నారు. ఇశ్రాయేలు పురుషులు ఫిలిష్తీయుల నుండి పారిపోయి[a], గిల్బోవ పర్వతం మీద హతులై పడిపోయారు.
  to: ఫిలిష్తీయులు ఇశ్రాయేలుకు వ్యతిరేకంగా యుద్ధం చేస్తుండగా, ఇశ్రాయేలు పురుషులు ఫిలిష్తీయుల నుండి పారిపోయి[a], గిల్బోవ పర్వతం మీద హతులై పడిపోయారు.
