source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֖ים נִלְחָמִ֣ים בְּ/יִשְׂרָאֵ֑ל וַ/יָּנֻ֜סוּ אַנְשֵׁ֤י יִשְׂרָאֵל֙ מִ/פְּנֵ֣י פְלִשְׁתִּ֔ים וַ/יִּפְּל֥וּ חֲלָלִ֖ים בְּ/הַ֥ר הַ/גִּלְבֹּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/001.yaml
  text: The Philistines were fighting against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: te
  text: ఫిలిష్తీయులు ఇశ్రాయేలుకు వ్యతిరేకంగా యుద్ధం చేస్తుండగా, ఇశ్రాయేలు పురుషులు ఫిలిష్తీయుల నుండి పారిపోయి[a], గిల్బోవ పర్వతం మీద హతులై పడిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఫిలిష్తీయుల ఎదుట నుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ప్రజల సమూహానికి ప్రామాణిక తెలుగు పేరును వాడాం. ఆరంభంలోని ו కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో విడి వాక్యాల క్రమమే దానిని సహజంగా తెలియజేస్తుంది కాబట్టి ప్రత్యేకంగా ‘మరియు’ అని పెట్టలేదు.
- source_word: נִלְחָמִים בְּ/יִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో యుద్ధం చేస్తూ ఉన్నారు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న, నేపథ్య చర్యను సూచిస్తుంది. לחם తో వచ్చిన ב ఇక్కడ ప్రత్యర్థిత్వ భావం కలిగి ఉంది; తెలుగులో ‘ఇశ్రాయేలుతో యుద్ధం’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: וַ/יָּנֻסוּ
  choice: పారిపోయి
  rationale: సైనిక పరాజయ సందర్భంలో נוּס అంటే పారిపోవడం. తరువాతి చర్యతో సహజంగా కలపడానికి అసమాపక క్రియారూపాన్ని వాడాం.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు పురుషులు’; మూలంలోని పుంలింగ సూచనను నిలిపి, ‘ఇశ్రాయేలీయులు’ అనే సాధారణీకరణను నివారించాం.
- source_word: מִ/פְּנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల నుండి
  rationale: ఈ హీబ్రూ నుడికారం శత్రువుల సమక్షం నుండి వెనుదిరిగి పారిపోవడాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు రూపాన్ని, పాదసూచికలో మరింత అక్షరార్థ రూపాన్ని ఇచ్చాం.
- source_word: וַ/יִּפְּלוּ חֲלָלִים
  choice: హతులై పడిపోయారు
  rationale: యుద్ధంలో చంపబడినవారిగా పడిపోవడం అనే సంయుక్త భావాన్ని ఇది నిలుపుతుంది; కేవలం ‘చనిపోయారు’ కంటే మూలంలోని దృశ్యాత్మకత స్పష్టంగా ఉంటుంది.
- source_word: בְּ/הַר הַ/גִּלְבֹּעַ
  choice: గిల్బోవ పర్వతం మీద
  rationale: స్థలనామాన్ని ప్రామాణికంగా లిప్యంతరీకరించి, పర్వతంపై జరిగిన సంఘటనను సహజమైన తెలుగు స్థానవాచకంతో తెలిపాం.
