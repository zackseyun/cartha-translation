  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజంగా వినిపించేలా ‘తీసుకొని’ మరియు ‘తరువాత’తో అనుసంధానించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
