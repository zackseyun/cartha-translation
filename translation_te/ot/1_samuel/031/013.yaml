  yaml_path: translation/ot/1_samuel/031/013.yaml
  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
translation:
  language: te
  text: వారు వారి ఎముకలను తీసుకొని, యాబేషు[b]లోని టామరిస్క్ చెట్టు[a] కింద పాతిపెట్టారు. తరువాత వారు ఏడు రోజులు ఉపవాసం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘టామరిస్క్’; హీబ్రూ పదం ఆ చెట్టు జాతిని నిర్దిష్టంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘యాబేషు’ అనేది ముందటి సందర్భంలో పేర్కొన్న ‘యాబేషు-గిలాదు’కు సంక్షిప్త రూపం.
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמֹתֵיהֶם
  choice: వారి ఎముకలను
  rationale: עֶצֶם అనే పదానికి ప్రత్యక్ష అర్థం ‘ఎముక’; ముందటి వచనంలో శరీరాలను కాల్చిన సందర్భానికి అనుగుణంగా దీనిని సాధారణీకరించకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּקְבְּרוּ
  choice: పాతిపెట్టారు
  rationale: קבר అనే సాధారణ సమాధి క్రియకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: תַחַת
  choice: కింద
  rationale: స్థానాన్ని తెలిపే תחת పదానికి సరళమైన, సహజమైన సమానార్థకం.
- source_word: הָאֶשֶׁל
  choice: చింతజాతి చెట్టు
  rationale: אֶשֶׁל ఒక నిర్దిష్టమైన టామరిస్క్ చెట్టును సూచిస్తుంది; తెలుగు పాఠకులకు గ్రాహ్యంగా ఉండేలా చెట్టు స్వభావాన్ని తెలిపే పదబంధం వాడబడింది, అయితే జాతి గుర్తింపుపై గమనిక ఇవ్వబడింది.
- source_word: בְּיָבֵשָׁה
  choice: యాబేషులోని
  rationale: ఇది స్థలనామమైన యాబేషును సూచిస్తుంది; ముందటి సందర్భంలోని యాబేషు-గిలాదు పేరుకు సంక్షిప్త రూపం.
- source_word: וַיָּצֻמוּ
  choice: ఉపవాసం ఉన్నారు
  rationale: צום అనే ‘ఉపవాసం చేయు’ క్రియకు సహజమైన తెలుగు ప్రయోగం.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులు
  rationale: మూలంలోని కాలవ్యవధిని నేరుగా తెలియజేస్తుంది.
- source_word: וַיִּקְחוּ
  choice: వారు ... తీసుకొని
  rationale: לקח యొక్క ‘తీసుకొను’ అర్థాన్ని కథన క్రమానికి సహజంగా అనుసంధానిస్తుంది.
