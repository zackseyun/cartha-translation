  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣שֶׁב הַ֠/מֶּלֶךְ עַל מ֨וֹשָׁב֜/וֹ כְּ/פַ֣עַם בְּ/פַ֗עַם אֶל מוֹשַׁב֙ הַ/קִּ֔יר וַ/יָּ֨קָם֙ יְה֣וֹנָתָ֔ן וַ/יֵּ֥שֶׁב אַבְנֵ֖ר מִ/צַּ֣ד שָׁא֑וּל וַ/יִּפָּקֵ֖ד מְק֥וֹם דָּוִֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
translation:
  language: te
  text: రాజు ఎప్పటిలాగే గోడ పక్కన ఉన్న తన ఆసనంలో కూర్చున్నాడు. యోనాతాను లేచి నిలబడ్డాడు; అబ్నేరు సౌలు పక్కన కూర్చున్నాడు. అయితే దావీదు స్థానం[a] ఖాళీగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు స్థానం ఖాళీగా కనిపించింది”; అంటే భోజనంలో అతనికి కేటాయించిన స్థానంలో అతడు లేడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట పదం సందర్భంలో సౌలును సూచించినా, మూలంలో వ్యక్తిపేరు కాక బిరుదే ఉంది; అందువల్ల ‘రాజు’ అని ఉంచాం.
- source_word: מוֹשָׁבוֹ
  choice: తన ఆసనంలో
  rationale: ఇది నివాసాన్ని కాక విందులో కూర్చునే స్థానాన్ని సూచిస్తుంది; గౌరవప్రదమైన సహజ తెలుగు కోసం ‘ఆసనం’ ఎంచుకున్నాం.
- source_word: כְּפַעַם בְּפַעַם
  choice: ఎప్పటిలాగే
  rationale: మునుపటి సందర్భాల్లో చేసినట్లే అనే పునరావృత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל מוֹשַׁב הַקִּיר
  choice: గోడ పక్కన ఉన్న
  rationale: రాజు ఆసనం గోడకు ఆనుకుని లేదా గోడ పక్కన ఉన్న స్థానాన్ని సూచిస్తుంది; אֶל ఇక్కడ సందర్భానుసారంగా స్థానార్థకంగా గ్రహించబడింది.
- source_word: וַיָּקָם
  choice: లేచి నిలబడ్డాడు
  rationale: קום క్రియ యొక్క సరళ కథనార్థాన్ని స్పష్టమైన సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל
  choice: అబ్నేరు సౌలు పక్కన కూర్చున్నాడు
  rationale: מִצַּד తెలిపే పక్కన/ప్రక్కన అనే స్థల సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: దావీదు స్థలం ఖాళీగా ఉంది
  rationale: దావీదుకు కేటాయించిన స్థానంలో అతడు లేకపోవడాన్ని సందర్భానుగుణంగా సహజంగా తెలుపుతుంది; פקד రూపంలో ఉన్న ‘కనబడకపోవడం/లోటుగా ఉండడం’ భావాన్ని పాదటిప్పణిలో కూడా సూచించాం.
