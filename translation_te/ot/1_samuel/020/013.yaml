source:
  edition: WLC
  text: כֹּֽה יַעֲשֶׂה֩ יְהוָ֨ה לִֽ/יהוֹנָתָ֜ן וְ/כֹ֣ה יֹסִ֗יף כִּֽי יֵיטִ֨ב אֶל אָבִ֤/י אֶת הָֽ/רָעָה֙ עָלֶ֔י/ךָ וְ/גָלִ֨יתִי֙ אֶת אָזְנֶ֔/ךָ וְ/שִׁלַּחְתִּ֖י/ךָ וְ/הָלַכְתָּ֣ לְ/שָׁל֑וֹם וִ/יהִ֤י יְהוָה֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אָבִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/013.yaml
  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
translation:
  language: te
  text: “యాహ్వే యోనాతానుకు ఇలాగే చేయుగాక, ఇంకా అంతకన్నా ఎక్కువ చేయుగాక! నా తండ్రి నీకు కీడు చేయాలని తలచితే[b], నేను ఆ సంగతి నీకు తెలియజేయక, నీవు క్షేమంగా వెళ్లేలా నిన్ను పంపక ఉంటే[c], ఆయన అలా చేయుగాక. యాహ్వే నా తండ్రితో ఉన్నట్లే నీతోనూ ఉండుగాక.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: మరింత అక్షరార్థంగా, “నీ మీద కీడు [చేయడం] నా తండ్రికి మంచిదనిపిస్తే”; అంటే, అతడు నీకు హాని చేయాలని ఉద్దేశిస్తే.
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీ ప్రమాణ వాక్యం సంక్షిప్తంగా ఉంది; “తెలియజేయక ... పంపక ఉంటే” అనే నిషేధార్థం సందర్భం నుంచి సరఫరా చేయబడింది. మరింత అక్షరార్థంగా పదాలను సానుకూల రూపంలో, “నేను నీకు తెలియజేసి నిన్ను పంపుతాను” అని చదవవచ్చు.
    reason: source_ambiguity
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף
  choice: యాహ్వే యోనాతానుకు ఇలాగే చేయుగాక, ఇంతకంటే ఎక్కువగా కూడా చేయుగాక
  rationale: ఇది ప్రమాణంతో కూడిన స్వీయశాప సూత్రం. హెబ్రీలో యోనాతాను తనను మూడవ పురుషలో పేరుతో పేర్కొన్నందున దానిని అలాగే నిలిపి, శాపార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  choice: నా తండ్రి నీకు కీడు చేయాలని నిర్ణయించుకుంటే
  rationale: అక్షరార్థంగా అసంపూర్ణంగా కనిపించే ‘నీ మీద కీడు [చేయడం] నా తండ్రికి మంచిదనిపిస్తే’ అనే మాట, సౌలు దావీదుకు హాని చేయాలని సంకల్పించడాన్ని సూచిస్తుంది. ‘నిర్ణయించుకుంటే’ ఉద్దేశాన్ని తెలియజేస్తుంది; అతడు కీడులో ఆనందిస్తున్నాడనే అదనపు భావాన్ని రుద్దదు.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: ఆ సంగతి నీకు తెలియజేయకుండా
  rationale: ‘నీ చెవిని తెరుస్తాను’ అనే హెబ్రీ జాతీయానికి ‘తెలియజేస్తాను’ అని అర్థం. ప్రమాణంలోని సంక్షిప్త నిర్మాణం వల్ల తెలుగులో అవసరమైన నిషేధార్థాన్ని స్పష్టంగా తెలిపాం.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: నిన్ను పంపకుండా ఉంటే
  rationale: పియేల్ రూపంలోని క్రియ యోనాతాను దావీదు వెళ్లిపోవడానికి చురుకుగా సహాయం చేస్తాడనే భావాన్ని కలిగి ఉంది. ప్రమాణంలోని అంతర్నిహిత నిషేధం ఈ క్రియకూ వర్తించేలా అనువదించాం.
- source_word: וְהָלַכְתָּ לְשָׁלוֹם
  choice: నీవు క్షేమంగా వెళ్లేలా
  rationale: ‘షాలోమ్‌లో వెళ్లు’ అనే ప్రయోగం ఇక్కడ సురక్షితంగా, క్షేమంగా వెళ్లడాన్ని సూచిస్తుంది. ముందు చెప్పిన పంపించడానికి ఇది ఉద్దేశం లేదా ఫలితంగా సహజంగా అనుసంధానమవుతుంది.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: యాహ్వే ... నీతోనూ ఉండుగాక
  rationale: హెబ్రీ జస్సివ్ భావాన్ని ‘ఉండుగాక’తో నిలిపాం.
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  choice: నా తండ్రితో ఉన్నట్లే
  rationale: సౌలుతో యాహ్వే ఉన్న గత స్థితిని దావీదుకు కోరుతున్న ఆశీర్వాదంతో పోల్చుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో మార్చకుండా, ఆధునిక తెలుగు లిపిలో దాని సాధారణ పండితపరమైన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: యోనాతాను ప్రమాణంలో అంతర్నిహిత నిషేధం
  choice: ‘తెలియజేయకుండా ... పంపకుండా ఉంటే’ అని ప్రధాన పాఠంలో నిషేధార్థాన్ని స్పష్టం చేయడం
  alternative: హెబ్రీ పదక్రమాన్ని మరింత అక్షరార్థంగా అనుసరించి, ‘తెలియజేసి నిన్ను పంపుతాను’ అని సానుకూల వాక్యంగా చదవడం
  rationale: హెబ్రీ ప్రమాణ సూత్రంలో శాపం వర్తించే షరతు సంక్షిప్తమైంది. సందర్భంలో యోనాతాను సౌలు కీడు చేయాలని సంకల్పిస్తే దావీదును తప్పక హెచ్చరించి పంపుతానని ప్రమాణం చేస్తున్నాడు; ఆ పని చేయకపోతే తనపై శాపం రావాలని భావం. నిషేధాన్ని స్పష్టం చేయడం ఆ భావాన్ని తెలుగులో గ్రాహ్యంగా ఉంచుతుంది, అయితే పాదటిప్పణిలో నిర్మాణంలోని అస్పష్టతను చూపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ప్రమాణ సూత్రంలోని పునరుక్తిని నిలిపి, హెబ్రీలోని సంక్షిప్త అపోడోసిస్ తెలుగులో స్పష్టంగా ఉండేందుకు చివర ‘ఆయన అలా చేయుగాక’ అని పునరుద్ఘాటించాం. ‘క్షేమంగా’ అనేది שָׁלוֹם యొక్క సందర్భానుకూల భద్రత/సమగ్ర శ్రేయస్సు భావాన్ని అందిస్తుంది.
