revisions:
- from: “యాహ్వే యోనాతానుకు ఇలాగే చేయుగాక, ఇంతకంటే ఎక్కువగా కూడా చేయుగాక! నా తండ్రి నీకు కీడు చేయాలని నిర్ణయించుకుంటే[b], నేను ఆ సంగతి నీకు తెలియజేయకుండా[a], నీవు క్షేమంగా వెళ్లేలా నిన్ను పంపకుండా ఉంటే[c], ఆయన అలా చేయుగాక. యాహ్వే నా తండ్రితో ఉన్నట్లే నీతోనూ ఉండుగాక.”
  to: “యాహ్వే యోనాతానుకు ఇలాగే చేయుగాక, ఇంకా అంతకన్నా ఎక్కువ చేయుగాక! నా తండ్రి నీకు కీడు చేయాలని తలచితే[b], నేను ఆ సంగతి నీకు తెలియజేయక, నీవు క్షేమంగా వెళ్లేలా నిన్ను పంపక ఉంటే[c], ఆయన అలా చేయుగాక. యాహ్వే నా తండ్రితో ఉన్నట్లే నీతోనూ ఉండుగాక.”
  rationale: The revision makes the two promised actions syntactically parallel and clearly subject to the implied negative required by the oath's contextual sense. It also replaces "నిర్ణయించుకుంటే" with the more natural "తలచితే," without adding a stronger nuance than the Hebrew idiom warrants. Footnote a is adjusted to state the Hebrew image more accurately. Footnote markers remain anchored to the relevant source expressions; the source-ambiguity note remains attached to the explicitly supplied negative clause.
