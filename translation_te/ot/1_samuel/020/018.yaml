  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. సందర్భాన్ని స్పష్టం చేయడానికి חֹדֶשׁ ను ‘అమావాస్య పండుగ’గా అనువదించాం. హీబ్రూ పదపునరుక్తిలోని అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
