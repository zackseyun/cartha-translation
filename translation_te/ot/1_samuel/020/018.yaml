  yaml_path: translation/ot/1_samuel/020/018.yaml
  text: Jonathan said to him[a], “Tomorrow is the new moon, and you will be missed, because your seat will be empty.”
translation:
  language: te
  text: 'యోనాతాను అతనితో ఇలా అన్నాడు: “రేపు అమావాస్య. నీ స్థానం ఖాళీగా ఉంటుంది కాబట్టి నీవు లేకపోవడం గమనించబడుతుంది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు గైర్హాజరైనట్లు గమనించబడుతుంది; ఎందుకంటే నీ స్థానం ఖాళీగా కనిపిస్తుంది.” హీబ్రూలో రెండు వాక్యభాగాల్లోనూ פקד అనే ఒకే క్రియ పునరావృతమై పదప్రయోగాన్ని సృష్టిస్తుంది; దాన్ని తెలుగులో సహజంగా పూర్తిగా నిలుపుకోవడం కష్టం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: అతనితో ఇలా అన్నాడు
  rationale: אמר క్రియ యొక్క సాధారణ కథన రూపాన్ని, పరోక్ష కర్మను సహజమైన ఆధునిక తెలుగు సంభాషణ పరిచయంగా అందిస్తుంది.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ లిప్యంతరీకరణ.
- source_word: מָחָר
  choice: రేపు
  rationale: కాలాన్ని సూచించే హీబ్రూ క్రియావిశేషణానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: חֹדֶשׁ
  choice: అమావాస్య పండుగ
  rationale: ఈ రాజభోజన సందర్భంలో ఇది కేవలం నెలను కాక, అమావాస్య ఆచరణను లేదా పండుగను సూచిస్తుంది.
- source_word: וְנִפְקַדְתָּ
  choice: నీవు లేవని గుర్తిస్తారు
  rationale: దావీదు గైర్హాజరు కావడం గమనించబడుతుందనే నిఫాల్ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: వల్ల
  rationale: తరువాతి వాక్యభాగం కారణాన్ని తెలియజేస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘వల్ల’ సహజంగా సరిపోతుంది.
- source_word: יִפָּקֵד
  choice: ఖాళీగా ఉండడం
  rationale: ఇక్కడ అదే פקד ధాతువు ‘స్థానం’ అనే కర్తతో వస్తుంది; సందర్భానుసారం ఆ స్థానం ఆక్రమించబడకపోవడం లేదా ఖాళీగా ఉండడం అనే ఫలితార్థాన్ని ఇస్తుంది.
- source_word: מוֹשָׁבֶךָ
  choice: నీ స్థానం
  rationale: రాజభోజనంలో దావీదుకు నియమించబడిన కూర్చునే చోటును సూచిస్తుంది; ‘స్థానం’ తెలుగు సందర్భంలో సహజంగా ఉండి ‘సీటు’ కంటే గౌరవప్రదంగా వినిపిస్తుంది.
