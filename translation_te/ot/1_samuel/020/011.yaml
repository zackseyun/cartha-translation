  yaml_path: translation/ot/1_samuel/020/011.yaml
  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
translation:
  language: te
  text: అప్పుడు యోనాతాను దావీదుతో, “రా, మనం పొలంలోకి వెళ్దాం” అన్నాడు.[a] వారిద్దరూ పొలంలోకి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వెళ్లు, మనం పొలంలోకి వెళ్దాం.” לְכָה అనే ఆజ్ఞారూపాన్ని మరింత పదశఃగా “వెళ్లు” అని అనువదించవచ్చు; అయితే కలిసి వెళ్లమనే ఆహ్వాన సందర్భంలో “రా” అనేది తెలుగులో సహజంగా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని తదుపరి సంఘటనకు తీసుకెళ్తుంది; ఆధునిక తెలుగు కథన శైలిలో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తి పేరు రూపం.
- source_word: אֶל דָּוִד
  choice: దావీదుతో
  rationale: మాట్లాడే క్రియతో సహజమైన తెలుగు ప్రయోగం; హెబ్రీలోని సంబోధన సంబంధాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: לְכָה
  choice: రా
  rationale: పదశః ‘వెళ్లు’ అనే అర్థం సాధ్యమైనా, కలిసి వెళ్లమని ఆహ్వానిస్తున్న సందర్భంలో తెలుగు ‘రా’ సహజంగా ఉంటుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְנֵצֵא
  choice: మనం ... వెళ్దాం
  rationale: మొదటి పురుష బహువచన కోహోర్టేటివ్‌లోని ఉమ్మడి ప్రతిపాదన లేదా ఆహ్వాన భావాన్ని ‘వెళ్దాం’ స్పష్టంగా అందిస్తుంది.
- source_word: הַשָּׂדֶה
  choice: పొలంలోకి
  rationale: שׂדה సాధారణంగా పొలం లేదా బహిరంగ ప్రదేశాన్ని సూచిస్తుంది. గమనాన్ని తెలిపే క్రియతో ‘పొలంలోకి’ సహజం; మూలంలోని పునరుక్తిని రెండుసార్లూ నిలిపాం.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: వారిద్దరూ ... వెళ్లారు
  rationale: ద్వివచన భావం ఇద్దరూ కలిసి వెళ్లారనే నొక్కును ఇస్తుంది; ‘వారిద్దరూ’ దాన్ని సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
