  text: Then Jonathan said to David[a], “What does your soul say? I will do it for you.”
translation:
  language: te
  text: అప్పుడు యోనాతాను దావీదుతో, “నీ మనసు ఏమి కోరుతోంది? నేను అది నీ కోసం చేస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ రూపం.
- source_word: אֶל דָּוִד
  choice: దావీదుతో
  rationale: సంభాషణలో ఉద్దేశింపబడిన వ్యక్తిని తెలుగులో సహజంగా సూచించే రూపం.
- source_word: מַה תֹּאמַר נַפְשְׁךָ
  choice: నీ మనసు ఏమి కోరుతుందో చెప్పు
  rationale: అక్షరార్థంగా ‘నీ నెఫెష్ ఏమి చెబుతుందో’ అయినా, ఇక్కడ נֶפֶשׁ అంతరంగ కోరికను సూచిస్తుంది. తెలుగు భాషలో ‘నీ మనసు ఏమి కోరుతుందో’ మూలంలోని వ్యక్తిగత కోరిక భావాన్ని సహజంగా అందిస్తుంది; ‘చెప్పు’ సంభాషణలోని ప్రశ్న/ఆహ్వాన బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: నేను నీ కోసం అది చేస్తాను
  rationale: עָשָׂה యొక్క సాధారణ అర్థం ‘చేయడం’; לְ ప్రయోజనార్థకంగా ‘నీ కోసం’ అని ఇవ్వబడింది. తెలుగులో అవసరమైన సూచక కర్మగా ‘అది’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. ‘ఆత్మ’ అనే పదం ఇక్కడ అనవసరంగా సాంకేతిక లేదా సిద్ధాంతపరమైన భావాన్ని కలిగించవచ్చు కాబట్టి, సందర్భానుసారంగా ‘మనసు’ ఎంచుకోబడింది.
