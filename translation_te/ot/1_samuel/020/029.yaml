source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר שַׁלְּחֵ֣/נִי נָ֡א כִּ֣י זֶבַח֩ מִשְׁפָּחָ֨ה לָ֜/נוּ בָּ/עִ֗יר וְ/ה֤וּא צִוָּֽה לִ/י֙ אָחִ֔/י וְ/עַתָּ֗ה אִם מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אִמָּ֥לְטָה נָּ֖א וְ/אֶרְאֶ֣ה אֶת אֶחָ֑/י עַל כֵּ֣ן לֹא בָ֔א אֶל שֻׁלְחַ֖ן הַ/מֶּֽלֶךְ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “దయచేసి నన్ను వెళ్లనివ్వండి. పట్టణంలో మా కుటుంబ బలి ఉంది; నా సోదరుడే నాకు ఆజ్ఞాపించాడు. ఇప్పుడు మీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే, దయచేసి నేను తప్పించుకొని వెళ్లి[a] నా సోదరులను[b] చూడనివ్వండి.” అందువల్ల అతడు రాజు భోజన బల్లకు రాలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ క్రియకు “తప్పించుకొని వెళ్లడం” లేదా “ఎవరికీ తెలియకుండా జారుకోవడం” అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నా సోదరులు” అనేది దావీదు యొక్క సొంత సోదరులను లేదా కుటుంబ సమూహంలోని సమీప పురుష బంధువులను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  choice: దయచేసి నన్ను వెళ్లనివ్వండి
  rationale: שׁלח అనే క్రియ ఇక్కడ బయలుదేరడానికి అనుమతి కోరుతోంది; נָא లోని మర్యాదపూర్వక విన్నపాన్ని ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: זֶבַח מִשְׁפָּחָה
  choice: మా కుటుంబం అర్పించే బలి
  rationale: זֶבַח యొక్క బలి సంబంధమైన భావాన్ని నిలుపుతూ, מִשְׁפָּחָה సూచించే కుటుంబ లేదా వంశ సమూహాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְהוּא צִוָּה לִי אָחִי
  choice: నా సోదరుడే నాకు ఆజ్ఞాపించాడు
  rationale: ప్రత్యేక సర్వనామమైన הוּא ఇచ్చే ఉద్ఘాటనను తెలుగులో ‘సోదరుడే’ ద్వారా నిలిపి, צִוָּה యొక్క బలమైన ఆదేశ భావాన్ని ‘ఆజ్ఞాపించాడు’గా అందించింది.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: మీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే
  rationale: హీబ్రూ మర్యాదపూర్వక వాక్యరీతిలోని ‘మీ కళ్లలో’ అనే రూపకాన్ని సహజ తెలుగులో ‘మీ దృష్టిలో’గా ఉంచింది.
- source_word: אִמָּלְטָה נָּא
  choice: దయచేసి నేను తప్పించుకొని వెళ్లి
  rationale: מלט క్రియలో ఉన్న తప్పించుకోవడం లేదా జారుకోవడం అనే భావాన్ని ప్రధాన పాఠంలో ‘తప్పించుకొని వెళ్లి’గా ఇచ్చి, దాని సందర్భానుసార సూక్ష్మార్థాన్ని పాదసూచికలో తెలిపింది.
- source_word: וְאֶרְאֶה אֶת אֶחָי
  choice: నా సోదరులను చూసేలా
  rationale: ראה యొక్క మౌలిక ‘చూడడం’ భావాన్ని, אֶחָי యొక్క పురుష బంధువులను సూచించే పదరూపాన్ని నిలిపింది.
- source_word: עַל כֵּן
  choice: అందువల్ల
  rationale: దావీదు రాజు భోజనానికి రాకపోవడానికి ముందున్న మాటను కారణంగా చూపే అనుసంధానాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֶל שֻׁלְחַן הַמֶּלֶךְ
  choice: రాజు భోజన బల్లకు
  rationale: రాజు సమక్షంలోని భోజన సందర్భాన్ని స్పష్టపరుస్తూ మూలంలోని ‘రాజు బల్లకు’ అనే నిర్మాణానికి దగ్గరగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యశైలిని వాడింది. మర్యాదపూర్వక విన్నపం, హీబ్రూ ఉద్ఘాటన, బలి సంబంధమైన పదార్థం, అలాగే ‘తప్పించుకోవడం/జారుకోవడం’ మరియు ‘సోదరులు/పురుష బంధువులు’ అనే అస్పష్టతలను నిలిపింది.
