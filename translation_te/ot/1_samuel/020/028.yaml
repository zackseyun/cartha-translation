  text: Jonathan answered Saul[a], “David earnestly asked leave of me to go to Bethlehem.”
translation:
  language: te
  text: 'యోనాతాను సౌలుకు ఇలా జవాబిచ్చాడు: “దావీదు బేత్లెహేముకు వెళ్లడానికి నా దగ్గర ఎంతో వేడుకొని అనుమతి కోరాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: సంభాషణ సందర్భంలో ענה అనే క్రియకు సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: אֶת שָׁאוּל
  choice: సౌలుకు
  rationale: హీబ్రూలో నేర కర్మగా ఉన్న సంబోధిత వ్యక్తిని తెలుగులో ‘సౌలుకు జవాబిచ్చాడు’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: ఎంతో వేడుకొని అనుమతి అడిగాడు
  rationale: క్రియతో కూడిన infinitive absolute అభ్యర్థనలోని బలాన్ని నొక్కిచెబుతుంది. సందర్భానుసారంగా అనుమతి కోరడాన్ని స్పష్టంగా, సహజంగా తెలిపే రూపం.
- source_word: מֵעִמָּדִי
  choice: నన్ను
  rationale: యోనాతాను సమక్షం లేదా అధికారంనుంచి అనుమతి కోరిన భావాన్ని తెలుగు వాక్య నిర్మాణంలో ‘నన్ను ... అనుమతి అడిగాడు’ అని సహజంగా తెలిపాం.
- source_word: עַד בֵּית לָחֶם
  choice: బేత్లెహేముకు వెళ్లడానికి
  rationale: గమ్యస్థానాన్ని సూచించే పదబంధంలోని అంతర్నిహిత గమన భావాన్ని సందర్భానుసారంగా స్పష్టం చేశాం.
- source_word: בֵּית לָחֶם
  choice: బేత్లెహేము
  rationale: తెలుగులో స్థిరపడిన స్థలనామ రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ emphatic construction‌ను ‘ఎంతో వేడుకొని’ ద్వారా ప్రధాన పాఠ్యంలోనే ప్రతిబింబించినందున పాదసూచిక అవసరం లేదు.
