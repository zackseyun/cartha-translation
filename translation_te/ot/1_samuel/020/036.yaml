  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ רֻ֗ץ מְצָ֥א נָא֙ אֶת הַ֣/חִצִּ֔ים אֲשֶׁ֥ר אָנֹכִ֖י מוֹרֶ֑ה הַ/נַּ֣עַר רָ֔ץ וְ/הֽוּא יָרָ֥ה הַ/חֵ֖צִי לְ/הַעֲבִרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/036.yaml
  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
translation:
  language: te
  text: అతడు తన యువకునితో[a], “పరుగెత్తు, దయచేసి, నేను వేస్తున్న బాణాలను వెదికి కనుక్కో” అన్నాడు. ఆ యువకుడు పరుగెత్తాడు; యోనాతాను ఆ బాణాన్ని అతని అవతలికి వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన పరిచారకునితో” లేదా “తన సేవకునితో.” హీబ్రూ పదం యువకుణ్ణి, పరిచారకుణ్ణి లేదా సేవకుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  choice: తన యువ సేవకునితో / ఆ యువ సేవకుడు
  rationale: נַעַר అనే పదం యువకుణ్ణి, పరిచారకుణ్ణి లేదా సేవకుణ్ణి సూచించగలదు. ఇక్కడ యోనాతాను వెంట ఉన్న పరిచారకుడే ఉద్దేశం; ‘యువ సేవకుడు’ వయస్సు, పాత్ర రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: רוּץ
  choice: పరుగెత్తు
  rationale: ఆజ్ఞారూపంలోని רוץ స్పష్టంగా పరుగెత్తడమనే భౌతిక చర్యను సూచిస్తుంది.
- source_word: מְצָא נָא
  choice: దయచేసి వెదికి తీసుకురా
  rationale: מצא ప్రాథమికంగా ‘కనుగొను/వెదికి కనుగొను’; సందర్భంలో బాణాలను సేకరించి తిరిగి తీసుకురావడం ఉద్దేశం. נָא లోని మృదువైన అభ్యర్థనా భావాన్ని ‘దయచేసి’ నిలుపుతుంది.
- source_word: הַחִצִּים
  choice: బాణాలను
  rationale: మూలంలోని బహువచనాన్ని నేరుగా నిలిపింది.
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  choice: నేను వేస్తున్న
  rationale: ירה యొక్క క్రియావిశేషణ రూపం సందర్భంలో కొనసాగుతున్న లేదా వెంటనే జరుగనున్న బాణాలు వేయడాన్ని సూచిస్తుంది; తెలుగులో ‘వేస్తున్న’ సహజంగా ఉంటుంది.
- source_word: וְהוּא יָרָה הַחֵצִי
  choice: అతడు బాణాన్ని ... వేశాడు
  rationale: మూలంలోని ఏకవచన నిర్దిష్ట రూపాన్ని ‘బాణాన్ని’గా నిలిపింది; ముందున్న బహువచనం తరువాత వచ్చిన ఈ ఏకవచనాన్ని సరిచేయలేదు.
- source_word: לְהַעֲבִירוֹ
  choice: వాని అవతలికి వెళ్లేలా
  rationale: עבר హిఫీల్ రూపం బాణం యువ సేవకుణ్ణి దాటి వెళ్లేలా చేయడాన్ని సూచిస్తుంది. 3ms ప్రత్యయం ఎవరిని లేదా దేనిని సూచిస్తుందనే వ్యాకరణ అస్పష్టత ఉన్నా, కథా సందర్భంలో యువ సేవకుణ్ణి దాటడమే ప్రధాన భావం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘వాని’ అనేది సమీపంలోని యువ సేవకుణ్ణి స్పష్టంగా సూచిస్తూ, ‘అతడు’ అనే కర్తతో గందరగోళాన్ని తగ్గిస్తుంది. మూలంలోని బాణాలు/బాణం సంఖ్యా మార్పు అలాగే నిలుపబడింది.
