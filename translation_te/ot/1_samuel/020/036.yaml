revisions:
- from: అతడు తన యువ సేవకునితో[a], “పరుగెత్తు; నేను వేస్తున్న బాణాలను దయచేసి వెదికి తీసుకురా” అన్నాడు. ఆ యువ సేవకుడు పరుగెత్తుతుండగా, అతడు బాణాన్ని వాని అవతలికి వెళ్లేలా వేశాడు.
  to: అతడు తన యువకునితో[a], “పరుగెత్తు, దయచేసి, నేను వేస్తున్న బాణాలను వెదికి కనుక్కో” అన్నాడు. ఆ యువకుడు పరుగెత్తాడు; యోనాతాను ఆ బాణాన్ని అతని అవతలికి వేశాడు.
  rationale: The revision removes the unsupported instruction to return with the arrows, represents the young man’s running as a completed narrative action, and clarifies the final referents in idiomatic modern Telugu. It preserves the source’s plural ‘arrows’ followed by singular ‘the arrow’ and the directional sense that the arrow went beyond the young man.
