source:
  edition: WLC
  text: וַ/יַּ֨עַן֙ יְה֣וֹנָתָ֔ן אֶת שָׁא֖וּל אָבִ֑י/ו וַ/יֹּ֧אמֶר אֵלָ֛י/ו לָ֥/מָּה יוּמַ֖ת מֶ֥ה עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/032.yaml
  text: Jonathan answered Saul his father and said to him[a], “Why should he be put to death? What has he done?”
translation:
  language: te
  text: యోనాతాను తన తండ్రియైన సౌలుకు జవాబిచ్చి, అతనితో, “అతను ఎందుకు చంపబడాలి?[a] అతడు ఏమి చేశాడు?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి ఎందుకు మరణశిక్ష విధించాలి?” హీబ్రూ క్రియ కేవలం చనిపోవడాన్ని కాకుండా, ఒకరిని చంపడం లేదా మరణశిక్షకు గురిచేయడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిస్తూ
  rationale: కథన సంభాషణలో ענה అంటే ‘జవాబిచ్చాడు/ప్రతిస్పందించాడు’; వెంటనే వచ్చే וַיֹּאמֶר‌తో సహజమైన ఆధునిక తెలుగు వాక్యంగా కలిపి అనువదించబడింది.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶת שָׁאוּל אָבִיו
  choice: తన తండ్రి సౌలుకు
  rationale: సౌలు యోనాతాను తండ్రి అనే సంబంధాన్ని స్పష్టంగా ఉంచుతూ, తెలుగులో సహజమైన పదక్రమాన్ని వాడాం.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: అని అడిగాడు
  rationale: అక్షరార్థంగా ‘అతనితో అన్నాడు’; అయితే తరువాత రెండు ప్రశ్నలు ఉన్నందున తెలుగులో ‘అని అడిగాడు’ సహజంగా ఉంది. సంబోధితుడు ‘సౌలుకు’ ద్వారా ఇప్పటికే స్పష్టమవుతున్నాడు.
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: నేరుగా కారణాన్ని ప్రశ్నించే సాధారణ ఆధునిక తెలుగు రూపం.
- source_word: יוּמַת
  choice: చంపాలి
  rationale: מות యొక్క హొఫాల్ రూపం కేవలం ‘చనిపోవడం’ కాక, ‘చంపబడడం/మరణశిక్షకు గురికావడం’ అనే కారక-కర్మణి భావాన్ని కలిగిస్తుంది. సందర్భంలోని ప్రశ్నార్థక అవసరభావాన్ని సహజ తెలుగులో ‘చంపాలి’ తెలియజేస్తుంది.
- source_word: מֶה עָשָׂה
  choice: అతడు ఏమి చేశాడు?
  rationale: ఆరోపించబడిన నేరం లేదా తప్పు ఏమిటని ప్రశ్నించే హీబ్రూ భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
