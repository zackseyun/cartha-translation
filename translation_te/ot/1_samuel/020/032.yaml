revisions:
- from: యోనాతాను తన తండ్రి సౌలుకు జవాబిస్తూ, “అతన్ని ఎందుకు చంపాలి?[a] అతడు ఏమి చేశాడు?” అని అడిగాడు.
  to: యోనాతాను తన తండ్రియైన సౌలుకు జవాబిచ్చి, అతనితో, “అతను ఎందుకు చంపబడాలి?[a] అతడు ఏమి చేశాడు?” అన్నాడు.
