translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంభాషణ శైలి. ‘జవాబిస్తూ … అని అడిగాడు’ అనే నిర్మాణం హీబ్రూలోని వరుస సంభాషణ సూత్రాలను తెలుగులో అనవసర పునరుక్తి లేకుండా ప్రతిబింబిస్తుంది.
