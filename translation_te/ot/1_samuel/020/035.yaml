  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יֵּצֵ֧א יְהוֹנָתָ֛ן הַ/שָּׂדֶ֖ה לְ/מוֹעֵ֣ד דָּוִ֑ד וְ/נַ֥עַר קָטֹ֖ן עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/035.yaml
  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
translation:
  language: te
  text: ఉదయం యోనాతాను దావీదుతో నిర్ణయించుకున్న కలయిక కోసం[a] పొలానికి బయలుదేరాడు. ఒక చిన్న బాలుడు[b] అతనితో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదుతో నిర్ణయించుకున్న సమయానికి.” హీబ్రూ పదం מוֹעֵד నిర్ణయించిన సమయాన్ని లేదా నిర్ణయించిన కలయికను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒక చిన్నవాడు,” లేదా “ఒక యువ సేవకుడు.” హీబ్రూ పదం נַעַר సందర్భాన్ని బట్టి బాలుణ్ణి, యువకుణ్ణి లేదా సేవకుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: ఉదయం
  rationale: కథన క్రమాన్ని తెలిపే וַיְהִיని తెలుగులో విడిగా అనువదించడం సహజం కాదు; בַבֹּקֶר తెలిపే కాలాన్ని ‘ఉదయం’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: וַיֵּצֵא
  choice: బయలుదేరాడు
  rationale: יצאలోని బయటికి వెళ్లడం అనే దిశాభావాన్ని సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: הַשָּׂדֶה
  choice: పొలానికి
  rationale: שָׂדֶה ఇక్కడ ముందటి సందర్భంలో పేర్కొన్న బహిరంగ పొలాన్ని సూచిస్తుంది.
- source_word: לְמוֹעֵד דָּוִד
  choice: దావీదుతో నిర్ణయించుకున్న కలయిక కోసం
  rationale: מוֹעֵדకు నిర్ణయించిన సమయం లేదా నిర్ణయించిన కలయిక అనే రెండు భావాలు సాధ్యం; సందర్భంలో దావీదుతో ముందుగా ఏర్పాటు చేసుకున్న కలయిక ప్రధానంగా కనిపిస్తుంది.
- source_word: וְנַעַר קָטֹן
  choice: ఒక చిన్నవాడు
  rationale: נַעַר బాలుడు, యువకుడు లేదా సేవకుడు కావచ్చు; קָטֹן అతని చిన్న వయస్సు లేదా పరిమాణాన్ని నొక్కి చెబుతుంది. ‘చిన్నవాడు’ ఈ అస్పష్టతను కొంతవరకు నిలుపుతుంది.
- source_word: עִמּוֹ
  choice: అతనితో ఉన్నాడు
  rationale: సహవాసాన్ని తెలిపే హీబ్రూ పదబంధాన్ని తెలుగులో సంపూర్ణ వాక్యంగా సహజంగా వ్యక్తం చేశాం.
