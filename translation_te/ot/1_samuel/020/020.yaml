  text: וַ/אֲנִ֕י שְׁלֹ֥שֶׁת הַ/חִצִּ֖ים צִדָּ֣/ה אוֹרֶ֑ה לְ/שַֽׁלַּֽח לִ֖/י לְ/מַטָּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/020.yaml
  text: And I will shoot the three arrows to the side of it[c][b][a], as though I were shooting for myself at a target.
translation:
  language: te
  text: నేను ఆ మూడు బాణాలను ఒక పక్కకు[a][b] వేస్తాను, ఒక లక్ష్యంపై బాణాలు వేస్తున్నట్టుగా[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రూలో ‘ఒక పక్కకు’ అనే దిశాసూచక రూపం ఉంది; ఇక్కడ అది ఏ నిర్దిష్ట వస్తువును స్పష్టంగా పేర్కొనదు.
    reason: cross_reference
  - marker: b
    text: లేదా ‘ఒక వైపుకు’ లేదా ‘పక్కనికి.’
    reason: lexical_alternative
  - marker: c
    text: హెబ్రూ మాటబంధం అక్షరార్థంగా ‘నాకోసం లక్ష్యానికి పంపడానికి’ అని ఉంటుంది. సందర్భంలో, లక్ష్యంపై బాణాలు వేస్తున్నట్టు కనిపించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: నేను
  rationale: స్వతంత్ర సర్వనామం యోనాతాను చేయబోయే పనిపై దృష్టిని మళ్లిస్తుంది. తెలుగులో క్రియారూపంతో కర్త తెలిసినా, ‘నేను’ అని స్పష్టంగా ఉంచడం ఈ ఉద్ఘాటనను కాపాడుతుంది.
- source_word: שְׁלֹשֶׁת הַחִצִּים
  choice: ఆ మూడు బాణాలను
  rationale: నిర్దిష్ట రూపం ముందుగా నిర్ణయించిన సంకేతంలో ఉపయోగించే ప్రత్యేకమైన మూడు బాణాలను సూచిస్తుంది; ‘ఆ’ తెలుగులో ఆ నిర్దిష్టతను సహజంగా తెలియజేస్తుంది.
- source_word: צִדָּה
  choice: దాని పక్కకు
  rationale: దిశను సూచించే భావంతో పాటు స్త్రీలింగ ఏకవచన ప్రత్యయాన్ని నిలుపుతుంది. ఆ ప్రత్యయం సందర్భంలోని రాయి లేదా గుర్తును సూచించే అవకాశం ఉన్నా, ప్రధాన పాఠ్యంలో దానిని నిర్దిష్టంగా పేర్కొనలేదు.
- source_word: אוֹרֶה
  choice: వేస్తాను
  rationale: ירה హిఫీల్ రూపం విలువిద్య సందర్భంలో బాణం వేయడాన్ని సూచిస్తుంది. తెలుగులో ‘బాణాలు వేస్తాను’ సహజమైన వాడుక.
- source_word: לְשַׁלַּח לִי
  choice: బాణాలు వేయడం సాధన చేస్తున్నట్టుగా
  rationale: అక్షరార్థ అనువాదం తెలుగులో అసహజంగా ఉంటుంది. సందర్భంలో యోనాతాను సాధారణంగా విలువిద్య సాధన చేస్తున్నట్టు కనిపించాలనే ఉద్దేశాన్ని ఈ రూపం స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְמַטָּרָה
  choice: ఒక గురిపై
  rationale: מַטָּרָה విలువిద్యలో గురి లేదా లక్ష్యాన్ని సూచిస్తుంది. ‘ఒక గురిపై’ అనిర్దిష్టతను, బాణం వేసే లక్ష్యభావాన్ని రెండింటినీ నిలుపుతుంది.
