  yaml_path: translation/ot/1_samuel/020/040.yaml
  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
translation:
  language: te
  text: అప్పుడు యోనాతాను తన ఆయుధాలను తన సేవకుడైన యువకునికి ఇచ్చి, “వెళ్లు, వీటిని పట్టణానికి తీసుకెళ్లు” అని అతనితో అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆయుధాలు’ అని అనువదించిన హీబ్రూ పదానికి ‘సామగ్రి’ లేదా ‘పరికరాలు’ అనే విస్తృత అర్థం కూడా ఉండవచ్చు. ఇక్కడ విల్లు, బాణాల సందర్భం వల్ల ‘ఆయుధాలు’ అని అనువదించాం. ‘వీటిని’ అనే కర్మ హీబ్రూలో స్పష్టంగా లేదు; ముందున్న ఆయుధాలను సూచిస్తూ తెలుగులో చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చి
  rationale: נתן అనే సాధారణ క్రియకు సందర్భానుకూలమైన సహజ కథన రూపం.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన నామరూపం.
- source_word: כֵּלָיו
  choice: తన ఆయుధాలను
  rationale: כְּלִיకి పరికరాలు లేదా సామగ్రి అనే విస్తృత అర్థం ఉన్నా, విల్లు-బాణాల సందర్భంలో ‘ఆయుధాలు’ సముచితం.
- source_word: הַנַּעַר אֲשֶׁר לוֹ
  choice: తన సేవకుడైన యువకునికి
  rationale: נַעַר యువకుడు లేదా సేవకుణ్ణి సూచించగలదు; אֲשֶׁר לוֹ అతడు యోనాతానుకు చెందిన పరిచారకుడని తెలియజేస్తుంది. తెలుగు సహజత్వం కోసం రెండింటినీ సంక్షిప్తంగా కలిపాం.
- source_word: וַיֹּאמֶר לוֹ
  choice: అని అతనితో అన్నాడు
  rationale: אמר యొక్క సాధారణ ‘అను/చెప్పు’ భావాన్ని పారదర్శకంగా ఉంచుతుంది.
- source_word: לֵךְ
  choice: వెళ్లు
  rationale: הלך ఆజ్ఞార్థక రూపానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: הָבֵיא
  choice: వీటిని పట్టణానికి తీసుకెళ్లు
  rationale: בוא హిఫీల్ సాధారణంగా ‘తీసుకురా’ అయినా, మాట్లాడుతున్న స్థలం నుంచి పట్టణానికి పంపే సందర్భంలో తెలుగు దిశా-వాడుక ప్రకారం ‘తీసుకెళ్లు’ సహజం; కర్మను ముందున్న ఆయుధాల నుంచి పూరించాం.
- source_word: הָעִיר
  choice: పట్టణానికి
  rationale: עִיר నగరం లేదా పట్టణం కావచ్చు; ఈ సందర్భంలో తెలుగు సాధారణ వాడుకకు ‘పట్టణం’ సరిపోతుంది.
