  text: וַ/יִּשָּׁבַ֨ע ע֜וֹד דָּוִ֗ד וַ/יֹּ֨אמֶר֙ יָדֹ֨עַ יָדַ֜ע אָבִ֗י/ךָ כִּֽי מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וַ/יֹּ֛אמֶר אַל יֵֽדַע זֹ֥את יְהוֹנָתָ֖ן פֶּן יֵֽעָצֵ֑ב וְ/אוּלָ֗ם חַי יְהוָה֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ כִּ֣י כְ/פֶ֔שַׂע בֵּינִ֖/י וּ/בֵ֥ין הַ/מָּֽוֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: te
  text: 'అయితే దావీదు మళ్లీ ప్రమాణం చేసి ఇలా అన్నాడు: “నీ దృష్టిలో నాకు అనుగ్రహం లభించిందని నీ తండ్రికి బాగా తెలుసు. అందుకే, ‘యోనాతానుకు ఈ విషయం తెలియకూడదు; లేకపోతే అతడు బాధపడతాడు’ అని అతడు అన్నాడు. అయితే యెహోవా జీవం తోడు, నీ ప్రాణం తోడు—నాకూ మరణానికీ మధ్య ఒక్క అడుగు దూరమే ఉంది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֹעַ יָדַע
  choice: బాగా తెలుసు
  rationale: మూలంలోని క్రియాపునరుక్తి బలమైన నిశ్చయాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘బాగా తెలుసు’ దానిని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో నాకు అనుగ్రహం లభించింది
  rationale: హీబ్రూ నుడికారంలోని అనుకూలత/ఆదరణ భావాన్ని నిలుపుతూ, గౌరవప్రదమైన సహజ తెలుగు వాడబడింది.
- source_word: אַל יֵדַע זֹאת יְהוֹנָתָן
  choice: యోనాతానుకు ఈ విషయం తెలియకూడదు
  rationale: ఇది ప్రత్యక్ష ఆజ్ఞగా కాక, యోనాతాను తెలుసుకోకూడదనే సౌలు ఉద్దేశంగా సందర్భంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: וְאוּלָם
  choice: అయితే
  rationale: ముందటి వాదనకు వ్యతిరేకంగా దావీదు చెప్పే గంభీర నిశ్చయాన్ని సూచిస్తుంది.
- source_word: חַי יְהוָה וְחֵי נַפְשֶׁךָ
  choice: యెహోవా జీవం తోడు, నీ ప్రాణం తోడు
  rationale: రెండు ప్రమాణ సూత్రాల సమాంతర నిర్మాణాన్ని నిలుపుతూ తెలుగులో ప్రమాణార్థకంగా వినిపించే రూపం.
- source_word: כְפֶשַׂע
  choice: ఒక్క అడుగు దూరమే
  rationale: మూలపదం చిన్న అడుగు లేదా అతి స్వల్ప అంతరాన్ని సూచిస్తుంది; మరణం అత్యంత సమీపంలో ఉందనే రూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יהוה ప్రతిపాదన
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని పేరుగా ప్రతిబింబించడం మూలాధారానికి దగ్గరగా ఉంటుంది; సాధారణ బిరుదుగా మార్చలేదు.
- issue: ‘నీ ప్రాణం జీవించునట్లు’ అనే ప్రమాణ సూత్రం
  choice: నీ ప్రాణం తోడు
  alternative: నీ ప్రాణం జీవించునట్లు
  rationale: ప్రమాణ స్వభావాన్ని సహజ తెలుగులో నిలిపింది; ఇది మానవ ప్రాణం గురించి ప్రత్యేక సిద్ధాంత ప్రకటనగా విస్తరించబడలేదు.
- issue: సౌలు మాటనా, ఆలోచనా అన్న అస్పష్టత
  choice: ‘...’ అని అతడు అనుకున్నాడు
  alternative: ‘...’ అని అతడు అన్నాడు
  rationale: וַיֹּאמֶר పదశః ‘అన్నాడు’ అయినప్పటికీ ఇక్కడ సౌలు తనలో తాను నిర్ణయించుకున్న భావం కావచ్చు; సందర్భానుసారంగా సహజీకరించాం, కానీ ఉద్దేశాన్ని మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కథన శైలి. ప్రమాణ వాక్యంలోని సమాంతరతను, మరణం సమీపంలో ఉందనే రూపకాన్ని నిలిపి, అసహజ పదశః నిర్మాణాలను నివారించాం.
