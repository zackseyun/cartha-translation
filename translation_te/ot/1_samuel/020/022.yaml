source:
  edition: WLC
  text: וְ/אִם כֹּ֤ה אֹמַר֙ לָ/עֶ֔לֶם הִנֵּ֥ה הַ/חִצִּ֖ים מִמְּ/ךָ֣ וָ/הָ֑לְאָה לֵ֕ךְ כִּ֥י שִֽׁלַּחֲ/ךָ֖ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/022.yaml
  text: But if I say this to the young man[a], ‘Look, the arrows are beyond you,’ then go, for Yahweh has sent you away.
translation:
  language: te
  text: కాని నేను ఆ యువకునితో, ‘చూడు, బాణాలు నీ అవతల ఉన్నాయి’ అని చెబితే, నీవు వెళ్లిపో; ఎందుకంటే యాహ్వే నిన్ను పంపివేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: కాని ... చెబితే
  rationale: ముందటి సంకేతానికి భిన్నమైన పరిస్థితిని సూచించే షరతుగా సందర్భానుసారమైన వ్యతిరేక భావాన్ని నిలుపుతుంది.
- source_word: לָעֶלֶם
  choice: ఆ యువకునితో
  rationale: עֶלֶם అంటే యువకుడు; ‘సేవకుడు’ అనే పాత్రను మూలపాఠం స్పష్టంగా చెప్పనందున దాన్ని చేర్చలేదు.
- source_word: הִנֵּה
  choice: చూడు
  rationale: దృష్టిని ఆకర్షించే హీబ్రూ అవ్యయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַחִצִּים מִמְּךָ וָהָלְאָה
  choice: బాణాలు నీకు అవతల ఉన్నాయి
  rationale: బాణాలు యువకుణ్ణి దాటి మరింత దూరంలో ఉన్నాయనే స్థలార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לֵךְ
  choice: నీవు వెళ్లిపో
  rationale: ఆజ్ఞార్థక క్రియను నేరుగా అనువదిస్తూ, సందర్భంలోని అక్కడి నుంచి బయలుదేరే భావాన్ని తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వెళ్లిపోవాలనే ఆజ్ఞకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: שִׁלַּחֲךָ
  choice: నిన్ను పంపివేశాడు
  rationale: పంపడం అనే ప్రాథమిక భావంతో పాటు, ఈ సందర్భంలో దావీదు అక్కడి నుంచి వెళ్లవలసిన భావాన్ని ‘పంపివేశాడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే దైవనామ రూపాన్ని ఉపయోగించి, మూలంలోని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయలేదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా పేరుగానే ఉంచాం. ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: దేవుడు దావీదును పంపినట్టు చెప్పే వాక్యం
  choice: ఎందుకంటే యెహోవా నిన్ను పంపివేశాడు
  alternative: ఎందుకంటే యెహోవా నిన్ను వెళ్లనిచ్చాడు
  rationale: שׁלח క్రియలోని ‘పంపు’ భావాన్ని నిలిపి, దావీదు వెళ్లిపోవడాన్ని దేవుని కార్యంగా పేర్కొనే మూలపాఠంలోని వేదాంతపరమైన ఉద్వేగాన్ని సడలించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన సంభాషణ శైలి. అనవసరంగా ప్రాచీన పదజాలాన్ని ఉపయోగించలేదు; మూలంలోని షరతు, సంకేతం, ఆజ్ఞ, కారణ సంబంధాలను స్పష్టంగా నిలిపాం.
