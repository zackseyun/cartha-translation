  text: So David hid himself in the field. When the new moon came[a], the king sat down to eat the meal.
translation:
  language: te
  text: దావీదు పొలంలో దాక్కున్నాడు. అమావాస్య వచ్చినప్పుడు, రాజు భోజనం[a] చేయడానికి కూర్చున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘రొట్టె వద్ద తినడానికి కూర్చున్నాడు’; ఇక్కడ ‘రొట్టె’ మొత్తం భోజనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּתֵר
  choice: దాక్కున్నాడు
  rationale: סתר యొక్క నిఫాల్ రూపం ఈ సందర్భంలో దావీదు తనను తాను దాచుకున్నాడనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘దాక్కున్నాడు’ సహజంగా ఉండి, అతని ఉద్దేశపూర్వక చర్యను తెలియజేస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: שָׂדֶה యొక్క సాధారణ, ప్రత్యక్ష అర్థం ‘పొలం’; మూలంలోని నిర్దిష్టతను సందర్భానుసారంగా సహజమైన తెలుగులో తెలిపింది.
- source_word: וַיְהִי הַחֹדֶשׁ
  choice: అమావాస్య వచ్చినప్పుడు
  rationale: ఈ కథన సందర్భంలో חֹדֶשׁ కేవలం నెలను కాక, కొత్త నెల ఆరంభాన్ని సూచించే అమావాస్య సందర్భాన్ని తెలియజేస్తుంది. కాలసూచక వాక్యంగా అనువదించడం తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: וַיֵּשֶׁב
  choice: కూర్చున్నాడు
  rationale: ישׁב ఇక్కడ భోజనం కోసం తన స్థానంలో కూర్చోవడాన్ని సూచిస్తుంది; ‘కూర్చున్నాడు’ ప్రత్యక్షమైన, సహజమైన తెలుగు రూపం.
- source_word: עַל הַלֶּחֶם
  choice: భోజనం
  rationale: అక్షరార్థంగా ‘రొట్టె మీద/వద్ద’ అయినప్పటికీ, לֶחֶם ఇక్కడ సమస్త భోజనానికి సూచకంగా వాడబడింది. అందువల్ల ప్రధాన పాఠ్యంలో ‘భోజనం’ భావాన్ని సహజంగా అందిస్తుంది; అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: לֶאֱכֹל
  choice: చేయడానికి
  rationale: ‘తినడానికి’ అనే ఉద్దేశార్థక క్రియను, ‘భోజనం చేయడానికి’ అనే సహజ తెలుగు ప్రయోగంలో అందించింది.
- source_word: דָּוִד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: మూలంలో సౌలు పేరుకు బదులుగా నిర్దిష్ట బిరుదు ఉంది; కాబట్టి దానిని ‘రాజు’గానే ఉంచాం.
