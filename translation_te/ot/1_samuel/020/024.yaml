  text: וַ/יִּסָּתֵ֥ר דָּוִ֖ד בַּ/שָּׂדֶ֑ה וַ/יְהִ֣י הַ/חֹ֔דֶשׁ וַ/יֵּ֧שֶׁב הַ/מֶּ֛לֶךְ על הַ/לֶּ֖חֶם לֶ/אֱכֽוֹל־׃
