source:
  edition: WLC
  text: אִם כֹּ֥ה יֹאמַ֛ר ט֖וֹב שָׁל֣וֹם לְ/עַבְדֶּ֑/ךָ וְ/אִם חָרֹ֤ה יֶֽחֱרֶה֙ ל֔/וֹ דַּ֕ע כִּֽי כָלְתָ֥ה הָ/רָעָ֖ה מֵ/עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/007.yaml
  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
translation:
  language: te
  text: అతడు, ‘మంచిది’ అని చెబితే, నీ సేవకునికి క్షేమం ఉంటుంది. కానీ అతడు మిక్కిలి కోపపడితే, అతని పక్షాన కీడు నిశ్చయమైందని తెలుసుకో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని నుంచే కీడు పూర్తిగా స్థిరపడిందని తెలుసుకో”; అంటే, హాని చేయాలని సౌలు దృఢంగా నిర్ణయించుకున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: మంచిది
  rationale: సౌలు ఆమోదాన్ని తెలిపే సంక్షిప్త ప్రత్యుత్తరంగా ఉన్న హీబ్రూ విశేషణాన్ని సహజమైన తెలుగు సంభాషణగా అందిస్తుంది.
- source_word: שָׁלוֹם
  choice: క్షేమం ఉంటుంది
  rationale: ఇక్కడ దావీదుకు కలిగే భద్రత, క్షేమం ఉద్దేశించబడ్డాయి; భవిష్యత్ సందర్భార్థాన్ని కూడా ‘ఉంటుంది’ నిలుపుతుంది.
- source_word: לְעַבְדֶּךָ
  choice: నీ సేవకునికి
  rationale: యోనాతాను తనను తాను వినయపూర్వకంగా మూడవ పురుషలో సూచిస్తున్నాడు; ఈ రాజాస్థాన సందర్భంలో ‘సేవకుడు’ సహజంగా ఉంది.
- source_word: חָרֹה יֶחֱרֶה לוֹ
  choice: అతడు మిక్కిలి కోపపడితే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్ మరియు పరిమిత క్రియ కలయికలోని తీవ్రతను ‘మిక్కిలి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: דַּע
  choice: తెలుసుకో
  rationale: సౌలు ప్రతిస్పందననుంచి దావీదు ఒక నిర్ధారణకు రావాలని చెప్పే ప్రత్యక్ష ఆజ్ఞను నిలుపుతుంది.
- source_word: כָלְתָה
  choice: పూర్తిగా నిర్ణయించబడింది
  rationale: కీడు చేయాలనే ఉద్దేశం తుదిగా స్థిరపడిందనే సందర్భార్థాన్ని తెలియజేస్తూనే, ‘పూర్తయింది’ మరియు ‘నిర్ణయించబడింది’ అనే భావాల మధ్య ఉన్న మూలపాఠ్య విస్తృతిని కొంతవరకు నిలుపుతుంది.
- source_word: הָרָעָה
  choice: కీడు
  rationale: సౌలు ఉద్దేశించిన హానిని సూచిస్తూ, హీబ్రూ పదంలోని నైతిక బరువును కూడా నిలుపుతుంది.
- source_word: מֵעִמּוֹ
  choice: అతని దగ్గరనుంచి
  rationale: మూలంలోని ‘నుంచి/అతని పక్షాన’ అనే మూలాధార భావాన్ని కాపాడుతుంది; కీడు సౌలు నుంచే వస్తోందని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘క్షేమం’ ద్వారా שָׁלוֹם యొక్క భద్రత-శ్రేయస్సు భావం, ‘పూర్తిగా నిర్ణయించబడింది’ ద్వారా כָלְתָה యొక్క సంపూర్ణత మరియు స్థిరనిశ్చయ భావాలు నిలుపబడ్డాయి.
