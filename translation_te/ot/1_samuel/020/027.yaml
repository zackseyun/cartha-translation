source:
  edition: WLC
  text: וַ/יְהִ֗י מִֽ/מָּחֳרַ֤ת הַ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י וַ/יִּפָּקֵ֖ד מְק֣וֹם דָּוִ֑ד וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל יְהוֹנָתָ֣ן בְּנ֔/וֹ מַדּ֜וּעַ לֹא בָ֧א בֶן יִשַׁ֛י גַּם תְּמ֥וֹל גַּם הַ/יּ֖וֹם אֶל הַ/לָּֽחֶםס־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/027.yaml
  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
translation:
  language: te
  text: మరుసటి రోజు, అమావాస్య రెండవ రోజున, దావీదు స్థలం ఖాళీగా ఉండింది. అప్పుడు సౌలు తన కుమారుడైన యోనాతానుతో, “యెష్షయి కుమారుడు నిన్నా, ఈ రోజూ భోజనానికి[a] ఎందుకు రాలేదు?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘రొట్టెకు’; ఇది భోజనానికి లేదా భోజన బల్ల వద్ద సహవాసానికి రావడాన్ని సూచించే సాధారణ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרַת הַחֹדֶשׁ הַשֵּׁנִי
  choice: మరుసటి రోజు, అంటే అమావాస్య పండుగ రెండో రోజున
  rationale: מִמָּחֳרַת కాలక్రమంలోని మరుసటి రోజును సూచిస్తుంది; సందర్భంలో חֹדֶשׁ అమావాస్య ఆచరణను, הַשֵּׁנִי దాని రెండో రోజును సూచిస్తుంది. తెలుగు పాఠకునికి సంబంధం స్పష్టంగా ఉండేలా ‘అంటే’తో రెండింటినీ కలిపాం.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: దావీదు స్థలం ఖాళీగా ఉంది
  rationale: ఇక్కడ פקד నిఫాల్ రూపం దావీదు కూర్చునే స్థలం అతడు లేకపోవడం వల్ల ఖాళీగా ఉన్నదనే భావాన్ని ఇస్తుంది. భోజన సందర్భంలో ఈ తెలుగు రూపం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּנוֹ
  choice: తన కుమారుడైన
  rationale: సౌలుతో యోనాతానుకు ఉన్న కుమార సంబంధాన్ని మూలపాఠంలాగే స్పష్టంగా ఉంచుతుంది.
- source_word: בֶן יִשַׁי
  choice: యెష్షయి కుమారుడు
  rationale: సౌలు దావీదును పేరుతో కాక తండ్రి పేరుతో పిలిచిన మూలపాఠపు వాక్చాతుర్యాన్ని, అందులో ఉండగల దూరభావాన్ని మార్చకుండా నిలుపుతుంది.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: నిన్నా, ఈరోజూ
  rationale: రెండు రోజులనూ కలిపి ప్రస్తావించే హెబ్రీ సమాంతర నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל הַלָּחֶם
  choice: భోజనానికి
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినా, ఇక్కడ రాజభోజనంలో పాల్గొనడాన్ని సూచించే పర్యాయప్రయోగం. ‘భోజనానికి’ ఉద్దేశిత భావాన్ని సహజంగా అందిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘యెష్షయి కుమారుడు’ అనే పితృనామ ప్రయోగాన్ని నిలిపి, ‘రొట్టె’ అనే అక్షరార్థం ప్రధాన వాక్యంలో అసహజంగా మారకుండా పాదసూచికలో ఇచ్చాం.
