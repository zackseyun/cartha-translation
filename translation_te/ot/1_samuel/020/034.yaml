source:
  edition: WLC
  text: וַ/יָּ֧קָם יְהוֹנָתָ֛ן מֵ/עִ֥ם הַ/שֻּׁלְחָ֖ן בָּ/חֳרִי אָ֑ף וְ/לֹא אָכַ֞ל בְּ/יוֹם הַ/חֹ֤דֶשׁ הַ/שֵּׁנִי֙ לֶ֔חֶם כִּ֤י נֶעְצַב֙ אֶל דָּוִ֔ד כִּ֥י הִכְלִמ֖/וֹ אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
translation:
  language: te
  text: అప్పుడు యోనాతాను మండుతున్న కోపంతో బల్లను విడిచి లేచాడు. నెల రెండవ రోజున[a] అతడు ఏ ఆహారమూ తినలేదు; ఎందుకంటే దావీదు విషయంలో అతడు దుఃఖించాడు, తన తండ్రి అతనిని[b] అవమానపరిచాడు కాబట్టి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొత్తనెల రెండవ రోజున.” హెబ్రీలోని “నెల” అనే పదం “కొత్తనెల” అని కూడా అర్థం కావచ్చు; ఇక్కడ సందర్భం రాజసభలో జరిగిన కొత్తనెల విందు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలోని “అతనిని” అనే సర్వనామం దావీదును గానీ యోనాతానును గానీ సూచించవచ్చు.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיָּקָם ... מֵעִם הַשֻּׁלְחָן
  choice: బల్ల దగ్గరనుంచి లేచిపోయాడు
  rationale: భోజన సందర్భంలో బల్లను విడిచి లేచిన కదలికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּחֳרִי אָף
  choice: మండుతున్న కోపంతో
  rationale: హెబ్రీ పదబంధంలోని కోపపు వేడి లేదా మండే తీవ్రతను స్పష్టంగా నిలుపుతుంది.
- source_word: וְלֹא אָכַל ... לֶחֶם
  choice: ఏ ఆహారమూ తినలేదు
  rationale: లֶחֶם అక్షరార్థంగా రొట్టె అయినా, ఈ భోజన సందర్భంలో సాధారణంగా ఆహారాన్ని సూచిస్తుంది.
- source_word: בְּיוֹם הַחֹדֶשׁ הַשֵּׁנִי
  choice: నెల రెండవ రోజున
  rationale: חֹדֶשׁ యొక్క సాధారణ అర్థమైన ‘నెల’ను ప్రధాన పాఠ్యంలో ఉంచి, సందర్భసంబంధమైన ‘అమావాస్య పండుగ రెండవ రోజు’ భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: נֶעְצַב אֶל דָּוִד
  choice: దావీదు విషయమై అతడు దుఃఖించాడు
  rationale: నిఫాల్ రూపంలోని బాధపడటం లేదా దుఃఖించడం అనే భావాన్నీ, אֶל సూచించే సంబంధాన్నీ సహజంగా అందిస్తుంది.
- source_word: הִכְלִמוֹ
  choice: దావీదును అవమానపరిచాడు
  rationale: హిఫీల్ రూపం కలిగించే అవమానించడం లేదా సిగ్గుపరచడం అనే బలమైన భావాన్ని వ్యక్తం చేస్తుంది; సర్వనామ సూచనలోని సంభావ్య అస్పష్టతను పాదసూచికలో గుర్తిస్తుంది.
theological_decisions:
- issue: הִכְלִמוֹ లోని ‘అతనిని’ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: దావీదును
  alternative: యోనాతానును
  rationale: సమీపంలోని ‘దావీదు విషయమై’ అనే పదబంధం మరియు దావీదుపట్ల సౌలు ప్రవర్తించిన తీరు దావీదును సూచించే పఠనానికి బలం ఇస్తాయి. అయితే హెబ్రీ పురుష ఏకవచన సర్వనామం యోనాతానును కూడా సూచించగలదు కాబట్టి ఆ నిజమైన అస్పష్టతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మండుతున్న కోపం’ మూలంలోని రూపక తీవ్రతను నిలుపుతుంది. మూలభాషలోని సర్వనామ అస్పష్టతను ప్రధాన పాఠ్యంలో బలవంతంగా తొలగించకుండా పాదసూచికలో సంరక్షించాం.
