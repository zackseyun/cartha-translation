translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. యోనాతాను దావీదుతో మాట్లాడుతున్న సందర్భానికి అనుగుణంగా ఏకవచన సన్నిహిత సంబోధనను ‘నువ్వు’తో వ్యక్తం చేశాం. మూలంలోని క్లిష్టమైన కాలసూచన, ‘కార్యం/విషయం’ అనే అస్పష్ట పదబంధం, ఏజెలు అనే పేరు—ఈ మూడింటినీ పాదటిప్పణుల్లో తెరిచి ఉంచాం.
