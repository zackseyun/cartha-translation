  text: וְ/שִׁלַּשְׁתָּ֙ תֵּרֵ֣ד מְאֹ֔ד וּ/בָאתָ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁר נִסְתַּ֥רְתָּ שָּׁ֖ם בְּ/י֣וֹם הַֽ/מַּעֲשֶׂ֑ה וְ/יָ֣שַׁבְתָּ֔ אֵ֖צֶל הָ/אֶ֥בֶן הָ/אָֽזֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/019.yaml
  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
translation:
  language: te
  text: మూడవ రోజున[a] నువ్వు త్వరగా కిందికి దిగి, ఆ కార్యం రోజున[b] నువ్వు దాక్కున్న చోటికి వచ్చి, ఏజెలు అనే రాయి[c] పక్కన ఉండు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ ప్రయోగం క్లిష్టమైనది. దీన్ని ‘మూడవ రోజున’ అని అర్థం చేసుకోవచ్చు; ‘మూడోసారి’ లేదా ‘మూడు రోజుల తరువాత’ అనే అర్థసాధ్యతలూ ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘కార్యం రోజున’; దీనిని ‘ఆ విషయం రోజున’ లేదా ‘ఆ పని రోజున’ అని కూడా అనువదించవచ్చు. ఇది ముందుగా ఏర్పాటైన సంగతి లేదా సందర్భాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘ఏజెలు’ అనేది బహుశా స్థలనామం లేదా ఆ రాయికి ఉన్న స్థిరమైన పేరు. దాని మూలమైన హీబ్రూ పదానికి ‘వెళ్లడం’ లేదా ‘బయలుదేరడం’తో సంబంధం ఉండవచ్చు; ఖచ్చితమైన అర్థం తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  choice: మూడవ రోజున
  rationale: שלשׁ యొక్క పియేల్ రూపం ఇక్కడ అరుదైన, సంక్షిప్త ప్రయోగం. సందర్భంలో ఇది యోనాతాను ఏర్పాటుచేసిన సంకేతానికి సంబంధించిన మూడవ రోజును సూచిస్తున్నట్లు కనిపిస్తుంది; అయినా ఇతర అర్థసాధ్యతలను పాదటిప్పణిలో ఉంచాం.
- source_word: תֵּרֵד מְאֹד
  choice: త్వరగా కిందికి దిగి
  rationale: ירד అంటే ‘కిందికి దిగు’; מְאֹד క్రియను బలపరుస్తుంది. సందర్భంలోని అత్యవసర కదలికను సహజమైన తెలుగులో ‘త్వరగా’ తెలియజేస్తుంది, అయితే ‘చాలా కిందికి’ అనే సాధ్యతను పాదటిప్పణిలో గుర్తించాం.
- source_word: וּבָאתָ אֶל הַמָּקוֹם
  choice: చోటికి వచ్చి
  rationale: בוא అంటే ‘రా/ప్రవేశించు’; నేరుగా ఇచ్చే సూచనలో ‘చోటికి వచ్చి’ సహజంగా ఉంది.
- source_word: אֲשֶׁר נִסְתַּרְתָּ שָּׁם
  choice: దాక్కున్న
  rationale: נסתר నిఫాల్ రూపం ఇక్కడ దావీదు ఉద్దేశపూర్వకంగా తనను తాను దాచుకున్నాడనే ప్రతిఫలార్థాన్ని ఇస్తుంది; ‘దాక్కున్న’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  choice: ఆ సంగతి జరిగిన రోజున
  rationale: מַעֲשֶׂהకు ‘పని, కార్యం, విషయం, సంఘటన’ వంటి విస్తృత అర్థాలున్నాయి. గతంలో ఏర్పాటైన సందర్భాన్ని సూచించేలా ‘ఆ సంగతి జరిగిన రోజున’ సహజంగా ఉంటుంది; మూలంలోని అస్పష్టతను పాదటిప్పణి కాపాడుతుంది.
- source_word: וְיָשַׁבְתָּ
  choice: ఉండు
  rationale: ישׁב అక్షరార్థంగా ‘కూర్చో’ అయినా ‘నివసించు/ఉండు’ అని కూడా అర్థమవుతుంది. దాక్కొని వేచి ఉండమనే సూచనలో ‘ఉండు’ ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֵצֶל הָאֶבֶן הָאָזֶל
  choice: ఏజెలు రాయి పక్కన
  rationale: אֶבֶן అంటే ‘రాయి’. הָאָזֶלను ఖచ్చితమైన అర్థం తెలియని స్థలనామం లేదా ఆ రాయికి స్థిరమైన పేరుగా తీసుకొని ‘ఏజెలు’ అని లిప్యంతరీకరించాం.
