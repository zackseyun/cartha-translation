  text: וַ/יֹּ֧אמֶר יְהוֹנָתָ֛ן לְ/דָוִ֖ד לֵ֣ךְ לְ/שָׁל֑וֹם אֲשֶׁר֩ נִשְׁבַּ֨עְנוּ שְׁנֵ֜י/נוּ אֲנַ֗חְנוּ בְּ/שֵׁ֤ם יְהוָה֙ לֵ/אמֹ֔ר יְהוָ֞ה יִֽהְיֶ֣ה בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֥ין זַרְעִ֛/י וּ/בֵ֥ין זַרְעֲ/ךָ֖ עַד עוֹלָֽם׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: te
  text: 'యోనాతాను దావీదుతో ఇలా అన్నాడు: “క్షేమంగా వెళ్లు; మనమిద్దరం యెహోవా నామంలో ఇలా ప్రమాణం చేశాం: ‘యెహోవా నాకూ నీకూ మధ్య, నా సంతానానికీ నీ సంతానానికీ మధ్య శాశ్వతంగా ఉండాలి.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ לְשָׁלוֹם
  choice: క్షేమంగా వెళ్లు
  rationale: హీబ్రూ ఆశీర్వాదపూర్వక వీడ్కోలు మాటను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זַרְעִי / זַרְעֲךָ
  choice: నా సంతానం / నీ సంతానం
  rationale: זֶרַע ఇక్కడ సమూహార్థకంగా భవిష్యత్ వంశస్థులను సూచిస్తుంది; ‘సంతానం’ ఆ విస్తృతతను నిలుపుతుంది.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: ఒడంబడిక సంబంధం నిరంతరం కొనసాగాలనే కాలార్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా స్పష్టంగా నిలుపుతుంది.
- issue: יהוה יהיה בין־י ובינך లోని క్రియ భావం
  choice: యెహోవా ... మధ్య ... ఉండాలి
  alternative: యెహోవా ... మధ్య ఉంటాడు
  rationale: ఈ సందర్భంలోని ఒడంబడిక సూత్రం ప్రార్థనాత్మకంగా లేదా సంకల్పాత్మకంగా వినిపించగల అస్పష్టతను ‘ఉండాలి’ నిలుపుతుంది; దానిని ఖచ్చితమైన భవిష్యద్వాక్యంగా మార్చదు.
- issue: אֲשֶׁר యొక్క సంబంధం
  choice: ప్రత్యేక కారణసూచక పదం లేకుండా రెండు వాక్యాలుగా అనుసంధానం
  alternative: ఎందుకంటే మనమిద్దరం ప్రమాణం చేశాం
  rationale: హీబ్రూ నిర్మాణం ముందున్న ‘క్షేమంగా వెళ్లు’తో ప్రమాణాన్ని అనుసంధానించినా, אֲשֶׁר ఖచ్చితంగా కారణార్థకమేనని నిర్బంధించదు; సహజ తెలుగులో అస్పష్టతను అధికంగా పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ప్రత్యక్ష సంభాషణ మరియు ప్రమాణ భాష నిలుపబడ్డాయి.
