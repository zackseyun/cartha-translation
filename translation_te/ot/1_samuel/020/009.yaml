source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹנָתָ֖ן חָלִ֣ילָ/ה לָּ֑/ךְ כִּ֣י אִם יָדֹ֣עַ אֵדַ֗ע כִּֽי כָלְתָ֨ה הָ/רָעָ֜ה מֵ/עִ֤ם אָבִ/י֙ לָ/ב֣וֹא עָלֶ֔י/ךָ וְ/לֹ֥א אֹתָ֖/הּ אַגִּ֥יד לָֽ/ךְ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
translation:
  language: te
  text: 'యోనాతాను ఇలా అన్నాడు: “అలా అనుకోవద్దు! నా తండ్రి వల్ల నీ మీదికి కీడు రావడం ఖరారైందని[a] నాకు నిశ్చయంగా తెలిసి ఉంటే, నేను నీకు చెప్పకుండా ఉంటానా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కీడు స్థిరపడిందని’ లేదా ‘కీడు పూర్తిగా రూపుదిద్దుకుందని.’ హీబ్రూ వ్యక్తీకరణ సౌలు చేయదలచిన హాని ఖరారైందని లేదా పూర్తిగా ఏర్పడిందని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  choice: అలా నీకు జరగనే జరగదు!
  rationale: బలమైన నిరాకరణను తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో అందిస్తూ, రెండవ పురుష ఏకవచన దత్తి ప్రత్యయం לָּךְ (‘నీకు’)ను నిలుపుతుంది.
- source_word: כִּי אִם
  choice: తెలిస్తే
  rationale: ఈ సందర్భంలో షరతును ప్రవేశపెట్టే పదబంధం; తెలుగులో క్రియకు జోడించిన ‘-తే’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יָדֹעַ אֵדַע
  choice: నాకు నిశ్చయంగా తెలిస్తే
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే బలాన్ని ‘నిశ్చయంగా’ ద్వారా వ్యక్తం చేసింది.
- source_word: כָלְתָה הָרָעָה
  choice: కీడు రావడం ఖాయమైందని
  rationale: כלה అనే క్రియ ఇక్కడ కీడు స్థిరపడిన లేదా పూర్తిగా రూపుదిద్దుకున్న స్థితిని సూచించవచ్చు. ‘ఖాయమైంది’ ఆ భావాన్ని సహజంగా ఇస్తూ, అసలు పదబంధంలోని కొంత భావవిస్తృతిని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: מֵעִם אָבִי
  choice: నా తండ్రి వల్ల
  rationale: కీడు ఉద్భవించే మూలం లేదా కారకుడు తండ్రి అని సూచించే מֵעִם భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; తండ్రి నేరుగా పలికిన నిర్ణయమనే అర్థాన్ని అవసరం లేకుండా జోడించదు.
- source_word: לָבוֹא עָלֶיךָ
  choice: నీ మీదికి ... రావడం
  rationale: ‘నీ మీదికి రావడం’ అనే రూపం హీబ్రూలోని దిశాత్మక భావాన్ని నిలుపుతూ, అది దాడా లేక విస్తృతమైన హానా అనే విషయాన్ని నిర్దిష్టం చేయదు.
- source_word: וְלֹא אֹתָהּ אַגִּיד לָךְ
  choice: నేను నీకు చెప్పకుండా ఉంటానా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే అలంకారప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
