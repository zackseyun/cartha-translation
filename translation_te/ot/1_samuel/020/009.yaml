  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. హీబ్రూ నుడికారంలోని రెండవ పురుష సూచనను నిలిపి, కీడు ఎలా ‘ఖాయమైంది’ అనే భావంలోని నిజమైన అస్పష్టతను పాదటిప్పణిలో భద్రపరిచింది.
