translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సన్నిహితుల మధ్య సంభాషణకు తగిన ‘నువ్వు’ రూపం ఉపయోగించబడింది. గంభీరతను నిలుపుతూ, సామాన్య పాఠకులకు సహజంగా అర్థమయ్యే వాక్యనిర్మాణం ఎంచుకోబడింది.
