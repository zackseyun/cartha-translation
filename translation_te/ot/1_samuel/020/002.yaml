id: 1SA.20.2
reference: 1 Samuel 20:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר ל֣/וֹ חָלִילָ/ה֮ לֹ֣א תָמוּת֒ הִנֵּ֡ה ל/ו עשה אָבִ֜/י דָּבָ֣ר גָּד֗וֹל א֚וֹ דָּבָ֣ר קָטֹ֔ן וְ/לֹ֥א יִגְלֶ֖ה אֶת אָזְנִ֑/י וּ/מַדּוּעַ֩ יַסְתִּ֨יר אָבִ֥/י מִמֶּ֛/נִּי אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה אֵ֥ין זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
translation:
  language: te
  text: 'అతడు అతనితో ఇలా అన్నాడు: “అలా ఎన్నటికీ జరగదు! నువ్వు చనిపోవు. చూడు, పెద్ద విషయమైనా చిన్న విషయమైనా నా తండ్రి నాకు తెలియజేయకుండా[a] ఏదీ చేయడు. అలాంటప్పుడు ఈ విషయాన్ని మాత్రం నా తండ్రి నా దగ్గర ఎందుకు దాచిపెడతాడు? ఇది నిజం కాదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘నా చెవిని తెరవకుండా’; ఇది ‘నాకు తెలియజేయకుండా’ అనే అర్థమిచ్చే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  choice: అలా ఎన్నటికీ జరగదు!
  rationale: తీవ్రమైన నిరాకరణను తెలిపే హీబ్రూ నానుడి. మూలంలో స్పష్టంగా లేని దైవసూచనను చేర్చకుండా, సందర్భానికి తగిన సహజమైన తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: לֹא תָמוּת
  choice: నువ్వు చనిపోవు
  rationale: సందర్భంలో ఇది నేరుగా ఇచ్చిన భరోసా లేదా అంచనా; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: הִנֵּה
  choice: చూడు
  rationale: తరువాత చెప్పబోయే వివరణపై శ్రద్ధ నిలిపే సంభాషణాత్మక సూచనను నిలుపుతుంది.
- source_word: דָּבָר גָּדוֹל אוֹ דָּבָר קָטֹן
  choice: పెద్ద విషయమైనా చిన్న విషయమైనా
  rationale: పెద్దది నుంచి చిన్నది వరకు అన్నిటినీ సూచించే ద్వంద్వప్రయోగాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: וְלֹא יִגְלֶה אֶת אָזְנִי
  choice: నాకు తెలియజేయకుండా[a]
  rationale: అక్షరార్థంగా ‘నా చెవిని తెరవడం’ అనే హీబ్రూ నానుడి ఇక్కడ సమాచారం వెల్లడించడాన్ని సూచిస్తుంది; ప్రధాన పాఠ్యంలో దాని సహజ భావాన్ని ఇచ్చాం.
- source_word: יַסְתִּיר
  choice: దాచిపెడతాడు
  rationale: ఉద్దేశపూర్వకంగా ఒక విషయాన్ని తెలియనివ్వకుండా ఉంచడం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הַדָּבָר הַזֶּה
  choice: ఈ విషయాన్ని
  rationale: דבר ఇక్కడ కేవలం పలికిన మాటను కాక, తెలియజేయబడిన యోచన లేదా వ్యవహారాన్ని సూచిస్తుంది.
- source_word: אֵין זֹאת
  choice: ఇది నిజం కాదు
  rationale: దావీదు చెప్పినది అలా ఉండదనే యోనాతాను చివరి నిరాకరణను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָבִי
  choice: నా తండ్రి
  rationale: హీబ్రూలో రెండుసార్లు స్పష్టంగా వచ్చిన బంధసూచక పదాన్ని, దాని నొక్కిచెప్పే ప్రభావంతో సహా నిలిపాం.
