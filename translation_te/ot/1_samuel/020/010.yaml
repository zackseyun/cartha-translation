  yaml_path: translation/ot/1_samuel/020/010.yaml
  text: Then David said to Jonathan[a], “Who will tell me? Or what if your father answers you harshly?”
translation:
  language: te
  text: అప్పుడు దావీదు యోనాతానుతో, “నాకు ఎవరు చెబుతారు? లేక నీ తండ్రి నీకు కఠినంగా జవాబిస్తే ఏమవుతుంది?[a]” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరాలా, “నాకు ఎవరు చెబుతారు? లేక నీ తండ్రి నీకు కఠినంగా ఏమి జవాబిస్తాడు?” హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది; ప్రధాన పాఠం దాని భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అడిగాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. వాక్యం ప్రశ్నలతో ఉన్నందున తెలుగులో సహజంగా ‘అప్పుడు ... అడిగాడు’ అని అనువదించాం.
- source_word: דָּוִד אֶל־יְהוֹנָתָן
  choice: దావీదు యోనాతానుతో
  rationale: వ్యక్తుల పేర్లకు ప్రామాణిక తెలుగు రూపాలను వాడి, אֶל‌ను సంభాషణ సందర్భానికి సహజమైన ‘తో’ ద్వారా తెలిపాం.
- source_word: מִי יַגִּיד לִי
  choice: నాకు ఎవరు చెబుతారు?
  rationale: נגד హిఫిల్ రూపం ‘తెలియజేయు/చెప్పు’ అనే అర్థం ఇస్తుంది; సంక్షిప్త ప్రత్యక్ష ప్రశ్నను అలాగే నిలిపాం.
- source_word: אוֹ
  choice: లేక
  rationale: మూలంలోని ప్రత్యామ్నాయ సూచకాన్ని నిలిపి, రెండవ సంక్షిప్త ప్రశ్నతో అనుసంధానించాం.
- source_word: מַה יַּעַנְךָ אָבִיךָ קָשָׁה
  choice: నీ తండ్రి నీకు కఠినంగా జవాబిస్తే ఏమవుతుంది?
  rationale: హీబ్రూ నిర్మాణం సంక్షిప్తంగా, కొంత అసంపూర్ణంగా ఉంది. מַהను విస్మరించకుండా ‘ఏమవుతుంది?’ ద్వారా చూపి, קָשָׁהను క్రియావిశేషణ భావంలో ‘కఠినంగా’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని అనుసరించాం. మూలంలోని రెండు ప్రశ్నలనూ, ‘లేక’ అనే విభాజక భావాన్నీ నిలిపాం; సంక్షిప్త హీబ్రూ నిర్మాణాన్ని పాదటిప్పణిలో వెల్లడించాం.
