source:
  edition: WLC
  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
translation:
  language: te
  text: నీ విశ్వసనీయ ప్రేమను నా ఇంటివారి నుండి ఎన్నటికీ తొలగించకు[a]. యాహ్వే దావీదు శత్రువులను, వారిలో ప్రతి ఒక్కరినీ, భూమి మీదనుండి తొలగించే సమయంలో కూడా అలా చేయకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ నిబంధన విశ్వాస్యతను,’ ‘నీ నమ్మకమైన ప్రేమను.’ హీబ్రూ חֶסֶד అనే పదం నిబంధన సంబంధంలో చూపే విశ్వసనీయ ప్రేమను తరచుగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת (כרת)
  choice: తొలగించు
  rationale: రెండు చోట్లా ఒకే క్రియను వాడడం ద్వారా, యోనాతాను తన ఇంటివారినుండి ప్రేమను ‘తొలగించవద్దని’ కోరడానికీ, యాహ్వే దావీదు శత్రువులను ‘తొలగించడానికీ’ మధ్య ఉన్న హీబ్రూ పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: חַסְדְּךָ
  choice: నీ విశ్వసనీయ ప్రేమ
  rationale: חסד ఇక్కడ సాధారణ దయకన్నా, సంబంధంలో నిలకడగా చూపే ప్రేమనూ విశ్వాస్యతనూ సూచిస్తుంది. ‘విశ్వసనీయ ప్రేమ’ ఈ రెండు భావాలను సహజమైన ఆధునిక తెలుగులో కలిపి తెలియజేస్తుంది.
- source_word: מֵעִם בֵּיתִי
  choice: నా ఇంటివారినుండి
  rationale: בית ఇక్కడ భవనాన్ని కాక యోనాతాను కుటుంబాన్ని లేదా వంశాన్ని సూచిస్తుంది. ‘ఇంటివారు’ ఆ కుటుంబార్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַד עוֹלָם
  choice: ఎన్నటికీ
  rationale: నిరంతర కాలాన్ని తెలిపే ఈ పదబంధానికి గంభీరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తిగత నామానికి సన్నిహితమైన తెలుగు లిప్యంతరీకరణగా ఉంచుతుంది.
- source_word: אֹיְבֵי דָוִד אִישׁ
  choice: దావీదు శత్రువులలో ప్రతి ఒక్కణ్ణీ
  rationale: అనేకమంది శత్రువులలో ఒక్కొక్కరినీ సూచించే אִישׁ యొక్క పంపిణీ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: భూమి మీదనుండి
  rationale: పూర్తిగా తొలగించబడడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְלֹא ... וְלֹא
  choice: తొలగించకు ... అలా చేయకు
  rationale: రెండవ నిషేధాన్ని మొదటి విజ్ఞప్తికి బలమైన విస్తరణగా చూపి, యాహ్వే దావీదు శత్రువులను తొలగించే సమయంలో కూడా యోనాతాను ఇంటివారిపై ప్రేమను ఉపసంహరించవద్దనే భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: నిబంధన సందర్భంలో חסד స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘విశ్వసనీయ ప్రేమ’ అని అనువదించి, నిబంధన విశ్వాస్యత అనే భావాన్ని పాదటీపులో సూచించడం.
  alternative: ‘నిబంధన విశ్వాస్యత’ లేదా ‘నమ్మకమైన ప్రేమ’
  rationale: సందర్భం యోనాతాను, దావీదు మరియు వారి ఇళ్ల మధ్య నిబంధనకు సంబంధించినది. అయితే חסדను కేవలం సాంకేతిక న్యాయపదంగా పరిమితం చేయకుండా ప్రేమ, విశ్వాస్యత అనే రెండు పార్శ్వాలనూ ఉంచడం సముచితం.
- issue: రెండవ ఉపవాక్యంతో విజ్ఞప్తికి ఉన్న సంబంధం
  choice: యాహ్వే దావీదు శత్రువులను తొలగించినప్పుడు కూడా యోనాతాను ఇంటివారిపై ప్రేమను తొలగించవద్దనే విజ్ఞప్తిగా అనువదించడం.
  alternative: యాహ్వే శత్రువులను తొలగించడం గురించి స్వతంత్ర లేదా కుండలీకరణ వ్యాఖ్యగా చదవడం.
  rationale: రెండవ וְלֹא మరియు infinitive construct మొదటి నిషేధాన్ని బలపరుస్తూ దాని కాలపరమైన పరిధిని విస్తరిస్తాయి. ఈ పఠనం యోనాతాను ఇంటికి కరుణ కోరే వచనంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: אִישׁ యొక్క పంపిణీ భావం
  choice: ‘ప్రతి ఒక్కణ్ణీ’
  alternative: ‘అందరినీ’ లేదా కేవలం ‘శత్రువులను’
  rationale: ఏ శత్రువూ మిగలకుండా ఒక్కొక్కరినీ తొలగించడం అనే ఏకవచన పంపిణీ బలాన్ని ఇది స్పష్టంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని వాడాం. ‘ఇంటివారు’ కుటుంబ/వంశ భావాన్ని స్పష్టం చేస్తుంది; ‘తొలగించు’ అనే ఒకే క్రియను రెండు చోట్ల ఉంచి మూలంలోని పదప్రయోగాన్ని సాధ్యమైనంతవరకు కాపాడాం. పాదటీపు సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
