revisions:
- from: అప్పుడు యోనాతానుమీద సౌలు కోపం మండింది. అతడు యోనాతానుతో, “వక్రబుద్ధిగల తిరుగుబాటు స్త్రీ కుమారుడా![a] నువ్వు యెష్షయి కుమారుణ్ణి ఎంచుకున్నావని[b] నాకు తెలియదనుకున్నావా? దీనివల్ల నీకూ, నీ తల్లి నగ్నత్వానికీ అవమానం!” అన్నాడు.[c]
  to: అప్పుడు సౌలు యోనాతానుపై కోపంతో మండిపోయాడు. అతడు యోనాతానుతో, “వక్రమైన, తిరుగుబాటు చేసే స్త్రీ కుమారుడా![a] నువ్వు యెష్షయి కుమారుణ్ణి ఎంచుకుంటున్నావని[b] నాకు తెలియదా? అది నీ అవమానానికీ, నీ తల్లి నగ్నత్వపు అవమానానికీ[c] కారణమవుతుంది!” అన్నాడు.
  rationale: The revision restores the Hebrew rhetorical form, represents the participial choice as ongoing, improves modern Telugu narrative flow, and relocates footnote c to the exact expression it explains. It retains the difficult maternal insult and its ambiguity without imposing an interpretive expansion beyond the audit trail.
