  text: וַ/יִּֽחַר אַ֤ף שָׁאוּל֙ בִּ/יה֣וֹנָתָ֔ן וַ/יֹּ֣אמֶר ל֔/וֹ בֶּֽן נַעֲוַ֖ת הַ/מַּרְדּ֑וּת הֲ/ל֣וֹא יָדַ֗עְתִּי כִּֽי בֹחֵ֤ר אַתָּה֙ לְ/בֶן יִשַׁ֔י לְ/בָ֨שְׁתְּ/ךָ֔ וּ/לְ/בֹ֖שֶׁת עֶרְוַ֥ת אִמֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
translation:
  language: te
  text: అప్పుడు సౌలు యోనాతానుపై కోపంతో మండిపోయాడు. అతడు యోనాతానుతో, “వక్రమైన, తిరుగుబాటు చేసే స్త్రీ కుమారుడా![a] నువ్వు యెష్షయి కుమారుణ్ణి ఎంచుకుంటున్నావని[b] నాకు తెలియదా? అది నీ అవమానానికీ, నీ తల్లి నగ్నత్వపు అవమానానికీ[c] కారణమవుతుంది!” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వక్రతకూ తిరుగుబాటుకూ పుట్టినవాడా!” ఈ హీబ్రూ దూషణ అర్థనిర్ణయం కష్టమైనది, అత్యంత నుడికారపూర్వకమైనది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నువ్వు యెష్షయి కుమారుని పక్షం వహిస్తున్నావు.”
    reason: lexical_alternative
  - marker: c
    text: “నీ తల్లి నగ్నత్వపు అవమానం” అనేది కుటుంబానికి కలిగే తీవ్రమైన అప్రతిష్ఠను తెలిపే కఠినమైన హీబ్రూ వ్యక్తీకరణ.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף שָׁאוּל בִּיהוֹנָתָן
  choice: యోనాతానుమీద సౌలు కోపం మండింది
  rationale: కోపం ‘మండడం’ అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, בְּ సూచించే కోప లక్ష్యాన్ని ‘మీద’తో వ్యక్తం చేస్తుంది.
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  choice: వక్రబుద్ధిగల తిరుగుబాటు స్త్రీ కుమారుడా
  rationale: అర్థం క్లిష్టమైన ఈ తీవ్రమైన దూషణలోని వక్రత/చెడుదనం మరియు తిరుగుబాటు భావాలను నిలుపుతుంది; తరువాత తల్లిని ప్రస్తావించడం వల్ల స్త్రీని సూచించే పఠనం సందర్భానికి సరిపోతుంది.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: నాకు తెలియదనుకున్నావా?
  rationale: మూలంలోని ప్రతికూల అలంకార ప్రశ్నను ఘర్షణాత్మకమైన, సహజ తెలుగు ప్రశ్నగా అందిస్తుంది; వక్తకు విషయం ఖచ్చితంగా తెలుసనే భావం నిలుస్తుంది.
- source_word: בֹחֵר אַתָּה לְבֶן יִשַׁי
  choice: నువ్వు యెష్షయి కుమారుణ్ణి ఎంచుకున్నావు
  rationale: בחר యొక్క ప్రాథమిక ‘ఎంచుకొను’ భావాన్ని కాపాడుతుంది; సందర్భంలో అతని పక్షం వహించడం అనే భావం పాదసూచికలో ఇవ్వబడింది.
- source_word: לְבָשְׁתְּךָ
  choice: దీనివల్ల నీకు అవమానం
  rationale: లామెద్ సూచించే ఫలితాన్ని ‘దీనివల్ల’తో స్పష్టం చేసి, בֹּשֶׁת యొక్క అవమానం/అప్రతిష్ఠ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  choice: నీ తల్లి నగ్నత్వానికి అవమానం
  rationale: עֶרְוָה యొక్క ప్రత్యక్ష ‘నగ్నత్వం’ భావాన్ని మెత్తబరచకుండా నిలుపుతుంది; ఇది కుటుంబానికి కలిగే తీవ్రమైన అవమానాన్ని సూచించే కఠినమైన హీబ్రూ వ్యక్తీకరణ.
