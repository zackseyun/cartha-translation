translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి వాడబడింది. సౌలు పలికిన దూషణ తీవ్రతను తగ్గించకుండా, క్లిష్టమైన హీబ్రూ నుడికారానికి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
