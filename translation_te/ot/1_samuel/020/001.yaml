source:
  edition: WLC
  text: וַ/יִּבְרַ֣ח דָּוִ֔ד מ/נוות בָּ/רָמָ֑ה וַ/יָּבֹ֞א וַ/יֹּ֣אמֶר לִ/פְנֵ֣י יְהוֹנָתָ֗ן מֶ֤ה עָשִׂ֨יתִי֙ מֶֽה עֲוֺנִ֤/י וּ/מֶֽה חַטָּאתִ/י֙ לִ/פְנֵ֣י אָבִ֔י/ךָ כִּ֥י מְבַקֵּ֖שׁ אֶת נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
translation:
  language: te
  text: 'అప్పుడు దావీదు రామాలోని నాయోతు[a] నుండి పారిపోయి, యోనాతాను సమక్షానికి వచ్చి ఇలా అన్నాడు: “నేను ఏమి చేశాను? నా దోషమేమిటి? నీ తండ్రి నా ప్రాణం తీయాలని చూస్తున్నాడంటే, ఆయన సమక్షంలో నా పాపమేమిటి?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రామా వద్దనున్న నాయోతు.” హీబ్రూ పదబంధం నాయోతు అనే తెలిసిన స్థలనామాన్ని రామాతో అనుసంధానిస్తుంది.
    reason: మూలంలోని מִנָּוֹת בָּרָמָה పదబంధానికి ఉన్న స్థానసంబంధ ప్రత్యామ్నాయాన్ని సూచించడానికి.
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: పారిపోయి
  rationale: ברח పారిపోవడం లేదా తప్పించుకోవడం అనే భావాన్ని ఇస్తుంది; సందర్భంలోని అత్యవసరతను సహజంగా తెలియజేయడానికి ‘పారిపోయి’ ఎంచుకున్నాం.
- source_word: מִנָּוֹת בָּרָמָה
  choice: రామాలోని నాయోతు నుండి
  rationale: మునుపటి సందర్భం ప్రకారం נָוֹת స్థలనామం; దానిని ‘నాయోతు’గా లిప్యంతరీకరించి, בָּרָמָה లోకేటివ్ సంబంధాన్ని ‘రామాలోని’తో తెలిపాం.
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא యొక్క సాధారణ కథన రూపం; యోనాతాను వైపు దావీదు రావడాన్ని ‘వచ్చి’ సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוֹנָתָן
  choice: యోనాతాను దగ్గరికి
  rationale: లిఖితార్థం ‘యోనాతాను సమక్షానికి’; ఆధునిక తెలుగులో ‘దగ్గరికి’ సహజంగా ఉండి వ్యక్తిగత సమక్షంలోకి రావడాన్ని తెలియజేస్తుంది.
- source_word: מֶה עָשִׂיתִי
  choice: నేను ఏమి చేశాను?
  rationale: హీబ్రూ పరిపూర్ణ క్రియను ఈ ఆత్మరక్షణాత్మక ప్రశ్నలో సహజ తెలుగు భూతకాలంతో అందించాం.
- source_word: עֲוֺנִי
  choice: నా దోషమేమిటి?
  rationale: עָוֹן అపరాధం, దోషం, దోషభారం అనే భావాలు కలిగి ఉంది; ఇక్కడ న్యాయపరమైన ఆత్మరక్షణ సందర్భానికి ‘దోషం’ సరిపోతుంది.
- source_word: חַטָּאתִי
  choice: నేను అతనికి విరోధంగా చేసిన పాపమేమిటి?
  rationale: חַטָּאת యొక్క నైతిక బలాన్ని ‘పాపం’ నిలుపుతుంది; לִפְנֵי אָבִיךָ సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా ‘అతనికి విరోధంగా చేసిన’ అని అందించాం.
- source_word: כִּי
  choice: —…చూస్తున్నాడే—
  rationale: ఇక్కడ כִּי దావీదు ప్రశ్నకు కారణం లేదా ఆశ్చర్యకరమైన పరిణామాన్ని పరిచయం చేస్తుంది; తెలుగు ‘-ఏ’ మరియు డాష్ నిర్మాణం ఆ వాక్చాతుర్య సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: מְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: నన్ను చంపాలని చూస్తున్నాడు
  rationale: ‘నా ప్రాణాన్ని వెదకడం’ అనే హీబ్రూ నుడికారం సందర్భంలో చంపడానికి ప్రయత్నించడం అని అర్థం; అక్షరానువాదం తెలుగులో అపార్థానికి దారితీయగలందున భావాన్ని స్పష్టంగా అందించాం.
