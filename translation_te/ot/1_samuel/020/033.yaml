translation:
  language: te
  text: అప్పుడు సౌలు యోనాతానును కొట్టడానికి అతని మీదికి ఈటె విసిరాడు. దావీదును చంపాలని తన తండ్రి గట్టిగా నిర్ణయించుకున్నాడని యోనాతాను గ్రహించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּטֶל
  choice: విసిరాడు
  rationale: ఈ క్రియ విసరడం లేదా ఎగరవేయడం అనే అర్థాన్ని ఇస్తుంది; సందర్భంలోని బలమైన శత్రుత్వ చర్యను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַחֲנִית
  choice: ఈటె
  rationale: ఇది పొడవడానికి లేదా విసరడానికి ఉపయోగించే ఆయుధాన్ని సూచించే సాధారణ, సుపరిచితమైన తెలుగు పదం.
- source_word: עָלָיו
  choice: అతని మీదికి
  rationale: విసిరే చర్యకు లక్ష్యం యోనాతానేనని, దాని శత్రుత్వ దిశను సహజమైన తెలుగు ప్రయోగంలో స్పష్టం చేస్తుంది.
- source_word: לְהַכֹּתוֹ
  choice: యోనాతానును కొట్టడానికి
  rationale: ఉద్దేశార్థక క్రియారూపాన్ని కాపాడుతుంది. తెలుగు వాక్యంలో సర్వనామ సందిగ్ధత రాకుండా యోనాతాను పేరును పునరుక్తి చేశాం.
- source_word: וַיֵּדַע
  choice: గ్రహించాడు
  rationale: సంఘటన ద్వారా యోనాతాను నిశ్చయానికి వచ్చాడనే సందర్భార్థాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כָלָה הִיא מֵעִם אָבִיו
  choice: తన తండ్రి గట్టిగా నిర్ణయించుకున్నాడు
  rationale: హీబ్రూ నుడికారం సౌలు వైపు నిర్ణయం పూర్తిగా స్థిరపడిందని సూచిస్తుంది; ఈ భావాన్ని సహజంగా, అతిగా వివరణాత్మకంగా కాకుండా అందిస్తుంది.
- source_word: לְהָמִית אֶת דָּוִד
  choice: దావీదును చంపాలని
  rationale: మరణానికి గురిచేయాలనే ఉద్దేశాన్ని నేరుగా, గంభీరంగా, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తి పేరు.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తి పేరు.
- source_word: דָּוִד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తి పేరు.
