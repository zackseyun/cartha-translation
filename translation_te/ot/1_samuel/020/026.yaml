source:
  edition: WLC
  text: וְ/לֹֽא דִבֶּ֥ר שָׁא֛וּל מְא֖וּמָה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֤י אָמַר֙ מִקְרֶ֣ה ה֔וּא בִּלְתִּ֥י טָה֛וֹר ה֖וּא כִּֽי לֹ֥א טָהֽוֹר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
translation:
  language: te
  text: 'అయితే ఆ రోజు సౌలు ఏమీ అనలేదు. ఎందుకంటే, సౌలు ఇలా అనుకున్నాడు: “ఏదో జరిగి ఉంటుంది; అతడు శుద్ధుడు కాదు—తప్పకుండా అతడు శుద్ధుడు కాదు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “శుద్ధుడు కాదు” అంటే ఆచారపరంగా అపవిత్రుడై ఉన్నాడని భావం. ఈ భోజన సందర్భంలో హీబ్రూ పదం ఆచార శుద్ధిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... מְאוּמָה
  choice: ఏమీ అనలేదు
  rationale: ‘మాట్లాడలేదు’ అనే అక్షరార్థం కంటే, సౌలు ఎలాంటి వ్యాఖ్య చేయలేదనే హీబ్రూ ప్రయోగార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: కాలసూచనను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: כִּי אָמַר
  choice: అని అతడు అనుకున్నాడు
  rationale: אָמַר అక్షరార్థంగా ‘అన్నాడు’; ఇక్కడ సందర్భం సౌలు మనసులో చేసుకున్న ఆలోచనను సూచిస్తున్నందున ‘అనుకున్నాడు’ సహజంగా ఉంటుంది.
- source_word: מִקְרֶה הוּא
  choice: ఏదో జరిగి ఉంటుంది
  rationale: מִקְרֶה అనుకోకుండా సంభవించిన విషయం లేదా సంఘటనను సూచిస్తుంది. ఎవరికి జరిగిందో మూలపాఠం స్పష్టంగా చెప్పనందున ‘అతనికి’ అని చేర్చలేదు.
- source_word: בִּלְתִּי טָהוֹר הוּא
  choice: అతడు శుద్ధిగా లేడు
  rationale: హీబ్రూలోని నిరాకరణ రూపాన్ని నిలుపుతూ, భోజన సందర్భంలో ఆచారపరమైన శుద్ధిని సూచించే విస్తృత పదాన్ని ఉపయోగిస్తుంది.
- source_word: כִּי לֹא טָהוֹר
  choice: నిశ్చయంగా అతడు శుద్ధిగా లేడు
  rationale: పునరుక్తిలోని బలమైన నిర్ధారణను ‘నిశ్చయంగా’ ద్వారా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: טָהוֹר సూచించే శుద్ధి స్వభావం
  choice: ప్రధాన పాఠంలో ‘శుద్ధిగా లేడు’; పాదసూచికలో ఆచారపరమైన అర్థం
  alternative: నైతిక అపవిత్రత లేదా ప్రధాన పాఠంలోనే ‘ఆచారపరంగా అపవిత్రుడు’
  rationale: అమావాస్య విందు సందర్భంలో ఇది భోజనంలో పాల్గొనడానికి సంబంధించిన ఆచారపరమైన అశుద్ధిని అత్యంత సహజంగా సూచిస్తుంది. అయినా మూలపాఠంలోని విస్తృత పదాన్ని ప్రధాన పాఠంలో ఉంచి, సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. హీబ్రూ పునరుక్తి మరియు దాని నిర్ధారణాత్మక బలం నిలుపబడ్డాయి.
