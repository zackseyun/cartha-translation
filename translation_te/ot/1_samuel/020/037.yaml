source:
  edition: WLC
  text: וַ/יָּבֹ֤א הַ/נַּ֨עַר֙ עַד מְק֣וֹם הַ/חֵ֔צִי אֲשֶׁ֥ר יָרָ֖ה יְהוֹנָתָ֑ן וַ/יִּקְרָ֨א יְהוֹנָתָ֜ן אַחֲרֵ֤י הַ/נַּ֨עַר֙ וַ/יֹּ֔אמֶר הֲ/ל֥וֹא הַ/חֵ֖צִי מִמְּ/ךָ֥ וָ/הָֽלְאָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/037.yaml
  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
translation:
  language: te
  text: ఆ బాలుడు యోనాతాను వేసిన బాణం ఉన్న చోటికి వచ్చినప్పుడు, యోనాతాను ఆ బాలుణ్ణి వెనుకనుంచి పిలిచి, “బాణం నీకు అవతలే ఉంది కదా?[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాణం నిన్ను దాటి ఇంకా ముందే ఉంది కదా?” హీబ్రూ పదబంధానికి అక్షరార్థం “నీ నుండి ఇంకా ముందుకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చినప్పుడు
  rationale: בוא అనే సాధారణ కథన క్రియను సహజమైన తెలుగు ఉపవాక్య నిర్మాణంలో ‘వచ్చినప్పుడు’గా అనువదించాం.
- source_word: הַנַּעַר
  choice: ఆ బాలుడు
  rationale: נַעַר యువకుడు, పరిచారకుడు లేదా బాలుడు అనే అర్థాలు ఇవ్వగలదు; ఈ సందర్భంలో యోనాతాను వెంట ఉన్న చిన్నవయస్కుడైన పరిచారకునికి ‘బాలుడు’ సహజంగా సరిపోతుంది.
- source_word: עַד מְקוֹם הַחֵצִי
  choice: బాణం ఉన్న చోటికి
  rationale: ‘బాణం యొక్క స్థలానికి’ అనే కఠిన నిర్మాణం బదులు, עַד సూచించే గమ్యస్థానాన్ని మరియు מְקוֹם అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר יָרָה יְהוֹנָתָן
  choice: యోనాతాను వేసిన
  rationale: ירה ఇక్కడ బాణాన్ని ప్రయోగించడాన్ని సూచిస్తుంది; తెలుగులో ‘బాణం వేశాడు’ సాధారణమైన, సహజమైన ప్రయోగం.
- source_word: וַיִּקְרָא ... אַחֲרֵי
  choice: వెనుకనుంచి పిలిచి
  rationale: אַחֲרֵיతో కూడిన קרא, ముందుకు వెళ్లిన వ్యక్తిని వెనుకనుంచి పిలవడాన్ని సూచిస్తుంది.
- source_word: הֲלוֹא
  choice: ఉంది కదా?
  rationale: సమ్మతిని ఆశించే హీబ్రూ అలంకారప్రశ్న బలాన్ని ఆధునిక తెలుగులో ‘కదా?’ సహజంగా నిలుపుతుంది.
- source_word: הַחֵצִי
  choice: బాణం
  rationale: ఈ సందర్భంలో חֵץకు సాధారణ తెలుగు సమానార్థకం.
- source_word: מִמְּךָ וָהָלְאָה
  choice: నీకు అవతలే
  rationale: పదబద్ధంగా ‘నీ నుండి ఇంకా ముందుకు’ అనే భావాన్ని, బాలుడు ఉన్న స్థానానికి మించి బాణం ఉందనే సందర్భార్థంతో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
