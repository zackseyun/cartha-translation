translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని జ్ఞానం–అజ్ఞానం వ్యత్యాసం స్పష్టంగా ఉంచబడింది; דָּבָר యొక్క విస్తృతార్థాన్ని ప్రధాన పాఠంలో ‘సంగతి’తో, పాదటిప్పణిలో ప్రత్యామ్నాయాలతో సంరక్షించాం.
