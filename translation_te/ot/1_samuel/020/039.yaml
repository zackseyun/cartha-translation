source:
  edition: WLC
  text: וְ/הַ/נַּ֖עַר לֹֽא יָדַ֣ע מְא֑וּמָה אַ֤ךְ יְהֽוֹנָתָן֙ וְ/דָוִ֔ד יָדְע֖וּ אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/039.yaml
  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
translation:
  language: te
  text: కాని ఆ బాలుడికి ఏమీ తెలియలేదు; యోనాతానుకూ దావీదుకూ మాత్రమే ఆ సంగతి[a] తెలిసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ విషయం,’ ‘ఆ ఏర్పాటు.’ హెబ్రీ דָּבָר అనే పదానికి విస్తృతమైన అర్థపరిధి ఉంది; అది చర్చలో ఉన్న విషయం, సంగతి లేదా ఏర్పాటును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: కాని ఆ బాలుడికి
  rationale: נַעַר ఇక్కడ యోనాతాను వెంట ఉన్న చిన్న సహాయకుణ్ణి సూచిస్తుంది; అందువల్ల ‘బాలుడు’ సహజమైన సందర్భోచిత పదం. וְ తరువాతి వ్యత్యాసాన్ని తెలుపుతున్నందున ‘కాని’గా అనువదించబడింది.
- source_word: לֹא יָדַע מְאוּמָה
  choice: ఏమీ తెలియదు
  rationale: నిరాకరణ వాక్యంలో מְאוּמָה ‘ఏదైనా/ఏమీ’ అనే భావాన్ని ఇస్తుంది. తెలుగు సహజ వాడుకలో మొత్తం పదబంధాన్ని ‘ఏమీ తెలియదు’ అని చెప్పడం సముచితం.
- source_word: אַךְ
  choice: మాత్రమే
  rationale: ఇక్కడ אַךְ పరిమితి లేదా మినహాయింపును సూచిస్తూ, బాలుడి అజ్ఞానానికి యోనాతాను దావీదుల జ్ఞానాన్ని వ్యతిరేకంగా నిలుపుతుంది.
- source_word: יְהוֹנָתָן וְדָוִד
  choice: యోనాతానుకు, దావీదుకు
  rationale: వ్యక్తుల పేర్లు ప్రామాణిక తెలుగు బైబిలు రూపాలకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి; ‘తెలుసు’ అనే తెలుగు నిర్మాణానికి సహజంగా చతుర్థీ విభక్తి వాడబడింది.
- source_word: יָדְעוּ
  choice: తెలుసు
  rationale: ముందటి יָדַעతో ఉన్న పదపునరుక్తి మరియు జ్ఞానం–అజ్ఞానం వ్యత్యాసాన్ని నిలుపుతూ అదే తెలుగు మూలపదం వాడబడింది.
- source_word: אֶת־הַדָּבָר
  choice: ఆ సంగతి
  rationale: דָּבָרకు ‘మాట, విషయం, సంగతి, వ్యవహారం’ వంటి విస్తృత అర్థాలు ఉన్నాయి. సందర్భంలో యోనాతాను, దావీదు మాత్రమే తెలిసిన సంకేత సంబంధమైన విషయాన్ని ‘ఆ సంగతి’ సహజంగా సూచిస్తుంది; నిర్దిష్ట ఏర్పాటుగా భావాన్ని అతిగా కుదించదు.
