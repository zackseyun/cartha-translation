id: 1SA.20.14
reference: 1 Samuel 20:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֖א אִם עוֹדֶ֣/נִּי חָ֑י וְ/לֹֽא תַעֲשֶׂ֧ה עִמָּדִ֛/י חֶ֥סֶד יְהוָ֖ה וְ/לֹ֥א אָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
translation:
  language: te
  text: నేను ఇంకా బ్రతికి ఉంటే, యాహ్వే యొక్క నిబంధన నిబద్ధతను నా పట్ల చూపవా, నేను చనిపోకుండా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא אִם
  choice: నేను … ఉంటే
  rationale: ఈ ప్రమాణం/విన్నప సందర్భంలో పదబద్ధమైన ‘మరియు కాదు అయితే’ అనే రూపం సహజంగా ఉండదు. షరతును స్పష్టంగా తెలిపే ‘ఉంటే’ మూలంలోని భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: עוֹדֶנִּי חָי
  choice: నేను ఇంకా బ్రతికి ఉంటే
  rationale: עוֹד లోని కొనసాగింపు భావాన్ని ‘ఇంకా’ నిలుపుతుంది; חָי ను సాధారణ ఆధునిక తెలుగు ప్రయోగమైన ‘బ్రతికి’తో అందించింది.
- source_word: תַעֲשֶׂה עִמָּדִי
  choice: నా పట్ల చూపవా?
  rationale: חֶסֶד తో కలిసి עשה עם అంటే అక్షరార్థంగా ‘నాతో చేయు’ కంటే ‘నా పట్ల చూపు/వ్యవహరించు’ అనే భావం. ప్రశ్నారూపం యోనాతాను విన్నపాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֶסֶד
  choice: నిబంధన నిబద్ధత
  rationale: ఈ సందర్భంలో חֶסֶד సాధారణ దయకన్నా సంబంధానికి, నిబంధనకు కట్టుబడిన విశ్వసనీయ ప్రేమను సూచిస్తుంది. ‘నిబంధన నిబద్ధత’ ఆ విశ్వాసపాత్రమైన విధేయతను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా అందించింది.
- source_word: וְלֹא אָמוּת
  choice: నేను చనిపోకుండా
  rationale: చివరి ప్రతికూల సముచ్చయం ఇక్కడ విన్నపపు ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; ‘చనిపోకుండా’ ఆధునిక తెలుగులో దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉన్నందున బిరుదైన ‘ప్రభువు’ను పెట్టలేదు. ‘యాహ్వే’ హీబ్రూ నామానికి సమీపమైన తెలుగు ధ్వన్యనుకరణ.
- issue: חֶסֶד יְהוָה యొక్క సంబంధం
  choice: యాహ్వే యొక్క నిబంధన నిబద్ధత
  alternative: యాహ్వే దయ; యాహ్వే స్థిరమైన ప్రేమ; యాహ్వేకు తగిన నిబద్ధత
  rationale: ఈ మాట యాహ్వే స్వయంగా చూపే విశ్వసనీయ ప్రేమను సూచించవచ్చు; లేదా యాహ్వే సాక్షిగా ఉన్న సంబంధంలో దావీదు చూపవలసిన నిబంధన నిబద్ధతను సూచించవచ్చు. ప్రధాన పాఠం నిబంధనాత్మక భావాన్ని ఉంచి, ప్రత్యామ్నాయ సంబంధాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు వాక్యనిర్మాణంతో, గౌరవప్రదమైన సంభాషణ శైలిని ఉపయోగించింది. ‘నిబంధన నిబద్ధత’ అనే పదబంధం కొంత సాంద్రంగా ఉన్నా సందర్భంలోని ఒడంబడిక-విశ్వసనీయత భావాన్ని నిలుపుతుంది; పాదసూచిక మరింత సహజమైన ప్రత్యామ్నాయాలను ఇస్తుంది.
