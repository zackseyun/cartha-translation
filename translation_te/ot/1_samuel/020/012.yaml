  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל דָּוִ֗ד יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ כִּֽי אֶחְקֹ֣ר אֶת אָבִ֗/י כָּ/עֵ֤ת מָחָר֙ הַ/שְּׁלִשִׁ֔ית וְ/הִנֵּה ט֖וֹב אֶל דָּוִ֑ד וְ/לֹֽא אָז֙ אֶשְׁלַ֣ח אֵלֶ֔י/ךָ וְ/גָלִ֖יתִי אֶת אָזְנֶֽ/ךָ־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
translation:
  language: te
  text: 'యోనాతాను దావీదుతో ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడైన యాహ్వే సాక్షిగా[a]—రేపు ఇదే సమయానికో, మూడవ రోజునో[b] నేను నా తండ్రి మనసు తెలుసుకుంటాను. అప్పుడు ఆయన దావీదు పట్ల అనుకూలంగా ఉన్నాడని తేలితే, నేను నీకు కబురు పంపి ఆ సంగతి నీ చెవిన వేయకుండా ఉంటానా?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం ఇక్కడ సంక్షిప్తంగా ఉంది. ఇది యాహ్వేను సాక్షిగా పిలిచే గంభీరమైన ప్రమాణం లేదా హామీ అని భావం.
    reason: textual_difficulty
  - marker: b
    text: లేదా, “రేపు ఇదే సమయానికి, అంటే మూడవ రోజున.” హీబ్రూ కాలసూచన సంక్షిప్తంగా ఉండి రెండు విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: “నీ చెవిన వేయడం” అంటే నీకు ఆ సంగతి తెలియజేయడం. హీబ్రూ పదబంధం అక్షరార్థంగా “నీ చెవిని బయలుపరచడం.”
    reason: idiom
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: సాక్షిగా
  rationale: దైవనామం తరువాతి వాక్యం హీబ్రూలో సంక్షిప్తమైన ప్రమాణ వాక్యంగా ఉంది; తెలుగులో ‘సాక్షిగా’ దాని గంభీరమైన ప్రమాణ భావాన్ని వ్యక్తం చేస్తుంది, అయితే లోపించిన క్రియను అతిగా పూరించదు.
- source_word: אֶחְקֹר אֶת אָבִי
  choice: నేను నా తండ్రి మనసు తెలుసుకుంటాను
  rationale: సందర్భంలో యోనాతాను సౌలు వైఖరిని జాగ్రత్తగా పరీక్షిస్తున్నాడు. ‘మనసు తెలుసుకుంటాను’ సాధారణ పాఠకునికి సహజంగా ఆ అన్వేషణ భావాన్ని అందిస్తుంది.
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  choice: రేపు ఇదే సమయానికో, మూడవ రోజునో
  rationale: కాలసూచన హీబ్రూలో సంక్షిప్తంగా, కొంత సందిగ్ధంగా ఉంది. రెండు సాధ్యమైన సమయాలను తెలుగులో స్పష్టంగా ఉంచుతూ ఆ సందిగ్ధతను పాదటిప్పణిలో తెలియజేశాం.
- source_word: טוֹב אֶל דָּוִד
  choice: ఆయన దావీదు పట్ల అనుకూలంగా ఉన్నాడు
  rationale: ఇది దావీదుకు మేలు జరుగుతుందనే సాధారణ భావంకన్నా, సౌలు దావీదు పట్ల కలిగిన అనుకూల వైఖరిని సూచిస్తుంది.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: ఆ సంగతి నీ చెవిన వేస్తాను
  rationale: ‘నీ చెవిని బయలుపరుస్తాను’ అనే హీబ్రూ రూపకాన్ని పదక్షరంగా కాకుండా, రహస్యంగా తెలియజేయడం అనే భావాన్ని నిలిపే సహజ తెలుగు నుడికారంతో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: దైవనామం తరువాత ఉన్న సంక్షిప్త ప్రమాణ నిర్మాణం
  choice: ఇశ్రాయేలు దేవుడైన యాహ్వే సాక్షిగా
  alternative: ఇశ్రాయేలు దేవుడైన యాహ్వే జీవం తోడు; ఇశ్రాయేలు దేవుడైన యాహ్వే సాక్షి
  rationale: మసోరా పాఠంలో సాధారణ ప్రమాణ సూత్రంలోని క్రియ స్పష్టంగా లేదు. ‘సాక్షిగా’ అని ఇవ్వడం ప్రమాణ స్వభావాన్ని తెలియజేస్తూనే ‘జీవం తోడు’ అనే పదాలను మూలంలో ఉన్నట్లుగా చూపదు.
- issue: ప్రశ్నార్థక హామీ
  choice: నేను ... వేయకుండా ఉంటానా?
  alternative: నేను ... తెలియజేస్తాను
  rationale: וְלֹא אָז అనే కఠినమైన నిర్మాణంలోని నిరాకరణాత్మక, ప్రశ్నార్థక బలాన్ని నిలిపి, యోనాతాను ఇచ్చే గట్టి హామీగా సహజ తెలుగులో వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని వాడాం. సంభాషణ సహజంగా ఉండేలా చేసేటప్పటికీ ‘దావీదు పట్ల’ అనే మూడవ పురుష ప్రయోగం, ప్రమాణంలోని సంక్షిప్తత, కాలసూచనలోని సందిగ్ధతలను నిలిపాం.
