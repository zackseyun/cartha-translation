  text: So Jonathan made a covenant with the house of David, and the LORD sought it from the hand of David’s enemies.
translation:
  language: te
  text: యోనాతాను దావీదు ఇంటివారితో నిబంధన చేశాడు. యెహోవా దావీదు శత్రువుల చేత లెక్క అడుగుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. క్రియరూపాన్ని పదశఃగా గతకాలంలో, “యెహోవా దావీదు శత్రువుల చేతినుంచి అడిగాడు/వెదికాడు” అని కూడా అర్థం చేసుకోవచ్చు. అయితే సందర్భంలో ఇది శాపవాక్యం లేదా కోరికగా, “యెహోవా ... అడుగుగాక” అని అర్థమవవచ్చు. క్రియకు కర్మం స్పష్టంగా చెప్పబడలేదు.
    reason: క్రియ యొక్క కాలం/విధి, అవ్యక్త కర్మం, అలాగే ‘చేతినుంచి అడగడం/వెదకడం’ అనే ప్రయోగంలోని మూలపాఠ సందిగ్ధతను తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיִּכְרֹת ... עִם
  choice: తో నిబంధన చేశాడు
  rationale: ‘కోయడం’ అనే హీబ్రూ పదశః రూపం ఇక్కడ నిబంధన కుదుర్చుకోవడానికి వాడే స్థిర ప్రయోగం; ఆధునిక తెలుగులో సహజమైన నిబంధన భాషగా అనువదించబడింది.
- source_word: בֵּית דָּוִד
  choice: దావీదు ఇంటివారు
  rationale: ‘ఇల్లు’ ఇక్కడ భవనం కాదు, దావీదు కుటుంబం మరియు అతని తరువాతి వంశాన్ని సూచిస్తుంది; ‘ఇంటివారు’ ఈ సామూహిక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וּבִקֵּשׁ ... מִיַּד
  choice: చేతినుంచి ... లెక్క అడగాలి
  rationale: בקשׁ מן־יד అనే సందర్భోచిత భావం బాధ్యత వహింపజేయడం లేదా జవాబు కోరడాన్ని సూచిస్తుంది. ‘లెక్క అడగాలి’ న్యాయపరమైన బాధ్యత భావాన్ని నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
theological_decisions:
- issue: וּבִקֵּשׁ క్రియను గతకాల ప్రకటనగా తీసుకోవాలా, కోరిక/శాపవాక్యంగా తీసుకోవాలా
  choice: యెహోవా లెక్క అడగాలి
  alternative: యెహోవా లెక్క అడిగాడు
  rationale: రూపం గతకాలంగా అర్థమయ్యే అవకాశం ఉన్నా, సందర్భంలో ఇది నిబంధనకు అనుబంధమైన ఆహ్వానం లేదా శాపవాక్యంగా ఉండే అవకాశం బలంగా ఉంది. పాఠంలోని ఉద్వేగాన్ని సిద్ధాంతపరంగా విప్పకుండా కోరికార్థకంగా ఉంచి, ప్రత్యామ్నాయాన్ని పాదటీకలో తెలిపాం.
- issue: క్రియకు స్పష్టమైన కర్మ లేకపోవడం
  choice: ప్రత్యక్ష కర్మను చేర్చకుండా ‘లెక్క అడగాలి’ అని అనువదించడం
  alternative: ‘దాని గురించి లెక్క అడగాలి’ లేదా ‘దానిని వెదకాలి’
  rationale: హీబ్రూ వాక్యంలో ‘దానిని’ అనే కర్మ ప్రత్యక్షంగా లేదు. దాన్ని చేర్చడం కంటే తెలుగులో కర్మ లేకుండానే సహజంగా ఉండే న్యాయపరమైన ప్రయోగాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సామాన్య పాఠకులకు సులభమైన శైలి. దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం. ‘అలా’ ముందరి సందర్భంతో అనుసంధానాన్ని చూపుతుంది; ఉద్ధరణచిహ్నాలు రెండో భాగాన్ని నిబంధనకు అనుబంధమైన పలుకుగా స్పష్టం చేస్తాయి.
