    rationale: The supplied English POB audit trail and theological decision specify “Yahweh” as the required rendering for יְהוָה. “యాహ్వే” is the corresponding Telugu transliteration.
  - severity: low
    issue: “నిబంధన విశ్వసనీయత చూపు” is overly abstract and unnatural in this direct appeal.
    rationale: חֶסֶד here can retain its loyal/covenantal nuance without turning it into an abstract noun phrase. “నమ్మకమైన దయ చూపు” is clear, idiomatic Telugu and does not overdefine the term.
