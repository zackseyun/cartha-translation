id: 1SA.20.8
reference: 1 Samuel 20:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ חֶ֨סֶד֙ עַל עַבְדֶּ֔/ךָ כִּ֚י בִּ/בְרִ֣ית יְהוָ֔ה הֵבֵ֥אתָ אֶֽת עַבְדְּ/ךָ֖ עִמָּ֑/ךְ וְ/אִם יֶשׁ בִּ֤/י עָוֺן֙ הֲמִיתֵ֣/נִי אַ֔תָּה וְ/עַד אָבִ֖י/ךָ לָ/מָּה זֶּ֥ה תְבִיאֵֽ/נִי־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
translation:
  language: te
  text: కాబట్టి నీ సేవకునికి నమ్మకమైన దయ చూపు[a]; ఎందుకంటే నీవు నీ సేవకుణ్ణి నీతోపాటు యాహ్వే నిబంధనలోకి తీసుకొచ్చావు. అయితే నాలో అపరాధం ఉంటే, నీవే నన్ను చంపు; నీ తండ్రి దగ్గరకు నన్ను ఎందుకు తీసుకెళ్తావు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సేవకునిపట్ల నిబంధనకు నమ్మకమైన ప్రేమ చూపు.” హీబ్రూ חֶסֶד అనే పదం దయ, నమ్మకమైన ప్రేమ, నిబంధనకు కట్టుబడిన విశ్వసనీయత అనే భావాలను కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד
  choice: నిబంధన విశ్వసనీయత చూపు
  rationale: חֶסֶד ఇక్కడ దయతోపాటు సంబంధానికి కట్టుబడిన నమ్మకమైన ప్రేమను సూచిస్తుంది; వెంటనే ప్రస్తావించబడే యెహోవా నిబంధన ఈ భావాన్ని బలపరుస్తుంది.
- source_word: עַל עַבְדֶּךָ
  choice: నీ సేవకుడిపట్ల
  rationale: עשה חסד עַל అనే ప్రయోగంలో עַל దయ లేదా విశ్వసనీయత ఎవరిపట్ల చూపాలో సూచిస్తుంది. ‘నీ సేవకుడు’ దావీదు వినయపూర్వక స్వీయసంబోధన.
- source_word: בִּבְרִית יְהוָה
  choice: యెహోవా నిబంధనలోకి
  rationale: בוא యొక్క హిఫీల్ రూపమైన הֵבֵאתָ ‘తీసుకొచ్చావు’ అని అర్థం; בִּבְרִיתను దానితో కలిపి నిబంధనలోకి ప్రవేశింపజేయడంగా సహజంగా అనువదించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  choice: నీవు నీ సేవకుణ్ణి నీతోపాటు ... తీసుకొచ్చావు
  rationale: עִמָּךְ యొక్క ‘నీతో’ అనే సహభాగిత భావాన్ని స్పష్టంగా కాపాడుతూ, యోనాతాను దావీదును తనతో కలిసి నిబంధన బంధంలోకి తీసుకొచ్చాడనే భావాన్ని అందిస్తుంది.
- source_word: וְאִם יֶשׁ בִּי עָוֹן
  choice: అయితే నాలో అపరాధం ఉంటే
  rationale: עָוֹן దోషం, అపరాధం, దాని బాధ్యత అనే భావాలను కలిగి ఉంటుంది; ఈ సందర్భంలో శిక్షకు పాత్రమైన అపరాధాన్ని సూచిస్తుంది.
- source_word: הֲמִיתֵנִי אַתָּה
  choice: నీవే నన్ను చంపు
  rationale: హిఫీల్ ఆజ్ఞారూపం మరణింపజేయమనే ప్రత్యక్ష విజ్ఞప్తి; ప్రత్యేక సర్వనామమైన אַתָּהకు ఉన్న ఉద్ఘాటనను ‘నీవే’ కాపాడుతుంది.
- source_word: וְעַד אָבִיךָ לָמָּה זֶּה תְבִיאֵנִי
  choice: నీ తండ్రి దగ్గరికి నన్నెందుకు తీసుకెళ్తావు?
  rationale: עַד గమ్యస్థానాన్ని, ‘దగ్గరికి/వరకు’ అనే భావాన్ని ఇస్తుంది. ప్రశ్న వాక్యంలోని అలంకారిక సవాలును సహజమైన ఆధునిక తెలుగులో నిలిపాం.
theological_decisions:
- issue: חֶסֶד యొక్క నిబంధనాత్మక భావం
  choice: నిబంధన విశ్వసనీయత
  alternative: దయ
  rationale: సాధారణ ‘దయ’ సాధ్యమైనప్పటికీ, తరువాతి నిబంధన ప్రస్తావన వల్ల విశ్వసనీయమైన నిబంధన ప్రేమ అనే పార్శ్వం ఇక్కడ ప్రధానంగా వినిపిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: దైవనామం יְהוָה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని బిరుదుగా మార్చకుండా తెలుగులో ప్రాచుర్యమున్న లిప్యంతరీకరణతో ఇచ్చాం.
- issue: నిబంధనలో భాగస్వామ్యం—עִמָּךְ అనుబంధం
  choice: నీతోపాటు యెహోవా నిబంధనలోకి
  alternative: యెహోవా నిబంధనలో నీతో సంబంధంలోకి
  rationale: עִמָּךְ వ్యాకరణపరంగా ‘నీతోపాటు’ అనే సహభాగితను సహజంగా సూచిస్తుంది. సంబంధార్థక విప్పుకూడా సాధ్యమే అయినా, మూలంలోని నిర్మాణాన్ని అతిగా నిర్ధారించకుండా ప్రత్యక్ష భావాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే ప్రత్యక్ష సంభాషణ శైలి. ‘నీ సేవకుడు’ అనే వినయపూర్వక స్వీయసూచనను నిలిపి, אַתָּה ఉద్ఘాటనను ‘నీవే’తో వ్యక్తం చేశాం.
