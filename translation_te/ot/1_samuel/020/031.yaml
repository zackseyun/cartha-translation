source:
  edition: WLC
  text: כִּ֣י כָל הַ/יָּמִ֗ים אֲשֶׁ֤ר בֶּן יִשַׁי֙ חַ֣י עַל הָ/אֲדָמָ֔ה לֹ֥א תִכּ֖וֹן אַתָּ֣ה וּ/מַלְכוּתֶ֑/ךָ וְ/עַתָּ֗ה שְׁלַ֨ח וְ/קַ֤ח אֹת/וֹ֙ אֵלַ֔/י כִּ֥י בֶן מָ֖וֶת הֽוּא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
translation:
  language: te
  text: ఎందుకంటే యెష్షె కుమారుడు భూమిమీద జీవించి ఉన్నంతకాలం, నీవుగానీ నీ రాజ్యంగానీ స్థిరపడవు. కాబట్టి ఇప్పుడు పంపించి అతణ్ణి నా దగ్గరికి రప్పించు; అతడు మరణానికి పాత్రుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతడు మరణ పుత్రుడు”; అంటే మరణానికి అర్హుడైనవాడు లేదా చావవలసినవాడు.
    reason: మూలభాష నుడికారాన్ని, దానిలోని స్వల్ప భావవిస్తృతిని చూపించడం.
lexical_decisions:
- source_word: כִּי
  choice: కాబట్టి ముందున్న వాక్యానికి కారణసూచక సంబంధంగా అనువాద నిర్మాణంలో వ్యక్తీకరించబడింది
  rationale: ఈ అవ్యయం సౌలు కోపానికి, ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు మొదటి వాక్యంలో ప్రత్యేకంగా ‘ఎందుకంటే’ అని పెట్టకుండా, రెండో వాక్యంలోని ‘కాబట్టి’తో తార్కిక సంబంధాన్ని స్పష్టం చేశాం.
- source_word: כָל הַיָּמִים אֲשֶׁר
  choice: జీవించి ఉన్నంతకాలం
  rationale: ఈ హీబ్రూ ప్రయోగం కాలవ్యవధిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఉన్నంతకాలం’ అదే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בֶּן יִשַׁי
  choice: యెష్షయి కుమారుడు
  rationale: సౌలు దావీదు పేరును పలకకుండా అతని తండ్రి పేరుతో తృణీకార దూరాన్ని చూపుతున్నాడు; అందువల్ల ‘దావీదు’గా మార్చలేదు.
- source_word: חַי עַל הָאֲדָמָה
  choice: భూమిమీద జీవించి ఉన్న
  rationale: ‘భూమి/నేల మీద సజీవంగా ఉండడం’ అనే మూలభావాన్ని నిలుపుతూ, దీనిని ప్రత్యేకంగా ఇశ్రాయేలు దేశానికి పరిమితం చేయలేదు.
- source_word: לֹא תִכּוֹן
  choice: స్థిరపడవు
  rationale: כון నిఫ్అల్ రూపంలోని స్థాపించబడడం, దృఢంగా నిలవడం అనే ఫలితార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַתָּה וּמַלְכוּתֶךָ
  choice: నీవుగానీ నీ రాజ్యంగానీ
  rationale: హీబ్రూ సముచ్చయంపై ఉన్న నిషేధాన్ని తెలుగులో సహజమైన ‘గానీ…గానీ’ నిర్మాణంతో వ్యక్తం చేశాం; ‘రాజ్యం’ ఇక్కడ రాజవంశ సంబంధమైన రాజకీయ భావాన్ని కలిగి ఉంది.
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందటి ప్రకటననుంచి వచ్చే అత్యవసర నిర్ధారణను, కాలసూచనను రెండింటినీ నిలుపుతుంది.
- source_word: שְׁלַח וְקַח אֹתוֹ אֵלַי
  choice: మనుషులను పంపించి అతణ్ణి నా దగ్గరికి రప్పించు
  rationale: జనులను పంపి దావీదును సౌలు దగ్గరికి తీసుకురావాలనే జత ఆజ్ఞల ఉద్దేశాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בֶּן מָוֶת הוּא
  choice: అతడు మరణానికి పాత్రుడు
  rationale: ‘మరణ పుత్రుడు’ అనే హీబ్రూ నుడికారానికి మరణశిక్షకు అర్హుడు అనే సందర్భార్థం ఉంది. ప్రధాన పాఠ్యంలో అర్థాన్ని స్పష్టంగా ఇచ్చి, మూలంలోని రూపాన్ని పాదసూచికలో భద్రపరిచాం.
theological_decisions:
- issue: בֶּן מָוֶת అనే నుడికారంలో అర్హత లేదా విధి అనే భావభేదం
  choice: మరణానికి పాత్రుడు
  alternative: చావవలసినవాడు / మరణానికి నిర్ణయించబడినవాడు
  rationale: ఈ సందర్భంలో సౌలు దావీదును చంపించేందుకు అప్పగించమని ఆజ్ఞాపిస్తున్నందున మరణదండనకు అర్హుడని అతడు ప్రకటిస్తున్న భావం ప్రధానంగా ఉంది. అయితే నుడికారం స్వయంగా ‘మరణానికి చెందినవాడు’ అనే విస్తృత భావాన్ని కలిగి ఉండగలదని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన సంభాషణ శైలి వాడబడింది. సౌలు ఉద్దేశపూర్వకంగా ఉపయోగించిన ‘యెష్షయి కుమారుడు’ అనే దూరీకరణను అలాగే ఉంచాం. ‘మనుషులను’ అనే పదం హీబ్రూ ఆజ్ఞలో అంతర్లీనంగా ఉన్న పంపబడే ప్రతినిధులను తెలుగులో స్పష్టపరుస్తుంది.
