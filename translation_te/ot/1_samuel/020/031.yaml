revisions:
- from: యెష్షయి కుమారుడు భూమిమీద జీవించి ఉన్నంతకాలం, నీవుగానీ నీ రాజ్యంగానీ స్థిరపడవు. కాబట్టి ఇప్పుడు మనుషులను పంపించి అతణ్ణి నా దగ్గరికి రప్పించు; అతడు మరణానికి పాత్రుడు.[a]
  to: ఎందుకంటే యెష్షె కుమారుడు భూమిమీద జీవించి ఉన్నంతకాలం, నీవుగానీ నీ రాజ్యంగానీ స్థిరపడవు. కాబట్టి ఇప్పుడు పంపించి అతణ్ణి నా దగ్గరికి రప్పించు; అతడు మరణానికి పాత్రుడు.[a]
  rationale: The revision explicitly renders the initial causal כִּי as “ఎందుకంటే,” retains וְעַתָּה as “కాబట్టి ఇప్పుడు,” removes the unsupported specification “మనుషులను,” and uses the standard Telugu name form “యెష్షె.” The death idiom remains contextually clear in the text and lexically transparent in the footnote.
