base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
translation:
  language: te
  text: “మీ నాన్న నా గైర్హాజరును తప్పకుండా గమనిస్తే[a], ‘దావీదు తన ఊరైన బేత్లెహేముకు త్వరగా వెళ్లడానికి నా అనుమతిని ఎంతో ఆత్రంగా కోరాడు[b][c]. అక్కడ కుటుంబమంతటికీ ఏటా అర్పించే బలి ఉంది[d]’ అని చెప్పు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను లేకపోవడాన్ని తప్పకుండా గుర్తిస్తే.” హెబ్రీలో ఒకే క్రియను ప్రత్యేక నిర్మాణంలో రెండుసార్లు ఉపయోగించి బలంగా చెప్పబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా అనుమతిని అత్యవసరంగా కోరాడు.” ఇక్కడ కూడా హెబ్రీ ప్రత్యేక క్రియా నిర్మాణం అభ్యర్థనలోని బలాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: పదశః, “బేత్లెహేముకు పరుగెత్తడానికి”; ఇక్కడ త్వరగా వెళ్లడం భావం.
    reason: lexical_alternative
  - marker: d
    text: లేదా, “వార్షిక బలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקֹד יִפְקְדֵנִי
  choice: నా గైర్హాజరును తప్పకుండా గమనిస్తే
  rationale: פקד క్రియకు infinitive absolute తో వచ్చిన బలాన్ని ‘తప్పకుండా’ తెలియజేస్తుంది. భోజనపు బల్ల వద్ద దావీదు లేకపోవడాన్ని సౌలు గమనించే సందర్భం కనుక తెలుగులో భావాన్ని స్పష్టంగా చెప్పేందుకు ‘నా గైర్హాజరును’ ఉపయోగించాం; ‘నేను లేకపోవడాన్ని’ కూడా సాధ్యమే.
- source_word: אָבִיךָ
  choice: మీ నాన్న
  rationale: దావీదు యోనాతానుతో నేరుగా మాట్లాడుతున్నాడు. ఆధునిక సాధారణ తెలుగులో సహజమైన సంబోధనగా ‘మీ నాన్న’ ఎంచుకున్నాం.
- source_word: נִשְׁאֹל נִשְׁאַל מִמֶּנִּי
  choice: నా అనుమతి ఎంతో పట్టుదలగా అడిగాడు
  rationale: שאל యొక్క infinitive absolute + finite verb నిర్మాణం అభ్యర్థనలోని బలాన్ని సూచిస్తుంది. వెళ్లడానికి అనుమతి అడిగే సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: לָרוּץ
  choice: వెంటనే వెళ్లడానికి
  rationale: పదశః ‘పరుగెత్తడానికి’; ఇక్కడ గమ్యస్థానానికి త్వరగా వెళ్లడమే సందర్భార్థం. అసాధారణంగా వినిపించే అక్షరార్థం బదులు సహజమైన భావానువాదం ఎంచుకున్నాం.
- source_word: בֵּית לֶחֶם עִירוֹ
  choice: తన ఊరైన బేత్లెహేముకు
  rationale: עִירוֹ పదశః ‘అతని పట్టణం’. జన్మస్థలం లేదా స్వస్థలం అనే సందర్భార్థాన్ని ఆధునిక తెలుగులో సహజంగా ‘తన ఊరు’ అని తెలిపాం.
- source_word: זֶבַח הַיָּמִים
  choice: ఏటా అర్పించే బలి
  rationale: ఈ పదబంధం నిర్ణీత కాలచక్రంలో పునరావృతమయ్యే బలిని సూచిస్తుంది; సందర్భంలో వార్షిక కుటుంబ బలిగా అర్థమవుతుంది.
- source_word: לְכָל הַמִּשְׁפָּחָה
  choice: కుటుంబమంతటికీ
  rationale: מִשְׁפָּחָה ‘కుటుంబం’ లేదా ‘వంశగుంపు’ అని అర్థమవుతుంది. ఇక్కడ కుటుంబ ఆచార సందర్భానికి ‘కుటుంబమంతటికీ’ సహజంగా సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణలో ‘మీ నాన్న’ సాధారణ పాఠకులకు సన్నిహితంగా ఉంటుంది. హెబ్రీలోని రెండు emphatic infinitive-absolute నిర్మాణాల బలాన్ని వరుసగా ‘తప్పకుండా’, ‘ఎంతో పట్టుదలగా’తో నిలిపాం. ప్రధాన వాక్యంలో భావస్పష్టతకు ‘గైర్హాజరు’, ‘వెంటనే వెళ్లడం’ వాడి, అక్షరార్థ ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఉంచాం.
