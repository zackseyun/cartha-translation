  text: וַ/יִּקְרָ֤א יְהֽוֹנָתָן֙ אַחֲרֵ֣י הַ/נַּ֔עַר מְהֵרָ֥ה ח֖וּשָׁ/ה אַֽל תַּעֲמֹ֑ד וַ/יְלַקֵּ֞ט נַ֤עַר יְהֽוֹנָתָן֙ אֶת ה/חצי וַ/יָּבֹ֖א אֶל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/038.yaml
  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
translation:
  language: te
  text: అప్పుడు యోనాతాను దూరంగా వెళ్తున్న ఆ బాలుణ్ణి పిలిచి, “త్వరపడు! త్వరగా! ఆగవద్దు!”[a] అన్నాడు. యోనాతాను సేవక బాలుడు బాణాలను[b] ఏరుకొని తన యజమాని వద్దకు వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, “నిలబడవద్దు.” సందర్భంలో దీని భావం, “ఆగవద్దు.”
    reason: lexical_alternative
  - marker: b
    text: “బాణాలు” అని అనువదించిన హీబ్రూ రూపం లిఖితపూర్వకంగా ఏకవచనంలా కనిపిస్తుంది; అయితే సందర్భం యోనాతాను వేసిన బాణాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אַחֲרֵי הַנַּעַר
  choice: ఆ బాలుడి వెనుకనుంచి ... కేక వేశాడు
  rationale: కרא ... אחרי ఇక్కడ దూరంగా వెళ్తున్న బాలుడికి వినిపించేలా పిలవడాన్ని సూచిస్తుంది. ‘కేక వేశాడు’ సందర్భంలోని గట్టిగా పిలిచే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מְהֵרָה חוּשָׁה
  choice: త్వరపడు! వేగంగా వెళ్లు!
  rationale: మూలంలో ఉన్న రెండు వేర్వేరు తొందరపరిచే వ్యక్తీకరణలను కలిపివేయకుండా, వాటి పునరుక్త అత్యవసరతను తెలుగులో నిలిపింది.
- source_word: אַל תַּעֲמֹד
  choice: ఆగవద్దు!
  rationale: పదశః ‘నిలబడవద్దు’; అయితే ఈ సందర్భంలో కదలికను ఆపవద్దనే భావం సహజంగా ఉంది.
- source_word: וַיְלַקֵּט
  choice: ఏరుకొని
  rationale: లָקַט నేలపై ఉన్న వస్తువులను ఒక్కొక్కటిగా సేకరించే చర్యను సూచిస్తుంది; బాణాలను తీసుకురావడానికి ‘ఏరుకొని’ సహజమైన తెలుగు.
- source_word: נַעַר יְהוֹנָתָן
  choice: యోనాతాను బాలుడు
  rationale: נַעַר అనే పదంలోని యౌవన/సేవక స్థితి భావాన్ని ‘బాలుడు’ నిలుపుతుంది; సందర్భం అతడు యోనాతానుకు సేవచేసేవాడని స్పష్టం చేస్తుంది.
- source_word: החצי
  choice: బాణాలను
  rationale: లిఖిత రూపం ఏకవచనంలా కనిపించినప్పటికీ, సందర్భం యోనాతాను వేసిన అనేక బాణాలను సూచిస్తుంది; అందువల్ల తెలుగు బహువచనం వాడబడింది.
- source_word: אֶל אֲדֹנָיו
  choice: తన యజమాని దగ్గరికి
  rationale: אָדוֹן ఇక్కడ బాలుడి మానవ అధికారి అయిన యోనాతానును సూచిస్తుంది. ‘యజమాని’ సేవా సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
