  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ద్విగుణ అత్యవసరతను రెండు చిన్న ఆజ్ఞలుగా నిలిపి, ‘నిలబడవద్దు’ అనే పదశః రూపానికి బదులుగా సందర్భానుసారమైన ‘ఆగవద్దు’ వాడబడింది.
