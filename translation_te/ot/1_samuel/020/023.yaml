id: 1SA.20.23
reference: 1 Samuel 20:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ֨/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְנוּ אֲנִ֣י וָ/אָ֑תָּה הִנֵּ֧ה יְהוָ֛ה בֵּינִ֥/י וּ/בֵינְ/ךָ֖ עַד עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/023.yaml
  text: And as for the matter that you and I have spoken of[a], behold, Yahweh is between me and you forever.
translation:
  language: te
  text: మరి, నేనూ నువ్వూ మాట్లాడుకున్న విషయమైతే[a], ఇదిగో, యాహ్వే నాకూ నీకూ మధ్య ఎప్పటికీ ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేనూ నువ్వూ పలికిన మాట.” హీబ్రూ దావార్ పదానికి “మాట,” “విషయం,” లేదా “కార్యం” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అది వారు ఇప్పుడే చర్చించిన ఒప్పంద విషయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַדָּבָר
  choice: మాట్లాడుకున్న విషయం విషయానికైతే
  rationale: דָּבָר అనే పదానికి ‘మాట,’ ‘విషయం,’ ‘కార్యం’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ అది దావీదు, యోనాతాను ఇప్పుడే చర్చించి అంగీకరించిన విషయాన్ని సూచిస్తుంది; వְ అనే అనుసంధానంతో వచ్చిన విషయప్రాధాన్యాన్ని ‘విషయం విషయానికైతే’ తెలియజేస్తుంది.
- source_word: אֲשֶׁר דִּבַּרְנוּ אֲנִי וָאָתָּה
  choice: మనం ఇద్దరం మాట్లాడుకున్న
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నేనూ నువ్వూ మాట్లాడుకున్న’ అని ఉన్నా, సహజమైన ఆధునిక తెలుగులో పరస్పర సంభాషణను ‘మనం ఇద్దరం మాట్లాడుకున్న’ అని స్పష్టంగా చెప్పడం సముచితం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: హִנֵּה గంభీరమైన శ్రద్ధను ఆకర్షించే సంభాషణా సూచకం. ‘ఇదిగో’ దాని బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో దేవుని వ్యక్తిగత నామమైన చతురక్షర నామం నేరుగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: בֵּינִי וּבֵינְךָ
  choice: నాకు నీకు మధ్య
  rationale: హీబ్రూ క్రమాన్ని నిలుపుతూ, ఇద్దరి మధ్య యాహ్వే ఉన్నాడనే గంభీరమైన ఒడంబడిక సంబంధ భావాన్ని అతివ్యాఖ్య లేకుండా వ్యక్తం చేస్తుంది.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: ఈ పదబంధం నిరంతరమైన కాలవ్యాప్తిని సూచిస్తుంది. ‘శాశ్వతంగా’ ఆధునిక, గంభీరమైన తెలుగు రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వచనంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. అందువల్ల వ్యక్తిగత నామాన్ని ‘యాహ్వే’గా నిలిపాం.
- issue: యాహ్వే ఇద్దరి ‘మధ్య’ ఉండడం అనే భావం
  choice: యాహ్వే నాకు నీకు మధ్య శాశ్వతంగా ఉంటాడు
  alternative: యాహ్వే మన ఒప్పందానికి శాశ్వత సాక్షిగా ఉంటాడు
  rationale: సందర్భం ఒడంబడిక సాక్షి లేదా హామీదారు అనే భావాన్ని సూచించినా, మూలపాఠం కేవలం ‘మధ్య’ అని చెబుతుంది. అందువల్ల ఆ భావాన్ని వివరణగా వచనంలో చేర్చకుండా మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర శైలిని ఉపయోగించాం. ‘ఇదిగో’ అనే పదం హీబ్రూ సంభాషణా బలాన్ని నిలుపుతుంది; ‘మధ్య’ అనే రూపం ఒడంబడిక సాక్షిత్వ భావాన్ని అతిగా విప్పకుండా కాపాడుతుంది.
