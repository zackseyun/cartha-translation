  text: הַ/נַּעַר֮ בָּא֒ וְ/דָוִ֗ד קָ֚ם מֵ/אֵ֣צֶל הַ/נֶּ֔גֶב וַ/יִּפֹּ֨ל לְ/אַפָּ֥י/ו אַ֛רְצָ/ה וַ/יִּשְׁתַּ֖חוּ שָׁלֹ֣שׁ פְּעָמִ֑ים וַֽ/יִּשְּׁק֣וּ אִ֣ישׁ אֶת רֵעֵ֗/הוּ וַ/יִּבְכּוּ֙ אִ֣ישׁ אֶת רֵעֵ֔/הוּ עַד דָּוִ֖ד הִגְדִּֽיל׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
translation:
  language: te
  text: ఆ బాలుడు వెళ్లిపోయిన తరువాత, దావీదు దక్షిణం వైపు ఉన్న చోటు పక్కనుండి[a] లేచి, నేలమీద ముఖం ఆనేటట్లు పడి, మూడుసార్లు వంగి నమస్కరించాడు. తరువాత వారిద్దరూ ఒకరినొకరు ముద్దుపెట్టుకొని, కలిసి ఏడ్చారు; దావీదు మరింతగా ఏడ్చాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యభాగం క్లిష్టమైనది; అక్షరార్థంగా ‘దక్షిణం పక్కనుండి’ లేదా ‘నెగెవు పక్కనుండి.’ సందర్భాన్ని బట్టి కొందరు దీనిని దావీదు దాగివున్న గుట్ట లేదా రాయి దగ్గరగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘దావీదు మరింతగా ఏడ్చే వరకు’; అంటే అతని ఏడుపు యోనాతాను ఏడుపును మించింది లేదా మరింత తీవ్రమైంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  choice: ఆ బాలుడు వెళ్లిపోయిన తరువాత
  rationale: మసొరేటిక్ పాఠంలో అక్షరార్థంగా ‘బాలుడు వచ్చాడు’ అని ఉన్నా, ముందరి సందర్భంలో యోనాతాను బాలుణ్ణి పట్టణానికి పంపి, అతడు వెళ్లిపోయిన తరువాత దావీదు బయటకు వస్తాడు. తెలుగు కథనంలో సందర్భార్థాన్ని స్పష్టంగా తెలియజేయడానికి ఇలా అనువదించాం; పాఠభేద సంబంధిత క్లిష్టతను ప్రత్యేక పాదటిప్పణిలో భారంగా మోపలేదు.
- source_word: מֵאֵצֶל הַנֶּגֶב
  choice: దక్షిణం వైపు ఉన్న చోటు పక్కనుండి
  rationale: נֶגֶב సాధారణంగా ‘దక్షిణం/దక్షిణ ప్రాంతం’ అని అర్థం. వాక్యభాగం క్లిష్టమైనందున ‘గుట్ట’ లేదా ‘రాయి’ అని పాఠంలో నిర్ధారించకుండా మూలంలోని దిశాసూచక భావాన్ని నిలిపి, పాదటిప్పణిలో అనిశ్చితిని తెలిపాం.
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה
  choice: నేలమీద సాష్టాంగపడి
  rationale: ముఖం నేలకు ఆనేటట్లు పడే భంగిమను సహజమైన, గౌరవప్రదమైన తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  choice: మూడుసార్లు వంగి నమస్కరించాడు
  rationale: ఈ సందర్భంలో שׁחה గౌరవంతో వంగి నమస్కరించడాన్ని సూచిస్తుంది; ‘ఆరాధించాడు’ అనడం మతపరమైన అర్థాన్ని అనవసరంగా చేర్చుతుంది.
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ
  choice: వారిద్దరూ ఒకరినొకరు ముద్దుపెట్టుకొని
  rationale: పరస్పర క్రియను సహజమైన తెలుగులో, వీడ్కోలు సందర్భంలోని ప్రేమాభిమానాన్ని తగ్గించకుండా అనువదించాం.
- source_word: וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: కలిసి ఏడ్చారు
  rationale: హీబ్రూ పరస్పర నిర్మాణం ఇక్కడ ఇద్దరూ కలిసి దుఃఖించారనే భావాన్ని ఇస్తుంది; తెలుగు వాడుకలో ఇది సహజంగా ఉంటుంది.
- source_word: עַד דָּוִד הִגְדִּיל
  choice: దావీదు మరింతగా ఏడ్చాడు
  rationale: הִגְדִּיל అక్షరార్థంగా ‘పెంచాడు/మించిపోయాడు’; ఏడుపు సందర్భంలో దావీదు ఏడుపు అధికమైందని సూచిస్తుంది. అది యోనాతాను ఏడుపును మించిందా లేక తీవ్రత పెరిగిందా అన్న అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
