  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలి పాటించబడింది. ‘సాష్టాంగపడి’ అనే పదం ఇక్కడ ఆరాధనను నిర్బంధంగా సూచించకుండా, ముఖం నేలకు ఆనేటట్లు పడిన భంగిమను తెలుపుతుంది. మూలంలోని స్థలసూచక మరియు తులనాత్మక అస్పష్టతలను పాదటిప్పణుల్లో భద్రపరిచాం.
