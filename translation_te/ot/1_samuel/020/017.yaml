source:
  edition: WLC
  text: וַ/יּ֤וֹסֶף יְהֽוֹנָתָן֙ לְ/הַשְׁבִּ֣יעַ אֶת דָּוִ֔ד בְּ/אַהֲבָת֖/וֹ אֹת֑/וֹ כִּֽי אַהֲבַ֥ת נַפְשׁ֖/וֹ אֲהֵבֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/017.yaml
  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
translation:
  language: te
  text: యోనాతాను దావీదుపట్ల తనకున్న ప్రేమను బట్టి దావీదును మళ్లీ ప్రమాణం చేయించాడు[a], ఎందుకంటే అతడు దావీదును తన ప్రాణంలా ప్రేమించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోనాతాను దావీదును ప్రమాణం చేయిస్తూనే ఉన్నాడు”; లేదా, “యోనాతాను దావీదును మళ్లీ ప్రమాణబద్ధుణ్ణి చేశాడు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “తన ప్రాణపు ప్రేమతో అతనిని ప్రేమించాడు”; ఇది గాఢమైన వ్యక్తిగత అనురాగాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: మళ్లీ
  rationale: יסף తరువాత కారక క్రియారూపం రావడం వల్ల, ఇక్కడ చర్య పునరావృతమైందనే భావం వస్తుంది. ఆధునిక తెలుగులో ‘మళ్లీ’ సహజంగా, స్పష్టంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לְהַשְׁבִּיעַ
  choice: ప్రమాణం చేయించాడు
  rationale: שבע హిఫిల్ రూపం మరొకరితో ప్రమాణం చేయించడం లేదా అతణ్ణి ప్రమాణబద్ధుణ్ణి చేయడం అనే కారక భావాన్ని కలిగిస్తుంది. ‘ప్రమాణం చేయించాడు’ ఆ బలాన్ని నిలుపుతుంది.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: దావీదుపట్ల తనకున్న ప్రేమనుబట్టి
  rationale: בְּ ఇక్కడ ప్రమాణాన్ని మళ్లీ చేయించడానికి ఆధారం లేదా ప్రేరణను సూచించవచ్చు. సర్వనామాల వల్ల తెలుగులో కలిగే అనవసర గందరగోళాన్ని తగ్గించడానికి ‘దావీదుపట్ల’ అని స్పష్టం చేయబడింది; అయితే మూలంలోని సంక్షిప్త సంబంధం నిలుపబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ అవ్యయం యోనాతాను చర్యకు వివరణను పరిచయం చేస్తుంది. ‘ఎందుకంటే’ ఆధునిక తెలుగులో ఆ కారణసంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַהֲבַת נַפְשׁוֹ
  choice: తన ప్రాణంలా
  rationale: נֶפֶשׁ ఇక్కడ ప్రాణం, స్వయం, జీవితం అనే భావక్షేత్రాన్ని కలిగిన హీబ్రూ నుడికారం. ‘తన ప్రాణంలా’ గాఢమైన వ్యక్తిగత ప్రేమను సహజమైన తెలుగులో తెలియజేస్తూ ‘ఆత్మ’ అనే సాంకేతిక అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: אֲהֵבוֹ
  choice: దావీదును ... ప్రేమించాడు
  rationale: ఈ క్రియ యోనాతాను ప్రేమను వివరణాత్మక వాస్తవంగా పేర్కొంటుంది. తెలుగులో కర్త, కర్మ స్పష్టత కోసం దావీదు పేరు పునరుక్తి చేయబడింది.
theological_decisions:
- issue: దావీదుపట్ల యోనాతాను ప్రేమ స్వభావం
  choice: ‘ప్రేమించాడు’ అనే బలమైన పదాన్ని ఉంచి, దానిని ‘తన ప్రాణంలా’ అని వ్యక్తపరచడం
  alternative: దానిని కేవలం ‘స్నేహం’గా తగ్గించడం లేదా మూలంలో లేని శృంగార/లైంగిక భావాన్ని చేర్చడం
  rationale: אהב పదజాలం గాఢమైన వ్యక్తిగత, నిబంధనాత్మక అనురాగాన్ని వ్యక్తపరుస్తుంది. అనువాదం ఆ తీవ్రతను నిలుపుతూ, వచనం స్పష్టంగా చెప్పని సంబంధ స్వభావాన్ని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే కథనానికి తగిన గౌరవప్రదమైన శైలి. సర్వనామాల సందిగ్ధతను తగ్గించడానికి దావీదు పేరు అవసరమైన చోట స్పష్టం చేయబడింది.
