id: 1SA.20.5
reference: 1 Samuel 20:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוֹנָתָ֗ן הִֽנֵּה חֹ֨דֶשׁ֙ מָחָ֔ר וְ/אָנֹכִ֛י יָשֹׁב אֵשֵׁ֥ב עִם הַ/מֶּ֖לֶךְ לֶ/אֱכ֑וֹל וְ/שִׁלַּחְתַּ֨/נִי֙ וְ/נִסְתַּרְתִּ֣י בַ/שָּׂדֶ֔ה עַ֖ד הָ/עֶ֥רֶב הַ/שְּׁלִשִֽׁית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
translation:
  language: te
  text: 'దావీదు యోనాతానుతో ఇలా అన్నాడు: “చూడు, రేపు అమావాస్య[a]. నేను రాజుతో కలిసి భోజనం చేయడానికి కూర్చోవలసి ఉంటుంది. అయితే నన్ను వెళ్లనివ్వు; మూడవ సాయంత్రం[b] వరకు పొలంలో దాక్కుంటాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అమావాస్య” నెలనెలా జరిగే అమావాస్య ఆచరణను సూచిస్తుంది; ఆ సందర్భంలో ప్రత్యేక భోజనం చేయడం ఆనవాయితీగా ఉండేది.
    reason: cultural_note
  - marker: b
    text: లేదా “మూడవ రోజు సాయంత్రం వరకు.” హీబ్రూ పదబంధం సంక్షిప్తంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: చూడు
  rationale: మాటలోని విషయంపై యోనాతాను దృష్టిని మళ్లించే సూచనాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: חֹדֶשׁ מָחָר
  choice: రేపు అమావాస్య
  rationale: ఈ సందర్భంలో חֹדֶשׁ కేవలం ‘నెల’ను కాక, అమావాస్య ఆచరణను సూచిస్తుంది; ‘అమావాస్య’ తెలుగులో సహజంగా ఆ దినాన్ని తెలియజేస్తుంది.
- source_word: יָשֹׁב אֵשֵׁב
  choice: కూర్చోవలసి ఉంటుంది
  rationale: క్రియకు ముందు వచ్చిన అదే ధాతువు యొక్క infinitive absolute హాజరు కావాలనే బలమైన సామాజిక నిరీక్షణను సూచిస్తుంది. ఈ తెలుగు రూపం వ్యక్తిగత నైతిక కర్తవ్యమని అతిగా నిర్ధారించకుండా ఆ నిరీక్షణను తెలియజేస్తుంది.
- source_word: עִם הַמֶּלֶךְ לֶאֱכֹל
  choice: రాజుతో కలిసి భోజనం చేయడానికి
  rationale: రాజుతో కూడ భోజనానికి కూర్చోవడం అనే మూలంలోని స్పష్టమైన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְשִׁלַּחְתַּנִי
  choice: అయితే నన్ను వెళ్లనివ్వు
  rationale: పదశః ‘నన్ను పంపు/విడిచిపెట్టు’; సందర్భంలో తన గైర్హాజరుకు అనుమతి ఇవ్వమని దావీదు కోరుతున్నందున ఈ రూపం సహజంగా సరిపోతుంది.
- source_word: וְנִסְתַּרְתִּי
  choice: దాక్కుంటాను
  rationale: ముందున్న అనుమతి అభ్యర్థనకు అనుసంధానమైన దావీదు ఉద్దేశాన్ని సరళంగా తెలియజేస్తుంది; ప్రతిఫలార్థక భావం తెలుగులో ఈ క్రియలో సహజంగానే ఉంది.
- source_word: בַשָּׂדֶה
  choice: పొలంలో
  rationale: ఏకవచనంలోని ‘field’ అనే స్థలార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: עַד הָעֶרֶב הַשְּׁלִשִׁית
  choice: మూడవ సాయంత్రం వరకు
  rationale: హీబ్రూ పదబంధంలోని సంక్షిప్తతను, దాని నిజమైన అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, సాధ్యమైన వివరణను పాదసూచికలో ఇస్తుంది.
