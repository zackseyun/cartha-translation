translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘కూర్చోవలసి ఉంటుంది’ అనే రూపం రాజభోజనానికి హాజరు కావాలనే నిరీక్షణను చూపుతుంది; దానిని వ్యక్తిగత నైతిక విధిగా మార్చదు. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వాటి విషయాలకు నేరుగా అనుసంధానించబడ్డాయి.
