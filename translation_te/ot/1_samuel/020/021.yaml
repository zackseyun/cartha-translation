source:
  edition: WLC
  text: וְ/הִנֵּה֙ אֶשְׁלַ֣ח אֶת הַ/נַּ֔עַר לֵ֖ךְ מְצָ֣א אֶת הַ/חִצִּ֑ים אִם אָמֹר֩ אֹמַ֨ר לַ/נַּ֜עַר הִנֵּ֥ה הַ/חִצִּ֣ים מִמְּ/ךָ֣ וָ/הֵ֗נָּה קָחֶ֧/נּוּ וָ/בֹ֛אָ/ה כִּֽי שָׁל֥וֹם לְ/ךָ֛ וְ/אֵ֥ין דָּבָ֖ר חַי יְהוָֽה־־־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
translation:
  language: te
  text: ఇదిగో, నేను ఆ యువకుణ్ణి పంపుతాను; అతనితో, ‘వెళ్లి బాణాలను వెతుకు’ అని చెబుతాను. నేను ఆ యువకునితో, ‘ఇదిగో, బాణాలు నీకు ఈ వైపునే ఉన్నాయి[a]; వాటిని తీసుకొని రా’ అని స్పష్టంగా చెబితే, నీకు క్షేమమే; ఏ అపాయమూ లేదు—యాహ్వే జీవిస్తున్నట్టుగా![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాణాలు నీకంటే దగ్గరగా ఉన్నాయి.” హీబ్రూ మాట బాణాలు యువకుణ్ణి దాటి అవతల కాకుండా, అతనికి యోనాతాను వైపున పడ్డాయని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “యాహ్వే జీవిస్తున్నట్టుగా.” ఇది ముందున్న మాట నిజమని గట్టిగా ధృవీకరించే ప్రమాణ సూత్రం.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తరువాత చేయబోయే పనిపై శ్రద్ధ నిలిపే సూచనాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగు మాటతో వ్యక్తం చేస్తుంది.
- source_word: אֶשְׁלַח אֶת־הַנַּעַר
  choice: నేను ఆ యువకుణ్ణి పంపుతాను
  rationale: נַעַר అనే పదం బాలుడు, యువకుడు లేదా పరిచారకుడు అనే అర్థాలు ఇవ్వగలదు. సందర్భంలో యోనాతాను వెంట ఉన్న యువకుడు ఉద్దేశం; ‘యువకుడు’ వయస్సు/స్థితిని నిలుపుతూ సేవకత్వాన్ని అనవసరంగా ఖరారు చేయదు.
- source_word: לֵךְ מְצָא אֶת־הַחִצִּים
  choice: ‘వెళ్లి బాణాలను వెతుకు’ అని చెప్పి
  rationale: హీబ్రూ ఆజ్ఞల క్రమాన్ని తెలుగులో సహజమైన ప్రత్యక్ష ఉక్తిగా అందిస్తుంది; מָצָא కు ‘వెతుకు’ సందర్భోచితం.
- source_word: אִם אָמֹר אֹמַר
  choice: నేను … స్పష్టంగా చెబితే
  rationale: క్రియావిశేష బలం కలిగించే infinitive absolute + finite verb నిర్మాణాన్ని అతిశయోక్తి లేకుండా ‘స్పష్టంగా’ అని వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה
  choice: ఇదిగో, బాణాలు నీకు ఇవతల ఉన్నాయి
  rationale: బాణాలు యువకుణ్ణి దాటి అవతల పడలేదని, అతనికి వక్తవైపు ఇవతల ఉన్నాయని సూచిస్తుంది. తరువాతి వచనంలోని ‘నీకు అవతల’ అనే సంకేతంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: קָחֶנּוּ וָבֹאָה
  choice: వాటిని తీసుకొని రా
  rationale: రూపపరంగా ఏకవచన ప్రత్యయం ఉన్నప్పటికీ దాని సూచితం బహువచనమైన ‘బాణాలు’; తెలుగు సహజంగా బహువచనాన్ని వాడుతుంది. దిశాసూచక రూపాన్ని ‘రా’ నిలుపుతుంది.
- source_word: כִּי שָׁלוֹם לְךָ
  choice: నీకు క్షేమమే
  rationale: שָׁלוֹם ఇక్కడ దావీదు సురక్షితంగా, క్షేమంగా ఉన్నాడనే సంకేతం. ‘క్షేమం’ శాంతి/సురక్షిత స్థితి భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְאֵין דָּבָר
  choice: ఏ అపాయమూ లేదు
  rationale: సందర్భంలో דָּבָר సాధారణ ‘విషయం’ కాక ప్రతికూల పరిస్థితి లేదా ముప్పును సూచిస్తుంది; ‘అపాయం’ సంకేతపు ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חַי יְהוָה
  choice: యాహ్వే జీవం తోడు!
  rationale: ఇది ప్రకటన సత్యమని ధృవీకరించే హీబ్రూ ప్రమాణ సూత్రం. తెలుగు బైబిలు శైలిలో సహజమైన ప్రమాణ రూపాన్ని ఉపయోగిస్తూ దైవనామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం మూలరూప భేదాన్ని నిలుపుతుంది.
- issue: חַי יְהוָה అనే ప్రమాణ సూత్రం
  choice: యాహ్వే జీవం తోడు!
  alternative: యాహ్వే జీవిస్తున్నంత నిశ్చయంగా
  rationale: ఇది కేవలం దేవుడు జీవిస్తున్నాడనే వేదాంత ప్రకటన మాత్రమే కాక, ముందున్న మాట నిజమని ధృవీకరించే ప్రమాణం. తెలుగు ప్రమాణ సూత్రం ఆ వాక్ప్రయోగ బలాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఇదిగో’ సూచనాత్మక బలాన్ని, ‘యాహ్వే జీవం తోడు’ ప్రమాణ స్వరాన్ని నిలుపుతాయి. దిశాసూచక సంకేతంలోని ఇవతల/అవతల వ్యత్యాసం తరువాతి వచనంతో సరిపడేలా కాపాడబడింది.
