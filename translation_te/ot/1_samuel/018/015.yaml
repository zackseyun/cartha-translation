translation:
  language: te
  text: సౌలు అతడు ఎంతో వివేకంగా వ్యవహరిస్తున్నాడని[a] చూసి, అతనికి భయపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎంతో సఫలమవుతున్నాడని,” లేదా “ఎంతో వర్ధిల్లుతున్నాడని.” ఈ హెబ్రీ పదం వివేకంగా వ్యవహరించడాన్నీ, దాని ఫలితంగా కలిగే విజయాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא שָׁאוּל
  choice: సౌలు ... చూసి
  rationale: వావ్-క్రమకథన రూపం కథను ముందుకు నడిపిస్తూ, మొదటి చర్య రెండవ చర్యకు సందర్భమని తెలియజేస్తుంది; తెలుగులో అసమాపక క్రియ సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר הוּא
  choice: అతడు ... అని
  rationale: సౌలు గ్రహించిన విషయాన్ని తెలిపే ఉపవాక్యంగా సహజమైన ఆధునిక తెలుగు నిర్మాణం.
- source_word: מַשְׂכִּיל מְאֹד
  choice: ఎంతో వివేకంగా వ్యవహరిస్తున్నాడు
  rationale: שׂכל హిఫిల్ రూపం వివేకయుక్తమైన ప్రవర్తనను, దానివల్ల కలిగే విజయాన్ని సూచించగలదు. ప్రధాన పాఠంలో క్రియ యొక్క ప్రవర్తనా భావాన్ని ఉంచి, విజయార్థాన్ని పాదసూచికలో ఇచ్చి మూలంలోని అర్థవిస్తృతిని కాపాడాం.
- source_word: וַיָּגָר מִפָּנָיו
  choice: అతనికి భయపడ్డాడు
  rationale: అక్షరార్థంగా ‘అతని సన్నిధి నుండి భయపడ్డాడు’ అనే హెబ్రీయ నుడికారం; తెలుగులో వ్యక్తిపట్ల భయాన్ని సహజంగా ‘అతనికి భయపడ్డాడు’ అని వ్యక్తం చేస్తారు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘వివేకంగా వ్యవహరిస్తున్నాడు’ అనే రూపం మూల క్రియలోని ప్రవర్తనా భావాన్ని నిలుపుతుంది; దాని విజయ/వర్ధిల్లే భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
