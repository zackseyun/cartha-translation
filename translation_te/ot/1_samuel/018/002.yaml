translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ వాక్యంలో కర్మ సర్వనామంగా ఉన్నప్పటికీ, తెలుగు పాఠకునికి స్పష్టత కోసం సందర్భానుసారంగా ‘దావీదు’ అని పేర్కొనబడింది. ప్రధాన పాఠంలో [a] సూచికను చేర్చాం.
