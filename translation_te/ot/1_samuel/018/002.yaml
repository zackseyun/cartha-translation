  text: Saul took him that day and did not allow him to return to his father's house[a].
translation:
  language: te
  text: ఆ రోజున సౌలు దావీదును తన దగ్గరకు తీసుకున్నాడు; అతని తండ్రి ఇంటికి తిరిగి వెళ్లడానికి అతనిని అనుమతించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తిరిగి వెళ్లనివ్వలేదు.’ హీబ్రూలో పదశః, ‘తిరిగి వెళ్లడానికి అతనిని ఇవ్వలేదు’ అని ఉంది; ఇక్కడ נתן అనే పదం అనుమతి ఇవ్వడం అనే నుడికారార్థంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: దావీదును తన దగ్గరే ఉంచుకొని
  rationale: לקח యొక్క ప్రాథమిక అర్థం ‘తీసుకొను.’ అయితే ఈ సందర్భంలో సౌలు దావీదును తన సేవలో, తన దగ్గర ఉంచుకున్నాడనే భావం ఉంది. తెలుగులో కేవలం ‘అతనిని తీసుకున్నాడు’ అనడం అసహజంగా లేదా అస్పష్టంగా ఉండవచ్చు; ముందున్న సందర్భం ఆధారంగా సూచిత నామమైన ‘దావీదు’ను ఉపయోగించి, సందర్భార్థాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: కాలసూచనను సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְלֹא נְתָנוֹ
  choice: అనుమతించలేదు
  rationale: נתן + క్రియార్థక రూపం ఇక్కడ అనుమతి ఇవ్వడం అనే నుడికారార్థంలో ఉంది. పదశః ‘ఇవ్వలేదు’ అనడం తెలుగులో అర్థాన్ని మరుగుపరుస్తుంది.
- source_word: לָשׁוּב
  choice: తిరిగి వెళ్లడానికి
  rationale: שׁוב యొక్క ‘తిరిగి వెళ్లు/చేరు’ అనే భావాన్ని గమ్యస్థానంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּית אָבִיו
  choice: అతని తండ్రి ఇంటికి
  rationale: హీబ్రూ కుటుంబ నుడికారాన్ని స్పష్టమైన, సహజమైన తెలుగులో నిలుపుతుంది; ఇది తండ్రి గృహం లేదా కుటుంబ నివాసాన్ని సూచిస్తుంది.
