source:
  edition: WLC
  text: וַ/יְהִ֥י דָוִ֛ד לְ/כָל דָּרְכָ֖/ו מַשְׂכִּ֑יל וַֽ/יהוָ֖ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/014.yaml
  text: And David was acting wisely in all his ways[a], and Yahweh was with him.
translation:
  language: te
  text: దావీదు తన అన్ని వ్యవహారాలలో వివేకంగా ప్రవర్తించాడు[a], యాహ్వే అతనితో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన అన్ని వ్యవహారాలలో సఫలమయ్యాడు” లేదా “వర్ధిల్లాడు.” హీబ్రూ పదం వివేకంతో ప్రవర్తించడాన్ని, దాని ఫలితంగా సఫలతను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דָוִד
  choice: దావీదు ... ఉన్నాడు
  rationale: ఈ సందర్భంలో היה రూపం దావీదు కొనసాగిస్తూ వచ్చిన ప్రవర్తనా తీరును పరిచయం చేస్తుంది; తెలుగులో సహజంగా ఉండేందుకు కొనసాగింపు భావంతో అనువదించబడింది.
- source_word: לְכָל דָּרְכָו
  choice: తన మార్గాలన్నిటిలో
  rationale: דֶּרֶךְ అనే పదంలోని ‘మార్గం’ రూపకాన్ని నిలుపుతూ, దావీదు ప్రవర్తన మరియు కార్యాలన్నిటిని సూచించే తెలుగు నుడికారంగా ఇచ్చాం.
- source_word: מַשְׂכִּיל
  choice: వివేకంగా ప్రవర్తిస్తూ
  rationale: שׂכל హిఫీల్ కృదంతం వివేకంతో వ్యవహరించడాన్ని, దాని ఫలితంగా సఫలత పొందడాన్ని కూడా సూచించగలదు. ప్రధాన పాఠంలో వివేకపూర్వక ప్రవర్తనను ఉంచి, ఫలితార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: మూలంలోని יְהוָה అనే దైవనామాన్ని తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: עִמּוֹ
  choice: అతనికి తోడుగా ఉన్నాడు
  rationale: దైవిక సన్నిధి, అనుగ్రహం, సహాయం అనే సందర్భార్థాలను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని ‘అతనితో’ అనే సంబంధాన్ని అతిగా వ్యాఖ్యానించదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే నిలిపాం. ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: מַשְׂכִּיל లో ప్రవర్తన–సఫలత మధ్య భావ ఉద్రిక్తత
  choice: ప్రధాన పాఠంలో ‘వివేకంగా ప్రవర్తిస్తూ’
  alternative: ‘సఫలుడవుతూ’ / ‘వర్ధిల్లుతూ’
  rationale: ఈ పదం వివేకపూర్వక కార్యాచరణను, దానితో కలిగే విజయాన్ని రెండింటినీ సూచించవచ్చు. విజయాన్ని మాత్రమే ఎంచుకొని కారణ–ఫలిత సంబంధాన్ని ముందుగానే నిర్ణయించకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మార్గాలన్నిటిలో’ అనే హీబ్రూ రూపకాన్ని నిలిపి, ‘వివేకంగా ప్రవర్తిస్తూ’ ద్వారా కొనసాగుతున్న ప్రవర్తనా ధోరణిని స్పష్టంచేశాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో చేర్చబడింది.
