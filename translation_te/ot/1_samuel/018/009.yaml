    text: లేదా, “ఆ రోజు నుంచీ సౌలు దావీదును గమనిస్తూ ఉన్నాడు.” ఇక్కడి హీబ్రూ పదం అసూయతో లేదా అనుమానంతో కూడిన అప్రమత్తమైన, విరోధపూరిత గమనింపును సూచించవచ్చు.
