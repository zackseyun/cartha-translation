lexical_decisions:
- source_word: וַיְהִי
  choice: గమనిస్తూ వచ్చాడు
  rationale: హీబ్రూ కథన సంధానంతో పాటు కొనసాగుతున్న స్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: עון
  choice: అనుమానంతో గమనిస్తూ
  rationale: ఈ అరుదైన/లోపలిపి రూపం ఇక్కడ తటస్థంగా చూడడాన్ని కాక, విరోధం లేదా అసూయతో నిశితంగా గమనించడాన్ని సూచిస్తుంది. ‘అనుమానంతో’ అనే పదం సందర్భార్థాన్ని సహజంగా తెలియజేస్తూ, అసూయనే ఏకైక అర్థంగా నిర్ధారించదు.
- source_word: אֶת
  choice: దావీదును
  rationale: హీబ్రూలో ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగులో కర్మవిభక్తి ‘ను’ ద్వారా వ్యక్తమైంది.
- source_word: דָּוִד
  choice: దావీదు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: מֵהַיּוֹם הַהוּא
  choice: ఆ రోజు మొదలుకొని
  rationale: కొనసాగుతున్న వైఖరికి ఆరంభ సమయాన్ని స్పష్టంగా, సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: וָהָלְאָה
  choice: వచ్చాడు
  rationale: ‘అప్పటి నుండి ముందుకు/తరువాత కూడా’ అనే కొనసాగింపు భావాన్ని ‘గమనిస్తూ వచ్చాడు’ అనే తెలుగు క్రియారూపంలో సహజంగా కలిపింది.
