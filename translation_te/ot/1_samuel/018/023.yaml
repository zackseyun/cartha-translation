translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ నుడికారాలను యాంత్రికంగా కాకుండా భావసమానతతో అందిస్తూ, దావీదు ప్రశ్నలోని వినయాన్నీ సామాజిక వ్యత్యాసాన్నీ నిలిపింది.
