  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְדַבְּר֞וּ עַבְדֵ֤י שָׁאוּל֙ בְּ/אָזְנֵ֣י דָוִ֔ד אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יֹּ֣אמֶר דָּוִ֗ד הַֽ/נְקַלָּ֤ה בְ/עֵֽינֵי/כֶם֙ הִתְחַתֵּ֣ן בַּ/מֶּ֔לֶךְ וְ/אָנֹכִ֖י אִֽישׁ רָ֥שׁ וְ/נִקְלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
translation:
  language: te
  text: సౌలు సేవకులు ఈ మాటలను దావీదు వినేలా చెప్పారు. దావీదు, “రాజుకు అల్లుడు కావడం మీ దృష్టిలో చిన్న విషయమా?[a] నేనేమో పేదవాణ్ణి, అల్పుణ్ణి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజుతో వివాహ బంధం ఏర్పరచుకోవడం మీ దృష్టిలో అల్పమైన విషయమా?”
    reason: హִתְחַתֵּן בַּמֶּלֶךְ అనే పదబంధాన్ని సందర్భానుసారంగా ‘రాజుకు అల్లుడు కావడం’ అని చెప్పవచ్చు; మరింత విస్తృతంగా ‘రాజుతో వివాహ బంధం ఏర్పరచుకోవడం’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: చెప్పారు
  rationale: కథన సందర్భంలో דּבר అనే సాధారణ మాటలాడే క్రియను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּאָזְנֵי דָוִד
  choice: దావీదుకు వినిపించారు
  rationale: అక్షరార్థంగా ‘దావీదు చెవుల్లో’ అనే హీబ్రూ నుడికారాన్ని, అతడు వినేలా మాటలు చెప్పారనే భావంతో సహజంగా అందిస్తుంది.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలను
  rationale: ప్రస్తుత సందేశ సందర్భంలో דְּבָרִים కు నేరమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  choice: మీ దృష్టిలో చిన్న విషయమా?
  rationale: ‘మీ కళ్లలో తేలికైనదా?’ అనే మూల నుడికారంలోని మూల్యాంకన భావాన్నీ, అలంకార ప్రశ్న బలాన్నీ సహజ తెలుగులో నిలుపుతుంది.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: రాజుకు అల్లుడు కావడం
  rationale: సందర్భంలో రాజు కుమార్తెను పెళ్లి చేసుకొని అతనితో వివాహ బంధంలోకి రావడాన్ని స్పష్టంగా, అతిగా వివరించకుండా తెలియజేస్తుంది.
- source_word: וְאָנֹכִי
  choice: నేనేమో
  rationale: దావీదు తన స్థితిని రాజ కుటుంబంతో వ్యత్యాసంగా చూపుతున్న భావాన్ని సహజ తెలుగులో కాపాడుతుంది; కారణార్థాన్ని బలవంతంగా చేర్చదు.
- source_word: רָשׁ
  choice: పేదవాణ్ణి
  rationale: దావీదు ఆర్థిక, సామాజిక స్థితిని సూచించే నేరమైన ఆధునిక తెలుగు పదం.
- source_word: וְנִקְלֶה
  choice: అల్పంగా పరిగణించబడే వాణ్ణి
  rationale: ‘తేలికగా/తక్కువగా ఎంచబడిన’ అనే భావాన్ని అందిస్తూ, ‘తృణీకరించబడిన’ వంటి మరీ బలమైన అర్థాన్ని నివారిస్తుంది; ముందున్న ‘చిన్న విషయం’తో మూలంలోని קלל పదబంధ సంబంధాన్నీ కొంత నిలుపుతుంది.
