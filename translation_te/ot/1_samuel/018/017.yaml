  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד הִנֵּה֩ בִתִּ֨/י הַ/גְּדוֹלָ֤ה מֵרַב֙ אֹתָ/הּ֙ אֶתֶּן לְ/ךָ֣ לְ/אִשָּׁ֔ה אַ֚ךְ הֱיֵה לִּ֣/י לְ/בֶן חַ֔יִל וְ/הִלָּחֵ֖ם מִלְחֲמ֣וֹת יְהוָ֑ה וְ/שָׁא֣וּל אָמַ֗ר אַל תְּהִ֤י יָדִ/י֙ בּ֔/וֹ וּ/תְהִי ב֖/וֹ יַד פְּלִשְׁתִּֽים־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: te
  text: 'అప్పుడు సౌలు దావీదుతో, “ఇదిగో, నా పెద్ద కుమార్తె మేరబు; ఆమెను నీకు భార్యగా ఇస్తాను. అయితే నీవు నా కొరకు పరాక్రమశాలివై, యెహోవా యుద్ధాలు చేయాలి” అన్నాడు. సౌలు ఇలా అనుకున్నాడు: “నా చెయ్యి అతనికి వ్యతిరేకంగా ఉండకూడదు; ఫిలిష్తీయుల చెయ్యి అతనికి వ్యతిరేకంగా ఉండాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: సౌలు తన కుమార్తెను దావీదు దృష్టికి తీసుకొస్తున్న సూచనాత్మక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בִתִּי הַגְּדוֹלָה
  choice: నా పెద్ద కుమార్తె
  rationale: వయస్సులో పెద్ద కుమార్తె అనే హెబ్రీయ అర్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְבֶן־חַיִל
  choice: పరాక్రమవంతుడిగా
  rationale: యుద్ధసందర్భంలో ధైర్యం, సామర్థ్యం గల యోధుడనే భావాన్ని అందిస్తుంది; కేవలం నైతిక సద్గుణంగా పరిమితం చేయదు.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: యెహోవా యుద్ధాలు
  rationale: దైవనామాన్ని వ్యక్తినామ రూపంలో ఉంచి, యుద్ధాలు యెహోవాకు చెందినవనే నిర్మాణాన్ని కాపాడుతుంది.
- source_word: אַל־תְּהִי יָדִי בּוֹ
  choice: నా చెయ్యి అతనిమీద పడకూడదు
  rationale: హెబ్రీయ 'చెయ్యి అతనిలో/అతనికి వ్యతిరేకంగా ఉండకూడదు' అనే శత్రుత్వపూర్వక హాని భావాన్ని సహజ తెలుగు నుడికారంలో అందిస్తుంది.
theological_decisions:
- issue: యెహోవా యుద్ధాలు
  choice: దైవనామంతో ‘యెహోవా యుద్ధాలు’ అని నేరుగా అనువదించడం
  alternative: ‘ప్రభువు యుద్ధాలు’
  rationale: మూలంలో సాధారణ బిరుదు కాక దేవుని వ్యక్తినామమైన יהוה ఉంది; దానిని అస్పష్టం చేయకుండా నిలుపుతున్నాం.
- issue: సౌలు మాట వెనుక ఉద్దేశం
  choice: ‘అని అనుకున్నాడు’
  alternative: ‘అని అన్నాడు’
  rationale: రెండవ אָמַר ఇక్కడ అంతరంగ ఉద్దేశాన్ని పరిచయం చేస్తుంది; సౌలు దీన్ని బహిరంగంగా పలికాడని తప్పుగా సూచించకుండా సందర్భార్థాన్ని తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ప్రత్యక్ష సంభాషణ మరియు సౌలు అంతరంగ ఉద్దేశం మధ్య వ్యత్యాసం స్పష్టంగా ఉంచబడింది; మూలంలోని వ్యంగ్యాత్మక ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
