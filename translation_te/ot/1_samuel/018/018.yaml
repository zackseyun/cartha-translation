  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל שָׁא֗וּל מִ֤י אָֽנֹכִי֙ וּ/מִ֣י חַיַּ֔/י מִשְׁפַּ֥חַת אָבִ֖/י בְּ/יִשְׂרָאֵ֑ל כִּֽי אֶהְיֶ֥ה חָתָ֖ן לַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
translation:
  language: te
  text: దావీదు సౌలుతో, “నేను రాజుకు అల్లుడిని కావడానికి, నేనెంతటివాడిని? నా జీవితం ఏమిటి?[a] ఇశ్రాయేలులో నా తండ్రి కుటుంబం ఎంతటిది?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా బంధువులు ఎవరు?” హీబ్రూ వ్యక్తీకరణ పదశః “నా జీవితం ఏమిటి?” అని ఉంది; ఇది దావీదు అల్పస్థితిని లేదా తరువాత ప్రస్తావించిన అతని కుటుంబ నేపథ్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: దావీదు సౌలుతో ... అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: מִי אָנֹכִי
  choice: నేనెంతటివాడిని?
  rationale: పదశః ‘నేను ఎవరు?’ అయినా, సందర్భంలోని స్వల్పతాభావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּמִי חַיַּי
  choice: నా జీవితం ఏమిటి?
  rationale: కష్టమైన హీబ్రూ వ్యక్తీకరణలోని ‘నా జీవితం’ అనే రూపాన్ని నిలుపుతూ దావీదు అల్పస్థితిని సూచిస్తుంది; బంధువులు లేదా సామాజిక స్థితి అనే భావం కూడా సాధ్యమే.
- source_word: מִשְׁפַּחַת אָבִי בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో నా తండ్రి కుటుంబం ఎంతటిది?
  rationale: పితృకుటుంబం లేదా వంశపు సామాజిక ప్రాముఖ్యతను సూచించే అలంకారప్రశ్నగా సహజంగా అనువదించబడింది.
- source_word: כִּי אֶהְיֶה חָתָן לַמֶּלֶךְ
  choice: నేను రాజుకు అల్లుడిని కావడానికి!
  rationale: రాజు కుమార్తెను వివాహం చేసుకొని రాజుతో వివాహబంధంలో చేరడాన్ని ‘అల్లుడు’ స్పష్టంగా తెలియజేస్తుంది; వాక్యంలోని వినయపూర్వక ఆశ్చర్యాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి. క్లిష్టమైన హీబ్రూ పదబంధంలోని అనిశ్చితిని ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా నిలుపుకుంది.
