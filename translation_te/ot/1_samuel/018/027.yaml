base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
translation:
  language: te
  text: అప్పుడు దావీదు లేచి, తన మనుషులతో కలిసి వెళ్లి, ఫిలిష్తీయులలో రెండువందల మందిని హతమార్చాడు. దావీదు వారి ముందోళ్లను తీసుకొచ్చాడు; రాజుకు వాటిని పూర్తి సంఖ్యలో సమర్పించారు[a], దావీదు రాజుకు అల్లుడు కావడానికి. సౌలు తన కుమార్తె మీకాలును దావీదుకు భార్యగా ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజు ఎదుట వాటిని పూర్తిగా లెక్కించారు.” ఇక్కడి హీబ్రూ క్రియ క్లిష్టమైనది; అది వాటిని లెక్కించడాన్నో, లేక అవసరమైన సంఖ్యను పూర్తి చేసి రాజుకు సమర్పించడాన్నో సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: కథనంలో నిర్ణయాత్మక చర్య ప్రారంభాన్ని సూచించే קום క్రియకు సహజమైన తెలుగు రూపం.
- source_word: וַיֵּלֶךְ הוּא וַאֲנָשָׁיו
  choice: తన మనుషులతో కలిసి వెళ్లి
  rationale: హీబ్రూ వాక్యంలో దావీదు మరియు అతని మనుషులు స్పష్టంగా ప్రస్తావించబడ్డారు; తెలుగులో సహజమైన క్రమంతో అదే భావాన్ని నిలుపుతుంది.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులలో ... మందిని హతమార్చాడు
  rationale: సైనిక సందర్భంలో נכה చంపివేయడాన్ని సూచిస్తుంది; తరువాత ముందోళ్లను తీసుకురావడం కూడా ప్రాణాంతక చర్యనే నిర్ధారిస్తుంది.
- source_word: מָאתַיִם אִישׁ
  choice: రెండువందల మందిని
  rationale: సంఖ్య తరువాత ఉన్న אִישׁ వ్యక్తులను, ఈ సందర్భంలో ఫిలిష్తీయ పురుషులను, సూచిస్తుంది.
- source_word: עָרְלֹתֵיהֶם
  choice: వారి ముందోళ్లను
  rationale: మూలంలోని శరీర నిర్మాణ పదాన్ని సభ్యమైనప్పటికీ స్పష్టమైన ఆధునిక తెలుగు పదంతో నేరుగా అనువదిస్తుంది; సౌలు కోరిన వివాహ మూల్య స్వరూపాన్ని మరుగుపరచదు.
- source_word: וַיְמַלְאוּם לַמֶּלֶךְ
  choice: రాజుకు వాటిని పూర్తి సంఖ్యలో సమర్పించారు
  rationale: ఈ వ్యాకరణపరంగా క్లిష్టమైన రూపం అవసరమైన సంఖ్యను పూర్తి చేసి రాజు ఎదుట సమర్పించడాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో సందర్భానుగుణమైన అర్థాన్ని ఇచ్చి, లెక్కించడం అనే ప్రత్యామ్నాయాన్ని అధస్సూచికలో ఉంచాం.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: రాజుకు అల్లుడు అయ్యాడు
  rationale: חתן హిత్పయేల్ రూపం వివాహ సంబంధంలోకి ప్రవేశించడాన్ని సూచిస్తుంది; మీకాలుతో వివాహం అనే సందర్భంలో ‘రాజుకు అల్లుడు’ అనేది కచ్చితమైన సహజ తెలుగు.
- source_word: וַיִּתֶּן לוֹ שָׁאוּל אֶת מִיכַל בִּתּוֹ לְאִשָּׁה
  choice: సౌలు తన కుమార్తె మీకాలును దావీదుకు భార్యగా ఇచ్చాడు
  rationale: వివాహానికి ఇచ్చే హీబ్రూ ప్రయోగాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది; సర్వనామ సందిగ్ధతను నివారించేందుకు దావీదు పేరును పునరుక్తి చేశాం.
