source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֣ר אֶל שָׁא֔וּל וְ/נֶ֨פֶשׁ֙ יְה֣וֹנָתָ֔ן נִקְשְׁרָ֖ה בְּ/נֶ֣פֶשׁ דָּוִ֑ד ו/יאהבו יְהוֹנָתָ֖ן כְּ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
translation:
  language: te
  text: అప్పుడు అతడు సౌలుతో మాట్లాడడం ముగించినప్పుడు, యోనాతాను ప్రాణం దావీదు ప్రాణంతో పెనవేయబడింది[a]; యోనాతాను అతణ్ణి తన ప్రాణంలా[b] ప్రేమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దావీదు ప్రాణంతో బంధించబడింది.’
    reason: lexical_alternative
  - marker: b
    text: 'ఈ వచనంలో హీబ్రూ ‘నెఫెష్’ అనే పదం మూడుసార్లు వస్తుంది: ‘యోనాతాను ప్రాణం ... దావీదు ప్రాణం ... తన ప్రాణం.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు
  rationale: హీబ్రూ కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగు కథన ప్రవాహంలో సూచిస్తుంది; విడిగా ‘జరిగింది’ అనడం తెలుగులో అనవసర భారంగా ఉంటుంది.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר אֶל שָׁאוּל
  choice: అతడు సౌలుతో మాట్లాడడం ముగించినప్పుడు
  rationale: כְ + infinitive construct తెలిపే కాలసంబంధాన్ని సహజంగా అందిస్తుంది. אֶל‌కు మూలంగా ‘వైపు/తో’ భావం ఉన్నా, తెలుగు సంభాషణ సందర్భంలో ‘సౌలుతో మాట్లాడడం’ సహజం.
- source_word: נֶפֶשׁ
  choice: ప్రాణం
  rationale: ఈ వచనంలో మూడుసార్లు వచ్చే נֶפֶשׁ పదాన్ని ఒకే విధంగా ఉంచి, వ్యక్తి అంతరంగ జీవితం మరియు తన స్వంత జీవితం అనే భావవిస్తృతిని కాపాడుతుంది.
- source_word: נִקְשְׁרָה בְּנֶפֶשׁ דָּוִד
  choice: దావీదు ప్రాణంతో పెనవేయబడింది
  rationale: קשר యొక్క కట్టడం/బంధించడం రూపకాన్ని ‘పెనవేయబడింది’ సహజంగా, బలమైన అనుబంధ భావంతో వ్యక్తపరుస్తుంది.
- source_word: וַיֶּאֱהָבוֹ יְהוֹנָתָן
  choice: యోనాతాను అతణ్ణి ప్రేమించాడు
  rationale: క్రియలోని 3ms కర్మప్రత్యయాన్ని ‘అతణ్ణి’గా స్పష్టపరుస్తూ, אהב యొక్క సాధారణ అర్థాన్ని అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: כְּנַפְשׁוֹ
  choice: తన ప్రాణంలా
  rationale: נֶפֶשׁ పునరుక్తిని నిలుపుతూ, ‘తనను తాను ప్రేమించినట్లుగా’ అనే వివరణాత్మక విస్తరణను నివారిస్తుంది.
theological_decisions:
- issue: యోనాతాను దావీదుపట్ల చూపిన ప్రేమ స్వభావం
  choice: లోతైన వ్యక్తిగత అనుబంధాన్ని తెలిపే ‘తన ప్రాణంలా ప్రేమించాడు’ అనే భాషను ఉంచడం
  alternative: దీనిని ప్రధానంగా రాజకీయ మైత్రిగా లేదా శృంగార/లైంగిక ప్రేమగా నిర్దిష్టీకరించడం
  rationale: נפשׁ మరియు אהב బలమైన వ్యక్తిగత బంధాన్ని తెలుపుతాయి; అయితే ఈ వచనం దాని స్వభావాన్ని మరింత నిర్దిష్టంగా నిర్వచించదు. అందువల్ల అనుబంధ తీవ్రతను తగ్గించకుండా, మూలపాఠం చెప్పనిదాన్ని చేర్చకుండా అనిశ్చితిని నిలుపుతాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘పెనవేయబడింది’ మూలంలోని బంధన రూపకాన్ని సహజంగా నిలుపుతుంది; ‘ప్రాణం’ పదపునరుక్తి ఉద్దేశపూర్వకంగా కాపాడబడింది.
