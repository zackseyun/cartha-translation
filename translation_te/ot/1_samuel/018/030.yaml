  text: וַ/יֵּצְא֖וּ שָׂרֵ֣י פְלִשְׁתִּ֑ים וַ/יְהִ֣י מִ/דֵּ֣י צֵאתָ֗/ם שָׂכַ֤ל דָּוִד֙ מִ/כֹּל֙ עַבְדֵ֣י שָׁא֔וּל וַ/יִּיקַ֥ר שְׁמ֖/וֹ מְאֹֽד׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/030.yaml
  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
translation:
  language: te
  text: ఫిలిష్తీయుల సేనాధిపతులు బయలుదేరారు. వారు బయలుదేరిన ప్రతిసారీ, దావీదు సౌలు సేవకులందరికంటే ఎక్కువ వివేకంతో వ్యవహరించాడు[a]. దాంతో అతని పేరు ఎంతో గౌరవనీయమైంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు సౌలు సేవకులందరికంటే ఎక్కువగా సఫలమయ్యాడు.” హీబ్రూ క్రియ వివేకంతో వ్యవహరించడాన్నీ, దాని ఫలితంగా విజయం పొందడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతని పేరు ఎంతో విలువైనదిగా అయింది”; అంటే, అతని ప్రతిష్ఠ ఎంతో పెరిగింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల సేనాధిపతులు
  rationale: యుద్ధ సందర్భంలో שָׂרִים అనేది పాలకులు లేదా అధికారులకన్నా సైనిక నాయకులను సూచించే అవకాశం ఎక్కువ; ‘సేనాధిపతులు’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּצְאוּ / מִדֵּי צֵאתָם
  choice: బయలుదేరారు / వారు బయలుదేరిన ప్రతిసారీ
  rationale: יצא అనే క్రియలోని ‘బయటికి వెళ్లడం, బయలుదేరడం’ అనే భావాన్ని నిలుపుతూ, מִדֵּי నిర్మాణంలోని పునరావృత అర్థాన్ని ‘ప్రతిసారీ’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שָׂכַל
  choice: ఎక్కువ వివేకంతో వ్యవహరించాడు
  rationale: ఈ క్రియ వివేకంగా ప్రవర్తించడాన్నీ, దాని ఫలితంగా విజయవంతం కావడాన్నీ సూచించగలదు. ప్రధాన పాఠంలో వివేకపూర్వక ప్రవర్తనను ఉంచి, విజయమనే భావసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: מִכֹּל עַבְדֵי שָׁאוּל
  choice: సౌలు సేవకులందరికంటే
  rationale: ఇక్కడ עֲבָדִים బానిసలకే పరిమితం కాకుండా రాజసేవలో ఉన్న వారిని విస్తృతంగా సూచిస్తుంది; ‘సేవకులు’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: וַיִּיקַר שְׁמוֹ מְאֹד
  choice: అతని పేరు ఎంతో గౌరవం పొందింది
  rationale: హీబ్రూ వాక్యంలోని ‘పేరు’ అనే రూపకాన్ని నిలుపుతూ, יקר లోని విలువైనదిగా లేదా గౌరవనీయంగా కావడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
