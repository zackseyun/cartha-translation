  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ పునరావృత నిర్మాణాన్ని ‘ప్రతిసారీ’తో స్పష్టంగా చూపించాం; ‘పేరు’ అనే మూలభాషా రూపకాన్ని ప్రధాన పాఠంలో నిలిపాం.
