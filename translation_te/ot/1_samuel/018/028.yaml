id: 1SA.18.28
reference: 1 Samuel 18:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤רְא שָׁאוּל֙ וַ/יֵּ֔דַע כִּ֥י יְהוָ֖ה עִם דָּוִ֑ד וּ/מִיכַ֥ל בַּת שָׁא֖וּל אֲהֵבַֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/028.yaml
  text: Saul saw and knew that Yahweh was with David[a], and that Michal the daughter of Saul loved him.
translation:
  language: te
  text: సౌలు యాహ్వే దావీదుతో ఉన్నాడని, సౌలు కుమార్తె మీకాలు దావీదును ప్రేమిస్తోందని చూశాడు మరియు తెలుసుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה అనే సాధారణ క్రియకు ‘చూశాడు’ సమీపమైన అర్థం. తరువాత వచ్చే ‘తెలుసుకున్నాడు’తో కలిపి, గమనించడం నుండి నిశ్చయంగా గ్రహించడం వరకు ఉన్న హీబ్రూ క్రమాన్ని నిలుపుతుంది.
- source_word: וַיֵּדַע
  choice: తెలుసుకున్నాడు
  rationale: ידע ఇక్కడ సౌలు తాను చూసిన దాని ఆధారంగా నిశ్చయంగా గ్రహించడాన్ని సూచిస్తుంది. ‘తెలుసుకున్నాడు’ మూలపదపు సాధారణ బలాన్ని కాపాడుతుంది.
- source_word: כִּי
  choice: అనీ
  rationale: ఇక్కడ כִּי సౌలు తెలుసుకున్న విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో పరోక్ష వాక్యానికి ‘అనీ’ సహజమైన రూపం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని లిప్యంతరీకరణగా ‘యాహ్వే’ వాడబడింది.
- source_word: עִם דָּוִד
  choice: దావీదుతో ఉన్నాడు
  rationale: עִם వ్యక్తితో కూడిన సన్నిధి లేదా సహవాసాన్ని సూచిస్తుంది. ‘దావీదుతో ఉన్నాడు’ దైవసన్నిధి, అనుగ్రహం అనే భావాలను అతిగా వివరించకుండా కాపాడుతుంది.
- source_word: וּמִיכַל בַּת שָׁאוּל
  choice: సౌలు కుమార్తె మీకాలు
  rationale: తెలుగులో సహజమైన సంబంధపద క్రమాన్ని అనుసరిస్తూనే, మీకాలు సౌలు కుమార్తె అనే మూలంలోని గుర్తింపును స్పష్టంగా ఉంచుతుంది.
- source_word: אֲהֵבַתְהוּ
  choice: దావీదును ప్రేమించింది
  rationale: స్త్రీలింగ కర్తను సూచించే రూపం మరియు పురుష ఏకవచన కర్మప్రత్యయాన్ని బట్టి ‘ప్రేమించింది’ సరైనది. తెలుగులో ‘అతనిని’ అనేది సౌలునికీ దావీదుకీ వ్యాకరణపరంగా వర్తించగలదు కాబట్టి, ఉద్దేశిత పూర్వపదమైన దావీదును పేరుతో స్పష్టం చేయబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణను ప్రతిబింబించే ‘యాహ్వే’ అనే తెలుగు లిప్యంతరీకరణను వాడటం మూలానికి దగ్గరగా ఉంటుంది.
- issue: మీకాలు ప్రేమించిన సంగతి సౌలు తెలుసుకున్న విషయానికి చెందుతుందా, లేక స్వతంత్ర వాక్యమా
  choice: సౌలు తెలుసుకున్న రెండవ విషయంగా ప్రధాన పాఠ్యంలో చూపడం
  alternative: ‘మరియు సౌలు కుమార్తె మీకాలు దావీదును ప్రేమించింది’ అనే స్వతంత్ర సమన్వయ వాక్యం
  rationale: రెండవ ఉపవాక్యానికి ప్రత్యేక כִּי లేకపోయినా, సందర్భం దానిని సౌలు తెలుసుకున్న రెండవ విషయంగా చదవడానికి అనుకూలిస్తుంది. అయితే హీబ్రూ నిర్మాణం స్వతంత్ర సమన్వయ వాక్యంగా కూడా చదవవచ్చు; అందుకే ఆ అవకాశాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘చూశాడు, తెలుసుకున్నాడు’ అనే జంట తెలుగు శైలిలో కొంత సూత్రీకృతంగా ఉన్నప్పటికీ, మూలంలోని పరిశీలన-గ్రహింపు క్రమాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
