translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హెబ్రీ జాతీయమైన ‘దావీదు కళ్లలో’ అనే భావాన్ని ‘దావీదు దృష్టికి’గా చదవడానికి సులభంగా ఉంచి, దాని అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం. వివాహ బంధం మరియు నిర్ణీత గడువు గురించిన సందర్భార్థాలను పాదటిప్పణుల్లో స్పష్టం చేశాం.
