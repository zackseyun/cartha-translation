source:
  edition: WLC
  text: וַ/יַּגִּ֨דוּ עֲבָדָ֤י/ו לְ/דָוִד֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יִּשַׁ֤ר הַ/דָּבָר֙ בְּ/עֵינֵ֣י דָוִ֔ד לְ/הִתְחַתֵּ֖ן בַּ/מֶּ֑לֶךְ וְ/לֹ֥א מָלְא֖וּ הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/026.yaml
  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
translation:
  language: te
  text: అతని సేవకులు ఈ మాటలను దావీదుకు తెలియజేశారు. రాజుకు అల్లుడు కావడం దావీదు దృష్టికి మంచిదిగా తోచింది[a][b]. నిర్ణయించిన గడువు ఇంకా ముగియలేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ విషయం దావీదుకు నచ్చింది.” హెబ్రీలో అక్షరార్థంగా, “ఆ విషయం దావీదు కళ్లలో సరైనదిగా ఉంది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రాజు కుటుంబంతో వివాహ బంధం ఏర్పరచుకోవడం.” హెబ్రీ వ్యక్తీకరణ వివాహం ద్వారా రాజుతో బంధుత్వంలోకి రావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అంటే, నిర్ణయించిన గడువు ఇంకా ముగియలేదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: తెలియజేశారు
  rationale: נגד క్రియ యొక్క హిఫీల్ రూపం ఇక్కడ ‘తెలియజేయడం, చెప్పడం’ అనే అర్థాన్ని ఇస్తుంది. రాజసభ సందర్భంలో ‘తెలియజేశారు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: సందర్భంలో వీరు సౌలు సేవకులు. మూలంలోని సర్వనామ సంబంధాన్ని నిలుపుతూ ‘అతని సేవకులు’ అని అనువదించబడింది.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలను
  rationale: דברים అనేది ‘మాటలు’ లేదా ‘విషయాలు’ అని అర్థమివ్వగలదు; ఇక్కడ సౌలు ప్రతిపాదనను మౌఖికంగా దావీదుకు చేరవేస్తున్నందున ‘ఈ మాటలను’ సరిపోతుంది.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  choice: దావీదు దృష్టికి మంచిదిగా తోచింది
  rationale: ‘అతని కళ్లలో సరైనదిగా ఉండడం’ అనే హెబ్రీ జాతీయాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, అది దావీదు అంచనా లేదా సమ్మతిని సూచిస్తుందనే భావాన్ని నిలుపుతుంది.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: రాజుకు అల్లుడు కావడం
  rationale: חתן యొక్క హిత్పయేల్ రూపం వివాహ బంధంలోకి ప్రవేశించడాన్ని సూచిస్తుంది. ఈ కథనంలో దావీదు రాజైన సౌలుకు అల్లుడు కావడమే నిర్దిష్ట భావం.
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  choice: ఇంకా ఆ రోజులు పూర్తి కాలేదు
  rationale: మూలంలోని ‘రోజులు పూర్తికావడం’ అనే కాలసంబంధ జాతీయాన్ని దగ్గరగా నిలుపుతూ, గడువు ఇంకా ముగియలేదనే సందర్భార్థాన్ని తెలియజేస్తుంది.
