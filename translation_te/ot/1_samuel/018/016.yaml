source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֙ וִ/יהוּדָ֔ה אֹהֵ֖ב אֶת דָּוִ֑ד כִּֽי ה֛וּא יוֹצֵ֥א וָ/בָ֖א לִ/פְנֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/016.yaml
  text: But all Israel and Judah loved David[a], because he went out and came in before them.
translation:
  language: te
  text: అయితే ఇశ్రాయేలు, యూదా ప్రజలందరూ దావీదును ప్రేమించారు[a], ఎందుకంటే అతడు వారి ముందు బయలుదేరి వచ్చేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని బయటికి నడిపించి, లోపలికి తీసుకువచ్చేవాడు”; అంటే, ముఖ్యంగా యుద్ధంలో వారి బహిరంగ నాయకునిగా వ్యవహరించేవాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: అయితే ... అందరూ
  rationale: ముందటి సందర్భంలో సౌలు భయానికి, విరోధానికి ప్రజల ప్రేమను వ్యతిరేకంగా చూపే సంధి భావాన్ని ‘అయితే’ సహజంగా వ్యక్తం చేస్తుంది; כָל యొక్క సమగ్ర భావాన్ని ‘అందరూ’ నిలుపుతుంది.
- source_word: יִשְׂרָאֵל וִ/יהוּדָה
  choice: ఇశ్రాయేలీయులందరూ, యూదావారందరూ
  rationale: ఇశ్రాయేలు మరియు యూదా అనే రెండు సామాజిక-రాజకీయ సమూహాల భేదాన్ని నిలుపుతూ, తెలుగులో ప్రజలను సూచించడం స్పష్టంగా ఉండేందుకు జనవాచక రూపాలు వాడబడ్డాయి.
- source_word: אֹהֵב
  choice: ప్రేమించారు
  rationale: సంయుక్త సమూహ కర్తకు సంబంధించిన కొనసాగుతున్న సాధారణ వైఖరిని ఆధునిక తెలుగు కథనంలో సహజమైన భూతకాల క్రియ వ్యక్తం చేస్తుంది.
- source_word: אֶת דָּוִד
  choice: దావీదును
  rationale: אֶת అనువదించబడదు; ప్రత్యక్ష కర్మను తెలుగు విభక్తితో సూచించి వ్యక్తినామాన్ని ‘దావీదు’గా లిప్యంతరీకరించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ప్రజలు దావీదును ప్రేమించడానికి కారణాన్ని స్పష్టంగా తెలియజేసే కారణార్థక ప్రయోగం.
- source_word: הוּא
  choice: అతడు
  rationale: మూలంలోని స్పష్టమైన స్వతంత్ర సర్వనామాన్ని నిలుపుతుంది.
- source_word: יוֹצֵא וָ/בָא
  choice: బయలుదేరుతూ, తిరిగి వస్తూ ఉండేవాడు
  rationale: పదబంధంలోని పునరావృత/కొనసాగుతున్న కార్యాన్ని సహజమైన తెలుగులో అందిస్తుంది. ఇది ప్రజలను నడిపించడాన్ని సూచించగల సైనిక-ప్రజా నాయకత్వ నుడికారమైనా, మూలంలో ‘వారిని’ అనే స్పష్టమైన కర్మ లేదు; అందువల్ల దాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: לִ/פְנֵי/הֶם
  choice: వారికి ముందుగా
  rationale: అక్షరార్థమైన ‘వారి ముందు’ భావాన్ని నిలుపుతూ, దృశ్యమైన ప్రజా నాయకత్వాన్ని సూచించే అవకాశాన్ని కూడా తెరిచి ఉంచుతుంది.
