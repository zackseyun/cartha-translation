translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వారికి ముందుగా బయలుదేరుతూ, తిరిగి వస్తూ’ అనే రూపం హీబ్రూ నుడికారాన్ని పూర్తిగా వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది; ప్రత్యామ్నాయ నాయకత్వార్థం పాదసూచికలో ఇవ్వబడింది.
