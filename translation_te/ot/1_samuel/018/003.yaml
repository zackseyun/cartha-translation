source:
  edition: WLC
  text: וַ/יִּכְרֹ֧ת יְהוֹנָתָ֛ן וְ/דָוִ֖ד בְּרִ֑ית בְּ/אַהֲבָת֥/וֹ אֹת֖/וֹ כְּ/נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/003.yaml
  text: Then Jonathan made a covenant with David[b][a], because he loved him as his own soul.
translation:
  language: te
  text: యోనాతాను దావీదుతో ఒక నిబంధన చేసుకున్నాడు[a], ఎందుకంటే అతడు దావీదును తన ప్రాణంలా ప్రేమించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిబంధనను కోశాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతనిపట్ల అతనికున్న ప్రేమలో.” హీబ్రూలోని సర్వనామాలు రూపపరంగా అస్పష్టంగా ఉన్నాయి. అయితే సందర్భం ప్రకారం యోనాతాను దావీదును తన ప్రాణంలా ప్రేమించాడనే అర్థమే బలంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: చేసుకున్నాడు
  rationale: כרת ברית అనే హీబ్రూ నుడికారానికి అక్షరార్థం ‘నిబంధనను కోశాడు’; ఆధునిక తెలుగులో ‘నిబంధన చేసుకున్నాడు’ సహజంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: וְדָוִד
  choice: దావీదుతో
  rationale: ఏకవచన క్రియకు యోనాతానే కర్త. దావీదు నిబంధనలో రెండవ పక్షమని సహజ తెలుగులో స్పష్టంగా తెలిపేందుకు ‘దావీదుతో’ అని అనువదించాం.
- source_word: בְּרִית
  choice: నిబంధన
  rationale: ఇది గంభీరమైన, బంధకమైన పరస్పర ఒడంబడికను సూచిస్తుంది; ‘నిబంధన’ దాని సంబంధాత్మక, గంభీర స్వభావాన్ని నిలుపుతుంది.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: ఎందుకంటే అతడు దావీదును ... ప్రేమించాడు
  rationale: בְּ ఉపసర్గను సందర్భానుసారం కారణార్థకంగా తీసుకున్నాం. అస్పష్టమైన సర్వనామ క్రమాన్ని తెలుగులో అర్థవంతం చేయడానికి కర్మగా దావీదు పేరును పేర్కొన్నాం.
- source_word: כְּנַפְשׁוֹ
  choice: తన ప్రాణంలా
  rationale: נֶפֶשׁ ఇక్కడ ‘ప్రాణం/స్వయం/జీవితం’ అనే భావ పరిధి కలిగి ఉంది. ‘తన ప్రాణంలా’ హీబ్రూ రూపకాన్ని కాపాడుతూ ఆధునిక తెలుగులో గాఢమైన వ్యక్తిగత ప్రేమను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘అతడు అతణ్ణి తన ప్రాణంలా ప్రేమించాడు’ అనే వాక్యంలోని మూడవ పురుష సర్వనామాల నిర్దేశ్యం
  choice: యోనాతాను దావీదును తన ప్రాణంలా ప్రేమించాడు
  alternative: దావీదు యోనాతానును తన ప్రాణంలా ప్రేమించాడు; లేదా సర్వనామాలను అస్పష్టంగానే ఉంచడం
  rationale: హీబ్రూ సర్వనామాలు విడిగా చూస్తే రూపపరంగా అస్పష్టంగా ఉన్నా, 18:1, 3 సందర్భం యోనాతాను ప్రేమకు కర్తగా, దావీదు కర్మగా ఉన్నాడని బలంగా సూచిస్తుంది. అయినా మూలంలోని రూపపరమైన అస్పష్టతను పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. ‘నిబంధన’, ‘తన ప్రాణంలా’ అనే పదబంధాలు మూలంలోని గంభీరతను, రూపకాన్ని నిలుపుతాయి.
