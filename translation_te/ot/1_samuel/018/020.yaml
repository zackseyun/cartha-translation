  text: וַ/תֶּאֱהַ֛ב מִיכַ֥ל בַּת שָׁא֖וּל אֶת דָּוִ֑ד וַ/יַּגִּ֣דוּ לְ/שָׁא֔וּל וַ/יִּשַׁ֥ר הַ/דָּבָ֖ר בְּ/עֵינָֽי/ו־־׃
