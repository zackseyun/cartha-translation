  yaml_path: translation/ot/1_samuel/018/020.yaml
  text: Michal[a], Saul's daughter, loved David, and they told Saul, and the matter pleased him.
translation:
  language: te
  text: సౌలు కుమార్తె మీకాలు దావీదును ప్రేమించింది. వారు ఆ సంగతి సౌలుకు తెలియజేశారు; అది సౌలుకు నచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆ విషయం అతని దృష్టిలో సరైనదిగా/ఇంపైనదిగా ఉంది.”
    reason: హీబ్రూ నుడికారంలోని ‘సరైనది’ మరియు ‘ఇంపైనది’ అనే భావ పరిధిని చూపించడానికి.
lexical_decisions:
- source_word: וַתֶּאֱהַב
  choice: ప్రేమించింది
  rationale: אהב అనే క్రియ ప్రేమను నేరుగా సూచిస్తుంది. ‘ప్రేమలో పడింది’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని ఆరంభ భావం చేరుతుంది.
- source_word: מִיכַל
  choice: మీకాలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: בַּת שָׁאוּל
  choice: సౌలు కుమార్తె
  rationale: హీబ్రూ సమాస సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో చూపిస్తుంది.
- source_word: אֶת דָּוִד
  choice: దావీదును
  rationale: אֶת అనే ప్రత్యక్ష కర్మ సూచికకు విడిగా పదం అవసరం లేదు; తెలుగు కర్మ విభక్తి ‘ను’ ద్వారా దాని వ్యాకరణ పాత్ర వ్యక్తమవుతుంది.
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: వారు ఆ సంగతి సౌలుకు తెలియజేశారు
  rationale: נגד హిఫిల్ రూపం ‘తెలియజేయు/చెప్పు’ అనే భావం ఇస్తుంది. హీబ్రూలో కర్త నిర్దిష్టంగా చెప్పని బహువచనం కాబట్టి ‘వారు’ అని ఉంచాం; సందర్భాన్ని స్పష్టం చేయడానికి కర్మగా ‘ఆ సంగతి’ వాడాం.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינָיו
  choice: అది అతనికి నచ్చింది
  rationale: ‘అతని కళ్లలో సరైనది/ఇంపైనది అయింది’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది. ‘నచ్చింది’ అనేది సందర్భంలోని అనుకూల మూల్యాంకనాన్ని వ్యక్తం చేస్తుంది; అక్షరార్థ నుడికారాన్ని పాదసూచికలో ఉంచాం.
