reference: 1 Samuel 18:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/ם בְּ/שׁ֤וּב דָּוִד֙ מֵ/הַכּ֣וֹת אֶת הַ/פְּלִשְׁתִּ֔י וַ/תֵּצֶ֨אנָה הַ/נָּשִׁ֜ים מִ/כָּל עָרֵ֤י יִשְׂרָאֵל֙ ל/שור וְ/הַ/מְּחֹל֔וֹת לִ/קְרַ֖את שָׁא֣וּל הַ/מֶּ֑לֶךְ בְּ/תֻפִּ֥ים בְּ/שִׂמְחָ֖ה וּ/בְ/שָׁלִשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
translation:
  language: te
  text: వారు వస్తుండగా, దావీదు ఆ ఫిలిష్తీయుణ్ణి కొట్టి తిరిగి వస్తున్నప్పుడు, ఇశ్రాయేలు పట్టణాలన్నిటి నుండి స్త్రీలు పాటలు పాడుతూ, నృత్యాలు చేస్తూ, సౌలు రాజును కలుసుకోవడానికి కంజీరాలతో, సంతోషంతో, మూడు తీగల వాద్యాలతో[a] బయటకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడున్న హీబ్రూ పదం అర్థం అనిశ్చితం. ఇది మూడు తీగల వాద్యాలను, వీణలాంటి వాద్యాలను, లేదా మరొక రకమైన సంగీత సహవాద్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేక పదంగా అనువదించకుండా కాలవాక్య నిర్మాణంలో వ్యక్తీకరించబడింది
  rationale: హీబ్రూ కథనంలో కొత్త దృశ్యాన్ని పరిచయం చేసే వాక్యసూత్రం. తెలుగులో ‘అప్పుడు ఇలా జరిగింది’ అని చేర్చడం భారంగా ఉండేందున తదుపరి కాలవాక్యంతో సహజంగా వ్యక్తీకరించబడింది.
- source_word: בְּבוֹאָם
  choice: వారు వస్తున్నప్పుడు
  rationale: ב ఉపసర్గతో కూడిన క్రియానామ రూపం, మూడవ పురుష బహువచన ప్రత్యయం కలిగి ‘వారు వస్తున్నప్పుడు’ అనే కాలార్థాన్ని ఇస్తుంది. ఈ వచనంలో వారి నిర్దిష్ట గుర్తింపు చెప్పబడనందున అస్పష్టతను అలాగే ఉంచాం.
- source_word: בְּשׁוּב דָּוִד מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי
  choice: దావీదు ఆ ఫిలిష్తీయుణ్ణి హతమార్చి తిరిగి వస్తుండగా
  rationale: שובకు ‘తిరిగి రావడం’, נכהకు ఈ సందర్భంలో ‘కొట్టి చంపడం/హతమార్చడం’ అనే భావాలు ఉన్నాయి. ఏకవచన ‘ఆ ఫిలిష్తీయుడు’ ముందుగా పేర్కొన్న యోధుణ్ణి సూచిస్తుంది.
- source_word: וַתֵּצֶאנָה הַנָּשִׁים מִכָּל עָרֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పట్టణాలన్నిటి నుండి స్త్రీలు ... బయలుదేరి వచ్చారు
  rationale: יצא అంటే బయటకు రావడం. పట్టణాల నుండి రాజును కలుసుకోవడానికి వచ్చిన కదలికను సహజ తెలుగులో ‘బయలుదేరి వచ్చారు’గా ఇచ్చాం.
- source_word: לָשׁוּר וְהַמְּחֹלוֹת
  choice: పాటలు పాడుతూ, నాట్యం చేస్తూ
  rationale: మొదటిది పాడడాన్ని, రెండవది నాట్యాలను సూచిస్తుంది. తెలుగులో సహజమైన సమాంతర క్రియారూపాలు వాడాం.
- source_word: לִקְרַאת שָׁאוּל הַמֶּלֶךְ
  choice: సౌలు రాజును ఎదుర్కోవడానికి
  rationale: לקראת అనేది ఒకరిని కలుసుకోవడానికి ఎదురుగా వెళ్లడాన్ని సూచిస్తుంది. ‘ఎదుర్కోవడం’ ఇక్కడ శత్రుత్వార్థంలో కాక స్వాగతించడానికి ఎదురుగా వెళ్లే అర్థంలో ఉంది.
- source_word: בְּתֻפִּים
  choice: కంజీరాలు మోగిస్తూ
  rationale: תֹּף చేతితో మోగించే చట్రపు డప్పు/టాంబురీన్ వంటి వాద్యం. ఆధునిక తెలుగు పాఠకులకు సులభంగా అర్థమయ్యే ‘కంజీరాలు’ ఎంచుకున్నాం.
- source_word: בְּשִׂמְחָה
  choice: ఆనందిస్తూ
  rationale: మూలంలోని నామవాచకం ఆనందం లేదా ఉల్లాసాన్ని సూచిస్తుంది; తెలుగు ప్రవాహం కోసం క్రియావిశేషణాత్మక రూపంలో ఇచ్చాం.
- source_word: וּבְשָׁלִשִׁים
  choice: తంతివాద్యాలు[a] వాయిస్తూ
  rationale: ఈ అరుదైన హీబ్రూ పదం అర్థం అనిశ్చితం. సంగీత సందర్భాన్ని స్పష్టంగా ఉంచుతూ, మూడు తీగల వాద్యమని నిర్ధారించకుండా సాధారణ పదాన్ని ప్రధాన పాఠ్యంలో వాడి వివరాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని వాడాం. మూలంలోని ‘వారు’ అనే అస్పష్ట బహువచనాన్ని నిలిపి ఉంచాం; అరుదైన వాద్యపదంలోని అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
