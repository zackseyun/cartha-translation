id: 1SA.18.12
reference: 1 Samuel 18:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּרָ֥א שָׁא֖וּל מִ/לִּ/פְנֵ֣י דָוִ֑ד כִּֽי הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ וּ/מֵ/עִ֥ם שָׁא֖וּל סָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
translation:
  language: te
  text: యాహ్వే దావీదుతో ఉన్నాడు, సౌలును విడిచిపోయాడు కాబట్టి సౌలు దావీదంటే భయపడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సౌలు దావీదుకు భయపడ్డాడు.” హీబ్రూలో అక్షరార్థంగా, “సౌలు దావీదు సమక్షం నుండి భయపడ్డాడు” అని ఉంది. ఇది దావీదే సౌలు భయానికి కారణం లేదా లక్ష్యమని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: భయపడ్డాడు
  rationale: ירא ఇక్కడ భయపడడం అనే భావాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘భయపడ్డాడు’ సహజంగా ఉండి కథనంలోని భావోద్వేగ తీవ్రతను నిలుపుతుంది.
- source_word: מִלִּפְנֵי
  choice: దావీదుకు
  rationale: అక్షరార్థంగా ‘దావీదు సమక్షం నుండి’ అయినా, יראతో వ్యక్తిని సూచించినప్పుడు ఆ వ్యక్తే భయానికి కారణం లేదా లక్ష్యం అనే నుడికార భావం వస్తుంది. తెలుగులో ‘దావీదుకు భయపడ్డాడు’ సహజమైన వ్యక్తీకరణ.
- source_word: כִּי
  choice: అనీ ... అనీ
  rationale: ఇక్కడ כִּי సౌలు భయపడడానికి కారణాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్య నిర్మాణంలో కారణమైన రెండు విషయాలను ఉటంకించి, ప్రధాన క్రియతో కలపడానికి ‘అనీ ... అనీ’ సహజంగా పనిచేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: עִמּוֹ
  choice: దావీదుతో
  rationale: సర్వనామం సందర్భానుసారం దావీదును సూచిస్తుంది. తెలుగులో అస్పష్టత కలగకుండా సూచిత నామాన్ని స్పష్టంగా వాడడం సహజం.
- source_word: וּמֵעִם שָׁאוּל סָר
  choice: సౌలును విడిచిపోయాడనీ
  rationale: סור అంటే తొలగిపోవడం, విడిచిపోవడం, దూరమవడం. ‘విడిచిపోయాడు’ యెహోవా సౌలుతో ఇక లేడనే వాక్య భావాన్ని నిలుపుతుంది; ఆ విడిచిపోవడాన్ని ఆత్మకు లేదా అనుగ్రహానికి మాత్రమే పరిమితం చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామరూపంలో నిలిపాం.
- issue: యెహోవా సౌలును విడిచిపోవడం అనే వాక్య భావం
  choice: సౌలును విడిచిపోయాడు
  alternative: యెహోవా ఆత్మ సౌలును విడిచిపోయింది / యెహోవా అనుగ్రహం సౌలును విడిచిపోయింది
  rationale: ఈ వచనం యెహోవా సౌలును విడిచిపోయాడని మాత్రమే చెబుతుంది. సమీప సందర్భంలోని ‘యెహోవా ఆత్మ’ అనే విస్తృత రూపాన్నిగానీ, ‘అనుగ్రహం’ అనే వివరణనుగానీ ఇక్కడ చేర్చకుండా మూలంలోని దైవశాస్త్ర సంబంధమైన ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. కారణాన్ని ముందుంచి ప్రధాన వాక్యాన్ని చివర ఉంచడం తెలుగు వాక్య ప్రవాహానికి అనుగుణం. ‘దావీదుకు భయపడ్డాడు’ ప్రధాన పాఠంలో సహజమైన నుడికారం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
