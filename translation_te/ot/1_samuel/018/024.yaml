  text: Saul’s servants told him[a], saying, “David spoke words like these.”
translation:
  language: te
  text: సౌలు సేవకులు అతనికి, “దావీదు ఈ మాటల వలె మాట్లాడాడు[a]” అని తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ఈ మాటల ప్రకారం దావీదు మాట్లాడాడు.”
    reason: כַּדְּבָרִים הָאֵלֶּה అనే పదబంధం ‘ఈ మాటల ప్రకారం’ అని అక్షరార్థంగా ఉన్నప్పటికీ, సందర్భంలో ‘ఈ మాటల వలె/ఇలాంటి మాటలు’ అనే నివేదిక భావాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: తెలియజేశారు
  rationale: נגד హిఫీల్ రూపం ‘తెలియజేయడం/నివేదించడం’ అనే భావాన్ని ఇస్తుంది; రాజసభ సందర్భంలో ‘తెలియజేశారు’ సహజంగానూ గౌరవప్రదంగానూ ఉంది.
- source_word: עַבְדֵי שָׁאוּל
  choice: సౌలు సేవకులు
  rationale: עבד అనే పదానికి సేవకులు, పరిచారకులు లేదా అధికారులు అనే అర్థాలు ఉండవచ్చు. హోదాను అనవసరంగా నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని ‘సేవకులు’ నిలుపుతుంది.
- source_word: לוֹ
  choice: అతనితో
  rationale: ఈ సర్వనామం సౌలును సూచిస్తుంది. ‘అతనితో ... అని తెలియజేశారు’ అనేది తెలుగులో సహజమైన నివేదనా నిర్మాణం.
- source_word: לֵאמֹר
  choice: అని
  rationale: నివేదించిన విషయాన్ని పరిచయం చేసే హెబ్రీయ క్రియావిశేష రూపాన్ని తెలుగులో సహజమైన ఉద్ధరణ సూచిక ‘అని’తో వ్యక్తం చేశాం.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటల ప్రకారమే
  rationale: כְּ ఉపసర్గలోని ‘ప్రకారం/వలె’ అనే భావాన్ని తొలగించకుండా, దావీదు చెప్పిన మాటల సారూప్యమైన నివేదికను సూచిస్తుంది.
- source_word: דִּבֶּר
  choice: మాట్లాడాడు
  rationale: דבר కు ‘మాట్లాడు’ సమీపమైన తెలుగు సమానం; אמר తో ఉండే పదభేదాన్ని సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: דָּוִד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
