  rationale: The revision replaces the emphatic “ప్రకారమే” with comparative “వలె,” preserving the Hebrew phrase’s contextual sense without making David’s speech sound like exact repetition or formal compliance. It also uses the more idiomatic indirect-recipient form “అతనికి.” The footnote remains anchored and explains the literal wording and its contextual force.
