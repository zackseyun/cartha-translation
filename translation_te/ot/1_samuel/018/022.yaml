source:
  edition: WLC
  text: וַ/יְצַ֨ו שָׁא֜וּל אֶת עֲבָדָ֗/ו דַּבְּר֨וּ אֶל דָּוִ֤ד בַּ/לָּט֙ לֵ/אמֹ֔ר הִנֵּ֨ה חָפֵ֤ץ בְּ/ךָ֙ הַ/מֶּ֔לֶךְ וְ/כָל עֲבָדָ֖י/ו אֲהֵב֑וּ/ךָ וְ/עַתָּ֖ה הִתְחַתֵּ֥ן בַּ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
translation:
  language: te
  text: 'అప్పుడు సౌలు తన సేవకులకు ఆజ్ఞాపించాడు: “దావీదుతో రహస్యంగా[a] ఇలా మాట్లాడండి: ‘ఇదిగో, రాజు నీ పట్ల సంతోషంగా ఉన్నాడు; రాజు సేవకులందరూ నిన్ను ప్రేమిస్తున్నారు. కాబట్టి ఇప్పుడు రాజుకు అల్లుడవు[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏకాంతంగా”; “మెల్లగా” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రాజుతో వివాహ బంధుత్వంలోకి రా” లేదా “రాజుతో వివాహం ద్వారా బంధుత్వం ఏర్పరచుకో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה క్రియలోని అధికారపూర్వక ఆదేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: עֲבָדוֹ
  choice: తన సేవకులకు
  rationale: రాజసభ సందర్భంలో עבד అంటే సేవకులు, పరిచారకులు లేదా అధికారులు కావచ్చు; హోదాను అతిగా నిర్దిష్టం చేయకుండా ‘సేవకులు’ మూలపదానికి దగ్గరగా ఉంటుంది.
- source_word: דַּבְּרוּ
  choice: మాట్లాడండి
  rationale: దావీదుతో మాటలాడి సందేశాన్ని తెలియజేయాలనే బహువచన ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּלָּט
  choice: రహస్యంగా
  rationale: בלט లోని గోప్యత లేదా ఇతరులకు తెలియకుండా మాట్లాడే భావాన్ని కాపాడుతుంది; సందర్భానుసారంగా ‘ఏకాంతంగా’ లేదా ‘మెల్లగా’ అనే అర్థాలూ సాధ్యమే.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని తరువాతి మాటపై నిలిపే హీబ్రూ సంభాషణ సూచకానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: חָפֵץ בְּךָ
  choice: నీ పట్ల సంతోషంగా ఉన్నాడు
  rationale: חפץ בְ అంటే ఒకరిలో ఆనందించడం లేదా వారి పట్ల ప్రసన్నత కలిగి ఉండడం. తెలుగులో అనవసరమైన శృంగార భావం రాకుండా రాజు అనుగ్రహం, సంతృప్తి భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట రాజైన సౌలును అతని రాజపదవితో సూచిస్తుంది.
- source_word: אֲהֵבוּךָ
  choice: నిన్ను ప్రేమిస్తున్నారు
  rationale: אהב యొక్క ప్రాథమిక అర్థమైన ‘ప్రేమించు’ను నిలుపుతుంది; ఇక్కడ అది అభిమానం లేదా ఆదరణను కూడా సూచించవచ్చు.
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందు చెప్పిన రాజు ప్రసన్నత, సేవకుల ప్రేమ ఆధారంగా తరువాతి ప్రోత్సాహానికి మారే తార్కిక ప్రవాహాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: రాజుతో వివాహ బంధం ఏర్పరచుకో
  rationale: హిత్పయేల్ రూపం వివాహం ద్వారా బంధుత్వంలోకి ప్రవేశించడాన్ని సూచిస్తుంది. ‘రాజుకు అల్లుడవు’ అనేది సందర్భంలోని ఉద్దేశాన్ని మరింత స్పష్టంగా చెప్పినా, మూలంలోని విస్తృతమైన వివాహ-బంధ భావాన్ని ఈ రూపం కాపాడుతుంది.
