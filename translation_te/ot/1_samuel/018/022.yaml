  naturalness: The Telugu is generally fluent and suitably modern. Replacing the broad marriage-bond expression with the idiomatic “రాజుకు అల్లుడవు” makes the final exhortation unambiguous and natural.
  terminology: “ఆజ్ఞాపించాడు,” “రహస్యంగా,” “ఇదిగో,” and “ప్రేమిస్తున్నారు” are appropriate. “రాజు సేవకులందరూ” is slightly clearer than “ఆయన సేవకులందరూ” within the reported speech.
