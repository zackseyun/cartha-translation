  terminology: “దేవుని నుండి వచ్చిన దుష్టాత్మ” adequately represents the difficult phrase רוּחַ אֱלֹהִים רָעָה without resolving its theological tension. “ప్రవచనావేశంతో ప్రవర్తించాడు” appropriately preserves the prophetic/ecstatic ambiguity rather than asserting either genuine prophecy or mere madness.
