source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/תִּצְלַ֣ח רוּחַ֩ אֱלֹהִ֨ים רָעָ֤ה אֶל שָׁאוּל֙ וַ/יִּתְנַבֵּ֣א בְ/תוֹךְ הַ/בַּ֔יִת וְ/דָוִ֛ד מְנַגֵּ֥ן בְּ/יָד֖/וֹ כְּ/י֣וֹם בְּ/י֑וֹם וְ/הַ/חֲנִ֖ית בְּ/יַד שָׁאֽוּל׀׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
translation:
  language: te
  text: మరుసటి రోజు దేవుని నుండి వచ్చిన దుష్టాత్మ సౌలుమీదికి బలంగా దూసుకొచ్చింది[a]. అప్పుడు సౌలు ఇంట్లో ప్రవచనావేశంతో ప్రవర్తించాడు[b]; దావీదు మాత్రం తాను రోజూ చేసినట్టే తన చేతితో వాయిస్తూ ఉన్నాడు[c]. సౌలు చేతిలో ఈటె ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని నుండి వచ్చిన హానికరమైన ఆత్మ.” హీబ్రూలో అక్షరార్థంగా, “దేవుని దుష్ట ఆత్మ.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రవచించాడు,” లేదా “ప్రవచనావేశంలో ఉన్నాడు.” ఈ క్రియ ప్రవచనాన్ని లేదా ఆవేశపూరితమైన అసాధారణ ప్రవర్తనను సూచించగలదు.
    reason: alternative_reading
  - marker: c
    text: ఈ వచనంలో దావీదు వాయించిన వాయిద్యం పేరు చెప్పబడలేదు; సమీప సందర్భంలో అది గుర్తించబడుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: ముందు జరిగిన సంఘటనల తర్వాతి రోజును సూచించే సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: וַתִּצְלַח
  choice: మీదికి బలంగా వచ్చింది
  rationale: ఆత్మ అకస్మాత్తుగా, శక్తివంతంగా సౌలు మీదికి రావడాన్ని తెలియజేస్తుంది; ‘ఆవహించింది’ అని చెప్పి మూలంలో లేని పూర్తి స్వాధీన భావాన్ని జోడించలేదు.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: దేవుని నుండి వచ్చిన దుష్టాత్మ
  rationale: ఆ ఆత్మకు దేవునితో ఉన్న మూలం లేదా పంపింపు సంబంధాన్ని నిలుపుతూ, רָעָה యొక్క సాధారణ అర్థాన్ని ‘దుష్ట’గా ప్రతిబింబిస్తుంది; ‘హానికరమైన ఆత్మ’ అనే సందర్భానుగుణ ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: וַיִּתְנַבֵּא
  choice: ప్రవచనావేశంతో ప్రవర్తిస్తున్నాడు
  rationale: ఈ క్రియలోని ప్రవచన సంబంధాన్ని నిలుపుతూ, సందర్భంలో కనిపించే అదుపులేని ఆవేశపూరిత ప్రవర్తనను కూడా సూచిస్తుంది; కేవలం నిజమైన ప్రవచనం లేదా కేవలం ఉన్మాదం అని అర్థాన్ని ఏకపక్షంగా నిర్ణయించదు.
- source_word: בְּתוֹךְ הַבַּיִת
  choice: ఇంట్లో
  rationale: స్థలార్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: מְנַגֵּן בְּיָדוֹ
  choice: తన చేతితో వాయిస్తున్నాడు
  rationale: సంగీత వాయిద్యాన్ని వాయించే చర్యనూ, మూలంలోని ‘తన చేతితో’ అనే వివరాన్నీ ఉంచుతుంది; ఈ వచనంలో పేరు లేని వాయిద్యాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: כְּיוֹם בְּיוֹם
  choice: రోజూ చేసినట్టే
  rationale: రోజువారీ అలవాటును సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַחֲנִית בְּיַד שָׁאוּל
  choice: సౌలు చేతిలో ఈటె ఉంది
  rationale: తర్వాతి చర్యకు నేపథ్యమయ్యే అశుభసూచక వివరాన్ని సరళంగా, నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה అనే పదబంధంలో దేవుని కార్యసంబంధం మరియు ఆత్మ స్వభావం
  choice: దేవుని నుండి వచ్చిన దుష్టాత్మ
  alternative: దేవుని నుండి వచ్చిన హానికరమైన ఆత్మ; దేవుని దుష్టాత్మ
  rationale: హీబ్రూ పాఠ్యం ఆ ఆత్మను దేవునితో నేరుగా సంబంధపరుస్తుంది. ‘దేవుని నుండి వచ్చిన’ అనేది ఆ సంబంధాన్ని దాచకుండా ఉంచుతుంది; అదే సమయంలో దుష్టత్వం దేవుని స్వభావగుణమని తెలుగులో అనవసరంగా సూచించదు. ‘హానికరమైన’ అనే సాధ్యార్థాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
- issue: וַיִּתְנַבֵּא నిజమైన ప్రవచనాన్నా లేక ఆవేశపూరిత అసాధారణ ప్రవర్తననూ సూచిస్తుందా
  choice: ప్రవచనావేశంతో ప్రవర్తిస్తున్నాడు
  alternative: ప్రవచిస్తున్నాడు; ఉన్మాదంగా ప్రవర్తిస్తున్నాడు
  rationale: క్రియ యొక్క ప్రవచన సంబంధాన్ని తొలగించకుండా, ఈ హానికరమైన ఆత్మ మరియు వెంటనే వచ్చే హింసాత్మక సందర్భం సూచించే ఆవేశాన్ని తెలియజేస్తుంది. అలా మూలంలోని ఉద్రిక్తతను ఒకే వ్యాఖ్యానంతో పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా చిన్న వాక్యాలుగా విభజించాం; అయినప్పటికీ సంఘటనల క్రమం, ఆత్మకు దేవునితో ఉన్న సంబంధం, సౌలు ప్రవర్తనలోని అస్పష్టత, వాయిద్యం పేరు చెప్పకపోవడం, చేతిలో ఈటె ఉన్నదనే వివరాలు అన్నీ నిలుపబడ్డాయి.
