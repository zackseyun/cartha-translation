source:
  edition: WLC
  text: וַ/יֵּצֵ֨א דָוִ֜ד בְּ/כֹל֩ אֲשֶׁ֨ר יִשְׁלָחֶ֤/נּוּ שָׁאוּל֙ יַשְׂכִּ֔יל וַ/יְשִׂמֵ֣/הוּ שָׁא֔וּל עַ֖ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֑ה וַ/יִּיטַב֙ בְּ/עֵינֵ֣י כָל הָ/עָ֔ם וְ/גַ֕ם בְּ/עֵינֵ֖י עַבְדֵ֥י שָׁאֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
translation:
  language: te
  text: సౌలు అతనిని ఏ పనికై పంపినా, దావీదు వెళ్లి వివేకంగా వ్యవహరించేవాడు.[a] కాబట్టి సౌలు అతనిని యుద్ధ సైనికులకు అధిపతిగా నియమించాడు. ఇది ప్రజలందరి దృష్టిలోనూ, సౌలు సేవకుల దృష్టిలోనూ మంచిదిగా అనిపించింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సఫలమయ్యేవాడు.” హెబ్రీయ పదం వివేకంగా వ్యవహరించడం, దాని ఫలితంగా విజయం పొందడం అనే రెండు భావాలనూ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతడు ప్రజలందరికీ, సౌలు సేవకులకూ నచ్చాడు.” ఇక్కడ మంచిదిగా అనిపించింది దావీదునా, అతని నియామకమా, లేక ఇప్పుడే చెప్పిన మొత్తం పరిస్థితా అన్నది హెబ్రీయ పాఠ్యంలో స్పష్టంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: వెళ్లి
  rationale: יצא అనే క్రియకు మౌలిక అర్థం ‘బయలుదేరు/వెళ్లు.’ ఇక్కడ సౌలు పంపిన పనులు లేదా సైనిక కార్యాల కోసం దావీదు వెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל
  choice: సౌలు దావీదును ఎక్కడికి పంపితే అక్కడికి
  rationale: అక్షరార్థంగా ‘సౌలు అతణ్ణి పంపిన ప్రతిదానిలో’ అనే భావం ఉన్నా, సందర్భంలో పునరావృత నియామకాలు లేదా ప్రదేశాల పంపకాన్ని ‘ఎక్కడికి పంపితే అక్కడికి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יַשְׂכִּיל
  choice: వివేకంతో వ్యవహరించేవాడు
  rationale: שׂכל హిఫీల్ రూపం వివేకంగా ప్రవర్తించడం, అలాగే దాని ఫలితంగా సఫలమవడం అనే రెండు భావాలను మోయగలదు. ప్రధాన పాఠ్యంలో వివేకపూర్వక ప్రవర్తనను ఉంచి, విజయ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיְשִׂמֵהוּ
  choice: అతణ్ణి ... అధికారిగా నియమించాడు
  rationale: שׂים עם עַל పరిపాలనా సందర్భంలో ఒకరిని ఇతరులపై ఉంచడం లేదా నియమించడం అని అర్థం. ‘అధికారిగా నియమించాడు’ తెలుగులో అధికారిక బాధ్యతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: యుద్ధవీరులపై
  rationale: అక్షరార్థంగా ‘యుద్ధపు మనుషులపై.’ ‘యుద్ధవీరులు’ పురుష సైనిక సమూహాన్ని గౌరవప్రదంగా, సహజంగా సూచిస్తుంది.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: దృష్టిలో ... మంచిదిగా అనిపించింది
  rationale: ఈ హెబ్రీయ నిర్మాణం ఎవరి అంచనాలోనైనా మంచిగా లేదా ఆమోదయోగ్యంగా ఉండడాన్ని సూచిస్తుంది. ‘దృష్టిలో’ మూలభాషా రూపకాన్ని నిలుపుతుంది; ‘మంచిదిగా అనిపించింది’ సహజ తెలుగు.
- source_word: כָל הָעָם
  choice: ప్రజలందరి
  rationale: עם ఇక్కడ సైన్యానికే పరిమితం కాకుండా సాధారణ ప్రజలను విస్తృతంగా సూచించే అవకాశం ఉంది; అందువల్ల ‘ప్రజలందరి’ అనేది తక్కువగా నిర్దిష్టీకరించే అనువాదం.
- source_word: עַבְדֵי שָׁאוּל
  choice: సౌలు సేవకుల
  rationale: עבדים రాజసభ సేవకులు, పరివారం లేదా అధికారులను సూచించవచ్చు. ‘సేవకులు’ మూలపదానికి అత్యంత ప్రత్యక్షమైనది; దాని విస్తృత పరిధిని కుదించదు.
theological_decisions:
- issue: וַיִּיטַב యొక్క సూచిత విషయం
  choice: ‘ఇది’ అని ముందటి పరిస్థితి మొత్తాన్ని సూచించేలా అనువదించడం
  alternative: ‘దావీదు అందరికీ నచ్చాడు’ లేదా ‘ఆ నియామకం అందరికీ నచ్చింది’
  rationale: హెబ్రీయ వాక్యం దావీదునేనా, అతని నియామకాన్నేనా, లేక ఇప్పుడే వివరించిన మొత్తం పరిస్థితినేనా సూచిస్తుందో ఖచ్చితంగా నిర్ధారించదు. ప్రధాన పాఠ్యం ఆ అస్పష్టతను సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘దృష్టిలో’ అనే హెబ్రీయ నుడికారాన్ని పాఠకులకు అర్థమయ్యే రూపంలో నిలిపి, שׂכל మరియు וַיִּיטַב లోని నిజమైన అర్థసంభావ్యతలను పాదసూచికల్లో సంరక్షించాం.
