- from: 'అప్పుడు సౌలు ఇలా అన్నాడు: “మీరు దావీదుతో ఇలా చెప్పాలి: ‘రాజుకు కన్యాశుల్కంగా[a] ఫిలిష్తీయుల నూరు ముందోళ్లు తప్ప మరేమీ అక్కర్లేదు. రాజు తన శత్రువుల మీద పగ తీర్చుకోవడానికే ఇది.’” అయితే దావీదు ఫిలిష్తీయుల చేతిలో పడిపోవాలని[b] సౌలు ఉద్దేశించాడు.'
  to: 'అప్పుడు సౌలు ఇలా అన్నాడు: “మీరు దావీదుతో ఇలా చెప్పాలి: ‘రాజుకు కన్యాశుల్కంగా[a] ఫిలిష్తీయుల నూరు సున్నతి చర్మాలు తప్ప మరేమీ అక్కర్లేదు; రాజు శత్రువులపై ప్రతీకారం తీర్చుకోవడానికి అవి కావాలి.’” అయితే, దావీదు ఫిలిష్తీయుల చేతిలో పడేలా చేయాలని[b] సౌలు ఉద్దేశించాడు.'
  rationale: The revision removes the added demonstrative explanation from the stated purpose, uses a direct vengeance-purpose clause, restores the causative force of Saul’s intention, and substitutes a clearer modern Telugu anatomical term. The ambiguity concerning whether David’s “fall” entails death remains preserved and is correctly explained in the footnote.
