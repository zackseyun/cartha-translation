source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל כֹּֽה תֹאמְר֣וּ לְ/דָוִ֗ד אֵֽין חֵ֤פֶץ לַ/מֶּ֨לֶךְ֙ בְּ/מֹ֔הַר כִּ֗י בְּ/מֵאָה֙ עָרְל֣וֹת פְּלִשְׁתִּ֔ים לְ/הִנָּקֵ֖ם בְּ/אֹיְבֵ֣י הַ/מֶּ֑לֶךְ וְ/שָׁא֣וּל חָשַׁ֔ב לְ/הַפִּ֥יל אֶת דָּוִ֖ד בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
translation:
  language: te
  text: 'అప్పుడు సౌలు ఇలా అన్నాడు: “మీరు దావీదుతో ఇలా చెప్పాలి: ‘రాజుకు కన్యాశుల్కంగా[a] ఫిలిష్తీయుల నూరు సున్నతి చర్మాలు తప్ప మరేమీ అక్కర్లేదు; రాజు శత్రువులపై ప్రతీకారం తీర్చుకోవడానికి అవి కావాలి.’” అయితే, దావీదు ఫిలిష్తీయుల చేతిలో పడేలా చేయాలని[b] సౌలు ఉద్దేశించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కన్యాశుల్కం” అంటే వివాహ సందర్భంలో సాధారణంగా వరుడు లేదా అతని కుటుంబం వధువు కుటుంబానికి ఇచ్చే చెల్లింపు; ఇది ఆధునిక అర్థంలోని కట్నం కాదు.
    reason: cultural_note
  - marker: b
    text: “పడేలా చేయాలని” అనే మాట ఇక్కడ దావీదు మరణానికి గురికావాలని సూచించే అవకాశం ఉంది; అయితే హీబ్రూ మూలంలోని వ్యక్తీకరణ అంత స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹהַר
  choice: కన్యాశుల్కం
  rationale: వివాహ సందర్భంలో వరుడు లేదా అతని కుటుంబం వధువు కుటుంబానికి ఇచ్చే చెల్లింపును సూచిస్తుంది; ఆధునిక అర్థంలోని కట్నంతో దీనిని కలపకుండా ఉండేందుకు ఈ పదాన్ని ఎంచుకున్నాం.
- source_word: אֵין חֵפֶץ לַמֶּלֶךְ
  choice: రాజుకు ... మరేమీ అక్కర్లేదు
  rationale: חֵפֶץ లోని కోరిక లేదా అభిలాష భావాన్ని ఈ లావాదేవీ సందర్భంలో సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల నూరు ముందోళ్లు తప్ప
  rationale: హీబ్రూ వాక్యంలోని దిగ్భ్రాంతికరమైన శారీరక నిర్దిష్టతను మృదువుచేయకుండా, సాధారణ కన్యాశుల్కానికి బదులుగా కోరినదాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: לְהִנָּקֵם בְּאֹיְבֵי הַמֶּלֶךְ
  choice: రాజు తన శత్రువుల మీద పగ తీర్చుకోవడానికి
  rationale: నిఫాల్ రూపంలోని ప్రతీకార భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, సౌలు ఉపయోగించిన రాజసంబంధమైన స్వీయ ప్రస్తావనను నిలుపుతుంది.
- source_word: חָשַׁב
  choice: ఉద్దేశించాడు
  rationale: ఇక్కడ ఇది కేవలం ఆలోచించడాన్ని కాక, దావీదుకు హాని కలిగించాలనే సంకల్పాన్ని సూచిస్తుంది.
- source_word: לְהַפִּיל אֶת דָּוִד
  choice: దావీదు ... పడిపోవాలని
  rationale: హీబ్రూ ‘పడేలా చేయడం’ అనే రూపకాన్ని నిలుపుతుంది; అది మరణాన్ని సూచించే అవకాశమున్నా, మూలంలో ఉన్నదానికంటే స్పష్టంగా ‘చంపడం’ అని చెప్పదు.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల చేతిలో
  rationale: కారకత్వాన్ని తెలిపే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: దావీదు ‘పడిపోవడం’ అంటే మరణమా లేక పతనమా
  choice: పడిపోవాలని
  alternative: చనిపోవాలని
  rationale: సందర్భం దావీదు మరణాన్ని సూచించినప్పటికీ, మూల హీబ్రూ రూపకంగా ఉంది; అందువల్ల దాని ఉద్దేశపూర్వక అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. హింసాత్మక శారీరక పదాన్ని మృదువుచేయలేదు; ‘పడిపోవడం’ అనే మూల రూపకంలోని అస్పష్టతను నిలిపాం.
