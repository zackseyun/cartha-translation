  text: וַ/יִּ֨חַר לְ/שָׁא֜וּל מְאֹ֗ד וַ/יֵּ֤רַע בְּ/עֵינָי/ו֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יֹּ֗אמֶר נָתְנ֤וּ לְ/דָוִד֙ רְבָב֔וֹת וְ/לִ֥/י נָתְנ֖וּ הָ/אֲלָפִ֑ים וְ/ע֥וֹד ל֖/וֹ אַ֥ךְ הַ/מְּלוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
translation:
  language: te
  text: అప్పుడు సౌలు చాలా కోపపడ్డాడు; ఈ విషయం అతనికి నచ్చలేదు. అతడు, “వారు దావీదుకు పదివేలు ఇచ్చారు, నాకు మాత్రం వేలు ఇచ్చారు.[a] ఇక అతనికి రాజ్యం తప్ప మరేమి మిగిలింది?”[b] అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సందర్భానుసారంగా: “వారు దావీదుకు పదివేలు ఆపాదించారు, నాకు మాత్రం వేలు ఆపాదించారు.”'
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది: “ఇంకా అతనికి రాజ్యం మాత్రమే.” అంటే, దావీదు పొందడానికి ఇక రాజ్యం ఒక్కటే మిగిలిందని సౌలు భావిస్తున్నాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְשָׁאוּל מְאֹד
  choice: సౌలు చాలా కోపగించుకున్నాడు
  rationale: חרה అనే క్రియలో మండే కోపం అనే రూపక భావం ఉన్నా, מְאֹד తీవ్రతను కలిపి ఆధునిక తెలుగులో సహజంగా ‘చాలా కోపగించుకున్నాడు’ అని వ్యక్తం చేశాం.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: అతనికి నచ్చలేదు
  rationale: అక్షరార్థంగా ‘అతని కళ్లలో చెడ్డదైంది’ అనే హీబ్రూ నుడికారాన్ని, సౌలు ప్రతికూల స్పందనను తెలిపే సహజమైన ఆధునిక తెలుగు రూపంలో అందించాం.
- source_word: הַדָּבָר הַזֶּה
  choice: ఆ మాట
  rationale: דבר అనే పదానికి మాట, విషయం అనే అర్థాలు ఉన్నాయి. ఇక్కడ ముందుగా పాడిన మాటలను సూచిస్తున్నందున ‘ఆ మాట’ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: נָתְנוּ
  choice: ఆపాదించారు
  rationale: ప్రాథమిక అర్థం ‘ఇచ్చారు’; అయితే పాటలో విజయాల సంఖ్యను ఒక్కొక్కరికి కట్టబెట్టడమే సందర్భార్థం. ‘ఆపాదించారు’ ఆ భావాన్ని సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: רְבָבוֹת
  choice: పదివేలు
  rationale: ఈ బహువచన రూపం పదివేల యూనిట్లను సూచిస్తుంది. ‘పదివేలు’ అనేది ‘వేలు’తో ఉన్న సంఖ్యాపరమైన అలంకార సమాంతరతను నిలుపుతుంది.
- source_word: הָאֲלָפִים
  choice: వేలే
  rationale: హీబ్రూలోని నిర్దిష్ట రూపం మరియు సౌలు చూపుతున్న తక్కువతనపు వ్యత్యాసాన్ని తెలుగులో ‘మాత్రం వేలే’ సహజంగా బలపరుస్తుంది.
- source_word: וְעוֹד לוֹ אַךְ הַמְּלוּכָה
  choice: ఇక అతనికి రాజ్యం తప్ప మరేమి మిగిలింది?
  rationale: మూలంలోని సంక్షిప్తమైన వాక్య నిర్మాణం, దావీదుకు పొందవలసినది రాజ్యం ఒక్కటే మిగిలిందనే సౌలు భయాన్ని సూచిస్తుంది. ప్రశ్నార్థక రూపం సందర్భంలోని వాక్చాతుర్యాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: הַמְּלוּכָה
  choice: రాజ్యం
  rationale: ఈ పదం రాజరికం లేదా రాజ్యాధికారాన్ని సూచించగలదు. కథన సందర్భంలో సౌలు తన రాజ్యాన్ని దావీదు పొందుతాడని భయపడుతున్నందున ‘రాజ్యం’ సహజమైనదిగా, ఉద్దేశపూర్వకమైన విస్తృతతతో ఉంది.
theological_decisions:
- issue: הַמְּלוּכָה అనే పదం రాజ్యం లేదా రాజరికం అనే రెండు సమీప భావాలను కలిగి ఉండడం
  choice: రాజ్యం
  alternative: రాజరికం / రాజ్యాధికారం
  rationale: సౌలు భయపడేది కేవలం పదవి మాత్రమేనా, పాలనా అధికారం సహా రాజ్యమా అన్నదాన్ని అతిగా నిర్ధారించకుండా, కథనంలో సహజంగా వినిపించే ‘రాజ్యం’ను ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని సంఖ్యాపరమైన వ్యత్యాసాన్ని ‘పదివేలు—వేలు’గా నిలిపి, చివరి సంక్షిప్త హీబ్రూ వాక్యాన్ని సహజమైన అలంకార ప్రశ్నగా అందించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
