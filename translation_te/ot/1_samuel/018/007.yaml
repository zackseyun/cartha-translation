  edition: WLC
  text: וַֽ/תַּעֲנֶ֛ינָה הַ/נָּשִׁ֥ים הַֽ/מְשַׂחֲק֖וֹת וַ/תֹּאמַ֑רְןָ הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד בְּ/רִבְבֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/007.yaml
  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
translation:
  language: te
  text: 'సంబరాలు చేసుకుంటున్న స్త్రీలు ఒకరికొకరు ప్రతిస్పందిస్తూ పాడారు[a]: “సౌలు వేల కొద్దీ హతమార్చాడు[b]; దావీదు పదివేల కొద్దీ హతమార్చాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకరికొకరు జవాబిస్తూ పాడారు.” ఇది బృందాలు ఒకదానికొకటి ప్రతిస్పందిస్తూ పాడే గానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “కొట్టాడు”; ఇక్కడ సైనిక సందర్భంలో చంపడం లేదా ఓడించడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנֶינָה
  choice: ఒకరికొకరు ప్రతిస్పందిస్తూ పాడారు
  rationale: ענה అనే క్రియ ఈ గాన సందర్భంలో కేవలం ‘జవాబిచ్చారు’ అని కాక, ఒక బృందానికి మరొక బృందం ప్రతిస్పందిస్తూ పాడడాన్ని సూచిస్తుంది.
- source_word: הַנָּשִׁים
  choice: స్త్రీలు
  rationale: మూలంలోని స్పష్టమైన బహువచన నామవాచకాన్ని సహజంగా నిలిపింది.
- source_word: הַמְשַׂחֲקוֹת
  choice: సంబరాలు చేసుకుంటున్న
  rationale: שׂחק రూపం ఈ ఉత్సవ సందర్భంలో ఆటపాటలు, నృత్యం, ఆనందోత్సాహం వంటి విస్తృత భావాన్ని కలిగి ఉంది; ‘సంబరాలు చేసుకుంటున్న’ దానిని అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: וַתֹּאמַרְןָ
  choice: 'పాడారు:'
  rationale: ముందున్న ప్రతిస్పందన గాన భావంతో ఉల్లేఖనాన్ని సహజంగా కలుపుతుంది; హెబ్రీలోని ‘అన్నారు’ అనే భావం గీతంలోని మాటల ద్వారా వ్యక్తమవుతుంది.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: נכה అక్షరార్థంగా ‘కొట్టాడు’; ఈ సైనిక విజయాల లెక్క సందర్భంలో శత్రువులను సంహరించడాన్ని సూచిస్తుంది. ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: באלפו
  choice: వేలమందిని
  rationale: సైనిక విజయాల సంఖ్యను తెలిపే హెబ్రీ ప్రయోగాన్ని తెలుగులో సహజమైన వ్యక్తుల లెక్కగా అందిస్తుంది; స్వామ్యసూచక భావాన్ని బలవంతంగా చేర్చదు.
- source_word: בְּרִבְבֹתָיו
  choice: పదివేలమందిని
  rationale: רבבה అంటే ‘పది వేలు’; కవితాత్మక సమాంతరంలో సౌలు సాధించిన వేల విజయాలకు మించిన దావీదు విజయాలను సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన-కావ్య శైలి. విజయగీతపు సంక్షిప్త సమాంతర నిర్మాణాన్ని నిలిపి, మూలంలోని ఉత్సవ చర్య మరియు ప్రతిస్పందన గాన భావాలను సహజంగా వ్యక్తం చేసింది.
