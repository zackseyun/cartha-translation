translation:
  language: te
  text: అయితే సౌలు కుమార్తె మేరబును దావీదుకు ఇచ్చే సమయం వచ్చినప్పుడు, ఆమెను మెహోలాతీయుడైన అద్రియేలుకు భార్యగా ఇచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: అయితే ... సమయం వచ్చినప్పుడు
  rationale: ఈ కథన నిర్మాణం కాలసూచనతో పాటు, మేరబు దావీదుకు ఇవ్వబడుతుందనే నిరీక్షణకు విరుద్ధంగా జరిగిన మలుపును తెలియజేస్తుంది.
- source_word: תֵּת אֶת מֵרַב בַּת שָׁאוּל לְדָוִד
  choice: సౌలు కుమార్తె మేరబును దావీదుకు ఇవ్వాల్సిన
  rationale: వివాహ ఏర్పాటులో మేరబు ఉద్దేశిత స్వీకర్త దావీదు అని స్పష్టంగా తెలియజేస్తూ, తెలుగు వాక్య నిర్మాణానికి సహజంగా ఉంది.
- source_word: וְהִיא נִתְּנָה
  choice: ఆమెను ... ఇచ్చారు
  rationale: హీబ్రూ కర్మణి రూపంలోని దృష్టిని మేరబుపైనే ఉంచుతూ, సహజమైన ఆధునిక తెలుగులో భావాన్ని అందిస్తుంది.
- source_word: לְעַדְרִיאֵל הַמְּחֹלָתִי
  choice: మెహోలాతీయుడైన అద్రీయేలుకు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, ప్రాంతీయ విశేషణాన్ని సహజ తెలుగు రూపంలో నిలుపుతుంది.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: ఇది వివాహాన్ని సూచించే సాధారణ హీబ్రూ నుడికారం; 'భార్యగా' దాని అర్థాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ఆశాభంగాన్ని 'అయితే' ద్వారా స్పష్టంగా ఉంచింది; అనవసరమైన వివరణను జోడించలేదు.
