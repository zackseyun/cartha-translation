  text: Saul hurled the spear and said, “I will pin David to the wall.” But David dodged away from him twice.
translation:
  language: te
  text: సౌలు ఈటెను విసిరి, “దావీదును గోడకు గుచ్చేస్తాను” అన్నాడు. అయితే దావీదు అతని నుండి రెండుసార్లు తప్పించుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּטֶל
  choice: విసిరి
  rationale: ఈ సందర్భంలో ఈటెను బలంగా విసరడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అని అనుకున్నాడు
  rationale: హీబ్రూ ‘అన్నాడు’ అని ఉన్నప్పటికీ, ఇక్కడ సౌలు తనలో తాను ఉద్దేశించుకున్న భావం సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: אַכֶּה בְדָוִד וּבַקִּיר
  choice: దావీదును గోడకు గుచ్చేస్తాను
  rationale: అక్షరార్థంగా ‘దావీదులోను గోడలోను కొడతాను’; లక్ష్యం ఈటెతో దావీదును గోడకు గుచ్చివేయడం కావడంతో, తెలుగు పాఠకునికి స్పష్టంగా మరియు ఉద్దేశ్యాన్ని నిలుపుతూ అనువదించబడింది.
- source_word: וַיִּסֹּב ... מִפָּנָיו
  choice: అతని ఎదుటినుంచి తప్పించుకున్నాడు
  rationale: ముఖం తిప్పడం లేదా పక్కకు తొలగడం అనే చర్యను ఈ ప్రమాద సందర్భంలో సహజంగా ‘తప్పించుకున్నాడు’ అని వ్యక్తం చేస్తుంది.
- source_word: פַּעֲמָיִם
  choice: రెండుసార్లు
  rationale: హీబ్రూ ద్వివచనార్థాన్ని నేరుగా నిలుపుతుంది.
