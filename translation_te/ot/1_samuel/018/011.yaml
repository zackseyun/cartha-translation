  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదప్రయోగం. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతగా నిలిపింది.
