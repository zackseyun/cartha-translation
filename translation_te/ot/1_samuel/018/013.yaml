- from: కాబట్టి సౌలు దావీదును తన సన్నిధి నుండి తొలగించి, అతణ్ణి వెయ్యిమందికి అధిపతిగా నియమించాడు. దావీదు ప్రజల ముందు బయలుదేరుతూ, తిరిగి వస్తూ ఉండేవాడు.[a]
