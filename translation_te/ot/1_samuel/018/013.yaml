  yaml_path: translation/ot/1_samuel/018/013.yaml
  text: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
translation:
  language: te
  text: అప్పుడు సౌలు దావీదును తన సమక్షం నుండి దూరం చేసి, అతనిని వెయ్యిమందికి అధిపతిగా నియమించాడు; దావీదు ప్రజల ముందు వెళ్లి వచ్చేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వెళ్లి వచ్చేవాడు” అనేది హీబ్రూలోని “బయలుదేరి వచ్చాడు” అనే నానుడి. ఇది ప్రజా లేదా సైనిక కార్యకలాపాల్లో పాల్గొనడాన్ని సూచించవచ్చు; ప్రజలకు నాయకత్వం వహించడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  choice: తొలగించి
  rationale: హిఫీల్ రూపంలోని causative భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; సౌలు దావీదును తన దగ్గర నుండి దూరం చేసిన చర్యను చూపుతుంది, ఉద్దేశాన్ని అతిగా వ్యాఖ్యానించదు.
- source_word: מֵעִמּוֹ
  choice: తన సన్నిధి నుండి
  rationale: అక్షరార్థంగా ‘తనతో ఉన్నచోట నుండి’; రాజసభా/వ్యక్తిగత సమీప సందర్భాన్ని ఆధునిక గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיְשִׂמֵהוּ לוֹ
  choice: అతణ్ణి ... నియమించాడు
  rationale: שׂוּם + పరోక్ష కర్మ ఇక్కడ ఒక అధికార స్థానంలో ఉంచడాన్ని సూచిస్తుంది; ‘నియమించాడు’ ఆ అధికారిక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: שַׂר אָלֶף
  choice: వెయ్యిమందికి అధిపతి
  rationale: సైనిక-పరిపాలనా నాయకత్వ భావాన్ని నిలుపుతుంది; ‘వెయ్యిమంది’ అనే మూల సంఖ్యను మార్చదు.
- source_word: וַיֵּצֵא וַיָּבֹא
  choice: బయలుదేరుతూ, తిరిగి వస్తూ ఉండేవాడు
  rationale: హీబ్రూ జంట క్రియలను తెలుగులో సహజంగా నిలుపుతూ, పునరావృత ప్రజా లేదా సైనిక కార్యకలాపం అనే సందర్భార్థానికి అవకాశం ఇస్తుంది.
- source_word: לִפְנֵי הָעָם
  choice: ప్రజల ముందు
  rationale: అక్షరార్థాన్ని నిలుపుతుంది; ఇది ప్రజల దృష్టిలో ఉండడమా లేక వారికి నాయకత్వం వహించడమా అనే భావాన్ని ప్రధాన పాఠ్యంలో సంకుచితం చేయదు.
