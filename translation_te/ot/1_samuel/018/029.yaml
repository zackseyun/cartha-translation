translation:
  language: te
  text: సౌలు దావీదుకు మరింత భయపడసాగాడు[a]. సౌలు దావీదుకు ఎల్లప్పుడూ శత్రువుగా ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సౌలు దావీదుకు ఇంకా భయపడుతూ ఉన్నాడు.” హీబ్రూ ప్రయోగం ‘భయపడటాన్ని మరింతగా కొనసాగించాడు’ అనే భావాన్ని ఇస్తుంది; ‘ఇంకా’ అనే పదం ఆ భావాన్ని బలపరుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అన్ని దినాల్లో.” ఇది సౌలు జీవితాంతం అని సూచించవచ్చు; లేదా అతని శత్రుత్వం నిరంతరం కొనసాగిందని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאסֶף ... לֵרֹא
  choice: భయపడుతూనే ఉన్నాడు
  rationale: יָסַף + క్రియార్థక రూపం ఇక్కడ ఒక చర్య కొనసాగడాన్ని లేదా మరింత పెరగడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִפְּנֵי דָוִד
  choice: దావీదుకు
  rationale: יִרְאָהతో వచ్చిన מִפְּנֵי అనే హీబ్రూ ప్రయోగం దావీదును చూసి లేదా దావీదు కారణంగా భయపడటం అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘దావీదుకు భయపడటం’ సహజమైన ప్రయోగం.
- source_word: עוֹד
  choice: ఇంకా ఎక్కువగా
  rationale: ముందటి వచన సందర్భంలో ఇప్పటికే ఉన్న భయం మరింత పెరిగిందనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అయితే ‘ఇంకా/మరింతకాలం’ అనే కొనసాగింపు భావం కూడా సాధ్యమే.
- source_word: וַיְהִי
