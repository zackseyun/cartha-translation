source:
  edition: WLC
  text: וַ/יִּתְפַּשֵּׁ֣ט יְהוֹנָתָ֗ן אֶֽת הַ/מְּעִיל֙ אֲשֶׁ֣ר עָלָ֔י/ו וַֽ/יִּתְּנֵ֖/הוּ לְ/דָוִ֑ד וּ/מַדָּ֕י/ו וְ/עַד חַרְבּ֥/וֹ וְ/עַד קַשְׁתּ֖/וֹ וְ/עַד חֲגֹרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/004.yaml
  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
translation:
  language: te
  text: అప్పుడు యోనాతాను తాను ధరించి ఉన్న పైవస్త్రాన్ని తీసి దావీదుకు ఇచ్చాడు. దానితోపాటు తన యుద్ధ వస్త్రాలను, తన ఖడ్గం, విల్లు, నడికట్టు వరకు కూడా ఇచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  choice: తీసి
  rationale: హిత్పయేల్ రూపం తాను ధరించిన వస్త్రాన్ని తన మీదనుండి తొలగించడాన్ని సూచిస్తుంది. తెలుగులో ‘తీసి’ అనేది సహజంగా ఉండి, సందర్భంలో బట్టలన్నీ విప్పేశాడనే అనవసర భావాన్ని కలిగించదు.
- source_word: הַמְּעִיל
  choice: పైవస్త్రం
  rationale: מְעִיל బయటి పొరగా ధరించే అంగీ లేదా వస్త్రాన్ని సూచిస్తుంది. ‘పైవస్త్రం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, వస్త్ర స్వరూపాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֲשֶׁר עָלָיו
  choice: తాను వేసుకొని ఉన్న
  rationale: యోనాతాను అప్పటికి ధరించి ఉన్న పైవస్త్రమే అని సంబంధవాక్యం స్పష్టం చేస్తుంది; ఈ రూపం తెలుగులో సహజమైనది.
- source_word: וַיִּתְּנֵהוּ לְדָוִד
  choice: దావీదుకు ఇచ్చాడు
  rationale: సర్వనామ ప్రత్యయం పైవస్త్రాన్నే సూచిస్తుంది. సాధారణ కథనశైలిలో נתן ను ‘ఇచ్చాడు’ అని నేరుగా అనువదించడం తగినది.
- source_word: וּמַדָּיו
  choice: తన యుద్ధ వస్త్రాలను
  rationale: מַדִּים సాధారణ వస్త్రాలను, ముఖ్యంగా అధికారిక లేదా సైనిక దుస్తులను సూచించగలదు. వెంటనే ఖడ్గం, విల్లు, నడికట్టు ప్రస్తావన ఉన్నందున ‘యుద్ధ వస్త్రాలు’ సందర్భాన్ని ప్రతిబింబిస్తూ, ‘కవచం’ అనే మరింత సంకుచిత అర్థాన్ని మోపదు.
- source_word: וְעַד
  choice: చివరికి … కూడా
  rationale: పునరుక్త עַד జాబితా పరిధిని ఆయుధాలు, నడికట్టు వరకు విస్తరిస్తుంది. తెలుగులో ‘చివరికి … కూడా’ దాని విస్తరణాత్మక, శిఖరార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: חַרְבּוֹ
  choice: తన ఖడ్గాన్ని
  rationale: ఈ సందర్భంలో חֶרֶב కు ప్రమాణమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: קַשְׁתּוֹ
  choice: విల్లును
  rationale: קֶשֶׁת కు సహజమైన తెలుగు పదం.
- source_word: חֲגֹרוֹ
  choice: నడికట్టును
  rationale: నడుము చుట్టూ కట్టుకునే వస్తువును חֲגוֹר సూచిస్తుంది. ‘నడికట్టు’ ఆధునిక, స్పష్టమైన పదం; కేవలం సాధారణ బెల్టు కంటే ఆయుధధారణ సందర్భానికీ సరిపోతుంది.
theological_decisions:
- issue: యోనాతాను ఇచ్చిన వస్తువుల కథనాత్మక ప్రాముఖ్యత
  choice: యోనాతాను చేసిన కార్యాలను మాత్రమే వర్ణించి, వాటి సంకేతార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టీకరించలేదు.
  alternative: ఈ బహుమతులు దావీదును భవిష్యత్ రాజుగా యోనాతాను అంగీకరించిన సంకేతమని లేదా ఇవి ప్రధానంగా నిబంధనాత్మక స్నేహానికి గుర్తులని అనువాదంలోనే పేర్కొనడం.
  rationale: ఈ వచనంలోని హీబ్రూ పాఠ్యం వస్తువులను ఇచ్చిన కార్యాన్ని నివేదిస్తుంది గాని దాని సంకేతార్థాన్ని ప్రత్యక్షంగా నిర్వచించదు. అందువల్ల అనువాదం కథనంలోని ధార్మిక ఉద్రిక్తతను, బహుళ వ్యాఖ్యాన అవకాశాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘పైవస్త్రం,’ ‘యుద్ధ వస్త్రాలు,’ ‘ఖడ్గం,’ ‘నడికట్టు’ వంటి పదాలు మూలంలోని వస్త్ర-సైనిక సందర్భాన్ని స్పష్టంగా ఉంచుతాయి; చర్యకు సంబంధించిన ప్రతీకాత్మక అర్థాన్ని అనువాదం స్వయంగా నిర్ణయించదు.
