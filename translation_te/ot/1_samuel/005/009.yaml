source:
  edition: WLC
  text: וַ/יְהִ֞י אַחֲרֵ֣י הֵסַ֣בּוּ אֹת֗/וֹ וַ/תְּהִ֨י יַד יְהוָ֤ה בָּ/עִיר֙ מְהוּמָה֙ גְּדוֹלָ֣ה מְאֹ֔ד וַ/יַּךְ֙ אֶת אַנְשֵׁ֣י הָ/עִ֔יר מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּשָּׂתְר֥וּ לָ/הֶ֖ם עפלים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/009.yaml
  text: And after they had moved it around[a], the hand of Yahweh was against the city, causing a very great panic; and he struck the men of the city, from small to great, and tumors broke out on them.
translation:
  language: te
  text: వారు దానిని తరలించిన తర్వాత, ఆ పట్టణంపై యెహోవా హస్తం ఉండి అత్యంత తీవ్రమైన కలవరం చెలరేగింది; ఆయన ఆ పట్టణంలోని పురుషులను చిన్నవారి నుండి పెద్దవారి వరకు కొట్టాడు, వారి మీద గడ్డలు పొడుచుకొచ్చాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి గడ్డలు పొడుచుకొచ్చాయి.” హీబ్రూ పదబంధం శరీరంపై వాపు గడ్డలు కనిపించడాన్ని లేదా పొడుచుకురావడాన్ని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסַבּוּ אֹתוֹ
  choice: వారు దాన్ని తరలించిన తర్వాత
  rationale: హిఫీల్ రూపం మందసాన్ని ఒక చోటు నుంచి మరొక చోటుకు తరలించడాన్ని సూచిస్తుంది. గమ్యస్థానాన్ని మూలపాఠం ఇక్కడ స్పష్టంగా చెప్పనందున దాన్ని జోడించలేదు.
- source_word: יַד יְהוָה
  choice: యెహోవా హస్తం
  rationale: దేవుని క్రియాశీల శక్తి లేదా తీర్పును తెలిపే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా పరిచితమైన రూపంలో అందిస్తుంది.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: అత్యంత తీవ్రమైన కలవరం
  rationale: భయం, గందరగోళం, అల్లకల్లోలం అనే భావపరిధిని కలిగిన పదబంధాన్ని సందర్భానికి సరిపోయే సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיַּךְ
  choice: ఆయన ... మొత్తాడు
  rationale: ఏకవచన క్రియకు యెహోవాయే కర్త. ‘మొత్తాడు’ అనే పదం హీబ్రూ క్రియలోని బలమైన, ప్రత్యక్షమైన దెబ్బతీయడం అనే భావాన్ని నిలుపుతుంది.
- source_word: אַנְשֵׁי הָעִיר
  choice: ఆ పట్టణంలోని పురుషులను
  rationale: మూలపాఠంలోని లింగనిర్దిష్టమైన ‘పురుషులు’ అనే అర్థాన్ని సాధారణ ‘ప్రజలు’గా మార్చకుండా ఉంచుతుంది.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: చిన్నవారి నుంచి గొప్పవారి వరకు
  rationale: వయస్సు, హోదా, లేదా సామాజిక స్థాయి—వీటిలో దేనిని ఉద్దేశించిందో నిర్ణయించకుండా హీబ్రూ నానుడిలోని విస్తృతిని నిలుపుతుంది.
- source_word: וַיִּשָּׂתְרוּ לָהֶם עפלים
  choice: వారి మీద గడ్డలు పొడుచుకొచ్చాయి
  rationale: అరుదైన క్రియ-నామ పదబంధం శరీరంపై వాపు గడ్డలు కనిపించడం లేదా ఉబికి రావడాన్ని సూచిస్తుంది. ‘మొలలు’ అని నిర్దిష్ట వైద్య గుర్తింపును బలవంతంగా విధించకుండా సాధారణ శారీరక వాపుల భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: ఈ వచనంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది; దాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగానే అనువదించాం.
- issue: దైవిక తీర్పులో కర్త
  choice: ‘ఆయన ... మొత్తాడు’ అని యెహోవాను కర్తగా స్పష్టంగా ఉంచడం
  alternative: ‘వారు బాధించబడ్డారు’ అనే కర్మణి నిర్మాణం
  rationale: హీబ్రూ ఏకవచన క్రియ యెహోవాను ప్రత్యక్ష కర్తగా చూపుతుంది; ఆ ధార్మిక ఉద్వేగాన్ని మృదువుచేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘హస్తం’ అనే బైబిలు రూపకాన్ని నిలిపి, మిగతా వాక్య నిర్మాణాన్ని సహజమైన తెలుగులో విభజించాం. మూలంలోని వయస్సు/హోదా సందిగ్ధతను, గడ్డల వైద్య స్వరూపంపై ఉన్న అనిశ్చితిని అలాగే ఉంచాం.
