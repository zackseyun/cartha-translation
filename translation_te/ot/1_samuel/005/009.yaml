revisions:
- from: వారు దాన్ని తరలించిన తర్వాత, యెహోవా హస్తం ఆ పట్టణం మీదికి వచ్చింది; అక్కడ అత్యంత తీవ్రమైన కలవరం చెలరేగింది. ఆయన ఆ పట్టణంలోని పురుషులను చిన్నవారి నుంచి గొప్పవారి వరకు మొత్తాడు; వారి మీద గడ్డలు పొడుచుకొచ్చాయి.[a]
  to: వారు దానిని తరలించిన తర్వాత, ఆ పట్టణంపై యెహోవా హస్తం ఉండి అత్యంత తీవ్రమైన కలవరం చెలరేగింది; ఆయన ఆ పట్టణంలోని పురుషులను చిన్నవారి నుండి పెద్దవారి వరకు కొట్టాడు, వారి మీద గడ్డలు పొడుచుకొచ్చాయి.[a]
  rationale: సవరణ యెహోవా హస్తం పట్టణంపై తీర్పుగా ఉన్నదనే సందర్భార్థాన్ని స్పష్టపరుస్తుంది; ఏకవచన దైవిక కర్తను, పురుషులనే నిర్దిష్ట లక్ష్యాన్ని, ‘చిన్నవారి నుండి పెద్దవారి వరకు’ అనే మూల నానుడి విస్తృతిని, మరియు గడ్డల వైద్య స్వరూపంలోని అనిశ్చితిని కాపాడుతుంది. పాదగమనికను మూల క్రియలోని వెలువడే భావానికి అనుగుణంగా సరిచేశారు.
