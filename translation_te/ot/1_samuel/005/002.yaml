id: 1SA.5.2
reference: 1 Samuel 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְח֤וּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים וַ/יָּבִ֥יאוּ אֹת֖/וֹ בֵּ֣ית דָּג֑וֹן וַ/יַּצִּ֥יגוּ אֹת֖/וֹ אֵ֥צֶל דָּגֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
translation:
  language: te
  text: అప్పుడు ఫిలిష్తీయులు దేవుని మందసాన్ని తీసుకొని, దాగోను మందిరంలోకి[a] తెచ్చి, దాగోను పక్కన ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “దాగోను ఇంటిలోకి”; అంటే దాగోను దేవాలయంలోకి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: తీసుకొని
  rationale: לקח ఇక్కడ కథన క్రమంలో సాధారణంగా ‘తీసుకోవడం’ అనే అర్థాన్నిస్తుంది; ‘పట్టుకున్నారు’ లేదా ‘స్వాధీనం చేసుకున్నారు’ వంటి అదనపు బలార్థాన్ని చేర్చలేదు.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ప్రజాసమూహపు పేరుకు ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: אֲרוֹןకు ఈ పవిత్ర సందర్భంలో స్థిరమైన తెలుగు పదం ‘మందసం’; הָאֱלֹהִיםను మూలపాఠానికి అనుగుణంగా ‘దేవుని’ అని అనువదించాం, ‘యెహోవా మందసం’ అని కాదు.
- source_word: וַיָּבִיאוּ אֹתוֹ
  choice: తెచ్చి
  rationale: בוא హిఫీల్ రూపం ‘తీసుకురావడం/తేవడం’ అని సూచిస్తుంది; కర్మప్రత్యయం మందసాన్నే సూచిస్తుంది.
- source_word: בֵּית דָּגוֹן
  choice: దాగోను మందిరంలోకి
  rationale: పదశః ‘దాగోను ఇంటిలోకి’; సందర్భంలో అది దాగోను దేవాలయం/మందిరాన్ని సూచిస్తుంది. సహజమైన తెలుగుకోసం ‘మందిరం’ ప్రధాన పాఠంలో వాడి, పదశః రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: ఉంచారు
  rationale: יצג హిఫీల్‌కు ‘నిలబెట్టడం, ఉంచడం’ అనే భావం ఉంది; మందసాన్ని ఒక నిర్దిష్ట స్థానంలో పెట్టడాన్ని ‘ఉంచారు’ సహజంగా తెలియజేస్తుంది.
- source_word: אֵצֶל דָּגוֹן
  choice: దాగోను పక్కన
  rationale: אֵצֶל సమీపాన్ని, ‘పక్కన/దగ్గర’ అనే సంబంధాన్ని సూచిస్తుంది. ఇక్కడ దాగోను విగ్రహం ఉద్దేశించబడి ఉండవచ్చు, కానీ మూలపాఠం కేవలం ‘దాగోను’ అంటుంది కాబట్టి అదే అస్పష్టతను నిలిపాం.
theological_decisions:
- issue: ‘దేవుని మందసం’లో దైవసూచన
  choice: దేవుని మందసం
  alternative: యెహోవా మందసం
  rationale: హీబ్రూ మూలపాఠంలో הָאֱלֹהִים ఉంది, יהוה లేదు. కాబట్టి పరిచితమైన మరో దైవనామంతో సమన్వయం చేయకుండా, ఈ వచనంలోని అసలు దైవసూచనను కాపాడాం.
- issue: ‘దాగోను’ అనే రెండవ ప్రస్తావన దేనిని సూచిస్తుంది?
  choice: దాగోను
  alternative: దాగోను విగ్రహం
  rationale: ఆలయ సందర్భం వల్ల విగ్రహమే ఉద్దేశమై ఉండే అవకాశం ఉన్నా, మూలపాఠం ‘విగ్రహం’ అని స్పష్టంగా చెప్పదు. అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. హీబ్రూ వావ్-క్రమాన్ని సహజ తెలుగులో ‘అప్పుడు… తీసుకొని… తెచ్చి… ఉంచారు’గా వ్యక్తపరిచాం.
