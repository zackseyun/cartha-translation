  edition: WLC
  text: וְ/הָֽ/אֲנָשִׁים֙ אֲשֶׁ֣ר לֹא מֵ֔תוּ הֻכּ֖וּ ב/עפלים וַ/תַּ֛עַל שַֽׁוְעַ֥ת הָ/עִ֖יר הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/012.yaml
  text: And the men who did not die were struck with tumors[a], and the cry of the city went up to heaven.
translation:
  language: te
  text: చనిపోకుండా మిగిలిన పురుషులు కణితులతో[a] బాధించబడ్డారు; ఆ పట్టణపు మొర ఆకాశం వరకు ఎగసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వాపులతో’; హీబ్రూ పదం శరీరంపై ఏర్పడే వాపు లేదా కణితిని సూచిస్తుంది. సంప్రదాయ అనువాదాల్లో కొన్నిసార్లు ‘మూలవ్యాధి’ అని నిర్దిష్టంగా అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים אֲשֶׁר לֹא מֵתוּ
  choice: చనిపోకుండా మిగిలిన పురుషులు
  rationale: అక్షరార్థంగా ‘చనిపోని పురుషులు’; సందర్భంలో మరణించకుండా మిగిలినవారిని సూచిస్తున్నందున ఈ రూపం సహజమైన తెలుగులో ఆ వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הֻכּוּ
  choice: బాధించబడ్డారు
  rationale: נכה యొక్క హోఫల్ రూపం ఇక్కడ వ్యాధి దెబ్బకు గురికావడాన్ని సూచిస్తుంది. ‘కొట్టబడ్డారు’ అనే అక్షరార్థ రూపం తెలుగులో శారీరక దెబ్బగా తప్పుగా అర్థమయ్యే అవకాశం ఉన్నందున, నిష్క్రియ భావాన్ని నిలుపుతూ ‘బాధించబడ్డారు’ అని అనువదించాం.
- source_word: בָעֳפָלִים
  choice: కణితులతో
  rationale: ఈ పదం శరీరంపై ఏర్పడే వాపులు లేదా కణితులను సూచిస్తుంది; ఖచ్చితమైన వైద్య నిర్ధారణను మూలపాఠం ఇవ్వదు. అందువల్ల అతిగా నిర్దిష్టం చేయని ‘కణితులు’ ఎంచుకుని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: שַׁוְעַת הָעִיר
  choice: ఆ పట్టణపు మొర
  rationale: שַׁוְעָה సహాయం కోరే వేదనాభరితమైన కేక లేదా మొర. నిర్మాణ సంబంధాన్ని నేరుగా నిలుపుతూ ‘పట్టణపు మొర’ అని ఇచ్చాం.
- source_word: וַתַּעַל ... הַשָּׁמָיִם
  choice: ఆకాశం వరకు ఎగసింది
  rationale: עלה లోని పైకి వెళ్లే స్పష్టమైన చిత్రాన్ని ‘ఎగసింది’ నిలుపుతుంది. గమ్యాన్ని తెలుగులో సహజంగా ‘ఆకాశం వరకు’ అని వ్యక్తపరిచాం.
theological_decisions:
- issue: మొర ఆకాశానికి ఎగసిందనే వాక్యం దేవుడు దానిని ఆలకించాడని స్పష్టంగా చెబుతుందా?
  choice: ఆ పట్టణపు మొర ఆకాశం వరకు ఎగసింది
  alternative: ఆ పట్టణపు మొర దేవునికి చేరింది
  rationale: మూలపాఠం ‘ఆకాశం’ అని మాత్రమే చెబుతుంది; దేవుడు ఆలకించాడనే భావం సూచితమై ఉండవచ్చుగాని స్పష్టంగా పేర్కొనబడలేదు. అందువల్ల ఆ సూచనను వ్యాఖ్యానంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘మొర’ వేదనతో కూడిన సహాయ పిలుపును సంక్షిప్తంగా వ్యక్తపరుస్తుంది; ‘కణితులు’ మూలంలోని వైద్య అస్పష్టతను కాపాడుతుంది.
