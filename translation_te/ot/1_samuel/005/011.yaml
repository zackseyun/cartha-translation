  text: וַ/יִּשְׁלְח֨וּ וַ/יַּאַסְפ֜וּ אֶת כָּל סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּֽאמְרוּ֙ שַׁלְּח֞וּ אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ וְ/יָשֹׁ֣ב לִ/מְקֹמ֔/וֹ וְ/לֹֽא יָמִ֥ית אֹתִ֖/י וְ/אֶת עַמִּ֑/י כִּֽי הָיְתָ֤ה מְהֽוּמַת מָ֨וֶת֙ בְּ/כָל הָ/עִ֔יר כָּבְדָ֥ה מְאֹ֛ד יַ֥ד הָ/אֱלֹהִ֖ים שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
translation:
  language: te
  text: కాబట్టి వారు ఫిలిష్తీయుల అధిపతులందరికీ కబురు పంపి వారిని సమకూర్చారు. వారు, “ఇశ్రాయేలు దేవుని మందసాన్ని పంపించివేయండి; అది తన స్థలానికి తిరిగి వెళ్లనివ్వండి, అది నన్నూ నా ప్రజలనూ చంపకుండా ఉండేలా” అన్నారు.[a] ఎందుకంటే పట్టణమంతటా ప్రాణాంతకమైన కలవరం ఉంది; అక్కడ దేవుని చెయ్యి ఎంతో భారంగా ఉంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ఇక్కడ “నన్నూ నా ప్రజలనూ” అని ఏకవచనం ఉంది; బహుశా పట్టణ పాలకుడు లేదా ఒక ప్రతినిధి మాట్లాడుతున్నాడు.
    reason: textual_feature
  - marker: b
    text: “దేవుని చెయ్యి ఎంతో భారంగా ఉంది” అనేది దేవుని తీవ్రమైన శిక్షాకార్యాన్ని సూచించే రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల అధిపతులు
  rationale: స్వతంత్ర ఫిలిష్తీయ పట్టణాల గుర్తింపు పొందిన పాలకులను సూచించే రాజకీయ బిరుదును సహజమైన ఆధునిక తెలుగులో ‘అధిపతులు’గా అందిస్తుంది.
- source_word: שַׁלְּחוּ
  choice: పంపించివేయండి
  rationale: మందసాన్ని కేవలం పంపడం కాక తమ పట్టణం నుంచి తొలగించి పంపాలనే ఆజ్ఞార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుని మందసం
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని, మందసం ఇశ్రాయేలు దేవునికి చెందినదనే భావాన్ని కాపాడుతుంది.
- source_word: וְיָשֹׁב לִמְקֹמוֹ
  choice: అది తిరిగి తన స్థలానికి వెళ్లనివ్వండి
  rationale: ఆజ్ఞను అనుసరించే అనుమతి/ఆకాంక్షార్థక క్రియాభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא יָמִית אֹתִי וְאֶת עַמִּי
  choice: లేకపోతే అది నన్నూ నా ప్రజలనూ చంపుతుంది
  rationale: מות హిఫీల్ రూపంలోని ‘చంపు’ అనే కారణార్థాన్ని, అలాగే హీబ్రూలో ఉన్న ఏకవచన ‘నన్ను/నా’ రూపాలను నిలుపుతుంది; తెలుగులో ఉద్దేశించిన నివారణ భావాన్ని ‘లేకపోతే’ సహజంగా తెలియజేస్తుంది.
- source_word: מְהוּמַת מָוֶת
  choice: ప్రాణాంతకమైన కలవరం
  rationale: మరణంతో ముడిపడిన తీవ్రమైన భీతి, గందరగోళం రెండింటినీ ఈ పదబంధం వ్యక్తం చేస్తుంది; మూలంలోని గాఢతను అతిగా నిర్దిష్టం చేయదు.
- source_word: בְּכָל הָעִיר
  choice: పట్టణమంతటా
  rationale: పట్టణమంతా వ్యాపించిన స్థితిని సంక్షిప్తమైన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  choice: దేవుని చెయ్యి ఎంతో భారంగా ఉంది
  rationale: దైవిక క్రియాశక్తి మరియు తీర్పును సూచించే ప్రధాన బైబిలీయ రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవుని చెయ్యి’ అనే మానవరూప రూపకాన్ని నిలపాలా, లేక దైవిక శిక్షగా విప్పి చెప్పాలా
  choice: ‘దేవుని చెయ్యి ఎంతో భారంగా ఉంది’ అని రూపకాన్ని నిలిపాం.
  alternative: దేవుడు అక్కడివారిని తీవ్రంగా శిక్షించాడు.
  rationale: హీబ్రూ పాఠం ‘చెయ్యి’ అనే రూపకాన్ని స్పష్టంగా ఉపయోగిస్తుంది. దానిని నిలపడం దైవిక కార్యసాధకత, తీర్పు అనే భావాలను మరియు సంబంధిత బైబిలీయ ప్రతిధ్వనులను కాపాడుతుంది.
- issue: సమావేశమైనవారు అనేకమంది అయినా ప్రత్యక్ష వాక్యంలో ఉన్న ఏకవచన సర్వనామాలను ఎలా అందించాలి
  choice: ‘నన్నూ నా ప్రజలనూ’ అనే ఏకవచనాన్ని నిలిపాం.
  alternative: ‘మమ్మల్నీ మా ప్రజలనూ’ అని సందర్భానుసారంగా బహువచనం చేయడం.
  rationale: మసొరెటిక్ హీబ్రూ పాఠంలో ఏకవచన ప్రత్యయాలు ఉన్నాయి; అవి పట్టణ పాలకుడు లేదా ప్రతినిధి మాట్లాడుతున్నాడని సూచించవచ్చు. బహువచనంగా సవరించడం మూలంలోని గమనించదగిన లక్షణాన్ని చెరిపేస్తుంది.
- issue: మందసమే ‘చంపుతుంది’ అనే వ్యాకరణ రూపాన్ని దైవిక కార్యసాధకతగా మార్చాలా
  choice: మూలంలోని వ్యాకరణ సంబంధాన్ని అనుసరించి మందసాన్నే కర్తగా ఉంచాం.
  alternative: ఇశ్రాయేలు దేవుడు నన్నూ నా ప్రజలనూ చంపకుండా ఉండాలి.
  rationale: సమీప ఏకవచన కర్తగా మందసం సహజంగా గ్రహించబడుతుంది. పాఠం మందసాన్ని దేవుని సన్నిధి/శక్తితో అనుసంధానించినా, దానిని వివరణాత్మకంగా దేవుడే కర్త అని మార్చడం మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘మందసం’, ‘దేవుని చెయ్యి’ వంటి స్థిరమైన బైబిలీయ పదప్రయోగాలను నిలిపి, అరుదైన లేదా పాతబడిన వాక్యనిర్మాణాన్ని నివారించాం. ప్రధాన పాఠంలోని [a], [b] సూచికలు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
