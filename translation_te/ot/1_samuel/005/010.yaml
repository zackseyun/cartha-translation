source:
  edition: WLC
  text: וַֽ/יְשַׁלְּח֛וּ אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים עֶקְר֑וֹן וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן הָ/אֱלֹהִים֙ עֶקְר֔וֹן וַ/יִּזְעֲק֨וּ הָֽ/עֶקְרֹנִ֜ים לֵ/אמֹ֗ר הֵסַ֤בּוּ אֵלַ/י֙ אֶת אֲרוֹן֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לַ/הֲמִיתֵ֖/נִי וְ/אֶת עַמִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: te
  text: కాబట్టి వారు దేవుని మందసాన్ని ఎక్రోనుకు పంపించారు. అయితే దేవుని మందసం ఎక్రోనుకు వచ్చినప్పుడు, ఎక్రోను ప్రజలు కేకలు వేస్తూ, “నన్నూ నా ప్రజలనూ చంపడానికి ఇశ్రాయేలు దేవుని మందసాన్ని నా దగ్గరికి తిప్పి పంపించారు!” అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ఇక్కడ “నా దగ్గరికి,” “నన్ను,” “నా ప్రజలను” అనే ఏకవచన రూపాలు ఉన్నాయి; ఎక్రోను ప్రజలు సమూహంగా కేకలు వేసినా వారి పట్టణాన్ని ఒక వ్యక్తిగా భావించి మాట్లాడినట్లు ఉండవచ్చు.
    reason: సమూహ కర్త తర్వాత వచ్చే అసాధారణ ఏకవచన సర్వనామాలను పాఠకుడికి తెలియజేస్తూ, వాటి అర్థాన్ని ఖచ్చితంగా నిర్ణయించకుండా ఉంచుతుంది.
lexical_decisions:
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: ‘మందసం’ పవిత్ర ఒడంబడిక పెట్టెను సూచించే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం; హీబ్రూ నిర్మాణాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: עֶקְרוֹן / הָעֶקְרֹנִים
  choice: ఎక్రోను / ఎక్రోను ప్రజలు
  rationale: స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, ప్రజలను సూచించే రూపాన్ని సహజమైన తెలుగులో ఇచ్చాం.
- source_word: הֵסַבּוּ אֵלַי
  choice: నా దగ్గరికి తిప్పి పంపించారు
  rationale: ‘చుట్టూ తిప్పడం/దారి మళ్లించడం’ అనే causative భావాన్ని కాపాడుతూ, ముందు పట్టణాలనుంచి మందసం ఎక్రోనుకు మళ్లించబడిన సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: לַהֲמִיתֵנִי וְאֶת־עַמִּי
  choice: నన్నూ నా ప్రజలనూ చంపడానికి
  rationale: మసొరేటిక్ పాఠంలోని ఏకవచన ప్రత్యయాలను యథాతథంగా నిలుపుతుంది; పట్టణం లేదా దాని ప్రతినిధి సమూహవాచకంగా మాట్లాడుతున్న ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ఎక్రోను ప్రజల సమూహ కేకలో ఏకవచన సర్వనామాలు
  choice: “నన్నూ నా ప్రజలనూ”
  alternative: “మమ్మల్నీ మా ప్రజలనూ”
  rationale: హీబ్రూ పాఠంలో אֵלַי, הֲמִיתֵנִי, עַמִּי అన్నీ ఏకవచన రూపాలు. సహజీకరణ కోసం బహువచనంగా మార్చకుండా మూలపాఠంలోని అసాధారణ సమూహ-ఏకవచన ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘అయితే’ ద్వారా సంఘటన ఎక్రోనుకు చేరగానే వచ్చిన ప్రతికూల మలుపు సహజంగా వ్యక్తమైంది. ప్రత్యక్ష వాక్యంలో మూలంలోని ఏకవచన రూపాలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
