  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
translation:
  language: te
  text: అందువల్ల దాగోను యాజకులూ, అష్డోదులోని దాగోను మందిరంలోకి ప్రవేశించే వారందరూ, నేటివరకు దాగోను గడపపై అడుగు పెట్టరు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దాగోను గడపపై కాలు మోపరు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “దాగోను ఇల్లు”; సందర్భంలో అది అన్యదేవత ఆరాధనా స్థలం కాబట్టి ఇక్కడ “మందిరం” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందువల్ల
  rationale: ముందటి సంఘటనవల్ల ఏర్పడిన ఆచారాన్ని కారణ-ఫల సంబంధంతో సహజంగా తెలియజేస్తుంది.
- source_word: לֹא יִדְרְכוּ
  choice: అడుగు పెట్టరు
  rationale: דרך అనే క్రియలోని ‘తొక్కు/అడుగు పెట్టు’ భావాన్ని గడప సందర్భంలో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֹהֲנֵי דָגוֹן
  choice: దాగోను యాజకులు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని స్పష్టంగా, మతాచార సందర్భానికి తగిన పదంతో అందిస్తుంది.
- source_word: וְכָל הַבָּאִים בֵּית דָּגוֹן
  choice: దాగోను మందిరంలోకి ప్రవేశించే మరెవరైనా
  rationale: ‘దాగోను ఇంటిలోకి వచ్చేవారందరూ’ అనే మూలార్థాన్ని, ఇది అన్యదేవత ఆరాధనా స్థలమనే సందర్భాన్ని బట్టి సహజంగా అందిస్తుంది; ‘మరెవరైనా’ యాజకులతోపాటు మిగతా ప్రవేశకులందరినీ సూచిస్తుంది.
- source_word: עַל מִפְתַּן דָּגוֹן
  choice: దాగోను గడపపై
  rationale: מִפְתָּן యొక్క ‘గడప/ద్వారపు అంచు’ అర్థాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: בְּאַשְׁדּוֹד
  choice: అష్డోదులోని
  rationale: మందిరం ఉన్న ప్రదేశాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో తెలియజేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: కథకుని కాలం వరకు కొనసాగిన ఆచారాన్ని సహజంగా సూచిస్తుంది.
