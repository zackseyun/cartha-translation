source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּקֶר֮ מִֽ/מָּחֳרָת֒ וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וְ/רֹ֨אשׁ דָּג֜וֹן וּ/שְׁתֵּ֣י כַּפּ֣וֹת יָדָ֗י/ו כְּרֻתוֹת֙ אֶל הַ/מִּפְתָּ֔ן רַ֥ק דָּג֖וֹן נִשְׁאַ֥ר עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/004.yaml
  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
translation:
  language: te
  text: మరుసటి రోజు తెల్లవారుజామున వారు లేచినప్పుడు, ఇదిగో, దాగోను యాహ్వే మందసం ఎదుట ముఖం నేలమీద ఉంచి పడివున్నాడు. దాగోను తల, అతని రెండు అరచేతులు నరికివేయబడి గడపపై పడి ఉన్నాయి; దాగోను మాత్రమే మిగిలి ఉన్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దాగోను మాత్రమే అతనిమీద మిగిలి ఉన్నాడు” అని ఉంది. ఈ క్లిష్టమైన వాక్యభాగం, తల మరియు చేతులు నరికివేయబడిన తరువాత విగ్రహం శరీరభాగం మాత్రమే మిగిలిందని బహుశా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר מִמָּחֳרָת
  choice: మరుసటి రోజు తెల్లవారుజామున వారు లేచి చూసినప్పుడు
  rationale: మరుసటి ఉదయం వారు పెందలకడనే లేచారనే కాలసూచనను, తదుపరి వారు కనుగొన్న దృశ్యంతో సహజమైన తెలుగు వాక్యనిర్మాణంలో కలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అనూహ్యంగా కనిపించిన దృశ్యాన్ని సూచించే ఆశ్చర్యభరితమైన కథన సూచికను నిలుపుతుంది.
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  choice: ముఖం నేలకు ఆనించి పడివున్నాడు
  rationale: వారు వచ్చినప్పుడు విగ్రహం అప్పటికే నేలపై బోర్లా పడివున్న స్థితిని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: యాహ్వే మందసం ఎదుట
  rationale: స్థానార్థాన్ని నేరుగా తెలియజేస్తూ, אֲרוֹן అనే పవిత్ర పెట్టెకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘మందసం’ను ఉపయోగిస్తుంది.
- source_word: וּשְׁתֵּי כַּפּוֹת יָדָיו
  choice: అతని రెండు అరచేతులు
  rationale: כַּפּוֹת అనే పదంలోని ‘అరచేతులు’ అనే నిర్దిష్ట భావాన్నీ, రెండింటినీ సూచించే సంఖ్యనూ కాపాడుతుంది.
- source_word: כְּרֻתוֹת אֶל הַמִּפְתָּן
  choice: నరికివేయబడి గడప మీద పడి ఉన్నాయి
  rationale: తల, అరచేతులు వేరుచేయబడిన స్థితినీ అవి గడప వద్ద ఉన్న స్థానాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רַק דָּגוֹן נִשְׁאַר עָלָיו
  choice: దాగోను మాత్రమే అతనిపై మిగిలివున్నాడు
  rationale: క్లిష్టమైన హీబ్రూ వాక్యాన్ని వ్యాఖ్యానాత్మకంగా ‘మొండెం’ అని మార్చకుండా దగ్గరగా అనువదించి, దాని సంభావ్య భావాన్ని పాదసూచికలో వివరిస్తుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణను తెలుగు లిపిలో అందిస్తుంది.
- issue: దాగోను పడివుండడం యొక్క భంగిమ
  choice: ముఖం నేలకు ఆనించి
  alternative: నేలపై పడివున్నాడు
  rationale: మందసం ఎదుట విగ్రహం బోర్లా పడివున్న అవమానకర భంగిమను సందర్భానుసారంగా వ్యక్తపరుస్తుంది; అయితే ఆ సంఘటనకు అదనపు సిద్ధాంతార్థాన్ని జోడించదు.
- issue: చివరి క్లిష్టమైన వాక్యభాగం
  choice: దాగోను మాత్రమే అతనిపై మిగిలివున్నాడు
  alternative: దాగోను మొండెం మాత్రమే మిగిలింది
  rationale: ‘మొండెం’ అనేది సందర్భానికి సరిపోయే సంభావ్య వివరణ అయినప్పటికీ మూలంలో స్పష్టంగా లేదు. అందువల్ల ప్రధాన పాఠంలో అస్పష్టతను నిలిపి, వివరణను పాదసూచికకు పరిమితం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే కథన శైలి వాడబడింది. ‘ఇదిగో’ ఆశ్చర్య సూచనను నిలుపుతుంది. ‘మందసం’ తెలుగు బైబిలు సందర్భంలో సుపరిచితమైన పదం; చివరి హీబ్రూ వాక్యంలోని నిజమైన అస్పష్టతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
