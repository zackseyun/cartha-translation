id: 1SA.5.3
reference: 1 Samuel 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֤מוּ אַשְׁדּוֹדִים֙ מִֽ/מָּחֳרָ֔ת וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וַ/יִּקְחוּ֙ אֶת דָּג֔וֹן וַ/יָּשִׁ֥בוּ אֹת֖/וֹ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: te
  text: అష్దోదువారు మరుసటి రోజు ఉదయాన్నే లేచినప్పుడు, ఇదిగో, దాగోను యహ్వే మందసం ఎదుట నేలమీద బోర్లా పడి ఉన్నాడు. అప్పుడు వారు దాగోనును తీసుకొని, అతణ్ణి తిరిగి అతని స్థానంలో ఉంచారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: ఉదయాన్నే లేచినప్పుడు
  rationale: హిఫీల్ రూపం ‘పొద్దున్నే లేవడం’ అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా కాలసూచనను స్పష్టంగా నిలిపింది.
- source_word: אַשְׁדּוֹדִים
  choice: అష్దోదువారు
  rationale: ఇది అష్దోదు నివాసులను సూచించే బహువచన జాతివాచకం. ‘అష్దోదువారు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: తరువాతి దినాన్ని సూచించే సాధారణ కాలవ్యక్తీకరణ.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అనుకోకుండా కనిపించిన ఆశ్చర్యకర దృశ్యంపై దృష్టి నిలిపే హీబ్రూ కథన బలాన్ని కాపాడుతుంది.
- source_word: נֹפֵל
  choice: పడి ఉన్నాడు
  rationale: వారు చూసే సమయానికే దాగోను పడిపోయి ఉన్న స్థితిని భాగధాతువు వివరిస్తుంది. తెలుగు స్థితివాచక ప్రయోగం దీనిని సహజంగా తెలియజేస్తుంది.
- source_word: לְפָנָיו אַרְצָה
  choice: నేలమీద బోర్లా
  rationale: ముఖం నేలవైపు ఉండే అవమానకరమైన భంగిమను సహజమైన, స్పష్టమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: యహ్వే మందసం ఎదుట
  rationale: స్థానసంబంధమైన ‘ఎదుట’ అనే అర్థాన్ని నేరుగా ఇస్తూ, אֲרוֹן‌ను సందర్భానుకూలమైన ‘మందసం’గా అనువదించింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో మార్చకుండా, హీబ్రూ చతురక్షర నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఉంచింది.
- source_word: וַיִּקְחוּ אֶת־דָּגוֹן
  choice: వారు దాగోనును తీసి
  rationale: לקח అనే సాధారణ క్రియలోని ‘తీసుకోవడం’ భావాన్ని అదనపు వివరణ లేకుండా నిలిపింది.
- source_word: וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  choice: అతణ్ణి తిరిగి అతని స్థానంలో ఉంచారు
  rationale: హిఫీల్ రూపంలోని ‘తిరిగి చేర్చడం/ఉంచడం’ భావాన్ని సహజమైన తెలుగులో ఇస్తుంది. దాగోనును సూచించే పుంలింగ సర్వనామాలను కూడా కాపాడింది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామమే ఉంది. కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపంగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- issue: దాగోనుకు పుంలింగ సూచన
  choice: ఉన్నాడు; అతణ్ణి; అతని
  alternative: ఉంది; దానిని; దాని
  rationale: హీబ్రూ పాఠం దాగోనుకు పుంలింగ ప్రత్యయాలను వాడుతుంది. అది దేవతనూ దాని ప్రతిమనూ సందర్భంలో కలిపి సూచించగల అస్పష్టతను ‘విగ్రహం’ అని చేర్చి పరిష్కరించకుండా పుంలింగ రూపాలతో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకుడికి స్పష్టంగా ఉండే వాక్యనిర్మాణం. ఆశ్చర్యసూచకమైన ‘ఇదిగో’ను నిలిపి, ‘బోర్లా’ ద్వారా దృశ్యాన్ని సహజంగా, సజీవంగా అందించాం.
