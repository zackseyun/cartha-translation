id: 1SA.5.6
reference: 1 Samuel 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּכְבַּ֧ד יַד יְהוָ֛ה אֶל הָ/אַשְׁדּוֹדִ֖ים וַ/יְשִׁמֵּ֑/ם וַ/יַּ֤ךְ אֹתָ/ם֙ ב/עפלים אֶת אַשְׁדּ֖וֹד וְ/אֶת גְּבוּלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
translation:
  language: te
  text: యాహ్వే చెయ్యి అష్డోదు ప్రజల మీద భారంగా పడింది. ఆయన వారిని పాడుచేసి, అష్డోదునూ దాని ప్రాంతాన్నీ కణితులతో[a] బాధించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాపులతో”; సంప్రదాయంగా కొందరు దీనిని మరింత నిర్దిష్టంగా “మొలలతో” అని అనువదిస్తారు.
    reason: మూలపదం శరీర వాపులు లేదా కణితులను సూచిస్తుంది; ‘మొలలు’ అనేది సాధ్యమైనప్పటికీ నిశ్చయంగా చెప్పలేని మరింత నిర్దిష్టమైన వ్యాఖ్యానం.
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  choice: యాహ్వే చెయ్యి ... భారంగా పడింది
  rationale: హెబ్రీయ భాషలోని స్పష్టమైన ‘చెయ్యి’ రూపకాన్నీ, ‘భారంగా’ అనే తీర్పు/బలప్రయోగ భావాన్నీ నిలుపుతూ సహజమైన ఆధునిక తెలుగు ప్రయోగాన్ని ఉపయోగించింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ధ్వన్యంతరీకరణను తెలుగులో ఇచ్చింది.
- source_word: אֶל הָאַשְׁדּוֹדִים
  choice: అష్డోదు ప్రజల మీద
  rationale: ఈ రూపం పట్టణాన్ని మాత్రమే కాక దాని నివాసులను సూచిస్తుంది; సందర్భంలోని ప్రతికూల దిశను ‘మీద’ సహజంగా తెలియజేస్తుంది.
- source_word: וַיְשִׁמֵּם
  choice: ఆయన వారిని పాడుచేసి
  rationale: క్రియలోని నాశనకరమైన విధ్వంస భావాన్ని, అందరూ అర్థం చేసుకోగల సహజ తెలుగులో వ్యక్తం చేసింది; పూర్తిగా చంపేశాడనే అవసరంలేని భావాన్ని నివారించింది.
- source_word: וַיַּךְ אֹתָם
  choice: వారిని ... బాధించాడు
  rationale: వ్యాధితో కొట్టడం అనే సందర్భార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని దైవిక దెబ్బ/తీర్పు భావం వ్యాధి ఫలితంలో నిలుస్తుంది.
- source_word: בָּעֳפָלִים
  choice: కణితులతో
  rationale: ఈ పదం శరీరంపై వచ్చే వాపులు లేదా కణితులను సూచించగలదు. ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం కాని అర్థాన్ని ఎంచుకుని, ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచింది.
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  choice: అష్డోదునూ దాని ప్రాంతాన్నీ
  rationale: తీర్పు పట్టణానికే పరిమితం కాక దాని అధీన లేదా చుట్టుపక్కల ప్రాంతానికీ వ్యాపించిందనే పరిధిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: ఇశ్రాయేలు దేవుని వ్యక్తిగత నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యాహ్వే’ మూలనామానికి సమీపమైన ఆధునిక ధ్వన్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా రాయబడింది. ‘చెయ్యి ... భారంగా పడింది’ అనే మూల రూపకాన్ని నిలిపి, మిగతా వాక్యాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ఇచ్చింది. ‘కణితులు’ అనే విస్తృత పదంతో మూలంలోని వైద్యపరమైన అనిశ్చితిని కాపాడింది.
