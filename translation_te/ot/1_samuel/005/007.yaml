source:
  edition: WLC
  text: וַ/יִּרְא֥וּ אַנְשֵֽׁי אַשְׁדּ֖וֹד כִּֽי כֵ֑ן וְ/אָמְר֗וּ לֹֽא יֵשֵׁ֞ב אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ עִמָּ֔/נוּ כִּֽי קָשְׁתָ֤ה יָד/וֹ֙ עָלֵ֔י/נוּ וְ/עַ֖ל דָּג֥וֹן אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
translation:
  language: te
  text: అది అలా ఉందని అష్డోదు మనుషులు చూసినప్పుడు[a], “ఇశ్రాయేలు దేవుని మందసం మన దగ్గర ఉండకూడదు[b], ఎందుకంటే ఆయన చేయి మన మీదా, మన దేవుడైన దాగోను మీదా భారంగా ఉంది” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అది అలా ఉందని చూసి”; ఇది ముందటి వచనాల్లో వివరించిన పరిస్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఉండడం” అని అనువదించిన హెబ్రీ క్రియకు “కూర్చోవడం,” “నివసించడం,” లేదా “నిలిచి ఉండడం” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אַנְשֵׁי אַשְׁדּוֹד כִּי כֵן
  choice: అష్డోదు మనుషులు జరిగినది చూసి
  rationale: కథన క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, כִּי כֵן ముందటి సందర్భంలో జరిగిన పరిస్థితిని సూచిస్తున్నదనే భావాన్ని నిలుపుతుంది. אַנְשֵׁי అనే పుంలింగ బహువచనానికి ‘మనుషులు’ అని అనువదించాం.
- source_word: לֹא יֵשֵׁב
  choice: ఉండకూడదు
  rationale: יָשַׁב అనే క్రియకు ‘కూర్చోవడం, నివసించడం, ఉండడం’ అనే అర్థాలున్నాయి. మందసం ఒక చోట కొనసాగి ఉండడాన్ని, మాట్లాడేవారి బలమైన నిర్ణయాన్ని ‘ఉండకూడదు’ సహజంగా తెలియజేస్తుంది.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుని మందసం
  rationale: తెలుగు బైబిలు వాడుకలో ‘మందసం’ నిబంధన పెట్టెను సూచించే గౌరవప్రదమైన పదం; హెబ్రీ నిర్మాణంలోని ‘ఇశ్రాయేలు దేవుని’ అనే సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: עִמָּנוּ
  choice: మన దగ్గర
  rationale: ‘మనతో’ అనేది అక్షరార్థానికి దగ్గరైనా, మందసం ఒక ప్రదేశంలో ఉంచబడిన సందర్భంలో ‘మన దగ్గర’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: קָשְׁתָה יָדוֹ
  choice: ఆయన చెయ్యి ... భారంగా ఉంది
  rationale: దైవిక శక్తి తీవ్రమైన తీర్పుగా పనిచేస్తున్నదని తెలిపే హెబ్రీ రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా నిలుపుతుంది.
- source_word: עָלֵינוּ וְעַל דָּגוֹן אֱלֹהֵינוּ
  choice: మన మీదా, మన దేవుడైన దాగోను మీదా
  rationale: రెండు లక్ష్యాలపై ఒకే దైవిక హస్తం భారంగా ఉందనే సమాంతర నిర్మాణాన్ని నిలుపుతుంది; ‘మన దేవుడు’ అనేది ఫిలిష్తీయుల మాటల దృక్కోణాన్ని యథాతథంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: קָשְׁתָה יָדוֹ లోని దైవిక తీర్పు రూపకం
  choice: ఆయన చెయ్యి మన మీదా ... భారంగా ఉంది
  alternative: ఆయన మనలను తీవ్రంగా బాధించాడు
  rationale: దేవుని ‘చెయ్యి’ అనే మానవరూప వర్ణనను ప్రధాన పాఠ్యంలో నిలుపడం ద్వారా దేవుని క్రియాశీల తీర్పు అనే కథన ఉద్రిక్తత కాపాడబడుతుంది.
- issue: దాగోనును ‘మన దేవుడు’ అని పేర్కొనడం
  choice: మన దేవుడైన దాగోను
  alternative: మన విగ్రహమైన దాగోను
  rationale: ఇది ఫిలిష్తీయులు పలికిన మాట. మూలంలోని వారి దృక్కోణాన్ని నిలుపుతూ, పాఠ్యంలో లేని వివాదాత్మక వ్యాఖ్యను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘చెయ్యి భారంగా ఉంది’ అనే మూల రూపకాన్ని నిలిపి, దాని భావాన్ని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా మార్చలేదు.
