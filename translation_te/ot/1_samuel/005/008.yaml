source:
  edition: WLC
  text: וַ/יִּשְׁלְח֡וּ וַ/יַּאַסְפוּ֩ אֶת כָּל סַרְנֵ֨י פְלִשְׁתִּ֜ים אֲלֵי/הֶ֗ם וַ/יֹּֽאמְרוּ֙ מַֽה נַּעֲשֶׂ֗ה לַֽ/אֲרוֹן֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ גַּ֣ת יִסֹּ֔ב אֲר֖וֹן אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יַּסֵּ֕בּוּ אֶת אֲר֖וֹן אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
translation:
  language: te
  text: కాబట్టి వారు దూతలను పంపి, ఫిలిష్తీయుల అధిపతులందరినీ తమ వద్దకు సమకూర్చి, “ఇశ్రాయేలు దేవుని మందసాన్ని మనం ఏమి చేయాలి?” అని అడిగారు. అందుకు వారు, “ఇశ్రాయేలు దేవుని మందసం గాతుకు వెళ్లాలి[a]” అన్నారు. అప్పుడు వారు ఇశ్రాయేలు దేవుని మందసాన్ని తరలించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు దేవుని మందసాన్ని గాతుకు తరలించండి.” హీబ్రూ క్రియ కదలికను లేదా స్థలమార్పును నొక్కిచెబుతుంది; దాన్ని ఎలా తీసుకెళ్లారో నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיַּאַסְפוּ
  choice: తమ దగ్గరికి పిలిపించి
  rationale: పంపి సమకూర్చడం అనే రెండు క్రియల కలయిక ఇక్కడ అధికారులను దూతల ద్వారా సమావేశానికి పిలిపించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పిలిపించి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల అధిపతులు
  rationale: סֶרֶן అనేది ఫిలిష్తీయ నగర పాలకుల ప్రత్యేక బిరుదు. ‘అధిపతులు’ దాని అధికారపూర్వక భావాన్ని కాపాడుతూ, వారిని రాజులుగా లేదా వంశపారంపర్య యువరాజులుగా నిర్దిష్టం చేయదు.
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  choice: మందసాన్ని మనం ఏమి చేయాలి?
  rationale: మొదటి పురుష బహువచన అసంపూర్ణ క్రియ సంప్రదింపుతో కూడిన ప్రశ్నను సూచిస్తుంది; ל అనే విభక్తి తెలుగులో సహజంగా ప్రత్యక్ష కర్మ రూపంలో వ్యక్తమవుతుంది.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుని మందసం
  rationale: నిబంధన మందసాన్ని సూచించే ఆచారబద్ధమైన, గౌరవప్రదమైన తెలుగు పదంగా ‘మందసం’ వాడబడింది; మూలంలోని సంబంధ నిర్మాణం అలాగే నిలిచింది.
- source_word: גַּת
  choice: గాతు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగులో సులభంగా పలికే సంప్రదాయ లిప్యంతరీకరణతో ఇచ్చాం.
- source_word: יִסֹּב
  choice: వెళ్లాలి
  rationale: סבב క్రియ ఇక్కడ ఒక స్థలం నుంచి మరొక స్థలానికి వెళ్లడం లేదా తరలింపబడడం అనే భావాన్ని కలిగి ఉంది. మూలంలోని క్రియ వ్యాకరణపరంగా కర్తరి రూపంలో ఉండటంతో ‘వెళ్లాలి’ దాన్ని ప్రత్యక్షంగా నిలుపుతుంది; ఖచ్చితమైన రవాణా విధానాన్ని చేర్చదు.
- source_word: וַיַּסֵּבּוּ
  choice: తరలించారు
  rationale: హిఫిల్ రూపం ‘వెళ్లేలా చేశారు’ అనే కారణార్థాన్ని ఇస్తుంది. సందర్భంలో మందసాన్ని గాతుకు పంపించిన చర్యను సహజ తెలుగులో ‘తరలించారు’ స్పష్టంగా తెలియజేస్తుంది.
