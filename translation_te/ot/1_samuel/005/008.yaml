translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని, దైవసంబంధ విషయాలకు తగిన గౌరవప్రదమైన ధోరణిని పాటించాం. ‘అధిపతులు,’ ‘మందసం’ వంటి పదాలు మూలంలోని అధికారపూర్వకతను, ఆధ్యాత్మిక సందర్భాన్ని కాపాడుతాయి. ప్రధాన పాఠంలో יִסֹּב యొక్క కర్తరి రూపాన్ని నిలిపి, సాధ్యమైన ఆజ్ఞార్థక తరలింపు భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
