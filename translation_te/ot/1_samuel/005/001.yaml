translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలో లేని కాలసూచక పదాన్ని చేర్చలేదు; హీబ్రూ వావ్ సంధి కలిగించే కథన అనుసంధానం తెలుగు వాక్యక్రమంలో సహజంగా ప్రతిఫలిస్తుంది.
