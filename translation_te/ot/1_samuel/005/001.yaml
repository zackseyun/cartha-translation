  yaml_path: translation/ot/1_samuel/005/001.yaml
  text: The Philistines had taken the ark of God and brought it from Ebenezer to Ashdod[a].
translation:
  language: te
  text: ఫిలిష్తీయులు దేవుని మందసాన్ని తీసుకొని, ఎబెనెజెరు నుండి అష్డోదుకు తీసుకువెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: వావ్ సంధిని తెలుగు కథన ప్రవాహంలో ప్రత్యేకంగా అనువదించకుండానే సహజంగా వ్యక్తపరచవచ్చు; ప్రజా సమూహపు పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: לָקְחוּ
  choice: తీసుకొని
  rationale: לקח అనే క్రియకు ప్రాథమిక అర్థమైన ‘తీసుకోవడం’ను నిలుపుతూ, తరువాతి చర్యతో సహజంగా అనుసంధానించాం. సందర్భం వారు మందసాన్ని స్వాధీనం చేసుకున్నారని సూచించినా, ఆ భావాన్ని క్రియలో అదనంగా చేర్చలేదు.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: హీబ్రూ సంబంధపద నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, ఆరాధన సంబంధమైన పవిత్ర పెట్టెకు స్థిరంగా వాడే ‘మందసం’ అనే పదాన్ని ఎంచుకున్నాం.
- source_word: וַיְבִאֻהוּ
  choice: తీసుకువచ్చారు
  rationale: בוא హిఫీల్ రూపం ‘తీసుకురావడం’ అనే భావాన్ని ఇస్తుంది; పురుష ఏకవచన ప్రత్యయం మందసాన్ని సూచిస్తుంది. తెలుగులో ఆ కర్మను మళ్లీ ప్రత్యక్షంగా చెప్పనవసరం లేదు.
- source_word: מֵאֶבֶן הָעֵזֶר
  choice: ఎబెనెజెరు నుండి
  rationale: מִן ఉపసర్గను ‘నుండి’గా అనువదించి, స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַשְׁדּוֹדָה
  choice: అష్డోదుకు
  rationale: స్థలనామానికి జతైన దిశాసూచక హే, అష్డోదు వైపు జరిగిన గమనాన్ని సూచిస్తుంది; తెలుగులో ‘-కు’తో సహజంగా వ్యక్తపరచాం.
