  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. హీబ్రూ నుడికారాల బలాన్ని నిలుపుతూ, తెలుగులో అసహజంగా ఉండే అక్షరానువాదాలను పాదటిప్పణుల్లో ఇచ్చాం.
