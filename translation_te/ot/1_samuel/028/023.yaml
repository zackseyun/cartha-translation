  text: But he refused and said[a], “I will not eat.” Yet his servants, along with the woman, urged him, and he listened to their voice[c][b]. So he rose from the ground and sat on the bed.
translation:
  language: te
  text: అయితే అతడు నిరాకరించి, “నేను తినను” అన్నాడు. కానీ అతని సేవకులూ ఆ స్త్రీయూ అతనిపై పట్టుబట్టారు[a]. అతడు వారి మాట విన్నాడు[b]. అప్పుడు అతడు నేలమీద నుంచి లేచి మంచం మీద కూర్చున్నాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిపై గట్టిగా ఒత్తిడి చేశారు.” హీబ్రూ నుడికారం పట్టుదలతో ఒత్తిడి చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతడు వారి స్వరాన్ని విన్నాడు.”
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ “మంచం” అనే మాట పడకవంటి సోఫా లేదా దివానును కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: అతడు నిరాకరిస్తూ
  rationale: מָאֵן స్పష్టమైన నిరాకరణను సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘నిరాకరించాడు/నిరాకరిస్తూ’ సహజంగా ఉంటుంది.
- source_word: לֹא אֹכַל
  choice: నేను తినను
  rationale: హీబ్రూలో లేని కర్మను చేర్చకుండా సౌలు చెప్పిన సరళమైన నిరాకరణను నిలుపుతుంది.
- source_word: וַיִּפְרְצוּ בוֹ
  choice: అతన్ని గట్టిగా బలవంతపెట్టారు
  rationale: פרץ ב అనే నుడికారం సాధారణంగా ఒకరిపై పట్టుబట్టి ఒత్తిడి చేయడాన్ని సూచిస్తుంది; ‘గట్టిగా బలవంతపెట్టారు’ దాని తీవ్రతను సాధారణ తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజసంబంధ సందర్భంలో సౌలుకు సేవచేసే పరిచారకులను సూచించడానికి ‘సేవకులు’ సముచితం; వారి చట్టబద్ధ స్థితిని అనవసరంగా నిర్ధారించదు.
- source_word: וְגַם הָאִשָּׁה
  choice: ఆ స్త్రీ కూడా
  rationale: וְגַם లోని జోడింపు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וַיִּשְׁמַע לְקֹלָם
  choice: అతడు వారి మాట విన్నాడు
  rationale: అక్షరార్థంగా ‘వారి స్వరాన్ని విన్నాడు’; తెలుగులో ‘వారి మాట విన్నాడు’ అనేది స్పందించి అంగీకరించిన భావాన్ని సహజంగా తెలియజేస్తూ, ‘విధేయుడయ్యాడు’ అనే అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: מֵהָאָרֶץ
  choice: నేలమీద నుంచి
  rationale: సౌలు పడి ఉన్న ఉపరితలాన్ని సందర్భానుగుణంగా ‘నేల’ స్పష్టంగా సూచిస్తుంది.
- source_word: וַיֵּשֶׁב אֶל הַמִּטָּה
  choice: మంచం మీద కూర్చున్నాడు
  rationale: מִטָּה మంచం లేదా పడకవంటి ఆసనాన్ని సూచించవచ్చు; ప్రధాన పాఠ్యంలో సాధారణమైన ‘మంచం’ను ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
