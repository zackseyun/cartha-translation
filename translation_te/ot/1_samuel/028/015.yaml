source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לָ֥/מָּה הִרְגַּזְתַּ֖/נִי לְ/הַעֲל֣וֹת אֹתִ֑/י וַ/יֹּ֣אמֶר שָׁ֠אוּל צַר לִ֨/י מְאֹ֜ד וּ/פְלִשְׁתִּ֣ים נִלְחָמִ֣ים בִּ֗/י וֵֽ/אלֹהִ֞ים סָ֤ר מֵֽ/עָלַ/י֙ וְ/לֹֽא עָנָ֣/נִי ע֗וֹד גַּ֤ם בְּ/יַֽד הַ/נְּבִיאִם֙ גַּם בַּ֣/חֲלֹמ֔וֹת וָ/אֶקְרָאֶ֣/ה לְ/ךָ֔ לְ/הוֹדִיעֵ֖/נִי מָ֥ה אֶעֱשֶֽׂה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
translation:
  language: te
  text: 'అప్పుడు సమూయేలు సౌలుతో, “నన్ను పైకి రప్పించి ఎందుకు కలవరపెట్టావు?[a]” అన్నాడు. సౌలు ఇలా జవాబిచ్చాడు: “నేను తీవ్రమైన కష్టంలో ఉన్నాను. ఫిలిష్తీయులు నాకు వ్యతిరేకంగా యుద్ధం చేస్తున్నారు. దేవుడు నన్ను విడిచిపోయాడు; ప్రవక్తల ద్వారా గానీ[b], కలల ద్వారా గానీ ఇక నాకు జవాబివ్వడం లేదు. అందుకే నేను ఏమి చేయాలో నాకు తెలియజేయడానికి నిన్ను పిలిచాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నన్ను పైకి రప్పించి ఎందుకు అశాంతికి గురిచేశావు?”'
    reason: רגז అనే క్రియ కలవరపరచడం, అశాంతికి గురిచేయడం అనే సమీప భావాలను కలిగి ఉంది.
  - marker: b
    text: హెబ్రీయ మూలంలో అక్షరార్థంగా, “ప్రవక్తల చేతి ద్వారా”; ఇది “ప్రవక్తల ద్వారా” అనే అర్థమిచ్చే నుడికారం.
    reason: మూలంలోని בְיַד అనే హెబ్రీయ నుడికారాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  choice: నన్ను కలవరపెట్టావు
  rationale: רגז యొక్క హిఫీల్ రూపం కలవరపరచడం, అశాంతికి గురిచేయడం అనే భావాన్ని ఇస్తుంది. ‘కలవరపెట్టావు’ సందర్భానికి సహజంగా ఉండి, సంఘటన స్వరూపాన్ని మించి వివరణ జోడించదు.
- source_word: לְהַעֲלוֹת אֹתִי
  choice: నన్ను పైకి రప్పించి
  rationale: עלה లోని ‘పైకి’ అనే దిశాత్మక చిత్రణను నిలుపుతుంది. ‘లేపి’ అనడం పునరుత్థాన భావాన్ని అనవసరంగా సూచించే అవకాశం ఉండడంతో నివారించబడింది.
- source_word: צַר לִי מְאֹד
  choice: నేను తీవ్రమైన కష్టంలో ఉన్నాను
  rationale: సౌలు అనుభవిస్తున్న తీవ్రమైన ఇబ్బంది, ఒత్తిడి, వేదనను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: נִלְחָמִים בִּי
  choice: నాతో యుద్ధం చేస్తున్నారు
  rationale: לחם עם ב యొక్క శత్రుత్వపూర్వక సైనిక చర్యను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; భావపరంగా ‘నాకు వ్యతిరేకంగా’ అని అర్థం.
- source_word: וֵאלֹהִים סָר מֵעָלַי
  choice: దేవుడు నన్ను విడిచిపోయాడు
  rationale: סור מעל లోని దూరమవడం లేదా ఉపసంహరించుకోవడం అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది; వాక్యం చెప్పేదానికంటే ఎక్కువ తాత్త్విక నిర్ధారణ చేయదు.
- source_word: וְלֹא עָנָנִי עוֹד
  choice: ఇక నాకు జవాబివ్వడం లేదు
  rationale: עוד తో కూడిన ప్రతిషేధం గతంలో ఉండిన స్పందన ఇప్పుడు కొనసాగడం లేదనే భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: גַּם בְּיַד הַנְּבִיאִם
  choice: ప్రవక్తల ద్వారా గానీ
  rationale: ‘ప్రవక్తల చేతి ద్వారా’ అనే హెబ్రీయ నుడికారంలో בְיַד సాధనాన్ని లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. తెలుగులో ‘ద్వారా’ దాని సహజ సమానార్థకం.
- source_word: גַּם בַּחֲלֹמוֹת
  choice: కలల ద్వారా గానీ
  rationale: גם ... גם జతను తెలుగులో ‘గానీ ... గానీ’గా సహజంగా వ్యక్తపరచి, దైవిక జవాబు వచ్చే రెండవ మార్గాన్ని నిలుపుతుంది.
- source_word: וָאֶקְרָאֶה לְךָ
  choice: అందుకే ... నిన్ను పిలిచాను
  rationale: קרא לְ ఇక్కడ పిలవడం లేదా రప్పించుకోవడం అనే భావాన్ని ఇస్తుంది. ‘పిలిచాను’ మూలానికి దగ్గరగా ఉండి, మూలంలో లేని సాంకేతిక క్షుద్రవిద్యా పదాన్ని చేర్చదు.
- source_word: לְהוֹדִיעֵנִי
  choice: నాకు తెలియజేయడానికి
  rationale: ידע హిఫీల్ యొక్క ‘తెలియజేయు’ అనే కారణార్థక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מָה אֶעֱשֶׂה
  choice: నేను ఏమి చేయాలో
  rationale: ‘నేను ఏమి చేయాలి?’ అనే ప్రత్యక్ష ప్రశ్నను ఉద్దేశ్యార్థక పరోక్ష వాక్యంలో సహజమైన తెలుగుగా అందిస్తుంది.
theological_decisions:
- issue: మృతులను సంప్రదించే ఈ కథనంలో సమూయేలు ఎవరు లేదా ఆయన స్థితి ఏమిటి?
  choice: మూల కథనం చెప్పినట్లే ‘సమూయేలు ... అన్నాడు’ అని నేరుగా అనువదించడం.
  alternative: అతడు వేషధారి ఆత్మ అని, కేవలం మాధ్యమానికి కనిపించిన రూపమని, లేదా ‘సమూయేలు అనబడినవాడు’ అని వ్యాఖ్యాత్మకంగా అనువదించడం.
  rationale: హెబ్రీయ వచనం నేరుగా సమూయేలు సౌలుతో మాట్లాడినట్లు పేర్కొంటుంది. అనువాదం ఆ కథన రూపాన్ని నిలుపుతూ, సంఘటన స్వరూపంపై ఉన్న విస్తృత తాత్త్విక వివాదాన్ని ఈ వచనంలోనే తీర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘పైకి రప్పించి’ మూలంలోని స్థలచిత్రణను నిలుపుతుంది; ‘పిలిచాను’ మూలంలో లేని క్షుద్రవిద్యా సాంకేతికతను జోడించదు. ప్రధాన పాఠ్యంలో [a], [b] గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
