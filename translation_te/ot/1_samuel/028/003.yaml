base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
translation:
  language: te
  text: సమూయేలు అప్పటికే చనిపోయాడు. ఇశ్రాయేలీయులందరూ అతని కోసం దుఃఖించి, అతని స్వస్థలమైన రామాలో అతన్ని పాతిపెట్టారు. సౌలు మాధ్యములను, ఆత్మవాదులను[a] దేశం నుండి తొలగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ రెండు హీబ్రూ పదాల ఖచ్చితమైన తేడా స్పష్టంగా లేదు. వీటిని “మృతాత్మ మాధ్యములు, ఆత్మలను సంప్రదించే వారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת
  choice: చనిపోయాడు
  rationale: సందర్భంలో ఇది తరువాతి కథనానికి ముందే జరిగిన విషయాన్ని నేపథ్యంగా గుర్తుచేస్తుంది. తెలుగులో సహజమైన భూతకాల రూపమే ఆ క్రమాన్ని సందర్భం ద్వారా తెలియజేస్తుంది.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: అతని కోసం దుఃఖించి
  rationale: ספד అంత్యక్రియలకు సంబంధించిన బహిరంగ శోకాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం స్వరంతో విలపించారని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: సామూహిక జాతీయ పదబంధాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: וַיִּקְבְּרֻהוּ
  choice: అతన్ని పాతిపెట్టారు
  rationale: קבר అనే క్రియకు నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: בָרָמָה וּבְעִירוֹ
  choice: అతని సొంత పట్టణమైన రామాలో
  rationale: హీబ్రూ పదక్రమంలో రామా మరియు అతని పట్టణం ఒకే స్థలాన్ని వివరిస్తాయి; తెలుగులో విశేషణాత్మక నిర్మాణం ఆ అనుబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הֵסִיר
  choice: తొలగించాడు
  rationale: ఆచరణలో అది బహిష్కరణనా, నిషేధమా, అణచివేతనా అని నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: הָאֹבוֹת
  choice: చనిపోయినవారి ఆత్మలను సంప్రదించే వారు
  rationale: אוֹב ఇక్కడ మృతులతో సంప్రదింపులు జరిపే మాధ్యమాలుగా వ్యవహరించే వ్యక్తులను సూచిస్తుంది; ఆధునిక తెలుగులో అర్థం వెంటనే గ్రహించేందుకు వివరణాత్మకంగా అనువదించబడింది.
- source_word: הַיִּדְּעֹנִים
  choice: కర్ణపిశాచాల వారు
  rationale: יִדְּעֹנִי అనే నిగూఢ విద్యాసంబంధ పదానికి సంప్రదాయ తెలుగు బైబిలు పదజాలంలో గుర్తించదగిన సమానార్థకం; ఖచ్చిత వర్గీకరణ అనిశ్చితిని పాదసూచికలో సూచించాం.
- source_word: מֵהָאָרֶץ
  choice: దేశం నుండి
  rationale: ఇక్కడ הָאָרֶץ జాతీయ భూభాగాన్ని సూచిస్తుంది; సందర్భానుకూలమైన సహజ తెలుగు రూపం.
theological_decisions:
- issue: క్షుద్ర/ఆత్మసంప్రదింపు ఆచారకుల పేర్లను తరువాతి జానపద లేదా కల్పిత వర్గాలతో కలపకుండా అనువదించడం
  choice: చనిపోయినవారి ఆత్మలను సంప్రదించే వారు, కర్ణపిశాచాల వారు
  alternative: మృతాత్మ మాధ్యమాలు, మాంత్రికులు
  rationale: హీబ్రూలోని రెండు పదాలు నిషేధిత ఆత్మసంప్రదింపు ఆచారకులను సూచించినా వాటి ఖచ్చిత విభజన స్పష్టంగా లేదు. ఎంపిక చేసిన రూపం మొదటి పదం యొక్క ప్రధాన కార్యాన్ని తెలియజేస్తూ, రెండవదానికి సంప్రదాయ తెలుగు పదాన్ని ఉంచి, తరువాతి కాలపు ఫాంటసీ భావాలను సాధ్యమైనంతవరకు నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. నేపథ్యంలోని ముందస్తు కాలాన్ని అసహజమైన సంయుక్త కాలరూపంతో కాక సందర్భ క్రమంతో వ్యక్తం చేశాం. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
