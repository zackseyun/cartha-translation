id: 1SA.28.22
reference: 1 Samuel 28:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁמַֽע נָ֤א גַם אַתָּה֙ בְּ/ק֣וֹל שִׁפְחָתֶ֔/ךָ וְ/אָשִׂ֧מָה לְ/פָנֶ֛י/ךָ פַּת לֶ֖חֶם וֶ/אֱכ֑וֹל וִ/יהִ֤י בְ/ךָ֙ כֹּ֔חַ כִּ֥י תֵלֵ֖ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
translation:
  language: te
  text: ఇప్పుడు అయితే, దయచేసి మీరు కూడా మీ దాసి మాట వినండి. నేను మీ ముందు ఒక రొట్టె ముక్కను పెట్టనివ్వండి. దాన్ని తినండి; ఎందుకంటే మీరు దారిలో వెళ్లబోతున్నారు కాబట్టి మీలో బలం ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ఇది కేవలం కాలసూచకం కాక, ముందున్న పరిస్థితి ఆధారంగా మహిళ చేస్తున్న విజ్ఞప్తిని ప్రవేశపెట్టే సంభాషణా సూచకం.
- source_word: שְׁמַע נָא גַם אַתָּה
  choice: దయచేసి మీరు కూడా ... వినండి
  rationale: נָא ఆజ్ఞను వినయపూర్వక విజ్ఞప్తిగా చేస్తుంది; גַם אַתָּה లోని పరస్పర నొక్కును ‘మీరు కూడా’ నిలుపుతుంది.
- source_word: בְּקוֹל שִׁפְחָתֶךָ
  choice: మీ దాసి మాట
  rationale: అక్షరార్థంగా ‘మీ దాసి స్వరాన్ని’; తెలుగులో ‘మాట వినడం’ సహజంగా ఉండి, చెప్పినదాన్ని ఆలకించి పాటించాలనే హీబ్రూ నుడికార భావాన్ని అందిస్తుంది. ‘దాసి’ స్త్రీలింగ పదాన్ని నిలుపుతుంది.
- source_word: וְאָשִׂימָה לְפָנֶיךָ
  choice: నేను మీ ముందు ... పెడతాను
  rationale: మొదటి పురుష cohortative లోని స్వచ్ఛంద ప్రతిపాదనను సందర్భానుగుణమైన సహజ తెలుగు భవిష్యద్రూపంతో తెలియజేస్తుంది.
- source_word: פַּת לֶחֶם
  choice: ఒక రొట్టె ముక్క
  rationale: פַּת అనేది ముక్క లేదా చిన్న భాగాన్ని సూచిస్తుంది; ‘రొట్టె ముక్క’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: וֶאֱכֹל
  choice: దాన్ని తినండి
  rationale: ఆజ్ఞారూపాన్ని నిలుపుతూ, తెలుగులో కర్మను స్పష్టంగా చేర్చడం సహజ ప్రవాహాన్ని ఇస్తుంది.
- source_word: וִיהִי בְךָ כֹּחַ
  choice: అప్పుడు మీరు ... బలం పొందుతారు
  rationale: అక్షరార్థంలోని ‘మీలో బలం ఉండుగాక’ అనే ఆశిత ఫలితాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ఇది ప్రయాణానికి కావలసిన శారీరక శక్తిని సూచిస్తుంది.
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  choice: దారిలో వెళ్లడానికి
  rationale: తినడం వల్ల బలం అవసరమయ్యే కారణం/ఉద్దేశాన్ని తెలుగులో సహజంగా కలుపుతుంది. హీబ్రూ imperfect సమీప భవిష్యత్తు ప్రయాణాన్ని సూచిస్తుంది; ‘తప్పక’ అనే స్పష్టమైన బలవంత భావాన్ని అదనంగా చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవబహువచనం ఉపయోగించబడింది. వాక్యం వినయపూర్వకమైనా అత్యవసరమైన విజ్ఞప్తి స్వరాన్ని కలిగి ఉంది. హీబ్రూ నుడికారాన్ని అక్షరానువాదం చేయకుండా ‘దాసి మాట వినండి’గా సహజీకరించాం; స్త్రీలింగ సూచనను మాత్రం నిలిపాం.
