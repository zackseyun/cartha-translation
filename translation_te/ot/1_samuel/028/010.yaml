id: 1SA.28.10
reference: 1 Samuel 28:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשָּׁ֤בַֽע לָ/הּ֙ שָׁא֔וּל בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר חַי יְהוָ֕ה אִֽם יִקְּרֵ֥/ךְ עָוֺ֖ן בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
translation:
  language: te
  text: అప్పుడు సౌలు యాహ్వే పేరట ఆమెకు ప్రమాణం చేసి, “యాహ్వే జీవముతోడు, ఈ విషయంలో నీ మీదికి ఏ శిక్షా రాదు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ విషయంలో నీ మీదికి ఏ దోషమూ రాదు.” హెబ్రీ పదం అపరాధం, దోషం, లేదా దోషం వల్ల కలిగే శిక్షను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע לָהּ
  choice: ఆమెతో ప్రమాణం చేస్తూ
  rationale: నిఫాల్ రూపంలోని שׁבע ఇక్కడ ‘ప్రమాణం చేయడం’ అనే అర్థాన్నిస్తుంది; לָהּ ప్రమాణం ఎవరికి ఇచ్చాడో సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆమెతో ప్రమాణం చేశాడు’ సహజంగా ఉంటుంది.
- source_word: בַּיהוָה
  choice: యెహోవా పేరట
  rationale: בְּ ఇక్కడ ప్రమాణంలో దైవనామాన్ని ఆధారంగా చేసుకొని ఆహ్వానించడాన్ని సూచిస్తుంది. ‘యెహోవా పేరట’ తెలుగులో ప్రమాణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חַי יְהוָה
  choice: యెహోవా జీవంతోడు
  rationale: ఇది స్థిరమైన హెబ్రీ ప్రమాణ సూత్రం. ‘యెహోవా జీవంతోడు’ దాని గంభీరతను, ప్రమాణ బలాన్ని కాపాడుతుంది.
- source_word: אִם
  choice: ఏ ... రాదు
  rationale: ప్రమాణ వాక్యాల్లో אִם అసంపూర్ణ శాపసూత్రంగా బలమైన నిరాకరణను వ్యక్తం చేస్తుంది; తెలుగులో దాని భావం ‘ఏ ... రాదు’ అని సహజంగా వస్తుంది.
- source_word: יִקְּרֵךְ
  choice: నీ మీదికి ... రాదు
  rationale: קרא ఇక్కడ ఒక పరిణామం వ్యక్తికి సంభవించడం లేదా అతని మీదికి రావడం అనే భావంలో ఉంది.
- source_word: עָוֺן
  choice: శిక్ష
  rationale: עָוֺן అపరాధం, దోషం, లేదా దోషఫలమైన శిక్షను సూచించగలదు. సందర్భంలో సౌలు ఆ స్త్రీకి శిక్షాత్మక పరిణామం రాదని హామీ ఇస్తున్నందున ‘శిక్ష’ ప్రధాన పాఠంలో సరిపోతుంది; అసలు పదంలోని సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: בַּדָּבָר הַזֶּה
  choice: ఈ విషయంలో
  rationale: דָּבָר సందర్భానుసారం ‘విషయం’ అని అర్థమవుతుంది; ఈ కార్యానికి సంబంధించిన పరిణామాన్ని సూచించడానికి ఇది సహజమైన ఆధునిక తెలుగు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత నామాన్ని సాధారణ బిరుదుగా మార్చకుండా నామరూపంగానే ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: עָוֺן పదం యొక్క సందర్భార్థం
  choice: శిక్ష
  alternative: దోషం / అపరాధం
  rationale: సౌలు ఆ కార్యం నైతికంగా నిర్దోషమని ప్రకటించడం కంటే, దాని కారణంగా ఆ స్త్రీపై శిక్ష పడదని హామీ ఇస్తున్న సందర్భార్థాన్ని ప్రధాన పాఠంలో చూపాం. అయినా హెబ్రీ పదం ‘దోషం’ అనే అర్థాన్నీ అనుమతిస్తుందని పాదసూచిక ద్వారా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రమాణ వాక్యానికి తగిన గంభీరతను ఉంచాం. ‘యెహోవా జీవంతోడు’ అనే సూత్రప్రయోగం మూలంలోని ప్రమాణ నిర్మాణాన్ని కాపాడుతుంది; עָוֺן యొక్క నిజమైన అర్థసందిగ్ధత పాదసూచికలో స్పష్టంగా నిలుపబడింది.
