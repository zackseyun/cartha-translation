  text: When Saul saw the camp of the Philistines[a], he was afraid, and his heart trembled greatly.
translation:
  language: te
  text: సౌలు ఫిలిష్తీయుల శిబిరాన్ని చూసినప్పుడు భయపడ్డాడు; అతని హృదయం ఎంతో వణికింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసినప్పుడు
  rationale: ראה ఇక్కడ సాధారణ దృశ్యగ్రహణాన్ని సూచిస్తుంది. వరుసగా ఉన్న సంఘటనల సంబంధాన్ని తెలుగులో సహజంగా చూపడానికి కాలసూచక నిర్మాణం వాడబడింది.
- source_word: מַחֲנֵה
  choice: శిబిరాన్ని
  rationale: మూలపదం సైనికులు మకాం వేసిన స్థలాన్ని సూచిస్తుంది; ‘సైన్యం’ కంటే ‘శిబిరం’ దాని స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల
  rationale: ప్రజావర్గం పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: וַיִּרָא
  choice: భయపడ్డాడు
  rationale: ירא తెలిపే భయాన్ని ఆధునిక తెలుగులో సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וַיֶּחֱרַד
  choice: వణికింది
  rationale: חרד లోని తీవ్ర అంతరంగ కలవరం మరియు వణుకును అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: לִבּוֹ
  choice: అతని హృదయం
  rationale: మూలంలో హృదయమే అంతరంగ భయానికి స్థానంగా చిత్రించబడింది; ఆ రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: מְאֹד
  choice: ఎంతో
  rationale: తీవ్రతను సూచించే מְאֹד ను సహజమైన ఆధునిక తెలుగు తీవ్రతాసూచక పదంతో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. హీబ్రూ వాక్యంలోని ‘హృదయం వణికింది’ అనే అంతరంగ భయ చిత్రాన్ని నిలుపుతూ, అనవసరమైన వివరణాత్మక పదాలను చేర్చలేదు.
