source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל אָכִ֔ישׁ לָ/כֵן֙ אַתָּ֣ה תֵדַ֔ע אֵ֥ת אֲשֶׁר יַעֲשֶׂ֖ה עַבְדֶּ֑/ךָ וַ/יֹּ֤אמֶר אָכִישׁ֙ אֶל דָּוִ֔ד לָ/כֵ֗ן שֹׁמֵ֧ר לְ/רֹאשִׁ֛/י אֲשִֽׂימְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
translation:
  language: te
  text: దావీదు ఆకీషుతో, “అయితే, మీ సేవకుడు ఏమి చేయగలడో మీరే తెలుసుకుంటారు[a]” అన్నాడు. ఆకీషు దావీదుతో, “సరే, నిన్ను నీ జీవితాంతం నా అంగరక్షకునిగా నియమిస్తాను[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ సేవకుడు ఏమి చేస్తాడో.” దావీదు మాట ఉద్దేశపూర్వకంగా అస్పష్టంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: పదశః, “నా తలకు కాపలాదారునిగా.” అంటే, వ్యక్తిగత రక్షకునిగా లేదా అంగరక్షకునిగా.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: అయితే
  rationale: మొదటి సందర్భంలో ముందటి మాటనుంచి వచ్చే నిర్ధారణను, రెండవ సందర్భంలో ఆకీషు స్పందనను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: אַתָּה תֵדַע
  choice: మీరే తెలుసుకుంటారు
  rationale: ప్రత్యేకంగా ఉన్న אַתָּה ఇచ్చే ఉద్ఘాటనను ‘మీరే’ నిలుపుతుంది; రాజుతో మాట్లాడే సందర్భానికి గౌరవ బహువచనం సహజం.
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה עַבְדֶּךָ
  choice: మీ సేవకుడు ఏమి చేయగలడో
  rationale: పదశః ‘మీ సేవకుడు ఏమి చేస్తాడో.’ సందర్భంలో దావీదు మాట తన సామర్థ్యాన్ని సూచిస్తూ, తాను నిజంగా ఏమి చేయనున్నాడనే విషయాన్ని అస్పష్టంగానే ఉంచుతుంది.
- source_word: שֹׁמֵר לְרֹאשִׁי
  choice: నా అంగరక్షకునిగా
  rationale: పదశః ‘నా తలకు కాపలాదారు’; ఇది ఆకీషు వ్యక్తిగత రక్షకుని సూచించే హీబ్రూ ప్రయోగం. ‘అంగరక్షకుడు’ తెలుగులో స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: אֲשִׂימְךָ
  choice: నియమిస్తాను
  rationale: ఒక బాధ్యత లేదా పదవిలో ఉంచడాన్ని ఇక్కడ ‘నియమిస్తాను’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל הַיָּמִים
  choice: జీవితాంతం
  rationale: పదశః ‘అన్ని రోజులు’; ఈ సందర్భంలో నిరంతర, శాశ్వత నియామక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దావీదు మాటలోని ఉద్దేశపూర్వక అస్పష్టత
  choice: ‘ఏమి చేయగలడో’ అని అనువదించి సామర్థ్య భావాన్నీ, చేయబోయే కార్యంపై అనిశ్చితినీ ఉంచడం
  alternative: ‘ఏమి చేస్తాడో’
  rationale: హీబ్రూ రూపం భవిష్యత్ కార్యాన్ని సూచించినా, సందర్భంలో దావీదు ఆకీషుకు స్పష్టమైన విధేయతా హామీ ఇవ్వకుండా ద్వంద్వార్థంగా మాట్లాడుతున్నాడు. అనువాదం ఆ ఉద్రిక్తతను తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన రాజసభ సంభాషణ శైలిని వాడాం. ఆకీషును ఉద్దేశించినప్పుడు ‘మీరు/మీ’ రూపాలు, దావీదును ఆకీషు ఉద్దేశించినప్పుడు ఏకవచన ‘నిన్ను’ వాడటం సామాజిక స్థాయిని సహజంగా ప్రతిబింబిస్తుంది. పాఠ్యంలో ఉన్న [a] సూచిక పాదటిప్పణితో సరిపోలుతుంది.
