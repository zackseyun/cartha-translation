source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר הָֽ/אִשָּׁ֜ה אֵלָ֗י/ו הִנֵּ֨ה אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת אֲשֶׁר עָשָׂ֣ה שָׁא֔וּל אֲשֶׁ֥ר הִכְרִ֛ית אֶת הָ/אֹב֥וֹת וְ/אֶת הַ/יִּדְּעֹנִ֖י מִן הָ/אָ֑רֶץ וְ/לָ/מָ֥ה אַתָּ֛ה מִתְנַקֵּ֥שׁ בְּ/נַפְשִׁ֖/י לַ/הֲמִיתֵֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/009.yaml
  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
translation:
  language: te
  text: 'అయితే ఆ స్త్రీ అతనితో ఇలా అంది: “చూడండి, సౌలు ఏమి చేశాడో మీకే తెలుసు. అతడు ఆత్మలను సంప్రదించేవారిని[a], ఆత్మవిద్యలు తెలిసినవారిని దేశం నుండి తొలగించాడు. అలాంటప్పుడు నన్ను చంపడానికి నా ప్రాణానికి ఎందుకు ఉచ్చు వేస్తున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కర్ణపిశాచులను, మంత్రవిద్యలు తెలిసినవారిని.”
    reason: אוֹבוֹת మరియు יִדְּעֹנִים అనే రెండు పదాలకు సంప్రదాయ తెలుగు పదజాలాన్ని ప్రత్యామ్నాయంగా ఇస్తూ, ప్రధాన పాఠంలో ఆధునికంగా అర్థమయ్యే, సిద్ధాంతపరంగా తటస్థమైన వివరణను ఉంచుతుంది.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అయితే ... అంది
  rationale: వావ్ కథనాన్ని ముందుకు నడిపిస్తుండగా, సందర్భంలో స్త్రీ సౌలు చేసిన అభ్యర్థనకు జాగ్రత్తగా అభ్యంతరం చెబుతోంది; అందువల్ల ‘అయితే’ సందర్భానుకూలమైన వ్యతిరేక భావాన్ని తెలియజేస్తుంది.
- source_word: הִנֵּה
  choice: చూడండి
  rationale: శ్రోత దృష్టిని బలంగా ఆకర్షించే ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אַתָּה יָדַעְתָּ
  choice: మీకే తెలుసు
  rationale: హీబ్రూలో స్పష్టంగా వాడిన సర్వనామం ఇచ్చే ఉద్ఘాటనను ‘మీకే’ నిలుపుతుంది.
- source_word: הִכְרִית
  choice: దేశంలో లేకుండా చేశాడు
  rationale: మూలంలోని ‘నరికివేయు/తొలగించు’ అనే తీవ్ర భావాన్ని సందర్భానుసారంగా, సౌలు ఆ వ్యక్తులను దేశం నుంచి నిర్మూలించిన లేదా తొలగించిన చర్యగా సహజ తెలుగులో తెలియజేస్తుంది; వారందరినీ చంపాడని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: הָאֹבוֹת
  choice: చనిపోయినవారితో సంప్రదించేవారు
  rationale: אוֹב ఇక్కడ మృతులను లేదా ఆత్మలను సంప్రదించే వృత్తివారిని సూచిస్తుంది. ఈ అనువాదం వారి ఆచరణను స్పష్టంగా చెబుతుంది కానీ అది ఎలా పనిచేసిందనే సిద్ధాంతాన్ని నిర్ణయించదు.
- source_word: הַיִּדְּעֹנִי
  choice: కర్ణపిశాచం చెప్పేవారు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన పదబంధం; రహస్యాత్మిక జ్ఞానం చెప్పే వృత్తివారిని సూచిస్తుంది. ఆధునిక పాఠకునికి భావం స్పష్టమయ్యే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: מִתְנַקֵּשׁ בְּנַפְשִׁי
  choice: నా ప్రాణానికి ... ఉచ్చు వేస్తున్నారు
  rationale: మూలంలోని ఉచ్చు రూపకాన్ని, ఆమె ప్రాణమే లక్ష్యమనే భావాన్ని నిలుపుతుంది.
- source_word: לַהֲמִיתֵנִי
  choice: నన్ను చంపించడానికి
  rationale: హిఫీల్ రూపంలోని ‘నన్ను మరణానికి గురిచేయడం/చంపించడం’ అనే కారణార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: నిషేధిత గూఢాచార వృత్తులను సిద్ధాంతపరంగా నిర్ణయించకుండా అనువదించడం
  choice: చనిపోయినవారితో సంప్రదించేవారు; కర్ణపిశాచం చెప్పేవారు
  alternative: మృతాత్మలను సంప్రదించేవారు; ఆత్మల ద్వారా రహస్యాలు చెప్పేవారు
  rationale: మూలపదాలు సూచించే నిషేధిత వృత్తులను పాఠకునికి అర్థమయ్యేలా తెలియజేస్తూ, ఆ ఆచారాల వాస్తవ స్వరూపం లేదా కార్యరీతి గురించి వచనం చెప్పనిదాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవసూచక సంబోధన వాడబడింది. వాక్యం గంభీరంగా, సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంది. ‘ఉచ్చు వేయడం’ అనే హీబ్రూ రూపకం నిలుపబడింది; గూఢాచార పదాలకు సంప్రదాయ పరిచయమూ ఆధునిక స్పష్టతా సమతుల్యం చేయబడ్డాయి.
