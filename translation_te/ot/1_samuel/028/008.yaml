  terminology: ప్రధాన పాఠంలో ‘మాధ్యమం’ అనే తటస్థ పదాన్ని ఉంచడం ద్వారా אוֹב యొక్క వివాదాస్పద/బహుళార్థ స్వభావాన్ని అతిగా నిర్వచించకుండా కాపాడాం. పాదటిప్పణి ‘ఓబ్’కు సంబంధించిన ప్రత్యామ్నాయమైన ‘పరిచిత ఆత్మ ద్వారా’ అనే అర్థాన్ని, మృతులతో సంప్రదింపుకు సంబంధించిన సందర్భాన్ని సంక్షిప్తంగా వివరిస్తుంది.
