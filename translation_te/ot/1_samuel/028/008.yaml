source:
  edition: WLC
  text: וַ/יִּתְחַפֵּ֣שׂ שָׁא֗וּל וַ/יִּלְבַּשׁ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וַ/יֵּ֣לֶךְ ה֗וּא וּ/שְׁנֵ֤י אֲנָשִׁים֙ עִמּ֔/וֹ וַ/יָּבֹ֥אוּ אֶל הָ/אִשָּׁ֖ה לָ֑יְלָה וַ/יֹּ֗אמֶר קסומי נָ֥א לִ/י֙ בָּ/א֔וֹב וְ/הַ֣עֲלִי לִ֔/י אֵ֥ת אֲשֶׁר אֹמַ֖ר אֵלָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/008.yaml
  text: So Saul disguised himself and put on other clothes[a], and he went, he and two men with him. They came to the woman by night, and he said, “Please divine for me by a medium, and bring up for me the one whom I name to you.”
translation:
  language: te
  text: సౌలు తన వేషం మార్చుకొని వేరే బట్టలు వేసుకున్నాడు. అతడూ అతనితో ఉన్న ఇద్దరు మనుషులూ వెళ్లారు. వారు రాత్రివేళ ఆ స్త్రీ వద్దకు వచ్చారు. అతడు ఆమెతో, “దయచేసి, మాధ్యమం ద్వారా నా కోసం జోస్యం చెప్పు; నేను నీకు చెప్పే వ్యక్తిని నా కోసం పైకి రప్పించు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַפֵּשׂ
  choice: తనను గుర్తుపట్టకుండా వేషం మార్చుకొని
  rationale: హిత్పయేల్ రూపంలోని స్వయంక్రియను, తన గుర్తింపును దాచాలనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּגָדִים אֲחֵרִים
  choice: వేరే బట్టలు
  rationale: వేషం మార్చుకోవడంలో భాగంగా ఇతర వస్త్రాలు ధరించాడనే సరళ భావాన్ని సాధారణ తెలుగులో నిలుపుతుంది.
- source_word: וַיֵּלֶךְ הוּא וּשְׁנֵי אֲנָשִׁים עִמּוֹ
  choice: అతడు తనతో ఇద్దరు మనుషులను తీసుకొని వెళ్లాడు
  rationale: సౌలు స్వయంగా వెళ్లాడనీ, అతనితో ఇద్దరు ఉన్నారనీ సహజ తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: לָיְלָה
  choice: రాత్రివేళ
  rationale: రాత్రి సమయంలో వారు రహస్యంగా వచ్చిన కథన పరిస్థితిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קָסֳמִי נָא לִי
  choice: దయచేసి … నా కోసం శకునం చెప్పి
  rationale: קסם అనే భవిష్యజ్ఞాన క్రియను సాధారణ పాఠకులకు అర్థమయ్యేలా అందిస్తుంది; נָא లోని వినయపూర్వక అభ్యర్థనను ‘దయచేసి’ నిలుపుతుంది.
- source_word: בָּאוֹב
  choice: చనిపోయినవారిని సంప్రదించే మాధ్యమం ద్వారా
  rationale: ఈ సందర్భంలో אוֹב మృతులను విచారించే నెక్రోమాంటిక్ సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. తెలుగు ‘మాధ్యమం’ ఒక్కటే అస్పష్టంగా ఉండవచ్చు కాబట్టి వివరణాత్మక విశేషణం జోడించబడింది; పదంలోని వ్యక్తి/ఆత్మ/సాధనం అనే సంక్లిష్టతను పాదటిప్పణి సూచిస్తుంది.
- source_word: וְהַעֲלִי לִי
  choice: నా కోసం పైకి రప్పించు
  rationale: హిఫీల్ రూపంలోని ‘పైకి వచ్చేలా చేయు’ అనే చిత్రణను నిలుపుతూ, అది నిజంగా ఎలా సంభవిస్తుందనే సిద్ధాంత నిర్ణయాన్ని జోడించదు.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלָיִךְ
  choice: నేను నీకు చెప్పబోయే వ్యక్తిని
  rationale: సౌలు తరువాత పేర్కొనే వ్యక్తిని సూచించే హెబ్రీ వాక్యభావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: మృతులతో సంప్రదింపుకు సంబంధించిన భాషను దాని కార్యసాధకతపై తీర్పు ఇవ్వకుండా అనువదించడం
  choice: ‘శకునం చెప్పి,’ ‘మాధ్యమం ద్వారా,’ ‘పైకి రప్పించు’ అంటూ సౌలు చేసిన అభ్యర్థనను కథన భాషలో నేరుగా అందించడం
  alternative: ‘పైకి రప్పిస్తున్నట్టు నటించు’ అని సందేహాత్మకంగా చెప్పడం, లేదా ‘మృతుని ఆత్మతో నిజంగా సంబంధం కలిగించు’ అని మరింత నిర్దిష్టమైన అతీంద్రియ వ్యాఖ్యానం జోడించడం
  rationale: మూలపాఠం సౌలు అభ్యర్థనను నివేదిస్తుంది గానీ, ఈ వాక్యంలో ఆ ప్రక్రియ స్వభావాన్ని సిద్ధాంతపరంగా వివరించదు. అందువల్ల దాని నిజస్వరూపాన్ని సమర్థించకుండా లేదా ఖండించకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘పైకి రప్పించు’ అనే మూల రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది; నెక్రోమాన్సీ కార్యసాధకతపై వ్యాఖ్యానాన్ని అనువాదంలో చేర్చలేదు.
