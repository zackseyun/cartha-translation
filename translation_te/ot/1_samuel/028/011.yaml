id: 1SA.28.11
reference: 1 Samuel 28:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה אֶת מִ֖י אַֽעֲלֶה לָּ֑/ךְ וַ/יֹּ֕אמֶר אֶת שְׁמוּאֵ֖ל הַֽעֲלִי לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/011.yaml
  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
translation:
  language: te
  text: అప్పుడు ఆ స్త్రీ, “నీ కోసం ఎవరిని పైకి రప్పించాలి[a]?” అని అడిగింది. అతడు, “నా కోసం సమూయేలును పైకి రప్పించు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆవాహన చేయాలి?” హీబ్రూ క్రియ అక్షరార్థంగా “పైకి రప్పించు” లేదా “పైకి వచ్చేలా చేయు” అని అర్థం; ఇక్కడ అది మృతునితో సంప్రదించే సందర్భంలోని నుడికారాన్ని ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... అడిగింది
  rationale: వయిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది; ప్రశ్నాత్మక ప్రత్యక్ష సంభాషణ కావడంతో తెలుగులో సహజంగా ‘అడిగింది’ అని ఇచ్చాం.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: సందర్భంలో ఏన్దోరులోని ఆ స్త్రీని సూచించే నిర్దిష్ట పదబంధం; ఆధునిక తెలుగులో ‘ఆ స్త్రీ’ సహజం.
- source_word: אֶת מִי
  choice: ఎవరిని
  rationale: אֶת ప్రత్యక్ష కర్మను సూచిస్తుంది; అందువల్ల కర్మ విభక్తితో ‘ఎవరిని’ అని అనువదించాం.
- source_word: אַעֲלֶה
  choice: పైకి రప్పించాలి
  rationale: עלה హిఫీల్ రూపం ‘పైకి వచ్చేలా చేయడం/పైకి రప్పించడం’ అనే భావం ఇస్తుంది. ‘పైకి రప్పించు’ మూలంలోని దిశాత్మక రూపకాన్ని నిలుపుతుంది.
- source_word: לָּךְ
  choice: నీ కోసం
  rationale: ఇక్కడ ל ప్రయోజనార్థకంగా, సౌలు తరఫున చేయబడే చర్యను సూచిస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అతడు ... అన్నాడు
  rationale: సాధారణ కథన వయిక్తోల్; తెలుగు సంభాషణ ప్రవాహంలో సహజమైన రూపం.
- source_word: אֶת שְׁמוּאֵל
  choice: సమూయేలును
  rationale: אֶת అనువదించబడదు; వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘సమూయేలు’గా, కర్మ విభక్తితో ఇచ్చాం.
- source_word: הַעֲלִי
  choice: పైకి రప్పించు
  rationale: స్త్రీని ఉద్దేశించిన עלה హిఫీల్ ఆజ్ఞార్థక రూపం. ముందటి క్రియతో పదసామ్యాన్ని, మూలంలోని ‘పైకి’ అనే రూపకాన్ని నిలిపాం.
- source_word: לִי
  choice: నా కోసం
  rationale: ముందున్న לָּךְ మాదిరిగానే ప్రయోజనార్థక భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మృతునితో సంప్రదించే సందర్భంలో עלה అనే క్రియను ఎలా అనువదించాలి
  choice: పైకి రప్పించు
  alternative: ఆవాహన చేయు / పిలిపించు
  rationale: హీబ్రూ క్రియ యొక్క సాధారణ భావం ‘పైకి వచ్చేలా చేయు.’ ‘పైకి రప్పించు’ పాఠ్యంలోని రూపకాన్ని కాపాడుతూ, సంఘటన ఎలా జరిగిందనే వేదాంత వివరణను అనువాదంలో ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘పైకి రప్పించు’ అనే పునరుక్తి ఉద్దేశపూర్వకం; అది హీబ్రూ మూలంలోని ఒకే క్రియ పునరావృతిని, దాని రూపకాన్ని నిలుపుతుంది.
