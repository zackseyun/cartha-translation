source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לָ֥/הּ הַ/מֶּ֛לֶךְ אַל תִּֽירְאִ֖י כִּ֣י מָ֣ה רָאִ֑ית וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל שָׁא֔וּל אֱלֹהִ֥ים רָאִ֖יתִי עֹלִ֥ים מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
translation:
  language: te
  text: రాజు ఆమెతో, “భయపడకు. నీవు ఏమి చూశావు?[a]” అన్నాడు. ఆ స్త్రీ సౌలుతో, “భూమిలోనుంచి పైకి వస్తున్న ఒక దైవిక జీవిని నేను చూస్తున్నాను[b]” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ క్రియ వ్యాకరణపరంగా సంపూర్ణ/భూతకాల రూపంలో ఉంది: ‘నీవు ఏమి చూశావు?’ అయితే వెంటనే జరుగుతున్న దర్శన సందర్భంలో ‘నీవు ఏమి చూస్తున్నావు?’ అనే భావమూ సాధ్యమే.'
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ אֱלֹהִים (ఎలోహీమ్) పదం బహువచన రూపంలో ఉంది; దానికి సంబంధించిన ‘పైకి వస్తున్న’ అనే కృదంతం కూడా హీబ్రూలో బహువచనమే. అందువల్ల ‘దైవిక జీవులు పైకి వస్తున్నారు’ లేదా ‘దేవుళ్లు పైకి వస్తున్నారు’ అని కూడా అనువదించవచ్చు; తరువాతి సందర్భం ఒక అతీంద్రియ జీవిని సూచించే విధంగానూ అర్థం చేసుకోవడానికి వీలు కల్పిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిపేరు కాకుండా నిర్దిష్ట రూపంలోని సాధారణ నామవాచకం ఉంది. తరువాతి వాక్యభాగంలో సౌలు పేరు రావడం వల్ల కథన శైలి నిలుస్తుంది.
- source_word: אַל תִּירְאִי
  choice: భయపడకు
  rationale: స్త్రీని ఉద్దేశించిన నిషేధ ఆజ్ఞకు ఇది సహజమైన, నేరుగా అర్థమయ్యే ఆధునిక తెలుగు రూపం.
- source_word: כִּי מָה רָאִית
  choice: నీవు ఏమి చూశావు?
  rationale: רָאִית సంపూర్ణ/భూతకాల రూపంలో ఉన్నందున ‘చూశావు’ మూలరూపాన్ని దగ్గరగా ప్రతిబింబిస్తుంది. దర్శనం అప్పుడే కొనసాగుతున్న సందర్భంలో వర్తమానార్థమూ సాధ్యమని పాదటిప్పణిలో ఉంచబడింది. כִּיని తెలుగులో విడిగా అనువదిస్తే ప్రశ్న అసహజంగా వినిపించే అవకాశం ఉన్నందున వాక్యసంబంధం ద్వారా వ్యక్తమైంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: ఈ వచనంలో ఉన్న సాధారణ నామవాచకాన్నే అనుసరించి, సందర్భం ఆధారంగా ‘మంత్రగత్తె’ లేదా ‘మాధ్యమం’ వంటి వ్యాఖ్యాత్మక గుర్తింపును చేర్చలేదు.
- source_word: אֱלֹהִים
  choice: ఒక దైవిక రూపం
  rationale: అతీంద్రియమైన ప్రత్యక్షతను సహజ తెలుగులో తెలియజేస్తూ, దానిని దేవుడిగానే గుర్తించకుండా లేదా అనేక దేవుళ్లను ఖచ్చితంగా సూచించకుండా ఉంచుతుంది. హీబ్రూ పదం, దానికి అనుసంధానమైన కృదంతం బహువచన రూపాల్లో ఉన్న విషయాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
- source_word: עֹלִים
  choice: పైకి వస్తున్న
  rationale: עלה కృదంతంలోని పైదిశ కదలికను, జరుగుతున్న దర్శన స్వభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִן הָאָרֶץ
  choice: భూమిలోనుంచి
  rationale: కిందనుంచి వెలువడే దృశ్యాన్ని నిలుపుతూ, ‘దేశం’ అనే వేరొక సాధ్యార్థం కంటే ఈ సందర్భానికి తగిన ‘భూమి’ అర్థాన్ని ఇస్తుంది.
theological_decisions:
- issue: స్త్రీ చెప్పిన అֱלֹהִים అనే పదాన్ని ఎలా అనువదించాలి
  choice: ఒక దైవిక రూపం
  alternative: దేవుళ్లు; దేవుడు; ఒక అతీంద్రియ జీవి
  rationale: ఈ మాట స్త్రీ చూసినదాని నివేదిక మాత్రమే; కథకుడు సమర్థించిన సిద్ధాంత ప్రకటన కాదు. ప్రధాన పాఠం అతీంద్రియ భావాన్ని తెలియజేస్తుంది, కానీ ఆ రూపాన్ని దేవుడిగా నిర్ధారించదు లేదా బహుదేవతారాధన భావాన్ని బలవంతంగా రుద్దదు. అదే సమయంలో మూలంలోని వ్యాకరణ బహువచనాన్ని పాదటిప్పణిలో స్పష్టంగా ఉంచి నిజమైన సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘దైవిక రూపం’ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి, మూలపాఠంలోని ఏకవచన/బహువచన మరియు గుర్తింపు సంబంధమైన ఉద్వేగాన్ని పాదటిప్పణితో సంరక్షిస్తుంది.
