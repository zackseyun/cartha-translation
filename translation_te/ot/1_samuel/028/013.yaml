    issue: “ఒక దైవిక రూపం” renders the apparition as an appearance/form rather than as the being(s) denoted by אֱלֹהִים.
    rationale: The Hebrew noun refers to deity/divine being(s), not to a visual shape. Since the contextual singular construal remains plausible, “ఒక దైవిక జీవి” preserves that construal without adding an identification.
  - severity: low
    issue: “అడిగాడు” narrows וַיֹּאמֶר to asking.
    rationale: The king first says “Do not be afraid” and then asks a question. “అన్నాడు” naturally introduces the entire utterance and follows the Hebrew more closely.
