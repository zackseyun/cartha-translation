  text: Then she brought it before Saul and before his servants[a], and they ate. Then they rose and went away that night.
translation:
  language: te
  text: అప్పుడు ఆమె దానిని సౌలు ముందూ అతని సేవకుల ముందూ ఉంచింది[a]. వారు తిన్నారు. ఆ తర్వాత వారు లేచి, ఆ రాత్రి వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఆమె సౌలు ముందూ అతని సేవకుల ముందూ ఉంచింది.” కర్మను ప్రత్యక్షంగా పేర్కొనలేదు; ముందటి సందర్భంలో సిద్ధం చేసిన భోజనమే ఉద్దేశం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: ఆమె దానిని ... ముందూ ... ఉంచింది
  rationale: హిఫిల్ రూపంలోని נגשׁ ఇక్కడ భోజనాన్ని వారి ముందుకు తెచ్చి ఉంచడాన్ని సూచిస్తుంది. కర్మ మూలపాఠంలో వ్యక్తంగా లేకపోయినా, ముందు వచనంలోని సిద్ధం చేసిన భోజనం సందర్భం వల్ల ‘దానిని’ అని సహజంగా పూరించబడింది.
- source_word: לִפְנֵי
  choice: ముందూ
  rationale: ఆహారాన్ని భోజనం చేసేవారి ఎదుట ఉంచే సందర్భంలో ‘ముందు’ అనేది సహజమైన, మూలానికి దగ్గరైన తెలుగు ప్రయోగం.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: עבד అనే పదానికి సేవకుడు, దాసుడు, పరిచారకుడు అనే అర్థాలు ఉండవచ్చు. ఇక్కడ సౌలుతో వచ్చిన రాజసేవలోని మనుషులను సూచిస్తున్నందున ‘సేవకులు’ తగిన సాధారణ పదం.
- source_word: וַיֹּאכֵלוּ
  choice: వారు తిన్నారు
  rationale: హీబ్రూ క్రియ కర్మను పేర్కొనకుండా వారు తిన్నారని చెబుతుంది; తెలుగు వాక్యంలోనూ సందర్భం వల్ల కర్మ స్పష్టంగా ఉంటుంది.
- source_word: וַיָּקֻמוּ
  choice: వారు లేచి
  rationale: భోజనం అనంతరం లేచి బయలుదేరిన కథాక్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּלְכוּ
  choice: వెళ్లిపోయారు
  rationale: הלך ప్రాథమికంగా ‘వెళ్లు’ అని అర్థం. ఇక్కడ వారు ఆ స్థలం విడిచి వెళ్లిన భావాన్ని ‘వెళ్లిపోయారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రే
  rationale: అక్షరార్థంగా ‘ఆ రాత్రిలో.’ కథలో వారు అదే రాత్రి బయలుదేరిన కాలసూచనను ఆధునిక తెలుగులో ‘ఆ రాత్రే’ స్పష్టంగా, సహజంగా అందిస్తుంది.
