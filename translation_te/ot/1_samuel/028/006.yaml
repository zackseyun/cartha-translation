revisions:
- from: 'సౌలు యాహ్వేను[a] విచారించాడు. అయితే యాహ్వే అతనికి జవాబివ్వలేదు—కలల ద్వారాగానీ, ఊరీము[b] ద్వారాగానీ, ప్రవక్తల ద్వారాగానీ.


    [a] “యాహ్వే” అనేది దేవుని పేరైన יהוה (యహ్వహ్)కు తెలుగు రూపం.

    [b] ఊరీము అనేది దేవుని నడిపింపును తెలుసుకోవడానికి యాజకులు ఉపయోగించిన పవిత్ర సాధనం.'
  to: 'సౌలు యాహ్వేను[a] సంప్రదించాడు. అయితే యాహ్వే అతనికి జవాబివ్వలేదు—కలల ద్వారాగానీ, ఊరీము[b] ద్వారాగానీ, ప్రవక్తల ద్వారాగానీ.


    [a] “యాహ్వే” అనేది దేవుని ప్రత్యేక నామమైన יהוהకు తెలుగు లిప్యంతరీకరణ.


    [b] ఊరీము అనేది దేవుని మార్గదర్శకత్వాన్ని తెలుసుకోవడానికి యాజకులు ఉపయోగించిన పవిత్ర సాధనం.'
