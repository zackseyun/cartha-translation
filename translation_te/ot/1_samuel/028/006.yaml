source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בַּֽ/יהוָ֔ה וְ/לֹ֥א עָנָ֖/הוּ יְהוָ֑ה גַּ֧ם בַּ/חֲלֹמ֛וֹת גַּ֥ם בָּ/אוּרִ֖ים גַּ֥ם בַּ/נְּבִיאִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
translation:
  language: te
  text: 'సౌలు యాహ్వేను[a] సంప్రదించాడు. అయితే యాహ్వే అతనికి జవాబివ్వలేదు—కలల ద్వారాగానీ, ఊరీము[b] ద్వారాగానీ, ప్రవక్తల ద్వారాగానీ.


    [a] “యాహ్వే” అనేది దేవుని ప్రత్యేక నామమైన יהוהకు తెలుగు లిప్యంతరీకరణ.


    [b] ఊరీము అనేది దేవుని మార్గదర్శకత్వాన్ని తెలుసుకోవడానికి యాజకులు ఉపయోగించిన పవిత్ర సాధనం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యాహ్వే” అనేది దేవుని ప్రత్యేక నామమైన יהוהకు తెలుగు లిప్యంతరీకరణ.
    reason: divine_name_note
  - marker: b
    text: ఊరీము అనేది దేవుని మార్గదర్శకత్వాన్ని తెలుసుకోవడానికి యాజకులు ఉపయోగించిన పవిత్ర సాధనం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: విచారించాడు
  rationale: ఇక్కడ שׁאל అనే క్రియ בְּతో కూడి దేవుని దగ్గర కేవలం ప్రశ్న అడగడం కాక, ఆయన నడిపింపును లేదా దైవోక్తిని కోరడాన్ని సూచిస్తుంది. ‘విచారించాడు’ ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּיהוָה / יְהוָה
  choice: యాహ్వేను / యాహ్వే
  rationale: మూలపాఠంలోని దేవుని ప్రత్యేక నామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించాం. בַּיהוָהలోని בְּను తెలుగు వాక్యరీతికి అనుగుణంగా ప్రత్యక్ష కర్మ విభక్తితో వ్యక్తం చేశాం.
- source_word: וְלֹא עָנָהוּ
  choice: అతనికి జవాబివ్వలేదు
  rationale: ענה ఇక్కడ సౌలు కోరిన దైవిక విచారణకు సమాధానం ఇవ్వడాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం నేరుగా, సహజంగా ఉంది.
- source_word: גַּם ... גַּם ... גַּם
  choice: … ద్వారాగానీ, … ద్వారాగానీ, … ద్వారాగానీ
  rationale: నిషేధ వాక్యంలో పునరావృతమైన גַּם, పేర్కొన్న ఏ మార్గం ద్వారానూ జవాబు రాలేదని తెలియజేస్తుంది. ‘గానీ’ పునరుక్తి ఆ విభజనాత్మక భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: בַּחֲלֹמוֹת
  choice: కలల ద్వారా
  rationale: కలలు దైవిక ప్రకటనకు ఒక మాధ్యమంగా జాబితాలో ఉన్నాయి; ‘ద్వారా’ అనే రూపం సాధనార్థక בְּ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּאוּרִים
  choice: ఊరీము ద్వారా
  rationale: אוּרִים అనేది యాజక సంబంధమైన పవిత్ర విచారణ సాధనం లేదా చీట్ల పేరుగా ఉంది. దాని స్వరూపాన్ని ఊహించి అనువదించకుండా సంప్రదాయ లిప్యంతరీకరణను ఉంచాం.
- source_word: בַּנְּבִיאִם
  choice: ప్రవక్తల ద్వారా
  rationale: נביאים దేవుని సందేశాన్ని తెలియజేసే మానవ ప్రతినిధులు. ‘ప్రవక్తలు’ ప్రామాణికమైన, అందరికీ అర్థమయ్యే తెలుగు పదం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ఉంచడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: సౌలు విచారించినా జవాబు రాకపోవడం
  choice: పేర్కొన్న ఏ ప్రకటన మార్గం ద్వారానూ యాహ్వే అతనికి జవాబివ్వలేదని మాత్రమే చెప్పడం
  alternative: దేవుడు ఎందుకు జవాబివ్వలేదో వివరణను అనువాదంలో చేర్చడం
  rationale: ఈ వచనం జవాబు రాకపోవడానికి కారణం చెప్పదు. అందువల్ల దాని దైవశాస్త్రీయ ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. జాబితాలోని మూడు ప్రకటన మార్గాలకు సమాంతర నిర్మాణం ఇచ్చాం; మూలంలో లేని కారణ వివరణను చేర్చలేదు.
