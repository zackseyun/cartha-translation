source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה וְ/לֹֽא עָשִׂ֥יתָ חֲרוֹן אַפּ֖/וֹ בַּ/עֲמָלֵ֑ק עַל כֵּן֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה עָשָֽׂה לְ/ךָ֥ יְהוָ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
translation:
  language: te
  text: నీవు యాహ్వే మాటకు లోబడలేదు; అమాలేకుపై ఆయన మండే కోపాన్ని అమలు చేయలేదు[a]. అందుకే యాహ్వే ఈ రోజు నీకు ఈ కార్యాన్ని చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అమాలేకుపై ఆయన ఉగ్రకోపాన్ని తీర్చలేదు.’
    reason: חֲרוֹן אַפּוֹ అనే హీబ్రూ ప్రయోగాన్ని ‘మండే కోపం’గా రూపకసహితంగా లేదా ‘ఉగ్రకోపం’గా భావప్రధానంగా అనువదించవచ్చు; עשה తో కలిసినప్పుడు దాన్ని ‘అమలు చేయడం’ లేదా ‘తీర్చడం’ అని వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: כַּאֲשֶׁר ... עַל כֵּן
  choice: '... అందుకే'
  rationale: ఈ రెండు పదబంధాలు సౌలు అవిధేయతను ప్రస్తుత తీర్పుకు కారణంగా చూపుతున్నాయి. ఆధునిక తెలుగులో కారణ–ఫలిత సంబంధాన్ని సహజంగా తెలియజేయడానికి మొదటి వాక్యంలో కారణాన్ని పేర్కొని, తరువాత ‘అందుకే’ వాడాం.
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: యాహ్వే మాటకు లోబడలేదు
  rationale: שׁמע בְּקוֹל ఇక్కడ కేవలం వినడాన్ని కాక విధేయత చూపడాన్ని సూచిస్తుంది. ‘మాటకు లోబడడం’ ఆ భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ధ్వన్యంతరీకరణను తెలుగులో ఇచ్చాం.
- source_word: עָשִׂיתָ חֲרוֹן אַפּוֹ
  choice: ఆయన మండే కోపాన్ని అమలు చేయలేదు
  rationale: ఈ అసాధారణ హీబ్రూ ప్రయోగం అక్షరార్థంగా ‘ఆయన కోపపు మండుటను చేయడం’ అనే భావాన్ని ఇస్తుంది; సందర్భంలో అమాలేకుపై ప్రకటించిన దైవతీర్పును అమలు చేయడాన్ని సూచిస్తుంది. ‘మండే కోపం’ మూలంలోని వేడి రూపకాన్ని నిలుపుతుంది.
- source_word: בַּעֲמָלֵק
  choice: అమాలేకుపై
  rationale: కోపం లేదా తీర్పు ఎవరిని లక్ష్యంగా చేసిందో తెలుగులో ‘పై’ సహజంగా తెలియజేస్తుంది.
- source_word: הַדָּבָר הַזֶּה עָשָׂה לְךָ יְהוָה
  choice: యాహ్వే ... నీకు ఇలా చేశాడు
  rationale: דבר ఇక్కడ ఒక నిర్దిష్ట ‘మాట’ కంటే ప్రస్తుత పరిణామం లేదా తీర్పును సూచిస్తుంది. ‘ఇలా చేశాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, దేవుడు సౌలుకు ఈ పరిణామాన్ని కలిగించాడనే భావాన్ని నిలుపుతుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: కాలసూచనను సరళమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ధ్వన్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
- issue: అమాలేకుపై దేవుని కోపాన్ని ‘చేయడం’ అనే ప్రయోగం
  choice: ఆయన మండే కోపాన్ని అమలు చేయడం
  alternative: ఆయన ఉగ్రకోపాన్ని అమాలేకుపై తీర్చడం
  rationale: ఈ పదబంధం దైవతీర్పును సౌలు కార్యరూపంలో పెట్టవలసిన బాధ్యతను సూచిస్తుంది. ప్రధాన పాఠం మూలంలోని ‘మండే’ రూపకాన్ని, ‘చేయడం/అమలు చేయడం’ అనే క్రియాత్మక భావాన్ని కాపాడుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకుడికి అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూ కారణ–ఫలిత క్రమాన్ని సహజమైన రెండు వాక్యాలుగా ఇచ్చాం. దైవనామాన్ని ‘యాహ్వే’గా నిలిపాం.
