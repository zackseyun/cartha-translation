id: 1SA.28.17
reference: 1 Samuel 28:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ ל֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בְּ/יָדִ֑/י וַ/יִּקְרַ֨ע יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ מִ/יָּדֶ֔/ךָ וַֽ/יִּתְּנָ֖/הּ לְ/רֵעֲ/ךָ֥ לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
translation:
  language: te
  text: యెహోవా తనకోసం[a], నా ద్వారా చెప్పినట్టే, చేశాడు[b]. యెహోవా నీ చేతిలోనుంచి రాజ్యాన్ని చింపివేసి, దాన్ని నీ పొరుగువాడైన దావీదుకు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “అతనికి” లేదా “అతని కోసం”; సందర్భానుసారం “తనకోసం” అని అర్థం చేసుకోవచ్చు. అనేక అనువాదాలు సందర్భాన్ని బట్టి “నీకు” లేదా “నీ విషయంలో” అని ఇస్తాయి; అయితే మసోరా పాఠంలో మూడవ పురుష రూపమే ఉంది.'
    reason: alternative_reading
  - marker: b
    text: 'లేదా: “నా చేతి ద్వారా చెప్పినట్టే.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగులో సుపరిచితమైన ధ్వన్యంతరీకరణతో ఇచ్చాం.
- source_word: וַיַּעַשׂ יְהוָה לוֹ
  choice: యెహోవా అతనికి ... చేశాడు
  rationale: לוֹ అనేది అక్షరార్థంగా మూడవ పురుష ఏకవచన రూపం, ‘అతనికి/అతని కోసం.’ ప్రత్యక్ష సంభాషణలో ఇది అసాధారణంగా ఉన్నప్పటికీ, మసోరా పాఠంలోని వ్యక్తి భేదాన్ని ‘నీకు’ అని మార్చకుండా నిలిపాం.
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  choice: నా చేతి ద్వారా చెప్పినట్టే
  rationale: בְּיַדִי లోని ‘నా చేతి ద్వారా’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, సమూయేలు దేవుని సందేశవాహకుడని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּקְרַע
  choice: చింపివేసి
  rationale: קרע అనే ‘చించు/చింపివేయు’ క్రియలోని బలమైన రూపకాన్ని నిలిపాం.
- source_word: הַמַּמְלָכָה
  choice: రాజ్యాన్ని
  rationale: సౌలు ఆధీనంలోని రాజ్యపాలనను సూచించడానికి సహజమైన తెలుగు పదం.
- source_word: מִיָּדֶךָ
  choice: నీ చేతిలోనుంచి
  rationale: సౌలు అధీనంలోనుంచి రాజ్యం తొలగించబడిందనే హీబ్రూ చిత్రాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: וַיִּתְּנָהּ
  choice: దాన్ని ... ఇచ్చాడు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ‘రాజ్యం’ను తిరిగి సూచిస్తున్నందున తెలుగులో ‘దాన్ని’ అని స్పష్టంచేశాం.
- source_word: לְרֵעֲךָ
  choice: నీ పొరుగువాడైన
  rationale: רֵעַ కు ‘పొరుగువాడు, సహచరుడు, సన్నిహితుడు’ అనే అర్థాలున్నాయి; తరువాత వచ్చే ‘దావీదు’ ఆ వ్యక్తిని స్పష్టంగా గుర్తిస్తుంది.
- source_word: לְדָוִד
  choice: దావీదుకు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
theological_decisions:
- issue: మొదటి వాక్యభాగంలోని לוֹ పాఠం
  choice: మసోరా పాఠంలోని మూడవ పురుష రూపాన్ని ‘అతనికి’ అని నేరుగా అనువదించడం
  alternative: ‘నీకు,’ ‘నీ విషయంలో,’ లేదా ‘తనకోసం’
  rationale: హీబ్రూ పాఠంలో לְךָ (‘నీకు’) కాక לוֹ (‘అతనికి/అతని కోసం’) ఉంది. సందర్భం వల్ల సౌలును ఉద్దేశించిన ‘నీకు’ అనే భావం సాధ్యమైనా, దానిని ప్రధాన పాఠంలో నిశ్శబ్దంగా చేర్చలేదు. ‘తనకోసం’ అనే ప్రతిబింబార్థం కూడా సాధ్యమైన వివరణే గాని, హీబ్రూ సర్వనామ రూపం స్వయంగా దానిని తప్పనిసరి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడాం. హీబ్రూ పాఠంలోని అసాధారణమైన మూడవ పురుష సర్వనామాన్ని ప్రధాన పాఠంలో నిలిపి, దాని సాధ్యార్థాలను పాదసూచికలో వివరించాం.
