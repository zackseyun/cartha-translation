  text: וַ/יִּקָּבְצ֣וּ פְלִשְׁתִּ֔ים וַ/יָּבֹ֖אוּ וַ/יַּחֲנ֣וּ בְ/שׁוּנֵ֑ם וַ/יִּקְבֹּ֤ץ שָׁאוּל֙ אֶת כָּל יִשְׂרָאֵ֔ל וַֽ/יַּחֲנ֖וּ בַּ/גִּלְבֹּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/004.yaml
  text: The Philistines gathered and came and camped at Shunem[a], and Saul gathered all Israel[b], and they camped at Gilboa.
translation:
  language: te
  text: ఫిలిష్తీయులు సమకూడి, వచ్చి, షూనేములో[a] మకాం వేశారు. సౌలు ఇశ్రాయేలంతటినీ సమకూర్చాడు; వారు గిల్బోవలో[b] మకాం వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మకాం వేశారు’ బదులు, రెండు చోట్లా ‘శిబిరం వేశారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘గిల్బోవ మీద’ లేదా ‘గిల్బోవ పర్వతప్రాంతంలో’ అని కూడా అనువదించవచ్చు; ఈ పేరు గిల్బోవ ఎత్తైన ప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: సమకూడి
  rationale: קבץ అనే మూలపదం సమకూడడం లేదా సమావేశమవడం అనే భావాన్ని ఇస్తుంది. సైనిక సందర్భం ఉన్నప్పటికీ, మూలంలో లేని అదనపు భావాన్ని చేర్చకుండా సహజంగా అనువదిస్తుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజావర్గానికి ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపం.
- source_word: וַיָּבֹאוּ
  choice: వచ్చి
  rationale: בוא అనే సాధారణ గమనక్రియను యుద్ధపరమైన ‘దండెత్తి వచ్చి’ వంటి అదనపు అర్థం లేకుండా నిలుపుతుంది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה అంటే శిబిరం వేయడం. ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘శిబిరం వేశారు’ కంటే సాధారణ పాఠకుడికి సులభంగా ఉంటుంది.
- source_word: בְשׁוּנֵם
  choice: షూనేములో
  rationale: స్థల నామంతో కూడిన בְ ఉపసర్గను తెలుగులో సహజమైన స్థానార్థక విభక్తితో అందిస్తుంది.
- source_word: וַיִּקְבֹּץ
  choice: సమకూర్చాడు
  rationale: మొదటి קבץ రూపంతో పదమూల సంబంధాన్ని నిలుపుతూ, సౌలు ఇతరులను కూడగట్టిన సకర్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటినీ
  rationale: మూలంలోని ‘ఇశ్రాయేలు అంతా’ అనే సమష్టి వ్యక్తీకరణను పురుషులకు లేదా సైనికులకు మాత్రమే పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: בַּגִּלְבֹּעַ
  choice: గిల్బోవలో
  rationale: మూలం ‘పర్వతం’ అనే పదాన్ని జోడించదు; కాబట్టి భౌగోళిక వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా స్థల నామాన్ని మాత్రమే ఉంచుతుంది.
