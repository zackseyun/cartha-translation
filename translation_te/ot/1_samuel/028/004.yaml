  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలు నిలుపబడ్డాయి; అయితే తెలుగు పఠనసౌలభ్యం కోసం వాక్యాన్ని రెండు భాగాలుగా విభజించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
