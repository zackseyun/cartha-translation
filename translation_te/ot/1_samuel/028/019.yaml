id: 1SA.28.19
reference: 1 Samuel 28:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יִתֵּ֣ן יְ֠הוָה גַּ֣ם אֶת יִשְׂרָאֵ֤ל עִמְּ/ךָ֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/מָחָ֕ר אַתָּ֥ה וּ/בָנֶ֖י/ךָ עִמִּ֑/י גַּ֚ם אֶת מַחֲנֵ֣ה יִשְׂרָאֵ֔ל יִתֵּ֥ן יְהוָ֖ה בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
translation:
  language: te
  text: మరియు యెహోవా ఇశ్రాయేలును కూడా నీతో కలిసి ఫిలిష్తీయుల చేతికి అప్పగిస్తాడు. రేపు నువ్వూ నీ కుమారులూ నాతో ఉంటారు.[a] యెహోవా ఇశ్రాయేలు శిబిరాన్ని కూడా ఫిలిష్తీయుల చేతికి అప్పగిస్తాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణంలో నాతో ఉంటారు,” లేక “షెయోలులో నాతో ఉంటారు.” హీబ్రూలో కేవలం “నాతో” అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఇశ్రాయేలు సైన్యాన్ని.” హీబ్రూ పదానికి “శిబిరం” లేదా సందర్భానుసారం “సైన్యం” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను పేరుగానే ఉంచుతూ, ఆధునిక తెలుగు బైబిలు భాషలో విస్తృతంగా గుర్తించదగిన రూపాన్ని వాడింది.
- source_word: וְיִתֵּן / יִתֵּן ... בְיַד
  choice: చేతికి అప్పగిస్తాడు
  rationale: נתן ... ביד అనే హీబ్రూ ప్రయోగం ఒకరి అధికారానికి లేదా ఆధీనానికి అప్పగించడాన్ని సూచిస్తుంది. ‘చేతికి’ అనే మూలభాష చిత్రాన్ని నిలుపుతూ ‘అప్పగిస్తాడు’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גַּם
  choice: కూడా
  rationale: రెండు వాక్యభాగాల్లోనూ ఉన్న చేర్పు, ఉద్ఘాటన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עִמְּךָ
  choice: నీతోపాటు
  rationale: ఇశ్రాయేలు సౌలు పొందబోయే గతిలో పాలుపంచుకుంటుందని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וּבָנֶיךָ
  choice: నీ కుమారులు
  rationale: בנים ఇక్కడ సాధారణంగా పిల్లలు అనే అర్థం కాకుండా సౌలు కుమారులనే సూచిస్తుంది.
- source_word: עִמִּי
  choice: నాతో
  rationale: హీబ్రూ పాఠం మరణాన్ని లేదా షెయోలును ప్రత్యక్షంగా పేర్కొనకుండా కేవలం ‘నాతో’ అని చెబుతుంది; అదే సంక్షిప్తతను, అర్థసందిగ్ధతను నిలిపింది.
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: ఇశ్రాయేలు శిబిరం
  rationale: מַחֲנֶה యొక్క ప్రాథమిక సైనిక అర్థమైన ‘శిబిరం’ను నిలుపుతుంది; సందర్భంలో అది అక్కడున్న సైన్యాన్ని కూడా సూచించవచ్చు.
theological_decisions:
- issue: ‘రేపు నువ్వూ నీ కుమారులూ నాతో ఉంటారు’ అనే మాట యొక్క పరలోక సంబంధ భావం
  choice: ‘నాతో ఉంటారు’ అని మాత్రమే అనువదించడం
  alternative: ‘మరణంలో నాతో ఉంటారు’ లేదా ‘షెయోలులో నాతో ఉంటారు’
  rationale: సందర్భం సౌలు, అతని కుమారులు మరణిస్తారని సూచించినా, హీబ్రూ వాక్యం వారి స్థితి లేదా స్థలాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల పాఠంలో లేని పరలోక సిద్ధాంతాన్ని చేర్చకుండా మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘చేతికి అప్పగిస్తాడు’ ద్వారా హీబ్రూ రూపకాన్ని నిలిపి, ‘నాతో’ అనే మాటలోని వేదాంతపరమైన ఉద్విగ్నతను పరిష్కరించకుండా ఉంచింది. ప్రధాన పాఠంలోని [a], [b] సూచికలు సంబంధిత పాదటిప్పణులతో నేరుగా సరిపోతాయి.
