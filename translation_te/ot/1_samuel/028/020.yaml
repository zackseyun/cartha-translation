  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, కథనానికి తగిన గంభీరతతో రూపొందించబడింది. ‘నిలువెత్తున’ అనే సహజ నుడికారం శరీరం పూర్తి పొడవున పడటాన్ని సూచిస్తుంది.
