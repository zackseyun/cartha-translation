  text: וַ/יְמַהֵ֣ר שָׁא֗וּל וַ/יִּפֹּ֤ל מְלֹא קֽוֹמָת/וֹ֙ אַ֔רְצָ/ה וַ/יִּרָ֥א מְאֹ֖ד מִ/דִּבְרֵ֣י שְׁמוּאֵ֑ל גַּם כֹּ֨חַ֙ לֹא הָ֣יָה ב֔/וֹ כִּ֣י לֹ֤א אָכַל֙ לֶ֔חֶם כָּל הַ/יּ֖וֹם וְ/כָל הַ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/020.yaml
  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
translation:
  language: te
  text: సౌలు వెంటనే నేలమీద తన పూర్తి పొడవునా పడిపోయాడు. సమూయేలు మాటల వల్ల అతడు చాలా భయపడ్డాడు. అతనిలో బలం కూడా లేకపోయింది, ఎందుకంటే అతడు ఆ రోజంతా, ఆ రాత్రంతా రొట్టె[a] తినలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రొట్టె’ అనే హీబ్రూ పదం విస్తృతార్థంలో ‘ఆహారం’ అని కూడా సూచించగలదు; మూలపదాన్ని ప్రతిబింబించేందుకు ఇక్కడ ‘రొట్టె’ అని ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: వెంటనే
  rationale: క్రియకు అక్షరార్థంగా ‘త్వరపడ్డాడు’ అనే భావం ఉన్నా, ఇక్కడ సౌలు అకస్మాత్తుగా పడిపోవడాన్ని పరిచయం చేస్తుంది; అందువల్ల తెలుగులో ‘వెంటనే’ సహజంగా సందర్భార్థాన్ని ఇస్తుంది.
- source_word: וַיִּפֹּל
  choice: పడిపోయాడు
  rationale: మూలంలోని సాధారణ ‘పడు’ అనే అర్థాన్ని నిలుపుతుంది; ‘కుప్పకూలాడు’ అనడం సందర్భానుగుణమైనా మరింత వ్యాఖ్యానాత్మకం.
- source_word: מְלֹא קוֹמָתוֹ
  choice: నిలువెత్తున
  rationale: అతని శరీరం పూర్తి పొడవున నేలపై పడిందనే భావాన్ని సహజమైన ఆధునిక తెలుగు నుడికారంలో తెలియజేస్తుంది.
- source_word: אַרְצָה
  choice: నేలమీద
  rationale: దిశను సూచించే ఈ రూపం కథన సందర్భంలో ‘నేలమీద’ అని సహజంగా అనువదించబడుతుంది.
- source_word: וַיִּרָא מְאֹד
  choice: చాలా భయపడ్డాడు
  rationale: తీవ్రమైన భయాన్ని సరళమైన, ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מִדִּבְרֵי שְׁמוּאֵל
  choice: సమూయేలు చెప్పిన మాటలను బట్టి
  rationale: מִן ఇక్కడ కారణాన్ని సూచిస్తుంది; ‘మాటలను బట్టి’ ఆ కారణ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גַּם כֹּחַ לֹא הָיָה בוֹ
  choice: అంతేకాక, అతనిలో బలం లేకపోయింది
  rationale: గַּם యొక్క అదనపు భావాన్ని ‘అంతేకాక’ నిలుపుతుంది; ‘అతనిలో బలం లేకపోయింది’ మూల వాక్యానికి సన్నిహితంగా ఉంటుంది.
- source_word: כִּי
  choice: తినకపోవడంతో
  rationale: అతనిలో బలం లేకపోవడానికి ఉపవాక్యం కారణమని తెలుగులో సహజమైన కారణార్థక నిర్మాణంతో తెలియజేస్తుంది.
- source_word: לֹא אָכַל לֶחֶם
  choice: రొట్టె తినకపోవడంతో
  rationale: לֶחֶם విస్తృతంగా ‘ఆహారం’ అని కూడా సూచించగలిగినా, మూలంలోని నిర్దిష్ట పదాన్ని ప్రతిబింబించేందుకు ‘రొట్టె’ను ఉంచింది.
- source_word: כָּל הַיּוֹם וְכָל הַלָּיְלָה
  choice: ఆ పగలంతా, రాత్రంతా
  rationale: నిర్దిష్టమైన ఆ పగలు మరియు రాత్రి మొత్తం అనే కాలవ్యాప్తిని సహజంగా తెలుపుతుంది.
