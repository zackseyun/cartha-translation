source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אִשָּׁה֙ אֶת שְׁמוּאֵ֔ל וַ/תִּזְעַ֖ק בְּ/ק֣וֹל גָּד֑וֹל וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה אֶל שָׁא֧וּל לֵ/אמֹ֛ר לָ֥/מָּה רִמִּיתָ֖/נִי וְ/אַתָּ֥ה שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
translation:
  language: te
  text: ఆ స్త్రీ సమూయేలును[a] చూసినప్పుడు, బిగ్గరగా కేక వేసి సౌలుతో, “నన్నెందుకు మోసం చేశావు? నువ్వు సౌలువే!” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమూయేలులా కనిపించినదాన్ని.” హీబ్రూ పాఠం దర్శన స్వభావాన్ని వివరించకుండా కేవలం “సమూయేలు” అని చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: చూసినప్పుడు
  rationale: ראה అనే క్రియ ఇక్కడ ప్రత్యక్షంగా చూడడాన్ని సూచిస్తుంది; ‘గుర్తించింది’ వంటి అనువాదం మూలంలో లేని వ్యాఖ్యానాన్ని చేర్చుతుంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: హీబ్రూ పాఠం ఇక్కడ ఆమె వృత్తిపాత్రను మళ్లీ పేర్కొనకుండా సాధారణంగా ‘ఆ స్త్రీ’ అని అంటుంది.
- source_word: אֶת שְׁמוּאֵל
  choice: సమూయేలును
  rationale: మూలపాఠం ఎలాంటి వ్యాఖ్యానాత్మక విశేషణం లేకుండా సమూయేలే ఆమె చూసిన ప్రత్యక్ష కర్మగా పేర్కొంటుంది.
- source_word: וַתִּזְעַק בְּקוֹל גָּדוֹל
  choice: బిగ్గరగా కేక వేసి
  rationale: זעק మరియు בְּקוֹל גָּדוֹל కలిపి తీవ్రమైన, పెద్ద శబ్దంతో చేసిన కేకను సూచిస్తాయి; ఈ తెలుగు ప్రయోగం సహజంగా ఆ తీవ్రతను నిలుపుతుంది.
- source_word: וַתֹּאמֶר ... לֵאמֹר
  choice: అంది
  rationale: హీబ్రూ ‘చెప్పి ఇలా అంది’ అనే నిర్మాణాన్ని తెలుగులో సహజంగా ఒకే సంభాషణా క్రియతో వ్యక్తం చేయవచ్చు.
- source_word: לָמָּה רִמִּיתָנִי
  choice: నన్నెందుకు మోసం చేశావు?
  rationale: పియేల్ రూపంలోని רמה ఉద్దేశపూర్వక మోసాన్ని సూచిస్తుంది; ‘మోసం చేశావు’ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: וְאַתָּה שָׁאוּל
  choice: నువ్వు సౌలువే!
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘నువ్వు’ మరియు ‘-వే’ ద్వారా సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ఆమె చూసింది నిజంగా సమూయేలేనా, ఒక ఆత్మా, లేక సమూయేలులా కనిపించిన రూపమా అనే ప్రశ్న
  choice: ప్రధాన పాఠంలో వ్యాఖ్యానాత్మక పరిమితి లేకుండా ‘సమూయేలును’ అని ఉంచడం
  alternative: ‘సమూయేలులా కనిపించిన రూపాన్ని’ లేదా ‘సమూయేలు ఆత్మను’ అని అనువదించడం
  rationale: హీబ్రూ కథనం కేవలం ‘సమూయేలు’ అని చెబుతుంది. దర్శన స్వభావాన్ని ఈ వచనం వివరించదు; అందువల్ల ప్రధాన పాఠం ఆ వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి, సహజమైన ప్రత్యక్ష సంభాషణ. సౌలు తన అసలు గుర్తింపును దాచిన సందర్భంలో స్త్రీ అతనితో ఏకవచన అనౌపచారిక రూపాన్ని వాడిన భావాన్ని ‘నువ్వు’ ద్వారా నిలిపింది.
