base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
translation:
  language: te
  text: అతడు ఆమెతో, “అతని రూపం ఎలా ఉంది?” అన్నాడు. ఆమె, “ఒక వృద్ధుడు పైకి వస్తున్నాడు[a]; అతడు అంగీ కప్పుకొని ఉన్నాడు[b]” అంది. అప్పుడు సౌలు అతడు సమూయేలు అని గ్రహించాడు. అతడు ముఖం నేలవైపు వంచి, సాగిలపడ్డాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పైకి ఎక్కుతున్నాడు’ లేదా ‘పైకి లేస్తున్నాడు.’ హెబ్రీ కృదంతం పైవైపు జరుగుతున్న కదలికను నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అంగీ ధరించి ఉన్నాడు.’ హెబ్రీ పదం దానిని చుట్టుకొని లేదా కప్పుకొని ఉన్నాడనే మరింత సజీవమైన భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: చివరి క్రియను ‘నమస్కరించాడు’ అని కూడా అనువదించవచ్చు; కొన్ని సందర్భాల్లో అది ‘ఆరాధించాడు’ అనే అర్థాన్నిస్తుంది. ఇక్కడ సమూయేలుగా గుర్తించబడిన వ్యక్తి ముందు లోతుగా సాగిలపడే చర్యను సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּאֳרוֹ
  choice: అతని రూపం
  rationale: תֹּאַר కనిపించే రూపాన్ని లేదా ఆకారాన్ని సూచిస్తుంది. గుర్తించడానికి కావలసిన వివరణను అడుగుతున్న సందర్భంలో ‘రూపం’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: אִישׁ זָקֵן
  choice: ఒక వృద్ధుడు
  rationale: ఈ పదబంధం వయసు మళ్లిన పురుషుణ్ణి నేరుగా సూచిస్తుంది; ‘ఒక వృద్ధుడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన అనువాదం.
- source_word: עֹלֶה
  choice: పైకి వస్తున్నాడు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న చర్యను తెలియజేస్తుంది; ఈ సందర్భంలో కింది నుంచి పైకి కదలడమనే స్థలార్థాన్ని ‘పైకి వస్తున్నాడు’ సహజంగా నిలుపుతుంది.
- source_word: עֹטֶה מְעִיל
  choice: అంగీ కప్పుకొని ఉన్నాడు
  rationale: עֹטֶה కేవలం ధరించడమే కాక చుట్టుకోవడం లేదా కప్పుకోవడం అనే బలమైన భావాన్ని ఇస్తుంది; מְעִיל పొడవైన పైవస్త్రం లేదా అంగీ. ఈ వర్ణన సమూయేలును గుర్తించడానికి తోడ్పడే వస్త్రాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: וַיֵּדַע
  choice: సౌలు ... అని గ్రహించి
  rationale: ידע సాధారణంగా ‘తెలుసుకొను’ అని అర్థమైనా, ఇక్కడ ఇచ్చిన వర్ణన ఆధారంగా గుర్తించడం లేదా గ్రహించడం అనే సందర్భార్థం ఉంది.
- source_word: כִּי שְׁמוּאֵל הוּא
  choice: అతడు సమూయేలు అని
  rationale: హెబ్రీలోని పుంలింగ సర్వనామాన్ని నిలుపుతూ, గుర్తింపు ప్రకటనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; దర్శన స్వరూపంపై వచనం చెప్పినదానికంటే ఎక్కువ నిర్ణయించదు.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: ముఖం నేలవైపు వంచి
  rationale: ఈ హెబ్రీ నుడికారం ముఖం లేదా ముక్కు భూమివైపు ఉండేలా లోతుగా వంగడాన్ని సూచిస్తుంది. ‘ముఖం నేలవైపు వంచి’ భంగిమను స్పష్టంగా తెలుపుతుంది.
- source_word: וַיִּשְׁתָּחוּ
  choice: సాగిలపడ్డాడు
  rationale: ఈ క్రియ గౌరవంతో పూర్తిగా వంగడం లేదా సాష్టాంగపడడం సూచించగలదు. ‘సాగిలపడ్డాడు’ ముందు క్రియకన్నా చర్య తీవ్రతను నిలుపుతూ, తప్పనిసరిగా ఆరాధన అనే భావాన్ని రుద్దదు.
theological_decisions:
- issue: సమూయేలుగా గుర్తించబడిన వ్యక్తి ముందు సౌలు చేసిన చర్యను స్పష్టమైన ఆరాధన పదంతో అనువదించాలా
  choice: ‘సాగిలపడ్డాడు’ అని అనువదించడం
  alternative: ‘నమస్కరించాడు’ లేదా ‘ఆరాధించాడు’
  rationale: שׁחה సందర్భానుసారం ఆరాధనను గానీ, గౌరవపూర్వకంగా సాగిలపడడాన్ని గానీ సూచించగలదు. ఇక్కడ వచనం శారీరక వినయభంగిమను వర్ణిస్తుంది; ‘ఆరాధించాడు’ అంటే మూలపాఠం స్పష్టంగా నిర్ధారించని ఆరాధనా భావాన్ని చేర్చవచ్చు. ‘సాగిలపడ్డాడు’ చర్యను నిలుపుతూ దాని ఖచ్చితమైన ధార్మిక అర్థాన్ని పాఠకుడే పరిశీలించడానికి వీలు ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘అంగీ,’ ‘సాగిలపడ్డాడు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, హెబ్రీ వర్ణనలోని దృశ్యాత్మకతను మరియు ధార్మిక అస్పష్టతను నిలుపుతాయి.
