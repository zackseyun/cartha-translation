  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וְ/לָ֖/מָּה תִּשְׁאָלֵ֑/נִי וַ/יהוָ֛ה סָ֥ר מֵ/עָלֶ֖י/ךָ וַ/יְהִ֥י עָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
translation:
  language: te
  text: 'సమూయేలు ఇలా అన్నాడు: “మరి నన్నెందుకు అడుగుతున్నావు? యాహ్వే నీ నుండి తొలగిపోయి నీ విరోధిగా అయ్యాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు శత్రువయ్యాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: సమూయేలు ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: וְלָמָּה תִּשְׁאָלֵנִי
  choice: మరి నన్నెందుకు అడుగుతున్నావు?
  rationale: וְ యొక్క అనుసంధాన భావాన్ని ‘మరి’ తెలియజేస్తుంది; שאל యొక్క సాధారణ ‘అడుగు/విచారించు’ భావాన్ని సందర్భానుగుణంగా సరళంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించింది.
- source_word: סָר מֵעָלֶיךָ
  choice: నిన్ను విడిచిపెట్టి
  rationale: సౌలు నుండి యాహ్వే తొలగిపోయిన సంబంధాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיְהִי עָרֶךָ
  choice: నీ విరోధి అయ్యాడు
  rationale: עָרֶךָ లోని ప్రత్యర్థి లేదా శత్రువు అనే తీవ్రమైన భావాన్ని మృదువుచేయకుండా, అయ్యాడు అనే క్రియతో హీబ్రూ వాక్యాన్ని నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించాం.
- issue: సౌలుతో యాహ్వే సంబంధాన్ని עָרֶךָ ద్వారా వర్ణించడం
  choice: నీ విరోధి అయ్యాడు
  alternative: నీకు శత్రువయ్యాడు; నీకు వ్యతిరేకంగా ఉన్నాడు
  rationale: దైవిక వ్యతిరేకత యొక్క తీవ్రతను నిలుపుతూ, ‘విరోధి’ అనే పదం עָר యొక్క శత్రువు/ప్రత్యర్థి భావపరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ప్రశ్నలోని హేతువును స్పష్టంచేయడానికి ‘కదా! మరి’ అనే సహజ తెలుగు అనుసంధానం ఉపయోగించబడింది; మూలంలోని తీవ్ర దైవిక వ్యతిరేకతను అలాగే నిలిపాం.
