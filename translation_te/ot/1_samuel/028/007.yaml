  text: וַ/יֹּ֨אמֶר שָׁא֜וּל לַ/עֲבָדָ֗י/ו בַּקְּשׁוּ לִ/י֙ אֵ֣שֶׁת בַּעֲלַת א֔וֹב וְ/אֵלְכָ֥ה אֵלֶ֖י/הָ וְ/אֶדְרְשָׁה בָּ֑/הּ וַ/יֹּאמְר֤וּ עֲבָדָי/ו֙ אֵלָ֔י/ו הִנֵּ֛ה אֵ֥שֶׁת בַּֽעֲלַת א֖וֹב בְּ/עֵ֥ין דּֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: te
  text: అప్పుడు సౌలు తన సేవకులతో, “నాకోసం ఒక మాధ్యమ స్త్రీని వెతకండి. నేను ఆమె దగ్గరికి వెళ్లి ఆమె ద్వారా విచారణ చేస్తాను” అన్నాడు. అతని సేవకులు అతనితో, “ఇదిగో, ఏన్‌దోరులో ఒక మాధ్యమ స్త్రీ ఉంది” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת בַּעֲלַת אֹוב
  choice: చనిపోయినవారి ఆత్మలతో సంప్రదించే ఒక స్త్రీ
  rationale: בעלת אוב అనే పదబంధం ఒక ఓబ్‌ను కలిగిన లేదా దానితో వ్యవహరించే స్త్రీని సూచిస్తుంది; సందర్భంలో ఆమె మృతులతో సంప్రదింపులు జరిపే మాధ్యమంగా పనిచేస్తుంది. తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే విధంగా కార్యాన్ని స్పష్టపరిచాం, అయితే ఆ ఆచారం నిజంగా ఎలా పనిచేస్తుందనే నిర్ణయాన్ని చేయలేదు.
- source_word: וְאֶדְרְשָׁה בָּהּ
  choice: ఆమె ద్వారా విచారణ చేస్తాను
  rationale: בָּהּ ఇక్కడ ఆమెను సాధనంగా లేదా మధ్యవర్తిగా ఉపయోగించి విచారించడాన్ని సూచించవచ్చు. ‘ఆమెను అడుగుతాను’ కంటే ‘ఆమె ద్వారా’ అనేది మూలంలోని భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: సేవకులు తమకు తెలిసిన వ్యక్తి ఉన్నదని సౌలు దృష్టికి తెచ్చే పరిచయార్థక అవ్యయాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: עֵין דּוֹר
  choice: ఏన్‌దోరు
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: ‘ఓబ్’ స్వరూపం మరియు మృతులతో సంప్రదింపుల వాస్తవికత
  choice: చనిపోయినవారి ఆత్మలతో సంప్రదించే స్త్రీగా వృత్తి/పాత్రను వర్ణించడం
  alternative: దయ్యం పట్టిన స్త్రీ, మంత్రగత్తె, లేదా కేవలం మోసగత్తె అని అనువదించడం
  rationale: ఈ వచనం ఆ స్త్రీ యొక్క పాత్రను మాత్రమే గుర్తిస్తుంది; ఆమె శక్తికి మూలం ఏమిటో లేదా ఆమె వాదన నిజమో కాదో ఇక్కడ తేల్చదు. అందువల్ల నిర్దిష్ట సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
- issue: సౌలు విచారణ ఎవరిని ఉద్దేశించి చేస్తాడు
  choice: ఆమె ద్వారా విచారణ చేస్తాను
  alternative: ఆమెను విచారిస్తాను
  rationale: మూలంలోని בָּהּ ఆమె మధ్యవర్తిత్వాన్ని సూచించగలదు. ఈ అనువాదం సౌలు ఆమెనే సమాచారపు తుది మూలంగా భావించాడని అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. సౌలు మాటల్లో ఆజ్ఞార్థక ధోరణిని, సేవకుల సమాధానంలో తక్షణ సూచన భావాన్ని నిలిపాం.
