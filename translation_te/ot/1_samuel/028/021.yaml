source:
  edition: WLC
  text: וַ/תָּב֤וֹא הָֽ/אִשָּׁה֙ אֶל שָׁא֔וּל וַ/תֵּ֖רֶא כִּי נִבְהַ֣ל מְאֹ֑ד וַ/תֹּ֣אמֶר אֵלָ֗י/ו הִנֵּ֨ה שָׁמְעָ֤ה שִׁפְחָֽתְ/ךָ֙ בְּ/קוֹלֶ֔/ךָ וָ/אָשִׂ֤ים נַפְשִׁ/י֙ בְּ/כַפִּ֔/י וָֽ/אֶשְׁמַע֙ אֶת דְּבָרֶ֔י/ךָ אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
translation:
  language: te
  text: 'ఆ స్త్రీ సౌలు దగ్గరకు వచ్చింది. అతడు ఎంతో భయభ్రాంతుడై ఉన్నాడని ఆమె చూసి, అతనితో ఇలా అంది: “ఇదిగో, నీ దాసినైన నేను నీ మాటకు లోబడ్డాను[a]. నా ప్రాణాన్ని అరచేతిలో పెట్టుకొని[b], నువ్వు నాతో చెప్పిన మాటలను విన్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: “నీ దాసి నీ స్వరాన్ని విన్నది.” ఇక్కడి హీబ్రూ నుడికారం అతని మాటను ఆలకించి, దానికి లోబడిందని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: “నా ప్రాణాన్ని అరచేతిలో పెట్టుకొని” అనేది ప్రాణాన్ని పణంగా పెట్టడం లేదా ప్రాణాపాయాన్ని స్వీకరించడం అనే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה אֶל שָׁאוּל
  choice: ఆ స్త్రీ సౌలు దగ్గరకు వచ్చింది
  rationale: కథనాన్ని ముందుకు నడిపే క్రియను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ఈ వచనంలో లేని ‘కర్ణపిశాచి గల స్త్రీ’ వంటి సందర్భసంబంధ గుర్తింపును చేర్చలేదు.
- source_word: וַתֵּרֶא כִּי נִבְהַל מְאֹד
  choice: అతడు ఎంతో భయభ్రాంతుడై ఉన్నాడని ఆమె చూసి
  rationale: נבהל తీవ్రమైన కలవరాన్ని లేదా భయాన్ని సూచిస్తుంది; מְאֹד దాని తీవ్రతను పెంచుతుంది. ‘భయభ్రాంతుడై’ ఈ సందర్భంలోని మానసిక స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తాను చెప్పబోయే విజ్ఞప్తిపై దృష్టి నిలిపే సంభాషణ సూచకాన్ని ఆధునికమైనప్పటికీ గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: שָׁמְעָה שִׁפְחָתְךָ בְּקוֹלֶךָ
  choice: నీ దాసినైన నేను నీ మాటకు లోబడ్డాను
  rationale: שִׁפְחָה స్త్రీ దాసిని సూచిస్తుంది; హీబ్రూ మూడవ పురుష వినయపూర్వక స్వీయసూచనను సహజమైన తెలుగు మొదటి పురుష రూపంలో వ్యక్తం చేశాం. שׁמע בקול అనే నుడికారం కేవలం వినడాన్ని కాక మాట పాటించడాన్ని సూచిస్తుంది.
- source_word: וָאָשִׂים נַפְשִׁי בְכַפִּי
  choice: నా ప్రాణాన్ని అరచేతిలో పెట్టుకొని
  rationale: ప్రాణాన్ని పణంగా పెట్టడం అనే అర్థమున్న హీబ్రూ రూపకాన్ని తెలుగులో కూడా అర్థమయ్యే సజీవ చిత్రంగా నిలిపింది.
- source_word: וָאֶשְׁמַע אֶת דְּבָרֶיךָ אֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: నువ్వు నాతో చెప్పిన మాటలను విన్నాను
  rationale: ఇక్కడ שׁמע ప్రత్యక్ష కర్మతో ఉండి వినడం/ఆలకించడం అనే భావాన్ని ఇస్తుంది. ముందున్న ‘లోబడ్డాను’తో ఉన్న పదప్రయోగ భేదాన్ని కాపాడుతూ, ఆమె స్పందించి చేసిన పనిని సందర్భం తెలియజేయనిస్తుంది.
