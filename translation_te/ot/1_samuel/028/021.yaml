translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. స్త్రీ సౌలుతో మాట్లాడేటప్పుడు సందర్భానికి సహజమైన ఏకవచన సంబోధనను ఉంచాం. హీబ్రూ నుడికారాల భావాన్ని ప్రధాన పాఠంలో స్పష్టంగా తెలియజేస్తూనే, వాటి అక్షరార్థ చిత్రాన్ని సాధ్యమైన చోట నిలిపి పాదసూచికల్లో వివరించాం.
