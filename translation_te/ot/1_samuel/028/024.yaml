source:
  edition: WLC
  text: וְ/לָ/אִשָּׁ֤ה עֵֽגֶל מַרְבֵּק֙ בַּ/בַּ֔יִת וַ/תְּמַהֵ֖ר וַ/תִּזְבָּחֵ֑/הוּ וַ/תִּקַּח קֶ֣מַח וַ/תָּ֔לָשׁ וַ/תֹּפֵ֖/הוּ מַצּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: The woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
translation:
  language: te
  text: ఆ స్త్రీ ఇంట్లో కొవ్వబెట్టిన దూడ ఒకటి ఉంది[a]. ఆమె త్వరపడి దాన్ని వధించింది[b]. తరువాత పిండి తీసుకొని, దాన్ని పిసికి, పులియని రొట్టెలు[c] కాల్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కొట్టంలో పెంచిన దూడ’; సంప్రదాయంగా ‘బలిసిన దూడ.’
    reason: lexical_alternative
  - marker: b
    text: ఈ క్రియ కొన్ని సందర్భాల్లో బలి అర్పించడానికి జంతువును వధించడాన్ని సూచించగలదు; ఇక్కడ మాత్రం భోజనం కోసం దాన్ని కోయడమే భావం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘పులియని అప్పాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל מַרְבֵּק
  choice: కొవ్వబెట్టిన దూడ
  rationale: עֵגֶל అనేది చిన్న వయసున్న పశువును సూచిస్తుంది; מַרְבֵּק అది కొవ్వబెట్టబడిన, బహుశా కొట్టంలో మేపబడిన జంతువని తెలియజేస్తుంది. ‘కొవ్వబెట్టిన దూడ’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: בַּבַּיִת
  choice: ఇంట్లో
  rationale: మూలంలోని స్థలార్థాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: וַתְּמַהֵר
  choice: త్వరపడి
  rationale: క్రియలోని ఆతురతను, కథన వేగాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַתִּזְבָּחֵהוּ
  choice: దాన్ని వధించింది
  rationale: ఈ సందర్భంలో జంతువును భోజనం కోసం కోయడమే భావం. ‘వధించింది’ చర్యను గౌరవప్రదమైన ప్రామాణిక తెలుగులో తెలియజేస్తుంది; బలిగా అర్పించిందనే భావాన్ని పాఠ్యంలో చేర్చదు.
- source_word: קֶמַח
  choice: పిండి
  rationale: రొట్టెల తయారీలో ఉపయోగించే flour అనే సాధారణ అర్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: וַתָּלָשׁ
  choice: దాన్ని పిసికి
  rationale: పిండిని కలిపి ముద్దగా పిసికే చర్యను సూచించే క్రియకు ఇది సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: וַתֹּפֵהוּ מַצּוֹת
  choice: పులియని రొట్టెలు కాల్చింది
  rationale: కాల్చడం అనే చర్యను, దాని ఫలితమైన పులియని రొట్టెలను సహజమైన తెలుగు వాక్య నిర్మాణంలో కలిపి అందిస్తుంది.
theological_decisions:
- issue: וַתִּזְבָּחֵהוּ అనే క్రియకు బలి సంబంధమైన భావం ఉండగలదా?
  choice: ఈ భోజన సందర్భంలో ‘వధించింది’ అని అనువదించడం
  alternative: ‘బలిగా అర్పించింది’
  rationale: సందర్భం ఆరాధనా బలి గురించి కాక, సౌలుకు భోజనం సిద్ధం చేయడం గురించి ఉంది. అందువల్ల బలి అర్థాన్ని పాఠ్యంలో బలవంతంగా చేర్చకుండా, క్రియ యొక్క జంతువును కోయడం అనే భావాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ వంటి పదాన్ని చేర్చలేదు. అన్ని పాదసూచిక గుర్తులను సంబంధిత పదబంధాల వెంట ఉంచాం.
