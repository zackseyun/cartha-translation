  text: וַֽ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וַ/יִּקְבְּצ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/צָּבָ֔א לְ/הִלָּחֵ֖ם בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֤אמֶר אָכִישׁ֙ אֶל דָּוִ֔ד יָדֹ֣עַ תֵּדַ֗ע כִּ֤י אִתִּ/י֙ תֵּצֵ֣א בַֽ/מַּחֲנֶ֔ה אַתָּ֖ה וַ/אֲנָשֶֽׁי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: In those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
translation:
  language: te
  text: ఆ రోజుల్లో ఫిలిష్తీయులు ఇశ్రాయేలుతో యుద్ధం చేయడానికి తమ సైనిక శిబిరాలను సమీకరించారు. ఆకీషు దావీదుతో, “నువ్వూ నీ మనుషులూ నాతోపాటు సైన్యంతో[a] బయలుదేరాలని నీకు బాగా తెలుసు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాతోపాటు శిబిరంలో బయలుదేరాలని నీకు బాగా తెలుసు.” ఇక్కడి హీబ్రూ పదం శిబిరాన్ని లేదా విస్తృతార్థంలో సైనిక దళాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: కొత్త దృశ్యాన్ని పరిచయం చేసే హీబ్రూ కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּקְבְּצוּ פְלִשְׁתִּים אֶת מַחֲנֵיהֶם לַצָּבָא
  choice: ఫిలిష్తీయులు తమ సైనిక శిబిరాలను సమీకరించారు
  rationale: מַחֲנֶה యొక్క ప్రాథమికమైన ‘శిబిరం’ భావాన్ని నిలుపుతూ, యుద్ధ సందర్భాన్ని ‘సైనిక’ అనే విశేషణం స్పష్టం చేస్తుంది; బహువచనాన్ని కూడా కాపాడుతుంది.
- source_word: לְהִלָּחֵם בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో యుద్ధం చేయడానికి
  rationale: హీబ్రూ בְּ ఇక్కడ ప్రతికూల సైనిక సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘ఇశ్రాయేలుతో యుద్ధం చేయడం’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: יָדֹעַ תֵּדַע
  choice: నీకు బాగా తెలుసు
  rationale: క్రియావిశేషక infinitive absolute ఇచ్చే గట్టి నిశ్చయార్థాన్ని సహజమైన తెలుగు తీవ్రతతో వ్యక్తం చేస్తుంది.
- source_word: אִתִּי תֵּצֵא
  choice: నాతోపాటు ... బయలుదేరాలని
  rationale: రూపానికి భవిష్యత్ సూచన ఉన్నా, సందర్భంలో ఆకీషు ఆశిస్తున్న విధేయత లేదా బాధ్యత ప్రధానంగా ఉంది; ‘బయలుదేరాలని’ ఆ ప్రయోగార్థాన్ని అతిగా కఠినపరచకుండా తెలియజేస్తుంది.
- source_word: בַּמַּחֲנֶה
  choice: సైన్యంతో
  rationale: מַחֲנֶה శిబిరాన్నే కాక దానిలోని సైనిక దళాన్ని కూడా సూచించగలదు. బయలుదేరే సందర్భంలో ‘సైన్యంతో’ సహజమైన తెలుగు; ప్రత్యక్షమైన ‘శిబిరంతో’ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: אַתָּה וַאֲנָשֶׁיךָ
  choice: నువ్వూ నీ మనుషులూ
  rationale: దావీదును ప్రత్యేకంగా నొక్కిచెప్పే స్వతంత్ర సర్వనామాన్నీ, అతని అనుచరులనూ స్పష్టంగా నిలుపుతుంది.
- source_word: אָכִישׁ
  choice: ఆకీషు
  rationale: హీబ్రూ పేరుకు సమీపంగా ఉండే, తెలుగులో సులభంగా పలికే లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ఆకీషు దావీదును నేరుగా సంబోధిస్తున్నందున ‘నువ్వు’ రూపం వాడబడింది. హీబ్రూలోని శిబిరం/సైనిక దళం అనే ద్వంద్వార్థం పాదసూచికతో నిలుపబడింది.
