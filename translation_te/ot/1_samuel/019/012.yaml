lexical_decisions:
- source_word: וַתֹּרֶד
  choice: కిందికి దించింది
  rationale: హిఫీల్ రూపంలోని ‘కిందికి దింపింది’ అనే causative భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעַד הַחַלּוֹן
  choice: కిటికిగుండా
