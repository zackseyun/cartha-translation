id: 1SA.19.16
reference: 1 Samuel 19:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ הַ/מַּלְאָכִ֔ים וְ/הִנֵּ֥ה הַ/תְּרָפִ֖ים אֶל הַ/מִּטָּ֑ה וּ/כְבִ֥יר הָ/עִזִּ֖ים מְרַאֲשֹׁתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/016.yaml
  text: When the messengers came in[a], behold, the teraphim was in the bed[b], with the quilt of goats’ hair at its head.
translation:
  language: te
  text: దూతలు లోపలికి వచ్చినప్పుడు, ఇదిగో, మంచం మీద తెరాఫీము[a] ఉంది; దాని తలవద్ద మేకవెంట్రుకలతో చేసిన కప్పు[b] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తెరాఫీము” అనేది గృహారాధనలో ఉపయోగించే ప్రతిమను లేదా గృహవిగ్రహాన్ని సూచించే హీబ్రూ పదం.
    reason: lexical_alternative
  - marker: b
    text: “కప్పు” అని అనువదించిన హీబ్రూ పదం అరుదైనది. అది మరింత సాధారణంగా అల్లిన కప్పును లేదా వలలాంటి వస్తువును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: దూతలు
  rationale: ఈ సందర్భంలో ఇది సౌలు పంపిన మానవ ప్రతినిధులను సూచిస్తుంది. ‘దూతలు’ అనే సాధారణ తెలుగు పదం మూలపదంలోని ‘పంపబడినవారు/సందేశహరులు’ అనే విస్తృత భావాన్ని నిలుపుతుంది; ఇక్కడ దేవదూతలు ఉద్దేశించబడలేదు.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: వారు అకస్మాత్తుగా కనుగొన్న దృశ్యాన్ని సజీవంగా చూపించే హీబ్రూ సూచక అవ్యయ బలాన్ని నిలుపుతుంది.
- source_word: הַתְּרָפִים
  choice: తెరాఫీము
  rationale: ఇది గృహారాధనకు సంబంధించిన ప్రత్యేక సాంస్కృతిక వస్తువును సూచించే హీబ్రూ పదం. లిప్యంతరీకరణ దాని పరిమాణం లేదా ఖచ్చితమైన ఉపయోగాన్ని అనవసరంగా నిర్ణయించకుండా ఉంచుతుంది; అర్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: אֶל הַמִּטָּה
  choice: మంచం మీద
  rationale: אֶל సాధారణంగా ‘వైపు/కు’ అని అర్థమైనా, ఈ కనుగొనబడిన దృశ్యంలో తెరాఫీము శరీరానికి బదులుగా మంచం మీద ఉంచబడిందనే స్థానార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וּכְבִיר הָעִזִּים
  choice: మేక వెంట్రుకలతో చేసిన అల్లిక కప్పు
  rationale: כְבִיר అరుదైన పదం; ఇది అల్లిన కప్పు లేదా వలలాంటి వస్తువును సూచించే అవకాశముంది. సందర్భంలో మంచం దగ్గర ఉంచిన వస్తువుగా దాని సాధ్యమైన రూపం, పని రెండింటినీ ఈ అనువాదం సహజంగా తెలియజేస్తుంది; అనిశ్చితిని పాదసూచికలో ఉంచుతుంది.
- source_word: מְרַאֲשֹׁתָיו
  choice: దాని తలవైపు
  rationale: అక్షరార్థంగా ‘దాని తల ఉండే చోటు.’ సమీప సూచ్యం మంచం మీదున్న తెరాఫీము కాబట్టి, నిజమైన మనిషి అక్కడ ఉన్నాడనే భావం రాకుండా నపుంసక సూచనను వాడింది.
theological_decisions:
- issue: గృహారాధన లేదా విగ్రహారాధనతో సంబంధమున్న תְּרָפִים పదాన్ని ఎలా అనువదించాలి
  choice: తెరాఫీము
  alternative: గృహవిగ్రహం; విగ్రహ ప్రతిమ
  rationale: వాక్యం ఆ వస్తువుకు పేరు చెబుతుంది గాని దానిపై ప్రత్యక్ష వ్యాఖ్య చేయదు. లిప్యంతరీకరణ సాంస్కృతిక ప్రత్యేకతను, కొంత అర్థ అనిశ్చితిని నిలుపుతుంది; పాదసూచిక దాని సాధ్యమైన భావాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని వాడింది. ‘ఇదిగో’ మూలంలోని ఆకస్మిక కనుగొనికను నిలుపుతుంది. సాంస్కృతిక పదమైన ‘తెరాఫీము’ను పాదసూచికతో స్పష్టం చేసింది; అరుదైన כְבִיר పదంలోని నిజమైన అనిశ్చితిని కూడా దాచలేదు.
