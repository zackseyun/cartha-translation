source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ שָׁא֨וּל מַלְאָכִ֜ים אֶל בֵּ֤ית דָּוִד֙ לְ/שָׁמְר֔/וֹ וְ/לַ/הֲמִית֖/וֹ בַּ/בֹּ֑קֶר וַ/תַּגֵּ֣ד לְ/דָוִ֗ד מִיכַ֤ל אִשְׁתּ/וֹ֙ לֵ/אמֹ֔ר אִם אֵ֨ינְ/ךָ֜ מְמַלֵּ֤ט אֶֽת נַפְשְׁ/ךָ֙ הַ/לַּ֔יְלָה מָחָ֖ר אַתָּ֥ה מוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
translation:
  language: te
  text: 'అప్పుడు సౌలు దావీదు ఇంటికి అతనిపై నిఘా ఉంచడానికి, ఉదయాన్నే అతణ్ణి చంపడానికి దూతలను పంపాడు. దావీదు భార్య మీకాలు దావీదుతో ఇలా చెప్పింది: “ఈ రాత్రి నువ్వు నీ ప్రాణాన్ని కాపాడుకోకపోతే[a], రేపు నిన్ను చంపివేస్తారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ రాత్రి నువ్వు ప్రాణంతో తప్పించుకోకపోతే, రేపు నిన్ను చంపివేస్తారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: మనుష్యులను
  rationale: ఈ కథన సందర్భంలో వీరు సౌలు పంపిన మానవ ప్రతినిధులు; దేవదూతలు కాదు. సహజమైన తెలుగులో ‘మనుష్యులను పంపాడు’ వారి పాత్రను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְשָׁמְרוֹ
  choice: దావీదును కనిపెట్టుకొని ఉండి
  rationale: ఇక్కడ שׁמר రక్షణార్థక కాపలా కాకుండా, అతణ్ణి తప్పించుకోనివ్వకుండా ఇంటిపై నిఘా ఉంచడాన్ని సూచిస్తుంది.
- source_word: וְלַהֲמִיתוֹ
  choice: అతణ్ణి చంపడానికి
  rationale: מות హిఫిల్ రూపం ‘చనిపోయేలా చేయడం/చంపడం’ అనే ప్రత్యక్ష భావాన్ని ఇస్తుంది; కుట్ర సందర్భానికి ఇది స్పష్టమైన ఆధునిక తెలుగు.
- source_word: בַּבֹּקֶר
  choice: ఉదయాన
  rationale: చంపాలని ఉద్దేశించిన సమయాన్ని సూచించే సహజమైన తెలుగు కాలప్రయోగం.
- source_word: וַתַּגֵּד
  choice: చెప్పింది
  rationale: మీకాలు ఇచ్చిన హెచ్చరికను సరళమైన కథన తెలుగులో తెలియజేస్తుంది; హెచ్చరిక తీవ్రత ప్రత్యక్ష వాక్యంలోనే వ్యక్తమవుతుంది.
- source_word: מִיכַל אִשְׁתּוֹ
  choice: దావీదు భార్య మీకాలు
  rationale: మీకాలు ఎవరో స్పష్టంగా గుర్తిస్తూ, తెలుగులో సహజమైన పదక్రమాన్ని అనుసరిస్తుంది.
- source_word: מְמַלֵּט אֶת־נַפְשְׁךָ
  choice: నీ ప్రాణాన్ని కాపాడుకోకపోతే
  rationale: ‘నీ ప్రాణాన్ని తప్పించు/విడిపించు’ అనే హీబ్రూ నుడికారాన్ని సహజంగా అందిస్తుంది; ‘ప్రాణంతో తప్పించుకోకపోతే’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַלַּיְלָה
  choice: ఈ రాత్రే
  rationale: ప్రస్తుత రాత్రిని సూచిస్తుంది; ‘ఏ’ వలన హెచ్చరికలోని తక్షణ ఆవశ్యకత సహజంగా వ్యక్తమవుతుంది.
- source_word: מוּמָת
  choice: నిన్ను చంపేస్తారు
  rationale: మానవ కర్తల చేతిలో సంభవించే మరణాన్ని సూచించే హీబ్రూ పాసివ్ భావాన్ని తెలుగులో సహజమైన అనిర్దిష్ట బహువచన కర్తతో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘కాపలా’ అనే పదం రక్షణార్థంగా అపార్థమయ్యే అవకాశం ఉన్నందున శత్రుత్వపూర్వక నిఘాను ‘కనిపెట్టుకొని ఉండి’ అని తెలిపాం. ప్రధాన వాక్యంలోని [a] గుర్తు సంబంధిత పాదసూచికకు సరిగ్గా జతచేయబడింది.
