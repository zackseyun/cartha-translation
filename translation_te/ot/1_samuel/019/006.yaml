  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘యోనాతాను మాట విన్నాడు’ అనే రూపం హీబ్రూ నుడికారంలోని ఆలకించి అంగీకరించిన భావాన్ని అందిస్తుంది. ప్రత్యక్ష వాక్యంలో మూలంలోని గంభీరమైన ప్రమాణ స్వరాన్ని నిలిపాం.
