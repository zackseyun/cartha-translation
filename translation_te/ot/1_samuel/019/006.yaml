translation:
  language: te
  text: సౌలు యోనాతాను మాట విన్నాడు. అప్పుడు సౌలు, “యాహ్వే జీవముతోడు, అతడు చంపబడడు” అని ప్రమాణం చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
