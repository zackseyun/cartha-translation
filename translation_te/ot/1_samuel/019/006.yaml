    text: 'హీబ్రూలో ఇది అసంపూర్ణ ప్రమాణ సూత్రం: “యాహ్వే జీవముతోడు, అతడు చంపబడితే…” ప్రమాణంలో మిగిలిన శాపభాగాన్ని చెప్పకుండా వదిలేయడం వల్ల, “అతడు ఎంతమాత్రమూ చంపబడడు” అనే బలమైన నిరాకరణ వ్యక్తమవుతుంది.'
    reason: హీబ్రూ ప్రమాణ సూత్రంలోని అక్షరార్థ రూపాన్నీ, దాని ఉద్దేశిత బలమైన నిరాకరణనూ చూపించడానికి.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: మాట విన్నాడు
  rationale: שׁמע ఇక్కడ కేవలం శబ్దం వినడాన్ని కాకుండా యోనాతాను విజ్ఞప్తిని ఆలకించి అంగీకరించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మాట విన్నాడు’ ఈ స్పందనాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּקוֹל יְהוֹנָתָן
  choice: యోనాతాను మాట
  rationale: ‘ఒకరి స్వరం వినడం’ అనే హీబ్రూ ప్రయోగం సందర్భంలో వారి మాటను ఆలకించడం లేదా అనుసరించడం అనే అర్థం ఇస్తుంది. పదబద్ధమైన ‘యోనాతాను స్వరాన్ని’ కంటే ‘యోనాతాను మాట’ తెలుగులో సహజం.
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేశాడు
  rationale: ఈ క్రియ గంభీరమైన ఒట్టు లేదా ప్రమాణం చేయడాన్ని సూచిస్తుంది; ప్రత్యక్ష వాక్యంతో సహజంగా కలిసే ప్రామాణిక తెలుగు రూపం ఇది.
- source_word: חַי יְהוָה
  choice: యాహ్వే జీవం తోడు
  rationale: ఇది యాహ్వే జీవిస్తున్నాడనే సత్యంపై ఆధారపడిన హీబ్రూ ప్రమాణ సూత్రం. ‘జీవం తోడు’ అనే తెలుగు ప్రమాణ ప్రయోగం దాని గంభీరతను సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ పాఠంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אִם יוּמָת
  choice: అతడు చంపబడడు
  rationale: ప్రమాణ వాక్యాల్లో אִם అసంపూర్ణ ప్రమాణ సూత్రంగా బలమైన నిరాకరణను తెలియజేస్తుంది. מות యొక్క హోఫల్ రూపం ‘చనిపోవడం’ కంటే ‘చంపబడడం’ అనే కర్మణి భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, సాధారణంగా గుర్తించదగిన ‘యాహ్వే’ రూపంలో లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: అసంపూర్ణ ప్రమాణ సూత్రం אִם יוּמָת
  choice: అతడు చంపబడడు
  alternative: అతడు చంపబడితే…
  rationale: హీబ్రూ రూపం అక్షరార్థంగా షరతుతో మొదలై శాపభాగాన్ని చెప్పకుండా వదిలేస్తుంది; అయితే ప్రమాణ సందర్భంలో దాని ఉద్దేశం బలమైన నిరాకరణ. ప్రధాన పాఠంలో అర్థాన్ని సహజంగా ఇచ్చి, రూప సంబంధమైన ఉద్వేగాన్ని పాదసూచికలో నిలిపాం.
