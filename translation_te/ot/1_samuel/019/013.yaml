translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. అరుదైన כְּבִיר పదానికి అతిగా నిర్దిష్టమైన అర్థం విధించకుండా మూలంలోని అనిశ్చితిని ప్రధాన పాఠ్యం మరియు పాదసూచికలో నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
