  text: וַ/תִּקַּ֨ח מִיכַ֜ל אֶת הַ/תְּרָפִ֗ים וַ/תָּ֨שֶׂם֙ אֶל הַ/מִּטָּ֔ה וְ/אֵת֙ כְּבִ֣יר הָֽ/עִזִּ֔ים שָׂ֖מָה מְרַֽאֲשֹׁתָ֑י/ו וַ/תְּכַ֖ס בַּ/בָּֽגֶד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/013.yaml
  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
translation:
  language: te
  text: అప్పుడు మీకాలు ఇంట్లో ఉంచే ఆ విగ్రహాన్ని తీసుకొని మంచం మీద పెట్టింది. దాని తలవద్ద మేక వెంట్రుకలతో చేసిన ఒక వస్తువును[a] ఉంచి, దానిని ఆ వస్త్రంతో కప్పింది. [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదానికి ఖచ్చితమైన అర్థం తెలియదు. అది మేక వెంట్రుకలతో అల్లిన కప్పే వస్త్రం, వల, దిండు లేదా తలవద్ద ఉంచే ఇలాంటి వస్తువును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇంట్లో ఉంచే విగ్రహం’కు హీబ్రూలో ‘తెరాఫీము’ అనే పదం ఉంది. ఇది గృహారాధనకు సంబంధించిన విగ్రహాలను లేదా పూజా వస్తువులను సూచిస్తుంది; ఇక్కడ అది మంచంలో ఒకే ఆకృతిగా ఉపయోగించబడినట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: ఆ ఇంటి విగ్రహం
  rationale: תְּרָפִים రూపపరంగా బహువచనమైనా, ఈ సందర్భంలో మంచం మీద ఉంచిన ఒక ఆకృతిగా పనిచేస్తోంది. ఆధునిక పాఠకునికి అర్థమయ్యేలా ‘ఇంటి విగ్రహం’ అని అనువదించాం; ఇది గృహారాధనకు సంబంధించిన వస్తువు అనే భావాన్ని తెలియజేస్తుంది.
- source_word: אֶל הַמִּטָּה
  choice: మంచం మీద
  rationale: אֶל సాధారణంగా ‘వైపు/లోనికి’ అని అర్థమిచ్చినా, שׂים క్రియతో ఈ సందర్భంలో మంచం మీద ఉంచడమే సహజమైన భావం.
- source_word: כְּבִיר הָעִזִּים
  choice: మేక వెంట్రుకలతో చేసిన ఒక వస్తువు
  rationale: כְּבִיר అరుదైన, అర్థం నిర్ధారించడం కష్టమైన పదం. అది వల, అల్లిన కప్పు, దిండు లేదా తలవైపు ఉంచే ఇలాంటి వస్తువై ఉండవచ్చు. ప్రధాన పాఠ్యంలో అనిశ్చితిని నిలుపుతూ సాధారణ పదబంధం వాడాం.
- source_word: מְרַאֲשֹׁתָיו
  choice: దాని తలవైపు
  rationale: ఈ పదం తల ఉండే ప్రదేశాన్ని లేదా తలవైపు భాగాన్ని సూచిస్తుంది. సమీప సూచ్యం మంచంలో ఉంచిన విగ్రహం కాబట్టి నపుంసక సూచనను వాడాం.
- source_word: בַּבָּגֶד
  choice: వస్త్రంతో
  rationale: בֶּגֶד సాధారణంగా వస్త్రం లేదా దుస్తును సూచిస్తుంది. నిర్దిష్టంగా ‘అంగీ’ అని చెప్పడానికి ఆధారం లేనందున విస్తృతార్థ పదాన్ని ఎంచుకున్నాం.
- source_word: וַתְּכַס
  choice: కప్పింది
  rationale: כסה క్రియ యొక్క ప్రత్యక్ష, సహజ భావం ‘కప్పడం’; మోసపూరిత ఏర్పాటులో జరిగిన స్పష్టమైన చర్యను ఇది నిలుపుతుంది.
