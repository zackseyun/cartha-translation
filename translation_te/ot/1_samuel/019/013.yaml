review_pass:
  verdict: revise
  source_fidelity: 'The sequence of actions and the principal referents follow the Hebrew closely: Michal places the teraphim on the bed, positions an uncertain goats’-hair item at its head area, and covers it with the garment. Rendering the morphologically plural תְּרָפִים as a singular idol in this scene is defensible. The uncertainty of כְּבִיר is appropriately retained rather than resolved speculatively.'
  naturalness: The Telugu narrative is generally clear and modern. However, the footnote’s ‘కప్పు’ normally means a cup or lid, not a textile covering, and is misleading in this context. ‘దాని తలవద్ద’ is a slightly more natural expression for the head area than ‘దాని తలవైపు.’
  terminology: ‘ఇంట్లో ఉంచే విగ్రహం’ communicates a household cult idol naturally without implying a particular theological interpretation. ‘మేక వెంట్రుకలతో చేసిన ఒక వస్తువు’ appropriately preserves lexical uncertainty. ‘ఆ వస్త్రంతో’ reflects the Hebrew definite article while remaining natural.
  issues:
  - severity: medium
    issue: Footnote a uses ‘కప్పు’ as a proposed meaning for כְּבִיר.
    rationale: In modern Telugu, ‘కప్పు’ ordinarily denotes a cup or lid. It does not naturally convey the possible woven covering/textile item indicated by the Hebrew-contextual alternatives. Replacing it with ‘కప్పే వస్త్రం’ avoids a false lexical suggestion.
  - severity: low
    issue: The wording for the head location can be made more idiomatic.
    rationale: ‘దాని తలవద్ద’ naturally denotes placement at the head/headrest area and preserves the source’s ambiguity about the exact configuration.
