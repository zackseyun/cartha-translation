- from: అప్పుడు మీకాలు ఆ ఇంటి విగ్రహాన్ని తీసుకొని మంచం మీద పెట్టింది. దాని తలవైపు మేక వెంట్రుకలతో చేసిన ఒక వస్తువును[a] ఉంచి, దానిని వస్త్రంతో కప్పింది.[b]
