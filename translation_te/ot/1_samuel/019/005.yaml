source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
translation:
  language: te
  text: అతడు తన ప్రాణాన్ని అరచేతిలో పెట్టుకొని ఫిలిష్తీయుణ్ణి హతమార్చాడు.[a] యాహ్వే ఇశ్రాయేలంతటికీ గొప్ప రక్షణ కలిగించాడు.[b] నీవు అది చూసి సంతోషించావు. మరి ఏ కారణమూ లేకుండా[c] దావీదును చంపి, నిర్దోషి రక్తం చిందించే పాపం నీవు ఎందుకు చేయాలి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, “తన ప్రాణాన్ని పణంగా పెట్టుకొని”; అక్షరార్థంగా, “తన ప్రాణాన్ని తన అరచేతిలో పెట్టుకొని.”
    reason: lexical_alternative
  - marker: b
    text: “గొప్ప రక్షణ” అనే మాటను “గొప్ప విజయం” లేదా “గొప్ప విమోచన” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నిష్కారణంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  choice: తన ప్రాణాన్ని అరచేతిలో పెట్టుకొని
  rationale: హీబ్రూ జాతీయాన్ని దాని సజీవమైన దృశ్యంతో నిలుపుతూ, ప్రాణాన్ని పణంగా పెట్టాడనే భావాన్ని సందర్భం ద్వారా తెలియజేస్తుంది.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: ఫిలిష్తీయుణ్ణి హతమార్చాడు
  rationale: ఈ సందర్భంలో נכה అనేది గోల్యాతును కొట్టి చంపిన కార్యాన్ని సూచిస్తుంది; ‘హతమార్చాడు’ ఫలితాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: గొప్ప రక్షణ
  rationale: యుద్ధవిజయం అనే తక్షణ భావంతోపాటు విమోచన, రక్షణ అనే విస్తృత భావాన్ని కూడా నిలుపుతుంది.
- source_word: רָאִיתָ וַתִּשְׂמָח
  choice: నీవు అది చూసి సంతోషించావు
  rationale: సౌలుతో నేరుగా మాట్లాడే ఏకవచన సంబోధనను నిలిపి, తెలుగులో సహజత కోసం సందర్భసిద్ధమైన కర్మను చేర్చింది.
- source_word: בְּדָם נָקִי
  choice: నిర్దోషి రక్తం విషయంలో
  rationale: హీబ్రూ న్యాయ-నైతిక భావాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది; వెంట వచ్చే దావీదును చంపడం అనే మాట దాని అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: חִנָּם
  choice: ఏ కారణమూ లేకుండా
  rationale: దావీదును చంపడానికి న్యాయమైన కారణం లేదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; అందుచేత దానిని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించాం.
- issue: సైనిక సందర్భంలో תְּשׁוּעָה
  choice: గొప్ప రక్షణ
  alternative: గొప్ప విజయం / గొప్ప విమోచన
  rationale: ఇక్కడ యుద్ధవిజయం ఉద్దేశంలో ఉన్నప్పటికీ, హీబ్రూ పదంలోని దైవిక రక్షణ అనే విస్తృత ప్రతిధ్వనిని ‘రక్షణ’ నిలుపుతుంది.
- issue: בְּדָם נָקִי లోని రక్తదోష భావం
  choice: నిర్దోషి రక్తం విషయంలో పాపం చేయడం
  alternative: నిర్దోషి రక్తాన్ని చిందించి పాపం చేయడం
  rationale: ప్రత్యామ్నాయం భావాన్ని స్పష్టీకరిస్తుంది గాని, మూలంలో ‘చిందించడం’ అనే క్రియ ప్రత్యక్షంగా లేదు; ప్రధాన పాఠం హీబ్రూ నిర్మాణాన్ని, దాని న్యాయపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘అరచేతిలో పెట్టుకొని’ అనే మూలభాషా రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపి, దాని భావాన్ని పాదటిప్పణిలో ఇచ్చాం. వాక్యాంతంలోని ప్రశ్న సౌలు చేయబోయే అన్యాయాన్ని నిలదీసే నైతిక తీవ్రతను నిలుపుతుంది.
