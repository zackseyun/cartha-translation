  naturalness: ‘యోనాతాను దావీదుకు ఇలా తెలియజేశాడు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది. ‘ఉదయం జాగ్రత్తగా ఉండు’ అనేది ‘ఉదయాన’ కంటే సాధారణ ఆధునిక వాడుకకు మరింత అనుకూలం. ‘రహస్య స్థలంలో ఉండి దాక్కో’ మూలంలోని స్థలార్థాన్నీ పునరుక్త ఆదేశాన్నీ నిలుపుతుంది.
