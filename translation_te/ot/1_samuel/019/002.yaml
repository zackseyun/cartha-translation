id: 1SA.19.2
reference: 1 Samuel 19:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּגֵּ֤ד יְהוֹנָתָן֙ לְ/דָוִ֣ד לֵ/אמֹ֔ר מְבַקֵּ֛שׁ שָׁא֥וּל אָבִ֖/י לַ/הֲמִיתֶ֑/ךָ וְ/עַתָּה֙ הִשָּֽׁמֶר נָ֣א בַ/בֹּ֔קֶר וְ/יָשַׁבְתָּ֥ בַ/סֵּ֖תֶר וְ/נַחְבֵּֽאתָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/002.yaml
  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
translation:
  language: te
  text: 'యోనాతాను దావీదుకు ఇలా తెలియజేశాడు: “నా తండ్రి సౌలు నిన్ను చంపాలని చూస్తున్నాడు. కాబట్టి ఇప్పుడు, దయచేసి ఉదయం జాగ్రత్తగా ఉండు; రహస్య స్థలంలో ఉండి దాక్కో.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాగి ఉండు.” హీబ్రూలో ‘ఉండు’ అనే క్రియతో ‘రహస్యం’ లేదా ‘దాగుడు స్థలం’ అనే అర్థమున్న నామవాచకం వచ్చి, దాని తర్వాత నొక్కిచెప్పేందుకు ‘దాక్కో’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד ... לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ భాషలోని ‘తెలియజేశాడు—అంటూ’ అనే వాక్యారంభ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో ప్రత్యక్ష సంభాషణకు తగినట్లుగా అందిస్తుంది.
- source_word: מְבַקֵּשׁ
  choice: చంపాలని చూస్తున్నాడు
  rationale: కృదంత రూపంలోని కొనసాగుతున్న ప్రస్తుత ఉద్దేశాన్ని తెలియజేస్తుంది; హత్యాయత్నం ఇప్పటికే మొదలైందని అదనంగా నిర్ధారించదు.
- source_word: לַהֲמִיתֶךָ
  choice: నిన్ను చంపాలని
  rationale: హిఫీల్ రూపం ఇక్కడ ‘చనిపోయేలా చేయడం,’ అంటే సహజంగా ‘చంపడం’ అనే అర్థం ఇస్తుంది; అధికారిక మరణశిక్ష భావాన్ని అనవసరంగా చేర్చదు.
- source_word: הִשָּׁמֶר נָא
  choice: దయచేసి ... జాగ్రత్తగా ఉండు
  rationale: ప్రతిబింబార్థక హెచ్చరికను ‘జాగ్రత్తగా ఉండు’ అని, נָא ఇచ్చే విజ్ఞప్తి స్వరాన్ని ‘దయచేసి’ అని ప్రతిబింబిస్తుంది.
- source_word: בַבֹּקֶר
  choice: ఉదయాన
  rationale: హీబ్రూ పదబంధంలోని ‘ఉదయంలో’ అనే సాధారణ కాలార్థాన్ని ఉంచుతుంది; మూలంలో స్పష్టంగా లేని ‘రేపు’ అనే విశేషణాన్ని చేర్చదు.
- source_word: וְיָשַׁבְתָּ בַסֵּתֶר
  choice: రహస్య ప్రదేశంలో ఉండి
  rationale: ישב యొక్క సందర్భోచితమైన ‘ఉండు/నిలిచి ఉండు’ భావాన్నీ, סֵתֶר యొక్క స్థలార్థమైన దాగుడు లేదా రహస్య ప్రదేశ భావాన్నీ సహజంగా అందిస్తుంది.
- source_word: וְנַחְבֵּאתָ
  choice: దాక్కో
  rationale: ‘తన్ను తాను దాచుకోవడం’ అనే క్రియార్థాన్ని నేరుగా, సహజంగా అందిస్తుంది; ముందున్న పదబంధంతో కలసి ఆదేశాన్ని బలపరుస్తుంది.
- source_word: יְהוֹנָתָן ... לְדָוִד ... שָׁאוּל אָבִי
  choice: యోనాతాను ... దావీదు ... నా తండ్రి సౌలు
  rationale: వ్యక్తుల పేర్లను ప్రామాణిక తెలుగు రూపాల్లో ఇస్తూ, యోనాతాను పలికిన ‘నా తండ్రి’ అనే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రత్యక్ష సంభాషణ సహజంగా ఉండేలా హీబ్రూ వాక్యారంభ సూత్రాన్ని సంక్షిప్తంగా అనువదించాం; మూలంలోని పునరుక్తి బలాన్ని మాత్రం నిలిపాం.
