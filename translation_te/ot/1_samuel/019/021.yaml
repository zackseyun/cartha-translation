  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּגִּ֣דוּ לְ/שָׁא֗וּל וַ/יִּשְׁלַח֙ מַלְאָכִ֣ים אֲחֵרִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵ֑מָּה וַ/יֹּ֣סֶף שָׁא֗וּל וַ/יִּשְׁלַח֙ מַלְאָכִ֣ים שְׁלִשִׁ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/021.yaml
  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
translation:
  language: te
  text: వారు సౌలుకు తెలియజేసినప్పుడు, అతడు ఇతర దూతలను పంపాడు; వారు కూడా ప్రవచించారు. అప్పుడు సౌలు మరోసారి—మూడోసారి—దూతలను పంపాడు; వారు కూడా ప్రవచించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: ఆ సంగతి సౌలుకు తెలియజేయబడినప్పుడు
  rationale: נגד హిఫిల్ రూపానికి ‘తెలియజేయడం/వార్త చెప్పడం’ అనే అర్థం ఉంది. కర్త ఎవరో వచనంలో స్పష్టంగా లేకపోవడంతో సహజమైన తెలుగు కర్మణి నిర్మాణం ఆ అనిశ్చితిని నిలుపుతుంది; సందర్భంలోని కాలానుక్రమ సంబంధాన్ని ‘అప్పుడు’ నిర్మాణం తెలియజేస్తుంది.
- source_word: מַלְאָכִים אֲחֵרִים
  choice: వేరే దూతలను
  rationale: ఇక్కడ מַלְאָכִים మానవ ప్రతినిధులను సూచిస్తుంది; ‘దూతలు’ ఆధునిక తెలుగు బైబిలు వాడుకలో సహజంగా ఉంటుంది. אֲחֵרִים బహువచన భావాన్ని ‘వేరే’ తెలియజేస్తుంది.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: వారు కూడా ప్రవచించారు
  rationale: నבא హిత్పయేల్ రూపాన్ని విస్తృతమైన ‘ప్రవచించారు’ అని అనువదించడం ద్వారా ఆ ప్రవచన అనుభవం ఎలాంటి రూపంలో వ్యక్తమైందో నిర్ణయించకుండా ఉంచాం. גַּם הֵמָּה లోని సమాంతర ఉద్ఘాటనను ‘వారు కూడా’ నిలుపుతుంది.
- source_word: וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח
  choice: సౌలు ... పంపాడు
  rationale: יסף పునరావృత చర్యను సూచిస్తుంది. వెంట వచ్చే שְׁלִשִׁים తో కలిపి ‘మూడోసారి’ అని చెప్పడం వల్ల తెలుగులో అనవసరమైన ద్విరుక్తి లేకుండా అదే భావం స్పష్టమవుతుంది.
- source_word: מַלְאָכִים שְׁלִשִׁים
  choice: మూడోసారి దూతలను
  rationale: שְׁלִשִׁים ఇక్కడ సందర్భానుసారంగా ‘మూడవవారు/మూడవసారి పంపినవారు’ అనే క్రమసంఖ్యా భావాన్ని ఇస్తుంది; ‘ముప్పై’ అని కాదు. ‘మూడోసారి దూతలను పంపాడు’ అనేది సహజమైన, స్పష్టమైన తెలుగు రూపం.
theological_decisions:
- issue: సౌలు పంపిన దూతల ప్రవచన క్రియ స్వరూపం
  choice: ‘ప్రవచించారు’ అని తటస్థంగా అనువదించడం
  alternative: ‘పరవశించి ప్రవచించారు’ లేదా ‘ప్రవక్తల్లా ప్రవర్తించారు’
  rationale: ఈ వచనం ఆత్మ ప్రభావంతో జరిగిన ప్రవచన సంఘటనను సూచించినా, అది పరవశ వాక్కా, స్తుతియా, లేక మరేదైనా రూపమా అని వివరించదు. కాబట్టి మూలంలోని విస్తృత భావాన్నీ ధార్మిక ఉద్రిక్తతనూ నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలో స్పష్టంగా లేని మొదటి క్రియ కర్తను ఊహించకుండా కర్మణి వాక్యం వాడాం. ఈ ముసాయిదాలో పాదసూచికలు అవసరం లేదు.
