source:
  edition: WLC
  text: וְ/דָוִ֨ד בָּרַ֜ח וַ/יִּמָּלֵ֗ט וַ/יָּבֹ֤א אֶל שְׁמוּאֵל֙ הָ/רָמָ֔תָ/ה וַ/יַּ֨גֶּד ל֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר עָֽשָׂה ל֖/וֹ שָׁא֑וּל וַ/יֵּ֤לֶךְ הוּא֙ וּ/שְׁמוּאֵ֔ל וַ/יֵּשְׁב֖וּ ב/נוית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
translation:
  language: te
  text: దావీదు పారిపోయి తప్పించుకున్నాడు. అతడు రామాలో ఉన్న సమూయేలు దగ్గరకు వచ్చి, సౌలు తనకు చేసినదంతా అతనికి చెప్పాడు. తరువాత అతడూ సమూయేలూ వెళ్లి నాయోతులో[a] నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నాయోతు’ అనేది హెబ్రీ స్థలనామం. అది రామాతో సంబంధమున్న నివాసాలను లేదా ఒక నివాస ప్రాంతాన్ని సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרַח
  choice: పారిపోయి
  rationale: ప్రమాదం నుంచి పారిపోవడం అనే మూలార్థాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: וַיִּמָּלֵט
  choice: తప్పించుకున్నాడు
  rationale: పారిపోవడం విజయవంతమైందనే ఫలితాన్ని తెలియజేస్తుంది; వాక్యంలో స్పష్టంగా లేని దైవిక విమోచన భావాన్ని చేర్చదు.
- source_word: הָרָמָתָה
  choice: రామాలో ఉన్న
  rationale: దిశను సూచించే రూపం రామా వైపు వచ్చినట్లు తెలియజేస్తుంది; సమూయేలు ప్రధాన గమ్యవ్యక్తి కావడంతో ‘రామాలో ఉన్న సమూయేలు దగ్గరకు’ అనేది సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: וַיַּגֶּד לוֹ
  choice: అతనికి చెప్పాడు
  rationale: నివేదించడం లేదా తెలియజేయడం అనే సాధారణ కథనార్థానికి సరళమైన ఆధునిక తెలుగు రూపం.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  choice: సౌలు తనకు చేసినదంతా
  rationale: כָּל యొక్క సమగ్రతను, దావీదుపై సౌలు చేసిన క్రియలను అలంకరణ లేకుండా నిలుపుతుంది.
- source_word: וַיֵּלֶךְ הוּא וּשְׁמוּאֵל
  choice: తరువాత అతడూ సమూయేలూ వెళ్లి
  rationale: స్పష్టమైన הוּא వల్ల ఏర్పడే సంయుక్త కర్తను నిలుపుతూ, వరుసగా జరిగిన చర్యను సహజమైన తెలుగు కథనంలో చూపుతుంది.
- source_word: וַיֵּשְׁבוּ
  choice: నివసించారు
  rationale: మూల క్రియకు ‘కూర్చున్నారు/నివసించారు/ఉన్నారు’ అనే అర్థపరిధి ఉంది; ఈ ప్రయాణ సందర్భంలో కొంతకాలం అక్కడ ఉండడాన్ని ‘నివసించారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנוָיֹות
  choice: నాయోతులో
  rationale: దీనిని స్థలనామంగా లిప్యంతరీకరించి, בְּ ఉపసర్గను తెలుగు స్థానవాచక ‘లో’తో వ్యక్తం చేసింది.
