translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హెబ్రీ వాక్యంలోని వరుస చర్యలు స్పష్టంగా ఉండేలా చిన్న వాక్యాలుగా విభజించబడ్డాయి. స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించి, దాని సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
