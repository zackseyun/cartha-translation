- from: 'సౌలుకు ఈ సమాచారం అందింది: “ఇదిగో, దావీదు రామాలోని నాయోతులో ఉన్నాడు.”'
  to: 'సౌలుకు ఇలా తెలియజేయబడింది: “ఇదిగో, దావీదు రామాలోని నాయోతులో ఉన్నాడు.”'
  rationale: A small revision more closely reflects the Hebrew passive narrative verb and quotative construction, while retaining the draft’s accurate names, locative relationship, and modern Telugu register.
