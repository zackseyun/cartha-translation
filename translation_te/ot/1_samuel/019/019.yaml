  text: And it was reported to Saul[a], saying, “Look, David is at Naioth in Ramah.”
translation:
  language: te
  text: 'సౌలుకు ఇలా తెలియజేయబడింది: “ఇదిగో, దావీదు రామాలోని నాయోతులో ఉన్నాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: ఈ సమాచారం అందింది
  rationale: ఎవరు తెలియజేశారో చెప్పకుండా, సమాచారాన్ని సౌలుకు తెలియజేసినట్లు సూచించే హీబ్రూ కర్మణి రూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לְשָׁאוּל
  choice: సౌలుకు
  rationale: వ్యక్తి పేరుతో ఉన్న పరోక్ష కర్మను తెలుగులో సహజంగా చతుర్థీ విభక్తితో వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: అనే ఉద్దేశాన్ని ద్విబిందువు ద్వారా వ్యక్తీకరించడం
  rationale: హీబ్రూ ఉక్తి-పరిచయ పదాన్ని తెలుగులో కృత్రిమంగా ‘ఇలా చెబుతూ’ అని ఉంచకుండా, ప్రత్యక్ష ఉక్తిని పరిచయం చేసే ద్విబిందువుతో సహజంగా వ్యక్తం చేసింది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: వార్తలోని విషయంపై దృష్టి నిలిపే హీబ్రూ సూచక అవ్యయపు తక్షణతను గౌరవప్రదమైన, ఇప్పటికీ అర్థమయ్యే తెలుగులో నిలుపుతుంది.
- source_word: דָוִד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తి పేరు రూపం.
- source_word: בְּנוָיֹת
  choice: నాయోతులో
  rationale: בְ యొక్క స్థానార్థాన్ని ‘లో’తో వ్యక్తం చేస్తూ, నాయోతును స్థల నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: בָּרָמָה
  choice: రామాలోని
  rationale: నాయోతు రామా పరిధిలో ఉన్నదని తెలిపే స్థాన సంబంధాన్ని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ కర్మణి భావం నిలుపబడింది; సమాచారాన్ని తెలిపిన వ్యక్తిని వచనం పేర్కొననందున అనవసరంగా చేర్చలేదు. ‘రామాలోని నాయోతు’ అనే నిర్మాణం రెండు స్థలనామాల సంబంధాన్ని సాధారణ పాఠకునికి స్పష్టంగా చేస్తుంది.
