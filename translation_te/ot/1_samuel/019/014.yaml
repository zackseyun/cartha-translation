  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
translation:
  language: te
  text: అప్పుడు సౌలు దావీదును పట్టుకోవడానికి దూతలను పంపాడు. ఆమె[a], “అతడు అనారోగ్యంగా ఉన్నాడు” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో కేవలం “ఆమె చెప్పింది” అని ఉంది; సందర్భాన్ని బట్టి ఆ స్త్రీ మీకాలు అని అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... పంపాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని తదుపరి చర్యకు తీసుకెళ్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఈ సందర్భంలో ఇది దేవదూతలను కాక, సౌలు పంపిన మనుష్య ప్రతినిధులను సూచిస్తుంది; ‘దూతలు’ తెలుగు బైబిలు శైలిలోనూ సాధారణ వాడుకలోనూ తగిన పదం.
- source_word: לָקַחַת
  choice: పట్టుకోవడానికి
  rationale: మూల క్రియకు సాధారణంగా ‘తీసుకోవడం’ అనే అర్థం ఉన్నా, ఇక్కడ దావీదును అదుపులోకి తీసుకోవాలనే ఉద్దేశం ఉంది; ‘పట్టుకోవడానికి’ ఆ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת דָּוִד
  choice: దావీదును
  rationale: నేర కర్మ సూచికతో ఉన్న వ్యక్తినామాన్ని తెలుగులో కర్మవిభక్తితో సహజంగా అనువదించాం.
- source_word: וַתֹּאמֶר
  choice: ఆమె ... అని చెప్పింది
  rationale: స్త్రీలింగ ఏకవచన కర్త క్రియారూపంలో సూచితమవుతుంది; సందర్భం వల్ల ఆమె మీకాలు అని తెలుస్తుంది. సాధారణ సంధిని ప్రతిబింబిస్తూ అదనపు విరోధార్థాన్ని చేర్చలేదు.
- source_word: חֹלֶה הוּא
  choice: అతడు జబ్బుగా ఉన్నాడు
  rationale: విశేషణ విధేయం మరియు సర్వనామం కలిపి అనారోగ్య స్థితిని తెలుపుతున్నాయి; ఈ మాట మోసపూరితమని సందర్భం చూపినా, వాక్యం స్వయంగా సాధారణ ప్రకటనగానే ఉంది.
