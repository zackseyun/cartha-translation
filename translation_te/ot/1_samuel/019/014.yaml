translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ సంధికి లేని స్పష్టమైన విరోధార్థాన్ని ‘కాని’ ద్వారా చేర్చకుండా, రెండు వాక్యాలుగా సహజంగా అమర్చాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
