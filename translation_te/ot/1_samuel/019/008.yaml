  edition: WLC
  text: וַ/תּ֥וֹסֶף הַ/מִּלְחָמָ֖ה לִֽ/הְי֑וֹת וַ/יֵּצֵ֨א דָוִ֜ד וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֗ים וַ/יַּ֤ךְ בָּ/הֶם֙ מַכָּ֣ה גְדוֹלָ֔ה וַ/יָּנֻ֖סוּ מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/008.yaml
  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
translation:
  language: te
  text: యుద్ధం మళ్లీ చెలరేగింది[a]. దావీదు బయలుదేరి ఫిలిష్తీయులతో యుద్ధం చేసి, వారికి గొప్ప దెబ్బ కొట్టాడు. దాంతో వారు అతని ఎదుటనుండి పారిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధం కొనసాగింది”; “మళ్లీ యుద్ధం జరిగింది.” హెబ్రీయ పదబంధం అక్షరార్థంగా “యుద్ధం ఉండటానికి మళ్లీ తోడైంది” అని ఉంటుంది; ఇది యుద్ధం తిరిగి మొదలవడాన్నీ లేదా కొనసాగడాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  choice: యుద్ధం మళ్లీ చెలరేగింది
  rationale: יסף + היה అనే హెబ్రీయ ఇడియమ్ యుద్ధం తిరిగి మొదలవడం లేదా కొనసాగడాన్ని సూచిస్తుంది. సందర్భంలో పునరుద్ధరించబడిన పోరాటాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపేందుకు ఈ రూపాన్ని ఎంచుకున్నాం; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיֵּצֵא דָוִד
  choice: దావీదు బయలుదేరి
  rationale: יצא అంటే అక్షరార్థంగా ‘బయలుదేరాడు.’ యుద్ధ సందర్భం గమ్యాన్ని సూచించినా, మూలంలో అది స్పష్టంగా చెప్పబడలేదు; అందువల్ల అదనపు వివరాన్ని చేర్చలేదు.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులతో యుద్ధం చేసి
  rationale: לחם అనే క్రియ ఇక్కడ శత్రువుతో పోరాడటాన్ని సూచిస్తుంది. తెలుగులో ‘ఫిలిష్తీయులతో యుద్ధం చేశాడు’ అనేది సహజంగా విరోధ పోరాటాన్నే తెలియజేస్తుంది.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: వారిని తీవ్రంగా ఓడించాడు
  rationale: נכה + מכה అనే పదబంధం తీవ్రమైన దెబ్బ లేదా ఘోర పరాజయం కలిగించడాన్ని సూచిస్తుంది. ‘తీవ్రంగా ఓడించాడు’ మూలభావాన్ని సహజ తెలుగులో అందిస్తూ, మరణాల సంఖ్యను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: వారు అతని ఎదుట నిలువలేక పారిపోయారు
  rationale: מִפָּנָיו అక్షరార్థంగా ‘అతని సన్నిధి నుండి/అతని ఎదుట నుండి.’ తెలుగులో కేవలం ‘అతని ఎదుట పారిపోయారు’ అసహజంగా ఉండవచ్చు; ‘నిలువలేక’ అనేది అతని ఎదుట నుంచి వెనుదిరిగి పారిపోయిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథన శైలి. హెబ్రీయ మూలంలోని వరుస క్రియలను సహజ తెలుగు వాక్యప్రవాహంగా మలిచాం; పునరారంభం/కొనసాగింపు అనే నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
