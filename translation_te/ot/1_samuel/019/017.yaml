  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
translation:
  language: te
  text: అప్పుడు సౌలు మీకాలుతో, “నన్ను ఇలా ఎందుకు మోసం చేసి, నా శత్రువును పంపించివేసి, అతడు తప్పించుకునేలా చేశావు?” అని అడిగాడు. మీకాలు సౌలుతో, “అతడు నాతో, ‘నన్ను పంపించు. నేను నిన్ను ఎందుకు చంపాలి?’ అన్నాడు” అని చెప్పింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, భావాన్ని మరింత స్పష్టంగా చెబితే: “నన్ను వెళ్లనివ్వు; లేకపోతే నిన్ను చంపుతాను.” హీబ్రూ మూలంలో పదశః, “నన్ను పంపించు. నేను నిన్ను ఎందుకు చంపాలి?” అని ఉంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: רִמִּיתִנִי
  choice: నన్ను ... మోసం చేశావు
  rationale: ఈ క్రియ ఇక్కడ మోసపూరిత చర్యను సూచిస్తుంది. ‘మోసం చేశావు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘ద్రోహం చేశావు’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: כָּכָה
  choice: ఇలా
  rationale: చర్య జరిగిన విధానాన్ని సూచించే ఈ పదానికి ‘ఇలా’ సహజమైన, సంక్షిప్తమైన సమానార్థకం.
- source_word: וַתְּשַׁלְּחִי
  choice: పంపించివేసి
  rationale: שלח యొక్క ‘పంపు/పంపించివేయు’ భావాన్ని నిలుపుతూ, మీకాలు దావీదు వెళ్లిపోవడానికి సహాయం చేసిన సందర్భానికి సరిపోతుంది.
- source_word: אֹיְבִי
  choice: నా శత్రువును
  rationale: సౌలు దావీదును ‘నా శత్రువు’ అని పేర్కొన్న శత్రుత్వభావాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: וַיִּמָּלֵט
  choice: అతడు తప్పించుకునేలా
  rationale: מלט నిఫాల్ రూపంలోని ‘తప్పించుకొను’ భావాన్ని తెలుగులో సహజమైన ఫలిత సంబంధంతో వ్యక్తపరుస్తుంది.
- source_word: שַׁלְּחִנִי
  choice: నన్ను వెళ్లనివ్వు
  rationale: పదశః ‘నన్ను పంపించు’ అయినప్పటికీ, బలవంతంగా ఆపబడిన వ్యక్తి మాటగా ఆధునిక తెలుగులో ‘నన్ను వెళ్లనివ్వు’ సహజంగా ఉంటుంది.
- source_word: לָמָה אֲמִיתֵךְ
  choice: నేను నిన్ను ఎందుకు చంపాలి?
  rationale: హీబ్రూ ప్రశ్నారూపాన్ని నేరుగా నిలుపుతుంది; అంతర్లీనంగా బెదిరింపు ఉండవచ్చనే భావాన్ని అనువాదంలో స్పష్టంగా చేర్చదు.
- source_word: מִיכַל
  choice: మీకాలు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తినామాన్ని లిప్యంతరీకరించింది.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తినామాన్ని లిప్యంతరీకరించింది.
theological_decisions:
- issue: మీకాలు దావీదుకు ఆపాదించిన మాటలోని బెదిరింపు
  choice: ‘నన్ను వెళ్లనివ్వు. నేను నిన్ను ఎందుకు చంపాలి?’ అని ప్రశ్నారూపాన్ని నిలుపడం
  alternative: ‘నన్ను వెళ్లనివ్వు; లేకపోతే నిన్ను చంపుతాను’ అని స్పష్టమైన బెదిరింపుగా అనువదించడం
  rationale: మూలంలో ఆజ్ఞ తరువాత ‘ఎందుకు...?’ అనే ప్రశ్న ఉంది; ‘లేకపోతే’ అనే పదం లేదు. అందువల్ల సంభావ్య బెదిరింపును పాఠకుడు గ్రహించేలా వదిలి, మూలంలోని అస్పష్టతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. సౌలు ప్రశ్నను తెలుగులో సహజంగా రెండు ప్రశ్నలుగా అమర్చాం. ప్రధాన పాఠంలో హీబ్రూ వాక్యంలోని ప్రశ్నారూప అస్పష్టతను నిలిపి, బెదిరింపుగా అర్థం చేసుకునే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
