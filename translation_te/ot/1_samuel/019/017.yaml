revisions:
- from: అప్పుడు సౌలు మీకాలుతో, “నువ్వు నన్ను ఇలా ఎందుకు మోసం చేశావు? నా శత్రువును పంపించివేసి, అతడు తప్పించుకునేలా ఎందుకు చేశావు?” అని అడిగాడు. మీకాలు సౌలుతో, “అతడు నాతో, ‘నన్ను వెళ్లనివ్వు. నేను నిన్ను ఎందుకు చంపాలి?’ అన్నాడు” అని చెప్పింది.[a]
  to: అప్పుడు సౌలు మీకాలుతో, “నన్ను ఇలా ఎందుకు మోసం చేసి, నా శత్రువును పంపించివేసి, అతడు తప్పించుకునేలా చేశావు?” అని అడిగాడు. మీకాలు సౌలుతో, “అతడు నాతో, ‘నన్ను పంపించు. నేను నిన్ను ఎందుకు చంపాలి?’ అన్నాడు” అని చెప్పింది.[a]
