source:
  edition: WLC
  text: וַ/תְּהִי֩ ר֨וּחַ יְהוָ֤ה רָעָה֙ אֶל שָׁא֔וּל וְ/הוּא֙ בְּ/בֵית֣/וֹ יוֹשֵׁ֔ב וַ/חֲנִית֖/וֹ בְּ/יָד֑/וֹ וְ/דָוִ֖ד מְנַגֵּ֥ן בְּ/יָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/009.yaml
  text: And an evil spirit from Yahweh came upon Saul while he was sitting in his house with his spear in his hand[b][a], and David was playing the lyre with his hand.
translation:
  language: te
  text: అప్పుడు యాహ్వే నుండి ఒక దుష్ట ఆత్మ[a] సౌలు మీదికి వచ్చింది. సౌలు తన ఇంట్లో చేతిలో ఈటె పట్టుకొని కూర్చున్నాడు; దావీదు తన చేతితో వాద్యాన్ని వాయిస్తున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాహ్వే నుండి ఒక హానికరమైన ఆత్మ’ లేదా ‘బాధకలిగించే ఆత్మ’ అని కూడా అనువదించవచ్చు. హీబ్రూ విశేషణానికి ‘దుష్టమైన’ అనే అర్థంతోపాటు ‘హానికరమైన, బాధకలిగించే’ అనే అర్థాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘చేతితో.’ ఈ వచనంలో నిర్దిష్ట వాద్యం పేరు స్పష్టంగా లేదు; ‘వాద్యాన్ని’ అనేది ‘వాయిస్తున్నాడు’ అనే క్రియలో సూచితమైన సాధారణ అర్థం మాత్రమే. సమీప సందర్భం దావీదు సౌలు కోసం సంగీతం వాయిస్తున్నాడని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: వచ్చింది
  rationale: רוּחַ కర్తగా ఉండి, אֶל שָׁאוּל సౌలు వైపు సంభవించిన దాడి లేదా ఆవహింపును సూచిస్తున్నందున, తెలుగులో సహజమైన సంఘటనార్థక రూపంగా ‘వచ్చింది’ ఎంచుకోబడింది.
- source_word: רוּחַ יְהוָה רָעָה
  choice: యాహ్వే నుండి ఒక దుష్ట ఆత్మ
  rationale: רוּחַ అంటే ‘ఆత్మ’; רָעָהకు ‘దుష్టమైనది,’ ‘హానికరమైనది,’ లేదా ‘బాధకలిగించేది’ అనే అర్థాలు ఉండవచ్చు. יְהוָהతో ఉన్న సంబంధాన్ని తెలుగులో ‘యాహ్వే నుండి’ అని వ్యక్తపరచడం, ఆ ఆత్మ దేవుని నుండి వచ్చిందనే భావాన్ని నిలుపుతూ యాహ్వే స్వయంగా దుష్టుడనే అపార్థాన్ని నివారిస్తుంది.
- source_word: אֶל שָׁאוּל
  choice: సౌలు మీదికి
  rationale: אֶל ప్రాథమికంగా ‘వైపు/దగ్గరకు’ అని అర్థమైనా, బాధించే శక్తి సౌలును చేరిన సందర్భంలో ‘మీదికి’ సహజంగా ఆరంభమైన ప్రభావాన్ని తెలియజేస్తుంది.
- source_word: בְּבֵיתוֹ יוֹשֵׁב
  choice: తన ఇంట్లో ... కూర్చున్నాడు
  rationale: יוֹשֵׁב అనే కృదంతం కొనసాగుతున్న నేపథ్య చర్యను సూచిస్తుంది; తెలుగు కథనంలో ‘కూర్చున్నాడు’ ఆ దృశ్యాన్ని సహజంగా ఇస్తుంది.
- source_word: וַחֲנִיתוֹ בְּיָדוֹ
  choice: చేతిలో ఈటె పట్టుకొని
  rationale: హీబ్రూలో అక్షరార్థంగా ‘అతని ఈటె అతని చేతిలో’ అనే క్రియలేని వాక్యభాగం ఉంది. తెలుగులో ‘చేతిలో ఈటె పట్టుకొని’ అదే స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: מְנַגֵּן
  choice: వాయిస్తున్నాడు
  rationale: נגן పియేల్ రూపం వాద్యాన్ని వాయించడాన్ని సూచిస్తుంది. ఈ వచనంలో వాద్యం పేరును చెప్పకపోవడంతో ‘వాయిస్తున్నాడు’ అని మాత్రమే అనువదించబడింది.
- source_word: בְּיָד
  choice: తన చేతితో
  rationale: మూలపాఠం అక్షరార్థంగా ‘చేతితో’ అని చెబుతుంది. వాద్యం పేరును సమీప సందర్భం నుంచి ప్రధాన పాఠ్యంలో చేర్చకుండా ఈ వ్యక్తీకరణను నిలుపుకున్నాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న నిబంధన దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని పేరురూపాన్ని ‘యాహ్వే’గా ఇచ్చాం.
- issue: רוּחַ יְהוָה רָעָהలో ఆత్మకు యాహ్వేతో ఉన్న సంబంధం
  choice: యాహ్వే నుండి ఒక దుష్ట ఆత్మ
  alternative: యాహ్వేకు చెందిన దుష్ట ఆత్మ / యాహ్వే నుండి ఒక హానికరమైన ఆత్మ
  rationale: హీబ్రూ నిర్మాణం సంబంధాన్ని సంక్షిప్తంగా ఉంచుతుంది. ‘నుండి’ అనేది ఆ ఆత్మ యొక్క మూలం లేదా పంపబడటాన్ని తెలియజేస్తూ, దేవునిలో నైతిక దుష్టత్వం ఉందని అనవసరంగా సూచించదు. అదే సమయంలో רָעָהలోని ‘దుష్ట’ మరియు ‘హానికర/బాధకర’ అర్థాల మధ్య ఉన్న ఉద్రిక్తతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలో లేని వాద్యం పేరును ప్రధాన పాఠ్యంలో చేర్చలేదు; అవసరమైన సందర్భసమాచారాన్ని పాదసూచికలో ఇచ్చాం. ‘దుష్ట’ అనే ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ‘హానికరమైన/బాధకలిగించే’ అనే నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
