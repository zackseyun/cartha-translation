  rationale: The revision preserves the source’s emphasis that Saul too experienced the Spirit’s coming, and it explicitly represents both the continuing action of ‘he kept going’ and the endpoint ‘until he came.’ The footnote is adjusted to give a true ‘at Ramah’ alternative without suggesting merely nearby location.
