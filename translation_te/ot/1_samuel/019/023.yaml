revisions:
- from: అప్పుడు అతడు అక్కడికి, రామాలోని నాయోతుకు[a] వెళ్లాడు. దేవుని ఆత్మ అతని మీదికి కూడా వచ్చింది; అతడు ప్రవచిస్తూ ప్రయాణం సాగించి, రామాలోని నాయోతుకు చేరుకున్నాడు.
