id: 1SA.19.23
reference: 1 Samuel 19:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ שָׁ֔ם אֶל נוית בָּ/רָמָ֑ה וַ/תְּהִי֩ עָלָ֨י/ו גַּם ה֜וּא ר֣וּחַ אֱלֹהִ֗ים וַ/יֵּ֤לֶךְ הָלוֹךְ֙ וַ/יִּתְנַבֵּ֔א עַד בֹּא֖/וֹ ב/נוית בָּ/רָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/023.yaml
  text: So he went there[a], to Naioth in Ramah, and the Spirit of God came upon him also; and he went on, prophesying[b], until he came to Naioth in Ramah.
translation:
  language: te
  text: అప్పుడు అతడు అక్కడికి, రామాలోని నాయోతుకు[a] వెళ్లాడు. అతనిమీదికీ దేవుని ఆత్మ వచ్చింది; అతడు ప్రవచిస్తూ, రామాలోని నాయోతుకు చేరేవరకు వెళ్తూనే ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రామా వద్దనున్న నాయోతు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נוית בָּרָמָה
  choice: రామాలోని నాయోతు
  rationale: נוית అనే స్థలనామాన్ని ‘నాయోతు’గా లిప్యంతరీకరించి, בָּרָמָהను సహజమైన తెలుగులో ‘రామాలోని’గా అనువదించాం.
- source_word: וַתְּהִי עָלָיו ... רוּחַ אֱלֹהִים
  choice: దేవుని ఆత్మ అతని మీదికి వచ్చింది
  rationale: היה על + רוּחַ అనే ప్రయోగం ఈ కథనంలో దేవుని ఆత్మ ఒక వ్యక్తిని ఆవరించి శక్తినివ్వడాన్ని సూచిస్తుంది; ‘మీదికి వచ్చింది’ అనేది సహజమైన తెలుగు, అలాగే మూలంలోని చలనాత్మక భావాన్ని అందిస్తుంది.
- source_word: גַּם הוּא
  choice: అతని మీదికి కూడా
  rationale: సౌలు పంపిన దూతలకు జరిగినదే అతనికీ జరిగిందనే చేర్పు భావాన్ని ‘కూడా’ నిలుపుతుంది.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: ప్రయాణం సాగించి
  rationale: క్రియతో కూడిన infinitive absolute చర్య కొనసాగడాన్ని బలపరుస్తుంది; ‘ప్రయాణం సాగించి’ ఆ నిరంతర గమనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּתְנַבֵּא
  choice: ప్రవచిస్తూ
  rationale: ఈ రూపం దేవుని ప్రభావంలో ప్రవక్తసంబంధమైన మాట లేదా ప్రవర్తనను సూచించగలదు. ‘ప్రవచిస్తూ’ దాని విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: עַד בֹּאוֹ
  choice: చేరుకున్నాడు
  rationale: గమనం కొనసాగి గమ్యస్థానానికి చేరేవరకు జరిగినదనే భావాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁם
  choice: అక్కడికి
  rationale: మునుపటి సందర్భంలో పేర్కొన్న గమ్యస్థానాన్ని సూచించే కథన సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: רוּחַ אֱלֹהִיםను వ్యక్తిగతమైన దేవుని ఆత్మగా అనువదించాలా, లేక సాధారణ ‘దైవిక ఆత్మ’గా అనువదించాలా
  choice: దేవుని ఆత్మ
  alternative: దేవుని నుండి వచ్చిన ఒక ఆత్మ
  rationale: సౌలు కథన సందర్భంలో ఈ పదబంధం దేవుని నుండి వచ్చే ప్రవచనాత్మక ప్రభావాన్ని సూచిస్తుంది. తెలుగు లిపిలో పెద్ద/చిన్న అక్షరాల భేదం లేనందున ‘దేవుని ఆత్మ’ అనే రూపమే సహజంగా ఉండి, అంతకుమించిన సిద్ధాంత వివరణను చేర్చదు.
- issue: సౌలు చేసిన ప్రవచనాత్మక క్రియ యొక్క స్వరూపాన్ని ఎంతవరకు నిర్వచించాలి
  choice: ప్రవచిస్తూ
  alternative: ప్రవక్తలా ప్రవర్తిస్తూ
  rationale: మూలపాఠం ఆ క్రియ యొక్క ఖచ్చితమైన రూపాన్ని చెప్పదు. ‘ప్రవచిస్తూ’ అనే అనువాదం ఉన్మాదం లేదా కేవలం మాటల ప్రకటన వంటి ఏ ఒక్క వివరణనూ బలవంతంగా రుద్దకుండా అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథనశైలిని, అలాగే బైబిలు వచనానికి తగిన గౌరవప్రదమైన ధోరణిని ఉపయోగించాం. స్థలనామాలను తెలుగులో లిప్యంతరీకరించాం; మూలంలోని పునరుక్త గమ్యస్థాన సూచనను నిలిపాం.
