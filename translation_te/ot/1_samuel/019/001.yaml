translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘దావీదును చంపాలని’ సహజమైన ప్రత్యక్ష భావాన్ని ఇస్తుంది; ‘దావీదంటే ఎంతో ఇష్టం’ חפץ యొక్క సానుకూల అనురాగాన్ని అతిశయింపకుండా వ్యక్తం చేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా ఉంచబడ్డాయి.
