source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר שָׁא֗וּל אֶל יוֹנָתָ֤ן בְּנ/וֹ֙ וְ/אֶל כָּל עֲבָדָ֔י/ו לְ/הָמִ֖ית אֶת דָּוִ֑ד וִ/יהֽוֹנָתָן֙ בֶּן שָׁא֔וּל חָפֵ֥ץ בְּ/דָוִ֖ד מְאֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/001.yaml
  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
translation:
  language: te
  text: సౌలు తన కుమారుడైన యోనాతానుతో, తన సేవకులందరితో దావీదును చంపాలని చెప్పాడు.[a] అయితే సౌలు కుమారుడైన యోనాతాను దావీదుపట్ల ఎంతో ఆసక్తి కలిగి ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదును మరణింపజేయాలని.” ఇక్కడి హీబ్రూ క్రియకు ‘మరణానికి గురిచేయడం’ అనే కారణార్థక భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యోనాతాను దావీదునందు ఎంతో ఆనందించేవాడు”; “దావీదుపట్ల ఎంతో ప్రీతి కలిగి ఉన్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: דבר అనే క్రియను ఇక్కడ సహజమైన తెలుగు కథన శైలిలో ‘చెప్పాడు’ అని అనువదించాం; తరువాతి క్రియార్థక పదబంధం అతడు చెప్పిన విషయాన్ని తెలియజేస్తుంది.
- source_word: עֲבָדָיו
  choice: తన సేవకులందరితో
  rationale: రాజసభ సందర్భంలో עבד రాజసేవకులను లేదా అధికారులను సూచించవచ్చు. ‘సేవకులు’ మూలపదానికి పారదర్శకంగా ఉండి సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: לְהָמִית אֶת דָּוִד
  choice: దావీదును చంపాలని
  rationale: హిఫీల్ క్రియ המית మరణింపజేయడం అనే భావాన్ని కలిగిస్తుంది. తెలుగులో ‘చంపాలని చెప్పాడు’ ఉద్దేశం/విషయాన్ని సహజంగా తెలియజేస్తుంది; ‘మరణశిక్ష విధించాలని’ అనడం న్యాయపరమైన అధికారిక చర్యను అనవసరంగా సూచించవచ్చు.
- source_word: וִיהוֹנָתָן
  choice: అయితే యోనాతానుకు
  rationale: ఇక్కడ వావ్ సౌలు ఉద్దేశానికి యోనాతాను వైఖరిని వ్యతిరేకంగా నిలుపుతుంది; అందుకే ‘అయితే’ అని అనువదించాం.
- source_word: חָפֵץ בְּדָוִד מְאֹד
  choice: దావీదంటే ఎంతో ఇష్టం
  rationale: חפץ ఒకరిలో ఆనందించడం, వారిపట్ల ప్రీతి లేదా ఇష్టం కలిగి ఉండడం అనే భావాన్ని ఇస్తుంది. ‘ఎంతో ఇష్టం’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలో లేని אהב అనే బలమైన ‘ప్రేమించు’ పదాన్ని దిగుమతి చేయదు.
- source_word: בְּנוֹ / בֶּן שָׁאוּל
  choice: తన కుమారుడైన / సౌలు కుమారుడైన
  rationale: హెబ్రీ పాఠంలోని రెండు పుత్రసంబంధ సూచనలను కథన స్పష్టత కోసం నిలిపాం.
