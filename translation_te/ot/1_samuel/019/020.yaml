id: 1SA.19.20
reference: 1 Samuel 19:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח שָׁא֣וּל מַלְאָכִים֮ לָ/קַ֣חַת אֶת דָּוִד֒ וַ/יַּ֗רְא אֶֽת לַהֲקַ֤ת הַ/נְּבִיאִים֙ נִבְּאִ֔ים וּ/שְׁמוּאֵ֕ל עֹמֵ֥ד נִצָּ֖ב עֲלֵי/הֶ֑ם וַ/תְּהִ֞י עַֽל מַלְאֲכֵ֤י שָׁאוּל֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
translation:
  language: te
  text: అప్పుడు సౌలు దావీదును పట్టుకోవడానికి దూతలను పంపాడు. ప్రవక్తల గుంపు[a] ప్రవచిస్తూ ఉండగా, సమూయేలు వారిమీద నిలబడి ఉండడాన్ని వారు చూశారు. అప్పుడు దేవుని ఆత్మ సౌలు దూతల మీదికి వచ్చింది; వారూ ప్రవచించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రవక్తల బృందం.’ హీబ్రూ పదం కూడివున్న ఒక సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  choice: దూతలు / దూతల
  rationale: ఈ సందర్భంలో వీరు దేవదూతలు కాదు; సౌలు పంపిన మానవ ప్రతినిధులు. ‘దూతలు’ అనే పదం సందర్భానికి తగిన, సహజమైన తెలుగు రూపం.
- source_word: לָקַחַת
  choice: పట్టుకోవడానికి
  rationale: మూల క్రియ సాధారణంగా ‘తీసుకోవడం’ అని అర్థమిచ్చినా, ఇక్కడ దావీదును బలవంతంగా అదుపులోకి తీసుకోవడమే ఉద్దేశం; ‘పట్టుకోవడానికి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַהֲקַת הַנְּבִיאִים
  choice: ప్రవక్తల గుంపు
  rationale: ఈ నామవాచకం కూడివున్న బృందాన్ని సూచిస్తుంది. ‘గుంపు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: נִבְּאִים / וַיִּתְנַבְּאוּ
  choice: ప్రవచిస్తూ ఉండగా / ప్రవచించారు
  rationale: మొదటి రూపం కొనసాగుతున్న ప్రవక్తీయ కార్యాన్ని, చివరి రూపం సౌలు దూతలు కూడా అదే కార్యంలో చేరడాన్ని తెలియజేస్తుంది.
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  choice: వారికి నాయకుడిగా నిలబడి ఉండడం
  rationale: పదబంధం సమూయేలు ఆ ప్రవక్తల విషయంలో స్థిరమైన, పైస్థాయి లేదా పర్యవేక్షణ స్థానంలో ఉన్నాడనే భావాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు వాడి, స్థలసంబంధ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: רוּחַ אֱלֹהִים
  choice: దేవుని ఆత్మ
  rationale: ఈ సందర్భంలో ప్రవచించేలా కార్యసాధకంగా వచ్చిన దేవుని ఆత్మను సూచిస్తుంది; తరువాతి సిద్ధాంతపరమైన వివరాలను పాఠ్యంలోకి చేర్చకుండా మూలంలోని దైవ కార్యశక్తిని నిలుపుతుంది.
- source_word: וַתְּהִי עַל
  choice: మీదికి వచ్చింది
  rationale: ఆత్మ వ్యక్తుల మీదికి వచ్చి కార్యానికి ప్రేరేపించడాన్ని సూచించే సంఘటనాత్మక హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: גַּם הֵמָּה
  choice: వారూ
  rationale: సౌలు దూతలు సైతం అనూహ్యంగా ప్రవచించారనే అదనపు ఉద్ఘాటనను సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ఈ కథనంలో רוּחַ אֱלֹהִים స్వభావం
  choice: ‘దేవుని ఆత్మ ... మీదికి వచ్చింది’ అని దైవిక కార్యసాన్నిధ్యంగా అనువదించాం.
  alternative: ‘దేవుని నుండి ఒక ఆత్మ ... మీదికి వచ్చింది’
  rationale: సమూయేలు గ్రంథాల్లో ఈ పదబంధం చరిత్రలో శక్తివంతంగా పనిచేసే దేవుని ఆత్మను సాధారణంగా సూచిస్తుంది. ఈ రూపం దైవ కర్తృత్వాన్ని నిలుపుతూ, మూలపాఠం చెప్పనంత తరువాతి సిద్ధాంతపరమైన నిర్దిష్టతను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వరుసను అనవసరమైన వైరుధ్య సూచక పదం లేకుండా నిలిపాం. రెండు నిజమైన పదార్థ సందిగ్ధతలను పాదసూచికల్లో వెల్లడించాం.
