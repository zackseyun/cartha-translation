revisions:
- from: సౌలు ఈటెతో దావీదును గోడకు గుచ్చివేయాలని ప్రయత్నించాడు. అయితే దావీదు సౌలు ఎదుటి నుంచి తప్పించుకున్నాడు; ఈటె గోడలోకి దిగబడింది. ఆ రాత్రే దావీదు పారిపోయి తప్పించుకున్నాడు.
  to: సౌలు ఈటెతో దావీదును గోడకు గుచ్చివేయాలని ప్రయత్నించాడు. కానీ దావీదు సౌలు నుండి తప్పించుకున్నాడు, సౌలు ఈటెను గోడలోకి కొట్టాడు. అప్పుడు దావీదు ఆ రాత్రి పారిపోయి తప్పించుకున్నాడు.
  rationale: The revision preserves the source's sequence and explicitly retains Saul as the actor who drove the spear into the wall. It also makes the escape clause more natural in modern standard Telugu. No footnote is necessary because the idiomatic sense of pinning David to the wall is conveyed directly and no structural or textual ambiguity requires explanation here.
