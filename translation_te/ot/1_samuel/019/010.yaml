id: 1SA.19.10
reference: 1 Samuel 19:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְבַקֵּ֨שׁ שָׁא֜וּל לְ/הַכּ֤וֹת בַּֽ/חֲנִית֙ בְּ/דָוִ֣ד וּ/בַ/קִּ֔יר וַ/יִּפְטַר֙ מִ/פְּנֵ֣י שָׁא֔וּל וַ/יַּ֥ךְ אֶֽת הַ/חֲנִ֖ית בַּ/קִּ֑יר וְ/דָוִ֛ד נָ֥ס וַ/יִּמָּלֵ֖ט בַּ/לַּ֥יְלָה הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/010.yaml
  text: Saul sought to pin David to the wall with the spear, but he slipped away from Saul’s presence, and he drove the spear into the wall. Then David fled and escaped that night.
translation:
  language: te
  text: సౌలు ఈటెతో దావీదును గోడకు గుచ్చివేయాలని ప్రయత్నించాడు. కానీ దావీదు సౌలు నుండి తప్పించుకున్నాడు, సౌలు ఈటెను గోడలోకి కొట్టాడు. అప్పుడు దావీదు ఆ రాత్రి పారిపోయి తప్పించుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: ప్రయత్నించాడు
  rationale: ఇక్కడ క్రియ కోరికను మాత్రమే కాక, వెంటనే చేసిన దాడి ప్రయత్నాన్ని సూచిస్తుంది.
- source_word: לְהַכּוֹת בַּחֲנִית בְּדָוִד וּבַקִּיר
  choice: ఈటెతో దావీదును గోడకు గుచ్చివేయాలని
  rationale: అక్షరార్థంగా ‘ఈటెతో దావీదును మరియు గోడను కొట్టడానికి’; సందర్భంలో దావీదును ఈటెతో గోడకు గుచ్చివేయాలనే ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  choice: సౌలు ఎదుటి నుంచి తప్పించుకున్నాడు
  rationale: దావీదు సౌలు సమక్షం నుంచి జారుకొని దాడిని తప్పించుకున్న భావాన్ని నిలుపుతుంది.
- source_word: וַיַּךְ אֶת־הַחֲנִית בַּקִּיר
  choice: ఈటె గోడలోకి దిగబడింది
  rationale: హీబ్రూ వాక్యంలో వ్యాకరణపరంగా సౌలే కర్త అయినా, సహజ తెలుగులో దాడి ఫలితాన్ని స్పష్టంగా చెబుతుంది; ఈటె గోడను తాకడమే కాక అందులో దిగబడిన సందర్భార్థాన్ని అందిస్తుంది.
- source_word: נָס וַיִּמָּלֵט
  choice: పారిపోయి తప్పించుకున్నాడు
  rationale: వరుసగా ఉన్న రెండు క్రియలైన పారిపోవడం, సురక్షితంగా తప్పించుకోవడం అనే భావాలను రెండింటినీ నిలుపుతుంది.
- source_word: בַּלַּיְלָה הוּא
  choice: ఆ రాత్రే
  rationale: ‘ఆ రాత్రి’ అనే కాలసూచనకు హీబ్రూలోని దృష్టిపాత భావాన్ని ‘ఏ’ ద్వారా సహజంగా తెలియజేస్తుంది.
