  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח שָׁאוּל֙ אֶת הַ/מַּלְאָכִ֔ים לִ/רְא֥וֹת אֶת דָּוִ֖ד לֵ/אמֹ֑ר הַעֲל֨וּ אֹת֧/וֹ בַ/מִּטָּ֛ה אֵלַ֖/י לַ/הֲמִתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/015.yaml
  text: Then Saul sent the messengers to see David[a], saying, “Bring him up to me in the bed, so that I may put him to death.”
translation:
  language: te
  text: అప్పుడు సౌలు దావీదును చూడడానికి దూతలను పంపి, “అతణ్ణి చంపడానికి అతణ్ణి మంచంతో సహా[a] నా దగ్గరకు తీసుకురండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మంచంలో” లేదా “మంచం మీద.” హెబ్రీలోని ఉపసర్గను ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు; దావీదును అతడు పడుకున్న స్థితిలోనే మోసుకురావాలని సౌలు ఆజ్ఞాపించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు సౌలు ... పంపి
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַמַּלְאָכִים
  choice: దూతలను
  rationale: ఈ రాజసభా సందర్భంలో מַלְאָךְ అనేది సౌలు పంపిన మనుషులను సూచిస్తుంది; అలౌకిక దేవదూతలను కాదు.
- source_word: לִרְאוֹת
  choice: చూడడానికి
  rationale: ראה అనే క్రియ యొక్క ప్రాథమిక అర్థమైన ‘చూడడం’ను నిలుపుతుంది; ఇక్కడ దావీదు ఉన్నాడో, అతని పరిస్థితి ఏమిటో పరిశీలించడం భావం కావచ్చు, కాని దాన్ని పాఠ్యంలో అతిగా నిర్ధారించలేదు.
- source_word: לֵאמֹר
  choice: అని చెప్పాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీయ నిర్దేశక రూపాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: הַעֲלוּ
  choice: పైకి తీసుకురండి
  rationale: עלה హిఫీల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే దిశా భావాన్ని నిలుపుతూ, పడకపై ఉన్నాడని భావించిన వ్యక్తిని మోసుకొచ్చే సందర్భానికి సరిపోతుంది.
- source_word: בַמִּטָּה
  choice: మంచంతో సహా
  rationale: ב ఉపసర్గ ఇక్కడ ‘మంచంలో,’ ‘మంచం మీద,’ లేదా ‘మంచంతో సహా’ అని అర్థమివ్వగలదు. దావీదు పడుకున్న స్థితిలోనే మోయించాలన్న సందర్భార్థాన్ని సహజంగా తెలియజేయడానికి ‘మంచంతో సహా’ ఎంచుకున్నాం; అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: אֵלַי
  choice: నా దగ్గరికి
  rationale: సౌలు తన సన్నిధికి దావీదును తీసుకురమ్మంటున్న గమ్యార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לַהֲמִתוֹ
  choice: నేను అతణ్ణి చంపుతాను
  rationale: ל తో కూడిన క్రియానామ రూపం ఉద్దేశాన్ని తెలియజేస్తుంది. ప్రత్యక్ష ఆజ్ఞలో ‘నేను అతణ్ణి చంపుతాను’ అనేది సహజంగా ఉండి, మరణశిక్షను సూచించే హెబ్రీయ భావాన్ని స్పష్టంగా అందిస్తుంది.
