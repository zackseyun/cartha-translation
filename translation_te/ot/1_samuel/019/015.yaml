translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘దూతలు’ అనే పదం ఇక్కడ మానవ సందేశవాహకులు/పంపబడిన మనుషులు అనే సందర్భార్థంలో వాడబడింది. ప్రధాన పాఠ్యంలో సహజత్వం కోసం ‘మంచంతో సహా’ అని ఇచ్చి, హెబ్రీయంలోని నిజమైన వ్యాకరణ అస్పష్టతను [a] పాదసూచికలో సంరక్షించాం.
