  edition: WLC
  text: וַ/אֲנִ֨י אֵצֵ֜א וְ/עָמַדְתִּ֣י לְ/יַד אָבִ֗/י בַּ/שָּׂדֶה֙ אֲשֶׁ֣ר אַתָּ֣ה שָׁ֔ם וַ/אֲנִ֕י אֲדַבֵּ֥ר בְּ/ךָ֖ אֶל אָבִ֑/י וְ/רָאִ֥יתִי מָ֖ה וְ/הִגַּ֥דְתִּי לָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/003.yaml
  text: I will go out and stand beside my father in the field where you are[a], and I will speak to my father about you. Then I will see what happens and tell you.
translation:
  language: te
  text: నేను బయటికి వెళ్లి, నువ్వు ఉన్న పొలంలో నా తండ్రి పక్కన నిలబడతాను. నీ గురించి నా తండ్రితో మాట్లాడతాను. అప్పుడు ఏమి జరుగుతుందో[a] చూసి నీకు చెబుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఏమిటో చూస్తాను.” ఇది “ఏమి జరుగుతుందో చూస్తాను” లేదా “పరిస్థితి ఏమిటో తెలుసుకుంటాను” అనే భావమిచ్చే సంక్షిప్త ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: నేను బయటికి వెళ్లి
  rationale: יצא అనే క్రియలోని ‘బయటికి వెళ్లడం’ అనే దిశార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; తరువాతి చర్యతో అనుసంధానించడానికి అసమాపక రూపం వాడబడింది.
- source_word: וְעָמַדְתִּי לְיַד אָבִי
  choice: నా తండ్రి పక్కన నిలబడతాను
  rationale: לְיַד అనే నుడికారం ‘చేతి దగ్గర’ అనే అక్షరార్థం కంటే ‘పక్కన’ అనే భావాన్ని ఇస్తుంది; עמד యొక్క సాధారణ భావమైన ‘నిలబడు’ను నిలుపుతుంది.
- source_word: בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם
  choice: నువ్వు ఉన్న పొలంలో
  rationale: שָׁם యొక్క స్థానార్థాన్ని తెలుగు సంబంధవాక్యంలో సహజంగా కలిపి, దావీదు ఉన్న ప్రదేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲדַבֵּר בְּךָ אֶל אָבִי
  choice: నీ గురించి నా తండ్రితో మాట్లాడతాను
  rationale: דבר ב + వ్యక్తి ఇక్కడ ఆ వ్యక్తిని గురించి మాట్లాడడాన్ని సూచిస్తుంది; אֶל אָבִי సంభాషణ ఎవరితో జరుగుతుందో తెలియజేస్తుంది.
- source_word: וְרָאִיתִי מָה
  choice: అప్పుడు ఏమి జరుగుతుందో చూసి
  rationale: హీబ్రూలో ఇది ‘ఏమిటో చూస్తాను’ అనే సంక్షిప్త, అసంపూర్ణ ప్రయోగం. సందర్భంలో ఉద్దేశించిన పరిణామాన్ని సహజమైన తెలుగులో తెలియజేస్తూనే ‘చూడు’ అనే మూలక్రియను నిలుపుతుంది.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: నీకు చెబుతాను
  rationale: נגד హిఫీల్ రూపానికి ఇక్కడ ‘తెలియజేయడం/నివేదించడం’ అనే భావం ఉంది; ‘చెబుతాను’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
