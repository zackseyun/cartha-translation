translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. యోనాతాను దావీదుతో మాట్లాడుతున్నందున ఏకవచన ‘నువ్వు/నీకు’ రూపాలు సందర్భానుగుణంగా ఉంచబడ్డాయి.
