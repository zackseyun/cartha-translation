base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/007.yaml
  text: So Jonathan called David and told him all these things. Then Jonathan brought David to Saul[a], and he was in his presence as before.
translation:
  language: te
  text: అప్పుడు యోనాతాను దావీదును పిలిచి, ఈ సంగతులన్నిటినీ అతనికి తెలియజేశాడు. తరువాత యోనాతాను దావీదును సౌలు దగ్గరకు తీసుకువచ్చాడు. దావీదు మునుపటిలాగే[a] సౌలు సమక్షంలో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిన్న, మూడు రోజుల క్రితం ఉన్నట్లుగా”; ఇది “మునుపటిలాగే” అనే అర్థమిచ్చే హెబ్రీయ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְדָוִד
  choice: దావీదును పిలిచి
  rationale: קרא + לְ ఒక వ్యక్తిని పిలవడం లేదా రమ్మని పిలిపించడం అనే భావాన్ని ఇస్తుంది. సందర్భం అధికారిక సమనును తప్పనిసరిగా సూచించనందున ‘పిలిచి’ సహజంగా ఉండి భావవిస్తృతిని కాపాడుతుంది.
- source_word: וַיַּגֶּד לוֹ
  choice: అతనికి తెలియజేశాడు
  rationale: హిఫిల్ రూపంలోని נגד ‘తెలియజేయు, చెప్పు’ అనే అర్థం ఇస్తుంది. ముందు సౌలుతో జరిగిన సంభాషణను యోనాతాను దావీదుకు వెల్లడిస్తున్న సందర్భానికి ‘తెలియజేశాడు’ సరిపోతుంది.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులన్నిటినీ
  rationale: דבר అనే పదానికి మాటలు, విషయాలు, సంగతులు అనే అర్థాలున్నాయి. ఇక్కడ సౌలు పలికిన మాటలతో పాటు జరిగిన విషయాలనూ సూచించగల ‘సంగతులు’ సహజమైన విస్తృత పదం.
- source_word: וַיָּבֵא ... אֶל
  choice: దగ్గరికి తీసుకొచ్చాడు
  rationale: בוא హిఫిల్ రూపం కారణార్థకంగా ‘తీసుకురావడం’ను సూచిస్తుంది. ‘దగ్గరికి తీసుకొచ్చాడు’ గమ్యవ్యక్తిని స్పష్టంగా తెలుపుతూ చర్య విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַיְהִי לְפָנָיו
  choice: సౌలు సమక్షంలో ఉన్నాడు
  rationale: ‘అతని ఎదుట ఉండడం’ అనే హెబ్రీయ నుడికారం సమక్షాన్ని, కొన్నిసార్లు సేవను కూడా సూచించగలదు. అస్పష్ట సర్వనామాన్ని తెలుగులో స్పష్టపరుస్తూ ‘సమక్షంలో’ మూలంలోని రాజసభ సంబంధ వాతావరణాన్ని కాపాడుతుంది.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: మునుపటిలాగే
  rationale: అక్షరార్థంగా గతంలోని సమీప దినాలను సూచించే ఈ హెబ్రీయ నుడికారం ఇక్కడ ‘పూర్వంలాగే’ అనే భావంలో ఉంది. ‘మునుపటిలాగే’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
