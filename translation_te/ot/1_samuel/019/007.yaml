translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘తెలియజేశాడు,’ ‘సమక్షంలో’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని రాజసభ సందర్భాన్ని నిలుపుతాయి. ప్రధాన పాఠ్యంలో [a] సూచికను సంబంధిత నుడికారం వెంట ఉంచాం.
