source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוֹנָתָ֤ן בְּ/דָוִד֙ ט֔וֹב אֶל שָׁא֖וּל אָבִ֑י/ו וַ/יֹּ֣אמֶר אֵ֠לָי/ו אַל יֶחֱטָ֨א הַ/מֶּ֜לֶךְ בְּ/עַבְדּ֣/וֹ בְ/דָוִ֗ד כִּ֣י ל֤וֹא חָטָא֙ לָ֔/ךְ וְ/כִ֥י מַעֲשָׂ֖י/ו טוֹב לְ/ךָ֥ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
translation:
  language: te
  text: 'యోనాతాను తన తండ్రి సౌలుతో దావీదుకు అనుకూలంగా మాట్లాడి[a], అతనితో ఇలా అన్నాడు: “రాజు తన సేవకుడైన దావీదుకు విరోధంగా పాపం చేయకూడదు[b]. ఎందుకంటే అతడు నీకు విరోధంగా పాపం చేయలేదు; అతని పనులు నీకు ఎంతో మేలు కలిగించాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక అనువాదం: ‘దావీదు గురించి అనుకూలంగా మాట్లాడి.’ హీబ్రూ నుడికారం అక్షరార్థంగా ‘దావీదు గురించి మంచి మాట్లాడాడు’ అని ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘తన సేవకునికి విరోధంగా, దావీదుకు విరోధంగా’ అని కర్మను నొక్కిచెప్పేందుకు పునరుక్తి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... בְּדָוִד טוֹב
  choice: దావీదుకు అనుకూలంగా మాట్లాడి
  rationale: ఈ హీబ్రూ నుడికారం దావీదు గురించి మంచిగా, అతనికి అనుకూలంగా మాట్లాడడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో యోనాతాను దావీదు పక్షంగా సౌలుతో మాట్లాడాడనే భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: אֶל שָׁאוּל אָבִיו
  choice: తన తండ్రి సౌలుతో
  rationale: సౌలు యోనాతాను తండ్రి అనే సంబంధాన్ని స్పష్టంగా ఉంచుతూ ఆధునిక తెలుగులో సహజమైన పదక్రమాన్ని వాడింది.
- source_word: אַל יֶחֱטָא הַמֶּלֶךְ
  choice: రాజు ... పాపం చేయకూడదు
  rationale: אַל తో కూడిన జస్సివ్ నిషేధాన్ని తెలియజేస్తుంది. మూడవ పురుషలో ‘రాజు’ అని సంబోధించే రాజసభ మర్యాదను ఈ రూపం నిలుపుతుంది.
- source_word: בְּעַבְדּוֹ בְדָוִד
  choice: తన సేవకుడైన దావీదుకు విరోధంగా
  rationale: חטא తో בְּ ఒకరికి విరోధంగా పాపం చేయడాన్ని సూచిస్తుంది. పునరుక్త హీబ్రూ నిర్మాణాన్ని తెలుగులో సహజమైన సమానాధికార సంబంధంగా ప్రధాన పాఠంలో ఇచ్చి, దాని రూపాన్ని పాదసూచికలో తెలిపింది.
- source_word: כִּי לֹא חָטָא לָךְ
  choice: ఎందుకంటే అతడు నీకు విరోధంగా పాపం చేయలేదు
  rationale: ముందటి ‘పాపం చేయకూడదు’ అనే మాటతో మూలపద పునరావృతాన్ని నిలుపుతూ, כִּי యొక్క కారణార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְכִי מַעֲשָׂיו טוֹב לְךָ מְאֹד
  choice: అతని పనులు నీకు ఎంతో మేలు చేశాయి
  rationale: దావీదు కార్యాలు సౌలుకు అత్యంత ప్రయోజనకరంగా ఉన్నాయనే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: సౌలు దావీదుకు విరోధంగా చేయబోయేదానికీ దావీదు సౌలుకు విరోధంగా చేయనిదానికీ మధ్య నైతిక వ్యత్యాసం
  choice: రెండు చోట్లా ‘పాపం చేయు’ అనే ఒకే పదబంధాన్ని నిలుపుట
  alternative: రెండవ చోట ‘అన్యాయం చేయలేదు’ అని అనువదించడం
  rationale: హీబ్రూలో రెండు చోట్లా חטא అనే ఒకే మూలపదం ఉంది. దాన్ని నిలపడం ద్వారా వాక్యంలోని ఉద్దేశపూర్వక నైతిక వ్యత్యాసం చెదరకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడింది. రాజసభ సందర్భాన్ని ప్రతిబింబించేందుకు ‘రాజు’ అనే మూడవ పురుష సంబోధనను నిలిపింది; అసహజమైన హీబ్రూ పదక్రమాన్ని ప్రధాన పాఠంలో బలవంతంగా అనుకరించకుండా పాదసూచికలో వివరించింది.
