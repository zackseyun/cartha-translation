  text: וַ/יִּפְשַׁ֨ט גַּם ה֜וּא בְּגָדָ֗י/ו וַ/יִּתְנַבֵּ֤א גַם הוּא֙ לִ/פְנֵ֣י שְׁמוּאֵ֔ל וַ/יִּפֹּ֣ל עָרֹ֔ם כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה עַל כֵּן֙ יֹֽאמְר֔וּ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
translation:
  language: te
  text: అతడు కూడా తన వస్త్రాలు విప్పేశాడు; అతడు కూడా సమూయేలు ఎదుట ప్రవచించాడు. ఆ రోజు అంతా, ఆ రాత్రి అంతా అతడు నగ్నంగా పడి ఉన్నాడు.[a] అందుచేత, “సౌలు కూడా ప్రవక్తలలో ఉన్నాడా?” అని ప్రజలు అంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నగ్నంగా’ అనే మాట పూర్తిగా వస్త్రాలు లేకపోవడాన్ని సూచించవచ్చు; లేదా పైవస్త్రాలు తీసివేసిన స్థితినీ సూచించవచ్చు. హీబ్రూ ఇంతకంటే స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  choice: తన వస్త్రాలు విప్పేశాడు
  rationale: פשט తో בגדים కలిసినప్పుడు దుస్తులను తొలగించడం అనే అర్థం వస్తుంది. ‘వస్త్రాలు విప్పేశాడు’ అనేది క్రియ బలాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: גַּם הוּא ... גַם הוּא
  choice: అతడు కూడా ... అతడు కూడా
  rationale: సౌలు కూడా తనకు ముందు పంపబడిన దూతలవలె ఈ అనుభవానికి లోనయ్యాడనే ఉద్ఘాటనను మూలంలోని పునరుక్తితోనే నిలుపుతుంది.
- source_word: וַיִּתְנַבֵּא
  choice: ప్రవచించాడు
  rationale: ఈ సందర్భంలో נבא హిత్పయేల్ రూపం దైవిక ప్రభావంలో జరిగిన ప్రవక్తసంబంధమైన మాట లేదా ప్రవర్తనను సూచిస్తుంది. దాని ఖచ్చిత స్వరూపాన్ని నిర్ణయించకుండా ‘ప్రవచించాడు’ అనే సాధారణ పదం మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: సమూయేలు ఎదుట
  rationale: לפני ఇక్కడ సమూయేలు సన్నిధిలో లేదా అతని సమక్షంలో అనే భావాన్ని ఇస్తుంది; ‘ఎదుట’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וַיִּפֹּל עָרֹם
  choice: నగ్నంగా పడి ఉన్నాడు
  rationale: נפל అక్షరార్థంగా ‘పడిపోయాడు’ అయినా, తరువాత వచ్చే పగలు-రాత్రి కాలవ్యవధి దృష్ట్యా కొనసాగిన స్థితిని తెలుగులో ‘పడి ఉన్నాడు’ సహజంగా తెలియజేస్తుంది. עָרֹם యొక్క ప్రత్యక్ష అర్థం ‘నగ్నంగా’.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: ఆ రోజు అంతా, ఆ రాత్రి అంతా
  rationale: మూలంలోని సంపూర్ణ కాలవ్యవధినీ, దాని ఉద్ఘాటననూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: అందుచేత ... అని ప్రజలు అంటారు
  rationale: ఈ పదబంధం సామెతగా మారిన ప్రశ్నకు కారణాన్ని పరిచయం చేస్తుంది. హీబ్రూలోని వర్తమాన బహువచన క్రియకు తెలుగులో స్పష్టమైన కర్తగా ‘ప్రజలు’ చేర్చడం సహజంగా ఉంటుంది.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  choice: సౌలు కూడా ప్రవక్తలలో ఉన్నాడా?
  rationale: ప్రశ్నారూపాన్నీ, ‘ప్రవక్తలలో’ అనే సూటి భావాన్నీ, సౌలుపై ఉన్న ఉద్ఘాటననూ కాపాడుతుంది.
theological_decisions:
- issue: సౌలు వస్త్రాలు లేని స్థితిలో עָרֹם అనే పదం యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘నగ్నంగా’ అని సూటిగా అనువదించడం
  alternative: పైవస్త్రాలు మాత్రమే తీసివేసి ఉండవచ్చు లేదా పాక్షికంగా వస్త్రహీనుడై ఉండవచ్చు
  rationale: עָרֹם సాధారణంగా ‘నగ్నుడు’ అని అర్థమిస్తుంది; అయితే ఇక్కడ సంపూర్ణ నగ్నత్వమా, పైవస్త్రాలు తీసివేయడమా అనేది వచనం మరింత స్పష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠ్యం బలమైన సూటి అర్థాన్ని ఉంచి, పరిమిత అర్థసాధ్యతను పాదసూచికలో తెలియజేస్తుంది.
- issue: సౌలు చేసిన ప్రవచన క్రియ యొక్క స్వరూపం
  choice: ‘ప్రవచించాడు’ అని అనువదించి, దాని విధానాన్ని నిర్ణయించకుండా ఉంచడం
  alternative: పరవశ ప్రవక్తస్థితిలోకి వెళ్లాడు లేదా ప్రవక్తలా ప్రవర్తించాడు
  rationale: ఈ వచనం అది భవిష్యవాణి మాటలా, పరవశ ప్రవర్తనలా, లేక రెండూ కలిసినదా అని వివరించదు. ‘ప్రవచించాడు’ అనే పదం ఈ అనిశ్చితినీ వేదాంతపరమైన ఉద్రిక్తతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని ‘అతడు కూడా’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. ‘వస్త్రాలు’, ‘ప్రవచించాడు’, ‘ప్రవక్తలు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సహజ వాక్యనిర్మాణంతో కలిపాం.
