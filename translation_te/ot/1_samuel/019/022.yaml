translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. స్థలనామాలను సాధారణ తెలుగు రూపాల్లో లిప్యంతరీకరించాం. హీబ్రూ క్రియల వరుసను తెలుగులో కృత్రిమంగా అనిపించకుండా ప్రత్యక్ష ప్రశ్నతో సహజీకరించాం; జవాబిచ్చిన కర్త గురించిన మూలంలోని అస్పష్టతను పాదసూచికలో స్పష్టంగా నిలిపాం.
