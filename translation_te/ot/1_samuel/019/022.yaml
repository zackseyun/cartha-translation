base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
translation:
  language: te
  text: 'అతడు కూడా రామాకు వెళ్లి, సెకూలో ఉన్న పెద్ద బావి[a] వరకు వచ్చాడు. అతడు అడిగి ఇలా అన్నాడు: “సమూయేలు, దావీదు ఎక్కడ ఉన్నారు?” ఒక వ్యక్తి[b], “చూడండి, వారు రామాలోని నాయోతులో ఉన్నారు” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పెద్ద నీటి నిల్వ గుంట,” లేదా “పెద్ద గొయ్యి” (בּוֹר הַגָּדוֹל).
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “అతడు అన్నాడు.” జవాబిచ్చిన వ్యక్తి ఎవరో పేర్కొనలేదు; స్పష్టత కోసం అనువాదంలో “ఒక వ్యక్తి” అని చేర్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָמָתָה
  choice: రామాకు
  rationale: స్థలనామానికి జతైన దిశాసూచక ప్రత్యయం రామా వైపు కదలికను సూచిస్తుంది; ఆధునిక తెలుగులో ‘రామాకు’ సహజంగా ఉంది.
- source_word: בּוֹר הַגָּדוֹל
  choice: పెద్ద బావి
  rationale: בּוֹר అనే పదానికి గొయ్యి, నీటి నిల్వ గుంట, బావి అనే అర్థాలు ఉండవచ్చు. ఇక్కడ అది దారిలోని ప్రసిద్ధ స్థలసూచికగా ఉంది; ‘పెద్ద బావి’ సందర్భానికి సహజమైన అనువాదం, ఇతర అవకాశాలను పాదసూచికలో ఉంచాం.
- source_word: בַּשֶּׂכוּ
  choice: సెకూలో
  rationale: ఇది స్థలనామం; హీబ్రూ స్థానవాచక సంబంధాన్ని తెలుగులో సహజంగా ‘సెకూలో’ అని ఇచ్చాం.
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  choice: అని అడిగాడు
  rationale: హీబ్రూలో ‘అడిగాడు, అన్నాడు’ అనే రెండు క్రియలు ఉన్నా, ప్రత్యక్ష ప్రశ్నతో తెలుగులో ‘అని అడిగాడు’ వాటి భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אֵיפֹה
  choice: ఎక్కడ ఉన్నారు
  rationale: సమూయేలు, దావీదు అనే ఇద్దరిని ఉద్దేశించిన ప్రశ్నను తెలుగులో గౌరవప్రదమైన బహువచనంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: చూడండి
  rationale: సమాధానంపై శ్రద్ధ మళ్లించే హీబ్రూ సూచకపద బలాన్ని పాతకాలపు శైలి లేకుండా ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בנוית
  choice: నాయోతులో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, స్థానాన్ని సూచించేందుకు ‘లో’ విభక్తిని వాడాం.
- source_word: בָּרָמָה
  choice: రామాలోని
  rationale: రామాతో సంబంధమున్న నాయోతు అనే స్థానాన్ని తెలుగులో స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: וַיֹּאמֶר
  choice: ఒక వ్యక్తి … అన్నాడు
  rationale: హీబ్రూలో ఏకవచన క్రియ ఉన్నా, జవాబిచ్చిన వ్యక్తి ఎవరో పేర్కొనలేదు. తెలుగులో అస్పష్ట కర్తను సహజంగా తెలియజేయడానికి ‘ఒక వ్యక్తి’ని సరఫరా చేశాం.
