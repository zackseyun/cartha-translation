source:
  edition: WLC
  text: וּ/מִי֙ יִשְׁמַ֣ע לָ/כֶ֔ם לַ/דָּבָ֖ר הַ/זֶּ֑ה כִּ֞י כְּ/חֵ֣לֶק הַ/יֹּרֵ֣ד בַּ/מִּלְחָמָ֗ה וּֽ/כְ/חֵ֛לֶק הַ/יֹּשֵׁ֥ב עַל הַ/כֵּלִ֖ים יַחְדָּ֥ו יַחֲלֹֽקוּ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
translation:
  language: te
  text: ఈ విషయంలో మీ మాట ఎవరు వింటారు?[a] యుద్ధంలోకి దిగేవాడి వాటా ఎంతో, సామగ్రి దగ్గర ఉండేవాడి వాటా[b] కూడా అంతే; వారందరూ కలిసి పంచుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ మాటను ఎవరు లెక్కచేస్తారు?’ హీబ్రూ క్రియ సందర్భాన్ని బట్టి ‘వినడం,’ ‘లెక్కచేయడం,’ లేదా ‘లోబడడం’ అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సామానుల దగ్గర’ లేదా ‘పరికరాల దగ్గర.’ హీబ్రూ పదం వస్తువులు, సామానులు, పరికరాలు లేదా సామగ్రిని విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: ఎవరు
  rationale: సంయోజక అవ్యయంతో కూడిన అలంకారప్రశ్న ఇది. తెలుగులో ముందున్న సందర్భంతో అనుసంధానం సహజంగానే తెలుస్తుంది కాబట్టి ప్రత్యేకంగా ‘మరి’ అని చేర్చకుండా ‘ఎవరు’ అని ఇవ్వడం స్పష్టంగా, సహజంగా ఉంది.
- source_word: יִשְׁמַע לָכֶם
  choice: మీ మాట వింటారు
  rationale: שׁמע + ל నిర్మాణానికి ‘వినడం,’ ‘లెక్కచేయడం,’ ‘లోబడడం’ అనే భావాలు ఉండవచ్చు. ఇక్కడ వారి ప్రతిపాదనను ఎవరూ అంగీకరించరనే అలంకారప్రశ్నలో ‘మీ మాట వింటారు’ విస్తృత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַדָּבָר הַזֶּה
  choice: ఈ విషయంలో
  rationale: דבר ఇక్కడ కేవలం పలికిన మాటను కాక, వివాదంలో ఉన్న ప్రతిపాదన లేదా విషయాన్ని సూచిస్తుంది. ‘ఈ విషయంలో’ దాని సందర్భార్థాన్ని అతిగా వివరించకుండా తెలియజేస్తుంది.
- source_word: כְּחֵלֶק הַיֹּרֵד בַּמִּלְחָמָה
  choice: యుద్ధంలోకి దిగేవాడి వాటా ఎంతో
  rationale: חלק అంటే దోపుడు సొమ్ములో లభించే భాగం లేదా వాటా. ‘యుద్ధంలోకి దిగేవాడు’ అనే పదబంధం హీబ్రూ ‘దిగడం’ అనే సైనిక నుడికారాన్ని తెలుగులోనూ సహజంగా నిలుపుతుంది.
- source_word: וּכְחֵלֶק הַיֹּשֵׁב עַל הַכֵּלִים
  choice: సామగ్రి దగ్గర ఉండేవాడి వాటా కూడా అంతే
  rationale: יֹשֵׁב ఇక్కడ కూర్చోవడాన్ని మాత్రమే కాక అక్కడే ఉండి కాపలా కాయడాన్ని సూచిస్తుంది. כֵּלִים సామానులు, పరికరాలు, యుద్ధసామగ్రి లేదా సరఫరాలను సూచించగల విస్తృత పదం; ‘సామగ్రి’ ఆ విస్తృతతను నిలుపుతుంది.
- source_word: יַחְדָּו יַחֲלֹקוּ
  choice: ఇద్దరూ కలిసి పంచుకోవాలి
  rationale: יַחְדָּו ఉమ్మడి లేదా సమాన భాగస్వామ్యాన్ని నొక్కిచెబుతుంది; יַחֲלֹקוּ పంచడం లేదా విభజించడాన్ని సూచిస్తుంది. సందర్భంలోని నియమాత్మక బలాన్ని తెలుగులో ‘పంచుకోవాలి’ సహజంగా వ్యక్తం చేస్తుంది; సమాంతర వాక్య నిర్మాణం వాటాలు సమానమని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యుద్ధానికి వెళ్లినవారికీ సామగ్రి దగ్గర నిలిచినవారికీ వాటా సంబంధం
  choice: ‘వాటా కూడా అంతే’ అని సమానత్వాన్ని స్పష్టంగా వ్యక్తం చేయడం
  alternative: ‘వాటా వలె ... వాటా’ అని హీబ్రూ నిర్మాణాన్ని మరింత అక్షరానుసారంగా ఉంచడం
  rationale: రెండుసార్లు వచ్చిన כְּחֵלֶק నిర్మాణం రెండు వర్గాల వాటాలు ఒకే విధంగా ఉంటాయని చెబుతుంది. ఇది వ్యాఖ్యానాత్మక సిద్ధాంతాన్ని చేర్చడం కాదు; వాక్యంలోని పోలికను సహజమైన తెలుగులో వ్యక్తం చేయడం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. అలంకారప్రశ్నను సంక్షిప్తంగా ఉంచి, సైనిక సందర్భంలోని ‘యుద్ధంలోకి దిగడం’ అనే చిత్రణను నిలిపాం. ‘ఇద్దరూ’ అనేది వాక్యంలో ఎదురెదురుగా పేర్కొన్న రెండు వర్గాలను సహజంగా సూచిస్తుంది.
