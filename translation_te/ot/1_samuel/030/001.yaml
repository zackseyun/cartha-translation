source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/בֹ֨א דָוִ֧ד וַ/אֲנָשָׁ֛י/ו צִֽקְלַ֖ג בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/עֲמָלֵקִ֣י פָֽשְׁט֗וּ אֶל נֶ֨גֶב֙ וְ/אֶל צִ֣קְלַ֔ג וַ/יַּכּוּ֙ אֶת צִ֣קְלַ֔ג וַ/יִּשְׂרְפ֥וּ אֹתָ֖/הּ בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: When David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
translation:
  language: te
  text: దావీదు మరియు అతని మనుషులు మూడవ రోజున సిక్లగుకు వచ్చినప్పుడు, అమాలేకీయులు నెగెవు ప్రాంతంపైనా[a] సిక్లగుపైనా దాడి చేసి, సిక్లగును కొట్టి, దానిని అగ్నితో కాల్చివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దక్షిణ ప్రాంతంపై’; హీబ్రూ పదమైన నెగెవు సాధారణంగా దక్షిణ ప్రాంతాన్ని గానీ, నెగెవు అని పిలిచే నిర్దిష్ట ప్రాంతాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  choice: వచ్చినప్పుడు
  rationale: హీబ్రూ కథనంలో ఇది దావీదు రాకను కాలసూచక నేపథ్యంగా నిలుపుతుంది. ఆధునిక తెలుగులో ‘వచ్చినప్పుడు’ సహజంగా ఆ పని చేస్తుంది; మూలంలో లేని ‘ఇప్పుడు’ వంటి అదనపు సంధాన పదం అవసరం లేదు.
- source_word: וַאֲנָשָׁיו
  choice: అతని మనుషులు
  rationale: ఇక్కడ ఈ పదం సాధారణ ప్రజలను కాక దావీదుతో ఉన్న అతని సహచరులైన పురుషులను సూచిస్తుంది.
- source_word: צִקְלַג
  choice: సిక్లగు
  rationale: స్థలనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: కాలాన్ని తెలిపే హీబ్రూ పదబంధానికి సూటిగా, సహజంగా సరిపడే తెలుగు రూపం.
- source_word: וַעֲמָלֵקִי
  choice: అమాలేకీయులు
  rationale: రూపంలో ఏకవచన సమూహనామంగా ఉన్నా, తరువాతి క్రియలు బహువచనంలో ఉన్నందున ప్రజాసమూహంగా అనువదించాం.
- source_word: פָשְׁטוּ
  choice: దాడి చేసి
  rationale: సైనిక సందర్భంలో פשט దోపిడీ దాడి చేయడాన్ని సూచిస్తుంది. తెలుగులో ‘దాడి చేసి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֶל נֶגֶב
  choice: నెగెవు ప్రాంతం మీద
  rationale: נֶגֶב దక్షిణ దిశను గానీ, నెగెవు అనే నిర్దిష్ట భౌగోళిక ప్రాంతాన్ని గానీ సూచించగలదు. ప్రధాన పాఠ్యంలో ప్రాంతనామాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: וַיַּכּוּ אֶת צִקְלַג
  choice: సిక్లగును కొట్టి
  rationale: נכה అనే విస్తృతార్థక క్రియలోని ‘కొట్టు/దెబ్బతీయు’ భావాన్ని నిలుపుతూ, పట్టణంపై జరిగిన దాడిని సూచిస్తుంది.
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  choice: దాన్ని అగ్నితో కాల్చివేశారు
  rationale: ‘అగ్నితో కాల్చారు’ అనే మూలంలోని ఉద్దేశపూర్వక పునరుక్తిని నిలిపి, తెలుగు కథనానికి సహజమైన సంపూర్ణత కోసం ‘కాల్చివేశారు’ అన్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దావీదు రాకకు ముందే దాడి జరిగిందనే సందర్భాన్ని తెలుగు క్రియాక్రమం ద్వారా స్పష్టంగా ఉంచాం. భౌగోళిక పదంలోని నిజమైన సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
