source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶל אֶבְיָתָ֤ר הַ/כֹּהֵן֙ בֶּן אֲחִימֶ֔לֶךְ הַגִּֽישָׁ/ה נָּ֥א לִ֖/י הָ/אֵפֹ֑ד וַ/יַּגֵּ֧שׁ אֶבְיָתָ֛ר אֶת הָ/אֵפֹ֖ד אֶל דָּוִֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
translation:
  language: te
  text: అప్పుడు దావీదు అహీమెలెకు కుమారుడైన యాజకుడు అబ్యాతారుతో, “దయచేసి ఏఫోదును[b] నా దగ్గరికి తీసుకురండి[a]” అన్నాడు. అబ్యాతారు ఏఫోదును దావీదు దగ్గరికి తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దయచేసి ఏఫోదును నా ముందుకు తీసుకురండి.’ హీబ్రూ క్రియకు ‘దగ్గరికి తీసుకురావడం’ లేదా ‘ముందుంచడం’ అనే అర్థాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘ఏఫోదు’ ఇశ్రాయేలు ఆరాధనలో ఉపయోగించిన యాజక సంబంధమైన పవిత్ర వస్తువు లేదా వస్త్రం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-అనుక్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: అబ్యాతారు నిర్వహించిన నిర్దిష్ట మతపరమైన పదవిని నేరుగా, సాధారణంగా అర్థమయ్యే పదంతో సూచిస్తుంది.
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: అహీమెలెకు కుమారుడైన
  rationale: హీబ్రూ నిర్మాణం వంశసంబంధాన్ని సూచిస్తుంది; తెలుగులో విశేషణ రూపం పేరుతో సహజంగా కలుస్తుంది.
- source_word: הַגִּישָׁה נָּא לִי
  choice: దయచేసి ... నా దగ్గరికి తీసుకురా
  rationale: נגשׁ హిఫీల్ ఆజ్ఞారూపం ‘దగ్గరికి తీసుకురావడం/సమర్పించడం’ అనే భావాన్ని ఇస్తుంది; נָא మర్యాదపూర్వక అభ్యర్థనను సూచిస్తుంది.
- source_word: הָאֵפֹד
  choice: ఏఫోదు
  rationale: ఇది ఇశ్రాయేలు యాజక వ్యవస్థకు ప్రత్యేకమైన వస్తువు లేదా వస్త్రాన్ని సూచించే పదం. దాని రూపం, విధిని అతిగా నిర్దిష్టం చేయకుండా లిప్యంతరీకరణను ఉంచాం.
- source_word: וַיַּגֵּשׁ
  choice: తీసుకొచ్చాడు
  rationale: ఆజ్ఞలోని అదే ధాతువు ఇక్కడ కార్యసిద్ధిని సూచిస్తుంది; సందర్భంలో ‘తీసుకొచ్చాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֶל דָּוִד
  choice: దావీదు దగ్గరికి
  rationale: אֶל దావీదు వైపు జరిగిన కదలికను సూచిస్తుంది; ‘దగ్గరికి’ హీబ్రూ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యాజక సంబంధమైన אֵפוֹד అనే పదార్థం యొక్క స్వరూపం, దైవచిత్త విచారణతో దాని సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘ఏఫోదు’ అనే లిప్యంతరీకరణను ఉంచడం
  alternative: ‘యాజక వస్త్రం’ లేదా ‘పవిత్ర వస్తువు’ అని అనువదించడం
  rationale: ఈ సందర్భంలో ఏఫోదు తరువాతి వచనంలోని దైవ మార్గదర్శక విచారణతో సంబంధం కలిగి ఉండవచ్చు; అయితే ఈ వచనం దాని ఖచ్చిత స్వరూపం లేదా విధిని వివరించదు. అందువల్ల అనిశ్చితిని నిలుపుతూ లిప్యంతరీకరణను ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సహజమైన కథనశైలిని ఉపయోగించాం. పేర్లకు సాధారణ తెలుగు బైబిలు రూపాలను అనుసరించాం; ప్రత్యేక మతపరమైన పదాన్ని అతిగా వివరణాత్మకం చేయకుండా ‘ఏఫోదు’గా నిలిపాం.
