id: 1SA.30.9
reference: 1 Samuel 30:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד ה֚וּא וְ/שֵׁשׁ מֵא֥וֹת אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד נַ֣חַל הַ/בְּשׂ֑וֹר וְ/הַ/נּֽוֹתָרִ֖ים עָמָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
translation:
  language: te
  text: అప్పుడు దావీదు తనతో ఉన్న ఆరువందల మందితో కలిసి వెళ్లాడు. వారు బెసోరు వాగు[a] వరకు వచ్చారు; మిగిలినవారు అక్కడే ఆగిపోయారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బెసోరు వాగు’ను ‘బెసోరు ఎండవాగు’ అని కూడా అనువదించవచ్చు. ఇది కాలానుగుణంగా నీరు ప్రవహించే వాగు లేదా లోయను సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘మిగిలినవారు నిలిచారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: అప్పుడు ... వెళ్లాడు
  rationale: ఈ వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథన శైలిలో ‘అప్పుడు’ సహజంగా ఉంటుంది; הלך యొక్క సాధారణ అర్థాన్ని ‘వెళ్లాడు’ నిలుపుతుంది.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  choice: దావీదు తనతో ఉన్న ఆరువందల మందితో కలిసి
  rationale: స్వతంత్ర సర్వనామమైన הוּא దావీదుతో పాటు ఆరువందల మంది వెళ్లారని నొక్కి చెబుతుంది. తెలుగులో ‘తనతో ... కలిసి’ అనే నిర్మాణం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది. אִישׁ సందర్భంలో పురుషులను సూచించినా, సంఖ్యతో కూడిన ‘మంది’ తెలుగులో స్పష్టంగా, అనవసర భారంలేకుండా ఉంటుంది.
- source_word: וַיָּבֹאוּ
  choice: వారు ... వచ్చారు
  rationale: బహువచన క్రియ దావీదును, అతనితో ఉన్నవారిని కలిపి సూచిస్తుంది. ‘వచ్చారు’ בוא యొక్క సూటి కథనార్థాన్ని అందిస్తుంది.
- source_word: עַד נַחַל הַבְּשׂוֹר
  choice: బెసోరు వాగు వరకు
  rationale: נַחַל అనేది ప్రవాహం, వాగు లేదా కాలానుగుణంగా నీరు ప్రవహించే లోయను సూచించవచ్చు. సాధారణ తెలుగు పాఠకునికి ‘వాగు’ సహజమైనది; ‘వరకు’ עַד భావాన్ని నిలుపుతుంది.
- source_word: וְהַנּוֹתָרִים
  choice: మిగిలినవారు
  rationale: ఈ కృదంత రూపం మిగిలిన వ్యక్తులను సూచిస్తుంది. తరువాతి సందర్భం వారు ప్రయాణాన్ని కొనసాగించలేదని స్పష్టం చేస్తుంది; అయితే ప్రధాన పాఠంలో అంతకంటే ఎక్కువ వివరణను చేర్చలేదు.
- source_word: עָמָדוּ
  choice: అక్కడే ఆగిపోయారు
  rationale: עמד యొక్క ప్రాథమిక అర్థం ‘నిలిచారు’; ప్రయాణ సందర్భంలో అది ముందుకు వెళ్లకుండా ఆగి అక్కడే ఉండడాన్ని సూచిస్తుంది. ‘ఆగిపోయారు’ ఆధునిక తెలుగులో ఆ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘అక్కడే’ అనేది స్థలసంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీ పాఠంలోని వరుస కథన గమనాన్ని రెండు వాక్యాలుగా సహజీకరించగా, చివరి క్రియలోని అక్షరార్థం–సందర్భార్థం భేదాన్ని పాదటిప్పణిలో నిలిపాం.
