id: 1SA.30.19
reference: 1 Samuel 30:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֣א נֶעְדַּר לָ֠/הֶם מִן הַ/קָּטֹ֨ן וְ/עַד הַ/גָּד֜וֹל וְ/עַד בָּנִ֤ים וּ/בָנוֹת֙ וּ/מִ/שָּׁלָ֔ל וְ/עַ֛ד כָּל אֲשֶׁ֥ר לָקְח֖וּ לָ/הֶ֑ם הַ/כֹּ֖ל הֵשִׁ֥יב דָּוִֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/019.yaml
  text: Nothing of theirs was missing[a], from small to great, sons and daughters, spoil, or anything that had been taken from them[b]; David brought back everything.
translation:
  language: te
  text: చిన్నవారి నుండి పెద్దవారి వరకు, కుమారులూ కుమార్తెలూ, దోపుడు సొమ్మూ, అమాలేకీయులు తమకోసం తీసుకున్న సమస్తమూ[a]—వారికి ఏదీ లోటుకాలేదు. దావీదు అన్నిటినీ తిరిగి తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, ‘వారు తమకోసం తీసుకున్న సమస్తం.’ కర్త స్పష్టంగా చెప్పబడలేదు; సందర్భానుసారం అది అమాలేకీయులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶעְדַּר
  choice: కొదువపడలేదు
  rationale: నిఫాల్ రూపం ఇక్కడ తిరిగి సంపాదించిన ప్రజలు లేదా వస్తువుల్లో ఏదీ లేకపోలేదని సూచిస్తుంది. ‘కొదువపడలేదు’ సహజమైన తెలుగులో ఈ భావాన్ని నిలుపుతుంది.
- source_word: לָהֶם
  choice: వారికి చెందిన వాటిలో
  rationale: సంబంధిత దాతివును తెలుగులో స్వామ్యార్థకంగా వ్యక్తపరచడం సహజం; ప్రజలనూ ఆస్తినీ రెండింటినీ చేర్చేలా ‘వాటిలో’ వాడబడింది.
- source_word: מִן הַקָּטֹן וְעַד הַגָּדוֹל
  choice: చిన్నవారి నుండి పెద్దవారి వరకు
  rationale: హీబ్రూ సమగ్రతను సూచించే జంటను దగ్గరగా అనుసరిస్తుంది. సందర్భంలో ఇది వయస్సు లేదా స్థాయి అనే రెండింటిలో ఏదో ఒకదానికే పరిమితం కాకుండా వ్యక్తులను సూచించగలదు.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులుగానీ కుమార్తెలుగానీ
  rationale: హీబ్రూ మగ, ఆడ సంతానాన్ని విడిగా పేర్కొంటున్నందున ఆ ప్రత్యేకతను నిలిపింది.
- source_word: מִשָּׁלָל
  choice: దోపుడు సొమ్ముగానీ
  rationale: దాడిలో అపహరించిన వస్తువులను సూచించే సహజమైన ఆధునిక తెలుగు పదబంధం.
- source_word: כָּל אֲשֶׁר לָקְחוּ לָהֶם
  choice: వారు తమ కోసం తీసుకుపోయిన మరేదిగానీ
  rationale: అక్షరార్థమైన ‘వారు తమ కోసం తీసుకున్న సమస్తం’ అనే భావాన్ని నిలుపుతుంది; కర్త అమాలేకీయులని సందర్భం తెలియజేస్తుంది. జాబితాలో సహజత కోసం ‘మరేదిగానీ’ అని మలచబడింది.
- source_word: הַכֹּל הֵשִׁיב
  choice: సమస్తాన్నీ తిరిగి తీసుకొచ్చాడు
  rationale: שׁוב హిఫీల్ రూపంలోని ‘తిరిగి వచ్చేటట్లు చేయడం’ అనే స్పష్టమైన కథన చర్యను తెలియజేస్తుంది.
- source_word: דָּוִד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలితో అనువదించబడింది. హీబ్రూ జాబితా నిర్మాణాన్ని తెలుగులోని ‘గానీ’ సముచ్చయాలతో సహజంగా మలిచింది; ‘చిన్నవారి నుండి పెద్దవారి వరకు’ అనే పదబంధంలోని వయస్సు/స్థాయి అస్పష్టతను పరిష్కరించకుండా నిలిపింది.
