  text: Then David and the people who were with him raised their voices and wept until they had no strength left to weep[a].
translation:
  language: te
  text: అప్పుడు దావీదు మరియు అతనితో ఉన్న ప్రజలు బిగ్గరగా రోదించారు; రోదించడానికి వారిలో శక్తి లేకపోయేంతవరకు రోదించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “దావీదు మరియు అతనితో ఉన్న ప్రజలు తమ స్వరాన్ని ఎత్తి రోదించారు; రోదించడానికి వారిలో శక్తి లేకపోయేంతవరకు రోదించారు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת קוֹלָם
  choice: బిగ్గరగా రోదించారు
  rationale: ‘తమ స్వరాన్ని ఎత్తారు’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ‘బిగ్గరగా’ అని వ్యక్తం చేస్తూ, వెంట వచ్చే రోదనతో అనుసంధానించాం.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న ప్రజలు
  rationale: సందర్భంలో వీరు దావీదు యోధులైనా, మూలపాఠంలోని עָם సాధారణంగా ‘ప్రజలు’; అందువల్ల ‘సైనికులు’ లేదా ‘మనుషులు’ అని ప్రత్యేకీకరించలేదు.
- source_word: וַיִּבְכּוּ
  choice: రోదించారు
  rationale: בכה ఇక్కడ దుఃఖంతో ఏడవడాన్ని సూచిస్తుంది. గంభీర కథన శైలికి ‘రోదించారు’ సరిపోతుంది.
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ
  choice: వారిలో శక్తి లేకపోయేంతవరకు
  rationale: ‘వారిలో శక్తి లేదు’ అనే మూల నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగులో నిలిపాం.
- source_word: לִבְכּוֹת
  choice: రోదించడానికి
  rationale: మూలపాఠంలోని בכה పదపునరుక్తిని తెలుగులోనూ ‘రోదించారు/రోదించడానికి’గా నిలిపాం.
