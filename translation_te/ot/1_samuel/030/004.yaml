  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కథన గాంభీర్యాన్ని నిలిపే శైలి. హీబ్రూ నుడికారానికి అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాం.
