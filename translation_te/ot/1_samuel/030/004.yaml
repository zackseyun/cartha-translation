  - severity: low
    issue: The main clause’s ending is slightly awkward without a final repeated verb after the exhaustion clause.
    rationale: Restoring ‘రోదించారు’ after ‘రోదించడానికి వారిలో శక్తి లేకపోయేంతవరకు’ gives a complete, fluent Telugu sentence and reflects the Hebrew repetition of the weeping root.
