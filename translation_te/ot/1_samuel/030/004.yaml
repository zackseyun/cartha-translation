  naturalness: ‘బిగ్గరగా రోదించారు’ is natural modern Telugu for the idiom of raising the voice in grief. Adding ‘మరియు’ between ‘దావీదు’ and ‘అతనితో ఉన్న ప్రజలు’ resolves an avoidable grammatical awkwardness. ‘ఎంతవరకు’ is written as one word in the revised text.
  terminology: ‘దావీదు,’ ‘ప్రజలు,’ ‘రోదించారు,’ and ‘శక్తి’ are appropriate and source-sensitive. The footnote retains the more literal voice-raising idiom without overstating the singular Hebrew noun in unnatural Telugu.
