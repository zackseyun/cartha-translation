id: 1SA.30.23
reference: 1 Samuel 30:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
translation:
  language: te
  text: 'అయితే దావీదు ఇలా అన్నాడు: “యాహ్వే మనకు ఇచ్చిన దాని విషయంలో, నా సోదరులారా, మీరు అలా చేయకూడదు. ఆయన మనలను కాపాడాడు; మన మీదికి వచ్చిన దోపిడీ దండును మన చేతికి అప్పగించాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  choice: మీరు అలా చేయకూడదు
  rationale: బహువచన శ్రోతలకు చెప్పిన ప్రత్యక్ష నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో దృఢంగా వ్యక్తం చేస్తుంది.
- source_word: אֶחָי
  choice: నా సోదరులారా
  rationale: దావీదు తన మనుషులను ఉద్దేశించి వాడిన అక్షరార్థ సహోదర సంబోధనను నిలుపుతుంది.
- source_word: אֵת אֲשֶׁר נָתַן יְהוָה לָנוּ
  choice: యాహ్వే మనకు ఇచ్చిన దాని విషయంలో
  rationale: సంక్షిప్తమైన హీబ్రూ నిర్మాణం దావీదు చర్చిస్తున్న విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ఈ రూపం ఆ సంబంధాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా లిప్యంతరీకరిస్తుంది.
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  choice: ఆయనే మనల్ని కాపాడి
  rationale: యుద్ధ సందర్భంలో శמר్ సూచించే రక్షణ భావాన్ని సహజంగా అందిస్తుంది; 'ఆయనే' దేవుని కార్యాన్ని ఉద్ఘాటిస్తుంది.
- source_word: הַגְּדוּד
  choice: దోపిడీ దండు
  rationale: ఈ సందర్భంలో గెదూద్ సాధారణ సైన్యం కాక, దాడి చేసి దోచుకునే శత్రు బృందాన్ని సూచిస్తుంది.
- source_word: הַבָּא עָלֵינוּ
  choice: మన మీదికి వచ్చిన
  rationale: శత్రుత్వంతో సమీపించిన దిశాత్మక భావాన్ని మూలానికి దగ్గరగా నిలుపుతుంది.
- source_word: בְּיָדֵנוּ
  choice: మన చేతికి
  rationale: ఎవరి అధికారంలోకైనా అప్పగించడాన్ని సూచించే హీబ్రూ ఏకవచన 'చేయి' నుడికారాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉంది; అందువల్ల దానిని 'ప్రభువు' వంటి బిరుదుతో భర్తీ చేయకుండా యాహ్వే అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ నుడికారమైన 'మన చేతికి అప్పగించాడు' నిలుపబడింది. ఈ పాఠంలో పాదసూచిక అవసరం లేదు.
