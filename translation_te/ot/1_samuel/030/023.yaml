revisions:
- from: అయితే దావీదు, “నా సోదరులారా, యాహ్వే మనకు ఇచ్చిన దాని విషయంలో మీరు అలా చేయకూడదు. ఆయనే మనల్ని కాపాడి, మన మీదికి వచ్చిన దోపిడీ దండును మన చేతికి అప్పగించాడు” అన్నాడు.
  to: 'అయితే దావీదు ఇలా అన్నాడు: “యాహ్వే మనకు ఇచ్చిన దాని విషయంలో, నా సోదరులారా, మీరు అలా చేయకూడదు. ఆయన మనలను కాపాడాడు; మన మీదికి వచ్చిన దోపిడీ దండును మన చేతికి అప్పగించాడు.”'
  rationale: The revision retains the source’s compressed topical construction without overexplaining it, improves Telugu word order, and renders Yahweh’s preservation and delivery of the raiding band as parallel completed actions.
