  edition: WLC
  text: וַ/יִּתְּנוּ ל/וֹ֩ פֶ֨לַח דְּבֵלָ֜ה וּ/שְׁנֵ֤י צִמֻּקִים֙ וַ/יֹּ֔אכַל וַ/תָּ֥שָׁב רוּח֖/וֹ אֵלָ֑י/ו כִּ֠י לֹֽא אָ֤כַל לֶ֨חֶם֙ וְ/לֹא שָׁ֣תָה מַ֔יִם שְׁלֹשָׁ֥ה יָמִ֖ים וּ/שְׁלֹשָׁ֥ה לֵילֽוֹת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
translation:
  language: te
  text: వారు అతనికి ఒత్తి తయారుచేసిన అంజూరపు పండ్ల ముద్దలో ఒక ముక్క[a], ఎండు ద్రాక్షల రెండు గుత్తులు[b] ఇచ్చారు. అతడు తిన్నాడు; అప్పుడు అతనికి ప్రాణం తిరిగి వచ్చింది[c]. ఎందుకంటే అతడు మూడు రోజులు, మూడు రాత్రులు రొట్టె తినలేదు, నీళ్లు తాగలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది అంజూరపు పండ్లను ఒత్తి తయారుచేసిన ముద్ద.
    reason: cultural_note
  - marker: b
    text: లేదా, “ఎండు ద్రాక్షల రెండు ముద్దలు.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “అతని ఆత్మ అతనికి తిరిగి వచ్చింది”; సందర్భానుసారం, అతడు మళ్లీ తేరుకున్నాడు లేదా అతనికి బలం తిరిగి వచ్చింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  choice: ఒత్తి చేసిన అంజూరపు పండ్ల ముద్దలో ఒక ముక్క
  rationale: פֶלַח అంటే ముక్క లేదా కోసిన భాగం; דְּבֵלָה తాజా పండు కాకుండా ఒత్తి చేసిన అంజూరపు పండ్ల ముద్దను సూచిస్తుంది. తెలుగు పాఠకులకు ఆ ఆహార పదార్థం స్వభావం స్పష్టంగా ఉండేలా అనువదించబడింది.
- source_word: שְׁנֵי צִמֻּקִים
  choice: రెండు ఎండు ద్రాక్ష గెలలు
  rationale: צִמֻּקִים ఎండు ద్రాక్షలను సూచిస్తుంది; ఇక్కడ రెండు లెక్కించదగిన సముదాయాలు ఉన్నాయి. అవి ముద్దలుగా ఒత్తి చేసినవా లేక గెలలుగా ఉన్నవా అనేది స్పష్టంగా లేనందున ప్రధాన పాఠంలో సహజమైన రూపాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: అతని ప్రాణం అతనికి తిరిగి వచ్చింది
  rationale: హీబ్రూ రూపకాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతూ, సందర్భంలో మళ్లీ తేరుకోవడం లేదా బలం పొందడం అనే భావాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: לֶחֶם
  choice: రొట్టె
  rationale: లֶחֶם యొక్క concrete అర్థమైన ‘రొట్టె’ను నిలిపాం; దానిని సాధారణంగా ‘ఆహారం’ అని విస్తరించలేదు.
- source_word: שָׁתָה מַיִם
  choice: నీళ్లు తాగలేదు
  rationale: మూలంలో నీటిని ప్రత్యేకంగా పేర్కొన్నందున దానిని అలాగే నిలిపాం.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: మూడు పగళ్లు, మూడు రాత్రులు
  rationale: మూలంలోని కాలవ్యవధిని నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: רוּחַ అనే పదాన్ని ఇక్కడ ఎలా ప్రతిబింబించాలి
  choice: ప్రాణం
  alternative: ఆత్మ; బలం; అతడు మళ్లీ తేరుకున్నాడు
  rationale: ఈ సందర్భంలో ఆకలి, దాహం వల్ల క్షీణించిన వ్యక్తి ఆహారం తిని పునరుజ్జీవించడం ఉద్దేశం. ‘ప్రాణం తిరిగి వచ్చింది’ మూల రూపకాన్ని నిలుపుతుంది; దానిని కేవలం శారీరక బలంగా లేదా ప్రత్యేకమైన ఆత్మసంబంధ ప్రకటనగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని వరుస చర్యలు, స్పష్టమైన ఆహార–నీటి పదాలు, ‘ప్రాణం తిరిగి వచ్చింది’ అనే హీబ్రూ రూపకం నిలుపబడ్డాయి.
