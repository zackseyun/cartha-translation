- from: పట్టణంలో ఉన్న స్త్రీలను చిన్నవారి నుండి పెద్దవారి వరకు[a] వారు చెరపట్టారు. ఎవరినీ చంపకుండా, వారిని తీసుకెళ్లి తమ దారిన వెళ్లిపోయారు.
  to: పట్టణంలో ఉన్న స్త్రీలను, చిన్నవారి నుండి పెద్దవారి వరకు[a], వారు చెరపట్టారు. వారు ఎవరినీ చంపలేదు; వారిని నడిపించుకుంటూ తమ దారిన వెళ్లిపోయారు.
