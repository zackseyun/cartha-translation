translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘చిన్నవారి నుండి పెద్దవారి వరకు’ అనే మూలభాషా నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, వయస్సు ఆధారిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
