source:
  edition: WLC
  text: וַ/יִּשְׁבּ֨וּ אֶת הַ/נָּשִׁ֤ים אֲשֶׁר בָּ/הּ֙ מִ/קָּטֹ֣ן וְ/עַד גָּד֔וֹל לֹ֥א הֵמִ֖יתוּ אִ֑ישׁ וַ/יִּֽנְהֲג֔וּ וַ/יֵּלְכ֖וּ לְ/דַרְכָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
translation:
  language: te
  text: పట్టణంలో ఉన్న స్త్రీలను, చిన్నవారి నుండి పెద్దవారి వరకు[a], వారు చెరపట్టారు. వారు ఎవరినీ చంపలేదు; వారిని నడిపించుకుంటూ తమ దారిన వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చిన్నవయసువారి నుండి ముసలివారి వరకు.’ ‘చిన్నవారి నుండి పెద్దవారి వరకు’ అనే హీబ్రూ నుడికారం ఎవరినీ మినహాయించకుండా మొత్తం పరిధిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: చెరపట్టారు
  rationale: యుద్ధ సందర్భంలో మనుషులను బందీలుగా పట్టుకొని తీసుకెళ్లడాన్ని సూచించే שׁבה క్రియకు సహజమైన తెలుగు సమానార్థకం.
- source_word: הַנָּשִׁים
  choice: స్త్రీలను
  rationale: మూలపదం సాధారణంగా ‘స్త్రీలు’ అని అర్థం; సందర్భంలో భార్యలు కూడా ఉన్నప్పటికీ, అర్థాన్ని అనవసరంగా కుదించలేదు.
- source_word: אֲשֶׁר בָּהּ
  choice: పట్టణంలో ఉన్న
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం మునుపటి వచనంలోని సిక్లగు పట్టణాన్ని సూచిస్తుంది; తెలుగులో ‘దానిలో’ కంటే ‘పట్టణంలో’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: చిన్నవారి నుండి పెద్దవారి వరకు
  rationale: వయస్సు, స్థాయి లేదా పరిమాణ పరిధి అంతటినీ సూచించగల హెబ్రీ నుడికారంలోని ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
- source_word: לֹא הֵמִיתוּ אִישׁ
  choice: ఎవరినీ చంపకుండా
  rationale: ఇక్కడ אִישׁ ప్రత్యేకంగా పురుషుణ్ణి కాక ‘ఒక్క వ్యక్తినైనా’ అనే అనిర్దిష్ట భావాన్ని ఇస్తుంది; తెలుగు వాక్యప్రవాహంలో ఈ రూపం సహజం.
- source_word: וַיִּנְהֲגוּ
  choice: వారిని తీసుకెళ్లి
  rationale: נהג బలవంతంగా నడిపించడం లేదా తీసుకెళ్లడం అనే భావాన్ని ఇస్తుంది; ఇక్కడ కర్మ ముందే పేర్కొన్న చెరపట్టబడినవారు.
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  choice: తమ దారిన వెళ్లిపోయారు
  rationale: వారు బయలుదేరి తమ ప్రయాణాన్ని కొనసాగించారని తెలిపే హెబ్రీ నుడికారానికి సహజమైన తెలుగు రూపం.
