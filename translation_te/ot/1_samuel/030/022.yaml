source:
  edition: WLC
  text: וַ/יַּ֜עַן כָּל אִֽישׁ רָ֣ע וּ/בְלִיַּ֗עַל מֵֽ/הָ/אֲנָשִׁים֮ אֲשֶׁ֣ר הָלְכ֣וּ עִם דָּוִד֒ וַ/יֹּאמְר֗וּ יַ֚עַן אֲשֶׁ֣ר לֹֽא הָלְכ֣וּ עִמִּ֔/י לֹֽא נִתֵּ֣ן לָ/הֶ֔ם מֵ/הַ/שָּׁלָ֖ל אֲשֶׁ֣ר הִצַּ֑לְנוּ כִּֽי אִם אִ֤ישׁ אֶת אִשְׁתּ/וֹ֙ וְ/אֶת בָּנָ֔י/ו וְ/יִנְהֲג֖וּ וְ/יֵלֵֽכוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
translation:
  language: te
  text: 'అప్పుడు దావీదుతో వెళ్లిన మనుషుల్లో దుష్టులైన, పనికిమాలిన వారందరూ ఇలా జవాబిచ్చారు: “వారు నాతో[b] రాలేదు కాబట్టి, మనం తిరిగి పొందుకున్న దోపుడు సొమ్ములో[a] వారికి ఏదీ ఇవ్వము. అయితే ప్రతి మనిషి తన భార్యను, తన పిల్లలను తీసుకొని, వారిని వెంటబెట్టుకొని వెళ్లిపోవచ్చు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధంలో కొల్లగొట్టిన సొత్తులో.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో “నాతో” అని ఏకవచనం ఉంది; మాట్లాడుతున్నవారు ఒక సమూహమైనప్పటికీ మూలంలోని ఈ వచన మార్పు అలాగే ఉంచబడింది.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: అప్పుడు ... అని జవాబిచ్చారు
  rationale: హీబ్రూ కథన క్రమాన్నీ ప్రత్యుత్తర భావాన్నీ సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తుంది; సమూహ కర్తకు అనుగుణంగా బహువచనం వాడబడింది.
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  choice: దుష్టులూ పనికిమాలినవారూ అయిన వారందరూ
  rationale: רָע లోని నైతిక దుష్టత్వాన్ని, בְלִיַּעַל లోని నీచత్వం/విలువలేమి భావాన్ని రెండింటినీ నిలుపుతుంది; దీనిని తరువాతి కాలపు 'బెలీయాలు' అనే వ్యక్తినామంగా తీసుకోదు.
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  choice: దావీదుతో వెళ్లిన మనుషుల్లో
  rationale: מִן యొక్క విభాగార్థాన్ని సహజమైన తెలుగులో చూపిస్తూ, మాట్లాడినవారు దావీదు వెంట వెళ్లిన సమూహంలోని కొందరని స్పష్టం చేస్తుంది.
- source_word: יַעַן אֲשֶׁר
  choice: కాబట్టి
  rationale: వారు నిరాకరించడానికి చెప్పిన కారణాన్ని సహజంగా కలుపుతుంది.
- source_word: לֹא הָלְכוּ עִמִּי
  choice: వారు నాతో రాలేదు
  rationale: సమూహం మాట్లాడుతున్నప్పటికీ మూలపాఠంలోని ప్రథమ పురుష ఏకవచనమైన 'నాతో'ను యథాతథంగా నిలుపుతుంది.
- source_word: לֹא נִתֵּן לָהֶם
  choice: మనం ... వారికి ఏదీ ఇవ్వము
  rationale: ప్రథమ పురుష బహువచన సంకల్పాన్ని తెలుగులో దృఢమైన నిరాకరణగా వ్యక్తపరుస్తుంది.
- source_word: מֵהַשָּׁלָל אֲשֶׁר הִצַּלְנוּ
  choice: మనం తిరిగి సంపాదించుకున్న దోపుడు సొమ్ములో
  rationale: שָׁלָל యుద్ధ దోపిడిని సూచిస్తుంది; נצל హిఫీల్ ఇక్కడ శత్రువుల చేతినుంచి తిరిగి పొందిన వస్తువులను సూచిస్తున్నందున 'తిరిగి సంపాదించుకున్న' సందర్భార్థాన్ని అందిస్తుంది.
- source_word: כִּי אִם
  choice: అయితే
  rationale: ముందటి సంపూర్ణ నిరాకరణకు ఏకైక మినహాయింపును పరిచయం చేస్తుంది.
- source_word: אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  choice: ప్రతి మనిషి తన భార్యను, తన పిల్లలను
  rationale: אִישׁ యొక్క పంపిణీ భావాన్ని 'ప్రతి మనిషి'గా, בָּנָיו ను కుటుంబ సందర్భంలో లింగసమావేషకమైన 'పిల్లలు'గా అందిస్తుంది.
- source_word: וְיִנְהֲגוּ וְיֵלֵכוּ
  choice: వారిని వెంటబెట్టుకొని వెళ్లిపోవచ్చు
  rationale: నడిపించుకొని తీసుకుపోవడం మరియు వెళ్లిపోవడం అనే రెండు క్రియల సంయుక్త భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: בְלִיַּעַל పదార్థం
  choice: పనికిమాలినవారు
  alternative: ధర్మవిరోధులు; బెలీయాలు సంబంధులు
  rationale: ఈ సందర్భంలో పదం వ్యక్తులను అవమానకరంగా వర్ణించే సాధారణ నామసంబంధ పదం; దయ్యానికి చెందిన వ్యక్తినామ భావాన్ని మూలపాఠం కోరదు.
- issue: עִמִּי లోని ఏకవచనం
  choice: నాతో
  alternative: మాతో
  rationale: చుట్టూ బహువచన ప్రయోగాలు ఉన్నప్పటికీ మసొరేటిక్ పాఠంలోని నిజమైన ఏకవచనాన్ని సవరించకుండా ఉంచి, వక్తల సమూహంలోని ప్రతినిధి స్వరమో వచన మార్పో అనే అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. 'దోపుడు సొమ్ము' యుద్ధంలో తిరిగి పొందిన కొల్లసొత్తును సహజంగా సూచిస్తుంది. మూలంలోని ఏకవచన-బహువచన ఉద్రిక్తతను పాదటిప్పణితో కాపాడింది.
