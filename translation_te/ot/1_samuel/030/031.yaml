translation:
  language: te
  text: హెబ్రోనులో ఉన్నవారికీ, దావీదు మరియు అతని మనుషులు సంచరించిన ప్రదేశాలన్నిటికీ పంపించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לַ/אֲשֶׁר בְּ/חֶבְרוֹן
  choice: హెబ్రోనులో ఉన్నవారికీ
  rationale: ముందటి వచనంలో మొదలైన కానుకలు అందుకున్నవారి జాబితాను కొనసాగించే ప్రయోగం ఇది. తెలుగులో బహువచన వ్యక్తులను సూచించేలా ‘ఉన్నవారికి’ అనడం సహజం.
- source_word: וּֽ/לְ/כָל הַ/מְּקֹמוֹת
  choice: ప్రదేశాలన్నిటికీ
  rationale: כָל తో కూడిన బహువచన నామవాచకంలోని సమగ్ర భావాన్ని సహజమైన తెలుగు క్రమంలో నిలుపుతుంది.
- source_word: אֲשֶׁר ... שָׁם
  choice: … ప్రదేశాలు
  rationale: స్థలాలను పూర్వపదంగా తీసుకునే సంబంధవాక్యంగా అనువదించబడింది; שָׁם భావం తెలుగు నిర్మాణంలో సహజంగా ఇమిడిపోయింది.
- source_word: הִתְהַלֶּךְ
  choice: సంచరిస్తూ వచ్చిన
  rationale: హిత్పయేల్ రూపం ఒకసారి వెళ్లడాన్ని కాక, చోటుచోటికి తిరుగుతూ ఉండే పునరావృత సంచారాన్ని సూచిస్తుంది.
- source_word: דָּוִד הוּא
  choice: దావీదు
  rationale: ఇక్కడ స్వతంత్ర సర్వనామం దావీదును మళ్లీ గుర్తింపజేసే appositional ప్రయోగంగా అర్థమవుతుంది; తెలుగులో ‘దావీదే’ లేదా ‘దావీదు స్వయంగా’ అని అనవసరమైన ప్రత్యేక నొక్కు ఇవ్వలేదు.
- source_word: וַ/אֲנָשָׁיו
  choice: అతని మనుషులు
  rationale: సందర్భంలో ఇది దావీదుతో ఉన్న పురుష సహచరులు లేదా యోధుల బృందాన్ని సూచిస్తుంది.
