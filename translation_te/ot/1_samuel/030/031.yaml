translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వచనం ముందటి వాక్యానికి కొనసాగింపైనా, తెలుగులో స్వతంత్రంగా చదవడానికి అవసరమైన ‘పంపించాడు’ అనే క్రియను సందర్భం నుంచి పూరించాం; మూలంలోని గ్రహీతల జాబితా నిర్మాణాన్ని దత్తివిభక్తితో నిలిపాం.
