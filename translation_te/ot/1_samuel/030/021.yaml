  text: וַ/יָּבֹ֣א דָוִ֗ד אֶל מָאתַ֨יִם הָ/אֲנָשִׁ֜ים אֲשֶֽׁר פִּגְּר֣וּ מִ/לֶּ֣כֶת אַחֲרֵ֣י דָוִ֗ד וַ/יֹּֽשִׁיבֻ/ם֙ בְּ/נַ֣חַל הַ/בְּשׂ֔וֹר וַ/יֵּֽצְאוּ֙ לִ/קְרַ֣את דָּוִ֔ד וְ/לִ/קְרַ֖את הָ/עָ֣ם אֲשֶׁר אִתּ֑/וֹ וַ/יִּגַּ֤שׁ דָּוִד֙ אֶת הָ/עָ֔ם וַ/יִּשְׁאַ֥ל לָ/הֶ֖ם לְ/שָׁלֽוֹם־־׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
translation:
  language: te
  text: దావీదు వెంట వెళ్లలేనంతగా అలసిపోయి, బెసోరు వాగు దగ్గర ఉండేలా చేసిన ఆ రెండువందల మంది వద్దకు దావీదు వచ్చాడు.[a] వారు దావీదును, అతనితో ఉన్న ప్రజలను కలవడానికి ఎదురుగా వచ్చారు. దావీదు ఆ ప్రజల దగ్గరికి వెళ్లి వారి క్షేమం గురించి అడిగాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు వెంట వెళ్లలేక వెనుకబడినవారు.” ఇక్కడి హీబ్రూ క్రియ అలసిపోవడం, బలహీనపడడం లేదా వెనుకబడిపోవడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారి శాంతి గురించి అడిగాడు”; ఇది వారి క్షేమం లేదా బాగోగులు విచారించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּגְּרוּ
  choice: వెంట వెళ్లలేనంతగా అలసిపోయి
  rationale: ఈ క్రియ బలహీనపడి ఇక ముందుకు సాగలేని స్థితిని సూచిస్తుంది. సందర్భంలో ఆ రెండువందల మంది దావీదుతో కొనసాగకపోవడానికి కారణాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִלֶּכֶת אַחֲרֵי דָוִד
  choice: దావీదు వెంట వెళ్లలేనంతగా
  rationale: מן‌తో కూడిన క్రియారూపం కొనసాగి వెళ్లలేకపోవడాన్ని సూచిస్తుంది; אַחֲרֵי భావాన్ని ‘వెంట’ నిలుపుతుంది.
- source_word: וַיֹּשִׁיבֻם
  choice: ఉంచబడిన
  rationale: హిఫీల్ రూపానికి ‘కూర్చోబెట్టడం, ఒకచోట ఉండేలా చేయడం, అక్కడ ఉంచడం’ అనే పరిధి ఉంది. ఎవరు ఉంచారనే బహువచన కర్తను తెలుగులో అనవసరంగా నిర్దిష్టం చేయకుండా కర్మణి రూపం మూలంలోని భావాన్ని కాపాడుతుంది.
- source_word: בְּנַחַל הַבְּשׂוֹר
  choice: బెసోరు వాగు దగ్గర
  rationale: נחל కాలానుగుణంగా ప్రవహించే వాగు లేదా దాని ప్రవాహపాత్రను సూచించవచ్చు. కథనంలో స్థలపేరుగా సహజంగా ఉండేందుకు ‘బెసోరు వాగు’ అని అనువదించబడింది.
- source_word: לִקְרַאת
  choice: కలుసుకోవడానికి
  rationale: ఎదురుగా వెళ్లి స్వాగతించడం లేదా కలుసుకోవడం అనే తటస్థ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న ప్రజలు
  rationale: עָם అనే విస్తృత పదాన్ని కేవలం ‘సైనికులు’గా కుదించకుండా, దావీదుతో ఉన్న సమూహాన్ని సూచించేలా ఉంచుతుంది.
- source_word: וַיִּגַּשׁ ... אֶת הָעָם
  choice: దావీదు ఆ ప్రజల దగ్గరికి వెళ్లి
  rationale: נגשׁ యొక్క ‘సమీపించడం’ అనే చర్యను తరువాతి క్షేమ విచారణతో కలిపివేయకుండా వేరుగా నిలుపుతుంది.
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: వారి క్షేమం అడిగాడు
  rationale: శాంతి లేదా బాగోగుల గురించి విచారించే హీబ్రూ నుడికారాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
