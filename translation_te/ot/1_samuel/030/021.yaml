  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ప్రజలు’ అనే పదం మూలంలోని עָם విస్తృతిని నిలుపుతుంది; ‘బెసోరు వాగు’ స్థలపేరును సహజంగా అందిస్తుంది.
