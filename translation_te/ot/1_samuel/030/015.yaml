  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ דָּוִ֔ד הֲ/תוֹרִדֵ֖/נִי אֶל הַ/גְּד֣וּד הַ/זֶּ֑ה וַ/יֹּ֡אמֶר הִשָּׁבְעָ/ה֩ לִּ֨/י בֵֽ/אלֹהִ֜ים אִם תְּמִיתֵ֗/נִי וְ/אִם תַּסְגִּרֵ֨/נִי֙ בְּ/יַד אֲדֹנִ֔/י וְ/אוֹרִֽדְ/ךָ֖ אֶל הַ/גְּד֥וּד הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
translation:
  language: te
  text: దావీదు అతనితో, “ఆ దోపిడీ దండు[a] ఉన్న చోటికి నన్ను కిందికి తీసుకెళ్తావా?” అని అడిగాడు. అతడు, “మీరు నన్ను చంపరనీ, నా యజమాని చేతికి నన్ను అప్పగించరనీ దేవుని సాక్షిగా నాకు ప్రమాణం చేయండి. అప్పుడు ఆ దోపిడీ దండు ఉన్న చోటికి మిమ్మల్ని కిందికి తీసుకెళ్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాడిచేసే దళం,” “దండు”; హీబ్రూ పదం దోచుకోవడానికి దాడులు చేసే సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי
  choice: నన్ను తీసుకెళ్తావా
  rationale: ירד ధాతువు హిఫీల్ రూపంలో అక్షరార్థంగా ‘కిందికి తీసుకెళ్లడం’ అనే దిశార్థం ఉన్నా, ఇక్కడ ఆ దండు ఉన్న చోటుకు మార్గం చూపించి తీసుకెళ్లడమే సందర్భార్థం. సహజమైన ఆధునిక తెలుగులో ‘తీసుకెళ్తావా’ అని ఇచ్చాం.
- source_word: הַגְּדוּד
  choice: దోపిడీ దండు
  rationale: גדוד ఇక్కడ సాధారణ సైనిక దళం కాక, దాడిచేసి దోచుకునే సంచార సమూహాన్ని సూచిస్తుంది. ‘దోపిడీ దండు’ ఆ లక్షణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: దేవుని పేరట నాకు ప్రమాణం చేయండి
  rationale: దేవుణ్ణి సాక్షిగా పిలిచే గంభీరమైన ప్రమాణాన్ని సహజమైన తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: אִם תְּמִיתֵנִי
  choice: మీరు నన్ను చంపరనీ
  rationale: ప్రమాణ సూత్రంలో אִם ద్వారా సూచితమైన ప్రతికూల భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  choice: నా యజమాని చేతికి నన్ను అప్పగించరనీ
  rationale: ‘చేతికి’ అనే మూలభాషా రూపకం అధికారం, అదుపు భావాలను నిలుపుతుంది; ‘అప్పగించు’ సగర్ హిఫీల్ యొక్క సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: אֲדֹנִי
  choice: నా యజమాని
  rationale: ఇది దేవుణ్ణి లేదా రాజబిరుదును కాక, ఈజిప్టీయుడైన సేవకుని మానవ యజమానిని సూచిస్తుంది.
- source_word: וְאוֹרִדְךָ
  choice: మిమ్మల్ని తీసుకెళ్తాను
  rationale: ముందటి హిఫీల్ రూపంతో భావసామ్యం ఉంచుతూ, ఆ దండు వద్దకు మార్గం చూపించి తీసుకెళ్లడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. దావీదు సేవకుణ్ణి ఏకవచన అనౌపచారిక రూపంలో సంబోధించగా, సేవకుడు దావీదును గౌరవ బహువచనంతో సంబోధించడం తెలుగు సామాజిక సందర్భానికి సహజంగా ఉంది. మూలంలోని ‘కిందికి’ అనే దిశార్థం తెలుగులో బలవంతంగా చేరిస్తే అసహజంగా ఉండేందున సందర్భానుగుణంగా ‘తీసుకెళ్లు’ అని ఇచ్చాం.
