translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. మూలంలోని దావీదు పేరుపునరుక్తి మరియు అమాలేకు అనే సమూహనామం నిలుపబడ్డాయి; ఒకే హీబ్రూ క్రియకు సందర్భానుగుణంగా రెండు సహజ తెలుగు పదబంధాలు ఉపయోగించబడ్డాయి.
