  text: David recovered all that Amalek had taken[a], and David rescued his two wives.
translation:
  language: te
  text: అమాలేకు తీసుకుపోయినదంతటినీ దావీదు తిరిగి పొందాడు[a]; తన ఇద్దరు భార్యలను కూడా దావీదు రక్షించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండు చోట్లా ‘విడిపించాడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ మూలపాఠంలో రెండు ఉపవాక్యాల్లోనూ ఒకే మూలక్రియ ఉంది; అయితే తీసుకుపోయిన వాటి విషయంలో ‘తిరిగి పొందాడు,’ భార్యల విషయంలో ‘రక్షించాడు’ అనడం తెలుగులో సహజంగా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל (נצל)
  choice: తిరిగి స్వాధీనం చేసుకున్నాడు / రక్షించాడు
  rationale: హీబ్రూలో ఒకే మూలక్రియ రెండుసార్లు వచ్చింది. మొదటి సందర్భంలో దోచుకొని తీసుకుపోయిన సమస్తాన్ని తిరిగి పొందడం భావం కాబట్టి ‘తిరిగి స్వాధీనం చేసుకున్నాడు’ సహజంగా ఉంది; భార్యల విషయంలో ‘రక్షించాడు’ సహజంగా ఉంది. ఈ సందర్భానుగుణ భేదాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  choice: అమాలేకు తీసుకుపోయినదంతా
  rationale: כָּל אֲשֶׁר యొక్క ‘అంతా/సమస్తం’ అనే విస్తృత భావాన్ని, కథన సందర్భంలో ముందే జరిగిన తీసుకుపోవడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲמָלֵק
  choice: అమాలేకు
  rationale: మూలంలో ఉన్న ఏకవచన సమూహనామాన్ని నిలుపుతూ, అమాలేకీయ ప్రజలను సమష్టిగా సూచించే రూపంగా అనువదించబడింది.
- source_word: שְׁתֵּי נָשָׁיו
  choice: తన ఇద్దరు భార్యలను
  rationale: సంఖ్యను స్పష్టంగా నిలుపుతుంది; తెలుగు వాక్యంలో కర్తతో సంబంధాన్ని సహజంగా తెలియజేయడానికి ‘తన’ వాడబడింది.
- source_word: דָּוִד ... דָּוִד
  choice: దావీదు ... దావీదు
  rationale: మూలంలోని పేరుపునరుక్తిని, దాని ఉద్ఘాటనను నిలుపుతుంది.
