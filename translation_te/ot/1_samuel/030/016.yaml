source:
  edition: WLC
  text: וַ/יֹּ֣רִדֵ֔/הוּ וְ/הִנֵּ֥ה נְטֻשִׁ֖ים עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ אֹכְלִ֤ים וְ/שֹׁתִים֙ וְ/חֹ֣גְגִ֔ים בְּ/כֹל֙ הַ/שָּׁלָ֣ל הַ/גָּד֔וֹל אֲשֶׁ֥ר לָקְח֛וּ מֵ/אֶ֥רֶץ פְּלִשְׁתִּ֖ים וּ/מֵ/אֶ֥רֶץ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
translation:
  language: te
  text: అతడు దావీదును కిందికి తీసుకువెళ్లినప్పుడు, ఇదిగో, వారు ఆ ప్రాంతమంతటా విస్తరించి[a] ఉన్నారు. వారు తింటూ, తాగుతూ, ఫిలిష్తీయుల దేశం నుంచీ యూదా దేశం నుంచీ తాము దోచుకున్న గొప్ప కొల్లసొమ్మును బట్టి[b] ఆనందోత్సవాలు జరుపుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ ప్రాంతమంతటా చెల్లాచెదురుగా ఉన్నారు.” హీబ్రూ పదం విస్తారంగా వ్యాపించి ఉండడాన్నిగానీ, చెల్లాచెదురుగా ఉండడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “గొప్ప కొల్లసొమ్ముతో.” ఇక్కడి హీబ్రూ ఉపసర్గ ఆ కొల్లసొమ్ము వారి సంబరాలకు కారణమని లేదా సందర్భమని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרִדֵהוּ
  choice: అతడు దావీదును కిందికి తీసుకువెళ్లినప్పుడు
  rationale: హిఫిల్ రూపంలోని ירדకు ‘కిందికి తీసుకువెళ్లు’ అనే దిశాసూచక భావం ఉంది. సందర్భంలో సర్వనామం సూచించే వ్యక్తి దావీదు అని స్పష్టంగా ఉండేందుకు పేరును ఉపయోగించాం; కథన క్రమాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా ఇచ్చాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా కనిపించిన దృశ్యంపై పాఠకుని దృష్టిని నిలిపే హీబ్రూ కథన సూచిక యొక్క సజీవతను నిలుపుతుంది.
- source_word: נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ
  choice: వారు ఆ ప్రాంతమంతటా విస్తరించి ఉన్నారు
  rationale: నిష్క్రియాత్మక కృదంతం విస్తారంగా వ్యాపించి ఉండడం లేదా చెల్లాచెదురుగా ఉండడం అనే భావాన్ని ఇస్తుంది. సందర్భం స్థానిక ప్రాంతాన్ని సూచిస్తున్నందున ‘భూమి అంతటా’ కంటే ‘ఆ ప్రాంతమంతటా’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֹכְלִים וְשֹׁתִים וְחֹגְגִים
  choice: తింటూ, తాగుతూ, ... సంబరాలు చేసుకుంటున్నారు
  rationale: మూడు కృదంతాలు ఏకకాలంలో కొనసాగుతున్న చర్యలను చూపుతాయి. వాటిని కలిపివేయకుండా వరుసగా అనువదించాం.
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  choice: విస్తారమైన కొల్లసొమ్మును బట్టి
  rationale: בְּ ఉపసర్గ ఇక్కడ వారి సంబరాలకు కారణం లేదా సందర్భాన్ని సూచించవచ్చు. ‘కొల్లసొమ్ము’ యుద్ధంలో దోచుకున్న సంపదను సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; ఉపసర్గలోని స్వల్ప సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר לָקְחוּ
  choice: తాము దోచుకొచ్చిన
  rationale: సంపదను తీసుకోవడం సంబరాలకంటే ముందు జరిగిందని తెలుగులో సహజంగా తెలియజేస్తుంది; సందర్భంలోని దోపిడి భావాన్నీ స్పష్టం చేస్తుంది.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים וּמֵאֶרֶץ יְהוּדָה
  choice: ఫిలిష్తీయుల దేశం నుంచీ యూదా దేశం నుంచీ
  rationale: రెండు సమాంతర భౌగోళిక పదబంధాలను నిలిపి, אֶרֶץ యొక్క దేశం/ప్రాంతం అనే భావాన్ని తెలియజేస్తుంది.
