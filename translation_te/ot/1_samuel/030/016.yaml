translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని దీర్ఘ కృదంత వరుసను స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం; ‘ఇదిగో’ ద్వారా దృశ్యపు అకస్మాత్తు సజీవతను నిలిపాం.
