  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన జాబితా నిర్మాణాన్ని వాడుతూ, హీబ్రూ మూలంలోని పునరావృత గ్రహీతల భావాన్ని ప్రతి స్థల నామం తర్వాత ‘ఉన్నవారికి’ అని నిలిపాం. వచనం ముందున్న వాక్యంతో కొనసాగే జాబితా భాగం కావడంతో ప్రారంభంలో అదనపు క్రియను చేర్చలేదు.
