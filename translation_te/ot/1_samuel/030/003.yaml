translation:
  language: te
  text: దావీదు మరియు అతని మనుషులు పట్టణానికి వచ్చేసరికి, ఇదిగో, అది అగ్నితో తగలబెట్టబడి ఉంది; వారి భార్యలు, కుమారులు, కుమార్తెలు చెరపట్టబడ్డారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: దృశ్యంలోని దిగ్భ్రాంతికర పరిస్థితిపై దృష్టి నిలిపే హీబ్రూ సూచక పదాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: שְׂרוּפָה בָּאֵשׁ
  choice: నిప్పుతో కాల్చివేయబడి ఉంది
  rationale: స్త్రీలింగ నిష్క్రియ కృదంతం పట్టణం అప్పటికే కాల్చివేయబడి ఉన్న స్థితిని సూచిస్తుంది; בָּאֵשׁను ‘నిప్పుతో’గా స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: נִשְׁבּוּ
  choice: చెరపట్టబడ్డారు
  rationale: నిఫాల్ సంపూర్ణ క్రియలోని నిష్క్రియ భావాన్ని, వారిని బందీలుగా తీసుకుపోయారనే అర్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
