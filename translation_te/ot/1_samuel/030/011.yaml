source:
  edition: WLC
  text: וַֽ/יִּמְצְא֤וּ אִישׁ מִצְרִי֙ בַּ/שָּׂדֶ֔ה וַ/יִּקְח֥וּ אֹת֖/וֹ אֶל דָּוִ֑ד וַ/יִּתְּנוּ ל֥/וֹ לֶ֨חֶם֙ וַ/יֹּ֔אכַל וַ/יַּשְׁקֻ֖/הוּ מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/011.yaml
  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
translation:
  language: te
  text: వారు పొలంలో ఒక ఐగుప్తీయుణ్ణి కనుగొని, దావీదు దగ్గరికి తీసుకొచ్చారు. అతనికి రొట్టె ఇచ్చారు; అతడు తిన్నాడు. అతనికి నీళ్లు తాగించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: వారు కనుగొని
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగు భూతకాల నిర్మాణంతో తెలిపింది; ప్రారంభంలోని וַ భావం వాక్యప్రవాహంలో అంతర్లీనంగా ఉంది.
- source_word: אִישׁ מִצְרִי
  choice: ఒక ఐగుప్తీయుణ్ణి
  rationale: אִישׁ మరియు జాతిసూచకమైన מִצְרִי రెండింటి భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘వ్యక్తి’ అని అదనంగా చెప్పడం అవసరం లేదు.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: שָׂדֶה యొక్క సాధారణ అర్థమైన ‘పొలం/బయలు’లో, సందర్భాన్ని అతిగా విస్తరించకుండా నేరుగా ‘పొలంలో’ అని అనువదించింది.
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  choice: దావీదు దగ్గరికి తీసుకొచ్చారు
  rationale: లక్ష్యస్థానం దావీదు కావడంతో לקח భావాన్ని తెలుగులో సహజంగా ‘తీసుకొచ్చారు’ అని తెలిపింది.
- source_word: וַיִּתְּנוּ לוֹ לֶחֶם
  choice: అతనికి రొట్టె ఇచ్చారు
  rationale: לֶחֶם యొక్క నిర్దిష్ట అర్థమైన ‘రొట్టె’ను నిలుపుకుంది; విస్తృతమైన ‘ఆహారం’గా మార్చలేదు.
- source_word: וַיֹּאכַל
  choice: అతడు తిన్నాడు
  rationale: మూలంలో కర్మ స్పష్టంగా లేకపోవడంతో తెలుగులోనూ దానిని చేర్చకుండా ఉంచింది.
- source_word: וַיַּשְׁקֻהוּ מָיִם
  choice: అతనికి నీళ్లు తాగించారు
  rationale: שׁקה హిఫీల్ రూపంలోని ‘త్రాగుటకు ఇచ్చారు/తాగించారు’ అనే కారణార్థక భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుకుంది.
