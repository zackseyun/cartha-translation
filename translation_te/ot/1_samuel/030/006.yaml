source:
  edition: WLC
  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
translation:
  language: te
  text: దావీదు చాలా తీవ్రమైన సంకటంలో పడ్డాడు. ప్రజలు అతణ్ణి రాళ్లతో కొట్టి చంపాలని మాట్లాడుకున్నారు; ఎందుకంటే ప్రజలందరి మనసు చేదుగా ఉంది—ప్రతి మనిషి తన కుమారులనుబట్టి, కుమార్తెలనుబట్టి. అయితే దావీదు తన దేవుడైన యాహ్వేలో తనను తాను బలపరచుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ప్రజలందరి ప్రాణం చేదుగా ఉంది”; అంటే వారందరూ తీవ్రంగా దుఃఖించి, మనసులో చేదు నింపుకున్నారు.
    reason: హీబ్రూ נֶפֶשׁ (‘ప్రాణం/మనసు’) మరియు מָרָה (‘చేదుగా ఉంది’) అనే జాతీయంలోని రూపకాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וַתֵּצֶר לְדָוִד מְאֹד
  choice: దావీదు చాలా తీవ్రమైన సంకటంలో పడ్డాడు
  rationale: צרר యొక్క ఈ నిర్మాణం దావీదుకు పరిస్థితి అత్యంత ఇరుకుగా, బాధాకరంగా మారిందని సూచిస్తుంది; מְאֹד తీవ్రతను బలపరుస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సందర్భంలో వీరు దావీదు యోధులైనా, హీబ్రూ సాధారణంగా ‘ప్రజలు’ అని చెబుతుంది; మూలంలోని విస్తృత పదాన్నే నిలుపుతుంది.
- source_word: לְסָקְלוֹ
  choice: అతణ్ణి రాళ్లతో కొట్టి చంపాలని
  rationale: סקַל అనేది రాళ్లతో కొట్టి మరణశిక్ష విధించడాన్ని సూచిస్తుంది; తెలుగులో ఉద్దేశించిన చర్య స్పష్టంగా, సహజంగా వ్యక్తమవుతుంది.
- source_word: מָרָה נֶפֶשׁ כָּל הָעָם
  choice: ప్రజలందరి మనసులు తీవ్రంగా వేదనచెందాయి
  rationale: అక్షరార్థంగా ‘ప్రజలందరి ప్రాణం/మనసు చేదుగా ఉంది’ అనే హీబ్రూ జాతీయాన్ని ఆధునిక తెలుగులో భావోద్వేగ తీవ్రతతో సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: אִישׁ עַל בנו וְעַל בְּנֹתָיו
  choice: తమ కుమారులను, కుమార్తెలను తలచుకొని
  rationale: אִישׁ పంపిణీ భావాన్ని ఇస్తుంది—ప్రతి పురుషుడు తన పిల్లల కారణంగా వేదన చెందాడు. సమూహ వాక్యంలో తెలుగు బహువచన స్వామ్యరూపం సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: וַיִּתְחַזֵּק
  choice: తనను తాను బలపరచుకున్నాడు
  rationale: హిత్పయేల్ రూపంలోని ఆత్మనేపద/మధ్యమ భావాన్ని నిలుపుతూ దావీదు చేసిన ఉద్దేశపూర్వక ప్రతిస్పందనను తెలియజేస్తుంది.
- source_word: בַּיהוָה
  choice: యెహోవాలో
  rationale: దైవనామమైన יהוהను ‘యెహోవా’గా లిప్యంతరీకరించి, בְ సూచించే ఆధారం లేదా పరిధిని ‘లో’తో నిలుపుతుంది.
- source_word: אֱלֹהָיו
  choice: తన దేవుడైన
  rationale: దావీదుతో దేవునికున్న వ్యక్తిగత సంబంధాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంలో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచడం నామస్వరూపాన్ని కాపాడుతుంది.
- issue: וַיִּתְחַזֵּק בַּיהוָהలో దావీదు చర్య మరియు దేవునిపై ఆధారం
  choice: యెహోవాలో తనను తాను బలపరచుకున్నాడు
  alternative: యెహోవా ద్వారా బలపరచబడ్డాడు
  rationale: క్రియ యొక్క ఆత్మనేపద భావాన్నీ, בְ ద్వారా వ్యక్తమయ్యే దేవునిపై ఆధారాన్నీ రెండింటినీ నిలుపుతుంది; దైవ చర్య లేదా మానవ చర్యలో ఒక్కదానిని మాత్రమే బలవంతంగా ఎంచుకోదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజ వాక్యనిర్మాణం వాడుతూ, హీబ్రూ భావతీవ్రతను మరియు దావీదు తన దేవునిలో బలం పొందిన ఆత్మనేపద భావాన్ని నిలిపాం.
