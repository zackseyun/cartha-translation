source:
  edition: WLC
  text: וּ/שְׁתֵּ֥י נְשֵֽׁי דָוִ֖ד נִשְׁבּ֑וּ אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵלִ֔ית וַ/אֲבִיגַ֕יִל אֵ֖שֶׁת נָבָ֥ל הַֽ/כַּרְמְלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/005.yaml
  text: 'And David’s two wives had been taken captive: Ahinoam the Jezreelitess and Abigail[b][a], the wife of Nabal the Carmelite.'
translation:
  language: te
  text: 'దావీదుకు ఇద్దరు భార్యలు చెరపట్టబడ్డారు: యెజ్రెయేలు ప్రాంతానికి చెందిన[a] అహీనోయము మరియు కర్మెలీయుడైన[b] నాబాలు భార్య అయిన అబీగయీలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, యెజ్రెయేలు ప్రాంతానికి చెందిన స్త్రీ.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘కర్మెలీయుడు’ అంటే కర్మెలు ప్రాంతానికి చెందినవాడు; తరువాతి కాలంలోని మతసంఘ సభ్యుడు అని కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁתֵּי נְשֵׁי דָוִד
  choice: దావీదు ఇద్దరు భార్యలు
  rationale: హీబ్రూ సంధికారకమైన waw ముందరి కథనంతో ఈ వాక్యాన్ని కలుపుతుంది; తెలుగులో వరుస కథన ప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే సహజంగా ఉంటుంది. Construct chain భావాన్ని సహజమైన స్వామ్య నిర్మాణంతో తెలిపాం.
- source_word: נִשְׁבּוּ
  choice: చెరపట్టబడ్డారు
  rationale: שׁבה ధాతువు నిఫాల్ సంపూర్ణ రూపం వారు బందీలుగా పట్టుబడ్డారని సూచిస్తుంది. తెలుగు సందర్భంలో ఈ రూపం ముందే జరిగిన దాడి ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲחִינֹעַם הַ/יִּזְרְעֵלִית
  choice: యెజ్రెయేలుకు చెందిన అహీనోయము
  rationale: స్త్రీలింగ ప్రాంతవాచక పదం ఆమె యెజ్రెయేలు ప్రాంతానికి చెందినదని సూచిస్తుంది; ఆధునిక తెలుగులో కృత్రిమమైన జాతివాచక రూపం కంటే ‘చెందిన’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַ/אֲבִיגַיִל
  choice: అబీగయీలు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన రూపంలో లిప్యంతరీకరించాం; ముందున్న జాబితా నిర్మాణమే అనుసంధానాన్ని స్పష్టం చేస్తుంది.
- source_word: אֵשֶׁת נָבָל הַֽ/כַּרְמְלִי
  choice: కర్మెలీయుడైన నాబాలు భార్య
  rationale: Construct chain అబీగయీలును నాబాలు భార్యగా గుర్తిస్తుంది; הַכַּרְמְלִי నాబాలు కర్మెలు ప్రాంతానికి చెందినవాడని తెలిపే భౌగోళిక విశేషణం.
