translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రాంతవాచక పదాలను సాధారణ పాఠకులకు వెంటనే అర్థమయ్యేలా ‘చెందిన’ రూపంలో ఇచ్చాం; కర్మెలీయుడు అనే సంక్షిప్త రూపాన్ని వివరణాత్మక పాదటిప్పణితో నిలిపాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
