source:
  edition: WLC
  text: וַ/יִּרְדֹּ֣ף דָּוִ֔ד ה֖וּא וְ/אַרְבַּע מֵא֣וֹת אִ֑ישׁ וַ/יַּֽעַמְדוּ֙ מָאתַ֣יִם אִ֔ישׁ אֲשֶׁ֣ר פִּגְּר֔וּ מֵ/עֲבֹ֖ר אֶת נַ֥חַל הַ/בְּשֽׂוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/010.yaml
  text: So David pursued[a], he and four hundred men, while two hundred men stayed behind[b], who were too exhausted to cross the Brook Besor.
translation:
  language: te
  text: దావీదు, అతనితో కూడ నాలుగు వందల మంది, వెంబడిస్తూ వెళ్లారు. బెసోరు వాగు[b] దాటలేనంతగా అలసిపోయిన[a] రెండువందల మంది వెనుక ఉండిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీరసించిపోయి”; లేదా, “అలసటతో వెనుకబడిపోయి.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “బెసోరు వాగు.” נחל అనే పదం వాగును, కాలానుగుణంగా ప్రవహించే నీటిమార్గాన్ని లేదా ఎండిన ప్రవాహపాత్రను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: తరుముకుంటూ వెళ్లాడు
  rationale: רדף అనే క్రియలో వెంబడించడం లేదా తరుమడం అనే సైనిక సందర్భార్థం ఉంది; తెలుగు కథనంలో చర్య కొనసాగుతున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  choice: తనతో ఉన్న నాలుగు వందల మందితో
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘అతడు, నాలుగు వందల మంది’ అని ఉన్నా, దావీదు వారితో కలిసి వెళ్లాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיַּעַמְדוּ
  choice: అక్కడే నిలిచిపోయారు
  rationale: עמד ప్రాథమికంగా ‘నిలబడ్డారు’ అని అర్థం; ఈ సందర్భంలో ప్రయాణాన్ని కొనసాగించకుండా వెనుక ఉండిపోయారనే కథన భావాన్ని ‘అక్కడే నిలిచిపోయారు’ స్పష్టంగా ఇస్తుంది.
- source_word: מָאתַיִם אִישׁ
  choice: రెండువందల మంది
  rationale: సైనికులను లెక్కించే సరళ సంఖ్యా పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: אֲשֶׁר פִּגְּרוּ
  choice: అలసిపోయి
  rationale: ఈ సందర్భంలో פגר కొనసాగలేనంతగా నీరసించడం, అలసిపోవడం లేదా వెనుకబడిపోవడం సూచిస్తుంది; ప్రధాన పాఠంలో సహజమైన కారణార్థాన్ని నిలుపుతుంది.
- source_word: מֵעֲבֹר
  choice: దాటలేనంతగా
  rationale: హీబ్రూలో అక్షరార్థంగా ‘దాటడం నుండి’ అనే నిర్మాణం ఉంది; פגרుతో కలిసి అది దాటలేని స్థాయి అలసటను సూచిస్తుంది.
- source_word: נַחַל הַבְּשׂוֹר
  choice: బెసోరు వాగు
  rationale: נחל అనేది వాగు, కాలానుగుణ ప్రవాహం లేదా వాడీని సూచించవచ్చు; ‘వాగు’ ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండగా, స్థలనామం ‘బెసోరు’గా లిప్యంతరీకరించబడింది.
