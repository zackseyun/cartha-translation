translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దావీదు ముందుకు సాగడం మరియు రెండువందల మంది నిలిచిపోవడం మధ్య వ్యత్యాసాన్ని సహజంగా చూపించింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
