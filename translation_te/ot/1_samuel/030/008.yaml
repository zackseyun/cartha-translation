reference: 1 Samuel 30:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר אֶרְדֹּ֛ף אַחֲרֵ֥י הַ/גְּדוּד הַ/זֶּ֖ה הַֽ/אַשִּׂגֶ֑/נּוּ וַ/יֹּ֤אמֶר ל/וֹ֙ רְדֹ֔ף כִּֽי הַשֵּׂ֥ג תַּשִּׂ֖יג וְ/הַצֵּ֥ל תַּצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: te
  text: 'దావీదు యెహోవాను అడిగి ఇలా అన్నాడు: “నేను ఈ దోపిడీ దండు వెంటపడాలా? వారిని అందుకోగలనా?” యెహోవా అతనితో, “వెంటపడు; నువ్వు తప్పక వారిని అందుకుంటావు, తప్పక విడిపిస్తావు” అని చెప్పాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: యెహోవాను విచారిస్తూ ... అడిగాడు
  rationale: దైవిక మార్గదర్శకత్వం కోసం ప్రశ్నించడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దేవుని నామాన్ని యెహోవా అని లిప్యంతరీకరించింది.
- source_word: הַגְּדוּד
  choice: దోపిడీ దండు
  rationale: సందర్భంలో ఇది సాధారణ సైన్యం కాదు, దాడిచేసి దోచుకున్న బృందం; అందువల్ల ‘దోపిడీ దండు’ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַשֵּׂג תַּשִּׂיג
  choice: తప్పక ... అందుకుంటావు
  rationale: హీబ్రూ మూలంలోని క్రియ పునరుక్తి ఇచ్చే నిశ్చయార్థాన్ని ‘తప్పక’తో నిలుపుతూ, వెంటాడి చేరుకోవడం అనే భావాన్ని ‘అందుకొను’ వ్యక్తం చేస్తుంది.
- source_word: וְהַצֵּל תַּצִּיל
  choice: తప్పక విడిపిస్తావు
  rationale: క్రియ పునరుక్తిలోని బలమైన నిశ్చయాన్ని కాపాడుతుంది; ఏమి లేదా ఎవరిని విడిపిస్తాడో మూలపాఠం ఈ వాక్యంలో పేర్కొననందున కర్మను చేర్చలేదు.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకకు అనుగుణంగా ప్రత్యక్షంగా సూచిస్తుంది; బిరుదుతో భర్తీ చేయదు.
- issue: దేవుని సమాధానంలో విడిపించబడే కర్మ
  choice: కర్మను పేర్కొనకుండా ‘విడిపిస్తావు’
  alternative: ‘అందరినీ విడిపిస్తావు’ లేదా ‘బందీలను విడిపిస్తావు’
  rationale: సందర్భం బందీలను సూచించినప్పటికీ ఈ వచనంలోని హీబ్రూ పాఠం కర్మను స్పష్టంగా ఇవ్వదు; అందువల్ల మూలంలోని సంక్షిప్తతను, స్వల్ప అనిర్దిష్టతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైన కానీ సాధారణ పాఠకులకు సులభమైన కథనశైలి. ప్రత్యక్ష సంభాషణ సహజంగా ఉంచబడింది; హీబ్రూ emphatic infinitive absolute నిర్మాణాలు ‘తప్పక’తో ప్రతిఫలించాయి.
