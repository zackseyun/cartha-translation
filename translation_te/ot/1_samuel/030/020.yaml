translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఆ పశుసంపద’ అనే హీబ్రూ సూచనలోని సందిగ్ధతను ప్రధాన పాఠ్యంలో నిలిపి, సాధ్యమైన సందర్భార్థాన్ని పాదసూచికలో ఇచ్చాం.
