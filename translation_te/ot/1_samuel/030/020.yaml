- from: దావీదు గొర్రెల మందలన్నిటినీ, పశువుల మందలన్నిటినీ తీసుకున్నాడు. వాటిని ఆ పశుసంపదకు ముందుగా తోలారు.[a] “ఇది దావీదు కొల్లసొమ్ము[b]” అని చెప్పారు.
  to: దావీదు చిన్న పశువుల మందలన్నిటినీ, పశువుల మందలన్నిటినీ తీసుకున్నాడు. వాటిని ఆ పశుసంపదకు ముందుగా తోలారు.[a] అప్పుడు వారు, “ఇది దావీదు కొల్లసొమ్ము” అని చెప్పారు.[b]
  rationale: The revision broadens the rendering of צֹאן from sheep alone to small livestock, preserving the Hebrew category without adding a specific sheep/goat division. It also places the speech-introduction formula in a conventional Telugu order. The demonstrative reference ‘ఆ పశుసంపద’ remains intentionally noncommittal, while the contextual explanation remains confined to the footnote.
