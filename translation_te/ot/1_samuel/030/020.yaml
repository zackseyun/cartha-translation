reference: 1 Samuel 30:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֔ד אֶת כָּל הַ/צֹּ֖אן וְ/הַ/בָּקָ֑ר נָהֲג֗וּ לִ/פְנֵי֙ הַ/מִּקְנֶ֣ה הַ/ה֔וּא וַ/יֹּ֣אמְר֔וּ זֶ֖ה שְׁלַ֥ל דָּוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/020.yaml
  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
translation:
  language: te
  text: దావీదు చిన్న పశువుల మందలన్నిటినీ, పశువుల మందలన్నిటినీ తీసుకున్నాడు. వాటిని ఆ పశుసంపదకు ముందుగా తోలారు.[a] అప్పుడు వారు, “ఇది దావీదు కొల్లసొమ్ము” అని చెప్పారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం బహుశా అప్పుడే స్వాధీనం చేసుకున్న ఈ జంతువులను, అంతకుముందు తిరిగి సంపాదించిన పశుసంపదకు ముందుగా ప్రదర్శనగా తోలారని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా “దావీదు దోపుడు సొమ్ము.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: לקח అనే సాధారణ కథన క్రియలో ఉన్న ‘తీసుకున్నాడు’ అనే భావాన్ని సహజంగా నిలుపుతుంది; మూలంలో స్పష్టంగా లేని బలవంతపు స్వాధీన భావాన్ని జోడించదు.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: గొర్రెల మందలు, పశువుల మందలు
  rationale: צאן సూచించే చిన్న పశువుల మందలను, בקר సూచించే పెద్ద పశువులను ఆధునిక తెలుగు పాఠకునికి సహజంగా వేరు చేస్తుంది. ‘గొర్రెల మందలు’ సందర్భానుసారంగా మేకలతో కూడిన చిన్న పశువుల మందలనూ సూచించగల సాధారణ ప్రయోగం.
- source_word: נָהֲגוּ
  choice: తోలారు
  rationale: పశువులను ముందుకు నడిపించడాన్ని సూచించే נהג క్రియకు ‘తోలారు’ సహజమైన తెలుగు సమానం.
- source_word: לִפְנֵי הַמִּקְנֶה הַהוּא
  choice: ఆ పశుసంపదకు ముందుగా
  rationale: ‘ఆ పశుసంపద ముందు’ అనే మూల నిర్మాణాన్ని నిలుపుతూ, కదలిక సందర్భంలో సహజంగా వినిపిస్తుంది. అది ముందుగా తిరిగి సంపాదించిన పశుసంపదను సూచించే అవకాశం ఉంది, కాని ఆ వివరణను ప్రధాన పాఠ్యంలో ఖచ్చితార్థంగా చేర్చలేదు.
- source_word: זֶה שְׁלַל דָּוִד
  choice: ఇది దావీదు కొల్లసొమ్ము
  rationale: ఏకవచన సూచనపదం זֶה ను ‘ఇది’గా నిలుపుతుంది; שׁלל కు యుద్ధం లేదా దాడిలో సంపాదించిన సొమ్ము అనే భావాన్ని ‘కొల్లసొమ్ము’ సహజంగా తెలియజేస్తుంది.
