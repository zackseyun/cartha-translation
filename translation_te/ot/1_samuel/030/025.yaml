  text: 'And it was so from that day onward: he made it a statute and an ordinance for Israel to this day[a].'
translation:
  language: te
  text: ఆ రోజు నుండి నేటివరకు కూడా అది అలాగే ఉంది; అతడు దానిని ఇశ్రాయేలుకు శాసనంగాను న్యాయవిధిగాను నియమించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు దానిని ఇశ్రాయేలుకు శాసనంగాను తీర్పుగాను నియమించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: అలాగే కొనసాగింది
  rationale: ఈ సందర్భంలో ఇది కేవలం ఒక సంఘటనను కాక, ఏర్పడిన ఆచారం కొనసాగడాన్ని సూచిస్తుంది; చివరిలోని ‘నేటివరకు’ అనే మాటతోనూ ఇది సహజంగా అనుసంధానమవుతుంది.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: ఆ రోజు మొదలుకొని
  rationale: ఒక నిర్దిష్ట దినం నుంచి ముందుకు కొనసాగిన కాలాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיְשִׂמֶהָ
  choice: అతడు దానిని ... స్థాపించాడు
  rationale: שׂים అనే క్రియకు ‘పెట్టడం, నియమించడం, స్థాపించడం’ అనే భావాలున్నాయి. సందర్భంలో దావీదు ముందుగా చెప్పిన పద్ధతిని స్థిరమైన నియమంగా చేసినట్లు సూచిస్తుంది.
- source_word: לְחֹק
  choice: ఒక శాసనంగా
  rationale: חֹק నిర్దేశించబడిన, స్థిరమైన నియమాన్ని సూచిస్తుంది; ‘శాసనం’ దాని అధికారిక, బద్ధమైన భావాన్ని నిలుపుతుంది.
- source_word: וּלְמִשְׁפָּט
  choice: ఒక న్యాయనియమంగా
  rationale: מִשְׁפָּט కు తీర్పు, న్యాయం, న్యాయనిర్ణయం లేదా అమలులోని నియమం అనే అర్థాలున్నాయి. חֹק తో జతగా ఇక్కడ బద్ధమైన న్యాయపద్ధతిని సూచిస్తున్నందున ‘న్యాయనియమం’ ఎంచుకోబడింది.
- source_word: לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: ఈ నియమం వర్తించే ప్రజలను לְ సూచిస్తుంది; ‘ఇశ్రాయేలుకు’ మూలంలోని రూపాన్నీ సామూహిక భావాన్నీ కాపాడుతుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు అమలులో ఉంది
  rationale: కథకుని కాలం వరకు ఆ నియమం కొనసాగిందనే భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
