translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. లక్ష్య ప్రాంతాల జాబితాలో హెబ్రీ వాక్య నిర్మాణంలోని పునరావృత ‘మీద’ను నిలిపి, భౌగోళిక పేర్లను అతిగా వివరణాత్మకంగా మార్చలేదు.
