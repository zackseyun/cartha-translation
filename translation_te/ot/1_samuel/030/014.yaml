source:
  edition: WLC
  text: אֲנַ֡חְנוּ פָּשַׁ֜טְנוּ נֶ֧גֶב הַ/כְּרֵתִ֛י וְ/עַל אֲשֶׁ֥ר לִֽ/יהוּדָ֖ה וְ/עַל נֶ֣גֶב כָּלֵ֑ב וְ/אֶת צִקְלַ֖ג שָׂרַ֥פְנוּ בָ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/014.yaml
  text: We raided the Negev of the Kerethites[a], and the territory that belongs to Judah, and the Negev of Caleb; and we burned Ziklag with fire.
translation:
  language: te
  text: “మేము కెరేతీయుల[a] నెగెబు ప్రాంతం మీద, యూదాకు చెందిన ప్రాంతం మీద, కాలేబుకు చెందిన నెగెబు ప్రాంతం మీద దోపిడీ దాడి చేశాం; సిక్లగును అగ్నితో కాల్చాం.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెరేతీయుల.’
    reason: ప్రజాపేరు యొక్క ప్రత్యామ్నాయ లిప్యంతరీకరణ.
lexical_decisions:
- source_word: פָּשַׁטְנוּ
  choice: దాడి చేశాం
  rationale: ఈ సైనిక సందర్భంలో ఈ క్రియ దోపిడీ ఉద్దేశంతో చేసిన దాడిని సూచిస్తుంది. ‘దాడి చేశాం’ సహజమైన ఆధునిక తెలుగు; కేవలం ‘వ్యాపించాం’ అనే అర్థాన్ని ఇవ్వదు.
- source_word: נֶגֶב
  choice: నెగెబు ప్రాంతం
  rationale: ఇక్కడ ఇది కేవలం దక్షిణ దిక్కును కాక, దక్షిణాన ఉన్న పొడి భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది. ‘నెగెబు ప్రాంతం’ పేరునూ భౌగోళిక భావాన్నీ నిలుపుతుంది.
- source_word: הַכְּרֵתִי
  choice: కెరేతీయులు
  rationale: ఇది ఒక ప్రజావర్గపు పేరు. హెబ్రీ వ్యంజనాలకు దగ్గరగా ఉండే లిప్యంతరీకరణను ప్రధాన పాఠంలో ఉపయోగించాం; మరో ప్రాచుర్యమైన రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  choice: యూదాకు చెందిన ప్రాంతం మీద
  rationale: సంబంధవాచక నిర్మాణం యూదాకు చెందిన భూభాగాన్ని సూచిస్తుంది. ఈ అనువాదం స్వాధీన భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: נֶגֶב כָּלֵב
  choice: కాలేబు నెగెబు ప్రాంతం
  rationale: ఇది కాలేబు వంశం లేదా భూభాగంతో సంబంధమున్న దక్షిణ ప్రాంతాన్ని సూచించే అవకాశం ఉంది. హెబ్రీ నిర్మాణంలోని భౌగోళిక ప్రత్యేకతను నిలిపాం.
- source_word: שָׂרַפְנוּ בָאֵשׁ
  choice: అగ్నితో కాల్చివేశాం
  rationale: హెబ్రీలో ‘కాల్చడం’ అనే క్రియతో పాటు ‘అగ్నితో’ అనే సాధనార్థక పదబంధం స్పష్టంగా ఉంది. స్వల్ప పునరుక్తి ఉన్నా, మూలంలోని తీవ్రతను నిలిపాం.
- source_word: צִקְלַג
  choice: సిక్లగు
  rationale: స్థలనామానికి తెలుగులో స్పష్టంగా పలకగల, హెబ్రీ రూపానికి దగ్గరైన లిప్యంతరీకరణ.
