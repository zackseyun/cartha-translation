  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֤א דָוִד֙ אֶל צִ֣קְלַ֔ג וַ/יְשַׁלַּ֧ח מֵֽ/הַ/שָּׁלָ֛ל לְ/זִקְנֵ֥י יְהוּדָ֖ה לְ/רֵעֵ֣/הוּ לֵ/אמֹ֑ר הִנֵּ֤ה לָ/כֶם֙ בְּרָכָ֔ה מִ/שְּׁלַ֖ל אֹיְבֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
translation:
  language: te
  text: 'దావీదు సిక్లగుకు వచ్చినప్పుడు, దోపుడుసొమ్ములో కొంతను తన స్నేహితులైన యూదా పెద్దలకు పంపి, ఇలా చెప్పాడు: “ఇదిగో, యాహ్వే శత్రువుల నుండి స్వాధీనం చేసుకున్న దోపుడుసొమ్ములోనుంచి మీకు ఒక కానుక[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆశీర్వాదం” అని కూడా అనువదించవచ్చు. హీబ్రూ పదానికి “ఆశీర్వాదం” అనే అర్థం ఉంది; అయితే ఇక్కడ అది దోపుడుసొమ్ములోనుంచి పంపిన వస్తురూపమైన కానుకను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చినప్పుడు
  rationale: కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతూ, దావీదు వచ్చిన వెంటనే చేసిన చర్యతో కాలసంబంధాన్ని కలుపుతుంది.
- source_word: צִקְלַג
  choice: సిక్లగు
  rationale: స్థలనామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  choice: దోపుడుసొమ్ములో కొంతను … పంపిస్తూ
  rationale: מִן అనే విభక్తి మొత్తం దోపుడుసొమ్ములో నుంచి ఒక భాగాన్ని పంపిన భావాన్ని సూచిస్తుంది; ‘దోపుడుసొమ్ము’ యుద్ధంలో స్వాధీనం చేసుకున్న సంపదను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְזִקְנֵי יְהוּדָה
  choice: యూదా పెద్దలకు
  rationale: ఇక్కడ ‘పెద్దలు’ అనేది యూదాలో గుర్తింపు పొందిన నాయకులను సూచిస్తుంది.
- source_word: לְרֵעֵהוּ
  choice: తన మిత్రులైన
  rationale: רֵעַ అనే పదానికి మిత్రుడు, సహచరుడు, పొరుగువాడు అనే అర్థాలు ఉండవచ్చు; ఈ సందర్భంలో దావీదుతో సానుకూల సంబంధం ఉన్న యూదా నాయకులను ‘మిత్రులు’ సహజంగా సూచిస్తుంది.
- source_word: הִנֵּה לָכֶם
  choice: ఇదిగో … మీకు
  rationale: הִנֵּה యొక్క దృష్టిని ఆకర్షించే సూచనార్థాన్ని, కృత్రిమమైన ప్రాచీన శైలి లేకుండా ‘ఇదిగో’ నిలుపుతుంది.
- source_word: בְּרָכָה
  choice: కానుక
  rationale: మూలపదానికి అక్షరార్థంగా ‘ఆశీర్వాదం’ అనే అర్థం ఉన్నా, ఇక్కడ దోపుడుసొమ్ములోనుంచి పంపిన వస్తురూపమైన బహుమతిని సూచిస్తుంది. అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: מִשְּׁלַל
  choice: దోచుకున్న సొమ్ములోనుంచి
  rationale: ముందున్న అదే యుద్ధ-దోపిడి పదాన్ని తెలుగులో సహజంగా పునరుద్ఘాటిస్తూ, కానుకకు మూలం ఏమిటో స్పష్టం చేస్తుంది.
- source_word: אֹיְבֵי יְהוָה
  choice: యాహ్వే శత్రువులు
  rationale: సంబంధ నిర్మాణాన్ని నేరుగా నిలుపుతూ, అమాలేకీయులను యాహ్వేకు విరోధులుగా దావీదు పేర్కొన్న భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలరూపాన్ని నిలుపుతుంది.
- issue: בְּרָכָה పదాన్ని అక్షరార్థంగా ‘ఆశీర్వాదం’గా లేదా సందర్భానుసారంగా ‘కానుక’గా అనువదించడం
  choice: కానుక
  alternative: ఆశీర్వాదం
  rationale: తక్షణ సందర్భం దోపుడుసొమ్ములోని వస్తురూపమైన భాగాన్ని పంపడం గురించి ఉంది. అందువల్ల ప్రధాన పాఠ్యంలో ‘కానుక’ స్పష్టంగా ఉంటుంది; మూలపదంలోని ‘ఆశీర్వాదం’ భావాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన కథన శైలిలో రూపొందించాం. ‘దోపుడుసొమ్ము,’ ‘ఇదిగో,’ ‘కానుక’ వంటి ప్రస్తుత వాడుక పదాలను ఎంచుకుని అనవసరమైన ప్రాచీన శైలిని నివారించాం.
