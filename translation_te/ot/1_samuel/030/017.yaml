base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
translation:
  language: te
  text: దావీదు మసకవేళ మొదలుకొని మరుసటి రోజు సాయంత్రం వరకు వారిని హతమార్చాడు.[a] ఒంటెలపై స్వారీ చేసి పారిపోయిన నాలుగు వందల మంది యువకులు తప్ప, వారిలో ఒక్క పురుషుడు కూడా తప్పించుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తెల్లవారుజాము మొదలుకొని’; ఇక్కడి హెబ్రీ పదం ఉదయ సంధ్యను గానీ సాయంకాల సంధ్యను గానీ సూచించగలదు. కొందరు ఈ సందర్భంలో దానిని ఉదయ సంధ్యగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: వారిని హతమార్చాడు
  rationale: యుద్ధ సందర్భంలో נכה బలంగా కొట్టడం లేదా సంహరించడం అనే భావాన్ని ఇస్తుంది. ‘హతమార్చాడు’ ఆధునిక తెలుగులో క్రియ తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: מֵהַנֶּשֶׁף
  choice: సంధ్యవేళ మొదలుకొని
  rationale: נשף ఉదయ లేదా సాయంకాల సంధ్యను సూచించగలదు. ప్రధాన పాఠంలో ‘సంధ్యవేళ’ అని ఉంచడం ద్వారా మూలంలోని సందిగ్ధతను నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְעַד הָעֶרֶב לְמָחֳרָתָם
  choice: మరుసటి రోజు సాయంత్రం వరకు
  rationale: ఈ పదబంధం పోరాటం తరువాతి రోజు సాయంత్రం దాకా కొనసాగిందని సూచిస్తుంది; ఈ రూపం తెలుగులో సహజంగా కాలవ్యవధిని తెలియజేస్తుంది.
- source_word: נִמְלַט מֵהֶם אִישׁ
  choice: వారిలో ఒక్క పురుషుడు కూడా తప్పించుకోలేదు
  rationale: אִישׁ ఇక్కడ పంపిణీ భావంలో ఏ ఒక్క మగ వ్యక్తీ తప్పించుకోలేదనే సంపూర్ణతను నొక్కిచెబుతుంది; ‘పురుషుడు’ మూలంలోని లింగసూచనను నిలుపుతుంది.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: ముందున్న సంపూర్ణ నిరాకరణకు మినహాయింపును ప్రవేశపెట్టే హెబ్రీయ ఇడియమ్‌కు ‘తప్ప’ స్పష్టమైన, సహజమైన తెలుగు సమానం.
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  choice: నాలుగు వందల మంది యువకులు
  rationale: נַעַר బాలుడు, యువకుడు లేదా సేవకుడు అనే అర్థాలు కలిగి ఉండవచ్చు. ఒంటెలపై పారిపోగల యోధుల సందర్భంలో ‘యువకులు’ అత్యంత సముచితం.
- source_word: רָכְבוּ עַל הַגְּמַלִּים
  choice: ఒంటెల మీద ఎక్కి
  rationale: רכב על యొక్క ఒంటెలపై ఎక్కి ప్రయాణించడం అనే భావాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయిన
  rationale: נוּס పారిపోవడం అనే భావాన్ని ఇస్తుంది. ‘తప్పించుకోలేదు’ అనే נמלט అనువాదంతో క్రియాభేదాన్ని కూడా ఇది నిలుపుతుంది.
