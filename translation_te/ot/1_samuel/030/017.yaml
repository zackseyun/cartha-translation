translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గంభీరమైన శైలి. మూలంలోని సంధ్యకాల సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా కాపాడాం.
