  text: to those in Bethel[a], to those in Ramoth-negeb, and to those in Jattir—
translation:
  language: te
  text: బేతేలులో ఉన్నవారికి, రామోతు-నెగెబులో ఉన్నవారికి[a], మరియు యత్తీరులో ఉన్నవారికి—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నెగెబులోని రామోతు,” అంటే “దక్షిణ రామోతు.”
    reason: ‘రామోతు-నెగెబు’ అనే స్థలనామంలోని נֶגֶב పదాన్ని ప్రాంత సూచనగా లేదా ‘దక్షిణ’ అనే అర్థంలో గ్రహించవచ్చు.
lexical_decisions:
- source_word: לַאֲשֶׁר
  choice: ఉన్నవారికి
  rationale: לְ + אֲשֶׁר ఇక్కడ కానుకలు అందుకునే వేర్వేరు ప్రాంతాల వారిని సూచిస్తుంది. ‘ఉన్నవారికి’ దాతార్థాన్ని, నివాస సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּבֵית אֵל
  choice: బేతేలులో
  rationale: సందర్భంలో ఇది ‘దేవుని ఇల్లు’ అనే సాధారణ పదబంధం కాదు, స్థలనామం. בְּ సూచించే స్థానార్థాన్ని ‘లో’తో వ్యక్తం చేశాం.
- source_word: בְּרָמוֹת נֶגֶב
  choice: రామోతు-నెగెబులో
  rationale: ఈ సంయుక్త రూపాన్ని స్థలనామంగా లిప్యంతరీకరించడం వల్ల נֶגֶב అనేది ప్రాంత సూచనా లేక ‘దక్షిణ’ అనే విశేషణార్థమా అనే సందిగ్ధతను ప్రధాన పాఠం ముందుగానే పరిష్కరించదు.
- source_word: בְּיַתִּר
  choice: యత్తీరులో
  rationale: ఇది స్థలనామం; హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించి, בְּ యొక్క స్థానార్థాన్ని ‘లో’తో తెలిపాం.
- source_word: וְ
  choice: మరియు అనే పదాన్ని విడిగా చేర్చకుండా జాబితా నిర్మాణం
  rationale: తెలుగులో వరుసగా వచ్చే సమాంతర పదబంధాలు సముచ్చయాన్ని సహజంగా తెలియజేస్తాయి; చివరి అంశానికి ముందు ‘మరియు’ చేర్చడం ఇక్కడ భారంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. మూలంలోని కొనసాగుతున్న జాబితాను చివరి దీర్ఘ విరామచిహ్నంతో నిలిపి ఉంచాం; పాదసూచిక గుర్తును సంబంధిత ‘రామోతు-నెగెబు’ వద్ద ఉంచాం.
