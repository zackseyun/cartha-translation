  text: and to those in Hormah[a], and to those in Bor-ashan, and to those in Athach.
translation:
  language: te
  text: హోర్మాలో ఉన్నవారికి, బోర్-ఆషానులో ఉన్నవారికి[a], అతాకులో ఉన్నవారికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బోర్-ఆషాను’ ఒక స్థలనామం. దాని పదభాగాలకు అక్షరార్థంగా ‘పొగ బావి లేదా గుంట’ అనే భావం ఉండవచ్చు; ఇక్కడ పేరును అనువదించకుండా లిప్యంతరీకరించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: ఉన్నవారికి
  rationale: వావ్ + לְ + אֲשֶׁר అనే నిర్మాణం ఈ పంపిణీ జాబితాలో ఆయా ప్రాంతాల్లో ఉన్న గ్రహీతలను సూచిస్తుంది. తెలుగులో ‘ఉన్నవారికి’ సహజంగా దాతివు భావాన్ని నిలుపుతుంది; వరుసలోని అనుసంధానం కామాలతో వ్యక్తమవుతుంది.
- source_word: בְּחָרְמָה
  choice: హోర్మాలో
  rationale: בְּ అనే స్థానార్థక ఉపసర్గను ‘లో’తో వ్యక్తం చేసి, స్థలనామాన్ని హోర్మా అని లిప్యంతరీకరించాం.
- source_word: בְּבוֹר עָשָׁן
  choice: బోర్-ఆషానులో
  rationale: ఇది రెండు భాగాలుగల స్థలనామం. అర్థానువాదం చేయకుండా, ఒకే స్థలనామమని స్పష్టమయ్యేలా హైఫన్‌తో లిప్యంతరీకరించాం.
- source_word: בַּעֲתָךְ
  choice: అతాకులో
  rationale: స్థలనామాన్ని అతాకు అని లిప్యంతరీకరించి, בְּ యొక్క స్థానార్థాన్ని ‘లో’తో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన జాబితా శైలిని వాడాం. ఈ వచనం ముందున్న క్రియపై ఆధారపడిన జాబితా భాగం కాబట్టి, స్వతంత్ర పఠనంలో భావం పూర్తవడానికి ‘పంపాడు’ను సందర్భానుసారంగా పూరించాం. అన్ని స్థలనామాలకు ఒకే విధమైన ‘లో’ నిర్మాణాన్ని వాడాం.
