  text: and to those in Rakal[a], and to those in the towns of the Jerahmeelites, and to those in the towns of the Kenites.
translation:
  language: te
  text: రాకాలులో[a] ఉన్నవారికి, యెరహ్మెయేలీయుల పట్టణాల్లో ఉన్నవారికి, కేనీయుల పట్టణాల్లో ఉన్నవారికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రాకాలు అనే స్థలనామాన్ని కొన్ని ఆంగ్ల సంప్రదాయాల్లో “రాకాల్” (Racal) అని కూడా వ్రాస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: ఉన్నవారికి
  rationale: ఈ బహుమతుల పంపిణీ జాబితాలో לְ + אֲשֶׁר నిర్మాణం ఆయా ప్రదేశాల్లో ఉన్నవారిని గ్రహీతలుగా సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘ఉన్నవారికి’ సహజంగా ఉండి దాతార్థాన్ని నిలుపుతుంది.
- source_word: בְּרָכָל
  choice: రాకాలులో
  rationale: ఇది స్థలనామం; హీబ్రూ רָכָל ధ్వనులకు అనుగుణంగా అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: בְּעָרֵי
  choice: పట్టణాల్లో
  rationale: עִיר అనే పదం నగరాన్నీ పట్టణాన్నీ సూచించగలదు. ప్రాంతీయ నివాసస్థలాల ఈ జాబితాలో ‘పట్టణాలు’ సహజమైన, సందర్భోచితమైన ఎంపిక.
- source_word: הַיְּרַחְמְאֵלִי
  choice: యెరహ్మెయేలీయుల
  rationale: రూపపరంగా ఏకవచన జాతివాచకమైనా, ‘పట్టణాలు’ అనే పదంతో కలిసినప్పుడు ఈ ప్రజావర్గాన్ని సమూహంగా సూచిస్తుంది; అందువల్ల తెలుగులో బహువచన సంబంధరూపం వాడబడింది.
- source_word: הַקֵּינִי
  choice: కేనీయుల
  rationale: ఇదీ ఏకవచన రూపంలోని జాతివాచకమే అయినా సమూహార్థంలో ఉంది; ‘పట్టణాలు’తో సహజంగా కలిసేందుకు బహువచన సంబంధరూపం వాడబడింది.
