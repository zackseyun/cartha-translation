translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ఈ వచనం మునుపటి వాక్యంలోని ప్రధాన క్రియపై ఆధారపడిన జాబితా భాగం కాబట్టి, స్వతంత్ర పఠనానికి స్పష్టతనిచ్చేందుకు సందర్భం నుంచి ‘పంపించాడు’ అనే క్రియను పునరుద్ధరించాం; అయితే హీబ్రూ వచనఖండంలో అది ప్రత్యక్షంగా లేదు.
