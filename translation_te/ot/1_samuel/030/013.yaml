review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys David’s two questions, the speaker’s Egyptian identity, his status as an Amalekite’s slave, and his abandonment by his master because of illness. The temporal phrase is best rendered as having become ill three days earlier.
  naturalness: “నాకు జబ్బు చేసినందువల్ల” is not idiomatic modern standard Telugu in this context. “నేను మూడు రోజుల క్రితం అనారోగ్యానికి గురైనందువల్ల” is natural and clearly expresses the subject’s illness.
  terminology: “దాసుణ్ణి” appropriately retains the force of עֶבֶד in this historical context. “ఐగుప్తీయ యువకుణ్ణి” and “అమాలేకీయుని” are suitable.
  issues:
  - severity: medium
    issue: Idiomatic expression for becoming sick
    rationale: The clause “నాకు జబ్బు చేసినందువల్ల” is awkward and can sound as though an unspecified illness ‘did’ something to him. The Hebrew חָלִיתִי has the first-person sense “I became ill / fell sick,” which Telugu naturally expresses as “నేను ... అనారోగ్యానికి గురైనందువల్ల.”
  revised_text: దావీదు అతనితో, “నీవు ఎవరివాడివి? ఎక్కడి నుంచి వచ్చావు?” అని అడిగాడు. అతడు, “నేను ఐగుప్తీయ యువకుణ్ణి; ఒక అమాలేకీయుని దాసుణ్ణి. నేను మూడు రోజుల క్రితం అనారోగ్యానికి గురైనందువల్ల నా యజమాని నన్ను విడిచిపెట్టాడు” అని చెప్పాడు.
  revised_footnotes: []
  revision_rationale: A limited idiomatic correction makes the illness clause natural modern Telugu while preserving the Hebrew first-person statement, causal relationship, and three-day temporal reference. No footnotes are required.
