source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר ל֤/וֹ דָוִד֙ לְֽ/מִי אַ֔תָּה וְ/אֵ֥י מִ/זֶּ֖ה אָ֑תָּה וַ/יֹּ֜אמֶר נַ֧עַר מִצְרִ֣י אָנֹ֗כִי עֶ֚בֶד לְ/אִ֣ישׁ עֲמָֽלֵקִ֔י וַ/יַּעַזְבֵ֧/נִי אֲדֹנִ֛/י כִּ֥י חָלִ֖יתִי הַ/יּ֥וֹם שְׁלֹשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a servant of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: te
  text: దావీదు అతనితో, “నీవు ఎవరివాడివి? ఎక్కడి నుంచి వచ్చావు?” అని అడిగాడు. అతడు, “నేను ఐగుప్తీయ యువకుణ్ణి; ఒక అమాలేకీయుని దాసుణ్ణి. నేను మూడు రోజుల క్రితం అనారోగ్యానికి గురైనందువల్ల నా యజమాని నన్ను విడిచిపెట్టాడు” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  choice: నీవు ఎవరివాడివి?
  rationale: అక్షరార్థంగా ‘నీవు ఎవరివాడివి?’; ఈ సందర్భంలో యాజమాన్యం లేదా అనుబంధాన్ని అడిగే హీబ్రూ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: נַעַר מִצְרִי
  choice: ఐగుప్తీయ యువకుణ్ణి
  rationale: נַעַר అనే పదానికి సందర్భానుసారంగా ‘యువకుడు’ సరిపోతుంది; అతని జాతి/దేశ మూలాన్ని ‘ఐగుప్తీయ’గా తెలిపింది.
- source_word: עֶבֶד
  choice: దాసుణ్ణి
  rationale: ఇక్కడ అమాలేకీయ యజమానికి చెందిన సేవకుడు/బానిస అనే సామాజిక స్థితిని సూచిస్తుంది; ‘దాసుడు’ మూలపద బలాన్ని నిలుపుతుంది.
- source_word: וַיַּעַזְבֵנִי
  choice: నన్ను విడిచిపెట్టాడు
  rationale: עזב ఇక్కడ అనారోగ్యానికి గురైన దాసుణ్ణి వదిలివేయడం/పరిత్యజించడం అనే భావాన్ని కలిగిస్తుంది.
- source_word: כִּי חָלִיתִי הַיּוֹם שְׁלֹשָׁה
  choice: మూడు రోజుల క్రితం నాకు జబ్బు చేసినందువల్ల
  rationale: హీబ్రూ కాలవ్యవహారం ‘ఇది మూడవ రోజు’ అనే భావంతో ఉంది; సహజ తెలుగులో ‘మూడు రోజుల క్రితం’గా వ్యక్తీకరించబడింది. כִּי ని కారణార్థకంగా అనువదించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని యాజమాన్య ప్రశ్నను వివరణాత్మకంగా మార్చకుండా ‘ఎవరివాడివి?’ అని నిలిపాం.
