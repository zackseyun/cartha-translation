language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ שָׁם֙ הַ/גִּבְעָ֔תָ/ה וְ/הִנֵּ֥ה חֶֽבֶל נְבִאִ֖ים לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֤ח עָלָי/ו֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּתְנַבֵּ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
translation:
  language: te
  text: వారు అక్కడ కొండకు[a] వచ్చినప్పుడు, ఇదిగో, అతనిని ఎదుర్కొనడానికి వస్తున్న ప్రవక్తల బృందం కనిపించింది. అప్పుడు దేవుని ఆత్మ అతనిపైకి శక్తిగా వచ్చింది; అతడు వారి మధ్య ప్రవచించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గిబియాకు.’ హిబ్రూ రూపాన్ని స్థలనామంగా గానీ, ‘కొండకు’ అని గానీ చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  choice: కొండకు
  rationale: దిశను సూచించే అంత్యప్రత్యయంతో ఉన్న ఈ రూపాన్ని సాధారణ నామవాచకంగా చదవవచ్చు; సందర్భంలో ముందుగా ప్రస్తావించిన కొండను సూచిస్తుంది. అయితే ‘గిబియా’ అనే స్థలనామ పఠనం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచబడింది.
- source_word: חֶבֶל נְבִאִים
  choice: ప్రవక్తల బృందం
  rationale: ఇక్కడ חבל తాడు అనే అర్థంలో కాక, ఒక సమూహం లేదా బృందం అనే అర్థంలో ఉంది. ‘బృందం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לִקְרָאתוֹ
  choice: అతనిని కలుసుకోవడానికి
  rationale: ఈ రూపం సౌలును కలుసుకునే ఉద్దేశంతో వారు అతని వైపు రావడాన్ని తెలియజేస్తుంది.
- source_word: רוּחַ אֱלֹהִים
  choice: దేవుని ఆత్మ
  rationale: ఈ దైవిక శక్తిప్రదాన సందర్భంలో ఈ పదబంధం దేవుని ఆత్మను సూచించడం సహజం; ‘దేవుని నుండి ఒక ఆత్మ’ అనే సాధ్యమైన భావాన్ని అనవసరంగా చేర్చలేదు.
- source_word: וַתִּצְלַח עָלָיו
  choice: అతని మీదికి బలంగా దిగివచ్చాడు
  rationale: సమూయేలు గ్రంథాల్లో רוח తో కూడిన צלח అకస్మాత్తుగా, శక్తివంతంగా ఒక వ్యక్తిపైకి రావడాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּתְנַבֵּא
  choice: అతడు ప్రవచించాడు
  rationale: నבא యొక్క హిత్పయేల్ రూపం ఇక్కడ ప్రవక్తగా చేసే కార్యాన్ని సూచిస్తుంది. దాని వ్యక్తీకరణ విధానాన్ని నిర్దిష్టపరచకుండా ‘ప్రవచించాడు’ విశాలమైన మూలార్థాన్ని నిలుపుతుంది.
- source_word: בְּתוֹכָם
  choice: వారి మధ్య
  rationale: సౌలు ఆ ప్రవక్తల సమూహంలో చేరి ప్రవచించాడనే భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా కనిపించిన విషయంపై పాఠకుని దృష్టిని ఆకర్షించే హిబ్రూ సంభాషణ సంకేతాన్ని ‘ఇదిగో’ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: רוּחַ אֱלֹהִים అనువాదం
  choice: దేవుని ఆత్మ
  alternative: దేవుని నుండి ఒక ఆత్మ
  rationale: సౌలుకు దేవుడు ఇచ్చిన సూచన, శక్తిప్రదానం అనే సందర్భం దేవుని ఆత్మ అతనిపై పనిచేశాడనే పఠనానికి మద్దతిస్తుంది. అయినప్పటికీ తరువాతి సిద్ధాంతపరమైన వివరణలను వచనంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఇదిగో’ మూలంలోని దృష్ట్యాకర్షక బలాన్ని నిలుపుతుంది; ‘బలంగా దిగివచ్చాడు’ ఆత్మ అకస్మాత్తుగా శక్తితో రావడాన్ని తెలియజేస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
