  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ דּ֨וֹד שָׁא֥וּל אֵלָ֛י/ו וְ/אֶֽל נַעֲר֖/וֹ אָ֣ן הֲלַכְתֶּ֑ם וַ/יֹּ֕אמֶר לְ/בַקֵּשׁ֙ אֶת הָ֣/אֲתֹנ֔וֹת וַ/נִּרְאֶ֣ה כִי אַ֔יִן וַ/נָּב֖וֹא אֶל שְׁמוּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
translation:
  language: te
  text: అప్పుడు సౌలు బాబాయి సౌలుతోను, అతనితో ఉన్న యువకునితోను, “మీరు ఎక్కడికి వెళ్లారు?” అని అడిగాడు. సౌలు, “గాడిదలను[a] వెదకడానికి వెళ్లాం. అవి ఎక్కడా కనిపించకపోవడంతో సమూయేలు వద్దకు వెళ్లాం[b]” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ప్రత్యేకంగా ఆడ గాడిదలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సమూయేలు వద్దకు వచ్చాం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  choice: సౌలు బాబాయి
  rationale: דּוֹד ఇక్కడ కుటుంబ బంధాన్ని సూచించే ‘uncle’. ఆధునిక తెలుగులో సహజంగా, నిర్దిష్టంగా వినిపించే ‘బాబాయి’ని వాడాం; చిన్నాన్న/పెదనాన్న అని వయోభేదాన్ని పాఠ్యంలో లేనప్పటికీ చేర్చలేదు.
- source_word: אֵלָיו וְאֶל נַעֲרוֹ
  choice: అతనితోనూ, అతనితో ఉన్న యువకునితోనూ
  rationale: נַעַר అంటే యువకుడు, సహాయకుడు లేదా సేవకుడు కావచ్చు. సందర్భం అతడు సౌలుతో ప్రయాణించినవాడని చూపుతుంది; సేవక హోదాను అవసరానికి మించి నిర్ధారించకుండా ‘అతనితో ఉన్న యువకుడు’ అని అనువదించాం.
- source_word: אָן הֲלַכְתֶּם
  choice: మీరు ఎక్కడికి వెళ్లారు?
  rationale: אָן స్థలాన్ని ప్రశ్నిస్తుంది; బహువచన క్రియ సౌలును, అతనితో ఉన్న యువకుణ్ణి కలిపి సంబోధిస్తోంది. తెలుగు సంభాషణలో సహజమైన గతకాల రూపాన్ని వాడాం.
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  choice: గాడిదలను వెదకడానికి
  rationale: בקשׁ అంటే వెదకడం. אֲתֹנוֹת వ్యాకరణపరంగానూ పదార్థపరంగానూ ఆడ గాడిదలను సూచిస్తుంది; ప్రధాన పాఠ్యంలో సహజమైన ‘గాడిదలు’ ఉంచి ఆ విశేషాన్ని పాదసూచికలో తెలిపాం.
- source_word: וַנִּרְאֶה כִי אַיִן
  choice: అవి ఎక్కడా కనిపించకపోవడంతో
  rationale: అక్షరార్థంగా ‘అవి లేవని మేము చూశాం’. సందర్భంలో గాడిదలు దొరకలేదనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  choice: సమూయేలు దగ్గరికి వెళ్లాం
  rationale: בוא సాధారణంగా ‘రావడం/చేరడం’ అని అర్థమవుతుంది; అయితే ప్రయాణాన్ని వెనుకకు తిరిగి వివరిస్తున్న తెలుగు సంభాషణలో ‘దగ్గరికి వెళ్లాం’ సహజం. ‘వచ్చాం’ అనే రూపాన్ని పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన-సంభాషణ శైలిని అనుసరించాం. మూలంలోని బహువచన సంబోధనను, נַעַר పదంలోని హోదా అస్పష్టతను నిలిపాం. పాదసూచిక సూచికలను అవి వివరిస్తున్న పదబంధాలకే జతచేశాం.
