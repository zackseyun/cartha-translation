  yaml_path: translation/ot/1_samuel/010/023.yaml
  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
translation:
  language: te
  text: వారు పరుగెత్తి, అక్కడి నుండి అతన్ని తీసుకువచ్చారు[a]. అతడు ప్రజల మధ్య నిలబడ్డాడు. అతడు ప్రజలందరికంటే తన భుజాల నుండి పైకి ఎత్తుగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడి నుండి అతన్ని తీసుకున్నారు.” హీబ్రూ క్రియకు సాధారణంగా “తీసుకొను” అని అర్థం; అయితే ఈ సందర్భంలో అతడు దాక్కున్న చోటు నుండి అతన్ని తీసుకురావడం అనే భావం ఉండవచ్చు (22వ వచనం చూడండి).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  choice: వారు పరుగెత్తి వెళ్లి
  rationale: רוץ అనే క్రియ పరుగెత్తడాన్ని లేదా వేగంగా వెళ్లడాన్ని సూచిస్తుంది. కథనంలోని చురుకుదనాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיִּקָּחֻהוּ מִשָּׁם
  choice: అక్కడి నుండి అతన్ని తీసుకొచ్చారు
  rationale: לקח యొక్క ప్రాథమిక అర్థం ‘తీసుకొను.’ అయితే ఇక్కడ సౌలును దాగి ఉన్న చోటు నుండి సభ వద్దకు తీసుకురావడం సందర్భార్థం; ‘తీసుకొచ్చారు’ గమ్యాన్ని అతిగా వివరించకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּתְיַצֵּב
  choice: నిలబడ్డాడు
  rationale: יצב యొక్క హిత్‌పయేల్ రూపం ‘తన స్థానంలో నిలుచు’ లేదా ‘నిలబడు’ అని అర్థమిస్తుంది. ఇక్కడ అదనపు ఆచారపరమైన భావాన్ని చేర్చకుండా సన్నివేశాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: בְּתוֹךְ הָעָם
  choice: ప్రజల మధ్య
  rationale: בְּתוֹךְ అంటే ‘మధ్యలో/మధ్య.’ ‘ప్రజల మధ్య’ ఆధునిక తెలుగులో సహజంగా ఉండి మూల భావాన్ని కాపాడుతుంది.
- source_word: וַיִּגְבַּהּ מִכָּל הָעָם
  choice: ప్రజలందరికంటే ఎత్తుగా ఉన్నాడు
  rationale: גבהּ ఇక్కడ ఎత్తులో పోలికను సూచిస్తుంది. ‘ఎత్తుగా ఉన్నాడు’ మానవ శరీరాకృతిని వర్ణించడానికి సహజమైన తెలుగు.
- source_word: מִשִּׁכְמוֹ וָמָעְלָה
  choice: భుజాల నుండి పైకి
  rationale: హీబ్రూ పదబంధాన్ని సన్నిహితంగా అనుసరిస్తూ, సౌలు ఇతరులకంటే తల-భుజాల మేర ఎత్తుగా ఉన్నాడనే దృశ్యాన్ని వ్యక్తపరుస్తుంది.
