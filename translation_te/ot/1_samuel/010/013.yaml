  text: וַ/יְכַל֙ מֵֽ/הִתְנַבּ֔וֹת וַ/יָּבֹ֖א הַ/בָּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/013.yaml
  text: When he had finished prophesying[a], he came to the high place.
translation:
  language: te
  text: అతడు ప్రవచించడం ముగించిన తరువాత, ఎత్తైన ఆరాధనా స్థలానికి వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఉన్నత స్థలం”; హెబ్రీ పదం సాధారణంగా ఆరాధన కోసం ఉపయోగించే ఎత్తైన ప్రదేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: ముగించినప్పుడు
  rationale: כלה క్రియ ముందున్న కార్యం పూర్తయినదని సూచిస్తుంది; తరువాతి సంఘటనతో సహజమైన కాలసంబంధాన్ని తెలుగులో చూపుతుంది.
- source_word: מֵהִתְנַבּוֹת
  choice: ప్రవచించడం
  rationale: נבא యొక్క హిత్పయేల్ రూపం ఇక్కడ ప్రవచన కార్యంలో పాల్గొనడాన్ని సూచిస్తుంది; సందర్భానికి నేరుగా సరిపోయే సహజ తెలుగు పదబంధం ఇది.
- source_word: וַיָּבֹא
  choice: వచ్చాడు
  rationale: בוא సందర్భానుసారం రావడం లేదా వెళ్లడం అనే భావం ఇవ్వగలదు; పాఠంలోని దృష్టికోణాన్ని అతిగా నిర్దిష్టం చేయకుండా సంప్రదాయ కథన భావాన్ని నిలుపుతుంది.
- source_word: הַבָּמָה
  choice: ఉన్నత స్థలం
  rationale: במה సాధారణంగా ఎత్తైన ఆరాధనా స్థలాన్ని సూచిస్తుంది. 'ఉన్నత స్థలం' మూలపదపు రూపకల్పనను నిలుపుతూ, దాని ఆరాధనా ప్రాముఖ్యతను పాదటిప్పణిలో స్పష్టం చేయడానికి వీలు కల్పిస్తుంది.
theological_decisions:
- issue: הַבָּמָה యొక్క ఆరాధనా ప్రాముఖ్యత
  choice: ఉన్నత స్థలం
  alternative: కొండమీది ఆరాధనా స్థలం
  rationale: ఈ పదం ఆరాధన జరిగే ప్రదేశాన్ని సూచించినా, ఆ స్థలం న్యాయబద్ధమైనదా కాదా అనే చారిత్రక-దైవశాస్త్రీయ ప్రశ్నను ఈ వచనం తేల్చదు. అందువల్ల ప్రధాన పాఠం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస కార్యాలను కాలవాక్యంతో స్పష్టంగా వ్యక్తం చేసి, ఆరాధనా స్థలానికి సంబంధించిన భావాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుకుంది.
