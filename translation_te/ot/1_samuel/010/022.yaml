id: 1SA.10.22
reference: 1 Samuel 10:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁאֲלוּ עוֹד֙ בַּֽ/יהוָ֔ה הֲ/בָ֥א ע֖וֹד הֲלֹ֣ם אִ֑ישׁ וַ/יֹּ֣אמֶר יְהוָ֔ה הִנֵּה ה֥וּא נֶחְבָּ֖א אֶל הַ/כֵּלִֽים־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/022.yaml
  text: So they inquired of Yahweh again[a], “Has the man come here yet?” And Yahweh said, “Behold, he has hidden himself among the baggage.”
translation:
  language: te
  text: 'అప్పుడు వారు మళ్లీ యాహ్వేను అడిగారు: “ఆ మనిషి ఇంకా ఇక్కడికి వచ్చాడా?” యాహ్వే, “ఇదిగో, అతడు సామానుల[a] మధ్య దాక్కున్నాడు” అని చెప్పాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి అక్షరార్థంగా ‘పాత్రలు/వస్తువుల మధ్య’ అని చెప్పవచ్చు; అది సామాను, పరికరాలు లేదా ఇతర సరఫరా వస్తువులను విస్తృతంగా సూచించగలదు. ఇక్కడ సమావేశమైన ప్రజల సామాను అనే అర్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ ... בַּיהוָה
  choice: యాహ్వేను విచారించి
  rationale: שׁאל అనే క్రియ בַּיהוָהతో కలిసి వచ్చినప్పుడు సాధారణంగా ప్రశ్నించడం కంటే దేవుని నుండి జవాబు కోరడాన్ని సూచిస్తుంది. ‘విచారించి’ ఆ సంప్రదింపుల భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עוֹד (మొదటిది)
  choice: మళ్లీ
  rationale: విచారణ మరోసారి జరిగిందని తెలిపే పునరావృత్తి భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הֲבָא עוֹד הֲלֹם אִישׁ
  choice: ఆ మనిషి ఇంకా ఇక్కడికి వచ్చాడా?
  rationale: పరిపూర్ణ క్రియ בוא రాక జరిగిందా అని అడుగుతుంది; עוֹדకు ‘ఇంకా’ అని, הֲלֹםకు ‘ఇక్కడికి’ అని అనువదించాం. సందర్భంలో אִישׁ సౌలును సూచిస్తున్నప్పటికీ, మూలంలోని పరోక్షమైన ‘మనిషి’ అనే సంబోధనను అలాగే ఉంచాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే విషయంపై శ్రద్ధను కేంద్రీకరించే హీబ్రూ ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נֶחְבָּא
  choice: దాక్కున్నాడు
  rationale: నిఫాల్ రూపం ఈ సందర్భంలో తనను తాను దాచుకున్నాడనే ప్రతిఫలార్థాన్ని ఇస్తుంది. ‘దాక్కున్నాడు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֶל הַכֵּלִים
  choice: సామానుల మధ్య
  rationale: כֵּלִים అనేది పాత్రలు, వస్తువులు, పరికరాలు లేదా ప్రయాణ సామాను వంటి విస్తృత అర్థం గల పదం. సమావేశ సందర్భంలో ప్రజలు తెచ్చిన సామాను అనే భావం అత్యంత సహజం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో నిబంధన దైవనామమైన చతురక్షరి నామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని ‘ఆ మనిషి’ అనే పరోక్ష సూచనను నిలుపుతూ, హీబ్రూ ప్రశ్నలోని సహజమైన కాలభావాన్ని ‘ఇంకా ... వచ్చాడా?’గా వ్యక్తం చేశాం.
