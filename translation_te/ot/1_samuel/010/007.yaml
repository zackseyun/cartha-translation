    text: లేదా, “నీ శక్తికి సాధ్యమైనది చేయి.” హెబ్రీ సామెతను అక్షరార్థంగా అనువదిస్తే, “నీ చెయ్యి ఏది కనుగొంటుందో అది చేయి” అని ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: సంభవించినప్పుడు
  rationale: భవిష్యత్తులో ఏర్పడబోయే సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హెబ్రీ నిర్మాణంలోని కాలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: תבאינה הָאֹתוֹת הָאֵלֶּה לָךְ
  choice: ఈ సూచనలు నీకు సంభవించినప్పుడు
  rationale: בוא అనే క్రియ ‘సూచనలు’తో వచ్చినప్పుడు అవి రావడం లేదా సంభవించడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘సంభవించు’ సందర్భానుకూలంగా స్పష్టంగా ఉంటుంది.
- source_word: עֲשֵׂה לְךָ
  choice: చేయి
  rationale: లְךָలోని వ్యక్తిగతంగా చర్య తీసుకోవాలనే సూక్ష్మభావం తరువాతి చేతి-సామెతలోనే సహజంగా వ్యక్తమవుతుంది; ‘నీ కోసం చేసుకో’ అనడం తెలుగులో అనవసరమైన స్వార్థార్థాన్ని కలిగించవచ్చు.
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
  choice: నీ చేతికి ఏది దొరికితే అది చేయి
  rationale: హెబ్రీలోని చేతి రూపకాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తనకు అందుబాటులో ఉన్నది లేదా తన శక్తిలో ఉన్నది చేయాలనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు కారణాన్ని స్పష్టంగా తెలిపే కారణార్థక అనుసంధానం.
- source_word: הָאֱלֹהִים עִמָּךְ
  choice: దేవుడు నీతో ఉన్నాడు
  rationale: ఇక్కడ ఆర్టికల్‌తో ఉన్న אֱלֹהִים ఇశ్రాయేలు దేవునికి నిర్దిష్ట సూచన; తెలుగులో ‘దేవుడు’ సహజమైనది. ‘నీతో ఉన్నాడు’ దైవసన్నిధి మరియు సహాయ భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: ఆర్టికల్‌తో ఉన్న הָאֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: ఆ దేవుడు
  rationale: హెబ్రీ ఆర్టికల్ ఇక్కడ ఇశ్రాయేలు దేవునికి నిర్దిష్ట సూచనను ఇస్తుంది; తెలుగులో ‘ఆ దేవుడు’ అనడం అనవసరమైన వ్యత్యాసాన్ని సూచించవచ్చు. ‘దేవుడు నీతో ఉన్నాడు’ మూలంలోని దైవసన్నిధి భావాన్ని సహజంగా అందిస్తుంది.
- issue: దేవుడు తోడుగా ఉన్నందున సౌలు చేయవలసిన చర్య పరిధి
  choice: నీ చేతికి ఏది దొరికితే అది చేయి
  alternative: నీ శక్తికి సాధ్యమైనది చేయి
  rationale: మూలంలోని వాక్యం చర్యకు విస్తృత అనుమతిని ఇస్తున్నప్పటికీ దాని ఖచ్చిత పరిధిని వివరించదు. చేతి రూపకాన్ని నిలుపడం ద్వారా ఆ ఉద్దేశపూర్వక విస్తృతతను సంరక్షించాం; దానిని ప్రత్యేక నైతిక లేదా సిద్ధాంత పరిమితితో అనువాదంలోనే కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఏకవచన సంబోధన వాడబడింది. హెబ్రీ చేతి-సామెతను ప్రధాన వాక్యంలో కొంతవరకు నిలిపి, దాని భావార్థాన్ని పాదసూచికలో ఇచ్చాం.
