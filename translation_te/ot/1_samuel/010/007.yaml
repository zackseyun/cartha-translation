  yaml_path: translation/ot/1_samuel/010/007.yaml
  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
translation:
  language: te
  text: ఈ సూచనలు నీకు వచ్చినప్పుడు, నీ చేతికి ఏది దొరికితే అది చేయి[a]. ఎందుకంటే దేవుడు నీతో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
