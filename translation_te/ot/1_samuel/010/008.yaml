id: 1SA.10.8
reference: 1 Samuel 10:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָרַדְתָּ֣ לְ/פָנַ/י֮ הַ/גִּלְגָּל֒ וְ/הִנֵּ֤ה אָֽנֹכִי֙ יֹרֵ֣ד אֵלֶ֔י/ךָ לְ/הַעֲל֣וֹת עֹל֔וֹת לִ/זְבֹּ֖חַ זִבְחֵ֣י שְׁלָמִ֑ים שִׁבְעַ֨ת יָמִ֤ים תּוֹחֵל֙ עַד בּוֹאִ֣/י אֵלֶ֔י/ךָ וְ/הוֹדַעְתִּ֣י לְ/ךָ֔ אֵ֖ת אֲשֶׁ֥ר תַּעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
translation:
  language: te
  text: నీవు నాకంటే ముందుగా గిల్గాలుకు దిగివెళ్లు. ఇదిగో, దహనబలులు అర్పించడానికి, సమాధాన బలులను అర్పించడానికి నేను నీ దగ్గరికి దిగివస్తాను. నేను నీ దగ్గరికి వచ్చి, నీవు చేయవలసినదేమిటో నీకు తెలియజేసే వరకు ఏడు రోజులు వేచి ఉండు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָרַדְתָּ לְפָנַי
  choice: నీవు నాకంటే ముందుగా ... దిగివెళ్లు
  rationale: లְפָנַיలోని స్థల, కాల భావాలను సహజమైన ఆధునిక తెలుగులో ‘నాకంటే ముందుగా’ అని వ్యక్తం చేసి, ఆదేశాత్మక ప్రవచన క్రమాన్ని ‘దిగివెళ్లు’తో అందించాం.
- source_word: הַגִּלְגָּל
  choice: గిల్గాలు
  rationale: స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే, వాక్యానికి సజీవతనిచ్చే హీబ్రూ సూచనార్థక పదబలాన్ని నిలిపాం.
- source_word: יֹרֵד אֵלֶיךָ
  choice: నేను నీ దగ్గరికి దిగివస్తాను
  rationale: יֹרֵדలోని దిగడం అనే స్థలార్థాన్ని, సౌలు దృష్టికోణంలో రాకను సూచించే సహజ తెలుగు రూపంతో కలిపి చెప్పాం.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: దహనబలులు అర్పించడానికి
  rationale: బలి పూర్తిగా దహించబడే స్వభావాన్ని తెలిపే స్థిరమైన బైబిలు పదజాలాన్ని ఉపయోగించాం.
- source_word: לִזְבֹּחַ זִבְחֵי שְׁלָמִים
  choice: సమాధాన బలులు వధించడానికి
  rationale: זבח క్రియలోని బలిపశువును వధించే భావాన్ని ‘వధించడానికి’తో నిలిపి, שְׁלָמִיםకు గుర్తించదగిన ‘సమాధాన బలులు’ను ఎంచుకున్నాం; విస్తృత భావపరిధిని పాదసూచికలో ఇచ్చాం.
- source_word: שִׁבְעַת יָמִים תּוֹחֵל
  choice: ఏడు రోజులు వేచి ఉండు
  rationale: ఈ ప్రక్రియాత్మక సందర్భంలో יחלకు ‘నిరీక్షించు/వేచి ఉండు’ అనే అర్థం తగినది; సాధారణ ఆధునిక తెలుగులో ‘వేచి ఉండు’ సహజంగా ఉంది.
- source_word: וְהוֹדַעְתִּי לְךָ אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: నీవు చేయవలసినదేమిటో నీకు తెలియజేసే
  rationale: ידע హిఫీల్ రూపంలోని ‘తెలిసేలా చేయడం’ అనే కారణార్థాన్ని ‘తెలియజేయడం’తో కాపాడి, ఆదేశ భావాన్ని ‘చేయవలసినది’తో తెలిపాం.
theological_decisions:
- issue: שְׁלָמִים అనే బలి పదం అనువాదం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: ఈ పదం సమాధానం, సంపూర్ణ క్షేమం, దేవునితోను సమాజంతోను పంచుకునే సహవాసం వంటి భావాలను కలిగి ఉంది. ‘సమాధాన బలులు’ గుర్తించదగిన సంప్రదాయ పదం; దాని అర్థాన్ని ఒకే సిద్ధాంత భావానికి పరిమితం చేయకుండా ప్రత్యామ్నాయాలను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ఆదేశాత్మక స్వరాన్ని సహజ తెలుగు క్రియారూపాలతో నిలిపాం; బలి సంబంధిత కీలక పదాలకు గుర్తించదగిన బైబిలు పదజాలాన్ని ఉపయోగించాం.
