  text: Then Samuel called the people together to Yahweh at Mizpah[a].
translation:
  language: te
  text: తర్వాత సమూయేలు ప్రజలను మిస్పాలో యాహ్వే దగ్గరకు సమకూర్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమూయేలు ప్రజలను మిస్పాలో యాహ్వే దగ్గరకు పిలిచాడు.” హీబ్రూ క్రియ ప్రజలను సభగా పిలవడం లేదా సమకూర్చడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  choice: సమకూర్చాడు
  rationale: צעק సాధారణంగా ‘కేక వేయు’ అని అర్థమిచ్చినా, ఇక్కడ ప్రత్యక్ష కర్మగా ‘ప్రజలను’ తీసుకొని సభకు పిలిచి కూడగట్టే భావాన్ని వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘సమకూర్చాడు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֶת הָעָם
  choice: ప్రజలను
  rationale: עם ఇక్కడ ఇశ్రాయేలు ప్రజలను సూచిస్తుంది; ‘ప్రజలను’ నేరమైన, సందర్భోచితమైన అనువాదం.
- source_word: אֶל יְהוָה
  choice: యెహోవా సన్నిధికి
  rationale: אֶל యొక్క ‘వైపు/దగ్గరకు’ అనే దిశార్థాన్ని, యెహోవా ఎదుట కూడడం అనే సందర్భార్థంతో తెలుగులో సహజంగా తెలియజేస్తుంది; ‘యెహోవాకు’ అన్నదానికంటే ఉద్దేశించిన సభాసంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: הַמִּצְפָּה
  choice: మిస్పాలో
  rationale: מִצְפָּה ఇక్కడ స్థలనామం. గమ్యస్థాన భావం ఉన్నప్పటికీ, కూడిక జరిగిన ప్రదేశాన్ని తెలుగులో సహజంగా ‘మిస్పాలో’ అని తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నామరూపంలో నిలిపాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: אֶל יְהוָה యొక్క సంబంధం
  choice: యెహోవా సన్నిధికి
  alternative: యెహోవా దగ్గరకు; యెహోవా ఎదుట
  rationale: మూలంలోని אֶל దిశను సూచిస్తుంది; అయితే ఇక్కడ ప్రజలు దేవుని సమక్షంలో సభగా కూడడమే సందర్భార్థం. ‘సన్నిధికి’ దిశను, ఆరాధనా/నిబంధనా సమక్షాన్ని రెండింటినీ సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘సమకూర్చాడు’ సభగా కూడగట్టే భావాన్ని ఇస్తుంది; స్థలనామాన్ని ‘మిస్పా’గా లిప్యంతరీకరించాం. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
