translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంచి, మరింత సంక్షిప్తమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
