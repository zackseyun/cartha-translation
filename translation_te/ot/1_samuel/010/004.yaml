source:
  edition: WLC
  text: וְ/שָׁאֲל֥וּ לְ/ךָ֖ לְ/שָׁל֑וֹם וְ/נָתְנ֤וּ לְ/ךָ֙ שְׁתֵּי לֶ֔חֶם וְ/לָקַחְתָּ֖ מִ/יָּדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/004.yaml
  text: They will ask you about your welfare and give you two loaves of bread[c][b][a], and you shall receive them from their hand.
translation:
  language: te
  text: వారు నీ క్షేమం గురించి అడిగి,[a] నీకు రెండు రొట్టెలు ఇస్తారు. నీవు వాటిని వారి చేతిలోనుంచి తీసుకోవాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు నిన్ను పలకరిస్తారు.” హీబ్రూ నుడికారం అక్షరార్థంగా క్షేమం గురించి అడగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీవు వాటిని వారి చేతిలోనుంచి స్వీకరించాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  choice: వారు నీ క్షేమం గురించి అడిగి
  rationale: שׁאל ... לְשָׁלוֹם అనే హీబ్రూ నుడికారం ఒకరి క్షేమాన్ని విచారించడం లేదా పలకరించడం అనే భావాన్ని ఇస్తుంది. ‘క్షేమం గురించి అడిగి’ అనేది ఆ విచారణ భావాన్ని సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: שָׁלוֹם
  choice: క్షేమం
  rationale: ఈ సందర్భంలో שָׁלוֹם అనేది సాధారణ ‘సమాధానం’ కంటే వ్యక్తిగత బాగోగులు లేదా క్షేమాన్ని సూచిస్తుంది.
- source_word: וְנָתְנוּ לְךָ
  choice: నీకు ... ఇస్తారు
  rationale: హీబ్రూ వావ్-వరుస ఇక్కడ సమూయేలు ముందుగా చెబుతున్న భవిష్యత్తు సంఘటనను కొనసాగిస్తుంది; తెలుగు సాధారణ భవిష్యత్ రూపం సహజంగా ఉంటుంది.
- source_word: שְׁתֵּי לֶחֶם
  choice: రెండు రొట్టెలు
  rationale: లెక్కించబడుతున్న ఆహారపు యూనిట్లను ఆధునిక తెలుగులో ‘రెండు రొట్టెలు’ అని సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: וְלָקַחְתָּ מִיָּדָם
  choice: నీవు వాటిని వారి చేతిలోనుంచి తీసుకోవాలి
  rationale: לקח యొక్క ప్రాథమిక భావమైన ‘తీసుకొను’ను నిలుపుతూ, ఈ సూచనలోని నిర్దేశక బలాన్ని ‘తీసుకోవాలి’ వ్యక్తం చేస్తుంది. מִיָּדָם లోని మూలరూప చిత్రాన్ని ‘వారి చేతిలోనుంచి’ నిలుపుతుంది.
