source:
  edition: WLC
  text: וְ/חָלַפְתָּ֨ מִ/שָּׁ֜ם וָ/הָ֗לְאָה וּ/בָ֨אתָ֙ עַד אֵל֣וֹן תָּב֔וֹר וּ/מְצָא֤וּ/ךָ שָּׁם֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים עֹלִ֥ים אֶל הָ/אֱלֹהִ֖ים בֵּֽית אֵ֑ל אֶחָ֞ד נֹשֵׂ֣א שְׁלֹשָׁ֣ה גְדָיִ֗ים וְ/אֶחָד֙ נֹשֵׂ֗א שְׁלֹ֨שֶׁת֙ כִּכְּר֣וֹת לֶ֔חֶם וְ/אֶחָ֥ד נֹשֵׂ֖א נֵֽבֶל יָֽיִן־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
translation:
  language: te
  text: తర్వాత నువ్వు అక్కడి నుంచి ఇంకా ముందుకు వెళ్లి తాబోరు మహావృక్షం[a] దగ్గరికి చేరుకుంటావు. అక్కడ బేతేలులో దేవుని వద్దకు ఎక్కివెళ్తున్న[b] ముగ్గురు మనుషులు నీకు ఎదురవుతారు. వారిలో ఒకడు మూడు మేకపిల్లలను మోసుకుని ఉంటాడు; మరొకడు మూడు రొట్టెలను మోసుకుని ఉంటాడు; ఇంకొకడు ద్రాక్షారసపు తోలుతిత్తిని[c] మోసుకుని ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాబోరు ఓకు చెట్టు,” లేదా “తాబోరు టెరెబింతు చెట్టు.” హీబ్రూ పదం ఓకు లేదా టెరెబింతు వంటి పెద్ద చెట్టును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “బేతేలులో దేవుని వద్దకు ఎక్కివెళ్తున్న.” ఇది బేతేలులోని ఆరాధనా స్థలానికి చేసే ప్రయాణాన్ని సూచిస్తుండవచ్చు.
    reason: cultural_note
  - marker: c
    text: లేదా, “ద్రాక్షారసం నింపిన తోలుతిత్తి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָלַפְתָּ מִשָּׁם וָהָלְאָה
  choice: అక్కడి నుంచి ఇంకా ముందుకు వెళ్లి
  rationale: חלף మరియు הָלְאָה కలిపి మునుపటి స్థలం నుంచి మరింత ముందుకు సాగడాన్ని సూచిస్తాయి; సహజమైన తెలుగులో ఈ క్రమగమనాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֵלוֹן תָּבוֹר
  choice: తాబోరు మహావృక్షం
  rationale: אֵלוֹן ఒక పెద్ద ఓకు లేదా టెరెబింతు చెట్టును సూచించవచ్చు. నిర్దిష్ట వృక్షజాతిని అనిశ్చితంగా నిర్ణయించకుండా 'మహావృక్షం' మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: וּמְצָאוּךָ
  choice: నీకు ఎదురవుతారు
  rationale: మూల క్రియ అక్షరార్థంగా 'నిన్ను కనుగొంటారు' అయినా, ప్రయాణంలో కలుసుకునే సందర్భంలో 'ఎదురవుతారు' సహజంగా భావాన్ని అందిస్తుంది.
- source_word: עֹלִים אֶל הָאֱלֹהִים בֵּית אֵל
  choice: బేతేలులో దేవుని దగ్గరికి వెళ్తున్న
  rationale: హీబ్రూ వాక్యంలోని దేవునివైపు ఎక్కివెళ్లడం మరియు బేతేలుతో ఉన్న సంబంధం రెండింటినీ నిలుపుతూ, మూలంలో స్పష్టంగా లేని 'ఆరాధించడానికి' అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: גְדָיִים
  choice: మేకపిల్లలు
  rationale: యువ మేకలను సూచించే స్పష్టమైన, సహజమైన తెలుగు పదం.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: రొట్టెలు
  rationale: כִּכָּר ఇక్కడ గుండ్రని రొట్టె లేదా రొట్టె ముద్దను సూచిస్తుంది; సంఖ్యతో కలిపి 'మూడు రొట్టెలు' సహజంగా ఉంటుంది.
- source_word: נֵבֶל יָיִן
  choice: ద్రాక్షారసం నింపిన తోలుతిత్తి
  rationale: נֵבֶל ద్రవాన్ని ఉంచే పాత్రను, ఈ సందర్భంలో సాధారణంగా తోలుతో చేసిన తిత్తిని సూచిస్తుంది; יַיִן ద్రాక్షారసమని స్పష్టంగా ఉంచబడింది.
theological_decisions:
- issue: עֹלִים אֶל הָאֱלֹהִים בֵּית אֵל అనే పదబంధం యొక్క భావం
  choice: బేతేలులో దేవుని దగ్గరికి వెళ్తున్న
  alternative: దేవుణ్ణి ఆరాధించడానికి బేతేలుకు వెళ్తున్న
  rationale: ఇది బేతేలుతో సంబంధమున్న దేవునివైపు ప్రయాణాన్ని సూచిస్తుంది. ఆరాధనా యాత్ర భావం సందర్భంలో సాధ్యమే అయినా, ఈ ఉపవాక్యంలో 'ఆరాధించడానికి' అని ప్రత్యక్షంగా లేదు; అందువల్ల ఆ వివరాన్ని పాఠ్యంలో జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సమూయేలు సౌలుతో నేరుగా మాట్లాడుతున్న సందర్భానికి తగిన ఏకవచన అనౌపచారిక సంబోధనను వాడాం. భాషను సాధారణ పాఠకులకు స్పష్టంగా, అయినా గౌరవప్రదంగా ఉంచాం; వృక్షజాతి మరియు బేతేలు పదబంధంలోని నిజమైన అనిశ్చితిని పాదటిప్పణుల్లో నిలిపాం.
