  text: בְּ/לֶכְתְּ/ךָ֤ הַ/יּוֹם֙ מֵ/עִמָּדִ֔/י וּ/מָצָאתָ֩ שְׁנֵ֨י אֲנָשִׁ֜ים עִם קְבֻרַ֥ת רָחֵ֛ל בִּ/גְב֥וּל בִּנְיָמִ֖ן בְּ/צֶלְצַ֑ח וְ/אָמְר֣וּ אֵלֶ֗י/ךָ נִמְצְא֤וּ הָ/אֲתֹנוֹת֙ אֲשֶׁ֣ר הָלַ֣כְתָּ לְ/בַקֵּ֔שׁ וְ/הִנֵּ֨ה נָטַ֤שׁ אָבִ֨י/ךָ֙ אֶת דִּבְרֵ֣י הָ/אֲתֹנ֔וֹת וְ/דָאַ֤ג לָ/כֶם֙ לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לִ/בְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/002.yaml
  text: When you leave me today[a], you will find two men near Rachel’s tomb in the territory of Benjamin at Zelzah, and they will say to you, ‘The donkeys that you went to look for have been found, and look, your father has stopped caring about the donkeys and is anxious about you, saying[c][b], “What shall I do about my son?”’
translation:
  language: te
  text: “ఈ రోజు నీవు నా దగ్గరనుంచి వెళ్లినప్పుడు, బెన్యామీను ప్రాంతంలో[a] సెల్సహు దగ్గర ఉన్న రాహేలు సమాధి వద్ద ఇద్దరు మనుషులు నీకు ఎదురవుతారు. వారు నీతో, ‘నీవు వెదకడానికి వెళ్లిన గాడిదలు దొరికాయి. ఇదిగో, నీ తండ్రి గాడిదల సంగతి పక్కనపెట్టి[b], మీ గురించి[c] ఆందోళనపడుతూ, “నా కుమారుని విషయంలో నేనేం చేయాలి?” అని అంటున్నాడు’ అని చెబుతారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బెన్యామీను సరిహద్దు దగ్గర.” హీబ్రూ పదానికి “సరిహద్దు,” “ప్రాంతం” అనే రెండు అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నీ తండ్రి గాడిదల విషయాన్ని విడిచిపెట్టాడు.”
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ “మీ” అనేది హీబ్రూలో బహువచనం; ఇది బహుశా సౌలును, అతనితో ప్రయాణిస్తున్న సేవకుణ్ణి సూచిస్తుంది.
    reason: source_number_clarification
lexical_decisions:
- source_word: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי
  choice: ఈ రోజు నీవు నా దగ్గరనుంచి వెళ్లినప్పుడు
  rationale: కాలాన్ని సూచించే infinitive నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, సమూయేలు సన్నిధి నుంచి సౌలు బయలుదేరే భావాన్ని నిలుపుతుంది.
- source_word: וּמָצָאתָ שְׁנֵי אֲנָשִׁים
  choice: ఇద్దరు మనుషులు నీకు ఎదురవుతారు
  rationale: సందర్భంలో ఇది ముందుగా చెప్పబడుతున్న సంఘటన. ‘ఎదురవుతారు’ అనేది ప్రయాణంలో వారిని కనుగొనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עִם קְבֻרַת רָחֵל
  choice: రాహేలు సమాధి వద్ద
  rationale: ఇక్కడ עִם స్థలసూచకంగా ‘వద్ద/దగ్గర’ అనే అర్థం ఇస్తుంది; קְבֻרָהకు ‘సమాధి’ సహజమైన గౌరవప్రద పదం.
- source_word: בִּגְבוּל בִּנְיָמִן
  choice: బెన్యామీను ప్రాంతంలో
  rationale: גְּבוּלకు ‘సరిహద్దు’ లేదా ‘ప్రాంతం’ అనే రెండు సాధ్యార్థాలు ఉన్నాయి. ప్రధాన పాఠ్యంలో స్థలవివరణకు సహజమైన ‘ప్రాంతం’ వాడి, ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచాం.
- source_word: בְּצֶלְצַח
  choice: సెల్సహు దగ్గర
  rationale: స్థలనామాన్ని తెలుగులో లిప్యంతరీకరించి, ఒక నిర్దిష్ట స్థలాన్ని సూచించే విధంగా ‘దగ్గర’ వాడాం.
- source_word: נִמְצְאוּ הָאֲתֹנוֹת אֲשֶׁר הָלַכְתָּ לְבַקֵּשׁ
  choice: నీవు వెదకడానికి వెళ్లిన గాడిదలు దొరికాయి
  rationale: హీబ్రూ ఫలితాత్మక నిష్క్రియ భావాన్ని ‘దొరికాయి’ స్పష్టంగా అందిస్తుంది. ఆడ గాడిదలని పదం నిర్దిష్టంగా సూచించినా, ఈ సందర్భంలో లింగం ప్రధానాంశం కానందున సాధారణ పదం వాడాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కొత్త పరిణామంపై శ్రద్ధను ఆకర్షించే హీబ్రూ సంభాషణ సంకేతాన్ని సహజంగా నిలుపుతుంది.
- source_word: נָטַשׁ אָבִיךָ אֶת דִּבְרֵי הָאֲתֹנוֹת
  choice: నీ తండ్రి గాడిదల సంగతి పక్కనపెట్టి
  rationale: అక్షరార్థంగా ‘గాడిదల విషయాన్ని విడిచిపెట్టాడు.’ ‘సంగతి పక్కనపెట్టి’ అనే రూపం దృష్టి ఇక వాటిపై లేదనే భావాన్ని తెలియజేస్తుంది; ‘పట్టించుకోవడం మానేశాడు’ అనే కఠిన భావాన్ని అనవసరంగా రుద్దదు.
- source_word: וְדָאַג לָכֶם
  choice: మీ గురించి ఆందోళనపడుతూ
  rationale: לָכֶם రెండవ పురుష బహువచనం; తెలుగులో ‘మీ’ ద్వారా ఆ సంఖ్యాభేదం ప్రత్యక్షంగా నిలిచింది. דאגలోని కలవరంతో కూడిన శ్రద్ధను ‘ఆందోళనపడుతూ’ అందిస్తుంది.
- source_word: מָה אֶעֱשֶׂה לִבְנִי
  choice: నా కుమారుని విషయంలో నేనేం చేయాలి?
  rationale: לִבְנִיలోని సంబంధార్థక לְను తెలుగులో ‘విషయంలో’ సహజంగా తెలియజేస్తూ తండ్రి కలవరాన్ని ప్రశ్నరూపంలో నిలుపుతుంది.
