  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתֶּ֨ם הַ/יּ֜וֹם מְאַסְתֶּ֣ם אֶת אֱלֹהֵי/כֶ֗ם אֲשֶׁר ה֣וּא מוֹשִׁ֣יעַ לָ/כֶם֮ מִ/כָּל רָעוֹתֵי/כֶ֣ם וְ/צָרֹֽתֵי/כֶם֒ וַ/תֹּ֣אמְרוּ ל֔/וֹ כִּי מֶ֖לֶךְ תָּשִׂ֣ים עָלֵ֑י/נוּ וְ/עַתָּ֗ה הִֽתְיַצְּבוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/שִׁבְטֵי/כֶ֖ם וּ/לְ/אַלְפֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
translation:
  language: te
  text: 'కానీ ఈ రోజు, మీ ఆపదలన్నిటి నుంచీ, కష్టాల నుంచీ[a] మిమ్మల్ని రక్షించేవాడైన మీ దేవుణ్ణి మీరు తిరస్కరించారు. మీరు ఆయనతో ఇలా అన్నారు: “కాదు, మా మీద ఒక రాజును నియమించు.” కాబట్టి ఇప్పుడు మీ గోత్రాలవారీగా, మీ వెయ్యుల విభాగాలవారీగా[b] యాహ్వే సమక్షంలో హాజరుకండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీకు కలిగిన కీడులన్నిటి నుంచీ, బాధల నుంచీ’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదాలు అనుభవించిన కీడులు, విపత్తులు, ఇబ్బందులు లేదా బాధలను సూచించగలవు.
    reason: lexical_alternative
  - marker: b
    text: ‘మీ వంశాలవారీగా’ లేదా ‘మీ వెయ్యిమంది విభాగాలవారీగా’ అని కూడా అనువదించవచ్చు. ‘వెయ్యి’ అనే హీబ్రూ పదం కేవలం సంఖ్యనే కాకుండా సామాజిక లేదా సైనిక ఉపవిభాగాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַסְתֶּם
  choice: తిరస్కరించారు
  rationale: మָאַס అనే క్రియలోని నిరాకరించడం లేదా తోసిపుచ్చడం అనే బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుణ్ణి
  rationale: రూపపరంగా బహువచన స్వరూపం ఉన్నప్పటికీ, ఏకవచన క్రియాత్మక సందర్భంలో ఇది ఇశ్రాయేలు దేవుణ్ణే సూచిస్తుంది.
- source_word: מוֹשִׁיעַ
  choice: రక్షించేవాడు
  rationale: హీబ్రూ వర్తమాన కృదంతం దేవుడు అలవాటుగా, నిరంతరం రక్షించే స్వభావాన్ని సూచిస్తుంది; ‘రక్షించేవాడు’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: מִכָּל רָעוֹתֵיכֶם וְצָרֹתֵיכֶם
  choice: మీ ఆపదలన్నిటి నుండీ, కష్టాల నుండీ
  rationale: రָעוֹת ఇక్కడ అనుభవించిన కీడులు లేదా విపత్తులను, צָרוֹת ఇబ్బందులు లేదా బాధాకర పరిస్థితులను సూచించగలవు. ‘ఆపదలు, కష్టాలు’ అనే జత సందర్భానికి సహజంగా ఉండి రెండు పదాల భేదాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: כִּי
  choice: కాదు
  rationale: ప్రజల పట్టుదలతో కూడిన ప్రత్యుత్తరాన్ని, దేవుని రక్షణకు విరుద్ధంగా వారు రాజును కోరిన సందర్భాన్ని ‘కాదు’ సహజంగా వ్యక్తం చేస్తుంది; మూలపదానికి ఇతర సందర్భాల్లో వివరణాత్మక లేదా బలపరిచే అర్థాలు కూడా ఉండవచ్చు.
- source_word: תָּשִׂים
  choice: నియమించు
  rationale: שׂוּם అంటే ఉంచడం లేదా నియమించడం. రాజును అధికారంలో పెట్టే ఈ సందర్భంలో ‘నియమించు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הִתְיַצְּבוּ
  choice: హాజరుకండి
  rationale: ఎంపిక ప్రక్రియ కోసం యాహ్వే సమక్షంలో క్రమబద్ధంగా తమను తాము నిలబెట్టుకోవాలనే భావాన్ని ఈ మర్యాదపూర్వక ఆజ్ఞ తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో అందిస్తుంది.
- source_word: לְשִׁבְטֵיכֶם
  choice: మీ గోత్రాలవారీగా
  rationale: లְ ఉపసర్గ ఇక్కడ విభాగాల ప్రకారం క్రమబద్ధంగా సమీకరించడాన్ని సూచిస్తుంది.
- source_word: וּלְאַלְפֵיכֶם
  choice: మీ వేలవారీగా
  rationale: అక్షరార్థాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; אֶלֶף సామాజిక లేదా సైనిక ఉపవిభాగాన్ని కూడా సూచించగలదనే విషయాన్ని పాదసూచికలో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలపాఠాన్ని పారదర్శకంగా ఉంచుతుంది.
- issue: ప్రజల మాటల్లో כִּי యొక్క భావం
  choice: “కాదు, మా మీద ఒక రాజును నియమించు”
  alternative: “నిజంగా, మా మీద ఒక రాజును నియమించు”; “మా మీద ఒక రాజును నియమించు”
  rationale: దేవుని రక్షణను తిరస్కరించి రాజును పట్టుబట్టి అడిగిన సందర్భంలో వ్యతిరేకతను ‘కాదు’ స్పష్టం చేస్తుంది. అయితే כִּי స్వతహాగా అనేక సంబంధార్థాలు కలిగిన పదం కాబట్టి దానిని అదనపు సిద్ధాంతార్థంతో విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ‘గోత్రాలవారీగా, వేలవారీగా’ అనే సమాంతర నిర్మాణం మూలంలోని పరిపాలనా క్రమాన్ని నిలుపుతుంది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల వెంటనే ఉంచబడ్డాయి.
