id: 1SA.10.18
reference: 1 Samuel 10:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
translation:
  language: te
  text: 'అతడు ఇశ్రాయేలు ప్రజలతో[a] ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా చెబుతున్నాడు: నేను ఇశ్రాయేలును ఐగుప్తు నుండి పైకి తీసుకొచ్చాను; ఐగుప్తీయుల చేతిలోనుండి, మిమ్మల్ని అణచివేస్తున్న రాజ్యాలన్నిటి చేతిలోనుండి మిమ్మల్ని విడిపించాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులతో”; సంప్రదాయంగా, “ఇశ్రాయేలు సంతానంతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ అయితే ఇది ఇక్కడ సమస్త ఇశ్రాయేలు సమాజాన్ని సూచించే సంప్రదాయ జాతినామం; ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా, సమగ్రంగా అర్థాన్ని అందిస్తుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా చెబుతున్నాడు
  rationale: దైవిక సందేశ ప్రకటన సూత్రంలోని గంభీరతను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తింపుపొందిన రూపంలో లిప్యంతరీకరించింది.
- source_word: הֶעֱלֵיתִי
  choice: పైకి తీసుకొచ్చాను
  rationale: עלה హిఫీల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే నిర్గమన సంబంధిత దిశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: וָאַצִּיל
  choice: విడిపించాను
  rationale: శత్రు అధికారం లేదా ప్రమాదం నుంచి రక్షించి విడుదల చేయడాన్ని సూచించే נצל హిఫీల్ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: అధికారం లేదా నియంత్రణను సూచించే హీబ్రూ ‘చేతి’ రూపకాన్ని తెలుగులోనూ అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: הַלֹּחֲצִים אֶתְכֶם
  choice: మిమ్మల్ని అణచివేస్తూ వచ్చిన
  rationale: కృదంత రూపంలోని కొనసాగుతున్న లేదా లక్షణాత్మక పీడన భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణ; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ పూర్తిగా నిర్ధారించలేనందున ప్రత్యామ్నాయ రూపం కూడా సాధ్యమే.
- issue: בְּנֵי יִשְׂרָאֵל అనే జాతినామం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇక్కడ పదబంధం కేవలం పురుష సంతానాన్ని కాక ఇశ్రాయేలు సమాజాన్ని ఉద్దేశిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన సమూహార్థాన్ని ఇచ్చి, అక్షరార్థ రూపాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన-ప్రకటన శైలి. హీబ్రూ ‘చేతి’ రూపకాన్ని, ‘పైకి తీసుకొచ్చాను’ అనే నిర్గమన ప్రయోగాన్ని నిలుపుతూ, జాతినామాన్ని సాధారణ పాఠకులకు సహజంగా అందించాం.
