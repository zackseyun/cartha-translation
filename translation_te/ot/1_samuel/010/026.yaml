id: 1SA.10.26
reference: 1 Samuel 10:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֨ם שָׁא֔וּל הָלַ֥ךְ לְ/בֵית֖/וֹ גִּבְעָ֑תָ/ה וַ/יֵּלְכ֣וּ עִמּ֔/וֹ הַ/חַ֕יִל אֲשֶׁר נָגַ֥ע אֱלֹהִ֖ים בְּ/לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
translation:
  language: te
  text: సౌలు కూడా గిబియాలోని తన ఇంటికి వెళ్లాడు. దేవుడు ఎవరి హృదయాలను తాకాడో ఆ పరాక్రమవంతులు[a] అతనితోపాటు వెళ్లారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శూరులు,’ ‘యోధులు.’
    reason: lexical_alternative
  - marker: b
    text: ‘హృదయాలను తాకాడు’ అనే హీబ్రూ రూపకం, దేవుడు వారి అంతరంగ వైఖరిని కదిలించాడని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: కథనంలోని కొనసాగింపును, మునుపటి సంఘటనకు సౌలు చర్యను జోడించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  choice: గిబియాలోని తన ఇంటికి వెళ్లాడు
  rationale: לְבֵיתוֹ లోని వ్యక్తిగత గమ్యాన్ని, גִּבְעָתָה లోని దిశార్థక స్థలనామాన్ని రెండింటినీ స్పష్టంగా ఉంచుతుంది.
- source_word: וַיֵּלְכוּ עִמּוֹ
  choice: అతనితోపాటు వెళ్లారు
  rationale: హీబ్రూ కథన క్రమాన్ని నిలుపుతూ తెలుగులో సహజమైన సహచర్య భావాన్ని ఇస్తుంది.
- source_word: הַחַיִל
  choice: ఆ పరాక్రమవంతులు
  rationale: ఇక్కడ పదం మొత్తం సైన్యాన్ని కాక, సౌలుతో వెళ్లిన సామర్థ్యమూ శౌర్యమూ గల వ్యక్తుల సమూహాన్ని సూచిస్తుంది. ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  choice: దేవుడు ఎవరి హృదయాలను తాకాడో
  rationale: దైవిక ప్రభావాన్ని తెలిపే మూల రూపకాన్ని నిలుపుతుంది; దాన్ని మారుమనస్సు, బలవంతం, లేదా కేవలం భావోద్వేగంగా అధికంగా వ్యాఖ్యానించదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో ఇశ్రాయేలు దేవుణ్ణి సూచించే ప్రామాణిక తెలుగు రూపం.
- source_word: לֵב
  choice: హృదయాలు
  rationale: ఆలోచన, సంకల్పం, అంతరంగ వైఖరి సహా అంతరంగ వ్యక్తిత్వాన్ని సూచించే హీబ్రూ భావాన్ని పారదర్శకంగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు వారి హృదయాలను తాకడం అనే చర్య స్వభావం
  choice: దైవిక చొరవను మూల రూపకంతోనే ‘హృదయాలను తాకాడు’ అని అనువదించడం
  alternative: ‘హృదయాలను ప్రేరేపించాడు’ లేదా ‘మనసులను కదిలించాడు’
  rationale: వారు సౌలుతో వెళ్లేలా దేవుడు వారి అంతరంగ వైఖరిపై ప్రభావం చూపాడని వాక్యం చెబుతుంది. అయితే ఆ ప్రభావం ఏ సిద్ధాంతపరమైన విధానంలో జరిగిందో మూలపాఠం నిర్దేశించదు; అందువల్ల ఆ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన బైబిలు కథన శైలిని పాటించాం. మూలంలోని ‘హృదయాలను తాకాడు’ అనే రూపకాన్ని నిలిపి, దాని భావాన్ని పాదసూచికలో సంక్షిప్తంగా వివరించాం.
