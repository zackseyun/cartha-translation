revisions:
- from: అప్పుడు సమూయేలు ప్రజలందరితో, “యాహ్వే ఎన్నుకున్నవాణ్ణి చూశారా?[a] ప్రజలందరిలో అతనిలాంటి వాడు మరొకడు లేడు” అన్నాడు. ప్రజలందరూ బిగ్గరగా కేకవేస్తూ, “రాజు చిరకాలం జీవించుగాక!”[b] అన్నారు.
  to: 'అప్పుడు సమూయేలు ప్రజలందరితో ఇలా అన్నాడు: “యాహ్వే ఎన్నుకున్న వ్యక్తిని చూశారా?[a] ప్రజలందరిలో అతనిలాంటి వాడు మరొకడు లేడు.” అప్పుడు ప్రజలందరూ బిగ్గరగా కేక వేసి, “రాజు చిరకాలం జీవించుగాక!”[b] అన్నారు.'
  rationale: కథనంలోని రెండు వరుస చర్యలను సహజంగా చూపడానికి „కేకవేస్తూ”ను „కేక వేసి”గా మార్చాం. „ఎన్నుకున్న వ్యక్తిని” అనే తటస్థ ఆధునిక రూపాన్ని ఉపయోగించాం. כי యొక్క వివరణాత్మక సంబంధాన్ని ప్రత్యేక సంధానపదంతో అతిగా నిర్దిష్టపరచలేదు. పాదసూచిక గుర్తులు మరియు వాటి అర్థాలు నిలిపి ఉంచబడ్డాయి.
