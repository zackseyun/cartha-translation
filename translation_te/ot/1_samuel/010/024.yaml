source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֜ל אֶל כָּל הָ/עָ֗ם הַ/רְּאִיתֶם֙ אֲשֶׁ֣ר בָּֽחַר בּ֣/וֹ יְהוָ֔ה כִּ֛י אֵ֥ין כָּמֹ֖/הוּ בְּ/כָל הָ/עָ֑ם וַ/יָּרִ֧עוּ כָל הָ/עָ֛ם וַ/יֹּאמְר֖וּ יְחִ֥י הַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/024.yaml
  text: Then Samuel said to all the people[a], “Do you see the one whom Yahweh has chosen? There is no one like him among all the people.” And all the people shouted and said[b], “Long live the king!”
translation:
  language: te
  text: 'అప్పుడు సమూయేలు ప్రజలందరితో ఇలా అన్నాడు: “యాహ్వే ఎన్నుకున్న వ్యక్తిని చూశారా?[a] ప్రజలందరిలో అతనిలాంటి వాడు మరొకడు లేడు.” అప్పుడు ప్రజలందరూ బిగ్గరగా కేక వేసి, “రాజు చిరకాలం జీవించుగాక!”[b] అన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ఎన్నుకున్న వ్యక్తిని చూస్తున్నారా?”
    reason: హీబ్రూ క్రియ రూపరీత్యా పూర్తయిన చర్యను సూచించినా, ఈ సందర్భంలో ప్రజల దృష్టిని ప్రస్తుతం వారి ముందున్న వ్యక్తివైపు మళ్లించే ప్రశ్నగా కూడా అర్థం చేసుకోవచ్చు.
  - marker: b
    text: పదశః, “రాజు జీవించుగాక!”
    reason: ‘చిరకాలం’ అనేది జస్సివ్ అభినందన భావాన్ని సహజ తెలుగులో వ్యక్తం చేయడానికి చేర్చిన మాట.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַרְּאִיתֶם
  choice: చూశారా?
  rationale: ఇది రూపరీత్యా ద్వితీయ పురుష బహువచన పర్ఫెక్ట్. సౌలును ప్రజల ముందు చూపిస్తున్న సందర్భంలో ‘చూశారా?’ అనేది సహజమైన దృష్టి ఆకర్షణ ప్రశ్న; వర్తమాన భావంలోని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר בָּחַר בּוֹ יְהוָה
  choice: యాహ్వే ఎన్నుకున్నవాణ్ణి
  rationale: సంబంధ వాక్యం సౌలును గుర్తిస్తుంది. తెలుగులో ‘ఎన్నుకున్నవాణ్ణి’ సంక్షిప్తంగా, సహజంగా ఉండి పూర్తయిన ఎంపికకు ప్రస్తుత ప్రాముఖ్యతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని వ్యక్తిగత నామరూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: כִּי אֵין כָּמֹהוּ
  choice: అతనిలాంటి వాడు మరొకడు లేడు
  rationale: כִּי ఇక్కడ వివరణాత్మకంగా లేదా ఉద్ఘాటనాత్మకంగా పనిచేయవచ్చు. తెలుగులో ప్రత్యేక సంధానపదాన్ని బలవంతంగా చేర్చకుండా, వెంట వచ్చే వాక్యమే ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּכָל הָעָם
  choice: ప్రజలందరిలో
  rationale: సమకూడిన ప్రజల మధ్య పోలికను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּרִעוּ
  choice: బిగ్గరగా కేకవేస్తూ
  rationale: ఈ క్రియ పెద్దగా విజయధ్వని లేదా కేక వేయడాన్ని సూచిస్తుంది. ‘బిగ్గరగా కేకవేస్తూ’ స్వరపూర్వక సామూహిక ప్రకటనను చూపుతుంది; ‘హర్షధ్వానాలు చేశారు’ అనే మరింత వ్యాఖ్యానాత్మక భావాన్ని రుద్దదు.
- source_word: יְחִי הַמֶּלֶךְ
  choice: రాజు చిరకాలం జీవించుగాక!
  rationale: జస్సివ్ రూపం రాజు జీవించాలని కోరే సామూహిక అభినందన. ‘చిరకాలం’ అనేది తెలుగులో ఆచారబద్ధమైన, సహజమైన సమానార్థక వ్యక్తీకరణ; పదశః రూపాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, Yahweh ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని నామాన్ని కాపాడుతుంది.
- issue: כִּי యొక్క సంబంధం
  choice: ప్రత్యేక సంధానపదం లేకుండా వివరణాత్మక వాక్యం
  alternative: ‘ఎందుకంటే’ లేదా ‘నిజంగా’ అని ప్రారంభించడం
  rationale: כִּי కారణార్థకంగానూ ఉద్ఘాటనాత్మకంగానూ అర్థమవవచ్చు. సందర్భంలో రెండవ వాక్యం మొదటి ప్రశ్నకు వివరణ ఇస్తుంది; తెలుగులో సంధానపదం లేకుండానే ఆ సంబంధం స్పష్టంగా ఉండి, ఒకే అర్థాన్ని అతిగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఎన్నుకున్నవాణ్ణి’ వంటి రూపం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచాం; రాజాభినందనలో మాత్రం సందర్భానికి తగిన గంభీరతను నిలిపాం.
