id: 1SA.10.1
reference: 1 Samuel 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת פַּ֥ךְ הַ/שֶּׁ֛מֶן וַ/יִּצֹ֥ק עַל רֹאשׁ֖/וֹ וַ/יִּשָּׁקֵ֑/הוּ וַ/יֹּ֕אמֶר הֲ/ל֗וֹא כִּֽי מְשָׁחֲ/ךָ֧ יְהוָ֛ה עַל נַחֲלָת֖/וֹ לְ/נָגִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
translation:
  language: te
  text: అప్పుడు సమూయేలు నూనె పాత్రను తీసుకొని, అతని తలపై నూనె పోసి అతనిని ముద్దుపెట్టి, “యాహ్వే నిన్ను తన స్వాస్థ్యానికి పాలకునిగా[a] అభిషేకించలేదా?” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పాలకుడు” అనే పదాన్ని “నాయకుడు” లేదా “అధిపతి” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం పాలించడానికి నియమించబడిన వ్యక్తిని సూచిస్తుంది; అది “రాజు” అనే బిరుదుతో అర్థంలో పూర్తిగా సమానం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  choice: నూనె ఉన్న చిన్న పాత్ర
  rationale: פַּךְ అనేది నూనె ఉంచే చిన్న పాత్రను సూచిస్తుంది. నిర్దిష్టంగా సీసా లేదా కుండ అని ఊహించకుండా, ఆధునిక పాఠకులకు సహజంగా అర్థమయ్యేలా అనువదించబడింది.
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  choice: సౌలు తలపై నూనె పోశాడు
  rationale: יצק అనే క్రియలోని ‘పోయడం’ అనే ప్రత్యక్ష అర్థాన్ని నిలుపుతూ, తెలుగులో సర్వనామ సందిగ్ధత రాకుండా సందర్భంలోని సౌలు పేరును ఉపయోగించాం.
- source_word: וַיִּשָּׁקֵהוּ
  choice: అతనిని ముద్దుపెట్టుకొని
  rationale: נשׁק ఇక్కడ స్పష్టంగా ‘ముద్దుపెట్టు’ అని అర్థం; ఆ నియామక సందర్భంలోని సంకేతాత్మక చర్యను మృదూకరించకుండా నిలిపాం.
- source_word: הֲלוֹא כִּי
  choice: అభిషేకించలేదా?
  rationale: ఈ నిర్మాణం ధృవీకరణను ఆశించే అలంకారిక ప్రశ్న. తెలుగు ప్రశ్నార్థక రూపం దాని బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: מְשָׁחֲךָ
  choice: నిన్ను అభిషేకించలేదా
  rationale: משׁח యొక్క ఆచారపరమైన, అధికార నియామకానికి సంబంధించిన రెండు భావాలను ‘అభిషేకించు’ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: נַחֲלָתוֹ
  choice: తన స్వాస్థ్యం
  rationale: נַחֲלָה దేవునికి చెందిన, ఆయనకు కేటాయింపుగా ఉన్న ప్రజలను సూచించే నిబంధనాత్మక భావాన్ని ‘స్వాస్థ్యం’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לְנָגִיד
  choice: పాలకునిగా
  rationale: נָגִיד పాలించడానికి నియమించబడిన నాయకుడిని సూచిస్తుంది; దాన్ని ‘రాజు’గా మార్చకుండా, పాలనా అధికారాన్ని ‘పాలకుడు’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. కాబట్టి దాన్ని ఒక బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: రాజ నియామక సందర్భంలో נָגִיד అర్థం
  choice: పాలకుడు
  alternative: నాయకుడు / అధిపతి / రాజకుమారుడు
  rationale: ఈ పదం పాలనా బాధ్యతకు నియమించబడిన వ్యక్తిని సూచిస్తుంది గాని מֶלֶךְ (‘రాజు’) అనే అధికారిక బిరుదుతో పూర్తిగా సమానం కాదు. అందువల్ల ఆ భేదాన్ని నిలిపాం.
- issue: נַחֲלָתוֹ యొక్క సూచన
  choice: తన స్వాస్థ్యం
  alternative: తన ప్రజలు / తన వారసత్వం
  rationale: సందర్భంలో ఇది ఇశ్రాయేలును సూచించినప్పటికీ, మూలంలోని రూపకాన్ని వివరణాత్మకంగా విప్పకుండా అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస చర్యలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; భావక్రమం మారలేదు. ‘స్వాస్థ్యం’ అనే పదం కొంత శాస్త్రోచితమైనదైనా, మూలంలోని నిబంధనాత్మక రూపకాన్ని సంక్షిప్తంగా కాపాడుతుంది.
