source:
  edition: WLC
  text: וַ/יַּקְרֵ֣ב שְׁמוּאֵ֔ל אֵ֖ת כָּל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט בִּנְיָמִֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/020.yaml
  text: Then Samuel brought near all the tribes of Israel[a], and the tribe of Benjamin was taken.
translation:
  language: te
  text: అప్పుడు సమూయేలు ఇశ్రాయేలు గోత్రాలన్నిటినీ దగ్గరకు రప్పించాడు; బెన్యామీను గోత్రం పట్టుబడింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎంపికైంది.’ హెబ్రీ పదానికి అక్షరార్థం ‘పట్టుబడింది’; ఇక్కడ అది చీట్లు వేయడం ద్వారా జరిగిన ఎంపికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: దగ్గరకు రప్పించాడు
  rationale: קרב హిఫిల్ రూపం ‘దగ్గరకు తీసుకురావడం/రప్పించడం’ అనే భావాన్ని ఇస్తుంది. గోత్రాలను ఎంపిక ప్రక్రియలో ముందుకు తీసుకురావడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ మూలంలోని ‘దగ్గరకు’ అనే భావాన్ని నిలుపుతుంది.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటినీ
  rationale: כָּל యొక్క సమగ్ర పరిధినీ, సమాసబంధంలోని ‘ఇశ్రాయేలు గోత్రాలు’ అనే భావాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּלָּכֵד
  choice: పట్టుబడింది
  rationale: לכד నిఫాల్ రూపంలోని అక్షరార్థమైన ‘పట్టబడింది/పట్టుబడింది’ అనే రూపకాన్ని నిలుపుతుంది. సందర్భంలో ఇది చీట్ల ద్వారా ఎంపిక కావడాన్ని సూచించినా, ప్రధాన పాఠ్యంలోనే దానిని ‘ఎంపికైంది’గా మార్చి మూలంలోని రూపకాన్ని తొలగించలేదు.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: బెన్యామీను గోత్రం
  rationale: హెబ్రీ నామబంధాన్ని స్పష్టమైన, సహజమైన తెలుగు రూపంలో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘పట్టుబడింది’ అనే మూల రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భార్థాన్ని పాదసూచికలో వివరించాం.
