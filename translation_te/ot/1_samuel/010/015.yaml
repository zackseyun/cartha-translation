  yaml_path: translation/ot/1_samuel/010/015.yaml
  text: Then Saul’s uncle said[a], “Please tell me what Samuel said to you.”
translation:
  language: te
  text: అప్పుడు సౌలు మామయ్య, “సమూయేలు మీతో ఏమి చెప్పాడో దయచేసి నాకు చెప్పు” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీతో’ అనే పదం మూలభాషలో బహువచనం. సందర్భానుసారం ఇది సౌలును, అతని సేవకుణ్ణి సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమానుగత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: דּוֹד שָׁאוּל
  choice: సౌలు మామ
  rationale: ఈ బంధుత్వ సందర్భంలో דּוֹד అంటే ‘మామ’; తెలుగు వాడుకలో ‘సౌలు మామ’ సహజమైన నిర్మాణం.
- source_word: הַגִּידָה נָּא לִי
  choice: దయచేసి నాకు చెప్పు
  rationale: నגד హిఫిల్ ఆజ్ఞారూపం ‘చెప్పు/తెలియజేయు’ అనే భావాన్నిస్తుంది; נָא లోని మర్యాదపూర్వక అభ్యర్థనను ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: מָה
  choice: ఏమి
  rationale: ‘చెప్పు’ అనే క్రియకు సంబంధించిన ప్రశ్నార్థక కర్మవాక్యాన్ని ‘ఏమి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָמַר
  choice: చెప్పాడో
  rationale: אָמַר సాధారణంగా ‘చెప్పు/అను’; తెలుగు పరోక్ష ప్రశ్న నిర్మాణంలో ‘చెప్పాడో’ సహజంగా సరిపోతుంది.
- source_word: לָכֶם
  choice: మీ ఇద్దరితో
  rationale: ఇది రెండవ పురుష పుంలింగ బహువచనం. సందర్భంలో సౌలు, అతని సేవకుడు ఉద్దేశింపబడినందున తెలుగులో బహువచనాన్ని అస్పష్టంగా వదలకుండా ‘మీ ఇద్దరితో’ అని వ్యక్తం చేయడం సందర్భానుకూలం.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
