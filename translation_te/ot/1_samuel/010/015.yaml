translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంభాషణ సరళతను కాపాడుతూ, לָכֶם బహువచనాన్ని సందర్భానుసారంగా ప్రధాన పాఠ్యంలో స్పష్టపరచింది.
