revisions:
- from: ఇంతకుముందు అతన్ని ఎరిగిన వారందరూ, ఇదిగో, అతడు ప్రవక్తలతో కలిసి ప్రవచించడం చూశారు.[a] అప్పుడు ప్రజలు ఒకరితో ఒకరు, “కీషు కుమారునికి ఏమైంది? సౌలు కూడా ప్రవక్తలలో ఉన్నాడా?[b]” అని చెప్పుకున్నారు.
  to: అప్పుడు ఇంతకుముందు అతన్ని ఎరిగిన వారందరూ చూడగా, ఇదిగో, అతడు ప్రవక్తలతో కలిసి ప్రవచిస్తున్నాడు.[a] అప్పుడు ప్రజలు ఒకరితో ఒకరు, “కీషు కుమారునికి ఏమైంది? సౌలు కూడా ప్రవక్తలలో ఉన్నాడా?[b]” అని చెప్పుకున్నారు.
  rationale: The revision retains the Hebrew's vivid “saw, and behold” construction through “చూడగా, ఇదిగో,” represents the narrative continuation with a restrained “అప్పుడు,” and preserves the distinction between being with the prophets and being among them. The footnote wording has been clarified while retaining its lexical purpose.
