source:
  edition: WLC
  text: וַ/יְהִ֗י כָּל יֽוֹדְע/וֹ֙ מֵ/אִתְּמ֣וֹל שִׁלְשׁ֔וֹם וַ/יִּרְא֕וּ וְ/הִנֵּ֥ה עִם נְבִאִ֖ים נִבָּ֑א וַ/יֹּ֨אמֶר הָ/עָ֜ם אִ֣ישׁ אֶל רֵעֵ֗/הוּ מַה זֶּה֙ הָיָ֣ה לְ/בֶן קִ֔ישׁ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
translation:
  language: te
  text: అప్పుడు ఇంతకుముందు అతన్ని ఎరిగిన వారందరూ చూడగా, ఇదిగో, అతడు ప్రవక్తలతో కలిసి ప్రవచిస్తున్నాడు.[a] అప్పుడు ప్రజలు ఒకరితో ఒకరు, “కీషు కుమారునికి ఏమైంది? సౌలు కూడా ప్రవక్తలలో ఉన్నాడా?[b]” అని చెప్పుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిన్నటి నుంచీ మొన్నటి వరకు అతన్ని ఎరిగినవారు”; ఇది గతంలో అతనితో పరిచయం ఉన్నవారిని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సౌలు సైతం ప్రవక్తలలో ఉన్నాడా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  choice: ఇంతకుముందు అతన్ని ఎరిగిన
  rationale: ‘నిన్నటి నుంచీ మొన్నటి నుంచీ’ అనే అక్షరార్థ రూపం ఇక్కడ గతంలో పరిచయం ఉండటాన్ని తెలిపే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: וַיְהִי
  choice: వాక్య నిర్మాణంలో ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది హీబ్రూ కథన కొనసాగింపును సూచించే సూత్రప్రాయ రూపం. తెలుగులో ప్రత్యేకంగా ‘అది జరిగింది’ అని ఉంచితే వాక్యం బరువెక్కుతుంది; సంఘటనల క్రమమే దాని కథన విధిని తెలియజేస్తుంది.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: ఇదిగో ... చూశారు
  rationale: וְהִנֵּה కలిగించే ఆకస్మికతను, ఆశ్చర్యాన్ని ‘ఇదిగో’ నిలుపుతుంది; וַיִּרְאוּకు ‘చూశారు’ నేర అనువాదం.
- source_word: עִם נְבִאִים
  choice: ప్రవక్తలతో కలిసి
  rationale: עִם ప్రధానంగా ‘తో’ అని అర్థం. చివరి ప్రశ్నలోని בַּנְּבִיאִים (‘ప్రవక్తలలో’)తో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: נִבָּא
  choice: ప్రవచించడం
  rationale: ఇది కొనసాగుతున్న ప్రవక్తృత్వ కార్యాన్ని సూచిస్తుంది; సౌలు శాశ్వతంగా ప్రవక్త పదవిని పొందాడని చెప్పదు.
- source_word: הָעָם אִישׁ אֶל רֵעֵהוּ
  choice: ప్రజలు ఒకరితో ఒకరు ... చెప్పుకున్నారు
  rationale: హీబ్రూలోని పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగు నుడికారంతో వ్యక్తపరుస్తుంది.
- source_word: מַה זֶּה הָיָה לְבֶן קִישׁ
  choice: కీషు కుమారునికి ఏమైంది?
  rationale: సౌలులో కనిపించిన అనూహ్య మార్పుపట్ల ఆశ్చర్యాన్ని అదనపు వ్యాఖ్యానం లేకుండా సహజంగా తెలియజేస్తుంది.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  choice: సౌలు కూడా ప్రవక్తలలో ఉన్నాడా?
  rationale: הֲגַםలోని ‘కూడా/సైతం’ భావాన్ని ‘కూడా’ సహజంగా అందిస్తుంది; ప్రశ్నలోని ఆశ్చర్యం సందర్భం ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: సౌలు చేసిన ప్రవక్తృత్వ కార్యం శాశ్వత ప్రవక్త పదవిని సూచిస్తుందా?
  choice: అతడు ప్రవక్తలతో కలిసి ప్రవచించడం
  alternative: అతడు ప్రవక్తల మధ్య ప్రవక్తలా ప్రవర్తించడం / ప్రవక్తృత్వ పరవశంలో ఉండడం
  rationale: మూలపాఠం సౌలు ప్రవక్తృత్వ కార్యంలో పాల్గొన్నాడని చెబుతుంది; అతనికి శాశ్వతమైన ప్రవక్త పదవి లభించిందని గానీ, అది కేవలం పరవశ ప్రవర్తన మాత్రమేనని గానీ నిర్ణయించదు. అందువల్ల ఆ ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఎరిగిన’ అనే పదం ‘తెలిసిన’ కంటే వ్యక్తిగత పరిచయ భావాన్ని స్పష్టంగా ఇస్తూ, బైబిలు గద్యానికి తగిన గంభీరతను నిలుపుతుంది. మూలంలోని ‘తో’ మరియు ‘లో’ అనే సంబంధ భేదాలు కాపాడబడ్డాయి.
