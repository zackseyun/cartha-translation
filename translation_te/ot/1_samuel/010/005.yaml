id: 1SA.10.5
reference: 1 Samuel 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
translation:
  language: te
  text: ఆ తరువాత నీవు గిబయత్-హా-ఎలోహీమ్‌కు[a] వస్తావు; అక్కడ ఫిలిష్తీయుల సైనిక స్థావరం[b] ఉంది. నీవు అక్కడ ఆ పట్టణానికి చేరినప్పుడు, ఉన్నత స్థలం నుంచి దిగివస్తున్న ప్రవక్తల బృందం నీకు ఎదురవుతుంది. వారి ముందు హార్పు, చేతి డప్పు, వేణువు, లైర్ వాద్యాలు[c] ఉంటాయి; వారు ప్రవచిస్తూ ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుని కొండ’ / ‘దేవుని గిబయా.’ హీబ్రూ పదబంధాన్ని స్థలనామంగానైనా, ఆ ప్రదేశాన్ని వర్ణించే పేరుగానైనా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘ఫిలిష్తీయుల కావలి స్థానం’ లేదా ‘ఫిలిష్తీయుల అధికారులు.’ హీబ్రూ పదం సైనిక స్థావరాన్నైనా అధికారులనైనా సూచించవచ్చు; ఈ సందర్భం సైనిక స్థావరం అనే అర్థానికి మొగ్గు చూపుతుంది.
    reason: alternative_reading
  - marker: c
    text: ఈ ప్రాచీన వాద్యాలను ఖచ్చితంగా గుర్తించడం కష్టం. ‘హార్పు’ లూట్ తరహా తంతివాద్యం కావచ్చు; ‘వేణువు’ పైపు తరహా వాద్యం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  choice: గిబయత్-హా-ఎలోహీమ్
  rationale: ఈ నిర్మాణం ఇక్కడ స్థలనామంగా పనిచేసే అవకాశం ఎక్కువగా ఉన్నందున లిప్యంతరీకరించబడింది; దాని వర్ణనాత్మక అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: נְצִבֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల సైనిక స్థావరం
  rationale: נְצִיב అనే పదానికి అధికారి లేదా నిలిపిన సైనిక స్థావరం అనే అర్థాలు ఉండవచ్చు. ఈ సందర్భంలో భౌగోళిక సూచన, తరువాతి కథనం సైనిక అర్థానికే మొగ్గు చూపుతాయి.
- source_word: וִיהִי כְבֹאֲךָ שָׁם הָעִיר
  choice: నీవు అక్కడి పట్టణంలోకి ప్రవేశించేటప్పుడు
  rationale: హీబ్రూ కాలసూచక కథన నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, שָׁם మరియు הָעִיר రెండింటి భావాన్నీ నిలిపింది.
- source_word: וּפָגַעְתָּ
  choice: నీకు ఎదురవుతుంది
  rationale: ఈ సందర్భంలో פגע అనుకోకుండా ఎదురుపడటం లేదా కలుసుకోవటం అనే భావాన్ని ఇస్తుంది.
- source_word: חֶבֶל נְבִיאִים
  choice: ప్రవక్తల బృందం
  rationale: חבל ఇక్కడ కలిసి ప్రయాణిస్తున్న సమూహం లేదా బృందాన్ని సూచిస్తుంది.
- source_word: יֹרְדִים מֵהַבָּמָה
  choice: ఉన్నత స్థలం నుంచి దిగివస్తున్న
  rationale: במה ఆరాధనకు సంబంధించిన ఎత్తైన స్థలాన్ని సూచిస్తుంది. 'ఉన్నత స్థలం' మూలపదానికి పారదర్శకంగా ఉండి, దానిని కేవలం ఆలయంగా పరిమితం చేయదు.
- source_word: נֵבֶל
  choice: హార్పు
  rationale: ప్రాచీన తంతివాద్యపు ఖచ్చితమైన రూపం అనిశ్చితమైనప్పటికీ, పరిచితమైన సమీప పదంగా 'హార్పు' వాడబడింది; అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: תֹף
  choice: చేతి డప్పు
  rationale: చేతితో పట్టుకొని వాయించే తాళవాద్యాన్ని సూచించే సులభమైన, సాధారణ తెలుగు పదబంధం.
- source_word: חָלִיל
  choice: వేణువు
  rationale: గాలితో వాయించే వాద్యాన్ని సహజమైన తెలుగులో సూచిస్తుంది; అది పైపు తరహా వాద్యమై ఉండవచ్చు.
- source_word: כִּנּוֹר
  choice: లైర్
  rationale: נֵבֶל నుంచి వేరైన ప్రాచీన తంతివాద్యంగా గుర్తించేందుకు 'లైర్' వాడబడింది.
- source_word: וְהֵמָּה מִתְנַבְּאִים
  choice: ఆ ప్రవక్తలు ప్రవచిస్తూ ఉంటారు
  rationale: నిర్దిష్టమైన పారవశ్య ప్రవర్తనను లేదా సంగీత స్తుతిని చేర్చకుండా, ప్రవచన కార్యాన్ని తెలిపే మూలక్రియతో సంబంధాన్ని నిలిపింది.
theological_decisions:
- issue: מִתְנַבְּאִים సూచించే ప్రవచన కార్య స్వభావం
  choice: '''ప్రవచిస్తూ ఉంటారు'' అని విస్తృతంగా అనువదించడం'
  alternative: పారవశ్య స్థితిలో ప్రవక్తల్లా ప్రవర్తించడం; దైవప్రేరణతో సంగీత స్తుతి చేయడం
  rationale: క్రియ ప్రవచన కార్యాన్ని స్పష్టంగా సూచిస్తుంది, కానీ దాని బాహ్య రూపాన్ని ఖచ్చితంగా నిర్ధారించదు. అందువల్ల మూలంలోని ధార్మిక, అనుభవాత్మక విస్తృతిని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. అరుదైన ప్రాచీన వాద్యాలకు అందుబాటులో ఉన్న ఆధునిక సమీప పదాలు ఉపయోగించి, వాటి అనిశ్చితిని పాదసూచికలో నిలిపాం. స్థలనామంలోని నిజమైన ద్వంద్వార్థం, ప్రవచన కార్య స్వభావంలోని తెరచిన భావం పరిష్కరించకుండా ఉంచబడ్డాయి.
