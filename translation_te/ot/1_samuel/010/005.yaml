revisions:
- from: ఆ తరువాత నీవు గిబయత్-హా-ఎలోహీమ్‌కు[a] వస్తావు; అక్కడ ఫిలిష్తీయుల సైనిక స్థావరం[b] ఉంది. నీవు అక్కడి పట్టణంలోకి ప్రవేశించేటప్పుడు, ఉన్నత స్థలం నుంచి దిగివస్తున్న ప్రవక్తల బృందం నీకు ఎదురవుతుంది. వారి ముందు హార్పు, చేతి డప్పు, వేణువు, లైర్ వాయించేవారు[c] వస్తుంటారు; ఆ ప్రవక్తలు ప్రవచిస్తూ ఉంటారు.
  to: ఆ తరువాత నీవు గిబయత్-హా-ఎలోహీమ్‌కు[a] వస్తావు; అక్కడ ఫిలిష్తీయుల సైనిక స్థావరం[b] ఉంది. నీవు అక్కడ ఆ పట్టణానికి చేరినప్పుడు, ఉన్నత స్థలం నుంచి దిగివస్తున్న ప్రవక్తల బృందం నీకు ఎదురవుతుంది. వారి ముందు హార్పు, చేతి డప్పు, వేణువు, లైర్ వాద్యాలు[c] ఉంటాయి; వారు ప్రవచిస్తూ ఉంటారు.
