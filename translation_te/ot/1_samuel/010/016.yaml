source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל דּוֹד֔/וֹ הַגֵּ֤ד הִגִּיד֙ לָ֔/נוּ כִּ֥י נִמְצְא֖וּ הָ/אֲתֹנ֑וֹת וְ/אֶת דְּבַ֤ר הַ/מְּלוּכָה֙ לֹֽא הִגִּ֣יד ל֔/וֹ אֲשֶׁ֖ר אָמַ֥ר שְׁמוּאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
translation:
  language: te
  text: సౌలు తన మామయ్యతో, “గాడిదలు దొరికాయని ఆయన మాకు స్పష్టంగా చెప్పాడు” అన్నాడు. అయితే సమూయేలు చెప్పిన రాజత్వపు సంగతి మాత్రం అతనికి తెలియజేయలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజ్యపు సంగతి.” ఇక్కడ హీబ్రూ పదం ఒక రాజ్యభూభాగం కంటే సౌలు పొందబోయే రాజత్వాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: తన పినతండ్రితో
  rationale: ఈ కథన సందర్భంలో דּוֹד బంధుత్వాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పినతండ్రి’ సహజమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: הַגֵּד הִגִּיד
  choice: స్పష్టంగా చెప్పాడు
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే ఉద్ఘాటనను సహజ తెలుగులో ‘స్పష్టంగా’ ద్వారా వ్యక్తం చేసింది.
- source_word: נִמְצְאוּ
  choice: దొరికాయని
  rationale: జంతువులు కనుగొనబడ్డాయని తెలిపే సందర్భార్థాన్ని సహజమైన తెలుగు పరోక్ష వచనంలో అందిస్తుంది.
- source_word: הָאֲתֹנוֹת
  choice: గాడిదలు
  rationale: హీబ్రూలో ఆడ గాడిదలు అని నిర్దిష్టంగా ఉన్నా, వాటి లింగం ఇక్కడ కథనానికి ముఖ్యంకాదు; సాధారణ తెలుగు వాడుకలో ‘గాడిదలు’ సహజం.
- source_word: דְּבַר הַמְּלוּכָה
  choice: రాజత్వపు సంగతి
  rationale: דָּבָר ఇక్కడ విషయం/సంగతి; מְלוּכָה ఈ సందర్భంలో రాజ్యం అనే భూభాగం కంటే సౌలుకు సంబంధించిన రాజత్వం లేదా రాజపదవిని సూచిస్తుంది.
- source_word: לֹא הִגִּיד לוֹ
  choice: అతనికి తెలియజేయలేదు
  rationale: నివేదికాత్మక వాక్యంలో נגד హిఫిల్ భావాన్ని సహజంగా అందిస్తూ, కర్త సౌలేనని నిలుపుతుంది.
- source_word: אֲשֶׁר אָמַר שְׁמוּאֵל
  choice: సమూయేలు చెప్పిన
  rationale: సంబంధవాచక ఉపవాక్యాన్ని ‘రాజత్వపు సంగతి’తో నేరుగా అనుసంధానిస్తూ, మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
theological_decisions:
- issue: מְלוּכָה యొక్క భావం
  choice: రాజత్వం
  alternative: రాజ్యం
  rationale: సందర్భం సౌలుకు ప్రకటించబడిన రాజపదవి/రాజాధికారానికి సంబంధించినది; భూభాగంగా రాజ్యాన్ని ఉద్దేశించినట్లు నిర్బంధించకూడదు. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ఉద్ఘాటనను ‘స్పష్టంగా’తో నిలిపి, రాజత్వం/రాజ్యం అనే భావసంభావ్యతను పాదసూచికలో సంరక్షించాం.
