base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
translation:
  language: te
  text: కాని కొందరు నీచులు, “ఇతడు మనలను ఎలా రక్షిస్తాడు?” అన్నారు. వారు అతణ్ణి తృణీకరించి, అతనికి కానుక తీసుకురాలేదు. కాని అతడు మౌనంగా ఉన్నవానిలా ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు చెవిటివాడిలా ఉన్నాడు.” ఈ హెబ్రీ వ్యక్తీకరణ రెచ్చగొట్టే మాటల ఎదుట ఉద్దేశపూర్వకంగా మౌనంగా ఉండడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  choice: పనికిమాలినవారు
  rationale: ఈ హెబ్రీ నుడికారం అక్షరార్థంగా ‘పనికిమాలినతనపు కుమారులు’ అని ఉండి, నీచమైన లేదా దుష్ట స్వభావంగలవారిని సూచిస్తుంది. ‘పనికిమాలినవారు’ మూలంలోని విలువలేమి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מַה יֹּשִׁיעֵנוּ זֶה
  choice: ఇతడు మనలను ఎలా రక్షిస్తాడు?
  rationale: ప్రశ్నార్థకం మరియు ישׁע ధాతువు హిఫీల్ రూపం ఇక్కడ అనుమానంతో కూడిన సవాలును వ్యక్తం చేస్తాయి. ‘ఇతడు’ అనే పదం זֶהలోని తిరస్కార ధోరణిని సందర్భానుసారంగా నిలుపుతుంది.
- source_word: וַיִּבְזֻהוּ
  choice: వారు అతణ్ణి తృణీకరించి
  rationale: בזה అంటే ఒకరిని అల్పంగా చూడడం లేదా తిరస్కారంగా ఎంచడం. ‘తృణీకరించి’ కథనానికి తగిన సంక్షిప్తమైన, గంభీరమైన ప్రయోగం.
- source_word: מִנְחָה
  choice: కానుక
  rationale: రాజకీయ సందర్భంలో ఈ పదం పాలకునికి సమర్పించే బహుమతిని లేదా కప్పాన్ని సూచించవచ్చు; ఇది తప్పనిసరిగా ఆరాధనా అర్పణ కాదు. ‘కానుక’ మూలంలోని విస్తృత భావాన్ని అనవసరంగా పరిమితం చేయదు.
- source_word: כְּמַחֲרִישׁ
  choice: మౌనం వహిస్తున్నవాడిలా
  rationale: חרשׁ యొక్క ఈ రూపం ఇక్కడ మౌనంగా ఉండడాన్ని అత్యంత సహజంగా సూచిస్తుంది; כְּ ఉపసర్గ పోలికను తెలియజేస్తుంది. అందువల్ల సౌలు స్పందించకుండా ఉన్నాడనే భావంతో పాటు మూలంలోని ఉపమానం కూడా నిలుస్తుంది.
- source_word: וַיְהִי
  choice: అతడు ... ఉన్నాడు
  rationale: ఇక్కడ היה సౌలు కనబరచిన వైఖరిని పరిచయం చేస్తుంది. పోలికతో కూడిన వాక్యంలో ‘ఉన్నాడు’ సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: సౌలు స్పందించిన తీరును చిత్రించడం
  choice: అతడు అవమానాన్ని ఎదుర్కొన్నప్పుడు మౌనం వహించినవాడిలా ఉన్నాడు
  alternative: అతడు విననట్టుగా ఉన్నాడు
  rationale: כְּמַחֲרִישׁ అనే హెబ్రీ రూపాన్ని మౌనంగా ఉండడం అని లేదా విననట్టు ప్రవర్తించడం అని గ్రహించవచ్చు. ప్రధాన పాఠం ప్రత్యక్షమైన ‘మౌనం’ భావాన్ని, అలాగే పోలికను నిలుపుతుంది; పాదసూచిక ఉద్దేశపూర్వకంగా పట్టించుకోకపోవడం అనే సాధ్యమైన భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ప్రశ్నలోని తిరస్కార ధోరణిని, రాజసంబంధమైన కానుక యొక్క విస్తృత అర్థాన్ని, చివరి హెబ్రీ ఉపమానంలోని సందిగ్ధతను నిలిపాం.
