- from: అయితే కొందరు పనికిమాలినవారు, “ఇతడు మనలను ఎలా రక్షిస్తాడు?” అన్నారు. వారు అతణ్ణి తృణీకరించి, అతనికి కానుక తీసుకురాలేదు. అయితే అతడు మౌనం వహిస్తున్నవాడిలా ఉన్నాడు.[a]
