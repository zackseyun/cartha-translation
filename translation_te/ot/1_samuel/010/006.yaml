  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/צָלְחָ֤ה עָלֶ֨י/ךָ֙ ר֣וּחַ יְהוָ֔ה וְ/הִתְנַבִּ֖יתָ עִמָּ֑/ם וְ/נֶהְפַּכְתָּ֖ לְ/אִ֥ישׁ אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
translation:
  language: te
  text: అప్పుడు యెహోవా ఆత్మ నీ మీదికి బలంగా వస్తుంది[a], నీవు వారితో కలిసి ప్రవచిస్తావు, వేరొక మనిషిగా మారతావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మీదికి శక్తివంతంగా వస్తుంది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మరో మనిషిగా మార్చబడతావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָלְחָה עָלֶיךָ
  choice: నీ మీదికి శక్తితో వస్తాడు
  rationale: యెహోవా ఆత్మ కర్తగా ఉన్న సందర్భాల్లో צלח అనేది సాధారణ విజయం లేదా వృద్ధిని కాక, ఒకరిపై బలంగా ప్రభావం చూపుతూ రావడాన్ని సూచిస్తుంది. ఈ అనువాదం ఆ శక్తిమంతమైన రాకను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: רוּחַ יְהוָה
  choice: యెహోవా ఆత్మ
  rationale: רוּחַ ఇక్కడ గాలి లేదా ఊపిరిని కాక దేవుని ఆత్మను సూచిస్తుంది; יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וְהִתְנַבִּיתָ עִמָּם
  choice: నీవు వారితో కలిసి ప్రవచిస్తావు
  rationale: נבא హిత్పయేల్ రూపం ఇక్కడ ప్రవక్తల సమూహంతో కలిసి ప్రవచన క్రియలో పాల్గొనడాన్ని సూచిస్తుంది. ‘కలిసి’ అనేది עִמָּם లోని సహవాస భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְנֶהְפַּכְתָּ
  choice: మారిపోతావు
  rationale: הפך నిఫాల్ రూపం స్థితిలో సంభవించే మార్పును సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘మారిపోతావు’ ఫలితస్థితిని స్పష్టంగా ఉంచుతుంది; ఆ మార్పు స్వరూపాన్ని అతిగా నిర్వచించదు.
- source_word: לְאִישׁ אַחֵר
  choice: వేరొక మనిషిగా
  rationale: אִישׁ యొక్క పురుష ఏకవచన భావాన్ని ‘మనిషి’గా నిలిపి, אַחֵר సూచించే భిన్నత్వాన్ని ‘వేరొక’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: సౌలులో కలిగే మార్పు స్వరూపం
  choice: ఆత్మ ప్రభావంతో సౌలు నిజంగా ‘వేరొక మనిషిగా’ మారుతాడని మాత్రమే అనువదించి, ఆ మార్పు పరిమాణం లేదా శాశ్వతత్వాన్ని నిర్వచించలేదు.
  alternative: ఇది కేవలం బాహ్య ప్రవచనావేశమని లేదా సంపూర్ణ అంతరంగ ఆధ్యాత్మిక పునరుద్ధరణ అని స్పష్టీకరించడం.
  rationale: హీబ్రూ పాఠ్యం సౌలు ప్రవచిస్తాడనీ, వేరొక మనిషిగా మారుతాడనీ చెబుతుంది; అయితే ఆ మార్పు నైతికమా, ఆధ్యాత్మికమా, తాత్కాలికమా, శాశ్వతమా అనేది నిర్దిష్టంగా చెప్పదు. అందువల్ల ఆ వేదాంతపరమైన ఉద్రిక్తతను అనువాదంలో అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. ప్రవచన వాక్యంలోని వరుస క్రియలను స్పష్టంగా చూపేందుకు రెండు వాక్యాలుగా విభజించాం. దైవనామాన్ని ‘యెహోవా’గా ఉంచాం; సౌలు పొందే మార్పును తరువాతి సిద్ధాంత వర్గాలతో నిర్వచించలేదు.
