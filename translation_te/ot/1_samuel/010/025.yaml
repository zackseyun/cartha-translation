  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר שְׁמוּאֵ֜ל אֶל הָ/עָ֗ם אֵ֚ת מִשְׁפַּ֣ט הַ/מְּלֻכָ֔ה וַ/יִּכְתֹּ֣ב בַּ/סֵּ֔פֶר וַ/יַּנַּ֖ח לִ/פְנֵ֣י יְהוָ֑ה וַ/יְשַׁלַּ֧ח שְׁמוּאֵ֛ל אֶת כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
translation:
  language: te
  text: అప్పుడు సమూయేలు రాజరిక నియమావళిని[a] ప్రజలకు చెప్పాడు. దానిని ఆ గ్రంథంలో రాసి యాహ్వే సన్నిధిలో ఉంచాడు. తరువాత సమూయేలు ప్రజలందరినీ పంపివేశాడు; ప్రతి మనిషీ తన ఇంటికి వెళ్లాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజరికపు హక్కులు, విధులు”; లేదా, “రాజరిక ఆచారపద్ధతి.” హీబ్రూ పదబంధం రాజరిక పాలనకు సంబంధించిన చట్టనిబంధనలను లేదా స్థిరపడ్డ విధానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా, “ప్రతి మనిషి తన ఇంటికి.” అంటే ప్రజలు తమ తమ ఇళ్లకు విడివిడిగా వెళ్లారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: వివరించాడు
  rationale: దేనినో ప్రజలతో చెప్పడం అనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం ‘మాట్లాడాడు’ కంటే తరువాత వచ్చే విషయవస్తువుతో బాగా సరిపోతుంది.
- source_word: מִשְׁפַּט הַמְּלֻכָה
  choice: రాజరిక నియమావళి
  rationale: מִשְׁפַּט ఇక్కడ హక్కు, విధి, శాసనం లేదా స్థిరపడ్డ పద్ధతి అనే అర్థాలను కలిగి ఉండవచ్చు. ‘నియమావళి’ రాజరిక వ్యవస్థకు సంబంధించిన నియంత్రక నిబంధనల భావాన్ని ఇస్తూ, ఒక్క వివరణకే పరిమితం చేయదు.
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  choice: దానిని ఆ గ్రంథంలో రాసి
  rationale: ముందు చెప్పిన రాజరిక నియమావళిని ఏకవచన సమగ్ర విషయంగా సూచిస్తుంది. בַּסֵּפֶר లోని నిర్దిష్టతను ‘ఆ గ్రంథంలో’ నిలుపుతుంది; గ్రంథపు భౌతిక రూపాన్ని ‘చుట్ట’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: וַיַּנַּח לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో ఉంచాడు
  rationale: లిఖిత పత్రాన్ని దేవుని సమక్షంలో ఉంచిన భావాన్ని సహజంగా, ఆరాధనా సందర్భానికి తగినట్లుగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: וַיְשַׁלַּח
  choice: పంపివేశాడు
  rationale: ఇక్కడ కార్యనిమిత్తం పంపడం కంటే సభ ముగిసిన తరువాత వెళ్లనివ్వడం లేదా పంపివేయడం అనే సందర్భార్థం ఉంది.
- source_word: אִישׁ לְבֵיתוֹ
  choice: ప్రతి మనిషీ తన ఇంటికి వెళ్లాడు
  rationale: హీబ్రూ ఏకవచన పుంలింగ విభజనాత్మక ప్రయోగాన్ని నిలుపుతూ, తెలుగులో వాక్యాన్ని సంపూర్ణంగా, సహజంగా చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: מִשְׁפַּט הַמְּלֻכָה యొక్క పరిధి
  choice: రాజరిక నియమావళి
  alternative: రాజరికపు హక్కులు, విధులు / రాజరిక ఆచారపద్ధతి
  rationale: ఈ పదబంధం రాజరికానికి సంబంధించిన చట్టబద్ధ హక్కులు, బాధ్యతలు, లేదా స్థిరపడ్డ విధానాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో ‘నియమావళి’ని వాడి ఈ అర్థ పరిధిని తెరిచి ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
- issue: אִישׁ לְבֵיתוֹ లోని పుంలింగ విభజనాత్మక రూపం
  choice: ప్రతి మనిషీ తన ఇంటికి వెళ్లాడు
  alternative: ప్రతి ఒక్కరూ తమ తమ ఇళ్లకు వెళ్లారు
  rationale: మూలంలోని వ్యాకరణ పుంలింగ ఏకవచన రూపాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; ఇది ప్రజలు తమ తమ గృహాలకు విడివిడిగా వెళ్లారనే విభజనాత్మక భావాన్ని కలిగి ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘రాజరికం,’ ‘నియమావళి,’ ‘సన్నిధి’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, చారిత్రక-ఆరాధనా సందర్భ గంభీరతను నిలుపుతాయి. వాక్య నిర్మాణం హీబ్రూ సంఘటనల క్రమాన్ని అనుసరిస్తూనే తెలుగులో సులభంగా చదవబడేలా రూపొందించబడింది.
