source:
  edition: WLC
  text: וַ/יַּ֨עַן אִ֥ישׁ מִ/שָּׁ֛ם וַ/יֹּ֖אמֶר וּ/מִ֣י אֲבִי/הֶ֑ם עַל כֵּן֙ הָיְתָ֣ה לְ/מָשָׁ֔ל הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
translation:
  language: te
  text: 'అప్పుడు అక్కడివాడైన ఒకడు ఇలా జవాబిచ్చాడు[a]: “మరి వారి తండ్రి ఎవరు?” అందుచేత, “సౌలు కూడా ప్రవక్తలలో ఉన్నాడా?” అనేది ఒక సామెతగా మారింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని తండ్రి ఎవరు?” కొన్ని అనువాదాలు ఈ ప్రశ్న ప్రత్యేకంగా సౌలును సూచిస్తుందని గ్రహిస్తాయి; అయితే మసొరెటిక్ పాఠంలో “వారి తండ్రి” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: కథన సందర్భంలో ענה ప్రతిస్పందనను పరిచయం చేస్తుంది; ‘జవాబిచ్చాడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: אִישׁ מִשָּׁם
  choice: అక్కడివాడైన ఒకడు
  rationale: పేరు చెప్పని స్థానిక పురుషుణ్ణి సూచించే אִישׁ מִשָּׁם భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וּמִי אֲבִיהֶם
  choice: మరి వారి తండ్రి ఎవరు?
  rationale: మసొరెటిక్ పాఠంలోని మూడవ పురుష బహువచన ప్రత్యయం ‘వారి’గా నిలుపబడింది; ‘మరి’ ప్రశ్నలోని ప్రతిస్పందనాత్మక భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: తదనంతర సామెత ఏర్పడటానికి కారణం లేదా ఫలితాన్ని సూచించే అనుసంధానాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הָיְתָה לְמָשָׁל
  choice: ఒక సామెతగా మారింది
  rationale: מָשָׁל ఇక్కడ ఉపమానకథ కాక, ప్రజల్లో ప్రాచుర్యం పొందిన సామెత లేదా నానుడిని సూచిస్తుంది.
- source_word: הֲגַם
  choice: కూడా ... ఉన్నాడా?
  rationale: ప్రశ్నార్థక ה మరియు גם కలయికలోని ఆశ్చర్యంతో కూడిన చేర్పును తెలుగు ప్రశ్న నిర్మాణంలో నిలుపుతుంది.
- source_word: בַּנְּבִאִים
  choice: ప్రవక్తలలో
  rationale: בְּ ఇక్కడ ఒక సమూహంలో భాగంగా ఉండటాన్ని సూచిస్తుంది; ‘ప్రవక్తలలో’ ఆ భావాన్ని నేరుగా అందిస్తుంది.
theological_decisions:
- issue: ‘వారి తండ్రి’ అనే ప్రశ్నలో సర్వనామ ప్రత్యయ సూచన
  choice: మసొరెటిక్ పాఠంలోని బహువచనాన్ని నిలుపుతూ ‘వారి తండ్రి’ అని అనువదించడం
  alternative: సౌలును మాత్రమే సూచిస్తున్నట్లుగా ‘అతని తండ్రి’ అని అనువదించడం
  rationale: హీబ్రూ రూపం బహువచన ప్రత్యయాన్ని కలిగి ఉంది. ఇది ప్రవక్తల సమూహాన్ని సూచించి, ప్రవచన కార్యం వంశపారంపర్యంపై ఆధారపడదనే సందర్భార్థానికి వీలు కల్పిస్తుంది. ఏకవచన అన్వయాన్ని ప్రధాన పాఠంలోకి తేవకుండా పాదసూచికలో ఉంచడం మూలపాఠ ప్రాధాన్యాన్నీ, వ్యాఖ్యాన భేదాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రద/post? లేదు; సాధారణ పాఠకులకు అర్థమయ్యే కథన శైలి ఉపయోగించబడింది. ‘ప్రవక్తలలో’ మరియు ‘సామెతగా మారింది’ వంటి పదబంధాలు మూలపాఠ నిర్మాణానికి దగ్గరగా ఉంటూనే తెలుగులో సహజంగా ఉన్నాయి. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో చేర్చబడింది.
