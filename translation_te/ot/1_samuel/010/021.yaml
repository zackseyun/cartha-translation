translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గోత్రం → వంశం → వ్యక్తి అనే క్రమాన్ని స్పష్టంగా ఉంచాం. చీటి ప్రక్రియను ప్రధాన వాక్యంలో అదనంగా చేర్చకుండా, לכד క్రియ యొక్క సందర్భార్థాన్ని పాదటిప్పణిలో వివరించాం.
