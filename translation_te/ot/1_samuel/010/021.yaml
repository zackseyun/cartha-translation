source:
  edition: WLC
  text: וַ/יַּקְרֵ֞ב אֶת שֵׁ֤בֶט בִּנְיָמִן֙ ל/משפחת/ו וַ/תִּלָּכֵ֖ד מִשְׁפַּ֣חַת הַ/מַּטְרִ֑י וַ/יִּלָּכֵד֙ שָׁא֣וּל בֶּן קִ֔ישׁ וַ/יְבַקְשֻׁ֖/הוּ וְ/לֹ֥א נִמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
translation:
  language: te
  text: తరువాత అతడు బెన్యామీను గోత్రాన్ని దాని వంశాలవారీగా[a] దగ్గరకు రప్పించాడు. మత్రియుల వంశం ఎంపికైంది[b]. ఆ తరువాత కీషు కుమారుడైన సౌలు ఎంపికయ్యాడు. అయితే వారు అతని కోసం వెదికినప్పుడు అతడు కనబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం గోత్రంలోని విస్తృత కుటుంబ సమూహాలను, అంటే వంశాలను లేదా కుటుంబాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఎంపికైంది’ అని అనువదించిన హీబ్రూ క్రియకు అక్షరార్థంగా ‘పట్టుబడింది’ అనే భావం కూడా ఉంటుంది. ఈ సందర్భంలో అది చీటి ద్వారా సూచించబడడాన్ని తెలియజేస్తుంది; యుద్ధంలో పట్టుబడడాన్ని కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: దగ్గరకు రప్పించాడు
  rationale: హిఫీల్ రూపంలోని קרב కు ‘దగ్గరకు తీసుకురావడం/రప్పించడం’ అనే అర్థం ఉంది. చీటి ద్వారా ఎంపిక చేసే ప్రక్రియలో సమూహాన్ని సమక్షానికి రప్పించిన భావాన్ని ఇది నిలుపుతుంది.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: బెన్యామీను గోత్రం
  rationale: ఇశ్రాయేలు సామాజిక వ్యవస్థలో שֵׁבֶט ను సహజంగా ‘గోత్రం’ అని అనువదించాం; బెన్యామీను అనే పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: దాని వంశాలవారీగా
  rationale: מִשְׁפָּחָה ఇక్కడ గోత్రంలోని విస్తృత కుటుంబ సమూహాన్ని సూచిస్తుంది. ‘వంశాలవారీగా’ అనేది విభాగాల చొప్పున ముందుకు రప్పించిన విధానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַתִּלָּכֵד / וַיִּלָּכֵד
  choice: ఎంపికైంది / ఎంపికయ్యాడు
  rationale: לכד నిఫాల్ రూపం సాధారణంగా ‘పట్టుబడడం’ అని అర్థమివ్వగలిగినా, ఈ సందర్భంలో చీటి ద్వారా సూచించబడడం లేదా ఎంపిక కావడం అనే సాంకేతిక భావంలో ఉంది. అపార్థం కలిగించే ‘పట్టుబడింది’ కంటే ‘ఎంపికైంది’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది; రెండు చోట్ల ఒకే క్రియకు సుసంగతమైన పదప్రయోగం ఉంచాం.
- source_word: מִשְׁפַּחַת הַמַּטְרִי
  choice: మత్రి వంశం
  rationale: הַמַּטְרִי అనే సమూహనామాన్ని ‘మత్రి’గా లిప్యంతరీకరించి, מִשְׁפָּחָה కు సందర్భానుగుణంగా ‘వంశం’ వాడాం.
- source_word: שָׁאוּל בֶּן־קִישׁ
  choice: కీషు కుమారుడైన సౌలు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందించాం.
- source_word: וַיְבַקְשֻׁהוּ
  choice: వారు అతని కోసం వెదికినప్పుడు
  rationale: בקשׁ అంటే వెదకడం లేదా అన్వేషించడం. తరువాతి ఫలితంతో ఉన్న కాలసంబంధాన్ని తెలుగులో సహజంగా చూపడానికి ‘వెదికినప్పుడు’ అని ఇచ్చాం.
- source_word: וְלֹא נִמְצָא
  choice: అతడు కనిపించలేదు
  rationale: מצא నిఫాల్ రూపంలోని ‘కనబడలేదు/దొరకలేదు’ అనే భావాన్ని ‘కనిపించలేదు’ సహజంగా తెలియజేస్తుంది; విజయవంతంగా కనుగొనలేకపోయారనే భావం సందర్భంలో స్పష్టంగా ఉంటుంది.
