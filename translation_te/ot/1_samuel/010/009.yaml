  text: וְ/הָיָ֗ה כְּ/הַפְנֹת֤/וֹ שִׁכְמ/וֹ֙ לָ/לֶ֨כֶת֙ מֵ/עִ֣ם שְׁמוּאֵ֔ל וַ/יַּהֲפָךְ ל֥/וֹ אֱלֹהִ֖ים לֵ֣ב אַחֵ֑ר וַ/יָּבֹ֛אוּ כָּל הָ/אֹת֥וֹת הָ/אֵ֖לֶּה בַּ/יּ֥וֹם הַ/הֽוּא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
translation:
  language: te
  text: అతడు సమూయేలు దగ్గర నుండి వెళ్లడానికి వెనుదిరిగినప్పుడు[a], దేవుడు అతనికి వేరొక హృదయాన్ని ఇచ్చాడు[b]. ఆ సూచనలన్నీ ఆ రోజే జరిగాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అతడు తన భుజాన్ని తిప్పినప్పుడు.’ ఇది అక్కడి నుంచి బయలుదేరడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుడు అతనికి వేరొక హృదయాన్ని మార్చాడు.’ హీబ్రూ పదబంధం అక్షరార్థంగా, ‘దేవుడు అతనికి వేరొక హృదయాన్ని మార్చాడు’ అని ఉంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: వాక్య నిర్మాణంలో ‘జరిగింది’ అనే భావం
  rationale: హీబ్రూ కథన సూత్రాన్ని తెలుగులో విడిగా ‘అది జరిగింది’ అని పెట్టడం అసహజంగా ఉంటుంది; ప్రధాన సంఘటనను సహజమైన కాలవాక్య నిర్మాణంలో వ్యక్తం చేశాం.
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  choice: వెనుదిరిగినప్పుడు
  rationale: అక్షరార్థంగా ‘తన భుజాన్ని తిప్పినప్పుడు’; ఇది బయలుదేరడాన్ని సూచించే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో ‘వెనుదిరిగినప్పుడు’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: לָלֶכֶת מֵעִם שְׁמוּאֵל
  choice: సమూయేలు దగ్గరనుంచి వెళ్లడానికి
  rationale: వెళ్లడం మరియు సమూయేలు సమక్షం నుంచి దూరమవడం అనే రెండు అంశాలనూ స్పష్టంగా నిలుపుతుంది.
- source_word: וַיַּהֲפָךְ
  choice: కలిగించాడు
  rationale: హీబ్రూ క్రియలోని మార్చడం/తిప్పడం అనే దైవకార్య భావాన్ని, ‘వేరొక హృదయం’తో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఏకవచన క్రియతో ఉన్న ఈ రూపం ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది.
- source_word: לֵב אַחֵר
  choice: వేరొక హృదయం
  rationale: ‘కొత్త హృదయం’ అని అనువదించి తరువాతి నిబంధనాత్మక లేదా పునర్జన్మ సంబంధ భావాలను ముందుగానే చేర్చకుండా, మూలంలోని ‘మరో/వేరొక హృదయం’ అనే అనిశ్చితిని నిలుపుతుంది.
- source_word: וַיָּבֹאוּ כָּל הָאֹתוֹת הָאֵלֶּה
  choice: ఆ సూచనలన్నీ జరిగాయి
  rationale: సూచనలు సంభవించాయని తెలుగులో సహజంగా చెబుతుంది; ‘నెరవేరాయి’ అనే అదనపు వ్యాఖ్యాన బరువును చేర్చదు.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజే
  rationale: అదే రోజున అవన్నీ సంభవించాయని సందర్భంలోని కాల ప్రాధాన్యాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సౌలు పొందిన అంతర్గత మార్పు స్వభావం
  choice: దేవుడు అతనిలో ‘వేరొక హృదయాన్ని’ కలిగించాడని చెప్పడం
  alternative: దేవుడు అతనికి కొత్త హృదయాన్ని ఇచ్చాడు; దేవుడు అతని స్వభావాన్ని పూర్తిగా మార్చాడు; రాజుగా ఉండేందుకు ధైర్యం ఇచ్చాడు
  rationale: మూలపాఠం నిజమైన దైవిక అంతర్గత మార్పును చెబుతుంది; అయితే అది పునర్జన్మనా, మారుమనస్సా, రాజ్యపాలనకు తగిన ధైర్యమా అని నిర్దిష్టంగా చెప్పదు. కాబట్టి ఆ ధార్మిక ఉద్వేగం మరియు అనిశ్చితిని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ నుడికారాలను ప్రధాన పాఠంలో సుగమం చేసి, ముఖ్యమైన అక్షరార్థ ప్రత్యామ్నాయాలను పాదసూచికల్లో ఇచ్చాం.
