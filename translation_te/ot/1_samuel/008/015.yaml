  yaml_path: translation/ot/1_samuel/008/015.yaml
  text: He will take a tenth of your seed and your vineyards and give it to his officials and his servants[a].
translation:
  language: te
  text: అతడు మీ విత్తనం నుండి, మీ ద్రాక్షతోటల నుండి పదోవంతు వసూలు చేసి, దానిని తన అధికారులకూ[a] తన సేవకులకూ ఇస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన నపుంసకులకు’; హెబ్రీ పదం סָרִיסָיו నపుంసకులను లేదా విస్తృతార్థంలో రాజసభ అధికారులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  choice: మీ విత్తనంలో
  rationale: זֶרַע అక్షరార్థంగా ‘విత్తనం’; ఈ వ్యవసాయ సందర్భంలో విత్తడానికి ఉంచిన విత్తనాన్ని లేదా పంట దిగుబడిని సూచించగలదు. మూలంలోని రూపాన్ని, దాని అర్థవిస్తృతిని నిలుపుతుంది.
- source_word: כַרְמֵיכֶם
  choice: మీ ద్రాక్షతోటల్లో
  rationale: כֶּרֶם సాధారణంగా ‘ద్రాక్షతోట’ను సూచిస్తుంది. పదోవంతు తీసుకోవడం అనే సందర్భం దాని దిగుబడిని సూచించినా, మూలంలోని సంక్షిప్తతను ఈ రూపం కాపాడుతుంది.
- source_word: יַעְשֹׂר
  choice: పదోవంతు తీసుకొని
  rationale: హిఫీల్ రూపంలోని עשר ఇక్కడ రాజు విధించే వసూలును సూచిస్తుంది. ‘దశమభాగం చెల్లిస్తాడు’ వంటి ఆరాధనా భావాన్ని కలిగించకుండా ‘పదోవంతు తీసుకుంటాడు’ అనే అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְנָתַן
  choice: ఇస్తాడు
  rationale: అసంపూర్ణ క్రియ తరువాత వచ్చిన waw + qatal భవిష్య వర్ణనను కొనసాగిస్తుంది; తెలుగులో సహజంగా ‘తీసుకొని ... ఇస్తాడు’ అని అనువదించబడింది.
- source_word: לְסָרִיסָיו
  choice: తన అధికారులకు
  rationale: סָרִיס రాజసభ అధికారిని లేదా నపుంసకుణ్ణి సూచించగలదు. పరిపాలనా సందర్భంలో ‘అధికారులు’ సహజంగా ఉంటుంది; మరో అర్థాన్ని పాదసూచికలో నిలుపబడింది.
- source_word: וְלַעֲבָדָיו
  choice: తన సేవకులకు
  rationale: עֶבֶד సందర్భానుసారం సేవకుడు లేదా బానిస అని అర్థమవుతుంది. ఇక్కడ రాజుకు చెందిన సిబ్బందిని విస్తృతంగా సూచిస్తున్నందున ‘సేవకులు’ తగినది.
