source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל שְׁמוּאֵל֙ שְׁמַ֣ע בְּ/קוֹלָ֔/ם וְ/הִמְלַכְתָּ֥ לָ/הֶ֖ם מֶ֑לֶךְ וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לְכ֖וּ אִ֥ישׁ לְ/עִירֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
translation:
  language: te
  text: 'యాహ్వే సమూయేలుతో, “వారి మాట విను[a]; వారికి ఒక రాజును నియమించు” అన్నాడు. అప్పుడు సమూయేలు ఇశ్రాయేలు పురుషులతో[b] ఇలా అన్నాడు: “మీరు ఒక్కొక్కరు మీ మీ పట్టణాలకు వెళ్లండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి మాట విను’ అనే హీబ్రూ నుడికారం, వారు అడిగినదాన్ని ఆలకించడమే కాక దానికి సమ్మతించి ఆ ప్రకారం చేయడం అనే భావాన్నీ ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా ‘ఇశ్రాయేలు పురుషులు.’ ఈ మాట అక్కడ సమకూడిన ఇశ్రాయేలీయులకు ప్రాతినిధ్యపూర్వక సూచనగా కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సాధారణంగా అర్థమయ్యే లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: שְׁמַע בְּקוֹלָם
  choice: వారి మాట విను
  rationale: ఈ హీబ్రూ నుడికారం వినడమే కాక వారి అభ్యర్థనను అంగీకరించి దాని ప్రకారం చేయడం అనే భావాన్ని కలిగి ఉంది; తెలుగు నుడికారం ఆ రెండు పార్శ్వాలనూ నిలుపుతుంది.
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  choice: వారికి ఒక రాజును నియమించు
  rationale: מלך క్రియ హిఫీల్ రూపంలో ఒకరిని రాజుగా స్థాపించడం లేదా నియమించడం అని సూచిస్తుంది; ‘నియమించు’ తెలుగులో సహజంగా ఆ రాజస్థాపన భావాన్ని తెలియజేస్తుంది.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: మూలంలోని స్పష్టమైన పుంలింగ పదాన్ని నిలిపి, అక్కడ సమకూడిన ఇశ్రాయేలు పురుషులను సూచించేలా అనువదించాం.
- source_word: לְכוּ
  choice: వెళ్లండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని సహజమైన, గౌరవప్రదమైన తెలుగు ఆజ్ఞారూపంతో అందించాం.
- source_word: אִישׁ לְעִירוֹ
  choice: మీరందరూ మీ మీ పట్టణాలకు
  rationale: హీబ్రూలోని విభాజక భావం—ప్రతి పురుషుడు తన సొంత పట్టణానికి వెళ్లడం—తెలుగులో సహజమైన ‘మీ మీ’ నిర్మాణంతో వ్యక్తమవుతుంది; ముందున్న ‘ఇశ్రాయేలు పురుషులు’ పుంలింగ సూచనను స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తున్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం; ఉచ్చారణ పునర్నిర్మాణంలో ఉన్న పరిమితిని అంగీకరిస్తూ విస్తృతంగా స్వీకరించిన ‘యాహ్వే’ రూపాన్ని ఎంచుకున్నాం.
- issue: אַנְשֵׁי יִשְׂרָאֵל మరియు אִישׁ లోని పుంలింగ భాష
  choice: ‘ఇశ్రాయేలు పురుషులు’ అని స్పష్టంగా ఉంచి, పంపివేతను సహజమైన బహువచన తెలుగులో చెప్పడం
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు; ప్రతి వ్యక్తి
  rationale: మూలంలోని పుంలింగ రూపాన్ని తటస్థీకరించకుండా నిలిపాం. అదే సమయంలో చివరి ఆజ్ఞను అసహజమైన తెలుగు ఏకవచన-బహువచన కలయికగా కాక, ఆ పురుషులందరికీ ఉద్దేశించిన సహజమైన ఆజ్ఞగా అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని వాడాం. ‘వారి మాట విను’ అనే సహజ తెలుగు నుడికారంతో మూలంలోని ఉద్దేశపూర్వక భావవిస్తృతిని నిలిపాం. చివరి వాక్యంలో ‘మీరందరూ మీ మీ పట్టణాలకు’ అని చెప్పడం ద్వారా విభాజక భావాన్ని సహజంగా అందించాం.
