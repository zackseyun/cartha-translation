  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. రాజు చేసే బలవంతపు నియామక భావాన్ని ‘తీసుకుపోతాడు’ నిలుపుతుంది; మూడు సేవా పాత్రల సమాంతర నిర్మాణం ‘వారిగా’ ద్వారా కొనసాగించబడింది.
