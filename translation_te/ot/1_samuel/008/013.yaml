translation:
  language: te
  text: అతడు మీ కుమార్తెలను సుగంధ మిశ్రమాలు తయారుచేసేవారిగా[a], వంట చేసేవారిగా, రొట్టెలు కాల్చేవారిగా తీసుకుపోతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సుగంధ లేపనాలు తయారుచేసేవారిగా.’ హీబ్రూ పదం పరిమళ ద్రవ్యాలు లేదా లేపనాలతో సహా సుగంధ మిశ్రమాలను తయారుచేసేవారిని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ‘మీ కుమార్తెలను’ అనే ప్రత్యక్ష కర్మను సూచించే హీబ్రూ వ్యాకరణ చిహ్నం; తెలుగులో ‘ను’ విభక్తి ద్వారా దాని పని వ్యక్తమవుతుంది.
- source_word: בְּנוֹתֵיכֶם
  choice: మీ కుమార్తెలను
  rationale: ‘కుమార్తెలు’ అనే పదానికి రెండవ పురుష బహువచన స్వామ్య ప్రత్యయం ఉంది. రాజు బలవంతంగా సేవకు తీసుకోవడం గురించిన సందర్భంలో కుటుంబ సంబంధ అర్థాన్ని నిలుపుతుంది.
- source_word: יִקָּח
  choice: తీసుకుపోతాడు
  rationale: ఈ అసంపూర్ణ క్రియారూపం సమూయేలు చేస్తున్న హెచ్చరికలో భవిష్యత్తు భావాన్ని ఇస్తుంది. ‘తీసుకుపోతాడు’ అనేది రాజు సేవకోసం వారిని స్వాధీనపరచుకునే బలవంతపు భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְרַקָּחוֹת
  choice: సుగంధ ద్రవ్యాలు తయారుచేసేవారిగా
  rationale: ఈ స్త్రీలింగ బహువచన నామవాచకం పరిమళ ద్రవ్యాలు లేదా లేపనాల కోసం సుగంధ మిశ్రమాలు తయారుచేసే స్త్రీలను సూచిస్తుంది. విస్తృతమైన మూలార్థాన్ని ఈ ఎంపిక నిలుపుతుంది.
- source_word: וּלְטַבָּחוֹת
  choice: వంటవారిగా
  rationale: ఆహారం సిద్ధం చేసే స్త్రీలను సూచించే స్త్రీలింగ బహువచన పదం. ‘మీ కుమార్తెలను’ అన్న సందర్భమే లింగాన్ని స్పష్టం చేస్తున్నందున ప్రత్యేకంగా ‘స్త్రీ వంటవారు’ అనడం అవసరం లేదు.
- source_word: וּלְאֹפוֹת
  choice: రొట్టెలు కాల్చేవారిగా
  rationale: ‘కాల్చు’ అనే క్రియ నుంచి వచ్చిన ఈ స్త్రీలింగ రూపం రొట్టెలను కాల్చి సిద్ధం చేసే స్త్రీలను సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో వృత్తిని స్పష్టంగా తెలిపే సహజ వ్యక్తీకరణ ఇది.
