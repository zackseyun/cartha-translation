source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע שְׁמוּאֵ֔ל אֵ֖ת כָּל דִּבְרֵ֣י הָ/עָ֑ם וַֽ/יְדַבְּרֵ֖/ם בְּ/אָזְנֵ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/021.yaml
  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
translation:
  language: te
  text: సమూయేలు ప్రజల మాటలన్నిటినీ విన్నాడు; వాటిని యాహ్వే[a] వినికిడిలో చెప్పాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దైవనామానికి హెబ్రీ రూపం YHWH; సాంప్రదాయంగా దీనిని ‘యెహోవా’ అని కూడా పలుకుతారు.
    reason: alternative_reading
  - marker: b
    text: 'అక్షరార్థంగా: “యాహ్వే చెవుల్లో చెప్పాడు”; అంటే యాహ్వే వినికిడిలో లేదా ఆయన సమక్షంలో చెప్పాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విని
  rationale: שׁמע ఇక్కడ ప్రజలు చెప్పిన మాటలను సమూయేలు వినడాన్ని సూచిస్తుంది; తెలుగు కథనంలో ‘విని’ సహజమైన, నేరమైన సమానార్థకం.
- source_word: כָּל דִּבְרֵי הָעָם
  choice: ప్రజల మాటలన్నిటినీ
  rationale: כָּל యొక్క సంపూర్ణతను, דִּבְרֵי యొక్క ‘మాటలు’ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיְדַבְּרֵם
  choice: వాటిని ... తెలియజేశాడు
  rationale: కర్మప్రత్యయం ప్రజల మాటలను తిరిగి సూచిస్తుంది. తెలుగులో ‘వాటిని తెలియజేశాడు’ అనేది సందర్భానుసారంగా సహజంగా ఉండి, సమూయేలు ఆ మాటలను యెహోవా ఎదుట ఉంచిన భావాన్ని అందిస్తుంది.
- source_word: בְּאָזְנֵי
  choice: సమక్షంలో
  rationale: అక్షరార్థంగా ‘చెవుల్లో’ అయిన ఈ హెబ్రీ నుడికారం ఒకరి వినికిడిలో లేదా సన్నిధిలో చెప్పడాన్ని సూచిస్తుంది; తెలుగులో ‘సమక్షంలో’ సహజమైన సమానార్థకం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించడం జరిగింది; ఇది బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: తెలుగులో స్థిరపడిన బైబిలు వ్యక్తినామ రూపం.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో బిరుదు కాకుండా చతురక్షర దైవనామం ఉంది. తెలుగులో సుపరిచితమైన వ్యక్తినామ రూపమైన ‘యెహోవా’ను ఉపయోగించి, ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదసూచికలో ఇచ్చాం.
- issue: בְּאָזְנֵי అనే శరీరాంగ నుడికారం
  choice: సమక్షంలో
  alternative: చెవుల్లో; వినికిడిలో
  rationale: తెలుగులో అక్షరానువాదం అసహజంగా లేదా అపార్థకంగా ఉంటుంది. ‘సమక్షంలో’ అనేది యెహోవా వినేలా ఆయన ఎదుట మాటలను ఉంచిన భావాన్ని తెలియజేస్తుంది; మూల రూపకాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజంగా అనువదించి, దాని అక్షర రూపాన్ని పాదసూచికలో నిలిపాం.
