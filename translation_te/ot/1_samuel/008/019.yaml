source:
  edition: WLC
  text: וַ/יְמָאֲנ֣וּ הָ/עָ֔ם לִ/שְׁמֹ֖עַ בְּ/ק֣וֹל שְׁמוּאֵ֑ל וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י אִם מֶ֖לֶךְ יִֽהְיֶ֥ה עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/019.yaml
  text: But the people refused to listen to the voice of Samuel[a], and they said, “No, but there shall be a king over us.”
translation:
  language: te
  text: అయితే ప్రజలు సమూయేలు మాట వినడానికి నిరాకరించారు[a]; వారు, “కాదు! కానీ మాపై ఒక రాజు ఉండాలి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమూయేలుకు విధేయులవడానికి నిరాకరించారు.” “మాట వినడం” అనే హీబ్రూ నుడికారం కేవలం వినడమే కాక, చెప్పినదాన్ని పాటించడం లేదా విధేయత చూపడం అనే అర్థాన్నీ ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: నిరాకరించి
  rationale: מָאֵן క్రియ ఉద్దేశపూర్వకమైన నిరాకరణను లేదా సమ్మతి లేకపోవడాన్ని సూచిస్తుంది; సందర్భంలో ప్రజల క్రియాశీల ప్రతిఘటనను ‘నిరాకరించి’ సహజంగా తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇక్కడ עַם రాజును కోరుతున్న ఇశ్రాయేలీయులను సమిష్టిగా సూచిస్తుంది; ‘ప్రజలు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సామూహిక పదం.
- source_word: לִשְׁמֹעַ בְּקוֹל שְׁמוּאֵל
  choice: సమూయేలు మాట వినడానికి
  rationale: שמע בקול అనే హీబ్రూ నుడికారం వినడం మాత్రమే కాక శ్రద్ధగా ఆలకించడం లేదా విధేయత చూపడం అనే భావాన్నీ కలిగి ఉంటుంది. ‘మాట వినడం’ తెలుగులో ఈ రెండు భావ ఛాయలను సహజంగా నిలుపుతుంది.
- source_word: וַיֹּאמְרוּ
  choice: అన్నారు
  rationale: אָמַר సాధారణంగా చెప్పడాన్ని సూచిస్తుంది; తెలుగు కథన క్రమంలో ‘అన్నారు’ సహజంగా సరిపోతుంది.
- source_word: לֹא
  choice: వద్దు!
  rationale: స్వతంత్రంగా ఉన్న לֹא సమూయేలు హెచ్చరికను ప్రజలు బలంగా తిరస్కరించినట్లు చూపుతుంది; ప్రత్యక్ష సంభాషణలో ‘వద్దు!’ ఆ నిరాకరణ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי אִם
  choice: '[తదుపరి పట్టుదలతో కూడిన వాక్యంలో అంతర్భూత విరోధం]'
  rationale: לֹא כִּי אִם నిర్మాణం ‘కాదు, దానికి బదులుగా’ అనే బలమైన వ్యతిరేకతను సూచిస్తుంది. తెలుగులో ‘వద్దు! మా మీద…’ అనే వరుస స్వయంగా ఆ వ్యతిరేకతను సహజంగా అందిస్తుంది; కృత్రిమమైన ‘కాని’ అవసరం లేదు.
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: మా మీద ఒక రాజు ఉండాల్సిందే
  rationale: ఈ వాక్యం ప్రజల దృఢమైన పట్టుదలను వ్యక్తం చేస్తుంది. ‘మా మీద’ రాజాధికార సంబంధాన్ని నిలుపుతుంది; ‘ఉండాల్సిందే’ సందర్భంలోని బలమైన సంకల్పాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
