id: 1SA.8.5
reference: 1 Samuel 8:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו הִנֵּה֙ אַתָּ֣ה זָקַ֔נְתָּ וּ/בָנֶ֕י/ךָ לֹ֥א הָלְכ֖וּ בִּ/דְרָכֶ֑י/ךָ עַתָּ֗ה שִֽׂימָ/ה לָּ֥/נוּ מֶ֛לֶךְ לְ/שָׁפְטֵ֖/נוּ כְּ/כָל הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
translation:
  language: te
  text: 'వారు అతనితో ఇలా అన్నారు: “చూడండి, మీరు ముసలివారయ్యారు; మీ కుమారులు మీ మార్గాల్లో నడవలేదు. ఇప్పుడు ఇతర జనాలన్నిటిలాగే మాకు న్యాయం తీర్చడానికి[a] ఒక రాజును నియమించండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మమ్మల్ని పరిపాలించడానికి” లేదా “మమ్మల్ని ఏలడానికి”; ఇక్కడ హీబ్రూ క్రియ న్యాయం తీర్చడంతో పాటు విస్తృతమైన పాలనా అధికారాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: చూడండి
  rationale: హీబ్రూ పదంలోని శ్రద్ధను ఆకర్షించే, విషయాన్ని బలంగా చూపించే భావాన్ని ఆధునిక గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: זָקַנְתָּ
  choice: మీరు ముసలివారయ్యారు
  rationale: క్రియ సూచించే వృద్ధాప్యానికి చేరిన ప్రక్రియను, దాని ప్రస్తుత ఫలితస్థితిని రెండింటినీ నిలుపుతుంది.
- source_word: הָלְכוּ בִּדְרָכֶיךָ
  choice: మీ మార్గాల్లో నడవలేదు
  rationale: నైతిక జీవన విధానాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే బైబిలీయ నుడికారంగా నిలుపుతుంది.
- source_word: שִׂימָה לָּנוּ
  choice: మాకు ... నియమించండి
  rationale: రాజకీయ నాయకుడిని స్థాపించాలనే అభ్యర్థనను సందర్భానుగుణంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֶלֶךְ
  choice: ఒక రాజును
  rationale: రాజ్యాధికారిని సూచించే సాధారణ హీబ్రూ నామవాచకానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: לְשָׁפְטֵנוּ
  choice: మాకు న్యాయం తీర్చడానికి
  rationale: שׁפט అనే క్రియ యొక్క ప్రాథమిక న్యాయనిర్ణయ భావాన్ని ప్రధాన పాఠంలో నిలుపుతూ, ఈ సందర్భంలోని విస్తృత పరిపాలనా భావాన్ని పాదటిప్పణిలో సూచిస్తుంది.
- source_word: כְּכָל הַגּוֹיִם
  choice: ఇతర జనాలన్నిటిలాగే
  rationale: చుట్టుపక్కల ఉన్న ఇతర ప్రజాసమూహాలను సూచిస్తుంది; తరువాతి కాలపు మతపరమైన పారిభాషిక భావాన్ని అనవసరంగా దిగుమతి చేయదు. తెలుగులో పోలిక స్పష్టంగా ఉండేందుకు సందర్భసిద్ధమైన ‘ఇతర’ చేర్చబడింది.
theological_decisions:
- issue: చుట్టుపక్కల జనాల రాజకీయ వ్యవస్థను అనుకరించాలనే ఇశ్రాయేలు అభ్యర్థన
  choice: ఇతర జనాలన్నిటిలాగే
  alternative: అన్యజనులందరిలాగే
  rationale: ఈ వాక్యం ప్రధానంగా ఇతర ప్రజలవలె రాజ్యవ్యవస్థ కావాలనే కోరికను తెలియజేస్తుంది. ‘జనాలు’ అనే పదం ఆ ఒడంబడిక సంబంధిత వ్యత్యాసాన్ని నిలుపుతూ, తరువాతి యూదు-క్రైస్తవ పారిభాషిక అర్థాలను బలవంతంగా చేర్చదు.
- issue: రాజు చేయవలసిన שׁפט కార్యం
  choice: మాకు న్యాయం తీర్చడానికి
  alternative: మమ్మల్ని పరిపాలించడానికి
  rationale: మూల క్రియలో న్యాయనిర్ణయం అనే ప్రాథమిక భావంతో పాటు పాలనా అధికారం కూడా ఉండవచ్చు. ప్రధాన పాఠం ప్రాథమిక భావాన్ని నిలుపుతుంది; విస్తృత అర్థాన్ని పాదటిప్పణి భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణా శైలి ఉపయోగించబడింది. సమూయేలును ఉద్దేశించిన బహువచన గౌరవ రూపాలు నిలుపబడ్డాయి; హీబ్రూ నైతిక రూపకం ‘మార్గాల్లో నడవడం’ యథాతథంగా ఉంచబడింది.
