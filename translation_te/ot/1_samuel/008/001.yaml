  yaml_path: translation/ot/1_samuel/008/001.yaml
  text: When Samuel grew old[a], he appointed his sons as judges over Israel.
translation:
  language: te
  text: సమూయేలు వృద్ధుడైనప్పుడు, అతడు తన కుమారులను ఇశ్రాయేలుకు న్యాయాధిపతులుగా నియమించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కుమారులను ఇశ్రాయేలుపై న్యాయాధిపతులుగా నియమించాడు.” హీబ్రూ క్రియకు అక్షరార్థంగా “ఉంచాడు” అని అర్థం; “ఇశ్రాయేలు” ముందు ఉన్న ఉపసర్గను ఈ నియామకాన్ని ఎలా అర్థం చేసుకుంటామనే దానిని బట్టి “ఇశ్రాయేలుకు” లేదా “ఇశ్రాయేలుపై” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: అయినప్పుడు
  rationale: హీబ్రూ కథన సూత్రం కాలసంబంధ పరిస్థితిని పరిచయం చేస్తుంది; తెలుగులో సహజమైన ఉపవాక్య నిర్మాణంతో దాని కార్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: זָקֵן
  choice: వృద్ధుడైన
  rationale: ఈ క్రియ వృద్ధాప్యంలోకి రావడం లేదా వయసు మళ్లడం అనే భావాన్ని తెలియజేస్తుంది; కేవలం స్థిరమైన వయోస్థితిని మాత్రమే చెప్పదు.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וַיָּשֶׂם
  choice: నియమించాడు
  rationale: మూల క్రియకు అక్షరార్థంగా ‘ఉంచాడు/పెట్టాడు’ అనే భావం ఉన్నా, ఇక్కడ ఒక అధికార బాధ్యతలో ఉంచడాన్ని సందర్భానుసారంగా ‘నియమించాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: אֶת בָּנָיו
  choice: తన కుమారులను
  rationale: హీబ్రూ పదం ప్రత్యేకంగా కుమారులను సూచిస్తుంది; ‘తన’ అనేది కర్తతో సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా చూపుతుంది.
- source_word: שֹׁפְטִים
  choice: న్యాయాధిపతులుగా
  rationale: ఈ పదం న్యాయనిర్ణయం చేయడంతో పాటు పాలనా బాధ్యత వహించే పదవిని సూచిస్తుంది; ‘న్యాయాధిపతులు’ ఆ స్థిరమైన బైబిలీయ భావాన్ని నిలుపుతుంది.
- source_word: לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: לְ ఉపసర్గను ఇక్కడ ‘ఇశ్రాయేలు కోసం/ఇశ్రాయేలుకు’ అని సహజంగా తీసుకోవచ్చు; అధికార పరిధిని సూచించే ‘ఇశ్రాయేలుపై’ కూడా సాధ్యమే కాబట్టి ప్రత్యామ్నాయాన్ని పాదటీపులో నిలిపాం.
