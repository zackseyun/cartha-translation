revisions:
- from: వారు చేసిన పనులన్నిటికి అనుగుణంగానే—నేను వారిని ఐగుప్తు నుండి బయటకు తీసుకొచ్చిన రోజు మొదలుకొని ఈ రోజు వరకు[a] వారు నన్ను విడిచిపెట్టి ఇతర దేవుళ్లను సేవిస్తూ వచ్చారు[b]—ఇప్పుడు నీ పట్ల కూడా అలాగే చేస్తున్నారు.
  to: నేను వారిని ఐగుప్తు నుండి బయటకు తీసుకొచ్చిన రోజు మొదలుకొని ఈ రోజు వరకు[a] వారు చేసిన పనులన్నిటి ప్రకారమే—వారు నన్ను విడిచిపెట్టి ఇతర దేవుళ్లను సేవించినట్లే[b]—వారు నీకు కూడా అలాగే చేస్తున్నారు.
  rationale: 'The revision removes an unmarked temporal addition, improves the Telugu comparative construction, and preserves the Hebrew’s comparison: Israel’s current conduct toward Samuel corresponds to its longstanding conduct toward the LORD. The final «నీకు కూడా అలాగే చేస్తున్నారు» retains the source text’s open-ended wording rather than interpreting precisely what they are doing to Samuel.'
