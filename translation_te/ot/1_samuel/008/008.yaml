source:
  edition: WLC
  text: כְּ/כָֽל הַ/מַּעֲשִׂ֣ים אֲשֶׁר עָשׂ֗וּ מִ/יּוֹם֩ הַעֲלֹתִ֨/י אֹתָ֤/ם מִ/מִּצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יַּ֣עַזְבֻ֔/נִי וַ/יַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים כֵּ֛ן הֵ֥מָּה עֹשִׂ֖ים גַּם לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
translation:
  language: te
  text: నేను వారిని ఐగుప్తు నుండి బయటకు తీసుకొచ్చిన రోజు మొదలుకొని ఈ రోజు వరకు[a] వారు చేసిన పనులన్నిటి ప్రకారమే—వారు నన్ను విడిచిపెట్టి ఇతర దేవుళ్లను సేవించినట్లే[b]—వారు నీకు కూడా అలాగే చేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘ఈ దినం వరకు.’'
    reason: కాలవ్యాప్తిని సూచించే హెబ్రీయ పదబంధానికి మరింత అక్షరార్థ ప్రత్యామ్నాయం.
  - marker: b
    text: ‘ఇతర దేవుళ్లను సేవించడం’ అనే మాటను ‘ఇతర దేవుళ్లను ఆరాధించడం’ అని కూడా అనువదించవచ్చు; హెబ్రీయ క్రియకు అక్షరార్థం ‘సేవించడం.’
    reason: దేవుళ్ల సందర్భంలో హెబ్రీయ עבד సేవ మరియు ఆరాధన రెండింటి భావాన్నీ మోస్తుంది.
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשׂוּ
  choice: వారు చేసిన పనులన్నిటికి అనుగుణంగానే
  rationale: כְּכָל గత ప్రవర్తనకు అనుగుణంగా ఇప్పుడు కూడా వారు వ్యవహరిస్తున్నారనే పోలికను పరిచయం చేస్తుంది. ‘పనులు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని నైతిక భారాన్ని నిలుపుతుంది.
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  choice: నేను వారిని ఐగుప్తు నుండి బయటకు తీసుకొచ్చిన రోజు మొదలుకొని
  rationale: హిఫీల్ రూపంలోని עלה ఇక్కడ ఐగుప్తు నుండి ఇశ్రాయేలీయులను దేవుడు వెలుపలికి తీసుకురావడాన్ని సూచిస్తుంది; ‘బయటకు తీసుకొచ్చిన’ అనే ప్రయోగం తెలుగులో సహజంగా ఉండి నిర్గమన భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: గతంలోని నిర్గమన దినం నుండి వక్త యొక్క ప్రస్తుత కాలం వరకూ ఉన్న కాలవ్యాప్తిని నేరుగా తెలియజేస్తుంది.
- source_word: וַיַּעַזְבֻנִי
  choice: వారు నన్ను విడిచిపెట్టి
  rationale: עזב లోని పరిత్యాగం, నమ్మకద్రోహం అనే బలాన్ని అదనపు సిద్ధాంత పదజాలం లేకుండా ‘విడిచిపెట్టి’ నిలుపుతుంది.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను సేవిస్తూ వచ్చారు
  rationale: עבד యొక్క మూలార్థమైన ‘సేవించు’ను నిలుపుతూ, దేవుళ్ల సందర్భంలో మతపరమైన విధేయత లేదా ఆరాధన భావాన్ని సహజంగా తెలియజేస్తుంది. ‘వచ్చారు’ గతం నుండి వర్తమానం వరకు కొనసాగిన ధోరణిని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֵּן הֵמָּה עֹשִׂים גַּם לָךְ
  choice: ఇప్పుడు నీ పట్ల కూడా అలాగే చేస్తున్నారు
  rationale: כֵּן లోని పోలికను ‘అలాగే’, גַּם ను ‘కూడా’ నిలుపుతున్నాయి. ‘నీ పట్ల చేస్తున్నారు’ అనే తెరవబడిన నిర్మాణం, వారు యెహోవా పట్ల చేసినదానికి సమానంగా సమూయేలు పట్ల చేస్తున్నారనే హెబ్రీయ భాషలోని సంక్షిప్తతను అనవసరంగా వివరించదు.
theological_decisions:
- issue: సమూయేలును తిరస్కరించడం మరియు యెహోవాను విడిచిపెట్టడం మధ్య సంబంధం
  choice: ప్రజల ప్రస్తుత ప్రవర్తనను వారి దీర్ఘకాలిక ఒడంబడికా అవిశ్వాసపు ధోరణితో పోల్చడం
  alternative: ‘వారు నాపై తిరుగుబాటు చేసినట్లే నీపై కూడా తిరుగుబాటు చేస్తున్నారు’ అని స్పష్టీకరించడం
  rationale: హెబ్రీయ పాఠం వారు యెహోవాను విడిచి ఇతర దేవుళ్లను సేవించారని చెప్పి, సమూయేలు పట్ల కూడా ‘అలాగే’ చేస్తున్నారని మాత్రమే చెబుతుంది. అందువల్ల తిరుగుబాటు అనే వ్యాఖ్యాత్మక పదాన్ని చేర్చకుండా పోలికను యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. దీర్ఘ హెబ్రీయ వాక్యంలోని ప్రధాన పోలిక స్పష్టంగా ఉండేందుకు మధ్య భాగాన్ని డాష్‌లతో వేరు చేశాం; మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను ‘నీ పట్ల కూడా అలాగే చేస్తున్నారు’లో నిలిపాం.
