source:
  edition: WLC
  text: וְ/הָיִ֥ינוּ גַם אֲנַ֖חְנוּ כְּ/כָל הַ/גּוֹיִ֑ם וּ/שְׁפָטָ֤/נוּ מַלְכֵּ֨/נוּ֙ וְ/יָצָ֣א לְ/פָנֵ֔י/נוּ וְ/נִלְחַ֖ם אֶת מִלְחֲמֹתֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/020.yaml
  text: so that we too may be like all the nations[b][a], and our king may judge us and go out before us and fight our battles.
translation:
  language: te
  text: మేము కూడా అన్ని దేశాలవలె ఉండేలా[a], మా రాజు మాకు న్యాయం తీర్చి[b], మా ముందుగా బయలుదేరి, మా యుద్ధాలు చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము కూడా అన్ని దేశాలవలె ఉంటాము.” హీబ్రూ రూపాన్ని భవిష్యత్ వరుసగా మరింత అక్షరార్థంగా అనువదించవచ్చు; ఇక్కడ అది రాజును కోరడంలో ప్రజల ఉద్దేశాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “మాకు న్యాయం తీర్చి” అనే మాటకు “మమ్మల్ని పరిపాలించి” లేదా “మమ్మల్ని ఏలి” అనే విస్తృత భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִינוּ גַם אֲנַחְנוּ
  choice: మేము కూడా ... ఉండేలా
  rationale: ముందటి వచనంలో రాజును కోరిన ప్రజల ఉద్దేశాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; גַם אֲנַחְנוּ లోని ఉద్ఘాటనను ‘మేము కూడా’ నిలుపుతుంది.
- source_word: כְּכָל הַגּוֹיִם
  choice: అన్ని జనాలవలె
  rationale: ఇక్కడ גּוֹיִם పరిసర ప్రజలను లేదా జనసమూహాలను సూచిస్తుంది; తరువాతి కాలపు సాంకేతిక భావమైన ‘అన్యజనులు’ను అనవసరంగా దిగుమతి చేయకుండా, ఇశ్రాయేలు ఇతర జనాలవలె కావాలనుకున్న ఉద్రిక్తతను నిలుపుతుంది.
- source_word: וּשְׁפָטָנוּ
  choice: మాకు న్యాయం తీర్చి
  rationale: שׁפט లోని న్యాయం తీర్చడం అనే ప్రాథమిక భావాన్నీ, నాయకత్వ సంబంధమైన విస్తృత భావాన్నీ సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: מַלְכֵּנוּ
  choice: మా రాజు
  rationale: ప్రజలు కోరుకున్న రాజకీయ నాయకత్వాన్ని మూలంలోని స్వామ్యరూపానికి అనుగుణంగా స్పష్టంగా ఉంచుతుంది.
- source_word: וְיָצָא לְפָנֵינוּ
  choice: మా ముందుగా బయలుదేరి
  rationale: సైనిక నాయకుడు ప్రజల ముందు వెళ్లే హీబ్రూ దృశ్యరూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְנִלְחַם אֶת מִלְחֲמֹתֵינוּ
  choice: మా యుద్ధాలు చేయాలి
  rationale: హీబ్రూలోని సహజాత పదనిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, రాజు వారి తరఫున యుద్ధం చేసే భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు ఇతర גּוֹיִם వలె కావాలనే కోరిక
  choice: అన్ని జనాలవలె
  alternative: అన్యజనులందరివలె
  rationale: రాజకీయంగా, సామాజికంగా పరిసర జనాలవలె కావాలన్న కోరికను ఇది సూచిస్తుంది. ‘అన్యజనులు’ అనే తరువాతి సాంకేతిక మతపరమైన భావాన్ని రుద్దకుండా, వాక్యంలోని ఒడంబడిక సంబంధమైన ఉద్రిక్తతను నిలుపుతుంది.
- issue: שׁפט యొక్క పరిధి
  choice: మాకు న్యాయం తీర్చి
  alternative: మమ్మల్ని పరిపాలించి
  rationale: న్యాయాధిపతుల నాయకత్వంతో ఉన్న పదసంబంధాన్ని నిలుపుతుంది; అయితే ఇక్కడ రాజ్యపాలన అనే విస్తృత భావం కూడా ఉండవచ్చని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ఉద్దేశార్థం, సైనిక నాయకత్వ దృశ్యం, שׁפט పదంలోని న్యాయ/పాలనా ద్వంద్వవ్యాప్తి పాదటిప్పణులతో నిలుపబడ్డాయి.
