  revised_text: 'అతడు ఇలా అన్నాడు: “మీపై రాజ్యమేలబోయే రాజు నడుచుకునే తీరు[a] ఇదే: అతడు మీ కుమారులను[b] తీసుకొని, తన రథాలకోసం, తన గుర్రపు సైనికుల మధ్య వారిని నియమిస్తాడు; వారు అతని రథం[c] ముందు పరుగెత్తుతారు.”'
