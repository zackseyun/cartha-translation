- from: 'అతడు ఇలా అన్నాడు: “మీపై పరిపాలించే రాజు అనుసరించే విధానం[a] ఇదే: అతడు మీ కుమారులను[b] తీసుకొని, తన రథదళంలోనూ అశ్విక దళంలోనూ వారిని నియమించుకుంటాడు; వారు అతని రథం[c] ముందు పరుగెత్తుతారు.”'
  to: 'అతడు ఇలా అన్నాడు: “మీపై రాజ్యమేలబోయే రాజు నడుచుకునే తీరు[a] ఇదే: అతడు మీ కుమారులను[b] తీసుకొని, తన రథాలకోసం, తన గుర్రపు సైనికుల మధ్య వారిని నియమిస్తాడు; వారు అతని రథం[c] ముందు పరుగెత్తుతారు.”'
  rationale: మూలపాఠ్యంలోని మిష్పాట్ పదం సూచించే ఆచారం/పద్ధతి భావాన్ని తెలుగులో మరింత సహజంగా చేశాం; పాదసూచికలో ‘హక్కు’ అనే ప్రత్యామ్నాయాన్ని నిలిపాం. రాజు కుమారులను తన రథాలకు, గుర్రపు సైనికులకు సంబంధించిన సేవలో నియమిస్తాడనే హీబ్రూ సమాంతరతను స్పష్టపరిచాం. చివరి ఏకవచన ‘రథం’ను ప్రధాన పాఠ్యంలో అలాగే ఉంచి, సమూహార్థ అవకాశాన్ని పాదసూచికలో భద్రపరిచాం.
