id: 1SA.8.11
reference: 1 Samuel 8:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר זֶ֗ה יִֽהְיֶה֙ מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/כֶ֑ם אֶת בְּנֵי/כֶ֣ם יִקָּ֗ח וְ/שָׂ֥ם ל/וֹ֙ בְּ/מֶרְכַּבְתּ֣/וֹ וּ/בְ/פָרָשָׁ֔י/ו וְ/רָצ֖וּ לִ/פְנֵ֥י מֶרְכַּבְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “మీపై రాజ్యమేలబోయే రాజు నడుచుకునే తీరు[a] ఇదే: అతడు మీ కుమారులను[b] తీసుకొని, తన రథాలకోసం, తన గుర్రపు సైనికుల మధ్య వారిని నియమిస్తాడు; వారు అతని రథం[c] ముందు పరుగెత్తుతారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజు యొక్క హక్కు.” హీబ్రూ పదం మిష్పాట్ ఆచరణరీతిని, చట్టబద్ధమైన హక్కును లేదా న్యాయప్రమాణాన్ని సూచించవచ్చు. ఇక్కడ రాజు ప్రజల పట్ల సాధారణంగా ఎలా వ్యవహరిస్తాడో తెలియజేస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ప్రత్యేకంగా “మీ కుమారులు” అని ఉంది; రాజు వారిని సైనిక సేవకు తీసుకునే ఈ సందర్భానికి అది సరిపోతుంది.
    reason: cultural_note
  - marker: c
    text: హీబ్రూలో “రథం” ఏకవచనంలో ఉంది; అది ఒక రథాన్ని గానీ, సమూహార్థంలో రాజు రథాలను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: అనుసరించే విధానం
  rationale: ఇక్కడ ఈ పదం న్యాయతీర్పు కంటే, రాజు ప్రజల పట్ల వ్యవహరించే రీతి లేదా అతడు చెలాయించే హక్కును సూచించవచ్చు. ‘అనుసరించే విధానం’ హెచ్చరిక సందర్భానికి సహజంగా సరిపోతూ, ఆ చర్యలకు నైతిక సమర్థన ఉన్నట్లు ముందుగానే నిర్ధారించదు.
- source_word: הַמֶּלֶךְ אֲשֶׁר יִמְלֹךְ עֲלֵיכֶם
  choice: మీపై పరిపాలించే రాజు
  rationale: మలక్ అనే రాజరిక క్రియ భావాన్ని, עַל లోని ‘మీపై’ అనే అధికార సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  choice: అతడు మీ కుమారులను తీసుకొని
  rationale: בְּנֵיכֶם ఇక్కడ ప్రత్యేకంగా కుమారులను సూచిస్తుంది; తరువాతి సైనిక సేవ సందర్భానికీ ఇదే సరిపోతుంది.
- source_word: וְשָׂם לוֹ
  choice: వారిని నియమించుకుంటాడు
  rationale: שׂים యొక్క ‘ఉంచు/నియమించు’ భావాన్ని రాజు తన సేవ కోసం వారిని నియోగించుకోవడంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּמֶרְכַּבְתּוֹ וּבְפָרָשָׁיו
  choice: తన రథదళంలోనూ అశ్విక దళంలోనూ
  rationale: మొదటి నామవాచకం ఏకవచన రూపంలో ఉన్నప్పటికీ సమూహార్థంలో ఉండవచ్చు; ‘రథదళం’ మరియు ‘అశ్విక దళం’ రాజసైనిక సేవా విభాగాలను స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తాయి.
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  choice: వారు అతని రథం ముందు పరుగెత్తుతారు
  rationale: చివరి నామవాచకంలోని ఏకవచనాన్ని నిలుపుతూ, రాజు రథానికి ముందు పరుగెత్తే సేవకుల దృశ్యాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: מִשְׁפַּט రాజుకు న్యాయబద్ధమైన హక్కునా, లేక అతని ఆచరణరీతినా?
  choice: ప్రధాన పాఠ్యంలో ‘అనుసరించే విధానం’
  alternative: ‘రాజు హక్కు’
  rationale: సందర్భం రాజు ఏమి చేస్తాడో హెచ్చరిస్తోంది; అతని చర్యలకు దేవునిచ్చిన నైతిక అనుమతి ఉందని అనవసరంగా నిర్ణయించకుండా, హీబ్రూ పదంలోని హక్కు/ఆచారం అనే ద్వంద్వ అవకాశాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘రథదళం,’ ‘అశ్విక దళం’ వంటి పదాలు ప్రాచీన రాజసైనిక సందర్భాన్ని స్పష్టంగా ఉంచుతాయి. ప్రధాన పాఠ్యంలో ప్రతి పాదసూచిక గుర్తు [a], [b], [c] సంబంధిత పదబంధం వెంట ఉంచబడింది.
