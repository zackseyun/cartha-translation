  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָ/שׂ֣וּם ל֔/וֹ שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֣י חֲמִשִּׁ֑ים וְ/לַ/חֲרֹ֤שׁ חֲרִישׁ/וֹ֙ וְ/לִ/קְצֹ֣ר קְצִיר֔/וֹ וְ/לַ/עֲשׂ֥וֹת כְּלֵֽי מִלְחַמְתּ֖/וֹ וּ/כְלֵ֥י רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
translation:
  language: te
  text: అతడు వారిలో కొందరిని తన కోసం వెయ్యిమందికి అధికారులుగా, యాభైమందికి అధికారులుగా[a] నియమించుకుంటాడు; మరికొందరిని తన భూమిని దున్నడానికి, తన పంటను కోయడానికి[b], తన యుద్ధ సామగ్రిని[c], తన రథాల సామగ్రిని తయారు చేయడానికి నియమించుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెయ్యిమంది దళానికి నాయకులుగా, యాభైమంది దళానికి నాయకులుగా.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “తన దున్నడాన్ని దున్నడానికి, తన కోతను కోయడానికి”; రాజు కోసం చేయించే వ్యవసాయ శ్రమను ఈ పదప్రయోగం నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “తన యుద్ధ ఆయుధాలను.” హీబ్రూ పదం ఆయుధాలనే కాక ఇతర సైనిక సామగ్రినీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ
  choice: తన కోసం ... నియమించుకుంటాడు
  rationale: שׂוּם ఇక్కడ ఒక పదవిలో నియమించడం అనే భావాన్ని ఇస్తుంది; לוֹ రాజు తన సేవకోసం లేదా ప్రయోజనం కోసం అలా చేస్తాడని తెలియజేస్తుంది. ముందు వచనంలోని క్రియను కొనసాగించే హీబ్రూ క్రియారూపాన్ని సహజమైన తెలుగు సమాపక క్రియగా అనువదించాం.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי חֲמִשִּׁים
  choice: వెయ్యిమందికి అధికారులుగా, యాభైమందికి అధికారులుగా
  rationale: שַׂר అనే పదం అధికారి, నాయకుడు లేదా సైనిక దళాధిపతిని సూచించగలదు. సందర్భంలోని సైనిక-పరిపాలనా భావాన్నీ, హీబ్రూలోని సంఖ్యా విభాగాలనూ నిలుపుతూ సాధారణ పాఠకులకు స్పష్టమైన ‘అధికారులు’ ఎంచుకున్నాం.
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  choice: తన భూమిని దున్నించి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘అతని దున్నడాన్ని దున్నడం’ అనే సజాతి పదప్రయోగం ఉంది. తెలుగులో సహజంగా రాజుకు చెందిన సాగుభూమిలో బలవంతంగా పని చేయించడాన్ని సూచించేందుకు ఈ రూపాన్ని వాడాం.
- source_word: וְלִקְצֹר קְצִירוֹ
  choice: తన పంటను కోయించి
  rationale: קָצִיר కోతను లేదా కోసే పంటను సూచిస్తుంది. దున్నడం అనే సమాంతర వ్యవసాయ పనితో కలిపి, రాజు తన ప్రయోజనం కోసం వారితో పని చేయిస్తాడనే భావాన్ని తెలుగు ప్రేరణార్థక క్రియ తెలియజేస్తుంది.
- source_word: כְּלֵי מִלְחַמְתּוֹ
  choice: తన యుద్ధ సామగ్రిని
  rationale: כְּלִי సందర్భానుసారం పనిముట్టు, వస్తువు, ఆయుధం లేదా సామగ్రి కావచ్చు. מִלְחָמָהతో కలిసినప్పుడు ఆయుధాలతో సహా విస్తృతమైన సైనిక సామగ్రి భావాన్ని తెరిచి ఉంచేందుకు ‘యుద్ధ సామగ్రి’ ఎంచుకున్నాం.
- source_word: וּכְלֵי רִכְבּוֹ
  choice: తన రథాల సామగ్రిని
  rationale: רֶכֶב రథాన్ని లేదా రథదళాన్ని సూచించగలదు. దానికి సంబంధించిన పరికరాల విస్తృత భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘రథాల సామగ్రి’గా ఇచ్చాం.
