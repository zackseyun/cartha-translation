translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని వాడాం. ముందు వచనంలో రాజు ప్రజల కుమారులను తీసుకుంటాడనే సందర్భాన్ని ‘వారిలో కొందరిని/మరికొందరితో’ అనుసంధానిస్తుంది. రాజు తన ప్రయోజనం కోసం వారిచేత సేవ చేయిస్తాడనే హెచ్చరిక స్వరాన్ని ‘నియమించుకుంటాడు’, ‘దున్నించి’, ‘కోయించి’, ‘తయారు చేయిస్తాడు’ అనే రూపాలు స్పష్టంగా ఉంచుతాయి.
