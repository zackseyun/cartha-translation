  source_fidelity: 'ముసాయిదా హీబ్రూ భావాన్ని మొత్తంగా విశ్వసనీయంగా అందిస్తుంది: రాజు తన ప్రయోజనం కోసం అధికారులను నియమించి, ప్రజలచేత వ్యవసాయ మరియు సైనిక పనులు చేయించుకుంటాడనే హెచ్చరిక స్పష్టంగా ఉంది. అయితే ‘దున్నించి, కోయించి, తయారు చేయిస్తాడు’ అనే ప్రేరణార్థక వరుసలో నియామక భావం కొంత వెనుకబడుతుంది; మూలంలోని ఒకే నియామక క్రియకు అనుసంధానమైన ఉద్దేశ్యార్థక పదబంధాలను నేరుగా చూపడం మరింత సమీపంగా ఉంటుంది.'
