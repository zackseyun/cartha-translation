lexical_decisions:
- source_word: וַיִּֽתְקַבְּצוּ
  choice: సమకూడి
  rationale: హిత్పయేల్ రూపంలోని సమూహంగా ఒకచోట చేరడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలందరూ
  rationale: ‘పెద్దలు’ ఇక్కడ ఇశ్రాయేలు సమాజపు సీనియర్ ప్రతినిధులు/నాయకులను సూచిస్తుంది; ‘అందరూ’ כֹּל యొక్క సమగ్ర భావాన్ని నిలుపుతుంది.
- source_word: וַיָּבֹאוּ אֶל שְׁמוּאֵל
  choice: సమూయేలు దగ్గరికి వచ్చారు
  rationale: בוא + אֶל తెలిపే ఒక వ్యక్తి వద్దకు రావడం అనే గమనాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הָרָמָתָה
  choice: రామాకు
  rationale: స్థలనామానికి జతైన దిశాసూచక ה గమనలక్ష్యాన్ని సూచిస్తుంది; అందువల్ల ‘రామాకు’ మూలరూపాన్ని నేరుగా నిలుపుతుంది.
