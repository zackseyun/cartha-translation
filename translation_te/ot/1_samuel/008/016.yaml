  source_fidelity: 'The Telugu accurately reflects the Hebrew sequence and syntax: the king will take the people''s male slaves, female slaves, best young men, and donkeys, and employ them for his own work. “తీసుకొని తన పనికి ఉపయోగించుకుంటాడు” appropriately conveys the combined force of יִקָּח and וְעָשָׂה לִמְלַאכְתּוֹ without adding interpretive detail.'
