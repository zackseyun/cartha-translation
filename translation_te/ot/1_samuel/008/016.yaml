  terminology: “దాసులను, మీ దాసీలను” preserves the male/female contrast and is defensible in this coercive seizure context. The footnote responsibly records the broader servant terminology without weakening the contextual sense. “తన పనికి ఉపయోగించుకుంటాడు” communicates royal appropriation for labor or service.
