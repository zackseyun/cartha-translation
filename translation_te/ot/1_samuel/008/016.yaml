  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת עַבְדֵי/כֶם֩ וְֽ/אֶת שִׁפְח֨וֹתֵי/כֶ֜ם וְ/אֶת בַּחוּרֵי/כֶ֧ם הַ/טּוֹבִ֛ים וְ/אֶת חֲמוֹרֵי/כֶ֖ם יִקָּ֑ח וְ/עָשָׂ֖ה לִ/מְלַאכְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/016.yaml
  text: He will take your male servants[a], your female servants, your best young men, and your donkeys, and use them for his work.
translation:
  language: te
  text: అతడు మీ దాసులను[a], మీ దాసీలను, మీ శ్రేష్ఠమైన యువకులను, మీ గాడిదలను తీసుకొని తన పనికి ఉపయోగించుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ సేవకులను ... మీ సేవకురాళ్లను.” హీబ్రూ పదాలు విస్తృతంగా సేవకులను కూడా సూచించగలవు; అయితే రాజు వారిని బలవంతంగా తీసుకునే ఈ సందర్భంలో “దాసులు” అనే అర్థం మరింత అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵיכֶם
  choice: మీ దాసులను
  rationale: עֶבֶד అనే పదం ‘దాసుడు’ లేదా విస్తృతార్థంలో ‘సేవకుడు’ అని సూచించవచ్చు. రాజు బలవంతంగా తీసుకొని తన పనికి వినియోగించే ఈ సందర్భంలో ‘దాసులు’ అనేది తగిన ఎంపిక; తరువాతి స్త్రీలింగ పదంతో ఉన్న వ్యత్యాసాన్నీ ఇది నిలుపుతుంది.
- source_word: שִׁפְחוֹתֵיכֶם
  choice: మీ దాసీలను
  rationale: שִׁפְחָה స్త్రీ దాసిని లేదా సేవకురాలిని సూచిస్తుంది. ‘దాసీలు’ అనే ఎంపిక ముందున్న పురుష దాసులతో సమాంతరతను, వారి అధీనస్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  choice: మీ శ్రేష్ఠమైన యువకులను
  rationale: בָּחוּר యౌవనప్రాయంలోని పురుషుణ్ణి సూచిస్తుంది; הַטּוֹבִים వారిలో ఉత్తములనే భావాన్ని జోడిస్తుంది. ‘శ్రేష్ఠమైన యువకులు’ వయస్సు, ఎంపికైన నాణ్యత రెండింటినీ నిలుపుతుంది.
- source_word: חֲמוֹרֵיכֶם
  choice: మీ గాడిదలను
  rationale: ఇది సాధారణంగా గాడిదలను సూచించే పదం; ఆధునిక తెలుగులో సహజమైన సమానార్థకం ‘గాడిదలు’.
- source_word: יִקָּח
  choice: తీసుకొని
  rationale: לקח యొక్క మౌలిక అర్థం ‘తీసుకొను’. రాజు చేయబోయే చర్యలను తెలిపే హెచ్చరిక సందర్భంలో, వాక్యాంతంలోని భవిష్యత్ క్రియతో కలిసి ‘తీసుకొని ... ఉపయోగించుకుంటాడు’ సహజంగా భావాన్ని అందిస్తుంది.
- source_word: וְעָשָׂה לִמְלַאכְתּוֹ
  choice: తన పనికి ఉపయోగించుకుంటాడు
  rationale: పదశః నిర్మాణం ‘తన పని కోసం చేస్తాడు/చేయిస్తాడు’ అనే విధంగా ఉన్నా, ఇక్కడ తీసుకున్న మనుషులను, జంతువులను రాజు తన పనులకు వినియోగిస్తాడనే భావం ఉంది. ‘తన పనికి ఉపయోగించుకుంటాడు’ ఆ స్వాధీనపరచుకునే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైనప్పటికీ సహజమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని ప్రతి స్వామ్య ప్రత్యయాన్ని ప్రతిబింబించేందుకు ‘మీ’ పదాన్ని ప్రతి జాబితా అంశంతో పునరావృతం చేశాం; దాసుడు/సేవకుడు అనే నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
