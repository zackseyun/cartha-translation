    text: లేదా, ‘సేవకులు.’ హీబ్రూ పదం సేవలో ఉన్నవారిని లేదా బానిసలను సూచించగలదు; ఇక్కడ రాజు చేసే బలవంతపు వసూళ్లు, స్వేచ్ఛ కోల్పోవడం అనే సందర్భం ‘బానిసలు’ అనే అర్థాన్ని బలపరుస్తుంది.
    reason: lexical_alternative
