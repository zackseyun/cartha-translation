id: 1SA.8.17
reference: 1 Samuel 8:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: צֹאנְ/כֶ֖ם יַעְשֹׂ֑ר וְ/אַתֶּ֖ם תִּֽהְיוּ ל֥/וֹ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/017.yaml
  text: He will take a tenth of your flocks[a], and you will become his servants.
translation:
  language: te
  text: మీ గొర్రెలూ మేకల మందలో పదోవంతును అతడు తీసుకుంటాడు; మీరు అతనికి బానిసలవుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సేవకులు.’ హీబ్రూ పదం సేవలో ఉన్నవారిని లేదా బానిసలను సూచించగలదు; ఇక్కడ రాజు చేసే బలవంతపు వసూళ్లు, స్వేచ్ఛ కోల్పోవడం అనే సందర్భం ‘బానిసలు’ అనే అర్థాన్ని బలపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנְכֶם
  choice: మీ గొర్రెల, మేకల మందల్లో
  rationale: צֹאן సాధారణంగా గొర్రెలు, మేకలు కలిసిన చిన్న పశువుల మందను సూచిస్తుంది. తెలుగులో రెండింటినీ పేర్కొనడం మూలంలోని సమష్టి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יַעְשֹׂר
  choice: పదోవంతును ... తీసుకుంటాడు
  rationale: ఇక్కడ రాజు విధించే బలవంతపు వసూలు ఉద్దేశించబడింది. ‘దశమభాగం ఇస్తాడు’ లేదా ఆరాధనాసంబంధమైన ‘దశమభాగం చెల్లిస్తాడు’ అనే భావం రాకుండా, రాజే పదోవంతు తీసుకుంటాడని స్పష్టంగా అనువదించబడింది.
- source_word: וְאַתֶּם תִּהְיוּ לוֹ
  choice: మీరు అతనికి ... అవుతారు
  rationale: హీబ్రూ వాక్యం రాజు వసూళ్ల ఫలితంగా ప్రజలు అతని అధీనస్థితిలోకి వస్తారని చెబుతుంది. ‘అవుతారు’ సందర్భంలోని పరిణామ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לַעֲבָדִים
  choice: దాసులు
  rationale: עֲבָדִים అనే పదం సేవకులనూ బానిసలనూ సూచించగలదు. రాజు వల్ల స్వేచ్ఛ కోల్పోయే హెచ్చరిక సందర్భంలో ‘దాసులు’ బలవంతపు అధీనతను తెలియజేస్తూ, తెలుగులో గంభీరంగా మరియు సహజంగా ఉంటుంది.
theological_decisions:
- issue: రాజు అధీనంలో עֲבָדִים అనే స్థితి
  choice: దాసులు
  alternative: సేవకులు; బానిసలు
  rationale: ఈ సందర్భం సాధారణ ఉద్యోగసేవను కాక రాజు చేతిలో ప్రజల స్వేచ్ఛ నశించే బలవంతపు అధీనతను హెచ్చరిస్తుంది. ‘దాసులు’ ఆ తీవ్రతను నిలుపుతుంది; అయితే మూలపదంలోని సేవకులు/బానిసలు అనే అర్థపరిధిని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ‘గొర్రెల, మేకల మందలు’ మూలంలోని చిన్న పశువుల సమష్టి భావాన్ని స్పష్టపరుస్తుంది; ‘దాసులు’ రాజాధీనత తీవ్రతను నిలుపుతుంది.
