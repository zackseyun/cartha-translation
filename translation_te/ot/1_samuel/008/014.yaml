translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. రాజు చర్యలోని బలవంతపు స్వభావాన్ని ‘స్వాధీనం చేసుకుంటాడు’ అని మరింత స్పష్టీకరించకుండా, మూలంలోని సాధారణ ‘తీసుకొను’ క్రియను నిలిపి సందర్భం ద్వారా గ్రహింపజేశాం. రెండు పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
