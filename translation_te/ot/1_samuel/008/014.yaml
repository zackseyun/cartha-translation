id: 1SA.8.14
reference: 1 Samuel 8:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת שְׂ֠דֽוֹתֵי/כֶם וְ/אֶת כַּרְמֵי/כֶ֧ם וְ/זֵיתֵי/כֶ֛ם הַ/טּוֹבִ֖ים יִקָּ֑ח וְ/נָתַ֖ן לַ/עֲבָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/014.yaml
  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
translation:
  language: te
  text: అతడు మీ పొలాలను, మీ ద్రాక్షతోటలను, మీ శ్రేష్ఠమైన ఒలీవ తోటలను[a] తీసుకొని, తన సేవకులకు[b] ఇస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒలీవ చెట్లను’ లేదా ‘ఒలీవ చెట్ల తోటలను’; హెబ్రీ పదం ఇక్కడ వ్యవసాయ ఆస్తిగా ఉన్న ఒలీవ సాగును సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన దాసులకు’; హెబ్రీ పదం సందర్భానుసారం సేవకులను లేదా దాసులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֹתֵיכֶם
  choice: మీ పొలాలను
  rationale: שָׂדֶה సాగుచేసే పొలం లేదా వ్యవసాయ భూభాగాన్ని సూచిస్తుంది. వ్యవసాయ ఆస్తుల జాబితాలో ‘పొలాలు’ నేరుగా, సహజంగా ఉంటుంది.
- source_word: כַּרְמֵיכֶם
  choice: మీ ద్రాక్షతోటలను
  rationale: כֶּרֶם సాధారణంగా ద్రాక్షతోటను సూచిస్తుంది; తెలుగు వ్యవసాయ వాడుకలో ఇదే స్పష్టమైన సమానార్థకం.
- source_word: זֵיתֵיכֶם
  choice: మీ ... ఒలీవ తోటలను
  rationale: זַיִת ఒలీవ చెట్లను సమూహంగా లేదా ఒలీవ సాగుభూమిని సూచించగలదు. పొలాలు, ద్రాక్షతోటలతో సమాంతరంగా ఉన్నందున ఆస్తి స్థాయి భావాన్ని తెలిపే ‘ఒలీవ తోటలు’ అనుకూలం.
- source_word: הַטּוֹבִים
  choice: శ్రేష్ఠమైన
  rationale: טוֹבִים అక్షరార్థంగా ‘మంచివైన’ అని ఉన్నా, రాజు స్వాధీనం చేసుకునే ఆస్తుల సందర్భంలో అత్యుత్తమమైన లేదా అత్యంత విలువైన తోటలను సూచిస్తుంది. ‘శ్రేష్ఠమైన’ ఈ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: יִקָּח
  choice: తీసుకొని
  rationale: לָקַח యొక్క సాధారణ అర్థం ‘తీసుకొను’. బలవంతపు స్వాధీన భావాన్ని సందర్భమే తెలియజేయనిచ్చి, మూలంలోని సరళమైన క్రియను నిలుపుతుంది.
- source_word: וְנָתַן
  choice: ఇస్తాడు
  rationale: נָתַן యొక్క సాధారణ అర్థం ‘ఇచ్చు’; వాక్యంలోని వరుస చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַעֲבָדָיו
  choice: తన సేవకులకు
  rationale: עֶבֶד సందర్భానుసారం సేవకుడు లేదా దాసుడు అని అర్థమవుతుంది. ఇక్కడ రాజుకు చెందిన అధికారులు లేదా పరివారసభ్యులు భావంలో ఉండవచ్చు కాబట్టి ప్రధాన పాఠంలో ‘సేవకులు’ ఎంచుకుని, ‘దాసులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
