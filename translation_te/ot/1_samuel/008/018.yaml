  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: te
  text: ఆ రోజున మీరు మీరు మీకోసం ఎంచుకున్న రాజు వల్ల మొరపెడతారు. అయితే ఆ రోజున యహ్వే మీకు జవాబివ్వడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  choice: మీరు మొరపెడతారు
  rationale: זעק ఆపదలో సహాయం కోసం చేసే తీవ్రమైన విజ్ఞాపనను సూచిస్తుంది. ‘మొరపెడతారు’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: హీబ్రూ కాలసూచక పదబంధానికి సహజమైన, గంభీరమైన తెలుగు రూపం; వాక్యంలో ఉన్న పునరుక్తిని కూడా నిలిపింది.
- source_word: מִלִּפְנֵי
  choice: కారణంగా
  rationale: పదశః ‘సన్నిధి నుండి/ఎదుటి నుండి’ అనే భావం ఉన్నప్పటికీ, ఈ సందర్భంలో రాజు వల్ల కలిగే బాధనే మొరకు కారణంగా తెలియజేస్తుంది.
- source_word: מַלְכְּכֶם
  choice: మీ రాజు
  rationale: స్వామ్యార్థక పదబంధాన్ని నేరుగా, స్పష్టంగా అనువదించింది.
- source_word: אֲשֶׁר בְּחַרְתֶּם לָכֶם
  choice: మీ కోసం మీరు ఎంచుకున్న
  rationale: రాజును కోరుకొని ఎంచుకోవడంలో ఇశ్రాయేలీయుల స్వంత బాధ్యతను, לָכֶם లోని ‘తమ కోసం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: וְלֹא יַעֲנֶה
  choice: అయితే ... జవాబివ్వడు
  rationale: వారి మొరకు దేవుని స్పందన లేకపోవడం మధ్యనున్న వ్యతిరేక భావాన్ని ‘అయితే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: אֶתְכֶם
  choice: మీకు
  rationale: ענה క్రియతో తెలుగు వాడుకలో ‘మీకు జవాబివ్వడు’ సహజంగా ఉంటుంది; హీబ్రూలోని కర్మను భావపరంగా కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలానికి సమీపంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ప్రవచనాత్మక గంభీరతను మరియు ‘ఆ రోజున’ అనే పునరుక్తిని నిలిపింది.
