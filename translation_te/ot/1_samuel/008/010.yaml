translation:
  language: te
  text: అప్పుడు సమూయేలు, తనను ఒక రాజు ఇవ్వమని అడుగుతున్న ప్రజలకు యాహ్వే మాటలన్నిటినీ చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: చెప్పాడు
  rationale: ఈ క్రియకు ప్రాథమిక అర్థం ‘చెప్పాడు’; ‘మాటలన్నిటినీ’ అనే కర్మతో ఇది తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: యెహోవా మాటలన్నిటినీ
  rationale: దైవిక సందేశపు సంపూర్ణతను సూచించే כָּל అనే పదానికి ‘అన్నిటినీ’ అని ఇచ్చి, ‘యెహోవా మాటలు’ అనే మూలంలోని నిర్మాణాన్ని నిలిపింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో పరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- source_word: אֶל הָעָם
  choice: ప్రజలకు
  rationale: אֶל సూచించే గ్రహీత భావాన్ని తెలుగులో సహజమైన సంప్రదాన విభక్తితో వ్యక్తం చేసింది.
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  choice: తనను ఒక రాజును అడుగుతున్న ప్రజలకు
  rationale: వర్తమాన కృదంతం సూచించగల కొనసాగుతున్న లేదా ఆ ప్రజలను లక్షణీకరించే అభ్యర్థనను ‘అడుగుతున్న’ నిలుపుతుంది; מֵאִתּוֹ అభ్యర్థన సమూయేలుకు చేయబడిందని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామమే ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణతో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని ‘యెహోవా మాటలన్నీ’ అనే సంపూర్ణతా ఉద్ఘాటనను, కృదంతంలోని కాలపరమైన సందిగ్ధతను నిలిపింది.
