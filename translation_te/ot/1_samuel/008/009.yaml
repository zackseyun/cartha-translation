  yaml_path: translation/ot/1_samuel/008/009.yaml
  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు వారి మాట విను. అయితే, నీవు వారిని తప్పక హెచ్చరించి, వారిమీద రాజుగా పరిపాలించబోయే రాజు యొక్క వ్యవహార విధానాన్ని[a] వారికి తెలియజేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాజు యొక్క హక్కు,’ ‘రాజు ఆచారం.’ ఇక్కడి హీబ్రూ పదం מִשְׁפַּט (మిష్పాట్) ‘న్యాయం,’ ‘చట్టబద్ధమైన హక్కు,’ లేదా ‘ఆచారబద్ధమైన వ్యవహార విధానం’ అని కూడా అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע בְּקוֹלָם
  choice: వారి మాట విను
  rationale: ఈ హీబ్రూ నుడికారం ఒకరి మాట వినడం లేదా దానికి లోబడడం అనే భావాన్ని ఇస్తుంది. ఇక్కడ ప్రజల అభ్యర్థనను అంగీకరించాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దాన్ని సమర్థించాడనే అర్థాన్ని బలవంతంగా చేర్చదు.
- source_word: אַךְ כִּי
  choice: అయితే
  rationale: ముందున్న ఆజ్ఞకు బలమైన పరిమితి లేదా మినహాయింపును సూచిస్తుంది. ‘అయితే’ తెలుగులో ఆ వ్యతిరేక-పరిమితి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָעֵד תָּעִיד
  choice: గట్టిగా హెచ్చరించి
  rationale: క్రియామూలక నామరూపంతో కూడిన సమాప్త క్రియ చర్యను తీవ్రపరుస్తుంది. ఇక్కడ עוּד హిఫీల్ రూపం గంభీరమైన హెచ్చరిక లేదా సాక్ష్యపూర్వక హెచ్చరిక భావాన్ని కలిగిస్తుంది; ‘గట్టిగా హెచ్చరించి’ దాని తీవ్రతను స్పష్టంగా అందిస్తుంది.
- source_word: בָּהֶם
  choice: వారిని
  rationale: ఈ నిర్మాణంలో హెచ్చరిక ప్రజలవైపు లేదా వారికి వ్యతిరేకంగా ఉద్దేశించబడిందనే ఛాయ ఉండవచ్చు. తెలుగులో ‘వారిని హెచ్చరించి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְהִגַּדְתָּ לָהֶם
  choice: వారికి తెలియజేయాలి
  rationale: נגד హిఫీల్ రూపం చెప్పడం, ప్రకటించడం, తెలియజేయడం అనే అర్థాలను ఇస్తుంది. సందర్భంలోని అధికారిక సూచనకు ‘తెలియజేయాలి’ తగినది.
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  choice: రాజు అనుసరించే విధానం
  rationale: מִשְׁפָּט న్యాయం, తీర్పు, చట్టబద్ధమైన హక్కు, ఆచారం లేదా వ్యవహార విధానం అని అర్థమవుతుంది. తరువాతి వచనాలు రాజు చేసే పనులు, విధించే భారాలను వివరిస్తున్నందున ‘అనుసరించే విధానం’ వివరణాత్మక భావాన్ని నిలుపుతుంది; అవి నైతికంగా లేదా దేవునిచేత సమర్థించబడిన హక్కులని ముందే నిర్ణయించదు.
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  choice: వారిమీద రాజుగా పరిపాలించబోయే
  rationale: מלך ఇక్కడ రాజుగా పరిపాలించడం అనే నిర్దిష్ట రాజసంబంధ భావాన్ని ఇస్తుంది. ‘రాజుగా పరిపాలించబోయే’ ఆ భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: מִשְׁפַּט הַמֶּלֶךְ అనేది రాజుకు ఉన్న చట్టబద్ధమైన హక్కా, లేక రాజు అనుసరించే ఆచారం/విధానమా?
  choice: రాజు అనుసరించే విధానం
  alternative: రాజు యొక్క హక్కు; రాజు యొక్క న్యాయం; రాజు ఆచారం
  rationale: తరువాతి వచనాలు భారమైన రాజ అధికార చర్యలను హెచ్చరికగా వివరిస్తాయి. ‘హక్కు’ లేదా ‘న్యాయం’ అని ప్రధాన పాఠంలో ఉంచితే ఆ చర్యలకు దైవిక లేదా నైతిక ఆమోదం ఉందని సూచించే ప్రమాదం ఉంది. ‘విధానం’ వివరణాత్మక హెచ్చరికను నిలుపుతూ మూలపదంలోని ఇతర అవకాశాలను పాదటిప్పణిలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘వారి మాట విను’ అనే సహజ నుడికారం మూలంలోని శబ్దరూపాన్ని అనవసరంగా కఠినం చేయకుండా భావాన్ని నిలుపుతుంది. ‘తెలియజేయాలి’ ఆజ్ఞ యొక్క బాధ్యతను స్పష్టంగా వ్యక్తం చేస్తుంది.
