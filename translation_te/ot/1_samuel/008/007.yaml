source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל שְׁמַע֙ בְּ/ק֣וֹל הָ/עָ֔ם לְ/כֹ֥ל אֲשֶׁר יֹאמְר֖וּ אֵלֶ֑י/ךָ כִּ֣י לֹ֤א אֹֽתְ/ךָ֙ מָאָ֔סוּ כִּֽי אֹתִ֥/י מָאֲס֖וּ מִ/מְּלֹ֥ךְ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/007.yaml
  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
translation:
  language: te
  text: 'యాహ్వే సమూయేలుతో ఇలా అన్నాడు: “ప్రజలు నీతో చెప్పే ప్రతి మాటను విను. ఎందుకంటే వారు తిరస్కరించింది నిన్ను కాదు; తమపై రాజుగా ఉండకుండా నన్నే తిరస్కరించారు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమపై పరిపాలించకుండా నన్నే తిరస్కరించారు.”
    reason: మూలంలోని מָלַךְ క్రియకు ‘రాజుగా ఉండడం’తో పాటు ‘పరిపాలించడం’ కూడా సమీపమైన అనువాదం కావచ్చని చూపించడానికి.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: שְׁמַע בְּקוֹל הָעָם
  choice: ప్రజల మాట విను
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ప్రజల స్వరాన్ని విను’ అయినప్పటికీ, ఇక్కడ వారి అభ్యర్థనను ఆలకించి అంగీకరించాలనే భావం ఉంది. ‘ప్రజల మాట విను’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘లోబడు’ అని అనువదిస్తే భావాన్ని అవసరానికి మించి నిర్దిష్టం చేస్తుంది.
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  choice: ప్రజలు నీతో చెప్పేదంతా
  rationale: వారి మాటలన్నిటినీ సమగ్రంగా ఆలకించాలనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מָאַס
  choice: తిరస్కరించు
  rationale: ఈ సందర్భంలో వ్యక్తిని, అతని అధికారాన్ని నిరాకరించడాన్ని సూచించే సాధారణమైనప్పటికీ బలమైన తెలుగు పదం.
- source_word: כִּי לֹא אֹתְךָ מָאָסוּ כִּי אֹתִי מָאֲסוּ
  choice: వారు తిరస్కరించింది నిన్ను కాదు; ... నన్నే తిరస్కరించారు
  rationale: మూలంలోని ‘నిన్ను కాదు—నన్నే’ అనే బలమైన వ్యత్యాసాన్ని తెలుగు వాక్య నిర్మాణంలో స్పష్టంగా నిలుపుతుంది.
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  choice: తమపై రాజుగా ఉండకుండా
  rationale: מָלַךְ అనే క్రియలోని ‘రాజుగా ఉండడం/పాలించడం’ అనే భావాన్ని వ్యక్తిగత రాజత్వంపై ఉన్న దృష్టితో నిలుపుతుంది. మִן ఉపసర్గ వల్ల కలిగే ‘అలా చేయనీయకుండా తిరస్కరించడం’ అనే సంబంధాన్ని తెలుగులో సహజంగా తెలిపింది.
theological_decisions:
- issue: మానవ రాజును కోరడంలో దైవిక రాజత్వం తిరస్కరించబడటం
  choice: ప్రజలు సమూయేలును మాత్రమే కాక, తమపై రాజుగా ఉన్న యాహ్వేనే తిరస్కరించారని స్పష్టంగా అనువదించాం.
  alternative: ప్రజలు సమూయేలు నాయకత్వాన్ని మాత్రమే తిరస్కరించారని భావించడం.
  rationale: హీబ్రూ వాక్యం ‘నిన్ను కాదు, నన్నే’ అని ప్రత్యక్షంగా వ్యత్యాసపరచి, వారి కోరికలోని లోతైన అంశం దేవుని రాజత్వ నిరాకరణ అని చెబుతుంది. అదనపు సిద్ధాంత వ్యాఖ్యానం లేకుండా ఆ ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘ప్రజల స్వరం విను’ అనే కఠిన అక్షరానువాదానికి బదులుగా సహజమైన ‘ప్రజల మాట విను’ వాడాం; అయితే ‘నిన్ను కాదు—నన్నే’ అనే మూలంలోని వాక్యబలాన్ని నిలిపాం.
