translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. హీబ్రూ వాక్యంలో రెండుసార్లు వచ్చే ‘పేరు’ నిర్మాణాన్ని నిలిపి, చివరి బహువచన కృదంతాన్ని వారి అధికారిక పాత్రగా స్పష్టంగా అనువదించాం.
