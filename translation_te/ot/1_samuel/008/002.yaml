  yaml_path: translation/ot/1_samuel/008/002.yaml
  text: The name of his firstborn was Joel, and the name of his second was Abijah; they were judges in Beersheba.
translation:
  language: te
  text: అతని మొదటిపుట్టిన కుమారుని పేరు యోవేలు, అతని రెండవ కుమారుని పేరు అబీయా; వారు బెయేర్షెబాలో న్యాయాధిపతులుగా ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי שֶׁם
  choice: పేరు ...
  rationale: ఇది పేరును పరిచయం చేసే హీబ్రూ నిర్మాణం. తెలుగులో సహజంగా ‘పేరు ...’ అనే వాక్యరూపంతో వ్యక్తమవుతుంది.
- source_word: בְּנוֹ הַבְּכוֹר
  choice: అతని మొదటిపుట్టినవాని
  rationale: בְּנוֹ లోని సంబంధాన్ని ‘అతని’ ద్వారా ఉంచి, הַבְּכוֹר యొక్క జననక్రమ భావాన్ని ‘మొదటిపుట్టినవాడు’గా ఖచ్చితంగా తెలిపింది.
- source_word: יוֹאֵל
  choice: యోవేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో లిప్యంతరీకరించింది.
- source_word: מִשְׁנֵהוּ
  choice: రెండవవాని
  rationale: క్రమంలో రెండవ వ్యక్తి అనే భావాన్ని, ముందున్న కుమారుని సూచన పునరుక్తి చేయకుండా సహజ తెలుగులో నిలిపింది.
- source_word: אֲבִיָּה
  choice: అబీయా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా, తెలుగులో గుర్తించదగిన రూపాన్ని ఉపయోగించింది.
- source_word: שֹׁפְטִים
  choice: న్యాయాధిపతులుగా ఉన్నారు
  rationale: బహువచన కృదంతం సూచించే వారి కొనసాగుతున్న బాధ్యత లేదా పదవిని స్పష్టంగా తెలిపింది.
- source_word: בִּבְאֵר שָׁבַע
  choice: బెయేర్షెబాలో
  rationale: స్థలసూచక בְּ ను ‘లో’తో వ్యక్తపరచి, ప్రదేశనామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
