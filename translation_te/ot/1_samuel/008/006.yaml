base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/006.yaml
  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
translation:
  language: te
  text: “మాకు న్యాయం తీర్చడానికి[b] ఒక రాజును ఇవ్వండి” అని వారు అన్నప్పుడు, ఆ విషయం సమూయేలు దృష్టిలో చెడ్డదిగా అనిపించింది.[a] అప్పుడు సమూయేలు యాహ్వేకు ప్రార్థించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ఆ విషయం సమూయేలు దృష్టిలో “చెడ్డది” లేదా “దుష్టమైనది” అని ఉంది; ఇది అతని బలమైన ప్రతికూల మూల్యాంకనాన్ని వ్యక్తం చేస్తుంది. “సమూయేలుకు ఆ విషయం నచ్చలేదు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మాకు న్యాయం తీర్చడానికి” అనే మాటకు “మమ్మల్ని పరిపాలించడానికి” లేదా “మమ్మల్ని ఏలడానికి” అనే విస్తృత భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: చెడ్డదిగా అనిపించింది
  rationale: రָעַע క్రియలోని బలమైన ప్రతికూల మూల్యాంకనాన్ని ‘చెడ్డదిగా’ నిలుపుతూ, తెలుగు వాక్యప్రయోగంలో సహజంగా ఉండేందుకు ‘అనిపించింది’ అని ఇచ్చాం.
- source_word: הַדָּבָר
  choice: ఆ విషయం
  rationale: דָּבָר ఇక్కడ ముందుగా చెప్పబడిన ప్రతిపాదనను సూచించే విస్తృత పదం; ‘విన్నపం’ అని అర్థాన్ని ముందుగానే కుదించకుండా ‘విషయం’ అని అనువదించాం.
- source_word: בְּעֵינֵי שְׁמוּאֵל
  choice: సమూయేలు దృష్టిలో
  rationale: ఇది సమూయేలు చేసిన మూల్యాంకనమని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: כַּאֲשֶׁר אָמְרוּ
  choice: అని వారు అన్నప్పుడు
  rationale: כַּאֲשֶׁר ఇక్కడ కాలసంబంధాన్ని సూచించగలదు; కారణార్థాన్ని అతిగా నిర్ధారించకుండా ‘అన్నప్పుడు’ అని ఇచ్చాం.
- source_word: תְּנָה לָּנוּ
  choice: మాకు ... ఇవ్వండి
  rationale: ఆజ్ఞార్థక రూపంలోని נָתַן పదానికి నేరమైన, సహజమైన సమానార్థం.
- source_word: מֶלֶךְ
  choice: ఒక రాజు
  rationale: ఈ సందర్భంలో מֶלֶךְ పదానికి సాధారణమైన తెలుగు అనువాదం.
- source_word: לְשָׁפְטֵנוּ
  choice: మాకు న్యాయం తీర్చడానికి
  rationale: שׁפט పదంలోని ‘తీర్పు తీర్చు’ భావాన్ని, అలాగే న్యాయాధిపతుల గ్రంథంతోనూ సమూయేలు పాత్రతోనూ ఉన్న పదసంబంధాన్ని నిలుపుతుంది; పరిపాలనా భావం పాదసూచికలో ఇవ్వబడింది.
- source_word: וַיִּתְפַּלֵּל
  choice: ప్రార్థించాడు
  rationale: פלל హిత్పయేల్ రూపానికి సాధారణమైన అర్థం ‘ప్రార్థించు’; ‘విజ్ఞాపన చేశాడు’ అనడం సందర్భాన్ని అవసరానికి మించి నిర్దిష్టం చేస్తుంది.
- source_word: אֶל יְהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించి, אֶל సంబంధాన్ని ‘-కు’ విభక్తితో సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో నిలిపాం.
- issue: וַיֵּרַע లో సమూయేలు చేసిన ప్రతికూల మూల్యాంకన బలం
  choice: సమూయేలు దృష్టిలో చెడ్డదిగా అనిపించింది
  alternative: సమూయేలుకు నచ్చలేదు
  rationale: మూలంలోని ‘చెడు’ అనే నైతిక-మూల్యాంకన పదబలాన్ని నిలుపుతూ, ఇది సమూయేలు దృష్టికోణమని స్పష్టంగా ఉంచాం; కేవలం భావోద్వేగ అసంతృప్తిగా సున్నితపరచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ మూలంలోని మూల్యాంకన బలాన్ని, ‘న్యాయం తీర్చు/పరిపాలించు’ అనే అర్థవిస్తృతిని పాదసూచికలతో కాపాడాం.
