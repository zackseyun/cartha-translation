    rationale: The English POB theological decision explicitly identifies Yahweh as the project default for יהוה. “యెహోవా” represents a different traditional vocalization and does not follow that audit trail.
  - severity: low
    issue: Footnote a says the Hebrew literally states that the matter “చెడ్డది అయింది” (became bad).
    rationale: וַיֵּרַע here means that the matter was bad/evil in Samuel’s eyes, not that it became bad. The note should state this without introducing a change-of-state nuance.
