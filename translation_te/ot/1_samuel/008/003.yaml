source:
  edition: WLC
  text: וְ/לֹֽא הָלְכ֤וּ בָנָי/ו֙ ב/דרכ/ו וַ/יִּטּ֖וּ אַחֲרֵ֣י הַ/בָּ֑צַע וַ/יִּ֨קְחוּ שֹׁ֔חַד וַ/יַּטּ֖וּ מִשְׁפָּֽט־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
translation:
  language: te
  text: కాని అతని కుమారులు అతని మార్గంలో నడవలేదు. వారు అక్రమ లాభాన్ని వెంబడించి[a], లంచాలు తీసుకొని, న్యాయాన్ని వక్రీకరించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అన్యాయ లాభాన్ని వెంబడించి’ లేదా ‘లోభాన్ని వెంబడించి.’ హీబ్రూ పదం తప్పు పద్ధతిలో లేదా ఇతరులను దోచుకొని సంపాదించే లాభాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తీర్పును పక్కకు తిప్పారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... בִדְרָכָיו
  choice: అతని మార్గాల్లో నడవలేదు
  rationale: הלך + בְּדֶּרֶךְ అనే హీబ్రూ నుడికారం ఒకరి ప్రవర్తనా విధానాన్ని అనుసరించడాన్ని సూచిస్తుంది. ‘మార్గాల్లో నడవడం’ అనే రూపకం తెలుగులోనూ సహజంగా, అర్థవంతంగా ఉంటుంది.
- source_word: וַיִּטּוּ
  choice: పక్కదారి పట్టి
  rationale: נטה ఇక్కడ సరైన మార్గం నుంచి తొలగిపోవడాన్ని సూచిస్తుంది. ‘పక్కదారి పట్టి’ నైతిక విచలనాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַחֲרֵי הַבָּצַע
  choice: అక్రమ లాభం కోసం
  rationale: בצע ఈ సందర్భంలో అన్యాయమైన లేదా దోపిడీతో కూడిన సంపాదనను సూచిస్తుంది. ‘అక్రమ లాభం’ దాని ఆర్థిక, నైతిక పార్శ్వాలను రెండింటినీ నిలుపుతుంది.
- source_word: וַיִּקְחוּ שֹׁחַד
  choice: లంచాలు తీసుకొని
  rationale: שֹׁחַד న్యాయపరమైన సందర్భంలో ప్రత్యేకంగా లంచాన్ని సూచిస్తుంది. ఇది వారి అలవాటైన అవినీతి ప్రవర్తనగా వర్ణించబడుతున్నందున తెలుగులో బహువచనం సహజం.
- source_word: וַיַּטּוּ מִשְׁפָּט
  choice: న్యాయాన్ని వక్రీకరించారు
  rationale: ఈ హీబ్రూ నుడికారం న్యాయతీర్పును తప్పుదోవ పట్టించడం లేదా న్యాయాన్ని వక్రీకరించడం అనే భావం ఇస్తుంది. ఎంపిక చేసిన పదబంధం న్యాయస్థాన సంబంధమైన బలాన్ని నిలుపుతుంది.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం పురుష బహువచనంలో ఉండి, సందర్భంలో సమూయేలు కుమారులనే సూచిస్తుంది.
theological_decisions:
- issue: సమూయేలు కుమారుల నైతిక, న్యాయపరమైన అవినీతి
  choice: అక్రమ లాభం, లంచాలు, న్యాయ వక్రీకరణ అనే మూడు న్యాయపరమైన ఆరోపణలనూ స్పష్టంగా ఉంచడం
  alternative: ‘వారు లోభులై అన్యాయంగా ప్రవర్తించారు’ వంటి సాధారణ నైతిక వర్ణన
  rationale: మూల హీబ్రూ అక్రమ సంపాదనను వెంబడించడం, లంచాలు తీసుకోవడం, న్యాయాన్ని వక్రీకరించడం అనే నిర్దిష్టమైన న్యాయ అవినీతి పదాలను వరుసగా ఉపయోగిస్తుంది. వాటిని సాధారణ దుష్ప్రవర్తనగా మృదువు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ ‘నడవడం’ రూపకాన్ని నిలిపి, న్యాయ అవినీతికి సంబంధించిన పదాలను స్పష్టంగా అనువదించాం. సంప్రదింపుల ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వివరణలకు సరిపోని చోట్ల ఉన్నందున, తెలుగులో [a]ను ‘అక్రమ లాభం’ వద్ద, [b]ను ‘న్యాయాన్ని వక్రీకరించారు’ వద్ద ఉంచాం.
