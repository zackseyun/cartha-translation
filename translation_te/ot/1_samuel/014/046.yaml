translation:
  language: te
  text: అప్పుడు సౌలు ఫిలిష్తీయులను వెంబడించడం ఆపి పైకి వెళ్లాడు[a]. ఫిలిష్తీయులు తమ స్థలానికి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా, ‘సౌలు ఫిలిష్తీయులను వెంబడి వెళ్లడం నుండి పైకి వెళ్లాడు.’ ఇక్కడి హీబ్రూ ప్రయోగం అతడు వారిని వెంబడించడం విరమించాడనే భావాన్ని కూడా ఇస్తుంది. మరో అనువాదం: ‘సౌలు ఫిలిష్తీయులను వెంబడించడం నుండి వెనుదిరిగాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: మానుకున్నాడు
  rationale: עלה అనే క్రియకు అక్షరార్థంగా ‘పైకి వెళ్లాడు’ అనే భావం ఉన్నా, מֵאַחֲרֵי తో కూడిన ఈ సైనిక సందర్భంలో వెంబడింపును విరమించడాన్ని సూచిస్తుంది. తెలుగులో ‘వెంబడించడం మానుకున్నాడు’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֵאַחֲרֵי
  choice: వెంబడించడం
  rationale: మִן + אַחֲרֵי అక్షరార్థంగా ‘వెనుకనుండి/వెనుక వెళ్లడం నుండి’; యుద్ధ సందర్భంలో శత్రువును వెంబడించడాన్ని సూచిస్తుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహపు పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: הָלְכוּ
  choice: వెళ్లిపోయారు
  rationale: הלך యొక్క ప్రాథమిక భావం ‘వెళ్లు’. సందర్భంలో అక్కడి నుండి నిష్క్రమించడాన్ని సహజంగా వ్యక్తం చేయడానికి ‘వెళ్లిపోయారు’ ఎంచుకోబడింది; ‘తిరిగి వెళ్లారు’ అనే భావాన్ని మూలపదం తప్పనిసరిగా నిర్దేశించదు.
- source_word: לִמְקוֹמָם
  choice: తమ స్థలానికి
  rationale: מָקוֹם అంటే ‘స్థలం’; మూడవ పురుష బహువచన ప్రత్యయం ‘వారి/తమ’ను సూచిస్తుంది. ‘ఇంటికి’ అనడం మూలంలో లేని నిర్దిష్టతను చేర్చుతుంది.
