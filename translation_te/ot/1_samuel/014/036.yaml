id: 1SA.14.36
reference: 1 Samuel 14:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֡וּל נֵרְדָ֣ה אַחֲרֵי֩ פְלִשְׁתִּ֨ים לַ֜יְלָה וְֽ/נָבֹ֥זָה בָ/הֶ֣ם עַד א֣וֹר הַ/בֹּ֗קֶר וְ/לֹֽא נַשְׁאֵ֤ר בָּ/הֶם֙ אִ֔ישׁ וַ/יֹּ֣אמְר֔וּ כָּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵׂ֑ה וַ/יֹּ֨אמֶר֙ הַ/כֹּהֵ֔ן נִקְרְבָ֥ה הֲלֹ֖ם אֶל הָ/אֱלֹהִֽים׀׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
translation:
  language: te
  text: అప్పుడు సౌలు, “రాత్రివేళ ఫిలిష్తీయుల వెంట దిగి వెళ్లి, తెల్లవారేవరకు వారిని దోచుకుందాం; వారిలో ఒక్క మనిషినీ మిగల్చకుండా ఉండుదాం” అన్నాడు. అందుకు వారు, “నీ దృష్టికి ఏది మంచిదో అది చేయి” అన్నారు. అయితే యాజకుడు, “మనం ఇక్కడ దేవుని దగ్గరకు చేరుదాం[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మనం ఇక్కడ దేవుని సన్నిధికి చేరుదాం.” యాజకుని మాటలు, ముందుకు సాగేముందు దేవుని మార్గదర్శకత్వం కోరాలని సూచిస్తున్నట్లు ఉండవచ్చు.
    reason: ‘సమీపించు’ అనే మూలపదానికి సహజమైన ప్రత్యామ్నాయాన్ని ఇచ్చి, సందర్భంలోని సంభావ్య అంతర్భావాన్ని నిర్దిష్ట ఆచారంగా తేల్చకుండా వివరిస్తుంది.
lexical_decisions:
- source_word: נֵרְדָה
  choice: దిగి వెళ్లి
  rationale: ירד అనే క్రియలోని ‘దిగడం’ అనే దిశాసూచక భావాన్ని నిలుపుతూ, ప్రతిపాదనగా సహజమైన తెలుగు వాక్యనిర్మాణంలో ఇచ్చింది.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల వెంట
  rationale: אַחֲרֵי యొక్క ప్రాథమిక ‘వెంట/వెనుక’ భావాన్నీ, ఈ యుద్ధ సందర్భంలోని తరుమడాన్నీ సూచిస్తుంది.
- source_word: לַיְלָה
  choice: రాత్రివేళ
  rationale: దాడి జరగాల్సిన సమయాన్ని తెలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘ఈ రాత్రి’ అనే భావాన్ని చేర్చదు.
- source_word: וְנָבֹזָה בָהֶם
  choice: వారిని దోచుకుందాం
  rationale: בזז యొక్క దోచుకోవడం/కొల్లగొట్టడం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: తెల్లవారేవరకు
  rationale: ‘ఉదయపు వెలుగు వచ్చేవరకు’ అనే భావానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: וְלֹא נַשְׁאֵר בָּהֶם אִישׁ
  choice: వారిలో ఒక్కణ్ణి కూడా మిగలనివ్వవద్దు
  rationale: ఒక్క పురుషుడినీ మిగల్చకూడదనే సంపూర్ణతను నిలుపుతుంది; మూలంలో లేని ‘సజీవంగా’ అనే పదాన్ని చేర్చదు.
- source_word: כָּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: నీ దృష్టికి ఏది మంచిదో అది చేయి
  rationale: వ్యక్తిగత నిర్ణయం లేదా సమ్మతిని తెలిపే హీబ్రూ నుడికారంలోని ‘నీ కళ్లలో’ అనే రూపకాన్ని సహజమైన తెలుగు ‘నీ దృష్టికి’తో నిలుపుతుంది.
- source_word: נִקְרְבָה הֲלֹם אֶל הָאֱלֹהִים
  choice: మనం ఇక్కడ దేవుని సన్నిధికి చేరుదాం
  rationale: קרב లోని సమీపించడం అనే భావాన్నీ, הֲלֹם లోని ‘ఇక్కడ’ అనే సూచననూ నిలుపుతుంది; నిర్దిష్టమైన ఆచారాన్ని అనువాదంలో చేర్చదు.
theological_decisions:
- issue: యుద్ధానికి ముందు దేవుని మార్గదర్శకత్వం కోరడం అనే అంతర్భావం
  choice: దేవుని సన్నిధికి చేరుదాం
  alternative: ఇక్కడ దేవుని విచారిద్దాం
  rationale: సందర్భంలో యాజకుని మాటలు దేవుని మార్గదర్శకత్వం కోరడాన్ని సూచించవచ్చు. అయినా హీబ్రూలో ‘విచారించు’ అనే నిర్దిష్ట క్రియ లేదు; కాబట్టి మూలంలోని ‘సమీపించు’ అనే మాటనే నిలిపి, ఆచారపద్ధతిని నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘నీ దృష్టికి’ మరియు ‘దేవుని సన్నిధికి’ వంటి పదబంధాలు మూలభాష రూపకాన్ని, ధార్మిక గంభీరతను అతిశయోక్తి లేకుండా నిలుపుతాయి.
