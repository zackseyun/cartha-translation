- from: బెన్యామీను ప్రాంతంలోని గిబియాలో ఉన్న సౌలు కాపలాదారులు చూశారు. ఇదిగో, ఆ జనసమూహం చెదిరిపోతూ అటూ ఇటూ కదులుతోంది.[a]
  to: బెన్యామీను గిబియాలో ఉన్న సౌలు కాపలాదారులు చూశారు, ఇదిగో, ఆ జనసమూహం చెదిరిపోతూ అటూ ఇటూ కదులుతోంది.[a]
