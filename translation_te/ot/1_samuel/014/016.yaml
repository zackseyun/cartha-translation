  edition: WLC
  text: וַ/יִּרְא֤וּ הַ/צֹּפִים֙ לְ/שָׁא֔וּל בְּ/גִבְעַ֖ת בִּנְיָמִ֑ן וְ/הִנֵּ֧ה הֶ/הָמ֛וֹן נָמ֖וֹג וַ/יֵּ֥לֶךְ וַ/הֲלֹֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/016.yaml
  text: And Saul’s watchmen in Gibeah of Benjamin looked[a], and behold, the multitude was melting away, and it went here and there.
translation:
  language: te
  text: బెన్యామీను గిబియాలో ఉన్న సౌలు కాపలాదారులు చూశారు, ఇదిగో, ఆ జనసమూహం చెదిరిపోతూ అటూ ఇటూ కదులుతోంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ జనసమూహం కరిగిపోతూ అటూ ఇటూ పోతోంది.” హీబ్రూ వాక్యం చాలా సంక్షిప్తంగా ఉండి, ఫిలిష్తీయుల మధ్య కంటికి కనిపించే గందరగోళాన్ని చిత్రిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפִים
  choice: కాపలాదారులు
  rationale: צפה ధాతువు నుంచి వచ్చిన ఈ కర్తృవాచక రూపం గమనించడానికి నియమించబడిన వారిని సూచిస్తుంది. సైనిక సందర్భంలో ‘కాపలాదారులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: לְשָׁאוּל
  choice: సౌలు కాపలాదారులు
  rationale: ఇక్కడ לְ అనుబంధం లేదా చెందిన సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘సౌలు కాపలాదారులు’ అని చెప్పడం సహజమైన స్వామ్యార్థాన్ని ఇస్తుంది.
- source_word: בְּגִבְעַת בִּנְיָמִן
  choice: బెన్యామీను ప్రాంతంలోని గిబియాలో
  rationale: స్థలపేరును స్పష్టంగా తెలియజేస్తూ, గిబియా బెన్యామీనుతో సంబంధించినదని ఆధునిక తెలుగు పాఠకునికి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా కనిపించిన దృశ్యంపై దృష్టి నిలిపే హీబ్రూ సంభాషణా సూచకంలోని సజీవతను నిలుపుతుంది.
- source_word: הֶהָמוֹן
  choice: ఆ జనసమూహం
  rationale: ఈ పదం పెద్ద గుంపు లేదా కోలాహలభరిత సమూహాన్ని సూచించగలదు. సందర్భంలో ఫిలిష్తీయుల సమూహాన్ని సూచిస్తున్నా, మూలంలో లేని ‘సైన్యం’ అనే నిర్దిష్టతను చేర్చకుండా విస్తృత సమూహార్థాన్ని నిలుపుతుంది.
- source_word: נָמוֹג
  choice: చెదిరిపోతూ
  rationale: మూల క్రియకు అక్షరార్థంగా ‘కరిగిపోవడం’ అనే బింబం ఉంది; సైనిక గుంపు ఐక్యత కోల్పోతున్న దృశ్యాన్ని సహజ తెలుగులో ‘చెదిరిపోతూ’ తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ
  choice: కదులుతోంది
  rationale: ఏకవచన క్రియ సామూహిక నామమైన הֶהָמוֹן‌ను అనుసరిస్తుంది. తెలుగులో గుంపు కదలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַהֲלֹם
  choice: అటూ ఇటూ
  rationale: కదలికను తెలిపే క్రియతో కలిసి ఈ సందర్భంలో వివిధ దిశల్లో గందరగోళంగా కదలడాన్ని సూచిస్తుంది; ‘అటూ ఇటూ’ ఆధునిక తెలుగులో సహజమైన వ్యక్తీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలుపుతూ, ‘నమోగ్’ అనే కరిగిపోవడం/ఐక్యత కోల్పోవడం బింబాన్ని ప్రధాన వచనంలో సహజమైన ‘చెదిరిపోతూ’తో, పాదటిప్పణిలో మరింత అక్షరార్థమైన ప్రత్యామ్నాయంతో చూపించాం.
