translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. సంభాషణ స్పష్టత కోసం ప్రత్యక్ష వాక్యాన్ని ఉంచి, భూభాగంలోని పైకి వెళ్లే భావాన్ని ‘ఎక్కి వెళ్లం’ ద్వారా కాపాడాం.
