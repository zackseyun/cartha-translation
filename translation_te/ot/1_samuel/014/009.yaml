id: 1SA.14.9
reference: 1 Samuel 14:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם כֹּ֤ה יֹֽאמְרוּ֙ אֵלֵ֔י/נוּ דֹּ֕מּוּ עַד הַגִּיעֵ֖/נוּ אֲלֵי/כֶ֑ם וְ/עָמַ֣דְנוּ תַחְתֵּ֔י/נוּ וְ/לֹ֥א נַעֲלֶ֖ה אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/009.yaml
  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
translation:
  language: te
  text: వారు మనతో, ‘మేము మీ దగ్గరకు వచ్చేంతవరకు కదలకుండా ఉండండి[a]’ అని చెబితే, మనం ఉన్న చోటే నిలిచి ఉంటాం[b]; వారి దగ్గరకు ఎక్కి వెళ్లము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిశ్చలంగా ఉండండి’ లేదా ‘వేచి ఉండండి.’ హీబ్రూ క్రియ ఆ స్థానంలో కదలకుండా లేదా మౌనంగా ఉండడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మన కిందనే నిలబడతాం’; ఇది ‘మన స్థానంలోనే ఉంటాం’ అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: చెబితే
  rationale: యోనాతాను ప్రతిపాదించిన సూచనలోని షరతును తెలుగులో సహజమైన షరతార్థక క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: כֹּה יֹאמְרוּ אֵלֵינוּ
  choice: వారు మనతో … అని చెబితే
  rationale: כֹּה ప్రత్యక్ష వాక్యంలోని విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘… అని చెబితే’ అనే నిర్మాణం దాని భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: דֹּמּוּ
  choice: అక్కడే కదలకుండా ఉండండి
  rationale: דמם అనే క్రియకు నిశ్చలంగా లేదా మౌనంగా ఉండడం అనే భావాలు ఉన్నాయి. ఈ సైనిక సందర్భంలో ముందుకు రాకుండా తమ స్థానంలో ఉండాలనే కార్యార్థం ప్రధానంగా కనిపిస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: עַד הַגִּיעֵנוּ אֲלֵיכֶם
  choice: మేము మీ దగ్గరకు వచ్చేంతవరకు
  rationale: ఫిలిష్తీయులు యోనాతాను, అతని ఆయుధవాహకుని దగ్గరకు చేరడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְעָמַדְנוּ תַחְתֵּינוּ
  choice: మనం ఉన్న చోటే నిలిచి ఉంటాం
  rationale: תַחְתֵּינוּ అక్షరార్థంగా ‘మన కింద’ అయినా, ఇక్కడ తమ స్థానంలోనే ఉండడాన్ని తెలిపే నుడికారంగా వాడబడింది. తెలుగు అనువాదం ఆ నుడికారార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  choice: వారి దగ్గరకు ఎక్కి వెళ్లం
  rationale: עלה లోని పైకి వెళ్లే భౌగోళిక భావాన్ని ‘ఎక్కి వెళ్లం’ నిలుపుతుంది; దానిని తప్పనిసరిగా ‘దాడి చేయడం’గా వ్యాఖ్యానించదు.
