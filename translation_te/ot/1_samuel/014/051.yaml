  yaml_path: translation/ot/1_samuel/014/051.yaml
  text: Kish was the father of Saul[a], and Ner was the father of Abner, the son of Abiel.
translation:
  language: te
  text: కీషు సౌలుకు తండ్రి; నేరు అబీయేలు కుమారుడు, అబ్నేరుకు తండ్రి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: “నేరు అబ్నేరు తండ్రి, అబీయేలు కుమారుడు.” హీబ్రూ వాక్యక్రమంలో చివరి పదబంధం నేరు గురించి చెప్పబడింది.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: וְ/קִישׁ
  choice: కీషు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం; ఆరంభ וְ వంశావళి కొనసాగింపును సూచించినా, తెలుగులో సహజంగా ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: אֲבִי שָׁאוּל
  choice: సౌలు తండ్రి
  rationale: אֲבִי అనేది ‘తండ్రి’ అనే పదం యొక్క నిర్మాణరూపం. హీబ్రూ క్రియారహిత వంశావళి వాక్యాన్ని తెలుగులో సహజమైన నామవాచక వాక్యంగా ఉంచాం.
- source_word: וְ/נֵר אֲבִי אַבְנֵר
  choice: నేరు అబ్నేరు తండ్రి
  rationale: సమాంతర వంశావళి నిర్మాణాన్ని స్పష్టంగా, సహజంగా అనువదించాం.
- source_word: בֶּן אֲבִיאֵל
  choice: కీషు, నేరు అబీయేలు కుమారులు
  rationale: హీబ్రూ ఏకవచన ‘అబీయేలు కుమారుడు’ వ్యాకరణపరంగా దగ్గరలోని అబ్నేరు లేదా నేరు వైపు అన్వయించగలదు. అయితే 1 సమూయేలు 9:1తో పాటు సమీప వంశావళి సందర్భం కీషు, నేరు ఇద్దరూ అబీయేలు కుమారులని సూచిస్తుంది; తెలుగు వాక్యం ఆ ఉద్దేశాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: ‘అబీయేలు కుమారుడు’ అనే ఏకవచన పదబంధం ఎవరికి అన్వయించాలి?
  choice: కీషు, నేరు ఇద్దరూ అబీయేలు కుమారులని ప్రధాన పాఠంలో స్పష్టం చేయడం
  alternative: దగ్గరలోని పేరుతో కలిపి ‘అబ్నేరు, అబీయేలు కుమారుడు’ లేదా ‘నేరు, అబీయేలు కుమారుడు’ అని చదవడం
  rationale: హీబ్రూ వాక్య నిర్మాణంలో సంక్షిప్తత వల్ల అనిశ్చితి ఉంది. 1 సమూయేలు 9:1లో కీషు అబీయేలు కుమారుడని చెప్పబడటం, 14:50–51 వంశసంబంధాల ఉద్దేశం, కీషు-నేరు సోదరులని గ్రహించడానికి బలమైన సందర్భ ఆధారాలు ఇస్తాయి. అయినా మూలంలోని రూపాత్మక అస్పష్టతను పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి వాడబడింది. పేర్లకు కీషు, సౌలు, నేరు, అబ్నేరు, అబీయేలు అనే సుపరిచిత తెలుగు రూపాలు ఎంచుకున్నాం. మూలంలోని అస్పష్ట అన్వయాన్ని ప్రధాన పాఠంలో సందర్భానుసారంగా స్పష్టం చేసి, పాదసూచికలో నిజమైన వ్యాకరణ ప్రత్యామ్నాయాన్ని సంరక్షించాం.
