  language: te
  text: 'యోనాతాను ఇలా అన్నాడు: “చూడు, మనం ఆ మనుష్యుల దగ్గరికి దాటివెళ్లి, మనల్ని మనం వారికి చూపించుకుంటాం[a].”'
  philosophy: optimal-equivalence
  footnotes:
