lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే సాధారణ హీబ్రూ కథన రూపాన్ని సహజమైన తెలుగు కథన శైలిలో అందిస్తుంది.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הִנֵּה
  choice: చూడు
  rationale: యోనాతాను చెప్పబోయే కార్యాచరణపై సహచరుని దృష్టిని మళ్లించే సంభాషణాత్మక ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲנַחְנוּ
  choice: మనం
  rationale: మాట్లాడేవాడినీ అతనితో ఉన్న వ్యక్తినీ కలుపుకునే ప్రథమ పురుష బహువచనాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֹבְרִים
  choice: దాటివెళ్లి
  rationale: עבר అనే క్రియలోని అవతలి వైపుకు వెళ్లే భావాన్ని నిలుపుతూ, వెంటనే చేయబోయే చర్యగా సహజమైన తెలుగు వాక్య నిర్మాణంలో అందిస్తుంది.
- source_word: אֶל הָאֲנָשִׁים
  choice: ఆ మనుష్యుల దగ్గరికి
  rationale: సందర్భంలో ఇప్పటికే గుర్తించబడిన ఫిలిష్తీయుల గుంపును నిర్దిష్టంగా సూచిస్తుంది; אֶל లోని దిశాభావాన్ని ‘దగ్గరికి’ తెలియజేస్తుంది.
- source_word: וְנִגְלִינוּ
  choice: వారికి కనబడతాం
  rationale: גלה నిఫాల్ రూపం ఇక్కడ ఉద్దేశపూర్వకంగా తమను కనిపించేలా చేసుకోవడం లేదా ప్రత్యక్షం కావడం అనే భావాన్ని ఇస్తుంది. ‘వారికి కనబడతాం’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని కాపాడుతుంది.
- source_word: אֲלֵיהֶם
  choice: వారికి
  rationale: తమను ఎవరికీ కనిపించేలా చేసుకుంటారో తెలిపే లక్ష్యాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
