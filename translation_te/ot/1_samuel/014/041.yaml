source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֗וּל אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הָ֣בָ/ה תָמִ֑ים וַ/יִּלָּכֵ֧ד יוֹנָתָ֛ן וְ/שָׁא֖וּל וְ/הָ/עָ֥ם יָצָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
translation:
  language: te
  text: 'అప్పుడు సౌలు ఇశ్రాయేలు దేవుడైన యాహ్వేతో ఇలా అన్నాడు: “లోపంలేని చీటిని ఇవ్వు[a].” అప్పుడు యోనాతాను, సౌలు చీటిలో ఎంపికయ్యారు; ప్రజలు తప్పించుకున్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “సంపూర్ణమైనది/లోపంలేనిది ఇవ్వు.” ఇక్కడ చీటి ద్వారా సందేహానికి తావులేని నిర్ణయాన్ని ఇవ్వమని కోరుతున్నట్లు భావించవచ్చు. సెప్టువజింటులో భద్రపరచబడిన దీర్ఘ ప్రాచీన పాఠం ఇలా ఉంది: “ఈ రోజు నీ సేవకునికి నీవెందుకు జవాబివ్వలేదు? ఈ అపరాధం నాలో గాని నా కుమారుడైన యోనాతానులో గాని ఉంటే, ఇశ్రాయేలు దేవుడైన యాహ్వే, ఊరీమును ఇవ్వు; అది నీ ప్రజలైన ఇశ్రాయేలులో ఉంటే, తుమ్మీమును ఇవ్వు.”'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הָבָה
  choice: ఇవ్వు
  rationale: దేవునికి చేసిన ప్రత్యక్ష విజ్ఞప్తిలోని ఆజ్ఞార్థక రూపాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: תָמִים
  choice: నిర్దోషమైన చీటి
  rationale: ఈ పదానికి ‘సంపూర్ణమైన, లోపంలేని, నిర్దోషమైన’ అనే భావాలు ఉన్నాయి. సందర్భం చీటి వేయడం గురించినది కాబట్టి ‘చీటి’ని స్పష్టత కోసం చేర్చాం; అయినా మూలంలోని సంక్షిప్తతను, అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: וַיִּלָּכֵד
  choice: పట్టుబడ్డారు
  rationale: చీటి ద్వారా గుర్తించబడటం లేదా వేరుచేయబడటం అనే న్యాయనిర్ణయ సందర్భంలోని భావాన్ని, అతిగా వివరించకుండా హీబ్రూ నుడికారానికి దగ్గరగా ఉంచుతుంది.
- source_word: יָצָאוּ
  choice: తప్పించుకున్నారు
  rationale: ‘పట్టుబడ్డారు’ అనే ముందరి క్రియకు వ్యతిరేకంగా, ప్రజలు చీటి ద్వారా ఎంపిక కాలేదనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: సౌలు ప్రార్థన యొక్క పాఠరూపం
  choice: మసొరెటిక్ పాఠంలోని సంక్షిప్త రూపమైన ‘నిర్దోషమైన చీటిని ఇవ్వు’ను ప్రధాన పాఠంలో ఉంచడం
  alternative: సెప్టువజింటులో భద్రపరచబడిన, ఊరీము–తుమ్మీమును ప్రస్తావించే దీర్ఘ పాఠం
  rationale: అందించిన హీబ్రూ మూలపాఠానికి ప్రాధాన్యం ఇచ్చాం. అయితే ప్రాచీనమైన దీర్ఘ పాఠం ఈ కఠినమైన సంక్షిప్త వాక్యాన్ని వివరించవచ్చు కాబట్టి దానిని ప్రధాన పాఠంలో కలపకుండా పాదసూచికలో పారదర్శకంగా ఇచ్చాం.
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడాం. మూలపాఠంలోని చీటి-నిర్ణయ నుడికారాన్ని పూర్తిగా వివరణాత్మకంగా మార్చకుండా, అవసరమైన స్పష్టతను పాదసూచికలో అందించాం.
