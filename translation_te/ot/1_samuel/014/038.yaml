source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל גֹּ֣שֽׁוּ הֲלֹ֔ם כֹּ֖ל פִּנּ֣וֹת הָ/עָ֑ם וּ/דְע֣וּ וּ/רְא֔וּ בַּ/מָּ֗ה הָֽיְתָ֛ה הַ/חַטָּ֥את הַ/זֹּ֖את הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
translation:
  language: te
  text: 'అప్పుడు సౌలు ఇలా అన్నాడు: “ప్రజల ప్రముఖులారా, మీరందరూ ఇక్కడికి రండి; ఈ రోజు ఈ పాపం దేనివల్ల జరిగిందో తెలుసుకోండి, చూడండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  choice: ఇక్కడికి దగ్గరగా రండి
  rationale: నגשׁ బహువచన ఆజ్ఞతో పాటు הֲלֹם సౌలు ఉన్న చోటుకు సమీపించమనే పిలుపును సూచిస్తుంది; ఈ తెలుగు రూపం సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: כֹּל פִּנּוֹת הָעָם
  choice: ప్రజల నాయకులారా, మీరందరూ
  rationale: అక్షరార్థంగా ‘ప్రజల మూలలన్నీ’ అయిన ఈ నుడికారం ప్రజలలోని ప్రముఖులను లేదా ప్రతినిధి నాయకులను సూచిస్తుంది. ‘నాయకులు’ సాధారణ ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּדְעוּ וּרְאוּ
  choice: తెలుసుకొని చూడండి
  rationale: రెండు ఆజ్ఞారూపాలనూ ఉంచి, విషయం పరిశోధించి గుర్తించాలనే హెబ్రీయ ఉద్ఘాటనను సహజమైన తెలుగు క్రమంలో వ్యక్తం చేస్తుంది.
- source_word: בַּמָּה
  choice: ఎలా
  rationale: ఇక్కడ ב + מה పాపం సంభవించిన విధానాన్ని లేదా సాధనాన్ని ప్రశ్నిస్తుంది; ‘ఎలా’ తెలుగులో సహజంగా ఉండి మూలంలోని పరిధిని అనవసరంగా కుదించదు.
- source_word: הָיְתָה
  choice: జరిగిందో
  rationale: అక్షరార్థంగా ‘ఉండింది/కలిగింది’ అనే క్రియ సందర్భంలో ఆ పాపం ఎలా సంభవించిందనే పరిశోధనాత్మక భావాన్ని ఇస్తుంది.
- source_word: הַחַטָּאת הַזֹּאת
  choice: ఈ పాపం
  rationale: దేవుని ఎదుట జరిగిన అతిక్రమాన్ని సూచించే నైతిక, ఆధ్యాత్మిక బరువును ‘పాపం’ నేరుగా నిలుపుతుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాలసూచక పదానికి సహజమైన ఆధునిక తెలుగు సమానం.
theological_decisions:
- issue: ‘ప్రజల మూలలన్నీ’ అనే నుడికారం
  choice: ప్రజల నాయకులారా, మీరందరూ
  alternative: ప్రజల ముఖ్యులారా, మీరందరూ; ప్రజల మూలలన్నీ
  rationale: మూలపాఠంలోని రూపకాన్ని అక్షరార్థంగా తెలుగులో ఉంచితే అర్థం మరుగవుతుంది. సందర్భంలో అది ప్రజల ప్రతినిధి ప్రముఖులను సూచిస్తుంది; ‘నాయకులు’ భావాన్ని స్పష్టంగా, వర్గపరమైన అదనపు అర్థం లేకుండా అందిస్తుంది.
- issue: חטאת యొక్క నైతిక బలం
  choice: పాపం
  alternative: అపరాధం; తప్పు; దోషం
  rationale: కథన సందర్భం దేవుని ఎదుట జరిగిన అతిక్రమానికి సంబంధించినది. ‘పాపం’ మూలపదంలోని ఆధ్యాత్మిక బరువును కాపాడుతుంది; ఎవరి పాపమో లేదా దాని స్వరూపమేమిటో ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే రాజసభా కథనానికి తగిన గౌరవభరిత స్వరంతో రూపొందించబడింది. మూలంలోని రెండు పరిశోధనాత్మక ఆజ్ఞలను ‘తెలుసుకొని చూడండి’గా నిలిపింది.
