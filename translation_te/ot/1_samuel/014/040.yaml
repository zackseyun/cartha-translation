translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘ఉండు’ క్రియను నిలుపుతూ రెండు పక్షాల మధ్య వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేసింది.
