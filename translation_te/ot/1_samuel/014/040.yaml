source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל כָּל יִשְׂרָאֵ֗ל אַתֶּם֙ תִּֽהְיוּ֙ לְ/עֵ֣בֶר אֶחָ֔ד וַֽ/אֲנִי֙ וְ/יוֹנָתָ֣ן בְּנִ֔/י נִהְיֶ֖ה לְ/עֵ֣בֶר אֶחָ֑ד וַ/יֹּאמְר֤וּ הָ/עָם֙ אֶל שָׁא֔וּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵֽׂה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/040.yaml
  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
translation:
  language: te
  text: అప్పుడు అతడు ఇశ్రాయేలీయులందరితో, “మీరు ఒక వైపున ఉండండి; నేనూ నా కుమారుడు యోనాతానూ మరో వైపున ఉంటాము” అన్నాడు. అప్పుడు ప్రజలు సౌలుతో, “నీ దృష్టికి ఏది మంచిదో అది చేయి” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֵבֶר אֶחָד
  choice: ఒక వైపున / మరో వైపున
  rationale: עֵבֶר ఇక్కడ రెండు పక్షాలను ఎదురెదురుగా వేరు చేసే ‘వైపు’ను సూచిస్తుంది. తెలుగు సందర్భంలో ‘ఒక వైపున ... మరో వైపున’ సహజంగా ఉండి, మూలంలోని స్థలసంబంధ వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: תִּהְיוּ / נִהְיֶה
  choice: ఉండండి / ఉంటాము
  rationale: היה అనే ‘ఉండు’ క్రియను నేరుగా ప్రతిబింబిస్తూ, ఆయా పక్షాలు వేర్వేరు వైపుల ఉండాలని చెప్పే సందర్భార్థాన్ని తెలుగులో సహజంగా అందిస్తుంది; ‘నిలబడండి’ అనే అదనపు స్పష్టీకరణను చేర్చదు.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరితో
  rationale: ఇక్కడ సమకూడిన ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది. వ్యక్తులను ఉద్దేశించి మాట్లాడే తెలుగులో ‘ఇశ్రాయేలీయులందరితో’ సహజమైన రూపం.
- source_word: בְּנִי
  choice: నా కుమారుడు
  rationale: మూలంలోని పుత్రసంబంధ సూచనను స్పష్టంగా, యథాతథంగా నిలుపుతుంది.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: నీ దృష్టికి ఏది మంచిదో
  rationale: ‘నీ కళ్లలో మంచిదైనది’ అనే హీబ్రూ నుడికారంలోని దృష్టి రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
- source_word: עֲשֵׂה
  choice: అది చేయి
  rationale: హీబ్రూ ఏకవచన ఆజ్ఞార్థక క్రియకు సహజమైన తెలుగు సమానం; ముందున్న సంబంధవాక్యాన్ని సూచించేందుకు ‘అది’ చేర్చడం తెలుగులో సులభ పఠనాన్ని ఇస్తుంది.
- source_word: וַיֹּאמֶר / וַיֹּאמְרוּ
  choice: అప్పుడు ... అన్నాడు / అప్పుడు ... అన్నారు
  rationale: హీబ్రూ కథన క్రమాన్ని ఆధునిక తెలుగు కథనశైలిలో సహజంగా తెలియజేస్తుంది; ఏకవచన, సమూహ గౌరవ బహువచన భేదాలను పాటిస్తుంది.
