  edition: WLC
  text: ו/יעש הָ/עָם֙ אֶל שלל וַ/יִּקְח֨וּ צֹ֧אן וּ/בָקָ֛ר וּ/בְנֵ֥י בָקָ֖ר וַ/יִּשְׁחֲטוּ אָ֑רְצָ/ה וַ/יֹּ֥אכַל הָ/עָ֖ם עַל הַ/דָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/032.yaml
  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
translation:
  language: te
  text: అప్పుడు ప్రజలు దోపుడుసొమ్ము మీదికి ఎగబడి[a], గొర్రెలను, పశువులను, దూడలను తీసుకొని, వాటిని నేలమీద వధించారు. ప్రజలు రక్తంతో మాంసం తిన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ హెబ్రీ పదబంధం అరుదైనది; “దోపుడుసొమ్మువైపు తిరిగారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, మాంసంలోని రక్తాన్ని సరిగా కార్చకుండానే దాన్ని తిన్నారు.
    reason: interpretive_clarification
lexical_decisions:
- source_word: וַיַּעַשׂ הָעָם אֶל־שָׁלָל
  choice: ప్రజలు దోపుడుసొమ్ము మీదికి ఎగబడి
  rationale: ఈ అరుదైన హెబ్రీ పదబంధం దోపుడుసొమ్మువైపు ప్రజలు అదుపులేకుండా దూసుకుపోయిన భావాన్ని సందర్భంలో సూచిస్తుంది. ‘ఎగబడి’ సహజమైన ఆధునిక తెలుగులో ఆ తీవ్రతను తెలియజేస్తుంది; పదబంధంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: שָׁלָל
  choice: దోపుడుసొమ్ము
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న వస్తువులు, జంతువులు అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలిపే సహజమైన తెలుగు పదం.
- source_word: צֹאן
  choice: గొర్రెలు
  rationale: జంతువుల జాబితాలో సమూహార్థక పదం కన్నా నిర్దిష్టమైన జంతుపేరు తెలుగులో సహజంగా ఉంటుంది.
- source_word: בָּקָר
  choice: పశువులు
  rationale: ఈ హెబ్రీ పదం విస్తృతంగా గోవుల జాతి పశువులను సూచిస్తుంది; ‘పశువులు’ సందర్భానుకూలమైన సాధారణ తెలుగు రూపం.
- source_word: בְּנֵי בָקָר
  choice: దూడలు
  rationale: అక్షరార్థంగా ‘పశువుల పిల్లలు’; ఆధునిక తెలుగులో ‘దూడలు’ సహజమైన సమానార్థకం.
- source_word: וַיִּשְׁחֲטוּ אָרְצָה
  choice: వాటిని నేలమీదే వధించారు
  rationale: జంతువులను నేరుగా నేలమీద వధించిన చర్యను తెలిపేలా అనువదించబడింది. ముందున్న జాబితా నుండి గ్రహించబడే కర్మను తెలుగులో స్పష్టత కోసం ‘వాటిని’ అని చేర్చాం.
- source_word: עַל־הַדָּם
  choice: రక్తంతోనే మాంసం తిన్నారు
  rationale: హెబ్రీలోని సంక్షిప్తమైన ‘రక్తంతో’ అనే భావాన్ని నిలుపుతూ, తెలుగులో సహజత కోసం అంతర్భావితమైన ‘మాంసం’ను చేర్చాం. రక్తం పూర్తిగా కార్చని మాంసమనే వివరణను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: עַל־הַדָּם అనే నిషేధ సంబంధిత పదబంధాన్ని ఎంత స్పష్టంగా అనువదించాలి
  choice: రక్తంతోనే మాంసం తిన్నారు
  alternative: రక్తం పూర్తిగా కార్చకుండా మాంసం తిన్నారు
  rationale: మూలంలోని సంక్షిప్తతను, ధార్మిక ఉద్రిక్తతను ప్రధాన వాక్యంలో నిలిపి, దాని సంభావ్య ఆచారపరమైన అర్థాన్ని పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘దోపుడుసొమ్ము’, ‘వధించారు’ వంటి పదాలు యుద్ధసందర్భాన్నీ వాక్య గంభీరతనూ నిలుపుతాయి.
