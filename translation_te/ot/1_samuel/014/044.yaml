id: 1SA.14.44
reference: 1 Samuel 14:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל כֹּֽה יַעֲשֶׂ֥ה אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑ף כִּֽי מ֥וֹת תָּמ֖וּת יוֹנָתָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/044.yaml
  text: And Saul said[a], “May God do so and more also, for you shall surely die, Jonathan.”
translation:
  language: te
  text: 'అప్పుడు సౌలు ఇలా అన్నాడు[a]: “దేవుడు అలా చేయుగాక, అంతకంటే ఎక్కువ చేయుగాక! ఎందుకంటే నీవు తప్పకుండా చనిపోతావు, యోనాతానా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది హెబ్రీ ప్రమాణ సూత్రం. అక్షరార్థంగా, “దేవుడు ఇలా చేయుగాక, ఇంకా ఇలా చేర్చుగాక.” దేవుడు చేయబోయే బెదిరించిన చర్య ఎవరిమీద జరగాలో హెబ్రీ పాఠం స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שָׁאוּל
  choice: అప్పుడు సౌలు ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగులో ‘అప్పుడు’తో తెలియజేస్తుంది; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף
  choice: దేవుడు అలా చేసి, దానికంటే ఎక్కువే చేయుగాక
  rationale: ఇది దైవశిక్షను ఆహ్వానించే స్థిర ప్రమాణ సూత్రం. హెబ్రీలో చర్య ఎవరిమీద జరగాలో చెప్పలేదు; తెలుగులోనూ దానిని చేర్చకుండా ప్రమాణంలోని శాపార్థాన్ని, తీవ్రతను నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపపరంగా బహువచనమైనా, ఇక్కడ ప్రమాణంలో ఆహ్వానించబడిన ఏకవచన దైవాన్నే సూచిస్తుంది.
- source_word: כִּי
  choice: ప్రత్యేక సంధాన పదంగా అనువదించలేదు
  rationale: ఇక్కడ ప్రమాణ ప్రకటనకు సంబంధించిన నిశ్చయార్థం తరువాతి ఉద్ఘాటిత మరణ ప్రకటనలో సహజంగా వ్యక్తమవుతుంది; ‘ఎందుకంటే’ అని పెడితే ఆధునిక తెలుగులో సంబంధం కృత్రిమంగా వినిపిస్తుంది.
- source_word: מוֹת תָּמוּת
  choice: నీవు తప్పకుండా చనిపోతావు
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ మరణ నిశ్చయాన్ని బలపరుస్తుంది; ‘తప్పకుండా’ ఆ ఉద్ఘాటనను సహజ తెలుగులో అందిస్తుంది.
- source_word: יוֹנָתָן
  choice: యోనాతానూ
  rationale: పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చి, ప్రత్యక్ష సంబోధనను సంబోధనా విభక్తితో స్పష్టం చేసింది.
theological_decisions:
- issue: ప్రమాణ సూత్రంలో చెప్పని కర్మను చేర్చాలా?
  choice: దేవుడు అలా చేసి, దానికంటే ఎక్కువే చేయుగాక
  alternative: దేవుడు నాకు అలా చేసి, అంతకంటే ఎక్కువ చేయుగాక
  rationale: హెబ్రీ పాఠం శిక్ష ఎవరిమీద పడాలో స్పష్టంగా చెప్పదు. సంప్రదాయంగా ‘నాకు’ అని అర్థం చేసుకునే వీలున్నా, దానిని ప్రధాన పాఠంలో చేర్చకుండా మూలంలోని సంక్షిప్తతను, నిజమైన అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే పదప్రయోగం. ప్రమాణ సూత్రం సహజంగా వినిపించేలా చేసినప్పటికీ, మూలంలో లేని ‘నాకు’ అనే కర్మను చేర్చలేదు.
