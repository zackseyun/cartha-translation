  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ לַֽ/אֲחִיָּ֔ה הַגִּ֖ישָׁ/ה אֲר֣וֹן הָ/אֱלֹהִ֑ים כִּֽי הָיָ֞ה אֲר֧וֹן הָ/אֱלֹהִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא וּ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/018.yaml
  text: Then Saul said to Ahijah[b][a], “Bring the ark of God here,” for the ark of God was that day with the sons of Israel.
translation:
  language: te
  text: అప్పుడు సౌలు అహీయాతో, “దేవుని మందసాన్ని ఇక్కడికి తీసుకురా” అన్నాడు. ఎందుకంటే ఆ రోజు దేవుని మందసం ఇశ్రాయేలు ప్రజలతో ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన పాఠ సంప్రదాయాలు, వ్యాఖ్యానాలు ఇక్కడ “దేవుని మందసం”కు బదులుగా “ఏఫోదును తీసుకురా” అని చదువుతాయి. ఇక్కడ అనుసరించిన హీబ్రూ పాఠంలో “దేవుని మందసం” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: לַאֲחִיָּה
  choice: అహీయాతో
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యనుకరణలో ఇచ్చి, చెప్పడాన్ని సూచించే క్రియతో సహజంగా ‘తో’ విభక్తిని వాడాం.
- source_word: הַגִּישָׁה
  choice: ఇక్కడికి తీసుకురా
  rationale: హిఫీల్ ఆజ్ఞారూపం ‘దగ్గరకు తీసుకురా/సమర్పించు’ అనే భావం ఇస్తుంది; సందర్భంలో ‘ఇక్కడికి తీసుకురా’ సహజమైన స్పష్టమైన ఆజ్ఞ.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: హీబ్రూ పాఠంలో ఉన్న ‘దేవుని మందసం’నే అనువదించాం; ఇక్కడ లేని ‘నిబంధన’ అనే పదాన్ని చేర్చలేదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తరువాతి వాక్యం కథకుడు ఇచ్చే వివరణను పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הָיָה
  choice: ఉంది
  rationale: మందసం ఆ రోజు ఇశ్రాయేలు ప్రజలతో ఉన్నదని తెలిపే సాధారణ అస్తిత్వ/స్థితి క్రియగా అనువదించాం; హీబ్రూలో లేని స్థలసూచక పదాన్ని అదనంగా చేర్చలేదు.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: కాలాన్ని సూచించే హీబ్రూ పదబంధానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలతో
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులతో’; అయితే జాతి సమూహాన్ని సూచించే ఈ హీబ్రూ ప్రయోగాన్ని ఆధునిక తెలుగులో సమగ్రంగా, సహజంగా ‘ఇశ్రాయేలు ప్రజలతో’ అని ఇచ్చాం.
theological_decisions:
- issue: ‘దేవుని మందసం’ లేదా పాఠాంతర సంప్రదాయంలోని ‘ఏఫోదు’
  choice: దేవుని మందసం
  alternative: ఏఫోదు
  rationale: అందించిన WLC హీబ్రూ పాఠం ఈ వచనంలో రెండుసార్లు ‘దేవుని మందసం’ అని చదువుతుంది. కాబట్టి ప్రధాన పాఠంలో దానినే ఉంచి, ‘ఏఫోదు’ అనే పాఠాంతరాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఇశ్రాయేలు కుమారులు’ అనే అక్షరానువాదం బదులు సాధారణ పాఠకులకు స్పష్టమైన ‘ఇశ్రాయేలు ప్రజలు’ వాడాం. పాఠాంతరాన్ని ప్రధాన పాఠంలో పరిష్కరించకుండా పాదసూచికలో నమోదు చేశాం.
