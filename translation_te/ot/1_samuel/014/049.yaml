  text: וַ/יִּֽהְיוּ֙ בְּנֵ֣י שָׁא֔וּל יוֹנָתָ֥ן וְ/יִשְׁוִ֖י וּ/מַלְכִּי שׁ֑וּעַ וְ/שֵׁם֙ שְׁתֵּ֣י בְנֹתָ֔י/ו שֵׁ֤ם הַ/בְּכִירָה֙ מֵרַ֔ב וְ/שֵׁ֥ם הַ/קְּטַנָּ֖ה מִיכַֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/049.yaml
  text: 'Saul’s sons were Jonathan[a], Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the firstborn was Merab[b], and the name of the younger was Michal.'
translation:
  language: te
  text: 'సౌలు కుమారులు యోనాతాను, ఇష్వీ, మల్కీషూవ. అతని ఇద్దరు కుమార్తెల పేర్లు ఇవి: మొదట పుట్టిన కుమార్తె పేరు మేరబు[a], చిన్న కుమార్తె పేరు మీకాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పెద్ద కుమార్తె పేరు మేరబు.’
    reason: ‘మొదట పుట్టిన కుమార్తె’ అని అనువదించిన హీబ్రూ పదానికి ‘పెద్ద కుమార్తె’ అనే అర్థం కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: וַיִּהְיוּ בְּנֵי שָׁאוּל
  choice: సౌలు కుమారులు
  rationale: హీబ్రూ సంయోజక కథన రూపాన్ని తెలుగులో అనవసరమైన కాలసూచక పదం చేర్చకుండా, సహజమైన వంశావళి ప్రకటనగా అందించాం.
- source_word: יוֹנָתָן וְיִשְׁוִי וּמַלְכִּי שׁוּעַ
  choice: యోనాతాను, ఇష్వీ, మల్కీషూవ
  rationale: వ్యక్తినామాలను హీబ్రూ మసొరేటిక్ రూపాలకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం; మల్కీ షూవ అనే రెండు హీబ్రూ భాగాలను ఒకే పేరుగా రాశాం.
- source_word: וְשֵׁם שְׁתֵּי בְנֹתָיו
  choice: అతని ఇద్దరు కుమార్తెల పేర్లు ఇవి
  rationale: హీబ్రూలో ‘పేరు’ ఏకవచనంలో ఉన్నా తరువాత రెండు పేర్లు ఇవ్వబడుతున్నందున, సహజ తెలుగు వాడుక ప్రకారం బహువచనమైన ‘పేర్లు’ వాడాం.
- source_word: הַבְּכִירָה
  choice: మొదట పుట్టినది
  rationale: జనన క్రమాన్ని సూచించే మూలపద భావాన్ని స్పష్టంగా నిలుపుతుంది; ‘పెద్దది’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: הַקְּטַנָּה
  choice: చిన్నది
  rationale: కుటుంబ సందర్భంలో వయస్సులో చిన్న కుమార్తెను సూచించే సహజ తెలుగు ప్రయోగం; శారీరక పరిమాణం ఉద్దేశం కాదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గంభీరమైన కథన శైలి. పేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; తెలుగు వాక్య సహజత్వం కోసం కుమార్తెల ‘పేర్లు’ అని బహువచనం వాడాం.
