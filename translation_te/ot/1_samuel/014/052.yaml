  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ חֲזָקָ֣ה עַל פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֣י שָׁא֑וּל וְ/רָאָ֨ה שָׁא֜וּל כָּל אִ֤ישׁ גִּבּוֹר֙ וְ/כָל בֶּן חַ֔יִל וַ/יַּאַסְפֵ֖/הוּ אֵלָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
translation:
  language: te
  text: సౌలు జీవించిన కాలమంతా ఫిలిష్తీయులపై యుద్ధం తీవ్రంగా సాగింది.[a] సౌలు బలవంతుడైన వ్యక్తిని గానీ, పరాక్రమవంతుడిని గానీ చూసినప్పుడల్లా,[b] అతణ్ణి తన దగ్గరికి చేర్చుకునేవాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భీకరంగా’ లేదా ‘కఠినంగా.’ హీబ్రూ విశేషణానికి అక్షరార్థం ‘బలమైనది.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘బలవంతుడైన ప్రతి వ్యక్తిని లేదా పరాక్రమపు ప్రతి కుమారుణ్ణి.’
    reason: lexical_alternative
  - marker: c
    text: అంటే, సౌలు అలాంటి వారిని తన సేవలోకి, తన సైనిక బలగంలోకి చేర్చుకునేవాడు.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה חֲזָקָה
  choice: యుద్ధం తీవ్రంగా సాగింది
  rationale: హీబ్రూ వాక్యంలోని ‘యుద్ధం బలంగా ఉండెను’ అనే అక్షరార్థాన్ని సహజమైన ఆధునిక తెలుగులో సుదీర్ఘ పోరాట తీవ్రతగా వ్యక్తం చేస్తుంది.
- source_word: עַל פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులతో
  rationale: మִלְחָמָהతో వచ్చిన עַל ప్రత్యర్థిని సూచిస్తుంది; తెలుగులో యుద్ధ సందర్భంలో ‘ఫిలిష్తీయులతో’ సహజంగా ఉంటుంది.
- source_word: כֹּל יְמֵי שָׁאוּל
  choice: సౌలు జీవించిన కాలమంతా
  rationale: హీబ్రూ కాలవ్యాప్తిని స్పష్టంగా తెలియజేస్తూ, అది కేవలం విడివిడిగా జరిగిన కొన్ని యుద్ధాలను కాదని సూచిస్తుంది.
- source_word: וְרָאָה
  choice: చూసినప్పుడల్లా
  rationale: సందర్భంలో ఇది పునరావృతమైన అలవాటు చర్యను సూచిస్తుంది; అందువల్ల ‘చూసినప్పుడల్లా’ సరైన సహజ రూపం.
- source_word: כָּל אִישׁ גִּבּוֹר
  choice: బలశాలి అయినవాణ్ణి గానీ
  rationale: גִּבּוֹר యొక్క బలం మరియు యోధసామర్థ్య భావాన్ని నిలుపుతుంది; כָּל ఇక్కడ ఆ వర్గానికి చెందిన ఎవరినైనా సూచిస్తుంది.
- source_word: וְכָל בֶּן חַיִל
  choice: పరాక్రమవంతుణ్ణి గానీ
  rationale: בֶּן־חַיִל అనే నుడికారం ఈ సైనిక సందర్భంలో శౌర్యం, సామర్థ్యం గల వ్యక్తిని సూచిస్తుంది.
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  choice: అతణ్ణి తన దగ్గరికి చేర్చుకునేవాడు
  rationale: ‘తనవద్దకు సమకూర్చుకోవడం’ అనే మూలభావాన్ని నిలుపుతూ, సౌలు అలాంటి వారిని తన బలగంలోకి తీసుకున్నాడనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. పునరావృత చర్యను ‘చూసినప్పుడల్లా… చేర్చుకునేవాడు’తో స్పష్టం చేశాం. మూలంలోని రెండు సమాంతర వ్యక్తి వర్ణనలను విడిగా నిలిపాం; వాటి మధ్య వ్యత్యాసాన్ని అతిగా నిర్ణయించలేదు.
