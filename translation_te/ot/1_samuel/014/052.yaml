    rationale: The Hebrew עַל with ‘war’ identifies the Philistines as the object/opponent. Replacing ‘ఫిలిష్తీయులతో’ with ‘ఫిలిష్తీయులపై’ makes this explicit without changing the sense.
  - severity: medium
    issue: Footnote b inaccurately phrases the second Hebrew expression
    rationale: כָל בֶּן־חַיִל is literally ‘every son of valor/strength,’ not ‘పరాక్రమ పుత్రుడైన ప్రతి మనిషిని.’ The revised note preserves the Hebrew idiom accurately and naturally.
