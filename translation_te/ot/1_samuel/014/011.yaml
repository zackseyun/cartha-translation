source:
  edition: WLC
  text: וַ/יִּגָּל֣וּ שְׁנֵי/הֶ֔ם אֶל מַצַּ֖ב פְּלִשְׁתִּ֑ים וַ/יֹּאמְר֣וּ פְלִשְׁתִּ֔ים הִנֵּ֤ה עִבְרִים֙ יֹֽצְאִ֔ים מִן הַ/חֹרִ֖ים אֲשֶׁ֥ר הִתְחַבְּאוּ שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
translation:
  language: te
  text: వారిద్దరూ ఫిలిష్తీయుల కాపలా దళానికి[a] తమను చూపించుకున్నారు. అప్పుడు ఫిలిష్తీయులు, “చూడండి, హెబ్రీయులు[b] తాము దాక్కున్న రంధ్రాలనుంచి బయటికి వస్తున్నారు!” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఫిలిష్తీయుల కాపలా స్థావరంలోని వారికి.”
    reason: lexical_alternative
  - marker: b
    text: “హెబ్రీయులు” అనేది ఫిలిష్తీయులు ఇశ్రాయేలీయులకు ఉపయోగించిన జాతిపేరు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגָּלוּ
  choice: తమను తాము కనబరచుకున్నారు
  rationale: నిఫాల్ రూపం ఇక్కడ ఉద్దేశపూర్వకంగా కనిపించేలా చేసుకోవడాన్ని సూచిస్తుంది. కేవలం ‘కనిపించారు’ అనడం కంటే ఈ అనువాదం యోనాతాను, అతని ఆయుధాలు మోసేవాడు కావాలనే తమను వెల్లడించుకున్న భావాన్ని నిలుపుతుంది.
- source_word: שְׁנֵיהֶם
  choice: వారిద్దరూ
  rationale: యోనాతాను, అతని ఆయుధాలు మోసేవాడు అనే ఇద్దరినీ స్పష్టంగా సూచిస్తూ, ద్వయార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల సైనిక స్థావరం
  rationale: ఈ సైనిక సందర్భంలో מַצָּב నిలిపి ఉంచిన దళాన్నిగానీ దాని స్థావరాన్నిగానీ సూచించవచ్చు. ‘సైనిక స్థావరం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, మూలంలోని పరిధిని అతిగా కుదించదు.
- source_word: הִנֵּה
  choice: చూడండి!
  rationale: దృష్టిని ఆకర్షించే ఆశ్చర్యోద్గార బలాన్ని ఆధునిక, సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עִבְרִים
  choice: హెబ్రీయులు
  rationale: ఫిలిష్తీయులు ఇశ్రాయేలీయులను బయటి జాతివారు ఉపయోగించే జాతిపేరుతో సంబోధించిన భావాన్ని నిలుపుతుంది; ‘ఇశ్రాయేలీయులు’గా మార్చడం ఆ దృక్కోణాన్ని తొలగిస్తుంది.
- source_word: יֹצְאִים
  choice: బయటికి వస్తున్నారు
  rationale: వర్తమాన కృదంతం ఫిలిష్తీయుల కళ్లముందు కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ ప్రయోగం ఆ సజీవతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִן הַחֹרִים
  choice: రంధ్రాల్లోనుంచి
  rationale: חֹרִים అనేది రంధ్రాలు లేదా తొర్రల వంటి ఖాళీ ప్రదేశాలను సూచిస్తుంది. ‘గుహలు’ అని అనడం మూలపదం కంటే మరీ నిర్దిష్టం అవుతుంది; ‘రంధ్రాలు’ ఫిలిష్తీయుల మాటల్లో ఉండే చిన్నచూపు ఛాయను కూడా నిలుపుతుంది.
- source_word: אֲשֶׁר הִתְחַבְּאוּ שָׁם
  choice: తాము దాక్కున్న
  rationale: హిత్పయేల్ రూపంలోని స్వయంకృత భావాన్ని ‘తాము’ నిలుపుతుంది; తెలుగు సంబంధవాచక నిర్మాణంలో ‘తాము దాక్కున్న రంధ్రాలు’ అని సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గౌరవప్రదమైన సరళ శైలి వాడబడింది. సైనిక పదజాలం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచబడింది; ఫిలిష్తీయుల మాటల్లోని ప్రత్యక్షతను, ‘రంధ్రాలు’ అనే స్పష్టమైన రూపకాన్ని నిలుపుకున్నాం.
