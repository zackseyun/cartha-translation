  text: וַ/יֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָ/עָ֡ם וַ/אֲמַרְתֶּ֣ם לָ/הֶ֡ם הַגִּ֣ישׁוּ אֵלַ/י֩ אִ֨ישׁ שׁוֹר֜/וֹ וְ/אִ֣ישׁ שְׂיֵ֗/הוּ וּ/שְׁחַטְתֶּ֤ם בָּ/זֶה֙ וַ/אֲכַלְתֶּ֔ם וְ/לֹֽא תֶחֶטְא֥וּ לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל אֶל הַ/דָּ֑ם וַ/יַּגִּ֨שׁוּ כָל הָ/עָ֜ם אִ֣ישׁ שׁוֹר֧/וֹ בְ/יָד֛/וֹ הַ/לַּ֖יְלָה וַ/יִּשְׁחֲטוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
translation:
  language: te
  text: 'సౌలు ఇలా అన్నాడు: “మీరు ప్రజల మధ్య అన్ని వైపులకూ వెళ్లి వారితో, ‘ప్రతి ఒక్కరూ తమ ఎద్దును, తమ గొర్రెనో మేకనో నా దగ్గరికి తీసుకురావాలి. వాటిని ఇక్కడే వధించి తినండి. రక్తంతో కూడిన మాంసాన్ని తిని యాహ్వేకు విరోధంగా పాపం చేయకండి[a]’ అని చెప్పండి.” కాబట్టి ఆ రాత్రి ప్రజలందరూ తమ తమ ఎద్దులను చేత పట్టుకొని[b] తీసుకువచ్చి, అక్కడ వాటిని వధించారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “రక్తంతో/రక్తం మీద తినడం.” అంటే రక్తం సరిగా కారకముందే మాంసం తినడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో అక్షరార్థంగా, “ప్రతి వ్యక్తి తన ఎద్దును తన చేతిలో.” భావం: తన ఎద్దును చేతితో నడిపించుకొని వచ్చాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  choice: ప్రజల మధ్య అన్ని వైపులకూ వెళ్లి
  rationale: פוץ క్రియలోని విస్తరించి వెళ్లే భావాన్ని నిలుపుతూ, దూతలు ప్రజలందరి మధ్యకు వెళ్లాలనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַגִּישׁוּ אֵלַי
  choice: నా దగ్గరికి తీసుకురావాలి
  rationale: హిఫిల్ రూపంలోని ‘దగ్గరికి తీసుకురావడం’ అనే అర్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  choice: ప్రతి ఒక్కరూ తమ ఎద్దును, తమ గొర్రెనో మేకనో
  rationale: పునరుక్త אִישׁ లోని పంపిణీ భావాన్ని ‘ప్రతి ఒక్కరూ/తమ’తో చూపుతుంది. שֶׂה గొర్రెను లేదా మేకను సూచించగలందున రెండింటినీ ఉంచి మూలంలోని అర్థవ్యాప్తిని కాపాడింది.
- source_word: וּשְׁחַטְתֶּם בָּזֶה
  choice: వాటిని ఇక్కడే వధించి
  rationale: שׁחט సాధారణంగా చంపడం కంటే ఆహారం కోసం నియమబద్ధంగా వధించడాన్ని సూచిస్తుంది; בָּזֶהకు సందర్భానుసారంగా ‘ఇక్కడే’ అని ఇచ్చింది.
- source_word: וְלֹא תֶחֶטְאוּ לַיהוָה
  choice: యాహ్వేకు విరోధంగా పాపం చేయకండి
  rationale: לַיהוָהలోని నైతిక దిశను ‘యాహ్వేకు విరోధంగా’ అని స్పష్టంగా చూపిస్తూ, దైవనామాన్ని యాహ్వేగా లిప్యంతరీకరించింది.
- source_word: לֶאֱכֹל אֶל־הַדָּם
  choice: రక్తంతో కూడిన మాంసాన్ని తిని
  rationale: హీబ్రూ ప్రయోగం అసాధారణంగా ‘రక్తంతో/రక్తం మీద తినడం’ అని ఉంటుంది. సందర్భంలో రక్తం పూర్తిగా కారకముందే మాంసం తినడాన్ని సూచిస్తుంది; పాదసూచికలో అక్షరార్థాన్ని నిలిపింది.
- source_word: אִישׁ שׁוֹרוֹ בְיָדוֹ
  choice: తమ తమ ఎద్దులను చేత పట్టుకొని
  rationale: ‘అతని చేతిలో’ అనే హీబ్రూ నుడికారాన్ని, జంతువును చేతితో నడిపించుకొని రావడం అనే సహజ తెలుగు భావంలో అందించింది; అక్షరార్థపు అవకాశం పాదసూచికలో ఇచ్చింది.
- source_word: הַלַּיְלָה
  choice: ఆ రాత్రి
  rationale: కథనంలోని కాలసూచనకు సహజమైన తెలుగు రూపం.
- source_word: וַיִּשְׁחֲטוּ שָׁם
  choice: అక్కడ వాటిని వధించారు
  rationale: సందర్భంలో స్పష్టమైన జంతువులను కర్మగా తెలుగులో చేర్చి, שׁחט యొక్క ప్రత్యేక వధ భావాన్ని నిలిపింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాక ఒడంబడిక దైవనామమైన יהוה ఉంది; అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- issue: రక్తంతో తినడం అనే నిషేధం
  choice: రక్తంతో కూడిన మాంసాన్ని తిని
  alternative: రక్తం మీద తిని
  rationale: మూలంలోని అసాధారణ నుడికారాన్ని పూర్తిగా సిద్ధాంతీకరించకుండా, తక్షణ సందర్భంలో రక్తం కార్చని మాంసం తినడాన్ని సూచించేలా ప్రధాన పాఠంలో సహజంగా తెలిపి, అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని వాడింది. ఆజ్ఞల్లో బహువచనాన్ని, పంపిణీ భావంలో ‘ప్రతి ఒక్కరూ/తమ తమ’ రూపాలను ఉపయోగించింది. మూలంలోని అర్థసందిగ్ధతలను అవసరమైన చోట పాదసూచికల్లో నిలిపింది.
