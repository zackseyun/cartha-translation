translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని కంటి నుడికారాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
