source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יֽוֹנָתָ֔ן עָכַ֥ר אָבִ֖/י אֶת הָ/אָ֑רֶץ רְאוּ נָא֙ כִּֽי אֹ֣רוּ עֵינַ֔/י כִּ֣י טָעַ֔מְתִּי מְעַ֖ט דְּבַ֥שׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/029.yaml
  text: Then Jonathan said[a], “My father has troubled the land. See, please, how my eyes have brightened because I tasted a little of this honey.”
translation:
  language: te
  text: 'అప్పుడు యోనాతాను ఇలా అన్నాడు: “నా తండ్రి దేశానికి కష్టం తెచ్చాడు. చూడండి, ఈ తేనెను కొంచెం రుచి చూసినందువల్ల నా కళ్లలో ఎంత వెలుగు వచ్చిందో[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా కళ్లలో వెలుగు వచ్చింది” అనేది తిన్న తర్వాత శక్తి లేదా చురుకుదనం తిరిగి వచ్చిందని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָכַר
  choice: ఇబ్బందిలో పడేశాడు
  rationale: ఈ క్రియకు ‘కలవరపరచడం, ఇబ్బంది కలిగించడం, విపత్తులో పడవేయడం’ అనే భావపరిధి ఉంది. ఇక్కడ యోనాతాను తన తండ్రి ఆజ్ఞ దేశమంతటికీ కష్టం కలిగించిందని చెప్పే కారణార్థక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: దేశాన్ని
  rationale: సందర్భంలో ఇది భూభాగంతోపాటు అక్కడి ప్రజలను సమష్టిగా సూచించగలదు. ‘దేశం’ ఆధునిక తెలుగులో ఆ విస్తృతార్థాన్ని సహజంగా మోస్తుంది.
- source_word: רְאוּ נָא
  choice: ఇదిగో చూడండి
  rationale: బహువచన ఆజ్ఞతో కూడిన נָא శ్రద్ధగా గమనించమనే విజ్ఞప్తిని వ్యక్తం చేస్తుంది. ‘ఇదిగో చూడండి’ ఆ పిలుపును సహజంగా తెలియజేస్తుంది.
- source_word: אֹרוּ עֵינַי
  choice: నా కళ్లు ఎలా వెలిగాయో
  rationale: అక్షరార్థమైన కంటి ప్రతిమను నిలుపుతూ, తిన్న తర్వాత శక్తి లేదా చురుకుదనం తిరిగి వచ్చిన హీబ్రూ నుడికార భావాన్ని సందర్భం ద్వారా గ్రహించగలిగేలా చేస్తుంది.
- source_word: טָעַמְתִּי
  choice: రుచి చూసినందువల్ల
  rationale: మూల క్రియ ప్రత్యేకంగా ‘రుచి చూడడం’ అని అర్థం; కొద్దిమాత్రమే తీసుకున్నాడనే వాక్య ఉద్దేశాన్ని ఇది కాపాడుతుంది.
- source_word: מְעַט דְּבַשׁ הַזֶּה
  choice: ఈ తేనె కొంచెం
  rationale: ‘ఈ తేనె’ అనే నిర్దేశక భావాన్నీ, ‘కొంచెం’ అనే స్వల్ప పరిమాణాన్నీ నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
