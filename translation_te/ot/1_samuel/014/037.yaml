  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בֵּֽ/אלֹהִ֔ים הַֽ/אֵרֵד֙ אַחֲרֵ֣י פְלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יַ֣ד יִשְׂרָאֵ֑ל וְ/לֹ֥א עָנָ֖/הוּ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
translation:
  language: te
  text: అప్పుడు సౌలు దేవునిని సంప్రదించి, “నేను ఫిలిష్తీయుల వెంట దిగివెళ్లాలా? వారిని ఇశ్రాయేలు చేతికి అప్పగిస్తావా?[a]” అని అడిగాడు. కానీ ఆ రోజు ఆయన అతనికి జవాబివ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని ఇశ్రాయేలు వశంలోకి ఇస్తావా?”
    reason: ‘చేతికి అప్పగించడం’ అనే హీబ్రూ నుడికారానికి భావానువాద ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: దేవుని దగ్గర విచారణ చేస్తూ ... అడిగాడు
  rationale: ఇది సాధారణంగా ప్రశ్నించడం మాత్రమే కాక, దేవుని మార్గదర్శకత్వం కోసం సంప్రదించడాన్ని సూచిస్తుంది. ‘విచారణ చేస్తూ ... అడిగాడు’ అనే రూపం ఆ అధికారిక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: הַאֵרֵד
  choice: నేను ... దిగివెళ్లాలా?
  rationale: ప్రశ్నార్థక రూపంలోని ప్రథమ పురుష అసంపూర్ణ క్రియ మార్గదర్శకత్వం కోరే ఆలోచనాత్మక ప్రశ్నను వ్యక్తం చేస్తుంది. ‘దిగివెళ్లాలా?’ మూలంలోని దిశాసూచక భావాన్ని నిలుపుతుంది.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల వెంట
  rationale: אַחֲרֵי యొక్క ప్రాథమిక భావం ‘వెంట/వెనుక’. సైనిక సందర్భంలో వెంబడించడం సూచితమైనప్పటికీ, అనవసరంగా వివరణ జోడించకుండా మూలంలోని రూపాన్ని నిలుపుతుంది.
- source_word: הֲתִתְּנֵם בְּיַד יִשְׂרָאֵל
  choice: వారిని ఇశ్రాయేలు చేతికి అప్పగిస్తావా?
  rationale: యుద్ధ సందర్భంలో נתן ביד శత్రువును మరొకరి అధికారానికి అప్పగించడాన్ని సూచించే నుడికారం. ‘చేతికి అప్పగించు’ మూలంలోని ‘చేయి’ రూపకాన్ని తెలుగులో సహజంగా కాపాడుతుంది.
- source_word: וְלֹא עָנָהוּ
  choice: అయితే ... ఆయన అతనికి జవాబివ్వలేదు
  rationale: ముందటి విచారణను అనుసరించే వ్యతిరేక ఫలితాన్ని ‘అయితే’ స్పష్టం చేస్తుంది. క్రియలో అంతర్లీనంగా ఉన్న కర్త సందర్భానుసారం దేవుడే; ఆయన పేరును మళ్లీ చేర్చకుండా సర్వనామంతో మూలంలోని సంక్షిప్తతను నిలిపింది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: కాలసూచక పదబంధానికి ఇది సహజమైన, సూటియైన ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: జవాబివ్వని కర్త ఎవరు?
  choice: ‘ఆయన’ అనే అంతర్లీన సూచన దేవునిని సూచిస్తుంది.
  alternative: ‘దేవుడు అతనికి జవాబివ్వలేదు’ అని కర్తను స్పష్టంగా పేర్కొనడం.
  rationale: తక్షణ సందర్భం సౌలు దేవుని దగ్గర విచారణ చేశాడని చూపుతుంది కాబట్టి కర్త దేవుడని బలంగా సూచిస్తుంది. అయినా హీబ్రూ పాఠం దేవుని పేరును రెండోసారి స్పష్టంగా చెప్పదు; అందువల్ల తెలుగులో ‘ఆయన’ అని ఉంచి ఆ సంక్షిప్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘ఇశ్రాయేలు చేతికి అప్పగించు’ అనే బైబిలు నుడికారాన్ని సహజంగా నిలుపుతూ, అడుగుటకు సంబంధించిన పునరుక్తిని తగ్గించేందుకు ‘విచారణ చేస్తూ ... అడిగాడు’ అని నిర్మించబడింది.
