- source_word: וְהָעִבְרִים
  choice: హెబ్రీయులు
  rationale: మూలంలోని עִבְרִים అనే సామాజిక/బాహ్య గుర్తింపును ‘ఇశ్రాయేలీయులు’గా మార్చకుండా నిలుపుతుంది.
- source_word: הָיוּ לַפְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల పక్షాన ఉన్న
  rationale: అక్షరార్థంగా ‘ఫిలిష్తీయులకు ఉన్న’ అనే నిర్మాణం ఇక్కడ అనుబంధం లేదా పక్షసంబంధాన్ని సూచిస్తుంది; యాజమాన్య భావాన్ని అతిశయింపకుండా సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: ఇంతకుముందు
  rationale: ‘నిన్నటిలా, మొన్నటిలా’ అనే హీబ్రూ కాలవాచక నానుడి పూర్వకాల అనుబంధాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר עָלוּ עִמָּם
  choice: వారితో కలిసి ... వచ్చినవారు
  rationale: עלה యొక్క దిశార్థాన్ని తెలుగులో సందర్భానుకూలమైన ‘వచ్చినవారు’గా సహజంగా అందిస్తుంది; ఫిలిష్తీయులతో కలిసి ప్రయాణించిన భావాన్ని కాపాడుతుంది.
- source_word: בַּמַּחֲנֶה סָבִיב
  choice: చుట్టుపక్కల ఉన్న శిబిరానికి
  rationale: మూల పదబంధం వ్యాకరణపరంగా క్లిష్టమైనది; పరిసర ప్రాంతంలో విస్తరించిన శిబిరాన్ని సూచించే అవకాశాన్ని బలవంతంగా మరింత నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: וְגַם הֵמָּה
  choice: వారు కూడా
  rationale: ఇతరులతో పాటు ఈ హెబ్రీయులనూ ప్రత్యేకంగా చేర్చే ఉద్ఘాటనను సహజ తెలుగులో నిలుపుతుంది.
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల పక్షాన ఉండడం మొదలుపెట్టారు
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలుతో ఉండడానికి’ అనే మాటలో సందర్భం సూచించే పక్షమార్పును తెలియజేస్తుంది; ‘చేరిపోయారు’ కంటే మూలంలోని ‘ఉండు’ క్రియను మెరుగుగా నిలుపుతుంది.
- source_word: אֲשֶׁר עִם שָׁאוּל וְיוֹנָתָן
  choice: సౌలు, యోనాతానులతో ఉన్న ఇశ్రాయేలీయులు
  rationale: సామూహిక నామమైన ‘ఇశ్రాయేలు’ను సాధారణ పాఠకునికి స్పష్టంగా ప్రజలను సూచించే ‘ఇశ్రాయేలీయులు’గా అందించి, సంబంధవాక్యాన్ని వారికే అన్వయిస్తుంది.
theological_decisions:
- issue: లִהְיוֹת עִם יִשְׂרָאֵלలో పక్షమార్పు ఎంత స్పష్టంగా చెప్పాలి
  choice: పక్షాన ఉండడం మొదలుపెట్టారు
  alternative: ఇశ్రాయేలుతో ఉండడానికి అయ్యారు / ఇశ్రాయేలీయులతో చేరారు
  rationale: సందర్భంలో అనుబంధ మార్పు స్పష్టమైనప్పటికీ, ‘చేరారు’ వంటి మరింత బలమైన సైనిక లేదా రాజకీయ అర్థాన్ని నేరుగా చేర్చకుండా మూలంలోని ‘ఉండు’ భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. పొడవైన హీబ్రూ వాక్య నిర్మాణాన్ని డాష్‌లతో విభజించి పఠనసౌలభ్యం కల్పించాం. ‘హెబ్రీయులు’ మరియు ‘ఇశ్రాయేలీయులు’ మధ్య మూలంలో ఉన్న పదభేదాన్ని నిలిపాం; క్లిష్టమైన స్థలవాచక పదబంధం మరియు పక్షమార్పు సూచనలను పాదటిప్పణుల్లో వివరించాం.
