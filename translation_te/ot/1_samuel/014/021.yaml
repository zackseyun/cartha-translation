    issue: ‘వచ్చినవారు’ for עלו
    rationale: עלה denotes going/coming up; in this clause the movement is with the Philistines into/in relation to their camp. ‘వచ్చినవారు’ is less precise and may suggest movement toward the narrator rather than accompanying the Philistines. ‘వెళ్లిన’ is a safer Telugu rendering.
  - severity: low
    issue: ‘ఇశ్రాయేలీయులు’ replaces ‘ఇశ్రాయేలు’ in the final clause
    rationale: The source uses the collective proper name Israel, followed by a relative clause, ‘who were with Saul and Jonathan.’ Retaining ‘ఇశ్రాయేలు’ preserves both the wording and the collective reference.
