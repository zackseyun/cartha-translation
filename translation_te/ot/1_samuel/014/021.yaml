  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: The Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
translation:
  language: te
  text: ఇంతకుముందు ఫిలిష్తీయుల పక్షాన ఉండి, వారితో కలిసి చుట్టుపక్కల ఉన్న శిబిరంలోకి వెళ్లిన హెబ్రీయులు కూడా సౌలు, యోనాతానులతో ఉన్న ఇశ్రాయేలు పక్షాన ఉండసాగారు.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నిన్నటిలా, మొన్నటిలా”; ఇది “ఇంతకుముందు” లేదా “పూర్వం” అనే అర్థమిచ్చే నానుడి.
    reason: lexical_alternative
  - marker: b
    text: “చుట్టుపక్కల ఉన్న శిబిరంలోకి” అనే హీబ్రూ పదబంధం క్లిష్టంగా ఉంది. ఇది పరిసర ప్రాంతంలో ఉన్న లేదా విస్తరించి ఉన్న ఫిలిష్తీయుల శిబిరాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా, “ఇశ్రాయేలుతో ఉండడానికి.” సందర్భంలో ఇది వారు పక్షం మారి ఇశ్రాయేలు పక్షాన ఉండసాగారని సూచిస్తుంది.
    reason: alternative_reading
