source:
  edition: WLC
  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
translation:
  language: te
  text: అహీయా అహీతూబు కుమారుడు, ఈకాబోదు సహోదరుడు, ఫీనెహాసు కుమారుడు, ఏలీ కుమారుడు; షిలోహులో యెహోవా యాజకుడైన అతడు ఏఫోదును మోస్తూ ఉన్నాడు.[a] యోనాతాను వెళ్లాడని ప్రజలకు తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏఫోదును ధరించి ఉన్నాడు.” హీబ్రూలో అక్షరార్థంగా, “ఏఫోదును మోస్తూ ఉన్నాడు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: అహీయా
  rationale: వావ్ కథనాన్ని కొనసాగిస్తుంది; తెలుగులో ముందున్న సందర్భమే ఆ అనుసంధానాన్ని తెలియజేస్తుంది కాబట్టి కృత్రిమంగా ‘ఇప్పుడు’ చేర్చలేదు.
- source_word: בֶן אֲחִטוּב
  choice: అహీటూబు కుమారుడు
  rationale: హీబ్రూ వంశావళి నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా నిలిపింది.
- source_word: אֲחִי אִיכָבוֹד
  choice: ఈకాబోదు సహోదరుడు
  rationale: אֲחִי యొక్క సాధారణ అర్థం ‘సహోదరుడు’; సందర్భం విస్తృత బంధుత్వార్థాన్ని కోరదు.
- source_word: בֶּן פִּינְחָס בֶּן עֵלִי
  choice: ఫీనెహాసు కుమారుడు, ఏలీ కుమారుడు
  rationale: మూలంలోని వంశక్రమాన్ని సంక్షిప్తం చేయకుండా స్పష్టంగా ఉంచింది.
- source_word: כֹּהֵן יְהוָה בְּ/שִׁלֹה
  choice: షిలోహులో యెహోవా యాజకుడు
  rationale: స్థల సంబంధాన్ని ‘షిలోహులో’ అని, దైవనామాన్ని వ్యక్తినామంగా ‘యెహోవా’ అని అందించింది.
- source_word: נֹשֵׂא אֵפוֹד
  choice: ఏఫోదును మోస్తున్నాడు
  rationale: נשא యొక్క ప్రాథమిక భావమైన మోయడం/ధరించడం మధ్య ఉన్న సందిగ్ధతలో మూలానికి దగ్గరగా ‘మోస్తున్నాడు’ ఎంచుకుంది; వస్త్రంగా ధరించడమనే అవకాశాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: וְ/הָ/עָם לֹא יָדַע
  choice: ప్రజలకు తెలియదు
  rationale: సమూహవాచక ఏకవచన క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: כִּי הָלַךְ יוֹנָתָן
  choice: యోనాతాను వెళ్లిన సంగతి
  rationale: ప్రజలకు తెలియకముందే జరిగిన ప్రయాణాన్ని తెలుగు ఉపవాక్యం సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపంలో ఉంచింది.
- issue: ఏఫోదును మోయడమా, ధరించడమా
  choice: మోస్తున్నాడు
  alternative: ధరించి ఉన్నాడు
  rationale: మూల క్రియ యొక్క విస్తృత అర్థాన్ని ప్రధాన పాఠంలో దగ్గరగా నిలిపి, యాజక వస్త్రాన్ని ధరించడమనే సందర్భోచిత పఠనాన్ని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. పేర్లను తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించింది; వంశావళి సంబంధాలను మూలానుసారం స్పష్టంగా నిలిపింది.
