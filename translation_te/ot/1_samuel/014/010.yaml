id: 1SA.14.10
reference: 1 Samuel 14:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם כֹּ֨ה יֹאמְר֜וּ עֲל֤וּ עָלֵ֨י/נוּ֙ וְ/עָלִ֔ינוּ כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יָדֵ֑/נוּ וְ/זֶה לָּ֖/נוּ הָ/אֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
translation:
  language: te
  text: కాని వారు ఇలా అంటే, ‘మా దగ్గరికి పైకి రండి,’ అప్పుడు మనం పైకి వెళ్దాం. ఎందుకంటే యాహ్వే వారిని మన చేతిలోకి అప్పగించాడు[b]; ఇదే మనకు సంకేతం అవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, “మన చేతిలోకి”; అంటే మన అధికారానికి లేదా వశానికి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: కాని ... అంటే
  rationale: ముందటి వచనంలోని షరతుకు భిన్నమైన రెండవ అవకాశాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: כֹּה יֹאמְרוּ
  choice: వారు ... అని అంటే
  rationale: షరతుతో కూడిన ప్రత్యక్ష సంభాషణను ఆధునిక తెలుగులో సహజంగా పరిచయం చేస్తుంది; כֹּה యొక్క భావం ఉటంకించిన మాటలో వ్యక్తమవుతుంది.
- source_word: עֲלוּ עָלֵינוּ
  choice: మా దగ్గరికి ఎక్కి రండి
  rationale: ఫిలిష్తీయుల ఎత్తైన స్థానం వైపు పైకి రావాలనే ప్రాథమిక చలనార్థాన్ని నిలుపుతుంది; సైనిక ప్రతిఘటన సందర్భంలో సూచితమైనా దానిని ప్రధాన పాఠ్యంలో అతిగా స్పష్టీకరించదు.
- source_word: וְעָלִינוּ
  choice: అప్పుడు మనం పైకి వెళ్దాం
  rationale: షరతు నెరవేరిన తరువాత తీసుకునే చర్యను తెలుగులో సహజంగా తెలిపే పర్యవసాన భావాన్ని ఇస్తుంది.
- source_word: כִּי נְתָנָם
  choice: ఎందుకంటే ... వారిని ... అప్పగించాడు
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది; נתן యొక్క సంపూర్ణ క్రియారూపం సూచన లభించినప్పుడు యోనాతానుకు ఉండే నిశ్చయాన్ని ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా తెలుగు లిపిలో వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: בְּיָדֵנוּ
  choice: మన చేతికి
  rationale: అధికారం లేదా వశం అనే అర్థమున్న హెబ్రీ ఏకవచన నుడికారపు చేతి రూపకాన్ని తెలుగులోనూ సహజంగా నిలుపుతుంది.
- source_word: וְזֶה לָּנוּ הָאוֹת
  choice: ఇదే మనకు సూచన అవుతుంది
  rationale: ఇంకా సంభవించవలసిన సంఘటనను నిర్ధారక సూచనగా గుర్తించే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా యాహ్వే అని లిప్యంతరీకరించాం.
- issue: נְתָנָם క్రియ యొక్క కాలం మరియు నిశ్చయ భావం
  choice: వారిని ... అప్పగించాడు
  alternative: వారిని ... అప్పగిస్తాడు
  rationale: హెబ్రీ సంపూర్ణ క్రియారూపం, సూచన నెరవేరినప్పుడు విజయం దేవుడు ఇప్పటికే నిర్ణయించి ఇచ్చినదన్న యోనాతాను నిశ్చయాన్ని తెలియజేస్తుంది; భవిష్యత్తు అనువాదం కూడా సందర్భపరంగా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని షరతు–పర్యవసాన నిర్మాణం, ఎత్తుకు వెళ్లే చలనార్థం, ‘చేతి’ నుడికారం, యోనాతాను వ్యక్తం చేసిన దైవిక విజయ నిశ్చయం నిలుపబడ్డాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
