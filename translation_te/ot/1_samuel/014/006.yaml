source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו לְכָ/ה֙ וְ/נַעְבְּרָ֗ה אֶל מַצַּב֙ הָ/עֲרֵלִ֣ים הָ/אֵ֔לֶּה אוּלַ֛י יַעֲשֶׂ֥ה יְהוָ֖ה לָ֑/נוּ כִּ֣י אֵ֤ין לַֽ/יהוָה֙ מַעְצ֔וֹר לְ/הוֹשִׁ֥יעַ בְּ/רַ֖ב א֥וֹ בִ/מְעָֽט־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
translation:
  language: te
  text: అప్పుడు యోనాతాను తన ఆయుధాలు మోసే యువకునితో, “రా, ఈ సున్నతి లేనివారి[a] సైనిక స్థావరానికి[b] మనం దాటి వెళ్దాం. బహుశా యాహ్వే మనకొరకు కార్యం చేస్తాడేమో[c]. ఎందుకంటే అనేకమందితోనైనా కొద్దిమందితోనైనా రక్షించడానికి యాహ్వేకు ఏ అడ్డంకీ లేదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా “ఈ సున్నతి లేనివారు.” ఇది కేవలం శారీరక స్థితిని చెప్పడం కాక, ఇశ్రాయేలు నిబంధనకు వెలుపల ఉన్న శత్రువులను నిందార్థంగా సూచించే మాట.
    reason: cultural_note
  - marker: b
    text: లేదా “కావలి స్థావరం.” ఇక్కడి హీబ్రూ పదం సైనిక దండు నిలిచిన స్థలాన్ని లేదా ముందరి కావలి స్థానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా “యాహ్వే మన కోసం చేస్తాడేమో.” క్రియ ఏ కార్యమో నిర్దిష్టంగా చెప్పదు; సందర్భంలో అది సహాయం లేదా రక్షణ కోసం ఆయన జోక్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: తన ఆయుధాలు మోసే యువకుడు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా అతని సామగ్రి లేదా ఆయుధాలు మోసేవాడిని సూచిస్తుంది. సంప్రదాయ ‘ఆయుధవాహకుడు’ కంటే ఈ రూపం నేటి సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: לְכָה וְנַעְבְּרָה
  choice: రా, ... మనం దాటి వెళ్దాం
  rationale: ఆజ్ఞార్థక రూపం, సంకల్పాన్ని తెలిపే cohortative రూపం కలిసి ఆహ్వానాన్నీ ఉమ్మడి నిర్ణయాన్నీ వ్యక్తం చేస్తున్నాయి.
- source_word: מַצַּב
  choice: సైనిక స్థావరం
  rationale: ఈ సందర్భంలో ఫిలిష్తీయుల సైనిక స్థానం ఉద్దేశించబడింది. ‘సైనిక స్థావరం’ ఆధునిక తెలుగులో సహజంగా, సందర్భానికి తగిన స్పష్టతతో ఉంది.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: సున్నతి లేని ఈ మనుష్యులు
  rationale: మూలంలో జాతిపేరు కాకుండా, నామవాచకంగా వాడిన ‘సున్నతి లేనివారు’ అనే నిబంధన సంబంధిత నిందార్థక సంబోధన ఉంది; దాని పదబలాన్ని నిలిపాం.
- source_word: אוּלַי
  choice: బహుశా ... ఏమో
  rationale: యోనాతాను ఆశతో మాట్లాడుతున్నప్పటికీ ఫలితాన్ని ముందే నిర్ధారించలేదు; మూలంలోని అనిశ్చితిని ఈ ప్రయోగం సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יַעֲשֶׂה יְהוָה לָנוּ
  choice: యాహ్వే మన పక్షాన కార్యం చేస్తాడు
  rationale: עשה అనే క్రియ విస్తృతార్థకమైనది. సందర్భంలో దేవుని నిర్ణాయక జోక్యాన్ని సూచించినా, దానిని అతిగా నిర్దిష్టం చేయకుండా ‘కార్యం చేస్తాడు’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: מַעְצוֹר
  choice: ఏ అడ్డంకీ లేదు
  rationale: ఈ నామవాచకం నిరోధం లేదా ఆటంకాన్ని సూచిస్తుంది. హీబ్రూ వాక్యభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְהוֹשִׁיעַ
  choice: రక్షించడానికి
  rationale: ישע ధాతువు ఈ సైనిక సందర్భంలో విడిపించడం లేదా విజయం కలిగించడం అనే భావం కలిగినా, విస్తృత బైబిలు వాడుకను కూడా నిలిపే పదం ‘రక్షించడం’.
- source_word: בְּרַב אוֹ בִמְעָט
  choice: అనేకమందితోనైనా కొద్దిమందితోనైనా
  rationale: దేవుడు ఉపయోగించే మానవ సాధనాల సంఖ్యలోని వ్యత్యాసాన్ని మూలం నేరుగా విరుద్ధంగా చూపుతుంది; ‘తో’ అనే విభక్తి సాధనం అనే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర వ్యక్తినామం ఉంది. దాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించడం ఆ నిబంధన నామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- issue: הָעֲרֵלִים లోని నిబంధనపరమైన నిందార్థం
  choice: సున్నతి లేని ఈ మనుష్యులు
  alternative: ఈ ఫిలిష్తీయులు
  rationale: ‘ఫిలిష్తీయులు’ అని మార్చితే సందర్భం స్పష్టమైనా, మూలంలోని సున్నతి-నిబంధన సంబంధిత విరోధభావం కనుమరుగవుతుంది. అందువల్ల మూలపదాన్ని నిలిపి, పాదసూచికలో దాని భావాన్ని వివరించాం.
- issue: యోనాతాను మాటలోని అనిశ్చితి
  choice: బహుశా ... చేస్తాడేమో
  alternative: యాహ్వే తప్పక మన కోసం కార్యం చేస్తాడు
  rationale: אוּלַי నిశ్చయ ప్రకటన కాదు. దేవుని శక్తిపై ఉన్న విశ్వాసంతోపాటు, ఆయన నిర్దిష్ట చర్యను ముందుగా నిర్ణయించని ధోరణిని మూలపాఠం కలిపి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. సంభాషణలో ‘రా’, ‘మనం దాటి వెళ్దాం’ వంటి నేరుగా పలికే రూపాలు యోనాతాను తన సహచరునితో మాట్లాడే సన్నిహిత సైనిక సందర్భానికి సరిపోతాయి. దైవనామాన్ని ‘యాహ్వే’గా నిలిపి, మూలంలోని ఆశాభావం, అనిశ్చితి, దేవుని అపరిమిత రక్షణశక్తి మధ్య ఉన్న ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
