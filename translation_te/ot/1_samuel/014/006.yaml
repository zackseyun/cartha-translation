  naturalness: ‘సున్నతి లేని ఈ మనుష్యుల సైనిక స్థావరం దగ్గరికి’ అనే పదబంధం కొంత భారంగా, అస్పష్టంగా ఉంది; అది ఆ మనుష్యులు స్థావరం దగ్గర ఉన్నారన్న భావాన్ని కూడా కలిగించవచ్చు. ‘ఈ సున్నతి లేనివారి సైనిక స్థావరానికి’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది. ‘మనకొరకు కార్యం చేస్తాడేమో’ కూడా ‘మన పక్షాన కార్యం చేస్తాడేమో’ కంటే సులభంగా ఉంది.
