id: 1SA.14.43
reference: 1 Samuel 14:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל י֣וֹנָתָ֔ן הַגִּ֥ידָ/ה לִּ֖/י מֶ֣ה עָשִׂ֑יתָה וַ/יַּגֶּד ל֣/וֹ יוֹנָתָ֗ן וַ/יֹּאמֶר֩ טָעֹ֨ם טָעַ֜מְתִּי בִּ/קְצֵ֨ה הַ/מַּטֶּ֧ה אֲשֶׁר בְּ/יָדִ֛/י מְעַ֥ט דְּבַ֖שׁ הִנְ/נִ֥י אָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
translation:
  language: te
  text: 'అప్పుడు సౌలు యోనాతానుతో, “నువ్వు ఏమి చేశావో నాకు చెప్పు” అన్నాడు. యోనాతాను అతనికి చెప్పి ఇలా అన్నాడు: “నా చేతిలో ఉన్న కర్ర కొనతో నేను నిజంగానే కొంచెం తేనెను రుచి చూశాను. ఇదిగో, నేను చనిపోతాను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నిజంగానే కొంచెం తేనె రుచి చూశాను; ఇప్పుడు నేను చనిపోవాలా?” హీబ్రూలో ‘రుచి చూశాను’ అనే క్రియ బలంగా చెప్పబడింది. చివరి మాటను రాబోయే మరణాన్ని తెలిపే ప్రకటనగానో, “ఇంతకే నేను చనిపోవాలా?” అనే నిరసనాత్మక ప్రశ్నగానో అర్థం చేసుకోవచ్చు.
    reason: హీబ్రూ క్రియా బలీకరణను, చివరి ఉపవాక్యంలోని ప్రకటన/అలంకార ప్రశ్న సందిగ్ధతను నమోదు చేయడం.
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: నాకు చెప్పు
  rationale: נגד క్రియ యొక్క ఆజ్ఞార్థక రూపాన్ని ఆధునిక తెలుగులో సహజమైన, నేరమైన ఆదేశంగా వ్యక్తపరుస్తుంది.
- source_word: מֶה עָשִׂיתָה
  choice: నువ్వు ఏమి చేశావో
  rationale: పూర్తయిన చర్యను దాని ప్రస్తుత పరిణామంతో సహా ప్రశ్నించే భావాన్ని సహజమైన తెలుగు పరోక్ష ప్రశ్న నిర్మాణంలో నిలుపుతుంది.
- source_word: וַיַּגֶּד לוֹ
  choice: అతనికి తెలియజేస్తూ
  rationale: ముందున్న נגד క్రియతో భావసంబంధాన్ని ఉంచుతూ, తరువాత వచ్చే ప్రత్యక్ష వాక్యానికి సహజంగా దారితీస్తుంది.
- source_word: טָעֹם טָעַמְתִּי
  choice: రుచి చూశాను
  rationale: హీబ్రూ infinitive absolute క్రియను బలపరుస్తుంది; తెలుగులో క్రియ పునరుక్తి అసహజంగా ఉండేందున సరళ క్రియను వాడి, వాక్యంలోని కొంచెం అనే పరిమాణంతో యోనాతాను వివరణాత్మక స్వరాన్ని నిలిపింది. బలపరిచే భావం పాదటిప్పణిలో సూచించబడింది.
- source_word: בִּקְצֵה הַמַּטֶּה
  choice: కర్ర కొనతో
  rationale: קצה యొక్క ‘చివర/కొన’ భావాన్ని, తేనెను తీసి రుచి చూసిన సాధనార్థక సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמַּטֶּה
  choice: కర్ర
  rationale: యోనాతాను చేతిలో పట్టుకున్న వస్తువుకు సాధారణ ఆధునిక తెలుగులో ‘కర్ర’ సహజమైన పదం.
- source_word: מְעַט דְּבַשׁ
  choice: కొంచెం తేనె
  rationale: పరిమాణాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: הִנְנִי
  choice: ఇదిగో, నేను
  rationale: హీబ్రూ దృష్ట్యాకర్షక పదంలోని తక్షణతను, వక్త తన పరిస్థితిని చూపించే బలాన్ని నిలుపుతుంది.
- source_word: אָמֽוּת
  choice: చనిపోవాల్సిందేనా
  rationale: ఈ అసంపూర్ణ క్రియారూపం సందర్భంలో సమీప మరణాన్ని తెలిపే ప్రకటనగానో, వ్యంగ్యభరిత అలంకార ప్రశ్నగానో వినిపించవచ్చు; ప్రధాన పాఠ్యంలో ప్రశ్నారూపాన్ని ఎంచుకొని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: యోనాతాను చివరి మాట ప్రకటననా, అలంకార ప్రశ్ననా
  choice: “నేను చనిపోవాల్సిందేనా!” అనే నిరసనాత్మక ప్రశ్న
  alternative: “ఇదిగో, నేను చనిపోబోతున్నాను” అనే విధేయతతో కూడిన ప్రకటన
  rationale: హీబ్రూ אָמוּת కు స్వతంత్రంగా ప్రశ్నార్థక సూచిక లేదు; అయినా సందర్భం, పదక్రమం దీనిని వ్యంగ్యభరిత నిరసనగా వినడానికి వీలు కల్పిస్తాయి. నిజమైన సందిగ్ధతను పాదటిప్పణిలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభమైన శైలి. సంభాషణలో సహజమైన ఏకవచన సంబోధన వాడబడింది. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
