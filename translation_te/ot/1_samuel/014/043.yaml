revisions:
- from: అప్పుడు సౌలు యోనాతానుతో, “నువ్వు ఏమి చేశావో నాకు చెప్పు” అన్నాడు. యోనాతాను అతనికి తెలియజేస్తూ, “నా చేతిలో ఉన్న కర్ర కొనతో కొంచెం తేనె రుచి చూశాను. ఇదిగో, నేను చనిపోవాల్సిందేనా![a]” అన్నాడు.
  to: 'అప్పుడు సౌలు యోనాతానుతో, “నువ్వు ఏమి చేశావో నాకు చెప్పు” అన్నాడు. యోనాతాను అతనికి చెప్పి ఇలా అన్నాడు: “నా చేతిలో ఉన్న కర్ర కొనతో నేను నిజంగానే కొంచెం తేనెను రుచి చూశాను. ఇదిగో, నేను చనిపోతాను.[a]”'
  rationale: హీబ్రూ వాక్యంలోని బలపరచిన ‘రుచి చూశాను’ను ‘నిజంగానే’తో చూపించాం. ప్రశ్నార్థక సూచిక లేని చివరి ఉపవాక్యాన్ని ప్రధాన పాఠ్యంలో ప్రకటనగా ఉంచి, సందర్భం అనుమతించే నిరసనాత్మక ప్రశ్న పఠనాన్ని పాదటిప్పణిలో నిలిపాం. కథనక్రియను ఆధునిక తెలుగులో సహజమైన పూర్తయిన రూపంలో మార్చాం.
