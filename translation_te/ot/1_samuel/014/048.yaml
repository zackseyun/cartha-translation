  source_fidelity: 'The draft accurately conveys the sequence: Saul acted with valor, defeated the Amalekite people, and rescued Israel from its plunderer(s). Rendering the ethnonym collectively as “అమాలేకీయులను” and the final participle collectively as “దోచుకునేవారి” is defensible, provided the singular Hebrew form is noted.'
