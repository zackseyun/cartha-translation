translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘చేతిలోనుండి’ అనే మూల రూపకం నిలుపబడింది. ‘ఇశ్రాయేలు’ను సమష్టి ఏకవచనంగా భావించి తరువాత ‘దానిని’ వాడబడింది; దోపిడీదారుల సంఖ్య విషయంలో మూలంలోని ఏకవచన రూపాన్ని పాదటిప్పణిలో వెల్లడించారు.
