  yaml_path: translation/ot/1_samuel/014/048.yaml
  text: He fought valiantly and struck Amalek[c][b][a], and he delivered Israel from the hand of those who plundered it.
translation:
  language: te
  text: అతడు పరాక్రమం కనబరిచి[a] అమాలేకీయులను[b] ఓడించాడు. ఇశ్రాయేలును దోచుకునేవారి చేతిలోనుండి[c] విడిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారానికి అక్షరార్థం ‘పరాక్రమం చేశాడు’; ఇక్కడ అతడు ధైర్యంగా వ్యవహరించాడని లేదా యుద్ధంలో విజయం సాధించాడని భావం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘అమాలేకు’; ఇది అమాలేకీయ ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘దానిని దోచుకునేవాని చేతిలోనుండి’ అని ఏకవచన రూపం ఉంది. సమష్టిగా భావించబడిన ‘ఇశ్రాయేలు’ను బట్టి ఇక్కడ దోచుకునేవారిని సమూహంగా అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ חַיִל
  choice: పరాక్రమం కనబరిచి
  rationale: అక్షరార్థంగా ‘బలం/పరాక్రమం చేశాడు’ అనే ఈ హీబ్రూ నుడికారం, ఇక్కడ యుద్ధంలో ధైర్యంగా వ్యవహరించడం లేదా సైనిక విజయం సాధించడం అనే భావాన్ని ఇస్తుంది. ‘పరాక్రమం కనబరిచి’ మూలంలోని నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּךְ
  choice: ఓడించాడు
  rationale: נכה అనే క్రియకు ‘కొట్టు, దెబ్బతీయు, ఓడించు’ అనే అర్థాలున్నాయి. ఒక ప్రజాసమూహంపై జరిగిన యుద్ధ సందర్భంలో ‘ఓడించాడు’ సహజంగా ఉండి, సైనిక ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֲמָלֵק
  choice: అమాలేకీయులను
  rationale: మూలంలో ‘అమాలేకు’ అనే ఏకవచన జాతినామం ఉన్నప్పటికీ, అది అమాలేకీయ ప్రజలను సమష్టిగా సూచిస్తుంది. తెలుగులో ‘అమాలేకీయులను’ అని అనడం ఆ సమష్టి భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּצֵּל
  choice: విడిపించాడు
  rationale: హిఫిల్ రూపంలోని נצל అంటే ఒకరి ఆధీనంలోనుండి రక్షించడం లేదా విడిపించడం. ‘విడిపించాడు’ ఈ సందర్భంలోని సైనిక విమోచన భావాన్ని స్పష్టంగా ఇస్తుంది; అనవసరమైన అదనపు వేదాంతార్థాన్ని చేర్చదు.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: ‘చేతిలోనుండి’ అనేది అధికారం లేదా ఆధీనంలోనుండి అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది; తెలుగులోనూ ఇది అర్థమయ్యే బైబిలు శైలి.
- source_word: שֹׁסֵהוּ
  choice: దోచుకునేవారి
  rationale: ఈ కృదంతం దోచేవాడు లేదా కొల్లగొట్టేవాడు అనే అర్థం ఇస్తుంది. హీబ్రూలో రూపం ఏకవచనంగా, ‘అతని/దాని దోచువాడు’ అన్నట్టున్నా, సమష్టిగా భావించబడిన ‘ఇశ్రాయేలు’ సందర్భంలో దోపిడీదారులను సమూహంగా సూచించడం సహజం.
