  terminology: '“పరాక్రమం కనబరిచి,” “అమాలేకీయులను,” “ఓడించాడు,” and “విడిపించాడు” are appropriate modern-standard Telugu choices. The final footnote should express the Hebrew construction more idiomatically and precisely: the singular participle means “the one who plunders it/him,” rather than the less natural “దాని దోచువాని.”'
