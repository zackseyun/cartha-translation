  text: וַ/יָּבֹ֤א הָ/עָם֙ אֶל הַ/יַּ֔עַר וְ/הִנֵּ֖ה הֵ֣לֶךְ דְּבָ֑שׁ וְ/אֵין מַשִּׂ֤יג יָד/וֹ֙ אֶל פִּ֔י/ו כִּֽי יָרֵ֥א הָ/עָ֖ם אֶת הַ/שְּׁבֻעָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
translation:
  language: te
  text: ప్రజలు అడవిలోకి వచ్చినప్పుడు, ఇదిగో, అక్కడ తేనె ప్రవాహం కనిపించింది[a]. అయితే ఎవ్వరూ చేతిని నోటికి చేర్చలేదు[b]; ఎందుకంటే ప్రజలు ఆ శపథానికి భయపడ్డారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూ పదబంధం అక్షరార్థంగా ‘తేనె సాగడం/ప్రవహించడం’ అనే భావం ఇస్తుంది. ‘తేనె ప్రవహిస్తూ ఉంది’ లేదా ‘తేనె ధార’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఎవ్వరూ చేతిని నోటికి చేర్చలేదు’; అంటే, ఎవ్వరూ ఆ తేనెను తినలేదు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘ఆ శపథం’ అని ఉంది. సందర్భంలో ఇది సాయంత్రానికి ముందు ఆహారం తినేవానిపై శాపం ఉంటుందని సౌలు చేసిన శపథాన్ని సూచిస్తుంది (1 సమూయేలు 14:24 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: ప్రజలు ... వచ్చినప్పుడు
  rationale: בוא అనే క్రియ గతకాల కథనంలో రావడం/ప్రవేశించడం అనే సాధారణ కదలికను సూచిస్తుంది. సైనిక సందర్భం ఉన్నప్పటికీ עם అనే విస్తృత పదాన్ని ‘ప్రజలు’గా నిలిపి, తెలుగు వాక్యనిర్మాణానికి సహజంగా కాలసంబంధ ఉపవాక్యంగా అనువదించాం.
- source_word: הַיַּעַר
  choice: అడవి
  rationale: יער అంటే చెట్లు దట్టంగా ఉన్న ప్రదేశం లేదా అడవి. ఆధునిక ప్రామాణిక తెలుగులో ‘అడవి’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: הנה కథనంలో అకస్మాత్తుగా కనిపించిన దృశ్యంపై దృష్టి ఆకర్షిస్తుంది. ‘ఇదిగో’ ఆ సజీవతను నిలుపుతుంది.
- source_word: הֵלֶךְ דְּבָשׁ
  choice: తేనె ప్రవాహం
  rationale: ఈ అరుదైన నామపదబంధం అక్షరార్థంగా తేనె ‘సాగడం/ప్రవహించడం’ను సూచిస్తుంది. ‘తేనె ప్రవాహం’ నామపద నిర్మాణాన్ని, అలాగే మూలంలోని కొంత అసాధారణతను కాపాడుతుంది; అది సెలయేరు వంటిదని అతిగా నిర్ధారించదు.
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  choice: అయితే ఎవ్వరూ చేతిని నోటికి చేర్చలేదు
  rationale: హీబ్రూ వాక్యం చేతిని నోటివరకు చేర్చడం అనే స్పష్టమైన దృశ్యాన్ని ఇస్తుంది; సందర్భంలో దాని భావం తేనె తినకపోవడం. ప్రధాన పాఠ్యంలో ఆ మూలచిత్రాన్ని నిలిపి, అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: כִּי יָרֵא הָעָם
  choice: ఎందుకంటే ప్రజలు ... భయపడ్డారు
  rationale: כִּי కారణాన్ని తెలియజేస్తుంది; ירא ఇక్కడ ఉల్లంఘన ఫలితానికి భయపడడాన్ని సూచిస్తుంది. ‘ఎందుకంటే ... భయపడ్డారు’ కారణ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַשְּׁבֻעָה
  choice: ఆ శపథం
  rationale: שבועה యొక్క ప్రత్యక్ష అర్థం ‘శపథం/ప్రమాణం.’ సందర్భంలో అది శాపపూరిత ఆజ్ఞగా పనిచేసినప్పటికీ, ప్రధాన పాఠ్యంలో మూలపదం యొక్క అర్థాన్ని ‘శపథం’గా నిలిపాం.
theological_decisions:
- issue: శపథాన్ని ‘శాపం’గా అనువదించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘శపథం’
  alternative: ‘శాపం’ లేదా ‘శాపంతో కూడిన ఆజ్ఞ’
  rationale: 14:24 సందర్భంలో సౌలు పలికిన మాట ఉల్లంఘించినవాడిపై శాపాన్ని మోపింది. అయినా ఈ వచనంలోని పదం הַשְּׁבֻעָה నేరుగా ‘శపథం’ అని అర్థం. దాని న్యాయ/దైవశాస్త్రీయ స్వభావాన్ని ముందే తీర్మానించకుండా మూలపదాన్ని నిలిపి, సందర్భాన్ని పాదటిప్పణిలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ఇదిగో’ ద్వారా హీబ్రూ కథన సజీవతను, ‘చేతిని నోటికి చేర్చలేదు’ ద్వారా మూలంలోని స్పష్టమైన దృశ్యరూపాన్ని నిలిపాం. అసాధారణమైన הֵלֶךְ דְּבָשׁ పదబంధాన్ని అతిగా వివరణాత్మకం చేయకుండా ‘తేనె ప్రవాహం’గా ఇచ్చి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
