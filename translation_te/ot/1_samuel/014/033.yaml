revisions:
- from: అప్పుడు వారు సౌలుతో, “ఇదిగో, ప్రజలు రక్తంతోనే మాంసం తింటూ యెహోవాకు విరోధంగా పాపం చేస్తున్నారు[a]” అని చెప్పారు. అతడు, “మీరు ద్రోహంగా ప్రవర్తించారు. ఈ రోజే ఒక పెద్ద రాయిని నా దగ్గరికి దొర్లించండి” అన్నాడు.
  to: 'అప్పుడు వారు సౌలుకు ఇలా తెలియజేశారు: “ఇదిగో, ప్రజలు రక్తంతో మాంసం తింటూ యాహ్వేకు విరోధంగా పాపం చేస్తున్నారు[a].” అతడు, “మీరు విశ్వాసఘాతకంగా ప్రవర్తించారు. ఈ రోజు ఒక పెద్ద రాయిని నావద్దకు దొర్లించండి” అన్నాడు.'
  rationale: సవరణలు పరోక్ష కర్మను స్పష్టం చేశాయి, ‘ఈ రోజు’ అనే మూల కాలసూచనను అదనపు నొక్కుదల లేకుండా ఉంచాయి, మరియు దైవనామాన్ని ప్రాజెక్టు నిర్ణయమైన ‘Yahweh’కు అనుగుణంగా ‘యాహ్వే’గా మార్చాయి. రక్తం గురించిన వివాదాస్పద/నుడికార స్వభావాన్ని పాదటిప్పణి ద్వారా కాపాడారు.
