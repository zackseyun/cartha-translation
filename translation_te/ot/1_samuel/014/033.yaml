id: 1SA.14.33
reference: 1 Samuel 14:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּגִּ֤ידוּ לְ/שָׁאוּל֙ לֵ/אמֹ֔ר הִנֵּ֥ה הָ/עָ֛ם חֹטִ֥אים לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל עַל הַ/דָּ֑ם וַ/יֹּ֣אמֶר בְּגַדְתֶּ֔ם גֹּֽלּוּ אֵלַ֥/י הַ/יּ֖וֹם אֶ֥בֶן גְּדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
translation:
  language: te
  text: 'అప్పుడు వారు సౌలుకు ఇలా తెలియజేశారు: “ఇదిగో, ప్రజలు రక్తంతో మాంసం తింటూ యాహ్వేకు విరోధంగా పాపం చేస్తున్నారు[a].” అతడు, “మీరు విశ్వాసఘాతకంగా ప్రవర్తించారు. ఈ రోజు ఒక పెద్ద రాయిని నావద్దకు దొర్లించండి” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రక్తం మీద/తో తింటున్నారు.” అంటే, రక్తం పూర్తిగా కార్చకుండా మాంసాన్ని తింటున్నారు.
    reason: మూల హీబ్రూ నుడికారంలోని రూపాన్ని మరియు సందర్భానుసార భావాన్ని రెండింటినీ తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר
  choice: అప్పుడు వారు సౌలుతో ... అని చెప్పారు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో చూపుతుంది; לֵאמֹר అనే ఉద్ధరణ సూచకాన్ని తెలుగు ‘అని’తో వ్యక్తం చేసింది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: వినేవారి దృష్టిని నివేదికపై నిలిపే హీబ్రూ సూచక అవ్యయ బలాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో నిలుపుతుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సందర్భంలో సౌలు ఆధీనంలోని జనాన్ని లేదా సైనికులను సూచించే సమూహ నామానికి సహజమైన అనువాదం.
- source_word: חֹטִאים לַיהוָה
  choice: యెహోవాకు విరోధంగా పాపం చేస్తున్నారు
  rationale: חטא తో కూడిన ל ఇక్కడ దేవునికి వ్యతిరేకంగా చేసిన అపరాధాన్ని సూచిస్తుంది; సంబంధపరమైన దోషాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని తెలుగు పాఠకులకు సుపరిచితమైన ప్రత్యక్ష రూపంలో అందిస్తుంది.
- source_word: לֶאֱכֹל עַל־הַדָּם
  choice: రక్తంతోనే మాంసం తింటూ
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘రక్తం మీద/తో తినడం’; సందర్భంలో రక్తం పూర్తిగా కార్చని మాంసాన్ని తినడాన్ని సూచిస్తుంది. తెలుగులో అస్పష్టంగా ఉండే ‘రక్తం మీద తినడం’ కన్నా భావాన్ని సహజంగా తెలియజేస్తూ మూల చిత్రాన్ని ‘రక్తంతోనే’ ద్వారా నిలుపుతుంది.
- source_word: בְּגַדְתֶּם
  choice: మీరు ద్రోహంగా ప్రవర్తించారు
  rationale: בגד లోని విశ్వాసఘాతకత్వం మరియు తీవ్రమైన నైతిక తప్పు అనే భావాన్ని సాధారణ ‘అతిక్రమించారు’ కంటే బలంగా నిలుపుతుంది.
- source_word: גֹּלּוּ אֵלַי
  choice: నా దగ్గరికి దొర్లించండి
  rationale: גלל బహువచన ఆజ్ఞారూపానికి ‘దొర్లించండి’ ప్రత్యక్ష సమానార్థకం; పెద్ద రాయి అనే కర్మకు సందర్భోచితం.
- source_word: הַיּוֹם
  choice: ఈ రోజే
  rationale: ‘ఈ రోజు’ అనే ప్రత్యక్ష కాలార్థంతో పాటు సందర్భంలోని తక్షణత్వాన్ని తెలుగు ‘-ఏ’ నొక్కిచెప్పే ప్రత్యయం సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం సాధారణ బిరుదును కాక దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది; అందువల్ల పేరును పేరుగానే ఉంచి, బిరుదుతో భర్తీ చేయలేదు.
- issue: రక్తంతో మాంసం తినడం వల్ల కలిగిన అపరాధ స్వరూపం
  choice: యెహోవాకు విరోధంగా పాపం చేస్తున్నారు
  alternative: యెహోవాను అపరాధపరుస్తున్నారు
  rationale: חטא యొక్క మతపరమైన, సంబంధపరమైన తీవ్రతను ‘పాపం’ నిలుపుతుంది; ఈ వాక్యం రక్తం గురించి ధర్మశాస్త్ర నిషేధాన్ని సూచించినా, అనువాదంలో అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో,’ ‘ద్రోహంగా ప్రవర్తించారు,’ ‘దొర్లించండి’ వంటి పదాలు మూలంలోని దృష్టి ఆకర్షణ, నైతిక తీవ్రత, స్పష్టమైన చర్యలను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఎంపికయ్యాయి.
