  yaml_path: translation/ot/1_samuel/014/019.yaml
  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
translation:
  language: te
  text: సౌలు యాజకునితో మాట్లాడుతుండగా, ఫిలిష్తీయుల శిబిరంలోని కలకలం అంతకంతకూ పెరుగుతూ వచ్చింది. అప్పుడు సౌలు యాజకునితో, “నీ చెయ్యి వెనక్కు తీసుకో[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ చెయ్యిని కూడదీసుకో.” యాజకుడు చేస్తున్న చర్యను ఆపమని సౌలు చెబుతున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד דִּבֶּר
  choice: ఇంకా మాట్లాడుతుండగా
  rationale: ఈ నిర్మాణం సౌలు మాట్లాడుతున్న సమయంలోనే కలకలం పెరుగుతూ, అతని మాటకు అంతరాయం కలిగిన భావాన్ని తెలియజేస్తుంది. తెలుగు కథన శైలిలో సహజంగా ఉండేందుకు וַיְהִיని విడిగా అనువదించకుండా కాలసంబంధ వాక్య నిర్మాణంలో పొందుపరిచాం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: כהןకు సందర్భానుకూలమైన సాధారణ తెలుగు పదం. ముందే పరిచయమైన నిర్దిష్ట యాజకుణ్ణి సూచిస్తుంది.
- source_word: הֶהָמוֹן
  choice: కలకలం
  rationale: ఇక్కడ המון కేవలం శబ్దాన్ని కాకుండా గందరగోళంతో కూడిన అల్లకల్లోలాన్ని సూచిస్తుంది; ‘కలకలం’ ఈ రెండు భావాలను సహజంగా అందిస్తుంది.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల శిబిరంలోని
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  choice: అంతకంతకూ పెరుగుతూ వచ్చింది
  rationale: క్రియతో కూడిన infinitive absolute నిర్మాణం నిరంతరమైన తీవ్రతా వృద్ధిని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ క్రమంగా పెరుగుతున్న భావాన్ని తెలియజేస్తుంది.
- source_word: אֱסֹף יָדֶךָ
  choice: నీ చెయ్యి వెనక్కి తీసుకో
  rationale: అక్షరార్థంగా ‘నీ చెయ్యి సమకూర్చుకో/ముడుచుకో.’ సందర్భంలో యాజకుడు చేస్తున్న చర్యను ఆపమనే ఆజ్ఞ. concrete imageను నిలుపుతూ ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
