  edition: WLC
  text: וַ/יַּעַן֩ אִ֨ישׁ מֵֽ/הָ/עָ֜ם וַ/יֹּ֗אמֶר הַשְׁבֵּעַ֩ הִשְׁבִּ֨יעַ אָבִ֤י/ךָ אֶת הָ/עָם֙ לֵ/אמֹ֔ר אָר֥וּר הָ/אִ֛ישׁ אֲשֶׁר יֹ֥אכַל לֶ֖חֶם הַ/יּ֑וֹם וַ/יָּ֖עַף הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/028.yaml
  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
translation:
  language: te
  text: 'అప్పుడు ప్రజల్లో ఒకడు జవాబుగా ఇలా అన్నాడు: “నీ తండ్రి, ‘ఈ రోజు ఆహారం[a] తినేవాడు శాపగ్రస్తుడు’ అని చెబుతూ, ప్రజలతో గట్టిగా ప్రమాణం చేయించాడు.” అందువల్ల ప్రజలు నీరసించారు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః ‘రొట్టె’; ఇక్కడ సాధారణంగా ఆహారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రజలు బాగా అలసిపోయారు.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: అన్నాడు
  rationale: సంభాషణ సందర్భంలో హీబ్రూ జవాబు క్రియను తెలుగులో సహజమైన కథన శైలితో వ్యక్తపరుస్తుంది.
- source_word: אִישׁ מֵהָעָם
  choice: ప్రజల్లో ఒకడు
  rationale: ప్రజల మధ్యనుండి మాట్లాడిన ఒక అనిర్దిష్ట వ్యక్తిని సహజంగా, ఏకవచనంగా సూచిస్తుంది.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: కఠినంగా ప్రమాణం చేయిస్తూ
  rationale: హిఫిల్ క్రియలోని ప్రమాణం చేయించిన భావాన్నీ, అనంతక్రియ-సంపూర్ణక్రియ నిర్మాణంలోని తీవ్రతనూ నిలుపుతుంది.
- source_word: אָבִיךָ
  choice: నీ తండ్రి
  rationale: యోనాతానును నేరుగా సంబోధించే ద్వితీయ పురుష ఏకవచన స్వామ్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אָרוּר
  choice: శపించబడతాడు
  rationale: శాప ప్రకటనలోని గంభీరమైన న్యాయసదృశ బలాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הָאִישׁ אֲשֶׁר יֹאכַל
  choice: తినే వ్యక్తి
  rationale: హీబ్రూ పుంలింగ ఏకవచన రూపం ఇక్కడ సాధారణంగా ఎవరినైనా సూచిస్తుంది; తెలుగు ‘వ్యక్తి’ ఆ విస్తృత ప్రయోగాన్ని సహజంగా అందిస్తుంది.
- source_word: לֶחֶם
  choice: ఆహారం
  rationale: పదశః ‘రొట్టె’ అయినప్పటికీ, పరిసర సందర్భంలో తేనెతో సహా ఏ ఆహారాన్నైనా సూచిస్తున్నందున విస్తృత సందర్భార్థాన్ని ఎంచుకున్నాం.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: ప్రత్యక్ష ఉక్తిలో సమకాలిక సూచనను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַיָּעַף
  choice: అలసిపోయారు
  rationale: ఈ క్రియ అలసట, నీరసం లేదా సొమ్మసిల్లే స్థితిని సూచించగలదు; అస్పష్టతను అతిగా నిర్దిష్టం చేయకుండా సాధారణ అర్థాన్ని ఇస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సందర్భంలో సైనికులను సూచించినా, మూలంలోని సాధారణ పదాన్ని పారదర్శకంగా నిలుపుతుంది.
