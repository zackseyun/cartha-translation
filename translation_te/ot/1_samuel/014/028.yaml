translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి ఉపయోగించబడింది. ప్రమాణం చేయించిన చర్యలోని తీవ్రత నిలుపబడింది; లֶחֶם యొక్క విస్తృత సందర్భార్థం ప్రధాన పాఠ్యంలో ఇచ్చి పదశః అర్థం పాదటిప్పణిలో నమోదు చేయబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
