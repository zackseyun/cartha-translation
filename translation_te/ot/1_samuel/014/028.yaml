- from: అప్పుడు ప్రజల్లో ఒకడు, “నీ తండ్రి ప్రజలచేత కఠినంగా ప్రమాణం చేయిస్తూ, ‘ఈ రోజు ఆహారం[a] తినే వ్యక్తి శపించబడతాడు’ అని చెప్పాడు” అన్నాడు. అందువల్ల ప్రజలు అలసిపోయారు[b].
  to: 'అప్పుడు ప్రజల్లో ఒకడు జవాబుగా ఇలా అన్నాడు: “నీ తండ్రి, ‘ఈ రోజు ఆహారం[a] తినేవాడు శాపగ్రస్తుడు’ అని చెబుతూ, ప్రజలతో గట్టిగా ప్రమాణం చేయించాడు.” అందువల్ల ప్రజలు నీరసించారు[b].'
  rationale: The revision resolves the oath clause’s ambiguity by explicitly making the father the one who caused the people to swear and by attaching the quotation to that action. It retains the source’s emphatic force, generic singular curse formula, contextual sense of ‘food,’ and the result that the people were weak or exhausted. Both footnote anchors remain correctly placed and the footnotes support the stated lexical and alternative-reading decisions.
