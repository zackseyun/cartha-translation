    reason: alternative_reading
  revision_rationale: The revision resolves the oath clause’s ambiguity by explicitly making the father the one who caused the people to swear and by attaching the quotation to that action. It retains the source’s emphatic force, generic singular curse formula, contextual sense of ‘food,’ and the result that the people were weak or exhausted. Both footnote anchors remain correctly placed and the footnotes support the stated lexical and alternative-reading decisions.
