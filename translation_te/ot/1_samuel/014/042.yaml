  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
translation:
  language: te
  text: అప్పుడు సౌలు, “నాకూ నా కుమారుడైన యోనాతానుకూ మధ్య చీట్లు వేయండి[a]” అన్నాడు. యోనాతాను పట్టుబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నాకూ నా కుమారుడైన యోనాతానుకూ మధ్య పడేలా చేయండి”; ఇక్కడ చీటి ద్వారా విషయాన్ని నిర్ణయించాలనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּילוּ
  choice: చీట్లు వేయండి
  rationale: హిఫీల్ ఆజ్ఞారూపానికి అక్షరార్థం ‘పడేలా చేయండి’; అయితే చుట్టూ ఉన్న సందర్భంలో చీట్ల ద్వారా నిర్ణయించడం ఉద్దేశం. తెలుగులో ‘చీట్లు వేయండి’ సహజమైన సందర్భోచిత ప్రయోగం.
- source_word: בֵּינִי וּבֵין
  choice: నాకూ ... యోనాతానుకూ మధ్య
  rationale: ఇద్దరిలో ఒకరిని ఎంపిక చేయడానికి ఉద్దేశించిన వ్యత్యాసాన్ని జత పరసర్గం సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ఈ రూపం సహజం.
- source_word: בְּנִי
  choice: నా కుమారుడు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న בֵּן స్పష్టంగా కుమార సంబంధాన్ని సూచిస్తుంది.
- source_word: וַיִּלָּכֵד
  choice: పట్టుబడ్డాడు
  rationale: లכד నిఫాల్ రూపానికి ‘పట్టుబడ్డాడు/చిక్కాడు’ అనే ప్రాథమిక భావం ఉంది. చీట్ల సందర్భంలో యోనాతాను చీటి ద్వారా గుర్తించబడ్డాడని ఇది సూచిస్తుంది; ‘చీటిలో’ అని చేర్చడం తెలుగులో సందర్భాన్ని స్పష్టం చేస్తూనే మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: יוֹנָתָן
  choice: యోనాతాను
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు సౌలు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథన క్రమాన్ని ముందుకు తీసుకెళ్తుంది; ‘అప్పుడు’ ఆధునిక తెలుగులో ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
