base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: One day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
translation:
  language: te
  text: ఒక రోజు సౌలు కుమారుడైన యోనాతాను తన ఆయుధాలు మోసే యువకునితో, “రా, ఆ అవతలి వైపున[b] ఉన్న ఫిలిష్తీయుల సైనిక స్థావరానికి[a] మనం దాటి వెళ్దాం” అన్నాడు. అయితే యోనాతాను తన తండ్రికి ఈ సంగతి చెప్పలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఫిలిష్తీయుల సైనిక పహారా స్థానం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం ఒక సైనిక స్థావరాన్ని గానీ, అక్కడ మోహరించిన దళాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఈ దానికి అవతల ఉన్నది.’ తరువాతి వచనాల్లో వర్ణించిన కనుమను ఇది సూచిస్తూ ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: ఒక రోజు
  rationale: హీబ్రూ కథన ప్రారంభ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో కాలసూచకంగా అందిస్తుంది; మూలంలో లేని ‘ఇప్పుడు’ అనే పదాన్ని చేర్చదు.
- source_word: הַנַּעַר
  choice: యువకుడు
  rationale: נַעַר సందర్భానుసారం బాలుడు, యువకుడు లేదా సేవకుడు కావచ్చు. ఇతడు యుద్ధంలో ఆయుధాలు మోసేవాడు కాబట్టి ‘యువకుడు’ సరైనది; ‘బాలుడు’ తప్పుదారి పట్టించవచ్చు.
- source_word: נֹשֵׂא כֵלָיו
  choice: తన ఆయుధాలు మోసే
  rationale: అక్షరార్థంగా అతని సామగ్రి లేదా ఆయుధాలు మోసేవాడు. వివరణాత్మక హీబ్రూ నిర్మాణాన్ని సహజంగా ఉంచుతూ, ప్రత్యేక సైనిక బిరుదుకన్నా సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: לְכָה וְנַעְבְּרָה
  choice: రా, ... మనం దాటి వెళ్దాం
  rationale: לְכָה లోని ఆహ్వానాన్ని ‘రా’ అని, cohortative భావాన్ని ‘మనం దాటి వెళ్దాం’ అని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల సైనిక స్థావరం
  rationale: ఈ సైనిక సందర్భంలో పదం ఒక స్థావరాన్ని లేదా అక్కడ మోహరించిన దళాన్ని సూచించవచ్చు. ప్రధాన పాఠ్యంలో సహజమైన ‘సైనిక స్థావరం’ వాడి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: אֲשֶׁר מֵעֵבֶר הַלָּז
  choice: ఆ అవతలి వైపున ఉన్న
  rationale: మూలంలోని స్థలసూచకమైన, కొంత అస్పష్టమైన వ్యక్తీకరణను అలాగే నిలుపుతుంది. తరువాతి వచనాల ఆధారంగా ‘కనుమ’ లేదా ‘దారి’ అని ప్రధాన పాఠ్యంలో స్పష్టీకరించదు.
- source_word: וּלְאָבִיו לֹא הִגִּיד
  choice: అయితే అతడు తన తండ్రికి ఈ సంగతి చెప్పలేదు
  rationale: కథనంలోని వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; ‘ఈ సంగతి’ తెలుగు వాక్యంలో సహజమైన కర్మను అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలి వాడబడింది. స్థలసూచక హీబ్రూ ప్రయోగంలోని అస్పష్టతను ప్రధాన పాఠ్యంలో కాపాడి, సాధ్యమైన సందర్భార్థాన్ని పాదసూచికలో ఇచ్చాం. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల దగ్గర ఉంచబడ్డాయి.
