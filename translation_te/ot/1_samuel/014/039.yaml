source:
  edition: WLC
  text: כִּ֣י חַי יְהוָ֗ה הַ/מּוֹשִׁ֨יעַ֙ אֶת יִשְׂרָאֵ֔ל כִּ֧י אִם יֶשְׁנ֛/וֹ בְּ/יוֹנָתָ֥ן בְּנִ֖/י כִּ֣י מ֣וֹת יָמ֑וּת וְ/אֵ֥ין עֹנֵ֖/הוּ מִ/כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/039.yaml
  text: For as Yahweh lives[a], who saves Israel, even if it is in Jonathan my son, he shall surely die.” But not one of all the people answered him.
translation:
  language: te
  text: “ఇశ్రాయేలును రక్షించే యెహోవా జీవం తోడు—అది నా కుమారుడు యోనాతానులో ఉన్నా[a], అతడు తప్పకుండా చనిపోవాలి.” అయితే ప్రజలందరిలో ఒక్కరు కూడా అతనికి జవాబివ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “అది నా కుమారుడు యోనాతానులో ఉన్నా.” ‘అది’ దేనిని సూచిస్తుందో వాక్యంలో చెప్పలేదు; సందర్భం ప్రకారం విచారణలో ఉన్న అపరాధం లేదా దోషం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: యెహోవా జీవం తోడు
  rationale: ఇది హెబ్రీలోని ప్రామాణిక ప్రమాణ సూత్రం. ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ప్రమాణ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: הַמּוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును రక్షించే
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న కృదంతం యెహోవాను నిరంతర లక్షణంతో వర్ణిస్తుంది; ‘రక్షించే’ ఆ కృదంత భావాన్ని నిలుపుతుంది.
- source_word: כִּי אִם
  choice: ఉన్నా
  rationale: ప్రమాణ సందర్భంలో అత్యంత సమీపమైన వ్యక్తినీ మినహాయించని ఊహాత్మక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: అది నా కుమారుడు యోనాతానులో ఉన్నా
  rationale: హెబ్రీ వాక్యంలో ‘అది’ దేనిని సూచిస్తుందో స్పష్టంగా చెప్పలేదు. అపరాధం లేదా విచారణలో ఉన్న దోషం అని సందర్భం సూచించినా, మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను ప్రధాన పాఠ్యంలో కాపాడాం.
- source_word: מוֹת יָמוּת
  choice: అతడు తప్పకుండా చనిపోవాలి
  rationale: క్రియావిశేష బలాన్ని ఇచ్చే infinitive absolute మరియు imperfect కలయిక నిశ్చయతతో కూడిన శిక్షా ప్రకటనను సూచిస్తుంది; ‘తప్పకుండా’ ఆ బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְאֵין עֹנֵהוּ מִכָּל הָעָם
  choice: అయితే ప్రజలందరిలో ఒక్కరు కూడా అతనికి జవాబివ్వలేదు
  rationale: ‘ప్రజలందరిలో ఒక్కరు కూడా’ అనే నిర్మాణం partitive భావాన్ని, ‘అయితే’ ప్రమాణ ప్రకటనకు ప్రతిస్పందనగా వచ్చిన మౌనంలోని వ్యత్యాసాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో గుర్తించదగిన రూపంలో నిలుపుతుంది.
- issue: యోనాతానులో ఉన్నదేమిటనే అంతర్లీన సూచన
  choice: ప్రధాన పాఠ్యంలో ‘అది’ అని అస్పష్టతను నిలుపడం
  alternative: ‘అపరాధం అతనిలో ఉన్నా’ అని స్పష్టీకరించడం
  rationale: సందర్భం అపరాధం లేదా విచారణలోని దోషాన్ని సూచించినప్పటికీ, హెబ్రీ మూలం ఆ నామవాచకాన్ని ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చకుండా పాదటిప్పణిలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రమాణ ప్రకటనకు తగిన గంభీరతను నిలిపాం. ‘యెహోవా జీవం తోడు’ సాంప్రదాయ ప్రమాణ ధోరణిని స్పష్టంగా తెలియజేస్తుంది; చివరి వాక్యం ప్రజల సంపూర్ణ మౌనాన్ని సాధారణ పాఠకునికి సూటిగా అందిస్తుంది.
