translation:
  language: te
  text: 'అప్పుడు అతని ఆయుధాలను మోసేవాడు అతనితో ఇలా అన్నాడు: “నీ మనసులో ఉన్నదంతా చేయి. ముందుకు సాగు; ఇదిగో, నీ మనసుకు అనుగుణంగా నేను నీతో ఉన్నాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: అతని ఆయుధాలు మోసేవాడు
  rationale: పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం; యోనాతాను ఆయుధాలను మోసే సహాయకుణ్ణి సూచిస్తుంది.
- source_word: עֲשֵׂה כָּל אֲשֶׁר בִּלְבָבֶךָ
  choice: నీ హృదయంలో ఉన్నదంతా చేయి
  rationale: హీబ్రూ హృదయ ప్రయోగాన్ని నిలుపుతూ, అతని సంకల్పమంతా అమలు చేయమనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נְטֵה לָךְ
  choice: ముందుకు సాగు
  rationale: సందర్భంలో చర్యకు పూనుకొని ముందుకు వెళ్లమనే ప్రోత్సాహాన్ని వ్యక్తం చేస్తుంది; అక్షరార్థమైన ‘నీ వైపు తిరుగు’ తెలుగు పాఠకునికి అస్పష్టంగా ఉంటుంది.
- source_word: הִנְנִי עִמְּךָ כִלְבָבֶךָ
  choice: ఇదిగో, నీ హృదయం కోరినట్టే నేను నీతో ఉన్నాను
  rationale: הנני యొక్క సన్నద్ధతను ‘ఇదిగో’తో నిలుపుతూ, כִלְבָבֶךָను యోనాతాను సంకల్పానికి సంపూర్ణ సమ్మతిగా సహజంగా అందిస్తుంది.
