language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בֵ֣ין הַֽ/מַּעְבְּר֗וֹת אֲשֶׁ֨ר בִּקֵּ֤שׁ יֽוֹנָתָן֙ לַֽ/עֲבֹר֙ עַל מַצַּ֣ב פְּלִשְׁתִּ֔ים שֵׁן הַ/סֶּ֤לַע מֵ/הָ/עֵ֨בֶר֙ מִ/זֶּ֔ה וְ/שֵׁן הַ/סֶּ֥לַע מֵ/הָ/עֵ֖בֶר מִ/זֶּ֑ה וְ/שֵׁ֤ם הָֽ/אֶחָד֙ בּוֹצֵ֔ץ וְ/שֵׁ֥ם הָ/אֶחָ֖ד סֶֽנֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
translation:
  language: te
  text: యోనాతాను ఫిలిష్తీయుల సైనిక స్థావరానికి చేరేందుకు దాటిపోవాలని ప్రయత్నించిన కనుమ మార్గాల మధ్య, ఒక వైపున పదునైన రాతి శిఖరం, మరో వైపున ఇంకొక పదునైన రాతి శిఖరం ఉండేవి. ఒకదాని పేరు బొజేసు, మరొకదాని పేరు సెనే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  choice: కనుమ మార్గాలు
  rationale: ఈ రాతిమయ భూభాగంలో దాటడానికి వీలైన ఇరుకైన మార్గాలను సూచిస్తుంది; నీటి దాటును అనవసరంగా సూచించకుండా సహజమైన తెలుగు రూపం.
- source_word: בִּקֵּשׁ ... לַעֲבֹר
  choice: దాటిపోవాలని ప్రయత్నించిన
  rationale: ఉద్దేశంతో కూడిన ప్రయత్నం అనే భావాన్ని నిలుపుతుంది; కేవలం ‘కోరుకున్న’ అనే బలహీన భావానికి పరిమితం చేయదు.
- source_word: עַל מַצַּב פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల సైనిక స్థావరం దగ్గరికి
  rationale: మిలిటరీ సందర్భంలో מַצָּב నిలిపి ఉంచిన దళం లేదా దాని స్థావరాన్ని సూచిస్తుంది; עַל ఇక్కడ లక్ష్యంగా ఉన్న స్థావరం వైపు చేరడాన్ని సూచించేలా సందర్భానుగుణంగా అనువదించబడింది.
- source_word: שֵׁן הַסֶּלַע
  choice: రాతి కోర
  rationale: అక్షరార్థంగా ‘రాతి పంటి’; పదునుగా ముందుకు పొడుచుకొచ్చిన రాతి శిఖరాన్ని ‘రాతి కోర’ సహజంగా, దృశ్యాత్మకంగా తెలియజేస్తుంది.
- source_word: מֵהָעֵבֶר מִזֶּה ... מֵהָעֵבֶר מִזֶּה
  choice: ఒక వైపున ... మరో వైపున
  rationale: మార్గానికి ఎదురెదురుగా ఉన్న రెండు వైపులను స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  choice: ఒకదాని పేరు ... మరొకదాని పేరు
  rationale: హీబ్రూ నామకరణ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בּוֹצֵץ
  choice: బొజేసు
  rationale: స్థలనామాన్ని తెలుగు బైబిలు పాఠకులకు పలకడానికి అనువైన రూపంలో లిప్యంతరీకరించింది.
- source_word: סֶנֶּה
  choice: సెనే
  rationale: స్థలనామాన్ని అర్థానువాదం చేయకుండా లిప్యంతరీకరించింది.
- source_word: וּבֵין
  choice: మధ్య
  rationale: וְ కథన అనుసంధానాన్ని తెలుగులో ప్రత్యేకమైన కాలసూచక పదం చేర్చకుండా వాక్య నిర్మాణంలో సహజంగా మిళితం చేసింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర కథన శైలి. భౌగోళిక చిత్రణను సహజంగా ఉంచుతూ హీబ్రూ రూపకానికి పాదసూచిక ఇచ్చింది.
