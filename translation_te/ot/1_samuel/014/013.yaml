translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఆయుధవాహకుడు’ అనే సంక్షిప్త సాంకేతిక పదానికి బదులుగా ‘ఆయుధాలు మోసేవాడు’ అనే పారదర్శకమైన వ్యక్తీకరణ ఎంచుకోబడింది. హీబ్రూలోని ‘అతని వెనుక’ అనే పునరుక్తి నిలుపబడింది.
