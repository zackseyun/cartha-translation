reference: 1 Samuel 14:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַל יוֹנָתָ֗ן עַל יָדָי/ו֙ וְ/עַל רַגְלָ֔י/ו וְ/נֹשֵׂ֥א כֵלָ֖י/ו אַחֲרָ֑י/ו וַֽ/יִּפְּלוּ֙ לִ/פְנֵ֣י יוֹנָתָ֔ן וְ/נֹשֵׂ֥א כֵלָ֖י/ו מְמוֹתֵ֥ת אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/013.yaml
  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
translation:
  language: te
  text: అప్పుడు యోనాతాను చేతులూ కాళ్లూ ఆనించి పైకి ఎక్కాడు; అతని ఆయుధాలు మోసేవాడు అతని వెనుక వచ్చాడు. వారు యోనాతాను ఎదుట పడిపోయారు; అతని ఆయుధాలు మోసేవాడు అతని వెనుకనే వారిని చంపుతూ వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని వెనుక వారిని చంపుతూ ఉన్నాడు.” హీబ్రూ భాగధాతువు కొనసాగుతున్న చర్యను లేదా మళ్లీ మళ్లీ జరిగిన చర్యను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి ఎక్కాడు
  rationale: עלה అనే క్రియకు ‘పైకి వెళ్లాడు/ఎక్కాడు’ అనే అర్థం ఉంది. చేతులూ కాళ్లూ ఉపయోగించిన సందర్భంలో ‘పైకి ఎక్కాడు’ సహజంగా భౌతిక చర్యను తెలియజేస్తుంది.
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  choice: చేతులూ కాళ్లూ ఆనించి
  rationale: హీబ్రూ వర్ణించే శరీర భంగిమను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘నాలుగు కాళ్లపై’ వంటి అధిక వ్యాఖ్యానాత్మక ప్రయోగాన్ని నివారిస్తుంది.
- source_word: נֹשֵׂא כֵלָיו
  choice: అతని ఆయుధాలు మోసేవాడు
  rationale: యోధుని సామగ్రి లేదా ఆయుధాలు మోసే సహాయకుణ్ణి సూచించే సైనిక పాత్రను సాధారణ పాఠకులకు వెంటనే అర్థమయ్యే విధంగా అనువదిస్తుంది.
- source_word: אַחֲרָיו
  choice: అతని వెనుక
  rationale: ఈ కథన సందర్భంలో స్థానం, అనుసరణ రెండింటినీ సహజంగా సూచిస్తుంది. హీబ్రూలో పదం రెండుసార్లు రావడాన్ని అనువాదంలోనూ నిలుపుతుంది.
- source_word: וַיִּפְּלוּ לִפְנֵי יוֹנָתָן
  choice: వారు యోనాతాను ఎదుట పడిపోయారు
  rationale: యుద్ధంలో యోనాతాను ఎదుట వారు కూలిపోవడం లేదా ఓడిపోవడం అనే భావాన్ని ఉద్దేశపూర్వకంగా మరీ నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: מְמוֹתֵת
  choice: వారిని చంపుతూ వచ్చాడు
  rationale: పీలేల్ భాగధాతువు సూచించే కొనసాగుతున్న లేదా పునరావృత చర్యను సందర్భానుగుణంగా వ్యక్తపరుస్తుంది. కర్మ హీబ్రూలో స్పష్టంగా లేకపోయినా, ముందున్న బహువచన కర్తను బట్టి తెలుగులో ‘వారిని’ అవసరమైన స్పష్టతనిస్తుంది.
