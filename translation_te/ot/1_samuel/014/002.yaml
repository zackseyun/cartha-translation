source:
  edition: WLC
  text: וְ/שָׁא֗וּל יוֹשֵׁב֙ בִּ/קְצֵ֣ה הַ/גִּבְעָ֔ה תַּ֥חַת הָ/רִמּ֖וֹן אֲשֶׁ֣ר בְּ/מִגְר֑וֹן וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
translation:
  language: te
  text: సౌలు గిబియా అంచున, మిగ్రోనులో ఉన్న దానిమ్మ చెట్టు కింద ఉన్నాడు; అతనితో ఉన్నవారు దాదాపు ఆరువందల మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: ఉండేవాడు
  rationale: ישׁב అనే కృదంతం కూర్చోవడం లేదా ఒకచోట ఉండడం అనే అర్థాలను ఇవ్వగలదు. సైనిక కథన సందర్భంలో సౌలు అక్కడే ఉన్నాడనే కొనసాగుతున్న స్థితిని సహజంగా తెలియజేయడానికి ‘ఉండేవాడు’ ఎంచుకోబడింది; ‘కూర్చుని ఉండేవాడు’ కూడా సాధ్యమే.
- source_word: בִּקְצֵה הַגִּבְעָה
  choice: గిబియా శివారులో
  rationale: קָצֶה అంటే అంచు లేదా చివరి భాగం. పట్టణ స్థలవివరణలో ఆధునిక తెలుగులో ‘శివారులో’ సహజంగా ఉండి, గిబియా అంచున అనే భావాన్ని అందిస్తుంది.
- source_word: הַגִּבְעָה
  choice: గిబియా
  rationale: గִּבְעָה సాధారణంగా ‘కొండ’ అని అర్థమివ్వగలిగినా, ఈ సందర్భంలో సౌలుతో సంబంధమున్న స్థలనామం గిబియాను సూచిస్తుంది.
- source_word: תַּחַת הָרִמּוֹן
  choice: దానిమ్మ చెట్టు కింద
  rationale: רִמּוֹן అక్షరార్థంగా ‘దానిమ్మ’; ఈ స్థలవాచక ప్రయోగంలో చెట్టును సూచిస్తుంది. తెలుగులో అర్థస్పష్టత కోసం ‘చెట్టు’ చేర్చబడింది.
- source_word: אֲשֶׁר בְּמִגְרוֹן
  choice: మిగ్రోనులో ఉన్న
  rationale: సంబంధవాచక ఉపవాక్యం దానిమ్మ చెట్టు ఉన్న ప్రదేశాన్ని గుర్తిస్తుంది. ‘మిగ్రోనులో ఉన్న’ అనేది సహజమైన స్థలవివరణ.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: అతనితో ఉన్నవారు
  rationale: עָם అంటే విస్తృతంగా ప్రజలు లేదా జనులు; సైనిక సందర్భంలో దళాన్ని సూచించవచ్చు. ‘ఉన్నవారు’ మూలంలోని విస్తృతతను కాపాడుతూ తెలుగులో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: దాదాపు ఆరువందల మంది
  rationale: ఉపసర్గ כְּ సంఖ్య సుమారుతనాన్ని సూచిస్తుంది; అందుకే ‘దాదాపు’ నిలుపబడింది. సంఖ్య తరువాత אִישׁను తెలుగులో సహజంగా ‘మంది’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని יוֹשֵׁב పదానికి గల ‘కూర్చుని ఉండడం/ఒకచోట ఉండడం’ అనే సందిగ్ధతను గమనిస్తూ ప్రధాన పాఠ్యంలో సందర్భానుకూలమైన ‘ఉండేవాడు’ వాడబడింది. ‘దానిమ్మ చెట్టు’లో ‘చెట్టు’ స్పష్టత కోసం సహజంగా పూరించబడింది; ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
