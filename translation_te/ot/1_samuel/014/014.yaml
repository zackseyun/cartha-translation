reference: 1 Samuel 14:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּהִ֞י הַ/מַּכָּ֣ה הָ/רִאשֹׁנָ֗ה אֲשֶׁ֨ר הִכָּ֧ה יוֹנָתָ֛ן וְ/נֹשֵׂ֥א כֵלָ֖י/ו כְּ/עֶשְׂרִ֣ים אִ֑ישׁ כְּ/בַ/חֲצִ֥י מַעֲנָ֖ה צֶ֥מֶד שָׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
translation:
  language: te
  text: యోనాతాను, అతని ఆయుధాలను మోసేవాడు చేసిన ఆ తొలి దాడిలో, ఒక ఎద్దుల జత దున్నే పొలంలోని సుమారు అర నాగలి చాలులో దాదాపు ఇరవై మంది పడిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ఒక జత పొలంలోని సుమారు అర నాగలి చాలు” అని ఉంది. ఇది ఒక ఎద్దుల జతతో దున్నే భూమికి సంబంధించిన పాత వ్యవసాయ కొలతను సూచించవచ్చు; పదబంధం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: ప్రాచీన వ్యవసాయ కొలతకు సంబంధించిన హెబ్రీ పదబంధం అనిశ్చితంగా ఉన్నందున అక్షరార్థాన్ని, సాధ్యమైన భావాన్ని రెండింటినీ తెలియజేయడం.
lexical_decisions:
- source_word: הַמַּכָּה הָרִאשֹׁנָה
  choice: ఆ మొదటి సంహారం
  rationale: సైనిక సందర్భంలో מַכָּה ప్రాణాంతక దాడి ఫలితాన్ని సూచిస్తుంది; ‘సంహారం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది, ‘మొదటి’ అనే క్రమార్థాన్ని కూడా నిలుపుతుంది.
- source_word: אֲשֶׁר הִכָּה
  choice: చేసిన
  rationale: ‘సంహారం’తో కలిపి హెబ్రీయ idiomను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; తరువాతి వాక్యంలోని ‘చనిపోయారు’ ప్రాణాంతక ఫలితాన్ని స్పష్టం చేస్తుంది.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: అతని ఆయుధాలు మోసేవాడు
  rationale: పదబంధం యోధుని సామగ్రి లేదా ఆయుధాలను మోసే సహాయకుణ్ణి సూచిస్తుంది; సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: כְּעֶשְׂרִים אִישׁ
  choice: దాదాపు ఇరవై మంది
  rationale: ఉపసర్గ כְּ సూచించే సుమారు సంఖ్యను ‘దాదాపు’ నిలుపుతుంది.
- source_word: כְּבַחֲצִי מַעֲנָה צֶמֶד שָׂדֶה
  choice: ఒక జత ఎద్దులు ఒక రోజులో దున్నగల పొలంలో సగం చాలు విస్తీర్ణంలో
  rationale: కఠినమైన పురాతన వ్యవసాయ కొలతను ఊహాత్మక ఆధునిక ప్రమాణంగా మార్చకుండా, జత ఎద్దులు దున్నే భూవిస్తీర్ణంగా అర్థవంతంగా అందిస్తుంది; כְּ యొక్క సుమారు భావాన్ని ‘చాలు’ ద్వారా సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. పురాతన భూకొలతను ‘ఎకరం’గా ఖచ్చితీకరించకుండా మూలంలోని వ్యవసాయ రూపకాన్నీ అనిశ్చితినీ నిలుపుకున్నాం.
