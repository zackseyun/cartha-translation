id: 1SA.14.23
reference: 1 Samuel 14:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יּ֧וֹשַׁע יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא אֶת יִשְׂרָאֵ֑ל וְ/הַ֨/מִּלְחָמָ֔ה עָבְרָ֖ה אֶת בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/023.yaml
  text: So Yahweh saved Israel that day[a], and the battle passed beyond Beth-aven.
translation:
  language: te
  text: ఆ రోజున యాహ్వే ఇశ్రాయేలును రక్షించాడు; యుద్ధం బేతావెనును దాటి సాగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధం బేతావెను దాటి వెళ్లింది,” లేదా “యుద్ధం బేతావెను అవతలికి ముందుకు సాగింది.”
    reason: עבר మరియు దాని తరువాతి אֶת־בֵּית אָוֶן పదబంధం యుద్ధం బేతావెను దాటి వెళ్లిందా, దాని అవతలికి ముందుకు సాగిందా అనే దగ్గర సంబంధమున్న స్థలగమన భావాలను అనుమతిస్తుంది.
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: రక్షించాడు
  rationale: ישׁע ధాతువు హిఫీల్ రూపంలో ‘రక్షణ కలిగించడం, విడిపించడం’ అనే భావాన్ని ఇస్తుంది. ‘రక్షించాడు’ అనేది యాహ్వే కార్యసాధకుడని స్పష్టంగా ఉంచుతూ మూలంలోని ధార్మిక బరువును కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించాం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: హీబ్రూ కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో ఖచ్చితంగా వ్యక్తపరుస్తుంది.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: ప్రత్యక్ష కర్మగా ఉన్న జాతీయ నామాన్ని, ఇక్కడ సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచించేలా ఉంచాం.
- source_word: וְהַמִּלְחָמָה
  choice: యుద్ధం
  rationale: מִלְחָמָה యుద్ధం లేదా పోరాటాన్ని సూచించగలదు; ఈ కథన సందర్భంలో జరుగుతున్న సైనిక సంగ్రామానికి ‘యుద్ధం’ సహజంగా సరిపోతుంది.
- source_word: עָבְרָה
  choice: దాటి సాగింది
  rationale: עבר లోని దాటిపోవడం లేదా అవతలికి వెళ్లడం అనే స్థలగమన భావాన్ని నిలుపుతూ, యుద్ధం మరో ప్రాంతానికి కొనసాగిందనే సహజ తెలుగు వ్యక్తీకరణను ఇస్తుంది.
- source_word: אֶת בֵּית אָוֶן
  choice: బేతావెనును దాటి
  rationale: עבר తరువాత వచ్చే אֶת స్థలాన్ని దాటిపోవడాన్ని సూచించగలదు. అందువల్ల యుద్ధం బేతావెను అవతలికి కొనసాగిందనే సంభావ్య భావాన్ని ఎంచుకున్నాం; వ్యాకరణంలో ఉన్న స్వల్ప అనిశ్చితిని పాదటిప్పణిలో చూపించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా దేవుని వ్యక్తిగత నామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా, ఆధునికంగా అంగీకరించబడిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని ధ్వన్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. రెండు సమన్విత వాక్యభాగాల మధ్య అర్థసంబంధాన్ని స్పష్టంగా ఉంచేందుకు అర్ధవిరామం వాడాం; మూలంలోని సంక్షిప్తతను కాపాడాం.
