source:
  edition: WLC
  text: וְ/כֹל֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מִּֽתְחַבְּאִ֤ים בְּ/הַר אֶפְרַ֨יִם֙ שָֽׁמְע֔וּ כִּֽי נָ֖סוּ פְּלִשְׁתִּ֑ים וַֽ/יַּדְבְּק֥וּ גַם הֵ֛מָּה אַחֲרֵי/הֶ֖ם בַּ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
translation:
  language: te
  text: ఎఫ్రాయిము కొండప్రాంతంలో దాక్కొని ఉన్న ఇశ్రాయేలు పురుషులందరూ ఫిలిష్తీయులు పారిపోయారని విని, ఆ ఇశ్రాయేలీయులు కూడా యుద్ధంలో వారిని విడవకుండా వెంబడించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “వారు కూడా యుద్ధంలో వారి వెనుక అంటిపట్టుకున్నారు”; అంటే పారిపోతున్న ఫిలిష్తీయులను విడవకుండా వెంబడించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరూ
  rationale: כֹל אִישׁ అనే పంపిణీ భావాన్ని తెలుగులో సహజమైన సమూహ బహువచనంతో వ్యక్తం చేస్తుంది; పురుషవాచక రూపాన్ని కూడా నిలుపుతుంది.
- source_word: הַמִּתְחַבְּאִים
  choice: దాక్కొని ఉన్న
  rationale: తమను తాము దాచుకొని ఉన్న స్థితిని సూచించే హీబ్రూ కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּהַר אֶפְרַיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలో
  rationale: הַר ఇక్కడ ఒకే శిఖరాన్ని కాక ఎఫ్రాయిము ఉన్నత భూభాగాన్ని సూచిస్తుంది.
- source_word: שָׁמְעוּ כִּי נָסוּ פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు పారిపోయారని విని
  rationale: వారు విన్న సమయానికి ఫిలిష్తీయులు పారిపోవడం మొదలైందనే కథన క్రమాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵיהֶם
  choice: వారిని విడవకుండా వెంబడించారు
  rationale: דבק యొక్క ‘అంటిపట్టు/విడవక ఉండు’ మూలభావాన్ని, אחרי తో కూడిన సైనిక సందర్భంలో గట్టి వెంబడింపుగా వ్యక్తం చేస్తుంది.
- source_word: גַם הֵמָּה
  choice: వారు కూడా
  rationale: ఇంతకు ముందు దాక్కొని ఉన్న వీరూ ఇతరులతో పాటు పోరాటంలో పాల్గొన్నారని సూచిస్తుంది.
- source_word: בַּמִּלְחָמָה
  choice: యుద్ధంలో
  rationale: ఇక్కడ జరుగుతున్న నిర్దిష్ట పోరాటాన్ని సూచించే సహజమైన తెలుగు పదప్రయోగం.
