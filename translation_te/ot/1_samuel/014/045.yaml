  to: 'అప్పుడు ప్రజలు సౌలుతో ఇలా అన్నారు: “ఇశ్రాయేలులో ఈ గొప్ప రక్షణను కలిగించిన యోనాతాను చనిపోవాలా? ఎంతమాత్రమూ కాదు![a] యెహోవా జీవముతోడు, అతని తలవెంట్రుకల్లో ఒక్కటైనా నేలమీద పడదు. ఎందుకంటే ఈ రోజు అతడు దేవునితో కలిసి పనిచేశాడు.”[b] ఆ విధంగా ప్రజలు యోనాతానును విడిపించారు,[c] అతడు చనిపోలేదు.'
