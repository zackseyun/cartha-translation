  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם אֶל שָׁא֗וּל הֲֽ/יוֹנָתָ֤ן יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה הַ/יְשׁוּעָ֨ה הַ/גְּדוֹלָ֣ה הַ/זֹּאת֮ בְּ/יִשְׂרָאֵל֒ חָלִ֗ילָ/ה חַי יְהוָה֙ אִם יִפֹּ֞ל מִ/שַּׂעֲרַ֤ת רֹאשׁ/וֹ֙ אַ֔רְצָ/ה כִּֽי עִם אֱלֹהִ֥ים עָשָׂ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּפְדּ֥וּ הָ/עָ֛ם אֶת יוֹנָתָ֖ן וְ/לֹא מֵֽת־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
translation:
  language: te
  text: 'అప్పుడు ప్రజలు సౌలుతో ఇలా అన్నారు: “ఇశ్రాయేలులో ఈ గొప్ప రక్షణను కలిగించిన యోనాతాను చనిపోవాలా? ఎంతమాత్రమూ కాదు![a] యెహోవా జీవముతోడు, అతని తలవెంట్రుకల్లో ఒక్కటైనా నేలమీద పడదు. ఎందుకంటే ఈ రోజు అతడు దేవునితో కలిసి పనిచేశాడు.”[b] ఆ విధంగా ప్రజలు యోనాతానును విడిపించారు,[c] అతడు చనిపోలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అలా జరగడం దూరమగుగాక!’ ఇది అత్యంత బలమైన తిరస్కార వ్యక్తీకరణ.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఈ రోజు అతడు దేవునితో కార్యం చేశాడు.’ ఈ మాట యోనాతాను చేసిన కార్యం దేవునితో సంబంధంలో జరిగిందని సూచిస్తుంది; ఆ సంబంధాన్ని మూలం మరింతగా వివరించదు.
    reason: theological_ambiguity
  - marker: c
    text: ‘విడిపించారు’ అనే హీబ్రూ క్రియకు ‘విమోచించారు’ లేదా ‘రక్షించారు’ అని కూడా అర్థం కావచ్చు; ఇక్కడ ప్రజలు యోనాతానును మరణం నుండి విడుదల చేశారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  choice: యోనాతాను చనిపోవాలా?
  rationale: ప్రశ్నార్థక הֲ మరియు అసంపూర్ణ క్రియ కలసి ఆగ్రహంతో కూడిన అలంకారప్రశ్నను వ్యక్తం చేస్తున్నాయి; తెలుగు రూపం ప్రజల తీవ్ర అభ్యంతరాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  choice: ఇంత గొప్ప విమోచనను
  rationale: సైనిక సందర్భంలోని రక్షణ/విజయ భావాలతో పాటు దేవుని ద్వారా లభించిన విడుదల అనే విస్తృత భావాన్ని ‘విమోచన’ నిలుపుతుంది.
- source_word: חָלִילָה
  choice: ఎంతమాత్రమూ కాదు!
  rationale: దైవనామాన్ని మూలంలో లేని చోట చేర్చకుండా, బలమైన తిరస్కారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חַי יְהוָה
  choice: యెహోవా జీవం తోడు
  rationale: ఇది ప్రమాణ సూత్రం. దైవనామాన్ని పేరుగానే ఉంచుతూ దాని గంభీరతను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  choice: అతని తలవెంట్రుకల్లో ఒక్కటైనా నేలమీద పడదు
  rationale: ప్రమాణ సూత్రం తరువాత אִם సందర్భానుసారంగా గట్టి నిషేధార్థాన్ని ఇస్తుంది; సంపూర్ణ రక్షణను సూచించే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  choice: ఎందుకంటే ఈ రోజు అతడు దేవునితో కలిసి కార్యం చేశాడు
  rationale: עִם యొక్క ప్రాథమిక ‘తో/కలిసి’ భావాన్ని నిలుపుతూ, దైవ సహాయం లేదా సహకారాన్ని మరీ నిర్దిష్టంగా వ్యాఖ్యానించకుండా మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది.
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  choice: ప్రజలు యోనాతానును విమోచించారు
  rationale: פדה మరణ తీర్పు లేదా హక్కుదావా నుంచి విడుదల చేయడాన్ని సూచిస్తుంది. ‘విమోచించారు’ ఆ న్యాయపరమైన విడుదల భావాన్ని నిలుపుతుంది.
- source_word: וְלֹא מֵת
  choice: అతడు చనిపోలేదు
  rationale: మూలంలోని ఫలిత వాక్యాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా సూటిగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు సాధారణ బైబిలు వాడుకలో పేరుగా సుపరిచితమైన ‘యెహోవా’ను ఉపయోగించడం ద్వారా మూలంలోని ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతున్నాం.
- issue: עִם אֱלֹהִים లో యోనాతాను కార్యానికి దేవునితో ఉన్న సంబంధం
  choice: దేవునితో కలిసి కార్యం చేశాడు
  alternative: దేవుని సహాయంతో కార్యం చేశాడు
  rationale: ‘దేవునితో’ అనే మూల పదబంధాన్ని అలాగే ఉంచడం ద్వారా దైవ సహాయం, అనుగ్రహం లేదా సహకారం इनमें ఏదో ఒకదానిగా మాత్రమే నిర్ణయించకుండా అసలు వాక్యంలోని భావ ఉద్వేగాన్ని కాపాడుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. అలంకారప్రశ్న, ప్రమాణ సూత్రం, ‘దేవునితో’ అనే ఉద్దేశపూర్వక అస్పష్టత, విమోచనకు సంబంధించిన న్యాయపరమైన ఛాయలను నిలిపాం.
