  text: And Saul built an altar to Yahweh[a]; this was the first altar he built to Yahweh.
translation:
  language: te
  text: సౌలు యాహ్వేకు ఒక బలిపీఠాన్ని కట్టాడు; యాహ్వేకు అతడు కట్టిన మొదటి బలిపీఠం ఇదే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “అతడు దానిని యాహ్వేకు బలిపీఠంగా కట్టడం ప్రారంభించాడు.” ఈ హీబ్రూ నుడికారాన్ని సాధారణంగా, యాహ్వేకు సౌలు కట్టిన మొదటి బలిపీఠం ఇదే అనే అర్థంలో గ్రహిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: కట్టాడు
  rationale: בנה అనే క్రియకు ఈ సందర్భంలో ‘కట్టు/నిర్మించు’ అని అర్థం. బలిపీఠం విషయంలో ‘కట్టాడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: שאול అనే వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలి అర్పించే స్థలాన్ని సూచించే מזבחకు ఖచ్చితమైన, ప్రాచుర్యంలో ఉన్న తెలుగు సమానార్థకం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל ఉపసర్గ ఇక్కడ అంకితం లేదా సంబంధాన్ని సూచిస్తుంది; יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించి, ‘యెహోవాకు’ అని సహజంగా అనువదించాం.
- source_word: אֹתוֹ
  choice: ఇదే
  rationale: సర్వనామం ముందున్న బలిపీఠాన్ని తిరిగి సూచిస్తుంది. ప్రధాన పఠనంలోని ‘మొదటిది’ అనే భావంతో కలిపి తెలుగులో ‘ఇదే’ సహజంగా ఉంది.
- source_word: הֵחֵל לִבְנוֹת
  choice: కట్టిన మొదటి
  rationale: החל సాధారణంగా ‘మొదలుపెట్టాడు’ అని అర్థమైనా, ఈ క్లిష్టమైన నిర్మాణం సౌలు యెహోవాకు కట్టిన మొదటి బలిపీఠమిదని సాధారణంగా గ్రహించబడుతుంది. ఆ భావాన్ని స్పష్టమైన తెలుగులో ఇచ్చాం; మరింత అక్షరార్థ పఠనాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: אֹתוֹ הֵחֵל לִבְנוֹת అనే నిర్మాణం యొక్క భావం
  choice: యెహోవాకు అతడు కట్టిన మొదటి బలిపీఠం ఇదే
  alternative: అతడు దానిని యెహోవాకు బలిపీఠంగా కట్టడం మొదలుపెట్టాడు
  rationale: హీబ్రూ వాక్యనిర్మాణాన్ని సాధారణంగా సౌలు కట్టిన మొదటి బలిపీఠాన్ని సూచించే నుడికారంగా అర్థం చేసుకుంటారు. అయితే అక్షరార్థ పఠనం కూడా సాధ్యమే కాబట్టి దానిని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘బలిపీఠం’ వంటి స్థిరపడిన బైబిలు పదాన్ని నిలిపి, క్లిష్టమైన హీబ్రూ నుడికారానికి ప్రధాన భావాన్ని సహజంగా ఇచ్చి ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదటిప్పణిలో భద్రపరిచాం.
