translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని క్రమం, ప్రమాణపు న్యాయబలం, చివరి హీబ్రూ రూపకం నిలుపబడ్డాయి; అసాధారణమైన తేనె పదబంధానికి పాదసూచికలో అక్షరార్థ ప్రత్యామ్నాయం ఇవ్వబడింది.
