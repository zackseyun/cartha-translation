base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
translation:
  language: te
  text: అయితే తన తండ్రి ప్రజలను ప్రమాణం చేయించినప్పుడు యోనాతాను దాని గురించి వినలేదు. కాబట్టి అతడు తన చేతిలో ఉన్న కర్ర కొనను చాపి, దాన్ని తేనెపట్టులో[a] ముంచి, తన చేతిని నోటి దగ్గరకు తెచ్చుకున్నాడు. అప్పుడు అతని కళ్లకు వెలుగు వచ్చింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘తేనె అడవిలో/పొదలో’; ఈ హీబ్రూ పదబంధం తేనెపట్టును లేదా దట్టంగా పేరుకున్న తేనెను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అతని కళ్లకు వెలుగు వచ్చింది’ అనేది తిన్న తరువాత శక్తి లేదా చురుకుదనం తిరిగి వచ్చిందని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: అది వినలేదు
  rationale: సందర్భంలో ఇది ఆజ్ఞకు లోబడకపోవడం కాదు; సౌలు ప్రజలను ప్రమాణానికి బద్ధులుగా చేసిన విషయం యోనాతానుకు తెలియకపోవడాన్ని సూచిస్తుంది.
- source_word: בְּהַשְׁבִּיעַ
  choice: ప్రజలను ప్రమాణానికి బద్ధులుగా చేసినప్పుడు
  rationale: హిఫీల్ రూపం ఇతరులను ప్రమాణానికి లోను చేయడాన్ని సూచిస్తుంది; ఈ అనువాదం న్యాయపరమైన బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיִּשְׁלַח
  choice: చాపి
  rationale: కర్ర కొనను ముందుకు చాపిన చర్యను సందర్భానుగుణంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: קְצֵה הַמַּטֶּה
  choice: కర్ర కొనను
  rationale: తేనెలో ముంచిన కర్ర చివరి భాగాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: וַיִּטְבֹּל אוֹתָהּ
  choice: దాన్ని ... ముంచి
  rationale: స్త్రీలింగ సర్వనామం కర్ర కొనను తిరిగి సూచిస్తుంది; 'ముంచి' చర్యను స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: בְּיַעְרַת הַדְּבָשׁ
  choice: తేనెపట్టులో
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా తేనె అడవి/పొద అనే అసాధారణ చిత్రాన్ని కలిగించినా, సందర్భంలో దట్టమైన తేనెపట్టు లేదా తేనె సమూహాన్ని సూచించే అవకాశం ఎక్కువ.
- source_word: וַיָּשֶׁב יָדוֹ אֶל פִּיו
  choice: తన చేతిని నోటి దగ్గరకు తెచ్చుకున్నాడు
  rationale: తేనెను తినేందుకు చేతిని నోటి వద్దకు తీసుకువచ్చిన చర్యను మూలానికి దగ్గరగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַתָּרְאֶנָה עֵינָיו
  choice: అతని కళ్లు వెలిగాయి
  rationale: ఆహారం తిన్న తరువాత శక్తి, చురుకుదనం తిరిగి రావడాన్ని సూచించే హీబ్రూ రూపకాన్ని అర్థాన్ని అతిగా విప్పకుండా నిలుపుతుంది.
