source:
  edition: WLC
  text: וַ/יַּעֲנוּ֩ אַנְשֵׁ֨י הַ/מַּצָּבָ֜ה אֶת יוֹנָתָ֣ן וְ/אֶת נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּֽאמְרוּ֙ עֲל֣וּ אֵלֵ֔י/נוּ וְ/נוֹדִ֥יעָה אֶתְ/כֶ֖ם דָּבָ֑ר וַ/יֹּ֨אמֶר יוֹנָתָ֜ן אֶל נֹשֵׂ֤א כֵלָי/ו֙ עֲלֵ֣ה אַחֲרַ֔/י כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יַ֥ד יִשְׂרָאֵֽל־׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/012.yaml
  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
translation:
  language: te
  text: అప్పుడు సైనిక స్థావరంలోని మనుషులు యోనాతానుకూ అతని ఆయుధాలు మోసేవానికీ జవాబిస్తూ, “మా దగ్గరికి ఎక్కి రండి; మీకు ఒక సంగతి తెలియజేస్తాం” అన్నారు. అప్పుడు యోనాతాను తన ఆయుధాలు మోసేవానితో, “నా వెనుక ఎక్కి రా; ఎందుకంటే యహ్వే వారిని ఇశ్రాయేలు చేతికి అప్పగించాడు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ జాతీయం: “ఇశ్రాయేలు చేతిలో ఇచ్చాడు”; అంటే, ఇశ్రాయేలు అధికారానికి అప్పగించాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  choice: దండుస్థానంలోని మనుషులు
  rationale: సైనిక సందర్భంలో מַצָּבָה అనేది కాపలా లేదా సైనిక దండు నిలిచిన స్థానాన్ని సూచిస్తుంది; ‘దండుస్థానం’ ఈ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: נֹשֵׂא כֵלָיו
  choice: అతని ఆయుధాలు మోసేవాడు
  rationale: మూలంలోని ‘అతని సామగ్రి/ఆయుధాలు మోసేవాడు’ అనే భావాన్ని ఆధునిక పాఠకునికి స్పష్టంగా, అనవసరమైన సాంకేతిక పదం లేకుండా అందిస్తుంది.
- source_word: עֲלוּ אֵלֵינוּ
  choice: మా దగ్గరికి ఎక్కి రండి
  rationale: ఫిలిష్తీయులు ఉన్న ఎత్తైన ప్రదేశానికి పైకి కదలడాన్ని עלה సూచిస్తుంది; ‘మా దగ్గరికి’ వక్తల దిశాభావాన్ని నిలుపుతుంది.
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  choice: మీకు ఒక సంగతి తెలియజేస్తాం
  rationale: ידע హిఫీల్ రూపంలోని ‘తెలియజేయడం’ భావాన్నీ, דָּבָר లోని ఉద్దేశపూర్వక అస్పష్టతనూ నిలుపుతుంది.
- source_word: עֲלֵה אַחֲרַי
  choice: నా వెనుక ఎక్కి రా
  rationale: ఏకవచన ఆజ్ఞను, పైకి ఎక్కే కదలికను, యోనాతాను వెనుక అనుసరించాలనే క్రమాన్ని నిలుపుతుంది.
- source_word: כִּי נְתָנָם יְהוָה בְּיַד יִשְׂרָאֵל
  choice: ఎందుకంటే యహ్వే వారిని ఇశ్రాయేలు చేతికి అప్పగించాడు
  rationale: యుద్ధ సందర్భంలోని נתן ... ביד అనే జాతీయాన్ని సహజమైన తెలుగులో ‘చేతికి అప్పగించాడు’గా అందిస్తూ, ఇశ్రాయేలీయుల అధికారంలోకి ఇవ్వడం అనే భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: ఈ వచనంలో మూలపాఠం నాలుగు అక్షరాల దైవనామాన్ని నేరుగా వాడుతుంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా అందించాం.
- issue: విజయం ఇప్పటికే అప్పగించబడిందనే ప్రకటన
  choice: అప్పగించాడు
  alternative: అప్పగిస్తాడు
  rationale: హీబ్రూ נְתָנָם సంపూర్ణ క్రియారూపంలో ఉంది. పరిస్థితి ఇంకా పూర్తిగా కనిపించకపోయినా యోనాతాను దానిని నిశ్చయమైన కార్యంగా ప్రకటిస్తున్న ఉద్వేగాన్ని భూతకాల రూపం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైన కథనశైలి. యోనాతాను తన సేవకునితో ఏకవచన సన్నిహిత ఆజ్ఞారూపమైన ‘రా’ అని మాట్లాడటం మూలంలోని వ్యాకరణాన్ని అనుసరిస్తుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
