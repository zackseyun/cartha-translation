id: 1SA.14.17
reference: 1 Samuel 14:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֗וּל לָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ פִּקְדוּ נָ֣א וּ/רְא֔וּ מִ֖י הָלַ֣ךְ מֵ/עִמָּ֑/נוּ וַֽ/יִּפְקְד֔וּ וְ/הִנֵּ֛ה אֵ֥ין יוֹנָתָ֖ן וְ/נֹשֵׂ֥א כֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
translation:
  language: te
  text: అప్పుడు సౌలు తనతో ఉన్న ప్రజలతో, “దయచేసి హాజరైనవారిని లెక్కించి, మన మధ్య నుండి ఎవరు వెళ్లిపోయారో చూడండి” అన్నాడు. వారు లెక్కించగా, ఇదిగో, యోనాతాను, అతని ఆయుధవాహకుడు అక్కడ లేరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּקְדוּ / וַיִּפְקְדוּ
  choice: హాజరైనవారిని లెక్కించండి / వారు లెక్కించగా
  rationale: ఈ సందర్భంలో פקד అక్కడున్న సైనికులను పరిశీలించి లెక్కించడాన్ని సూచిస్తుంది. ‘హాజరైనవారిని లెక్కించండి’ ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; తరువాతి క్రియలో ‘లెక్కించగా’ అని సంక్షిప్తంగా పునరావృతం చేశాం.
- source_word: נָא
  choice: దయచేసి
  rationale: נא ఆజ్ఞను మృదువైన అభ్యర్థనగా చేస్తుంది; ‘దయచేసి’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּרְאוּ
  choice: చూడండి
  rationale: మూలంలోని వరుస ఆజ్ఞలను నిలుపుతూ, లెక్కింపు ద్వారా ఎవరు వెళ్లారో నిర్ధారించుకోవాలనే సందర్భార్థాన్ని అందిస్తుంది.
- source_word: מִי הָלַךְ מֵעִמָּנוּ
  choice: మన మధ్య నుండి ఎవరు వెళ్లిపోయారో
  rationale: הלך తో కూడిన מן/עם సమూహం నుంచి వెళ్లిపోవడాన్ని సూచిస్తుంది; ‘మన మధ్య నుండి’ సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: הנה ఆకస్మికంగా తెలిసిన గమనార్హ విషయాన్ని సూచిస్తుంది; ‘ఇదిగో’ కథన బలాన్ని కాపాడుతుంది.
- source_word: אֵין יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: యోనాతాను, అతని ఆయుధాలు మోసేవాడు అక్కడ లేరు
  rationale: అసలు వాక్యం ఇద్దరూ అక్కడ లేకపోవడాన్ని చెబుతుంది. ఈ రూపం తెలుగులో స్పష్టంగా ఉండి మూలంలోని ‘లేరు’ భావాన్ని నిలుపుతుంది.
- source_word: נֹשֵׂא כֵלָיו
  choice: అతని ఆయుధాలు మోసేవాడు
  rationale: పదబంధం అక్షరార్థంగా అతని యుద్ధ సామగ్రిని మోసే వ్యక్తిని సూచిస్తుంది. ‘ఆయుధాలు మోసేవాడు’ సాధారణ పాఠకులకు ‘ఆయుధవాహకుడు’ కంటే వెంటనే అర్థమవుతుంది.
