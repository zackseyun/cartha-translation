translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని ఆజ్ఞల క్రమం, గుంపు నుంచి వెళ్లిపోవడం, గమనార్హమైన కనుగొనుగోలు అనే అంశాలు నిలుపబడ్డాయి.
