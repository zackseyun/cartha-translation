source:
  edition: WLC
  text: וְ/אִֽישׁ יִשְׂרָאֵ֥ל נִגַּ֖שׂ בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּאֶל֩ שָׁא֨וּל אֶת הָ/עָ֜ם לֵ/אמֹ֗ר אָר֣וּר הָ֠/אִישׁ אֲשֶׁר יֹ֨אכַל לֶ֜חֶם עַד הָ/עֶ֗רֶב וְ/נִקַּמְתִּי֙ מֵ/אֹ֣יְבַ֔/י וְ/לֹֽא טָעַ֥ם כָּל הָ/עָ֖ם לָֽחֶם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: The men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
translation:
  language: te
  text: ఆ రోజు ఇశ్రాయేలీయులు తీవ్ర ఒత్తిడికి గురయ్యారు. సౌలు ప్రజలపై ప్రమాణం విధించి, “సాయంత్రం వరకు, నా శత్రువుల మీద నేను పగ తీర్చుకునే వరకు ఆహారం[a] తినేవాడు శపించబడినవాడు!” అని అన్నాడు. అందువల్ల ప్రజల్లో ఎవరూ ఆహారం రుచి చూడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండు చోట్లా హీబ్రూ పదానికి అక్షరార్థం ‘రొట్టె’; ఇక్కడ అది సాధారణంగా ఆహారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגַּשׂ
  choice: తీవ్ర ఒత్తిడికి గురయ్యారు
  rationale: ఈ సందర్భంలో నిఫాల్ రూపం దగ్గరకు రావడం అనే స్థలార్థం కంటే ఒత్తిడి లేదా ఇబ్బందికి గురికావడం అనే భావాన్ని ఇస్తుంది.
- source_word: וַיֹּאֶל ... אֶת הָעָם
  choice: ప్రజలను ప్రమాణానికి కట్టుబరుస్తూ
  rationale: తదుపరి శాప ప్రకటనను బట్టి, సౌలు ప్రజలపై బలవంతంగా ప్రమాణబద్ధతను మోపిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సైనిక సందర్భంలో ఇది పోరాడుతున్న వారిని సూచించినా, మూలంలోని సాధారణ పదాన్ని నిలుపుతుంది.
- source_word: אָרוּר הָאִישׁ
  choice: తినే వాడు శపించబడాలి
  rationale: ఏ వ్యక్తికైనా వర్తించే ఏకవచన శాప ప్రకటనను స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: יֹאכַל לֶחֶם
  choice: ఆహారం తినే
  rationale: לֶחֶם అక్షరార్థంగా రొట్టె అయినప్పటికీ, ఇక్కడ సాధారణంగా తినే ఆహారమంతటినీ సూచించే ప్రయోగం.
- source_word: עַד הָעֶרֶב
  choice: సాయంత్రం కాకముందే
  rationale: శాపంలోని కాలపరిమితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְנִקַּמְתִּי מֵאֹיְבַי
  choice: నా శత్రువుల మీద నేను పగ తీర్చుకోకముందే
  rationale: సౌలు స్వయంగా ప్రతీకారం తీర్చుకోవాలనే వ్యక్తిగత స్వరాన్ని, కాలసంబంధాన్ని నిలుపుతుంది.
- source_word: לֹא טָעַם ... לָחֶם
  choice: ఎవరూ ఆహారం రుచి చూడలేదు
  rationale: మూలంలోని ‘రుచి చూడు’ అనే సజీవమైన ప్రయోగాన్ని నిలుపుతూ, నిరాకరించబడిన సమూహ వాక్యాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: సౌలు ప్రతీకారం గురించి వాక్యంలోని వ్యక్తిగత స్వరం
  choice: నా శత్రువుల మీద నేను పగ తీర్చుకోకముందే
  alternative: శత్రువులపై విజయం సాధించకముందే
  rationale: మూలంలో మొదటి పురుష ఏకవచనంతో ఉన్న వ్యక్తిగత ప్రతీకార భావాన్ని మృదువుపరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. సైనిక సందర్భం స్పష్టంగా ఉన్నప్పటికీ, הָעָםను ‘సైనికులు’గా ప్రత్యేకీకరించకుండా ‘ప్రజలు’గా ఉంచాం. పాదసూచిక గుర్తును మొదటి ‘ఆహారం’ వద్ద ఉంచి, రెండు ప్రయోగాలకూ వర్తించే వివరణ ఇచ్చాం.
