  text: And all the people of the land entered the forest[b][a], and there was honey on the surface of the ground.
translation:
  language: te
  text: దేశంలోని ప్రజలందరూ[a] అడవిలోకి వచ్చారు. నేల ఉపరితలంపై[b] తేనె ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దేశమంతా.” సందర్భంలో ఇది దేశంలోని ప్రజలను సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పొలం ఉపరితలంపై.” ఈ హీబ్రూ నుడికారం కనిపించే నేల ఉపరితలంపై ఉన్న తేనెను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הָ/אָ֖רֶץ
  choice: దేశంలోని ప్రజలందరూ
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘దేశమంతా’; అయితే బָּאוּ అనే బహువచన క్రియతో, సందర్భంలో ఇది భూభాగాన్ని కాక ప్రజలను సూచించే సమష్టివాచక ప్రయోగం. అందువల్ల తెలుగులో ఉద్దేశించిన భావాన్ని సహజంగా స్పష్టం చేశాం.
- source_word: בָּ֣אוּ
  choice: వచ్చారు
  rationale: בוא అనే క్రియకు ‘వచ్చు’ లేదా ‘ప్రవేశించు’ అనే అర్థాలు ఉన్నాయి. అడవిలోకి కదలికను తెలుగులో ‘అడవిలోకి వచ్చారు’ సహజంగా తెలియజేస్తుంది; మూలంలోని సాధారణ క్రియాభావాన్ని కూడా నిలుపుతుంది.
- source_word: בַ/יָּ֑עַר
  choice: అడవిలోకి
  rationale: יַעַר చెట్లతో నిండిన ప్రదేశాన్ని, అంటే అడవిని సూచిస్తుంది. దిశను సూచించే సందర్భానుసార భావం కోసం ‘అడవిలోకి’ అని అనువదించాం.
- source_word: וַ/יְהִ֥י
  choice: ఉంది
  rationale: ఇక్కడ היה దృశ్యంలో తేనె ఉనికిని పరిచయం చేస్తుంది. తెలుగులో ‘తేనె ఉంది’ సహజమైన అస్తిత్వ ప్రయోగం.
- source_word: דְבַ֖שׁ
  choice: తేనె
  rationale: דְבַשׁ సాధారణంగా ‘తేనె’ అని అర్థం. అడవి సందర్భం అడవి తేనెను సూచించవచ్చుగాని మూలపాఠం దానిని స్పష్టంగా చెప్పదు; కాబట్టి అదనపు విశేషణం చేర్చలేదు.
- source_word: עַל פְּנֵ֥י הַ/שָּׂדֶֽה
  choice: నేల ఉపరితలంపై
  rationale: עַל־פְּנֵי అంటే ‘ఉపరితలంపై’; שָׂדֶה సాధారణంగా ‘పొలం/బయలు’ అయినా, ఈ అడవి సందర్భంలో కనిపించే నేల భాగాన్ని విస్తృతంగా సూచించవచ్చు. ‘నేల ఉపరితలంపై’ మూలచిత్రాన్ని నిలుపుతూ తెలుగులో సందర్భానికి సరిపోతుంది.
