  to: 'సౌలు ఇశ్రాయేలుపై రాజ్యాధికారాన్ని స్థిరపరచుకున్నాడు; తన చుట్టూ ఉన్న శత్రువులందరితో యుద్ధం చేశాడు: మోయాబుతో, అమ్మోనీయులతో, ఎదోముతో, సోబా రాజులతో, ఫిలిష్తీయులతో యుద్ధం చేశాడు. అతడు ఎటు తిరిగినా వారిని శిక్షించాడు.[a]'
  rationale: చివరి క్రియను కర్మతో కూడిన సహజ తెలుగు రూపంలో సవరించాం. దీనివల్ల శిక్షాత్మక భావం ప్రధాన పాఠ్యంలో నిలిచి, ‘దోషులుగా తీర్చాడు’ అనే మరింత అక్షరార్థమైన, సందర్భంలో క్లిష్టమైన ప్రత్యామ్నాయం పాదసూచికలో స్పష్టంగా ఉంటుంది. మిగిలిన పాఠ్యం మూలానికి నమ్మకంగా ఉన్నందున మార్చలేదు.
