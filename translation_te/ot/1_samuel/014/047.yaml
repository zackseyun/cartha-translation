id: 1SA.14.47
reference: 1 Samuel 14:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁא֛וּל לָכַ֥ד הַ/מְּלוּכָ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּלָּ֣חֶם סָבִ֣יב בְּֽ/כָל אֹיְבָ֡י/ו בְּ/מוֹאָ֣ב וּ/בִ/בְנֵי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וּ/בְ/מַלְכֵ֤י צוֹבָה֙ וּ/בַ/פְּלִשְׁתִּ֔ים וּ/בְ/כֹ֥ל אֲשֶׁר יִפְנֶ֖ה יַרְשִֽׁיעַ־׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
translation:
  language: te
  text: 'సౌలు ఇశ్రాయేలుపై రాజ్యాధికారాన్ని స్థిరపరచుకున్నాడు; తన చుట్టూ ఉన్న శత్రువులందరితో యుద్ధం చేశాడు: మోయాబుతో, అమ్మోనీయులతో, ఎదోముతో, సోబా రాజులతో, ఫిలిష్తీయులతో యుద్ధం చేశాడు. అతడు ఎటు తిరిగినా వారిని శిక్షించాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “వారిని దోషులుగా తీర్చాడు.” ఇక్కడి హెబ్రీ క్రియకు దోషిగా ప్రకటించడం అనే అర్థం ఉండవచ్చు; ఈ సందర్భంలో అది శత్రువులకు శిక్షాత్మక పరాజయం కలిగించడాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה
  choice: రాజ్యాధికారాన్ని స్థిరపరచుకొని
  rationale: לכד అనే క్రియకు ప్రాథమికంగా ‘పట్టుకోవడం/స్వాధీనం చేసుకోవడం’ అనే భావం ఉన్నా, ఇక్కడ הַמְּלוּכָהతో కలిసి సౌలు ఇశ్రాయేలుపై తన రాజపాలనను దృఢపరచుకున్నాడనే సందర్భార్థాన్ని ఇస్తుంది. ‘స్థిరపరచుకొని’ అనేది అక్రమ ఆక్రమణ భావాన్ని రుద్దకుండా ఆ బలమైన పట్టును తెలియజేస్తుంది.
- source_word: הַמְּלוּכָה
  choice: రాజ్యాధికారం
  rationale: ఇక్కడ భూభాగమైన ‘రాజ్యం’ కంటే రాజుగా పాలించే అధికారం లేదా రాజత్వం ఉద్దేశించబడింది; ఆధునిక తెలుగులో ‘రాజ్యాధికారం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וַיִּלָּחֶם סָבִיב בְּכָל אֹיְבָיו
  choice: తన చుట్టూ ఉన్న శత్రువులందరితో యుద్ధం చేశాడు
  rationale: לחםతో వచ్చిన ב ప్రత్యర్థులను సూచిస్తుంది; סָבִיב చుట్టుపక్కల అన్ని దిశల్లో ఉన్న శత్రువులను సూచిస్తుంది. ఈ తెలుగు వాక్యం రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּמוֹאָב ... וּבִבְנֵי עַמּוֹן ... וּבֶאֱדֹום ... וּבְמַלְכֵי צוֹבָה ... וּבַפְּלִשְׁתִּים
  choice: మోయాబుతో, అమ్మోనీయులతో, ఎదోముతో, సోబా రాజులతో, ఫిలిష్తీయులతో
  rationale: పునరావృతమైన ב యుద్ధ ప్రత్యర్థులను సూచిస్తుంది. ‘అమ్మోను కుమారులు’ అనే అక్షరార్థం కంటే ప్రజాజాతిని సూచించే సహజ రూపం ‘అమ్మోనీయులు’. ‘సోబా రాజులు’ అని హెబ్రీ బహువచనాన్ని నిలిపాం.
- source_word: וּבְכֹל אֲשֶׁר יִפְנֶה
  choice: అతడు ఎటు తిరిగినా
  rationale: ప్రతి దిశలో లేదా ఏ ప్రత్యర్థివైపు వెళ్లినా అనే పంపిణీ భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יַרְשִׁיעַ
  choice: శిక్షాత్మకంగా ఓడించాడు
  rationale: רשע హిఫీల్ రూపం ఇక్కడ క్లిష్టమైనది; ‘దోషిగా తీర్చడం’ అనే న్యాయసంబంధ భావం నుంచి శత్రువులకు శిక్షాత్మక పరాజయం కలిగించడం అనే సందర్భార్థం వస్తుంది. ‘ఓడించాడు’ సైనిక సందర్భాన్ని, ‘శిక్షాత్మకంగా’ తీర్పు/శిక్ష ఛాయను నిలుపుతాయి.
theological_decisions:
- issue: יַרְשִׁיעַలోని తీర్పు మరియు సైనిక విజయం మధ్య భావసంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘శిక్షాత్మకంగా ఓడించాడు’ అని ఇచ్చి రెండు భావఛాయలను నిలపడం
  alternative: ‘దోషులుగా తీర్చాడు’ లేదా కేవలం ‘ఓడించాడు’
  rationale: మొదటి ప్రత్యామ్నాయం తెలుగు పాఠకుడికి యుద్ధసందర్భంలో అసహజంగా ఉండవచ్చు; రెండవది హెబ్రీ క్రియలోని దోషనిర్ణయ/శిక్ష భావాన్ని కోల్పోతుంది. పాదసూచిక నిజమైన పదార్థ అనిశ్చితిని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. స్థలనామాలు, ప్రజానామాలు సాధారణ తెలుగు బైబిల్ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి. ‘రాజ్యాధికారం’ సంస్థాగత రాజత్వాన్ని స్పష్టపరుస్తుంది; క్లిష్టమైన చివరి క్రియలోని న్యాయతీర్పు మరియు సైనిక పరాజయ భావాలను ప్రధాన పాఠ్యం, పాదసూచిక ద్వారా రెండింటినీ నిలిపాం.
