  to: ప్రజలు ఈ రోజు తాము కనుగొన్న తమ శత్రువుల దోపుడు సొమ్ములో నుంచి తిని ఉంటే, ఇప్పుడు ఫిలిష్తీయులలో సంహారం ఇంకెంత ఎక్కువగా జరిగి ఉండేదో![a]
