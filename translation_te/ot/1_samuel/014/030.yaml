translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన యుద్ధవర్ణన. మూలంలోని నెరవేరని షరతు మరియు చివరి అలంకార ప్రశ్నను నిలిపాం; ‘freely’ వంటి మూలంలో స్పష్టంగా లేని విస్తరణను చేర్చలేదు.
