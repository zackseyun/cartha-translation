  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֗ף כִּ֡י לוּא֩ אָכֹ֨ל אָכַ֤ל הַ/יּוֹם֙ הָ/עָ֔ם מִ/שְּׁלַ֥ל אֹיְבָ֖י/ו אֲשֶׁ֣ר מָצָ֑א כִּ֥י עַתָּ֛ה לֹֽא רָבְתָ֥ה מַכָּ֖ה בַּ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/030.yaml
  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
translation:
  language: te
  text: ప్రజలు ఈ రోజు తాము కనుగొన్న తమ శత్రువుల దోపుడు సొమ్ములో నుంచి తిని ఉంటే, ఇప్పుడు ఫిలిష్తీయులలో సంహారం ఇంకెంత ఎక్కువగా జరిగి ఉండేదో![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరో అనువాదం: “నిజానికి, ప్రజలు ఈ రోజు తాము కనుగొన్న తమ శత్రువుల దోపుడు సొమ్ములో నుంచి తిని ఉంటే, ఫిలిష్తీయుల మీద దెబ్బ మరింత గొప్పగా ఉండేది.”'
    reason: אַף כִּי לוּא అనే పదబంధాన్ని ‘నిజానికి, ... ఉంటే’ అని, మַכָּהను ‘దెబ్బ’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: אַף כִּי לוּא
  choice: ఇంకెంత గొప్ప విజయం కలిగేదో
  rationale: ఈ పదబంధం నెరవేరని షరతు వల్ల ఇంకా గొప్ప ఫలితం వచ్చేదని బలంగా సూచిస్తుంది. తెలుగులో సహజమైన ఆశ్చర్యార్థక నిర్మాణంతో ఆ వాదనా బలాన్ని వ్యక్తం చేశాం.
- source_word: אָכֹל אָכַל
  choice: తిని ఉంటే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్ క్రియకు బలం ఇస్తుంది; అయితే మూలంలో లేని ‘కడుపారా’ లేదా ‘స్వేచ్ఛగా’ వంటి భావాలను చేర్చకుండా, సందర్భం మరియు వాక్య నిర్మాణం ద్వారా ఉద్ఘాటనను నిలిపాం.
- source_word: מִשְּׁלַל אֹיְבָיו
  choice: తమ శత్రువుల దగ్గర దొరికిన దోపుడుసొమ్ములో
  rationale: שָׁלָל యుద్ధంలో స్వాధీనం చేసుకున్న దోపుడుసొమ్మును సూచిస్తుంది. ‘ప్రజలు’ అనే సమూహ నామానికి అనుగుణంగా ఏకవచన ప్రత్యయ భావాన్ని తెలుగులో సహజంగా ‘తమ’ అని ఇచ్చాం.
- source_word: אֲשֶׁר מָצָא
  choice: దొరికిన
  rationale: హీబ్రూలో క్రియ సమూహ నామమైన ‘ప్రజలు’తో ఏకవచనంలో ఉంది. తెలుగులో సంబంధకృదంత రూపం సంఖ్యను అనవసరంగా నిర్దిష్టం చేయకుండా సహజంగా భావాన్ని అందిస్తుంది.
- source_word: מַכָּה
  choice: సంహారం
  rationale: యుద్ధ సందర్భంలో ఈ నామవాచకం కొట్టివేత, భారీ నష్టం లేదా సంహారాన్ని సూచించగలదు. ఇక్కడ ఫిలిష్తీయుల ప్రాణనష్ట పరిమాణం ఉద్దేశం కావడంతో ‘సంహారం’ అనుకూలం.
- source_word: לֹא רָבְתָה
  choice: మరింత ఎక్కువగా జరిగేది కదా
  rationale: మూలంలోని ప్రతికూల ప్రశ్న నెరవేరని ఫలితాన్ని బలంగా ధృవీకరిస్తుంది. ‘కదా’ ద్వారా ఆ అలంకార ప్రశ్నను, ‘మరింత ఎక్కువగా’ ద్వారా పరిమాణ వృద్ధిని నిలిపాం.
- source_word: בַּפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులలో
  rationale: ב ఇక్కడ సంహారం జరిగిన వర్గం లేదా పరిధిని సూచిస్తుంది; ‘ఫిలిష్తీయులలో’ అనే రూపం ఆ భావాన్ని నేరుగా నిలుపుతుంది.
