  yaml_path: translation/ot/1_samuel/014/005.yaml
  text: One crag stood on the north[a], opposite Michmash, and the other on the south[b], opposite Geba.
translation:
  language: te
  text: ఒక నిటారైన రాతిశిఖరం[a] ఉత్తరాన మిక్మాషుకు ఎదురుగా ఉంది; మరొకటి దక్షిణాన గెబకు[b] ఎదురుగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘పంటి’; ఇక్కడ పంటిలా ముందుకు పొడుచుకొచ్చిన పదునైన రాతి భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని అనువాదాల్లో ఇక్కడ ‘గిబియా’ అని ఉంది; అయితే హీబ్రూ స్థలనామం ‘గెబ’.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֵּׁן
  choice: రాతికొమ్ము
  rationale: అక్షరార్థంగా ‘పంటి’; ఈ భౌగోళిక సందర్భంలో పంటిలా ముందుకు పొడుచుకొచ్చిన పదునైన రాతి భాగాన్ని సూచించే రూపకం. ‘రాతికొమ్ము’ ఆ ఆకారభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הָאֶחָד ... וְהָאֶחָד
  choice: ఒకటి ... మరొకటి
  rationale: రెండు రాతి ప్రక్షేపాలను విడిగా చూపించే పంపిణీ నిర్మాణానికి సహజమైన తెలుగు జత.
- source_word: מָצוּק
  choice: నిలిచి ఉంది
  rationale: పాఠం ఆ రాతి నిర్మాణపు నిటారుతనాన్ని లేదా స్థిరంగా పైకి పొడుచుకొని ఉన్న స్థితిని సూచిస్తుంది; ఇక్కడ స్థానవివరణలో ‘నిలిచి ఉంది’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מִצָּפוֹן
  choice: ఉత్తరం వైపున
  rationale: కనుమ మార్గానికి సంబంధించి ఉత్తరపు వైపున ఉన్న స్థానాన్ని సూచిస్తుంది.
- source_word: מוּל
  choice: ఎదురుగా
  rationale: ఒక స్థలానికి అభిముఖంగా లేదా దానికి ఎదురుగా ఉన్న భౌగోళిక స్థానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִכְמָשׂ
  choice: మిక్మాషు
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: מִנֶּגֶב
  choice: దక్షిణం వైపున
  rationale: ఉత్తరానికి సమాంతర విరుద్ధంగా, కనుమ మార్గం దక్షిణపు వైపున ఉన్న స్థానాన్ని సూచిస్తుంది.
- source_word: גָּבַע
  choice: గెబ
  rationale: హీబ్రూ రూపం గిబియా కాక ‘గెబ’ అనే స్థలనామాన్ని సూచిస్తుంది; కథనంలోని భౌగోళిక భేదాన్ని కాపాడుతుంది.
