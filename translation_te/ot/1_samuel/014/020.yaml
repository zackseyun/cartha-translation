source:
  edition: WLC
  text: וַ/יִּזָּעֵ֣ק שָׁא֗וּל וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד הַ/מִּלְחָמָ֑ה וְ/הִנֵּ֨ה הָיְתָ֜ה חֶ֤רֶב אִישׁ֙ בְּ/רֵעֵ֔/הוּ מְהוּמָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
translation:
  language: te
  text: అప్పుడు సౌలు, అతనితో ఉన్న ప్రజలందరూ కూడగట్టబడ్డారు[a]. వారు యుద్ధం జరుగుతున్న చోటికి వచ్చారు. ఇదిగో, ప్రతివాని ఖడ్గం అతని సహచరునికి వ్యతిరేకంగా ఉంది; అక్కడ అత్యంత తీవ్రమైన కలవరం ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కేకవేశారు,’ లేదా ‘కూడగట్టబడ్డారు.’ ఇక్కడి హీబ్రూ క్రియను ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అత్యంత తీవ్రమైన భయాందోళన,’ లేదా ‘అత్యంత గొప్ప అల్లకల్లోలం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  choice: సమకూర్చబడ్డారు
  rationale: నిఫల్ రూపంలోని నిష్క్రియార్థాన్ని నిలుపుతూ, సౌలు మరియు అతనితో ఉన్నవారు యుద్ధానికి కూడగట్టబడిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ‘కేకవేశారు’ అనే అర్థం కూడా సాధ్యమే కాబట్టి పాదటిప్పణిలో ఉంచబడింది.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న ప్రజలందరూ
  rationale: עָם అనే సాధారణ పదాన్ని ‘ప్రజలు’గా ఉంచి, సైనికులు అని మూలంలో లేనంత నిర్దిష్టతను చేర్చలేదు.
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  choice: వారు యుద్ధం జరుగుతున్న చోటికి వచ్చారు
  rationale: בוא + עד ఇక్కడ యుద్ధస్థలాన్ని చేరుకోవడాన్ని సూచిస్తుంది. నేరుగా యుద్ధంలో ప్రవేశించారని అతిగా నిర్ధారించకుండా, తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా కనిపించిన దృశ్యంపై దృష్టి నిలిపే హీబ్రూ కథన సూచిక యొక్క సజీవతను కాపాడుతుంది.
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: ప్రతి ఒక్కరి ఖడ్గం తన తోటి వ్యక్తికి విరోధంగా ఉంది
  rationale: ‘ఒక వ్యక్తి ఖడ్గం అతని తోటి వ్యక్తికి విరోధంగా’ అనే మూల నిర్మాణాన్ని సమీపంగా అనుసరిస్తూ, శిబిరంలో పరస్పరం పోరాడుతున్న దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: అత్యంత గొప్ప కలవరం
  rationale: מְהוּמָה లోని కలవరం, భయం, గందరగోళం అనే విస్తృత భావాన్ని ఒకే అర్థానికి పరిమితం చేయకుండా తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని నిష్క్రియ క్రియారూపం, దృశ్యసూచకమైన ‘ఇదిగో,’ అలాగే కలవరం/భయాందోళన అనే పదార్థ సందిగ్ధతను నిలిపింది.
