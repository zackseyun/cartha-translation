  to: అప్పుడు సౌలు, అతనితో ఉన్న ప్రజలందరూ కూడగట్టబడ్డారు[a]. వారు యుద్ధం జరుగుతున్న చోటికి వచ్చారు. ఇదిగో, ప్రతివాని ఖడ్గం అతని సహచరునికి వ్యతిరేకంగా ఉంది; అక్కడ అత్యంత తీవ్రమైన కలవరం ఉంది[b].
