    issue: The sword-against-companion clause is stylistically awkward in Telugu.
    rationale: The current reflexive phrase “తన తోటి వ్యక్తికి” does not smoothly correspond to “ప్రతి ఒక్కరి.” Revising it to “ప్రతివాని ఖడ్గం అతని సహచరునికి వ్యతిరేకంగా ఉంది” retains the source construction and reads naturally.
  - severity: low
    issue: The expression “అత్యంత గొప్ప కలవరం” is not fully idiomatic modern Telugu.
    rationale: “అత్యంత తీవ్రమైన కలవరం” expresses the very great scale of מְהוּמָה more naturally, while the footnote continues to preserve panic/tumult alternatives.
