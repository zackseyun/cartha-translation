source:
  edition: WLC
  text: וַ/יַּכּ֞וּ בַּ/יּ֤וֹם הַ/הוּא֙ בַּ/פְּלִשְׁתִּ֔ים מִ/מִּכְמָ֖שׂ אַיָּלֹ֑נָ/ה וַ/יָּ֥עַף הָ/עָ֖ם מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/031.yaml
  text: That day they struck down the Philistines from Mikmash to Aijalon[a], and the people were very weary.
translation:
  language: te
  text: ఆ రోజు వారు మిక్మాషు నుండి అయ్యాలోను వరకు ఫిలిష్తీయులను కొట్టారు. ప్రజలు ఎంతో అలసిపోయారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: హతం చేశారు
  rationale: נכה అనే క్రియ ఇక్కడ యుద్ధ సందర్భంలో శత్రువులను కొట్టడం లేదా సంహరించడం అనే భావాన్ని ఇస్తుంది. ‘హతం చేశారు’ సైనిక సందర్భాన్ని సహజంగా తెలియజేస్తూ, ‘ఓడించారు’ అనే ఫలితార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: హీబ్రూ కాలసూచక పదబంధానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: בַּפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులను
  rationale: ఈ సందర్భంలో בְּ శత్రువులపై జరిగిన దాడి యొక్క లక్ష్యాన్ని సూచిస్తుంది; తెలుగులో ద్వితీయా విభక్తితో సహజంగా వ్యక్తమవుతుంది.
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  choice: మిక్మాషు నుండి అయ్యాలోను వరకు
  rationale: מִן ఆరంభ స్థానాన్ని, אַיָּלֹנָה లోని దిశాసూచక -ה గమ్యాన్ని సూచిస్తున్నాయి. తెలుగులో ‘నుండి … వరకు’ భౌగోళిక పరిధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיָּעַף הָעָם מְאֹד
  choice: ప్రజలు చాలా అలసిపోయారు
  rationale: יעף తీవ్రమైన అలసట లేదా నీరసాన్ని సూచిస్తుంది; מְאֹד దానిని బలపరుస్తుంది. సమూహవాచకమైన הָעָם ను సహజ తెలుగులో ‘ప్రజలు’గా అనువదించి బహువచన క్రియ వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. స్థలనామాలు హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగీకరించబడ్డాయి; ఈ వచనానికి అవసరమైన పాఠాంతర లేదా భావసంబంధ పాదటిప్పణి లేదు.
