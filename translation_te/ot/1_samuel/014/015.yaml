  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּהִי֩ חֲרָדָ֨ה בַ/מַּחֲנֶ֤ה בַ/שָּׂדֶה֙ וּ/בְ/כָל הָ/עָ֔ם הַ/מַּצָּב֙ וְ/הַ/מַּשְׁחִ֔ית חָרְד֖וּ גַּם הֵ֑מָּה וַ/תִּרְגַּ֣ז הָ/אָ֔רֶץ וַ/תְּהִ֖י לְ/חֶרְדַּ֥ת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
translation:
  language: te
  text: అప్పుడు శిబిరంలోను, పొలంలోను, ప్రజలందరిలోను వణుకు కలిగింది; స్థావరంలో ఉన్న దళమూ దాడి దళమూ కూడా వణికాయి. భూమి కంపించింది; అలా అది దేవునివల్ల కలిగిన వణుకుగా అయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతి గొప్ప వణుకు” లేదా “దైవిక భీతి.” హీబ్రూ పదబంధం వణుకు దేవుని నుండి వచ్చిందనే భావాన్నిగానీ, దాని అత్యధిక తీవ్రతనుగానీ సూచించవచ్చు.
    reason: ప్రత్యామ్నాయ పఠనం
lexical_decisions:
- source_word: חֲרָדָה / חָרְדוּ
  choice: వణుకు / వణికాయి
  rationale: భయంతో శరీరం వణకడం అనే మూలభావాన్ని, అలాగే ఈ వచనంలోని ఒకే ధాతువు పునరుక్తిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בַמַּחֲנֶה
  choice: శిబిరంలో
  rationale: సైనిక సందర్భంలోని స్థలార్థాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַשָּׂדֶה
  choice: పొలంలో
  rationale: మూలపదానికి దగ్గరైన అర్థం; సందర్భంలో శిబిరం వెలుపలి బహిరంగ ప్రదేశాన్ని సూచించగలదు.
- source_word: וּבְכָל הָעָם
  choice: ప్రజలందరిలో
  rationale: עָם యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది; సైనిక సందర్భంలో దళాలనే సూచించే అవకాశం ఉన్నా దాన్ని ప్రధాన పాఠంలో సంకుచితం చేయదు.
- source_word: הַמַּצָּב
  choice: సైనిక స్థావరంలోని దళం
  rationale: ఈ సందర్భంలో స్థావరం లేదా అక్కడ నియమించబడిన సైనిక బలగం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמַּשְׁחִית
  choice: దాడి చేసే దళం
  rationale: హిఫిల్ కృదంతపు విధి భావాన్ని, సైనిక దోపిడీ లేదా విధ్వంసక దాడి చేసే సమూహాన్ని, సహజ తెలుగులో సమూహార్థంతో అందిస్తుంది.
- source_word: וַתִּרְגַּז הָאָרֶץ
  choice: నేల కంపించింది
  rationale: భూమి లేదా నేల కదలడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְחֶרְדַּת אֱלֹהִים
  choice: దేవుని నుండి వచ్చిన వణుకు
  rationale: אֱלֹהִים ను మూలాన్ని సూచించే సంబంధంగా చదివి దైవకారణ భావాన్ని నిలుపుతుంది; తీవ్రతను సూచించే ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: לְחֶרְדַּת אֱלֹהִים యొక్క అర్థం
  choice: దేవుని నుండి వచ్చిన వణుకు
  alternative: అతి గొప్ప వణుకు; దైవిక భీతి
  rationale: హీబ్రూ నిర్మాణం దేవుడు ఆ వణుకుకు మూలమని సూచించవచ్చు; అదే సమయంలో אֱלֹהִים తీవ్రతను తెలిపే విశేషణాత్మక సంబంధంగా కూడా అర్థమవచ్చు. ప్రధాన పాఠం మూలార్థాన్ని ఎంచుకుని, నిజమైన సందిగ్ధతను పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. חרד/חרדה పదపునరుక్తిని ‘వణుకు/వణికాయి/వణుకుగా’ ద్వారా సాధ్యమైనంతగా నిలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
