source:
  edition: WLC
  text: וְ/שֵׁם֙ אֵ֣שֶׁת שָׁא֔וּל אֲחִינֹ֖עַם בַּת אֲחִימָ֑עַץ וְ/שֵׁ֤ם שַׂר צְבָא/וֹ֙ אֲבִינֵ֔ר בֶּן נֵ֖ר דּ֥וֹד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/050.yaml
  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
translation:
  language: te
  text: సౌలు భార్య పేరు అహీనోయము, ఆమె అహీమయస్సు కుమార్తె. అతని సైన్యాధిపతి పేరు అబ్నేరు, అతడు సౌలు తండ్రి సోదరుడైన నేరు కుమారుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తండ్రి సోదరుడు’ అని అనువదించిన హీబ్రూ పదం కొన్నిసార్లు విస్తృతార్థంలో ‘సమీప పురుష బంధువు’ అని కూడా అర్థమివ్వగలదు. అయితే ఇక్కడి వంశావళి సందర్భం నేరును సౌలు తండ్రి సోదరునిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: పేరు
  rationale: హీబ్రూ నామవాచక నిర్మాణం వ్యక్తులను పరిచయం చేస్తుంది. తెలుగులో ‘పేరు’తో కూడిన వాక్య నిర్మాణం సహజంగా, సూత్రబద్ధ భావాన్ని నిలుపుతుంది.
- source_word: אֵשֶׁת
  choice: భార్య
  rationale: ‘సౌలు’ అనే సంబంధసూచక నామంతో ఉన్న ఈ పదం ఇక్కడ వివాహ సంబంధాన్నే స్పష్టంగా సూచిస్తుంది.
- source_word: בַּת
  choice: కుమార్తె
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణ హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: שַׂר צְבָאוֹ
  choice: అతని సైన్యాధిపతి
  rationale: שַׂר సైనిక సందర్భంలో అధిపతిని, צְבָאוֹ అతని సైన్యాన్ని సూచిస్తున్నాయి; ఈ సమాసరూపం ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: తండ్రి–కొడుకు వంశసంబంధాన్ని తెలిపే ప్రామాణిక పదం.
- source_word: דּוֹד
  choice: తండ్రి సోదరుడు
  rationale: వంశావళి సందర్భంలో ఇది ‘పినతండ్రి/పెదతండ్రి’ అనే భావంలోని తండ్రి సోదరుణ్ణి సూచిస్తుంది. తరువాతి వచనంలోని కుటుంబ సంబంధం కూడా నేరును సౌలు తండ్రి సోదరునిగా గుర్తిస్తుంది; వయస్సు తెలియనందున ‘పినతండ్రి’ లేదా ‘పెదతండ్రి’ అని ప్రత్యేకంగా చెప్పలేదు.
theological_decisions:
- issue: సౌలు వంశసంబంధంలో דּוֹד పదం యొక్క అర్థం మరియు అది ఎవరిని సూచిస్తుంది
  choice: నేరు సౌలు తండ్రి సోదరుడు
  alternative: నేరు సౌలు సమీప పురుష బంధువు; లేదా అబ్నేరు సౌలు బంధువు
  rationale: ఈ పదానికి విస్తృతంగా పురుష బంధువు అనే భావం ఉండగలిగినా, ఇక్కడి వంశావళి నిర్మాణం మరియు తరువాతి వచనంలోని కీషు–నేరు సంబంధం ‘తండ్రి సోదరుడు’ అనే అర్థాన్ని బలపరుస్తాయి. హీబ్రూ పదక్రమంలో ఈ సంబంధపదం వెంటనే ముందు ఉన్న ‘నేరు’తో అన్వయించడం సహజం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. పేర్ల పరిచయంలో హీబ్రూ సూత్రబద్ధతను నిలుపుతూ, తెలుగులో అసహజమైన వరుస సమాసాలను నివారించేందుకు రెండు ఉపవాక్యాలుగా విభజించబడింది. ‘పినతండ్రి/పెదతండ్రి’ అనే వయోక్రమ సూచనకు మూలంలో ఆధారం లేనందున లింగ-సంబంధాన్ని మాత్రమే స్పష్టంగా తెలిపే ‘తండ్రి సోదరుడు’ ఎంచుకోబడింది.
