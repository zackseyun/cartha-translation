  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. హన్నా వినయపూర్వక స్వీయసూచనలోని స్త్రీలింగాన్ని ‘దాసురాలు’తో నిలిపాం. చివరి హీబ్రూ పదబంధంలోని నిజమైన అస్పష్టతను ప్రధాన పాఠ్యంలో కాపాడి, సందర్భానుగుణ భావాన్ని పాదసూచికలో వివరించాం.
