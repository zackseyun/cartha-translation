  text: וַ/תֹּ֕אמֶר תִּמְצָ֧א שִׁפְחָתְ/ךָ֛ חֵ֖ן בְּ/עֵינֶ֑י/ךָ וַ/תֵּ֨לֶךְ הָ/אִשָּׁ֤ה לְ/דַרְכָּ/הּ֙ וַ/תֹּאכַ֔ל וּ/פָנֶ֥י/הָ לֹא הָיוּ לָ֖/הּ עֽוֹד־־׃
base_translation:
