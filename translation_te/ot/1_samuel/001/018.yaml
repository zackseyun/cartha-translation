  yaml_path: translation/ot/1_samuel/001/018.yaml
  text: She said[a], “May your servant find favor in your eyes.” Then the woman went on her way and ate[b], and her face was no longer downcast.
translation:
  language: te
  text: ఆమె, “నీ దాసురాలైన నాకు నీ దృష్టిలో కృప దొరకుగాక” అని చెప్పింది. ఆ తర్వాత ఆమె తన దారిన వెళ్లి భోజనం చేసింది; ఇక ఆమె ముఖం మునుపటిలా లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇక ఆమె ముఖం ఆమెకు లేదు” అని ఉంది. ఇది ఒక అసాధారణ నుడికారం; సందర్భంలో ఆమె ముఖంలో మునుపటి దుఃఖం ఇక కనిపించలేదని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: పొందుదునుగాక
  rationale: ఈ అసంపూర్ణ క్రియారూపం మర్యాదపూర్వకమైన కోరికను వ్యక్తం చేస్తుంది; తెలుగులో ‘పొందుదునుగాక’ ఆ భావాన్ని గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: שִׁפְחָתְךָ
  choice: నీ దాసురాలినైన నేను
  rationale: మూలపదం స్త్రీలింగ సేవకురాలిని సూచిస్తూ, హన్నా తనను తాను వినయంగా పేర్కొన్న మాట. ‘దాసురాలు’ స్త్రీలింగాన్ని నిలుపుతుంది; ‘నేను’ సహజమైన తెలుగు వాక్యనిర్మాణాన్ని ఇస్తుంది.
- source_word: חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో దయ
  rationale: హీబ్రూ నుడికారంలోని ‘నీ కళ్లలో అనుగ్రహం’ అనే చిత్రాన్ని తెలుగులో సహజంగా ఉండే ‘నీ దృష్టిలో దయ పొందడం’గా అందించింది.
- source_word: לְדַרְכָּהּ
  choice: తన దారిన వెళ్లి
  rationale: ఆమె అక్కడి నుంచి బయలుదేరి తన ప్రయాణాన్ని కొనసాగించిందనే నుడికార భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַתֹּאכַל
  choice: భోజనం చేసింది
  rationale: సాధారణ తదుపరి చర్యను సూచించే క్రియ; సందర్భంలో ఆమె తిరిగి ఆహారం తీసుకోవడం మొదలుపెట్టిందని అదనంగా నిర్ధారించకుండా, సరళంగా అనువదించబడింది.
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  choice: ఇక ఆమె ముఖం మునుపటిలా లేదు
  rationale: మూలంలోని అసాధారణమైన, కొంత అస్పష్టమైన వాక్యాన్ని ‘దుఃఖంగా లేదు’ అని పూర్తిగా వ్యాఖ్యానించకుండా నిలుపుతుంది; సందర్భం ఆమె ముఖకవళికలో వచ్చిన మార్పును సూచిస్తుంది.
