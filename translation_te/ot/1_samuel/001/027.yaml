source:
  edition: WLC
  text: אֶל הַ/נַּ֥עַר הַ/זֶּ֖ה הִתְפַּלָּ֑לְתִּי וַ/יִּתֵּ֨ן יְהוָ֥ה לִ/י֙ אֶת שְׁאֵ֣לָתִ֔/י אֲשֶׁ֥ר שָׁאַ֖לְתִּי מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
translation:
  language: te
  text: ఈ బాలుని కోసం నేను ప్రార్థించాను[a]. నేను ఆయన దగ్గర అడిగిన నా విన్నపాన్ని యాహ్వే నాకు ఇచ్చాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ బాలుని గురించి నేను ప్రార్థించాను.” హీబ్రూ ఉపసర్గ ప్రార్థన దేనిని గురించి చేయబడిందో సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా అభ్యర్థనను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  choice: ఈ బాలుని కోసం
  rationale: אֶל అనే విభక్తి ఇక్కడ ప్రార్థనకు సంబంధించిన వ్యక్తిని లేదా విషయాన్ని సూచిస్తుంది. సందర్భంలో హన్నా ఈ బాలుడు తనకు కలగాలని ప్రార్థించింది కాబట్టి, సహజమైన తెలుగులో ‘ఈ బాలుని కోసం’ అని అనువదించాం; ‘ఈ బాలుని గురించి’ కూడా సాధ్యమే.
- source_word: הִתְפַּלָּלְתִּי
  choice: నేను ప్రార్థించాను
  rationale: హిత్పయేల్ రూపం ఇక్కడ స్పష్టంగా ‘ప్రార్థించు’ అనే అర్థాన్నిస్తుంది; కథన సందర్భానికి సాధారణ భూతకాలం సరిపోతుంది.
- source_word: וַיִּתֵּן
  choice: అనుగ్రహించాడు
  rationale: క్రియకు మూలార్థం ‘ఇచ్చాడు’. ప్రార్థనకు జవాబుగా దేవుడు ఇచ్చినదాన్ని తెలుగులో సహజంగా ‘అనుగ్రహించాడు’ తెలియజేస్తుంది; ఇచ్చిన ఫలితం ప్రస్తుతం హన్నా ఎదుట కనిపిస్తున్న సందర్భాన్నీ ఇది బాగా మోస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: שְׁאֵלָתִי
  choice: నా విన్నపాన్ని
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ‘నా’ అనే స్వామ్యాన్ని స్పష్టంగా సూచిస్తుంది. నామవాచకం ప్రార్థనలో చేసిన అభ్యర్థన లేదా విన్నపాన్ని సూచిస్తుంది; ‘విన్నపం’ గౌరవప్రదమైన, సహజమైన తెలుగు.
- source_word: אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ
  choice: నేను యెహోవా దగ్గర అడిగిన
  rationale: ఈ ఉపవాక్యం విన్నపాన్ని నిర్దిష్టం చేస్తుంది. שאל మూలంలోని ‘అడగడం’ భావాన్ని నిలిపి, מֵעִמּוֹ సూచించే మూలం/వ్యక్తిని సహజ తెలుగులో ‘యెహోవా దగ్గర’గా తెలిపాం; సర్వనామానికి బదులు నామాన్ని పునరుక్తి చేయడం తెలుగులో సూచ్యాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామంగానే ఉంచాం. ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని ‘విన్నపం/అడగడం’ భావసంబంధాన్ని సాధ్యమైనంతవరకు నిలిపాం; אֶל యొక్క నిజమైన ద్వంద్వసాధ్యతను పాదటిప్పణిలో ఉంచాం.
