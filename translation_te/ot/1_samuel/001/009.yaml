- from: షిలోహులో భోజనం చేసి, తాగిన తర్వాత హన్నా లేచింది.[a] అప్పుడు యాజకుడైన ఏలీ యాహ్వే మందిరం[b] గుమ్మపు స్తంభం పక్కన ఉన్న ఆసనం మీద కూర్చొని ఉన్నాడు.
