id: 1SA.1.9
reference: 1 Samuel 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תָּ֣קָם חַנָּ֔ה אַחֲרֵ֛י אָכְלָ֥ה בְ/שִׁלֹ֖ה וְ/אַחֲרֵ֣י שָׁתֹ֑ה וְ/עֵלִ֣י הַ/כֹּהֵ֗ן יֹשֵׁב֙ עַל הַ/כִּסֵּ֔א עַל מְזוּזַ֖ת הֵיכַ֥ל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
translation:
  language: te
  text: షిలోహులో హన్నా భోజనం చేసి, తాగిన తర్వాత లేచింది. అంతలో యాజకుడైన ఏలీ యాహ్వే మందిరం[a] గుమ్మపు స్తంభం పక్కన ఉన్న ఆసనం మీద కూర్చొని ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాహ్వే పవిత్రస్థలం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: లేచింది
  rationale: קום అనే క్రియ ఇక్కడ కూర్చున్న స్థితి నుంచి లేచి తదుపరి చర్యకు సిద్ధపడడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘లేచింది’ సహజంగా కథాగమనాన్ని తెలియజేస్తుంది.
- source_word: אַחֲרֵי אָכְלָה ... וְאַחֲרֵי שָׁתֹה
  choice: భోజనం చేసి, తాగిన తర్వాత
  rationale: రెండు కాలసూచక పదబంధాలను సహజమైన తెలుగులో కలిపి చెప్పింది. హెబ్రీ రూపాల వల్ల భోజనం చేసినవారి సంఖ్య లేదా స్పష్టమైన కర్త నిర్ధిష్టంగా లేకపోవడాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: בְשִׁלֹה
  choice: షిలోహులో
  rationale: בְ అనే స్థలసూచక విభక్తికి ‘లో’ సరిపోతుంది; స్థలనామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చింది.
- source_word: וְעֵלִי הַכֹּהֵן
  choice: అప్పుడు యాజకుడైన ఏలీ
  rationale: וְ ఇక్కడ నేపథ్య పరిస్థితిని పరిచయం చేస్తుంది. ‘అప్పుడు’ దృశ్యాన్ని సహజంగా అనుసంధానిస్తుంది; הַכֹּהֵן కు ‘యాజకుడు’ సాధారణమైన తెలుగు పదం.
- source_word: יֹשֵׁב
  choice: కూర్చొని ఉన్నాడు
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న నేపథ్య స్థితిని తెలుగులో ‘కూర్చొని ఉన్నాడు’ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עַל הַכִּסֵּא
  choice: ఆసనం మీద
  rationale: כִּסֵּא కు సందర్భానుసారం ఆసనం, కుర్చీ, సింహాసనం అనే అర్థాలు ఉండవచ్చు. ఇక్కడ రాజసంబంధ భావాన్ని అనవసరంగా చేర్చకుండా సాధారణమైన ‘ఆసనం’ ఎంచుకుంది.
- source_word: עַל מְזוּזַת
  choice: గుమ్మపు స్తంభం పక్కన
  rationale: מְזוּזָה ద్వారపు నిలువు స్తంభాన్ని సూచిస్తుంది; స్థానార్థక עַל ను ఈ సందర్భంలో సహజ తెలుగులో ‘పక్కన’గా అనువదించింది.
- source_word: הֵיכַל
  choice: మందిరం
  rationale: ఈ పదం దేవాలయం లేదా పవిత్రస్థలాన్ని సూచించగలదు. షిలోహులోని ఆరాధనా నిర్మాణానికి ‘మందిరం’ సహజంగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని స్పష్టంగా నిలుపుతుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: షిలోహులో הֵיכַל అనే పదానికి అర్థం
  choice: మందిరం
  alternative: పవిత్రస్థలం
  rationale: హెబ్రీ పదం రెండింటినీ సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ‘మందిరం’ ఉంచి, సొలొమోను మందిరానికి ముందున్న ఈ సందర్భంలో సాధ్యమైన ‘పవిత్రస్థలం’ అనే అర్థాన్ని పాదటిప్పణిలో ఇచ్చింది.
- issue: భోజనం చేసి తాగినవారి కర్త
  choice: తెలుగు ప్రధాన వాక్యంలో కర్తను విడిగా పేర్కొనకుండా క్రియాత్మక పదబంధం
  alternative: వారు భోజనం చేసి తాగిన తర్వాత / హన్నా భోజనం చేసి తాగిన తర్వాత
  rationale: హెబ్రీ రూపాలు మరియు సందర్భం ఏకవచనంగా హన్నాను లేదా సమూహ భోజనాన్ని సూచించేలా అర్థం చేసుకోవచ్చు. ప్రధాన పాఠ్యం అతిగా నిర్ణయించకుండా, ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘యాజకుడు,’ ‘మందిరం,’ ‘ఆసనం,’ ‘గుమ్మపు స్తంభం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలపాఠ్యంలోని సాంస్కృతిక మరియు ఆరాధనా నేపథ్యాన్ని నిలుపుతాయి.
