source:
  edition: WLC
  text: וְ/הָיָה֙ כִּ֣י הִרְבְּתָ֔ה לְ/הִתְפַּלֵּ֖ל לִ/פְנֵ֣י יְהוָ֑ה וְ/עֵלִ֖י שֹׁמֵ֥ר אֶת פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/012.yaml
  text: And as she continued praying before Yahweh[a], Eli was watching her mouth.
translation:
  language: te
  text: ఆమె యాహ్వే[a] సన్నిధిలో ప్రార్థనను కొనసాగిస్తూ ఉండగా, ఏలీ ఆమె నోటిని గమనిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ దైవనామాన్ని ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: దైవనామానికి సంప్రదాయంగా వాడే ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: ఉండగా
  rationale: ఈ హెబ్రీ కథన సూత్రం తదుపరి చర్యకు కాలసంబంధమైన నేపథ్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఉండగా’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; ‘అప్పుడు ఇలా జరిగింది’ అనే మరింత రూపానుగత నిర్మాణం ఇక్కడ భారంగా ఉంటుంది.
- source_word: הִרְבְּתָה לְהִתְפַּלֵּל
  choice: చాలాసేపు ప్రార్థిస్తూ ఉండగా
  rationale: רבה హిఫీల్ రూపం తరువాతి క్రియ యొక్క విస్తృతి లేదా కొనసాగింపును సూచిస్తుంది. సందర్భంలో హన్నా దీర్ఘంగా ప్రార్థించిందనే భావాన్ని ఈ పదబంధం సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దేవుని సమక్షంలో ప్రార్థించడాన్ని సూచించే హెబ్రీ ప్రయోగానికి ‘సన్నిధిలో’ సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘యెహోవా’గా లిప్యంతరీకరించాం; మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చలేదు.
- source_word: שֹׁמֵר
  choice: గమనిస్తూ ఉన్నాడు
  rationale: క్వాల్ క్రియావిశేషణ రూపం కొనసాగుతున్న పరిశీలనను సూచిస్తుంది. ‘గమనిస్తూ ఉన్నాడు’ ఏలీ ఆమె నోటి కదలికలను శ్రద్ధగా చూస్తున్న భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֶת פִּיהָ
  choice: ఆమె నోటిని
  rationale: పదశః అర్థం ‘ఆమె నోరు.’ తదుపరి వచనంలో పెదవుల కదలిక ప్రత్యేకంగా చెప్పబడుతుంది కాబట్టి ఇక్కడ ‘నోరు’నే నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ను ప్రధాన పాఠంలో ఉంచి, మూల ఉచ్చారణకు దగ్గరగా పండితులు సాధారణంగా భావించే ‘యాహ్వే’ను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, దాని కాలసంబంధ భావం, ప్రార్థన దీర్ఘత్వం, ఏలీ కొనసాగిస్తూ చేసిన పరిశీలనలను నిలిపాం.
