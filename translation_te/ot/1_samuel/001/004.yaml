translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని కథన క్రమాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అలవాటుగా జరిగే చర్య అనే సంభావ్య భావాన్ని పాదసూచికలో భద్రపరిచాం.
