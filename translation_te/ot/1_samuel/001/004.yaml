  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/יּ֔וֹם וַ/יִּזְבַּ֖ח אֶלְקָנָ֑ה וְ/נָתַ֞ן לִ/פְנִנָּ֣ה אִשְׁתּ֗/וֹ וּֽ/לְ/כָל בָּנֶ֛י/הָ וּ/בְנוֹתֶ֖י/הָ מָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/004.yaml
  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
translation:
  language: te
  text: ఎల్కానా బలి అర్పించే రోజు వచ్చినప్పుడు[a], అతడు తన భార్య పెనిన్నాకు, ఆమె కుమారులందరికీ, కుమార్తెలందరికీ వంతులు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు వంతులు ఇచ్చేవాడు.’ హెబ్రీయ క్రియారూపాన్ని సాధారణ గతకాలంగా చదవవచ్చు; అయితే సందర్భం ఇది పదేపదే జరిగే బలి భోజన ఆచారమని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: రోజు వచ్చినప్పుడు
  rationale: ఇది కథనంలో సమయాన్ని సూచించే హెబ్రీయ వ్యక్తీకరణ. ‘రోజు వచ్చినప్పుడు’ అనేది దాని కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּזְבַּח
  choice: బలి అర్పించే
  rationale: זבח బలిగా వధించడం/అర్పించడం అనే ఆరాధనాపరమైన భావాన్ని కలిగి ఉంది. సందర్భానికి అనుగుణంగా ‘బలి అర్పించే’ సహజంగా, తగినంత స్పష్టంగా ఉంది.
- source_word: וְנָתַן
  choice: ఇచ్చాడు
  rationale: రూపపరంగా ఇది గతకాల కథన క్రియ. సందర్భం పునరావృత ఆచారాన్ని సూచించగలిగినా, మూలంలోని సాధారణ గతకాల క్రమాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ఆ సంభావ్యతను పాదసూచికలో తెలిపాం.
- source_word: לִפְנִנָּה אִשְׁתּוֹ
  choice: తన భార్య పెనిన్నాకు
  rationale: హెబ్రీయ సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּלְכָל בָּנֶיהָ וּבְנוֹתֶיהָ
  choice: ఆమె కుమారులందరికీ, కుమార్తెలందరికీ
  rationale: మూలం కుమారులను, కుమార్తెలను విడిగా పేర్కొంటుంది; ఆ నిర్దిష్టతను అనువాదం నిలుపుతుంది.
- source_word: מָנוֹת
  choice: వంతులు
  rationale: బలి భోజనంలో ఒక్కొక్కరికి కేటాయించిన భాగాలను సూచించడానికి ‘వంతులు’ సహజమైన, సంక్షిప్తమైన తెలుగు పదం.
