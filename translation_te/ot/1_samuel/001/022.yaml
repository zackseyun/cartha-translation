source:
  edition: WLC
  text: וְ/חַנָּ֖ה לֹ֣א עָלָ֑תָה כִּֽי אָמְרָ֣ה לְ/אִישָׁ֗/הּ עַ֣ד יִגָּמֵ֤ל הַ/נַּ֨עַר֙ וַ/הֲבִאֹתִ֗י/ו וְ/נִרְאָה֙ אֶת פְּנֵ֣י יְהוָ֔ה וְ/יָ֥שַׁב שָׁ֖ם עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
translation:
  language: te
  text: అయితే హన్నా వెళ్లలేదు. ఆమె తన భర్తతో, “బాలుడు పాలు మానిన తర్వాతే నేను అతణ్ణి తీసుకొస్తాను. అప్పుడు అతడు యాహ్వే సన్నిధిలో ప్రత్యక్షమై[a], ఎప్పటికీ అక్కడే ఉంటాడు[b]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, వేరొక అర్థనిర్మాణం లేదా పాఠసంప్రదాయం ప్రకారం: “నేను యాహ్వే సన్నిధిలో ప్రత్యక్షమవుతాను; అతడు అక్కడే ఎప్పటికీ ఉంటాడు.”'
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ “ఎప్పటికీ” అంటే సమూయేలు యాహ్వే సేవకు శాశ్వతంగా సమర్పించబడటం, అంటే అతడు జీవితాంతం అక్కడ సేవచేయడం.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָתָה
  choice: వెళ్లలేదు
  rationale: עלה అక్షరార్థంగా ‘పైకి వెళ్లడం’ అయినా, ఇక్కడ షిలోహులోని ఆరాధనాస్థలానికి వెళ్లడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సందర్భానికి సహజంగా ‘వెళ్లలేదు’ అని అనువదించాం.
- source_word: כִּי אָמְרָה לְאִישָׁהּ
  choice: ఆమె తన భర్తతో … అని చెప్పింది
  rationale: כִּי ఇక్కడ హన్నా వెళ్లకపోవడానికి కారణాన్ని పరిచయం చేస్తుంది; אִישָׁהּ సందర్భంలో ‘ఆమె భర్త’ అని స్పష్టంగా అర్థమవుతుంది.
- source_word: עַד יִגָּמֵל הַנַּעַר
  choice: బాలుడు పాలు మానిన తర్వాతే
  rationale: עַד లోని ‘అంతవరకు కాదు’ అనే పరిమితి భావాన్ని తెలుగు ‘తర్వాతే’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַהֲבִאֹתִיו
  choice: నేను అతణ్ణి తీసుకొస్తాను
  rationale: పాలు మానిన తరువాత బాలుణ్ణి ఆరాధనాస్థలానికి తీసుకురావాలనే హన్నా ఉద్దేశాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: וְנִרְאָה אֶת־פְּנֵי יְהוָה
  choice: అతడు యాహ్వే సన్నిధిలో ప్రత్యక్షమై
  rationale: MT స్వరచిహ్నాల ప్రకారం నిఫాల్ రూపం ‘సన్నిధిలో ప్రత్యక్షమవడం/కనబడడం’ అనే ఆరాధనా భావాన్ని ఇస్తుంది; తరువాతి ఏకవచన క్రియకు అనుగుణంగా బాలుణ్ణే కర్తగా ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సన్నిహిత లిప్యంతరీకరణను వాడాం.
- source_word: וְיָשַׁב שָׁם
  choice: అక్కడే ఉంటాడు
  rationale: ישב ఇక్కడ కూర్చోవడం కంటే ఆ స్థలంలో కొనసాగి నివసించడం/సేవచేయడం అనే భావం కలిగి ఉంది; ‘అక్కడే ఉంటాడు’ ఆధునిక తెలుగులో సహజం.
- source_word: עַד עוֹלָם
  choice: ఎప్పటికీ
  rationale: హీబ్రూ పదబంధంలోని నిరంతర కాలభావాన్ని నిలుపుతుంది; సందర్భంలో ఇది సమూయేలు జీవితాంత సమర్పణను సూచిస్తుంది.
theological_decisions:
- issue: ‘యాహ్వే సన్నిధిలో ప్రత్యక్షమై’ అనే క్రియకు కర్త
  choice: సమూయేలు—‘అతడు … ప్రత్యక్షమై’
  alternative: ‘నేను యాహ్వే సన్నిధిలో ప్రత్యక్షమవుతాను, అతడు అక్కడే ఉంటాడు’ అని హన్నా తనను మొదటి క్రియకు కర్తగా చెప్పడం
  rationale: MTలోని పాఠం, తరువాత వచ్చే ఏకవచన క్రియ, సమూయేలును మందిరసేవకు తీసుకురావడం అనే కథన గమనం—ఇవన్నీ ప్రధాన పాఠంలో బాలుణ్ణే కర్తగా తీసుకోవడానికి అనుకూలం. అయినప్పటికీ వేరొక పాఠనిర్మాణం/పాఠసంప్రదాయం హన్నాను మొదటి క్రియకు కర్తగా తీసుకుంటుంది; అందువల్ల దానిని పాదసూచికలో నిలిపాం.
- issue: ‘ఎప్పటికీ’ అనే సమయపదం పరిధి
  choice: పదబంధాన్ని ‘ఎప్పటికీ’గా ఉంచి, సందర్భార్థాన్ని పాదసూచికలో వివరించడం
  alternative: ప్రధాన పాఠంలోనే ‘జీవితాంతం’ అని అనువదించడం
  rationale: עוֹלָם లోని విస్తృత, దీర్ఘకాల భావాన్ని కుదించకుండా నిలిపి, ఈ కథనంలో అది శాశ్వత జీవితం కాక సమూయేలు జీవితాంత సేవను సూచిస్తుందని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘తర్వాతే’ ద్వారా עַד యొక్క నిరోధక కాలభావాన్ని, ‘యాహ్వే’ ద్వారా దైవనామాన్ని, పాదసూచిక ద్వారా అసలుపాఠంలోని ప్రత్యామ్నాయ కర్త పఠనాన్ని నిలిపాం.
