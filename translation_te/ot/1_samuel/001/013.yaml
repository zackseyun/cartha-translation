source:
  edition: WLC
  text: וְ/חַנָּ֗ה הִ֚יא מְדַבֶּ֣רֶת עַל לִבָּ֔/הּ רַ֚ק שְׂפָתֶ֣י/הָ נָּע֔וֹת וְ/קוֹלָ֖/הּ לֹ֣א יִשָּׁמֵ֑עַ וַ/יַּחְשְׁבֶ֥/הָ עֵלִ֖י לְ/שִׁכֹּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/013.yaml
  text: Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
translation:
  language: te
  text: హన్నా తన హృదయంలో మాట్లాడుతోంది; ఆమె పెదవులు మాత్రమే కదులుతున్నాయి[a], కానీ ఆమె స్వరం వినిపించేది కాదు. కాబట్టి ఏలీ ఆమె మత్తులో ఉందని అనుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తనలో తాను మాట్లాడుకుంటోంది’ / ‘తన అంతరంగంలో ప్రార్థిస్తోంది.’ హీబ్రూలో అక్షరార్థంగా, ‘తన హృదయంలో మాట్లాడుతోంది’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  choice: తన హృదయంలో మాట్లాడుకుంటోంది
  rationale: హీబ్రూ పదబంధంలోని ‘హృదయంలో మాట్లాడడం’ అనే రూపకాన్ని నిలుపుతూ, సందర్భంలోని అంతరంగ, శబ్దరహిత మాటను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: רַק
  choice: మాత్రమే
  rationale: బయటికి కనిపించినది పెదవుల కదలిక మాత్రమే అనే పరిమితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׂפָתֶיהָ נָּעוֹת
  choice: ఆమె పెదవులు కదులుతున్నాయి
  rationale: נוּעַ యొక్క సాధారణ అర్థమైన కదలికను, కొనసాగుతున్న క్రియాభావంతో సహజంగా అందిస్తుంది.
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  choice: కానీ ఆమె స్వరం వినిపించలేదు
  rationale: నిఫాల్ రూపంలోని నిష్క్రియ భావాన్ని నిలుపుతూ, పెదవుల కదలికకు స్వరం వినిపించకపోవడానికి మధ్యనున్న వ్యత్యాసాన్ని ‘కానీ’ స్పష్టం చేస్తుంది.
- source_word: וַיַּחְשְׁבֶהָ
  choice: ఆమె ... అని అనుకున్నాడు
  rationale: ఒక వ్యక్తిని ఒక స్థితిలో ఉన్నదిగా ఎంచడం లేదా భావించడం అనే חָשַׁב నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְשִׁכֹּרָה
  choice: మద్యం తాగి ఉందని
  rationale: ‘మత్తులో ఉన్నది/తాగినది’ అనే అర్థాన్ని సాధారణ పాఠకునికి స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְחַנָּה הִיא
  choice: హన్నా
  rationale: הִיא విషయాన్ని ఉద్ఘాటించినా, తెలుగులో ప్రత్యేక కాలసూచక పదాన్ని చేర్చకుండా పేరు ద్వారానే విషయాన్ని సహజంగా ముందుకు తెస్తుంది.
