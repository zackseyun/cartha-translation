source:
  edition: WLC
  text: וְ/ל/וֹ֙ שְׁתֵּ֣י נָשִׁ֔ים שֵׁ֤ם אַחַת֙ חַנָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פְּנִנָּ֑ה וַ/יְהִ֤י לִ/פְנִנָּה֙ יְלָדִ֔ים וּ/לְ/חַנָּ֖ה אֵ֥ין יְלָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
translation:
  language: te
  text: అతనికి ఇద్దరు భార్యలు ఉండేవారు.[a] ఒకరి పేరు హన్నా, రెండోవారి పేరు పెనిన్నా. పెనిన్నాకు పిల్లలు ఉండేవారు, కానీ హన్నాకు పిల్లలు లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరానుసారంగా, “మరియు అతనికి ఇద్దరు భార్యలు ఉండిరి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  choice: అతనికి ... ఉండేవారు
  rationale: హీబ్రూలోని ఉపసర్గాధారిత స్వామ్య నిర్మాణం అక్షరార్థంగా ‘అతనికి’ అని ఉంటుంది. ఆధునిక తెలుగులో వ్యక్తులను కలిగి ఉండడాన్ని సహజంగా తెలిపేందుకు ‘అతనికి ... ఉండేవారు’ అని అనువదించబడింది; ప్రారంభ సంధికారకం వాక్యప్రవాహంలో కలిసిపోయింది.
- source_word: שְׁתֵּי נָשִׁים
  choice: ఇద్దరు భార్యలు
  rationale: ఈ వివాహ సందర్భంలో נָשִׁים అనేది సాధారణంగా ‘స్త్రీలు’ అని కాకుండా ‘భార్యలు’ అని అర్థం. ఇది మూలపాఠం తెలిపే బహుభార్యత్వ కుటుంబ పరిస్థితిని స్పష్టంగా ఉంచుతుంది.
- source_word: שֵׁם אַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: ఒకరి పేరు ... రెండోవారి పేరు
  rationale: మూలంలో ‘పేరు’ అనే పదం రెండుసార్లు వచ్చి సమాంతర గుర్తింపు సూత్రాన్ని ఏర్పరుస్తుంది. తెలుగులో సహజంగా ఉండేలా అదే పునరుక్తి, క్రమభేదం నిలుపబడ్డాయి.
- source_word: חַנָּה
  choice: హన్నా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: פְּנִנָּה
  choice: పెనిన్నా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיְהִי לִפְנִנָּה יְלָדִים
  choice: పెనిన్నాకు పిల్లలు ఉండేవారు
  rationale: హీబ్రూ అస్తిత్వ–స్వామ్య వాక్యనిర్మాణాన్ని తెలుగులో సహజమైన ‘కు ... ఉండేవారు’ రూపంలో ఇచ్చాం. יְלָדִים లింగాన్ని నిర్దిష్టం చేయని విస్తృత పదం కాబట్టి ‘పిల్లలు’ అని అనువదించాం.
- source_word: וּלְחַנָּה אֵין יְלָדִים
  choice: కానీ హన్నాకు పిల్లలు లేరు
  rationale: אֵין ఉనికి లేకపోవడాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ‘లేరు’ అని ఇచ్చాం. పక్కపక్కన ఉంచిన రెండు స్థితుల మధ్య మూలపాఠంలో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని ‘కానీ’ వ్యక్తం చేస్తుంది.
