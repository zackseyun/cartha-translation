translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘ఉండేవారు’ వ్యక్తులను సూచించేటప్పుడు తెలుగు మర్యాదా/బహువచన సమ్మతిని పాటిస్తుంది. మూలంలోని బహుభార్యత్వ పరిస్థితి గానీ, హన్నా సంతానలేమి గానీ మృదువుగా మార్చకుండా నేరుగా నిలుపబడ్డాయి.
