  text: וַ/תִּדֹּ֨ר נֶ֜דֶר וַ/תֹּאמַ֗ר יְהוָ֨ה צְבָא֜וֹת אִם רָאֹ֥ה תִרְאֶ֣ה בָּ/עֳנִ֣י אֲמָתֶ֗/ךָ וּ/זְכַרְתַּ֨/נִי֙ וְ/לֹֽא תִשְׁכַּ֣ח אֶת אֲמָתֶ֔/ךָ וְ/נָתַתָּ֥ה לַ/אֲמָתְ/ךָ֖ זֶ֣רַע אֲנָשִׁ֑ים וּ/נְתַתִּ֤י/ו לַֽ/יהוָה֙ כָּל יְמֵ֣י חַיָּ֔י/ו וּ/מוֹרָ֖ה לֹא יַעֲלֶ֥ה עַל רֹאשֽׁ/וֹ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
translation:
  language: te
  text: 'ఆమె ఒక మొక్కుబడి చేసుకొని ఇలా అంది: “సేనల యాహ్వే, నీ దాసి బాధను నీవు నిజంగా చూసి, నన్ను జ్ఞాపకం చేసుకొని, నీ దాసిని మరచిపోకుండా, నీ దాసికి ఒక మగబిడ్డను అనుగ్రహిస్తే[a], అతని జీవితకాలమంతా అతన్ని యాహ్వేకు ఇస్తాను; క్షురకత్తి అతని తలపైకి రాదు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మగబిడ్డ’ అని అనువదించిన హీబ్రూ మాటకు అక్షరార్థం ‘పురుషుల సంతానం’; ఇక్కడ అది మగ బిడ్డను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘క్షురకత్తి అతని తలపైకి రాదు’ అనే మాట నాజీరు మొక్కుబడితో సంబంధమున్న ప్రత్యేక ప్రతిష్ఠ భాషను ప్రతిధ్వనిస్తుంది. అయితే ఈ వచనం జుట్టు కత్తిరించకూడదనే నియమాన్ని మాత్రమే స్పష్టంగా చెబుతుంది; ‘నాజీరు’ అనే పేరును ఉపయోగించదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּדֹּר נֶדֶר
  choice: ఆమె ఒక మొక్కుబడి చేసుకొని
  rationale: హీబ్రూలో ఒకే మూలపదాన్ని పునరుక్తి చేసి అధికారిక ప్రమాణాన్ని బలపరుస్తుంది. ఆధునిక తెలుగులో ‘మొక్కుబడి చేసుకొని’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה צְבָאוֹת
  choice: సైన్యాల యెహోవా
  rationale: దైవనామాన్ని ‘యెహోవా’గా ఉంచి, צְבָאוֹת అనే బిరుదును వ్యాఖ్యానించకుండా ‘సైన్యాల’గా అనువదించింది.
- source_word: אִם רָאֹה תִרְאֶה
  choice: నీవు నిజంగా చూసి
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే బలాన్ని ‘నిజంగా’ ద్వారా సహజ తెలుగులో వ్యక్తం చేసింది.
- source_word: בָּעֳנִי
  choice: బాధను
  rationale: ఈ పదం కష్టం, దుఃఖం, అవమానం వంటి విస్తృత భావాలను కలిగి ఉంది; ‘బాధ’ సందర్భాన్ని అతిగా నిర్దిష్టం చేయకుండా వాటిని ఆవర్తిస్తుంది.
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  choice: నీ దాసి / నీ దాసికి
  rationale: మూలపదం స్త్రీ సేవకురాలిని స్పష్టంగా సూచిస్తుంది; ‘దాసి’ లింగాన్ని, ప్రార్థనలోని వినయాన్ని నిలుపుతుంది.
- source_word: וּזְכַרְתַּנִי וְלֹא תִשְׁכַּח
  choice: నన్ను జ్ఞాపకం చేసుకొని ... మరచిపోకుండా
  rationale: ‘జ్ఞాపకం చేసుకోవడం—మరచిపోకపోవడం’ అనే మూలంలోని సమాంతర ప్రార్థనా భాషను నిలిపింది.
- source_word: זֶרַע אֲנָשִׁים
  choice: మగ సంతానాన్ని
  rationale: అక్షరార్థంగా ‘పురుషుల విత్తనం/సంతానం’; సందర్భంలో మగ బిడ్డను సూచిస్తుంది. ‘మగ సంతానం’ మూలంలోని ‘సంతానం’ భావాన్నీ పురుష లింగాన్నీ కాపాడుతుంది.
- source_word: וּנְתַתִּיו לַיהוָה
  choice: అతన్ని యెహోవాకు ఇస్తాను
  rationale: ‘ఇస్తాను’ మూలక్రియను నేరుగా నిలుపుతుంది; ‘ప్రతిష్ఠిస్తాను’ అని అనువదిస్తే వ్యాఖ్యానార్థం అదనంగా చేరుతుంది.
- source_word: כָּל יְמֵי חַיָּיו
  choice: అతని జీవితకాలమంతా
  rationale: మొక్కుబడి వర్తించే సంపూర్ణ జీవితకాలాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: అతని తల మీదికి క్షురకత్తి రాదు
  rationale: హీబ్రూ చిత్రణను దగ్గరగా నిలుపుతూ, జుట్టు కత్తిరించకూడదనే నియమాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలిపింది.
- issue: ‘తల మీదికి క్షురకత్తి రాదు’ అనే మాటలో నాజీరు సూచన
  choice: ప్రధాన పాఠంలో నిర్దిష్ట నియమాన్నే ఉంచడం
  alternative: అతన్ని నాజీరుగా ప్రతిష్ఠిస్తాను అని స్పష్టీకరించడం
  rationale: ఈ భాష నాజీరు సంబంధిత ప్రత్యేక ప్రతిష్ఠను ప్రతిధ్వనించినా, వచనం స్వయంగా ‘నాజీరు’ అనే పేరును ఉపయోగించదు. అందువల్ల ఆ నిర్ధారణను ప్రధాన పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవభరితమైన శైలిని ఉపయోగించింది. ‘దాసి’, ‘క్షురకత్తి’ వంటి పదాలు మూలంలోని లింగ, సాంస్కృతిక వివరాలను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఎంపికయ్యాయి.
