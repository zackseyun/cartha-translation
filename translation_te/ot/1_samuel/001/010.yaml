source:
  edition: WLC
  text: וְ/הִ֖יא מָ֣רַת נָ֑פֶשׁ וַ/תִּתְפַּלֵּ֥ל עַל יְהוָ֖ה וּ/בָכֹ֥ה תִבְכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/010.yaml
  text: And she was bitter in soul[b][a], and she prayed to Yahweh and wept bitterly.
translation:
  language: te
  text: ఆమె మనసులో తీవ్రమైన వేదనతో[a] యాహ్వేకు ప్రార్థించింది, ఎంతో ఏడ్చింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ప్రాణంలో చేదుతో”; ఇది తీవ్రమైన అంతరంగ వేదనను తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో బలపరిచే నిర్మాణం ఉంది—అక్షరార్థంగా, “ఏడుస్తూ ఏడ్చింది”; దీనిని “ఎంతో ఏడ్చింది” లేదా “ఏడుస్తూనే ఉంది” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  choice: మనసులో ఎంతో వేదనతో
  rationale: అక్షరార్థంగా ‘ప్రాణంలో/అంతరంగంలో చేదుతో’ అనే హీబ్రూ ప్రయోగం తీవ్రమైన అంతరంగ వేదనను సూచిస్తుంది. తెలుగు సహజత్వం కోసం దాని భావాన్ని స్పష్టంగా తెలిపే రూపం ఎంచుకున్నాం; రూపకాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַתִּתְפַּלֵּל
  choice: ప్రార్థిస్తూ
  rationale: פלל హిత్పయేల్ రూపం ఇక్కడ ప్రార్థించడాన్ని నేరుగా సూచిస్తుంది. తరువాతి సమానాంతర క్రియతో సహజ తెలుగు వాక్యప్రవాహం కోసం అసమాపక రూపం వాడాం; ‘తీవ్రంగా’ వంటి అదనపు భావాన్ని క్రియలో చేర్చలేదు.
- source_word: עַל יְהוָה
  choice: యాహ్వేకు
  rationale: התפלל తో వచ్చిన עַל ఇక్కడ ప్రార్థన ఎవరికి ఉద్దేశించబడిందో తెలియజేస్తుంది. ‘యాహ్వేకు’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన రూపం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: וּבָכֹה תִבְכֶּה
  choice: వెక్కివెక్కి ఏడ్చింది
  rationale: ‘ఏడుస్తూ ఏడ్చింది’ అనే infinitive absolute + finite verb నిర్మాణం ఏడుపు తీవ్రతను లేదా కొనసాగింపును బలపరుస్తుంది. ‘వెక్కివెక్కి ఏడ్చింది’ ఆ బలాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; ‘చేదుగా ఏడ్చింది’ అని ముందున్న రూపకాన్ని క్రియలోకి దిగుమతి చేయదు.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ నుడికారపు భావాన్ని ప్రధాన పాఠంలో స్పష్టంగా ఇచ్చి, దాని అక్షరరూపాన్ని పాదసూచికలో భద్రపరిచాం. తీవ్రత/కొనసాగింపు మధ్యనున్న స్వల్ప సందిగ్ధతను పాదసూచికలో నిలిపాం.
