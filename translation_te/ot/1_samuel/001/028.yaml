source:
  edition: WLC
  text: וְ/גַ֣ם אָנֹכִ֗י הִשְׁאִלְתִּ֨/הוּ֙ לַֽ/יהוָ֔ה כָּל הַ/יָּמִים֙ אֲשֶׁ֣ר הָיָ֔ה ה֥וּא שָׁא֖וּל לַֽ/יהוָ֑ה וַ/יִּשְׁתַּ֥חוּ שָׁ֖ם לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
translation:
  language: te
  text: “నేనూ ఇతనిని యాహ్వేకు అప్పగించాను[a]. ఇతడు జీవించినంతకాలం యాహ్వేకు అంకితమైనవాడే.” అక్కడ అతడు యాహ్వేకు సాగిలపడి నమస్కరించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇతనిని యాహ్వేకు అరువుగా ఇచ్చాను’ లేదా ‘అంకితం చేశాను.’ ఇక్కడ హెబ్రీలో ‘అప్పగించాను/అరువుగా ఇచ్చాను’ అనే క్రియ, ఈ అధ్యాయంలో ముందుగా ‘అడిగాను’ అని ఉపయోగించిన క్రియ ఒకే ధాతువునుంచి వచ్చాయి; మూలంలో పదప్రయోగం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అక్కడ వారు యాహ్వేకు సాగిలపడి నమస్కరించారు.’ హెబ్రీ రూపాన్ని అనువాద సంప్రదాయంలో ఏకవచనంగానూ బహువచనంగానూ అర్థం చేసుకున్నారు. ఏకవచనంగా తీసుకుంటే, ‘అతడు’ ఎవరో వాక్యంలో స్పష్టంగా చెప్పబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ
  choice: ఇతణ్ణి … అప్పగించాను
  rationale: హిఫిల్ రూపం ‘అడుగు/కోరు’ అనే שׁאל ధాతువునుంచి వచ్చి, హన్నా ముందుగా చేసిన విన్నపంతో పదప్రయోగ సంబంధాన్ని కలిగిస్తుంది. తెలుగులో ‘అరువిచ్చాను’ అనడం తాత్కాలిక అప్పు భావాన్ని కలిగించవచ్చు; సందర్భంలోని జీవితకాల సమర్పణను సహజంగా తెలియజేయడానికి ‘అప్పగించాను’ ఎంచుకున్నాం. మూలంలోని పదప్రయోగాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: לְ ఉపసర్గ ఇక్కడ దిశ/గ్రహీత భావాన్ని ఇస్తుంది; హన్నా బాలుణ్ణి యాహ్వేకు అప్పగిస్తున్నది. יהוה అనే నిబంధన నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה
  choice: ఇతడు జీవించినంతకాలం
  rationale: జీవితకాలమంతటినీ సూచించే హెబ్రీ ప్రయోగానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: שָׁאוּל
  choice: అప్పగించబడినవాడిగా ఉంటాడు
  rationale: ఇది שׁאל ధాతువుకు చెందిన నిష్క్రియ రూపం; ముందున్న הִשְׁאִלְתִּהוּతో ఉద్దేశపూర్వక పునరుక్తి ఉంది. తెలుగులో అదే ‘అప్పగించు’ పదాన్ని పునరావృతం చేసి ఆ సంబంధాన్ని కొంతవరకు నిలిపాం.
- source_word: וַיִּשְׁתַּחוּ
  choice: సాష్టాంగపడ్డాడు
  rationale: ఈ క్రియ ఆరాధనలో నేలకు వంగడం లేదా సాగిలపడడం అనే శారీరక చర్యను సూచిస్తుంది. ‘సాష్టాంగపడ్డాడు’ ఆ చర్యనూ ఆరాధనా సందర్భాన్నీ స్పష్టంగా తెలియజేస్తుంది; కర్తపై ఉన్న అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
- source_word: שָׁם
  choice: అక్కడ
  rationale: సాధారణ స్థలవాచక క్రియావిశేషణానికి సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: హెబ్రీ పాఠంలో నిబంధన నామమైన יהוה నేరుగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా అందించాం.
- issue: וַיִּשְׁתַּחוּ క్రియకు కర్త
  choice: అతడు యాహ్వేకు సాష్టాంగపడ్డాడు
  alternative: వారు యాహ్వేకు సాష్టాంగపడ్డారు
  rationale: మసొరా స్వరచిహ్నాలతో ఉన్న రూపం ఏకవచనంగా అర్థం చేసుకోవడానికి అనుకూలమైనప్పటికీ, కర్త ఎవరో వాక్యంలో స్పష్టంగా చెప్పబడలేదు; ప్రాచీన అనువాద సంప్రదాయంలో బహువచన పఠనం కూడా కనిపిస్తుంది. అందువల్ల ప్రధాన పాఠంలో ఏకవచనాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘అప్పగించాను/అప్పగించబడినవాడు’ అనే పునరుక్తి మూలంలోని ధాతు సంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది. ‘సాష్టాంగపడ్డాడు’ ఆరాధనలోని వంగి నమస్కరించే చర్యను చూపిస్తుంది.
