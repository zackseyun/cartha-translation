source:
  edition: WLC
  text: אַל תִּתֵּן֙ אֶת אֲמָ֣תְ/ךָ֔ לִ/פְנֵ֖י בַּת בְּלִיָּ֑עַל כִּֽי מֵ/רֹ֥ב שִׂיחִ֛/י וְ/כַעְסִ֖/י דִּבַּ֥רְתִּי עַד הֵֽנָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
translation:
  language: te
  text: నీ దాసిని నీచురాలిగా[a] పరిగణించవద్దు. నా మొర, మనోవ్యథ ఎంతో ఎక్కువగా ఉండటంవల్లనే నేను ఇప్పటివరకు మాట్లాడాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నిష్ప్రయోజనత యొక్క కుమార్తె”; ఇది నైతికంగా హేయమైన లేదా అపఖ్యాతిగల స్త్రీని సూచించే జాతీయం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా మొర, మనోవ్యథ ఎంతో అధికంగా ఉండటంవల్లనే నేను ఇప్పటివరకు మాట్లాడాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  choice: ఎంచవద్దు
  rationale: ఇక్కడ נתן ... לפני అనేది అక్షరార్థంగా ‘ముందు ఉంచు’ కాదు; ఎవరినైనా ఒక విధమైన వ్యక్తిగా పరిగణించడం అనే జాతీయార్థం కలిగిన ప్రయోగం.
- source_word: אֲמָתְךָ
  choice: నీ దాసిని
  rationale: హన్నా తనను తాను వినయంగా సంబోధించుకునే స్త్రీలింగ సేవక పదాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בַּת בְּלִיָּעַל
  choice: నీచురాలిగా
  rationale: అక్షరార్థం ‘నిష్ప్రయోజకత్వపు కుమార్తె’; సందర్భంలో నైతికంగా హేయమైన లేదా అపఖ్యాతిగల స్త్రీని సూచించే జాతీయం. ‘నీచురాలు’ దాని నైతిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֵרֹב
  choice: తీవ్రమైన ... బట్టే
  rationale: ‘అధికతవల్ల/ఎక్కువగా ఉండటంవల్ల’ అనే కారణార్థాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; అంతర్గత బాధ తీవ్రతను నిలుపుతుంది.
- source_word: שִׂיחִי
  choice: నా తీవ్రమైన వేదనను
  rationale: שִׂיחַ ధ్యానం, మొర, బాధతో కూడిన మనోవేదన అనే పరిధి కలిగి ఉంది. ఈ సందర్భంలో హన్నా దేవుని ఎదుట వ్యక్తం చేసిన బాధను ‘వేదన’ సహజంగా సూచిస్తుంది.
- source_word: וְכַעְסִי
  choice: మనోవ్యథను
  rationale: כעס ఇక్కడ ఆమె కలిగించిన రెచ్చగొట్టడం కాదు; ఆమె అనుభవిస్తున్న కలత, దుఃఖం, వ్యాకులత. ‘మనోవ్యథ’ ఆ అంతర్గత బాధను స్పష్టం చేస్తుంది.
- source_word: דִּבַּרְתִּי עַד הֵנָּה
  choice: నేను ఇప్పటివరకు ఇలా మాట్లాడాను
  rationale: చెప్పడం ఇప్పటి క్షణం వరకు కొనసాగిందనే కాలభావాన్ని ‘ఇప్పటివరకు’ స్పష్టంగా తెలియజేస్తుంది; ‘ఇలా’ సందర్భంలోని ఆమె ప్రార్థనా విధానాన్ని సూచిస్తుంది.
