  register: ఆధునిక ప్రామాణిక తెలుగు; హన్నా వినయపూర్వకమైన ప్రత్యక్ష సంబోధనను, అలాగే ఆమె అంతర్గత వేదన తీవ్రతను గౌరవప్రదమైన సాధారణ పదజాలంతో వ్యక్తం చేసింది. మూలంలోని రెండు సమీపార్థ బాధాపదాలను ‘వేదన’, ‘మనోవ్యథ’గా వేరుచేసింది.
