source:
  edition: WLC
  text: וַ/יַּ֧עַן עֵלִ֛י וַ/יֹּ֖אמֶר לְכִ֣י לְ/שָׁל֑וֹם וֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל יִתֵּן֙ אֶת שֵׁ֣לָתֵ֔/ךְ אֲשֶׁ֥ר שָׁאַ֖לְתְּ מֵ/עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
translation:
  language: te
  text: 'అప్పుడు ఏలీ జవాబిచ్చి ఇలా అన్నాడు: “క్షేమంగా వెళ్లు. నీవు ఆయనను అడిగినదాన్ని[a] ఇశ్రాయేలు దేవుడు నీకు అనుగ్రహించుగాక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మనవిని” లేదా “నీ విన్నపాన్ని.” హెబ్రీ పదం ప్రార్థనలో అడిగినదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: జవాబిస్తూ ఇలా అన్నాడు
  rationale: హెబ్రీలోని ‘జవాబిచ్చి అన్నాడు’ అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: לְכִי לְשָׁלוֹם
  choice: క్షేమంగా వెళ్లు
  rationale: ఇది సురక్షితంగా, మేలుగా వెళ్లాలనే ఆశీర్వాదపూర్వక హెబ్రీ నుడికారానికి సహజమైన తెలుగు సమానం; కేవలం అంతరంగ ప్రశాంతత అనే అర్థానికి పరిమితం చేయదు.
- source_word: וֵאלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: ఇశ్రాయేలు దేవుణ్ణి సూచించే హెబ్రీ సంబంధపదబంధాన్ని నేరుగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: יִתֵּן
  choice: అనుగ్రహించుగాక
  rationale: ఇక్కడి క్రియ ఆశీర్వాదం లేదా ఆకాంక్ష భావంలో ఉంది; ‘ఇచ్చుగాక’ కంటే ప్రార్థనలో చేసిన మనవిని మన్నించాలనే సందర్భాన్ని ‘అనుగ్రహించుగాక’ సహజంగా తెలియజేస్తుంది.
- source_word: שֵׁלָתֵךְ
  choice: నీవు ... చేసిన మనవిని
  rationale: ఈ నామవాచకం ప్రార్థనలో అడిగినదాన్ని లేదా విన్నపాన్ని సూచిస్తుంది. ‘మనవి’ సాధారణ పాఠకులకు సహజంగా ఉండి ప్రార్థనా సందర్భాన్నీ నిలుపుతుంది.
- source_word: אֲשֶׁר שָׁאַלְתְּ מֵעִמּוֹ
  choice: నీవు ... దేవునికి చేసిన
  rationale: హెబ్రీలో ‘ఆయన నుండి అడిగిన’ అని ఉన్న భావాన్ని తెలుగులో సహజంగా ‘దేవునికి చేసిన మనవి’గా వ్యక్తం చేస్తుంది; సర్వనామానికి దేవుడే పూర్వపదమని సందర్భం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: מֵעִמּוֹ లోని సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది.
  alternative: సర్వనామాన్ని ‘ఆయన’గా మాత్రమే ఉంచి వ్యాకరణపరమైన అస్పష్టతను కొనసాగించడం.
  rationale: హన్నా యెహోవా సన్నిధిలో తన మనసును కుమ్మరించుకున్నానని ముందే చెప్పింది; అందువల్ల ఆమె చేసిన మనవి దేవునికే. తెలుగులో ‘దేవునికి చేసిన’ అనడం సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది, ఏలీని ఉద్దేశించినదనే అనవసర అపార్థాన్ని నివారిస్తుంది.
- issue: יִתֵּן యొక్క విధి—ప్రవచనమా, ఆశీర్వాద ఆకాంక్షా?
  choice: ఆశీర్వాదపూర్వక ఆకాంక్షగా ‘అనుగ్రహించుగాక.’
  alternative: నిశ్చయ ప్రకటనగా ‘అనుగ్రహిస్తాడు.’
  rationale: ఈ సందర్భంలోని రూపం ఏలీ పలికిన ఆశీర్వాదం లేదా కోరికగా సహజంగా అర్థమవుతుంది; ఫలితం తప్పక జరుగుతుందనే భావాన్ని పాఠ్యంలోకి అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి ఉపయోగించబడింది. ‘క్షేమంగా వెళ్లు’ హెబ్రీ ఆశీర్వాద నుడికారాన్ని సహజంగా అందిస్తుంది. పాదసూచిక గుర్తు సంబంధిత పదమైన ‘మనవిని’ వెంట ఉంచబడింది.
