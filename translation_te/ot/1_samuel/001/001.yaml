id: 1SA.1.1
reference: 1 Samuel 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֜ד מִן הָ/רָמָתַ֛יִם צוֹפִ֖ים מֵ/הַ֣ר אֶפְרָ֑יִם וּ/שְׁמ֡/וֹ אֶ֠לְקָנָה בֶּן יְרֹחָ֧ם בֶּן אֱלִיה֛וּא בֶּן תֹּ֥חוּ בֶן צ֖וּף אֶפְרָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: There was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
translation:
  language: te
  text: ఎఫ్రాయిము కొండప్రాంతంలోని రామతయిమ్-సోఫీముకు చెందిన ఒక వ్యక్తి ఉండేవాడు; అతని పేరు ఎల్కానా. అతడు యెరోహాము కుమారుడు; యెరోహాము ఎలీహూ కుమారుడు, ఎలీహూ తోహూ కుమారుడు, తోహూ సూఫు కుమారుడు; అతడు ఎఫ్రాతీయుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భానుసారంగా “ఎఫ్రాయిమీయుడు.” హెబ్రీలో అక్షరార్థంగా “ఎఫ్రాతీయుడు” అని ఉంది; ఇక్కడ అది ఎఫ్రాయిము ప్రాంతానికి చెందినవాడనే భావంలో వాడబడి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉండేవాడు
  rationale: కథను ప్రారంభించే היה యొక్క వయ్యిక్తోల్ రూపాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తపరుస్తుంది; మూలంలో లేని స్పష్టమైన కాలసూచకమైన ‘ఇప్పుడు’ను చేర్చదు.
- source_word: אִישׁ אֶחָד
  choice: ఒక మనిషి
  rationale: ఇంకా పేరు చెప్పని ఒక నిర్దిష్ట వ్యక్తిని పరిచయం చేసే హెబ్రీ ప్రయోగాన్ని సహజంగా నిలుపుతుంది.
- source_word: מִן הָרָמָתַיִם צוֹפִים
  choice: రామతయిమ్-సోఫీము నుండి
  rationale: పదభాగాల అర్థాన్ని ఊహాత్మకంగా విప్పకుండా, సంయుక్త స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: מֵהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలోని
  rationale: ప్రాదేశిక ప్రయోగంలో הַר ఒకే పర్వతాన్ని కాక కొండప్రాంతాన్ని సూచిస్తుంది; స్థలనామంతో సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וּשְׁמוֹ
  choice: అతని పేరు
  rationale: హెబ్రీ సమన్వయ వాక్య నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: אֶלְקָנָה
  choice: ఎల్కానా
  rationale: వ్యక్తినామాన్ని అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶן
  choice: కుమారుడు ... కుమారుడు
  rationale: వంశావళి వరుసలోని בֶּן పదాన్ని ‘కుమారుడు’గా నిలుపుతూ, ప్రతి సంబంధం తెలుగులో సందిగ్ధత లేకుండా పునరుక్తి చేయబడింది.
- source_word: אֶפְרָתִי
  choice: ఎఫ్రాతీయుడు
  rationale: హెబ్రీ పదపు ప్రత్యక్ష రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భానుసారమైన ‘ఎఫ్రాయిమీయుడు’ అనే అవగాహనను పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: אֶפְרָתִי అనే జాతి/ప్రాంత సూచన
  choice: ఎఫ్రాతీయుడు
  alternative: ఎఫ్రాయిమీయుడు
  rationale: ఇది ప్రధానంగా పదార్థ-భౌగోళిక సందిగ్ధత. హెబ్రీ రూపం ‘ఎఫ్రాతీయుడు’కు నేరుగా అనుగుణంగా ఉంది; అయితే ముందున్న ఎఫ్రాయిము ప్రాంత ప్రస్తావన కారణంగా దీనిని ‘ఎఫ్రాయిమీయుడు’గా కూడా అర్థం చేసుకోవచ్చు. ఆ సందిగ్ధతను ప్రధాన పాఠ్యంలో నిశ్శబ్దంగా పరిష్కరించకుండా పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. పొడవైన హెబ్రీ వంశావళి వాక్యాన్ని చదవడానికి సులభంగా చిన్న వాక్యాలుగా విభజించినా, సంబంధాల క్రమం మరియు మూలంలోని సమాచారం యథాతథంగా నిలుపబడింది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంచబడింది.
