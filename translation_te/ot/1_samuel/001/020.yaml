  text: וַ/יְהִי֙ לִ/תְקֻפ֣וֹת הַ/יָּמִ֔ים וַ/תַּ֥הַר חַנָּ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תִּקְרָ֤א אֶת שְׁמ/וֹ֙ שְׁמוּאֵ֔ל כִּ֥י מֵ/יְהוָ֖ה שְׁאִלְתִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
translation:
  language: te
  text: కాలం నిండినప్పుడు హన్నా గర్భవతియై ఒక కుమారుణ్ణి కన్నది.[a] “నేను యాహ్వే నుండి ఇతణ్ణి కోరాను” అని చెప్పి, అతనికి సమూయేలు అని పేరు పెట్టింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారానికి అక్షరార్థం ‘దినాల చక్రం/మలుపు’; తగిన సమయం వచ్చినప్పుడు అని భావం.
    reason: lexical_alternative
  - marker: b
    text: 'ఇక్కడ ‘సమూయేలు’ అనే పేరును ‘అడుగు, కోరు’ అనే అర్థమున్న שׁאל (షాʼఅల్) అనే హీబ్రూ క్రియతో పదప్రయోగంగా అనుసంధానించారు: ‘నేను యాహ్వే నుండి ఇతణ్ణి కోరాను.’ ఇది ఆ పేరుకు ఖచ్చితమైన వ్యుత్పత్తి అని తప్పనిసరిగా సూచించదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  choice: కాలం నిండినప్పుడు
  rationale: అక్షరార్థంగా ‘దినాల చక్రం/మలుపు’ అనే భావమున్న ఈ కాలసూచక నుడికారాన్ని, ప్రసవానికి తగిన సమయం వచ్చినదనే అర్థం స్పష్టమయ్యే సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַתַּהַר
  choice: గర్భవతియై
  rationale: హీబ్రూ జనన వృత్తాంతాల్లో הרה సూచించే గర్భధారణను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַתֵּלֶד בֵּן
  choice: ఒక కుమారుణ్ణి కన్నది
  rationale: ילד + בן అనే జనన సూత్రానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: అతనికి ... అని పేరు పెట్టింది
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని పదప్రతిపదంగా కాకుండా స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని అనుసరిస్తుంది.
- source_word: כִּי מֵיְהוָה שְׁאִלְתִּיו
  choice: “నేను ఇతణ్ణి యాహ్వేను అడిగాను” అని చెప్పి
  rationale: שׁאל (‘అడుగు/కోరు’) అనే క్రియతో పేరుకు ఉన్న పదప్రయోగ సంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, బిడ్డను యాహ్వే నుండి కోరిన భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది. ‘అని చెప్పి’ హీబ్రూలో అంతర్లీనంగా ఉన్న నామకరణ వివరణను స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో చతురక్షర దైవనామం నేరుగా ఉంది; కాబట్టి దేవుని ప్రత్యేక నామాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా అందించాం.
- issue: సమూయేలు పేరుకు שׁאל (‘అడుగు’) క్రియతో ఉన్న సంబంధం
  choice: ప్రధాన పాఠంలో ‘అడిగాను’ అనే మాటను ఉంచి, పదప్రయోగాన్ని పాదసూచికలో వివరించడం
  alternative: పేరుకు ఖచ్చితమైన వ్యుత్పత్తి ఇదేనని ప్రధాన పాఠంలో ప్రకటించడం
  rationale: హీబ్రూ వాక్యం పేరును שׁאל క్రియతో అనుసంధానిస్తుంది; అయితే ‘సమూయేలు’ అనే పేరుకు ఖచ్చితమైన వ్యుత్పత్తి వివాదాస్పదం. అందువల్ల వాక్యంలోని పదప్రయోగాన్ని నిలిపి, దానిని నిర్ధారిత శాస్త్రీయ వ్యుత్పత్తిగా చూపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘కాలం నిండినప్పుడు’ కొద్దిగా సాహిత్య గంభీరతను ఉంచినా అర్థసులభం. దైవనామం ‘యాహ్వే’గా, వ్యక్తినామం స్థిరపడిన తెలుగు రూపమైన ‘సమూయేలు’గా ఇచ్చాం.
