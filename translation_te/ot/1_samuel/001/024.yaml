source:
  edition: WLC
  text: וַ/תַּעֲלֵ֨/הוּ עִמָּ֜/הּ כַּ/אֲשֶׁ֣ר גְּמָלַ֗תּ/וּ בְּ/פָרִ֤ים שְׁלֹשָׁה֙ וְ/אֵיפָ֨ה אַחַ֥ת קֶ֨מַח֙ וְ/נֵ֣בֶל יַ֔יִן וַ/תְּבִאֵ֥/הוּ בֵית יְהוָ֖ה שִׁל֑וֹ וְ/הַ/נַּ֖עַר נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
translation:
  language: te
  text: ఆమె అతనికి పాలు మాన్పించిన తరువాత, అతనిని తనతో పాటు మూడు ఎద్దులను[a], ఒక ఏఫా పిండిని, ద్రాక్షామద్యం నింపిన ఒక తోలుతిత్తిని తీసుకొని, షిలోహులో ఉన్న యాహ్వే మందిరానికి తీసుకువచ్చింది. ఆ బాలుడు ఇంకా చిన్నవాడే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ మసొరెతిక్ పాఠం: “మూడు ఎద్దులు”; కొన్ని ప్రాచీన పాఠసాక్ష్యాలు మరియు వ్యాఖ్యాన సంప్రదాయాలు: “మూడేళ్ల ఎద్దు.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ עִמָּהּ
  choice: అతణ్ణి తన వెంట తీసుకొని వెళ్లి
  rationale: עלה అనే క్రియలోని ప్రయాణపు లేదా పైకి వెళ్లే భావాన్ని సందర్భానుకూలంగా ‘తీసుకొని వెళ్లి’ అని వ్యక్తం చేస్తూ, עִמָּהּ లోని సహవాస భావాన్ని ‘తన వెంట’ అని స్పష్టంగా నిలిపింది.
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  choice: ఆమె అతనికి పాలు మాన్పించిన తరువాత
  rationale: ఈ సందర్భంలో גמל శిశువుకు పాలు మాన్పించడాన్ని సూచిస్తుంది. పూర్తయిన చర్య తరువాత జరిగిన ప్రయాణాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּפָרִים שְׁלֹשָׁה
  choice: మూడు ఎద్దులతో[a]
  rationale: మసొరెతిక్ పాఠంలోని సాధారణ అర్థమైన ‘మూడు ఎద్దులు’నే ప్రధాన పాఠంలో నిలిపింది; ప్రాచీన పాఠభేదాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: וְאֵיפָה אַחַת קֶמַח
  choice: ఒక ఏఫా పిండితో
  rationale: ఏఫా అనే ప్రాచీన కొలమానాన్ని సుమారు ఆధునిక పరిమాణంగా మార్చకుండా లిప్యంతరీకరించింది; קֶמַח ను ‘పిండి’గా అనువదించింది.
- source_word: וְנֵבֶל יַיִן
  choice: ద్రాక్షారసం నిండిన ఒక తోలుతిత్తితో
  rationale: נֵבֶל ను ద్రవాన్ని మోసే తోలు పాత్రగా, יַיִן ను సందర్భానికి తగిన సాధారణ తెలుగు పదమైన ‘ద్రాక్షారసం’గా వ్యక్తం చేసింది.
- source_word: וַתְּבִאֵהוּ בֵית יְהוָה שִׁלוֹ
  choice: షిలోహులోని యాహ్వే మందిరానికి తీసుకువచ్చింది
  rationale: హిఫీల్ రూపంలోని ‘తీసుకురావడం’ అనే భావాన్ని నిలిపి, స్థల నామాన్ని ‘షిలోహు’గా మరియు దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: וְהַנַּעַר נָעַר
  choice: ఆ బాలుడు ఇంకా చాలా చిన్నవాడు
  rationale: హీబ్రూలో נער పద పునరుక్తి బాలుడి అతి చిన్న వయస్సును నొక్కిచెబుతుంది; అసహజమైన పదశః పునరుక్తికి బదులుగా తెలుగులో ఆ ఉద్ఘాటనను సహజంగా తెలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణను తెలుగులో ఇచ్చింది.
- issue: బలికి తెచ్చిన ఎద్దుల సంఖ్య లేదా వయస్సు
  choice: మూడు ఎద్దులు
  alternative: మూడేళ్ల ఎద్దు
  rationale: WLC మసొరెతిక్ పాఠం స్పష్టంగా ‘మూడు ఎద్దులు’ అని చదువుతుంది. ఇతర ప్రాచీన సాక్ష్యాల్లో కనిపించే ఏకవచన పఠనాన్ని ప్రధాన పాఠంలో కలపకుండా పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ప్రాచీన కొలమానం ‘ఏఫా’ను అలాగే ఉంచి, అర్థాన్ని మార్చే పాఠభేదాన్ని పాదసూచికలో సూచించింది.
