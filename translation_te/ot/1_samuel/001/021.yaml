  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
translation:
  language: te
  text: అప్పుడు ఎల్కానా తన ఇంటివారందరితో కలిసి యాహ్వేకు ఏటా చేసే బలిని అర్పించడానికి, తన మొక్కుబడిని చెల్లించడానికి పైకి వెళ్లాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, “ఏటా చేసే బలిని మరియు తన మొక్కుబడిని బలిగా అర్పించడానికి.” రెండవ భాగంలో క్రియ సంక్షిప్తంగా ఉంది; సందర్భానుసారంగా అతడు తన మొక్కుబడిని చెల్లించడానికి వెళ్లాడనే భావం.
    reason: మూలంలోని సంక్షిప్త సమన్వయాన్ని తెలియజేస్తూనే, తెలుగులో ‘మొక్కుబడిని అర్పించడం’ అనే అసహజ/అస్పష్ట భావాన్ని నివారించడానికి.
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వెళ్లాడు
  rationale: עלה అనే క్రియకు ‘పైకి వెళ్లడం’ అనే ప్రాథమిక అర్థం ఉంది. షిలోహులోని ఆరాధనా స్థలానికి వెళ్లే యాత్ర సందర్భాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: הָאִישׁ אֶלְקָנָה
  choice: ఎల్కానా
  rationale: ‘ఎల్కానా అనే మనిషి’ అని యథాతథంగా అనడం తెలుగులో అనవసరంగా బరువుగా ఉంటుంది; వ్యక్తిని గుర్తించే పేరే సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וְכָל־בֵּיתוֹ
  choice: తన ఇంటివారందరితో కలిసి
  rationale: ఇక్కడ בַּיִת భవనాన్ని కాక కుటుంబం లేదా గృహసభ్యులను సూచిస్తుంది. ‘ఇంటివారు’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: לִזְבֹּחַ
  choice: అర్పించడానికి
  rationale: זבח బలిగా వధించి అర్పించడాన్ని సూచిస్తుంది. తరువాత వచ్చే ‘బలి’తో కలిసి ‘బలిని అర్పించడం’ సహజమైన తెలుగు ఆరాధనా ప్రయోగం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించింది.
- source_word: זֶבַח הַיָּמִים
  choice: ఏటా అర్పించే బలి
  rationale: పదశః ‘దినాల బలి’ అయిన ఈ పదబంధం సందర్భంలో ప్రతి సంవత్సరం జరిగే బలిని సూచిస్తుంది; ‘ఏటా అర్పించే బలి’ ఆ ఆవర్తన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְאֶת־נִדְרוֹ
  choice: తాను చేసిన మొక్కుబడిని
  rationale: נדר అంటే దేవునికి చేసిన వాగ్దానం లేదా మొక్కుబడి. హీబ్రూలో క్రియ స్పష్టంగా మళ్లీ చెప్పబడకపోవడం వల్ల కలిగే సంక్షిప్తతను ప్రధాన పాఠంలో సాధ్యమైనంతవరకు నిలిపి, వివరణను పాదసూచికలో ఇచ్చింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దేవుని ఒడంబడిక నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, ఆధునికంగా గుర్తించదగిన ‘యాహ్వే’ రూపంలో ఇచ్చింది.
- issue: మొక్కుబడికి సంబంధించిన అంతర్లీన క్రియ
  choice: ‘మొక్కుబడిని అర్పించడానికి’ అని సంక్షిప్త నిర్మాణాన్ని నిలపడం
  alternative: ‘మొక్కుబడిని నెరవేర్చడానికి’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠం ‘తన మొక్కుబడిని’ అని మాత్రమే సమన్వయపరుస్తుంది; ‘నెరవేర్చడం’ భావం సందర్భంలో సాధ్యమైనప్పటికీ మూలంలో స్పష్టంగా లేదు. అందువల్ల దానిని ప్రధాన పాఠంలో నిర్బంధించకుండా పాదసూచికలో వివరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘ఇంటివారు,’ ‘ఏటా,’ ‘మొక్కుబడి’ వంటి సహజ పదాలతో మూలంలోని యాత్ర, కుటుంబం, వార్షిక బలి, వ్రతబాధ్యత అనే భావాలను నిలిపింది.
