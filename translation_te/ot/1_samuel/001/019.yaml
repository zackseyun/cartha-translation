  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֗קֶר וַ/יִּֽשְׁתַּחֲווּ֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּשֻׁ֛בוּ וַ/יָּבֹ֥אוּ אֶל בֵּיתָ֖/ם הָ/רָמָ֑תָ/ה וַ/יֵּ֤דַע אֶלְקָנָה֙ אֶת חַנָּ֣ה אִשְׁתּ֔/וֹ וַ/יִּֽזְכְּרֶ֖/הָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
translation:
  language: te
  text: వారు తెల్లవారుజామునే లేచి యాహ్వే సన్నిధిలో సాగిలపడ్డారు. తరువాత వారు తిరిగి రామాలోని తమ ఇంటికి వచ్చారు. ఎల్కానా తన భార్య హన్నాతో దాంపత్యంగా కలిశాడు[a]; యాహ్వే ఆమెను జ్ఞాపకం చేసుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘తెలుసుకున్నాడు’; ఇది భార్యాభర్తల లైంగిక కలయికను సూచించే మర్యాదపూర్వక ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘జ్ఞాపకం చేసుకున్నాడు’ అనేది కేవలం మళ్లీ గుర్తుకు తెచ్చుకోవడమే కాక, ఒకరి పట్ల అనుగ్రహంతో దృష్టి సారించి కార్యం చేయడాన్ని కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: తెల్లవారుజామునే లేచి
  rationale: שׁכם యొక్క హిఫిల్ రూపం పెందలకడనే లేవడాన్ని సూచిస్తుంది. బוקרతో కలిపి వచ్చిన కాలభావాన్ని సహజమైన ఆధునిక తెలుగులో ఈ విధంగా వ్యక్తం చేశాం.
- source_word: וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో సాగిలపడ్డారు
  rationale: השתחוה శరీరంతో వంగి నమస్కరించే క్రియను సూచిస్తుంది. కేవలం ‘ఆరాధించారు’ అనడం కంటే ‘సాగిలపడ్డారు’ మూలంలోని స్పష్టమైన శారీరక చర్యను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పాండిత్యపూర్వక ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל בֵּיתָם הָרָמָתָה
  choice: తరువాత వారు తిరిగి రామాలోని తమ ఇంటికి వచ్చారు
  rationale: שׁובలోని తిరుగు ప్రయాణ భావాన్ని, בֵּיתָםలోని ‘వారి ఇల్లు’ అనే వివరాన్ని, రామా అనే స్థలనామాన్ని సహజమైన తెలుగు వాక్యక్రమంలో నిలిపాం.
- source_word: וַיֵּדַע אֶלְקָנָה אֶת חַנָּה אִשְׁתּוֹ
  choice: ఎల్కానా తన భార్య హన్నాతో దాంపత్యంగా కలిశాడు
  rationale: ידע ఇక్కడ భార్యాభర్తల లైంగిక కలయికకు మర్యాదపూర్వక ఉపలక్షణం. ‘తెలుసుకున్నాడు’ అనే అక్షరానువాదం తెలుగులో ఉద్దేశిత అర్థాన్ని తెలియజేయదు; ఈ ఎంపిక మూలంలోని మర్యాదను కాపాడుతూ అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיִּזְכְּרֶהָ יְהוָה
  choice: యాహ్వే ఆమెను జ్ఞాపకం చేసుకున్నాడు
  rationale: זכרను విస్తరించి ఫలితాన్ని ముందుగానే చెప్పకుండా, మూలంలోని ‘జ్ఞాపకం చేసుకోవడం’ అనే దైవిక చర్యను నిలిపాం. సందర్భంలో ఇది కేవలం మానసిక స్మరణకన్నా కార్యసాధకమైన అనుగ్రహ దృష్టిని సూచించగలదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. బిరుదును చేర్చకుండా దైవనామాన్ని లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: ידע అనే లైంగిక ఉపలక్షణాన్ని ఎంతవరకు స్పష్టం చేయాలి
  choice: దాంపత్యంగా కలిశాడు
  alternative: తెలుసుకున్నాడు; ఆమెతో శారీరక సంబంధం పెట్టుకున్నాడు
  rationale: అక్షరానువాదమైన ‘తెలుసుకున్నాడు’ ఆధునిక తెలుగులో అపార్థం కలిగిస్తుంది; అత్యంత ప్రత్యక్షమైన పదప్రయోగం మూలంలోని మర్యాదపూర్వక శైలిని కోల్పోతుంది. ఎంచుకున్న రూపం అర్థం, శైలి రెండింటినీ సమతుల్యం చేస్తుంది.
- issue: దేవుడు హన్నాను ‘జ్ఞాపకం చేసుకున్నాడు’ అనే మాట భావం
  choice: జ్ఞాపకం చేసుకున్నాడు అనే మూలప్రతీకను నిలపడం
  alternative: ఆమెను కటాక్షించాడు; ఆమె కోరికను తీర్చాడు
  rationale: హీబ్రూ వాడుకలో ఇది కార్యసాధకమైన శ్రద్ధను సూచించవచ్చు; అయితే ఈ వాక్యం ఫలితాన్ని ఇంకా ప్రకటించదు. అందువల్ల భావాన్ని ముందుగానే నిర్దిష్టం చేయకుండా మూలంలోని ధార్మిక ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘సాగిలపడ్డారు’ మూలంలోని శారీరక ఆరాధనా చర్యను నిలుపుతుంది; ‘దాంపత్యంగా కలిశాడు’ మర్యాదపూర్వకమైనప్పటికీ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిగా అనుసంధానించబడ్డాయి.
