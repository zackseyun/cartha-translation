- from: యెహోవా ఆమె గర్భాన్ని మూసివేశాడు కాబట్టి, ఆమె సవతి ఆమెను బాధపెట్టాలని పదేపదే తీవ్రంగా రెచ్చగొట్టేది.[a]
  to: ఆమె ప్రత్యర్థి ఆమెను కలవరపెట్టడానికి పదేపదే తీవ్రంగా వేధించేది; ఎందుకంటే యాహ్వే ఆమె గర్భాన్ని మూసివేశాడు.[a]
