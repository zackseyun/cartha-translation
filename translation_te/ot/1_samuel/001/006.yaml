source:
  edition: WLC
  text: וְ/כִֽעֲסַ֤תָּ/ה צָֽרָתָ/הּ֙ גַּם כַּ֔עַס בַּ/עֲב֖וּר הַרְּעִמָ֑/הּ כִּֽי סָגַ֥ר יְהוָ֖ה בְּעַ֥ד רַחְמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/006.yaml
  text: And her rival would provoke her bitterly in order to irritate her[a], because Yahweh had closed her womb.
translation:
  language: te
  text: ఆమె ప్రత్యర్థి ఆమెను కలవరపెట్టడానికి పదేపదే తీవ్రంగా వేధించేది; ఎందుకంటే యాహ్వే ఆమె గర్భాన్ని మూసివేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రత్యర్థి’ అని అనువదించిన హీబ్రూ పదం ఒకే ఇంటిలో వైవాహిక ప్రత్యర్థిగా ఉన్న స్త్రీని సూచించవచ్చు; ‘సహభార్య’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִעֲסַתָּה
  choice: పదేపదే ... రెచ్చగొట్టేది
  rationale: כעס పీయేల్ రూపం కోపం లేదా వేదన కలిగించేలా రెచ్చగొట్టడాన్ని సూచిస్తుంది. సందర్భంలోని పునరావృత అలవాటును తెలుగులో ‘పదేపదే ... రెచ్చగొట్టేది’ సహజంగా తెలియజేస్తుంది.
- source_word: צָרָתָהּ
  choice: ఆమె సవతి
  rationale: ఇక్కడ צָרָה ఒకే భర్తకు భార్యలైన స్త్రీల మధ్య ప్రత్యర్థి సంబంధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సవతి’ ఆ గృహసంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; సాధారణ ‘ప్రత్యర్థి’ కంటే సందర్భానికి నిర్దిష్టంగా ఉంటుంది.
- source_word: גַּם כַּעַס
  choice: తీవ్రంగా
  rationale: మూలంలోని పునరుక్తి రెచ్చగొట్టే చర్య యొక్క తీవ్రతను పెంచుతుంది. తెలుగులో ‘తీవ్రంగా’ ఆ ఉద్ఘాటనను సహజంగా అందిస్తుంది.
- source_word: בַּעֲבוּר
  choice: '... బాధపెట్టాలని'
  rationale: ఈ సందర్భంలో ఉద్దేశాన్ని తెలిపే ప్రయోగం. ‘బాధపెట్టాలని’ అనే నిర్మాణం చర్య వెనుకనున్న లక్ష్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַרְּעִמָהּ
  choice: ఆమెను బాధపెట్టాలని
  rationale: అరుదైన ఈ క్రియ ఇక్కడ కలత, వేదన లేదా ఆందోళన కలిగించడాన్ని సూచిస్తుంది. ‘బాధపెట్టడం’ భావాన్ని అతిగా నిర్దిష్టం చేయకుండా విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: కాబట్టి
  rationale: యెహోవా హన్నా గర్భాన్ని మూసివేయడం పెనిన్నా ఆమెను అవమానించడానికి ఉపయోగించుకున్న పరిస్థితికి కారణంగా వస్తుంది. తెలుగు వాక్యక్రమంలో కారణవాక్యాన్ని ముందుంచి ‘కాబట్టి’ అనడం సహజం.
- source_word: סָגַר
  choice: మూసివేశాడు
  rationale: סגר యొక్క సూటి అర్థమైన ‘మూయడం’ను నిలుపుతూ, గర్భధారణను నిరోధించడాన్ని సూచించే హీబ్రూ రూపకాన్ని అలాగే ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: בְּעַד רַחְמָהּ
  choice: ఆమె గర్భాన్ని
  rationale: רֶחֶם అంటే గర్భం/గర్భాశయం. סגר‌తో కలిసి గర్భధారణను అనుమతించకపోవడం అనే భావాన్ని కలిగించే ‘గర్భాన్ని మూయడం’ అనే మూలభాషా రూపకాన్ని తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: వచనంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. అందువల్ల దానిని వ్యక్తిగత నామంగా ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: హన్నా వంధ్యత్వంలో దేవుని కార్యసాధకత్వం
  choice: యెహోవా ఆమె గర్భాన్ని మూసివేశాడు
  alternative: ఆమెకు పిల్లలు కలగడానికి యెహోవా అనుమతించలేదు
  rationale: మూలపాఠం దేవుని చర్యను నేరుగా ‘మూసివేశాడు’ అని చెబుతుంది. దాని వల్ల కలిగే తాత్త్విక ఉద్రిక్తతను సున్నితపరచకుండా, హీబ్రూ రూపకాన్ని మరియు కార్యసాధకత్వాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా కారణవాక్యాన్ని ముందుంచాం. అయితే ‘గర్భాన్ని మూసివేశాడు’ అనే ప్రధాన మూలభాషా రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
