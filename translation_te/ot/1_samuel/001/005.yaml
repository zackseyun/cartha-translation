source:
  edition: WLC
  text: וּ/לְ/חַנָּ֕ה יִתֵּ֛ן מָנָ֥ה אַחַ֖ת אַפָּ֑יִם כִּ֤י אֶת חַנָּה֙ אָהֵ֔ב וַֽ/יהוָ֖ה סָגַ֥ר רַחְמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/005.yaml
  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
translation:
  language: te
  text: కాని హన్నాకు అతడు రెండింతల భాగం[a] ఇచ్చేవాడు, ఎందుకంటే యహ్వే ఆమె గర్భాన్ని మూసివేసినప్పటికీ అతడు హన్నాను ప్రేమించేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధానికి అక్షరార్థం ‘రెండు ముఖాలు/నాసికల ఒక భాగం.’ ఇది క్లిష్టమైన పదబంధం; ‘రెండింతల భాగం’ లేదా ‘ప్రత్యేకమైన భాగం’ అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחַנָּה
  choice: కాని హన్నాకు
  rationale: ముందటి వచనంలో పెనిన్నాకు, ఆమె పిల్లలకు ఇచ్చిన భాగాలతో ఉన్న వ్యత్యాసాన్ని సందర్భానుసారంగా ‘కాని’ స్పష్టం చేస్తుంది; לְ అనే విభక్తి భావాన్ని ‘హన్నాకు’ సహజంగా తెలియజేస్తుంది.
- source_word: יִתֵּן
  choice: ఇచ్చేవాడు
  rationale: గతంలో అలవాటుగా, ప్రతి సంవత్సరం జరిగే చర్యను సూచించే అసంపూర్ణ క్రియారూపానికి ఆధునిక తెలుగులో ఇది సహజమైన సమానం.
- source_word: מָנָה אַחַת אַפָּיִם
  choice: రెండింతల భాగం[a]
  rationale: అక్షరార్థంగా క్లిష్టమైన ‘రెండు ముఖాలు/నాసికల ఒక భాగం’ అనే పదబంధానికి ‘రెండింతల భాగం’ సంభావ్య భావం. ‘ప్రత్యేక భాగం’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: כִּי אֶת־חַנָּה אָהֵב
  choice: ఎందుకంటే అతడు హన్నాను ప్రేమించాడు
  rationale: כִּי ఇక్కడ హన్నాకు ప్రత్యేక భాగం ఇవ్వడానికి కారణాన్ని పరిచయం చేస్తుంది; ప్రేమను తెలిపే వాక్యం సరళంగా అనువదించబడింది.
- source_word: וַיהוָה
  choice: యహ్వే
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: סָגַר רַחְמָהּ
  choice: ఆమె గర్భాన్ని మూసివేసినప్పటికీ
  rationale: סגר అంటే ‘మూయడం’; רחם ఇక్కడ సంతానోత్పత్తిని సూచించే ‘గర్భం’. సందర్భంలోని నేపథ్య స్థితినీ, హన్నాపై ప్రేమకు విరుద్ధంగా నిలిచే పరిస్థితినీ సహజమైన తెలుగులో తెలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని నామంగానే నిలిపి, సాధారణ బిరుదుగా మార్చలేదు.
- issue: హన్నా సంతానలేమికి దేవుని క్రియాశీలత
  choice: యహ్వే ఆమె గర్భాన్ని మూసివేసినప్పటికీ
  alternative: యహ్వే ఆమె గర్భాన్ని మూసివేశాడు
  rationale: మూలం యహ్వేనే కర్తగా స్పష్టంగా పేర్కొంటుంది; దానిని మృదువుగా మార్చలేదు. ‘అయినప్పటికీ’ అనే సంబంధం ఎల్కానా ప్రేమకూ ఆమె పరిస్థితికీ మధ్య సందర్భంలో ఉన్న వ్యత్యాసాన్ని వ్యక్తం చేస్తుంది, అయితే దైవ సార్వభౌమత్వంపై అదనపు వివరణను చేర్చదు.
- issue: מָנָה אַחַת אַפָּיִם అనే క్లిష్ట పదబంధం
  choice: రెండింతల భాగం
  alternative: ప్రత్యేకమైన భాగం
  rationale: ప్రధాన పాఠంలో అత్యంత సంభావ్యమైన అర్థాన్ని పఠనీయంగా ఇచ్చి, మూలంలోని నిజమైన పదార్థ అనిశ్చితిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇచ్చేవాడు’ పునరావృత గతచర్యను తెలియజేస్తుంది. మూలంలోని దైవకర్తృత్వం, క్లిష్ట పదబంధంలోని అనిశ్చితి రెండూ నిలుపబడ్డాయి.
