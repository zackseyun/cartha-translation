  yaml_path: translation/ot/1_samuel/001/014.yaml
  text: And Eli said to her[b][a], “How long will you be drunk? Put away your wine from you.”
translation:
  language: te
  text: ఏలీ ఆమెతో, “నీవు ఎంతకాలం మత్తులో ఉంటావు[a]? నీ ద్రాక్షారసాన్ని నీ దగ్గరనుండి తొలగించు[b]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
