    text: “మత్తులో ఉంటావు” అని అనువదించిన హీబ్రూ క్రియకు “మత్తెక్కుతావు” లేదా “మత్తెక్కించుకుంటూ ఉంటావు” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నీ ద్రాక్షారసాన్ని నీ మీదనుండి తొలగించు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ עֵלִי
  choice: ఏలీ ఆమెతో ... అని అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణంలో అందిస్తుంది.
- source_word: עַד מָתַי
  choice: ఎంతకాలం
  rationale: ‘ఎప్పటివరకు’ అనే భావాన్ని సందర్భానికి తగిన సహజ తెలుగు ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: תִּשְׁתַּכָּרִין
  choice: మత్తులో ఉంటావు
  rationale: ఈ హిత్పయేల్ అసంపూర్ణ క్రియ మత్తెక్కడం లేదా మత్తులో ఉండడం అనే రెండు సమీప భావాలకు వీలిస్తుంది; ఏలీ చేసిన ఆరోపణను సహజంగా తెలియజేస్తూ అస్పష్టతను పూర్తిగా తొలగించదు.
- source_word: הָסִירִי אֶת יֵינֵךְ מֵעָלָיִךְ
  choice: నీ ద్రాక్షారసాన్ని నీ మీదనుండి తొలగించు
  rationale: ‘నీ మీదనుండి’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ ఆజ్ఞను స్పష్టంగా అందిస్తుంది; ఇది పానీయాన్ని దూరం చేయడం గానీ దాని ప్రభావాన్ని వదిలించుకోవడం గానీ సూచించవచ్చు.
