id: 1SA.1.3
reference: 1 Samuel 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָלָה֩ הָ/אִ֨ישׁ הַ/ה֤וּא מֵֽ/עִיר/וֹ֙ מִ/יָּמִ֣ים יָמִ֔ימָ/ה לְ/הִֽשְׁתַּחֲוֺ֧ת וְ/לִ/זְבֹּ֛חַ לַ/יהוָ֥ה צְבָא֖וֹת בְּ/שִׁלֹ֑ה וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י חָפְנִי֙ וּ/פִ֣נְחָ֔ס כֹּהֲנִ֖ים לַ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
translation:
  language: te
  text: ఆ మనిషి ఏటేటా తన పట్టణం నుండి షిలోహుకు ఎక్కి వెళ్లి, సైన్యాల యహ్వేకు[a] నమస్కరించి బలి అర్పించేవాడు. ఏలీకి ఇద్దరు కుమారులైన హొఫ్నీ, ఫీనెహాసు అక్కడ యహ్వేకు యాజకులుగా ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా, “సేనల ప్రభువు.”
    reason: יהוה צבאות అనే బిరుదుకు ప్రాచుర్యంలో ఉన్న సంప్రదాయ అనువాదాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: וְעָלָה
  choice: ఎక్కి వెళ్లి ... అర్పించేవాడు
  rationale: ఇక్కడి క్రియారూపం గతంలో క్రమంగా జరిగే ఆచారాన్ని సూచిస్తుంది. ‘అర్పించేవాడు’ ఆ అలవాటును తెలుపుతుంది; ‘ఎక్కి వెళ్లి’ עלה లోని పైకి వెళ్లే భావాన్ని నిలుపుతుంది.
- source_word: הָאִישׁ הַהוּא
  choice: ఆ మనిషి
  rationale: ఇప్పటికే పరిచయమైన ఎల్కానాను తిరిగి సూచించే నిర్దేశక పదబంధాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: מֵעִירוֹ
  choice: తన పట్టణం నుండి
  rationale: עִיר పట్టణం లేదా నగరం అని అర్థం కావచ్చు. ప్రాచీన సందర్భంలో సహజమైన తెలుగు కోసం ‘పట్టణం’ ఎంచుకున్నాం.
- source_word: מִיָּמִים יָמִימָה
  choice: ఏటేటా
  rationale: ఈ హీబ్రూ నానుడి ప్రతి సంవత్సరం క్రమంగా జరిగే చర్యను సూచిస్తుంది; ‘ఏటేటా’ సంక్షిప్తమైన, సహజమైన సమానార్థకం.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: నమస్కరించి
  rationale: మూల క్రియలో వంగి నమస్కరించే శారీరక చర్యతో పాటు ఆరాధన భావం ఉంది. ‘నమస్కరించి’ ఆ రూపక చర్యను ‘ఆరాధించడానికి’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: וְלִזְבֹּחַ
  choice: బలి అర్పించి
  rationale: ఆరాధనా సందర్భంలో జంతుబలిని సమర్పించే చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: దైవనామమైన יהוהను బిరుదుగా మార్చకుండా తెలుగు లిపిలో ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: צְבָאוֹת
  choice: సైన్యాల
  rationale: ఈ బహువచన నామవాచకానికి ‘సైన్యాలు’ అనే పారదర్శకమైన మూలార్థాన్ని నిలుపుతుంది; ‘సర్వశక్తిమంతుడు’ వంటి వ్యాఖ్యాత్మక విస్తరణను నివారిస్తుంది.
- source_word: בְּשִׁלֹה
  choice: షిలోహుకు
  rationale: עלה అనే గమన క్రియతో తెలుగు వాక్యనిర్మాణంలో గమ్యస్థానాన్ని ‘షిలోహుకు’ అని చెప్పడం సహజం.
- source_word: וְשָׁם
  choice: అక్కడ ... ఉండేవారు
  rationale: స్థల సూచనను స్పష్టంగా నిలుపుతూ తెలుగులో అవసరమైన క్రియను చేర్చుతుంది.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: ఏలీ ఇద్దరు కుమారులు
  rationale: ఇద్దరు కుమారులనే సంఖ్యా ప్రత్యేకతను నిలుపుతూ సహజమైన తెలుగు పదక్రమాన్ని అనుసరిస్తుంది.
- source_word: חָפְנִי וּפִנְחָס
  choice: హొఫ్నీ, ఫీనెహాసు
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగులో గుర్తించదగిన ప్రామాణిక రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: כֹּהֲנִים לַיהוָה
  choice: యహ్వేకు యాజకులుగా
  rationale: వారు యహ్వే సేవలో యాజకులుగా ఉన్నారనే సంబంధాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. ‘యెహోవా’ సంప్రదాయ రూపం అయినప్పటికీ ‘యహ్వే’ మూలనామ పునర్నిర్మాణానికి మరింత సమీపం.
- issue: יהוה צבאות అనే దైవబిరుదు
  choice: సైన్యాల యహ్వే
  alternative: సేనల ప్రభువు; సర్వశక్తిమంతుడైన యహ్వే
  rationale: צבאות యొక్క ‘సైన్యాలు’ అనే అర్థాన్ని స్పష్టంగా నిలుపుతూ, అది ఏ సైన్యాలను సూచిస్తుందో పాఠం తేల్చని అస్పష్టతను అలాగే ఉంచాం. ‘సర్వశక్తిమంతుడు’ అనేది భావవ్యాఖ్య, నేర అనువాదం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించాం. వార్షిక ఆచారాన్ని ‘ఏటేటా ... అర్పించేవాడు’తో తెలిపి, עלה యొక్క దిశాభావాన్ని ‘ఎక్కి వెళ్లి’తో నిలిపాం. దైవనామాన్ని ‘యహ్వే’గా, పేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
