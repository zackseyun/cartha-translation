- from: ఆ మనిషి ఏటేటా తన పట్టణం నుండి షిలోహుకు ఎక్కి వెళ్లి, సైన్యాల యహ్వేకు[a] నమస్కరించి బలి అర్పించేవాడు. ఏలీ ఇద్దరు కుమారులైన హొఫ్నీ, ఫీనెహాసు అక్కడ యహ్వేకు యాజకులుగా ఉండేవారు.
