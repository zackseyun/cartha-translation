id: 1SA.1.7
reference: 1 Samuel 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֵ֨ן יַעֲשֶׂ֜ה שָׁנָ֣ה בְ/שָׁנָ֗ה מִ/דֵּ֤י עֲלֹתָ/הּ֙ בְּ/בֵ֣ית יְהוָ֔ה כֵּ֖ן תַּכְעִסֶ֑/נָּה וַ/תִּבְכֶּ֖ה וְ/לֹ֥א תֹאכַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
translation:
  language: te
  text: ఇలా ఏటేటా జరిగేది:[a] హన్నా యాహ్వే మందిరానికి[b] వెళ్లినప్పుడల్లా, పెనిన్నా ఆమెను వేధించేది; దాంతో హన్నా ఏడ్చేది, తినేది కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు ఏటేటా అలా చేసేవాడు.’ హెబ్రీ క్రియ అక్షరార్థంగా పుంలింగ ఏకవచనంలో ఉంది; అది ఎల్కానాను సూచించవచ్చు. అయితే ఏటేటా పునరావృతమైన మొత్తం పరిస్థితిని సంక్షిప్తంగా తెలిపే ప్రయోగంగానూ దీనిని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, ‘యాహ్వే మందిరంలో’ లేదా ‘యాహ్వే మందిరం వద్ద.’ హెబ్రీ విభక్తి ‘లో/వద్ద’ అనే భావాన్ని ఇస్తుంది; అయితే వెళ్లడాన్ని తెలిపే క్రియతో గమ్యస్థానాన్ని సూచిస్తూ ‘మందిరానికి’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן יַעֲשֶׂה
  choice: ఇలా జరిగేది
  rationale: יַעֲשֶׂה రూపరీత్యా పుంలింగ ఏకవచనం (‘అతడు చేసేవాడు’); అయితే ఈ సందర్భంలో ఏటేటా పునరావృతమయ్యే పరిస్థితిని సంక్షిప్తంగా తెలిపే భావం కూడా సాధ్యమే. సహజమైన తెలుగు ప్రధాన పాఠ్యంలో ఆ పరిస్థితి భావాన్ని ఉంచి, రూపరీత్యా సాధ్యమైన పఠనాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: שָׁנָה בְשָׁנָה
  choice: ఏటేటా
  rationale: ఈ విభజనాత్మక హెబ్రీ ప్రయోగం ప్రతి సంవత్సరం పునరావృతమైన కార్యాన్ని సూచిస్తుంది; ‘ఏటేటా’ సంక్షిప్తంగా, సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: מִדֵּי עֲלֹתָהּ
  choice: వెళ్లినప్పుడల్లా
  rationale: מִדֵּי తో కూడిన క్రియానామ రూపం ‘ఎన్నిసార్లు/ఎప్పుడెప్పుడు … అప్పుడల్లా’ అనే పునరావృత భావాన్ని ఇస్తుంది. స్త్రీలింగ ప్రత్యయం సందర్భానుసారం హన్నాను సూచిస్తుంది.
- source_word: בְּבֵית יְהוָה
  choice: యాహ్వే మందిరానికి
  rationale: చలనాన్ని తెలిపే ‘వెళ్లడం/పైకి వెళ్లడం’ అనే సందర్భంలో בְּ గమ్యస్థాన భావంతో సహజ తెలుగులో ‘మందిరానికి’ అని ఇచ్చాం. ‘మందిరం’ בַּיִת యొక్క ఆరాధనా స్థల భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: תַּכְעִסֶנָּה
  choice: ఆమెను రెచ్చగొట్టేది
  rationale: כעס హిఫీల్ రూపం ఇక్కడ ఎదుటివారికి కోపం, చికాకు లేదా వేదన కలిగించే ఉద్దేశపూర్వక ప్రవర్తనను సూచిస్తుంది. ‘రెచ్చగొట్టేది’ విరోధపూర్వక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַתִּבְכֶּה וְלֹא תֹאכַל
  choice: ఏడ్చేది, భోజనం చేసేది కాదు
  rationale: క్రియారూపాలు కథన రూపంలో ఉన్నా, ఏటేటా జరిగే అలవాటైన ఫలితాన్ని ఈ సందర్భంలో సూచిస్తున్నాయి. తెలుగు పునరావృత భూతకాల రూపాలు ఆ భావాన్ని స్పష్టంగా ఇస్తాయి.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం బిరుదును కాక దేవుని ప్రత్యేక నామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: יַעֲשֶׂה యొక్క కర్త మరియు భావం
  choice: పునరావృత పరిస్థితిని తెలిపే ‘ఇలా జరిగేది’
  alternative: ఎల్కానాను సూచించే ‘అతడు అలా చేసేవాడు’
  rationale: క్రియ వ్యాకరణపరంగా పుంలింగ ఏకవచనమే అయినా కర్తను ఈ వాక్యంలో మళ్లీ స్పష్టంగా పేర్కొనలేదు. ముందరి సందర్భంలోని ఎల్కానా కర్త కావచ్చు; అదే సమయంలో మొత్తం పునరావృత పరిస్థితిని సంగ్రహించే ప్రయోగంగానూ అర్థం చేసుకోవచ్చు. ప్రధాన పాఠ్యం సహజమైన పరిస్థితి భావాన్ని ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. పునరావృత చర్యను ‘ఏటేటా’, ‘వెళ్లినప్పుడల్లా’, ‘ఏడ్చేది’ వంటి సహజ రూపాలతో తెలిపాం. అస్పష్ట సర్వనామాల వల్ల గందరగోళం రాకుండా సందర్భం ఆధారంగా హన్నా, పెనిన్నా పేర్లను స్పష్టీకరించాం; కొత్త భావాన్ని చేర్చలేదు.
