revisions:
- from: ఇలా ఏటేటా జరిగేది:[a] హన్నా యాహ్వే మందిరానికి[b] వెళ్లినప్పుడల్లా, పెనిన్నా ఆమెను రెచ్చగొట్టేది; దాంతో హన్నా ఏడ్చేది, భోజనం చేసేది కాదు.
  to: ఇలా ఏటేటా జరిగేది:[a] హన్నా యాహ్వే మందిరానికి[b] వెళ్లినప్పుడల్లా, పెనిన్నా ఆమెను వేధించేది; దాంతో హన్నా ఏడ్చేది, తినేది కాదు.
  rationale: כעס హిఫీల్‌కు సందర్భోచితమైన ‘వేధించేది’ని ఎంచుకున్నాం. అలాగే బְּבֵית యెహోవా గురించిన పాదటిప్పణిని దాని నిజమైన స్థానార్థానికి పరిమితం చేశాం. మిగిలిన పాఠ్యం మూలంలోని కర్త-అస్పష్టతను పాదటిప్పణిలో కాపాడుతూ, పునరావృత చర్యను సహజ తెలుగులో అందిస్తుంది.
