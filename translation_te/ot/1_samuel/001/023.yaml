  text: וַ/יֹּ֣אמֶר לָ/הּ֩ אֶלְקָנָ֨ה אִישָׁ֜/הּ עֲשִׂ֧י הַ/טּ֣וֹב בְּ/עֵינַ֗יִ/ךְ שְׁבִי֙ עַד גָּמְלֵ֣/ךְ אֹת֔/וֹ אַ֛ךְ יָקֵ֥ם יְהוָ֖ה אֶת דְּבָר֑/וֹ וַ/תֵּ֤שֶׁב הָֽ/אִשָּׁה֙ וַ/תֵּ֣ינֶק אֶת בְּנָ֔/הּ עַד גָּמְלָ֖/הּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
translation:
  language: te
  text: 'ఆమె భర్త ఎల్కానా ఆమెతో ఇలా అన్నాడు: “నీ దృష్టికి ఏది మంచిదనిపిస్తే అది చేయి. నీవు అతనికి పాలు మాన్పించే వరకు ఉండు. అయితే యెహోవా తన మాటను స్థిరపరచుగాక[a].” కాబట్టి ఆ స్త్రీ ఉండి, తన కుమారునికి పాలు మాన్పించే వరకు అతనికి పాలిచ్చింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్థిరపరచుగాక’ అనే మాటను ‘ధృవపరచుగాక’ లేదా ‘నెరవేర్చుగాక’ అని కూడా అనువదించవచ్చు. హీబ్రూలో ఇది యెహోవా వాగ్దానాన్నిగానీ, ఈ సందర్భంలో ఇప్పుడే చెప్పబడిన విషయాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישָׁהּ
  choice: ఆమె భర్త
  rationale: సందర్భంలో אִישָׁהּ ఎల్కానాకు హన్నాతో ఉన్న వైవాహిక సంబంధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఆమె భర్త’ సహజమైన, ఖచ్చితమైన అనువాదం.
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  choice: నీ దృష్టికి ఏది మంచిదనిపిస్తే అది చేయి
  rationale: ‘నీ కళ్లలో మంచిదైనది చేయి’ అనే హీబ్రూ నుడికారానికి వ్యక్తిగతంగా సరైనదని తోచినదాన్ని చేయడం అనే భావం ఉంది. తెలుగు సహజత్వంతో పాటు మూలంలోని దృశ్యభావాన్ని కొంత నిలుపుతుంది.
- source_word: שְׁבִי
  choice: ఇక్కడే ఉండు
  rationale: ఈ సందర్భంలో ישׁב కూర్చోవడం కాదు, వెళ్లకుండా ఉండిపోవడాన్ని సూచిస్తుంది. ‘ఇక్కడే ఉండు’ సందర్భాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עַד גָּמְלֵךְ אֹתוֹ / עַד גָּמְלָהּ אֹתוֹ
  choice: నీవు అతనికి పాలు మాన్పించే వరకు / తన కుమారునికి పాలు మాన్పించే వరకు
  rationale: శిశు సంరక్షణ సందర్భంలో גמל బిడ్డకు తల్లిపాలు మాన్పించడాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: אַךְ
  choice: అయితే
  rationale: ముందు ఇచ్చిన అనుమతికి అనుసంధానమైన పరిమితి లేదా ఆకాంక్షను אַךְ పరిచయం చేస్తుంది. తెలుగులో ‘అయితే’ ఆ సంభాషణ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָקֵם
  choice: స్థిరపరచుగాక
  rationale: קום హిఫీల్ రూపం మాటను నిలబెట్టడం, నిర్ధారించడం లేదా నెరవేర్చడం అనే భావాలను కలిగి ఉంది. ‘స్థిరపరచుగాక’ జస్సివ్ ఆశీర్వచన/ప్రార్థనా ఛాయను, అలాగే మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: דְּבָרוֹ
  choice: తన మాటను
  rationale: דבר అంటే మాట, విషయం లేదా వాగ్దానం కావచ్చు. ‘తన మాటను’ అనేది మూలానికి నేరుగా ఉండి, అది యెహోవా వాగ్దానమా లేక సందర్భంలో చెప్పబడిన విషయమా అనే సందిగ్ధతను కాపాడుతుంది.
- source_word: וַתֵּינֶק
  choice: పాలిచ్చింది
  rationale: ఈ క్రియ బిడ్డకు తల్లిపాలు ఇవ్వడాన్ని సూచిస్తుంది. ‘పాలిచ్చింది’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన పదప్రయోగం.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: మూలంలో వ్యక్తినామం కాకుండా నిర్దిష్ట ఉపపదంతో కూడిన సాధారణ నామవాచకం ఉంది. ‘ఆ స్త్రీ’ మూలరూపాన్ని నిలుపుతూ సందర్భంలో హన్నాను స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: ఎల్కానా మాటలో ‘తన మాట’ దేనిని సూచిస్తుంది?
  choice: ‘తన మాటను’ అని నిర్దిష్టీకరించకుండా ఉంచడం
  alternative: ‘తన వాగ్దానాన్ని’; ‘బిడ్డను గూర్చిన మాటను’; ‘నీ మొక్కును యెహోవా ధృవపరచుగాక’
  rationale: హీబ్రూ పాఠంలో ‘అతని/తన మాట’ అని మాత్రమే ఉంది; అది యెహోవా వాగ్దానాన్నా, లేక ఇప్పుడే చెప్పబడిన విషయం లేదా మొక్కునా సూచిస్తుందో పూర్తిగా స్పష్టం కాదు. అనువాదం ఈ వ్యాఖ్యాన సందిగ్ధతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రత్యక్ష సంభాషణలో సాధారణ పాఠకులకు అర్థమయ్యే పదాలు ఎంచుకోగా, ‘స్థిరపరచుగాక’ ద్వారా మూలంలోని గంభీరమైన ప్రార్థనా ఛాయను నిలిపాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
