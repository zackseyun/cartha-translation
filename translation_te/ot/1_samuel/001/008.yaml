id: 1SA.1.8
reference: 1 Samuel 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לָ֜/הּ אֶלְקָנָ֣ה אִישָׁ֗/הּ חַנָּה֙ לָ֣/מֶה תִבְכִּ֗י וְ/לָ֨/מֶה֙ לֹ֣א תֹֽאכְלִ֔י וְ/לָ֖/מֶה יֵרַ֣ע לְבָבֵ֑/ךְ הֲ/ל֤וֹא אָֽנֹכִי֙ ט֣וֹב לָ֔/ךְ מֵ/עֲשָׂרָ֖ה בָּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
translation:
  language: te
  text: అప్పుడు ఆమె భర్త ఎల్కానా ఆమెతో, “హన్నా, నీవెందుకు ఏడుస్తున్నావు? నీవెందుకు తినడం లేదు? నీ హృదయం ఎందుకు దుఃఖంగా ఉంది?[a] పది మంది కుమారులకంటే నేను నీకు మేలైనవాడిని కాదా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ హృదయం ఎందుకు కలతగా ఉంది?” అక్షరార్థంగా, “నీ హృదయం ఎందుకు చెడ్డగా ఉంది?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: אֶלְקָנָה אִישָׁהּ
  choice: ఆమె భర్త ఎల్కానా
  rationale: ఎల్కానా ఆమె భర్త అనే సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: לָמֶה
  choice: ఎందుకు
  rationale: మూలంలోని మూడు ప్రశ్నల పునరుక్తిని నిలుపుతుంది.
- source_word: תִבְכִּי
  choice: ఏడుస్తున్నావు
  rationale: కొనసాగుతున్న దుఃఖక్రియను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לֹא תֹאכְלִי
  choice: భోజనం చేయడం లేదు
  rationale: ఆమె ప్రస్తుతం తినకపోవడాన్ని సూచిస్తుంది; ‘తినవా?’ వంటి సంకల్పార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: יֵרַע לְבָבֵךְ
  choice: నీ హృదయం ... దుఃఖంగా ఉంది
  rationale: అక్షరార్థంగా ‘నీ హృదయం చెడ్డగా ఉంది’; సందర్భంలో ఇది అంతరంగ దుఃఖాన్ని సూచిస్తుంది. హృదయ రూపకాన్ని నిలుపుతూ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הֲלוֹא ... טוֹב לָךְ
  choice: నేను నీకు మేలు కాదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే హెబ్రీయ ప్రతికూల అలంకార ప్రశ్నను నిలుపుతుంది.
- source_word: מֵעֲשָׂרָה בָּנִים
  choice: పది మంది కుమారులకంటే
  rationale: మూలంలోని లింగ-నిర్దిష్టమైన ‘కుమారులు’ అనే పదాన్నీ, ‘పది’ అనే సంఖ్యనూ వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: בָּנִים అనే లింగ-నిర్దిష్ట నామవాచకం
  choice: కుమారులు
  alternative: పిల్లలు
  rationale: హెబ్రీ పదం స్పష్టంగా పుంలింగ బహువచనం; సందర్భంలోని సాంస్కృతిక భావాన్ని సమతలపరచకుండా మూలాన్ని అనుసరిస్తుంది.
- issue: ఎల్కానా మాటలోని స్వీయమూల్యాంకనం
  choice: నేను నీకు మేలు కాదా?
  alternative: నేను నీకు పది మంది కుమారులతో సమానం కాదా?
  rationale: మూలం ‘మంచి/మేలు’ అనే తులనాత్మక పదాన్ని వాడుతుంది; ‘సమానం’ అని మార్చడం దాని అలంకార ఉద్వేగాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. మూలంలోని మూడు ‘ఎందుకు’ ప్రశ్నలు, హృదయ రూపకం, ప్రతికూల అలంకార ప్రశ్న నిలుపబడ్డాయి.
