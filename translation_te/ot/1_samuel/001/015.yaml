- from: 'అప్పుడు హన్నా ఇలా జవాబిచ్చింది: “లేదు, అయ్యా! నేను ఆత్మలో కలత చెందిన స్త్రీని[a]. నేను ద్రాక్షారసంగానీ మత్తుపానీయంగానీ[b] తాగలేదు. యాహ్వే సన్నిధిలో నా ప్రాణాన్ని కుమ్మరించాను.”'
  to: 'కానీ హన్నా జవాబిస్తూ ఇలా చెప్పింది: “లేదు, అయ్యా! నేను మనస్సు కలత చెందిన స్త్రీని[a]. నేను ద్రాక్షారసంగానీ ఇతర మత్తుపానీయంగానీ తాగలేదు. యాహ్వే సన్నిధిలో నా ప్రాణాన్ని వెల్లగక్కాను.”'
  rationale: సవరించిన పాఠం ప్రతిస్పందనా సందర్భాన్ని ‘కానీ’ ద్వారా స్పష్టపరుస్తుంది. ‘మనస్సు కలత చెందిన’ అనేది కְשַׁת רוּחַ యొక్క అంతరంగ వ్యథను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; పాదసూచికలో ‘ఆత్మలో’ అనే మరింత అక్షరానువాద ప్రత్యామ్నాయం నిలిపాం. ‘ఇతర మత్తుపానీయం’ యయిన్ మరియు శేఖార్ మధ్య భేదాన్ని కాపాడుతుంది. ‘నా ప్రాణాన్ని వెల్లగక్కాను’ నెఫెష్‌ను ‘ప్రాణం’గానే ఉంచి, ‘కుమ్మరించు’ హీబ్రూ రూపకానికి తెలుగు ప్రార్థనా-సందర్భంలో సహజమైన సమానార్థకాన్ని అందిస్తుంది.
