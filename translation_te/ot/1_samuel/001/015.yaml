  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תַּ֨עַן חַנָּ֤ה וַ/תֹּ֨אמֶר֙ לֹ֣א אֲדֹנִ֔/י אִשָּׁ֤ה קְשַׁת ר֨וּחַ֙ אָנֹ֔כִי וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שָׁתִ֑יתִי וָ/אֶשְׁפֹּ֥ךְ אֶת נַפְשִׁ֖/י לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/015.yaml
  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
translation:
  language: te
  text: 'కానీ హన్నా జవాబిస్తూ ఇలా చెప్పింది: “లేదు, అయ్యా! నేను మనస్సు కలత చెందిన స్త్రీని[a]. నేను ద్రాక్షారసంగానీ ఇతర మత్తుపానీయంగానీ తాగలేదు. యాహ్వే సన్నిధిలో నా ప్రాణాన్ని వెల్లగక్కాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆత్మలో కలత చెందిన స్త్రీని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן חַנָּה וַתֹּאמֶר
  choice: అప్పుడు హన్నా ఇలా జవాబిచ్చింది
  rationale: హీబ్రూ కథన సూత్రంలోని రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగు వాక్యంగా వ్యక్తం చేస్తుంది; సందర్భంలోని ప్రతిస్పందనను స్పష్టంగా ఉంచుతుంది.
- source_word: לֹא אֲדֹנִי
  choice: లేదు, అయ్యా
  rationale: ఇక్కడ אֲדֹנִי దేవుని బిరుదు కాదు; ఏలీని గౌరవంగా సంబోధించే మాట. ‘అయ్యా’ ఆధునిక తెలుగులో సహజమైన గౌరవ సంబోధన.
- source_word: אִשָּׁה קְשַׁת רוּחַ
  choice: ఆత్మలో కలత చెందిన స్త్రీని
  rationale: ఈ పదబంధం మొండితనాన్ని కాక అంతరంగ వేదనను సూచిస్తుంది. ‘ఆత్మలో’ అనేది רוּחַ రూపకాన్ని నిలుపుతూ, ‘కలత చెందిన’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְיַיִן וְשֵׁכָר
  choice: ద్రాక్షారసంగానీ మత్తుపానీయంగానీ
  rationale: יַיִן మరియు שֵׁכָר మధ్యనున్న భేదాన్ని నిలుపుతుంది. שֵׁכָרను నిర్దిష్టంగా ఒక పురాతన పానీయంగా పరిమితం చేయకుండా సాధారణ మత్తుపానీయంగా అనువదిస్తుంది.
- source_word: לֹא שָׁתִיתִי
  choice: తాగలేదు
  rationale: హీబ్రూ సంపూర్ణ క్రియను సందర్భానుకూలమైన తెలుగు భూతకాల నిరాకరణతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  choice: నా ప్రాణాన్ని కుమ్మరించాను
  rationale: తీవ్రమైన ప్రార్థనలో తన అంతరంగాన్ని పూర్తిగా దేవుని ఎదుట వెల్లడించడాన్ని సూచించే హీబ్రూ రూపకాన్ని నిలుపుతుంది; ‘హృదయం’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי యొక్క దేవుని సమక్షం అనే భావాన్ని సహజంగా అందిస్తూ, יהוה అనే వ్యక్తిగత దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలుపుతుంది.
- issue: נפשׁను ప్రార్థనా సందర్భంలో వ్యక్తీకరించడం
  choice: నా ప్రాణాన్ని కుమ్మరించాను
  alternative: నా హృదయాన్ని కుమ్మరించాను / నా అంతరంగాన్ని వెల్లడించాను
  rationale: హీబ్రూ రూపకాన్నీ దాని వేదాంతపరమైన విస్తృతినీ నిలుపుతూ, ‘ప్రాణం’ను కేవలం భావోద్వేగం లేదా హృదయానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలిని వాడాం. హీబ్రూ అంతరంగ రూపకాలైన ‘ఆత్మలో’ మరియు ‘ప్రాణాన్ని కుమ్మరించాను’ అనేవి సాధ్యమైనంతవరకు నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
