  edition: WLC
  text: וַֽ/יִּשְׁחֲט֖וּ אֶת הַ/פָּ֑ר וַ/יָּבִ֥יאוּ אֶת הַ/נַּ֖עַר אֶל עֵלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/025.yaml
  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
translation:
  language: te
  text: అప్పుడు వారు ఆ ఎద్దును వధించి[a], బాలుణ్ణి[b] ఏలీ దగ్గరకు తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చంపి.’ హీబ్రూ క్రియను మరింత సాధారణంగా అనువదించవచ్చు; అయితే బలి సందర్భాన్ని ‘వధించి’ మెరుగ్గా ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పిల్లవాణ్ణి.’ హీబ్రూ నַעַר (నఅర్) అనే పదం సందర్భానుసారం బాలుణ్ణి, పిల్లవాణ్ణి లేదా యువకుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: అప్పుడు వారు ... వధించి
  rationale: ఈ వయ్యిక్తోల్ రూపం కథన క్రమాన్ని ముందుకు నడిపిస్తుంది. బలి సందర్భానికి సాధారణమైన ‘చంపి’ కంటే ‘వధించి’ మరింత తగినది.
- source_word: הַפָּר
  choice: ఆ ఎద్దును
  rationale: פַּר సాధారణంగా, ముఖ్యంగా బలి సందర్భాల్లో, మగ పశువైన ఎద్దును సూచిస్తుంది. నిర్దిష్ట ఉపపదాన్ని తెలుగులో సహజంగా ‘ఆ’తో వ్యక్తం చేశాం.
- source_word: וַיָּבִיאוּ
  choice: తీసుకొచ్చారు
  rationale: ఇది కథనంలోని తదుపరి చర్యను తెలియజేస్తుంది. ఏలీ ఉన్న చోటుకు బాలుణ్ణి తీసుకురావడాన్ని ఆధునిక తెలుగులో ‘తీసుకొచ్చారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַנַּעַר
  choice: బాలుణ్ణి
  rationale: נַעַר అనే పదం బాలుడు, పిల్లవాడు, యువకుడు అనే అర్థపరిధిని కలిగి ఉంది. ఇక్కడ సమూయేలు చిన్నవాడైనందున ‘బాలుడు’ సందర్భానికి సరిపోతుంది.
- source_word: אֶל עֵלִי
  choice: ఏలీ దగ్గరకు
  rationale: אֶל ఒక వ్యక్తివైపు లేదా అతని వద్దకు కదలికను సూచిస్తుంది. ‘ఏలీ దగ్గరకు’ ఆధునిక తెలుగులో సహజమైన దిశార్థక ప్రయోగం.
theological_decisions:
- issue: వధించడంలోని బలి భావం
  choice: బలి సందర్భాన్ని సూచించేలా ‘వధించి’ అని అనువదించడం
  alternative: మరింత సాధారణంగా ‘చంపి’ అని అనువదించడం
  rationale: సమీప సందర్భం షిలోహులోని ఆరాధన, అర్పణలకు సంబంధించినది. మూలపాఠ్యంలో లేని వివరణను చేర్చకుండా ‘వధించి’ అనే పదం ఆ బలి నేపథ్యాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘వధించి’ బలి నేపథ్యాన్ని నిలుపుతుండగా, ‘బాలుడు’ సమూయేలు వయస్సుకు తగిన సాధారణ పదంగా ఉంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
