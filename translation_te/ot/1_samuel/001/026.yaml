  text: וַ/תֹּ֨אמֶר֙ בִּ֣י אֲדֹנִ֔/י חֵ֥י נַפְשְׁ/ךָ֖ אֲדֹנִ֑/י אֲנִ֣י הָ/אִשָּׁ֗ה הַ/נִּצֶּ֤בֶת עִמְּ/כָה֙ בָּ/זֶ֔ה לְ/הִתְפַּלֵּ֖ל אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/026.yaml
  text: And she said[a], “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you, praying to Yahweh.
translation:
  language: te
  text: 'అప్పుడు ఆమె ఇలా చెప్పింది: “దయచేసి, నా ప్రభూ, మీ ప్రాణం తోడు, నా ప్రభూ, ఇక్కడ మీ పక్కన నిలబడి యహ్వేకు ప్రార్థిస్తూ ఉన్న ఆ స్త్రీ నేనే.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי
  choice: దయచేసి వినండి
  rationale: ప్రత్యక్ష సంబోధనలో ఇది వినయపూర్వకమైన మనవి సూచించే అవ్యయం. తెలుగులో సహజంగా ఆ గౌరవపూర్వక విజ్ఞప్తిని వ్యక్తం చేస్తుంది.
- source_word: אֲדֹנִי
  choice: నా ప్రభూ
  rationale: ఇది ఏలీని గౌరవంగా సంబోధించే పదం, దేవుని బిరుదు కాదు. ‘నా ప్రభూ’ మూలంలోని సామాజిక గౌరవాన్ని నిలుపుతుంది.
- source_word: חֵי נַפְשְׁךָ
  choice: మీ ప్రాణం తోడు
  rationale: సంబోధించబడిన వ్యక్తి జీవాన్ని సాక్షిగా పెట్టి చెప్పే ప్రమాణ సూత్రం. ఈ తెలుగు నుడికారం దాని గంభీరమైన హామీ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הָאִשָּׁה
  choice: స్త్రీని
  rationale: ఏలీ ఇంతకుముందు చూసిన నిర్దిష్ట స్త్రీగా హన్నా తనను గుర్తుచేస్తోంది.
- source_word: הַנִּצֶּבֶת
  choice: నిలబడి
  rationale: కృదంత రూపం అప్పటి ఆమె భంగిమను, అక్కడ కొనసాగిన ఉనికిని సూచిస్తుంది; తెలుగు సంయుక్త క్రియ నిర్మాణంలో ‘నిలబడి’ సహజం.
- source_word: עִמְּכָה
  choice: మీ పక్కన
  rationale: ఈ సందర్భంలో సహవాసం కంటే సమీప స్థానాన్ని సూచిస్తుంది.
- source_word: בָּזֶה
  choice: ఇక్కడ
  rationale: గత సంఘటన జరిగిన ప్రదేశాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: לְהִתְפַּלֵּל
  choice: ప్రార్థించిన
  rationale: ఆమె అక్కడ నిలబడిన ఉద్దేశం/కార్యాన్ని తెలుగులో సహజమైన సంబంధ విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన వ్యక్తినామ రూపంతో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో పరిచితమైన నామరూపాన్ని ఉపయోగించడం మూలభేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక, గంభీరమైన సంభాషణ శైలి. మూలంలోని రెండుసార్ల సంబోధనను నిలిపి, ప్రమాణ నుడికారాన్ని పాదటిప్పణితో స్పష్టం చేశాం.
