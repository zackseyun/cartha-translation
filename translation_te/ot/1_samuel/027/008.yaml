translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర కథన శైలిని వాడాం. ప్రజానామాలను అనువదించకుండా తెలుగు లిపిలో ఇచ్చాం. దాడుల పునరావృత భావాన్ని ‘చేసేవారు’ ద్వారా వ్యక్తం చేశాం.
