  text: וַ/יַּ֤עַל דָּוִד֙ וַֽ/אֲנָשָׁ֔י/ו וַֽ/יִּפְשְׁט֛וּ אֶל הַ/גְּשׁוּרִ֥י ו/ה/גרזי וְ/הָ/עֲמָלֵקִ֑י כִּ֣י הֵ֜נָּה יֹשְׁב֤וֹת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר מֵֽ/עוֹלָ֔ם בּוֹאֲ/ךָ֥ שׁ֖וּרָ/ה וְ/עַד אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
translation:
  language: te
  text: దావీదు అతని మనుషులతో కలిసి పైకి వెళ్లి, గెషూరీయుల మీద, గిర్జీయుల[a] మీద, అమాలేకీయుల మీద దాడులు చేశారు. ఎందుకంటే షూరు వైపునకు వెళ్లే చోటు నుండి ఐగుప్తు దేశం వరకు ఉన్న దేశంలో పూర్వకాలం నుంచే నివసించేవారు వీరే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ ప్రజానామాన్ని “గెజ్రీయులు” అని కూడా చదువుతారు. ఇక్కడి హెబ్రీ పదరూపం, దాని లిప్యంతరీకరణ అనిశ్చితంగా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వెళ్లి
  rationale: עלה అనే హెబ్రీ క్రియకు కథన సందర్భంలో సాధారణంగా ‘పైకి వెళ్లడం’ అనే అర్థం ఉంది. కేవలం ‘బయలుదేరి’ అని అనువదిస్తే మూలంలోని దిశాసూచన కనుమరుగవుతుంది.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: మీద దాడులు చేసేవారు
  rationale: సైనిక సందర్భంలో פשט దోపిడీ దాడి చేయడాన్ని సూచిస్తుంది. చుట్టుపక్కల ప్రజలపై దావీదు బృందం పదేపదే చేసిన చర్యను తెలుగులో సహజంగా తెలియజేయడానికి ‘దాడులు చేసేవారు’ అని ఇచ్చాం.
- source_word: הַגְּשׁוּרִי
  choice: గెషూరీయులు
  rationale: ప్రజావర్గాన్ని సూచించే హెబ్రీ పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הגרזי
  choice: గిర్జీయులు
  rationale: ఇచ్చిన హల్లుల పాఠరూపం גרזי కి దగ్గరగా ఉండే ప్రజానామంగా ‘గిర్జీయులు’ ఎంచుకున్నాం; పాఠ, ఉచ్చారణ సంప్రదాయాల్లోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: הָעֲמָלֵקִי
  choice: అమాలేకీయులు
  rationale: అమాలేకుకు చెందిన ప్రజావర్గానికి తెలుగులో సుపరిచితమైన రూపాన్ని వాడాం.
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ אֲשֶׁר מֵעוֹלָם
  choice: పూర్వకాలం నుంచి ... ఉన్న ప్రాంతంలో నివసించినవారు వీరే
  rationale: מֵעוֹלָם ఇక్కడ నిత్యత్వాన్ని కాక ప్రాచీన కాలం నుంచి కొనసాగిన నివాసాన్ని సూచిస్తుంది. הֵנָּה లోని నిర్దేశక భావాన్ని ‘వీరే’ ద్వారా నిలిపాం.
- source_word: בּוֹאֲךָ שׁוּרָה וְעַד אֶרֶץ מִצְרָיִם
  choice: షూరుకు వెళ్లే దారి మొదలుకొని ఐగుప్తు దేశం వరకు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న హెబ్రీ భౌగోళిక నుడికారాన్ని తెలుగులో సహజమైన మార్గ-సరిహద్దు వ్యక్తీకరణగా ఇచ్చాం; నిర్మాణంలోని స్వల్ప అనిశ్చితిని పాదసూచికలో సూచించాం.
