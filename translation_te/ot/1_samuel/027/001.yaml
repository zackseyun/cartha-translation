source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל לִבּ֔/וֹ עַתָּ֛ה אֶסָּפֶ֥ה יוֹם אֶחָ֖ד בְּ/יַד שָׁא֑וּל אֵֽין לִ֨/י ט֜וֹב כִּ֣י הִמָּלֵ֥ט אִמָּלֵ֣ט אֶל אֶ֣רֶץ פְּלִשְׁתִּ֗ים וְ/נוֹאַ֨שׁ מִמֶּ֤/נִּי שָׁאוּל֙ לְ/בַקְשֵׁ֤/נִי עוֹד֙ בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֔ל וְ/נִמְלַטְתִּ֖י מִ/יָּדֽ/וֹ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/001.yaml
  text: Then David said in his heart[a], “Now I will one day perish by the hand of Saul. There is nothing better for me than that I should surely escape to the land of the Philistines. Then Saul will despair of seeking me any longer in all the territory of Israel[c][b], and I will escape from his hand.”
translation:
  language: te
  text: 'అప్పుడు దావీదు తన మనసులో ఇలా అనుకున్నాడు: “ఏదో ఒక రోజు నేను సౌలు చేతిలో నశించిపోతాను.[a] ఫిలిష్తీయుల దేశానికి తప్పించుకొని వెళ్లడంకంటే నాకు మేలు మరొకటి లేదు.[b] అప్పుడు ఇశ్రాయేలు ప్రాంతమంతటా నన్ను ఇక వెదకడం సౌలు మానుకుంటాడు.[c] నేను అతని చేతినుంచి తప్పించుకుంటాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నశించిపోతాను” అని అనువదించిన హీబ్రూ క్రియకు “కొట్టుకుపోతాను” లేదా “తుడిచిపెట్టుకుపోతాను” అనే మరింత చిత్రాత్మక భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో “తప్పించుకోవడం—నేను తప్పించుకుంటాను” అనే బలపరిచే నిర్మాణం ఉంది; భావం: “నేను తప్పక తప్పించుకొని వెళ్లతాను.”'
    reason: source_idiom
  - marker: c
    text: లేదా “నన్ను ఇక వెదకగలననే ఆశను సౌలు వదులుకుంటాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־לִבּוֹ
  choice: తన మనసులో ఇలా అనుకున్నాడు
  rationale: అంతరంగంలో తనతో తాను చెప్పుకోవడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶסָּפֶה
  choice: నశించిపోతాను
  rationale: నిఫాల్ రూపంలోని ‘కొట్టుకుపోవడం/తుడిచిపెట్టుకుపోవడం’ లేదా ‘నశించడం’ అనే భావాల్లో, సౌలు చేతిలో మరణించే ప్రమాదాన్ని తెలుగులో స్పష్టంగా తెలిపే పదం.
- source_word: יוֹם אֶחָד
  choice: ఏదో ఒక రోజు
  rationale: భవిష్యత్తులో ఎప్పుడో ఒక రోజును సూచించే హీబ్రూ కాలనుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: בְּיַד שָׁאוּל
  choice: సౌలు చేతిలో
  rationale: సౌలు అధికారానికి లేదా చర్యకు చిక్కి నశించడాన్ని సూచించే ‘చేతిలో’ అనే మూలభాషా రూపకాన్ని నిలుపుతుంది.
- source_word: אֵין לִי טוֹב כִּי
  choice: …వెళ్లడమే నాకు మేలైన మార్గం
  rationale: ‘దీనికంటే నాకు మేలైనది లేదు’ అనే తులనాత్మక భావాన్ని సాధారణ పాఠకులకు సహజంగా వినిపించే తెలుగులో అందిస్తుంది.
- source_word: הִמָּלֵט אִמָּלֵט
  choice: తప్పించుకొని వెళ్లడమే
  rationale: తప్పించుకోవడాన్ని బలపరిచే infinitive absolute నిర్మాణం తెలుగులో పదేపదే అనిపించకుండా ప్రధాన భావంలో సహజంగా ఇవ్వబడింది; దాని ప్రత్యేక బలాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల దేశానికి
  rationale: భౌగోళిక పదబంధాన్ని మూలానికి దగ్గరగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: וְנוֹאַשׁ מִמֶּנִּי שָׁאוּל לְבַקְשֵׁנִי עוֹד
  choice: నన్ను ఇక వెదకడం సౌలు మానుకుంటాడు
  rationale: యאשׁ యొక్క ‘ఆశ వదులుకోవడం/ప్రయత్నం విరమించడం’ అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ప్రత్యామ్నాయ నుడికారాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రాంతమంతటా
  rationale: גְּבוּל ఇక్కడ కేవలం సరిహద్దు రేఖను కాక దేశపు మొత్తం ప్రాంతాన్ని సూచిస్తుంది.
- source_word: וְנִמְלַטְתִּי מִיָּדוֹ
  choice: నేను అతని చేతినుంచి తప్పించుకుంటాను
  rationale: తప్పించుకునే భావాన్నీ, సౌలు పట్టు లేదా అధికారాన్ని సూచించే ‘చేతి’ రూపకాన్నీ నిలుపుతుంది.
