  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִסְפַּ֣ר הַ/יָּמִ֔ים אֲשֶׁר יָשַׁ֥ב דָּוִ֖ד בִּ/שְׂדֵ֣ה פְלִשְׁתִּ֑ים יָמִ֖ים וְ/אַרְבָּעָ֥ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/007.yaml
  text: The number of days that David lived in the territory of the Philistines was a year and four months[a].
translation:
  language: te
  text: దావీదు ఫిలిష్తీయుల దేశంలో నివసించిన కాలం ఒక సంవత్సరం నాలుగు నెలలు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “దినాలు, నాలుగు నెలలు.” వ్యవధిని తెలిపే ఈ ప్రయోగంలో “దినాలు” అంటే “ఒక సంవత్సరం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים
  choice: కాలం
  rationale: ఈ వ్యవధి సారాంశంలో హెబ్రీ వాక్యనిర్మాణాన్ని పదక్షరంగా అనుసరించిన ‘దినాల సంఖ్య’ కంటే, దాని భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘కాలం’ అని వ్యక్తం చేయడం స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר יָשַׁב
  choice: నివసించిన
  rationale: ఇక్కడ ישב అంటే అక్షరార్థంగా ‘కూర్చున్న’ అని కాక, కొంతకాలం ఒక ప్రాంతంలో ఉండి జీవించడం; ‘నివసించిన’ ఈ భావాన్ని గౌరవప్రదంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల దేశంలో
  rationale: שׂדה ఇక్కడ ఒక పొలాన్ని సూచించదు; ఫిలిష్తీయుల అధీనంలోని భూభాగం లేదా దేశాన్ని సూచిస్తుంది. ‘దేశంలో’ సాధారణ పాఠకులకు సహజమైన భౌగోళిక వ్యక్తీకరణ.
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  choice: ఒక సంవత్సరం నాలుగు నెలలు
  rationale: వ్యవధిని తెలిపే ఈ హెబ్రీ ప్రయోగంలో יָמִים (‘దినాలు’) ‘ఒక సంవత్సరం’ అనే నానుడి భావాన్ని కలిగి ఉంది; దానిని ప్రధాన పాఠ్యంలో స్పష్టంగా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని వ్యవధి నానుడిని భావస్పష్టతతో అనువదించి, దాని అక్షరరూపాన్ని పాదసూచికలో ఉంచాం.
