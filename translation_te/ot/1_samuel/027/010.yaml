id: 1SA.27.10
reference: 1 Samuel 27:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אָכִ֔ישׁ אַל פְּשַׁטְתֶּ֖ם הַ/יּ֑וֹם וַ/יֹּ֣אמֶר דָּוִ֗ד עַל נֶ֤גֶב יְהוּדָה֙ וְ/עַל נֶ֣גֶב הַ/יַּרְחְמְאֵלִ֔י וְ/אֶל נֶ֖גֶב הַ/קֵּינִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
translation:
  language: te
  text: అప్పుడు ఆకీషు, “ఈ రోజు మీరు ఎక్కడ దాడి చేశారు?” అని అడిగాడు.[a] దావీదు, “యూదా నెగెబు ప్రాంతం మీద,[b] యెరహ్మెయేలీయుల నెగెబు ప్రాంతం మీద, కేనీయుల నెగెబు ప్రాంతం మీద” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠాన్ని అక్షరార్థంగా చదివితే, “ఈ రోజు మీరు దాడి చేయలేదా?” అన్నట్టుగా ఉంటుంది. అయితే సందర్భంలో భావం, “ఈ రోజు మీరు ఎక్కడ దాడి చేశారు?” అనే ప్రశ్న.
    reason: textual_variant
  - marker: b
    text: లేదా “యూదా దక్షిణ ప్రాంతం మీద, యెరహ్మెయేలీయుల దక్షిణ ప్రాంతం మీద, కేనీయుల దక్షిణ ప్రాంతం మీద.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  choice: ఈ రోజు మీరు ఎక్కడ దాడి చేశారు?
  rationale: వ్యంజన పాఠంలోని אַל సాధారణంగా ‘కాదు/వద్దు’ అనే అర్థమిస్తుంది; అయితే సందర్భం, కథనం ముందుకు సాగే తీరు దీనిని దావీదు ఎక్కడ దాడి చేశాడని ఆకీషు అడిగిన ప్రశ్నగా సూచిస్తున్నాయి. פּשט ఇక్కడ దోపిడీ దాడి చేయడాన్ని సూచిస్తుంది; ‘దాడి చేశారు’ సహజమైన ఆధునిక తెలుగు.
- source_word: נֶגֶב
  choice: నెగెబు ప్రాంతం
  rationale: ఈ పదం ‘దక్షిణం/దక్షిణ ప్రాంతం’ అని కూడా అర్థమివ్వగలదు; ఇక్కడ పేరుపొందిన సమూహాల ప్రాంతాలతో మూడుసార్లు రావడం వల్ల భౌగోళిక నెగెబును సూచించేలా ‘నెగెబు ప్రాంతం’ అని అనువదించాం.
- source_word: עַל
  choice: మీద
  rationale: దావీదు చెప్పిన దాడి లక్ష్యాలను సూచిస్తున్నందున శత్రుత్వ చర్య భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: గోత్రం, భూభాగం రెండింటికీ వాడే ప్రామాణిక తెలుగు నామరూపం.
- source_word: הַיַּרְחְמְאֵלִי
  choice: యెరహ్మెయేలీయులు
  rationale: యెరహ్మెయేలు వంశానికి లేదా సమూహానికి చెందిన ప్రజలను సూచించే జాతివాచక రూపం.
- source_word: הַקֵּינִי
  choice: కేనీయులు
  rationale: కేనీయుల ప్రజాసమూహాన్ని సూచించే జాతివాచక రూపం.
- source_word: וַיֹּאמֶר
  choice: అడిగాడు / చెప్పాడు
  rationale: హీబ్రూ క్రియ సాధారణంగా ‘అన్నాడు’ అని అర్థమిస్తుంది. ఆధునిక తెలుగులో సంభాషణ పాత్రలను స్పష్టంగా చూపడానికి ఆకీషు ప్రశ్నకు ‘అడిగాడు,’ దావీదు జవాబుకు ‘చెప్పాడు’ అని సందర్భానుసారంగా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: సామాన్య పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగును, గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘నెగెబు’ అనే భౌగోళిక పేరును నిలుపుతూ స్పష్టత కోసం ‘ప్రాంతం’ చేర్చాం; దాని ‘దక్షిణ ప్రాంతం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
