translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ నుడికారంలోని అర్థాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి, దాని అక్షర రూపకాన్ని పాదసూచికలో నిలిపాం.
