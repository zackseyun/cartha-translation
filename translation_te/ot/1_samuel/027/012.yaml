  text: וַ/יַּאֲמֵ֥ן אָכִ֖ישׁ בְּ/דָוִ֣ד לֵ/אמֹ֑ר הַבְאֵ֤שׁ הִבְאִישׁ֙ בְּ/עַמּ֣/וֹ בְ/יִשְׂרָאֵ֔ל וְ/הָ֥יָה לִ֖/י לְ/עֶ֥בֶד עוֹלָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/012.yaml
  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
translation:
  language: te
  text: 'ఆకీషు దావీదును నమ్మి ఇలా అన్నాడు: “అతడు తన ప్రజలైన ఇశ్రాయేలీయుల మధ్య తనను తాను పూర్తిగా అసహ్యుడిగా చేసుకున్నాడు[a]; కాబట్టి అతడు ఎప్పటికీ నాకు సేవకుడిగా[b] ఉంటాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తనను తాను పూర్తిగా అసహ్యుడిగా చేసుకున్నాడు’ అని అనువదించిన హీబ్రూ నుడికారం అక్షరార్థంగా ‘తన ప్రజల మధ్య తనను తాను దుర్వాసనగా చేసుకున్నాడు’ అని ఉంటుంది. ఇది తన ప్రజలకు అసహ్యకరుడవడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సేవకుడు’ అనే పదాన్ని ‘దాసుడు’ అని కూడా అనువదించవచ్చు. ఇక్కడ ఆకీషుకు దావీదు నిరంతరం చేసే రాజకీయ లేదా ఆస్థాన సేవ భావం ప్రధానంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן אָכִישׁ בְּדָוִד
  choice: ఆకీషు దావీదును నమ్మి
  rationale: אמן హిఫీల్ రూపం ב ఉపసర్గతో ఒక వ్యక్తిపై నమ్మకం ఉంచడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దావీదును నమ్మి’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: לֵאמֹר
  choice: అని అనుకున్నాడు
  rationale: ఇది సాధారణంగా మాటను లేదా భావాన్ని పరిచయం చేసే రూపం. సందర్భంలో ఆకీషు తనలో తాను చేసుకున్న నిర్ధారణగా ఉండగలదు; అందువల్ల ‘అని అనుకున్నాడు’ సహజంగా ఉంది, అయితే ‘అని చెప్పుకున్నాడు’ కూడా సాధ్యం.
- source_word: הַבְאֵשׁ הִבְאִישׁ
  choice: పూర్తిగా అసహ్యుడయ్యాడు
  rationale: అనంత క్రియారూపం మరియు సమాపక క్రియ కలిసి తీవ్రతను తెలియజేస్తాయి. మూలంలోని ‘దుర్వాసన కొట్టేలా చేసుకున్నాడు’ అనే రూపకం సామాజికంగా అసహ్యుడవడం అనే నుడికారాన్ని వ్యక్తం చేస్తుంది; తెలుగులో అర్థస్పష్టత కోసం సహజ నుడికారాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: בְּעַמּוֹ בְיִשְׂרָאֵל
  choice: ఇశ్రాయేలులోని తన ప్రజలకు
  rationale: בְּעַמּוֹ సంబంధిత ప్రజల దృష్టిలో లేదా వారి మధ్య అనే భావాన్ని ఇస్తుంది; בְיִשְׂרָאֵל ఆ ప్రజలను ఇశ్రాయేలుతో నిర్దిష్టం చేస్తుంది. తెలుగులో ‘ఇశ్రాయేలులోని తన ప్రజలకు’ సహజమైన నిర్మాణం.
- source_word: וְהָיָה לִי לְעֶבֶד
  choice: కాబట్టి అతడు ... నాకు సేవకుడిగా ఉంటాడు
  rationale: וְ ఇక్కడ ఆకీషు తీసుకున్న ఫలితనిర్ణయాన్ని సూచిస్తుంది. עֶבֶדకు ‘దాసుడు’ అనే అర్థం సాధ్యమైనా, ఈ సందర్భంలో ఆకీషుపై దావీదు శాశ్వతంగా ఆధారపడి సేవ చేస్తాడనే రాజకీయ/ఆస్థాన భావం ముందుంటుంది.
- source_word: עוֹלָם
  choice: ఎప్పటికీ
  rationale: దీర్ఘకాలంగా, అంతం కనిపించని కాలం వరకు కొనసాగుతుందనే ఆకీషు అంచనాను తెలుగులో ‘ఎప్పటికీ’ స్పష్టంగా వ్యక్తం చేస్తుంది.
