revisions:
- from: ఆకీషు దావీదును నమ్మి, “అతడు ఇశ్రాయేలులోని తన ప్రజలకు పూర్తిగా అసహ్యుడయ్యాడు; కాబట్టి అతడు ఎప్పటికీ నాకు సేవకుడిగా ఉంటాడు” అని అనుకున్నాడు.[a]
  to: 'ఆకీషు దావీదును నమ్మి ఇలా అన్నాడు: “అతడు తన ప్రజలైన ఇశ్రాయేలీయుల మధ్య తనను తాను పూర్తిగా అసహ్యుడిగా చేసుకున్నాడు[a]; కాబట్టి అతడు ఎప్పటికీ నాకు సేవకుడిగా[b] ఉంటాడు.”'
