id: 1SA.27.9
reference: 1 Samuel 27:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִכָּ֤ה דָוִד֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א יְחַיֶּ֖ה אִ֣ישׁ וְ/אִשָּׁ֑ה וְ/לָקַח֩ צֹ֨אן וּ/בָקָ֜ר וַ/חֲמֹרִ֤ים וּ/גְמַלִּים֙ וּ/בְגָדִ֔ים וַ/יָּ֖שָׁב וַ/יָּבֹ֥א אֶל אָכִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
translation:
  language: te
  text: దావీదు ఆ ప్రాంతంపై దాడిచేసి, పురుషుణ్ణిగానీ స్త్రీనిగానీ ప్రాణాలతో విడిచిపెట్టలేదు[a]. అతడు గొర్రెలను, పశువులను, గాడిదలను, ఒంటెలను, వస్త్రాలను తీసుకున్నాడు. తరువాత అతడు తిరిగి ఆకీషు దగ్గరికి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పురుషుణ్ణిగానీ స్త్రీనిగానీ బతకనివ్వలేదు.”
    reason: חיה హిఫీల్ రూపంలోని ‘బతకనివ్వు/ప్రాణాలతో ఉంచు’ అనే సమీప ప్రత్యామ్నాయాన్ని చూపించడానికి.
lexical_decisions:
- source_word: וְהִכָּה
  choice: దాడిచేసి
  rationale: נכה హిఫీల్ రూపం ఇక్కడ ఒక ప్రాంతంపై సైనిక దాడిని సూచిస్తుంది. ‘దాడిచేసి’ అనేది సందర్భానికి సహజంగా సరిపోతూ, మూలంలో లేని వివరాలను జోడించదు.
- source_word: הָאָרֶץ
  choice: ఆ ప్రాంతంపై
  rationale: אֶרֶץ ఇక్కడ భూమి మొత్తాన్ని కాకుండా దాడికి గురైన వారి ప్రాంతాన్ని సూచిస్తుంది. తెలుగులో ‘ఆ ప్రాంతంపై’ సందర్భార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  choice: పురుషుణ్ణిగానీ స్త్రీనిగానీ ప్రాణాలతో విడిచిపెట్టలేదు
  rationale: חיה హిఫీల్ రూపానికి ‘బతకనివ్వు/ప్రాణాలతో ఉంచు’ అనే భావం ఉంది. ఈ పదబంధం హింసను మృదువుచేయకుండా, పురుషుడు–స్త్రీ అనే మూలంలోని జంటను నిలుపుతుంది.
- source_word: וְלָקַח
  choice: తీసుకున్నాడు
  rationale: לקח యొక్క సాధారణ అర్థం ‘తీసుకొను.’ దోపిడీ సందర్భం వాక్యంతోనే స్పష్టమవుతుంది కాబట్టి మరింత బలమైన భావాన్ని అనవసరంగా చేర్చలేదు.
- source_word: צֹאן
  choice: గొర్రెలను
  rationale: צֹאן చిన్న పశువుల మందను సమష్టిగా సూచించగలదు; జాబితాలో స్పష్టమైన, సాధారణ తెలుగు పదంగా ‘గొర్రెలు’ ఎంచుకోబడింది.
- source_word: וּבָקָר
  choice: పశువులను
  rationale: בקר గోవుల జాతికి చెందిన పశుసంపదను సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘పశువులు’ సహజమైన సమష్టి పదం.
- source_word: וַחֲמֹרִים
  choice: గాడిదలను
  rationale: ఇది మూలపదానికి నేరమైన, ఆధునిక తెలుగు సమానార్థకం.
- source_word: וּגְמַלִּים
  choice: ఒంటెలను
  rationale: ఇది మూలపదానికి నేరమైన తెలుగు సమానార్థకం.
- source_word: וּבְגָדִים
  choice: వస్త్రాలను
  rationale: בְּגָדִים దుస్తులు లేదా వస్త్రాలను సూచిస్తుంది. దోచుకున్న వస్తువుల జాబితాలో ‘వస్త్రాలు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: וַיָּשָׁב וַיָּבֹא
  choice: తరువాత అతడు తిరిగి ... దగ్గరికి వచ్చాడు
  rationale: మూలంలోని ‘తిరిగాడు’ మరియు ‘వచ్చాడు’ అనే రెండు వరుస క్రియల కథన గమనాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אָכִישׁ
  choice: ఆకీషు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: హింసాత్మక చర్యను మృదువుచేయకుండా లేదా అతిశయింపజేయకుండా అనువదించడం
  choice: దావీదు పురుషుణ్ణిగానీ స్త్రీనిగానీ ప్రాణాలతో విడిచిపెట్టలేదని సూటిగా తెలిపింది.
  alternative: హత్యను మరుగుపరిచే మృదువైన పదప్రయోగం; లేదా మూలంలో లేని విధంగా ‘ఊచకోత’ వంటి అతిశయ పదప్రయోగం.
  rationale: వచనం నైతికంగా కఠినమైన సంఘటనను నిరాడంబరంగా వివరిస్తుంది. అనువాదం దానిని సమర్థించకూడదు, మృదువుచేయకూడదు, సంచలనాత్మకంగానూ మార్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యలు, లింగ-నిర్దిష్ట జంట, కఠినమైన హింసా వివరణ నిలుపబడ్డాయి.
