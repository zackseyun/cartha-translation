source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ דָּוִ֨ד עִם אָכִ֥ישׁ בְּ/גַ֛ת ה֥וּא וַ/אֲנָשָׁ֖י/ו אִ֣ישׁ וּ/בֵית֑/וֹ דָּוִד֙ וּ/שְׁתֵּ֣י נָשָׁ֔י/ו אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית וַ/אֲבִיגַ֥יִל אֵֽשֶׁת נָבָ֖ל הַֽ/כַּרְמְלִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
translation:
  language: te
  text: దావీదు గాతులో ఆకీషుతో నివసించాడు[a]; అతడూ అతని మనుషులూ ప్రతి ఒక్కరూ తమ తమ ఇంటివారితో ఉన్నారు[b]—దావీదు తన ఇద్దరు భార్యలైన యిజ్రెయేలీయురాలు అహీనోయము, నాబాలు భార్య అయిన కర్మెలీయురాలు అబీగయీలుతో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఉండిపోయాడు’ లేదా ‘కొంతకాలం ఉన్నాడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ నివసించడాన్నీ, కొంతకాలం ఉండడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ప్రతి మనిషి మరియు అతని ఇల్లు.’ ఇక్కడ ఇది ప్రతి మనిషి తన ఇంటివారితో ఉన్నాడనే పంపిణీ భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישב అనే క్రియకు ‘కూర్చున్నాడు,’ ‘నివసించాడు,’ ‘ఉండిపోయాడు’ అనే అర్థాలు రావచ్చు. ఇక్కడ గాతులో కొంతకాలం నివాసముండడమే భావం; శాశ్వతంగా స్థిరపడ్డాడని సూచించకుండా ‘నివసించాడు’ సహజంగా ఉంది.
- source_word: עִם אָכִישׁ בְּגַת
  choice: గాతులో ఆకీషుతో
  rationale: עִם సహవాసాన్ని, בְּ నగరంలో ఉన్న స్థానాన్ని సూచిస్తాయి; తెలుగు వాక్యక్రమంలో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: הוּא וַאֲנָשָׁיו
  choice: అతడూ అతని మనుషులూ
  rationale: అక్షరార్థమైన ‘అతని మనుషులు’ అనే రూపం దావీదు అనుచరులను సూచిస్తూ మూలంలోని సాధారణ పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: אִישׁ וּבֵיתוֹ
  choice: ప్రతి ఒక్కరూ తమ తమ ఇంటివారితో
  rationale: אִישׁ ఇక్కడ విభజనార్థకంగా ‘ప్రతి ఒక్కరూ’ అని, בֵּיתוֹ భవనం కాక అతని ఇంటివారిని సూచిస్తుంది. ‘తమ తమ’ అనే తెలుగు ప్రయోగం పంపిణీ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וּשְׁתֵּי נָשָׁיו
  choice: అతని ఇద్దరు భార్యలు
  rationale: దావీదు ఇంటివారిని ప్రత్యేకంగా వివరించే అనుబంధ వాక్యభాగంగా సరళంగా అనువదించబడింది.
- source_word: הַיִּזְרְעֵאלִית
  choice: యిజ్రెయేలీయురాలైన
  rationale: స్త్రీలింగ ప్రాంతవాచక విశేషణాన్ని తెలుగులో సహజమైన ‘యిజ్రెయేలీయురాలు’ రూపంలో నిలిపింది.
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִית
  choice: కర్మెలీయుడైన నాబాలు భార్య
  rationale: హీబ్రూ పదక్రమం ప్రకారం הַכַּרְמְלִית అబీగయీలును సూచించగలిగినా, సందర్భంలో కర్మెలుతో నాబాలు సంబంధం కూడా తెలిసినది. ప్రధాన పాఠంలో సహజ తెలుగు కోసం నాబాలుకు అనుసంధానించి, వ్యాకరణ సంబంధంలోని సంభావ్య అస్పష్టతను పాదసూచికలో తెలిపింది.
theological_decisions:
- issue: הַכַּרְמְלִית అనే స్త్రీలింగ ప్రాంతవాచక పదం ఎవరిని విశేషిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘కర్మెలీయుడైన నాబాలు’
  alternative: ‘కర్మెలీయురాలైన అబీగయీలు’ లేదా ‘కర్మెలుకు చెందిన నాబాలు భార్య అబీగయీలు’
  rationale: రూపపరంగా ఈ పదం స్త్రీలింగం కనుక అబీగయీలును విశేషిస్తుంది; అయితే తెలుగు సహజ వాక్యనిర్మాణం మరియు కథా సందర్భంలో నాబాలు ‘కర్మెలీయుడు’గా పరిచితుడు. మూలంలోని సంబంధాన్ని పూర్తిగా మూసివేయకుండా పాదసూచికలో అక్షరార్థాన్ని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. ‘ఇంటివారు’ కుటుంబంతో పాటు గృహానికి చెందిన వారిని కూడా కలుపుకొనే విస్తృత భావాన్ని ఇస్తుంది. పేర్లు తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
