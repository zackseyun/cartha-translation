  text: וַ/יִּתֶּן ל֥/וֹ אָכִ֛ישׁ בַּ/יּ֥וֹם הַ/ה֖וּא אֶת צִֽקְלָ֑ג לָ/כֵ֞ן הָיְתָ֤ה צִֽקְלַג֙ לְ/מַלְכֵ֣י יְהוּדָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/006.yaml
  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
translation:
  language: te
  text: ఆ రోజు ఆకీషు అతనికి సిక్లగును ఇచ్చాడు. అందుచేత సిక్లగు ఈ రోజు వరకు యూదా రాజులకు చెందుతూ వచ్చింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: ఇచ్చాడు
  rationale: ఈ కథన సందర్భంలో נתן అనే క్రియకు సహజమైన అర్థం ‘ఇచ్చాడు’; ‘అప్పగించాడు’ లేదా ‘అనుగ్రహించాడు’ అనే భావ ఛాయలను అనవసరంగా చేర్చదు.
- source_word: לּוֹ
  choice: అతనికి
  rationale: మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం సమీప సందర్భంలోని దావీదును సూచిస్తుంది.
- source_word: אָכִישׁ
  choice: ఆకీషు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: కాలాన్ని నిర్దిష్టంగా సూచించే హెబ్రీ జాతీయాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: צִקְלָג
  choice: సిక్లగు
  rationale: స్థల నామాన్ని తెలుగులో సులభంగా చదవగల సంప్రదాయ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: לָכֵן
  choice: అందుచేత
  rationale: ఆకీషు ఇచ్చిన చర్యనుంచి వచ్చిన పరిణామాన్ని సూచించే అనుమానరహిత, గౌరవప్రదమైన అన్వయ పదం.
- source_word: הָיְתָה ... לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజులకు చెందినదిగా ఉంది
  rationale: ‘ఉంది’ అనే సాధారణ క్రియతో కూడిన లామెద్ సంబంధం ఇక్కడ కొనసాగుతున్న రాజాధీనతను సూచిస్తుంది; ‘చెందినదిగా ఉంది’ ఆ భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: కథకుని కాలం వరకు కొనసాగిన స్థితిని సూచించే సహజమైన తెలుగు జాతీయం.
theological_decisions:
- issue: ‘నేటివరకు’ మరియు ‘యూదా రాజులు’ సూచించే చారిత్రక దృక్కోణం
  choice: కథకుని వెనుకచూపు వ్యాఖ్యను ఉన్నట్లే నిలిపి, రచనా కాలం లేదా సంపాదక చరిత్రను వివరించలేదు.
  alternative: ఇది తరువాతి యూదా రాజ్యకాల దృక్కోణమని అనువాదంలోనే విస్తరించి చెప్పడం.
  rationale: హెబ్రీ పాఠ్యం చారిత్రక స్థితిని మాత్రమే చెబుతుంది; రచయితత్వం లేదా సంపాదక ప్రక్రియపై ఏ సిద్ధాంతాన్నీ ప్రధాన పాఠ్యంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు వాక్యాల కారణ–పరిణామ సంబంధం నిలుపబడింది. అనవసర పాదటిప్పణులు చేర్చలేదు; ఆంగ్ల సంప్రదింపు పాఠ్యంలోని గుర్తుల క్రమం మూల హెబ్రీ వాక్యానికి సరిపోకపోవడం వల్ల వాటిని అనుకరించలేదు.
