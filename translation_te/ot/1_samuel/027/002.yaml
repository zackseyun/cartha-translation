translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘లేచి’ అనే హీబ్రూ కథన ప్రయోగం నిలుపబడింది; ‘దాటివెళ్లాడు’ ద్వారా సరిహద్దు లేదా ప్రాంత మార్పు భావం అతిగా వివరణ చేయకుండా వ్యక్తమైంది. వ్యక్తి పేర్లు తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఆకీషు, మావోకు, గాతు అని లిప్యంతరీకరించబడ్డాయి.
