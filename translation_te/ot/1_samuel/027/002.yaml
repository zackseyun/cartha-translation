  text: So David arose and crossed over, he and the six hundred men who were with him, to Achish son of Maoch, king of Gath.
translation:
  language: te
  text: అప్పుడు దావీదు లేచి, తనతో ఉన్న ఆరువందల మంది మనుషులతో కలిసి గాతు రాజైన మావోకు కుమారుడు ఆకీషు వద్దకు దాటి వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ యొక్క కథన రూపం నిర్ణయాత్మక చర్య ఆరంభాన్ని సూచిస్తుంది. తెలుగు కథనశైలిలో ‘లేచి’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וַיַּעֲבֹר
  choice: దాటివెళ్లాడు
  rationale: עבר ఇక్కడ ఒక ప్రాంతం నుంచి మరొక ప్రాంతానికి దాటడాన్ని సూచిస్తుంది. కేవలం ‘వెళ్లాడు’ కంటే ‘దాటివెళ్లాడు’ మూలంలోని దిశాత్మక భావాన్ని కాపాడుతుంది.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר עִמּוֹ
  choice: తనతో ఉన్న ఆరువందల మంది మనుషులతో కలిసి
  rationale: స్వతంత్ర సర్వనామమైన הוּא దావీదును అతని సహచరులతో కలిపి స్పష్టపరుస్తుంది. తెలుగులో ‘తో కలిసి’ అనే నిర్మాణం ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యేకంగా ‘అతడే’ అని బలపరచడం సందర్భానికి అనవసరమైన భారాన్ని కలిగిస్తుంది.
- source_word: אֶל אָכִישׁ
  choice: ఆకీషు దగ్గరికి
  rationale: אֶל వ్యక్తివైపు గమ్యాన్ని సూచిస్తుంది. తెలుగులో ఒక వ్యక్తిని గమ్యంగా చెప్పేటప్పుడు ‘దగ్గరికి’ సహజమైన సమానార్థకం.
- source_word: בֶּן מָעוֹךְ
  choice: మావోకు కుమారుడు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֶלֶךְ גַּת
  choice: గాతు రాజైన
  rationale: ఈ construct chain ఆకీషు యొక్క రాజపదవిని సూచిస్తుంది. ‘గాతు రాజైన’ అనే విశేషణ నిర్మాణం తెలుగులో సహజంగా పేరుతో అనుసంధానమవుతుంది.
