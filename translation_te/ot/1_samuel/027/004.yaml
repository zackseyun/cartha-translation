  text: When it was reported to Saul that David had fled to Gath[b][a], he no longer continued to seek him.
translation:
  language: te
  text: దావీదు గాతుకు పారిపోయాడనే సమాచారం సౌలుకు అందినప్పుడు, సౌలు ఇక దావీదును వెదకడం కొనసాగించలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְשָׁאוּל
  choice: సౌలుకు సమాచారం అందినప్పుడు
  rationale: కర్తను పేర్కొనని హెబ్రీ నిష్క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ఎవరు తెలియజేశారో వచనం చెప్పదు.
- source_word: כִּי בָרַח דָּוִד גַּת
  choice: దావీదు గాతుకు పారిపోయాడనే
  rationale: כִּי నివేదికలోని విషయాన్ని పరిచయం చేస్తుంది; בָרַח పారిపోవడాన్ని సూచిస్తుంది. గాతు గమ్యస్థానంగా ఉన్నందున తెలుగులో ‘గాతుకు’ అని అనువదించబడింది.
- source_word: וְלֹא יֹסֶף עוֹד
  choice: ఇక … కొనసాగించలేదు
  rationale: יסף + עוד అనే హెబ్రీ ప్రయోగం ఒక చర్యను ఇకపై కొనసాగించకపోవడాన్ని సూచిస్తుంది; కేవలం ‘వెదకలేదు’ అనడం కంటే ఈ ఎంపిక ఆ కొనసాగింపు-విరమణ భావాన్ని నిలుపుతుంది.
- source_word: לְבַקְשׁוֹ
  choice: దావీదును వెదకడం
  rationale: בקש యొక్క ప్రాథమిక భావమైన ‘వెదకడం’ను ఉంచుతుంది. ‘వెంబడించడం’ సందర్భానికి సాధ్యమైనా, అది మూలపదం కంటే కొంత ఎక్కువ వ్యాఖ్యానాత్మకం. సర్వనామ అస్పష్టతను నివారించేందుకు తెలుగులో ‘దావీదును’ అని పేరు పునరుక్తి చేయబడింది.
theological_decisions: []
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. మూలంలోని కర్తలేని సమాచార నివేదికను, అలాగే సౌలు ఇక వెదకడాన్ని కొనసాగించలేదనే విరమణ భావాన్ని స్పష్టంగా నిలుపుతుంది.
