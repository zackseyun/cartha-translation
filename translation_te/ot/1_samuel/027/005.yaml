source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ יִתְּנוּ לִ֣/י מָק֗וֹם בְּ/אַחַ֛ת עָרֵ֥י הַ/שָּׂדֶ֖ה וְ/אֵ֣שְׁבָה שָּׁ֑ם וְ/לָ֨/מָּה יֵשֵׁ֧ב עַבְדְּ/ךָ֛ בְּ/עִ֥יר הַ/מַּמְלָכָ֖ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
translation:
  language: te
  text: 'అప్పుడు దావీదు ఆకీషుతో ఇలా అన్నాడు: “నీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే, దయచేసి పల్లెప్రాంతంలోని పట్టణాల్లో ఒకదానిలో నాకు ఒక స్థలం కేటాయించనివ్వు[a]. నేను అక్కడ నివసిస్తాను[b]. నీ సేవకుడు నీతోపాటు రాజనగరంలో ఎందుకు నివసించాలి[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “వారు నాకు ఇవ్వనివ్వు.” ఆకీషు అధికారంలోని వారు దావీదుకు ఒక స్థలం కేటాయించాలనే అభ్యర్థన ఇది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నేను అక్కడ కాపురముంటాను.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా, “రాజ్యపు నగరంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే
  rationale: అంగీకారం లేదా ఆదరణ పొందడాన్ని సూచించే హీబ్రూ నుడికారంలోని ‘నీ దృష్టిలో’ అనే రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: ఇక్కడ ఈ కణం అభ్యర్థనను మర్యాదపూర్వకంగా మృదువుచేస్తుంది; తెలుగులో ‘దయచేసి’ ఆ కార్యాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יִתְּנוּ לִי
  choice: నాకు ... ఇప్పించు
  rationale: మూడవ పురుష బహువచన క్రియ ఆకీషు అధికారంలోని వారు స్థలం ఇవ్వాలనే మర్యాదపూర్వక అభ్యర్థనను సూచిస్తుంది. తెలుగు ప్రయోగంలో causative రూపమైన ‘ఇప్పించు’ ఆకీషు ద్వారా ఆ ఏర్పాటు జరగాలనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מָקוֹם
  choice: ఒక స్థలం
  rationale: మూలంలోని సాధారణ స్థలం లేదా నివాసస్థానం అనే విస్తృత అర్థాన్ని పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  choice: పల్లెప్రాంతంలోని పట్టణాల్లో ఒకదానిలో
  rationale: అక్షరార్థంగా ‘పొలం/బయటిప్రాంతపు పట్టణాల్లో ఒకదానిలో’; రాజనగరానికి విరుద్ధంగా గ్రామీణ లేదా పల్లెప్రాంతంలోని పట్టణాన్ని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: וְאֵשְׁבָה שָּׁם
  choice: నేను అక్కడ నివసిస్తాను
  rationale: ישב ఇక్కడ నివసించడం లేదా కాపురముండడం అనే భావంలో ఉంది. సమన్వయ వాక్య నిర్మాణాన్ని నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: לָמָּה יֵשֵׁב
  choice: ఎందుకు నివసించాలి
  rationale: దావీదు తన అభ్యర్థనకు కారణంగా వేసిన అలంకారప్రశ్నను నేరుగా నిలుపుతుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు
  rationale: రాజసభ సందర్భంలో ఇది బానిసత్వాన్ని ప్రధానంగా సూచించకుండా వినయపూర్వక స్వీయసంబోధనగా పనిచేస్తుంది.
- source_word: בְּעִיר הַמַּמְלָכָה
  choice: రాజనగరంలో
  rationale: అక్షరార్థమైన ‘రాజ్యపు నగరం’ అనే భావాన్ని సహజమైన, సంక్షిప్త తెలుగు పదంతో అందిస్తుంది; ‘రాజధాని’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: עִמָּךְ
  choice: నీతోపాటు
  rationale: ఆకీషుకు సమీపంగా అదే రాజనగరంలో నివసించడాన్ని సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
