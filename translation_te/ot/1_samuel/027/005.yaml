translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రాజసభ సంభాషణ శైలిని ఉపయోగించాం. ‘నీ సేవకుడు’ అనే వినయపూర్వక స్వీయసంబోధనను, ‘నీ దృష్టిలో’ అనే హీబ్రూ రూపకాన్ని నిలిపాం. పల్లెప్రాంతం–రాజనగరం మధ్య ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచాం.
