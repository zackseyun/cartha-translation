    rationale: ఇది భావపరంగా సాధ్యమే అయినా, హీబ్రూ יִתְּנוּ לִי లో ఆకీషు స్వయంగా ఏర్పాటు చేయించాలనే భావం స్పష్టంగా లేదు; అతని ఆధీనంలోని అనిర్దిష్ట వ్యక్తులు దావీదుకు స్థలం ఇవ్వాలనే యుస్సివ్ అభ్యర్థన ఉంది. ‘కేటాయించనివ్వు’ దానికి దగ్గరగా ఉంటుంది.
