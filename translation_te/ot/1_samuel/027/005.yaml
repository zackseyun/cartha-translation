  to: 'అప్పుడు దావీదు ఆకీషుతో ఇలా అన్నాడు: “నీ దృష్టిలో నాకు అనుగ్రహం లభించి ఉంటే, దయచేసి పల్లెప్రాంతంలోని పట్టణాల్లో ఒకదానిలో నాకు ఒక స్థలం కేటాయించనివ్వు[a]. నేను అక్కడ నివసిస్తాను[b]. నీ సేవకుడు నీతోపాటు రాజనగరంలో ఎందుకు నివసించాలి[c]?”'
  rationale: మూలంలోని అనిర్దిష్ట బహువచన యుస్సివ్ అభ్యర్థనను ‘కేటాయించనివ్వు’తో స్పష్టంగా ఉంచాం. ఫుట్‌నోట్ a ను సహజమైన తెలుగులో పునర్రచించి, అదే వ్యాకరణార్థాన్ని వివరించాం. ఇతర పదప్రయోగాలు మూలానికి నమ్మకంగా, ఆధునిక తెలుగులో సహజంగా ఉన్నందున నిలిపాం.
