source:
  edition: WLC
  text: וְ/אִ֨ישׁ וְ/אִשָּׁ֜ה לֹֽא יְחַיֶּ֣ה דָוִ֗ד לְ/הָבִ֥יא גַת֙ לֵ/אמֹ֔ר פֶּן יַגִּ֥דוּ עָלֵ֖י/נוּ לֵ/אמֹ֑ר כֹּֽה עָשָׂ֤ה דָוִד֙ וְ/כֹ֣ה מִשְׁפָּט֔/וֹ כָּל הַ֨/יָּמִ֔ים אֲשֶׁ֥ר יָשַׁ֖ב בִּ/שְׂדֵ֥ה פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
translation:
  language: te
  text: “దావీదు ఇలా చేశాడు; ఫిలిష్తీయుల ప్రాంతంలో అతడు నివసించిన కాలమంతా ఇదే అతని పద్ధతి[a]” అని వారు మన గురించి చెబుతారేమోనని, వారిని గాతుకు తీసుకురాకుండా ఉండేందుకు దావీదు ఏ పురుషుణ్ణీ, ఏ స్త్రీనీ బతికుండనిచ్చేవాడు కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇదే అతని ఆచారం” లేదా “ఇదే అతని వ్యవహార తీరు.”
    reason: מִשְׁפָּטוֹ అనే పదానికి ఈ సందర్భంలో ‘పద్ధతి,’ ‘ఆచారం,’ ‘వ్యవహార తీరు’ అనే సమీప అర్థాలు సాధ్యమైనందున అసలులోని భావవ్యాప్తిని తెలియజేయడం.
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה
  choice: ఏ పురుషుణ్ణీ, ఏ స్త్రీనీ
  rationale: హీబ్రూ ఏకవచన జంటను విభజనార్థకంగా తీసుకొని, ఒక్క పురుషుణ్ణిగానీ ఒక్క స్త్రీనిగానీ మినహాయించలేదనే సంపూర్ణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא יְחַיֶּה
  choice: ప్రాణాలతో విడిచిపెట్టేవాడు కాదు
  rationale: חיה పీయేల్ రూపం ఇక్కడ ‘బతకనివ్వడం, ప్రాణాలతో ఉంచడం’ అనే అర్థం ఇస్తుంది. అసంపూర్ణ క్రియారూపంలోని పునరావృత చర్యను ‘విడిచిపెట్టేవాడు కాదు’ చూపిస్తుంది.
- source_word: לְהָבִיא גַת
  choice: గాతుకు తీసుకురావడానికి
  rationale: లక్ష్యాన్ని సూచించే హీబ్రూ క్రియానామ నిర్మాణాన్ని, గాతు అనే మసొరెటిక్ పాఠంలోని స్థలనామాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: פֶּן יַגִּדוּ עָלֵינוּ
  choice: లేకపోతే … వారు మన గురించి చెప్పేస్తారేమో
  rationale: פֶּן లోని నివారణాత్మక భయాన్ని ‘లేకపోతే … ఏమో’ సహజంగా తెలియజేస్తుంది; עָלֵינוּను సందర్భానికి తగిన తటస్థ ‘మన గురించి’గా ఉంచి ‘మన మీద ఫిర్యాదు’ అనే అధిక నిర్ధారణను నివారిస్తుంది.
- source_word: כֹּה עָשָׂה דָוִד
  choice: దావీదు ఇలా చేశాడు
  rationale: כֹּה యొక్క సూచనాత్మక బలాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְכֹה מִשְׁפָּטוֹ
  choice: ఇదే అతని పద్ధతి
  rationale: ఈ కథన సందర్భంలో מִשְׁפָּטוֹ దావీదు అనుసరించిన స్థిరమైన వ్యవహార పద్ధతిని సూచిస్తుంది; పదంలోని ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల ప్రాంతంలో
  rationale: שְׂדֵה అక్షరార్థంగా ‘పొలం/బయలు’ అయినా, ఈ భౌగోళిక ప్రయోగంలో ఫిలిష్తీయుల అధీన ప్రాంతాన్ని సూచిస్తుంది; ‘ప్రాంతం’ సాధారణ పాఠకునికి సహజంగా ఉంటుంది.
