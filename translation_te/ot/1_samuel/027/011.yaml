revisions:
- from: గాతుకు తీసుకురావడానికి దావీదు ఏ పురుషుణ్ణీ, ఏ స్త్రీనీ ప్రాణాలతో విడిచిపెట్టేవాడు కాదు. “లేకపోతే, ‘దావీదు ఇలా చేశాడు; ఫిలిష్తీయుల ప్రాంతంలో నివసించిన కాలమంతా ఇదే అతని పద్ధతి[a]’ అని వారు మన గురించి చెప్పేస్తారేమో” అని అతడు అనుకున్నాడు.
  to: “దావీదు ఇలా చేశాడు; ఫిలిష్తీయుల ప్రాంతంలో అతడు నివసించిన కాలమంతా ఇదే అతని పద్ధతి[a]” అని వారు మన గురించి చెబుతారేమోనని, వారిని గాతుకు తీసుకురాకుండా ఉండేందుకు దావీదు ఏ పురుషుణ్ణీ, ఏ స్త్రీనీ బతికుండనిచ్చేవాడు కాదు.
  rationale: సవరణ హీబ్రూ వాక్యంలోని ఉద్దేశ్య-నివారణ సంబంధాన్ని (‘గాతుకు తీసుకురాకుండా ఉండేందుకు’ / ‘చెబుతారేమోనని’) స్పష్టంగా, సహజమైన తెలుగులో ఇస్తుంది. దావీదు ‘అనుకున్నాడు’ అనే స్పష్ట ఆపాదనను తొలగించి, మూలపాఠంలోని స్వల్ప వాక్యనిర్మాణ అస్పష్టతను అనవసరంగా విస్తరించకుండా కాపాడుతుంది. పాదసూచిక గుర్తు מִשְׁפָּטוֹకు సరైన చోటే ఉంచబడింది.
