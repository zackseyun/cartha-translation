translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. హీబ్రూ అసంపూర్ణ క్రియలోని అలవాటైన చర్యను ‘విడిచిపెట్టేవాడు కాదు’గా చూపించాం. לֵאמֹרను తెలుగులో సహజమైన అంతరంగ కారణవాక్యంగా ‘అని అతడు అనుకున్నాడు’ అని వ్యక్తం చేశాం; నివేదికగా చెప్పబడే మొత్తం మాటను ఉల్లేఖనంలో ఉంచాం.
