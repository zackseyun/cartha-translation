  text: וַ/יִּתְפֹּ֛שׂ אֶת אֲגַ֥ג מֶֽלֶךְ עֲמָלֵ֖ק חָ֑י וְ/אֶת כָּל הָ/עָ֖ם הֶחֱרִ֥ים לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/008.yaml
  text: He captured Agag king of Amalek alive[a], and devoted all the people to destruction with the edge of the sword.
translation:
  language: te
  text: అతడు అమాలేక్ రాజైన అగగును సజీవంగా పట్టుకున్నాడు; ప్రజలందరినీ ఖడ్గధారతో నాశనానికి అంకితం చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలందరినీ ఖడ్గధారతో పూర్తిగా నిర్మూలించాడు.” ఇక్కడి హెబ్రీ క్రియ దేనినైనా నాశనం కోసం ప్రత్యేకించి అంకితం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: పట్టుకున్నాడు
  rationale: యుద్ధ సందర్భంలో ఒకరిని అదుపులోకి తీసుకోవడం లేదా బంధించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲגַג
  choice: అగగు
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: מֶלֶךְ עֲמָלֵק
  choice: అమాలేకు రాజైన
  rationale: ‘అమాలేకు రాజు’ అనే సంబంధాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: חָי
  choice: సజీవంగా
  rationale: అగగును చంపకుండా ప్రాణాలతో పట్టుకున్నాడనే వ్యత్యాసాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరినీ
  rationale: עָם అనే విస్తృత పదాన్ని సైనికులు లేదా పౌరులు అని అనవసరంగా పరిమితం చేయకుండా అందిస్తుంది.
- source_word: הֶחֱרִים
  choice: నాశనానికి అంకితం చేశాడు
  rationale: חרם క్రియలోని కేవలం చంపడం కంటే విస్తృతమైన, నాశనం కోసం ప్రత్యేకించి అంకితం చేసే భావాన్ని కాపాడుతుంది.
- source_word: לְפִי חָרֶב
  choice: ఖడ్గధారతో
  rationale: అక్షరార్థంగా ‘ఖడ్గపు నోటితో’ అనే హెబ్రీ నుడికారంలోని పదునైన అంచు చిత్రాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: חרם అనే యుద్ధ సంబంధిత పదం అనువాదం
  choice: ప్రజలందరినీ ... నాశనానికి అంకితం చేశాడు
  alternative: ప్రజలందరినీ పూర్తిగా నిర్మూలించాడు
  rationale: ఎంచుకున్న రూపం ఈ క్రియలోని ప్రత్యేకించి నాశనానికి అప్పగించే మతపరమైన బరువును నిలుపుతుంది; ప్రత్యామ్నాయం ఫలితాన్ని స్పష్టంగా చెబుతున్నప్పటికీ ఆ ప్రత్యేక భావాన్ని కొంత సమతలపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్య నిర్మాణాన్ని ఉపయోగిస్తూ, ‘సజీవంగా,’ ‘నాశనానికి అంకితం చేశాడు,’ ‘ఖడ్గధారతో’ వంటి పదాలతో మూలంలోని వ్యత్యాసం, మతపరమైన బరువు, నుడికార చిత్రాన్ని కాపాడాం. పాదసూచిక గుర్తును అది వివరిస్తున్న חרם పదబంధం తరువాత ఉంచాం.
