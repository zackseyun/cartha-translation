base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/016.yaml
  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
translation:
  language: te
  text: అప్పుడు సమూయేలు సౌలుతో, “ఆపు! నిన్న రాత్రి యెహోవా నాతో చెప్పినదాన్ని నీకు తెలియజేస్తాను” అన్నాడు. అప్పుడు సౌలు అతనితో, “చెప్పు” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ లిఖిత పాఠంలో ‘వారు అతనితో అన్నారు’ అని ఉంది; అయితే సందర్భంలో సమాధానం చెప్పేవాడు సౌలు ఒక్కడే కాబట్టి భావం ‘అతడు అతనితో అన్నాడు.’
    reason: textual_variant
lexical_decisions:
- source_word: הֶרֶף
  choice: ఆపు!
  rationale: רפה ధాతువు ఆజ్ఞారూపం ఇక్కడ మాట్లాడడం మానమనే కఠినమైన ఆదేశం. ‘ఆపు!’ ఆధునిక తెలుగులో సహజంగా ఉండి మందలింపు స్వరాన్ని నిలుపుతుంది.
- source_word: וְאַגִּידָה לְּךָ
  choice: నీకు తెలియజేస్తాను
  rationale: נגד హిఫిల్ రూపానికి ‘తెలియజేయు/చెప్పు’ అనే అర్థం. ముందున్న ఆజ్ఞకు కొనసాగింపుగా ‘తెలియజేస్తాను’ సమూయేలు ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: చెప్పినదాన్ని
  rationale: దేవుని మాటలోని విషయాన్ని సూచించే నిర్మాణం. ‘చెప్పినదాన్ని’ మూలార్థాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించడం జరిగింది; దాని స్థానంలో ఒక బిరుదును పెట్టలేదు.
- source_word: הַלָּיְלָה
  choice: గత రాత్రి
  rationale: ముందున్న సంపూర్ణ క్రియతో కలిసి ఇది కథన సమయానికి ముందున్న రాత్రిని సూచిస్తుంది. ‘గత రాత్రి’ ఆధునిక తెలుగులో స్పష్టం.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: అతడు ... అన్నాడు
  rationale: లిఖిత హీబ్రూ రూపం బహువచనమైనా, సందర్భంలో సమాధానమిచ్చేవాడు సౌలు ఒక్కడే. పాఠ్య అసమానతను పాదసూచికలో ఉంచి, ప్రధాన పాఠ్యంలో సందర్భానుసార ఏకవచనం వాడబడింది.
- source_word: דַּבֵּר
  choice: చెప్పు
  rationale: సమూయేలు కొనసాగాలని కోరే సంక్షిప్త ఆజ్ఞ. ‘చెప్పు’ హీబ్రూ రూపంలోని క్లుప్తతను, ప్రత్యక్షతను నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దీనిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం. ఆధునిక ప్రామాణిక తెలుగులో, తెలుగు బైబిలు సంప్రదాయంలో విస్తృతంగా గుర్తింపున్న ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఇది ఉచ్చారణపై అదనపు సిద్ధాంత నిర్ణయాన్ని పాఠ్యంలో రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ నేరుగా వినిపించే కథన శైలి. సమూయేలు మందలింపు తీవ్రతను ‘ఆపు!’ ద్వారా, చివరి ఆజ్ఞ క్లుప్తతను ‘చెప్పు’ ద్వారా నిలిపాం.
