translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. వివాదాస్పదమైన מַעֲדַנֹּת పదానికి ప్రధాన పాఠంలో ఒక సందర్భోచిత అర్థాన్ని ఎంచుకుని, నిజమైన అనిశ్చితిని పాదసూచికలో స్పష్టంగా ఉంచాం.
