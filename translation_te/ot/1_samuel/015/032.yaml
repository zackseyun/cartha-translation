source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַגִּ֤ישׁוּ אֵלַ/י֙ אֶת אֲגַג֙ מֶ֣לֶךְ עֲמָלֵ֔ק וַ/יֵּ֣לֶךְ אֵלָ֔י/ו אֲגַ֖ג מַעֲדַנֹּ֑ת וַ/יֹּ֣אמֶר אֲגָ֔ג אָכֵ֖ן סָ֥ר מַר הַ/מָּֽוֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
translation:
  language: te
  text: అప్పుడు సమూయేలు, “అమాలేకీయుల రాజైన అగాగును నా దగ్గరికి తీసుకురండి” అన్నాడు. అగాగు వణుకుతూ[a] సమూయేలు దగ్గరికి వచ్చి, “నిశ్చయంగా మరణపు చేదు తొలగిపోయింది” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పదమైన מַעֲדַנֹּת అర్థం అనిశ్చితం. లేదా “సున్నితంగా” లేదా “నిశ్చింతగా.” కొన్ని ప్రాచీన అనువాదాలు “వణుకుతూ” అనే భావాన్ని సూచిస్తాయి; మరికొందరు దీనిని “సంకెళ్లతో” అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישׁוּ
  choice: నా దగ్గరికి తీసుకురండి
  rationale: נגשׁ హిఫిల్ ఆజ్ఞార్థక బహువచనం; పరిచారకులు అగాగును సమూయేలు ఎదుటికి తీసుకురావాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: అమాలేకీయుల రాజైన అగాగు
  rationale: నిర్మాణ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, అగాగు అమాలేకు ప్రజల రాజని స్పష్టంచేస్తుంది.
- source_word: וַיֵּלֶךְ אֵלָיו
  choice: అతని దగ్గరికి వచ్చి
  rationale: క్రియ అక్షరార్థంగా ‘వెళ్లాడు’ అయినప్పటికీ, సమూయేలు చెప్పిన ‘నా దగ్గరికి’ అనే దృష్టికోణాన్ని కొనసాగిస్తూ తెలుగులో ‘వచ్చి’ సహజంగా ఉంది.
- source_word: מַעֲדַנֹּת
  choice: వణుకుతూ
  rationale: ఈ అరుదైన హెబ్రీ పదం అర్థం అనిశ్చితం. సందర్భంలో మరణభయంతో కూడిన సమీపింపుగా అర్థం చేసుకుని ‘వణుకుతూ’ అని ఇచ్చాం; ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపాం.
- source_word: אָכֵן
  choice: నిశ్చయంగా
  rationale: అగాగు పలికిన దృఢ నిర్ధారణ లేదా భావనను వ్యక్తపరుస్తుంది.
- source_word: סָר
  choice: తొలగిపోయింది
  rationale: סור అనే ‘తొలగిపోవు/దూరమవు’ భావాన్ని సహజమైన తెలుగులో, ప్రమాదం ఇక లేదనే అగాగు భావనతో అందిస్తుంది.
- source_word: מַר הַמָּוֶת
  choice: మరణపు చేదు
  rationale: మరణంతో ముడిపడిన చేదైన అనుభవం లేదా ముప్పును సూచించే మూలభాష రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
