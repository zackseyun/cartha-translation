reference: 1 Samuel 15:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל שְׁמוּאֵ֗ל אֲשֶׁ֤ר שָׁמַ֨עְתִּי֙ בְּ/ק֣וֹל יְהוָ֔ה וָ/אֵלֵ֕ךְ בַּ/דֶּ֖רֶךְ אֲשֶׁר שְׁלָחַ֣/נִי יְהוָ֑ה וָ/אָבִ֗יא אֶת אֲגַג֙ מֶ֣לֶךְ עֲמָלֵ֔ק וְ/אֶת עֲמָלֵ֖ק הֶחֱרַֽמְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
translation:
  language: te
  text: 'సౌలు సమూయేలుతో ఇలా అన్నాడు: “నేను యెహోవా మాటకు లోబడ్డాను.[a] యెహోవా నన్ను పంపిన మార్గంలో వెళ్లాను. అమాలేకు రాజైన అగగును తీసుకొచ్చాను; అమాలేకును నాశనానికి అంకితం చేశాను.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో, “యెహోవా స్వరాన్ని విన్నాను”; ఈ ప్రయోగం ఆయన మాటకు లోబడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అమాలేకును పూర్తిగా నాశనం చేశాను.” హీబ్రూ క్రియ దానిని నాశనం చేయడానికి ప్రత్యేకంగా అంకితం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: నేను యెహోవా మాటకు లోబడ్డాను
  rationale: ఈ హీబ్రూ ప్రయోగం ‘స్వరాన్ని వినడం’ అనే అక్షరార్థం కంటే ‘మాటకు లోబడడం/విధేయత చూపడం’ అనే భావాన్ని ఇక్కడ ఇస్తుంది. ‘కాదు’ అనే ప్రతివాద పదంతో కలిసి సౌలు తనను తాను సమర్థించుకుంటున్న ధోరణి నిలుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: וָאֵלֵךְ בַּדֶּרֶךְ אֲשֶׁר שְׁלָחַנִי יְהוָה
  choice: యెహోవా నన్ను పంపిన మార్గంలో వెళ్లాను
  rationale: ‘మార్గం’ అనే మూల రూపకాన్ని నిలుపుతూ, సంబంధ వాక్యాన్ని సహజమైన తెలుగు పదక్రమంలో అమర్చాం.
- source_word: וָאָבִיא
  choice: తీసుకొచ్చాను
  rationale: హిఫీల్ రూపం ‘రప్పించడం/తీసుకురావడం’ అనే కారణార్థాన్ని సూచిస్తుంది. ‘తిరిగి’ అనే భావం క్రియలో స్పష్టంగా లేనందున చేర్చలేదు.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: అమాలేకు రాజైన అగగు
  rationale: హీబ్రూ సమాసార్థాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో ఇచ్చాం.
- source_word: הֶחֱרַמְתִּי
  choice: నాశనానికి అంకితం చేశాను
  rationale: חרם పదంలోని నిషేధం కింద పూర్తిగా నాశనానికి అప్పగించే మతపరమైన-న్యాయపరమైన భావాన్ని కేవలం ‘నాశనం చేశాను’ అని సపాటుగా చేయకుండా నిలిపాం.
- source_word: וְאֶת עֲמָלֵק
  choice: అమాలేకును
  rationale: మూలంలోని ఏకవచన జాతినామాన్ని నిలిపాం; ఇక్కడ అది అమాలేకు ప్రజలను సమష్టిగా సూచిస్తుంది.
theological_decisions:
- issue: పవిత్ర యుద్ధ సందర్భంలో חרם పదం
  choice: అమాలేకును నాశనానికి అంకితం చేశాను
  alternative: అమాలేకును పూర్తిగా నాశనం చేశాను; అమాలేకును నిషేధం కింద ఉంచాను
  rationale: ఎంపిక చేసిన రూపం పూర్తిగా నాశనం చేయడమే కాక దేవుని తీర్పు కింద దానికి అప్పగించబడిన స్థితిని కూడా వ్యక్తం చేస్తుంది. ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచడం వల్ల పదంలోని భావ విస్తృతి కనిపిస్తుంది.
- issue: సౌలు తనను తాను సమర్థించుకునే ప్రతివాద ధోరణి
  choice: కాదు, నేను యెహోవా మాటకు లోబడ్డాను
  alternative: నేను యెహోవా స్వరాన్ని విన్నాను; నిజంగా నేను యెహోవా మాటకు లోబడ్డాను
  rationale: సందర్భంలోని వాదనాత్మక బలాన్ని ‘కాదు’ సహజంగా తెలియజేస్తుంది; సౌలు చెప్పినది నిజమని అనువాదమే తీర్పు చెప్పకుండా, అతని దృఢమైన వాదనగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. సౌలు ప్రతివాద స్వరం ‘కాదు’ ద్వారా స్పష్టమవుతుంది. మూలంలోని పునరుక్త సంధులను తెలుగులో సహజమైన చిన్న వాక్యాలుగా అమర్చినా భావ క్రమం నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
