source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ שְׁמוּאֵ֔ל קָרַ֨ע יְהוָ֜ה אֶֽת מַמְלְכ֧וּת יִשְׂרָאֵ֛ל מֵ/עָלֶ֖י/ךָ הַ/יּ֑וֹם וּ/נְתָנָ֕/הּ לְ/רֵעֲ/ךָ֖ הַ/טּ֥וֹב מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/028.yaml
  text: And Samuel said to him[a], “Yahweh has torn the kingdom of Israel away from you today and has given it to your neighbor[b], who is better than you.”
translation:
  language: te
  text: 'సమూయేలు అతనితో ఇలా అన్నాడు: “యాహ్వే ఈ రోజున ఇశ్రాయేలు రాజ్యాన్ని నీ నుండి చింపివేసి, నీకంటే మెరుగైన నీ సహచరునికి[a] దానిని ఇచ్చేశాడు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ తోటివానికి,” “నీ పొరుగువానికి.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “నీకంటే మెరుగైన” అని ఉంది; ఇది రాజ్యం ఇవ్వబడిన వ్యక్తిని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו שְׁמוּאֵל
  choice: అప్పుడు సమూయేలు అతనితో ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: קָרַע
  choice: చింపివేసి
  rationale: ఈ క్రియలోని ‘చింపడం’ అనే స్పష్టమైన రూపకాన్ని కాపాడుతుంది; 27వ వచనంలో వస్త్రం చిరిగిన సంఘటనతో ఉన్న ఉద్దేశపూర్వక ప్రతిధ్వనినీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజ్యాధికారాన్ని
  rationale: מַמְלְכוּת అనేది రాజ్యం లేదా రాజ్యాధికారాన్ని సూచించగలదు. ఇక్కడ సౌలు నుంచి తీసి మరొకరికి అప్పగించబడేది పరిపాలనా హక్కు కావడంతో ‘రాజ్యాధికారం’ సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵעָלֶיךָ
  choice: నీ దగ్గర నుంచి
  rationale: సౌలు వద్దనున్న అధికారం తొలగించబడుతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: తీర్పు ప్రకటనలోని తక్షణత్వాన్ని నిలుపుతుంది.
- source_word: וּנְתָנָהּ
  choice: దాన్ని ఇచ్చేశాడు
  rationale: హీబ్రూ పరిపూర్ణ క్రియారూపం ఈ దైవిక నిర్ణయాన్ని నిశ్చయంగా పూర్తయిన కార్యంలా చూపుతుంది; ‘ఇచ్చేశాడు’ దాని నిర్ణాయకతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְרֵעֲךָ
  choice: నీ తోటివానికి
  rationale: רֵעַ ఇక్కడ స్నేహితుడు, సహచరుడు లేదా తోటి వ్యక్తి అనే విస్తృత సంబంధార్థం కలిగి ఉంది; ‘తోటివాడు’ అనవసరమైన సాన్నిహిత్యాన్ని సూచించకుండా ఆ విస్తృతతను కాపాడుతుంది.
- source_word: הַטּוֹב מִמֶּךָּ
  choice: నీకంటే మెరుగైన
  rationale: తులనాత్మక నిర్మాణాన్ని సూటిగా అనువదించి, ఆ వర్ణన రాజ్యాధికారం పొందే వ్యక్తినే సూచిస్తుందని స్పష్టం చేస్తుంది; ‘మరింత యోగ్యుడు’ వంటి వ్యాఖ్యాత్మక విస్తరణను నివారిస్తుంది.
theological_decisions:
- issue: దైవిక తీర్పును పూర్తయిన కార్యంగా లేదా భవిష్యత్ కార్యంగా అనువదించడం
  choice: 'పూర్తయిన, నిర్ణాయక కార్యం: ‘చింపివేసి ... ఇచ్చేశాడు’'
  alternative: 'భవిష్యత్ కార్యం: ‘చింపివేస్తాడు ... ఇస్తాడు’'
  rationale: ప్రవచనాత్మక తీర్పు ప్రకటనలోని హీబ్రూ పరిపూర్ణ క్రియలు, చారిత్రక అమలు తరువాత జరిగినప్పటికీ, దేవుని నిర్ణయాన్ని ఇప్పటికే నిశ్చయమైన కార్యంగా చూపుతాయి. పూర్తయిన రూపం ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: מַמְלְכוּת ను భూభాగ రాజ్యంగా లేదా రాజ్యపాలనా అధికారంగా గ్రహించడం
  choice: రాజ్యాధికారం
  alternative: రాజ్యం
  rationale: సందర్భంలో సౌలు నుంచి మరొక వ్యక్తికి బదిలీ అయ్యేది ప్రధానంగా ఇశ్రాయేలుపై రాజ్యపాలన. అయినప్పటికీ మూలపదం ‘రాజ్యం’ అనే భావాన్నీ కలిగి ఉండగలదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘చింపివేసి’ అనే సజీవ రూపకాన్ని కాపాడి, ‘రాజ్యాధికారం’ ద్వారా సందర్భంలోని పాలనా భావాన్ని స్పష్టం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
