  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడాం. భౌగోళిక జాతీయ ప్రయోగాన్ని అక్షరానువాదంగా కాక స్పష్టమైన తెలుగు రూపంలో అందించాం. ప్రధాన పాఠంలోని రెండు పాదసూచిక గుర్తులకు అనుగుణంగా గమనికలు ఇచ్చాం.
