  yaml_path: translation/ot/1_samuel/015/007.yaml
  text: Then Saul struck Amalek[a], from Havilah as you go to Shur[b], which is opposite Egypt.
translation:
  language: te
  text: అప్పుడు సౌలు హవీలా నుండి ఐగుప్తుకు ఎదురుగా ఉన్న షూరుకు వెళ్లే దారివరకు అమాలేకీయులపై[a] దాడి చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘అమాలేకు’ అని ఉంది; పూర్వికుని పేరు ఇక్కడ అతని సంతతి ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఐగుప్తుకు ఎదురుగా’ అనే హీబ్రూ పదబంధాన్ని ‘ఐగుప్తుకు తూర్పున’ లేదా ‘ఐగుప్తు ముందుభాగంలో’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: హతమార్చాడు
  rationale: נכה అనే క్రియకు ‘కొట్టడం, హతమార్చడం, ఓడించడం’ అనే అర్థపరిధి ఉంది. యుద్ధసందర్భంలో ‘హతమార్చాడు’ సహజంగా ఉంటుంది; అయితే ఇది సంపూర్ణ విజయాన్ని ప్రత్యేకంగా ప్రకటించదు.
- source_word: עֲמָלֵק
  choice: అమాలేకీయులను
  rationale: హీబ్రూలో పూర్వికుని ఏకవచన నామమైన ‘అమాలేకు’ ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో ఉద్దేశించిన ప్రజలను స్పష్టంగా తెలియజేయడానికి ‘అమాలేకీయులను’ అని అనువదించాం.
- source_word: מֵחֲוִילָה
  choice: హవీలా మొదలుకొని
  rationale: מִן అనే ఉపసర్గ భౌగోళిక పరిధి ప్రారంభబిందువును సూచిస్తుంది; తెలుగులో ‘మొదలుకొని’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בּוֹאֲךָ
  choice: వెళ్లే దారి వరకు
  rationale: ‘నీవు వెళ్లేటప్పుడు’ అనే అక్షరార్థ రూపం ఇక్కడ భౌగోళిక మార్గాన్ని సూచించే జాతీయ ప్రయోగం. తెలుగులో ‘షూరుకు వెళ్లే దారి వరకు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: שׁוּר
  choice: షూరు
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: ఐగుప్తుకు ఎదురుగా ఉన్న
  rationale: עַל־פְּנֵי అనే పదబంధం ‘ముందు, ఎదురుగా, ముఖాముఖిగా’ ఉన్న స్థానాన్ని సూచించగలదు. దిశను అనవసరంగా నిర్దిష్టం చేయకుండా ‘ఎదురుగా’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపాన్ని వాడాం.
