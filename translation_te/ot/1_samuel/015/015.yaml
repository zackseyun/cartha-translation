source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל מֵ/עֲמָלֵקִ֣י הֱבִיא֗וּ/ם אֲשֶׁ֨ר חָמַ֤ל הָ/עָם֙ עַל מֵיטַ֤ב הַ/צֹּאן֙ וְ/הַ/בָּקָ֔ר לְמַ֥עַן זְבֹ֖חַ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/אֶת הַ/יּוֹתֵ֖ר הֶחֱרַֽמְנוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
translation:
  language: te
  text: 'సౌలు ఇలా అన్నాడు: “వాటిని అమాలేకీయుల నుండి తీసుకొచ్చారు. యెహోవాకు, అంటే నీ దేవునికి, బలి అర్పించడానికి ప్రజలు గొర్రెలలోనూ పశువులలోనూ శ్రేష్ఠమైనవాటిని నాశనం చేయకుండా ఉంచారు; మిగిలినవాటిని మేము నాశనానికి అంకితం చేశాం.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పూర్తిగా నాశనం చేశాం.” ఇక్కడి హీబ్రూ క్రియ חרם; దైవ తీర్పు కింద దేనినైనా నాశనానికి ప్రత్యేకంగా అప్పగించడాన్ని సూచించే సాంకేతిక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱבִיאוּם
  choice: వాటిని … తీసుకొచ్చారు
  rationale: హిఫిల్ రూపంలోని కారణార్థ భావాన్ని సహజమైన తెలుగు కథన శైలిలో వ్యక్తం చేస్తూ, 3వ పురుష బహువచన కర్తను మరియు బహువచన కర్మను నిలుపుతుంది.
- source_word: מֵעֲמָלֵקִי
  choice: అమాలేకీయుల దగ్గర నుంచి
  rationale: ఇది ప్రాంతం కన్నా అమాలేకీయులనే ప్రజాసమూహాన్ని సూచించే జాతివాచక రూపం.
- source_word: חָמַל ... עַל
  choice: నాశనం చేయకుండా ఉంచారు
  rationale: ఈ యుద్ధ-న్యాయ సందర్భంలో భావోద్వేగపూర్వకమైన ‘జాలిపడ్డారు’ కన్నా, నాశనం చేయకుండా విడిచిపెట్టిన నిర్దిష్ట చర్యను ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: గొర్రెలలోనూ పశువులలోనూ శ్రేష్ఠమైనవాటిని
  rationale: מֵיטַב సూచించే అత్యుత్తమ భాగాన్ని, రెండు పశువర్గాలతో సహజమైన తెలుగులో అనుసంధానిస్తుంది.
- source_word: לְמַעַן זְבֹחַ
  choice: బలి అర్పించడానికి
  rationale: לְמַעַן తెలిపే ఉద్దేశాన్ని నేరుగా వ్యక్తం చేస్తుంది; బలికి ఉద్దేశించినవి ముందున్న జంతువులేనని తెలుగు వాక్యనిర్మాణంలో స్పష్టమవుతుంది.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: యెహోవా, నీ దేవునికి
  rationale: దైవనామాన్ని పేరుగా నిలుపుతూ, సౌలు సమూయేలుతో అన్న ‘నీ దేవుడు’ అనే ద్వితీయ పురుష ఏకవచన సంబోధనలోని వాక్చాతుర్య దూరాన్ని కాపాడుతుంది.
- source_word: הַיּוֹתֵר
  choice: మిగిలినవాటిని
  rationale: కాపాడిన శ్రేష్ఠ జంతువులు తప్ప మిగతా భాగాన్ని సహజంగా సూచిస్తుంది.
- source_word: הֶחֱרַמְנוּ
  choice: మేము నాశనానికి అంకితం చేశాం
  rationale: חרם యొక్క సాధారణ నాశనాన్ని మించిన, దైవ తీర్పు కింద నాశనానికి ప్రత్యేకంగా అప్పగించే సాంకేతిక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పవిత్ర యుద్ధం/దైవ తీర్పు సందర్భంలో חרם పదం
  choice: నాశనానికి అంకితం చేశాం
  alternative: పూర్తిగా నాశనం చేశాం
  rationale: ఇది కేవలం చంపడం లేదా ధ్వంసం చేయడం కాక, దైవ ఆజ్ఞ ప్రకారం నాశనానికి ప్రత్యేకంగా అప్పగించడాన్ని సూచిస్తుంది. ప్రధాన పాఠం ఆ సాంకేతిక-ధార్మిక భావాన్ని నిలుపుతుంది; పాదసూచిక సహజమైన ప్రత్యామ్నాయాన్ని ఇస్తుంది.
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే పేరురూపంలో ఉంచుతుంది.
- issue: אֱלֹהֶיךָ లోని ‘నీ’ అనే సంబోధన
  choice: నీ దేవునికి
  alternative: మన దేవునికి
  rationale: సౌలు ‘నీ దేవుడు’ అని చెప్పడం వల్ల కలిగే సంభావ్య వాక్చాతుర్య దూరాన్ని మూలానుసారంగా నిలుపుతుంది; దాన్ని ‘మన దేవుడు’గా సవరించి భావాన్ని పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నాశనానికి అంకితం చేశాం’ అనే పదబంధం కొద్దిగా గంభీరంగా ఉన్నప్పటికీ మూలంలోని חרם పదానికి గల సాంకేతిక ధార్మిక భావాన్ని కాపాడుతుంది. పాదసూచిక గుర్తు [a] సంబంధిత పదబంధం వెంటనే ఉంచబడింది.
