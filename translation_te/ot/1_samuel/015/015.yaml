  to: 'సౌలు ఇలా అన్నాడు: “వాటిని అమాలేకీయుల నుండి తీసుకొచ్చారు. యెహోవాకు, అంటే నీ దేవునికి, బలి అర్పించడానికి ప్రజలు గొర్రెలలోనూ పశువులలోనూ శ్రేష్ఠమైనవాటిని నాశనం చేయకుండా ఉంచారు; మిగిలినవాటిని మేము నాశనానికి అంకితం చేశాం.[a]”'
