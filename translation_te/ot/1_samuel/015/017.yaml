source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל הֲ/ל֗וֹא אִם קָטֹ֤ן אַתָּה֙ בְּ/עֵינֶ֔י/ךָ רֹ֛אשׁ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אָ֑תָּה וַ/יִּמְשָׁחֲ/ךָ֧ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
translation:
  language: te
  text: 'సమూయేలు ఇలా అన్నాడు[a]: “నీ దృష్టిలో నీవు అల్పుడవైనప్పటికీ, నీవు ఇశ్రాయేలు గోత్రాలకు అధిపతివి కాలేదా? యాహ్వే నిన్ను ఇశ్రాయేలుమీద రాజుగా అభిషేకించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ దృష్టిలో నీవు అల్పుడవైనా సరే.” హీబ్రూ వాక్యభాగాన్ని స్వల్పంగా భిన్నమైన నుడితో అర్థం చేసుకోవచ్చు; సౌలు ఒకప్పుడు తనను తాను అల్పుడిగా భావించేవాడన్నదే ప్రధాన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: కాలేదా?
  rationale: అంగీకారాన్ని ఆశించే హీబ్రూ అలంకారిక ప్రశ్న బలాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో వ్యక్తం చేస్తుంది.
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  choice: నీ దృష్టికి నీవు అల్పుడవైనప్పటికీ
  rationale: సౌలు తనను తాను తక్కువగా ఎంచుకున్నాడనే భావాన్ని తెలిపే హీబ్రూ నుడికారాన్ని నిలుపుతూ, אִם యొక్క సందర్భానుగుణ concessive భావాన్ని వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ సూక్ష్మభావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: קָטֹן
  choice: అల్పుడు
  rationale: ఇక్కడ శారీరక పరిమాణం కాక, స్థాయి లేదా స్వీయ అంచనాలో తక్కువతనాన్ని సూచిస్తుంది; ‘అల్పుడు’ ఆధునిక గౌరవప్రద తెలుగులో ఆ రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּעֵינֶיךָ
  choice: నీ దృష్టికి
  rationale: ‘నీ కళ్లలో’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; వ్యక్తి తనను తాను ఎలా ఎంచుకున్నాడో తెలియజేస్తుంది.
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలకు అధిపతి
  rationale: רֹאשׁ యొక్క నాయకత్వ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అక్షరార్థమైన ‘తల’ తెలుగులో ఇక్కడ అసహజంగా ఉండటంతో భావసమానమైన ‘అధిపతి’ ఎంచుకోబడింది.
- source_word: וַיִּמְשָׁחֲךָ
  choice: నిన్ను ... అభిషేకించాడు
  rationale: משׁח సూచించే రాజాభిషేక క్రియను, దాని ఆచారపరమైన మరియు రాజసంబంధ ప్రాముఖ్యతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద రాజుగా
  rationale: అభిషేకం యొక్క ఫలితమైన రాజపదవిని, עַל తెలిపే అధికార సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరో సాధ్యమైన లిప్యంతరీకరణ.
- issue: సౌలు చిన్నవాడనే వాక్యభాగపు సంబంధం
  choice: అల్పుడవైనప్పటికీ
  alternative: అల్పుడవైనా సరే
  rationale: సందర్భంలో సౌలు తన దృష్టిలో అల్పుడిగా ఉన్నప్పటికీ గోత్రాలకు అధిపతిగా చేయబడ్డాడనే concessive వ్యత్యాసం ప్రధానంగా కనిపిస్తుంది. అయితే אִם వల్ల స్వల్పంగా భిన్నమైన షరతు/అంగీకార నుడి సాధ్యమైందని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, మౌఖికంగా చదవడానికి సహజమైన శైలిని ఉపయోగించాం. హీబ్రూ అలంకారిక ప్రశ్నను నిలిపి, చివరి וַ సంధిని ప్రత్యేక వాక్యంగా ప్రతిబింబించాం. ‘గోత్రాలు,’ ‘అభిషేకించాడు’ వంటి స్థిరమైన బైబిలు పదాలను సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణంలో ఉంచాం.
