- from: అప్పుడు సమూయేలు సౌలు వెనుక తిరిగి వెళ్లాడు. సౌలు యెహోవాకు వంగి నమస్కరించాడు[a].
  to: అప్పుడు సమూయేలు సౌలు వెంట తిరిగి వెళ్లాడు. సౌలు యెహోవాకు వంగి నమస్కరించాడు[a].
