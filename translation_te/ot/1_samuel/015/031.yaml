base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/031.yaml
  text: So Samuel went back after Saul[a], and Saul bowed down to Yahweh.
translation:
  language: te
  text: అప్పుడు సమూయేలు సౌలు వెంట తిరిగి వెళ్లాడు. సౌలు యెహోవాకు వంగి నమస్కరించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవాను ఆరాధించాడు.’ సందర్భాన్ని బట్టి ఈ హెబ్రీ క్రియ వంగి నమస్కరించడాన్ని లేదా ఆరాధించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వెళ్లాడు
  rationale: שׁוב అనే క్రియ ఇక్కడ సమూయేలు తన మునుపటి నిరాకరణను మార్చుకొని సౌలు వెంట తిరిగి వెళ్లడాన్ని సూచిస్తుంది. ‘తిరిగి వెళ్లాడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: אַחֲרֵי
  choice: వెనుక
  rationale: ఈ విభక్తిపూర్వక పదానికి అక్షరార్థంగా ‘వెనుక/తర్వాత’ అనే భావం ఉంది. సందర్భంలో సమూయేలు సౌలు వెంట వెళ్లాడని సూచిస్తుంది; ‘వెనుక’ మూలపాఠంలోని దృశ్యభావాన్ని నిలుపుతుంది.
- source_word: וַיִּשְׁתַּחוּ
  choice: వంగి నమస్కరించాడు
  rationale: שׁחה శరీరాన్ని వంచి సాష్టాంగపడడం లేదా ఆరాధించడం అనే భావాలను సందర్భానుసారం వ్యక్తం చేయగలదు. ‘వంగి నమస్కరించాడు’ శారీరక చర్యను ముందుంచుతూ, దేవునిపట్ల ఆరాధనా భావాన్నీ అనుమతిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל ఉపసర్గ చర్య ఎవరికి ఉద్దేశించబడిందో తెలుపుతుంది. יהוה అనే దేవుని వ్యక్తిగత నామాన్ని తెలుగులో స్థిరంగా వాడుకలో ఉన్న ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ అనే క్రియను స్పష్టంగా ‘ఆరాధించాడు’ అని అనువదించాలా, లేక శారీరకంగా వంగిన చర్యను ప్రధానంగా చూపాలా?
  choice: ప్రధాన పాఠంలో ‘వంగి నమస్కరించాడు’
  alternative: ‘యెహోవాను ఆరాధించాడు’ లేదా ‘యెహోవా ఎదుట సాష్టాంగపడ్డాడు’
  rationale: ఈ హెబ్రీ క్రియ వంగడం, సాష్టాంగపడడం, ఆరాధించడం అనే భావాలను కలిగి ఉండవచ్చు. కర్త చేసిన శారీరక చర్యను మూలపాఠం ముందుంచుతుంది; అయితే దాని లక్ష్యం యెహోవా కాబట్టి ఆరాధన భావం కూడా సందర్భంలో ఉంది. ప్రధాన పాఠం ఈ రెండింటి మధ్య ఉన్న భావవ్యాప్తిని నిలుపుతుంది.
translation_notes:
  register: సరళమైన, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘వంగి నమస్కరించాడు’ అనే సహజ ప్రయోగం శారీరక చర్యకూ ఆరాధనా భావానికీ చోటిస్తుంది. పాదసూచిక గుర్తు సంబంధిత క్రియ తర్వాత ఉంచబడింది.
