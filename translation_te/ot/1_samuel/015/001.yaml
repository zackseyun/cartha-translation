source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל אֹתִ֨/י שָׁלַ֤ח יְהוָה֙ לִ/מְשָׁחֳ/ךָ֣ לְ/מֶ֔לֶךְ עַל עַמּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה שְׁמַ֔ע לְ/ק֖וֹל דִּבְרֵ֥י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
translation:
  language: te
  text: 'అప్పుడు సమూయేలు సౌలుతో ఇలా అన్నాడు: “యెహోవా తన ప్రజలైన ఇశ్రాయేలుపై నిన్ను రాజుగా అభిషేకించడానికి నన్ను పంపాడు. కాబట్టి ఇప్పుడు యెహోవా మాటలను ఆలకించు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యెహోవా మాటల స్వరాన్ని విను.” ఈ హీబ్రూ వ్యక్తీకరణ వినడమే కాక శ్రద్ధగా విని విధేయత చూపాలనే భావాన్ని కూడా కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన శైలిలో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: שְׁמוּאֵל אֶל־שָׁאוּל
  choice: సమూయేలు సౌలుతో
  rationale: మాట్లాడడాన్ని సూచించే సందర్భంలో אֶל‌ను తెలుగులో సహజమైన ‘తో’తో వ్యక్తపరిచాం; పేర్లకు ప్రామాణిక తెలుగు రూపాలు వాడాం.
- source_word: אֹתִי שָׁלַח יְהוָה
  choice: యెహోవా ... నన్ను పంపాడు
  rationale: మూలంలో ‘నన్ను’ ముందుంచి ఉన్న ఉద్ఘాటనను భావపరంగా నిలుపుతూ, తెలుగులో సహజమైన పదక్రమాన్ని వాడాం. יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: לִמְשָׁחֳךָ לְמֶלֶךְ
  choice: నిన్ను రాజుగా అభిషేకించడానికి
  rationale: משׁח రాజపదవికి నూనెపూసి నియమించడాన్ని సూచిస్తుంది; ‘అభిషేకించు’ ఆ ఆచారార్థాన్ని, పదవీ నియామక భావాన్ని నిలుపుతుంది.
- source_word: עַל־עַמּוֹ עַל־יִשְׂרָאֵל
  choice: తన ప్రజలైన ఇశ్రాయేలుపై
  rationale: పునరుక్త עַל‌లో రెండవ పదబంధం మొదటిదాన్ని స్పష్టీకరిస్తుంది. ‘తన ప్రజలైన ఇశ్రాయేలు’ ఆ అనుబంధాన్ని సహజంగా చూపగా, ‘పై’ రాజాధికార భావాన్ని నిలుపుతుంది.
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: గత నియామకాన్ని ప్రస్తుత ఆజ్ఞకు ఆధారంగా చూపే మార్పు మరియు నిర్ధారణాత్మక బలాన్ని రెండింటినీ వ్యక్తపరుస్తుంది.
- source_word: שְׁמַע לְקוֹל דִּבְרֵי יְהוָה
  choice: యెహోవా మాటల స్వరాన్ని ఆలకించు
  rationale: ‘మాటల స్వరం’ అనే మూలభాషా నిర్మాణాన్ని నిలుపుతూ, שׁמעలో ఉన్న వినడం మాత్రమే కాక విధేయతతో శ్రద్ధ పెట్టడం అనే భావాన్ని ‘ఆలకించు’ తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’; దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- issue: שְׁמַע యొక్క వినికిడి-విధేయత భావం
  choice: ఆలకించు
  alternative: విను / మాటలకు లోబడు
  rationale: మూలపదం ఈ సందర్భంలో శబ్దాన్ని వినడానికంటే ఎక్కువగా శ్రద్ధతో విని ఆచరించమనే పిలుపును కలిగి ఉంది. ‘ఆలకించు’ ఈ విస్తృతిని కాపాడుతుంది; అయితే ‘లోబడు’ అని మాత్రమే అనడం మూలంలోని వినికిడి రూపకాన్ని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘అభిషేకించు’ వంటి స్థిరమైన బైబిలు పదాన్ని ఉంచి, మిగతా నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం. మూలంలోని ‘మాటల స్వరం’ అనే అసాధారణ నిర్మాణాన్ని ప్రధాన పాఠంలో నిలిపి, దాని వినికిడి-విధేయత వ్యాప్తిని పాదటీకలో వివరించాం.
