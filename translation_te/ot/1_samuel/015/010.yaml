    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు ... వచ్చింది
  rationale: వావ్-కన్సెక్యూటివ్‌తో ఉన్న היה కథనంలో తదుపరి పరిణామాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు ... వచ్చింది’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: דְּבַר
  choice: వాక్కు
  rationale: దైవిక ప్రకటనను సూచించే דְּבַר־יְהוָה సూత్రప్రయోగానికి ‘వాక్కు’ సంక్షిప్తమైన, గౌరవప్రదమైన, పాఠ్యానికి దగ్గరైన అనువాదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: కు
  rationale: దైవవాక్కును అందుకున్న వ్యక్తిని సూచించే సంబంధాన్ని తెలుగులో సహజమైన సంప్రదాన విభక్తితో వ్యక్తపరుస్తుంది.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: לֵאמֹר
  choice: ద్విబిందువు ద్వారా సూచించబడింది
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ క్రియారూపాన్ని ఆధునిక తెలుగులో ద్విబిందువు సహజంగా వ్యక్తపరుస్తుంది; ‘ఇలా చెబుతూ’ అని విడిగా చేర్చడం అనవసరంగా భారంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఉంచడం మూలంలోని నామప్రయోగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన ప్రవక్తీయ కథన శైలి. తదుపరి వచనంలో వచ్చే దైవవాక్యానికి అనుసంధానంగా చివర ద్విబిందువు ఉంచబడింది.
