source:
  edition: WLC
  text: וְ/לָ֥/מָּה לֹא שָׁמַ֖עְתָּ בְּ/ק֣וֹל יְהוָ֑ה וַ/תַּ֨עַט֙ אֶל הַ/שָּׁלָ֔ל וַ/תַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/019.yaml
  text: Why then did you not obey the voice of Yahweh[a], but rush upon the spoil and do what was evil in the eyes of Yahweh?
translation:
  language: te
  text: మరి నీవు యాహ్వే మాటకు ఎందుకు విధేయత చూపలేదు? దోపుడు సొమ్ముపైకి ఎగబడి[a], యాహ్వే దృష్టిలో చెడు చేశావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దోపుడు సొమ్ముపైకి దూకావు’ లేదా ‘దోపుడు సొమ్ముపైకి పడ్డావు.’ హీబ్రూ క్రియ యుద్ధ దోపుడు వైపు ఆత్రంతో, దానిని స్వాధీనం చేసుకోవాలనే తాపత్రయంతో కదలడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: మరి … ఎందుకు
  rationale: సందర్భంలోని అనుసంధాన భావాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో తెలియజేస్తుంది.
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: మాట వినలేదు
  rationale: ఈ ఆజ్ఞాపరమైన సందర్భంలో ఇది కేవలం శబ్దం వినడాన్ని కాక, చెప్పినదానికి విధేయత చూపడాన్ని సూచిస్తుంది; ‘మాట వినడం’ తెలుగులో ఈ రెండవ భావాన్ని సహజంగా మోస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ మూలంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: וַתַּעַט אֶל
  choice: ఆత్రంగా దూకి
  rationale: దోపుడు సొమ్మువైపు అత్యాశతో, హఠాత్తుగా కదిలిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది; క్రియలోని బలమైన కదలికను నిలుపుతుంది.
- source_word: הַשָּׁלָל
  choice: దోపుడు సొమ్ము
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న వస్తువులను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: וַתַּעַשׂ הָרַע
  choice: చెడ్డది చేశావు
  rationale: హీబ్రూ పదబంధంలోని నైతిక దోషాన్ని సరళంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: హీబ్రూ మూలంలోని మూల్యాంకన రూపకాన్ని సహజమైన తెలుగు ప్రయోగంతో కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా ఆధునికంగా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సమూయేలు పలికిన గద్దింపు నేరుగా, గంభీరంగా వినిపించేలా ప్రశ్నారూపాన్ని ఉంచాం. హీబ్రూ వాక్యంలోని వరుస చర్యలను తెలుగులో స్పష్టత కోసం రెండు ప్రశ్నలుగా విభజించాం.
