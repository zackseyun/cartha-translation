revisions:
- from: ఇప్పుడు నీవు వెళ్లి అమాలేకును[a] దెబ్బకొట్టు; అతనికి చెందిన సమస్తాన్ని నిర్మూలనకు అంకితం చేయండి. అతణ్ణి కనికరించవద్దు; పురుషుని నుండి స్త్రీ వరకు, చిన్నబిడ్డ నుండి పాలుతాగే పసిబిడ్డ వరకు, ఎద్దు నుండి గొర్రెమేక వరకు[b], ఒంటె నుండి గాడిద వరకు చంపండి.
  to: ఇప్పుడు నీవు వెళ్లి అమాలేకును[a] దెబ్బకొట్టు; అతనికి చెందిన సమస్తాన్ని నిర్మూలనకు అంకితం చేయండి[b]. అతణ్ణి విడిచిపెట్టవద్దు; పురుషుని నుండి స్త్రీ వరకు, చిన్నబిడ్డ నుండి పాలుతాగే పసిబిడ్డ వరకు, ఎద్దు నుండి గొర్రె లేదా మేక వరకు[c], ఒంటె నుండి గాడిద వరకు చంపండి.
  rationale: Main text revisions improve idiomatic precision while preserving the Hebrew’s singular-to-plural imperative shift and the repeated ‘from ... to ...’ totality construction. Footnotes have been reanchored and expanded so that the corporate singular, the technical חרם term, and the sheep/goat lexical range are each documented at their respective textual locations.
  reviewer_model: gpt-5.6-terra
