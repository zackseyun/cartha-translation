source:
  edition: WLC
  text: עַתָּה֩ לֵ֨ךְ וְ/הִכִּֽיתָ֜ה אֶת עֲמָלֵ֗ק וְ/הַֽחֲרַמְתֶּם֙ אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/לֹ֥א תַחְמֹ֖ל עָלָ֑י/ו וְ/הֵמַתָּ֞ה מֵ/אִ֣ישׁ עַד אִשָּׁ֗ה מֵֽ/עֹלֵל֙ וְ/עַד יוֹנֵ֔ק מִ/שּׁ֣וֹר וְ/עַד שֶׂ֔ה מִ/גָּמָ֖ל וְ/עַד חֲמֽוֹר־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
translation:
  language: te
  text: ఇప్పుడు నీవు వెళ్లి అమాలేకును[a] దెబ్బకొట్టు; అతనికి చెందిన సమస్తాన్ని నిర్మూలనకు అంకితం చేయండి[b]. అతణ్ణి విడిచిపెట్టవద్దు; పురుషుని నుండి స్త్రీ వరకు, చిన్నబిడ్డ నుండి పాలుతాగే పసిబిడ్డ వరకు, ఎద్దు నుండి గొర్రె లేదా మేక వరకు[c], ఒంటె నుండి గాడిద వరకు చంపండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అమాలేకు’; ఇక్కడ అది అమాలేకీయుల ప్రజాసమూహాన్ని ఏకవచన సమష్టిగా సూచిస్తుంది. అందుకే తరువాత ‘అతనికి’, ‘అతణ్ణి’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియకు ‘పూర్తిగా నాశనానికి అప్పగించు’ లేదా ‘నిషేధం కింద ఉంచు’ అనే అర్థాలూ ఉన్నాయి. ఇది దైవిక తీర్పు కింద తిరుగులేని విధంగా నిర్మూలనకు అంకితం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ שֶׂה అనే పదం గొర్రెను గానీ మేకను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה לֵךְ
  choice: ఇప్పుడు నీవు వెళ్లి
  rationale: కాలసూచక అవ్యయాన్నీ, ఏకవచన ఆజ్ఞనూ సహజమైన ఆధునిక తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: וְהִכִּיתָה אֶת־עֲמָלֵק
  choice: అమాలేకును దెబ్బకొట్టు
  rationale: נכה అనే క్రియలోని ‘కొట్టు/దాడిచేయి’ భావాన్ని సాధ్యమైనంత రూపసామ్యంతో వ్యక్తం చేస్తుంది; ‘ఓడించు’ అని ఫలితాన్ని ముందే నిర్ణయించదు.
- source_word: וְהַחֲרַמְתֶּם
  choice: నిర్మూలనకు అంకితం చేయండి
  rationale: חרם హిఫీల్‌లో ఉన్న దైవిక తీర్పు కింద తిరుగులేని విధంగా నాశనానికి అప్పగించే సాంకేతిక-పవిత్ర భావాన్ని కేవలం ‘నాశనం చేయండి’ కంటే మెరుగ్గా నిలుపుతుంది. హీబ్రూలో ఇక్కడ బహువచన రూపానికి మార్పును కూడా తెలుగు బహువచన ఆజ్ఞతో నిలిపింది.
- source_word: כָּל־אֲשֶׁר לוֹ
  choice: అతనికి చెందిన సమస్తాన్ని
  rationale: అమాలేకు అనే సమష్టి ఏకవచనానికి చెందినవన్నీ అనే విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: וְלֹא תַחְמֹל עָלָיו
  choice: అతణ్ణి కనికరించవద్దు
  rationale: חמל లోని జాలి చూపి విడిచిపెట్టే భావాన్ని గంభీరంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְהֵמַתָּה
  choice: చంపండి
  rationale: హిఫీల్ రూపంలోని ‘మరణింపజేయండి’ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా, అలంకారరహితంగా అందిస్తుంది; హీబ్రూ బహువచన రూపాన్ని నిలుపుతుంది.
- source_word: מֵאִישׁ עַד־אִשָּׁה
  choice: పురుషుని నుండి స్త్రీ వరకు
  rationale: מִן...עַד నిర్మాణాన్ని నిలిపి, రెండు చివరలతో సమగ్రతను సూచించే మెరిసాన్ని ప్రతిబింబిస్తుంది.
- source_word: מֵעֹלֵל וְעַד־יוֹנֵק
  choice: చిన్నబిడ్డ నుండి పాలుతాగే పసిబిడ్డ వరకు
  rationale: עולל అనే చిన్నపిల్లకూ יונק అనే ఇంకా పాలు తాగే శిశువుకూ మధ్యనున్న పదార్థ భేదాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מִשּׁוֹר וְעַד־שֶׂה
  choice: ఎద్దు నుండి గొర్రెమేక వరకు
  rationale: שור ను ‘ఎద్దు’గా, שה ను గొర్రె లేదా మేక రెండింటినీ సూచించగల చిన్న పశువుల సమష్టి పదంగా ‘గొర్రెమేక’తో అందించి మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: מִגָּמָל וְעַד־חֲמוֹר
  choice: ఒంటె నుండి గాడిద వరకు
  rationale: ఏకవచన వర్గపదాలనూ ‘నుండి...వరకు’ సమగ్ర నిర్మాణాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: חרם యుద్ధ-తీర్పు భాష
  choice: నిర్మూలనకు అంకితం చేయండి
  alternative: పూర్తిగా నాశనం చేయండి; నిషేధానికి అప్పగించండి
  rationale: ఇది సాధారణ సైనిక విధ్వంసాన్ని మాత్రమే కాక దైవిక తీర్పు కింద తిరుగులేని అంకితాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో భావాన్ని కాపాడి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలియజేశారు.
- issue: ‘అమాలేకు/అతడు’ అనే సమష్టి ఏకవచనం
  choice: అమాలేకు ... అతనికి ... అతణ్ణి
  alternative: అమాలేకీయులు ... వారికి ... వారిని
  rationale: హీబ్రూ ఒక ప్రజాసమూహాన్ని ఏకవచన వ్యక్తిగా ప్రస్తావిస్తుంది. ఆ రూపాన్నీ దానిలోని సమష్టి భావాన్నీ నిలిపి, పాదటిప్పణిలో వివరణ ఇచ్చారు.
- issue: మానవ జంటలో లింగ నిర్దిష్టత
  choice: పురుషుని నుండి స్త్రీ వరకు
  alternative: మనుషులందరినీ
  rationale: మూలం పురుషుడు, స్త్రీ అనే రెండు వర్గాలను స్పష్టంగా పేర్కొంటుంది; వాటిని లింగతటస్థ పదంతో కలిపివేయలేదు.
- issue: ఆజ్ఞలలో ఏకవచనం నుండి బహువచనానికి మార్పు
  choice: దెబ్బకొట్టు ... అంకితం చేయండి ... చంపండి
  alternative: అన్నిటినీ ఏకవచన ఆజ్ఞలుగా లేదా అన్నిటినీ బహువచన ఆజ్ఞలుగా సమతలీకరించడం
  rationale: WLC పాఠ్యంలో לֵךְ/וְהִכִּיתָה ఏకవచనంగా, וְהַחֲרַמְתֶּם/וְהֵמַתָּה బహువచనంగా ఉన్నాయి. ఈ అసాధారణ మార్పును నిశ్శబ్దంగా సవరించకుండా తెలుగు పాఠ్యంలో నిలిపారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆజ్ఞ యొక్క గంభీరతను మృదుపరచకుండా, పాతకాలపు కృత్రిమ పదజాలాన్ని నివారించింది. మూలంలోని ‘నుండి...వరకు’ మెరిసాలు మరియు ఏకవచన-బహువచన ఆజ్ఞామార్పు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
