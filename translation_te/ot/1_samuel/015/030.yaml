- from: అప్పుడు అతడు, “నేను పాపం చేశాను. ఇప్పుడు దయచేసి నా ప్రజల పెద్దల ఎదుట, ఇశ్రాయేలు ఎదుట నన్ను ఘనపరచండి. నాతో తిరిగి రండి; అప్పుడు నేను మీ దేవుడైన యెహోవాకు సాష్టాంగపడతాను[a]” అన్నాడు.
