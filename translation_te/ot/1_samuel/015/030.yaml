id: 1SA.15.30
reference: 1 Samuel 15:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חָטָ֔אתִי עַתָּ֗ה כַּבְּדֵ֥/נִי נָ֛א נֶ֥גֶד זִקְנֵֽי עַמִּ֖/י וְ/נֶ֣גֶד יִשְׂרָאֵ֑ל וְ/שׁ֣וּב עִמִּ֔/י וְ/הִֽשְׁתַּחֲוֵ֖יתִי לַֽ/יהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “నేను పాపం చేశాను. ఇప్పుడు దయచేసి నా ప్రజల పెద్దల ఎదుటా ఇశ్రాయేలు ఎదుటా నాకు గౌరవం ఇవ్వండి. నేను మీ దేవుడైన యాహ్వేకు నమస్కరించేందుకు నాతో తిరిగి రండి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాతో తిరిగి రండి; నేను మీ దేవుడైన యాహ్వేకు నమస్కరిస్తాను.” హీబ్రూలోని ఈ రూపాన్ని ముందున్న అభ్యర్థన ఉద్దేశాన్ని సూచించినట్లుగానూ, లేదా తరువాతి కార్యాన్ని సాధారణంగా కొనసాగించినట్లుగానూ అర్థం చేసుకోవచ్చు.
    reason: The Hebrew conjunction and verbal form can indicate purpose after the request or simple continuation; the footnote preserves the alternative.
lexical_decisions:
- source_word: חָטָאתִי
  choice: నేను పాపం చేశాను
  rationale: Qal perfect first-person singular. Immediate confession in natural modern Telugu; the completed action remains clear.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: The temporal adverb marks Saul’s immediate request following his confession.
- source_word: כַּבְּדֵנִי נָא
  choice: దయచేసి ... నన్ను ఘనపరచండి
  rationale: The Piel imperative asks Samuel to accord Saul public honor; దయచేసి represents נָא, and ఘనపరచండి conveys social honor without suggesting that Saul asks for worship.
- source_word: נֶגֶד זִקְנֵי עַמִּי וְנֶגֶד יִשְׂרָאֵל
  choice: నా ప్రజల పెద్దల ఎదుట, ఇశ్రాయేలు ఎదుట
  rationale: ఎదుట conveys public presence or visibility. The wording retains Saul’s ‘my people’ and does not add ‘all’ before Israel.
- source_word: וְשׁוּב עִמִּי
  choice: నాతో తిరిగి రండి
  rationale: שׁוב here requests that Samuel return or go back in Saul’s company.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: అప్పుడు నేను ... సాష్టాంగపడతాను
  rationale: The form denotes bowing oneself down in homage or worship. సాష్టాంగపడతాను preserves the embodied action, while అప్పుడు presents it as following the requested return without forcing a strictly purpose-only reading.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: మీ దేవుడైన యెహోవాకు
  rationale: Preserves the divine name and the explicit second-person singular suffix, while using respectful Telugu address to Samuel.
theological_decisions:
- issue: Rendering of יהוה
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: The personal divine name is retained as a name rather than replaced with a title. యెహోవా is the established, broadly intelligible Telugu biblical form.
- issue: Saul’s wording אֱלֹהֶיךָ (‘your God’)
  choice: మీ దేవుడు
  alternative: మన దేవుడు / దేవుడు
  rationale: The Hebrew explicitly says ‘your God.’ Preserving it maintains the narrative and theological tension rather than making Saul speak of God as ‘our God.’
- issue: Force of וְהִשְׁתַּחֲוֵיתִי
  choice: అప్పుడు నేను ... సాష్టాంగపడతాను
  alternative: నేను ... సాష్టాంగపడేలా / మరియు నేను ... సాష్టాంగపడతాను
  rationale: The prefixed conjunction may continue the sequence or carry a purpose/result nuance after the request. The main text uses a natural sequential-result expression, and the footnote preserves the alternatives.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవార్థక బహువచనంతో సమూయేలును సంబోధించింది. వాక్యం గంభీరంగా ఉన్నా సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించబడింది. ‘మీ దేవుడు’ అనే అసౌకర్యకరమైన కానీ ముఖ్యమైన ఉద్రిక్తతను అలాగే నిలిపింది.
