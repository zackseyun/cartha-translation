id: 1SA.15.22
reference: 1 Samuel 15:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַ/חֵ֤פֶץ לַֽ/יהוָה֙ בְּ/עֹל֣וֹת וּ/זְבָחִ֔ים כִּ/שְׁמֹ֖עַ בְּ/ק֣וֹל יְהוָ֑ה הִנֵּ֤ה שְׁמֹ֨עַ֙ מִ/זֶּ֣בַח ט֔וֹב לְ/הַקְשִׁ֖יב מֵ/חֵ֥לֶב אֵילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: te
  text: 'అప్పుడు సమూయేలు ఇలా అన్నాడు: “యెహోవా స్వరానికి లోబడడంలో ఉన్నంత ఆనందం యెహోవాకు దహనబలులలోను బలులలోను ఉందా? ఇదిగో, బలికంటే లోబడడం మేలు; పొట్టేళ్ల కొవ్వుకంటే శ్రద్ధగా వినడం మేలు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: ఆనందిస్తాడా
  rationale: ఇక్కడ חפץ అనేది కేవలం ఇష్టపడడం కాక, దేనిలో ప్రసన్నత లేదా ఆనందం పొందుతాడనే భావాన్ని ఇస్తుంది.
- source_word: כִּשְׁמֹעַ בְּקוֹל יְהוָה
  choice: యెహోవా స్వరానికి లోబడడంలో
  rationale: శబ్దార్థంగా ‘యెహోవా స్వరాన్ని వినడం’; సందర్భంలో వినడంలో అంతర్భూతమైన విధేయతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి ప్రకటనపై బలమైన దృష్టిని నిలుపుతుంది.
- source_word: שְׁמֹעַ
  choice: లోబడడం
  rationale: ఈ సందర్భంలో ‘వినడం’ కార్యరూపమైన విధేయతను సూచిస్తుంది; తొలి సమాంతర పాదంలో ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: לְהַקְשִׁיב
  choice: శ్రద్ధగా వినడం
  rationale: హిఫీల్ రూపం చెవియొగ్గి శ్రద్ధ పెట్టడాన్ని సూచిస్తుంది; సమాంతరతను కాపాడుతూ సాధారణ ‘వినడం’ కంటే గాఢమైన భావాన్ని ఇస్తుంది.
- source_word: מֵחֵלֶב אֵילִים
  choice: పొట్టేళ్ల కొవ్వు అర్పించడం కంటే
  rationale: బలిలో ఉత్తమ భాగంగా పరిగణించిన పొట్టేళ్ల కొవ్వును సూచిస్తుంది; తెలుగులో పోలికను సహజంగా పూర్తి చేయడానికి ‘అర్పించడం’ పూరించబడింది.
theological_decisions:
- issue: బలి మరియు విధేయత మధ్య సంబంధం
  choice: ‘బలి అర్పించడం కంటే లోబడడం మేలు’ అని తులనాత్మకంగా అనువదించడం
  alternative: బలులను దేవుడు పూర్తిగా తిరస్కరిస్తున్నట్లు నిరపేక్షంగా చెప్పడం
  rationale: హీబ్రూ వాక్యం బలులకన్నా విధేయతకు ప్రాధాన్యం ఇస్తుంది; దేవుడు ఆజ్ఞాపించిన బలి వ్యవస్థను స్వతహాగా రద్దు చేస్తున్నట్లు చెప్పదు.
- issue: దైవనామం יהוה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠంలోని ప్రత్యేక దైవనామాన్ని తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. హీబ్రూ సమాంతర నిర్మాణం, ప్రశ్నార్థక ధోరణి, ‘ఇదిగో’ అనే ఉద్ఘాటన నిలుపబడ్డాయి.
