revisions:
- from: అప్పుడు సౌలు సమూయేలుతో, “నేను పాపం చేశాను. యాహ్వే ఆజ్ఞను[a], నీ మాటలను మీరాను; ఎందుకంటే నేను ప్రజలకు భయపడి వారి స్వరం విన్నాను[b]” అన్నాడు.
  to: అప్పుడు సౌలు సమూయేలుతో ఇలా అన్నాడు, “నేను పాపం చేశాను; యాహ్వే ఆజ్ఞను[a], నీ మాటలను అతిక్రమించాను. ఎందుకంటే నేను ప్రజలకు భయపడి వారి మాట విన్నాను[b].”
  rationale: 'The revision makes two safe idiomatic improvements without changing the source meaning: ‘అతిక్రమించాను’ naturally expresses transgression of both Yahweh’s command and Samuel’s words, and ‘వారి మాట విన్నాను’ is standard Telugu for the Hebrew expression. The footnote preserves the Hebrew’s literal ‘voice’ wording and its possible implication of obedience.'
