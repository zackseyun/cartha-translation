id: 1SA.15.24
reference: 1 Samuel 15:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל שְׁמוּאֵל֙ חָטָ֔אתִי כִּֽי עָבַ֥רְתִּי אֶת פִּֽי יְהוָ֖ה וְ/אֶת דְּבָרֶ֑י/ךָ כִּ֤י יָרֵ֨אתִי֙ אֶת הָ/עָ֔ם וָ/אֶשְׁמַ֖ע בְּ/קוֹלָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/024.yaml
  text: Then Saul said to Samuel[a], “I have sinned, for I transgressed the command of Yahweh and your words[b], for I feared the people and listened to their voice.”
translation:
  language: te
  text: అప్పుడు సౌలు సమూయేలుతో ఇలా అన్నాడు, “నేను పాపం చేశాను; యాహ్వే ఆజ్ఞను[a], నీ మాటలను అతిక్రమించాను. ఎందుకంటే నేను ప్రజలకు భయపడి వారి మాట విన్నాను[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరాలా, “యాహ్వే నోటిని.” ఇది ఆయన పలికిన ఆజ్ఞను సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారికి లోబడ్డాను.” హెబ్రీలో అక్షరాలా, “వారి స్వరాన్ని విన్నాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: నేను పాపం చేశాను
  rationale: హెబ్రీ పరిపూర్ణ క్రియ ఇక్కడ పూర్తయిన తప్పును సౌలు వ్యక్తిగతంగా ఒప్పుకోవడాన్ని తెలియజేస్తుంది; ఈ తెలుగు రూపం సహజంగా, స్పష్టంగా ఉంది.
- source_word: עָבַרְתִּי
  choice: మీరాను
  rationale: ఆజ్ఞను అతిక్రమించడం అనే నైతిక భావాన్ని ‘మీరాను’ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: פִּי יְהוָה
  choice: యాహ్వే ఆజ్ఞను
  rationale: అక్షరార్థంగా ‘యాహ్వే నోరు’; సందర్భంలో ఇది యాహ్వే పలికిన నిర్దిష్ట ఆజ్ఞను సూచించే హెబ్రీ నుడికారం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యనువాదంగా అందిస్తుంది.
- source_word: דְּבָרֶיךָ
  choice: నీ మాటలను
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న బహువచన రూపాన్ని నేరుగా నిలుపుతూ, సమూయేలు పలికిన మాటలను సూచిస్తుంది.
- source_word: יָרֵאתִי אֶת הָעָם
  choice: నేను ప్రజలకు భయపడి
  rationale: సౌలు ఇచ్చిన కారణాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తూ, ‘ప్రజలు’ అనే విస్తృత పదాన్ని నిలుపుతుంది.
- source_word: וָאֶשְׁמַע בְּקוֹלָם
  choice: వారి స్వరం విన్నాను
  rationale: అక్షరార్థమైన ‘వారి స్వరం విన్నాను’ అనే రూపాన్ని నిలుపుతుంది; సందర్భంలో అది వారి మాటకు లోబడటాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; కాబట్టి బిరుదును పెట్టకుండా ధ్వన్యనువాదం చేయబడింది.
- issue: פִּי יְהוָה అనే నుడికారం
  choice: యాహ్వే ఆజ్ఞ
  alternative: యాహ్వే నోరు; యాహ్వే మాట
  rationale: అక్షరార్థంలోని రూపకాన్ని పాదటిప్పణిలో భద్రపరుస్తూ, కథా సందర్భంలోని నిర్దిష్ట దైవ ఆదేశాన్ని ప్రధాన పాఠంలో స్పష్టంగా తెలియజేస్తుంది.
- issue: וָאֶשְׁמַע בְּקוֹלָם లో వినడం–లోబడడం మధ్య భావం
  choice: వారి స్వరం విన్నాను
  alternative: వారి మాటకు లోబడ్డాను
  rationale: సౌలు ప్రజల ఒత్తిడికి లోబడిన భావం సందర్భంలో ఉన్నప్పటికీ, హెబ్రీలోని ‘స్వరం వినడం’ అనే వ్యక్తీకరణను ప్రధాన పాఠంలో ఉంచి దాని భావాన్ని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘యాహ్వే’ ద్వారా దైవనామం నిలుపబడింది; ‘వారి స్వరం విన్నాను’ ద్వారా మూలంలోని నుడికారం మరియు యాహ్వే స్వరానికి బదులు ప్రజల స్వరం వినడంలోని వ్యతిరేకత భద్రపరచబడ్డాయి.
