source:
  edition: WLC
  text: וַ/יַּחְמֹל֩ שָׁא֨וּל וְ/הָ/עָ֜ם עַל אֲגָ֗ג וְ/עַל מֵיטַ֣ב הַ/צֹּאן֩ וְ/הַ/בָּקָ֨ר וְ/הַ/מִּשְׁנִ֤ים וְ/עַל הַ/כָּרִים֙ וְ/עַל כָּל הַ/טּ֔וֹב וְ/לֹ֥א אָב֖וּ הַחֲרִימָ֑/ם וְ/כָל הַ/מְּלָאכָ֛ה נְמִבְזָ֥ה וְ/נָמֵ֖ס אֹתָ֥/הּ הֶחֱרִֽימוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
translation:
  language: te
  text: కాని సౌలూ ప్రజలూ అగగును, గొర్రెలలోనూ పశువులలోనూ శ్రేష్ఠమైనవాటిని, బలిసినవాటిని[a], పొట్టేళ్లను, మంచిదంతటినీ చంపకుండా విడిచిపెట్టారు; వాటిని నాశనం కోసం ప్రత్యేకించడానికి[b] వారు ఇష్టపడలేదు. అయితే చులకనైనదీ పనికిరానిదీ అయిన ప్రతిదానినీ నాశనం కోసం ప్రత్యేకించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బలిసినవాటిని” అని అనువదించిన హెబ్రీ పదం అర్థం అనిశ్చితం. దానికి “రెండవ శ్రేణివాటిని” లేదా “రెండింతలైనవాటిని” అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ఇది ఒక సాంకేతిక పదం. దేనినైనా నాశనం కోసం ప్రత్యేకించడం, లేదా నిషేధం కింద ఉంచడం అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: చంపకుండా విడిచిపెట్టారు
  rationale: ఈ సందర్భంలో ఆజ్ఞాపించబడిన నాశనాన్ని అమలు చేయకుండా కాపాడడమే క్రియ యొక్క కార్యఫలం. తెలుగు వాక్యంలో కేవలం అంతర్గత జాలి భావం కాకుండా ఆ కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל אֲגָג
  choice: అగగును
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యంతరీకరణలో ఇచ్చాం.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: గొర్రెలలోనూ పశువులలోనూ శ్రేష్ఠమైనవాటిని
  rationale: మందలు, పశుసంపదలో అత్యుత్తమ భాగాన్ని సూచించే నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: הַמִּשְׁנִים
  choice: బలిసినవాటిని
  rationale: ఈ అరుదైన హెబ్రీ పదం అర్థం అనిశ్చితం. సందర్భానుకూలమైన సాంప్రదాయ అవగాహనను ప్రధాన పాఠంలో ఉంచి, అనిశ్చితిని పాదసూచికలో వెల్లడించాం.
- source_word: הַכָּרִים
  choice: పొట్టేళ్లను
  rationale: ఈ పశువుల జాబితాలో మగ గొర్రెలను సూచించే సాధారణ అర్థాన్ని ఎంచుకున్నాం.
- source_word: כָּל הַטּוֹב
  choice: మంచిదంతటినీ
  rationale: జాబితాలో పేర్కొన్న జంతువులకు మించి విలువైనదిగా భావించిన సమస్తాన్ని సూచించే విస్తృత భావాన్ని నిలిపింది.
- source_word: לֹא אָבוּ
  choice: వారు ఇష్టపడలేదు
  rationale: అసమర్థతను కాకుండా ఉద్దేశపూర్వకమైన అయిష్టతను తెలియజేస్తుంది.
- source_word: הַחֲרִימָם / הֶחֱרִימוּ
  choice: నాశనానికి అంకితం చేయడానికి / నాశనానికి అంకితం చేశారు
  rationale: חרם అనే సాంకేతిక పదంలో ఉన్న అంకితభావాన్నీ, దాని ఫలితమైన నాశనాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: כָל־הַמְּלָאכָה נְמִבְזָה וְנָמֵס
  choice: చులకనైనదీ పనికిరానిదీ అయిన ప్రతిదానినీ
  rationale: ఇక్కడ מְלָאכָה సంపాదించిన వస్తువులు లేదా ఆస్తిని సమష్టిగా సూచిస్తుంది; రెండు విశేషణాల మూల్యాంకన భావాన్ని సహజ తెలుగులో తెలిపాం.
theological_decisions:
- issue: యుద్ధ సందర్భంలో חרם పదం అనువాదం
  choice: నాశనానికి అంకితం చేయడం
  alternative: పూర్తిగా నాశనం చేయడం; నిషేధానికి లోబరచడం
  rationale: సౌలు చేసిన తప్పు కేవలం కొందరిని చంపకపోవడం మాత్రమే కాకుండా, దేవుని తీర్పు కింద నాశనానికి ప్రత్యేకించబడిన వాటిని అలా చేయకపోవడమని హెబ్రీ పదం సూచిస్తుంది. ఎంపిక చేసిన పదబంధం ఈ సాంకేతిక భావాన్నీ దాని తీవ్రతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వచనశైలి ఉపయోగించాం. పశువుల జాబితా స్పష్టంగా ఉండేలా పదాలను ఎంచుకున్నాం; అరుదైన הַמִּשְׁנִים పదంలోని నిజమైన అనిశ్చితిని పాదసూచికలో నిలిపాం. חרם పదం యొక్క సాంకేతిక-తీర్పు భావాన్ని ఏ సిద్ధాంత సంప్రదాయానికీ ప్రత్యేకంగా మళ్లించకుండా అనువదించాం.
