source:
  edition: WLC
  text: וְ/לֹא יָסַ֨ף שְׁמוּאֵ֜ל לִ/רְא֤וֹת אֶת שָׁאוּל֙ עַד י֣וֹם מוֹת֔/וֹ כִּֽי הִתְאַבֵּ֥ל שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יהוָ֣ה נִחָ֔ם כִּֽי הִמְלִ֥יךְ אֶת שָׁא֖וּל עַל יִשְׂרָאֵֽל־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
translation:
  language: te
  text: సమూయేలు మరణించే రోజు వరకు అతడు సౌలును ఇక మళ్లీ చూడలేదు[a]. ఎందుకంటే సమూయేలు సౌలును గురించి దుఃఖించాడు. సౌలును ఇశ్రాయేలుపై రాజుగా చేసినందుకు యాహ్వే విచారించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అతని మరణదినం వరకు.’ హెబ్రీలో ‘అతని’ అనేది వ్యాకరణపరంగా సమూయేలును లేదా సౌలును సూచించవచ్చు. అయితే కథా క్రమం ప్రకారం ఇక్కడ సమూయేలే ఉద్దేశించబడ్డాడు.
    reason: referential_ambiguity
  - marker: b
    text: లేదా, ‘పశ్చాత్తాపపడ్డాడు,’ ‘విచారంతో మనసు మార్చుకున్నాడు.’ సందర్భాన్ని బట్టి ఈ హెబ్రీ క్రియకు విభిన్న అర్థఛాయలు ఉంటాయి; ఇక్కడ సౌలును రాజుగా చేసినందుకు యాహ్వే పొందిన విచారాన్ని ఇది వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף ... לִרְאוֹת
  choice: మళ్లీ చూడలేదు
  rationale: నిషేధంతో వచ్చిన יָסַף + క్రియారూపం ‘ఇక మళ్లీ చేయలేదు’ అనే అర్థమిచ్చే హెబ్రీ నుడికారం. ‘మళ్లీ చూడలేదు’ సహజమైన ఆధునిక తెలుగు.
- source_word: לִרְאוֹת אֶת שָׁאוּל
  choice: సౌలును చూడలేదు
  rationale: ראה అనే సాధారణ ‘చూడు’ క్రియను నేరుగా నిలుపుతుంది; సందర్భంలో ఇక వ్యక్తిగతంగా కలుసుకోలేదనే భావం కూడా అంతర్లీనంగా ఉంటుంది.
- source_word: עַד יוֹם מוֹתוֹ
  choice: తాను చనిపోయే రోజు వరకు
  rationale: ‘అతని మరణదినం వరకు’ అనే హెబ్రీ భావాన్ని సహజ తెలుగులో అందిస్తుంది. కథా సందర్భం ప్రకారం ప్రధాన పాఠ్యంలో ‘తాను’ సమూయేలును సూచిస్తుంది; వ్యాకరణపరమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: הִתְאַבֵּל
  choice: దుఃఖించాడు
  rationale: ఈ రూపం లోతుగా శోకించడం లేదా దుఃఖించడం అనే భావాన్ని ఇస్తుంది. సౌలు పతనంపై సమూయేలు పొందిన శోకాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל שָׁאוּל
  choice: సౌలును గురించి
  rationale: అక్షరార్థంగా ‘సౌలు వైపు’ అయినా, దుఃఖాన్ని తెలిపే క్రియతో ఇది సౌలును గూర్చిన శోకాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ వ్యక్తిగత నామానికి తెలుగు లిప్యంతరీకరణగా నిలుపుతుంది.
- source_word: נִחָם
  choice: విచారించాడు
  rationale: సౌలును రాజుగా చేసినందుకు యాహ్వే పొందిన విచారం/పశ్చాత్తాపాన్ని వ్యక్తం చేస్తుంది; దేవునికి ఆపాదించిన భావోద్వేగ భాషను మృదువుగా తొలగించదు.
- source_word: הִמְלִיךְ
  choice: రాజుగా చేసినందుకు
  rationale: מלך హిఫీల్ రూపం ‘ఒకరిని రాజుగా చేయడం’ అని సూచిస్తుంది. ఈ తెలుగు నిర్మాణం సూటిగా, సహజంగా ఉంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై
  rationale: రాజాధికార పరిధిని తెలిపే עַלను తెలుగులో సహజంగా ‘పై’ అని అందిస్తుంది.
theological_decisions:
- issue: נִחָםలో దేవునికి ఆపాదించిన విచారం
  choice: విచారించాడు
  alternative: పశ్చాత్తాపపడ్డాడు; తన నిర్ణయాన్ని మార్చుకున్నాడు
  rationale: ఇక్కడ క్రియకు వెంటనే ‘సౌలును రాజుగా చేసినందుకు’ అనే కారణవాక్యం ఉంది. అందువల్ల ‘విచారించాడు’ సందర్భానికి సరిపోతూ, దేవుని స్పందనకు సంబంధించిన పాఠ్యంలోని theological tensionను అలాగే ఉంచుతుంది; దానిని కేవలం పరిపాలనా నిర్ణయ మార్పుగా కుదించదు.
- issue: עַד יוֹם מוֹתוֹలోని సర్వనామ సూచన
  choice: సమూయేలు తాను చనిపోయే రోజు వరకు
  alternative: సౌలు చనిపోయే రోజు వరకు
  rationale: హెబ్రీ పురుష ఏకవచన ప్రత్యయం వ్యాకరణపరంగా సమూయేలు లేదా సౌలును సూచించగలదు. అయితే 1 సమూయేలు 25:1లో సమూయేలు మరణం, సౌలు ఇంకా జీవించి ఉన్న కథా క్రమం ప్రధాన పాఠ్యంలోని ఎంపికకు బలం ఇస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘యాహ్వే’ అనే వ్యక్తిగత దైవనామం నిలుపబడింది. హెబ్రీ నుడికారాలను యాంత్రికంగా అనుకరించకుండా అర్థాన్ని స్పష్టంగా అందిస్తూ, సర్వనామ సూచనలోని అస్పష్టతను మరియు נִחָםలోని theological tensionను పాదసూచికలతో సంరక్షించాం.
