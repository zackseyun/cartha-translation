id: 1SA.15.18
reference: 1 Samuel 15:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלָחֲ/ךָ֥ יְהוָ֖ה בְּ/דָ֑רֶךְ וַ/יֹּ֗אמֶר לֵ֣ךְ וְ/הַחֲרַמְתָּ֞ה אֶת הַֽ/חַטָּאִים֙ אֶת עֲמָלֵ֔ק וְ/נִלְחַמְתָּ֣ ב֔/וֹ עַ֥ד כַּלּוֹתָ֖/ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
translation:
  language: te
  text: యాహ్వే నిన్ను ఒక కార్యం కోసం పంపి, ‘వెళ్లి, పాపులైన అమాలేకీయులను[a] నిర్మూలనకు అంకితం చేయి[b]; నీవు వారిని అంతం చేసే వరకు వారితో యుద్ధం చేయి’ అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః ‘పాపులు, అమాలేకు’; ‘అమాలేకు’ అనే పేరు ‘పాపులు’ ఎవరో గుర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పూర్తిగా నాశనం చేయి’; హీబ్రూ క్రియ ప్రత్యేక నిషేధం కింద దేనినైనా నిర్మూలనకు అంకితం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ
  choice: నిన్ను ... పంపి
  rationale: שׁלח అనే క్రియలోని ‘పంపడం’ అనే సాధారణ అర్థాన్ని, వరుసగా జరిగిన చర్యను సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: בְּדָרֶךְ
  choice: ఒక కార్యం కోసం
  rationale: పదశః ‘దారిలో’ అని ఉన్నా, ఇక్కడ సౌలు పంపబడిన నియామకం లేదా కార్యాన్ని సూచించే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో మార్చకుండా పేరుగానే లిప్యంతరీకరిస్తుంది.
- source_word: לֵךְ
  choice: వెళ్లి
  rationale: హీబ్రూ ఆజ్ఞార్థక క్రియలోని నేరుగా ఇచ్చిన ఆదేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהַחֲרַמְתָּה
  choice: నిర్మూలనకు అంకితం చేయి
  rationale: חרם క్రియలో ఉన్న నిషేధం కింద దేవునికి అప్పగించి నాశనం చేసే సాంకేతిక భావాన్ని కేవలం ‘నాశనం చేయి’ అని సరళీకరించకుండా నిలుపుతుంది.
- source_word: הַחַטָּאִים אֶת עֲמָלֵק
  choice: పాపులైన అమాలేకీయులను
  rationale: ‘పాపులు’ అనే నైతిక గుర్తింపును నిలుపుతూ, ‘అమాలేకు’ అనే సమూహనామాన్ని ఆధునిక తెలుగులో ప్రజలను సూచించే సహజ రూపంలో అందిస్తుంది.
- source_word: וְנִלְחַמְתָּ בוֹ
  choice: వారితో యుద్ధం చేయి
  rationale: ఏకవచన సమూహనామమైన ‘అమాలేకు’ ప్రజలను సూచిస్తున్నందున తెలుగులో బహువచన సర్వనామం సహజంగా ఉంటుంది.
- source_word: עַד כַּלּוֹתָם אֹתָם
  choice: వారు అంతమయ్యే వరకు
  rationale: వారిని పూర్తిగా ముగింపుకు తీసుకురావడం అనే భావాన్ని వ్యక్తం చేస్తూ, అసాధారణమైన హీబ్రూ నిర్మాణాన్ని అతిగా వివరణాత్మకం చేయకుండా ఉంచుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపమైన తెలుగు రూపంలో నిలుపుతుంది.
- issue: חרם క్రియలోని పవిత్ర నిషేధం మరియు సంపూర్ణ నాశనం మధ్య ఉద్రిక్తత
  choice: నిర్మూలనకు అంకితం చేయి
  alternative: పూర్తిగా నాశనం చేయి
  rationale: ఈ క్రియ కేవలం సైనిక నాశనాన్ని మాత్రమే కాక, నిషేధం కింద నిర్మూలనకు అప్పగించడాన్ని కూడా సూచిస్తుంది; ఎంపిక చేసిన రూపం రెండు అంశాలనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. హీబ్రూ సమూహనామాన్ని ‘అమాలేకీయులు’గా సహజీకరించగా, ‘పాపులు’ అనే నైతిక విశేషణాన్ని మరియు חרם యొక్క సాంకేతిక భావాన్ని నిలుపుకున్నాం.
