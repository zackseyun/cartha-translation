- from: అయితే సమూయేలు, “అలాగైతే నా చెవులకు వినిపిస్తున్న ఈ గొర్రెల శబ్దమేమిటి? నాకు వినిపిస్తున్న పశువుల శబ్దమేమిటి?[a]” అని అడిగాడు.
  to: అయితే సమూయేలు, “అలాగైతే నా చెవుల్లో పడుతున్న ఈ గొర్రెల శబ్దమేమిటి? నేను వింటున్న పశువుల శబ్దమేమిటి?[a]” అన్నాడు.
  rationale: The revision avoids adding ‘asked’ where the Hebrew says only ‘said,’ improves idiomatic Telugu, and preserves the Hebrew’s rhetorical force, demonstrative ‘this,’ and explicit first-person hearing. The footnote anchor and content remain valid.
