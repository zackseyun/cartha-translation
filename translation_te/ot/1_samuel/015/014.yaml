source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וּ/מֶ֛ה קֽוֹל הַ/צֹּ֥אן הַ/זֶּ֖ה בְּ/אָזְנָ֑/י וְ/ק֣וֹל הַ/בָּקָ֔ר אֲשֶׁ֥ר אָנֹכִ֖י שֹׁמֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/014.yaml
  text: But Samuel said[a], “Then what is this sound of sheep in my ears, and the sound of cattle that I hear?”
translation:
  language: te
  text: అయితే సమూయేలు, “అలాగైతే నా చెవుల్లో పడుతున్న ఈ గొర్రెల శబ్దమేమిటి? నేను వింటున్న పశువుల శబ్దమేమిటి?[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శబ్దం’కు బదులుగా రెండు చోట్లా ‘స్వరం’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం కోల్ ఇక్కడ జంతువులు చేసే వినిపించే ధ్వనిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే సమూయేలు ... అని అడిగాడు
  rationale: సందర్భంలో సమూయేలు సౌలు చెప్పిన విధేయత వాదనను సవాలు చేస్తున్నందున waw-consecutive యొక్క కథన కొనసాగింపుతో కూడిన వ్యతిరేక భావాన్ని ‘అయితే’ తెలియజేస్తుంది. ప్రశ్నతో కూడిన మాట కాబట్టి సహజ తెలుగులో ‘అని అడిగాడు’ అని ఇచ్చాం.
- source_word: וּמֶה
  choice: అలాగైతే ... ఏమిటి?
  rationale: ఈ ప్రశ్న వివరణను కోరుతూ సౌలు వాదనను నిలదీస్తుంది; ‘అలాగైతే’ అనేది అనుసంధానాన్ని, వాక్చాతుర్యపూర్వక సవాలును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קוֹל
  choice: శబ్దం
  rationale: קוֹל అంటే ‘స్వరం’ లేదా ‘శబ్దం’ కావచ్చు; ఇక్కడ జంతువులు చేసే వినిపించే ధ్వనిని సూచిస్తున్నందున ‘శబ్దం’ సహజమైన ఎంపిక.
- source_word: הַצֹּאן
  choice: గొర్రెలు
  rationale: ఈ సమూహవాచకం గొర్రెలు/మేకలతో కూడిన చిన్న పశువులను సూచించగలదు. పశువులతో జతగా ఉన్న ఈ సందర్భంలో సంప్రదాయబద్ధంగా, స్పష్టంగా ఉండే ‘గొర్రెలు’ను ఎంచుకున్నాం.
- source_word: הַזֶּה
  choice: ఈ
  rationale: వెంటనే వినిపిస్తున్న శబ్దాన్ని చూపించే నిర్దేశక భావాన్ని ‘ఈ’ నిలుపుతుంది.
- source_word: בְּאָזְנָי
  choice: నా చెవులకు వినిపిస్తున్న
  rationale: హెబ్రీలో అక్షరార్థంగా ‘నా చెవుల్లో’ ఉన్న సజీవ చిత్రాన్ని తెలుగులో సహజంగా, అర్థవంతంగా ‘నా చెవులకు వినిపిస్తున్న’ అని వ్యక్తం చేశాం.
- source_word: וְקוֹל הַבָּקָר
  choice: పశువుల శబ్దం
  rationale: בקר అనేది మందలోని పెద్ద పశువులకు సమూహవాచకం. ‘ఎద్దులు’ కంటే ‘పశువులు’ విస్తృతమైనది, సందర్భానికి తగినది.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: నాకు వినిపిస్తున్న
  rationale: ఈ సంబంధవాచక వాక్యం సమూయేలు నిజంగా వింటున్న సాక్ష్యాన్ని గుర్తిస్తుంది. אָנֹכִי లోని స్పష్టమైన ప్రథమ పురుష భావాన్ని ‘నాకు’ నిలుపుతుంది.
