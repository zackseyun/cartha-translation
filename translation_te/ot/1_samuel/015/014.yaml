translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. సమూయేలు ప్రశ్నలోని వ్యతిరేకతను, వ్యంగ్యసవాలును అతిగా వ్యాఖ్యానించకుండా నిలిపాం; ప్రధాన వచనంలోని [a] గుర్తు పాదసూచికతో సరిపోలుతుంది.
