- from: ఎందుకంటే తిరుగుబాటు సోదె చెప్పే పాపం వంటిది[a]; మొండిపట్టు దుష్టత్వం, గృహదేవతల విగ్రహాలు[b] వంటిది. నీవు యెహోవా మాటను తిరస్కరించావు కాబట్టి, ఆయన కూడా నీవు రాజుగా ఉండకుండా నిన్ను తిరస్కరించాడు[c].
