  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
translation:
  language: te
  text: ఎందుకంటే తిరుగుబాటు సోదెవిద్య అనే పాపం వంటిది[a]; మొండిపట్టు దుష్టత్వం, ఇంటిదేవతల విగ్రహాలు రెండింటి వంటిది[b]. నీవు యెహోవా మాటను తిరస్కరించావు కాబట్టి, ఆయన కూడా నీవు రాజుగా ఉండకుండా నిన్ను తిరస్కరించాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శకునవిద్య అనే పాపం వంటిది.’ హీబ్రూ קֶסֶם పదం నిషిద్ధ మార్గాల ద్వారా రహస్య జ్ఞానాన్ని తెలుసుకోవడానికి చేసే దైవజ్ఞాన ప్రయత్నాన్ని విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ తెరాఫీము—ఇళ్లలో ఉంచుకునే ఆరాధనా ప్రతిమలు లేదా విగ్రహాలు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఆయన కూడా నిన్ను రాజుగా తిరస్కరించాడు.’
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి గద్దింపుకు కారణాన్ని తెలిపే వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది; తరువాతి יַעַן తెలిపే నిర్దిష్ట కారణవాక్యాన్ని ‘కాబట్టి’తో వేరు చేశాం.
- source_word: חַטַּאת קֶסֶם
  choice: సోదె చెప్పే పాపం
  rationale: קֶסֶם నిషిద్ధ మార్గాల్లో రహస్య జ్ఞానాన్ని తెలుసుకోవడానికి చేసే దైవజ్ఞాన ప్రయత్నాన్ని సూచిస్తుంది. ‘సోదె చెప్పడం’ సాధారణ తెలుగు పాఠకులకు అర్థమయ్యే సహజ పదబంధం.
- source_word: מֶרִי
  choice: తిరుగుబాటు
  rationale: అధికారానికి ఉద్దేశపూర్వకంగా లోబడకపోవడాన్ని, ఇక్కడ యెహోవా ఆజ్ఞకు సౌలు చూపిన ధిక్కారాన్ని, బలంగా వ్యక్తం చేస్తుంది.
- source_word: וְאָוֶן
  choice: దుష్టత్వం
  rationale: గృహదేవతల విగ్రహాలతో ఉన్న సమాంతర నిర్మాణంలో ఈ పదం కేవలం కష్టాన్ని కాక నైతిక చెడును సూచిస్తుంది.
- source_word: וּתְרָפִים
  choice: గృహదేవతల విగ్రహాలు
  rationale: తెరాఫీము ఇంటిలో ఉంచుకునే ఆరాధనా ప్రతిమలు; భావాన్ని అనువదించడం ఆధునిక పాఠకునికి స్పష్టత ఇస్తుంది.
- source_word: הַפְצַר
  choice: మొండిపట్టు
  rationale: లొంగకుండా తన మాటనే నెగ్గించుకోవాలనే పట్టుదల లేదా దురహంకారాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יַעַן
  choice: కాబట్టి
  rationale: సౌలు చేసిన తిరస్కారమే అతనిపై వచ్చిన తీర్పుకు కారణమని స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  choice: నీవు యెహోవా మాటను తిరస్కరించావు
  rationale: מָאַס యొక్క ‘తిరస్కరించు/తోసిపుచ్చు’ భావాన్ని నిలుపుతూ, తరువాత అదే ధాతువు పునరావృతమయ్యే వాక్చాతుర్యాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ప్రతిలిపి చేస్తుంది.
- source_word: וַיִּמְאָסְךָ מִמֶּלֶךְ
  choice: ఆయన కూడా నీవు రాజుగా ఉండకుండా నిన్ను తిరస్కరించాడు
  rationale: మునుపటి ‘తిరస్కరించావు’ అనే క్రియను పునరావృతం చేసి మూలంలోని సమరూపతను నిలుపుతుంది; מִן రాజస్థానం నుండి తొలగింపును సూచిస్తుందని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: మొదటి రెండు పాదాల్లోని పోలిక నిర్మాణం
  choice: తిరుగుబాటును సోదె చెప్పే పాపంతో, మొండిపట్టును దుష్టత్వం మరియు గృహదేవతల విగ్రహాలతో పోల్చడం
  alternative: తిరుగుబాటే సోదె చెప్పే పాపం, మొండిపట్టే దుష్టత్వం మరియు తెరాఫీము అని సమానీకరించడం
  rationale: హీబ్రూలో రెండో ‘వంటిది’ స్పష్టంగా లేకపోయినా, కవితాత్మక సమాంతర నిర్మాణం మొదటి పోలిక బలాన్ని రెండో పాదానికీ వర్తింపజేయడానికి బలమైన ఆధారం ఇస్తుంది. దీనివల్ల భావతీవ్రతను తగ్గించకుండా సహజమైన తెలుగు వస్తుంది.
- issue: రాజత్వం నుండి తిరస్కరణ యొక్క భావం
  choice: నీవు రాజుగా ఉండకుండా నిన్ను తిరస్కరించాడు
  alternative: నిన్ను రాజుగా తిరస్కరించాడు
  rationale: מִמֶּלֶךְ లోని מן రాజస్థితి నుండి తొలగింపును సూచించవచ్చు. ప్రధాన పాఠం ఆ భావాన్ని స్పష్టంగా ఇస్తూ, సంక్షిప్త ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని రెండు సార్లు వచ్చే ‘తిరస్కరించు’ అనే వాక్చాతుర్యాన్ని నిలిపాం. ‘సోదె చెప్పడం,’ ‘గృహదేవతల విగ్రహాలు’ వంటి పదాలతో ప్రాచీన ఆచారాల భావాన్ని సాంకేతిక భారంలేకుండా అందించాం.
