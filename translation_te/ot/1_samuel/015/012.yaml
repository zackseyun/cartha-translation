  text: וַ/יַּשְׁכֵּ֧ם שְׁמוּאֵ֛ל לִ/קְרַ֥את שָׁא֖וּל בַּ/בֹּ֑קֶר וַ/יֻּגַּ֨ד לִ/שְׁמוּאֵ֜ל לֵ/אמֹ֗ר בָּֽא שָׁא֤וּל הַ/כַּרְמֶ֨לָ/ה֙ וְ/הִנֵּ֨ה מַצִּ֥יב ל/וֹ֙ יָ֔ד וַ/יִּסֹּב֙ וַֽ/יַּעֲבֹ֔ר וַ/יֵּ֖רֶד הַ/גִּלְגָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/012.yaml
  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
translation:
  language: te
  text: సమూయేలు సౌలును కలుసుకోవడానికి ఉదయాన్నే లేచాడు. అప్పుడు సమూయేలుకు, “సౌలు కర్మెలుకు వచ్చాడు. ఇదిగో, తనకోసం ఒక స్మారక చిహ్నాన్ని[a] నిలబెట్టాడు; తరువాత తిరిగి ముందుకు సాగి గిల్గాలుకు దిగిపోయాడు” అని సమాచారం అందింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “తనకోసం ఒక చెయ్యి.” ఇక్కడ “చెయ్యి” అనేది జ్ఞాపక చిహ్నాన్ని లేదా స్మారక చిహ్నాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: ఉదయాన్నే లేచి
  rationale: హీబ్రూ పదబంధంలోని తెల్లవారుజామునే లేచిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לִקְרַאת שָׁאוּל
  choice: సౌలును కలుసుకోవడానికి బయలుదేరాడు
  rationale: לִקְרַאת లోని ఉద్దేశ్యంతో ఎదురుగా వెళ్లే భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘కలుసుకోవడానికి’ కంటే ప్రయాణ సందర్భానికి ‘బయలుదేరాడు’ సహజంగా సరిపోతుంది.
- source_word: וַיֻּגַּד לִשְׁמוּאֵל לֵאמֹר
  choice: సమూయేలుకు ... అని సమాచారం అందింది
  rationale: వార్త చెప్పిన వ్యక్తి ఎవరో మూలపాఠం పేర్కొనలేదు; కర్తను చేర్చకుండా హీబ్రూ కర్మణి రూపాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: בָּא שָׁאוּל הַכַּרְמֶלָה
  choice: సౌలు కర్మెలుకు వచ్చాడు
  rationale: దిశను సూచించే ה ను ‘కు’ ద్వారా చూపిస్తూ, నివేదిత మాటలోని ‘వచ్చాడు’ అనే దృష్టికోణాన్ని నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షించే హీబ్రూ సంభాషణ సూచకానికి గౌరవప్రదమైన, ఇప్పటికీ అర్థమయ్యే తెలుగు సమానం.
- source_word: מַצִּיב לוֹ יָד
  choice: తనకోసం ఒక స్మారక చిహ్నాన్ని నిలబెట్టాడు
  rationale: יָד అక్షరార్థంగా ‘చెయ్యి’ అయినా, ఇక్కడ స్వీయ గౌరవార్థం నిలిపిన జ్ఞాపక సూచికను సూచిస్తుంది. ‘స్మారక చిహ్నం’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది; ‘తనకోసం’ లోֹ యొక్క స్వప్రయోజన భావాన్ని నిలుపుతుంది.
- source_word: וַיִּסֹּב וַיַּעֲבֹר
  choice: అక్కడి నుండి తిరిగి ముందుకు సాగి
  rationale: తిరగడం, ఆపై ప్రయాణాన్ని కొనసాగించడం అనే వరుస కదలికలను సహజ తెలుగులో వ్యక్తపరుస్తుంది; ‘అక్కడి నుండి’ సందర్భంలో అంతర్లీనమైన బయలుదేరే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיֵּרֶד הַגִּלְגָּל
  choice: గిల్గాలుకు దిగిపోయాడు
  rationale: ירד లోని భౌగోళికంగా దిగివెళ్లే భావాన్ని నిలుపుతుంది.
