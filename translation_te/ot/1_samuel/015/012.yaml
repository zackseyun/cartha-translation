translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వ్యక్తి, స్థల నామాలకు సాధారణ తెలుగు బైబిలు రూపాలైన ‘సమూయేలు,’ ‘సౌలు,’ ‘కర్మెలు,’ ‘గిల్గాలు’ ఉపయోగించబడ్డాయి. మూలంలో వార్త చెప్పిన వ్యక్తి అనిర్దిష్టంగా ఉండటాన్ని అలాగే ఉంచి, ప్రయాణ క్రియల వరుసను స్పష్టంగా అందించాం.
