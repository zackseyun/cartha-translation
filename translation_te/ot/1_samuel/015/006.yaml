source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל אֶֽל הַ/קֵּינִ֡י לְכוּ֩ סֻּ֨רוּ רְד֜וּ מִ/תּ֣וֹךְ עֲמָלֵקִ֗י פֶּן אֹֽסִפְ/ךָ֙ עִמּ֔/וֹ וְ/אַתָּ֞ה עָשִׂ֤יתָה חֶ֨סֶד֙ עִם כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/עֲלוֹתָ֖/ם מִ/מִּצְרָ֑יִם וַ/יָּ֥סַר קֵינִ֖י מִ/תּ֥וֹךְ עֲמָלֵֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
translation:
  language: te
  text: అప్పుడు సౌలు కేనీయులతో[a], “వెళ్లండి, పక్కకు తొలగి, అమాలేకీయుల మధ్యనుండి దిగిపోండి. లేకపోతే వారితోపాటు మిమ్మల్నీ తుడిచివేస్తాను[b]. ఇశ్రాయేలు కుమారులందరూ[d] ఐగుప్తు నుండి పైకి వచ్చినప్పుడు మీరు వారికి దయ[c] చూపించారు” అన్నాడు. కాబట్టి కేనీయులు అమాలేకీయుల మధ్యనుండి తొలగిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘కేనీయుడు’ అని ఏకవచన జాతివాచకం ఉంది; అయితే అది కేనీయుల సమూహాన్ని సూచిస్తుంది, తరువాతి ఆజ్ఞలు బహువచనంలో ఉన్నాయి.
    reason: source_ambiguity
  - marker: b
    text: లేదా ‘వారితోపాటు మిమ్మల్నీ నాశనం చేస్తాను.’ ఇక్కడి హీబ్రూ క్రియకు తీర్పులో ఇతరులతో కలిపి తొలగించడం లేదా తుడిచివేయడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘దయ’కు హీబ్రూ పదం חֶסֶד (హెసెద్); సందర్భానుసారం ఇది విశ్వాసపూర్వక దయ, నిబద్ధత లేదా విశ్వసనీయతను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: ‘ఇశ్రాయేలు కుమారులందరూ’ అనేది ఇశ్రాయేలు ప్రజలందరినీ సూచించే సాధారణ జాతీయ వ్యక్తీకరణ.
    reason: clarification
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  choice: కేనీయులు
  rationale: హీబ్రూలో ఏకవచన జాతివాచకం సమూహార్థంలో ఉంది; దానితో బహువచన ఆజ్ఞారూపాలు కూడా వాడబడ్డాయి. ఆధునిక తెలుగులో ఆ సమూహార్థాన్ని సహజంగా తెలిపేందుకు బహువచనం వాడాం.
- source_word: לְכוּ סֻּרוּ רְדוּ
  choice: వెళ్లండి, పక్కకు తొలగి, ... దిగిపోండి
  rationale: మూడు వరుస ఆజ్ఞల కదలికను నిలుపుతూ, తెలుగులో సహజంగా వినిపించేలా అనుసంధానించాం.
- source_word: מִתּוֹךְ עֲמָלֵקִי / מִתּוֹךְ עֲמָלֵק
  choice: అమాలేకీయుల మధ్యనుండి
  rationale: మొదటి పదబంధంలోని జాతివాచకాన్ని, చివర ఉన్న సమూహార్థక ‘అమాలేకు’ను సందర్భానుసారం ఒకే స్పష్టమైన తెలుగు రూపంలో అందించాం.
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  choice: లేకపోతే వారితోపాటు మిమ్మల్నీ తుడిచివేస్తాను
  rationale: తీర్పు సందర్భంలో אסף కేవలం ‘సమకూర్చడం’ కాక, ఇతరులతో కలిపి తొలగించడం లేదా నాశనం చేయడం అనే భావాన్ని కలిగిస్తుంది. ‘తుడిచివేస్తాను’ ఆ హెచ్చరిక బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: חֶסֶד
  choice: దయ
  rationale: ఈ మానవ సంబంధ సందర్భంలో חסד చేసిన మేలు, దయ, నమ్మకమైన ఆదరణ వంటి భావాలను కలిగిస్తుంది. ప్రధాన పాఠంలో ‘దయ’ సహజంగా ఉండగా, ‘విశ్వసనీయత/నిబద్ధత’ భావసంభావ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులందరూ
  rationale: హీబ్రూ జాతీయ నామవ్యక్తీకరణను రూపపరంగా నిలిపాం; ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: ఐగుప్తు నుండి పైకి వచ్చినప్పుడు
  rationale: నిర్గమాన్ని వర్ణించే עלה యొక్క ‘పైకి రావడం’ అనే స్పష్టమైన కదలిక భాషను నిలిపాం.
- source_word: וַיָּסַר
  choice: తొలగిపోయారు
  rationale: ముందున్న סור ఆజ్ఞతో పదసంబంధాన్ని నిలుపుతూ, కేనీయులు ఆ ఆజ్ఞకు లోబడినట్లు తెలిపాం.
theological_decisions:
- issue: חֶסֶד పదంలోని సంబంధపరమైన, నైతిక లోతు
  choice: దయ
  alternative: నిబద్ధమైన విశ్వసనీయత / విశ్వాసపూర్వక దయ
  rationale: ఈ వాక్యం కేనీయులు ఇశ్రాయేలుకు గతంలో చేసిన మేలును సూచిస్తుంది; అధికారిక నిబంధన సంబంధాన్ని పాఠ్యంలో నిర్ధారించదు. అందువల్ల ‘నిబంధన విశ్వసనీయత’ అని అధికంగా నిర్దిష్టం చేయకుండా, విస్తృతమైన భావాన్ని పాదటిప్పణితో కాపాడాం.
- issue: బְּנֵי יִשְׂרָאֵל అనే జాతీయ వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులందరూ
  alternative: ఇశ్రాయేలు ప్రజలందరూ / ఇశ్రాయేలీయులందరూ
  rationale: మూలంలోని ‘కుమారులు’ రూపాన్ని ప్రధాన పాఠంలో నిలిపి, అది మొత్తం జాతిని సూచించే సాధారణ వ్యక్తీకరణ అని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: కేనీయుని ఏకవచన రూపం మరియు బహువచన ఆజ్ఞల మధ్య ఉద్రిక్తత
  choice: తెలుగులో సమూహ బహువచనం
  alternative: ఏకవచన ‘కేనీయుడు’ను యథాతథంగా ఉంచడం
  rationale: మూలంలోని ఏకవచనం సమూహార్థకమని, దానితోనే బహువచన ఆజ్ఞలు ఉన్నాయని పాదటిప్పణిలో తెలియజేస్తూ, తెలుగులో అసహజమైన సంఖ్యామార్పును నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని వరుస కదలిక ఆజ్ఞలు, ‘పైకి రావడం’ అనే నిర్గమ భాష, సూర్ ధాతువు పునరావృతం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
