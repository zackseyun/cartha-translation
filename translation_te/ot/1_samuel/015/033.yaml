base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
translation:
  language: te
  text: సమూయేలు, “నీ ఖడ్గం స్త్రీలకు పిల్లల శోకాన్ని కలిగించినట్లే, స్త్రీలలో నీ తల్లికీ పిల్లల శోకం కలుగుతుంది” అని చెప్పాడు.[a] తరువాత సమూయేలు గిల్గాలులో యాహ్వే ఎదుట అగాగును ముక్కలుముక్కలుగా నరికాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ఖడ్గం స్త్రీలను పిల్లలను కోల్పోయినవారిగా చేసినట్లే, నీ తల్లి స్త్రీలలో పిల్లలను కోల్పోయినదిగా అవుతుంది.” హీబ్రూలో రెండు భాగాల్లోనూ ఒకే క్రియ వాడబడింది; అది చేసినదానికి తగిన ప్రతిఫలం అనే భావాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అగాగును ముక్కలుగా కోశాడు”; సాంప్రదాయంగా, “ముక్కలుగా నరికాడు.” ఈ హీబ్రూ క్రియ సాధారణంగా ‘చంపాడు’ అనేదానికంటే బలమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַל (שׁכל)
  choice: సంతానహీనులను చేసినట్లే / సంతానహీనురాలు అవుతుంది
  rationale: ఈ మూలపదం పిల్లలను కోల్పోవడం వల్ల కలిగే సంతానహీన స్థితిని సూచిస్తుంది. రెండు ఉపవాక్యాల్లో ఒకే పదబంధాన్ని నిలుపుకోవడం ద్వారా హీబ్రూలోని కొలిచిన ప్రతీకార భావం, పదపునరుక్తి రెండూ స్పష్టమవుతాయి.
- source_word: חַרְבֶּךָ
  choice: నీ ఖడ్గం
  rationale: అగాగు చేసిన హింసాత్మక కార్యాలకు ఖడ్గం ప్రతీకగా నిలుస్తుంది; తెలుగు భాషలోనూ ఈ ప్రత్యక్ష రూపం సహజంగా అర్థమవుతుంది.
- source_word: מִנָּשִׁים
  choice: స్త్రీలలో
  rationale: מן ఇక్కడ సమూహం మధ్య స్థితిని తెలిపే పోలికలో ఉంది. ‘స్త్రీలలో’ అనేది సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: וַיְשַׁסֵּף
  choice: ముక్కలుముక్కలుగా నరికాడు
  rationale: שׁסף బలమైన, హింసాత్మకమైన నరికివేతను సూచిస్తుంది. ఈ అనువాదం దాని తీవ్రతను తగ్గించకుండా, అదనపు సంచలనాత్మక పదాలను చేర్చకుండా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే ఎదుట
  rationale: לִפְנֵי యొక్క ప్రత్యక్ష స్థల/సన్నిధి భావాన్ని ‘ఎదుట’ సహజంగా అందిస్తుంది; కార్యం దేవుని సమక్షంలో జరిగిందని పాఠ్యం చెప్పినంతవరకే అనువాదం నిలుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరించింది.
- source_word: בַּגִּלְגָּל
  choice: గిల్గాలులో
  rationale: సంఘటన జరిగిన పేరుగల స్థలాన్ని ఆధునిక తెలుగులో సహజంగా సూచించే రూపం.
theological_decisions:
- issue: అగాగు మరణాన్ని తెలిపే హింసాత్మక క్రియ తీవ్రత
  choice: సమూయేలు అగాగును ‘ముక్కలుముక్కలుగా నరికాడు’
  alternative: ‘అగాగును చంపాడు’ లేదా ‘అగాగును నరికాడు’
  rationale: హీబ్రూ వాక్యం కార్యాన్ని సమూయేలుకే ప్రత్యక్షంగా ఆపాదిస్తూ, సాధారణంగా చంపడంకన్నా బలమైన క్రియను వాడుతుంది. అందువల్ల హింసను సమర్థించకుండానే లేదా మృదువుగా మార్చకుండానే మూలంలోని తీవ్రతను నిలిపింది.
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామమే ఉంది. అందువల్ల దానిని ‘యాహ్వే’గా పేరురూపంలో ఉంచింది.
- issue: שׁכל పదంలోని ప్రతీకార సమాంతరత
  choice: రెండు ఉపవాక్యాల్లోనూ ‘సంతానహీన’ అనే ఒకే పదమూలాన్ని ఉపయోగించడం
  alternative: మొదటి భాగంలో ‘పిల్లలను కోల్పోయేలా చేసింది,’ రెండవ భాగంలో ‘పుత్రశోకానికి గురవుతుంది’
  rationale: ఒకే హీబ్రూ మూలపదం రెండుసార్లు రావడం తీర్పులోని కొలిచిన ప్రతిఫలాన్ని బలపరుస్తుంది. తెలుగు రూపం ఆ సమాంతరతను ఉద్దేశపూర్వకంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలి ఉపయోగించబడింది. ‘ఖడ్గం,’ ‘సంతానహీనురాలు’ వంటి పదాలు సందర్భ గౌరవాన్ని నిలుపుతాయి; వాక్య నిర్మాణం మాత్రం సమకాలీనంగా ఉంచబడింది. హింసను మృదువుగా చేయకుండా, సంచలనాత్మకంగా పెంచకుండా అనువదించబడింది.
