id: 1SA.15.26
reference: 1 Samuel 15:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לֹ֥א אָשׁ֖וּב עִמָּ֑/ךְ כִּ֤י מָאַ֨סְתָּה֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֣ יְהוָ֔ה מִ/הְי֥וֹת מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: te
  text: 'అప్పుడు సమూయేలు సౌలుతో ఇలా అన్నాడు: “నేను నీతో తిరిగి రాను. ఎందుకంటే నీవు యాహ్వే మాటను తిరస్కరించావు; యాహ్వే కూడా నీవు ఇశ్రాయేలుపై రాజుగా ఉండకుండా నిన్ను తిరస్కరించాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన శైలిలో ‘అప్పుడు ... అన్నాడు’ సహజంగా ఉంది.
- source_word: לֹא אָשׁוּב עִמָּךְ
  choice: నేను నీతో తిరిగి రాను
  rationale: שׁוּב అంటే తిరిగి రావడం లేదా వెనక్కి వెళ్లడం; సమూయేలు సౌలుతో కలిసి వెళ్లడానికి నిరాకరించిన సందర్భాన్ని ఇది నేరుగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సమూయేలు తిరిగి రానని చెప్పడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: מָאַסְתָּה ... וַיִּמְאָסְךָ
  choice: తిరస్కరించావు ... తిరస్కరించాడు
  rationale: రెండు ఉపవాక్యాల్లోనూ מאס అనే ఒకే మూలపదం ఉంది. అదే తెలుగు క్రియను పునరావృతం చేయడం ద్వారా సౌలు యెహోవా మాటను తిరస్కరించగా యెహోవా సౌలును తిరస్కరించిన ఉద్దేశపూర్వక పరస్పరత నిలుస్తుంది.
- source_word: דְּבַר יְהוָה
  choice: యెహోవా మాటను
  rationale: דָּבָר ఇక్కడ దేవుడు తెలియజేసిన ఆజ్ఞను సూచించినా, ‘మాట’ అనే విస్తృతమైన అర్థాన్ని నిలుపుతూ సహజమైన బైబిలు పదబంధాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించింది.
- source_word: מֵהְיוֹת מֶלֶךְ עַל יִשְׂרָאֵל
  choice: నీవు ఇశ్రాయేలుపై రాజుగా ఉండకుండా
  rationale: מִן తో కూడిన היה క్రియార్థకం ఒక స్థానం లేదా పాత్ర నుంచి తొలగింపును సూచిస్తుంది; עַל లోని ‘పై’ అనే పాలనా భావాన్ని కూడా ఈ రూపం నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సాధారణంగా పరిచితమైన లిప్యంతరీకరణను వాడాం.
- issue: మָאַסְ అనే మూలపదం పరస్పర పునరావృతం
  choice: రెండు చోట్లా ‘తిరస్కరించు’
  alternative: ఒకచోట ‘అసహ్యించు’ లేదా ‘త్రోసివేయు’, మరొకచోట ‘తిరస్కరించు’
  rationale: ఒకే హీబ్రూ మూలపదం ఉద్దేశపూర్వకంగా రెండుసార్లు వాడబడింది. సౌలు చేసిన తిరస్కరణకు ప్రతిగా అతడు రాజుగా తిరస్కరించబడిన theological tension‌ను అదనపు వివరణ లేకుండా పునరావృతమే చూపిస్తుంది.
- issue: మֵהְיוֹת యొక్క పరిధి
  choice: రాజుగా ఉండకుండా నిన్ను తిరస్కరించాడు
  alternative: నిన్ను పూర్తిగా తిరస్కరించాడు; ఇక నీవు రాజువు కావు
  rationale: మూలపాఠం తిరస్కరణను ఇశ్రాయేలుపై రాజుగా ఉండే పాత్రకు అనుసంధానిస్తుంది. దానిని సౌలు వ్యక్తిత్వమంతటికీ వర్తింపజేయకుండా, అలాగే కాలసంబంధమైన ఉద్రిక్తతను ‘ఇక నీవు రాజువు కావు’ అని ముందుగానే పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన కథన స్వరాన్ని నిలుపుతూ అనువదించబడింది. ‘తిరస్కరించు’ అనే కీలక పదం ఉద్దేశపూర్వకంగా పునరావృతమైంది. పాదటిప్పణులు అవసరం లేదు.
