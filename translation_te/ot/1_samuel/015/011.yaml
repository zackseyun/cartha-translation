source:
  edition: WLC
  text: נִחַ֗מְתִּי כִּֽי הִמְלַ֤כְתִּי אֶת שָׁאוּל֙ לְ/מֶ֔לֶךְ כִּֽי שָׁב֙ מֵ/אַֽחֲרַ֔/י וְ/אֶת דְּבָרַ֖/י לֹ֣א הֵקִ֑ים וַ/יִּ֨חַר֙ לִ/שְׁמוּאֵ֔ל וַ/יִּזְעַ֥ק אֶל יְהוָ֖ה כָּל הַ/לָּֽיְלָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
translation:
  language: te
  text: “నేను సౌలును రాజుగా చేసినందుకు చింతిస్తున్నాను[a]. ఎందుకంటే అతడు నన్ను అనుసరించకుండా వెనుదిరిగాడు[b]; నా మాటలను నెరవేర్చలేదు[c].” సమూయేలు కోపంతో మండిపోయాడు[d]; రాత్రంతా యాహ్వేకు మొరపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చింతిస్తున్నాను’ అనే మాటకు ‘విచారిస్తున్నాను’ లేదా కొన్ని సందర్భాల్లో ‘మనసు మార్చుకున్నాను’ అని కూడా అర్థం రావచ్చు. ఇక్కడ సౌలును రాజుగా చేసినందుకు యాహ్వేకు కలిగిన గాఢమైన విచారం వ్యక్తమవుతోంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతడు నా వెనుకనుండి తిరిగిపోయాడు’; అంటే యాహ్వేను అనుసరించడం మానుకున్నాడు.
    reason: lexical_alternative
  - marker: c
    text: ‘నా మాటలను అమలు చేయలేదు’ లేదా ‘నా మాటలకు విధేయత చూపలేదు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: ఇది అక్షరార్థంగా మండే కోపాన్ని తెలిపే హీబ్రూ జాతీయ ప్రయోగం. సందర్భాన్ని బట్టి కొందరు దీన్ని సమూయేలు గాఢంగా దుఃఖించాడు లేదా తీవ్రంగా కలతచెందాడు అనే భావంలో అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: נִחַמְתִּי
  choice: చింతిస్తున్నాను
  rationale: నిఫాల్ రూపం ఇక్కడ సౌలు రాజుగా ఉండడం పట్ల దేవుని నిజమైన విచారాన్ని, పశ్చాత్తాపభావాన్ని వ్యక్తం చేస్తుంది. ‘చింతిస్తున్నాను’ అనే పదం దేవుడు నైతిక తప్పు చేశాడని సూచించకుండా ఆ భావోద్వేగ బలాన్ని నిలుపుతుంది.
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  choice: సౌలును రాజుగా చేసినందుకు
  rationale: హిఫిల్ రూపం సౌలును రాజుగా చేయడం లేదా స్థాపించడం అనే భావాన్ని ఇస్తుంది. ఈ రూపం సహజమైన ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: שָׁב מֵאַחֲרַי
  choice: అతడు నన్ను అనుసరించకుండా వెనుదిరిగాడు
  rationale: మూలంలోని ‘నా వెనుకనుండి తిరిగిపోయాడు’ అనే అనుసరణ, విధేయత చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  choice: నా మాటలను నెరవేర్చలేదు
  rationale: ‘మాటలను నిలబెట్టడం/స్థిరపరచడం’ అనే హీబ్రూ ప్రయోగం ఆజ్ఞలను కార్యరూపంలో పెట్టడం అనే భావాన్ని ఇస్తుంది. ‘నెరవేర్చలేదు’ ఆ భావాన్ని ప్రత్యక్షంగా అందిస్తుంది.
- source_word: וַיִּחַר לִשְׁמוּאֵל
  choice: సమూయేలు కోపంతో మండిపోయాడు
  rationale: חרה అనే హీబ్రూ ప్రయోగంలోని మండే కోపం అనే సజీవమైన చిత్రాన్ని నిలుపుతుంది; సందర్భం వల్ల కలిగే దుఃఖ భావాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: וַיִּזְעַק אֶל־יְהוָה
  choice: యాహ్వేకు మొరపెట్టాడు
  rationale: זעק తీవ్రమైన వేదనతో లేదా అత్యవసరంగా చేసే మొరను సూచిస్తుంది. ‘మొరపెట్టాడు’ ఆ తీవ్రతను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: כָּל־הַלַּיְלָה
  choice: రాత్రంతా
  rationale: మొత్తం రాత్రి అనే వ్యవధిని సహజంగా, సంక్షిప్తంగా తెలుపుతుంది.
theological_decisions:
- issue: దేవుని గురించి נִחַמְתִּי అనే పదాన్ని అనువదించడం
  choice: చింతిస్తున్నాను
  alternative: విచారిస్తున్నాను; మనసు మార్చుకున్నాను; పశ్చాత్తాపపడుతున్నాను
  rationale: దేవుడు నైతిక తప్పు చేశాడనే భావాన్ని దిగుమతి చేయకుండా, సౌలు రాజ్యంపై దేవునికి కలిగిన నిజమైన విచారం మరియు ప్రతిస్పందనను నిలుపుతుంది. వచనంలోని దైవ సంబంధమైన ఉద్వేగాన్ని పరిష్కరించకుండా అలాగే ఉంచుతుంది.
- issue: וַיִּחַר לִשְׁמוּאֵלలో సమూయేలు భావోద్వేగం
  choice: సమూయేలు కోపంతో మండిపోయాడు
  alternative: సమూయేలు ఎంతో దుఃఖించాడు; సమూయేలు తీవ్రంగా కలతచెందాడు
  rationale: హీబ్రూ జాతీయ ప్రయోగం ప్రధానంగా కోపాన్ని సూచిస్తుంది. సందర్భం దుఃఖాన్ని కూడా సూచించవచ్చు కాబట్టి దానిని ప్రధాన పాఠ్యంలోకి నిశ్శబ్దంగా మార్చకుండా పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. మూలంలోని దేవుని విచారం మరియు సమూయేలు కోపం మధ్య ఉన్న ధార్మిక, భావోద్వేగ ఉద్వేగాన్ని సరళీకరించలేదు. దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
