id: 1SA.15.13
reference: 1 Samuel 15:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֥א שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יֹּ֧אמֶר ל֣/וֹ שָׁא֗וּל בָּר֤וּךְ אַתָּה֙ לַֽ/יהוָ֔ה הֲקִימֹ֖תִי אֶת דְּבַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
translation:
  language: te
  text: అప్పుడు సమూయేలు సౌలు దగ్గరికి వచ్చాడు. సౌలు అతనితో ఇలా అన్నాడు, “యాహ్వే చేత నీవు ఆశీర్వదించబడినవాడవు![a] నేను యాహ్వే మాటను నెరవేర్చాను[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాహ్వేకు నీవు ధన్యుడవు.” హీబ్రూ ఆశీర్వాద సూత్రంలోని సంబంధవాచక ఛాయను ఇలా కూడా వ్యక్తం చేయవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అమలు చేశాను” లేదా “నిలబెట్టాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שְׁמוּאֵל אֶל שָׁאוּל
  choice: అప్పుడు సమూయేలు సౌలు దగ్గరికి వచ్చాడు
  rationale: בוא అనే క్రియ ఇక్కడ సౌలు ఉన్న చోటికి సమూయేలు చేరడాన్ని తెలిపే సాధారణ కథన క్రియ. తెలుగులో ‘దగ్గరికి వచ్చాడు’ సహజంగా, దిశను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיֹּאמֶר לוֹ שָׁאוּל
  choice: సౌలు అతనితో ... అన్నాడు
  rationale: హీబ్రూలోని పరోక్ష కర్మ לוֹను నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన సంభాషణ నిర్మాణాన్ని ఉపయోగించింది.
- source_word: בָּרוּךְ אַתָּה לַיהוָה
  choice: యెహోవా నిన్ను ఆశీర్వదించుగాక
  rationale: ఇది సౌలు సమూయేలును పలకరించడానికి ఉపయోగించిన ఆశీర్వాద సూత్రం. పదశః నిర్మాణాన్ని అనుసరించిన ‘యెహోవాకు నీవు ఆశీర్వదింపబడినవాడవు’ తెలుగులో అసహజంగా, భావంలో అనిశ్చితంగా ఉంటుంది; ఆశీర్వాదానికి యెహోవానే మూలమని తెలిపే ఈ రూపం సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చింది.
- source_word: הֲקִימֹתִי
  choice: నేను ... నెరవేర్చాను
  rationale: קום క్రియ యొక్క హిఫీల్ రూపం ‘మాటను నిలబెట్టడం/అమలు చేయడం’ అనే భావాన్ని ఇక్కడ ఇస్తుంది. సౌలు దేవుని ఆజ్ఞను పూర్తిగా పాటించానని చేస్తున్న వాదనను ‘నెరవేర్చాను’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דְּבַר יְהוָה
  choice: యెహోవా మాటను
  rationale: דָּבָר ఇక్కడ సందర్భానుసారంగా ఆజ్ఞను సూచించినా, ‘మాట’ అనే విస్తృత హీబ్రూ వ్యక్తీకరణను నిలుపుతుంది; పాఠకుడు సందర్భం ద్వారా దాని ఆజ్ఞార్థాన్ని గ్రహించగలడు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా పరిచయమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకుంది.
- issue: సౌలు చేసిన విధేయత వాదన యొక్క స్వరూపం
  choice: ‘నేను యెహోవా మాటను నెరవేర్చాను’ అని వాదనగానే అనువదించడం
  alternative: ‘నేను యెహోవా ఆజ్ఞను పాటించాను’
  rationale: ఈ వాక్యం సౌలు చేసిన ప్రకటనను మాత్రమే నమోదు చేస్తుంది; తరువాతి కథనం దాని నిజత్వాన్ని ప్రశ్నిస్తుంది. అనువాదం ముందుగానే అతని వాదనను సమర్థించకూడదు లేదా ఖండించకూడదు. ‘మాట’ మూలంలోని דְּבַרను కూడా కాపాడుతుంది.
- issue: בָּרוּךְ אַתָּה לַיהוָה ఆశీర్వాద సూత్రం
  choice: యెహోవా నిన్ను ఆశీర్వదించుగాక
  alternative: యెహోవా చేత నీవు ఆశీర్వదింపబడినవాడవు
  rationale: లామెద్ నిర్మాణం ఆశీర్వాదానికి దేవునితో ఉన్న సంబంధాన్ని సూచిస్తుంది; దాని ఖచ్చితమైన వ్యాకరణ ఛాయను తెలుగులో ఒకే రూపంతో పూర్తిగా పట్టుకోవడం కష్టం. ప్రధాన పాఠంలో సహజమైన ఆశీర్వచనాన్ని, పాదటిప్పణిలో మరింత పదశః ప్రత్యామ్నాయాన్ని ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. సంభాషణలో సౌలు పలికిన ఆశీర్వాదాన్ని సాధారణ పాఠకునికి వెంటనే అర్థమయ్యే విధంగా ఇచ్చి, హీబ్రూ నిర్మాణంలోని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపింది. మూలంలోని దైవనామాన్ని బిరుదుగా మార్చలేదు.
