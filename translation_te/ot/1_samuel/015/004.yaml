  text: וַ/יְשַׁמַּ֤ע שָׁאוּל֙ אֶת הָ/עָ֔ם וַֽ/יִּפְקְדֵ/ם֙ בַּ/טְּלָאִ֔ים מָאתַ֥יִם אֶ֖לֶף רַגְלִ֑י וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים אֶת אִ֥ישׁ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/004.yaml
  text: 'So Saul summoned the people and mustered them at Telaim: two hundred thousand foot soldiers[a], and ten thousand men of Judah.'
translation:
  language: te
  text: 'కాబట్టి సౌలు ప్రజలను పిలిపించి, తెలాయీములో వారిని సమీకరించి లెక్కపెట్టాడు: కాలినడక సైనికులు రెండు లక్షల మంది, యూదా గోత్రానికి చెందినవారు పదివేల మంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బַּטְּלָאִים అనే పదాన్ని ‘తెలాయీము’ అనే స్థలపేరుగా కాకుండా దాని శాబ్దిక అర్థంలో తీసుకుంటే, ‘గొర్రెపిల్లలతో వారిని లెక్కపెట్టాడు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: ప్రజలను పిలిపించి
  rationale: שׁמע హిఫీల్ రూపం ఇక్కడ సైనిక సందర్భంలో ప్రజలను కూడివచ్చేలా పిలవడం అనే భావాన్ని ఇస్తుంది.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: మూలంలో సాధారణంగా ‘ప్రజలు’ అని ఉంది; సందర్భం వారిని యుద్ధానికి సమకూర్చినవారిగా చూపుతున్నా, ‘సైన్యం’ అని స్పష్టీకరించలేదు.
- source_word: וַיִּפְקְדֵם
  choice: వారిని లెక్కించాడు
  rationale: פקד సైనిక సందర్భంలో దళాలను లెక్కించి సమీక్షించడం లేదా మోహరింపుకు నమోదు చేయడం. సాధారణ తెలుగు పాఠకులకు ‘లెక్కించాడు’ సహజంగా ఉండి సందర్భంలో సైనిక గణనను తెలియజేస్తుంది.
- source_word: בַּטְּלָאִים
  choice: తెలాయీములో
  rationale: ఈ రూపాన్ని ఇక్కడ కూడిక జరిగిన స్థలమైన తెలాయీము అనే పేరుగా తీసుకోవడం సందర్భానుకూలమైన సాంప్రదాయ పఠనం; ‘గొర్రెపిల్లలతో’ అనే శాబ్దిక సాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: מָאתַיִם אֶלֶף רַגְלִי
  choice: కాల్బలంవారు రెండు లక్షల మంది
  rationale: רַגְלִי యుద్ధ సందర్భంలో కాలినడక సైనికులను సూచిస్తుంది; ‘కాల్బలంవారు’ ఆధునిక, సంక్షిప్త సైనిక పదప్రయోగం.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אֶת אִישׁ יְהוּדָה
  choice: యూదావారు పదివేల మంది
  rationale: אִישׁ יְהוּדָה సమూహార్థంలో యూదా గోత్రానికి చెందిన పురుషులను సూచిస్తుంది; ‘యూదావారు’ సహజమైన సమూహ సూచన.
