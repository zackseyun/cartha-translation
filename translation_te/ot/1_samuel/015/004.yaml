translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. సైనిక సందర్భాన్ని స్పష్టం చేయడానికి ‘కాల్బలంవారు’ ఉపయోగించబడింది; మూలంలోని ‘ప్రజలు’ అనే విస్తృత పదం మాత్రం అలాగే నిలుపబడింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
