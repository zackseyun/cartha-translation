source:
  edition: WLC
  text: וַ/יָּבֹ֥א שָׁא֖וּל עַד עִ֣יר עֲמָלֵ֑ק וַ/יָּ֖רֶב בַּ/נָּֽחַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/005.yaml
  text: Saul came to the city of Amalek and lay in wait in the wadi[a][b][c].
translation:
  language: te
  text: సౌలు అమాలేకీయుల పట్టణం వరకు వచ్చి, వాగులో[a][b][c] మాటువేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాగులో దాడి కోసం పొంచి ఉన్నాడు.” ఇక్కడి హీబ్రూ క్రియ క్లిష్టమైనది; దాన్ని “వాదించాడు” లేదా “పోరాడాడు” అని కూడా అర్థం చేసుకున్నారు. అయితే సందర్భం మాటువేసే భావానికే ఎక్కువగా అనుకూలిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “వాగు” అంటే వర్షాకాలంలో మాత్రమే నీరు ప్రవహించి, మిగతా కాలంలో ఎండిపోయి ఉండగల ప్రవాహపాత్ర లేదా లోయ.
    reason: cultural_note
  - marker: c
    text: లేదా, “అమాలేకు పట్టణం.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא సందర్భాన్ని బట్టి ‘వచ్చు/వెళ్లు/చేరుకోవు’ అనే అర్థాలు ఇస్తుంది. కథనంలోని వరుస చర్యలను సహజమైన తెలుగులో తెలిపేందుకు ‘వచ్చి’ అని అనువదించాం.
- source_word: עַד
  choice: వరకు
  rationale: గమ్యస్థానంతో వాడిన עַד ‘వరకు/అంతదూరం’ అని సూచిస్తుంది; మూలంలోని హద్దు భావాన్ని ‘వరకు’ నిలుపుతుంది.
- source_word: עִיר עֲמָלֵק
  choice: అమాలేకీయుల పట్టణం
  rationale: నిర్మాణపరంగా ‘అమాలేకు పట్టణం’ సాధ్యమైనా, עֲמָלֵק ఇక్కడ ఆ ప్రజలను సూచించగలదు. సాధారణ తెలుగు పాఠకునికి ఉద్దేశం స్పష్టంగా ఉండేందుకు ‘అమాలేకీయుల పట్టణం’ ఎంచుకున్నాం.
- source_word: וַיָּרֶב
  choice: మాటువేశాడు
  rationale: ఈ రూపం క్లిష్టమైనది; ‘పోరాడాడు/వాదించాడు’ అని కూడా అర్థం చేసుకోవచ్చు. అయితే సైనిక సందర్భం మరియు ప్రాచీన అనువాద సంప్రదాయం మాటువేసే చర్యను సూచిస్తున్నందున, అనిశ్చితిని పాదసూచికలో ఉంచి ‘మాటువేశాడు’ ఎంచుకున్నాం.
- source_word: בַּנָּחַל
  choice: వాగులో
  rationale: נחל కాలానుగుణంగా నీరు ప్రవహించే వాగు, దాని ఎండిన ప్రవాహపాత్ర లేదా లోయను సూచించవచ్చు. తెలుగు భౌగోళిక వాడుకలో ‘వాగు’ సహజంగా, సంక్షిప్తంగా ఈ భావాన్ని అందిస్తుంది; వివరణను పాదసూచికలో ఇచ్చాం.
