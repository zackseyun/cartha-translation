translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘మాటువేశాడు’ సైనిక సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; క్లిష్టమైన హీబ్రూ క్రియలోని ప్రత్యామ్నాయ అర్థాలు పాదసూచికలో భద్రపరచబడ్డాయి. ‘అమాలేకీయుల పట్టణం’ అనే భావానువాదాన్ని ప్రధాన పాఠ్యంలో ఉంచినందున దానికి వేరే పాదసూచిక అవసరం లేదు.
