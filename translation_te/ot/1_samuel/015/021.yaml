source:
  edition: WLC
  text: וַ/יִּקַּ֨ח הָ/עָ֧ם מֵ/הַ/שָּׁלָ֛ל צֹ֥אן וּ/בָקָ֖ר רֵאשִׁ֣ית הַ/חֵ֑רֶם לִ/זְבֹּ֛חַ לַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/גִּלְגָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/021.yaml
  text: But the people took from the spoil sheep and cattle[a], the best of what had been devoted to destruction[c][b], to sacrifice to Yahweh your God at Gilgal.
translation:
  language: te
  text: అయితే ప్రజలు దోపుడు సొమ్ములోనుండి గొర్రెలను, పశువులను—నాశనానికి అంకితం చేసిన వాటిలో శ్రేష్ఠమైనవాటిని[a]—గిల్గాలులో నీ దేవుడైన యెహోవాకు బలి అర్పించడానికి తీసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని అక్షరార్థంగా ‘నాశనానికి అంకితం చేసిన వాటిలో మొదటివి/శ్రేష్ఠమైనవి’ అని అనువదించవచ్చు. ఇవి ఉంచుకోవలసిన సాధారణ దోపుడు జంతువులు కాక, నాశనం చేయవలసినవిగా అంకితం చేయబడిన జంతువులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకున్నారు
  rationale: לקח ఇక్కడ సాధారణంగా ‘తీసుకోవడం’ అనే అర్థాన్నిస్తుంది. ‘ప్రజలు’ సమూహవాచకమైనందున తెలుగులో బహువచన క్రియ సహజం; వావ్ సందర్భంలోని వ్యతిరేకతను ‘అయితే’తో చూపించాం.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: హీబ్రూ పదానికి ప్రాథమిక అర్థం ‘ప్రజలు’. సందర్భంలో సౌలు సైనికులను సూచించినా, నిందను వారిపై మళ్లించే అతని మాటల రూపాన్ని ఇది కాపాడుతుంది.
- source_word: מֵהַשָּׁלָל
  choice: దోపుడు సొమ్ములోనుండి
  rationale: שׁלל యుద్ధంలో స్వాధీనం చేసుకున్న దోపుడు సంపదను సూచిస్తుంది. ఆధునిక తెలుగులో స్పష్టంగా ఉండేందుకు ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: צֹאן וּבָקָר
  choice: గొర్రెలను, పశువులను
  rationale: ఈ జంట చిన్న పశువులు, పెద్ద పశువులను సూచిస్తుంది. సందర్భంలో బలికోసం ఉంచిన జంతువులు ప్రధానంగా ఉన్నందున సహజమైన నిర్దిష్ట పదాలను వాడాం.
- source_word: רֵאשִׁית
  choice: శ్రేష్ఠమైనవాటిని
  rationale: పదానికి ‘మొదటివి/ప్రథమ భాగం’ అనే అర్థం సాధ్యమైనా, ఇక్కడ జంతువులలో ఉత్తమమైన లేదా ఎంపికైన భాగాన్ని సూచిస్తుంది.
- source_word: הַחֵרֶם
  choice: నాశనానికి అంకితం చేసిన వాటిలో
  rationale: חֵרֶם దేవునికి పూర్తిగా అప్పగించబడి నాశనం చేయవలసిన వాటిని సూచించే గంభీరమైన పదం. ‘అంకితం’ మరియు ‘నాశనం’ రెండింటినీ ఉంచి భావంలోని ఉద్రిక్తతను కాపాడాం.
- source_word: לִזְבֹּחַ
  choice: బలి అర్పించడానికి
  rationale: ఉద్దేశాన్ని తెలిపే infinitive; తెలుగులో ‘బలి అర్పించడానికి’ సహజమైన ఆరాధనా ప్రయోగం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన YHWHను తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’గా లిప్యంతరీకరించడం ద్వారా పేరును పేరుగానే నిలిపాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని ఖచ్చితంగా కాపాడుతుంది. సౌలు ‘మన దేవుడు’ కాక ‘నీ దేవుడు’ అని సమూయేలుతో చెప్పడంలోని సంభావ్య దూరాన్ని పరిష్కరించకుండా ఉంచుతుంది.
- source_word: בַּגִּלְגָּל
  choice: గిల్గాలులో
  rationale: స్థలపేరుతో తెలుగు స్థానవాచక విభక్తి సహజంగా సరిపోతుంది.
theological_decisions:
- issue: חֵרֶם అనే పదాన్ని పవిత్ర యుద్ధ సందర్భంలో అనువదించడం
  choice: నాశనానికి అంకితం చేసినవి
  alternative: నిషేధం కింద ఉన్నవి / పూర్తిగా అంకితం చేసినవి
  rationale: ఇవి సాధారణ దోపుడు వస్తువులు కావని, దేవునికి అప్పగించబడి నాశనం చేయవలసినవని స్పష్టం చేస్తుంది. కేవలం ‘అంకితం’ అని చెప్పి నాశన భావాన్ని దాచలేదు; కేవలం ‘నాశనం’ అని చెప్పి అంకిత భావాన్ని కూడా తొలగించలేదు.
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: హీబ్రూ మూలంలో ఇది వ్యక్తిగత దైవనామం. తెలుగులో గుర్తించదగిన పేరురూపాన్ని ఉపయోగించి, సాధారణ బిరుదుతో దాని ప్రత్యేకతను కప్పివేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. సౌలు ప్రజలపై నింద మళ్లించే స్వరాన్ని ‘అయితే ప్రజలు’ అని నిలిపాం. మూలంలోని ‘నీ దేవుడు’ను మార్చలేదు. חֵרֶם భావంలోని అంకితం–నాశనం ఉద్రిక్తతను ప్రధాన పాఠ్యంలోనే స్పష్టంగా ఉంచాం.
