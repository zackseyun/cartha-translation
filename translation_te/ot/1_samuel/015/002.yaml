    rationale: హెబ్రీయ వాక్యంలో ఒక్కసారి మాత్రమే పాకద్ క్రియ ఉంది; అమాలేకు చేసిన పని దాని విషయాన్ని వివరిస్తుంది. ‘వచ్చినప్పుడు’ పూర్తి అయిన గత సంఘటనను సహజంగా వ్యక్తం చేస్తుంది.
