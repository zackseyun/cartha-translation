source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת פָּקַ֕דְתִּי אֵ֛ת אֲשֶׁר עָשָׂ֥ה עֲמָלֵ֖ק לְ/יִשְׂרָאֵ֑ל אֲשֶׁר שָׂ֥ם ל/וֹ֙ בַּ/דֶּ֔רֶךְ בַּ/עֲלֹת֖/וֹ מִ/מִּצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
translation:
  language: te
  text: 'సైన్యాల యహ్వే ఇలా అంటున్నాడు: “అమాలేకు ఇశ్రాయేలుకు చేసినదానిని నేను గమనించాను[a]—ఇశ్రాయేలు[b] ఐగుప్తు నుండి వచ్చినప్పుడు, దారిలో అమాలేకు అతనిని ఎదిరించిన తీరును[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను జ్ఞాపకం చేసుకున్నాను”; సందర్భానుసారంగా, “నేను తీర్పు నిమిత్తం చర్య తీసుకున్నాను.” హెబ్రీయ క్రియకు శ్రద్ధ పెట్టడం, జ్ఞాపకం చేసుకోవడం, లేదా తీర్పుతో సందర్శించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో ఇశ్రాయేలు ఒక సమూహంగా ఏకవచనంలో సూచించబడింది; అందుకే తరువాత “అతనిని” అని ఉంది.
    reason: cultural_note
  - marker: c
    text: లేదా, “దారిలో అతనికి అడ్డుగా నిలిచిన తీరును”; సాధ్యంగా, “దారిలో అతనికోసం పొంచి ఉన్న తీరును.” ఈ హెబ్రీయ ప్రయోగం నిర్గమ ప్రయాణంలో అమాలేకు చేసిన శత్రుత్వ చర్యను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ప్రవక్తల సందేశసూత్రాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రత్యక్షంగా పలుకుతున్న సందేశపు బలాన్ని నిలుపుతుంది.
- source_word: יְהוָה צְבָאוֹת
  choice: సైన్యాలకు అధిపతియైన యెహోవా
  rationale: దైవనామమైన ‘యెహోవా’ను నిలుపుతూ, צְבָאוֹת సూచించే విస్తృత సైన్యబలాల భావాన్ని కేవలం మానవ సైన్యాలకు పరిమితం చేయకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פָּקַדְתִּי
  choice: నేను గమనించాను
  rationale: ఈ క్రియలోని జ్ఞాపకం చేసుకోవడం, దృష్టి పెట్టడం, తీర్పు కోసం విచారించడం అనే భావపరిధిని వెంటనే ‘శిక్షించాను’గా కుదించకుండా నిలుపుతుంది.
- source_word: אֵת אֲשֶׁר עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל
  choice: అమాలేకు ఇశ్రాయేలుకు చేసినదాన్ని
  rationale: హెబ్రీయ మూలంలోని విస్తృత కర్మవాక్యాన్ని, శత్రుత్వాన్ని అతిగా వివరించకుండా, సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  choice: దారిలో అమాలేకు అతనిని ఎదిరించిన తీరును
  rationale: సంక్షిప్త హెబ్రీయ ప్రయోగంలోని శత్రుత్వపూర్వక అడ్డగింపును తెలియజేస్తుంది; ‘పొంచి ఉన్నాడు’ అనే నిర్దిష్ట యుద్ధవ్యూహాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా ప్రవేశపెట్టదు.
- source_word: בַּעֲלֹתוֹ מִמִּצְרָיִם
  choice: ఇశ్రాయేలు ఐగుప్తు నుండి బయలుదేరి వస్తున్నప్పుడు
  rationale: ‘ఐగుప్తు నుండి పైకి రావడం’ అనే హెబ్రీయ నుడికారాన్ని తెలుగులో సహజమైన ప్రయాణవర్ణనగా ఇస్తూ, ఏకవచన సమూహసూచకానికి ఉద్దేశించిన ఇశ్రాయేలును స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה צְבָאוֹת అనే దైవ బిరుదు
  choice: సైన్యాలకు అధిపతియైన యెహోవా
  alternative: సైన్యాల యెహోవా
  rationale: వ్యక్తిగత దైవనామాన్ని నిలుపుతూ బిరుదును సాధారణ తెలుగు పాఠకునికి స్పష్టంగా చేస్తుంది; దాని పరిధిని కేవలం భూసైన్యాలకు పరిమితం చేయదు.
- issue: פָּקַדְתִּי లోని జ్ఞాపకం–తీర్పు భావసంబంధం
  choice: నేను గమనించాను
  alternative: నేను జ్ఞాపకం చేసుకున్నాను; నేను శిక్షించాను
  rationale: తదుపరి తీర్పుకు ఆధారమైన దేవుని ఉద్దేశపూర్వక దృష్టిని వ్యక్తం చేస్తూ, ఈ క్రియలోని భావపరమైన ఉద్రిక్తతను ఒకే అర్థంగా పరిష్కరించదు.
- issue: ఇశ్రాయేలు అనే సమూహనామానికి ఏకవచన సర్వనామం
  choice: అతనిని
  alternative: వారిని
  rationale: మూలంలోని పుంలింగ ఏకవచన సర్వనామాన్ని నిలుపుతుంది; అది సమూహంగా భావించిన ఇశ్రాయేలును సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదిగానూ సాధారణ పాఠకులకు స్పష్టమైనదిగానూ ఉంచబడింది. మూలంలోని సమూహ ఏకవచనాన్ని పాఠ్యంలో నిలిపి పాదటిప్పణిలో వివరించాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
