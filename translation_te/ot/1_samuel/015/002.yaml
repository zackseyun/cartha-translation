- from: 'సైన్యాలకు అధిపతియైన యెహోవా ఇలా అంటున్నాడు: “అమాలేకు ఇశ్రాయేలుకు చేసినదాన్ని నేను గమనించాను[a]—ఇశ్రాయేలు[b] ఐగుప్తు నుండి బయలుదేరి వస్తున్నప్పుడు, దారిలో అమాలేకు అతనిని ఎదిరించిన తీరును[c] గమనించాను.”'
  to: 'సైన్యాల యహ్వే ఇలా అంటున్నాడు: “అమాలేకు ఇశ్రాయేలుకు చేసినదానిని నేను గమనించాను[a]—ఇశ్రాయేలు[b] ఐగుప్తు నుండి వచ్చినప్పుడు, దారిలో అమాలేకు అతనిని ఎదిరించిన తీరును[c].”'
  rationale: దైవనామాన్ని ప్రాజెక్టు లిప్యంతరీకరణ విధానానికి అనుగుణంగా ‘యహ్వే’గా మార్చాం. మూలంలోని ఒకే ప్రధాన క్రియను తెలుగులో పునరావృతం కాకుండా ఉంచి, అమాలేకు చర్యను దాని వివరణగా నిర్మించాం. ‘వచ్చినప్పుడు’ మూలంలోని గత సంఘటనను స్పష్టంగా తెలియజేస్తుంది. పాదటిప్పణి ప్రత్యామ్నాయాన్ని పాకద్ యొక్క సందర్భానుగుణ తీర్పు-సూచనకు అనుగుణంగా సవరించాం.
