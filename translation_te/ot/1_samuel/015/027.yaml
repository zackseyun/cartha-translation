- from: సమూయేలు వెళ్లడానికి వెనుదిరిగినప్పుడు, సౌలు అతని అంగీ అంచును[a] గట్టిగా పట్టుకున్నాడు; అది చిరిగిపోయింది.
  to: సమూయేలు వెళ్లిపోవడానికి తిరిగినప్పుడు, సౌలు అతని పైవస్త్రం అంచును[a] గట్టిగా పట్టుకున్నాడు; అది చిరిగిపోయింది.
