  text: As Samuel turned to go[a], he seized the edge of his robe, and it tore.
translation:
  language: te
  text: సమూయేలు వెళ్లిపోవడానికి తిరిగినప్పుడు, సౌలు అతని పైవస్త్రం అంచును[a] గట్టిగా పట్టుకున్నాడు; అది చిరిగిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పైవస్త్రం మూలను,’ లేదా ‘పైవస్త్రం కింది అంచును.’ హీబ్రూ పదం వస్త్రం చివరి భాగాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב
  choice: వెనుదిరిగినప్పుడు
  rationale: סבב ఇక్కడ వెళ్లిపోవడానికి తిరగడాన్ని సూచిస్తుంది. తెలుగు కథనంలో ‘వెనుదిరిగినప్పుడు’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: לָלֶכֶת
  choice: వెళ్లడానికి
  rationale: הלך యొక్క infinitive construct సమూయేలు వెళ్లిపోవాలనే ఉద్దేశాన్ని తెలుపుతుంది; ‘వెళ్లడానికి’ నేరుగా, సహజంగా ఉంది.
- source_word: וַיַּחֲזֵק
  choice: గట్టిగా పట్టుకున్నాడు
  rationale: חזק యొక్క Hiphil రూపం బలంగా పట్టుకోవడం లేదా చేజిక్కించుకోవడం అనే భావాన్ని ఇస్తుంది. ‘గట్టిగా పట్టుకున్నాడు’ ఆకస్మికమైన, బలమైన చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּכְנַף
  choice: అంచును
  rationale: כָּנָף అక్షరార్థంగా ‘రెక్క’; వస్త్రానికి వాడినప్పుడు దాని చివర, మూల లేదా అంచును సూచిస్తుంది. ‘అంచు’ ఈ విస్తృత అర్థాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: מְעִילוֹ
  choice: అతని అంగీ
  rationale: מְעִיל పైవస్త్రం లేదా పొడవైన అంగీని సూచిస్తుంది. ‘అంగీ’ ఆధునిక తెలుగులో స్పష్టంగా, కథన సందర్భానికి తగినదిగా ఉంది.
- source_word: וַיִּקָּרַע
  choice: అది చిరిగిపోయింది
  rationale: Niphal రూపం వస్త్రం చిరిగిన సంఘటనను passive/intransitive భావంలో తెలియజేస్తుంది. ‘అది చిరిగిపోయింది’ చర్యకు అదనపు కారణాన్ని ఆపాదించదు.
theological_decisions:
- issue: וַיַּחֲזֵק క్రియకు కర్త పేరుతో తెలుపబడలేదు
  choice: సందర్భం ఆధారంగా ‘సౌలు’ అని స్పష్టం చేయడం
  alternative: ‘అతడు’ అని ఉంచి వ్యాకరణపరమైన అస్పష్టతను కొనసాగించడం
  rationale: హీబ్రూ క్రియలో పురుష ఏకవచన కర్త అంతర్లీనంగా ఉన్నప్పటికీ, ముందున్న కథన సందర్భం (1 సమూయేలు 15:24–26) అతడు సౌలేనని స్పష్టం చేస్తుంది. తెలుగులో వరుసగా వచ్చే సర్వనామాలు ఎవరు ఎవరి వస్త్రాన్ని పట్టుకున్నారో అనవసరంగా గందరగోళం కలిగిస్తాయి; అందువల్ల సందర్భంలో స్పష్టమైన కర్తను పేరుతో తెలిపాం. ఇది వేదాంతపరమైన నిర్ధారణ కాదు, కథన సూచనను సహజ తెలుగులో వ్యక్తీకరించడం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘అంచు’ అనే పదం హీబ్రూ כָּנָף లోని విస్తృత వస్త్రార్థాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం. పాదసూచిక గుర్తు సంబంధిత పదమైన ‘అంచును’ వెంట ఉంచబడింది.
