source:
  edition: WLC
  text: וְ/עַתָּ֕ה שָׂ֥א נָ֖א אֶת חַטָּאתִ֑/י וְ/שׁ֣וּב עִמִּ֔/י וְ/אֶֽשְׁתַּחֲוֶ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/025.yaml
  text: Now please forgive my sin[a], and return with me[b], so that I may bow down to Yahweh.
translation:
  language: te
  text: ఇప్పుడు దయచేసి నా పాపాన్ని క్షమించి[a], నేను యెహోవాకు సాష్టాంగపడేలా[b] నాతో తిరిగి రండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘నా పాపాన్ని ఎత్తివేయండి’; ఇది ‘నా పాపాన్ని క్షమించండి’ అనే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యెహోవాను ఆరాధించేందుకు.’ హీబ్రూ క్రియ అక్షరార్థంగా వంగి లేదా నేలపై పడి నమస్కరించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సమూయేలు చేసిన గద్దింపుకు ప్రతిస్పందనగా సౌలు చేస్తున్న తక్షణ విన్నపాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שָׂא נָא
  choice: దయచేసి ... క్షమించి
  rationale: נָשָׂא అనే క్రియకు అక్షరార్థంగా ‘ఎత్తు/మోయు’ అనే భావం ఉన్నా, חַטָּאת తో కలిసి ఇక్కడ ‘పాపాన్ని క్షమించు’ అనే నుడికారార్థం ఇస్తుంది; נָא లోని విన్నప భావాన్ని ‘దయచేసి’ నిలుపుతుంది.
- source_word: אֶת חַטָּאתִי
  choice: నా పాపాన్ని
  rationale: సందర్భంలో ఇది సౌలు ఒప్పుకుంటున్న పాపాన్ని సూచిస్తుంది; ‘పాపం’ అనేది నేరుగా, స్పష్టంగా ఉన్న సమానార్థకం.
- source_word: וְשׁוּב עִמִּי
  choice: నాతో తిరిగి రండి
  rationale: שׁוּב యొక్క ‘తిరిగి వెళ్లు/రా’ భావాన్ని, సమూయేలు తనతో పాటు రావాలని సౌలు కోరుతున్న సందర్భాన్ని నిష్ఠగా వ్యక్తపరుస్తుంది.
- source_word: וְאֶשְׁתַּחֲוֶה
  choice: అప్పుడు నేను ... సాష్టాంగపడతాను
  rationale: ఈ క్రియ శరీరాన్ని వంచి లేదా నేలపై పడి నమస్కరించడాన్ని సూచిస్తుంది. ‘సాష్టాంగపడతాను’ ఆ భౌతిక చర్యను నిలుపుతుంది; ఆజ్ఞార్థక విన్నపం తరువాతి వాక్యాన్ని ప్రయోజన/ఫలిత భావంతో కలపడానికి ‘అప్పుడు’ సహజంగా ఉంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించి, לְ సూచించే లక్ష్యాన్ని ‘-కు’తో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగానే నిలుపుతుంది; ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు ‘యెహోవా’ సుపరిచిత రూపం.
- issue: וְאֶשְׁתַּחֲוֶה లోని చర్య
  choice: సాష్టాంగపడతాను
  alternative: ఆరాధిస్తాను
  rationale: మూల క్రియ సూచించే శారీరకంగా వంగి నమస్కరించే చర్యను నిలుపుతుంది; యెహోవా దాని లక్ష్యంగా ఉండటంతో ఆరాధన భావం సందర్భంలోనే స్పష్టమవుతుంది, దానిని మాత్రమే అర్థంగా నిర్ణయించదు.
translation_notes:
  register: సాధారణ ఆధునిక ప్రామాణిక తెలుగులో, గౌరవార్థక బహువచనంతో సౌలు చేసిన విన్నపాన్ని వ్యక్తపరిచాం. ‘సాష్టాంగపడతాను’ గంభీరంగా ఉన్నప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే ఆరాధనా పదం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
