id: 1SA.15.29
reference: 1 Samuel 15:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַם֙ נֵ֣צַח יִשְׂרָאֵ֔ל לֹ֥א יְשַׁקֵּ֖ר וְ/לֹ֣א יִנָּחֵ֑ם כִּ֣י לֹ֥א אָדָ֛ם ה֖וּא לְ/הִנָּחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/029.yaml
  text: Moreover[a], the Glory of Israel will not lie, nor will he relent, for he is not a man[b], that he should relent.
translation:
  language: te
  text: అంతేకాదు, ఇశ్రాయేలు మహిమ[a] అబద్ధం చెప్పడు; తన మనసు మార్చుకోడు[b]. ఎందుకంటే ఆయన తన మనసు మార్చుకోవడానికి మనిషి కాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు నిత్యత్వం,’ ‘ఇశ్రాయేలు బలం,’ లేదా ‘ఇశ్రాయేలు విజయం.’ ఈ హీబ్రూ దైవబిరుదుకు విస్తృతమైన అర్థపరిధి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వెనక్కి తగ్గడు’ లేదా ‘పశ్చాత్తాపపడడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాదు
  rationale: ముందటి గద్దింపుకు మరో బలమైన ప్రకటనను జోడించే సంధానార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נֵצַח יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మహిమగలవాడు
  rationale: నֵצַח పదానికి మహిమ, శాశ్వతత్వం, బలం, విజయం వంటి విస్తృత అర్థపరిధి ఉంది. వ్యక్తిని సూచించే దైవబిరుదుగా సహజంగా ఉండేందుకు ‘మహిమగలవాడు’ అని ఇచ్చి, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నిలిపాము.
- source_word: יְשַׁקֵּר
  choice: అబద్ధమాడడు
  rationale: שקר పియేల్ రూపంలోని ‘అబద్ధం చెప్పు/అసత్యంగా ప్రవర్తించు’ అనే ప్రత్యక్ష భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְלֹא יִנָּחֵם
  choice: తన నిర్ణయాన్ని మార్చుకోడు
  rationale: נחם నిఫాల్ రూపం పశ్చాత్తాపపడటం, మనసు మార్చుకోవటం, వెనక్కి తగ్గటం వంటి అర్థాలను కలిగి ఉంది. సౌలు రాజత్వాన్ని తిరస్కరించిన నిర్ణయాన్ని దేవుడు వెనక్కి తీసుకోడనే సందర్భార్థాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేసే כִּי భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא אָדָם הוּא
  choice: ఆయన మనిషి కాడు
  rationale: దేవుణ్ణి సాధారణ మానవునితో పోల్చే ఏకవచన విధేయ వాక్యాన్ని నేరుగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: לְהִנָּחֵם
  choice: తన నిర్ణయాన్ని మార్చుకోవడానికి
  rationale: ముందున్న יִנָּחֵםతో పదార్థ సారూప్యాన్ని నిలిపి, మనిషిలా నిర్ణయాన్ని తిరగదోడే వాడు దేవుడు కాదనే పోలికను పూర్తిచేస్తుంది.
theological_decisions:
- issue: దేవుని మార్పులేనితనాన్ని తాత్త్వికంగా అతిశయింపకుండా అనువదించడం
  choice: సౌలు విషయంలో ప్రకటించిన తీర్పును ఆయన మార్చుకోడనే సందర్భార్థంతో ‘తన నిర్ణయాన్ని మార్చుకోడు’
  alternative: ‘వెనక్కి తగ్గడు’ లేదా ‘పశ్చాత్తాపపడడు’
  rationale: ఈ వచనం దేవుని విశ్వసనీయతను, సౌలు తిరస్కరణపై ఆయన నిర్ణయం తిరగదోడబడదని ప్రకటిస్తుంది. נחםకు ఉన్న భావపరిధిని పాదటిప్పణిలో ఉంచడం ద్వారా విస్తృత గ్రంథసంబంధమైన ఉద్రిక్తతను చెరపకుండా, ఇక్కడి సందర్భాన్ని సహజంగా అందిస్తుంది.
- issue: נֵצַח יִשְׂרָאֵל అనే దైవబిరుదు
  choice: ఇశ్రాయేలు మహిమగలవాడు
  alternative: ఇశ్రాయేలు నిత్యుడైనవాడు / బలమైనవాడు / విజయమైనవాడు
  rationale: నֵצַח యొక్క వివాదాస్పదమైన విస్తృత అర్థపరిధిని ఒకే తాత్త్విక నిర్వచనంలో బంధించకుండా, ప్రధాన పాఠ్యంలో గౌరవప్రదమైన బిరుదును ఇచ్చి ఇతర సాధ్యార్థాలను పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. దైవబిరుదు యొక్క ఉన్నత స్వరాన్ని నిలిపి, נחם పదంలోని నిజమైన అర్థవైవిధ్యాన్ని పాదటిప్పణిలో భద్రపరిచాం.
