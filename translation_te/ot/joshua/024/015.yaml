    issue: The alternatives after the dash repeat “ఎంచుకోండి.”
    rationale: Hebrew has one imperative, “choose,” followed by a direct question and disjunctive alternatives. Repeating the imperative makes the alternatives into a second command and is less faithful to the source syntax.
  - severity: medium
    issue: “మీరు నివసిస్తున్న దేశానికి చెందిన అమోరీయుల దేవుళ్లు” leaves the relative relationship unclear.
    rationale: The Hebrew says “the gods of the Amorites, in whose land you are living.” The revision clearly identifies the Amorites as those in whose land the audience lives.
