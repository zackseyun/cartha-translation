  text: וְ/אִם֩ רַ֨ע בְּֽ/עֵינֵי/כֶ֜ם לַ/עֲבֹ֣ד אֶת יְהוָ֗ה בַּחֲר֨וּ לָ/כֶ֣ם הַ/יּוֹם֮ אֶת מִ֣י תַעֲבֹדוּ/ן֒ אִ֣ם אֶת אֱלֹהִ֞ים אֲשֶׁר עָבְד֣וּ אֲבוֹתֵי/כֶ֗ם אֲשֶׁר֙ ב/עבר הַ/נָּהָ֔ר וְ/אִם֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/אָנֹכִ֣י וּ/בֵיתִ֔/י נַעֲבֹ֖ד אֶת יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
translation:
  language: te
  text: యహ్వేను సేవించడం మీ దృష్టిలో చెడ్డదైతే[a], ఈ రోజే మీకోసం మీరు ఎవరిని సేవిస్తారో ఎంచుకోండి—నదికి అవతల[b] మీ పితరులు[c] సేవించిన దేవుళ్లనైనా, లేక మీరు వారి దేశంలో నివసిస్తున్న అమోరీయుల దేవుళ్లనైనా. అయితే నేనూ నా ఇంటివారూ[d] యహ్వేను సేవిస్తాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వేను సేవించడం మీకు తప్పుగా అనిపిస్తే” లేదా “మీకు అయిష్టంగా ఉంటే.” అక్షరార్థంగా, “మీ కళ్లలో చెడ్డదైతే.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “నది” అంటే యూఫ్రటీసు నది.
    reason: cultural_note
  - marker: c
    text: లేదా, “మీ పూర్వీకులు.” హీబ్రూలో, “మీ తండ్రులు.”
    reason: lexical_alternative
  - marker: d
    text: అక్షరార్థంగా, “నేనూ నా ఇల్లూ”; అంటే, “నేనూ నా గృహస్థులూ” లేదా “నేనూ నా కుటుంబమూ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם רַע בְּעֵינֵיכֶם
  choice: మీ దృష్టిలో చెడ్డదైతే
  rationale: హీబ్రూ నుడికారంలోని ‘మీ కళ్లలో చెడ్డది’ అనే మూలచిత్రాన్ని సహజమైన తెలుగు ‘మీ దృష్టిలో చెడ్డది’గా నిలిపి, శ్రోతల మదింపును సూచిస్తుంది.
- source_word: לַעֲבֹד ... תַעֲבֹדוּן ... נַעֲבֹד
  choice: సేవించడం ... సేవించాలో ... సేవిస్తాం
  rationale: עבד పదం ఆరాధనతో కూడిన విధేయత, నిబద్ధత అనే విస్తృత భావాన్ని కలిగి ఉంది. పదపునరావృతిని ఒకే తెలుగు మూలపదంతో నిలిపాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: בַּחֲרוּ לָכֶם הַיּוֹם
  choice: ఈ రోజే ఎంచుకోండి
  rationale: ఆజ్ఞలోని తక్షణ నిర్ణయ ప్రాధాన్యాన్ని ‘ఈ రోజే’ తెలియజేస్తుంది; לָכֶם లోని స్వయంగా నిర్ణయించుకునే భావం తెలుగు వాక్యంలోని ప్రత్యక్ష సంబోధన, ఎంపిక సందర్భం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: אֱלֹהִים ... אֱלֹהֵי
  choice: దేవుళ్లు
  rationale: ఇక్కడ అన్యజన దేవతలు బహువచనంలో సూచించబడ్డారు; అందువల్ల సాధారణ బహువచన రూపాన్ని వాడాం.
- source_word: אֲשֶׁר עָבְדוּ אֲבוֹתֵיכֶם
  choice: మీ పితరులు సేవించిన
  rationale: אָבוֹת అనే పుంలింగ బహువచనాన్ని దగ్గరగా ప్రతిబింబించే ‘పితరులు’ను వాడి, విస్తృత ‘పూర్వీకులు’ అనే భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: నదికి అవతల
  rationale: మూలంలోని ప్రసిద్ధ భౌగోళిక సూచనను అలాగే ఉంచి, అది యూఫ్రటీసు నది అని పాదసూచికలో స్పష్టం చేశాం.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులు
  rationale: ప్రజాసమూహం పేరును ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר אַתֶּם יֹשְׁבִים בְּאַרְצָם
  choice: మీరు నివసిస్తున్న దేశానికి చెందిన
  rationale: వారు ప్రస్తుతం నివసిస్తున్న భూమి అమోరీయులదనే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְאָנֹכִי וּבֵיתִי
  choice: అయితే నేనూ నా ఇంటివారూ
  rationale: אָנֹכִי లోని వ్యక్తిగత ఉద్ఘాటనను ‘అయితే నేనూ’తో, בֵּיתִי లోని గృహసభ్యుల సమూహార్థాన్ని ‘నా ఇంటివారూ’తో సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలభేదాన్ని నిలుపుతుంది.
- issue: עבד లోని మతపరమైన విధేయత
  choice: సేవించు
  alternative: ఆరాధించు
  rationale: ‘ఆరాధించు’ భావంలో భాగమైనా, עבד ఇక్కడ ఆరాధనకన్నా విస్తృతమైన ఒడంబడిక విధేయతను సూచిస్తుంది. ‘సేవించు’ ఆ విస్తృతతను, వాక్యంలోని పునరావృతిని కాపాడుతుంది.
- issue: אָבוֹתֵיכֶם లోని లింగసూచక పూర్వీక భాష
  choice: మీ పితరులు
  alternative: మీ పూర్వీకులు
  rationale: మూలంలోని ‘తండ్రులు’ అనే పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో విస్తృత పూర్వీక అర్థం ఉండవచ్చని పాదసూచికలో తెలియజేశాం.
- issue: וּבֵיתִי లోని ‘ఇల్లు’ భావవ్యాప్తి
  choice: నా ఇంటివారు
  alternative: నా ఇల్లు; నా కుటుంబం
  rationale: ఇక్కడ భవనం కాక యెహోషువకు చెందిన గృహసభ్యులు ఉద్దేశం. ‘ఇంటివారు’ కుటుంబంతో పాటు గృహానికి చెందిన వారిని చేర్చగలిగి, మూలంలోని భావవ్యాప్తిని అనవసరంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘సేవించు’ అనే పదపునరావృతిని ఉద్దేశపూర్వకంగా నిలిపాం. ప్రధాన పాఠ్యంలో హీబ్రూ నుడికారపు పదును కాపాడుతూ, మరింత సహజమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
