  text: וַ/יִּכְתֹּ֤ב יְהוֹשֻׁ֨עַ֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/סֵ֖פֶר תּוֹרַ֣ת אֱלֹהִ֑ים וַ/יִּקַּח֙ אֶ֣בֶן גְּדוֹלָ֔ה וַ/יְקִימֶ֣/הָ שָּׁ֔ם תַּ֚חַת הָֽ/אַלָּ֔ה אֲשֶׁ֖ר בְּ/מִקְדַּ֥שׁ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
translation:
  language: te
  text: యెహోషువ ఈ మాటలను దేవుని ధర్మశాస్త్ర గ్రంథంలో రాశాడు. అప్పుడు అతడు ఒక పెద్ద రాయిని తీసుకొని, యహ్వే పవిత్ర స్థలంలో[b] ఉన్న టెరెబింత్ చెట్టు[a] కింద దానిని నిలబెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఓక్ చెట్టు.” హీబ్రూ పదం టెరెబింత్‌ను లేదా ఓక్‌ను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యహ్వే పవిత్ర స్థలం దగ్గర ఉన్న.” హీబ్రూ ఉపసర్గను ఈ సందర్భంలో ‘దగ్గర’ అనే విస్తృత స్థానార్థంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: రాశాడు
  rationale: כתב అనే క్రియకు ఇక్కడ నేరమైన అర్థం ‘రాశాడు’; గ్రంథంలో లిఖితపరచడాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలను
  rationale: דברים అనేది ‘మాటలు,’ ‘విషయాలు’ అని అర్థమివ్వగలదు. ఇక్కడ ఒడంబడికకు సంబంధించిన పలుకులను గ్రంథంలో రాయడం గురించి ఉన్నందున ‘ఈ మాటలను’ అనేది పాఠ్య భావాన్ని కాపాడుతుంది.
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  choice: దేవుని ధర్మశాస్త్ర గ్రంథంలో
  rationale: ספרను ‘గ్రంథం’గా, תורתను ఈ ఒడంబడిక సందర్భంలో ‘ధర్మశాస్త్రం’గా అనువదించి, హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో ఉంచింది.
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  choice: ఒక పెద్ద రాయిని తీసుకొని
  rationale: גדולה ఇక్కడ భౌతిక పరిమాణాన్ని సూచిస్తుంది; అందువల్ల ‘పెద్ద రాయి’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: וַיְקִימֶהָ
  choice: దాన్ని నిలబెట్టాడు
  rationale: קום హిఫీల్ రూపం రాయిని నిలువుగా స్థాపించడాన్ని సూచిస్తుంది. ‘నిలబెట్టాడు’ అనేది స్మారక రాయిని నెలకొల్పిన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: תַּחַת הָאַלָּה
  choice: సింధూర చెట్టు కింద
  rationale: אַלָּה ఒక పెద్ద వృక్షాన్ని, సాధారణంగా టెరెబింత్ లేదా దానికి దగ్గరైన చెట్టును సూచించవచ్చు. తెలుగు బైబిలు వాడుకలో పరిచయమున్న ‘సింధూర చెట్టు’ను ప్రధాన పాఠంలో ఉంచి, జాతి అనిశ్చితిని పాదసూచికలో తెలిపింది.
- source_word: בְּמִקְדַּשׁ יְהוָה
  choice: యహ్వే పరిశుద్ధ స్థలంలో
  rationale: מקדשకు ‘పరిశుద్ధ స్థలం’ సహజమైన తెలుగు సమానం. ב అనే ఉపసర్గ యొక్క సాధారణ స్థానార్థమైన ‘లో’ను ప్రధాన పాఠంలో నిలిపి, సందర్భానుసారమైన ‘దగ్గర’ అనే అవకాశాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యహ్వే’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: దైవనామమైన יהוהను ఎలా అనువదించాలి
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత ఒడంబడిక నామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా ఉంచడం మూలభాషకు దగ్గరగా ఉంటుంది.
- issue: చెట్టు పరిశుద్ధ స్థలంతో ఉన్న స్థానసంబంధం
  choice: పరిశుద్ధ స్థలంలో ఉన్న
  alternative: పరిశుద్ధ స్థలం దగ్గర ఉన్న
  rationale: హీబ్రూ ב సాధారణంగా ‘లో’ అని అర్థమిస్తుంది; కాబట్టి ప్రధాన పాఠం దానిని అనుసరిస్తుంది. అయితే సందర్భంలో అది ‘దగ్గర’ అనే సడలించిన స్థానార్థాన్ని కలిగి ఉండవచ్చు; ఆ నిజమైన అస్పష్టతను పాదసూచికలో కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. వాక్యాన్ని సహజ తెలుగు ప్రవాహం కోసం రెండు భాగాలుగా అమర్చి, మూలంలోని వరుస చర్యలను ‘తరువాత’తో అనుసంధానించింది. సాంకేతిక వృక్షనామ సమస్యను ప్రధాన పాఠాన్ని భారంగా చేయకుండా పాదసూచికలో వివరించింది.
