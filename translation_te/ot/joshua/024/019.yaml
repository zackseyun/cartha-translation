source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם לֹ֤א תֽוּכְלוּ֙ לַ/עֲבֹ֣ד אֶת יְהוָ֔ה כִּֽי אֱלֹהִ֥ים קְדֹשִׁ֖ים ה֑וּא אֵֽל קַנּ֣וֹא ה֔וּא לֹֽא יִשָּׂ֥א לְ/פִשְׁעֲ/כֶ֖ם וּ/לְ/חַטֹּאותֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
translation:
  language: te
  text: 'యెహోషువ ప్రజలతో ఇలా అన్నాడు: “మీరు యాహ్వేను సేవించలేరు. ఎందుకంటే ఆయన పరిశుద్ధుడైన దేవుడు[a]; ఆయన అసూయగల దేవుడు. ఆయన మీ తిరుగుబాట్లను, మీ పాపాలను క్షమించడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవుడు,’ ‘పరిశుద్ధుడు’ అనే హెబ్రీ పదాలు ఇక్కడ రూపపరంగా బహువచనంలో ఉన్నాయి; అయితే ‘ఆయన’ అనే సర్వనామం ఏకవచనం. కాబట్టి ఇవి ఇశ్రాయేలు దేవుడైన ఒక్క యాహ్వేనే సూచిస్తున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థానికి దగ్గరగా: ‘ఆయన మీ తిరుగుబాట్లను, మీ పాపాలను మోయడు’ లేదా ‘తొలగించడు.’ ఈ హెబ్రీ ప్రయోగం సాధారణంగా క్షమించడాన్ని సూచిస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: תֽוּכְלוּ
  choice: సేవించలేరు
  rationale: יכל సామర్థ్యాన్ని సూచిస్తుంది. ‘సేవించలేరు’ అనే రూపం ప్రజల అసమర్థతను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַעֲבֹד
  choice: సేవించ
  rationale: עבד అనే పదంలో ఆరాధనతో పాటు నిబంధనపరమైన విధేయ సేవ కూడా ఉంది. అందువల్ల ‘ఆరాధించ’ కంటే ‘సేవించ’ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: אֱלֹהִים קְדֹשִׁים הוּא
  choice: ఆయన పరిశుద్ధుడైన దేవుడు
  rationale: ‘దేవుడు,’ ‘పరిశుద్ధుడు’ పదాలకు హెబ్రీలో బహువచన రూపాలున్నా, הוּא అనే సర్వనామం ఏకవచనం; సందర్భమూ ఇశ్రాయేలు ఏకైక దేవుణ్ణే సూచిస్తుంది. తెలుగులో తప్పుదారి పట్టించని ఏకవచనాన్ని వాడి, రూప వైశిష్ట్యాన్ని పాదసూచికలో తెలిపాం.
- source_word: אֵל קַנּוֹא
  choice: తనకు మాత్రమే చెందవలసిన భక్తిని కోరే దేవుడు
  rationale: קַנּוֹא దేవుని నిబంధన సంబంధమైన ఏకైక హక్కును, ప్రత్యర్థి దేవతల పట్ల సహించకపోవడాన్ని సూచిస్తుంది. ‘అసూయగల’ అనే పదం తెలుగులో చిన్నతనంతో కూడిన మానవ దోషాన్ని సూచించవచ్చు; ఎంపిక చేసిన వివరణాత్మక రూపం అసలు సంబంధపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא יִשָּׂא
  choice: క్షమించడు
  rationale: נשא పాపం లేదా తిరుగుబాటుతో వచ్చినప్పుడు ‘మోయడం/తొలగించడం’ అనే రూపకం ద్వారా క్షమించడాన్ని సూచించే స్థిరమైన హెబ్రీ ప్రయోగం. ప్రధాన పాఠంలో భావాన్ని స్పష్టంగా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: פִשְׁעֲכֶם
  choice: మీ తిరుగుబాట్లను
  rationale: פשע కేవలం సాధారణ అతిక్రమణకన్నా అధికారానికి లేదా నిబంధనకు వ్యతిరేకమైన తిరుగుబాటు భావాన్ని బలంగా కలిగి ఉంది.
- source_word: חַטֹּאותֵיכֶם
  choice: మీ పాపాలను
  rationale: חטאתకు నేరుగా, సాధారణంగా అర్థమయ్యే తెలుగు సమానార్థకం ‘పాపాలు’.
theological_decisions:
- issue: אֱלֹהִים קְדֹשִׁים అనే బహువచన రూపాలు, הוּא అనే ఏకవచన సర్వనామంతో రావడం
  choice: ‘ఆయన పరిశుద్ధుడైన దేవుడు’ అని ఏకవచనంలో అనువదించడం
  alternative: రూపపరంగా ‘పరిశుద్ధ దేవుళ్లు ఆయన’ అని బహువచనంగా ఇవ్వడం
  rationale: వాక్యంలోని ఏకవచన సర్వనామం మరియు యెహోవాను సూచించే సందర్భం ఏకవచన అర్థాన్ని నిర్ణయిస్తాయి. బహువచనాన్ని తెలుగులో యథాతథంగా ఇస్తే అనేక దేవుళ్ల భావం తప్పుగా కలుగుతుంది; అయితే మూలంలోని రూపభేదాన్ని పాదసూచికలో నమోదు చేశాం.
- issue: אֵל קַנּוֹא లో దేవుని ‘jealous’ లక్షణం
  choice: ‘తనకు మాత్రమే చెందవలసిన భక్తిని కోరే దేవుడు’ అని నిబంధనపరమైన ఏకైక హక్కును వ్యక్తం చేయడం
  alternative: ‘అసూయగల దేవుడు’
  rationale: ఇక్కడ భావం ఇతరుల మేలుపట్ల చిన్నబుచ్చుకునే అసూయ కాదు; తన ప్రజల అవిభక్త విశ్వాసంపై దేవునికున్న న్యాయమైన, ప్రత్యేక హక్కు. వివరణాత్మక అనువాదం ఆ తేడాను స్పష్టం చేస్తుంది.
- issue: לֹא יִשָּׂא అనే ప్రయోగంలో పాపాలను ‘మోయకపోవడం’
  choice: ‘క్షమించడు’ అని ప్రయోగార్థాన్ని ప్రధాన పాఠంలో ఇవ్వడం
  alternative: ‘మీ తిరుగుబాట్లను, పాపాలను మోయడు/తొలగించడు’
  rationale: పాపంతో కూడిన נשא ప్రయోగం సాధారణంగా క్షమించడాన్ని సూచిస్తుంది. అయినా రూపకంలోని ‘మోయడం’ భావాన్ని పాదసూచికలో ఉంచి అసలు భాషలోని విస్తృతిని కాపాడాం. హెచ్చరికలోని కఠినతను మృదువుచేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘యెహోవా’ను తెలుగులో స్థిరపడిన దైవనామ రూపంగా ఉంచాం. ‘అసూయగల’ అనే అపార్థసాధ్య పదానికి బదులు קַנּוֹא యొక్క నిబంధనపరమైన ప్రత్యేక భక్తి భావాన్ని సహజమైన వివరణాత్మక పదబంధంతో తెలిపాం. రెండు పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠంలో ఉన్నాయి.
