  to: 'యెహోషువ ప్రజలతో ఇలా అన్నాడు: “మీరు యాహ్వేను సేవించలేరు. ఎందుకంటే ఆయన పరిశుద్ధుడైన దేవుడు[a]; ఆయన అసూయగల దేవుడు. ఆయన మీ తిరుగుబాట్లను, మీ పాపాలను క్షమించడు[b].”'
  rationale: మూలంలోని אֵל קַנָּאను అనవసర వివరణ లేకుండా “అసూయగల దేవుడు”గా పునరుద్ధరించాం; ఇది నిబంధనలో దేవుని ప్రత్యేక హక్కును సూచించే మూల రూపకాన్ని కాపాడుతుంది. అలాగే యְהוָהకు ఇంగ్లీషు POB నిర్ణయమైన “Yahweh”ను అనుసరించి “యాహ్వే”గా లిప్యంతరీకరించాం. పాదసూచిక గుర్తులు, వాటి స్థానాలు, మరియు మూలంలోని బహువచన రూపవిశేషం तथा נשא ప్రయోగానికి సంబంధించిన వివరణ నిలిపి ఉంచాం.
