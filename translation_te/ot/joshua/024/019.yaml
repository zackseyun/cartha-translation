review_pass:
  verdict: revise
  source_fidelity: 'ముఖ్యార్థం హెబ్రీ మూలానికి నమ్మకంగా ఉంది: సామర్థ్యలేమి, సేవ, పరిశుద్ధత, పాపక్షమాపణను నిరాకరించడం అన్నీ సరిగ్గా ప్రతిఫలించాయి. అయితే אֵל קַנָּא ను ప్రధాన పాఠంలో విస్తృత వివరణగా మార్చడం మూలంలోని సంక్షిప్త విశేషణాన్ని మించిపోతుంది. అలాగే POB ఆడిట్ ట్రెయిల్‌లో నిర్ణయించిన దైవనామమైన “Yahweh”కు తెలుగు లిప్యంతరీకరణను అనుగుణంగా చేయాలి.'
  naturalness: సవరించిన పాఠం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉంది. “అసూయగల దేవుడు” అనే సంప్రదాయబద్ధ పదబంధం సందర్భంలో దేవునికి మాత్రమే ఉండే నిబంధనాపరమైన ప్రత్యేక హక్కును వ్యక్తం చేస్తుంది; దీనిని పాదసూచికలో అవసరమైతే వివరించవచ్చు, కానీ ఈ వచనానికి అదనపు వివరణ అవసరం లేదు.
  terminology: עבד కు “సేవించు,” פשע కు “తిరుగుబాట్లు,” חטאות కు “పాపాలు,” మరియు נשא యొక్క ప్రయోగార్థానికి “క్షమించడు” సరైనవి. యెహోవా స్థానంలో “యాహ్వే” వాడటం ఇంగ్లీషు POBలోని దైవనామ విధానానికి సరిపోతుంది.
  issues:
  - severity: medium
    issue: אֵל קַנָּא ను “తనకు మాత్రమే చెందవలసిన భక్తిని కోరే దేవుడు”గా విస్తరించారు.
    rationale: ఈ పదబంధం మూలంలోని “అసూయగల దేవుడు” అనే సంక్షిప్త విశేషణాన్ని వివరిస్తూ అదనపు భావాన్ని ప్రధాన పాఠంలో చేర్చుతుంది. మూల రూపకాన్ని నిలుపుతూ “అసూయగల దేవుడు”గా అనువదించడం మరింత సమానార్థకంగా ఉంటుంది.
  - severity: medium
    issue: దైవనామాన్ని “యెహోవా”గా ఇచ్చారు.
    rationale: ఆడిట్ ట్రెయిల్ యְהוָהకు “Yahweh”ను నిర్దేశించింది. అందువల్ల తెలుగు పాఠంలో “యాహ్వే” అనే లిప్యంతరీకరణ ప్రాజెక్టు నామవిధానాన్ని స్థిరంగా ప్రతిబింబిస్తుంది.
  revised_text: 'యెహోషువ ప్రజలతో ఇలా అన్నాడు: “మీరు యాహ్వేను సేవించలేరు. ఎందుకంటే ఆయన పరిశుద్ధుడైన దేవుడు[a]; ఆయన అసూయగల దేవుడు. ఆయన మీ తిరుగుబాట్లను, మీ పాపాలను క్షమించడు[b].”'
  revised_footnotes:
  - marker: a
    text: ‘దేవుడు,’ ‘పరిశుద్ధుడు’ అనే హెబ్రీ పదాలు ఇక్కడ రూపపరంగా బహువచనంలో ఉన్నాయి; అయితే ‘ఆయన’ అనే సర్వనామం ఏకవచనం. కాబట్టి ఇవి ఇశ్రాయేలు దేవుడైన ఒక్క యాహ్వేనే సూచిస్తున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థానికి దగ్గరగా: ‘ఆయన మీ తిరుగుబాట్లను, మీ పాపాలను మోయడు’ లేదా ‘తొలగించడు.’ ఈ హెబ్రీ ప్రయోగం సాధారణంగా క్షమించడాన్ని సూచిస్తుంది.'
    reason: alternative_reading
  revision_rationale: మూలంలోని אֵל קַנָּאను అనవసర వివరణ లేకుండా “అసూయగల దేవుడు”గా పునరుద్ధరించాం; ఇది నిబంధనలో దేవుని ప్రత్యేక హక్కును సూచించే మూల రూపకాన్ని కాపాడుతుంది. అలాగే యְהוָהకు ఇంగ్లీషు POB నిర్ణయమైన “Yahweh”ను అనుసరించి “యాహ్వే”గా లిప్యంతరీకరించాం. పాదసూచిక గుర్తులు, వాటి స్థానాలు, మరియు మూలంలోని బహువచన రూపవిశేషం तथा נשא ప్రయోగానికి సంబంధించిన వివరణ నిలిపి ఉంచాం.
