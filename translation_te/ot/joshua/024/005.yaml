  text: וָ/אֶשְׁלַ֞ח אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ וָ/אֶגֹּ֣ף אֶת מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּ֑/וֹ וְ/אַחַ֖ר הוֹצֵ֥אתִי אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/005.yaml
  text: Then I sent Moses and Aaron[a], and I struck Egypt as I did in its midst[b], and afterward I brought you out.
translation:
  language: te
  text: అప్పుడు నేను మోషేను, అహరోనును పంపాను; నేను దాని మధ్యలో చేసినదాని ప్రకారం ఐగుప్తును దెబ్బతీశాను[a][b]; ఆ తర్వాత మిమ్మల్ని బయటికి తీసుకొచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఐగుప్తును బాధించాను’ లేదా ‘ఐగుప్తును తెగుళ్లతో బాధించాను.’ హీబ్రూ క్రియకు ‘కొట్టు,’ ‘దెబ్బతీయు,’ ‘బాధించు’ అనే అర్థాలు ఉన్నాయి; ఇక్కడ అది ఐగుప్తుపై దేవుడు చేసిన దెబ్బలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దాని మధ్యలో నేను చేసినదాని ప్రకారం.’ ‘దాని’ అనేది ఐగుప్తును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: నేను… పంపాను
  rationale: שׁלח అనే క్రియకు సాధారణ అర్థం ‘పంపు’. మోషే, అహరోనులను దేవుడు నియోగించి పంపిన భావాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: מֹשֶׁה וְאֶת־אַהֲרֹן
  choice: మోషేను, అహరోనును
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలను ఉపయోగించాం.
- source_word: וָאֶגֹּף
  choice: దెబ్బతీశాను
  rationale: נגף అంటే ‘కొట్టు, దెబ్బతీయు, బాధించు’ అని అర్థం కావచ్చు. ఐగుప్తుమీద వచ్చిన దెబ్బలను సూచిస్తూ, మూలంలోని ప్రత్యక్షతను నిలుపుతుంది; ‘తెగుళ్లు పంపాను’ అనే సందర్భానుగుణ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: מִצְרַיִם
  choice: ఐగుప్తు
  rationale: ఈ పేరు ఇక్కడ దేశాన్ని లేదా సమష్టిగా దాని ప్రజలను సూచించగలదు. తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘ఐగుప్తు’ను ఎంచుకున్నాం.
- source_word: כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ
  choice: ఐగుప్తు మధ్యలో నేను చేసిన కార్యాల ద్వారా
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. ఈ అనువాదం ఐగుప్తులో దేవుడు చేసిన కార్యాలే దానిపై పడిన దెబ్బలని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְאַחַר
  choice: ఆ తర్వాత
  rationale: సంఘటనల కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: మిమ్మల్ని బయటికి తీసుకొచ్చాను
  rationale: יצא క్రియ హిఫీల్ రూపానికి ‘బయటికి తీసుకురావడం’ అనే కారణార్థం ఉంది. నిర్గమనాన్ని సూచించే మూలంలోని ప్రత్యక్ష ద్వితీయ పురుష బహువచనాన్ని నిలిపాం.
theological_decisions:
- issue: ‘మిమ్మల్ని’ అనే ద్వితీయ పురుష బహువచనానికి సూచితులు
  choice: ఇశ్రాయేలును సమష్టిగా ఉద్దేశించే ‘మిమ్మల్ని’ అనే ప్రత్యక్ష సంబోధనను నిలిపాం.
  alternative: ‘మీ పితరులను’ అని తక్షణ శ్రోతల పూర్వీకులకు మాత్రమే పరిమితం చేయడం.
  rationale: హీబ్రూ పాఠం నేరుగా ‘మిమ్మల్ని బయటికి తీసుకొచ్చాను’ అంటుంది. ఇది నిబంధనాపరమైన సమష్టి సంబోధనలో ప్రస్తుత ఇశ్రాయేలును నిర్గమన తరంతో అనుసంధానిస్తుంది; వివరణాత్మక మార్పుతో ఆ ఉద్వేగాన్ని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని సంక్షిప్త నిర్మాణాన్ని ప్రధాన పాఠంలో సహజీకరించి, దాని అక్షరార్థ అస్పష్టతను పాదసూచికలో భద్రపరిచాం. పాదసూచిక గుర్తులు సంబంధిత పదబంధం తర్వాత ప్రధాన పాఠంలో ఉంచబడ్డాయి.
