id: JOS.24.1
reference: Joshua 24:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֶּאֶסֹ֧ף יְהוֹשֻׁ֛עַ אֶת כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁכֶ֑מָ/ה וַ/יִּקְרָא֩ לְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל וּ/לְ/רָאשָׁ֗י/ו וּ/לְ/שֹֽׁפְטָי/ו֙ וּ/לְ/שֹׁ֣טְרָ֔י/ו וַ/יִּֽתְיַצְּב֖וּ לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
translation:
  language: te
  text: తరువాత యెహోషువ ఇశ్రాయేలు గోత్రాలన్నిటినీ షెకెముకు[a] సమకూర్చాడు. అతడు ఇశ్రాయేలు పెద్దలను, దాని అధిపతులను[b], న్యాయాధిపతులను, అధికారులను పిలిపించాడు. వారు దేవుని సన్నిధిలో[c] నిలిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘షెకెములో.’ హీబ్రూ రూపం దిశను సూచిస్తూ అక్షరార్థంగా ‘షెకెము వైపు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అధిపతులు’ అనే పదానికి అక్షరార్థం ‘తలలు’; భావార్థంగా ‘నాయకులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పాఠం ‘దేవుని ఎదుట’ అని చెబుతుంది; ఇది పరిశుద్ధ స్థలంలో లేదా నిబంధనకు సంబంధించిన పవిత్ర ప్రదేశంలో హాజరుకావడాన్ని సూచించి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֶסֹף
  choice: సమకూర్చాడు
  rationale: ఈ కథన సందర్భంలో ప్రజలను ఒకచోటికి చేర్చడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలు
  rationale: ఇశ్రాయేలు సామాజిక-జాతీయ విభాగాలకు సాధారణమైన, ఖచ్చితమైన తెలుగు పదప్రయోగం.
- source_word: שְׁכֶמָה
  choice: షెకెముకు
  rationale: స్థలనామానికి జతైన దిశార్థక ה అక్కడికి వెళ్లడాన్ని సూచిస్తుంది; అందువల్ల ‘షెకెముకు’ మూలరూపాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: וַיִּקְרָא לְ
  choice: పిలిపించాడు
  rationale: నిర్దిష్ట నాయకులను సభకు రప్పించాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలు
  rationale: గుర్తింపు పొందిన నాయకత్వ వర్గాన్ని సూచించే సహజమైన, సంప్రదాయ తెలుగు సమానార్థకం.
- source_word: רָאשָׁיו
  choice: దాని అధిపతులు
  rationale: ఏకవచన ప్రత్యయం సమష్టిగా ఇశ్రాయేలును సూచిస్తుంది. ‘అధిపతులు’ మూలంలోని ‘తలలు’ అనే నాయకత్వ రూపకాన్ని సహజంగా వ్యక్తపరుస్తూ పెద్దల వర్గం నుంచి ఈ పదవిని వేరు చేస్తుంది.
- source_word: שֹׁפְטָיו
  choice: న్యాయాధిపతులు
  rationale: పౌర-న్యాయ సంబంధిత అధికార పదవిని స్పష్టంగా సూచిస్తుంది.
- source_word: שֹׁטְרָיו
  choice: అధికారులు
  rationale: పరిపాలనా బాధ్యతలు నిర్వహించే అధికారులను సూచించే విస్తృతమైన, సహజ తెలుగు పదం.
- source_word: וַיִּתְיַצְּבוּ
  choice: నిలిచారు
  rationale: హిత్పయేల్ రూపం అధికారికంగా హాజరై తమ స్థానంలో నిలబడటాన్ని సూచిస్తుంది; ‘దేవుని సన్నిధిలో నిలిచారు’ అనే పూర్తి వాక్యం ఆ ఆచారబద్ధ భావాన్ని అందిస్తుంది.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: దేవుని సన్నిధిలో
  rationale: హీబ్రూ వాక్యంలోని ‘దేవుని ఎదుట’ అనే భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నేరుగా నిలుపుతుంది; యెహోవా అనే దైవనామాన్ని గానీ దేవాలయాన్ని గానీ మూలంలో లేనివిధంగా చేర్చదు.
theological_decisions:
- issue: నిబంధన సభ సందర్భంలో לִפְנֵי הָאֱלֹהִים అనువాదం
  choice: దేవుని సన్నిధిలో
  alternative: దేవుని పరిశుద్ధ స్థలం ఎదుట
  rationale: హీబ్రూ పాఠంలో యెహోవా అనే దైవనామం కాక אֱלֹהִים ఉంది; కాబట్టి ప్రధాన పాఠంలో ‘ప్రభువు’ అని మార్చలేదు. ఈ మాట పరిశుద్ధ స్థలంలో హాజరుకావడాన్ని సూచించే అవకాశం ఉన్నా, పాఠం ఆ స్థలాన్ని ప్రత్యక్షంగా పేర్కొనదు; అందువల్ల ఆ భావాన్ని పాదసూచికలో మాత్రమే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సమష్టి ఏకవచన ప్రత్యయాన్ని ‘దాని’ ద్వారా నిలిపాం; ‘దేవుని సన్నిధిలో’ అనే ప్రయోగం ఆచారబద్ధ సందర్భాన్ని తెలియజేసినా, పాఠంలో లేని దేవాలయ సూచనను ప్రధాన వాక్యంలో చేర్చదు.
