  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤עַן הָ/עָם֙ וַ/יֹּ֔אמֶר חָלִ֣ילָ/ה לָּ֔/נוּ מֵ/עֲזֹ֖ב אֶת יְהוָ֑ה לַ/עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/016.yaml
  text: Then the people answered and said[a], “Far be it from us to forsake Yahweh and serve other gods.”
translation:
  language: te
  text: 'అప్పుడు ప్రజలు జవాబుగా ఇలా అన్నారు: “యాహ్వేను విడిచిపెట్టి ఇతర దేవుళ్లను సేవించడం మాకు ఎంతమాత్రమూ తగదు[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థానికి దగ్గరగా, “యాహ్వేను విడిచిపెట్టి ఇతర దేవుళ్లను సేవించడం మాకు దూరమగుగాక.” ఇది తీవ్ర నిరాకరణను తెలిపే హీబ్రూ నుడికారం; ఈ నుడికారంలో దేవుని పేరు ప్రత్యేకంగా ప్రస్తావించబడలేదు.
    reason: నుడికారానికి సంబంధించిన ప్రత్యామ్నాయ అనువాదం మరియు వివరణ
lexical_decisions:
- source_word: וַיַּעַן הָעָם וַיֹּאמֶר
  choice: ప్రజలు జవాబుగా ఇలా అన్నారు
  rationale: హీబ్రూ వాక్యంలో ‘జవాబిచ్చారు’ మరియు ‘అన్నారు’ అనే రెండు మాటలూ ఉన్నాయి. తెలుగులో సహజంగా వినిపిస్తూ రెండింటి భావాన్నీ నిలుపుకోవడానికి ఈ నిర్మాణం ఎంచుకున్నాం.
- source_word: חָלִילָה לָּנוּ
  choice: అది మా వల్ల కానేకాదు
  rationale: ఇది ఏదో కార్యాన్ని తీవ్రంగా తిరస్కరించే హీబ్రూ నుడికారం. మూలంలో దేవుని ప్రస్తావన లేకపోవడం వల్ల ‘దేవుడు అలా జరగనివ్వకుండుగాక’ అని చేర్చకుండా, బలమైన నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేశాం.
- source_word: מֵעֲזֹב
  choice: విడిచిపెట్టి
  rationale: ఇక్కడ עזב అనేది యాహ్వే పట్ల నిబంధనాత్మక విధేయతను వదిలేయడాన్ని సూచిస్తుంది. ‘విడిచిపెట్టి’ అనే మాట ఆ సంబంధాన్ని త్యజించే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణ ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: לַעֲבֹד
  choice: సేవించడం
  rationale: దేవతల సందర్భంలో עבד ఆరాధన, విధేయత, సేవ అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంటుంది. ‘సేవించడం’ ఈ విస్తృతిని నిలుపుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లు
  rationale: ఈ పదబంధానికి నేరమైన అర్థం ‘ఇతర దేవుళ్లు’; ‘అన్య దేవుళ్లు’ లేదా ‘విదేశీ దేవుళ్లు’ అనడం మూలంలో స్పష్టంగా లేని అదనపు ఛాయను కలిగించవచ్చు.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్నే ఉపయోగిస్తుంది. కాబట్టి దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు; ‘Yahweh’కు సరిపోయే తెలుగు లిప్యంతరీకరణను వాడాం.
- issue: חָלִילָה అనే నుడికారం
  choice: అది మా వల్ల కానేకాదు
  alternative: దేవుడు అలా జరగనివ్వకుండుగాక; అది మాకు దూరమగుగాక
  rationale: ఈ నుడికారం తీవ్ర నిరాకరణను తెలియజేస్తుంది, కానీ దేవుణ్ణి స్పష్టంగా ప్రస్తావించదు. ఎంపిక చేసిన రూపం ఆ బలాన్ని నిలుపుతూ మూలంలో లేని దైవప్రస్తావనను చేర్చదు.
- issue: యాహ్వేను విడిచిపెట్టడం మరియు ఇతర దేవుళ్లను సేవించడం మధ్య సంబంధం
  choice: విడిచిపెట్టి … సేవించడం
  alternative: విడిచిపెట్టడం మరియు … సేవించడం
  rationale: హీబ్రూలో ఇతర దేవుళ్లను సేవించడం, యాహ్వేను విడిచిపెట్టడంలో ఉద్దేశించిన పరిణామం లేదా అనుబంధ చర్యగా వ్యక్తమవుతుంది. తెలుగు క్రియాక్రమం ఈ సంబంధాన్ని సహజంగా, అతిగా విడదీయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘కానేకాదు’ తీవ్ర నిరాకరణను అందిస్తుంది; డాష్ ఆ నిరాకరణపై సహజమైన వాక్యబలాన్ని ఉంచుతుంది.
