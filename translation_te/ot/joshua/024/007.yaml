  text: וַ/יִּצְעֲק֣וּ אֶל יְהוָ֗ה וַ/יָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵי/כֶ֣ם וּ/בֵ֣ין הַ/מִּצְרִ֗ים וַ/יָּבֵ֨א עָלָ֤י/ו אֶת הַ/יָּם֙ וַ/יְכַסֵּ֔/הוּ וַ/תִּרְאֶ֨ינָה֙ עֵינֵי/כֶ֔ם אֵ֥ת אֲשֶׁר עָשִׂ֖יתִי בְּ/מִצְרָ֑יִם וַ/תֵּשְׁב֥וּ בַ/מִּדְבָּ֖ר יָמִ֥ים רַבִּֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
translation:
  language: te
  text: వారు యాహ్వేకు మొరపెట్టారు. ఆయన మీకూ ఐగుప్తీయులకూ మధ్య చీకటిని ఉంచి, సముద్రాన్ని అతనిమీదికి తెచ్చి, అతన్ని దానితో కప్పివేశాడు.[a] ఐగుప్తులో నేను చేసినదాన్ని మీ కన్నులే చూశాయి. ఆ తరువాత మీరు అరణ్యంలో చాలా రోజులు నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ఇక్కడ ‘అతనిమీదికి’, ‘అతన్ని’ అనే సర్వనామాలు ఏకవచనంలో ఉన్నాయి. అవి ఐగుప్తును లేదా ఐగుప్తీయుల సైన్యాన్ని సమష్టిగా సూచించవచ్చు; అనేక అనువాదాలు వాటిని ‘వారి మీదికి’, ‘వారిని’ అని బహువచనంలో ఇస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצְעֲקוּ אֶל־יְהוָה
  choice: వారు యాహ్వేకు మొరపెట్టారు
  rationale: צעק ఆపదలో సహాయం కోసం చేసే అత్యవసర మొరను సూచిస్తుంది. אֶל־יְהוָה ఆ మొర యాహ్వేను ఉద్దేశించినదని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: מַאֲפֵל
  choice: చీకటి
  rationale: ఈ నామవాచకం చీకటి లేదా గాఢాంధకారాన్ని సూచించగలదు. సందర్భానికి సరిపోయేలా, తీవ్రతను అనవసరంగా నిర్దిష్టం చేయకుండా ‘చీకటి’ అని అనువదించాం.
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  choice: మీకూ ఐగుప్తీయులకూ మధ్య
  rationale: రెండవ పురుష బహువచన సంబోధనను, ఐగుప్తీయులతో ఉన్న విభజనను స్పష్టంగా నిలిపాం.
- source_word: וַיָּבֵא עָלָיו אֶת־הַיָּם וַיְכַסֵּהוּ
  choice: సముద్రాన్ని అతని మీదికి రప్పించి అతన్ని కప్పివేశాడు
  rationale: עָלָיו, וַיְכַסֵּהוּ రెండింటిలోనూ ఉన్న ఏకవచన పుంలింగ ప్రత్యయాలను బహువచనంగా మార్చకుండా నిలిపాం. అవి ఐగుప్తును లేదా ఐగుప్తీయుల సైన్యాన్ని సమష్టిగా సూచించే అవకాశం ఉంది.
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  choice: మీ కన్నులే చూశాయి
  rationale: హీబ్రూలో ‘మీ కన్నులు’ అని స్పష్టంగా ఉన్న ప్రత్యక్ష సాక్ష్య భావాన్ని తెలుగులో సహజమైన ఉద్ఘాటనతో నిలిపాం.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי בְּמִצְרָיִם
  choice: ఐగుప్తులో నేను చేసినదాన్ని
  rationale: בְּמִצְרָיִם ను ‘ఐగుప్తులో’ అని అనువదించడం స్థలార్థాన్ని నిలుపుతుంది; ‘ఐగుప్తుకు వ్యతిరేకంగా’ అని వ్యాఖ్యానాత్మకంగా విస్తరించలేదు.
- source_word: וַתֵּשְׁבוּ בַמִּדְבָּר יָמִים רַבִּים
  choice: మీరు అరణ్యంలో చాలా రోజులు నివసించారు
  rationale: יָשַׁב యొక్క దీర్ఘకాల నివాస భావాన్ని ‘నివసించారు’ అని, יָמִים רַבִּים యొక్క అక్షరార్థాన్ని ‘చాలా రోజులు’ అని ఇచ్చాం; దాన్ని ‘చాలా సంవత్సరాలు’గా విస్తరించలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలంలోని నామాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: ఐగుప్తీయుల తరువాత వచ్చే ఏకవచన సర్వనామాలను నిలపాలా
  choice: ‘అతని మీదికి’, ‘అతన్ని’ అనే ఏకవచన రూపాలను నిలిపాం
  alternative: అర్థసౌలభ్యం కోసం ‘వారి మీదికి’, ‘వారిని’ అని బహువచనంగా మార్చడం
  rationale: హీబ్రూ ప్రత్యయాలు వ్యాకరణపరంగా ఏకవచనంలో ఉన్నాయి. అవి ఐగుప్తును లేదా దాని సైన్యాన్ని సమష్టిగా సూచించవచ్చు; మూలంలోని అసాధారణతను ప్రధాన పాఠంలో నిలిపి, వివరణను పాదటిప్పణిలో ఇచ్చాం.
- issue: మూడవ పురుష వర్ణన నుండి మొదటి పురుష దైవవాక్యానికి మార్పు
  choice: ‘ఆయన... కప్పివేశాడు; ... నేను చేసినదాన్ని’ అనే మార్పును నిలిపాం
  alternative: వాక్యమంతటినీ ఒకే పురుషంలో సవరించడం
  rationale: మూలపాఠం యాహ్వేను మూడవ పురుషంలో పేర్కొని, తరువాత ‘నేను చేసినది’ అని మొదటి పురుషానికి మారుతుంది. ఈ వాక్య నిర్మాణంలోని ఒత్తిడిని సమతలీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. ‘మొరపెట్టారు’, ‘నివసించారు’ వంటి సామాన్యులకు అర్థమయ్యే పదాలను వాడాం. మూలంలోని ఏకవచన సర్వనామాల అసాధారణతను ఉద్దేశపూర్వకంగా నిలిపాం; [a] గుర్తును సంబంధిత వాక్యభాగం వెంట ఉంచాం.
