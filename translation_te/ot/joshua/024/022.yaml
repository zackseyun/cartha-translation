  naturalness: The wording is generally clear in modern standard Telugu. Recasting the direct speech with a semicolon improves readability without altering the source’s syntactic relationship. “మేము సాక్షులం” is a natural rendering of the Hebrew’s elliptical reply.
  terminology: Use యాహ్వే for יהוה, in keeping with the project’s stated divine-name policy and English audit trail. “సేవించడానికి” appropriately preserves the broad covenantal sense of לעבוד.
