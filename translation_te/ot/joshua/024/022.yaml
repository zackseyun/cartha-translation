source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ בָּ/כֶ֔ם כִּֽי אַתֶּ֞ם בְּחַרְתֶּ֥ם לָ/כֶ֛ם אֶת יְהוָ֖ה לַ/עֲבֹ֣ד אוֹת֑/וֹ וַ/יֹּאמְר֖וּ עֵדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
translation:
  language: te
  text: 'అప్పుడు యెహోషువ ప్రజలతో ఇలా అన్నాడు: “మీరు యాహ్వేను సేవించడానికి మీ కోసం మీరే ఆయనను ఎన్నుకున్నారని మీకు వ్యతిరేకంగా మీరే సాక్షులు.” వారు, “మేము సాక్షులం” అన్నారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సందర్భంలో సమకూడిన ఇశ్రాయేలు ప్రజలను సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: עֵדִים אַתֶּם בָּכֶם
  choice: మీకు వ్యతిరేకంగా మీరే సాక్షులు
  rationale: నిబంధనాత్మక-న్యాయ సందర్భంలో వారి స్వంత మాటలే వారిపై సాక్ష్యంగా నిలుస్తాయనే భావాన్ని తెలియజేస్తుంది; בָּכֶם లోని భావసందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: כִּי
  choice: '...అని'
  rationale: వారు దేనికి సాక్షులో ఆ సాక్ష్యపు విషయాన్ని పరిచయం చేస్తుంది.
- source_word: בְּחַרְתֶּם לָכֶם
  choice: మీ కోసం మీరే ... ఎన్నుకున్నారు
  rationale: ఎంపిక వారిదేనని, తమ తరఫున తామే చేసుకున్నారని לָכֶם ఇచ్చే స్వీయ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ప్రత్యక్ష లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: לַעֲבֹד אֹתוֹ
  choice: ఆయనను సేవించడానికి
  rationale: עבד లోని విధేయత, ఆరాధనతో కూడిన సేవ అనే విస్తృత భావాన్ని ‘సేవించడం’ నిలుపుతుంది.
- source_word: וַיֹּאמְרוּ עֵדִים
  choice: వారు, ‘మేము సాక్షులమే’ అన్నారు
  rationale: హీబ్రూ జవాబు సంక్షిప్తంగా ఉన్నా, సహజమైన తెలుగుకోసం అంతర్లీనమైన ‘మేము’ మరియు సమాపక క్రియాభావాన్ని స్పష్టంచేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: בָּכֶם యొక్క న్యాయపరమైన దిశ
  choice: మీకు వ్యతిరేకంగా
  alternative: మీ విషయమై / మీకే
  rationale: వారి స్వీయ ప్రకటన భవిష్యత్తులో వారిపైనే సాక్ష్యంగా నిలిచే నిబంధనాత్మక ఉద్వేగాన్ని ప్రధాన పాఠంలో చూపించాం; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. ‘మీ కోసం మీరే’ అనే పదక్రమం לָכֶם లోని స్వీయ ఎంపిక ఉద్ఘాటనను నిలుపుతుంది; ‘సాక్షులమే’ ప్రజల సంక్షిప్తమైన కానీ దృఢమైన జవాబును ప్రతిబింబిస్తుంది.
