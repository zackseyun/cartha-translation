    issue: The divine name is rendered యెహోవా rather than యాహ్వే.
    rationale: The original contains the Tetragrammaton, and the provided English POB theological and lexical decisions explicitly prescribe “Yahweh.” The Telugu transliteration should correspond to that approved form rather than introduce the alternative “Jehovah.”
