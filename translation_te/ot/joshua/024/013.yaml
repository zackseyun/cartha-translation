id: JOS.24.13
reference: Joshua 24:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶתֵּ֨ן לָ/כֶ֜ם אֶ֣רֶץ אֲשֶׁ֧ר לֹֽא יָגַ֣עְתָּ בָּ֗/הּ וְ/עָרִים֙ אֲשֶׁ֣ר לֹא בְנִיתֶ֔ם וַ/תֵּשְׁב֖וּ בָּ/הֶ֑ם כְּרָמִ֤ים וְ/זֵיתִים֙ אֲשֶׁ֣ר לֹֽא נְטַעְתֶּ֔ם אַתֶּ֖ם אֹכְלִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/013.yaml
  text: And I gave you a land on which you had not labored[a], and cities that you had not built, and you live in them. You are eating from vineyards and olive groves that you did not plant.
translation:
  language: te
  text: మీరు శ్రమించని దేశాన్ని, మీరు కట్టని పట్టణాలను నేను మీకు ఇచ్చాను. మీరు ఆ పట్టణాల్లో నివసిస్తున్నారు. మీరు నాటని ద్రాక్షతోటల నుండీ ఒలీవ తోటల[a] నుండీ మీరు తింటున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదాన్ని అక్షరార్థంగా ‘ఒలీవలు’ లేదా ‘ఒలీవ చెట్లు’ అని కూడా అనువదించవచ్చు. ద్రాక్షతోటలకు సమాంతరంగా సాగుచేసిన చెట్ల సమూహాన్ని సూచించడానికి ఇక్కడ ‘ఒలీవ తోటలు’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: నేను మీకు ఇచ్చాను
  rationale: Qal wayyiqtol దేవుడు గతంలో చేసిన కార్యాన్ని కథన క్రమంలో తెలియజేస్తుంది; తెలుగులో పూర్తి భూతకాలం సహజంగా ఉంటుంది.
- source_word: אֶרֶץ אֲשֶׁר לֹא יָגַעְתָּ בָּהּ
  choice: మీరు శ్రమించని దేశాన్ని
  rationale: יגע అంటే శ్రమించడం లేదా కష్టపడడం. భూమికి సంబంధించి ‘శ్రమించని’ అనడం మూలంలోని భావాన్ని సహజంగా తెలియజేస్తుంది. ఏకవచన రూపం ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సంబోధిస్తోంది.
- source_word: וְעָרִים אֲשֶׁר לֹא בְנִיתֶם
  choice: మీరు కట్టని పట్టణాలను
  rationale: עיר పదానికి సందర్భానుగుణంగా ‘పట్టణం’ సహజమైన ఆధునిక తెలుగు సమానార్థకం; בנה యొక్క సాధారణ భావం ‘కట్టు’.
- source_word: וַתֵּשְׁבוּ בָּהֶם
  choice: మీరు ఆ పట్టణాల్లో నివసిస్తున్నారు
  rationale: ישב ఇక్కడ స్థిరంగా నివసించడాన్ని సూచిస్తుంది. ప్రత్యక్ష పూర్వపదమైన పట్టణాలను మళ్లీ పేర్కొనడం తెలుగులో సూచనను స్పష్టంగా ఉంచుతుంది; వర్తమాన కాలం గతంలో లభించిన బహుమానం యొక్క కొనసాగుతున్న ఫలితాన్ని చూపుతుంది.
- source_word: כְּרָמִים
  choice: ద్రాక్షతోటలు
  rationale: כרמיםకు ప్రామాణికమైన వ్యవసాయార్థక తెలుగు పదం.
- source_word: וְזֵיתִים
  choice: ఒలీవ తోటలు[a]
  rationale: హీబ్రూ పదం అక్షరార్థంగా ఒలీవలు లేదా ఒలీవ చెట్లను సూచించగలదు. ద్రాక్షతోటలకు సమాంతరంగా సాగుచేసిన ఒలీవ చెట్ల సమూహాన్ని తెలుగులో ‘ఒలీవ తోటలు’ సహజంగా వ్యక్తపరుస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: אֲשֶׁר לֹא נְטַעְתֶּם אַתֶּם אֹכְלִים
  choice: మీరు నాటని … నుండీ మీరు తింటున్నారు
  rationale: נטע అంటే ‘నాటు’. స్వతంత్ర సర్వనామం אַתֶּםతో కూడిన participle కొనసాగుతున్న, కొంత ఉద్ఘాటితమైన వర్తమాన చర్యను సూచిస్తుంది; రెండవ ‘మీరు’ను ఉంచడం ఆ ఉద్ఘాటనను కాపాడుతుంది.
theological_decisions:
- issue: రెండవ పురుష ఏకవచన, బహువచన రూపాల మార్పు
  choice: రెండింటినీ సమష్టిగా ఇశ్రాయేలును ఉద్దేశించిన ‘మీరు’గా అనువదించడం
  alternative: మొదటి క్రియ వద్ద ఏకవచనాన్ని ప్రత్యేకంగా సూచించడం
  rationale: యָגַעְתָּ వ్యాకరణపరంగా ఏకవచనమైనా, తరువాతి రూపాలు బహువచనంలో ఉన్నాయి; సంబోధన ఒడంబడిక సమాజమైన ఇశ్రాయేలుకే. ఆధునిక తెలుగులో ‘మీరు’ ఈ సమష్టి సంబోధనను సహజంగా ఉంచి, అనవసరమైన వివరణతో భావాన్ని పరిష్కరించదు.
- issue: ఇచ్చిన పట్టణాల్లో నివాసం యొక్క కాలదృష్టి
  choice: ‘నివసిస్తున్నారు’ అనే కొనసాగుతున్న వర్తమానం
  alternative: ‘నివసించారు’ లేదా ‘స్థిరపడ్డారు’
  rationale: హీబ్రూ కథనరూపం గతంలో స్థిరపడడాన్ని సూచించగలిగినా, యెహోషువ ప్రసంగ సమయంలో కొనసాగుతున్న ఫలితమూ సందర్భంలో స్పష్టంగా ఉంది. వర్తమానం ఆ ఉద్రిక్తతను సహజంగా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘నుండీ … నుండీ’ నిర్మాణం మూలంలోని పంట వనరుల నుండి తినడం అనే భావాన్ని అదనంగా ‘ఫలాలు’ లేదా ‘పంట’ చేర్చకుండా కాపాడుతుంది.
