id: JOS.24.2
reference: Joshua 24:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם כֹּֽה אָמַ֣ר יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ בְּ/עֵ֣בֶר הַ/נָּהָ֗ר יָשְׁב֤וּ אֲבֽוֹתֵי/כֶם֙ מֵֽ/עוֹלָ֔ם תֶּ֛רַח אֲבִ֥י אַבְרָהָ֖ם וַ/אֲבִ֣י נָח֑וֹר וַ/יַּעַבְד֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
translation:
  language: te
  text: 'యెహోషువ ప్రజలందరితో ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడైన యెహోవా ఇలా అంటున్నాడు: ‘చాలా కాలం క్రితం మీ పితరులు నదికి అవతల[a] నివసించారు—అబ్రాహాముకూ నాహోరుకూ తండ్రియైన తెరహు[b]—మరియు వారు ఇతర దేవుళ్లను సేవించారు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “నది” అనేది బహుశా యూఫ్రటీసు నదిని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: హీబ్రూలో తెరహు పేరు “మీ పితరులు” అనే మాటకు వివరణగా వస్తుంది; అతడు అబ్రాహాముకూ నాహోరుకూ తండ్రి.
    reason: translation_clarity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు భూతకాల క్రియతో తెలియజేస్తుంది.
- source_word: אֶל כָּל הָעָם
  choice: ప్రజలందరితో
  rationale: సమకూడిన నిబంధన సమాజాన్ని సూచించే עָםకు సహజమైన తెలుగు రూపం.
- source_word: כֹּה אָמַר
  choice: ఇలా చెబుతున్నాడు
  rationale: దైవ సందేశ సూత్రాన్ని తెలుగులో సహజంగా, ప్రత్యక్ష ప్రకటనగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: సంబంధార్థక నిర్మాణాన్ని స్పష్టమైన తెలుగు విశేషణ నిర్మాణంగా అందిస్తుంది.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: నదికి అవతల
  rationale: హీబ్రూ భౌగోళిక వ్యక్తీకరణను యూఫ్రటీసు అని ప్రధాన పాఠంలో స్పష్టీకరించకుండా నిలుపుతుంది.
- source_word: יָשְׁבוּ
  choice: నివసించారు
  rationale: పూర్వీకుల స్థిర నివాసాన్ని సూచించే గౌరవప్రదమైన, ఆధునిక తెలుగు పదం.
- source_word: אֲבוֹתֵיכֶם
  choice: మీ పితరులు
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని, పూర్వీకుల భావాన్ని నిలుపుతుంది.
- source_word: מֵעוֹלָם
  choice: చాలా కాలం క్రితం
  rationale: ఈ సందర్భంలో నిత్యతను కాక ప్రాచీన కాలాన్ని సూచిస్తుంది.
- source_word: תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר
  choice: అబ్రాహాముకు, నాహోరుకు తండ్రియైన తెరహు
  rationale: తెరహు ఇద్దరికీ తండ్రి అనే సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּעַבְדוּ
  choice: వారు ... సేవించారు
  rationale: עבדలోని మతపరమైన సేవ/ఆరాధన భావాన్ని, 'ఆరాధించారు' అని మాత్రమే పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను
  rationale: బహువచనాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చకుండా ఉంచుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది; హీబ్రూ ఉచ్చారణ పునర్నిర్మాణంపై ఉన్న అనిశ్చితిని సిద్ధాంతపరంగా పరిష్కరించదు.
- issue: אֲבוֹתֵיכֶם యొక్క పూర్వీకుల సూచన
  choice: మీ పితరులు
  alternative: మీ పూర్వీకులు
  rationale: మూలంలోని పుంలింగ రూపాన్ని నిలుపుతూ, ఇది వంశపూర్వికులను సూచిస్తుందని పాఠ్య సందర్భం తెలియజేస్తుంది.
- issue: తెరహు మరియు బహువచన కర్త మధ్య సంబంధం
  choice: తెరహు కూడా వారిలో ఒకడు
  alternative: మీ పితరులు—తెరహు...
  rationale: హీబ్రూలోని బహువచన 'పితరులు/వారు' మరియు ఏకవచన తెరహు మధ్యనున్న వివరణాత్మక సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది; ఇతర పితరులను విస్మరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. 'పితరులు', 'నివసించారు', 'సేవించారు' వంటి పదాలు మూలానికి దగ్గరగా ఉండి సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
