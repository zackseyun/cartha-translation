id: JOS.24.31
reference: Joshua 24:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
translation:
  language: te
  text: యెహోషువ జీవించిన కాలమంతా, యెహోషువను మించి జీవించిన, యాహ్వే ఇశ్రాయేలు కోసం చేసిన కార్యాలన్నిటినీ[a] తెలిసిన పెద్దలు జీవించిన కాలమంతా, ఇశ్రాయేలు యాహ్వేను సేవించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే చేసిన చర్యలన్నిటినీ.”
    reason: మַעֲשֶׂה అనే పదానికి ‘కార్యం,’ ‘పని,’ ‘చర్య’ అనే అర్థాలు సాధ్యమైనందున ప్రత్యామ్నాయ పదప్రయోగాన్ని ఇస్తోంది.
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: సేవించారు
  rationale: עבד అనే క్రియ యాహ్వే పట్ల నిబంధనాత్మక విధేయతను సూచిస్తుంది; ఇందులో ఆరాధన ఉన్నప్పటికీ భావం దానికంటే విస్తృతమైనది. అందువల్ల ‘సేవించారు’ అనేది ఆ విస్తృతిని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా ఆధునిక తెలుగు లిపిలో ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: כֹּל יְמֵי
  choice: జీవించిన కాలమంతా
  rationale: ‘అన్ని దినాలు’ అనే అక్షరార్థ రూపం కంటే, వ్యక్తుల జీవితకాలాన్ని సూచించే హీబ్రూ కాలవ్యక్తీకరణను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַזְּקֵנִים
  choice: పెద్దలు
  rationale: ఇశ్రాయేలు సమాజంలో వయస్సుతో పాటు గుర్తింపు పొందిన నాయకత్వ స్థానాన్నీ సూచించగల పదం; ‘పెద్దలు’ ఈ రెండింటినీ అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  choice: యెహోషువ తర్వాత కూడా జీవించి
  rationale: ఈ హీబ్రూ నుడికారం వారు యెహోషువను మించి జీవించారని సూచిస్తుంది. తెలుగులో ‘యెహోషువ తర్వాత కూడా జీవించి’ అనేది సహజంగా ఉండి, వారి వయస్సుల గురించి అనవసరమైన పోలికను కలిగించదు.
- source_word: יָדְעוּ
  choice: స్వయంగా తెలిసిన
  rationale: ఇక్కడ పెద్దలకు యాహ్వే కార్యాల గురించి వ్యక్తిగత, ప్రత్యక్ష పరిజ్ఞానం ఉందనే భావం ఉంది. ‘స్వయంగా తెలిసిన’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘అనుభవించిన’ అని అనువదిస్తే మూలపదం కంటే భావాన్ని మరీ సంకుచితం చేసే అవకాశం ఉంది.
- source_word: כָּל מַעֲשֵׂה יְהוָה
  choice: యాహ్వే ... చేసిన కార్యాలన్నిటినీ
  rationale: מַעֲשֶׂה పని, కార్యం, క్రియ అనే భావాలను కలిగి ఉంది. సందర్భంలో దేవుడు చేసిన చారిత్రక కార్యాలను ‘కార్యాలన్నిటినీ’ సహజంగా తెలియజేస్తుంది; సమూహార్థక ఏకవచనాన్ని తెలుగులో బహువచనంగా వ్యక్తం చేశాం.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు కోసం చేసిన
  rationale: לְ ఉపసర్గ సందర్భంలో ఇశ్రాయేలు మేలు కోసం చేసిన కార్యాలను సూచిస్తుంది. ‘కోసం’ అనే రూపం ఆ అనుకూల భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలవచనంలో దైవనామమైన יהוה నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం వ్యక్తిగత నిబంధన నామాన్ని నిలుపుతుంది.
- issue: עבד యొక్క నిబంధనాత్మక భావం
  choice: సేవించారు
  alternative: ఆరాధించారు
  rationale: ఈ క్రియ ఆరాధనను కలిగి ఉండగలిగినా, ఇక్కడ యాహ్వే పట్ల ఇశ్రాయేలు చూపిన విస్తృతమైన విధేయత, విశ్వాసనిష్ఠను సూచిస్తుంది. ‘సేవించారు’ ఆ భావపరిధిని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని రెండు కాలపరిమితులను నిలుపుతూ, తెలుగులో ప్రధాన క్రియ చివర వచ్చేలా వాక్యాన్ని అమర్చాం. [a] గుర్తును దానికి సంబంధించిన ‘కార్యాలన్నిటినీ’ అన్న పదబంధం వెంట ఉంచాం.
