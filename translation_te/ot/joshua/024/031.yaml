  naturalness: సవరించిన వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనక్రమాన్ని, ప్రధాన క్రియను చివర ఉంచే నిర్మాణాన్ని నిలుపుతుంది. ‘యెహోషువను మించి జీవించిన’ అనే రూపం ‘యెహోషువ తర్వాత కూడా జీవించి’ కంటే సంక్షిప్తంగా, స్పష్టంగా ఉంటుంది.
  terminology: ‘యాహ్వే,’ ‘ఇశ్రాయేలు,’ ‘పెద్దలు,’ ‘సేవించింది,’ ‘కార్యాలన్నిటినీ’ అనే పదాలు మూలార్థానికి, స్థిరమైన గౌరవప్రదమైన వాడుకకు తగినవి. పాదటిప్పణిలో ప్రత్యామ్నాయంగా బహువచనమైన ‘చర్యలన్నిటినీ’ ఉపయోగించడం మూలంలోని సమూహార్థక מַעֲשֵׂהను తెలుగు అనువాదంలోని బహువచనంతో సమన్వయపరుస్తుంది.
