  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֮ וַ/תָּבֹ֣אוּ אֶל יְרִיחוֹ֒ וַ/יִּלָּחֲמ֣וּ בָ/כֶ֣ם בַּעֲלֵֽי יְ֠רִיחוֹ הָֽ/אֱמֹרִ֨י וְ/הַ/פְּרִזִּ֜י וְ/הַֽ/כְּנַעֲנִ֗י וְ/הַֽ/חִתִּי֙ וְ/הַ/גִּרְגָּשִׁ֔י הַֽ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וָ/אֶתֵּ֥ן אוֹתָ֖/ם בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
translation:
  language: te
  text: తర్వాత మీరు యొర్దాను నదిని దాటి యెరికోకు వచ్చారు. యెరికోవారు[a] మీకు వ్యతిరేకంగా యుద్ధం చేశారు—అమోరీయులు, పెరిజ్జీయులు, కనానీయులు, హిత్తీయులు, గిర్గాషీయులు, హివ్వీయులు, యెబూసీయులు—మరియు నేను వారిని మీ చేతికి అప్పగించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెరికో అధిపతులు’ లేదా ‘యెరికో పురుషులు.’ హీబ్రూ పదబంధానికి అక్షరార్థం ‘యెరికో యజమానులు/ప్రభువులు’; ఇది నగర పాలకులను లేదా ప్రముఖులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: మీరు యొర్దాను నదిని దాటి
  rationale: עבר అనే క్రియ నదిని దాటడాన్ని సూచిస్తుంది. తెలుగులో స్పష్టత కోసం స్థిరనామంతో పాటు ‘నది’ చేర్చబడింది.
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  choice: యెరికోకు వచ్చారు
  rationale: בוא + אֶל నగరానికి రావడం లేదా చేరడాన్ని సూచిస్తుంది; నగరంలోకి ప్రవేశించారని అవసరానికి మించి నిర్దిష్టం చేయకుండా ‘యెరికోకు వచ్చారు’ మూల భావాన్ని నిలుపుతుంది.
- source_word: וַיִּלָּחֲמוּ בָכֶם
  choice: మీతో యుద్ధం చేశారు
  rationale: לחם తో కూడిన ב ఇక్కడ శత్రుత్వపూర్వక యుద్ధాన్ని సూచిస్తుంది. సందర్భంలో ‘మీతో యుద్ధం చేశారు’ సహజంగా వ్యతిరేకతను తెలియజేస్తుంది.
- source_word: בַּעֲלֵי יְרִיחוֹ
  choice: యెరికో యజమానులు
  rationale: בעלי అనే పదానికి అక్షరార్థంగా ‘యజమానులు/అధిపతులు’ అనే భావం ఉంది. అది నగర పాలకులను, ప్రముఖులను, లేదా నగరానికి చెందిన పురుషులను సూచించవచ్చు; ప్రధాన పాఠంలో మూలంలోని అస్పష్టతకు దగ్గరగా ఉన్న ‘యజమానులు’ ఉంచి వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי
  choice: అమోరీయులు, పెరిజ్జీయులు, కనానీయులు, హిత్తీయులు, గిర్గాషీయులు, హివ్వీయులు, యెబూసీయులు
  rationale: హీబ్రూలో ఏకవచన రూపాల్లో ఉన్నా ఇవి జనసమూహాలను సూచించే సమూహవాచకాలు; తెలుగులో సహజంగా బహువచన ప్రజానామాలుగా ఇవ్వబడ్డాయి.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: నేను వారిని మీ చేతికి అప్పగించాను
  rationale: נתן + ביד శత్రువులను ఒకరి అధికారానికి లోబరచడాన్ని తెలిపే సాధారణ హీబ్రూ నుడికారం. ‘మీ చేతికి అప్పగించాను’ ఆ రూపకాన్ని, దైవ కార్యసాధకత్వాన్ని రెండింటినీ కాపాడుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలు విజయానికి కార్యసాధకుడు
  choice: ‘నేను వారిని మీ చేతికి అప్పగించాను’ అని దేవుని ప్రత్యక్ష కార్యంగా అనువదించడం
  alternative: ‘వారిపై గెలవడానికి నేను మిమ్మల్ని అనుమతించాను’
  rationale: మూలంలోని ప్రథమ పురుష దైవవాక్యం విజయాన్ని దేవుని కార్యానికి నేరుగా ఆపాదిస్తుంది; దాన్ని కేవలం అనుమతిగా బలహీనపరచలేదు.
- issue: בַּעֲלֵי יְרִיחוֹ యొక్క గుర్తింపు
  choice: ప్రధాన పాఠంలో ‘యెరికో యజమానులు’ ఉంచి పాదసూచికలో సాధ్యమైన అర్థాలను తెలపడం
  alternative: ‘యెరికో నాయకులు’ లేదా ‘యెరికో పురుషులు’ అని ఒకే అర్థాన్ని నిర్ణయించడం
  rationale: హీబ్రూ పదబంధం నగర అధిపతులు/ప్రముఖులు లేదా నగరానికి చెందిన పురుషులను సూచించగలదు. ఒక అర్థాన్ని నిశ్చయంగా ఎంచుకోకుండా మూలంలోని నిజమైన అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ప్రజానామాలకు తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపాలు వాడబడ్డాయి. ‘మీ చేతికి అప్పగించాను’ అనే నుడికారం మూలంలోని రూపకాన్ని సహజంగా నిలుపుతుంది.
