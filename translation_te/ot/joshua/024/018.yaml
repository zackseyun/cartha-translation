id: JOS.24.18
reference: Joshua 24:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְגָ֨רֶשׁ יְהוָ֜ה אֶת כָּל הָ/עַמִּ֗ים וְ/אֶת הָ/אֱמֹרִ֛י יֹשֵׁ֥ב הָ/אָ֖רֶץ מִ/פָּנֵ֑י/נוּ גַּם אֲנַ֨חְנוּ֙ נַעֲבֹ֣ד אֶת יְהוָ֔ה כִּי ה֖וּא אֱלֹהֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
translation:
  language: te
  text: యాహ్వే మన ఎదుటనుండి ప్రజలందరినీ, దేశంలో నివసించిన అమోరీయులను కూడా[a], వెళ్లగొట్టాడు. మేము కూడా యాహ్వేను సేవిస్తాం, ఎందుకంటే ఆయనే మా దేవుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలందరినీ మరియు దేశంలో నివసించిన అమోరీయులను.”
    reason: వְאֶת־הָאֱמֹרִיని ముందు చెప్పిన ప్రజలలో ప్రత్యేకంగా చేర్చినట్లుగా చదవవచ్చు; అయితే హీబ్రూ సమన్వయార్థమైన “మరియు అమోరీయులను” అనే పఠనాన్నీ అనుమతిస్తుంది.
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: వెళ్లగొట్టాడు
  rationale: גרש బలవంతంగా బయటకు పంపడం లేదా తొలగించడం అనే భావాన్ని ఇస్తుంది. ‘వెళ్లగొట్టాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: כָּל הָעַמִּים
  choice: ప్రజలందరినీ
  rationale: עַמִּים అనేక జనసమూహాలను సూచించే బహువచనం. ‘ప్రజలందరినీ’ సాధారణ ఆధునిక తెలుగులో ఆ సమూహార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְאֶת הָאֱמֹרִי
  choice: అంటే ... అమోరీయులను కూడా
  rationale: వావ్‌ను ఇక్కడ ముందు చెప్పిన ప్రజలకు అమోరీయులను వివరణగా లేదా ప్రత్యేక చేర్పుగా చూపే విధంగా అనువదించాం. అయితే ‘మరియు అమోరీయులను’ అనే సమన్వయ పఠనం కూడా వ్యాకరణపరంగా సాధ్యమే.
- source_word: יֹשֵׁב הָאָרֶץ
  choice: దేశంలో నివసించిన
  rationale: నివాసాన్ని తెలిపే క్రియావిశేషణ రూపాన్ని అమోరీయులను విశేషించే సహజ తెలుగు ఉపవాక్యంగా ఇచ్చాం.
- source_word: מִפָּנֵינוּ
  choice: మన ఎదుట నుండి
  rationale: హీబ్రూ నుడికారంలోని ‘మన ముఖం ఎదుట నుండి’ అనే దృశ్యభావాన్ని అర్థమయ్యే తెలుగులో నిలిపాం.
- source_word: גַּם אֲנַחְנוּ
  choice: మేము కూడా
  rationale: ఈ మాటలు పలుకుతున్న ప్రజల ప్రతిస్పందనాత్మక నిబద్ధతను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נַעֲבֹד
  choice: సేవిస్తాం
  rationale: עבד దేవునితో వాడినప్పుడు ఆరాధన, విధేయత, నిబంధనాత్మక విశ్వాసం అన్నింటినీ కలిగి ఉంటుంది. ‘సేవిస్తాం’ ఈ విస్తృతిని కాపాడుతుంది.
- source_word: כִּי הוּא אֱלֹהֵינוּ
  choice: ఎందుకంటే ఆయనే మా దేవుడు
  rationale: כִּי కారణాన్ని తెలుపుతుంది. హీబ్రూలో సాధారణ సర్వనామమే ఉన్నప్పటికీ, తెలుగులో దేవునికి గౌరవసూచకంగా ‘ఆయనే’ సహజంగా ఉంటుంది; ‘ఏ’ నిబద్ధతకు కారణమైన గుర్తింపును స్పష్టంగా పలుకుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణను వాడాం.
- issue: నిబంధన సందర్భంలో עבד పరిధి
  choice: సేవిస్తాం
  alternative: ఆరాధిస్తాం
  rationale: ఈ పదం కేవలం ఆరాధనా క్రియలకే పరిమితం కాకుండా విధేయత, విశ్వాసం, సేవలను కూడా కలిగి ఉంది. అందువల్ల విస్తృతమైన ‘సేవిస్తాం’ ఎంచుకున్నాం.
- issue: וְאֶת הָאֱמֹרִי యొక్క సంబంధం
  choice: ముందు చెప్పిన ప్రజల్లో అమోరీయులను ప్రత్యేకంగా చేర్చే పఠనం
  alternative: ‘మరియు అమోరీయులను’ అని వేరొక సమన్విత కర్మగా చదవడం
  rationale: సందర్భంలో అమోరీయులు దేశంలో నివసించిన ప్రజల్లో భాగంగా కనిపిస్తారు; అయినా హీబ్రూ వావ్ సాధారణ ‘మరియు’ భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠంలో సహజమైన వివరణాత్మక పఠనాన్ని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరతను నిలుపుతూ సహజ వాక్యనిర్మాణం వాడబడింది. మూలంలోని రెండు వాక్యభాగాల కారణ సంబంధాన్ని తెలుగులో స్పష్టపరచడానికి ‘కాబట్టి’ చేర్చబడింది.
