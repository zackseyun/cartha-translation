revisions:
- from: యెహోవా మన ఎదుట నుండి ప్రజలందరినీ, అంటే దేశంలో నివసించిన అమోరీయులను కూడా, వెళ్లగొట్టాడు. కాబట్టి మేము కూడా యెహోవాను సేవిస్తాం; ఎందుకంటే ఆయనే మా దేవుడు.
  to: యాహ్వే మన ఎదుటనుండి ప్రజలందరినీ, దేశంలో నివసించిన అమోరీయులను కూడా[a], వెళ్లగొట్టాడు. మేము కూడా యాహ్వేను సేవిస్తాం, ఎందుకంటే ఆయనే మా దేవుడు.
