  yaml_path: translation/ot/joshua/024/028.yaml
  text: Then Joshua sent the people away[a], each man to his inheritance.
translation:
  language: te
  text: అప్పుడు యెహోషువ ప్రజలందరినీ వారి వారి స్వాస్థ్యాలకు పంపివేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి మనిషిని తన స్వాస్థ్యానికి.” హీబ్రూలోని אִישׁ అనే పుంలింగ ఏకవచన పదం ఇక్కడ పంపిణీయ భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: పంపివేశాడు
  rationale: పీయేల్ రూపం సభగా కూడిన ప్రజలను వెళ్లనివ్వడం లేదా పంపివేయడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘పంపివేశాడు’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: עָם ఇక్కడ సమష్టిగా కూడిన ఇశ్రాయేలు ప్రజలను సూచిస్తుంది; ‘ప్రజలు’ సందర్భానికి సహజమైన సమానార్థకం.
- source_word: אִישׁ
  choice: ప్రతి మనిషి
  rationale: אִישׁ ఇక్కడ పంపిణీయ భావంలో ‘ఒక్కొక్క వ్యక్తి’ అని అర్థం; మూలంలోని పుంలింగ ఏకవచన రూపాన్ని ‘ప్రతి మనిషి’ ప్రతిబింబిస్తుంది.
- source_word: לְנַחֲלָתוֹ
  choice: తన స్వాస్థ్యానికి
  rationale: యెహోషువ గ్రంథంలో נַחֲלָה సాధారణంగా వంశపారంపర్యంగా కేటాయించబడిన భూభాగాన్ని సూచిస్తుంది; ‘స్వాస్థ్యం’ ఆ వారసత్వ-భూభాగ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలో ‘వెళ్లాడు’ అనే క్రియ స్పష్టంగా లేకపోయినా, ‘ప్రతి మనిషి తన స్వాస్థ్యానికి’ అనే గమ్యపదబంధాన్ని తెలుగులో సంపూర్ణంగా, సహజంగా తెలియజేయడానికి సందర్భానుగుణంగా చేర్చబడింది.
