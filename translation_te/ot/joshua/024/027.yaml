id: JOS.24.27
reference: Joshua 24:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
translation:
  language: te
  text: 'యెహోషువ ప్రజలందరితో ఇలా అన్నాడు: “చూడండి, ఈ రాయి మనకు వ్యతిరేకంగా సాక్షిగా ఉంటుంది[a]. ఎందుకంటే యాహ్వే మనతో పలికిన మాటలన్నిటినీ ఇది విన్నది[b]. మీరు మీ దేవుణ్ణి నిరాకరించకుండా ఉండేందుకు, ఇది మీకు వ్యతిరేకంగా సాక్షిగా ఉంటుంది[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనకు సాక్షిగా” లేదా “మన విషయమై సాక్షిగా.” హీబ్రూ విభక్తిని తటస్థంగా కూడా అర్థం చేసుకోవచ్చు; అయితే ఒడంబడికకు అవిశ్వాసంగా ఉండవద్దనే ఈ సందర్భంలో రాయి వ్యతిరేక సాక్ష్యంగా నిలుస్తుందనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠం అక్షరార్థంగా “విన్నది” అంటుంది; ఒడంబడిక మాటలకు సాక్షిగా రాయిని వ్యక్తిలా చిత్రిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, “మీ దేవునిపట్ల అబద్ధంగా ప్రవర్తించకుండా,” “మీ దేవునికి అవిశ్వాసంగా ఉండకుండా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: చూడండి
  rationale: శ్రోతల దృష్టిని రాయివైపు మళ్లించే హీబ్రూ ఉద్ఘాటనను ప్రాచీన ధ్వని లేకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָאֶבֶן הַזֹּאת
  choice: ఈ రాయి
  rationale: אֶבֶןకు సాధారణమైన, ఈ ఒడంబడిక-స్మారక సందర్భానికి సరిపోయే తెలుగు పదం ‘రాయి’.
- source_word: תִּהְיֶה ... לְעֵדָה
  choice: సాక్షిగా ఉంటుంది
  rationale: ఒడంబడికకు సంబంధించిన న్యాయసాక్ష్య భావాన్ని, అలాగే היה క్రియతో ఉన్న వాక్య నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בָּנוּ
  choice: మనకు వ్యతిరేకంగా
  rationale: ב అనే విభక్తికి ‘మనకు/మన విషయమై’ అనే తటస్థ భావం సాధ్యమైనా, ఒడంబడికను ఉల్లంఘించవద్దనే హెచ్చరిక సందర్భంలో ప్రతికూల సాక్ష్య భావం ప్రధానంగా కనిపిస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: שָׁמְעָה
  choice: విన్నది
  rationale: రాయి ఒడంబడిక మాటలను విన్నదని మూలపాఠంలో ఉన్న వ్యక్తీకరణను రూపకంగా మార్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: כָּל אִמְרֵי יְהוָה
  choice: యెహోవా ... పలికిన మాటలన్నిటినీ
  rationale: אִמְרֵיకి ‘మాటలు’ సహజమైన తెలుగు సమానం; యెహోవా అనే దైవనామాన్ని పేరుగా నిలుపుతుంది.
- source_word: אֲשֶׁר דִּבֶּר עִמָּנוּ
  choice: మనతో పలికిన
  rationale: עִםలోని ‘తో’ భావాన్ని నిలిపి, ఒడంబడిక సంభాషణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְהָיְתָה בָכֶם לְעֵדָה
  choice: ఇది మీకు వ్యతిరేకంగా సాక్షిగా ఉంటుంది
  rationale: మొదటి ‘సాక్షి’ ప్రకటనను హీబ్రూ పునరుక్తి ప్రకారం మళ్లీ చెబుతూ, హెచ్చరిక సందర్భంలోని ప్రతికూల సాక్ష్య భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: פֶּן
  choice: నిరాకరించకుండా
  rationale: פֶּןలోని నివారణాత్మక హెచ్చరికను తెలుగులో సహజమైన ‘-కుండా’ నిర్మాణంతో తెలియజేస్తుంది.
- source_word: תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם
  choice: మీ దేవుణ్ణి నిరాకరించకుండా
  rationale: כחש ב ఇక్కడ దేవునితో ఉన్న ఒడంబడిక సంబంధాన్ని తిరస్కరించడం లేదా ఆయనపట్ల అబద్ధంగా ప్రవర్తించడం అనే అర్థ పరిధి కలిగి ఉంది; ప్రధాన పాఠంలో స్పష్టమైన ‘నిరాకరించు’ను వాడి, ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: రాయి వినడం మరియు సాక్షిగా ఉండడం అనే వ్యక్తీకరణ
  choice: మూలంలోని వ్యక్తీకరణను అక్షరార్థ రూపంలో నిలుపడం
  alternative: రాయిని కేవలం జ్ఞాపకచిహ్నంగా వివరిస్తూ వ్యక్తీకరణను తొలగించడం
  rationale: హీబ్రూ పాఠం రాయి ‘విన్నది’నీ ‘సాక్షిగా ఉంటుంది’నీ స్పష్టంగా చెబుతుంది. ఈ ఒడంబడిక-విధి వాక్చిత్రాన్ని వివరణాత్మక భావానువాదంతో చదును చేయకుండా నిలుపడం సముచితం.
- issue: בָּנוּ మరియు בָכֶםలోని సాక్ష్య సంబంధం
  choice: ‘మనకు/మీకు వ్యతిరేకంగా’ అనే సందర్భానుగుణ ప్రతికూల భావం
  alternative: ‘మనకు/మీకు సాక్షిగా’ అనే తటస్థ సంబంధ భావం
  rationale: రాయి ఒడంబడిక అవిశ్వాసాన్ని నిరూపించే సాక్షిగా నిలుస్తుందనే హెచ్చరిక ప్రతికూల భావానికి బలం ఇస్తుంది. అయినా హీబ్రూ విభక్తి మరింత తటస్థంగా కూడా అర్థమవగలదని పాదసూచికలో గుర్తించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘చూడండి’ శ్రద్ధను ఆకర్షించే హీబ్రూ ఉద్ఘాటనను అందిస్తుంది; ‘సాక్షిగా ఉంటుంది,’ ‘పలికిన,’ ‘నిరాకరించకుండా’ అనే పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, ఒడంబడిక సందర్భపు గంభీరతను కాపాడుతాయి.
