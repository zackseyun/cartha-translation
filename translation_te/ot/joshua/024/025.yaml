  text: וַ/יִּכְרֹ֨ת יְהוֹשֻׁ֧עַ בְּרִ֛ית לָ/עָ֖ם בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יָּ֥שֶׂם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט בִּ/שְׁכֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/025.yaml
  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
translation:
  language: te
  text: ఆ రోజున యెహోషువ ప్రజలతో నిబంధన చేశాడు[a]; షెకెములో వారికి ఒక శాసనాన్నీ న్యాయవిధినీ నియమించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నిబంధనను కోశాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారికి ఒక శాసనాన్నీ న్యాయనిర్ణయాన్నీ స్థాపించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: నిబంధన చేశాడు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నిబంధనను కోశాడు’ అనే జాతీయ ప్రయోగం ఉంది. ఆధునిక తెలుగులో దాని సహజమైన అర్థసమాన రూపం ‘నిబంధన చేశాడు’.
- source_word: לָעָם
  choice: ప్రజలతో
  rationale: ל అనే విభక్తి రూపం ఉన్నప్పటికీ, כרת ברית అనే నిబంధన-ప్రయోగంలో ప్రజలు భాగస్వాములుగా ఉన్న సంబంధార్థం వ్యక్తమవుతుంది; తెలుగులో ‘ప్రజలతో’ సహజంగా ఉంటుంది.
- source_word: חֹק
  choice: కట్టడం
  rationale: నిర్ణయించి స్థిరపరచిన శాసనాన్ని లేదా నియమాన్ని సూచించే న్యాయపదంగా ‘కట్టడం’ మూలంలోని చట్టపరమైన భావాన్ని నిలుపుతుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయవిధి
  rationale: ఈ న్యాయసందర్భంలో ఇది అమలుచేయవలసిన న్యాయనిర్ణయం లేదా విధిని సూచిస్తుంది; ‘న్యాయవిధి’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తూ חֹק తో ఉన్న పదజోడును కూడా కాపాడుతుంది.
- source_word: וַיָּשֶׂם
  choice: నియమించాడు
  rationale: שׂים యొక్క ప్రాథమిక భావం ‘పెట్టు/ఉంచు’; కట్టడం, న్యాయవిధి వంటి న్యాయపరమైన కర్మలతో ఇక్కడ ‘నియమించాడు’ సహజమైన సందర్భార్థాన్ని ఇస్తుంది.
- source_word: לוֹ
  choice: వారికి
  rationale: హీబ్రూ రూపం ఏకవచనమైనప్పటికీ, అది సమూహవాచకమైన ‘ప్రజలు’ను తిరిగి సూచిస్తుంది; తెలుగులో సందర్భానుసారమైన బహువచనం ‘వారికి’.
- source_word: בִּשְׁכֶם
  choice: అక్కడ షెకెములో
  rationale: స్థలాన్ని స్పష్టంగా ఉంచుతూ, కథనంలోని అదే ప్రదేశంతో చర్యను అనుసంధానించడానికి ‘అక్కడ’ అనే సహజ సందర్భసూచకం ఉపయోగించబడింది.
theological_decisions:
- issue: యెహోషువ చేసిన నిబంధన చర్య స్వరూపం
  choice: యెహోషువ ప్రజలతో నిబంధన చేశాడు
  alternative: యెహోషువ ప్రజల కోసం నిబంధనను కోశాడు; యెహోషువ ప్రజల తరఫున నిబంధనను పునరుద్ధరించాడు
  rationale: ఈ వచనంలో నిబంధన చేసే క్రియకు యెహోషువే కర్తగా ఉన్నాడు; యెహోవాను నిబంధనలోని మరో పక్షంగా ఈ వాక్యం స్పష్టంగా మళ్లీ పేర్కొనదు. అందువల్ల విస్తృత సందర్భం నుంచి అదనపు వేదాంత వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా, మూలపాఠ్యపు ఉపరితల వాక్యనిర్మాణాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నిబంధన’, ‘కట్టడం’, ‘న్యాయవిధి’ వంటి పదాలు వచనంలోని ఒడంబడిక మరియు న్యాయ స్వరాన్ని నిలుపుతాయి; అక్షరార్థ జాతీయ ప్రయోగాన్ని పాదసూచికలో ఇచ్చాం.
