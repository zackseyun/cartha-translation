id: JOS.24.4
reference: Joshua 24:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶתֵּ֣ן לְ/יִצְחָ֔ק אֶֽת יַעֲקֹ֖ב וְ/אֶת עֵשָׂ֑ו וָ/אֶתֵּ֨ן לְ/עֵשָׂ֜ו אֶת הַ֤ר שֵׂעִיר֙ לָ/רֶ֣שֶׁת אוֹת֔/וֹ וְ/יַעֲקֹ֥ב וּ/בָנָ֖י/ו יָרְד֥וּ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
translation:
  language: te
  text: నేను ఇస్సాకుకు యాకోబును, ఏశావును ఇచ్చాను. ఏశావుకు శేయీరు పర్వత ప్రాంతాన్ని[a] స్వాధీనం చేసుకోవడానికి ఇచ్చాను; అయితే యాకోబు, అతని కుమారులు ఐగుప్తుకు దిగివెళ్లారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శేయీరు కొండ’ లేదా ‘శేయీరు పర్వతాలు.’
    reason: הַר అనే పదం ఒక పర్వతాన్నీ, పర్వత ప్రాంతాన్నీ సూచించగలదు.
  - marker: b
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, ‘మరియు యాకోబు, అతని కుమారులు ఐగుప్తుకు దిగివెళ్లారు.’ ప్రధాన పాఠంలోని ‘అయితే’ సందర్భంలోని వ్యత్యాసాన్ని స్పష్టపరుస్తుంది.
    reason: וְ అనే సంధి యొక్క సాధారణ సముచ్చయార్థాన్ని పాదసూచికలో నిలుపుతుంది; ‘దిగివెళ్లారు’ ירד యొక్క దిశాత్మక భావాన్ని ప్రధాన పాఠంలోనే ప్రతిబింబిస్తుంది.
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: ఇచ్చాను
  rationale: נתן ఇక్కడ సంతానాన్ని, భూభాగాన్ని అనుగ్రహించడాన్ని సూచిస్తుంది. పునరావృతమైన దైవిక చర్యను నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: לְיִצְחָק
  choice: ఇస్సాకుకు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపంలో లిప్యంతరీకరించి, לְ యొక్క గ్రహీత భావాన్ని చతుర్థీ విభక్తితో తెలిపింది.
- source_word: אֶת יַעֲקֹב וְאֶת עֵשָׂו
  choice: యాకోబును, ఏశావును
  rationale: אֶת ప్రత్యక్ష కర్మ సూచకానికి తెలుగు కర్మ విభక్తి వాడి, ఇద్దరు కుమారుల పేర్లను సమన్వయంగా ఇచ్చింది.
- source_word: הַר שֵׂעִיר
  choice: శేయీరు పర్వత ప్రాంతం
  rationale: הַר ఒకే శిఖరాన్నే కాక పర్వత భూభాగాన్ని కూడా సూచించగలదు. ఇక్కడ ఏశావుకు ఇవ్వబడిన ప్రాదేశిక స్వాస్థ్యమే సందర్భోచితం.
- source_word: לָרֶשֶׁת אֹתוֹ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: ירש భూమిని స్వాస్థ్యంగా పొందడం లేదా స్వాధీనం చేసుకోవడం అనే భావం ఇస్తుంది. తెలుగు వాక్యంలో కర్మ ముందే స్పష్టంగా ఉన్నందున అదనపు సర్వనామం అవసరం లేదు.
- source_word: וְיַעֲקֹב וּבָנָיו
  choice: అయితే యాకోబు, అతని కుమారులు
  rationale: וְ ప్రాథమికంగా ‘మరియు’ అయినప్పటికీ, ఏశావు భూమిని పొందడం మరియు యాకోబు కుటుంబం ఐగుప్తుకు వెళ్లడం మధ్య సందర్భంలోని వ్యత్యాసాన్ని ‘అయితే’ సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: יָרְדוּ מִצְרָיִם
  choice: ఐగుప్తుకు వెళ్లారు
  rationale: ירד అక్షరార్థంగా ‘దిగివెళ్లడం’. ఆధునిక తెలుగులో గమ్యాన్ని సహజంగా చెప్పేందుకు ‘వెళ్లారు’ ఎంచుకుంది; ‘దిగివెళ్లారు’ అనే మరింత రూపానుగుణ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
theological_decisions:
- issue: చివరి וְ సంధికి వ్యతిరేకార్థాన్ని స్పష్టపరచడం
  choice: ప్రధాన పాఠంలో ‘అయితే’
  alternative: ‘మరియు’
  rationale: హీబ్రూ సంధి స్వతహాగా బలమైన వ్యతిరేకార్థాన్ని నిర్దేశించదు; కానీ ఏశావుకు శేయీరు లభించడం, యాకోబు కుటుంబం ఐగుప్తుకు వెళ్లడం అనే భిన్న పరిణామాలను సందర్భం ఎదురెదురుగా ఉంచుతుంది. అసలు అనిశ్చితిని పాదసూచిక సంరక్షిస్తుంది.
- issue: ירד యొక్క దిశాత్మక భావం
  choice: ‘వెళ్లారు’
  alternative: ‘దిగివెళ్లారు’
  rationale: ఐగుప్తుకు వెళ్లడాన్ని హీబ్రూ సంప్రదాయంగా ‘దిగడం’గా చెబుతుంది. సాధారణ ఆధునిక తెలుగు కోసం ప్రధాన పాఠంలో సహజ రూపాన్ని వాడి, మూలంలోని దిశాత్మక రూపాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. పేర్లకు ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపాలు వాడబడ్డాయి. మూలంలోని పునరుక్త ‘ఇచ్చాను’ నిలుపబడింది; నిజమైన లెక్సికల్ మరియు సంధి అనిశ్చితులు పాదసూచికల్లో భద్రపరచబడ్డాయి.
