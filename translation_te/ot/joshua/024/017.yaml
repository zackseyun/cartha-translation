id: JOS.24.17
reference: Joshua 24:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of servants, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
translation:
  language: te
  text: ఎందుకంటే మన దేవుడైన యాహ్వే మనలను, మన పితరులను ఐగుప్తు దేశం నుండి, బానిసల గృహం నుండి[a] బయటకు తీసుకొచ్చినవాడు; మన కళ్ల ఎదుట ఈ గొప్ప సూచకాలను[b] చేసినవాడు; మేము నడిచిన మార్గమంతటిలోను, మేము దాటివచ్చిన ప్రజలందరి మధ్యను మనలను కాపాడినవాడు ఆయనే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బానిసత్వ గృహం నుండి.” హెబ్రీ పదబంధం అక్షరార్థంగా “బానిసల గృహం నుండి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈ గొప్ప అద్భుతాలను” లేదా “ఈ గొప్ప మహత్కార్యాలను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి వచనంలో ప్రజలు చేసిన నిర్ణయానికి కారణాన్ని ఈ పదం పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీలోని దేవుని ప్రత్యేక నామాన్ని బిరుదుగా మార్చకుండా తెలుగు లిప్యంతరీకరణలో నిలుపుతుంది.
- source_word: הוּא הַמַּעֲלֶה
  choice: బయటకు తీసుకొచ్చినవాడు ... ఆయనే
  rationale: స్వతంత్ర సర్వనామంలోని నొక్కిచెప్పే భావాన్ని ‘ఆయనే’ నిలుపుతుంది; నిర్గమ సందర్భంలో ‘బయటకు తీసుకొచ్చినవాడు’ సహజమైన తెలుగు, హెబ్రీ క్రియ సూచించే తరలింపును స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲבוֹתֵינוּ
  choice: మన పితరులను
  rationale: ఇశ్రాయేలు ఒడంబడిక చరిత్రకు సంబంధించిన పూర్వతరాల భావాన్ని గంభీరమైన, పరిచితమైన తెలుగులో నిలుపుతుంది.
- source_word: מִבֵּית עֲבָדִים
  choice: బానిసల గృహం నుండి
  rationale: అక్షరార్థమైన బహువచన నామవాచకం ‘బానిసలు’ను నిలుపుతూ, వారి బంధిత స్థితిని అమూర్తీకరించకుండా వ్యక్తపరుస్తుంది.
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  choice: ఈ గొప్ప సూచకకార్యాలను
  rationale: אוֹת లోని ‘సూచన’ భావాన్ని కాపాడుతూ, సందర్భంలో అవి దేవుడు చేసిన కార్యాలని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁמְרֵנוּ
  choice: ఆయన మనలను కాపాడాడు
  rationale: ప్రయాణమంతటిలో దేవుడు రక్షిస్తూ భద్రపరచిన భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַכְנוּ בָהּ
  choice: మేము నడిచిన మార్గమంతటిలోను
  rationale: హెబ్రీలోని ‘మార్గమంతటిలో’ అనే పరిధిని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; ‘యాహ్వే’ దానిని బిరుదుతో భర్తీ చేయకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరిస్తుంది.
- issue: עֲבָדִים అనే పదంలోని బంధిత స్థితి
  choice: బానిసలు
  alternative: దాసులు / బానిసత్వం
  rationale: మూలంలోని బహువచన వ్యక్తివాచక రూపాన్ని నిలుపుతూ, బలవంతపు బంధిత స్థితిని మృదువుపరచదు; అమూర్తమైన ‘బానిసత్వం’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. పొడవైన హెబ్రీ వాక్యాన్ని మూడు తెలుగు వాక్యాలుగా విభజించి ప్రవాహాన్ని మెరుగుపరిచాం; ‘ఆయనే’ ద్వారా మూలంలోని ఉద్ఘాటన నిలిచింది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠంలో తగిన పదాల వెంట ఉంచబడ్డాయి.
