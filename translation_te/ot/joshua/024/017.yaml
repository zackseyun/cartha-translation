  to: ఎందుకంటే మన దేవుడైన యాహ్వే మనలను, మన పితరులను ఐగుప్తు దేశం నుండి, బానిసల గృహం నుండి[a] బయటకు తీసుకొచ్చినవాడు; మన కళ్ల ఎదుట ఈ గొప్ప సూచకాలను[b] చేసినవాడు; మేము నడిచిన మార్గమంతటిలోను, మేము దాటివచ్చిన ప్రజలందరి మధ్యను మనలను కాపాడినవాడు ఆయనే.
  rationale: మూలపాఠంలోని ఒకే ప్రధాన వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా పునర్నిర్మించాం. אוֹתוֹתను అదనపు వ్యాఖ్యానంలేకుండా ‘సూచకాలు’గా అనువదించాం. దైవనామం, బానిసలనే వ్యక్తివాచక బహువచనం, మరియు రెండు పాదసూచికల అర్థం/ఆంకర్లు నిలిపివేశాం.
