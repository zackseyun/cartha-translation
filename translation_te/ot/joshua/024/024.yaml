source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ אֶת יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ נַעֲבֹ֔ד וּ/בְ/קוֹל֖/וֹ נִשְׁמָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
translation:
  language: te
  text: అప్పుడు ప్రజలు యెహోషువతో, “మన దేవుడైన యాహ్వేను సేవిస్తాం; ఆయన మాట వింటాం[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “ఆయన స్వరాన్ని వింటాం.” ఇక్కడ “మాట వినడం” అంటే ఆయన చెప్పేదానికి విధేయత చూపడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָעָם אֶל יְהוֹשֻׁעַ
  choice: అప్పుడు ప్రజలు యెహోషువతో ... అన్నారు
  rationale: וַיֹּאמְרוּ అనే కథన క్రమరూపాన్ని సహజమైన తెలుగు కథనశైలిలో ‘అప్పుడు ... అన్నారు’గా, אֶל‌ను సంభాషణను సూచించే ‘తో’గా అందించాం.
- source_word: אֶת יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యాహ్వేను
  rationale: ఒడంబడిక నామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించి, אֱלֹהֵינוּలోని ప్రథమ పురుష బహువచన సంబంధాన్ని ‘మన దేవుడు’గా సహజంగా వ్యక్తం చేశాం.
- source_word: נַעֲבֹד
  choice: సేవిస్తాం
  rationale: עבד ఇక్కడ ఆరాధనతో కూడిన సేవ, విధేయత, ఒడంబడిక విశ్వాస్యత అన్న విస్తృత భావాన్ని కలిగి ఉంది; ‘ఆరాధిస్తాం’ కంటే ‘సేవిస్తాం’ ఆ పరిధిని మెరుగ్గా నిలుపుతుంది.
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  choice: ఆయన మాట వింటాం
  rationale: పదశః ‘ఆయన స్వరాన్ని వింటాం’; שמע + בְּקוֹל అనే హీబ్రూ ప్రయోగం శ్రద్ధగా విని విధేయత చూపడాన్ని సూచిస్తుంది. తెలుగులో ‘మాట వింటాం’ అదే ద్వంద్వభావాన్ని సహజంగా మోస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత ఒడంబడిక నామం ప్రత్యక్షంగా ఉన్నందున దాన్ని సాధారణ బిరుదుగా మార్చకుండా ‘యాహ్వే’గా నిలిపాం.
- issue: עבד యొక్క మతపరమైన భావపరిధి
  choice: సేవిస్తాం
  alternative: ఆరాధిస్తాం
  rationale: ఇక్కడ ప్రజలు కేవలం ఆరాధనా క్రియను కాకుండా సంపూర్ణ ఒడంబడిక విధేయతను ప్రకటిస్తున్నారు; అందువల్ల విస్తృతమైన ‘సేవిస్తాం’ను ఎంచుకున్నాం.
- issue: שמע בקול అనే ప్రయోగం
  choice: ఆయన మాట వింటాం
  alternative: ఆయనకు విధేయులమవుతాం
  rationale: ప్రయోగం ఉద్దేశించే విధేయతను తెలుగులో సహజంగా తెలియజేస్తూనే, ‘వినడం’ అనే మూలరూప చిత్రాన్ని కూడా ‘మాట వింటాం’ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సహజంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ప్రత్యక్ష ప్రసంగంలో ‘సేవిస్తాం,’ ‘వింటాం’ అనే సహజ బహువచన రూపాలు ఉపయోగించబడ్డాయి; హీబ్రూ ప్రయోగంలోని వినికిడి–విధేయత ఉద్వేగం పాదటిప్పణితో నిలుపబడింది.
