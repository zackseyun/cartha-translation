  to: 'ఇశ్రాయేలు కుమారులు ఐగుప్తు నుండి తీసుకొచ్చిన యోసేపు ఎముకలను, యాకోబు షెకెము తండ్రియైన[b] హమోరు కుమారుల నుండి నూరు కెశీటాలకు[c] కొనుగోలు చేసిన పొలంలోని భాగంలో[a], షెకెములో పాతిపెట్టారు. ఆ స్థలం యోసేపు కుమారులకు స్వాస్థ్యమైంది.[d]


