source:
  edition: WLC
  text: וְ/אֶת עַצְמ֣וֹת י֠וֹסֵף אֲשֶׁר הֶעֱל֨וּ בְנֵי יִשְׂרָאֵ֥ל מִ/מִּצְרַיִם֮ קָבְר֣וּ בִ/שְׁכֶם֒ בְּ/חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֨ר קָנָ֧ה יַעֲקֹ֛ב מֵ/אֵ֛ת בְּנֵֽי חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם בְּ/מֵאָ֣ה קְשִׂיטָ֑ה וַ/יִּֽהְי֥וּ לִ/בְנֵֽי יוֹסֵ֖ף לְ/נַחֲלָֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
translation:
  language: te
  text: 'ఇశ్రాయేలు కుమారులు ఐగుప్తు నుండి తీసుకొచ్చిన యోసేపు ఎముకలను, యాకోబు షెకెము తండ్రియైన[b] హమోరు కుమారుల నుండి నూరు కెశీటాలకు[c] కొనుగోలు చేసిన పొలంలోని భాగంలో[a], షెకెములో పాతిపెట్టారు. ఆ స్థలం యోసేపు కుమారులకు స్వాస్థ్యమైంది.[d]


    [a] “పొలంలోని భాగం” అనే హీబ్రూ పదబంధం ఒక భూభాగాన్ని లేదా పొలం ముక్కను సూచిస్తుంది.


    [b] “షెకెము తండ్రి” అనే మాటను విస్తృత అర్థంలో “షెకెము వంశపిత” లేదా “షెకెము స్థాపకుడు” అని కూడా అర్థం చేసుకోవచ్చు.


    [c] “కెశీటా” అనేది ప్రాచీన కాలంలోని విలువ లేదా ధన ప్రమాణం; దాని ఖచ్చితమైన ఆధునిక సమానం తెలియదు.


    [d] చివరి వాక్యంలోని హీబ్రూ క్రియ బహువచనంలో ఉంది; అక్షరార్థంగా “అవి ... స్వాస్థ్యమయ్యాయి” అని ఉంటుంది. అది యోసేపు ఎముకలను సూచించవచ్చు; అయితే సందర్భాన్ని బట్టి కొనుగోలు చేసిన స్థలాన్ని సూచించేలా ప్రధాన పాఠంలో అనువదించబడింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పొలంలోని భాగం” అనే హీబ్రూ పదబంధం ఒక భూభాగాన్ని లేదా పొలం ముక్కను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “షెకెము తండ్రి” అనే మాటను విస్తృత అర్థంలో “షెకెము వంశపిత” లేదా “షెకెము స్థాపకుడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “కెశీటా” అనేది ప్రాచీన కాలంలోని విలువ లేదా ధన ప్రమాణం; దాని ఖచ్చితమైన ఆధునిక సమానం తెలియదు.
    reason: cultural_note
  - marker: d
    text: చివరి వాక్యంలోని హీబ్రూ క్రియ బహువచనంలో ఉంది; అక్షరార్థంగా “అవి ... స్వాస్థ్యమయ్యాయి” అని ఉంటుంది. అది యోసేపు ఎముకలను సూచించవచ్చు; అయితే సందర్భాన్ని బట్టి కొనుగోలు చేసిన స్థలాన్ని సూచించేలా ప్రధాన పాఠంలో అనువదించబడింది.
    reason: source_ambiguity
lexical_decisions:
- source_word: עַצְמוֹת
  choice: ఎముకలు
  rationale: హీబ్రూ పదానికి ఇదే ప్రత్యక్షమైన అర్థం; యోసేపు సమాధి సంప్రదాయంలోని స్పష్టమైన శరీర సంబంధ పదాన్ని నిలుపుతుంది.
- source_word: הֶעֱלוּ
  choice: తీసుకొచ్చిన
  rationale: హిఫీల్ రూపం ‘పైకి తీసుకురావడం’ అని అర్థం. తెలుగులో ప్రయాణ దిశను అనవసరంగా కఠినపరచకుండా, ముందే జరిగిన చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబ/నిబంధన సంబంధ వ్యక్తీకరణను చదవదగిన రీతిలో నేరుగా నిలుపుతుంది.
- source_word: בִשְׁכֶם
  choice: షెకెములో
  rationale: సమాధి జరిగిన ప్రదేశాన్ని సహజమైన తెలుగు స్థానవిభక్తితో తెలియజేస్తుంది.
- source_word: בְּחֶלְקַת הַשָּׂדֶה
  choice: పొలంలోని భాగం
  rationale: חלקה సూచించే భూభాగం లేదా పొలం ముక్క అనే భావాన్ని సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ సూక్ష్మతను పాదటిప్పణిలో ఉంచింది.
- source_word: קָנָה
  choice: కొనిన
  rationale: ఈ సందర్భంలో సాధారణ ‘సంపాదించు’ కన్నా ధర చెల్లించి కొనుగోలు చేయడమే స్పష్టంగా ఉద్దేశించబడింది.
- source_word: בְּנֵי חֲמוֹר
  choice: హమోరు కుమారులు
  rationale: మూలంలోని ‘కుమారులు’ అనే బంధుత్వ పదాన్ని వ్యాఖ్యానాత్మకమైన ‘వంశస్థులు’గా మార్చకుండా నిలుపుతుంది.
- source_word: אֲבִי שְׁכֶם
  choice: షెకెము తండ్రి
  rationale: నేర అర్థాన్ని ప్రధాన పాఠంలో ఉంచి, ‘వంశపిత/స్థాపకుడు’ అనే విస్తృత సాధ్యతను పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: నూరు కెశీటాలకు
  rationale: ఖచ్చిత విలువ తెలియని ప్రాచీన ధన/విలువ ప్రమాణానికి తప్పుడు ఆధునిక సమానాన్ని ఇవ్వకుండా లిప్యంతరీకరించింది.
- source_word: לְנַחֲלָה
  choice: స్వాస్థ్యం
  rationale: వంశపారంపర్యంగా కలిగే ఆస్తి లేదా వారసత్వ భాగం అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל అనే నిబంధనాత్మక బంధుత్వ పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: జాతి గుర్తింపుతో పాటు మూలంలోని కుటుంబ సంబంధ రూపకాన్ని కూడా నిలుపుతుంది; ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్ని జోడించదు.
- issue: וַיִּהְיוּ అనే బహువచన క్రియకు ఉన్న సూచన
  choice: ప్రధాన పాఠంలో ఆ స్థలాన్ని ఏకవచనంగా సూచించి, వ్యాకరణ ఉద్రిక్తతను పాదటిప్పణిలో పేర్కొనడం
  alternative: “అవి యోసేపు కుమారులకు స్వాస్థ్యమయ్యాయి” అని ఎముకలను సూచించేలా అనువదించడం
  rationale: హీబ్రూ బహువచనం ఎముకలను సూచించగలదు; కానీ కొనబడిన పొలం స్వాస్థ్యమవడం సందర్భానికి సహజం. మూలంలోని నిజమైన అస్పష్టతను దాచకుండా పాదటిప్పణిలో రెండు సాధ్యతలను ఉంచింది.
- issue: קְשִׂיטָה అనే తెలియని ప్రాచీన విలువ ప్రమాణం
  choice: కెశీటా
  alternative: నాణెం / వెండి ముక్క
  rationale: తెలియని ఖచ్చిత విలువపై అతిశయమైన నిర్ధారణ చేయకుండా మూల పదాన్ని నిలిపి, సాంస్కృతిక వివరణను పాదటిప్పణిలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వచనం. ‘కెశీటా’ వంటి సాంస్కృతికంగా నిర్దిష్టమైన పదాన్ని లిప్యంతరీకరించి వివరించింది. వాక్య నిర్మాణాన్ని తెలుగు సహజ ప్రవాహానికి అనుగుణంగా రెండు ప్రధాన వాక్యాలుగా విభజించినప్పటికీ, సంఘటనల క్రమం మరియు మూల సమాచారం అన్నీ నిలుపబడ్డాయి.
