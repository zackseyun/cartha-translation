id: JOS.24.9
reference: Joshua 24:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨קָם בָּלָ֤ק בֶּן צִפּוֹר֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵ֑ל וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א לְ/בִלְעָ֥ם בֶּן בְּע֖וֹר לְ/קַלֵּ֥ל אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/009.yaml
  text: Then Balak son of Zippor[a], king of Moab, arose and fought against Israel[b]. He sent and called Balaam son of Beor to curse you.
translation:
  language: te
  text: అప్పుడు మోయాబు రాజైన సిప్పోరు కుమారుడు బాలాకు లేచి[a] ఇశ్రాయేలుకు విరోధంగా యుద్ధం చేశాడు[b]. మిమ్మల్ని శపించడానికి బెయోరు కుమారుడు బిలామును పంపి పిలిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేచాడు.’ హీబ్రూ క్రియ నిర్ణయాత్మక చర్య ప్రారంభాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇశ్రాయేలుతో యుద్ధం చేశాడు’ లేదా ‘ఇశ్రాయేలుపై యుద్ధానికి వెళ్లాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ కథనంలో నిర్ణయాత్మక చర్యకు పూనుకోవడాన్ని సూచించగలదు. ‘లేచి’ మూలంలోని రూపకాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో యుద్ధం చేశాడు
  rationale: לחם + ב ఇక్కడ శత్రుత్వపూర్వక యుద్ధాన్ని సూచిస్తుంది. ఈ అనువాదం నేరుగా ఉన్న మూలార్థాన్ని నిలుపుతుంది.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: పిలిపించేందుకు మనుషులను పంపాడు
  rationale: హీబ్రూలోని ‘పంపాడు, పిలిచాడు’ అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఎవరో దూతలను పంపాడనే అంతర్లీన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: לְבִלְעָם בֶּן בְּעוֹר
  choice: బెయోరు కుమారుడు బిలాము
  rationale: వ్యక్తుల పేర్లు సాధారణ తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
- source_word: לְקַלֵּל אֶתְכֶם
  choice: మిమ్మల్ని శపించడానికి
  rationale: קלל ఇక్కడ శాపం పలకడం లేదా శాపాన్ని ఆహ్వానించడం అనే నేరమైన భావాన్ని కలిగి ఉంది; ‘శపించడానికి’ సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: సంఖ్యాకాండములో బాలాకు బిలాము ద్వారా ఇశ్రాయేలును శపింపజేయడానికి చేసిన ప్రయత్నం ప్రధానంగా కనిపిస్తుండగా, ఇక్కడ అతడు ‘ఇశ్రాయేలుతో యుద్ధం చేశాడు’ అని చెప్పడం
  choice: ‘ఇశ్రాయేలుతో యుద్ధం చేశాడు’ అనే స్పష్టమైన అర్థాన్ని యథాతథంగా ఉంచడం
  alternative: ‘ఇశ్రాయేలుకు విరోధంగా ప్రవర్తించాడు’ లేదా ‘యుద్ధానికి సిద్ధపడ్డాడు’ అని సడలించి అనువదించడం
  rationale: వచనంలోని וַיִּלָּחֶם בְּיִשְׂרָאֵל నేరుగా యుద్ధాన్ని తెలియజేస్తుంది. మరొక వృత్తాంతంతో సమన్వయం చేయడానికి ఈ పదబంధాన్ని మార్చడం అనువాదం పరిధిని మించుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యార్థాన్ని నిలుపుతూ, ‘పంపి పిలిచాడు’ అనే అసహజ పదక్షర నిర్మాణానికి బదులుగా సహజమైన ‘పిలిపించేందుకు మనుషులను పంపాడు’ వాడబడింది.
