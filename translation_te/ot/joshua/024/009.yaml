revisions:
- from: అప్పుడు మోయాబు రాజైన సిప్పోరు కుమారుడు బాలాకు లేచి[a] ఇశ్రాయేలుతో యుద్ధం చేశాడు[b]. మిమ్మల్ని శపించడానికి బెయోరు కుమారుడు బిలామును పిలిపించేందుకు మనుషులను పంపాడు.
  to: అప్పుడు మోయాబు రాజైన సిప్పోరు కుమారుడు బాలాకు లేచి[a] ఇశ్రాయేలుకు విరోధంగా యుద్ధం చేశాడు[b]. మిమ్మల్ని శపించడానికి బెయోరు కుమారుడు బిలామును పంపి పిలిపించాడు.
