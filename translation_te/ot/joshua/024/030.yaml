base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: te
  text: వారు అతణ్ణి అతని స్వాస్థ్యపు ప్రాంతంలో[a], ఎఫ్రాయిము కొండప్రాంతంలో గాయషు కొండకు ఉత్తరాన ఉన్న తిమ్నత్-సెరహ్‌లో పాతిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని స్వాస్థ్యపు సరిహద్దులో.’ హీబ్రూ పదం సరిహద్దును గానీ, ఆ సరిహద్దులోని ప్రాంతాన్ని గానీ సూచించవచ్చు; ఇక్కడ యెహోషువాకు కేటాయించబడిన స్వాస్థ్య ప్రాంతమే ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: వారు అతణ్ణి పాతిపెట్టారు
  rationale: קבר క్రియ యొక్క కథన క్రమాన్ని సహజమైన తెలుగులో తెలిపి, אֹתוֹలోని పురుష ఏకవచన కర్మను ‘అతణ్ణి’గా స్పష్టంగా అందిస్తుంది.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: అతని స్వాస్థ్య ప్రాంతంలో
  rationale: גְּבוּלకు ‘సరిహద్దు’ లేదా దానితో ఆవరించబడిన ‘ప్రాంతం’ అనే రెండు భావాలు ఉన్నాయి. సమాధి స్థలాన్ని సూచించే ఈ సందర్భంలో, యెహోషువాకు కేటాయించబడిన స్వాస్థ్య భూభాగం అనే భావం సహజంగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: בְּתִמְנַת סֶרַח
  choice: తిమ్నత్-సెరహులో
  rationale: స్థలనామాన్ని మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, స్థలాన్ని సూచించడానికి తెలుగు విభక్తిని జోడించాం.
- source_word: בְּהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలో
  rationale: ఈ నిర్మాణంలో הַר ఒకే కొండను కాక కొండలతో కూడిన భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: గాయషు కొండకు ఉత్తరాన
  rationale: సాపేక్ష భౌగోళిక స్థానాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, הַר גָּעַשׁను భౌగోళిక గుర్తుగా అనువదిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. భౌగోళిక వాక్యక్రమాన్ని తెలుగులో సులభంగా గ్రహించగల విధంగా అమర్చినా, మూలంలోని అన్ని స్థలసంబంధ వివరాలను నిలిపాం.
