  text: וַ/יְהִ֗י אַֽחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
translation:
  language: te
  text: ఈ సంగతులు[a] జరిగిన తరువాత, యాహ్వే సేవకుడైన[b] నూను కుమారుడు యెహోషువ నూట పది సంవత్సరాల వయసులో మరణించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంఘటనల తరువాత.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “యాహ్వే సేవకుడు”; «దాసుడు» అనేది పదార్థపరంగా సాధ్యమైనా, ఇక్కడ ఇది బానిసస్థితికన్నా గౌరవప్రదమైన సేవను సూచించే బిరుదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులు జరిగిన తరువాత
  rationale: హీబ్రూ కథన సంధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, דְּבָרִים పదంలోని ‘సంగతులు/విషయాలు’ భావాన్ని నిలుపుతుంది.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడు యెహోషువ
  rationale: వ్యక్తి పేరు, తండ్రి పేరును ప్రామాణిక తెలుగు బైబిలు రూపాలకు అనుగుణంగా లిప్యంతరీకరించి, సహజ తెలుగు పదక్రమంలో ఇచ్చింది.
- source_word: עֶבֶד יְהוָה
  choice: యెహోవా సేవకుడు
  rationale: עֶבֶד పదానికి ‘దాసుడు’ అనే అర్థం సాధ్యమైనా, ఇక్కడ ఇది గౌరవప్రదమైన దైవసేవా బిరుదు; ‘సేవకుడు’ ఆ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות అనే క్రియ యొక్క సూటి అర్థాన్ని మృదూకరించకుండా, సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: నూట పది సంవత్సరాల వయసులో
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారాన్ని సహజమైన తెలుగులో ఖచ్చితంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన దైవనామ రూపం ‘యెహోవా’; దీనిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా మూలంలోని వ్యక్తిగత నామాన్ని నిలిపింది.
- issue: עֶבֶד అనే బిరుదు యొక్క భావం
  choice: సేవకుడు
  alternative: దాసుడు
  rationale: ఈ సందర్భంలో యెహోషువకు ఇచ్చిన గౌరవ బిరుదు, బానిస స్థితిపై కాక యెహోవాకు అతని నమ్మకమైన సేవపై దృష్టి పెడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కాలక్రమం, వంశపరిచయం, గౌరవ బిరుదు, మరణం, వయస్సు అన్నీ స్పష్టంగా నిలుపబడ్డాయి.
