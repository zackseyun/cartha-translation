id: JOS.24.23
reference: Joshua 24:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הָסִ֛ירוּ אֶת אֱלֹהֵ֥י הַ/נֵּכָ֖ר אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֑ם וְ/הַטּוּ֙ אֶת לְבַבְ/כֶ֔ם אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/023.yaml
  text: So now[a], remove the foreign gods that are among you, and turn your heart to Yahweh[b], the God of Israel.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు, మీ మధ్య ఉన్న అన్యదేవుళ్లను తొలగించండి, ఇశ్రాయేలు దేవుడైన యాహ్వే వైపు మీ హృదయాన్ని తిప్పండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: וְ అనే అనుసంధానాన్ని, עַתָּה సూచించే తక్షణ పిలుపును కలిపి సహజమైన తెలుగు సంధిగా అందిస్తుంది.
- source_word: הָסִירוּ
  choice: తొలగించి
  rationale: హిఫీల్ బహువచన ఆజ్ఞారూపంలోని ‘తీసివేయండి/దూరం చేయండి’ అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; తరువాతి ఆజ్ఞతో సహజంగా అనుసంధానమవుతుంది.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: అన్యదేవుళ్లను
  rationale: ఇది కేవలం విచిత్రమైన దేవుళ్లను కాక, ఇశ్రాయేలు దేవునికి భిన్నమైన ఇతర జనాల దేవుళ్లను సూచిస్తుంది; ‘అన్యదేవుళ్లు’ తెలుగు బైబిలు సందర్భంలో సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: మీ మధ్య ఉన్న
  rationale: בְּקִרְבְּכֶם ఇక్కడ ప్రజల మధ్య ఉన్నదనే సామూహిక భావాన్ని ఇస్తుంది; ‘మీలోపల’ అని అనువదిస్తే అంతరంగిక భావంగా అపార్థం కావచ్చు.
- source_word: וְהַטּוּ
  choice: వైపు తిప్పండి
  rationale: נטה యొక్క ‘వంచు/మళ్లించు/తిప్పు’ రూపకాన్ని, אֶל తెలిపే దిశతో కలిసి సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְבַבְכֶם
  choice: మీ హృదయాన్ని
  rationale: హీబ్రూలో బహువచన సంబోధనతో కూడిన ఏకవచన సమూహవాచక ‘హృదయం’ ఉంది; ప్రజల ఏకీకృత అంతరంగ నిబద్ధతను సూచించే ఆ రూపాన్ని కాపాడుతుంది.
- source_word: אֶל יְהוָה
  choice: యెహోవా వైపు
  rationale: אֶל దిశను సూచిస్తుంది; יְהוָה అనే దైవనామాన్ని సాధారణ తెలుగు రూపమైన ‘యెహోవా’గా ప్రత్యక్షంగా అందిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: యెహోవాను ఇశ్రాయేలు దేవునిగా గుర్తించే నిర్మాణాన్ని తెలుగులో సహజంగా ముందుంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా పేరుగా నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: ‘మీ హృదయం’ అనే ఏకవచన సమూహరూపం
  choice: మీ హృదయాన్ని
  alternative: మీ హృదయాలను
  rationale: హీబ్రూ לְבַבְכֶם వ్యాకరణపరంగా ఏకవచన నామవాచకానికి బహువచన స్వామ్యప్రత్యయం కలిగిన రూపం. ఇశ్రాయేలు ప్రజల సమిష్టి నిబద్ధత అనే ఉద్వేగాన్ని పరిష్కరించకుండా అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆజ్ఞాత్మక శైలి. మూలంలోని రెండు బహువచన ఆజ్ఞలను తెలుగులో అనుసంధాన క్రియతో సహజంగా వ్యక్తపరచి, సమిష్టి ‘హృదయం’ అనే మూలరూపాన్ని నిలిపాం.
