  text: וְ/עַתָּ֞ה יְר֧אוּ אֶת יְהוָ֛ה וְ/עִבְד֥וּ אֹת֖/וֹ בְּ/תָמִ֣ים וּ/בֶֽ/אֱמֶ֑ת וְ/הָסִ֣ירוּ אֶת אֱלֹהִ֗ים אֲשֶׁר֩ עָבְד֨וּ אֲבוֹתֵי/כֶ֜ם בְּ/עֵ֤בֶר הַ/נָּהָר֙ וּ/בְ/מִצְרַ֔יִם וְ/עִבְד֖וּ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
translation:
  language: te
  text: “ఇప్పుడు యాహ్వేకు భయపడి, పూర్ణతతోను సత్యనిష్ఠతోను ఆయనను సేవించండి. నదికి అవతల, ఐగుప్తులో మీ పితరులు సేవించిన దేవుళ్లను తొలగించివేయండి; యాహ్వేను సేవించండి.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందటి చారిత్రక వివరణనుంచి యెహోషువ చేస్తున్న ముగింపు ప్రబోధానికి సహజమైన తెలుగు సంధానంగా ఉంది; హీబ్రూ వావ్‌ను సందర్భానుసారంగా ‘కాబట్టి’ అని వ్యక్తం చేస్తుంది.
- source_word: יְרָאוּ אֶת־יְהוָה
  choice: యాహ్వేకు భయపడి
  rationale: దేవునిపట్ల ఒడంబడిక సంబంధమైన భయభక్తిని సూచిస్తుంది. ‘భక్తితో గౌరవించి’ అని మృదువుగా మార్చకుండా, మూలంలోని ‘భయపడు’ భావబలాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וְעִבְדוּ אֹתוֹ
  choice: ఆయనను సేవించండి
  rationale: עבד అనే పదంలో ఆరాధనతోపాటు విధేయత, సేవ, నిబద్ధత అనే విస్తృత భావం ఉంది; ‘సేవించండి’ దానిని నిలుపుతుంది.
- source_word: בְּתָמִים וּבֶאֱמֶת
  choice: సంపూర్ణ హృదయంతో, నమ్మకంగా
  rationale: תמים లోని సంపూర్ణత/అవిభక్త నిబద్ధతను, אמת లోని సత్యనిష్ఠ/విశ్వసనీయతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; పాపరహిత పరిపూర్ణతను సూచించదు.
- source_word: וְהָסִירוּ
  choice: తొలగించివేసి
  rationale: ప్రత్యర్థి దేవుళ్లను కేవలం పక్కన పెట్టడం కాక పూర్తిగా విడిచిపెట్టాలనే ఆజ్ఞ బలాన్ని తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుళ్లను
  rationale: మూలంలో ‘అన్య’ అనే విశేషణం లేదు; అందువల్ల దానిని చేర్చకుండా బహువచనాన్ని యథాతథంగా ఉంచింది.
- source_word: אֲבוֹתֵיכֶם
  choice: మీ పితరులు
  rationale: మూలంలోని పురుష బహువచన కుటుంబపదాన్ని నిలుపుతూ, పూర్వీకులైన తండ్రులను సూచిస్తుంది.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: నదికి అవతల
  rationale: హీబ్రూ భౌగోళిక ప్రయోగాన్ని ప్రధాన వాక్యంలో సాధ్యమైనంత నేరుగా ఉంచింది; అది యూఫ్రటీసు నది అని పాదసూచికలో వివరిస్తుంది.
- source_word: וּבְמִצְרַיִם
  choice: ఐగుప్తులో
  rationale: ప్రదేశ సూచనకు సూటి, బైబిలు పాఠకులకు సుపరిచితమైన తెలుగు రూపం.
- source_word: וְעִבְדוּ אֶת־יְהוָה
  choice: యాహ్వేను సేవించండి
  rationale: వచనంలోని పునరుక్త ఆజ్ఞను, దాని వాక్చాతుర్య బలాన్ని నిలుపుతుంది; మూలంలో స్పష్టమైన విరోధార్థక సంధి లేకపోవడంతో ‘కాని’ చేర్చలేదు.
theological_decisions:
- issue: యְהוָה అనే ఒడంబడిక నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న దేవుని వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు రూపంలో ఉంచింది.
- issue: దేవునికి భయపడడం అనే భావం
  choice: యాహ్వేకు భయపడి
  alternative: యాహ్వేను భక్తితో గౌరవించి
  rationale: సందర్భంలో భక్తిపూర్వక విధేయత ఉన్నప్పటికీ, హీబ్రూ క్రియలోని ‘భయం’ అనే నిజమైన ధార్మిక ఉద్వేగాన్ని మృదువుగా పరిష్కరించలేదు.
- issue: אֲבוֹתֵיכֶם యొక్క లింగ-నిర్దిష్ట రూపం
  choice: మీ పితరులు
  alternative: మీ పూర్వీకులు
  rationale: మూలంలోని ‘తండ్రులు/పితరులు’ అనే పురుష కుటుంబపదాన్ని నిలుపుతుంది; సాధారణీకరించి లింగనిరపేక్ష పదంగా మార్చదు.
- issue: తמים మరియు אמת జంట యొక్క భావవ్యాప్తి
  choice: సంపూర్ణ హృదయంతో, నమ్మకంగా
  alternative: యథార్థతతో, సత్యంతో
  rationale: మొదటి పదంలోని అవిభక్త సంపూర్ణతను, రెండవ పదంలోని సత్యనిష్ఠ మరియు విశ్వసనీయతను సహజ తెలుగులో అందిస్తుంది; ఈ పదాలకు ఉన్న ఇతర భావఛాయలను పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘సేవించండి’ అనే పునరుక్తిని శైలీదోషంగా తొలగించకుండా మూలంలోని ప్రబోధ బలంకోసం నిలిపాం. అందించిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక సూచికలు వాటి విషయాలకు తారుమారుగా కనిపించినందున, మూలపదాలకు సరిపోయేలా [a]ను పదార్థ వివరణకు, [b]ను నది గుర్తింపుకు అమర్చాం.
