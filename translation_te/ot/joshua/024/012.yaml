source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח לִ/פְנֵי/כֶם֙ אֶת הַ/צִּרְעָ֔ה וַ/תְּגָ֤רֶשׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם שְׁנֵ֖י מַלְכֵ֣י הָ/אֱמֹרִ֑י לֹ֥א בְ/חַרְבְּ/ךָ֖ וְ/לֹ֥א בְ/קַשְׁתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/012.yaml
  text: And I sent the hornet ahead of you[a], and it drove them out before you—the two kings of the Amorites—not by your sword and not by your bow.
translation:
  language: te
  text: నేను మీ ముందుగా కందిరీగను[a] పంపాను; అది మీ ఎదుటనుండి వారిని—అమోరీయుల ఇద్దరు రాజులను—వెళ్లగొట్టింది. అది మీ ఖడ్గంతో కాదు, మీ విల్లుతో కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది అక్షరార్థంగా కందిరీగను సూచించవచ్చు; లేదా దేవుడు కలిగించిన భయం లేదా భీతికి అలంకారప్రయోగం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: నేను ... పంపాను
  rationale: שׁלח అనే క్రియ యొక్క Qal wayyiqtol ప్రథమ పురుష ఏకవచన రూపం; యెహోవా గతంలో చేసిన కార్యాన్ని కథన క్రమంలో తెలియజేస్తుంది. తెలుగులో సహజమైన వాక్యప్రవాహం కోసం ప్రత్యేకంగా ‘మరియు’ చేర్చలేదు.
- source_word: לִפְנֵיכֶם
  choice: మీకు ముందుగా
  rationale: అక్షరార్థంగా ‘మీ సమక్షానికి ముందు’; ఇక్కడ ఇశ్రాయేలీయుల కంటే ముందుగా పంపడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַצִּרְעָה
  choice: కందిరీగను
  rationale: పదానికి ప్రాథమిక అర్థం ‘కందిరీగ.’ హీబ్రూలోని నిర్దిష్ట ఏకవచనాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దైవప్రేరిత భయం అనే అలంకారార్థ సాధ్యతను పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַתְּגָרֶשׁ
  choice: అది ... వెళ్లగొట్టింది
  rationale: גרשׁ అంటే ‘వెళ్లగొట్టు/తరిమివేయు.’ స్త్రీలింగ ఏకవచన క్రియ ‘కందిరీగ’ను కర్తగా సూచిస్తున్నందున ‘అది’ అని స్పష్టంచేశాం.
- source_word: מִפְּנֵיכֶם
  choice: మీ ఎదుటనుండి
  rationale: ఇశ్రాయేలీయుల సమక్షం నుండి శత్రువులను తొలగించడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సన్నిహితంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: అమోరీయుల ఇద్దరు రాజులను
  rationale: హీబ్రూ construct phrase‌ను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, నిర్దిష్టమైన ఇద్దరు రాజులనే సూచిస్తుంది.
- source_word: לֹא בְחַרְבְּךָ
  choice: మీ ఖడ్గం వల్ల కాదు
  rationale: ב ఇక్కడ సాధనార్థకమైనది. మూలంలోని ఏకవచన సంబోధనను తెలుగులో గౌరవ/సామూహిక సందర్భానికి సహజమైన ‘మీ’తో నిలిపాం.
- source_word: וְלֹא בְקַשְׁתֶּךָ
  choice: మీ విల్లు వల్ల కాదు
  rationale: ముందటి సాధనార్థక పదబంధానికి సమాంతరంగా ఉండి, విజయం ఇశ్రాయేలు సైనిక శక్తివల్ల కలగలేదనే ఉద్ఘాటనను కాపాడుతుంది.
theological_decisions:
- issue: הַצִּרְעָה అనేది అక్షరార్థ కందిరీగనా, లేక దేవుడు కలిగించిన భయం/భీతికి అలంకారమా?
  choice: ప్రధాన పాఠ్యంలో ‘కందిరీగ’ అని అక్షరార్థంగా అనువదించడం
  alternative: ‘భయం’ లేదా ‘భీతి’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: పదం యొక్క ప్రత్యక్ష నిఘంటు అర్థాన్ని ప్రధాన పాఠ్యంలో నిలపడం మూలభాషకు నమ్మకమైనది. సందర్భం అలంకారార్థాన్ని పూర్తిగా నిర్ధారించనందున ఆ సాధ్యతను పాదటిప్పణిలో ఉంచాం; ఈ రెండు పఠనాల్లోనూ శత్రువులను వెళ్లగొట్టిన ప్రధాన కర్త దేవుడే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘కందిరీగ’ సాధారణ పాఠకులకు స్పష్టమైన పదం. ‘ఖడ్గం,’ ‘విల్లు’ బైబిలు సందర్భానికి తగినవిగా, అయినా సులభంగా అర్థమయ్యే పదాలుగా ఎంపికయ్యాయి. మూలంలోని రెండవ పురుష ఏకవచనం సమూహమైన ఇశ్రాయేలును ఉద్దేశించినందున తెలుగులో సందర్భోచితమైన ‘మీ’ వాడబడింది.
