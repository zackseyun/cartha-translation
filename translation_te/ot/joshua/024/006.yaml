id: JOS.24.6
reference: Joshua 24:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָֽ/אוֹצִ֤יא אֶת אֲבֽוֹתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/תָּבֹ֖אוּ הַ/יָּ֑מָּ/ה וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵ֧י אֲבוֹתֵי/כֶ֛ם בְּ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
translation:
  language: te
  text: అప్పుడు నేను మీ పితరులను ఐగుప్తు నుండి బయటకు తీసుకువచ్చాను. మీరు సముద్రానికి వచ్చారు; ఐగుప్తీయులు రథాలతోను గుర్రపు రౌతులతోను మీ పితరులను ఎర్ర సముద్రం[a] వరకు వెంబడించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా, “రెల్లుల సముద్రం.” హీబ్రూ: యామ్ సూఫ్.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹצִיא
  choice: అప్పుడు నేను ... బయటకు రప్పించాను
  rationale: יצא యొక్క హిఫిల్ రూపం ‘బయటకు రప్పించు’ అనే causative భావాన్ని ఇస్తుంది; వావ్ తెలిపే కథన క్రమాన్ని ‘అప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲבוֹתֵיכֶם
  choice: మీ పితరులను
  rationale: మూలంలోని ‘మీ తండ్రులు/పితరులు’ అనే పురుష పూర్విక సూచనను ‘పితరులు’ గౌరవప్రదంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తులోనుండి
  rationale: מן స్థానవాచక నామంతో మూలస్థానాన్ని సూచిస్తుంది; ‘బయటకు రప్పించాను’తో కలిసి నిర్గమన భావం స్పష్టమవుతుంది.
- source_word: וַתָּבֹאוּ הַיָּמָּה
  choice: మీరు సముద్రం దగ్గరకు వచ్చారు
  rationale: בוא మరియు దిశాసూచక ה కలయిక సముద్రం వైపు వచ్చి చేరడాన్ని సూచిస్తుంది. రెండవ పురుష బహువచన సంబోధనను యథాతథంగా ఉంచింది.
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: ఐగుప్తీయులు ... వెంబడిస్తూ
  rationale: ‘ఐగుప్తు’ ఇక్కడ ఆ దేశపు సైనికులను సూచించే సమష్టి ప్రయోగం; బహువచన క్రియకు అనుగుణంగా తెలుగులో ‘ఐగుప్తీయులు’ సహజంగా ఉంటుంది.
- source_word: אַחֲרֵי
  choice: వెంబడిస్తూ
  rationale: ‘వెనుక/తర్వాత’ అనే మూలభావం רדף క్రియతో కలిసి వెంబడింపును సూచిస్తుంది; తెలుగులో క్రియలోనే ఆ భావాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: בְּרֶכֶב
  choice: రథాలతోను
  rationale: ఇక్కడ רכב యుద్ధ రథాలను లేదా రథదళాన్ని సూచిస్తుంది; ‘రథాలతో’ స్పష్టమైన సాధన/సైనిక సహచర్య భావాన్ని ఇస్తుంది.
- source_word: וּבְפָרָשִׁים
  choice: గుర్రపు రౌతులతోను
  rationale: פָּרָשִׁים గుర్రాలపై యుద్ధం చేసే సైనికులను సూచిస్తుంది; ‘గుర్రపు రౌతులు’ ఆధునిక పాఠకులకు అర్థమయ్యే నిర్దిష్ట పదబంధం.
- source_word: יַם סוּף
  choice: ఎర్ర సముద్రం
  rationale: సాంప్రదాయికంగా, విస్తృతంగా గుర్తించబడే పేరును ప్రధాన పాఠ్యంలో ఉంచి, హీబ్రూ పదబంధానికి మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
theological_decisions:
- issue: నిర్గమన తరాన్ని ఉద్దేశించినట్లుగా ప్రస్తుత ఇశ్రాయేలుతో రెండవ పురుషంలో మాట్లాడటం
  choice: ‘మీరు సముద్రం దగ్గరకు వచ్చారు’ అనే రెండవ పురుష సంబోధనను నిలుపుట
  alternative: ‘వారు సముద్రం దగ్గరకు వచ్చారు’ అని మూడవ పురుషానికి మార్చుట
  rationale: యెహోషువ ప్రస్తుత శ్రోతలను వారి పితరుల నిబంధన చరిత్రతో ఏకం చేస్తూ మాట్లాడుతున్నాడు. మూలంలోని రెండవ పురుష రూపాన్ని ఉంచడం ఆ వాక్చాతుర్యాన్ని కాపాడుతుంది.
- issue: יַם סוּף పదబంధం అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘ఎర్ర సముద్రం’
  alternative: ‘రెల్లుల సముద్రం’
  rationale: ‘ఎర్ర సముద్రం’ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన చారిత్రక పేరు; అయితే హీబ్రూ పదబంధానికి మరింత అక్షరార్థమైన రూపాన్ని పాదటిప్పణిలో ఉంచడం భాషాత్మక పారదర్శకతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పితరులు,’ ‘రథాలు,’ ‘గుర్రపు రౌతులు’ వంటి బైబిలు సందర్భానికి తగినప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. మూలంలోని ప్రత్యక్ష రెండవ పురుష సంబోధన నిలుపబడింది.
