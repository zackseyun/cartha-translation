id: JOS.24.10
reference: Joshua 24:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֥א אָבִ֖יתִי לִ/שְׁמֹ֣עַ לְ/בִלְעָ֑ם וַ/יְבָ֤רֶךְ בָּרוֹךְ֙ אֶתְ/כֶ֔ם וָ/אַצִּ֥ל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
translation:
  language: te
  text: కాని నేను బిలాము మాట వినడానికి ఇష్టపడలేదు; అతడు మిమ్మల్ని తప్పకుండా దీవించాడు, నేను మిమ్మల్ని అతని చేతిలోనుండి విడిపించాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבִיתִי
  choice: ఇష్టపడలేదు
  rationale: אבה అనేది సామర్థ్యాన్ని కాక సమ్మతి లేదా సంకల్పాన్ని సూచిస్తుంది. దైవ ప్రథమ పురుష వాక్యంలో ఉన్న సంకల్పార్థాన్ని సహజమైన ఆధునిక తెలుగులో ఇది నిలుపుతుంది.
- source_word: לִשְׁמֹעַ לְבִלְעָם
  choice: బిలాము మాట వినడానికి
  rationale: שׁמע + לְ నిర్మాణం ఒకరి మాట వినడం లేదా ఆలకించడం అనే అర్థం ఇస్తుంది. తెలుగులో ‘బిలాము మాట వినడం’ సహజంగా ఉండి, కేవలం శబ్దం వినడంకన్నా అతని మాటకు స్పందించడాన్ని సూచిస్తుంది.
- source_word: וַיְבָרֶךְ בָּרוֹךְ
  choice: అతడు ... తప్పకుండా దీవించాడు
  rationale: సజాత ధాతువుతో కూడిన క్రియావిశేషక infinitive absolute నిర్మాణం క్రియను బలపరుస్తుంది. ‘తప్పకుండా దీవించాడు’ ఆ ఉద్ఘాటనను నిలుపుతుంది; పునరావృత చర్యగా నిర్బంధంగా అర్థం చేయదు.
- source_word: אֶתְכֶם
  choice: మిమ్మల్ని
  rationale: ద్వితీయ పురుష బహువచన కర్మరూపాన్ని తెలుగులో గౌరవసూచక/బహువచన కర్మరూపంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וָאַצִּל
  choice: విడిపించాను
  rationale: נצל అంటే ఒకరి అధీనంనుండి రక్షించడం లేదా విడిపించడం. ‘విడిపించాను’ ఇక్కడి చారిత్రక రక్షణ భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: מִיָּדוֹ
  choice: అతని చేతిలోనుండి
  rationale: హీబ్రూ ‘చేతి’ రూపకం అధికారం లేదా పట్టును సూచిస్తుంది. ఈ రూపకం తెలుగులోనూ అర్థవంతంగా ఉండటంతో దానిని నిలుపుతున్నాం.
theological_decisions:
- issue: బిలాము దీవించడంలో కర్త ఎవరు?
  choice: ‘అతడు’ అనేది బిలామును సూచిస్తుంది.
  alternative: అంతర్లీన కర్త దేవుడు—‘నేనే మిమ్మల్ని దీవించాను’ అని భావించడం.
  rationale: హీబ్రూ క్రియ తృతీయ పురుష ఏకవచనంలో ఉంది; ముందున్న బిలామే సహజమైన వ్యాకరణ కర్త. విస్తృత సందర్భంలో దేవుడు బిలాము ఉద్దేశాన్ని తారుమారు చేశాడని స్పష్టమైనా, వాక్యంలోని కర్తను దేవునిగా మార్చకూడదు.
- issue: దీవెన క్రియలోని ఉద్ఘాటన
  choice: ‘తప్పకుండా దీవించాడు’
  alternative: ‘మళ్లీ మళ్లీ దీవించాడు’
  rationale: וַיְבָרֶךְ בָּרוֹךְ అనే finite verb + cognate infinitive నిర్మాణం నిశ్చయత/తీవ్రతను బలపరుస్తుంది; అది స్వతహాగా పునరావృతిని తప్పనిసరిగా సూచించదు. అందువల్ల మూలంలోని నిజమైన ఉద్ఘాటనను అతివ్యాఖ్యానం లేకుండా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే చారిత్రక-ఒడంబడిక వాక్యశైలికి తగిన గౌరవభరిత ధోరణితో రూపొందించబడింది. ‘అతని చేతిలోనుండి’ అనే మూల రూపకాన్ని నిలుపుతూ, వాక్యసంధికి ‘అలా’ వాడబడింది.
