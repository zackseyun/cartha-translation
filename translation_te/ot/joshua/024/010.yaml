revisions:
- from: కాని నేను బిలాము మాట వినడానికి ఇష్టపడలేదు; అతడు మిమ్మల్ని తప్పకుండా దీవించాడు[a]. అలా నేను అతని చేతిలోనుండి మిమ్మల్ని విడిపించాను.
  to: కాని నేను బిలాము మాట వినడానికి ఇష్టపడలేదు; అతడు మిమ్మల్ని తప్పకుండా దీవించాడు, నేను మిమ్మల్ని అతని చేతిలోనుండి విడిపించాను.
  rationale: The revision removes ‘అలా,’ which supplied a causal or consequential nuance absent from the Hebrew, while retaining the source order and its simple coordination. The footnote is adjusted to explain the emphatic cognate construction in natural Telugu and to avoid suggesting that the action was necessarily continuous or repeated.
