source:
  edition: WLC
  text: וָ֠/אֶקַּח אֶת אֲבִי/כֶ֤ם אֶת אַבְרָהָם֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וָ/אוֹלֵ֥ךְ אוֹת֖/וֹ בְּ/כָל אֶ֣רֶץ כְּנָ֑עַן ו/ארב אֶת זַרְע֔/וֹ וָֽ/אֶתֶּן ל֖/וֹ אֶת יִצְחָֽק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
translation:
  language: te
  text: అప్పుడు నేను మీ తండ్రియైన అబ్రాహామును నదికి అవతలినుండి[a] తీసుకొని కనాను దేశమంతటా అతన్ని నడిపించాను. అతని సంతానాన్ని అనేకంగా చేసి, అతనికి ఇస్సాకును ఇచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘నది’ అనేది బహుశా యూఫ్రటీసు నదిని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: అప్పుడు నేను ... తీసుకొని
  rationale: לקח అనే క్రియ యొక్క ప్రథమ పురుష ఏకవచన వయ్యిక్తోల్ రూపం దేవుని గత కార్యాన్ని వరుస కథనంగా తెలియజేస్తుంది. తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲבִיכֶם אֶת־אַבְרָהָם
  choice: మీ పితరుడైన అబ్రాహామును
  rationale: హెబ్రీలో అక్షరార్థంగా ‘మీ తండ్రి’ అని ఉన్నా, ఇక్కడ ఇశ్రాయేలీయుల పూర్వికుడైన అబ్రాహాము ఉద్దేశించబడ్డాడు. ‘పితరుడు’ మూలంలోని కుటుంబ–నిబంధన భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో అపార్థాన్ని నివారిస్తుంది.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: నదికి అవతలి వైపు నుండి
  rationale: עֵבֶר తో מן కలిసిన రూపం సూచనాస్థానానికి అవతలి వైపు నుంచి రావడాన్ని తెలుపుతుంది. మూలంలో నది పేరు కాక నిర్దిష్టమైన ‘నది’ మాత్రమే ఉంది; దాని సాధ్యమైన గుర్తింపును పాదసూచికలో ఉంచాం.
- source_word: וָאוֹלֵךְ אוֹתוֹ
  choice: అతన్ని నడిపించాను
  rationale: הלך యొక్క హిఫిల్ రూపం కారణార్థక భావాన్ని కలిగి ఉంది. ‘నడిపించాను’ దేవుడే అతన్ని వెళ్లేలా చేసి దారిచూపిన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּכָל אֶרֶץ כְּנָעַן
  choice: కనాను దేశమంతటా
  rationale: ప్రయాణాన్ని సూచించే ముందరి క్రియతో కలిసి בְּכָל అనే పదబంధం దేశమంతటా లేదా దేశమంతటిలో ప్రయాణించడాన్ని సూచిస్తుంది.
- source_word: וָאַרְבֶּה אֶת־זַרְעוֹ
  choice: అతని సంతానాన్ని విస్తరింపజేసి
  rationale: רבה హిఫిల్ రూపం ఎక్కువ చేయడం లేదా విస్తరింపజేయడం అనే భావం ఇస్తుంది. זֶרַע సమూహార్థక ఏకవచనం; ‘సంతానం’ తెలుగులో అదే సమూహార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: וָאֶתֶּן לוֹ אֶת־יִצְחָק
  choice: అతనికి ఇస్సాకును ఇచ్చాను
  rationale: మూలంలోని పరోక్ష కర్మ, ప్రత్యక్ష కర్మ క్రమాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ ఇస్సాకు దేవుడు అబ్రాహాముకు ఇచ్చినవాడనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: అబ్రాహాముకు వాడిన పూర్విక సంబోధన
  choice: మీ పితరుడైన అబ్రాహాము
  alternative: మీ తండ్రి అబ్రాహాము
  rationale: మూలంలోని ‘తండ్రి’ అనే కుటుంబ–నిబంధన సంబంధాన్ని ‘పూర్వికుడు’ అనే సాధారణ పదంతో పూర్తిగా పలుచన చేయకుండా ‘పితరుడు’తో నిలిపాం; అదే సమయంలో అబ్రాహాము ప్రత్యక్ష తండ్రి అన్న అపార్థాన్ని నివారించాం.
- issue: ‘నది’ యొక్క గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘నది’
  alternative: యూఫ్రటీసు నది
  rationale: హెబ్రీ పాఠ్యం నది పేరును చెప్పకుండా నిర్దిష్ట సామాన్య నామాన్నే వాడుతుంది. అందువల్ల సాధ్యమైన యూఫ్రటీసు గుర్తింపును ప్రధాన పాఠ్యంలో చేర్చకుండా పాదసూచికలో తెలిపాం.
- issue: זֶרַע యొక్క సమూహార్థం
  choice: సంతానం
  alternative: వంశస్థులు
  rationale: ‘సంతానం’ హెబ్రీ సమూహార్థక ఏకవచనంలోని నిజమైన విస్తృతిని కాపాడుతుంది; బహువచనమైన ‘వంశస్థులు’ భావాన్ని స్పష్టం చేసినా మూల రూపాన్ని కొంత విప్పి చెబుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. ‘పితరుడు’ మూలంలోని పూర్విక–నిబంధన భావాన్ని కాపాడుతుంది; ‘నడిపించాను,’ ‘విస్తరింపజేసి’ వంటి రూపాలు దేవుని కార్యసాధక పాత్రను స్పష్టంగా ఉంచుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉన్నాయి.
