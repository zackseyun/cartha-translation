- from: అహరోను కుమారుడైన ఎలియాజరు చనిపోయాడు. అతని కుమారుడైన ఫీనెహాసుకు ఎఫ్రాయిము కొండప్రాంతంలో ఇవ్వబడిన గిబియాలో వారు అతన్ని పాతిపెట్టారు.[a]
  to: అహరోను కుమారుడైన ఎలియాజరు మరణించాడు. వారు అతన్ని ఎఫ్రాయిము కొండప్రాంతంలో ఉన్న, అతని కుమారుడైన ఫీనెహాసు గిబ్యాత్‌లో పాతిపెట్టారు; అది అతనికి ఇవ్వబడింది.[a]
  rationale: మూలంలోని స్థలనామాన్ని మరియు לוֹ సర్వనామపు అస్పష్టతను ప్రధాన పాఠ్యంలోనే కాపాడాం. ఎలియాజరు మరణించిన తరువాత అతన్ని పాతిపెట్టారని చెప్పే క్రమం, ఫీనెహాసు అతని కుమారుడనే వివరణ, ఎఫ్రాయిము కొండప్రాంతం అన్న భౌగోళిక సూచన అన్నీ నిలిపాం. ఆంగ్ల audit trailలోని ‘his son’s hill country’ అనే నిర్మాణం హీబ్రూ పదక్రమాన్ని పూర్తిగా ప్రతిబింబించదు; తెలుగు పాఠ్యం మూలభాషకే ప్రాధాన్యం ఇస్తుంది.
