  text: וְ/אֶלְעָזָ֥ר בֶּֽן אַהֲרֹ֖ן מֵ֑ת וַ/יִּקְבְּר֣וּ אֹת֗/וֹ בְּ/גִבְעַת֙ פִּֽינְחָ֣ס בְּנ֔/וֹ אֲשֶׁ֥ר נִתַּן ל֖/וֹ בְּ/הַ֥ר אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/033.yaml
  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: te
  text: అహరోను కుమారుడైన ఎలియాజరు మరణించాడు. వారు అతన్ని ఎఫ్రాయిము కొండప్రాంతంలో ఉన్న, అతని కుమారుడైన ఫీనెహాసు గిబ్యాత్‌లో పాతిపెట్టారు; అది అతనికి ఇవ్వబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “అతనికి” అనే సర్వనామం ఎలియాజరునో ఫీనెహాసునో సూచించవచ్చు.
    reason: హీబ్రూ సంబంధవాక్యంలోని לוֹ సర్వనామానికి ఉన్న నిజమైన సూచనాస్పష్టతను సంరక్షించడం.
lexical_decisions:
- source_word: גִּבְעַת פִּינְחָס
  choice: ఫీనెహాసుకు ... ఇవ్వబడిన గిబియా
  rationale: גִּבְעָה సాధారణంగా ‘కొండ’ అని అర్థమైనా, ఇక్కడ సమాధి స్థలాన్ని సూచించే ప్రదేశనామంగా ‘గిబియా’ అని లిప్యంతరీకరించాం; פִּינְחָס‌ను దానితో సంబంధింపజేసి సహజమైన తెలుగులో తెలిపాం.
- source_word: אֲשֶׁר נִתַּן לוֹ
  choice: అతని కుమారుడైన ఫీనెహాసుకు ... ఇవ్వబడిన
  rationale: ‘అతనికి ఇవ్వబడినది’ అనే హీబ్రూ సంబంధవాక్యంలో לוֹ ఎవరిని సూచిస్తుందో స్పష్టీకరించేందుకు సమీప పురుషనామమైన ఫీనెహాసును ప్రధాన పాఠ్యంలో ఉంచాం; వ్యాకరణపరమైన అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: הַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతం
  rationale: ఇది ఒక్క కొండకన్నా ఎఫ్రాయిము గిరిప్రదేశాన్ని సూచించే స్థిర భౌగోళిక పదబంధం.
theological_decisions:
- issue: భూమి ఎవరికి ఇవ్వబడింది అనే సర్వనామ సూచన
  choice: ఫీనెహాసుకు ఇవ్వబడినదిగా ప్రధాన పాఠ్యంలో అనువదించడం
  alternative: ఎలియాజరుకు ఇవ్వబడినదిగా, లేదా ‘అతనికి’ అని అస్పష్టంగా ఉంచడం
  rationale: לוֹ వ్యాకరణపరంగా ఇద్దరిలో ఎవరినైనా సూచించగలదు; అయితే సమీప పూర్వపదమైన ఫీనెహాసు మరియు సాధారణ అనువాద సంప్రదాయం అతనినే సూచిస్తున్నట్లు గ్రహిస్తాయి. నిజమైన అస్పష్టతను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. వ్యక్తి పేర్లు సాధారణ తెలుగు బైబిలు రూపాలకు అనుగుణంగా ఉన్నాయి; భౌగోళిక పదబంధం సహజంగా చదివేలా అమర్చబడింది.
