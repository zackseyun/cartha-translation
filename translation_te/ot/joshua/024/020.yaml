source:
  edition: WLC
  text: כִּ֤י תַֽעַזְבוּ֙ אֶת יְהוָ֔ה וַ/עֲבַדְתֶּ֖ם אֱלֹהֵ֣י נֵכָ֑ר וְ/שָׁ֨ב וְ/הֵרַ֤ע לָ/כֶם֙ וְ/כִלָּ֣ה אֶתְ/כֶ֔ם אַחֲרֵ֖י אֲשֶׁר הֵיטִ֥יב לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
translation:
  language: te
  text: మీరు యహ్వేను విడిచిపెట్టి అన్య దేవుళ్లను సేవిస్తే, అప్పుడు ఆయన తిరిగి మీకు కీడు చేస్తాడు[a], మీకు మేలు చేసిన తరువాత మిమ్మల్ని నాశనం చేస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ మీదికి విపత్తు తెస్తాడు.’ హీబ్రూ క్రియ నైతిక చెడును కాకుండా హాని లేదా విపత్తు కలిగించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మిమ్మల్ని నిర్మూలిస్తాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: మీరు … చేస్తే
  rationale: ఈ హెచ్చరిక సందర్భంలో ఇది షరతును పరిచయం చేస్తుంది; తెలుగులో ‘చేస్తే’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: תַעַזְבוּ
  choice: విడిచిపెట్టి
  rationale: ఇక్కడ క్రియ యహ్వేతో ఉన్న నిబంధన సంబంధాన్ని త్యజించడాన్ని సూచిస్తుంది; ‘విడిచిపెట్టి’ ఆ సంబంధపరమైన బలాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సాధారణంగా పునర్నిర్మించిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַעֲבַדְתֶּם
  choice: సేవిస్తే
  rationale: దేవుళ్ల సందర్భంలో עבד మతపరమైన విధేయతతో సేవించడాన్ని, ఆరాధించడాన్ని సూచిస్తుంది; ‘సేవించడం’ మూల రూపకాన్ని నిలుపుతుంది.
- source_word: אֱלֹהֵי נֵכָר
  choice: అన్య దేవుళ్లు
  rationale: ఇశ్రాయేలుకు, యహ్వే ఆరాధనకు పరాయివైన దేవుళ్లను సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וְשָׁב
  choice: ఆయన మీ పట్ల మారి
  rationale: యహ్వే ఇశ్రాయేలుతో వ్యవహరించే తీరులో వచ్చే తిరుగుదలను తెలియజేస్తుంది; కేవలం ‘తిరిగి’ అని అనువదిస్తే ‘మళ్లీ’ అనే అస్పష్ట భావం రావచ్చు.
- source_word: וְהֵרַע לָכֶם
  choice: మీకు కీడు చేస్తాడు
  rationale: హిఫిల్ రూపం హాని లేదా విపత్తు కలిగించడాన్ని సూచిస్తుంది; నైతికంగా చెడు చేయడం అనే భావాన్ని బలవంతంగా మోపకుండా దైవ తీర్పు తీవ్రతను ఉంచుతుంది.
- source_word: וְכִלָּה אֶתְכֶם
  choice: మిమ్మల్ని పూర్తిగా అంతం చేస్తాడు
  rationale: כלה ఇక్కడ సంపూర్ణ అంతం లేదా నిర్మూలన భావాన్ని కలిగిస్తుంది; ఈ తెలుగు రూపం దాని తీవ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַחֲרֵי אֲשֶׁר הֵיטִיב לָכֶם
  choice: మీకు మేలు చేసిన తరువాత
  rationale: గతంలో యహ్వే వారికి మేలు చేసినదానికీ తరువాతి తీర్పుకూ ఉన్న స్పష్టమైన వ్యత్యాసాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ముందుగా మేలు చేసిన దేవుడే తరువాత తీర్పుగా కీడు కలిగించడం
  choice: విగ్రహారాధనకు ప్రతిస్పందనగా యహ్వే తన అనుకూల వ్యవహారాన్ని మార్చి నేరుగా హాని మరియు అంతం కలిగిస్తాడనే నిబంధన హెచ్చరికను నిలిపాం.
  alternative: విగ్రహారాధన వల్ల సహజంగా కలిగే పరిణామాలుగా మాత్రమే వాక్యాన్ని మృదువుగా చెప్పడం.
  rationale: హీబ్రూ క్రియలు తీర్పు కార్యాన్ని యహ్వేకే నేరుగా ఆపాదిస్తున్నాయి. అందువల్ల దైవ కార్యసాధకత్వాన్ని తగ్గించకుండా, దానిపై తరువాతి సిద్ధాంత వివరణను కూడా చేర్చకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘యహ్వే’ దైవ నామాన్ని లిప్యంతరీకరిస్తుంది; ‘మీ పట్ల మారి’ అనేది వ్యవహారంలోని తిరుగుదలను సహజంగా తెలియజేస్తుంది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల తరువాత ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
