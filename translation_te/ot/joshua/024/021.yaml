source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ לֹ֕א כִּ֥י אֶת יְהוָ֖ה נַעֲבֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/021.yaml
  text: But the people said to Joshua[a], “No, but we will serve Yahweh.”
translation:
  language: te
  text: అయితే ప్రజలు యెహోషువతో, “కాదు, యాహ్వేనూ సేవిస్తాము” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר הָעָם
  choice: ప్రజలు ... అన్నారు
  rationale: సమావేశమైన ఇశ్రాయేలు సమాజాన్ని సూచించే הָעָם ను ‘ప్రజలు’గా, ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే וַיֹּאמֶר ను సహజమైన తెలుగు కథన క్రమంలో ‘అన్నారు’గా అనువదించాం.
- source_word: אֶל יְהוֹשֻׁעַ
  choice: యెహోషువతో
  rationale: మాటల ఉద్దేశిత వ్యక్తిని తెలుగులో సహజంగా సూచించేందుకు ‘యెహోషువతో’ అని ఇచ్చాం.
- source_word: לֹא כִּי
  choice: కాదు!
  rationale: ముందటి సవాలును గట్టిగా తిరస్కరించి, దానికి విరుద్ధమైన సంకల్పాన్ని ప్రకటించే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; כִּי యొక్క సరిదిద్దే/వ్యతిరేక బలం తరువాతి వాక్యంతోనే స్పష్టమవుతుంది.
- source_word: אֶת יְהוָה
  choice: యెహోవాను
  rationale: אֶת ప్రత్యేకంగా అనువదించని కర్మసూచకం; יְהוָה అనే దైవనామాన్ని తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో, కర్మవిభక్తితో ఇచ్చాం.
- source_word: נַעֲבֹד
  choice: మేము ... సేవిస్తాము
  rationale: עבד యొక్క ఒడంబడిక సందర్భంలోని సేవ, విధేయత, ఆరాధనల విస్తృత భావాన్ని ‘సేవిస్తాము’ నిలుపుతుంది; మొదటి పురుష బహువచనాన్ని ‘మేము’ స్పష్టపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న చతురక్షర దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగానే ఉంచాం. ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: לֹא כִּי యొక్క సంబంధం
  choice: “కాదు!” అనే గట్టి నిరాకరణ తరువాత విరుద్ధ సంకల్ప ప్రకటన
  alternative: “కాదు, ఎందుకంటే...”
  rationale: ఈ సందర్భంలో כִּי కారణార్థం కంటే సరిదిద్దే/వ్యతిరేక బలంతో ఉంది. అందువల్ల ప్రజలు యెహోవాను సేవించలేరనే ముందటి మాటను తిరస్కరిస్తున్న భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్తమైన, దృఢమైన సమాధానాన్ని నిలుపుతూ అనవసర వివరణను చేర్చలేదు.
