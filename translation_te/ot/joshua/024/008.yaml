source:
  edition: WLC
  text: ו/אבא/ה אֶתְ/כֶ֗ם אֶל אֶ֤רֶץ הָ/אֱמֹרִי֙ הַ/יּוֹשֵׁב֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּֽלָּחֲמ֖וּ אִתְּ/כֶ֑ם וָ/אֶתֵּ֨ן אוֹתָ֤/ם בְּ/יֶדְ/כֶם֙ וַ/תִּֽירְשׁ֣וּ אֶת אַרְצָ֔/ם וָ/אַשְׁמִידֵ֖/ם מִ/פְּנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
translation:
  language: te
  text: తరువాత నేను మిమ్మల్ని యొర్దాను అవతల నివసించిన అమోరీయుల భూమిలోకి తీసుకొచ్చాను. వారు మీతో యుద్ధం చేశారు.[అ] నేను వారిని మీ చేతికి అప్పగించాను; మీరు వారి భూమిని స్వాధీనం చేసుకున్నారు. నేను మీ ఎదుట నుండి వారిని నాశనం చేశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: అ
    text: లేదా, “వారు మీకు వ్యతిరేకంగా యుద్ధం చేశారు.” హీబ్రూలో అక్షరార్థంగా, “వారు మీతో యుద్ధం చేశారు”; సందర్భం శత్రుత్వపూర్వక పోరాటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲבִיאָה אֶתְכֶם
  choice: తరువాత నేను మిమ్మల్ని ... తీసుకొచ్చాను
  rationale: בוא హిఫీల్ రూపం ‘తీసుకురావడం’ అనే కారక భావాన్ని ఇస్తుంది. కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో చూపడానికి వావ్‌ను ‘తరువాత’గా అనువదించాం.
- source_word: אֶל אֶרֶץ הָאֱמֹרִי
  choice: అమోరీయుల దేశంలోకి
  rationale: אֶל ఇక్కడ ఆ ప్రాంతంలోకి ప్రవేశాన్ని సూచిస్తుంది. ఏకవచన సమూహవాచకమైన הָאֱמֹרִיని తెలుగులో సహజంగా బహువచన జాతినామంగా ఇచ్చాం.
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల నివసించిన
  rationale: יֹשֵׁב అనే కృదంతం అమోరీయులను విశేషిస్తుంది. בְּעֵבֶר‌ను దిశను అనవసరంగా నిర్దిష్టం చేయకుండా ‘అవతల’గా ఉంచాం.
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  choice: వారు మీతో యుద్ధం చేశారు
  rationale: לחם తో వచ్చిన אֵת/עִם యుద్ధంలో ప్రతికూలంగా తలపడటాన్ని సూచిస్తుంది. ‘మీతో యుద్ధం చేశారు’ మూలంలోని నిర్మాణాన్ని కాపాడుతూ తెలుగులో శత్రుత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: నేను వారిని మీ చేతికి అప్పగించాను
  rationale: נתן ביד అనే నుడికారం శత్రువులను ఒకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. ‘మీ చేతికి అప్పగించాను’ తెలుగులో అర్థవంతంగా ఉండి హీబ్రూ రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: וַתִּירְשׁוּ אֶת אַרְצָם
  choice: మీరు వారి దేశాన్ని స్వాధీనం చేసుకున్నారు
  rationale: ירש ఈ సందర్భంలో విజయానంతరం భూమిని ఆధీనంలోకి తీసుకోవడాన్ని సూచిస్తుంది; ‘స్వాధీనం చేసుకున్నారు’ వారసత్వం అనే అదనపు భావాన్ని రుద్దదు.
- source_word: וָאַשְׁמִידֵם מִפְּנֵיכֶם
  choice: నేను వారిని మీ ఎదుట నుండి నాశనం చేశాను
  rationale: שׁמד యొక్క బలమైన నాశనార్థాన్ని మృదువుపరచలేదు. מִפְּנֵיכֶםలోని తొలగింపు మరియు సన్నిధి భావాలను ‘మీ ఎదుట నుండి’ ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ఆక్రమణకు సంబంధించిన దైవిక కార్యాన్ని మృదువుపరచకుండా అనువదించడం
  choice: ‘నేను వారిని మీ చేతికి అప్పగించాను ... మీరు వారి దేశాన్ని స్వాధీనం చేసుకున్నారు ... నేను వారిని ... నాశనం చేశాను’ అని ప్రత్యక్షంగా ఉంచడం
  alternative: ‘ఓడించాను’ లేదా ‘తొలగించాను’ వంటి మృదువైన పదాలు వాడడం
  rationale: హీబ్రూ వచనం యుద్ధం, దేశ స్వాధీనం, నాశనం అనే బలమైన భాషను ఉపయోగిస్తుంది. అనువాదం దానిని విస్తరించకూడదు, అలాగే సిద్ధాంతపరమైన అసౌకర్యం కారణంగా తగ్గించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథన శైలి. ‘యొర్దాను అవతల,’ ‘మీ చేతికి అప్పగించాను,’ ‘మీ ఎదుట నుండి’ అనే మూలభాషా రూపాలను సహజమైన తెలుగు పరిమితిలో నిలిపాం.
