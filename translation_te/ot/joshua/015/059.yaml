base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/059.yaml
  text: 'and Maarath[a], and Beth-anoth, and Eltekon: six cities with their villages.'
translation:
  language: te
  text: మరియు మారాత్, బేత్-అనోత్, ఎల్తెకోను—వాటి గ్రామాలతో కూడిన ఆరు పట్టణాలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటికి అనుబంధమైన నివాస ప్రాంతాలు” లేదా “వాటి పల్లెలు.” ఇక్కడి హెబ్రీ పదం పేర్కొన్న పట్టణాలకు అనుబంధంగా ఉన్న గ్రామీణ నివాసాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַעֲרָת
  choice: మారాతు
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా, ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండే రూపంలో లిప్యంతరీకరించబడింది; ముందున్న וּ సందర్భానుసారంగా జాబితా అనుసంధానంలో ప్రతిబింబిస్తుంది.
- source_word: וּבֵית עֲנוֹת
  choice: బేతనోతు
  rationale: בֵית ఈ సంయుక్త స్థలనామంలో భాగం; అందువల్ల ‘అనోతు ఇల్లు’ అని అర్థానువాదం చేయకుండా ఒకే పేరుగా లిప్యంతరీకరించబడింది.
- source_word: וְאֶלְתְּקֹן
  choice: ఎల్తెకోను
  rationale: స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనువైన రూపంలో లిప్యంతరీకరించాం.
- source_word: עָרִים שֵׁשׁ
  choice: ఆరు పట్టణాలు
  rationale: ఈ భూభాగాల జాబితా సందర్భంలో עִיר నివాస కేంద్రాన్ని సూచిస్తుంది; ఆధునిక సందర్భంలో అతిశయార్థం రాకుండా ‘పట్టణాలు’ అని అనువదించాం. హెబ్రీ పదక్రమాన్ని సహజ తెలుగు పదక్రమంగా మార్చాం.
- source_word: וְחַצְרֵיהֶן
  choice: వాటి గ్రామాలతో కలిపి
  rationale: חָצֵר ఇక్కడ పట్టణాలకు అనుబంధంగా ఉన్న గ్రామీణ నివాసాలను సూచిస్తుంది; ‘ప్రాంగణాలు’ అనే అక్షరార్థం ఈ భౌగోళిక జాబితా సందర్భానికి సరిపోదు. וְ ను జాబితా మొత్తాన్ని అనుబంధ గ్రామాలతో కలిపే భావంలో సహజ తెలుగులో వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూభాగాల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. పేర్లు అనువదించకుండా తెలుగు లిపిలో సహజంగా పలికే రూపాల్లో ఇవ్వబడ్డాయి. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుకుంటూనే తెలుగు వాక్యక్రమం సహజంగా ఉండేలా అమర్చబడింది.
