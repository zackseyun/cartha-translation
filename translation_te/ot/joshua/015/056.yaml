  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ స్థలనామాలను హీబ్రూ మూలానికి సమీపంగా లిప్యంతరీకరించాం. మూలంలోని సరళమైన జాబితా స్వరూపాన్ని అలాగే ఉంచాం.
