  text: యిజ్రెయేలు[a], యొక్దెయాము, జానోహు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలపాఠంలో ఇవి యూదా స్వాస్థ్యంలో ఉన్న పట్టణాల పేర్లతో కూడిన సాధారణ జాబితా.
    reason: cultural_note
lexical_decisions:
- source_word: יִזְרְעֶאל
  choice: యిజ్రెయేలు
  rationale: యూదా స్వాస్థ్యంలోని పట్టణాల జాబితాలోని స్థలనామం; అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: יָקְדְעָם
  choice: యొక్దెయాము
  rationale: స్థలనామం; హీబ్రూ రూపానికి సమీపంగా, తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించబడింది.
- source_word: זָנוֹחַ
  choice: జానోహు
  rationale: స్థలనామం; చివరి హీబ్రూ గొంతు ధ్వనిని తెలుగులో ఖచ్చితంగా ప్రతిబింబించడం సాధ్యం కానందున, మూల ఉచ్చారణకు సమీపమైన పఠనయోగ్య రూపం వాడబడింది.
- source_word: וְ
  choice: జాబితాలో కామాలు, చివర విరామచిహ్నం
  rationale: హీబ్రూలో ప్రతి పేరుకు ముందు ఉన్న సంధాయకం సాధారణ జాబితా నిర్మాణాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో పేర్లను కామాలతో వరుసగా ఇవ్వడం సహజం.
