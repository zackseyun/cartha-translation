source:
  edition: WLC
  text: וַ/תֹּ֜אמֶר תְּנָ/ה לִּ֣/י בְרָכָ֗ה כִּ֣י אֶ֤רֶץ הַ/נֶּ֨גֶב֙ נְתַתָּ֔/נִי וְ/נָתַתָּ֥ה לִ֖/י גֻּלֹּ֣ת מָ֑יִם וַ/יִּתֶּן לָ֗/הּ אֵ֚ת גֻּלֹּ֣ת עִלִּיּ֔וֹת וְ/אֵ֖ת גֻּלֹּ֥ת תַּחְתִּיּֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
translation:
  language: te
  text: ఆమె, “దయచేసి నాకు ఒక ఆశీర్వాదం[a] ఇవ్వండి. మీరు నాకు నెగెబు ప్రాంతాన్ని[b] ఇచ్చారు కాబట్టి, నీటి ఊటలను[c] కూడా నాకు ఇవ్వండి” అంది. అప్పుడు అతడు ఆమెకు ఎగువ ఊటలను, దిగువ ఊటలను ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కానుక.” హీబ్రూ మూలంలో “ఆశీర్వాదం” అని ఉంది; ఇక్కడ అది ప్రయోజనకరమైన అనుగ్రహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నెగెబు” అనే హీబ్రూ పదానికి “దక్షిణ ప్రాంతం” లేదా “ఎండిన ప్రాంతం” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడి హీబ్రూ పదం ఊటలను, కొలనులను లేదా నీటి గుంటలను సూచించవచ్చు; ఈ సందర్భంలో “ఊటలు” అనేది తగిన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  choice: ఆశీర్వాదం
  rationale: మూలంలోని సాధారణ అర్థమైన ‘ఆశీర్వాదం’ను నిలుపుతుంది; ఈ సందర్భంలో అది ప్రయోజనకరమైన కానుక లేదా అనుగ్రహాన్ని సూచిస్తుంది.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: నెగెబు ప్రాంతం
  rationale: נֶגֶב ఇక్కడ భౌగోళిక నామంగా పనిచేస్తుంది; ‘ప్రాంతం’ సహజమైన తెలుగులో אֶרֶץ భావాన్ని తెలియజేస్తుంది.
- source_word: גֻּלֹּת מָיִם
  choice: నీటి ఊటలు
  rationale: గֻּלֹּת యొక్క ఖచ్చిత భావం చర్చనీయమైనప్పటికీ, ఎగువ-దిగువ నీటి వనరుల సందర్భంలో ‘ఊటలు’ సరిపోతుంది.
- source_word: תְּנָה
  choice: దయచేసి ... ఇవ్వండి
  rationale: ఆజ్ఞారూపంలోని అభ్యర్థనా మర్యాదను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְנָתַתָּה לִי
  choice: కూడా నాకు ఇవ్వండి
  rationale: ముందే ఇచ్చిన భూమికి అదనంగా నీటి వనరులను కోరుతున్న భావాన్ని ‘కూడా’ స్పష్టం చేస్తుంది.
- source_word: גֻּלֹּת עִלִּיּוֹת
  choice: ఎగువ ఊటలు
  rationale: ఎత్తైన ప్రదేశంలోని నీటి వనరుల భావాన్ని, ముందటి ‘ఊటలు’ అనువాదంతో ఏకరూపంగా అందిస్తుంది.
- source_word: גֻּלֹּת תַּחְתִּיּוֹת
  choice: దిగువ ఊటలు
  rationale: సమాంతర నిర్మాణాన్ని నిలుపుతూ, కిందివైపు ఉన్న నీటి వనరులను సూచిస్తుంది.
- source_word: וַיִּתֶּן לָהּ
  choice: అప్పుడు అతడు ఆమెకు ... ఇచ్చాడు
  rationale: కథన క్రమంలో ఆమె అభ్యర్థన తర్వాత జరిగిన చర్యను సహజంగా తెలియజేస్తుంది.
