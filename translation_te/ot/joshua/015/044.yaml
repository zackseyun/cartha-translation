lexical_decisions:
- source_word: קְעִילָה
  choice: కెయీలా
  rationale: స్థలనామాన్ని హెబ్రీ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: אַכְזִיב
  choice: అక్జీబు
  rationale: ఇది స్థలనామం; హెబ్రీ రూపాన్ని గుర్తించగలిగేలా సహజమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: מָרֵאשָׁה
  choice: మారేషా
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: עָרִים
  choice: పట్టణాలు
  rationale: ప్రాదేశిక పట్టణాల జాబితాలో עִיר పదానికి ఆధునిక తెలుగులో సహజమైన, పరిమాణాన్ని అతిశయింపజేయని సమానార్థకం.
- source_word: תֵּשַׁע
  choice: తొమ్మిది
  rationale: పట్టణాల మొత్తం సంఖ్యను సూచించే సంఖ్యావాచకాన్ని నేరుగా అనువదించాం.
- source_word: חַצְרֵיהֶן
  choice: వాటి గ్రామాలు
  rationale: ప్రధాన పట్టణాలకు అనుబంధంగా ఉన్న గ్రామీణ లేదా ప్రాకారంలేని నివాస ప్రదేశాలను సూచించే సహజ తెలుగు పదబంధం.
- source_word: וְ
  choice: మరియు/తో కలిపి
  rationale: పేర్ల మధ్య సముచ్చయాన్ని విరామచిహ్నాలతో, ముగింపు గణనలో సంబంధాన్ని సహజంగా ‘తో కలిపి’ అని వ్యక్తం చేశాం.
