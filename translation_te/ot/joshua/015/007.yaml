source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֥וּל דְּבִרָ/ה֮ מֵ/עֵ֣מֶק עָכוֹר֒ וְ/צָפ֜וֹנָ/ה פֹּנֶ֣ה אֶל הַ/גִּלְגָּ֗ל אֲשֶׁר נֹ֨כַח֙ לְ/מַעֲלֵ֣ה אֲדֻמִּ֔ים אֲשֶׁ֥ר מִ/נֶּ֖גֶב לַ/נָּ֑חַל וְ/עָבַ֤ר הַ/גְּבוּל֙ אֶל מֵי עֵ֣ין שֶׁ֔מֶשׁ וְ/הָי֥וּ תֹצְאֹתָ֖י/ו אֶל עֵ֥ין רֹגֵֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
translation:
  language: te
  text: ఆ సరిహద్దు ఆకోరు లోయనుండి దెబీరు వరకు పైకి వెళ్లి, వాగుకు[a] దక్షిణాన ఉన్న అదుమ్మీము ఎక్కుదలకు ఎదురుగా ఉన్న గిల్గాలు వైపు[b] ఉత్తరంగా తిరిగింది. అక్కడినుండి ఆ సరిహద్దు ఏన్‌షెమెషు జలాల వరకు సాగి, ఏన్‌రోగేలు వద్ద ముగిసింది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘వాగు’ అని అనువదించిన హీబ్రూ పదం కాలానుగుణంగా నీరు పారే వాగునో, దాని లోయనో సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘గిల్గాలు వరకు.’ హీబ్రూ పదబంధం ఆ స్థలం వైపు దిశనుగానీ, ఆ స్థలం వరకు గమనాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘దాని బయటికి వెళ్లే చోటులు’ అనే బహువచన రూపం ఉంది; సరిహద్దు వర్ణనలో అది సరిహద్దు ముగింపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל
  choice: ఆ సరిహద్దు ... పైకి వెళ్లి
  rationale: సరిహద్దును అనుసరిస్తూ భూభాగం ఎత్తుకు వెళ్లడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: דְּבִרָה
  choice: దెబీరు వరకు
  rationale: స్థలనామానికి జతైన దిశాసూచక ה ఆ స్థలం వైపు లేదా అక్కడికి గమనాన్ని సూచిస్తుంది; సరిహద్దు వర్ణనలో ‘వరకు’ సహజంగా ఉంటుంది.
- source_word: מֵעֵמֶק עָכוֹר
  choice: ఆకోరు లోయనుండి
  rationale: עֵמֶק అనే భౌగోళిక పదానికి ‘లోయ’ సరైన సమానార్థకం; స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: וְצָפוֹנָה פֹּנֶה
  choice: ఉత్తరంగా తిరిగింది
  rationale: సరిహద్దు రేఖ దిశ మారడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֶל הַגִּלְגָּל
  choice: గిల్గాలు వైపు
  rationale: אֶל గమ్యస్థానాన్నీ దాని వైపు దిశనూ సూచించగలదు; ఈ ఉపవాక్యంలో దిశాభిముఖతకు ‘వైపు’ సరిపోతుంది, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר נֹכַח לְמַעֲלֵה אֲדֻמִּים
  choice: అదుమ్మీము ఎక్కుదలకు ఎదురుగా ఉన్న
  rationale: נֹכַח అంటే ‘ఎదురుగా’; מַעֲלֵה ఎత్తైన దారిలో ఎక్కే ప్రదేశం లేదా ఎక్కుదలను సూచిస్తుంది. స్థలనామ స్వభావాన్ని కాపాడుతూ అర్థమయ్యే తెలుగు వాడాం.
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  choice: వాగుకు దక్షిణాన ఉన్న
  rationale: נֶגֶב ఇక్కడ దక్షిణ దిశను సూచిస్తుంది. נַחַל ఈ భూవర్ణనలో కాలానుగుణంగా నీరు పారే వాగు లేదా లోయను సూచించవచ్చు.
- source_word: וְעָבַר הַגְּבוּל
  choice: అక్కడినుండి ఆ సరిహద్దు ... సాగి
  rationale: సరిహద్దు తదుపరి గుర్తు వరకు వెళ్లడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; తప్పనిసరిగా ఏదో దాటిందనే భావాన్ని రుద్దదు.
- source_word: אֶל מֵי עֵין שֶׁמֶשׁ
  choice: ఏన్‌షెమెషు నీళ్ల దగ్గరకు
  rationale: מֵי అనే బహువచన నిర్మాణంలోని ‘నీళ్లు’ అనే భావాన్ని నిలిపి, స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  choice: ఏన్‌రోగేలు వద్ద ముగిసింది
  rationale: సరిహద్దు వర్ణనలో תֹצְאֹתָיו దాని ముగింపు లేదా చివరి బిందువును సూచిస్తుంది. హీబ్రూలో రూపం బహువచనమైనప్పటికీ తెలుగులో ఏకవచన క్రియ సహజం.
