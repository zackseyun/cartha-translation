  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన భౌగోళిక వర్ణనను వాడాం. స్థలనామాలను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం; ‘ఎక్కుదల,’ ‘వాగు,’ ‘సరిహద్దు’ వంటి పదాలతో మూలంలోని భూప్రకృతి భావాన్ని నిలిపాం.
