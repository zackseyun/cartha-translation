translation:
  language: te
  text: ఎక్రోను నుండి పడమటి వైపున[a], అష్డోదు పక్కన ఉన్నవన్నీ, వాటి గ్రామాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సముద్రం వైపున”; అంటే మధ్యధరా సముద్రం వైపుగా.
    reason: హీబ్రూ దిశాపదంలోని సముద్రసూచనను చూపిస్తూ, ప్రధాన పాఠంలోని ‘పడమటి’ అనే భౌగోళిక అర్థాన్ని వివరించడానికి.
lexical_decisions:
- source_word: יָמָּה
  choice: పడమటి వైపున
  rationale: అక్షరార్థంగా ‘సముద్రం వైపుగా’; ఇశ్రాయేలు భౌగోళిక సందర్భంలో మధ్యధరా సముద్రం పడమట ఉండడం వల్ల సహజమైన తెలుగు దిశాపదంతో అనువదించాం. మూల రూపకాన్ని పాదసూచికలో ఉంచాం.
- source_word: עַל יַד
  choice: పక్కన
  rationale: ఇక్కడ ‘చేతి దగ్గర’ అనే పదబంధం ప్రదేశసంబంధంగా ‘పక్కన/సమీపంలో’ అనే అర్థం ఇస్తుంది; ‘పక్కన’ మూలంలోని సాన్నిహిత్యాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כֹּל אֲשֶׁר
  choice: ఉన్నవన్నీ
  rationale: మూలంలోని సమగ్రతను నిలుపుతూ, స్పష్టంగా చెప్పని నామవాచకాన్ని తెలుగులో అనవసరంగా చేర్చకుండా ఉంచుతుంది.
- source_word: חַצְרֵיהֶן
  choice: వాటి గ్రామాలు
  rationale: חצרות ఇక్కడ ప్రధాన పట్టణాలకు అనుబంధమైన గ్రామాలు లేదా చిన్న నివాసాలను సూచిస్తుంది. స్త్రీలింగ బహువచన ప్రత్యయానికి ఉన్న పూర్వపద సంబంధాన్ని ‘వాటి’ అని సహజంగా, కొంత అస్పష్టతతోనే నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన భౌగోళిక జాబితా శైలిని పాటించాం. స్థలనామాలను ‘ఎక్రోను’, ‘అష్డోదు’గా లిప్యంతరీకరించాం; మూలంలో స్పష్టంగా లేని వస్తు/పట్టణ నామవాచకాన్ని చేర్చలేదు.
