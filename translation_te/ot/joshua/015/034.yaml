  terminology: స్థలనామాలను అర్థానువదించకుండా లిప్యంతరీకరించడం సరైనది. పాదసూచికలు ఏన్-గన్నీము, తప్పూహు, ఏనాము పేర్ల వ్యుత్పత్తి/లెక్సికల్ అవకాశాలను ప్రధాన పాఠ్యార్థంతో కలపకుండా వివరిస్తున్నాయి. “ఊట” ఇక్కడ עֵין‌కు తగిన సహజ తెలుగు పదం.
