source:
  edition: WLC
  text: וְ/זָנ֨וֹחַ֙ וְ/עֵ֣ין גַּנִּ֔ים תַּפּ֖וּחַ וְ/הָ/עֵינָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/034.yaml
  text: Zanoah[a], En-gannim, Tappuah[c][b], and Enam.
translation:
  language: te
  text: జానోహు, ఏన్-గన్నీము[a], తప్పూహు[b], ఏనాము[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఏన్-గన్నీము” అనే పేరుకు బహుశా “తోటల ఊట” అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: “తప్పూహు” ఒక స్థలనామం; దాని మూల హీబ్రూ పదం ఒక పండును లేదా పండ్ల చెట్టును కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “ఏనాము” ఒక స్థలనామం; హీబ్రూ రూపంలో నిర్దిష్ట ఉపపదం ఉంది కాబట్టి, దాని అర్థం “ఆ ఊటలు” అన్నట్లుగా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנוֹחַ
  choice: జానోహు
  rationale: పట్టణాల జాబితాలోని స్థలనామం కావడంతో అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: עֵין גַּנִּים
  choice: ఏన్-గన్నీము
  rationale: ‘ఊట’ అనే עֵין, ‘తోటలు’ అనే גַּנִּים కలిసిన స్థలనామం. ప్రధాన పాఠ్యంలో స్థలనామంగా లిప్యంతరీకరించి, దాని అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: תַּפּוּחַ
  choice: తప్పూహు
  rationale: ఈ సందర్భంలో ఇది స్థలనామం. మూలపదం ఒక పండును లేదా పండ్ల చెట్టును కూడా సూచించగలిగినా, ప్రధాన పాఠ్యంలో పేరుగానే లిప్యంతరీకరించబడింది.
- source_word: הָעֵינָם
  choice: ఏనాము
  rationale: హీబ్రూ రూపంలో నిర్దిష్ట ఉపపదం ఉన్న స్థలనామం. స్థిరమైన పేరుగా తీసుకొని, ఉపపదాన్ని విడిగా అనువదించకుండా లిప్యంతరీకరించాం.
