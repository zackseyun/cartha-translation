translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త పట్టణాల జాబితాగా నిలిపాం. హీబ్రూ స్థలనామాలను సహజమైన తెలుగు ధ్వన్యనుసారం లిప్యంతరీకరించాం; పేర్ల వ్యుత్పత్తి సంబంధిత సమాచారాన్ని పాదసూచికలకు పరిమితం చేశాం.
