  source_fidelity: హీబ్రూ పాఠంలోని నాలుగు స్థలనామాలు—זָנוֹחַ, עֵין גַּנִּים, תַּפּוּחַ, הָעֵינָם—అన్నీ సరైన క్రమంలో లిప్యంతరీకరించబడ్డాయి. జాబితా స్వరూపానికి తగినట్లుగా సంధి వావ్‌లను తెలుగులో విడిగా పునరావృతం చేయకుండా కామాలతో జాబితా చేయడం సహజం. הָעֵינָםలోని నిర్దిష్ట ఉపపదాన్ని ప్రధాన పాఠ్యంలో విడిగా చూపకపోవడం, దీనిని స్థిర స్థలనామంగా పరిగణించే ఆంగ్ల POB నిర్ణయానికి అనుగుణంగా ఉంది.
