source:
  edition: WLC
  text: וְ/חֻמְטָ֗ה וְ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥יא חֶבְר֖וֹן וְ/צִיעֹ֑ר עָרִ֥ים תֵּ֖שַׁע וְ/חַצְרֵי/הֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/054.yaml
  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
translation:
  language: te
  text: 'హుమ్తా, కిర్యత్-అర్బా—అదే హెబ్రోను[a]—జీయోరు: వాటి ఆవాసాలతో[b] కలిపి మొత్తం తొమ్మిది పట్టణాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కిర్యత్-అర్బా—అదే హెబ్రోను” అనే హీబ్రూ మాట, కిర్యత్-అర్బా అనే పూర్వనామం హెబ్రోనును సూచిస్తుందని గుర్తిస్తుంది.
    reason: cross_reference
  - marker: b
    text: లేదా “వాటి గ్రామాలతో.” హీబ్రూ పదం జాబితాలోని పట్టణాలకు అనుబంధంగా ఉన్న చిన్న నివాస ప్రాంతాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻמְטָה
  choice: హుమ్తా
  rationale: స్థలనామం కావున, దాని హీబ్రూ రూపాన్ని ఆధునిక తెలుగు లిపిలో ధ్వన్యనుకరణగా ఇచ్చాం.
- source_word: קִרְיַת אַרְבַּע
  choice: కిర్యత్-అర్బా
  rationale: ఇది స్థిరమైన సంయుక్త స్థలనామం; ‘అర్బా పట్టణం’ అని అర్థానువాదం చేయకుండా స్థలనామంగానే ధ్వన్యనుకరణ చేశాం.
- source_word: הִיא חֶבְרוֹן
  choice: అదే హెబ్రోను
  rationale: కిర్యత్-అర్బా అనే పూర్వనామం హెబ్రోనునే సూచిస్తుందని హీబ్రూ గుర్తింపు వాక్యం తెలియజేస్తుంది; సహజమైన తెలుగులో ఆ గుర్తింపును స్పష్టంగా ఉంచాం.
- source_word: צִיעֹר
  choice: జీయోరు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ఉచ్చారణకు తగినట్లు ధ్వన్యనుకరణ చేశాం.
- source_word: עָרִים תֵּשַׁע
  choice: మొత్తం తొమ్మిది పట్టణాలు
  rationale: עָרִים అనేది పట్టణాలు లేదా నగరాలు అనే విస్తృత అర్థం కలిగిన పదం; ఈ భూభాగ జాబితాలో సహజంగా ఉండే ‘పట్టణాలు’ను ఎంచుకున్నాం. ‘మొత్తం’ అనేది జాబితా గణనను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: חַצְרֵיהֶן
  choice: వాటి ఆవాసాలు
  rationale: ప్రధాన పట్టణాలకు అనుబంధంగా ఉన్న చిన్న నివాస ప్రాంతాలను సూచించే విస్తృత పదం; ‘గ్రామాలు’ అని అతిగా నిర్దిష్టం చేయకుండా ‘ఆవాసాలు’గా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూభాగాల జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. స్థలనామాలను అనువదించకుండా ధ్వన్యనుకరణ చేశాం; హెబ్రోను గుర్తింపును సహజమైన విరామచిహ్నాలతో చూపించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
