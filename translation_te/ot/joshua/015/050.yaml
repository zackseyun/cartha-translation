  rationale: పట్టణాల జాబితాలోని స్థలనామం కాబట్టి అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: אֶשְׁתְּמֹה
  choice: ఎష్తెమో
  rationale: హీబ్రూ వ్యంజన రూపాన్నీ చివరి హే అక్షరాన్నీ దృష్టిలో ఉంచుకొని స్థలనామాన్ని ‘ఎష్తెమో’గా లిప్యంతరీకరించాం; సంప్రదాయ రూపాంతరం ‘ఎష్తెమోవ’ కూడా వాడుకలో ఉంది.
- source_word: עָנִים
  choice: ఆనీములు
  rationale: ఇది బహువచన రూపంలో కనిపించే స్థలనామం. హీబ్రూ దీర్ఘ అచ్చులను ప్రతిబింబిస్తూ, తెలుగు బైబిలు పాఠకులకు సహజమైన నామరూపంగా ‘ఆనీములు’ను ఎంచుకున్నాం.
- source_word: וְ
  choice: మరియు/జాబితా విరామచిహ్నం
  rationale: స్థలనామాలను కలిపే హీబ్రూ సంధాయకాన్ని తెలుగులో జాబితా శైలికి అనుగుణంగా కామాలతో సూచించాం; చివరి పేరుకు ముందు ప్రత్యేకంగా ‘మరియు’ చేర్చకపోయినా సమన్వయ సంబంధం స్పష్టంగా ఉంటుంది.
