  text: 'and Shaaraim[a], and Adithaim, and Gederah, and Gederothaim: fourteen cities with their villages.'
translation:
  language: te
  text: షాఅరయీము[a], అదీతయీము, గెదేరా, గెదెరోతయీము—వాటి గ్రామాలతో కలిపి పద్నాలుగు పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలో పేర్కొన్న నాలుగు స్థలనామాలు, ఇక్కడ చెప్పిన ‘పద్నాలుగు పట్టణాలు’ అనే మొత్తానికి స్పష్టంగా సరిపోవని కొందరు వ్యాఖ్యాతలు గమనిస్తారు. ఈ వ్యత్యాసానికి ఈ విస్తృత భాగపు పాఠ చరిత్ర కారణమై ఉండవచ్చు; అయితే ఇక్కడ హెబ్రీ పాఠం ఉన్నట్లుగానే అనువదించబడింది.
    reason: textual_variant
lexical_decisions:
- source_word: שַׁעֲרַיִם
  choice: షారయీము
  rationale: స్థలనామాన్ని అనువదించకుండా, హెబ్రీ ఉచ్చారణను తెలుగు లిపిలో సాధ్యమైనంత దగ్గరగా లిప్యంతరీకరించాం.
- source_word: עֲדִיתַיִם
