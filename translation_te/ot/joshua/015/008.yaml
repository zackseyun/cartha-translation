source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֜וּל גֵּ֣י בֶן הִנֹּ֗ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ מִ/נֶּ֔גֶב הִ֖יא יְרֽוּשָׁלִָ֑ם וְ/עָלָ֨ה הַ/גְּב֜וּל אֶל רֹ֣אשׁ הָ/הָ֗ר אֲ֠שֶׁר עַל פְּנֵ֤י גֵֽי הִנֹּם֙ יָ֔מָּ/ה אֲשֶׁ֛ר בִּ/קְצֵ֥ה עֵֽמֶק רְפָאִ֖ים צָפֹֽנָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/008.yaml
  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
translation:
  language: te
  text: అప్పుడు సరిహద్దు బెన్‌హిన్నోము లోయను అనుసరించి యెబూసీయుని దక్షిణ కొండవాలుకు ఎక్కింది (అదే యెరూషలేము).[a] తరువాత సరిహద్దు హిన్నోము లోయకు పడమరగా, రెఫాయీము లోయ ఉత్తర చివర ఉన్న పర్వత శిఖరానికి ఎక్కింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘యెబూసీయుని భుజం’ అని ఉంది; ఇక్కడ అది భౌగోళికంగా కొండ పక్కభాగాన్ని లేదా వాలును సూచిస్తుంది. ‘అది యెరూషలేము’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: హీబ్రూలో ‘సముద్రం వైపు’ అని ఉంది; ఇది సాధారణంగా ‘పడమర వైపు’ అనే దిశను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: అప్పుడు ... ఎక్కింది / అక్కడి నుండి ... ఎక్కింది
  rationale: సరిహద్దు ప్రయాణాన్ని వరుసగా వివరించే సందర్భంలో עלה పైకి సాగడాన్ని సూచిస్తుంది. సహజమైన తెలుగు కథన ప్రవాహం కోసం మొదట ‘అప్పుడు’, రెండోసారి ‘అక్కడి నుండి’ వాడబడింది.
- source_word: הַגְּבוּל
  choice: సరిహద్దు
  rationale: భూభాగ కేటాయింపులో ఇది సరిహద్దు రేఖను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: גֵּי בֶן הִנֹּם
  choice: బెన్‌హిన్నోము లోయ
  rationale: స్థలనామ స్వభావాన్ని కాపాడటానికి ‘బెన్’ను లిప్యంతరీకరించి, גֵּי ని ‘లోయ’గా అనువదించాం.
- source_word: כֶּתֶף
  choice: కొండవాలు
  rationale: పదశః ‘భుజం’; భౌగోళిక వాడుకలో కొండ పక్కభాగం లేదా వాలును సూచిస్తుంది. ‘కొండవాలు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: הַיְבוּסִי
  choice: యెబూసీయుల
  rationale: హీబ్రూ ఏకవచన రూపం ఇక్కడ యెబూసీయులకు సంబంధించిన స్థలం లేదా కొండవాలును సూచిస్తుంది; తెలుగులో సంబంధార్థక బహువచన రూపం సహజంగా ఉంటుంది.
- source_word: מִנֶּגֶב
  choice: దక్షిణ భాగానికి
  rationale: ఈ భౌగోళిక సందర్భంలో యెబూసీయుల కొండవాలు దక్షిణ వైపున ఉన్న స్థానాన్ని సూచిస్తుంది.
- source_word: הִיא יְרוּשָׁלִָם
  choice: అదే యెరూషలేము
  rationale: హీబ్రూ సర్వనామం మరియు స్థలనామం కలిసి ముందు చెప్పిన యెబూసీయుల స్థలాన్ని యెరూషలేముగా గుర్తిస్తున్నాయి.
- source_word: רֹאשׁ הָהָר
  choice: పర్వత శిఖరం
  rationale: పదశః ‘పర్వతపు తల’; ‘పర్వత శిఖరం’ భావాన్ని సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר עַל פְּנֵי גֵי הִנֹּם יָמָּה
  choice: హిన్నోము లోయకు పడమరగా ... ఉన్న
  rationale: עַל־פְּנֵי స్థాన సంబంధాన్ని, יָמָּה సముద్రం వైపు అనే హీబ్రూ దిశా నుడికారంతో పడమరను సూచిస్తుంది.
- source_word: בִּקְצֵה עֵמֶק רְפָאִים צָפֹנָה
  choice: రెఫాయీయుల లోయ ఉత్తరపు చివరలో
  rationale: קצה అంచు లేదా చివరను, צפנה ఉత్తర దిశను సూచిస్తాయి. స్థల నిర్మాణాన్ని తెలుగులో స్పష్టంగా తెలిపే క్రమం ఎంచుకున్నాం.
- source_word: עֵמֶק רְפָאִים
  choice: రెఫాయీయుల లోయ
  rationale: ఇది స్థలనామం. רְפָאִים ను వ్యాఖ్యానాత్మకంగా మార్చకుండా సంప్రదాయ తెలుగు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: הִיא יְרוּשָׁלִָם లోని గుర్తింపు సంబంధం
  choice: ‘అదే యెరూషలేము’ అని ప్రధాన పాఠ్యంలో ప్రత్యక్ష గుర్తింపుగా ఉంచడం
  alternative: ‘అది యెరూషలేము’ లేదా ముందు పదమైన ‘యెబూసీయుడు’తో వ్యాకరణపరంగా మరింత అక్షరార్థ సంబంధం చూపడం
  rationale: మూల హీబ్రూ యెబూసీయుల స్థలం మరియు యెరూషలేము మధ్య గుర్తింపును స్పష్టంగా ఉంచుతుంది. దానిని సిద్ధాంతపరంగా విస్తరించకుండా భౌగోళిక గుర్తింపుగానే అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; భూగోళ వివరణ స్పష్టంగా ఉండేలా సహజ వాక్యక్రమం వాడబడింది. స్థలనామాలు లిప్యంతరీకరించబడ్డాయి; ‘కొండవాలు’, ‘పర్వత శిఖరం’ వంటి సాధారణంగా అర్థమయ్యే పదాలు ఎంచుకోబడ్డాయి. ప్రధాన పాఠ్యంలోని అన్ని పాదసూచిక గుర్తులు వాటి పాదసూచికలతో సరిపోలుతున్నాయి.
