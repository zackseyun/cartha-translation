    reason: lexical_alternative
  revision_rationale: The revision repairs the referential ambiguity created by the sentence division, while retaining the Hebrew’s unstated subject (‘ఇచ్చాడు’). It preserves the parenthetical identification of Arba as Anak’s father and renders Kiriath-arba/Hebron as the specific allotment. Footnote b is retained because it continues to document the lexical range of ‘father,’ though its anchor is not required in the revised running text; the explanatory phrase itself is present in the text.
