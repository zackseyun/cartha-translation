source:
  edition: WLC
  text: וּ/לְ/כָלֵ֣ב בֶּן יְפֻנֶּ֗ה נָ֤תַן חֵ֨לֶק֙ בְּ/ת֣וֹךְ בְּנֵֽי יְהוּדָ֔ה אֶל פִּ֥י יְהוָ֖ה לִֽ/יהוֹשֻׁ֑עַ אֶת קִרְיַ֥ת אַרְבַּ֛ע אֲבִ֥י הָ/עֲנָ֖ק הִ֥יא חֶבְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
translation:
  language: te
  text: యెఫున్నె కుమారుడైన కాలేబుకు యూదా వంశస్థుల మధ్య ఒక భాగాన్ని ఇచ్చాడు—యెహోషువకు యెహోవా ఇచ్చిన ఆజ్ఞ ప్రకారం[a]—అనాకు తండ్రియైన అర్బా యొక్క కిర్యత్-అర్బా, అంటే హెబ్రోను, అనే భాగాన్ని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవా మాట ప్రకారం.’ హీబ్రూ నుడికారానికి అక్షరార్థం ‘యెహోవా నోటి ప్రకారం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/כָלֵב בֶּן יְפֻנֶּה
  choice: యెఫున్నె కుమారుడైన కాలేబుకు
  rationale: సంబంధబోధక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు శైలిలో ఉంచుతూ వ్యక్తి పేర్లను లిప్యంతరీకరించింది.
- source_word: נָתַן חֵלֶק
  choice: ఒక భాగాన్ని ఇచ్చాడు
  rationale: ఇచ్చాడు/కేటాయించాడు అనే భావాలలో, మూలంలోని సాధారణ ‘ఇవ్వడం’ క్రియను కాపాడే పారదర్శకమైన రూపం.
- source_word: בְּתוֹךְ בְּנֵי יְהוּדָה
  choice: యూదా వంశస్థుల మధ్య
  rationale: అక్షరార్థమైన ‘యూదా కుమారులు’కన్నా గోత్రసంబంధ అర్థాన్ని సాధారణ తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל פִּי יְהוָה לִיהוֹשֻׁעַ
  choice: యెహోషువకు యెహోవా ఇచ్చిన ఆజ్ఞ ప్రకారం
  rationale: ‘యెహోవా నోటి ప్రకారం’ అనే హీబ్రూ నుడికారానికి సందర్భానుగుణమైన సహజ తెలుగు; ఆ ఆజ్ఞ యెహోషువకు వచ్చిందనే సంబంధాన్ని నిలుపుతుంది.
- source_word: קִרְיַת אַרְבַּע
  choice: కిర్యత్-అర్బా
  rationale: స్థలనామాన్ని అనువదించకుండా గుర్తించదగిన విధంగా లిప్యంతరీకరించింది.
- source_word: אֲבִי הָעֲנָק
  choice: అర్బా అనాకు తండ్రి
  rationale: ‘తండ్రి’ అనే మూల పదానికి పారదర్శకమైన సమానార్థాన్ని ఉంచి, అది కిర్యత్-అర్బాను కాక అర్బాను సూచిస్తుందని కుండలీకరణతో స్పష్టం చేసింది.
- source_word: הִיא חֶבְרוֹן
  choice: అంటే హెబ్రోను
  rationale: రెండు స్థలనామాల గుర్తింపును సహజమైన తెలుగు సమానార్థక వివరణగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఇచ్చాడు’ అనే క్రియకు కర్త ఎవరు?
  choice: తెలుగులో కర్తను పేరుతో స్పష్టం చేయకుండా ‘ఇచ్చాడు’ అని ఉంచడం
  alternative: ‘యెహోషువ ఇచ్చాడు’ లేదా ‘యెహోవా ఇచ్చాడు’ అని కర్తను స్పష్టం చేయడం
  rationale: హీబ్రూ వాక్యంలో కర్త ప్రత్యక్షంగా పేర్కొనబడలేదు. యెహోషువ లేదా యెహోవా అని చేర్చడం మూలంలోని అస్పష్టతను అనవసరంగా పరిష్కరిస్తుంది; తెలుగు క్రియారూపం మూలంలోని పురుష ఏకవచన భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. దైవనామం יהוה ను బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించింది. మూలంలోని కర్త అస్పష్టతను కాపాడింది.
