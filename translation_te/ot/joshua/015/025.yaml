    text: חֲדַתָּהను సంయుక్త పేరులోని భాగంగా కాక ప్రత్యేక పట్టణం పేరుగా తీసుకుంటే, “హాసోరు, హదత్తా, కెరీయోతు-హెస్రోను (అంటే హాసోరు)” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “కెరీయోతు” అనే స్థలనామాన్ని “కిర్యోతు” అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/חָצוֹר חֲדַתָּה
  choice: హాసోరు-హదత్తా
  rationale: పట్టణాల జాబితాలో మాసొరా స్వరఘాతాల ప్రకారం חֲדַתָּהను חָצוֹרతో కలిసిన సంయుక్త స్థలనామంగా తీసుకుని, అర్థానువాదం చేయకుండా తెలుగు లిప్యంతరీకరణ ఇచ్చాం.
- source_word: וּ/קְרִיּוֹת
  choice: కెరీయోతు
  rationale: ఈ సందర్భంలో ‘పట్టణాలు’ అనే సామాన్య నామవాచకంగా కాక స్థలనామంగా గ్రహించి లిప్యంతరీకరించాం.
- source_word: חֶצְרוֹן
  choice: -హెస్రోను
  rationale: ముందున్న కెరీయోతుతో కలిసి సంయుక్త స్థలనామంగా ఉండటాన్ని సూచించేందుకు హైఫన్‌తో కలిపాం.
- source_word: הִיא
  choice: అంటే
  rationale: ముందున్న స్థలాన్ని మరో పేరుతో గుర్తించే వివరణాత్మక సమానాధికార సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: חָצוֹר
  choice: హాసోరు
  rationale: చివరి గుర్తింపు స్థలనామాన్ని మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా, ముందటి రూపంతో ఏకరీతిగా లిప్యంతరీకరించాం.
