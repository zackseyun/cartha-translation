lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: అరణ్య ప్రాంతంలో
  rationale: בַּ־ అనే ఉపసర్గ, నిర్దిష్ట పదంతో కలిసి, తరువాత పేర్కొన్న పట్టణాలు ఉన్న భౌగోళిక ఉపప్రాంతాన్ని సూచిస్తుంది. యూదా ప్రాంత సందర్భంలో מִדְבָּר అనేది తప్పనిసరిగా ఇసుక ఎడారి కాకుండా, జనావాసం తక్కువగా ఉన్న పొడి అరణ్య భూభాగాన్ని సూచించగలదు; అందువల్ల ‘అరణ్య ప్రాంతంలో’ సహజంగానూ స్పష్టంగానూ ఉంది.
- source_word: בֵּית הָעֲרָבָה
  choice: బేత్-హారాబా
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది. నిర్మాణ సంబంధాన్ని చూపే הָעֲרָבָה లోని నిర్దిష్ట ఉపపదం పేరులో భాగంగా ‘హా’ ద్వారా నిలుపబడింది.
- source_word: מִדִּין
  choice: మిద్దీన్
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం; דּ లోని ద్విత్వ ధ్వనిని ‘ద్ద’తో, దీర్ఘ స్వరాన్ని ‘ఈ’తో సూచించాం.
- source_word: וּסְכָכָה
  choice: సెఖాఖా
  rationale: וּ సంధికారకాన్ని తెలుగులో జాబితా నిర్మాణం ద్వారా సహజంగా వ్యక్తం చేశాం. స్థలనామంలోని כ ధ్వనులను ‘ఖ’తో సూచిస్తూ పేరును లిప్యంతరీకరించాం.
