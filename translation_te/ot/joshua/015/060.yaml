  text: קִרְיַת בַּ֗עַל הִ֛יא קִרְיַ֥ת יְעָרִ֖ים וְ/הָֽ/רַבָּ֑ה עָרִ֥ים שְׁתַּ֖יִם וְ/חַצְרֵי/הֶֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/060.yaml
  text: 'Kiriath-baal (that is[a], Kiriath-jearim), and Rabbah: two cities with their settlements.'
translation:
  language: te
  text: కిర్యత్-బయలు (అంటే కిర్యత్-యెయారీము), రబ్బా—వాటి పల్లెలతో కలిపి రెండు పట్టణాలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వాటి అనుబంధ నివాసాలతో కలిపి.’ హీబ్రూ పదం పేర్కొన్న పట్టణాలకు అనుబంధంగా ఉన్న చిన్న నివాస ప్రాంతాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְיַת בַּעַל
  choice: కిర్యత్-బయలు
  rationale: ఇది స్థల నామం కాబట్టి అర్థానువాదం చేయకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: הִיא
  choice: అంటే
  rationale: ఈ సర్వనామం ఇక్కడ ముందు చెప్పిన స్థలానికి మరో పేరును వివరణాత్మకంగా గుర్తిస్తుంది; ఆధునిక తెలుగులో ‘అంటే’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: קִרְיַת יְעָרִים
  choice: కిర్యత్-యెయారీము
  rationale: కిర్యత్-బయలుకు ప్రత్యామ్నాయంగా ఇచ్చిన స్థల నామం కావడంతో లిప్యంతరీకరించబడింది.
- source_word: הָרַבָּה
  choice: రబ్బా
  rationale: హీబ్రూలో ఉపపదం ఉన్నప్పటికీ ఇది స్థల నామం; తెలుగులో పేరును సహజంగా ‘రబ్బా’ అని ఇచ్చాం.
- source_word: עָרִים שְׁתַּיִם
  choice: రెండు పట్టణాలు
  rationale: జాబితాలో పేర్కొన్న రెండు ప్రధాన నివాస ప్రాంతాల మొత్తాన్ని సూచిస్తుంది; ఆధునిక సందర్భంలో ‘పట్టణాలు’ సహజమైన పదం.
- source_word: חַצְרֵיהֶן
  choice: వాటి పల్లెలు
  rationale: ప్రధాన పట్టణాలకు అనుబంధంగా ఉన్న చిన్న నివాస ప్రాంతాలను సూచించే పదం; ‘పల్లెలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూభాగాల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. స్థల నామాలు అనువదించకుండా లిప్యంతరీకరించబడ్డాయి; వాక్య నిర్మాణం సహజంగా ఉండేందుకు మొత్తం సంఖ్య చివర ఉంచబడింది.
