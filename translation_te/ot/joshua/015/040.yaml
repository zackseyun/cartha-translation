lexical_decisions:
- source_word: כַבּוֹן
  choice: కబ్బోను
  rationale: ఇది పట్టణాల జాబితాలోని స్థలనామం. హీబ్రూ వ్యంజనాలు, అచ్చులను అనుసరించి తెలుగులో సహజంగా ఉచ్చరించగల రూపంలో లిప్యంతరీకరించబడింది; మధ్యలోని ద్విత్వ బ ధ్వని నిలుపబడింది.
- source_word: לַחְמָס
  choice: లహ్మాసు
  rationale: ఇది స్థలనామం. ח ధ్వనికి తెలుగులో ఖచ్చితమైన సమానం లేకపోవడంతో, సాధారణ పాఠకులకు పలకడానికి సులభమైన ‘హ’ను ఉపయోగించి లిప్యంతరీకరించబడింది.
- source_word: כִתְלִישׁ
  choice: కిత్లీషు
  rationale: ఇది స్థలనామం. హీబ్రూ כִתְלִישׁ ధ్వనిరూపాన్ని అనుసరించి ‘కిత్లీషు’గా లిప్యంతరీకరించబడింది.
- source_word: וְ
  choice: మరియు అనే భావం; జాబితాలో విరామచిహ్నాలతో వ్యక్తీకరణ
  rationale: హీబ్రూలో ప్రతి పేరుకు ముందు ఉన్న సంధాయక అవ్యయం సమన్వయ జాబితాను రూపొందిస్తుంది. సహజమైన తెలుగు పట్టణాల జాబితాలో కామాలతోనే ఆ అనుసంధానం స్పష్టమవుతుంది; చివర ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
