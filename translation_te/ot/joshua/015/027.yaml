lexical_decisions:
- source_word: חֲצַר גַּדָּה
  choice: హజర్-గద్దా
  rationale: యూదా ప్రాంతంలోని స్థలపేరు కాబట్టి అర్థానువాదం చేయకుండా ఆధునిక తెలుగు లిపిలో ధ్వన్యనుకరణగా ఇచ్చాం. సంయుక్త స్థలనామంలోని రెండు భాగాలను సూచించడానికి హైఫన్ వాడాం.
- source_word: חֶשְׁמוֹן
  choice: హెష్మోను
  rationale: ఇది స్థలపేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా చదవగల రూపంలో ధ్వన్యనుకరణ చేశాం.
- source_word: בֵּית פָּלֶט
  choice: బేత్-పెలెతు
  rationale: సంయుక్త స్థలపేరుగా ధ్వన్యనుకరణ చేశాం. בֵּית అనే భాగాన్ని ‘ఇల్లు’ అని అర్థానువాదం చేయకుండా పేరులో భాగంగానే ఉంచి, సంయుక్త రూపాన్ని హైఫన్‌తో చూపించాం.
- source_word: וְ / וּ
  choice: జాబితా విరామచిహ్నాలు
  rationale: హీబ్రూలో ప్రతి పేరును కలిపే సంధులను, ఆధునిక తెలుగు స్థలాల జాబితాలో సహజంగా ఉండే కామాలతో సూచించాం; చివర పూర్తి విరామం ఉంచాం.
