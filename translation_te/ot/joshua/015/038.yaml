lexical_decisions:
- source_word: דִלְעָן
  choice: దిలాన్
  rationale: యూదా ప్రాంతంలోని పట్టణాల జాబితాలో ఇది స్థలనామం. మసొరెటిక్ స్వరరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: הַמִּצְפֶּה
  choice: మిస్పే
  rationale: ఈ రూపంలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, పట్టణాల జాబితాలో ఇది స్థిరమైన స్థలనామంగా పనిచేస్తోంది. అందువల్ల ‘కావలిగోపురం’ అని అర్థానువాదం చేయకుండా స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: יָקְתְאֵל
  choice: యొక్తెయేల్
  rationale: ఇది స్థలనామం; హీబ్రూ ఉచ్చారణ భాగాలను స్పష్టంగా ప్రతిబింబించేలా తెలుగులో లిప్యంతరీకరించబడింది.
