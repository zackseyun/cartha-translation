source:
  edition: WLC
  text: וַ/יִּֽהְי֣וּ הֶ/עָרִ֗ים מִ/קְצֵה֙ לְ/מַטֵּ֣ה בְנֵֽי יְהוּדָ֔ה אֶל גְּב֥וּל אֱד֖וֹם בַּ/נֶּ֑גְבָּ/ה קַבְצְאֵ֥ל וְ/עֵ֖דֶר וְ/יָגֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/021.yaml
  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
translation:
  language: te
  text: 'యూదా వంశస్థుల గోత్రపు[a] చివరి అంచున, ఎదోము సరిహద్దు వైపున, నెగెవు ప్రాంతంలో[b] ఉన్న పట్టణాలు ఇవి: కబ్జెయేలు, ఏదెరు, యాగూరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యూదా వంశస్థుల గోత్రపు చివర నుండి’ అని కూడా అనువదించవచ్చు. ఈ మాటలు యూదా భూభాగపు వెలుపలి అంచును సూచిస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘నెగెవు’ను ‘దక్షిణం’ లేదా ‘దక్షిణ ప్రాంతం’ అని కూడా అనువదించవచ్చు. ఇక్కడ అది యూదా యొక్క నిర్దిష్ట దక్షిణ ప్రాంతాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הֶעָרִים
  choice: పట్టణాలు ఇవి
  rationale: హీబ్రూ వాక్యం పట్టణాల జాబితాను పరిచయం చేస్తుంది; తెలుగులో జాబితాకు ముందు ‘ఇవి’ అనడం సహజంగా ఉంటుంది.
- source_word: מִקְצֵה לְמַטֵּה בְנֵי יְהוּדָה
  choice: యూదా వంశస్థుల గోత్రానికి చెందిన ... చివరగా ఉన్న
  rationale: מִקְצֵה యొక్క సరిహద్దు లేదా వెలుపలి అంచు భావాన్ని ‘చివరగా ఉన్న’ ద్వారా వ్యక్తం చేశాం; בְנֵי יְהוּדָה ఇక్కడ గోత్రసంబంధమైన సంప్రదాయ పదబంధం.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: ఎదోము సరిహద్దు వైపున
  rationale: אֶל సూచించే దిశాభావాన్ని నిలుపుతూ, పట్టణాలు సరిహద్దుపైనే ఉన్నాయని అవసరానికి మించి నిర్ధారించదు.
- source_word: בַּנֶּגְבָּה
  choice: దక్షిణ ప్రాంతంలో
  rationale: נֶגֶב ఇక్కడ యూదా భూభాగంలోని నిర్దిష్ట దక్షిణ ప్రాంతాన్ని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే భౌగోళిక వ్యక్తీకరణను ఎంచుకున్నాం.
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  choice: కబ్సెయేలు, ఏదెరు, యాగూరు
  rationale: హీబ్రూ స్థలనామాల ధ్వనులను తెలుగు లిపిలో సాధ్యమైనంత దగ్గరగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భౌగోళిక జాబితాకు తగిన సరళమైన గంభీర శైలి వాడబడింది. ‘నెగెవు’ అని కేవలం లిప్యంతరీకరించకుండా దాని ప్రాంతీయ భావాన్ని ‘దక్షిణ ప్రాంతం’గా స్పష్టం చేశాం.
