  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/020.yaml
  text: This was the inheritance of the tribe of the sons of Judah according to their clans[a].
translation:
  language: te
  text: ఇది యూదా సంతతివారి గోత్రానికి వచ్చిన స్వాస్థ్యం, వారి వంశాల ప్రకారం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది యూదా సంతతివారి గోత్రానికి వారి వంశాల ప్రకారం ఉన్న స్వాస్థ్యం.”
    reason: హీబ్రూ నామవాక్యంలో కాలాన్ని తెలిపే క్రియ లేదు; కాబట్టి సందర్భానుసారంగా గతకాల సారాంశంగానో, వర్తమాన గుర్తింపుగానో అనువదించవచ్చు.
lexical_decisions:
- source_word: זֹאת
  choice: ఇది
  rationale: హీబ్రూ స్త్రీలింగ ఏకవచన సూచనార్థక పదం ఇంతకుముందు వివరించిన భూభాగాన్ని సూచిస్తుంది. హీబ్రూలో కాలాన్ని తెలిపే క్రియ లేకపోవడంతో తెలుగు వాక్యంలో సహజంగా ‘ఇది’ అని ఉంచి, ‘వచ్చిన’ ద్వారా సందర్భంలోని గతకాల భావాన్ని తెలిపాం.
- source_word: נַחֲלַת
  choice: స్వాస్థ్యం
  rationale: భూవిభజన సందర్భంలో వారసత్వంగా లేదా కేటాయింపుగా లభించిన భూసంపద అనే భావాన్ని ‘స్వాస్థ్యం’ సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: ఇక్కడ మַטֶּה యొక్క సందర్భార్థం ‘గోత్రం’; ‘కర్ర’ అనే మూలార్థం ఉద్దేశించబడలేదు.
- source_word: בְנֵי יְהוּדָה
  choice: యూదా సంతతివారు
  rationale: అక్షరార్థమైన ‘యూదా కుమారులు’ కంటే ఆధునిక తెలుగులో సహజంగా ఉండి, యూదా నుంచి వచ్చిన గోత్రీయ వంశసంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: మִשְׁפָּחָה ఇక్కడ గోత్రంలోని ఉపవంశ లేదా కులగుంపులను సూచిస్తుంది; לְ విభజనాత్మకంగా ‘ప్రకారం’ అనే భావాన్ని ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. భూవిభజనకు సంబంధించిన బైబిలీయ భావాన్ని నిలుపుతూ ‘స్వాస్థ్యం’, ‘గోత్రం’, ‘వంశాలు’ అనే పదాలను ఉపయోగించాం; హీబ్రూ నామవాక్యంలోని కాల అస్పష్టతను పాదటిప్పణిలో సంరక్షించాం.
