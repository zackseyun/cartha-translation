base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/047.yaml
  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
translation:
  language: te
  text: అష్డోదు, దాని అనుబంధ పట్టణాలు[a], దాని గ్రామాలు; గాజా, దాని అనుబంధ పట్టణాలు, దాని గ్రామాలు; ఐగుప్తు వాగు[b] వరకు, సముద్రం సరిహద్దుగా మరియు దాని తీరప్రాంతం వరకు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దాని కుమార్తెలు.’ ఇక్కడ ఇది ఒక ప్రధాన నగరానికి చెందిన అనుబంధ లేదా ఆధీన పట్టణాలను సూచించే హెబ్రీయ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ‘ఐగుప్తు వాడి’ అని కూడా అనువదించవచ్చు. హెబ్రీయ పదం కాలానుగుణంగా నీరు ప్రవహించే వాగు లేదా లోయను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: అంటే మధ్యధరా సముద్రం. వాక్యాంతంలోని హెబ్రీయ పాఠం సంక్షిప్తంగా, కొంత క్లిష్టంగా ఉంది; అక్షరార్థంలో సముద్రం, సరిహద్దు, మరొక హద్దు అనే సూచనలు ఉన్నాయి. ఇక్కడ సముద్రమే సరిహద్దు, దాని తీరప్రాంతమూ ఆ పరిధిలో ఉందనే భావాన్ని అనుసరించాము.
    reason: textual_ambiguity
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: దాని అనుబంధ పట్టణాలు
  rationale: ప్రధాన నగరానికి చెందిన ఆధీన లేదా ఉపగ్రామ పట్టణాలను సూచించే హెబ్రీయ నుడికారాన్ని రూపకం కంటే అర్థస్పష్టతకు ప్రాధాన్యమిస్తూ సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: חֲצֵרֶיהָ
  choice: దాని గ్రామాలు
  rationale: ఈ భౌగోళిక సందర్భంలో పట్టణాలకన్నా చిన్న వెలుపలి నివాసాలను సూచిస్తుంది; ‘గ్రామాలు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: נַחַל מִצְרָיִם
  choice: ఐగుప్తు వాగు
  rationale: దక్షిణ సరిహద్దు గుర్తుగా ఉన్న స్థలనామ స్వభావాన్ని నిలుపుతూ, נחל సూచించగల ప్రవాహం లేదా కాలానుగుణ జలమార్గం రెండింటికీ తగిన సులభ పదాన్ని వాడింది.
- source_word: הַיָּם
  choice: సముద్రం
  rationale: మసొరా పాఠంలో ‘సముద్రం’ మాత్రమే ఉంది; భౌగోళికంగా ఇది మధ్యధరా సముద్రమని పాదటిప్పణిలో స్పష్టం చేసి, మూలపాఠాన్ని ప్రధాన వాక్యంలో అతిగా నిర్దిష్టం చేయలేదు.
- source_word: הַגְּבוּל וּגְבוּל
  choice: సరిహద్దుగా ఉన్న
  rationale: పాఠాంతం సంక్షిప్తంగా, కొంత క్లిష్టంగా ఉంది. సముద్రమే సరిహద్దుగా పనిచేస్తుందనే భావాన్ని సహజ తెలుగులో తెలిపి, పాఠభేద సంబంధిత అస్పష్టతను పాదటిప్పణిలో సూచించింది.
- source_word: עַד
  choice: వరకు
  rationale: ప్రాదేశిక విస్తృతి లేదా హద్దును తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: אַשְׁדּוֹד / עַזָּה
  choice: అష్డోదు / గాజా
  rationale: ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా స్థలనామాలను లిప్యంతరీకరించింది.
