  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన భౌగోళిక జాబితా శైలి. ‘అనుబంధ పట్టణాలు’ ద్వారా హెబ్రీయ నుడికార భావం స్పష్టమవుతుంది; మూలంలోని పునరుక్త నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడింది.
