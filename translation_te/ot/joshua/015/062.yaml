lexical_decisions:
- source_word: הַנִּבְשָׁן
  choice: నిబ్షాను
  rationale: ఇది స్థలనామం; హీబ్రూ నిర్దేశక ఉపపదాన్ని విడిగా చూపకుండా, పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עִיר הַמֶּלַח
  choice: ఉప్పు నగరం
  rationale: ‘ఉప్పు యొక్క నగరం’ అనే పారదర్శక నిర్మాణార్థాన్ని సహజమైన తెలుగు స్థలనామంగా అందించాం.
- source_word: עֵין גֶּדִי
  choice: ఏన్‌గెదీ
  rationale: స్థిరపడిన ప్రాచీన స్థలనామాన్ని దాని భాగాల అర్థాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: עָרִים שֵׁשׁ
  choice: మొత్తం ఆరు పట్టణాలు
  rationale: జాబితా ముగింపులోని సంఖ్యా సారాంశాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘మొత్తం’ చేర్చాం; עָרִים ను ‘పట్టణాలు’గా ఇచ్చాం.
- source_word: חַצְרֵיהֶן
  choice: వాటి పల్లెలు
  rationale: పేర్కొన్న పట్టణాలకు అనుబంధమైన చిన్న, సాధారణంగా ప్రాకారంలేని నివాస స్థలాలను సూచించే పదం; ‘పల్లెలు’ ఆధారిత నివాసాల భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְ
  choice: జాబితా విరామాలు; ‘తో కలిపి’
  rationale: హీబ్రూలో పునరావృతమయ్యే సంధులను తెలుగులో సహజమైన జాబితా నిర్మాణంతో అందించాం; చివరి సంబంధాన్ని ‘తో కలిపి’ అని స్పష్టం చేశాం.
