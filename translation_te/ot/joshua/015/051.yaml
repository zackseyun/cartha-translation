  text: గోషెన్, హోలోన్, గిలో—వాటి గ్రామాలతో కలిపి మొత్తం పదకొండు పట్టణాలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹשֶׁן
  choice: గోషెన్
  rationale: ఇది స్థలనామం; హీబ్రూ రూపాన్ని ఆధారంగా చేసుకొని తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: חֹלֹן
  choice: హోలోన్
  rationale: ఇది స్థలనామం; హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: גִלֹה
  choice: గిలో
  rationale: ఇది స్థలనామం; చివరి ה ఇక్కడ స్వరాన్ని సూచిస్తున్నందున సహజమైన తెలుగు రూపంగా ‘గిలో’ ఎంచుకోబడింది.
- source_word: עָרִים
  choice: పట్టణాలు
  rationale: యూదా ప్రాంతంలోని నివాస కేంద్రాల జాబితా సందర్భంలో ‘పట్టణాలు’ అనేది సహజమైన ఆధునిక తెలుగు పదం; ‘నగరాలు’ అనడం వాటి పరిమాణాన్ని అతిశయింపజేయవచ్చు.
- source_word: אַחַת עֶשְׂרֵה
  choice: పదకొండు
  rationale: హీబ్రూ సంఖ్యను సహజమైన తెలుగు సంఖ్యారూపంలో అందిస్తుంది.
- source_word: חַצְרֵיהֶן
  choice: వాటి గ్రామాలు
  rationale: ప్రధాన పట్టణాలకు అనుబంధంగా ఉన్న చిన్న, సాధారణంగా ప్రాకారాలు లేని నివాసాలను సూచిస్తుంది; ‘గ్రామాలు’ ఆధునిక పాఠకులకు స్పష్టమైన సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన భౌగోళిక జాబితా శైలిని నిలుపుకున్నాం. ‘వాటి గ్రామాలతో కలిపి’ అనే నిర్మాణం గ్రామాలు పదకొండు సంఖ్యలో భాగం కావని, పేర్కొన్న పట్టణాలకు అనుబంధమైనవని స్పష్టం చేస్తుంది.
