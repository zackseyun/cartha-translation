  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; ముందున్న וְ భావాన్ని తెలుగు జాబితా నిర్మాణంలో విరామచిహ్నంతో సహజంగా తెలిపాం.
