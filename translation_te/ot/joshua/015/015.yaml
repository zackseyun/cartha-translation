translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని ‘పైకి వెళ్లాడు’ అనే భౌగోళిక/సైనిక భావాన్ని అతిగా స్పష్టీకరించి ‘దాడి చేశాడు’ అని మార్చకుండా, ‘మీదికి వెళ్లాడు’గా ఉంచాం. పూర్వనామ సమాచారాన్ని కుండలీకరణల్లో నిలిపాం.
