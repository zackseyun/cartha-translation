translation:
  language: te
  text: అక్కడి నుండి అతడు దెబీరు నివాసులపైకి దండెత్తి వెళ్లాడు. (దెబీరు పూర్వపు పేరు కిర్యత్-సేఫెరు[a].)
  philosophy: optimal-equivalence
