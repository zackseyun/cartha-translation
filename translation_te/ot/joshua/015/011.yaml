source:
  edition: WLC
  text: וְ/יָצָ֨א הַ/גְּב֜וּל אֶל כֶּ֣תֶף עֶקְרוֹן֮ צָפוֹנָ/ה֒ וְ/תָאַ֤ר הַ/גְּבוּל֙ שִׁכְּר֔וֹנָ/ה וְ/עָבַ֥ר הַר הַֽ/בַּעֲלָ֖ה וְ/יָצָ֣א יַבְנְאֵ֑ל וְ/הָי֛וּ תֹּצְא֥וֹת הַ/גְּב֖וּל יָֽמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/011.yaml
  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
translation:
  language: te
  text: ఆ సరిహద్దు ఎక్రోను ఉత్తర పార్శ్వం వరకు సాగి[a], షిక్కెరోను వైపు తిరిగి[b], బయలా పర్వతాన్ని దాటి, యబ్నెయేలువరకు సాగింది. ఆ సరిహద్దు చివరలు సముద్రం వద్ద ఉన్నాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎక్రోను ఉత్తర భాగానికి”; హెబ్రీలో “ఎక్రోను పార్శ్వం” అనే పదబంధంతో ఉత్తర దిశను సూచించే రూపం కలిసి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ క్రియ సరిహద్దు రేఖ దిశ మారడాన్ని లేదా ఒక స్థలం వైపు వంపు తిరగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలో అక్షరార్థంగా, “సరిహద్దు చివరలు సముద్రం వైపున ఉన్నాయి.” ఇది పడమరనున్న మధ్యధరా సముద్రం వద్ద సరిహద్దు ముగిసిందని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: సాగి / చేరింది
  rationale: సరిహద్దు వర్ణనలో ఈ క్రియ రేఖ తదుపరి ప్రాంతానికి కొనసాగడాన్ని సూచిస్తుంది. తెలుగులో సందర్భానుసారంగా ‘సాగి’, ‘చేరింది’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: גְּבוּל
  choice: సరిహద్దు
  rationale: ప్రాంత విభజన సందర్భంలో ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, సహజమైన పదం.
- source_word: כֶּתֶף
  choice: పార్శ్వం
  rationale: మూలార్థం ‘భుజం’; భౌగోళిక వాడుకలో ఒక ప్రదేశపు పక్క లేదా వాలు అనే భావం. ‘పార్శ్వం’ ఆ స్థలరూపకాన్ని గౌరవప్రదమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: עֶקְרוֹן צָפוֹנָה
  choice: ఉత్తరం వైపున ఉన్న ఎక్రోను పార్శ్వం
  rationale: దిశాసూచక రూపం ఉత్తర దిశను సూచిస్తుంది; వాక్యనిర్మాణం ప్రకారం ఎక్రోను ఉత్తర పార్శ్వం అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: תָּאַר
  choice: వైపు తిరిగి
  rationale: సరిహద్దు రేఖ దిశ మారడాన్ని ఈ క్రియ సూచిస్తుంది. ‘తిరిగి’ అనేది అతిగా వ్యాఖ్యానించకుండా సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: שִׁכְּרוֹנָה
  choice: షిక్కెరోను
  rationale: స్థలనామాన్ని అనువదించకుండా హెబ్రీ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: עָבַר
  choice: దాటి
  rationale: ఒక భౌగోళిక స్థలాన్ని దాటుకుంటూ సరిహద్దు కొనసాగడాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַר הַבַּעֲלָה
  choice: బయల కొండ
  rationale: הַר ఎత్తైన భూభాగాన్ని సూచిస్తుంది; ఈ సందర్భంలో ‘కొండ’ సాధారణ పాఠకునికి సహజం. బయల అనేది స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: יַבְנְאֵל
  choice: యబ్నెయేలు
  rationale: స్థలనామాన్ని హెబ్రీ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: תֹּצְאוֹת
  choice: చివరలు
  rationale: సరిహద్దు ముగిసే అంచు లేదా ముగింపు బిందువులను సూచిస్తుంది; ‘చివరలు’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: יָמָּה
  choice: సముద్రం దగ్గర
  rationale: ఈ దిశాసూచక రూపానికి ‘సముద్రం వైపు’ లేదా ‘పడమర వైపు’ అనే భావం ఉండవచ్చు. ఇక్కడ సరిహద్దు చివరలను తెలిపే వాక్యంలో సముద్రం వద్ద ముగింపును సూచించేలా అనువదించాం.
