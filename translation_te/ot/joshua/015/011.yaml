translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూసరిహద్దు వర్ణనకు తగిన గౌరవప్రదమైన సరళ శైలి ఉపయోగించబడింది. హెబ్రీ వాక్యంలోని వరుస కదలికలు నిలుపుతూ, తెలుగులో సహజంగా చదవడానికి క్రియారూపాలు స్వల్పంగా వైవిధ్యపరచబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
