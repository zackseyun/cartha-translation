source:
  edition: WLC
  text: וְ/עָבַ֣ר עַצְמ֗וֹנָ/ה וְ/יָצָא֙ נַ֣חַל מִצְרַ֔יִם ו/היה תֹּצְא֥וֹת הַ/גְּב֖וּל יָ֑מָּ/ה זֶה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל נֶֽגֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/004.yaml
  text: Then it passed on to Azmon[a], and went out to the Brook of Egypt; and the boundary ended at the sea. This shall be your southern boundary.
translation:
  language: te
  text: అక్కడినుండి అది అత్స్మోను వరకు సాగుతుంది; ఐగుప్తు వాగు[a] వరకు చేరి, సముద్రం వద్ద ముగుస్తుంది. ఇదే మీ దక్షిణ సరిహద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఐగుప్తు వాడి.” హెబ్రీ నహల్ అనే పదం తరచుగా వర్షాకాలంలో ప్రవహించే వాగును లేదా ఎండిపోయిన వాగుపడగను సూచిస్తుంది. సంప్రదాయంగా “ఐగుప్తు నది” అని కూడా అనువదిస్తారు; అయితే ఈ సందర్భంలో అది నైలు నదిని సూచిస్తుందని అపార్థం కలగవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: అక్కడి నుండి అది ... సాగి
  rationale: సరిహద్దును వర్ణించే సందర్భంలో עבר సరిహద్దు రేఖ ఒక స్థలం నుండి మరొక స్థలానికి కొనసాగడాన్ని సూచిస్తుంది. ‘సాగి’ అనే పదం తప్పనిసరిగా ఏదో దాటిందనే భావాన్ని కలిగించకుండా ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది.
- source_word: עַצְמוֹנָה
  choice: అస్మోనుకు
  rationale: ఇది స్థలనామం. హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, దిశను సూచించే הָ స్థానార్థక ప్రత్యయ భావాన్ని తెలుగులో ‘-కు’తో వ్యక్తం చేశాం.
- source_word: וְיָצָא
  choice: వరకు వెళ్లి
  rationale: יצא యొక్క మూలభావం ‘బయలుదేరు/వెళ్లు’; సరిహద్దు వర్ణనలో అది ఒక గమ్యస్థానాన్ని చేరడాన్ని సూచిస్తుంది. తెలుగులో ‘వరకు వెళ్లి’ ఆ భౌగోళిక గమనాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נַחַל מִצְרַיִם
  choice: ఐగుప్తు వాగు
  rationale: נחל సాధారణంగా పెద్ద నదికన్నా కాలానుగుణంగా నీరు ప్రవహించే వాగు లేదా వాగు పాతను సూచిస్తుంది. ‘వాగు’ సహజమైన తెలుగు పదం; ‘నది’ అనడం వల్ల ఇది నైలు నది అనే అపార్థం కలగవచ్చు.
- source_word: וְהיה תֹּצְאוֹת הַגְּבוּל יָמָּה
  choice: సముద్రం దగ్గర ముగుస్తుంది
  rationale: תוצאות הגבול సరిహద్దు చివరను సూచిస్తుంది; ימה అంటే ‘సముద్రం వైపు/సముద్రం వద్ద.’ హెబ్రీ నుడికారాన్ని తెలుగులో సహజంగా, దాని ముగింపు భావాన్ని నిలుపుతూ అనువదించాం.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל נֶגֶב
  choice: ఇదే మీ దక్షిణ సరిహద్దు
  rationale: ఇక్కడ נגב ప్రాంతనామమైన ‘నెగెవు’ కంటే దిక్కును, అంటే దక్షిణాన్ని, సూచిస్తోంది. ఈ వాక్యం ముందటి సరిహద్దు వర్ణనను సంగ్రహిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. సరిహద్దు రేఖను నిర్జీవ ఏకవచనంగా సూచించే హెబ్రీ నిర్మాణాన్ని ‘అది’తో కొనసాగించాం. ‘సముద్రం’ అనే పదం మూలంలోని సాధారణ సూచనను నిలుపుతుంది; మధ్యధరా సముద్రం అని పాఠ్యంలో ప్రత్యేకంగా చేర్చలేదు.
