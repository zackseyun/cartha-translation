  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన చారిత్రక-వివరణాత్మక శైలి. మూలంలోని చీటి విధానం స్పష్టంగా నిలుపబడింది; సరిహద్దు వాక్యనిర్మాణం తెలుగులో సహజంగా ఉండేందుకు సూచితమైన ‘భూవంతు విస్తరించింది’ భావంతో రూపొందించబడింది.
