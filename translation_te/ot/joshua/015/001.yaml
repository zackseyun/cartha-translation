source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/גּוֹרָ֗ל לְ/מַטֵּ֛ה בְּנֵ֥י יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם אֶל גְּב֨וּל אֱד֧וֹם מִדְבַּר צִ֛ן נֶ֖גְבָּ/ה מִ/קְצֵ֥ה תֵימָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
translation:
  language: te
  text: యూదా సంతతివారి గోత్రానికి, వారి వంశాల ప్రకారం, చీటి ద్వారా కేటాయించబడిన వాటా ఎదోము సరిహద్దు వరకు, దక్షిణాన ఉన్న సీను అరణ్యం వరకు, దక్షిణపు అత్యంత అంచు నుండి ఉంది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘యూదా కుమారుల గోత్రానికి’; ఇక్కడ ఈ మాట యూదా గోత్రపు సంతతివారిని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: చివరి పదబంధాన్ని ‘దక్షిణపు అత్యంత అంచు నుండి’ అని అక్షరార్థంగా అనువదించవచ్చు. ‘దక్షిణం’ అనే పదాన్ని ‘తేమాను’ అనే స్థలనామంగా కూడా అర్థం చేసుకునే అవకాశం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: చీటి ద్వారా వచ్చిన వంతు ... విస్తరించింది
  rationale: భూమి పంపకంలో చీటి వేసే నిర్దిష్ట విధానాన్ని ‘చీటి’ నిలుపుతుంది; ఆ చీటి ద్వారా కేటాయించబడిన భూభాగాన్ని సహజమైన తెలుగులో ‘వంతు’ తెలియజేస్తుంది. సరిహద్దు వివరణతో వాక్యం సహజంగా కలవడానికి ‘విస్తరించింది’ ఉపయోగించబడింది.
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  choice: యూదా సంతతివారి గోత్రానికి
  rationale: ‘యూదా కుమారులు’ అనే హీబ్రూ బంధుత్వ ప్రయోగం ఇక్కడ యూదా గోత్రపు వారసులందరినీ సూచిస్తుంది. ఆధునిక తెలుగులో అపార్థం రాకుండా ‘సంతతివారు’ అని, מַטֶּהకు ‘గోత్రం’ అని అనువదించబడింది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: ఇక్కడ מִשְׁפָּחָה ఒక గోత్రంలోని ఉపవిభాగాన్ని సూచిస్తుంది. తెలుగు బైబిలు-చారిత్రక సందర్భంలో ‘వంశం’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: ఎదోము సరిహద్దు వరకు
  rationale: గְּבוּל యొక్క ప్రాదేశిక సరిహద్దు భావాన్ని, אֶל సూచించే గమ్య పరిమితిని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: מִדְבַּר צִן
  choice: సీను అరణ్యం
  rationale: מִדְבָּר జనావాసం తక్కువైన అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది; ‘అరణ్యం’ స్థిరమైన, సహజమైన భౌగోళిక పదం.
- source_word: נֶגְבָּה
  choice: దక్షిణాన
  rationale: ఈ రూపం ఇక్కడ దిశను సూచించే క్రియావిశేషణంగా ఉంది; దానిని ‘నెగెవు’ అనే ప్రాంతనామంగా మార్చకుండా దక్షిణ దిశ భావం నిలుపబడింది.
- source_word: מִקְצֵה תֵימָן
  choice: దక్షిణపు చివరి అంచు వరకు
  rationale: సందర్భంలో ఇది అత్యంత దక్షిణ సరిహద్దును సూచించడం సహజం. అయితే תֵימָןకు ‘తేమాను’ అనే స్థలనామ పఠనం లేదా మరింత శబ్దానుసారమైన రూపం సాధ్యమైనందున ఆ సందిగ్ధత పాదసూచికలో నిలుపబడింది.
