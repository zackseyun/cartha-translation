translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, స్థలనామాలను గౌరవప్రదమైన బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం. సంక్షిప్త జాబితా నిర్మాణాన్ని కాపాడుతూ, సంఖ్యా సారాంశాన్ని సహజమైన తెలుగు వాక్యక్రమంలో ఇచ్చాం.
