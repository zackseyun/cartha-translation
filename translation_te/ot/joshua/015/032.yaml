  text: and Lebaoth[a], Shilhim, Ain, and Rimmon—twenty-nine cities in all, with their villages.
translation:
  language: te
  text: లెబావోతు, షిల్హీము, అయీను, రిమ్మోను—మొత్తం ఇరవై తొమ్మిది పట్టణాలు, వాటి గ్రామాలతో సహా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “గ్రామాలు” అనే హీబ్రూ పదాన్ని “నివాస ప్రాంతాలు” లేదా “చిన్న పల్లెలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָאוֹת
  choice: లెబావోతు
  rationale: పట్టణాల జాబితాలోని స్థలనామం; అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించబడింది. జాబితా కొనసాగింపును తెలుగులో సహజమైన విరామచిహ్నాల ద్వారా వ్యక్తం చేసినందున ఆరంభ సంధాయకాన్ని విడిగా అనువదించలేదు.
- source_word: וְשִׁלְחִים
  choice: షిల్హీము
  rationale: స్థలనామంగా భావించి, హీబ్రూ రూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְעַיִן
  choice: అయీను
  rationale: ఈ పట్టణాల జాబితాలో ఇది ‘కన్ను/నీటిబుగ్గ’ అనే సామాన్య నామవాచకం కాక స్థలనామం; అందువల్ల లిప్యంతరీకరించాం.
- source_word: וְרִמּוֹן
  choice: రిమ్మోను
  rationale: సందర్భంలో ఇది ‘దానిమ్మ’ అనే సామాన్యార్థం కాక స్థలనామం; అందువల్ల లిప్యంతరీకరించాం.
- source_word: כָּל עָרִים
  choice: మొత్తం ... పట్టణాలు
  rationale: జాబితాలో పేర్కొన్న పట్టణాల మొత్తం సంఖ్యను తెలుగులో సహజంగా తెలియజేసే నిర్మాణం.
- source_word: עֶשְׂרִים וָתֵשַׁע
  choice: ఇరవై తొమ్మిది
  rationale: హీబ్రూ మూలంలోని సంఖ్యను నేరుగా, సహజమైన తెలుగు సంఖ్యారూపంలో ఇచ్చాం.
- source_word: וְחַצְרֵיהֶן
  choice: వాటి గ్రామాలతో కలిపి
  rationale: חָצֵר ఇలాంటి భూభాగ జాబితాల్లో ప్రధాన పట్టణాలకు అనుబంధమైన గ్రామాలు లేదా చిన్న నివాస ప్రాంతాలను సూచిస్తుంది; సాధారణ పాఠకునికి ‘గ్రామాలు’ సహజంగా అర్థమవుతుంది.
