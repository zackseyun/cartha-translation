  text: וְ/אֶת הַ/יְבוּסִי֙ יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם לֹֽא יוכלו בְנֵֽי יְהוּדָ֖ה לְ/הֽוֹרִישָׁ֑/ם וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
translation:
  language: te
  text: అయితే యెరూషలేములో నివసిస్తున్న యెబూసీయులను యూదా వంశస్థులు వెళ్లగొట్టలేకపోయారు. అందువల్ల యెబూసీయులు యూదా వంశస్థులతో కలిసి యెరూషలేములో ఈ దినం వరకు నివసిస్తూ వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘యెబూసీయుడు యూదా వంశస్థులతో/వారి మధ్య నివసించాడు’ అని ఉంది. ఇక్కడ ఏకవచన జాతినామం యెబూసీయుల ప్రజాసమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: అయితే
  rationale: ముందున్న భూభాగాల జాబితాకు భిన్నమైన ఒక మినహాయింపును ఈ సంధి పరిచయం చేస్తోంది; ఆధునిక తెలుగులో ‘అయితే’ ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַיְבוּסִי
  choice: యెబూసీయులను / యెబూసీయులు
  rationale: హీబ్రూలో ఏకవచన రూపంలో ఉన్నా ఇది సమూహార్థక జాతినామం; తెలుగులో ప్రజాసమూహాన్ని సూచించే బహువచనం సహజంగా ఉంటుంది.
- source_word: יוֹשְׁבֵי יְרוּשָׁלַם
  choice: యెరూషలేములో నివసిస్తున్న
  rationale: కర్తరి కృదంత నిర్మాణం యెబూసీయులను యెరూషలేము నివాసులుగా గుర్తిస్తుంది; తెలుగులో సంబంధార్థక క్రియారూపం సహజమైనది.
- source_word: לֹא יוכלו
  choice: వెళ్లగొట్టలేకపోయారు
  rationale: ఈ రూపం గత కథనంలోని అసమర్థతను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְנֵי יְהוּדָה
  choice: యూదా వంశస్థులు
  rationale: అక్షరార్థంగా ‘యూదా కుమారులు’ అయినా సందర్భంలో యూదా గోత్రానికి చెందిన వారందరినీ సూచిస్తుంది; ‘వంశస్థులు’ కుటుంబ-గోత్ర భావాన్ని కాపాడుతూ అపార్థాన్ని నివారిస్తుంది.
- source_word: לְהוֹרִישָׁם
  choice: వెళ్లగొట్టడం
  rationale: యుద్ధ-స్వాధీన సందర్భంలో హిఫీల్ రూపం అక్కడి నివాసులను వారి స్థలం నుంచి తొలగించడాన్ని సూచిస్తుంది; సాధారణ పాఠకుడికి ‘వెళ్లగొట్టు’ స్పష్టంగా ఉంటుంది.
- source_word: וַיֵּשֶׁב
  choice: నేటివరకు నివసిస్తున్నారు
  rationale: తర్వాత వచ్చే ‘నేటివరకు’ అనే కాలసూచనతో కలిసి, గతంలో మొదలై కథకుని కాలం వరకు కొనసాగిన నివాసాన్ని తెలుగులో వర్తమాన కొనసాగింపు రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: యూదా వంశస్థులతో కలిసి
  rationale: ఇక్కడ אֶת అసాధారణ నిర్మాణంలో సహనివాసాన్ని సూచిస్తుంది; ‘తో కలిసి’ ఆ సంబంధాన్ని స్పష్టపరుస్తుంది, అయితే ‘మధ్య’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: בִּירוּשָׁלַם
  choice: యెరూషలేములో
  rationale: స్థలార్థక రూపానికి నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: కథకుని కాలం వరకు పరిస్థితి కొనసాగిందని తెలిపే హీబ్రూ కాలసూత్రానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: בְנֵי יְהוּדָה అనే గోత్ర సంబంధ పదబంధం
  choice: యూదా వంశస్థులు
  alternative: యూదా కుమారులు / యూదా ప్రజలు
  rationale: ఇది కేవలం పురుషులను కాక యూదా గోత్ర సభ్యులను సమూహంగా సూచిస్తుంది. ‘వంశస్థులు’ మూలంలోని కుటుంబ-గోత్ర సంబంధాన్ని కాపాడి, ఆధునిక పాఠకుడికి స్పష్టతనిస్తుంది.
- issue: וַיֵּשֶׁב ... אֶת בְּנֵי יְהוּדָה అనే అసాధారణ నిర్మాణం
  choice: యెబూసీయులు యూదా వంశస్థులతో కలిసి ... నివసిస్తున్నారు
  alternative: యెబూసీయులు యూదా వంశస్థుల మధ్య ... నివసిస్తున్నారు
  rationale: సందర్భం సహనివాసాన్ని సూచిస్తుంది. ‘తో కలిసి’ సంబంధాన్ని అతిగా నిర్వచించకుండా సహజంగా తెలియజేస్తుంది; ‘మధ్య’ అనే నిజమైన భావసాధ్యతను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలిలో రూపొందించబడింది. ‘స్వాధీనంనుంచి తొలగించు’ వంటి సాంకేతిక పదబంధం బదులు సహజమైన ‘వెళ్లగొట్టు’ వాడబడింది. ప్రధాన వాక్యంలో ఉన్న [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
