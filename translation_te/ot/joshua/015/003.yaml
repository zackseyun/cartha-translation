translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన భౌగోళిక వర్ణన. వరుస క్రియలను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా అసమాపక క్రియలతో కూర్చి, చివరలో ‘తిరిగింది’తో ముగించబడింది.
