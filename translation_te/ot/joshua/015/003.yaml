source:
  edition: WLC
  text: וְ֠/יָצָא אֶל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה וְ/עָלָ֥ה מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/עָבַ֤ר חֶצְרוֹן֙ וְ/עָלָ֣ה אַדָּ֔רָ/ה וְ/נָסַ֖ב הַ/קַּרְקָֽעָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
translation:
  language: te
  text: అప్పుడు సరిహద్దు దక్షిణ దిశగా అక్రబ్బీము ఎక్కే కనుమ[a] వరకు వెళ్లి, సీను వైపు దాటి, దక్షిణం నుండి కాదేషు-బర్నేయ వరకు ఎక్కి, హెస్రోనును దాటి, అద్దారు వరకు ఎక్కి, కర్కా వైపు తిరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అక్రబ్బీము’ అనే పేరుకు బహుశా ‘తేళ్లు’ అని అర్థం; ఇక్కడ అది స్థలనామం కాబట్టి లిప్యంతరీకరించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: అప్పుడు సరిహద్దు ... వెళ్లి
  rationale: సరిహద్దు వర్ణనలో క్రియకు కర్తగా ముందటి సందర్భంలోని సరిహద్దును స్పష్టంగా చేర్చడం తెలుగులో సహజం; చలన రూపకాన్ని నిలుపుతుంది.
- source_word: אֶל מִנֶּגֶב
  choice: దక్షిణ దిశగా
  rationale: సరిహద్దు ప్రయాణ దిశను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: అక్రబ్బీము ఎక్కుడు మార్గం వరకు
  rationale: מַעֲלֶה సూచించే ఎత్తుకు ఎక్కే మార్గ భావాన్ని నిలుపుతూ, עַקְרַבִּיםను స్థలనామంగా లిప్యంతరీకరించింది.
- source_word: וְעָבַר צִנָה
  choice: సీను వైపు దాటి
  rationale: עבר యొక్క దాటి వెళ్లే చలనాన్ని, దిశాసూచక ה ఉన్న צִנָה భావాన్ని కలిపి వ్యక్తం చేస్తుంది.
- source_word: וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: దక్షిణం నుండి కాదేషు-బర్నేయ వరకు ఎక్కి
  rationale: మసొరేటిక్ పాఠంలోని מִן ‘నుండి’ అనే చలనారంభ భావాన్ని కాపాడి, దక్షిణం నుండి కాదేషు-బర్నేయ వైపు ఎక్కినట్లు అనువదిస్తుంది.
- source_word: וְעָבַר חֶצְרוֹן
  choice: హెస్రోనును దాటి
  rationale: సరిహద్దు హెస్రోను వద్దుగా లేదా దానిని దాటి సాగిన చలనాన్ని సంక్షిప్తంగా చూపుతుంది.
- source_word: וְעָלָה אַדָּרָה
  choice: అద్దారు వరకు ఎక్కి
  rationale: దిశాసూచక ה ను ‘వరకు’తో వ్యక్తం చేసి, స్థలనామాన్ని లిప్యంతరీకరించింది.
- source_word: וְנָסַב הַקַּרְקָעָה
  choice: కర్కా వైపు తిరిగింది
  rationale: נסב సూచించే సరిహద్దు మలుపును, దిశాసూచక రూపం సూచించే ‘వైపు’ భావాన్ని నిలుపుతుంది.
