translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. సైనిక సందర్భానికి ‘దాడిచేసి’, ‘స్వాధీనం చేసుకుని’ అనే సాధారణంగా అర్థమయ్యే పదాలను వాడింది. పేర్లు మూలభాషకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
