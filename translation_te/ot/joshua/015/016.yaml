  text: וַ/יֹּ֣אמֶר כָּלֵ֔ב אֲשֶׁר יַכֶּ֥ה אֶת קִרְיַת סֵ֖פֶר וּ/לְכָדָ֑/הּ וְ/נָתַ֥תִּי ל֛/וֹ אֶת עַכְסָ֥ה בִתִּ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/016.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
translation:
  language: te
  text: 'కాలేబు ఇలా అన్నాడు[a]: “కిర్యత్-సెఫెరుపై దాడిచేసి దాన్ని స్వాధీనం చేసుకునేవాడికి నా కుమార్తె అక్సాను భార్యగా ఇస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కిర్యత్-సెఫెరుపై దాడిచేసి దాన్ని స్వాధీనం చేసుకునే వాడెవడో, వాడికి…”
    reason: అషేర్ అనే సంబంధవాచక పదాన్ని ‘చేసేవాడికి’ అనే నిర్మాణంగానూ, ‘చేసే వాడెవడో’ అనే నిర్మాణంగానూ సహజంగా అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది; ‘అప్పుడు’ లేదా ‘కాబట్టి’ అనే అదనపు కాల/కారణ భావాన్ని బలవంతంగా చేర్చదు.
- source_word: כָּלֵב
  choice: కాలేబు
  rationale: వ్యక్తి పేరును తెలుగులో సాధారణంగా గుర్తుపట్టదగిన రూపంలో లిప్యంతరీకరించింది.
- source_word: אֲשֶׁר
  choice: …చేసేవాడికి
  rationale: నిర్దిష్టం కాని సంబంధవాచక భావాన్ని సహజమైన తెలుగు షరతు-సంబంధ నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: יַכֶּה
  choice: దాడిచేసి
  rationale: נכה హిఫీల్ రూపం ఇక్కడ పట్టణంపై సైనిక చర్యను సూచిస్తుంది. ‘కొట్టి’ అనేది తెలుగులో ఈ సందర్భంలో అసహజంగా ఉండవచ్చు; ‘ఓడించి’ అనడం పట్టణాన్ని జయించాడనే ఫలితాన్ని ముందుగానే కలిపేస్తుంది.
- source_word: אֶת קִרְיַת סֵפֶר
  choice: కిర్యత్-సెఫెరుపై
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, దాడి లక్ష్యాన్ని తెలుగులో సహజంగా సూచించడానికి ‘పై’ చేర్చింది.
- source_word: וּלְכָדָהּ
  choice: దాన్ని స్వాధీనం చేసుకుని
  rationale: לכד అనే సైనిక సందర్భంలోని ‘పట్టుకోవడం/వశపరచుకోవడం’ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; స్త్రీలింగ ప్రత్యయం పట్టణాన్నే సూచిస్తుందని ‘దాన్ని’ ద్వారా వ్యక్తమవుతుంది.
- source_word: וְנָתַתִּי לוֹ
  choice: …వాడికి … ఇస్తాను
  rationale: హీబ్రూ వాగ్దానాన్ని సహజమైన తెలుగు భవిష్యత్ రూపంలో, గ్రహీతను స్పష్టంగా ఉంచుతూ అందిస్తుంది.
- source_word: עַכְסָה
  choice: అక్సా
  rationale: వ్యక్తి పేరును మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: בִתִּי
  choice: నా కుమార్తె
  rationale: మూలంలోని బంధుత్వ సూచనను యథాతథంగా నిలుపుతుంది.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: వివాహానికి ఇచ్చే భావాన్ని సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలో లేని అదనపు స్వామ్యపదాన్ని చేర్చదు.
