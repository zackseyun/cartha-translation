  source_fidelity: మూల హీబ్రూ వాక్యంలోని కథన పరిచయం, నిర్దిష్టం కాని సంబంధవాచక సవాలు, పట్టణంపై సైనిక చర్య మరియు దానిని స్వాధీనం చేసుకోవడం, అలాగే కాలేబు తన కుమార్తెను భార్యగా ఇస్తాననే వాగ్దానం అన్నీ సరిగ్గా ప్రతిఫలించాయి. ‘దాడిచేసి’ అనేది יַכֶּה యొక్క సైనిక సందర్భానికి సహజమైన, మితమైన అనువాదం; ‘స్వాధీనం చేసుకుని’ וּלְכָדָהּ కు సరిపోతుంది.
