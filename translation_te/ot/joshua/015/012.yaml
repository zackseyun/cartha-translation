source:
  edition: WLC
  text: וּ/גְב֣וּל יָ֔ם הַ/יָּ֥מָּ/ה הַ/גָּד֖וֹל וּ/גְב֑וּל זֶ֠ה גְּב֧וּל בְּנֵֽי יְהוּדָ֛ה סָבִ֖יב לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
translation:
  language: te
  text: పడమటి సరిహద్దు మహాసముద్రం మరియు దాని తీరం.[a] వారి వంశాల ప్రకారం యూదా వంశస్థులకు చుట్టూ ఉన్న సరిహద్దు ఇదే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘మహా సముద్రం మరియు సరిహద్దు/తీరం.’ ఇది యూదా ప్రాంతానికి పడమటి సరిహద్దుగా ఉన్న మధ్యధరా సముద్రాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: ‘వారి కుటుంబాల ప్రకారం’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం గోత్రంలో ఉన్న వంశ లేదా కులగుంపులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל יָם
  choice: పడమటి సరిహద్దు
  rationale: ఇశ్రాయేలు భూభాగానికి సముద్రం పడమట ఉండడం వల్ల, సరిహద్దు వర్ణనల్లో יָם దిశాపరంగా ‘పడమటి వైపు’ అనే అర్థాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘పడమటి సరిహద్దు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַיָּמָּה הַגָּדוֹל
  choice: మహాసముద్రం వరకు
  rationale: దిశార్థక ప్రత్యయం ఉన్న הַיָּמָּה ‘సముద్రం వైపుకు/వరకు’ అని సూచిస్తుంది; הַגָּדוֹלతో కలిసి ఇది మధ్యధరా సముద్రానికి వాడిన ‘మహాసముద్రం’ అనే భౌగోళిక నామాన్ని సూచిస్తుంది.
- source_word: וּגְבוּל
  choice: ఆ సముద్రమే సరిహద్దుగా ఉంది
  rationale: మూలంలోని పునరుక్తమైన גְּבוּל సంక్షిప్త సమానాధికార నిర్మాణం. దాని భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూనే, సముద్రమే సరిహద్దు అనే మూల వాక్యపు బలాన్ని నిలుపుతుంది.
- source_word: בְּנֵי יְהוּדָה
  choice: యూదా వంశస్థులు
  rationale: పదశః ‘యూదా కుమారులు’ అయినా, ఈ భూవిభజన సందర్భంలో ఇది యూదా గోత్రానికి చెందిన వారిని సమష్టిగా సూచిస్తుంది. ‘వంశస్థులు’ ఆధునిక తెలుగులో ఆ వంశపరమైన భావాన్ని అపార్థం లేకుండా అందిస్తుంది.
- source_word: סָבִיב
  choice: చుట్టూ ఉన్న
  rationale: ఈ పదం యూదా భూభాగాన్ని అన్ని వైపులా చుట్టిన సరిహద్దుల సమగ్ర సంగ్రహాన్ని సూచిస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ గోత్రంలో ఉన్న వంశ లేదా కులగుంపులను సూచిస్తుంది. ‘వారి వారి వంశాల ప్రకారం’ విభజనకు సంబంధించిన לְ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: בְּנֵי יְהוּדָה అనే లింగసూచక గోత్రపదబంధం
  choice: యూదా వంశస్థులు
  alternative: యూదా కుమారులు
  rationale: హీబ్రూ రూపం పదశః పురుష బహువచనమైనప్పటికీ, సందర్భంలో అది యూదా గోత్ర సమాజాన్ని సమష్టిగా సూచించే స్థిర వంశపరమైన ప్రయోగం. ‘వంశస్థులు’ ఆ ప్రతినిధి భావాన్ని మార్చకుండా ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; ఇందులో ప్రత్యేక సిద్ధాంతపరమైన వ్యాఖ్యానం చేర్చబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూసరిహద్దుల వర్ణనకు తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. మూలంలోని సంక్షిప్త సరిహద్దు నిర్మాణాన్ని సహజ తెలుగు వాక్యక్రమంలో అందించగా, ‘సముద్రం’ మరియు ‘సరిహద్దు’ పునరుక్త భావం నిలుపబడింది.
