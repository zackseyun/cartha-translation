  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: te
  text: తూర్పు సరిహద్దు యొర్దాను నది ముఖద్వారం వరకు ఉప్పు సముద్రం. ఉత్తర వైపు సరిహద్దు యొర్దాను నది ముఖద్వారం వద్దనున్న సముద్రపు అఖాతం నుండి మొదలైంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָם הַמֶּלַח
  choice: ఉప్పు సముద్రం
  rationale: హీబ్రూ భౌగోళిక నామాన్ని అర్థస్పష్టంగా, సంప్రదాయానికి అనుగుణంగా అనువదిస్తుంది.
- source_word: קְצֵה הַיַּרְדֵּן
  choice: యొర్దాను నది ముఖద్వారం
  rationale: అక్షరార్థంగా ‘యొర్దాను చివర’ అయినప్పటికీ, ఈ భౌగోళిక సందర్భంలో యొర్దాను ఉప్పు సముద్రంలో కలిసే ముఖద్వారాన్ని సూచిస్తుంది.
- source_word: לְשׁוֹן הַיָּם
  choice: సముద్రపు అఖాతం
  rationale: అక్షరార్థమైన ‘సముద్రపు నాలుక’ ఇక్కడ భూభాగంలోకి చొచ్చుకొచ్చిన పొడవైన జలభాగాన్ని సూచించే భౌగోళిక రూపకం; సహజమైన ఆధునిక తెలుగులో ‘అఖాతం’ ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לִפְאַת צָפוֹנָה
  choice: ఉత్తర వైపు
  rationale: సరిహద్దు యొక్క ఉత్తర భాగాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూసరిహద్దుల వివరణకు తగిన సరళమైన గంభీర శైలి. హీబ్రూ వాక్యంలోని భౌగోళిక క్రమాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు రెండవ వాక్యంలో ‘మొదలైంది’ను స్పష్టీకరించాం.
