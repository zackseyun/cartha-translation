lexical_decisions:
- source_word: דַנָּה
  choice: దన్నా
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: קִרְיַת סַנָּה
  choice: కిర్యత్-సన్నా
  rationale: ఇది సంయుక్త స్థలనామం. దాని స్థలనామ స్వరూపాన్ని నిలుపుతూ రెండు భాగాలను హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, హైఫన్‌తో కలిపాం.
- source_word: הִיא
  choice: అదే
  rationale: ఇక్కడ ఒకే పట్టణానికి ఉన్న రెండు పేర్ల సమానత్వాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: דְבִר
  choice: దెబీరు
  rationale: కిర్యత్-సన్నాకు మరో పేరుగా ఇచ్చిన స్థలనామం; హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: וְ
  choice: జాబితా క్రమం ద్వారా వ్యక్తీకరించబడింది
  rationale: హీబ్రూలోని వావ్ నగరాల జాబితాను కొనసాగిస్తుంది. విడిగా ‘మరియు’ అని చేర్చడం కంటే తెలుగులో కామాతో జాబితాను కొనసాగించడం సహజంగా ఉంటుంది.
