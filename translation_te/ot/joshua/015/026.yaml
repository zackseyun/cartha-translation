lexical_decisions:
- source_word: אֲמָם
  choice: అమామ్
  rationale: పట్టణాల జాబితాలోని స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిపిలో రాయబడింది.
- source_word: וּ/שְׁמַע
  choice: షెమా
  rationale: ముందున్న וּ సంధర్భానుసారంగా జాబితాలోని అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ప్రతి పేరుకు ముందు ‘మరియు’ చేర్చడం అసహజంగా ఉండటంతో కామాలతో జాబితా నిర్మాణం నిలుపబడింది. స్థలనామం హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘షెమా’గా లిప్యంతరీకరించబడింది.
- source_word: וּ/מוֹלָדָה
  choice: మోలాదా
  rationale: స్థలనామం అనువదించకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది; చివరి ה ఇక్కడ ప్రత్యేక హల్లుగా వినిపించనందున ‘మోలాదా’ రూపం తీసుకోబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన స్థలనామాల జాబితాగా ఇచ్చాం. హీబ్రూలో రెండవ, మూడవ పేర్లకు ఉన్న అనుసంధాన అవ్యయాలను తెలుగులో సహజమైన కామా-జాబితా ద్వారా వ్యక్తం చేశాం; చివర ‘మరియు’ చేర్చితే మూలంలో లేని ప్రత్యేక విభజన భావం కలగవచ్చని దాన్ని నివారించాం.
