language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֤י לָ/הֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֖ה יָ֣ם הַ/מֶּ֑לַח מִן הַ/לָּשֹׁ֖ן הַ/פֹּנֶ֥ה נֶֽגְבָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/002.yaml
  text: Their southern border was from the end of the Salt Sea[b][a], from the tongue that faces southward.
translation:
  language: te
  text: వారి దక్షిణ సరిహద్దు ఉప్పు సముద్రం[b] చివర నుండి, దక్షిణం వైపునకు తిరిగిన నాలుక ఆకారపు అఖాతం[a] నుండి ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘నాలుక’; ఇక్కడ నాలుక ఆకారంలో ఉన్న అఖాతం లేదా సముద్రపు చొచ్చుకువచ్చిన భాగాన్ని సూచించే భౌగోళిక పదం.
    reason: lexical_alternative
  - marker: b
    text: అంటే మృత సముద్రం.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: వారి ... మొదలైంది
  rationale: సరిహద్దు వర్ణనను పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని తెలుగులో సహజమైన స్వామ్య, ఆరంభ నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: גְּבוּל נֶגֶב
  choice: దక్షిణ సరిహద్దు
  rationale: ఇక్కడ נֶגֶב ప్రాంతనామమైన నెగెవును కాక దక్షిణ దిశలోని సరిహద్దును సూచిస్తుంది.
- source_word: מִקְצֵה
  choice: చివర నుండి
  rationale: సరిహద్దు ప్రారంభమయ్యే భౌగోళిక అంత్యబిందువును స్పష్టంగా సూచిస్తుంది.
- source_word: יָם הַמֶּלַח
  choice: ఉప్పు సముద్రం
  rationale: హీబ్రూ మూలంలోని పేరును నేరుగా నిలుపుతుంది; ప్రాచుర్యంలో ఉన్న పేరును పాదటిప్పణిలో ఇస్తుంది.
- source_word: מִן הַלָּשׁוֹן
  choice: నాలుకలాంటి అఖాతం నుండి
  rationale: లాక్షణికంగా 'నాలుక' అనే మూలచిత్రాన్ని నిలుపుతూ, అది సూచించే నాలుక ఆకారపు జలభాగమని ఆధునిక తెలుగు పాఠకుడికి అర్థమయ్యేలా చేస్తుంది.
- source_word: הַפֹּנֶה נֶגְבָּה
  choice: దక్షిణం వైపు ఉన్న
  rationale: భౌగోళిక ఆకృతి దక్షిణ దిశగా తిరిగి లేదా విస్తరించి ఉండటాన్ని, అనవసరంగా ఒకే భౌతిక భావానికి పరిమితం చేయకుండా సహజంగా తెలియజేస్తుంది.
