translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన భౌగోళిక వర్ణన. మూలంలోని ‘నాలుక’ రూపకాన్ని వివరణాత్మక పదబంధంతో నిలిపి, ‘ఉప్పు సముద్రం’ అనే హీబ్రూ నామాన్ని ప్రధాన పాఠ్యంలో ఉంచింది.
