- from: వారి దక్షిణ సరిహద్దు ఉప్పు సముద్రపు దక్షిణపు చివర నుండి, దక్షిణం వైపు ఉన్న నాలుకలాంటి అఖాతం[a] నుండి మొదలైంది.[b]
  to: వారి దక్షిణ సరిహద్దు ఉప్పు సముద్రం[b] చివర నుండి, దక్షిణం వైపునకు తిరిగిన నాలుక ఆకారపు అఖాతం[a] నుండి ఉండేది.
  rationale: 'The revision restores the Hebrew syntax and scope: the boundary is described as extending from the end of the Salt Sea, specifically from the tongue-shaped inlet that turns or faces southward. It removes the unsupported implication that the boundary ''began'' and places the Dead Sea note at its proper anchor.'
