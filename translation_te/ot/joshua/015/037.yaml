  - severity: medium
    issue: The first place name is transliterated as “జెనాను.”
    rationale: The Hebrew spelling צְנָן has tsade, not zayin. For a Telugu translation reviewed directly against the Hebrew, “సెనాను” more closely represents the source consonant while retaining its status as a place name.
  - severity: low
