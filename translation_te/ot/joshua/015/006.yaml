language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָלָ֤ה הַ/גְּבוּל֙ בֵּ֣ית חָגְלָ֔ה וְ/עָבַ֕ר מִ/צְּפ֖וֹן לְ/בֵ֣ית הָעֲרָבָ֑ה וְ/עָלָ֣ה הַ/גְּב֔וּל אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
translation:
  language: te
  text: సరిహద్దు బేత్-హోగ్లాకు ఎగబాకి, బేత్-అరాబాకు ఉత్తరంగా సాగింది. ఆ సరిహద్దు రూబేను కుమారుడైన బోహాను యొక్క రాయి[a] దగ్గరికి ఎగబాకింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బోహాను రాయి.’
    reason: హీబ్రూ సంధి నిర్మాణం “బోహాను యొక్క రాయి” అని స్పష్టంగా అనువదించబడింది; సంక్షిప్త స్వామ్యరూపం కూడా సాధ్యమే.
lexical_decisions:
- source_word: וְעָלָה
  choice: ఎగబాకి / ఎగబాకింది
  rationale: సరిహద్దు వర్ణనలో ఈ క్రియ భూభాగపు ఎత్తువైపు లేదా పైదిశగా కొనసాగడాన్ని సూచిస్తుంది. ‘ఎగబాకింది’ ఆ భౌగోళిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַגְּבוּל
  choice: సరిహద్దు
  rationale: ఇక్కడ ఈ పదం మొత్తం భూభాగాన్ని కాక దాని హద్దురేఖను సూచిస్తుంది; ఆధునిక తెలుగులో ‘సరిహద్దు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: בֵּית חָגְלָה
  choice: బేత్-హోగ్లా
  rationale: స్థలనామాన్ని అనువదించకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְעָבַר מִצְּפוֹן לְבֵית הָעֲרָבָה
  choice: బేత్-అరాబాకు ఉత్తరంగా సాగింది
  rationale: సరిహద్దు ఆ స్థలానికి ఉత్తరంగా కొనసాగిందనే స్థానసంబంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘దాటింది’ అనడం ఒక నిర్దిష్ట రేఖను దాటిందనే అవసరం లేని భావాన్ని కలిగించవచ్చు.
- source_word: אֶבֶן בֹּהַן
  choice: బోహను రాయి
  rationale: హీబ్రూ సంధి నిర్మాణంలోని ‘బోహనుకు సంబంధించిన రాయి’ అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בֶּן רְאוּבֵן
  choice: రూబేను కుమారుడైన
  rationale: హీబ్రూలోని స్పష్టమైన ‘రూబేను కుమారుడు’ అనే మాటను ‘రూబేను వంశస్థుడు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భౌగోళిక సరిహద్దు వర్ణనకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘బోహను రాయి’ తరువాత ఉంచాం.
