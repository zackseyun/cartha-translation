  source_fidelity: 'The boundary sequence and directional sense are conveyed accurately: it goes up to Beth-hoglah, continues north of Beth-arabah, and goes up to Bohan''s stone. The personal name should be represented as బోహాను, and the possessive relationship of אֶבֶן בֹּהַן is best made explicit in Telugu.'
