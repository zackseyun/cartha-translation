lexical_decisions:
- source_word: מָעוֹן
  choice: మాయోను
  rationale: పట్టణాల జాబితాలో ఇది స్థలనామం; సాధారణ నామవాచకమైన ‘నివాసం’ అని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: כַּרְמֶל
  choice: కర్మెలు
  rationale: ఇక్కడ ఇది యూదా ప్రాంతంలోని పట్టణనామం; ‘ద్రాక్షతోట’ వంటి సాధారణ అర్థంతో అనువదించకుండా స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: וָזִיף
  choice: జీఫు
  rationale: ו సంధిని తెలుగు జాబితా నిర్మాణంలో విరామచిహ్నంతో సహజంగా సూచించి, זִיף అనే స్థలనామాన్ని ‘జీఫు’గా లిప్యంతరీకరించాం.
- source_word: וְיוּטָּה
  choice: యుట్టా
  rationale: ו సంధి జాబితాలో చివరి అంశాన్ని కలుపుతుంది; יוּטָּה అనే స్థలనామాన్ని మూల ఉచ్చారణకు దగ్గరగా ‘యుట్టా’గా లిప్యంతరీకరించాం.
