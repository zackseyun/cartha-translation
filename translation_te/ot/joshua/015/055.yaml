translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త పట్టణాల జాబితాగా ఉంచబడింది. స్థలనామాలను అనువదించకుండా, తెలుగు బైబిలు పాఠకులకు సహజంగా వినిపించే రూపాల్లో లిప్యంతరీకరించాం; మూలంలో ప్రతి పేరుకు ముందు ఉన్న సంధులను తెలుగులో అనవసరంగా పునరావృతం చేయలేదు.
