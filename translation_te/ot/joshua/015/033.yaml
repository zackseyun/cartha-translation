lexical_decisions:
- source_word: בַּשְּׁפֵלָה
  choice: దిగువ ప్రాంతంలో
  rationale: ఈ పదం యూదా కొండప్రాంతానికి పశ్చిమాన ఉన్న దిగువనాటి పాదభూముల ప్రాంతాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు భౌగోళిక భావం స్పష్టంగా ఉండేందుకు అర్థానువాదం వాడబడింది; ప్రాంతనామంగా ‘షెఫేలా’ అనేదీ సాధ్యమే.
- source_word: אֶשְׁתָּאוֹל
  choice: ఎష్తాయోలు
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో రాశాము.
- source_word: וְצָרְעָה
  choice: జొర్యా
  rationale: వావ్ సంధిని జాబితాలో సహజంగా సూచిస్తూ, స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో రాశాము.
- source_word: וְאַשְׁנָה
  choice: అష్నా
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో రాశాము; జాబితా చివరి అంశానికి ముందు సంధి తెలుగులో సహజంగా అవసరం లేకపోవడంతో కామాతో కలిపాము.
