lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: హజర్-షూవాల్
  rationale: పట్టణాల జాబితాలో ఉన్న స్థలనామం కావడంతో అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: בְּאֵר שֶׁבַע
  choice: బెయేర్-షెబా
  rationale: ప్రసిద్ధ స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; దానిలోని సాధ్యమైన పదప్రయోగాన్ని పాదసూచికలో ఉంచాం.
- source_word: בִּזְיוֹתְיָה
  choice: బిజ్యోత్యా
  rationale: వ్యుత్పత్తి అనిశ్చితమైన స్థలనామం కాబట్టి అనువదించకుండా హీబ్రూ ధ్వనులకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: וַ / וּ
  choice: కామాలతో కూడిన జాబితా
  rationale: హీబ్రూలో ప్రతి అంశాన్ని కలిపే సంధులను సహజమైన తెలుగు పట్టణాల జాబితాగా కామాలతో వ్యక్తం చేశాం.
