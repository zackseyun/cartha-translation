lexical_decisions:
- source_word: הַקַּיִן
  choice: హక్కయీను
  rationale: ఇది స్థల నామం. హీబ్రూ రూపంలోని ఉపపదాన్ని పేరులో భాగంగా ఉంచుతూ తెలుగులో ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: גִּבְעָה
  choice: గిబియా
  rationale: పట్టణాల జాబితాలో ఇది స్థల నామం; అందువల్ల ‘కొండ’ అనే పదార్థాన్ని అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: תִמְנָה
  choice: తిమ్నా
  rationale: ఇది భూభాగంలోని పట్టణ నామం కాబట్టి లిప్యంతరీకరణను వాడాం.
- source_word: עָרִים עֶשֶׂר
  choice: పది పట్టణాలు
  rationale: భూభాగాల జాబితాల్లోని సంఖ్యా సారాంశాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపే రూపం.
- source_word: חַצְרֵיהֶן
  choice: వాటి పల్లెలు
  rationale: పేర్కొన్న పట్టణాలకు అనుబంధంగా ఉన్న చిన్న నివాస ప్రాంతాలను సూచిస్తుంది; ‘పల్లెలు’ సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది.
