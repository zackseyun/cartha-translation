- from: గెదేరోతు, బేత్-దాగోను[a], నయమా, మక్కేదా—వాటి గ్రామాలతో కలిపి మొత్తం పదహారు పట్టణాలు.
  to: మరియు గెదేరోతు, బేత్-దాగోను[a], నయమా, మక్కేదా—వాటి గ్రామాలతో కూడిన పదహారు పట్టణాలు.
