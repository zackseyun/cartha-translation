source:
  edition: WLC
  text: וּ/גְדֵר֕וֹת בֵּית דָּג֥וֹן וְ/נַעֲמָ֖ה וּ/מַקֵּדָ֑ה עָרִ֥ים שֵׁשׁ עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/041.yaml
  text: 'and Gederoth[a], Beth-dagon, Naamah, and Makkedah: sixteen cities with their villages.'
translation:
  language: te
  text: మరియు గెదేరోతు, బేత్-దాగోను[a], నయమా, మక్కేదా—వాటి గ్రామాలతో కూడిన పదహారు పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బేత్-దాగోను’ అనే పేరుకు అక్షరార్థం ‘దాగోను గృహం’; అయితే ఇక్కడ అది స్థలనామం కాబట్టి లిప్యంతరీకరించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְדֵרוֹת
  choice: గెదేరోతు
  rationale: సంయోజక అవ్యయంతో కూడిన స్థలనామం. తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించబడింది; వాక్యప్రవాహంలో జాబితాను సహజంగా ఉంచేందుకు ఆరంభంలోని וּ విడిగా ‘మరియు’గా అనువదించలేదు.
- source_word: בֵּית דָּגוֹן
  choice: బేత్-దాగోను
  rationale: ‘దాగోను గృహం’ అనే వ్యుత్పత్తి ఉన్నప్పటికీ, ఇక్కడ ఇది స్థలనామంగా పనిచేస్తుంది; అందువల్ల అర్థానువాదం కాకుండా సంయుక్త నామంగా లిప్యంతరీకరించబడింది.
- source_word: וְ/נַעֲמָה
  choice: నయమా
  rationale: స్థలనామాన్ని హీబ్రూ ధ్వనికి దగ్గరగా, తెలుగు పాఠకులకు పలకడానికి సహజంగా లిప్యంతరీకరించాం.
- source_word: וּ/מַקֵּדָה
  choice: మక్కేదా
  rationale: స్థలనామాన్ని హీబ్రూ రూపంలోని ద్విత్వ వ్యంజనాన్ని నిలుపుతూ లిప్యంతరీకరించాం.
- source_word: עָרִים
  choice: పట్టణాలు
  rationale: భూభాగాల జాబితాలో జనావాస కేంద్రాలను సూచించే సాధారణ పదం; ఆధునిక తెలుగులో ‘పట్టణాలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שֵׁשׁ עֶשְׂרֵה
  choice: మొత్తం పదహారు
  rationale: సంఖ్యను నేరుగా అనువదించాం; ముందటి వచనాలనుంచి కొనసాగుతున్న జాబితా లెక్కను తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘మొత్తం’ చేర్చబడింది.
- source_word: וְ/חַצְרֵיהֶן
  choice: వాటి గ్రామాలతో కలిపి
  rationale: חָצֵר ఇక్కడ పట్టణాలకు అనుబంధమైన చిన్న గ్రామీణ జనావాసాలను సూచిస్తుంది. ‘వాటి గ్రామాలతో’ మూలంలోని స్త్రీలింగ బహువచన స్వామ్యప్రత్యయాన్ని ప్రతిబింబిస్తుంది; ‘కలిపి’ సంఖ్యకు అనుబంధ గ్రామాలు కూడా ఉన్నాయనే సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భౌగోళిక జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి ఉపయోగించబడింది. స్థలనామాలు అనువదించకుండా తెలుగు లిపిలో ఇవ్వబడ్డాయి; సంఖ్యా-జనావాస సంబంధం సహజంగా చదవడానికి వాక్యక్రమం స్వల్పంగా సర్దుబాటు చేయబడింది.
