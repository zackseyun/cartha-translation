  yaml_path: translation/ot/joshua/015/048.yaml
  text: 'In the hill country: Shamir[a], Jattir[c][b], and Socoh.'
translation:
  language: te
  text: 'కొండప్రాంతంలో[a]: షామీరు, యత్తీరు, సోకో.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘మరియు కొండప్రాంతంలో’; ఆరంభంలోని సంధానపదం ఈ వచనాన్ని కొనసాగుతున్న పట్టణాల జాబితాతో కలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בָ/הָר
  choice: కొండప్రాంతంలో
  rationale: సందర్భంలో ఇది యూదా ఎత్తైన కొండప్రాంతాన్ని సూచించే సమష్టి భౌగోళిక పదం. ఆరంభంలోని וְ కొనసాగుతున్న పట్టణాల జాబితాతో అనుసంధానిస్తుంది; తెలుగు జాబితా నిర్మాణంలో దానిని ప్రత్యేకంగా ‘మరియు’ అని పలకకుండానే భావం సహజంగా నిలుస్తుంది.
- source_word: שָׁמִיר
  choice: షామీరు
  rationale: హీబ్రూ స్థలనామాన్ని ఆధునిక తెలుగు ధ్వని-లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: וְ/יַתִּיר
  choice: యత్తీరు
  rationale: హీబ్రూ י ధ్వనిని ‘య’గా, ద్విత్వ త్‌ను ‘త్త’గా ప్రతిబింబించే స్థలనామ లిప్యంతరీకరణ. ముందున్న సంధానాన్ని తెలుగు జాబితా విరామచిహ్నం వ్యక్తపరుస్తుంది.
- source_word: וְ/שׂוֹכֹה
  choice: సోకో
  rationale: హీబ్రూ స్థలనామంలోని ధ్వనులకు దగ్గరగా ఉన్న తెలుగు లిప్యంతరీకరణ. చివరి ה ఇక్కడ స్వతంత్ర ‘హ’ ధ్వనిగా పలకబడదు; ముందున్న సంధానాన్ని జాబితా నిర్మాణం వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: సంక్షిప్త భౌగోళిక జాబితా శైలిని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదవదగిన రూపం వాడాం. స్థలనామాలకు ఆంగ్ల సంప్రదాయ రూపాలను అనుసరించకుండా హీబ్రూ ధ్వనులకు దగ్గరైన తెలుగు లిప్యంతరీకరణను ఎంచుకున్నాం.
