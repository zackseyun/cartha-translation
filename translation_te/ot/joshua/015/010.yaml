id: JOS.15.10
reference: Joshua 15:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָסַב֩ הַ/גְּב֨וּל מִ/בַּעֲלָ֥ה יָ֨מָּ/ה֙ אֶל הַ֣ר שֵׂעִ֔יר וְ/עָבַ֕ר אֶל כֶּ֧תֶף הַר יְעָרִ֛ים מִ/צָּפ֖וֹנָ/ה הִ֣יא כְסָל֑וֹן וְ/יָרַ֥ד בֵּֽית שֶׁ֖מֶשׁ וְ/עָבַ֥ר תִּמְנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/010.yaml
  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
translation:
  language: te
  text: అప్పుడు సరిహద్దు బయాలా నుండి పడమటివైపు[a] శేయీరు కొండ వరకు మలుపు తిరిగి, యెయారీము కొండ ఉత్తర వాలును ఆనుకొని సాగింది—అదే కెసాలోను. అక్కడి నుండి అది బేత్షెమెషుకు దిగిపోయి, తిమ్నా వరకు సాగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘సముద్రం వైపు’; ఇశ్రాయేలు భౌగోళిక సందర్భంలో ఇది పడమటి దిశను సూచించే సాధారణ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב הַגְּבוּל
  choice: సరిహద్దు ... మలుపు తిరిగి
  rationale: సరిహద్దు వర్ణనలో ఈ క్రియ దిశ మారడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మలుపు తిరిగి’ సహజంగా భౌగోళిక భావాన్ని తెలియజేస్తుంది.
- source_word: מִבַּעֲלָה
  choice: బయలా నుండి
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: יָמָּה
  choice: పడమటివైపు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘సముద్రం వైపు’; ఇశ్రాయేలు భౌగోళిక సందర్భంలో ఇది పడమటి దిశను సూచించే సాధారణ నుడికారం.
- source_word: אֶל הַר שֵׂעִיר
  choice: శేయీరు కొండ వరకు
  rationale: הַר అనేది కొండను లేదా పర్వత ప్రాంతాన్ని సూచించగలదు; ఇక్కడ సరిహద్దు గుర్తుగా ఉన్న భూభాగానికి ‘కొండ’ సహజమైన తెలుగు పదం.
- source_word: וְעָבַר אֶל כֶּתֶף
  choice: వాలును ఆనుకొని సాగింది
  rationale: כֶּתֶף అక్షరార్థంగా ‘భుజం/పక్కభాగం’; కొండ సందర్భంలో ‘వాలు’ భౌగోళిక అర్థాన్ని సహజంగా ఇస్తుంది. וְעָבַרను సరిహద్దు రేఖ ఒక ప్రదేశం వెంబడి సాగడంగా అనువదించాం.
- source_word: הַר יְעָרִים מִצָּפוֹנָה
  choice: యెయారీము కొండ ఉత్తర వాలు
  rationale: మూలంలోని స్థలనామాన్ని లిప్యంతరీకరించి, מִצָּפוֹנָהను ఆ కొండ ఉత్తర పక్కను సూచించేదిగా అందించాం.
- source_word: הִיא כְסָלוֹן
  choice: అదే కెసాలోను
  rationale: ముందు చెప్పిన ప్రదేశాన్ని కెసాలోనుగా గుర్తించే మూలంలోని వివరణాత్మక సమీకరణను నేరుగా నిలిపాం.
- source_word: וְיָרַד בֵּית שֶׁמֶשׁ
  choice: బేత్షెమెషుకు దిగిపోయి
  rationale: וְיָרַד భూఉన్నతి తగ్గడాన్ని సూచిస్తుంది; ‘దిగిపోయి’ ఆ స్థలాకృతి భావాన్ని కాపాడుతుంది.
- source_word: וְעָבַר תִּמְנָה
  choice: తిమ్నా వరకు సాగింది
  rationale: దిశాసూచక రూపం తిమ్నా వైపు/వరకు సరిహద్దు కొనసాగినట్లు సూచిస్తుంది; తెలుగులో ‘వరకు సాగింది’ సరిహద్దు వర్ణనకు సహజం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన భౌగోళిక వర్ణన. స్థలనామాలు హీబ్రూ ఉచ్చారణకు సాధ్యమైనంత సమీపంగా లిప్యంతరీకరించబడ్డాయి. ‘సముద్రం వైపు’ అనే అక్షరార్థ నుడికారానికి బదులు సందర్భార్థమైన ‘పడమటివైపు’ వాడబడింది; ప్రత్యేక పాదసూచిక అవసరం లేదని నిర్ణయించాం.
