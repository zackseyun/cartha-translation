base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/017.yaml
  text: Othniel son of Kenaz[a], Caleb’s brother, captured it[b], and he gave him his daughter Achsah as a wife.
translation:
  language: te
  text: కెనజు కుమారుడూ కాలేబు సోదరుడూ[b] అయిన ఒత్నీయేలు దానిని[a] స్వాధీనం చేసుకున్నాడు. అప్పుడు కాలేబు తన కుమార్తె అక్సాను అతనికి భార్యగా ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ముందటి వచనంలో చెప్పిన కిర్యత్-సేఫెరు లేదా దెబీరు పట్టణాన్ని.
    reason: cross_reference
  - marker: b
    text: “సోదరుడు” అనే మాట కొన్నిసార్లు సమీప బంధువును కూడా సూచించవచ్చు; అయితే ఇక్కడి సూటి అర్థం “సోదరుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: దానిని స్వాధీనం చేసుకున్నాడు
  rationale: לכד అనే క్రియలో పట్టుకోవడం లేదా జయించి స్వాధీనం చేసుకోవడం అనే సైనిక భావం ఉంది. స్త్రీలింగ ఏకవచన ప్రత్యయం మునుపటి వచనంలోని కిర్యత్-సేఫెరు పట్టణాన్ని సూచిస్తుంది.
- source_word: עָתְנִיאֵל
  choice: ఒత్నీయేలు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సహజమైన లిప్యంతరీకరణ.
- source_word: בֶּן קְנַז
  choice: కెనజు కుమారుడు
  rationale: సూటిగా ఉన్న తండ్రీకొడుకుల సంబంధాన్ని యథాతథంగా తెలిపే అనువాదం.
- source_word: אֲחִי כָלֵב
  choice: కాలేబు సోదరుడు
  rationale: ఈ నిర్మాణపు సాధారణ, సూటి అర్థం ‘కాలేబు సోదరుడు.’ אָח కొన్నిసార్లు విస్తృత బంధుత్వాన్ని సూచించగలదనే అంశాన్ని పాదసూచికలో నిలుపుకున్నాం.
- source_word: וַיִּתֶּן לוֹ
  choice: అప్పుడు కాలేబు ... అతనికి ... ఇచ్చాడు
  rationale: హీబ్రూలో సర్వనామాలే ఉన్నప్పటికీ, తెలుగులో కర్త స్పష్టత కోసం పూర్వసందర్భం ఆధారంగా ‘కాలేబు’ అని పేర్కొన్నాం; గ్రహీత ఒత్నీయేలు కావడంతో ‘అతనికి’ అని ఉంచాం.
- source_word: אֶת עַכְסָה בִתּוֹ
  choice: తన కుమార్తె అక్సాను
  rationale: పేరు మరియు ‘తన కుమార్తె’ అనే సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో అందించింది.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: వివాహ సంబంధాన్ని తెలిపే సాధారణ హీబ్రూ ప్రయోగానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
