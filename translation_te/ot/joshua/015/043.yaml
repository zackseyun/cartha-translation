lexical_decisions:
- source_word: יִפְתָּח
  choice: యిఫ్తాహు
  rationale: యూదా పట్టణాల జాబితాలోని స్థలనామం. హెబ్రీ యిఫ్తాఖ్ రూపాన్ని తెలుగులో సహజంగా పలికేలా లిప్యంతరీకరించాం; ప్రసిద్ధ న్యాయాధిపతి పేరుతో అనవసరంగా సమీకరించలేదు.
- source_word: אַשְׁנָה
  choice: అష్నా
  rationale: హెబ్రీ స్థలనామాన్ని దాని ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: נְצִיב
  choice: నెజీబు
  rationale: హెబ్రీ స్థలనామంలోని ṣ ధ్వనికి తెలుగులో ఖచ్చితమైన సాధారణ సమానం లేనందున, చదవడానికి సహజమైన సంప్రదాయ ధ్వన్యనుకరణగా ‘నెజీబు’ ఎంచుకున్నాం.
- source_word: וְ
  choice: —
  rationale: హెబ్రీలో ప్రతి పేరుకు ముందు ఉన్న సంధాయకం జాబితాను కొనసాగిస్తుంది. ఆధునిక తెలుగులో వరుస పేర్లను కామాలతో ఇవ్వడం సహజం; కాబట్టి ప్రతి పేరుకు ముందు ‘మరియు’ అని పునరావృతం చేయలేదు.
