lexical_decisions:
- source_word: ו/ינים
  choice: యానీము
  rationale: ו అనే సంధికారకాన్ని ఈ వరుసలో తెలుగు విరామచిహ్నం ద్వారా సహజంగా వ్యక్తం చేశాం; ינים స్థలనామం కావడంతో అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం. ఇచ్చిన హీబ్రూ రూపంలో అచ్చుల సూచన స్పష్టంగా లేకపోవడం వల్ల పేరుకు ఉన్న పఠనభేదాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וּ/בֵית תַּפּוּחַ
  choice: బేత్-తప్పూవహ్
  rationale: ఇది స్థిరమైన సంయుక్త స్థలనామం కాబట్టి בֵית ను ‘ఇల్లు’ అని విడిగా అనువదించకుండా పేరులో భాగంగా ధ్వన్యనుకరణ చేశాం. תַּפּוּחַ లోని చివరి గొంతుధ్వనిని సూచించేందుకు ‘వహ్’ రూపాన్ని వాడాం.
- source_word: וַ/אֲפֵקָה
  choice: అఫేకా
  rationale: אֲפֵקָה స్థలనామాన్ని దాని చివరి ה సూచించే ‘-కా’ రూపంతో సహా ధ్వన్యనుకరణ చేశాం; దాన్ని సంక్షిప్తమైన ‘అఫేక్’ రూపంతో కలపలేదు.
