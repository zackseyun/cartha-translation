translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్థలనామాల జాబితాగా సంక్షిప్తంగా, గౌరవప్రదంగా ఇచ్చాం. ప్రతి హీబ్రూ ו ను పదేపదే ‘మరియు’ అని రాయకుండా తెలుగు జాబితా శైలిలో కామాలతో వ్యక్తం చేశాం; చివరి సెమీకోలన్ సందర్భంలోని కొనసాగుతున్న పట్టణాల జాబితాను సూచిస్తుంది.
