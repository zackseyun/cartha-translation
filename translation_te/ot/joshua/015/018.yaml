translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. మూలంలోని క్రమాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు వాక్య నిర్మాణాన్ని స్వల్పంగా సర్దాం. పదార్థంలోని నిజమైన ప్రత్యామ్నాయ ఛాయలను పాదసూచికల్లో భద్రపరిచాం.
