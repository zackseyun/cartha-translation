base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: te
  text: ఆమె వచ్చినప్పుడు, తన తండ్రిని ఒక పొలం ఇవ్వమని అడగమని ఆమె అతనిని ప్రేరేపించింది[a]. తరువాత ఆమె గాడిద మీద నుంచి దిగింది[b]. కాలేబు ఆమెతో, “నీకు ఏమి కావాలి?[c]” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతనిని ఒప్పించింది”; మరింత ప్రతికూల భావంలో, “అతనిని పురికొల్పింది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆమె గాడిద మీద నుంచి చటుక్కున దిగింది”; హీబ్రూ క్రియ హఠాత్తుగా దిగిన భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ నుడికారానికి అక్షరార్థం “నీకు ఏమిటి?” సందర్భాన్ని బట్టి “నీకు ఏమి కావాలి?” లేదా “నీ బాధ ఏమిటి?” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: ఆమె వచ్చినప్పుడు
  rationale: בְּ + క్రియార్థక నామరూపం + 3వ పురు. స్త్రీ. ఏక. ప్రత్యయం కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. గమ్యస్థానాన్ని మూలపాఠం స్పష్టంగా చెప్పనందున దానిని చేర్చలేదు.
- source_word: וַתְּסִיתֵהוּ
  choice: అతణ్ణి ప్రేరేపించింది
  rationale: סות అనే క్రియకు పురికొల్పడం, ప్రేరేపించడం, ఒప్పించడం వంటి భావాలు ఉండవచ్చు. సందర్భానికి సహజంగా ఉండి, ప్రతికూల భావాన్ని అనవసరంగా బలపరచకుండా ఆమె చురుకైన ప్రోద్బలాన్ని తెలిపే పదంగా ‘ప్రేరేపించింది’ ఎంచుకున్నాం.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  choice: తన తండ్రిని ఒక పొలం అడగమని
  rationale: తెలుగులో שאל + వ్యక్తి + వస్తువు అనే నిర్మాణాన్ని సహజంగా ‘తండ్రిని ఒక పొలం అడగడం’ అని వ్యక్తపరచవచ్చు. שָׂדֶהకు నేరుగా ‘పొలం’ అని అనువదించాం.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: ఆమె గాడిద మీద నుంచి దిగింది
  rationale: צנח ఇక్కడ గాడిదపై నుంచి దిగడాన్ని సూచిస్తుంది; క్రియలో హఠాత్తుగా లేదా వేగంగా దిగిన ఛాయ ఉండవచ్చు. ప్రధాన పాఠంలో సహజమైన ‘దిగింది’ ఉంచి, ఆ ఛాయను పాదసూచికలో తెలిపాం.
- source_word: מַה לָּךְ
  choice: నీకు ఏమి కావాలి?
  rationale: అక్షరార్థంగా ‘నీకు ఏమి ఉంది/నీతో ఏమిటి?’ అనే ఈ హీబ్రూ నుడికారం సందర్భంలో ఆమె కోరిక ఏమిటని అడుగుతోంది. ఆధునిక తెలుగులో సహజంగా ‘నీకు ఏమి కావాలి?’ అని ఇచ్చాం.
