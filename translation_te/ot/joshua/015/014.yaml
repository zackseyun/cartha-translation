revisions:
- from: కాలేబు అక్కడి నుంచి అనాకు ముగ్గురు కుమారులైన షేషయిని, అహీమానును, తల్మయిని వెళ్లగొట్టాడు. వీరు అనాకు పుట్టినవారు.
  to: కాలేబు అక్కడి నుంచి అనాకు ముగ్గురు కుమారులైన షేషైని, అహీమానును, తల్మైని తరిమివేశాడు. వీరు అనాకు పుట్టినవారు.
  rationale: The revision retains every source element and the Hebrew’s paired genealogical wording, while using closer Telugu forms of the names and a more appropriate narrative verb for dispossessing or driving out prior occupants. No footnote is required because the main text preserves the relevant lexical and genealogical sense without unresolved ambiguity.
  reviewer_model: gpt-5.6-terra
