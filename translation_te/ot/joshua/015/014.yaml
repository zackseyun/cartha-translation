source:
  edition: WLC
  text: וַ/יֹּ֤רֶשׁ מִ/שָּׁם֙ כָּלֵ֔ב אֶת שְׁלוֹשָׁ֖ה בְּנֵ֣י הָ/עֲנָ֑ק אֶת שֵׁשַׁ֤י וְ/אֶת אֲחִימַן֙ וְ/אֶת תַּלְמַ֔י יְלִידֵ֖י הָ/עֲנָֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/014.yaml
  text: 'And Caleb drove out from there the three sons of Anak: Sheshai[a], Ahiman, and Talmai[b], the children of Anak.'
translation:
  language: te
  text: కాలేబు అక్కడి నుంచి అనాకు ముగ్గురు కుమారులైన షేషైని, అహీమానును, తల్మైని తరిమివేశాడు. వీరు అనాకు పుట్టినవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּרֶשׁ
  choice: వెళ్లగొట్టాడు
  rationale: హిఫీల్ రూపంలోని ירשׁ ఇక్కడ వ్యక్తులను కర్మగా తీసుకొని, వారు అధీనంలో ఉన్న స్థలం నుంచి వారిని తొలగించడం లేదా వారి స్వాధీనాన్ని పోగొట్టడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘వెళ్లగొట్టాడు’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుంచి
  rationale: స్థలాన్ని సూచించే ఈ పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: שְׁלוֹשָׁה בְּנֵי הָעֲנָק
  choice: అనాకు ముగ్గురు కుమారులు
  rationale: בְּנֵי అనే కుటుంబ సంబంధ పదాన్ని నేరుగా నిలుపుతూ, పేర్లతో కలిపి తెలుగులో సహజంగా చదివే నిర్మాణం.
- source_word: שֵׁשַׁי
  choice: షేషయి
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: אֲחִימַן
  choice: అహీమాను
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ; వాక్యంలోని కర్మవిభక్తికి ‘అహీమానును’గా రూపాంతరం చెందుతుంది.
- source_word: תַּלְמַי
  choice: తల్మయి
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: יְלִידֵי הָעֲנָק
  choice: అనాకు పుట్టినవారు
  rationale: ‘అనాకుకు జన్మించినవారు’ అనే మూలంలోని సంబంధిత వంశపారంపర్య వ్యక్తీకరణను, ముందున్న ‘కుమారులు’ అనే పదంతో ఉన్న ఉద్దేశపూర్వక పునరుక్తిని తొలగించకుండా సహజ తెలుగులో నిలుపుతుంది.
