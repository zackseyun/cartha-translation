translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ వాక్యంలో ‘అనాకు కుమారులు’ మరియు ‘అనాకు పుట్టినవారు’ అనే రెండు సమీప వంశసంబంధ వ్యక్తీకరణలు ఉన్నందున రెండింటినీ ప్రధాన పాఠ్యంలో నిలిపాం. అవసరం లేని పాదసూచికలు చేర్చలేదు.
