  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా, హీబ్రూ ఉచ్చారణను ఆధారంగా చేసుకొని తెలుగులో లిప్యంతరీకరించబడింది; తెలుగు బైబిలు వాడుకకు సహజంగా చివర ‘ు’ చేర్చబడింది.
