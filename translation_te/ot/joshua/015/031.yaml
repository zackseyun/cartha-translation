  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; మధ్యలోని బలపరచబడిన నూన్‌ను ‘న్న’తో సూచించాం.
- source_word: סַנְסַנָּה
  choice: సన్సన్నా
