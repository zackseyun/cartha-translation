translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; భూభాగ సరిహద్దును వివరించే గంభీరమైన కథన శైలి. స్థలనామాలను హీబ్రూ ఉచ్చారణకు సమీపంగా ధ్వన్యంతరీకరించాం. మూలంలోని వరుస దిశా కదలికను సహజ తెలుగు వాక్య విభజనతో నిలిపాం.
