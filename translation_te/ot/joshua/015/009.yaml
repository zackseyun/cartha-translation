- from: అప్పుడు సరిహద్దు పర్వత శిఖరం నుండి నెఫ్తోయహు నీటి ఊట వైపు తిరిగి,[a] ఎఫ్రోను పర్వత పట్టణాల వైపుగా సాగింది. అక్కడి నుండి సరిహద్దు బయలా వైపు తిరిగింది; అదే కిర్యత్‌-యెయారీము.
