id: JOS.15.9
reference: Joshua 15:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/תָאַ֨ר הַ/גְּב֜וּל מֵ/רֹ֣אשׁ הָ/הָ֗ר אֶל מַעְיַן֙ מֵ֣י נֶפְתּ֔וֹחַ וְ/יָצָ֖א אֶל עָרֵ֣י הַר עֶפְר֑וֹן וְ/תָאַ֤ר הַ/גְּבוּל֙ בַּעֲלָ֔ה הִ֖יא קִרְיַ֥ת יְעָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/009.yaml
  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
translation:
  language: te
  text: అప్పుడు సరిహద్దు పర్వత శిఖరం నుండి నెఫ్తోయహు జలాల ఊట వరకు వంపు తిరిగి,[a] ఎఫ్రోను పర్వతంలోని పట్టణాల వరకు సాగింది. తరువాత సరిహద్దు బయాలా వరకు తిరిగింది; అదే కిర్యత్-యెయారీము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సరిహద్దు రేఖ గుర్తించబడింది”; లేదా, “సరిహద్దు మలుపు తిరిగింది.” ఈ సరిహద్దు వర్ణనలోని హీబ్రూ క్రియ సరిహద్దు మార్గాన్ని గుర్తించడాన్నిగానీ, అది దిశ మార్చుకోవడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: వైపు తిరిగి / వైపు తిరిగింది
  rationale: సరిహద్దు వర్ణనలో ఈ క్రియ సరిహద్దు రేఖ దిశ మారడాన్ని లేదా దాని మార్గాన్ని గుర్తించడాన్ని సూచించగలదు. సహజమైన తెలుగులో ‘తిరిగింది’ భౌగోళిక సందర్భానికి సరిపోతుంది; మూలంలోని అర్థవిస్తృతిని పాదటిప్పణిలో ఉంచాం.
- source_word: הַגְּבוּל
  choice: సరిహద్దు
  rationale: భూభాగాల విభజన సందర్భంలో ఇది సహజమైన, ఖచ్చితమైన ఆధునిక తెలుగు పదం.
- source_word: מֵרֹאשׁ הָהָר
  choice: పర్వత శిఖరం నుండి
  rationale: భౌగోళిక ప్రయోగంలో רֹאשׁ అర్థాన్ని ‘శిఖరం’ స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: నెఫ్తోయహు నీటి ఊట
  rationale: హీబ్రూ సమాస నిర్మాణంలోని ‘నీళ్లు’ మరియు ‘ఊట’ రెండింటినీ నిలుపుతూ తెలుగులో చదవదగిన రూపం.
- source_word: וְיָצָא
  choice: వైపుగా సాగింది
  rationale: సరిహద్దు సూత్రాలలో ఈ క్రియ రేఖ ముందుకు కొనసాగడాన్ని సూచిస్తుంది. పదశః ‘బయలుదేరింది’ కంటే ‘సాగింది’ తెలుగులో భౌగోళిక సరిహద్దుకు సహజం.
- source_word: עָרֵי הַר עֶפְרוֹן
  choice: ఎఫ్రోను పర్వత పట్టణాలు
  rationale: సంక్షిప్త హీబ్రూ సమాసాన్ని అధిక వివరణ లేకుండా ప్రతిబింబిస్తుంది; עָרֵי కి ఆధునిక సందర్భంలో ‘పట్టణాలు’ సహజం.
- source_word: בַּעֲלָה
  choice: బయలా
  rationale: స్థలనామాన్ని తెలుగు ధ్వన్యంతరీకరణలో ఇచ్చాం.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: అదే కిర్యత్‌-యెయారీము
  rationale: బయలా అనే స్థలాన్ని మరో పేరుతో గుర్తించే హీబ్రూ వాక్యాన్ని సహజమైన తెలుగులో స్పష్టంగా చూపుతుంది.
