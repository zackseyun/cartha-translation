id: JOS.2.1
reference: Joshua 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
translation:
  language: te
  text: నూను కుమారుడైన యెహోషువ షిత్తీము నుండి ఇద్దరు మనుష్యులను రహస్యంగా గూఢచారులుగా పంపి, “వెళ్లి ఆ దేశాన్నీ యెరికోనూ చూడండి[a]” అని చెప్పాడు. వారు వెళ్లి రాహాబు అనే వేశ్య[b] ఇంటికి వచ్చి అక్కడ పడుకున్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆ దేశాన్ని మరియు యెరికోను చూడండి.” దేశం మొత్తాన్నీ, అందులో యెరికోను ప్రత్యేక లక్ష్యంగానూ పేర్కొన్నట్లు ఈ మాటలను అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొందరు సందర్భం లేదా తరువాతి సంప్రదాయం ఆధారంగా “సత్రం నడిపే స్త్రీ” అని భావించారు. అయితే హీబ్రూ పదానికి సాధారణ అర్థం “వేశ్య.”
    reason: alternative_reading
  - marker: c
    text: “అక్కడ బస చేశారు” అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా “అక్కడ పడుకున్నారు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపుతూ ... అని చెప్పాడు
  rationale: హీబ్రూ కథనంలోని ‘పంపాడు ... అంటూ’ అనే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: מִן הַשִּׁטִּים
  choice: షిత్తీము నుండి
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా తెలుగు లిపిలో ధ్వన్యనువాదం చేయబడింది.
- source_word: שְׁנַיִם אֲנָשִׁים
  choice: ఇద్దరు మనుష్యులను
  rationale: మూలంలోని పురుషవాచక బహువచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מְרַגְּלִים
  choice: వేగులవారిగా
  rationale: వారు రహస్యంగా సమాచారం సేకరించడానికి పంపబడినవారనే పాత్రను సహజంగా తెలియజేస్తుంది.
- source_word: חֶרֶשׁ
  choice: రహస్యంగా
  rationale: ఈ సందర్భంలో క్రియావిశేషణంగా ఉన్న పదం వారి కార్యం గోప్యంగా జరిగిందని సూచిస్తుంది.
- source_word: לְכוּ רְאוּ
  choice: మీరు వెళ్లి ... పరిశీలించండి
  rationale: కేవలం చూడటం కంటే గూఢచారుల పరిశీలనను సందర్భానుగుణంగా తెలుపుతూ, రెండు ఆజ్ఞల భావాన్ని నిలుపుతుంది.
- source_word: אֶת הָאָרֶץ וְאֶת יְרִיחוֹ
  choice: ఆ దేశాన్ని, యెరికోను
  rationale: మూలంలోని సముచ్చయాన్ని వ్యాఖ్యానాత్మకంగా ‘ముఖ్యంగా’ అని మార్చకుండా, దేశం మరియు యెరికో రెండింటినీ పేర్కొంటుంది.
- source_word: בֵּית אִשָּׁה זוֹנָה
  choice: వేశ్య ఇంటికి
  rationale: זוֹנָה అనే పదానికి సాధారణమైన ప్రత్యక్ష అర్థం ‘వేశ్య’; దానిని నైతిక అసౌకర్యం కారణంగా మృదువుపరచలేదు.
- source_word: וּשְׁמָהּ רָחָב
  choice: రాహాబు అనే
  rationale: ‘ఆమె పేరు రాహాబు’ అనే మూలభావాన్ని సహజమైన తెలుగు నామవిశేషణ నిర్మాణంలో అందిస్తుంది.
- source_word: וַיִּשְׁכְּבוּ שָׁמָּה
  choice: అక్కడ పడుకున్నారు
  rationale: שכב యొక్క ‘పడుకొను’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతూ, లైంగిక చర్యను గానీ అధికారిక వసతిని గానీ అనవసరంగా నిర్ధారించదు.
theological_decisions:
- issue: రాహాబు వృత్తిని సూచించే זוֹנָה అర్థం
  choice: వేశ్య
  alternative: సత్రం నడిపే స్త్రీ
  rationale: హీబ్రూ పదానికి సాధారణ నిఘంటు అర్థం ‘వేశ్య’. ‘సత్రం నడిపే స్త్రీ’ అనేది సందర్భం లేదా తరువాతి సంప్రదాయం ఆధారంగా ప్రతిపాదించిన అర్థం; మూలపదానికి సహజమైన మొదటి అర్థం కాదు.
- issue: וַיִּשְׁכְּבוּ שָׁמָּה సూచించే చర్య
  choice: అక్కడ పడుకున్నారు
  alternative: అక్కడ బసచేశారు
  rationale: మూలక్రియ అక్షరార్థంగా ‘పడుకున్నారు’ అని చెబుతుంది. ఈ అనువాదం లైంగిక సంబంధాన్ని సూచించదు; అదే సమయంలో ‘బసచేశారు’ అని సందర్భాన్ని పూర్తిగా వ్యాఖ్యానించి నిర్ధారించదు.
- issue: ‘దేశం’ మరియు ‘యెరికో’ మధ్య సంబంధం
  choice: ఆ దేశాన్ని, యెరికోను
  alternative: ఆ దేశాన్ని, ముఖ్యంగా యెరికోను
  rationale: హీబ్రూ వాక్యంలో సాధారణ సముచ్చయం ఉంది. యెరికో ప్రధాన లక్ష్యమై ఉండవచ్చునన్న భావం సందర్భంలో సాధ్యమైనా, ‘ముఖ్యంగా’ అని ప్రధాన పాఠ్యంలో చేర్చడం మూలంలోని సంబంధాన్ని అవసరానికి మించి నిర్ధారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. వ్యక్తి, స్థలనామాలు తెలుగు బైబిలు వాడుకకు అనుగుణంగా ధ్వన్యనువదించబడ్డాయి. ‘వేశ్య’ అనే ప్రత్యక్షమైన కానీ అసభ్యంకాని పదం ఎంచుకోబడింది; చివరి క్రియలోని ఉద్దేశపూర్వక అస్పష్టతను పాదసూచికతో నిలుపుకున్నాం.
