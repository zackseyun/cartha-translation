- from: నూను కుమారుడైన యెహోషువ షిత్తీము నుండి ఇద్దరు మనుష్యులను వేగులవారిగా రహస్యంగా పంపుతూ, “మీరు వెళ్లి ఆ దేశాన్ని, యెరికోను పరిశీలించండి[a]” అని చెప్పాడు. వారు వెళ్లి రాహాబు అనే వేశ్య[b] ఇంటికి వచ్చి అక్కడ పడుకున్నారు[c].
