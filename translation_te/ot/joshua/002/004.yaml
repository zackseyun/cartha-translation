  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּקַּ֧ח הָֽ/אִשָּׁ֛ה אֶת שְׁנֵ֥י הָ/אֲנָשִׁ֖ים וַֽ/תִּצְפְּנ֑/וֹ וַ/תֹּ֣אמֶר כֵּ֗ן בָּ֤אוּ אֵלַ/י֙ הָֽ/אֲנָשִׁ֔ים וְ/לֹ֥א יָדַ֖עְתִּי מֵ/אַ֥יִן הֵֽמָּה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/004.yaml
  text: But the woman had taken the two men and hidden them[a], and she said, “Yes, the men came to me, but I did not know where they were from.”
translation:
  language: te
  text: కానీ ఆ స్త్రీ ఆ ఇద్దరు పురుషులను తీసుకొని వారిని దాచింది[a]. ఆమె, “అవును, ఆ పురుషులు నా దగ్గరికి వచ్చారు; కానీ వారు ఎక్కడివారో నాకు తెలియదు” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘అతనిని దాచింది’ అన్నట్లుగా ఏకవచన ప్రత్యయం ఉంది; అయితే సందర్భం ఆ ఇద్దరు పురుషులనే సూచిస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో ‘వారిని’ అనే భావంతో అనువదించబడింది.
    reason: textual_variant
lexical_decisions:
- source_word: וַתִּקַּח
  choice: తీసుకెళ్లి
  rationale: ఇక్కడ క్రియ వారిని తన ఆధీనంలోకి తీసుకొని దాచే చర్యకు దారితీస్తుంది. తెలుగు కథనంలో ‘తీసుకెళ్లి’ తరువాతి క్రియతో సహజంగా అనుసంధానమవుతుంది; ముందుగా జరిగిన చర్యను సూచించడానికి ప్రత్యేక పూర్వభూతకాల రూపం అవసరం లేదు.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: సందర్భంలో ఇది రాహాబును సూచిస్తుంది; భార్య అనే ప్రత్యేక అర్థం ఉద్దేశించబడలేదు.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: ఆ ఇద్దరు పురుషులు
  rationale: ఇది ఇద్దరు ఇశ్రాయేలీయ గూఢచారులను సూచించే స్పష్టమైన, లింగానుగుణమైన అనువాదం.
- source_word: וַתִּצְפְּנוֹ
  choice: దాచిపెట్టింది
  rationale: హీబ్రూ ప్రత్యయం ఏకవచనంగా ఉన్నప్పటికీ సందర్భంలోని కర్మ ఇద్దరు పురుషులు. తెలుగు ప్రధాన పాఠ్యంలో సందర్భానుగుణ బహువచనాన్ని ఉంచి, రూపభేదాన్ని పాదసూచికలో తెలిపాం.
- source_word: כֵּן
  choice: అవును
  rationale: మునుపటి ప్రశ్న లేదా ఆరోపణలోని విషయాన్ని నేరుగా అంగీకరించే సహజ తెలుగు సంభాషణా రూపం.
- source_word: וְלֹא יָדַעְתִּי
  choice: కానీ ... నాకు తెలియదు
  rationale: 'హీబ్రూ వావ్‌ను ఇక్కడ ప్రతికూల వ్యత్యాసంగా తెలుగులో ‘కానీ’ అని ఇవ్వడం సహజం: వారు వచ్చినట్టు అంగీకరించి, వారి మూలం తనకు తెలియదని ఆమె అంటుంది.'
- source_word: מֵאַיִן הֵמָּה
  choice: వారు ఎక్కడివారో
  rationale: వారి మూలస్థానం లేదా వారు ఎక్కడి నుంచి వచ్చారనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని, గౌరవప్రదమైన సరళ సంభాషణను ఉపయోగించాం. మూలంలోని ఏకవచన ప్రత్యయ అసంగతిని ప్రధాన పాఠ్యంలో సందర్భానుగుణంగా సవరించి పాదసూచికలో పారదర్శకంగా నమోదు చేశాం.
