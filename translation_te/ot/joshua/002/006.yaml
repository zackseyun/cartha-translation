  text: But she had brought them up to the roof and hidden them among the stalks of flax laid out for her on the roof.
translation:
  language: te
  text: అయితే ఆమె వారిని ఇంటి పైకప్పుమీదికి తీసుకెళ్లి, అక్కడ తన కోసం వరుసగా పేర్చి ఉంచిన అవిసె కాండాల మధ్య దాచిపెట్టింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגָּגָה / עַל־הַגָּג
  choice: మేడమీదికి / మేడమీద
  rationale: ఇంటి సమతల పైకప్పును సూచించే సందర్భంలో, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అర్థమయ్యే ‘మేడ’ను ఉపయోగించాం.
- source_word: בְּפִשְׁתֵּי הָעֵץ
  choice: అవిసె కాండాల మధ్య
  rationale: ఇక్కడ פִּשְׁתִּים అవిసెను, עֵץ దాని కాండాలు లేదా చెక్కలాంటి భాగాలను సూచిస్తుంది; ‘కాండాలు’ సందర్భానికి స్పష్టమైన సహజ రూపం.
- source_word: הָעֲרֻכוֹת לָהּ
  choice: తన కోసం పరచి ఉంచిన
  rationale: స్త్రీలింగ బహువచన రూపం అవిసె కాండాలతో అన్వయిస్తుంది; לָהּ లోని ‘ఆమెకు/ఆమె కోసం’ భావాన్ని తొలగించకుండా నిలిపాం.
