translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా ఉండే, కథనానికి తగిన గౌరవప్రదమైన ప్రామాణిక తెలుగు. హీబ్రూ వాక్యంలోని ముందస్తు నేపథ్య సూచనను ‘అయితే’తో, పూర్తి క్రియాభావాన్ని సహజ తెలుగు కథన రూపంలో వ్యక్తం చేశాం.
