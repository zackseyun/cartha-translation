id: JOS.2.10
reference: Joshua 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
translation:
  language: te
  text: ఎందుకంటే, మీరు ఐగుప్తు నుండి బయలుదేరినప్పుడు యెహోవా మీ ఎదుట ఎర్ర సముద్రపు[a] నీళ్లను ఎలా ఎండబెట్టాడో, యొర్దాను అవతల ఉన్న అమోరీయుల ఇద్దరు రాజులైన సీహోనుకూ ఓగుకూ మీరు ఏమి చేశారో—వారిని నాశనానికి అంకితం చేశారో—మేము విన్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘యామ్ సూఫ్’; సంప్రదాయంగా ‘ఎర్ర సముద్రం’ అని అనువదిస్తారు. మరింత అక్షరార్థంగా ‘రెల్లుల సముద్రం’ అని చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలో చెప్పిన భయానికి రాహాబు కారణం వివరిస్తోంది; తెలుగులో ‘ఎందుకంటే’ ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שָׁמַעְנוּ
  choice: మేము విన్నాం
  rationale: పూర్తయిన వినికిడి ఫలితం ప్రస్తుతం కొనసాగుతోందనే భావం సందర్భం ద్వారా స్పష్టమవుతుంది; ఆధునిక తెలుగులో ఇది సహజమైన రూపం.
- source_word: הוֹבִישׁ
  choice: ఎండిపోయేలా చేశాడు
  rationale: יבש అనే ధాతువు హిఫీల్ రూపంలో ‘ఎండిపోయేలా చేయడం’ అనే కారక భావాన్ని కలిగిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: מֵי יַם סוּף
  choice: ఎర్ర సముద్రపు నీళ్లు
  rationale: తెలుగు పాఠకులకు పరిచితమైన భౌగోళిక నామాన్ని ప్రధాన పాఠంలో ఉంచి, మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
- source_word: מִפְּנֵיכֶם
  choice: మీ ఎదుట
  rationale: ఇశ్రాయేలీయుల ముందున్న నీళ్లు తొలగించబడిన స్థానిక భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: మీరు ఐగుప్తు నుండి బయలుదేరినప్పుడు
  rationale: ב తో కూడిన క్రియానామ నిర్మాణంలోని కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲשִׂיתֶם
  choice: మీరు ఏమి చేశారో
  rationale: మూలంలోని విస్తృతార్థక క్రియను అలాగే ఉంచి, తరువాత వచ్చే విధ్వంస వివరణ దాని అర్థాన్ని నిర్దిష్టం చేయనిచ్చింది.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: అమోరీయుల ఇద్దరు రాజులకు
  rationale: హీబ్రూ నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల ఉన్న
  rationale: మాట్లాడుతున్న రాహాబు దృష్టికోణం నుంచి యొర్దాను నదికి ఆవల ఉన్న ప్రాంతాన్ని సూచిస్తుంది.
- source_word: לְסִיחֹן וּלְעוֹג
  choice: సీహోనుకు, ఓగుకు
  rationale: ఆ ఇద్దరు రాజులు ఎవరో అన్వయంగా గుర్తించే మూల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הֶחֱרַמְתֶּם
  choice: నాశనానికి అంకితం చేశారు
  rationale: חרם లోని అంకితభావం మరియు దాని ఫలితమైన సంపూర్ణ విధ్వంసం రెండింటినీ కేవలం ‘నాశనం చేశారు’ అన్నదానికంటే మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తున్నందున దాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగా నిలుపుతుంది; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితం.
- issue: חרם సంబంధిత భాష
  choice: నాశనానికి అంకితం చేశారు
  alternative: పూర్తిగా నాశనం చేశారు
  rationale: ఈ పదంలోని ప్రత్యేకమైన అంకితం/నిషేధ భావాన్నీ, దాని విధ్వంసక ఫలితాన్నీ నిలుపుతూ, కేవలం సైనిక ఓటమిగా కుదించకుండా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఐగుప్తు,’ ‘యొర్దాను,’ ‘అమోరీయులు,’ ‘సీహోను,’ ‘ఓగు’ వంటి స్థిరపడిన తెలుగు బైబిలు నామరూపాలు వాడబడ్డాయి. חרם యొక్క ప్రత్యేక భావాన్ని నిలుపడానికి కొద్దిగా వివరణాత్మకమైన ‘నాశనానికి అంకితం చేశారు’ అనే పదబంధం ఎంచుకోబడింది.
