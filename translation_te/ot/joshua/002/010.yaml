  terminology: ‘యెహోవా,’ ‘ఐగుప్తు,’ ‘యొర్దాను,’ ‘అమోరీయులు,’ ‘సీహోను,’ ‘ఓగు’ రూపాలు ఆధునిక తెలుగు బైబిలు వాడుకకు తగినవి. ‘నాశనానికి అంకితం చేశారు’ חרם యొక్క ప్రత్యేక భావాన్ని తగినంతగా కాపాడుతుంది. పాదటిప్పణి యామ్ సూఫ్‌కు ఉన్న సంప్రదాయ మరియు అక్షరార్థ ప్రత్యామ్నాయాలను సముచితంగా ఇస్తుంది.
