id: JOS.2.12
reference: Joshua 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
translation:
  language: te
  text: 'ఇప్పుడు, దయచేసి యాహ్వే పేరున నాకు ప్రమాణం చేయండి: నేను మీకు దయ చూపినట్లే, మీరు కూడా నా తండ్రి ఇంటివారికి దయ చూపి, నాకు నమ్మదగిన సూచన ఇవ్వండి,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిజమైన సూచన,” “ఖచ్చితమైన సూచన,” లేదా “నమ్మదగిన హామీ” అని కూడా అనువదించవచ్చు.
    reason: אוֹת אֱמֶת అనే పదబంధం సూచన యొక్క నిజత్వం, విశ్వసనీయత లేదా హామీ స్వభావాన్ని తెలియజేయగలదు.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: కథనం నుంచి రాహాబు చేసే అత్యవసర విజ్ఞప్తికి మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తెలుగు వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ అవసరం లేదు.
- source_word: הִשָּׁבְעוּ נָא לִי
  choice: దయచేసి ... నాకు ప్రమాణం చేయండి
  rationale: నిఫాల్ బహువచన ఆజ్ఞారూపంలోని ‘ప్రమాణం చేయండి’ అనే భావాన్ని, נָא లోని మర్యాదతో కూడిన వేడుకోలును కాపాడుతుంది.
- source_word: בַּיהוָה
  choice: యాహ్వే పేరట
  rationale: ప్రమాణంలో ఆహ్వానించబడుతున్న దైవనామం יהוה ను ‘యాహ్వే’గా ప్రత్యక్షంగా నిలుపుతూ, తెలుగులో ప్రమాణానికి సహజమైన ‘పేరట’ను వాడుతుంది.
- source_word: עָשִׂיתִי עִמָּכֶם חָסֶד
  choice: నేను మీపట్ల విశ్వసనీయమైన దయ చూపినట్లే
  rationale: חֶסֶד లోని దయతోపాటు నిబద్ధత, విశ్వాస్యత అనే సంబంధపరమైన బరువును ‘విశ్వసనీయమైన దయ’ కొంతవరకు నిలుపుతుంది; כִּי ను సందర్భానుసారంగా పోలిక నిర్మాణంలో కలుపుతుంది.
- source_word: וַעֲשִׂיתֶם גַּם אַתֶּם עִם בֵּית אָבִי חֶסֶד
  choice: మీరు కూడా నా తండ్రి ఇంటివారిపట్ల విశ్వసనీయమైన దయ చూపి
  rationale: ఆజ్ఞ తరువాత వచ్చే వావ్-కటల్‌ను కోరబడుతున్న భవిష్యత్ చర్యగా చూపుతుంది. ‘నా తండ్రి ఇల్లు’ అనే హెబ్రీ కుటుంబ-గృహార్థక నుడికారాన్ని తెలుగులో స్పష్టంగా ‘నా తండ్రి ఇంటివారు’గా అందిస్తుంది; పునరుక్త חֶסֶד ను కూడా నిలుపుతుంది.
- source_word: וּנְתַתֶּם לִי אוֹת אֱמֶת
  choice: నాకు నమ్మదగిన ఒక సూచనను ఇవ్వండి
  rationale: אוֹת కు విస్తృతమైన ‘సూచన’, אֱמֶת కు ఈ సందర్భంలో నిజమైనది/నమ్మదగినది అనే భావం ఉంది. ‘నమ్మదగిన సూచన’ రాహాబు కోరే భరోసాను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం ఒడంబడిక దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. దాన్ని బిరుదుతో మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: חֶסֶד యొక్క భావపరిధి
  choice: విశ్వసనీయమైన దయ
  alternative: దయ / నిబంధన విశ్వాస్యత
  rationale: ఇక్కడ పరస్పర రక్షణ సందర్భంలో దయ, నిబద్ధత రెండూ ప్రతిధ్వనిస్తాయి. కేవలం ‘దయ’ భావాన్ని తగ్గించవచ్చు; ‘నిబంధన విశ్వాస్యత’ ఈ వ్యక్తిగత ఒప్పందానికి మించిన సాంకేతిక అర్థాన్ని మోపవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; మర్యాదతో కూడిన అత్యవసర విజ్ఞప్తి స్వరం. ‘నా తండ్రి ఇంటివారు’ సాధారణ పాఠకులకు కుటుంబ/గృహ సమూహార్థాన్ని స్పష్టపరుస్తుంది. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున ముగింపులో పూర్ణవిరామం కాకుండా అల్పవిరామ భావం ఉంచబడింది.
