translation:
  language: te
  text: అయితే నీవు మా ఈ సంగతి[a]ని బయటపెడితే, నీవు మాతో చేయించిన ప్రమాణం నుంచి మేము విముక్తులమవుతాం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మా ఈ వ్యవహారాన్ని’ లేదా ‘మా ఈ విషయాన్ని’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం మాటను, విషయాన్ని లేదా వ్యవహారాన్ని సూచించగలదు; ఇక్కడ అది గూఢచారుల రహస్య కార్యాన్ని సూచిస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో అక్షరార్థంగా ‘నీ ప్రమాణం నుంచి మేము నిర్దోషులమవుతాం’ అనే భావం ఉంది. ఆమె వారి రహస్యాన్ని బయటపెడితే, ఆ ప్రమాణానికి వారు ఇక బద్ధులుగా ఉండరని ఈ హీబ్రూ నుడికారం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ... అయితే
  rationale: సంభాషణలో ముందుగా చెప్పిన హామీకి మినహాయింపుగా ఒక వ్యతిరేక షరతును ప్రవేశపెడుతోంది. తెలుగులో సహజమైన షరతు నిర్మాణం కోసం వాక్యారంభంలో ‘అయితే’, క్రియతో ‘-తే’ వాడబడ్డాయి.
- source_word: תַּגִּידִי
  choice: నీవు ... బయటపెడితే
  rationale: נגד హిఫీల్ రూపానికి ‘తెలియజేయు, వెల్లడించు’ అనే అర్థాలున్నాయి. ఇక్కడ గూఢచారుల రహస్య సంగతిని ఇతరులకు చెప్పడాన్ని సూచించడానికి ‘బయటపెట్టు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: మా ఈ సంగతి
  rationale: דבר అనే పదం ‘మాట, సంగతి, వ్యవహారం’ అనే విస్తృత అర్థాలను కలిగి ఉంది. సందర్భంలో ఇది కేవలం పలికిన మాటలను కాక గూఢచారుల రహస్య కార్యాన్ని సూచిస్తుంది; ‘మా ఈ సంగతి’ ఆ విస్తృతతను నిలుపుతుంది.
- source_word: וְהָיִינוּ נְקִיִּם
  choice: మేము విముక్తులమవుతాం
  rationale: היה + נקי అనే హీబ్రూ నుడికారం బాధ్యత లేదా బంధం నుంచి విడుదల కావడాన్ని సూచిస్తుంది. ‘విముక్తులమవుతాం’ ప్రమాణం ఇక వారిని బంధించదనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִשְּׁבֻעָתֵךְ
  choice: ప్రమాణం నుంచి
  rationale: מן విభక్తి వేరుపడటం లేదా విడుదలను సూచిస్తుంది. రెండవ పురుష ఏకవచన స్త్రీ ప్రత్యయం రాహాబు వారితో చేయించిన ప్రమాణాన్ని సూచిస్తున్నందున, తరువాతి సంబంధ వాక్యంతో కలిపి సహజమైన తెలుగులో అందించబడింది.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: నీవు మాతో చేయించిన
  rationale: 'שׁבע హిఫీల్ రూపం కారణార్థకం: రాహాబు వారిచేత ప్రమాణం చేయించింది. ‘మాతో చేయించిన’ ఆ కారణార్థక భావాన్ని నేరుగా నిలుపుతుంది.'
