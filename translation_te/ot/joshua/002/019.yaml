source:
  edition: WLC
  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/019.yaml
  text: Anyone who goes out through the doors of your house, his blood will be on his own head, and we will be guiltless; but anyone who is with you in the house, his blood will be on our heads[a] if a hand is laid on him.
translation:
  language: te
  text: నీ ఇంటి తలుపులు దాటి బయటికి వెళ్లే ప్రతి ఒక్కరి రక్తం వారి తలమీదే ఉంటుంది; మేము నిర్దోషులుగా ఉంటాము. అయితే ఇంట్లో నీతో ఉండే ప్రతి ఒక్కరి రక్తం మా తలలమీద ఉంటుంది[a]—ఎవరైనా వారిమీద చెయ్యి వేస్తే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రక్తం వారి తలమీదే ఉంటుంది,” “రక్తం మా తలలమీద ఉంటుంది” అనేవి రక్తపాతం లేదా మరణానికి ఎవరు బాధ్యులో తెలిపే న్యాయపరమైన నుడికారాలు.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: ప్రత్యేకంగా అనువదించకుండా షరతు వాక్యంతో ప్రారంభించడం
  rationale: ఇది తదుపరి ఒప్పంద షరతును పరిచయం చేస్తుంది; తెలుగులో నేరుగా షరతును చెప్పడం సహజం.
- source_word: כֹּל אֲשֶׁר
  choice: ప్రతి ఒక్కరు
  rationale: సందర్భంలో ఇది వ్యక్తులను ఒక్కొక్కరిగా సూచిస్తుంది; ఆధునిక తెలుగులో ఈ ప్రయోగం సహజంగా ఉంటుంది.
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  choice: నీ ఇంటి తలుపులు దాటి బయటికి వెళ్లే
  rationale: హీబ్రూ దిశార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తూ అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: דָּמוֹ בְרֹאשׁוֹ
  choice: వారి రక్తం వారి తలమీదే ఉంటుంది
  rationale: మరణానికి లేదా రక్తపాతానికి బాధ్యతను కేటాయించే న్యాయపరమైన మూలభాషా రూపకాన్ని నిలుపుతుంది.
- source_word: וַאֲנַחְנוּ נְקִיִּם
  choice: మేము నిర్దోషులుగా ఉంటాము
  rationale: ప్రమాణం కింద బాధ్యత లేదా అపరాధం తమపై ఉండదనే న్యాయపరమైన భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת
  choice: అయితే ఇంట్లో నీతో ఉండే ప్రతి ఒక్కరు
  rationale: ఇంటి లోపల ఉండేవారికి వర్తించే వ్యతిరేక షరతును స్పష్టంగా చూపిస్తుంది.
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  choice: వారి రక్తం మా తలలమీద ఉంటుంది
  rationale: గూఢచారులపై బాధ్యతను ఉంచే సమాంతర న్యాయపరమైన రూపకాన్ని కాపాడుతుంది.
- source_word: אִם יָד תִּהְיֶה בּוֹ
  choice: ఎవరైనా వారిమీద చెయ్యి వేస్తే
  rationale: హింసించడం లేదా హాని చేయడం అనే హీబ్రూ నుడికారాన్ని కర్తను నిర్దిష్టం చేయకుండా సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: రక్తబాధ్యత నుడికారాన్ని నిలుపుకోవడం
  choice: “రక్తం వారి తలమీదే / మా తలలమీద” అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: “తమ మరణానికి వారే బాధ్యులు / వారి మరణానికి మేమే బాధ్యులం” అని అర్థానువాదం చేయడం
  rationale: మూలంలోని ఒప్పందపరమైన, న్యాయపరమైన గాంభీర్యం మరియు సమాంతర నిర్మాణం నిలుస్తాయి; పాదటిప్పణి నుడికారాన్ని వివరిస్తుంది.
- issue: అనిర్దిష్ట వ్యక్తికి లింగ సూచన
  choice: తెలుగులో సహజమైన గౌరవ/లింగతటస్థ బహువచన రూపాలైన “వారి/వారిమీద” వాడడం
  alternative: వ్యాకరణ ఏకవచనాన్ని అనుసరించి “అతని/అతనిమీద” వాడడం
  rationale: హీబ్రూ పురుష ఏకవచనం ఇక్కడ ఏ లింగానికైనా వర్తించే న్యాయపరమైన ప్రతినిధి రూపం. ఆధునిక తెలుగులో “ప్రతి ఒక్కరు…వారి” సహజంగా ఉండి అర్థాన్ని లింగపరంగా అనవసరంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఒప్పందపు న్యాయపరమైన గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. రాహాబును ఉద్దేశించినందున “నీ” వాడబడింది; అనిర్దిష్ట వ్యక్తుల విషయంలో సహజమైన “వారి” రూపం ఉపయోగించబడింది.
