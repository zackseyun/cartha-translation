  text: וַ/תּוֹרִדֵ֥/ם בַּ/חֶ֖בֶל בְּעַ֣ד הַֽ/חַלּ֑וֹן כִּ֤י בֵיתָ/הּ֙ בְּ/קִ֣יר הַֽ/חוֹמָ֔ה וּ/בַֽ/חוֹמָ֖ה הִ֥יא יוֹשָֽׁבֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/015.yaml
  text: Then she let them down by a rope through the window[a], because her house was in the wall of the city, and she was living in the wall.
translation:
  language: te
  text: అప్పుడు ఆమె కిటికిగుండా తాడుతో వారిని కిందికి దింపింది. ఎందుకంటే ఆమె ఇల్లు పట్టణ ప్రాకారపు గోడలో ఉండేది; ఆమె ఆ ప్రాకారంలోనే నివసించేది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె ఇల్లు పట్టణ ప్రాకారం మీద ఉండేది; ఆమె ఆ ప్రాకారం మీద నివసించేది.” హెబ్రూ వాక్యం ఆమె నివాసం ప్రాకార నిర్మాణంలోగానీ దానిమీదగానీ నెలకొని ఉన్నట్లు చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹרִדֵם
  choice: అప్పుడు ఆమె వారిని కిందికి దింపింది
  rationale: ירד హిఫీల్ రూపం ‘కిందికి వెళ్లేలా చేయడం’ అనే కారణార్థక భావాన్ని ఇస్తుంది. తాడు ద్వారా మనుషులను దింపే సందర్భంలో ‘కిందికి దింపింది’ సహజమైన ఆధునిక తెలుగు; వావ్-క్రమకథనాన్ని ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: בַּחֶבֶל
  choice: తాడుతో
  rationale: חֶבֶל అంటే ‘తాడు’ లేదా ‘త్రాడు.’ ఇక్కడ בְּ సాధనార్థకంగా ఉంది; అందువల్ల ‘తాడుతో’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: בְּעַד הַחַלּוֹן
  choice: కిటికిగుండా
  rationale: בְּעַד ఇక్కడ ఒక రంధ్రం లేదా తెరువు గుండా వెళ్లడాన్ని సూచిస్తుంది. ‘కిటికిగుండా’ మూలంలోని దిశను స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ సందర్భంలో כִּי, కిటికిగుండా వారిని దింపడం ఎలా సాధ్యమైందో వివరిస్తున్న కారణాన్ని పరిచయం చేస్తుంది.
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה
  choice: ఆమె ఇల్లు పట్టణ ప్రాకారపు గోడలో ఉండేది
  rationale: ఈ పదబంధం ఆమె ఇల్లు ప్రాకార నిర్మాణంలో లేదా దానిపై నెలకొని ఉందని సూచిస్తుంది. ‘ప్రాకారపు గోడలో’ హెబ్రూ నిర్మాణానికి దగ్గరగా ఉండి, ఇంటి నిర్మాణస్థానాన్ని అనవసరంగా ఖచ్చితీకరించదు.
- source_word: וּבַחוֹמָה הִיא יוֹשָׁבֶת
  choice: ఆమె ఆ ప్రాకారంలోనే నివసించేది
  rationale: יָשַׁב అంటే ‘కూర్చోవడం, నివసించడం’; క్రియావిశేషణ రూపం కొనసాగుతున్న నివాసాన్ని సూచిస్తుంది. ‘లోనే’ పూర్వపు వాక్యభాగాన్ని తిరిగి నొక్కిచెప్పే భావాన్ని అందిస్తుంది.
