translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ప్రాకారం’ పట్టణ రక్షణ గోడను సహజంగా సూచిస్తుంది. హెబ్రూ בְּ యొక్క ‘లో/మీద’ స్థానార్థక సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా నిలిపి ఉంచాం.
