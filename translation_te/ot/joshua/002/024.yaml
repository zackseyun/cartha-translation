  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֙ אֶל יְהוֹשֻׁ֔עַ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יָדֵ֖/נוּ אֶת כָּל הָ/אָ֑רֶץ וְ/גַם נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פָּנֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: te
  text: వారు యెహోషువతో, “నిశ్చయంగా యెహోవా ఈ దేశమంతటినీ మన చేతికి అప్పగించాడు. అంతేకాదు, ఈ దేశ నివాసులందరూ మన ఎదుట భయంతో కరిగిపోయారు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: నిశ్చయంగా
  rationale: ఇక్కడ గూఢచారుల నిర్ధారణను బలంగా తెలియజేసే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: మన చేతికి అప్పగించాడు
  rationale: ‘చేతిలో ఇచ్చాడు’ అనే హెబ్రీయ నుడికారంలోని అధీనపరచడం/వశం చేయడం అనే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: נָמֹגוּ
  choice: భయంతో కరిగిపోయారు
  rationale: మూలంలోని ‘కరిగిపోవడం’ అనే రూపకాన్ని నిలుపుతూ, సందర్భంలో అది ధైర్యం క్షీణించడాన్ని సూచిస్తుందని తెలుపుతుంది.
- source_word: מִפָּנֵינוּ
  choice: మన ఎదుట
  rationale: ‘మన కారణంగా/మన సన్నిధిలో’ అనే పరిధిని పూర్తిగా ఒకే విధంగా నిర్ణయించకుండా సహజమైన తెలుగు రూపాన్ని ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపాన్ని ఉపయోగించి, మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: దేవుడు దేశాన్ని ఇచ్చిన కార్యం యొక్క కాలబలం
  choice: అప్పగించాడు
  alternative: అప్పగిస్తున్నాడు
  rationale: మూలంలోని సంపూర్ణ క్రియను అనుసరించి, స్వాధీనం ఇంకా పూర్తికాకపోయినా దేవుని కార్యం నిశ్చితమైనదిగా గూఢచారులు చెప్పిన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ‘కరిగిపోయారు’ రూపకాన్ని నిలుపుతూ సందర్భార్థం కోసం ‘భయంతో’ చేర్చబడింది.
