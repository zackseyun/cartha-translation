translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. హీబ్రూ పాఠం పేర్కొనని ‘గూఢచారులు’ లేదా ‘యొర్దాను’ వంటి వివరాలను చేర్చలేదు; అస్పష్టంగా ఉన్న దాటిన వస్తువును అస్పష్టంగానే ఉంచాం.
