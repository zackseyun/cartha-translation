source:
  edition: WLC
  text: וַ/יָּשֻׁ֜בוּ שְׁנֵ֤י הָֽ/אֲנָשִׁים֙ וַ/יֵּרְד֣וּ מֵֽ/הָ/הָ֔ר וַ/יַּעַבְרוּ֙ וַ/יָּבֹ֔אוּ אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וַ/יְסַ֨פְּרוּ ל֔/וֹ אֵ֥ת כָּל הַ/מֹּצְא֖וֹת אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
translation:
  language: te
  text: ఆ ఇద్దరు మనుషులు తిరిగి వచ్చి, కొండ ప్రాంతం నుండి దిగి, దాటి, నూను కుమారుడైన యెహోషువ దగ్గరకు వచ్చారు; తమకు జరిగిన సంగతులన్నిటినీ[a] అతనికి తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమకు సంభవించినదంతా”; మరింత అక్షరార్థంగా, “తమను కనుగొన్న సంగతులన్నీ.”
    reason: హీబ్రూ నుడికారమైన כָּל הַמֹּצְאוֹת אוֹתָם యొక్క ప్రత్యామ్నాయ, మరింత అక్షరార్థ భావాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: తిరిగి వచ్చి
  rationale: שׁוב్ అనే క్రియ కథన క్రమంలో వారు తమ గూఢచర్య ప్రయాణం నుంచి తిరిగి రావడాన్ని సూచిస్తుంది. ‘తిరిగి వచ్చి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: ఆ ఇద్దరు మనుషులు
  rationale: హీబ్రూ పాఠంలో పాత్రను సూచించే ‘గూఢచారులు’ కాకుండా ‘ఇద్దరు మనుషులు’ అని ఉంది; ముందరి సందర్భాన్ని సూచించేందుకు తెలుగులో ‘ఆ’ చేర్చడం సహజం.
- source_word: וַיֵּרְדוּ מֵהָהָר
  choice: కొండ ప్రాంతం నుంచి దిగి
  rationale: הָהָר ఒకే కొండను మాత్రమే కాక కొండల ప్రాంతాన్ని కూడా సూచించగలదు. సందర్భ భౌగోళికతకు ‘కొండ ప్రాంతం’ సరిపోతుంది.
- source_word: וַיַּעַבְרוּ
  choice: దాటి
  rationale: עבר ఇక్కడ ‘దాటడం’ అనే అర్థం ఇస్తుంది. పాఠం దేనిని దాటారో చెప్పనందున అనువాదం కూడా కర్మను చేర్చకుండా సంక్షిప్తతను నిలుపుతుంది.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువ దగ్గరకు వచ్చారు
  rationale: בוא + אֶל ను సహజ తెలుగులో ‘దగ్గరకు వచ్చారు’గా ఇచ్చి, తండ్రి పేరుతో కూడిన గుర్తింపును యథాతథంగా నిలిపాం.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: అతనికి వివరించారు
  rationale: పియేల్ రూపంలోని ספר ఇక్కడ జరిగిన విషయాలను చెప్పడం లేదా వివరంగా నివేదించడం అనే భావం ఇస్తుంది; ‘వివరించారు’ ఈ సందర్భంలో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  choice: తమకు జరిగినదంతా
  rationale: ‘తమను కనుగొన్న సంగతులన్నీ’ అనే అక్షరార్థ నిర్మాణం, తమకు సంభవించినదంతా అనే హీబ్రూ నుడికార భావాన్ని కలిగిస్తుంది. ‘తమకు జరిగినదంతా’ మొత్తం భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
