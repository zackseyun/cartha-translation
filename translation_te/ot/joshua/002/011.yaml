source:
  edition: WLC
  text: וַ/נִּשְׁמַע֙ וַ/יִּמַּ֣ס לְבָבֵ֔/נוּ וְ/לֹא קָ֨מָה ע֥וֹד ר֛וּחַ בְּ/אִ֖ישׁ מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
translation:
  language: te
  text: మేము అది విన్నప్పుడు, మా హృదయాలు కరిగిపోయాయి; మీ కారణంగా ఎవరిలోనూ ఇక ధైర్యం మిగలలేదు[a]. ఎందుకంటే మీ దేవుడైన యాహ్వే[b]—ఆయనే పైనున్న ఆకాశంలోనూ కిందనున్న భూమిమీదనూ దేవుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఎవరిలోనూ ఇక ఆత్మ లేవలేదు.” ఇక్కడ “ఆత్మ” అంటే ధైర్యం లేదా స్థైర్యం.
    reason: lexical_alternative
  - marker: b
    text: “యాహ్వే” అనేది హెబ్రీ దైవనామమైన YHWH (יהוה) యొక్క ధ్వన్యంతరీకరణ.
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  choice: మేము అది విన్నప్పుడు
  rationale: ముందరి వాక్యాల్లో చెప్పబడిన వార్తను విన్న సందర్భాన్ని ఈ క్రియ సూచిస్తుంది. తెలుగులో సహజమైన కాలసంబంధాన్ని చూపడానికి ‘విన్నప్పుడు’ అని, సందర్భం నుంచి గ్రహించబడే కర్మను ‘అది’ అని ఇచ్చాం.
- source_word: וַיִּמַּס לְבָבֵנוּ
  choice: మా హృదయాలు కరిగిపోయాయి
  rationale: భయంతో ధైర్యం కోల్పోవడాన్ని తెలిపే హెబ్రీ రూపకాన్ని తెలుగులోనూ సహజంగా నిలిపింది.
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  choice: ఎవరిలోనూ ఇక ధైర్యం మిగలలేదు
  rationale: ఇక్కడ רוּחַ గాలి లేదా పరిశుద్ధాత్మను కాకుండా అంతరంగ ధైర్యాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో అర్థాన్ని సహజంగా తెలిపి, హెబ్రీ పదచిత్రాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִפְּנֵיכֶם
  choice: మీ కారణంగా
  rationale: అక్షరార్థంగా ‘మీ సన్నిధి/ముఖం ఎదుటనుంచి’ అనే భావం ఉన్నా, ఈ సందర్భంలో ఇశ్రాయేలీయుల వల్ల కలిగిన భయానికి కారణాన్ని సూచిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందు చెప్పిన భయానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ ధ్వన్యంతరీకరణగా ఇచ్చాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: దైవనామంతో అన్వయించే ‘మీ దేవుడు’ అనే సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הוּא אֱלֹהִים
  choice: ఆయనే … దేవుడు
  rationale: హెబ్రీలోని స్పష్టమైన సర్వనామ ఉద్ఘాటనను నిలిపి, పాఠ్యంలో లేని ‘ఒక్కడే’ లేదా ‘నిజమైన’ వంటి పదాలను చేర్చలేదు.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: పైనున్న ఆకాశంలోనూ కిందనున్న భూమిమీదనూ
  rationale: ఆకాశం–భూమి అనే సమగ్ర జంటను, అలాగే పై–కింది వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలిపింది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది; పాఠకులకు వివరణను పాదసూచికలో ఇచ్చాం.
- issue: రాహాబు ఒప్పుకోలు ఎంతవరకు ప్రత్యేకత్వాన్ని ప్రకటిస్తుంది
  choice: ఆయనే … దేవుడు
  alternative: ఆయన ఒక్కడే దేవుడు / ఆయనే నిజమైన దేవుడు
  rationale: హెబ్రీ వాక్యం యాహ్వే ఆకాశంలోనూ భూమిమీదనూ దేవుడని బలంగా ప్రకటిస్తుంది. అయితే ‘ఒక్కడే’ లేదా ‘నిజమైన’ అనే అదనపు విశేషణాలు ప్రత్యక్షంగా లేనందున వాటిని చేర్చలేదు.
- issue: רוּחַ యొక్క భావం
  choice: ధైర్యం
  alternative: ఆత్మ / ఊపిరి
  rationale: ఈ భయసందర్భంలో ఈ పదం మనిషిలోని ధైర్యం లేదా స్థైర్యాన్ని సూచిస్తుంది. ‘ఆత్మ’ అని ఇస్తే వేరే తాత్త్విక అర్థం కలిగే అవకాశం ఉంది; అక్షర రూపాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘హృదయాలు కరిగిపోయాయి’ అనే మూల రూపకం నిలిపి, ‘ధైర్యం మిగలలేదు’ అనే భావాన్ని సహజంగా వ్యక్తం చేశాం. దైవనామానికి ‘యాహ్వే’ వాడబడింది; మతశాఖాపరమైన అదనపు పదజాలం చేర్చలేదు.
