reference: Joshua 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הָ֣/אֲנָשִׁ֔ים יָדַ֕עְתִּי כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ וְ/כִֽי נָפְלָ֤ה אֵֽימַתְ/כֶם֙ עָלֵ֔י/נוּ וְ/כִ֥י נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
translation:
  language: te
  text: 'ఆమె ఆ పురుషులతో ఇలా చెప్పింది: “యాహ్వే ఈ దేశాన్ని మీకు ఇచ్చాడని, మీ వల్ల కలిగిన భీతి మా మీద పడిందని[a], ఈ దేశ నివాసులందరూ మీ ఎదుట కరిగిపోయారని[b] నాకు తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని గురించిన భీతి మా మీద పడింది.”
    reason: אֵימָה అనే పదం సాధారణ భయంకన్నా తీవ్రమైన భీతి లేదా దిగ్భ్రాంతిని కూడా సూచించగలదు.
  - marker: b
    text: లేదా, “ఈ దేశ నివాసులందరూ మీ కారణంగా ధైర్యం కోల్పోయారు.” హీబ్రూ క్రియకు అక్షరార్థం “కరిగిపోయారు.”
    reason: హీబ్రూ రూపకం ధైర్యం పూర్తిగా సడలిపోవడాన్ని సూచిస్తుంది; מִפְּנֵיכֶם అనే నుడికారం ‘మీ ఎదుట’ లేదా ‘మీ కారణంగా’ అనే భావాలను ఇవ్వగలదు.
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־הָאֲנָשִׁים
  choice: ఆమె ఆ పురుషులతో ఇలా చెప్పింది
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో సహజమైన కథన ప్రవాహం కోసం ప్రత్యేకంగా ‘మరియు’ చేర్చలేదు. నిర్దిష్ట ఉపపదాన్ని ‘ఆ పురుషులు’గా నిలిపి, సందర్భంలోని గూఢచారులను సూచించాం.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: ఈ సంపూర్ణ క్రియ ఇక్కడ ప్రస్తుతం కొనసాగుతున్న స్థిరమైన జ్ఞానాన్ని వ్యక్తపరుస్తుంది; తెలుగు వర్తమాన స్థితి సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ‘తెలుసు’ అనే క్రియకు అనుసంధానమైన మూడు విషయవాక్యాలను పరిచయం చేస్తుంది.
- source_word: נָתַן יְהוָה לָכֶם אֶת־הָאָרֶץ
  choice: యాహ్వే ఈ దేశాన్ని మీకు ఇచ్చాడు
  rationale: స్వాధీనం ఇంకా కొనసాగుతున్నప్పటికీ, రాహాబు దృష్టిలో దానం నిశ్చయంగా జరిగినదిగా సంపూర్ణ క్రియ చూపుతుంది. తెలుగులో ‘ఇచ్చాడు’ ఆ నిశ్చిత సంపూర్ణతను సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, దాని సాధారణ శాస్త్రీయ లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ఇచ్చాం.
- source_word: הָאָרֶץ
  choice: ఈ దేశం
  rationale: సందర్భంలో ఇది ఇశ్రాయేలీయుల ఎదుట ఉన్న కనాను భూభాగాన్ని సూచిస్తుంది. తెలుగు పాఠకునికి నిర్దిష్ట సందర్భార్థం స్పష్టమయ్యేందుకు ‘ఈ దేశం’ సహజంగా ఉంది.
- source_word: נָפְלָה אֵימַתְכֶם עָלֵינוּ
  choice: మీపట్ల భయం మా మీద పడింది
  rationale: ‘పడింది ... మీద’ అనే హీబ్రూ రూపకాన్ని నిలిపి, భయం ఇశ్రాయేలీయులవల్ల కలిగిందనే అర్థాన్ని ‘మీపట్ల’ ద్వారా స్పష్టం చేశాం. אֵימָה యొక్క మరింత తీవ్ర ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: נָמֹגוּ
  choice: కరిగిపోయారు
  rationale: ధైర్యం కోల్పోవడాన్ని సూచించే ‘కరిగిపోవడం’ అనే మూల రూపకాన్ని నిలిపాం; భావార్థాన్ని పాదసూచికలో వివరించాం.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: ఈ దేశ నివాసులందరూ
  rationale: భూభాగంలో నివసించేవారందరినీ సూచించే భాగధాతు నామార్థాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: מִפְּנֵיכֶם
  choice: మీ ఎదుట
  rationale: ఉనికి లేదా సమీపం, అలాగే కారణం అనే రెండింటినీ సూచించగల హీబ్రూ నుడికారాన్ని ‘మీ ఎదుట’ సమీపంగా నిలుపుతుంది; కారణార్థాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. బిరుదును ప్రతిస్థాపించకుండా నామాన్ని నిలిపి, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణ ‘Yahweh’ను తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: దేశం ఇప్పటికే ఇవ్వబడిందనే సంపూర్ణ క్రియ
  choice: ఇచ్చాడు
  alternative: ఇస్తున్నాడు
  rationale: కనాను స్వాధీనం ఇంకా పూర్తికాకపోయినా, రాహాబు మాటలో దేవుని దానం నిశ్చితంగా జరిగిన వాస్తవంగా చెప్పబడింది. దానిని కొనసాగుతున్న ప్రక్రియగా మాత్రమే మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని మూడు సమన్విత విషయవాక్యాలను ఒకే ‘నాకు తెలుసు’ కింద ఉంచాం. ‘కరిగిపోయారు’ అనే సజీవ హీబ్రూ రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, దాని భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
