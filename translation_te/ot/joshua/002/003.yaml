translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. రాజు ఆజ్ఞలోని నేరస్వరాన్ని నిలిపాం. ‘గూఢంగా పరిశీలించడానికి’ అనే ప్రధాన పాఠ్యం חפר లోని వెదకడం/పరిశీలించడం మరియు నిఘా అనే సందర్భార్థాల మధ్య ఉన్న భావ పరిధిని నిలుపుతుంది; మరింత స్పష్టమైన ‘గూఢచర్యం చేయడానికి’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
