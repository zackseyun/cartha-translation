source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ מֶ֣לֶךְ יְרִיח֔וֹ אֶל רָחָ֖ב לֵ/אמֹ֑ר ה֠וֹצִיאִי הָ/אֲנָשִׁ֨ים הַ/בָּאִ֤ים אֵלַ֨יִ/ךְ֙ אֲשֶׁר בָּ֣אוּ לְ/בֵיתֵ֔/ךְ כִּ֛י לַ/חְפֹּ֥ר אֶת כָּל הָ/אָ֖רֶץ בָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/003.yaml
  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
translation:
  language: te
  text: 'అప్పుడు యెరికో రాజు రాహాబుకు ఇలా కబురు పంపాడు: “నీ దగ్గరకు వచ్చి, నీ ఇంట్లోకి ప్రవేశించిన ఆ మనుషులను బయటికి తీసుకురా. ఎందుకంటే వారు దేశమంతటినీ గూఢంగా పరిశీలించడానికి[a] వచ్చారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశమంతటినీ గూఢచర్యం చేయడానికి.” ఇక్కడి హీబ్రూ క్రియ సందర్భంలో రహస్యంగా సమాచారం సేకరించే నిఘా భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: కబురు పంపాడు
  rationale: శׁלח అనే క్రియకు ప్రాథమిక అర్థం ‘పంపాడు.’ ఇక్కడ రాజు రాహాబుకు నేరుగా వెళ్లాడని కాక, ఆజ్ఞతో కూడిన సందేశాన్ని పంపాడని సందర్భం సూచిస్తుంది; అందువల్ల సహజమైన తెలుగులో ‘కబురు పంపాడు’ అని ఇచ్చాం.
- source_word: מֶלֶךְ יְרִיחוֹ
  choice: యెరికో రాజు
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని తెలుగులో సహజంగా ‘యెరికో రాజు’ అని వ్యక్తం చేశాం.
- source_word: אֶל רָחָב
  choice: రాహాబుకు
  rationale: אֶל ఇక్కడ సందేశం చేరవలసిన వ్యక్తిని సూచిస్తుంది; దానికి ‘రాహాబుకు’ సరిపోతుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష ఉక్తిని పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఇలా’ అని ఇచ్చాం.
- source_word: הוֹצִיאִי
  choice: బయటికి తీసుకురా
  rationale: יצא హిఫీల్ స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం, ‘బయటికి వచ్చేలా చేయి’ అనే బలమైన ఆజ్ఞను సూచిస్తుంది; ‘బయటికి తీసుకురా’ దాని సహజ తెలుగు రూపం.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులను
  rationale: ఇక్కడ పదం రాహాబు ఇంటికి వచ్చిన పురుషులను సూచిస్తుంది. ముందే నిర్దిష్టులైన వారని తెలిపేందుకు ‘ఆ’ చేర్చాం.
- source_word: הַבָּאִים אֵלַיִךְ
  choice: నీ దగ్గరకు వచ్చి
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయంతో ఉన్న אֵלַיִךְ రాహాబును ఉద్దేశిస్తుంది. తెలుగులో తరువాతి సంబంధవాక్యంతో సాఫీగా కలవడానికి ‘నీ దగ్గరకు వచ్చి’ అని ఇచ్చాం.
- source_word: אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  choice: నీ ఇంట్లోకి ప్రవేశించిన
  rationale: రెండవ בוא వారి ఇంట్లోనికి రాకను మరింత నిర్దిష్టం చేస్తుంది. పునరుక్తిని తగ్గిస్తూ గమనార్థాన్ని నిలుపుటకు ‘ప్రవేశించిన’ అని అనువదించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రాజు ఇచ్చిన ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לַחְפֹּר
  choice: గూఢంగా పరిశీలించడానికి
  rationale: חפר ప్రాథమికంగా తవ్వడం/వెదకడం అనే భావం కలిగినా, ఇక్కడ దేశం గురించి రహస్యంగా సమాచారం సేకరించే నిఘా చర్యను సూచిస్తుంది. ‘గూఢంగా పరిశీలించడం’ సందర్భార్థాన్ని సహజంగా అందిస్తూ, నేరుగా ‘గూఢచర్యం చేయడం’ అనే మరింత నిర్దిష్ట పదాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా పెట్టదు.
- source_word: אֶת כָּל הָאָרֶץ
  choice: దేశమంతటినీ
  rationale: הָאָרֶץ ఇక్కడ భూమండలం కాక, పరిశీలనకు గురైన దేశం లేదా ప్రాంతాన్ని సూచిస్తుంది. తెలుగులో ‘దేశమంతటినీ’ ఆ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּאוּ
  choice: వచ్చారు
  rationale: పూర్తయిన రాకను తెలిపే సాధారణ భూతకాల రూపం తెలుగులో సందర్భానికి సహజంగా సరిపోతుంది.
