translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రత్యక్ష సంభాషణకు తగిన స్పష్టమైన కానీ గౌరవప్రదమైన శైలి. రాహాబును ఏకవచనంగా సంబోధించే రూపాలు నిలుపబడ్డాయి; షరతు-ఆదేశ స్వరానికి ‘కట్టాలి’, ‘సమకూర్చాలి’ వాడబడ్డాయి.
