source:
  edition: WLC
  text: הִנֵּ֛ה אֲנַ֥חְנוּ בָאִ֖ים בָּ/אָ֑רֶץ אֶת תִּקְוַ֡ת חוּט֩ הַ/שָּׁנִ֨י הַ/זֶּ֜ה תִּקְשְׁרִ֗י בַּֽ/חַלּוֹן֙ אֲשֶׁ֣ר הוֹרַדְתֵּ֣/נוּ ב֔/וֹ וְ/אֶת אָבִ֨י/ךְ וְ/אֶת אִמֵּ֜/ךְ וְ/אֶת אַחַ֗יִ/ךְ וְ/אֵת֙ כָּל בֵּ֣ית אָבִ֔י/ךְ תַּאַסְפִ֥י אֵלַ֖יִ/ךְ הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
translation:
  language: te
  text: “చూడు, మేము ఈ దేశంలోకి వచ్చినప్పుడు, నువ్వు మమ్మల్ని కిందికి దించిన కిటికీలో ఈ ఎర్రని తాడును[a] కట్టాలి. నీ తండ్రిని, నీ తల్లిని, నీ సోదరులను, నీ తండ్రి ఇంటివారందరినీ నీ ఇంట్లోకి చేర్చుకోవాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఈ ఎర్రని నూలుదారపు గీతను.”
    reason: תִּקְוַת חוּט הַשָּׁנִי అనే పదబంధం సందర్భంలో ‘తాడు’ను సూచిస్తుంది; పదాల అక్షరార్థంలో నూలుదారం/గీత అనే భావం కూడా ఉంది.
lexical_decisions:
- source_word: הִנֵּה
  choice: చూడూ
  rationale: సంభాషణలో ఎదుటివారి శ్రద్ధను ఆకర్షించే అవ్యయ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָאִים בָּאָרֶץ
  choice: మేము ఈ దేశంలోకి వచ్చినప్పుడు
  rationale: వర్తమాన కృదంతం సందర్భంలో భవిష్యత్తులో జరగబోయే ప్రవేశాన్ని సూచిస్తుంది; షరతుతో కూడిన ఏర్పాటుకు ‘వచ్చినప్పుడు’ సహజంగా సరిపోతుంది.
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  choice: ఈ ఎర్రని దారపు తాడు
  rationale: తాడు/దారం అనే పదసముదాయంలోని రెండు అంశాలనూ సాధ్యమైనంతవరకు నిలుపుతూ, గుర్తుగా కిటికీకి కట్టే వస్తువును స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִּקְשְׁרִי
  choice: కట్టాలి
  rationale: స్త్రీ ఏకవచన సంబోధనలో ఇచ్చిన నిబంధనాత్మక ఆదేశాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  choice: నువ్వు మమ్మల్ని కిందికి దించిన కిటికీకి
  rationale: హిఫీల్ క్రియలోని ‘కిందికి దింపడం’ అనే causative భావాన్ని నిలుపుతుంది; తెలుగులో తాడు కిటికీకి కట్టడమనే భావం సహజంగా ఉంటుంది.
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  choice: నీ దగ్గరికి ఇంట్లోకి సమకూర్చాలి
  rationale: వ్యక్తులను తనవద్దకు చేర్చుకోవడం మరియు ఇంటి లోపలికి తీసుకురావడం అనే రెండు దిశా భావాలనూ నిలుపుతుంది.
- source_word: אָבִיךְ ... אִמֵּךְ ... אַחַיִךְ
  choice: నీ తండ్రిని, నీ తల్లిని, నీ సహోదరులను
  rationale: మూలంలోని బంధుత్వ పదాలను నేరుగా, గౌరవప్రదంగా అందిస్తుంది; ‘సహోదరులు’ పుంలింగ బహువచన రూపానికి అనుగుణంగా ఉంది.
- source_word: כָּל בֵּית אָבִיךְ
  choice: నీ తండ్రి ఇంటివారందరినీ
  rationale: ఇక్కడ ‘ఇల్లు’ భవనాన్ని కాక కుటుంబ/గృహ సమూహాన్ని సూచిస్తుంది; ‘ఇంటివారు’ ఆ సామాజిక భావాన్ని స్పష్టంగా అందిస్తుంది.
