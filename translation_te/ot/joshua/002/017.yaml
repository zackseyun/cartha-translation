language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ אֵלֶ֖י/הָ הָ/אֲנָשִׁ֑ים נְקִיִּ֣ם אֲנַ֔חְנוּ מִ/שְּׁבֻעָתֵ֥/ךְ הַ/זֶּ֖ה אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/017.yaml
  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
translation:
  language: te
  text: 'ఆ మనుషులు ఆమెతో ఇలా అన్నారు: “నీవు మాతో చేయించిన ఈ ప్రమాణం నుంచి మేము విముక్తులమవుతాము[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు మాతో చేయించిన ఈ ప్రమాణం నుంచి మేము విముక్తులము.” హీబ్రూ విశేషణం న్యాయపరమైన లేదా ఒడంబడిక సందర్భంలో బాధ్యత నుంచి విముక్తిగా లేదా విడుదల పొందినవారిగా ఉండడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అన్నారు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో వాక్యాంతంలోని ‘అన్నారు’ సహజమైన కథన క్రమాన్ని ఇస్తుంది.
- source_word: אֵלֶיהָ
  choice: ఆమెతో
  rationale: రాహాబును ఉద్దేశించి మాట్లాడారని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: మూలంలో సాధారణంగా ‘మనుషులు/పురుషులు’ అనే పదమే ఉంది; సందర్భంలోని ‘గూఢచారులు’ అనే ప్రత్యేక పాత్రను అనువాదంలో చేర్చలేదు.
- source_word: נְקִיִּם אֲנַחְנוּ
  choice: మాకు బాధ్యత ఉండదు
  rationale: ప్రమాణ సంబంధమైన న్యాయ లేదా ఒడంబడిక సందర్భంలో נָקִי బాధ్యత నుంచి స్వేచ్ఛగా లేదా నిర్బంధం లేకుండా ఉండడాన్ని సూచిస్తుంది. తరువాత చెప్పబోయే షరతుల సందర్భంలో భవిష్యత్ ఫలితాన్ని సహజంగా వ్యక్తం చేస్తూనే, దీనిని నైతిక నిర్దోషిత్వంగా మార్చదు.
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  choice: ఈ ప్రమాణం విషయంలో
  rationale: מִן ఇక్కడ ప్రమాణబద్ధమైన బాధ్యత నుంచి విడుదలను సూచిస్తుంది. ‘ఈ’ నిర్దేశకాన్ని నిలుపుతూ, తెలుగులో సహజంగా బాధ్యతకు సంబంధించిన పరిధిని తెలియజేస్తుంది; రెండవ పురుష ఏకవచన స్త్రీలింగ సంబంధం తరువాతి ఉపవాక్యంలోని ‘నీవు’ ద్వారా స్పష్టమవుతుంది.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: నీవు మాతో చేయించిన
  rationale: 'שׁבע హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతుంది: ఆమె కేవలం వారితో ప్రమాణం చేయలేదు, వారిచేత ప్రమాణం చేయించింది.'
theological_decisions:
- issue: נְקִיִּם యొక్క న్యాయ/ఒడంబడిక భావం మరియు కాల సూచన
  choice: ‘మాకు బాధ్యత ఉండదు’ అని సందర్భానుగుణ భవిష్యత్ ఫలితంగా అనువదించడం
  alternative: ‘మేము ఈ ప్రమాణం నుంచి విముక్తులం’ లేదా ‘మేము నిర్దోషులం’
  rationale: హీబ్రూలో విశేషణ వాక్యం స్పష్టమైన కాలాన్ని గుర్తించదు; తరువాతి షరతుల సందర్భం భవిష్యత్ ఫలితాన్ని సూచిస్తుంది. ‘బాధ్యత ఉండదు’ అనేది ప్రమాణబద్ధ బాధ్యత నుంచి విడుదలను తెలియజేస్తుంది; ‘నిర్దోషులు’ అనే నైతిక భావాన్ని అనవసరంగా ముందుకు తేవదు. ప్రత్యామ్నాయ వర్తమాన/స్థితి భావాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే న్యాయ/ఒడంబడిక భాష. మూలంలోని ‘మనుషులు’ అనే సాధారణ నామవాచకాన్ని నిలిపి, ‘గూఢచారులు’ అని వివరణాత్మకంగా మార్చలేదు.
