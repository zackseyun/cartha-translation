translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. భౌగోళిక పదంలోని నిజమైన అనిశ్చితిని పాదసూచికలో నిలుపుతూ, ప్రధాన వాక్యంలో సందర్భానుకూలమైన ‘కొండప్రాంతం’ ఎంచుకోబడింది.
