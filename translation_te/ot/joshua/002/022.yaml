id: JOS.2.22
reference: Joshua 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּלְכוּ֙ וַ/יָּבֹ֣אוּ הָ/הָ֔רָ/ה וַ/יֵּ֤שְׁבוּ שָׁם֙ שְׁלֹ֣שֶׁת יָמִ֔ים עַד שָׁ֖בוּ הָ/רֹדְפִ֑ים וַ/יְבַקְשׁ֧וּ הָ/רֹדְפִ֛ים בְּ/כָל הַ/דֶּ֖רֶךְ וְ/לֹ֥א מָצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
translation:
  language: te
  text: వారు వెళ్లి కొండప్రాంతానికి[a] చేరుకొని, వెంబడించేవారు తిరిగి వచ్చేవరకు మూడు రోజులు అక్కడే ఉన్నారు. వెంబడించేవారు దారిపొడవునా వెదికారు, కానీ వారిని కనుగొనలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కొండకు,” “కొండల్లోకి.” హీబ్రూ పదం ఒకే శిఖరాన్ని కాక, బహుశా యెరికోకు పడమరనున్న కొండప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: వారు వెళ్లి ... చేరుకొని
  rationale: రెండు వరుస కథన క్రియలైన ‘వెళ్లారు, వచ్చారు/చేరారు’ అనే కదలికను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הָהָרָה
  choice: కొండప్రాంతానికి
  rationale: దిశను తెలిపే స్థానవాచక ప్రత్యయం గమ్యాన్ని సూచిస్తుంది; సందర్భంలో ఒకే కొండకన్నా యెరికోకు పడమరనున్న కొండల ప్రాంతం ఉద్దేశమై ఉండవచ్చు.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: అక్కడే ఉన్నారు
  rationale: ఇక్కడ ישב శాశ్వత నివాసాన్ని కాక తాత్కాలికంగా ఉండడాన్ని సూచిస్తుంది.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజులు
  rationale: మూలంలోని సంఖ్యా పదబంధానికి నేరమైన, సహజమైన అనువాదం.
- source_word: עַד שָׁבוּ הָרֹדְפִים
  choice: వెంబడించినవారు తిరిగి వచ్చేవరకు
  rationale: שוב యొక్క ‘తిరిగి రావడం’ అనే భావాన్ని, నామవాచకంగా వాడిన רדפים యొక్క భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַיְבַקְשׁוּ
  choice: వెదికారు
  rationale: వెంబడింపు సందర్భంలో בקש ఉద్దేశపూర్వకంగా వెదకడాన్ని సూచిస్తుంది.
- source_word: בְּכָל הַדֶּרֶךְ
  choice: దారిపొడవునా
  rationale: మొత్తం మార్గమంతటా వెదికారనే כל యొక్క విస్తృత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא מָצָאוּ
  choice: కానీ వారిని కనుగొనలేదు
  rationale: మూలంలో కర్మ వ్యక్తంగా లేకపోయినా సందర్భం ప్రకారం ‘వారిని’ అవసరం; ‘కానీ’ ఫలితంలోని వ్యతిరేకతను సహజంగా తెలుపుతుంది.
