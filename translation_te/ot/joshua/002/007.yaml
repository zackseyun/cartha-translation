    issue: రేవులు for מַעְבָּרוֹת
    rationale: రేవు commonly means a ferry landing/ghat, whereas the Hebrew term broadly indicates crossing places, with fords as the likely contextual referent. “నది దాటే స్థలాలు” avoids narrowing or shifting the sense.
  - severity: low
    issue: The repeated pursuit expression is somewhat reduced in the second clause.
    rationale: The draft is understandable, but “వెంబడించేవారు వారి వెంబడి” more closely preserves הָרֹדְפִים אַחֲרֵיהֶם and remains natural Telugu.
