id: JOS.2.7
reference: Joshua 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ/אֲנָשִׁ֗ים רָדְפ֤וּ אַֽחֲרֵי/הֶם֙ דֶּ֣רֶךְ הַ/יַּרְדֵּ֔ן עַ֖ל הַֽ/מַּעְבְּר֑וֹת וְ/הַ/שַּׁ֣עַר סָגָ֔רוּ אַחֲרֵ֕י כַּ/אֲשֶׁ֛ר יָצְא֥וּ הָ/רֹדְפִ֖ים אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
translation:
  language: te
  text: ఆ మనుషులు వారిని వెంబడిస్తూ యొర్దాను వైపుకు వెళ్లే మార్గంలో నది దాటే స్థలాల వరకు వెళ్లారు.[a] వారిని వెంబడించేవారు వారి వెంబడి బయటికి వెళ్లగానే, పట్టణ ద్వారాన్ని మూసివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాటువద్దల వరకు’; అంటే, యొర్దాను నదిని దాటగల స్థలాల వరకు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: నిర్దిష్ట బహువచనం సందర్భంలోని రాజు పంపిన మనుషులను సూచిస్తుంది. తెలుగు కథనంలో ‘ఆ మనుషులు’ పూర్వసూచనను సహజంగా తెలియజేస్తుంది.
- source_word: רָדְפוּ אַחֲרֵיהֶם
  choice: వారిని వెంబడిస్తూ ... వెళ్లారు
  rationale: רדף యొక్క వెంబడింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; గమ్యమార్గంతో కలిపినప్పుడు ఈ నిర్మాణం సులభంగా చదవబడుతుంది.
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  choice: యొర్దాను దారిలో
  rationale: דֶּרֶךְ ఇక్కడ యొర్దాను వైపు వెళ్లే మార్గాన్ని సూచిస్తుంది; సంక్షిప్తమైన ఈ రూపం దిశా భావాన్ని సందర్భంలో నిలుపుతుంది.
- source_word: עַל הַמַּעְבְּרוֹת
  choice: యొర్దాను దాటే రేవుల వరకు
  rationale: מַעְבָּרוֹת నదిని దాటగల అల్పలోతు ప్రదేశాలను సూచిస్తుంది; ‘రేవులు’ తెలుగు బైబిలు-భౌగోళిక వాడుకలో సహజం, ‘వరకు’ ప్రయాణ గమ్యపరిమితిని తెలియజేస్తుంది.
- source_word: וְהַשַּׁעַר סָגָרוּ
  choice: పట్టణ ద్వారాన్ని మూసివేశారు
  rationale: హీబ్రూలో ‘ద్వారం’ మాత్రమే ఉన్నా, సందర్భంలో అది పట్టణ ద్వారం. తెలుగులో సూచ్యార్థాన్ని స్పష్టపరచడానికి ‘పట్టణ’ చేర్చబడింది.
- source_word: אַחֲרֵי כַּאֲשֶׁר יָצְאוּ
  choice: బయటికి వెళ్లగానే
  rationale: కాలక్రమాన్ని, తక్షణానంతర చర్యను సహజమైన తెలుగు క్రియావిశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: הָרֹדְפִים אַחֲרֵיהֶם
  choice: వారిని వెంబడించినవారు
  rationale: కర్తృవాచక కృదంతాన్ని తెలుగులో సహజంగా అందిస్తూ, గూఢచారులనే వెంబడించారనే సంబంధాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘రేవులు’కు సంభవించే అస్పష్టతను పాదటిప్పణి వివరిస్తుంది; ప్రధాన వాక్యంలో హీబ్రూ కథన క్రమం, వెంబడింపు పునరుక్తి సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
