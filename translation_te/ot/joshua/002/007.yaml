  to: ఆ మనుషులు వారిని వెంబడిస్తూ యొర్దాను వైపుకు వెళ్లే మార్గంలో నది దాటే స్థలాల వరకు వెళ్లారు.[a] వారిని వెంబడించేవారు వారి వెంబడి బయటికి వెళ్లగానే, పట్టణ ద్వారాన్ని మూసివేశారు.
