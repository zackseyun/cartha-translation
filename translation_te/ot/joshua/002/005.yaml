  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
translation:
  language: te
  text: చీకటి పడే వేళ ద్వారం మూయబోతుండగా[a], ఆ మనుషులు బయటికి వెళ్లారు. ఆ మనుషులు ఎక్కడికి వెళ్లారో నాకు తెలియదు. త్వరగా వారిని వెంబడించండి; మీరు వారిని చేరుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చీకటి పడినప్పుడు’; హెబ్రీ పదబంధం చీకటి మొదలయ్యే వేళ ద్వారం మూసే సమయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: పడే సమయానికి ... ఉండగా
  rationale: కథనంలోని తదుపరి సంఘటనకు కాలసంబంధమైన నేపథ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; పాతకాలపు సూత్రబద్ధమైన ప్రారంభాన్ని నివారిస్తుంది.
- source_word: הַשַּׁעַר
  choice: ద్వారం
  rationale: మూలంలోని సాధారణ ‘ద్వారం’ అనే అర్థాన్ని నిలుపుతుంది. సందర్భంలో అది యెరికో పట్టణ ద్వారమే అయినా, ‘పట్టణ’ అనే పదాన్ని మూలంలో లేకుండా చేర్చలేదు.
- source_word: לִסְגֹּר
  choice: మూయబోతుండగా
  rationale: ל తో కూడిన infinitive construct ఇక్కడ సమీపిస్తున్న చర్యను సూచిస్తుంది; ద్వారం మూసే సమయం ఆసన్నమైందనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּחֹשֶׁךְ
  choice: చీకటి పడే సమయానికి
  rationale: చీకటి ఆరంభమయ్యే వేళను సూచించే కాలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘చీకటిలో’ అనే స్థిత్యర్థాన్ని నివారిస్తుంది.
- source_word: וְהָאֲנָשִׁים יָצָאוּ
  choice: ఆ మనుషులు బయటికి వెళ్లిపోయారు
  rationale: יצא యొక్క స్పష్టమైన బయలుదేరే కదలికను నిలుపుతుంది. ‘వెళ్లిపోయారు’ సందర్భంలోని నిష్క్రమణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא יָדַעְתִּי
  choice: నాకు తెలియదు
  rationale: రాహాబు చెప్పుకుంటున్న ప్రస్తుత అజ్ఞానస్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; హెబ్రీ పరిపూర్ణ క్రియారూపాన్ని యాంత్రికంగా భూతకాలంగా మార్చదు.
- source_word: אָנָה הָלְכוּ
  choice: ఎక్కడికి వెళ్లారో
  rationale: אָנָה సూచించే గమ్యదిశను ‘ఎక్కడికి’ స్పష్టంగా నిలుపుతుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: మూలంలో నామవాచకం పునరుక్తమైనందున దానిని నిలిపి, వ్యాఖ్యానాత్మకంగా ‘గూఢచారులు’ అని విస్తరించలేదు.
- source_word: רִדְפוּ
  choice: వెంబడించండి
  rationale: చురుకుగా వెంటపడాలనే బహువచన ఆజ్ఞను గౌరవప్రదమైన ఆధునిక తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: מַהֵר
  choice: త్వరగా
  rationale: ఆజ్ఞను విశేషించే క్రియావిశేషణ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: אַחֲרֵיהֶם
  choice: వారిని
  rationale: తెలుగులో ‘వెంబడించు’ క్రియే వెనుక వెళ్లే భావాన్ని కలిగి ఉంటుంది; అందువల్ల సహజమైన కర్మరూపం సరిపోతుంది.
- source_word: כִּי תַשִּׂיגֻם
  choice: మీరు వారిని అందుకుంటారు
  rationale: כִּי ఇచ్చే కారణసంబంధాన్ని అర్థవిరామంతో సహజంగా అనుసంధానించి, נשׂג హిఫీల్ రూపంలోని వెంబడించి చేరుకునే భావాన్ని ‘అందుకుంటారు’గా నిలుపుతుంది.
