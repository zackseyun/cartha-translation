  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. మూలంలోని పునరుక్తిని అవసరమైన చోట నిలిపి, సందర్భంలో ఉన్నా మూలంలో లేని ‘పట్టణ’ లేదా ‘గూఢచారులు’ వంటి వివరణాత్మక పదాలను చేర్చలేదు. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
