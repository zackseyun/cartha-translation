  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ לָ֣/הּ הָ/אֲנָשִׁ֗ים נַפְשֵׁ֤/נוּ תַחְתֵּי/כֶם֙ לָ/מ֔וּת אִ֚ם לֹ֣א תַגִּ֔ידוּ אֶת דְּבָרֵ֖/נוּ זֶ֑ה וְ/הָיָ֗ה בְּ/תֵת יְהוָ֥ה לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ וְ/עָשִׂ֥ינוּ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
translation:
  language: te
  text: ఆ మనుషులు ఆమెతో, “మీరు మా ఈ విషయాన్ని బయటపెట్టకపోతే, మీ ప్రాణాలకు బదులుగా మా ప్రాణాలే పోతాయి. యాహ్వే ఈ దేశాన్ని మాకు ఇచ్చినప్పుడు, మేము నీ పట్ల దయతోను నమ్మకంగా వ్యవహరిస్తాం[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ పట్ల నిబద్ధమైన ప్రేమతోను, విశ్వసనీయతతోను వ్యవహరిస్తాం.” חֶסֶד וֶאֱמֶת అనే హీబ్రూ పదజంట తరచుగా దయగల, నమ్మదగిన, నిబద్ధమైన ప్రవర్తనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: హీబ్రూ పదం సాధారణంగా ‘మనుషులు/పురుషులు’ అని మాత్రమే చెబుతుంది. సందర్భం వారిని గూఢచారులుగా గుర్తించినా, మూలంలో లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  choice: మీ ప్రాణాలకు బదులుగా మా ప్రాణాలు అర్పిస్తాం
  rationale: נֶפֶשׁ ఇక్కడ ‘ప్రాణం/జీవితం’ అనే భావంలో ఉంది; תַּחַת ప్రతిస్థాపనను, לָמוּת మరణం వరకు వెళ్లే పూచీకత్తును సూచిస్తాయి. తెలుగు వాక్యం ఆ ప్రమాణసదృశమైన ప్రాణపణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אִם לֹא תַגִּידוּ
  choice: మీరు ... బయటపెట్టకపోతే
  rationale: נגד హిఫీల్ రూపానికి ‘చెప్పు, తెలియజేయు, బయటపెట్టు’ అనే అర్థాలున్నాయి. రహస్య విషయాన్ని వెల్లడించకూడదనే సందర్భంలో ‘బయటపెట్టకపోతే’ సహజమైనది. ‘మీరు’ అనే తెలుగు రూపం ఏకవచన గౌరవార్థకంగానూ బహువచనంగానూ ఉండగలదు; అందువల్ల హీబ్రూ బహువచన రూపంలోని అనిశ్చితిని బలవంతంగా పరిష్కరించదు.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: మా ఈ విషయాన్ని
  rationale: דָּבָר ఇక్కడ కేవలం పలికిన ‘మాట’ కంటే గూఢచారుల వ్యవహారం లేదా ఏర్పాటు అనే విస్తృత భావాన్ని ఇస్తుంది; ‘విషయం’ దాన్ని అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  choice: యాహ్వే ఈ దేశాన్ని మాకు ఇచ్చినప్పుడు
  rationale: בְּ + క్రియానామ రూపం కాలసంబంధమైన ‘ఇచ్చినప్పుడు’ అనే భావాన్ని ఇస్తుంది. సందర్భంలోని నిర్దిష్ట దేశాన్ని తెలుగులో సహజంగా సూచించేందుకు ‘ఈ దేశం’ వాడబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וְעָשִׂינוּ עִמָּךְ
  choice: మేము నీ పట్ల ... వ్యవహరిస్తాం
  rationale: עשה עם అనే నిర్మాణం ఒకరి పట్ల ఒక విధంగా ప్రవర్తించడం లేదా వ్యవహరించడం అనే అర్థాన్ని ఇస్తుంది. హీబ్రూలోని స్త్రీలింగ ఏకవచన సంబోధనను ‘నీ పట్ల’ నిలుపుతుంది.
- source_word: חֶסֶד וֶאֱמֶת
  choice: నిబంధనకు నిబద్ధతతో, నమ్మకంగా
  rationale: ఈ పదజంట విశ్వాసపాత్రమైన, ఆధారపడదగిన సంబంధ నిబద్ధతను వ్యక్తం చేస్తుంది. ‘నిబంధనకు నిబద్ధత’ חֶסֶד యొక్క ఒడంబడికసంబంధ బరువును, ‘నమ్మకంగా’ אֱמֶת యొక్క విశ్వసనీయత భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తాయి.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యం దేవుని వ్యక్తిగత నామాన్ని నేరుగా వాడుతుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: חֶסֶד וֶאֱמֶת పదజంట యొక్క భావం
  choice: నిబంధనకు నిబద్ధతతో, నమ్మకంగా
  alternative: దయతో, విశ్వసనీయంగా
  rationale: ఈ సందర్భం గంభీరమైన ప్రమాణం మరియు పరస్పర రక్షణ ఏర్పాటుకు సంబంధించినది. అందువల్ల חֶסֶדను సాధారణ దయగా మాత్రమే కుదించకుండా సంబంధపూర్వక నిబంధన నిబద్ధతను ప్రధాన పాఠ్యంలో చూపించాం; మరో సహజమైన పదప్రయోగాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే సంభాషణ శైలిని వాడాం. ప్రమాణంలోని ప్రాణపణాన్ని సహజంగా వ్యక్తం చేశాం. మొదటి షరతులోని ‘మీరు’ హీబ్రూ బహువచన రూపాన్ని పూర్తిగా మూసివేయదు; తరువాతి ‘నీ పట్ల’ హీబ్రూ స్త్రీలింగ ఏకవచనాన్ని అనుసరిస్తుంది.
