- from: ఆ మనుషులు ఆమెతో, “మీరు మా ఈ విషయాన్ని బయటపెట్టకపోతే, మీ ప్రాణాలకు బదులుగా మా ప్రాణాలు అర్పిస్తాం. యాహ్వే ఈ దేశాన్ని మాకు ఇచ్చినప్పుడు, మేము నీ పట్ల నిబంధనకు నిబద్ధతతో, నమ్మకంగా వ్యవహరిస్తాం[a]” అన్నారు.
  to: ఆ మనుషులు ఆమెతో, “మీరు మా ఈ విషయాన్ని బయటపెట్టకపోతే, మీ ప్రాణాలకు బదులుగా మా ప్రాణాలే పోతాయి. యాహ్వే ఈ దేశాన్ని మాకు ఇచ్చినప్పుడు, మేము నీ పట్ల దయతోను నమ్మకంగా వ్యవహరిస్తాం[a]” అన్నారు.
  rationale: The revision retains the source’s alternating plural and singular address while clarifying the life-for-life, death-bound pledge. It removes the unstated explicit covenant terminology and uses a natural Telugu rendering of the final paired nouns, with a footnote that retains their broader relational nuance.
