translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విన్నప శైలిని వాడింది. హీబ్రూ వాక్యంలోని కుటుంబ సభ్యుల వరుసను నిలిపి, נפשను ఈ ప్రాణాపాయ సందర్భంలో ‘ప్రాణాలు’గా అనువదించింది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
