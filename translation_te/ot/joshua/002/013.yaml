  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַחֲיִתֶ֞ם אֶת אָבִ֣/י וְ/אֶת אִמִּ֗/י וְ/אֶת אַחַ/י֙ וְ/אֶת אחות/י וְ/אֵ֖ת כָּל אֲשֶׁ֣ר לָ/הֶ֑ם וְ/הִצַּלְתֶּ֥ם אֶת נַפְשֹׁתֵ֖י/נוּ מִ/מָּֽוֶת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/013.yaml
  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
translation:
  language: te
  text: నా తండ్రిని, నా తల్లిని, నా అన్నదమ్ములను, నా అక్కచెల్లెళ్లను, వారికి చెందిన వారందరినీ[b] బతికించండి[a]; మా ప్రాణాలను మరణం నుండి రక్షించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా తండ్రిని, నా తల్లిని ... ప్రాణాలతో ఉండనివ్వండి.”
    reason: lexical_alternative
  - marker: b
    text: “వారికి చెందిన వారందరినీ” అనే మాట వారి ఇంటివారిని లేదా వారిపై ఆధారపడినవారిని సూచించే అవకాశం ఎక్కువ. దీనిని మరింత విస్తృతంగా “వారికి ఉన్నదంతటినీ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  choice: సజీవంగా ఉంచి
  rationale: חיה హిఫీల్ రూపం ‘బతికించడం/సజీవంగా ఉంచడం’ అనే కారక భావాన్ని ఇస్తుంది. ఈ సందర్భంలో ‘సజీవంగా ఉంచి’ అనేది కేవలం ‘విడిచిపెట్టి’ కంటే మూలార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אָבִי ... אִמִּי ... אַחַי ... אחותי
  choice: నా తండ్రిని, నా తల్లిని, నా అన్నదమ్ములను, నా అక్కచెల్లెళ్లను
  rationale: హీబ్రూ బంధుత్వ పదాల వరుసనూ వాటి వ్యక్తిగత ఉద్ఘాటననూ నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన కుటుంబపదాలను వాడింది.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: వారికి చెందిన వారందరినీ
  rationale: పదబంధం వ్యక్తులు లేదా ఆస్తిని విస్తృతంగా సూచించగలదు; అయితే ప్రాణరక్షణ సందర్భంలో కుటుంబానికి చెందిన ఇతర సభ్యులు లేదా ఆధారితులే ప్రధాన సూచన. ‘వారందరినీ’ వ్యక్తుల భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయ విస్తృత అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְהִצַּלְתֶּם
  choice: తప్పించండి
  rationale: נצל హిఫీల్‌కు ‘విడిపించడం, రక్షించడం, తప్పించడం’ అనే అర్థం ఉంది. ‘మరణం నుండి తప్పించండి’ ఆధునిక తెలుగులో సహజంగా ఉండి ప్రాణాపాయం నుండి రక్షణను తెలియజేస్తుంది.
- source_word: נַפְשֹׁתֵינוּ
  choice: మా ప్రాణాలను
  rationale: ఇక్కడ נפש అమూర్తమైన ‘ఆత్మలు’ కంటే జీవులు లేదా ప్రాణాలను సూచిస్తుంది. ‘మా ప్రాణాలను’ మరణభయ సందర్భానికి సరిపోతుంది.
- source_word: מִמָּוֶת
  choice: మరణం నుండి
  rationale: మూలంలోని ఉపసర్గతో కూడిన పదబంధాన్ని నేరుగా, గంభీరంగా తెలుగులో వ్యక్తపరుస్తుంది.
