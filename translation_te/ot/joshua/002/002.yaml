translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సమాచారదాతను మూలపాఠం పేర్కొననందున కర్తను చేర్చలేదు. ప్రత్యక్ష వాక్యంలో రాజును ఉద్దేశించిన బహువచన గౌరవార్థక ‘చూడండి’ వాడబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
