reference: Joshua 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣אָמַ֔ר לְ/מֶ֥לֶךְ יְרִיח֖וֹ לֵ/אמֹ֑ר הִנֵּ֣ה אֲ֠נָשִׁים בָּ֣אוּ הֵ֧נָּה הַ/לַּ֛יְלָה מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/חְפֹּ֥ר אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/002.yaml
  text: And it was said to the king of Jericho[a], “Look, men have come here tonight from the Israelites to search out the land.”
translation:
  language: te
  text: 'యెరికో రాజుకు ఇలా తెలియజేయబడింది: “ఇదిగో, ఇశ్రాయేలీయులలోనుండి కొందరు పురుషులు ఈ రాత్రి దేశాన్ని పరిశీలించడానికి ఇక్కడికి వచ్చారు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశంలో గూఢచర్యం చేయడానికి.” హీబ్రూ క్రియకు వెదికి తెలుసుకోవడం లేదా పరిశీలించడం అనే భావం ఉండవచ్చు; ఈ సందర్భంలో అది భూభాగాన్ని రహస్యంగా పరిశీలించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָמַר
  choice: తెలియజేయబడింది
  rationale: హీబ్రూ రూపంలో సమాచారాన్ని తెలిపిన వ్యక్తి పేరు పేర్కొనబడలేదు. కర్తను ఊహించి చేర్చకుండా, సహజమైన తెలుగు కర్మణి ప్రయోగంతో ఆ అనిర్దిష్టతను నిలుపుతుంది.
- source_word: לְמֶלֶךְ יְרִיחוֹ
  choice: యెరికో రాజుకు
  rationale: స్థలనామంతో కూడిన రాజకీయ బిరుదును సంక్షిప్తంగా, సహజమైన తెలుగు సంబంధ నిర్మాణంలో అందిస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా … :'
  rationale: ఈ infinitive construct ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘ఇలా’తో పాటు ద్విబిందువు, ఉద్ధరణ చిహ్నాలు సహజమైన సమానం.
- source_word: הִנֵּה
  choice: చూడండి
  rationale: అత్యవసరమైన సమాచారంపై శ్రోత దృష్టిని మళ్లించే మూలపాఠంలోని సూచనాత్మక బలాన్ని ఆధునిక, మర్యాదపూర్వక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲנָשִׁים
  choice: పురుషులు
  rationale: ఇక్కడ ఈ పదం పురుష వ్యక్తులను సూచిస్తుంది; సాధారణ ‘మనుషులు’ కంటే లింగ సూచనను స్పష్టంగా నిలుపుతుంది.
- source_word: בָּאוּ הֵנָּה
  choice: ఇక్కడికి వచ్చారు
  rationale: పూర్తయిన రాకను మరియు ఇక్కడ అనే దిశా భావాన్ని సహజమైన తెలుగు క్రియలో వ్యక్తపరుస్తుంది.
- source_word: הַלַּיְלָה
  choice: ఈ రాత్రి
  rationale: వారు వచ్చిన ప్రస్తుత రాత్రినే సూచించే ఆధునిక తెలుగు రూపం.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల్లో కొందరు
  rationale: מִן ఇక్కడ సమూహం నుంచి వచ్చిన కొందరనే భాగార్థాన్ని కలిగి ఉంది. ‘ఇశ్రాయేలు కుమారుల్లో’ అనే అక్షరార్థపు, అసహజ రూపాన్ని నివారిస్తూ ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: לַחְפֹּר
  choice: పరిశోధించడానికి
  rationale: ఈ సందర్భంలో భూభాగం గురించి రహస్యంగా సమాచారం సేకరించే పరిశీలన భావాన్ని తెలియజేస్తుంది; ‘గూఢచర్యం చేయడానికి’ అనే మరింత నిర్దిష్ట సందర్భార్థాన్ని ప్రధాన పాఠంలో బలవంతంగా పెట్టదు.
- source_word: אֶת הָאָרֶץ
  choice: దేశాన్ని
  rationale: ఇక్కడ הָאָרֶץ పరిశీలించబడే భూభాగం లేదా దేశాన్ని సూచిస్తుంది. ఆధునిక తెలుగు కథనంలో ‘దేశం’ సహజంగా ఉంది.
