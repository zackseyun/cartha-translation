lexical_decisions:
- source_word: טֶרֶם
  choice: ఇంకా ...కముందే
  rationale: తదుపరి క్రియ జరగకముందే మరో చర్య జరిగినదని తెలిపే కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יִשְׁכָּבוּן
  choice: పడుకోక
  rationale: שׁכב అనే క్రియ యొక్క ప్రాథమిక అర్థం ‘పడుకోవడం.’ సందర్భంలో నిద్రకు ఉపక్రమించడం సూచితమైనప్పటికీ, మూలపాఠం ‘నిద్రపోవడం’ అని స్పష్టంగా చెప్పదు.
- source_word: עָלְתָה
  choice: వెళ్లింది
  rationale: עלה పైకి కదలడాన్ని సూచిస్తుంది. ‘మేడమీదికి’ అనే గమ్యపదంలో పైకి వెళ్లే భావం ఇప్పటికే స్పష్టంగా ఉన్నందున, తెలుగులో ‘వెళ్లింది’ సహజంగా ఉంటుంది.
- source_word: עֲלֵיהֶם
  choice: వారి దగ్గరకు
  rationale: చలన క్రియతో వ్యక్తులను లక్ష్యంగా చూపే עַל ఇక్కడ వారి వైపుకు లేదా వారి దగ్గరకు వెళ్లడాన్ని సూచిస్తుంది; ‘వారి మీదికి’ అనడం తెలుగులో తప్పుదారి పట్టించవచ్చు.
- source_word: עַל הַגָּג
  choice: మేడమీదికి
  rationale: ప్రాచీన ఇంటి సమతల పైకప్పును సూచించే గָּג‌కు కథన సందర్భంలో సహజమైన తెలుగు రూపం ‘మేడ.’ దిశను సూచించే ఎక్కి వెళ్లే భావాన్ని ‘మీదికి’ తెలియజేస్తుంది.
- source_word: וְהֵמָּה ... וְהִיא
  choice: వారు ... ఆమె
  rationale: మూలంలోని స్పష్ట సర్వనామాలు పాత్రల మధ్య వ్యత్యాసాన్ని నొక్కిచెబుతాయి; తెలుగు వాక్యంలో రెండింటినీ ఉంచడం ఆ వ్యత్యాసాన్ని సహజంగా కాపాడుతుంది.
