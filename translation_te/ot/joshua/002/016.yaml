translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథనశైలిలో అనువదించబడింది. మూలంలోని ఆజ్ఞల అత్యవసరతను సహజమైన తెలుగు వాక్యనిర్మాణంతో నిలుపుతూ, הַר పదంలోని స్థలసంబంధమైన సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం.
