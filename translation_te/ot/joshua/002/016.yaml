revisions:
- from: 'ఆమె వారితో ఇలా చెప్పింది: “వెంబడిస్తున్నవారు మీకు ఎదురుపడకుండా మీరు కొండప్రాంతానికి[a] వెళ్లి, అక్కడ మూడు రోజులు దాక్కోండి. వెంబడిస్తున్నవారు తిరిగి వెళ్లిన తరువాత మీరు మీ దారిన వెళ్లవచ్చు.”'
  to: 'ఆమె వారితో ఇలా చెప్పింది: “కొండప్రాంతానికి[a] వెళ్లండి; వెంబడిస్తున్నవారు మీకు ఎదురుపడకుండా, అక్కడ మూడు రోజులు దాక్కోండి. వెంబడిస్తున్నవారు తిరిగి వెళ్లే వరకు దాక్కొని ఉండండి. ఆ తరువాత మీరు మీ దారిన వెళ్లవచ్చు.”'
  rationale: 'ఆజ్ఞారూపాలను స్పష్టంగా విడదీసి, అనవసర సర్వనామ పునరుక్తిని తొలగించాం. అయితే సవరించిన పాఠంలో ‘దాక్కోండి’ మరియు ‘దాక్కొని ఉండండి’ పునరావృతం మూలంలోని ఒకే ఆజ్ఞను అనవసరంగా విస్తరిస్తుంది; కాబట్టి పూర్తి పాఠాన్ని మూలానికి కచ్చితంగా ఉంచేందుకు తుది పాఠం ఇలా ఉండాలి: “ఆమె వారితో ఇలా చెప్పింది: ‘కొండప్రాంతానికి[a] వెళ్లండి; వెంబడిస్తున్నవారు మీకు ఎదురుపడకుండా, అక్కడ మూడు రోజులు దాక్కోండి. వెంబడిస్తున్నవారు తిరిగి వెళ్లే వరకు అక్కడే ఉండండి. ఆ తరువాత మీరు మీ దారిన వెళ్లవచ్చు.’” ఈ ‘అక్కడే ఉండండి’ అనేది దాక్కొని ఉండడాన్ని సందర్భానుసారంగా సూచిస్తుంది.'
