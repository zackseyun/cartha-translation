source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הָ/הָ֣רָ/ה לֵּ֔כוּ פֶּֽן יִפְגְּע֥וּ בָ/כֶ֖ם הָ/רֹדְפִ֑ים וְ/נַחְבֵּתֶ֨ם שָׁ֜מָּ/ה שְׁלֹ֣שֶׁת יָמִ֗ים עַ֚ד שׁ֣וֹב הָ/רֹֽדְפִ֔ים וְ/אַחַ֖ר תֵּלְכ֥וּ לְ/דַרְכְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
translation:
  language: te
  text: 'ఆమె వారితో ఇలా చెప్పింది: “కొండప్రాంతానికి[a] వెళ్లండి; వెంబడిస్తున్నవారు మీకు ఎదురుపడకుండా, అక్కడ మూడు రోజులు దాక్కోండి. వెంబడిస్తున్నవారు తిరిగి వెళ్లే వరకు దాక్కొని ఉండండి. ఆ తరువాత మీరు మీ దారిన వెళ్లవచ్చు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ కొండకు”; హీబ్రూ పదం ఒక నిర్దిష్ట కొండను లేదా చుట్టుపక్కల కొండప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  choice: కొండప్రాంతానికి
  rationale: הַר అనే పదం ఒక నిర్దిష్ట కొండను గానీ, కొండలతో కూడిన ప్రాంతాన్ని గానీ సూచించగలదు. దాక్కోవడానికి సమీపంలోని ఎత్తుపల్లాల ప్రాంతానికి వెళ్లమనే సందర్భంలో ‘కొండప్రాంతానికి’ సహజంగా ఉండి మూలంలోని భావవిస్తృతిని నిలుపుతుంది.
- source_word: לֵּכוּ
  choice: వెళ్లి
  rationale: הלך ఆజ్ఞారూపం నేరుగా ‘వెళ్లండి’ అనే అర్థం ఇస్తుంది. తెలుగులో తదుపరి ఆజ్ఞతో సహజంగా అనుసంధానించడానికి ‘వెళ్లి ... దాక్కోండి’ అని ఇచ్చాం.
- source_word: פֶּן יִפְגְּעוּ בָכֶם
  choice: మీకు ఎదురుపడకుండా
  rationale: פֶּן ప్రతికూల జాగ్రత్త లేదా నివారణ భావాన్ని తెలియజేస్తుంది; פגע ב అంటే కలవడం, ఎదురుపడడం, తారసపడడం. వెంబడింపు సందర్భంలోని ప్రమాదాన్ని అతిశయింపకుండా ‘ఎదురుపడకుండా’ తెలియజేస్తుంది.
- source_word: הָרֹדְפִים
  choice: వెంబడిస్తున్నవారు
  rationale: רדף క్రియ యొక్క కృదంత రూపం వెంబడిస్తున్న వ్యక్తులను సూచిస్తుంది. ‘వెంబడిస్తున్నవారు’ చర్య కొనసాగుతోందనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְנַחְבֵּתֶם
  choice: దాక్కోండి
  rationale: חבא నిఫాల్ రూపం తామే దాగుకోవాలనే భావాన్ని ఇస్తుంది. ‘దాక్కోండి’ ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన ఆజ్ఞ.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజులు
  rationale: ఇది కాలవ్యవధిని సూచించే పదబంధం; తెలుగులో ‘మూడు రోజులు’ సహజంగా అదే అర్థాన్ని ఇస్తుంది.
- source_word: עַד שׁוֹב הָרֹדְפִים
  choice: వెంబడిస్తున్నవారు తిరిగి వెళ్లిన తరువాత
  rationale: עַד שׁוֹב వారి తిరుగు వరకు దాక్కోవాల్సిన కాలపరిమితిని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో అదే క్రమాన్ని ‘తిరిగి వెళ్లిన తరువాత’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: תֵּלְכוּ לְדַרְכְּכֶם
  choice: మీరు మీ దారిన వెళ్లవచ్చు
  rationale: ఇక్కడ అసంపూర్ణ క్రియారూపం ముందున్న నిరీక్షణ తరువాత చేయగల తదుపరి కార్యాన్ని సూచిస్తుంది. ‘మీ దారిన వెళ్లవచ్చు’ అనుమతి లేదా సాధ్యమైన తదుపరి చర్య భావాన్ని సహజంగా తెలియజేస్తుంది.
