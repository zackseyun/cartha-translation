    rationale: לֵּכוּ మరియు וְנַחְבֵּתֶם రెండూ స్వతంత్ర బహువచన ఆజ్ఞారూపాలు. ‘వెళ్లండి’ మరియు ‘దాక్కోండి’గా ఇవ్వడం ఆ ఆజ్ఞల స్పష్టతను, తెలుగు ప్రవాహాన్ని మెరుగుపరుస్తుంది.
  - severity: low
