translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీయ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, వరుస చర్యలను స్పష్టంగా నిలిపింది.
