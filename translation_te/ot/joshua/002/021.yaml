    rationale: 'The Hebrew preposition ב marks location: the cord was tied in/at the window. “కిటికీలో” is both natural Telugu and closer to the source.'
  - severity: low
    issue: The footnote repeats the category “rope” in “తాడు, దారం లేదా పలుచని తాడు.”
    rationale: The English audit trail gives cord, line, or rope. Telugu should provide distinct alternatives rather than adding an unsupported qualification (“thin”).
