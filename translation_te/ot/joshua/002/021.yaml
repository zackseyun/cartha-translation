  text: וַ/תֹּ֨אמֶר֙ כְּ/דִבְרֵי/כֶ֣ם כֶּן ה֔וּא וַֽ/תְּשַׁלְּחֵ֖/ם וַ/יֵּלֵ֑כוּ וַ/תִּקְשֹׁ֛ר אֶת תִּקְוַ֥ת הַ/שָּׁנִ֖י בַּ/חַלּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/021.yaml
  text: And she said[a], “According to your words, so be it.” Then she sent them away, and they went; and she tied the scarlet cord in the window.
translation:
  language: te
  text: అందుకు ఆమె, “మీరు చెప్పినట్టే అవుతుంది” అంది. తరువాత ఆమె వారిని పంపివేసింది; వారు వెళ్లిపోయారు. ఆమె ఆ ఎర్రని తాడును కిటికీలో కట్టింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎర్రని దారాన్ని” లేదా “ఎర్రని తాడును.” ఇక్కడి హెబ్రీయ పదబంధం కనిపించే గుర్తుగా ఉపయోగించిన దారం, తాడు, లేదా త్రాడును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדִבְרֵיכֶם
  choice: మీరు చెప్పినట్టే
  rationale: అక్షరార్థంగా ‘మీ మాటల ప్రకారం’ అనే భావం. ఆధునిక తెలుగులో సహజంగా ఉండడంతోపాటు గూఢచారులు చెప్పిన షరతులకు రాహాబు అంగీకరించిందనే అర్థాన్ని నిలుపుతుంది.
- source_word: כֵּן הוּא
  choice: జరుగుతుంది
  rationale: ముందున్న ‘మీరు చెప్పినట్టే’తో కలిపి, అంగీకారాన్ని తెలిపే హెబ్రీయ ఇడియమ్‌ను సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: וַתְּשַׁלְּחֵם
  choice: ఆమె వారిని పంపివేసింది
  rationale: שלח అనే క్రియలోని ‘పంపు’ భావాన్ని నేరుగా ఇస్తూ, వారు ఆమె ఇంటి నుంచి బయలుదేరే సందర్భానికి సరిపోతుంది.
- source_word: וַיֵּלֵכוּ
  choice: వారు వెళ్లిపోయారు
  rationale: הלך అనే సాధారణ గమన క్రియను కథన క్రమంలో సహజంగా అనువదిస్తుంది.
- source_word: וַתִּקְשֹׁר
  choice: కట్టింది
  rationale: קשר అంటే కట్టు లేదా బిగించు. గుర్తుగా ఉపయోగించిన తాడును కిటికీకి కట్టిన సందర్భంలో ‘కట్టింది’ అత్యంత సహజం.
- source_word: תִּקְוַת הַשָּׁנִי
  choice: ఆ ఎర్రని తాడు
  rationale: ఇక్కడ תִּקְוָה సాధారణంగా వచ్చే ‘నిరీక్షణ’ అర్థంలో కాకుండా తాడు/దారం అనే భౌతిక వస్తువును సూచిస్తుంది. שָׁנִי దాని ఎర్రని రంగును సూచిస్తుంది.
- source_word: בַּחַלּוֹן
  choice: కిటికీకి
  rationale: హెబ్రీయ ב స్థానం లేదా అనుసంధాన బిందువును సూచించగలదు. ‘తాడును కిటికీకి కట్టింది’ అనేది తెలుగులో సహజంగా ఉండి, తాడు కిటికీ వద్ద బిగించబడిందనే భావాన్ని ఇస్తుంది.
