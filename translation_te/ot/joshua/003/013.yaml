id: JOS.3.13
reference: Joshua 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
translation:
  language: te
  text: సర్వభూమికి ప్రభువైన యాహ్వే మందసాన్ని మోస్తున్న యాజకుల అరికాళ్లు యొర్దాను జలాల్లో నిలిచినప్పుడు, యొర్దాను జలాలు తెగిపోతాయి; ఎగువనుంచి దిగివస్తున్న జలాలు ఒకే కుప్పగా నిలుస్తాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సర్వభూమికి ప్రభువైన యాహ్వే మందసాన్ని.” హీబ్రూ పదక్రమంలో “సర్వభూమికి ప్రభువు” అనే బిరుదును “మందసం”తో మరింత సన్నిహితంగా అనుసంధానించి చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּנוֹחַ
  choice: నిలిచిన వెంటనే
  rationale: כְּנוֹחַ కాలసంబంధ భావాన్ని, పాదాలు నీటిలో వచ్చి నిలిచే క్షణాన్ని సూచిస్తుంది; ‘వెంటనే’ సందర్భంలోని తక్షణ ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כַּפּוֹת רַגְלֵי
  choice: అరికాళ్లు
  rationale: ఈ జతపదం పాదాల అడుగు భాగాలను ప్రత్యేకంగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘అరికాళ్లు’ సంక్షిప్తంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן
  choice: మందసాన్ని మోస్తున్న యాజకులు
  rationale: నשא అనే వర్తమాన కృదంతం వారిని మందసాన్ని మోసేవారిగా వర్ణిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; దానిని ఒక బిరుదుతో భర్తీ చేయలేదు.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: భూమి అంతటికీ ప్రభువు
  rationale: אֲדוֹן యొక్క అధికార, ఆధిపత్య భావాన్ని ‘ప్రభువు’ సహజంగా అందిస్తుంది; כָּל הָאָרֶץ విశ్వవ్యాప్త పరిధిని సూచిస్తుంది.
- source_word: בְּמֵי הַיַּרְדֵּן
  choice: యొర్దాను నీళ్లలో
  rationale: בְּ ఇక్కడ నదీ జలాల్లో తాకి నిలవడాన్ని సూచిస్తుంది.
- source_word: יִכָּרֵתוּן
  choice: ఆపివేయబడి
  rationale: כרת నిఫల్ రూపం నీటి ప్రవాహం తెగిపోవడం లేదా నిలిపివేయబడడం అనే భావం ఇస్తుంది; తెలుగులో ఈ సందర్భానికి ‘ఆపివేయబడి’ స్పష్టంగా ఉంటుంది.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: పైనుంచి ప్రవహిస్తూ వస్తున్న ... నీళ్లు
  rationale: మూలంలోని ‘దిగివస్తున్న’ దృశ్యాన్ని కాపాడుతూ, నదీ సందర్భంలో ఎగువ నుంచి వచ్చే ప్రవాహాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  choice: ఒకే కుప్పగా నిలుస్తాయి
  rationale: נֵד నీటి పోగు లేదా కుప్పను సూచిస్తుంది; అద్భుత ఘటన యొక్క స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం. ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో ‘యెహోవా’ ఎక్కువగా గుర్తించదగిన రూపం.
- issue: ‘భూమి అంతటికీ ప్రభువు’ అనే పదబంధ సంబంధం
  choice: యెహోవాను వివరిస్తున్న సమానాధికరణ బిరుదుగా ప్రధాన పాఠంలో చూపడం
  alternative: ‘భూమి అంతటికీ ప్రభువైనవాని మందసం’ అని మందసంతో దగ్గరగా అనుసంధానించడం
  rationale: హీబ్రూ పదక్రమం రెండు సంబంధాలకూ అవకాశం ఇస్తుంది. ప్రధాన పాఠం యెహోవాను ‘భూమి అంతటికీ ప్రభువు’గా గుర్తిస్తుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో సహజంగా చదవడానికి రెండు వాక్యాలుగా అమర్చాం; అయితే మూలంలోని కాలసంబంధం, దైవనామం, నీరు ఆపబడటం, ఒకే కుప్పగా నిలవటం అన్నీ నిలుపుకున్నాం.
