revisions:
- from: యెహోవా మందసాన్ని మోస్తున్న యాజకుల అరికాళ్లు యొర్దాను నీళ్లలో నిలిచిన వెంటనే, పైనుంచి ప్రవహిస్తూ వస్తున్న యొర్దాను నీళ్లు ఆపివేయబడి, ఒకే కుప్పగా నిలుస్తాయి. యెహోవాయే[a] భూమి అంతటికీ ప్రభువు.
  to: సర్వభూమికి ప్రభువైన యాహ్వే మందసాన్ని మోస్తున్న యాజకుల అరికాళ్లు యొర్దాను జలాల్లో నిలిచినప్పుడు, యొర్దాను జలాలు తెగిపోతాయి; ఎగువనుంచి దిగివస్తున్న జలాలు ఒకే కుప్పగా నిలుస్తాయి.[a]
