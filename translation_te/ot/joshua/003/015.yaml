source:
  edition: WLC
  text: וּ/כְ/ב֞וֹא נֹשְׂאֵ֤י הָֽ/אָרוֹן֙ עַד הַ/יַּרְדֵּ֔ן וְ/רַגְלֵ֤י הַ/כֹּֽהֲנִים֙ נֹשְׂאֵ֣י הָֽ/אָר֔וֹן נִטְבְּל֖וּ בִּ/קְצֵ֣ה הַ/מָּ֑יִם וְ/הַ/יַּרְדֵּ֗ן מָלֵא֙ עַל כָּל גְּדוֹתָ֔י/ו כֹּ֖ל יְמֵ֥י קָצִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
translation:
  language: te
  text: మందసాన్ని మోస్తున్నవారు యొర్దాను వరకు వచ్చినప్పుడు, మందసాన్ని మోస్తున్న యాజకుల పాదాలు నీటి అంచులో మునిగినప్పుడు (యొర్దాను కోతకాలమంతా తన గట్లన్నిటి మీదుగా పొంగి ప్రవహిస్తూ ఉండేది),
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְבוֹא
  choice: వచ్చినప్పుడు
  rationale: సంయోజక అవ్యయం, కాలార్థక ఉపసర్గ, క్రియానామ రూపం కలిసి కాలాన్ని సూచించే ఉపవాక్యాన్ని ప్రవేశపెడతాయి; ఆధునిక తెలుగులో ‘వచ్చినప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: మందసాన్ని మోస్తున్నవారు
  rationale: కృదంతం మందసాన్ని మోసే వ్యక్తులను సూచిస్తుంది. ‘మోస్తున్నవారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: עַד הַיַּרְדֵּן
  choice: యొర్దాను దగ్గరికి
  rationale: עַד కదలిక ఒక హద్దు లేదా చేరే స్థానం వరకు సాగడాన్ని సూచిస్తుంది; ఇక్కడ నది అంచు చేరడమే భావం.
- source_word: וְרַגְלֵי הַכֹּהֲנִים
  choice: యాజకుల పాదాలు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగు షష్ఠీ నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: נִטְבְּלוּ
  choice: మునిగాయి
  rationale: טבל నిఫాల్ రూపం నీటిలో దిగడం లేదా ముంచబడడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో పాదాలు నీటి అంచులోకి దిగినందున ‘మునిగాయి’ సరైన తీవ్రతను కలిగి ఉంది.
- source_word: בִּקְצֵה הַמָּיִם
  choice: నీటి అంచులో
  rationale: అక్షరార్థంగా ‘నీటి చివరలో/అంచులో’; ‘అంచులో’ అనడం పాదాలు కేవలం అంచును తాకాయని కాక నీటిలో ప్రవేశించాయని తెలియజేస్తుంది.
- source_word: וְהַיַּרְדֵּן מָלֵא עַל כָּל גְּדוֹתָיו
  choice: యొర్దాను తన గట్లన్నిటి మీదుగా పొంగి ప్రవహిస్తూ ఉండేది
  rationale: מָלֵא మరియు తరువాతి పదబంధం కలిపి నది గట్లను మించి నిండిపోవడాన్ని సూచిస్తాయి. తెలుగులో ఈ వరదస్థితిని సహజంగా, స్పష్టంగా తెలిపే రూపం.
- source_word: כֹּל יְמֵי קָצִיר
  choice: కోతకాలమంతా
  rationale: మొత్తం కోతకాలాన్ని సూచించే కాలపదబంధం; సంక్షిప్తంగా, సహజంగా ఉంది.
