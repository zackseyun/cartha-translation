translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘మందసాన్ని మోస్తున్న’ అనే పునరుక్తిని నిలిపి ఉంచింది. నేపథ్య వివరణను ప్రత్యేక వాక్యంగా ఇచ్చి తెలుగు పఠనసౌలభ్యాన్ని పెంచింది.
