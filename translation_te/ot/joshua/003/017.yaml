  terminology: ‘యాహ్వే,’ ‘నిబంధన మందసం,’ ‘యాజకులు,’ ‘యొర్దాను,’ ‘ఇశ్రాయేలీయులు’ అనే పదప్రయోగాలు సందర్భానుకూలంగా, స్థిరంగా ఉన్నాయి. దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించడం అందించిన నిర్ణయానికి, మూలపాఠానికి అనుగుణం. ‘జనమంతా’ ఇక్కడ గోయ్ యొక్క సమష్టి సూచనను సహజంగా ఇస్తుంది.
