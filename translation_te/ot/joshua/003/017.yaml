  source_fidelity: 'హీబ్రూ వాక్యంలోని ప్రధాన అంశాలన్నీ విశ్వసనీయంగా ప్రతిబింబించబడ్డాయి: యాహ్వే నిబంధన మందసాన్ని మోస్తున్న యాజకులు యొర్దాను మధ్యలోని ఎండిన నేలపై స్థిరంగా నిలబడడం, ఇశ్రాయేలీయులందరూ ఎండిన నేలపై దాటడం, మరియు జనమంతా దాటడం పూర్తయ్యే వరకు యాజకులు నిలిచి ఉండడం. הָכֵן యొక్క స్థిరత్వ భావం, עֹבְרִים యొక్క కొనసాగుతున్న చర్య, כָּל הַגּוֹי యొక్క సమష్టి భావం సరిగ్గా నిలిచాయి.'
