id: JOS.3.17
reference: Joshua 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעַמְד֣וּ הַ/כֹּהֲנִ֡ים נֹ֠שְׂאֵי הָ/אָר֨וֹן בְּרִית יְהוָ֜ה בֶּ/חָֽרָבָ֛ה בְּ/ת֥וֹךְ הַ/יַּרְדֵּ֖ן הָכֵ֑ן וְ/כָל יִשְׂרָאֵ֗ל עֹֽבְרִים֙ בֶּ/חָ֣רָבָ֔ה עַ֤ד אֲשֶׁר תַּ֨מּוּ֙ כָּל הַ/גּ֔וֹי לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
translation:
  language: te
  text: యాహ్వే నిబంధన మందసాన్ని[a] మోస్తున్న యాజకులు యొర్దాను మధ్యలోని ఎండిన నేల మీద స్థిరంగా నిలబడ్డారు.[b] ఇశ్రాయేలీయులందరూ ఎండిన నేల మీదుగా దాటుతూ ఉన్నారు; ఇశ్రాయేలు జనమంతా[c] యొర్దానును దాటడం పూర్తయ్యే వరకు వారు అలాగే నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నిబంధనకు చెందిన మందసాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “స్థిరంగా నిలబడ్డారు”; యాజకులు నదీగర్భంలో కదలకుండా తమ స్థానంలోనే నిలిచి ఉన్నారని ఈ పదం నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ప్రజలందరూ.” హీబ్రూలో ఇశ్రాయేలును సమష్టిగా సూచించే ఏకవచన పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ ... הָכֵן
  choice: స్థిరంగా నిలబడ్డారు
  rationale: עמד అనే క్రియతో కూడిన הָכֵן ఇక్కడ యాజకులు నదీగర్భంలో కదలకుండా దృఢంగా నిలిచి ఉన్నారని సూచిస్తుంది.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: మోస్తున్న యాజకులు
  rationale: నֹשְׂאֵי అనే వర్తమాన కృదంతం కొనసాగుతున్న చర్యను తెలుపుతుంది; ఆధునిక తెలుగులో ‘మోస్తున్న’ సహజంగా ఉంది.
- source_word: הָאָרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: హీబ్రూ సంబంధ పదబంధ క్రమాన్ని స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది; אָרוֹן‌కు బైబిలు సందర్భంలో సాధారణమైన ‘మందసం’ వాడబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: בֶּחָרָבָה
  choice: ఎండిన నేల మీద
  rationale: నీరు తొలగి బయటపడిన పొడి నేలను సూచిస్తుంది; రెండు సందర్భాల్లోనూ ఒకే విధంగా అనువదించబడింది.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: యొర్దాను మధ్యలో
  rationale: בְּתוֹךְ నదిలోని లోపలి లేదా మధ్య ప్రదేశాన్ని సూచిస్తుంది.
- source_word: וְכָל יִשְׂרָאֵל עֹבְרִים
  choice: ఇశ్రాయేలీయులందరూ ... దాటుతూ ఉన్నారు
  rationale: కృదంత రూపం కొనసాగుతున్న చర్యను తెలియజేస్తుంది; తెలుగులో సహజమైన బహువచన నిర్మాణం వాడబడింది.
- source_word: עַד אֲשֶׁר תַּמּוּ
  choice: దాటడం పూర్తయ్యే వరకు
  rationale: תם ఇక్కడ చర్య ముగింపుకు చేరడాన్ని సూచిస్తుంది.
- source_word: כָּל הַגּוֹי
  choice: ఇశ్రాయేలు జనమంతా
  rationale: גּוֹי ఇక్కడ ఇశ్రాయేలును సమష్టిగా సూచిస్తుంది; ‘జనమంతా’ ఆధునిక తెలుగులో సహజంగా ఉండి ఏ కులార్థాన్నీ సూచించదు.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: యొర్దానును దాటడం
  rationale: ל తో కూడిన క్రియానామం పూర్తయిన చర్యను సూచిస్తుంది; తెలుగులో ఈ నిర్మాణం సూటిగా, సహజంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- issue: בְּרִית יְהוָה సంబంధం
  choice: యాహ్వే నిబంధన మందసం
  alternative: యాహ్వే నిబంధనకు చెందిన మందసం
  rationale: ప్రధాన పాఠం హీబ్రూ సంబంధ పదబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది; ప్రత్యామ్నాయ రూపం అదే సంబంధాన్ని మరింత విపులంగా చెబుతుంది, అందుకే పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘జాతి’ అనే పదానికి ఆధునిక తెలుగులో కలగగల కులార్థాన్ని నివారించడానికి כָּל הַגּוֹי ను ‘జనమంతా’గా అనువదించాం. చివరి ఉపవాక్యంలో యాజకులే నిలిచి ఉన్నారనే సూచన స్పష్టంగా ఉండేందుకు ‘వారు అలాగే నిలబడ్డారు’ అని చేర్చబడింది; ఇది హీబ్రూ వాక్యంలోని ప్రధాన క్రియ కొనసాగుతున్న కాలపరిమితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
