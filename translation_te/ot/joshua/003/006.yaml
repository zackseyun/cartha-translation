- from: అప్పుడు యెహోషువ యాజకులతో, “నిబంధన మందసాన్ని ఎత్తుకొని ప్రజలకు ముందుగా దాటివెళ్లండి” అని చెప్పాడు. అప్పుడు వారు నిబంధన మందసాన్ని ఎత్తుకొని ప్రజలకు ముందుగా వెళ్లారు.
