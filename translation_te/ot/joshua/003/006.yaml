id: JOS.3.6
reference: Joshua 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ אֶל הַ/כֹּהֲנִ֣ים לֵ/אמֹ֔ר שְׂאוּ֙ אֶת אֲר֣וֹן הַ/בְּרִ֔ית וְ/עִבְר֖וּ לִ/פְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂאוּ֙ אֶת אֲר֣וֹן הַ/בְּרִ֔ית וַ/יֵּלְכ֖וּ לִ/פְנֵ֥י הָ/עָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: te
  text: అప్పుడు యెహోషువ యాజకులతో, “నిబంధన మందసాన్ని ఎత్తుకొని ప్రజల కంటే ముందుగా దాటివెళ్లండి” అని చెప్పాడు. అప్పుడు వారు నిబంధన మందసాన్ని ఎత్తుకొని ప్రజల కంటే ముందుగా వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: הַכֹּהֲנִים
  choice: యాజకులతో
  rationale: ఇశ్రాయేలు ఆరాధనా సేవకులను సూచించే నిర్దిష్ట బహువచన నామపదానికి సహజమైన తెలుగు రూపం; אֶל సంబంధాన్ని ‘తో’ ద్వారా వ్యక్తపరుస్తుంది.
- source_word: שְׂאוּ
  choice: ఎత్తుకొని
  rationale: נשא ఇక్కడ మందసాన్ని పైకెత్తి మోయడం ప్రారంభించడాన్ని సూచిస్తుంది. ‘ఎత్తుకొని’ ఆ స్పష్టమైన చర్యను నిలుపుతుంది.
- source_word: אֲרוֹן הַבְּרִית
  choice: నిబంధన మందసం
  rationale: మందసం నిబంధనతో సంబంధమున్న పవిత్ర పెట్టె అని తెలిపే హీబ్రూ నిర్మాణానికి సంప్రదాయబద్ధమైన, పారదర్శకమైన తెలుగు అనువాదం.
- source_word: וְעִבְרוּ
  choice: దాటివెళ్లండి
  rationale: עבר దాటడం అనే భావాన్ని ఇస్తుంది. యొర్దాను దాటే సందర్భంలో ‘దాటివెళ్లండి’ సహజంగా ఉండి, మూలంలోని కదలికను స్పష్టంగా నిలుపుతుంది.
- source_word: לִפְנֵי הָעָם
  choice: ప్రజలకు ముందుగా
  rationale: ప్రజల ముందు స్థానంలో లేదా వారికి ముందుగా కదలడాన్ని సూచిస్తుంది; సందర్భంలో ‘ముందుగా’ సహజమైన తెలుగు ప్రయోగం.
- source_word: וַיִּשְׂאוּ
  choice: వారు ... ఎత్తుకొని
  rationale: ఆజ్ఞలో వాడిన అదే נשא క్రియకు అనుగుణంగా అదే తెలుగు పదాన్ని పునరావృతం చేసి వారి విధేయతను, పదసామ్యాన్ని నిలుపుతుంది.
- source_word: וַיֵּלְכוּ
  choice: వెళ్లారు
  rationale: הלך అనే సాధారణ కదలిక క్రియను అదనపు భావం చేర్చకుండా సహజమైన తెలుగు కథన రూపంలో అందిస్తుంది.
theological_decisions:
- issue: ఆరాధనా సందర్భంలోని నిబంధన పదబంధం
  choice: నిబంధన మందసం
  alternative: నిబంధనకు సంబంధించిన మందసం
  rationale: ఈ పదబంధం యెహోవా నిబంధనతో సంబంధమున్న పవిత్ర మందసాన్ని సూచిస్తుంది. సంక్షిప్త సంప్రదాయ రూపం హీబ్రూ సంధాన నిర్మాణాన్ని పారదర్శకంగా నిలుపుతూ అదనపు సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ఆజ్ఞలోనూ దాని అమలులోనూ ‘ఎత్తుకొని’ అనే పదాన్ని పునరావృతం చేసి హీబ్రూ మూలంలోని పదసామ్యాన్ని నిలిపాం. పాఠ్యంలో పాదటిప్పణులు లేవు.
