  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה קְח֤וּ לָ/כֶם֙ שְׁנֵ֣י עָשָׂ֣ר אִ֔ישׁ מִ/שִּׁבְטֵ֖י יִשְׂרָאֵ֑ל אִישׁ אֶחָ֥ד אִישׁ אֶחָ֖ד לַ/שָּֽׁבֶט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/012.yaml
  text: Now take for yourselves twelve men from the tribes of Israel[a], one man from each tribe.
translation:
  language: te
  text: ఇప్పుడు ఇశ్రాయేలు గోత్రాల నుంచి మీ కోసం పన్నెండుగురు పురుషులను తీసుకోండి—ప్రతి గోత్రానికి ఒక్కరు చొప్పున.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఒక్క మనిషి, గోత్రానికి ఒక్క మనిషి” అని ఉంది. ఇది ప్రతి గోత్రం నుంచి ఒక్క ప్రతినిధిని తీసుకోవాలని తెలిపే విభజనాత్మక ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: తదుపరి ఆదేశాన్ని పరిచయం చేసే సంధికాల పదం. తెలుగులో ‘ఇప్పుడు’ సహజంగా ఉండి వాక్యక్రమ మార్పును స్పష్టంగా చూపుతుంది.
- source_word: קְחוּ לָכֶם
  choice: మీ కోసం తీసుకోండి
  rationale: బహువచన ఆజ్ఞతో పాటు לָכֶם లోని ప్రయోజనార్థక భావాన్ని నిలుపుతుంది. సందర్భంలో ఇది ప్రతినిధులను ఎంపిక చేసి తీసుకోవడాన్ని సూచిస్తుంది; అయితే మూల క్రియకు దగ్గరగా ఉండేందుకు ‘తీసుకోండి’ వాడబడింది.
- source_word: שְׁנֵי עָשָׂר אִישׁ
  choice: పన్నెండుగురు పురుషులను
  rationale: אִישׁ ఇక్కడ ప్రతి గోత్రం నుంచి తీసుకునే పురుష ప్రతినిధులను సూచిస్తుంది. వ్యక్తులకు సహజమైన తెలుగు సంఖ్యారూపం ‘పన్నెండుగురు’ వాడబడింది.
- source_word: מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాల నుంచి
  rationale: ప్రతినిధులు ఏ సమూహం నుంచి తీసుకోబడాలో తెలిపే మూలార్థాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לַשָּׁבֶט
  choice: ఒక్కో గోత్రం నుంచి ఒక్కొక్కరిని
  rationale: 'హీబ్రూ పునరుక్తిలోని విభజనాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది: ప్రతి గోత్రం నుంచి ఒక పురుష ప్రతినిధి.'
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. హీబ్రూ పునరుక్తి భావాన్ని ‘ఒక్కో… ఒక్కొక్కరిని’ అనే తెలుగు నిర్మాణంతో ప్రతిబింబించాం; మూలంలోని పురుష ప్రతినిధుల సూచనను ‘పురుషులను’ అని స్పష్టంగా నిలిపాం.
