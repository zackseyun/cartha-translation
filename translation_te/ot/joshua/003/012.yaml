- from: ఇప్పుడు ఇశ్రాయేలు గోత్రాల నుంచి పన్నెండుగురు పురుషులను—ఒక్కో గోత్రం నుంచి ఒక్కొక్కరిని—మీ కోసం తీసుకోండి.[a]
