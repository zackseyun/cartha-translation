source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּצַוֶּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֥י אֲרֽוֹן הַ/בְּרִ֖ית לֵ/אמֹ֑ר כְּ/בֹאֲ/כֶ֗ם עַד קְצֵה֙ מֵ֣י הַ/יַּרְדֵּ֔ן בַּ/יַּרְדֵּ֖ן תַּעֲמֹֽדוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
translation:
  language: te
  text: 'నీవు నిబంధన మందసాన్ని మోసే యాజకులకు ఇలా ఆజ్ఞాపించాలి: “మీరు యొర్దాను నీటి అంచు వరకు[a] వచ్చినప్పుడు, యొర్దానులో నిలబడాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొర్దాను నీటి అంచు దాకా.”
    reason: עַד קְצֵה అనే పదబంధంలోని పరిమితి భావాన్ని ‘వరకు’ లేదా ‘దాకా’ అని సమానార్థకంగా వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: וְאַתָּה
  choice: నీవు
  rationale: స్వతంత్ర సర్వనామం యెహోషువను ప్రత్యేకంగా ఉద్దేశించి చెప్పడాన్ని నొక్కిచెబుతుంది. తెలుగులో సందర్భానుసారంగా వాక్యసంబంధం సహజంగానే స్పష్టమవుతున్నందున ‘నీవు’ అని అందించాం.
- source_word: תְּצַוֶּה
  choice: ఆజ్ఞాపించాలి
  rationale: పియేల్ అసంపూర్ణ క్రియ ఇక్కడ యెహోషువకు ఇవ్వబడిన నిర్దేశాన్ని తెలియజేస్తుంది; ‘ఆజ్ఞాపించాలి’ ఆ అధికారపూర్వక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: మోసే యాజకులకు
  rationale: నֹשְׂאֵי అనే కర్తరి అసమాపక రూపం యాజకులను విశేషిస్తుంది; తెలుగులో సంబంధార్థక క్రియారూపం సహజంగా ఉంటుంది.
- source_word: אֲרוֹן הַבְּרִית
  choice: నిబంధన మందసం
  rationale: ‘మందసం’ పవిత్ర పెట్టెను సూచించే గౌరవప్రదమైన, ప్రాచుర్యంలో ఉన్న పదం; నిర్మాణంలోని నిబంధన సంబంధాన్ని కూడా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష ఆజ్ఞను పరిచయం చేసే హీబ్రూ ఉక్తిసూచక రూపాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంతో అందిస్తుంది.
- source_word: כְּבֹאֲכֶם
  choice: మీరు … వచ్చినప్పుడు
  rationale: כְּ తో కూడిన క్రియానామ రూపానికి ఇక్కడ కాలార్థం ఉంది; బహువచన సంబోధనను ‘మీరు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַד קְצֵה מֵי הַיַּרְדֵּן
  choice: యొర్దాను నీటి అంచు వరకు
  rationale: עַד ‘వరకు’ అనే పరిమితిని, קְצֵה నీటి అంచు లేదా చివరను సూచిస్తాయి. తెలుగు పదక్రమం సహజంగా ఉండేలా మూలంలోని భావాన్ని నిలిపాం.
- source_word: בַּיַּרְדֵּן תַּעֲמֹדוּ
  choice: యొర్దానులో నిలబడాలి
  rationale: בְּ స్థలాన్ని సూచిస్తుంది; עמד ఇక్కడ నదిలో తమ స్థానం తీసుకొని నిలబడమనే ఆజ్ఞ. ‘నిలబడాలి’ దాని ప్రత్యక్ష భావాన్ని కాపాడుతుంది.
