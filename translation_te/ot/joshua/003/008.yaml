  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని అనుసరించాం. యాజకులకు ఉద్దేశించిన బహువచనాన్ని ‘మీరు’తో స్పష్టంగా చూపించాం; సంప్రదాయ పరిచయం మరియు అర్థస్పష్టత కోసం ‘నిబంధన మందసం’ వాడాం.
