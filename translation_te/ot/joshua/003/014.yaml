  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/נְסֹ֤עַ הָ/עָם֙ מֵ/אָ֣הֳלֵי/הֶ֔ם לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/הַ/כֹּהֲנִ֗ים נֹֽשְׂאֵ֛י הָ/אָר֥וֹן הַ/בְּרִ֖ית לִ/פְנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/014.yaml
  text: And it happened[a], when the people set out from their tents to cross the Jordan, and the priests carrying the ark of the covenant were before the people,
translation:
  language: te
  text: అప్పుడు ప్రజలు యొర్దాను దాటడానికి తమ గుడారాల నుండి బయలుదేరగా, నిబంధన మందసాన్ని మోస్తున్న యాజకులు ప్రజల ముందున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol సూత్రాన్ని తెలుగులో సహజమైన కథన సంధిగా వ్యక్తం చేస్తుంది; ప్రత్యేక సంఘటనార్థక క్రియను అనవసరంగా చేర్చదు.
- source_word: בִּנְסֹעַ הָעָם
  choice: ప్రజలు ... బయలుదేరినప్పుడు
  rationale: בְּ + infinitive construct తెలిపే కాలసంబంధ పరిస్థితిని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: מֵאָהֳלֵיהֶם
  choice: తమ గుడారాల నుండి
  rationale: ఆ సందర్భంలోని אהל అనే స్పష్టమైన పదార్థాన్ని నిలుపుతుంది; 'తమ' అనేది కర్తతో సహజమైన తెలుగు అన్వయం.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: యొర్దాను దాటడానికి
  rationale: లక్ష్యాన్ని తెలిపే infinitive constructను తెలుగులో ప్రయోజనార్థక రూపంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְהַכֹּהֲנִים נֹשְׂאֵי
  choice: మోస్తున్న యాజకులు
  rationale: హీబ్రూలోని నామవాచక/కర్తృవాచక నిర్మాణాన్ని సహజమైన విశేషణ క్రియారూపంగా అందిస్తుంది.
- source_word: הָאָרוֹן הַבְּרִית
  choice: నిబంధన మందసం
  rationale: ఆరాధనా సందర్భంలోని ארוןకు స్థిరమైన తెలుగు బైబిలు పదమైన 'మందసం', בריתకు విస్తృతంగా అర్థమయ్యే 'నిబంధన' ఉపయోగించబడ్డాయి.
- source_word: לִפְנֵי הָעָם
  choice: ప్రజల ముందు నడిచారు
  rationale: లిఖితపాఠంలోని స్థలార్థమైన 'ప్రజల ముందు'ను నిలుపుతూ, తెలుగు వాక్యం సంపూర్ణంగా ఉండేందుకు సందర్భసిద్ధమైన గమనక్రియను వ్యక్తం చేస్తుంది.
