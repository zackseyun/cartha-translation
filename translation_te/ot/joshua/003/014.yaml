translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. వచనం తరువాతి వాక్యంతో వ్యాకరణపరంగా కొనసాగుతున్నప్పటికీ, తెలుగులో సహజమైన సంపూర్ణ వాక్యంగా మలచబడింది.
