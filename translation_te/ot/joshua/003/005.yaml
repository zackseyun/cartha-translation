source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוֹשֻׁ֛עַ אֶל הָ/עָ֖ם הִתְקַדָּ֑שׁוּ כִּ֣י מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה בְּ/קִרְבְּ/כֶ֖ם נִפְלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/005.yaml
  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: te
  text: అప్పుడు యెహోషువ ప్రజలతో, “మిమ్మల్ని మీరు పవిత్రపరచుకోండి; ఎందుకంటే రేపు యెహోవా మీ మధ్య అద్భుతాలు చేస్తాడు” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְקַדָּשׁוּ
  choice: మిమ్మల్ని మీరు పవిత్రపరచుకోండి
  rationale: హిత్పయేల్ ఆజ్ఞారూపంలోని స్వీయ సిద్ధత/ప్రతిష్ఠ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ప్రజలు తమను పవిత్రపరచుకోవలసిన కారణాన్ని పరిచయం చేసే సాధారణ కారణార్థాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఇస్తుంది.
- source_word: בְּקִרְבְּכֶם
  choice: మీ మధ్య
  rationale: సమూహం నడుమ/వారి మధ్య అనే స్థల సంబంధ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: נִפְלָאוֹת
  choice: అద్భుతాలు
  rationale: దేవుని అసాధారణమైన ఆశ్చర్యకార్యాలను సూచించే బహువచన భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ప్రత్యక్షంగా ప్రతిబింబిస్తూ, బిరుదుగా మార్చడం వల్ల కలిగే భేదనష్టాన్ని నివారిస్తుంది.
- issue: הִתְקַדָּשׁוּ లోని పవిత్రీకరణ భావం
  choice: మిమ్మల్ని మీరు పవిత్రపరచుకోండి
  alternative: మిమ్మల్ని మీరు సిద్ధపరచుకోండి
  rationale: సందర్భంలో సిద్ధత ఉన్నప్పటికీ, మూల ధాతువులోని పవిత్రత/ప్రతిష్ఠ భావాన్ని తగ్గించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన ఆజ్ఞా శైలిని మరియు మూల వాక్యంలోని కారణ సంబంధాన్ని నిలుపుకుంది.
