id: JOS.3.3
reference: Joshua 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְצַוּוּ֮ אֶת הָ/עָ֣ם לֵ/אמֹר֒ כִּ/רְאֽוֹתְ/כֶ֗ם אֵ֣ת אֲר֤וֹן בְּרִית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/הַ/כֹּֽהֲנִים֙ הַ/לְוִיִּ֔ם נֹשְׂאִ֖ים אֹת֑/וֹ וְ/אַתֶּ֗ם תִּסְעוּ֙ מִ/מְּק֣וֹמְ/כֶ֔ם וַ/הֲלַכְתֶּ֖ם אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
translation:
  language: te
  text: 'వారు ప్రజలకు ఇలా ఆజ్ఞాపించారు: “మీ దేవుడైన యాహ్వే యొక్క నిబంధన మందసాన్ని, దాన్ని మోస్తున్న లేవీయ యాజకులను[a] మీరు చూసినప్పుడు, మీరు ఉన్న చోటు నుండి బయలుదేరి దాని వెనుక వెళ్లాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాజకులు, లేవీయులు.”
    reason: హెబ్రీ పదబంధం విశేషణాత్మకంగానూ అన్వయాత్మకంగానూ వ్యక్తీకరించవచ్చు.
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: వారు ... ఆజ్ఞాపించారు
  rationale: పీయేల్ రూపంలోని అధికారపూర్వక ఆజ్ఞ భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: כִּרְאוֹתְכֶם
  choice: మీరు చూసినప్పుడు
  rationale: כְּ + క్రియానామ రూపం ఇక్కడ కాలసంబంధ భావాన్ని ఇస్తుంది; వెంటనే అనే అదనపు భావాన్ని చేర్చకుండా దాన్ని నిలుపుతుంది.
- source_word: אֲרוֹן בְּרִית
  choice: నిబంధన మందసం
  rationale: ఆరాధనా సందర్భంలోని אֲרוֹן‌ను ‘మందసం’గా, בְּרִית‌ను ‘నిబంధన’గా తెలిపే స్థిరమైన, గౌరవప్రదమైన పదబంధం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ చతురక్షర నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: లేవీయ యాజకులు
  rationale: రెండు వేర్వేరు సమూహాలుగా అపార్థం కాకుండా, యాజకులను లేవీయులుగా గుర్తించే హెబ్రీ అన్వయాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: נֹשְׂאִים אֹתוֹ
  choice: దాన్ని మోస్తున్న
  rationale: మందసాన్ని భౌతికంగా మోసే చర్యను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּסְעוּ מִמְּקוֹמְכֶם
  choice: మీరు ఉన్న చోటు నుండి బయలుదేరి
  rationale: ప్రయాణానికి బయలుదేరే נסע భావాన్ని నిలుపుతూ, శిబిరాన్ని సర్దుకోవడం అనే మరింత నిర్దిష్ట భావాన్ని చేర్చదు.
- source_word: וַהֲלַכְתֶּם אַחֲרָיו
  choice: దాని వెనుక వెళ్లాలి
  rationale: ఆ మందసం వెనుకగా ప్రయాణించాలనే ప్రాదేశిక చిత్రణను నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- issue: הַכֹּהֲנִים הַלְוִיִּם యొక్క అన్వయం
  choice: లేవీయ యాజకులు
  alternative: యాజకులు, అంటే లేవీయులు
  rationale: ఈ పదబంధం సాధారణంగా యాజకులను లేవీయులుగా గుర్తిస్తుంది. అయితే హెబ్రీలోని అన్వయ నిర్మాణాన్ని మరింత స్పష్టంగా చూపే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా రూపసంబంధమైన స్వల్ప సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఆజ్ఞ యొక్క అధికార స్వరాన్ని ‘ఆజ్ఞాపించారు’ నిలుపుతుంది; ఉద్దేశ్యాన్ని మృదువుచేయలేదు. మందసాన్ని సూచించడానికి తరువాతి సర్వనామంగా నపుంసక ఏకవచనమైన ‘దాని’ ఉపయోగించబడింది.
