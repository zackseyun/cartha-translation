translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కాలసూచనను, అధికారులు శిబిరం అంతర్భాగం గుండా వెళ్లారనే స్థలచిత్రాన్ని కాపాడింది.
