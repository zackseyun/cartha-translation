  text: וַ/יְהִ֕י מִ/קְצֵ֖ה שְׁלֹ֣שֶׁת יָמִ֑ים וַ/יַּעַבְר֥וּ הַ/שֹּׁטְרִ֖ים בְּ/קֶ֥רֶב הַֽ/מַּחֲנֶֽה׃
