  text: And at the end of three days[a], the officers went through the midst of the camp.
translation:
  language: te
  text: మూడు రోజులు ముగిసినప్పుడు, అధికారులు శిబిరం మధ్యగా వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ముగిసినప్పుడు
  rationale: ఇక్కడ היה యొక్క వావ్-అనుక్రమ రూపం తదుపరి సంఘటనను పరిచయం చేసే కథన సంధిగా పనిచేస్తుంది. తెలుగులో కాలవాచక ఉపవాక్యంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: מִקְצֵה
  choice: ముగిసినప్పుడు
  rationale: מן + קצה ఇక్కడ కాలపరంగా ‘ముగింపులో/ముగిసిన తరువాత’ అనే భావాన్ని ఇస్తుంది. ‘ముగిసినప్పుడు’ కాల సరిహద్దును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజులు
  rationale: సంఖ్యతో కూడిన సూటి కాలవ్యవధి; అదనపు వివరణ అవసరం లేదు.
- source_word: וַיַּעַבְרוּ
  choice: వెళ్లారు
  rationale: עבר అనే క్రియకు ‘దాటి వెళ్లడం/గుండా వెళ్లడం’ అనే భావం ఉంది. בְּקֶרֶב తో కలిసి ఇది శిబిరం లోపలి భాగం గుండా కదలడాన్ని సూచిస్తుంది; తెలుగులో ‘మధ్యగా వెళ్లారు’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: הַשֹּׁטְרִים
  choice: అధికారులు
  rationale: ఈ పరిపాలనా-సైనిక సందర్భంలో שֹׁטְרִים ఆదేశాలను తెలియజేసి అమలు చేయించే నియమిత అధికారులను సూచిస్తుంది. ‘అధికారులు’ ఆధునిక తెలుగులో విస్తృతంగా అర్థమయ్యే గౌరవప్రదమైన పదం.
- source_word: בְּקֶרֶב
  choice: మధ్యగా
  rationale: קרב అంటే ‘మధ్యభాగం, లోపలి భాగం.’ కదలికను తెలిపే క్రియతో కలిసి ‘శిబిరం మధ్యగా’ అనడం అంతర్భాగం గుండా వెళ్లిన దృశ్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: הַמַּחֲנֶה
  choice: శిబిరం
  rationale: מחנה ఇక్కడ ఇశ్రాయేలీయుల మకాంను సూచిస్తుంది. ‘శిబిరం’ ప్రామాణికమైన, సహజమైన తెలుగు పదం.
