id: JOS.3.10
reference: Joshua 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּ֛י אֵ֥ל חַ֖י בְּ/קִרְבְּ/כֶ֑ם וְ/הוֹרֵ֣שׁ יוֹרִ֣ישׁ מִ֠/פְּנֵי/כֶם אֶת הַ/כְּנַעֲנִ֨י וְ/אֶת הַ/חִתִּ֜י וְ/אֶת הַ/חִוִּ֗י וְ/אֶת הַ/פְּרִזִּי֙ וְ/אֶת הַ/גִּרְגָּשִׁ֔י וְ/הָ/אֱמֹרִ֖י וְ/הַ/יְבוּסִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
translation:
  language: te
  text: 'యెహోషువ ఇలా అన్నాడు: “దీనివల్ల మీరు తెలుసుకుంటారు: సజీవుడైన దేవుడు మీ మధ్య ఉన్నాడని, ఆయన కనానీయులను, హిత్తీయులను, హివ్వీయులను, పెరిజ్జీయులను, గిర్గాషీయులను, అమోరీయులను, యెబూసీయులను మీ ఎదుటి నుండి తప్పకుండా వెళ్లగొడతాడని[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని తప్పకుండా స్వాధీనం కోల్పోయేలా చేస్తాడు.” హీబ్రూ క్రియ వారి నిర్ణయాత్మక తొలగింపును నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహంలో ప్రసంగాన్ని పరిచయం చేసే సాధారణ రూపం. తెలుగులో సహజంగా ఉండేందుకు ‘ఇలా అన్నాడు’ అని అనువదించాం.
- source_word: בְּזֹאת
  choice: దీనివల్ల
  rationale: రాబోయే సూచన లేదా కార్యం ద్వారా వారు తెలుసుకుంటారనే సాధనార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תֵּדְעוּן
  choice: మీరు తెలుసుకుంటారు
  rationale: సందర్భంలో ఉన్న భవిష్యదర్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֵל חַי
  choice: సజీవుడైన దేవుడు
  rationale: దేవుడు నిజంగా జీవించేవాడనే గుణార్థాన్ని, నిస్సహాయ విగ్రహాలతో అంతర్లీన వ్యత్యాసాన్ని అదనపు వివరణ లేకుండా వ్యక్తం చేస్తుంది.
- source_word: בְּקִרְבְּכֶם
  choice: మీ మధ్య
  rationale: ప్రజల సమూహం మధ్య దేవుని సన్నిధిని సూచిస్తుంది; వ్యక్తుల అంతరంగంలో ఉన్నాడనే అనవసర భావాన్ని కలిగించదు.
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  choice: తప్పకుండా వెళ్లగొడతాడు
  rationale: క్రియాధాతురూపం మరియు పరిమిత క్రియ కలయికలోని నిశ్చయాత్మక నొక్కును ‘తప్పకుండా’ ద్వారా నిలిపి, నిర్ణయాత్మక తొలగింపును ‘వెళ్లగొడతాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: מִפְּנֵיכֶם
  choice: మీ ఎదుటి నుంచి
  rationale: ఇశ్రాయేలీయుల ముందున్న ప్రదేశం నుండి ఆ ప్రజలను తొలగించే హీబ్రూ స్థలార్థక భావాన్ని సమీపంగా నిలుపుతుంది.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: కనానీయులను ... యెబూసీయులను
  rationale: హీబ్రూలో ఏకవచన సమూహనామాలుగా ఉన్న జనపదాల పేర్లను తెలుగులో సహజమైన బహువచన ప్రజానామాలుగా ఇచ్చాం.
theological_decisions:
- issue: אֵל חַי అనే దైవసూచక పదబంధాన్ని అనువదించడం
  choice: సజీవుడైన దేవుడు
  alternative: జీవముగల దేవుడు
  rationale: ఈ వచనంలో יהוה అనే ఒడంబడిక నామం కాకుండా אֵל חַי ఉంది. కాబట్టి మూలంలోని పదభేదాన్ని గౌరవిస్తూ ‘దేవుడు’ అని, జీవించే స్వభావాన్ని ‘సజీవుడైన’ అని అందించాం.
- issue: ఆక్రమణకు సంబంధించిన క్రియ యొక్క తీవ్రతను మృదువుచేయకుండా అనువదించడం
  choice: తప్పకుండా వెళ్లగొడతాడు
  alternative: తప్పకుండా వారి స్వాధీనాన్ని తొలగిస్తాడు
  rationale: హీబ్రూ నిర్ణయాత్మకంగా ఆ ప్రజలను తొలగించడాన్ని, దాని నిశ్చయాన్ని వ్యక్తం చేస్తుంది. ఎంపిక చేసిన పదాలు ఆ బలాన్ని నిలుపుతాయి; అయితే కార్యానికి మూలంలో లేని సమర్థనను జోడించవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ప్రజానామాలకు తెలుగులో స్థిరపడిన బహువచన రూపాలు వాడబడ్డాయి; హీబ్రూ వాక్యంలోని నిశ్చయాత్మక నొక్కు మరియు దేవుని సన్నిధి భావం నిలుపబడ్డాయి.
