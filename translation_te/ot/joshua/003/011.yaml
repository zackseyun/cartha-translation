source:
  edition: WLC
  text: הִנֵּה֙ אֲר֣וֹן הַ/בְּרִ֔ית אֲד֖וֹן כָּל הָ/אָ֑רֶץ עֹבֵ֥ר לִ/פְנֵי/כֶ֖ם בַּ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/011.yaml
  text: Look[a], the ark of the covenant, the Lord of all the earth, is crossing ahead of you in the Jordan.
translation:
  language: te
  text: ఇదిగో, సమస్త భూమికి ప్రభువు యొక్క నిబంధన మందసం మీకు ముందుగా యొర్దాను నదిలోకి[a] దాటిపోతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యొర్దాను నదిలో.’ హీబ్రూ పూర్వప్రత్యయాన్ని అలా మరింత అక్షరార్థంగా అనువదించవచ్చు; అయితే ఇక్కడ దాటే కదలికను బట్టి ‘నదిలోకి’ అనే భావం కూడా సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని వెంటనే ఆకర్షించే హీబ్రూ అవ్యయానికి సహజమైన, గంభీరమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: אֲרוֹן הַבְּרִית
  choice: నిబంధన మందసం
  rationale: ఇది ‘నిబంధనకు సంబంధించిన మందసం’ అనే సంబంధాన్ని సంక్షిప్తంగా, తెలుగు బైబిలు వాడుకకు అనుగుణంగా తెలియజేస్తుంది.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: సమస్త భూమికి ప్రభువైనవాని
  rationale: אָדוֹן అనే సార్వభౌమాధికార బిరుదును ‘ప్రభువు’గా నిలుపుతూ, మందసం ఆ ప్రభువుకు చెందినదనే సందర్భార్థాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: עֹבֵר
  choice: దాటిపోతోంది
  rationale: వర్తమాన కృదంతం సూచించే కళ్లముందు జరుగుతున్న లేదా వెంటనే జరగబోయే కదలికను ఈ రూపం సజీవంగా తెలియజేస్తుంది.
- source_word: לִפְנֵיכֶם
  choice: మీకు ముందుగా
  rationale: ప్రజలకంటే ముందుగా కదలడాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּיַּרְדֵּן
  choice: యొర్దాను నదిలోకి
  rationale: దాటడం అనే చలన క్రియతో కలిసి בְּ ప్రవేశ దిశను సూచించగలదు; ఈ సందర్భంలో మందసం నదిలోకి ప్రవేశించడాన్ని తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אֲדוֹן כָּל הָאָרֶץ అనే దైవిక సార్వభౌమాధికార బిరుదుకు నిబంధన మందసంతో ఉన్న సంబంధం
  choice: సమస్త భూమికి ప్రభువైనవాని నిబంధన మందసం
  alternative: నిబంధన మందసం, సమస్త భూమికి ప్రభువు
  rationale: హీబ్రూ పదక్రమం సంక్షిప్తమైనప్పటికీ, సందర్భం మరియు ప్రాచీన అనువాద సాక్ష్యం ఈ బిరుదు మందసానికే వర్తించే సమానాధికరణం కాదని, మందసం ఎవరిదో సూచిస్తుందని బలపరుస్తాయి. ఈ రూపం దేవుని విశ్వసార్వభౌమత్వాన్ని నిలుపుతూ, మందసాన్నే ‘ప్రభువు’గా పాఠకుడు అపార్థం చేసుకోకుండా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. ‘మందసం,’ ‘నిబంధన,’ ‘ప్రభువు’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం.
