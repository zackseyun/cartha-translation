  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל גֹּ֣שׁוּ הֵ֔נָּה וְ/שִׁמְע֕וּ אֶת דִּבְרֵ֖י יְהוָ֥ה אֱלֹֽהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/009.yaml
  text: Joshua said to the sons of Israel[a], “Come here and hear the words of Yahweh your God.”
translation:
  language: te
  text: 'యెహోషువ ఇశ్రాయేలు కుమారులతో[a] ఇలా అన్నాడు: “ఇక్కడికి వచ్చి, మీ దేవుడైన యాహ్వే మాటలు వినండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలు సంతతివారితో,” లేదా “ఇశ్రాయేలీయులతో.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: אמר యొక్క సాధారణ కథన రూపం ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేస్తోంది. తెలుగులో ‘ఇలా అన్నాడు’ సహజంగా ఉండి, తరువాతి ఉద్ధరణతో స్పష్టంగా అనుసంధానమవుతుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తిపేరుకు దగ్గరగా ఉండే, తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో
  rationale: אֶל ఇక్కడ మాటల గ్రహీతలను సూచిస్తుంది; తెలుగులో ‘తో ... అన్నాడు’ సహజమైన నిర్మాణం. בְּנֵי יִשְׂרָאֵל యొక్క అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ను నిలుపుతుంది.
- source_word: גֹּשׁוּ הֵנָּה
  choice: ఇక్కడికి వచ్చి
  rationale: బహువచన ఆజ్ఞ గల נגשׁ మరియు దిశను సూచించే הֵנָּה కలిపి, మాట్లాడుతున్నవాని దగ్గరకు రావాలని చెబుతాయి. ‘ఇక్కడికి వచ్చి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וְשִׁמְעוּ
  choice: వినండి
  rationale: שׁמע యొక్క బహువచన ఆజ్ఞారూపం. సందర్భంలో శ్రద్ధగా వినడం అంతర్భూతమైనా, ‘వినండి’ మూలంలోని సరళతను కాపాడుతుంది.
- source_word: אֶת דִּבְרֵי
  choice: మాటలు
  rationale: דִּבְרֵי యొక్క బహువచన రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది; ‘సందేశం’ అని ఏకవచనంగా భావవ్యాఖ్య చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించబడింది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: ప్రత్యయం బహువచన సంబోధితులకు ‘మీ’ అని సూచిస్తుంది. ఇశ్రాయేలు దేవుని సూచిస్తున్నందున אֱלֹהִים ఇక్కడ ఏకవచనార్థంలో ‘దేవుడు’; ‘అయిన’ అనే అనుసంధానం సహజ తెలుగు సంబంధాన్ని ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల ‘ప్రభువు’ అనే బిరుదుతో దాన్ని భర్తీ చేయలేదు. ఉచ్చారణ పూర్తిగా నిశ్చితం కాకపోయినా, ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠంలో నిలిపి, అది వంశసంబంధమైన సమూహపేరుగా ఉపయోగించబడుతున్న విషయాన్ని పాదసూచికలో స్పష్టం చేశాం. ఇలా చేయడం మూలరూపాన్ని చెరపకుండా దాని సందర్భార్థాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇక్కడికి వచ్చి ... వినండి’ అని రెండు ఆజ్ఞలను తెలుగు ప్రవాహానికి అనుగుణంగా అనుసంధానించాం. దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం; మూలంలోని జాతిసంబంధ పదబంధాన్ని ప్రధాన పాఠంలో నిలిపాం.
