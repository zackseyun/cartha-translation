translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. భౌగోళిక పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం. మూలంలోని నీళ్లు ఒకే కుప్పగా లేచి నిలిచిన దృశ్యాన్ని సరళీకరించకుండా నిలిపాం.
