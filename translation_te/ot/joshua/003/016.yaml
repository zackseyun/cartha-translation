  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעַמְד֡וּ הַ/מַּיִם֩ הַ/יֹּרְדִ֨ים מִ/לְ/מַ֜עְלָ/ה קָ֣מוּ נֵד אֶחָ֗ד הַרְחֵ֨ק מְאֹ֜ד ב/אדם הָ/עִיר֙ אֲשֶׁר֙ מִ/צַּ֣ד צָֽרְתָ֔ן וְ/הַ/יֹּרְדִ֗ים עַ֣ל יָ֧ם הָ/עֲרָבָ֛ה יָם הַ/מֶּ֖לַח תַּ֣מּוּ נִכְרָ֑תוּ וְ/הָ/עָ֥ם עָבְר֖וּ נֶ֥גֶד יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/016.yaml
  text: the waters flowing down from above stood still[a]; they rose up in one heap, very far away, at Adam, the city beside Zarethan. And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off[b], and the people crossed over opposite Jericho.
translation:
  language: te
  text: ఎగువనుండి దిగివస్తున్న జలాలు నిలిచిపోయి[a], చాలా దూరంగా, సారెతాను ప్రక్కనున్న ఆదాము పట్టణం వద్ద ఒకే కుప్పగా లేచి నిలిచాయి. అరాబా సముద్రమైన ఉప్పు సముద్రం[b] వైపు దిగివస్తున్న జలాలు పూర్తిగా తెగిపోయాయి. ప్రజలు యెరికోకు ఎదురుగా దాటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అవి ఒకే కుప్పగా నిలిచాయి.’ హీబ్రూ చిత్రణ జలాలు ఒకే కుప్పగా కూడి అడ్డుగోడవలె నిలవడాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఉప్పు సముద్రం’ అనేది తరువాత సాధారణంగా ‘మృత సముద్రం’ అని పిలువబడిన జలాశయం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: నిలిచిపోయి
  rationale: עמד అనే క్రియ నీటి సహజ ప్రవాహం ఆగిపోవడాన్ని ఇక్కడ సూచిస్తుంది; ‘నిలిచిపోయి’ అనేది నిలవడం, ప్రవాహం ఆగడం అనే రెండు భావాలనూ సహజంగా తెలియజేస్తుంది.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: ఎగువ నుండి ప్రవహిస్తూ వచ్చిన నీళ్లు
  rationale: ఈ పదబంధం ఎత్తైన ఎగువ ప్రాంతం నుండి దిగివచ్చే ప్రవాహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఎగువ నుండి’ నది ఎగువ భాగాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קָמוּ נֵד אֶחָד
  choice: ఒకే కుప్పగా లేచి నిలిచాయి
  rationale: קום + נֵד నీళ్లు ఒకే గుట్ట లేదా అడ్డుగోడలా పైకి కూడిన దృశ్యాన్ని ఇస్తుంది; ఈ అనువాదం ఆ స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: הַרְחֵק מְאֹד
  choice: చాలా దూరంలో
  rationale: మూలంలోని దూరాన్ని బలపరిచే ప్రయోగాన్ని సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְאָדָם
  choice: ఆదాము పట్టణం దగ్గర
  rationale: אָדָם ఇక్కడ వ్యక్తిని సూచించే సాధారణ నామవాచకం కాదు, స్థలనామం; తరువాతి ‘పట్టణం’ అనే వివరణను తెలుగులో పేరుతో కలిపి ఇవ్వడం అపార్థాన్ని నివారిస్తుంది.
- source_word: הָעִיר אֲשֶׁר מִצַּד צָרְתָן
  choice: సారెతాను పక్కన ఉన్న ఆదాము పట్టణం
  rationale: מִצַּד సమీపం లేదా పక్కన ఉండటాన్ని సూచిస్తుంది; ‘పక్కన ఉన్న’ దాని భౌగోళిక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְהַיֹּרְדִים עַל יָם הָעֲרָבָה
  choice: అరాబా సముద్రం ... వైపు ప్రవహిస్తున్న నీళ్లు
  rationale: అధ్యాహృతమైన ‘నీళ్లు’ను తెలుగులో స్పష్టంగా చేర్చడం అవసరం; עַל ఇక్కడ గమ్యదిశను సూచిస్తున్నందున ‘వైపు’ సరిపోతుంది.
- source_word: יָם הַמֶּלַח
  choice: ఉప్పు సముద్రం
  rationale: ఇది హీబ్రూ భౌగోళిక నామానికి ప్రత్యక్ష అనువాదం; తరువాత ప్రాచుర్యం పొందిన ‘మృత సముద్రం’ అనే పేరును ప్రధాన పాఠ్యంలో పెట్టలేదు.
- source_word: תַּמּוּ נִכְרָתוּ
  choice: పూర్తిగా తెగిపోయాయి
  rationale: జతగా వచ్చిన రెండు క్రియలు దిగువ ప్రవాహం సంపూర్ణంగా నిలిచిపోయిందనే తీవ్రతను ఇస్తాయి; ‘పూర్తిగా తెగిపోయాయి’ ఆ సంయుక్త బలాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: וְהָעָם עָבְרוּ
  choice: అప్పుడు ప్రజలు ... దాటారు
  rationale: עבר ఇక్కడ యొర్దాను నదిని దాటడాన్ని సూచిస్తుంది; సందర్భంలో కర్మ స్పష్టంగా ఉన్నందున తెలుగులో ‘దాటారు’ సహజంగా ఉంటుంది.
- source_word: נֶגֶד יְרִיחוֹ
  choice: యెరికోకు ఎదురుగా
  rationale: נֶגֶד ఒక ప్రదేశానికి ఎదురుగా లేదా అభిముఖంగా ఉన్న స్థానాన్ని సూచిస్తుంది; ‘ఎదురుగా’ భౌగోళిక భావాన్ని నేరుగా తెలియజేస్తుంది.
