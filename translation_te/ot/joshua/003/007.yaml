revisions:
- from: 'యెహోవా యెహోషువతో ఇలా అన్నాడు: “నేను మోషేతో ఉన్నట్లే నీతోనూ ఉంటానని ఇశ్రాయేలీయులందరూ తెలుసుకునేలా, ఈ రోజే వారి దృష్టిలో నిన్ను గొప్పవాడిగా చేయడం మొదలుపెడతాను.”'
  to: 'యాహ్వే యెహోషువతో ఇలా అన్నాడు: “ఈ రోజున నేను ఇశ్రాయేలీయులందరి దృష్టిలో నిన్ను ఘనపరచడం మొదలుపెడతాను; నేను మోషేతో ఉన్నట్లే నీతోనూ ఉంటానని వారు తెలుసుకునేలా చేస్తాను.”'
  rationale: The revision retains every source element and preserves the purpose/result nuance of אֲשֶׁר יֵדְעוּן through “వారు తెలుసుకునేలా చేస్తాను.” It adopts “యాహ్వే” to match the POB audit trail's mandated rendering of the Tetragrammaton and uses “ఘనపరచడం” for the public elevation signaled by גדל and “in the eyes of all Israel.” No footnote is needed, since the English lexical alternative does not identify a textual ambiguity requiring a Telugu note.
