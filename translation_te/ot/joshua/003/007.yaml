id: JOS.3.7
reference: Joshua 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ גַּדֶּלְ/ךָ֔ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל אֲשֶׁר֙ יֵֽדְע֔וּ/ן כִּ֗י כַּ/אֲשֶׁ֥ר הָיִ֛יתִי עִם מֹשֶׁ֖ה אֶהְיֶ֥ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
translation:
  language: te
  text: 'యాహ్వే యెహోషువతో ఇలా అన్నాడు: “ఈ రోజున నేను ఇశ్రాయేలీయులందరి దృష్టిలో నిన్ను ఘనపరచడం మొదలుపెడతాను; నేను మోషేతో ఉన్నట్లే నీతోనూ ఉంటానని వారు తెలుసుకునేలా చేస్తాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన శైలిలోని సాధారణ ‘అన్నాడు’ అనే భావాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య పరిచయంగా ఇచ్చాం.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజే
  rationale: ‘ఈ రోజు’ అనే కాల సూచనతో పాటు మూలంలోని నిర్దిష్ట ఉద్ఘాటనను ‘ఏ’ ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: אָחֵל
  choice: మొదలుపెడతాను
  rationale: హిఫిల్ రూపం ఇక్కడ ‘ప్రారంభించు’ అనే అర్థం ఇస్తుంది; సందర్భంలోని సమీప భవిష్యత్తు ప్రకటనను నిలిపాం.
- source_word: גַּדֶּלְךָ
  choice: నిన్ను గొప్పవాడిగా చేయడం
  rationale: పియేల్ రూపంలోని ‘గొప్పగా చేయు/ఘనపరచు’ భావాన్ని, యెహోషువ స్థాయిని ప్రజల దృష్టిలో పైకి తేవడం అనే అర్థంతో స్పష్టంగా అనువదించాం.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి దృష్టిలో
  rationale: అక్షరార్థమైన ‘కళ్లలో’ కంటే ప్రజల అవగాహన, గౌరవం అనే హీబ్రూ నుడికార భావాన్ని సహజ తెలుగులో తెలిపాం.
- source_word: אֲשֶׁר יֵדְעוּן
  choice: తెలుసుకునేలా
  rationale: ఈ సంబంధవాచక వాక్యభాగంలో ఉన్న ఉద్దేశం/ఫలితం రెండింటికీ వీలున్న భావాన్ని సంక్షిప్తంగా నిలిపాం.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: నేను మోషేతో ఉన్నట్లే
  rationale: మోషేతో దేవుని సాన్నిధ్యానికి, యెహోషువతో ఉండబోయే సాన్నిధ్యానికి మధ్యనున్న స్పష్టమైన పోలికను కాపాడాం.
- source_word: אֶהְיֶה עִמָּךְ
  choice: నీతోనూ ఉంటాను
  rationale: దైవసాన్నిధ్యానికి సంబంధించిన సూటి భవిష్యత్ వాగ్దానాన్ని తెలిపి, పోలికలోని అనుసంధానాన్ని ‘నూ’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక ప్రామాణిక తెలుగులో బైబిల్ పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: యెహోషువను ‘గొప్పవాడిగా చేయడం’ యొక్క స్వభావం
  choice: ప్రజల దృష్టిలో అతని స్థాయిని దేవుడు పైకి తేవడం
  alternative: అంతర్గతంగా లేదా స్వతహాగా అతన్ని మహోన్నతునిగా మార్చడం
  rationale: בְּעֵינֵי כָּל־יִשְׂרָאֵל అనే పదబంధం ప్రజల ఎదుట కనిపించే గుర్తింపు, అధికార స్థాపనపై దృష్టి పెడుతుంది; దానికంటే ఎక్కువ సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని ఉద్దేశం/ఫలితం సంబంధాన్ని ‘తెలుసుకునేలా’ అని సహజంగా ఇచ్చాం; అనవసరమైన మతపర పదజాలాన్ని చేర్చలేదు.
