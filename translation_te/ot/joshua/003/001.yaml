id: JOS.3.1
reference: Joshua 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּם֩ יְהוֹשֻׁ֨עַ בַּ/בֹּ֜קֶר וַ/יִּסְע֣וּ מֵֽ/הַ/שִּׁטִּ֗ים וַ/יָּבֹ֨אוּ֙ עַד הַ/יַּרְדֵּ֔ן ה֖וּא וְ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּלִ֥נוּ שָׁ֖ם טֶ֥רֶם יַעֲבֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
translation:
  language: te
  text: యెహోషువ ఉదయాన్నే లేచాడు. అతడూ ఇశ్రాయేలు కుమారులందరూ[a] షిత్తీము నుంచి బయలుదేరి యొర్దాను వరకు వచ్చారు. వారు దాటకముందు అక్కడ ఆ రాత్రి బస చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులందరూ.” హెబ్రీలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులందరూ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: ఉదయాన్నే లేచాడు
  rationale: שׁכם హిఫీల్ రూపం తెల్లవారగానే లేదా ఉదయాన్నే లేవడాన్ని సూచిస్తుంది. ‘ఉదయాన్నే లేచాడు’ అనేది కాలప్రాధాన్యాన్ని నిలుపుతూ సహజమైన ఆధునిక తెలుగు ప్రయోగంగా ఉంది.
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: ప్రయాణ కథనంలో נסע సాధారణంగా శిబిరాన్ని విడిచి ప్రయాణం మొదలుపెట్టడాన్ని సూచిస్తుంది. ‘బయలుదేరి’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מֵהַשִּׁטִּים
  choice: షిత్తీము నుంచి
  rationale: ఇది స్థలనామం కాబట్టి దాని సాధ్యమైన అర్థమైన ‘తుమ్మచెట్ల తోపు’ అని అనువదించకుండా, పేరును లిప్యంతరీకరించాం.
- source_word: וַיָּבֹאוּ עַד הַיַּרְדֵּן
  choice: యొర్దాను దగ్గరికి వచ్చారు
  rationale: ఈ నిర్మాణం యొర్దాను వరకు చేరుకోవడాన్ని సూచిస్తుంది. ‘దగ్గరికి వచ్చారు’ అనే ప్రయోగం నది ఒడ్డుకు చేరిన కథా సందర్భాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הוּא וְכָל־בְּנֵי יִשְׂרָאֵל
  choice: అతడూ ఇశ్రాయేలు కుమారులందరూ
  rationale: הוּא యెహోషువను స్పష్టంగా తిరిగి సూచిస్తున్నందున ‘అతడూ’ నిలుపబడింది. בְּנֵי יִשְׂרָאֵל యొక్క వంశబంధ రూపాన్ని పారదర్శకంగా చూపేందుకు ‘ఇశ్రాయేలు కుమారులు’ అని అనువదించాం.
- source_word: וַיָּלִנוּ שָׁם
  choice: అక్కడ ఆ రాత్రి బసచేశారు
  rationale: לון ఇక్కడ రాత్రిపూట అక్కడే ఉండడాన్ని సూచిస్తుంది. ‘ఆ రాత్రి బసచేశారు’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన వ్యక్తీకరణ.
- source_word: טֶרֶם יַעֲבֹרוּ
  choice: వారు దాటకముందు
  rationale: טֶרֶם తరువాతి చర్య ఇంకా జరగకముందున్న సమయాన్ని సూచిస్తుంది. సందర్భంలో עבר యొర్దానును దాటడాన్ని సూచిస్తున్నా, మూలంలో కర్మ ప్రత్యక్షంగా లేకపోవడంతో తెలుగులోనూ దాన్ని అనవసరంగా చేర్చలేదు.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: ఇది సిద్ధాంతపరమైన వివాదం కాదు; అయితే హెబ్రీ జాతీయ-వంశబంధ పదబంధంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠంలో పారదర్శకంగా నిలిపాం. మరింత సహజమైన సామూహిక రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. స్థలనామాలకు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణలు వాడబడ్డాయి. మూలంలోని కథన క్రమం, యెహోషువను తిరిగి సూచించే సర్వనామం, దాటడానికి ముందున్న రాత్రి బస అనే కాలసంబంధం నిలుపబడ్డాయి.
