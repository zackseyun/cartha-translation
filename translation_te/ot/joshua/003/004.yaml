source:
  edition: WLC
  text: אַ֣ךְ רָח֣וֹק יִהְיֶ֗ה בֵּֽינֵי/כֶם֙ ו/בינ/ו כְּ/אַלְפַּ֥יִם אַמָּ֖ה בַּ/מִּדָּ֑ה אַֽל תִּקְרְב֣וּ אֵלָ֗י/ו לְמַ֤עַן אֲשֶׁר תֵּֽדְעוּ֙ אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ כִּ֣י לֹ֧א עֲבַרְתֶּ֛ם בַּ/דֶּ֖רֶךְ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
translation:
  language: te
  text: అయితే మీకూ దానికీ మధ్య కొలత ప్రకారం దాదాపు రెండు వేల మూరల[a] దూరం ఉండాలి. దాని దగ్గరికి వెళ్లకండి, మీరు వెళ్లవలసిన మార్గాన్ని తెలుసుకునేలా; ఎందుకంటే ఇంతకుముందు మీరు ఈ మార్గంలో వెళ్లలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఒక మూర అనేది ప్రాచీన పొడవు కొలమానం; సుమారుగా ముంజేతి పొడవు.
    reason: cultural_note
  - marker: b
    text: “ఇంతకుముందు” అనే మాటకు హెబ్రీలో అక్షరార్థంగా “నిన్నటి నుంచీ మొన్నటి నుంచీ” అని ఉంది; ఇది “మునుపు” లేదా “ఇంతకు ముందు” అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి ఆదేశానికి పరిమితి లేదా వ్యత్యాసాన్ని జోడించే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינוֹ
  choice: మీకూ దానికీ మధ్య ... దూరం ఉండాలి
  rationale: హెబ్రీ వాక్యంలోని మధ్యనున్న దూర భావాన్ని నిలుపుతూ, సందర్భంలోని నిబంధనను సహజ తెలుగులో వ్యక్తం చేస్తుంది. ‘దానికి’ అనేది సందర్భంలో నిబంధన మందసాన్ని సూచిస్తుంది.
- source_word: כְּאַלְפַּיִם אַמָּה בַּמִּדָּה
  choice: కొలత ప్రకారం దాదాపు రెండు వేల మూరల
  rationale: כְּ యొక్క సుమారు అనే భావాన్ని ‘దాదాపు’గా, בַּמִּדָּהను ‘కొలత ప్రకారం’గా అందించి, ప్రాచీన ప్రమాణమైన మూరను ప్రధాన పాఠ్యంలో నిలిపింది.
- source_word: אַל תִּקְרְבוּ אֵלָיו
  choice: దాని దగ్గరికి వెళ్లకండి
  rationale: స్పష్టమైన నిషేధాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְמַעַן אֲשֶׁר תֵּדְעוּ
  choice: అప్పుడు ... మీకు తెలుస్తుంది
  rationale: మందసానికి దూరంగా ఉండటంలోని ఉద్దేశం లేదా ఫలితాన్ని సందర్భానుకూలంగా తెలుపుతుంది.
- source_word: אֶת־הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: మీరు వెళ్లవలసిన మార్గం
  rationale: వారు అనుసరించబోయే మార్గాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ఉండేలా సంబంధవాచక నిర్మాణాన్ని సంక్షిప్తం చేసింది.
- source_word: כִּי לֹא עֲבַרְתֶּם בַּדֶּרֶךְ
  choice: ఎందుకంటే ... మీరు ఈ మార్గంలో వెళ్లలేదు
  rationale: ప్రయాణ సందర్భంలో עָבַר యొక్క దాటడం/ప్రయాణించడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: ఇంతకుముందు
  rationale: ‘నిన్నటి నుంచీ మొన్నటి నుంచీ’ అనే హెబ్రీ నుడికారానికి సందర్భోచితమైన సాధారణ తెలుగు సమానార్థకం.
