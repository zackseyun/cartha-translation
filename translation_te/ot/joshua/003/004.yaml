translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన శైలి. ప్రాచీన కొలమానాన్ని ‘మూర’గా నిలిపి, వాక్య ప్రవాహం కోసం ఉద్దేశ్య నిర్మాణాన్ని సహజ తెలుగులో అమర్చాం.
