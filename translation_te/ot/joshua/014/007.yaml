  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
translation:
  language: te
  text: యాహ్వే సేవకుడైన మోషే దేశాన్ని వేగు చూడటానికి కాదేశ్-బర్నేయ నుంచి నన్ను పంపినప్పుడు నాకు నలభై ఏళ్లు. నా హృదయంలో ఉన్నదాని ప్రకారమే నేను అతనికి తిరిగి నివేదించాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా హృదయానుసారంగా నేను అతనికి తిరిగి నివేదించాను.”
    reason: כַּאֲשֶׁר עִם לְבָבִי అనే హీబ్రూ రూపకానికి మరో సహజ తెలుగు వ్యక్తీకరణ; అంతరంగ భావం లేదా అంచనాకు అనుగుణంగా అనే స్వల్ప అస్పష్టతను నిలుపుతుంది.
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: నాకు నలభై ఏళ్లు
  rationale: హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בִּשְׁלֹחַ
  choice: పంపినప్పుడు
  rationale: ב ఉపసర్గతో ఉన్న infinitive construct కాలసంబంధ పరిస్థితిని సూచిస్తుంది; తెలుగులో ‘పంపినప్పుడు’ సహజంగా ఉంది.
- source_word: עֶבֶד יְהוָה
  choice: యాహ్వే సేవకుడైన
  rationale: మోషేకు గౌరవపూర్వక అధికార బిరుదుగా ఉన్న ‘సేవకుడు’ అనే భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరించింది.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: కాదేశ్-బర్నేయ నుంచి
  rationale: స్థలనామాన్ని మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించి, מִן యొక్క అపాదాన భావాన్ని ‘నుంచి’తో తెలిపింది.
- source_word: לְרַגֵּל
  choice: వేగు చూడటానికి
  rationale: సాధారణ పర్యటన కాకుండా గూఢ పరిశీలన లేదా నిఘా అనే క్రియాభావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: దేశాన్ని
  rationale: ఇక్కడ నిర్దిష్ట భూభాగాన్ని సూచించే הָאָרֶץకు సందర్భానుకూలమైన సహజ తెలుగు పదం.
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  choice: నేను అతనికి సమాచారం తీసుకొచ్చాను
  rationale: ‘మాటను తిరిగి తెచ్చాను’ అనే హీబ్రూ నుడికారాన్ని నివేదిక లేదా సమాచారం అందించడం అనే సహజ తెలుగు భావంలో వ్యక్తపరుస్తుంది.
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  choice: నా హృదయంలో ఉన్నదాని ప్రకారమే
  rationale: కాలేబు అంతరంగ నమ్మకానికి అనుగుణంగా మాట్లాడాడనే భావాన్ని ఉంచుతూ, నిజాయితీ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- issue: ‘నా హృదయంలో ఉన్నదాని ప్రకారం’ అనే మాట యొక్క ఉద్దేశం
  choice: రూపకాన్ని, దాని స్వల్ప అస్పష్టతను నిలుపడం
  alternative: పూర్తి నిజాయితీతో
  rationale: మూలపాఠం అంతరంగ నమ్మకం, అంచనా లేదా ఉద్దేశం మధ్య ఏ ఒక్క భావాన్నీ స్పష్టంగా ఖరారు చేయదు; అందువల్ల వ్యాఖ్యానాత్మక విస్తరణను నివారించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వేగు చూడటం’ నిఘా భావాన్ని నిలుపుతుంది; ‘హృదయం’ అనే మూల రూపకాన్ని ఉద్దేశపూర్వకంగా సంరక్షించింది. పాదటిప్పణి గుర్తు అది వివరిస్తున్న చివరి వాక్యభాగం తరువాత ఉంచబడింది.
