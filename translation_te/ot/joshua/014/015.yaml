source:
  edition: WLC
  text: וְ/שֵׁ֨ם חֶבְר֤וֹן לְ/פָנִים֙ קִרְיַ֣ת אַרְבַּ֔ע הָ/אָדָ֧ם הַ/גָּד֛וֹל בָּ/עֲנָקִ֖ים ה֑וּא וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/015.yaml
  text: The former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
translation:
  language: te
  text: హెబ్రోను పూర్వపు పేరు కిర్యత్-అర్బా[a]. అర్బా అనాకీయులలో గొప్పవాడు[b]. ఆ దేశానికి యుద్ధం నుండి విశ్రాంతి లభించింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కిర్యత్-అర్బా” అనే పేరుకు బహుశా “అర్బా పట్టణం” అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అనాకీయులలో ప్రముఖుడు”; హీబ్రూ పదబంధం అర్బా వారిలో అగ్రగణ్యుడని సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా, “ఆ దేశం యుద్ధం లేక ప్రశాంతంగా ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים
  choice: హెబ్రోనుకు పూర్వం … అని పేరు
  rationale: לְפָנִים అనే పదానికి ‘పూర్వం’ అని సహజమైన తెలుగు రూపం ఇచ్చి, నామకరణ వాక్యాన్ని ఆధునిక తెలుగు వాక్యనిర్మాణంలో అందించాం. ప్రారంభ וְ ను సందర్భానుసార అనుసంధానంగా గ్రహించి ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: קִרְיַת אַרְבַּע
  choice: కిర్యత్-అర్బా
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; దాని సంభావ్య అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: הָאָדָם הַגָּדוֹל בָּעֲנָקִים הוּא
  choice: అర్బా అనాకీయులలో గొప్పవాడు
  rationale: הוּא సూచించే వ్యక్తిని తెలుగులో స్పష్టత కోసం ‘అర్బా’ అని పేర్కొన్నాం. הַגָּדוֹל ను తప్పనిసరిగా అతిశయోక్తిగా నిర్ణయించకుండా ‘గొప్పవాడు’గా ఉంచి, ప్రముఖత లేదా అగ్రస్థాన భావానికి పాదసూచిక ఇచ్చాం.
- source_word: עֲנָקִים
  choice: అనాకీయులు
  rationale: అనాకు సంబంధించిన జనసమూహాన్ని సూచించే హీబ్రూ జాతినామాన్ని తెలుగులో సహజమైన బహువచన వ్యక్తివాచక రూపంతో అందించాం.
- source_word: וְהָאָרֶץ שָׁקְטָה מִמִּלְחָמָה
  choice: ఆ దేశానికి యుద్ధం నుండి విశ్రాంతి లభించింది
  rationale: שׁקט అనే క్రియలోని ప్రశాంతత, కలతలేమి, పోరు నిలిచిన స్థితి అన్న భావాలను విజయవంతంగా మోసే సహజ తెలుగు ప్రయోగంగా ‘విశ్రాంతి లభించింది’ ఎంచుకున్నాం. וְ ను కొత్త వాక్య ప్రారంభంలో ప్రత్యేక సంధిపదం లేకుండానే సహజంగా ప్రతిబింబించాం.
theological_decisions:
- issue: הָאָדָם הַגָּדוֹל యొక్క స్థాయి భావం
  choice: గొప్పవాడు
  alternative: అందరికంటే గొప్పవాడు / ప్రముఖుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న הַגָּדוֹל సందర్భంలో అగ్రస్థానాన్ని సూచించవచ్చు; అయితే రూపం స్వయంగా నిర్బంధంగా అతిశయోక్తినే కోరదు. అందువల్ల ప్రధాన పాఠ్యంలో విస్తృతార్థమైన ‘గొప్పవాడు’ను ఉంచి ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపాం.
- issue: הוּא యొక్క పూర్వపద సూచన
  choice: అర్బా
  alternative: అతడు
  rationale: హీబ్రూలో సర్వనామం ఉన్నప్పటికీ, తెలుగులో ‘అతడు’ అంటే స్థలనామమైన కిర్యత్-అర్బాతో గందరగోళం కలగవచ్చు. సందర్భం అర్బా అనే వ్యక్తిని సూచిస్తున్నందున పేరును పునరుక్తం చేశాం; కొత్త సమాచారాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సరళమైన శైలిని ఉపయోగించాం. స్థలనామాలు, జాతినామాలు లిప్యంతరీకరించబడ్డాయి; మూలంలోని భావసందిగ్ధతలను పాదసూచికల్లో నిలిపాం.
