  text: Then Joshua blessed him and gave Hebron to Caleb son of Jephunneh as an inheritance[a].
translation:
  language: te
  text: అప్పుడు యెహోషువ అతన్ని ఆశీర్వదించి, యెఫున్నె కుమారుడైన కాలేబుకు హెబ్రోనును స్వాస్థ్యంగా ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కాలేబును ఆశీర్వదించి’; హీబ్రూలో ‘అతన్ని ఆశీర్వదించి’ అని ఉంది. సందర్భాన్ని బట్టి ‘అతన్ని’ అనేది కాలేబును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: అతన్ని ఆశీర్వదించి
  rationale: בּרך క్రియకు జతైన మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం ‘అతన్ని’ అని సూచిస్తుంది. సందర్భంలో ఆ వ్యక్తి కాలేబు అని స్పష్టమైనప్పటికీ, మూలంలోని సర్వనామ రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుకున్నాం.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן అనే సాధారణ క్రియకు ప్రత్యక్షమైన అర్థం ‘ఇచ్చాడు’; భూభాగ కేటాయింపు సందర్భంలో అదనపు వ్యాఖ్యాన భావం చేర్చకుండా దీనిని వాడాం.
- source_word: אֶת חֶבְרוֹן
  choice: హెబ్రోనును
  rationale: אֶת కర్మ సూచికను తెలుగులో ప్రత్యేక పదంగా అనువదించకుండా, స్థల నామమైన חֶבְרוֹןను కర్మ విభక్తితో ఇచ్చాం.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: యెఫున్నె కుమారుడైన కాలేబుకు
  rationale: לְ పరోక్ష కర్మను ‘కాలేబుకు’గా, వంశ సూచనను సహజమైన తెలుగు క్రమంలో ‘యెఫున్నె కుమారుడైన’గా అందించాం.
- source_word: לְנַחֲלָה
  choice: స్వాస్థ్యంగా
  rationale: נַחֲלָה ఇశ్రాయేలు భూభాగ కేటాయింపు సందర్భంలో వారసత్వంగా లభించే భూమిని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు రిజిస్టర్‌లో ‘స్వాస్థ్యం’ ఈ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
