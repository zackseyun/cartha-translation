id: JOS.14.12
reference: Joshua 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנָ/ה לִּ/י֙ אֶת הָ/הָ֣ר הַ/זֶּ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י אַתָּֽה שָׁמַעְתָּ֩ בַ/יּ֨וֹם הַ/ה֜וּא כִּֽי עֲנָקִ֣ים שָׁ֗ם וְ/עָרִים֙ גְּדֹל֣וֹת בְּצֻר֔וֹת אוּלַ֨י יְהוָ֤ה אוֹתִ/י֙ וְ/ה֣וֹרַשְׁתִּ֔י/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/012.yaml
  text: Now give me this hill country that Yahweh spoke about on that day[a], because you yourself heard on that day that the Anakim are there, with great fortified cities. Perhaps Yahweh will be with me, and I will drive them out[b], just as Yahweh said.
translation:
  language: te
  text: ఇప్పుడు, ఆ రోజున యాహ్వే చెప్పిన ఈ పర్వత ప్రాంతాన్ని నాకు ఇవ్వు[a]. ఎందుకంటే, అక్కడ అనాకీయులు ఉన్నారని, పెద్ద, ప్రాకారాలతో ఉన్న నగరాలు ఉన్నాయని ఆ రోజున నువ్వే విన్నావు. బహుశా యాహ్వే నాకు తోడుగా ఉంటాడు[b]; యాహ్వే చెప్పినట్లుగానే నేను వారిని వెళ్లగొడతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ పర్వతాన్ని.” హీబ్రూ పదం ఒకే పర్వతాన్నీ పర్వతమయ ప్రాంతాన్నీ సూచించగలదు; ఇక్కడ విస్తృత ప్రాంతం అనే అర్థం ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “బహుశా యాహ్వే నాకు తోడుగా [ఉంటాడు].” మూలంలో క్రియ లేదు; ఇది దేవుని సన్నిధి, సహాయం కోసం ఉన్న ఆశను సూచించే సంక్షిప్త ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ఇది కాలసూచనతో పాటు కాలేబు ముందుగా చెప్పిన విషయాల ఆధారంగా తన ప్రస్తుత అభ్యర్థనను ప్రవేశపెడుతుంది; ఆధునిక తెలుగులో ‘కాబట్టి ఇప్పుడు’ ఆ అనుసంధానాన్ని సహజంగా చూపుతుంది.
- source_word: תְּנָה לִּי
  choice: నాకు ఇవ్వు
  rationale: נתן క్రియ యొక్క ఆజ్ఞార్థక రూపంలోని సూటితనాన్ని, పరోక్ష కర్మను యథాతథంగా నిలుపుతుంది.
- source_word: אֶת־הָהָר הַזֶּה
  choice: ఏ పర్వత ప్రాంతం ... దాన్ని
  rationale: הַר ఒకే పర్వతాన్నీ పర్వతమయ ప్రాంతాన్నీ సూచించగలదు. భూస్వాస్థ్య సందర్భంలో ప్రాంతీయ అర్థమే ఎక్కువగా సరిపోతుంది.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: యాహ్వే ఏ పర్వత ప్రాంతం గురించి చెప్పాడో
  rationale: דבר యొక్క ప్రాథమిక అర్థమైన ‘చెప్పాడు/మాట్లాడాడు’ను ఉంచి, సందర్భాన్ని బట్టి ‘వాగ్దానం చేశాడు’ అని మరింత నిర్దిష్టంగా మార్చలేదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: כִּי אַתָּה שָׁמַעְתָּ
  choice: నువ్వే విన్నావు
  rationale: స్పష్టంగా ఉన్న אַתָּה ఇచ్చే ఉద్ఘాటనను తెలుగు ‘నువ్వే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי עֲנָקִים שָׁם
  choice: అక్కడ అనాకీయులు ఉన్నారని
  rationale: ప్రజావర్గ నామాన్ని తెలుగులో లిప్యంతరీకరించి, కాలేబు ఎదుర్కోబోయే ప్రస్తుత పరిస్థితిని సూచించేలా వర్తమాన స్థితిని ఉంచింది.
- source_word: וְעָרִים גְּדֹלוֹת בְּצֻרוֹת
  choice: గొప్ప ప్రాకార నగరాలు ఉన్నాయని
  rationale: ‘గొప్ప’ మరియు ‘కోటగోడలుగల’ అనే రెండు భావాలను సహజమైన, గంభీరమైన తెలుగు పదబంధంలో నిలుపుతుంది.
- source_word: אוּלַי
  choice: బహుశా
  rationale: కాలేబు మాటలోని వినయపూర్వకమైన ఆశను, నిశ్చయాన్ని అతిగా పెంచకుండా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה אוֹתִי
  choice: యాహ్వే నాకు తోడుగా ఉంటాడు
  rationale: క్రియలేని హీబ్రూ వాక్యభాగాన్ని రాబోయే యుద్ధ సందర్భంలో సహజమైన భవిష్యత్ భావంతో అందిస్తుంది; దైవసన్నిధి మరియు సహాయం రెండింటినీ పూర్తిగా విడదీయకుండా ఉంచుతుంది.
- source_word: וְהוֹרַשְׁתִּים
  choice: నేను వారిని వెళ్లగొడతాను
  rationale: ירשׁ హిఫిల్ రూపం ఇక్కడ దేశ నివాసులను తొలగించడం/స్వాధీనాన్ని కోల్పోయేలా చేయడం అనే భావం ఇస్తుంది; ‘వెళ్లగొడతాను’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది.
- issue: אוּלַי יְהוָה אוֹתִי యొక్క భావబలం
  choice: బహుశా యాహ్వే నాకు తోడుగా ఉంటాడు
  alternative: యాహ్వే నాకు సహాయం చేయవచ్చు
  rationale: ‘తోడుగా ఉండడం’ అనే మూలంలోని సంక్షిప్త, క్రియలేని నిర్మాణాన్ని నిలుపుతూ, అది దైవసహాయాన్ని సూచిస్తుందనే భావాన్ని పాఠ్యంలో పూర్తిగా విప్పి చెప్పలేదు; ‘బహుశా’లోని ఉద్వేగాన్ని కూడా కాపాడింది.
- issue: యాహ్వే మాట యొక్క స్వభావం
  choice: చెప్పాడు
  alternative: వాగ్దానం చేశాడు
  rationale: సందర్భం వాగ్దానాత్మకమైనప్పటికీ మూలక్రియ సాధారణంగా ‘మాట్లాడు/చెప్పు’; అనువాదం ఆ సందర్భార్థాన్ని సిద్ధాంతపరంగా మరింత నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి వాడబడింది. యెహోషువను ఉద్దేశించిన ఏకవచన సంభాషణలో ‘నువ్వే’, ‘ఇవ్వు’ రూపాలు మూలంలోని ప్రత్యక్షతను నిలుపుతాయి. ‘అనాకీయులు’ ప్రజావర్గ నామంగా ఉంచబడింది; ‘ప్రాకార నగరాలు’ కోటగోడలుగల నగరాల భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
