  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֣ע מֹשֶׁ֗ה בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמֹר֒ אִם לֹ֗א הָ/אָ֨רֶץ֙ אֲשֶׁ֨ר דָּרְכָ֤ה רַגְלְ/ךָ֙ בָּ֔/הּ לְ/ךָ֨ תִֽהְיֶ֧ה לְ/נַחֲלָ֛ה וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָ֑ם כִּ֣י מִלֵּ֔אתָ אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
translation:
  language: te
  text: 'ఆ రోజున మోషే ప్రమాణం చేసి ఇలా అన్నాడు: “నిశ్చయంగా[a], నీ పాదం మోపిన దేశం నీకూ నీ కుమారులకూ[b] శాశ్వతంగా స్వాస్థ్యమవుతుంది. ఎందుకంటే నీవు నా దేవుడైన యాహ్వేను సంపూర్ణంగా అనుసరించావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “కాకపోతే” అనే రూపం ఉంది; ఇక్కడ అది ప్రమాణ వాక్యంలో బలమైన నిశ్చయాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీ సంతానానికీ.” హీబ్రూ మూలంలో అక్షరార్థంగా “నీ కుమారులకూ” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేసి
  rationale: నిఫాల్ రూపంలోని שׁבע అంటే ప్రమాణం చేయడం. తెలుగు వాక్యప్రవాహంలో ‘ప్రమాణం చేసి ఇలా అన్నాడు’ సహజంగా ఉండి దాని గంభీరతను నిలుపుతుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాలసూచక హీబ్రూ పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: אִם לֹא
  choice: నిశ్చయంగా
  rationale: ఇది ఇక్కడ షరతును సూచించకుండా, ప్రమాణ వాక్యంలో బలమైన నిశ్చయాన్ని తెలిపే హీబ్రూ నుడికారం.
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  choice: నీ పాదం మోపిన దేశం
  rationale: ‘నీ పాదం’ అనే ఏకవచన దృశ్యరూపాన్ని నిలుపుతూ, דרך సూచించే తొక్కడం లేదా అడుగుపెట్టడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִהְיֶה לְךָ לְנַחֲלָה
  choice: నీకూ … స్వాస్థ్యమవుతుంది
  rationale: נַחֲלָהలోని వారసత్వంగా లభించే భూభాగం లేదా కేటాయించిన ఆస్తి భావాన్ని ‘స్వాస్థ్యం’ తెలియజేస్తుంది; క్రియలోని భవిష్యత్ భావం కూడా నిలుస్తుంది.
- source_word: וּלְבָנֶיךָ
  choice: నీ కుమారులకూ
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘నీ కుమారులు’ అని ఉంది; మూలంలోని లింగసూచనను ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: దీర్ఘకాలిక, నిరంతర స్వాధీనతను గంభీరమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי מִלֵּאתָ אַחֲרֵי
  choice: ఎందుకంటే నీవు … సంపూర్ణంగా అనుసరించావు
  rationale: מלא אחרי అనే నుడికారంలోని పూర్తిగా లేదా నిండుగా అనుసరించడం అనే భావాన్ని, దాని రూపకాన్ని అతిగా విస్తరించకుండా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהָי
  choice: నా దేవుడైన
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయాన్ని స్పష్టంగా నిలుపుతుంది; యాహ్వేతో సహజ తెలుగు సంబంధాన్ని ఏర్పరుస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా గుర్తించదగిన ‘యాహ్వే’ రూపంలో లిప్యంతరీకరించాం.
- issue: וּלְבָנֶיךָలోని వారసుల లింగసూచన
  choice: నీ కుమారులకూ
  alternative: నీ సంతానానికీ
  rationale: మూల హీబ్రూ అక్షరార్థంగా ‘నీ కుమారులు’ అని చెబుతుంది. విస్తృత వంశసంతతి భావం సాధ్యమైనప్పటికీ, ప్రధాన పాఠ్యం మూలంలోని నిర్దిష్ట పదాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: מִלֵּאתָ אַחֲרֵי అనే అనుసరణ నుడికారం
  choice: సంపూర్ణంగా అనుసరించావు
  alternative: హృదయపూర్వకంగా అనుసరించావు
  rationale: ‘హృదయపూర్వకంగా’ భావాన్ని వివరిస్తుంది గాని మూలంలో ‘హృదయం’ అనే పదం లేదు. ‘సంపూర్ణంగా’ మూల నుడికారానికి దగ్గరగా ఉండి దాని ఆధ్యాత్మిక బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన శైలి వాడబడింది. ‘నీ పాదం మోపిన’ అనే స్పష్టమైన దృశ్యరూపం, ‘స్వాస్థ్యం’ అనే భూవారసత్వ పదం, ‘సంపూర్ణంగా అనుసరించావు’ అనే మూల నుడికారానికి దగ్గరైన రూపం నిలుపబడ్డాయి.
