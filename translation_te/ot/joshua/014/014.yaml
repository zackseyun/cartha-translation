source:
  edition: WLC
  text: עַל כֵּ֣ן הָיְתָֽה חֶ֠בְרוֹן לְ/כָלֵ֨ב בֶּן יְפֻנֶּ֤ה הַ/קְּנִזִּי֙ לְֽ/נַחֲלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה יַ֚עַן אֲשֶׁ֣ר מִלֵּ֔א אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/014.yaml
  text: Therefore Hebron became the inheritance of Caleb son of Jephunneh the Kenizzite to this day[a], because he fully followed Yahweh, the God of Israel.
translation:
  language: te
  text: అందుచేత కెనిజ్జీయుడైన యెఫున్నె కుమారుడు కాలేబుకు హెబ్రోను నేటివరకు స్వాస్థ్యమైంది. ఎందుకంటే అతడు ఇశ్రాయేలు దేవుడైన యాహ్వేను పూర్తిగా అనుసరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేను పూర్ణహృదయంతో అనుసరించాడు.” హెబ్రీ నుడికారం అక్షరార్థంగా “యాహ్వే వెనుక నింపాడు” అని చెబుతుంది; ఇది సంపూర్ణ నిష్ఠను వ్యక్తపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ముందటి సందర్భంలో కాలేబుకు హెబ్రోను ఇవ్వబడిన దాని ఫలితాన్ని సూచించే కారణ-ఫల సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הָיְתָה ... לְנַחֲלָה
  choice: స్వాస్థ్యంగా ఉంది
  rationale: హెబ్రోను కాలేబుకు కేటాయించబడిన వారసత్వపు భూస్వాస్థ్యమై, కథకుని కాలం వరకూ అలాగే కొనసాగిందనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: חֶבְרוֹן
  choice: హెబ్రోను
  rationale: స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: కెనిజ్జీయుడైన యెఫున్నె కుమారుడు కాలేబుకు
  rationale: లామెద్ సూచించే స్వాధీనత/లబ్ధిదారు సంబంధాన్ని ‘కాలేబుకు’ అని స్పష్టంగా చూపిస్తూ, వంశపరిచయాన్ని సహజమైన తెలుగు క్రమంలో ఉంచుతుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: కథకుని వర్తమాన కాలం వరకూ ఆ స్థితి కొనసాగిందనే హెబ్రీ నుడికారాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: יַעַן אֲשֶׁר
  choice: ఎందుకంటే
  rationale: కాలేబుకు ఆ స్వాస్థ్యం లభించడానికి గల కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: מִלֵּא אַחֲרֵי
  choice: పూర్తిగా అనుసరించాడు
  rationale: అక్షరార్థంగా ‘వెనుక నింపాడు’ అనే హెబ్రీ నుడికారం సంపూర్ణ విశ్వాసనిష్ఠతో అనుసరించడాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో రూపకాన్ని కొంత నిలుపుతూ అర్థాన్ని సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ భావవ్యక్తీకరణను పాదటిప్పణిలో ఇస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు ధ్వన్యనుకరణలో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: నిర్మాణ శృంఖల అర్థాన్ని నేరుగా, సహజంగా తెలిపి యాహ్వేను ఇశ్రాయేలు దేవుడిగా గుర్తిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని నామప్రయోగాన్ని కాపాడుతుంది.
- issue: מִלֵּא אַחֲרֵי లోని కాలేబు విశ్వాసనిష్ఠ స్వరూపం
  choice: పూర్తిగా అనుసరించాడు
  alternative: నిండు హృదయంతో అనుసరించాడు
  rationale: హెబ్రీ నుడికారం సంపూర్ణమైన అనుసరణను తెలియజేస్తుంది; అది కేవలం భావోద్వేగాన్నా, విధేయతనూ ప్రత్యేకంగా పరిమితం చేయదు. అందుచేత ప్రధాన పాఠంలో విస్తృతమైన ‘పూర్తిగా అనుసరించాడు’ ఉంచి, సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలి వాడబడింది. భూవిభజన సందర్భానికి తగిన ‘స్వాస్థ్యం’ పదాన్ని నిలిపి, సంక్లిష్టమైన హెబ్రీ నుడికారానికి ప్రధాన పాఠంలో స్పష్టమైన అర్థాన్ని, పాదటిప్పణిలో ప్రత్యామ్నాయ రూపాన్ని ఇచ్చాం.
