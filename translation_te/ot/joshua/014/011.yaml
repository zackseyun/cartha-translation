source:
  edition: WLC
  text: עוֹדֶ֨/נִּי הַ/יּ֜וֹם חָזָ֗ק כַּֽ/אֲשֶׁר֙ בְּ/י֨וֹם שְׁלֹ֤חַ אוֹתִ/י֙ מֹשֶׁ֔ה כְּ/כֹ֥חִ/י אָ֖ז וּ/כְ/כֹ֣חִ/י עָ֑תָּה לַ/מִּלְחָמָ֖ה וְ/לָ/צֵ֥את וְ/לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
translation:
  language: te
  text: మోషే నన్ను పంపిన రోజున నేను ఎంత బలంగా ఉన్నానో, ఈ రోజు కూడా అంతే బలంగా ఉన్నాను. అప్పుడు నాకున్న బలమే ఇప్పుడు కూడా ఉంది—యుద్ధం చేయడానికి, బయటికి వెళ్లడానికి, లోపలికి రావడానికి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “బయటికి వెళ్లడానికి, లోపలికి రావడానికి.” ఇది కార్యాచరణలోను నాయకత్వంలోను సంపూర్ణ సామర్థ్యంతో ఉండడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי הַיּוֹם חָזָק
  choice: ఈ రోజు కూడా ... బలంగా ఉన్నాను
  rationale: עוֹדֶנִּי లోని కొనసాగింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘కూడా’ ద్వారా తెలియజేసి, חָזָק ను సందర్భానుసారంగా ‘బలంగా’ అని అనువదించాం.
- source_word: כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה
  choice: మోషే నన్ను పంపిన రోజున ... ఎంత ... అంతే
  rationale: హీబ్రూ పోలికను తెలుగులో సహజమైన ‘ఎంత...అంతే’ నిర్మాణంతో వ్యక్తం చేస్తూ, నిర్దిష్టమైన కాలసూచనను నిలిపాం.
- source_word: כְּכֹחִי אָז וּכְכֹחִי עָתָּה
  choice: అప్పుడు నాకున్న బలమే ఇప్పుడు కూడా ఉంది
  rationale: క్రియలేని సమాంతర హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టంగా పూర్తిచేసి, గత బలం మరియు ప్రస్తుత బలం సమానమనే భావాన్ని కాపాడాం.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి
  rationale: מִלְחָמָה ఇక్కడ కాలేబు యుద్ధసామర్థ్యాన్ని సూచిస్తుంది; ‘యుద్ధం చేయడానికి’ సాధారణ పాఠకునికి సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְלָצֵאת וְלָבוֹא
  choice: బయలుదేరడానికి, తిరిగి రావడానికి
  rationale: ‘వెళ్లడం–రావడం’ అనే హీబ్రూ జంటను దాని క్రియాశీలత మరియు కార్యసామర్థ్య భావంతో సహజ తెలుగులో అందించాం; విస్తృత నుడికార భావాన్ని పాదటిప్పణిలో సూచించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని సమాంతర పోలికను రెండు సహజ తెలుగు వాక్యాలుగా నిలిపి, నుడికారంలోని సంభావ్య విస్తృత భావాన్ని పాదటిప్పణిలో ఉంచాం.
