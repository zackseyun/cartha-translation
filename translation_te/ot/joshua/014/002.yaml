source:
  edition: WLC
  text: בְּ/גוֹרַ֖ל נַחֲלָתָ֑/ם כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/002.yaml
  text: Their inheritance was by lot[a], as Yahweh had commanded through Moses, for the nine tribes and the half-tribe.
translation:
  language: te
  text: యాహ్వే మోషే ద్వారా[a] ఆజ్ఞాపించినట్లుగా, తొమ్మిది గోత్రాలకూ అర్ధగోత్రానికీ వారి స్వాస్థ్యం చీట్ల ద్వారా కేటాయించబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో ‘మోషే చేతి ద్వారా’; ఇది మధ్యవర్తిత్వం లేదా కార్యసాధకత్వాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: మూల నుడికారపు అక్షరార్థ రూపాన్ని మరియు అనువాదంలో తీసుకున్న సహజ తెలుగు రూపాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: చీట్లు వేసి
  rationale: בְּ అనే ఉపసర్గ ఇక్కడ సాధనం లేదా విధానాన్ని సూచిస్తుంది; గోరాలు వేసి భూభాగాన్ని నిర్ణయించిన ప్రక్రియను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: נַחֲלָתָם
  choice: వారి స్వాస్థ్యం
  rationale: נַחֲלָה ఇక్కడ నిబంధనాపరంగా వారికి కేటాయించబడిన భూస్వాస్థ్యాన్ని సూచిస్తుంది; ‘స్వాస్థ్యం’ ఆ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించిన ప్రకారం
  rationale: ఇప్పటికే మోషే ద్వారా ఇవ్వబడిన దైవాజ్ఞకు అనుగుణంగా విభజన జరిగిందనే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపమైన రూపంలో ఉంచుతుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’ అయిన ఈ హీబ్రూ నుడికారం మధ్యవర్తిత్వం లేదా కార్యసాధకత్వాన్ని సూచిస్తుంది; ‘మోషే ద్వారా’ ఆధునిక తెలుగులో సహజంగా ఆ అర్థాన్ని ఇస్తుంది.
- source_word: לְתִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: తొమ్మిది గోత్రాలకూ అర్ధగోత్రానికీ
  rationale: לְ గ్రహీతలను సూచిస్తుంది; מַטֶּה సందర్భానుసారం ‘గోత్రం,’ చివరి ఏకవచన రూపం యొర్దాను పశ్చిమాన స్వాస్థ్యం పొందే అర్ధగోత్రాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత నామమే ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని నిబంధన నామాన్ని కాపాడుతుంది.
- issue: భూస్వాస్థ్య విభజనలో చీట్ల పాత్ర
  choice: చీట్లు వేసి నిర్ణయించబడింది
  alternative: చీటి ప్రకారం స్వాస్థ్యం కలిగింది
  rationale: పాఠ్యం చీట్లను విభజనకు ఉపయోగించిన విధానంగా పేర్కొంటుంది; దైవాధిపత్యం గురించి పాఠ్యంలో లేని అదనపు వివరణను చేర్చకుండా ప్రక్రియను మాత్రమే అనువదిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ వాక్యంలో స్పష్టమైన క్రియ లేకపోయినా, సందర్భానుసారమైన భావాన్ని తెలుగులో పూర్తి చేయడానికి ‘నిర్ణయించబడింది’ చేర్చబడింది. ‘అర్ధగోత్రం’ను సందర్భం తెలియజేసినంతవరకే ఉంచి, ‘మనష్షే’ అనే పేరును మూలవాక్యంలో లేనందున చేర్చలేదు.
