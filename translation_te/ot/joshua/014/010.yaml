source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּה֩ הֶחֱיָ֨ה יְהוָ֣ה אוֹתִ/י֮ כַּ/אֲשֶׁ֣ר דִּבֵּר֒ זֶה֩ אַרְבָּעִ֨ים וְ/חָמֵ֜שׁ שָׁנָ֗ה מֵ֠/אָז דִּבֶּ֨ר יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ אֶל מֹשֶׁ֔ה אֲשֶׁר הָלַ֥ךְ יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וְ/עַתָּה֙ הִנֵּ֣ה אָנֹכִ֣י הַ/יּ֔וֹם בֶּן חָמֵ֥שׁ וּ/שְׁמוֹנִ֖ים שָׁנָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/010.yaml
  text: And now[a], behold, Yahweh has kept me alive, just as he said, these forty-five years since Yahweh spoke this word to Moses while Israel walked in the wilderness. And now, behold[c][b], today I am eighty-five years old.
translation:
  language: te
  text: “ఇప్పుడు ఇదిగో, యాహ్వే తాను చెప్పినట్టే ఈ నలభై ఐదు సంవత్సరాలుగా నన్ను సజీవంగా ఉంచాడు[a]—యాహ్వే మోషేతో ఈ మాట[b] చెప్పినప్పటి నుండి, ఇశ్రాయేలు అరణ్యంలో నడిచినప్పుడు[c]. ఇప్పుడు ఇదిగో, నేడు నాకు ఎనభై ఐదు సంవత్సరాలు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను జీవించి ఉండేలా కాపాడాడు.”
    reason: lexical_alternative
  - marker: b
    text: “ఈ మాట” అనే పదబంధాన్ని “ఈ విషయం” అని, లేదా సందర్భాన్ని వివరిస్తూ “ఈ వాగ్దానం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఇశ్రాయేలు అరణ్యంలో ప్రయాణిస్తున్నప్పుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱיָה
  choice: సజీవంగా కాపాడుతూ వచ్చాడు
  rationale: హిఫిల్ రూపం ఇక్కడ మొదట జీవం ఇవ్వడాన్ని కాక, కాలేబును ఇన్నేళ్లూ జీవించి ఉండేలా కాపాడడాన్ని సూచిస్తుంది. తెలుగు వర్తమాన సందర్భంలో కొనసాగుతున్న ఫలితాన్ని ఈ ప్రయోగం సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని పేరునే లిప్యంతరీకరించింది.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: తాను చెప్పినట్టే
  rationale: ముందు పలికిన మాట నెరవేరిన భావాన్ని కాపాడుతుంది; ‘వాగ్దానం చేసినట్టే’ అని అర్థాన్ని మరీ నిర్దిష్టం చేయదు.
- source_word: זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה
  choice: నలభై ఐదు సంవత్సరాలు గడిచాయి
  rationale: హీబ్రూ ప్రయోగం గతంలోని ఒక సమయం నుంచి ప్రస్తుత దినం వరకూ గడిచిన కాలాన్ని సూచిస్తుంది; తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: מֵאָז
  choice: చెప్పినప్పటి నుంచి
  rationale: నలభై ఐదు సంవత్సరాల కాలవ్యవధి మొదలైన బిందువును స్పష్టంగా సూచిస్తుంది.
- source_word: הַדָּבָר הַזֶּה
  choice: ఈ మాట
  rationale: דבר పదంలోని ‘మాట’ అనే ప్రాథమిక భావాన్ని నిలుపుతుంది; సందర్భానుసారంగా సాధ్యమైన ‘విషయం’ లేదా ‘వాగ్దానం’ అనే అర్థాలను ప్రధాన పాఠంలో బలవంతంగా ఎంచుకోదు.
- source_word: אֲשֶׁר הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: ఇశ్రాయేలు అరణ్యంలో సంచరిస్తున్నప్పుడు
  rationale: הלך యొక్క నడవడం/వెళ్లడం అనే భావాన్ని, ఇశ్రాయేలు అరణ్య ప్రయాణ సందర్భంలో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షించే హీబ్రూ ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: אָנֹכִי הַיּוֹם
  choice: ఈ రోజుకు నాకు
  rationale: కాలేబు ప్రస్తుత వయస్సుపై ఉన్న దృష్టిని తెలుగు వాక్యక్రమంలో సహజంగా తెలియజేస్తుంది.
- source_word: בֶּן חָמֵשׁ וּשְׁמוֹנִים שָׁנָה
  choice: ఎనభై ఐదు సంవత్సరాలు
  rationale: ‘ఎనభై ఐదు సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని తెలుగులో సాధారణ వయస్సు వ్యక్తీకరణగా అనువదించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని పేరును నిలుపుతుంది.
- issue: הַדָּבָר הַזֶּה ను వాగ్దానంగా స్పష్టీకరించాలా
  choice: ఈ మాట
  alternative: ఈ వాగ్దానం
  rationale: సందర్భంలో అది వాగ్దాన స్వభావం కలిగి ఉన్నప్పటికీ, మూలపదం ‘మాట’, ‘విషయం’ అనే విస్తృత అర్థాలను కూడా కలిగి ఉంది. కాబట్టి ప్రధాన పాఠం ఆ అర్థ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఇదిగో’ అనే పదం మూలంలోని రెండుసార్ల ఉద్ఘాటనను నిలుపుతుంది. దీర్ఘ హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, కాలసంబంధం మరియు వాక్యభారం యథాతథంగా ఉంచబడ్డాయి.
