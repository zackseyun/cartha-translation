  text: But my brothers who went up with me made the heart of the people melt, while I wholly followed the LORD my God.
translation:
  language: te
  text: కానీ నాతో కలిసి వెళ్లిన నా సహోదరులు ప్రజల హృదయాన్ని కరిగిపోయేలా చేశారు; నేను మాత్రం నా దేవుడైన యెహోవాను పూర్తిగా అనుసరించాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: నా సహోదరులు
  rationale: ఇక్కడ కాలేబుతో వెళ్లిన తోటి ఇశ్రాయేలీయ గూఢచారులను సూచించే బంధుత్వపదాన్ని గౌరవప్రదంగా, సహజంగా అందిస్తుంది.
- source_word: הִמְסִיו אֶת־לֵב הָעָם
  choice: ప్రజల హృదయాన్ని కరిగిపోయేలా చేశారు
  rationale: భయంతో ధైర్యం కోల్పోయేలా చేయడం అనే హీబ్రూ రూపకాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: מִלֵּאתִי אַחֲרֵי
  choice: సంపూర్ణంగా అనుసరించాను
  rationale: అక్షరార్థంగా ‘వెనుక నింపాను’ అనే హీబ్రూ నుడికారానికి, యెహోవాను పూర్తిగా మరియు నమ్మకంగా అనుసరించాననే భావాన్ని సహజ తెలుగు రూపంలో ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన నామరూపంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: కాలేబు తన అనుసరణను వర్ణించిన తీవ్రత
  choice: సంపూర్ణంగా అనుసరించాను
  alternative: నమ్మకంగా అనుసరించాను
  rationale: מִלֵּאתִי అనే నుడికారం సంపూర్ణతను బలంగా సూచిస్తుంది; కేవలం సాధారణ విశ్వాస్యతగా సడలించలేదు.
- issue: దైవనామం ప్రతిపాదన
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాక వ్యక్తిగత నామమైన టెట్రాగ్రామటన్ ఉంది; అందువల్ల నామరూపాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘హృదయం కరిగిపోవడం’ అనే మూల రూపకాన్ని నిలిపి, దాని కారణార్థక భావాన్ని ‘కరిగిపోయేలా చేశారు’గా సహజీకరించాం. విరుద్ధతను ‘అయితే… కానీ…’తో స్పష్టంగా చూపించాం.
