  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
translation:
  language: te
  text: 'అప్పుడు యూదా వంశస్థులు గిల్గాలులో యెహోషువ దగ్గరికి వచ్చారు. కెనిజ్జీయుడైన యెఫున్నె కుమారుడు కాలేబు అతనితో ఇలా అన్నాడు: “కాదేషు-బర్నేయలో నా గురించి, నీ గురించి యాహ్వే దేవుని మనిషియైన మోషేతో చెప్పిన మాట[a] నీకు తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విషయం,” “సంగతి.”
    reason: הַדָּבָר అనే పదం నిర్దిష్టమైన పలుకుతో పాటు విషయం లేదా సంగతిని కూడా సూచించగలదు.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: దగ్గరికి వచ్చారు
  rationale: נגשׁ సూచించే సమీపించడం అనే కథన కదలికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְנֵי יְהוּדָה
  choice: యూదా వంశస్థులు
  rationale: అక్షరార్థంగా ‘యూదా కుమారులు’; సందర్భంలో ఇది గోత్ర సమూహాన్ని సూచిస్తున్నందున ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בַּגִּלְגָּל
  choice: గిల్గాలులో
  rationale: స్థలనామానికి తగిన సహజమైన స్థానవాచక రూపం.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: కెనిజ్జీయుడైన యెఫున్నె కుమారుడు కాలేబు
  rationale: వ్యక్తి, తండ్రి, వంశ/జాతి గుర్తింపులను మూలంలోని విధంగా నిలుపుతుంది.
- source_word: אַתָּה יָדַעְתָּ
  choice: నీకు తెలుసు
  rationale: హీబ్రూ పరిపూర్ణ క్రియ ఇక్కడ ప్రస్తుత జ్ఞానస్థితిని సూచిస్తుంది; ఈ తెలుగు రూపం సహజమైనది.
- source_word: הַדָּבָר
  choice: మాట
  rationale: ఇక్కడ నిర్దిష్టమైన దైవిక ఉక్తిని సూచిస్తుంది; ‘విషయం/సంగతి’ అనే సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచాం.
- source_word: דִּבֶּר יְהוָה
  choice: యాహ్వే ... చెప్పిన
  rationale: దేవుడు మోషేతో పలికిన నిర్దిష్ట ఉక్తిని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి మోషే
  rationale: ‘దేవుని మనిషి’ అనే బైబిలు బిరుదును సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ
  choice: నా గురించి, నీ గురించి
  rationale: హీబ్రూ సమాంతర పునరుక్తిని తెలుగులోనూ నిలుపుతూ ఇద్దరినీ విడివిడిగా స్పష్టం చేస్తుంది.
- source_word: בְּקָדֵשׁ בַּרְנֵעַ
  choice: కాదేషు-బర్నేయలో
  rationale: స్థలనామాన్ని గుర్తించదగిన లిప్యంతరీకరణతో, తగిన స్థానవాచక రూపంలో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: בְנֵי יְהוּדָה అనే గోత్రపరమైన పురుష బహువచనం
  choice: యూదా వంశస్థులు
  alternative: యూదా కుమారులు
  rationale: ఇది వ్యక్తిగత కుమారులను కాక యూదా గోత్రానికి చెందిన సమూహాన్ని సూచిస్తుంది. ‘వంశస్థులు’ ఆ గోత్రార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే వ్యక్తినామాలు, స్థలనామాలు, ‘దేవుని మనిషి’ అనే బిరుదు మరియు దైవనామం గౌరవప్రదంగా నిలుపబడ్డాయి.
