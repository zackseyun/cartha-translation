source:
  edition: WLC
  text: וְ/אֵ֛לֶּה אֲשֶׁר נָחֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁ֨ר נִֽחֲל֜וּ אוֹתָ֗/ם אֶלְעָזָ֤ר הַ/כֹּהֵן֙ וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: These are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] కనాను దేశంలో స్వాస్థ్యంగా పొందిన భూభాగాలు ఇవే; వాటిని యాజకుడైన ఎలియాజరు, నూను కుమారుడైన యెహోషువ, ఇశ్రాయేలు కుమారుల గోత్రాల పితృకుటుంబాల[c] పెద్దలు వారికి స్వాస్థ్యంగా పంచిపెట్టారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠ్యంలో మొదటి వాక్యభాగంలో ‘స్వాస్థ్యంగా పొందడం,’ రెండవ భాగంలో ‘స్వాస్థ్యంగా ఇవ్వడం/కేటాయించడం’ అనే ఒకే మూలపదం పునరావృతమవుతుంది.
    reason: lexical_alternative
  - marker: c
    text: “పితృకుటుంబాలు” అనేది ప్రతి గోత్రంలోని పూర్విక వంశాధారిత కుటుంబ సమూహాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇవే
  rationale: కొత్త విభాగాన్ని పరిచయం చేసే సూచనార్థక వ్యక్తీకరణను సహజమైన తెలుగులో అందిస్తుంది; మూలంలో లేని కాలార్థక ‘ఇప్పుడు’ను చేర్చదు.
- source_word: נָחֲלוּ
  choice: స్వాస్థ్యంగా పొందిన
  rationale: ఇశ్రాయేలీయులు కేటాయించబడిన భూమిని స్వీకరించారనే భావాన్ని తెలుపుతుంది; మరణానంతర వారసత్వం అనే పరిమిత భావాన్ని నివారిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలోని కుటుంబాధారిత ఒడంబడికపరమైన సంబోధనను కనిపించేలా ఉంచుతుంది.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో
  rationale: మూలంలోని ‘దేశం/భూమి’ అనే ప్రాదేశిక పదాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר נִחֲלוּ אוֹתָם
  choice: వాటిని వారికి స్వాస్థ్యంగా పంచిపెట్టారు
  rationale: నాయకులు స్వాస్థ్యభాగాలను అధికారికంగా కేటాయించారనే causative/allotment భావాన్ని సహజంగా వ్యక్తం చేస్తూ, נחל మూలపదపు స్వాస్థ్య భావాన్ని కూడా నిలుపుతుంది.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు
  rationale: పేరు మరియు పదవిని ఆధునిక ప్రామాణిక తెలుగు బైబిలు శైలిలో సహజంగా అందిస్తుంది.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువ
  rationale: పితృనామ సంబంధాన్ని స్పష్టంగా, సహజ తెలుగు వాక్యనిర్మాణంలో ఉంచుతుంది.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: గోత్రాల పితృకుటుంబాల పెద్దలు
  rationale: ‘పెద్దలు/అధిపతులు,’ ‘పితృకుటుంబాలు,’ ‘గోత్రాలు’ అనే మూడు నిర్మాణాంశాలను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల గోత్రాల
  rationale: ఈ పదబంధాన్ని ‘గోత్రాలు’తో అనుసంధానించే హీబ్రూ వాక్యనిర్మాణాన్ని అనుసరిస్తుంది.
theological_decisions:
- issue: בני ישראל అనే లింగసూచక ఒడంబడికపరమైన జాతినామం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని వ్యాకరణపరంగా పుంలింగ బహువచనమైన కుటుంబ వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన జాతినామాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: אבות లోని పితృవంశ సంబంధ పదజాలం
  choice: పితృకుటుంబాలు
  alternative: వంశకుటుంబాలు
  rationale: పురాతన ఇశ్రాయేలు సామాజిక నిర్మాణంలోని పితృ/పూర్విక కుటుంబ సమూహ భావాన్ని మృదువుగా మార్చకుండా నిలుపుతుంది.
- issue: נחל మూలపదం రెండుసార్లు రావడం
  choice: స్వాస్థ్యంగా పొందిన ... స్వాస్థ్యంగా పంచిపెట్టారు
  alternative: పొందిన ... పంచిపెట్టారు
  rationale: ఇశ్రాయేలు స్వీకరణకూ నాయకుల కేటాయింపుకూ మధ్యనున్న భావసంబంధాన్ని తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘స్వాస్థ్యం’ అనే సుపరిచిత బైబిలు పదాన్ని భూకేటాయింపు సందర్భంలో స్పష్టత కోసం ‘భూభాగాలు’తో కలిపి వాడాం. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
