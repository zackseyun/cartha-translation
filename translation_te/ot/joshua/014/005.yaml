id: JOS.14.5
reference: Joshua 14:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחְלְק֖וּ אֶת הָ/אָֽרֶץ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
translation:
  language: te
  text: యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే ఇశ్రాయేలీయులు[a] చేశారు; వారు దేశాన్ని పంచుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇది ఇశ్రాయేలు ప్రజలను సూచించే సాధారణ హీబ్రూ సామూహిక ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: యాహ్వే ఇచ్చిన ఆజ్ఞకూ ఇశ్రాయేలీయుల కార్యానికీ ఉన్న ఖచ్చితమైన అనుసరణను ‘-నట్లే’ సహజంగా తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: ఈ క్రియ అధికారపూర్వకంగా ఆజ్ఞ ఇవ్వడాన్ని సూచిస్తుంది; తెలుగు సంబంధ క్రియారూపం వాక్యక్రమానికి సహజంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: צִוָּהతో మోషే ఆజ్ఞను పొందిన వ్యక్తి; తెలుగులో ‘మోషేకు ఆజ్ఞాపించాడు’ సహజమైన ప్రయోగం.
- source_word: כֵּן עָשׂוּ
  choice: చేశారు
  rationale: ముందు చెప్పిన ఆజ్ఞ ప్రకారమే వారు కార్యం చేశారనే భావాన్ని, మూలంలోని సరళమైన ‘చేశారు’ అనే క్రియను నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు[a]
  rationale: ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచించే స్థిరమైన సామూహిక హీబ్రూ ప్రయోగం. ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా, స్పష్టంగా ఉంటుంది; మూలంలోని అక్షరార్థ రూపాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: וַיַּחְלְקוּ
  choice: వారు ... పంచుకున్నారు
  rationale: ఈ క్రియ విభజించడం లేదా వాటాలు వేయడం అని అర్థం. సందర్భంలో దేశాన్ని తమ మధ్య పంచుకోవడాన్ని ‘పంచుకున్నారు’ సహజంగా తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశాన్ని
  rationale: యెహోషువ సందర్భంలో ఇది భూమండలాన్ని కాక, ఇశ్రాయేలీయులకు వారసత్వంగా ఇవ్వబడిన కనాను దేశాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలరూపానికి సమీపంగా ఉంటుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక ప్రయోగం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ ఉన్నప్పటికీ, ఇది మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే సామూహిక నామం. తెలుగులో కేవలం పురుషులను మాత్రమే సూచిస్తున్న అపార్థం రాకుండా సహజమైన జాతినామాన్ని వాడి, మూలరూపాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఆజ్ఞ–అనుసరణ సంబంధం, సరళమైన క్రియలు, దేశ విభజన భావం నిలుపబడ్డాయి.
