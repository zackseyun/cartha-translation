  text: כִּֽי הָי֧וּ בְנֵֽי יוֹסֵ֛ף שְׁנֵ֥י מַטּ֖וֹת מְנַשֶּׁ֣ה וְ/אֶפְרָ֑יִם וְ/לֹֽא נָתְנוּ֩ חֵ֨לֶק לַ/לְוִיִּ֜ם בָּ/אָ֗רֶץ כִּ֤י אִם עָרִים֙ לָ/שֶׁ֔בֶת וּ/מִ֨גְרְשֵׁי/הֶ֔ם לְ/מִקְנֵי/הֶ֖ם וּ/לְ/קִנְיָנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
translation:
  language: te
  text: ఎందుకంటే యోసేపు సంతతివారు మనష్షే, ఎఫ్రాయిము అనే రెండు గోత్రాలుగా ఉన్నారు. లేవీయులకు దేశంలో ఎలాంటి భాగమూ ఇవ్వలేదు; వారు నివసించడానికి పట్టణాలను, వారి పశువుల కోసం, వారి ఆస్తిపాస్తుల కోసం ఆ పట్టణాల చుట్టూ ఉన్న మైదానాలను మాత్రమే ఇచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పట్టణాల చుట్టూ ఉన్న మైదానాలు” అంటే లేవీయుల పట్టణాల పరిసరాల్లో పశువుల మేతకు, ఇతర అవసరాలకు ఉంచిన బహిరంగ భూములు.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: בְנֵי יוֹסֵף
  choice: యోసేపు సంతతివారు
  rationale: అక్షరార్థంగా ‘యోసేపు కుమారులు’ అయినా, ఇక్కడ మనష్షే మరియు ఎఫ్రాయిము గోత్రాలకు చెందిన వారిని సూచిస్తుంది; ‘సంతతివారు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁנֵי מַטּוֹת
  choice: రెండు గోత్రాలు
  rationale: ఈ భూవిభజన సందర్భంలో מַטּוֹת అంటే కర్రలు కాదు, గోత్ర విభాగాలు.
- source_word: מְנַשֶּׁה וְאֶפְרָיִם
  choice: మనష్షే, ఎఫ్రాయిము
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన పేర్ల రూపాలు.
- source_word: וְלֹא נָתְנוּ חֵלֶק
  choice: ఎలాంటి భాగమూ ఇవ్వలేదు
  rationale: హీబ్రూ క్రియలోని అనిర్దిష్ట బహువచన కర్తను తెలుగులో సహజంగా విడిచిపెట్టి, భూవిభజనలో భాగం ఇవ్వబడలేదనే భావాన్ని నిలుపుతుంది.
- source_word: לַלְוִיִּם
  choice: లేవీయులకు
  rationale: లేవి గోత్రానికి చెందిన సమూహాన్ని సూచించే బహువచన రూపం.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: పంచబడుతున్న వాగ్దాన దేశాన్ని సూచిస్తుంది; ‘దేశంలో’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: כִּי אִם
  choice: మాత్రమే
  rationale: భూభాగం ఇవ్వలేదనే నిరాకరణకు తరువాత వచ్చే మినహాయింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָרִים לָשֶׁבֶת
  choice: వారు నివసించడానికి పట్టణాలను
  rationale: పట్టణాలు ఇవ్వబడిన ఉద్దేశాన్ని తెలిపే హీబ్రూ క్రియారూపాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מִגְרְשֵׁיהֶם
  choice: ఆ పట్టణాల చుట్టూ ఉన్న మైదానాలను
  rationale: లేవీయుల పట్టణాల చుట్టూ పశువులు మరియు ఇతర అవసరాలకు ఉంచిన బహిరంగ భూములను సూచిస్తుంది; కేవలం మేతకే పరిమితం చేయదు.
- source_word: לְמִקְנֵיהֶם
  choice: వారి పశువుల కోసం
  rationale: מִקְנֶה అనే పదం పశుసంపదను విస్తృతంగా సూచిస్తుంది.
- source_word: וּלְקִנְיָנָם
  choice: వారి ఆస్తిపాస్తుల కోసం
  rationale: קִנְיָן సంపాదించుకున్న ఆస్తి లేదా స్వాధీన వస్తువులను సూచిస్తుంది; ‘ఆస్తిపాస్తులు’ ఆ విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యోసేపు ‘కుమారులు’ అనే కుటుంబ సంబంధ పదబంధం
  choice: యోసేపు సంతతివారు
  alternative: యోసేపు కుమారులు
  rationale: మనష్షే, ఎఫ్రాయిము వ్యక్తులకన్నా వారి నుంచి ఏర్పడిన గోత్రాలే భూవిభజనలో ఉద్దేశించబడ్డాయి; ఇది ఏ ప్రత్యేక సిద్ధాంతాన్నీ చేర్చకుండా సందర్భార్థాన్ని తెలియజేస్తుంది.
- issue: లేవీయులకు భాగం ఇవ్వని క్రియ యొక్క కర్త
  choice: తెలుగులో కర్తను అనిర్దిష్టంగా ఉంచడం
  alternative: ఇశ్రాయేలీయులు వారికి భాగం ఇవ్వలేదు
  rationale: హీబ్రూ వాక్యంలో కర్తను పేరుతో పేర్కొనలేదు. అందువల్ల సందర్భం సూచించే కర్తను అనువాదంలో కొత్తగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ వాక్యంలోని వివరణాత్మక సంబంధం, భూవిభజన నేపథ్యం, అనిర్దిష్ట కర్త నిలుపబడ్డాయి. ప్రధాన వాక్యంలో [a] గుర్తు సంబంధిత పదబంధం తరువాత ఉంచబడింది.
