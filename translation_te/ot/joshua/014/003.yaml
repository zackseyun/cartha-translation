source:
  edition: WLC
  text: כִּֽי נָתַ֨ן מֹשֶׁ֜ה נַחֲלַ֨ת שְׁנֵ֤י הַ/מַּטּוֹת֙ וַ/חֲצִ֣י הַ/מַּטֶּ֔ה מֵ/עֵ֖בֶר לַ/יַּרְדֵּ֑ן וְ/לַ֨/לְוִיִּ֔ם לֹֽא נָתַ֥ן נַחֲלָ֖ה בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
translation:
  language: te
  text: ఎందుకంటే మోషే రెండు గోత్రాలకు, అర్ధగోత్రానికి యొర్దాను అవతల[a] స్వాస్థ్యాన్ని ఇచ్చాడు; అయితే లేవీయులకు వారి మధ్య స్వాస్థ్యం ఇవ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యొర్దాను ఆవలి వైపున.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి కారణాన్ని లేదా వివరణాత్మక ఆధారాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: మోషే చేసిన గత కార్యాన్ని సరళమైన తెలుగు భూతకాలంతో వ్యక్తం చేస్తుంది; సందర్భమే అది ముందుగా జరిగినదని స్పష్టం చేస్తుంది.
- source_word: נַחֲלַת
  choice: స్వాస్థ్యాన్ని
  rationale: గోత్రాలకు కేటాయించబడిన, వారసత్వంగా కలిగే భూభాగాన్ని సూచించే స్థిరమైన బైబిలు పదం.
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: రెండు గోత్రాలకు
  rationale: భూభాగ కేటాయింపు సందర్భంలో מַטֶּה అనే పదం ‘గోత్రం’ అనే అర్థంలో ఉంది.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: అర్ధగోత్రానికి
  rationale: మనష్షే అర్ధగోత్రాన్ని సూచించే సంక్షిప్తమైన, సందర్భోచిత రూపం.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: హీబ్రూ స్థలసూచక నుడికారాన్ని దృక్కోణాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా నిలుపుతుంది.
- source_word: וְלַלְוִיִּם
  choice: అయితే లేవీయులకు
  rationale: వావ్ సంధి ఇక్కడ ముందటి గోత్రాలతో వ్యత్యాసాన్ని చూపుతుంది; ‘అయితే’ ఆ సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא נָתַן נַחֲלָה
  choice: స్వాస్థ్యం ఇవ్వలేదు
  rationale: ముందటి ‘స్వాస్థ్యం’ పదాన్నే కొనసాగిస్తూ నిరాకరణను నేరుగా తెలియజేస్తుంది.
- source_word: בְּתוֹכָם
  choice: వారి మధ్య
  rationale: లేవీయులకు ఇతర గోత్రాల మధ్య సాధారణ గోత్ర భూస్వాస్థ్యం ఇవ్వలేదనే సందర్భానుగుణ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: లేవీయులకు స్వాస్థ్యం లేకపోవడం యొక్క స్వభావం
  choice: ఇతర గోత్రాల మధ్య వారికి గోత్ర భూస్వాస్థ్యం ఇవ్వలేదని వాక్యాన్ని అనువదించడం
  alternative: సందర్భ పరిమితి లేకుండా లేవీయులకు ఏ స్వాస్థ్యమూ లేదని సంపూర్ణంగా వినిపించే అనువాదం
  rationale: ‘వారి మధ్య’ అనే మూలపాఠ్య పదబంధాన్ని నిలుపడం ద్వారా లేవీయులకు సాధారణ గోత్ర భూకేటాయింపు లేదనే సూక్ష్మత ఉంటుంది; వారికి లభించిన ఇతర ఏర్పాట్లను ప్రధాన వాక్యంలో చేర్చి వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘స్వాస్థ్యం,’ ‘గోత్రం,’ ‘లేవీయులు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉపయోగిస్తూ, హీబ్రూ వాక్యంలోని వివరణాత్మక సంబంధం మరియు వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేసింది.
