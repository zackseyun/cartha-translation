  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
translation:
  language: te
  text: “యహ్వే మనకూ మీకూ మధ్య యొర్దానును సరిహద్దుగా ఉంచాడు. రూబేను కుమారులారా, గాదు కుమారులారా, యహ్వేలో మీకు భాగం లేదు[a]” అని చెప్పి, మీ కుమారులు మా కుమారులు యహ్వేకు భయపడడం మానివేసేలా చేయవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యహ్వేలో మీకు వంతు లేదు” అని కూడా అనువదించవచ్చు.
    reason: חֵלֶק అనే పదానికి ‘భాగం’, ‘వంతు’ అనే సమీపార్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: וּגְבוּל נָתַן
  choice: సరిహద్దుగా ఉంచాడు
  rationale: గְּבוּל అంటే సరిహద్దు; נָתַן ఇక్కడ సరిహద్దును ఏర్పరచడం లేదా ఉంచడం అనే సందర్భార్థాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సమీప లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֶת הַיַּרְדֵּן
  choice: యొర్దానును
  rationale: ఇది యొర్దాను నదికి సంబంధించిన ప్రసిద్ధ స్థలనామం; వాక్యంలో ‘నది’ అనే పదాన్ని చేర్చకుండానే అర్థం స్పష్టంగా ఉంటుంది.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: రూబేను కుమారులారా, గాదు కుమారులారా
  rationale: మూలంలోని ‘కుమారులు’ అనే గోత్రపరమైన సంబోధనను నిలుపుతూ తెలుగు సంబోధన రూపంలో సహజంగా ఇచ్చాం.
- source_word: אֵין לָכֶם חֵלֶק בַּיהוָה
  choice: యహ్వేలో మీకు భాగం లేదు
  rationale: חֵלֶק అంటే భాగం లేదా వంతు. దేవునితో ఉన్న నిబంధనాత్మక భాగస్వామ్య భావాన్ని అతిగా వివరించకుండా మూలంలోని సంక్షిప్తతను నిలిపాం.
- source_word: וְהִשְׁבִּיתוּ
  choice: మానివేసేలా చేయవచ్చు
  rationale: שבת హిఫీల్ రూపం ‘మానిపించు/ఆపివేయించు’ అనే కారణార్థాన్ని ఇస్తుంది; సందర్భంలోని సంభావ్య భవిష్యత్ ప్రమాదాన్ని ‘చేయవచ్చు’ తెలియజేస్తుంది.
- source_word: לְבִלְתִּי יְרֹא אֶת יְהוָה
  choice: యహ్వేకు భయపడడం మానివేసేలా
  rationale: దేవునిపట్ల భక్తిపూర్వక భయాన్ని సూచించే సంప్రదాయ బైబిలు వ్యక్తీకరణను ‘భయపడడం’గా నిలిపి, నిరోధం/విరమణ భావాన్ని సహజ తెలుగులో తెలిపాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి పారదర్శకంగా ఉంటుంది.
- issue: חֵלֶק בַּיהוָה యొక్క నిబంధనాత్మక భావం
  choice: యహ్వేలో మీకు భాగం లేదు
  alternative: యహ్వేలో మీకు వంతు లేదు
  rationale: ‘భాగం’ ఆస్తి, వారసత్వం, నిబంధనలో పాలుపంచుకోవడం వంటి సాధ్య భావాలను ముందుగానే ఒక్క అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి వాడబడింది. మూలంలోని ప్రత్యక్ష వాక్యాన్ని ఉద్ధరణ చిహ్నాలతో చూపించి, దాని వల్ల కలగవచ్చని భయపడిన ఫలితాన్ని సహజ తెలుగు వాక్యనిర్మాణంతో అనుసంధానించాం.
