  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הִנֵּ֣ה בָנ֣וּ בְנֵֽי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה אֶת הַ/מִּזְבֵּ֗חַ אֶל מוּל֙ אֶ֣רֶץ כְּנַ֔עַן אֶל גְּלִילוֹת֙ הַ/יַּרְדֵּ֔ן אֶל עֵ֖בֶר בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
translation:
  language: te
  text: 'ఇశ్రాయేలీయులు ఈ వార్త విన్నారు: “చూడండి, రూబేనీయులు, గాదీయులు, మనష్షే అర్ధగోత్రంవారు కనాను దేశానికి ఎదురుగా, యొర్దాను ప్రాంతంలో[a], ఇశ్రాయేలీయుల వైపున[b] ఆ బలిపీఠాన్ని కట్టారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయులో “యొర్దాను ప్రాంతాలు.” ఈ పదబంధం సూచించే ఖచ్చితమైన భౌగోళిక భావం అనిశ్చితం.
    reason: cultural_note
  - marker: b
    text: లేదా “ఇశ్రాయేలీయులకు ఎదురుగా.” ఈ చివరి భౌగోళిక పదబంధం క్లిష్టమైనది; ఇది యొర్దానుకు పడమరగా ఇశ్రాయేలీయులకు చెందిన వైపును గానీ, వారికి ఎదురుగా ఉన్న ప్రదేశాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ בְנֵי יִשְׂרָאֵל לֵאמֹר
  choice: ఇశ్రాయేలీయులు ఈ వార్త విన్నారు
  rationale: హెబ్రీయ reporting formulaను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, לֵאמֹר నివేదిక విషయాన్ని పరిచయం చేసే పనిని నిలుపుతుంది.
- source_word: הִנֵּה
  choice: చూడండి
  rationale: వార్తలోని విషయంపై శ్రద్ధ నిలిపే ఆహ్వానార్థక బలాన్ని ఆధునికంగా అందిస్తుంది.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: రూబేనీయులు, గాదీయులు, మనష్షే అర్ధగోత్రంవారు
  rationale: జాతీయ-గోత్ర సమూహాలకు సహజమైన తెలుగు రూపాలను వాడుతూ మూడు సమూహాల ప్రత్యేకతను కాపాడుతుంది.
- source_word: הַמִּזְבֵּחַ
  choice: ఆ బలిపీఠాన్ని
  rationale: హెబ్రీయ నిర్దిష్ట ఉపపదాన్ని, కథనంలో చర్చకు వచ్చిన నిర్దిష్ట బలిపీఠాన్ని సూచించే తెలుగు నిర్దేశకంతో వ్యక్తం చేస్తుంది.
- source_word: אֶל מוּל אֶרֶץ כְּנַעַן
  choice: కనాను దేశానికి ఎదురుగా
  rationale: מוּל యొక్క స్థలసంబంధమైన ఎదురు/ముఖాముఖి భావాన్ని దిశను అతిగా నిర్ధారించకుండా నిలుపుతుంది.
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: యొర్దాను ప్రాంతంలో
  rationale: గలీలోత్ అనే బహువచన భౌగోళిక పదాన్ని సహజ తెలుగులో ప్రాంతం అని ఇస్తూ, దాని ఖచ్చితమైన భౌగోళిక సూక్ష్మార్థం అనిశ్చితమని పాదసూచికలో తెలియజేస్తుంది.
- source_word: אֶל עֵבֶר בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల వైపున
  rationale: కష్టమైన చివరి భౌగోళిక పదబంధంలోని ‘వైపు/అవతల’ సంబంధాన్ని ఒక నిర్దిష్ట దిశగా బలవంతంగా నిర్ణయించకుండా ప్రధాన పాఠంలో సంక్షిప్తంగా నిలుపుతుంది.
