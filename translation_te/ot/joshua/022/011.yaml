translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీయ ‘ఇశ్రాయేలు కుమారులు’ను సహజ సమూహనామమైన ‘ఇశ్రాయేలీయులు’గా ఇచ్చాం. క్లిష్టమైన చివరి భౌగోళిక వాక్యభాగంలోని నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
