revisions:
- from: జెరహు కుమారుడైన ఆకాను నాశనానికి అంకితం చేసినదాని విషయంలో విశ్వాసఘాతుకంగా ప్రవర్తించలేదా? దానివల్ల ఇశ్రాయేలు సమాజమంతటిమీద ఆగ్రహం రాలేదా? అతడు తన దోషం కారణంగా నశించినప్పుడు, అతనొక్కడే నశించలేదు.
