id: JOS.22.20
reference: Joshua 22:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/ל֣וֹא עָכָ֣ן בֶּן זֶ֗רַח מָ֤עַל מַ֨עַל֙ בַּ/חֵ֔רֶם וְ/עַֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל הָ֣יָה קָ֑צֶף וְ/הוּא֙ אִ֣ישׁ אֶחָ֔ד לֹ֥א גָוַ֖ע בַּ/עֲוֺנֽ/וֹ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/020.yaml
  text: Was it not Achan son of Zerah who acted unfaithfully in the matter of what was devoted to destruction, and wrath came upon all the congregation of Israel? Yet he was not the only man who perished in his iniquity.
translation:
  language: te
  text: జెరహు కుమారుడైన ఆకాను నాశనానికి అంకితం చేయబడిన వాటి విషయంలో విశ్వాసఘాతుకంగా ప్రవర్తించలేదా? దానివల్ల ఇశ్రాయేలు సమాజమంతటిమీద ఆగ్రహం రాలేదా? అయితే అతడు తన దోషం వల్ల ఒంటరిగా నశించలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעַל מַעַל
  choice: విశ్వాసఘాతుకంగా ప్రవర్తించలేదా
  rationale: క్రియతో పాటు అదే మూలానికి చెందిన నామవాచకం ఇచ్చే బలాన్ని సహజమైన తెలుగులో ‘విశ్వాసఘాతుకంగా ప్రవర్తించు’ అని వ్యక్తం చేసింది.
- source_word: בַּחֵרֶם
  choice: నాశనానికి అంకితం చేసినదాని విషయంలో
  rationale: חֵרֶם ఇక్కడ దేవునికి విడదీసి నాశనం చేయవలసిన వస్తువులను సూచిస్తుంది; కేవలం ‘శాపగ్రస్తమైనది’ అని చెప్పకుండా ఆ ఆచారపరమైన భావాన్ని నిలిపింది.
- source_word: קָצֶף
  choice: ఆగ్రహం
  rationale: తీవ్రమైన, శిక్షాత్మక కోపాన్ని సూచించే సహజమైన గౌరవప్రద తెలుగు పదం.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతటి
  rationale: עֵדָה యొక్క సమష్టి భావాన్ని ‘సమాజం’ ద్వారా, כָּל యొక్క విస్తృతిని ‘అంతటి’ ద్వారా తెలిపింది.
- source_word: לֹא גָוַע בַּעֲוֹנוֹ
  choice: తన దోషం కారణంగా నశించినప్పుడు, అతనొక్కడే నశించలేదు
  rationale: గָוַע యొక్క మరణార్థాన్ని సందర్భానుసారంగా ‘నశించు’తో, בְּ యొక్క కారణార్థాన్ని ‘కారణంగా’తో వ్యక్తం చేసింది; అతని పాపం ఇతరుల మరణానికీ దారితీసిందనే వాక్యబలాన్ని నిలిపింది.
theological_decisions:
- issue: חֵרֶם యొక్క స్వరూపం
  choice: నాశనానికి అంకితం చేసినది
  alternative: శాపగ్రస్తమైనది / పూర్తిగా నాశనం చేయవలసినది
  rationale: యెహోషువ 7 సందర్భంలో వస్తువులు దేవుని ఆజ్ఞ ప్రకారం నాశనానికి ప్రత్యేకించబడ్డాయి. ఈ అనువాదం దైవిక అంకితం మరియు నాశనం అనే రెండు అంశాలను కలిపి ఉంచుతుంది.
- issue: ఆకానుతో పాటు ఇతరులు మరణించారనే చివరి వాక్యార్థం
  choice: అతనొక్కడే నశించలేదు
  alternative: ఆ మనిషి తన దోషంలో ఒంటరిగా చనిపోలేదు
  rationale: హీబ్రూ పదక్రమంలో స్వల్ప అస్పష్టత ఉన్నప్పటికీ, ‘ఒకే మనిషి’ అనే నిషేధిత భావం ఆకాను పాపపు సామూహిక పరిణామాన్ని సూచిస్తుంది. ఎవరు మరణించారో వచనంలో అదనంగా నిర్దేశించలేదు.
- issue: עָוֹן యొక్క భావం
  choice: దోషం
  alternative: పాపం / అపరాధం / దోషశిక్ష
  rationale: עָוֹן దోషం, అపరాధం, దాని పరిణామం అనే భావాలను మోయగలదు. ‘దోషం కారణంగా’ అని ఇవ్వడం నైతిక అపరాధాన్ని మరియు దాని ఘోర పరిణామాన్ని రెండింటినీ తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపాన్ని వాడింది. మూలంలోని రెండు అనుసంధానిత ప్రశ్నలను తెలుగులో స్పష్టత కోసం రెండు ప్రశ్నలుగా వ్యక్తం చేసింది. పేర్లను సాధారణ తెలుగు బైబిలు రూపాలైన ‘జెరహు’, ‘ఆకాను’, ‘ఇశ్రాయేలు’గా ఉంచింది.
