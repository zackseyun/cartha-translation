    rationale: ‘నాశనానికి అంకితం చేయబడిన వాటి విషయంలో’ అని చెప్పడం సందర్భంలోని ప్రత్యేకించబడిన వస్తువుల భావాన్ని మరింత స్పష్టంగా నిలుపుతుంది.
