source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד וַ/יְדַבְּר֥וּ אִתָּ֖/ם לֵ/אמֹֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/015.yaml
  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
translation:
  language: te
  text: 'వారు గిలాదు దేశంలో ఉన్న రూబేను వంశస్థుల దగ్గరికి, గాదు వంశస్థుల దగ్గరికి, మనష్షే అర్ధగోత్రస్థుల దగ్గరికి వచ్చారు; వారితో ఇలా మాట్లాడారు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చి
  rationale: בוא అనే క్రియ యొక్క కథన రూపం. సందర్భంలోని గమ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ‘వచ్చారు/వెళ్లారు’ అనే దృష్టికోణ భేదాన్ని అతిగా నిర్ధారించకుండా అనుసంధాన క్రియగా అనువదించబడింది.
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  choice: రూబేను వంశస్థులు / గాదు వంశస్థులు
  rationale: గోత్రసంబంధ సూత్రంలో בְּנֵי అక్షరార్థంగా ‘కుమారులు’ అయినా, ఇక్కడ ఆయా గోత్రాల సభ్యులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశస్థులు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం వారు
  rationale: హీబ్రూ నిర్మాణంలోని ‘సగం గోత్రం’ అనే ప్రామాణిక గోత్రపదాన్ని సహజమైన తెలుగు పదబంధంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: గిలాదు దేశంలో ఉన్న
  rationale: אֶל సాధారణంగా ‘వైపు/దగ్గరికి’ అని అర్థమిచ్చినా, ఇక్కడ తూర్పు గోత్రాలు ఉన్న ప్రదేశాన్ని తెలిపే స్థానార్థక అన్వయమే సందర్భానికి తగినది; వరుసగా వచ్చిన אֶל పదబంధాల అస్పష్టతను తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְדַבְּרוּ אִתָּם
  choice: వారితో ... అన్నారు
  rationale: דבר + אֵת పరస్పరంగా మాట్లాడటాన్ని లేదా వారిని ఉద్దేశించి చెప్పటాన్ని సూచించవచ్చు. ‘వారితో’ హీబ్రూ ఉపసర్గను దగ్గరగా నిలుపుతుంది; ‘అన్నారు’ ప్రత్యక్ష ప్రసంగానికి సహజమైన తెలుగు పరిచయం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నారు:'
  rationale: తదుపరి ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగం. తెలుగులో ‘ఇలా అన్నారు’ సహజంగా కథనాన్ని తరువాతి వచనంతో అనుసంధానిస్తుంది.
