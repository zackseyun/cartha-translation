translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గోత్రసభ్యులను సూచించేందుకు అక్షరార్థమైన ‘కుమారులు’కు బదులుగా సందర్భోచితమైన ‘వంశస్థులు’ వాడబడింది.
