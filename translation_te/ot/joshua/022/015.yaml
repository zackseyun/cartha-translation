revisions:
- from: వారు గిలాదు దేశంలో ఉన్న రూబేను వంశస్థుల దగ్గరికి, గాదు వంశస్థుల దగ్గరికి, మనష్షే అర్ధగోత్రం వారి దగ్గరికి వచ్చి, వారితో ఇలా అన్నారు:[a]
  to: 'వారు గిలాదు దేశంలో ఉన్న రూబేను వంశస్థుల దగ్గరికి, గాదు వంశస్థుల దగ్గరికి, మనష్షే అర్ధగోత్రస్థుల దగ్గరికి వచ్చారు; వారితో ఇలా మాట్లాడారు:'
  rationale: The revision preserves all three recipient groups, locates them in Gilead, and retains the direct-speech introduction. It replaces an awkward half-tribe expression with standard Telugu, restores the coordinated narrative force of the Hebrew verbs, and removes a nonessential footnote.
