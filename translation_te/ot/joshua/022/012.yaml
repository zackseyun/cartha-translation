  text: וַֽ/יִּשְׁמְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה לַ/עֲל֥וֹת עֲלֵי/הֶ֖ם לַ/צָּבָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/012.yaml
  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు అది విన్నప్పుడు, ఇశ్రాయేలు కుమారుల సమాజమంతా వారిపై యుద్ధానికి వెళ్లేందుకు షిలోహులో సమావేశమైంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “వారిపైకి యుద్ధానికి ఎక్కి వెళ్లేందుకు”; ఇది వారిపై సైనిక చర్యకు వెళ్లడాన్ని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: విన్నప్పుడు
  rationale: שׁמע అనే క్రియ ఇక్కడ కథన క్రమంలో ‘విన్నారు’ అనే సహజ అర్థాన్నిస్తుంది. ముందటి సందర్భంలోని వార్తను సూచించడానికి తెలుగులో ‘అది’ చేర్చడం సహజం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థం ‘ఇశ్రాయేలు కుమారులు’; అయితే ఈ సందర్భంలో మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే జాతీయ నామంగా ఉన్నందున ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా ఉంటుంది.
- source_word: וַיִּקָּהֲלוּ
  choice: సమావేశమైంది
  rationale: קהל బహిరంగంగా ఒకచోట కూడడాన్ని సూచిస్తుంది. ఏకవచన సమూహవాచకమైన ‘సమాజమంతా’తో ‘సమావేశమైంది’ సహజంగా సరిపోతుంది.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల సమాజమంతా
  rationale: עֵדָה అనేది వ్యవస్థీకృత సమాజాన్ని లేదా సమాజ సభను సూచిస్తుంది; כָּל యొక్క సంపూర్ణతను ‘సమాజమంతా’ నిలుపుతుంది.
- source_word: שִׁלֹה
  choice: షిలోహులో
  rationale: స్థలనామాన్ని మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించి, తెలుగు స్థానవిభక్తిని జోడించాం.
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: వారిమీద యుద్ధానికి వెళ్లడానికి
  rationale: עלה యొక్క అక్షరార్థం ‘పైకి వెళ్లడం’; అయితే עליהם మరియు לצבאతో కలిసి ఇది సైనిక చర్యకు బయలుదేరడాన్ని సూచించే హీబ్రూ నుడికారం. తెలుగులో ‘వారిమీద యుద్ధానికి వెళ్లడానికి’ ఆ భావాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇశ్రాయేలు కుమారులు’ అనే అక్షరానువాదం కంటే సందర్భానుసారంగా ‘ఇశ్రాయేలు ప్రజలు’ వాడబడింది. మూలంలోని సైనిక నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజంగా అందించి, దాని అక్షరరూపాన్ని పాదసూచికలో తెలిపాం.
