    issue: The repeated Hebrew expression בְּנֵי יִשְׂרָאֵל is rendered as “ఇశ్రాయేలు ప్రజలు.”
    rationale: Although idiomatic, “ప్రజలు” omits the source’s repeated “sons” terminology. A source-transparent optimal-equivalence translation can naturally retain “ఇశ్రాయేలు కుమారులు” in both instances.
  - severity: low
    issue: The main-text military phrase can more directly express the adversative force of עֲלֵיהֶם.
    rationale: “వారిపై యుద్ధానికి వెళ్లేందుకు” clearly conveys going against them for war while avoiding the less natural literal image in the main text.
