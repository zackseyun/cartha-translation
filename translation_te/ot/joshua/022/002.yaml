reference: Joshua 22:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם אַתֶּ֣ם שְׁמַרְתֶּ֔ם אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶ֔ם מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/תִּשְׁמְע֣וּ בְ/קוֹלִ֔/י לְ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/002.yaml
  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “యాహ్వే సేవకుడైన మోషే మీకు ఆజ్ఞాపించినదంతా మీరు పాటించారు; నేను మీకు ఆజ్ఞాపించిన ప్రతి విషయంలోనూ నా మాట విన్నారు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మీకు ఆజ్ఞాపించిన ప్రతి విషయంలోనూ నాకు విధేయులయ్యారు.” “నా మాట వినడం” అనే హెబ్రీ నుడికారం తరచుగా విధేయతతో స్పందించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: అతడు వారితో ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనంలో ‘అతడు వారితో ఇలా అన్నాడు’ సహజంగా ఉండి, సంభాషణను స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: שְׁמַרְתֶּם אֵת כָּל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: మీకు ఆజ్ఞాపించినదంతా మీరు పాటించారు
  rationale: ఆజ్ఞల సందర్భంలో שׁמר అంటే కాపాడడం కంటే పాటించడం/ఆచరించడం. ‘పాటించారు’ విధేయత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: యెహోవా సేవకుడైన మోషే
  rationale: עֶבֶד ఇక్కడ మోషేకు గౌరవపూర్వకమైన సేవా బిరుదు; ‘సేవకుడు’ సందర్భార్థాన్ని సరిగ్గా ఇస్తుంది. יְהוָהను వ్యక్తిగత దైవనామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  choice: నా మాట విన్నారు
  rationale: అక్షరార్థంగా ‘నా స్వరం విన్నారు’ అనే హెబ్రీ నుడికారానికి స్పందనతో కూడిన వినికిడి, అంటే విధేయత, భావం ఉంది. ‘నా మాట విన్నారు’ రూపకాన్ని కొంత నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: לְכֹל אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: నేను మీకు ఆజ్ఞాపించిన ప్రతి విషయంలోనూ
  rationale: לְכֹל אֲשֶׁר యొక్క సమగ్ర పరిధిని ‘ప్రతి విషయంలోనూ’ స్పష్టంగా తెలియజేస్తుంది; צוה యొక్క అధికారభావాన్ని ‘ఆజ్ఞాపించిన’ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా టెట్రాగ్రామటన్ అనే వ్యక్తిగత దైవనామం ఉంది. తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపం దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
- issue: మోషేకు వాడిన עֶבֶד పదం
  choice: సేవకుడు
  alternative: దాసుడు
  rationale: ఈ సందర్భంలో పదం బానిస స్థితిని ప్రధానంగా సూచించకుండా, యెహోవాకు నియమితుడైన మోషే యొక్క గౌరవపూర్వక సేవా హోదాను సూచిస్తుంది.
- issue: שׁמע בקול అనే నుడికారం
  choice: నా మాట విన్నారు
  alternative: నాకు విధేయులయ్యారు
  rationale: ‘విన్నారు’ అనే మూల రూపకాన్ని నిలుపుతూ, సందర్భంలో అంతర్లీనంగా ఉన్న విధేయతను పాదటిప్పణిలో స్పష్టం చేశాం; తద్వారా మూలంలోని భావ విస్తృతిని ఒకే అర్థానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఆజ్ఞాపించు,’ ‘పాటించు,’ ‘సేవకుడు’ వంటి సాధారణంగా అర్థమయ్యే పదాలతో మూలంలోని అధికార, విధేయత భావాలను నిలిపాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత వాక్యభాగం వెంట ఉంచబడింది.
