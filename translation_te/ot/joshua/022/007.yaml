  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה נָתַ֣ן מֹשֶׁה֮ בַּ/בָּשָׁן֒ וּ/לְ/חֶצְי֗/וֹ נָתַ֤ן יְהוֹשֻׁ֨עַ֙ עִם אֲחֵי/הֶ֔ם מ/עבר הַ/יַּרְדֵּ֖ן יָ֑מָּ/ה וְ֠/גַם כִּ֣י שִׁלְּחָ֧/ם יְהוֹשֻׁ֛עַ אֶל אָהֳלֵי/הֶ֖ם וַ/יְבָרֲכֵֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: To the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
translation:
  language: te
  text: మనష్షే గోత్రంలోని ఒక సగానికి మోషే బాషానులో భూమి ఇచ్చాడు; ఆ గోత్రంలోని మరో సగానికి యెహోషువ వారి సహోదరులతో[a] పాటు యొర్దానుకు అవతల పడమటి వైపున భూమి ఇచ్చాడు. యెహోషువ వారిని వారి గుడారాలకు పంపినప్పుడు వారిని ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘వారి సహోదరులతో.’ ఇక్కడ ఈ పదం ఇతర గోత్రాలకు చెందిన తోటి ఇశ్రాయేలీయులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: మనష్షే గోత్రంలోని ఒక సగానికి
  rationale: మనష్షే గోత్రం రెండు భాగాలుగా విభజించబడిన సందర్భాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తూ, మూలంలోని ‘సగం’ భావాన్ని నిలుపుతుంది.
- source_word: נָתַן מֹשֶׁה בַּבָּשָׁן
  choice: మోషే బాషానులో భూమి ఇచ్చాడు
  rationale: ‘భూమి’ అనే కర్మ మూలంలో వ్యక్తంగా లేకపోయినా, భూవిభజన సందర్భం నుంచి స్పష్టంగా గ్రహించబడుతుంది; సహజమైన తెలుగుకోసం దాన్ని వ్యక్తం చేశాము.
- source_word: וּלְחֶצְיוֹ
  choice: ఆ గోత్రంలోని మరో సగానికి
  rationale: సర్వనామ ప్రత్యయం మనష్షే గోత్రాన్ని తిరిగి సూచిస్తుంది; ‘మరో సగం’ రెండు భాగాల మధ్య వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עִם אֲחֵיהֶם
  choice: వారి సహోదరులతో పాటు
  rationale: హీబ్రూ బంధుత్వ పదమైన ‘సహోదరులు’ను నిలుపుతూ, ఇక్కడ అది పడమటి గోత్రాలకు చెందిన తోటి ఇశ్రాయేలీయులను సూచిస్తుందని పాదటిప్పణిలో వివరించాము.
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: యొర్దానుకు అవతల పడమటి వైపున
  rationale: ‘యొర్దానుకు అవతల’ అనే మూల భౌగోళిక వ్యక్తీకరణతో పాటు יָמָּה సూచించే పడమటి దిశను కూడా నిలుపుతుంది.
- source_word: וְגַם כִּי שִׁלְּחָם יְהוֹשֻׁעַ אֶל אָהֳלֵיהֶם
  choice: యెహోషువ వారిని వారి గుడారాలకు పంపినప్పుడు
  rationale: వారిని పంపివేసిన సందర్భాన్ని సహజమైన కాలవాచక ఉపవాక్యంగా అందిస్తూ, ‘గుడారాలు’ అనే నిర్దిష్ట మూలపదాన్ని నిలుపుతుంది.
- source_word: וַיְבָרֲכֵם
  choice: వారిని ఆశీర్వదించాడు
  rationale: ברך క్రియకు ఈ సందర్భంలో నేరమైన, సహజమైన తెలుగు అనువాదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. భూవిభజన సందర్భంలో అవ్యక్తంగా ఉన్న ‘భూమి’ని స్పష్టత కోసం చేర్చాము; ‘సహోదరులు,’ ‘గుడారాలు,’ ‘యొర్దానుకు అవతల పడమటి వైపున’ వంటి మూలంలోని స్పష్టమైన రూపాలను నిలిపాము.
