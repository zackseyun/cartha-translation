revisions:
- from: 'యెహోవా సమాజమంతా ఇలా అంటోంది: “మీరు ఇశ్రాయేలు దేవునికి విరోధంగా చేసిన ఈ విశ్వాసఘాతుకం ఏమిటి?[a] మీ కోసం ఒక బలిపీఠాన్ని కట్టుకొని, ఈ రోజే యెహోవాను అనుసరించడం మానేసి, ఈ రోజే యెహోవా మీద తిరుగుబాటు చేస్తున్నారేమిటి?”'
  to: 'యెహోవా సమాజమంతా ఇలా చెప్పింది: “ఇశ్రాయేలు దేవునికి విరోధంగా మీరు చేసిన ఈ నమ్మకద్రోహం ఏమిటి?[a] మీకోసం ఒక బలిపీఠాన్ని కట్టడం ద్వారా, ఈ రోజే యెహోవాను అనుసరించడం మానివేసి, ఈ రోజే యెహోవాపై తిరుగుబాటు చేస్తున్నారా?”'
  rationale: సవరణ మూలంలోని ఆరోపణాత్మక ప్రశ్నను, దైవనామాన్ని, ‘ఈ రోజు’ పునరుక్తిని కాపాడుతుంది. బలిపీఠాన్ని కట్టడం యెహోవాను విడిచి తిరుగుబాటు చేయడమనే ఆరోపణతో ఉన్న సాధన/సందర్భ సంబంధాన్ని ‘కట్టడం ద్వారా’తో స్పష్టం చేసింది; బలిపీఠ ఉద్దేశంపై అదనపు వ్యాఖ్యానం చేర్చలేదు.
