source:
  edition: WLC
  text: כֹּ֣ה אָמְר֞וּ כֹּ֣ל עֲדַ֣ת יְהוָ֗ה מָֽה הַ/מַּ֤עַל הַ/זֶּה֙ אֲשֶׁ֤ר מְעַלְתֶּם֙ בֵּ/אלֹהֵ֣י יִשְׂרָאֵ֔ל לָ/שׁ֣וּב הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה בִּ/בְנֽוֹתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ לִ/מְרָדְ/כֶ֥ם הַ/יּ֖וֹם בַּ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
translation:
  language: te
  text: 'యెహోవా సమాజమంతా ఇలా చెప్పింది: “ఇశ్రాయేలు దేవునికి విరోధంగా మీరు చేసిన ఈ నమ్మకద్రోహం ఏమిటి?[a] మీకోసం ఒక బలిపీఠాన్ని కట్టడం ద్వారా, ఈ రోజే యెహోవాను అనుసరించడం మానివేసి, ఈ రోజే యెహోవాపై తిరుగుబాటు చేస్తున్నారా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నమ్మకద్రోహం’ అనే పదాన్ని ‘విశ్వాసఘాతం’ లేదా ‘నిబద్ధతను ఉల్లంఘించడం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం ముఖ్యంగా ఒడంబడికకు లేదా ఆరాధనకు సంబంధించిన అవిశ్వాసాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  choice: ఇలా అంటోంది
  rationale: హీబ్రూ క్రియ రూపపరంగా బహువచనమైనా, సమూహవాచక కర్త అయిన ‘సమాజమంతా’తో సహజమైన ఆధునిక తెలుగులో ఏకవచన క్రియను వాడాం; సందేశ ప్రకటన సూత్రాన్ని వర్తమానంగా వ్యక్తం చేశాం.
- source_word: כֹּל עֲדַת יְהוָה
  choice: యెహోవా సమాజమంతా
  rationale: עֲדַת అనేది ఒడంబడిక సమాజాన్ని సూచిస్తుంది. ‘సమాజమంతా’ సామూహిక భావాన్ని సహజంగా నిలుపుతుంది; יְהוָהను వ్యక్తినామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: מָה הַמַּעַל הַזֶּה אֲשֶׁר מְעַלְתֶּם
  choice: మీరు ... చేసిన ఈ విశ్వాసఘాతుకం ఏమిటి?
  rationale: నామవాచకం-క్రియ అనే హీబ్రూ సహజాత నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, מַעַלలోని ఒడంబడికపరమైన నమ్మకద్రోహ భావాన్ని ‘విశ్వాసఘాతుకం’తో నిలిపాం.
- source_word: בֵּאלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవునికి విరోధంగా
  rationale: מעלతో వచ్చిన ב ఇక్కడ అపరాధం ఎవరికి విరోధంగా జరిగిందో సూచిస్తుంది; ‘విరోధంగా’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: ఈ రోజే యెహోవాను అనుసరించడం మానేసి
  rationale: ‘యెహోవా వెనుకనుండి తిరగడం’ అనే హీబ్రూ నుడికారాన్ని విధేయ అనుసరణ నుంచి తొలగిపోవడం అనే భావంతో సహజ తెలుగులో ఇచ్చాం. הַיּוֹםలోని తక్షణతకు ‘ఈ రోజే’ సరిపోతుంది.
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: మీ కోసం ఒక బలిపీఠాన్ని కట్టుకొని
  rationale: בతో కూడిన క్రియానామం ఆరోపిత చర్యకు సాధనం లేదా పరిస్థితిని తెలియజేస్తుంది; לָכֶםలోని స్వప్రయోజన/స్వాధీన భావాన్ని ‘మీ కోసం’ నిలుపుతుంది.
- source_word: לִמְרָדְכֶם הַיּוֹם בַּיהוָה
  choice: ఈ రోజే యెహోవా మీద తిరుగుబాటు చేస్తున్నారేమిటి?
  rationale: מרד యొక్క బలమైన రాజకీయ-ఒడంబడిక విరోధ భావాన్ని ‘తిరుగుబాటు’ నిలుపుతుంది. సందర్భంలో בַּיהוָה తిరుగుబాటు లక్ష్యాన్ని సూచించేందున ‘యెహోవా మీద’ అని అనువదించాం.
theological_decisions:
- issue: מַעַל అనే ఒడంబడిక అపరాధ పదం
  choice: విశ్వాసఘాతుకం
  alternative: నమ్మకద్రోహం; అవిశ్వాసం
  rationale: ఇది సాధారణ పాపాన్ని మాత్రమే కాక, దేవునిపట్ల ఒడంబడిక మరియు ఆరాధన సంబంధమైన నిబద్ధతను ఉల్లంఘించడాన్ని సూచిస్తుంది. ‘విశ్వాసఘాతుకం’ ఆ తీవ్రతను నిలుపుతుంది; అడుగుసూచన ఇతర సహజ ప్రత్యామ్నాయాలను అందిస్తుంది.
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం బిరుదు కాక చతురక్షర దైవనామాన్ని ఉపయోగిస్తుంది. తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’ను ఎంచుకొని, దానిని బిరుదుగా మార్చలేదు.
- issue: బలిపీఠ నిర్మాణం మరియు తిరుగుబాటు మధ్య సంబంధం
  choice: ఆరోపణగా పరస్పరం అనుసంధానించడం
  alternative: బలిపీఠ నిర్మాణమే నిర్ధారిత విగ్రహారాధన అని స్పష్టీకరించడం
  rationale: ఈ వాక్యంలో మాట్లాడేవారు బలిపీఠ నిర్మాణాన్ని యెహోవా నుంచి తొలగిపోవడంగా, తిరుగుబాటుగా ఆరోపిస్తున్నారు; అయితే బలిపీఠ ఉద్దేశాన్ని ఈ వాక్యం స్వయంగా పూర్తిగా వివరించదు. అందువల్ల అదనపు ఉద్దేశాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష ఆరోపణ ధోరణిని నిలిపాం. మూలంలోని ‘ఈ రోజు’ పునరుక్తిని అత్యవసరత కోసం రెండుసార్లూ ఉంచాం. ప్రశ్నార్థక నిర్మాణాన్ని తెలుగులో సహజంగా చేయడానికి చివర ‘చేస్తున్నారేమిటి?’ అని మలిచాం.
