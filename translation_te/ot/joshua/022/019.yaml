source:
  edition: WLC
  text: וְ/אַ֨ךְ אִם טְמֵאָ֜ה אֶ֣רֶץ אֲחֻזַּתְ/כֶ֗ם עִבְר֨וּ לָ/כֶ֜ם אֶל אֶ֨רֶץ אֲחֻזַּ֤ת יְהוָה֙ אֲשֶׁ֤ר שָֽׁכַן שָׁם֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/הֵאָחֲז֖וּ בְּ/תוֹכֵ֑/נוּ וּ/בַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ בִּ/בְנֹֽתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ מִֽ/בַּלְעֲדֵ֔י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
translation:
  language: te
  text: “అయితే మీకు స్వాధీనంగా ఉన్న భూమి అపవిత్రమైనదైతే[a], యెహోవా నివాస గుడారం ఉన్న యెహోవా స్వాధీన భూమికి దాటి వచ్చి[b], మా మధ్య స్వాస్థ్యం పొందండి[c]. కాని యెహోవా మీద గానీ మా మీద గానీ తిరుగుబాటు చేయకండి; మన దేవుడైన యెహోవా బలిపీఠాన్ని తప్ప మీ కోసం మరో బలిపీఠం కట్టుకోవడం ద్వారా అలా చేయకండి[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మీ స్వాస్థ్య భూమి” లేదా “మీ వారసత్వ భూమి” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం వంశపారంపర్యంగా లభించిన భూహక్కును సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మాటలను మరింత అక్షరార్థంగా, “యెహోవా నివాస గుడారం అక్కడ నివసిస్తున్న” అని చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “మా మధ్య స్థిరపడండి” లేదా “మా మధ్య స్వాధీనం సంపాదించుకోండి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: “యెహోవా బలిపీఠానికి వేరుగా” లేదా “దానికి అదనంగా” అనే భావం కూడా సాధ్యం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: అయితే
  rationale: ముందటి మాటకు బలమైన షరతును జోడించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: טְמֵאָה
  choice: అపవిత్రమైనది
  rationale: ఆచారపరమైన లేదా నైతిక అపవిత్రత భావాన్ని నిలుపుతుంది; ఆ అపవిత్రత స్వరూపాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם / אֶרֶץ אֲחֻזַּת יְהוָה
  choice: మీకు స్వాధీనంగా ఉన్న భూమి / యెహోవా స్వాధీన భూమి
  rationale: אֲחֻזָּה లోని స్వాధీనం, వంశపారంపర్య భూహక్కు అనే భావాలను అనుమతిస్తూ, వాక్యంలోని ఉద్దేశపూర్వక పదపునరుక్తిని నిలుపుతుంది.
- source_word: עִבְרוּ לָכֶם
  choice: దాటి వచ్చి
  rationale: సందర్భంలో యొర్దాను దాటడాన్ని సూచిస్తుంది. לָכֶם లోని ప్రయోజనార్థక భావాన్ని తెలుగులో బలవంతంగా పదేపదే వ్యక్తం చేయకుండా, ఆహ్వానం యొక్క భావంలో సహజంగా ఉంచింది.
- source_word: מִשְׁכַּן יְהוָה
  choice: యెహోవా నివాస గుడారం
  rationale: మִשְׁכָּן యొక్క నివాసస్థల భావాన్నీ, ఆరాధనా గుడారం అనే సందర్భాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  choice: మా మధ్య స్వాస్థ్యం పొందండి
  rationale: కేవలం నివసించడం కంటే, మధ్యలో భూహక్కు లేదా స్థిరమైన స్వాధీనం పొందడం అనే אחז భావాన్ని నిలుపుతుంది.
- source_word: תִּמְרֹדוּ
  choice: తిరుగుబాటు చేయకండి
  rationale: యెహోవాకు మరియు గోత్ర సమాజానికి వ్యతిరేకంగా నిలబడే చర్యను నేరుగా తెలియజేస్తుంది.
- source_word: מִבַּלְעֲדֵי
  choice: కాకుండా
  rationale: అధికారిక బలిపీఠానికి వేరుగా లేదా అదనంగా మరో బలిపీఠం కట్టడం అనే హెచ్చరికను సంక్షిప్తంగా తెలియజేస్తూ, సంబంధం యొక్క పూర్తి పరిధిని వ్యాఖ్యానాత్మకంగా నిర్ణయించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యొర్దాను అవతలి భూమి అపవిత్రత స్వరూపం
  choice: “అపవిత్రమైనదైతే” అని మాత్రమే అనువదించి, అపవిత్రతను ఆచారపరమైనదిగా, భౌగోళికమైనదిగా లేదా అలంకారికమైనదిగా నిర్ధారించలేదు.
  alternative: “ఆరాధనకు అనర్హమైన భూమి” లేదా “అపవిత్రపరచబడిన భూమి” అని వివరణాత్మకంగా అనువదించడం.
  rationale: హీబ్రూ షరతును చెబుతుంది గాని అపవిత్రతకు కారణాన్ని వివరించదు; అందువల్ల మూలంలోని సందిగ్ధతను నిలిపాం.
- issue: రెండవ బలిపీఠం యొక్క స్థితి
  choice: యెహోవా బలిపీఠం కాకుండా తమ కోసం ఒక బలిపీఠం కట్టడాన్ని నిషేధించే మాటగా అనువదించాం.
  alternative: ఏ రెండవ బలిపీఠమైనా స్వతహాగా నిషిద్ధమని లేదా బలి అర్పించే ప్రత్యర్థి బలిపీఠమే ప్రత్యేకంగా ఉద్దేశించబడిందని స్పష్టీకరించడం.
  rationale: వాక్యం వేరొక బలిపీఠాన్ని వ్యతిరేకిస్తుంది; అయితే నిషేధం యొక్క ఖచ్చితమైన పరిధిని సందర్భం నుంచి విస్తరించి సిద్ధాంతీకరించకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధన వాడబడింది. భూహక్కుకు సంబంధించిన అర్థాన్ని నిలుపుతూ “స్వాధీనం/స్వాస్థ్యం” పదాలను ఎంచుకున్నాం. “నివాస గుడారం” సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి, ఆరాధనా సందర్భంలోని ప్రత్యేక భావాన్ని కూడా నిలుపుతుంది.
