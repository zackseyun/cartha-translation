revisions:
- from: “అయితే మీకు స్వాధీనంగా ఉన్న భూమి అపవిత్రమైనదైతే[a], యెహోవా నివాస గుడారం ఉన్న యెహోవా స్వాధీన భూమికి దాటి వచ్చి[b], మా మధ్య స్వాస్థ్యం పొందండి[c]. కాని మన దేవుడైన యెహోవా బలిపీఠం కాకుండా మీ కోసం ఒక బలిపీఠం కట్టుకొని[d], యెహోవా మీద గానీ మా మీద గానీ తిరుగుబాటు చేయకండి.”
  to: “అయితే మీకు స్వాధీనంగా ఉన్న భూమి అపవిత్రమైనదైతే[a], యెహోవా నివాస గుడారం ఉన్న యెహోవా స్వాధీన భూమికి దాటి వచ్చి[b], మా మధ్య స్వాస్థ్యం పొందండి[c]. కాని యెహోవా మీద గానీ మా మీద గానీ తిరుగుబాటు చేయకండి; మన దేవుడైన యెహోవా బలిపీఠాన్ని తప్ప మీ కోసం మరో బలిపీఠం కట్టుకోవడం ద్వారా అలా చేయకండి[d].”
  rationale: The revision replaces a potentially exclusive ‘instead of’ reading with wording that naturally conveys a further altar besides Yahweh’s altar. It also separates the rebellion warning from its means clause for clearer Telugu syntax. No doctrinal interpretation of the land’s uncleanness or the exact legal scope of the altar prohibition has been added.
