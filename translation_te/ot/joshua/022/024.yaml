id: JOS.22.24
reference: Joshua 22:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם לֹ֤א מִ/דְּאָגָה֙ מִ/דָּבָ֔ר עָשִׂ֥ינוּ אֶת זֹ֖את לֵ/אמֹ֑ר מָחָ֗ר יֹאמְר֨וּ בְנֵי/כֶ֤ם לְ/בָנֵ֨י/נוּ֙ לֵ/אמֹ֔ר מַה לָּ/כֶ֕ם וְ/לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/024.yaml
  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: te
  text: 'కాదు, ఒక విషయం గురించిన ఆందోళనవల్ల మేము ఇలా చేశాము: ‘రాబోయే కాలంలో మీ పిల్లలు మా పిల్లలతో, “ఇశ్రాయేలు దేవుడైన యెహోవాతో మీకేమి సంబంధం ఉంది?” అని అనవచ్చు.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִדְּאָגָה מִדָּבָר
  choice: ఆందోళనతోనే
  rationale: ఈ పదబంధం భయంతో కూడిన గాఢమైన చింతను సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు భావాన్ని సంక్షిప్తంగా వ్యక్తం చేశాం.
- source_word: מָחָר
  choice: రాబోయే కాలంలో
  rationale: అక్షరార్థంగా ‘రేపు’ అయినా, ఇక్కడ భవిష్యత్తులోని తరాల కాలాన్ని సూచిస్తుంది.
- source_word: מַה לָּכֶם וְלַיהוָה
  choice: యెహోవాతో మీకేమి సంబంధం?
  rationale: హీబ్రూ ప్రయోగం సంబంధం లేదా హక్కును ప్రశ్నించే భావాన్ని కలిగిస్తుంది; ఈ తెలుగు రూపం ఆ ఉద్దేశాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: తూర్పు గోత్రాల ఉద్దేశం
  choice: ఆందోళన వల్ల బలిపీఠం కట్టారని చూపించడం
  alternative: వారు దేవునికి విరోధంగా బలిపీఠం కట్టారని సూచించడం
  rationale: వచనంలోని నిరాకరణ మరియు వివరణ వారి చర్య వెనుక ఉన్న భవిష్యత్ విభజన భయాన్ని స్పష్టంగా తెలియజేస్తాయి.
- issue: ‘మీకేమి సంబంధం?’ అనే ప్రశ్న పరిధి
  choice: యెహోవాతో వారి సంబంధం లేదా హక్కును ప్రశ్నించే విస్తృత భావాన్ని ఉంచడం
  alternative: ఆరాధనలో వారికి అసలు భాగమే లేదని నిర్దిష్టంగా చెప్పడం
  rationale: మూలంలోని సంక్షిప్త ప్రశ్నలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే కథన శైలి. అంతర్లీన ఉద్ధరణలను స్పష్టంగా అమర్చాం.
