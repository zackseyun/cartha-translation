revisions:
- from: ఇప్పుడు మీ దేవుడైన యెహోవా మీ సహోదరులకు తాను వారితో చెప్పినట్టుగానే విశ్రాంతి ఇచ్చాడు. కాబట్టి ఇప్పుడు మీరు తిరిగి మీ గుడారాలకు[a] వెళ్లండి—యొర్దాను అవతల యెహోవా సేవకుడైన మోషే మీకు ఇచ్చిన మీ స్వాధీన దేశానికి వెళ్లండి.[b]
  to: ఇప్పుడు మీ దేవుడైన యాహ్వే, తాను వారికి చెప్పినట్లుగానే, మీ సహోదరులకు విశ్రాంతి ఇచ్చాడు. కాబట్టి ఇప్పుడు మీరు తిరిగి మీ గుడారాలకు[a], యొర్దాను అవతల యాహ్వే సేవకుడైన మోషే మీకు ఇచ్చిన మీ స్వాధీన భూమికి వెళ్లండి.[b]
  rationale: The revision corrects the indirect-object relation in ‘spoke to them,’ replaces an awkward land term with the source-faithful and natural ‘స్వాధీన భూమి,’ aligns the divine name with the POB audit trail, and smooths the coordinated destinations without reducing the Hebrew’s content. Both footnote anchors remain attached to their corresponding expressions.
