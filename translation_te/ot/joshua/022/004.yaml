  text: וְ/עַתָּ֗ה הֵנִ֨יחַ יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לַֽ/אֲחֵי/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר לָ/הֶ֑ם וְ/עַתָּ֡ה פְּנוּ֩ וּ/לְכ֨וּ לָ/כֶ֜ם לְ/אָהֳלֵי/כֶ֗ם אֶל אֶ֨רֶץ֙ אֲחֻזַּתְ/כֶ֔ם אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/004.yaml
  text: And now Yahweh your God has given rest to your brothers[a], just as he spoke to them. So now turn and go to your tents, to the land of your possession[d][c][b], which Moses the servant of Yahweh gave you beyond the Jordan.
translation:
  language: te
  text: ఇప్పుడు మీ దేవుడైన యాహ్వే, తాను వారికి చెప్పినట్లుగానే, మీ సహోదరులకు విశ్రాంతి ఇచ్చాడు. కాబట్టి ఇప్పుడు మీరు తిరిగి మీ గుడారాలకు[a], యొర్దాను అవతల యాహ్వే సేవకుడైన మోషే మీకు ఇచ్చిన మీ స్వాధీన భూమికి వెళ్లండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీ ఇళ్లకు’ అని కూడా అనువదించవచ్చు. హెబ్రీలో అక్షరార్థంగా ‘మీ గుడారాలకు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘యొర్దాను ఆవల’ లేదా ‘యొర్దాను నదికి అటువైపు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵנִיחַ
  choice: విశ్రాంతి ఇచ్చాడు
  rationale: ఈ హిఫిల్ రూపం యుద్ధం నుంచి ఉపశమనాన్ని, భద్రతను కలిగించడాన్ని సూచిస్తుంది; ‘విశ్రాంతి ఇచ్చాడు’ మూలరూపానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: యెహోవాను సూచించే ఏకవచన భావం మరియు రెండవ పురుష బహువచన సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַאֲחֵיכֶם
  choice: మీ సహోదరులకు
  rationale: ఇక్కడ సైనిక-గోత్ర సందర్భంలో తోటి ఇశ్రాయేలీయులను సూచిస్తుంది; ‘సహోదరులు’ మూలంలోని పుంలింగ బహువచనాన్ని, నిబంధనాత్మక ఐక్యతను నిలుపుతుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: తాను వారితో చెప్పినట్టుగానే
  rationale: דבר యొక్క ప్రాథమిక భావమైన ‘మాట్లాడు/చెప్పు’ను నిలుపుతుంది; ‘వాగ్దానం చేసినట్టు’ అనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో నిర్బంధంగా చేర్చదు.
- source_word: פְּנוּ וּלְכוּ לָכֶם
  choice: మీరు తిరిగి ... వెళ్లండి
  rationale: פנה యొక్క తిరుగుదల/దిశమార్పు భావాన్ని, הלך యొక్క వెళ్లడం భావంతో సహజమైన తెలుగు వాక్యంగా కలిపాం; లాభార్థక לָכֶםను విడిగా అసహజంగా అనువదించలేదు.
- source_word: לְאָהֳלֵיכֶם
  choice: మీ గుడారాలకు
  rationale: ఇది సందర్భంలో ‘ఇళ్లకు’ అనే విస్తృత భావం ఇవ్వగలిగినా, చారిత్రక దృశ్యాన్ని నిలుపుతూ అక్షరార్థమైన ‘గుడారాలు’ను ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: אֶל אֶרֶץ אֲחֻזַּתְכֶם
  choice: మీ స్వాధీన దేశానికి
  rationale: אֲחֻזָּה అనేది స్వాధీనంగా కలిగిన భూభాగాన్ని సూచిస్తుంది; ‘స్వాధీన దేశం’ వారసత్వం అనే అదనపు ధార్మిక భావాన్ని బలవంతంగా చేర్చదు.
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: మోషే మీకు ఇచ్చిన
  rationale: נתן యొక్క సాధారణ అర్థమైన ‘ఇచ్చు’ను నిలుపుతుంది; ‘కేటాయించిన’ అనేది సందర్భానుకూలమైనా మరింత వ్యాఖ్యానాత్మకం.
- source_word: עֶבֶד יְהוָה
  choice: యెహోవా సేవకుడు
  rationale: మోషేకు గౌరవపూర్వక నిబంధనాత్మక బిరుదుగా עֶבֶדకు ‘సేవకుడు’ సందర్భోచితం; ‘దాసుడు’ ఇక్కడ అనవసరంగా బానిసత్వ భావాన్ని ముందుకు తెచ్చే అవకాశం ఉంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: మాట్లాడుతున్న స్థానం నుంచి నది ఎదుటి వైపున ఉన్న ట్రాన్స్‌యొర్దాను భూభాగాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָהను ఎలా అందించాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామరూపంగానే ఉంచాం; ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ను ఎంచుకున్నాం, అయితే ‘యాహ్వే’ పునర్నిర్మిత ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: כַּאֲשֶׁר דִּבֶּר לָהֶםలో మాటా లేక వాగ్దానమా
  choice: తాను వారితో చెప్పినట్టుగానే
  alternative: తాను వారికి వాగ్దానం చేసినట్టుగానే
  rationale: సందర్భంలో దేవుని వాగ్దానం ఉద్దేశించబడినప్పటికీ, మూలక్రియ సాధారణంగా ‘చెప్పాడు/మాట్లాడాడు’ అని ఉంటుంది. ప్రధాన పాఠ్యం ఆ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. పునరుక్తంగా ఉన్న రెండు గమనక్రియలను సహజ తెలుగు ప్రవాహంలో ఉంచుతూ, ‘గుడారాలు,’ ‘స్వాధీన దేశం,’ ‘చెప్పినట్టుగానే’ వంటి మూలపాఠ్య లక్షణాలను కాపాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
