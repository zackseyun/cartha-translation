  text: So we said[b][a], ‘Let us now build for ourselves the altar—not for burnt offering and not for sacrifice.’
translation:
  language: te
  text: 'అందుచేత మేము ఇలా చెప్పుకున్నాం: “ఇప్పుడు మన కోసం ఆ బలిపీఠాన్ని కట్టుకుందాం—దహనబలి అర్పించడానికి కాదు, బలి అర్పించడానికి కూడా కాదు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అందుచేత మేము ఇలా చెప్పుకున్నాం” అనే మాటలను “అప్పుడు మేము చెప్పుకున్నాం” లేదా “మేము చెప్పుకున్నాం” అని కూడా అనువదించవచ్చు. హీబ్రూ సంధానపదం మునుపటి వచనంతో ఉన్న సంబంధాన్ని బట్టి ఈ భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: అందుచేత మేము … అని అనుకున్నాం
  rationale: మునుపటి వచనంలోని ఆందోళనకు ఫలితంగా తీసుకున్న నిర్ణయాన్ని wayyiqtol పరిచయం చేస్తోంది. సమూహం తమలో తాము చేసిన ఆలోచన/నిర్ణయం సందర్భానికి ‘అని అనుకున్నాం’ సహజంగా సరిపోతుంది; సంధానార్థాన్ని ‘అందుచేత’ తెలియజేస్తుంది.
- source_word: נַעֲשֶׂה נָּא לָנוּ לִבְנוֹת
  choice: ఇప్పుడు మన కోసం … కట్టుకుందాం
  rationale: עשה cohortativeతో వచ్చిన בנה infinitiveను తెలుగు సహజ వాక్యనిర్మాణంలో ఒకే ప్రతిపాదనగా ‘కట్టుకుందాం’ అని అందించాం. נָּא యొక్క ప్రేరణాత్మక/తక్షణ భావాన్ని ‘ఇప్పుడు,’ לָנוּ యొక్క ప్రయోజనార్థాన్ని ‘మన కోసం’ తెలియజేస్తాయి.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: ఆ బలిపీఠాన్ని
  rationale: నిర్దిష్ట articleను కాపాడుతూ, సందర్భంలో చర్చలో ఉన్న నిర్దిష్ట బలిపీఠాన్ని తెలుగులో సహజంగా ‘ఆ బలిపీఠం’ అని సూచించాం.
- source_word: לֹא לְעוֹלָה
  choice: దహనబలి అర్పించడానికి కాదు
  rationale: עֹלָהకు ప్రామాణికమైన ‘దహనబలి’ వాడి, לְ సూచించే ఉద్దేశాన్ని ‘అర్పించడానికి’తో స్పష్టం చేశాం.
- source_word: וְלֹא לְזָבַח
  choice: బలి అర్పించడానికి కూడా కాదు
  rationale: זֶבַחను విస్తృతమైన బలి వర్గంగా ఉంచి ‘బలి’గా అనువదించాం; ముందటి నిరాకరణతో సమాంతరతను ‘కూడా కాదు’ సహజంగా చూపుతుంది.
theological_decisions:
- issue: బలిపీఠం నిర్మించిన ఉద్దేశం
  choice: దహనబలి లేదా ఇతర బలి అర్పణ కోసం కాదని స్పష్టంగా ఉంచడం
  alternative: ఇది కేవలం జ్ఞాపకచిహ్నమని ఈ వచనంలోనే చేర్చడం
  rationale: హీబ్రూ ఈ వచనంలో రెండు బలి సంబంధిత ఉపయోగాలను మాత్రమే నిరాకరిస్తుంది; దాని సాక్ష్యార్థక ఉద్దేశం తరువాతి వచనాల్లో వివరించబడుతుంది. అందువల్ల ఇక్కడ ముందుగానే వివరణను జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. హీబ్రూ నుడికారమైన ‘మన కోసం చేయుదాం—బలిపీఠాన్ని కట్టడానికి’ అనే నిర్మాణాన్ని సహజ తెలుగులో ‘మన కోసం ఆ బలిపీఠాన్ని కట్టుకుందాం’గా సమన్వయించాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
