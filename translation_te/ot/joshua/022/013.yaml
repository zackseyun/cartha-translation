  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד אֶת פִּינְחָ֖ס בֶּן אֶלְעָזָ֥ר הַ/כֹּהֵֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/013.yaml
  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలీయులు యాజకుడైన ఎలియాజరు కుమారుడు ఫీనెహాసును గిలాదు దేశంలో ఉన్న రూబేనీయుల వద్దకు, గాదీయుల వద్దకు, మనష్షే అర్ధగోత్రం వద్దకు పంపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: అప్పుడు ... పంపారు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ సమస్త ఇశ్రాయేలు ప్రజలను సూచించే జాతీయ నామంగా ‘ఇశ్రాయేలీయులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  choice: రూబేనీయులు / గాదీయులు
  rationale: ఈ నిర్మాణాలు ఆయా గోత్రాల ప్రజలను సూచిస్తాయి; తెలుగులో జాతీయ/గోత్ర నామరూపాలు మూలార్థాన్ని సహజంగా అందిస్తాయి.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం వారు
  rationale: ‘మనష్షే గోత్రంలో సగం’ అనే భావాన్ని, వారిని గమ్యప్రజలుగా చూపే వాక్యనిర్మాణంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: గిలాదుదేశంలో ఉన్న
  rationale: రెండో אֶל ఇక్కడ ప్రజలు ఉన్న ప్రాంతాన్ని గుర్తించే స్థానార్థ సంబంధంగా గ్రహించబడింది; తెలుగులో ‘గిలాదుదేశంలో ఉన్న’ అనడం గమ్యప్రజల స్థానాన్ని స్పష్టంగా చూపుతుంది.
- source_word: אֶת פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు కుమారుడు ఫీనెహాసును
  rationale: אֶת ప్రత్యక్ష కర్మ సూచికను విడిగా అనువదించకుండా తెలుగు విభక్తితో చూపించాం. హీబ్రూ పదక్రమం ప్రకారం הַכֹּהֵן సమీప నామమైన ఎలియాజరును విశేషించే అవకాశం ఉన్నా, ‘యాజకుడైన ఎలియాజరు కుమారుడు’ అనే నిర్మాణం ఆ సంబంధాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: הַכֹּהֵן అనే బిరుదు ఎవరిని విశేషిస్తుంది?
  choice: 'ఎలియాజరును: ‘యాజకుడైన ఎలియాజరు కుమారుడు’'
  alternative: 'ఫీనెహాసును: ‘యాజకుడైన ఫీనెహాసు’'
  rationale: హీబ్రూ వాక్యంలో బిరుదు ఎలియాజరు తరువాత వెంటనే వస్తుంది; అలాగే యెహోషువ గ్రంథంలోని సాధారణ గుర్తింపు విధానంతో ఇది సరిపోతుంది. అయితే వ్యాకరణపరంగా లేదా భావపరంగా ఫీనెహాసుకు అన్వయించే పఠనం పూర్తిగా అసాధ్యం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా ఉండే కథనశైలి. గోత్రసంబంధ ‘కుమారులు’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజమైన ‘-ీయులు’ రూపాలతో అందించాం. వ్యక్తినామాలు తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
