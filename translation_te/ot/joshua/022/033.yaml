  to: ఆ విషయం ఇశ్రాయేలీయుల దృష్టికి మంచిదిగా తోచింది[a]. ఇశ్రాయేలీయులు దేవుణ్ణి స్తుతించారు[b]. వారిపై యుద్ధానికి వెళ్లి, రూబేను కుమారులు, గాదు కుమారులు నివసిస్తున్న భూమిని నాశనం చేయాలని వారు చెప్పలేదు[c].
  rationale: 'సవరణ చివరి వాక్యాన్ని హీబ్రూ వాక్యనిర్మాణానికి మరియు భావానికి మరింత సమీపంగా చేసింది: ఇశ్రాయేలీయులు యుద్ధానికి వెళ్లి ఆ భూమిని నాశనం చేయాలని చెప్పలేదు. ‘భూమి’ అనేది אֶרֶץ‌కు సందర్భానుకూలమైన, తక్కువగా నిర్దిష్టపరిచే అనువాదం. పాదటిప్పణి సూచికలు మరియు వాటి విషయాలు యథావిధిగా సరైన చోట ఉన్నాయి.'
