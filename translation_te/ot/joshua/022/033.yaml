source:
  edition: WLC
  text: וַ/יִּיטַ֣ב הַ/דָּבָ֗ר בְּ/עֵינֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְבָרֲכ֥וּ אֱלֹהִ֖ים בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֣א אָמְר֗וּ לַ/עֲל֤וֹת עֲלֵי/הֶם֙ לַ/צָּבָ֔א לְ/שַׁחֵת֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֛ר בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
translation:
  language: te
  text: ఆ విషయం ఇశ్రాయేలీయుల దృష్టికి మంచిదిగా తోచింది[a]. ఇశ్రాయేలీయులు దేవుణ్ణి స్తుతించారు[b]. వారిపై యుద్ధానికి వెళ్లి, రూబేను కుమారులు, గాదు కుమారులు నివసిస్తున్న భూమిని నాశనం చేయాలని వారు చెప్పలేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారుల దృష్టిలో.’ ఇక్కడ ఈ పదబంధం ఇశ్రాయేలీయులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘దేవుణ్ణి ఆశీర్వదించారు.’ ఇక్కడ భావం దేవుణ్ణి స్తుతించడం లేదా కొనియాడడం.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘వారిపై యుద్ధానికి వెళ్లాలని చెప్పలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: ఆ విషయం ... దృష్టికి మంచిదిగా తోచింది
  rationale: హీబ్రూ మూలంలోని ‘కళ్లలో మంచిదిగా ఉంది’ అనే మూల్యాంకన నుడికారపు చిత్రాన్ని కొంత నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా అర్థమయ్యేలా ‘దృష్టికి మంచిదిగా తోచింది’ అని అనువదించాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, ఇక్కడ మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే సామూహిక పదబంధం. ప్రధాన పాఠ్యంలో సహజమైన ‘ఇశ్రాయేలీయులు’ వాడి, అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  choice: దేవుణ్ణి స్తుతించారు
  rationale: בּרך అనే క్రియకు అక్షరార్థం ‘ఆశీర్వదించు’; దేవుడు కర్మగా ఉన్నప్పుడు అది ఆయనను కొనియాడడం లేదా స్తుతించడం అనే భావాన్ని వ్యక్తం చేస్తుంది. తెలుగులో అపార్థం రాకుండా సహజమైన భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: וְלֹא אָמְרוּ לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: వారిమీదికి యుద్ధానికి వెళ్లడం గురించి వారు మాట్లాడలేదు
  rationale: మూలంలో అక్షరార్థంగా ‘వారిమీదికి యుద్ధానికి వెళ్లాలని చెప్పలేదు’ ఉంది. ప్రతిపాదిత సైనిక చర్య గురించి ఇక చర్చించకపోవడమే సందర్భార్థం; ‘మాట్లాడలేదు’ అనేది మాటకు సంబంధించిన మూలభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְשַׁחֵת אֶת הָאָרֶץ
  choice: దేశాన్ని నాశనం చేయడానికి
  rationale: שׁחת ఇక్కడ సైనిక చర్యవల్ల కలిగే వినాశాన్ని, אֶרֶץ రూబేను మరియు గాదు వంశాల నివాస భూభాగాన్ని సూచిస్తాయి. అందువల్ల ‘దేశాన్ని నాశనం చేయడానికి’ అనేది బలాన్ని, భౌగోళిక భావాన్ని నిలుపుతుంది.
- source_word: יֹשְׁבִים בָּהּ
  choice: నివసిస్తున్న
  rationale: హీబ్రూ కృదంతం కొనసాగుతున్న నివాసాన్ని సూచిస్తుంది; ‘నివసిస్తున్న’ దానిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మనుషులు దేవుణ్ణి ‘ఆశీర్వదించడం’ అనే హీబ్రూ వ్యక్తీకరణ
  choice: ప్రధాన పాఠ్యంలో ‘దేవుణ్ణి స్తుతించారు’
  alternative: ‘దేవుణ్ణి ఆశీర్వదించారు’
  rationale: అక్షరార్థమైన ప్రత్యామ్నాయం హీబ్రూ ధార్మిక నుడికారాన్ని నేరుగా నిలుపుతుంది గానీ, ఆధునిక తెలుగులో మనుషులు దేవునికి ఆశీర్వాదం ప్రసాదించినట్లు అపార్థం కలిగించవచ్చు. ‘స్తుతించారు’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది; అక్షరార్థాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘దృష్టికి మంచిదిగా తోచింది’ అనే రూపం హీబ్రూ నుడికారపు ఛాయను నిలుపుతుంది; ‘ఇశ్రాయేలీయులు,’ ‘స్తుతించారు,’ ‘మాట్లాడలేదు’ వంటి పదాలు సాధారణ పాఠకులకు స్పష్టతనిస్తాయి. అన్ని పాదటిప్పణి సూచికలు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
