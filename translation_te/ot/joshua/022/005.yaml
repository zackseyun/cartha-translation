id: JOS.22.5
reference: Joshua 22:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֣ק שִׁמְר֣וּ מְאֹ֗ד לַ/עֲשׂ֨וֹת אֶת הַ/מִּצְוָ֣ה וְ/אֶת הַ/תּוֹרָה֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֮ מֹשֶׁ֣ה עֶֽבֶד יְהוָה֒ לְ֠/אַהֲבָה אֶת יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם וְ/לָ/לֶ֧כֶת בְּ/כָל דְּרָכָ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו וּ/לְ/דָבְקָה ב֑/וֹ וּ/לְ/עָבְד֕/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
translation:
  language: te
  text: 'అయితే, యాహ్వే సేవకుడైన మోషే మీకు ఆజ్ఞాపించిన ఆజ్ఞను, ధర్మశాస్త్రాన్ని[a] ఆచరించడానికి ఎంతో జాగ్రత్త వహించండి: మీ దేవుడైన యాహ్వేను ప్రేమించండి; ఆయన మార్గాలన్నిటిలో నడుచుకోండి; ఆయన ఆజ్ఞలను పాటించండి; ఆయనను అంటిపెట్టుకొని ఉండండి; మీ హృదయమంతటితోను మీ ప్రాణమంతటితోను ఆయనను సేవించండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘ఉపదేశాన్ని’ (హీబ్రూ: తోరా).'
    reason: ‘తోరా’ అనే హీబ్రూ పదానికి ‘ధర్మశాస్త్రం’తో పాటు ‘ఉపదేశం’ లేదా ‘బోధ’ అనే అర్థం కూడా ఉండగలదు.
lexical_decisions:
- source_word: רַק
  choice: ఒక్కటి మాత్రం
  rationale: ముందటి పంపివేత, ఆశీర్వాదం తరువాత వచ్చే బలమైన పరిమితి మరియు హెచ్చరికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שִׁמְרוּ מְאֹד
  choice: ఎంతో జాగ్రత్త వహించండి
  rationale: శబ్దశః ‘బాగా కాపాడండి’ అనే రూపం కంటే, ఆచరణ విషయంలో అత్యంత శ్రద్ధ చూపాలనే హీబ్రూ నుడికారపు బలాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לַעֲשׂוֹת
  choice: ఆచరించడానికి
  rationale: ఆజ్ఞను, ధర్మశాస్త్రాన్ని వాస్తవంగా అమలు చేయాలనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַמִּצְוָה
  choice: ఆజ్ఞ
  rationale: హీబ్రూలోని ఏకవచనాన్ని నిలుపుతూ, నిబంధన సంబంధమైన ఆదేశ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: הַתּוֹרָה
  choice: ధర్మశాస్త్రం
  rationale: మోషేకు సంబంధించిన ఈ నిబంధన సందర్భంలో గుర్తించదగిన ప్రామాణిక పదం; ‘ఉపదేశం’ అనే విస్తృత అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: עֶבֶד יְהוָה
  choice: యెహోవా సేవకుడు
  rationale: మోషేకు గౌరవపూర్వక బిరుదుగా ఉన్న భావాన్ని ‘సేవకుడు’ సహజంగా తెలియజేస్తుంది; ‘దాసుడు’ ఇక్కడ అవసరానికి మించి బంధిత స్థితిని ముందుకు తెచ్చే అవకాశం ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో ఉంచుతుంది.
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  choice: ఆయన మార్గాలన్నిటిలో నడుచుకోండి
  rationale: హీబ్రూ నైతిక రూపకాన్ని నిలుపుతూ ఆధునిక తెలుగు పాఠకుడికి అర్థమయ్యేలా ఉంది.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలను పాటించండి
  rationale: ఆజ్ఞలకు విధేయత చూపడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וּלְדָבְקָה בּוֹ
  choice: ఆయనను హత్తుకొని ఉండండి
  rationale: దగ్గరి అనుబంధం, విడువకుండా ఉండటం అనే క్రియ యొక్క సంబంధాత్మక తీవ్రతను నిలుపుతుంది.
- source_word: וּלְעָבְדוֹ
  choice: ఆయనను సేవించండి
  rationale: ఆరాధనను కూడా కలుపుకోగలిగే, కాని దానికే పరిమితం కాని నిబంధనపరమైన విధేయ సేవ అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: మీ పూర్ణహృదయంతో, పూర్ణప్రాణంతో
  rationale: సంపూర్ణ అంతరంగ నిబద్ధతను తెలిపే రెండు హీబ్రూ పదాలను వేర్వేరుగా నిలుపుతూ తెలుగులో గంభీరంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత నిబంధన నామాన్ని నేరుగా ఉపయోగిస్తుంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన రూపంలో నిలిపాం.
- issue: నిబంధనపరమైన రూపకాల నిలుపుదల
  choice: ఆయన మార్గాలన్నిటిలో నడుచుకోండి; ఆయనను హత్తుకొని ఉండండి
  alternative: ఆయన చిత్తానుసారం జీవించండి; ఆయనకు నమ్మకంగా ఉండండి
  rationale: వివరణాత్మక ప్రత్యామ్నాయాలు అర్థాన్ని స్పష్టం చేసినా, మూలంలోని ‘నడవడం’, ‘అంటుకొని ఉండడం’ అనే సంబంధాత్మక రూపకాల బలాన్ని తగ్గిస్తాయి; అందుచేత రూపకాలను నిలిపాం.
- issue: עבד యొక్క పరిధి
  choice: సేవించండి
  alternative: ఆరాధించండి
  rationale: దేవునికి చేసే సేవలో ఆరాధన ఉన్నప్పటికీ, ఈ పదం విధేయతతో కూడిన సమగ్ర సేవను సూచించగలదు; ‘ఆరాధించండి’ అని మాత్రమే అనువదించడం భావాన్ని సంకుచితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే ఆజ్ఞాత్మక శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస ఉద్దేశార్థక క్రియలను తెలుగులో స్పష్టమైన ఆజ్ఞలుగా విభజించాం; దీనివల్ల ఉపదేశ బలం నిలిచి పఠనసౌలభ్యం పెరుగుతుంది. దైవనామానికి ‘యెహోవా’ రూపాన్ని స్థిరంగా వాడాం.
