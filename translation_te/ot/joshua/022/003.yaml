source:
  edition: WLC
  text: לֹֽא עֲזַבְתֶּ֣ם אֶת אֲחֵי/כֶ֗ם זֶ֚ה יָמִ֣ים רַבִּ֔ים עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/שְׁמַרְתֶּ֕ם אֶת מִשְׁמֶ֕רֶת מִצְוַ֖ת יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
translation:
  language: te
  text: మీరు ఇన్ని రోజులుగా, ఈ రోజు వరకు, మీ సహోదరులను[a] విడిచిపెట్టలేదు; మీ దేవుడైన యహ్వే ఆజ్ఞను పాటించాల్సిన బాధ్యతను నెరవేర్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ తోటి ఇశ్రాయేలీయులను.’ హీబ్రూ మూలంలో పుంలింగ బహువచన బంధుత్వ పదమైన ‘మీ సహోదరులు’ ఉంది; అది విస్తృతంగా ఇశ్రాయేలు ప్రజలకు చెందినవారిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  choice: విడిచిపెట్టలేదు
  rationale: עזב అనే క్రియకు ‘విడిచిపెట్టు, వదిలివేయు’ అనే అర్థాలున్నాయి. ఇక్కడ సహోదరులను దీర్ఘకాలం ఒంటరిగా వదలకుండా వారికి తోడుగా నిలిచిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲחֵיכֶם
  choice: మీ సహోదరులను
  rationale: మూలంలోని పదం పుంలింగ బహువచనమైన ‘మీ సోదరులు.’ ‘సహోదరులు’ దాని బంధుత్వ భావాన్ని నిలుపుతుంది; సందర్భంలో ఇది తోటి ఇశ్రాయేలీయులను విస్తృతంగా సూచించగలదని పాదటిప్పణిలో తెలిపాం.
- source_word: זֶה יָמִים רַבִּים
  choice: ఇన్ని రోజులుగా
  rationale: చాలాకాలంగా కొనసాగిన వ్యవధిని సూచించే హీబ్రూ ప్రయోగానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: గతం నుంచి ప్రస్తుత దినం వరకు కొనసాగిన స్థితిని మూలానికి దగ్గరగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּשְׁמַרְתֶּם
  choice: నెరవేర్చారు
  rationale: שׁמר ఇక్కడ అప్పగించబడిన బాధ్యతను జాగ్రత్తగా పాటించడాన్ని సూచిస్తుంది. ‘నెరవేర్చారు’ అనే పదం మִשְׁמֶרֶת‌తో కలిసిన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מִשְׁמֶרֶת מִצְוַת
  choice: ఆజ్ఞను పాటించాల్సిన బాధ్యతను
  rationale: ఈ పదబంధం ఆజ్ఞవల్ల కలిగిన, కాపాడి నిర్వర్తించాల్సిన బాధ్యతను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో అర్థాన్ని స్పష్టంగా ఉంచుతూ రెండు నామపదాల సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: దైవనామంతో కూడిన ‘మీ దేవుడు’ అనే నిబంధనాత్మక సంబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని భేదాన్ని నిలుపుతుంది.
- issue: אֲחֵיכֶם అనే పుంలింగ బంధుత్వ పదం పరిధి
  choice: మీ సహోదరులను
  alternative: మీ తోటి ఇశ్రాయేలీయులను
  rationale: ప్రధాన పాఠంలో మూలంలోని పుంలింగ బహువచన బంధుత్వ రూపాన్ని నిలిపాం. సందర్భానుసారంగా అది తోటి ఇశ్రాయేలీయులను విస్తృతంగా సూచించగలదనే భావాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను వాడాం. మూలంలోని దీర్ఘకాల విశ్వాస్యత, సహోదర బంధం, ఆజ్ఞకు సంబంధించిన బాధ్యత అనే భావాలను సహజమైన వాక్యనిర్మాణంలో నిలిపాం.
