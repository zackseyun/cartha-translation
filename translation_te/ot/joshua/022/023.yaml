source:
  edition: WLC
  text: לִ/בְנ֥וֹת לָ֨/נוּ֙ מִזְבֵּ֔חַ לָ/שׁ֖וּב מֵ/אַחֲרֵ֣י יְהוָ֑ה וְ/אִם לְ/הַעֲל֨וֹת עָלָ֜י/ו עוֹלָ֣ה וּ/מִנְחָ֗ה וְ/אִם לַ/עֲשׂ֤וֹת עָלָי/ו֙ זִבְחֵ֣י שְׁלָמִ֔ים יְהוָ֖ה ה֥וּא יְבַקֵּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/023.yaml
  text: if we built for ourselves an altar to turn away from following Yahweh[a], or if to offer on it burnt offering or grain offering, or if to make on it sacrifices of peace offerings[b], may Yahweh himself require it.
translation:
  language: te
  text: యెహోవాను అనుసరించడం నుండి తిరిగిపోవడానికి మేము మా కోసం ఒక బలిపీఠాన్ని కట్టుకున్నట్లయితే, లేదా దానిమీద దహనబలిని మరియు ధాన్యార్పణను అర్పించడానికి, లేదా దానిమీద సమాధాన బలులను[b] అర్పించడానికి కట్టుకున్నట్లయితే, యెహోవాయే మమ్మల్ని లెక్క అడుగుగాక[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవాయే మమ్మల్ని లెక్క అడుగుతాడు.” అంటే, ఈ విషయం గురించి ఆయన మమ్మల్ని జవాబుదారులుగా చేస్తాడు.
    reason: ప్రమాణ సందర్భంలో చివరి క్రియను ఆకాంక్షార్థకంగా లేదా సాధారణ భవిష్యత్తుగా గ్రహించగల వ్యాకరణ అస్పష్టతను నిలుపుతుంది.
  - marker: b
    text: “సమాధాన బలులు”ను “సహవాస బలులు” అని కూడా అనువదించవచ్చు.
    reason: שְׁלָמִים బలులు సమాధానం/క్షేమంతో పాటు దేవునితో, ఆరాధకులతో సహవాసాన్ని కూడా సూచించగలవు.
lexical_decisions:
- source_word: לִבְנוֹת לָנוּ מִזְבֵּחַ
  choice: మేము మా కోసం ఒక బలిపీఠం కట్టుకున్నట్లయితే
  rationale: ముందటి వచనంలోని ప్రమాణ సందర్భం వల్ల לִבְנוֹת షరతు భావాన్ని కలిగిస్తుంది. ‘మా కోసం’ అనేది לָנוּను, ‘బలిపీఠం’ అనేది מִזְבֵּחַను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לָשׁוּב מֵאַחֲרֵי יְהוָה
  choice: యెహోవాను అనుసరించడం మానుకొని ఆయనకు దూరమవడానికి
  rationale: מֵאַחֲרֵיలోని ‘వెనుక నడవడం/అనుసరించడం’ అనే రూపకాన్ని, שׁוּבలోని విశ్వాసత్యాగ భావాన్ని రెండింటినీ స్పష్టంగా ఉంచుతుంది.
- source_word: לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה
  choice: దానిమీద దహనబలిని, ధాన్యార్పణను అర్పించడానికి
  rationale: הַעֲלוֹת బలి సందర్భంలో ‘అర్పించడం’; עוֹלָה సంపూర్ణంగా దహనం చేసే బలి; מִנְחָה ఇక్కడ ధాన్యార్పణ. וּ కలుపు భావాన్ని గౌరవిస్తూ రెండు అర్పణలను ఒకే జాబితాగా ఇచ్చాం.
- source_word: לַעֲשׂוֹת עָלָיו זִבְחֵי שְׁלָמִים
  choice: దానిమీద సమాధాన బలులు అర్పించడానికి
  rationale: עָשָׂה బలి సందర్భంలో సహజ తెలుగులో ‘అర్పించడం’గా వస్తుంది. שְׁלָמִיםకు సంప్రదాయబద్ధమైన ‘సమాధాన బలులు’ను ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదటీకలో ఇచ్చాం.
- source_word: יְהוָה הוּא יְבַקֵּשׁ
  choice: యెహోవాయే మమ్మల్ని లెక్క అడుగుగాక
  rationale: הוּא ఇచ్చే ఉద్ఘాటనను ‘యెహోవాయే’ చూపిస్తుంది. ప్రమాణంలోని స్వీయశాప సందర్భంలో יְבַקֵּשׁ కేవలం వెదకడం కాక జవాబు కోరడం లేదా శిక్షకు పిలవడం; ‘లెక్క అడుగుగాక’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది; దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగు రూపమైన ‘యెహోవా’గా ఉంచాం.
- issue: చివరి వాక్యభాగం ప్రమాణమా లేక సాధారణ భవిష్యద్వాక్యమా
  choice: యెహోవాయే మమ్మల్ని లెక్క అడుగుగాక
  alternative: యెహోవాయే మమ్మల్ని లెక్క అడుగుతాడు
  rationale: సందర్భం స్వీయశాప ప్రమాణం. అందువల్ల విధ్యర్థక/ఆకాంక్షార్థక రూపం తగినది; అయితే హీబ్రూ క్రియను సాధారణ భవిష్యత్తుగా కూడా అర్థం చేసుకోవచ్చని పాదటీక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రమాణపు గంభీరతను నిలుపుతూ రచించబడింది. వరుస ఉద్దేశాలను ‘గానీ’తో సమన్వయపరచి హీబ్రూ షరతు నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేశాం.
