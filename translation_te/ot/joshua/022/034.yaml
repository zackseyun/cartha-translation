source:
  edition: WLC
  text: וַֽ/יִּקְרְא֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד לַ/מִּזְבֵּ֑חַ כִּ֣י עֵ֥ד הוּא֙ בֵּֽינֹתֵ֔י/נוּ כִּ֥י יְהוָ֖ה הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
translation:
  language: te
  text: రూబేను కుమారులు, గాదు కుమారులు ఆ బలిపీఠానికి “సాక్షి”[a] అని పేరు పెట్టారు. ఎందుకంటే యహ్వే దేవుడని మన మధ్య ఇది సాక్షి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత విస్తృతంగా: “వారు ఆ బలిపీఠానికి ‘యహ్వే దేవుడని మన మధ్య సాక్షి’ అని పేరు పెట్టారు.” ఈ పఠనంలో వివరణాత్మక వాక్యాన్ని పేరుకు కారణంగా కాకుండా, పేరులో భాగంగా తీసుకుంటారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: పేరు పెట్టారు
  rationale: קרא + ל నిర్మాణం ఇక్కడ ఒక వస్తువుకు పేరు పెట్టడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంది.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: రూబేను కుమారులు, గాదు కుమారులు
  rationale: హీబ్రూ వంశసూచక నిర్మాణాన్ని నిలుపుతూ, గోత్రపితల సంతతితో కథన సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לַמִּזְבֵּחַ
  choice: ఆ బలిపీఠానికి
  rationale: מִזְבֵּחַకు ప్రామాణిక తెలుగు సమానం ‘బలిపీఠం’; సందర్భంలో ముందే ప్రస్తావించిన నిర్దిష్ట బలిపీఠాన్ని ‘ఆ’ సూచిస్తుంది.
- source_word: עֵד
  choice: సాక్షి
  rationale: ఈ నామవాచకం ‘సాక్షి/సాక్ష్యం’ అనే అర్థాన్ని ఇస్తుంది. బలిపీఠానికి పెట్టిన పేరుగా ‘సాక్షి’ నేరుగా, సహజంగా సరిపోతుంది.
- source_word: כִּי עֵד הוּא
  choice: ఎందుకంటే ... అది ... సాక్షిగా ఉంది
  rationale: మొదటి כִּי పేరుకు కారణాన్ని వివరిస్తుంది; హוּא బలిపీఠాన్నే సూచిస్తుంది.
- source_word: בֵּינֹתֵינוּ
  choice: మన మధ్య
  rationale: పాల్గొన్న గోత్ర సమూహాల మధ్య ఉన్న సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי יְהוָה הָאֱלֹהִים
  choice: యెహోవాయే దేవుడు అని
  rationale: రెండవ כִּי సాక్ష్యపు విషయాన్ని పరిచయం చేస్తుంది. ‘-యే’ హీబ్రూ వాక్యంలోని ఒప్పుకోలు-బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది; יְהוָהను వ్యక్తినామమైన ‘యెహోవా’గా ఉంచుతుంది.
theological_decisions:
- issue: హీబ్రూ పాఠంలో ఉన్నదానికంటే విస్తృతమైన బలిపీఠపు పేరును ప్రధాన పాఠంలో చేర్చాలా?
  choice: ప్రధాన పాఠంలో స్పష్టంగా ఉన్న ‘సాక్షి’ అనే పేరునే ఇవ్వడం
  alternative: “యెహోవాయే దేవుడు అని మన మధ్య సాక్షి” అనే మొత్తం వివరణను బలిపీఠపు పేరుగా తీసుకోవడం
  rationale: మసొరేటిక్ పాఠాన్ని కారణవాక్యంగా కూడా సహజంగా చదవవచ్చు; అయితే దానినంతటినీ పేరుగా గ్రహించే అవకాశం ఉంది. ప్రధాన పాఠం అదనంగా నిర్ణయించకుండా సంక్షిప్త పేరును ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వంశసూచక రూపాన్ని నిలిపి, వాక్యక్రమాన్ని సహజ తెలుగు ప్రవాహానికి అనుగుణంగా అమర్చాం.
