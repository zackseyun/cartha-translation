source:
  edition: WLC
  text: וַ/יָּ֣שָׁב פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וְ/הַ/נְּשִׂיאִ֡ים מֵ/אֵ֣ת בְּנֵֽי רְאוּבֵן֩ וּ/מֵ/אֵ֨ת בְּנֵי גָ֜ד מֵ/אֶ֧רֶץ הַ/גִּלְעָ֛ד אֶל אֶ֥רֶץ כְּנַ֖עַן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּשִׁ֥בוּ אוֹתָ֖/ם דָּבָֽר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
translation:
  language: te
  text: అప్పుడు యాజకుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు, నాయకులు రూబేను సంతతివారి దగ్గరనుండి, గాదు సంతతివారి దగ్గరనుండి గిలాదు దేశం నుండి కనాను దేశానికి, ఇశ్రాయేలీయుల దగ్గరకు[b] తిరిగి వచ్చారు; వారికి సమాచారాన్ని అందించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విషయాన్ని వారికి నివేదించారు.” హీబ్రూ דָּבָר (దావార్) అనే పదానికి సందర్భాన్ని బట్టి “మాట,” “విషయం,” లేదా “సమాచారం” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “ఇశ్రాయేలు కుమారుల దగ్గరకు”; అంటే ఇశ్రాయేలీయుల దగ్గరకు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చి
  rationale: שׁוב క్రియ ఇక్కడ పూర్తయిన తిరుగు ప్రయాణాన్ని సూచిస్తుంది. తెలుగు కథన ప్రవాహంలో ‘తిరిగి వచ్చి’ సహజంగా ఉండి, మూలంలోని దిశాభావాన్ని నిలుపుతుంది.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు
  rationale: హీబ్రూ పదక్రమం ప్రకారం ‘యాజకుడు’ అనే విశేషణాన్ని ఎలియాజరుతో అనుసంధానిస్తూ, వంశపరమైన గుర్తింపును స్పష్టంగా ఉంచింది.
- source_word: וְהַנְּשִׂיאִים
  choice: నాయకులు
  rationale: נְשִׂיאִים ఇక్కడ గోత్రాధిపతులు లేదా ప్రతినిధి నాయకులను సూచిస్తుంది; ‘నాయకులు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి రాజరిక భావాన్ని అనవసరంగా చేర్చదు.
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  choice: రూబేను సంతతివారి దగ్గరనుండి, గాదు సంతతివారి దగ్గరనుండి
  rationale: בְּנֵי + గోత్రనామం ఆ గోత్ర ప్రజలను సూచిస్తుంది. పునరావృతమైన מֵאֵת నిర్మాణాన్ని రెండు సార్లు ‘దగ్గరనుండి’ అని ప్రతిబింబిస్తూ, ‘సంతతివారు’ ద్వారా వంశగోత్ర భావాన్ని నిలిపింది.
- source_word: מֵאֶרֶץ הַגִּלְעָד
  choice: గిలాదు దేశాన్ని విడిచి
  rationale: ప్రయాణ సందర్భంలో מֵאֶרֶץ అనే బయలుదేరే స్థలాన్ని సహజ తెలుగులో ‘దేశాన్ని విడిచి’ అని వ్యక్తం చేసింది; భౌగోళిక భావం నిలిచింది.
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: కనాను దేశంలోని
  rationale: తదుపరి ‘ఇశ్రాయేలీయుల దగ్గరకు’ అనే గమ్యంతో సహజంగా అనుసంధానించేందుకు ‘కనాను దేశంలోని’ అని ఇచ్చింది; אֶרֶץ యొక్క ‘దేశం’ భావం నిలిచింది.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల దగ్గరకు[b]
  rationale: సందర్భంలో ‘ఇశ్రాయేలు కుమారులు’ అంటే ఇశ్రాయేలు ప్రజలు. సహజ ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ అని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో తెలిపింది.
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  choice: వారికి సమాచారం అందించారు[a]
  rationale: ఈ సందర్భంలో דָּבָר తీసుకువచ్చిన వార్త లేదా నివేదికను సూచిస్తుంది. ‘సమాచారం అందించారు’ సహజమైన తెలుగు; పదంలోని ‘మాట/విషయం/సమాచారం’ అనే అర్థవిస్తృతిని పాదసూచికలో నిలిపింది.
