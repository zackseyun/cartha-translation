translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. గోత్రపేర్లకు ‘సంతతివారు’ అని ఇవ్వడం ద్వారా మూలంలోని వంశపరమైన భావాన్ని నిలిపి, ‘ఇశ్రాయేలీయులు’ వంటి సహజ ప్రజావాచక రూపాన్ని పాదసూచికతో సమతుల్యం చేసింది. మూలంలోని దీర్ఘ వాక్య నిర్మాణాన్ని చదవదగిన తెలుగు క్రమంలో అమర్చింది.
