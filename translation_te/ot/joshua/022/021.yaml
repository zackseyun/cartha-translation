  text: וַֽ/יַּעֲנוּ֙ בְּנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֔ד וַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה וַֽ/יְדַבְּר֔וּ אֶת רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/021.yaml
  text: 'Then the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh answered and spoke to the heads of the clans of Israel:'
translation:
  language: te
  text: 'అప్పుడు రూబేను వంశస్థులు, గాదు వంశస్థులు, మనష్షే అర్ధగోత్రస్థులు జవాబిచ్చి, ఇశ్రాయేలీయుల సహస్రాధిపతులతో[a] ఇలా మాట్లాడారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇశ్రాయేలు సహస్రాల అధిపతులు.” ఇక్కడ “సహస్రాలు” అనేది వంశాలనో గోత్రపరమైన లేదా పరిపాలనా విభాగాలనో సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: జవాబిచ్చారు
  rationale: సంభాషణలో ముందుగా పలికిన మాటలకు ప్రతిస్పందనను సూచించే ענה క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: రూబేను వంశస్థులు, గాదు వంశస్థులు
  rationale: అక్షరార్థంగా ‘కుమారులు’ అయినా, ఇక్కడ గోత్రాలకు చెందిన ప్రజలను సూచిస్తున్నందున ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం వారు
  rationale: మూలంలోని ‘మనష్షే గోత్రంలో సగం’ అనే పరిపాలనా-గోత్ర భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וַיְדַבְּרוּ
  choice: ఇలా జవాబిచ్చారు
  rationale: హీబ్రూలోని ‘జవాబిచ్చి మాట్లాడారు’ అనే రెండు క్రియల నిర్మాణం తెలుగులో యథాతథంగా పెడితే భారంగా ఉంటుంది; ‘ఇలా జవాబిచ్చారు’ రెండింటి సంభాషణాత్మక కార్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు వేలమందికి అధిపతులు
  rationale: אַלְפֵי అనే పదానికి అక్షరార్థమైన ‘వేలమంది’ భావాన్ని ప్రధాన పాఠంలో నిలిపి, అది వంశ లేదా పరిపాలనా విభాగాలను సూచించవచ్చని పాదసూచికలో వివరిస్తుంది.
