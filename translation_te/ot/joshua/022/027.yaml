revisions:
- from: అది మనకూ మీకూ, మన తర్వాతి తరాలకూ మధ్య సాక్షిగా ఉండాలి. తద్వారా మన దహనబలులతో, బలులతో, సమాధాన బలులతో యెహోవా సన్నిధిలో ఆయన సేవను మనం నిర్వహించగలం. అప్పుడు రాబోయే కాలంలో మీ పిల్లలు మా పిల్లలతో, ‘యెహోవాలో మీకు భాగం లేదు’ అని అనరు.
  to: కానీ అది మనకూ మీకూ, మన తర్వాతి తరాలకూ మధ్య సాక్షిగా ఉంది; యెహోవా సన్నిధిలో మన దహనబలులతో, బలులతో, సమాధానబలులతో ఆయన సేవను మనం నిర్వహించడానికి, రాబోయే కాలంలో మీ పిల్లలు మన పిల్లలతో, ‘యెహోవాలో మీకు భాగం లేదు’ అని చెప్పకుండా ఉండడానికి అది సాక్షిగా ఉంది.
  rationale: హెబ్రీయ నిర్దేశక «הוּא עֵד»కు వర్తమానమైన «సాక్షిగా ఉంది»ను పునరుద్ధరించాం. మొదటి-పురుష బహువచన సర్వనామాన్ని స్థిరంగా ఉంచి «మా పిల్లలు»ను «మన పిల్లలు»గా మార్చాం. మూలంలోని సేవ చేయడం మరియు భవిష్యత్ తరాలు నిరాకరించకపోవడం అనే ఉద్దేశాలను స్పష్టంగా అనుసంధానించాం; దైవనామం మరియు బలి-పదజాలం నిలిపివేశాం.
