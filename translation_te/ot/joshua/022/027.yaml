source:
  edition: WLC
  text: כִּי֩ עֵ֨ד ה֜וּא בֵּינֵ֣י/נוּ וּ/בֵינֵי/כֶ֗ם וּ/בֵ֣ין דֹּרוֹתֵי/נוּ֮ אַחֲרֵי/נוּ֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת יְהוָה֙ לְ/פָנָ֔י/ו בְּ/עֹלוֹתֵ֥י/נוּ וּ/בִ/זְבָחֵ֖י/נוּ וּ/בִ/שְׁלָמֵ֑י/נוּ וְ/לֹא יֹאמְר֨וּ בְנֵי/כֶ֤ם מָחָר֙ לְ/בָנֵ֔י/נוּ אֵין לָ/כֶ֥ם חֵ֖לֶק בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: te
  text: కానీ అది మనకూ మీకూ, మన తర్వాతి తరాలకూ మధ్య సాక్షిగా ఉంది; యెహోవా సన్నిధిలో మన దహనబలులతో, బలులతో, సమాధానబలులతో ఆయన సేవను మనం నిర్వహించడానికి, రాబోయే కాలంలో మీ పిల్లలు మన పిల్లలతో, ‘యెహోవాలో మీకు భాగం లేదు’ అని చెప్పకుండా ఉండడానికి అది సాక్షిగా ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: అది ... ఉండాలి
  rationale: ఈ సందర్భంలో ముందటి వాక్యంలోని నిరాకరణకు ఎదురుగా బలిపీఠపు నిజమైన ఉద్దేశాన్ని వివరిస్తుంది; తెలుగులో సహజమైన సంబంధాన్ని వాక్య నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: עֵד
  choice: సాక్షి
  rationale: బలిపీఠం రెండు వర్గాల మధ్య వారి ఉమ్మడి హక్కు, ఆరాధనకు సాక్ష్యంగా నిలుస్తుందనే న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת יְהוָה
  choice: యెహోవా ... ఆయన సేవను మనం నిర్వహించగలం
  rationale: మూలంలోని క్రియా-నామ పునరుక్తి సేవను ఆచరించడం/నిర్వహించడం అనే భావాన్ని ఇస్తుంది; తెలుగులో అసహజ పునరుక్తిని నివారిస్తూ భావాన్ని కాపాడింది.
- source_word: לְפָנָיו
  choice: యెహోవా సన్నిధిలో
  rationale: అక్షరార్థంగా ‘ఆయన ఎదుట’; ఆరాధనా సందర్భంలో ఆధునిక తెలుగు బైబిలు శైలికి సహజమైన ‘సన్నిధిలో’ సరిపోతుంది.
- source_word: עֹלוֹתֵינוּ
  choice: మన దహనబలులతో
  rationale: పూర్తిగా దహించబడే బలి రకాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: זְבָחֵינוּ
  choice: బలులతో
  rationale: సాధారణ బలి అర్థాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: שְׁלָמֵינוּ
  choice: సమాధాన బలులతో
  rationale: שְׁלָמִים అనే ప్రత్యేక బలి వర్గానికి ప్రాచుర్యంలో ఉన్న, అర్థవంతమైన తెలుగు పదబంధం.
- source_word: חֵלֶק בַּיהוָה
  choice: యెహోవాలో ... భాగం
  rationale: ‘యెహోవాలో భాగం’ అనే మూల రూపకాన్ని అలాగే ఉంచి, అది భూభాగమా, నిబంధన సంబంధ హక్కా, ఆరాధనలో పాలా అన్న విస్తృత భావాన్ని సంకుచితం చేయలేదు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: తెలుగు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపాన్ని వాడి, మూలంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చలేదు.
- issue: ‘యెహోవాలో భాగం’ అనే మాట యొక్క పరిధి
  choice: మూల రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: యెహోవాను ఆరాధించే హక్కు లేదు
  rationale: సందర్భం ఆరాధనా హక్కును సూచించినప్పటికీ, మూల వాక్యం నిబంధన సంబంధం మరియు వారసత్వ భావాలను కూడా మోస్తుంది; వివరణాత్మకంగా సంకుచితం చేయలేదు.
- issue: బలిపీఠం యొక్క పాత్ర
  choice: సాక్షి
  alternative: జ్ఞాపకచిహ్నం
  rationale: עֵד నేరుగా ‘సాక్షి’; కేవలం జ్ఞాపకార్థక వస్తువుగా మార్చితే దాని సాక్ష్యపూర్వక పాత్ర తగ్గుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. బలి సంబంధ పదజాలంలో అవసరమైన సాంకేతిక ఖచ్చితత్వం ఉంచబడింది; మూలంలోని దీర్ఘ వాక్యాన్ని స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం.
