reference: Joshua 22:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “మీరు అపారమైన సంపదతో, ఎంతో పశుసంపదతో, వెండితో, బంగారంతో, కంచుతో[a], ఇనుముతో, ఎంతో ఎక్కువ వస్త్రాలతో మీ గుడారాలకు తిరిగి వెళ్లండి. మీ శత్రువుల నుండి తీసుకున్న యుద్ధదోపిడి సొమ్మును మీ సహోదరులతో[b] పంచుకోండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాగి.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘సహోదరులు’ అంటే ఇతర గోత్రాలకు చెందిన తోటి ఇశ్రాయేలీయులు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: అతడు వారితో ఇలా అన్నాడు
  rationale: హీబ్రూ వాక్యప్రారంభ సూత్రంలోని పూర్తి భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘అని చెప్పాడు’ అనే పునరుక్తిని యాంత్రికంగా ఉంచలేదు.
- source_word: בִּנְכָסִים רַבִּים
  choice: విస్తారమైన ఆస్తులతో
  rationale: נְכָסִים అనేది ధనం, ఆస్తులు, సంపద అనే విస్తృత భావాన్ని కలిగి ఉంది; తరువాత వచ్చే నిర్దిష్ట జాబితాకు ముందు ‘ఆస్తులు’ తగిన సమగ్ర పదం.
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  choice: మీ గుడారాలకు తిరిగి వెళ్లండి
  rationale: చారిత్రక సందర్భంలోని ‘గుడారాలు’ అనే స్పష్టమైన అర్థాన్ని నిలుపుతూ, బహువచన ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּבְמִקְנֶה רַב מְאֹד
  choice: ఎంతో పశుసంపదతో
  rationale: מִקְנֶה అన్ని రకాల పెంపుడు పశువులను సూచించే సమూహపదం; ‘పశుసంపద’ దాని పరిధిని సంకుచితం చేయదు.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: వెండిబంగారాలతో
  rationale: రెండు లోహాలనూ నేరుగా, సహజమైన తెలుగు సమాసప్రయోగంలో అందిస్తుంది.
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  choice: కంచు, ఇనుములతో
  rationale: נְחֹשֶׁת రాగి లేదా కంచును సూచించగలదు; ప్రాచీన లోహాల జాబితాలో సాధారణంగా సరిపోయే ‘కంచు’ను ప్రధాన పాఠంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  choice: అత్యధికమైన వస్త్రాలతో
  rationale: שְׂלָמוֹתకు వస్త్రాలు అనే విస్తృత అర్థం ఉంది; הַרְבֵּה מְאֹדలోని బలమైన పరిమాణ భావాన్ని ‘అత్యధికమైన’ నిలుపుతుంది.
- source_word: חִלְקוּ
  choice: పంచుకోండి
  rationale: బహువచన ఆజ్ఞను నేరుగా తెలియజేస్తూ, ఇతరులతో భాగం పంచే సందర్భానికి ‘పంచుకోండి’ సహజంగా సరిపోతుంది.
- source_word: שְׁלַל אֹיְבֵיכֶם
  choice: మీ శత్రువుల కొల్లసొమ్మును
  rationale: שָׁלָל యుద్ధంలో స్వాధీనమైన సొమ్ము లేదా వస్తువులను సూచిస్తుంది; ‘కొల్లసొమ్ము’ సైనిక సందర్భాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עִם אֲחֵיכֶם
  choice: మీ సహోదరులతో
  rationale: אָחִיםలోని పురుష బహువచన బంధుత్వ రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది ఇతర ఇశ్రాయేలీయ గోత్రాలవారిని సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: אֲחֵיכֶם అనే లింగసూచక బంధుత్వ పదం
  choice: మీ సహోదరులతో
  alternative: మీ తోటి ఇశ్రాయేలీయులతో
  rationale: మూలంలోని పురుష బహువచన బంధుత్వ భాషను ప్రధాన పాఠంలో నిలుపుతూ, దాని సామూహిక ఇశ్రాయేలీయ సందర్భాన్ని పాదసూచికలో స్పష్టం చేసింది; భావాన్ని లింగతటస్థ పదంతో నిశ్శబ్దంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘గుడారాలు,’ ‘కొల్లసొమ్ము,’ ‘సహోదరులు’ వంటి పదాలతో చారిత్రక నేపథ్యాన్ని మరియు మూలంలోని బంధుత్వ భాషను నిలిపింది; హీబ్రూ జాబితా యొక్క సమృద్ధి భావాన్ని తెలుగు వాక్యప్రవాహానికి అనుగుణంగా అందించింది.
