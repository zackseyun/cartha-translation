source:
  edition: WLC
  text: וְ/אַתֶּם֙ תָּשֻׁ֣בוּ הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה וְ/הָיָ֗ה אַתֶּ֞ם תִּמְרְד֤וּ הַ/יּוֹם֙ בַּֽ/יהוָ֔ה וּ/מָחָ֕ר אֶֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יִקְצֹֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
translation:
  language: te
  text: మీరు ఈ రోజే యెహోవాను అనుసరించడం విడిచిపెడుతున్నారు.[a] ఈ రోజు మీరు యెహోవాకు వ్యతిరేకంగా తిరుగుబాటు చేస్తే, రేపు ఆయన ఇశ్రాయేలు సమాజమంతటిపై కోపపడతాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని క్రియకు ‘వెనక్కి తిరగడం’ లేదా ‘తొలగిపోవడం’ అనే అర్థాలు రావచ్చు. ఇక్కడ ‘యెహోవా వెనుకనుండి తిరగడం’ అనే ప్రయోగం ఆయనను అనుసరించడం మానేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో ‘కోపపడతాడు’ అనే క్రియకు కర్త స్పష్టంగా పేర్కొనబడలేదు; సందర్భానుసారంగా అది యెహోవాను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֻׁבוּ מֵאַחֲרֵי יְהוָה
  choice: యెహోవాను అనుసరించడం మానేసి, ఆయననుండి తొలగిపోతున్నారా?
  rationale: שוב అనే క్రియకు ‘తిరుగు’ లేదా ‘తొలగిపో’ అనే భావాలు ఉండవచ్చు. מֵאַחֲרֵי (‘వెనుకనుండి/అనుసరించడంనుండి’)తో కలిసి ఇక్కడ యెహోవాను అనుసరించడం విడిచిపెట్టే అవిధేయతను సూచిస్తుంది. సందర్భంలోని ప్రశ్నాత్మక మందలింపును సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను ప్రాజెక్టు వాడుకకు అనుగుణంగా తెలుగులో ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וְהָיָה אַתֶּם תִּמְרְדוּ
  choice: మీరు ... తిరుగుబాటు చేస్తే
  rationale: అక్షరార్థంగా ‘అప్పుడు/అది జరుగుతుంది—మీరు తిరుగుబాటు చేస్తారు’ అనే నిర్మాణం, సందర్భంలో షరతుతో కూడిన హెచ్చరికగా పనిచేస్తుంది; తెలుగులో ‘చేస్తే’ సహజంగా ఆ సంబంధాన్ని చూపుతుంది.
- source_word: בַּיהוָה
  choice: యెహోవా మీద
  rationale: מרד అనే ‘తిరుగుబాటు చేయు’ క్రియతో בְ విరోధార్థకంగా ఉంది. ‘యెహోవా మీద తిరుగుబాటు’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: וּמָחָר
  choice: రేపు
  rationale: తక్షణంగా అనుసరించే సామూహిక పరిణామాన్ని సూచించే కాలవాచకం; మూలంలోని అత్యవసరతను నిలుపుతుంది.
- source_word: יִקְצֹף
  choice: ఆయన ... కోపగిస్తాడు
  rationale: קצף తీవ్రమైన కోపాన్ని సూచిస్తుంది. తెలుగులో ‘కోపగిస్తాడు’ గంభీరమైనదిగా, సులభంగా అర్థమయ్యేదిగా ఉంది; కర్త సందర్భం వల్ల యెహోవా అని స్పష్టమవుతుంది.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతటి
  rationale: עֵדָה ఇశ్రాయేలు యొక్క సమిష్టి సమాజాన్ని సూచిస్తుంది. ‘సమాజమంతటి’ సామూహిక బాధ్యత, పరిణామం రెండింటినీ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יִקְצֹף అనే క్రియకు స్పష్టంగా చెప్పని కర్త
  choice: ‘ఆయన’ అంటే యెహోవా అని సందర్భానుసారంగా అనువదించడం
  alternative: ‘కోపం కలుగుతుంది’ అని కర్తను అనిర్దిష్టంగా ఉంచడం
  rationale: ముందటి వాక్యభాగాల్లో యెహోవాను అనుసరించడం విడిచిపెట్టడం, ఆయన మీద తిరుగుబాటు చేయడం ప్రస్తావించబడ్డాయి. కాబట్టి కోపగించే కర్త యెహోవానే అని సందర్భం బలంగా సూచిస్తుంది; అయితే మూలంలో కర్త నామరూపంగా పునరుక్తం కాలేదని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన మందలింపు-హెచ్చరిక శైలిని ఉపయోగించాం. ‘తొలగిపోతున్నారా?’ అనే ప్రశ్నారూపం సందర్భంలోని ఆరోపణాత్మక ఆశ్చర్యాన్ని ప్రతిబింబిస్తుంది; ‘సమాజమంతటి’ సామూహిక పరిణామాన్ని స్పష్టంగా ఉంచుతుంది.
