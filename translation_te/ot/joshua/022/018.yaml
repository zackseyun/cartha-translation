  source_fidelity: మొదటి భాగంలో ఉన్న וְאַתֶּם תָּשֻׁבוּ הַיּוֹם מֵאַחֲרֵי יְהוָה, యెహోవాను అనుసరించడం విడిచిపెట్టడాన్ని సూచిస్తుంది. ముసాయిదాలోని ప్రశ్నార్థక రూపం మూలపాఠంలో స్పష్టంగా లేదు; దానిని ప్రకటనాత్మక హెచ్చరికగా ఉంచడం సురక్షితం. בַּיהוָה కు ‘యెహోవాకు వ్యతిరేకంగా’ అనేది తిరుగుబాటు సందర్భంలోని విరోధార్థాన్ని స్పష్టంగా ఇస్తుంది. యిక్త్సోఫ్‌కు సందర్భసిద్ధమైన కర్తగా ‘ఆయన’ను నిలిపాం.
