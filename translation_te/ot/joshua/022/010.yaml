reference: Joshua 22:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל גְּלִיל֣וֹת הַ/יַּרְדֵּ֔ן אֲשֶׁ֖ר בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יִּבְנ֣וּ בְנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִ֣י שֵׁבֶט֩ הַֽ/מְנַשֶּׁ֨ה שָׁ֤ם מִזְבֵּ֨חַ֙ עַל הַ/יַּרְדֵּ֔ן מִזְבֵּ֥חַ גָּד֖וֹל לְ/מַרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
translation:
  language: te
  text: వారు కనాను దేశములోని యొర్దాను ప్రాంతానికి[a] వచ్చినప్పుడు, రూబేను కుమారులు, గాదు కుమారులు, మనష్షే అర్ధగోత్రంవారు అక్కడ యొర్దాను తీరాన ఒక బలిపీఠాన్ని కట్టారు—చూడటానికి గొప్పగా ఉన్న బలిపీఠం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యొర్దాను జిల్లాలకు’ లేదా ‘యొర్దాను సరిహద్దులకు’.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చూడటానికి పెద్ద బలిపీఠం’; అంటే, కనిపించే తీరులో గమనించదగిన బలిపీఠం.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּלִילוֹת
  choice: ప్రాంతం
  rationale: ఈ నామవాచకం చుట్టుపక్కల ప్రాంతాన్ని లేదా జిల్లాను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రాంతం’ సహజంగా ఉండి, ఇక్కడి భౌగోళిక భావానికి సరిపోతుంది; ‘సరిహద్దులు’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיָּבֹאוּ אֶל
  choice: వచ్చినప్పుడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ముందటి ప్రయాణ సందర్భంతో సహజంగా కలపడానికి కాలసంబంధ భావాన్ని ‘వచ్చినప్పుడు’ అని వ్యక్తం చేశాం.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలో ఉన్న
  rationale: ఏ యొర్దాను ప్రాంతమో నిర్దిష్టంగా తెలిపే హీబ్రూ సంబంధవాక్యాన్ని స్పష్టంగా నిలిపాం.
- source_word: בְנֵי רְאוּבֵן
  choice: రూబేను కుమారులు
  rationale: హీబ్రూలోని కుటుంబ/గోత్ర సంబంధ పదబంధాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: בְנֵי גָד
  choice: గాదు కుమారులు
  rationale: మూలంలోని పుత్రసంబంధ గోత్ర వ్యక్తీకరణను ‘రూబేను కుమారులు’తో సరిసమానంగా నిలిపాం.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రంవారు
  rationale: హీబ్రూ నిర్మాణార్థాన్ని సహజమైన ఆధునిక తెలుగు గోత్రపదజాలంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలి లేదా ఆరాధనకు సంబంధించిన ఈ నిర్మాణానికి ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: עַל הַיַּרְדֵּן
  choice: యొర్దాను దగ్గర
  rationale: ఈ భౌగోళిక సందర్భంలో עַל సమీపాన్ని సూచిస్తుంది; ‘దగ్గర’ అనేది ‘మీద’ అనే తప్పుదారి పట్టించే అక్షరార్థాన్ని నివారిస్తుంది.
- source_word: גָּדוֹל
  choice: ఎంతో పెద్దగా
  rationale: గಾತ್ರం లేదా దృశ్య వైభవం రెండింటికీ అవకాశం ఉన్న గָּדוֹל భావాన్ని తరువాతి לְמַרְאֶה తో కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְמַרְאֶה
  choice: చూడటానికి
  rationale: బలిపీఠం కనిపించే తీరును సూచించే మూలంలోని సంక్షిప్త, కొంత తెరవబడిన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రత్యర్థి ఆరాధనా బలిపీఠమనే సంభావ్య సూచన
  choice: తీర్పు జోడించకుండా, వారు బలిపీఠాన్ని కట్టారని మరియు అది చూడటానికి ఎంతో పెద్దగా ఉందని వర్ణించడం
  alternative: ‘ఆడంబరమైన బలిపీఠం’ లేదా ‘ప్రత్యర్థి బలిపీఠం’ అని అనువదించడం
  rationale: ఈ వచనం నిర్మాణాన్ని, దాని గమనించదగిన రూపాన్ని మాత్రమే నివేదిస్తుంది; అది బలుల కోసం నిర్మించిన ప్రత్యర్థి ఆరాధనా స్థలమని ఇంకా చెప్పదు. కాబట్టి ఉద్దేశాన్ని ముందుగానే నిర్ణయించకుండా కథనంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. గోత్రపేర్లలో మూలంలోని కుటుంబసంబంధ రూపాన్ని సాధ్యమైనంతవరకు నిలిపి, ‘మనష్షే అర్ధగోత్రంవారు’ వద్ద తెలుగు సహజత్వాన్ని కాపాడాం. బలిపీఠం ఉద్దేశంపై ఈ వచనం ఇవ్వని తీర్పును జోడించలేదు.
