  text: Then Joshua blessed them and sent them away[a], and they went to their tents.
translation:
  language: te
  text: అప్పుడు యెహోషువ వారిని ఆశీర్వదించి పంపివేశాడు; వారు తమ గుడారాలకు[a] వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ నివాసాలకు’—అక్షరార్థంగా ‘తమ గుడారాలకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵם
  choice: వారిని ఆశీర్వదించి
  rationale: పియేల్ రూపం ఇక్కడ యెహోషువ బయలుదేరుతున్న వారికి ఆశీర్వాదం ఇవ్వడాన్ని సూచిస్తుంది. ఈ ఎంపిక సంక్షిప్తంగా, సహజంగా ఉండి మూలంలోని చర్యను నిలుపుతుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపాన్ని ఉపయోగించాం.
- source_word: וַיְשַׁלְּחֵם
  choice: పంపివేశాడు
  rationale: ఈ సందర్భంలో שׁלח వారిని బయలుదేరేందుకు పంపడం లేదా సాగనంపడం అనే భావాన్ని ఇస్తుంది. ‘పంపివేశాడు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וַיֵּלְכוּ
  choice: వెళ్లారు
  rationale: הלך సాధారణంగా ‘వెళ్లు’ అనే అర్థం ఇస్తుంది. ‘తిరిగి వెళ్లారు’ అని అనడం మూలంలో స్పష్టంగా లేని భావాన్ని జోడిస్తుంది.
- source_word: אֶל
  choice: -లకు
  rationale: గమ్యస్థానం వైపు కదలికను తెలుగులో దత్త విభక్తితో సహజంగా వ్యక్తం చేశాం.
- source_word: אָהֳלֵיהֶם
  choice: తమ గుడారాలకు
  rationale: నామవాచకానికి అక్షరార్థం ‘వారి గుడారాలు.’ తెలుగులో కర్తతో అన్వయాన్ని సహజంగా చూపేందుకు ‘తమ’ వాడాం; ఇది నివాసాలు లేదా స్వస్థలాలు అనే విస్తృత భావాన్నీ సందర్భంలో కలిగి ఉండవచ్చు.
