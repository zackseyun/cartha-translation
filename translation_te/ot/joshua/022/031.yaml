source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
translation:
  language: te
  text: 'యాజకుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు రూబేను వంశస్థులతో, గాదు వంశస్థులతో, మనష్షే వంశస్థులతో ఇలా అన్నాడు: “మీరు యెహోవాకు విరోధంగా ఈ ద్రోహానికి పాల్పడలేదు కాబట్టి, యెహోవా మన మధ్య ఉన్నాడని ఈ రోజు మాకు తెలిసింది.[a] ఈ విధంగా మీరు ఇశ్రాయేలు ప్రజలను యెహోవా చేతిలోనుండి తప్పించారు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యంలో ‘మీరు యెహోవాకు విరోధంగా ఈ ద్రోహంతో ద్రోహం చేయలేదు’ అనే ఒకే మూలపదపు పునరుక్తి ఉంది; ఇది విశ్వాసభంగాన్ని లేదా ఒడంబడిక ద్రోహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘యెహోవా చేతిలోనుండి’ అనేది యెహోవా శక్తి లేదా తీర్పు నుండి తప్పించబడడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష వాక్య పరిచయంతో వ్యక్తపరుస్తుంది.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు కుమారుడు ఫీనెహాసు
  rationale: మూలంలోని గుర్తింపు సూత్రాన్ని తెలుగులో సహజమైన క్రమంలో నిలుపుతుంది; ‘యాజకుడు’ అనే విశేషణం ఎలియాజరునే సూచించేలా చేస్తుంది.
- source_word: בְּנֵי רְאוּבֵן ... בְּנֵי גָד ... בְּנֵי מְנַשֶּׁה
  choice: రూబేను వంశస్థులు ... గాదు వంశస్థులు ... మనష్షే వంశస్థులు
  rationale: అక్షరార్థమైన ‘కుమారులు’ కంటే సందర్భంలోని గోత్ర సమూహాలను ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַיּוֹם יָדַעְנוּ
  choice: ఈ రోజు మాకు తెలిసింది
  rationale: ఇప్పుడే కలిగిన నిర్ధారణను తెలుగులో సహజంగా వ్యక్తపరుస్తూ, మూలంలోని కాల సూచనను కాపాడుతుంది.
- source_word: בְּתוֹכֵנוּ
  choice: మన మధ్య
  rationale: సమాజంలో దేవుని సన్నిధిని సూచించే సహజమైన తెలుగు ప్రయోగం; ‘మనలో’ అని అనువదిస్తే అంతర్గత నివాసం అనే అవసరం లేని భావం రావచ్చు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో విస్తృతంగా తెలిసిన రూపంలో లిప్యంతరీకరించింది.
- source_word: לֹא מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה
  choice: మీరు యెహోవాకు విరోధంగా ఈ ద్రోహానికి పాల్పడలేదు
  rationale: מעל అనే క్రియ-నామ పునరుక్తి సూచించే ఒడంబడిక విశ్వాసఘాతుకతను స్పష్టంగా తెలియజేస్తుంది; తెలుగులో కృత్రిమ పునరుక్తిని నివారిస్తుంది.
- source_word: אָז
  choice: ఈ విధంగా
  rationale: ఇక్కడ కేవలం కాలక్రమం కంటే ముందున్న చర్య ఫలితాన్ని సూచించడం వల్ల ‘అప్పుడు’ కన్నా ‘ఈ విధంగా’ సందర్భానికి తగినది.
- source_word: הִצַּלְתֶּם
  choice: తప్పించారు
  rationale: ఆపద లేదా తీర్పు నుండి రక్షించి బయటపడేలా చేసిన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מִיַּד יְהוָה
  choice: యెహోవా చేతిలోనుండి
  rationale: దైవశక్తి లేదా తీర్పును సూచించే హీబ్రూ రూపకాన్ని నిలుపుతుంది; దాని భావాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: దైవ సన్నిధి ప్రకటన
  choice: యెహోవా మన మధ్య ఉన్నాడు
  alternative: యెహోవా మన మధ్యలో ఉన్నాడు
  rationale: ఇశ్రాయేలు సమాజంతో యెహోవా సన్నిధిని ప్రకటిస్తుంది; తరువాతి కాలపు ప్రత్యేక సిద్ధాంత భాషను ఇందులో చేర్చదు.
- issue: מעל పదబంధంలోని ద్రోహ భావం
  choice: యెహోవాకు విరోధంగా ఈ ద్రోహానికి పాల్పడలేదు
  alternative: యెహోవాకు విరోధంగా ఈ అపరాధం చేయలేదు
  rationale: ఇది సాధారణ తప్పు మాత్రమే కాక యెహోవాపట్ల విశ్వాసభంగం లేదా ఒడంబడిక ద్రోహం అనే బరువైన భావాన్ని కలిగి ఉంది.
- issue: యెహోవా చేతిలోనుండి తప్పించడం
  choice: మూలంలోని రూపకాన్ని నిలుపడం
  alternative: యెహోవా తీర్పు నుండి తప్పించడం
  rationale: వాక్యం సంభావ్య దైవ తీర్పును సూచించినా దానిని నేరుగా ‘తీర్పు’గా మాత్రమే పరిమితం చేయకుండా, మూలంలోని శక్తివంతమైన మరియు కొంత విస్తృతమైన రూపకాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గోత్ర సమూహాల సందర్భంలో ‘కుమారులు’కు బదులుగా ‘వంశస్థులు’ ఎంచుకోబడింది. దైవనామం ‘యెహోవా’గా నిలుపబడింది; హీబ్రూ నుడికారానికి సంబంధించిన అస్పష్టతను ప్రధాన పాఠ్యంలో కాపాడి పాదటిప్పణిలో వివరించబడింది.
