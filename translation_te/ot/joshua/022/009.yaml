  text: וַ/יָּשֻׁ֣בוּ וַ/יֵּלְכ֡וּ בְּנֵי רְאוּבֵ֨ן וּ/בְנֵי גָ֜ד וַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/שִּׁלֹ֖ה אֲשֶׁ֣ר בְּ/אֶֽרֶץ כְּנָ֑עַן לָ/לֶ֜כֶת אֶל אֶ֣רֶץ הַ/גִּלְעָ֗ד אֶל אֶ֤רֶץ אֲחֻזָּתָ/ם֙ אֲשֶׁ֣ר נֹֽאחֲזוּ בָ֔/הּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
translation:
  language: te
  text: రూబేను వంశస్థులు, గాదు వంశస్థులు, మనష్షే అర్ధగోత్రస్థులు ఇశ్రాయేలీయులనుండి, కనాను దేశంలోని షిలోహునుండి తిరిగి బయలుదేరి, గిలాదు దేశానికి, యాహ్వే మోషే ద్వారా ఇచ్చిన ఆజ్ఞ ప్రకారం వారికి స్వాధీనంగా లభించిన తమ స్వాధీన భూమికి[a] వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే మోషే ద్వారా ఇచ్చిన ఆజ్ఞ ప్రకారం వారు స్వాధీనం చేసుకున్న తమ స్వాధీన భూమికి.” ఇక్కడి హీబ్రూ క్రియ వారికి భూమి స్వాధీనంగా లభించడం లేదా వారు దానిని స్వాధీనం చేసుకోవడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ
  choice: తిరిగి బయలుదేరి ... వెళ్లారు
  rationale: రెండు హీబ్రూ క్రియలైన ‘తిరిగారు’, ‘వెళ్లారు’ అనే క్రమాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; అనవసర పునరుక్తిని తగ్గిస్తుంది.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: రూబేను వంశస్థులు, గాదు వంశస్థులు, మనష్షే అర్ధగోత్రం వారు
  rationale: ‘కుమారులు’ అనే అక్షరార్థం కంటే ఇక్కడ గోత్రీయ సమూహాలను సూచించే ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల దగ్గర నుంచి
  rationale: మిగతా ఇశ్రాయేలు సమాజం నుంచి వారు వేరై బయలుదేరిన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: కనాను దేశంలోని షిలోహులో
  rationale: హీబ్రూ భౌగోళిక సంబంధాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు నిర్మాణంలో ఇస్తుంది.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: గిలాదు దేశానికి
  rationale: אֶרֶץ అనే ప్రాదేశిక పదాన్ని ‘దేశం’గా నిలుపుతుంది.
- source_word: אֶל אֶרֶץ אֲחֻזָּתָם
  choice: తమ స్వాస్థ్య దేశానికి
  rationale: אֲחֻזָּהలోని చట్టబద్ధమైన భూస్వామ్య లేదా వారసత్వ స్వాధీన భావాన్ని ‘స్వాస్థ్య’ తెలియజేస్తుంది.
- source_word: אֲשֶׁר נֹאחֲזוּ בָהּ
  choice: వారు స్వాధీనం చేసుకున్న
  rationale: భూమిని పొందడం లేదా దానిపై స్థిరమైన హక్కు కలిగి ఉండడం అనే సందర్భార్థాన్ని ఇస్తుంది; నిఫల్ రూపంలోని స్వీకరణ/స్థాపన భావానికి ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: עַל פִּי יְהוָה בְּיַד מֹשֶׁה
  choice: యాహ్వే మోషే ద్వారా ఇచ్చిన ఆజ్ఞ ప్రకారం
  rationale: עַל־פִּי అనే ‘ఆజ్ఞ ప్రకారం’ అనే నుడికారాన్ని, בְּיַד అనే మధ్యవర్తిత్వ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- issue: భూమి స్వాధీనానికి దైవాజ్ఞతో ఉన్న సంబంధం
  choice: యాహ్వే మోషే ద్వారా ఇచ్చిన ఆజ్ఞ ప్రకారం వారు స్వాధీనం చేసుకున్న
  alternative: యాహ్వే మోషే ద్వారా ఆజ్ఞాపించిన ప్రకారం వారికి స్వాధీనంగా లభించిన
  rationale: దైవాజ్ఞ, మోషే మధ్యవర్తిత్వం రెండింటినీ నిలుపుతూ, భూమిని స్వాధీనం చేసుకోవడం అనే ప్రధాన పఠనాన్ని ఇస్తుంది; క్రియలోని స్వీకరణ లేదా స్థిరపరచబడటం అనే భావాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ వాక్యంలోని భౌగోళిక పునరుక్తిని డాష్‌ల మధ్య వివరణాత్మక భాగంగా ఉంచి పఠన సౌలభ్యాన్ని పెంచింది. పాదసూచిక గుర్తు సంబంధిత ‘స్వాస్థ్య దేశం’ వాక్యభాగం వద్ద ఉంచబడింది.
