  rationale: The revision retains the source’s single forceful repudiation and its sequence of rejected actions, removes the unsupported expansion ‘మరే,’ and explicitly renders מִלְּבַד as ‘యెహోవా ... బలిపీఠానికి అదనంగా.’ It preserves the divine name and the spatial reference to his tabernacle without importing a broader theological prohibition.
