source:
  edition: WLC
  text: חָלִילָ/ה֩ לָּ֨/נוּ מִמֶּ֜/נּוּ לִ/מְרֹ֣ד בַּֽ/יהוָ֗ה וְ/לָ/שׁ֤וּב הַ/יּוֹם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה לִ/בְנ֣וֹת מִזְבֵּ֔חַ לְ/עֹלָ֖ה לְ/מִנְחָ֣ה וּ/לְ/זָ֑בַח מִ/לְּ/בַ֗ד מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ אֲשֶׁ֖ר לִ/פְנֵ֥י מִשְׁכָּנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
translation:
  language: te
  text: “యెహోవాకు వ్యతిరేకంగా తిరుగుబాటు చేయడం, ఈ రోజే యెహోవాను అనుసరించడం మానివేయడం[a], యెహోవా మన దేవుని నివాస గుడారం ఎదుట ఉన్న యెహోవా బలిపీఠానికి అదనంగా దహనబలి కోసమో ధాన్యార్పణ కోసమో బలి కోసమో బలిపీఠాన్ని కట్టడం మాకు ఎంతమాత్రమూ తగదు!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ ప్రయోగం అక్షరార్థంగా, “యెహోవా వెనుకనుంచి వెనుదిరగడం” అని ఉంటుంది; అంటే ఆయనను అనుసరించడం మానివేయడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  choice: మాకు ఎంతమాత్రమూ తగదు … మాకు అసలు తగదు
  rationale: బలమైన తిరస్కారాన్ని తెలిపే హీబ్రూ జాతీయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. వాక్యం పొడవుగా ఉన్నందున చివర్లో భావాన్ని పునరుద్ఘాటించడం తెలుగులో స్పష్టతను, మూలంలోని తీవ్రతను నిలుపుతుంది.
- source_word: לִמְרֹד בַּיהוָה
  choice: యెహోవాపై తిరుగుబాటు చేయడం
  rationale: מָרַד అనే క్రియ ఇక్కడ దేవునికి వ్యతిరేకమైన ఒడంబడిక అవిధేయతను సూచిస్తుంది; ‘తిరుగుబాటు’ ఆ బలాన్ని నిలుపుతుంది.
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: యెహోవాను అనుసరించడం నుంచి ఈ రోజే వెనుదిరగడం
  rationale: ‘యెహోవా వెనుకనుంచి తిరగడం’ అనే హీబ్రూ జాతీయంలోని అనుసరణ భావాన్ని సహజంగా తెలియజేస్తుంది; הַיּוֹם కు ‘ఈ రోజే’ అని ఇవ్వడం తక్షణత్వాన్ని చూపుతుంది.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: వేరొక బలిపీఠాన్ని కట్టడం
  rationale: మూలంలోని מִלְּבַד తో కలిసి, అధికారిక బలిపీఠానికి అదనంగా మరో బలిపీఠం కట్టడమే తిరస్కరించబడుతున్నదని స్పష్టం చేస్తుంది.
- source_word: לְעֹלָה
  choice: దహనబలి
  rationale: עֹלָה అనే సాంకేతిక బలి పదానికి సాధారణంగా అర్థమయ్యే సముచిత తెలుగు పదం.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణ
  rationale: బలుల సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; సాధారణ ‘అర్పణ’ కంటే ఇది నిర్దిష్టమైనది.
- source_word: וּלְזָבַח
  choice: లేదా మరే బలి
  rationale: זֶבַח ఇక్కడ విస్తృతమైన బలి పదం. ‘మరే’ అనేది ముందున్న రెండు ప్రత్యేక అర్పణలతో జాబితా సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది, ప్రత్యేక బలి రకాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: యెహోవా మన దేవుని … బలిపీఠం
  rationale: దైవనామాన్నీ ‘మన దేవుడు’ అనే ఒడంబడిక ఒప్పుకోలునూ నేరుగా నిలుపుతుంది.
- source_word: אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  choice: ఆయన నివాస గుడారం ఎదుట ఉన్న
  rationale: מִשְׁכָּן యొక్క ‘నివాసం/గుడారం’ భావాన్నీ, మూడవ పురుష ఏకవచన ప్రత్యయాన్నీ, ‘ఎదుట’ అనే స్థల సంబంధాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఒడంబడిక దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ప్రతిలిపి చేశాం.
- issue: వేరొక బలిపీఠం కట్టడంలోని ఉద్దేశం
  choice: బలులు అర్పించడానికి వేరొక బలిపీఠం కట్టడం తిరుగుబాటుగా తిరస్కరించబడింది
  alternative: ఏ రూపంలోనైనా మరో బలిపీఠం నిర్మించడం నిషేధించబడింది
  rationale: ఈ వాక్యం ప్రత్యేకంగా దహనబలి, ధాన్యార్పణ, బలి అర్పించే ఉద్దేశంతో నిర్మించే బలిపీఠాన్ని తిరస్కరిస్తుంది. తరువాతి సందర్భానికి అతీతంగా సంపూర్ణ నిషేధాన్ని ఇందులోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష ప్రసంగ శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ వాక్యంలోని బలమైన నిరాకరణ తెలుగులో స్పష్టంగా వినిపించేందుకు ఆ భావాన్ని ఆరంభంలోనూ ముగింపులోనూ వ్యక్తం చేశాం. దైవనామానికి ‘యెహోవా’, משכן కు సందర్భోచితంగా ‘నివాస గుడారం’ వాడాం.
