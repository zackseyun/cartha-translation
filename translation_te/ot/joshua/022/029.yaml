- from: “యెహోవాపై తిరుగుబాటు చేయడం, యెహోవాను అనుసరించడం నుంచి ఈ రోజే వెనుదిరగడం[a] మాకు ఎంతమాత్రమూ తగదు! యెహోవా మన దేవుని నివాస గుడారం ఎదుట ఉన్న బలిపీఠం కాకుండా, దహనబలి, ధాన్యార్పణ లేదా మరే బలి అర్పించడానికి వేరొక బలిపీఠాన్ని కట్టడం మాకు అసలు తగదు!”
