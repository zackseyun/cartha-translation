    rationale: The Hebrew בַּעֲדַת is most directly ‘in/among the congregation of Yahweh.’ Although ‘మీద’ can convey a plague’s impact, ‘సమాజంలో’ more closely follows the source wording.
  - severity: low
    issue: The Hebrew’s one extended rhetorical question is divided into two Telugu question units.
    rationale: The current punctuation is understandable, but a continuous rhetorical-question construction better retains the source’s syntactic and rebuking flow without adding interpretation.
