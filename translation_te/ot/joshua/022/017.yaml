source:
  edition: WLC
  text: הַ/מְעַט לָ֨/נוּ֙ אֶת עֲוֺ֣ן פְּע֔וֹר אֲשֶׁ֤ר לֹֽא הִטַּהַ֨רְנוּ֙ מִמֶּ֔/נּוּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יְהִ֥י הַ/נֶּ֖גֶף בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
translation:
  language: te
  text: “పెయోరు[b] దోషం[a] మనకు చాలలేదా—దాని నుండి నేటి వరకూ మనల్ని మనం శుద్ధి చేసుకోలేదు, యహ్వే సమాజంలో తెగులు వచ్చింది కదా?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దోషం’ అని అనువదించిన హెబ్రీ పదం పాపం, అపరాధభారం, లేదా దాని పరిణామం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ మూలంలో ఇక్కడ ‘పెయోరు’ అని మాత్రమే ఉంది; సంబంధిత వాక్యాల్లో కనిపించే పూర్తి పేరు ‘బయల్పెయోరు.’
    reason: cross_reference
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  choice: మనకు చాలలేదా?
  rationale: ఇది గద్దింపు భావంగల అలంకారిక ప్రశ్న. ‘మనకు తక్కువైందా?’ అనే అక్షరార్థ రూపం తెలుగులో అసహజంగా ఉండటంతో, అదే ప్రశ్నార్థక బలాన్ని సహజంగా వ్యక్తం చేసే ‘మనకు చాలలేదా?’ ఎంచుకోబడింది.
- source_word: עֲוֺן
  choice: దోషం
  rationale: ఈ పదం పాపకార్యాన్ని, దానివల్ల కలిగిన అపరాధస్థితిని, కొన్నిసార్లు దాని పరిణామాన్ని కూడా సూచించగలదు. ‘దోషం’ ఈ సందర్భంలోని నైతిక అపరాధం–అపరాధభారం మధ్యనున్న భావవిస్తృతిని కొంతవరకు నిలుపుతుంది.
- source_word: פְּעוֹר
  choice: పెయోరు
  rationale: మూలపాఠంలో ‘బయల్పెయోరు’ కాకుండా ‘పెయోరు’ మాత్రమే ఉంది; అందువల్ల పూర్తి పేరును చేర్చకుండా మూలరూపమే లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  choice: దాని నుండి ... మనల్ని మనం శుద్ధి చేసుకోలేదు
  rationale: హిత్పయేల్ రూపంలోని ఆత్మనేపద భావాన్ని ‘మనల్ని మనం ... చేసుకోలేదు’ స్పష్టంగా నిలుపుతుంది. ‘దాని నుండి’ దోషంతో సంబంధమైన అపవిత్రత నుంచి విడిపడలేదనే భావాన్ని అతిగా విప్పకుండా అందిస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటి వరకూ
  rationale: మాట్లాడుతున్న వారి వర్తమానం వరకూ ఆ స్థితి కొనసాగుతోందనే హెబ్రీయ ఇడియమును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיְהִי הַנֶּגֶף
  choice: తెగులు వచ్చింది
  rationale: וַיְהִי ఇక్కడ చారిత్రక పరిణామాన్ని పరిచయం చేస్తుంది. మూలంలో లేని విరోధార్థక ‘అయినా’ను చేర్చకుండా సరళంగా అనువదించబడింది.
- source_word: נֶּגֶף
  choice: తెగులు
  rationale: ఈ తీర్పు సందర్భంలో పదం సమాజాన్ని తాకిన ప్రాణాంతక వ్యాధి లేదా విపత్తును సూచిస్తుంది; ‘తెగులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: בַּעֲדַת יְהוָה
  choice: యహ్వే సమాజం మీద
  rationale: עֵדָה నిబంధన సమాజాన్ని సూచిస్తుంది; ‘సమాజం’ ఆధునిక తెలుగులో సహజం. בְּ ఇక్కడ తెగులు ఆ సమాజాన్ని తాకిందనే భావంలో ‘మీద’గా ఇవ్వబడింది. יהוה వ్యక్తిగత దైవనామంగా ‘యహ్వే’ అని లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో నాలుగు అక్షరాల వ్యక్తిగత దైవనామం నేరుగా ఉంది. బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడే ఉచ్చారణకు దగ్గరగా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: పెయోరు దోషం నుండి ఇంకా శుద్ధి పొందలేదనే వాక్యం
  choice: సమాజం తనను తాను ఇంకా శుద్ధి చేసుకోలేదనే మూలపాఠపు ఉద్రిక్తతను యథాతథంగా ఉంచడం
  alternative: దోషపు ప్రభావాలు మాత్రమే ఇంకా మిగిలి ఉన్నాయని వివరణాత్మకంగా అనువదించడం
  rationale: వాక్యం అపరాధం, అపవిత్రత, కొనసాగుతున్న సామూహిక బాధ్యత మధ్య సంబంధాన్ని పూర్తిగా విడదీయదు. అందువల్ల ఒక నిర్దిష్ట సిద్ధాంత వివరణను చేర్చకుండా మూలంలోని విస్తృత భావం నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన గద్దింపు స్వరాన్ని సాధారణ పాఠకులకు సహజంగా వినిపించేలా అనువదించబడింది. చివరి ‘కదా!’ మొత్తం ప్రశ్నలోని అలంకారిక బలాన్ని తెలుగులో నిలుపుతుంది; మూలంలో లేని ‘అయినా’ వంటి వివరణాత్మక అనుసంధానం చేర్చబడలేదు.
