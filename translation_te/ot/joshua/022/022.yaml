id: JOS.22.22
reference: Joshua 22:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
translation:
  language: te
  text: 'శక్తిమంతుడు[a], దేవుడు, యాహ్వే! శక్తిమంతుడు, దేవుడు, యాహ్వే! ఆయనకు తెలుసు; ఇశ్రాయేలు తానే తెలుసుకుంటుంది: మేము తిరుగుబాటులో గానీ, యాహ్వే పట్ల నమ్మకద్రోహంలో[b] గానీ ఉంటే, ఈ రోజున మమ్మల్ని రక్షించవద్దు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘ఏల్, ఎలోహీమ్, యాహ్వే’ అనే దైవపిలుపు పూర్తిగా రెండుసార్లు వస్తుంది. ఇది గంభీరమైన, ప్రమాణసదృశమైన ఉద్ఘాటన.
    reason: cultural_note
  - marker: b
    text: ‘నమ్మకద్రోహం’కు ‘విశ్వాసభంగం’ లేదా ‘అవిశ్వాసం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: శక్తిమంతుడు, దేవుడు, యాహ్వే
  rationale: אֵל అనే ఏకవచన బిరుదు బలాన్ని ‘శక్తిమంతుడు’గా నిలిపి, אֱלֹהִיםను ‘దేవుడు’గా, దేవుని నామమైన יְהוָהను ‘యాహ్వే’గా వేర్వేరుగా ప్రతిబింబిస్తుంది. మూలంలోని పూర్తి పిలుపు రెండుసార్లు పునరుక్తమైంది.
- source_word: הוּא יֹדֵעַ
  choice: ఆయనకు తెలుసు
  rationale: ప్రస్తుతం దేవునికి విషయం తెలిసి ఉందనే సరళమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  choice: ఇశ్రాయేలు కూడా తెలుసుకుంటుంది
  rationale: అసంపూర్ణ క్రియకు సందర్భానుగుణమైన భవిష్యదర్థాన్ని ఇస్తూ, הוּא యొక్క ఉద్ఘాటనను ‘కూడా’ ద్వారా సహజంగా సూచిస్తుంది.
- source_word: אִם בְּמֶרֶד
  choice: మేము తిరుగుబాటుతో ... ఇలా చేసి ఉంటే
  rationale: మూలంలోని సంక్షిప్త షరతును సందర్భంలోని సమూహ చర్యతో అనుసంధానించి, מֶרֶד యొక్క ‘తిరుగుబాటు’ భావాన్ని నిలుపుతుంది.
- source_word: וְאִם בְּמַעַל בַּיהוָה
  choice: యాహ్వేకు నమ్మకద్రోహంతో
  rationale: מַעַל‌లోని విశ్వాసభంగం లేదా బంధనిబద్ధతను ఉల్లంఘించే భావాన్ని ‘నమ్మకద్రోహం’ స్పష్టంగా తెలియజేస్తుంది; בַּיהוָהను సంబంధపరంగా ‘యాహ్వేకు’ అని అందిస్తుంది.
- source_word: אַל תּוֹשִׁיעֵנוּ
  choice: మమ్మల్ని రక్షించవద్దు
  rationale: దేవునికి ఉద్దేశించిన ప్రతికూల జస్సివ్ స్వరాన్ని నేరుగా, గంభీరంగా అందిస్తుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజున
  rationale: మూలంలోని నిర్దిష్టతను, గంభీర స్వరాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది.
- issue: దైవ బిరుదుల పునరుక్తి
  choice: పూర్తి క్రమాన్ని రెండుసార్లు ఉంచడం
  alternative: ఒకే సంయుక్త బిరుదుగా సంక్షిప్తం చేయడం
  rationale: ఈ పునరుక్తి ప్రమాణసదృశమైన గంభీర పిలుపును కలిగిస్తుంది; దానిని యథాతథంగా ఉంచడం వాక్యపు వాక్చాతుర్య బలాన్ని కాపాడుతుంది.
- issue: אַל תּוֹשִׁיעֵנוּ యొక్క వక్త మరియు ఉద్దేశం
  choice: దేవునికి నేరుగా ‘మమ్మల్ని రక్షించవద్దు’ అనే విజ్ఞప్తి
  alternative: ఇశ్రాయేలుకు ‘మమ్మల్ని విడిచిపెట్టవద్దు’ అనే మాట
  rationale: క్రియ ఏకవచన పురుషరూపంలో ఉండటం, ముందున్న దైవపిలుపు కలిపి చూస్తే దేవుడే సంబోధితుడు; అయినా కారణాన్ని మించి వ్యాఖ్యానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన సామూహిక ప్రమాణ స్వరం ఉంచబడింది. మూలంలోని సంక్షిప్త షరతు తెలుగులో సహజంగా ఉండేందుకు ‘మేము ... ఇలా చేసి ఉంటే’ అని స్వల్పంగా విప్పబడింది; దైవపిలుపు పునరుక్తి మాత్రం పూర్తిగా నిలుపబడింది.
