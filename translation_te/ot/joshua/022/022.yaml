    rationale: హీబ్రూలోని హוּא ఇశ్రాయేలు కూడా మరొకరితో పాటు తెలుసుకుంటుందనే అదన భావాన్ని కాదు, ‘ఇశ్రాయేలు తానే/స్వయంగా’ అనే ఉద్ఘాటనను ఇస్తుంది.
