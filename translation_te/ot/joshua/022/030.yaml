source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע פִּֽינְחָ֣ס הַ/כֹּהֵ֗ן וּ/נְשִׂיאֵ֨י הָ/עֵדָ֜ה וְ/רָאשֵׁ֨י אַלְפֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר אִתּ֔/וֹ אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֧ר דִּבְּר֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד וּ/בְנֵ֣י מְנַשֶּׁ֑ה וַ/יִּיטַ֖ב בְּ/עֵינֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/030.yaml
  text: When Phinehas the priest[a], the leaders of the congregation, and the heads of the thousands of Israel who were with him heard the words that the sons of Reuben, the sons of Gad, and the sons of Manasseh spoke[b], it was good in their eyes.
translation:
  language: te
  text: యాజకుడైన ఫీనెహాసు, అతనితో ఉన్న సమాజ నాయకులు మరియు ఇశ్రాయేలు వేల విభాగాల అధిపతులు[a]—రూబేను కుమారులు, గాదు కుమారులు, మనష్షే కుమారులు చెప్పిన మాటలు విన్నప్పుడు, అది వారి దృష్టికి మంచిగా తోచింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, “ఇశ్రాయేలు వేల విభాగాల అధిపతులు.” ఇక్కడ “వేలు” అనేది కచ్చితంగా వెయ్యిమందితో కూడిన సంఖ్యా విభాగం కాకుండా, వంశ లేదా గోత్ర ఉపవిభాగాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అది వారికి నచ్చింది”; “అది వారికి మంచిదిగా అనిపించింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నప్పుడు
  rationale: שׁמע యొక్క సాధారణ కథనార్థమైన ‘విన్నాడు/విన్నప్పుడు’ను వ్యక్తపరుస్తుంది; మూలంలో తప్పనిసరిగా లేని ప్రత్యేక శ్రద్ధాభావాన్ని చేర్చదు.
- source_word: פִּינְחָס הַכֹּהֵן
  choice: యాజకుడైన ఫీనెహాసు
  rationale: వ్యక్తిపేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చి, הַכֹּהֵן అనే నిర్దిష్ట బిరుదును సహజమైన తెలుగు సమాస నిర్మాణంలో నిలిపింది.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: సమాజ నాయకులు
  rationale: נְשִׂיאִים ఇక్కడ గుర్తింపు పొందిన నాయకులను సూచిస్తుంది; עֵדָה ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది. ఈ రూపం ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు వంశ విభాగాల అధిపతులు[a]
  rationale: పదశః ‘ఇశ్రాయేలు వేల విభాగాల అధిపతులు.’ אֶלֶף ఇక్కడ కచ్చితంగా వెయ్యిమంది అనే సంఖ్యకన్నా పరిపాలనా లేదా వంశీయ ఉపవిభాగాన్ని సూచించే అవకాశం ఉన్నందున, ప్రధాన పాఠ్యంలో అర్థాన్ని స్పష్టంగా ఇచ్చి పదశః రూపాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న
  rationale: ఫీనెహాసుతో పాటు వచ్చిన నాయకులు, అధిపతులను సూచించే సంబంధవాక్యాన్ని సంక్షిప్తంగా, సహజంగా నిలిపింది.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבְּרוּ
  choice: చెప్పిన మాటలు
  rationale: דְּבָרִים మరియు דִּבְּרוּ మధ్యనున్న పదసంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘మాటలు మాట్లాడారు’ అనే అసహజ పునరుక్తిని నివారిస్తుంది.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וּבְנֵי מְנַשֶּׁה
  choice: రూబేను కుమారులు, గాదు కుమారులు, మనష్షే కుమారులు
  rationale: మూలంలోని మూడుసార్ల ‘కుమారులు’ నిర్మాణాన్ని నిలిపి, ఆయా గోత్రాల గుర్తింపును స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: అది వారి దృష్టికి మంచిగా తోచింది[b]
  rationale: ‘వారి కళ్లలో మంచిగా ఉంది’ అనే హీబ్రూ నుడికారపు రూపకాన్ని ‘వారి దృష్టికి’ ద్వారా నిలుపుతూ, తెలుగులో అర్థమయ్యే విధంగా ‘తోచింది’ అని ఇచ్చింది.
