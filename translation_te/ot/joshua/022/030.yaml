  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గోత్రనామాల పునరుక్తిని మూల పాఠ్య లయకు అనుగుణంగా నిలిపాం; హీబ్రూ నుడికారాన్ని పూర్తిగా చెరపకుండా తెలుగులో సహజంగా అర్థమయ్యే రూపం ఎంచుకున్నాం.
