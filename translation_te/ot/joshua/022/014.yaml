  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. గోత్ర-వంశ పరిపాలనా పదజాలాన్ని స్పష్టంగా ఉంచి, לְאַלְפֵי יִשְׂרָאֵל లోని నిజమైన అర్థసందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా కాపాడాం.
