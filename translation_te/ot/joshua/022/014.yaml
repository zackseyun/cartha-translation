source:
  edition: WLC
  text: וַ/עֲשָׂרָ֤ה נְשִׂאִים֙ עִמּ֔/וֹ נָשִׂ֨יא אֶחָ֜ד נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אָ֔ב לְ/כֹ֖ל מַטּ֣וֹת יִשְׂרָאֵ֑ל וְ/אִ֨ישׁ רֹ֧אשׁ בֵּית אֲבוֹתָ֛/ם הֵ֖מָּה לְ/אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/014.yaml
  text: and with him ten leaders[a], one leader for each ancestral house from all the tribes of Israel; and each of them was the head of his ancestral house among the thousands of Israel.
translation:
  language: te
  text: అతనితోపాటు పది మంది నాయకులు కూడా ఉన్నారు—ఇశ్రాయేలు గోత్రాలన్నిటికీ, ప్రతి పితృవంశానికి ఒక్కో నాయకుడు. వారిలో ప్రతి ఒక్కరూ ఇశ్రాయేలు సహస్ర విభాగాల్లో[a] తమ తమ పితృవంశానికి పెద్ద.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఇశ్రాయేలు సహస్రాలు’ అని ఉంది. ఇది అక్షరార్థంగా ‘వేలలు’ అని అర్థం కావచ్చు; లేదా ఇశ్రాయేలులోని వంశపరమైన లేదా సైనిక విభాగాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  choice: నాయకులు / నాయకుడు
  rationale: ఈ గోత్రపరమైన పరిపాలనా సందర్భంలో అధికారిక ప్రతినిధి లేదా అధిపతి అనే భావాన్ని ఆధునిక, సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עִמּוֹ
  choice: అతనితోపాటు
  rationale: మునుపటి వచనంలోని ఫీనెహాసును సూచించే సర్వనామంతో కూడిన పూర్వప్రత్యయానికి సహజమైన తెలుగు రూపం.
- source_word: נָשִׂיא אֶחָד נָשִׂיא אֶחָד
  choice: ఒక్కో ... ఒక్కో నాయకుడు
  rationale: హీబ్రూ పునరుక్తి విభజనార్థకమైనది; ప్రతి సంబంధిత గోత్రం నుండి ఒక ప్రతినిధి అనే భావాన్ని తెలుగు ‘ఒక్కో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְבֵית אָב
  choice: పితృవంశానికి
  rationale: ‘తండ్రి ఇల్లు’ అనే పదశః రూపం కంటే, వంశాధారిత సామాజిక-పరిపాలనా విభాగాన్ని ‘పితృవంశం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటి నుండి
  rationale: ఈ నాయకులు ఇశ్రాయేలు గోత్రాలకు ప్రాతినిధ్యం వహిస్తూ వాటి నుండి ఎంపికయ్యారనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וְאִישׁ
  choice: వారిలో ప్రతి ఒక్కరూ
  rationale: ఇక్కడ אִישׁ విభజనార్థకంగా పది మంది ప్రతినిధుల్లో ఒక్కొక్కరిని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ఈ రూపం స్పష్టంగా ఉంటుంది.
- source_word: רֹאשׁ בֵּית אֲבוֹתָם
  choice: తమ పితృవంశానికి అధిపతి
  rationale: רֹאשׁ యొక్క నాయకత్వ భావాన్నీ, בֵית אבות యొక్క వంశ నిర్మాణాన్నీ కాపాడుతుంది.
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సహస్ర వర్గాల్లో
  rationale: אֶלֶף యొక్క ‘వెయ్యి’ అనే రూపాన్ని పూర్తిగా చెరపకుండా, ఇక్కడ అది సామాజిక లేదా సైనిక విభాగాన్ని సూచించవచ్చనే భావాన్ని ‘వర్గాలు’ ద్వారా తెలియజేస్తుంది; అస్పష్టతను పాదటిప్పణిలో నిలుపుతుంది.
