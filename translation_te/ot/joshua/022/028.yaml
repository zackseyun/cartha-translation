source:
  edition: WLC
  text: וַ/נֹּ֕אמֶר וְ/הָיָ֗ה כִּֽי יֹאמְר֥וּ אֵלֵ֛י/נוּ וְ/אֶל דֹּרֹתֵ֖י/נוּ מָחָ֑ר וְ/אָמַ֡רְנוּ רְא֣וּ אֶת תַּבְנִית֩ מִזְבַּ֨ח יְהוָ֜ה אֲשֶׁר עָשׂ֣וּ אֲבוֹתֵ֗י/נוּ לֹ֤א לְ/עוֹלָה֙ וְ/לֹ֣א לְ/זֶ֔בַח כִּי עֵ֣ד ה֔וּא בֵּינֵ֖י/נוּ וּ/בֵינֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
translation:
  language: te
  text: 'అప్పుడు మేము ఇలా చెప్పుకున్నాం: “రాబోయే కాలంలో వారు మాతో గానీ మా తరాలతో గానీ ఇలా చెబితే, అప్పుడు మేము ఇలా చెబుతాం: ‘మా పితరులు చేసిన యాహ్వే బలిపీఠపు నమూనాను[a] చూడండి. దీన్ని దహనబలి కోసం కాదు, బలి కోసం కూడా కాదు చేశారు; ఎందుకంటే ఇది మాకూ మీకూ మధ్య సాక్షి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రతిరూపం,’ ‘ఆకృతి,’ ‘మాదిరి.’ హీబ్రూ పదం ఒక వస్తువు యొక్క రూపాన్ని లేదా నమూనాను సూచిస్తుంది. సందర్భంలో ఇది బలులు అర్పించడానికి చేసిన బలిపీఠం కాదు, సాక్షిగా నిలిచే ప్రతిరూపం అని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: అందుకే మేము ఇలా అనుకున్నాం
  rationale: వావ్-క్రమరూపం కథనాన్ని కొనసాగిస్తూనే సందర్భంలోని వివరణాత్మక ఫలితాన్ని సూచిస్తుంది. యోచించి నిర్ణయించుకున్న భావానికి ‘అనుకున్నాం’ సహజమైన తెలుగు.
- source_word: וְהָיָה כִּי
  choice: …ఇలా అంటే
  rationale: భవిష్యత్తులో సంభవించగల పరిస్థితిని తెలుగులో సహజమైన షరతు నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: יֹאמְרוּ אֵלֵינוּ וְאֶל דֹּרֹתֵינוּ מָחָר
  choice: రాబోయే కాలంలో వారు మాతో గానీ మా తరాలవారితో గానీ ఇలా అంటే
  rationale: מָחָר ఇక్కడ అక్షరార్థంగా ‘రేపు’ కాదు, భవిష్యత్తును సూచిస్తుంది. דֹּרֹתֵינוּ లోని ‘మా తరాలు’ అనే భావాన్ని నిలుపుతూ తెలుగులో ‘మా తరాలవారు’ అని ఇచ్చాం.
- source_word: וְאָמַרְנוּ
  choice: అప్పుడు మేము ఇలా చెబుతాం
  rationale: షరతుకు వచ్చే భవిష్యత్ ప్రతిస్పందనను ‘అప్పుడు’ స్పష్టంగా సూచిస్తుంది.
- source_word: רְאוּ
  choice: చూడండి
  rationale: దృష్టి పెట్టమని కోరే బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תַּבְנִית
  choice: నమూనా
  rationale: రూపం, నమూనా, ప్రతిరూపం అనే అర్థపరిధిని కలిగి ఉంది. ఇది బలులు అర్పించే అధికారిక బలిపీఠం కాక, దానికి సాక్ష్యప్రాయమైన ప్రతిరూపమని సందర్భం సూచించినా, మూలపదానికి మించిన వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: מִזְבַּח יְהוָה
  choice: యాహ్వే బలిపీఠం
  rationale: సంబంధ నిర్మాణాన్ని తెలుగులో సహజంగా ఇచ్చి, దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר עָשׂוּ אֲבוֹתֵינוּ
  choice: దీన్ని మా పితరులు … చేశారు
  rationale: ఆண்பులింగ బంధుత్వపదమైన אָבוֹתֵינוּ ను తటస్థీకరించకుండా ‘మా పితరులు’గా నిలిపాం.
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  choice: దహనబలి కోసం కాదు, బలి కోసం కాదు
  rationale: మూలంలోని לֹא…וְלֹא ద్వంద్వ నిరాకరణను పునరుక్తితో నిలిపి, עֹלָה ను ప్రత్యేకంగా ‘దహనబలి’ అని, זֶבַח ను విస్తృతంగా ‘బలి’ అని అనువదించాం.
- source_word: כִּי עֵד הוּא
  choice: ఇది … సాక్షి
  rationale: ముందటి నిరాకరణలకు విరుద్ధంగా అసలు ఉద్దేశాన్ని తెలిపే నామవాక్యాన్ని నిలిపాం; ‘ఇది’ మూలంలోని הוּא కు అనుగుణంగా ఉంది.
- source_word: בֵּינֵינוּ וּבֵינֵיכֶם
  choice: మాకూ మీకూ మధ్య
  rationale: రెండు సమూహాల మధ్య సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమైన చతురక్షర నామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా సాధారణ ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- issue: అబ్బాయిలింగ పూర్వీకుల పదం אֲבוֹתֵינוּ
  choice: మా పితరులు
  alternative: మా పూర్వీకులు
  rationale: మూలంలోని పురుషలింగ బంధుత్వరూపాన్ని తటస్థీకరించకుండా నిలుపుతుంది; ‘పితరులు’ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే బైబిలీయ తెలుగు.
- issue: బలిపీఠపు ఉద్దేశం
  choice: బలుల కోసం కాదు; మాకూ మీకూ మధ్య సాక్షి
  alternative: సాక్షిగా ఉండటానికే చేసిన ప్రతిరూపం
  rationale: మూలపాఠ్యంలోని బలి వినియోగ నిరాకరణను, సాక్షి అనే సానుకూల ఉద్దేశాన్ని వేర్వేరుగా నిలిపి, ఇది అధికారిక బలిపీఠం కాదనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో అతిగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన షరతు వాక్యనిర్మాణం వాడబడింది. ‘పితరులు,’ ‘దహనబలి,’ ‘సాక్షి’ వంటి పదాలు గౌరవప్రదమైన బైబిలీయ గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. మూలంలోని ద్వంద్వ నిరాకరణను ఉద్దేశపూర్వకంగా పునరుక్తితో కాపాడాం.
