lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: తరువాత జరిగిన సంఘటనను పరిచయం చేసే కాలసూచక పదం; కథన ప్రవాహాన్ని సహజంగా కొనసాగిస్తుంది.
- source_word: יִקְרָא
  choice: పిలిచాడు
  rationale: Qal క్రియ ఇక్కడ ఆయా గోత్రాల వారిని తన దగ్గరకు పిలిపించడాన్ని సూచిస్తుంది; ‘పిలిచాడు’ సహజమైన, సందర్భానుకూలమైన రూపం.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: לָרֽאוּבֵנִי
  choice: రూబేనీయులను
  rationale: ఏకవచన జాతివాచక రూపం ఇక్కడ సమూహార్థంలో వాడబడింది; తెలుగు బహువచనం ఆ సామూహిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְלַגָּדִי
  choice: గాదీయులను
  rationale: ఏకవచన జాతివాచక రూపం సమూహార్థకమైనది; ‘గాదీయులను’ గోత్రసమూహాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం వారిని
  rationale: מַטֶּה ఇక్కడ గోత్రాన్ని సూచిస్తుంది. ‘అర్ధగోత్రం వారు’ అనే రూపం మనష్షే గోత్రంలోని సగభాగానికి చెందిన ప్రజలను సహజ తెలుగులో తెలియజేస్తుంది.
