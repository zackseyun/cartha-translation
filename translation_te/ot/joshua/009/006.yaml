id: JOS.9.6
reference: Joshua 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּלְכ֧וּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּ֑ל וַ/יֹּאמְר֨וּ אֵלָ֜י/ו וְ/אֶל אִ֣ישׁ יִשְׂרָאֵ֗ל מֵ/אֶ֤רֶץ רְחוֹקָה֙ בָּ֔אנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
translation:
  language: te
  text: వారు గిల్గాలులోని శిబిరంలో ఉన్న యెహోషువ దగ్గరకు వెళ్లి, అతనికీ ఇశ్రాయేలు పురుషులకూ, “మేము దూరదేశం నుండి వచ్చాం. కాబట్టి ఇప్పుడు మాతో నిబంధన[a] చేయండి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాతో ఒప్పందం చేయండి.” హీబ్రూ నుడికారానికి అక్షరార్థం, “మాతో నిబంధన కోయండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: వెళ్లి
  rationale: הלך అనే సాధారణ గమన క్రియను కథన క్రమానికి సహజంగా ‘వెళ్లి’ అని అనువదించడం; గమ్యస్థాన దిశను తరువాతి పదబంధం స్పష్టం చేస్తుంది.
- source_word: אֶל־יְהוֹשֻׁעַ אֶל־הַמַּחֲנֶה הַגִּלְגָּל
  choice: గిల్గాలులోని శిబిరంలో ఉన్న యెహోషువ దగ్గరకు
  rationale: రెండుసార్లు వచ్చిన אֶל సూచించే గమ్యాన్ని, యెహోషువ శిబిరంలో ఉన్నాడనే స్థాన సంబంధంతో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמַּחֲנֶה
  choice: శిబిరం
  rationale: మַחֲנֶהకు సైనిక-ప్రయాణ సందర్భంలో సహజమైన తెలుగు సమానార్థకం.
- source_word: וַיֹּאמְרוּ
  choice: అన్నారు
  rationale: אמר అనే సాధారణ వాక్కు క్రియకు సందర్భానుకూలమైన తెలుగు కథన రూపం.
- source_word: אֵלָיו וְאֶל־אִישׁ יִשְׂרָאֵל
  choice: అతనితోనూ ఇశ్రాయేలు పురుషులతోనూ
  rationale: אִישׁ יִשְׂרָאֵל అనే సమూహార్థక ఏకవచనం ఇశ్రాయేలు పురుషులను సూచిస్తుంది; బహువచన ఆజ్ఞ కూడా యెహోషువతో పాటు వారిని ఉద్దేశించినదని నిర్ధారిస్తుంది.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: దూరదేశం నుండి
  rationale: אֶרֶץ మరియు רְחוֹקָה కలయికలోని భౌగోళిక దూర భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: בָּאנוּ
  choice: వచ్చాం
  rationale: పూర్తయిన రాకకు ప్రస్తుత ఫలిత స్థితి ఉన్నప్పటికీ, తెలుగు ప్రత్యక్ష సంభాషణలో ‘వచ్చాం’ సహజంగా రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: విన్నపానికి దారితీసే అనుమానార్థక/నిర్ణయాత్మక సంధిని ‘కాబట్టి’తో, కాల సూచనను ‘ఇప్పుడు’తో నిలుపుతుంది.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: మాతో నిబంధన చేయండి
  rationale: כרת ברית అనే హీబ్రూ నుడికారాన్ని అక్షరార్థంగా ‘కోయండి’ అని కాకుండా తెలుగులో అర్థవంతంగా ‘నిబంధన చేయండి’ అని ఇస్తూ, בְרִית అనే కీలక పదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: రాజకీయ ఒప్పంద సందర్భంలో בְרִית అనువాదం
  choice: నిబంధన
  alternative: ఒప్పందం
  rationale: ఇది దౌత్యపరమైన సందర్భమైనప్పటికీ, בְרִית పాత నిబంధనలో కీలకమైన మరియు విస్తృతమైన పదం. అందువల్ల ప్రధాన పాఠ్యంలో ‘నిబంధన’ను నిలిపి, రాజకీయ భావాన్ని స్పష్టంచేసే ‘ఒప్పందం’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దగ్గరకు వెళ్లి,’ ‘వచ్చాం,’ ‘చేయండి’ వంటి సాధారణ రూపాలు పఠనసౌలభ్యాన్ని ఇస్తాయి; ‘నిబంధన’ కీలక బైబిలు పదసామ్యాన్ని కాపాడుతుంది.
