translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘ఇశ్రాయేలు కుమారులు’ అనే కఠిన అక్షరానువాదం బదులు, జాతిసమూహాన్ని సూచించే మూల ప్రయోగార్థానికి అనుగుణంగా ‘ఇశ్రాయేలు ప్రజలు’ వాడబడింది. స్థలనామాలు ఇంగ్లీషు రూపాల నుంచి కాకుండా హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
