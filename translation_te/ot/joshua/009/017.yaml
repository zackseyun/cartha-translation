source:
  edition: WLC
  text: וַ/יִּסְע֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יָּבֹ֛אוּ אֶל עָרֵי/הֶ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וְ/עָרֵי/הֶם֙ גִּבְע֣וֹן וְ/הַ/כְּפִירָ֔ה וּ/בְאֵר֖וֹת וְ/קִרְיַ֥ת יְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/017.yaml
  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
translation:
  language: te
  text: 'ఇశ్రాయేలు ప్రజలు బయలుదేరి, మూడవ రోజున వారి పట్టణాలకు చేరుకున్నారు. వారి పట్టణాలు ఇవి: గిబియోను, కెఫీరా, బెయేరోతు, కిర్యత్‌-యెయారీము.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: נסע అనే క్రియ ఇక్కడ ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; శిబిరాన్ని ఎత్తివేశారనే భావాన్ని అనవసరంగా స్పష్టీకరించకుండా సహజమైన తెలుగు వాడబడింది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఇది ఇశ్రాయేలీయులను సూచించే స్థిర జాతినామం కాబట్టి ఆధునిక తెలుగులో సమగ్రంగా, సహజంగా ‘ఇశ్రాయేలు ప్రజలు’ అని అనువదించబడింది.
- source_word: וַיָּבֹאוּ אֶל עָרֵיהֶם
  choice: వారి పట్టణాలకు చేరుకున్నారు
  rationale: בוא + אֶל ఇక్కడ ‘వద్దకు వచ్చారు/చేరుకున్నారు’ అనే అర్థం ఇస్తుంది; ప్రయాణ గమ్యానికి చేరడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: హీబ్రూ కాలసూచక పదబంధానికి నేరమైన, సహజమైన అనువాదం; ‘మూడవ రోజు కల్లా’ అనే భావాన్ని దిగుమతి చేయదు.
- source_word: וְעָרֵיהֶם
  choice: వారి పట్టణాలు
  rationale: וְ ఇక్కడ ముందున్న ‘వారి పట్టణాలు’ అనే ప్రస్తావనను వివరించే జాబితాను పరిచయం చేస్తుంది; తెలుగులో కొత్త వాక్యం సహజంగా ఆ వివరణాత్మక సంబంధాన్ని తెలియజేస్తుంది.
- source_word: גִּבְעוֹן
  choice: గిబియోను
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: הַכְּפִירָה
  choice: కెఫీరా
  rationale: హీబ్రూ כְּפִירָה ధ్వనులకు సమీపమైన తెలుగు లిప్యంతరీకరణ; ఇంగ్లీషు సంప్రదాయ స్పెల్లింగ్‌ను ఆధారంగా తీసుకోలేదు.
- source_word: בְּאֵרוֹת
  choice: బెయేరోతు
  rationale: హీబ్రూ స్థలనామంలోని స్వర నిర్మాణాన్ని గుర్తించదగిన విధంగా నిలుపుకునే తెలుగు లిప్యంతరీకరణ.
- source_word: קִרְיַת יְעָרִים
  choice: కిర్యత్‌-యెయారీము
  rationale: సంయుక్త హీబ్రూ స్థలనామంలోని రెండు భాగాలను నిలుపుతూ తెలుగు పాఠకులకు చదవదగిన లిప్యంతరీకరణ.
