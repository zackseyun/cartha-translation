id: JOS.9.1
reference: Joshua 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּֽל הַ/מְּלָכִ֡ים אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בָּ/הָ֣ר וּ/בַ/שְּׁפֵלָ֗ה וּ/בְ/כֹל֙ ח֚וֹף הַ/יָּ֣ם הַ/גָּד֔וֹל אֶל מ֖וּל הַ/לְּבָנ֑וֹן הַֽ/חִתִּי֙ וְ/הָ֣/אֱמֹרִ֔י הַֽ/כְּנַעֲנִי֙ הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
translation:
  language: te
  text: 'ఇలా జరిగింది: యొర్దాను అవతల[a]—కొండప్రాంతంలోను, దిగువ మైదానంలోను[b], లెబానోను ఎదురుగా ఉన్న మహాసముద్రం మొత్తం తీరప్రాంతంలోను—నివసిస్తున్న హిత్తీయుల, అమోరీయుల, కనానీయుల, పెరిజ్జీయుల, హివ్వీయుల, యెబూసీయుల రాజులందరూ విన్నప్పుడు[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొర్దాను ఆవల.” హీబ్రూ పదబంధం భౌగోళిక దృష్టికోణాన్ని బట్టి రెండు విధాలుగా అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “షెఫేలాలో.” ఇది యూదా కొండప్రాంతానికి పశ్చిమాన ఉన్న పాదభూమి ప్రాంతం.
    reason: cultural_note
  - marker: c
    text: హీబ్రూలో కేవలం “విన్నప్పుడు” అని ఉంది; వారు ఏమి విన్నారో ఈ వచనంలో స్పష్టంగా చెప్పలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: וַיְהִי ఇక్కడ కొత్త కథాఘట్టాన్ని ప్రారంభించే కథన సూత్రంగా పనిచేస్తుంది; כִשְׁמֹעַతో కలిపి తెలుగు ఉపవాక్య నిర్మాణంలో సహజంగా ‘విన్నప్పుడు’ అని ఇవ్వబడింది. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున అసంపూర్ణత నిలుపబడింది.
- source_word: כָּל הַמְּלָכִים
  choice: రాజులందరూ
  rationale: మూలంలోని సమగ్ర పరిమాణాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల ఉన్న
  rationale: בְּעֵבֶר అంటే దృష్టికోణాన్ని బట్టి ‘అవతల/ఆవల’ లేదా ‘అడ్డంగా’ అనే భావం రావచ్చు; భౌగోళిక దిశను అనవసరంగా నిర్దేశించకుండా ‘అవతల’ ఎంచుకోబడింది.
- source_word: בָּהָר
  choice: కొండప్రాంతంలో
  rationale: ఇక్కడ הַר ఒక ప్రత్యేక పర్వతాన్ని కాక మధ్య ఎత్తైన భూభాగాన్ని సూచిస్తుంది; అందువల్ల ‘కొండప్రాంతం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וּבַשְּׁפֵלָה
  choice: దిగువ ప్రాంతంలో
  rationale: שְׁפֵלָה యూదా పశ్చిమంలోని తక్కువ ఎత్తుగల పాదప్రాంతాన్ని సూచిస్తుంది. సాధారణ పాఠకునికి అర్థమయ్యే అనువాదం ప్రధాన పాఠ్యంలో ఇవ్వబడింది.
- source_word: וּבְכֹל חוֹף הַיָּם הַגָּדוֹל
  choice: మహాసముద్రపు తీరం పొడవునా
  rationale: חוֹף అంటే తీరం; כֹּל యొక్క విస్తృత భావాన్ని ‘పొడవునా’ సహజంగా వ్యక్తం చేస్తుంది. הַיָּם הַגָּדוֹל అనే మూలపేరును ‘మహాసముద్రం’గా నిలిపింది.
- source_word: אֶל מוּל הַלְּבָנוֹן
  choice: లెబానోను వైపున
  rationale: ఈ పదబంధం లెబానోనుకు సంబంధించి దిశ లేదా స్థానాన్ని సూచిస్తుంది; ‘వైపున’ మూలంలోని కొంత స్థానిక అస్పష్టతను కాపాడుతుంది.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: హిత్తీయులు, అమోరీయులు, కనానీయులు, పెరిజ్జీయులు, హివ్వీయులు, యెబూసీయులు
  rationale: హీబ్రూలో నిర్దిష్ట ఏకవచన జాతినామాలు సమూహార్థకంగా ఉన్నాయి; ఆధునిక తెలుగులో బహువచన జాతినామాలు అదే భావాన్ని మరింత సహజంగా అందిస్తాయి.
