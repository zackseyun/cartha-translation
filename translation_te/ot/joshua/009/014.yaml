source:
  edition: WLC
  text: וַ/יִּקְח֥וּ הָֽ/אֲנָשִׁ֖ים מִ/צֵּידָ֑/ם וְ/אֶת פִּ֥י יְהוָ֖ה לֹ֥א שָׁאָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/014.yaml
  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
translation:
  language: te
  text: ఆ మనుషులు వారి ప్రయాణ ఆహారంలో కొంత తీసుకున్నారు; కానీ యాహ్వేను అడిగి ఆయన నిర్దేశాన్ని కోరలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే నోటిని అడగలేదు”; అంటే ఆయన దిశానిర్దేశం లేదా నిర్ణయాన్ని కోరలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: తీసుకున్నారు
  rationale: לקח అనే క్రియ యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతూ, గిబియోనీయుల ఆహారాన్ని పరిశీలనార్థం తీసుకున్న చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: మూలంలో ఉన్న సాధారణ నామవాచకాన్నే అనుసరిస్తుంది; ‘ఇశ్రాయేలు నాయకులు’ వంటి సందర్భాధారిత వివరాన్ని వచనంలో చేర్చదు.
- source_word: מִצֵּידָם
  choice: వారి ప్రయాణ ఆహారంలో కొంత
  rationale: צֵידָה ప్రయాణానికి తీసుకువెళ్లే ఆహారం లేదా సరఫరాలను సూచిస్తుంది; מִן ఇక్కడ భాగార్థకంగా ఉన్నందున ‘కొంత’ అని అనువదించబడింది.
- source_word: פִּי יְהוָה
  choice: యాహ్వే నిర్ణయమేమిటో
  rationale: అక్షరార్థంగా ‘యాహ్వే నోరు’ అనే ఈ నుడికారం ఆయన దిశానిర్దేశం లేదా నిర్ణయాన్ని అడగడాన్ని సూచిస్తుంది. సహజమైన తెలుగులో భావాన్ని తెలియజేస్తూ, అక్షరార్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో అందిస్తుంది.
- source_word: לֹא שָׁאָלוּ
  choice: అడిగి తెలుసుకోలేదు
  rationale: שׁאל అంటే అడగడం లేదా విచారించడం. దైవ నిర్ణయాన్ని కోరే ఈ సందర్భంలో ‘అడిగి తెలుసుకోలేదు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: פִּי יְהוָה అనే నుడికారం
  choice: యాహ్వే నిర్ణయమేమిటో
  alternative: యాహ్వే నోటి మాటను; యాహ్వే ఆదేశాన్ని; యాహ్వే సలహాను
  rationale: ఈ సందర్భంలో ‘నోరు’ అనేది యాహ్వే ఇచ్చే నిర్ణయం లేదా దిశానిర్దేశాన్ని సూచిస్తుంది. ‘నిర్ణయం’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; అయితే అది కేవలం ఆజ్ఞ మాత్రమేనని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని వ్యతిరేకతను సెమికోలన్ మరియు ‘కానీ’ ద్వారా స్పష్టంగా ఉంచింది; సందర్భంలో లేని ‘నాయకులు’ వంటి వివరాలు చేర్చలేదు.
