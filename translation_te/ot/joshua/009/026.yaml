  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
translation:
  language: te
  text: అతడు వారికి అలాగే చేసి, ఇశ్రాయేలు కుమారుల[a] చేతిలోనుండి వారిని కాపాడాడు; ఇశ్రాయేలు కుమారులు వారిని చంపలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు.” హీబ్రూ మూలంలో “ఇశ్రాయేలు కుమారులు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: అతడు వారికి అలాగే చేసి
  rationale: עשה ... כן అనే హీబ్రూ ప్రయోగం ‘అలాగే చేయడం’ అనే అర్థాన్ని ఇస్తుంది. ఇది ముందు వచనంలో చెప్పిన చర్యను తిరిగి సూచిస్తూ తెలుగులో సహజంగా ఉంది.
- source_word: וַיַּצֵּל
  choice: కాపాడాడు
  rationale: నצל హిఫిల్ రూపానికి ‘విడిపించడం, రక్షించడం, కాపాడడం’ అనే భావం ఉంది. తరువాత వచ్చే ‘చేతిలోనుండి’ అనే అధికార సూచక ప్రయోగంతో ‘కాపాడాడు’ సహజంగా సరిపోతుంది.
- source_word: אוֹתָם
  choice: వారిని
  rationale: ఈ ప్రత్యక్ష కర్మ సర్వనామం గిబియోనీయులను సూచిస్తుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: హీబ్రూ భాషలో ‘చేతి’ అధికారం లేదా అదుపును సూచించే సజీవ రూపకం. తెలుగులోనూ ‘చేతిలోనుండి’ అర్థవంతంగా, సహజంగా ఉంటుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని అక్షరార్థమైన జాతీయ సమూహ సూచనను నిలుపుతుంది. సాధారణ తెలుగులో ‘ఇశ్రాయేలీయులు’ కూడా సాధ్యమే కాబట్టి దానిని పాదసూచికలో ఇచ్చాం.
- source_word: וְלֹא הֲרָגוּם
  choice: ఇశ్రాయేలు కుమారులు వారిని చంపలేదు
  rationale: הרג యొక్క సాధారణ అర్థం ‘చంపడం.’ హీబ్రూలోని బహువచన కర్త ఇశ్రాయేలు కుమారులను సూచిస్తుంది; తెలుగులో రెండు వర్గాలకు ‘వారు’ వాడితే కలిగే అస్పష్టతను నివారించేందుకు కర్తను మళ్లీ స్పష్టంగా పేర్కొన్నాం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక సమూహ నామం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూల హీబ్రూలోని పురుష బహువచన నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, జాతీయ సమూహాన్ని సూచించే సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం. దీనివల్ల మూల రూపం మరియు దాని సామూహిక ప్రయోగం రెండూ కనిపిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ వావ్-క్రమంలోని సంబంధాన్ని నిలుపుతూ, తెలుగులో వరుసగా వచ్చే రెండు ‘వారు’ సర్వనామాల వల్ల కర్త-కర్మలు అస్పష్టమవకుండా చివరి ఉపవాక్యంలో కర్తను పునరుక్తి చేశాం.
