  source_fidelity: 'హీబ్రూ వచనంలోని మూడు వరుస చర్యలను పాఠ్యం నమ్మకంగా ప్రతిబింబిస్తుంది: అతడు వారికి అలాగే చేశాడు, వారిని ఇశ్రాయేలు కుమారుల చేతిలోనుండి కాపాడాడు, మరియు ఇశ్రాయేలు కుమారులు వారిని చంపలేదు. וַיַּצֵּל కు “కాపాడాడు,” מִיַּד కు “చేతిలోనుండి,” మరియు הֲרָגוּם కు “చంపలేదు” సరైన సమానార్థకాలు.'
