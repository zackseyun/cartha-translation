id: JOS.9.18
reference: Joshua 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
translation:
  language: te
  text: అయితే ఇశ్రాయేలీయులు వారిని కొట్టలేదు[a], ఎందుకంటే సమాజపు నాయకులు ఇశ్రాయేలు దేవుడైన యహోవా పేరున వారికి ప్రమాణం చేశారు. అప్పుడు సమాజమంతా ఆ నాయకుల మీద గొణిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భాన్ని బట్టి, “వారిపై దాడి చేయలేదు” లేదా “వారిని చంపలేదు” అని కూడా అర్థం కావచ్చు. హీబ్రూ క్రియ అక్షరార్థంగా “వారిని కొట్టలేదు” అని ఉంది; హింస తీవ్రతను లేదా దాని ఫలితాన్ని నిర్దిష్టంగా చెప్పదు.
    reason: మూల క్రియ యొక్క విస్తృతార్థాన్ని, సందర్భంలో సంభవించే హింసాత్మక భావాన్ని కాపాడటానికి.
lexical_decisions:
- source_word: הִכּוּם
  choice: వారిపై దాడి చేయలేదు
  rationale: נכה అనే క్రియకు ‘కొట్టు’ అనే ప్రాథమిక భావం ఉన్నా, ఈ సైనిక సందర్భంలో అది దాడి చేయడం నుంచి ప్రాణాంతకంగా కొట్టడం వరకు సూచించవచ్చు. తెలుగు ప్రధాన పాఠంలో ‘దాడి చేయలేదు’ సందర్భానికి సహజంగా ఉండి, ‘చంపలేదు’ అని ఫలితాన్ని అతిగా నిర్దిష్టం చేయదు; మూలంలోని విస్తృతిని పాదసూచిక తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే హీబ్రూ జాతీయ నుడికారానికి ఆధునిక తెలుగులో సహజమైన, సమగ్ర సమానార్థకం.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: సమాజపు నాయకులు
  rationale: נְשִׂיאִים సమాజంలో గుర్తింపు పొందిన అధిపతులను సూచిస్తుంది; עֵדָה ఇక్కడ కూడిన ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది. ఈ పదబంధం ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: נִשְׁבְּעוּ לָהֶם בַּיהוָה
  choice: యహోవా పేరట వారికి ప్రమాణం చేశారు
  rationale: ప్రమాణం ఎవరికి చేయబడిందో, ఎవరి పేరట చేయబడిందో తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּלֹּנוּ
  choice: సణిగింది
  rationale: לון సామూహిక అసంతృప్తితో నాయకులకు వ్యతిరేకంగా గొణగడాన్ని సూచిస్తుంది. ‘సణిగింది’ ఫిర్యాదు చేయడం కంటే ఆ భావ ఛాయను బాగా నిలుపుతుంది.
- source_word: כָל הָעֵדָה עַל הַנְּשִׂיאִים
  choice: సమాజమంతా ఆ నాయకుల మీద
  rationale: כָל యొక్క సంపూర్ణ సమూహ భావాన్ని ‘సమాజమంతా’ తెలియజేస్తుంది; עַל ఇక్కడ ఫిర్యాదు లక్ష్యాన్ని సూచిస్తున్నందున ‘మీద’ సహజంగా సరిపోతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు రూపమైన ‘యహోవా’గా ఉంచింది.
- issue: עֵדָה అనే సమాజ పదం
  choice: సమాజం
  alternative: సభ
  rationale: ఇది కూడిన ఇశ్రాయేలు సమూహాన్ని సూచిస్తుంది. ‘సమాజం’ తరువాతి కాలపు ప్రత్యేక మతసంస్థ భావాన్ని అనవసరంగా దిగుమతి చేయకుండా సహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. ‘దాంతో’ ద్వారా ప్రమాణం కారణంగా ప్రజల్లో వచ్చిన ప్రతిస్పందనను సహజంగా అనుసంధానించింది; మూలంలోని సంఘటనల క్రమాన్ని మార్చలేదు.
