translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘మీ’ రూపం గిబియోనీయుల వినయపూర్వక దౌత్య భాషను ప్రతిబింబిస్తుంది. మూలంలోని పదార్థాన్ని కాపాడుతూ తెలుగు సంభాషణలో సహజంగా వినిపించే వాక్యక్రమం ఎంచుకున్నాం.
