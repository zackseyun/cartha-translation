source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ אֶל יְהוֹשֻׁ֖עַ עֲבָדֶ֣י/ךָ אֲנָ֑חְנוּ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֧ם יְהוֹשֻׁ֛עַ מִ֥י אַתֶּ֖ם וּ/מֵ/אַ֥יִן תָּבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/008.yaml
  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
translation:
  language: te
  text: వారు యెహోషువతో, “మేము మీ సేవకులం[a]” అన్నారు. అప్పుడు యెహోషువ వారితో, “మీరు ఎవరు? ఎక్కడి నుండి వచ్చారు?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము మీ బానిసులం.” హీబ్రూ పదం “సేవకుడు” లేదా “బానిస” అనే అర్థాన్ని ఇవ్వగలదు. ఇక్కడ వారు దౌత్యపూర్వకంగా, వినయంతో మాట్లాడుతున్నారు కాబట్టి ప్రధాన పాఠ్యంలో “సేవకులు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: మీ సేవకులం
  rationale: עֶבֶד అనే పదం సందర్భానుసారం ‘సేవకుడు’ లేదా ‘బానిస’ అని అర్థమవుతుంది. ఇక్కడ గిబియోనీయులు దౌత్యపూర్వకంగా తమ విధేయతను తెలియజేస్తున్నారు; ఇప్పటికే చట్టబద్ధమైన బానిసత్వంలో ఉన్నామని చెప్పడం లేదు. అందువల్ల ప్రధాన పాఠ్యంలో ‘సేవకులు’ సహజంగా సరిపోతుంది; మరొక సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲנָחְנוּ
  choice: మేము ... లం
  rationale: హీబ్రూ నామవాచక వాక్యంలో స్పష్టమైన అనుసంధాన క్రియ లేకపోయినా, తెలుగులో సహజంగా ‘మేము మీ సేవకులం’ అని వ్యక్తీకరించబడుతుంది.
- source_word: מִי אַתֶּם
  choice: మీరు ఎవరు?
  rationale: ప్రశ్నార్థక పదం మరియు సర్వనామాన్ని అదనపు నామవాచకం చేర్చకుండా నేరుగా, సహజమైన తెలుగులో అనువదించాం.
- source_word: וּמֵאַיִן תָּבֹאוּ
  choice: ఎక్కడి నుండి వచ్చారు?
  rationale: מֵאַיִן మూలస్థానాన్ని గురించి అడుగుతుంది. ఈ ప్రత్యక్ష సంభాషణలో בוא క్రియారూపం వారు ఎక్కడి నుంచి వచ్చారనే భావాన్ని ఇస్తుంది; ‘ఎక్కడి నుండి వచ్చారు?’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  choice: వారు ... అన్నారు / అప్పుడు యెహోషువ ... అడిగాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని సహజమైన తెలుగు భూతకాల క్రియలతో చూపించాం. రెండో మాట ప్రశ్న కావడంతో ‘అన్నాడు’ కన్నా ‘అడిగాడు’ సంభాషణ కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘అప్పుడు’ వక్త మార్పును సూచిస్తుంది.
