source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא חֹטְבֵ֥י עֵצִ֛ים וְ/שֹׁ֥אֲבֵי מַ֖יִם לָֽ/עֵדָ֑ה וּ/לְ/מִזְבַּ֤ח יְהוָה֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר יִבְחָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
translation:
  language: te
  text: యెహోషువ ఆ రోజున వారిని సమాజం కోసమూ యాహ్వే బలిపీఠం కోసమూ కట్టెలు నరికేవారిగా, నీళ్లు తోడేవారిగా నియమించాడు; ఆయన ఎంచుకునే స్థలంలో వారు ఈ రోజు వరకూ అలాగే ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: వారిని … నియమించాడు
  rationale: נתן అనే క్రియకు మౌలికంగా ‘ఇచ్చాడు/ఉంచాడు’ అనే అర్థం ఉన్నా, ఇక్కడ పని చేసేవారిగా ఒక స్థితిలో నియమించడాన్ని సూచిస్తుంది. ‘నియమించాడు’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חֹטְבֵי עֵצִים
  choice: కట్టెలు కొట్టేవారిగా
  rationale: చెక్కను లేదా కట్టెలను నరికే పనివారిని సూచించే క్రియాత్మక పదబంధం. ‘కట్టెలు కొట్టేవారు’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: וְשֹׁאֲבֵי מַיִם
  choice: నీళ్లు తోడేవారిగా
  rationale: שאב బావి లేదా నీటి వనరు నుంచి నీటిని తోడడాన్ని సూచిస్తుంది. అందువల్ల కేవలం మోసేవారనే భావం కంటే ‘నీళ్లు తోడేవారు’ మూలానికి దగ్గరగా ఉంటుంది.
- source_word: לָעֵדָה
  choice: సమాజం కోసం
  rationale: עֵדָה ఇశ్రాయేలు సమూహాన్ని లేదా సభను సూచిస్తుంది. ‘సమాజం’ ఆధునిక తెలుగులో సామూహిక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּלְמִזְבַּח יְהוָה
  choice: యాహ్వే బలిపీఠం కోసం
  rationale: బలియర్పణ ఆరాధనతో ముడిపడిన సేవను ఈ పదబంధం సూచిస్తుంది; మూలంలోని దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకూ
  rationale: కథనంలోని సంఘటన నుంచి రచయిత కాలం వరకు ఆ ఏర్పాటు కొనసాగిందనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחָר
  choice: ఆయన ఎంచుకునే స్థలంలో
  rationale: ఆరాధనా స్థలాన్ని దేవుడు ఎంచుకోవడాన్ని సూచించే యెహోషువ–ద్వితీయోపదేశకాండ నుడికారం. ‘ఆయన’ అనే సర్వనామాన్ని ఉంచడం ద్వారా మూలంలోని వ్యక్తిగత కర్తను నిలిపి, సందర్భం సూచించే సంబంధాన్ని అతిగా విప్పి చెప్పలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. కాబట్టి దానిని ఆధునిక తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించడం వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- issue: ‘ఆయన ఎంచుకునే స్థలం’లో కర్త ఎవరు?
  choice: మూలంలోని సర్వనామాన్ని ‘ఆయన’గా నిలిపివేయడం
  alternative: ‘యాహ్వే ఎంచుకునే స్థలం’ అని కర్తను స్పష్టీకరించడం
  rationale: సందర్భం ప్రకారం కర్త యాహ్వే అయినప్పటికీ, హీబ్రూ వాక్యం సర్వనామాన్నే వాడుతుంది. అనవసరంగా పేరును చేర్చి వ్యాకరణ రూపాన్ని మార్చకుండా, సందర్భసూచిత భావాన్ని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; రెండో వాక్యంలోని ‘వారు … ఆ పని చేస్తున్నారు’ అనేది ‘ఈ రోజు వరకూ’ కొనసాగుతున్న స్థితిని సహజంగా వ్యక్తం చేసే పరిమిత విప్పికథనం.
