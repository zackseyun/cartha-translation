source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ אֶת יְהוֹשֻׁ֜עַ וַ/יֹּאמְר֗וּ כִּי֩ הֻגֵּ֨ד הֻגַּ֤ד לַ/עֲבָדֶ֨י/ךָ֙ אֵת֩ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ לָ/תֵ֤ת לָ/כֶם֙ אֶת כָּל הָ/אָ֔רֶץ וּ/לְ/הַשְׁמִ֛יד אֶת כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶ֑ם וַ/נִּירָ֨א מְאֹ֤ד לְ/נַפְשֹׁתֵ֨י/נוּ֙ מִ/פְּנֵי/כֶ֔ם וַֽ/נַּעֲשֵׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
translation:
  language: te
  text: 'వారు యెహోషువకు ఇలా జవాబిచ్చారు: “మీ దేవుడైన యెహోవా తన సేవకుడైన మోషేకు దేశమంతటినీ మీకు ఇవ్వాలని, మీ ముందునుండి దేశ నివాసులందరినీ నాశనం చేయాలని ఆజ్ఞాపించిన సంగతి మీ సేవకులమైన మాకు స్పష్టంగా తెలియజేయబడింది.[a] అందుచేత మీ కారణంగా మా ప్రాణాలకు మేము ఎంతో భయపడి, ఈ పని చేశాము.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ సేవకులకు తప్పకుండా తెలియజేయబడింది.” ఇక్కడ హీబ్రూలో ఒకే క్రియకు చెందిన క్రియానామం, క్రియారూపం కలసి వచ్చి విషయాన్ని బలంగా నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ וַיֹּאמְרוּ
  choice: వారు యెహోషువకు ఇలా జవాబిచ్చారు
  rationale: రెండు హీబ్రూ వాక్కు-పరిచయ క్రియల సంభాషణాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో ఒకే నిర్మాణంతో అందిస్తుంది.
- source_word: כִּי הֻגֵּד הֻגַּד לַעֲבָדֶיךָ
  choice: మీ సేవకులమైన మాకు స్పష్టంగా తెలిసింది
  rationale: దౌత్యపూర్వక స్వీయసూచన అయిన ‘మీ సేవకులు’ను నిలుపుతూ, נגד యొక్క బలపరచబడిన నిష్క్రియ రూపాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: మీ దేవుడైన యెహోవా
  rationale: దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించి, ‘మీ దేవుడు’ అనే సంబంధాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: עַבְדּוֹ
  choice: తన సేవకుడైన
  rationale: మోషేకు సంబంధించి עבד గౌరవప్రదమైన దైవసేవను సూచిస్తుంది; ‘సేవకుడు’ సందర్భోచితం.
- source_word: לָתֵת לָכֶם אֶת־כָּל־הָאָרֶץ
  choice: ఈ దేశమంతటినీ మీకు ఇవ్వాలని
  rationale: సందర్భంలో הָאָרֶץ కనాను దేశాన్ని సూచిస్తుంది; తెలుగు పాఠకునికి ‘ఈ దేశం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וּלְהַשְׁמִיד אֶת־כָּל־יֹשְׁבֵי הָאָרֶץ מִפְּנֵיכֶם
  choice: మీ ఎదుట నుండి ఈ దేశ నివాసులందరినీ నాశనం చేయాలని
  rationale: השמיד యొక్క బలమైన విధ్వంస భావాన్ని తగ్గించకుండా, מִפְּנֵיכֶם లోని తొలగింపు/ముందునుండి నిర్మూలన భావాన్ని నిలుపుతుంది.
- source_word: וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ מִפְּנֵיכֶם
  choice: మీ కారణంగా మా ప్రాణాల గురించి మేము ఎంతో భయపడి
  rationale: לְנַפְשֹׁתֵינוּ ను ప్రాణరక్షణకు సంబంధించిన భయంగా, రెండవ מִפְּנֵיכֶם ను కారణార్థకంగా సహజ తెలుగులో అందిస్తుంది.
- source_word: וַנַּעֲשֶׂה אֶת־הַדָּבָר הַזֶּה
  choice: ఈ పని చేశాము
  rationale: హీబ్రూ పదబంధానికి సరళమైన, సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: యెహోవా అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యేక దైవనామమైన יהוה నేరుగా ఉంది; దాన్ని సాధారణ బిరుదుతో మార్చకుండా పేరుగా నిలుపుతుంది.
- issue: దేశ నివాసుల నాశనం గురించి ఆజ్ఞ యొక్క వక్తృత్వ స్థితి
  choice: గిబియోనీయులు తమకు తెలిసిన యెహోవా ఆజ్ఞగా నివేదిస్తున్న మాటగానే అనువదించడం
  alternative: అనువాదంలో దానిని నైతికంగా మృదుపరచడం లేదా వ్యాఖ్యానించడం
  rationale: వచనంలోని కఠినమైన దైవశాస్త్రీయ ఉద్రిక్తతను తగ్గించకుండా, మాటల వక్తలు మరియు నివేదిక స్వభావాన్ని పాఠ్య నిర్మాణమే తెలియజేసేలా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘మీ సేవకులమైన మాకు’ అనే రూపం గిబియోనీయుల వినయపూర్వక దౌత్యభాషను నిలుపుతుంది. ప్రధాన పాఠంలో [a] సూచిక సంబంధిత వాక్యం వెంట ఉంచబడింది.
