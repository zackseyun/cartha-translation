id: JOS.9.10
reference: Joshua 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל אֲשֶׁ֣ר עָשָׂ֗ה לִ/שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן לְ/סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן וּ/לְ/ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן אֲשֶׁ֥ר בְּ/עַשְׁתָּרֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/010.yaml
  text: and all that he did to the two kings of the Amorites who were beyond the Jordan—to Sihon king of Heshbon and to Og king of Bashan[b][a], who was at Ashtaroth—
translation:
  language: te
  text: యొర్దాను అవతల ఉన్న అమోరీయుల ఇద్దరు రాజులకు—హెష్బోను రాజైన సీహోనుకు, అష్టారోతులో ఉన్న బాషాను రాజైన ఓగుకు—ఆయన చేసినదంతా విన్నాము.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה
  choice: ఆయన చేసినదంతా
  rationale: వావ్‌తో కూడిన కర్మసూచకం ముందటి వచనంలోని ‘విన్నాము’ అనే క్రియకు ఈ అంశాన్ని కొనసాగిస్తుంది. עָשָׂה యొక్క కర్త ఈ వచనంలో వ్యక్తంగా లేకపోయినా సందర్భంలో యెహోవాను సూచిస్తుంది; గౌరవార్థకంగా ‘ఆయన’ వాడబడింది.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: అమోరీయుల ఇద్దరు రాజులకు
  rationale: לְ ఇక్కడ వారికి ఏమి చేయబడిందో సూచిస్తుంది. ‘రాజులకు’ అనేది మూల నిర్మాణాన్ని కాపాడుతూ సహజమైన తెలుగును ఇస్తుంది.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల ఉన్న
  rationale: בְּעֵבֶר הַיַּרְדֵּן మాట్లాడేవారి భౌగోళిక దృష్టికోణం నుంచి యొర్దాను నదికి అవతలి వైపును సూచిస్తుంది. ‘అవతల’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: హెష్బోను రాజైన సీహోనుకు
  rationale: రాజు పేరు, రాజ్యకేంద్రం మధ్యనున్న సమానాధికార సంబంధాన్ని ‘రాజైన’ సహజంగా వ్యక్తం చేస్తుంది; పేర్లు మూలానికి అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
- source_word: וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: బాషాను రాజైన ఓగుకు
  rationale: ముందటి రాజుకు సమాంతరంగా నిర్మాణం ఉంచబడింది. ‘బాషాను’ ప్రాంత నామంగా లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: అష్టారోతులో ఉన్న
  rationale: సంబంధవాచక ఉపవాక్యం అత్యంత సహజంగా ఓగును విశేషిస్తుంది. בְּ స్థానాన్ని సూచించేందున తెలుగులో ‘లో’ సరిపోతుంది.
theological_decisions:
- issue: עָשָׂה క్రియలో అంతర్లీనంగా ఉన్న కర్త
  choice: ‘ఆయన’ అని ఉంచి, సందర్భం ద్వారా యెహోవాను గుర్తించేలా చేయడం
  alternative: ‘యెహోవా చేసినదంతా’ అని కర్తను స్పష్టంగా చేర్చడం
  rationale: హీబ్రూ వచనంలో కర్త నామరూపంగా వ్యక్తం కాలేదు; ముందు సందర్భమే దానిని తెలియజేస్తుంది. కాబట్టి దైవనామాన్ని అదనంగా చేర్చకుండా మూలంలోని సూచనాత్మకతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. ఈ వచనం ముందటి వచనంలోని ‘విన్నాము’తో వ్యాకరణపరంగా కొనసాగుతుంది కాబట్టి తెలుగులో అర్థసంపూర్ణత కోసం ఆ క్రియను చివర చేర్చాం.
