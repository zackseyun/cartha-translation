  register: ఆధునిక ప్రామాణిక తెలుగు; కథనశైలిలో సరళమైన, గౌరవప్రదమైన భాష. క్లిష్టమైన హీబ్రూ క్రియలోని అనిశ్చితిని పాదసూచికలో నిలిపి, ప్రధాన పాఠంలో సందర్భానికి సరిపోయే పఠనాన్ని ఇచ్చాం.
