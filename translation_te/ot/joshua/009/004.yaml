  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֤וּ גַם הֵ֨מָּה֙ בְּ/עָרְמָ֔ה וַ/יֵּלְכ֖וּ וַ/יִּצְטַיָּ֑רוּ וַ/יִּקְח֞וּ שַׂקִּ֤ים בָּלִים֙ לַ/חֲמ֣וֹרֵי/הֶ֔ם וְ/נֹאד֥וֹת יַ֨יִן֙ בָּלִ֔ים וּ/מְבֻקָּעִ֖ים וּ/מְצֹרָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
translation:
  language: te
  text: వారు కూడా కపటంగా వ్యవహరించి, వెళ్లి మారువేషం వేసుకున్నారు[a]. తమ గాడిదల కోసం అరిగిపోయిన గోనెసంచులనూ, అరిగిపోయి, చీలిపోయి, కట్టబడిన ద్రాక్షారసపు తోలు తిత్తులనూ తీసుకున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రయాణానికి సరంజామా సిద్ధం చేసుకున్నారు.” ఇక్కడి హీబ్రూ క్రియ క్లిష్టమైనది; దానికి ఒకటి కంటే ఎక్కువ అర్థాలు చెప్పబడ్డాయి. తరువాత వివరించిన పాత సామగ్రితో వారు మోసపూరిత రూపం కల్పించుకున్న సందర్భం “మారువేషం వేసుకున్నారు” అనే అర్థానికి మద్దతిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “చీలిపోయి కట్టబడిన”; చీలిన తోలు తిత్తులను కట్టి మరమ్మతు చేసినట్లు ఇది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָרְמָה
  choice: కపటంగా
  rationale: ఈ సందర్భంలో ఈ పదం తెలివిగా చేసిన మోసపూరిత చర్యను సూచిస్తుంది; ‘కపటంగా’ అనేది సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וַיִּצְטַיָּרוּ
  choice: మారువేషం వేసుకున్నారు
  rationale: క్రియారూపం క్లిష్టమైనదైనా, తరువాత చెప్పబడే పాత సామగ్రి ద్వారా దూరదేశస్థుల్లా కనిపించాలనే సందర్భానికి ఈ అర్థం బాగా సరిపోతుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: שַׂקִּים בָּלִים
  choice: అరిగిపోయిన గోనెసంచులు
  rationale: שַׂקִּים మోసుకెళ్లే ముతక సంచులను, בָּלִים వాడకంతో జీర్ణించిన స్థితిని సూచిస్తాయి.
- source_word: לַחֲמוֹרֵיהֶם
  choice: తమ గాడిదల కోసం
  rationale: సంచులు గాడిదలపై మోసేందుకు ఉద్దేశించినవని సంబంధార్థక ప్రయోగంతో తెలియజేస్తుంది.
- source_word: נֹאדוֹת יַיִן בָּלִים
  choice: పాత ద్రాక్షారసపు తోలు తిత్తులు
  rationale: నֹאדוֹת అనేది ద్రవాలను నిల్వచేసే జంతుచర్మపు తిత్తులను సూచిస్తుంది; తెలుగులో వస్తువు స్వరూపం స్పష్టంగా ఉండేందుకు ‘తోలు తిత్తులు’ వాడాం.
- source_word: מְבֻקָּעִים
  choice: చినిగిపోయి
  rationale: బద్దలవడం లేదా చీలిపోవడం అనే భౌతిక నష్టాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מְצֹרָרִים
  choice: కట్టిపెట్టిన
  rationale: చీలిన తోలు తిత్తులను కట్టి మరమ్మతు చేసిన భావాన్ని మూలపదానికి దగ్గరగా నిలుపుతుంది.
- source_word: גַם הֵמָּה
  choice: వారు కూడా
  rationale: ఇతరుల మాదిరిగానే గిబియోనీయులు కూడా చర్య తీసుకున్నారనే అనుసంధానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
