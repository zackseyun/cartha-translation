source:
  edition: WLC
  text: ו/יאמרו אִֽישׁ יִשְׂרָאֵ֖ל אֶל הַ/חִוִּ֑י אוּלַ֗י בְּ/קִרְבִּ/י֙ אַתָּ֣ה יוֹשֵׁ֔ב וְ/אֵ֖יךְ אכרות לְ/ךָ֥ בְרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/007.yaml
  text: But the men of Israel said to the Hivite[a], “Perhaps you are living among us[b]; how then could I make a covenant with you?”
translation:
  language: te
  text: అయితే ఇశ్రాయేలు మనుషులు హివ్వీయునితో, “ఒకవేళ నువ్వు మా మధ్య నివసిస్తున్నావేమో; అలాంటప్పుడు నేను నీతో ఒడంబడిక ఎలా చేయగలను?” అని అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మనుషులు
  rationale: రూపంలో ఏకవచనమైన אִישׁ ఇక్కడ సమూహార్థకంగా ఇశ్రాయేలు ప్రతినిధులను సూచిస్తుంది. తెలుగు వాక్యంలో బహువచనం సహజంగా ఉండి సమూహ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: הַחִוִּי
  choice: హివ్వీయునితో
  rationale: మూలంలోని ఏకవచనాన్ని నిలుపుతూ, సమూహం తరఫున సంభాషిస్తున్న ప్రతినిధిని సూచించేలా అనువదించబడింది.
- source_word: אוּלַי
  choice: ఒకవేళ ... ఏమో
  rationale: అనుమానంతో కూడిన సంభావ్యతను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּקִרְבִּי
  choice: మా మధ్యనే
  rationale: అక్షరార్థం ‘నా మధ్యలో’; అయితే వక్త ఇశ్రాయేలుకు ప్రతినిధిగా మాట్లాడుతున్నందున సమూహార్థాన్ని సహజమైన తెలుగులో ‘మా మధ్య’గా వ్యక్తం చేశాం. ‘నే’ అనుమానంలోని స్థానిక బలాన్ని తెలియజేస్తుంది.
- source_word: יוֹשֵׁב
  choice: నివసిస్తున్నావు
  rationale: ישׁב క్రియలోని కొనసాగుతున్న నివాస భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְאֵיךְ
  choice: అలాంటప్పుడు ... ఎలా
  rationale: ముందటి అనుమానం నుంచి వచ్చే ఆచరణాత్మక పరిణామాన్ని తెలుగులో స్పష్టంగా కలుపుతుంది.
- source_word: אכרות ... בְרִית
  choice: నిబంధన చేయగలను
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘నిబంధన కోయడం.’ తెలుగులో ‘నిబంధన చేయడం’ సహజంగా ఉండి ఒడంబడిక సంబంధిత భావాన్ని కాపాడుతుంది.
- source_word: לְךָ
  choice: నీతో
  rationale: నిబంధన చేయడంలో ఎదుటి పక్షంతో ఉన్న సంబంధాన్ని తెలుగు నుడికారానికి అనుగుణంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు మాటలో సమూహానికి ప్రాతినిధ్యం వహించే ఏకవచన రూపాలు
  choice: ‘మా మధ్య’లో సమూహార్థాన్ని చూపిస్తూ, ‘నేను ... చేయగలను’లో మూలంలోని ప్రాతినిధ్య ఏకవచనాన్ని నిలుపడం
  alternative: అన్ని రూపాలనూ ఏకవచనంగా ‘నా మధ్య ... నేను’ అని అనువదించడం, లేదా అన్నింటినీ బహువచనంగా ‘మా మధ్య ... మేము’ అని మార్చడం
  rationale: హీబ్రూలో సమూహం తరఫున మాట్లాడే ప్రతినిధి ఏకవచన వినియోగం ఉంది. తెలుగులో ‘నా మధ్య’ అసహజంగానూ వ్యక్తిగతంగానూ వినిపిస్తుంది; ‘మా మధ్య’ సందర్భాన్ని స్పష్టం చేస్తుంది. అదే సమయంలో ‘నేను’ను నిలుపడం మూలంలోని మొదటి పురుష ఏకవచన క్రియను, ప్రాతినిధ్య వక్త భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. మూలంలోని ఏకవచన–సమూహ ఉద్వేగాన్ని పూర్తిగా సమతలపరచకుండా వాక్యంలోనే నిలుపబడింది. పాదసూచనలు అవసరం లేకుండా ప్రధాన పాఠ్యంలో భావం స్పష్టంగా ఉంది.
