  source_fidelity: 'వాక్యం హీబ్రూ మూలార్థాన్ని సమగ్రంగా ప్రతిబింబిస్తుంది: ఇశ్రాయేలు ప్రతినిధుల సమూహం, ఏకవచనంలోని హివ్వీయ ప్రతినిధి, అనుమానసూచక ‘ఒకవేళ,’ నివాస భావం, అలాగే ప్రాతినిధ్య ఏకవచనమైన ‘నేను’ అన్నీ నిలిచాయి. అయితే בְּרִיתకు ‘నిబంధన’ కన్నా ‘ఒడంబడిక’ అనేది సందర్భానుకూలమైన, స్థిరమైన బైబిలు పదం.'
