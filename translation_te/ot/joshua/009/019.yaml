id: JOS.9.19
reference: Joshua 9:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
translation:
  language: te
  text: 'అయితే నాయకులందరూ సమాజమంతటితో ఇలా అన్నారు: “మేము ఇశ్రాయేలు దేవుడైన యాహ్వే పేరున వారికి ప్రమాణం చేశాము. ఇప్పుడు వారిని ముట్టుకోలేము[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారికి హాని చేయలేము,” లేదా “వారిని కొట్టలేము”; అక్షరార్థంగా “వారిని ముట్టుకోలేము.”
    reason: నגע అనే క్రియకు ప్రాథమికంగా ‘ముట్టు’ అనే అర్థం ఉన్నా, ఈ సందర్భంలో హాని చేయడం లేదా దాడి చేయడం అనే భావం ఉంది.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అయితే ... ఇలా అన్నారు
  rationale: వావ్-క్రమక్రియను పదక్షరంగా ‘మరియు’ అని అనవచ్చు; అయితే ముందు సందర్భంలోని సమాజపు ఫిర్యాదుకు నాయకులు ఇచ్చిన విరుద్ధ ప్రతిస్పందనను సహజమైన తెలుగులో ‘అయితే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָל הַנְּשִׂיאִים
  choice: నాయకులందరూ
  rationale: נָשִׂיא ఇక్కడ ఇశ్రాయేలు ప్రజల పాలనా ప్రతినిధులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘నాయకులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: כָל הָעֵדָה
  choice: సమాజమంతటితో
  rationale: עֵדָה ఇశ్రాయేలు సమష్టి సమాజాన్ని సూచిస్తుంది. ‘సమాజం’ సాధారణ పాఠకులకు సహజంగా ఉండి సమష్టి భావాన్ని నిలుపుతుంది.
- source_word: נִשְׁבַּעְנוּ לָהֶם
  choice: వారికి ప్రమాణం చేశాము
  rationale: నిఫాల్ రూపంలోని שׁבע ప్రమాణం చేయడాన్ని సూచిస్తుంది; గతంలో చేసిన ప్రమాణం ఇప్పటికీ బద్ధం చేస్తున్న భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: בַּיהוָה
  choice: యాహ్వే పేరట
  rationale: ప్రమాణం చేయడంలో בְ ప్రమాణానికి సాక్షిగా పిలిచిన వ్యక్తిని సూచిస్తుంది. ‘పేరట’ అనే ప్రయోగం తెలుగులో ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ‘ఇప్పుడు’ కాలసూచనను నిలుపుతూ, ప్రమాణం కారణంగా వచ్చిన ప్రస్తుత పర్యవసానాన్ని ‘కాబట్టి’ సహజంగా వెల్లడిస్తుంది.
- source_word: לֹא נוּכַל
  choice: ముట్టుకోలేము
  rationale: יכל అసమర్థతను సూచిస్తుంది; ఇక్కడ ప్రమాణం వల్ల ఏర్పడిన నైతిక అసాధ్యత సందర్భంలో వ్యక్తమవుతుంది.
- source_word: לִנְגֹּעַ בָּהֶם
  choice: వారిని ముట్టుకోలేము
  rationale: נגע యొక్క ప్రాథమిక అర్థమైన ‘ముట్టు’ను ప్రధాన పాఠ్యంలో నిలిపి, ఈ సందర్భంలోని హాని చేసే నిగూఢార్థాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠ్యంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణగా ‘యాహ్వే’ వాడబడింది.
- issue: ప్రమాణం వల్ల ‘చేయలేము’ అనే మాటలోని స్వభావం
  choice: నైతిక బంధాన్ని సందర్భానికే వదిలి ‘ముట్టుకోలేము’ అని అనువదించడం
  alternative: ‘ముట్టుకోకూడదు’
  rationale: לֹא נוּכַל రూపరీత్యా అసమర్థతను చెబుతుంది; అది ప్రమాణం వల్ల కలిగిన నైతిక అసమర్థత అయినప్పటికీ, దాన్ని నేరుగా నిషేధార్థంగా మార్చకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా ఉండేలా, అయినా కథనానికి తగిన గౌరవప్రదమైన శైలి పాటించబడింది. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘ముట్టుకోలేము’ అన్న పదబంధం వెంట ఉంచబడింది.
