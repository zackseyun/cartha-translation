- from: 'అయితే నాయకులందరూ సమాజమంతటితో ఇలా అన్నారు: “మేము ఇశ్రాయేలు దేవుడైన యాహ్వే పేరట వారికి ప్రమాణం చేశాము. కాబట్టి ఇప్పుడు వారిని ముట్టుకోలేము[a].”'
