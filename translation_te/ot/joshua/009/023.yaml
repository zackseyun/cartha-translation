source:
  edition: WLC
  text: וְ/עַתָּ֖ה אֲרוּרִ֣ים אַתֶּ֑ם וְ/לֹֽא יִכָּרֵ֨ת מִ/כֶּ֜ם עֶ֗בֶד וְ/חֹטְבֵ֥י עֵצִ֛ים וְ/שֹֽׁאֲבֵי מַ֖יִם לְ/בֵ֥ית אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you servants, cutters of wood and drawers of water for the house of my God.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు మీరు శాపగ్రస్తులు. మీలోనుండి కట్టెలు నరికేవారు, నీళ్లు తోడేవారు అయిన దాసులు నా దేవుని మందిరం కొరకు ఎన్నటికీ లేకుండా పోరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరానుసారంగా, “మీలోనుండి ఒక దాసుడు ఎన్నటికీ తొలగింపబడడు.” హెబ్రీ ప్రయోగం, వారి ప్రజల్లోనుండి ఈ పని చేసే దాసులు నిరంతరం ఉంటారని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందున్న తీర్పు ప్రకటనకు దాని పర్యవసానాన్ని అనుసంధానించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: אֲרוּרִים
  choice: శాపగ్రస్తులు
  rationale: బహువచన విధేయ విశేషణాన్ని నేరుగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  choice: మీలోనుండి దాసులు ... ఎన్నటికీ లేకుండా పోరు
  rationale: כרת నిఫాల్ రూపం מן తో కలిసి ‘మధ్యనుండి తొలగిపోవడం/లేకుండా పోవడం’ అనే భావాన్ని ఇస్తుంది. ఏకవచన עֶבֶד ఇక్కడ సమూహార్థకంగా ఉండడంతో సహజమైన తెలుగులో బహువచనం వాడి, వారి సమాజం ఈ బలవంతపు సేవకు నిరంతరం మనుషులను సమకూర్చుతుందనే భావాన్ని నిలిపింది.
- source_word: עֶבֶד
  choice: దాసులు
  rationale: ఇక్కడ శాపంగా విధించబడిన అధీన, బంధిత స్థితి ప్రధానమైనందున మృదువైన ‘సేవకులు’ కంటే ‘దాసులు’ తగినది.
- source_word: חֹטְבֵי עֵצִים
  choice: కట్టెలు నరికేవారు
  rationale: విధించబడిన శ్రమను స్పష్టంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שֹׁאֲבֵי מַיִם
  choice: నీళ్లు తోడేవారు
  rationale: బావి లేదా నీటి వనరు నుండి నీరు తీయడం అనే స్పష్టమైన పనిని సహజ తెలుగు పదబంధంతో వ్యక్తం చేస్తుంది.
- source_word: לְבֵית אֱלֹהָי
  choice: నా దేవుని మందిరం కోసం
  rationale: ఈ సందర్భంలో בַּיִת గృహస్థ కుటుంబాన్ని కాక దేవుని పరిశుద్ధస్థలాన్ని సూచిస్తుంది; ‘మందిరం’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: యెహోషువ విధించిన శాపంలోని అధీన శ్రమ స్థితి
  choice: దాసులు
  alternative: సేవకులు
  rationale: ఈ వాక్యం స్వచ్ఛంద సేవను కాక, శాపం కింద తరతరాలుగా విధించబడే అధీన శ్రమను వివరిస్తుంది. అందువల్ల ‘దాసులు’ మూలంలోని కఠినతను కాపాడుతుంది.
- issue: ‘దేవుని ఇల్లు’ అనే పదబంధపు సందర్భార్థం
  choice: నా దేవుని మందిరం
  alternative: నా దేవుని ఇల్లు
  rationale: ఇక్కడ సూచన నివాసగృహానికి కాదు, దేవుని పరిశుద్ధస్థల సేవకు. అయితే తరువాతి కాలపు నిర్మిత ఆలయాన్ని ప్రత్యేకంగా నిర్ధారించకుండా ‘మందిరం’ అనే సాధారణ ఆరాధనా-స్థల పదం వాడబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ తీర్పు ప్రకటనకు తగిన గంభీరతను నిలిపింది. సమూహార్థక హెబ్రీ ఏకవచనాన్ని తెలుగులో స్పష్టత కోసం బహువచనంగా ఇచ్చి, అక్షరానుసార రూపాన్ని పాదటిప్పణిలో ఉంచింది.
