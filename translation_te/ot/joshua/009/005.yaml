source:
  edition: WLC
  text: וּ/נְעָל֨וֹת בָּל֤וֹת וּ/מְטֻלָּאוֹת֙ בְּ/רַגְלֵי/הֶ֔ם וּ/שְׂלָמ֥וֹת בָּל֖וֹת עֲלֵי/הֶ֑ם וְ/כֹל֙ לֶ֣חֶם צֵידָ֔/ם יָבֵ֖שׁ הָיָ֥ה נִקֻּדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/005.yaml
  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
translation:
  language: te
  text: వారి కాళ్లకు అరిగిపోయి, అతుకులు వేసిన చెప్పులు ఉన్నాయి; వారి మీద అరిగిపోయిన బట్టలు ఉన్నాయి. వారి సరఫరాలోని రొట్టెలన్నీ ఎండిపోయి, ముక్కలుముక్కలుగా విరిగిపోయాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బూజుపట్టిన రొట్టె.’ ఇక్కడ ఉపయోగించిన హీబ్రూ పదం అరుదైనది. అది ఎండిపోయి ముక్కలుగా విరిగిన రొట్టెను సూచించవచ్చు; కొందరు దానికి ‘బూజుపట్టిన రొట్టె’ అనే అర్థాన్ని ఇస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָלוֹת
  choice: చెప్పులు
  rationale: ప్రాచీన సమీప తూర్పు ప్రాంతపు పాదరక్షలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘చెప్పులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בָּלוֹת
  choice: అరిగిపోయిన
  rationale: వయస్సు లేదా వాడకం వల్ల పాడైన స్థితిని తెలియజేస్తుంది; కేవలం ‘పాత’ అనే అర్థం కంటే ఇది ఖచ్చితమైనది.
- source_word: מְטֻלָּאוֹת
  choice: అతుకులు వేసిన
  rationale: ముక్కలు అతికి మరమ్మతు చేసిన పాదరక్షల స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּרַגְלֵיהֶם
  choice: వారి కాళ్లకు
  rationale: హీబ్రూ స్థలసూచక పదబంధంలోని స్పష్టమైన శారీరక చిత్రణను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שְׂלָמוֹת
  choice: బట్టలు
  rationale: సాధారణ వస్త్రాలను సూచించే పదం; ఆధునిక సాధారణ పాఠకులకు ‘వస్త్రాలు’ కంటే సహజంగా ఉంటుంది.
- source_word: עֲלֵיהֶם
  choice: వారు ... వేసుకున్నారు
  rationale: వారి మీద ఉన్న వస్త్రాల భావాన్ని తెలుగులో సహజమైన క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: לֶחֶם צֵידָם
  choice: వారి ప్రయాణ ఆహారంగా తెచ్చుకున్న రొట్టెలు
  rationale: ‘వారి సరఫరాలోని రొట్టె’ అనే మూల భావాన్ని, ప్రయాణానికి తెచ్చుకున్న ఆహారం అనే సందర్భంతో స్పష్టంగా తెలియజేస్తూ ‘రొట్టె’ అనే నిర్దిష్టతను కాపాడుతుంది.
- source_word: יָבֵשׁ הָיָה
  choice: ఎండిపోయి
  rationale: రొట్టె పొడిబారిన స్థితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: נִקֻּדִים
  choice: ముక్కలు ముక్కలుగా అయ్యాయి
  rationale: అరుదైన ఈ పదం ఇక్కడ ఎండిపోయి విరిగి ముక్కలైన రొట్టెను సూచించవచ్చు. పాఠ్యంలో ఆ సాధ్యమైన అర్థాన్ని ఉంచి, ‘బూజుపట్టినవి’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నమోదు చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని దృశ్య వివరాలను నిలుపుతూ, నִקֻּדִים పదంలోని నిజమైన నిఘంటు అనిశ్చితిని పాదటిప్పణిలో భద్రపరచాం.
