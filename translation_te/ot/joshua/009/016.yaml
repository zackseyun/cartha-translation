reference: Joshua 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קְצֵה֙ שְׁלֹ֣שֶׁת יָמִ֔ים אַחֲרֵ֕י אֲשֶׁר כָּרְת֥וּ לָ/הֶ֖ם בְּרִ֑ית וַֽ/יִּשְׁמְע֗וּ כִּי קְרֹבִ֥ים הֵם֙ אֵלָ֔י/ו וּ/בְ/קִרְבּ֖/וֹ הֵ֥ם יֹשְׁבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/016.yaml
  text: And it happened at the end of three days, after they had made a covenant with them, that they heard that they were near to them and were living among them.
translation:
  language: te
  text: ఇశ్రాయేలీయులు వారితో ఒడంబడిక చేసుకున్న మూడు రోజుల ముగింపులో, వారు తమకు దగ్గరగా ఉన్నారని, తమ మధ్యలోనే నివసిస్తున్నారని ఇశ్రాయేలీయులు విన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజుల తర్వాత
  rationale: అక్షరార్థంగా ‘మూడు రోజుల ముగింపులో’; ఆధునిక తెలుగులో సహజంగా కాలవ్యవధిని తెలియజేస్తుంది.
- source_word: כָּרְתוּ לָהֶם בְּרִית
  choice: వారు వారితో ఒడంబడిక చేసుకున్నారు
  rationale: ‘ఒడంబడిక కోశారు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; పరస్పర ఒప్పంద భావాన్ని నిలుపుతుంది.
- source_word: וַיִּשְׁמְעוּ
  choice: ఇశ్రాయేలీయులు తెలుసుకున్నారు
  rationale: మూలంలో కర్త ముందరి సందర్భం ద్వారా తెలుస్తుంది; తెలుగులో సర్వనామ గందరగోళాన్ని నివారించేందుకు స్పష్టపరచబడింది. ‘విన్నారు’ అనే ప్రాథమిక అర్థం ఇక్కడ సమాచారం తెలుసుకోవడం అనే సందర్భార్థంతో వ్యక్తమవుతుంది.
- source_word: קְרֹבִים הֵם אֵלָיו
  choice: వారు తమకు సమీపంలోనే ఉన్నారని
  rationale: אֵלָיו రూపం ఏకవచన ప్రత్యయంతో ఉన్నప్పటికీ సమూహమైన ఇశ్రాయేలును సూచిస్తుంది; ‘తమకు’ తెలుగులో ఆ సామూహిక సూచనను సహజంగా అందిస్తుంది.
- source_word: וּבְקִרְבּוֹ הֵם יֹשְׁבִים
  choice: తమ మధ్యనే నివసిస్తున్నారని
  rationale: ‘అతని/దాని మధ్యలో’ అనే రూపాన్ని సందర్భానుసారంగా ఇశ్రాయేలు సమాజం లేదా ప్రాంతం మధ్య నివాసముండటంగా సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. వరుసగా వచ్చే అస్పష్టమైన ‘వారు’ సూచనలను తగ్గించేందుకు ‘ఇశ్రాయేలీయులు’ అనే సందర్భసిద్ధ కర్తను స్పష్టంగా పేర్కొన్నాం.
