id: JOS.9.20
reference: Joshua 9:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֛את נַעֲשֶׂ֥ה לָ/הֶ֖ם וְ/הַחֲיֵ֣ה אוֹתָ֑/ם וְ/לֹֽא יִֽהְיֶ֤ה עָלֵ֨י/נוּ֙ קֶ֔צֶף עַל הַ/שְּׁבוּעָ֖ה אֲשֶׁר נִשְׁבַּ֥עְנוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/020.yaml
  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
translation:
  language: te
  text: 'మనం వారికి ఇలా చేద్దాం: వారిని ప్రాణాలతో ఉంచుదాం[a], అప్పుడు మనం వారికి చేసిన ప్రమాణం కారణంగా మన మీద ఉగ్రకోపం[b] రాదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిని బ్రతకనిద్దాం”; లేదా “వారిని చంపకుండా విడిచిపెడదాం.”
    reason: lexical_alternative
  - marker: b
    text: సందర్భంలో ఇది దేవుని ఉగ్రకోపాన్ని సూచిస్తున్నట్లు ఉంది; అయితే హీబ్రూ పాఠం ఇక్కడ “యెహోవా ఉగ్రకోపం” అని స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה לָהֶם
  choice: మనం వారికి ఇలా చేద్దాం
  rationale: ప్రతిపాదిస్తున్న కార్యాన్ని పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగు deliberative రూపంలో అందిస్తుంది.
- source_word: וְהַחֲיֵה אוֹתָם
  choice: వారిని బతకనిద్దాం
  rationale: חיה హిఫీల్ రూపం ఇక్కడ వారిని చంపకుండా జీవించనివ్వడం లేదా ప్రాణాలతో ఉంచడం అనే భావాన్ని ఇస్తుంది; ‘బతకనిద్దాం’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף
  choice: అప్పుడు మన మీద ఉగ్రకోపం రాదు
  rationale: కార్యానికి ఆశించిన ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, קֶצֶף యొక్క తీవ్రతను ‘ఉగ్రకోపం’గా నిలుపుతుంది.
- source_word: עַל הַשְּׁבוּעָה
  choice: ప్రమాణం కారణంగా
  rationale: עַל ఇక్కడ భయపడుతున్న కోపానికి కారణాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  choice: మనం వారికి చేసిన ప్రమాణం
  rationale: שׁבע నిఫాల్ రూపం మరియు לָהֶם కలిపి వారికి ప్రమాణం చేయడాన్ని సూచిస్తాయి; నామవాచక నిర్మాణం తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: ప్రమాణాన్ని ఉల్లంఘిస్తే కలిగే קֶצֶף ఎవరి కోపం?
  choice: ప్రధాన పాఠంలో ‘ఉగ్రకోపం’ అని మాత్రమే ఉంచడం
  alternative: ‘యెహోవా ఉగ్రకోపం’ లేదా ‘దేవుని ఉగ్రకోపం’ అని స్పష్టీకరించడం
  rationale: సందర్భంలో ఇది దేవుని కోపమే అయ్యే అవకాశం బలంగా ఉన్నా, ఈ వచనంలోని హీబ్రూ పాఠం దేవుని పేరును స్పష్టంగా పేర్కొనదు. అందువల్ల అసలు పాఠంలోని అంతర్లీనతను ప్రధాన పాఠంలో కాపాడి, సూచనను పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘బతకనిద్దాం’ సంభాషణాత్మకంగా స్పష్టంగా ఉండగా, ‘ఉగ్రకోపం’ మూలపదంలోని గంభీరతను నిలుపుతుంది.
