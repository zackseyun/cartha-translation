  to: 'మనం వారికి ఇలా చేద్దాం: వారిని ప్రాణాలతో ఉంచుదాం[a], అప్పుడు మనం వారికి చేసిన ప్రమాణం కారణంగా మన మీద ఉగ్రకోపం[b] రాదు.'
