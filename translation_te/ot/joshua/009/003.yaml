id: JOS.9.3
reference: Joshua 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֹשְׁבֵ֨י גִבְע֜וֹן שָׁמְע֗וּ אֵת֩ אֲשֶׁ֨ר עָשָׂ֧ה יְהוֹשֻׁ֛עַ לִֽ/ירִיח֖וֹ וְ/לָ/עָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/003.yaml
  text: But the inhabitants of Gibeon heard what Joshua had done to Jericho and to Ai[a].
translation:
  language: te
  text: అయితే గిబియోను నివాసులు యెహోషువ యెరికోకూ హాయికీ ఏమి చేశాడో విన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు గిబియోను నివాసులు యెహోషువ యెరికోకూ హాయికీ ఏమి చేశాడో విన్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֹשְׁבֵי
  choice: అయితే … నివాసులు
  rationale: יֹשְׁבֵי అంటే ‘నివాసులు/నివసించేవారు.’ ముందటి వచనాల్లో రాజుల ప్రతిస్పందనకు, గిబియోనీయుల భిన్నమైన ప్రతిస్పందనకు మధ్య ఉన్న కథన వ్యత్యాసాన్ని వְ ఇక్కడ సూచిస్తుండటంతో ‘అయితే’ అని అనువదించాం.
- source_word: גִבְעוֹן
  choice: గిబియోను
  rationale: స్థలనామాన్ని తెలుగులో సాధారణంగా వినియోగించే బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: שָׁמְעוּ
  choice: విన్నారు
  rationale: శׁמע క్రియ యొక్క కాల్ పర్ఫెక్ట్ రూపానికి ఇక్కడ నేరమైన, సహజమైన అర్థం ‘విన్నారు.’
- source_word: אֵת אֲשֶׁר
  choice: చేసినది
  rationale: కర్మ సూచికతో కూడిన సంబంధవాచకం, వారు విన్న విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘చేసినది’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: עָשָׂה
  choice: చేసినది
  rationale: עָשָׂה యొక్క ప్రాథమిక అర్థం ‘చేయడం.’ యెహోషువ చేసిన కార్యాలను సూచించేలా తెలుగులో సంబంధక్రియా నిర్మాణం వాడాం.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: לִֽ/ירִיחוֹ
  choice: యెరికోకు
  rationale: ל ఉపసర్గ ఇక్కడ యెహోషువ చర్య ఏ పట్టణంపై directed అయిందో సూచిస్తుంది. ‘మీద/విరోధంగా’ అని వివరణాత్మకంగా చేయకుండా నేరమైన ‘కు’ రూపాన్ని నిలిపాం.
- source_word: וְ/לָ/עָי
  choice: హాయికి
  rationale: యెరికోకు సమాంతరంగా ל ను ‘కు’తో అనువదించాం; స్థలనామానికి తెలుగులో సాధారణ బైబిలు రూపమైన ‘హాయి’ వాడాం.
theological_decisions:
- issue: వచనారంభంలోని וְ అనుసంధాన పదం
  choice: అయితే
  alternative: మరియు
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; కథన ప్రవాహానికి సంబంధించినది. హెబ్రీ వְ సాధారణంగా ‘మరియు’ అని రావచ్చు, కాని 9:1–2లోని రాజుల ప్రతిస్పందనతో పోలిస్తే గిబియోను నివాసుల ప్రతిస్పందన భిన్నంగా ఉండటం వల్ల ‘అయితే’ సందర్భోచితంగా ఉంది. మూలంలోని సాధారణ సముచ్చయార్థాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నివాసులు,’ ‘విన్నారు,’ ‘చేసినది’ వంటి సాధారణ పదాలతో మూలానికి సమీపంగా ఉంచాం; స్థలనామాలకు ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపాలు వాడాం.
