revisions:
- from: అయితే గిబియోను నివాసులు యెహోషువ యెరికోకు, హాయికి చేసినది విన్నారు.[a]
  to: అయితే గిబియోను నివాసులు యెహోషువ యెరికోకూ హాయికీ ఏమి చేశాడో విన్నారు.[a]
