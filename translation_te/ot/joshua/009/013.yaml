reference: Joshua 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה נֹאד֤וֹת הַ/יַּ֨יִן֙ אֲשֶׁ֣ר מִלֵּ֣אנוּ חֲדָשִׁ֔ים וְ/הִנֵּ֖ה הִתְבַּקָּ֑עוּ וְ/אֵ֤לֶּה שַׂלְמוֹתֵ֨י/נוּ֙ וּ/נְעָלֵ֔י/נוּ בָּל֕וּ מֵ/רֹ֥ב הַ/דֶּ֖רֶךְ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/013.yaml
  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
translation:
  language: te
  text: ఈ ద్రాక్షారసపు తోలుతిత్తులను చూడండి—వీటిని మేము కొత్తగా ఉన్నప్పుడే నింపాము; ఇవిగో, అవి పగిలిపోయాయి[a]. మా ఈ వస్త్రాలు, చెప్పులు కూడా ప్రయాణం చాలా సుదీర్ఘంగా ఉండడం వల్ల అరిగిపోయాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చీలిపోయాయి.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ప్రయాణం యొక్క గొప్ప పరిమాణం వల్ల, ఎంతో.” అంటే ప్రయాణం అసాధారణంగా సుదీర్ఘంగా లేదా దూరంగా సాగింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  choice: ద్రాక్షారసంతో నింపిన ... తోలు తిత్తులు
  rationale: נֹאד అనేది ద్రవాలను, ఇక్కడ ద్రాక్షారసాన్ని, ఉంచే జంతుచర్మపు సంచి. ఆధునిక తెలుగు పాఠకునికి పదార్థం మరియు ఉపయోగం రెండూ స్పష్టమయ్యేలా ‘తోలు తిత్తులు’ అని ఇచ్చాం.
- source_word: מִלֵּאנוּ חֲדָשִׁים
  choice: మేము కొత్తగా ఉన్నప్పుడే ... నింపిన
  rationale: חֲדָשִׁים అనే విశేషణం తోలు తిత్తులను సూచిస్తుంది; అవి కొత్తగా ఉన్న సమయంలో నింపారని సహజమైన తెలుగులో స్పష్టం చేశాం.
- source_word: וְהִנֵּה
  choice: చూడండి—ఇవిగో
  rationale: హిన్నే అనే అవధాన సూచక పదంలోని చూపించే, దృష్టిని ఆకర్షించే బలాన్ని సహజ తెలుగులో నిలిపాం.
- source_word: הִתְבַּקָּעוּ
  choice: పగిలిపోయాయి
  rationale: ఈ రూపం చీలిపోవడం లేదా పగిలిపోవడం వల్ల ఏర్పడిన స్థితిని సూచిస్తుంది. తోలు తిత్తుల సందర్భంలో ‘పగిలిపోయాయి’ సహజంగా ఉంటుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: שַׂלְמוֹתֵינוּ
  choice: మా ... వస్త్రాలు
  rationale: ఈ నామవాచకం సాధారణంగా దుస్తులు లేదా వస్త్రాలను సూచిస్తుంది. గౌరవప్రదమైన ఆధునిక కథన శైలికి ‘వస్త్రాలు’ సరిపోతుంది.
- source_word: נְעָלֵינוּ
  choice: మా ... చెప్పులు
  rationale: נַעַל పాదరక్షను సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో విస్తృతంగా అర్థమయ్యే ‘చెప్పులు’ను ఎంచుకున్నాం.
- source_word: בָּלוּ
  choice: అరిగిపోయాయి
  rationale: వాడకం లేదా దీర్ఘ ప్రయాణం వల్ల పాతబడి పనికిరాని స్థితికి చేరడాన్ని ఈ క్రియ సూచిస్తుంది; ‘అరిగిపోయాయి’ ఫలిత స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  choice: ప్రయాణం ఎంతో ఎక్కువ కావడం వల్ల
  rationale: హీబ్రూ ప్రయాణపు అత్యధిక పరిమాణం లేదా విస్తారాన్ని కారణంగా పేర్కొంటుంది. ‘ఎంతో ఎక్కువ’ מְאֹד తీవ్రతను ఉంచుతూ, దూరం లేదా కాలం అనే ఒక్క అర్థానికి అనవసరంగా పరిమితం చేయదు.
