  text: זֶ֣ה לַחְמֵ֗/נוּ חָ֞ם הִצְטַיַּ֤דְנוּ אֹת/וֹ֙ מִ/בָּ֣תֵּ֔י/נוּ בְּ/י֥וֹם צֵאתֵ֖/נוּ לָ/לֶ֣כֶת אֲלֵי/כֶ֑ם וְ/עַתָּה֙ הִנֵּ֣ה יָבֵ֔שׁ וְ/הָיָ֖ה נִקֻּדִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
translation:
  language: te
  text: “ఇదిగో, మా ఈ రొట్టె. మేము మీ దగ్గరికి రావడానికి బయలుదేరిన రోజున మా ఇళ్ల నుంచి దీన్ని ప్రయాణ ఆహారంగా తీసుకున్నప్పుడు ఇది వెచ్చగా ఉండేది. కానీ ఇప్పుడు చూడండి, ఇది ఎండిపోయి మచ్చలు పడింది[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బూజు పట్టింది,” “పగుళ్లు పడింది,” లేక “పొడిబారి నలిగిపోయింది.” హెబ్రీ పదం చుక్కలు లేదా మచ్చలతో గుర్తించబడిన స్థితిని సూచిస్తుంది; పాత రొట్టె సందర్భంలో దాని ఖచ్చితమైన భావం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  choice: మన ఈ రొట్టెను చూడండి
  rationale: సూచనార్థకమైన זֶה యొక్క ప్రత్యక్షతను సహజమైన తెలుగు వాక్యంగా వ్యక్తపరుస్తూ, ‘మన రొట్టె’ అనే స్వామ్య భావాన్ని నిలుపుతుంది.
- source_word: חָם
  choice: వెచ్చగా
  rationale: మూలంలోని ‘వెచ్చగా/వేడిగా’ అనే ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; ‘తాజాగా’ అనడం సందర్భార్థాన్ని మరీ స్పష్టీకరించినట్లవుతుంది.
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  choice: దీన్ని ప్రయాణ ఆహారంగా తీసుకున్నప్పుడు
  rationale: ప్రయాణానికి కావలసిన సరఫరాగా సిద్ధం చేసుకోవడం అనే హిత్పయేల్ క్రియ భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִבָּתֵּינוּ
  choice: మా ఇళ్ల నుంచి
  rationale: మూలంలోని బహువచనమైన ‘ఇళ్లు’ను యథాతథంగా నిలుపుతుంది.
- source_word: בְּיוֹם צֵאתֵנוּ לָלֶכֶת אֲלֵיכֶם
  choice: మేము మీ దగ్గరికి రావడానికి బయలుదేరిన రోజున
  rationale: ప్రయాణం మొదలుపెట్టిన సమయాన్ని సహజంగా వ్యక్తపరుస్తుంది. హెబ్రీలో అక్షరార్థంగా ‘మీ దగ్గరికి వెళ్లడానికి’ ఉన్నా, ఎదురుగా ఉన్నవారితో మాట్లాడే తెలుగులో ‘మీ దగ్గరికి రావడానికి’ సహజం.
- source_word: וְעַתָּה הִנֵּה
  choice: కానీ ఇప్పుడు చూడండి
  rationale: గత స్థితితో వ్యత్యాసాన్ని, ప్రస్తుతం చూపిస్తున్న సాక్ష్యంపై దృష్టిని రెండింటినీ నిలుపుతుంది.
- source_word: יָבֵשׁ
  choice: ఎండిపోయి
  rationale: రొట్టె ఇప్పుడు పొడిబారిన స్థితికి చేరిందనే సందర్భోచిత భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְהָיָה נִקֻּדִים
  choice: మచ్చలు పడింది
  rationale: נִקֻּדִים యొక్క ప్రాథమిక ‘చుక్కలు లేదా మచ్చలతో గుర్తించబడిన’ భావాన్ని నిలుపుతుంది; అది బూజా, పగుళ్లా, లేక పొడిబారి నలిగిన రూపమా అనే అనిశ్చితిని ప్రధాన పాఠంలో పరిష్కరించదు.
