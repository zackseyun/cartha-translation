  yaml_path: translation/ot/joshua/009/025.yaml
  text: And now[a], here we are in your hand. Do to us as it is good and right in your eyes to do.
translation:
  language: te
  text: ఇప్పుడు, ఇదిగో, మేము నీ చేతిలో ఉన్నాం.[a] నీ దృష్టికి మంచిదీ సరైనదీ ఏదో, మాతో అలా చేయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, “మేము నీ అధికారంలో ఉన్నాం” లేదా “మా విషయంలో నిర్ణయం నీదే.”
    reason: హీబ్రూ ‘నీ చేతిలో’ అనే రూపకానికి భావ వివరణ.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ప్రస్తుత పరిస్థితిలో గిబియోనీయుల సమర్పణను పరిచయం చేసే కాలసూచక పదం. తెలుగులో వాక్యారంభంలో ‘ఇప్పుడు’ సహజంగా ఉండి భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הִנְנוּ
  choice: ఇదిగో, మేము
  rationale: సమక్షంలో ఉన్న తమను తాము చూపిస్తూ చెప్పే హీబ్రూ ప్రస్తుతీకరణను ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: בְיָדֶךָ
  choice: నీ చేతిలో ఉన్నాం
  rationale: ఎదుటివారి అధికారానికి, నిర్ణయానికి లోబడి ఉండడాన్ని తెలిపే హీబ్రూ రూపకాన్ని యథాతథంగా ఉంచుతుంది; తెలుగులోనూ ఈ రూపకం అర్థవంతంగా ఉంది.
- source_word: כַּטּוֹב
  choice: మంచిదీ
  rationale: טוב అనే విశేషణం యొక్క ప్రాథమిక అర్థాన్ని నేరుగా అందిస్తుంది.
- source_word: וְכַיָּשָׁר
  choice: సరైనదీ
  rationale: ישר ఇక్కడ నిటారుతనం కంటే న్యాయమైనది, సముచితమైనది అనే మూల్యాంకన భావాన్ని సూచిస్తుంది; ‘సరైనది’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: בְּעֵינֶיךָ
  choice: నీ దృష్టికి
  rationale: ‘నీ కళ్లలో’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజమైన మూల్యాంకన వ్యక్తీకరణగా అందిస్తూ దాని భావాన్ని కాపాడుతుంది.
- source_word: לַעֲשׂוֹת לָנוּ עֲשֵׂה
  choice: మాకు అదే చేయి
  rationale: అనంతక్రియతో కూడిన ఆజ్ఞారూప పునరుక్తిని తెలుగులో యాంత్రికంగా పునరావృతం చేయకుండా, ‘ఏదో ... అదే చేయి’ అనే నిర్మాణంతో చర్యనూ అభ్యర్థనలోని బలాన్నీ నిలుపుతుంది.
