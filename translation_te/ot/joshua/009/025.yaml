    text: అంటే, “మేము నీ అధికారంలో ఉన్నాం” లేదా “మా విషయంలో నిర్ణయం నీదే.”
    reason: హీబ్రూ ‘నీ చేతిలో’ అనే రూపకానికి భావ వివరణ.
  revision_rationale: The revision changes only the final Telugu object construction from “మాకు” to “మాతో,” so that the request clearly means “deal with us/do to us” rather than potentially “do for us.” The Hebrew metaphor and the source’s evaluative wording remain intact.
