reference: Joshua 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א לָ/הֶם֙ יְהוֹשֻׁ֔עַ וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם לֵ/אמֹ֑ר לָ/מָּה֩ רִמִּיתֶ֨ם אֹתָ֜/נוּ לֵ/אמֹ֗ר רְחוֹקִ֨ים אֲנַ֤חְנוּ מִ/כֶּם֙ מְאֹ֔ד וְ/אַתֶּ֖ם בְּ/קִרְבֵּ֥/נוּ יֹשְׁבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
translation:
  language: te
  text: 'అప్పుడు యెహోషువ వారిని పిలిచి వారితో ఇలా అన్నాడు: “మీరు మా మధ్య నివసిస్తుండగా, ‘మేము మీ నుండి చాలా దూరంలో ఉన్నాం’ అని చెప్పి మమ్మల్ని ఎందుకు మోసం చేశారు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא לָהֶם
  choice: వారిని పిలిచి
  rationale: ఈ సందర్భంలో కרא గిబియోనీయులను తన ఎదుటికి పిలిపించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వారిని పిలిచి’ సహజంగా ఉండి మూల భావాన్ని నిలుపుతుంది.
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  choice: వారితో ఇలా అన్నాడు
  rationale: హీబ్రూ భాషలోని సాధారణ వాక్యారంభ సూత్రాన్ని పదేపదే అనుకరించకుండా, దాని పూర్తి సంభాషణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָמָּה רִמִּיתֶם אֹתָנוּ
  choice: మమ్మల్ని ఎందుకు మోసం చేశారు?
  rationale: రמה పియేల్ రూపం ఉద్దేశపూర్వకమైన వంచనను సూచిస్తుంది; ‘మోసం చేశారు’ స్పష్టమైన, గంభీరమైన తెలుగు సమానార్థకం.
- source_word: רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד
  choice: మేము మీకు చాలా దూరంలో ఉన్నాం
  rationale: רחוקים ... מאד లోని దూరపు తీవ్రతను ‘చాలా దూరంలో’ నేరుగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘వచ్చాం’ అనే భావాన్ని చేర్చలేదు.
- source_word: בְּקִרְבֵּנוּ
  choice: మా మధ్యనే
  rationale: ఈ సందర్భంలో ‘మా మధ్య/మా నడుమ’ అనే స్థానార్థం ఉంది. ‘మధ్యనే’ అనే నొక్కి చెప్పడం, వారు చాలా దూరంలో కాక ఇశ్రాయేలీయుల సమీపంలోనే నివసిస్తున్నారనే వ్యతిరేకతను సహజంగా చూపుతుంది.
- source_word: יֹשְׁבִים
  choice: నివసిస్తున్నారు
  rationale: ישב యొక్క కృదంత రూపం కొనసాగుతున్న స్థిర నివాసాన్ని సూచిస్తుంది; ‘నివసిస్తున్నారు’ దానిని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఒడంబడికకు సంబంధించిన అంతర్భావాన్ని అనువాదంలో విస్తరించాలా?
  choice: భౌగోళిక దూరం గురించి వారు చెప్పిన అబద్ధంపైనే యెహోషువ చేసిన ఆరోపణగా అనువదించాం.
  alternative: ఈ మోసాన్ని ఒడంబడిక ఉల్లంఘనగా ప్రధాన వచనంలోనే విస్తరించి చెప్పడం.
  rationale: ఈ వచనం నేరుగా వారి అబద్ధపు దూర వాదనను మాత్రమే ప్రస్తావిస్తుంది. ఒడంబడిక సంబంధిత పరిణామాలు సందర్భంలో ఉన్నప్పటికీ, వాటిని ఈ వాక్యంలో చేర్చడం మూలపాఠాన్ని మించి వ్యాఖ్యానించడం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథన గాంభీర్యాన్ని కాపాడే శైలి. హీబ్రూ వాక్యంలోని వ్యతిరేకతను తెలుగులో సహజంగా చూపేందుకు చివరి పరిస్థితి-వాక్యాన్ని ముందుకు తెచ్చాం; భావార్థం మార్చలేదు.
