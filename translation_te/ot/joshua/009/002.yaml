translation:
  language: te
  text: వారు యెహోషువతోను ఇశ్రాయేలుతోను యుద్ధం చేయడానికి కలిసి, ఏకాభిప్రాయంతో సమకూడారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఒకే నోటితో’; ఈ హీబ్రూ నుడికారం సంపూర్ణ ఐక్యతతో లేదా సమ్మతితో కలిసి పనిచేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: సమకూడారు
  rationale: నిఫల్ రూపం ఒక సమూహంగా కూడడాన్ని సూచిస్తుంది. ‘సమకూడారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, సామూహిక చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: יַחְדָּו
  choice: ఏకాభిప్రాయంతో
  rationale: ఈ సందర్భంలో చివరి ‘ఒకే నోటితో’ అనే నుడికారంతో కలిసి, వారు ఐక్య ఉద్దేశంతో చర్య చేపట్టారని తెలియజేస్తుంది; తెలుగులో అనవసర పునరుక్తి లేకుండా భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לְהִלָּחֵם
  choice: యుద్ధం చేయడానికి
  rationale: לחם నిఫల్ క్రియారూపం యుద్ధంలో తలపడడాన్ని సూచిస్తుంది. ‘యుద్ధం చేయడానికి’ ఉద్దేశాన్ని స్పష్టంగా, గౌరవప్రదమైన సాధారణ భాషలో తెలియజేస్తుంది.
- source_word: עִם
  choice: తో
  rationale: యుద్ధాన్ని సూచించే క్రియతో వచ్చినప్పుడు עִם ప్రతికూల సంబంధాన్ని, అంటే ఎవరితో యుద్ధం చేయడమో సూచిస్తుంది. తెలుగులో ‘యెహోషువతో యుద్ధం చేయడం’ సహజంగానే ప్రతికూల భావాన్ని ఇస్తుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: וְעִם יִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో
  rationale: మూలంలోని పునరుక్త సంబంధాన్ని తెలుగులో రెండవ ‘తో’ ప్రత్యయంతో నిలుపుతూ, యుద్ధ సందర్భంలోని ప్రతికూల అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: פֶּה אֶחָד
  choice: ఏకాభిప్రాయంతో
  rationale: అక్షరార్థంగా ‘ఒకే నోరు’; ఇది సంపూర్ణ సమ్మతి లేదా ఐక్య ఉద్దేశాన్ని తెలిపే హీబ్రూ నుడికారం. ‘ఏకాభిప్రాయంతో’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
