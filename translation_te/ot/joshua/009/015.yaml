id: JOS.9.15
reference: Joshua 9:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ לָ/הֶ֤ם יְהוֹשֻׁ֨עַ֙ שָׁל֔וֹם וַ/יִּכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית לְ/חַיּוֹתָ֑/ם וַ/יִּשָּׁבְע֣וּ לָ/הֶ֔ם נְשִׂיאֵ֖י הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/015.yaml
  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
translation:
  language: te
  text: యెహోషువ వారితో శాంతి కుదుర్చుకొని, వారిని బ్రతకనివ్వడానికి వారితో నిబంధన కుదుర్చుకున్నాడు[a]; సమాజపు నాయకులు వారికి ప్రమాణం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “వారితో నిబంధన కోశాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם יְהוֹשֻׁעַ שָׁלוֹם
  choice: యెహోషువ వారితో శాంతి ఒప్పందం చేసుకొని
  rationale: עשה שלום అనే హీబ్రూ ప్రయోగం శాంతియుత సంబంధాలను లేదా శాంతి షరతులను స్థాపించడాన్ని సూచిస్తుంది. ‘శాంతి ఒప్పందం చేసుకొని’ అనేది సందర్భంలోని రాజకీయ-నిబంధన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: వారితో నిబంధన చేశాడు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నిబంధన కోశాడు’ అనే సంప్రదాయ ప్రయోగం ఉంది. తెలుగులో ఆ రూపం అసహజంగా, అపార్థానికి దారితీయగలదిగా ఉండటంతో, దాని స్థిరమైన భావాన్ని ‘నిబంధన చేశాడు’ అని అనువదించాం; మూలభాషా రూపకాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְחַיּוֹתָם
  choice: వారిని ప్రాణాలతో ఉంచడానికి
  rationale: ఈ ఉద్దేశార్థక క్రియారూపం వారు జీవించి ఉండేలా చేయడమే నిబంధన ఉద్దేశమని తెలుపుతుంది. ఈ అనువాదం ‘వారిని బతకనివ్వడానికి’ మరియు ‘వారి ప్రాణాలను కాపాడడానికి’ మధ్యనున్న భావవిస్తృతిని అతిగా కుదించదు.
- source_word: וַיִּשָּׁבְעוּ לָהֶם
  choice: వారికి ప్రమాణం చేశారు
  rationale: שבע అనే క్రియ ఇక్కడ ప్రమాణం చేయడాన్ని సూచిస్తుంది. ‘వారికి ప్రమాణం చేశారు’ సంక్షిప్తంగా, సహజంగా ఉండి ప్రమాణబద్ధతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: సమాజపు నాయకులు
  rationale: נשיאים గుర్తింపు పొందిన నాయకులను, עדה కూడిన సమాజాన్ని సూచిస్తాయి. ‘సమాజపు నాయకులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, తరువాతి కాలపు ప్రత్యేక మతపరమైన సంస్థార్థాన్ని అనవసరంగా దిగుమతి చేయదు.
theological_decisions:
- issue: నిబంధనకు సంబంధించిన హీబ్రూ ప్రయోగం
  choice: నిబంధన చేశాడు
  alternative: నిబంధన కోశాడు
  rationale: మూలంలో כרת ברית అనే అక్షరార్థ రూపకం న్యాయపరమైన, నిబంధనాత్మక గంభీరతను కలిగి ఉంది. అయితే తెలుగులో ‘నిబంధన కోయడం’ స్థిరప్రయోగం కాదు; అందువల్ల ప్రధాన పాఠ్యంలో సహజమైన భావానువాదాన్ని ఇచ్చి, మూల రూపకాన్ని పాదసూచికలో సంరక్షించాం.
- issue: הָעֵדָה పదానికి అనువాదం
  choice: సమాజం
  alternative: సభ / సమూహం
  rationale: ఈ పదం ఇశ్రాయేలు సమష్టి సమాజాన్ని సూచిస్తుంది. ‘సమాజం’ ఆ సమష్టి భావాన్ని నిలుపుతూ, ఆధునిక సంఘ వ్యవస్థను లేదా ప్రత్యేక denominational అర్థాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు స్పష్టతను కాపాడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, చర్యల క్రమాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ఉంచింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
