    text: లేదా, “చెక్కలు కోసేవారు, నీరు తోడేవారు.”
    reason: lexical_alternative
  revision_rationale: 'The revision supplies the natural Telugu object marker in the leaders’ decree and identifies the Gibeonites in the resulting clause so that the imposed role is not mistakenly assigned to the leaders. It retains the Hebrew sequence and force: the leaders’ decision, the Gibeonites’ resulting labor for the entire assembly, and conformity with what the leaders had said. The footnote is revised to provide a real lexical alternative.'
