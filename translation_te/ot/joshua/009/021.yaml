source:
  edition: WLC
  text: וַ/יֹּאמְר֧וּ אֲלֵי/הֶ֛ם הַ/נְּשִׂיאִ֖ים יִֽחְי֑וּ וַ֠/יִּֽהְיוּ חֹטְבֵ֨י עֵצִ֤ים וְ/שֹֽׁאֲבֵי מַ֨יִם֙ לְ/כָל הָ֣/עֵדָ֔ה כַּ/אֲשֶׁ֛ר דִּבְּר֥וּ לָ/הֶ֖ם הַ/נְּשִׂיאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/021.yaml
  text: The leaders said to them[a], “Let them live.” So they became woodcutters and water-drawers for all the congregation, just as the leaders had spoken to them.
translation:
  language: te
  text: నాయకులు వారితో, “వారిని బ్రతకనివ్వండి” అన్నారు. అప్పుడు గిబియోనీయులు సమాజమంతటికీ కలప నరికేవారుగాను నీరు తోడేవారుగాను[a] అయ్యారు; నాయకులు వారికి చెప్పినట్లుగానే జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెక్కలు కోసేవారు, నీరు తోడేవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  choice: నాయకులు
  rationale: ఇశ్రాయేలు సమాజానికి గుర్తింపు పొందిన అధిపతులను సూచించే ఆధునిక, సహజమైన పదం.
- source_word: יִחְיוּ
  choice: వారు బతకనివ్వండి
  rationale: ఇక్కడి అసంపూర్ణ క్రియ ఆజ్ఞార్థక అనుమతి లేదా తీర్పును వ్యక్తం చేస్తుంది; వారిని చంపకుండా ఉండాలనే నిర్ణయాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּהְיוּ
  choice: అయ్యారు
  rationale: గిబియోనీయులకు విధించిన కొత్త సేవా స్థితిలోకి వచ్చిన మార్పును సూచిస్తుంది.
- source_word: חֹטְבֵי עֵצִים
  choice: కట్టెలు నరికేవారు
  rationale: కొనసాగుతూ చేసే శ్రమను సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం; మూలంలోని ‘కలపను నరికడం’ అనే స్పష్టమైన చిత్రాన్ని నిలుపుతుంది.
- source_word: שֹׁאֲבֵי מַיִם
  choice: నీళ్లు తోడేవారు
  rationale: బావి లేదా నీటి వనరు నుంచి నీటిని తోడే పనిని నిర్దిష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְכָל הָעֵדָה
  choice: సమాజమంతటికీ
  rationale: ఇక్కడ עֵדָה ఇశ్రాయేలు ప్రజల సమిష్టి సమాజాన్ని సూచిస్తుంది; ‘సమాజమంతటికీ’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి సమూహ భావాన్ని కాపాడుతుంది.
- source_word: כַּאֲשֶׁר דִּבְּרוּ לָהֶם
  choice: నాయకులు వారితో చెప్పినట్లే
  rationale: వారి సేవా స్థితి నాయకులు ముందుగా ప్రకటించిన నిర్ణయానికి అనుగుణంగా ఏర్పడిందని తెలియజేస్తుంది.
