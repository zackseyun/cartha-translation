id: JOS.9.11
reference: Joshua 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלֵ֡י/נוּ זְֽקֵינֵי/נוּ֩ וְ/כָל יֹשְׁבֵ֨י אַרְצֵ֜/נוּ לֵ/אמֹ֗ר קְח֨וּ בְ/יֶדְ/כֶ֤ם צֵידָה֙ לַ/דֶּ֔רֶךְ וּ/לְכ֖וּ לִ/קְרָאתָ֑/ם וַ/אֲמַרְתֶּ֤ם אֲלֵי/הֶם֙ עַבְדֵי/כֶ֣ם אֲנַ֔חְנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
translation:
  language: te
  text: 'అప్పుడు మా పెద్దలూ, మా దేశంలోని నివాసులందరూ మాతో ఇలా అన్నారు: ‘ప్రయాణానికి కావలసిన సరంజామాను మీ వెంట తీసుకొని, వారిని కలవడానికి వెళ్లండి. వారితో ఇలా చెప్పండి: “మేము మీ సేవకులము; ఇప్పుడు మాతో నిబంధన చేయండి.”’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זְקֵינֵינוּ
  choice: మా పెద్దలు
  rationale: సందర్భంలో ఇది కేవలం వృద్ధ పురుషులను కాక, సమాజ నాయకులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పెద్దలు’ సహజంగా ఆ పాత్రను తెలియజేస్తుంది.
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  choice: మా దేశ నివాసులందరూ
  rationale: భూమి లేదా దేశంలో నివసించే సమస్త ప్రజల సమూహార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: צֵידָה
  choice: ప్రయాణానికి కావలసిన ఆహారం
  rationale: ఈ పదం ప్రయాణానికి తీసుకెళ్లే ఆహార సరఫరాను సూచిస్తుంది; సందర్భంలో స్పష్టంగా, సామాన్య పాఠకులకు సహజంగా ఉంది.
- source_word: בְיֶדְכֶם
  choice: మీ వెంట తీసుకొని
  rationale: అక్షరార్థం ‘మీ చేతిలో’; తెలుగులో దాని భావాన్ని సహజంగా వ్యక్తపరచడానికి ‘మీ వెంట తీసుకొని’ అని అనువదించబడింది.
- source_word: לַדֶּרֶךְ
  choice: ప్రయాణానికి
  rationale: ఇక్కడ דֶּרֶךְ ప్రయాణాన్ని సూచిస్తుంది; ‘ప్రయాణానికి’ ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִקְרָאתָם
  choice: వారిని కలుసుకోవడానికి
  rationale: ఎదురుగా వెళ్లి కలుసుకోవడం అనే భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עַבְדֵיכֶם
  choice: మీ సేవకులం
  rationale: עבד అనే పదానికి ‘దాసులు’ అనే అర్థం కూడా ఉన్నప్పటికీ, ఇక్కడ ఒప్పందం కోరే వినయపూర్వక దౌత్య భాష కావడంతో ‘సేవకులు’ సందర్భోచితం.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: మాతో నిబంధన చేసుకోండి
  rationale: హీబ్రూ అక్షరార్థం ‘నిబంధనను కోయండి’; అది నిబంధన స్థాపించడాన్ని తెలిపే స్థిర జాతీయ ప్రయోగం. తెలుగులో ‘నిబంధన చేసుకోండి’ సహజంగా ఉండి పరస్పర ఒప్పంద భావాన్ని కాపాడుతుంది.
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: విన్నపంలోని తదుపరి అంశానికి మార్పును సూటిగా తెలియజేస్తుంది.
- source_word: וַיֹּאמְרוּ אֵלֵינוּ ... לֵאמֹר
  choice: మాతో ఇలా అన్నారు
  rationale: హీబ్రూ వాక్యప్రవేశ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా సంక్షిప్తీకరిస్తూ, తరువాతి ప్రత్యక్ష ఉటంకింపును పరిచయం చేస్తుంది.
theological_decisions:
- issue: עַבְדֵיכֶם యొక్క సామాజిక స్థితి
  choice: మీ సేవకులం
  alternative: మీ దాసులం
  rationale: ఈ సందర్భంలో వక్తలు బానిసత్వ స్థితిని ప్రకటించడం కంటే వినయపూర్వకంగా లోబడిన భాషను ఉపయోగిస్తున్నారు; అయినప్పటికీ మూలపదానికి ‘దాసులు’ అనే విస్తృత అర్థం ఉండటాన్ని పాదసూచికలో ఉంచాం.
- issue: בְרִית యొక్క సందర్భార్థం
  choice: నిబంధన
  alternative: ఒప్పందం
  rationale: ఇది రాజకీయ ఒప్పందాన్ని సూచించగలిగినా, హీబ్రూ בְרִית యొక్క విస్తృత బైబిలు భావాన్ని ముందే సంకుచితం చేయకుండా ‘నిబంధన’గా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘మీ చేతుల్లో’ అనే మూలభాషా రూపాన్ని తెలుగులో కృత్రిమంగా ఉంచకుండా ‘మీ వెంట’గా భావానువాదం చేశాం. ప్రత్యక్ష ఉటంకింపులోని వినయపూర్వక దౌత్య ధోరణిని నిలిపాం.
