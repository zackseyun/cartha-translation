  - severity: low
    issue: ‘ఆయన కీర్తిని విన్నాము’ is slightly awkward Telugu for hearing of someone’s renown.
    rationale: ‘ఆయన ప్రఖ్యాతి గురించి విన్నాము’ is more idiomatic while retaining the sense of the Hebrew cognate expression; the footnote can preserve ‘report/news’ as an alternative.
  - severity: low
