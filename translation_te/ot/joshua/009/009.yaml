id: JOS.9.9
reference: Joshua 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו מֵ/אֶ֨רֶץ רְחוֹקָ֤ה מְאֹד֙ בָּ֣אוּ עֲבָדֶ֔י/ךָ לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּֽי שָׁמַ֣עְנוּ שָׁמְע֔/וֹ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/009.yaml
  text: And they said to him[a], “Your servants have come from a very distant land for the name of Yahweh your God, for we have heard of his fame and all that he did in Egypt.”
translation:
  language: te
  text: 'వారు అతనితో ఇలా అన్నారు: “నీ సేవకులమైన మేము చాలా దూరమైన దేశం నుండి నీ దేవుడైన యాహ్వే నామాన్ని బట్టి వచ్చాము; ఎందుకంటే ఆయన ప్రఖ్యాతి గురించి[a], ఐగుప్తులో ఆయన చేసినదంతటినీ మేము విన్నాము.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయన గురించిన వార్తను” లేక “ఆయన కీర్తిని.” హీబ్రూలో ఒకే మూలానికి చెందిన పదాలతో, అక్షరార్థంగా “ఆయన వినికిడిని/వార్తను విన్నాము” అనే భావప్రయోగం ఉంది.
    reason: שָׁמַעְנוּ שָׁמְעוֹ అనే సమానమూల పదప్రయోగంలోని ‘వార్త,’ ‘ప్రఖ్యాతి,’ ‘కీర్తి’ అనే భావసాధ్యతలను తెలియజేయడం.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: వారు అతనితో ఇలా అన్నారు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష సంభాషణ పరిచయంతో వ్యక్తం చేస్తుంది.
- source_word: מֵאֶרֶץ רְחוֹקָה מְאֹד
  choice: చాలా దూర దేశం నుండి
  rationale: רְחוֹקָה అనే ‘దూరమైన’ భావాన్నీ, מְאֹד అనే తీవ్రతనూ స్పష్టంగా నిలుపుతుంది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులమైన మేము
  rationale: ఇక్కడ ఇది దౌత్యపరమైన వినయపూర్వక స్వీయసంబోధన; ‘బానిసలు’ అనే బలమైన సామాజిక అర్థాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: לְשֵׁם יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా నామం నిమిత్తం
  rationale: לְשֵׁם లోని ఉద్దేశం లేదా కారణం అనే విస్తృత భావాన్ని ‘నామం నిమిత్తం’ నిలుపుతుంది; ‘నామం’ను కేవలం కీర్తిగా వివరణాత్మకంగా మార్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపంలో సూచిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు కారణాన్ని పరిచయం చేసే హీబ్రూ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שָׁמַעְנוּ שָׁמְעוֹ
  choice: ఆయన కీర్తిని ... మేము విన్నాము
  rationale: ‘వినడం’ మరియు ‘వార్త/పేరు/కీర్తి’తో కూడిన హీబ్రూ సమానమూల పదప్రయోగాన్ని తెలుగులో సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచుతుంది.
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה בְּמִצְרָיִם
  choice: ఐగుప్తులో ఆయన చేసినదంతటినీ
  rationale: హీబ్రూ వాక్యభాగంలోని సంపూర్ణతను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని ప్రత్యక్షంగా ఉంచుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది; ఖచ్చితమైన ప్రాచీన ఉచ్చారణపై ఉన్న అనిశ్చితిని సిద్ధాంతపరంగా పరిష్కరించదు.
- issue: לְשֵׁם లోని భావం
  choice: నామం నిమిత్తం
  alternative: కీర్తి కారణంగా
  rationale: ఈ పదబంధం ఉద్దేశం, కారణం, నామప్రఖ్యాతి వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠం ‘నామం’ను నిలిపి అసలు వాక్యంలోని భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దౌత్యపరమైన వినయాన్ని ‘నీ సేవకులమైన మేము’ ద్వారా, దైవనామాన్ని ‘యెహోవా’గా నిలిపింది.
