- from: హెష్బోను, మైదాన పీఠభూమిలో ఉన్న దాని పట్టణాలన్నీ—దీబోను, బామోత్-బయలు, బేత్-బయల్-మెయోను.[a]
  to: హెష్బోను, చదునైన పీఠభూమిలో ఉన్న దాని పట్టణాలన్నీ—దీబోను, బామోత్-బయలు, బేత్-బయలు-మెయోను.[a]
