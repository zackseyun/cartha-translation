  variant: modern standard Telugu
source:
  edition: WLC
  text: חֶשְׁבּ֥וֹן וְ/כָל עָרֶ֖י/הָ אֲשֶׁ֣ר בַּ/מִּישֹׁ֑ר דִּיבוֹן֙ וּ/בָמ֣וֹת בַּ֔עַל וּ/בֵ֖ית בַּ֥עַל מְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/017.yaml
  text: 'Heshbon and all its cities that are on the plateau: Dibon[a], Bamoth-baal, and Beth-baal-meon.'
translation:
  language: te
  text: హెష్బోను, చదునైన పీఠభూమిలో ఉన్న దాని పట్టణాలన్నీ—దీబోను, బామోత్-బయలు, బేత్-బయలు-మెయోను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మైదానంలో’ లేదా ‘చదునైన ఎత్తైన ప్రాంతంలో’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం యొర్దాను అవతల ఉన్న చదునైన పీఠభూమి ప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: హెష్బోను
  rationale: స్థలపేరు; హీబ్రూ రూపాన్ని తెలుగు ధ్వని పద్ధతికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְכָל עָרֶיהָ
  choice: దాని పట్టణాలన్నీ
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం హెష్బోనును సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ‘దాని’ అని ఇచ్చాం.
- source_word: אֲשֶׁר בַּמִּישֹׁר
  choice: మైదాన పీఠభూమిలో ఉన్న
  rationale: ఈ ట్రాన్స్‌జోర్డాన్ భౌగోళిక సందర్భంలో מִישׁוֹר సాధారణ లోతట్టు మైదానం కాకుండా చదునైన ఎత్తైన ప్రాంతాన్ని సూచిస్తుంది; మూలంలోని భావపరిధిని నిలుపుకోవడానికి ‘మైదాన పీఠభూమి’ని ఎంచుకున్నాం.
- source_word: דִּיבוֹן
  choice: దీబోను
  rationale: స్థలపేరును లిప్యంతరీకరించాం.
- source_word: וּבָמוֹת בַּעַל
  choice: బామోత్-బయలు
  rationale: ఈ సందర్భంలో ఇది ‘బయలు ఉన్నత స్థలాలు’ అనే సాధారణ పదబంధం కాక స్థలపేరు; అందువల్ల అనువదించకుండా సంయుక్త నామంగా లిప్యంతరీకరించాం.
- source_word: וּבֵית בַּעַל מְעוֹן
  choice: బేత్-బయల్-మెయోను
  rationale: సంయుక్త స్థలపేరు; בֵּית అనే భాగాన్ని ‘ఇల్లు’ అని అనువదించకుండా పేరులో భాగంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని అనుసరించాం. స్థలపేర్లను హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; భౌగోళిక పదంలోని నిజమైన అర్థవిస్తృతిని పాదటిప్పణిలో నిలిపాం.
