reference: Joshua 13:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִֽן הַ/שִּׁיח֞וֹר אֲשֶׁ֣ר עַל פְּנֵ֣י מִצְרַ֗יִם וְ/עַ֨ד גְּב֤וּל עֶקְרוֹן֙ צָפ֔וֹנָ/ה לַֽ/כְּנַעֲנִ֖י תֵּחָשֵׁ֑ב חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים הָ/עַזָּתִ֤י וְ/הָ/אַשְׁדּוֹדִי֙ הָ/אֶשְׁקְלוֹנִ֣י הַ/גִּתִּ֔י וְ/הָ/עֶקְרוֹנִ֖י וְ/הָ/עַוִּֽים־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: te
  text: 'ఈజిప్టుకు ఎదురుగా ఉన్న షీహోరు నుండి ఉత్తరాన ఎక్రోను సరిహద్దు వరకు ఉన్నది కనానీయుల భూభాగంగా పరిగణించబడుతుంది: ఫిలిష్తీయుల ఐదుగురు అధిపతులు—గాజా అధిపతి, అష్డోదు అధిపతి, అష్కెలోను అధిపతి, గాతు అధిపతి, ఎక్రోను అధిపతి—మరియు అవ్వీయులు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל־פְּנֵי מִצְרַיִם
  choice: ఈజిప్టుకు తూర్పున ఉన్న
  rationale: ఈ భౌగోళిక సందర్భంలో עַל־פְּנֵי అనేది ఈజిప్టు ఎదుట/సమీపంలో అనే మూలభావం కలిగి ఉన్నప్పటికీ, షీహోరు స్థానం దృష్ట్యా ‘తూర్పున’ అని సహజంగా స్పష్టం చేయబడింది.
- source_word: תֵּחָשֵׁב
  choice: లెక్కించబడుతుంది
  rationale: నిఫాల్ క్రియ యొక్క నిష్క్రియార్థాన్ని నిలుపుతూ, ఆ ప్రాంతం కనానీయుల భూభాగంగా పరిగణించబడుతుందనే భావాన్ని తెలుపుతుంది.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల ఐదుగురు పాలకులు
  rationale: סֶרֶן ఫిలిష్తీయ నగర-రాజ్యాల అధిపతిని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు ‘పాలకులు’ స్పష్టమైన, తటస్థ పదం.
- source_word: הָעַזָּתִי ... הָעֶקְרוֹנִי
  choice: గాజావారి ... ఎక్రోనువారి ప్రాంతాలు
  rationale: హీబ్రూ జాతి/నగర సంబంధ విశేషణాలను తెలుగులో సహజంగా వ్యక్తం చేసి, వాక్యంలోని భూభాగాల జాబితా భావాన్ని స్పష్టం చేస్తుంది.
- source_word: הָעַוִּים
  choice: అవ్వీయులు
  rationale: ప్రజాసమూహపు పేరును ధ్వన్యనుకరణతో అందించింది.
theological_decisions:
- issue: కనానీయుల భూభాగంగా లెక్కింపు మరియు ఫిలిష్తీయ పాలకుల జాబితా మధ్య సంబంధం
  choice: మొత్తం పేర్కొన్న ప్రాంతం కనానీయులదిగా లెక్కించబడుతుందని చెప్పి, అందులో ఫిలిష్తీయ పాలకుల ప్రాంతాలు మరియు అవ్వీయుల ప్రాంతం ఉన్నట్లు నిర్మాణం
  alternative: ఫిలిష్తీయుల ఐదుగురు పాలకులనే ‘కనానీయులు’గా లెక్కించినట్లు నిర్మాణం
  rationale: హీబ్రూ వాక్యనిర్మాణంలో కొంత సంక్లిష్టత ఉన్నా, భౌగోళిక ప్రాంత వివరణగా చదవడం సందర్భానుకూలం; ఏ సమూహపు ధార్మిక లేదా జాతి గుర్తింపును అవసరానికి మించి నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే భౌగోళిక-చారిత్రక శైలి వాడబడింది. స్థలనామాలు తెలుగు బైబిల్ వినియోగానికి దగ్గరగా ధ్వన్యనుకరించబడ్డాయి.
