  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన వచనం. ‘ఖడ్గం’ బైబిలు సందర్భానికి తగిన సుపరిచిత పదం; ‘సోదె చెప్పేవాడు’ సాధారణ పాఠకునికి ‘దైవజ్ఞుడు’ కంటే నేరుగా అర్థమవుతుంది. మూలంలోని అసాధారణ చివరి పదబంధాన్ని పాదటీకతో పారదర్శకంగా చూపించాం.
