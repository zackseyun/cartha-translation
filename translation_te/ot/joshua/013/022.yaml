source:
  edition: WLC
  text: וְ/אֶת בִּלְעָ֥ם בֶּן בְּע֖וֹר הַ/קּוֹסֵ֑ם הָרְג֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בַּ/חֶ֖רֶב אֶל חַלְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/022.yaml
  text: And Balaam son of Beor[a], the diviner, the sons of Israel killed with the sword among their slain.
translation:
  language: te
  text: ఇశ్రాయేలీయులు బెయోరు కుమారుడైన బిలాము అనే సోదె చెప్పువాణ్ణి, వారు చంపినవారితో పాటు ఖడ్గంతో చంపారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు చంపినవారి మధ్య.” చివరనున్న హెబ్రీ పదబంధం కొంత అసాధారణంగా ఉంది; ఇశ్రాయేలీయులు చంపిన ఇతరులతో సంబంధంగా బిలాము కూడా చంపబడ్డాడని అది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: బిలామును
  rationale: וְ ఇక్కడ జయవృత్తాంతంలో మరో విషయాన్ని కలుపుతుంది; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘మరియు’ అనకుండా, אֶת సూచించే కర్మను ‘బిలామును’ అనే ద్వితీయావిభక్తితో వ్యక్తం చేశాం.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: బెయోరు కుమారుడైన బిలాము
  rationale: వ్యక్తిపేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, హెబ్రీ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: הַקּוֹסֵם
  choice: సోదె చెప్పేవాడు
  rationale: קֹסֵם అంటే దైవజ్ఞానం లేదా శకునవిద్య ఆచరించే వ్యక్తి. ‘సోదె చెప్పేవాడు’ సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, పదంలోని ప్రతికూల భావాన్ని కాపాడుతుంది.
- source_word: הָרְגוּ
  choice: చంపారు
  rationale: హెబ్రీ సాధారణ క్రియను అదనపు అలంకార భావం చేర్చకుండా స్పష్టమైన ఆధునిక తెలుగులో అనువదించాం.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీలోని అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలిపి, కర్తను స్పష్టంగా ఉంచాం.
- source_word: בַּחֶרֶב
  choice: ఖడ్గంతో
  rationale: కరణార్థక בְను ‘తో’ ద్వారా వ్యక్తం చేశాం; ఇది యుద్ధంలో ఖడ్గం చేత చంపడాన్ని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: אֶל חַלְלֵיהֶם
  choice: తమచేత చంపబడినవారితో పాటు
  rationale: చివరి హెబ్రీ పదబంధం అసాధారణంగా ఉంది. ఇక్కడ אֶל అనుబంధం లేదా చేరికను సూచిస్తున్నట్లు గ్రహించి ‘తో పాటు’ అని ఇచ్చాం; ‘వారి హతుల మధ్య’ అనే భావం కూడా సాధ్యమని పాదటీకలో నిలిపాం.
