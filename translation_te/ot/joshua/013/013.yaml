source:
  edition: WLC
  text: וְ/לֹ֤א הוֹרִ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/גְּשׁוּרִ֖י וְ/אֶת הַ/מַּעֲכָתִ֑י וַ/יֵּ֨שֶׁב גְּשׁ֤וּר וּ/מַֽעֲכָת֙ בְּ/קֶ֣רֶב יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/013.yaml
  text: But the sons of Israel did not drive out the Geshurites or the Maacathites, and Geshur and Maacath lived among Israel to this day.
translation:
  language: te
  text: అయితే ఇశ్రాయేలు ప్రజలు గెషూరీయులను, మయకాతీయులను వెళ్లగొట్టలేదు. గెషూరు, మయకా ప్రజలు ఈ దినం వరకు ఇశ్రాయేలు ప్రజల మధ్య నివసించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ సమష్టిగా ఇశ్రాయేలు జనాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రజలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הוֹרִישׁוּ
  choice: వెళ్లగొట్టలేదు
  rationale: హిఫీల్ రూపం ఇక్కడ ఆ ప్రాంతం నుండి తొలగించడం లేదా తరిమివేయడం అనే భావాన్ని ఇస్తుంది.
- source_word: הַגְּשׁוּרִי וְאֶת הַמַּעֲכָתִי
  choice: గెషూరీయులను, మయకాతీయులను
  rationale: ఇవి రెండు ప్రజావర్గాల పేర్లు; తెలుగులో జాతి/ప్రాంతీయ సమూహాలను సూచించే సహజ బహువచన రూపాలు వాడబడ్డాయి.
- source_word: וַיֵּשֶׁב
  choice: నివసించారు
  rationale: ఏకవచన హీబ్రూ క్రియ సమష్టి పేర్లైన గెషూరు, మయకాలను అనుసరిస్తుంది; తెలుగులో వాటి ప్రజలను భావించి గౌరవ/బహువచన రూపం సహజం.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల మధ్య
  rationale: ‘ఇశ్రాయేలు మధ్యలో’ అనే మూలభావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటి వరకు
  rationale: వివరణకర్త కాలం వరకు కొనసాగిన స్థితిని తెలిపే సాంప్రదాయ హీబ్రూ పదబంధానికి సహజ తెలుగు సమానం.
