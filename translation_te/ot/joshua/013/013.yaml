translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వర్ణన. స్థలనామాలైన ‘గెషూరు, మయకా’ మరియు ప్రజావర్గాలైన ‘గెషూరీయులు, మయకాతీయులు’ మధ్య మూలంలోని భేదం నిలుపబడింది.
