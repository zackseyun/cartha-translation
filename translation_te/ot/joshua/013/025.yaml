translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భౌగోళిక జాబితాకు తగిన గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా చేయడానికి ఉనికి సూచించే క్రియను వాక్యాంతంలో ఉంచాం; అసలులోని ప్రాదేశిక అస్పష్టతను పాదసూచికలో నిలిపాం.
