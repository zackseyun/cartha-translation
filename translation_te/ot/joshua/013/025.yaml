source:
  edition: WLC
  text: וַ/יְהִ֤י לָ/הֶם֙ הַ/גְּב֔וּל יַעְזֵר֙ וְ/כָל עָרֵ֣י הַ/גִּלְעָ֔ד וַ/חֲצִ֕י אֶ֖רֶץ בְּנֵ֣י עַמּ֑וֹן עַד עֲרוֹעֵ֕ר אֲשֶׁ֖ר עַל פְּנֵ֥י רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
translation:
  language: te
  text: 'వారికి కలిగిన భూభాగం ఇదే: యజేరు, గిలాదులోని పట్టణాలన్నీ, అమ్మోనీయుల దేశంలో సగభాగం, రబ్బాకు ఎదురుగా ఉన్న అరోయేరు వరకు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రబ్బాకు అభిముఖంగా ఉన్న” అని కూడా అనువదించవచ్చు. హీబ్రూ ప్రయోగానికి అక్షరార్థం “రబ్బా ఎదుట ఉన్న.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: వారి భూభాగంలో ... ఉన్నాయి
  rationale: ఈ వాక్యం గోత్రానికి కేటాయించిన ప్రాంతంలోని స్థలాలను పేర్కొంటోంది. גְּבוּל అనే పదానికి ‘సరిహద్దు’ లేదా ‘భూభాగం’ అనే అర్థాలు ఉండగలవు; ఇక్కడ స్థలాల జాబితా వస్తున్నందున సహజమైన తెలుగులో ‘భూభాగం’ను ఎంచుకున్నాం.
- source_word: יַעְזֵר
  choice: యాజేరు
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: וְכָל עָרֵי הַגִּלְעָד
  choice: గిలాదులోని పట్టణాలన్నీ
  rationale: עָרֵי అనేది పట్టణాలు లేదా నగరాలను సూచిస్తుంది. ప్రాంతీయ జాబితాలో ఆధునిక తెలుగుకు సహజంగా ‘పట్టణాలు’ వాడాం; సంబంధాన్ని స్పష్టంగా తెలియజేయడానికి ‘గిలాదులోని’ అని ఇచ్చాం.
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల దేశంలో సగభాగం
  rationale: בְּנֵי עַמּוֹן అనే జాతి-భౌగోళిక వ్యక్తీకరణను సహజంగా ‘అమ్మోనీయులు’ అని, אֶרֶץ‌ను ఈ సందర్భంలో ‘దేశం’ అని అనువదించాం.
- source_word: עַד עֲרוֹעֵר
  choice: అరోయేరు వరకు
  rationale: עַד ప్రాంతీయ పరిమితిని సూచిస్తుంది; తెలుగులో ‘వరకు’ దాని అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది. עֲרוֹעֵר స్థలనామాన్ని ‘అరోయేరు’గా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  choice: రబ్బాకు ఎదురుగా ఉన్న
  rationale: עַל־פְּנֵי అనే హీబ్రూ ప్రయోగం ‘ముందున్న,’ ‘అభిముఖంగా ఉన్న,’ లేదా ‘ఎదురుగా ఉన్న’ అనే ప్రాదేశిక సంబంధాన్ని సూచించగలదు. దిశను అనవసరంగా నిర్దిష్టం చేయకుండా ‘ఎదురుగా ఉన్న’ అని ఇచ్చాం.
