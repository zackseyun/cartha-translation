source:
  edition: WLC
  text: כָּל מַמְלְכ֥וּת עוֹג֙ בַּ/בָּשָׁ֔ן אֲשֶׁר מָלַ֥ךְ בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶ֑עִי ה֤וּא נִשְׁאַר֙ מִ/יֶּ֣תֶר הָ/רְפָאִ֔ים וַ/יַּכֵּ֥/ם מֹשֶׁ֖ה וַ/יֹּרִשֵֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/012.yaml
  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
translation:
  language: te
  text: బాషానులోని ఓగు రాజ్యమంతా—అతడు అష్టారోతులోను ఎద్రెయిలోను రాజుగా పాలించాడు—అతడు రెఫాయీయుల శేషంలోనుండి మిగిలి ఉన్నవాడు.[a] మోషే వారిని కొట్టి వారి స్వాధీనం నుండి తొలగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దైత్యులు.” హెబ్రూలో “రెఫాయీయులు”; ఇది బహుశా ఒక ప్రాచీన జనసమూహం పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: బాషానులోని ఓగు రాజ్యమంతా
  rationale: ఏకవచనమైన ‘రాజ్యం’తో ఉన్న כָּל, ఓగు పాలనలోని ప్రాంతమంతటినీ సూచిస్తుంది; בַּבָּשָׁן స్థానాన్ని సూచిస్తున్నందున ‘బాషానులోని’ అని అనువదించాం.
- source_word: אֲשֶׁר מָלַךְ
  choice: అతడు ... పాలించాడు
  rationale: מלך లోని రాజపాలన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי
  choice: అష్టారోతులోనూ ఎద్రెయిలోనూ
  rationale: రెండు స్థలపేర్ల ముందున్న בְּ ఉపసర్గలను ప్రతిబింబిస్తూ, రెండూ అతని పాలనా కేంద్రాలని స్పష్టంగా ఉంచుతుంది.
- source_word: הוּא נִשְׁאַר מִיֶּתֶר הָרְפָאִים
  choice: రెఫాయీయులలో మిగిలినవారిలో అతడు ఒకడు
  rationale: נִשְׁאַר మరియు יֶתֶר కలిగిన మిగిలి ఉండటం అనే భావాన్ని సహజంగా తెలుపుతూ, మూలంలో లేని ‘ఒక్కడే’ అనే భావాన్ని చేర్చదు.
- source_word: הָרְפָאִים
  choice: రెఫాయీయులు
  rationale: దీనిని వారి స్వభావంపై వ్యాఖ్యానించే ‘దైత్యులు’గా మార్చకుండా, ప్రాచీన జనసమూహం పేరుగా లిప్యంతరీకరించాం.
- source_word: וַיַּכֵּם
  choice: వారిని ఓడించి
  rationale: נכה కు యుద్ధ సందర్భంలో ‘కొట్టడం/ఓడించడం’ అనే భావం ఉంది; తరువాతి చర్యతో సహజంగా కలవడానికి ‘ఓడించి’ ఎంచుకున్నాం.
- source_word: וַיֹּרִשֵׁם
  choice: వారి భూమిని స్వాధీనం చేసుకున్నాడు
  rationale: హిఫీల్ రూపం వారిని వారి స్వాధీనంనుంచి తొలగించే భావాన్ని ఇస్తుంది; తెలుగులో ఆ ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: רְפָאִים పదం యొక్క అర్థం
  choice: రెఫాయీయులు
  alternative: దైత్యులు
  rationale: మూలపదాన్ని ఒక ప్రాచీన ప్రజల పేరుగా నిలుపుకోవడం వారి శరీర స్వభావంపై నిర్దిష్ట వ్యాఖ్యానాన్ని ప్రధాన వచనంలోకి తీసుకురాదు; సాధ్యమైన వివరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడాం. హెబ్రూ వాక్యంలోని మొదటి నామవాచక భాగం మునుపటి వచనంతో వ్యాకరణపరంగా అనుసంధానమై ఉండగలదనే స్వల్ప అసంపూర్ణతను సెమీకోలన్‌తో నిలిపాం; అనవసరమైన క్రియను చేర్చలేదు.
