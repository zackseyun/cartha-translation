translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన భౌగోళిక జాబితాగా రూపొందించబడింది. హీబ్రూ సంధికారకాలను తెలుగులో సహజంగా కనిపించే కామాలతో సూచించాం; స్థలనామాలను అనువదించకుండా లిప్యంతరీకరించాం.
