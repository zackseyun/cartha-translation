lexical_decisions:
- source_word: בֵית פְּעוֹר
  choice: బేత్-పెయోరు
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా, ఆధునిక తెలుగు పాఠకులు పలకగలిగే విధంగా లిప్యంతరీకరించబడింది.
- source_word: אַשְׁדּוֹת
  choice: కొండవాలులు
  rationale: ఈ భౌగోళిక సందర్భంలో ఈ పదం పర్వతపు వాలులను లేదా దిగువ వంపులను సూచించే అవకాశం ఎక్కువ. సహజమైన తెలుగులో ‘కొండవాలులు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַפִּסְגָּה
  choice: పిస్గా
  rationale: ఇక్కడ ఇది నిర్దిష్ట భౌగోళిక నామంగా వాడబడింది; అందువల్ల ‘శిఖరం’ అని అర్థానువాదం చేయకుండా లిప్యంతరీకరించబడింది.
- source_word: בֵית הַיְשִׁמוֹת
  choice: బేత్-యెషీమోతు
  rationale: ఇది స్థలనామం కాబట్టి ‘నిర్జన ప్రదేశాల ఇల్లు’ వంటి అర్థానువాదం చేయకుండా లిప్యంతరీకరించబడింది.
