  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన భౌగోళిక జాబితా శైలి వాడబడింది. ఇది ముందున్న వాక్యాన్ని కొనసాగిస్తున్నందున చివర దీర్ఘవిరామ సూచికను ఉంచాం. ‘గెషూరీయులు’, ‘మయకాతీయులు’ అనే ప్రజానామాలు సాధారణ తెలుగు బహువచన సమూహరూపాల్లో ఇవ్వబడ్డాయి.
