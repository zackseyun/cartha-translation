- from: గిలాదు, గెషూరీయులూ మయకాతీయులూ నివసించిన ప్రాంతం[a], హెర్మోను పర్వత ప్రాంతమంతా[b], సల్కా వరకు విస్తరించిన బాషాను ప్రాంతమంతా—
  to: గిలాదు, గెషూరీయుల, మయకాతీయుల ప్రాంతం[a], హెర్మోను పర్వత ప్రాంతమంతా[b], సల్కా వరకు ఉన్న బాషానంతా—
  rationale: The revision removes the unsupported ‘inhabited’ nuance, keeps גְּבוּל deliberately broad as ‘ప్రాంతం’ with the boundary alternative in a footnote, and streamlines the regional list into natural modern standard Telugu. It preserves the source’s collective gentilic ambiguity and the continuing-list dash.
