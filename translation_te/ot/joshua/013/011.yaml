  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
translation:
  language: te
  text: గిలాదు, గెషూరీయుల, మయకాతీయుల ప్రాంతం[a], హెర్మోను పర్వత ప్రాంతమంతా[b], సల్కా వరకు ఉన్న బాషానంతా—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గెషూరీయుల, మయకాతీయుల సరిహద్దు.” హీబ్రూ పదం సరిహద్దు రేఖను గానీ, ఒక ప్రజకు చెందిన భూభాగాన్ని గానీ సూచించగలదు; ఇక్కడ భూభాగాల జాబితాలో ఉన్నందున “ప్రాంతం” అనే విస్తృత అర్థం సందర్భానికి బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా, “హెర్మోను పర్వతమంతా.” ఇది ఒక్క శిఖరాన్ని మాత్రమే కాక హెర్మోను పర్వత సముదాయమంతటినీ సూచించవచ్చు.
    reason: cultural_note
