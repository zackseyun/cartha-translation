  register: ఆధునిక ప్రామాణిక తెలుగు; భూవిభజన సందర్భానికి తగిన గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘గాదు కుమారులు’ అనే అక్షరానువాదం బదులు గోత్రార్థాన్ని స్పష్టంచేయడానికి ‘గాదు వంశస్థులు’ వాడబడింది.
