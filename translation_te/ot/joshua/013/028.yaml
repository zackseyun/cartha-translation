  yaml_path: translation/ot/joshua/013/028.yaml
  text: This was the inheritance of the sons of Gad according to their clans—the cities and their villages[a].
translation:
  language: te
  text: ఇది గాదు వంశస్థుల కుటుంబాల ప్రకారం వారి స్వాస్థ్యం—పట్టణాలు, వాటి గ్రామాలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “గాదు వంశస్థుల కుటుంబాల ప్రకారం వారి స్వాస్థ్యం ఇదే: పట్టణాలు, వాటి గ్రామాలు.” హీబ్రూ సారాంశ వాక్యాన్ని సందర్భాన్ని బట్టి “ఇది” లేదా “ఇదే” అనే భావంతో అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: ఇది
  rationale: హీబ్రూ స్త్రీలింగ ఏకవచన సూచక సర్వనామం ముందుగా వివరించిన భూభాగాన్ని సూచిస్తుంది. తెలుగు నామవాక్యంలో కాలాన్ని తప్పనిసరిగా వ్యక్తం చేయనవసరం లేదు; అందువల్ల మూలంలోని సారాంశ సూత్రం సహజంగా నిలుస్తుంది.
- source_word: נַחֲלַת
  choice: స్వాస్థ్యం
  rationale: భూవిభజన సందర్భంలో వంశపారంపర్యంగా పొందిన కేటాయింపును సూచిస్తుంది; ‘స్వాస్థ్యం’ భూమి వారసత్వ భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: בְּנֵי גָד
  choice: గాదు వంశస్థులు
  rationale: అక్షరార్థంగా ‘గాదు కుమారులు’; ఇక్కడ గాదు నుండి వచ్చిన గోత్ర ప్రజలందరినీ సూచిస్తున్నందున ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వారి వంశాల ప్రకారం
  rationale: לְ విభజన లేదా వర్గీకరణను, מִשְׁפָּחוֹת గోత్రంలోని వంశ సమూహాలను సూచిస్తాయి. పునరుక్త ‘వారి వారి’ పంపిణీ భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: הֶעָרִים
  choice: పట్టణాలు
  rationale: భూకేటాయింపు జాబితాల్లోని స్థిర నివాస కేంద్రాలను సూచించే సాధారణ పదం; ఆధునిక తెలుగులో ‘పట్టణాలు’ సహజమైన సమానార్థకం.
- source_word: וְחַצְרֵיהֶם
  choice: వాటి గ్రామాలు
  rationale: חָצֵר ఇక్కడ పట్టణాలకు అనుబంధమైన చిన్న గ్రామీణ నివాసాలను సూచిస్తుంది. ‘వాటి’ అనే సర్వనామం ఆ పట్టణాలతో ఉన్న సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
