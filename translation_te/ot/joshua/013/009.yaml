translation:
  language: te
  text: అర్నోను లోయ అంచున ఉన్న అరోయేరు మొదలుకొని, ఆ లోయ మధ్యలో ఉన్న పట్టణం, మేదెబా నుండి దీబోను వరకు ఉన్న పీఠభూమి అంతా,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: అర్నోను లోయ అంచున
  rationale: שפה అక్షరార్థంగా ‘పెదవి/అంచు’; భౌగోళిక సందర్భంలో సహజమైన ‘అంచు’ను ఎంచుకున్నాం. נחל ఇక్కడ అర్నోను లోయ లేదా వాడీని సూచిస్తుంది.
- source_word: בְּתוֹךְ הַנַּחַל
  choice: ఆ లోయ మధ్యలో
  rationale: בתוך యొక్క స్థలార్థమైన ‘మధ్యలో’ను నిలిపి, పూర్వోక్త నחל‌ను ‘ఆ లోయ’గా సూచించాం.
- source_word: הַמִּישֹׁר
  choice: పీఠభూమి
  rationale: మోయాబు ప్రాంతంలోని సమతలమైన ఎత్తైన భూభాగాన్ని సూచించే భౌగోళిక పదంగా ‘పీఠభూమి’ సరిపోతుంది.
- source_word: מֵעֲרוֹעֵר
  choice: అరోయేరు మొదలుకొని
  rationale: מן ఉపసర్గ సూచించే ప్రారంభ సరిహద్దును తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూసరిహద్దుల జాబితా స్వరూపాన్ని మరియు వాక్యం తదుపరి వచనంతో కొనసాగుతున్న భావాన్ని కాపాడేందుకు చివర కామా ఉంచబడింది. స్థలనామాలు హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి.
