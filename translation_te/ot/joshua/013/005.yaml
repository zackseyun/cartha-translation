  text: and the land of the Gebalites[a], and all Lebanon toward the sunrise, from Baal-gad below Mount Hermon to Lebo-hamath,
translation:
  language: te
  text: గెబలీయుల దేశమును, సూర్యోదయ దిశలోని లెబానోనంతటిని, హెర్మోను పర్వతం దిగువనున్న బయల్గాదు నుండి లెబో-హమాతు[a] వరకు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హమాతు ప్రవేశద్వారం వరకు.” హెబ్రీయ పదబంధాన్ని స్థలనామంగా కాక, సరిహద్దును వర్ణించే మాటగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאָרֶץ הַגִּבְלִי
  choice: గెబలీయుల దేశం
  rationale: הַגִּבְלִי అనేది గెబలుతో సంబంధమున్న ప్రజలను సూచించే జాతివాచకం. ‘గెబలీయుల దేశం’ భూభాగాన్నీ ప్రజల సంబంధాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְכָל הַלְּבָנוֹן
  choice: లెబానోను ప్రాంతమంతా
  rationale: כָל యొక్క సమగ్ర భావాన్ని ‘అంతా’ నిలుపుతుంది; ‘ప్రాంతం’ అనే పదం ఇక్కడి భౌగోళిక సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: సూర్యోదయ దిశలో ఉన్న
  rationale: హెబ్రీయ భాషలోని ‘సూర్యోదయం’ అనే దిశాసూచక చిత్రాన్ని నిలుపుతూ, ఆధునిక తెలుగులో తూర్పు దిశను సహజంగా తెలియజేస్తుంది.
- source_word: מִבַּעַל גָּד
  choice: బయలు-గాదు మొదలుకొని
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, מִן సూచించే సరిహద్దు ఆరంభాన్ని ‘మొదలుకొని’తో స్పష్టంగా వ్యక్తం చేసింది.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: హెర్మోను పర్వతం దిగువనున్న
  rationale: תַּחַת తెలిపే పర్వతానికి దిగువన గల భౌగోళిక స్థానాన్ని సహజంగా వ్యక్తం చేస్తుంది; ఖచ్చితంగా ‘పాదాల వద్ద’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: עַד לְבוֹא חֲמָת
  choice: లెబో-హమాతు వరకు
  rationale: సరిహద్దు సూచనలో ఇది స్థలనామంగా పనిచేస్తున్న సాంప్రదాయ పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచింది; వర్ణనాత్మక పఠనాన్ని పాదసూచికలో నిలిపింది.
