  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בָ/עֵ֡מֶק בֵּ֣ית הָרָם֩ וּ/בֵ֨ית נִמְרָ֜ה וְ/סֻכּ֣וֹת וְ/צָפ֗וֹן יֶ֚תֶר מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַ/יַּרְדֵּ֖ן וּ/גְבֻ֑ל עַד קְצֵה֙ יָם כִּנֶּ֔רֶת עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
translation:
  language: te
  text: మరియు లోయలో బేత్-హారాము, బేత్-నిమ్రా, సుక్కోతు, సాఫోను—హెష్బోను రాజైన సీహోను రాజ్యంలో మిగిలిన భాగం—యొర్దాను దాని సరిహద్దుగా, కిన్నెరెతు సముద్రపు చివర వరకు[a], యొర్దానుకు అవతల తూర్పున ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కిన్నెరెతు సముద్రపు అంచు వరకు.”
    reason: קְצֵה అనే పదానికి ‘చివర’తో పాటు ‘అంచు’ అనే అర్థమూ ఉండగలదు.
lexical_decisions:
- source_word: וּ/בָ/עֵמֶק
  choice: మరియు లోయలో
  rationale: עֵמֶק సాధారణంగా లోయ లేదా లోతట్టు ప్రాంతాన్ని సూచిస్తుంది. ఇక్కడ పట్టణాలున్న భౌగోళిక ప్రాంతాన్ని పరిచయం చేస్తున్నందున ‘లోయలో’ సహజమైన అనువాదం.
- source_word: בֵּית הָרָם וּ/בֵית נִמְרָה וְ/סֻכּוֹת וְ/צָפוֹן
  choice: బేత్-హారాము, బేత్-నిమ్రా, సుక్కోతు, సాఫోను
  rationale: ఇవన్నీ స్థల నామాలు కాబట్టి అర్థానువాదం చేయకుండా తెలుగులో ఉచ్చారణానుసారంగా రాయబడ్డాయి. צָפוֹן ఇక్కడ ‘ఉత్తరం’ అనే సాధారణ నామవాచకం కాక పట్టణనామం.
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: హెష్బోను రాజైన సీహోను రాజ్యంలో మిగిలిన భాగం
  rationale: יֶתֶר అంటే మిగిలినది లేదా శేషభాగం; מַמְלָכוּת ఇక్కడ రాజ్యాన్ని సూచిస్తుంది.
- source_word: הַיַּרְדֵּן וּ/גְבֻל
  choice: యొర్దాను దాని సరిహద్దుగా
  rationale: హీబ్రూ పదబంధం సంక్షిప్తమైన, సమానాధికార నిర్మాణంలో ఉంది. యొర్దాను ఆ ప్రాంతానికి సరిహద్దుగా ఉందనే భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలిపింది.
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  choice: కిన్నెరెతు సముద్రపు చివరి వరకు
  rationale: קְצֵה అంటే చివర, అంచు లేదా అంతిమ భాగం. మూలపాఠంలో ‘దిగువ’ అనే పదం లేనందున భౌగోళిక వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో చేర్చకుండా ‘చివరి వరకు’ అని అనువదించబడింది.
- source_word: עֵבֶר הַ/יַּרְדֵּן מִזְרָחָ/ה
  choice: యొర్దానుకు అవతల తూర్పున
  rationale: ఇది యొర్దాను నదికి తూర్పువైపున ఉన్న ప్రాంతాన్ని సూచించే భౌగోళిక సూత్రప్రయోగం; దిశాభావాన్ని నేరుగా నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన భౌగోళిక-వివరణాత్మక శైలిని ఉపయోగించాం. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగు వాక్యం పూర్తిగా ఉండేందుకు చివర ‘ఉన్నాయి’ చేర్చాం; దీని వల్ల భౌగోళిక భావం మారదు.
