  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ వాక్యంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, భూవిభజన సందర్భాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేశారు. చివరి ద్విబిందువు తరువాతి వచనాల్లో వచ్చే సరిహద్దు వివరాలకు అనుసంధానాన్ని సూచిస్తుంది.
