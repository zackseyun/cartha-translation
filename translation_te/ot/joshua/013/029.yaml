  text: וַ/יִּתֵּ֣ן מֹשֶׁ֔ה לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ/יְהִ֗י לַ/חֲצִ֛י מַטֵּ֥ה בְנֵֽי מְנַשֶּׁ֖ה לְ/מִשְׁפְּחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/029.yaml
  text: 'And Moses gave to the half-tribe of Manasseh[a], and it was for the half-tribe of the sons of Manasseh according to their clans:'
translation:
  language: te
  text: 'మోషే మనష్షే అర్ధగోత్రానికి భూభాగాన్ని ఇచ్చాడు; అది మనష్షే కుమారుల[a] అర్ధగోత్రానికి వారి వంశాల ప్రకారం చెందింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘మనష్షే కుమారులు’; ఇది మనష్షే గోత్ర వంశస్థులను సూచించే బంధుత్వ వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: భూభాగాల పంపిణీ సందర్భంలో נתן యొక్క సాధారణ అర్థమైన ‘ఇచ్చాడు’ను నిలుపుతుంది.
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రానికి
  rationale: חֲצִי అంటే ‘సగం/అర్ధం’; שֵׁבֶט ఇక్కడ గోత్ర సమూహాన్ని సూచిస్తుంది. ‘అర్ధగోత్రం’ తెలుగు బైబిలు వాడుకలో సహజంగా అర్థమవుతుంది.
- source_word: וַיְהִי
  choice: వచ్చిన భాగం ఇదే
  rationale: అక్షరార్థంగా ‘అది ఉండెను’ అయినప్పటికీ, ఈ భూవిభజన సూత్రంలో ఆ గోత్రానికి దక్కిన భాగాన్ని పరిచయం చేస్తుంది; తరువాతి వివరాలకు దారితీసే సహజ తెలుగు రూపం ఇది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: מַטֶּהకు ‘కర్ర’ అనే అర్థమూ ఉన్నా, ఇక్కడ పరిపాలనా-వంశ సంబంధ సందర్భంలో ‘గోత్రం’ అనే అర్థమే ఉద్దేశించబడింది.
- source_word: בְנֵי מְנַשֶּׁה
  choice: మనష్షే కుమారులు
  rationale: హీబ్రూలోని బంధుత్వ వ్యక్తీకరణను నిలుపుతుంది; సందర్భంలో ఇది మనష్షే వంశస్థులను సూచిస్తుంది.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחוֹת ఇక్కడ గోత్రంలోని వంశ విభాగాలను సూచిస్తుంది; לְ విభజనాత్మక భావాన్ని ‘ప్రకారం’ వ్యక్తం చేస్తుంది.
- source_word: implicit allotment object
  choice: భూభాగాన్ని
  rationale: וַיִּתֵּן క్రియకు సంబంధించిన కర్మ ముందరి భూవిభజన సందర్భం నుంచి గ్రహించబడుతుంది; తెలుగులో వాక్యం సంపూర్ణంగా, స్పష్టంగా ఉండేందుకు ‘భూభాగాన్ని’ చేర్చబడింది.
