  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ దీర్ఘ వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం. ముందరి వచనంతో ఉన్న జాబితా సంబంధాన్ని చూపేందుకు ‘వారికి లభించాయి’ చేర్చబడింది; ఇది ఈ వచనంలోని స్వతంత్ర క్రియ కాదు, సందర్భానుసార పూరణ.
