source:
  edition: WLC
  text: וְ/כֹל֙ עָרֵ֣י הַ/מִּישֹׁ֔ר וְ/כָֽל מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן אֲשֶׁר֩ הִכָּ֨ה מֹשֶׁ֜ה אֹת֣/וֹ וְ/אֶת נְשִׂיאֵ֣י מִדְיָ֗ן אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע נְסִיכֵ֣י סִיח֔וֹן יֹשְׁבֵ֖י הָ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
translation:
  language: te
  text: పీఠభూమిలోని సమస్త పట్టణాలు[a], హెష్బోనులో రాజ్యమేలిన అమోరీయుల రాజు సీహోను రాజ్యమంతా; మోషే అతనినీ, మిద్యాను నాయకులైన ఎవీ, రేకెము, సూరు, హూరు, రెబలను ఓడించాడు[b]. వీరు ఆ దేశంలో నివసించిన సీహోను పాలకులు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమతల ప్రాంతంలోని పట్టణాలు’ లేదా ‘ఎత్తైన మైదానంలోని పట్టణాలు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థం ‘కొట్టాడు.’ ఈ సైనిక సందర్భంలో దీనికి ‘ఓడించాడు’ లేదా ‘తీవ్రంగా దెబ్బతీశాడు’ అనే అర్థం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూలో రెండు వేర్వేరు హోదా పదాలు ఉన్నాయి: ‘మిద్యాను నాయకులు’ (נְשִׂיאֵי), ‘సీహోను పాలకులు’ (נְסִיכֵי).'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  choice: మైదాన పీఠభూమిలోని పట్టణాలు
  rationale: מִישׁוֹר ఇక్కడ యొర్దాను అవతలి సమతల ఎత్తైన ప్రాంతాన్ని సూచిస్తుంది. ‘మైదాన పీఠభూమి’ సమతలత్వాన్నీ ప్రాంత భౌగోళిక స్వరూపాన్నీ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַמְלְכוּת סִיחוֹן
  choice: సీహోను రాజ్యమంతా
  rationale: מַמְלְכוּת అంటే రాజ్యం లేదా రాజాధీన ప్రాంతం; సందర్భంలో సంపూర్ణ భూభాగాన్ని సూచించడానికి ‘రాజ్యమంతా’ సహజంగా ఉంది.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: అమోరీయుల రాజైన
  rationale: నిర్మాణ సంబంధాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן
  choice: హెష్బోనులో రాజ్యమేలిన
  rationale: מָלַךְ ప్రత్యేకంగా రాజుగా పాలించడాన్ని సూచిస్తుంది; ‘రాజ్యమేలిన’ ఆ భావాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ
  choice: మోషే సీహోనును ... హతమార్చాడు
  rationale: נכה సైనిక సందర్భంలో కొట్టి ఓడించడం లేదా హతమార్చడం అనే భావాన్ని ఇస్తుంది. సందర్భానుసారంగా ‘హతమార్చాడు’ నిర్ణాయక సంహారాన్ని స్పష్టంగా తెలియజేస్తుంది; అస్పష్టతను పాదసూచికలో నమోదు చేశాం.
- source_word: נְשִׂיאֵי מִדְיָן
  choice: మిద్యాను అధిపతులు
  rationale: נָשִׂיא నాయకుడు, అధిపతి లేదా ప్రధానుడు అనే హోదాను సూచిస్తుంది. తరువాతి נְסִיכֵי పదానికి వేరైన తెలుగు పదాన్ని ఉంచేందుకు ‘అధిపతులు’ ఎంచుకున్నాం.
- source_word: אֱוִי וְאֶת רֶקֶם וְאֶת צוּר וְאֶת חוּר וְאֶת רֶבַע
  choice: ఎవీ, రేకెము, సూరు, హూరు, రెబ
  rationale: వ్యక్తుల పేర్లను హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: נְסִיכֵי סִיחוֹן
  choice: సీహోను సామంత రాజులు
  rationale: נָסִיךְ రాజు కింద అధికారాన్ని కలిగిన పాలకుడు లేదా రాజకుమారుడు అనే భావం ఇవ్వగలదు. వీరు మిద్యాను నాయకులుగాను సీహోనుకు లోబడిన స్థానిక పాలకులుగాను పేర్కొనబడినందున ‘సామంత రాజులు’ సందర్భాన్ని సహజంగా తెలియజేస్తుంది; పదభేదం పాదసూచికలో సూచించబడింది.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ఆ దేశంలో నివసించిన
  rationale: ישׁב యొక్క కృదంత రూపం నివసించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సరళమైన సంబంధ వాక్యంగా ఇచ్చాం.
