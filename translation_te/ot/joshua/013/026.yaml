  yaml_path: translation/ot/joshua/013/026.yaml
  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
translation:
  language: te
  text: హెష్బోను నుండి రామత్-మిస్పే మరియు బెటోనీము వరకు, అలాగే మహనయీము నుండి దెబీరు సరిహద్దు వరకు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దెబీరు దిశలోని సరిహద్దు వరకు.” హెబ్రీ నిర్మాణంలోని లామెద్‌కు దిశార్థక భావం ఉండవచ్చు; అయితే భౌగోళిక సరిహద్దుల జాబితా సందర్భంలో “దెబీరు సరిహద్దు” అనేది సహజమైన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֶשְׁבּוֹן
  choice: హెష్బోను నుండి
  rationale: వావ్ సంధికారకంతో కూడిన מִן ఆరంభ స్థానాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో సంధికారకాన్ని ప్రత్యేకంగా అనువదించకుండా, స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: עַד
  choice: వరకు
  rationale: సరిహద్దుల వర్ణనలో עַד విస్తృతి యొక్క అంత్యబిందువును సూచిస్తుంది; తెలుగులో ‘వరకు’ సహజమైన సమానార్థకం.
- source_word: רָמַת הַמִּצְפֶּה
  choice: రామత్-మిస్పే
  rationale: ‘కావలిస్థలపు ఎత్తైన ప్రదేశం’ అనే వ్యుత్పత్తి ఉన్నప్పటికీ, ఇక్కడ ఇది స్థలనామంగా పనిచేస్తుంది; అందువల్ల అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: וּ/בְטֹנִים
  choice: బెటోనీముతో సహా
  rationale: ఇది సంధికారకంతో కూడిన స్థలనామం. జాబితాలో రామత్-మిస్పేతో సమన్వయ సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా చూపడానికి ‘తో సహా’ వాడాం.
- source_word: וּ/מִֽ/מַּחֲנַיִם
  choice: మహనయీము నుండి
  rationale: మִן ఆరంభబిందువును సూచిస్తుంది; స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: גְּבוּל
  choice: సరిహద్దు
  rationale: భూభాగాల పంపిణీ సందర్భంలో ఈ పదం ప్రాంతపు హద్దును సూచిస్తుంది; ‘సరిహద్దు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: לִדְבִר
  choice: దెబీరు సరిహద్దు
  rationale: గెవూల్ తరువాత లామెద్‌తో వచ్చిన స్థలనామాన్ని సంబంధార్థకంగా గ్రహించి, తెలుగులో సహజమైన ‘దెబీరు సరిహద్దు’గా ఇచ్చాం.
