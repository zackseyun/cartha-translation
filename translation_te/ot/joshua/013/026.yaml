  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన భౌగోళిక సరిహద్దుల జాబితా శైలిని నిలిపాం. స్థలనామాలను అనువదించకుండా తెలుగు లిపిలో ఇచ్చాం; మూలంలోని రెండు ‘నుండి—వరకు’ నిర్మాణాలను స్పష్టంగా కాపాడాం.
