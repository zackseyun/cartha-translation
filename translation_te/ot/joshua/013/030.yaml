  register: ఆధునిక ప్రామాణిక తెలుగులో, భూభాగ కేటాయింపు జాబితా శైలిని కాపాడుతూ సహజమైన వాక్య నిర్మాణం వాడబడింది. ‘మహనయీము నుండి’ తరువాతి వివరాల సంబంధాన్ని స్పష్టం చేయడానికి ద్విబిందువు ఉంచబడింది.
