source:
  edition: WLC
  text: וַ/יְהִ֣י גְבוּלָ֗/ם מִ/מַּחֲנַ֨יִם כָּֽל הַ/בָּשָׁ֜ן כָּֽל מַמְלְכ֣וּת ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן וְ/כָל חַוֺּ֥ת יָאִ֛יר אֲשֶׁ֥ר בַּ/בָּשָׁ֖ן שִׁשִּׁ֥ים עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/030.yaml
  text: 'Their territory was from Mahanaim: all Bashan[a], all the kingdom of Og king of Bashan[b], and all the villages of Jair that are in Bashan—sixty cities.'
translation:
  language: te
  text: వారి భూభాగం మహనయీము నుండి మొదలై, బాషానంతటినీ, బాషాను రాజైన ఓగు రాజ్యమంతటినీ, బాషానులోని యాయీరు నివాసస్థలాలన్నిటినీ[a]—అరవై పట్టణాలను—కలిగి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “హవ్వోత్-యాయీరు”; ఈ నివాసస్థలాల హీబ్రూ పేరుకు సంప్రదాయ లిప్యంతరీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: వారి భూభాగం
  rationale: సరిహద్దు రేఖను మాత్రమే కాక, దాని లోపల వారికి కేటాయించబడిన ప్రాంతాన్ని ఈ సందర్భంలో సూచిస్తుంది.
- source_word: מִמַּחֲנַיִם
  choice: మహనయీము నుండి మొదలైంది
  rationale: מִן ప్రాంత వివరణ యొక్క ఆరంభ బిందువును సూచిస్తుంది; తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘నుండి మొదలైంది’ అని ఇచ్చాం.
- source_word: כָּל הַבָּשָׁן
  choice: బాషాను ప్రాంతమంతా
  rationale: כָּל యొక్క సమగ్ర భావాన్ని నిలుపుతూ, బాషాను ఒక ప్రాంతమని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מַמְלְכוּת עוֹג מֶלֶךְ הַבָּשָׁן
  choice: బాషాను రాజైన ఓగు రాజ్యమంతా
  rationale: מַמְלְכוּת ను ‘రాజ్యం’గా అనువదించి, ఓగు బాషాను రాజని తెలిపే సంబంధాన్ని నిలిపాం.
- source_word: חַוֹּת יָאִיר
  choice: యాయీరు గ్రామాలన్నీ
  rationale: ఈ పదబంధం యాయీరుతో సంబంధమున్న నివాస స్థలాలను సూచిస్తుంది; సాధారణ పాఠకునికి ‘గ్రామాలు’ సహజంగా అర్థమవుతుంది. సంప్రదాయ లిప్యంతరీకరణను పాదటిప్పణిలో ఇచ్చాం.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: బాషానులో ఉన్న
  rationale: యాయీరు గ్రామాల స్థానాన్ని తెలిపే సంబంధ వాక్యాన్ని సంక్షిప్తమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: שִׁשִּׁים עִיר
  choice: మొత్తం అరవై పట్టణాలు
  rationale: עִיר నగరం లేదా పట్టణాన్ని సూచించగలదు; ప్రాచీన నివాస కేంద్రాలకు ఆధునిక తెలుగులో ‘పట్టణాలు’ అతిశయార్థం లేకుండా సరిపోతుంది.
