- from: లెబానోను మొదలుకొని మిస్రెఫోత్-మయీము[a] వరకు ఉన్న పర్వతప్రాంత నివాసులందరినీ—సీదోనీయులందరినీ—నేనే ఇశ్రాయేలు కుమారుల ఎదుటనుండి వెళ్లగొడతాను[b]. అయితే నేను నీకు ఆజ్ఞాపించిన ప్రకారం నీవు ఆ దేశాన్ని ఇశ్రాయేలుకు స్వాస్థ్యంగా కేటాయించు[c].
  to: లెబానోను మొదలుకొని మిస్రెఫోత్-మయీము[a] వరకు ఉన్న పర్వతప్రాంత నివాసులందరినీ—సీదోనీయులందరినీ—నేనే ఇశ్రాయేలు కుమారుల ఎదుటనుండి వెళ్లగొడతాను[b]. నీవు మాత్రం, నేను నీకు ఆజ్ఞాపించిన ప్రకారం, ఆ దేశాన్ని ఇశ్రాయేలుకు స్వాస్థ్యంగా కేటాయించు[c].
  rationale: సవరణ పరిమితమైనది. రַק యొక్క నిర్దిష్ట/పరిమితి బలాన్ని ‘నీవు మాత్రం’ ద్వారా స్పష్టపరిచాం. పాదటిప్పణి bలో మూలక్రియకు మించిన ‘తమ భూమి’ వివరణను తొలగించి, ‘dispossess’ భావాన్ని నేరుగా తెలిపాం. స్థలనామాలు, పేర్లు, భూస్వాస్థ్య పదజాలం, అలాగే మూలంలోని ఉద్ఘాటన మరియు వాక్యనిర్మాణ అస్పష్టతను కాపాడాం.
