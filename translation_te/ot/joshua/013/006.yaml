    rationale: హెబ్రూ హిఫీల్ ירשׁ నివాసులను తొలగించడం లేదా వారి స్వాధీనాన్ని తీసివేయడం సూచిస్తుంది; ‘తమ భూమి’ అని చెప్పడం సందర్భానుసారమైనా, క్రియలో లేని అదనపు వివరణ. మరింత నేర ప్రత్యామ్నాయం మంచిది.
  revised_text: లెబానోను మొదలుకొని మిస్రెఫోత్-మయీము[a] వరకు ఉన్న పర్వతప్రాంత నివాసులందరినీ—సీదోనీయులందరినీ—నేనే ఇశ్రాయేలు కుమారుల ఎదుటనుండి వెళ్లగొడతాను[b]. నీవు మాత్రం, నేను నీకు ఆజ్ఞాపించిన ప్రకారం, ఆ దేశాన్ని ఇశ్రాయేలుకు స్వాస్థ్యంగా కేటాయించు[c].
