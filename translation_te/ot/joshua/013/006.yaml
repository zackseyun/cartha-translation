id: JOS.13.6
reference: Joshua 13:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
translation:
  language: te
  text: లెబానోను మొదలుకొని మిస్రెఫోత్-మయీము[a] వరకు ఉన్న పర్వతప్రాంత నివాసులందరినీ—సీదోనీయులందరినీ—నేనే ఇశ్రాయేలు కుమారుల ఎదుటనుండి వెళ్లగొడతాను[b]. నీవు మాత్రం, నేను నీకు ఆజ్ఞాపించిన ప్రకారం, ఆ దేశాన్ని ఇశ్రాయేలుకు స్వాస్థ్యంగా కేటాయించు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మిస్రెఫోత్-మయీము ఒక స్థలనామం. ఆ పేరుకు ‘నీటి దహనాలు’ వంటి అర్థం ఉండవచ్చు; అయితే దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: cultural_note
  - marker: b
    text: లేదా, “ఇశ్రాయేలు కుమారుల ఎదుటనుండి వారిని స్వాధీనం నుండి తొలగిస్తాను.”
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘కేటాయించు’ అని అనువదించిన హెబ్రూ నుడికారం, భూమిని సాధారణంగా చీట్లు వేసి వాటాలుగా పంచి ఇవ్వడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי הָהָר
  choice: పర్వతప్రాంత నివాసులు
  rationale: ఇక్కడ הָהָר ఒకే పర్వతాన్ని కాక భౌగోళిక పర్వతప్రాంతాన్ని సూచిస్తుంది; ఈ రూపం సహజమైన ఆధునిక తెలుగులో ఆ ప్రాంతీయ భావాన్ని తెలియజేస్తుంది.
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  choice: లెబానోను మొదలుకొని మిస్రెఫోత్-మయీము వరకు
  rationale: రెండూ స్థలనామాలు. ముఖ్యంగా מִשְׂרְפֹת מַיִם అర్థాన్ని ఊహించి అనువదించకుండా లిప్యంతరీకరించడం మూలంలోని అనిశ్చితిని కాపాడుతుంది.
- source_word: כָּל צִידֹנִים
  choice: సీదోనీయులందరినీ
  rationale: సీదోనుకు చెందిన ప్రజలను సమష్టిగా సూచించే జాతి/ప్రాంతీయ నామం; כָּל యొక్క సమగ్ర భావాన్ని ‘అందరినీ’ తెలియజేస్తుంది.
- source_word: אָנֹכִי אוֹרִישֵׁם
  choice: నేనే ... వెళ్లగొడతాను
  rationale: స్వతంత్ర సర్వనామమైన אָנֹכִי లోని ఉద్ఘాటనను ‘నేనే’ కాపాడుతుంది. ירשׁ హిఫీల్ ఇక్కడ నివాసులను వారి భూమి నుండి తొలగించడం లేదా వెళ్లగొట్టడం అనే భావంలో ఉంది.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల ఎదుటనుండి
  rationale: హెబ్రూ సంబంధబోధక చిత్రాన్ని నిలుపుతూ, ఇశ్రాయేలీయుల ముందునుండి తొలగించబడే భావాన్ని తెలియజేస్తుంది. בְּנֵי అనే పుత్రత్వ భాషను ‘కుమారులు’గా కాపాడింది.
- source_word: רַק
  choice: అయితే ... మాత్రం
  rationale: దేవుడు వారిని వెళ్లగొడతానని చెప్పినప్పటికీ యెహోషువ ఆ దేశాన్ని కేటాయించాల్సిందే అనే పరిమితి/వ్యతిరేక మలుపును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַפִּלֶהָ
  choice: ఆ దేశాన్ని ... కేటాయించు
  rationale: నפל హిఫీల్ భూవిభజన సందర్భంలో చీట్లు వేయడం ద్వారా వాటా కేటాయించే నుడికారంగా వాడబడింది. స్త్రీలింగ ఏకవచన కర్మప్రత్యయం సందర్భంలోని దేశాన్ని సూచిస్తుంది; ‘కేటాయించు’ ప్రధాన కార్యాన్ని సహజంగా తెలియజేస్తుంది, చీట్ల భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: לְיִשְׂרָאֵל בְּנַחֲלָה
  choice: ఇశ్రాయేలుకు స్వాస్థ్యంగా
  rationale: נַחֲלָה కేవలం ఆస్తి కాక వారసత్వంగా పొందిన భూహక్కును సూచిస్తుంది; ‘స్వాస్థ్యం’ ఆ న్యాయపరమైన, నిబంధన సంబంధమైన భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: כַּאֲשֶׁר צִוִּיתִיךָ
  choice: నేను నీకు ఆజ్ఞాపించిన ప్రకారం
  rationale: యెహోషువకు ముందే ఇవ్వబడిన, ఇప్పటికీ వర్తించే ఆజ్ఞను సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలో ఉన్న పుత్రత్వాన్ని, పురుష బహువచన రూపాన్ని సమతలీకరించకుండా కాపాడుతుంది; అదే సమయంలో తెలుగులో అర్థమయ్యే సంప్రదాయ నిబంధన-సంబంధ పదబంధంగా ఉంటుంది.
- issue: భూవిభజన సందర్భంలో נַחֲלָה అనువాదం
  choice: స్వాస్థ్యం
  alternative: సొత్తు / వారసత్వ ఆస్తి
  rationale: దేశాన్ని కేవలం భౌతిక సొత్తుగా కాక దేవుడు అనుగ్రహించి తరతరాలకు సంక్రమించే హక్కుగా చూపే న్యాయపరమైన, దైవశాస్త్ర సంబంధమైన ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. స్థలనామాలను లిప్యంతరీకరించాం; మూలంలోని ఉద్ఘాటనకు ‘నేనే’, పరిమితి భావానికి ‘అయితే ... మాత్రం’ వాడాం. సీదోనీయులు పర్వతప్రాంత నివాసులకు వివరణాత్మక సమాంతర పదబంధమై ఉండే నిర్మాణాన్ని డాష్‌లతో కాపాడి, ‘అంటే’ వంటి స్పష్టీకరణను చేర్చలేదు.
