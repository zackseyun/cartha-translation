    issue: రַק కు ‘అయితే’ అనువాదం
    rationale: ‘అయితే’ వ్యతిరేక/మలుపు భావాన్ని ఇవ్వగలిగినా, రַק ఇక్కడ ప్రధానంగా పరిమితి లేదా నిర్దిష్ట ఆదేశాన్ని సూచిస్తుంది. ‘నీవు మాత్రం’ ఆ బలాన్ని స్పష్టంగా నిలుపుతుంది.
  - severity: low
