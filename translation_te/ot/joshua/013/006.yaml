  revision_rationale: సవరణ పరిమితమైనది. రַק యొక్క నిర్దిష్ట/పరిమితి బలాన్ని ‘నీవు మాత్రం’ ద్వారా స్పష్టపరిచాం. పాదటిప్పణి bలో మూలక్రియకు మించిన ‘తమ భూమి’ వివరణను తొలగించి, ‘dispossess’ భావాన్ని నేరుగా తెలిపాం. స్థలనామాలు, పేర్లు, భూస్వాస్థ్య పదజాలం, అలాగే మూలంలోని ఉద్ఘాటన మరియు వాక్యనిర్మాణ అస్పష్టతను కాపాడాం.
