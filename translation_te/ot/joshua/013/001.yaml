id: JOS.13.1
reference: Joshua 13:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו אַתָּ֤ה זָקַ֨נְתָּה֙ בָּ֣אתָ בַ/יָּמִ֔ים וְ/הָ/אָ֛רֶץ נִשְׁאֲרָ֥ה הַרְבֵּֽה מְאֹ֖ד לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
translation:
  language: te
  text: 'యెహోషువ వృద్ధుడై, వయసు మళ్లినవాడయ్యాడు. యాహ్వే అతనితో ఇలా అన్నాడు: “నీవు వృద్ధుడవయ్యావు, నీకు వయసు మళ్లింది; స్వాధీనం చేసుకోవలసిన[a] భూమి ఇంకా చాలా మిగిలి ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారసత్వంగా పొందవలసిన.” హీబ్రూ క్రియకు భూమిని స్వాధీనం చేసుకోవడం లేదా దాన్ని వారసత్వంగా పొందడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: ముసలివాడై / ముసలివాడవయ్యావు
  rationale: ఇది యెహోషువ వృద్ధాప్య స్థితిని సూటిగా తెలిపే పదం. ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండే రూపాన్ని ఎంచుకుని, కథకుని వర్ణనలోనూ యెహోవా మాటలోనూ ఉన్న పునరుక్తిని నిలిపాం.
- source_word: בָּא בַּיָּמִים
  choice: వయసు మళ్లినవాడయ్యాడు / నీకు వయసు మళ్లింది
  rationale: అక్షరార్థంగా ‘దినాల్లోకి వచ్చాడు’ అనే హీబ్రూ నుడికారం ముదిమి వయసుకు చేరడాన్ని సూచిస్తుంది. ‘వయసు మళ్లింది’ ఆధునిక తెలుగులో సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఈ సందర్భంలో కనాను భూభాగాన్ని సూచించే సహజమైన తెలుగు పదం. ‘భూమి’ కంటే ‘దేశం’ భౌగోళిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נִשְׁאֲרָה הַרְבֵּה מְאֹד
  choice: ఇంకా చాలా మిగిలి ఉంది
  rationale: నిఫ్అల్ రూపంలోని ‘మిగిలి ఉంది’ అనే స్థితినీ, הַרְבֵּה מְאֹד లోని బలమైన పరిమాణ ఉద్ఘాటననూ సహజమైన తెలుగులో నిలిపాం.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవలసిన
  rationale: ירשׁ అనే క్రియకు స్వాధీనం చేసుకోవడం, వారసత్వంగా పొందడం అనే భావపరిధి ఉంది. ఇక్కడ మిగిలిన దేశాన్ని ఇశ్రాయేలు స్వాధీనం చేసుకోవడం ప్రధాన సందర్భార్థం; ప్రత్యామ్నాయ వారసత్వ భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను వాడాం.
- issue: ירשׁ క్రియలో స్వాధీనం–వారసత్వ భావసంభావ్యత
  choice: ప్రధాన పాఠంలో ‘స్వాధీనం చేసుకోవలసిన’
  alternative: ‘వారసత్వంగా పొందవలసిన’
  rationale: యెహోషువ గ్రంథంలోని తక్షణ సందర్భం దేశాన్ని ఆధీనంలోకి తీసుకోవడాన్ని ముందుకు తెస్తుంది; అయినా నిబంధనాత్మక వారసత్వ భావాన్ని తొలగించకుండా పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని కథకుని వర్ణనను యెహోవా మాటలు పునరావృతం చేయడాన్ని నిలిపాం. మూలంలో లేని ప్రారంభ కాలసూచక పదాన్ని చేర్చలేదు.
