  yaml_path: translation/ot/joshua/013/032.yaml
  text: These are what Moses apportioned as an inheritance in the plains of Moab[b][a], beyond the Jordan east of Jericho.
translation:
  language: te
  text: మోయాబు మైదానాల్లో, యెరికోకు తూర్పున యొర్దాను అవతల, మోషే వారసత్వంగా కేటాయించినవి ఇవే.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారసత్వంగా ఇచ్చిన’ లేదా ‘వారసత్వంగా పంచిపెట్టిన’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ భూమిని వారసత్వ స్వాస్థ్యంగా కేటాయించి పంచడం అనే భావాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘యొర్దాను ఆవల’ అని కూడా అనువదించవచ్చు. ‘యొర్దాను అవతల’ అనేది దృష్టికోణాన్ని బట్టి అర్థమయ్యే ప్రామాణిక హీబ్రూ భౌగోళిక ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: ప్రాంతాలు ఇవే
  rationale: ముందుగా వివరించిన భూభాగాలను సంక్షిప్తంగా సూచించే బహువచన నిర్దేశక-సంబంధ నిర్మాణం. తెలుగులో సహజంగా ఉండేందుకు సందర్భం నుంచి ‘ప్రాంతాలు’ను స్పష్టంచేశాం.
- source_word: נִחַל
  choice: వారసత్వంగా పంచిపెట్టిన
  rationale: హిఫీల్ రూపం భూమిని వారసత్వ స్వాస్థ్యంగా కేటాయించి పంచే భావాన్ని తెలియజేస్తుంది; ‘పంచిపెట్టిన’ పంపిణీని, ‘వారసత్వంగా’ స్వాస్థ్య భావాన్ని నిలుపుతాయి.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగులో ప్రాచుర్యంలో ఉన్న వ్యక్తి పేరు రూపం.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: మోయాబు మైదానాల్లో
  rationale: עֲרָבוֹת ఇక్కడ మోయాబు ప్రాంతంలోని సమతల/మైదాన భూభాగాన్ని సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘మైదానాలు’ స్పష్టమైన ఎంపిక.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: యొర్దాను అవతల
  rationale: ఇది దృష్టికోణాన్ని బట్టి ‘అవతల’ లేదా ‘ఆవలివైపు’ అని అర్థమయ్యే ప్రామాణిక భౌగోళిక ప్రయోగం. మూలంలోని దృష్టికోణ సంబంధిత స్వల్ప అస్పష్టతను ‘అవతల’ నిలుపుతుంది.
- source_word: יְרִיחוֹ מִזְרָחָה
  choice: యెరికోకు తూర్పున
  rationale: దిశాసూచక రూపాన్ని సహజమైన తెలుగు స్థానవాచక నిర్మాణంతో అనువదించాం.
