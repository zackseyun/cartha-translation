  text: וְ/עַתָּ֗ה חַלֵּ֞ק אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את בְּ/נַחֲלָ֖ה לְ/תִשְׁעַ֣ת הַ/שְּׁבָטִ֑ים וַ/חֲצִ֖י הַ/שֵּׁ֥בֶט הַֽ/מְנַשֶּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/007.yaml
  text: Now divide this land as an inheritance to the nine tribes and the half-tribe of Manasseh[a].
translation:
  language: te
  text: ఇప్పుడు ఈ దేశాన్ని తొమ్మిది గోత్రాలకూ మనష్షే అర్ధగోత్రానికీ స్వాస్థ్యంగా పంచిపెట్టు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇక ఈ దేశాన్ని తొమ్మిది గోత్రాలకూ మనష్షే గోత్రంలోని సగభాగానికీ స్వాస్థ్యంగా పంచిపెట్టు.”
    reason: వְעַתָּה లోని అనుసంధానక ‘మరియు/ఇక’ భావానికీ, וַחֲצִי הַשֵּׁבֶט అనే నిర్మాణాన్ని ‘అర్ధగోత్రం’కు బదులు ‘గోత్రంలోని సగభాగం’గా వ్యక్తం చేసే ప్రత్యామ్నాయానికీ స్థానం ఇవ్వడం.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: మునుపటి మాటను కొనసాగిస్తూ తదుపరి ఆజ్ఞను పరిచయం చేస్తుంది; తెలుగులో ‘ఇప్పుడు’ సహజంగా ఉంటుంది. ‘కాబట్టి ఇప్పుడు’ అని కారణార్థాన్ని చేర్చలేదు.
- source_word: חַלֵּק
  choice: పంచిపెట్టు
  rationale: యెహోషువను ఉద్దేశించిన ఏకవచన ఆజ్ఞ. భూమిని గ్రహీతల మధ్య విభజించి కేటాయించాలనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: ఈ దేశాన్ని
  rationale: చర్చలో ఉన్న భూభాగాన్ని సూచించే ప్రత్యక్ష కర్మ. ‘దేశం’ ఇక్కడ భూమి/ప్రాంతం అనే విస్తృత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנַחֲלָה
  choice: స్వాస్థ్యంగా
  rationale: నַחֲלָה గోత్రాలకు కేటాయించబడే వారసత్వ భూహక్కును సూచిస్తుంది. ‘స్వాస్థ్యం’ న్యాయపరమైన కేటాయింపునూ తరతరాల వారసత్వ భావాన్నీ నిలుపుతుంది.
- source_word: לְתִשְׁעַת הַשְּׁבָטִים
  choice: తొమ్మిది గోత్రాలకు
  rationale: లబ్ధిదారులను సూచించే לְ ను తెలుగులో ‘-కు’ విభక్తితో సహజంగా వ్యక్తం చేశాం.
- source_word: וַחֲצִי הַשֵּׁבֶט
  choice: అర్ధగోత్రానికి
  rationale: గోత్రంలోని గుర్తింపుపొందిన సగభాగాన్ని సూచించే నిర్మాణం. తెలుగులో సంప్రదాయంగా, సంక్షిప్తంగా ‘అర్ధగోత్రం’ అనడం స్పష్టంగా ఉంటుంది.
- source_word: הַמְנַשֶּׁה
  choice: మనష్షే
  rationale: వ్యక్తి/గోత్ర నామాన్ని అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
