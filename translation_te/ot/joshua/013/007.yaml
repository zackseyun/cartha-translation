  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆజ్ఞ యొక్క గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘స్వాస్థ్యం’ అనే బైబిలు-న్యాయపర పదం సందర్భంలోని వారసత్వ భూకేటాయింపు భావాన్ని కాపాడుతుంది.
