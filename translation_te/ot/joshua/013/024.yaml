translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వచనంలోని భూభాగం అనే కర్మను సందర్భం నుంచి పూరించకుండా మూలంలోని సంక్షిప్తతను నిలిపాం. ‘గోత్రం’ మరియు ‘వంశాలు’ అనే పదాలతో tribe–clan స్థాయుల భేదాన్ని సాధ్యమైనంత స్పష్టంగా ఉంచాం.
