  text: And Moses gave to the tribe of Gad[a], to the sons of Gad, according to their clans.
translation:
  language: te
  text: మోషే గాదు గోత్రానికి, గాదు కుమారులకు[a], వారి వంశాల ప్రకారం ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గాదు పిల్లలకు” లేదా “గాదు సంతానానికి.” హీబ్రూలో అక్షరాలా “గాదు కుమారులకు” అని ఉంది; ఇది గోత్ర-వంశ సంబంధాన్ని సూచించే సాధారణ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: భూభాగాల కేటాయింపు సందర్భంలో נתן ‘ఇవ్వడం/కేటాయించడం’ అనే భావాన్ని ఇస్తుంది. మూలంలో కర్మ ప్రత్యక్షంగా లేకపోవడంతో తెలుగులోనూ దానిని చేర్చకుండా ‘ఇచ్చాడు’ అని ఉంచాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రామాణికంగా వాడే రూపం.
- source_word: לְמַטֵּה גָד
  choice: గాదు గోత్రానికి
  rationale: ఈ భూభాగ కేటాయింపు సందర్భంలో מַטֶּה అంటే కర్ర కాదు, ‘గోత్రం’. לְ యొక్క గ్రహీత భావాన్ని ‘-కి’తో వ్యక్తం చేశాం.
- source_word: לִבְנֵי גָד
  choice: గాదు వంశస్థులకు
  rationale: בְּנֵי యొక్క అక్షరార్థం ‘కుమారులు’; అయితే ఇది ఇక్కడ గోత్ర-వంశ సంబంధమైన స్థిర ప్రయోగంగా గాదు సంతతి లేదా గోత్ర సభ్యులను సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా ఉండేందుకు ‘వంశస్థులు’ ఎంచుకున్నాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ గోత్రంలోని కుటుంబ-వంశ విభాగాన్ని సూచిస్తుంది. לְ యొక్క విభజనాత్మక భావాన్ని ‘ప్రకారం’ తెలియజేస్తుంది; ‘వారి వారి’ పంపిణీ భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
