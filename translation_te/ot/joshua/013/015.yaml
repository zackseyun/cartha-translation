lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן క్రియ యొక్క wayyiqtol రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సహజమైన వాక్యక్రమం వల్ల ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే క్రమానుసంధానం వ్యక్తమవుతుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: לְמַטֵּה
  choice: గోత్రానికి
  rationale: భూవిభజన సందర్భంలో מַטֶּה అంటే ‘గోత్రం’; לְ ఉపసర్గ గ్రహీతను సూచిస్తుంది.
- source_word: בְנֵי רְאוּבֵן
  choice: రూబేను కుమారుల
  rationale: హీబ్రూ బంధుత్వ ప్రయోగమైన ‘రూబేను కుమారులు’ అనే అక్షరార్థాన్ని నిలుపుతూ తెలుగులో సహజంగా గోత్రంతో అన్వయించబడింది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ గోత్రంలోని వంశ లేదా కుటుంబ విభాగాన్ని సూచిస్తుంది; לְ యొక్క విభజనాత్మక భావాన్ని ‘ప్రకారం’ స్పష్టంగా అందిస్తుంది.
