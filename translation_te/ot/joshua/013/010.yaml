source:
  edition: WLC
  text: וְ/כֹ֗ל עָרֵי֙ סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן עַד גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/010.yaml
  text: and all the cities of Sihon king of the Amorites[a], who reigned in Heshbon, as far as the border of the sons of Ammon.
translation:
  language: te
  text: మరియు హెష్బోనులో రాజ్యమేలిన అమోరీయుల రాజైన సీహోనుకు చెందిన పట్టణాలన్నీ అమ్మోనీయుల[a] సరిహద్దు వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “అమ్మోను కుమారులు.” హీబ్రూలో: “అమ్మోను కుమారులు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל עָרֵי
  choice: పట్టణాలన్నీ
  rationale: כֹל యొక్క సమగ్రతను సహజమైన తెలుగు సమాస రూపంలో వ్యక్తం చేస్తుంది; עָרֵי నిర్మాణ బహువచనం. వాక్యం మునుపటి భూభాగ జాబితాకు కొనసాగింపైనందున తెలుగు వాక్యనిర్మాణంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే అనుసంధానం నిలుస్తుంది.
- source_word: סִיחוֹן
  choice: సీహోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణకు అనుగుణంగా అందిస్తుంది.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: అమోరీయుల రాజు
  rationale: నిర్మాణ సంబంధాన్ని స్పష్టంగా ఉంచుతూ, ఏకవచన జాతివాచక రూపం సందర్భంలో సూచించే ప్రజాసమూహాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר מָלַךְ בְּ/חֶשְׁבּוֹן
  choice: హెష్బోనులో రాజ్యమేలిన
  rationale: מָלַךְ లోని రాజుగా పరిపాలించడం అనే ప్రత్యేక భావాన్ని ‘రాజ్యమేలిన’ కాపాడుతుంది; בְ స్థానార్థాన్ని ‘లో’ తెలియజేస్తుంది.
- source_word: עַד גְּבוּל
  choice: సరిహద్దు వరకు
  rationale: עַד సూచించే భౌగోళిక విస్తృతి ముగింపును సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారులు’; ఇక్కడ స్థిరమైన జాతివాచకంగా వాడబడినందున ఆధునిక తెలుగులో ‘అమ్మోనీయులు’ సహజమైన సమానార్థకం.
