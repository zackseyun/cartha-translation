translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; భూభాగ జాబితాకు తగిన సంక్షిప్త, గౌరవప్రద శైలి. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, సంబంధ వాక్యాన్ని ముందుకు తెచ్చి సహజ తెలుగు నిర్మాణం వాడబడింది.
