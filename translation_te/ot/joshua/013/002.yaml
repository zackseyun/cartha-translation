  yaml_path: translation/ot/joshua/013/002.yaml
  text: 'This is the land that remains: all the districts of the Philistines[b][a], and all the Geshurites—'
translation:
  language: te
  text: 'మిగిలివున్న భూభాగం ఇదే: ఫిలిష్తీయుల ప్రాంతాలన్నీ[a], గెషూరీయుల ప్రాంతమంతా[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భూభాగాలన్నీ.’ హీబ్రూ పదం ఫిలిష్తీయులతో అనుబంధమున్న భౌగోళిక విభాగాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘గెషూరీయుడు’ అనే ఏకవచన జాతివాచక రూపం ఉంది; ఇది సమూహంగా గెషూరీయులను సూచించవచ్చు. సందర్భానుసారం ఇక్కడ వారి ప్రాంతమంతా అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ הַנִּשְׁאָרֶת
  choice: మిగిలి ఉన్న దేశం ఇదే
  rationale: స్త్రీలింగ ఏకవచన సూచక సర్వనామం, ‘దేశం,’ మరియు שׁאר నిఫల్ కృదంతం కలిసిన వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ఇంకా స్వాధీనం కాని భూభాగం అనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: כָּל גְּלִילוֹת
  choice: ప్రాంతాలన్నీ
  rationale: גְּלִילוֹת అనేది భౌగోళిక విభాగాలు లేదా ప్రాంతాలను సూచిస్తుంది. ‘ప్రాంతాలు’ సాధారణ పాఠకులకు సహజంగా ఉండి, అతిగా పరిపాలనా అర్థాన్ని విధించదు.
- source_word: הַפְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల
  rationale: మూలంలో భూభాగపు పేరు కాక ప్రజావర్గపు పేరు ఉంది; సంబంధ విభక్తి రూపం ఆ ప్రాంతాలు వారితో అనుబంధమై ఉన్నాయని తెలియజేస్తుంది.
- source_word: וְכָל הַגְּשׁוּרִי
  choice: గెషూరీయుల ప్రాంతమంతా
  rationale: ఏకవచన జాతివాచక రూపం సమూహార్థకంగా ఉంది. సందర్భంలో మిగిలిన భూభాగాల జాబితా కొనసాగుతున్నందున, తెలుగులో ‘ప్రాంతమంతా’ అని పూరించడం భౌగోళిక భావాన్ని స్పష్టం చేస్తుంది; పాదసూచిక మూలంలోని అక్షరార్థ రూపాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన భాషను ఉపయోగించాం. భౌగోళిక జాబితా మధ్యలో వాక్యం కొనసాగుతుందని చివరి దీర్ఘవిరామం సూచిస్తుంది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలకు ఖచ్చితంగా సరిపోతాయి.
