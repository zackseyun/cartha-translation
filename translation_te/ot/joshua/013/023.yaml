source:
  edition: WLC
  text: וַ/יְהִ֗י גְּבוּל֙ בְּנֵ֣י רְאוּבֵ֔ן הַ/יַּרְדֵּ֖ן וּ/גְב֑וּל זֹ֣את נַחֲלַ֤ת בְּנֵֽי רְאוּבֵן֙ לְ/מִשְׁפְּחֹתָ֔/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/023.yaml
  text: And the border of the sons of Reuben was the Jordan and its border. This was the inheritance of the sons of Reuben according to their clans[a], the cities and their villages.
translation:
  language: te
  text: రూబేను సంతతివారి సరిహద్దు యొర్దాను నది మరియు దాని సరిహద్దు[a]. ఇది రూబేను సంతతివారికి వారి వంశాల ప్రకారం వచ్చిన స్వాస్థ్యం—పట్టణాలు, వాటి గ్రామాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొర్దాను నదే సరిహద్దు.” హీబ్రూ పదబంధం అతి సంక్షిప్తంగా “యొర్దాను మరియు సరిహద్దు” అని ఉంది; యొర్దాను నదినే సరిహద్దు రేఖగా గుర్తిస్తున్నట్లు దీనిని అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉంది / అయింది అనే భావంలో ‘సరిహద్దు …’
  rationale: సరిహద్దును తెలిపే ఈ సూత్రబద్ధ వాక్యంలో היה మార్పును కాక, సరిహద్దు ఏమిటో తెలియజేస్తుంది; తెలుగులో నామవాక్య నిర్మాణం సహజంగా ఉంటుంది.
- source_word: גְּבוּל
  choice: సరిహద్దు
  rationale: భూభాగపు హద్దును సూచించే సందర్భానికి ఇది సహజమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: בְּנֵי רְאוּבֵן
  choice: రూబేను సంతతివారు
  rationale: హీబ్రూ వంశసంబంధ భావాన్ని కాపాడుతూ, ‘రూబేను కుమారులు’ అనే అపార్థాన్ని నివారించే సహజ తెలుగు రూపం.
- source_word: הַיַּרְדֵּן
  choice: యొర్దాను నది
  rationale: తెలుగు పాఠకులకు ఇది నది అని వెంటనే స్పష్టమయ్యేలా భౌగోళిక నామంతో ‘నది’ చేర్చబడింది.
- source_word: וּגְבוּל
  choice: దాని సరిహద్దు
  rationale: హీబ్రూ పదబంధంలోని సంక్షిప్తతను ప్రధాన పాఠంలో దగ్గరగా నిలుపుతూ, యొర్దాను నదే సరిహద్దు అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: נַחֲלַת
  choice: స్వాస్థ్యం
  rationale: ఇశ్రాయేలు గోత్రానికి కేటాయించబడిన వారసత్వ భూభాగాన్ని సూచించే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వారి వంశాల ప్రకారం
  rationale: గోత్రంలోని ఉపవంశాల లేదా వంశవర్గాల ప్రకారం పంచబడిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֶעָרִים
  choice: పట్టణాలు
  rationale: ఆధునిక తెలుగులో עָרִיםకు సహజమైన సమానార్థకం; ప్రాచీన స్థలాల ఆధునిక పరిమాణంపై అనవసర ఊహను రుద్దదు.
- source_word: וְחַצְרֵיהֶן
  choice: వాటి గ్రామాలు
  rationale: పట్టణాలకు అనుబంధంగా ఉన్న చిన్న, సాధారణంగా ప్రాకారం లేని నివాస ప్రాంతాలను పాఠకులకు సులభంగా అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. గోత్ర-వంశ సంబంధాన్ని స్పష్టంగా చూపడానికి ‘రూబేను సంతతివారు’, ఉపవిభాగాలకు ‘వంశాలు’ వాడబడ్డాయి. హీబ్రూ సరిహద్దు సూత్రంలోని నిజమైన సంక్షిప్తతను, ద్వంద్వార్థాన్ని పాదసూచికతో నిలుపుకున్నాం.
