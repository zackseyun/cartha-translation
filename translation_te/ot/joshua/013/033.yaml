id: JOS.13.33
reference: Joshua 13:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/שֵׁ֨בֶט֙ הַ/לֵּוִ֔י לֹֽא נָתַ֥ן מֹשֶׁ֖ה נַחֲלָ֑ה יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָתָ֔/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
translation:
  language: te
  text: అయితే లేవి గోత్రానికి మోషే స్వాస్థ్యాన్ని ఇవ్వలేదు; ఇశ్రాయేలు దేవుడైన యెహోవాయే[a] వారి స్వాస్థ్యం—ఆయన వారికి చెప్పినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్వాస్థ్యం’ అనే పదానికి రెండు చోట్లా ‘వాటా’ అని కూడా అనువదించవచ్చు.
    reason: నַחֲלָה అనే హీబ్రూ పదానికి ఈ సందర్భంలో ‘స్వాస్థ్యం’తో పాటు ‘వాటా/భాగం’ అనే అర్థప్రత్యామ్నాయం ఉంది; ఇది వచనంలోని రెండు సందర్భాలకూ వర్తిస్తుంది.
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַלֵּוִי
  choice: అయితే లేవి గోత్రానికి
  rationale: וּ సందర్భంలో ముందటి గోత్రాల భూవిభజనతో వ్యత్యాసాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది. שֵׁבֶט הַלֵּוִי వ్యక్తిని కాక లేవి గోత్రాన్ని సూచిస్తుంది.
- source_word: לֹא נָתַן מֹשֶׁה
  choice: మోషే ... ఇవ్వలేదు
  rationale: హీబ్రూ వాక్యంలోని సాధారణ భూతకాల నిరాకరణను సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: נַחֲלָה / נַחֲלָתָם
  choice: స్వాస్థ్యం / వారి స్వాస్థ్యం
  rationale: ఈ అధ్యాయంలోని భూవాటా భావాన్నీ, యెహోవాయే లేవీయుల స్వాస్థ్యం అనే నిబంధనాత్మక రూపకాన్నీ ఒకే పదంతో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరంగా వినియోగంలో ఉన్న వ్యక్తినామ రూపంతో అందిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ సంబంధంగా వ్యక్తపరుస్తుంది.
- source_word: הוּא נַחֲלָתָם
  choice: యెహోవాయే వారి స్వాస్థ్యం
  rationale: హీబ్రూలోని స్పష్టమైన הוּא ఇచ్చే ఉద్ఘాటనను తెలుగు ‘-యే’ ద్వారా నిలుపుతూ, యెహోవా స్వయంగా వారి స్వాస్థ్యమనే వాక్యబలాన్ని కాపాడుతుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: ఆయన వారికి చెప్పినట్లే
  rationale: דבר యొక్క ప్రాథమిక ‘మాట్లాడు/చెప్పు’ భావానికి దగ్గరగా ఉండి, ‘వాగ్దానం చేశాడు’ అనే మరింత వ్యాఖ్యానాత్మక అర్థాన్ని చేర్చదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన నామరూపంతో ఉంచాం.
- issue: లేవి గోత్రపు స్వాస్థ్య స్వభావం
  choice: యెహోవాయే వారి స్వాస్థ్యం
  alternative: యెహోవా వారి భాగం
  rationale: దేవుడే వారి స్వాస్థ్యమని హీబ్రూ నేరుగా చేసే ఉద్విగ్నమైన ధార్మిక ప్రకటనను యాజక సదుపాయాలు లేదా ఆదాయంగా కుదించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘స్వాస్థ్యం’ భూవిభజన భావాన్నీ ధార్మిక రూపకాన్నీ కలిపి నిలుపుతుంది; ‘యెహోవాయే’ మూలంలోని ఉద్ఘాటనను సహజంగా వ్యక్తపరుస్తుంది. ప్రధాన పాఠంలోని [a] సూచిక పాదటిప్పణితో సరిపోలుతుంది.
