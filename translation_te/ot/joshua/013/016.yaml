translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి వాడబడింది. మూలంలోని భౌగోళిక పదాల అస్పష్టతను పాదసూచికల్లో నిలిపాం. ఇంగ్లీషు సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని చోట్ల కనిపించినందున, [a]ను ‘వాగులోయ’ వద్దவும் [b]ను ‘పీఠభూమి’ వద్దவும் ఉంచాం.
