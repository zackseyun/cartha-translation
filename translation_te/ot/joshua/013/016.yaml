source:
  edition: WLC
  text: וַ/יְהִ֨י לָ/הֶ֜ם הַ/גְּב֗וּל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/הָ/עִ֨יר אֲשֶׁ֧ר בְּ/תוֹךְ הַ/נַּ֛חַל וְ/כָל הַ/מִּישֹׁ֖ר עַל מֵידְבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
translation:
  language: te
  text: వారి సరిహద్దు అర్నోను లోయ[a] అంచున ఉన్న అరోయేరు నుండి మొదలై, ఆ లోయ మధ్యలో ఉన్న పట్టణాన్ని, మేదెబా వరకు ఉన్న పీఠభూమి[b] అంతటినీ కలిగి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అర్నోను వాగు ఒడ్డున’ లేదా ‘అర్నోను వాగు ప్రవాహపాత్ర అంచున’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం נַחַל వాగును, వాగు ప్రవాహపాత్రను లేదా లోయను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘సమతల ప్రాంతం’ లేదా ‘మైదానం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: వారి సరిహద్దు ... కలిగి ఉంది
  rationale: గְּבוּל ఇక్కడ గోత్రానికి కేటాయించిన సరిహద్దు/ప్రాంతాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో తరువాత వచ్చే పట్టణం, పీఠభూమిని సహజంగా అనుసంధానించేందుకు ‘కలిగి ఉంది’ వాడబడింది.
- source_word: מֵעֲרוֹעֵר
  choice: అరోయేరు నుండి మొదలై
  rationale: מִן సరిహద్దు ప్రారంభబిందువును సూచిస్తుంది; స్థలనామాన్ని ధ్వన్యనువాదం చేసి, తెలుగులో దిశను స్పష్టంగా తెలిపేందుకు ‘నుండి మొదలై’ అని ఇచ్చాం.
- source_word: אֲשֶׁר עַל שְׂפַת נַחַל אַרְנוֹן
  choice: అర్నోను వాగులోయ అంచున ఉన్న
  rationale: שָׂפָה అంటే అంచు లేదా ఒడ్డు; נַחַל ప్రవాహపాత్ర, వాగు లేదా లోయను సూచించగలదు. ‘వాగులోయ’ ఈ భౌగోళిక ద్వంద్వభావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: ఆ లోయ మధ్యలో ఉన్న పట్టణాన్ని
  rationale: בְּתוֹךְ యొక్క ‘మధ్యలో/లోపల’ అనే స్థానార్థాన్ని నేరుగా ఉంచి, నిర్దిష్టమైన పట్టణాన్ని మూలంలోని definite article ప్రకారం పేర్కొన్నాం.
- source_word: וְכָל הַמִּישֹׁר
  choice: పీఠభూమి అంతటినీ
  rationale: מִישׁוֹר మోయాబు ప్రాంతంలోని సమతలమైన ఎత్తైన భూభాగాన్ని సూచిస్తుంది. సాధారణ ‘మైదానం’ కంటే ‘పీఠభూమి’ భౌగోళిక స్వరూపాన్ని మెరుగ్గా తెలియజేస్తుంది.
- source_word: עַל מֵידְבָא
  choice: మేదెబా వరకు ఉన్న
  rationale: సరిహద్దు వర్ణనలో עַל ఒక ప్రదేశం వరకు వ్యాపించిన పరిమితిని సూచించగలదు; అందువల్ల సహజమైన తెలుగులో ‘మేదెబా వరకు’ అని అనువదించాం.
