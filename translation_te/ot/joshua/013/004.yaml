source:
  edition: WLC
  text: מִ/תֵּימָ֞ן כָּל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֗י וּ/מְעָרָ֛ה אֲשֶׁ֥ר לַ/צִּידֹנִ֖ים עַד אֲפֵ֑קָ/ה עַ֖ד גְּב֥וּל הָ/אֱמֹרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/004.yaml
  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
translation:
  language: te
  text: దక్షిణం నుండి[a], కనానీయుల దేశమంతా[c], మరియు సీదోనీయులకు చెందిన మెయారా[b], ఆఫేకు వరకు, అమోరీయుల సరిహద్దు వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తేమాను నుండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సీదోనీయులకు చెందిన గుహ.’ హీబ్రూ పదాన్ని స్థలనామంగా కాక సాధారణ నామవాచకంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘కనానీయుడు,’ ‘అమోరీయుడు’ అనే జాతినామాలు ఏకవచనంలో ఉండి, ఇక్కడ సమూహార్థాన్ని ఇస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּימָן
  choice: దక్షిణం నుండి
  rationale: תֵּימָן సాధారణంగా ‘దక్షిణం’ లేదా ‘దక్షిణ ప్రాంతం’ అని సూచిస్తుంది. ఇక్కడ భూభాగపు విస్తారాన్ని వర్ణిస్తున్నందున దిశాసూచక అర్థమే సందర్భానికి సరిపోతుంది; అయినా దీనిని ‘తేమాను నుండి’ అనే స్థలనామంగా గ్రహించే అవకాశం ఉంది.
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  choice: కనానీయుల దేశమంతా
  rationale: హీబ్రూలో అక్షరార్థంగా ‘కనానీయుని దేశమంతా’ అనే ఏకవచన జాతినామం ఉన్నా, అది సమూహార్థంలో వాడబడింది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు బహువచన రూపం ఉపయోగించబడింది.
- source_word: וּמְעָרָה
  choice: మెయారా
  rationale: מְעָרָה అనే రూపానికి ‘గుహ’ అనే సాధారణ నామవాచక అర్థం ఉండగలిగినా, ఈ భౌగోళిక జాబితాలో అది స్థలనామంగా ఉండే అవకాశం ఎక్కువ. అందువల్ల అర్థాన్ని ముందే నిర్ణయించకుండా ‘మెయారా’ అని లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר לַצִּידֹנִים
  choice: సీదోనీయులకు చెందిన
  rationale: ל ఉపసర్గ ఇక్కడ సంబంధం లేదా స్వామ్యాన్ని సూచిస్తుంది. ‘సీదోనీయులకు చెందిన’ అనేది ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַד אֲפֵקָה
  choice: ఆఫెకు వరకు
  rationale: עַד భూభాగం చేరే చివరి స్థలాన్ని సూచిస్తుంది; స్థలనామానికి ఉన్న దిశార్థక ప్రత్యయం తెలుగులో ‘వరకు’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: עַד גְּבוּל הָאֱמֹרִי
  choice: అమోరీయుల సరిహద్దు వరకు
  rationale: גְּבוּל ఇక్కడ భూవర్ణనలో ‘సరిహద్దు’ అని అర్థం. ఏకవచన జాతినామమైన הָאֱמֹרִי సమూహార్థంలో ఉన్నందున తెలుగులో ‘అమోరీయుల’ అని ఇవ్వబడింది.
