- from: అతనితోపాటు[a] రూబేనీయులు, గాదీయులు తమ స్వాస్థ్యాన్ని పొందారు; యొర్దాను అవతల తూర్పున[b] మోషే వారికి ఇచ్చినదే అది—యహ్వే సేవకుడైన మోషే వారికి ఇచ్చినట్లుగానే.
  to: అతనితోపాటు[a] రూబేనీయులూ గాదీయులూ తమ స్వాస్థ్యాన్ని పొందారు; యొర్దాను అవతల తూర్పున[b] మోషే వారికి ఇచ్చిన ఆ స్వాస్థ్యాన్ని యహ్వే సేవకుడైన మోషే వారికి ఇచ్చినట్లుగానే వారు పొందారు.
