id: JOS.13.8
reference: Joshua 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עִמּ֗/וֹ הָ/רֽאוּבֵנִי֙ וְ/הַ/גָּדִ֔י לָקְח֖וּ נַחֲלָתָ֑/ם אֲשֶׁר֩ נָתַ֨ן לָ/הֶ֜ם מֹשֶׁ֗ה בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה כַּ/אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
translation:
  language: te
  text: అతనితోపాటు[a] రూబేనీయులూ గాదీయులూ తమ స్వాస్థ్యాన్ని పొందారు; యొర్దాను అవతల తూర్పున[b] మోషే వారికి ఇచ్చిన ఆ స్వాస్థ్యాన్ని యహ్వే సేవకుడైన మోషే వారికి ఇచ్చినట్లుగానే వారు పొందారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అతనితోపాటు” అని హెబ్రీలో ఉంది. ఇది ముందటి సందర్భంలో చెప్పిన మనష్షే అర్ధగోత్రాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: referent_ambiguity
  - marker: b
    text: అంటే యొర్దాను నదికి తూర్పు వైపున.
    reason: cultural_note
lexical_decisions:
- source_word: עִמּוֹ
  choice: అతనితోపాటు
  rationale: ఈ పదానికి అక్షరార్థం ‘అతనితో’. ముందు సందర్భంలోని మనష్షే అర్ధగోత్రాన్ని సమూహంగా సూచిస్తున్నట్లు కనిపించినా, హెబ్రీలోని పుంలింగ ఏకవచన రూపాన్ని అనువాదంలో నిలిపి, దాని సూచనను పాదటీపులో వివరించాం.
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  choice: రూబేనీయులు, గాదీయులు
  rationale: హెబ్రీలో గోత్రనామాలు వ్యాకరణపరంగా ఏకవచనంలో ఉన్నా, ఇక్కడ ఆయా గోత్రాల ప్రజలను సమష్టిగా సూచిస్తున్నాయి; అందువల్ల తెలుగులో సహజమైన బహువచనం వాడాం.
- source_word: לָקְחוּ נַחֲלָתָם
  choice: తమ స్వాస్థ్యాన్ని పొందారు
  rationale: לקח అంటే ‘తీసుకొను/పొందు’; భూస్వాస్థ్యాన్ని స్వీకరించిన సందర్భంలో ‘పొందారు’ సహజంగా ఉంది. נחלהలోని వారసత్వంగా కేటాయించబడిన భూమి భావాన్ని ‘స్వాస్థ్యం’ నిలుపుతుంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: యొర్దాను అవతల తూర్పున
  rationale: ‘యొర్దాను అవతల’ అనే భౌగోళిక వ్యక్తీకరణను, מִזְרָחָה ఇచ్చే తూర్పు దిశ స్పష్టీకరణతో కలిపి మూలానికి దగ్గరగా అనువదించాం.
- source_word: כַּאֲשֶׁר
  choice: ఇచ్చినట్లుగానే
  rationale: ఈ తులనాత్మక సంధి ‘ఎలాగైతే/అలాగే’ అనే ధృవీకరణ భావాన్ని ఇస్తుంది. మూలంలోని మోషే ఇచ్చాడనే పునరుక్తిని తొలగించకుండా ఉంచాం.
- source_word: עֶבֶד יְהוָה
  choice: యహ్వే సేవకుడైన
  rationale: మోషేకు ఇవ్వబడిన గౌరవసూచక బిరుదును ‘సేవకుడు’గా, יהוה అనే దైవనామాన్ని శీర్షికతో భర్తీ చేయకుండా ‘యహ్వే’గా ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమైన చతురక్షరి నామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ఆధునికంగా గుర్తించదగిన లిప్యంతరీకరణ ‘యహ్వే’గా నిలిపాం.
- issue: మోషే ఇచ్చినదనే పునరుక్తి
  choice: రెండు ప్రస్తావనలనూ నిలిపివేయడం
  alternative: ఒకే సహజ వాక్యంగా కుదించడం
  rationale: אֲשֶׁר נָתַן... כַּאֲשֶׁר נָתַן అనే మూల నిర్మాణంలో ఉద్దేశపూర్వక ధృవీకరణ లేదా వాక్యపునరారంభం ఉండవచ్చు. దాన్ని మృదువుగా తొలగించకుండా తెలుగు వాక్యంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘స్వాస్థ్యం’ బైబిలు భూకేటాయింపు భావాన్ని నిలుపుతుంది; వాక్యంలోని డ్యాష్ మూలంలోని పునరుక్త ధృవీకరణను చదవడానికి సులభంగా చేస్తుంది.
