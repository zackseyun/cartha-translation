lexical_decisions:
- source_word: קִרְיָתַיִם
  choice: కిర్యాతయిము
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా, హీబ్రూ ఉచ్చారణను ఆధారంగా చేసుకొని తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: שִׂבְמָה
  choice: సిబ్మా
  rationale: ఇది స్థలనామం. హీబ్రూ שׂ ధ్వనిని ‘స’గా ప్రతిబింబిస్తూ సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించబడింది.
- source_word: צֶרֶת הַשַּׁחַר
  choice: జెరెత్-షహర్
  rationale: పట్టణాల జాబితాలో ఇది సంయుక్త స్థలనామంగా పనిచేస్తున్నందున ప్రధాన పాఠ్యంలో అర్థానువాదం కాకుండా లిప్యంతరీకరణను ఉంచాం.
- source_word: בְּהַר הָעֵמֶק
  choice: లోయలోని కొండ మీద
  rationale: בְּను స్థానార్థకంగా ‘మీద’ అని, הַרను ఈ స్థానిక భూవర్ణనలో ‘కొండ’ అని అనువదించాం. హీబ్రూ నిర్మాణంలోని ‘లోయకు చెందిన కొండ’ అనే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో ‘లోయలోని కొండ’గా వ్యక్తం చేశాం.
