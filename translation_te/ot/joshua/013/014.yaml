source:
  edition: WLC
  text: רַ֚ק לְ/שֵׁ֣בֶט הַ/לֵּוִ֔י לֹ֥א נָתַ֖ן נַחֲלָ֑ה אִשֵּׁ֨י יְהוָ֜ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/014.yaml
  text: Only to the tribe of Levi he gave no inheritance[a]; the offerings by fire to Yahweh, the God of Israel, are his inheritance[b], as he spoke to him.
translation:
  language: te
  text: లేవి గోత్రానికి మాత్రమే అతడు స్వాస్థ్యం ఇవ్వలేదు; ఇశ్రాయేలు దేవుడైన యెహోవాకు అగ్న్యర్పణలే[a] దాని స్వాస్థ్యం[b], ఆయన లేవి గోత్రానికి చెప్పినట్లుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘యెహోవా అగ్న్యర్పణలు.’
    reason: lexical_alternative
  - marker: b
    text: సమీప వచనాల వెలుగులో కొందరు దీనిని, ‘యెహోవా, ఇశ్రాయేలు దేవుడే దాని స్వాస్థ్యం’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: అయితే ... మాత్రం
  rationale: ముందటి భూవిభజనకు లేవి గోత్రం మినహాయింపు అని తెలియజేసే నిర్బంధక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְשֵׁבֶט הַלֵּוִי
  choice: లేవి గోత్రానికి
  rationale: נתן ‘ఇవ్వు’ అనే క్రియతో ఉన్న לְ సంబంధాన్ని తెలుగులో సహజమైన సంప్రదాన విభక్తితో వ్యక్తం చేస్తుంది.
- source_word: לֹא נָתַן נַחֲלָה
  choice: అతడు స్వాస్థ్యం ఇవ్వలేదు
  rationale: భూవాటా సందర్భంలో נַחֲלָהకు ‘స్వాస్థ్యం’ తగినది; హీబ్రూ వాక్య నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אִשֵּׁי יְהוָה
  choice: యెహోవాకు అగ్నితో అర్పించే అర్పణలు
  rationale: אִשֵּׁי యొక్క అగ్ని ద్వారా అర్పించే బలుల భావాన్ని వ్యాఖ్యాత్మకంగా మార్చకుండా, ఆధునిక తెలుగులో గ్రాహ్యంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగులో స్థిరపడిన ప్రత్యక్ష రూపంతో సూచిస్తుంది; సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చదు.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో ఇస్తుంది.
- source_word: הוּא נַחֲלָתוֹ
  choice: అర్పణలే దాని స్వాస్థ్యం
  rationale: సమీప పూర్వపదమైన అర్పణలను స్వాస్థ్యంగా గ్రహించే ప్రధాన వాక్యనిర్మాణాన్ని అనుసరిస్తుంది. ఏకవచన הוּאను తెలుగు ఉద్ఘాటక ‘ఏ’ ద్వారా సహజంగా ప్రతిబింబిస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: ఆయన దానితో చెప్పినట్లుగా
  rationale: דבר యొక్క ‘చెప్పు/మాట్లాడు’ భావాన్ని ‘వాగ్దానం చేయు’గా విస్తరించదు; గోత్రాన్ని సమష్టిగా సూచించే ఏకవచన సర్వనామాన్ని నిలుపుతుంది.
theological_decisions:
- issue: లేవి గోత్రపు స్వాస్థ్యం యొక్క స్వరూపం
  choice: యెహోవాకు అగ్నితో అర్పించే అర్పణలే దాని స్వాస్థ్యం
  alternative: యెహోవా, ఇశ్రాయేలు దేవుడే దాని స్వాస్థ్యం
  rationale: ఈ వచనంలోని సమీప వాక్యనిర్మాణం ‘యెహోవా అగ్న్యర్పణలు’ అనే పదబంధాన్ని ‘దాని స్వాస్థ్యం’తో కలుపుతుంది. అయితే సమీప వచనాల వెలుగులో యెహోవానే స్వాస్థ్యమని గ్రహించే పఠనం కూడా సాధ్యమైనందున దాన్ని పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘దాని’ అనే రూపం లేవి గోత్రాన్ని సమష్టిగా సూచించి, అస్పష్టమైన పురుష సర్వనామాన్ని నివారిస్తుంది. రెండు పాదటిప్పణి గుర్తులూ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
