id: JOS.13.31
reference: Joshua 13:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/חֲצִ֤י הַ/גִּלְעָד֙ וְ/עַשְׁתָּר֣וֹת וְ/אֶדְרֶ֔עִי עָרֵ֛י מַמְלְכ֥וּת ע֖וֹג בַּ/בָּשָׁ֑ן לִ/בְנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה לַ/חֲצִ֥י בְנֵֽי מָכִ֖יר לְ/מִשְׁפְּחוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
translation:
  language: te
  text: గిలియాదులో సగభాగం, అలాగే బాషానులో ఓగు రాజ్యపు పట్టణాలైన[a] అష్తారోతు, ఎద్రెయి—మనష్షే కుమారుడైన మాకీరు కుమారులకు, అంటే మాకీరు కుమారుల్లో సగం మందికి[b], వారి వంశాల ప్రకారం ఇవ్వబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఓగు రాజపట్టణాలు’ అని కూడా అనువదించవచ్చు. హెబ్రీలో అక్షరార్థంగా ‘ఓగు రాజ్యపు పట్టణాలు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మాకీరు కుమారులు’ అనే మాట మాకీరు వంశస్థులను విస్తృతంగా సూచించవచ్చు; అనువాదంలో హెబ్రీలోని కుటుంబ సంబంధ పదప్రయోగాన్ని నిలిపాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  choice: గిలియాదులో సగభాగం
  rationale: భూభాగ కేటాయింపు సందర్భంలో חֲצִי అనే పదాన్ని ‘సగభాగం’గా అనువదించడం సహజం; హెబ్రీలోని నిర్దిష్ట ఉపపదాన్ని తెలుగు స్థలనామంతో విడిగా చూపాల్సిన అవసరం లేదు.
- source_word: עַשְׁתָּרוֹת וְאֶדְרֶעִי
  choice: అష్తారోతు, ఎద్రెయి
  rationale: ఈ స్థలనామాలకు మూలభాష ఉచ్చారణను దగ్గరగా నిలిపే తెలుగు లిప్యంతరీకరణలు వాడబడ్డాయి.
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: బాషానులో ఓగు రాజ్యపు పట్టణాలు
  rationale: హెబ్రీ సంధిపదబంధంలోని సంబంధాన్ని నేరుగా నిలిపింది; ఇవి రాజధానులని లేదా ప్రత్యేక రాజపట్టణాలని నిర్ధారించకుండా, ఓగు రాజ్యానికి చెందిన పట్టణాలనే భావాన్ని ఇస్తుంది.
- source_word: לִבְנֵי מָכִיר בֶּן־מְנַשֶּׁה
  choice: మనష్షే కుమారుడైన మాకీరు కుమారులకు
  rationale: לְ కేటాయింపును సూచిస్తుంది; వాక్యానికి అవసరమైన ‘ఇవ్వబడ్డాయి’ అనే క్రియను తెలుగులో చేర్చాం. בְנֵי లోని కుటుంబ సంబంధ పదాన్ని ‘కుమారులు’గా నిలిపాం.
- source_word: לַחֲצִי בְנֵי מָכִיר
  choice: మాకీరు కుమారుల్లో సగం మందికి
  rationale: మాకీరు వంశంలోని ఒక సగభాగమే ఉద్దేశించబడిందని స్పష్టం చేస్తుంది; మూలంలో లేని ‘అర్ధగోత్రం’ అనే పదాన్ని చేర్చలేదు.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: భూభాగ కేటాయింపు సందర్భంలో מִשְׁפָּחוֹת ఉపగోత్ర లేదా విస్తృత కుటుంబ విభాగాలను సూచిస్తుంది; ‘వంశాలు’ ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండి ఆ వంశావళి భావాన్ని అందిస్తుంది.
