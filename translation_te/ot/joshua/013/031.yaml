translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగులో స్పష్టత కోసం ‘అలాగే’, ‘అంటే’, ‘ఇవ్వబడ్డాయి’ చేర్చబడ్డాయి. స్థలనామాలు మూలభాషకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
