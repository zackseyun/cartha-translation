source:
  edition: WLC
  text: וַ/יִּתְּנ֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/לְוִיִּ֔ם אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה בַּ/גּוֹרָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/008.yaml
  text: So the sons of Israel gave to the Levites these cities with their pasturelands[a], as Yahweh had commanded by the hand of Moses, by lot.
translation:
  language: te
  text: కాబట్టి ఇశ్రాయేలీయులు, యాహ్వే మోషే ద్వారా ఆజ్ఞాపించిన ప్రకారం, ఈ పట్టణాలను వాటి పచ్చికబయళ్లతో[a] సహా లేవీయులకు చీట్ల ద్వారా ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, పట్టణాల చుట్టూ పశువులను మేపడానికి, ఇతర సామూహిక అవసరాలకు ఉంచిన బహిరంగ భూములు.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ఇచ్చారు
  rationale: נתן అనే క్రియకు ఇక్కడ పట్టణాలను లేవీయులకు ఇవ్వడం లేదా కేటాయించడం అనే భావం ఉంది; సందర్భంలో ‘ఇచ్చారు’ సహజంగా, నేరుగా ఉంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే మొత్తం సమాజాన్ని సూచించే ఈ హీబ్రూ జాతీయ నామానికి ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజమైన సమానార్థకం.
- source_word: לַלְוִיִּם
  choice: లేవీయులకు
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే దత్తి విభక్తి రూపం.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాలను
  rationale: ముందు పేర్కొన్న నిర్దిష్ట పట్టణాలను సూచించే నిర్దేశక పదబంధాన్ని నిలుపుతుంది.
- source_word: מִגְרְשֵׁיהֶן
  choice: వాటి పచ్చికబయళ్లతో
  rationale: מִגְרָשׁ పట్టణాల చుట్టూ పశువుల మేత మొదలైన సామూహిక అవసరాలకు ఉంచిన బహిరంగ భూమిని సూచిస్తుంది; ‘పచ్చికబయళ్లు’ దాని ప్రధాన ప్రాయోగిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించిన ప్రకారం
  rationale: పట్టణాల పంపిణీ ముందుగా ఇచ్చిన దైవ ఆజ్ఞకు అనుగుణంగా జరిగిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’ అనే హీబ్రూ నుడికారం మధ్యవర్తిత్వ కార్యసాధకత్వాన్ని సూచిస్తుంది; తెలుగులో ‘మోషే ద్వారా’ అదే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בַּגּוֹרָל
  choice: చీట్లు వేసి
  rationale: గోరాల్ ద్వారా కేటాయింపును తెలుగులో వాడుకగా, స్పష్టంగా చెప్పే క్రియాత్మక రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాక వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: בְּיַד מֹשֶׁה లో మోషే పాత్ర
  choice: మోషే ద్వారా
  alternative: మోషే చేతి ద్వారా
  rationale: ఈ హీబ్రూ నుడికారం మోషే ఆజ్ఞకు మూలమని కాక, యాహ్వే ఆజ్ఞను అందించిన మధ్యవర్తి అని సూచిస్తుంది; ‘ద్వారా’ ఆ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘చీట్లు వేసి’ అనే విధానాన్ని ప్రధాన క్రియకు దగ్గరగా ఉంచాం. ‘ఇశ్రాయేలు కుమారులు’ అనే అక్షరానువాదం కంటే సహజమైన సామూహిక జాతీయ నామం ‘ఇశ్రాయేలీయులు’ ఎంచుకున్నాం.
