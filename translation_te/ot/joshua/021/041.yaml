source:
  edition: WLC
  text: כֹּ֚ל עָרֵ֣י הַ/לְוִיִּ֔ם בְּ/ת֖וֹךְ אֲחֻזַּ֣ת בְּנֵֽי יִשְׂרָאֵ֑ל עָרִ֛ים אַרְבָּעִ֥ים וּ/שְׁמֹנֶ֖ה וּ/מִגְרְשֵׁי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారుల స్వాధీన భూభాగంలో ఉన్న లేవీయుల పట్టణాలన్నీ, వాటి పచ్చిక బయళ్లతో[a] కలిపి, నలభై ఎనిమిది పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బహిరంగ భూములు,” “సామూహిక భూములు”; ఇవి పట్టణాల చుట్టూ ఉన్న భూములు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַלְוִיִּם
  choice: లేవీయుల పట్టణాలన్నీ
  rationale: హీబ్రూ నిర్మాణంలోని ‘లేవీయుల పట్టణాలు’ అనే సంబంధాన్ని, సమస్తాన్ని సూచించే כֹּל భావంతో సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּתוֹךְ אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల స్వాధీన భూభాగంలో ఉన్న
  rationale: בְּתוֹךְ యొక్క అంతర్భాగ స్థానార్థాన్ని ‘లో’తో, אֲחֻזָּה యొక్క భూస్వాధీన భావాన్ని ‘స్వాధీన భూభాగం’తో వ్యక్తం చేస్తుంది; בְּנֵי יִשְׂרָאֵל అనే రూపాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: עָרִים אַרְבָּעִים וּשְׁמֹנֶה
  choice: నలభై ఎనిమిది
  rationale: ముందే వచ్చిన ‘పట్టణాలన్నీ’కి సంఖ్యాసారాంశంగా ఉన్న హీబ్రూ సమాసపూర్వక వాక్యనిర్మాణాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా సహజంగా అందిస్తుంది.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: వాటితోపాటు వాటి పచ్చిక బయళ్లు కూడా ఉన్నాయి
  rationale: מִגְרָשׁ పట్టణాల చుట్టూ పశువుల మేతకు లేదా సామూహిక వినియోగానికి ఉంచిన బహిరంగ భూమిని సూచిస్తుంది. సందర్భంలో ‘పచ్చిక బయళ్లు’ స్పష్టమైన ప్రధాన అనువాదం; ప్రత్యామ్నాయ భావాన్ని పాదటీపులో ఉంచాం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక జాతీయ నామం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ బహువచన రూపాన్ని పారదర్శకంగా నిలుపుతూ, అది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే సంప్రదాయ జాతీయ నామమనే ఉద్వేగాన్ని అనువాదంలో చెరపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సామాన్య పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపం నిలుపబడింది. పాదటీపు గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
