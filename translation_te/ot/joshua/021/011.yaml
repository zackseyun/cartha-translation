  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת קִרְיַת֩ אַרְבַּ֨ע אֲבִ֧י הָֽ/עֲנ֛וֹק הִ֥יא חֶבְר֖וֹן בְּ/הַ֣ר יְהוּדָ֑ה וְ/אֶת מִגְרָשֶׁ֖/הָ סְבִיבֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/011.yaml
  text: So they gave them Kiriath-arba (Arba was the father of Anak)[a], that is, Hebron, in the hill country of Judah, along with its pasturelands around it.
translation:
  language: te
  text: అప్పుడు వారు యూదా కొండప్రాంతంలో ఉన్న కిర్యత్-అర్బాను—అర్బా అనాకు తండ్రి[a]—అంటే హెబ్రోనును, దాని చుట్టూ ఉన్న పచ్చికబయళ్లతో సహా వారికి ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అర్బా అనాకు పూర్వికుడు.’ హీబ్రూ పదం తండ్రిని గానీ, మరింత పూర్వపు వంశపితను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: అప్పుడు వారు ఇచ్చారు
  rationale: נתן క్రియ యొక్క wayyiqtol రూపం కథన క్రమంలో తదుపరి చర్యను సూచిస్తుంది; ‘అప్పుడు’ ఆ కొనసాగింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לָהֶם
  choice: వారికి
  rationale: హీబ్రూలో ఉన్న తృతీయ పురుష బహువచన సర్వనామాన్ని సందర్భంలోని లేవీయులు అని విస్తరించకుండా అలాగే ఉంచింది.
- source_word: קִרְיַת אַרְבַּע
  choice: కిర్యత్-అర్బా
  rationale: ఇది స్థిరమైన స్థలనామం; అక్షరార్థమైన ‘అర్బా పట్టణం’కు బదులు మూలనామాన్ని లిప్యంతరీకరించింది.
- source_word: אֲבִי הָעֲנֹוק
  choice: అర్బా అనాకు తండ్రి
  rationale: హీబ్రూ సమానాధికరణం అర్బాను అనాకుతో సంబంధపెట్టి గుర్తిస్తుంది. אב ‘తండ్రి’ లేదా విస్తృతార్థంలో ‘పూర్వికుడు’ కావచ్చు; ప్రధాన పాఠ్యంలో ప్రాథమిక అర్థాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
- source_word: הִיא חֶבְרוֹן
  choice: అంటే హెబ్రోను
  rationale: ఈ పదబంధం కిర్యత్-అర్బా అనే స్థలం హెబ్రోనే అని వివరిస్తుంది; ‘అంటే’ తెలుగులో సహజమైన వివరణాత్మక రూపం.
- source_word: בְּהַר יְהוּדָה
  choice: యూదా కొండప్రాంతంలో
  rationale: ఈ భౌగోళిక ప్రయోగంలో הַר ఒకే పర్వతాన్ని కాక ఎత్తైన కొండప్రాంతాన్ని సూచిస్తుంది.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికబయళ్లు
  rationale: מִגְרָשׁ పట్టణం వెలుపల పశువుల మేత మొదలైన సామూహిక ఉపయోగాల కోసం ఉన్న బహిరంగ భూమిని సూచిస్తుంది; ‘పచ్చికబయళ్లు’ సందర్భానికి స్పష్టమైన పదం.
- source_word: סְבִיבֹתֶיהָ
  choice: దాని చుట్టూ ఉన్న
  rationale: పట్టణాన్ని చుట్టుముట్టిన భూములను సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
theological_decisions:
- issue: అర్బా–అనాకు మధ్య బంధుత్వం
  choice: తండ్రి
  alternative: పూర్వికుడు
  rationale: హీబ్రూ אב తక్షణ తండ్రిని లేదా మరింత పూర్వపు వంశపితను సూచించగలదు. అస్పష్టతను తొలగించకుండా ప్రాథమిక అర్థాన్ని పాఠ్యంలో, విస్తృత అవకాశాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. స్థలనామాలు సాధారణ బైబిలు తెలుగు రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; మూలంలోని సర్వనామం మరియు బంధుత్వ అస్పష్టత నిలుపబడ్డాయి.
