translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన జాబితా శైలి వాడబడింది. వచనం మునుపటి వాక్యంలోని ‘ఇచ్చారు’ అనే క్రియపై వ్యాకరణపరంగా ఆధారపడినా, విడిగా చదివినప్పుడు సంపూర్ణంగా ఉండేందుకు ‘ఇచ్చారు’ చేర్చబడింది. ప్రతి పాదటీపు గుర్తు సంబంధిత అంశం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
