  text: 'And from the tribe of Reuben: Bezer with its pasturelands[b][a], and Jahaz with its pasturelands.'
translation:
  language: te
  text: రూబేను గోత్రం నుండి బెసెరును, దాని పచ్చిక బయళ్లను, యహసును[b], దాని పచ్చిక బయళ్లను ఇచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని హెబ్రీ ప్రతులలోను ప్రాచీన అనువాద సాక్ష్యాలలోను యెహోషువ 21:36–37 వచనాలు లేవు. ఇక్కడి పట్టణాల జాబితా 1 దినవృత్తాంతాలు 6:78–79లోని జాబితాతో సమాంతరంగా ఉంది.
    reason: textual_variant
  - marker: b
    text: ఈ స్థలనామాన్ని యాహ్సా లేదా యాహసా అని కూడా రాస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה רְאוּבֵן
  choice: రూబేను గోత్రం నుండి
  rationale: గోత్రాలవారీగా పట్టణాల కేటాయింపును తెలిపే సందర్భంలో מַטֶּה అంటే ‘గోత్రం’; מִן మూలం లేదా కేటాయింపు వచ్చిన వర్గాన్ని సూచిస్తుంది.
- source_word: אֶת בֶּצֶר
  choice: బెసెరు పట్టణాన్ని
  rationale: אֵת తెలుగులో విడిగా అనువదించని కర్మ సూచకం. జాబితా స్వభావం స్పష్టంగా ఉండేందుకు స్థలనామంతో ‘పట్టణాన్ని’ చేర్చబడింది.
- source_word: מִגְרָשֶׁהָ
  choice: దాని పచ్చిక బయళ్లను
  rationale: లేవీయుల పట్టణాల సందర్భంలో מִגְרָשׁ పట్టణం చుట్టూ పశువుల కోసం ఉంచిన బహిరంగ భూములను సూచిస్తుంది; ‘పచ్చిక బయళ్లు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יַהְצָה
  choice: యాహసు
  rationale: హెబ్రీ స్థలనామాన్ని తెలుగు ధ్వన్యనుసారంగా అందించింది; ఇతర సంప్రదాయ రూపాలను పాదటీపులో ఉంచింది.
