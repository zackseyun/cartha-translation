  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ מִ/מַּטֵּה֙ בְּנֵ֣י יְהוּדָ֔ה וּ/מִ/מַּטֵּ֖ה בְּנֵ֣י שִׁמְע֑וֹן אֵ֚ת הֶֽ/עָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁר יִקְרָ֥א אֶתְ/הֶ֖ן בְּ/שֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/009.yaml
  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
translation:
  language: te
  text: 'యూదా సంతతివారి గోత్రం నుండీ, షిమ్యోను సంతతివారి గోత్రం నుండీ, పేరుపేరునా పేర్కొనబడిన ఈ పట్టణాలను[a] వారు ఇచ్చారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పేర్లతో పిలువబడిన’ లేదా ‘పేర్లు నిర్దేశించబడిన.’ తరువాతి జాబితాలో పట్టణాలు ఒక్కొక్కటిగా పేరుతో పేర్కొనబడుతున్నాయని హీబ్రూ వ్యక్తీకరణ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: వారు ఇచ్చారు
  rationale: నగరాల పంపిణీ సందర్భంలో נתן అనేది ‘ఇవ్వడం’ ద్వారా కేటాయించడాన్ని సూచిస్తుంది. ‘వారు ఇచ్చారు’ మూలంలోని సాధారణ క్రియను సహజంగా నిలుపుతుంది.
- source_word: מִמַּטֵּה
  choice: గోత్రం నుండి
  rationale: מַטֶּה పదానికి అక్షరార్థంగా ‘దండం’ అనే అర్థం ఉన్నా, భూభాగం మరియు పట్టణాల కేటాయింపు సందర్భంలో అది ‘గోత్రం’ అనే అర్థంలో వాడబడింది.
- source_word: בְּנֵי יְהוּדָה
  choice: యూదా సంతతివారు
  rationale: అక్షరార్థమైన ‘యూదా కుమారులు’ ఇక్కడ మొత్తం గోత్రసమూహాన్ని సూచించే వంశపారంపర్య ప్రయోగం. ఆధునిక తెలుగులో ‘యూదా సంతతివారు’ ఆ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  choice: షిమ్యోను సంతతివారి గోత్రం నుండీ
  rationale: ముందున్న యూదా గోత్రానికి సమాంతరమైన హీబ్రూ నిర్మాణాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన వంశపారంపర్య గోత్ర సూచనగా అనువదించబడింది.
- source_word: אֵת הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాలను
  rationale: עָרִים కేటాయింపు జాబితాలో పట్టణాలను సూచిస్తుంది; ప్రత్యక్ష కర్మ నిర్మాణాన్ని తెలుగులో ‘ఈ పట్టణాలను’ అని స్పష్టంగా చూపించాం.
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  choice: పేరుపేరునా పేర్కొనబడిన
  rationale: ఈ హీబ్రూ నుడికారం తరువాతి జాబితాలో ప్రతి పట్టణం పేరు చెప్పబడుతుందని సూచిస్తుంది. ‘పేరుపేరునా పేర్కొనబడిన’ అనే రూపం ఆ భావాన్ని సహజ తెలుగులో అందిస్తూ, దాని జాబితా-పరిచయ విధిని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని యూదా–షిమ్యోను సమాంతర నిర్మాణం నిలుపబడింది; ‘కుమారులు’ అనే అక్షరానువాదం బదులు గోత్రసమూహ భావాన్ని స్పష్టంగా తెలిపే ‘సంతతివారు’ ఎంచుకోబడింది.
