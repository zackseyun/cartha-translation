  text: Jarmuth with its pasturelands[a], and En-gannim with its pasturelands—four cities.
translation:
  language: te
  text: యర్మూతు, దాని మేత భూములు; ఏన్-గన్నీము[a], దాని మేత భూములు—మొత్తం నాలుగు పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును “అయిన్-గన్నీము” అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: లిప్యంతరీకరణ ప్రత్యామ్నాయం
lexical_decisions:
- source_word: יַרְמוּת
  choice: యర్మూతు
  rationale: స్థలనామాన్ని దాని హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: מִגְרָשֶׁהָ
  choice: దాని మేత భూములు
  rationale: పట్టణం చుట్టూ పశువులను మేపడానికి లేదా సామూహిక అవసరాలకు ఉంచిన బహిరంగ భూములను ఈ సందర్భంలో సూచిస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం ప్రతి పట్టణాన్నీ సూచిస్తూ ‘దాని’గా అనువదించబడింది.
- source_word: עֵין גַּנִּים
  choice: ఏన్-గన్నీము
  rationale: ‘తోటల ఊట’ అనే పదార్థం ఉన్నప్పటికీ, ఇది స్థలనామం కాబట్టి అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: עָרִים אַרְבַּע
  choice: మొత్తం నాలుగు పట్టణాలు
  rationale: పట్టణాల జాబితాలో వచ్చే సారాంశ సంఖ్యను సహజమైన తెలుగులో తెలిపేందుకు ‘మొత్తం’ చేర్చాం; ‘పట్టణాలు’ עָרִיםకు ఈ సందర్భంలో తగిన పదం.
