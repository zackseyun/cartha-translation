revisions:
- from: యాహ్వే వారి పితరులకు చేసిన ప్రమాణమంతటి ప్రకారం, వారికి చుట్టూ అన్ని వైపులా విశ్రాంతి కలిగించాడు. వారి శత్రువులందరిలో ఒక్క మనిషి కూడా వారిని ఎదిరించి నిలబడలేకపోయాడు[a]. యాహ్వే వారి శత్రువులందరినీ వారి చేతికి అప్పగించాడు[b].
  to: యాహ్వే వారికి అన్ని వైపులా విశ్రాంతి ఇచ్చాడు, తాను వారి పితరులకు చేసిన సమస్త ప్రమాణాల ప్రకారం. వారి శత్రువులందరిలో ఒక్క మనిషి కూడా వారిని ఎదిరించి నిలబడలేకపోయాడు[a]. యాహ్వే వారి శత్రువులందరినీ వారి చేతికి అప్పగించాడు[b].
  rationale: సవరణ మూలంలోని ప్రధాన వాక్యక్రమాన్ని మరింత దగ్గరగా అనుసరిస్తూ, ‘సమస్త’ ద్వారా כֹּל యొక్క సంపూర్ణతను స్పష్టపరుస్తుంది. ప్రధాన పాఠంలోని అర్థం మారలేదు. పాదసూచిక bలోని అక్షరార్థ రూపాన్ని ‘చేతికి’గా సరిచేసి, ప్రధాన అనువాదంతో మరియు హీబ్రూ నుడికారంతో అనుసంధానించాం.
