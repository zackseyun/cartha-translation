    rationale: హీబ్రూలో యాహ్వే ముందుగా విశ్రాంతిని ఇచ్చాడని, తరువాత అది పితరులకు చేసిన సమస్త ప్రమాణాలకు అనుగుణమని చెబుతుంది. సవరించిన రూపం ఈ ప్రవాహాన్ని, సంపూర్ణతను స్పష్టంగా ఉంచుతుంది.
