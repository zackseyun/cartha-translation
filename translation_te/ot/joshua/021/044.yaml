  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨נַח יְהוָ֤ה לָ/הֶם֙ מִ/סָּבִ֔יב כְּ/כֹ֥ל אֲשֶׁר נִשְׁבַּ֖ע לַ/אֲבוֹתָ֑/ם וְ/לֹא עָ֨מַד אִ֤ישׁ בִּ/פְנֵי/הֶם֙ מִ/כָּל אֹ֣יְבֵי/הֶ֔ם אֵ֚ת כָּל אֹ֣יְבֵי/הֶ֔ם נָתַ֥ן יְהוָ֖ה בְּ/יָדָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
translation:
  language: te
  text: యాహ్వే వారికి అన్ని వైపులా విశ్రాంతి ఇచ్చాడు, తాను వారి పితరులకు చేసిన సమస్త ప్రమాణాల ప్రకారం. వారి శత్రువులందరిలో ఒక్క మనిషి కూడా వారిని ఎదిరించి నిలబడలేకపోయాడు[a]. యాహ్వే వారి శత్రువులందరినీ వారి చేతికి అప్పగించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: “వారి ఎదుట నిలబడలేదు.” ఇక్కడ “ఎదుట నిలబడటం” అంటే విజయవంతంగా ఎదిరించడం.'
    reason: lexical_alternative
  - marker: b
    text: 'పదశః: “వారి చేతికి ఇచ్చాడు.” ఇది ఒకరిని మరొకరి అధికారానికి అప్పగించడాన్ని సూచించే సాధారణ హీబ్రూ నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנַח
  choice: విశ్రాంతి కలిగించాడు
  rationale: נוח ధాతువు హిఫీల్ రూపం ఇక్కడ ‘విశ్రాంతి కలిగించడం/ఇవ్వడం’ అనే భావాన్ని ఇస్తుంది. విజయానంతర భద్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ లిప్యంతరీకరణను తెలుగులో నిలుపుతుంది.
- source_word: מִסָּבִיב
  choice: చుట్టూ అన్ని వైపులా
  rationale: చుట్టుపక్కల ఉన్న బెదిరింపులన్నిటి నుండి లభించిన సమగ్ర భద్రత అనే స్థలవాచక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כְּכֹל אֲשֶׁר נִשְׁבַּע
  choice: చేసిన ప్రమాణమంతటి ప్రకారం
  rationale: כְּ యొక్క అనురూపత భావాన్నీ, כֹּל యొక్క సంపూర్ణతనూ నిలుపుతుంది.
- source_word: לַאֲבוֹתָם
  choice: వారి పితరులకు
  rationale: మూలంలోని పురుషలింగ బంధుత్వ పదాన్ని నిలుపుతూ, ఇశ్రాయేలు పూర్వపితరులను సూచిస్తుంది.
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם
  choice: ఒక్క మనిషి కూడా వారిని ఎదిరించి నిలబడలేకపోయాడు
  rationale: ‘వారి ఎదుట నిలబడటం’ అనే హీబ్రూ నుడికారం విజయవంతంగా ప్రతిఘటించడాన్ని సూచిస్తుంది. తెలుగు పాఠకునికి ఆ భావం స్పష్టమయ్యేలా ‘ఎదిరించి’ మరియు ‘లేకపోయాడు’ వాడబడ్డాయి; మూలరూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: מִכָּל אֹיְבֵיהֶם
  choice: వారి శత్రువులందరిలో
  rationale: ప్రతికూల వాక్యంలో מן కలిగించే విభాగార్థాన్ని—శత్రువులందరిలో ఒక్కరైనా కాదు—సహజంగా తెలుపుతుంది.
- source_word: נָתַן ... בְּיָדָם
  choice: వారి చేతికి అప్పగించాడు
  rationale: శత్రువులను వారి అధికారానికి లోబరచి విజయం ఇవ్వడం అనే సాధారణ హీబ్రూ నుడికారాన్ని, ‘చేతి’ ప్రతిమను నిలుపుతూ సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. ‘ప్రభువు’ అనే బిరుదుతో దాన్ని మార్చకుండా, Yahwehకు అనుగుణమైన తెలుగు లిప్యంతరీకరణను వాడింది; ‘యెహోవా’ సాధారణంగా Jehovah రూపానికి దగ్గరగా ఉంటుంది.
- issue: לַאֲבוֹתָם మరియు אִישׁలోని లింగసూచక భాష
  choice: వారి పితరులకు / ఒక్క మనిషి
  alternative: వారి పూర్వీకులకు / ఒక్కరు
  rationale: మూలంలోని పురుషలింగ పదాలను అనవసరంగా లింగతటస్థం చేయకుండా నిలిపింది; సందర్భంలో אִישׁ ప్రతి శత్రు యోధుని విడివిడిగా సూచిస్తుంది.
- issue: ‘వారి ఎదుట నిలబడటం’ అనే నుడికారం
  choice: వారిని ఎదిరించి నిలబడలేకపోయాడు
  alternative: వారి ఎదుట నిలబడలేదు
  rationale: ఈ నుడికారం కేవలం స్థానాన్ని కాక, విజయవంతంగా ప్రతిఘటించగల సామర్థ్యాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో అర్థాన్ని స్పష్టం చేసి, పదశః రూపాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ఒడంబడిక నెరవేర్పు, సమగ్ర విశ్రాంతి, సంపూర్ణ విజయం అనే మూడు ప్రధాన భావాలు నిలుపబడ్డాయి. [a], [b] గుర్తులు వాటికి సంబంధించిన నుడికారాల దగ్గరే ఉంచబడ్డాయి.
