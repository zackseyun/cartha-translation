translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు సులభంగా ఉండే జాబితా శైలిని అనుసరించాం. ఈ వచనం ముందరి వాక్యానికి కొనసాగింపు కావడంతో మూలంలోని కర్మ-జాబితా స్వభావాన్ని నిలిపాం.
