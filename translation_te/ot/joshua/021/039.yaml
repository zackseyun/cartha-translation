  yaml_path: translation/ot/joshua/021/039.yaml
  text: Heshbon with its pasturelands[a], and Jazer with its pasturelands—four cities in all.
translation:
  language: te
  text: హెష్బోను దాని పచ్చిక బయళ్లతో కూడి, యాజేరు దాని పచ్చిక బయళ్లతో కూడి[a]—మొత్తం నాలుగు పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ప్రతి పట్టణానికి, ‘దాని సామూహిక భూములు’ లేదా ‘దాని చుట్టుపక్కల బహిరంగ భూమి.’ హీబ్రూ పదం పట్టణానికి చెందిన బహిరంగ భూమిని సూచిస్తుంది; అది తరచుగా పశువుల మేతకు ఉపయోగపడేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: హెష్బోను
  rationale: స్థలనామాన్ని మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: מִגְרָשֶׁהָ
  choice: దాని పచ్చిక బయళ్లు
  rationale: ఈ పదం పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని, తరచుగా పశువుల మేతకు ఉపయోగించే భూమిని సూచిస్తుంది. ‘పచ్చిక బయళ్లు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יַעְזֵר
  choice: యాజేరు
  rationale: స్థలనామాన్ని మూల హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: כָּל עָרִים אַרְבַּע
  choice: మొత్తం నాలుగు పట్టణాలు
  rationale: ‘అన్ని పట్టణాలు—నాలుగు’ అనే హీబ్రూ సారాంశ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపాం.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: జాబితా నిర్మాణం, ‘తో సహా’ అనే సమన్వయం ద్వారా వ్యక్తీకరణ
  rationale: పునరావృతమయ్యే ప్రత్యక్ష కర్మ సూచిక אֶתకు తెలుగులో ప్రత్యేక పదం అవసరం లేదు; పట్టణాలు, వాటి భూములు జాబితాలో ఉన్నాయని వాక్య నిర్మాణమే తెలియజేస్తుంది.
