  text: כָּל הֶ֨/עָרִ֜ים לִ/בְנֵ֤י מְרָרִי֙ לְ/מִשְׁפְּחֹתָ֔/ם הַ/נּוֹתָרִ֖ים מִ/מִּשְׁפְּח֣וֹת הַ/לְוִיִּ֑ם וַ/יְהִי֙ גּוֹרָלָ֔/ם עָרִ֖ים שְׁתֵּ֥ים עֶשְׂרֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
translation:
  language: te
  text: లేవీయుల వంశాలలో మిగిలిన మెరారీ కుమారులకు[a], వారి వంశాల ప్రకారం, చీటి ద్వారా వారికి కేటాయించబడిన పట్టణాలన్నీ మొత్తం పన్నెండు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మెరారీ సంతతివారికి’ లేదా ‘మెరారీయులకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: పట్టణాలన్నీ
  rationale: עִיר అనే పదానికి ‘పట్టణం’ లేదా ‘నగరం’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ గోత్రాల భూవిభజనలో పేర్కొన్న నివాస స్థలాలను సూచిస్తున్నందున ‘పట్టణాలు’ సహజంగా ఉంది.
- source_word: לִבְנֵי מְרָרִי
  choice: మెరారీ కుమారులకు
  rationale: בְּנֵי అనే పదానికి అక్షరార్థంగా ‘కుమారులు’ అని అర్థం; వంశావళి సందర్భంలో అది ‘సంతతివారు’ అని కూడా సూచించగలదు. మూలంలోని బంధుత్వ రూపాన్ని ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה కుటుంబం, వంశం లేదా వంశశాఖను సూచించగలదు. లేవీయుల విభాగాల సందర్భంలో ‘వంశాలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הַנּוֹתָרִים מִמִּשְׁפְּחוֹת הַלְוִיִּם
  choice: లేవీయుల వంశాలలో మిగిలినవారైన
  rationale: הַנּוֹתָרִים అనే విశేషణాత్మక కృదంతం ‘మిగిలినవారు’ అనే భావాన్ని ఇస్తుంది. ఇది మెరారీ వంశీయులను ముందుగా వాటా పొందిన ఇతర లేవీయ వంశాల తర్వాత మిగిలిన వర్గంగా గుర్తిస్తుంది.
- source_word: וַיְהִי גּוֹרָלָם
  choice: చీటి ద్వారా వచ్చిన
  rationale: గּוֹרָלָם అక్షరార్థంగా ‘వారి చీటి/వాటా’ అని అర్థం. భూవిభజనలో చీట్లు వేసి కేటాయించిన భావాన్ని సహజమైన తెలుగులో ‘చీటి ద్వారా వచ్చిన’ అని వ్యక్తం చేశాం.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: పన్నెండు పట్టణాలు
  rationale: తెలుగు సహజ పదక్రమంలో సంఖ్యను నామవాచకానికి ముందు ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూవిభజన జాబితాకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని ప్రధాన భావక్రమాన్ని కాపాడుతూ, తెలుగులో అసహజమైన ‘వారి చీటి పన్నెండు పట్టణాలు అయింది’ అనే నిర్మాణాన్ని నివారించాం.
