id: JOS.21.30
reference: Joshua 21:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה אָשֵׁ֔ר אֶת מִשְׁאָ֖ל וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת עַבְדּ֖וֹן וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/030.yaml
  text: 'and from the tribe of Asher: Mishal with its pasturelands[b][a], and Abdon with its pasturelands.'
translation:
  language: te
  text: ఆశేరు గోత్రం నుండి మిషాల్ మరియు దాని పచ్చిక బయళ్లు, అబ్దోను మరియు దాని పచ్చిక బయళ్లు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పచ్చిక బయళ్లు’ అంటే పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమి; అది ముఖ్యంగా పశువులను మేపడానికి, ఇతర సామూహిక అవసరాలకు ఉపయోగపడేది.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִמַּטֵּה אָשֵׁר
  choice: ఆషేరు గోత్రం నుండి
  rationale: గోత్రాల భూభాగాల సందర్భంలో מַטֶּה అంటే ‘గోత్రం’. וּ మరియు מִן కలసి ముందటి జాబితాను కొనసాగిస్తూ ‘నుండి’ అనే భావాన్ని ఇస్తాయి.
- source_word: מִשְׁאָל
  choice: మిషాల్
  rationale: హీబ్రూ స్థలనామాన్ని ఆధునిక తెలుగు లిపిలో దాని ధ్వనికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מִגְרָשֶׁהָ
  choice: దాని పచ్చిక బయళ్లు
  rationale: מִגְרָשׁ పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని, ముఖ్యంగా పశువుల మేత వంటి సామూహిక అవసరాలకు ఉపయోగించే నేలను సూచిస్తుంది. ‘పచ్చిక బయళ్లు’ ఈ జాబితా సందర్భంలో సహజంగా అర్థమవుతుంది.
- source_word: עַבְדּוֹן
  choice: అబ్దోను
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶת
  choice: పట్టణాన్ని
  rationale: אֶת స్వతంత్రంగా అనువదించబడని ప్రత్యక్ష కర్మ సూచకం. తెలుగులో వాక్యార్థం స్పష్టంగా ఉండేందుకు జాబితా సందర్భం ఆధారంగా ‘పట్టణాన్ని’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగు వాక్యానికి అవసరమైన ‘పట్టణాన్ని’ మరియు పూర్వాపరాల ద్వారా గ్రహించబడే ‘ఇచ్చారు’ అనే క్రియను స్పష్టత కోసం చేర్చాం. ఆంగ్ల లిప్యంతరీకరణ భేదం తెలుగులో ఉపయోగకరమైన ప్రత్యామ్నాయాన్ని కలిగించనందున స్థలనామానికి వేరే పాదసూచిక ఇవ్వలేదు.
