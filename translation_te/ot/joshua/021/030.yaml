- from: 'ఆషేరు గోత్రం నుండి: మిషాల్ పట్టణాన్ని, దాని పచ్చిక బయళ్లను; అబ్దోను పట్టణాన్ని, దాని పచ్చిక బయళ్లను ఇచ్చారు.[a]'
  to: ఆశేరు గోత్రం నుండి మిషాల్ మరియు దాని పచ్చిక బయళ్లు, అబ్దోను మరియు దాని పచ్చిక బయళ్లు.[a]
