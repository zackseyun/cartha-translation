source:
  edition: WLC
  text: וְ/אֶת שְׂדֵ֥ה הָ/עִ֖יר וְ/אֶת חֲצֵרֶ֑י/הָ נָֽתְנ֛וּ לְ/כָלֵ֥ב בֶּן יְפֻנֶּ֖ה בַּ/אֲחֻזָּתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/012.yaml
  text: But the fields of the city and its villages they gave to Caleb son of Jephunneh as his possession[a].
translation:
  language: te
  text: అయితే పట్టణానికి చెందిన పొలాలను, దానికి చెందిన గ్రామాలను[a] యెఫున్నె కుమారుడైన కాలేబుకు అతని స్వాధీనంగా ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దానికి చెందిన అనుబంధ నివాసాలను” లేదా “స్థావరాలను.” హీబ్రూ పదం పట్టణానికి అనుబంధంగా ఉన్న గ్రామాలు లేదా నివాస స్థావరాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: పట్టణానికి చెందిన పొలాన్ని
  rationale: שְׂדֵה అనేది ఏకవచన నిర్మాణ రూపం; పట్టణానికి చెందిన సాగుభూమిని సమష్టిగా సూచిస్తుంది. తెలుగు ఏకవచనమైన ‘పొలం’ మూలరూపాన్నీ సమష్టి భావాన్నీ సహజంగా నిలుపుతుంది.
- source_word: חֲצֵרֶיהָ
  choice: దాని చుట్టుపక్కల గ్రామాలను
  rationale: ఈ సందర్భంలో חֲצֵרִים పట్టణానికి అనుబంధంగా ఉన్న వెలుపలి గ్రామాలు లేదా నివాస ప్రాంతాలను సూచించగలదు. ‘చుట్టుపక్కల గ్రామాలు’ అనే రూపం ప్రధాన పట్టణంతో వాటి అనుబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘మేతభూములు’ అనే అర్థాన్ని సందర్భంలో అనవసరంగా నిర్బంధించదు.
- source_word: נָתְנוּ
  choice: ఇచ్చారు
  rationale: נתן అనే సాధారణ క్రియలోని ‘ఇవ్వడం’ భావాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: యెఫున్నె కుమారుడైన కాలేబుకు
  rationale: లబ్ధిదారుని సూచించే לְను తెలుగులో ‘కు’తో సహజంగా వ్యక్తపరచి, వంశపరిచయాన్ని గౌరవప్రదమైన సాధారణ శైలిలో ఉంచింది.
- source_word: בַּאֲחֻזָּתוֹ
  choice: అతని స్వాస్థ్యంగా
  rationale: אֲחֻזָּה భూహక్కుతో కూడిన స్థిరమైన స్వాధీన ఆస్తిని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఆ న్యాయపరమైన స్వాధీన భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְאֶת
  choice: అయితే
  rationale: మునుపటి వచనంలో లేవీయులకు ఇచ్చిన పట్టణం, మేతభూములకు భిన్నంగా ఇక్కడ కాలేబుకు ఇచ్చిన భూభాగాన్ని సూచించే వ్యత్యాస సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
