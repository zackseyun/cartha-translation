translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. భూకేటాయింపు సందర్భంలోని న్యాయపరమైన భావానికి ‘స్వాస్థ్యం’ను ఎంచుకుని, חֲצֵרֶיהָలోని నిజమైన పదార్థ విస్తృతిని పాదసూచికలో నిలిపాం.
