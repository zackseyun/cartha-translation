source:
  edition: WLC
  text: וַ/יְדַבְּר֨וּ אֲלֵי/הֶ֜ם בְּ/שִׁלֹ֗ה בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה בְ/יַד מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ עָרִ֖ים לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֖ן לִ/בְהֶמְתֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
translation:
  language: te
  text: 'వారు కనాను దేశంలోని షిలోహులో వారితో ఇలా అన్నారు: “యాహ్వే మోషే ద్వారా[a] మాకు నివసించడానికి పట్టణాలను, మా పశువుల కోసం వాటి చుట్టూ ఉన్న మేత భూములను[b] ఇవ్వాలని ఆజ్ఞాపించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “మోషే చేతి ద్వారా”; ఇది మోషే ద్వారా లేదా అతని మధ్యవర్తిత్వంతో అని తెలిపే నుడికారం.'
    reason: lexical_alternative
  - marker: b
    text: లేదా “వాటి బహిరంగ భూములను,” “వాటి సామూహిక భూములను”; హీబ్రూ పదం పట్టణాల చుట్టూ పశువులను మేపడానికి ఉపయోగించే భూమిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם
  choice: వారు వారితో ఇలా అన్నారు
  rationale: దిశను సూచించే אֶל భావాన్ని తెలుగులో సహజమైన ‘వారితో అన్నారు’ అనే మాటల నిర్మాణంతో వ్యక్తపరుస్తుంది; తరువాతి לֵאמֹרను ‘ఇలా’ ద్వారా నేరుగా వచ్చే మాటలతో అనుసంధానిస్తుంది.
- source_word: בְּשִׁלֹה בְּאֶרֶץ כְּנַעַן
  choice: కనాను దేశంలోని షిలోహులో
  rationale: ‘కనాను దేశం’ అనే మూలంలోని పూర్తి స్థలనిర్దేశాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన సంబంధ నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: צִוָּה בְיַד מֹשֶׁה
  choice: మోషే ద్వారా … ఆజ్ఞాపించాడు
  rationale: ‘మోషే చేతి ద్వారా’ అనే హీబ్రూ నుడికారంలోని మధ్యవర్తిత్వ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: לָתֶת לָנוּ עָרִים לָשָׁבֶת
  choice: మాకు నివసించడానికి పట్టణాలను … ఇవ్వాలని
  rationale: נתן యొక్క ‘ఇవ్వు’ భావాన్ని, ישׁב యొక్క నివాస ప్రయోజనాన్ని స్పష్టంగా మరియు సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וּמִגְרְשֵׁיהֶן לִבְהֶמְתֵּנוּ
  choice: మా పశువుల కోసం వాటి చుట్టూ ఉన్న మేత భూములను
  rationale: מִגְרָשׁ సూచించే పట్టణ పరిసర బహిరంగ/సామూహిక భూమిని ఈ సందర్భంలోని పశువుల మేత వినియోగంతో స్పష్టపరుస్తుంది; ప్రత్యామ్నాయ విస్తృత అర్థాలను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘నివసించడానికి’ వంటి ప్రస్తుత వాడుక పదాలను ఎంచుకుని, హీబ్రూ నుడికారం మరియు מִגְרָשׁ పదంలోని అర్థవిస్తృతిని పాదసూచికల్లో కాపాడింది.
