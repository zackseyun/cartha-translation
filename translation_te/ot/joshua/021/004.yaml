translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని రెండు దశల నిర్మాణం—మొదట కహాతీయుల వంశాలు, తరువాత వారిలో అహరోను కుమారుల కేటాయింపు—స్పష్టంగా ఉంచబడింది. వ్యక్తి, గోత్ర నామాలకు తెలుగు బైబిలు వాడుకకు దగ్గరైన రూపాలు ఎంచుకోబడ్డాయి.
