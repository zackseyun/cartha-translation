  text: וַ/יֵּצֵ֥א הַ/גּוֹרָ֖ל לְ/מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י וַ/יְהִ֡י לִ/בְנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן מִן הַ/לְוִיִּ֗ם מִ/מַּטֵּ֣ה יְ֠הוּדָה וּ/מִ/מַּטֵּ֨ה הַ/שִּׁמְעֹנִ֜י וּ/מִ/מַּטֵּ֤ה בִנְיָמִן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
translation:
  language: te
  text: అప్పుడు కెహాతీయుల వంశాలకు చీటి వచ్చింది.[a] లేవీయులలో యాజకుడైన అహరోను కుమారులకు యూదా గోత్రం నుండి, షిమ్యోను గోత్రం నుండి, బెన్యామీను గోత్రం నుండి చీటి ద్వారా పదమూడు పట్టణాలు లభించాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కెహాతీయుల వంశాలకు చీటి పడింది.” హీబ్రూ నుడికారాన్ని ‘చీటి బయటికి వచ్చింది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: చీటి వచ్చింది
  rationale: హీబ్రూ నుడికారంలోని ‘చీటి బయటికి వచ్చింది’ అనే చిత్రాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; సందర్భంలో ఇది చీటి వేయడం ద్వారా వచ్చిన నిర్ణయాన్ని సూచిస్తుంది.
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  choice: కహాతీయుల వంశాలకు
  rationale: מִשְׁפָּחוֹת కుటుంబాలకన్నా విస్తృతమైన వంశ లేదా గోత్రాంతర్గత సమూహాలను సూచించగలదు; ‘వంశాలు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను కుమారులకు … లభించాయి
  rationale: మూలంలోని సంక్షిప్త నిర్మాణాన్ని తెలుగులో పూర్తి వాక్యంగా సహజీకరిస్తూ, ‘కుమారులు’ అనే బంధుత్వ పదాన్ని నిలుపుతుంది.
- source_word: מִן הַלְוִיִּם
  choice: లేవీయులలో
  rationale: అహరోను కుమారులు లేవీయులలోని ఒక ఉపసమూహమని తెలిపే విభాగార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  choice: యూదా గోత్రం నుండి, షిమ్యోను గోత్రం నుండి, బెన్యామీను గోత్రం నుండి
  rationale: מַטֶּה ఇక్కడ ‘గోత్రం’ అనే భావంలో ఉంది; మూలంలోని పునరుక్తిని నిలిపి, ప్రతి ప్రాంతీయ మూలాన్ని స్పష్టంగా చూపుతుంది.
- source_word: בַּגּוֹרָל
  choice: చీటి ద్వారా
  rationale: కేటాయింపు చీటి వేయడం అనే సాధనం ద్వారా జరిగిందనే సాధనార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: పదమూడు పట్టణాలు
  rationale: עָרִים కు ప్రాంత కేటాయింపు సందర్భంలో ‘పట్టణాలు’ సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
