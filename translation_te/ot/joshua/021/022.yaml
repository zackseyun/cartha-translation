  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת קִבְצַ֨יִם֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת בֵּ֥ית חוֹרֹ֖ן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/022.yaml
  text: and Kibzaim with its pasturelands[a], and Beth-horon with its pasturelands—four cities.
translation:
  language: te
  text: కిబ్జయీము, దాని పచ్చికబయళ్లతో సహా[a], మరియు బేత్-హోరోను, దాని పచ్చికబయళ్లతో సహా—నాలుగు పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉమ్మడి బహిరంగ భూములతో’ లేదా ‘మేత భూములతో’. హీబ్రూ పదం పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִבְצַיִם
  choice: కిబ్సయీము
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: מִגְרָשֶׁהָ
  choice: దాని పచ్చికబయళ్లతో సహా
  rationale: מִגְרָשׁ అనే పదం పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని, ముఖ్యంగా పశువులను మేపే భూమిని సూచిస్తుంది; లేవీయుల పట్టణాల సందర్భంలో ‘పచ్చికబయళ్లు’ సహజంగా, స్పష్టంగా ఉంది. స్త్రీలింగ ఏకవచన ప్రత్యయం ‘దాని’గా వ్యక్తమైంది.
- source_word: בֵּית חוֹרֹן
  choice: బేత్-హోరోను
  rationale: స్థిరపడిన స్థలనామాన్ని దాని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; ‘హోరోను ఇల్లు’ అని అర్థానువాదం చేయలేదు.
- source_word: עָרִים אַרְבַּע
  choice: మొత్తం నాలుగు పట్టణాలు
  rationale: జాబితా చివర సంఖ్యను సంగ్రహించే సూత్రాన్ని సహజ తెలుగులో చూపేందుకు ‘మొత్తం’ చేర్చబడింది; עָרִיםకు ఈ సందర్భంలో ‘పట్టణాలు’ సరిపోతుంది.
- source_word: וְאֶת ... וְאֶת
  choice: …తో సహా, …తో సహా
  rationale: אֶת కర్మ సూచికను విడిగా అనువదించలేదు; పునరావృత సంయోజన నిర్మాణాన్ని తెలుగు జాబితాకు సహజమైన సమన్వయంతో వ్యక్తపరిచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. స్థలనామాలు హీబ్రూ ఆధారంగా లిప్యంతరీకరించబడ్డాయి; జాబితా శైలిని సంక్షిప్తంగా నిలిపాం.
