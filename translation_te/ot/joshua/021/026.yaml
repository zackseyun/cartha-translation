translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. హీబ్రూ సమాపన-లెక్కింపు నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో అర్థం వెంటనే గ్రహించగలిగేలా పదక్రమం అమర్చబడింది. ‘కహాతు కుమారులు’ అనే వంశావళి ప్రయోగం మూలరూపాన్ని కాపాడుతుంది.
