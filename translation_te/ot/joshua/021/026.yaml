source:
  edition: WLC
  text: כָּל עָרִ֥ים עֶ֖שֶׂר וּ/מִגְרְשֵׁי/הֶ֑ן לְ/מִשְׁפְּח֥וֹת בְּנֵֽי קְהָ֖ת הַ/נּוֹתָרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/026.yaml
  text: All the cities were ten[a], with their pasturelands[c][b], for the clans of the remaining sons of Kohath.
translation:
  language: te
  text: కహాతు కుమారులలో మిగిలిన వంశాలకు, వాటి పచ్చికబయళ్లతో కలిపి, మొత్తం పది పట్టణాలు ఉన్నాయి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టణాలు మొత్తం పది.” హీబ్రూ వాక్యనిర్మాణం ముందటి జాబితాను ముగిస్తూ మొత్తం సంఖ్యను తెలిపే సూత్రప్రాయమైన ప్రకటన.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עָרִים עֶשֶׂר
  choice: పట్టణాలన్నీ ... పది
  rationale: ఇది ముందటి జాబితా మొత్తాన్ని తెలిపే హీబ్రూ సమాపన సూత్రం. తెలుగు సహజత్వాన్ని కాపాడుతూ, పట్టణాల మొత్తం పది అనే లెక్కింపు భావాన్ని నిలుపుతుంది.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: వాటి పచ్చికబయళ్లతో కలిపి
  rationale: మִגְרָשׁ పట్టణాలకు అనుబంధంగా, ముఖ్యంగా పశువులను మేపడానికి ఉపయోగించే బహిరంగ భూములను సూచిస్తుంది. ‘పచ్చికబయళ్లు’ సాధారణ పాఠకులకు ఈ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמִשְׁפְּחוֹת
  choice: వంశాల కోసం
  rationale: מִשְׁפָּחוֹת గోత్రంలోని బంధుత్వ ఆధారిత ఉపవిభాగాలను సూచిస్తుంది. ‘వంశాలు’ ఆధునిక తెలుగులో ఈ సామాజిక-వంశపారంపర్య భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי קְהָת
  choice: కహాతు కుమారులు
  rationale: మూలంలోని అక్షరార్థమైన వంశావళి ప్రయోగాన్ని నిలుపుతుంది; సందర్భంలో ఇది కహాతు సంతతివారిని సూచిస్తుంది.
- source_word: הַנּוֹתָרִים
  choice: మిగిలిన
  rationale: ఇప్పటికే పట్టణాలు పొందిన కహాతీయ శాఖకు భిన్నంగా ఇంకా మిగిలి ఉన్న కహాతు వంశాలను సూచించే విశేషణ భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
