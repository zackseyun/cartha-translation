id: JOS.21.3
reference: Joshua 21:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל לַ/לְוִיִּ֛ם מִ/נַּחֲלָתָ֖/ם אֶל פִּ֣י יְהוָ֑ה אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
translation:
  language: te
  text: కాబట్టి ఇశ్రాయేలు కుమారులు[a] యహ్వే ఆజ్ఞ ప్రకారం[b] తమ స్వాస్థ్యంలో నుంచి ఈ పట్టణాలను, వాటి మేతభూములను[c] లేవీయులకు ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు.” హీబ్రూలో అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యహ్వే ఆజ్ఞకు అనుగుణంగా.” అక్షరార్థంగా, “యహ్వే నోటి ప్రకారం.”
    reason: lexical_alternative
  - marker: c
    text: అంటే, ఈ పట్టణాలకు చెందిన బహిరంగ భూములు లేదా పశువుల మేత ప్రాంతాలు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ఇచ్చారు
  rationale: נתן అనే క్రియకు ఇక్కడి భూవిభజన సందర్భంలో ‘ఇచ్చారు’ అనే ప్రాథమిక అర్థమే సహజంగాను మూలానికి దగ్గరగాను ఉంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ పదబంధాన్ని యథార్థంగా నిలుపుతుంది; ఇది సమూహార్థంలో ‘ఇశ్రాయేలీయులు’ అని కూడా అనువదించవచ్చు.
- source_word: לַלְוִיִּם
  choice: లేవీయులకు
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే ప్రామాణిక తెలుగు రూపం; దాతివార్థాన్ని ‘-లకు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִנַּחֲלָתָם
  choice: తమ స్వాస్థ్యంలో నుంచి
  rationale: נחלה ఇక్కడ ఇశ్రాయేలు గోత్రాలకు వారసత్వంగా కేటాయించబడిన భూభాగాన్ని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఆ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: אֶל פִּי יְהוָה
  choice: యహ్వే ఆజ్ఞ ప్రకారం
  rationale: ‘యహ్వే నోటి ప్రకారం’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు అర్థానువాదం; దైవ ఆదేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాలను
  rationale: నిర్దేశక పదంతో కూడిన హీబ్రూ పదబంధానికి నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: מִגְרְשֵׁיהֶן
  choice: వాటి మేతభూములను
  rationale: מגרש పట్టణాలకు అనుబంధంగా ఉన్న బహిరంగ లేదా పశువుల మేత ప్రాంతాలను సూచిస్తుంది; ‘మేతభూములు’ దాని ఆచరణాత్మక ఉపయోగాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం.
- issue: בְנֵי יִשְׂרָאֵל అనే కుటుంబసంబంధ వ్యక్తీకరణను నిలుపాలా, సమూహార్థక రూపాన్ని వాడాలా
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని వ్యాకరణపరంగా పుంలింగ బహువచన కుటుంబసంబంధ రూపాన్ని ప్రధాన పాఠంలో నిలిపి, సహజమైన సమూహార్థక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘స్వాస్థ్యం,’ ‘ఆజ్ఞ ప్రకారం’ వంటి పదాలు భూవిభజన మరియు దైవ ఆదేశ భావాలను స్పష్టంగా ఉంచుతాయి. మూలంలోని కుటుంబసంబంధ వ్యక్తీకరణను ప్రధాన పాఠంలో నిలిపి, మరింత సాధారణమైన రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
