lexical_decisions:
- source_word: קְדֵמוֹת
  choice: కెదేమోతు
  rationale: స్థల నామాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: מִגְרָשֶׁהָ
  choice: దాని పచ్చిక బయళ్లు
  rationale: మִגְרָשׁ అనేది పట్టణానికి అనుబంధంగా ఉన్న బహిరంగ సామూహిక మేతభూమిని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా ‘పచ్చిక బయళ్లు’ అని ఇచ్చాం; స్త్రీలింగ ఏకవచన ప్రత్యయం ఆయా పట్టణాన్ని సూచించే ‘దాని’గా అనువదించబడింది.
- source_word: מֵיפָעַת
  choice: మేఫాతు
  rationale: స్థల నామాన్ని అనువదించకుండా, హీబ్రూ రూపానికి సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: עָרִים אַרְבַּע
  choice: మొత్తం నాలుగు పట్టణాలు
  rationale: జాబితా చివరనున్న సంఖ్యాత్మక సారాంశాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘మొత్తం’ చేర్చి, עָרִיםను సందర్భానుగుణంగా ‘పట్టణాలు’గా అనువదించాం.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: '...ను దాని ...తో, ...ను దాని ...తో'
  rationale: పునరావృతమయ్యే కర్మ సూచకాన్ని యాంత్రికంగా ప్రతిబింబించకుండా, ప్రతి పట్టణం దానికి అనుబంధమైన భూమితో కలిపి ఇవ్వబడిందనే జాబితా నిర్మాణాన్ని తెలుగు విభక్తులతో స్పష్టంగా చూపించాం.
