source:
  edition: WLC
  text: וַֽ/יִּגְּשׁ֗וּ רָאשֵׁי֙ אֲב֣וֹת הַ/לְוִיִּ֔ם אֶל אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וְ/אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וְ/אֶל רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
translation:
  language: te
  text: అప్పుడు లేవీయుల పితృకుటుంబాల పెద్దలు[a] యాజకుడైన ఎలియాజరు వద్దకు, నూను కుమారుడైన యెహోషువ వద్దకు, ఇశ్రాయేలు కుమారుల[b] గోత్రాల పితృకుటుంబాల పెద్దల వద్దకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వంశ కుటుంబాల పెద్దలు’ లేదా ‘కుటుంబ పెద్దలు.’ హీబ్రూ నుడికారం తండ్రి వంశాన్ని ఆధారంగా చేసుకొని ఏర్పడిన కుటుంబ లేదా వంశ సమూహాల నాయకులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇశ్రాయేలీయుల.’ అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారుల.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: దగ్గరకు వచ్చారు
  rationale: נגשׁ ఇక్కడ అధికారికంగా ఒకరి వద్దకు రావడం లేదా సమీపించడం అనే భావాన్ని ఇస్తుంది. ‘దగ్గరకు వచ్చారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, కథనంలోని కదలికను నిలుపుతుంది.
- source_word: רָאשֵׁי אֲבוֹת
  choice: పితృ కుటుంబాల పెద్దలు
  rationale: ఈ హీబ్రూ నుడికారం తండ్రి వంశాధారంగా ఏర్పడిన కుటుంబ లేదా వంశ విభాగాల నాయకులను సూచిస్తుంది. ‘పితృ కుటుంబాలు’ మూలంలోని బంధుత్వ నిర్మాణాన్ని కనిపించేలా ఉంచుతుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందిన సమూహానికి తెలుగులో స్థిరమైన పేరు.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: యాజకుడైన ఎలియాజరు
  rationale: כֹּהֵןను నేరుగా ‘యాజకుడు’గా అనువదించాం; హీబ్రూ పదక్రమాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా మార్చాం.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువ
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: గోత్రాల పితృ కుటుంబాల పెద్దలు
  rationale: מַטּוֹת గోత్ర విభాగాలను సూచిస్తుంది; ఈ అనువాదం గోత్రాల లోపల ఉన్న పితృ కుటుంబాల నాయకత్వ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఇక్కడ ఇది గోత్రాలు ఎవరివో నిర్దేశిస్తుంది; మూలంలోని కుటుంబాధారిత సమష్టి నుడికారాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలు గోత్ర నిర్మాణంలోని లింగసూచక బంధుత్వ భాష
  choice: ప్రధాన పాఠంలో ‘పితృ కుటుంబాలు,’ ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాలను నిలుపడం
  alternative: ‘వంశ కుటుంబాలు,’ ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు ప్రజలు’
  rationale: హీబ్రూ పాఠం పురుష బంధుత్వ పదాల ద్వారా ప్రాచీన కుటుంబ, గోత్ర ప్రతినిధిత్వ నిర్మాణాన్ని వ్యక్తపరుస్తుంది. దానిని పూర్తిగా లింగనిరపేక్షంగా మార్చకుండా, ఆధునిక పాఠకులకు అర్థమయ్యే తెలుగులో నిలుపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘దగ్గరకు’ అనే సహజ ప్రయోగంతో ఒకే వాక్యంలో ముగ్గురు అధికార ప్రతినిధుల వద్దకు వచ్చిన సమాంతర నిర్మాణాన్ని స్పష్టంగా ఉంచాం. ఆంగ్ల సంప్రదింపు పాఠంలోని పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో కనిపించినందున, [a]ను ‘పితృ కుటుంబాలు’ వద్ద, [b]ను ‘ఇశ్రాయేలు కుమారులు’ వద్ద మూలార్థానికి అనుగుణంగా ఉంచాం.
