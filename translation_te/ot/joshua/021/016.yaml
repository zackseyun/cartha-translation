  text: וְ/אֶת עַ֣יִן וְ/אֶת מִגְרָשֶׁ֗/הָ וְ/אֶת יֻטָּה֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת בֵּ֥ית שֶׁ֖מֶשׁ וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֣ים תֵּ֔שַׁע מֵ/אֵ֕ת שְׁנֵ֥י הַ/שְּׁבָטִ֖ים הָ/אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
translation:
  language: te
  text: అయిన్ దాని పచ్చికబయళ్లతో సహా[a], యుట్టా దాని పచ్చికబయళ్లతో సహా, బేత్‌షెమెషు దాని పచ్చికబయళ్లతో సహా—ఈ రెండు గోత్రాల నుండి తొమ్మిది పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సామూహిక భూములు,” లేదా “పట్టణం చుట్టూ ఉన్న భూములు”; ప్రతి పట్టణానికి అనుబంధంగా ఉన్న భూమిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: అయిన్
  rationale: స్థలపేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికబయళ్లు
  rationale: పట్టణానికి అనుబంధంగా ఉండి ప్రధానంగా పశువులను మేపడానికి ఉపయోగించే బహిరంగ భూములను సూచిస్తుంది; పాతకాలపు లేదా అస్పష్టమైన పదాలకంటే ఇది సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: יֻטָּה
  choice: యుట్టా
  rationale: హీబ్రూ స్థలపేరును దాని ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֵּית שֶׁמֶשׁ
  choice: బేత్‌షెమెషు
  rationale: పదశః అర్థాన్ని అనువదించకుండా, స్థిరమైన పట్టణపేరుగా లిప్యంతరీకరించాం.
- source_word: עָרִים תֵּשַׁע
  choice: తొమ్మిది పట్టణాలు
  rationale: ఈ భూవిభజన సందర్భంలో עָרִים అనే పదానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: מֵאֵת שְׁנֵי הַשְּׁבָטִים הָאֵלֶּה
  choice: ఈ రెండు గోత్రాల నుంచి
  rationale: ముందు పేర్కొన్న రెండు గోత్రాల నుంచి ఈ పట్టణాలు కేటాయించబడ్డాయని తెలిపే మూలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా స్వరూపాన్ని నిలుపుకుంటూనే వాక్యాన్ని సహజంగా పూర్తి చేశాం. మూలంలోని పునరుక్తిని గౌరవిస్తూ ప్రతి పట్టణానికి దాని పచ్చికబయళ్లను విడిగా పేర్కొన్నాం; సందర్భం ద్వారా అర్థమయ్యే ‘ఇచ్చారు’ అనే క్రియను తెలుగులో స్పష్టత కోసం చేర్చాం.
