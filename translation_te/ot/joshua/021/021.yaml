source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת עִ֨יר מִקְלַ֧ט הָ/רֹצֵ֛חַ אֶת שְׁכֶ֥ם וְ/אֶת מִגְרָשֶׁ֖/הָ בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת גֶּ֖זֶר וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/021.yaml
  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
translation:
  language: te
  text: వారు ఎఫ్రాయిము కొండప్రాంతంలోని[b] ఒకరిని చంపినవానికి ఆశ్రయపట్టణమైన[a] షెకెమును దాని పచ్చికబయళ్లతో సహా వారికి ఇచ్చారు. అలాగే గెజెరును దాని పచ్చికబయళ్లతో సహా ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “చంపినవానికి ఆశ్రయపట్టణం.” ఇక్కడి హీబ్రూ న్యాయపదం ఒకరి మరణానికి కారణమై, తీర్పు జరిగే వరకు ఆశ్రయం కోసం పారిపోగల వ్యక్తిని సూచిస్తుంది; అతడు తప్పనిసరిగా ఉద్దేశపూర్వక హత్య చేసినవాడని దీని అర్థం కాదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఎఫ్రాయిము పర్వతం”; అంటే ఎఫ్రాయిము కొండప్రాంతం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לָהֶם
  choice: వారు ... వారికి ఇచ్చారు
  rationale: נתן యొక్క కథన భూతకాల రూపాన్ని సహజమైన ఆధునిక తెలుగు వాక్యక్రమంలో అందించింది; לָהֶם సందర్భంలోని లేవీయులను సూచించే పరోక్ష కర్మ.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: ఒకరిని చంపినవాడు ఆశ్రయం పొందే పట్టణం
  rationale: ఇది ఆశ్రయపట్టణాల చట్టపరమైన సందర్భంలోని సాంకేతిక పదబంధం. హత్యానేరం నిర్ధారించబడినవాడని ముందుగానే తేల్చకుండా, మరణానికి కారణమైన వ్యక్తి ఆశ్రయం కోరగలడనే భావాన్ని నిలుపుతుంది.
- source_word: שְׁכֶם
  choice: షెకెము
  rationale: హీబ్రూ స్థలనామానికి తెలుగులో సాధారణంగా గుర్తించదగిన లిప్యంతరీకరణ.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికబయళ్లు
  rationale: పట్టణానికి అనుబంధంగా పశువుల మేత మొదలైన సామూహిక అవసరాలకు ఉంచిన బహిరంగ భూములను సహజంగా సూచిస్తుంది.
- source_word: בְּהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలో
  rationale: ఇక్కడ הַר ఒకే కొండను కాక ఎఫ్రాయిము గోత్రప్రాంతంలోని కొండల ప్రాంతాన్ని సూచిస్తుంది.
- source_word: גֶּזֶר
  choice: గెజెరు
  rationale: హీబ్రూ స్థలనామానికి తెలుగులో సహజమైన లిప్యంతరీకరణ.
theological_decisions:
- issue: הָרֹצֵחַ అనే పదంలో అపరాధ స్థాయి
  choice: ఒకరిని చంపినవాడు
  alternative: హంతకుడు / నరహంతకుడు
  rationale: ఆశ్రయపట్టణాల న్యాయసందర్భంలో ఈ వ్యక్తి ఉద్దేశపూర్వక హత్యకు దోషిగా ఇప్పటికే నిర్ధారించబడినవాడు కావాల్సిన అవసరం లేదు. అందువల్ల అపరాధాన్ని ముందుగానే నిర్ణయించే పదాన్ని నివారించి మూలంలోని న్యాయపరమైన ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. పొడవైన హీబ్రూ సముచ్చయ నిర్మాణాన్ని రెండు తెలుగు వాక్యాలుగా విభజించినా, రెండు పట్టణాలు మరియు వాటి పచ్చికబయళ్లను ఇచ్చారనే జాబితా నిర్మాణాన్ని కాపాడింది. మూలంలోని న్యాయపరమైన అనిశ్చితిని ‘హంతకుడు’ అని ఖరారు చేయకుండా వ్యక్తపరిచింది.
