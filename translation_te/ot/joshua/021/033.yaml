  yaml_path: translation/ot/joshua/021/033.yaml
  text: All the cities of the Gershonites by their families were thirteen cities[a], with their pasturelands.
translation:
  language: te
  text: వారి వంశాల ప్రకారం గెర్షోనీయుల పట్టణాలన్నీ పదమూడు పట్టణాలు[a], వాటి పచ్చికబయళ్లతో పాటు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు వాటి పచ్చికబయళ్లు.”
    reason: హీబ్రూ సంధి వావ్‌ను “తో పాటు” లేదా “మరియు” అని అనువదించవచ్చు.
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: పట్టణాలన్నీ
  rationale: כָּל అనే సమగ్ర పరిమాణార్థాన్ని సహజమైన తెలుగు పదక్రమంలో ‘అన్నీ’తో తెలిపి, עָרֵיని ఈ భూవిభజన సందర్భంలో ‘పట్టణాలు’గా అనువదించాం.
- source_word: הַגֵּרְשֻׁנִּי
  choice: గెర్షోనీయులకు
  rationale: ఏకవచన జాతివాచక రూపం ఇక్కడ గెర్షోను వంశస్థులను సమూహంగా సూచిస్తుంది; לְמִשְׁפְּחֹתָםతో కలిసి వారికి కేటాయించబడిన పట్టణాల భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: לְ ఇక్కడ వంశాలవారీ వర్గీకరణ లేదా పంపిణీని సూచిస్తుంది; ‘ప్రకారం’ మూలంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: పదమూడు
  rationale: ముందే ‘పట్టణాలన్నీ’ అని ఉన్నందున తెలుగులో సహజంగా సంఖ్యను విధేయంగా ఉంచాం; అర్థంలో ‘పదమూడు పట్టణాలు’ అన్నది స్పష్టమే.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: వాటి పచ్చికబయళ్లతో కలిపి
  rationale: מִגְרָשׁ పట్టణాలకు అనుబంధంగా పశువుల మేత కోసం ఉన్న బహిరంగ భూమిని సూచిస్తుంది. ‘పచ్చికబయళ్లు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; וְను జాబితాకు అనుబంధార్థంగా ‘తో కలిపి’ అని అందించాం.
