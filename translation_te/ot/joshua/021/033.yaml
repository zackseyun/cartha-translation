translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన లెక్కింపు వాక్యంగా రూపొందించాం. వచనంలోని వంశాలవారీ పంపిణీ భావాన్ని నిలిపి, ప్రాచీన లేదా పరిపాలనా భారమున్న పదజాలాన్ని నివారించాం.
