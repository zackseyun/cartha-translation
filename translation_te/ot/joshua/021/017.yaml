  yaml_path: translation/ot/joshua/021/017.yaml
  text: 'and from the tribe of Benjamin: Gibeon with its pasturelands[a], and Geba with its pasturelands;'
translation:
  language: te
  text: 'మరియు బెన్యామీను గోత్రం నుండి: గిబియోను దాని పచ్చికబయళ్లతో[a], గెబా దాని పచ్చికబయళ్లతో;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సామూహిక భూములు’ లేదా ‘బహిరంగ భూమి’; ప్రతి పట్టణం చుట్టూ ఉన్న భూమిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה בִנְיָמִן
  choice: బెన్యామీను గోత్రం నుంచి
  rationale: గోత్రాల భూభాగాల సందర్భంలో מַטֶּה అంటే ‘గోత్రం’. ఉపసర్గ מִן‌ను ‘నుంచి’గా సహజంగా అనువదించాం; ఆరంభ וּ ముందున్న జాబితాతో అనుసంధానిస్తుంది, దీనిని తెలుగు జాబితా కొనసాగింపులో ప్రత్యేకంగా ‘మరియు’ అని పలకకుండానే సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: גִּבְעוֹן
  choice: గిబియోను
  rationale: హీబ్రూ స్థలనామాన్ని ఆధునిక ప్రామాణిక తెలుగు బైబిలు శైలికి తగినట్లుగా లిప్యంతరీకరించాం.
- source_word: מִגְרָשֶׁהָ
  choice: దాని పచ్చికబయళ్లు
  rationale: מִגְרָשׁ నగరం చుట్టూ పశువుల మేతకు లేదా సామూహిక వినియోగానికి ఉంచిన బహిరంగ భూమిని సూచిస్తుంది. ‘పచ్చికబయళ్లు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, బహువచన భావాన్ని నిలుపుతుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం నగరాన్ని సూచిస్తూ తెలుగులో ‘దాని’గా వచ్చింది.
- source_word: גֶּבַע
  choice: గెబ
  rationale: హీబ్రూ స్థలనామాన్ని దాని స్వరరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూభాగాల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ తెలుగులో సహజంగా చదవడానికి విరామచిహ్నాలు అమర్చబడ్డాయి.
