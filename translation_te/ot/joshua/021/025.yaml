base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/025.yaml
  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
translation:
  language: te
  text: మనష్షే గోత్రంలోని సగభాగం నుండి తానాకు పట్టణాన్ని, దాని పచ్చిక బయళ్లను,[a] గాత్-రిమ్మోను పట్టణాన్ని, దాని పచ్చిక బయళ్లను ఇచ్చారు—మొత్తం రెండు పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని హీబ్రూ ప్రతుల్లోను, 1 దినవృత్తాంతాలు 6:70లోని సమాంతర భాగంలోను, మనష్షే గోత్రం నుండి కేటాయించిన పట్టణాల పేర్లు భిన్నంగా ఉన్నాయి.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం నుండి
  rationale: מַחֲצִית מַטֵּה అనే పదబంధం గోత్రంలోని సగభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు వాడుకలో సహజంగా, సంక్షిప్తంగా ఉండే ‘అర్ధగోత్రం’ను ఎంచుకున్నాం.
- source_word: תַּעְנַךְ
  choice: తానాకు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం; కర్మవిభక్తి సహజంగా ఉండేందుకు ‘పట్టణాన్ని’ జోడించాం.
- source_word: מִגְרָשֶׁהָ
  choice: దాని పచ్చికబయళ్లను
  rationale: מִגְרָשׁ పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ మేతభూములను సూచిస్తుంది. ‘పచ్చికబయళ్లు’ సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక పదం.
- source_word: גַּת רִמּוֹן
  choice: గాత్-రిమ్మోను
  rationale: సంయుక్త స్థలనామాన్ని మూలంలోని రెండు భాగాలు స్పష్టంగా కనిపించేలా హైఫన్‌తో లిప్యంతరీకరించాం.
- source_word: עָרִים שְׁתָּיִם
  choice: మొత్తం రెండు పట్టణాలు
  rationale: జాబితా చివర ఇచ్చిన లెక్కను తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘మొత్తం’ చేర్చాం; עָרִים ను సందర్భానుసారం ‘పట్టణాలు’గా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే జాబితా శైలిని ఉపయోగించాం. మూలంలో క్రియ లేకపోయినా, ముందున్న సందర్భం నుండి గ్రహించబడే కేటాయింపు భావాన్ని తెలుగులో పూర్తి వాక్యంగా చేయడానికి ‘ఇచ్చారు’ అని వ్యక్తపరిచాం.
