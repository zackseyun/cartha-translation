language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ לִ/בְנֵ֣י אַהֲרֹ֔ן מִ/מִּשְׁפְּח֥וֹת הַ/קְּהָתִ֖י מִ/בְּנֵ֣י לֵוִ֑י כִּ֥י לָ/הֶ֛ם הָיָ֥ה הַ/גּוֹרָ֖ל רִיאשֹׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/010.yaml
  text: It was for the sons of Aaron[a], from the families of the Kohathites, from the sons of Levi, because the first lot was for them.
translation:
  language: te
  text: లేవి కుమారులైన కహాతీయుల వంశాలకు చెందిన అహరోను కుమారులకు ఈ కేటాయింపు దక్కింది; ఎందుకంటే మొదటి చీటి వారికి పడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: అది దక్కింది
  rationale: కథనంలోని అస్తిత్వ/కేటాయింపు భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; సందర్భం పట్టణాల కేటాయింపు గురించి ఉంది.
- source_word: לִבְנֵי אַהֲרֹן
  choice: అహరోను కుమారులకు
  rationale: ల ఉపసర్గ సూచించే కేటాయింపు భావాన్ని, మూలంలోని వంశావళి పదబంధాన్ని నిలుపుతుంది.
- source_word: מִמִּשְׁפְּחוֹת הַקְּהָתִי
  choice: కహాతీయ వంశాలవారైన
  rationale: מִשְׁפָּחוֹת అనే పదంలోని విస్తృత కుటుంబ/వంశ సమూహ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מִבְּנֵי לֵוִי
  choice: లేవి కుమారులలోని
  rationale: కహాతీయ వంశాలు లేవి సంతతిలోనివని తెలిపే విస్తృత వంశావళి సంబంధాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తరువాతి వాక్యభాగం ముందటి కేటాయింపుకు కారణాన్ని ఇస్తుందని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָהֶם הָיָה הַגּוֹרָל רִאשֹׁנָה
  choice: మొదటి చీటి వారిదే
  rationale: చీట్ల ద్వారా కేటాయింపులో మొదటి వంతు వారికి వచ్చిందనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి నిర్మాణాన్ని సాధ్యమైనంతగా నిలుపుతూ సహజమైన కేటాయింపు భాషను వాడాం. ‘చీటి’ అనే పదం గోరాల్ యొక్క పంపిణీ సందర్భాన్ని స్పష్టంగా అందిస్తుంది.
