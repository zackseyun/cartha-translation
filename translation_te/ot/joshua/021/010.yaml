revisions:
- from: లేవి కుమారులలోని కహాతీయ వంశాలవారైన అహరోను కుమారులకు అది దక్కింది; ఎందుకంటే మొదటి చీటి వారిదే.
  to: లేవి కుమారులైన కహాతీయుల వంశాలకు చెందిన అహరోను కుమారులకు ఈ కేటాయింపు దక్కింది; ఎందుకంటే మొదటి చీటి వారికి పడింది.
  rationale: The revision preserves the source’s allocation statement, its full genealogical chain, and the causal clause, while making the Telugu syntax and the lot-allotment idiom clearer. No footnote is necessary because “వంశాలు” adequately represents the source term for families/clans in this context.
  reviewer_model: gpt-5.6-terra
