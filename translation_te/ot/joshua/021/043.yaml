source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן יְהוָה֙ לְ/יִשְׂרָאֵ֔ל אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/תֵ֣ת לַ/אֲבוֹתָ֑/ם וַ/יִּרָשׁ֖וּ/הָ וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
translation:
  language: te
  text: కాబట్టి యెహోవా ఇశ్రాయేలుకు వారి పితరులకు ఇస్తానని తాను ప్రమాణం చేసిన దేశమంతటినీ ఇచ్చాడు. వారు దాన్ని[a] స్వాధీనం చేసుకొని అందులో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాన్ని స్వాధీనంగా కలిగియున్నారు”; హీబ్రూ క్రియకు ఒడంబడిక సందర్భాల్లో “వారసత్వంగా పొందు” అనే భావమూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచి, సాధారణ బిరుదుతో భర్తీ చేయలేదు.
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן ఇక్కడ దేవుడు దేశాన్ని అనుగ్రహించిన సూటి క్రియను సూచిస్తుంది; అదనపు వ్యాఖ్యాన భావం లేకుండా ‘ఇచ్చాడు’ సహజంగా దాన్ని అందిస్తుంది.
- source_word: כָּל הָאָרֶץ
  choice: దేశమంతటినీ
  rationale: אָרֶץ ఇక్కడ భూమండలాన్ని కాక ఇశ్రాయేలుకు వాగ్దానం చేసిన దేశాన్ని సూచిస్తుంది; כָּל తెలిపే సంపూర్ణతను ‘అంతటినీ’ నిలుపుతుంది.
- source_word: אֲשֶׁר נִשְׁבַּע לָתֵת
  choice: ఇస్తానని తాను ప్రమాణం చేసిన
  rationale: నిఫాల్ రూపంలోని שׁבע ప్రమాణం చేయడాన్ని సూచిస్తుంది. తెలుగులో ఈ నిర్మాణం ముందుగా చేసిన ప్రమాణబద్ధమైన వాగ్దానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַאֲבוֹתָם
  choice: వారి పితరులకు
  rationale: హీబ్రూ పదంలోని పురుష పూర్వికుల సూచనను కాపాడుతూ, గౌరవప్రదమైన బైబిలు సందర్భానికి సహజమైన ‘పితరులు’ వాడబడింది.
- source_word: וַיִּרָשׁוּהָ
  choice: వారు దాన్ని స్వాధీనం చేసుకొని
  rationale: ירשׁకు స్వాధీనం చేసుకోవడం, కలిగియుండడం, వారసత్వంగా పొందడం వంటి భావాలు ఉండవచ్చు. ఇక్కడ దేశాన్ని వాస్తవంగా అధీనంలోకి తీసుకున్న భావాన్ని ‘స్వాధీనం చేసుకొని’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: అందులో నివసించారు
  rationale: ישׁב + ב ఇక్కడ దేశంలో ఉండడం లేదా స్థిరంగా నివసించడాన్ని సూచిస్తుంది; ‘నివసించారు’ మూలంలోని సూటి భావాన్ని కాపాడుతుంది.
- source_word: וַ
  choice: కాబట్టి
  rationale: ఆరంభ వావ్ మునుపటి వృత్తాంతానికి కొనసాగింపుతో పాటు ఫలితాత్మక సారాంశాన్ని పరిచయం చేస్తుంది; ‘కాబట్టి’ ఆ సంబంధాన్ని సహజంగా చూపుతుంది.
theological_decisions:
- issue: దేశ వాగ్దానం నెరవేర్పు యొక్క పరిధి మరియు బలం
  choice: యెహోవా వాగ్దానం చేసిన దేశమంతటినీ ఇశ్రాయేలుకు ఇచ్చాడనీ, వారు దాన్ని స్వాధీనం చేసుకొని అందులో నివసించారనీ వచనం చెప్పే బలమైన నెరవేర్పు సారాంశాన్ని యథాతథంగా ఉంచడం.
  alternative: ‘అంతటినీ’ అనే పదాన్ని బలహీనపరచి పాక్షిక నెరవేర్పుగా అనువదించడం, లేదా ఇతర వచనాలపై ఒక నిర్దిష్ట సిద్ధాంతపరమైన పరిష్కారాన్ని రుద్దేలా దీనిని సంపూర్ణంగా నిర్వచించడం.
  rationale: హీబ్రూ పాఠం כָּל (‘అంతా’) అని స్పష్టంగా చెప్పి, దాని తరువాత స్వాధీనం మరియు నివాసాన్ని సూచించే క్రియలను వాడుతుంది. విస్తృత గ్రంథసంబంధ ఉద్రిక్తతను అనువాదంలో పరిష్కరించకుండా, ఈ వచనం స్వయంగా చేసే ప్రకటన బలాన్ని నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘దేశమంతటినీ’ ద్వారా వాగ్దాన దేశపు సంపూర్ణతను, ‘స్వాధీనం చేసుకొని’ ద్వారా ירשׁ యొక్క సందర్భోచిత భావాన్ని, ‘నివసించారు’ ద్వారా ישׁב యొక్క సూటి భావాన్ని నిలుపుకుంది.
