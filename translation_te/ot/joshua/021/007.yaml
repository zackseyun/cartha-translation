base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/007.yaml
  text: 'For the sons of Merari[a], according to their families, from the tribe of Reuben and from the tribe of Gad and from the tribe of Zebulun: twelve cities.'
translation:
  language: te
  text: మెరారి కుమారులకు[a], వారి వంశాల ప్రకారం, రూబేను గోత్రం నుండి, గాదు గోత్రం నుండి, జెబూలూను గోత్రం నుండి పన్నెండు పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెరారి వంశస్థులకు.”
    reason: בְּנֵי అనే పదబంధం అక్షరార్థంగా ‘కుమారులు’ అని ఉన్నప్పటికీ, విస్తృతంగా ‘వంశస్థులు’ అనే అర్థాన్నీ ఇవ్వగలదు.
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: మెరారి కుమారులకు
  rationale: లְ ఉపసర్గం ఈ కేటాయింపు సందర్భంలో గ్రహీతలను సూచిస్తుంది; בְּנֵי అనే కుటుంబపరమైన హీబ్రూ ప్రయోగాన్ని నేరుగా నిలుపుతుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ కుటుంబ లేదా వంశ సమూహాన్ని సూచిస్తుంది; కేటాయింపు వారి వంశ విభాగాల ప్రకారం జరిగిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִמַּטֵּה
  choice: గోత్రం నుండి
  rationale: భూభాగం లేదా పట్టణాల కేటాయింపు సందర్భంలో מַטֶּה అంటే ‘గోత్రం’; మూలంలోని ‘నుండి’ భావాన్ని కూడా నిలుపుతుంది.
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: హీబ్రూ వ్యక్తి/గోత్ర నామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: גָד
  choice: గాదు
  rationale: హీబ్రూ వ్యక్తి/గోత్ర నామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: זְבוּלֻן
  choice: జెబూలూను
  rationale: హీబ్రూ వ్యక్తి/గోత్ర నామంలోని ధ్వనులను అనుసరించిన తెలుగు లిప్యంతరీకరణ.
- source_word: עָרִים
  choice: పట్టణాలు
  rationale: עִיר యొక్క బహువచనం; ఈ భూకేటాయింపు జాబితాలో నివాస పట్టణాలను సూచిస్తుంది.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: పన్నెండు
  rationale: హీబ్రూ సంఖ్యను సహజమైన తెలుగు పదక్రమంలో అనువదించింది.
