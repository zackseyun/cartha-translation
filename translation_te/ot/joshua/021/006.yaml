translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని క్రియారహిత జాబితా నిర్మాణం తెలుగులో అసహజంగా ఉండటంతో, మునుపటి వచనంలోని కేటాయింపు భావాన్ని స్పష్టం చేయడానికి ‘లభించాయి’ అనే క్రియను చేర్చాం; పునరావృతమైన ‘గోత్రం నుండి’ నిర్మాణాన్ని మూల జాబితా లయను కాపాడేందుకు ఉంచాం.
