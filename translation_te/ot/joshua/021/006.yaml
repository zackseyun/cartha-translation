source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י גֵרְשׁ֗וֹן מִ/מִּשְׁפְּח֣וֹת מַטֵּֽה יִשָּׂשכָ֣ר וּ/מִ/מַּטֵּֽה אָ֠שֵׁר וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י וּ֠/מֵ/חֲצִי מַטֵּ֨ה מְנַשֶּׁ֤ה בַ/בָּשָׁן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
translation:
  language: te
  text: గేర్షోను కుమారులకు ఇశ్శాఖారు గోత్రంలోని వంశాల నుండి[a], ఆషేరు గోత్రం నుండి, నఫ్తాలి గోత్రం నుండి, బాషానులోని మనష్షే అర్ధగోత్రం నుండి చీటి ద్వారా పదమూడు పట్టణాలు లభించాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్శాఖారు గోత్రంలోని కుటుంబ సమూహాల నుండి.’ ఇక్కడి హీబ్రూ పదం విస్తృత కుటుంబాలను లేదా వంశ సమూహాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: గేర్షోను కుమారులకు
  rationale: వంశీయ సందర్భంలో בְּנֵי అనే పదానికి సంప్రదాయబద్ధమైన ‘కుమారులు’ అనే రూపాన్ని ఉంచి, לְ ఉపసర్గను ‘కు’తో వ్యక్తపరిచాం.
- source_word: מִ/מִּשְׁפְּחֹת
  choice: వంశాల నుండి
  rationale: מִשְׁפָּחוֹת ఇక్కడ గోత్రంలోని విస్తృత కుటుంబ సమూహాలను సూచిస్తుంది; ‘వంశాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘గోత్రం’తో గందరగోళం కలగకుండా చేస్తుంది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: భూభాగాల పంపిణీ సందర్భంలో מַטֶּה ఇశ్రాయేలు గోత్ర విభాగాన్ని సూచిస్తుంది.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం నుండి
  rationale: חֲצִי מַטֶּהను సంక్షిప్తంగా, సందర్భానుకూలంగా ‘అర్ధగోత్రం’ అని అనువదించాం.
- source_word: בַ/בָּשָׁן
  choice: బాషానులోని
  rationale: ప్రాంతనామాన్ని సహజమైన తెలుగు స్థానవాచక రూపంలో ఇచ్చి, అది మనష్షే అర్ధగోత్రాన్ని విశేషించేలా వాక్యాన్ని నిర్మించాం.
- source_word: בַּ/גּוֹרָל
  choice: చీటి ప్రకారం
  rationale: పట్టణాల కేటాయింపు చీటి ద్వారా నిర్ణయించబడిందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: పదమూడు పట్టణాలు
  rationale: עָרִיםకు ఈ భూకేటాయింపు జాబితాలో ‘పట్టణాలు’ స్పష్టమైన, సహజమైన తెలుగు సమానం.
