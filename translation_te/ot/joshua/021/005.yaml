translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన జాబితా శైలిని ఉపయోగించింది. పేర్లను తెలుగు బైబిల్ వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది. మూలంలోని దీర్ఘ పంపిణీ నిర్మాణం స్పష్టంగా ఉండేందుకు డాష్‌లను ఉపయోగించింది; భావాన్ని సిద్ధాంతపరంగా విస్తరించలేదు.
