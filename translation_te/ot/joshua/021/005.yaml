  text: וְ/לִ/בְנֵ֨י קְהָ֜ת הַ/נּוֹתָרִ֗ים מִ/מִּשְׁפְּחֹ֣ת מַטֵּֽה אֶ֠פְרַיִם וּֽ/מִ/מַּטֵּה דָ֞ן וּ/מֵ/חֲצִ֨י מַטֵּ֧ה מְנַשֶּׁ֛ה בַּ/גּוֹרָ֖ל עָרִ֥ים עָֽשֶׂר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/005.yaml
  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
translation:
  language: te
  text: మిగిలిన కహాతు వంశీయులకు[a]—ఎఫ్రాయిము గోత్రంలోని వంశాల నుండి, దాను గోత్రం నుండి, మనష్షే అర్ధగోత్రం నుండి—చీటి ద్వారా పది పట్టణాలు దక్కాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిగిలిన కహాతీయులకు.’
    reason: బְּנֵי קְהָת ను అక్షరార్థంగా ‘కహాతు కుమారులు/వంశీయులు’గా లేదా స్థిరపడిన వర్గనామంగా ‘కహాతీయులు’గా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת הַנּוֹתָרִים
  choice: మిగిలిన కహాతు వంశీయులకు
  rationale: పంపిణీ సందర్భంలోని לְ దాతృత్వ భావాన్ని ‘వారికి’ రూపంలో నిలిపి, בְּנֵי־קְהָת అనే వంశసంబంధ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో ‘కహాతు వంశీయులు’గా వ్యక్తం చేసింది. הַנּוֹתָרִים మునుపటి వచనంలో పేర్కొనబడని మిగిలిన వర్గాన్ని సూచిస్తుంది.
- source_word: מִ/מִּשְׁפְּחֹת
  choice: వంశాల నుండి
  rationale: గోత్రంలోని ఉపవిభాగాలను సూచించే מִשְׁפָּחוֹת కు ‘కుటుంబాలు’ కంటే ఈ జాబితా సందర్భంలో ‘వంశాలు’ మరింత తగినది.
- source_word: מַטֵּה אֶפְרַיִם
  choice: ఎఫ్రాయిము గోత్రం
  rationale: ఇక్కడ מַטֶּה కర్రను కాక గోత్రసమూహాన్ని సూచిస్తుంది.
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: దాను గోత్రం నుండి
  rationale: హీబ్రూ వాక్యంలోని సమాంతర నిర్మాణాన్నీ, మూలాన్ని సూచించే מִן భావాన్నీ స్పష్టంగా నిలిపింది.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం నుండి
  rationale: మనష్షే గోత్రపు భౌగోళిక విభజనను సూచించే సంప్రదాయబద్ధమైన, సంక్షిప్తమైన తెలుగు వ్యక్తీకరణ.
- source_word: בַּ/גּוֹרָל
  choice: చీట్లు వేయడం ద్వారా
  rationale: గోరాలు/చీట్లు వేసి పంపిణీ నిర్ణయించే విధానాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ‘వంతు’ అని మాత్రమే అనువదించి ప్రక్రియను మరుగుపరచలేదు.
- source_word: עָרִים עָשֶׂר
  choice: పది పట్టణాలు
  rationale: కేటాయింపు జాబితాలో עִיר కు సహజమైన ఆధునిక తెలుగు సమానార్థకం ‘పట్టణం’.
- source_word: implicit verbless clause
  choice: వచ్చాయి
  rationale: హీబ్రూలో క్రియ లేని సంక్షిప్త జాబితా వాక్యాన్ని తెలుగులో పూర్తిచేయడానికి ‘వచ్చాయి’ చేర్చబడింది. ఇది ‘పొందారు’ కంటే కేటాయింపు ఫలితాన్ని వ్యక్తం చేస్తూ మూలంలో లేని క్రియాశీల చర్యను తక్కువగా దిగుమతి చేస్తుంది.
