translation:
  language: te
  text: ఈ పట్టణాల్లో ప్రతిదానికి దాని చుట్టూ పచ్చికబయళ్లు[a] ఉండేవి; ఈ పట్టణాలన్నిటి విషయంలోనూ అలాగే ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
