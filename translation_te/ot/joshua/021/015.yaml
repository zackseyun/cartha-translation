lexical_decisions:
- source_word: חֹלֹן
  choice: హోలోను
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా, హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
- source_word: מִגְרָשֶׁהָ
  choice: దాని పచ్చిక బయళ్లతో సహా
  rationale: మִגְרָש్ׁ పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని, ముఖ్యంగా పశువుల మేతకు మరియు సామూహిక వినియోగానికి ఉద్దేశించిన భూమిని సూచిస్తుంది. లేవీయుల పట్టణాల సందర్భంలో ‘పచ్చిక బయళ్లు’ సహజంగా, స్పష్టంగా ఉంటుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం ప్రతి పట్టణాన్ని సూచిస్తూ ‘దాని’గా ఇవ్వబడింది.
- source_word: דְּבִר
  choice: దెబీరు
  rationale: ఇది స్థలనామంగా వాడబడినందున అర్థానువాదం చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
- source_word: וְאֶת
  choice: మరియు / జాబితా నిర్మాణంలో విరామచిహ్నం
  rationale: אֶת ప్రత్యక్ష కర్మ సూచికకు తెలుగులో ప్రత్యేక పదం అవసరం లేదు. పునరుక్త וְ జాబితా సంబంధాన్ని చూపుతుంది; సహజమైన తెలుగులో నగరాల మధ్య అల్పవిరామంతో, వాటి భూములతో సంబంధాన్ని ‘తో సహా’తో వ్యక్తం చేశాము.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పట్టణాల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘తో సహా’ అనే నిర్మాణం ప్రతి పట్టణం మరియు దానికి చెందిన పచ్చిక బయళ్ల మధ్య సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
