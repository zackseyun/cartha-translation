  text: హోలోను, దాని పచ్చిక బయళ్లతో సహా[a], దెబీరు, దాని పచ్చిక బయళ్లతో సహా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 దినవృత్తాంతాలు 6:58లోని సమాంతర జాబితాలో ఈ పట్టణం పేరు ‘హీలేను’ అని ఉంది; ఇక్కడ యెహోషువ గ్రంథంలోని హెబ్రీ పాఠం ‘హోలోను’ అని చదువుతుంది.
