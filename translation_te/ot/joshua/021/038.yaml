source:
  edition: WLC
  text: וּ/מִ/מַּטֵּה גָ֗ד אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת רָמֹ֥ת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
translation:
  language: te
  text: గాదు గోత్రం నుండి, మనిషిని చంపినవానికి[a] ఆశ్రయపట్టణమైన గిలాదులోని రామోతును[b], దాని మేత భూములతో[c] సహా, మహనయీమును, దాని మేత భూములతో సహా ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రాణం తీసినవానికి.’ ఇక్కడి న్యాయపరమైన సందర్భంలో ఆ వ్యక్తి ఉద్దేశపూర్వకంగా హత్య చేశాడని ముందే నిర్ధారించబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘రామోతు-గిలాదు.’ హీబ్రూ పదబంధాన్ని ‘గిలాదులోని రామోతు’ అని గానీ, సంయుక్త స్థలనామంగా గానీ ఇవ్వవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ‘మేత భూములు’ అంటే పట్టణంతోపాటు వినియోగానికి కేటాయించిన దాని చుట్టుపక్కల భూములు.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִמַּטֵּה גָד
  choice: గాదు గోత్రం నుండి
  rationale: గోత్రాల భూవిభజన సందర్భంలో מַטֶּה అంటే ‘గోత్రం’; సంధి, విభక్తి ప్రత్యయాలను తెలుగులో సహజంగా ‘నుండి’తో వ్యక్తం చేశాం.
- source_word: עִיר מִקְלַט
  choice: ఆశ్రయపట్టణం
  rationale: ఇది ఆశ్రయం పొందేందుకు నియమించబడిన పట్టణాన్ని సూచించే స్థిరమైన న్యాయపరమైన పదబంధం.
- source_word: הָרֹצֵחַ
  choice: మనిషిని చంపినవాడు
  rationale: רֹצֵחַ హత్య చేసినవాడినీ, ఉద్దేశపూర్వకత ఇంకా నిర్ధారణ కాని ప్రాణహంతకుడినీ సూచించగలదు. ‘హంతకుడు’ లేదా ‘హత్యకారి’ అనే పదాలు ముందే ఉద్దేశపూర్వక నేరాన్ని నిర్ధారించినట్టు వినిపించవచ్చు; అందువల్ల సందర్భంలోని న్యాయపరమైన అనిశ్చితిని ఈ వివరణాత్మక రూపం కాపాడుతుంది.
- source_word: רָמֹת בַּגִּלְעָד
  choice: గిలాదులోని రామోతు
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు స్థలసంబంధ రూపంలో ఇచ్చాం; దీనిని సంయుక్త స్థలనామంగా కూడా పలకవచ్చు.
- source_word: מִגְרָשֶׁהָ
  choice: దాని మేత భూములు
  rationale: లేవీయుల పట్టణాల జాబితాల్లో מִגְרָשׁ పట్టణంతోపాటు వినియోగానికి కేటాయించిన చుట్టుపక్కల బహిరంగ భూమిని, ముఖ్యంగా పశువుల మేత కోసం వాడే భూమిని సూచిస్తుంది.
- source_word: מַחֲנַיִם
  choice: మహనయీము
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
theological_decisions:
- issue: רֹצֵחַ అనే న్యాయపరమైన పదంలో దోష ఉద్దేశం
  choice: మనిషిని చంపినవాడు
  alternative: హంతకుడు / హత్యకారి
  rationale: ఆశ్రయపట్టణ సందర్భం ఉద్దేశపూర్వక హత్యను ముందుగానే నిర్ణయించదు. కాబట్టి మూలంలోని న్యాయపరమైన ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలిని వాడాం. వచనం ముందున్న పట్టణాల జాబితాకు కొనసాగింపుగా ఉన్నందున, తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు సందర్భానుసారంగా ‘ఇచ్చారు’ను చివర చేర్చాం. ప్రతి పాదటిప్పణి సూచికను సంబంధిత పదబంధం వెంట ఉంచాం.
