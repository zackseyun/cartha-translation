id: JOS.21.34
reference: Joshua 21:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/מִשְׁפְּח֣וֹת בְּנֵֽי מְרָרִי֮ הַ/לְוִיִּ֣ם הַ/נּוֹתָרִים֒ מֵ/אֵת֙ מַטֵּ֣ה זְבוּלֻ֔ן אֶֽת יָקְנְעָ֖ם וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת קַרְתָּ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
translation:
  language: te
  text: మిగిలిన లేవీయులైన మెరారీ కుమారుల కుటుంబాలకు జెబూలూను గోత్రం నుండి యొక్ణెయామును దాని చుట్టుపక్కల మేతభూములతో, కర్తాను దాని చుట్టుపక్కల మేతభూములతో ఇచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מִשְׁפְּח֣וֹת
  choice: వంశాలకు
  rationale: מִשְׁפָּחוֹת అనేది గోత్రంలోని కుటుంబాధారిత ఉపవిభాగాలను సూచిస్తుంది. ఆధునిక తెలుగులో ఈ సందర్భానికి ‘వంశాలు’ సహజంగా, స్పష్టంగా ఉంటుంది; לְ దత్తార్థాన్ని ‘వంశాలకు’ తెలియజేస్తుంది.
- source_word: בְּנֵֽי מְרָרִי
  choice: మెరారీ సంతతి
  rationale: ఇక్కడ ‘కుమారులు’ అనేది ప్రత్యక్ష కుమారులను మాత్రమే కాక వంశస్థులను సూచించే వంశావళి ప్రయోగం. అందువల్ల ‘సంతతి’ భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: הַ/לְוִיִּ֣ם הַ/נּוֹתָרִים
  choice: మిగిలిన లేవీయులు
  rationale: మునుపటి పంపిణీలలో ఇంకా పట్టణాలు కేటాయించబడని లేవీయుల సమూహాన్ని ఈ పదబంధం సూచిస్తుంది.
- source_word: מֵ/אֵת֙ מַטֵּ֣ה זְבוּלֻ֔ן
  choice: జెబూలూను గోత్రం నుండి
  rationale: భూభాగ కేటాయింపు సందర్భంలో מַטֶּה అంటే ‘గోత్రం’; מֵאֵת కేటాయింపు ఏ గోత్రం నుండి వచ్చిందో సూచిస్తుంది.
- source_word: יָקְנְעָ֖ם
  choice: యొక్నెయాము
  rationale: హీబ్రూ స్థలనామ ధ్వనులను తెలుగులో గుర్తించదగిన విధంగా లిప్యంతరీకరించింది.
- source_word: מִגְרָשֶׁ֑/הָ
  choice: దాని పచ్చిక భూములు
  rationale: מִגְרָשׁ పట్టణం చుట్టూ పశువుల మేతకు, సామూహిక వినియోగానికి ఉన్న బహిరంగ భూమిని సూచిస్తుంది. ‘పచ్చిక భూములు’ ఈ సందర్భార్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: קַרְתָּ֖ה
  choice: కర్తా
  rationale: హీబ్రూ స్థలనామాన్ని దాని వ్యంజన, అచ్చుల రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וְ/אֶת ... וְ/אֶת
  choice: తో సహా ... తో సహా
  rationale: ప్రతి పట్టణంతో పాటు దాని చుట్టుపక్కల పచ్చిక భూములు కూడా కేటాయించబడ్డాయని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కానీ సాధారణ పాఠకునికి సులభమైన శైలి వాడబడింది. హీబ్రూ వాక్యం మునుపటి వచనంలోని కేటాయింపు క్రియను కొనసాగిస్తున్నందున, తెలుగులో సంపూర్ణ వాక్యంగా ఉండేందుకు ‘ఇచ్చారు’ సందర్భానుసారంగా పూరించబడింది. ఇంగ్లీషు సంప్రదింపుల పాఠంలోని [a] సూచిక ‘మెరారీ’ వద్ద ఉండి, గమనిక మాత్రం ‘Kartah/Kartha’ ఇంగ్లీషు అక్షరక్రమాన్ని చర్చిస్తుంది; అది తెలుగు అనువాదానికి సంబంధించిన మూలపాఠ భేదం కానందున ఇక్కడ గమనికగా చేర్చలేదు.
