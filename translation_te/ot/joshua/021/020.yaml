source:
  edition: WLC
  text: וּ/לְ/מִשְׁפְּח֤וֹת בְּנֵֽי קְהָת֙ הַ/לְוִיִּ֔ם הַ/נּוֹתָרִ֖ים מִ/בְּנֵ֣י קְהָ֑ת וַֽ/יְהִי֙ עָרֵ֣י גֽוֹרָלָ֔/ם מִ/מַּטֵּ֖ה אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
translation:
  language: te
  text: కెహాతు కుమారుల కుటుంబాలకు, అంటే కెహాతు కుమారులలో మిగిలిన లేవీయులకు, చీటి వంతుగా కేటాయించబడిన పట్టణాలు ఎఫ్రాయిము గోత్రం నుండి ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వారి చీటి వంతు పట్టణాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת
  choice: వంశాలలో
  rationale: ల ఉపసర్గ ఇక్కడ పంపిణీకి సంబంధించిన వర్గాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశాలలో ... వారికి’ అనే నిర్మాణం సహజంగా ఉండి, కుటుంబ వర్గాల భావాన్ని నిలుపుతుంది.
- source_word: בְּנֵי קְהָת
  choice: కెహాతు కుమారులు
  rationale: ఇది వంశావళి సంబంధమైన స్థిర ప్రయోగం. ‘కుమారులు’ మూలంలోని రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది సంతతివారినీ సూచిస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: కెహాతీయులు లేవి గోత్రానికి చెందినవారని తెలిపే సూటి జాతి/గోత్ర నామం.
- source_word: הַנּוֹתָרִים
  choice: మిగిలిన
  rationale: మునుపటి కేటాయింపుల తరువాత మిగిలిన వారిని సూచించే అసంపూర్ణ క్రియారూప భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִבְּנֵי קְהָת
  choice: కెహాతు కుమారుల్లో
  rationale: 'מן యొక్క భాగవాచక భావాన్ని ‘లో/ల్లో’ ద్వారా తెలియజేస్తుంది: విస్తృత కెహాతీయ వంశంలోని ఒక మిగిలిన వర్గం.'
- source_word: וַיְהִי
  choice: వచ్చాయి
  rationale: ఈ కేటాయింపు సూత్రంలో היה ఉనికి/లభ్యతను తెలిపే సంధానక్రియ. తెలుగులో ‘నుండి వచ్చాయి’ సహజంగా మూలాధారాన్ని తెలిపుతుంది.
- source_word: עָרֵי גוֹרָלָם
  choice: చీటి ద్వారా లభించిన పట్టణాలు
  rationale: גורל అనేది చీటి వేయడం ద్వారా నిర్ణయించిన వంతు లేదా కేటాయింపును సూచిస్తుంది. హీబ్రూ నామవాచక ప్రయోగాన్ని తెలుగులో స్పష్టమైన, సహజమైన రూపంలో అందిస్తుంది.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: ఎఫ్రాయిము గోత్రం నుండి
  rationale: గోత్రాల జాబితా సందర్భంలో מַטֶּה అంటే ‘గోత్రం’; מן మూలం లేదా ఏ గోత్రం నుంచి కేటాయించబడిందో సూచిస్తుంది.
