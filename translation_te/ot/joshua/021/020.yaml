translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వంశావళి భాషను నిలుపుతూ, ‘చీటి ద్వారా లభించిన’ అని גורל యొక్క కేటాయింపు భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలిపాం.
