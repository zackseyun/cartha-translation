translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లేవీయుల పట్టణాల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. మూలంలోని క్రియ ఈ వచనంలో వ్యక్తంగా లేకపోయినా, ముందటి వాక్య నిర్మాణం నుంచి అర్థమయ్యే ‘ఇచ్చారు’ను తెలుగులో వాక్యపూర్ణత కోసం చేర్చాం. పాదసూచిక గుర్తును సంబంధిత పదబంధం తరువాత ఉంచాం.
