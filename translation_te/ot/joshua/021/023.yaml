  text: 'And from the tribe of Dan: Eltekeh with its pasturelands[a], and Gibbethon with its pasturelands.'
translation:
  language: te
  text: 'దాను గోత్రం నుండి: ఎల్తెకెను దాని పచ్చిక బయళ్లతో[a] సహా, గిబ్బెతోనును దాని పచ్చిక బయళ్లతో సహా.'
  philosophy: optimal-equivalence
  footnotes:
