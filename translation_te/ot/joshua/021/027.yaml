source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י גֵרְשׁוֹן֮ מִ/מִּשְׁפְּחֹ֣ת הַ/לְוִיִּם֒ מֵ/חֲצִ֞י מַטֵּ֣ה מְנַשֶּׁ֗ה אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת גלון בַּ/בָּשָׁן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶֽת בְּעֶשְׁתְּרָ֖ה וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
translation:
  language: te
  text: లేవీయుల వంశాలకు చెందిన గేర్షోను కుమారులకు మనష్షే అర్ధగోత్రం నుండి, చంపిన వ్యక్తికి ఆశ్రయపట్టణమైన బాషానులోని గోలానును దాని పచ్చికబయళ్లతో సహా, బెయెష్టెరాను[a] దాని పచ్చికబయళ్లతో సహా ఇచ్చారు—మొత్తం రెండు పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘బెయెష్టెరా’; 1 దినవృత్తాంతాలు 6:71లో ‘అష్టారోతు’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: గేర్షోను కుమారులకు
  rationale: בני అనే మూలరూపంలోని ‘కుమారులు’ భావాన్ని నిలుపుతూ, వంశపరమైన సందర్భంలో సహజంగా ఉంది.
- source_word: מִ/מִּשְׁפְּחֹת הַ/לְוִיִּם
  choice: లేవీయుల వంశాలలో
  rationale: מִשְׁפָּחוֹת ఇక్కడ లేవీయులలోని బంధుత్వ ఆధారిత వంశ విభాగాలను సూచిస్తుంది.
- source_word: מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం నుండి
  rationale: యెహోషువలో భూభాగాల పంపిణీ సందర్భంలో מַטֶּהకు ‘గోత్రం’ సరైన పదం; ‘అర్ధగోత్రం’ స్థిరమైన, సంక్షిప్తమైన రూపం.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: చంపినవానికి ఆశ్రయపట్టణమైన
  rationale: న్యాయపరమైన ఈ పదబంధంలో הָרֹצֵחַ ఉద్దేశపూర్వక హంతకుడని తప్పనిసరిగా నిర్ధారించదు; ‘చంపినవాడు’ ఆ విస్తృతతను కాపాడుతుంది. ‘ఆశ్రయపట్టణం’ מִקְלָט భావాన్ని సహజంగా అందిస్తుంది.
- source_word: גלון בַּבָּשָׁן
  choice: బాషానులోని గోలాను
  rationale: రెండు స్థలనామాలను తెలుగు ధ్వన్యంతరీకరణలో ఇచ్చి, వాటి స్థాన సంబంధాన్ని స్పష్టంగా ఉంచింది.
- source_word: מִגְרָשֶׁהָ
  choice: దాని పచ్చికబయళ్లతో సహా
  rationale: లేవీయ పట్టణాల చుట్టూ పశువుల మేత మొదలైన అవసరాలకు ఉంచిన బహిరంగ భూమిని సూచించే מִגְרָשׁ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּעֶשְׁתְּרָה
  choice: బెయెష్టెరా
  rationale: మసొరెటిక్ పాఠంలోని పేరును సమాంతర వచనంతో సమన్వయపరచకుండా ప్రధాన పాఠంలో ధ్వన్యంతరీకరించింది.
- source_word: עָרִים שְׁתָּיִם
  choice: మొత్తం రెండు పట్టణాలు
  rationale: జాబితా చివరి లెక్కను తెలుగులో సహజంగా, స్పష్టంగా ముగిస్తుంది.
- source_word: implicit verbal sense in allotment list
  choice: ఇచ్చారు
  rationale: ఈ వచనంలో సమాపక క్రియ ప్రత్యక్షంగా లేకపోయినా, చుట్టుపక్కల ఉన్న పంపిణీ సూత్రం నుంచి క్రియాభావం లభిస్తుంది.
theological_decisions:
- issue: הָרֹצֵחַ యొక్క న్యాయపరమైన పరిధి
  choice: చంపినవాడు
  alternative: హంతకుడు
  rationale: ఆశ్రయపట్టణాల సందర్భంలో ఈ పదం అనుకోకుండా చంపిన వ్యక్తినీ సూచించగలదు. ‘హంతకుడు’ ఉద్దేశపూర్వక హత్య భావాన్ని అనవసరంగా బలపరచవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని వంశపరమైన నిర్మాణం, న్యాయపరమైన అస్పష్టత, మసొరెటిక్ స్థలనామం నిలుపబడ్డాయి. ప్రధాన పాఠంలోని [a] సూచిక పాదటిప్పణితో సరిపోలుతుంది.
