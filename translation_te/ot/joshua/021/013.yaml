source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֣ן הַ/כֹּהֵ֗ן נָֽתְנוּ֙ אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת חֶבְר֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
translation:
  language: te
  text: యాజకుడైన అహరోను కుమారులకు, ఒకరిని చంపినవానికి ఆశ్రయనగరమైన హెబ్రోనును[a] దాని పచ్చిక బయళ్లతో సహా, లిబ్నాను దాని పచ్చిక బయళ్లతో సహా ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నరహంతకునికి ఆశ్రయనగరమైన హెబ్రోను.” ఇక్కడి హీబ్రూ పదం ఒకరి మరణానికి కారణమైన వ్యక్తిని సూచించే న్యాయపరమైన పదం; ఆశ్రయనగరానికి పారిపోగల అతడు తప్పనిసరిగా ముందాలోచనతో హత్య చేశాడని ఇది సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను కుమారులకు
  rationale: లְ పరోక్ష కర్మను సూచిస్తుంది; ‘కుమారులు’ అనే రూపం అహరోను యాజక వంశాన్ని సందర్భానుసారంగా తెలియజేస్తూ హీబ్రూ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: נָתְנוּ
  choice: ఇచ్చారు
  rationale: נתן యొక్క సాధారణ అర్థమైన ‘ఇవ్వు’ను నిలుపుతూ, పట్టణాల కేటాయింపు సందర్భంలో సహజంగా ఉంది.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: హంతకుడు ఆశ్రయం పొందే నగరం
  rationale: ఇది చంపిన వ్యక్తి పారిపోయి ఆశ్రయం పొందేందుకు నియమించిన నగరాన్ని సూచించే న్యాయపరమైన పదబంధం. ‘ఆశ్రయ నగరం’ కంటే విస్తరించిన ఈ రూపం సాధారణ పాఠకుడికి సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; ఉద్దేశపూర్వక హత్య అని మాత్రం నిర్ణయించదు.
- source_word: חֶבְרוֹן
  choice: హెబ్రోను
  rationale: హీబ్రూ స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చిక బయళ్లు
  rationale: పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ మేతభూములను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పచ్చిక బయళ్లు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לִבְנָה
  choice: లిబ్నా
  rationale: హీబ్రూ స్థలనామానికి నేర లిప్యంతరీకరణ.
theological_decisions:
- issue: הָרֹצֵחַ అనే పదం ఉద్దేశపూర్వక హంతకుడినే సూచిస్తుందా?
  choice: హంతకుడు
  alternative: చంపినవాడు / నరహంతకుడు
  rationale: ఈ న్యాయ సందర్భంలో పదం ఒకరి మరణానికి కారణమై ఆశ్రయ నగరానికి పారిపోయే వ్యక్తిని సూచించగలదు; అతడు ముందాలోచనతో హత్య చేశాడని వచనం తానే తేల్చదు. అందువల్ల పాదటిప్పణితో న్యాయపరమైన విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, ‘ఆశ్రయం పొందే నగరం’ అనే సహజమైన వివరణాత్మక నిర్మాణం వాడబడింది.
