revisions:
- from: యాజకుడైన అహరోను కుమారులకు, హంతకుడు ఆశ్రయం పొందే నగరమైన హెబ్రోనును[a] దాని పచ్చిక బయళ్లతో సహా, లిబ్నాను దాని పచ్చిక బయళ్లతో సహా ఇచ్చారు.
  to: యాజకుడైన అహరోను కుమారులకు, ఒకరిని చంపినవానికి ఆశ్రయనగరమైన హెబ్రోనును[a] దాని పచ్చిక బయళ్లతో సహా, లిబ్నాను దాని పచ్చిక బయళ్లతో సహా ఇచ్చారు.
