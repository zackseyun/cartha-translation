lexical_decisions:
- source_word: עֲנָתוֹת
  choice: అనాతోతు
  rationale: ఇది స్థలనామం; హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: מִגְרָשֶׁהָ
  choice: దాని పచ్చిక బయళ్లు
  rationale: మִגְרָשׁ అనేది పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని, సాధారణంగా పశువులను మేపడానికి ఉపయోగించే భూమిని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో భూవినియోగ భావాన్ని తెలియజేయడానికి ఈ పదబంధం ఎంచుకోబడింది; స్త్రీలింగ ఏకవచన ప్రత్యయం ప్రతి పట్టణాన్ని సూచిస్తూ ‘దాని’గా అనువదించబడింది.
- source_word: עַלְמוֹן
  choice: అల్మోను
  rationale: ఇది స్థలనామం; హీబ్రూ రూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: עָרִים אַרְבַּע
  choice: మొత్తం నాలుగు పట్టణాలు
  rationale: జాబితాలోని స్థలాల సంఖ్యను సంగ్రహించే సరళమైన సంఖ్యావాచక పదబంధం. సందర్భానికి సహజంగా ఉండేందుకు ‘మొత్తం’ చేర్చబడింది.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: ‘ను’ విభక్తి మరియు ‘తో సహా’ అనే సమన్వయ నిర్మాణం
  rationale: పునరావృతమయ్యే ప్రత్యక్ష కర్మ సూచిక אֶת‌కు తెలుగులో స్వతంత్ర పదసమానం లేదు; కర్మవిభక్తి మరియు జాబితా నిర్మాణం ద్వారా దాని వ్యాకరణ విధి వ్యక్తమైంది.
