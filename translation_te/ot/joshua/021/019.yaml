  language: en
  yaml_path: translation/ot/joshua/021/019.yaml
  text: All the cities of the sons of Aaron[a], the priests, were thirteen cities with their pasturelands.
translation:
  language: te
  text: యాజకులైన అహరోను కుమారుల పట్టణాలన్నీ, వాటి పచ్చికబయళ్లతో కూడిన పదమూడు పట్టణాలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: పట్టణాలన్నీ
  rationale: మొత్తం పట్టణాలను సూచించే హెబ్రీ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בְנֵי אַהֲרֹן
  choice: అహరోను కుమారులు
  rationale: యాజక వంశపరంపరను సూచించే మూలంలోని కుటుంబపదాన్ని వ్యాఖ్యానాత్మకంగా ‘వారసులు’ అని మార్చకుండా నిలుపుతుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులైన
  rationale: అహరోను కుమారులను వివరణాత్మకంగా గుర్తించే appositional పదాన్ని తెలుగులో సహజంగా విశేషణ రూపంలో అందిస్తుంది.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עָרִים
  choice: పదమూడు
  rationale: ముందే ‘పట్టణాలన్నీ’ అని ఉన్నందున, తెలుగులో అనవసర పునరుక్తిని నివారిస్తూ మొత్తం సంఖ్యను స్పష్టంగా తెలుపుతుంది.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: వాటి పచ్చికబయళ్లతో కలిపి
  rationale: లేవీయ పట్టణాల చుట్టూ పశువుల మేతకు ఉద్దేశించిన బహిరంగ భూములను సూచిస్తుంది; సంధికారకమైన וְను ఈ లెక్కలో భాగస్వామ్యాన్ని తెలిపే సహజ తెలుగు పదబంధంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన జాబితా-సారాంశ శైలి. మూలంలోని క్రియలేని సంఖ్యా సారాంశ నిర్మాణాన్ని తెలుగులో సహజంగా నిలిపింది.
