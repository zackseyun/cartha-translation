source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י אֶת עִ֣יר מִקְלַ֣ט הָֽ/רֹצֵ֗חַ אֶת קֶ֨דֶשׁ בַּ/גָּלִ֤יל וְ/אֶת מִגְרָשֶׁ֨/הָ֙ וְ/אֶת חַמֹּ֥ת דֹּאר֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת קַרְתָּ֖ן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שָׁלֹֽשׁ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
translation:
  language: te
  text: 'నఫ్తాలి గోత్రం నుండి: చంపినవానికి ఆశ్రయపట్టణమైన గలిలయలోని కెదెషు[a], దాని పచ్చిక బయళ్లతో పాటు; హమ్మోత్-దోరు[b], దాని పచ్చిక బయళ్లతో పాటు; కర్తాను, దాని పచ్చిక బయళ్లతో పాటు—మూడు పట్టణాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చంపినవానికి ఆశ్రయపట్టణం.” ఇక్కడి హెబ్రీ పదం ఒకరిని చంపిన వ్యక్తిని సూచిస్తుంది; ఆశ్రయపట్టణాల న్యాయసందర్భంలో అతడు తప్పనిసరిగా ఉద్దేశపూర్వక హంతకుడని అర్థం కాదు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ పాఠంలో “హమ్మోత్-దోరు” అని ఉంది; కొన్ని సంప్రదాయాలు ఈ స్థలాన్ని “హమ్మాతు”తో గుర్తిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: నఫ్తాలి గోత్రం నుండి
  rationale: గోత్రాల భూవిభజన సందర్భంలో מַטֶּה అంటే అక్షరార్థమైన ‘దండం’ కాదు, ‘గోత్రం’. సంధానార్థక וּ మరియు ‘నుండి’ అనే מִן భావాన్ని సహజమైన తెలుగులో కలిపి ఇచ్చాం.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: చంపినవానికి ఆశ్రయపట్టణం
  rationale: עִיר מִקְלַט అనేది న్యాయపరమైన ‘ఆశ్రయపట్టణం’. הָרֹצֵחַ చంపిన వ్యక్తిని సూచిస్తుంది; ఈ ఆశ్రయధర్మ సందర్భంలో ముందే ఉద్దేశపూర్వక హంతకుడని తీర్పు చెప్పకుండా ‘చంపినవాడు’ అని అనువదించడం మూలంలోని న్యాయపరమైన అనిశ్చితిని కాపాడుతుంది.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: గలిలయలోని కెదెషు
  rationale: కֶדֶשׁ స్థలనామం కావడంతో తెలుగు ధ్వన్యనుకరణలో ‘కెదెషు’గా ఇచ్చాం; בַּגָּלִיל ప్రాంతాన్ని సూచిస్తున్నందున ‘గలిలయలోని’ సహజంగా ఉంది.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చిక బయళ్లు
  rationale: מִגְרָשׁ పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని, సాధారణంగా పశువుల మేతభూమిని సూచిస్తుంది. ఆధునిక పాఠకులకు స్పష్టంగా ఉండేందుకు ‘పచ్చిక బయళ్లు’ ఎంచుకున్నాం.
- source_word: חַמֹּת דֹּאר
  choice: హమ్మోత్-దోరు
  rationale: మసొరా పాఠంలో ఉన్న సంయుక్త స్థలనామాన్ని హైఫన్‌తో ధ్వన్యనుకరించాం; దానిని ‘హమ్మాతు’గా సమీకరించలేదు.
- source_word: קַרְתָּן
  choice: కర్తాను
  rationale: హెబ్రీ రూపాన్ని అనుసరించి స్థలనామాన్ని నేరుగా తెలుగు లిపిలో ధ్వన్యనుకరించాం.
- source_word: עָרִים שָׁלֹשׁ
  choice: మొత్తం మూడు పట్టణాలు
  rationale: హెబ్రీ చివరి సారాంశాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం; జాబితా మొత్తం అని స్పష్టం చేయడానికి ‘మొత్తం’ చేర్చాం.
theological_decisions:
- issue: הָרֹצֵחַ అనే పదానికి నైతిక/న్యాయపరమైన నిర్దిష్టత
  choice: చంపినవాడు
  alternative: హంతకుడు
  rationale: ‘హంతకుడు’ అనే తెలుగు పదం ఉద్దేశపూర్వక నేరాన్ని ముందుగానే బలంగా సూచించవచ్చు. ఆశ్రయపట్టణాల న్యాయసందర్భంలో దోష స్వరూపం ఇంకా విచారణకు లోబడవచ్చు కాబట్టి తటస్థమైన ‘చంపినవాడు’ మూలంలోని ఉద్రిక్తతను మెరుగ్గా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పట్టణాల జాబితా శైలిని సంక్షిప్తంగా మరియు గంభీరంగా ఉంచాం. మూలపాఠంలో ప్రధాన క్రియ స్పష్టంగా లేకపోయినా, ముందున్న జాబితా సందర్భానికి అనుగుణంగా తెలుగులో వాక్యం పూర్తవడానికి ‘ఇచ్చారు’ చేర్చాం. అన్ని పాదటిప్పణి సూచికలు సంబంధిత పదాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
