  text: לֹֽא נָפַ֣ל דָּבָ֔ר מִ/כֹּל֙ הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל בֵּ֣ית יִשְׂרָאֵ֑ל הַ/כֹּ֖ל בָּֽא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/045.yaml
  text: Not one word failed from all the good word that Yahweh had spoken to the house of Israel[a]; all of it came to pass.
translation:
  language: te
  text: యాహ్వే ఇశ్రాయేలు ఇంటివారికి చెప్పిన మంచి మాటలన్నిటిలో ఒక్క మాట కూడా విఫలం కాలేదు[a]; అంతా నెరవేరింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ఇశ్రాయేలు ఇంటివారికి చేసిన మంచి వాగ్దానాలన్నిటిలో ఒక్క వాగ్దానం కూడా విఫలం కాలేదు.”
    reason: దָּבָר అనే పదానికి ఈ సందర్భంలో ‘వాగ్దానం’ అనే అర్థం కూడా సాధ్యమని చూపే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  choice: ఒక్క మాట కూడా విఫలం కాలేదు
  rationale: నָפַל అక్షరార్థంగా ‘పడింది’ అయినా, דָּבָרతో కూడిన ఈ సందర్భంలో చెప్పబడిన మాట నెరవేరకుండా పోవడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘విఫలం కాలేదు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִכֹּל הַדָּבָר הַטּוֹב
  choice: మంచి మాటలన్నిటిలో
  rationale: హీబ్రూలోని ఏకవచన సమష్టి భావాన్ని తెలుగులో సహజంగా బహువచనంగా వ్యక్తం చేశాం. ‘మాట’ అనే పదం דָּבָר మరియు דִּבֶּר మధ్యనున్న వాక్కు సంబంధాన్ని నిలుపుతుంది; ‘వాగ్దానం’ అనేది సందర్భసమ్మతమైనా మరింత వ్యాఖ్యానాత్మకం.
- source_word: אֲשֶׁר דִּבֶּר
  choice: చెప్పిన
  rationale: ముందుగా పలికిన దైవవాక్యాన్ని సూచించే perfect క్రియను తెలుగులో సహజమైన భూతకాల కృదంతంతో అందించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారితో
  rationale: בֵּית יִשְׂרָאֵל అనే సమష్టి, నిబంధనాత్మక వ్యక్తీకరణను కేవలం ‘ఇశ్రాయేలు’గా కుదించకుండా, ఆధునిక తెలుగులో సహజంగా ‘ఇశ్రాయేలు ఇంటివారు’ అని ఇచ్చాం. דִּבֶּר אֶל అనే ప్రయోగానికి ‘తో చెప్పిన’ సహజంగా సరిపోతుంది.
- source_word: הַכֹּל בָּא
  choice: అంతా నెరవేరింది
  rationale: בָּא అక్షరార్థంగా ‘వచ్చింది’; ఇక్కడ చెప్పినదంతా కార్యరూపం దాల్చిందనే నెరవేర్పు భావం ఉంది. ‘అంతా నెరవేరింది’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; అందువల్ల ‘ప్రభువు’ అనే బిరుదుతో దానిని భర్తీ చేయలేదు. తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ప్రధాన పాఠంలో వాడాం.
- issue: דָּבָרను ‘మాట’గా లేదా ‘వాగ్దానం’గా అనువదించడం
  choice: మాట
  alternative: వాగ్దానం
  rationale: ‘మాట’ మూలంలోని דָּבָר—דִּבֶּר పదసంబంధాన్ని కాపాడి, వాక్యాంతంలోని నెరవేర్పు ద్వారా వాగ్దాన భావం బయటపడేలా చేస్తుంది. ‘వాగ్దానం’ సరైన సందర్భార్థమే అయినా కొంత వ్యాఖ్యానాత్మకం కాబట్టి పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని సంపూర్ణతను సూచించే పునరుక్తిని ‘మాటలన్నిటిలో ఒక్క మాట కూడా’ మరియు ‘అంతా’ ద్వారా నిలిపాం; పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో ఉంది.
