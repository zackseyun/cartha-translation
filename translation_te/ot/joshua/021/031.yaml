  yaml_path: translation/ot/joshua/021/031.yaml
  text: Helkath with its pasturelands, and Rehob with its pasturelands—four cities.
translation:
  language: te
  text: హెల్కాతు దాని పచ్చికబయళ్లతో, రెహోబు దాని పచ్చికబయళ్లతో—మొత్తం నాలుగు పట్టణాలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקָת
  choice: హెల్కాతు
  rationale: స్థల నామాన్ని అనువదించకుండా, హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: מִגְרָשֶׁהָ
  choice: దాని పచ్చికబయళ్లు
  rationale: పట్టణానికి అనుబంధంగా పశువుల మేత మొదలైన సామూహిక అవసరాలకు ఉపయోగించే బయటి భూమిని సూచిస్తుంది; లేవీయుల పట్టణాల సందర్భంలో ‘పచ్చికబయళ్లు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: רְחֹב
  choice: రెహోబు
  rationale: స్థల నామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: עָרִים אַרְבַּע
  choice: మొత్తం నాలుగు పట్టణాలు
  rationale: ఈ వచనంలోను ముందటి వచనంలోను పేర్కొన్న పట్టణాల మొత్తం సంఖ్యను సూచించే సంక్షిప్త గణన; ‘మొత్తం’ తెలుగులో ఈ సంగ్రహ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: …ను, దాని …ను, …ను, దాని …ను
  rationale: పునరావృతమైన కర్మ సూచకాన్ని తెలుగులో ‘ను’ విభక్తితో ప్రతిబింబించాం; ప్రతి పచ్చికబయలు సంబంధిత పట్టణానికి చెందినదని ‘దాని’ స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని నిలుపుతూ సహజమైన వాక్యంగా రూపొందించాం. మూలపాఠంలో క్రియ లేకపోయినా ఇది ముందటి వాక్యానికి కొనసాగింపు; స్వతంత్ర వచనంగా చదవడానికి సందర్భం నుంచి గ్రహించబడే ‘ఇచ్చారు’ను చేర్చాం.
