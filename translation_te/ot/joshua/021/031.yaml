  text: אֶת חֶלְקָת֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת רְחֹ֖ב וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־׃ס
