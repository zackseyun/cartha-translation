  yaml_path: translation/ot/joshua/021/035.yaml
  text: Dimnah with its pasturelands[b][a], and Nahalal with its pasturelands—four cities.
translation:
  language: te
  text: దిమ్నా దాని పచ్చిక బయళ్లతో సహా[b][a], నహలాల్ దాని పచ్చిక బయళ్లతో సహా—నాలుగు పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ భాగంలో కొన్ని పట్టణాల పేర్లను చేర్చడం, వాటి క్రమం విషయంలో హీబ్రూ ప్రతులు, ప్రాచీన అనువాదాల మధ్య తేడాలున్నాయి; 1 దినవృత్తాంతాలు 6:62లోని సమాంతర జాబితాతో పోల్చండి [కొన్ని ఆంగ్ల బైబిళ్లలో 6:77].
    reason: textual_variant
  - marker: b
    text: లేదా, ‘దాని ఉమ్మడి భూములతో సహా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְנָה
  choice: దిమ్నా
  rationale: స్థలపేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: מִגְרָשֶׁהָ
  choice: దాని పచ్చిక బయళ్లతో సహా
  rationale: מִגְרָשׁ అనేది పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని, ముఖ్యంగా పశువులు మేసే భూమిని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా ‘పచ్చిక బయళ్లు’ అని ఇచ్చాం; స్త్రీలింగ ఏకవచన ప్రత్యయం ప్రతి పట్టణాన్ని సూచించే ‘దాని’గా అనువదించాం.
- source_word: נַהֲלָל
  choice: నహలాల్
  rationale: స్థలపేరును హీబ్రూ రూపానికి సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: עָרִים אַרְבַּע
  choice: మొత్తం నాలుగు పట్టణాలు
  rationale: జాబితా చివర వచ్చే సంఖ్యా సారాంశాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలిపేందుకు ‘మొత్తం’ చేర్చాం; עָרִיםకు సందర్భానుగుణంగా ‘పట్టణాలు’ వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. పట్టణాల జాబితా స్వరూపాన్ని నిలుపుతూ విరామచిహ్నాలతో రెండు పేర్లను వేరు చేశాం. ప్రధాన పాఠ్యంలో ప్రతి పాదసూచిక గుర్తు కనిపించేలా [a][b] చేర్చాం.
