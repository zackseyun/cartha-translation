  yaml_path: translation/ot/joshua/019/011.yaml
  text: And their border went up westward to Maralah, and touched Dabbesheth, and touched the wadi that is opposite Jokneam.
translation:
  language: te
  text: వారి సరిహద్దు పడమటి వైపున మరాలాకు ఎగబాకి, దబ్బెషెతును తాకి, యొక్నెయాముకు ఎదురుగా ఉన్న వాగును తాకింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: ఎగబాకి
  rationale: సరిహద్దు భౌగోళికంగా పైకి సాగడాన్ని సూచించే עלה భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַיָּמָּה
  choice: పడమటి వైపున
  rationale: అక్షరార్థంగా ‘సముద్రం వైపు’; ఇశ్రాయేలు భౌగోళిక సందర్భంలో ఇది పడమటి దిశను సూచిస్తుంది.
- source_word: וּפָגַע
  choice: తాకి / తాకింది
  rationale: సరిహద్దు ఒక ప్రదేశాన్ని లేదా భౌగోళిక లక్షణాన్ని చేరి తాకడాన్ని సూచించే פגע పదానికి అనుగుణం; మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: הַנַּחַל
  choice: వాగును
  rationale: נחל అనేది ప్రవాహం లేదా అది ప్రవహించే లోయను సూచించగలదు; ఈ సరిహద్దు వర్ణనలో సాధారణంగా అర్థమయ్యే ‘వాగు’ను ఎంచుకున్నాం.
- source_word: עַל־פְּנֵי
  choice: ఎదురుగా ఉన్న
  rationale: ఇక్కడ స్థలసంబంధమైన ‘ఎదురుగా/ముఖంగా’ అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భౌగోళిక సరిహద్దు వర్ణనకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మరాలా, దబ్బెషెతు, యొక్నెయాము అనే స్థలనామాలు ధ్వన్యనుసారంగా లిప్యంతరీకరించబడ్డాయి.
