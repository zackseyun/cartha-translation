  source_fidelity: 'హీబ్రూ వచనంలోని సరిహద్దు క్రమవర్ణనను అనువాదం విశ్వసనీయంగా ప్రతిబింబిస్తుంది: పడమటి దిశగా పైకి సాగడం, మరాలా, దబ్బెషెతు, యొక్నెయాము ఎదురుగా ఉన్న నఖలు/వాగు వద్దకు చేరడం అనే క్రమం నిలిచింది. פגע యొక్క పునరావృత్తి ‘తాకి ... తాకింది’ ద్వారా తగిన విధంగా కనిపిస్తుంది. נחל‌కు సందర్భానుకూలమైన ‘వాగు’ సరైన ఎంపిక.'
