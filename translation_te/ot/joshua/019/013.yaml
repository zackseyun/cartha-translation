  text: וּ/מִ/שָּׁ֤ם עָבַר֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה גִּתָּ֥/ה חֵ֖פֶר עִתָּ֣ה קָצִ֑ין וְ/יָצָ֛א רִמּ֥וֹן הַ/מְּתֹאָ֖ר הַ/נֵּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/013.yaml
  text: From there it passed eastward[a], toward the sunrise, to Gath-hepher, to Eth-kazin, and went out to Rimmon[c][b], which extends to Neah.
translation:
  language: te
  text: అక్కడి నుండి సరిహద్దు తూర్పువైపుగా[a], సూర్యోదయ దిశగా గత్-హేఫెరుకు, ఏత్-కాజీనుకు[b] వెళ్లి, రిమ్మోనుకు చేరి, నేయా వరకు విస్తరించింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడి నుండి అది తూర్పుకు వెళ్లింది.” హీబ్రూలో అక్షరార్థంగా “తూర్పువైపుగా, సూర్యోదయ దిశగా” అనే రెండు దిశాసూచక పదాలు ఉన్నాయి; అవి బహుశా ఉద్ఘాటన కోసం వాడబడ్డాయి.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదరూపాన్ని “ఏత్-కాజీను” అని లేదా “ఇత్తా-కాజీను” అని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ఈ వాక్యభాగంలోని హీబ్రూ క్లిష్టంగా ఉంది. దాన్ని అక్షరార్థానికి దగ్గరగా “రిమ్మోను, గుర్తించబడినది, నేయా” లేదా ఇలాంటి రీతిలో చదవవచ్చు. చాలామంది దీన్ని సరిహద్దు రిమ్మోను నుండి నేయా వరకు విస్తరించిందని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: అక్కడి నుండి
  rationale: సరిహద్దు వర్ణనలో వరుసగా తదుపరి స్థలానికి సాగడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఆరంభంలోని సంధికారకాన్ని ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: עָבַר
  choice: సరిహద్దు ... వెళ్లి
  rationale: భూసరిహద్దు ఒక స్థానం నుండి మరొక స్థానానికి సాగడాన్ని సూచించే సందర్భోచిత అర్థాన్ని ఇస్తుంది; తెలుగులో అంతర్నిహిత కర్త అయిన ‘సరిహద్దు’ను స్పష్టంచేసింది.
- source_word: קֵדְמָה מִזְרָחָה
  choice: తూర్పువైపుగా, సూర్యోదయ దిశగా
  rationale: హీబ్రూలోని రెండు దిశాసూచక పదాలనూ నిలుపుతూ, వాటి ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גִּתָּה חֵפֶר
  choice: గత్-హేఫెరు
  rationale: సంయుక్త స్థలనామాన్ని మూల ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేసింది.
- source_word: עִתָּה קָצִין
  choice: ఏత్-కాజీను
  rationale: మసొరెటిక్ పదవిభజనను అనుసరించి దీనిని ఒకే స్థలనామంగా తీసుకుంది; పాఠరూపం అనిశ్చితమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְיָצָא
  choice: చేరి
  rationale: సరిహద్దు వర్ణనల్లో ఈ క్రియ తదుపరి బిందువుకు వెళ్లి చేరడాన్ని సూచించగలదు; తెలుగు వాక్యప్రవాహంలో ఇది సహజంగా ఉంటుంది.
- source_word: רִמּוֹן
  choice: రిమ్మోను
  rationale: స్థలనామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: הַמְּתֹאָר
  choice: విస్తరించింది
  rationale: కష్టమైన ఈ రూపాన్ని సరిహద్దు రేఖ నేయా వరకు సాగిందనే సందర్భోచిత భావంతో అనువదించింది; మరింత అక్షరార్థమైన అవకాశాన్ని పాదసూచికలో తెలిపింది.
- source_word: הַנֵּעָה
  choice: నేయా వరకు
  rationale: ‘నేయా’ను స్థలనామంగా తీసుకొని, ముందున్న సరిహద్దు విస్తరణకు గమ్యస్థానంగా వ్యక్తం చేసింది.
