translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. సరిహద్దు వర్ణన స్పష్టత కోసం ‘సరిహద్దు’ అనే అంతర్నిహిత కర్తను తెలిపింది. స్థలనామాలకు ఏకరీతి తెలుగు లిప్యంతరీకరణను పాటించింది; మూలంలోని క్లిష్టతను పాదసూచికలో నిలిపింది.
