  language: en
  yaml_path: translation/ot/joshua/019/007.yaml
  text: 'Ain[a], Rimmon, Ether, and Ashan: four cities, with their villages.'
translation:
  language: te
  text: అయిన్[a], రిమ్మోను, ఎతెరు, ఆషాను—వాటి పల్లెలతో కూడిన నాలుగు పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠం అయిన్, రిమ్మోను, ఎతెరు, ఆషాను అనే నాలుగు స్థలనామాలను పేర్కొంటుంది. అయితే 1 దినవృత్తాంతాలు 4:32తో పోల్చి, కొందరు ‘అయిన్-రిమ్మోను’ను ఒకే సంయుక్త స్థలనామంగా అర్థం చేసుకుంటారు; అలా చదివితే పట్టణాల లెక్కపై ప్రభావం పడుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: עַיִן
  choice: అయిన్
  rationale: ఇది స్థలనామం; ‘ఊట’ లేదా ‘కన్ను’ అని అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: רִמּוֹן
  choice: రిమ్మోను
  rationale: ఇక్కడ ‘దానిమ్మ’ అనే సాధారణ నామార్థం కాకుండా స్థలనామంగా ఉంది; తెలుగు బైబిలు నామరూపాలకు సహజమైన విధంగా లిప్యంతరీకరించబడింది.
- source_word: וָעֶתֶר
  choice: ఏతెరు
  rationale: సంయోజక అవ్యయంతో వచ్చిన స్థలనామం; హీబ్రూ עֶתֶר ధ్వనికి దగ్గరగా ‘ఏతెరు’ అని ఇవ్వబడింది.
- source_word: וְעָשָׁן
  choice: ఆషాను
  rationale: ఇది స్థలనామం; జాబితాలోని ఇతర పేర్ల మాదిరిగా లిప్యంతరీకరించబడింది.
- source_word: עָרִים אַרְבַּע
  choice: నాలుగు పట్టణాలు
  rationale: సంఖ్యను సహజ తెలుగు పదక్రమంలో నామవాచకానికి ముందు ఉంచి, עִיר అనే నివాసకేంద్ర పదాన్ని సందర్భానుకూలంగా ‘పట్టణం’గా అనువదించాం.
- source_word: וְחַצְרֵיהֶן
  choice: వాటి పల్లెలతో కలిపి
  rationale: חָצֵר ఇక్కడ ప్రధాన పట్టణాలకు అనుబంధమైన గ్రామీణ నివాసాలను సూచిస్తుంది. హీబ్రూ సంయోజక నిర్మాణాన్ని సహజ తెలుగులో సంబంధాన్ని స్పష్టం చేసేలా ఇచ్చాం.
theological_decisions:
- issue: అయిన్, రిమ్మోను పేర్లను ఒకే సంయుక్త స్థలనామంగా తీసుకోవాలా, రెండు పేర్లుగా తీసుకోవాలా?
  choice: ప్రధాన పాఠ్యంలో నాలుగు వేర్వేరు పేర్లుగా ఇచ్చాం.
  alternative: ‘అయిన్-రిమ్మోను’ను ఒక సంయుక్త స్థలనామంగా చదవడం.
  rationale: ఈ వచనంలోని హీబ్రూ పాఠం నాలుగు పేర్లను వరుసగా చూపించి, వెంటనే ‘నాలుగు పట్టణాలు’ అని లెక్కిస్తుంది. అయితే 1 దినవృత్తాంతాలు 4:32తో పోల్చినప్పుడు సంయుక్త నామంగా అర్థం చేసుకునే అవకాశం ఉన్నందున దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. స్థలనామాలను అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం; హీబ్రూ పాఠంలోని లెక్క మరియు పేర్ల మధ్య ఉన్న ఉద్రిక్తతను పాదసూచికలో సంరక్షించాం.
