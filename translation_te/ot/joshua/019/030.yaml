  yaml_path: translation/ot/joshua/019/030.yaml
  text: 'Ummah[a], Aphek, and Rehob: twenty-two cities, with their villages.'
translation:
  language: te
  text: ఉమ్మా, ఆఫెక్, రెహోబు—మొత్తం ఇరవై రెండు పట్టణాలు, వాటి పల్లెలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి అనుబంధ నివాసాలు” లేదా “వాటి చిన్న గ్రామాలు.” హెబ్రీ పదం ప్రధాన పట్టణాలకు సంబంధించిన గ్రామీణ నివాసాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻמָה
  choice: ఉమ్మా
  rationale: పట్టణాల జాబితాలోని స్థలనామం; హెబ్రీ ఉచ్చారణకు దగ్గరగా అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: אֲפֵק
  choice: ఆఫెక్
  rationale: స్థలనామం; హెబ్రీ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: רְחֹב
  choice: రెహోబు
  rationale: స్థలనామం; తెలుగులో సహజంగా పలకడానికి చివర అచ్చు చేర్చి లిప్యంతరీకరించబడింది.
- source_word: עָרִים
  choice: పట్టణాలు
  rationale: ఈ భూభాగపు జాబితాలో పేర్కొన్న నివాస కేంద్రాలను సూచిస్తుంది; వాటి పరిమాణం నిర్దిష్టంగా తెలియనందున ఆధునిక తెలుగులో సహజమైన సాధారణ పదం ఎంచుకోబడింది.
- source_word: עֶשְׂרִים וּשְׁתַּיִם
  choice: ఇరవై రెండు
  rationale: ఈ విభాగంలోని పట్టణాల మొత్తం సంఖ్యను యథాతథంగా తెలియజేస్తుంది.
- source_word: חַצְרֵיהֶן
  choice: వాటి పల్లెలు
  rationale: ప్రధాన పట్టణాలకు అనుబంధంగా ఉన్న చిన్న గ్రామీణ నివాసాలను సూచించే పదం; 'పల్లెలు' ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన పట్టణాల జాబితా శైలిని నిలిపి ఉంచింది. హెబ్రీలోని సముచ్చయ నిర్మాణాన్ని తెలుగులో సహజంగా ఉండేలా డాష్ మరియు ‘కలిపి మొత్తం’తో వ్యక్తం చేసింది.
