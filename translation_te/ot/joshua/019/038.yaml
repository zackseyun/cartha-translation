  text: 'and Yiron[a], Migdal-el, Horem, Beth-anath, and Beth-shemesh: nineteen cities[b], with their villages.'
translation:
  language: te
  text: యిరోను, మిగ్దల్-ఏల్[a], హోరేమ్, బేత్-అనాత్, బేత్-షెమెష్[b]—ఇవి వాటి గ్రామాలతో కూడిన పందొమ్మిది పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మిగ్దల్-ఏల్” ఒక స్థలనామం; దాని పదభాగాలకు అక్షరార్థంగా “దేవుడు/ఏల్ యొక్క గోపురం” అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “బేత్-అనాత్,” “బేత్-షెమెష్” లిప్యంతరీకరించిన స్థలనామాలు; వాటి అక్షరార్థాలు వరుసగా “అనాత్ యొక్క ఇల్లు,” “సూర్యుని ఇల్లు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְאוֹן
  choice: యిర్యోను
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం. జాబితా కొనసాగింపును తెలుగులో విరామచిహ్నాలతో సహజంగా వ్యక్తం చేసినందున ఆరంభ וְ ను ప్రత్యేకంగా ‘మరియు’ అని పెట్టలేదు.
- source_word: וּמִגְדַּל אֵל
  choice: మిగ్దల్-ఏలు
  rationale: ఇది సంయుక్త స్థలనామం; అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం. రెండు భాగాల నిర్మాణాన్ని సూచించడానికి హైఫన్ ఉంచాం.
- source_word: חֳרֵם
  choice: హోరెము
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וּבֵית עֲנָת
  choice: బేత్-అనాతు
  rationale: సంయుక్త స్థలనామాన్ని అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం.
- source_word: וּבֵית שָׁמֶשׁ
  choice: బేత్-షెమెషు
  rationale: సంయుక్త స్థలనామాన్ని అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం.
- source_word: עָרִים תְּשַׁע עֶשְׂרֵה
  choice: మొత్తం పందొమ్మిది పట్టణాలు
  rationale: హీబ్రూ సంఖ్యా-నామవాచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో ఇచ్చాం; ‘మొత్తం’ జాబితా లెక్కను స్పష్టం చేస్తుంది.
- source_word: וְחַצְרֵיהֶן
  choice: వాటి గ్రామాలతో కలిపి
  rationale: ఈ భూభాగాల జాబితా సందర్భంలో חֲצֵרִים ప్రధాన పట్టణాలకు అనుబంధమైన గ్రామాలు లేదా గోడలులేని చిన్న నివాసాలను సూచిస్తుంది; తెలుగులో సహజమైన ‘గ్రామాలు’ను ఎంచుకున్నాం.
