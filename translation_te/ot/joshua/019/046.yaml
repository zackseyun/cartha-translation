  terminology: యార్కోను, రక్కోను, and యొప్పా are suitable established-style Telugu transliterations. 'సరిహద్దు ప్రాంతం' appropriately represents the broad territorial sense of גְּבוּל, while the footnote preserves 'boundary' and 'border' alternatives.
