  text: and the waters of Jarkon and Rakkon[b][a], with the territory opposite Joppa.
translation:
  language: te
  text: మరియు యార్కోను జలాలు[a], రక్కోను, యొప్పాకు ఎదురుగా ఉన్న సరిహద్దు ప్రాంతంతో సహా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మేయార్కోను’ అనే స్థలనామం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యొప్పాకు ఎదురుగా ఉన్న సరిహద్దుతో’ లేదా ‘హద్దుతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵי הַיַּרְקוֹן
  choice: యార్కోను జలాలు
  rationale: మసొరెటిక్ స్వరచిహ్నాల ప్రకారం מֵי అనేది ‘జలాలు’ అనే అర్థమిచ్చే מַיִם పదపు సంయుక్త రూపం. అందువల్ల దీనిని నీటి ప్రాంతాన్ని సూచించే పారదర్శక పదబంధంగా అనువదించాం; స్థలనామంగా కూడా గ్రహించే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְ/הָרַקּוֹן
  choice: రక్కోను
  rationale: ఇది స్థలనామం; హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం. జాబితా శైలిలో సహజమైన తెలుగు కోసం అంతర్గత ‘మరియు’ను విడిగా చేర్చలేదు.
- source_word: עִם הַ/גְּבוּל
  choice: సరిహద్దు ప్రాంతం
  rationale: עִם అంటే ‘తో/కలిపి’; גְּבוּל అనేది సరిహద్దు రేఖనూ, సరిహద్దు ప్రాంతాన్నీ సూచించగలదు. స్థలాల జాబితాలో సహజంగా ఉండేందుకు సంబంధాన్ని తెలుగులో సమాసబద్ధంగా వ్యక్తం చేశాం.
- source_word: מוּל
  choice: ఎదురుగా ఉన్న
  rationale: స్థల సంబంధాన్ని తెలిపే ‘ఎదురుగా/అభిముఖంగా’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָפוֹ
  choice: యొప్పా
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూభాగాల జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. వచనం మునుపటి జాబితాను కొనసాగిస్తున్నందున తెలుగులో వాక్యఖండ రూపాన్ని నిలిపాం; ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచాం.
