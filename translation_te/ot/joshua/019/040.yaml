  text: For the tribe of the sons of Dan, according to their clans, the seventh lot came out.
translation:
  language: te
  text: దాను కుమారుల గోత్రానికి, వారి వంశాల ప్రకారం, ఏడవ చీటి వచ్చింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: గోత్రానికి
  rationale: యెహోషువలో భూభాగాల పంపిణీ సందర్భంలో מַטֶּה అంటే అక్షరార్థమైన ‘దండం’ కాదు, ‘గోత్రం.’ ముందున్న לְ కేటాయింపు పొందే గోత్రాన్ని సూచిస్తున్నందున ‘గోత్రానికి’ అని అనువదించాం.
- source_word: בְנֵי דָן
  choice: దాను కుమారుల
  rationale: హీబ్రూ బంధుత్వ వ్యక్తీకరణను స్పష్టంగా నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే రూపం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: ఇక్కడ מִשְׁפָּחוֹת గోత్రంలోని కుటుంబ-వంశ విభాగాలను సూచిస్తుంది. ‘వంశాలు’ అనే పదం కేవలం చిన్న గృహ కుటుంబాలనే సూచించే అపార్థాన్ని నివారిస్తుంది.
- source_word: יָצָא
  choice: వచ్చింది
  rationale: క్రియకు ‘బయటికి వచ్చింది’ అనే మూల భావం ఉంది. చీట్లు వేయడంలో ‘చీటి వచ్చింది’ అనేది తెలుగులో సహజంగా ఉండి మూలంలోని క్రియారూపాన్ని ప్రతిబింబిస్తుంది.
- source_word: הַגּוֹרָל
  choice: చీటి
  rationale: భూభాగాన్ని నిర్ణయించేందుకు వేసిన lot‌ను ఆధునిక తెలుగులో ‘చీటి’ సహజంగా తెలియజేస్తుంది; సందర్భం వల్ల ఇది కేటాయింపు చీటి అని స్పష్టమవుతుంది.
- source_word: הַשְּׁבִיעִי
  choice: ఏడవ
  rationale: భూభాగ పంపిణీ క్రమంలో చీటి స్థానాన్ని సూచించే సరళమైన క్రమసంఖ్య.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. మూలంలోని ‘దాను కుమారులు’ అనే బంధుత్వ రూపం, గోత్రంలోని ఉపవిభాగాలను సూచించే ‘వంశాలు,’ అలాగే చీటి ‘వచ్చింది’ అనే రూపాలు నిలుపబడ్డాయి.
