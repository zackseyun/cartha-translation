  yaml_path: translation/ot/joshua/019/002.yaml
  text: And they had in their inheritance Beer-sheba[a], Sheba, and Moladah.
translation:
  language: te
  text: వారి స్వాస్థ్యంలో బెయేరు-షెబా[a], షెబా, మోలాదా ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పాఠంలో: “బెయేరు-షెబా మరియు షెబా.” కొందరు దీనిని రెండు వేర్వేరు పట్టణాలుగా కాక, పాఠ్య లేదా శైలీ అసాధారణతతో వచ్చిన ఒకే స్థలనామం (“బెయేరు-షెబా”)గా అర్థం చేసుకుంటారు.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: వారికి ... ఉన్నాయి
  rationale: ఈ స్వాస్థ్య జాబితా సందర్భంలో ‘వారికి ఉండెను’ అనే స్వాధీనార్థక హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో బహువచన స్థలనామాలకు అనుగుణంగా ‘వారికి ... ఉన్నాయి’ అని అనువదించాం.
- source_word: בְּנַחֲלָתָם
  choice: వారి స్వాస్థ్యంలో
  rationale: נחלה ఇక్కడ గోత్రానికి కేటాయించబడిన వారసత్వ భూభాగాన్ని సూచిస్తుంది; హీబ్రూ בְּ ఉపసర్గను అనుసరించి ఆ పట్టణాలు వారి కేటాయింపు పరిధిలో ఉన్నాయని తెలియజేస్తుంది.
- source_word: בְּאֵר שֶׁבַע
  choice: బెయేరు-షెబా
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; సంయుక్త నామంలోని రెండు భాగాలు స్పష్టంగా ఉండేందుకు హైఫన్ వాడాం.
- source_word: וְשֶׁבַע
  choice: షెబా
  rationale: మసొరా వ్యంజన పాఠం దీనిని ‘మరియు షెబా’ అనే వేరొక పట్టణంగా చూపుతుంది. అయితే బెయేరు-షెబా పక్కనే రావడం వల్ల కలిగే పాఠ్య అస్పష్టతను పాదటీపులో నిలిపాం.
- source_word: וּמוֹלָדָה
  choice: మోలాదా
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; తెలుగు జాబితా నిర్మాణంలో చివరి అంశానికి ప్రత్యేక సంధాయకం అవసరం లేకుండా సహజంగా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన జాబితా శైలిని వాడాం. ‘స్వాస్థ్యం’ బైబిలు భూకేటాయింపు సందర్భాన్ని సంక్షిప్తంగా నిలుపుతుంది. అన్ని స్థలనామాలు అనువదించకుండా లిప్యంతరీకరించబడ్డాయి.
