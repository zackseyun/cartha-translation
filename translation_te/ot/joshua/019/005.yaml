lexical_decisions:
- source_word: צִקְלַג
  choice: చిక్లగు
  rationale: స్థలపేరు కావడంతో అనువదించకుండా, హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: בֵית הַמַּרְכָּבוֹת
  choice: బేత్-హమ్మర్కాబోతు
  rationale: ‘ఇల్లు’ + ‘రథాలు’ అనే భాగాలతో ఏర్పడిన సంయుక్త స్థలపేరు. పట్టణాల జాబితాలో ఉన్నందున ప్రధాన పాఠ్యంలో అర్థానువాదం చేయకుండా లిప్యంతరీకరించబడింది; పదార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: חֲצַר סוּסָה
  choice: హజర్-సూసా
  rationale: ఇది ‘నివాస స్థలం/ఆవరణ’ మరియు ‘గుర్రం’తో సంబంధమున్న సంయుక్త స్థలపేరు. పట్టణాల జాబితాలో పేరుగా నిలుపుతూ లిప్యంతరీకరించబడింది; సాధ్యమైన అర్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: וְ / וּ / וַ
  choice: జాబితాలో విరామచిహ్నాల ద్వారా అనుసంధానం
  rationale: హెబ్రీ సంధికారకాలు వరుసలోని పేర్లను కలుపుతున్నాయి. సహజమైన తెలుగు జాబితా శైలిలో కామాలతో వ్యక్తపరచబడ్డాయి.
