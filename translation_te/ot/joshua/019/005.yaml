translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పట్టణాల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. హెబ్రీ స్థలపేర్లు అర్థానువాదం చేయకుండా తెలుగు లిపిలో ఇవ్వబడి, వాటి సాధ్యమైన పదార్థాలు పాదసూచికల్లో ఉంచబడ్డాయి.
