    issue: “యూదా స్వాస్థ్యం మధ్యలో” for בְּתוֹךְ נַחֲלָתָם
    rationale: ‘మధ్యలో’ ordinarily means ‘in the middle/at the center’ and adds a spatial nuance not present in the Hebrew. The source says that Simeon's inheritance was within Judah's inheritance, not necessarily centrally located in it.
  - severity: low
