source:
  edition: WLC
  text: מֵ/חֶ֨בֶל֙ בְּנֵ֣י יְהוּדָ֔ה נַחֲלַ֖ת בְּנֵ֣י שִׁמְע֑וֹן כִּֽי הָיָ֞ה חֵ֤לֶק בְּנֵֽי יְהוּדָה֙ רַ֣ב מֵ/הֶ֔ם וַ/יִּנְחֲל֥וּ בְנֵֽי שִׁמְע֖וֹן בְּ/ת֥וֹךְ נַחֲלָתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
translation:
  language: te
  text: యూదా వంశస్థుల భూభాగం నుండి షిమ్యోను వంశస్థులకు స్వాస్థ్యం లభించింది[a]. ఎందుకంటే యూదా వంశస్థుల భాగం వారికి చాలా పెద్దదిగా ఉంది; అందువల్ల షిమ్యోను వంశస్థులు యూదా స్వాస్థ్యం లోపల తమ స్వాస్థ్యాన్ని పొందారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదా వంశస్థుల వాటా నుండి.” ఇక్కడి హీబ్రూ పదం కొలిచి నిర్ణయించిన భూభాగాన్ని లేదా ప్రాంతాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/חֶבֶל
  choice: భూభాగం నుండే
  rationale: భూమి పంచిపెట్టే సందర్భంలో חֶבֶל కొలిచి నిర్ణయించిన భూభాగాన్ని సూచిస్తుంది. తెలుగులో ‘భూభాగం’ సహజంగా ఉండి ప్రాంతార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נַחֲלַת
  choice: స్వాస్థ్యం
  rationale: యెహోషువ గ్రంథంలోని భూమి పంపిణీ సందర్భంలో נַחֲלָה వారసత్వంగా లభించిన భూభాగాన్ని సూచిస్తుంది; ‘స్వాస్థ్యం’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  choice: యూదా వంశస్థులు / షిమ్యోను వంశస్థులు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘కుమారులు’ ఉన్నా, ఇక్కడ మొత్తం గోత్ర ప్రజలను సూచించే వంశపరమైన నామం. ‘వంశస్థులు’ మూల రూపకాన్ని కొంత నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: חֵלֶק
  choice: భాగం
  rationale: కేటాయించబడిన వాటాను సూచించే సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: רַב מֵ/הֶם
  choice: వారికి అవసరమైనదానికంటే ఎక్కువగా ఉంది
  rationale: ఈ తులనాత్మక పదబంధం యూదాకు కేటాయించిన భాగం వారి అవసరాన్ని మించిందనే భావాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: וַ/יִּנְחֲלוּ
  choice: తమ స్వాస్థ్యాన్ని పొందారు
  rationale: נחל క్రియ ఇక్కడ కేటాయించిన భూమిని స్వాస్థ్యంగా స్వీకరించడాన్ని సూచిస్తుంది.
- source_word: בְּ/תוֹךְ נַחֲלָתָם
  choice: యూదా స్వాస్థ్యం మధ్యలో
  rationale: ‘వారి’ అనే ప్రత్యయం సందర్భంలో యూదా వంశస్థులను సూచిస్తుంది. తెలుగులో అస్పష్టత రాకుండా సూచ్యార్థాన్ని పేరుతో స్పష్టం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గోత్రపరమైన ‘కుమారులు’ అనే హీబ్రూ ప్రయోగాన్ని తెలుగులో సహజమైన ‘వంశస్థులు’గా అందించాం. చివరి సర్వనామానికి యూదా వంశమే పూర్వపదమని సందర్భం స్పష్టం చేస్తున్నందున పేరును పునరుక్తి చేశాం.
