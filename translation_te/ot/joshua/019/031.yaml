  text: This was the inheritance of the tribe of the sons of Asher according to their clans—these cities and their settlements[a][b].
translation:
  language: te
  text: ఆషేరు కుమారుల గోత్రానికి, వారి వంశాల ప్రకారం, ఇదే స్వాస్థ్యం—ఈ పట్టణాలు, వాటికి చెందిన గ్రామాలు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది ... స్వాస్థ్యం.” హీబ్రూలో ఇది సూచకపదంతో కూడిన నామవాచక వాక్యం; సందర్భాన్ని బట్టి “ఇది ... లభించిన స్వాస్థ్యం” అని భూతకాల భావంతో కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “గ్రామాలు” అనే పదానికి బదులుగా “అనుబంధ నివాస ప్రాంతాలు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం జాబితాలోని పట్టణాలకు చెందిన గ్రామీణ లేదా ప్రాకారంలేని చిన్న నివాస స్థలాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: ఇది ... లభించిన
  rationale: స్త్రీలింగ ఏకవచన సూచకపదం ఇంతకుముందు వివరించిన భూభాగాన్ని సూచిస్తుంది. కథన సారాంశ సందర్భాన్ని తెలుగులో సహజంగా చూపేందుకు ‘లభించిన’ అనే భూతకాల భావాన్ని వాడాం; హీబ్రూ నామవాచక వాక్యాన్ని వర్తమాన భావంతోనూ అనువదించవచ్చు.
- source_word: נַחֲלַת
  choice: స్వాస్థ్యం
  rationale: యెహోషువలో భూవిభజన సందర్భంలో ఇది వారసత్వంగా లభించిన భూభాగాన్ని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఒడంబడికపరమైన, కుటుంబ వారసత్వ భావాన్ని నిలుపుతుంది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: ఇక్కడ ఇది కర్ర అనే అక్షరార్థంలో కాకుండా ఇశ్రాయేలు గోత్ర విభాగాన్ని సూచించే ప్రామాణిక పదం.
- source_word: בְנֵי אָשֵׁר
  choice: ఆషేరు సంతతి
  rationale: అక్షరార్థమైన ‘ఆషేరు కుమారులు’ కంటే ఆధునిక తెలుగులో గోత్రపరమైన వంశ సంబంధాన్ని ‘సంతతి’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: భూవిభజన సందర్భంలో מִשְׁפָּחָה గోత్రంలోని వంశ విభాగాలను సూచిస్తుంది; לְ యొక్క విభజనాత్మక భావాన్ని ‘ప్రకారం’ తెలియజేస్తుంది.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాలు
  rationale: עָרִים నివాస కేంద్రాలను సూచించే సాధారణ పదం. ఆధునిక పరిమాణ భావాన్ని అనవసరంగా మోపకుండా ‘పట్టణాలు’ సహజంగా ఉంటుంది.
- source_word: וְחַצְרֵיהֶן
  choice: వాటికి చెందిన గ్రామాలు
  rationale: חָצֵר పట్టణాలకు అనుబంధమైన గ్రామీణ లేదా ప్రాకారంలేని చిన్న నివాస ప్రాంతాలను సూచించవచ్చు. ‘వాటికి చెందిన’ అనే మాట ఆధీన సంబంధాన్ని స్పష్టం చేస్తుంది.
