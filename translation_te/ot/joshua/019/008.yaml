source:
  edition: WLC
  text: וְ/כָל הַֽ/חֲצֵרִ֗ים אֲשֶׁ֤ר סְבִיבוֹת֙ הֶֽ/עָרִ֣ים הָ/אֵ֔לֶּה עַד בַּֽעֲלַ֥ת בְּאֵ֖ר רָ֣אמַת נֶ֑גֶב זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
translation:
  language: te
  text: ఈ పట్టణాల చుట్టూ ఉన్న గ్రామాలన్నీ కూడా బాలాత్-బెయేరు, రామత్-నెగెబు వరకు ఉన్నాయి.[a] ఇది షిమ్యోను కుమారుల గోత్రానికి వారి వంశాల ప్రకారం వచ్చిన స్వాస్థ్యం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, రెండవ పేరు మొదటి పేరునే గుర్తించే మరో పేరుగా తీసుకుంటే, “బాలాత్-బెయేరు, అంటే రామత్-నెగెబు వరకు” అని ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל הַחֲצֵרִים
  choice: గ్రామాలన్నీ కూడా
  rationale: ఈ వాక్యం ముందున్న పట్టణాల జాబితాకు అదనంగా వాటి చుట్టుపక్కల ఉన్న చిన్న నివాస ప్రాంతాలను చేర్చుతుంది. חָצֵר ఇక్కడ ప్రాకారం లేని లేదా పట్టణాలపై ఆధారపడిన గ్రామాలను సూచిస్తుంది.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాల చుట్టూ ఉన్న
  rationale: సమీప సూచకమైన הָאֵלֶּהను ‘ఈ’గా ఉంచి, గ్రామాలకు పట్టణాలతో ఉన్న భౌగోళిక సంబంధాన్ని సహజమైన తెలుగులో తెలిపింది.
- source_word: עַד
  choice: వరకు
  rationale: భూభాగపు విస్తృతి చేరే చివరి స్థానాన్ని సూచించే ఈ సందర్భంలో ‘వరకు’ సహజమైన భౌగోళిక ప్రయోగం.
- source_word: בַּעֲלַת בְּאֵר
  choice: బాలాత్-బెయేరు
  rationale: స్థలనామాన్ని అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: רָאמַת נֶגֶב
  choice: రామత్-నెగెబు
  rationale: ఇది ప్రత్యేక స్థలనామమా, లేక ముందు పేరును గుర్తించే మరో పేరా అనే సందిగ్ధతను పరిష్కరించకుండా లిప్యంతరీకరించింది.
- source_word: נַחֲלַת
  choice: స్వాస్థ్యం
  rationale: యెహోషువ గ్రంథంలోని గోత్ర భూవిభజన సందర్భంలో న్యాయబద్ధంగా, తరతరాలకు లభించిన భూభాగం అనే భావాన్ని ‘స్వాస్థ్యం’ తెలియజేస్తుంది.
- source_word: מַטֵּה בְנֵי שִׁמְעוֹן
  choice: షిమ్యోను కుమారుల గోత్రానికి
  rationale: מַטֶּה యొక్క సామాజిక అర్థాన్ని ‘గోత్రం’గా, בְנֵי שִׁמְעוֹןలోని వంశావళి రూపాన్ని ‘షిమ్యోను కుమారులు’గా నిలిపింది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: గోత్రంలో భూభాగం వంశ సమూహాలవారీగా పంచబడిందనే భావాన్ని తెలియజేస్తుంది.
