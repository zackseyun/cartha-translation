base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/022.yaml
  text: And the border touched Tabor[a], Shahazumah, and Beth-shemesh[b], and the end of their border was at the Jordan—sixteen cities with their villages.
translation:
  language: te
  text: ఆ సరిహద్దు తాబోరును[a], షహజూమాను, బేత్-షెమెషును తాకి, యొర్దాను వద్ద ముగిసింది[b]—పదహారు పట్టణాలు, వాటి గ్రామాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చేరి’ లేదా ‘కలిసి’ అని కూడా అనువదించవచ్చు; హీబ్రూ క్రియ సరిహద్దు రేఖ ఒక ప్రదేశాన్ని చేరడాన్ని లేదా దానితో కలవడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారి సరిహద్దు అంత్యస్థానాలు యొర్దాను’; ఇది సరిహద్దు ముగింపు స్థానాన్ని లేదా దాని విస్తృతి చివరను సూచించే పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָגַע הַגְּבוּל
  choice: ఆ సరిహద్దు ... తాకి
  rationale: సరిహద్దు వర్ణనల్లో פגע ఒక ప్రదేశాన్ని చేరడం లేదా దానితో కలవడం అనే ప్రాదేశిక భావాన్ని ఇస్తుంది. ‘తాకి’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְּתָבוֹר
  choice: తాబోరు
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְשַׁחֲצוּמָה
  choice: షహజూమా
  rationale: మసొరెటిక్ పాఠంలోని స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וּבֵית שֶׁמֶשׁ
  choice: బేత్-షెమెషు
  rationale: పేరు యొక్క అక్షరార్థాన్ని అనువదించకుండా స్థలనామంగా లిప్యంతరీకరించాం.
- source_word: וְהָיוּ תֹּצְאוֹת גְּבוּלָם הַיַּרְדֵּן
  choice: యొర్దాను దగ్గర ముగిసింది
  rationale: ‘వారి సరిహద్దు యొక్క బయలుదేరే చోటులు యొర్దాను అయ్యాయి’ అనే హీబ్రూ సరిహద్దు సూత్రాన్ని ఆధునిక తెలుగులో దాని ముగింపు స్థానాన్ని సూచించేలా సహజంగా వ్యక్తం చేశాం.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: పదహారు పట్టణాలు
  rationale: సంఖ్యా నిర్మాణాన్ని నేరుగా, సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం.
- source_word: וְחַצְרֵיהֶן
  choice: వాటి గ్రామాలతో కలిపి
  rationale: חָצֵר ఇక్కడ పట్టణాలకు అనుబంధమైన చిన్న నివాస ప్రాంతాలు లేదా గ్రామాలను సూచిస్తుంది; ‘గ్రామాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
