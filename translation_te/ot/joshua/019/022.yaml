translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భౌగోళిక సరిహద్దు జాబితికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. స్థలనామాలు అనువదించకుండా లిప్యంతరీకరించబడ్డాయి; హీబ్రూ సరిహద్దు సూత్రంలోని అసాధారణ అక్షరార్థం పాదసూచికలో భద్రపరచబడింది.
