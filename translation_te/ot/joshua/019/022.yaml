- from: ఆ సరిహద్దు తాబోరు[a], షహజూమా, బేత్-షెమెషులను తాకి, యొర్దాను దగ్గర ముగిసింది[b]—వాటి గ్రామాలతో కలిపి పదహారు పట్టణాలు.
  to: ఆ సరిహద్దు తాబోరును[a], షహజూమాను, బేత్-షెమెషును తాకి, యొర్దాను వద్ద ముగిసింది[b]—పదహారు పట్టణాలు, వాటి గ్రామాలు.
  rationale: The revision preserves the source’s geographic sense and the English audit trail while clarifying that sixteen counts the cities alone. It also improves Telugu case marking and recasts the explanatory footnote in natural modern Telugu without resolving the source formula beyond its geographic function.
