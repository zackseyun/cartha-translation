    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַבִּית
  choice: రబ్బీతు
  rationale: పట్టణాల జాబితాలోని స్థలనామం కావున అనువదించకుండా, తెలుగు ఉచ్చారణకు సహజంగా లిప్యంతరీకరించబడింది. హీబ్రూ పదారంభంలోని ה పేరులో భాగంగా ఉన్నప్పటికీ, ప్రాచుర్యంలో ఉన్న రూపాన్ని అనుసరించి ‘రబ్బీతు’గా ఇచ్చి, మరింత యాంత్రిక రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: קִשְׁיוֹן
  choice: కిష్యోను
  rationale: హీబ్రూ స్థలనామాన్ని యోద్–వావ్ ధ్వనిక్రమాన్ని ప్రతిబింబించేలా, ఆధునిక తెలుగు పఠనానికి అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: אָבֶץ
  choice: ఏబెసు
  rationale: మసొరా స్వరచిహ్నాలను అనుసరించిన సంప్రదాయ రూపానికి దగ్గరగా స్థలనామాన్ని తెలుగులో లిప్యంతరీకరించాం; ‘ఆబెసు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְ / וָ
  choice: జాబితా విరామచిహ్నాలు
  rationale: హీబ్రూలో ప్రతి పేరుతో ఉన్న సంయోజక అవ్యయాన్ని తెలుగులో పదేపదే ‘మరియు’ అని ఇవ్వడం అసహజం. ఇది కొనసాగుతున్న పట్టణాల జాబితా కాబట్టి, తెలుగు జాబితా శైలిలో కామాలతో సహజంగా వ్యక్తపరచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పట్టణాల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. తెలుగు బైబిలు నామరూపాల్లో సాధారణంగా వినిపించే పదాంత స్వరాలను ఉపయోగించాం; హీబ్రూ సంయోజకాలను అసహజంగా పునరావృతం చేయకుండా జాబితా విరామచిహ్నాలతో వ్యక్తపరచాం.
