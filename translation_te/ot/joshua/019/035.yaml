translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన భౌగోళిక జాబితా శైలిని పాటించాం. ‘ప్రాకారాలతో బలపరచబడిన’ అనే పదబంధం సైనిక రక్షణ భావాన్ని సామాన్య పాఠకునికి స్పష్టంగా తెలియజేస్తుంది. స్థలనామాలను అనువదించకుండా తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
