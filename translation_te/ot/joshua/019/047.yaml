source:
  edition: WLC
  text: וַ/יֵּצֵ֥א גְבוּל בְּנֵי דָ֖ן מֵ/הֶ֑ם וַ/יַּעֲל֣וּ בְנֵֽי דָ֠ן וַ/יִּלָּחֲמ֨וּ עִם לֶ֜שֶׁם וַ/יִּלְכְּד֥וּ אוֹתָ֣/הּ וַ/יַּכּ֧וּ אוֹתָ֣/הּ לְ/פִי חֶ֗רֶב וַ/יִּֽרְשׁ֤וּ אוֹתָ/הּ֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַ/יִּקְרְא֤וּ לְ/לֶ֨שֶׁם֙ דָּ֔ן כְּ/שֵׁ֖ם דָּ֥ן אֲבִי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
translation:
  language: te
  text: దాను సంతతివారి సరిహద్దు వారి నుండి బయటికి వెళ్లింది.[a] అప్పుడు దాను సంతతివారు పైకి వెళ్లి లెషెము మీద యుద్ధం చేసి, దాన్ని పట్టుకున్నారు; దాన్ని కత్తి అంచుతో కొట్టి, దాన్ని స్వాధీనపరచుకొని, అందులో నివసించారు. తమ పితరుడైన దాను పేరును బట్టి వారు లెషెముకు దాను అని పేరు పెట్టారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాను సంతతివారి సరిహద్దు వారి నుండి బయటికి విస్తరించింది.” సందర్భాన్ని బట్టి కొందరు దీనిని “దాను సంతతివారి ప్రాంతం వారికి చాలలేదు” అని అర్థం చేసుకుంటారు; అయితే హీబ్రూ మాటలు మరింత నేరుగా స్థలసంబంధ భావాన్ని ఇస్తాయి.
    reason: alternative_reading
  - marker: b
    text: న్యాయాధిపతులు 18:7, 14, 27, 29లో లెషెము “లాయిషు” అనే పేరుతో కనిపిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  choice: దాను సంతతివారి ప్రాంతపు సరిహద్దు వారి పరిధిని దాటి విస్తరించింది
  rationale: గְבוּל అనే పదంలో ‘సరిహద్దు’, ‘ప్రాంతం’ అనే రెండు భావాలూ ఉన్నాయి. కష్టమైన מֵהֶם పదబంధంలోని స్థలసంబంధ భావాన్ని నిలిపి, సందర్భం ఆధారంగా ‘వారికి చాలలేదు’ అని ప్రధాన పాఠంలో నిర్ణయించలేదు.
- source_word: בְּנֵי דָן
  choice: దాను సంతతివారు
  rationale: అక్షరార్థమైన ‘దాను కుమారులు’కన్నా గోత్రసంబంధ భావాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּעֲלוּ
  choice: వెళ్లి
  rationale: క్రియకు అక్షరార్థంగా ‘పైకి వెళ్లారు’ అనే భావం ఉన్నా, ఇక్కడ సైనిక ప్రయాణాన్ని తెలుగులో సహజంగా చెప్పడానికి ‘వెళ్లి’ వాడబడింది; భౌగోళిక ఆరోహణను అనవసరంగా బలపరచలేదు.
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  choice: లెషెముతో యుద్ధం చేసి
  rationale: నగరానికి వ్యతిరేకంగా యుద్ధం చేయడాన్ని తెలుగులో ‘లెషెముతో యుద్ధం’ అని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לֶשֶׁם
  choice: లెషెము
  rationale: మసొరెటిక్ పాఠంలోని స్థలనామాన్ని నిలిపింది; న్యాయాధిపతులు 18లోని లాయిషుతో సంబంధాన్ని పాదసూచికలో తెలిపింది.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: దాన్ని స్వాధీనం చేసుకున్నారు
  rationale: సైనిక సందర్భంలో నగరాన్ని పట్టుకోవడం లేదా జయించడం అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב
  choice: దాన్ని కత్తివాత హతమార్చి
  rationale: ‘కత్తి అంచు/నోరు’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో అర్థవంతమైన యుద్ధవాక్యంగా అందిస్తూ హింసాత్మక భావాన్ని తగ్గించలేదు.
- source_word: וַיִּרְשׁוּ אוֹתָהּ
  choice: దాన్ని తమ అధీనంలోకి తీసుకొని
  rationale: యָרַשׁ క్రియలోని స్వాధీనపరచుకొని కలిగియుండే భావాన్ని తెలియజేస్తుంది; ముందున్న ‘స్వాధీనం చేసుకున్నారు’తో ఉన్న భావపునరుక్తి మూలపాఠంలోని వరుస చర్యలను ప్రతిబింబిస్తుంది.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: అందులో నివసించారు
  rationale: ‘నివసించు’ అనే సాధారణ అర్థాన్ని గంభీరమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן
  choice: లెషెముకు దాను అని పేరు పెట్టారు
  rationale: పేరుపెట్టే నిర్మాణాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: כְּשֵׁם דָּן אֲבִיהֶם
  choice: తమ పితరుడైన దాను పేరును బట్టి
  rationale: אָב ఇక్కడ గోత్ర మూలపురుషుణ్ణి సూచిస్తుంది. ‘పితరుడు’ అనే పదం అక్షరార్థ ‘తండ్రి’ వల్ల కలిగే అపార్థాన్ని నివారిస్తూ వంశసంబంధ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దాను ప్రాంతపు సరిహద్దును తెలిపే మొదటి వాక్యంలోని అస్పష్టత
  choice: సరిహద్దు వారి పరిధిని దాటి విస్తరించిందనే స్థలసంబంధ భావాన్ని ప్రధాన పాఠంలో ఉంచడం
  alternative: దాను సంతతివారి ప్రాంతం వారికి చాలలేదు
  rationale: హీబ్రూ పదాలు అక్షరార్థంగా స్థలసంబంధమైనవి; ‘చాలలేదు’ అనేది విస్తృత సందర్భం నుంచి వచ్చిన సాధ్యమైన వివరణ. అసలు పాఠంలోని అస్పష్టతను పూర్తిగా తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘దాను సంతతివారు’ గోత్రార్థాన్ని సహజంగా అందిస్తుంది. మొదటి వాక్యంలోని మూలభాషా అస్పష్టతను పాదసూచికతో నిలిపాం; స్థలనామాలను లెషెము, దాను రూపాల్లో ఇచ్చాం.
