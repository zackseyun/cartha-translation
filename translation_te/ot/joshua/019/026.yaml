base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/026.yaml
  text: and Allammelech[a], Amad, and Mishal; and it reached to Carmel westward, and to Shihor-libnath.
translation:
  language: te
  text: అల్లమ్మెలెక్, అమాద, మిషాల్; ఆ సరిహద్దు పడమటి దిశగా[a] కర్మెల్‌ను చేరి, షీహోర్-లిబ్నాత్‌ను చేరింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, ‘సముద్రం వైపుకు’; ఈ భౌగోళిక సందర్భంలో అది ‘పడమటి దిశగా’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלַּמֶּלֶךְ
  choice: అల్లమ్మెలెకు
  rationale: స్థలనామాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: עַמְעָד
  choice: అమాదు
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; పఠన సౌలభ్యం కోసం చివరి హల్లుకు సహజ తెలుగు అచ్చు జోడించాం.
- source_word: מִשְׁאָל
  choice: మిషాలు
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: וּפָגַע
  choice: చేరింది
  rationale: సరిహద్దు వర్ణనల్లో פגע ఒక ప్రదేశాన్ని చేరడం లేదా తాకడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘చేరింది’ సహజంగా ఉంది.
- source_word: בְּכַרְמֶל
  choice: కర్మెలును
  rationale: פגע క్రియతో కలసి సరిహద్దు చేరిన ప్రదేశాన్ని సూచిస్తుంది; తెలుగులో కర్మ విభక్తి సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַיָּמָּה
  choice: పడమటి దిశగా
  rationale: పదశః ‘సముద్రం వైపుకు’; ఇశ్రాయేలు భౌగోళిక వాడుకలో ఇది పడమటి దిశను సూచిస్తుంది. ప్రధాన పాఠ్యంలో అర్థాన్ని ఇచ్చి, పదశః రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּבְשִׁיחוֹר לִבְנָת
  choice: షీహోరు-లిబ్నాతును
  rationale: సంభావ్య సంయుక్త స్థలనామంగా లిప్యంతరీకరించి, రెండు భాగాల అనుబంధాన్ని హైఫన్‌తో చూపించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సరిహద్దు వర్ణనకు తగిన స్పష్టమైన గద్యశైలిని వాడాం. సందర్భం స్పష్టంగా ఉండేందుకు క్రియకు కర్తగా ‘ఆ సరిహద్దు’ను వ్యక్తంగా చేర్చాం; స్థలనామాలను అనువదించకుండా తెలుగు లిపిలో ఇచ్చాం.
