source:
  edition: WLC
  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי יִשָּׂשכָ֖ר לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/023.yaml
  text: This was the inheritance of the tribe of the sons of Issachar[a], according to their clans—the cities and their villages.
translation:
  language: te
  text: ఇశ్శాఖారు వంశస్థుల గోత్రానికి వారి ఉపవంశాల ప్రకారం స్వాస్థ్యం ఇదే[a]—ఆ పట్టణాలు, వాటి గ్రామాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇదే ... స్వాస్థ్యం.’ హెబ్రీలో ఈ వాక్యానికి కాలాన్ని తెలిపే క్రియ లేదు; ఈ సారాంశ సూత్రాన్ని సందర్భానుసారంగా వర్తమాన లేదా భూతకాల భావంతో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: ఇదే
  rationale: స్త్రీలింగ ఏకవచన సూచక సర్వనామం, ఇంతకుముందు వివరించిన భూస్వాస్థ్యాన్ని సూచిస్తుంది. హెబ్రీ వాక్యంలో క్రియ లేకపోవడం వల్ల తెలుగు సహజ శైలిలో కాలాన్ని నిర్దిష్టంగా చేర్చకుండా ‘ఇదే’ అని ఉంచాం.
- source_word: נַחֲלַת
  choice: స్వాస్థ్యం
  rationale: యెహోషువ గ్రంథంలోని సందర్భంలో వంశపారంపర్యంగా లభించిన భూభాగాన్ని సూచిస్తుంది; ‘స్వాస్థ్యం’ దాని వారసత్వ భావాన్ని నిలుపుతుంది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: భూవిభజన సందర్భంలో మַטֶּה ఇశ్రాయేలు గోత్రాన్ని సూచించే ప్రామాణిక పదం.
- source_word: בְנֵי יִשָּׂשכָר
  choice: ఇశ్శాఖారు వంశస్థులు
  rationale: హెబ్రీలో అక్షరార్థంగా ‘ఇశ్శాఖారు కుమారులు’; ఇక్కడ మొత్తం గోత్రసమాజాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన ‘వంశస్థులు’ ఎంచుకున్నాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వారి వంశాల ప్రకారం
  rationale: గోత్రంలోని ఉపవంశాల వారీగా పంపిణీ అనే భావాన్ని సూచించే לְ ను ‘ప్రకారం’తో, పంపిణీ భావాన్ని స్పష్టం చేయడానికి ‘వారి వారి’తో వ్యక్తపరిచాం.
- source_word: הֶעָרִים
  choice: పట్టణాలు
  rationale: స్థిర నివాస కేంద్రాలను సూచించే עָרִים కు ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: וְחַצְרֵיהֶן
  choice: వాటి గ్రామాలు
  rationale: పట్టణాలకు అనుబంధంగా ఉన్న చిన్న గ్రామీణ నివాసాలను సూచిస్తుంది; సులభంగా అర్థమయ్యే ‘గ్రామాలు’ను ఎంచుకున్నాం.
theological_decisions:
- issue: క్రియలేని హెబ్రీ వాక్యంలో కాల సూచన
  choice: కాలాన్ని నిర్దిష్టంగా చేర్చకుండా ‘ఇదే’
  alternative: ‘ఇది ... స్వాస్థ్యంగా ఉండేది’ లేదా ‘ఇదే ... స్వాస్థ్యం అయింది’
  rationale: మూల హెబ్రీ నామవాచక వాక్యంలో భూత లేదా వర్తమాన కాల క్రియ లేదు. తెలుగు ‘ఇదే’ ఆ అస్పష్టతను సహజంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా చదవగల భాష. భూవిభజనకు సంబంధించిన సూత్రబద్ధ శైలిని నిలుపుతూ, మూలంలోని క్రియారహిత వాక్యపు కాల అస్పష్టతను కాపాడాం.
