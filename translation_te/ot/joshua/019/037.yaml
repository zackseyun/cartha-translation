lexical_decisions:
- source_word: קֶדֶשׁ
  choice: కెదెషు
  rationale: పట్టణాల జాబితాలోని స్థలనామం కావడంతో అర్థానువాదం చేయకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో రాయబడింది.
- source_word: אֶדְרֶעִי
  choice: ఎద్రెయి
  rationale: ఇది స్థలనామం; హీబ్రూ రూపాన్ని సాధ్యమైనంత సహజంగా ఆధునిక తెలుగు లిపిలో ప్రతిలిపి చేశాం.
- source_word: עֵין חָצוֹר
  choice: ఏన్-హాసోరు
  rationale: ఇది సంయుక్త స్థలనామం. עֵין అనే పదానికి ‘ఊట’ అనే అర్థం ఉన్నప్పటికీ, ఇక్కడ స్థలనామంగా పనిచేస్తున్నందున దానిని అనువదించకుండా ప్రతిలిపి చేశాం.
- source_word: וְ
  choice: జాబితా విరామచిహ్నాలతో సూచించబడింది
  rationale: హీబ్రూలో ప్రతి పేరుకు ముందు పునరావృతమయ్యే సంధానపదాన్ని తెలుగులో ప్రతిసారీ ‘మరియు’ అని ఉంచితే పట్టణాల జాబితా అసహజంగా వినిపిస్తుంది; కామాలతో సమన్వయ సంబంధాన్ని సహజంగా తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పట్టణాల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని స్థలనామాలు అనువదించకుండా తెలుగు లిపిలో ప్రతిలిపి చేయబడ్డాయి. గమనిక సూచికను అది వివరించే ‘ఏన్-హాసోరు’ పేరు తరువాత ఉంచాం.
