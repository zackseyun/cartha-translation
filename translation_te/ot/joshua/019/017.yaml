  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/יִ֨שָּׂשכָ֔ר יָצָ֖א הַ/גּוֹרָ֣ל הָֽ/רְבִיעִ֑י לִ/בְנֵ֥י יִשָּׂשכָ֖ר לְ/מִשְׁפְּחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/017.yaml
  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
translation:
  language: te
  text: ఇశ్శాఖారుకు నాలుగవ చీటి వచ్చింది; ఇశ్శాఖారు కుమారులకు వారి వంశాల చొప్పున.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: ఇశ్శాఖారుకు
  rationale: లְ ఉపసర్గ చీటి ఎవరికి కేటాయించబడిందో సూచిస్తుంది; ఈ సందర్భంలో ‘ఇశ్శాఖారుకు’ సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
- source_word: יָצָא
  choice: వచ్చింది
  rationale: యָצָא యొక్క ప్రాథమిక భావం ‘బయటికి వచ్చింది’; చీట్లు వేయడమనే సందర్భంలో తెలుగు భాషలో ‘చీటి వచ్చింది’ సహజంగా ఆ దృశ్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַגּוֹרָל
  choice: చీటి
  rationale: ఇది గోత్రపు స్వాస్థ్యాన్ని నిర్ణయించడానికి వేసిన చీటిని సూచిస్తుంది; ‘వంతు’ లేదా ‘భూభాగం’ అని అనువదిస్తే సాధనానికీ ఫలితానికీ మధ్యనున్న తేడా చెరిగిపోతుంది.
- source_word: הָרְבִיעִי
  choice: నాలుగవ
  rationale: స్వాస్థ్య విభజనలో చీటి వచ్చిన క్రమాన్ని ఈ సంఖ్యావాచకం సూచిస్తుంది.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: ఇశ్శాఖారు కుమారులకు
  rationale: בְּנֵי అక్షరార్థంగా ‘కుమారులు’; ఇది గోత్ర వంశజులను సూచించే సంప్రదాయ వంశపారంపర్య వ్యక్తీకరణ కాబట్టి దానిని నిలిపాం.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: మూలపదం గోత్రంలోని ఉపవంశ లేదా కుల విభాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశాలు’ ఈ సామాజిక-వంశపారంపర్య భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని ‘ఇశ్శాఖారుకు’ మరియు ‘ఇశ్శాఖారు కుమారులకు’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. అయితే హీబ్రూ వాక్యంలో ‘వచ్చింది’ అనే క్రియ ఒక్కసారి మాత్రమే ఉంది; సహజత్వం కోసం తెలుగులో దానిని రెండుసార్లు ఉంచడం అనవసర విస్తరణ కావచ్చు.
