- source_word: חָרְמָה
  choice: హోర్మా
  rationale: ఇది స్థలనామం; దాని మూలార్థాన్ని అనువదించకుండా, ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: וְ / וּ
  choice: జాబితా విరామచిహ్నాలు
  rationale: ప్రతి పేరుకు ముందు ఉన్న హీబ్రూ సంయోజక అవ్యయాన్ని తెలుగులో పదేపదే ‘మరియు’ అని పెట్టకుండా, సహజమైన జాబితా శైలిలో కామాలతో సూచించాం.
