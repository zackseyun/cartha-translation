  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని ‘నఫ్తాలి వంశస్థులకు’ అనే పునరుక్తిని వాక్య నిర్మాణంతో సహా నిలిపి, గోత్ర కేటాయింపు భావాన్ని స్పష్టంగా ఉంచింది.
