  yaml_path: translation/ot/joshua/019/032.yaml
  text: For the sons of Naphtali[a], the sixth lot came out, for the sons of Naphtali according to their clans.
translation:
  language: te
  text: నఫ్తాలి వంశస్థులకు, వారి వంశాల ప్రకారం, ఆరవ చీటి వచ్చింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పడింది.” హీబ్రూ క్రియకు అక్షరార్థంగా “బయటికి వచ్చింది” లేదా “వెళ్లింది” అని అర్థం; ఇక్కడ అది చీటి వేసినప్పుడు వచ్చిన ఫలితాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי נַפְתָּלִי
  choice: నఫ్తాలి వంశస్థులకు
  rationale: ఇక్కడ ‘కుమారులు’ అనేది నఫ్తాలి ప్రత్యక్ష కుమారులను మాత్రమే కాకుండా అతని గోత్రానికి చెందిన వారిని సూచించే హీబ్రూ గోత్రపరమైన నుడికారం. ఆధునిక తెలుగులో ‘వంశస్థులు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; ל ఉపసర్గ చీటి పొందే వర్గాన్ని సూచిస్తుంది.
- source_word: יָצָא
  choice: వచ్చింది
  rationale: ఈ క్రియకు అక్షరార్థంగా ‘బయటికి వచ్చింది/వెళ్లింది’ అనే భావం ఉంది. చీట్లు వేసిన సందర్భంలో ఫలితంగా చీటి ‘వచ్చింది’ అనడం తెలుగులో సహజంగా ఉండి, మూలంలోని రూపకాన్ని కూడా సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: הַגּוֹרָל
  choice: చీటి
  rationale: భూభాగాన్ని కేటాయించడానికి వేసిన చీటిని సూచిస్తుంది. ‘చీటి’ ఈ సందర్భంలో సంక్షిప్తమైన, సాధారణ తెలుగు పదం.
- source_word: הַשִּׁשִּׁי
  choice: ఆరవ
  rationale: ‘చీటి’ని విశేషించే క్రమసంఖ్యను నేరుగా అనువదించింది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחוֹת ఇక్కడ గోత్రంలోని బంధుత్వ ఉపవిభాగాలను సూచిస్తుంది. ‘కుటుంబాలు’ కేవలం చిన్న గృహసమూహాలనే సూచించే అవకాశముండగా, ‘వంశాలు’ ఈ గోత్రపరమైన నిర్మాణాన్ని మరింత స్పష్టంగా తెలియజేస్తుంది.
