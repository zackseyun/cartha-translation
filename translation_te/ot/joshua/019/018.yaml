- source_word: יִזְרְעֶאלָה
  choice: యెజ్రెయేలు వైపు
  rationale: స్థలనామం చివర ఉన్న దిశార్థక ה ఆ ప్రదేశం వైపు దిశను సూచిస్తుంది. మార్గాన్నిగానీ ఖచ్చితమైన అంతిమ బిందువునుగానీ అదనంగా నిర్దేశించకుండా ఆ భావాన్ని నిలిపాం.
- source_word: הַכְּסוּלֹת
  choice: కెసుల్లోతు
  rationale: ఇది స్థలనామం. ముందున్న నిర్దేశక ఉపసర్గను తెలుగులో ప్రత్యేకంగా వ్యక్తం చేయకుండా, పేరులో భాగంగా భావించి లిప్యంతరీకరించాం.
- source_word: שׁוּנֵם
  choice: షూనేము
  rationale: స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
