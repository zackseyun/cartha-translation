source:
  edition: WLC
  text: וְ/שָׁ֤ב הַ/גְּבוּל֙ הָֽ/רָמָ֔ה וְ/עַד עִ֖יר מִבְצַר צֹ֑ר וְ/שָׁ֤ב הַ/גְּבוּל֙ חֹסָ֔ה ו/יהיו תֹצְאֹתָ֛י/ו הַ/יָּ֖מָּ/ה מֵ/חֶ֥בֶל אַכְזִֽיבָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/029.yaml
  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
translation:
  language: te
  text: అప్పుడు సరిహద్దు రామాకు తిరిగి, తూరు అనే కోటబలమున్న పట్టణం వరకు వెళ్లింది. తరువాత సరిహద్దు హోసాకు తిరిగింది; దాని అంత్యబిందువులు అక్జీబు ప్రాంతం[b] నుండి సముద్రం వైపు[a] ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పడమటి వైపు.’ హీబ్రూలో అక్షరార్థంగా ‘సముద్రం వైపు’ అని ఉంది; ఇది పడమటి దిశకు సాధారణ భౌగోళిక వ్యక్తీకరణ.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అక్జీబు మండలం నుంచి,’ ‘అక్జీబు భూభాగం నుంచి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: వైపుకు తిరిగింది
  rationale: సరిహద్దుల వర్ణనలో ఈ క్రియ సరిహద్దు రేఖ దిశ మారడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వైపుకు తిరిగింది’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: הַגְּבוּל
  choice: సరిహద్దు
  rationale: గోత్రానికి కేటాయించిన భూభాగపు హద్దురేఖను సూచించే సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: הָרָמָה
  choice: రామా
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: עִיר מִבְצַר צֹר
  choice: కోటగల తూరు పట్టణం
  rationale: మూలంలోని ‘కోటబలమున్న పట్టణం’ అనే వివరణాత్మక భావాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: חֹסָה
  choice: హోసా
  rationale: హీబ్రూ స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: וַיהיו תֹצְאֹתָיו
  choice: దాని చివరి హద్దులు ... ఉన్నాయి
  rationale: సరిహద్దు వర్ణనల్లో תֹצָאוֹת సరిహద్దు చేరే చివరి స్థానాలు లేదా అంత్యబిందువులను సూచిస్తుంది; బహువచన రూపాన్ని తెలుగులో నిలిపాం.
- source_word: הַיָּמָּה
  choice: సముద్రం వైపు
  rationale: దిశను సూచించే హీబ్రూ ప్రత్యయాన్ని, అలాగే సముద్రం అనే స్పష్టమైన భౌగోళిక చిత్రాన్ని నిలిపింది; సందర్భంలో ఇది పడమటి దిశను కూడా సూచించవచ్చు.
- source_word: מֵחֶבֶל אַכְזִיבָה
  choice: అక్జీబు ప్రాంతం నుండి
  rationale: חֶבֶל ఇక్కడ కొలిచిన భూభాగం, ప్రాంతం లేదా మండలాన్ని సూచించవచ్చు. ‘ప్రాంతం’ పరిపాలనా స్వరూపాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా భావాన్ని అందిస్తుంది.
