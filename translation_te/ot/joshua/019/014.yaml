  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
translation:
  language: te
  text: ఆ సరిహద్దు దాని చుట్టూ తిరిగి, హన్నాతోనుకు ఉత్తరంగా[a] సాగింది; దాని చివరి అంచులు[b] యిఫ్తాహేలు లోయ వద్ద ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హన్నాతోను వైపు ఉత్తర దిశగా.’ హీబ్రూ పదబంధం హన్నాతోనుకు ఉత్తరాన ఉన్న స్థానాన్ని గానీ, హన్నాతోను వైపు ఉత్తర దిశగా సాగడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దాని బయటికి వెళ్లే చోటులు.’ సరిహద్దు వర్ణనలో ఈ పదం దాని చివరి అంచులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב אֹתוֹ הַגְּבוּל
  choice: ఆ సరిహద్దు దాని చుట్టూ తిరిగి
  rationale: సరిహద్దు వర్ణనల్లో נָסַב మలుపు తిరగడం లేదా చుట్టూ సాగడాన్ని సూచిస్తుంది. אֹתוֹలోని సర్వనామ సూచనను స్పష్టంగా నిర్ణయించకుండా ‘దాని’ అని నిలిపి ఉంచాం.
- source_word: מִצְּפוֹן חַנָּתֹן
  choice: హన్నాతోనుకు ఉత్తరంగా
  rationale: מן + צפון నిర్మాణం ఇక్కడ హన్నాతోనుకు ఉత్తరాన ఉన్న స్థానాన్ని సూచించవచ్చు. దిశను సూచించే పఠనం కూడా సాధ్యమైనందున దానిని పాదసూచికలో ఇచ్చాం.
- source_word: וְהָיוּ תֹּצְאֹתָיו
  choice: దాని చివరి అంచులు ... ఉన్నాయి
  rationale: תֹּצְאֹתָיו వ్యాకరణరీత్యా బహువచనం; సరిహద్దు వర్ణనలో అది దాని చివరి లేదా వెలుపలికి చేరే అంచులను సూచిస్తుంది. మూలంలోని బహువచనాన్ని తెలుగులో నిలిపాం.
- source_word: גֵּי יִפְתַּח אֵל
  choice: యిఫ్తాహేలు లోయ
  rationale: גֵּי అంటే లోయ; יִפְתַּח אֵל స్థలనామం కాబట్టి దానిని అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
