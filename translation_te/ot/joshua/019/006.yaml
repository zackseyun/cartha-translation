lexical_decisions:
- source_word: בֵית לְבָאוֹת
  choice: బేత్-లెబాయోతు
  rationale: ఇది స్థలనామం కాబట్టి దాని అక్షరార్థమైన ‘ఆడసింహాల ఇల్లు’ అని అనువదించకుండా, హీబ్రూ పేరును తెలుగులో లిప్యంతరీకరించాం.
- source_word: שָׁרוּחֶן
  choice: షారూహెను
  rationale: WLC/మసొరా పాఠంలో ఉన్న స్థలనామాన్ని తెలుగులో లిప్యంతరీకరించాం; సమాంతర జాబితాలోని భిన్ననామాన్ని పాదసూచికలో తెలిపాం.
- source_word: עָרִים
  choice: పట్టణాలు
  rationale: భూభాగ కేటాయింపు జాబితాలో עִיר సూచించే నివాస కేంద్రాలకు ఆధునిక తెలుగులో సహజమైన పదం; వాటి పరిమాణం తప్పనిసరిగా పెద్ద నగరమని భావింపజేయదు.
- source_word: שְׁלֹשׁ עֶשְׂרֵה
  choice: మొత్తం పదమూడు
  rationale: జాబితా ముగింపులో ఇచ్చిన సంఖ్యను తెలుగులో సహజంగా, ఇది మొత్తం సంఖ్య అని స్పష్టమయ్యేలా అందించాం.
- source_word: חַצְרֵיהֶן
  choice: వాటి గ్రామాలు
  rationale: పేర్కొన్న పట్టణాలకు అనుబంధంగా ఉన్న చిన్న లేదా ప్రాకారంలేని నివాసాలను ఈ సందర్భంలో ‘గ్రామాలు’ సహజంగా తెలియజేస్తుంది.
