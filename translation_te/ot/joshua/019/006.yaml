    text: హీబ్రూ పాఠంలో ‘షారూహెన్’ అని ఉంది; దీనికి సమాంతరమైన యెహోషువ 15:32 జాబితాలో ‘షిల్హీము’ అనే భిన్ననామం ఉంది.
