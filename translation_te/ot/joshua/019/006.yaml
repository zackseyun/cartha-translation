  register: ఆధునిక ప్రామాణిక తెలుగులో, స్థలనామాల జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. పాదసూచిక గుర్తును సంబంధిత ‘షారూహెను’ పేరుకే నేరుగా జతచేశాం.
