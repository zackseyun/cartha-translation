  source_fidelity: 'హీబ్రూ మూలంలోని ప్రధాన అంశాలన్నీ సరిగా ప్రతిఫలించాయి: యెహోవా అధికారిక ఆజ్ఞ/నిర్దేశం, వారు అతనికి ఇచ్చిన పట్టణం, అతడు కోరిన పట్టణంగా తిమ్నత్-సెరహు గుర్తింపు, ఎఫ్రాయిము కొండప్రాంతం, అతడు పట్టణాన్ని నిర్మించడం, అందులో నివసించడం. בנה క్రియకు ప్రధాన పాఠంలో ‘నిర్మించాడు’ అనడం మూలానికి అత్యంత సమీపం.'
