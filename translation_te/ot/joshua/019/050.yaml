source:
  edition: WLC
  text: עַל פִּ֨י יְהוָ֜ה נָ֣תְנוּ ל֗/וֹ אֶת הָ/עִיר֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶת תִּמְנַת סֶ֖רַח בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יִּבְנֶ֥ה אֶת הָ/עִ֖יר וַ/יֵּ֥שֶׁב בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
translation:
  language: te
  text: యెహోవా ఆజ్ఞ ప్రకారం, అతడు అడిగిన పట్టణమైన ఎఫ్రాయిము కొండప్రాంతంలోని తిమ్నత్-సెరహును వారు అతనికి ఇచ్చారు. అతడు ఆ పట్టణాన్ని నిర్మించి[a] అందులో నివసించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “పునర్నిర్మించాడు” లేదా “బాగుచేశాడు.” హీబ్రూ క్రియ సాధారణంగా “నిర్మించాడు” అని అర్థమిస్తుంది; ఈ సందర్భంలో ఇప్పటికే ఉన్న పట్టణాన్ని పునర్నిర్మించడం లేదా బాగుచేయడం అనే భావం కూడా ఉండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  rationale: עַל־פִּי అనే హీబ్రూ నుడికారం అధికారపూర్వకమైన ఆదేశాన్ని సూచిస్తుంది. ‘ఆజ్ఞ ప్రకారం’ సహజమైన ఆధునిక తెలుగు; יְהוָהను వ్యక్తిగత దైవనామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: נָתְנוּ לוֹ
  choice: వారు అతనికి ఇచ్చారు
  rationale: హీబ్రూ బహువచన కర్తను, పరోక్ష కర్మను స్పష్టంగా నిలుపుతూ సహజమైన తెలుగు క్రమాన్ని వాడాం.
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  choice: అతడు అడిగిన పట్టణం
  rationale: שׁאל ఇక్కడ కోరడం లేదా అడగడం అనే అర్థంలో ఉంది. ‘అడిగిన’ మూలంలోని సరళతను కాపాడుతుంది.
- source_word: תִּמְנַת סֶרַח
  choice: తిమ్నత్-సెరహు
  rationale: స్థలనామాన్ని అనువదించకుండా, తెలుగులో పలకడానికి అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: בְּהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలోని
  rationale: הַר ఇక్కడ ఒకే పర్వతం కంటే విస్తృతమైన కొండప్రాంతాన్ని సూచిస్తుంది.
- source_word: וַיִּבְנֶה אֶת הָעִיר
  choice: అతడు ఆ పట్టణాన్ని నిర్మించాడు
  rationale: בנה యొక్క ప్రాథమిక అర్థం ‘నిర్మించు.’ అప్పటికే పట్టణం ప్రస్తావించబడినందున ‘పునర్నిర్మించాడు’ అనేది సందర్భోచిత ప్రత్యామ్నాయం; దానిని పాదసూచనలో ఉంచాం.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: అందులో నివసించాడు
  rationale: ישׁבకు ఇక్కడ ‘నివసించు’ అనే అర్థం సహజంగా సరిపోతుంది; ఆధునిక గౌరవప్రదమైన తెలుగులో ఇదే స్పష్టమైన రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. అందువల్ల దాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- issue: בנה క్రియలో సందర్భసిద్ధమైన భావం
  choice: నిర్మించాడు
  alternative: పునర్నిర్మించాడు / బాగుచేశాడు
  rationale: మూలక్రియ స్వయంగా పునర్నిర్మాణాన్ని నిర్దిష్టంగా చెప్పదు. పట్టణం ముందే ఉన్నట్లు సందర్భం సూచించినా, ఆ భావాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చకుండా నిజమైన అర్థసందిగ్ధతను పాదసూచనలో నిలిపాం.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, అయినా వచనానికి తగిన గౌరవప్రదమైన కథనశైలిని వాడాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగులో సహజంగా అమర్చాం; భౌగోళిక పదాన్ని ‘కొండప్రాంతం’గా స్పష్టం చేశాం.
