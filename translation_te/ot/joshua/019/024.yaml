  text: The fifth lot came out for the tribe of the sons of Asher[a], according to their clans.
translation:
  language: te
  text: ఆశేరు కుమారుల గోత్రానికి, వారి వంశాల ప్రకారం, ఐదవ చీటి వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆశేరు కుమారుల గోత్రానికి, వారి కుటుంబాల ప్రకారం, ఐదవ చీటి తీయబడింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: వచ్చింది
  rationale: יצא అనే క్రియకు అక్షరార్థంగా ‘బయటికి వెళ్లడం/రావడం’ అనే భావం ఉంది. చీట్లు వేసే సందర్భంలో ‘వచ్చింది’ సహజమైన తెలుగులో మూలంలోని రూపకాన్ని నిలుపుతుంది; ‘తీయబడింది’ అనేది సందర్భానుసారమైన వివరణాత్మక అనువాదం.
- source_word: הַגּוֹרָל
  choice: చీటి
  rationale: גורל ఇక్కడ నిర్ణయం కోసం వేసిన చీటిని లేదా దాని ఫలితాన్ని సూచిస్తుంది. ‘చీటి’ పంపిణీ ప్రక్రియను స్పష్టంగా తెలియజేస్తూ మూలార్థానికి దగ్గరగా ఉంటుంది.
- source_word: הַחֲמִישִׁי
  choice: ఐదవ
  rationale: ‘చీటి’ని విశేషించే క్రమసంఖ్యకు నేరమైన అనువాదం.
- source_word: לְמַטֵּה
  choice: గోత్రానికి
  rationale: מַטֶּה అక్షరార్థంగా ‘దండం’ అని కూడా అర్థమిచ్చినా, భూభాగాల పంపిణీ సందర్భంలో స్థిరంగా ‘గోత్రం’ను సూచిస్తుంది.
- source_word: בְנֵי אָשֵׁר
  choice: ఆషేరు కుమారుల
  rationale: ‘ఆషేరు కుమారులు’ అనే వంశావళి రూపాన్ని నిలుపుతూ, గోత్రపరమైన సమూహాన్ని సూచిస్తుంది.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחוֹת గోత్రంలోని కుటుంబ-వంశ సమూహాలను సూచిస్తుంది. ‘వంశాల ప్రకారం’ అనే పదబంధం לְ యొక్క పంపిణీ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చీటి వచ్చింది’ అనే సాధారణ ప్రయోగం హెబ్రీ క్రియలోని రూపకాన్ని నిలుపుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత ప్రత్యామ్నాయ అనువాదంతో సరిపోలుతుంది.
