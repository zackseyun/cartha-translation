source:
  edition: WLC
  text: אֵ֣לֶּה הַ/נְּחָלֹ֡ת אֲשֶׁ֣ר נִחֲל֣וּ אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וִ/יהוֹשֻׁ֪עַ בִּן נ֟וּן וְ/רָאשֵׁ֣י הָֽ/אָב֣וֹת לְ/מַטּוֹת֩ בְּנֵי יִשְׂרָאֵ֨ל בְּ/גוֹרָ֤ל בְּ/שִׁלֹה֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יְכַלּ֕וּ מֵֽ/חַלֵּ֖ק אֶת הָ/אָֽרֶץ׀־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
translation:
  language: te
  text: యాజకుడైన ఎలియాజరు, నూను కుమారుడైన యెహోషువ, ఇశ్రాయేలు కుమారుల[a] గోత్రాల పితృకుటుంబాల పెద్దలు షిలోహులో యహ్వే సన్నిధిలో, సమావేశపు గుడారం ప్రవేశద్వారం వద్ద, చీట్ల ద్వారా పంచి ఇచ్చిన స్వాస్థ్యాలు ఇవే. ఆ విధంగా వారు దేశాన్ని పంచడం ముగించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఈ సంప్రదాయ వంశనామం ఇక్కడ ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
    reason: మూలంలోని లింగసూచక బంధుత్వ ప్రయోగాన్ని నిలుపుతూ దాని సమూహార్థాన్ని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: הַנְּחָלֹת
  choice: స్వాస్థ్యాలు
  rationale: నַחֲלָה అనే పదంలోని వారసత్వపు ఆస్తి, కేటాయించబడిన భూభాగం అనే రెండు భావాలనూ ‘స్వాస్థ్యాలు’ సహజంగా నిలుపుతుంది.
- source_word: נִחֲלוּ
  choice: పంచి ఇచ్చిన
  rationale: ఇక్కడ నחל క్రియ గోత్రాలకు స్వాస్థ్యాలను కేటాయించి అందజేయడాన్ని సూచిస్తుంది; ‘పంచి ఇచ్చిన’ పరిపాలనా చర్యను సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְרָאשֵׁי הָאָבוֹת לְמַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల గోత్రాల పితృకుటుంబాల అధిపతులు
  rationale: ‘పితృకుటుంబాలు’ ప్రాచీన ఇశ్రాయేలు వంశాధారిత సామాజిక నిర్మాణాన్ని నిలుపుతుంది; ‘అధిపతులు’ నాయకత్వ హోదాను స్పష్టంగా తెలుపుతుంది.
- source_word: בְּגוֹרָל
  choice: చీట్ల ద్వారా
  rationale: గోరాల్ ద్వారా నిర్ణయించిన కేటాయింపును సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: לִפְנֵי యొక్క సన్నిధి భావాన్ని సహజంగా వ్యక్తపరుస్తూ, יהוה అనే దైవనామాన్ని పేరుగానే ఉంచుతుంది.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: אֹהֶל מוֹעֵדకు స్థిరమైన, పారదర్శకమైన తెలుగు పదబంధాన్ని ఉపయోగించి, פֶּתַחను ‘ప్రవేశద్వారం’గా స్పష్టంగా అనువదిస్తుంది.
- source_word: וַיְכַלּוּ מֵחַלֵּק אֶת הָאָרֶץ
  choice: ఆ విధంగా వారు దేశాన్ని పంచడం ముగించారు
  rationale: కథన ముగింపునూ, భూవిభజన పూర్తయిన ఫలితాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో పేరుగా ప్రతిబింబిస్తుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక బంధుత్వ ప్రయోగం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని రూపకల్పనను ప్రధాన పాఠ్యంలో నిలుపుతూ, ఇది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే సంప్రదాయ వంశనామమని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘స్వాస్థ్యాలు,’ ‘పితృకుటుంబాలు,’ ‘ప్రత్యక్ష గుడారం’ వంటి బైబిలు సందర్భానికి అవసరమైన పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకుడికి సహజంగా తీర్చిదిద్దాం.
