  rationale: మూలంలోని אֹהֶל מוֹעֵדకు ఖచ్చితమైన, తెలుగు బైబిలు వినియోగంలో అర్థమయ్యే ‘సమావేశపు గుడారం’ను పునరుద్ధరించాం. నాయకుల పదబంధాన్ని సహజంగా, మూలంలోని వంశ-తెగ సంబంధాన్ని స్పష్టంగా చూపేలా స్వల్పంగా సవరించాం. మిగిలిన పదాలు, దైవనామం, పాదటిప్పణి మూలానికి మరియు ఇచ్చిన ఆంగ్ల పరిశీలనకు అనుగుణంగా ఉన్నాయి.
