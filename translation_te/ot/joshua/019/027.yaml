id: JOS.19.27
reference: Joshua 19:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁ֨ב מִזְרַ֣ח הַ/שֶּׁמֶשׁ֮ בֵּ֣ית דָּגֹן֒ וּ/פָגַ֣ע בִּ֠/זְבֻלוּן וּ/בְ/גֵ֨י יִפְתַּח אֵ֥ל צָפ֛וֹנָ/ה בֵּ֥ית הָעֵ֖מֶק וּ/נְעִיאֵ֑ל וְ/יָצָ֥א אֶל כָּב֖וּל מִ/שְּׂמֹֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
translation:
  language: te
  text: ఆ సరిహద్దు సూర్యోదయ దిశగా తూర్పువైపు బేత్-దాగోను వైపు తిరిగి, జెబూలూను ప్రాంతానికీ, ఉత్తర దిశగా ఇఫ్తా-ఏలు లోయకూ, బేత్-ఏమెకుకూ, నెయీయేలుకూ చేరింది; తరువాత అది ఎడమవైపు నుండి కాబూలుకు బయటికి సాగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘ఎడమవైపు నుండి’ అని ఉంది. తూర్పు వైపు ముఖం పెట్టుకొని దిశలను చెప్పే సందర్భంలో ‘ఎడమవైపు’ ఉత్తర దిక్కును సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁב
  choice: తిరిగి
  rationale: సరిహద్దు వర్ణనలో ఈ క్రియ సరిహద్దు దిశ మారడాన్ని సూచిస్తుంది; కథనార్థంలోని ‘తిరిగి వచ్చింది’ అని కాకుండా భౌగోళిక మలుపుగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: సూర్యోదయ దిశగా తూర్పున
  rationale: అక్షరార్థంగా ‘సూర్యుడు ఉదయించే దిశగా’; ‘తూర్పున’ అనే భౌగోళిక భావంతో పాటు హీబ్రూ నుడికారంలోని దృశ్యాన్ని కూడా నిలుపుతుంది.
- source_word: בֵּית דָּגֹן
  choice: బేత్-దాగోను
  rationale: స్థలనామాన్ని అర్థానువాదం చేయకుండా తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וּפָגַע
  choice: చేరి
  rationale: సరిహద్దు వర్ణనల్లో మరొక ప్రాంతం లేదా సరిహద్దుతో కలిసే స్థితిని ఈ క్రియ సూచిస్తుంది; ‘చేరి’ ఆ భౌగోళిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בִּזְבֻלוּן
  choice: జెబూలూను ప్రాంతానికి
  rationale: ఇక్కడ వ్యక్తికన్నా గోత్ర ప్రాంతంతో సరిహద్దు కలవడం ఉద్దేశం; స్పష్టత కోసం ‘ప్రాంతం’ చేర్చబడింది.
- source_word: וּבְגֵי יִפְתַּח אֵל
  choice: ఇఫ్తా-ఏలు లోయకు
  rationale: גֵי అనే సాధారణ నామాన్ని ‘లోయ’గా అనువదించి, יִפְתַּח אֵל అనే స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: צָפוֹנָה
  choice: ఉత్తరం వైపున ఉన్న
  rationale: ఉత్తర దిశ లేదా ఉత్తర భాగాన్ని సూచించే క్రియావిశేషణ భావాన్ని నిలుపుతుంది; అది ప్రయాణ దిశనా, లోయ స్థితినా అన్న వాక్యనిర్మాణ సంబంధాన్ని అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: בֵּית הָעֵמֶק
  choice: బేత్-ఏమెకు
  rationale: స్థలనామాన్ని ‘లోయ ఇల్లు’ అని అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం.
- source_word: וּנְעִיאֵל
  choice: నెయీయేలు
  rationale: స్థలనామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: וְיָצָא
  choice: బయటికి వెళ్లింది
  rationale: సరిహద్దు రేఖ తదుపరి గుర్తు వైపు వెలువడడం లేదా సాగిపోవడాన్ని తెలిపే సాధారణ సరిహద్దు సూత్రాన్ని పారదర్శకంగా అనువదిస్తుంది.
- source_word: אֶל כָּבוּל
  choice: కాబూలుకు
  rationale: ప్రాచీన స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: מִשְּׂמֹאל
  choice: ఎడమవైపున
  rationale: హీబ్రూ పాఠంలోని స్పష్టమైన ‘ఎడమ’ అనే పదాన్ని ప్రధాన వచనంలో నిలిపి, అది ఉత్తరాన్ని సూచించవచ్చనే భౌగోళిక వివరణను పాదసూచికకు పరిమితం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన భౌగోళిక వర్ణనగా రూపొందించబడింది. స్థలనామాలు అనువదించకుండా లిప్యంతరీకరించబడ్డాయి; సరిహద్దును సూచించే కర్తను తొలి వాక్యంలో స్పష్టంగా చేర్చాం. హీబ్రూ వాక్యంలోని దీర్ఘ శ్రేణిని చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించాం.
