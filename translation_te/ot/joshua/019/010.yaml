translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. గోత్ర భూవిభజనకు సంబంధించిన ‘చీటి’, ‘వంశాలు’, ‘స్వాస్థ్యం’, ‘సరిహద్దు’ వంటి పదాలను స్పష్టతతో కూడిన బైబిలు సందర్భానుకూల పదాలుగా ఎంచుకున్నాం.
