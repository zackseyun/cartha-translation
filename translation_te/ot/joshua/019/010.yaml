  text: וַ/יַּ֨עַל֙ הַ/גּוֹרָ֣ל הַ/שְּׁלִישִׁ֔י לִ/בְנֵ֥י זְבוּלֻ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יְהִ֛י גְּב֥וּל נַחֲלָתָ֖/ם עַד שָׂרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/010.yaml
  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
translation:
  language: te
  text: మూడవ చీటి జెబూలూను కుమారుల కోసం, వారి వంశాల ప్రకారం, వచ్చింది. వారి స్వాస్థ్యపు సరిహద్దు సారీదు వరకు ఉండింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: వచ్చింది
  rationale: עלה అనే క్రియ అక్షరార్థంగా ‘పైకి వెళ్లడం/రావడం’ అని అర్థం. చీటి వేయడం అనే సందర్భంలో ‘చీటి వచ్చింది’ అనేది సహజమైన తెలుగు ప్రయోగం; మూలంలోని రూపకాన్ని కూడా కొంతవరకు నిలుపుతుంది.
- source_word: הַגּוֹרָל הַשְּׁלִישִׁי
  choice: మూడవ చీటి
  rationale: గోరాల్ అనేది భూభాగాన్ని నిర్ణయించడానికి వేసిన చీటిని సూచిస్తుంది; ordinal adjectiveను నేరుగా ‘మూడవ’గా అనువదించాం.
- source_word: לִבְנֵי זְבוּלֻן
  choice: జెబూలూను కుమారులకు
  rationale: בני అనే కుటుంబ-గోత్ర సంబంధ పదానికి అక్షరార్థమైన ‘కుమారులు’ను నిలిపి, జెబూలూను గోత్రసంతతిని సూచించే విధంగా అనువదించాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: భూవిభజన సందర్భంలో משפחה గోత్రంలోని వంశ విభాగాలను సూచిస్తుంది. ‘వంశాల ప్రకారం’ పంపిణీ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גְּבוּל נַחֲלָתָם
  choice: వారి స్వాస్థ్యపు సరిహద్దు
  rationale: גבולను ‘సరిహద్దు’గా, נחלהను ఒడంబడిక సంబంధమైన వారసత్వ భూమి భావాన్ని మోసే ‘స్వాస్థ్యం’గా అనువదించాం.
- source_word: עַד שָׂרִיד
  choice: శారీదు వరకు
  rationale: సరిహద్దు ఎంతదూరం వ్యాపించిందో తెలిపే עדను ‘వరకు’గా, స్థలనామాన్ని ‘శారీదు’గా లిప్యంతరీకరించాం.
