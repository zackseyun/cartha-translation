translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే భౌగోళిక వర్ణన. ‘సరిహద్దు’ను వాక్యకర్తగా స్పష్టంగా చేర్చడం సందర్భానుసారమైన అన్వయ స్పష్టీకరణ. అన్ని స్థలనామాలు మూల హీబ్రూకు సమీపంగా లిప్యంతరీకరించబడ్డాయి.
