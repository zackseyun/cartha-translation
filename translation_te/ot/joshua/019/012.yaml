id: JOS.19.12
reference: Joshua 19:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁ֣ב מִ/שָּׂרִ֗יד קֵ֚דְמָ/ה מִזְרַ֣ח הַ/שֶּׁ֔מֶשׁ עַל גְּב֥וּל כִּסְלֹ֖ת תָּבֹ֑ר וְ/יָצָ֥א אֶל הַ/דָּֽבְרַ֖ת וְ/עָלָ֥ה יָפִֽיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/012.yaml
  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
translation:
  language: te
  text: ఆ సరిహద్దు శారీదు నుండి తూర్పువైపుకు, సూర్యోదయ దిశగా[a] తిరిగి, కిస్లోతు-తాబోరు సరిహద్దుకు చేరింది; దాబెరతుకు వెళ్లి, యాఫీయాకు ఎక్కింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తూర్పువైపుకు, తూర్పుదిశగా’; అక్షరార్థంగా, ‘తూర్పువైపుకు, సూర్యుడు ఉదయించే దిశగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: తిరిగి
  rationale: సరిహద్దు వర్ణనలో ఈ క్రియ దిశ మారడాన్ని సూచిస్తుంది; తెలుగులో ‘తిరిగి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: מִשָּׂרִיד
  choice: శారీదు నుండి
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, מן ఉపసర్గను ‘నుండి’గా అనువదించాం.
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  choice: తూర్పువైపు, సూర్యోదయ దిశగా
  rationale: హీబ్రూలోని రెండు తూర్పుదిశ సూచనలనూ నిలిపి, సూర్యోదయ చిత్రణను సహజమైన ఆధునిక తెలుగులో అందించాం.
- source_word: עַל גְּבוּל
  choice: సరిహద్దు వరకు
  rationale: ఈ భౌగోళిక సందర్భంలో సరిహద్దును చేరే గమనాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כִּסְלֹת תָּבֹר
  choice: కిస్లోతు-తాబోరు
  rationale: సంయుక్త స్థలనామంగా లిప్యంతరీకరించి, రెండు భాగాల సంబంధాన్ని సూచించేందుకు హైఫన్ ఉంచాం.
- source_word: וְיָצָא
  choice: వెళ్లింది
  rationale: ప్రాంత సరిహద్దు ఒక స్థలం నుండి మరో స్థలానికి సాగడాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘బయలుదేరింది’ అనే అతి అక్షరార్థాన్ని నివారిస్తుంది.
- source_word: אֶל הַדָּבְרַת
  choice: దాబెరతుకు
  rationale: హీబ్రూ నిర్దేశక ఉపపదాన్ని తెలుగు స్థలనామం ముందు విడిగా చూపకుండా, గమ్యార్థక విభక్తితో సహజంగా అనువదించాం.
- source_word: וְעָלָה
  choice: ఎక్కింది
  rationale: భూభాగంలోని ఎత్తువైపు సాగడాన్ని సూచించే క్రియ యొక్క స్థలాకృతి భావాన్ని నిలిపింది.
- source_word: יָפִיעַ
  choice: యాఫీయ
  rationale: హీబ్రూ స్థలనామంలోని మొదటి వ్యంజనాన్ని య-గా, చివరి గొంతు ధ్వనిని తెలుగు పాఠకులకు పలుకదగిన రూపంలో లిప్యంతరీకరించాం.
