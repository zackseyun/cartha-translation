translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పట్టణాల సంక్షిప్త జాబితా శైలిని నిలుపుతూ స్థలనామాలను మూల హీబ్రూకు దగ్గరగా లిప్యంతరీకరించాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలతో సరిపోలకపోవడంతో, మూలాధారానికి అనుగుణంగా [a]ను బెనేబెరాక్‌కు, [b]ను గత్‌-రిమ్మోన్‌కు జత చేశాం.
