- source_word: אַיָּלוֹן
  choice: అయ్యాలోను
  rationale: హీబ్రూ ఉచ్చారణలోని ద్విత్వ యోధ్ ధ్వనిని ‘య్యా’తో, చివరి ధ్వనిని తెలుగు పేర్ల సంప్రదాయానికి అనుగుణంగా ‘లోను’తో ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: יִתְלָה
  choice: యిత్లా
  rationale: హీబ్రూ వ్యంజనాలు మరియు స్వరరూపానికి దగ్గరగా ఉన్న నేర లిప్యంతరీకరణ; పాత ఆంగ్ల సంప్రదాయంలోని ‘జెత్లా’ రూపాన్ని మూలరూపంపై రుద్దలేదు.
