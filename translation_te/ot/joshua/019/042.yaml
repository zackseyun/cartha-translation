  rationale: ప్రతి స్థలనామానికి ముందు ఉన్న హీబ్రూ సంధాయకం జాబితా నిర్మాణాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగు శైలిలో ప్రతి పేరుకు ‘మరియు’ అని పునరావృతం చేయకుండా కామాలతో జాబితాను అందించాం.
- source_word: שַׁעֲלַבִּין
