lexical_decisions:
- source_word: חֲפָרַיִם
  choice: హఫరయీము
  rationale: పట్టణాల జాబితాలోని స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేయబడింది; -యీము ముగింపు పేరులో భాగంగా నిలుపబడింది.
- source_word: שִׁיאֹן
  choice: షీయోను
  rationale: హీబ్రూ שִׁיאֹן లోని దీర్ఘ ī ధ్వనిని స్పష్టంగా చూపుతూ, తెలుగు బైబిల్ శైలికి సహజమైన అంత్య స్వరంతో స్థలనామాన్ని లిప్యంతరీకరించబడింది.
- source_word: אֲנָחֲרַת
  choice: అనాహరతు
  rationale: మధ్యలోని హీబ్రూ ח ధ్వనికి తెలుగులో ఖచ్చిత సమానం లేనందున చదవడానికి సహజమైన ‘హ’ వాడబడింది; ఇది పేరుకు అర్థం చెప్పే అనువాదం కాదు.
- source_word: וַ / וְ
  choice: జాబితా విరామచిహ్నాలు
  rationale: హీబ్రూ సంధికారకాలు పేర్లను వరుసగా కలుపుతున్నాయి. ఆధునిక తెలుగులో చిన్న జాబితాను కామాలతో ఇవ్వడం సహజం; చివరి అంశానికి ముందు విడిగా ‘మరియు’ చేర్చడం అవసరం లేదు.
