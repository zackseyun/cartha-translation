- from: హజర్-షూయాలు[a], బాలా, ఏజెము[b].
  to: హజర్-షూయాలు[a], బాలా, మరియు ఎజెము[b].
  rationale: The revision corrects the vocalic representation of עָצֶם to ఎజెము, corrects the Baalah alternative in the note, and adds a natural final coordinator. It otherwise retains the draft’s appropriate transliteration policy, compound-name hyphenation, and restrained lexical footnote.
