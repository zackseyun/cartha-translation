translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, స్థలనామాల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. పేర్లకు తెలుగు ఉచ్చారణలో సహజమైన అంత్యాచ్చులు ఉంచబడ్డాయి; సంయుక్త స్థలనామ స్వరూపాన్ని మధ్య గీత తెలియజేస్తుంది.
