  footnotes:
  - marker: a
    text: హీబ్రూలో ‘హజర్-షూయాలు’ ఒక సంయుక్త స్థలనామం; అక్షరార్థంగా ‘నక్కల నివాసం’ లేదా ‘నక్కల గ్రామం’ అని అర్థం కావచ్చు.
    reason: lexical_alternative
