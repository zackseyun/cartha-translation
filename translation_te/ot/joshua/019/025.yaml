  text: And their border was Helkath[a], Hali, Beten, and Akshaph.
translation:
  language: te
  text: వారి సరిహద్దు హెల్కత్, హలీ, బేతెన్, అక్షాఫ్[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షాఫ్‌కు ప్రత్యామ్నాయ లిప్యంతరీకరణ: ‘అక్సాఫు’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉన్నాయి
  rationale: హయా క్రియ యొక్క వయిక్టోల్ రూపం సరిహద్దు పట్టిక కథనాన్ని కొనసాగిస్తుంది. తెలుగులో స్థలాల బహువచన జాబితాకు అనుగుణంగా వాక్యాంతంలో ‘ఉన్నాయి’ సహజంగా ఉంటుంది.
- source_word: גְּבוּלָם
  choice: వారి సరిహద్దులో
  rationale: గెవూల్ ఇక్కడ గోత్రానికి కేటాయించిన ప్రాంతపు సరిహద్దు లేదా దానిని నిర్దేశించే పట్టణాల వరుసను సూచిస్తుంది. పట్టణాల జాబితాతో సహజంగా కలిసేందుకు ‘వారి సరిహద్దులో’ అని ఇచ్చాం; ‘వారి సరిహద్దు’ అనేది మరింత అక్షరార్థ ప్రత్యామ్నాయం.
- source_word: חֶלְקַת
  choice: హెల్కత్
  rationale: ఇది స్థలనామం; అర్థానువాదం చేయకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וַחֲלִי
  choice: హలీ
  rationale: ఇది స్థలనామం. ఆరంభ ח ధ్వనిని సాధారణ తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా ‘హ’తో సూచించాం.
- source_word: וָבֶטֶן
  choice: బేతెన్
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְאַכְשָׁף
  choice: అక్షాఫ్
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; సంప్రదాయ రూపమైన ‘అక్సాఫు’ను పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన భూభాగ-జాబితా శైలిని వాడాం. పేర్లను అనువదించకుండా లిప్యంతరీకరించాం. మూలంలోని వరుస సంధికారకాలను తెలుగులో కామాలతో సహజంగా వ్యక్తం చేశాం.
