translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూవిభజన జాబితా ముగింపు సూత్రానికి తగిన సంక్షిప్తమైన గంభీర శైలి. హీబ్రూలో స్పష్టమైన కాలక్రియ లేనందున ‘ఇది’ అని ఉంచి కాలభేదాన్ని బలవంతంగా నిర్ణయించలేదు.
