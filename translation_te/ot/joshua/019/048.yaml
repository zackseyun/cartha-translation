id: JOS.19.48
reference: Joshua 19:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי דָ֖ן לְ/מִשְׁפְּחֹתָ֑/ם הֶֽ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/048.yaml
  text: 'This was the inheritance of the tribe of the sons of Dan[b][a], according to their clans: these cities with their villages.'
translation:
  language: te
  text: 'వారి వంశాల ప్రకారం దాను సంతతి గోత్రానికి చెందిన స్వాస్థ్యం ఇదే: ఈ పట్టణాలు, వాటి గ్రామాలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: ఇది
  rationale: హీబ్రూలో కాలాన్ని తెలిపే క్రియ లేకుండా ఉన్న సూచక సర్వనామం. తెలుగు సారాంశ సూత్రంలో ‘ఇది’ సహజంగా ఉండి, వర్తమానమా గతమా అనే అనవసర నిర్ణయాన్ని విధించదు.
- source_word: נַחֲלַת
  choice: లభించిన స్వాస్థ్యం
  rationale: భూవిభజన సందర్భంలోని కేటాయించబడిన భాగాన్నీ, వారసత్వ స్వాధీన భావాన్నీ ‘స్వాస్థ్యం’ నిలుపుతుంది; ‘లభించిన’ అనే పదం వాక్యాన్ని సహజ తెలుగులో కలుపుతుంది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: ఇక్కడ ఇది ‘దండం’ అనే అక్షరార్థంలో కాక, ఇశ్రాయేలు గోత్రాన్ని సూచించే స్థిర సందర్భార్థంలో ఉంది.
- source_word: בְנֵי דָן
  choice: దాను సంతతి
  rationale: హీబ్రూ ‘దాను కుమారులు’ అనే వంశసంబంధ వ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో తెలుపుతుంది; ఇది కేవలం ప్రత్యక్ష కుమారులనే సూచిస్తున్నట్టు అపార్థం రాకుండా చేస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: ఇక్కడ מִשְׁפָּחוֹת అణు కుటుంబాలకన్నా గోత్రంలోని బంధుత్వ ఉపవిభాగాలను సూచిస్తుంది; ‘వంశాలు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాలు
  rationale: ముందు పేర్కొన్న ప్రదేశాల జాబితాను తిరిగి సూచించే సరళమైన అనువాదం.
- source_word: וְחַצְרֵיהֶן
  choice: వాటి గ్రామాలు
  rationale: חָצֵר ఇక్కడ పట్టణాలకు అనుబంధమైన చిన్న నివాస ప్రాంతాలను సూచిస్తుంది; ‘గ్రామాలు’ సాధారణ పాఠకులకు స్పష్టమైన సమానార్థకం.
