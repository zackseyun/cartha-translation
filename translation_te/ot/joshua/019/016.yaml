translation:
  language: te
  text: 'ఇది జెబూలూను కుమారుల వంశాలవారీ స్వాస్థ్యం[a]: ఈ పట్టణాలు, వాటి గ్రామాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ఇక్కడ క్రియ లేదు. కాబట్టి ఈ సారాంశ వాక్యాన్ని వర్తమానంగానూ, కథన సందర్భంలో భూతకాలంగానూ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: ఇది
  rationale: స్త్రీలింగ ఏకవచన సూచనపదం ముందుగా పేర్కొన్న భూభాగాన్ని సూచిస్తుంది. హీబ్రూ వాక్యంలో క్రియ లేకపోవడంతో, కాలాన్ని అనవసరంగా నిర్ణయించకుండా తెలుగులో సహజంగా ‘ఇది’ అని ఉంచాం.
- source_word: נַחֲלַת
  choice: స్వాస్థ్యం
  rationale: భూమి పంపిణీ సందర్భంలో వారసత్వంగా పొందిన భూభాగం అనే న్యాయపరమైన, నిబంధనపరమైన భావాలను ‘స్వాస్థ్యం’ నిలుపుతుంది.
- source_word: בְּנֵי זְבוּלֻן
  choice: జెబూలూను కుమారులు
  rationale: మూలంలోని కుటుంబసంబంధ రూపమైన ‘జెబూలూను కుమారులు’ను నిలిపి, అది గోత్ర సమూహాన్ని సూచించేలా సహజమైన తెలుగు విభక్తితో అందించాం.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: వంశాలవారీ
  rationale: לְ ఇక్కడ పంపిణీ లేదా వర్గీకరణను సూచిస్తుంది; గోత్రంలోని కుటుంబ విభాగాల ప్రకారం అనే భావాన్ని ‘వంశాలవారీ’ సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాలు
  rationale: ముందు జాబితా చేసిన పట్టణాలను సంగ్రహంగా తిరిగి సూచించే నిర్దిష్ట పదబంధం.
- source_word: וְחַצְרֵיהֶן
  choice: వాటి గ్రామాలు
  rationale: పట్టణాలకు అనుబంధంగా ఉన్న చిన్న గ్రామీణ నివాసాలను సూచించే חָצֵר కు ఈ సందర్భంలో ‘గ్రామాలు’ స్పష్టమైన ఆధునిక తెలుగు సమానం.
theological_decisions:
- issue: క్రియలేని హీబ్రూ సారాంశ వాక్యంలో కాలం
  choice: ప్రధాన పాఠ్యంలో కాలాన్ని నిర్దిష్టం చేయని ‘ఇది … స్వాస్థ్యం’
  alternative: ‘ఇది … స్వాస్థ్యంగా వచ్చింది’
  rationale: మూలంలో వర్తమాన లేదా భూతకాల సహాయక క్రియ లేదు. అందువల్ల ప్రధాన పాఠ్యం అసలు అస్పష్టతను నిలుపుతుంది; కథన సారాంశంగా భూతకాల భావం సాధ్యమని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. భూవిభజన సందర్భానికి తగిన ‘స్వాస్థ్యం’, ‘వంశాలవారీ’ పదాలను వాడి, చివరి సమానాధికార పదబంధాన్ని ద్విబిందువుతో స్పష్టంగా చూపించాం.
