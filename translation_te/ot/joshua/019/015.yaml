base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
translation:
  language: te
  text: కట్టాత్, నహలాల్, షిమ్రోన్, ఇదాలా, బేత్లెహేము[a]—వాటి గ్రామాలతో కూడిన పన్నెండు పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘బేత్లెహేము’ ఒక స్థలనామం; దీనిని ‘రొట్టె ఇల్లు’ అని అర్థానువాదం చేయలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַטָּת
  choice: కట్టాతు
  rationale: హీబ్రూ స్థలనామాన్ని అనువదించకుండా, తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించబడింది.
- source_word: נַהֲלָל
  choice: నహలాలు
  rationale: ఇది స్థలనామం; హీబ్రూ ధ్వనులకు సమీపంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: שִׁמְרוֹן
  choice: షిమ్రోను
  rationale: హీబ్రూ స్థలనామాన్ని దాని ధ్వనిరూపానికి సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: יִדְאֲלָה
  choice: ఇదలాహు
  rationale: ఆదిలోని హీబ్రూ యోధ్ ఇక్కడ స్వరధ్వనిగా వినిపించేందున ‘ఇ’తో, చివరి ధ్వని ‘హు’తో సూచించబడింది.
- source_word: בֵית לָחֶם
  choice: బేత్లెహేము
  rationale: పదభాగాలకు ‘రొట్టె ఇల్లు’ అనే వ్యుత్పత్తి అర్థం ఉన్నప్పటికీ, ఇది స్థలనామం కాబట్టి అనువదించకుండా ప్రాచుర్యంలో ఉన్న తెలుగు రూపంలో ఇచ్చాం.
- source_word: עָרִים
  choice: పట్టణాలు
  rationale: ప్రాదేశిక జాబితాలోని జనావాసాలను సూచించే సాధారణ పదం; ఆధునిక తెలుగులో ‘పట్టణాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: పన్నెండు
  rationale: పట్టణాల సంఖ్యను సూచించే హీబ్రూ సంఖ్యాపదానికి నేరమైన తెలుగు సమానం.
- source_word: חַצְרֵיהֶן
  choice: వాటి గ్రామాలు
  rationale: ప్రధాన పట్టణాలకు అనుబంధంగా ఉన్న చిన్న లేదా ప్రాకారంలేని జనావాసాలను సూచిస్తుంది; ‘వాటి గ్రామాలు’ ఈ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
