translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రాదేశిక పట్టణాల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ వాక్యాంతంలోని ‘పన్నెండు పట్టణాలు, వాటి గ్రామాలు’ అనే నిర్మాణం తెలుగులో సహజంగా ఉండేందుకు ‘వాటి గ్రామాలతో కలిపి మొత్తం పన్నెండు పట్టణాలు’గా అమర్చబడింది.
