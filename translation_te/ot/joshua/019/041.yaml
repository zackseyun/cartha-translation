translation:
  language: te
  text: 'వారి స్వాస్థ్యపు సరిహద్దు ఇలా ఉంది: సోరా, ఎష్టాయోలు, ఈర్-షెమెషు[a].'
  philosophy: optimal-equivalence
  footnotes:
