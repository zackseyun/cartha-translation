    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉంది (తెలుగులో సహజ వాక్యనిర్మాణంలో అంతర్లీనంగా)
  rationale: హయా క్రియ యొక్క వావ్-కన్సెక్యూటివ్ కథన అనుసంధానాన్ని చూపుతుంది. స్థలాల జాబితాతో కూడిన ఈ వాక్యంలో తెలుగులో ప్రత్యేకంగా ‘అది సంభవించింది’ అని చెప్పకుండా, ‘సరిహద్దు ...’ అనే సహజ నామవాక్య నిర్మాణం భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: גְּבוּל
  choice: సరిహద్దు
  rationale: యెహోషువలో భూభాగాల పంచింపు సందర్భంలో ఈ పదం గోత్ర స్వాస్థ్యపు హద్దు లేదా సరిహద్దును సూచిస్తుంది; వెంట వచ్చే స్థలనామాల జాబితాకు ‘సరిహద్దు’ సరిపోతుంది.
- source_word: נַחֲלָתָם
  choice: వారి స్వాస్థ్యపు
  rationale: נַחֲלָה గోత్రానికి కేటాయింపుగా లభించిన వారసత్వ భూమిని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఆ భూమి వారసత్వ స్వభావాన్ని నిలుపుతుంది; బహువచన ప్రత్యయం ముందుగా పేర్కొన్న దాను గోత్రస్థులను సూచిస్తుంది.
- source_word: צָרְעָה
  choice: సోరా
  rationale: హీబ్రూ స్థలనామానికి తెలుగులో బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: אֶשְׁתָּאוֹל
  choice: ఎష్టాయోలు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగులో పలకడానికి అనుకూలంగా లిప్యంతరీకరించింది.
- source_word: עִיר שָׁמֶשׁ
  choice: ఈర్‌షెమెషు
  rationale: స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించింది; దాని పారదర్శక అర్థమైన ‘సూర్యుని పట్టణం’ను పాదసూచికలో ఇచ్చింది.
