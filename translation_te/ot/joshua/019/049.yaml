source:
  edition: WLC
  text: וַ/יְכַלּ֥וּ לִ/נְחֹל אֶת הָ/אָ֖רֶץ לִ/גְבֽוּלֹתֶ֑י/הָ וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל נַחֲלָ֛ה לִ/יהוֹשֻׁ֥עַ בִּן נ֖וּן בְּ/תוֹכָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/049.yaml
  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
translation:
  language: te
  text: వారు దేశాన్ని దాని ప్రాంతాల ప్రకారం[a] స్వాస్థ్యభాగాలుగా పంచడం ముగించినప్పుడు, ఇశ్రాయేలు కుమారులు[b] తమ మధ్య నూను కుమారుడైన యెహోషువకు ఒక స్వాస్థ్యభాగాన్ని ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని సరిహద్దుల ప్రకారం.” హీబ్రూ పదం సరిహద్దు రేఖలనూ, వాటిచేత ఏర్పడిన ప్రాంతీయ విభాగాలనూ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇశ్రాయేలీయులు.” అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ לִנְחֹל
  choice: స్వాస్థ్యంగా పంచడం ముగించినప్పుడు
  rationale: כלה పూర్తయిన చర్యను సూచిస్తుంది; נחל ఈ భూవిభజన సందర్భంలో గోత్రాలకు స్వాస్థ్యభాగాలను కేటాయించడాన్ని సూచిస్తుంది. తెలుగులో కాలసంబంధాన్ని సహజంగా చూపుతూ ఈ అర్థాన్ని నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: దేశాన్ని
  rationale: యెహోషువ గ్రంథంలోని సందర్భంలో ఇది సమస్త భూమిని కాక, ఇశ్రాయేలుకు కేటాయించబడిన కనాను దేశాన్ని సూచిస్తుంది.
- source_word: לִגְבוּלֹתֶיהָ
  choice: దాని ప్రాంతాల ప్రకారం
  rationale: גְּבוּל అనే పదం సరిహద్దులనూ వాటితో నిర్వచితమైన ప్రాంతాలనూ సూచించగలదు. ప్రధాన పాఠంలో భూవిభజన సందర్భానికి సహజమైన ‘ప్రాంతాలు’ వాడి, ‘సరిహద్దులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיִּתְּנוּ
  choice: ఇచ్చారు
  rationale: נתן యొక్క సాధారణ అర్థమైన ‘ఇవ్వడం’ను నిలుపుతుంది; అధికారిక కేటాయింపు భావం సందర్భం వల్ల స్పష్టమవుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ జాతీయ సంజ్ఞను రూపపరంగా పారదర్శకంగా నిలుపుతుంది; సహజమైన ‘ఇశ్రాయేలీయులు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- source_word: נַחֲלָה
  choice: ఒక స్వాస్థ్యాన్ని
  rationale: భూమి కేటాయింపులోని న్యాయపరమైన, నిబంధనాత్మకమైన వారసత్వ భావాన్ని ‘స్వాస్థ్యం’ సముచితంగా నిలుపుతుంది.
- source_word: לִיהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువకు
  rationale: వ్యక్తినామాన్నీ పితృనామాన్నీ సహజమైన ఆధునిక తెలుగు నిర్మాణంలో అందిస్తుంది.
- source_word: בְּתוֹכָם
  choice: తమ మధ్య
  rationale: యెహోషువకు ఇచ్చిన స్వాస్థ్యం ఇశ్రాయేలీయుల కేటాయింపుల మధ్యనే ఉందనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని వ్యాకరణ రూపాన్నీ సంప్రదాయ జాతీయ సంజ్ఞనూ ప్రధాన పాఠంలో నిలుపుతూ, సహజమైన సమూహనామాన్ని పాదసూచికలో అందించాం.
- issue: נַחֲלָה యొక్క భూకేటాయింపు భావం
  choice: స్వాస్థ్యం
  alternative: కేటాయించిన భాగం; ఆస్తి
  rationale: ఇది కేవలం ఆధీనంలోని ఆస్తి కాక, ఇశ్రాయేలు భూవిభజనలో పొందిన కేటాయిత వారసత్వ భాగం; అందువల్ల ‘స్వాస్థ్యం’ న్యాయ-దైవశాస్త్ర సంబంధిత భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన బైబిలు శైలిని వాడాం. ‘స్వాస్థ్యం’ అనే కీలక భూ-వారసత్వ పదాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
