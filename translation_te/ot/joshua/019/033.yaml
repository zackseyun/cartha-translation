  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י גְבוּלָ֗/ם מֵ/חֵ֨לֶף מֵֽ/אֵל֜וֹן בְּ/צַעֲנַנִּ֗ים וַ/אֲדָמִ֥י הַנֶּ֛קֶב וְ/יַבְנְאֵ֖ל עַד לַקּ֑וּם וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/033.yaml
  text: And their border was from Heleph[a], from the oak in Zaannannim, and Adami-nekeb and Jabneel, as far as Lakkum[b]; and its end was at the Jordan.
translation:
  language: te
  text: వారి సరిహద్దు హేలెఫు నుండి, సానన్నీములోని ఓకు చెట్టు[a] నుండి మొదలై, అదామీ-నెకెబు, యబ్నెయేలు మీదుగా లక్కూము వరకు వెళ్లింది; దాని చివర యొర్దాను వద్ద ఉంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏలోన్-బెసానన్నీము నుండి.” హీబ్రూ పదబంధాన్ని ఒక స్థలనామంగా గానీ, “సానన్నీములోని/సానన్నీముకు చెందిన ఓకు చెట్టు” అని గానీ చదవవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా, “దాని బయలుదేరే చోటులు యొర్దాను.” ఇది సరిహద్దు చివరి భాగాలు యొర్దానును చేరాయని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: వారి సరిహద్దు
  rationale: గְבוּלָם ఇక్కడ నఫ్తాలి గోత్ర ప్రాంతపు సరిహద్దును సూచిస్తుంది; ‘వారి సరిహద్దు’ సహజమైన, సందర్భోచితమైన అనువాదం.
- source_word: מֵחֵלֶף
  choice: హేలెఫు నుండి
  rationale: ఇది స్థలనామం; హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: מֵאֵלוֹן בְּצַעֲנַנִּים
  choice: సానన్నీములోని సింధూర వృక్షం నుండి
  rationale: אֵלוֹן ఒక పెద్ద వృక్షాన్ని, ముఖ్యంగా ఓక్ లేదా టెరెబింత్ జాతి వృక్షాన్ని సూచించవచ్చు. తెలుగు పాఠకులకు బైబిలు సందర్భంలో పరిచితమైన ‘సింధూర వృక్షం’ ఎంచుకోబడింది; స్థలనామంగా చదివే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַאֲדָמִי הַנֶּקֶב
  choice: అదామీ-నెకెబు
  rationale: సరిహద్దు స్థలాల వరుసలో ఇది సంయుక్త స్థలనామంగా తీసుకొని లిప్యంతరీకరించబడింది.
- source_word: וְיַבְנְאֵל
  choice: యబ్నెయేలు
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: עַד לַקּוּם
  choice: లక్కూము వరకు
  rationale: עַד ప్రదేశ విస్తృతి ఎక్కడివరకు ఉందో సూచిస్తుంది; ‘వరకు’ దాని అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תֹצְאֹתָיו הַיַּרְדֵּן
  choice: యొర్దాను దగ్గర ముగిసింది
  rationale: ‘దాని బయలుదేరే చోటులు యొర్దాను’ అనే హీబ్రూ సరిహద్దు వర్ణనలోని నుడికారాన్ని, సరిహద్దు యొర్దాను వద్ద అంతమైందనే భావంతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
