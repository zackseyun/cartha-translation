translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సరిహద్దు జాబితా శైలిని కాపాడుతూ సహజంగా రూపొందించబడింది. స్థలనామాలు లిప్యంతరీకరించబడ్డాయి; సందిగ్ధమైన אֵלוֹן పదబంధానికి ప్రత్యామ్నాయ పఠనం పాదసూచికలో ఇవ్వబడింది. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తుకు తగిన పాదసూచిక ఉంది.
