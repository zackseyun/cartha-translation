  text: This was the inheritance of the tribe of the sons of Naphtali according to their clans—the cities and their villages[a][b].
translation:
  language: te
  text: ఇది నఫ్తాలి వంశస్థుల గోత్రానికి వారి వంశాల ప్రకారం లభించిన స్వాస్థ్యం—పట్టణాలు, వాటి గ్రామాలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: ఇది
  rationale: హీబ్రూ నామవాచక వాక్యంలో కాలాన్ని సూచించే క్రియ లేదు. కాబట్టి సందర్భాన్ని వెనుకకు చూసే భూతకాలంగా నిర్బంధించకుండా సహజమైన తెలుగు నిర్దేశక రూపాన్ని ఉంచాం.
- source_word: נַחֲלַת
  choice: లభించిన స్వాస్థ్యం
  rationale: యెహోషువ గ్రంథంలోని భూవిభజన సందర్భంలో ఇది వారసత్వంగా పొందిన భూభాగాన్ని సూచిస్తుంది. ‘స్వాస్థ్యం’ నిబంధనాత్మక వారసత్వ భావాన్ని నిలుపుతుంది; ‘లభించిన’ అనే పదం తెలుగు వాక్యాన్ని సహజంగా చేస్తుంది.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: ఇక్కడ పదానికి ‘దండం’ అనే అక్షరార్థం కాకుండా ఇశ్రాయేలు గోత్రం అనే స్థిరమైన సందర్భార్థమే ఉంది.
- source_word: בְנֵי נַפְתָּלִי
  choice: నఫ్తాలి వంశస్థులు
  rationale: అక్షరార్థంగా ‘నఫ్తాలి కుమారులు’; అయితే గోత్ర సభ్యులందరినీ సూచించే వంశపరమైన ప్రయోగం కావడంతో ఆధునిక తెలుగులో సమగ్రంగా, సహజంగా ‘వంశస్థులు’ అని అనువదించాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: భూవిభజన సందర్భంలో מִשְׁפָּחָה గోత్రంలోని వంశ విభాగాన్ని సూచిస్తుంది; לְ పంపిణీ లేదా వర్గీకరణ భావంతో ‘ప్రకారం’గా వచ్చింది.
- source_word: הֶעָרִים
  choice: పట్టణాలు
  rationale: עִיר నివాస కేంద్రాలను సూచిస్తుంది. జాబితాలో చిన్న పట్టణాలూ ఉండవచ్చు కాబట్టి ఆధునిక తెలుగులో ‘పట్టణాలు’ సహజమైన విస్తృత పదం.
- source_word: וְחַצְרֵיהֶן
  choice: వాటి గ్రామాలు
  rationale: ఈ భూవిభజన సూత్రంలో חָצֵר పట్టణాలకు అనుబంధమైన వెలుపలి గ్రామీణ నివాసాలను సూచిస్తుంది; ‘గ్రామాలు’ స్పష్టమైన ఆధునిక సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన భూవిభజన ముగింపు సూత్రంగా రూపొందించబడింది. మూలంలోని క్రియారహిత నామవాచక వాక్యాన్ని ‘ఇది’తో నిలిపి, వర్తమాన/భూతకాల ద్వంద్వార్థాన్ని అనవసరంగా పరిష్కరించలేదు. ‘నఫ్తాలి వంశస్థులు’ మూలంలోని వంశపరమైన భావాన్ని కాపాడుతూ స్త్రీలను వెలివేసే అపార్థాన్ని నివారిస్తుంది.
