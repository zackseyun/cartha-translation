  rationale: అజ్నోత్-తాబోరు అనే పేరును మూల హీబ్రూ రూపానికి దగ్గరగా సరిచేశాం; అనిశ్చితమైన పేరువ్యుత్పత్తి పాదటిప్పణిని తొలగించాం. యొర్దాను గురించిన పదబంధాన్ని మరింత నేరుగా అనువదించాం. యూదా-యొర్దాను సంబంధంలోని ప్రసిద్ధ భౌగోళిక క్లిష్టతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా, అవసరమైన పాదటిప్పణిలో స్పష్టంగా నిలిపాం.
