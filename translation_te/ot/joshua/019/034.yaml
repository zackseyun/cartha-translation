source:
  edition: WLC
  text: וְ/שָׁ֨ב הַ/גְּב֥וּל יָ֨מָּ/ה֙ אַזְנ֣וֹת תָּב֔וֹר וְ/יָצָ֥א מִ/שָּׁ֖ם חוּקֹ֑קָ/ה וּ/פָגַ֨ע בִּ/זְבֻל֜וּן מִ/נֶּ֗גֶב וּ/בְ/אָשֵׁר֙ פָּגַ֣ע מִ/יָּ֔ם וּ/בִ֣/יהוּדָ֔ה הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
translation:
  language: te
  text: అప్పుడు సరిహద్దు పడమటి వైపుకు తిరిగి అజ్నోత్-తాబోరు వరకు వెళ్లింది. అక్కడి నుంచి హుక్కోకు వరకు సాగి, దక్షిణాన జెబూలూనును, పడమట ఆశేరును తాకింది; యొర్దాను వద్ద సూర్యోదయ దిక్కున యూదాను కూడా తాకింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో, అక్షరాలా, ‘యొర్దాను వద్ద సూర్యోదయ దిక్కున యూదా’ అని ఉంది. సాధారణంగా తెలిసిన గోత్ర ప్రాంతాల ప్రకారం నఫ్తాలి ప్రాంతం యూదా ప్రాంతాన్ని నేరుగా ఆనుకుని ఉండదు కాబట్టి ఈ భౌగోళిక వాక్యం క్లిష్టంగా ఉంది. కొందరు దీనిని భిన్నంగా అర్థం చేసుకుంటారు లేదా పాఠంలో సమస్య ఉందని భావిస్తారు; ఇక్కడ హీబ్రూ పాఠాన్ని ఉన్నట్లే అనువదించాం.
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: అప్పుడు సరిహద్దు ... తిరిగి
  rationale: సరిహద్దుల వర్ణనలో שׁוב సాధారణంగా దిశ మార్చుకోవడాన్ని సూచిస్తుంది; క్రమాన్ని తెలిపే וְ భావాన్ని ‘అప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָמָּה
  choice: పడమటి వైపుకు
  rationale: పదశః ‘సముద్రం వైపుకు’; ఇక్కడ మధ్యధరా సముద్రాన్ని ఆధారంగా చేసుకున్న పడమటి దిశను సూచిస్తుంది.
- source_word: אַזְנוֹת תָּבוֹר
  choice: అజ్నోతు-తాబోరు
  rationale: స్థలనామాన్ని తెలుగులో ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְיָצָא מִשָּׁם חוּקֹקָה
  choice: అక్కడి నుంచి హుక్కోకు వరకు సాగి
  rationale: సరిహద్దు వర్ణనలో יצא ఒక స్థలం నుంచి సరిహద్దు ముందుకు కొనసాగడాన్ని సూచిస్తుంది; గమ్యసూచక ה స్థానిక ప్రత్యయాన్ని ‘వరకు’తో తెలిపాం.
- source_word: וּפָגַע
  choice: తాకింది
  rationale: ప్రాదేశిక సరిహద్దు మరో ప్రాంతానికి వచ్చి కలవడం లేదా దానితో సంపర్కం కలగడాన్ని פגע సూచిస్తుంది.
- source_word: מִנֶּגֶב
  choice: దక్షిణాన
  rationale: ఈ సరిహద్దు సంపర్కానికి జెబూలూను దక్షిణ వైపున ఉన్నదనే దిశాసంబంధాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: מִיָּם
  choice: పడమట
  rationale: పదశః ‘సముద్రం వైపు/సముద్రం నుంచి’; ఈ భౌగోళిక సందర్భంలో పడమటి వైపును సూచిస్తుంది.
- source_word: וּבִיהוּדָה הַיַּרְדֵּן מִזְרַח הַשָּׁמֶשׁ
  choice: తూర్పున, సూర్యోదయ దిక్కున, యొర్దాను దగ్గర యూదాను కూడా తాకింది
  rationale: భౌగోళికంగా క్లిష్టమైనప్పటికీ మసొరెటిక్ పాఠంలోని ‘యూదా’ను మార్చకుండా ఉంచి, వాక్యంలో ముందున్న פגע క్రియను భావానుసారం కొనసాగించాం.
theological_decisions:
- issue: ‘యొర్దాను దగ్గర యూదా’ అనే భౌగోళికంగా క్లిష్టమైన పదబంధం
  choice: మసొరెటిక్ పాఠంలోని ‘యూదా’ను ప్రధాన పాఠ్యంలో యథాతథంగా నిలిపి, క్లిష్టతను పాదటిప్పణిలో తెలిపాం.
  alternative: ‘యూదా’ లేఖక దోషమని ఊహించి పాఠాన్ని సవరించడం, లేదా నఫ్తాలి యూదాను నేరుగా సరిహద్దుగా కలిగినట్లు కనిపించకుండా వాక్యాన్ని సులభీకరించడం.
  rationale: మూల హీబ్రూ పాఠం నిజమైన పాఠ్య-భౌగోళిక ఉద్రిక్తతను కలిగి ఉంది. ఊహాత్మక సవరణతో దానిని మౌనంగా పరిష్కరించకుండా, స్వీకృత పాఠాన్ని అనువదించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బైబిలు భౌగోళిక వర్ణనకు తగిన గంభీరతతో కూడిన సహజ శైలిని ఉపయోగించాం. ‘సాగి’, ‘తాకింది’ వంటి పదాలు సరిహద్దు రేఖ కదలికను సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తాయి. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
