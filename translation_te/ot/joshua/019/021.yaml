  yaml_path: translation/ot/joshua/019/021.yaml
  text: Remeth[a], En-gannim, En-haddah, and Beth-pazzez.
translation:
  language: te
  text: రెమెత్[a], ఏన్-గన్నీమ్, ఏన్-హద్దా, మరియు బేత్-పత్సెత్సు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ స్థలనామాల్లో ‘ఏన్-గన్నీమ్’ అంటే బహుశా ‘తోటల ఊట’; ‘ఏన్-హద్దా’ అనే పేరు ‘ఊట’ అనే పదంతో మొదలవుతుంది; ‘బేత్-పత్సెత్సు’ అనే పేరు ‘ఇల్లు’ అనే పదంతో మొదలవుతుంది. ఇవి ఇక్కడ పట్టణాల పేర్లుగా వాడబడ్డాయి కాబట్టి ప్రధాన పాఠంలో లిప్యంతరీకరించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶמֶת
  choice: రెమెతు
  rationale: పట్టణాల జాబితాలోని స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: עֵין גַּנִּים
  choice: ఏన్‌-గన్నీము
  rationale: עֵין (‘నీటి ఊట’) మరియు גַּנִּים (‘తోటలు’) కలిసిన స్థలనామం. జాబితాలో పట్టణనామంగా ఉన్నందున ప్రధాన పాఠంలో లిప్యంతరీకరణను ఉంచాం.
- source_word: עֵין חַדָּה
  choice: ఏన్‌-హద్దా
  rationale: עֵין (‘నీటి ఊట’)తో మొదలయ్యే స్థలనామం; రెండవ భాగపు అర్థం ఇక్కడ నిశ్చితం కాదు. అందువల్ల మొత్తం పేరును లిప్యంతరీకరించాం.
- source_word: בֵּית פַּצֵּץ
  choice: బేత్‌-పజ్జేసు
  rationale: בֵּית (‘ఇల్లు/గృహం’)తో ఏర్పడిన స్థలనామం. భౌగోళిక జాబితాలో స్వనామంగా పనిచేస్తున్నందున అర్థానువాదం కాకుండా లిప్యంతరీకరించాం.
- source_word: וְ
  choice: మరియు అనే భావాన్ని జాబితా విరామచిహ్నాల ద్వారా వ్యక్తీకరించడం
  rationale: హీబ్రూలో ప్రతి పేరును కలిపే సంధాయకం పునరావృతమవుతుంది. సహజమైన ఆధునిక తెలుగు జాబితా శైలిలో కామాలతో సమన్వయాన్ని తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన పట్టణాల జాబితాగా రూపొందించాం. పేర్లను అనువదించకుండా తెలుగు లిపిలో హీబ్రూ రూపాలకు దగ్గరగా ఇచ్చాం; సంయుక్త స్థలనామాల భాగాలను స్పష్టంగా చూపడానికి అవిచ్ఛిన్న హైఫన్ ఉపయోగించాం.
