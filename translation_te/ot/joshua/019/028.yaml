translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భౌగోళిక సరిహద్దుల వర్ణనకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలో క్రియ స్పష్టంగా లేకపోయినా సందర్భార్థాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘ఆ సరిహద్దు సాగింది’ అని పూరించాం.
