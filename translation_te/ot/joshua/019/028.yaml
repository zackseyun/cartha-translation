lexical_decisions:
- source_word: עֶבְרֹן
  choice: ఎబ్రోను
  rationale: మసొరా పాఠంలోని స్థలనామాన్ని నేరుగా తెలుగు లిప్యంతరీకరణ చేశాం; కొన్ని పాఠసంప్రదాయాల్లో ‘అబ్దోను’ అనే భిన్న పఠనం ఉంది.
- source_word: רְחֹב
  choice: రెహోబు
  rationale: హీబ్రూ స్థలనామానికి సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: חַמּוֹן
  choice: హమ్మోను
  rationale: హీబ్రూలోని మధ్య వ్యంజన ద్విత్వాన్ని తెలుగు రూపంలో నిలిపిన స్థలనామ లిప్యంతరీకరణ.
- source_word: קָנָה
  choice: కానా
  rationale: హీబ్రూ స్థలనామాన్ని ఆధునిక తెలుగు పాఠకులకు సులభంగా పలికే రూపంలో లిప్యంతరీకరించాం.
- source_word: עַד
  choice: వరకు
  rationale: భూభాగ సరిహద్దు చేరే చివరి హద్దును సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: צִידוֹן רַבָּה
  choice: మహా సీదోను
  rationale: רַבָּה అనే విశేషణం సీదోను నగరపు ప్రాముఖ్యతను సూచిస్తుంది; నామానికి ముందున్న ‘మహా’ దానిని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: וְ
  choice: మీదుగా … సాగింది
  rationale: వరుసగా ఇచ్చిన స్థలనామాలు సరిహద్దు మార్గాన్ని సూచిస్తున్న సందర్భాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది; హీబ్రూ సంధికారకాల జాబితాను యాంత్రికంగా పునరావృతం చేయదు.
