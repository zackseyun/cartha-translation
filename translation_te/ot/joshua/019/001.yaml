translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘చీటి,’ ‘గోత్రం,’ ‘వంశాలు,’ ‘స్వాస్థ్యం’ పదాలు భూవిభజన సందర్భాన్ని స్పష్టంగా ఉంచుతాయి. ప్రధాన పాఠ్యంలో రెండు పాదసూచిక గుర్తులు చేర్చబడ్డాయి.
