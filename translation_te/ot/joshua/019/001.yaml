- from: రెండవ చీటి షిమ్యోనుకు[a]—షిమ్యోను కుమారుల గోత్రానికి, వారి వంశాల ప్రకారం—వచ్చింది. వారి స్వాస్థ్యం యూదా కుమారుల స్వాస్థ్యం మధ్యలో ఉంది.[b]
  to: రెండవ చీటి షిమ్యోనుకు[a]—షిమ్యోను కుమారుల[b] గోత్రానికి, వారి వంశాల ప్రకారం—వచ్చింది. వారి స్వాస్థ్యం యూదా కుమారుల స్వాస్థ్యంలో ఉంది.
  rationale: The revision retains the draft’s faithful terminology and clause structure, while rendering בְּתוֹךְ as “స్వాస్థ్యంలో” to express “within” without suggesting a central location. The cultural-note anchor is placed directly after the first tribal designation for clearer reference.
