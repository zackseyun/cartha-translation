source:
  edition: WLC
  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֤ל הַ/שֵּׁנִי֙ לְ/שִׁמְע֔וֹן לְ/מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחוֹתָ֑/ם וַֽ/יְהִי֙ נַֽחֲלָתָ֔/ם בְּ/ת֖וֹךְ נַחֲלַ֥ת בְּנֵֽי יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
translation:
  language: te
  text: రెండవ చీటి షిమ్యోనుకు[a]—షిమ్యోను కుమారుల[b] గోత్రానికి, వారి వంశాల ప్రకారం—వచ్చింది. వారి స్వాస్థ్యం యూదా కుమారుల స్వాస్థ్యంలో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెండవ చీటి షిమ్యోనుకు పడింది.” హీబ్రూ క్రియ అక్షరార్థంగా “బయటికి వచ్చింది”; ఇక్కడ అది చీట్లు వేయడం వల్ల వచ్చిన ఫలితాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “షిమ్యోను కుమారులు,” “యూదా కుమారులు” అనేవి హీబ్రూలో గోత్రపరమైన సంబోధనలు; అవి ఆయా పితరుల వంశస్థులను లేదా ఆ గోత్రాల సభ్యులను సూచిస్తాయి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל הַשֵּׁנִי
  choice: రెండవ చీటి ... వచ్చింది
  rationale: יצא అనే క్రియలోని ‘బయటికి రావడం’ అనే చిత్రాన్ని, చీట్లు వేయడంలో ఫలితం రావడం అనే సహజ తెలుగు ప్రయోగంతో నిలుపుతుంది; הַגּוֹרָל ను భూభాగం కాక, నిర్ణయానికి ఉపయోగించిన ‘చీటి’గా అనువదించింది.
- source_word: לְשִׁמְעוֹן לְמַטֵּה בְנֵי שִׁמְעוֹן
  choice: షిమ్యోనుకు—షిమ్యోను కుమారుల గోత్రానికి
  rationale: לְ ను గ్రహీతను సూచించే ‘కు/కి’తో ఇచ్చి, מַטֶּה ను ఈ భూవిభజన సందర్భంలో ‘గోత్రం’గా అనువదించింది. బెనె అనే హీబ్రూ గోత్రపరమైన కుటుంబ రూపకాన్ని ‘కుమారులు’గా నిలిపింది.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחוֹת ఇక్కడ ఆధునిక చిన్న కుటుంబాలను కాక, గోత్రంలోని విస్తృత వంశ సమూహాలను సూచిస్తుంది; అందువల్ల ‘వంశాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: נַחֲלָתָם
  choice: వారి స్వాస్థ్యం
  rationale: נַחֲלָה సూచించే వారసత్వంగా లభించిన భూభాగం అనే న్యాయపరమైన, నిబంధనాపరమైన భావాన్ని ‘స్వాస్థ్యం’ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: בְּתוֹךְ נַחֲלַת בְּנֵי יְהוּדָה
  choice: యూదా కుమారుల స్వాస్థ్యం మధ్యలో
  rationale: בְּתוֹךְ ను ‘మధ్యలో’గా అనువదించడం షిమ్యోను భూభాగం యూదా స్వాస్థ్య పరిధిలోనే ఉన్నదనే స్థానిక సంబంధాన్ని తెలియజేస్తుంది; נַחֲלָה కు ‘స్వాస్థ్యం’ అనే పదాన్ని స్థిరంగా వాడింది.
