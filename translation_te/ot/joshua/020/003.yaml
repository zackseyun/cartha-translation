source:
  edition: WLC
  text: לָ/נ֥וּס שָׁ֨מָּ/ה֙ רוֹצֵ֔חַ מַכֵּה נֶ֥פֶשׁ בִּ/שְׁגָגָ֖ה בִּ/בְלִי דָ֑עַת וְ/הָי֤וּ לָ/כֶם֙ לְ/מִקְלָ֔ט מִ/גֹּאֵ֖ל הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/003.yaml
  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
translation:
  language: te
  text: అనుకోకుండా, తెలియక ఒక వ్యక్తిని చంపినవాడు[a] అక్కడికి పారిపోవడానికి, అవి రక్త ప్రతీకారకుని నుండి మీకు ఆశ్రయంగా ఉంటాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చంపేవాడు.’ ఇక్కడ హీబ్రూ పదానికి ‘అనుకోకుండా,’ ‘తెలియక’ అనే మాటలు పరిమితి విధిస్తున్నాయి; కాబట్టి ఈ వచనంలో అది ఉద్దేశపూర్వక హంతకుణ్ణి సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: ‘రక్త ప్రతీకారకుడు’ అంటే ఇశ్రాయేలు బంధుత్వాధారిత న్యాయవ్యవస్థలో మరణానికి ప్రతీకారం తీర్చే బాధ్యతగల వ్యక్తి.
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  choice: అక్కడికి పారిపోయేలా
  rationale: మునుపటి ఆజ్ఞలో పట్టణాలను నియమించడంలోని ఉద్దేశాన్ని לָ ఉపసర్గతో కూడిన క్రియారూపం తెలియజేస్తుంది; శָׁמָּה దిశను సూచిస్తూ ‘అక్కడికి’ అనే భావం ఇస్తుంది.
- source_word: רוֹצֵחַ
  choice: చంపినవాడు
  rationale: ఈ సందర్భంలో వెంట వచ్చే ‘అనుకోకుండా, తెలియక’ అనే విశేషణాలు ఉద్దేశపూర్వక హత్యను మినహాయిస్తున్నాయి. కాబట్టి ‘హంతకుడు’ కంటే తటస్థమైన ఈ పదబంధం సరైనది.
- source_word: מַכֵּה נֶפֶשׁ
  choice: ఒక వ్యక్తిని చంపినవాడు
  rationale: అక్షరార్థంగా ‘ఒక ప్రాణిని/వ్యక్తిని కొట్టేవాడు’; న్యాయపరమైన ఈ ప్రయోగం మరణానికి కారణమవడాన్ని సూచిస్తుంది. తెలుగులో ‘చంపినవాడు’ ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּשְׁגָגָה בִּבְלִי דָעַת
  choice: అనుకోకుండా, తెలియక
  rationale: రెండు వేర్వేరు హీబ్రూ పదబంధాలనూ నిలిపి, చర్య ఉద్దేశపూర్వకం కాదనీ, తెలిసి చేయబడలేదనీ తెలియజేస్తుంది.
- source_word: וְהָיוּ לָכֶם לְמִקְלָט
  choice: అవి ... మీకు ఆశ్రయంగా ఉండాలి
  rationale: బహువచన క్రియ ఆశ్రయపట్టణాలను సూచిస్తుంది. సందర్భంలోని ఆజ్ఞాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఉండాలి’ వ్యక్తపరుస్తుంది.
- source_word: מִגֹּאֵל הַדָּם
  choice: రక్తప్రతీకారం తీర్చుకునేవాని నుండి
  rationale: గోత్రబంధుత్వ న్యాయవ్యవస్థలో మరణానికి ప్రతీకారం తీర్చే బాధ్యతగల వ్యక్తిని సూచించే సాంస్కృతిక-న్యాయపరమైన ప్రయోగం ఇది.
theological_decisions:
- issue: చంపిన వ్యక్తి యొక్క న్యాయపరమైన స్వభావం
  choice: ఉద్దేశపూర్వక హంతకుడిగా కాక, అనుకోకుండా మరియు తెలియక మరణానికి కారణమైన వ్యక్తిగా అనువదించడం
  alternative: ‘హంతకుడు’ లేదా సాధారణంగా ‘చంపేవాడు’ అని అనువదించడం
  rationale: בִּשְׁגָגָה మరియు בִּבְלִי דָעַת అనే జంట పదబంధాలు ఇది ఉద్దేశపూర్వక హత్య కాదని నిర్దేశిస్తున్నాయి; అందువల్ల దురుద్దేశాన్ని సూచించే పదాన్ని ప్రధాన పాఠ్యంలో నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. న్యాయపరమైన భావాన్ని స్పష్టంగా ఉంచుతూ, ఉద్దేశరహిత మరణకారణం మరియు రక్తప్రతీకారకుని సాంస్కృతిక పాత్ర మధ్య ఉన్న ఉద్వేగాన్ని నిలిపింది. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
