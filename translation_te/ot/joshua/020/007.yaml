translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూడు స్థలనామాలు మరియు వాటి కొండప్రాంతాలను సమాంతర వాక్యనిర్మాణంలో ఉంచాం. ఇంగ్లీషు సంప్రదింపు పాఠంలో పాదసూచిక గుర్తు నఫ్తాలి తర్వాత ఉన్నప్పటికీ, దాని విషయం కిర్యత్-అర్బా పేరుకు సంబంధించినందున గుర్తును సంబంధిత పేరువద్ద ఉంచాం.
