source:
  edition: WLC
  text: וַ/יַּקְדִּ֜שׁוּ אֶת קֶ֤דֶשׁ בַּ/גָּלִיל֙ בְּ/הַ֣ר נַפְתָּלִ֔י וְ/אֶת שְׁכֶ֖ם בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת קִרְיַ֥ת אַרְבַּ֛ע הִ֥יא חֶבְר֖וֹן בְּ/הַ֥ר יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
translation:
  language: te
  text: అలా వారు గలిలయలోని నఫ్తాలి కొండప్రాంతంలో కేదెషును, ఎఫ్రాయిము కొండప్రాంతంలో షెకెమును, యూదా కొండప్రాంతంలో కిర్యత్-అర్బాను[a] (అదే హెబ్రోను) ప్రత్యేకంగా కేటాయించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో, “కిర్యత్-అర్బా, అది హెబ్రోను”; అంటే కిర్యత్-అర్బా అనేది హెబ్రోనుకు మరో పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  choice: ప్రత్యేకంగా కేటాయించారు
  rationale: ఆశ్రయ పట్టణాలుగా ఒక నిర్దిష్ట న్యాయపరమైన ప్రయోజనం కోసం ఈ పట్టణాలను అధికారికంగా వేరుచేసిన చర్యను సూచిస్తుంది. ఆచారపరమైన ‘పవిత్రీకరణ’ భావాన్ని అనవసరంగా ముందుకు తేకుండా మూలంలోని ప్రత్యేక నియామక భావాన్ని తెలియజేస్తుంది.
- source_word: קֶדֶשׁ
  choice: కేదెషు
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בַּגָּלִיל
  choice: గలిలయలోని
  rationale: గలిలయ అనే భౌగోళిక ప్రాంతాన్ని సహజమైన తెలుగు సంబంధ నిర్మాణంలో ఇచ్చాం.
- source_word: בְּהַר נַפְתָּלִי
  choice: నఫ్తాలి కొండప్రాంతంలో
  rationale: הַר ఇక్కడ ఒకే పర్వత శిఖరాన్ని కాక నఫ్తాలి గోత్రానికి సంబంధించిన ఎత్తైన ప్రాంతాన్ని సూచిస్తుంది.
- source_word: שְׁכֶם
  choice: షెకెము
  rationale: స్థిరమైన స్థలనామంగా లిప్యంతరీకరించాం.
- source_word: בְּהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలో
  rationale: ఒకే పర్వతం కన్నా ఎఫ్రాయిముకు చెందిన ఎత్తైన భూభాగాన్ని సూచించే ప్రాంతీయ అర్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: קִרְיַת אַרְבַּע
  choice: కిర్యత్-అర్బా
  rationale: అర్థానువాదం చేయకుండా స్థిరమైన స్థలనామంగా లిప్యంతరీకరించాం.
- source_word: הִיא חֶבְרוֹן
  choice: (అదే హెబ్రోను)
  rationale: కిర్యత్-అర్బా మరియు హెబ్రోను ఒకే స్థలానికి పేర్లని మూలంలోని గుర్తింపు వాక్యం సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: בְּהַר יְהוּדָה
  choice: యూదా కొండప్రాంతంలో
  rationale: యూదాకు సంబంధించిన ఎత్తైన ప్రాంతాన్ని సూచించే భౌగోళిక వాడుకను అందిస్తుంది.
