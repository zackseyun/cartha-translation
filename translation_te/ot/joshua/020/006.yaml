revisions:
- from: అతడు తీర్పు కోసం సమాజం[a] ఎదుట నిలబడే వరకు, ఆ రోజుల్లో పదవిలో ఉన్న ప్రధాన యాజకుడు మరణించే వరకు ఆ పట్టణంలోనే నివసించాలి. ఆ తరువాత చంపినవాడు[b] తన పట్టణానికి, తన ఇంటికి—అంటే తాను ఎక్కడి నుంచి పారిపోయాడో ఆ పట్టణానికి—తిరిగి వెళ్లవచ్చు.
  to: అతడు తీర్పు కోసం సభ[a] ఎదుట నిలబడే వరకు, ఆ రోజుల్లో పదవిలో ఉన్న ప్రధాన యాజకుడు మరణించే వరకు ఆ పట్టణంలోనే నివసించాలి. అప్పుడు చంపినవాడు[b] తిరిగి వచ్చి తన పట్టణానికి, తన ఇంటికి—తాను ఎక్కడినుంచి పారిపోయాడో ఆ పట్టణానికి—చేరవచ్చు.
  rationale: The revision retains the source’s legal and temporal ambiguity without interpretation. It uses ‘సభ’ for the judicially assembled body and renders the sequential Hebrew verbs יָשׁוּב וּבָא with the natural Telugu sequence ‘తిరిగి వచ్చి ... చేరవచ్చు.’
