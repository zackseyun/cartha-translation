  text: וְ/יָשַׁ֣ב בָּ/עִ֣יר הַ/הִ֗יא עַד עָמְד֞/וֹ לִ/פְנֵ֤י הָֽ/עֵדָה֙ לַ/מִּשְׁפָּ֔ט עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם אָ֣ז יָשׁ֣וּב הָ/רוֹצֵ֗חַ וּ/בָ֤א אֶל עִיר/וֹ֙ וְ/אֶל בֵּית֔/וֹ אֶל הָ/עִ֖יר אֲשֶׁר נָ֥ס מִ/שָּֽׁם׀־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
translation:
  language: te
  text: అతడు తీర్పు కోసం సభ[a] ఎదుట నిలబడే వరకు, ఆ రోజుల్లో పదవిలో ఉన్న ప్రధాన యాజకుడు మరణించే వరకు ఆ పట్టణంలోనే నివసించాలి. అప్పుడు చంపినవాడు[b] తిరిగి వచ్చి తన పట్టణానికి, తన ఇంటికి—తాను ఎక్కడినుంచి పారిపోయాడో ఆ పట్టణానికి—చేరవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమాజం’. హీబ్రూ పదం ఇక్కడ న్యాయనిర్ణయం చేయడానికి కూడిన సమాజాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘చంపిన వ్యక్తి’. ఇక్కడ వాడిన హీబ్రూ పదం చంపినవాణ్ణి సూచిస్తుంది; ఈ ఆశ్రయ పట్టణాల సందర్భంలో అతడు ఉద్దేశపూర్వక హంతకుడని ముందుగానే నిర్ణయించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב בָּעִיר הַהִיא
  choice: ఆ పట్టణంలోనే నివసించాలి
  rationale: ישׁב ఇక్కడ ఆశ్రయ పట్టణంలో కొనసాగి నివసించడాన్ని సూచిస్తుంది. ‘నివసించాలి’ న్యాయపరమైన ఆవశ్యకతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఆ పట్టణంలోనే’ అక్కడే ఉండాలనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט
  choice: తీర్పు కోసం సమాజం ఎదుట నిలబడే వరకు
  rationale: עמד לפני అనేది అధికారిక సమక్షంలో హాజరుకావడాన్ని సూచించే న్యాయపరమైన ప్రయోగం. ‘ఎదుట నిలబడే వరకు’ మూల రూపాన్ని కాపాడుతుంది; ‘తీర్పు కోసం’ משפט యొక్క న్యాయనిర్ణయ భావాన్ని ఇస్తుంది.
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: ఈ పదం న్యాయనిర్ణయం కోసం కూడిన ఇశ్రాయేలు సమూహాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం సాధారణ సమావేశం కంటే సామూహిక అధికారాన్ని తెలియజేస్తుంది.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדוֹל אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో పదవిలో ఉన్న ప్రధాన యాజకుడు మరణించే వరకు
  rationale: ‘ప్రధాన యాజకుడు’ הכהן הגדול కు ప్రామాణికమైన తెలుగు పదబంధం. ‘పదవిలో ఉన్న’ అనేది ఆ కాలంలో సేవ చేస్తున్న నిర్దిష్ట ప్రధాన యాజకుణ్ణి సూచించే సంబంధవాక్య భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָרֹצֵחַ
  choice: చంపినవాడు
  rationale: ఆశ్రయ పట్టణాల సందర్భంలో ఆ వ్యక్తి ఉద్దేశపూర్వక హత్యకు దోషిగా ఇంకా నిర్ణయించబడలేదు. ‘చంపినవాడు’ మరణానికి కారణమైన వ్యక్తిని సూచిస్తూ, ‘హంతకుడు’ లేదా ‘నరహంతకుడు’ కలిగించగల ముందస్తు దోషనిర్ణయాన్ని నివారిస్తుంది.
- source_word: אָז יָשׁוּב וּבָא
  choice: ఆ తరువాత ... తిరిగి వెళ్లవచ్చు
  rationale: ఈ న్యాయసందర్భంలో ప్రధాన యాజకుని మరణానంతరం తిరిగి వెళ్లేందుకు లభించే అనుమతిని ‘వెళ్లవచ్చు’ సహజంగా తెలియజేస్తుంది. ‘తిరిగి’ ישׁוב భావాన్ని కాపాడుతుంది; וּבָא తెలుగులో ప్రత్యేకంగా పునరుక్తి చేయకుండా గమ్యానికి చేరే భావంలో అంతర్లీనమైంది.
- source_word: אֶל עִירוֹ וְאֶל בֵּיתוֹ
  choice: తన పట్టణానికి, తన ఇంటికి
  rationale: మూలంలోని పౌర స్థలం మరియు కుటుంబ నివాసం అనే రెండు గమ్యాలను విడిగా కాపాడుతుంది.
- source_word: אֶל הָעִיר אֲשֶׁר נָס מִשָּׁם
  choice: అంటే తాను ఎక్కడి నుంచి పారిపోయాడో ఆ పట్టణానికి
  rationale: చివరి హీబ్రూ పదబంధం ముందున్న ‘తన పట్టణం’ను తిరిగి వివరిస్తుంది. తెలుగు పాఠకునికి ఆ పునర్వివరణ సంబంధం స్పష్టంగా ఉండేందుకు ‘అంటే’ ఉపయోగించబడింది.
theological_decisions:
- issue: הָרֹצֵחַ అనే పదంలో వ్యక్తి యొక్క న్యాయస్థితి
  choice: చంపినవాడు
  alternative: హంతకుడు / నరహంతకుడు
  rationale: విస్తృత సందర్భం అనుకోకుండా చంపినవాణ్ణి ఉద్దేశపూర్వక హంతకుని నుంచి వేరు చేస్తుంది. ఈ వచనంలో న్యాయవిచారణకు ముందే అతణ్ణి హత్యాదోషిగా పేర్కొనకుండా తటస్థమైన పదాన్ని ఎంచుకున్నాం.
- issue: ప్రధాన యాజకుని మరణం తరువాత తిరిగి వెళ్లడం యొక్క విధిబలం
  choice: తిరిగి వెళ్లవచ్చు అనే అనుమతి భావం
  alternative: తిరిగి వెళ్తాడు అనే సాధారణ భవిష్యత్ భావం
  rationale: నగరాశ్రయ న్యాయవ్యవస్థలో ఇది తప్పనిసరిగా జరిగే చర్యను ప్రకటించడం కంటే, తిరిగి వెళ్లడానికి ఏర్పడే చట్టబద్ధమైన స్వేచ్ఛను సూచిస్తుంది.
- issue: రెండు עַד పదబంధాల సంబంధం
  choice: విచారణ ఎదుట నిలబడే వరకు, ప్రధాన యాజకుడు మరణించే వరకు అనే రెండు కాలపరిమితులనూ యథాతథంగా ఉంచడం
  alternative: విచారణ తరువాత ప్రధాన యాజకుని మరణం వరకు అని క్రమాన్ని వివరణాత్మకంగా విస్తరించడం
  rationale: హీబ్రూ వాక్యం రెండు ‘వరకు’ పదబంధాలను వరుసగా ఉంచుతుంది. వాటి ఖచ్చిత తార్కిక సంబంధాన్ని అనువాదంలో అదనంగా నిర్ణయించకుండా మూలంలోని నిర్మాణం మరియు ఉద్రిక్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయశైలిని ఉపయోగించాం. పాత రూపాలైన ‘నివసించును’, ‘మరణించువరకు’ బదులు ప్రస్తుత వాడుకలోని ‘నివసించాలి’, ‘మరణించే వరకు’ తీసుకున్నాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
