source:
  edition: WLC
  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
translation:
  language: te
  text: ఇవి ఇశ్రాయేలు కుమారులందరికీ[a], వారి మధ్య నివసించే పరదేశికీ[b] నియమించబడిన పట్టణాలు. ఎవరైనా అనుకోకుండా ఒక వ్యక్తి ప్రాణం తీసితే, అతడు అక్కడికి పారిపోయి, సభ[c] ఎదుట నిలబడే వరకు రక్తప్రతీకారం తీర్చేవాని చేతిలో చనిపోకుండా ఉండగలడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సహజంగా: ‘ఇశ్రాయేలీయులందరికీ.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులందరికీ’ అని ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: ‘పరదేశి’ అంటే ఇశ్రాయేలు సమాజపు వ్యవస్థ కింద వారి మధ్య నివసించే స్థానికేతర నివాసి.
    reason: cultural_note
  - marker: c
    text: లేదా ‘సమాజం.’ ఇక్కడ కూడిన సమాజం, ముఖ్యంగా న్యాయపరంగా వ్యవహరించే సమూహం, ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  choice: నియమించబడిన పట్టణాలు
  rationale: ఈ పదబంధం నియమించిన లేదా నిర్దేశించిన పట్టణాలను సూచిస్తుంది. ఈ పదబంధంలో లేని ‘ఆశ్రయ’ భావాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చలేదు.
- source_word: לְכֹל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులందరికీ
  rationale: హీబ్రూ రూపంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే జాతీయ-నిబంధనాత్మక వ్యక్తీకరణను పారదర్శకంగా నిలుపుతుంది; తెలుగులో ‘ఇశ్రాయేలీయులందరికీ’ మరింత సహజమైన ప్రత్యామ్నాయం.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: వారి మధ్య నివసించే పరదేశికీ
  rationale: గేర్ అనేది కేవలం అపరిచితుడిని కాక, ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతర నివాసిని సూచిస్తుంది. ‘పరదేశి’ ఆ చట్టపరమైన భేదాన్ని సాధారణ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָנוּס שָׁמָּה
  choice: అక్కడికి పారిపోయి
  rationale: נוּס యొక్క మౌలిక భావమైన ప్రమాదం నుంచి పారిపోవడాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: ఎవరైనా ... ఒక వ్యక్తిని చంపితే
  rationale: అక్షరార్థంగా ‘ప్రాణిని/వ్యక్తిని కొట్టినవాడు’ అయినప్పటికీ, సందర్భంలో మరణానికి కారణమైన వ్యక్తి ఉద్దేశించబడుతున్నాడు. ‘చంపితే’ చట్టపరమైన ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בִּשְׁגָגָה
  choice: అనుకోకుండా
  rationale: ఉద్దేశపూర్వకంగా కాక పొరపాటున జరిగిన కార్యాన్ని సూచించే చట్టపరమైన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: גֹּאֵל הַדָּם
  choice: రక్తప్రతీకారం తీర్చేవాడు
  rationale: చంపబడిన బంధువు తరఫున రక్తప్రతీకారం తీర్చే చట్టపరమైన పాత్రను తెలుగులో అర్థమయ్యే రీతిలో వ్యక్తం చేస్తుంది.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: సమాజం ఎదుట నిలబడే వరకు
  rationale: రక్షణ కొనసాగే పరిమితిని, అలాగే సమాజం ఎదుట హాజరై విచారణను ఎదుర్కొనే న్యాయసంబంధ సందర్భాన్ని మూలపాఠ్యానికి దగ్గరగా ఉంచుతుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక జాతీయ వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులందరికీ
  alternative: ఇశ్రాయేలీయులందరికీ
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది సమస్త ఇశ్రాయేలు ప్రజలను సూచించే జాతీయ వ్యక్తీకరణ అని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: גֵּר యొక్క చట్టపరమైన హోదా
  choice: వారి మధ్య నివసించే పరదేశి
  alternative: వారి మధ్య నివసించే విదేశీయుడు
  rationale: ఈ వాక్యం స్థానిక ఇశ్రాయేలీయులతో పాటు సమాజంలో నివసించే స్థానికేతరునికీ ఒకే చట్టపరమైన ఆశ్రయాన్ని విస్తరిస్తుంది. ఆధునిక వలస వర్గీకరణలను రుద్దకుండా ఆ ప్రత్యేక హోదాను నిలుపుతుంది.
- issue: הָעֵדָה యొక్క సామూహిక-న్యాయ భావం
  choice: సమాజం
  alternative: సభ
  rationale: ఇక్కడ పదం న్యాయపరంగా వ్యవహరించే సముదాయాన్ని లేదా కూడిన సభను సూచించవచ్చు. ప్రధాన పాఠ్యంలో విస్తృతమైన ‘సమాజం’ ఉంచి, ‘సభ’ను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని చట్టపరమైన స్వరాన్ని నిలిపి, అత్యంత అక్షరానువాదం వల్ల కలిగే అసహజతను తగ్గించాం. అన్ని పాదటిప్పణి సూచికలు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
