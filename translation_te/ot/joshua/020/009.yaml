  to: ఇవి ఇశ్రాయేలు కుమారులందరికీ[a], వారి మధ్య నివసించే పరదేశికీ[b] నియమించబడిన పట్టణాలు. ఎవరైనా అనుకోకుండా ఒక వ్యక్తి ప్రాణం తీసితే, అతడు అక్కడికి పారిపోయి, సభ[c] ఎదుట నిలబడే వరకు రక్తప్రతీకారం తీర్చేవాని చేతిలో చనిపోకుండా ఉండగలడు.
