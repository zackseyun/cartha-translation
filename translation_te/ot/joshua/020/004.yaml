translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయవిధాన శైలి. మూలంలోని వరుస ఆదేశాలను తెలుగులో సహజమైన సంయుక్త క్రియాక్రమంగా ఇచ్చాం. ప్రతి పాదటిప్పణి సూచికను సంబంధిత సందిగ్ధ పదబంధం వెంట ఉంచాం.
