  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָ֞ס אֶל אַחַ֣ת מֵ/הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/עָמַד֙ פֶּ֚תַח שַׁ֣עַר הָ/עִ֔יר וְ/דִבֶּ֛ר בְּ/אָזְנֵ֛י זִקְנֵ֥י הָ/עִֽיר הַ/הִ֖יא אֶת דְּבָרָ֑י/ו וְ/אָסְפ֨וּ אֹת֤/וֹ הָ/עִ֨ירָ/ה֙ אֲלֵי/הֶ֔ם וְ/נָתְנוּ ל֥/וֹ מָק֖וֹם וְ/יָשַׁ֥ב עִמָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
translation:
  language: te
  text: అతడు ఈ పట్టణాల్లో ఒకదానికి పారిపోయి, పట్టణ ద్వారం ప్రవేశస్థలం వద్ద నిలబడి, ఆ పట్టణపు పెద్దల వినికిడిలో తన విషయం[a] చెప్పాలి. అప్పుడు వారు అతణ్ణి పట్టణంలోకి తమ మధ్యకు చేర్చుకొని[b], అతనికి ఒక స్థలం ఇవ్వాలి; అతడు వారితో నివసించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన మాటలు” లేదా “తన వాదన.” హీబ్రూ పదం అతడు పలికే మాటలను గానీ, సమర్పించే విషయాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతణ్ణి పట్టణంలోకి తమ మధ్యకు స్వీకరించి.” హీబ్రూ క్రియకు “సేకరించు,” “లోపలికి తీసుకొను,” లేదా “స్వీకరించు” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  choice: పారిపోయి
  rationale: న్యాయపరమైన ఆదేశక్రమంలో ఈ క్రియ చేయవలసిన చర్యను సూచిస్తుంది; తెలుగులో తరువాతి ‘చెప్పాలి’తో కలిపిన క్రియాక్రమం సహజంగా ఆ విధిని తెలియజేస్తుంది.
- source_word: אַחַת מֵהֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాల్లో ఒకదానికి
  rationale: భాగార్థక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וְעָמַד פֶּתַח שַׁעַר הָעִיר
  choice: పట్టణ ద్వారపు ప్రవేశం దగ్గర నిలబడి
  rationale: פֶּתַח ‘ప్రవేశం’ మరియు שַׁעַר ‘ద్వారం’ అనే రెండు అంశాలను నిలుపుతూ, ప్రజా న్యాయస్థలమైన పట్టణ ద్వారం వద్ద నిలబడే దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: וְדִבֶּר בְּאָזְנֵי
  choice: వినేలా ... చెప్పాలి
  rationale: ‘చెవుల్లో’ అనే అక్షరార్థానికి బదులు ‘వారి వినికిడిలో’ అనే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: זִקְנֵי הָעִיר הַהִיא
  choice: ఆ పట్టణ పెద్దలు
  rationale: הַהִיא లోని నిర్దిష్టతను ‘ఆ పట్టణ’ ద్వారా కాపాడుతుంది; ‘పెద్దలు’ సందర్భంలో పౌర నాయకులను సూచిస్తుంది.
- source_word: אֶת דְּבָרָיו
  choice: తన విషయం
  rationale: דָּבָר కు ‘మాటలు,’ ‘విషయం,’ లేదా న్యాయపరంగా ‘వాదన/కేసు’ అనే పరిధి ఉంది. ‘తన విషయం’ న్యాయసందర్భానికి సరిపోతూనే మూలంలోని విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  choice: అతణ్ణి తమ దగ్గరికి పట్టణంలోకి చేర్చుకొని
  rationale: אָסַף యొక్క ‘సమకూర్చు/లోపలికి తీసుకో/స్వీకరించు’ భావాన్ని, పట్టణంలోకి ప్రవేశం మరియు సమాజంలో స్వీకరణ అనే రెండు అంశాలతో వ్యక్తపరుస్తుంది.
- source_word: וְנָתְנוּ לוֹ מָקוֹם
  choice: అతనికి ఒక స్థలం ఇచ్చి
  rationale: מָקוֹם అనే విస్తృత పదాన్ని ‘నివాసం’గా కుదించకుండా ‘స్థలం’గా ఉంచుతుంది.
- source_word: וְיָשַׁב עִמָּם
  choice: అతడు తమతో నివసించేలా చేయాలి
  rationale: ఈ నివాస సందర్భంలో יָשַׁב కు ‘కూర్చోవడం’ కంటే ‘నివసించడం’ సరైన భావం; ముందున్న పెద్దల చర్యలతో వాక్యాన్ని సహజంగా అనుసంధానిస్తుంది.
