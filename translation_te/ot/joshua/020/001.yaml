source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/001.yaml
  text: Then Yahweh spoke to Joshua[a], saying,
translation:
  language: te
  text: 'అప్పుడు[a] యాహ్వే యెహోషువతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు.” హీబ్రూ కథన రూపంలోని ప్రారంభ వావ్‌ను సందర్భానుసారం “అప్పుడు” లేదా “మరియు” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమసూచక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. דּבר ఇక్కడ సంబోధించి మాట్లాడడాన్ని సూచించినా, ‘తో ... అన్నాడు’ అనే ప్రయోగం తెలుగులో సహజంగా తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా స్థిరపడిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: తో
  rationale: ‘మాట్లాడు/అను’ అనే క్రియతో వ్యక్తిని సూచించడానికి ఆధునిక తెలుగులో సహజమైన విభక్తి ప్రయోగం.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనిరూపానికి దగ్గరగా ఉండే, తెలుగులో పరిచితమైన రూపం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: ఈ అవ్యయ క్రియారూపం తరువాత వచ్చే దైవవాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా అన్నాడు:’ అనే రూపం ఆ సూత్రబద్ధ పాత్రను సహజంగా నిర్వహిస్తుంది; ప్రధాన క్రియతో కలిపి అనవసర పునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున ‘యాహ్వే’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే కథన శైలి. ఈ వచనంలో పాదసూచిక అవసరం లేదు.
