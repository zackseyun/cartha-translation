  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר תְּנ֤וּ לָ/כֶם֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁר דִּבַּ֥רְתִּי אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో ఇలా చెప్పు: ‘నేను మోషే ద్వారా[a] మీతో చెప్పిన ఆశ్రయ పట్టణాలను మీ కోసం నియమించుకోండి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “మోషే చేతి ద్వారా”; ఇది “మోషే ద్వారా” అనే అర్థమిచ్చే నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... לֵאמֹר
  choice: ఇలా చెప్పు
  rationale: ఆజ్ఞారూపాన్ని, దాని వెంట వచ్చే ప్రత్యక్ష సందేశ పరిచయాన్ని సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబసంబంధమైన ‘ఇశ్రాయేలు కుమారులు’ అనే సమూహనామాన్ని నిలుపుతుంది; ఇది నిబంధన ప్రజలను సూచించే సంప్రదాయ హీబ్రూ ప్రయోగం.
- source_word: תְּנוּ לָכֶם
  choice: మీ కోసం నియమించుకోండి
  rationale: נתן అనే క్రియకు అక్షరార్థం ‘ఇవ్వండి’; అయితే ఇక్కడ నిర్దిష్ట విధి కోసం పట్టణాలను కేటాయించడమే భావం. ‘నియమించుకోండి’ ఆ పరిపాలనా భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עָרֵי הַמִּקְלָט
  choice: ఆశ్రయ పట్టణాలు
  rationale: అనుకోకుండా హత్య చేసినవారికి రక్షణ కల్పించేందుకు ప్రత్యేకంగా కేటాయించిన పట్టణాలను సూచించే న్యాయపరమైన పదబంధానికి స్పష్టమైన తెలుగు రూపం.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם
  choice: నేను ... మీతో చెప్పిన
  rationale: సంబంధవాక్యాన్ని తెలుగులో సహజమైన క్రమంలో ఉంచి, దేవుడు ఇంతకుముందు వారితో చెప్పిన విషయాన్నే సూచిస్తున్నాడనే భావాన్ని నిలుపుతుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’ అయిన ఈ హీబ్రూ నుడికారం మధ్యవర్తిత్వాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మోషే ద్వారా’ అదే భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక నిబంధన సమూహనామం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని పుంలింగ బహువచన కుటుంబ రూపాన్ని ప్రధాన పాఠంలో నిలిపి, దాన్ని లింగతటస్థ జాతినామంగా మార్చలేదు. సందర్భంలో ఇది నిబంధన సమాజానికి స్థిరమైన సమూహనామం.
- issue: בְּיַד מֹשֶׁה లోని మధ్యవర్తిత్వ నుడికారం
  choice: మోషే ద్వారా
  alternative: మోషే చేతి ద్వారా
  rationale: దేవుని ఆజ్ఞ మోషే ద్వారా అందించబడిందనే మధ్యవర్తిత్వ భావాన్ని కాపాడుతూ, అక్షరానువాదం వల్ల తెలుగులో కలిగే అసహజతను నివారిస్తుంది; అక్షరరూపం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుసరించకుండా ఆజ్ఞారూపం స్పష్టంగా ఉంచబడింది; ‘ఇశ్రాయేలు కుమారులు’ అనే మూల కుటుంబసంబంధ సమూహనామం మాత్రం ఉద్దేశపూర్వకంగా నిలుపబడింది.
