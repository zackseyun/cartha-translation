  source_fidelity: 'అర్థం మొత్తంగా మూలానికి నమ్మకంగా ఉంది: యొర్దాను అవతల/యెరికోకు తూర్పున ఉన్న మూడు నగరాలు, వాటి ప్రాంతాలు, గోత్ర సంబంధాలు, మరియు అధికారిక నియామకం అన్నీ ఉన్నాయి. అయితే స్థలనామమైన בֶּצֶר కు మరింత సన్నిహితమైన తెలుగు లిప్యంతరీకరణ అవసరం.'
