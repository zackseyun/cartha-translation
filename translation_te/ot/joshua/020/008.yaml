source:
  edition: WLC
  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֤ן יְרִיחוֹ֙ מִזְרָ֔חָ/ה נָתְנ֞וּ אֶת בֶּ֧צֶר בַּ/מִּדְבָּ֛ר בַּ/מִּישֹׁ֖ר מִ/מַּטֵּ֣ה רְאוּבֵ֑ן וְ/אֶת רָאמֹ֤ת בַּ/גִּלְעָד֙ מִ/מַּטֵּה גָ֔ד וְ/אֶת גלון בַּ/בָּשָׁ֖ן מִ/מַּטֵּ֥ה מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
translation:
  language: te
  text: యెరికోకు తూర్పున, యొర్దాను అవతల వారు రూబేను గోత్ర ప్రాంతంలోని పీఠభూమి అరణ్యంలో ఉన్న బెసెరును, గాదు గోత్ర ప్రాంతంలోని గిలాదులో ఉన్న రామోతును, మనష్షే గోత్ర ప్రాంతంలోని బాషానులో ఉన్న గోలానును నియమించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרִיחוֹ מִזְרָחָה
  choice: యెరికోకు తూర్పున, యొర్దాను అవతల
  rationale: కనాను దృష్టికోణం నుంచి యొర్దానుకు అవతల, యెరికోకు తూర్పున ఉన్న ప్రాంతాన్ని సహజమైన తెలుగు భౌగోళిక పదక్రమంలో వ్యక్తపరుస్తుంది.
- source_word: נָתְנוּ
  choice: నియమించారు
  rationale: ఆశ్రయపురాలుగా అధికారికంగా ఎంపిక చేసి కేటాయించిన చర్యను సందర్భానుసారంగా తెలియజేస్తుంది; కేవలం ‘ఇచ్చారు’ అనే అర్థానికే పరిమితం కాదు.
- source_word: בֶּצֶר
  choice: బేసెరు
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: సాగుచేయని ఎడారి లేదా గడ్డి మైదాన స్వభావం గల విస్తృత ప్రాంతాన్ని సూచించే מִדְבָּר పదానికి సందర్భోచితమైన, సుపరిచితమైన తెలుగు పదం.
- source_word: בַּמִּישֹׁר
  choice: పీఠభూమి
  rationale: యొర్దానుకు తూర్పున ఉన్న సమతల ఎత్తైన భూభాగాన్ని ‘మైదానం’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִמַּטֵּה רְאוּבֵן / מִמַּטֵּה גָד / מִמַּטֵּה מְנַשֶּׁה
  choice: రూబేను / గాదు / మనష్షే గోత్ర ప్రాంతంలోని
  rationale: ఈ నగరాలు ఆయా గోత్రాలకు కేటాయించబడిన భూభాగాల్లో ఉన్నాయని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: רָאמֹת בַּגִּלְעָד
  choice: గిలాదులో ఉన్న రామోతు
  rationale: మూలంలోని నగరం-ప్రాంతం నిర్మాణాన్ని నిలుపుతూ, దీనిని ఒకే సంయుక్త స్థలనామంగా మార్చకుండా అనువదిస్తుంది.
- source_word: גלון בַּבָּשָׁן
  choice: బాషానులో ఉన్న గోలాను
  rationale: గోలాను అనే నగరం బాషాను ప్రాంతంలో ఉందనే మూల వాక్య నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్య నిర్మాణం. భౌగోళిక స్థలనామాలను తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించాం. ఆంగ్ల సంప్రదాయ రూపమైన ‘Ramoth-gilead’కు ఇచ్చిన గమనిక తెలుగు పాఠంలో అవసరం లేదు, ఎందుకంటే మూలంలోని ‘గిలాదులో ఉన్న రామోతు’ రూపాన్ని నేరుగా నిలిపాం.
