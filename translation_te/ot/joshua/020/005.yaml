    issue: Footnote anchor is detached from the temporal idiom it explains.
    rationale: Marker a follows the whole sentence, whereas the note specifically concerns מִתְּמוֹל שִׁלְשׁוֹם, rendered ‘అంతకుముందు.’ It should immediately follow that expression.
  - severity: medium
    issue: The footnote inaccurately labels its Telugu wording as a literal translation.
    rationale: The Hebrew expression is literally ‘from yesterday [and] the day before yesterday’; ‘నిన్నటి నుంచీ, మొన్నటి నుంచీ’ does not accurately represent that form and may carry a different temporal sense in Telugu.
  - severity: low
    issue: The last clause leaves the subject of ‘ద్వేషం కూడా లేదు’ somewhat elliptical.
    rationale: The Hebrew explicitly states that the manslayer had not hated the other person. An explicit verbal clause preserves this relationship and the prior-time sense more clearly.
