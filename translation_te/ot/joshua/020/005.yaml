id: JOS.20.5
reference: Joshua 20:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִ֨י יִרְדֹּ֜ף גֹּאֵ֤ל הַ/דָּם֙ אַֽחֲרָ֔י/ו וְ/לֹֽא יַסְגִּ֥רוּ אֶת הָ/רֹצֵ֖חַ בְּ/יָד֑/וֹ כִּ֤י בִ/בְלִי דַ֨עַת֙ הִכָּ֣ה אֶת רֵעֵ֔/הוּ וְ/לֹֽא שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/005.yaml
  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
translation:
  language: te
  text: రక్తప్రతీకారం తీర్చేవాడు అతణ్ణి వెంబడిస్తే, వారు ప్రాణం తీసిన వ్యక్తిని అతని చేతికి అప్పగించకూడదు. ఎందుకంటే అతడు తన తోటి వ్యక్తిని ఉద్దేశం లేకుండా కొట్టాడు; అతనిని అంతకుముందు[a] ద్వేషించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, “నిన్నటి నుంచీ, మొన్నటి నుంచీ” అని ఉంది; ఇది “అంతకుముందు” లేదా “గతంలో” అనే అర్థం వచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יִרְדֹּף
  choice: వెంబడిస్తే
  rationale: సందర్భంలోని సంభావ్య న్యాయపరిస్థితిని సహజమైన తెలుగు షరతురూపంలో వ్యక్తం చేస్తుంది.
- source_word: גֹּאֵל הַדָּם
  choice: రక్తప్రతీకారం తీర్చేవాడు
  rationale: చంపబడినవాని కుటుంబం తరఫున ప్రతీకారం తీర్చే న్యాయపాత్రను స్పష్టంగా తెలియజేస్తుంది; విమోచకుడు అనే అసందర్భ భావాన్ని రానివ్వదు.
- source_word: וְלֹא יַסְגִּרוּ
  choice: వారు ... అప్పగించకూడదు
  rationale: నగర అధికారులపై ఉన్న నిషేధాత్మక న్యాయబాధ్యతను ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הָרֹצֵחַ
  choice: ప్రాణం తీసినవాణ్ణి
  rationale: ఈ దశలో ఉద్దేశపూర్వక హత్య నిర్ధారించబడలేదు కాబట్టి, అపరాధ ఉద్దేశాన్ని సూచించగల ‘హంతకుడు’ లేదా ‘నరహంతకుడు’ అనే పదాలను నివారించి తటస్థంగా అనువదించబడింది.
- source_word: בְּיָדוֹ
  choice: అతని చేతికి
  rationale: మూలంలోని సజీవమైన న్యాయనుడికారాన్ని నిలుపుతూ, అతని అధికారానికి అప్పగించడం అనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בִּבְלִי דַעַת
  choice: ఉద్దేశపూర్వకంగా కాకుండా
  rationale: కేవలం సమాచారం లేకపోవడం కంటే, ఈ న్యాయసందర్భంలో ఉద్దేశం లేని చర్య అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הִכָּה
  choice: కొట్టాడు
  rationale: క్రియ యొక్క ప్రాథమిక అర్థమైన ‘కొట్టడం’నే నిలుపుతుంది; మరణఫలితం విస్తృత సందర్భం ద్వారా తెలుస్తుంది కాబట్టి ‘చంపాడు’ అని అతిగా అనువదించదు.
- source_word: רֵעֵהוּ
  choice: తన తోటి మనిషిని
  rationale: భౌగోళికంగా పక్కింటివాడు అనే పరిమిత భావం రాకుండా, רֵעַ సూచించే సహమానవ సంబంధాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: וְלֹא שֹׂנֵא הוּא לוֹ
  choice: అతని మీద ద్వేషం కూడా లేదు
  rationale: ముందస్తు శత్రుత్వం లేదా దురుద్దేశం లేకపోవడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: అంతకుముందు
  rationale: హీబ్రూ కాలనుడికారం యొక్క సందర్భార్థమైన ‘గతంలో/మునుపు’ అనే భావాన్ని సహజ తెలుగులో ఇస్తుంది; పదశః రూపాన్ని పాదసూచికలో భద్రపరుస్తుంది.
theological_decisions:
- issue: ఆశ్రయపట్టణ సందర్భంలో הָרֹצֵחַ యొక్క న్యాయస్థితి
  choice: ప్రాణం తీసినవాడు
  alternative: హంతకుడు
  rationale: వచనం ఉద్దేశం లేని మరణాన్ని, ముందస్తు ద్వేషం లేమిని స్పష్టంగా చెబుతుంది. అందువల్ల నేరపూరిత హత్యను ముందుగానే నిర్ధారించే పదాన్ని వాడకుండా న్యాయపరమైన ఉద్రిక్తతను నిలుపుతుంది.
- issue: בִּבְלִי דַעַת యొక్క న్యాయార్థం
  choice: ఉద్దేశపూర్వకంగా కాకుండా
  alternative: తెలియకుండా
  rationale: ఇక్కడ ప్రధాన అంశం సాధారణ అజ్ఞానం కాదు, హాని చేయాలనే ఉద్దేశం లేకపోవడం. ఎంపిక చేసిన రూపం ఈ న్యాయభేదాన్ని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన న్యాయశైలిని ఉపయోగించాం. ‘హంతకుడు’ వంటి ముందస్తు దోషనిర్ణయాన్ని సూచించే పదాన్ని నివారించాం. పాదసూచిక గుర్తు అది వివరిస్తున్న చివరి కాలనుడికారం వద్దనే ఉంచబడింది.
