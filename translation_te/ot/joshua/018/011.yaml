translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. ‘చీటి వచ్చింది’, ‘భూభాగం ... మధ్య పడింది’ అనే సహజ ప్రయోగాలు హీబ్రూ కథన క్రమాన్ని అతిగా అక్షరానువాదం చేయకుండా నిలుపుతాయి. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదటిప్పణి గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో ఉన్నందున, [a]ను גְּבוּל యొక్క ప్రత్యామ్నాయ అర్థం దగ్గరவும் [b]ను ‘యోసేపు సంతతివారు’ దగ్గరவும் ఉంచాం.
