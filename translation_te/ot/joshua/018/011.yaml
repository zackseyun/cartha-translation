source:
  edition: WLC
  text: וַ/יַּ֗עַל גּוֹרַ֛ל מַטֵּ֥ה בְנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יֵּצֵא֙ גְּב֣וּל גּֽוֹרָלָ֔/ם בֵּ֚ין בְּנֵ֣י יְהוּדָ֔ה וּ/בֵ֖ין בְּנֵ֥י יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
translation:
  language: te
  text: వారి వంశాల ప్రకారం బెన్యామీను గోత్రానికి చీటి వచ్చింది. వారి చీటి ద్వారా లభించిన భూభాగం[a] యూదా సంతతివారికీ యోసేపు సంతతివారికీ[b] మధ్య పడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి చీటి వాటా సరిహద్దు.”
    reason: lexical_alternative
  - marker: b
    text: “యోసేపు సంతతివారు” అనే మాట యోసేపు నుండి వచ్చిన గోత్రాలను, ముఖ్యంగా ఎఫ్రాయిము మరియు మనష్షే గోత్రాలను, సమష్టిగా సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: చీటి వచ్చింది
  rationale: עלה అనే క్రియకు అక్షరార్థంగా ‘పైకి వచ్చింది’ అనే భావం ఉన్నా, చీట్లు వేసే సందర్భంలో ‘చీటి వచ్చింది’ అనేది మూలంలోని చీటి బయటపడే చిత్రాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: גּוֹרָל
  choice: చీటి
  rationale: భూమిని పంచడానికి వేసిన lot‌ను సూచించే సాధారణమైన, ప్రత్యక్ష తెలుగు పదం.
- source_word: מַטֵּה
  choice: గోత్రం
  rationale: ఈ భూవిభజన సందర్భంలో పదం ‘కర్ర’ అనే అక్షరార్థంలో కాకుండా ఇశ్రాయేలు గోత్ర విభాగాన్ని సూచిస్తుంది.
- source_word: בְנֵי בִנְיָמִן
  choice: బెన్యామీను సంతతి
  rationale: హీబ్రూ బంధుత్వ వ్యక్తీకరణను నిలుపుతూ, ‘బెన్యామీను కుమారులు’ కంటే ఇక్కడ ఉద్దేశించిన గోత్ర ప్రజలను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: గోత్రంలోపలి కుటుంబ-వంశ సమూహాల ప్రకారం జరిగిన విభజనను తెలియజేస్తుంది.
- source_word: גְּבוּל גּוֹרָלָם
  choice: వారి చీటి ద్వారా లభించిన భూభాగం
  rationale: גְּבוּל ప్రాథమికంగా సరిహద్దును సూచించినా, భూవిభజన సందర్భంలో ఆ సరిహద్దు నిర్ణయించే ప్రాంతాన్ని కూడా సూచించగలదు. తెలుగులో ‘భూభాగం ... మధ్య పడింది’ సహజంగా ఉండి సందర్భార్థాన్ని అందిస్తుంది; సరిహద్దు అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בֵּין ... וּבֵין
  choice: '...కీ ...కీ మధ్య'
  rationale: బెన్యామీను భూభాగం యూదా, యోసేపు గోత్రప్రాంతాల నడుమ ఉన్న స్థానాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: בְנֵי יְהוּדָה
  choice: యూదా సంతతివారు
  rationale: మూలంలోని ‘యూదా కుమారులు’ అనే బంధుత్వ రూపాన్ని సహజమైన తెలుగులో గోత్రజనులను సూచించేలా అందిస్తుంది.
- source_word: בְנֵי יוֹסֵף
  choice: యోసేపు సంతతివారు
  rationale: యోసేపు నుండి వచ్చిన గోత్రాలను సమష్టిగా సూచించే హీబ్రూ వ్యక్తీకరణను సహజమైన తెలుగులో నిలుపుతుంది.
