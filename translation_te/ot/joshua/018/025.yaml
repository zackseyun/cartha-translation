lexical_decisions:
- source_word: גִּבְעוֹן
  choice: గిబియోను
  rationale: బెన్యామీను ప్రాంతంలోని పట్టణాల జాబితాలో ఉన్న స్థలనామం; అర్థానువాదం చేయకుండా ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: הָרָמָה
  choice: రామా
  rationale: మూలరూపంలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, ఈ పట్టణాల జాబితాలో ఇది స్థిరమైన స్థలనామంగా పనిచేస్తుంది; అందువల్ల ‘ఎత్తైన స్థలం’ అని అర్థానువాదం చేయకుండా రామా అని ఇచ్చాం.
- source_word: בְאֵרוֹת
  choice: బెయేరోతు
  rationale: ఈ పదానికి ‘బావులు’ అనే వ్యుత్పత్తిగత అర్థం ఉన్నప్పటికీ, సందర్భంలో ఇది స్థలనామం; హీబ్రూ ఉచ్చారణను స్పష్టంగా ప్రతిబింబించేలా లిప్యంతరీకరించబడింది.
