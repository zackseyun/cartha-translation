translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గోత్రం–వంశం అనే పరిపాలనా నిర్మాణం స్పష్టంగా ఉంచబడింది; స్థలనామాలు లిప్యంతరీకరించబడ్డాయి.
