  text: וְ/הָי֣וּ הֶֽ/עָרִ֗ים לְ/מַטֵּ֛ה בְּנֵ֥י בִנְיָמִ֖ן לְ/מִשְׁפְּחֽוֹתֵי/הֶ֑ם יְרִיח֥וֹ וּ/בֵית חָגְלָ֖ה וְ/עֵ֥מֶק קְצִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/021.yaml
  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
translation:
  language: te
  text: 'బెన్యామీను సంతతివారి గోత్రానికి, వారి వంశాల ప్రకారం, చెందిన పట్టణాలు ఇవి: యెరికో, బేత్-హొగ్లా, ఏమెక్-కెజీజ్[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, దీనిని లిప్యంతరీకరించిన పేరుగా కాక వివరణాత్మక స్థలనామంగా అర్థం చేసుకుంటే, “కెజీజ్ లోయ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ הֶעָרִים
  choice: పట్టణాలు ఇవి
  rationale: జాబితాను పరిచయం చేసే హీబ్రూ సంధి-కర్తృవాక్యాన్ని సహజమైన తెలుగు జాబితా నిర్మాణంగా వ్యక్తం చేస్తుంది.
- source_word: לְמַטֵּה בְּנֵי בִנְיָמִן
  choice: బెన్యామీను సంతతివారి గోత్రానికి చెందిన
  rationale: לְ అనుబంధం లేదా కేటాయింపును సూచిస్తుంది; בְּנֵי అనే బంధుత్వ ప్రయోగాన్ని తెలుగులో సహజంగా ‘సంతతివారు’ అని అందిస్తుంది.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: వారి వంశాల ప్రకారం
  rationale: గోత్రంలోని ఉపవిభాగాలను సూచించే מִשְׁפָּחָהకు ఈ సందర్భంలో ‘వంశం’ సహజమైన పరిపాలనా-బంధుత్వ పదం.
- source_word: יְרִיחוֹ
  choice: యెరికో
  rationale: స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: בֵית חָגְלָה
  choice: బేత్-హొగ్లా
  rationale: בית-సమాస స్థలనామాన్ని అనువదించకుండా మూలధ్వనికి దగ్గరగా లిప్యంతరీకరించింది.
- source_word: עֵמֶק קְצִיץ
  choice: ఏమెక్-కెజీజ్
  rationale: עֵמֶק సాధారణంగా ‘లోయ’ అని అర్థమైనా, ఇక్కడ సమాస స్థలనామంగా ఉండవచ్చు కాబట్టి ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, వివరణాత్మక అనువాదాన్ని పాదసూచికలో ఉంచింది.
