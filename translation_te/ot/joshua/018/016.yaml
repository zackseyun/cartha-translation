  to: అప్పుడు సరిహద్దు బెన్‌-హిన్నోము లోయకు[a] ఎదురుగా, రెఫాయీము లోయకు ఉత్తరాన ఉన్న కొండ అంచు వరకు దిగింది. తరువాత అది హిన్నోము లోయను దాటి యెబూసీయుని దక్షిణ కొండవాలు[b] వరకు దిగి, ఏన్‌-రోగేలు[c] వరకు దిగింది.
  rationale: The revision improves Telugu modifier placement and route description, while preserving the Hebrew's sequence, its topographical descent language, and its ambiguity concerning “the Jebusite.” Footnote b now offers a genuine lexical/topographical alternative rather than importing “region,” and its explanatory wording remains explicitly tentative.
