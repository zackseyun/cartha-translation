translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన భౌగోళిక వర్ణనగా రూపొందించాం. స్థలనామాలకు తెలుగు బైబిలు పఠనంలో గుర్తుపట్టదగిన లిప్యంతరీకరణ వాడాం. మూలంలో లేని ‘పట్టణం’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా, సాధ్యమైన సూచనను పాదసూచికలో ఉంచాం.
