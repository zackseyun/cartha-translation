source:
  edition: WLC
  text: וְ/יָרַ֨ד הַ/גְּב֜וּל אֶל קְצֵ֣ה הָ/הָ֗ר אֲשֶׁר֙ עַל פְּנֵי֙ גֵּ֣י בֶן הִנֹּ֔ם אֲשֶׁ֛ר בְּ/עֵ֥מֶק רְפָאִ֖ים צָפ֑וֹנָ/ה וְ/יָרַד֩ גֵּ֨י הִנֹּ֜ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ נֶ֔גְבָּ/ה וְ/יָרַ֖ד עֵ֥ין רֹגֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/016.yaml
  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
translation:
  language: te
  text: అప్పుడు సరిహద్దు బెన్‌-హిన్నోము లోయకు[a] ఎదురుగా, రెఫాయీము లోయకు ఉత్తరాన ఉన్న కొండ అంచు వరకు దిగింది. తరువాత అది హిన్నోము లోయను దాటి యెబూసీయుని దక్షిణ కొండవాలు[b] వరకు దిగి, ఏన్‌-రోగేలు[c] వరకు దిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం ‘హిన్నోము కుమారుని లోయ’; ఇక్కడ స్థలనామంగా ‘బెన్‌-హిన్నోము లోయ’ అని ఇచ్చాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యెబూసీయుని దక్షిణ పక్కభాగం/భుజం.’ ఇక్కడ ‘యెబూసీయుడు’ అనేది యెబూసీయుల నివాసస్థలాన్ని, బహుశా యెరూషలేమును, సూచించవచ్చు; అయితే మూలపాఠ్యంలో ‘పట్టణం’ అనే పదం లేదు.
    reason: lexical_alternative
  - marker: c
    text: ‘ఏన్‌-రోగేలు’ ఒక స్థలనామం; దాని అక్షరార్థం ‘రోగేలు యొక్క ఊట.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: అప్పుడు సరిహద్దు … దిగింది
  rationale: יָרַד అనే క్రియ భౌగోళికంగా కిందికి దిగడాన్ని సూచిస్తుంది; సరిహద్దు మార్గాన్ని వర్ణించే సందర్భంలో ‘దిగింది’ సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
- source_word: קְצֵה הָהָר
  choice: కొండ అంచు
  rationale: קָצֶה అంటే చివర లేదా అంచు. స్థానిక భూభాగాన్ని సూచించడానికి ‘కొండ’ సహజమైన తెలుగు పదం; ‘అంచు’ మూలంలోని extremity భావాన్ని ఇస్తుంది.
- source_word: אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם
  choice: బెన్‌-హిన్నోము లోయకు ఎదురుగా ఉన్న
  rationale: עַל־פְּנֵי ఇక్కడ ‘ఎదురుగా/ముఖంగా’ అనే ప్రాదేశిక సంబంధాన్ని సూచిస్తుంది. గֵּי בֶן־הִנֹּם స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה
  choice: రెఫాయీము లోయకు ఉత్తరాన ఉండి
  rationale: צָפוֹנָה దిశాపరంగా ‘ఉత్తరంగా/ఉత్తరాన’ అని సూచిస్తుంది. వాక్యాన్ని సహజ తెలుగులో ఉంచుతూ కొండ యొక్క స్థానాన్ని తెలియజేస్తుంది; ‘ఉత్తర చివరలో’ అని మరీ నిర్దిష్టం చేయలేదు.
- source_word: גֵּי הִנֹּם
  choice: హిన్నోము లోయ
  rationale: ఇది స్థలనామం; పేరును లిప్యంతరీకరించి ‘లోయ’ అనే భౌగోళిక పదాన్ని స్పష్టంగా ఉంచాం.
- source_word: אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה
  choice: యెబూసీయుని దక్షిణ కొండవాలు వరకు
  rationale: כֶּתֶף అక్షరార్థంగా ‘భుజం’; భౌగోళిక సందర్భంలో కొండవాలు లేదా పక్కభాగాన్ని సూచిస్తుంది. మూలంలో ‘పట్టణం’ అనే పదం లేనందున దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు; הַיְבוּסִי యొక్క ఏకవచన రూపాన్ని కూడా నిలిపాం.
- source_word: עֵין רֹגֵל
  choice: ఏన్‌-రోగేలు
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం; עֵין యొక్క ‘నీటి ఊట’ అనే అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
