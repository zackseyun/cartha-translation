translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పట్టణాల జాబితా శైలిని సంక్షిప్తంగా నిలిపాం. స్థలనామాలకు తెలుగు బైబిలు సంప్రదాయానికి సమీపమైన లిప్యంతరీకరణను ఉపయోగించాం; అయితే మూలంలోని ప్రత్యేక రూపభేదాలను పాదటిప్పణుల్లో సంరక్షించాం.
