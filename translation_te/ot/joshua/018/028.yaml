source:
  edition: WLC
  text: וְ/צֵלַ֡ע הָאֶ֜לֶף וְ/הַ/יְבוּסִ֨י הִ֤יא יְרֽוּשָׁלִַ֨ם֙ גִּבְעַ֣ת קִרְיַ֔ת עָרִ֥ים אַרְבַּֽע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶ֑ן זֹ֛את נַֽחֲלַ֥ת בְּנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/028.yaml
  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
translation:
  language: te
  text: జేలా, హాయెలెఫ్, యెబూసీయుల పట్టణం—అదే యెరూషలేము[a]—గిబాత్[b], కిర్యాత్[c]; వాటి గ్రామాలతో కలిపి మొత్తం పద్నాలుగు పట్టణాలు. వంశాలవారీగా బెన్యామీను సంతానానికి లభించిన స్వాస్థ్యం ఇదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠం అక్షరార్థంగా, “యెబూసీయుడు [లేదా యెబూసీయులది], అదే యెరూషలేము” అని ఉంది. ఇక్కడ ‘యెబూసీయుడు’ అనే ప్రజానామ రూపం యెరూషలేము పట్టణాన్ని సూచిస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ పేరును కొన్ని అనువాదాలు “గిబియా” అని ఇస్తాయి.
    reason: alternative_reading
  - marker: c
    text: ఈ వచనంలోని హీబ్రూ పాఠంలో “కిర్యాత్” అని మాత్రమే ఉంది; “కిర్యాత్-యారీము” అని లేదు.
    reason: textual_variant
lexical_decisions:
- source_word: וְצֵלַע
  choice: జేలా
  rationale: స్థలనామాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: הָאֶלֶף
  choice: హాయెలెఫ్
  rationale: హీబ్రూ పాఠంలోని నిర్దిష్ట ఉపసర్గను స్థలనామ రూపంలో నిలుపుతూ లిప్యంతరీకరించాం.
- source_word: וְהַיְבוּסִי הִיא יְרוּשָׁלִַם
  choice: యెబూసీయుల పట్టణం—అదే యెరూషలేము
  rationale: అక్షరార్థంగా ఉన్న ‘యెబూసీయుడు/యెబూసీయులది, అదే యెరూషలేము’ అనే అసాధారణ స్థలనామ ప్రయోగాన్ని సాధారణ పాఠకునికి స్పష్టంగా చేస్తూ, యెరూషలేముతో ఉన్న సమానార్థక సూచనను నిలిపాం.
- source_word: גִּבְעַת
  choice: గిబాత్
  rationale: ఈ వచనంలోని వ్యంజన రూపాన్ని అనుసరించి స్థలనామాన్ని లిప్యంతరీకరించాం; సుపరిచితమైన ‘గిబియా’ రూపాన్ని ప్రధాన పాఠంలోకి దిగుమతి చేయలేదు.
- source_word: קִרְיַת
  choice: కిర్యాత్
  rationale: మూలపాఠంలో ఉన్న పేరు మాత్రమే ఇచ్చాం; ఈ వచనంలో లేని ‘యారీము’ను చేర్చలేదు.
- source_word: עָרִים אַרְבַּע עֶשְׂרֵה
  choice: మొత్తం పద్నాలుగు పట్టణాలు
  rationale: జాబితాను ముగించే సంఖ్యా సారాంశంగా సహజమైన ఆధునిక తెలుగు రూపం వాడాం.
- source_word: וְחַצְרֵיהֶן
  choice: వాటి గ్రామాలతో కలిపి
  rationale: భూవిభజన సందర్భంలో חצר అనుబంధ గ్రామాలు లేదా గోడలులేని చిన్న నివాసాలను సూచిస్తుంది; ‘గ్రామాలు’ సహజమైన సందర్భోచిత పదం.
- source_word: זֹאת נַחֲלַת
  choice: లభించిన స్వాస్థ్యం ఇదే
  rationale: హీబ్రూలో క్రియలేని ముగింపు సూత్రాన్ని తెలుగు కథన సందర్భంలో సహజంగా వ్యక్తం చేశాం.
- source_word: בְּנֵי בִנְיָמִן
  choice: బెన్యామీను సంతానం
  rationale: గోత్ర సంబంధ కుటుంబ భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే సమూహ సూచనను వాడాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వంశాలవారీగా
  rationale: గోత్రంలోని వంశ/కుల విభాగాల ప్రకారం భూమి పంచబడిన భావాన్ని సంక్షిప్తంగా, సహజంగా తెలిపే రూపం.
