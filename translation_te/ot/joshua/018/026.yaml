  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మిస్పెహు, కెఫీరా, మోసా.” హీబ్రూలో ప్రతి పేరుకు ముందున్న הַ־ను స్థలనామంలో భాగంగా కాక సాధారణ నిర్దిష్ట ఉపపదంగా తీసుకుంటే ఇలా చదవవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: మరియు / జాబితాలో విరామచిహ్న సమన్వయం
  rationale: హీబ్రూ సంయోజక అవ్యయం ఈ పట్టణాల జాబితాను ముందున్న పేర్లతో కలుపుతుంది. ఆధునిక తెలుగు జాబితా శైలిలో ప్రతి పేరుకు ముందు ‘మరియు’ను పునరావృతం చేయకుండా కామాలతో సహజంగా వ్యక్తపరచబడింది; వచనం మునుపటి వాక్యభాగానికి కొనసాగింపుగా ఉంటుంది.
- source_word: הַמִּצְפֶּה
  choice: హమిస్పెహు
  rationale: ఇది పట్టణనామం; ‘కావలికోట’ అని అర్థానువాదం చేయకుండా లిప్యంతరీకరించబడింది. ముందున్న הַ־ను పేరులోని ‘హ’గా నిలిపి, హీబ్రూ మִצְפֶּה ధ్వనికి అనుగుణంగా ‘మిస్పెహు’ వాడబడింది.
- source_word: הַכְּפִירָה
  choice: హక్కెఫీరా
  rationale: స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించాం. הַ־తో పాటు כּలోని ద్విత్వోచ్చారణను ‘హక్కె-’గా ప్రతిబింబించాం.
- source_word: הַמֹּצָה
  choice: హమ్మోసా
  rationale: స్థలనామాన్ని లిప్యంతరీకరించాం. הַ־ మరియు మేమ్ ద్విత్వాన్ని ‘హమ్మో-’గా నిలిపాం; צ ధ్వనిని సాధారణ పాఠకులకు సహజమైన ‘స’తో సూచించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పట్టణాల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. హీబ్రూ పేర్ల ముందు ఉన్న నిర్దిష్ట ఉపపదాన్ని పేరులో భాగంగా ఉంచిన పఠనాన్ని ప్రధాన పాఠంలో అనుసరించి, ప్రత్యామ్నాయ విశ్లేషణను పాదసూచికలో భద్రపరిచాం.
