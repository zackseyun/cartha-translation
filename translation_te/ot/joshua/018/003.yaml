id: JOS.18.3
reference: Joshua 18:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל עַד אָ֨נָה֙ אַתֶּ֣ם מִתְרַפִּ֔ים לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵ֥י אֲבֽוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/003.yaml
  text: And Joshua said to the sons of Israel[a], “How long will you be slack about going in to take possession of the land that Yahweh, the God of your fathers, has given you?”
translation:
  language: te
  text: 'యెహోషువ ఇశ్రాయేలు కుమారులతో[a] ఇలా అన్నాడు: “మీ పితరుల దేవుడైన యాహ్వే మీకు ఇచ్చిన దేశంలోకి వెళ్లి దాన్ని స్వాధీనం చేసుకోవడానికి ఇంకా ఎంతకాలం తాత్సారం చేస్తూ ఉంటారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులతో.” అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులతో.”
    reason: మూలంలోని కుటుంబసంబంధ పదబంధానికి సహజమైన తెలుగు ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది; సందర్భంలో అనవసరమైన కారణార్థాన్ని చేర్చదు.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబసంబంధమైన, అక్షరార్థ వ్యక్తీకరణను నిలుపుతుంది; సులభమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: עַד אָנָה
  choice: ఇంకా ఎంతకాలం
  rationale: మందలింపుతో కూడిన హీబ్రూ కాలప్రశ్నను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִתְרַפִּים
  choice: తాత్సారం చేస్తూ ఉంటారు
  rationale: רפה యొక్క ఈ రూపంలో ఉన్న అలసత్వం, వెనుకంజ, చేయవలసిన పనిని ఆలస్యం చేయడం అనే భావాలను అతిగా నైతిక తీర్పు విధించకుండా తెలియజేస్తుంది.
- source_word: לָבוֹא
  choice: దేశంలోకి వెళ్లి
  rationale: దేశంలో ప్రవేశించే దిశాభావాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לָרֶשֶׁת
  choice: దాన్ని స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ ఇక్కడ వాగ్దాన దేశంలో ప్రవేశించి దానిని తమ అధీనంలోకి తెచ్చుకోవడాన్ని సూచిస్తుంది; కేవలం చట్టపరమైన వారసత్వ భావానికే పరిమితం చేయదు.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: సందర్భంలో వాగ్దాన దేశాన్ని సూచించే సహజ తెలుగు పదం.
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: మీకు ఇచ్చిన
  rationale: దేవుడు దేశాన్ని ఇప్పటికే అనుగ్రహించినదిగా చూపే హీబ్రూ సంపూర్ణ క్రియను నిలుపుతుంది, అయితే దాని వాస్తవ స్వాధీనపరచుకోవడం ఇంకా పూర్తి కాలేదనే ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: మీ పితరుల దేవుడు
  rationale: హీబ్రూ నిబంధనాత్మక సూత్రంలోని తరతరాల సంబంధాన్ని, పురుష బహువచన రూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా హీబ్రూ ఉచ్చారణకు సమీపమైన రూపంలో లిప్యంతరీకరించాం.
- issue: దేశం ఇప్పటికే ఇవ్వబడింది, కానీ ఇంకా స్వాధీనం కాలేదు అనే ఉద్రిక్తత
  choice: “మీకు ఇచ్చిన దేశం”తోపాటు “స్వాధీనం చేసుకోవడానికి” అని ఉంచడం
  alternative: “మీకు ఇవ్వబోయే దేశం” అని భవిష్యత్తుగా మార్చడం
  rationale: హీబ్రూ పాఠం దేవుని అనుగ్రహాన్ని పూర్తయిన కార్యంగా పేర్కొంటూనే, ఇశ్రాయేలీయులు దానిని ఇంకా స్వాధీనం చేసుకోవలసి ఉందని చెబుతుంది. ఈ వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. “తాత్సారం చేస్తూ ఉంటారు” అనే ప్రయోగం మందలింపు స్వరాన్ని నిలుపుతూ, “సోమరులు” వంటి మూలంలో లేని తీవ్రమైన నైతిక తీర్పును నివారిస్తుంది. దైవనామం “యాహ్వే”గా లిప్యంతరీకరించబడింది.
