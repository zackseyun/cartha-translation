    issue: ‘పంచుకోని’ may imply mutual sharing rather than dividing/apportioning the inheritance.
    rationale: The Hebrew חָלְקוּ is active and means ‘had not divided/apportioned.’ In Telugu, ‘విభజించని’ expresses this more precisely without adding the reflexive or reciprocal nuance carried by ‘పంచుకోని.’
