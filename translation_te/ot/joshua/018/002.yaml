source:
  edition: WLC
  text: וַ/יִּוָּֽתְרוּ֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר לֹֽא חָלְק֖וּ אֶת נַֽחֲלָתָ֑/ם שִׁבְעָ֖ה שְׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/002.yaml
  text: But among the sons of Israel there remained seven tribes that had not apportioned their inheritance[a][b].
translation:
  language: te
  text: ఇశ్రాయేలీయుల్లో[a] తమ స్వాస్థ్యాన్ని ఇంకా విభజించని[b] ఏడు గోత్రాలు మిగిలి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారుల్లో.’ ఇక్కడ ఈ మాట ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తమ స్వాస్థ్యాన్ని ఇంకా పంచని.’ సందర్భానుసారంగా, ‘తమ స్వాస్థ్యం ఇంకా కేటాయించబడని’ లేదా ‘తమ స్వాస్థ్యాన్ని ఇంకా వాటాగా పొందని’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּתְרוּ
  choice: మిగిలి ఉన్నాయి
  rationale: יתר అనే ధాతువు నిఫల్ రూపంలో ఇక్కడ ఇంకా మిగిలి ఉన్నవారిని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘మిగిలి ఉన్నాయి’ సహజంగా ఉండి ఆ అస్తిత్వ భావాన్ని నిలుపుతుంది.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల్లో
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారుల్లో.’ ఇక్కడ అది ఇశ్రాయేలు ప్రజలను సూచించే వంశసంబంధమైన సాధారణ నామం కాబట్టి, ఆధునిక తెలుగులో సహజమైన ‘ఇశ్రాయేలీయుల్లో’ అని అనువదించబడింది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: אֲשֶׁר לֹא חָלְקוּ
  choice: తమ స్వాస్థ్యాన్ని ఇంకా పంచుకోని
  rationale: חלק భూవిభజన సందర్భంలో పంచడం లేదా వాటా కేటాయించడం అనే అర్థం ఇస్తుంది. హీబ్రూలో క్రియాశీల రూపం ఉన్నందున ప్రధాన పాఠ్యంలో ‘పంచుకోని’ అని ఉంచి, సందర్భానుసారంగా సాధ్యమైన ‘కేటాయించబడని/పొందని’ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֶת נַחֲלָתָם
  choice: తమ స్వాస్థ్యాన్ని
  rationale: נחלה ఇక్కడ గోత్రానికి వారసత్వంగా లభించే భూభాగాన్ని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఈ భూవాటా భావాన్నీ, వేదగ్రంథ సంబంధిత వారసత్వ భావాన్నీ సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: שִׁבְעָה שְׁבָטִים
  choice: ఏడు గోత్రాలు
  rationale: ఇశ్రాయేలు గోత్ర వ్యవస్థ సందర్భంలో שׁבט కు ‘గోత్రం’ సహజమైన, స్థిరమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: భూస్వాస్థ్య విభజనలో గోత్రాల పాత్రను క్రియాశీలంగా చెప్పాలా, వారికి వాటా కేటాయించబడలేదని చెప్పాలా
  choice: ప్రధాన పాఠ్యంలో ‘తమ స్వాస్థ్యాన్ని ఇంకా పంచుకోని’
  alternative: ‘తమ స్వాస్థ్యం ఇంకా కేటాయించబడని’ లేదా ‘తమ స్వాస్థ్యాన్ని ఇంకా పొందని’
  rationale: హీబ్రూ వ్యాకరణంలో ‘ఏడు గోత్రాలు’ క్రియకు కర్తగా ఉన్నా, సందర్భం అధికారిక భూవిభజనను సూచిస్తుంది. అందువల్ల క్రియాశీల నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, స్వీకరణ/కేటాయింపు కోణాన్ని పాదసూచికలో తెలిపాం; తద్వారా పాఠ్యంలోని ఉద్రిక్తతను ఒకే విధంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘ఇశ్రాయేలు కుమారులు’ అనే అక్షరానువాదం ప్రధాన పాఠ్యంలో అసహజంగా ఉండటంతో ‘ఇశ్రాయేలీయులు’ ఎంచుకొని, మూలరూపాన్ని పాదసూచికలో నిలిపాం. ‘ఇంకా’ అనే పదం మిగిలి ఉన్న గోత్రాల అసంపూర్ణ భూవిభజన స్థితిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
