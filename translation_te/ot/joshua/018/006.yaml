language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתֶּ֞ם תִּכְתְּב֤וּ אֶת הָ/אָ֨רֶץ֙ שִׁבְעָ֣ה חֲלָקִ֔ים וַֽ/הֲבֵאתֶ֥ם אֵלַ֖/י הֵ֑נָּה וְ/יָרִ֨יתִי לָ/כֶ֤ם גּוֹרָל֙ פֹּ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/006.yaml
  text: And you shall write down the land in seven portions and bring it here to me, and I will cast the lot for you here before the LORD our God.
translation:
  language: te
  text: మీరు దేశాన్ని ఏడు భాగాలుగా వర్ణించి వ్రాసి, ఆ వ్రాసిన వివరాలను ఇక్కడ నా దగ్గరకు తీసుకురండి; అప్పుడు నేను ఇక్కడ మన దేవుడైన యెహోవా సమక్షంలో మీ కొరకు చీటీ వేస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּכְתְּבוּ אֶת־הָאָרֶץ
  choice: దేశాన్ని ... వ్రాసి
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘దేశాన్ని వ్రాయండి’; సందర్భంలో భూభాగాన్ని వర్ణించి నమోదు చేయడం భావం. మూలంలోని సంక్షిప్తతను కాపాడుతూ సహజమైన తెలుగులో ఇచ్చాం.
- source_word: שִׁבְעָה חֲלָקִים
  choice: ఏడు భాగాలుగా
  rationale: భూమిని ఏడు విభాగాలుగా నమోదు చేయాలనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְיָרִיתִי לָכֶם גּוֹרָל
  choice: మీ కోసం చీటి వేస్తాను
  rationale: גּוֹרָל ఏకవచనంలో ఉంది; భూవిభజన నిర్ణయించే చీటి వేయడాన్ని సహజమైన తెలుగు వాడుకలో వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యెహోవా సన్నిధిలో
  rationale: దైవనామాన్ని యెహోవా అని లిప్యంతరీకరించి, לִפְנֵי ని గౌరవప్రదమైన సాధారణ తెలుగు ‘సన్నిధిలో’గా అనువదించాం.
theological_decisions:
- issue: గోరాలు వేయడం మరియు దైవసన్నిధి
  choice: ‘మన దేవుడైన యెహోవా సన్నిధిలో ... చీటి వేస్తాను’ అని మూల క్రమం, భావం నిలిపాం.
  alternative: ‘యెహోవా నిర్ణయం తెలుసుకోవడానికి చీటి వేస్తాను’
  rationale: ప్రత్యామ్నాయం పాఠ్యంలో ప్రత్యక్షంగా లేని ఉద్దేశాన్ని వివరిస్తుంది; మూలంలోని ఆచారపరమైన చర్యను వ్యాఖ్యానం లేకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని నిలిపే శైలి. ఆజ్ఞార్థక భావాన్ని సహజంగా తెలియజేయడానికి ‘వ్రాసి ... తీసుకురండి’ వాడాం.
