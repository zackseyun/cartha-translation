translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘స్వాస్థ్యం’ యెహోషువ గ్రంథంలోని భూభాగ వారసత్వ భావాన్ని నిలుపుతుంది; వాక్య క్రమం హీబ్రూ కార్యపరంపరను సాధ్యమైనంతవరకు అనుసరిస్తుంది.
