  source_fidelity: 'ప్రధాన భావం మూలానికి దగ్గరగా ఉంది: ప్రతి గోత్రం నుంచి ముగ్గురిని పంపించి భూమిని పరిశీలించి నమోదు చేయించాలి. అయితే ‘తమ స్వాస్థ్యానికి’ అనే రూపం తెలుగులో వ్యక్తిగత ఆస్తిని సూచించినట్లు వినిపిస్తుంది; ఇక్కడ సందర్భానుసారంగా గోత్రాల స్వాస్థ్య-భాగాలు/కేటాయింపుల ప్రకారం నమోదు చేయడమే భావం. ‘దేశమంతటా’ కూడా בָּאָרֶץ (‘దేశంలో/భూమిలో’) కంటే కొద్దిగా విస్తృతంగా ఉంది.'
