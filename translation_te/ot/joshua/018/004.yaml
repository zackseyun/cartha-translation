source:
  edition: WLC
  text: הָב֥וּ לָ/כֶ֛ם שְׁלֹשָׁ֥ה אֲנָשִׁ֖ים לַ/שָּׁ֑בֶט וְ/אֶשְׁלָחֵ֗/ם וְ/יָקֻ֜מוּ וְ/יִֽתְהַלְּכ֥וּ בָ/אָ֛רֶץ וְ/יִכְתְּב֥וּ אוֹתָ֛/הּ לְ/פִ֥י נַֽחֲלָתָ֖/ם וְ/יָבֹ֥אוּ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/004.yaml
  text: Provide for yourselves three men from each tribe[a], and I will send them out; they shall arise and walk through the land and write it down according to their inheritance[b], and they shall come to me.
translation:
  language: te
  text: “ప్రతి గోత్రం నుండి మీ కోసం ముగ్గురు మనుషులను సమకూర్చండి[a]. నేను వారిని పంపుతాను. వారు బయలుదేరి దేశంలో సంచరించి, తమ స్వాస్థ్య భాగాలకు అనుగుణంగా దాని వివరాలను నమోదు చేసి[b], నా దగ్గరికి రావాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి గోత్రం నుండి మీ కోసం ముగ్గురు మనుషులను నియమించండి.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, గోత్రాలకు స్వాస్థ్యంగా కేటాయించాల్సిన భూభాగాల ప్రకారం వారు దేశ వివరాలను నమోదు చేయాలి.
    reason: cultural_note
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: మీ కోసం నియమించండి
  rationale: హీబ్రూ ఆజ్ఞారూపం అక్షరార్థంగా ‘మీ కోసం ఇవ్వండి/సమకూర్చుకోండి’ అనే భావాన్ని కలిగిస్తుంది; ఈ సందర్భంలో ప్రతినిధులను ఎంపిక చేసి ఏర్పాటు చేయడాన్ని సహజమైన తెలుగులో ‘నియమించండి’ తెలియజేస్తుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: שְׁלֹשָׁה אֲנָשִׁים לַשָּׁבֶט
  choice: ప్రతి గోత్రం నుండి ముగ్గురు మనుషులను
  rationale: ఏకవచన రూపం ఇక్కడ పంపిణీ భావంలో ఉంది; ప్రతి గోత్రం నుంచి ముగ్గురు పురుష ప్రతినిధులు అనే అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וְאֶשְׁלָחֵם
  choice: నేను వారిని పంపుతాను
  rationale: శָׁלַח్ అనే క్రియ యొక్క సరళమైన అర్థమైన ‘పంపడం’ను అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: וְיָקֻמוּ
  choice: వారు బయలుదేరి
  rationale: కוּם అక్షరార్థంగా ‘లేవడం’; వరుస కార్యాలను ప్రారంభించే ఈ సందర్భంలో ‘బయలుదేరి’ సహజ తెలుగు భావాన్ని ఇస్తుంది.
- source_word: וְיִתְהַלְּכוּ בָאָרֶץ
  choice: దేశమంతటా తిరిగి
  rationale: హిత్పయేల్ రూపం దేశంలో అటూ ఇటూ సంచరించి పరిశీలించడాన్ని సూచిస్తుంది; ‘దేశమంతటా తిరిగి’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְיִכְתְּבוּ אוֹתָהּ
  choice: దానిని లిఖితంగా నమోదు చేసి
  rationale: స్త్రీలింగ కర్మప్రత్యయం ‘దేశం’ను సూచిస్తుంది. ‘లిఖితంగా నమోదు చేయడం’ మూలంలోని ‘దానిని వ్రాయడం’ అనే భావాన్ని తెలుగులో స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: לְפִי נַחֲלָתָם
  choice: తమ స్వాస్థ్యానికి అనుగుణంగా
  rationale: ‘వారి స్వాస్థ్యపు నోటి ప్రకారం’ అనే హీబ్రూ నుడికారం స్వాస్థ్య కేటాయింపులకు అనుగుణంగా నమోదు చేయడాన్ని సూచిస్తుంది; మూలంలోని బహువచన సంబంధాన్ని ‘తమ’ నిలుపుతుంది.
- source_word: וְיָבֹאוּ אֵלָי
  choice: నా దగ్గరికి రావాలి
  rationale: మూలం ‘నా దగ్గరికి రావడం’ అని మాత్రమే చెబుతుంది; సందర్భానుసారమైన ‘తిరిగి’ అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
