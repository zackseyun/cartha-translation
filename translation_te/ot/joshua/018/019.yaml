  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సరిహద్దు వర్ణనగా రూపొందించాం. మూలంలోని ‘భుజం’, ‘నాలుక’ అనే భౌగోళిక రూపకాలను నిలిపి, అస్పష్టతను పాదసూచికలో వివరించాం.
