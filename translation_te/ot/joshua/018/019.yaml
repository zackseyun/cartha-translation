source:
  edition: WLC
  text: וְ/עָבַ֨ר הַ/גְּב֜וּל אֶל כֶּ֣תֶף בֵּית חָגְלָה֮ צָפוֹנָ/ה֒ ו/היה תצאותי/ו הַ/גְּב֗וּל אֶל לְשׁ֤וֹן יָם הַ/מֶּ֨לַח֙ צָפ֔וֹנָ/ה אֶל קְצֵ֥ה הַ/יַּרְדֵּ֖ן נֶ֑גְבָּ/ה זֶ֖ה גְּב֥וּל נֶֽגֶב־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
translation:
  language: te
  text: అప్పుడు సరిహద్దు బేత్-హొగ్లా ఉత్తర భుజం వైపుగా సాగి, ఉప్పు సముద్రం[b]లోని ఉత్తరపు నాలుక[a] వద్ద, యొర్దాను దక్షిణపు చివరన ముగిసింది. ఇదే దక్షిణ సరిహద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి అక్షరార్థం ‘నాలుక’; ఇక్కడ అది నాలుక ఆకారంలో ఉన్న సముద్రపు అఖాతం లేదా చొచ్చుకువచ్చిన తీరభాగాన్ని సూచించే భౌగోళిక ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: దీనిని ‘మృత సముద్రం’ అని కూడా అంటారు; హీబ్రూ మూలపాఠంలో ‘ఉప్పు సముద్రం’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר הַגְּבוּל
  choice: అప్పుడు సరిహద్దు … వైపుగా సాగి
  rationale: సరిహద్దు వర్ణనల్లో עָבַר రేఖ తదుపరి స్థలం వైపు కొనసాగడాన్ని సూచిస్తుంది. ‘సాగి’ ఆధునిక తెలుగులో సహజంగా ఉండి భౌగోళిక క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֶּתֶף
  choice: భుజం
  rationale: మూలపదంలోని శరీరభాగ రూపకాన్ని నిలుపుతూ, ఒక స్థలపు పక్క లేదా వాలును సూచించే భౌగోళిక వాడుకను ప్రతిబింబిస్తుంది.
- source_word: בֵּית חָגְלָה
  choice: బేత్-హొగ్లా
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం.
- source_word: צָפוֹנָה
  choice: ఉత్తర
  rationale: ఇక్కడ బేత్-హొగ్లా యొక్క ఉత్తర వైపు లేదా భాగాన్ని సూచించే దిశార్థక ప్రయోగం.
- source_word: תצאותיו הַגְּבוּל
  choice: సరిహద్దు … ముగిసింది
  rationale: సరిహద్దు సూత్రాల్లో ఈ రూపం దాని చివరి స్థానం లేదా ముగింపును సూచిస్తుంది; ‘ముగిసింది’ స్పష్టమైన సహజ తెలుగు.
- source_word: לְשׁוֹן
  choice: నాలుక
  rationale: సముద్రతీరంలోని నాలుక ఆకారపు భౌగోళిక భాగాన్ని సూచించే మూల రూపకాన్ని నిలిపాం; దాని భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: יָם הַמֶּלַח
  choice: ఉప్పు సముద్రం
  rationale: ఆధునికంగా ప్రసిద్ధమైన ‘మృత సముద్రం’కు బదులుగా హీబ్రూ పేరును నేరుగా అనువదించాం.
- source_word: קְצֵה הַיַּרְדֵּן נֶגְבָּה
  choice: యొర్దాను దక్షిణపు చివరన
  rationale: קְצֵה అనేది చివర లేదా అంత్యభాగాన్ని, נֶגְבָּה దక్షిణ దిశను సూచిస్తాయి.
- source_word: זֶה גְּבוּל נֶגֶב
  choice: ఇదే దక్షిణ సరిహద్దు
  rationale: ఈ సందర్భంలో נֶגֶב ‘నెగెవు’ అనే ప్రాంతనామం కాకుండా దక్షిణ దిశను సూచిస్తుంది.
