translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; భూసరిహద్దు వర్ణనను సాధారణ పాఠకులకు సహజంగా అర్థమయ్యేలా ఇచ్చాం. స్థలనామాలను లిప్యంతరీకరించాం; మూలంలోని పునరుక్త సరిహద్దు క్రియలను తెలుగులో సాఫీగా సంక్షిప్తీకరించాం.
