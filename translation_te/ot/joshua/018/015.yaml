id: JOS.18.15
reference: Joshua 18:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/פְאַת נֶ֕גְבָּ/ה מִ/קְצֵ֖ה קִרְיַ֣ת יְעָרִ֑ים וְ/יָצָ֤א הַ/גְּבוּל֙ יָ֔מָּ/ה וְ/יָצָ֕א אֶל מַעְיַ֖ן מֵ֥י נֶפְתּֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
translation:
  language: te
  text: దక్షిణ వైపు కిర్యత్-యెయారీము అంచు నుండి ఉండేది; సరిహద్దు పడమటి దిశగా సాగి, నెఫ్తోయహు జలాల ఊట వరకు సాగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “సముద్రం వైపుగా”; ఈ భౌగోళిక సందర్భంలో “పడమటి దిశగా” అనే అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  choice: దక్షిణపు వైపు
  rationale: పֵאָה అనే పదం ‘వైపు/అంచు’ను సూచిస్తుంది; נֶגְבָּהతో కలిసి ఇక్కడ భూభాగపు దక్షిణ వైపును తెలియజేస్తుంది.
- source_word: מִקְצֵה
  choice: అంచు నుండి
  rationale: కָצֶה భౌగోళిక సందర్భంలో చివర లేదా అంచును సూచిస్తుంది; సరిహద్దు వర్ణనలో ‘అంచు’ సహజంగా ఉంది.
- source_word: קִרְיַת יְעָרִים
  choice: కిర్యత్-యెయారీము
  rationale: స్థలనామాన్ని అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: וְיָצָא הַגְּבוּל
  choice: సరిహద్దు ... సాగి
  rationale: יָצָא అక్షరార్థంగా ‘బయలుదేరు’ అయినా, సరిహద్దు వర్ణనల్లో రేఖ ఒక దిశగా విస్తరించడాన్ని సూచిస్తుంది; తెలుగులో ‘సాగి’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: יָמָּה
  choice: పడమటి వైపుగా
  rationale: అక్షరార్థం ‘సముద్రం వైపుగా’; ఇశ్రాయేలు భౌగోళిక సందర్భంలో ఇది పడమటి దిశను సూచిస్తుంది.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: నెఫ్తోయహు జలధార
  rationale: మַעְיַן అనేది నీటి ఊటను, מֵי అనేది ‘జలాలు’ అనే నిర్మాణాన్ని ఇస్తాయి. అసహజమైన పదపద అనువాదాన్ని నివారిస్తూ నీటి మూల భావాన్ని ‘జలధార’తో వ్యక్తం చేశాం; పూర్తి హీబ్రూ నిర్మాణాన్ని పాదసూచికలో ఇచ్చాం.
