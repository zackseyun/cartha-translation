source:
  edition: WLC
  text: וַ/יָּקֻ֥מוּ הָ/אֲנָשִׁ֖ים וַ/יֵּלֵ֑כוּ וַ/יְצַ֣ו יְהוֹשֻׁ֡עַ אֶת הַ/הֹלְכִים֩ לִ/כְתֹּ֨ב אֶת הָ/אָ֜רֶץ לֵ/אמֹ֗ר לְ֠כוּ וְ/הִתְהַלְּכ֨וּ בָ/אָ֜רֶץ וְ/כִתְב֤וּ אוֹתָ/הּ֙ וְ/שׁ֣וּבוּ אֵלַ֔/י וּ֠/פֹה אַשְׁלִ֨יךְ לָ/כֶ֥ם גּוֹרָ֛ל לִ/פְנֵ֥י יְהוָ֖ה בְּ/שִׁלֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
translation:
  language: te
  text: 'అప్పుడు ఆ మనుషులు లేచి వెళ్లారు. దేశ వివరాలను రాయడానికి వెళ్తున్నవారికి యెహోషువ ఇలా ఆజ్ఞాపించాడు: “మీరు వెళ్లి దేశమంతటా సంచరించి, దాన్ని రాసి నమోదు చేయండి[a]. తరువాత నా దగ్గరికి తిరిగి రండి. ఇక్కడ షిలోహులో యాహ్వే సన్నిధిలో మీ కోసం నేను చీటి వేస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “దాన్ని [దేశాన్ని] రాయండి.” అంటే భూభాగాల కేటాయింపు కోసం దేశాన్ని పరిశీలించి, దాని వివరాలను లిఖితంగా నమోదు చేయడం.
    reason: హీబ్రూ నుడికారంలోని అక్షరార్థాన్ని, సందర్భానుసారమైన ‘వివరాలను నమోదు చేయడం’ అనే భావాన్ని రెండింటినీ చూపించడానికి.
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  choice: ఆ మనుషులు లేచి వెళ్లారు
  rationale: క్రమంగా జరిగిన చర్యలను సూచించే హీబ్రూ కథన నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు వాక్యంగా అందిస్తుంది; הָאֲנָשִׁים అనే నిర్దిష్ట పురుషవాచక సూచనను ‘మనుషులు’గా నిలుపుతుంది.
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అధికారపూర్వకమైన నిర్దేశాన్ని సూచిస్తుంది; సందర్భంలో యెహోషువ నాయకత్వ అధికారాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִכְתֹּב אֶת־הָאָרֶץ
  choice: దేశ వివరాలను రాయడానికి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘దేశాన్ని రాయడం’ ఉన్నప్పటికీ, భూభాగాన్ని పంచడానికి దాని లిఖిత వివరణను సిద్ధం చేయడమే సందర్భార్థం. తెలుగు పాఠకులకు సహజంగా ఉండేలా అర్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  choice: దేశమంతటా సంచరించి
  rationale: התהלך భూభాగంలో అటూ ఇటూ తిరిగి పరిశీలించడాన్ని సూచిస్తుంది; ‘సంచరించి’ ఆ విస్తృత కదలికను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְכִתְבוּ אוֹתָהּ
  choice: దాన్ని రాసి నమోదు చేయండి
  rationale: כתב యొక్క ‘రాయు’ అనే మూల భావాన్ని నిలుపుతూ, ఇక్కడ ఉద్దేశించిన లిఖిత భూవివరణను ‘నమోదు చేయండి’ ద్వారా స్పష్టం చేస్తుంది; అక్షరార్థ అసాధారణతను పాదసూచికలో ఉంచుతుంది.
- source_word: וְשׁוּבוּ אֵלַי
  choice: నా దగ్గరికి తిరిగి రండి
  rationale: שוב యొక్క తిరిగి రావడం అనే సాధారణ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אַשְׁלִיךְ לָכֶם גּוֹרָל
  choice: మీ కోసం నేను చీటి వేస్తాను
  rationale: גורל ఏకవచనాన్ని ‘చీటి’గా నిలుపుతూ, భూభాగ కేటాయింపును చీటి ద్వారా నిర్ణయించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בְּשִׁלֹה
  choice: షిలోహులో
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చి, హీబ్రూ స్థానవాచక ఉపసర్గ భావాన్ని ‘లో’తో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, YHWHకు సాధారణంగా పునర్నిర్మించే ఉచ్చారణ ‘Yahweh’ను తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- issue: לִפְנֵי יְהוָה యొక్క సంబంధార్థం
  choice: యాహ్వే సన్నిధిలో
  alternative: యాహ్వే ఎదుట
  rationale: చీటి వేయడం దేవుని సమక్షంలో జరిగే కార్యమని తెలిపే לפני భావాన్ని గంభీరమైన, సహజమైన తెలుగు మతపరమైన వాడుకలో అందిస్తుంది; ఫలితానికి సంబంధించిన అదనపు సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చదు.
- issue: הָאֲנָשִׁים యొక్క లింగ సూచన
  choice: ఆ మనుషులు
  alternative: ఆ ప్రజలు / వారు
  rationale: ఇక్కడ భూసర్వే కోసం నియమించబడిన నిర్దిష్ట పురుష ప్రతినిధులనే మూలపాఠం సూచిస్తుంది; అందువల్ల దాన్ని లింగనిరపేక్ష సమూహంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం ఉపయోగించబడింది. ప్రత్యక్ష ఆజ్ఞల్లో మర్యాదపూర్వక బహువచన రూపాలు వాడబడ్డాయి.
