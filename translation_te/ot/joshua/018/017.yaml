  text: וְ/תָאַ֣ר מִ/צָּפ֗וֹן וְ/יָצָא֙ עֵ֣ין שֶׁ֔מֶשׁ וְ/יָצָא֙ אֶל גְּלִיל֔וֹת אֲשֶׁר נֹ֖כַח מַעֲלֵ֣ה אֲדֻמִּ֑ים וְ/יָרַ֕ד אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
translation:
  language: te
  text: సరిహద్దు ఉత్తరంవైపు మళ్లి, ఏన్‌షెమెషు[a] వరకు సాగింది; అదుమ్మీము ఎక్కే దారికి[c] ఎదురుగా ఉన్న గెలీలోతు[b] వరకు వెళ్లి, రూబేను కుమారుడైన బోహను రాయి వరకు దిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఏన్‌షెమెషు” అంటే “సూర్యుని ఊట.” ప్రధాన పాఠ్యంలో దీనిని స్థలనామంగా లిప్యంతరీకరించాం.
    reason: lexical_alternative
  - marker: b
    text: “గెలీలోతు” అనే పదానికి “వలయాలు” లేదా “ప్రాంతాలు” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ దీనిని స్థలనామంగా తీసుకున్నాం.
    reason: lexical_alternative
  - marker: c
    text: లేదా “అదుమ్మీము కనుమ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר מִצָּפוֹן
  choice: ఉత్తరం వైపు వంగి
  rationale: సరిహద్దు వర్ణనలో תאר దాని మార్గం మలుపు తిరగడం లేదా వంపు తీసుకోవడం సూచిస్తుంది; מִצָּפוֹן ఇక్కడ గమనదిశను తెలిపేదిగా తీసుకున్నాం.
- source_word: וְיָצָא
  choice: వరకు వెళ్లింది
  rationale: భూసరిహద్దు ప్రయాణాన్ని తెలిపే పునరావృత క్రియను సహజమైన ఆధునిక తెలుగులో గమ్యస్థానంతో కలిపి వ్యక్తం చేస్తుంది.
- source_word: עֵין שֶׁמֶשׁ
  choice: ఏన్‌షెమెషు
  rationale: అర్థాన్ని ప్రధాన పాఠ్యంలో అనువదించకుండా స్థలనామంగా లిప్యంతరీకరించాం.
- source_word: גְּלִילוֹת
  choice: గెలీలోతు
  rationale: ఈ సందర్భంలో సాధారణ నామవాచకార్థం సాధ్యమైనా, భౌగోళిక స్థలనామంగా గ్రహించి లిప్యంతరీకరించాం.
- source_word: נֹכַח
  choice: ఎదురుగా ఉన్న
  rationale: రెండు భౌగోళిక స్థలాల పరస్పర స్థానాన్ని సహజంగా, స్పష్టంగా తెలుపుతుంది.
- source_word: מַעֲלֵה אֲדֻמִּים
  choice: అదుమ్మీము ఎక్కుదల
  rationale: מַעֲלֵה సూచించే పైకి ఎక్కే భూభాగాన్ని నిలుపుతూ, అదుమ్మీము అనే పేరును లిప్యంతరీకరించాం.
- source_word: וְיָרַד
  choice: దిగింది
  rationale: భూభాగంలో కిందికి సాగే సరిహద్దు మార్గాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  choice: రూబేను కుమారుడైన బోహను రాయి
  rationale: నిర్మాణ సంబంధాన్ని స్పష్టంగా ఉంచి, బోహనును రూబేను కుమారుడిగా గుర్తించే మూలపాఠ్య రూపాన్ని నిలిపాం.
