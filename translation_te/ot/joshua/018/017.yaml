translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. సరిహద్దు కదలికల క్రమాన్ని నిలుపుతూ, హెబ్రీ భౌగోళిక నామాలను తెలుగు లిపిలో సహజంగా ఇచ్చాం; అర్థసందిగ్ధతలను పాదసూచికల్లో భద్రపరిచాం.
