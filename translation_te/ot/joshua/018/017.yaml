  source_fidelity: The draft preserves the boundary sequence and all principal landmarks, but it adds “అక్కడి నుండి” (‘from there’) twice, although the Hebrew does not state this. More importantly, the repeated Hebrew boundary verb ויצא is better retained as a continuing movement of the boundary rather than divided into separate ‘from there’ clauses.
