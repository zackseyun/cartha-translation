    issue: Unstated ‘from there’ clauses
    rationale: “అక్కడి నుండి” occurs twice in the draft, but the Hebrew has only a chain of boundary verbs and destinations. The added deictic wording is not needed for idiomatic Telugu and slightly over-specifies the source.
  - severity: low
    issue: Stiff rendering of Maaleh Adummim
