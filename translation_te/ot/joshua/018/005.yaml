source:
  edition: WLC
  text: וְ/הִֽתְחַלְּק֥וּ אֹתָ֖/הּ לְ/שִׁבְעָ֣ה חֲלָקִ֑ים יְהוּדָ֞ה יַעֲמֹ֤ד עַל גְּבוּל/וֹ֙ מִ/נֶּ֔גֶב וּ/בֵ֥ית יוֹסֵ֛ף יַעַמְד֥וּ עַל גְּבוּלָ֖/ם מִ/צָּפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
translation:
  language: te
  text: వారు దానిని ఏడు భాగాలుగా విభజించాలి. యూదా దక్షిణం వైపున తన సరిహద్దులోనే ఉండాలి[a]; యోసేపు వంశం ఉత్తరం వైపున తమ సరిహద్దులోనే ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన సరిహద్దు వద్ద నిలబడాలి’; అలాగే తరువాతి వాక్యభాగంలో, ‘తమ సరిహద్దు వద్ద నిలబడాలి.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘నిలుచు’ అని అర్థం; ఇక్కడ అది ఇప్పటికే ఉన్న భూసరిహద్దుల్లోనే కొనసాగి ఉండడాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  choice: వారు దానిని ... పంచుకోవాలి
  rationale: חלק అనే క్రియ యొక్క హిత్పయేల్ రూపం ఇక్కడ దేశాన్ని గోత్రాల మధ్య భాగాలుగా పంచుకోవడాన్ని సూచిస్తుంది. ‘పంచుకోవాలి’ పరస్పర పంపక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: ఏడు భాగాలుగా
  rationale: חֲלָקִים అనేది విభజించబడిన భూభాగాలను సూచిస్తుంది; ‘భాగాలు’ స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: గోత్రనామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: יַעֲמֹד עַל גְּבוּלוֹ
  choice: తన సరిహద్దులోనే ఉండాలి
  rationale: עמד అక్షరార్థంగా ‘నిలుచు’ అయినప్పటికీ, ఈ భూసరిహద్దుల సందర్భంలో ముందే నిర్ణయించబడిన స్థానంలో కొనసాగడాన్ని సూచిస్తుంది. ‘ఉండాలి’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది; ‘నే’ స్థిరత్వ భావాన్ని తెలియజేస్తుంది.
- source_word: מִנֶּגֶב
  choice: దక్షిణం వైపున
  rationale: ఇక్కడ נֶגֶב ప్రత్యేకంగా నెగెవు ప్రాంతాన్ని కాక దక్షిణ దిశను సూచిస్తుంది; ఉత్తరంతో ఉన్న సమాంతర నిర్మాణాన్ని ఈ అనువాదం నిలుపుతుంది.
- source_word: וּבֵית יוֹסֵף
  choice: యోసేపు వంశస్థులు
  rationale: ‘యోసేపు ఇంటివారు’ అనే అక్షరార్థ రూపం కంటే ‘యోసేపు వంశస్థులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, యోసేపుకు చెందిన గోత్రాల సమూహాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: יַעַמְדוּ עַל גְּבוּלָם
  choice: తమ సరిహద్దులోనే ఉండాలి
  rationale: బహువచన క్రియ, బహువచన స్వామ్యప్రత్యయం యోసేపు వంశస్థుల సమూహాన్ని సూచిస్తాయి. భూసరిహద్దుల సందర్భంలో עמד యొక్క భావం ‘అక్కడే కొనసాగి ఉండడం’.
- source_word: מִצָּפוֹן
  choice: ఉత్తరం వైపున
  rationale: ఇది ఉత్తర దిశను సూచిస్తుంది; ‘దక్షిణం వైపున’ అనే ముందు పదబంధానికి సహజమైన సమాంతర రూపం.
