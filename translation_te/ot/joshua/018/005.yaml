  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. భూభాగాల పంపక సందర్భాన్ని సహజంగా వ్యక్తం చేస్తూనే, עמד యొక్క అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరచింది.
