  source_fidelity: The principal meaning is conveyed, but “వంశస్థులు” narrows the corporate Hebrew designation בֵּית־יוֹסֵף (“house of Joseph”) to lineal descendants. “యోసేపు వంశం” more directly retains the collective tribal designation. “విభజించాలి” is also a more precise rendering of the apportioning action than “పంచుకోవాలి.”
