id: JOS.18.10
reference: Joshua 18:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּשְׁלֵךְ֩ לָ/הֶ֨ם יְהוֹשֻׁ֧עַ גּוֹרָ֛ל בְּ/שִׁלֹ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְחַלֶּק שָׁ֨ם יְהוֹשֻׁ֧עַ אֶת הָ/אָ֛רֶץ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל כְּ/מַחְלְקֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
translation:
  language: te
  text: అప్పుడు యెహోషువ షిలోహులో యాహ్వే సన్నిధిలో వారి కోసం చీట్లు వేశాడు. అక్కడ యెహోషువ ఇశ్రాయేలు కుమారులకు[a] వారి వాటాల ప్రకారం దేశాన్ని పంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘ఇశ్రాయేలు కుమారులు.’ ఈ మాట ఇశ్రాయేలు ప్రజలందరినీ సమూహంగా సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ ... גּוֹרָל
  choice: చీట్లు వేశాడు
  rationale: చీట్లు వేసి నిర్ణయించే పంపక విధానాన్ని తెలిపే హీబ్రూ నుడికారానికి ఇది సహజమైన తెలుగు సమానం.
- source_word: בְּשִׁלֹה
  choice: షిలోహులో
  rationale: పేరు గల స్థలంలో జరిగిన కార్యాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: ఆ కార్యం యాహ్వే సమక్షంలో, బహుశా ఆరాధనా స్థలంలో, జరిగిందనే భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: וַיְחַלֶּק
  choice: పంచాడు
  rationale: దేశాన్ని ఇశ్రాయేలు వర్గాల మధ్య విభజించి కేటాయించడాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశాన్ని
  rationale: ఇక్కడ పదం కేవలం నేలను కాక, ఇశ్రాయేలీయులకు పంచబడుతున్న భూభాగాన్ని సూచిస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: హీబ్రూలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలుపుతూ, దాని సమూహార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: כְּמַחְלְקֹתָם
  choice: వారి వారి విభాగాల ప్రకారం
  rationale: పంపకానికి సంబంధించిన వారి విభాగాలు లేదా వర్గీకరణలను సూచించే మూలపద భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: హీబ్రూ మూలంలో ఉన్న దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. మూలంలోని రెండు వరుస కార్యాలను, షిలోహు అనే స్థల సూచనను, దైవసన్నిధి భావాన్ని నిలిపింది.
