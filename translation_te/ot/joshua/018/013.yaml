source:
  edition: WLC
  text: וְ/עָבַר֩ מִ/שָּׁ֨ם הַ/גְּב֜וּל ל֗וּזָ/ה אֶל כֶּ֤תֶף ל֨וּזָ/ה֙ נֶ֔גְבָּ/ה הִ֖יא בֵּֽית אֵ֑ל וְ/יָרַ֤ד הַ/גְּבוּל֙ עַטְר֣וֹת אַדָּ֔ר עַל הָ/הָ֕ר אֲשֶׁ֛ר מִ/נֶּ֥גֶב לְ/בֵית חֹר֖וֹן תַּחְתּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/013.yaml
  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
translation:
  language: te
  text: అక్కడి నుండి సరిహద్దు బేతేలు అయిన లూజువరకు, దక్షిణాన ఉన్న దాని కొండవాలు[a] వరకు సాగింది. తరువాత సరిహద్దు దిగువ బేత్‌-హోరోనుకు దక్షిణాన ఉన్న కొండపై ఉన్న అత్రోత్‌-అద్దారు వరకు[b] దిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దక్షిణాన ఉన్న లూజు భుజానికి”; ఇక్కడ “భుజం” అనే హీబ్రూ పదం కొండ పక్కను లేదా వాలును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ స్థలనామాన్ని “అతారోత్‌-అద్దారు” అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר ... הַגְּבוּל
  choice: సరిహద్దు ... సాగింది
  rationale: సరిహద్దు వర్ణనలో దాని మార్గాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వ్యక్తులు దాటారనే భావాన్ని కలిగించదు.
- source_word: לוּזָה
  choice: లూజుకు
  rationale: దిశను సూచించే హీబ్రూ ప్రత్యయాన్ని తెలుగులో చతుర్థీ విభక్తితో వ్యక్తం చేసి, స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: אֶל כֶּתֶף לוּזָה נֶגְבָּה
  choice: దక్షిణాన ఉన్న లూజు కొండవాలుకు
  rationale: כֶּתֶף అనే శరీరభాగ పదం ఇక్కడ భౌగోళికంగా కొండ పక్కను లేదా వాలును సూచిస్తుంది; ‘కొండవాలు’ భూస్వరూపాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִיא בֵּית אֵל
  choice: అంటే బేతేలుకు
  rationale: లూజును బేతేలుగా గుర్తించే వివరణాత్మక సమానార్థక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְיָרַד הַגְּבוּל
  choice: సరిహద్దు ... దిగింది
  rationale: సరిహద్దు మార్గంలోని దిగువ దిశను తెలిపే భౌగోళిక రూపకాన్ని నిలుపుతుంది.
- source_word: עַטְרוֹת אַדָּר
  choice: అత్రోత్‌-అద్దారు
  rationale: హీబ్రూ స్థలనామాన్ని దాని వ్యంజనరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: עַל הָהָר
  choice: కొండమీద
  rationale: నిర్దిష్టమైన ఏకవచన భూస్వరూపాన్ని సూచించే హీబ్రూ పదబంధాన్ని సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  choice: దిగువ బేత్‌-హోరోనుకు దక్షిణాన ఉన్న
  rationale: מִנֶּגֶב తెలిపే దక్షిణ స్థానాన్ని, תַּחְתּוֹן తెలిపే ‘దిగువ’ గుర్తింపును నేరుగా నిలుపుతుంది.
