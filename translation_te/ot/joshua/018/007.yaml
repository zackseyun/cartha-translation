source:
  edition: WLC
  text: כִּ֠י אֵֽין חֵ֤לֶק לַ/לְוִיִּם֙ בְּ/קִרְבְּ/כֶ֔ם כִּֽי כְהֻנַּ֥ת יְהוָ֖ה נַחֲלָת֑/וֹ וְ/גָ֡ד וּ/רְאוּבֵ֡ן וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֤בֶר לַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/007.yaml
  text: For there is no portion for the Levites among you[a], because the priesthood of Yahweh is their inheritance. And Gad, Reuben, and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Yahweh gave them.
translation:
  language: te
  text: ఎందుకంటే మీ మధ్య లేవీయులకు భూభాగంలో వాటా లేదు; యెహోవా యాజకత్వమే వారి స్వాస్థ్యం.[a] గాదు, రూబేను, మనష్షే అర్ధగోత్రం యొర్దానుకు అవతల తూర్పున తమ స్వాస్థ్యాన్ని పొందారు. యెహోవా సేవకుడైన మోషే దాన్ని వారికి ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా ‘అతని స్వాస్థ్యం.’ ఇక్కడ ఏకవచనం లేవి గోత్రాన్ని లేదా లేవీయులను సమష్టిగా సూచిస్తున్నట్లు కనిపిస్తుంది; అందుకే ప్రధాన పాఠంలో ‘వారి స్వాస్థ్యం’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶק
  choice: భూభాగంలో వాటా
  rationale: భూమి పంచే సందర్భంలో ‘వాటా’ సహజమైనది; ‘భూభాగంలో’ అనే వివరణ దీనిని తరువాతి ‘స్వాస్థ్యం’ నుండి వేరు చేస్తుంది.
- source_word: לַלְוִיִּם
  choice: లేవీయులకు
  rationale: లేవి గోత్రానికి చెందిన సమూహాన్ని సూచించే ప్రామాణిక తెలుగు రూపం.
- source_word: בְּקִרְבְּכֶם
  choice: మీ మధ్య
  rationale: గోత్రాల మధ్య భూవిభజన అనే సందర్భానికి సరిపోయే సహజమైన అనువాదం.
- source_word: כְהֻנַּת יְהוָה
  choice: యెహోవా యాజకత్వం
  rationale: యాజక పదవి, సేవ అనే సంస్థాగత భావాన్ని నిలుపుతూ యెహోవాతో ఉన్న సంబంధాన్ని నేరుగా చూపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: נַחֲלָתוֹ
  choice: వారి స్వాస్థ్యం
  rationale: హీబ్రూలో ప్రత్యయం ఏకవచనమైనా, దాని పూర్వపదమైన లేవీయులు సమష్టిగా ఉద్దేశించబడ్డారు; తెలుగులో బహువచనం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָקְחוּ
  choice: పొందారు
  rationale: మూల క్రియకు ‘తీసుకున్నారు’ అనే అక్షరార్థం ఉన్నా, చట్టబద్ధంగా కేటాయించిన భూమిని స్వీకరించడాన్ని ఈ సందర్భంలో ‘పొందారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: נַחֲלָתָם
  choice: తమ స్వాస్థ్యాన్ని
  rationale: వంశపారంపర్యంగా కేటాయించబడిన భూభాగాన్ని సూచించే సందర్భోచిత పదం.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה
  choice: యొర్దానుకు అవతల తూర్పున
  rationale: యొర్దాను నదికి తూర్పు వైపున ఉన్న ప్రాంతాన్ని సహజంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: עֶבֶד יְהוָה
  choice: యెహోవా సేవకుడు
  rationale: మోషేకు ఇచ్చిన గౌరవప్రదమైన ఒడంబడిక సంబంధిత బిరుదును సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా తెలుగు లిప్యంతరీకరణలో ఉంచాం.
- issue: נַחֲלָתוֹ లోని సమష్టి ఏకవచనం
  choice: వారి స్వాస్థ్యం
  alternative: అతని స్వాస్థ్యం
  rationale: వ్యాకరణ రూపం ఏకవచనమైనప్పటికీ భావసూచకం లేవీయుల సమూహం. ప్రధాన పాఠంలో సహజమైన సమష్టి బహువచనాన్ని వాడి, అక్షరరూపాన్ని పాదటిప్పణిలో తెలియజేశాం.
- issue: כְהֻנַּת יְהוָה యొక్క భావపరిధి
  choice: యెహోవా యాజకత్వం
  alternative: యెహోవాకు చేసే యాజకసేవ
  rationale: మూలపదం యాజక పదవి లేదా యాజకసేవ రెండింటినీ సూచించగలదు. సంక్షిప్తమైన ‘యాజకత్వం’ సంస్థాగత భావాన్ని నిలుపుతుంది; సేవాభావాన్ని నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. భూవిభజన సందర్భాన్ని స్పష్టం చేయడానికి ‘భూభాగంలో వాటా’ అని వాడాం. పొడవైన చివరి వాక్యాన్ని సహజ పఠనార్థం రెండు వాక్యాలుగా విభజించాం; సంబంధార్థం మారలేదు.
