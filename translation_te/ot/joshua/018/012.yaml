base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
translation:
  language: te
  text: వారి ఉత్తర వైపున సరిహద్దు యొర్దాను నది నుండి మొదలైంది. ఆ సరిహద్దు యెరికో ఉత్తర వాలుకు[a] ఎక్కి, అక్కడి నుండి పడమటి దిశగా కొండ ప్రాంతంలోకి ఎక్కి, బేతావెను అరణ్యంలో ముగిసింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి అక్షరార్థం ‘యెరికో భుజం’; భౌగోళిక వాడుకలో అది యెరికో వైపు లేదా వాలును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘దాని బయటికి వెళ్లే చోటులు’ అనే బహువచన భౌగోళిక పదం ఉంది; ఇక్కడ అది సరిహద్దు ముగిసే స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה
  choice: ఉత్తర వైపు
  rationale: פאה ఇక్కడ భూభాగపు వైపు లేదా అంచును సూచిస్తుంది; సరిహద్దు వర్ణనలో ‘ఉత్తర వైపు’ సహజంగా ఉంది.
- source_word: מִן הַיַּרְדֵּן
  choice: యొర్దాను నది దగ్గర మొదలైంది
  rationale: מן ఆరంభ బిందువును సూచిస్తుంది. తెలుగులో కేవలం ‘నుంచి ఉండేది’ అనడం కంటే సరిహద్దు అక్కడ మొదలైందని చెప్పడం సహజం; స్పష్టత కోసం ‘నది’ చేర్చబడింది.
- source_word: וְעָלָה
  choice: ఎక్కి
  rationale: עלה భౌగోళిక ఎత్తుదిశలో సాగడాన్ని సూచిస్తుంది; ‘ఎక్కి’ ఆ స్థలచిత్రాన్ని నిలుపుతుంది.
- source_word: אֶל כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  choice: యెరికోకు ఉత్తరాన ఉన్న వాలుకు
  rationale: כתף అక్షరార్థంగా ‘భుజం’; భౌగోళిక వాడుకలో కొండవాలు లేదా పక్కను సూచిస్తుంది. ‘వాలు’ భూస్వరూపాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָהָר יָמָּה
  choice: పడమటి దిశగా కొండ ప్రాంతంలోకి
  rationale: הר ఇక్కడ ఒకే కొండకన్నా కొండ ప్రాంతాన్ని సూచించవచ్చు; ימה అంటే పడమటి దిశగా. ב యొక్క గమ్య/స్థాన భావాన్ని ‘లోకి’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תֹּצְאֹתָיו
  choice: ముగిసింది
  rationale: సరిహద్దు సూత్రాలలో תוצאות దాని చివరి స్థానం లేదా ముగింపు బిందువును సూచిస్తుంది; తెలుగు క్రియారూపం వాక్యాన్ని సహజంగా ఉంచుతుంది.
- source_word: מִדְבַּרָה בֵּית אָוֶן
  choice: బేతావెను అరణ్యం దగ్గర
  rationale: దిశార్థక రూపం సరిహద్దు చేరే చివరి ప్రాంతాన్ని సూచిస్తుంది; ‘దగ్గర’ ఖచ్చితంగా లోపలేనని అతిగా నిర్ణయించకుండా ముగింపు స్థానాన్ని తెలియజేస్తుంది.
