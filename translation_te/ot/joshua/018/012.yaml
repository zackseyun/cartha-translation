  - severity: low
    issue: Potentially misleading attachment of ‘north’ to Jericho slope
    rationale: ‘యెరికోకు ఉత్తరాన ఉన్న వాలు’ may locate the slope north of the city. ‘యెరికో ఉత్తర వాలు’ more naturally identifies it as the northern slope/side of Jericho.
