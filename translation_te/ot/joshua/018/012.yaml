translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన భౌగోళిక వర్ణన. స్థలనామాలు ‘యొర్దాను’, ‘యెరికో’, ‘బేతావెను’గా లిప్యంతరీకరించబడ్డాయి; హీబ్రూ భౌగోళిక రూపకాలూ బహువచన సాంకేతిక పదమూ పాదసూచనల్లో నిలుపబడ్డాయి.
