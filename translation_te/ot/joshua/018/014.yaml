  source_fidelity: సవరించిన పాఠం וְתָאַר మరియు וְנָסַב అనే రెండు వరుస క్రియలను—సరిహద్దు సాగడం/విస్తరించడం మరియు దిశ మార్చి వంపు తిరగడం—స్పష్టంగా ప్రతిబింబిస్తుంది. పడమర వైపు, దక్షిణ దిశ, బేత్‌హోరోనుకు దక్షిణాన ఎదురుగా ఉన్న కొండ, కిర్యత్‌బయలు/కిర్యత్‌యారీము అనే ప్రత్యామ్నాయ పేరు, యూదా గోత్రసంబంధ పట్టణం అన్న వివరాలు నిలిపింది.
