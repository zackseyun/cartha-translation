id: JOS.18.14
reference: Joshua 18:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/תָאַ֣ר הַ/גְּבוּל֩ וְ/נָסַ֨ב לִ/פְאַת יָ֜ם נֶ֗גְבָּ/ה מִן הָ/הָר֙ אֲשֶׁ֨ר עַל פְּנֵ֥י בֵית חֹרוֹן֮ נֶגְבָּ/ה֒ ו/היה תֹֽצְאֹתָ֗י/ו אֶל קִרְיַת בַּ֨עַל֙ הִ֚יא קִרְיַ֣ת יְעָרִ֔ים עִ֖יר בְּנֵ֣י יְהוּדָ֑ה זֹ֖את פְּאַת יָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/014.yaml
  text: Then the border curved and turned on the west side southward from the mountain that faces Beth-horon on the south[a], and its end was at Kiriath-baal (that is, Kiriath-jearim), a city of the sons of Judah. This was the western side.
translation:
  language: te
  text: ఆ సరిహద్దు బేత్‌హోరోనుకు దక్షిణంగా ఎదురుగా ఉన్న కొండనుండి పడమటి వైపునకు దక్షిణ దిశగా సాగి వంపు తిరిగింది. అది కిర్యత్‌బయలు దగ్గర ముగిసింది; అదే కిర్యత్‌యారీము. అది యూదా వంశస్థుల[a] పట్టణం. ఇదే పడమటి వైపు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘యూదా కుమారులు’; ఇది యూదా గోత్రానికి చెందిన ప్రజలను లేదా యూదా వంశస్థులను సూచించే పేరు.
    reason: మూలంలోని בְּנֵי అనే బంధుత్వ పదానికి ఉన్న అక్షరార్థాన్ని, ఇక్కడి గోత్రసంబంధ భావాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וְתָאַר הַגְּבוּל וְנָסַב
  choice: ఆ సరిహద్దు ... వంపు తిరిగింది
  rationale: సరిహద్దు రేఖ సాగుతూ దిశ మార్చుకున్న భౌగోళిక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; రెండు క్రియల కలయికను అనవసరంగా పునరుక్తి చేయదు.
- source_word: לִפְאַת יָם נֶגְבָּה
  choice: పడమటి వైపున దక్షిణ దిశగా
  rationale: సరిహద్దు వివరణల్లో יָם అంటే ‘పడమర’; దిశను సూచించే נֶגְבָּה భావాన్ని ‘దక్షిణ దిశగా’ స్పష్టంగా అందిస్తుంది.
- source_word: מִן הָהָר אֲשֶׁר עַל־פְּנֵי בֵית חֹרוֹן נֶגְבָּה
  choice: బేత్‌హోరోనుకు దక్షిణంగా ఎదురుగా ఉన్న కొండనుండి
  rationale: עַל־פְּנֵי యొక్క ప్రదేశసంబంధ భావాన్ని ‘ఎదురుగా’ అని, రెండో נֶגְבָּה సూచించే దక్షిణ స్థానాన్ని ‘దక్షిణంగా’ అని నిలుపుతుంది.
- source_word: וְהָיָה תֹצְאֹתָיו
  choice: అది ... దగ్గర ముగిసింది
  rationale: సరిహద్దు చివరి బిందువును సూచించే హీబ్రూ నానుడిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קִרְיַת בַּעַל ... קִרְיַת יְעָרִים
  choice: కిర్యత్‌బయలు ... కిర్యత్‌యారీము
  rationale: ఒకే పట్టణానికి ఉన్న రెండు పేర్లను మూలానికి అనుగుణంగా లిప్యంతరీకరించి, ‘అదే’ ద్వారా వాటి సమానత్వాన్ని చూపుతుంది.
- source_word: עִיר בְּנֵי יְהוּדָה
  choice: యూదా వంశస్థుల పట్టణం
  rationale: בְּנֵי అనే బంధుత్వ పదం ఇక్కడ గోత్రప్రజలను సూచిస్తుంది; ‘వంశస్థులు’ స్త్రీపురుషులందరినీ కలుపుకునే సహజమైన తెలుగు రూపం.
- source_word: זֹאת פְּאַת יָם
  choice: ఇదే పడమటి వైపు
  rationale: సరిహద్దు వివరణను ముగించే సంక్షిప్త భౌగోళిక సూత్రాన్ని నేరుగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భౌగోళిక సరిహద్దు వర్ణనకు తగిన సంక్షిప్తమైన గంభీర శైలి వాడబడింది. స్థలనామాలు తెలుగు బైబిలు పఠనానికి అనుకూలంగా లిప్యంతరీకరించబడ్డాయి; పాదసూచిక గుర్తు అది వివరిస్తున్న ‘యూదా వంశస్థుల’ వెంట ఉంచబడింది.
