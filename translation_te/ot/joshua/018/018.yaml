translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సరిహద్దు వర్ణనను సహజంగా రూపొందించాం. మూలంలోని భౌగోళిక ‘భుజం’ రూపకాన్ని నిలిపి, స్పష్టత కోసం ‘కొండ’ను చేర్చాం. అరాబా అనే ప్రాంతనామాన్ని అనువదించకుండా ఉంచి దాని సాధారణ భౌగోళిక అర్థాన్ని పాదసూచికలో తెలిపాం.
