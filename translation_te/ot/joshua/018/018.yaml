id: JOS.18.18
reference: Joshua 18:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָבַ֛ר אֶל כֶּ֥תֶף מוּל הָֽ/עֲרָבָ֖ה צָפ֑וֹנָ/ה וְ/יָרַ֖ד הָ/עֲרָבָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/018.yaml
  text: Then it passed on to the shoulder opposite the Arabah on the north[b][a], and went down to the Arabah.
translation:
  language: te
  text: అప్పుడు సరిహద్దు అరాబాకు ఎదురుగా ఉత్తరాన ఉన్న భుజం[b] వైపుకు సాగి, అరాబా[a]కు దిగిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అరాబా’కు బదులుగా ‘మైదానం’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం ఒక ప్రాంతనామంగానూ సాధారణ భౌగోళిక పదంగానూ వాడబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థం ‘భుజం’; ఇది భౌగోళిక రూపకంగా ఒక ప్రదేశం యొక్క పక్కభాగం, అంచు లేదా వాలును సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָבַר
  choice: అప్పుడు సరిహద్దు ... సాగి
  rationale: సరిహద్దుల వర్ణనలో ఈ క్రియ సరిహద్దు రేఖ ఒక ప్రదేశం నుంచి మరొక ప్రదేశానికి కొనసాగడాన్ని సూచిస్తుంది. తెలుగులో కర్తను స్పష్టంచేయడానికి ‘సరిహద్దు’ను చేర్చి, సహజంగా ‘సాగి’ అని అనువదించాం.
- source_word: אֶל
  choice: వైపుకు
  rationale: తదుపరి భౌగోళిక గుర్తు దిశగా సరిహద్దు సాగడాన్ని సూచించే దిశార్థక ప్రయోగం.
- source_word: כֶּתֶף
  choice: కొండ భుజం
  rationale: మూలపదానికి అక్షరార్థం ‘భుజం’; భౌగోళిక వర్ణనలో కొండ పక్కభాగం, వాలు లేదా అంచును సూచించే రూపకం. ‘కొండ’ను జోడించడం వల్ల తెలుగులో ఈ రూపకం స్పష్టంగా ఉంటుంది.
- source_word: מוּל
  choice: ఎదురుగా ఉన్న
  rationale: రెండు భౌగోళిక స్థానాల మధ్య ఎదురెదురు సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָעֲרָבָה
  choice: అరాబా
  rationale: ఇక్కడ ఈ పదం ప్రాంతనామంగానూ భౌగోళిక పదంగానూ అర్థమయ్యే అవకాశం ఉంది. ప్రధాన పాఠ్యంలో ప్రాంతనామాన్ని ఉంచి, ‘మైదానం’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: צָפֹנָה
  choice: ఉత్తరంగా
  rationale: ఉత్తర దిశలోని స్థాన సంబంధాన్ని సూచిస్తుంది; కేవలం ఉత్తర దిశగా కదలికగా భావించకుండా భౌగోళిక స్థానాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְיָרַד
  choice: దిగిపోయింది
  rationale: ఎత్తైన భూభాగం నుంచి దిగువ ప్రాంతానికి సరిహద్దు రేఖ దిగడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָעֲרָבָתָה
  choice: అరాబాకు
  rationale: దిశను సూచించే చివరి ‘హే’ అరాబా వైపు లేదా అరాబాకు కదలికను తెలియజేస్తుంది; సందర్భంలో ‘అరాబాకు’ సంక్షిప్తంగా, సహజంగా ఉంది.
