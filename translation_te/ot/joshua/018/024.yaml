- source_word: כְפַר העמני
  choice: కెఫర్-హామ్మోనీ
  rationale: ఇది స్థిరమైన స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: הָעָפְנִי
  choice: ఒఫ్నీ
