revisions:
- from: అప్పుడు ఇశ్రాయేలు ప్రజల సమాజమంతా[a] షిలోహులో సమావేశమై, అక్కడ ప్రత్యక్ష గుడారాన్ని నిలిపారు. ఆ దేశం వారి ఎదుట లోబడిపోయింది[b].
  to: అప్పుడు ఇశ్రాయేలు ప్రజల సమాజమంతా[a] షిలోహులో సమావేశమై, అక్కడ సమాగమ గుడారాన్ని స్థాపించారు. ఆ దేశం వారి ఎదుట లోబడిపోయింది[b].
  rationale: అֹהֶל מוֹעֵד యొక్క ‘సమావేశం/కలయిక’ భావాన్ని స్పష్టంగా ప్రతిబింబించేందుకు ‘ప్రత్యక్ష గుడారం’ స్థానంలో ‘సమాగమ గుడారం’ వాడబడింది. మిగతా పాఠ్యం హీబ్రూ వాక్యక్రమం, సామూహిక సూచన, నిష్క్రియ క్రియారూపం, మరియు ‘వారి ఎదుట’ అనే ప్రయోగాన్ని తగిన విధంగా నిలుపుతుంది.
