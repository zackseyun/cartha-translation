source:
  edition: WLC
  text: וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה וַ/יַּשְׁכִּ֥ינוּ שָׁ֖ם אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/הָ/אָ֥רֶץ נִכְבְּשָׁ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు ప్రజల సమాజమంతా[a] షిలోహులో సమావేశమై, అక్కడ సమాగమ గుడారాన్ని స్థాపించారు. ఆ దేశం వారి ఎదుట లోబడిపోయింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: ‘ఇశ్రాయేలు కుమారుల సమాజమంతా.’'
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ దేశం వారి ఎదుట జయించబడింది.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: సమావేశమై
  rationale: నిఫాల్ రూపంలోని קהל ఒక సమాజంగా కూడడాన్ని సూచిస్తుంది. ‘సమావేశమై’ అనే పదం ఆ సామూహిక, క్రమబద్ధమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל עֲדַת
  choice: సమాజమంతా
  rationale: עֵדָה సమకూడిన సముదాయాన్ని సూచిస్తుంది; כָּל భావాన్ని ‘అంతా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఇక్కడ అది మొత్తం నిబంధన సమాజానికి స్థిరమైన సామూహిక నామం; ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా ఆ భావాన్ని అందిస్తుంది. అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: שִׁלֹה
  choice: షిలోహు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం.
- source_word: וַיַּשְׁכִּינוּ
  choice: నిలిపారు
  rationale: שכן హిఫీల్ రూపానికి అక్షరార్థం ‘నివసింపజేశారు’; אֹהֶל מוֹעֵד సందర్భంలో గుడారాన్ని ఒక చోట స్థాపించడమే భావం. ‘నిలిపారు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే పవిత్ర గుడారానికి తెలుగులో స్థిరపడిన, అర్థవంతమైన పదబంధం. సాధారణ సమావేశపు గుడారమని అపార్థం కాకుండా చూస్తుంది.
- source_word: נִכְבְּשָׁה
  choice: లోబడిపోయింది
  rationale: כבשׁ యొక్క నిఫాల్ రూపం దేశం వారి ఆధీనంలోకి వచ్చిన ఫలితస్థితిని సూచిస్తుంది. ‘లోబడిపోయింది’ సంపూర్ణ జయాన్ని అవసరానికి మించి ప్రకటించకుండా ఆ భావాన్ని కాపాడుతుంది.
- source_word: לִפְנֵיהֶם
  choice: వారి ఎదుట
  rationale: హీబ్రూ ప్రయోగాన్ని దగ్గరగా నిలుపుతూ, దేశం వారి ముందు లోబడి ఉందనే సందర్భార్థాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు సమాజానికి సామూహిక సంబోధన
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: בְּנֵי יִשְׂרָאֵל అక్షరార్థంగా పురుష బహువచనమైనప్పటికీ, సందర్భంలో మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే జాతీయ-నిబంధనాత్మక నామం. ప్రధాన పాఠ్యంలో సహజమైన సామూహిక రూపాన్ని, పాదసూచికలో అక్షరార్థాన్ని ఇచ్చాం.
- issue: נִכְבְּשָׁה సూచించే జయ పరిమాణం
  choice: ఆ దేశం వారి ఎదుట లోబడిపోయింది
  alternative: ఆ దేశం వారి ఎదుట జయించబడింది
  rationale: ఈ నిష్క్రియారూపం ఆధీనపరచబడిన స్థితిని చెబుతుంది; యెహోషువ గ్రంథంలోని మిగిలిన ప్రాంతాల ఉద్రిక్తతను చెరపకుండా ‘లోబడిపోయింది’ అని అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ఆరాధనా పఠనానికి తగిన గౌరవభరిత శైలి. హీబ్రూ వాక్యంలోని సంఘటనల క్రమం, నిష్క్రియ భావం, ‘వారి ఎదుట’ అనే ప్రయోగం నిలుపబడ్డాయి.
