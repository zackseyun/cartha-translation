revisions:
- from: ఆ మనుషులు వెళ్లి దేశమంతటా తిరిగారు. వారు దానిని పట్టణాలవారీగా[a] ఏడు భాగాలుగా విభజించి, ఒక పత్రంలో[b] రాశారు. తరువాత వారు షిలోహులోని శిబిరంలో ఉన్న యెహోషువ దగ్గరకు వచ్చారు.
  to: ఆ మనుషులు వెళ్లి దేశంలో సంచరించారు. వారు దేశవివరాలను పట్టణాలవారీగా[a], ఏడు భాగాలుగా ఒక పత్రంలో[b] రాశారు. తరువాత వారు షిలోహులోని శిబిరంలో యెహోషువ దగ్గరకు వచ్చారు.
  rationale: The revision retains the surveyed land as the object of the writing while expressing, in natural Telugu, that its description was recorded city by city in seven portions. It avoids adding a separate explicit division action not directly stated by the Hebrew. Footnote wording has also been regularized so that ‘scroll/book’ is explained as an ancient written document.
