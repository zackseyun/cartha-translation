source:
  edition: WLC
  text: וַ/יֵּלְכ֤וּ הָֽ/אֲנָשִׁים֙ וַ/יַּעַבְר֣וּ בָ/אָ֔רֶץ וַ/יִּכְתְּב֧וּ/הָ לֶֽ/עָרִ֛ים לְ/שִׁבְעָ֥ה חֲלָקִ֖ים עַל סֵ֑פֶר וַ/יָּבֹ֧אוּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה שִׁלֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/009.yaml
  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
translation:
  language: te
  text: ఆ మనుషులు వెళ్లి దేశంలో సంచరించారు. వారు దేశవివరాలను పట్టణాలవారీగా[a], ఏడు భాగాలుగా ఒక పత్రంలో[b] రాశారు. తరువాత వారు షిలోహులోని శిబిరంలో యెహోషువ దగ్గరకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పట్టణాల ప్రకారం’; దేశవివరాలు ఒక్కో పట్టణం ఆధారంగా క్రమబద్ధం చేయబడ్డాయని ఈ పదబంధం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధానికి అక్షరార్థం ‘ఒక గ్రంథం/చుట్టపై’; అంటే ఒక లిఖిత పత్రంలో.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: వెళ్లి
  rationale: הלך క్రియ యొక్క సాధారణ కథనార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మూలంలో లేని దిశ లేదా ‘తిరిగి’ అనే భావాన్ని చేర్చదు.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: ముందుగా నియమించబడిన పురుష ప్రతినిధులనే నిర్దిష్టంగా సూచిస్తుంది; తెలుగు కథనంలో పూర్వప్రస్తావనను ‘ఆ’ స్పష్టంగా కొనసాగిస్తుంది.
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  choice: దేశమంతటా తిరిగారు
  rationale: సర్వే నిమిత్తం ఆ ప్రాంతంలో సంచరించిన భావాన్ని עבר + ב నిర్మాణానికి సహజంగా అందిస్తుంది.
- source_word: וַיִּכְתְּבוּהָ
  choice: దానిని … రాశారు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ‘దేశం’ వైపు తిరిగి సూచిస్తున్నదాన్ని ‘దానిని’తో నిలుపుతుంది.
- source_word: לֶעָרִים
  choice: పట్టణాలవారీగా
  rationale: వ్రాతపూర్వక సర్వే పట్టణాల ప్రకారం క్రమబద్ధం చేయబడిందనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: ఏడు భాగాలుగా విభజించి
  rationale: חֲלָקִים అనే ‘భాగాలు/విభాగాలు’ భావాన్ని సందర్భానుగుణంగా స్పష్టం చేస్తుంది; అవి ఖచ్చితంగా గోత్రాల స్వాస్థ్యాలేనని పదంలో లేని ప్రత్యేకార్థాన్ని చేర్చదు.
- source_word: עַל סֵפֶר
  choice: ఒక పత్రంలో
  rationale: סֵפֶר ఇక్కడ లిఖిత దస్తావేజు లేదా చుట్టను సూచించవచ్చు; ‘పత్రం’ మాధ్యమాన్ని అనవసరంగా నిర్ధారించకుండా వ్రాతపూర్వక నమోదును తెలుపుతుంది.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ
  choice: యెహోషువ దగ్గరకు వచ్చారు
  rationale: క్రియలో నేరుగా ఉన్న ‘వచ్చారు’ అనే అర్థాన్ని కాపాడుతుంది; సందర్భంలో తిరిగి రావడం సూచితమైనా, మూలంలో లేని ‘తిరిగి’ని చేర్చదు.
- source_word: אֶל הַמַּחֲנֶה שִׁלֹה
  choice: షిలోహులోని శిబిరంలో ఉన్న
  rationale: యెహోషువ ఉన్న స్థలాన్ని ఆధునిక తెలుగులో సహజంగా గుర్తిస్తుంది; గమ్యస్థానమైన శిబిరం షిలోహులో ఉందని స్పష్టం చేస్తుంది.
