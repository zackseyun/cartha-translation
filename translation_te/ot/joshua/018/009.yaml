translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని వరుస క్రియలను తెలుగు పఠనసౌలభ్యం కోసం మూడు వాక్యాలుగా అమర్చినా, చర్యల క్రమం యథాతథంగా ఉంచబడింది.
