  register: ఆధునిక ప్రామాణిక తెలుగులో, భూవిభజన వర్ణనకు తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ‘స్వాస్థ్యం,’ ‘సరిహద్దు,’ ‘వంశాలవారీగా’ వంటి పదాలు మూలంలోని న్యాయ-భౌగోళిక భావాన్ని సహజంగా తెలియజేస్తాయి.
