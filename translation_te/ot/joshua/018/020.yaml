  text: וְ/הַ/יַּרְדֵּ֥ן יִגְבֹּל אֹת֖/וֹ לִ/פְאַת קֵ֑דְמָ/ה זֹ֡את נַחֲלַת֩ בְּנֵ֨י בִנְיָמִ֧ן לִ/גְבֽוּלֹתֶ֛י/הָ סָבִ֖יב לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
translation:
  language: te
  text: యొర్దాను నది తూర్పు వైపున దానికి సరిహద్దుగా ఉండేది.[a] ఇది బెన్యామీను సంతతివారికి[b] వారి వంశాలవారీగా, దాని అన్ని వైపుల సరిహద్దుల ప్రకారం లభించిన స్వాస్థ్యం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానికి హద్దుగా ఏర్పడింది’ లేదా ‘దానికి సరిహద్దుగా ఉంది.’ హీబ్రూ క్రియ యొర్దాను నది ఆ భూభాగానికి సరిహద్దుగా ఉన్నదని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘బెన్యామీను కుమారులు’; ఇది బెన్యామీను సంతతిని సూచించే గోత్రనామ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיַּרְדֵּן
  choice: యొర్దాను నది
  rationale: ఇది నది పేరే అయినప్పటికీ, ఆధునిక తెలుగు పాఠకులకు భౌగోళిక సూచన స్పష్టంగా ఉండేందుకు ‘నది’ అని సహజంగా విస్తరించబడింది.
- source_word: יִגְבֹּל אֹתוֹ
  choice: దానికి సరిహద్దుగా ఉండేది
  rationale: గבל అనే క్రియ ఇక్కడ యొర్దాను నది ఆ భూభాగానికి సరిహద్దుగా పనిచేసిందని సూచిస్తుంది; తెలుగు భౌగోళిక వర్ణనలో ఇది సహజమైన వ్యక్తీకరణ.
- source_word: לִפְאַת קֵדְמָה
  choice: తూర్పు వైపున
  rationale: פאה అంటే వైపు లేదా అంచు; קֵדְמָה ఇక్కడ తూర్పు దిశను సూచిస్తుంది.
- source_word: נַחֲלַת
  choice: స్వాస్థ్యం
  rationale: యెహోషువ గ్రంథంలోని గోత్ర భూవిభజన సందర్భంలో נחלה వారసత్వంగా కేటాయించబడిన భూభాగాన్ని సూచిస్తుంది; ‘స్వాస్థ్యం’ ఆ న్యాయపరమైన, ఒడంబడిక సంబంధమైన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּנֵי בִנְיָמִן
  choice: బెన్యామీను సంతతివారు
  rationale: అక్షరార్థంగా ‘బెన్యామీను కుమారులు’; ఇక్కడ అది బెన్యామీను గోత్రానికి చెందిన వారందరినీ సూచించే గోత్రనామ ప్రయోగం కాబట్టి ‘సంతతివారు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לִגְבוּלֹתֶיהָ סָבִיב
  choice: చుట్టూ ఉన్న దాని సరిహద్దుల ప్రకారం
  rationale: స్త్రీలింగ ప్రత్యయం స్వాస్థ్యాన్ని లేదా భూభాగాన్ని తిరిగి సూచిస్తుంది; సָבִיב ఆ భూభాగం చుట్టూ ఉన్న మొత్తం పరిధిని తెలియజేస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాలవారీగా
  rationale: מִשְׁפָּחוֹת గోత్రంలోని వంశ లేదా కులస్థాయి కుటుంబ సమూహాలను సూచిస్తుంది; భూవిభజన సందర్భంలో ‘వంశాలవారీగా’ సహజమైన తెలుగు.
