revisions:
- from: వారు ఇశ్రాయేలు ఎదుటి నుంచి పారిపోతూ, బేత్-హోరోను దిగువ దారిలో ఉన్నప్పుడు, యాహ్వే ఆకాశం నుంచి పెద్ద రాళ్లను అజేకా వరకు వారిమీద కురిపించాడు; వారు చనిపోయారు. ఇశ్రాయేలు ప్రజలు కత్తితో చంపినవారికంటే వడగండ్ల రాళ్లవల్ల చనిపోయినవారే ఎక్కువ.
  to: వారు ఇశ్రాయేలు ఎదుటనుండి పారిపోతుండగా, బేత్-హోరోను దిగువ దారిలో ఉన్నప్పుడు, యాహ్వే ఆకాశం నుంచి అజేకా వరకు వారిమీద పెద్ద రాళ్లను కురిపించాడు; వారిలో అనేకులు చనిపోయారు. ఇశ్రాయేలీయులు కత్తితో చంపినవారికంటే వడగండ్లవల్ల చనిపోయినవారే ఎక్కువ.
  rationale: 'The revision restores the explicit Hebrew quantifier רַבִּים (“many”) in the first death statement. It also makes minor idiomatic adjustments while retaining the source sequence: large stones are first mentioned, then identified as hailstones in the comparative statement. No footnote is required in Telugu for this verse.'
