source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/נֻסָ֣/ם מִ/פְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּ/מוֹרַ֤ד בֵּית חוֹרֹן֙ וַֽ/יהוָ֡ה הִשְׁלִ֣יךְ עֲלֵי/הֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן הַ/שָּׁמַ֛יִם עַד עֲזֵקָ֖ה וַ/יָּמֻ֑תוּ רַבִּ֗ים אֲשֶׁר מֵ֨תוּ֙ בְּ/אַבְנֵ֣י הַ/בָּרָ֔ד מֵ/אֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל בֶּ/חָֽרֶב׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
translation:
  language: te
  text: వారు ఇశ్రాయేలు ఎదుటనుండి పారిపోతుండగా, బేత్-హోరోను దిగువ దారిలో ఉన్నప్పుడు, యాహ్వే ఆకాశం నుంచి అజేకా వరకు వారిమీద పెద్ద రాళ్లను కురిపించాడు; వారిలో అనేకులు చనిపోయారు. ఇశ్రాయేలీయులు కత్తితో చంపినవారికంటే వడగండ్లవల్ల చనిపోయినవారే ఎక్కువ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֻסָם מִפְּנֵי יִשְׂרָאֵל
  choice: వారు ఇశ్రాయేలు ఎదుటి నుంచి పారిపోతూ
  rationale: ב + infinitive construct సమకాలీన చర్యను సూచిస్తుంది; מִפְּנֵי ఇక్కడ శత్రువు ఎదుటి నుంచి వెనుదిరిగి పారిపోవడాన్ని వ్యక్తం చేస్తుంది.
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  choice: బేత్-హోరోను దిగువ దారిలో
  rationale: מוֹרָד దిగే వాలు లేదా దిగువకు వెళ్లే మార్గాన్ని సూచిస్తుంది; సందర్భంలోని భౌగోళిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיהוָה
  choice: యాహ్వే
  rationale: మూలపాఠంలోని దేవుని వ్యక్తిగత నామమైన יהוהను ప్రత్యక్షంగా లిప్యంతరీకరించింది.
- source_word: הִשְׁלִיךְ עֲלֵיהֶם
  choice: వారిమీద కురిపించాడు
  rationale: השליך యొక్క విసరడం అనే భావాన్ని, ఆకాశం నుంచి అనేక రాళ్లు పడే ఈ సందర్భంలో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: పెద్ద రాళ్లను
  rationale: మొదట వాటిని సాధారణంగా పెద్ద రాళ్లుగా పేర్కొని, తరువాత వడగండ్ల రాళ్లుగా గుర్తించే హెబ్రీ వర్ణనా క్రమాన్ని కాపాడుతుంది.
- source_word: מִן הַשָּׁמַיִם
  choice: ఆకాశం నుంచి
  rationale: ఈ సందర్భంలో పై నుంచి వచ్చిన భౌతిక మూలాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עַד עֲזֵקָה
  choice: అజేకా వరకు
  rationale: తుఫాను ప్రభావం లేదా దాడి చేరిన ప్రాదేశిక హద్దును సూచించే עַד భావాన్ని నిలుపుతుంది.
- source_word: בְּאַבְנֵי הַבָּרָד
  choice: వడగండ్ల రాళ్లవల్ల
  rationale: ముందు చెప్పిన పెద్ద రాళ్లను వడగండ్లుగా గుర్తిస్తూ, אבן అనే 'రాయి' పదంతో ఉన్న సంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: సందర్భంలో ఇది జాతి సమూహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో 'ఇశ్రాయేలు ప్రజలు' సహజంగా, సమగ్రంగా అర్థమవుతుంది.
- source_word: בֶּחָרֶב
  choice: కత్తితో
  rationale: సాధనార్థక ב ను సహజమైన తెలుగు సాధన విభక్తితో అనువదిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దాన్ని బిరుదుతో భర్తీ చేయకుండా నిలుపబడింది.
- issue: ఆకాశం నుంచి వచ్చిన వస్తువుల స్వభావం
  choice: మొదట 'పెద్ద రాళ్లు', తరువాత 'వడగండ్ల రాళ్లు'
  alternative: మొదటి ప్రస్తావనలోనే 'పెద్ద వడగండ్లు'
  rationale: హెబ్రీ పాఠం మొదట సాధారణ వర్ణన చేసి, తరువాత అవి వడగండ్లని గుర్తిస్తుంది; ఆ వర్ణనా పురోగతిని నిలుపబడింది.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క అనువాదం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇక్కడ పదబంధం యుద్ధంలో ఉన్న ఇశ్రాయేలు జాతి సమూహాన్ని సూచిస్తుంది; అక్షరార్థ రూపం తెలుగులో సహజంగా అదే అర్థాన్ని ఇవ్వదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, స్పష్టమైన శైలి. స్థలనామాలు బేత్-హోరోను, అజేకా అని లిప్యంతరీకరించబడ్డాయి. మూలంలోని పోలికను చివరి వాక్యంలో సహజమైన తెలుగు క్రమంలో నిలుపబడింది.
