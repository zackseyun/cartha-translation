source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה גַּם אוֹתָ֜/הּ בְּ/יַ֣ד יִשְׂרָאֵ֘ל וְ/אֶת מַלְכָּ/הּ֒ וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֗רֶב וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹֽא הִשְׁאִ֥יר בָּ֖/הּ שָׂרִ֑יד וַ/יַּ֣עַשׂ לְ/מַלְכָּ֔/הּ כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
translation:
  language: te
  text: యెహోవా ఆ పట్టణాన్నీ దాని రాజునీ కూడా ఇశ్రాయేలు చేతికి అప్పగించాడు. యెహోషువ కత్తి ధారతో దానినీ, అందులో ఉన్న ప్రతి వ్యక్తినీ[a] చంపాడు. అందులో ఒక్క బతికినవాణ్ణీ మిగల్చలేదు. అతడు యెరికో రాజుకు చేసినట్లే దాని రాజుకూ చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అందులో ఉన్న ప్రతి నెఫెష్‌”; ఇక్కడ ఈ మాట పట్టణంలో ఉన్న ప్రతి వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామంలోని నాలుగు హల్లుల పేరును బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో ఉంచుతుంది.
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: ఇశ్రాయేలు చేతికి అప్పగించాడు
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ అధికార-అప్పగింత నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גַּם
  choice: కూడా
  rationale: మునుపటి జయవృత్తాంతానికి కొనసాగింపును సూచిస్తుంది.
- source_word: אוֹתָהּ ... וְאֶת מַלְכָּהּ
  choice: ఆ పట్టణాన్ని, దాని రాజును
  rationale: స్త్రీలింగ సర్వనామం సందర్భంలోని లిబ్నా పట్టణాన్ని సూచిస్తుంది; తెలుగులో సూచ్యార్థాన్ని స్పష్టంగా చేయడానికి ‘పట్టణం’ అని పేర్కొనడం సహజం.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: దాన్ని కత్తివాత హతమార్చి
  rationale: נכה యొక్క సంహారార్థాన్ని మరియు ‘కత్తి నోరు/అంచు’ అనే నుడికారాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: అందులో ఉన్న ప్రతి ప్రాణిని
  rationale: נפש ఇక్కడ నగరంలోని జీవించే వ్యక్తులను సూచిస్తుంది; ‘ప్రాణి’ మూలపదపు జీవార్థాన్ని నిలుపుతుంది, కానీ అమూర్త ఆత్మ గురించిన సిద్ధాంతాన్ని బలవంతంగా చొప్పించదు.
- source_word: לֹא הִשְׁאִיר ... שָׂרִיד
  choice: ప్రాణాలతో మిగిలినవారెవరినీ ఉంచలేదు
  rationale: שָׂרִיד అనే ‘బతికి మిగిలినవాడు’ భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: యెరికో రాజుకు చేసినట్లే దాని రాజుకూ చేశాడు
  rationale: మూలంలోని עשה పదపునరుక్తిని సహజమైన తెలుగు పోలిక నిర్మాణంలో కాపాడుతుంది.
theological_decisions:
- issue: యుద్ధ సందర్భంలో נֶפֶשׁ అనువాదం
  choice: ప్రతి ప్రాణిని
  alternative: ప్రతి వ్యక్తిని; ప్రతి ఆత్మను
  rationale: ఈ సందర్భంలో పదం పట్టణంలో ఉన్న జీవించే మనుషులను సూచిస్తుంది. ‘ఆత్మ’ అని అనువదిస్తే తరువాతి కాలపు మానవస్వరూప సిద్ధాంతార్థం అనవసరంగా రావచ్చు; ‘ప్రాణి’ మూలంలోని జీవార్థాన్ని ఉంచుతుంది. పాదసూచిక దాని సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కథన శైలి. హీబ్రూ నుడికారాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో అసహజమైన సర్వనామ సూచనలను స్పష్టీకరించాం. హింసాత్మక విషయాన్ని మృదువుపరచకుండా, మూలవచన ప్రకటనను నేరుగా అందించాం.
