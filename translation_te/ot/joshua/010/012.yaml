source:
  edition: WLC
  text: אָ֣ז יְדַבֵּ֤ר יְהוֹשֻׁעַ֙ לַֽ/יהוָ֔ה בְּ/י֗וֹם תֵּ֤ת יְהוָה֙ אֶת הָ֣/אֱמֹרִ֔י לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֣אמֶר לְ/עֵינֵ֣י יִשְׂרָאֵ֗ל שֶׁ֚מֶשׁ בְּ/גִבְע֣וֹן דּ֔וֹם וְ/יָרֵ֖חַ בְּ/עֵ֥מֶק אַיָּלֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/012.yaml
  text: Then Joshua spoke to Yahweh on the day when Yahweh gave the Amorites over before the sons of Israel[a], and he said in the sight of Israel, “Sun, stand still at Gibeon, and moon[c][b], in the Valley of Aijalon.”
translation:
  language: te
  text: 'యాహ్వే ఇశ్రాయేలు కుమారుల ఎదుట అమోరీయులను అప్పగించిన రోజున, యెహోషువ యాహ్వేతో మాట్లాడాడు. ఇశ్రాయేలు సమక్షంలో అతడు ఇలా అన్నాడు: “సూర్యుడా, గిబ్యోను వద్ద నిలిచిపో; చంద్రుడా, అయ్యాలోను లోయలో నిలిచిపో.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో చంద్రునికి సంబంధించిన రెండో భాగంలో ‘నిలిచిపో’ అనే క్రియ లేదు; ముందటి ఆజ్ఞ నుంచే ఆ క్రియను అర్థం చేసుకోవాలి. דּוֹם అనే హీబ్రూ క్రియకు ‘నిశ్చలంగా ఉండు,’ ‘ఆగిపో,’ లేదా కొన్ని సందర్భాల్లో ‘మౌనంగా ఉండు’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבֵּר
  choice: మాట్లాడాడు
  rationale: דבר పియేల్ రూపానికి సాధారణ అర్థమైన ‘మాట్లాడు’ను ఇస్తూ, తరువాతి וַיֹּאמֶר (‘అన్నాడు’)తో ఉన్న క్రియా భేదాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాతో
  rationale: ל ఉపసర్గ సంభాషణ గ్రహీతను సూచిస్తుంది; సహజమైన తెలుగులో ‘యెహోవాతో మాట్లాడాడు’ అని చెప్పడం సముచితం.
- source_word: בְּיוֹם תֵּת יְהוָה
  choice: యెహోవా ... అప్పగించిన రోజున
  rationale: בְּיוֹם తో కూడిన infinitive construct కాలసంబంధాన్ని సూచిస్తుంది; ఈ రూపం మూలంలోని ప్రత్యేక కాలనిర్దేశాన్ని సహజంగా నిలుపుతుంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులను
  rationale: రూపపరంగా ఏకవచనమైనా, యుద్ధ సందర్భంలో ఇది జనసమూహాన్ని సమష్టిగా సూచిస్తుంది; తెలుగు బహువచనం స్పష్టంగా ఉంటుంది.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల ఎదుట
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే హీబ్రూ కుటుంబసంబంధ వ్యక్తీకరణను, అలాగే לִפְנֵי యొక్క ‘ఎదుట’ భావాన్ని నిలుపుతుంది.
- source_word: וַיֹּאמֶר לְעֵינֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కళ్ల ఎదుట అతడు ఇలా అన్నాడు
  rationale: לְעֵינֵי యొక్క అక్షరార్థ దృశ్యరూపాన్ని కాపాడుతూ, మాటలు బహిరంగంగా పలికినట్లు స్పష్టం చేస్తుంది.
- source_word: שֶׁמֶשׁ ... דּוֹם
  choice: సూర్యుడా ... నిలిచిపో
  rationale: דום నిశ్చలతను లేదా ఆగిపోవడాన్ని సూచించగలదు; ఈ విశ్వసంబంధ ఆజ్ఞలో ‘నిలిచిపో’ కథా సందర్భానికి సరిపోతూ అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: בְּגִבְעוֹן
  choice: గిబియోనులో
  rationale: ב ఉపసర్గను సూటిగా ‘లో’ అని అనువదించింది; స్థలసంబంధ ఖచ్చిత భావంపై మూలంలో ఉన్న విస్తృతిని అనవసరంగా ‘పైన’గా నిర్ధారించదు.
- source_word: וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן
  choice: చంద్రుడా, అయ్యాలోను లోయలో నిలిచిపో
  rationale: హీబ్రూలో రెండో భాగంలో క్రియ ప్రత్యక్షంగా లేదు; ముందటి דּוֹם క్రియను సమాంతరంగా అర్థం చేసుకొని, తెలుగులో సహజత కోసం పునరుక్తం చేసింది.
- source_word: אַיָּלוֹן
  choice: అయ్యాలోను
  rationale: హీబ్రూ స్థలనామ ధ్వనికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది; ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది.
- issue: సూర్యచంద్రుల ఆజ్ఞ యొక్క భావం
  choice: నిలిచిపో
  alternative: నిశ్శబ్దంగా ఉండు / ఆగిపో
  rationale: דום లోని నిశ్చలత లేదా విరమణ భావాన్ని కాపాడుతుంది; ఖగోళ ప్రక్రియను ఈ వచనం చెప్పినదానికంటే ఎక్కువగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. కవితాత్మక ప్రత్యక్ష సంబోధనను నిలిపి, రెండో సమాంతర పాదంలో తెలుగుకు అవసరమైన క్రియను స్పష్టంగా చేర్చింది.
