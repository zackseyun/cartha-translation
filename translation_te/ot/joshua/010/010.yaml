revisions:
- from: యహ్వే ఇశ్రాయేలు ఎదుట వారిని కలవరానికి గురిచేశాడు[a]. గిబియోను దగ్గర వారిని ఘోరంగా హతమార్చాడు; బేత్-హోరోను ఎక్కే మార్గంలో వారిని తరిమి, అజేకా వరకూ, మక్కేదా వరకూ వారిని హతమార్చాడు.
