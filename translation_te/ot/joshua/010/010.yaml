id: JOS.10.10
reference: Joshua 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהֻמֵּ֤/ם יְהוָה֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכֵּ֥/ם מַכָּֽה גְדוֹלָ֖ה בְּ/גִבְע֑וֹן וַֽ/יִּרְדְּפֵ֗/ם דֶּ֚רֶךְ מַעֲלֵ֣ה בֵית חוֹרֹ֔ן וַ/יַּכֵּ֥/ם עַד עֲזֵקָ֖ה וְ/עַד מַקֵּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
translation:
  language: te
  text: యహ్వే ఇశ్రాయేలు ఎదుట వారిని కలవరానికి గురిచేశాడు[a], గిబియోనులో వారిపై ఘోరమైన సంహారం చేశాడు, బేత్-హోరోను ఎక్కే దారిలో వారిని వెంబడించాడు, అజేకా వరకూ, మక్కేదా వరకూ వారిని హతమార్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిని భయాందోళనకు గురిచేశాడు.’ హెబ్రీ క్రియ యుద్ధంలో గందరగోళం లేదా భయాందోళన కలిగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהֻמֵּם
  choice: వారిని కలవరానికి గురిచేశాడు
  rationale: హెబ్రీ క్రియ యుద్ధంలో భయాందోళన లేదా గందరగోళం కలిగించడాన్ని సూచిస్తుంది. ఈ అనువాదం దైవిక కారణత్వాన్ని నిలుపుతూ, కేవలం ఫలితమైన ‘ఓడించాడు’ అనే అర్థానికి పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో ‘Yahweh’కు సమీపమైన రూపంగా లిప్యంతరీకరించబడింది.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఎదుట
  rationale: ‘ఇశ్రాయేలు ముందు/ఎదుట’ అనే హెబ్రీ భావాన్ని నిలుపుతుంది; ఇది స్థలపరమైన భావాన్నీ, వారి సమక్షంలో లేదా వారి పక్షంగా జరిగినదనే సందర్భార్థాన్నీ ముందుగానే తేల్చదు.
- source_word: וַיַּכֵּם מַכָּה גְדוֹלָה
  choice: వారిని ఘోరంగా హతమార్చాడు
  rationale: యుద్ధ సందర్భంలో נכה మరియు מַכָּה కలయిక తీవ్రమైన ప్రాణాంతక సంహారాన్ని సూచిస్తుంది. సహజమైన తెలుగులో ఆ సైనిక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בְּגִבְעוֹן
  choice: గిబియోను దగ్గర
  rationale: యుద్ధం జరిగిన ప్రదేశాన్ని సహజమైన తెలుగులో సూచిస్తుంది; ‘లోపల’ అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַיִּרְדְּפֵם
  choice: వారిని తరిమి
  rationale: శత్రువులను వెంబడించడం అనే רדף యొక్క సాధారణ సైనిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  choice: బేత్-హోరోను ఎక్కే మార్గంలో
  rationale: బేత్-హోరోను వైపు ఎక్కే దారి అనే భౌగోళిక వివరాన్ని సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
- source_word: עַד עֲזֵקָה וְעַד מַקֵּדָה
  choice: అజేకా వరకూ, మక్కేదా వరకూ
  rationale: హెబ్రీలో రెండుసార్లు వచ్చిన עַדను ప్రతిబింబిస్తూ, చర్య విస్తరించిన రెండు భౌగోళిక హద్దులను నిలుపుతుంది.
theological_decisions:
- issue: YHWH అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా వ్యక్తిగత దైవనామం ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా లిప్యంతరీకరించాం.
- issue: వరుస క్రియల కర్త
  choice: యహ్వేనే కలవరపరచి, హతమార్చి, తరిమిన కర్తగా కొనసాగించడం
  alternative: తరిమినది ఇశ్రాయేలు లేదా యెహోషువ అని స్పష్టీకరించడం
  rationale: హెబ్రీ వాక్యంలో తరువాతి ఏకవచన క్రియలకు కొత్త కర్తను ప్రత్యక్షంగా పేర్కొనలేదు. కాబట్టి వాక్యనిర్మాణంలోని ఉద్వేగాన్ని పరిష్కరించకుండా, ముందున్న యహ్వేనే కర్తగా కొనసాగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి వాడబడింది. ప్రదేశనామాలు తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి. హెబ్రీ వాక్యంలోని పునరుక్తిని, భౌగోళిక విస్తారాన్ని సాధ్యమైనంతవరకు నిలుపుతూ అసహజమైన పదక్షర నిర్మాణాన్ని నివారించాం.
