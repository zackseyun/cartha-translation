base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
translation:
  language: te
  text: వారు దానిని, దాని రాజును, దాని పట్టణాలన్నిటినీ స్వాధీనం చేసుకున్నారు; వారిని కత్తి ధారతో హతమార్చి, దానిలో ఉన్న ప్రతి వ్యక్తినీ నిర్మూలనకు అప్పగించారు[a]. అతడు ప్రాణాలతో ఎవరినీ మిగల్చలేదు. హెబ్రోనుకు చేసినట్లే దెబీరుకు, దాని రాజుకు చేశాడు; లిబ్నాకు, దాని రాజుకు చేసినట్లే చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని పూర్తిగా నాశనం చేశారు.” ఇక్కడి హెబ్రీ పదం హేరెమ్ (חרם) పదజాలానికి చెందినది; అది ఏదైనా పూర్తిగా నాశనం చేయబడటానికి ప్రత్యేకంగా అప్పగించబడినదని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: వారు దానిని స్వాధీనం చేసుకున్నారు
  rationale: לכד యుద్ధ సందర్భంలో పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అని అర్థం. హెబ్రీ రూపం ఏకవచనమైనా, సమీపంలోని బహువచన క్రియలతో కలిసి యెహోషువ నాయకత్వంలోని సమూహ చర్యను సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో బహువచనం సహజంగా ఉంది.
- source_word: וְאֶת מַלְכָּהּ וְאֶת כָּל עָרֶיהָ
  choice: దాని రాజును, దాని పట్టణాలన్నిటిని
  rationale: స్త్రీలింగ ప్రత్యయాలు దెబీరు పట్టణాన్ని సూచిస్తున్నాయి. עיר ఇక్కడ ప్రధాన నగరానికి అనుబంధమైన పట్టణాలను సూచించగలదు.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: వారిని కత్తివాతతో హతమార్చి
  rationale: లక్ష్యభాషలో సహజంగా ఉండే విధంగా, ‘కత్తి అంచు/నోరు’ అనే హెబ్రీ యుద్ధ నుడికారాన్ని ‘కత్తివాతతో’ అని ప్రతిబింబిస్తుంది.
- source_word: וַיַּחֲרִימוּ
  choice: నిర్మూలనకు అంకితం చేశారు
  rationale: חרם సాధారణంగా నాశనం చేయడంకన్నా, నిర్మూలించబడేందుకు ప్రత్యేకంగా అప్పగించే సాంకేతిక భావాన్ని కలిగి ఉంది; ఈ మతపరమైన-న్యాయపరమైన ఛాయను అనువాదం నిలుపుతుంది.
- source_word: אֶת כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  choice: దానిలో ఉన్న ప్రతి ప్రాణిని
  rationale: נפש ఇక్కడ అమూర్తమైన ఆత్మను కాదు, జీవించి ఉన్న వ్యక్తిని సూచిస్తుంది. ‘ప్రతి ప్రాణిని’ మూలంలోని సమగ్ర వ్యక్తి-సూచనను నిలుపుతుంది.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: అతడు ప్రాణాలతో ఎవరినీ మిగల్చలేదు
  rationale: הִשְׁאִיר ఏకవచనాన్ని యెహోషువను ప్రతినిధి నాయకుడిగా సూచించేలా నిలిపి, שָׂרִיד యొక్క ‘బతికి మిగిలినవాడు’ అనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן עָשָׂה לִדְבִרָהּ
  choice: హెబ్రోనుకు చేసినట్లే దెబీరుకు ... చేశాడు
  rationale: పోలిక సూత్రాన్ని, అలాగే మూలంలోని ఏకవచన కథన కర్తను నిలుపుతుంది.
- source_word: וְכַאֲשֶׁר עָשָׂה לְלִבְנָה וּלְמַלְכָּהּ
  choice: లిబ్నాకు, దాని రాజుకు చేసినట్లే చేశాడు
  rationale: దెబీరుకు జరిగినదాన్ని లిబ్నా మరియు దాని రాజుకు జరిగినదానితో కలిపే తుదిపోలికను సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: חרם యుద్ధపదజాలం
  choice: నిర్మూలనకు అంకితం చేశారు
  alternative: పూర్తిగా నాశనం చేశారు
  rationale: సాధారణ విధ్వంసాన్ని మాత్రమే సూచించకుండా, חרם లోని ప్రత్యేకంగా నిర్మూలనకు అప్పగించే భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. పాదటిప్పణి ప్రత్యామ్నాయ సహజ అనువాదాన్ని వివరిస్తుంది.
- issue: బహువచన-ఏకవచన కథన కర్త మార్పు
  choice: సమూహ చర్యలకు బహువచనం; ‘అతడు ... మిగల్చలేదు’ మరియు పోలిక వాక్యాలకు ఏకవచనం
  alternative: అన్ని క్రియలనూ బహువచనంగా సవరించడం
  rationale: హెబ్రీలోని ఇశ్రాయేలు సమూహం/యెహోషువ నాయకుడు అనే ఉద్వేగభరిత మార్పును సున్నితంగా తొలగించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి. ‘స్వాధీనం చేసుకున్నారు,’ ‘కత్తివాత,’ ‘నిర్మూలనకు అంకితం చేశారు’ అనే పదబంధాలు వరుసగా సైనిక స్వాధీనం, హెబ్రీ కత్తి నుడికారం, חרם యొక్క సాంకేతిక ఛాయలను సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంచుతాయి. మూలంలోని బహువచన-ఏకవచన మార్పు ఉద్దేశపూర్వకంగా నిలుపబడింది.
