translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైన కథన శైలి. మూలంలోని చర్యల క్రమం, సమూహ సూచన, దిశ, యుద్ధ భావం నిలుపుతూ సహజ తెలుగు వాక్యనిర్మాణం ఉపయోగించబడింది.
