  yaml_path: translation/ot/joshua/010/038.yaml
  text: Then Joshua[a], and all Israel with him, returned to Debir and fought against it.
translation:
  language: te
  text: తరువాత యెహోషువ, అతనితో ఉన్న ఇశ్రాయేలీయులందరూ తిరిగి దెబీరుకు వెళ్లి, దానితో యుద్ధం చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చి
  rationale: שׁוב అనే క్రియ ఇక్కడ కథన క్రమంలో మళ్లీ ఆ ప్రదేశానికి వెళ్లడాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘తిరిగి వచ్చి’ సహజంగా ఉండి దిశాభావాన్ని నిలుపుతుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: అతనితో ఉన్న ఇశ్రాయేలీయులందరూ
  rationale: మూలంలోని సమష్టివాచకమైన ‘ఇశ్రాయేలు అంతా’ యెహోషువ వెంట ఉన్న ఇశ్రాయేలు యోధసమూహాన్ని సూచిస్తుంది. తెలుగులో వ్యక్తులను స్పష్టంగా సూచించేందుకు ‘ఇశ్రాయేలీయులందరూ’ సహజమైన రూపం; עִמּוֹ భావాన్ని ‘అతనితో ఉన్న’ అని ప్రత్యక్షంగా నిలిపాం.
- source_word: דְּבִרָה
  choice: దెబీరు పట్టణానికి
  rationale: స్థలనామానికి జోడించిన దిశాసూచక ה ఆ నగరం వైపు కదలికను సూచిస్తుంది. ‘పట్టణానికి’ అని చెప్పడం తెలుగులో సూచిత స్థల స్వభావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: וַיִּלָּחֶם
  choice: యుద్ధం చేశారు
  rationale: לחם క్రియ ఇక్కడ యుద్ధంలో తలపడడాన్ని సూచిస్తుంది. ‘యుద్ధం చేశారు’ ఆధునిక తెలుగులో నేరుగా, గౌరవప్రదంగా ఉంది.
- source_word: עָלֶיהָ
  choice: దాని మీద
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం దెబీరు నగరాన్ని సూచిస్తుంది. హీబ్రూలోని వ్యాకరణ లింగాన్ని తెలుగులో కృత్రిమంగా వ్యక్తీకరించకుండా, నగరానికి సహజమైన ‘దాని’ రూపాన్ని వాడాం.
