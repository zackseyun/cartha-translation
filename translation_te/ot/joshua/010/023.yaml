id: JOS.10.23
reference: Joshua 10:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עֲשׂוּ כֵ֔ן וַ/יֹּצִ֣יאוּ אֵלָ֗י/ו אֶת חֲמֵ֛שֶׁת הַ/מְּלָכִ֥ים הָ/אֵ֖לֶּה מִן הַ/מְּעָרָ֑ה אֵ֣ת מֶ֣לֶךְ יְרוּשָׁלִַ֗ם אֶת מֶ֤לֶךְ חֶבְרוֹן֙ אֶת מֶ֣לֶךְ יַרְמ֔וּת אֶת מֶ֥לֶךְ לָכִ֖ישׁ אֶת מֶ֥לֶךְ עֶגְלֽוֹן־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/023.yaml
  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: te
  text: 'వారు అలాగే చేసి, ఆ గుహలోనుంచి ఆ ఐదుగురు రాజులను అతని దగ్గరకు తీసుకొచ్చారు: యెరూషలేము రాజు, హెబ్రోను రాజు, యర్మూతు రాజు, లాకీషు రాజు, ఎగ్లోను రాజు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: వారు అలాగే చేసి
  rationale: ముందటి ఆజ్ఞను వారు పాటించారని తెలిపే సహజమైన కథన ప్రయోగం; హీబ్రూ భావాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיֹּצִיאוּ
  choice: తీసుకొచ్చారు
  rationale: హిఫీల్ రూపంలోని ‘బయటకు వచ్చేలా చేయు/బయటకు తీసుకురా’ అనే భావాన్ని, గుహలోనుంచి రాజులను తీసుకొచ్చిన సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵלָיו
  choice: అతని దగ్గరకు
  rationale: హీబ్రూ אל + ప్రత్యయం యొక్క ప్రత్యక్ష దిశార్థాన్ని నిలుపుతుంది; సందర్భంలో సూచితుడైన యెహోషువ పేరును మూలంలో లేనందున చేర్చలేదు.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ఆ ఐదుగురు రాజులను
  rationale: నిర్దిష్టంగా ముందే ప్రస్తావించబడిన ఐదుగురు వ్యక్తులను సూచించే సహజ తెలుగు రూపం; వ్యక్తులకు తగిన ‘ఐదుగురు’ వాడబడింది.
- source_word: מִן הַמְּעָרָה
  choice: ఆ గుహలోనుంచి
  rationale: నిర్దిష్ట గుహ లోపలినుంచి బయటకు తీసుకురావడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: హీబ్రూ పదానికి నిర్దిష్టమైన సాధారణ సమానార్థకం; విస్తృతార్థకమైన ‘పాలకుడు’ కంటే ఖచ్చితం.
- source_word: יְרוּשָׁלִַם
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
- source_word: חֶבְרוֹן
  choice: హెబ్రోను
  rationale: తెలుగులో గుర్తించదగిన, మూల ఉచ్చారణకు సమీపమైన స్థలనామ రూపం.
- source_word: יַרְמוּת
  choice: యర్మూతు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించిన రూపం.
- source_word: לָכִישׁ
  choice: లాకీషు
  rationale: హీబ్రూ స్థలనామ ఉచ్చారణను ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: עֶגְלוֹן
  choice: ఎగ్లోను
  rationale: ఇక్కడ పట్టణాన్ని సూచించే హీబ్రూ పేరుకు తెలుగు లిప్యంతరీకరణ; న్యాయాధిపతుల గ్రంథంలోని వ్యక్తితో గందరగోళం రాకుండా సందర్భమే భావాన్ని నిర్ధారిస్తుంది.
