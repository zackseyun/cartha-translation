translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి పాటించబడింది. మూలంలోని వరుస జాబితా, ‘అతని దగ్గరకు’ అనే అస్పష్ట పురుష సర్వనామ సూచన యథాతథంగా నిలుపబడ్డాయి; వివరణార్థంగా యెహోషువ పేరును చేర్చలేదు.
