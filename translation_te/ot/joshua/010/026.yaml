source:
  edition: WLC
  text: וַ/יַּכֵּ֨/ם יְהוֹשֻׁ֤עַ אַֽחֲרֵי כֵן֙ וַ/יְמִיתֵ֔/ם וַ/יִּתְלֵ֕/ם עַ֖ל חֲמִשָּׁ֣ה עֵצִ֑ים וַ/יִּֽהְי֛וּ תְּלוּיִ֥ם עַל הָ/עֵצִ֖ים עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
translation:
  language: te
  text: ఆ తరువాత యెహోషువ వారిని కొట్టి చంపి, ఐదు చెట్లపై వారిని వేలాడదీశాడు.[a] వారు సాయంకాలం వరకు ఆ చెట్లపై వేలాడుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని ఉరితీశాడు.” హీబ్రూ క్రియ శరీరాలను చెట్టు లేదా కలపపై వేలాడదీయడాన్ని సూచిస్తుంది; “వారిని గుచ్చాడు” అనే అర్థం సాధ్యమే అయినా, ఇక్కడ అంత నిశ్చితం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: వారిని కొట్టి
  rationale: נכה హిఫీల్ రూపం బలంగా కొట్టడాన్ని సూచిస్తుంది. తరువాత వచ్చే וַיְמִיתֵם అనే ‘చంపి’ క్రియతో దీనిని కలిపివేయకుండా వేరుగా నిలుపుతుంది.
- source_word: אַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: సంఘటనల క్రమాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וַיְמִיתֵם
  choice: చంపి
  rationale: מות హిఫీల్ రూపం వారిని మరణింపజేయడాన్ని స్పష్టంగా తెలియజేస్తుంది; తెలుగులో ‘చంపి’ సహజంగా, నేరుగా ఉంటుంది.
- source_word: וַיִּתְלֵם
  choice: వేలాడదీశాడు
  rationale: תלה ఇక్కడ శరీరాలను చెట్లపై వేలాడదీసి ప్రదర్శించడాన్ని సూచిస్తుంది. ‘గుచ్చి నిలబెట్టాడు’ అని అనువదిస్తే పద్ధతిని అనవసరంగా నిర్దిష్టం చేసినట్లవుతుంది.
- source_word: עַל חֲמִשָּׁה עֵצִים
  choice: ఐదు చెట్ల మీద
  rationale: עֵץ యొక్క ప్రత్యక్ష అర్థం ‘చెట్టు’ లేదా ‘కలప’; సందర్భం ప్రత్యేకమైన ఉరికంబాలను తప్పనిసరిగా సూచించదు కాబట్టి ‘చెట్లు’ మూలంలోని సాధారణతను కాపాడుతుంది.
- source_word: וַיִּהְיוּ תְּלוּיִם
  choice: వేలాడుతూ ఉన్నారు
  rationale: היה తో కూడిన కర్మణి అసమాపక క్రియ కొనసాగుతున్న స్థితిని వ్యక్తం చేస్తుంది; ఈ తెలుగు రూపం ఆ వ్యవధిని సహజంగా తెలియజేస్తుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంకాలం వరకు
  rationale: వేలాడదీసిన స్థితి ముగిసే కాలపరిమితిని ప్రత్యక్షంగా తెలుపుతుంది; ‘సూర్యాస్తమయం వరకు’ అనేది కొంచెం ఎక్కువ వ్యాఖ్యానాత్మకం.
theological_decisions:
- issue: శిక్ష అమలు సందర్భంలో עֵץ పదానికి అనువాదం
  choice: చెట్లు
  alternative: కలప స్తంభాలు / ఉరికంబాలు
  rationale: మూలపదం చెట్టు లేదా కలప అని అర్థమవుతుంది; వాక్యం ప్రత్యేకమైన శిక్షా పరికరాన్ని నిర్ధారించదు. ‘చెట్లు’ అని ఉంచడం తరువాతి కాలపు రూపకల్పనను పాఠ్యంలోకి చేర్చకుండా మూలంలోని అనిర్దిష్టతను కాపాడుతుంది.
- issue: תלה సూచించే వేలాడదీయు విధానం
  choice: వేలాడదీశాడు
  alternative: గుచ్చి నిలబెట్టాడు
  rationale: ఈ క్రియ శరీరాన్ని చెట్టు లేదా కలపపై వేలాడదీయడాన్ని సూచిస్తుంది గాని, అది గుచ్చి నిలబెట్టడమేనని నిర్ధారించదు. అందువల్ల సాధారణ అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి ప్రత్యామ్నాయాన్ని గమనికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘కొట్టి చంపి’ అనే క్రమం మూలంలోని రెండు వేర్వేరు క్రియలను నిలుపుతుంది. ప్రధాన పాఠ్యంలోని [a] సూచిక సంబంధిత పాదటిప్పణితో సరిపోతుంది.
