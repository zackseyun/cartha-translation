translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘వారి మీదికి వచ్చాడు’ అనే మాట యుద్ధ సందర్భాన్ని తెలియజేస్తూనే, పాఠం స్పష్టంగా చెప్పని దాడి చర్యను అదనంగా చేర్చదు. హీబ్రూ వాక్యక్రమాన్ని తెలుగులో సహజమైన కాలక్రమంగా మార్చి, రాత్రి ప్రయాణాన్ని ప్రధాన రాకకు ముందు ఉంచాం.
