translation:
  language: te
  text: యెహోషువ గిల్గాలు నుంచి రాత్రంతా పైకి ప్రయాణించి,[b] అకస్మాత్తుగా వారి దగ్గరకు వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అకస్మాత్తుగా వారి వైపుకు వచ్చాడు.’ హీబ్రూ క్రియ అక్షరార్థంగా ‘వచ్చాడు’; యుద్ధ సందర్భంలో శత్రువును హఠాత్తుగా సమీపించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘గిల్గాలు నుంచి రాత్రంతా పైకి వెళ్లాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: వారి మీదికి వచ్చాడు
  rationale: בוא యొక్క ప్రాథమిక అర్థమైన ‘వచ్చు/చేరుకొను’ను నిలుపుతూ, אֶל యొక్క దిశార్థాన్ని ‘మీదికి’ తెలియజేస్తుంది. యుద్ధ సందర్భంలో ఇది శత్రువును సమీపించడాన్ని సహజంగా సూచిస్తుంది; దాడి మొదలుపెట్టాడని పాఠంలో లేనిదాన్ని స్పష్టంగా చేర్చదు.
- source_word: פִּתְאֹם
  choice: అకస్మాత్తుగా
  rationale: హఠాత్తుగా లేదా ఊహించని రీతిలో సంభవించిన రాకను నేరుగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל הַלַּיְלָה
  choice: రాత్రంతా
  rationale: ప్రయాణం కొనసాగిన పూర్తి కాలవ్యవధిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָלָה
  choice: పైకి ప్రయాణించి
  rationale: עלה లోని పైకి వెళ్లే భౌగోళిక భావాన్ని ‘పైకి’ నిలుపుతుంది; సైనికుల కదలిక అనే సందర్భాన్ని అతిగా విస్తరించకుండా ‘ప్రయాణించి’ సహజంగా తెలియజేస్తుంది.
- source_word: מִן הַגִּלְגָּל
  choice: గిల్గాలు నుండి
  rationale: ప్రయాణం మొదలైన స్థలాన్ని నేరుగా సూచిస్తుంది; గిల్గాలు అనే స్థలనామానికి తెలుగు వాడుకలోని రూపాన్ని ఉపయోగిస్తుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి స్థిరపడిన తెలుగు లిప్యంతరీకరణ.
