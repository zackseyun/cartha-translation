revisions:
- from: యెహోషువ, ఇశ్రాయేలు ప్రజలు[a] వారిని పూర్తిగా తుడిచిపెట్టేంతవరకు అతి ఘోరంగా హతమార్చడం ముగించినప్పుడు, వారిలో బతికి మిగిలినవారు ప్రాణాలతో మిగిలి[b], ప్రాకార పట్టణాల్లోకి చేరుకున్నారు.
  to: యెహోషువ, ఇశ్రాయేలు ప్రజలు[a] వారిని పూర్తిగా అంతమొందించేంతవరకు వారికి ఎంతో భారీ దెబ్బ కొట్టడం ముగించినప్పుడు, వారిలో మిగిలినవారు మిగిలి[b], ప్రాకారాలతో బలపరచబడిన పట్టణాల్లోకి చేరుకున్నారు.
  rationale: The revision uses “ఎంతో భారీ దెబ్బ కొట్టడం” for the Hebrew strike/great-blow idiom, avoiding an unnecessarily categorical assertion of killing while retaining the severity of the military action. It also preserves the deliberate survivor/survived repetition in concise, intelligible Telugu and makes the sense of fortified cities explicit. The narrative temporal construction and the corporate rendering “ఇశ్రాయేలు ప్రజలు” remain appropriate.
