source:
  edition: WLC
  text: וַ/יְהִי֩ כְּ/כַלּ֨וֹת יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ/הַכּוֹתָ֛/ם מַכָּ֥ה גְדוֹלָֽה מְאֹ֖ד עַד תֻּמָּ֑/ם וְ/הַ/שְּׂרִידִים֙ שָׂרְד֣וּ מֵ/הֶ֔ם וַ/יָּבֹ֖אוּ אֶל עָרֵ֥י הַ/מִּבְצָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
translation:
  language: te
  text: యెహోషువ, ఇశ్రాయేలు ప్రజలు[a] వారిని పూర్తిగా అంతమొందించేంతవరకు వారికి ఎంతో భారీ దెబ్బ కొట్టడం ముగించినప్పుడు, వారిలో మిగిలినవారు మిగిలి[b], ప్రాకారాలతో బలపరచబడిన పట్టణాల్లోకి చేరుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులు.’ ఇది ఇశ్రాయేలు ప్రజలను సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘మిగిలినవారు మిగిలారు’ అన్నట్లుగా, ఒకే మూలపదానికి చెందిన నామవాచకం, క్రియ పునరుక్తమవుతాయి.
    reason: source_form
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: ముగించినప్పుడు
  rationale: కథనాన్ని కొనసాగించే וַיְהִי మరియు కాలార్థక כְּ־తో కూడిన infinitive constructను తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా కలిపి అనువదించాం.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఈ సందర్భంలో అది ఇశ్రాయేలు సమాజాన్ని సూచించే హీబ్రూ నుడికారం; ఆధునిక తెలుగులో స్పష్టత కోసం ‘ప్రజలు’ అని ఇచ్చాం.
- source_word: לְהַכּוֹתָם מַכָּה גְדוֹלָה מְאֹד
  choice: వారిని అతి ఘోరంగా హతమార్చడం
  rationale: నכה మరియు מַכָּהల పునరుక్త నిర్మాణం ఇక్కడ యుద్ధంలోని ప్రాణాంతక దాడిని సూచిస్తుంది. తెలుగు సహజత్వాన్ని కాపాడుతూ దాని తీవ్రతను ‘అతి ఘోరంగా హతమార్చడం’గా వ్యక్తం చేశాం.
- source_word: עַד תֻּמָּם
  choice: వారిని పూర్తిగా తుడిచిపెట్టేంతవరకు
  rationale: ఈ సందర్భంలో శత్రుసేనను అంతమొందించడం అనే భావాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు రూపం; సంపూర్ణతను సూచించే మూలపాఠ భావాన్ని నిలుపుతుంది.
- source_word: וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם
  choice: వారిలో బతికి మిగిలినవారు ప్రాణాలతో మిగిలి
  rationale: నామవాచకం–క్రియలో ఉన్న שׂרד మూలపద పునరుక్తిని తెలుగులో కొంతవరకు నిలిపి, వీరు ఓడిపోయినవారిలోని ప్రాణాలతో బయటపడినవారని స్పష్టం చేశాం. וְను అదనపు విరుద్ధార్థ సూచక పదం లేకుండా అనుసంధానించాం.
- source_word: עָרֵי הַמִּבְצָר
  choice: ప్రాకార పట్టణాలు
  rationale: రక్షణ ప్రాకారాలతో బలపరచబడిన పట్టణాలనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన సాధారణ తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని దీర్ఘ నిర్మాణాన్ని ఒకే వాక్యంగా ఉంచినా, తెలుగు పఠనసౌలభ్యం కోసం పదక్రమాన్ని సవరించాం. మూలంలోని పునరుక్తిని పూర్తిగా తొలగించకుండా పరిమితంగా నిలిపాం.
