source:
  edition: WLC
  text: וְ/לֹ֨א הָיָ֜ה כַּ/יּ֤וֹם הַ/הוּא֙ לְ/פָנָ֣י/ו וְ/אַחֲרָ֔י/ו לִ/שְׁמֹ֥עַ יְהוָ֖ה בְּ/ק֣וֹל אִ֑ישׁ כִּ֣י יְהוָ֔ה נִלְחָ֖ם לְ/יִשְׂרָאֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
translation:
  language: te
  text: ఒక మనిషి స్వరాన్ని యాహ్వే ఆలకరించిన ఆ రోజువంటి రోజు దానికి ముందుగానీ తరువాతగానీ మరొకటి లేదు[a]. ఎందుకంటే యాహ్వే ఇశ్రాయేలు పక్షంగా యుద్ధం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ఒక మనిషి విన్నపాన్ని ఆలకరించిన రోజు.” హీబ్రూ మూలంలో అక్షరార్థంగా, “యాహ్వే ఒక మనిషి స్వరాన్ని ఆలకించడం” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא הָיָה כַּיּוֹם הַהוּא
  choice: ఆ రోజువంటి రోజు ... మరొకటి లేదు
  rationale: నిరాకరణతో కూడిన హీబ్రూ అస్తిత్వ వాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ఆ రోజు సాటిలేనిదనే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: לְפָנָיו וְאַחֲרָיו
  choice: దానికి ముందుగానీ, తరువాతగానీ
  rationale: సర్వనామ ప్రత్యయం సమీప పూర్వపదమైన ‘రోజు’ను సూచిస్తుందని గ్రహించి, కాలసంబంధమైన పోలికను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִשְׁמֹעַ יְהוָה בְּקוֹל אִישׁ
  choice: ఒక మనిషి మాటను యాహ్వే ఆలకరించిన
  rationale: ‘ఒక మనిషి స్వరాన్ని వినడం’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా అందిస్తూ, యాహ్వే అతని విన్నపాన్ని మన్నించాడనే భావాన్ని ఇస్తుంది; దేవుడు మనిషికి విధేయుడయ్యాడనే అనవసర భావాన్ని చొప్పించదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుగా మార్చకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు సమీపంగా లిప్యంతరీకరిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి అసాధారణ సంఘటనకు కారణాన్ని తెలిపే వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు పక్షంగా యుద్ధం చేశాడు
  rationale: లְ ఉపసర్గ ఇక్కడ ఇశ్రాయేలు ప్రయోజనార్థం లేదా వారి పక్షంగా యుద్ధం చేయడాన్ని సూచిస్తుంది; కథన సారాంశానికి సరిపోయే భూతకాల రూపాన్ని ఉపయోగించింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో గుర్తించదగిన లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- issue: לִשְׁמֹעַ ... בְּקוֹל אִישׁ భావం
  choice: ఒక మనిషి మాటను యాహ్వే ఆలకరించిన
  alternative: యాహ్వే ఒక మనిషి విన్నపాన్ని మన్నించిన; యాహ్వే ఒక మనిషికి విధేయుడైన
  rationale: మూల నుడికారంలోని ‘వినడం/ఆలకరించడం’ భావాన్ని నిలుపుతూ, సందర్భంలో యెహోషువ పలికిన విన్నపానికి దేవుడు స్పందించాడనే అర్థాన్ని తెలియజేస్తుంది. దేవుడు మనిషికి లోబడ్డాడనే సిద్ధాంతపరంగా భారమైన ప్రత్యామ్నాయాన్ని ప్రధాన పాఠ్యంలో పెట్టదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఆలకరించిన’ అనే పదం సాధారణ ‘విన్న’ కంటే సందర్భంలోని శ్రద్ధగా విని స్పందించిన భావాన్ని మెరుగ్గా తెలియజేస్తుంది; పాదటిప్పణి మూల నుడికారాన్ని నమోదు చేస్తుంది.
