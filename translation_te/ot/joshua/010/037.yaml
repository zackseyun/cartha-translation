source:
  edition: WLC
  text: וַ/יִּלְכְּד֣וּ/הָ וַ/יַּכּֽוּ/הָ לְ/פִי חֶ֠רֶב וְ/אֶת מַלְכָּ֨/הּ וְ/אֶת כָּל עָרֶ֜י/הָ וְ/אֶת כָּל הַ/נֶּ֤פֶשׁ אֲשֶׁר בָּ/הּ֙ לֹֽא הִשְׁאִ֣יר שָׂרִ֔יד כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/עֶגְל֑וֹן וַ/יַּחֲרֵ֣ם אוֹתָ֔/הּ וְ/אֶת כָּל הַ/נֶּ֖פֶשׁ אֲשֶׁר בָּֽ/הּ־־־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/037.yaml
  text: And they captured it and struck it with the edge of the sword[a], along with its king, all its cities, and every person who was in it. He left no survivor, just as he had done to Eglon. He devoted it to destruction, along with every person who was in it.
translation:
  language: te
  text: వారు దాన్ని స్వాధీనం చేసుకొని, కత్తి ధారతో దానిని, దాని రాజును, దాని నగరాలన్నిటినీ, దానిలో ఉన్న ప్రతి వ్యక్తినీ కొట్టివేశారు. అతడు ఎగ్లోనుకు చేసినట్టే, ప్రాణాలతో ఎవరినీ మిగలనివ్వలేదు. దానిని, దానిలో ఉన్న ప్రతి వ్యక్తితో సహా, నాశనానికి అంకితం చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాన్ని పూర్తిగా నాశనం చేశాడు.” హీబ్రూలోని పదానికి నాశనానికి ప్రత్యేకంగా అంకితం చేయడం అనే భావం ఉంది.
    reason: חרם అనే సాంకేతిక హీబ్రూ పదంలోని అంకితం మరియు విధ్వంసం అనే భావాలను స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: వారు దాన్ని పట్టుకొని
  rationale: לכד అనే క్రియకు నగరాన్ని పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే సైనిక భావం ఉంది; ‘పట్టుకొని’ సహజమైన ఆధునిక తెలుగు.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: కత్తివాత హతమార్చారు
  rationale: נכהతో కూడిన ‘కత్తి నోరు/అంచు’ అనే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో ప్రాణహరణాన్ని స్పష్టంగా సూచించే ‘కత్తివాత హతమార్చారు’గా ఇచ్చాం.
- source_word: מַלְכָּהּ
  choice: దాని రాజును
  rationale: పట్టుకున్న నగరానికి చెందిన రాజును సూచించే సూటి స్వామ్యరూపం.
- source_word: כָּל עָרֶיהָ
  choice: దాని పట్టణాలన్నిటిని
  rationale: עיר నగరం లేదా పట్టణం అని అర్థమవుతుంది; ఇక్కడ ప్రధాన రాజనగరానికి చెందిన ఇతర నివాస కేంద్రాలను సమగ్రంగా సూచించేందుకు ‘పట్టణాలు’ సహజంగా ఉంది.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: దానిలో ఉన్న ప్రతి వ్యక్తిని
  rationale: נפש ఇక్కడ అభౌతికమైన ‘ఆత్మ’ను కాక వ్యక్తులను లేదా ప్రాణులను సూచిస్తుంది; అపార్థం రాకుండా ‘ప్రతి వ్యక్తి’ అని ఇచ్చాం.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: ప్రాణాలతో ఎవరినీ మిగలనివ్వలేదు
  rationale: שָׂרִיד అంటే మిగిలినవాడు లేదా ప్రాణాలతో బయటపడినవాడు; తెలుగు కథనంలో ఇది స్పష్టమైన, సహజమైన రూపం. ఏకవచన క్రియకు యెహోషువను విషయిగా ఉంచాం.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְעֶגְלוֹן
  choice: అతడు ఎగ్లోనుకు చేసినట్టే
  rationale: ముందు ఎగ్లోనుకు జరిగిన చర్యతో పోలికను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: וַיַּחֲרֵם
  choice: నాశనానికి అంకితం చేశాడు
  rationale: חרם యొక్క సాంకేతిక భావంలో నాశనం చేయడమే కాక దానికోసం ప్రత్యేకంగా అప్పగించడం కూడా ఉంది; ఈ రూపం ఆ రెండు పార్శ్వాలను నిలుపుతుంది.
theological_decisions:
- issue: యుద్ధ సందర్భంలో חרם పదానికి అనువాదం
  choice: నాశనానికి అంకితం చేశాడు
  alternative: పూర్తిగా నాశనం చేశాడు
  rationale: హీబ్రూ పదం కేవలం సంపూర్ణ విధ్వంసాన్ని మాత్రమే కాక, నాశనానికి ప్రత్యేకంగా అప్పగించడమనే సాంకేతిక-ఆరాధనా భావాన్ని కూడా కలిగి ఉంది. ప్రధాన పాఠం ఆ భావాన్ని నిలుపుతుంది; పాదసూచికలో సహజ ప్రత్యామ్నాయం ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే కథనశైలి. హింసను మూలపాఠం చెప్పినంత స్పష్టంగా తెలిపి, అదనపు తీవ్రతను చేర్చలేదు. ఏకవచన క్రియల విషయిగా సందర్భానుసారం యెహోషువను సూచించే ‘అతడు’ వాడబడింది.
