translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టమైనదిగా, అయితే గౌరవప్రదమైన కథన శైలిలో రూపొందించబడింది. హీబ్రూ బహువచన కర్మప్రత్యయాన్ని ‘వారిని’గా ప్రధాన వాక్యంలోనే నిలుపుతూ, గుహను కాపాడాలని భావించే వ్యాకరణ అసంగతిని నివారించింది.
