id: JOS.10.18
reference: Joshua 10:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ גֹּ֛לּוּ אֲבָנִ֥ים גְּדֹל֖וֹת אֶל פִּ֣י הַ/מְּעָרָ֑ה וְ/הַפְקִ֧ידוּ עָלֶ֛י/הָ אֲנָשִׁ֖ים לְ/שָׁמְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/018.yaml
  text: And Joshua said[a], “Roll large stones to the mouth of the cave[b], and appoint men over it to guard it.”
translation:
  language: te
  text: అప్పుడు యెహోషువ, “గుహ ద్వారం దగ్గరికి పెద్ద రాళ్లను దొర్లించి, వారిని కాపలా కాయడానికి అక్కడ మనుషులను నియమించండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఆ కొనసాగింపును తెలియజేస్తుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: גֹּלּוּ
  choice: దొర్లించి
  rationale: גלל అనే ధాతువు రాళ్లను దొర్లించడాన్ని నేరుగా సూచిస్తుంది; తరువాతి ఆజ్ఞతో సహజంగా కలపడానికి తెలుగు సంయుక్త క్రియారూపం వాడబడింది.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: పెద్ద రాళ్లను
  rationale: పరిమాణాన్ని సూచించే సరళమైన, సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: אֶל פִּי הַמְּעָרָה
  choice: గుహ ద్వారం దగ్గరికి
  rationale: פִּי అక్షరార్థంగా ‘నోరు’ అయినా, గుహ సందర్భంలో ప్రవేశద్వారాన్ని సూచించే హీబ్రూ నుడికారం; తెలుగులో ‘గుహ ద్వారం’ స్పష్టంగా, సహజంగా ఉంటుంది. אֶל యొక్క దిశాభావాన్ని ‘దగ్గరికి’ నిలుపుతుంది.
- source_word: וְהַפְקִידוּ
  choice: నియమించండి
  rationale: פקד హిఫీల్ రూపం ఒక బాధ్యతకు వ్యక్తులను నియమించడం లేదా ఉంచడాన్ని సూచిస్తుంది; ‘నియమించండి’ బాధ్యత అప్పగింపును నిలుపుతుంది.
- source_word: עָלֶיהָ
  choice: అక్కడ
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం గుహను సూచిస్తుంది. తెలుగులో ‘గుహపై మనుషులను నియమించండి’ అసహజంగా ఉండేందున, కాపలా స్థలాన్ని సూచించే ‘అక్కడ’ వాడబడింది.
- source_word: אֲנָשִׁים
  choice: మనుషులను
  rationale: అసలు పదం వ్యక్తులను సూచిస్తుంది; సందర్భం సైనిక పురుషులదైనా, ‘కాపలాదారులు’ అని ప్రత్యేక పాత్రనామాన్ని మూలంలో లేనంతగా చేర్చకుండా ‘మనుషులు’ అని అనువదించబడింది.
- source_word: לְשָׁמְרָם
  choice: వారిని కాపలా కాయడానికి
  rationale: ప్రత్యయం పుంలింగ బహువచనం; అందువల్ల అది ఏకవచనమైన గుహను కాక, లోపల బంధించబడిన రాజులను సహజంగా సూచిస్తుంది. ‘వారిని’ ఈ వ్యాకరణ భేదాన్ని స్పష్టంగా నిలుపుతుంది.
