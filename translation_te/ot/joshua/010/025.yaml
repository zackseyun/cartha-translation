  terminology: యెహోషువ మరియు యాహ్వే రూపాలు అనుకూలంగా ఉన్నాయి. ‘దిగ్భ్రాంతి చెందకండి’ חתת‌కు సముచితమైన అధికారిక రూపం; దాని బలమైన ‘కృంగిపోవడం’ ఛాయను పాదటిప్పణి సముచితంగా సూచిస్తుంది.
