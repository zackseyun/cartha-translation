  source_fidelity: 'మూల హీబ్రూ భావం మొత్తంగా సరిగానే ఉంది: రెండు నిషేధ ఆజ్ఞలు, బలము–ధైర్యము అనే జత ప్రోత్సాహం, మరియు యుద్ధం చేస్తున్న శత్రువులకు యాహ్వే ఇదే విధంగా చేస్తాడనే భవిష్యత్ హామీ అన్నీ నిలిచాయి. అయితే ‘ధైర్యం తెచ్చుకోండి’ అనేది అమץ యొక్క స్థిరమైన ప్రోత్సాహక ఆజ్ఞకు కొంచెం తక్కువ సహజంగా ఉంది; అలాగే సంబంధవాక్యాన్ని శత్రువుల నామవాచకానికి నేరుగా జతచేయడం తెలుగులో స్పష్టంగా ఉంటుంది.'
