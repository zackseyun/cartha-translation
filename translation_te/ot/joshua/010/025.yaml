id: JOS.10.25
reference: Joshua 10:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְהוֹשֻׁ֔עַ אַל תִּֽירְא֖וּ וְ/אַל תֵּחָ֑תּוּ חִזְק֣וּ וְ/אִמְצ֔וּ כִּ֣י כָ֗כָה יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל אֹ֣יְבֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם נִלְחָמִ֥ים אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/025.yaml
  text: And Joshua said to them[a], “Do not fear and do not be dismayed. Be strong and courageous, for thus Yahweh will do to all your enemies against whom you are fighting.”
translation:
  language: te
  text: 'యెహోషువ వారితో ఇలా అన్నాడు: “భయపడకండి, దిగ్భ్రాంతి చెందకండి.[a] బలంగా ఉండండి, ధైర్యంగా ఉండండి. ఎందుకంటే మీరు యుద్ధం చేస్తున్న మీ శత్రువులందరికీ యాహ్వే ఇలాగే చేస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భయపడకండి, కృంగిపోకండి.”
    reason: חתת అనే క్రియకు దిగ్భ్రాంతి చెందడం మాత్రమే కాక, అంతరంగంగా కూలిపోవడం లేదా కృంగిపోవడం అనే బలమైన ఛాయ కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ
  choice: యెహోషువ వారితో ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగు కథనశైలిలో ‘ఇలా అన్నాడు’ తరువాత వచ్చే ప్రత్యక్ష సంభాషణను సహజంగా పరిచయం చేస్తుంది.
- source_word: אַל תִּירְאוּ
  choice: భయపడకండి
  rationale: నిషేధార్థక బహువచన ఆజ్ఞను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וְאַל תֵּחָתּוּ
  choice: దిగ్భ్రాంతి చెందకండి
  rationale: חתת నిఫాల్ రూపంలోని భయంతో కూలిపోవడం, కలవరపడడం అనే భావాన్ని మొదటి క్రియతో కలిపేయకుండా ప్రత్యేకంగా నిలుపుతుంది.
- source_word: חִזְקוּ וְאִמְצוּ
  choice: బలంగా ఉండండి, ధైర్యం తెచ్చుకోండి
  rationale: బలం మరియు దృఢసాహసం అనే రెండు అనుబంధమైనా వేర్వేరు భావాలను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כִּי כָכָה
  choice: ఎందుకంటే … ఇలాగే
  rationale: כִּי ఇచ్చే కారణసంబంధాన్ని, כָכָה సూచించే ‘ఈ విధంగా’ అనే భావాన్ని రెండింటినీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יַעֲשֶׂה יְהוָה
  choice: యాహ్వే ఇలాగే చేస్తాడు
  rationale: యిక్తోల్‌ను సందర్భానుసారమైన భవిష్యదర్థంలో గ్రహించవచ్చు; తెలుగులో ‘చేస్తాడు’ సాధారణ భవిష్య కార్యాన్ని సహజంగా తెలియజేస్తుంది. దేవుని నామం יְהוָהను ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: לְכָל אֹיְבֵיכֶם
  choice: మీ ఆ శత్రువులందరికీ
  rationale: עשה + לְ నిర్మాణంలోని ‘వారికి ఇలా చేయడం’ అనే భావాన్ని నిలుపుతుంది; ‘ఆ’ అనేది ఇలాగే జరగబోయే శత్రువులను సూచిస్తుంది.
- source_word: אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  choice: మీరు ఎవరితో యుద్ధం చేస్తున్నారో
  rationale: హీబ్రూ సంబంధవాక్యాన్ని తెలుగులో సహజమైన సంబంధ–సూచక నిర్మాణంగా మార్చి, పోరాటంలోని ప్రతికూల సంబంధాన్ని ‘ఎవరితో’ ద్వారా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న నాలుగు అక్షరాల దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పాండిత్య ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా ఉండి, యుద్ధసందర్భంలోని గంభీరమైన ప్రోత్సాహక స్వరాన్ని నిలుపుతుంది.
