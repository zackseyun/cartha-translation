revisions:
- from: యెహోషువ ఈ రాజులందరినీ, వారి దేశాన్నీ ఒకేసారి[a] స్వాధీనం చేసుకున్నాడు. ఎందుకంటే ఇశ్రాయేలు దేవుడైన యెహోవా ఇశ్రాయేలు పక్షంగా యుద్ధం చేశాడు.
  to: యెహోషువ ఈ రాజులందరినీ, వారి దేశాన్నీ ఒకే సమయంలో[a] స్వాధీనం చేసుకున్నాడు; ఎందుకంటే ఇశ్రాయేలు దేవుడైన యాహ్వే ఇశ్రాయేలు కోసం యుద్ధం చేశాడు.
