  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל הַ/מְּלָכִ֤ים הָ/אֵ֨לֶּה֙ וְ/אֶת אַרְצָ֔/ם לָכַ֥ד יְהוֹשֻׁ֖עַ פַּ֣עַם אֶחָ֑ת כִּ֗י יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל נִלְחָ֖ם לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
translation:
  language: te
  text: యెహోషువ ఈ రాజులందరినీ, వారి దేశాన్నీ ఒకే సమయంలో[a] స్వాధీనం చేసుకున్నాడు; ఎందుకంటే ఇశ్రాయేలు దేవుడైన యాహ్వే ఇశ్రాయేలు కోసం యుద్ధం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకే దండయాత్రలో.” హీబ్రూలో అక్షరార్థం, “ఒక సమయంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: స్వాధీనం చేసుకున్నాడు
  rationale: సైనిక సందర్భంలో పట్టుకోవడం లేదా వశపరచుకోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘జయించాడు’ కంటే మూల క్రియకు దగ్గరగా ఉంటుంది.
- source_word: וְאֵת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: ఈ రాజులందరినీ
  rationale: నిర్దిష్ట కర్మను, సూచనార్థక పదాన్ని నేరుగా మరియు సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וְאֶת אַרְצָם
  choice: వారి దేశాన్నీ
  rationale: אֶרֶץ ఇక్కడ ఆ రాజుల అధీనంలోని భూభాగాన్ని సూచిస్తుంది; ‘దేశం’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: פַּעַם אֶחָת
  choice: ఒకేసారి
  rationale: అక్షరార్థంగా ‘ఒక సమయంలో/ఒక్కసారి’; సందర్భంలో ఒకే దండయాత్రలో అనే భావం ఉండవచ్చు. ప్రధాన పాఠంలో సంక్షిప్తమైన సహజ రూపాన్ని ఉంచి, సందర్భార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యెహోషువ విజయానికి కారణాన్ని స్పష్టంగా పరిచయం చేసే కారణార్థక అనుసంధానం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన నామరూపంతో అందిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు సంబంధ నిర్మాణంగా నేరుగా వ్యక్తపరుస్తుంది.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు పక్షంగా యుద్ధం చేశాడు
  rationale: לְ తో కూడిన నిఫాల్ క్రియ ఇశ్రాయేలు ప్రయోజనార్థం లేదా పక్షంగా యుద్ధం చేయడాన్ని సూచిస్తుంది; ‘పక్షంగా’ ఆ భావాన్ని స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నామరూపంలో ఉంచాం; ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘ఒకేసారి’ అనే మూలానికి దగ్గరైన వ్యక్తీకరణను ప్రధాన పాఠంలో ఉంచి, సంభావ్య సైనిక సందర్భార్థాన్ని పాదటిప్పణిలో కాపాడాం.
