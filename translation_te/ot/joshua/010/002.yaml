  revision_rationale: The revision removes an added temporal adverb, renders the kingdom-city comparison without suggesting capitals, standardizes the place names, and moves the footnote anchor to the term it qualifies. It retains the source’s deliberate breadth in ‘great’ and the martial implication of the final predicate.
