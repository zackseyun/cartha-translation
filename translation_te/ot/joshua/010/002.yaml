language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽירְא֣וּ מְאֹ֔ד כִּ֣י עִ֤יר גְּדוֹלָה֙ גִּבְע֔וֹן כְּ/אַחַ֖ת עָרֵ֣י הַ/מַּמְלָכָ֑ה וְ/כִ֨י הִ֤יא גְדוֹלָה֙ מִן הָ/עַ֔י וְ/כָל אֲנָשֶׁ֖י/הָ גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
translation:
  language: te
  text: వారు ఎంతో భయపడ్డారు, ఎందుకంటే గిబ్యోను రాజ్యంలోని నగరాల్లో ఒకదానివలె గొప్ప నగరం; అది ఆయి కంటే గొప్పది, దాని పురుషులందరూ పరాక్రమవంతులు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరాక్రమశాలులైన యోధులు.’
    reason: గిబ్బోరీమ్ అనే పదానికి ‘పరాక్రమవంతులు’తో పాటు సందర్భానుసారంగా ‘పరాక్రమశాలులైన యోధులు’ అనే స్పష్టమైన సైనిక అర్థం కూడా ఉంటుంది.
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  choice: అప్పుడు వారు ఎంతో భయపడ్డారు
  rationale: యרא అనే క్రియ భయాన్ని, מְאֹד తీవ్రతను తెలియజేస్తాయి. ‘అప్పుడు’ వావ్-క్రమంలోని కథన కొనసాగింపును సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారి భయానికి కారణాన్ని పరిచయం చేసే కారణార్థక ప్రయోగం.
- source_word: עִיר גְּדוֹלָה
  choice: గొప్ప నగరం
  rationale: גָּדוֹל పరిమాణాన్నీ ప్రాముఖ్యాన్నీ సూచించగలదు; ‘గొప్ప’ ఈ రెండింటినీ అనవసరంగా ఒక అర్థానికే పరిమితం చేయదు.
- source_word: גִּבְעוֹן
  choice: గిబియోను
  rationale: హీబ్రూ స్థలనామానికి తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  choice: రాజనగరాల్లో ఒకదానివంటి
  rationale: రాజ్యానికి చెందిన లేదా రాజస్థాయి గల నగరాల్లో ఒకదానితో పోలికను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הִיא גְדוֹלָה מִן הָעַי
  choice: అది హాయి కంటే గొప్పది
  rationale: ముందటి גָּדוֹל పదంతో భావసామ్యాన్ని నిలుపుతూ, పరిమాణం లేదా ప్రాముఖ్యం అనే సాధ్యమైన రెండు భావాలనూ తెరిచి ఉంచుతుంది.
- source_word: וְכָל אֲנָשֶׁיהָ
  choice: దానిలోని పురుషులందరూ
  rationale: సైనిక సందర్భంలో אֲנָשִׁים నగరంలోని పురుషులను సూచిస్తుంది; నగరాన్ని సూచించే స్త్రీలింగ ప్రత్యయాన్ని తెలుగులో సహజంగా ‘దానిలోని’ అని వ్యక్తపరిచాం.
- source_word: גִּבֹּרִים
  choice: పరాక్రమవంతులు
  rationale: బలం, శౌర్యం, యుద్ధసామర్థ్యం కలవారు అనే భావాన్ని సంక్షిప్తంగా ఇస్తుంది; స్పష్టమైన యోధార్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని ‘గొప్ప’ అనే పదానికి ఉన్న పరిమాణం–ప్రాముఖ్యం ద్వంద్వసాధ్యతను నిలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న גִּבֹּרִים పదానికి అనుగుణంగా వాక్యాంతంలో ఉంచాం.
