base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/043.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: te
  text: అప్పుడు యెహోషువ, అతనితోపాటు ఇశ్రాయేలంతా గిల్గాలులోని శిబిరానికి తిరిగి వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “శిబిరానికి, గిల్గాలుకు.” హీబ్రూలో “గిల్గాలు” అనే పేరుకు దిశను సూచించే ప్రత్యయం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చారు
  rationale: שׁוב అనే క్రియ కథన క్రమంలో తిరిగి రావడాన్ని సూచిస్తుంది. యెహోషువతోపాటు సమూహమంతా కర్తగా ఉన్నందున తెలుగులో గౌరవ/బహువచన క్రియ సహజంగా ఉంటుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న ప్రామాణిక రూపం.
- source_word: וְכָל יִשְׂרָאֵל
  choice: అతనితోపాటు ఇశ్రాయేలంతా
  rationale: మూలంలోని ‘ఇశ్రాయేలు అంతా’ అనే సామూహిక భావాన్ని నిలుపుతూ, సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; దీనిని ‘ఇశ్రాయేలీయులందరూ’ అని మరింత నిర్దిష్టంగా వ్యాఖ్యానించలేదు.
- source_word: עִמּוֹ
  choice: అతనితోపాటు
  rationale: עם + మూడవ పురుష ఏకవచన ప్రత్యయం తెలిపే సహగమనాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אֶל הַמַּחֲנֶה
  choice: శిబిరానికి
  rationale: గమ్యస్థానం వైపు కదలికను తెలిపే אֶל ను తెలుగు దత్తివిభక్తితో సహజంగా వ్యక్తం చేసింది; מַחֲנֶה సైనిక సందర్భంలో ‘శిబిరం’.
- source_word: הַגִּלְגָּלָה
  choice: గిల్గాలులోని
  rationale: స్థలనామంపై ఉన్న దిశార్థక ה గిల్గాలు వైపు కదలికను సూచిస్తుంది. ముందే ‘శిబిరానికి’ అని గమ్యాన్ని తెలిపినందున ‘గిల్గాలులోని శిబిరానికి’ అనేది సహజ తెలుగు; మూలంలోని మరింత అక్షరార్థ నిర్మాణం పాదసూచికలో ఇవ్వబడింది.
