    issue: The divine name is rendered “యెహోవా.”
    rationale: The source has יהוה, and the POB audit trail explicitly requires “Yahweh.” In Telugu this should be represented as “యాహ్వే,” rather than the traditional “యెహోవా.”
  - severity: low
    issue: The footnote's “చివరి వరుస” is overly specific.
    rationale: The Hebrew verb evokes striking the tail end/rear of a fleeing force, including stragglers; it does not necessarily denote a formal final rank.
