  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתֶּם֙ אַֽל תַּעֲמֹ֔דוּ רִדְפוּ֙ אַחֲרֵ֣י אֹֽיְבֵי/כֶ֔ם וְ/זִנַּבְתֶּ֖ם אוֹתָ֑/ם אַֽל תִּתְּנ֗וּ/ם לָ/בוֹא֙ אֶל עָ֣רֵי/הֶ֔ם כִּ֧י נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
translation:
  language: te
  text: అయితే మీరు ఆగిపోకండి; మీ శత్రువులను వెంబడించి, వారి వెనుకనున్న వారిపై దాడి చేయండి.[a] వారు తమ పట్టణాల్లోకి ప్రవేశించనివ్వకండి; ఎందుకంటే మీ దేవుడైన యాహ్వే వారిని మీ చేతికి అప్పగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి వెనుక భాగాన్ని కొట్టండి’ / ‘వెనుకబడిన వారిని కొట్టండి.’ హీబ్రూ క్రియ పారిపోతున్న దళపు తోకవంటి చివరి భాగంపై దాడి చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: అయితే మీరు
  rationale: స్వతంత్ర సర్వనామంతో కూడిన సంధి, ముందున్న ఆదేశానికి భిన్నంగా ఇప్పుడు ప్రజలపై ఉద్ఘాటనను ఉంచుతుంది; ‘అయితే మీరు’ ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַל תַּעֲמֹדוּ
  choice: ఆగిపోకండి
  rationale: పదశః ‘నిలబడకండి’; యుద్ధ సందర్భంలో శత్రువుల వెంబడింపును నిలిపివేయవద్దనే భావం. ఆధునిక తెలుగులో ‘ఆగిపోకండి’ సహజంగా ఆ అర్థాన్ని అందిస్తుంది.
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  choice: మీ శత్రువులను వెంబడించి
  rationale: רדף אחרי అనేది వెంటాడడం లేదా వెంబడించడం అనే స్థిర ప్రయోగం; ‘వెంబడించండి’ సైనిక సందర్భానికి తగినది.
- source_word: וְזִנַּבְתֶּם אוֹתָם
  choice: వారి వెనుక భాగంపై దాడి చేయండి
  rationale: זנב మూలంగా ‘తోక/చివరి భాగం’తో సంబంధమున్న క్రియ; పారిపోతున్న దళపు వెనుక భాగాన్ని కొట్టడాన్ని సూచిస్తుంది. ప్రత్యేకంగా వ్యవస్థీకృత ‘వెనుక దళం’ ఉందని మూలపాఠం తప్పనిసరిగా చెప్పదు కాబట్టి విస్తృతమైన భావాన్ని నిలిపాం.
- source_word: אַל תִּתְּנוּם לָבוֹא
  choice: వారు ... ప్రవేశించనివ్వకండి
  rationale: נתן + క్రియార్థక రూపం ఇక్కడ అనుమతించడాన్ని సూచించే హీబ్రూ ప్రయోగం; తెలుగులో ‘ప్రవేశించనివ్వకండి’ సహజ సమానం.
- source_word: אֶל עָרֵיהֶם
  choice: తమ పట్టణాల్లోకి
  rationale: עיר నగరం లేదా పట్టణాన్ని సూచించగలదు. ఈ ప్రాంతంలోని కోటగల జనావాసాలకు ఆధునిక తెలుగులో ‘పట్టణాలు’ విస్తృతంగా సరిపోతుంది; ప్రతిబింబక ‘తమ’ వాక్య సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: כִּי נְתָנָם
  choice: ఎందుకంటే ... వారిని ... అప్పగించాడు
  rationale: పూర్తిక్రియ విజయాన్ని దేవుడు ఇప్పటికే నిర్ణయాత్మకంగా కలిగించినదిగా చూపుతుంది. ‘అప్పగించాడు’ హీబ్రూ ‘ఇచ్చాడు’ అనే విజయ/అధికార ప్రయోగాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: రెండవ పురుష బహువచన సంబంధాన్ని నేరుగా, సహజమైన తెలుగు విశేషణ నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: בְּיֶדְכֶם
  choice: మీ చేతికి
  rationale: ‘చేతిలో/చేతికి ఇవ్వడం’ అధికారం లేదా వశంలో ఉంచడాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులో అర్థవంతంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం. ఉచ్చారణ పునర్నిర్మాణంలో అనిశ్చితి ఉన్నందున, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ను ప్రధాన పాఠంలో ఎంచుకున్నాం.
- issue: נְתָנָם యొక్క పూర్తి కార్య భావం
  choice: అప్పగించాడు
  alternative: అప్పగించనున్నాడు
  rationale: హీబ్రూ పర్ఫెక్ట్ రూపం విజయం దేవుని కార్యంగా ఇప్పటికే నిర్ధారించబడిందని చెబుతుంది; భవిష్యత్ కాలంగా మార్చకుండా పూర్తిక్రియను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు. సైనిక సందర్భం స్పష్టంగా ఉండేలా సహజ వాక్యనిర్మాణం వాడాం. మూలంలోని ‘చేతి’ రూపకాన్ని నిలిపి, זנב యొక్క సాధ్యమైన అర్థ పరిధిని పాదటిప్పణిలో సంరక్షించాం.
