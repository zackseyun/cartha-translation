  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని భౌగోళిక విస్తృతిని ‘మొదలుకొని ... వరకు’ నిర్మాణంతో నిలిపి, נכה క్రియలోని స్వల్ప అస్పష్టతను పాదసూచికలో సంరక్షించాం.
