  yaml_path: translation/ot/joshua/010/041.yaml
  text: And Joshua struck them from Kadesh-barnea as far as Gaza[a], and all the land of Goshen, as far as Gibeon.
translation:
  language: te
  text: యెహోషువ కాదేషు-బర్నేయ నుండి గాజా వరకు, అలాగే గోషెను దేశమంతటినీ గిబ్యోను వరకు వారిని ఓడించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని కొట్టాడు.” హీబ్రూ క్రియ సైనికంగా దెబ్బతీయడం లేదా ఓడించడం అని అర్థం కావచ్చు; జరిగిన విధానాన్ని అది ప్రతిసారీ ఖచ్చితంగా పేర్కొనదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: వారిని ఓడించాడు
  rationale: נכה అనే క్రియ ఇక్కడ సైనిక దాడి లేదా పరాజయాన్ని సూచిస్తుంది; ప్రతి ఒక్కరినీ చంపాడని అవసరానికి మించి నిర్దిష్టం చేయకుండా సందర్భానికి సహజమైన అర్థాన్ని ఇస్తుంది.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: కాదేశ్-బర్నేయ మొదలుకొని
  rationale: దండయాత్ర భౌగోళిక విస్తృతి ప్రారంభ బిందువును తెలిపే స్థలనామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణలో ఉంచుతుంది.
- source_word: וְעַד עַזָּה
  choice: గాజా వరకు
  rationale: עַד సూచించే భౌగోళిక హద్దు లేదా విస్తృతిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֵת כָּל אֶרֶץ גֹּשֶׁן
  choice: గోషెను ప్రాంతమంతటినీ
  rationale: אֵת గుర్తించిన అదనపు ప్రత్యక్ష కర్మను స్పష్టంగా చూపుతూ, אֶרֶץ‌ను ఈ భౌగోళిక సందర్భంలో సహజమైన ‘ప్రాంతం’గా అనువదిస్తుంది.
- source_word: וְעַד גִּבְעוֹן
  choice: గిబియోను వరకు
  rationale: עַד సూచించే మరొక భౌగోళిక హద్దును సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
