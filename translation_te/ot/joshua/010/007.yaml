source:
  edition: WLC
  text: וַ/יַּ֨עַל יְהוֹשֻׁ֜עַ מִן הַ/גִּלְגָּ֗ל ה֚וּא וְ/כָל עַ֤ם הַ/מִּלְחָמָה֙ עִמּ֔/וֹ וְ/כֹ֖ל גִּבּוֹרֵ֥י הֶ/חָֽיִל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/007.yaml
  text: So Joshua went up from Gilgal[a], he and all the fighting men with him[b], and all the mighty men of valor.
translation:
  language: te
  text: అప్పుడు యెహోషువ స్వయంగా, అతనితో పాటు యుద్ధసైనికులందరితోను పరాక్రమవంతులైన యోధులందరితోను, గిల్గాలు నుండి పైకి వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: బయలుదేరి పైకి వెళ్లాడు
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం’ అనే దిశార్థాన్ని నిలుపుతూ, ప్రయాణం ప్రారంభించిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సైనికంగా ‘దండెత్తాడు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: מִן הַגִּלְגָּל
  choice: గిల్గాలు నుండి
  rationale: מן అనే విభక్తి భావాన్ని ‘నుండి’తో నేరుగా తెలిపి, స్థలనామాన్ని సాధారణ తెలుగు రూపమైన ‘గిల్గాలు’గా లిప్యంతరీకరించింది.
- source_word: הוּא
  choice: అతనితోపాటు
  rationale: హీబ్రూలో యెహోషువను ప్రత్యేకంగా సూచించే స్వతంత్ర సర్వనామం ఉంది. తెలుగులో ‘అతడు మరియు...’ అనే కృత్రిమ నిర్మాణం బదులు, యెహోషువ స్వయంగా వారితో వెళ్లాడనే భావాన్ని ‘అతనితోపాటు’ సహజంగా నిలుపుతుంది.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: యుద్ధానికి సిద్ధమైన వారందరూ
  rationale: అక్షరార్థంగా ‘యుద్ధపు ప్రజలందరూ’; సందర్భంలో యుద్ధంలో పాల్గొనే సైనిక బలగాన్ని సూచిస్తుంది. ఈ రూపం ఆధునిక పాఠకులకు సహజంగా ఉండి సైనిక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עִמּוֹ
  choice: అతనితోపాటు
  rationale: עם + ప్రత్యయాన్ని సహజమైన తెలుగు సహచర్య ప్రయోగంతో అనువదించింది.
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  choice: పరాక్రమవంతులైన యోధులందరూ
  rationale: గిబ్బోరే హహయిల్ అనే స్థిరపదబంధం బలశౌర్యం, యుద్ధసామర్థ్యం గల వీరులను సూచిస్తుంది. ‘పరాక్రమవంతులైన యోధులు’ ఈ రెండు అంశాలను గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
