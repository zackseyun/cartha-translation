translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. మూలంలోని రెండు సైనిక సమూహ సూచనల మధ్య తేడాను ‘యుద్ధానికి సిద్ధమైన వారు’ మరియు ‘పరాక్రమవంతులైన యోధులు’గా నిలుపుతూ, అనవసరమైన ప్రాచీన లేదా మతశాఖాపర పదజాలాన్ని నివారించింది.
