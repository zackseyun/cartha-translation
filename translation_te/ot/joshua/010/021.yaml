source:
  edition: WLC
  text: וַ/יָּשֻׁבוּ֩ כָל הָ/עָ֨ם אֶל הַ/מַּחֲנֶ֧ה אֶל יְהוֹשֻׁ֛עַ מַקֵּדָ֖ה בְּ/שָׁל֑וֹם לֹֽא חָרַ֞ץ לִ/בְנֵ֧י יִשְׂרָאֵ֛ל לְ/אִ֖ישׁ אֶת לְשֹׁנֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
translation:
  language: te
  text: ప్రజలందరూ మక్కేదాలో యెహోషువ దగ్గర ఉన్న శిబిరానికి క్షేమంగా తిరిగి వచ్చారు. ఇశ్రాయేలు కుమారుల్లో ఎవరికీ విరోధంగా ఒక్కరు కూడా నోరు మెదపలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇశ్రాయేలు కుమారుల్లో ఎవరికీ విరోధంగా ఒక్కరు కూడా తన నాలుకను పదును పెట్టలేదు.” అంటే, వారికి విరోధంగా ఎవరూ ఒక్క మాట కూడా అనలేదు.
    reason: హీబ్రూ నుడికారం యొక్క అక్షరార్థ బింబాన్ని మరియు సందర్భార్థాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ כָל הָעָם
  choice: ప్రజలందరూ ... తిరిగి వచ్చారు
  rationale: שׁוּב ఇక్కడ తరుముకొని వెళ్లిన తరువాత తిరిగి రావడాన్ని సూచిస్తుంది. עָם సైనిక సందర్భంలో ఉన్నప్పటికీ మూలపాఠంలో సాధారణంగా ‘ప్రజలు’ అనే పదమే ఉంది.
- source_word: אֶל הַמַּחֲנֶה אֶל יְהוֹשֻׁעַ מַקֵּדָה
  choice: మక్కేదాలో యెహోషువ దగ్గర ఉన్న శిబిరానికి
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది. గమ్యం మక్కేదాలో యెహోషువ ఉన్న శిబిరమని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: בְּשָׁלוֹם
  choice: క్షేమంగా
  rationale: ఈ సందర్భంలో שָׁלוֹם వారు సురక్షితంగా, క్షేమంగా తిరిగి రావడాన్ని సూచిస్తుంది; తెలుగు సహజ ప్రయోగానికి ‘క్షేమంగా’ సరిపోతుంది.
- source_word: לֹא חָרַץ ... אֶת לְשֹׁנוֹ
  choice: ఒక్కరు కూడా నోరు మెదపలేదు
  rationale: ఈ హీబ్రూ నుడికారం అక్షరార్థంగా నాలుకను పదును పెట్టడం/కదపడం అనే బింబాన్ని కలిగి, సందర్భంలో విరోధంగా మాటాడకపోవడాన్ని సూచిస్తుంది. ‘నోరు మెదపలేదు’ తెలుగులో సహజంగా ఉండి మాటకు సంబంధించిన బింబాన్ని నిలుపుతుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל לְאִישׁ
  choice: ఇశ్రాయేలు కుమారుల్లో ఎవరికీ
  rationale: בני ישראל అనే జాతీయ-నిబంధనాత్మక సంబోధనలోని ‘కుమారులు’ రూపాన్ని నిలుపుతూ, ప్రతికూల వాక్యంలోని לְאִישׁ భావాన్ని ‘ఎవరికీ’గా సహజంగా అందిస్తుంది.
theological_decisions:
- issue: בני ישראל అనే లింగసూచక జాతీయ సంబోధన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలో ఉన్న ‘కుమారులు’ అనే రూపాన్ని నిలుపుతుంది; దానిని వ్యాఖ్యానాత్మకంగా లింగతటస్థ పదంగా మార్చదు.
- issue: ఎవరూ విరోధంగా మాట్లాడకపోవడం అనే నుడికార భావం
  choice: విరోధంగా ... నోరు మెదపలేదు
  alternative: ఎవరూ ఒక్క మాట కూడా అనలేదు / ఎవరూ తమ నాలుకను పదును పెట్టలేదు
  rationale: శత్రుత్వపూర్వక మాట అనే సందర్భార్థాన్ని తెలుపుతూ, మూలంలోని నాలుక/మాట బింబాన్ని సహజ తెలుగు నుడికారంతో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ప్రధాన పాఠంలో సహజ తెలుగు నుడికారాన్ని ఉపయోగించి, హీబ్రూ అక్షరార్థ బింబాన్ని పాదటిప్పణిలో ఉంచాం.
