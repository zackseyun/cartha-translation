  source_fidelity: 'హీబ్రూ వచనంలోని క్రమాన్ని, అర్థాన్ని నమ్మకంగా ప్రతిబింబిస్తుంది: ప్రజలందరూ శిబిరానికి, మక్కేదాలోనున్న యెహోషువ వద్దకు క్షేమంగా తిరిగివచ్చారు; ఇశ్రాయేలు కుమారులకు వ్యతిరేకంగా ఎవరూ మాటాడలేదు. לֹא חָרַץ ... אֶת־לְשֹׁנוֹ అనే నుడికారాన్ని ప్రధాన పాఠంలో సహజంగా, పాదటిప్పణిలో అక్షరార్థ బింబంతో అందించింది.'
