source:
  edition: WLC
  text: וַ/יִּשְׁלְח֣וּ אַנְשֵׁי֩ גִבְע֨וֹן אֶל יְהוֹשֻׁ֤עַ אֶל הַֽ/מַּחֲנֶה֙ הַ/גִּלְגָּ֣לָ/ה לֵ/אמֹ֔ר אַל תֶּ֥רֶף יָדֶ֖י/ךָ מֵֽ/עֲבָדֶ֑י/ךָ עֲלֵ֧ה אֵלֵ֣י/נוּ מְהֵרָ֗ה וְ/הוֹשִׁ֤יעָ/ה לָּ֨/נוּ֙ וְ/עָזְרֵ֔/נוּ כִּ֚י נִקְבְּצ֣וּ אֵלֵ֔י/נוּ כָּל מַלְכֵ֥י הָ/אֱמֹרִ֖י יֹשְׁבֵ֥י הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
translation:
  language: te
  text: 'అప్పుడు గిబ్యోను మనుషులు గిల్గాలులోని శిబిరంలో ఉన్న యెహోషువకు ఇలా కబురు పంపారు: “నీ సేవకులమైన మమ్మల్ని విడిచిపెట్టవద్దు.[a] త్వరగా మా దగ్గరికి ఎక్కి వచ్చి, మమ్మల్ని రక్షించి మాకు సహాయం చేయి. ఎందుకంటే పర్వత ప్రాంతంలో నివసించే అమోరీయుల రాజులందరూ మాకు విరోధంగా కూడుకున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “నీ సేవకుల నుండి నీ చేతిని సడలించవద్దు.” అంటే “మాకు సహాయం చేయడం ఆపవద్దు” లేదా “మమ్మల్ని విడిచిపెట్టవద్దు” అనే నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אַנְשֵׁי גִבְעוֹן
  choice: గిబియోను మనుషులు ... కబురు పంపారు
  rationale: వాక్యంలోని వరుస కథన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; אַנְשֵׁי అనే పుంలింగ రూపాన్ని ‘మనుషులు’గా నిలుపుతుంది.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּלָה
  choice: గిల్గాలులోని శిబిరంలో ఉన్న యెహోషువకు
  rationale: రెండుసార్లు వచ్చిన אֶל సూచించే గ్రహీతను, గమ్యస్థానాన్ని తెలుగులో సహజంగా కలిపి చెబుతుంది; గిల్గాలు వద్దనున్న శిబిరమే ఉద్దేశమని స్పష్టం చేస్తుంది.
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ
  choice: నీ సేవకులమైన మమ్మల్ని విడిచిపెట్టవద్దు
  rationale: అక్షరార్థంగా ‘నీ సేవకుల నుండి నీ చేతిని సడలించవద్దు’ అనే హీబ్రూ నుడికారానికి సందర్భానుగుణమైన సహజ తెలుగు; సహాయాన్ని ఆపడం లేదా వారిని వదిలేయడం అనే భావాన్ని అందిస్తుంది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులమైన మమ్మల్ని
  rationale: ఇక్కడ ఇది బానిసత్వాన్ని ప్రధానంగా సూచించకుండా, యెహోషువ ఎదుట గిబియోనీయులు తమను తాము వినయంగా పేర్కొనే రాజకీయ-ఒడంబడిక సంబంధ పదప్రయోగం.
- source_word: עֲלֵה אֵלֵינוּ מְהֵרָה
  choice: త్వరగా మా దగ్గరికి ఎక్కి వచ్చి
  rationale: עלה లోని భౌగోళిక ఎక్కుదల భావాన్ని ‘ఎక్కి’ నిలుపుతూ, సందేశం పంపినవారి దృష్టికోణానికి తగిన ‘వచ్చి’ని ఉపయోగిస్తుంది.
- source_word: וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ
  choice: మమ్మల్ని రక్షించి మాకు సహాయం చేయి
  rationale: సైనిక ప్రమాదం నుండి విడిపించడం అనే ישע భావాన్నీ, עזר అనే సాధారణ సహాయ భావాన్నీ వేరువేరుగా నిలుపుతుంది.
- source_word: כִּי נִקְבְּצוּ אֵלֵינוּ
  choice: ఎందుకంటే ... మాకు విరోధంగా కూడుకున్నారు
  rationale: శత్రుత్వ సందర్భంలో אֶל కేవలం దిశను కాక దాడికి ఉద్దేశించిన సమీకరణను సూచిస్తుంది; ‘విరోధంగా’ ఆ సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: כָּל מַלְכֵי הָאֱמֹרִי יֹשְׁבֵי הָהָר
  choice: పర్వత ప్రాంతంలో నివసించే అమోరీయుల రాజులందరూ
  rationale: יֹשְׁבֵי הָהָר ను ఆధునిక తెలుగులో సహజంగా ‘పర్వత ప్రాంతంలో నివసించే’ అని అనువదించి, రాజులందరినీ విశేషించే నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఎక్కి వచ్చి’ ద్వారా భౌగోళిక సూక్ష్మభావం నిలుపబడింది; అపరిచితంగా వినిపించే హీబ్రూ ‘చేయి’ నుడికారాన్ని ప్రధాన పాఠంలో భావానువాదంగా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
