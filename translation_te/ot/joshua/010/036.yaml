source:
  edition: WLC
  text: וַ/יַּ֣עַל יְ֠הוֹשֻׁעַ וְ/כָֽל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מֵ/עֶגְל֖וֹנָ/ה חֶבְר֑וֹנָ/ה וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/036.yaml
  text: Then Joshua[a], and all Israel with him, went up from Eglon to Hebron, and they fought against it.
translation:
  language: te
  text: అప్పుడు యెహోషువ తనతో ఉన్న ఇశ్రాయేలీయులందరితో కలిసి ఎగ్లోను నుండి హెబ్రోనుకు పైకి వెళ్లాడు. వారు దానికి వ్యతిరేకంగా[a] యుద్ధం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఆమెకు వ్యతిరేకంగా’; స్త్రీలింగ సర్వనామం హెబ్రోను నగరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వెళ్లాడు
  rationale: עלה అనే క్రియలోని పైకి వెళ్లడం అనే దిశాభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: ఇది యెహోషువతో ఉన్న ఇశ్రాయేలు సమూహాన్ని సూచించే సహజమైన తెలుగు సామూహిక ప్రయోగం.
- source_word: עִמּוֹ
  choice: తనతో ఉన్న
  rationale: పుంలింగ ఏకవచన ప్రత్యయం యెహోషువను సూచిస్తుంది; వాక్య నిర్మాణంలో ఇది సహజంగా కలిసిపోతుంది.
- source_word: מֵעֶגְלוֹנָה
  choice: ఎగ్లోను నుండి
  rationale: מן ఉపసర్గ సూచించే బయలుదేరిన స్థలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֶבְרוֹנָה
  choice: హెబ్రోనుకు
  rationale: స్థలనామానికి జతచేసిన దిశాసూచక ה హెబ్రోను వైపు కదలికను సూచిస్తుంది.
- source_word: וַיִּלָּחֲמוּ
  choice: వారు యుద్ధం చేశారు
  rationale: לחם నిఫాల్ రూపం ఇక్కడ యుద్ధంలో తలపడడాన్ని సూచిస్తుంది; ‘యుద్ధం చేశారు’ ప్రస్తుత ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: עָלֶיהָ
  choice: దానిపై
  rationale: על యొక్క వ్యతిరేక భావాన్ని నిలుపుతూ, హెబ్రోను నగరాన్ని సూచించే స్త్రీలింగ ఏకవచన ప్రత్యయాన్ని తెలుగులో జడవాచక సర్వనామంతో సహజంగా వ్యక్తం చేస్తుంది.
