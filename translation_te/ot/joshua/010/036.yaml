revisions:
- from: అప్పుడు యెహోషువ తనతో ఉన్న ఇశ్రాయేలీయులందరితో కలిసి ఎగ్లోను నుండి హెబ్రోనుకు పైకి వెళ్లాడు. వారు దానిపై[a] యుద్ధం చేశారు.
  to: అప్పుడు యెహోషువ తనతో ఉన్న ఇశ్రాయేలీయులందరితో కలిసి ఎగ్లోను నుండి హెబ్రోనుకు పైకి వెళ్లాడు. వారు దానికి వ్యతిరేకంగా[a] యుద్ధం చేశారు.
  rationale: The revision replaces an unnatural rendering of the Hebrew preposition על with an explicit Telugu adversative expression. It also aligns the footnote with that sense while preserving the source’s feminine pronoun and its reference to the city.
