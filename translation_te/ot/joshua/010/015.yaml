  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: te
  text: అప్పుడు యెహోషువ, అతనితోపాటు ఇశ్రాయేలంతా గిల్గాలులోని శిబిరానికి తిరిగి వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గిల్గాలుకు తిరిగి వచ్చినట్లు చెప్పే ఇలాంటి వాక్యం యెహోషువ 10:43లో కూడా ఉంది. కొందరు వ్యాఖ్యాతలు ఈ వచనాన్ని ముందుగా చెప్పబడిన సూచనగా లేదా పాఠంలో స్థానభ్రంశం చెందిన వాక్యంగా భావిస్తారు; అయితే ఇక్కడ హీబ్రూ పాఠం ఉన్నట్లుగానే అనువదించబడింది.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: అప్పుడు ... తిరిగి వచ్చారు
  rationale: שׁוב్ ధాతువు ఇక్కడ వరుస కథన చర్యను సూచించే వయ్యిక్తోల్ రూపంలో ఉంది. ముందున్న స్థలానికి మరలడాన్ని ‘తిరిగి వచ్చారు’ సహజంగా తెలియజేస్తుంది; ‘అప్పుడు’ కథన క్రమాన్ని ఆధునిక తెలుగులో స్పష్టం చేస్తుంది. సంయుక్త కర్తకు అనుగుణంగా బహువచన క్రియ వాడబడింది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: וְכָל יִשְׂרָאֵל
  choice: అతనితోపాటు ఇశ్రాయేలంతా
  rationale: మూలంలోని సమష్టి భావమైన ‘ఇశ్రాయేలంతా’ను నిలుపుతూ, అది సైన్యాన్నా ప్రజలనంతటినీనా అని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: עִמּוֹ
  choice: అతనితోపాటు
  rationale: עם ఉపసర్గకు మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న అర్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֶל הַמַּחֲנֶה
  choice: శిబిరానికి
  rationale: מַחֲנֶה సాధారణంగా, ముఖ్యంగా సైనిక సందర్భంలో, శిబిరాన్ని సూచిస్తుంది; గమ్యార్థక אֶלను ‘-కి’తో తెలిపింది.
- source_word: הַגִּלְגָּלָה
  choice: గిల్గాలులోని
  rationale: స్థలనామంపై ఉన్న దిశార్థక అంత్యం గిల్గాలు వైపు ప్రయాణాన్ని సూచిస్తుంది. ‘గిల్గాలులోని శిబిరానికి’ అనేది తెలుగులో సహజంగా ఉండి మూలంలోని గమ్యస్థాన భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: యెహోషువ 10:43లోని పోలికగల వాక్యంతో ఈ వచనం పునరుక్తిగా కనిపించడం మరియు కథనంలో దాని స్థానం
  choice: మసొరేటిక్ హీబ్రూ పాఠాన్ని ఉన్నట్లుగానే అనువదించడం; వచనాన్ని తొలగించకపోవడం లేదా సమన్వయపరచకపోవడం
  alternative: 10:43లోని సమాన ప్రకటన కారణంగా దీనిని ముందస్తు సూచనగా లేదా పాఠంలో స్థానభ్రంశం చెందిన వాక్యంగా పరిగణించడం
  rationale: ఇది ప్రధానంగా పాఠ్య-సాహిత్య సంబంధమైన ప్రశ్న. అనువాదం మూల హీబ్రూ పాఠాన్ని స్పష్టంగా ప్రతిబింబించాలి; వివరణాత్మక సందేహాన్ని ప్రధాన పాఠంలో పరిష్కరించకుండా పాదసూచికలో తెలియజేయాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన కథన శైలి. ‘ఇశ్రాయేలంతా’ అనే సమష్టి పదప్రయోగం మూలంలోని ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
