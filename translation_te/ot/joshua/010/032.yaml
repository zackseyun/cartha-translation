  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֶת לָכִ֜ישׁ בְּ/יַ֣ד יִשְׂרָאֵ֗ל וַֽ/יִּלְכְּדָ/הּ֙ בַּ/יּ֣וֹם הַ/שֵּׁנִ֔י וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֔רֶב וְ/אֶת כָּל הַ/נֶּ֖פֶשׁ אֲשֶׁר בָּ֑/הּ כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/לִבְנָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
translation:
  language: te
  text: యెహోవా లాకీషును ఇశ్రాయేలు చేతికి అప్పగించాడు. రెండవ రోజున అతడు దాన్ని స్వాధీనం చేసుకొని, కత్తి ధారతో దాన్ని కొట్టి, దానిలో ఉన్న ప్రతి వ్యక్తినీ[a] హతమార్చాడు. అతడు లిబ్నాకు చేసినదంతా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “దానిలో ఉన్న ప్రతి ప్రాణం”; ఇది పట్టణంలో ఉన్న ప్రతి వ్యక్తిని సూచించే ప్రయోగం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: וַיִּתֵּן ... בְּיַד
  choice: చేతికి అప్పగించాడు
  rationale: ‘చేతిలో ఇచ్చాడు’ అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో ఉంచుతూ, మరొకరి అధికారానికి అప్పగించడం అనే భావాన్ని తెలియజేస్తుంది.
- source_word: לָכִישׁ
  choice: లాకీషు
  rationale: హీబ్రూ స్థలనామానికి సమీపంగా ఉండే, తెలుగులో సహజంగా విభక్తులు స్వీకరించే లిప్యంతరీకరణ.
- source_word: וַיִּלְכְּדָהּ
  choice: దాన్ని స్వాధీనం చేసుకొని
  rationale: యుద్ధ సందర్భంలో పట్టణాన్ని పట్టుకోవడం లేదా జయించి ఆధీనంలోకి తెచ్చుకోవడం అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: రెండవ రోజున
  rationale: హీబ్రూలోని కాలసూచనను ‘మరుసటి రోజు’గా వ్యాఖ్యానించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: దానిని ... కత్తితో హతమార్చాడు
  rationale: నכה మరియు ‘కత్తి నోరు/అంచు’ అనే హీబ్రూ యుద్ధప్రయోగం కలిపి సూచించే ప్రాణహరణాన్ని సహజ తెలుగులో తెలియజేస్తుంది; అసహజమైన పదశః రూపాన్ని నివారిస్తుంది.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: దానిలో ఉన్న ప్రతి వ్యక్తిని
  rationale: ఇక్కడ נֶפֶשׁ శరీరానికి వేరైన అమూర్త ‘ఆత్మ’ను కాకుండా పట్టణంలోని మనుషులను సూచిస్తుంది.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלִבְנָה
  choice: అతడు లిబ్నాకు చేసినట్టే లాకీషుకు కూడా చేశాడు
  rationale: హీబ్రూలోని ఏకవచన కర్తను నిలుపుతూ, తెలుగులో పోలికకు సంబంధించిన రెండు పట్టణాలనూ స్పష్టంగా పేర్కొంటుంది.
theological_decisions:
- issue: ఆ పట్టణ నివాసుల హత్యను వర్ణించే జయసూత్రం
  choice: దానిలో ఉన్న ప్రతి వ్యక్తిని
  alternative: దానిలో ఉన్న ప్రతి ప్రాణాన్ని / ప్రతి ఆత్మను
  rationale: మూలంలోని נֶפֶשׁ ఇక్కడ సమష్టిగా మనుషులను సూచిస్తుంది. ‘వ్యక్తి’ అనేది ఆధునిక పాఠకుడికి తప్పుదారి పట్టించే శరీరం–ఆత్మ విభజనను రుద్దకుండా, వృత్తాంతంలోని తీవ్రతను కూడా తగ్గించకుండా ఉంచుతుంది.
- issue: లిబ్నాతో పోల్చే చివరి వాక్యంలో కర్త
  choice: అతడు
  alternative: వారు / అలాగే జరిగింది
  rationale: హీబ్రూ క్రియ ఏకవచనంలో ఉంది; అది యెహోషువను ప్రతినిధి నాయకునిగా సూచించవచ్చు. సందర్భంలో ఇశ్రాయేలు సమూహం చర్యలో పాల్గొన్నప్పటికీ, మూలంలోని ఏకవచన ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన కాని సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. హీబ్రూ వాక్యంలోని పొడవైన సమన్వయ నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం. హింసను మృదువుచేయకుండా ‘హతమార్చాడు’ అని స్పష్టంగా అనువదించాం; చివరి పోలికలోని ఏకవచన కర్తను ఉద్దేశపూర్వకంగా నిలిపాం.
