translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని వరుస సైనిక చర్యలు—ప్రయాణం, మకాం, యుద్ధం—అదే క్రమంలో నిలుపబడ్డాయి. అవసరం లేని పాదటిప్పణులు చేర్చలేదు.
