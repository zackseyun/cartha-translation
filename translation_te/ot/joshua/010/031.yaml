id: JOS.10.31
reference: Joshua 10:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לִּבְנָ֖ה לָכִ֑ישָׁ/ה וַ/יִּ֣חַן עָלֶ֔י/הָ וַ/יִּלָּ֖חֶם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/031.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
translation:
  language: te
  text: తరువాత యెహోషువ, అతనితో ఉన్న ఇశ్రాయేలీయులందరూ, లిబ్నా నుండి లాకీషుకు వెళ్లి, దానికి ఎదురుగా మకాం వేసి, దానితో యుద్ధం చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: వెళ్లి
  rationale: עבר అనే క్రియకు ‘దాటి వెళ్లడం/ముందుకు సాగడం’ అనే విస్తృత భావం ఉంది. ఇక్కడ ఒక పట్టణం నుండి మరొక పట్టణానికి సైనిక కదలికను సహజమైన ఆధునిక తెలుగులో ‘వెళ్లి’ అని వ్యక్తం చేశాం; నీటిమార్గాన్ని దాటారనే అనవసర సూచనను నివారించాం.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: అతనితో ఉన్న ఇశ్రాయేలీయులందరూ
  rationale: సామూహికంగా వాడిన ‘ఇశ్రాయేలు’ ఇక్కడ యెహోషువతో ఉన్న ప్రజలను లేదా సైన్యాన్ని సూచిస్తుంది. తెలుగులో వ్యక్తులను స్పష్టంగా, సహజంగా సూచించేందుకు ‘ఇశ్రాయేలీయులందరూ’ అని ఇచ్చాం.
- source_word: מִלִּבְנָה לָכִישָׁה
  choice: లిబ్నా నుండి లాకీషుకు
  rationale: לָכִישָׁה లోని దిశాసూచక ה లాకీషు వైపు గమనాన్ని సూచిస్తుంది; సందర్భంలో అది గమ్యస్థానం కాబట్టి ‘లాకీషుకు’ సహజమైన సమానార్థకం.
- source_word: וַיִּחַן עָלֶיהָ
  choice: దానికి ఎదురుగా మకాం వేసి
  rationale: חנה అంటే మకాం వేయడం. ముట్టడి సంబంధమైన ఈ సందర్భంలో עַל కేవలం సమీపాన్ని కాక శత్రుత్వపూర్వకంగా పట్టణానికి ఎదురుగా స్థానం ఏర్పరచుకోవడాన్ని సూచిస్తుంది.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: దానితో యుద్ధం చేశారు
  rationale: నిఫాల్ రూపంలోని לחם ‘యుద్ధం చేయడం/పోరాడడం’ అని అర్థం. పట్టణాన్ని స్త్రీలింగ ఏకవచన సర్వనామంతో సూచించిన హీబ్రూ నిర్మాణాన్ని తెలుగులో ‘దానితో’ అని సహజంగా ప్రతిబింబించాం.
