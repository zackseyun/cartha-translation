id: JOS.10.34
reference: Joshua 10:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לָּכִ֖ישׁ עֶגְלֹ֑נָ/ה וַ/יַּחֲנ֣וּ עָלֶ֔י/הָ וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/034.yaml
  text: Then Joshua, and all Israel with him, passed on from Lachish to Eglon; and they camped against it and fought against it.
translation:
  language: te
  text: అప్పుడు యెహోషువ తనతో ఉన్న ఇశ్రాయేలీయులందరితో కలిసి లాకీషు నుండి ఎగ్లోనుకు వెళ్లారు. వారు దానికి ఎదురుగా మకాం వేసి, దానికి వ్యతిరేకంగా యుద్ధం చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: వెళ్లారు
  rationale: עבר అనే క్రియ ఇక్కడ ఒక పట్టణం నుండి మరొక పట్టణానికి సైనిక ప్రయాణాన్ని సూచిస్తుంది; దాటవలసిన నిర్దిష్ట సరిహద్దు లేదా జలాశయం ప్రస్తావించబడలేదు కాబట్టి ‘వెళ్లారు’ సహజంగా ఉంది.
- source_word: עִמּוֹ
  choice: అతనితో ఉన్న
  rationale: యెహోషువతో కలిసి వచ్చిన ఇశ్రాయేలు సమూహాన్ని తెలిపే సహచర్య ప్రయోగం.
- source_word: מִלָּכִישׁ
  choice: లాకీషు నుండి
  rationale: సైనిక ప్రయాణం ప్రారంభమైన స్థలాన్ని מן ఉపసర్గ సూచిస్తుంది.
- source_word: עֶגְלֹנָה
  choice: ఎగ్లోనుకు
  rationale: దిశార్థక ה ప్రత్యయం ఎగ్లోను వైపు గమనాన్ని సూచిస్తుంది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేసి
  rationale: חנה సైనిక సందర్భంలో శిబిరం వేయడాన్ని సూచిస్తుంది; ‘మకాం వేసి’ ఆధునిక తెలుగులో సహజమైన సైనిక ప్రయోగం.
- source_word: עָלֶיהָ
  choice: దానికి ఎదురుగా
  rationale: חנה తో వచ్చిన על ముట్టడి సందర్భంలోని శత్రుత్వపూర్వక స్థాపనను సూచిస్తుంది; కేవలం సమీపంలో ఉండడం కాదు.
- source_word: וַיִּלָּחֲמוּ
  choice: యుద్ధం చేశారు
  rationale: לחם నిఫాల్ రూపం పోరాటంలో పాల్గొనడాన్ని సూచించే సాధారణ హీబ్రూ వ్యక్తీకరణ.
- source_word: עָלֶיהָ
  choice: దానితో
  rationale: לחם తరువాత על ఆ పట్టణాన్ని లక్ష్యంగా చేసుకున్న శత్రుత్వ చర్యను సూచిస్తుంది; తెలుగులో ‘దానితో యుద్ధం చేశారు’ సహజంగా ఉంటుంది.
- source_word: וְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: ‘ఇశ్రాయేలు అంతా’ అనే సామూహిక సూచనను సాధారణ పాఠకులకు సహజంగా, వ్యక్తుల సమూహంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన ప్రవాహం సహజంగా ఉండేలా రెండు వాక్యాలుగా అమర్చబడింది. భావాన్ని అతిగా వివరించకుండా సైనిక సందర్భం స్పష్టంగా ఉంచబడింది.
