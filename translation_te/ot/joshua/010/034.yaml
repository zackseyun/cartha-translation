revisions:
- from: అప్పుడు యెహోషువ, అతనితో ఉన్న ఇశ్రాయేలీయులందరూ లాకీషు నుండి ఎగ్లోనుకు వెళ్లారు. వారు దానికి ఎదురుగా మకాం వేసి, దానితో యుద్ధం చేశారు.
  to: అప్పుడు యెహోషువ తనతో ఉన్న ఇశ్రాయేలీయులందరితో కలిసి లాకీషు నుండి ఎగ్లోనుకు వెళ్లారు. వారు దానికి ఎదురుగా మకాం వేసి, దానికి వ్యతిరేకంగా యుద్ధం చేశారు.
  rationale: The revision corrects the directionality of the second ‘against it’ and slightly improves the Telugu expression of Joshua’s accompaniment by all Israel. It retains the source’s concise campaign narrative and military register.
