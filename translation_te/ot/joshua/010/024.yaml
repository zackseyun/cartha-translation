source:
  edition: WLC
  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
translation:
  language: te
  text: 'ఆ రాజులను యెహోషువ దగ్గరికి బయటకు తీసుకొచ్చినప్పుడు, యెహోషువ ఇశ్రాయేలు పురుషులందరినీ[a] పిలిచాడు. తనతో వెళ్లిన యుద్ధపురుషుల అధికారులతో[b] ఇలా అన్నాడు: “దగ్గరికి రండి; ఈ రాజుల మెడల మీద మీ పాదాలు పెట్టండి.” వారు దగ్గరికి వచ్చి, ఆ రాజుల మెడల మీద తమ పాదాలు పెట్టారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు ప్రతి పురుషుడు.’ ఇక్కడి సైనిక సందర్భంలో సైన్యంతో కూడి ఉన్న పురుషులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యోధుల అధిపతులతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהוֹצִיאָם
  choice: బయటకు తీసుకొచ్చినప్పుడు
  rationale: וַיְהִי + כְּ + క్రియానామ రూపం ఇక్కడ కాలసూచక ఉపవాక్యంగా పనిచేస్తుంది. తెలుగులో సహజంగా ‘...తీసుకొచ్చినప్పుడు’ అని అనువదించడం కథన క్రమాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הַמְּלָכִים הָאֵלֶּה
  choice: ఆ రాజులను / ఈ రాజుల
  rationale: మొదటి ప్రస్తావనలో కథన దూరానికి సహజమైన ‘ఆ రాజులను’ వాడి, యెహోషువ ప్రత్యక్ష ఆజ్ఞలో సమక్ష సూచనను నిలుపుటకు ‘ఈ రాజుల’ అని వాడింది.
- source_word: וַיִּקְרָא ... אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: యెహోషువ ఇశ్రాయేలు పురుషులందరినీ పిలిచాడు
  rationale: כָּל אִישׁ יִשְׂרָאֵל అక్షరార్థంగా ‘ఇశ్రాయేలు ప్రతి పురుషుడు.’ సైనిక సందర్భంలోని పురుషవాచక భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన బహువచన సమష్టి రూపాన్ని ఎంచుకుంది.
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה
  choice: యుద్ధపురుషుల అధికారులు
  rationale: קְצִינֵי నాయకులు లేదా అధికారులు; אַנְשֵׁי הַמִּלְחָמָה అక్షరార్థంగా ‘యుద్ధపు పురుషులు.’ మూలంలోని సైనిక నిర్మాణాన్ని సాధ్యమైనంత స్పష్టంగా నిలిపింది.
- source_word: הֶהָלְכוּא אִתּוֹ
  choice: తనతో వెళ్లిన
  rationale: ఈ సంబంధవాచక భాగం అధికారులను, యెహోషువతో వెళ్లినవారిగా వర్ణిస్తుంది. ‘తనతో వెళ్లిన’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: קִרְבוּ
  choice: దగ్గరికి రండి
  rationale: భౌతికంగా సమీపించమనే ప్రత్యక్ష ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  choice: మెడల మీద మీ పాదాలు పెట్టండి
  rationale: సైనిక అణచివేతను సూచించే మూలంలోని స్పష్టమైన, కఠినమైన చర్యను మృదువుచేయకుండా నిలిపింది.
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  choice: వారు దగ్గరికి వచ్చి ... తమ పాదాలు పెట్టారు
  rationale: వరుసగా వచ్చిన రెండు కథన క్రియలను, ఆజ్ఞకు వెంటనే విధేయత చూపిన క్రమంలో సహజమైన తెలుగులో అందించింది.
- source_word: עַל צַוְּארֵיהֶם
  choice: ఆ రాజుల మెడల మీద
  rationale: హీబ్రూ సర్వనామ ప్రత్యయం రాజులను సూచిస్తుంది. తెలుగులో సంభవించగల సర్వనామ అస్పష్టతను నివారించడానికి సూచిత నామవాచకాన్ని పునరుక్తి చేసింది.
theological_decisions:
- issue: כָּל אִישׁ יִשְׂרָאֵל మరియు אַנְשֵׁי הַמִּלְחָמָה లోని లింగసూచక భాష
  choice: ఇశ్రాయేలు పురుషులందరూ / యుద్ధపురుషులు
  alternative: ఇశ్రాయేలీయులందరూ / సైనికులు
  rationale: ఈ సైనిక సందర్భంలో హీబ్రూ పురుషవాచక రూపాలు నిర్దిష్టంగా యుద్ధంలో పాల్గొన్న పురుషులను సూచిస్తున్నాయి. అందువల్ల వాటిని లింగతటస్థంగా మార్చలేదు.
- issue: రాజుల మెడల మీద పాదాలు పెట్టే జయసూచక చర్య
  choice: ఈ రాజుల మెడల మీద మీ పాదాలు పెట్టండి
  alternative: ఈ రాజులను పూర్తిగా లోబరచుకోండి
  rationale: మూలపాఠం ఒక నిర్దిష్టమైన శారీరక, ప్రతీకాత్మక చర్యను వర్ణిస్తుంది. దానిని కేవలం భావార్థంగా మార్చకుండా, పాఠంలోని కఠినతను మరియు జయసూచక చిత్రాన్ని యథాతథంగా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడింది. ‘యుద్ధపురుషులు’ కొద్దిగా శాస్త్రోచితంగా వినిపించినా, మూలంలోని אַנְשֵׁי הַמִּלְחָמָה నిర్మాణం మరియు పురుషవాచక సైనిక భావాన్ని నిలుపుతుంది. ప్రత్యక్ష ఆజ్ఞ సరళంగా, బలంగా ఉంచబడింది.
