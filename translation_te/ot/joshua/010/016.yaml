  language: te
  text: అయితే ఆ ఐదుగురు రాజులు పారిపోయి, మక్కేదాలోని గుహలో దాక్కున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు ఆ ఐదుగురు రాజులు పారిపోయి, మక్కేదాలోని గుహలో దాక్కున్నారు.”
    reason: కథనారంభంలోని וַ ను వ్యత్యాసార్థకంగా ‘అయితే’ అని కాకుండా సాధారణ కొనసాగింపుగా అనువదించే అవకాశం ఉంది.
lexical_decisions:
- source_word: וַיָּנֻסוּ
  choice: పారిపోయి
  rationale: נוּס ప్రమాదం లేదా ఓటమి నుంచి పారిపోవడాన్ని సూచిస్తుంది; సందర్భానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ఆ ఐదుగురు రాజులు
  rationale: הָאֵלֶּה అనే నిర్దేశక పదం ముందుగా ప్రస్తావించిన నిర్దిష్ట రాజులను సూచిస్తుంది; తెలుగులో వ్యక్తులకు సహజంగా ‘ఐదుగురు’ వాడబడింది.
- source_word: וַיֵּחָבְאוּ
  choice: దాక్కున్నారు
  rationale: חבא యొక్క స్వయంప్రవర్తక భావాన్ని సాధారణ, సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַמְּעָרָה
  choice: గుహలో
  rationale: నిర్దిష్ట గుహను సూచించే హీబ్రూ ఉపపద భావం ‘మక్కేదాలోని గుహ’ అనే నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: בְּמַקֵּדָה
  choice: మక్కేదాలోని
  rationale: స్థల నామాన్ని లిప్యంతరీకరించి, ఆ గుహ మక్కేదా వద్ద లేదా దాని పరిధిలో ఉందనే స్థానిక సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַ
  choice: అయితే
  rationale: వావ్ కథనాన్ని కొనసాగిస్తూనే మునుపటి యుద్ధ దృశ్యం నుంచి రాజుల పారిపోవడంపైకి వచ్చే మార్పును సూచించగలదు; ‘అయితే’ ఆ స్వల్ప వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
