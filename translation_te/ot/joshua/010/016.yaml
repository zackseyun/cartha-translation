  register: ఆధునిక ప్రామాణిక తెలుగులో, కథన శైలికి తగిన గౌరవప్రదమైన సాధారణ భాష వాడబడింది. ‘పారిపోయి’, ‘దాక్కున్నారు’ వంటి రూపాలు మూలంలోని చర్యలను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తాయి.
