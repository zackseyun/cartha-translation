translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని ఉపయోగించాం. ‘ఇలా సమాచారం అందింది’ అనే నిర్మాణం హీబ్రూ కర్మణి నివేదిక భావాన్ని నిలుపుతూ అనవసరమైన కర్తను చేర్చదు. వాక్యానికి గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే భాషను ఎంచుకున్నాం.
