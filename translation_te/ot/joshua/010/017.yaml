source:
  edition: WLC
  text: וַ/יֻּגַּ֖ד לִ/יהוֹשֻׁ֣עַ לֵ/אמֹ֑ר נִמְצְאוּ֙ חֲמֵ֣שֶׁת הַ/מְּלָכִ֔ים נֶחְבְּאִ֥ים בַּ/מְּעָרָ֖ה בְּ/מַקֵּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/017.yaml
  text: And it was reported to Joshua[a], saying, “The five kings have been found hidden in the cave at Makkedah.”
translation:
  language: te
  text: 'యెహోషువకు ఇలా సమాచారం అందింది: “ఆ ఐదుగురు రాజులు మక్కేదాలోని గుహలో దాగి ఉన్నట్లు కనుగొనబడ్డారు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మక్కేదాలోని గుహలో దాక్కొని ఉండగా కనుగొనబడ్డారు.” హీబ్రూ భాగధాతువును క్రియాత్మకంగా (‘దాక్కొని ఉండగా’) లేదా ఒక స్థితిగా (‘దాగి ఉన్నట్లు’) అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: సమాచారం అందింది
  rationale: హీబ్రూ క్రియలోని కర్మణి భావాన్ని నిలుపుతూ, నివేదిక యెహోషువకు చేరిందనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సమాచారం అందించిన వ్యక్తిని అదనంగా చేర్చదు.
- source_word: לִיהוֹשֻׁעַ
  choice: యెహోషువకు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చి, నివేదిక అందుకున్న వ్యక్తిని దత్తి విభక్తితో సూచిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: హీబ్రూ ఉద్ధరణ సూచకమైన ‘చెప్పుతూ’ అనే భావాన్ని, తెలుగులో ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేసే ‘ఇలా’తో వ్యక్తం చేసింది.
- source_word: נִמְצְאוּ
  choice: కనుగొనబడ్డారు
  rationale: מצא క్రియ యొక్క బహువచన కర్మణి రూపాన్ని నిలుపుతుంది; రాజులు అప్పుడే కనుగొనబడ్డారనే నివేదిక భావానికి సరిపోతుంది.
- source_word: חֲמֵשֶׁת הַמְּלָכִים
  choice: ఆ ఐదుగురు రాజులు
  rationale: వ్యక్తులను లెక్కించే సహజ తెలుగు రూపమైన ‘ఐదుగురు’ను వాడి, నిర్దిష్టతను మరియు మునుపు ప్రస్తావించబడిన రాజులనే సూచనను ‘ఆ’తో నిలిపింది.
- source_word: נֶחְבְּאִים
  choice: దాగి ఉన్న స్థితిలో
  rationale: కర్మణి/ఆత్మనేపద భాగధాతువు సూచించే స్థితిని ప్రధాన పాఠ్యంలో స్పష్టంగా, కానీ అతివ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది; క్రియాత్మకమైన ‘దాక్కొని ఉండగా’ అనే భావసంభావ్యతను పాదసూచికలో ఉంచింది.
- source_word: בַּמְּעָרָה
  choice: గుహలో
  rationale: నిర్దిష్ట గుహలోని స్థానాన్ని నేరుగా, సహజంగా తెలుపుతుంది.
- source_word: בְּמַקֵּדָה
  choice: మక్కేదాలోని
  rationale: స్థలపేరును తెలుగు లిపిలో అందించి, ఆ గుహ మక్కేదా ప్రాంతంలో ఉందనే సంబంధాన్ని సహజమైన విశేషణ నిర్మాణంతో తెలియజేస్తుంది.
