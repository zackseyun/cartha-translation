source:
  edition: WLC
  text: עֲלֽוּ אֵלַ֣/י וְ/עִזְרֻ֔/נִי וְ/נַכֶּ֖ה אֶת גִּבְע֑וֹן כִּֽי הִשְׁלִ֥ימָה אֶת יְהוֹשֻׁ֖עַ וְ/אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/004.yaml
  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
translation:
  language: te
  text: “నా దగ్గరకు పైకి రండి, నాకు సహాయం చేయండి. మనం గిబ్యోనుపై దాడి చేద్దాం; ఎందుకంటే అది యెహోషువతోను ఇశ్రాయేలు కుమారులతోను[a] శాంతి చేసుకుంది[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “ఇశ్రాయేలీయులతో,” లేదా “ఇశ్రాయేలు ప్రజలతో.” హీబ్రూలో అక్షరార్థంగా: “ఇశ్రాయేలు కుమారులతో.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఒప్పందం చేసుకుంది,” లేదా “మైత్రి కుదుర్చుకుంది.” హీబ్రూ క్రియ శాంతియుత సంబంధంలోకి లేదా ఒడంబడిక సంబంధంలోకి ప్రవేశించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ אֵלַי
  choice: నా దగ్గరికి వచ్చి
  rationale: עלה అనే క్రియలో పైకి కదలిక భావం ఉన్నప్పటికీ, אֵלַי వల్ల వక్తవైపు రావడం ప్రధానంగా వ్యక్తమవుతుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘నా దగ్గరికి వచ్చి’ అని అనువదించాం; భౌగోళిక ‘పైకి’ భావాన్ని సందర్భం స్పష్టంగా నిర్ధారించనందున బలవంతంగా చేర్చలేదు.
- source_word: וְעִזְרֻנִי
  choice: నాకు సహాయం చేయండి
  rationale: עזר యొక్క బహువచన ఆజ్ఞారూపాన్నీ, మొదటి పురుష ఏకవచన కర్మనూ నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנַכֶּה
  choice: మనం ... దాడి చేద్దాం
  rationale: נכה యొక్క ప్రథమ పురుష బహువచన సంకల్పార్థాన్ని ‘చేద్దాం’ నిలుపుతుంది. యుద్ధ సందర్భంలో ‘దాడి చేయడం’ సహజమైన తెలుగు సమానార్థకం.
- source_word: אֶת גִּבְעוֹן
  choice: గిబ్యోనుపై
  rationale: స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించి, ‘దాడి చేయు’ క్రియకు సహజమైన ‘పై’ విభక్తిని ఉపయోగించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: అభ్యర్థనకు కారణాన్ని పరిచయం చేసే స్పష్టమైన ఆధునిక తెలుగు సంధానపదం.
- source_word: הִשְׁלִימָה
  choice: శాంతి చేసుకుంది
  rationale: שלם హిఫిల్ రూపం ఇక్కడ శాంతియుత లేదా ఒడంబడిక సంబంధంలోకి ప్రవేశించడాన్ని సూచిస్తుంది. ‘శాంతి చేసుకుంది’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది; ‘ఒప్పందం చేసుకుంది’ మరింత నిర్దిష్టమైన వ్యాఖ్యానం.
- source_word: אֶת יְהוֹשֻׁעַ וְאֶת בְּנֵי יִשְׂרָאֵל
  choice: యెహోషువతో, ఇశ్రాయేలు కుమారులతో
  rationale: שלם తో את ఇక్కడ సంబంధంలోకి వచ్చిన పక్షాలను సూచిస్తుంది. בני ישראל అనే కుటుంబాధారిత హీబ్రూ వ్యక్తీకరణను పారదర్శకంగా ‘ఇశ్రాయేలు కుమారులు’గా నిలిపాం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל యొక్క అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు
  rationale: చారిత్రక-జాతీయ సందర్భంలో ఈ పదబంధం సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుంది. అయినప్పటికీ, మూలంలోని పుంలింగ కుటుంబ వ్యక్తీకరణను దాచకుండా ‘ఇశ్రాయేలు కుమారులు’గా ఉంచాం; సహజమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- issue: הִשְׁלִימָה యొక్క దౌత్యపరమైన భావం
  choice: శాంతి చేసుకుంది
  alternative: ఒప్పందం చేసుకుంది; మైత్రి కుదుర్చుకుంది
  rationale: ఈ క్రియ శాంతి సంబంధాన్నీ, ఒడంబడిక శాంతినీ సూచించగలదు. ప్రధాన పాఠ్యంలో విస్తృతమైన అర్థాన్ని ఉంచి, మరింత నిర్దిష్టమైన దౌత్యార్థాన్ని పాదసూచికలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వర్ణనాశైలిని అనుసరించాం. వచనం మధ్యలో మొదలయ్యే ప్రత్యక్ష సంభాషణకు ముగింపుగా సందర్భానుగుణంగా ‘అని చెప్పాడు’ చేర్చాం; అది హీబ్రూ 10:4లో ప్రత్యక్షంగా లేకపోయినా 10:3లోని వాక్య నిర్మాణాన్ని తెలుగులో పూర్తిచేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
