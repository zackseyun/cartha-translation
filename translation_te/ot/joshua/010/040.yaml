id: JOS.10.40
reference: Joshua 10:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה יְהוֹשֻׁ֣עַ אֶת כָּל הָ/אָ֡רֶץ הָ/הָר֩ וְ/הַ/נֶּ֨גֶב וְ/הַ/שְּׁפֵלָ֜ה וְ/הָ/אֲשֵׁד֗וֹת וְ/אֵת֙ כָּל מַלְכֵי/הֶ֔ם לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וְ/אֵ֤ת כָּל הַ/נְּשָׁמָה֙ הֶחֱרִ֔ים כַּ/אֲשֶׁ֣ר צִוָּ֔ה יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/040.yaml
  text: So Joshua struck all the land—the hill country[a], the Negev, the lowland, and the slopes—and all their kings. He left no survivor, but devoted to destruction every breathing thing, just as Yahweh, the God of Israel[b], had commanded.
translation:
  language: te
  text: అలా యెహోషువ కొండప్రాంతం, నెగెవు, దిగువభూమి, కొండవాలులు—ఈ ప్రాంతాలన్నిటిపైనా, వాటి రాజులందరిపైనా దాడి చేశాడు. అతడు ఒక్కరినీ ప్రాణాలతో మిగల్చలేదు; ప్రాణమున్న ప్రతిదానినీ[a] నాశనానికి అంకితం చేశాడు[b]. ఇశ్రాయేలు దేవుడైన యెహోవా ఆజ్ఞాపించినట్టే అతడు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఊపిరిగల ప్రతిదానినీ’ లేదా ‘ఊపిరి పీల్చే ప్రతిదానినీ.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పూర్తిగా నిర్మూలించాడు,’ ‘నిషేధం కింద ఉంచాడు.’ హెబ్రీ క్రియ ఒకదాన్ని తిరుగులేని విధంగా నాశనానికి ప్రత్యేకించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: దాడి చేశాడు
  rationale: נכה అనే క్రియకు యుద్ధ సందర్భంలో ‘కొట్టడం/దెబ్బతీయడం’ అనే బలం ఉంది. ప్రాంతాలనూ రాజులనూ కలిపి కర్మలుగా పేర్కొన్న ఈ వాక్యంలో, ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘దాడి చేశాడు’ అని అనువదించాం; ‘జయించాడు’ అని ఫలితాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: כָּל הָאָרֶץ
  choice: ఈ ప్రాంతాలన్నిటిపైనా
  rationale: אֶרֶץ ఇక్కడ భూమి అంతటినీ కాక, వెంటనే పేర్కొన్న ప్రాంతాల సమష్టిని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో భౌగోళిక జాబితాను స్పష్టంగా సమీక్షించేందుకు ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: הָהָר
  choice: కొండప్రాంతం
  rationale: యెహోషువ గ్రంథంలో ఇది సాధారణంగా ఒక భౌగోళిక ప్రాంతనామం; కేవలం విడివిడి కొండలను కాదు.
- source_word: הַנֶּגֶב
  choice: నెగెవు
  rationale: ఇక్కడ దక్షిణ దిశ మాత్రమే కాక, దక్షిణాన ఉన్న నిర్దిష్ట అర్ధశుష్క ప్రాంతం ఉద్దేశించబడింది; అందువల్ల ప్రాంతనామాన్ని లిప్యంతరీకరించాం.
- source_word: הַשְּׁפֵלָה
  choice: దిగువభూమి
  rationale: కొండప్రాంతానికీ తీరప్రాంతానికీ మధ్యనున్న నిమ్న ప్రాంతాన్ని సాధారణ పాఠకులకు అర్థమయ్యే తెలుగులో తెలిపే పదం.
- source_word: הָאֲשֵׁדוֹת
  choice: కొండవాలులు
  rationale: אֲשֵׁדוֹת వాలులు లేదా దిగువకు జారే భూభాగాలను సూచిస్తుంది; భౌగోళిక జాబితాలో ‘కొండవాలులు’ స్పష్టంగా ఉంటుంది.
- source_word: כָּל מַלְכֵיהֶם
  choice: వాటి రాజులందరిపైనా
  rationale: ప్రస్తావించిన ప్రాంతాలకు చెందిన రాజులందరినీ సూచించే సంబంధాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: ఒక్కరినీ ప్రాణాలతో మిగల్చలేదు
  rationale: సైనిక సందర్భంలో שָׂרִיד అంటే ప్రాణాలతో మిగిలినవాడు. ఈ తెలుగు రూపం భావాన్ని సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: כָּל הַנְּשָׁמָה
  choice: ప్రాణమున్న ప్రతిదానినీ
  rationale: అక్షరార్థంగా ‘ఊపిరిగల ప్రతిదీ’ అనే హెబ్రీ నుడికారాన్ని కేవలం ‘ప్రతి వ్యక్తి’గా సంకుచితం చేయకుండా, దాని విస్తృతతనూ తీవ్రతనూ నిలిపింది.
- source_word: הֶחֱרִים
  choice: నాశనానికి అంకితం చేశాడు
  rationale: חרם హిఫీల్ రూపం ఒకదాన్ని తిరుగులేని విధంగా నాశనానికి ప్రత్యేకించడం అనే మతపరమైన-యుద్ధపరమైన భావాన్ని కలిగి ఉంది. కేవలం ‘నాశనం చేశాడు’ కంటే ఈ భావాన్ని ప్రధాన పాఠం నిలుపుతుంది.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినట్టే
  rationale: యెహోషువ చర్య ముందుగా ఇచ్చిన దైవాజ్ఞకు సరిగ్గా అనుగుణమైందని తెలిపే పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో అందించాం.
theological_decisions:
- issue: חרם అనే యుద్ధ-ఆరాధనా పదబంధం
  choice: నాశనానికి అంకితం చేశాడు
  alternative: పూర్తిగా నిర్మూలించాడు; నిషేధం కింద ఉంచాడు
  rationale: మూలంలోని పదం సాధారణ సైనిక నాశనం కంటే మతపరంగా తిరుగులేని సమర్పణ/విధ్వంస భావాన్ని కలిగి ఉంది. ఎంపిక చేసిన రూపం దాని కఠినతను మెత్తబరచకుండా, దాని ప్రత్యేక ధార్మిక ఛాయను నిలుపుతుంది.
- issue: כָּל הַנְּשָׁמָה పరిధి
  choice: ప్రాణమున్న ప్రతిదానినీ
  alternative: ప్రతి వ్యక్తినీ; ఊపిరిగల ప్రతిదానినీ
  rationale: మూలంలోని విస్తృత నుడికారాన్ని ‘మనుషులు’ అని మాత్రమే పరిమితం చేయకుండా అలాగే ఉంచాం; ‘ఊపిరిగల ప్రతిదీ’ అనే మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: దైవాజ్ఞతో హింసకు ఉన్న సంబంధం
  choice: ఇశ్రాయేలు దేవుడైన యెహోవా ఆజ్ఞాపించినట్టే అతడు చేశాడు
  alternative: ఇశ్రాయేలు దేవుడైన యెహోవా ఆజ్ఞాపించిన ప్రకారం
  rationale: మూలపాఠం చర్యను దైవాజ్ఞతో నేరుగా అనుసంధానిస్తుంది. దానిని సమర్థించే అదనపు వివరణనూ, దాని తీవ్రతను తగ్గించే వ్యాఖ్యానాన్నీ అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. భౌగోళిక పదాలను అవసరమైన చోట అర్థానువాదం చేసి, నిర్దిష్ట ప్రాంతనామమైన ‘నెగెవు’ను లిప్యంతరీకరించాం. హింసాత్మక మరియు ధార్మిక పదజాలంలోని తీవ్రతను తగ్గించలేదు; సాంకేతిక పదాలతో పాఠాన్ని అస్పష్టమూ చేయలేదు. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
