id: JOS.10.5
reference: Joshua 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּאָסְפ֨וּ וַֽ/יַּעֲל֜וּ חֲמֵ֣שֶׁת מַלְכֵ֣י הָ/אֱמֹרִ֗י מֶ֣לֶךְ יְרוּשָׁלִַ֜ם מֶֽלֶךְ חֶבְר֤וֹן מֶֽלֶךְ יַרְמוּת֙ מֶֽלֶךְ לָכִ֣ישׁ מֶֽלֶךְ עֶגְל֔וֹן הֵ֖ם וְ/כָל מַֽחֲנֵי/הֶ֑ם וַֽ/יַּחֲנוּ֙ עַל גִּבְע֔וֹן וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
translation:
  language: te
  text: అప్పుడు అమోరీయుల ఐదుగురు రాజులు—యెరూషలేము రాజు, హెబ్రోను రాజు, యర్మూతు రాజు, లాకీషు రాజు, ఎగ్లోను రాజు—తమ సైన్యాలన్నిటితో[a] సమకూడి పైకి వెళ్లారు. వారు గిబియోనుకు ఎదురుగా మకాం వేసి దానిపై యుద్ధం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తమ శిబిరాలన్నిటితో.” ఇక్కడ “శిబిరాలు” అనేది అక్కడున్న సైనిక దళాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: సమకూడి
  rationale: నిఫాల్ రూపంలోని సమష్టిగా కూడడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; అధికారిక కూటమి కట్టారని అదనంగా వ్యాఖ్యానించదు.
- source_word: וַיַּעֲלוּ
  choice: పైకి వెళ్లారు
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం’ భావాన్ని, అది భౌగోళిక ఎత్తునో దిశను సూచించే సంప్రదాయ ప్రయోగమో తేల్చకుండా సంరక్షిస్తుంది.
- source_word: חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי
  choice: అమోరీయుల ఐదుగురు రాజులు
  rationale: మూలంలోని సంఖ్యనూ జాతి గుర్తింపునూ స్పష్టంగా ఉంచుతుంది.
- source_word: מֶלֶךְ יְרוּשָׁלִַם ... מֶלֶךְ עֶגְלוֹן
  choice: యెరూషలేము రాజు ... ఎగ్లోను రాజు
  rationale: హీబ్రూలో ప్రతి పాలకుని ముందు పునరావృతమైన ‘రాజు’ అనే పదాన్ని కుదించకుండా నిలుపుతుంది.
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  choice: తమ సైన్యాలన్నిటితో
  rationale: మַחֲנֶה అక్షరార్థంగా ‘శిబిరం’ అయినా ఈ సైనిక సందర్భంలో శిబిరంలోని దళాలను సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ‘సైన్యాలు’ వాడి, అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  choice: గిబియోనుకు ఎదురుగా మకాం వేసి
  rationale: తదుపరి యుద్ధ చర్యను బట్టి עַל ఇక్కడ కేవలం స్థలసామీప్యాన్ని కాక ప్రతికూల సైనిక స్థితిని సూచిస్తుంది.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: దానిపై యుద్ధం చేశారు
  rationale: స్త్రీలింగ ప్రత్యయం గిబియోను పట్టణాన్ని సూచిస్తుంది; తెలుగులో పట్టణానికి సహజంగా ‘దాని’ అనే సర్వనామం వాడబడింది.
