translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. రాజుల జాబితాలో మూలంలోని పునరుక్తిని నిలిపి, ‘పైకి వెళ్లారు’ ద్వారా భౌగోళిక లేదా దిశాసంబంధమైన అస్పష్టతను పరిష్కరించకుండా ఉంచింది.
