  to: అప్పుడు యెహోషువ, “గుహ ద్వారాన్ని తెరవండి; ఆ ఐదుగురు రాజులను గుహలోనుండి బయటకు తీసుకువచ్చి నా దగ్గరికి తీసుకురండి” అని చెప్పాడు.
