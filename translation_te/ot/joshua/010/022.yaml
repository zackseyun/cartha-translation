translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ ‘గుహ నోరు’ అనే రూపకాన్ని తెలుగులో సహజమైన ‘గుహ ద్వారం’గా అందించాం. ఇచ్చిన English POBలో పాదసూచిక గుర్తులు వాటి పాఠ్యాలతో పరస్పరం తారుమారైనట్లు కనిపించినందున, మూల హీబ్రూలో ప్రత్యేక ప్రత్యామ్నాయ పఠనం లేని ఈ వచనానికి పాదసూచికలు చేర్చలేదు.
