  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ פִּתְח֖וּ אֶת פִּ֣י הַ/מְּעָרָ֑ה וְ/הוֹצִ֣יאוּ אֵלַ֗/י אֶת חֲמֵ֛שֶׁת הַ/מְּלָכִ֥ים הָ/אֵ֖לֶּה מִן הַ/מְּעָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/022.yaml
  text: Then Joshua said[a], “Open the mouth of the cave[b], and bring those five kings out of the cave to me.”
translation:
  language: te
  text: అప్పుడు యెహోషువ, “గుహ ద్వారాన్ని తెరవండి; ఆ ఐదుగురు రాజులను గుహలోనుండి బయటకు తీసుకువచ్చి నా దగ్గరికి తీసుకురండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన శైలిలో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తిపేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: פִּתְחוּ
  choice: తెరిచి
  rationale: బహువచన ఆజ్ఞారూపంలోని ‘తెరవండి’ భావాన్ని, వెంట వచ్చే సమన్విత ఆజ్ఞతో సహజమైన తెలుగు వాక్యంగా కలుపుతుంది.
- source_word: פִּי הַמְּעָרָה
  choice: గుహ ద్వారాన్ని
  rationale: అక్షరార్థంగా ‘గుహ నోరు’; తెలుగులో స్థల ప్రవేశాన్ని సూచించేందుకు ‘గుహ ద్వారం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְהוֹצִיאוּ
  choice: బయటకు తీసుకురండి
  rationale: హిఫిల్ ఆజ్ఞారూపం లోపలి నుండి వెలుపలికి తీసుకురావడం అనే కారణార్థక చలనాన్ని తెలియజేస్తుంది.
- source_word: אֵלַי
  choice: నా దగ్గరికి
  rationale: యెహోషువ వైపుకు చలనాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ఆ ఐదుగురు రాజులను
  rationale: ఇప్పటికే సందర్భంలో గుర్తించబడిన నిర్దిష్ట వ్యక్తులను సూచించేందుకు ‘ఆ’ సహజం; వ్యక్తులకు ‘ఐదుగురు’ వాడటం తెలుగు వ్యాకరణానికి తగినది.
- source_word: מִן הַמְּעָרָה
  choice: గుహలోనుండి
  rationale: తొలగింపు ప్రారంభస్థానాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘బయటకు’తో కలిసి చలన దిశను సంపూర్ణంగా వ్యక్తపరుస్తుంది.
