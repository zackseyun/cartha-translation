  to: అప్పుడు సూర్యుడు నిలిచిపోయాడు[a], చంద్రుడు ఆగిపోయాడు—ఆ జాతి తన శత్రువులపై ప్రతీకారం తీర్చుకునే వరకు. ఇది యాషారు గ్రంథంలో[b] రాయబడి ఉంది కదా? సూర్యుడు ఆకాశం మధ్యలో నిలిచిపోయి, అస్తమించడానికి తొందరపడలేదు[d]—దాదాపు ఒక పూర్తిరోజు పాటు[c].
