id: JOS.10.13
reference: Joshua 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּדֹּ֨ם הַ/שֶּׁ֜מֶשׁ וְ/יָרֵ֣חַ עָמָ֗ד עַד יִקֹּ֥ם גּוֹי֙ אֹֽיְבָ֔י/ו הֲ/לֹא הִ֥יא כְתוּבָ֖ה עַל סֵ֣פֶר הַ/יָּשָׁ֑ר וַ/יַּעֲמֹ֤ד הַ/שֶּׁ֨מֶשׁ֙ בַּ/חֲצִ֣י הַ/שָּׁמַ֔יִם וְ/לֹא אָ֥ץ לָ/ב֖וֹא כְּ/י֥וֹם תָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
translation:
  language: te
  text: అప్పుడు సూర్యుడు నిలిచిపోయాడు[a], చంద్రుడు ఆగిపోయాడు—ఆ జాతి తన శత్రువులపై ప్రతీకారం తీర్చుకునే వరకు. ఇది యాషారు గ్రంథంలో[b] రాయబడి ఉంది కదా? సూర్యుడు ఆకాశం మధ్యలో నిలిచిపోయి, అస్తమించడానికి తొందరపడలేదు[d]—దాదాపు ఒక పూర్తిరోజు పాటు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సూర్యుడు నిశ్చలంగా ఉన్నాడు.” హీబ్రూ క్రియకు ‘నిశ్శబ్దంగా ఉండడం’ లేదా ‘కదలకుండా ఉండడం’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “యాషారు గ్రంథం”; దీనిని “న్యాయమైనవారి గ్రంథం” లేదా “యథార్థవంతుల గ్రంథం” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా, “ఒక పూర్తి రోజులాగా” లేదా “దాదాపు ఒక పూర్తిరోజు.”
    reason: lexical_alternative
  - marker: d
    text: అక్షరార్థంగా, “వెళ్లడానికి తొందరపడలేదు”; సూర్యుని విషయంలో ఇది అస్తమించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדֹּם הַשֶּׁמֶשׁ
  choice: సూర్యుడు నిలిచిపోయాడు
  rationale: דמם అనే క్రియకు ‘నిశ్శబ్దంగా ఉండు’ లేదా ‘కదలకుండా ఉండు’ అనే అర్థాలు ఉన్నాయి. చంద్రుడు ఆగిపోయాడనే సమాంతర వాక్యం, ఖగోళ సందర్భం దృష్ట్యా ‘నిలిచిపోయాడు’ సహజంగా భావాన్ని తెలియజేస్తుంది.
- source_word: וְיָרֵחַ עָמָד
  choice: చంద్రుడు ఆగిపోయాడు
  rationale: עמד అక్షరార్థంగా ‘నిలిచాడు’; ఇక్కడ ఖగోళ వస్తువు కదలిక నిలిచిందనే భావాన్ని ఆధునిక తెలుగులో ‘ఆగిపోయాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  choice: ఆ జనము తన శత్రువులపై ప్రతీకారం తీర్చుకునే వరకు
  rationale: ఈ ప్రయోగంలో נקם భావం ప్రతీకారం లేదా న్యాయపరమైన ప్రతిఫలం తీర్చుకోవడాన్ని సూచిస్తుంది. גוי కి సందర్భానుగుణంగా, సామూహిక ఏకవచనాన్ని నిలుపుతూ ‘ఆ జనము’ అని అనువదించబడింది.
- source_word: הֲלֹא הִיא כְתוּבָה
  choice: ఇది ... రాయబడి ఉంది కదా?
  rationale: ప్రశ్నారూపంలోని ధృవీకరణ భావాన్ని సహజమైన తెలుగు నిర్మాణంతో నిలుపుతుంది; స్త్రీలింగ సర్వనామం ముందున్న వృత్తాంతం లేదా కవితా పంక్తిని సూచిస్తుందని భావించబడింది.
- source_word: סֵפֶר הַיָּשָׁר
  choice: యాషారు గ్రంథం
  rationale: ఇది ఒక మూలగ్రంథపు శీర్షిక కావడంతో יָשָׁר ను అర్థానువాదం చేయకుండా పేరుగా లిప్యంతరీకరించాం; అర్థానువాదాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: בַּחֲצִי הַשָּׁמַיִם
  choice: ఆకాశం నడిమధ్యలో
  rationale: అక్షరార్థంలోని ‘ఆకాశాల మధ్య/సగంలో’ అనే స్థలభావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא אָץ לָבוֹא
  choice: అస్తమించడానికి తొందరపడలేదు
  rationale: సూర్యునితో בוא అస్తమయాన్ని సూచించే సందర్భోచిత ప్రయోగం. తెలుగులో సూచిత గమ్యాన్ని స్పష్టంచేస్తూ సహజంగా అనువదించాం.
- source_word: כְּיוֹם תָּמִים
  choice: దాదాపు ఒక పూర్తి రోజు
  rationale: תמים ‘పూర్తి/సంపూర్ణ’ అని, כְּ పోలిక లేదా సుమారు పరిమాణాన్ని సూచించగలదు. కాలవ్యవధిని అతిగా ఖచ్చితపరచకుండా ఈ అనువాదం మూలంలోని సడలింపును నిలుపుతుంది.
theological_decisions:
- issue: ఖగోళ అద్భుతం యొక్క స్వరూపం
  choice: సూర్యుడు, చంద్రుడు ఆగిపోయినట్లు వచనం చెప్పే అసాధారణ సంఘటనను నేరుగా అనువదించడం
  alternative: దాన్ని కేవలం పరిశీలకుడికి కనిపించిన విధంగా లేదా కవితాత్మక రూపకంగా మాత్రమే వివరించడం
  rationale: కథనం దీనిని అసాధారణ సంఘటనగా సమర్పించి ఒక లిఖిత మూలాన్ని ప్రస్తావిస్తుంది. అనువాదం ఆధునిక శాస్త్రీయ సమన్వయాన్ని చొప్పించకూడదు; అలాగే వచనాన్ని రూపకానికి మాత్రమే పరిమితం చేయకూడదు.
- issue: יִקֹּם ప్రయోగంలోని ప్రతీకారం/న్యాయనిర్ణయ భావం
  choice: ప్రతీకారం తీర్చుకునే వరకు
  alternative: తన శత్రువులపై తనకు న్యాయం జరిగే వరకు
  rationale: మూల ప్రయోగం ప్రతీకారం మరియు న్యాయపరమైన సమర్థన మధ్య భావవ్యాప్తి కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యంలో సహజమైన అర్థాన్ని ఇచ్చి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి ఉపయోగించబడింది. ఖగోళ సంఘటనను సహజీకరించకుండా మూలంలోని అసాధారణ వాదన నిలుపబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా ఉంచబడ్డాయి.
