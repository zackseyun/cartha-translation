- from: వారు ఆ రోజే దాన్ని స్వాధీనం చేసుకొని, ఖడ్గపు అంచుతో దాన్ని హతమార్చారు. దానిలో ఉన్న ప్రతి వ్యక్తినీ[a] ఆ రోజే అతడు నాశనానికి అంకితం చేశాడు[b]. లాకీషుకు తాను చేసినదంతా దీనికీ చేశాడు.
  to: వారు ఆ రోజే దానిని స్వాధీనం చేసుకొని, ఖడ్గధారతో దానిని కొట్టారు. దానిలో ఉన్న ప్రతి వ్యక్తినీ[a] ఆ రోజే అతడు నాశనానికి అంకితం చేశాడు[b]. లాకీషుకు చేసినట్లే దీనికీ చేశాడు.
  rationale: నగరంపై జరిగే యుద్ధచర్యను తెలుగులో సహజంగా వ్యక్తపరచడానికి ‘హతమార్చారు’ స్థానంలో ‘ఖడ్గధారతో దానిని కొట్టారు’ అని మార్చాం. మూలంలోని బహువచన-ఏకవచన కర్తల మార్పును, నెఫెష్‌కు ‘వ్యక్తి’ అనే సందర్భార్థాన్ని, మరియు హేరెమ్‌కు సంబంధించిన ‘నాశనానికి అంకితం’ అనే సాంకేతిక భావాన్ని కాపాడాం. చివరి వాక్యాన్ని మూలంలోని పోలికకు మరింత దగ్గరగా చేశాం.
