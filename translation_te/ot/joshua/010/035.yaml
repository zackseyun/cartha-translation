source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֜וּ/הָ בַּ/יּ֤וֹם הַ/הוּא֙ וַ/יַּכּ֣וּ/הָ לְ/פִי חֶ֔רֶב וְ/אֵת֙ כָּל הַ/נֶּ֣פֶשׁ אֲשֶׁר בָּ֔/הּ בַּ/יּ֥וֹם הַ/ה֖וּא הֶחֱרִ֑ים כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/לָכִֽישׁ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
translation:
  language: te
  text: వారు ఆ రోజే దానిని స్వాధీనం చేసుకొని, ఖడ్గధారతో దానిని కొట్టారు. దానిలో ఉన్న ప్రతి వ్యక్తినీ[a] ఆ రోజే అతడు నాశనానికి అంకితం చేశాడు[b]. లాకీషుకు చేసినట్లే దీనికీ చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘దానిలో ఉన్న ప్రతి నెఫెష్‌.’ ఇక్కడ ఆ పదం నగరంలో ఉన్న వ్యక్తులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పూర్తిగా నాశనం చేశాడు.’ హీబ్రూ క్రియ ఒకదాన్ని హేరెమ్‌ (నిషేధం) కింద నాశనానికి అంకితం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: దాన్ని స్వాధీనం చేసుకొని
  rationale: לכד అనే క్రియ యుద్ధ సందర్భంలో పట్టణాన్ని పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘స్వాధీనం చేసుకొని’ సహజంగా ఉండి సైనిక విజయ భావాన్ని నిలుపుతుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజే
  rationale: హీబ్రూ కాలవాచక పదబంధాన్ని సహజ తెలుగులో అందిస్తూ, అదే రోజున జరిగినదనే ఉద్ఘాటనను ‘ఏ’ నిలుపుతుంది.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: ఖడ్గపు అంచుతో దాన్ని హతమార్చారు
  rationale: לְפִי חֶרֶב అక్షరార్థంగా ‘ఖడ్గపు నోరు/అంచు’ అనే హీబ్రూ రూపకం. ‘ఖడ్గపు అంచుతో’ ఆ చిత్రాన్ని నిలుపుతుంది; నగరాన్ని సూచించే స్త్రీలింగ ఏకవచన సర్వనామాన్ని ‘దాన్ని’గా ఉంచి, దాని ప్రజలను హతమార్చారనే సందర్భార్థాన్ని అతిగా విప్పలేదు.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: దానిలో ఉన్న ప్రతి వ్యక్తినీ
  rationale: ఇక్కడ נֶפֶשׁ శరీరానికి వేరైన ఆత్మను కాక నగరంలో ఉన్న జీవించే వ్యక్తిని సూచిస్తుంది. ‘ప్రతి వ్యక్తినీ’ స్పష్టంగా, సిద్ధాంతపరమైన అదనపు అర్థం లేకుండా ఉంటుంది.
- source_word: הֶחֱרִים
  choice: నాశనానికి అంకితం చేశాడు
  rationale: חרם హిఫీల్ రూపం సాధారణంగా చంపడాన్ని మాత్రమే కాక, నిషేధం కింద నాశనానికి ప్రతిష్ఠించడం అనే ప్రత్యేక యుద్ధ-మతపరమైన భావాన్ని కలిగి ఉంది. ఈ అనువాదం ఆ ప్రత్యేక భావాన్ని సాధ్యమైనంత సహజంగా నిలుపుతుంది.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלָכִישׁ
  choice: లాకీషుకు తాను చేసినదంతా దీనికీ చేశాడు
  rationale: లాకీషు విషయంలో జరిగిన చర్యతో సంపూర్ణ పోలికను సహజ తెలుగులో తెలియజేస్తుంది; עָשָׂה ఏకవచన రూపాన్ని ‘చేశాడు’గా నిలుపుతుంది.
theological_decisions:
- issue: యుద్ధ సందర్భంలో חרם/החרים పదం అనువాదం
  choice: నాశనానికి అంకితం చేశాడు
  alternative: పూర్తిగా నాశనం చేశాడు; నిషేధం కింద ఉంచాడు
  rationale: ఈ క్రియలో సాధారణ విధ్వంసాన్ని మించిన, నాశనానికి ప్రత్యేకంగా అప్పగించే భావం ఉంది. ప్రధాన పాఠ్యంలో దాన్ని నిలుపుతూ, ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చలేదు.
- issue: జనాభాను సూచించే సందర్భంలో נֶפֶשׁ అనువాదం
  choice: వ్యక్తి
  alternative: ప్రాణి; ఆత్మ
  rationale: ఈ సందర్భంలో పదం నగరంలోని మనుషులను సూచిస్తుంది. ‘ఆత్మ’ అనడం మూలపాఠ్యం ఉద్దేశించని మానవ స్వభావ సిద్ధాంతాన్ని సూచించవచ్చు.
- issue: బహువచన చర్యల నుంచి ఏకవచన కర్తకు మార్పు
  choice: వారు… అతడు… తాను… చేశాడు
  alternative: అన్ని క్రియలనూ బహువచనంలో ‘వారు’ అని అనువదించడం
  rationale: וַיִּלְכְּדוּהָ, וַיַּכּוּהָ బహువచనాలు; הֶחֱרִים, עָשָׂה పురుష ఏకవచనాలు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక వ్యాకరణ మార్పును నిలిపాం. సందర్భంలో ‘అతడు’ యెహోషువను సూచించినా, మూలంలో ఈ వాక్యంలో పేరు లేకపోవడంతో ప్రధాన పాఠ్యంలో పేరును చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ఖడ్గపు అంచు’ ద్వారా హీబ్రూ రూపకాన్ని నిలిపి, חרם సాంకేతిక భావానికి ‘నాశనానికి అంకితం చేశాడు’ అన్న పదబంధాన్ని ఎంచుకున్నాం. మూలంలోని బహువచనం నుంచి ఏకవచనానికి మార్పును స్పష్టంగా కాపాడాం.
