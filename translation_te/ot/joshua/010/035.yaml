  source_fidelity: మూల హీబ్రూలో మొదటి రెండు క్రియలు బహువచనంలోను (వారు పట్టుకున్నారు, కొట్టారు), తరువాతి క్రియలు పురుష ఏకవచనంలోను ఉన్నాయి (అతడు నాశనానికి అంకితం చేశాడు; లాకీషుకు చేసినట్లు చేశాడు). ఈ వ్యాకరణ మార్పును ముసాయిదా సరిగ్గా కాపాడింది. అయితే నగరాన్ని ‘హతమార్చారు’ అనడం తెలుగులో అర్థపరంగా అసహజం; హీబ్రూ యుద్ధ-ప్రయోగాన్ని ‘ఖడ్గధారతో కొట్టారు’గా ఉంచడం మరింత విశ్వసనీయమైనది. చివరి పోలికను కూడా ‘లాకీషుకు చేసినట్లే’ అని స్పష్టంగా అనువదించాలి.
  naturalness: ‘ఖడ్గపు అంచుతో దాన్ని హతమార్చారు’లో ‘హతమార్చారు’ సాధారణంగా వ్యక్తులకు వర్తిస్తుంది; నగరానికి వర్తించినప్పుడు తెలుగులో అసహజంగా ఉంటుంది. ‘ఖడ్గధారతో దానిని కొట్టారు’ హీబ్రూ రూపకాన్ని, యుద్ధసందర్భాన్ని నిలుపుతూ సహజంగా ఉంటుంది. ‘లాకీషుకు తాను చేసినదంతా దీనికీ చేశాడు’ కన్నా ‘లాకీషుకు చేసినట్లే దీనికీ చేశాడు’ ఆధునిక తెలుగులో స్పష్టమైన పోలికను ఇస్తుంది.
  terminology: ‘ప్రతి వ్యక్తినీ’ נֶפֶשׁ యొక్క సందర్భార్థానికి సరైనది. ‘నాశనానికి అంకితం చేశాడు’ הֶחֱרִים యొక్క సాంకేతిక భావాన్ని తగినంతగా కాపాడుతుంది. ప్రత్యామ్నాయ పాదటిప్పణిలో ‘నిషేధం కింద’ అనే మాటను ‘హేరెమ్/నిషేధం కింద’గా స్పష్టం చేయడం పదార్థాన్ని మరింత పారదర్శకంగా చేస్తుంది.
