  naturalness: పేర్లు మరియు దత్తి రూపాల జాబితా చదవడానికి సహజంగానే ఉంది. ‘సందేశం పంపాడు’ అనేది ఈ సందర్భంలో ‘కబురు పంపాడు’ కంటే ప్రామాణిక కథన రిజిస్టర్‌కు మెరుగైన ఎంపిక.
