translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన కథనశైలి పాటించబడింది. వరుసగా వచ్చే రాజుల జాబితిని చదవడానికి సులభంగా ‘స్థలం రాజైన వ్యక్తి’ నిర్మాణంలో ఉంచాం. పేర్లన్నీ అనువదించకుండా మూల హీబ్రూకు దగ్గరగా లిప్యంతరీకరించాం; ఈ వచనానికి పాదటిప్పణులు అవసరం లేదు.
