id: JOS.10.3
reference: Joshua 10:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֲדֹנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם אֶל הוֹהָ֣ם מֶֽלֶךְ חֶ֠בְרוֹן וְ/אֶל פִּרְאָ֨ם מֶֽלֶךְ יַרְמ֜וּת וְ/אֶל יָפִ֧יעַ מֶֽלֶךְ לָכִ֛ישׁ וְ/אֶל דְּבִ֥יר מֶֽלֶךְ עֶגְל֖וֹן לֵ/אמֹֽר־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/003.yaml
  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: te
  text: 'అప్పుడు యెరూషలేము రాజైన అదోనీ-సెదెకు, హెబ్రోను రాజైన హోహాముకు, యర్మూతు రాజైన పిరాముకు, లాకీషు రాజైన యాఫీయకు, ఎగ్లోను రాజైన దెబీరుకు ఇలా సందేశం పంపాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... కబురు పంపాడు
  rationale: שׁלח క్రియ యొక్క సాధారణ అర్థం ‘పంపు’; తరువాత వచ్చే לֵאמֹר‌తో కలిసి ఇది సందేశం పంపడాన్ని సూచిస్తుంది. వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది కాబట్టి సహజమైన తెలుగు కథనశైలిలో ‘అప్పుడు’ వాడబడింది.
- source_word: אֲדֹנִי צֶדֶק
  choice: అదోనీ-సెదెకు
  rationale: వ్యక్తి పేరును అనువదించకుండా తెలుగు ధ్వన్యనుకరణలో ఇచ్చి, సంయుక్త నామ నిర్మాణాన్ని సూచించేందుకు హైఫన్ ఉంచబడింది.
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: యెరూషలేము రాజైన
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంతో తెలిపింది; స్థలపేరు సుపరిచిత తెలుగు రూపంలో లిప్యంతరీకరించబడింది.
- source_word: הוֹהָם
  choice: హోహాము
  rationale: వ్యక్తి పేరుకు మూల హీబ్రూ ఉచ్చారణను అనుసరించిన తెలుగు లిప్యంతరీకరణ.
- source_word: חֶבְרוֹן
  choice: హెబ్రోను
  rationale: స్థలపేరుకు సుపరిచిత తెలుగు లిప్యంతరీకరణ.
- source_word: פִּרְאָם
  choice: పిరాము
  rationale: వ్యక్తి పేరును అర్థానువాదం చేయకుండా లిప్యంతరీకరించింది.
- source_word: יַרְמוּת
  choice: యర్మూతు
  rationale: స్థలపేరును మూల రూపానికి దగ్గరగా తెలుగు లిపిలో ఇచ్చింది.
- source_word: יָפִיעַ
  choice: యాఫీయ
  rationale: వ్యక్తి పేరును హీబ్రూ ధ్వనులకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: לָכִישׁ
  choice: లాకీషు
  rationale: స్థలపేరుకు మూల హీబ్రూ రూపాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ.
- source_word: דְּבִיר
  choice: దెబీరు
  rationale: ఇక్కడ సందర్భం సాధారణ నామవాచకాన్ని కాక రాజు పేరును సూచిస్తుంది; అందువల్ల వ్యక్తి పేరుగా లిప్యంతరీకరించబడింది.
- source_word: עֶגְלוֹן
  choice: ఎగ్లోను
  rationale: స్థలపేరును తెలుగు ధ్వన్యనుకరణలో ఇచ్చింది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: అక్షరార్థంగా ‘చెప్పుతూ’ అయినా, తరువాత ప్రత్యక్ష సందేశం ప్రారంభమవుతుందని సహజ ఆధునిక తెలుగులో ‘ఇలా’ మరియు ద్విబిందువుతో సూచించబడింది.
