  to: 'అప్పుడు యెరూషలేము రాజైన అదోనీ-సెదెకు, హెబ్రోను రాజైన హోహాముకు, యర్మూతు రాజైన పిరాముకు, లాకీషు రాజైన యాఫీయకు, ఎగ్లోను రాజైన దెబీరుకు ఇలా సందేశం పంపాడు:'
