  source_fidelity: 'The draft accurately conveys the sequence: Joshua commands at sundown, the five kings are removed from the trees, thrown into the cave in which they had hidden, and large stones are set at the cave entrance. It appropriately preserves the explicit Hebrew ''there'' (שָׁם) in the relative clause. The final wording, however, adds ''there'' (అక్కడే) to the continuing state of the stones, although the Hebrew''s final phrase says ''to this very day'' without that additional locative adverb.'
