  text: וַ/יְהִ֞י לְ/עֵ֣ת בּ֣וֹא הַ/שֶּׁ֗מֶשׁ צִוָּ֤ה יְהוֹשֻׁ֨עַ֙ וַ/יֹּֽרִידוּ/ם֙ מֵ/עַ֣ל הָ/עֵצִ֔ים וַ/יַּ֨שְׁלִכֻ֔/ם אֶל הַ/מְּעָרָ֖ה אֲשֶׁ֣ר נֶחְבְּאוּ שָׁ֑ם וַ/יָּשִׂ֜מוּ אֲבָנִ֤ים גְּדֹלוֹת֙ עַל פִּ֣י הַ/מְּעָרָ֔ה עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
translation:
  language: te
  text: సూర్యుడు అస్తమించే సమయంలో[a] యెహోషువ ఆజ్ఞాపించాడు. అప్పుడు వారు ఆ రాజులను చెట్ల మీద నుంచి దించి, వారు అక్కడ దాగి ఉన్న గుహలో పడవేశారు. గుహ ద్వారం మీద పెద్ద రాళ్లను ఉంచారు; అవి నేటివరకూ అలాగే ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సంక్షిప్తంగా, “సూర్యాస్తమయ సమయంలో” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  choice: సూర్యుడు అస్తమించే సమయానికి
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా సూర్యుడు ‘లోపలికి వెళ్లే/ప్రవేశించే సమయం’ అనే దృశ్యాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘సూర్యుడు అస్తమించే సమయానికి’ సహజంగా ఉండి సమయాన్నీ మూలంలోని దృశ్యాన్నీ కాపాడుతుంది.
- source_word: צִוָּה יְהוֹשֻׁעַ
  choice: యెహోషువ ఆజ్ఞాపించాడు
  rationale: క్రియలోని ప్రత్యక్షమైన ‘ఆజ్ఞాపించు’ భావాన్ని సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: וַיּוֹרִידוּם מֵעַל הָעֵצִים
  choice: వారు ఆ రాజులను చెట్ల మీద నుంచి దించి
  rationale: హీబ్రూ ప్రత్యయాల్లోని ‘వారిని’ అన్న సూచన మునుపటి సందర్భంలోని రాజులను సూచిస్తుంది. తెలుగులో సందిగ్ధత రాకుండా ‘ఆ రాజులను’ అని స్పష్టీకరించడం సహజం; ‘చెట్ల మీద నుంచి దించి’ కిందికి దించే చర్యను సరిగ్గా చూపుతుంది.
- source_word: וַיַּשְׁלִכֻם
  choice: పడవేశారు
  rationale: మృతదేహాలను గుహలోకి విసిరివేసిన బలమైన చర్యను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר נֶחְבְּאוּ שָׁם
  choice: వారు అక్కడ దాగి ఉన్న
  rationale: మూలంలో స్పష్టంగా ఉన్న שָׁם (‘అక్కడ’)ను వదలకుండా, తెలుగులో సహజమైన సంబంధవాచక నిర్మాణంతో అందించింది.
- source_word: עַל פִּי הַמְּעָרָה
  choice: గుహ ద్వారం మీద
  rationale: פִּי అక్షరార్థంగా ‘నోరు’ అయినా గుహ ప్రవేశాన్ని సూచించే సాధారణ రూపకం. ‘గుహ ద్వారం’ తెలుగులో స్పష్టంగా ఉండి, రాళ్లతో దానిని మూసిన భావాన్ని తెలియజేస్తుంది.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: అవి నేటివరకూ అక్కడే ఉన్నాయి
  rationale: హీబ్రూ వాక్యనిర్మాణం రాళ్లు ఉంచబడిన స్థితి కథకుని కాలం వరకూ కొనసాగిందని సూచిస్తుంది. తెలుగులో కేవలం ‘నేటివరకూ ఉంచారు’ అంటే నిరంతరం ఉంచే చర్యగా తప్పుగా అర్థమయ్యే అవకాశం ఉండటంతో, కొనసాగుతున్న స్థితిని సహజంగా స్పష్టం చేసింది.
