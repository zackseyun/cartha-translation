  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస చర్యలను చిన్న వాక్యాలుగా విభజించి పఠనసౌలభ్యాన్ని పెంచాం; అయితే చర్యల క్రమాన్ని మార్చలేదు. మూలంలో స్పష్టంగా ఉన్న ‘అక్కడ’ను నిలిపి ఉంచాం.
