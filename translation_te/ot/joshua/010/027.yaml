    issue: The final clause adds 'అక్కడే' ('there') to the stones' continuing state.
    rationale: The Hebrew explicitly includes 'there' only in 'the cave where they had hidden there.' Its final idiom states that the stones were set 'to this very day.' The continuing result is appropriately expressed in Telugu, but the extra locative adverb is best omitted for tighter source correspondence.
  - severity: low
    issue: The temporal phrase can be rendered more directly.
    rationale: '''సూర్యుడు అస్తమించే సమయంలో'' naturally expresses ''at the time of the sun''s going down''; ''సమయానికి'' can carry a slight ''by the time'' nuance.'
