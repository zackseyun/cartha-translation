source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹֽנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם כִּֽי לָכַ֨ד יְהוֹשֻׁ֣עַ אֶת הָ/עַי֮ וַ/יַּחֲרִימָ/הּ֒ כַּ/אֲשֶׁ֨ר עָשָׂ֤ה לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ כֵּן עָשָׂ֥ה לָ/עַ֖י וּ/לְ/מַלְכָּ֑/הּ וְ/כִ֨י הִשְׁלִ֜ימוּ יֹשְׁבֵ֤י גִבְעוֹן֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽהְי֖וּ בְּ/קִרְבָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/001.yaml
  text: It happened[a], when Adoni-zedek king of Jerusalem heard that Joshua had captured Ai and had devoted it to destruction, just as he had done to Jericho and its king, so he had done to Ai and its king, and that the inhabitants of Gibeon had made peace with Israel and were among them[b],
translation:
  language: te
  text: 'ఇలా జరిగింది: యెరూషలేము రాజైన అదోనీ-సెదెకు, యెహోషువ హాయిని పట్టుకొని దానిని నాశనానికి అంకితం చేశాడనీ[a], అతడు యెరికోకు, దాని రాజుకు చేసినట్లే హాయికి, దాని రాజుకు కూడా చేశాడనీ, గిబియోను నివాసులు ఇశ్రాయేలుతో శాంతి చేసుకొని[b] వారి మధ్య ఉన్నారనీ విన్నప్పుడు,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దానిని పూర్తిగా నాశనం చేశాడనీ.’ హీబ్రూ పదం ఒకదానిని నాశనం కోసం ప్రత్యేకపరచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇశ్రాయేలుతో శాంతి ఒప్పందం చేసుకొని.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: కొత్త కథన ఘట్టాన్ని పరిచయం చేసే హీబ్రూ కథన రూపాన్ని పాతకాలపు శైలి లేకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: כְּ తో కూడిన క్రియానామ రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది; ‘విన్నప్పుడు’ సహజంగా దానిని తెలియజేస్తుంది.
- source_word: אֲדֹנִי צֶדֶק
  choice: అదోనీ-సెదెకు
  rationale: వ్యక్తి పేరును మూలరూపానికి దగ్గరగా లిప్యంతరీకరించి, సంయుక్త నామంలోని రెండు భాగాలను హైఫన్‌తో స్పష్టపరుస్తుంది.
- source_word: מֶלֶךְ יְרוּשָׁלַם
  choice: యెరూషలేము రాజు
  rationale: హీబ్రూ సమాస సంబంధాన్ని సహజమైన తెలుగు నామబంధంగా అనువదిస్తుంది.
- source_word: לָכַד
  choice: పట్టుకొని
  rationale: నగరాన్ని సైనికంగా స్వాధీనం చేసుకోవడాన్ని సందర్భానుకూలంగా, సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעַי
  choice: హాయి
  rationale: తెలుగులో స్థిరపడిన బైబిలు స్థలనామ రూపాన్ని ఉపయోగిస్తుంది.
- source_word: וַיַּחֲרִימָהּ
  choice: దానిని నాశనానికి అంకితం చేశాడు
  rationale: חרם అనే పదంలోని కేవలం ధ్వంసం కంటే విస్తృతమైన, నాశనం కోసం ప్రత్యేకపరచడం అనే ఆచార-దైవిక భావాన్ని నిలుపుతుంది.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: చేసినట్లే ... కూడా చేశాడు
  rationale: యెరికోకు జరిగినదానికీ హాయికి జరిగినదానికీ మధ్య హీబ్రూలోని సమాంతర పోలికను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הִשְׁלִימוּ
  choice: శాంతి చేసుకొని
  rationale: ఇక్కడ హిఫీల్ రూపం శాంతియుత సంబంధాన్ని లేదా శాంతి నిబంధనలను ఏర్పరచుకోవడాన్ని సూచిస్తుంది; ఈ అనువాదం ప్రధాన భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: יֹשְׁבֵי גִבְעוֹן
  choice: గిబియోను నివాసులు
  rationale: నివాసులను సూచించే నామీకృత కృదంతాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּהְיוּ בְּקִרְבָּם
  choice: వారి మధ్య ఉన్నారు
  rationale: ఇశ్రాయేలీయుల మధ్య లేదా వారి సమూహంలో ఉండడాన్ని అనవసరమైన వివరణ లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: జయాపజయ సందర్భంలోని חרם పదప్రయోగం
  choice: నాశనానికి అంకితం చేశాడు
  alternative: పూర్తిగా నాశనం చేశాడు
  rationale: మూలపదం సాధారణ సైనిక విధ్వంసాన్ని మాత్రమే కాక, నాశనం కోసం ప్రత్యేకపరచడమనే పవిత్ర-న్యాయ భావాన్ని కూడా మోస్తుంది. ప్రధాన పాఠంలోని ఎంపిక ఆ భావభారాన్ని నిలుపుతుంది; మరింత సరళమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివరలో అసంపూర్ణ కాలవాక్య నిర్మాణం మరియు కామా ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి. రెండు పాదసూచిక సూచికలూ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
