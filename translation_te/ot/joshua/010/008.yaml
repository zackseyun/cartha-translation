id: JOS.10.8
reference: Joshua 10:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א מֵ/הֶ֔ם כִּ֥י בְ/יָדְ/ךָ֖ נְתַתִּ֑י/ם לֹֽא יַעֲמֹ֥ד אִ֛ישׁ מֵ/הֶ֖ם בְּ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: te
  text: 'యాహ్వే యెహోషువతో ఇలా అన్నాడు: “వారిని చూసి భయపడకు, ఎందుకంటే నేను వారిని నీ చేతికి అప్పగించాను. వారిలో ఒక్క మనిషి కూడా నీ ఎదుట నిలువలేడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సాధారణ హీబ్రూ కథన రూపానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: אַל תִּירָא מֵהֶם
  choice: వారికి భయపడకు
  rationale: מן ఉపసర్గ భయానికి కారణం లేదా లక్ష్యాన్ని సూచిస్తుంది; ‘వారికి భయపడకు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: భయపడవద్దనే ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: בְיָדְךָ
  choice: నీ చేతికి
  rationale: ఎవరినైనా మరొకరి అధికారానికి అప్పగించడాన్ని సూచించే హీబ్రూ రూపకాన్ని తెలుగులోనూ సహజంగా నిలుపుతుంది.
- source_word: נְתַתִּים
  choice: నేను వారిని ... అప్పగించాను
  rationale: దైవిక నిర్ణయం నిశ్చయంగా పూర్తయినదిగా చెప్పే పరిపూర్ణ క్రియారూపాన్ని భూతకాల సంపూర్ణ భావంతో వ్యక్తపరుస్తుంది.
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: వారిలో ఒక్క మనిషి కూడా ... నిలువలేడు
  rationale: אִישׁ అనే పురుష ఏకవచనాన్ని శత్రు యోధుల సందర్భానికి అనుగుణంగా నిలుపుతూ, సంపూర్ణ నిరాకరణ బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּפָנֶיךָ
  choice: నీ ఎదుట
  rationale: మూలంలోని ముఖాముఖి రూపాన్ని నిలుపుతుంది; సైనిక సందర్భంలో నిన్ను ఎదిరించి నిలబడలేడనే భావం స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది; ‘యాహ్వే’ కూడా సాధ్యమైన పునర్నిర్మిత ఉచ్చారణ.
- issue: אִישׁ పదంలోని లింగ సూచన
  choice: మనిషి
  alternative: ఒక్కడు
  rationale: సందర్భం పురుష యోధుల గురించి అయినప్పటికీ, ‘ఒక్క మనిషి కూడా’ మూలంలోని ఏకవచన పురుష నామవాచకాన్ని సహజంగా ప్రతిబింబిస్తుంది; లింగాన్ని పూర్తిగా తటస్థీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర కథన శైలి. ‘నీ చేతికి’ మరియు ‘నీ ఎదుట’ అనే మూల రూపకాలను సహజంగా నిలిపింది.
