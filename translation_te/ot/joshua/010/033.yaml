  text: אָ֣ז עָלָ֗ה הֹרָם֙ מֶ֣לֶךְ גֶּ֔זֶר לַ/עְזֹ֖ר אֶת לָכִ֑ישׁ וַ/יַּכֵּ֤/הוּ יְהוֹשֻׁ֨עַ֙ וְ/אֶת עַמּ֔/וֹ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/033.yaml
  text: Then Horam king of Gezer went up to help Lachish[a], and Joshua struck him and his people until he left him no survivor.
translation:
  language: te
  text: అప్పుడు లాకీషుకు సహాయం చేయడానికి గెజెరు రాజైన హోరాము పైకి వెళ్లాడు. యెహోషువ అతణ్ణి, అతని ప్రజలనూ కొట్టి, అతనికి ప్రాణాలతో మిగిలినవాడు ఒక్కడూ లేకుండా చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి శేషంగా ఎవరినీ మిగల్చలేదు.” హీబ్రూ పదం ప్రాణాలతో బయటపడినవాడిని లేదా మిగిలినవాడిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: తరువాత జరిగిన సంఘటనను కథన క్రమంలో సహజంగా పరిచయం చేస్తుంది.
- source_word: עָלָה
  choice: బయలుదేరి వచ్చాడు
  rationale: మూలంలోని ‘పైకి వెళ్లాడు/వచ్చాడు’ అనే సైనిక కదలికను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; భౌగోళిక ఎత్తును అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הֹרָם מֶלֶךְ גֶּזֶר
  choice: గెజెరు రాజైన హోరాము
  rationale: వ్యక్తి పేరును, రాజపదవిని, పట్టణ పేరును స్పష్టంగా నిలుపుతుంది.
- source_word: לַעְזֹר אֶת לָכִישׁ
  choice: లాకీషుకు సహాయం చేయడానికి
  rationale: עזר యొక్క సహాయం అందించడం అనే అర్థాన్ని సైనిక సందర్భంలోనూ సహజంగా తెలుపుతుంది.
- source_word: וַיַּכֵּהוּ
  choice: అతణ్ణి హతమార్చి
  rationale: נכה ఇక్కడ తరువాతి సంపూర్ణ నాశన వాక్యభాగంతో కలిసి ప్రాణాంతకంగా కొట్టడాన్ని సూచిస్తుంది; ‘హతమార్చి’ ఆధునిక తెలుగులో స్పష్టం.
- source_word: וְאֶת עַמּוֹ
  choice: అతని ప్రజలనూ
  rationale: עַם ను ‘సైన్యం’గా కుదించకుండా దాని విస్తృతమైన ‘ప్రజలు’ అనే భావాన్ని నిలుపుతుంది.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: అతనికి ప్రాణాలతో మిగిలినవాడు ఒక్కడూ లేకుండా చేశాడు
  rationale: దాడి యొక్క ఫలితం లేదా పరిమితిని సహజ తెలుగులో తెలియజేస్తూ, שָׂרִיד యొక్క ‘బతికి/మిగిలిన వ్యక్తి’ భావాన్ని కాపాడుతుంది.
