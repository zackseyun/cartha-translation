translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని సైనిక సందర్భం స్పష్టంగా ఉండేలా చేసినప్పటికీ, ‘ప్రజలు’ను ‘సైన్యం’గా సంకుచితం చేయలేదు. పాదసూచిక గుర్తు [a] సంబంధిత ప్రధాన వాక్యాంతంలో ఉంచబడింది.
