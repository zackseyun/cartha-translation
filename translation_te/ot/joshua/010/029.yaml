  yaml_path: translation/ot/joshua/010/029.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
translation:
  language: te
  text: తరువాత యెహోషువ అతనితో ఉన్న ఇశ్రాయేలీయులందరితో కలిసి మక్కేదా నుండి లిబ్నాకు వెళ్లి, లిబ్నాపై యుద్ధం చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “లిబ్నాతో యుద్ధం చేశారు”; ఈ ప్రయోగంలో అర్థం లిబ్నా నగరానికి వ్యతిరేకంగా యుద్ధం చేయడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: వెళ్లి
  rationale: עבר ఇక్కడ ఒక స్థలం నుండి తదుపరి స్థలానికి సాగిపోవడాన్ని సూచిస్తుంది. నది దాటడం వంటి భావాన్ని అనవసరంగా చేర్చకుండా, సైనిక ప్రయాణ క్రమంలో సహజమైన తెలుగు కోసం ‘వెళ్లి’ అని అనువదించాం.
- source_word: עִמּוֹ
  choice: అతనితో ఉన్న
  rationale: עִם + 3ms ప్రత్యయం సహవాసాన్ని సూచిస్తుంది; యెహోషువతో ఇశ్రాయేలీయులందరూ ఉన్నారని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִמַּקֵּדָה
  choice: మక్కేదా నుండి
  rationale: מן ఉపసర్గ బయలుదేరిన స్థలాన్ని సూచిస్తుంది; స్థల నామాన్ని లిప్యంతరీకరించాం.
- source_word: לִבְנָה
  choice: లిబ్నాకు
  rationale: గమనానికి గమ్యస్థానాన్ని సూచిస్తున్నందున ‘లిబ్నాకు’ అని ఇచ్చాం; పేరును అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: וַיִּלָּחֶם
  choice: యుద్ధం చేశారు
  rationale: Niphal రూపంలోని לחם అంటే యుద్ధం చేయడం లేదా పోరాడడం. ‘యుద్ధం చేశారు’ సైనిక సందర్భానికి తగిన, స్పష్టమైన ఆధునిక తెలుగు.
- source_word: עִם לִבְנָה
  choice: లిబ్నాకు విరోధంగా
  rationale: עִם సాధారణంగా ‘తో’ అని అర్థమైనా, לחם తరువాత అది యుద్ధ ప్రత్యర్థిని సూచిస్తుంది. అందువల్ల తెలుగులో ప్రతికూల సంబంధాన్ని స్పష్టంగా చూపించాం.
