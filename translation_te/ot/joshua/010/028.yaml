  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
translation:
  language: te
  text: యెహోషువ ఆ రోజే మక్కేదాను పట్టుకున్నాడు. దానిని కత్తి ధారతో కొట్టాడు; దాని రాజును, దానిలో ఉన్న ప్రతి ఒక్కరినీ నిర్మూలనకు అంకితం చేశాడు[a]. అతడు ఒక్కరినీ మిగల్చలేదు. యెరికో రాజుకు చేసినట్టే మక్కేదా రాజుకూ చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పూర్తిగా నాశనం చేశాడు.” హెబ్రీ క్రియ హెరెం అనే నిషేధం కింద దేనినైనా నిర్మూలనకు అంకితం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: పట్టుకున్నాడు
  rationale: పట్టణాన్ని సైనికంగా స్వాధీనం చేసుకోవడాన్ని ఆధునిక, సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב וְאֶת מַלְכָּהּ
  choice: దానినీ దాని రాజునూ కత్తివాత హతం చేసి
  rationale: לְפִי חֶרֶב అనే ‘కత్తి అంచు/నోరు’ రూపకాన్ని సహజ తెలుగు యుద్ధప్రయోగమైన ‘కత్తివాత’తో నిలుపుతుంది; మసొరెటిక్ వాక్యనిర్మాణం ప్రకారం పట్టణం, దాని రాజు రెండింటినీ נכה క్రియతో అనుసంధానిస్తుంది.
- source_word: הֶחֱרִים
  choice: నిర్మూలనకు అంకితం చేశాడు
  rationale: חרם హిఫీల్ రూపం సాధారణ నాశనం కంటే, నిషేధం కింద నిర్మూలనకు ప్రత్యేకంగా అప్పగించే భావాన్ని కలిగి ఉంది; ఈ ఎంపిక ఆ ఆచార-తీర్పు భావాన్ని నిలుపుతుంది.
- source_word: אוֹתָם וְאֶת כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: దానిలో ఉన్న ప్రతి ప్రాణితో సహా వారిని
  rationale: אוֹתָם అనే బహువచన సర్వనామం ముందున్న పట్టణం, రాజును తిరిగి సూచించే అసాధారణ నిర్మాణాన్ని ‘వారిని’తో సాధ్యమైనంతవరకు నిలుపుతూ, כָּל הַנֶּפֶשׁ ను వ్యక్తుల ప్రాణాల అర్థంలో అనువదిస్తుంది.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: ఒక్క ప్రాణినీ మిగల్చలేదు
  rationale: ఎవరూ ప్రాణాలతో మిగలలేదనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: యెరికో రాజుకు చేసినట్టే మక్కేదా రాజుకూ చేశాడు
  rationale: עשה ל అనే సంక్షిప్త, ఉద్దేశపూర్వకంగా వివరించని హెబ్రీ నిర్మాణాన్ని అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: יְהוֹשֻׁעַ / מַקֵּדָה / יְרִיחוֹ
  choice: యెహోషువ / మక్కేదా / యెరికో
  rationale: ఆధునిక ప్రామాణిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణలను ఉపయోగిస్తుంది.
theological_decisions:
- issue: ఆక్రమణ సందర్భంలో חרם పదం
  choice: నిర్మూలనకు అంకితం చేశాడు
  alternative: పూర్తిగా నాశనం చేశాడు
  rationale: ఈ క్రియ కేవలం చంపడం లేదా నాశనం చేయడం మాత్రమే కాక, నిషేధం కింద నిర్మూలనకు అప్పగించడాన్ని కూడా సూచిస్తుంది. ప్రధాన పాఠంలో ఆ ధార్మిక-ఆచార భావాన్ని నిలిపి, మరింత సాధారణ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి వాడబడింది. మూలంలోని సంక్షిప్తతను కాపాడుతూ, חרם పదంలోని ప్రత్యేక భావాన్ని ప్రధాన పాఠంలో నిలిపి పాదటిప్పణిలో ప్రత్యామ్నాయం ఇచ్చాం.
