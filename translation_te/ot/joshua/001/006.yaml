source:
  edition: WLC
  text: חֲזַ֖ק וֶ/אֱמָ֑ץ כִּ֣י אַתָּ֗ה תַּנְחִיל֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶת הָ/אָ֕רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבוֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
translation:
  language: te
  text: బలంగా ఉండు, ధైర్యంగా ఉండు; ఎందుకంటే నేను వారి పితరులకు ఇస్తానని ప్రమాణం చేసిన ఆ దేశాన్ని ఈ ప్రజలు స్వాస్థ్యంగా పొందేలా నీవు చేస్తావు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ ప్రజలకు ఆ దేశాన్ని స్వాస్థ్యంగా ఇస్తావు.” హీబ్రూ క్రియ కారణార్థకంగా ఉంది; అంటే ప్రజలు ఆ దేశాన్ని స్వాస్థ్యంగా పొందేలా చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘వారి పితరులు’ అంటే ఇశ్రాయేలీయుల పితృపురుషులు; లేదా, ‘వారి పూర్వీకులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמָץ
  choice: బలంగా, ధైర్యంగా ఉండు
  rationale: రెండు ఏకవచన ఆజ్ఞారూపాల జంటను సహజమైన ఆధునిక తెలుగులో అందిస్తూ, బలం మరియు ధైర్యం అనే రెండు భావాలనూ నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేసే హేత్వర్థ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּנְחִיל
  choice: స్వాస్థ్యంగా పొందేలా నీవు చేస్తావు
  rationale: נחל యొక్క హిఫీల్ రూపంలోని కారణార్థాన్ని—యెహోషువ ప్రజలు దేశాన్ని స్వాస్థ్యంగా పొందేలా చేయడం—తెలుగులో స్పష్టంగా కాపాడుతుంది.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలు
  rationale: హీబ్రూ సమూహవాచక భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశాన్ని
  rationale: వాగ్దానం చేయబడిన భూభాగాన్ని సూచించే సందర్భంలో ‘దేశం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: נִשְׁבַּעְתִּי
  choice: నేను ... ప్రమాణం చేసిన
  rationale: దేవుడు పితరులకు చేసిన గత ప్రమాణాన్ని నేరుగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: לַאֲבוֹתָם
  choice: వారి పితరులకు
  rationale: పదబద్ధమైన పురుష బహువచన సూచనను నిలుపుతూ, ఇశ్రాయేలు పూర్వపితరులను సూచించే బైబిలు సందర్భానికి తగిన పదాన్ని ఉపయోగిస్తుంది.
- source_word: לָתֵת לָהֶם
  choice: ఇస్తానని
  rationale: ప్రమాణంలోని విషయాన్ని సహజమైన తెలుగు పరోక్ష ఉక్తిగా తెలియజేస్తుంది; ‘వారికి’ అనే గ్రహీత భావం ‘వారి పితరులకు’ అనే సమీప పదబంధంతో సందర్భంలో స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: לַאֲבוֹתָם లోని పితృపురుషుల సూచన
  choice: వారి పితరులకు
  alternative: వారి పూర్వీకులకు
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘వారి తండ్రులకు/పితరులకు’ అని ఉండి, సందర్భంలో ఇశ్రాయేలు పితృపురుషులను సూచిస్తుంది. ప్రధాన పాఠ్యంలో ఆ పురుషలింగ, నిబంధనాత్మక సూచనను నిలుపుతుంది.
- issue: תַּנְחִיל లోని కారణార్థం
  choice: ఈ ప్రజలు స్వాస్థ్యంగా పొందేలా నీవు చేస్తావు
  alternative: ఈ ప్రజలకు స్వాస్థ్యంగా ఇస్తావు
  rationale: హిఫీల్ క్రియారూపం యెహోషువ ప్రజలు దేశాన్ని స్వాధీనపరచుకొని స్వాస్థ్యంగా పొందేలా చేస్తాడనే కారణార్థాన్ని కలిగి ఉంది; దానిని ప్రధాన పాఠ్యం స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆజ్ఞారూపం వాడబడింది. ‘స్వాస్థ్యం’ అనే బైబిలు సందర్భానికి పరిచితమైన పదాన్ని ఉంచి, కారణార్థక క్రియను సాధారణ పాఠకుడికి స్పష్టమయ్యే వాక్యరూపంలో అందించాం.
