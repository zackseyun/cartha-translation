  naturalness: ‘రాత్రింబగళ్లు’ మరియు ‘జ్ఞానయుక్తంగా ప్రవర్తిస్తావు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉన్నాయి. ఉద్దేశ-వాక్యాన్ని ‘...ప్రకారం జాగ్రత్తగా ఆచరించేందుకు’గా అమర్చడం మరింత సూటిగా, వ్యాకరణపరంగా స్పష్టంగా ఉంటుంది.
