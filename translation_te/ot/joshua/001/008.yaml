id: JOS.1.8
reference: Joshua 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא יָמ֡וּשׁ סֵפֶר֩ הַ/תּוֹרָ֨ה הַ/זֶּ֜ה מִ/פִּ֗י/ךָ וְ/הָגִ֤יתָ בּ/וֹ֙ יוֹמָ֣ם וָ/לַ֔יְלָה לְמַ֨עַן֙ תִּשְׁמֹ֣ר לַ/עֲשׂ֔וֹת כְּ/כָל הַ/כָּת֖וּב בּ֑/וֹ כִּי אָ֛ז תַּצְלִ֥יחַ אֶת דְּרָכֶ֖/ךָ וְ/אָ֥ז תַּשְׂכִּֽיל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
translation:
  language: te
  text: ఈ ధర్మశాస్త్ర గ్రంథం నీ నోటి నుండి తొలగిపోకూడదు. నీవు అందులో వ్రాయబడినదంతటి ప్రకారం జాగ్రత్తగా ఆచరించేందుకు, దానిని రాత్రింబగళ్లు ధ్యానించాలి[a]. అప్పుడు నీవు నీ మార్గాన్ని సఫలం చేసుకుంటావు; అప్పుడు జ్ఞానయుక్తంగా ప్రవర్తిస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాన్ని మెల్లగా వల్లిస్తూ ఉండాలి’ లేదా ‘పెదవులతో పలుకుతూ ఉండాలి’; హీబ్రూ క్రియ ధ్యానంతో పాటు మృదువైన మౌఖిక పునరుక్తినీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּשׁ
  choice: తొలగిపోకూడదు
  rationale: మూల క్రియలోని ‘విడిచిపోవడం/దూరమవడం’ అనే భావాన్ని, ‘నీ నోటినుండి’ అనే స్పష్టమైన రూపకంతో సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: ఈ ధర్మశాస్త్ర గ్రంథం
  rationale: סֵפֶר అనేది గ్రంథం లేదా చుట్టగా రాసిన పత్రాన్ని, תּוֹרָה ఈ సందర్భంలో లిఖితమైన నిబంధన ధర్మశాస్త్రాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్ర గ్రంథం’ ఆధునిక తెలుగు బైబిలు వాడుకలో స్పష్టంగా ఉంటుంది.
- source_word: מִפִּיךָ
  choice: నీ నోటినుండి
  rationale: మాట్లాడటం, వల్లించడం, పెదవులపై ఉంచుకోవడం వంటి సూచనలను కలిగిన మూలంలోని శరీరరూపకాన్ని నేరుగా కాపాడుతుంది.
- source_word: וְהָגִיתָ בּוֹ
  choice: దాన్ని ధ్యానించాలి
  rationale: הגה లో మెల్లగా పలకడం, వల్లించడం, లోతుగా తలపోస్తూ ఉండడం అనే భావాలు ఉన్నాయి. ప్రధాన పాఠ్యంలో సహజమైన ‘ధ్యానించాలి’ వాడి, మౌఖిక భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: יוֹמָם וָלַיְלָה
  choice: రాత్రింబగళ్లు
  rationale: పగలు-రాత్రి నిరంతర అభ్యాసాన్ని సూచించే సమగ్ర ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగు నుడికారంతో వ్యక్తం చేస్తుంది.
- source_word: לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת
  choice: జాగ్రత్తగా ఆచరించేలా
  rationale: ఉద్దేశాన్ని సూచించే לְמַעַן తో పాటు, శ్రద్ధగా పాటించి చేయడం అనే שׁמר + עשׂה నిర్మాణ భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: כְּכָל הַכָּתוּב בּוֹ
  choice: అందులో రాసి ఉన్నదంతా
  rationale: ‘అందులో వ్రాయబడిన సమస్తం ప్రకారం’ అనే మూల భావాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో సమగ్రంగా అందిస్తుంది.
- source_word: תַּצְלִיחַ אֶת דְּרָכֶךָ
  choice: నీ మార్గాన్ని సఫలం చేసుకుంటావు
  rationale: צלח హిఫీల్ రూపంలోని కారణార్థకతను—వ్యక్తి తన మార్గాన్ని సఫలం చేసుకోవడం—నిలుపుతుంది; కేవలం ‘వర్ధిల్లుతావు’ అని చదును చేయదు.
- source_word: תַּשְׂכִּיל
  choice: జ్ఞానయుక్తంగా ప్రవర్తిస్తావు
  rationale: שׂכל హిఫీల్‌లోని వివేకంతో, అంతర్దృష్టితో వ్యవహరించే భావాన్ని నిలుపుతూ, ముందున్న ‘సఫలం’ అనే צלח భావంతో తేడాను కాపాడుతుంది.
theological_decisions:
- issue: నిబంధన సందర్భంలో תּוֹרָה అర్థం
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం; తోరా
  rationale: ఈ సందర్భంలో అది యెహోషువ పాటించాల్సిన లిఖిత నిబంధన నియమసముదాయాన్ని సూచిస్తుంది. ‘ఉపదేశం’ విస్తృత అర్థాన్ని ఇస్తుంది; ‘తోరా’ సాధారణ పాఠకునికి తక్కువ పారదర్శకంగా ఉండవచ్చు.
- issue: ధ్యానం—మౌఖిక వల్లింపా, అంతరంగ ఆలోచనా
  choice: ప్రధాన పాఠ్యంలో ‘ధ్యానించాలి’; పాదటిప్పణిలో మెల్లగా వల్లించే భావం
  alternative: మెల్లగా వల్లించాలి; పెదవులతో పలుకుతూ ఉండాలి
  rationale: మూలపదం రెండు భావాలనూ అనుమతిస్తుంది. ‘నీ నోటినుండి’ అనే ముందరి వాక్యం మౌఖిక కోణాన్ని నిలుపుతుంది; ‘ధ్యానించాలి’ ప్రతిఫలనాత్మక కోణాన్ని సహజంగా తెలియజేస్తుంది. పాదటిప్పణి నిజమైన పదార్థ విస్తృతిని సంరక్షిస్తుంది.
- issue: תַּשְׂכִּיל లో జ్ఞానం మరియు విజయం మధ్య సంబంధం
  choice: జ్ఞానయుక్తంగా ప్రవర్తిస్తావు
  alternative: విజయం పొందుతావు; సఫలమవుతావు
  rationale: ఈ క్రియ సందర్భానుసారంగా విజయ ఫలితాన్ని సూచించగలిగినా, ముందే צלח ద్వారా సఫలత చెప్పబడింది. రెండింటినీ ఒకేలా అనువదించకుండా వివేకపూర్వక ప్రవర్తన అనే భేదాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ‘ధర్మశాస్త్ర గ్రంథం,’ ‘ధ్యానించాలి’ వంటి స్థిర బైబిలు పదజాలాన్ని ఉంచుతూ, అతిగా ప్రాచీనమైన క్రియారూపాలను నివారించాం. ఏకవచన సంబోధనను మూలానికి అనుగుణంగా కాపాడాం.
