id: JOS.1.17
reference: Joshua 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
translation:
  language: te
  text: మేము ప్రతి విషయంలో మోషే మాట విన్నట్లే[a], నీ మాట కూడా వింటాము. అయితే, యాహ్వే నీ దేవుడు మోషేతో ఉన్నట్లే నీతోనూ ఉండుగాక!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము ప్రతి విషయంలో మోషేకు విధేయత చూపినట్లే, నీకూ విధేయత చూపుతాము.” హీబ్రూ క్రియకు సందర్భానుసారంగా “విను,” “మాట విను,” లేదా “విధేయత చూపు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ / נִשְׁמַע
  choice: మాటను విన్నట్టే / మాటను కూడా వింటాము
  rationale: שׁמע + אֶל ఇక్కడ ఒకరి మాట వినడం, దానికి విధేయంగా స్పందించడం అనే భావాన్ని కలిగి ఉంది. తెలుగు సహజత్వం కోసం ‘మాటను విను’ అని ఇచ్చి, విధేయత భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: כְּכֹל אֲשֶׁר
  choice: ప్రతి విషయంలో ... విన్నట్టే
  rationale: ఈ నిర్మాణంలోని సమగ్ర పరిధిని ‘ప్రతి విషయంలో’తోను, పోలికను ‘విన్నట్టే’తోను నిలిపాం.
- source_word: רַק
  choice: (ప్రత్యేక పదంగా అనువదించకుండా, తరువాతి ఆకాంక్షను స్వతంత్ర వాక్యంగా ఉంచడం)
  rationale: ఇక్కడ רַק ప్రతిజ్ఞకు అనుసంధానమైన ఒక పరిమితి లేదా బలమైన ఆకాంక్షను పరిచయం చేస్తుంది. తెలుగులో ‘మాత్రం’ అనడం అనవసరంగా షరతు భావాన్ని కఠినతరం చేయవచ్చు; ఆశీర్వాదాకాంక్షను నేరుగా ఉంచడం సహజంగా ఉంది.
- source_word: יִהְיֶה
  choice: ఉండుగాక
  rationale: רַק తరువాత ఇది సాధారణ భవిష్యత్తు ప్రకటనకంటే ఆకాంక్షార్థకంగా ఉంది; ‘ఉండుగాక’ ఆ భావాన్ని గౌరవప్రదమైన ఆధునిక బైబిలు తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: עִמָּךְ / עִם
  choice: నీతోనూ / మోషేతో
  rationale: సన్నిధి, సహవాసం అనే భావాన్ని తెలుగు ‘తో ఉండు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: ఉన్నట్టే
  rationale: మోషేతో దేవుని సన్నిధికి, యెహోషువతో ఉండాలని కోరుతున్న సన్నిధికి మధ్య పోలికను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా తెలిసిన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను ప్రతిబింబించే ప్రత్యామ్నాయం.
- issue: שׁמע లోని వినడం–విధేయత భావం
  choice: మాటను వినడం
  alternative: విధేయత చూపడం
  rationale: మూల క్రియలోని నిజమైన అర్థవ్యాప్తిని కాపాడుతూ, సందర్భంలోని విధేయత సూచనను పాదటిప్పణిలో ఇచ్చాం; ప్రధాన పాఠంలో దానిని ఒక్క అర్థానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. యెహోషువను ఉద్దేశించిన ఏకవచన సంబోధనను ‘నీ’తో నిలిపాం. ‘మాటను విను’ అనే తెలుగు నుడికారం శ్రవణంతో పాటు స్పందనాత్మక విధేయతను కూడా సూచించగలదు.
