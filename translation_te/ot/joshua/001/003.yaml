language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל מָק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם נְתַתִּ֑י/ו כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/003.yaml
  text: Every place on which the sole of your foot treads[a], I have given to you, just as I spoke to Moses.
translation:
  language: te
  text: మీ పాదాల అరికాళ్లను మోపే ప్రతి స్థలాన్నీ[a] నేను మీకు ఇచ్చాను; నేను మోషేకు చెప్పినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ పాదాల అరికాళ్లను ఎక్కడ మోపుతారో ఆ ప్రతి స్థలాన్నీ.”
    reason: సంబంధ వాక్య నిర్మాణానికి మరింత స్పష్టమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: כָּל מָקוֹם
  choice: ప్రతి స్థలాన్నీ
  rationale: כָּל ఇక్కడ పంపిణీ భావాన్ని ఇస్తుంది; ప్రతి స్థలాన్ని విడివిడిగా సూచించే సహజమైన తెలుగు ప్రయోగం ఇది.
- source_word: אֲשֶׁר ... בּוֹ
  choice: మోపే
  rationale: స్థలాన్ని విశేషించే సంబంధ వాక్యాన్ని తెలుగులో సహజంగా సంక్షిప్తం చేస్తుంది; בּוֹలోని ‘దానిపై’ అనే భావం ‘స్థలం’ మరియు ‘మోపడం’ ద్వారా స్పష్టంగా ఉంటుంది.
- source_word: תִּדְרֹךְ
  choice: మోపే
  rationale: דרךలోని నేలపై పాదం పెట్టడం లేదా తొక్కడం అనే స్పష్టమైన భౌతిక చిత్రాన్ని ‘మోపే’ నిలుపుతుంది.
- source_word: כַּף רַגְלְכֶם
  choice: మీ అరికాలు
  rationale: כַּף רֶגֶל పాదం కింది భాగాన్ని, అంటే అరికాలిని సూచిస్తుంది. బహువచన సంబోధనను ‘మీ’ సహజంగా తెలియజేస్తుంది.
- source_word: לָכֶם
  choice: మీకు
  rationale: భూమిని పొందేవారిని సూచించే లబ్ధిదారు భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: נְתַתִּיו
  choice: నేను ... ఇచ్చాను
  rationale: హీబ్రూ పరిపూర్ణ క్రియారూపాన్ని గత/పూర్తి క్రియగా ఉంచి, దేవుడు ఆ అనుగ్రహాన్ని స్థిరపరచిన నిశ్చయాన్ని కాపాడుతుంది.
- source_word: כַּאֲשֶׁר
  choice: చెప్పినట్లే
  rationale: ప్రస్తుత ప్రకటనకు మోషేతో ఇంతకుముందు చెప్పిన మాటకు ఉన్న సరిపోలికను ‘అట్లే’ భావంతో స్పష్టంగా చూపుతుంది.
- source_word: דִּבַּרְתִּי אֶל מֹשֶׁה
  choice: నేను మోషేతో చెప్పిన
  rationale: దీనిని ‘వాగ్దానం చేసిన’ అని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా, మోషేకు ఉద్దేశించి పలికిన మాట అనే సాధారణ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవిక అనుగ్రహపు క్రియాకాలం/దృక్కోణం
  choice: ‘నేను మీకు ఇచ్చాను’ అని పూర్తి క్రియగా అనువదించబడింది.
  alternative: ‘నేను మీకు ఇస్తాను’ లేదా ‘ఇస్తున్నాను.’
  rationale: נְתַתִּיו పరిపూర్ణ రూపంలో ఉంది. భూమిని వాస్తవంగా స్వాధీనం చేసుకోవడం తరువాత జరిగినా, దేవుని నిర్ణయంలో ఆ అనుగ్రహం స్థిరంగా ఇవ్వబడినదనే ఉద్వేగాన్ని భవిష్యత్ కాలంగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అరికాలు మోపే’ అనే సజీవమైన భౌతిక చిత్రాన్ని నిలుపుతూ, హీబ్రూ వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా మార్చబడింది.
