source:
  edition: WLC
  text: מֹשֶׁ֥ה עַבְדִּ֖/י מֵ֑ת וְ/עַתָּה֩ ק֨וּם עֲבֹ֜ר אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֗ה אַתָּה֙ וְ/כָל הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/002.yaml
  text: Moses my servant is dead. So now[a], arise, cross this Jordan—you and all this people—into the land that I am giving to them, to the sons of Israel.
translation:
  language: te
  text: “నా సేవకుడైన మోషే చనిపోయాడు. కాబట్టి ఇప్పుడు లేచి, నీవు ఈ ప్రజలందరితో కలిసి ఈ యొర్దానును దాటి, నేను వారికి—ఇశ్రాయేలు కుమారులకు[a]—ఇస్తున్న దేశంలోకి వెళ్లు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులకు,” లేదా “ఇశ్రాయేలు సంతానానికి.” హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులకు” అని ఉంది; ఈ పేరు ఇక్కడ ఇశ్రాయేలు ప్రజలందరినీ సామూహికంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: నా సేవకుడైన
  rationale: עֶבֶד అనే పదానికి ‘సేవకుడు’ లేదా ‘దాసుడు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ దేవునితో మోషేకు ఉన్న గౌరవప్రదమైన సంబంధాన్ని సూచిస్తున్నందున ‘నా సేవకుడు’ సహజంగాను సందర్భోచితంగాను ఉంది.
- source_word: מֵת
  choice: చనిపోయాడు
  rationale: ఈ qatal రూపం మోషే మరణాన్ని యెహోషువకు అప్పగించబోయే బాధ్యతకు ఆధారమైన ప్రస్తుత వాస్తవంగా సూటిగా ప్రకటిస్తుంది.
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: సంయోజక అవ్యయం, కాలావ్యయం కలిసి మోషే మరణం నుంచి యెహోషువకు ఇచ్చే ఆజ్ఞకు మార్పునూ దాని పర్యవసాన భావాన్నీ సూచిస్తున్నాయి.
- source_word: קוּם
  choice: లేచి
  rationale: ఈ ఆజ్ఞాపక రూపం నిర్ణయాత్మక కార్యానికి పిలుపునిస్తుంది; ఆధునిక తెలుగులో ‘లేచి’ సహజంగా ఉండి మూలంలోని గంభీరతను నిలుపుతుంది.
- source_word: עֲבֹר אֶת־הַיַּרְדֵּן הַזֶּה
  choice: ఈ యొర్దానును దాటి
  rationale: నదిని ప్రత్యక్ష కర్మగా తీసుకున్న עָבַר ఇక్కడ ‘దాటడం’ అని అర్థం. ‘ఈ’ అనే పదం హీబ్రూలోని నిర్దేశకాన్ని నిలుపుతుంది.
- source_word: אַתָּה וְכָל־הָעָם הַזֶּה
  choice: నీవు ఈ ప్రజలందరితో కలిసి
  rationale: మూలంలో ‘నీవు, ఈ ప్రజలందరూ’ అని ఉన్నా, ఏకవచన ఆజ్ఞ యెహోషువను ఉద్దేశిస్తుంది. తెలుగులో ఆ ఏకవచన సంబోధనను సహజంగా నిలుపడానికి ‘ప్రజలందరితో కలిసి’ అని అమర్చబడింది.
- source_word: אֶל־הָאָרֶץ
  choice: దేశంలోకి
  rationale: చలనాన్ని తెలిపే సందర్భంలో אֶל ప్రవేశ గమ్యాన్ని సూచిస్తుంది; ‘దేశంలోకి’ ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: నేను వారికి … ఇస్తున్న
  rationale: నֹתֵן అనే participle దేవుడు ఆ దేశాన్ని ప్రస్తుతం లేదా సమీప భవిష్యత్తులో అనుగ్రహిస్తున్న కార్యంగా చూపుతుంది; ‘ఇస్తున్న’ ఆ అంశాన్ని నిలుపుతుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ మూలంలోని పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది సమస్త ఇశ్రాయేలు ప్రజలను సూచించే సామూహిక నామమని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל లోని లింగసూచక సామూహిక సంబోధన
  choice: ఇశ్రాయేలు కుమారులకు
  alternative: ఇశ్రాయేలీయులకు; ఇశ్రాయేలు సంతానానికి
  rationale: హీబ్రూ వాక్యం పురుష బహువచనమైన ‘కుమారులు’ అనే రూపాన్ని స్పష్టంగా ఉపయోగిస్తుంది. ఆ రూపాన్ని చెరపకుండా ప్రధాన పాఠ్యంలో ఉంచి, అది ఒడంబడిక ప్రజలందరినీ సామూహికంగా సూచిస్తుందని పాదటిప్పణిలో తెలియజేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన దైవ ఆజ్ఞ శైలిని అనుసరించాం. యెహోషువను ఉద్దేశించిన హీబ్రూ ఏకవచన ఆజ్ఞను ‘వెళ్లు’తో నిలుపుతూ, అతనితో ప్రజలందరూ వెళ్లాలనే భావాన్ని ‘తో కలిసి’ ద్వారా సహజంగా వ్యక్తం చేశాం. ‘యొర్దాను’ అనే సంప్రదాయ తెలుగు రూపాన్ని ఉపయోగించాం.
