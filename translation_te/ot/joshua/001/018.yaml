source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר יַמְרֶ֣ה אֶת פִּ֗י/ךָ וְ/לֹֽא יִשְׁמַ֧ע אֶת דְּבָרֶ֛י/ךָ לְ/כֹ֥ל אֲשֶׁר תְּצַוֶּ֖/נּוּ יוּמָ֑ת רַ֖ק חֲזַ֥ק וֶ/אֱמָֽץ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/018.yaml
  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
translation:
  language: te
  text: నీ ఆజ్ఞను ధిక్కరించి, నీవు అతనికి ఆజ్ఞాపించే ప్రతి విషయంలో నీ మాటలను విననివాడైన ప్రతి మనిషి మరణశిక్ష పొందాలి.[a] మాత్రం నీవు బలంగా, ధైర్యంగా ఉండు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నీ నోటికి ఎదురు తిరిగే ప్రతి మనిషి.’ హీబ్రూ నుడికారంలో ‘నీ నోరు’ అంటే నీ ఆజ్ఞ లేదా అధికారపూర్వకమైన మాట.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: ప్రతి మనిషి
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ ఏకవచన పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יַמְרֶה
  choice: ధిక్కరించి
  rationale: మరָה హిఫీల్ రూపం అధికారానికి ఎదురు తిరగడం లేదా ధిక్కరించడం అనే బలమైన భావాన్ని ఇస్తుంది; సాధారణమైన ‘అవిధేయత చూపడం’ కంటే ఇది మూలంలోని తీవ్రతను మెరుగ్గా నిలుపుతుంది.
- source_word: אֶת פִּיךָ
  choice: నీ ఆజ్ఞను
  rationale: అక్షరార్థంగా ‘నీ నోటిని’ అయినా, ఇక్కడ అది అధికారపూర్వకమైన మాట లేదా ఆజ్ఞను సూచించే హీబ్రూ నుడికారం.
- source_word: וְלֹא יִשְׁמַע אֶת דְּבָרֶיךָ
  choice: నీ మాటలను వినని
  rationale: שׁמע పదంలోని వినడం, ఆలకించడం, విధేయత చూపడం అనే భావవ్యాప్తిని నిలుపుతుంది; తిరుగుబాటు భావం ముందే ‘ధిక్కరించి’లో వ్యక్తమైంది.
- source_word: לְכֹל אֲשֶׁר תְּצַוֶּנּוּ
  choice: నీవు అతనికి ఆజ్ఞాపించే వాటన్నిటిలో
  rationale: విధేయతకు సంబంధించిన సంపూర్ణ పరిధిని తెలియజేస్తూ హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: יוּמָת
  choice: మరణశిక్ష పొందాలి
  rationale: ఈ హోఫాల్ రూపం కేవలం చనిపోవడాన్ని కాక, విధించబడే న్యాయపరమైన మరణదండనను సూచిస్తుంది.
- source_word: רַק
  choice: అయితే
  rationale: ముందున్న శిక్షా ప్రకటన నుంచి యెహోషువకు ఇచ్చే ప్రోత్సాహానికి మార్పును సహజమైన తెలుగులో చూపుతుంది; ఈ సందర్భంలో రַק యొక్క పరిమితి/ప్రబోధక సంధి భావాన్ని అందిస్తుంది.
- source_word: חֲזַק וֶאֱמָץ
  choice: బలంగా, ధైర్యంగా ఉండు
  rationale: యెహోషువ గ్రంథంలో పునరావృతమయ్యే ఈ ప్రోత్సాహాన్ని స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది; బలం మరియు స్థిరసాహసం రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: లింగసూచక ప్రతినిధి భాష
  choice: ప్రతి మనిషి
  alternative: ప్రతి వ్యక్తి; ఎవరైనా
  rationale: మూలంలో אִישׁ అనే పుంలింగ ఏకవచనం పంపిణీ నిర్మాణంలో ఉంది. సందర్భం దానిని లింగరహితం చేయాలని బలవంతం చేయనందున మూలరూపాన్ని నిలిపాం.
- issue: న్యాయపరమైన శిక్ష పదప్రయోగం
  choice: మరణశిక్ష పొందాలి
  alternative: చనిపోవాలి; అతనిని చంపాలి
  rationale: יוּמָת అనేది విధించబడే మరణదండనను సూచిస్తుంది; కేవలం మరణఫలితాన్ని కాదు. అయితే మూలంలో లేని అమలు విధానాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే న్యాయపరమైన గంభీరతను మరియు ప్రోత్సాహక స్వరాన్ని నిలుపుతూ అనువదించబడింది. ప్రధాన పాఠ్యంలో [a] సూచికను చేర్చాం.
