id: JOS.1.1
reference: Joshua 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֛י מ֥וֹת מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֣עַ בִּן נ֔וּן מְשָׁרֵ֥ת מֹשֶׁ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'After the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
translation:
  language: te
  text: 'యహ్వే సేవకుడైన మోషే మరణించిన తరువాత, నూను కుమారుడూ మోషే పరిచారకుడూ[a] అయిన యెహోషువతో యహ్వే ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మోషే సహాయకుడు” లేదా “మోషే సేవకుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת
  choice: మరణించిన తరువాత
  rationale: ఈ కథనారంభ సూత్రం తరువాతి పరిస్థితిని పరిచయం చేస్తుంది. తెలుగులో అనవసరమైన ‘అప్పుడు’ను చేర్చకుండా, కాలసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֶבֶד יְהוָה
  choice: యహ్వే సేవకుడు
  rationale: ఇక్కడ עֶבֶד మోషేకు గౌరవప్రదమైన అధికారిక బిరుదు; బానిసత్వ భావం కంటే దేవునికి ఆయన చేసిన సేవ ప్రధానంగా ఉంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించాం.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడు యెహోషువ
  rationale: తెలుగులో సహజమైన వంశనామ క్రమాన్ని అనుసరించి వ్యక్తినామాలను ప్రామాణికంగా ధ్వన్యంతరీకరించాం.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: మోషే పరిచారకుడు
  rationale: מְשָׁרֵת మరొకరి దగ్గర ఉండి సేవచేసే సహాయకుడిని సూచిస్తుంది. ‘పరిచారకుడు’ ఆ పాత్రను గౌరవప్రదంగా తెలియజేస్తూ, మతపరమైన ప్రత్యేక పదవిని సూచించదు.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: రాబోయే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ రూపాన్ని సహజమైన తెలుగు వాక్యప్రయోగంతోను ద్విబిందువుతోను తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా ధ్వన్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: మోషే బిరుదులోని עֶבֶד
  choice: సేవకుడు
  alternative: బానిస
  rationale: ఈ సందర్భంలో ఇది మోషేకు గౌరవప్రదమైన ఒడంబడిక-సేవా బిరుదు. ‘బానిస’ అనే పదం ఇక్కడ ప్రధానంగా లేని సామాజిక స్థితిని ముందుకు తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. వాక్యారంభంలో మూలంలో స్పష్టంగా లేని ‘ఇప్పుడు’ లేదా ‘అప్పుడు’ చేర్చలేదు; לֵאמֹרను పదశః ‘అంటూ’ అని కాకుండా ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే ‘ఇలా అన్నాడు:’గా అందించాం.
