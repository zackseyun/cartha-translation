translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. సరిహద్దుల వరుసను చదవడానికి సులభంగా ఉంచుతూ ‘ఈ లెబానోను’, ‘మహానది’, ‘సూర్యుడు అస్తమించే దిక్కు’ వంటి మూలపాఠ్య లక్షణాలను నిలిపాం. రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
