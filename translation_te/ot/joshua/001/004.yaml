source:
  edition: WLC
  text: מֵ/הַ/מִּדְבָּר֩ וְ/הַ/לְּבָנ֨וֹן הַ/זֶּ֜ה וְֽ/עַד הַ/נָּהָ֧ר הַ/גָּד֣וֹל נְהַר פְּרָ֗ת כֹּ֚ל אֶ֣רֶץ הַֽ/חִתִּ֔ים וְ/עַד הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֣וֹא הַ/שָּׁ֑מֶשׁ יִֽהְיֶ֖ה גְּבוּלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
translation:
  language: te
  text: అరణ్యం నుంచీ ఈ లెబానోను వరకూ, మహా నది, అంటే యూఫ్రటీసు నది వరకు, హిత్తీయుల దేశమంతా, మహాసముద్రం[a] వరకు, సూర్యుడు అస్తమించే దిశవైపు వరకు[b] మీ సరిహద్దు అవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే మధ్యధరా సముద్రం.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘పడమర వైపు’; అక్షరార్థంగా, ‘సూర్యుడు అస్తమించే దిశవైపు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  choice: అరణ్యం మొదలుకొని
  rationale: מִדְבָּר జనావాసం లేని అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది. నిర్దిష్ట భౌగోళిక ప్రదేశాన్ని అతిగా నిర్ణయించకుండా, బైబిలు భౌగోళిక వాడుకకు సరిపోయేలా ‘అరణ్యం’ ఎంచుకున్నాం.
- source_word: וְהַלְּבָנוֹן הַזֶּה
  choice: ఈ లెబానోను వరకు
  rationale: హీబ్రూలోని స్పష్టమైన సూచనాత్మక పదం הַזֶּהను ‘ఈ’గా నిలిపి, Lebanon అనే స్థలనామాన్ని తెలుగులో ‘లెబానోను’గా లిప్యంతరీకరించాం. సరిహద్దుల వరుస తెలుగులో సహజంగా వినిపించేందుకు ‘వరకు’ను పూరించాం.
- source_word: וְעַד הַנָּהָר הַגָּדוֹל נְהַר פְּרָת
  choice: మహానదియైన యూఫ్రటీసు నది వరకు
  rationale: ‘మహానది’కి వివరణగా ‘యూఫ్రటీసు నది’ వచ్చే హీబ్రూ సమానాధికార నిర్మాణాన్ని ‘మహానదియైన’ అనే రూపంతో స్పష్టంగా, సంక్షిప్తంగా తెలిపాం; עַדను సరిహద్దు సందర్భంలో ‘వరకు’గా అనువదించాం.
- source_word: כֹּל אֶרֶץ הַחִתִּים
  choice: హిత్తీయుల దేశమంతా
  rationale: כֹּל యొక్క సమగ్ర భావాన్ని ‘అంతా’ నిలుపుతుంది; జాతి-భౌగోళిక గుర్తింపును వ్యాఖ్యానాత్మకంగా కుదించకుండా ‘హిత్తీయుల దేశం’గా ఇచ్చాం.
- source_word: וְעַד הַיָּם הַגָּדוֹל
  choice: మహాసముద్రం వరకు
  rationale: ‘మహాసముద్రం’ అనే హీబ్రూ భౌగోళిక బిరుదును ప్రధాన పాఠ్యంలో నిలిపి, అది మధ్యధరా సముద్రమని పాదసూచికలో గుర్తించాం.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: సూర్యుడు అస్తమించే దిక్కున ఉన్న
  rationale: ఈ పదబంధం సూర్యుడు అస్తమించడాన్ని అక్షరార్థంగా చిత్రిస్తూ, సందర్భంలో పడమరను సూచిస్తుంది. తెలుగు పాఠకునికి సహజంగా ఉండేలా దిశాభావాన్ని తెలిపినా, మూలంలోని సూర్యాస్తమయ చిత్రాన్ని నిలిపాం.
- source_word: יִהְיֶה גְּבוּלְכֶם
  choice: మీ సరిహద్దుగా ఉంటుంది
  rationale: గְּבוּל ఇక్కడ భూభాగపు హద్దును సూచిస్తుంది; అందువల్ల ‘సరిహద్దు’ సరైనది. హీబ్రూ అసంపూర్ణ క్రియలోని భవిష్యత్/వాగ్దాన ప్రకటన భావాన్ని ‘ఉంటుంది’ వ్యక్తం చేస్తుంది.
