  variant: modern standard Telugu
source:
  edition: WLC
  text: רַק֩ חֲזַ֨ק וֶֽ/אֱמַ֜ץ מְאֹ֗ד לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ כְּ/כָל הַ/תּוֹרָ֗ה אֲשֶׁ֤ר צִוְּ/ךָ֙ מֹשֶׁ֣ה עַבְדִּ֔/י אַל תָּס֥וּר מִמֶּ֖/נּוּ יָמִ֣ין וּ/שְׂמֹ֑אול לְמַ֣עַן תַּשְׂכִּ֔יל בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
translation:
  language: te
  text: 'నీవు మాత్రం బలంగాను ఎంతో ధైర్యంగాను ఉండు. నా సేవకుడైన మోషే నీకు ఆజ్ఞాపించిన ధర్మశాస్త్రమంతటినీ అనుసరించి ఆచరించడంలో జాగ్రత్త వహించు. దానినుంచి కుడికిగానీ ఎడమకిగానీ తొలగిపోవద్దు. దీనివల్ల నీవు ఎక్కడికి వెళ్లినా వివేకంతో వ్యవహరిస్తావు.[a]


    [a] లేదా “నీవు ఎక్కడికి వెళ్లినా సఫలమవుతావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీవు ఎక్కడికి వెళ్లినా సఫలమవుతావు.”
    reason: תַּשְׂכִּיל అనే పదం ‘వివేకంతో వ్యవహరించు’తో పాటు ‘సఫలమవు/విజయం పొందు’ అనే ఫలితార్థాన్నీ కలిగి ఉండవచ్చు.
lexical_decisions:
- source_word: רַק
  choice: నీవు మాత్రం
  rationale: ఈ సందర్భంలో ఆజ్ఞను ప్రత్యేకంగా నొక్కిచెప్పే పరిమితి/ఉద్ఘాటన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֲזַק וֶאֱמַץ מְאֹד
  choice: బలంగా, ఎంతో ధైర్యంగా ఉండు
  rationale: జంట ఆజ్ఞల్లోని బలం, స్థిరధైర్యం అనే భావాలను నిలుపుతూ מְאֹד ఇచ్చే తీవ్రతను ‘ఎంతో’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: ఆచరించడంలో జాగ్రత్త వహించు
  rationale: కాపాడుకోవడం/శ్రద్ధగా గమనించడం మరియు కార్యరూపంలో పెట్టడం అనే రెండు భావాలనూ సహజంగా కలుపుతుంది.
- source_word: כְּכָל הַתּוֹרָה
  choice: ధర్మశాస్త్రమంతటినీ అనుసరించి
  rationale: మోషే ద్వారా ఇవ్వబడిన నిబంధనాత్మక ఆజ్ఞల సమగ్రతను సూచిస్తుంది; ‘అంతటినీ’ సంపూర్ణ పరిధిని నిలుపుతుంది.
- source_word: אֲשֶׁר צִוְּךָ מֹשֶׁה עַבְדִּי
  choice: నా సేవకుడైన మోషే నీకు ఆజ్ఞాపించిన
  rationale: సంబంధ వాక్యాన్ని, మోషేకు దేవుడు ఇచ్చిన ‘నా సేవకుడు’ అనే గుర్తింపును నేరుగా నిలుపుతుంది.
- source_word: אַל תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  choice: దానినుంచి కుడికిగానీ ఎడమకిగానీ తొలగిపోవద్దు
  rationale: నిర్దేశిత మార్గం నుంచి ఏ వైపుకూ మళ్లకూడదనే దిశాత్మక రూపకాన్ని కాపాడుతుంది.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: ముందటి ఆజ్ఞకు అనుసంధానమైన ఉద్దేశం/ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ఖచ్చితమైన ఉద్దేశార్థం సందర్భంలో అంతర్లీనంగా ఉంటుంది.
- source_word: תַּשְׂכִּיל
  choice: వివేకంతో వ్యవహరిస్తావు
  rationale: హిఫిల్ రూపంలోని వివేకపూర్వకంగా, సమర్థంగా ప్రవర్తించడం అనే ప్రాథమిక భావాన్ని ముందుకు తెస్తుంది; ‘సఫలమవడం’ అనే ఫలితార్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: నీవు ఎక్కడికి వెళ్లినా
  rationale: הלך అనే ‘వెళ్లు/నడుచు’ భావాన్నీ, సమగ్ర పరిధినీ సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: నిబంధన సందర్భంలో תּוֹרָה అర్థం
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం
  rationale: ఇక్కడ మోషే ఆజ్ఞాపించిన నిబంధనాత్మక ఆదేశాలే ప్రత్యక్ష సందర్భం కాబట్టి ‘ధర్మశాస్త్రం’ మరింత నిర్దిష్టం; విస్తృతమైన ‘ఉపదేశం’ భావాన్ని ప్రధాన పాఠ్యంలో ఎంచుకోలేదు.
- issue: תַּשְׂכִּיל అర్థం
  choice: వివేకంతో వ్యవహరించు
  alternative: సఫలమవు
  rationale: హీబ్రూ పదం వివేకపూర్వక ప్రవర్తనను, దాని ఫలితంగా కలిగే సాఫల్యాన్ని రెండింటినీ సూచించగలదు. భౌతిక అభివృద్ధి భావాన్ని అతిగా రుద్దకుండా ప్రధాన పాఠ్యంలో వివేక భావాన్ని ఉంచి, సాఫల్య భావాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా దేవుని ఆజ్ఞకు తగిన గంభీరతతో రూపొందించబడింది. దిశాత్మక రూపకం, ఆజ్ఞ యొక్క సంపూర్ణత, వివేకం–సాఫల్యం మధ్య ఉన్న మూలభాషా ఉద్వేగం నిలుపబడ్డాయి.
