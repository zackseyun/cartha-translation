  source_fidelity: 'మొత్తంగా మూలహీబ్రూ వాక్యార్థాన్ని విశ్వసనీయంగా అందిస్తుంది: బలము–ధైర్యమనే జంట ఆజ్ఞ, మోషేకు దేవుడు ఇచ్చిన ‘నా సేవకుడు’ అనే గుర్తింపు, ధర్మశాస్త్రాన్ని పూర్తిగా ఆచరించాలనే ఆజ్ఞ, కుడి–ఎడమల రూపకం, మరియు שׂכל యొక్క వివేకం/సాఫల్యం పరిధి నిలిచాయి. అయితే לְמַעַן ప్రధానంగా ఉద్దేశాన్ని సూచిస్తుంది; ‘అప్పుడు’ కేవలం కాలానుక్రమ/ఫలిత సంబంధాన్ని సూచించగలదు. ‘దీనివల్ల’ ఉద్దేశ–ఫలిత సంబంధాన్ని మరింత స్పష్టంగా నిలుపుతుంది.'
