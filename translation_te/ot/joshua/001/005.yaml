source:
  edition: WLC
  text: לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ לְ/פָנֶ֔י/ךָ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ כַּֽ/אֲשֶׁ֨ר הָיִ֤יתִי עִם מֹשֶׁה֙ אֶהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א אַרְפְּ/ךָ֖ וְ/לֹ֥א אֶעֶזְבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
translation:
  language: te
  text: నీ జీవితకాలమంతా ఏ మనిషీ నీ ఎదుట నిలువలేడు.[a][b] నేను మోషేతో ఉన్నట్లే నీతోనూ ఉంటాను. నేను నీపై నా పట్టును సడలించను; నిన్ను విడిచిపెట్టను.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరూ నీ ఎదుట నిలబడలేరు.” హీబ్రూ నుడికారం విజయవంతంగా ఎదిరించి నిలబడలేకపోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఏ మనిషీ” అని ఉన్న హీబ్రూ పదం పుంలింగ ఏకవచనంలో ఉన్నా, ఇక్కడ అది ఏ మానవ ప్రత్యర్థినైనా సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నేను నిన్ను చేజారనివ్వను; నిన్ను విడిచిపెట్టను.” మొదటి క్రియలో పట్టును సడలించకపోవడం లేదా ఆధారాన్ని ఉపసంహరించకపోవడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב
  choice: నిలువలేడు
  rationale: హిత్పయేల్ రూపం ఇక్కడ ఎదిరించి నిలబడడాన్ని సూచిస్తుంది. విజయవంతంగా ప్రతిఘటించలేరనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ఏ మనిషీ
  rationale: పుంలింగ ఏకవచన రూపం ఇక్కడ సాధారణ మానవ ప్రత్యర్థిని సూచిస్తుంది. మూలంలోని రూపాన్ని నిలుపుతూ తెలుగు వాక్యంలో సమగ్రార్థాన్ని ఇస్తుంది.
- source_word: לְפָנֶיךָ
  choice: నీ ఎదుట
  rationale: అక్షరార్థంగా ‘నీ ముఖం ఎదుట’; యుద్ధ సందర్భంలో ‘నీకు ఎదురుగా/నీకు విరోధంగా’ అనే భావాన్ని మోసే హీబ్రూ నుడికారాన్ని నిలుపుతుంది.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: నీ జీవితకాలమంతా
  rationale: జీవితంలోని అన్ని రోజులనూ సూచించే సహజమైన, సంక్షిప్త తెలుగు సమానం.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: నేను మోషేతో ఉన్నట్లే
  rationale: כַּאֲשֶׁר లోని పోలికను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶהְיֶה עִמָּךְ
  choice: నీతోనూ ఉంటాను
  rationale: దేవుని వాగ్దానపూర్వక సన్నిధిని అదనపు వ్యాఖ్యానం లేకుండా నేరుగా తెలియజేస్తుంది.
- source_word: אַרְפְּךָ
  choice: నిన్ను చేజారనివ్వను
  rationale: רפה హిఫీల్ రూపంలోని పట్టును సడలించడం, జారనివ్వడం, ఆదరణను ఉపసంహరించుకోవడం వంటి భావాన్ని రెండవ క్రియతో భేదం కనిపించేలా వ్యక్తం చేస్తుంది.
- source_word: אֶעֶזְבֶךָּ
  choice: నిన్ను విడిచిపెట్టను
  rationale: עזב యొక్క విడిచిపెట్టు/త్యజించు అనే ప్రధాన భావాన్ని గంభీరమైనా సాధారణంగా అర్థమయ్యే తెలుగులో ఇస్తుంది.
theological_decisions:
- issue: אִישׁ అనే సాధారణ పుంలింగ రూపం
  choice: ఏ మనిషీ
  alternative: ఎవరూ; ఏ ప్రత్యర్థీ
  rationale: మూలంలోని పుంలింగ ఏకవచనాన్ని నిలుపుతుంది; సందర్భంలో అది ఏ మానవ ప్రత్యర్థినైనా సాధారణంగా సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- issue: לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ అనే ద్వంద్వ వాగ్దానం
  choice: నేను నిన్ను చేజారనివ్వను; నిన్ను విడిచిపెట్టను
  alternative: నేను నీ విషయంలో విఫలం కాను; నిన్ను త్యజించను
  rationale: మొదటి క్రియలోని పట్టును సడలించకపోవడం/ఆదరణను ఉపసంహరించకపోవడం అనే చిత్రాన్ని, రెండవ క్రియలోని విడిచిపెట్టడం అనే భావం నుంచి వేరుగా ఉంచుతుంది.
