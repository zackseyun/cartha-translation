  text: וְ/לָ/רֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה אָמַ֥ר יְהוֹשֻׁ֖עַ לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/012.yaml
  text: And to the Reubenites[a], and to the Gadites, and to the half-tribe of Manasseh, Joshua said,
translation:
  language: te
  text: రూబేనీయులకు, గాదీయులకు, మనష్షే అర్ధగోత్రానికి యెహోషువ ఇలా చెప్పాడు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘చెప్పుతూ’ అని ఉంది. ఈ పదం తరువాతి వచనంలో కొనసాగే యెహోషువ మాటలను పరిచయం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  choice: రూబేనీయులతో
  rationale: ఏకవచన జాతివాచక రూపం ఇక్కడ సమూహార్థకంగా ఉంది. తెలుగులో సంబోధింపబడిన వర్గాన్ని సహజంగా తెలియజేయడానికి బహువచన సమూహరూపం వాడబడింది; לְ సందర్భానుసారంగా ‘తో’గా వ్యక్తమైంది.
- source_word: וְ/לַ/גָּדִי
  choice: గాదీయులతో
  rationale: జాతివాచక ఏకవచనం సమూహార్థకంగా వాడబడింది. సమాంతర నిర్మాణాన్ని, సహజ తెలుగు వాక్యరీతిని కాపాడేందుకు ‘గాదీయులతో’ అని అనువదించబడింది.
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַֽ/מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రపు వారితో
  rationale: మూలంలోని ‘మనష్షే గోత్రంలో సగం’ అనే భావాన్ని, వ్యక్తుల సమూహాన్ని ఉద్దేశిస్తున్న సందర్భానికి తగిన సహజమైన తెలుగు రూపంలో తెలిపింది.
- source_word: אָמַר
  choice: అన్నాడు
  rationale: אמר అనే సాధారణ మాటల క్రియకు, తరువాత వచ్చే ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే సందర్భంలో ‘అన్నాడు’ సహజమైన, ఖచ్చితమైన తెలుగు సమానం.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో లిప్యంతరీకరించింది.
- source_word: לֵ/אמֹר
  choice: ఇలా
  rationale: ‘చెప్పుతూ/అని చెప్పడానికి’ అనే ప్రసంగ-పరిచయ క్రియను తెలుగులో తరువాతి వచనంలో కొనసాగే మాటలను సూచించే సహజమైన ‘ఇలా అన్నాడు’ నిర్మాణంతో వ్యక్తం చేసింది.
