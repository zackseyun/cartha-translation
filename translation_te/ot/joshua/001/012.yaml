translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని మూడు సమూహాల సమాంతర నిర్మాణం నిలుపబడింది; తరువాతి వచనంలో ప్రసంగం కొనసాగుతుందని కోలన్ సూచిస్తుంది.
