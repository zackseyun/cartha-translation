id: JOS.1.13
reference: Joshua 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
translation:
  language: te
  text: 'యాహ్వే సేవకుడైన మోషే మీకు ఆజ్ఞాపించిన మాటను జ్ఞాపకం చేసుకోండి: “మీ దేవుడైన యాహ్వే మీకు విశ్రాంతి కలిగిస్తున్నాడు; ఈ దేశాన్ని మీకు ఇచ్చాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ దేశాన్ని మీకు ఇస్తాడు.” హీబ్రూ క్రియారూపం పూర్తయిన కార్యాన్ని లేదా నిశ్చయంగా నెరవేరబోయే కార్యాన్ని సూచించగలదు.
    reason: וְנָתַן లోని కాలాంశ సంబంధమైన నిజమైన అస్పష్టతను నిలుపుటకు.
lexical_decisions:
- source_word: זָכוֹר
  choice: జ్ఞాపకం చేసుకోండి
  rationale: זכר అనే క్రియ యొక్క ఆజ్ఞార్థక రూపం. గతంలో ఇచ్చిన ఆజ్ఞను మనస్సులో ఉంచుకొని దాని ప్రకారం నడుచుకోవాలనే పిలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַדָּבָר
  choice: మాటను
  rationale: דבר ఇక్కడ మోషే ఇచ్చిన పూర్వ ఆదేశంలోని విషయాన్ని సూచిస్తుంది. వెంటనే వచ్చే צִוָּה ఆదేశ స్వభావాన్ని స్పష్టం చేస్తున్నందున ‘ఆజ్ఞ’ అని రెండుసార్లు బలపరచకుండా ‘మాట’ అని అనువదించబడింది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: మోషే ఇచ్చిన అధికారపూర్వక నిర్దేశాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: עֶבֶד יְהוָה
  choice: యాహ్వే సేవకుడైన
  rationale: עבד కు దాసుడు లేదా సేవకుడు అనే అర్థాలు ఉండవచ్చు; మోషేకు సంబంధించిన ఈ గౌరవపూర్వక బిరుదులో దేవునికి నియమిత సేవ అనే భావం ప్రధానమైనందున ‘సేవకుడు’ ఎంచుకోబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా ఇచ్చింది.
- source_word: לֵאמֹר
  choice: అతడు ఇలా అన్నాడు
  rationale: ఉద్ధరణను పరిచయం చేసే హీబ్రూ రూపాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది; ఇక్కడ కర్త మోషే.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రెండవ పురుష బహువచన ప్రత్యయాన్ని, ఇశ్రాయేలు గోత్రాలతో ఉన్న నిబంధనా సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: מֵנִיחַ
  choice: మీకు విశ్రాంతి కలిగిస్తున్నాడు
  rationale: హిఫిల్ కృదంతం విశ్రాంతి కలిగించడం లేదా స్థిరమైన ఉపశమనం ఇవ్వడం అనే భావాన్ని కలిగి ఉంది. కృదంతపు కొనసాగుతున్న భావాన్ని ‘కలిగిస్తున్నాడు’ నిలుపుతుంది.
- source_word: וְנָתַן
  choice: ఇచ్చాడు
  rationale: హీబ్రూ సంపూర్ణ క్రియారూపాన్ని, యొర్దాను తూర్పున ఉన్న గోత్రాలకు వారి స్వాస్థ్యం అప్పటికే కేటాయించబడిన కథా సందర్భాన్ని అనుసరించి పూర్తయిన కార్యంగా అనువదించింది. భవిష్యత్ లేదా నిశ్చిత వాగ్దాన భావం సాధ్యమైనందున ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ఈ దేశాన్ని
  rationale: సూచించబడుతున్న నిర్దిష్ట భూభాగాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా ధ్వన్యనుకరణగా నిలుపబడింది.
- issue: וְנָתַן యొక్క కాలాంశం
  choice: ఈ దేశాన్ని మీకు ఇచ్చాడు
  alternative: ఈ దేశాన్ని మీకు ఇస్తాడు
  rationale: ఈ వాక్యంలోని సంపూర్ణ క్రియారూపం పూర్తయిన అనుగ్రహాన్నీ, సందర్భానుసారంగా నిశ్చిత భవిష్యత్తునీ సూచించగలదు. యొర్దాను తూర్పు గోత్రాల భూమి అప్పటికే కేటాయించబడిన కథా సందర్భం వల్ల పూర్తయిన భావాన్ని ప్రధాన పాఠంలో ఉంచి, భవిష్యత్ భావాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గ్రంథపఠనానికి తగిన గౌరవప్రద శైలిలో రూపొందించబడింది. బహువచన సంబోధనను ‘మీకు/చేసుకోండి’ ద్వారా నిలిపింది.
