  yaml_path: translation/ot/joshua/001/016.yaml
  text: And they answered Joshua[a], saying, “All that you have commanded us we will do, and wherever you send us we will go.”
translation:
  language: te
  text: 'వారు యెహోషువకు ఇలా జవాబిచ్చారు: “నీవు మాకు ఆజ్ఞాపించినదంతా మేము చేస్తాము; నీవు మమ్మల్ని ఎక్కడికి పంపినా అక్కడికి వెళ్తాము.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ לֵאמֹר
  choice: వారు యెహోషువకు ఇలా జవాబిచ్చారు
  rationale: ענה అనే క్రియ కథనంలో ప్రతిస్పందనను సూచిస్తుంది; אֶת ఇక్కడ జవాబు ఎవరికి చెప్పబడిందో తెలియజేస్తుంది. לֵאמֹר అనే సూత్రప్రాయ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఇలా’ ద్వారా వ్యక్తం చేశాం.
- source_word: כֹּל אֲשֶׁר צִוִּיתָנוּ
  choice: నీవు మాకు ఆజ్ఞాపించినదంతా
  rationale: כֹּל אֲשֶׁר సంపూర్ణతను, צוה అధికారపూర్వక ఆజ్ఞను సూచిస్తాయి. ‘ఆజ్ఞాపించినదంతా’ మూల భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: נַעֲשֶׂה
  choice: మేము చేస్తాము
  rationale: עשה ఇక్కడ ఆజ్ఞాపించిన దానిని చేయడం లేదా అమలు చేయడం అనే భావంలో ఉంది; ‘చేస్తాము’ నేరుగా, సహజంగా ఉంది.
- source_word: וְאֶל כָּל אֲשֶׁר תִּשְׁלָחֵנוּ
  choice: నీవు మమ్మల్ని ఎక్కడికి పంపినా
  rationale: అక్షరార్థంగా ‘నీవు మమ్మల్ని పంపే ప్రతి చోటికి’ అనే స్థానార్థక భావం ఉంది. ‘ఎక్కడికి పంపినా’ ఆ విస్తృతతను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: נֵלֵךְ
  choice: అక్కడికి వెళ్తాము
  rationale: הלך అంటే ‘వెళ్లు’. గమ్యస్థానం ముందున్న ‘ఎక్కడికి’లో సూచించబడినందున, తెలుగులో వాక్యాన్ని స్పష్టంగా పూర్తి చేయడానికి ‘అక్కడికి’ ఉపయోగించాం.
