translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలిని ఉపయోగించాం. యెహోషువను ఉద్దేశించిన ఏకవచన సంబోధనను మూలంలోని రెండవ పురుష ఏకవచన రూపాలకు అనుగుణంగా ‘నీవు’గా నిలిపాం.
