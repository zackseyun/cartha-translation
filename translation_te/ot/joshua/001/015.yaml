review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Hebrew sequence: Yahweh grants rest to the other tribes as to the Transjordan tribes; the other tribes take possession of the land Yahweh is giving; then the addressed tribes return and possess their allotted land east of the Jordan. The explicit main-clause instruction, supplied from the preceding verse (''మీరు వారికి సహాయం చేయాలి''), is necessary for a complete Telugu sentence and does not alter this verse''s sense.'
  naturalness: The translation is clear and suitably formal. Replacing the less idiomatic phrase 'మీ స్వాస్థ్య దేశం' with 'మీ స్వాస్థ్యభూమి' more naturally conveys the allotted/inherited territory in modern standard Telugu. Using 'భూమి' also better matches הארץ in this context.
  terminology: '''యెహోవా,'' ''విశ్రాంతి,'' ''సోదరులు,'' and ''స్వాధీనం చేసుకొను'' are appropriate. ''స్వాస్థ్యభూమి'' preserves the inheritance/possession sense of אֶרֶץ יְרֻשַּׁתְכֶם without implying a modern nation-state.'
  issues:
  - severity: low
    issue: ‘మీ స్వాస్థ్య దేశం’ is an awkward and slightly over-specific rendering.
    rationale: The Hebrew means the land/territory of their possession or inheritance. ‘మీ స్వాస్థ్యభూమి’ is more idiomatic Telugu and is closer to the geographical-allotment sense of הארץ.
  revised_text: యెహోవా మీకు విశ్రాంతి అనుగ్రహించినట్లే మీ సోదరులకు[a] కూడా విశ్రాంతి అనుగ్రహించి, మీ దేవుడైన యెహోవా వారికి ఇస్తున్న భూమిని వారూ స్వాధీనం చేసుకునే వరకు మీరు వారికి సహాయం చేయాలి. ఆ తరువాత మీరు యొర్దాను అవతల[b], సూర్యోదయ దిక్కున, యెహోవా సేవకుడైన మోషే మీకు ఇచ్చిన మీ స్వాస్థ్యభూమికి తిరిగి వచ్చి, దాన్ని స్వాధీనం చేసుకోవాలి.
