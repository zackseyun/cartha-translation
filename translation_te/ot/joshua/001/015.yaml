  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔מָּה אֶת הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם נֹתֵ֣ן לָ/הֶ֑ם וְ/שַׁבְתֶּ֞ם לְ/אֶ֤רֶץ יְרֻשַּׁתְ/כֶם֙ וִֽ/ירִשְׁתֶּ֣ם אוֹתָ֔/הּ אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
translation:
  language: te
  text: యెహోవా మీకు విశ్రాంతి అనుగ్రహించినట్లే మీ సోదరులకు[a] కూడా విశ్రాంతి అనుగ్రహించి, మీ దేవుడైన యెహోవా వారికి ఇస్తున్న భూమిని వారూ స్వాధీనం చేసుకునే వరకు మీరు వారికి సహాయం చేయాలి. ఆ తరువాత మీరు యొర్దాను అవతల[b], సూర్యోదయ దిక్కున, యెహోవా సేవకుడైన మోషే మీకు ఇచ్చిన మీ స్వాస్థ్యభూమికి తిరిగి వచ్చి, దాన్ని స్వాధీనం చేసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, మీ తోటి ఇశ్రాయేలీయులకు; హీబ్రూ మూలంలో అక్షరార్థంగా ‘మీ సోదరులకు’ అని ఉంది. ఇక్కడ అది ఇశ్రాయేలు ఇతర గోత్రాలవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, తూర్పున; హీబ్రూ మూలంలో అక్షరార్థంగా ‘సూర్యోదయ దిక్కున’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: విశ్రాంతి అనుగ్రహించి
  rationale: హిఫిల్ రూపం యుద్ధం నుంచి ఉపశమనంతో కూడిన స్థిరనివాసాన్ని ప్రసాదించడాన్ని సూచిస్తుంది. ‘విశ్రాంతి అనుగ్రహించు’ దైవిక ప్రసాద భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַאֲחֵיכֶם
  choice: మీ సహోదరులకు
  rationale: హీబ్రూ పదం పురుష బహువచనంలో ‘మీ సోదరులు’ అని ఉన్నా, ఇక్కడ ఇతర ఇశ్రాయేలు గోత్రాలవారిని సూచిస్తుంది. ‘సహోదరులు’ మూలంలోని బంధుత్వ రూపకాన్ని నిలుపుతుంది.
- source_word: כָּכֶם
  choice: మీకు ... అనుగ్రహించినట్లే
  rationale: హీబ్రూలో ‘మీలాగే’ అని సంక్షిప్త పోలిక ఉంది; సందర్భంలోని ‘విశ్రాంతి అనుగ్రహించు’ అనే క్రియాభావాన్ని తెలుగులో సహజంగా పూరించాం.
- source_word: וְיָרְשׁוּ
  choice: స్వాధీనం చేసుకునే
  rationale: యుద్ధం మరియు భూవిభజన సందర్భంలో ירשׁ భూమిని వారసత్వంగా పొంది అధీనంలోకి తీసుకోవడాన్ని సూచిస్తుంది.
- source_word: נֹתֵן
  choice: ఇస్తున్న
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న లేదా సమీపంలో నెరవేరనున్న దైవిక అనుగ్రహాన్ని సూచిస్తుంది.
- source_word: אֶרֶץ יְרֻשַּׁתְכֶם
  choice: మీ స్వాస్థ్య దేశం
  rationale: వారికి కేటాయించబడిన వారసత్వ భూభాగం అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְשַׁבְתֶּם ... וִירִשְׁתֶּם
  choice: తిరిగి వచ్చి, దాన్ని స్వాధీనం చేసుకోవాలి
  rationale: హీబ్రూ వరుసక్రమాన్ని తెలుగులో స్పష్టమైన భవిష్యదాజ్ఞ భావంతో అందిస్తుంది.
- source_word: עֶבֶד יְהוָה
  choice: యెహోవా సేవకుడు
  rationale: మోషేకు గౌరవప్రదమైన అధికారిక సేవా బిరుదు; బానిసత్వ భావం ఇక్కడ ఉద్దేశం కాదు.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: భౌగోళిక పదబంధాన్ని సహజంగా ఉంచుతూ, దృష్టికోణాన్ని సందర్భానికే వదిలేస్తుంది.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: సూర్యోదయ దిక్కున
  rationale: తూర్పు అనే అర్థంతో పాటు మూలంలోని స్పష్టమైన సూర్యోదయ చిత్రాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తింపుపొందిన వ్యక్తినామ రూపమైన ‘యెహోవా’ను ఉపయోగించాం; ‘ప్రభువు’గా మార్చకుండా మూలంలోని ఒడంబడిక నామాన్ని వ్యక్తినామంగానే నిలిపాం.
- issue: אֲחֵיכֶם లోని లింగసూచక బంధుత్వ పదం
  choice: మీ సహోదరులు
  alternative: మీ తోటి ఇశ్రాయేలీయులు
  rationale: మూలంలోని పురుష బహువచన బంధుత్వ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో అది ఇతర ఇశ్రాయేలు గోత్రాలవారిని సూచిస్తుందని పాదటిప్పణిలో తెలిపాం.
- issue: విశ్రాంతి భావం
  choice: విశ్రాంతి అనుగ్రహించు
  alternative: యుద్ధం నుంచి ఉపశమనం కలిగించు
  rationale: ఇది కేవలం వ్యక్తిగత విశ్రాంతి కాక, దేవుడు ప్రసాదించే యుద్ధవిరామం మరియు స్థిరనివాసాన్ని కలిపిన భావం; విస్తృతమైన ధార్మిక ఉద్వేగాన్ని కుదించకుండా ‘విశ్రాంతి’ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని ప్రధాన వాక్యానికి ముందున్న ‘వరకు’ ఉపవాక్యం తెలుగులో సంపూర్ణంగా ఉండేందుకు, మునుపటి వచనం నుంచి అర్థమయ్యే ‘మీరు వారికి సహాయం చేయాలి’ అనే భావాన్ని స్పష్టంగా పూరించాం. ‘స్వాస్థ్యం’, ‘స్వాధీనం’, ‘విశ్రాంతి’ వంటి స్థిరమైన బైబిలు పదాలను సహజ వాక్యనిర్మాణంతో వాడాం.
