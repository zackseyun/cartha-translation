source:
  edition: WLC
  text: עִבְר֣וּ בְּ/קֶ֣רֶב הַֽ/מַּחֲנֶ֗ה וְ/צַוּ֤וּ אֶת הָ/עָם֙ לֵ/אמֹ֔ר הָכִ֥ינוּ לָ/כֶ֖ם צֵידָ֑ה כִּ֞י בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים אַתֶּם֙ עֹֽבְרִים֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם נֹתֵ֥ן לָ/כֶ֖ם לְ/רִשְׁתָּֽ/הּ׀־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
translation:
  language: te
  text: 'శిబిరం మధ్యగా వెళ్లి ప్రజలకు ఇలా ఆజ్ఞాపించండి: “మీ కోసం ప్రయాణానికి కావలసిన సరఫరాలను సిద్ధం చేసుకోండి. ఎందుకంటే ఇంకా మూడు రోజుల్లో[a] మీరు ఈ యొర్దానును దాటి, మీ దేవుడైన యాహ్వే మీకు ఇస్తున్న దేశంలోకి ప్రవేశించి దానిని స్వాధీనం చేసుకోబోతున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మరో మూడు రోజుల్లో” లేదా “మూడు రోజుల తర్వాత.” హెబ్రీ పదబంధం దాటడానికి ముందు ఇంకా కొద్దికాలం మిగిలి ఉందని సూచిస్తుంది.
    reason: కాలసంబంధ హెబ్రీ పదబంధానికి ఉన్న సహజ ప్రత్యామ్నాయ అనువాదాలను తెలియజేయడం.
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  choice: శిబిరం మధ్యగా వెళ్లి
  rationale: ఆజ్ఞార్థక బహువచన రూపాన్నీ, శిబిరం లోపలి భాగాల గుండా వెళ్లాలనే spatial భావాన్నీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְצַוּוּ אֶת הָעָם לֵאמֹר
  choice: ప్రజలకు ఇలా ఆజ్ఞాపించండి
  rationale: צוה లోని అధికారపూర్వక ఆజ్ఞ భావాన్ని నిలుపుతూ, לֵאמֹר అనే ఉల్లేఖన సూచనను తెలుగులో సహజమైన ‘ఇలా’తో వ్యక్తం చేస్తుంది.
- source_word: הָכִינוּ לָכֶם צֵידָה
  choice: మీ కోసం ప్రయాణానికి కావలసిన ఆహార సామగ్రిని సిద్ధం చేసుకోండి
  rationale: צֵידָה సాధారణ ఆహారం కంటే ప్రయాణానికి సిద్ధం చేసుకునే provisions‌ను సూచిస్తుంది; לָכֶם లోని స్వప్రయోజన భావమూ నిలిచింది.
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: ఇంకా మూడు రోజులలో
  rationale: దాటడానికి ముందు మిగిలి ఉన్న స్వల్ప కాలాన్ని సహజంగా వ్యక్తం చేస్తుంది; కాలసంబంధ నిర్మాణంలోని ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో ఉంచింది.
- source_word: אַתֶּם עֹבְרִים
  choice: మీరు ... దాటి ... స్వాధీనం చేసుకోబోతున్నారు
  rationale: హెబ్రీ భాగధాతువు తెలిపే సమీప భవిష్యత్తు, నిశ్చిత కార్య భావాలను తెలుగులో ‘బోతున్నారు’తో సహజంగా వ్యక్తం చేసింది.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: ఈ యొర్దాను
  rationale: సూచనార్థకమైన הַזֶּה ను ‘ఈ’గా నిలుపుతూ, నది సంప్రదాయ తెలుగు పేరును ఉపయోగించింది.
- source_word: לָבוֹא לָרֶשֶׁת אֶת הָאָרֶץ
  choice: దేశంలోకి ప్రవేశించి దాన్ని స్వాధీనం చేసుకోవడానికి
  rationale: లోపలికి వెళ్లడం మరియు స్వాధీనం చేసుకోవడం అనే జత ఉద్దేశాలను స్పష్టంగా ఉంచుతుంది; ירשׁ లోని వారసత్వం/ఆక్రమణ సందర్భపు possession భావాన్ని ‘స్వాధీనం చేసుకోవడం’ తెలియజేస్తుంది.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యాహ్వే
  rationale: దైవనామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించి, నిబంధన సంబంధ సూత్రాన్ని సహజ తెలుగు క్రమంలో అందిస్తుంది.
- source_word: נֹתֵן לָכֶם
  choice: మీకు ... ఇస్తున్న
  rationale: భాగధాతువు సూచించే కొనసాగుతున్న, నిశ్చితమైన దాన భావాన్ని వర్తమాన కృదంతంతో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తున్నందున దాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించిన ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణను వాడింది.
- issue: దేశాన్ని దేవుడు ఇస్తుండగా ప్రజలు దాన్ని స్వాధీనం చేసుకోవడం
  choice: దైవిక దానం మరియు మానవ స్వాధీన కార్యం రెండింటినీ అలాగే ఉంచడం
  alternative: ఒక అంశాన్ని మరొకదానిలో కలిపి వివరించడం
  rationale: వాక్యంలో ఉన్న theological tension‌ను పరిష్కరించకుండా, ‘ఇస్తున్న’ మరియు ‘స్వాధీనం చేసుకోవడం’ అనే రెండు భావాలనూ స్పష్టంగా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ఆజ్ఞ యొక్క అధికార స్వరం నిలుపబడింది; అవసరం లేని ప్రాచీన పదజాలం నివారించబడింది. పాదసూచిక గుర్తు అది వివరిస్తున్న కాలపదబంధం వెంటనే ఉంచబడింది.
