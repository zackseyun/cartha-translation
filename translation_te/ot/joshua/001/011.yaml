revisions:
- from: 'శిబిరం మధ్యగా వెళ్లి ప్రజలకు ఇలా ఆజ్ఞాపించండి: “మీ కోసం ప్రయాణానికి కావలసిన ఆహార సామగ్రిని సిద్ధం చేసుకోండి. ఎందుకంటే ఇంకా మూడు రోజులలో[a] మీరు ఈ యొర్దాను దాటి, మీ దేవుడైన యాహ్వే మీరు స్వాధీనం చేసుకోవడానికి ఇస్తున్న దేశంలోకి ప్రవేశించి దాన్ని స్వాధీనం చేసుకోబోతున్నారు.”'
  to: 'శిబిరం మధ్యగా వెళ్లి ప్రజలకు ఇలా ఆజ్ఞాపించండి: “మీ కోసం ప్రయాణానికి కావలసిన సరఫరాలను సిద్ధం చేసుకోండి. ఎందుకంటే ఇంకా మూడు రోజుల్లో[a] మీరు ఈ యొర్దానును దాటి, మీ దేవుడైన యాహ్వే మీకు ఇస్తున్న దేశంలోకి ప్రవేశించి దానిని స్వాధీనం చేసుకోబోతున్నారు.”'
  rationale: సవరణ మూలంలోని ‘మీకు ఇస్తున్నాడు’ అనే దైవిక దాన భావాన్ని స్పష్టంగా పునరుద్ధరిస్తుంది. అలాగే ప్రవేశించడం మరియు స్వాధీనం చేసుకోవడం అనే జత ఉద్దేశాలను నిలుపుతూ, ప్రయాణానికి కావలసిన provisions‌కు సహజమైన తెలుగు పదాన్ని ఉపయోగిస్తుంది. కాలసంబంధ పాదసూచిక గుర్తు సంబంధిత పదబంధం వద్దనే ఉంచబడింది.
