  yaml_path: translation/ot/joshua/001/010.yaml
  text: Then Joshua commanded the officers of the people, saying,
translation:
  language: te
  text: 'అప్పుడు యెహోషువ ప్రజల అధికారులకు ఇలా ఆజ్ఞాపించాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: అప్పుడు ... ఆజ్ఞాపించాడు
  rationale: צוה క్రియ యొక్క ఆదేశ బలాన్ని ‘ఆజ్ఞాపించాడు’ నిలుపుతుంది; వయిక్తోల్ కథనాన్ని ముందుకు నడిపే క్రమాన్ని సహజమైన తెలుగులో ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి స్వతంత్ర పదం అవసరం లేదు. ‘ప్రజల అధికారులకు’ అనే నిర్మాణంలో దాని వ్యాకరణ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: שֹׁטְרֵי
  choice: అధికారులకు
  rationale: ఈ పదం సైనిక సేనాధిపతులకన్నా పరిపాలనా బాధ్యతగల అధికారులను సూచిస్తుంది. ‘అధికారులు’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הָעָם
  choice: ప్రజల
  rationale: עָם ఇక్కడ సమూహంగా ఉన్న ప్రజలను సూచిస్తుంది; ‘ప్రజలు’ ప్రత్యక్షమైన, సహజమైన సమానం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ఈ రూపం తరువాతి వచనంలో వచ్చే ప్రత్యక్ష మాటలను పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా’ అనేది అదే సంభాషణ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; ద్విబిందువు ఆ మాటలు తరువాత వస్తాయని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ఆజ్ఞా బలం, సంఘటనల క్రమం, తరువాతి ప్రత్యక్ష ప్రసంగంతో ఉన్న అనుసంధానం నిలుపబడ్డాయి.
