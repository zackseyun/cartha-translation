  text: הֲ/ל֤וֹא צִוִּיתִ֨י/ךָ֙ חֲזַ֣ק וֶ/אֱמָ֔ץ אַֽל תַּעֲרֹ֖ץ וְ/אַל תֵּחָ֑ת כִּ֤י עִמְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/009.yaml
  text: Have I not commanded you? Be strong and courageous. Do not be terrified[a], and do not be dismayed, for Yahweh your God is with you wherever you go.
translation:
  language: te
  text: నేను నీకు ఆజ్ఞాపించలేదా? బలంగా, ధైర్యంగా ఉండు. భయంతో వణకకు, దిగులుపడకు. ఎందుకంటే నీవు ఎక్కడికి వెళ్లినా నీ దేవుడైన యాహ్వే[a] నీతో ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో YHWH అనే దైవనామం; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు; ‘యెహోవా’ అనేది మరో ప్రసిద్ధ రూపం.
    reason: దైవనామపు మూలరూపం మరియు ప్రాచుర్యంలో ఉన్న ప్రత్యామ్నాయ అనువాదాలను తెలియజేయడం.
lexical_decisions:
- source_word: הֲלוֹא צִוִּיתִיךָ
  choice: నేను నీకు ఆజ్ఞాపించలేదా?
  rationale: ప్రతికూల రూపంలో ఉన్న అలంకారప్రశ్నను సహజమైన తెలుగులో అలాగే ఉంచి, దేవుడు ఇంతకుముందే ఇచ్చిన ఆజ్ఞను బలంగా గుర్తుచేసే భావాన్ని నిలిపింది.
- source_word: חֲזַק וֶאֱמָץ
  choice: బలంగా, ధైర్యంగా ఉండు
  rationale: חזק బలాన్ని లేదా స్థిరత్వాన్ని, אמץ ధైర్యాన్ని సూచిస్తాయి. జంట పదాల ప్రత్యేక భావాలను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా అనువదించబడింది.
- source_word: אַל־תַּעֲרֹץ
  choice: భయంతో వణకకు
  rationale: ערץ సాధారణ భయం కంటే తీవ్రమైన భయాన్నీ బెదిరిపోవడాన్నీ సూచిస్తుంది; ‘భయంతో వణకకు’ ఆ బలమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְאַל־תֵּחָת
  choice: దిగులుపడకు
  rationale: חתת ఇక్కడ మనోధైర్యం కోల్పోవడం, కుంగిపోవడం లేదా దిగులుచెందడం అనే భావాన్ని ఇస్తుంది. సమాంతర వాక్య నిర్మాణంలో ‘దిగులుపడకు’ సహజంగా ఉంది.
- source_word: כִּי עִמְּךָ
  choice: ఎందుకంటే ... నీతో ఉంటాడు
  rationale: כִּי ముందున్న ఆజ్ఞలకు కారణాన్ని పరిచయం చేస్తుంది; עִמְּךָ దేవుని తోడుండే సన్నిధిని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది; אֱלֹהֶיךָను సహజమైన తెలుగు సంబంధ నిర్మాణంలో ‘నీ దేవుడైన’గా ఇచ్చింది.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: నీవు ఎక్కడికి వెళ్లినా
  rationale: పదశః నిర్మాణం కంటే, యెహోషువ వెళ్లే ప్రతి చోటు అనే విస్తృత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוהను అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. అందువల్ల వ్యక్తిగత నామాన్ని నిలుపుతూ ‘యాహ్వే’గా లిప్యంతరీకరించబడింది; పాఠకులకు సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆజ్ఞారూపాలు వాడబడ్డాయి. ఏకవచన సంబోధనను నిలిపింది. మూలంలోని రెండు ప్రతికూల ఆజ్ఞల మధ్య భావభేదాన్ని ‘భయంతో వణకకు, దిగులుపడకు’గా కాపాడింది.
