revisions:
- from: మీ భార్యలు, మీ చిన్నపిల్లలు, మీ పశువులు మోషే మీకు యొర్దాను అవతల ఇచ్చిన దేశంలో ఉండాలి. అయితే మీలోని పరాక్రమవంతులైన యోధులందరూ ఆయుధసన్నద్ధులై[a] మీ సహోదరులకు[b] ముందుగా దాటి వెళ్లి, వారికి సహాయం చేయాలి.
  to: మీ భార్యలు, మీ చిన్నపిల్లలు, మీ పశువులు మోషే మీకు యొర్దాను అవతల ఇచ్చిన దేశంలో ఉండాలి. అయితే పరాక్రమవంతులైన యోధులైన మీరందరూ ఆయుధసన్నద్ధులై[a] మీ సహోదరుల[b] ముందు దాటి వెళ్లి, వారికి సహాయం చేయాలి.
