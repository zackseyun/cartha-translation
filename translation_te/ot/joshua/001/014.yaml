id: JOS.1.14
reference: Joshua 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נְשֵׁי/כֶ֣ם טַפְּ/כֶם֮ וּ/מִקְנֵי/כֶם֒ יֵשְׁב֕וּ בָּ/אָ֕רֶץ אֲשֶׁ֨ר נָתַ֥ן לָ/כֶ֛ם מֹשֶׁ֖ה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֩ תַּעַבְר֨וּ חֲמֻשִׁ֜ים לִ/פְנֵ֣י אֲחֵי/כֶ֗ם כֹּ֚ל גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/עֲזַרְתֶּ֖ם אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
translation:
  language: te
  text: మీ భార్యలు, మీ చిన్నపిల్లలు, మీ పశువులు మోషే మీకు యొర్దాను అవతల ఇచ్చిన దేశంలో ఉండాలి. అయితే పరాక్రమవంతులైన యోధులైన మీరందరూ ఆయుధసన్నద్ధులై[a] మీ సహోదరుల[b] ముందు దాటి వెళ్లి, వారికి సహాయం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధవ్యవస్థలో సిద్ధమై” లేదా “యుద్ధ క్రమంలో అమరి.”
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ “సహోదరులు” అనే హీబ్రూ పురుష బహువచన బంధుత్వ పదం విస్తృతార్థంలో తోటి ఇశ్రాయేలీయులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁיכֶם
  choice: మీ భార్యలు
  rationale: ఈ కుటుంబ, సైనిక సందర్భంలో ఈ పదం సాధారణంగా స్త్రీలందరినీ కాక పురుషుల భార్యలను సూచిస్తుంది.
- source_word: טַפְּכֶם
  choice: మీ చిన్నపిల్లలు
  rationale: טַף చిన్నపిల్లలను లేదా కుటుంబంలోని ఆధారితులను సూచించగలదు; సందర్భంలో ‘చిన్నపిల్లలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וּמִקְנֵיכֶם
  choice: మీ పశువులు
  rationale: מִקְנֶה ఇక్కడ పెంచుకునే పశుసంపదను సూచిస్తుంది; ‘పశువులు’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: יֵשְׁבוּ
  choice: ఉండాలి
  rationale: ישב ఇక్కడ అక్కడే ఉండడం లేదా నివసించడం అనే భావాన్ని ఇస్తుంది; కుటుంబాలు ఆ భూభాగంలో మిగిలి ఉండాలనే ఆజ్ఞను ‘ఉండాలి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: עֵבֶר నది అవతలి ప్రాంతాన్ని సూచిస్తుంది; ‘అవతల’ మూలంలోని దిశాపరమైన సాపేక్షతను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: חֲמֻשִׁים
  choice: ఆయుధసన్నద్ధులై
  rationale: సైనిక సందర్భంలో ఈ పదానికి ఆయుధాలు ధరించి యుద్ధానికి సిద్ధంగా ఉండడం అత్యంత సంభావ్యమైన భావం; పదంలోని స్వల్ప అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: మీ సహోదరులకు ముందుగా
  rationale: לִפְנֵי ముందుగా లేదా ముందు భాగంలో వెళ్లడాన్ని సూచిస్తుంది; ‘ముందుగా’ సైనికులు ఇతర ఇశ్రాయేలీయుల కంటే ముందుగా దాటడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כֹּל גִּבּוֹרֵי הַחַיִל
  choice: మీలోని పరాక్రమవంతులైన యోధులందరూ
  rationale: ఈ పదబంధం సామర్థ్యమూ పరాక్రమమూ గల పోరాట పురుషులను సూచిస్తుంది; ఎంపిక చేసిన రూపం భావబలాన్ని కాపాడుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וַעֲזַרְתֶּם אוֹתָם
  choice: వారికి సహాయం చేయాలి
  rationale: మూలంలోని ప్రత్యక్ష సహాయక చర్యను సరళమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: אֲחֵיכֶם లోని లింగసూచక బంధుత్వ పదం
  choice: మీ సహోదరులు
  alternative: మీ తోటి ఇశ్రాయేలీయులు
  rationale: హీబ్రూ మూలం పురుష బహువచన బంధుత్వ పదాన్ని వాడుతుంది; ప్రధాన పాఠంలో దానిని నిలిపి, ఈ సందర్భంలో అది విస్తృతంగా తోటి ఇశ్రాయేలీయులను సూచిస్తుందని పాదసూచికలో తెలిపాం.
- issue: חֲמֻשִׁים అనే సైనిక పదం యొక్క ఖచ్చిత భావం
  choice: ఆయుధసన్నద్ధులై
  alternative: యుద్ధవ్యవస్థలో సిద్ధమై
  rationale: ఈ సందర్భంలో ఆయుధాలతో యుద్ధానికి సిద్ధంగా ఉండడం అత్యంత సంభావ్య భావం. అయితే పదం సైనిక అమరికను కూడా సూచించే అవకాశం ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘యొర్దాను అవతల’ మూలంలోని దిశాపరమైన సాపేక్షతను కాపాడుతుంది. సైనిక పదజాలాన్ని అతి ప్రాచీనంగా కాకుండా స్పష్టంగా ఉంచాం.
