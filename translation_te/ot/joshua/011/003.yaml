translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథనశైలిని వాడాం. ఈ వచనం ముందరి వచనంలోని ‘కబురు పంపాడు’ అనే క్రియపై ఆధారపడే జాబితి కావడంతో, తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు ఆ క్రియను పునరుక్తి చేశాం. జాతినామాలను సమూహార్థానికి అనుగుణంగా బహువచనంలో ఇచ్చాం.
