source:
  edition: WLC
  text: הַֽ/כְּנַעֲנִי֙ מִ/מִּזְרָ֣ח וּ/מִ/יָּ֔ם וְ/הָ/אֱמֹרִ֧י וְ/הַ/חִתִּ֛י וְ/הַ/פְּרִזִּ֥י וְ/הַ/יְבוּסִ֖י בָּ/הָ֑ר וְ/הַֽ/חִוִּי֙ תַּ֣חַת חֶרְמ֔וֹן בְּ/אֶ֖רֶץ הַ/מִּצְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/003.yaml
  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
translation:
  language: te
  text: తూర్పునను పడమటను ఉన్న కనానీయులకూ,[a] కొండ ప్రాంతంలో ఉన్న అమోరీయులకూ, హిత్తీయులకూ, పెరిజ్జీయులకూ, యెబూసీయులకూ, హెర్మోను దిగువన మిస్పా దేశంలో ఉన్న హివ్వీయులకూ కబురు పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “సముద్రం నుండి.” ఇక్కడ “సముద్రం” బహుశా పడమటి దిక్కును సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులు
  rationale: నిర్దిష్ట ఏకవచన జాతినామం ఇక్కడ సమూహార్థకంగా ఉంది; ఆధునిక తెలుగులో ప్రజాసమూహాన్ని బహువచనంతో చెప్పడం సహజం.
- source_word: מִמִּזְרָח
  choice: తూర్పున
  rationale: מִן అక్షరార్థంగా ‘నుండి’ అయినా, ఈ భౌగోళిక జాబితాలో స్థానం లేదా విస్తృతిని సూచిస్తుంది.
- source_word: וּמִיָּם
  choice: పడమట
  rationale: ‘సముద్రం’ కనాను భౌగోళిక వాడుకలో మధ్యధరా సముద్రం ఉన్న పడమటి దిక్కును సూచిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי וְהַיְבוּסִי
  choice: అమోరీయులు, హిత్తీయులు, పెరిజ్జీయులు, యెబూసీయులు
  rationale: హీబ్రూలోని సమూహార్థక ఏకవచన జాతినామాలను తెలుగులో సహజమైన బహువచన ప్రజానామాలుగా అనువదించాం.
- source_word: בָּהָר
  choice: కొండ ప్రాంతంలో
  rationale: యెహోషువ గ్రంథంలో הָר సాధారణంగా మధ్య ఎత్తైన కొండ ప్రాంతాన్ని సూచిస్తుంది; ‘పర్వతాల్లో’ కంటే ఇది సందర్భోచితం.
- source_word: הַחִוִּי
  choice: హివ్వీయులు
  rationale: సమూహార్థక ఏకవచనాన్ని తెలుగులో సహజమైన బహువచనంగా ఇచ్చాం.
- source_word: תַּחַת חֶרְמוֹן
  choice: హెర్మోను దిగువన
  rationale: תַּחַת ఇక్కడ హెర్మోను కిందనున్న భూభాగాన్ని లేదా దిగువ వాలులను సూచించే ప్రాదేశిక పదం.
- source_word: בְּאֶרֶץ הַמִּצְפָּה
  choice: మిస్పా దేశంలో
  rationale: אֶרֶץ ప్రాంతం లేదా భూభాగాన్ని సూచిస్తుంది; מִצְפָּהను స్థలనామంగా లిప్యంతరీకరించాం.
