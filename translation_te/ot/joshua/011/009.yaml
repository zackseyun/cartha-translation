  text: וַ/יַּ֤עַשׂ לָ/הֶם֙ יְהוֹשֻׁ֔עַ כַּ/אֲשֶׁ֥ר אָֽמַר ל֖/וֹ יְהוָ֑ה אֶת סוּסֵי/הֶ֣ם עִקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם שָׂרַ֥ף בָּ/אֵֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/009.yaml
  text: 'And Joshua did to them just as Yahweh had told him: he hamstrung their horses and burned their chariots with fire[a].'
translation:
  language: te
  text: 'యాహ్వే యెహోషువకు చెప్పినట్లే యెహోషువ వారికి చేశాడు: వారి గుర్రాల వెనుక కాళ్ల స్నాయువులను కోశాడు[a], వారి రథాలను అగ్నితో కాల్చాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి గుర్రాలను కుంటివిగా చేశాడు’; హీబ్రూ పదం మరింత నిర్దిష్టంగా, గుర్రాల వెనుక కాళ్ల స్నాయువులను కోసి వాటిని యుద్ధానికి పనికిరాకుండా చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  choice: వారికి చేశాడు
  rationale: עשה + ל అనే ప్రయోగాన్ని సందర్భానుసారంగా నేరుగా నిలుపుతుంది; ఇక్కడ వారికి మేలు చేశాడనే భావం కాక, వారి విషయంలో ఆజ్ఞ ప్రకారం చర్య తీసుకున్నాడనే అర్థం.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: తనతో చెప్పినట్లే
  rationale: כַּאֲשֶׁר లోని పోలికను ‘చెప్పినట్లే’ సహజంగా వ్యక్తం చేస్తుంది; ‘తనతో’ అనేది యెహోషువను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపంగా లిప్యంతరీకరించింది; దానిని బిరుదుతో భర్తీ చేయలేదు.
- source_word: סוּסֵיהֶם
  choice: వారి గుర్రాలు
  rationale: బహువచన నామవాచకానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: עִקֵּר
  choice: మోకాలి వెనుక నరాలను కోయించాడు
  rationale: ఈ క్రియ గుర్రాలను సాధారణంగా గాయపరచడం మాత్రమే కాక, కాలి వెనుక నరాలను కోసి వాటిని పనికిరాకుండా చేయడాన్ని ప్రత్యేకంగా సూచిస్తుంది. కర్త స్వయంగా చేశాడా లేక తన సైనికులతో చేయించాడా అన్నది తెలుగు సైనిక సందర్భంలో సహజంగా ‘కోయించాడు’ ద్వారా వ్యక్తమవుతుంది.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: వారి రథాలు
  rationale: యుద్ధ రథాలను సూచించే పదానికి సాధారణమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: שָׂרַף בָּאֵשׁ
  choice: అగ్నితో కాల్చివేశాడు
  rationale: మూలంలోని ‘అగ్నితో’ అనే స్పష్టమైన పదబంధాన్ని నిలుపుతూ, సంపూర్ణంగా దహనం చేసిన భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచడం జరిగింది; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలి. ‘మోకాలి వెనుక నరాలు’ అనే వివరణాత్మక రూపం అరుదైన సాంకేతిక పదం కంటే స్పష్టంగా ఉంటుంది. మూలంలోని పదక్రమాన్ని బలవంతంగా అనుసరించకుండా, ఆజ్ఞకు యథాతథ విధేయత మరియు సైనిక చర్య రెండింటినీ సహజంగా వ్యక్తం చేసింది.
