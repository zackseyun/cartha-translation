revisions:
- from: 'యెహోవా తనతో చెప్పినట్లే యెహోషువ వారికి చేశాడు: వారి గుర్రాల మోకాలి వెనుక నరాలను కోయించి[a], వారి రథాలను అగ్నితో కాల్చివేశాడు.'
  to: 'యాహ్వే యెహోషువకు చెప్పినట్లే యెహోషువ వారికి చేశాడు: వారి గుర్రాల వెనుక కాళ్ల స్నాయువులను కోశాడు[a], వారి రథాలను అగ్నితో కాల్చాడు.'
  rationale: The revision aligns the divine name with the POB Yahweh policy, clarifies that Yahweh’s prior instruction was addressed to Joshua, and renders the hamstringing verb accurately while retaining an accessible explanatory footnote. The Hebrew’s explicit “with fire” is preserved.
