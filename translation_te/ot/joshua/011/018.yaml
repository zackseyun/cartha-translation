lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: చాలాకాలం పాటు
  rationale: అక్షరార్థంగా ‘అనేక దినాలు’; సందర్భంలో దీర్ఘకాలాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘చాలాకాలం పాటు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: עָשָׂה ... מִלְחָמָה
  choice: యుద్ధం చేశాడు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘యుద్ధం చేశాడు/చేశాడు’ అనే ప్రయోగం. తెలుగు భాషలో ‘యుద్ధం చేశాడు’ సహజమైన సమానార్థక నుడికారం.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకలో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: אֶת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: ఈ రాజులందరితో
  rationale: ‘యుద్ధం చేయు’ అనే తెలుగు ప్రయోగంతో ప్రత్యర్థులను సూచించేందుకు ‘తో’ సహజం; సందర్భం విరోధార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: מִלְחָמָה
  choice: యుద్ధం
  rationale: ఈ సందర్భంలో ‘యుద్ధం’ అనే సాధారణ పదం దీర్ఘకాలిక సైనిక పోరాటాన్ని ‘పోరు’ కంటే సముచితంగా తెలియజేస్తుంది.
