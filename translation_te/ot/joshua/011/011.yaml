source:
  edition: WLC
  text: וַ֠/יַּכּוּ אֶת כָּל הַ/נֶּ֨פֶשׁ אֲשֶׁר בָּ֤/הּ לְ/פִי חֶ֨רֶב֙ הַֽחֲרֵ֔ם לֹ֥א נוֹתַ֖ר כָּל נְשָׁמָ֑ה וְ/אֶת חָצ֖וֹר שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
translation:
  language: te
  text: దానిలో ఉన్న ప్రతి వ్యక్తినీ వారు కత్తి ధారతో హతమార్చి, వారిని నిర్మూలనకు అంకితం చేశారు[a]. ఊపిరి ఉన్నదేదీ మిగలలేదు[b]. హాసోరును అతడు అగ్నితో కాల్చివేశాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘నిర్మూలనకు అంకితం చేశారు’ అని అనువదించిన హీబ్రూ పదం חרם; ఇది నిర్మూలనకు ప్రత్యేకంగా అర్పించడాన్ని సూచిస్తుంది. మరో అనువాదం: ‘పూర్తిగా నిర్మూలించారు.’'
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఏ ఊపిరీ మిగలలేదు’; అంటే ప్రాణంతో ఉన్నదేదీ మిగలలేదని చెప్పే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో మొదట ‘వారు హతమార్చారు’ అని బహువచనం ఉండగా, ఇక్కడ ‘అతడు కాల్చివేశాడు’ అని ఏకవచనానికి మారుతుంది; చివరి కర్త బహుశా యెహోషువ.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: వారు ... హతమార్చి
  rationale: נכה యొక్క హిఫీల్ రూపం ఇక్కడ యుద్ధంలో కొట్టి చంపడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘హతమార్చి’ సైనిక సందర్భాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: దానిలో ఉన్న ప్రతి ప్రాణినీ
  rationale: נֶפֶשׁ ఇక్కడ అమూర్తమైన ‘ఆత్మ’ను కాక, పట్టణంలో ఉన్న సజీవ ప్రాణులను సూచిస్తుంది. తరువాతి נְשָׁמָהతో ఉన్న విస్తృత భావాన్ని ముందుగానే కేవలం ‘వ్యక్తి’గా పరిమితం చేయకుండా ‘ప్రాణి’ అని అనువదించాం.
- source_word: לְפִי חֶרֶב
  choice: కత్తివాతకు
  rationale: అక్షరార్థంగా ‘కత్తి నోటికి’ అనే హీబ్రూ నుడికారానికి ‘కత్తివాతకు’ సహజమైన తెలుగు సమానార్థకం; కత్తి అంచుతో సంహరించడాన్ని ఇది సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: הַחֲרֵם
  choice: నిర్మూలనకు అంకితం చేశారు
  rationale: חרם సాధారణంగా చంపడమే కాక, నిర్మూలన కోసం ప్రత్యేకంగా అప్పగించడం అనే భావాన్ని కలిగి ఉంది. ‘నిర్మూలనకు అంకితం’ ఆ ప్రత్యేక భావాన్ని నిలుపుతూ పాఠకునికి అర్థమయ్యేలా ఉంటుంది.
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  choice: ఊపిరి పీల్చేదేదీ మిగలలేదు
  rationale: נְשָׁמָה యొక్క ‘శ్వాస/ఊపిరి’ చిత్రాన్ని నిలుపుతూ, ప్రాణంతో ఉన్నదేదీ తప్పించుకోలేదనే హీబ్రూ నుడికార భావాన్ని తెలుగులో సహజంగా తెలిపింది.
- source_word: חָצוֹר
  choice: హాసోరు
  rationale: హీబ్రూ חָצוֹר పేరును ఆధునిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שָׂרַף בָּאֵשׁ
  choice: అతడు అగ్నితో కాల్చివేశాడు
  rationale: ఏకవచన క్రియను ‘అతడు’ అని స్పష్టంగా నిలిపి, בָּאֵשׁలోని ‘అగ్నితో’ అనే ఉద్ఘాటనను కూడా పరిరక్షించాం.
theological_decisions:
- issue: ఆక్రమణ సందర్భంలో חרם పదానికి అనువాదం
  choice: నిర్మూలనకు అంకితం చేశారు
  alternative: పూర్తిగా నిర్మూలించారు; నిషేధానికి అప్పగించారు
  rationale: ఈ పదం సాధారణ యుద్ధహత్యకన్నా ప్రత్యేకంగా నిర్మూలనకు అప్పగించే భావాన్ని కలిగి ఉంది. ఎంపిక చేసిన రూపం పాఠంలోని తీవ్రతను దాచకుండా, అదనపు మతసిద్ధాంత వ్యాఖ్యానాన్ని చొప్పించకుండా ఆ భావభారాన్ని నిలుపుతుంది.
- issue: బహువచనం నుంచి ఏకవచనానికి కర్త మార్పు
  choice: వారు ... అతడు ... కాల్చివేశాడు
  alternative: వారు ... వారు ... కాల్చివేశారు
  rationale: హీబ్రూలో וַיַּכּוּ బహువచనం కాగా שָׂרַף ఏకవచనం. చివరి కర్త యెహోషువ కావచ్చన్న సూచన ఉన్నప్పటికీ, పేరు చేర్చి సందిగ్ధతను తీర్చకుండా మూలంలోని వ్యాకరణ మార్పునే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలిని ఉపయోగించాం. ‘కత్తివాతకు’ వంటి సహజమైన బైబిలు-సాహిత్య నుడికారాన్ని ఉంచి, ‘నిర్మూలనకు అంకితం’ ద్వారా חרם యొక్క సాంకేతిక భావాన్ని అతి క్లిష్టత లేకుండా నిలిపాం. మూలంలోని హింసాత్మక తీవ్రతను మృదువుపరచలేదు; బహువచన–ఏకవచన మార్పును కూడా సవరించకుండా చూపించాం.
