- from: దానిలో ఉన్న ప్రతి ప్రాణినీ వారు కత్తివాతకు హతమార్చి, నిర్మూలనకు అంకితం చేశారు[a]. ఊపిరి పీల్చేదేదీ మిగలలేదు[b]. హాసోరును అతడు అగ్నితో కాల్చివేశాడు[c].
