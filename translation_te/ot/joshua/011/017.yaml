source:
  edition: WLC
  text: מִן הָ/הָ֤ר הֶֽ/חָלָק֙ הָ/עוֹלֶ֣ה שֵׂעִ֔יר וְ/עַד בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן תַּ֖חַת הַר חֶרְמ֑וֹן וְ/אֵ֤ת כָּל מַלְכֵי/הֶם֙ לָכַ֔ד וַ/יַּכֵּ֖/ם וַ/יְמִיתֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/017.yaml
  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
translation:
  language: te
  text: శేయీరు వైపు పైకెగసిన హాలాకు కొండ[a] నుండి హెర్మోను కొండ దిగువనున్న లెబానోను లోయలోని[b] బయల్గాదు వరకు ఉన్న ఆ ప్రాంతాల రాజులందరినీ అతడు పట్టుకొని, వారిని కొట్టి చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నునుపైన కొండ.’ హీబ్రూ పదబంధాన్ని వివరణాత్మకంగా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ అది ‘హాలాకు కొండ’ అనే స్థలనామంగా వాడబడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘లెబానోను మైదానంలో.’ హీబ్రూ పదం విశాలమైన లోయను లేదా మైదానాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָר הֶחָלָק
  choice: హాలాకు కొండ
  rationale: సరిహద్దును సూచించే ఈ భౌగోళిక సందర్భంలో దీనిని స్థలనామంగా లిప్యంతరీకరించడం సహజం; ‘నునుపైన కొండ’ అనే వివరణాత్మక అర్థం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచాం.
- source_word: הָעֹלֶה שֵׂעִיר
  choice: శేయీరు వైపు పైకెగసిన
  rationale: עלה అనే కృదంతంలోని ఎగబాకే భౌగోళిక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: וְעַד
  choice: మొదలుకొని ... వరకు
  rationale: జయించిన ప్రాంతపు విస్తృతిని తెలిపే సరిహద్దు నిర్మాణంగా తెలుగులో సహజంగా మార్చబడింది.
- source_word: בַּעַל גָּד
  choice: బయలు-గాదు
  rationale: ఇక్కడ ఇది భౌగోళిక స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా లిప్యంతరీకరించబడింది.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: లెబానోను లోయలోని
  rationale: בִּקְעָה విశాలమైన లోయను లేదా మైదానాన్ని సూచించగలదు; భౌగోళిక సందర్భంలో ‘లోయ’ సహజమైన ఎంపిక.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: హెర్మోను కొండ దిగువనున్న
  rationale: ఒక భౌగోళిక గుర్తుకు దిగువన ఉన్న స్థానాన్ని תַּחַת సూచిస్తుంది; ‘దిగువనున్న’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: לָכַד
  choice: బంధించి
  rationale: వ్యక్తులైన రాజులను యుద్ధంలో పట్టుకోవడం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּכֵּם
  choice: హతమార్చి
  rationale: נכה లోని హింసాత్మకంగా కొట్టివేయడం/సంహరించడం అనే భావాన్ని నిలుపుతూ, తరువాతి స్పష్టమైన మరణక్రియ నుండి వేరుగా ఉంచుతుంది.
- source_word: וַיְמִיתֵם
  choice: చంపాడు
  rationale: מות హిఫీల్ రూపం మరణానికి గురిచేయడాన్ని స్పష్టంగా చెబుతుంది; ఆధునిక తెలుగులో ‘చంపాడు’ నేరుగా, సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. అయితే మూలంలోని ఈ వాక్యం ముందు వచనంలో ప్రారంభమైన భూవిస్తృతి వివరణకు కొనసాగింపు; స్వతంత్ర వచనంగా పఠనయోగ్యం చేయడానికి ‘ఉన్న ప్రాంతమంతటినీ యెహోషువ స్వాధీనం చేసుకున్నాడు’ అని సందర్భానుసారంగా పూరించబడింది. ‘హతమార్చి చంపాడు’ అనే వరుస మూలంలోని נכה మరియు מות అనే రెండు వేర్వేరు క్రియలను కుదించకుండా నిలుపుతుంది.
