source:
  edition: WLC
  text: וַ/יְהִ֕י כִּ/שְׁמֹ֖עַ יָבִ֣ין מֶֽלֶךְ חָצ֑וֹר וַ/יִּשְׁלַ֗ח אֶל יוֹבָב֙ מֶ֣לֶךְ מָד֔וֹן וְ/אֶל מֶ֥לֶךְ שִׁמְר֖וֹן וְ/אֶל מֶ֥לֶךְ אַכְשָֽׁף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/001.yaml
  text: When Jabin king of Hazor heard of it[a], he sent to Jobab king of Madon, and to the king of Shimron[c][b], and to the king of Achshaph.
translation:
  language: te
  text: హాసోరు రాజైన యాబీను ఇది విన్నప్పుడు,[a] మాదోను రాజైన యోబాబుకు, షిమ్రోను రాజుకు,[b] అక్షాఫు రాజుకు పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “హాసోరు రాజైన యాబీను విన్నప్పుడు, మరియు ఇలా జరిగింది.” హెబ్రీ కథన సూత్రాన్ని ఇక్కడ సహజమైన తెలుగులో “ఇది విన్నప్పుడు” అని ఇచ్చాం. “ఇది” అనే మాట హెబ్రీలో ప్రత్యక్షంగా లేకపోయినా, ముందటి సందర్భం నుంచి అంతర్భావంగా ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ హెబ్రీ పాఠంలో “షిమ్రోను” అని మాత్రమే ఉంది. కొందరు దీనిని యెహోషువ 12:20లోని “షిమ్రోను-మెరోను”తో గుర్తిస్తారు.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: ఇది విన్నప్పుడు
  rationale: ఈ హెబ్రీ కథన నిర్మాణం కొత్త సందర్భాన్ని కాలార్థకంగా పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘విన్నప్పుడు’ సహజంగా ఉంటుంది; ‘ఇది’ అనేది ముందటి సందర్భం నుంచి అంతర్భావంగా ఉన్న కర్మను స్పష్టం చేస్తుంది.
- source_word: יָבִין
  choice: యాబీను
  rationale: హెబ్రీ వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מֶלֶךְ חָצוֹר
  choice: హాసోరు రాజైన
  rationale: స్థల నామంతో కూడిన రాజ బిరుదును సహజమైన తెలుగు విశేషణ నిర్మాణంలో ఇచ్చాం.
- source_word: וַיִּשְׁלַח אֶל
  choice: కబురు పంపాడు
  rationale: పంపబడిన దూతలు లేదా సందేశం హెబ్రీలో స్పష్టంగా పేర్కొనబడలేదు. అయినా వ్యక్తులకు ‘పంపాడు’ అని మాత్రమే చెప్పడం తెలుగులో అసంపూర్ణంగా వినిపించవచ్చు కాబట్టి, సందర్భార్థాన్ని సహజంగా తెలిపే ‘కబురు పంపాడు’ ఎంచుకున్నాం.
- source_word: יוֹבָב
  choice: యోబాబు
  rationale: హెబ్రీ వ్యక్తి పేరును తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: מָדוֹן
  choice: మాదోను
  rationale: హెబ్రీ స్థల నామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שִׁמְרוֹן
  choice: షిమ్రోను
  rationale: మసొరేటిక్ పాఠంలో ఉన్న స్థల నామ రూపాన్నే అనుసరించాం; యెహోషువ 12:20లోని విస్తృత రూపాన్ని ప్రధాన పాఠంలోకి తీసుకురాలేదు.
- source_word: אַכְשָׁף
  choice: అక్షాఫు
  rationale: హెబ్రీ హల్లుల రూపాన్ని వీలైనంత దగ్గరగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
