  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֗רֶץ כְּ֠/כֹל אֲשֶׁ֨ר דִּבֶּ֣ר יְהוָה֮ אֶל מֹשֶׁה֒ וַ/יִּתְּנָ/הּ֩ יְהוֹשֻׁ֨עַ לְ/נַחֲלָ֧ה לְ/יִשְׂרָאֵ֛ל כְּ/מַחְלְקֹתָ֖/ם לְ/שִׁבְטֵי/הֶ֑ם וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
translation:
  language: te
  text: యహ్వే మోషేతో చెప్పినదంతటి ప్రకారం యెహోషువ ఆ దేశమంతటినీ[a] స్వాధీనం చేసుకున్నాడు. యెహోషువ దానిని ఇశ్రాయేలీయులకు వారి గోత్రాల వారీగా విభజించి వారసత్వంగా ఇచ్చాడు. దేశానికి యుద్ధం నుండి విశ్రాంతి కలిగింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశమంతటినీ.” ఈ పదబంధం ఇక్కడ చర్చలో ఉన్న దేశంపై యెహోషువ సాధించిన విజయాన్ని సంక్షిప్తంగా వివరిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేశం యుద్ధం నుండి ప్రశాంతంగా ఉంది.” హెబ్రీయ పదబంధం పోరాటం తరువాత కలిగిన విశ్రాంతిని లేదా నిశ్చలతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: స్వాధీనం చేసుకున్నాడు
  rationale: לקח అనే క్రియకు ప్రాథమికంగా ‘తీసుకోవడం’ అనే అర్థం ఉంది. అయితే దేశాన్ని తీసుకోవడం అనే ఈ విజయసారాంశ సందర్భంలో ‘స్వాధీనం చేసుకున్నాడు’ అనేది సహజమైన ఆధునిక తెలుగు; ‘జయించాడు’ లేదా ‘పూర్తిగా ఆక్రమించాడు’ అనేదానికంటే మూలంలోని సంక్షిప్తతను, పరిధి విషయంలోని ఉద్రిక్తతను మెరుగ్గా కాపాడుతుంది.
- source_word: כָּל הָאָרֶץ
  choice: ఆ దేశమంతటినీ
  rationale: ఇక్కడ אָרֶץ భూమి మొత్తాన్ని కాక, సందర్భంలో చర్చిస్తున్న దేశాన్ని సూచిస్తుంది. ‘ఆ దేశమంతటినీ’ అనేది నిర్దిష్ట సందర్భాన్ని తెలియజేస్తూనే హెబ్రీయ పదబంధంలోని సమగ్రతను నిలుపుతుంది.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר
  choice: చెప్పినదంతటి ప్రకారం
  rationale: ఈ పదబంధం ముందుగా పలికిన మాటకు అనుగుణంగా కార్యం జరిగినట్లు చెబుతుంది. తెలుగు రూపం ఆ అనుగుణతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וַיִּתְּנָהּ
  choice: దాన్ని ... ఇచ్చాడు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న దేశాన్ని సూచిస్తుంది. נתן యొక్క ప్రాథమిక అర్థమైన ‘ఇచ్చాడు’ను నిలిపి, పంపిణీ భావాన్ని తరువాతి పదబంధాలు తెలియజేసేలా చేశాం.
- source_word: לְנַחֲלָה
  choice: వారసత్వ ఆస్తిగా
  rationale: נחלה అనేది వారసత్వంగా లభించే స్వాస్థ్యాన్ని, ముఖ్యంగా గోత్రాలకు కేటాయించిన దేశాన్ని సూచిస్తుంది. ‘వారసత్వ ఆస్తి’ చట్టపరమైన, ఒడంబడిక సంబంధమైన భావాలను సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులకు
  rationale: సమూహవాచకమైన ‘ఇశ్రాయేలు’ ఇక్కడ దేశాన్ని పొందే ప్రజలను సూచిస్తుంది. తెలుగులో ‘ఇశ్రాయేలీయులకు’ గ్రహీతను సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  choice: వారి గోత్రాలవారీ విభాగాల ప్రకారం
  rationale: מחלקות లోని విభజన/కేటాయింపు భావాన్ని, שׁבטים లోని గోత్ర వ్యవస్థను ఒక సహజమైన తెలుగు పదబంధంలో కాపాడాం.
- source_word: שָׁקְטָה מִמִּלְחָמָה
  choice: దేశానికి యుద్ధం నుండి విశ్రాంతి కలిగింది
  rationale: שקט యుద్ధానంతర నిశ్చలత, ప్రశాంతత లేదా విశ్రాంతిని సూచిస్తుంది. ఈ రూపం ప్రధాన యుద్ధం ఆగిన భావాన్ని తెలియజేస్తుంది; సంపూర్ణమైన శాశ్వత శాంతి ఏర్పడిందని అతిశయించదు.
theological_decisions:
- issue: ‘ఆ దేశమంతటినీ’ అనే విజయసారాంశపు పరిధి
  choice: యెహోషువ విజయాన్ని, యహ్వే మోషేతో పలికిన మాట నెరవేరినదాన్ని తెలిపే కథన సారాంశంగా మూలపాఠంలోని సమగ్ర పదబంధాన్ని యథాతథ భావంతో ఉంచడం
  alternative: ప్రతి ప్రాంతమూ అప్పుడే పూర్తిగా ఆక్రమించబడిందని స్పష్టీకరించడం; లేదా దీనిని కేవలం అతిశయోక్తి అని అనువాదంలోనే నిర్ణయించడం
  rationale: హెబ్రీయ పాఠం ‘దేశమంతా’ అని చెబుతుంది; మరోవైపు ఇతర సందర్భాలు ఇంకా మిగిలిన ప్రాంతాలను పేర్కొంటాయి. అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా మూలంలోని సారాంశ వాక్యాన్ని కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘యహ్వే’ ద్వారా వ్యక్తిగత దైవనామాన్ని నిలిపాం. వాక్య నిర్మాణాన్ని తెలుగు పఠన సౌలభ్యానికి మూడు వాక్యాలుగా విభజించినా, మూలంలోని క్రమం—దేశాన్ని స్వాధీనం చేసుకోవడం, వారసత్వంగా ఇవ్వడం, యుద్ధం నుండి విశ్రాంతి—మారలేదు.
