id: JOS.11.15
reference: Joshua 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ כֵּן צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וְ/כֵן֙ עָשָׂ֣ה יְהוֹשֻׁ֔עַ לֹֽא הֵסִ֣יר דָּבָ֔ר מִ/כֹּ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
translation:
  language: te
  text: యాహ్వే తన సేవకుడైన మోషేకు ఆజ్ఞాపించినట్లే, మోషే యెహోషువకు ఆజ్ఞాపించాడు; యెహోషువ అలాగే చేశాడు. యాహ్వే మోషేకు ఆజ్ఞాపించిన వాటన్నిటిలో యెహోషువ ఏదీ మానలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “యాహ్వే మోషేకు ఆజ్ఞాపించిన వాటన్నిటిలో యెహోషువ ఒక్కదానినీ విడిచిపెట్టలేదు.” హీబ్రూ నుడికారానికి అక్షరార్థం: “యాహ్వే మోషేకు ఆజ్ఞాపించిన వాటన్నిటిలోనుండి అతడు ఒక్క విషయాన్నీ తొలగించలేదు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: యెహోవా మోషేకు ఇచ్చిన ఆజ్ఞకు, మోషే యెహోషువకు ఇచ్చిన ఆజ్ఞకు మధ్య ఉన్న ఖచ్చితమైన అనురూపతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించాడు / ఆజ్ఞాపించిన
  rationale: అధికారపూర్వకమైన ఆదేశాన్ని సూచించే మూలక్రియ భావాన్ని నిలుపుతుంది; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా రూపాలు మార్చబడ్డాయి.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: עַבְדּוֹ
  choice: తన సేవకుడైన
  rationale: మోషేకు సంబంధించిన గౌరవప్రదమైన సేవా సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘దాసుడు’ వల్ల ముందుకు వచ్చే బానిసత్వ ఛాయను అనవసరంగా ప్రధానంచేయదు.
- source_word: כֵּן
  choice: అలాగే
  rationale: ఆజ్ఞకు అనుగుణంగా జరిగిన చర్యను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: మూలంలోని విస్తృతమైన, సంక్షిప్త క్రియను నిలుపుతూ యెహోషువ విధేయతను సూచిస్తుంది.
- source_word: לֹא הֵסִיר דָּבָר
  choice: ఒక్కదానినీ విడిచిపెట్టలేదు
  rationale: ‘ఒక విషయాన్ని తొలగించలేదు’ అనే హీబ్రూ రూపకాన్ని అక్షరార్థంగా కాకుండా, ఆజ్ఞలలో ఏదీ మానకుండా పూర్తిగా పాటించాడనే సందర్భార్థంతో సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מִכֹּל אֲשֶׁר
  choice: వాటన్నిటిలో
  rationale: ఆజ్ఞాపించబడిన విషయాల సంపూర్ణతను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת
  choice: '[అనువదించబడలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి స్వతంత్ర పదసమానం అవసరం లేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామరూపంగా ఉంచాం; ఆధునిక తెలుగు బైబిల్ పాఠకులకు బాగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: యెహోషువ విధేయత సంపూర్ణత
  choice: ఒక్కదానినీ విడిచిపెట్టలేదు
  alternative: ఏ విషయాన్నీ తొలగించలేదు
  rationale: హీబ్రూ నుడికారంలోని ‘తొలగించలేదు’ అనే చిత్రాన్ని పాదటిప్పణిలో భద్రపరుస్తూ, ప్రధాన పాఠంలో అన్ని ఆజ్ఞలను మానకుండా అమలు చేశాడనే భావాన్ని స్పష్టంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని ఆజ్ఞాధికార పరంపరను, సంక్షిప్తతను, సంపూర్ణ విధేయతను నిలుపుతూ నుడికారాన్ని సహజీకరించాం.
