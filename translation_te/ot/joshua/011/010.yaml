revisions:
- from: ఆ సమయంలో యెహోషువ వెనక్కి తిరిగి[a] హాసోరును పట్టుకొని, దాని రాజును కత్తితో కొట్టాడు[b]. ఎందుకంటే పూర్వం హాసోరు ఈ రాజ్యాలన్నిటికీ అధిపతిగా[c] ఉండేది.
  to: ఆ సమయంలో యెహోషువ వెనక్కి తిరిగి[a] హాసోరును పట్టుకొని, దాని రాజును కత్తితో కొట్టాడు[b]. ఎందుకంటే పూర్వం హాసోరు ఈ రాజ్యాలన్నిటిలో ప్రధానమైనది[c].
