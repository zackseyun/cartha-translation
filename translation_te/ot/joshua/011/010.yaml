base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
translation:
  language: te
  text: ఆ సమయంలో యెహోషువ వెనక్కి తిరిగి[a] హాసోరును పట్టుకొని, దాని రాజును కత్తితో కొట్టాడు[b]. ఎందుకంటే పూర్వం హాసోరు ఈ రాజ్యాలన్నిటిలో ప్రధానమైనది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తిరిగి వచ్చి’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియను ‘తిరిగివచ్చాడు’ లేదా ‘వెనక్కి తిరిగాడు’ అని అనువదించవచ్చు; ఇక్కడ ‘వెనక్కి తిరిగి’ యుద్ధయాత్రలోని దిశాభావాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కత్తితో కొట్టాడు’ అనేది హీబ్రూ పదబంధానికి సంయమనంతో చేసిన అనువాదం. సందర్భంలో ఇది చంపడాన్ని సూచించే అవకాశం ఉంది; అయితే క్రియ అక్షరార్థంగా ‘కొట్టాడు’ అని చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: 'అక్షరార్థం: ‘ఈ రాజ్యాలన్నిటికీ తలగా.’ ఇది హాసోరు వాటిలో ప్రధానమైనదని తెలిపే రూపకం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: వెనక్కి తిరిగి
  rationale: שׁוב ఇక్కడ యుద్ధయాత్రలో తిరిగి వెళ్లడాన్ని సూచిస్తుంది. ‘వెనక్కి తిరిగి’ అనేది దిశాపరమైన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘తిరిగి వచ్చి’ కూడా సాధ్యమే.
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: ఇది సాధారణ కాలసూచక పదబంధం. మూలంలోని కాలవ్యాప్తిని అనవసరంగా ఒక క్షణానికి పరిమితం చేయకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּלְכֹּד
  choice: పట్టుకొని
  rationale: לכד అనేది సైనిక సందర్భంలో ఒక పట్టణాన్ని స్వాధీనం చేసుకోవడాన్ని సూచిస్తుంది. ‘పట్టుకొని’ సాధారణ పాఠకులకు సహజంగా ఉండి ఆ భావాన్ని అందిస్తుంది.
- source_word: חָצוֹר
  choice: హాసోరు
  rationale: స్థలనామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מַלְכָּהּ
  choice: దాని రాజును
  rationale: మూడవ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయం హాసోరు పట్టణాన్ని సూచిస్తుంది. తెలుగులో పట్టణానికి సంబంధించి ‘దాని రాజు’ సహజమైన రూపం.
- source_word: הִכָּה בֶחָרֶב
  choice: కత్తితో కొట్టాడు
  rationale: נכה యొక్క ప్రత్యక్ష అర్థం ‘కొట్టు’. సందర్భంలో చంపడాన్ని సూచించే అవకాశం బలంగా ఉన్నా, మూలంలోని సంయమనాన్ని కాపాడేందుకు ‘చంపాడు’ అని స్పష్టీకరించలేదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: హాసోరుకు ఉన్న ప్రాముఖ్యతను వివరించే కారణార్థక వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: לְפָנִים
  choice: పూర్వం
  rationale: గతంలో ఉన్న స్థితిని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: רֹאשׁ
  choice: అధిపతిగా
  rationale: మూలంలో అక్షరార్థంగా ‘తల’ అనే రూపకం ఉన్నా, ఇక్కడ రాజ్యాల మధ్య ప్రధానత్వం లేదా ఆధిపత్యం ఉద్దేశం. ప్రధాన పాఠ్యంలో సహజమైన ‘అధిపతి’ని వాడి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  choice: ఈ రాజ్యాలన్నిటికీ
  rationale: పరిమాణం, సూచన, సంబంధం అన్నింటినీ సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
