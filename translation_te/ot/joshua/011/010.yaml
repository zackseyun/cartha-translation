translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని వాడాం. హీబ్రూ వాక్యక్రమాన్ని యథాశక్తి అనుసరిస్తూనే తెలుగు సహజత్వం కోసం సంబంధవిభక్తులు, క్రియారూపాలను సర్దుబాటు చేశాం. ‘కొట్టాడు’ అనే రూపంతో మూలంలోని ఉద్దేశపూర్వక సంయమనాన్ని, పాదటిప్పణితో సందర్భార్థాన్ని రెండింటినీ నిలిపాం.
