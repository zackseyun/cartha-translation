- from: అప్పుడు యెహోషువ, అతనితో ఉన్న పోరాడే ప్రజలందరూ[a], మెరోము జలాల దగ్గర వారిమీదికి అకస్మాత్తుగా వచ్చి వారిపై పడ్డారు.
