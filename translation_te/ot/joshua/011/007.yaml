source:
  edition: WLC
  text: וַ/יָּבֹ֣א יְהוֹשֻׁ֡עַ וְ/כָל עַם֩ הַ/מִּלְחָמָ֨ה עִמּ֧/וֹ עֲלֵי/הֶ֛ם עַל מֵ֥י מֵר֖וֹם פִּתְאֹ֑ם וַֽ/יִּפְּל֖וּ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/007.yaml
  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
translation:
  language: te
  text: అప్పుడు యెహోషువ, అతనితో ఉన్న యుద్ధదళమంతా, అకస్మాత్తుగా మెరోము జలాల దగ్గర వారిమీదికి వచ్చి వారిపై పడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘యుద్ధపు ప్రజలందరూ’; సంప్రదాయ అనువాదం ‘యుద్ధవీరులందరూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא అనే క్రియ సందర్భాన్ని బట్టి ‘వచ్చు’ లేదా ‘వెళ్లు’ అని అర్థమవుతుంది. శత్రువుల మీదికి కదలివచ్చిన భావాన్ని ఇక్కడ ‘వచ్చి’ సహజంగా తెలియజేస్తుంది.
- source_word: עַם הַמִּלְחָמָה
  choice: పోరాడే ప్రజలందరూ
  rationale: అక్షరార్థంగా ‘యుద్ధపు ప్రజలు.’ עַם లోని సమష్టి భావాన్ని, మూలంలో లేని పురుష లింగ నిర్దిష్టతను చేర్చకుండా, ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עִמּוֹ
  choice: అతనితో ఉన్న
  rationale: యెహోషువతో వారి సహవాసాన్ని స్పష్టంగా, సహజమైన తెలుగు వాక్య నిర్మాణంలో తెలియజేస్తుంది.
- source_word: עֲלֵיהֶם
  choice: వారిమీదికి
  rationale: శత్రుత్వపూర్వక కదలికతో על ఇక్కడ ‘వారికి వ్యతిరేకంగా/వారిమీదికి’ అనే భావాన్ని ఇస్తుంది.
- source_word: עַל מֵי מֵרוֹם
  choice: మెరోము జలాల దగ్గర
  rationale: మెరోము అనే జలప్రదేశం సమీపంలోని స్థానాన్ని సూచిస్తుంది; ‘దగ్గర’ ఆధునిక తెలుగులో సహజమైన స్థాన సూచన.
- source_word: פִּתְאֹם
  choice: అకస్మాత్తుగా
  rationale: దాడి హఠాత్తుగా జరిగినదనే మూలపాఠంలోని భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: וַיִּפְּלוּ בָהֶם
  choice: వారిపై పడ్డారు
  rationale: נפל + ב అనే సజీవ యుద్ధ నుడికారాన్ని తెలుగులోని ‘వారిపై పడ్డారు’ నిలుపుతుంది; కేవలం ‘దాడి చేశారు’ అనడం కంటే మూలంలోని చిత్రాత్మకతను కాపాడుతుంది.
