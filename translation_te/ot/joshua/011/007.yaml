translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పోరాడే ప్రజలు’ అనే పదబంధం మూలంలోని సమష్టి భావాన్ని నిలుపుతూ, ‘సైన్యం’ అనే కొంత వ్యాఖ్యానాత్మక పదాన్నీ, మూలంలో స్పష్టంగా లేని పురుష లింగ నిర్దిష్టతనూ నివారిస్తుంది.
