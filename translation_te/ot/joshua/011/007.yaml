    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural rendering of the collective military expression with idiomatic, gender-neutral Telugu and improves word order. It preserves the source’s collective force, suddenness, location, hostile advance, and vivid attack idiom.
