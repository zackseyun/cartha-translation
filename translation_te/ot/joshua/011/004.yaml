source:
  edition: WLC
  text: וַ/יֵּצְא֣וּ הֵ֗ם וְ/כָל מַֽחֲנֵי/הֶם֙ עִמָּ֔/ם עַם רָ֕ב כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַת הַ/יָּ֖ם לָ/רֹ֑ב וְ/ס֥וּס וָ/רֶ֖כֶב רַב מְאֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/004.yaml
  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
translation:
  language: te
  text: వారు తమ శిబిరాలన్నిటితో[a] కలిసి, సముద్రతీరపు ఇసుకవలె లెక్కలేనంత పెద్ద జనసమూహంతో బయలుదేరారు; వారి దగ్గర అత్యధిక సంఖ్యలో గుర్రాలూ రథాలూ ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సైన్యాలన్నిటితో.’ హీబ్రూ పదం సైనిక శిబిరాలను, విస్తృతార్థంలో వాటిలో సమీకరించబడిన సైన్యాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: బయలుదేరారు
  rationale: יצא అనే క్రియ బయటికి వెళ్లడం లేదా బయలుదేరడాన్ని సూచిస్తుంది. సందర్భంలో సైనిక కదలిక ఉన్నప్పటికీ, మూలంలో లేని ‘దండెత్తారు’ వంటి అదనపు భావాన్ని చేర్చకుండా ‘బయలుదేరారు’ అని అనువదించాం.
- source_word: מַחֲנֵיהֶם
  choice: తమ శిబిరాలన్నిటితో
  rationale: מַחֲנֶה అనే పదం శిబిరాన్ని, సందర్భానుసారం అక్కడ సమీకరించబడిన సైన్యాన్ని కూడా సూచించగలదు. ప్రధాన పాఠంలో మూలంలోని ‘శిబిరాలు’ అనే దృశ్యాన్ని నిలిపి, విస్తృత సైనిక అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: עַם רָב
  choice: విస్తారమైన జనసమూహం
  rationale: עַם רָב అక్షరార్థంగా ‘గొప్ప/అధికమైన ప్రజ’ అని ఉన్నా, ఇక్కడ సంఖ్యాపరంగా అతి పెద్ద సమూహాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘విస్తారమైన జనసమూహం’ అని ఇచ్చాం.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: సముద్రతీరాన ఉన్న ఇసుకంత విస్తారమైన
  rationale: ఇసుకతో చేసిన పోలిక అపార సంఖ్యను తెలియజేస్తుంది; לָרֹב లోని సమృద్ధి భావాన్ని ‘విస్తారమైన’ అనే పదంలో వ్యక్తం చేస్తూ మూలంలోని సముద్రతీరపు ఇసుక దృశ్యాన్ని నిలిపాం.
- source_word: סוּס וָרֶכֶב
  choice: గుర్రాలు, రథాలు
  rationale: హీబ్రూలో ఏకవచన రూపాలు సమూహార్థకంగా వాడబడ్డాయి. తెలుగులో సైనిక వనరుల జాబితాకు బహువచన రూపాలు సహజంగా ఉంటాయి.
- source_word: רַב מְאֹד
  choice: అత్యధికంగా
  rationale: ఈ పదబంధం గుర్రాలు, రథాల విపరీతమైన సంఖ్యను బలంగా తెలియజేస్తుంది. ‘అత్యధికంగా’ ఆ తీవ్రతను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
