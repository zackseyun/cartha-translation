  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలిని వాడాం. మూలంలోని సైనిక సందర్భాన్ని నిలిపినా, మూలపాఠంలో స్పష్టంగా లేని అదనపు యుద్ధ చర్యను చేర్చలేదు.
