revisions:
- from: ఈ పట్టణాల దోపుడు సొమ్మంతటినీ, పశువులనూ ఇశ్రాయేలీయులు తమ కోసం దోచుకున్నారు. అయితే ప్రజలందరినీ ఖడ్గపు అంచుతో హతమార్చి, వారిని పూర్తిగా నాశనం చేశారు. ఊపిరిగల వారెవరినీ మిగలనివ్వలేదు.[a]
  to: ఈ పట్టణాల దోపుడు సొమ్మంతటినీ, పశువులనూ ఇశ్రాయేలీయులు తమ కోసం దోచుకున్నారు. అయితే ప్రజలందరినీ ఖడ్గపు ధారతో హతమారుస్తూ, వారిని నాశనం చేసే వరకు కొనసాగించారు. ఊపిరిగల వారెవరినీ మిగలనివ్వలేదు.[a]
