id: JOS.11.14
reference: Joshua 11:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/כֹל שְׁלַ֞ל הֶ/עָרִ֤ים הָ/אֵ֨לֶּה֙ וְ/הַ/בְּהֵמָ֔ה בָּזְז֥וּ לָ/הֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֣ק אֶֽת כָּל הָ/אָדָ֞ם הִכּ֣וּ לְ/פִי חֶ֗רֶב עַד הִשְׁמִדָ/ם֙ אוֹתָ֔/ם לֹ֥א הִשְׁאִ֖ירוּ כָּל נְשָׁמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
translation:
  language: te
  text: ఈ పట్టణాల దోపుడు సొమ్మంతటినీ, పశువులనూ ఇశ్రాయేలీయులు తమ కోసం దోచుకున్నారు. అయితే ప్రజలందరినీ ఖడ్గపు ధారతో హతమారుస్తూ, వారిని నాశనం చేసే వరకు కొనసాగించారు. ఊపిరిగల వారెవరినీ మిగలనివ్వలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా, “ఊపిరిగల దేనినీ మిగలనివ్వలేదు”; భావం: సజీవంగా ఎవరినీ విడిచిపెట్టలేదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַל
  choice: దోపుడు సొమ్ము
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న వస్తుసంపదను సూచిస్తుంది; ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాలు
  rationale: ముందు ప్రస్తావించిన పట్టణాలను సూచించే సమీప సూచకార్థాన్ని నిలుపుతుంది.
- source_word: הַבְּהֵמָה
  choice: పశువులు
  rationale: దోపుడు ఆస్తిగా తీసుకున్న పెంపుడు జంతువులను సందర్భానుసారంగా సూచిస్తుంది.
- source_word: בָּזְזוּ לָהֶם
  choice: తమ కోసం దోచుకున్నారు
  rationale: దోచుకోవడమనే క్రియతో పాటు לָהֶםలోని తమ ప్రయోజనార్థక భావాన్ని కూడా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ అది ప్రజాసమూహపు స్థిర నామంగా పనిచేస్తున్నందున సహజమైన ఆధునిక తెలుగు జాతినామం వాడబడింది.
- source_word: כָּל הָאָדָם
  choice: ప్రజలందరినీ
  rationale: పశువులకు విరుద్ధంగా పట్టణాల్లోని మానవ జనాభా మొత్తాన్ని సూచించే సమూహార్థాన్ని, లింగపరంగా అనవసరంగా పరిమితం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: הִכּוּ לְפִי חֶרֶב
  choice: ఖడ్గపు అంచుతో హతమార్చి
  rationale: ‘ఖడ్గపు నోటితో’ అనే హీబ్రూ నుడికారంలోని ఆయుధధార భావాన్ని నిలుపుతూ, చర్య యొక్క ప్రాణాంతక ఫలితాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עַד הִשְׁמִדָם אֹתָם
  choice: వారిని పూర్తిగా నాశనం చేశారు
  rationale: שׁמד హిఫీల్ రూపంలోని నిర్మూలన భావాన్ని తెలియజేస్తుంది; ఇక్కడ లేని חרם పరిభాషను చేర్చదు.
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: ఊపిరిగల వారెవరినీ మిగలనివ్వలేదు
  rationale: נְשָׁמָהలోని ఊపిరి చిత్రాన్ని నిలుపుతూ, మానవ జనాభా సందర్భంలో ఎవరూ సజీవంగా మిగలలేదనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ సందర్భంలో పదబంధం వంశీయ-ప్రజాసమూహ నామంగా పనిచేస్తుంది. అక్షరానువాదం తెలుగులో పురుషులకు మాత్రమే పరిమితమైన భావాన్ని కలిగించవచ్చు; అందువల్ల సాధారణ సమూహనామం ఎన్నుకోబడింది.
- issue: כָּל הָאָדָם యొక్క పరిధి
  choice: ప్రజలందరినీ
  alternative: ప్రతి మనిషినీ
  rationale: אָדָם ఇక్కడ పశువులకు వ్యతిరేకంగా మానవ జనాభాను సమూహంగా సూచిస్తుంది. స్త్రీలు, పిల్లలను అనవసరంగా మినహాయించకుండా మూలంలోని విస్తృత పరిధిని నిలుపుతుంది.
- issue: నాశన భాష యొక్క స్వభావం
  choice: పూర్తిగా నాశనం చేశారు
  alternative: నాశనానికి అంకితం చేశారు
  rationale: ఈ ఉపవాక్యంలో שׁמד ఉంది, חרם లేదు. కాబట్టి ‘అంకితం’ అనే ప్రత్యేక ధార్మిక భావాన్ని దిగుమతి చేయకుండా నిర్మూలన భావమే ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదిగానూ సామాన్య పాఠకులకు స్పష్టమైనదిగానూ ఉంచబడింది. హింసాత్మక మూలవాక్యపు తీవ్రతను తగ్గించలేదు; హీబ్రూ సమూహార్థం మరియు ‘ఊపిరి’ చిత్రాన్ని సహజ తెలుగులో నిలిపింది.
