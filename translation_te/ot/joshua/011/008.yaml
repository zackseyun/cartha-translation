  to: యాహ్వే వారిని ఇశ్రాయేలు చేతికి అప్పగించాడు. ఇశ్రాయేలీయులు వారిని కొట్టి, మహా సీదోను వరకూ, మిస్రెఫోత్-మయిము[a] వరకూ, తూర్పున ఉన్న మిస్పే లోయ వరకూ వారిని తరిమారు. వారిలో ఒక్కరూ మిగలకుండా[b] వారిని హతమార్చారు.
  rationale: మొదటి యుద్ధచర్యలను అసమాపక క్రియల నుంచి వరుస క్రియలుగా మార్చి మూలపాఠంలోని క్రమాన్ని స్పష్టపరిచాం. మానవులను సూచించే చోట అసహజమైన ‘ఒక్క ప్రాణి’ని ‘ఒక్కరూ’గా సరిచేశాం. చివరి ఉపవాక్యం మూలంలో ఉన్న కార్యసాధక-సంఖ్య అస్పష్టతను ఫలితాన్ని తెలిపే నిర్మాణంతో అలాగే ఉంచుతుంది.
