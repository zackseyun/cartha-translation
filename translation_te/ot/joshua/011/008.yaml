id: JOS.11.8
reference: Joshua 11:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוָ֥ה בְּ/יַֽד יִשְׂרָאֵל֮ וַ/יַּכּוּ/ם֒ וַֽ/יִּרְדְּפ֞וּ/ם עַד צִיד֣וֹן רַבָּ֗ה וְ/עַד֙ מִשְׂרְפ֣וֹת מַ֔יִם וְ/עַד בִּקְעַ֥ת מִצְפֶּ֖ה מִזְרָ֑חָ/ה וַ/יַּכֻּ֕/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר לָ/הֶ֖ם שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
translation:
  language: te
  text: యాహ్వే వారిని ఇశ్రాయేలు చేతికి అప్పగించాడు. ఇశ్రాయేలీయులు వారిని కొట్టి, మహా సీదోను వరకూ, మిస్రెఫోత్-మయిము[a] వరకూ, తూర్పున ఉన్న మిస్పే లోయ వరకూ వారిని తరిమారు. వారిలో ఒక్కరూ మిగలకుండా[b] వారిని హతమార్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మిస్రెఫోత్-మయిము” ఒక స్థలనామం; హీబ్రూ పదాలకు “నీళ్ల దహనాలు” అనే అర్థం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారికి ఒక్క శేషాన్నీ మిగల్చకుండా.” హీబ్రూ నిర్మాణం ఇక్కడ కార్యసాధకుడి సంఖ్యను ప్రత్యేకంగా పేర్కొనదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵם ... בְּיַד יִשְׂרָאֵל
  choice: వారిని ఇశ్రాయేలు చేతికి అప్పగించాడు
  rationale: సైనిక సందర్భంలో נתן ביד అంటే శత్రువును మరొకరి అధికారానికి అప్పగించడం. ‘చేతికి’ అని ఉంచడం ద్వారా హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיַּכּוּם / וַיַּכֻּם
  choice: వారిని హతమార్చుతూ / వారిని హతమార్చారు
  rationale: యుద్ధ సందర్భంలోని נכה ఇక్కడ కేవలం ఓడించడం కంటే ప్రాణాంతకంగా కొట్టివేయడాన్ని సూచిస్తుంది; చివర ఎవరూ మిగలలేదనే మాట దీనిని బలపరుస్తుంది. పునరుక్తిని నిలిపాం.
- source_word: וַיִּרְדְּפוּם
  choice: వారిని ... తరుముకుంటూ వెళ్లారు
  rationale: పారిపోతున్న శత్రువును వెంబడించడాన్ని తెలిపే רדףకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: צִידוֹן רַבָּה
  choice: మహా సీదోను
  rationale: రַבָּה అనే విశేషణాన్ని స్థలనామంతో కలిపి ‘మహా సీదోను’గా అనువదించాం.
- source_word: מִשְׂרְפוֹת מַיִם
  choice: మిస్రెఫోత్-మయిము
  rationale: ఇది స్థలనామం కావడంతో లిప్యంతరీకరించాం; పదాల సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בִּקְעַת מִצְפֶּה מִזְרָחָה
  choice: తూర్పున ఉన్న మిస్పే లోయ
  rationale: בִּקְעָה విశాలమైన లోయను సూచిస్తుంది; מִזְרָחָהను సందర్భానుసారంగా ‘తూర్పున ఉన్న’ అని సహజంగా తెలిపాం.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לָהֶם שָׂרִיד
  choice: వారిలో ఒక్క ప్రాణి కూడా మిగలకుండా
  rationale: హీబ్రూ నిర్మాణం కార్యసాధకుడిని స్పష్టంగా వ్యక్తం చేయదు. తెలుగులోనూ దానిని బలవంతంగా ఏకవచన లేదా బహువచన కర్తకు కట్టిపెట్టకుండా, ఒక్క బతికినవాడూ మిగలలేదనే ఫలితాన్ని స్పష్టంగా చెప్పాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం సాధారణ బిరుదును కాక దేవుని వ్యక్తిగత నామాన్ని వాడుతుంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడే ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: చివరి ఉపవాక్యంలో కార్యసాధకుడి సంఖ్య
  choice: కర్తను నిర్దిష్టం చేయని ‘మిగలకుండా’ నిర్మాణం
  alternative: అతడు మిగల్చలేదు / వారు మిగల్చలేదు
  rationale: הִשְׁאִיר ఇక్కడ ఇన్ఫినిటివ్ నిర్మాణంలో ఉండి స్వతంత్రంగా ఏకవచన లేదా బహువచన కర్తను గుర్తించదు. సందర్భంలో ఇశ్రాయేలు సమూహం కార్యసాధకుడైనా, మూలంలోని రూపాన్ని మించి సంఖ్యను నిర్ణయించకుండా ఫలితాన్ని తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. వరుసగా వచ్చే స్థలనామాలను సులభంగా చదవడానికి వాక్యాన్ని రెండుగా విభజించాం. ‘ఇశ్రాయేలు’ తర్వాత వచ్చే బహువచన క్రియకు పాఠకుడు సులభంగా అనుసంధానించేందుకు ‘ఇశ్రాయేలీయులు’ అని స్పష్టపరిచాం; ఇది మూలంలోని సమూహార్థాన్ని వ్యక్తం చేస్తుంది.
