id: JOS.11.12
reference: Joshua 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְֽ/אֶת כָּל עָרֵ֣י הַ/מְּלָכִֽים הָ֠/אֵלֶּה וְֽ/אֶת כָּל מַלְכֵי/הֶ֞ם לָכַ֧ד יְהוֹשֻׁ֛עַ וַ/יַּכֵּ֥/ם לְ/פִי חֶ֖רֶב הֶחֱרִ֣ים אוֹתָ֑/ם כַּ/אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/012.yaml
  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
translation:
  language: te
  text: యెహోషువ ఈ రాజుల పట్టణాలన్నిటినీ, వారి రాజులందరినీ స్వాధీనం చేసుకున్నాడు. వారిని కత్తి ధారతో హతమార్చి, నిర్మూలనకు అంకితం చేశాడు[a]. యాహ్వే సేవకుడైన మోషే ఆజ్ఞాపించిన ప్రకారం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పూర్తిగా నిర్మూలించాడు.” ఇక్కడి హీబ్రూ క్రియ వ్యక్తులను లేదా వస్తువులను నిషేధం కింద ఉంచి, తిరుగులేని విధంగా నిర్మూలనకు అంకితం చేయడాన్ని సూచించే సాంకేతిక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמְּלָכִים הָאֵלֶּה
  choice: ఈ రాజుల పట్టణాలన్నిటినీ
  rationale: హీబ్రూ సమాస నిర్మాణంలోని ‘ఈ రాజుల పట్టణాలు’ అనే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా నిలుపుతుంది; ‘రాజపట్టణాలు’ అని అర్థాన్ని విస్తరించదు.
- source_word: לָכַד
  choice: పట్టుకున్నాడు
  rationale: యుద్ధంలో పట్టణాలను స్వాధీనం చేసుకోవడం, రాజులను పట్టుకోవడం—రెండింటికీ సరిపోయే సహజమైన క్రియ.
- source_word: וַיַּכֵּם
  choice: వారిని ... హతమార్చి
  rationale: נכה అనే క్రియకు విస్తృతార్థం ఉన్నప్పటికీ, వెంట వచ్చే కత్తి ప్రస్తావన ఇక్కడ ప్రాణాంతక చర్యను సూచిస్తుంది. ‘హతమార్చి’ స్పష్టంగా, గౌరవప్రదమైన కథన శైలిలో ఉంది.
- source_word: לְפִי חֶרֶב
  choice: కత్తివాతకు
  rationale: అక్షరార్థంగా ‘కత్తి నోటికి’ అనే హీబ్రూ నుడికారానికి, కత్తి పదునుతో సంహరించడం అనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֶחֱרִים
  choice: నిర్మూలనకు అంకితం చేశాడు
  rationale: חרם అనే సాంకేతిక పదంలోని కేవలం నాశనం చేయడం మాత్రమే కాక, తిరుగులేని విధంగా నిర్మూలనకు ప్రత్యేకించడం అనే భావాన్ని కాపాడుతుంది.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినట్టే
  rationale: యెహోషువ చేసిన పని మోషే ఇంతకుముందు ఇచ్చిన ఆజ్ఞకు సరిగ్గా అనుగుణంగా ఉందని తెలిపే పోలికను నిలుపుతుంది.
- source_word: עֶבֶד יְהוָה
  choice: యాహ్వే సేవకుడైన
  rationale: మోషేకు గౌరవప్రదమైన ఒడంబడిక సంబంధ బిరుదుగా עבד ను ‘సేవకుడు’ అని అనువదించడం సందర్భోచితం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ ధ్వన్యనుకరణగా అందిస్తుంది.
theological_decisions:
- issue: ఆక్రమణ సందర్భంలో חרם పదప్రయోగం
  choice: నిర్మూలనకు అంకితం చేశాడు
  alternative: పూర్తిగా నిర్మూలించాడు; శాపిత నిషేధం కింద ఉంచాడు
  rationale: ఇది సాధారణ నాశన క్రియ మాత్రమే కాదు; వ్యక్తులను లేదా వస్తువులను తిరుగులేని విధంగా నిర్మూలనకు ప్రత్యేకించే సాంకేతిక భావాన్ని కలిగి ఉంది. ఎంపిక చేసిన పదబంధం ఆ ఉద్రిక్తతను చదునుచేయకుండా తెలుగులో అర్థమయ్యేలా ఉంచుతుంది.
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామమే ఉంది. కాబట్టి దానిని ఒక బిరుదుతో భర్తీ చేయకుండా ధ్వన్యనుకరణగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. మొదటి వాక్యంలో పట్టణాలు మరియు రాజులను పట్టుకోవడాన్ని స్పష్టంగా పేర్కొని, హీబ్రూలోని పుంలింగ బహువచన సర్వనామానికి అనుగుణంగా తరువాత ‘వారిని’ అని రాజులను సూచించాం. మూలంలోని దీర్ఘ సమన్వయ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; చివరి వాక్యం మోషే ఆజ్ఞకు అనుగుణతను సహజంగా తెలియజేస్తుంది.
