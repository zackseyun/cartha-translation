source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֣ה אֶל יְהוֹשֻׁעַ֮ אַל תִּירָ֣א מִ/פְּנֵי/הֶם֒ כִּֽי מָחָ֞ר כָּ/עֵ֣ת הַ/זֹּ֗את אָנֹכִ֞י נֹתֵ֧ן אֶת כֻּלָּ֛/ם חֲלָלִ֖ים לִ/פְנֵ֣י יִשְׂרָאֵ֑ל אֶת סוּסֵי/הֶ֣ם תְּעַקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
translation:
  language: te
  text: 'యహ్వే యెహోషువతో ఇలా అన్నాడు: “వారికి భయపడకు. ఎందుకంటే రేపు ఇదే సమయానికి[a] వారందరినీ ఇశ్రాయేలు ఎదుట హతులుగా అప్పగిస్తున్నాను.[b] నీవు వారి గుర్రాల కాలి నరాలను కోసి, వారి రథాలను నిప్పుతో కాల్చివేయాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రేపు ఇంచుమించు ఇదే సమయానికి.’
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ వాక్యరూపం: ‘వారందరినీ ఇశ్రాయేలు ఎదుట హతులుగా ఇస్తున్నాను’; అంటే, ఇశ్రాయేలు వారిని హతమార్చేలా వారిని అప్పగిస్తున్నాను.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: אַל תִּירָא מִפְּנֵיהֶם
  choice: వారికి భయపడకు
  rationale: భయానికి కారణమైన వారిని సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: מָחָר כָּעֵת הַזֹּאת
  choice: రేపు ఇదే సమయానికి
  rationale: రేపటి రోజున ప్రస్తుత సమయానికి సమానమైన వేళను సూచించే కాలప్రయోగం; כְּ యొక్క సుమారు భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: אָנֹכִי נֹתֵן
  choice: అప్పగిస్తున్నాను
  rationale: స్వతంత్ర సర్వనామంతో కూడిన వర్తమాన కృదంతం ఇచ్చే సన్నిహితమైన, నిశ్చిత కార్యభావాన్ని నిలుపుతుంది.
- source_word: אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל
  choice: వారందరినీ ఇశ్రాయేలు ఎదుట హతులుగా
  rationale: חֲלָלִים యుద్ధంలో హతులైనవారిని సూచిస్తుంది; לִפְנֵי అనే స్థలసంబంధ రూపాన్ని ‘ఎదుట’గా నిలిపి, దాని సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: תְּעַקֵּר
  choice: కాలి నరాలను కోసి
  rationale: సైనిక సందర్భంలో గుర్రాలను పనికిరాకుండా చేయడానికి వాటి వెనుక కాలి నరాలను కోయడాన్ని స్పష్టంగా, సాధారణ పాఠకునికి అర్థమయ్యేలా చెబుతుంది.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: వారి రథాలను
  rationale: యుద్ధ రథాలకు వాడిన సాధారణ హీబ్రూ పదానికి సహజమైన తెలుగు సమానం.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: నిప్పుతో కాల్చివేయాలి
  rationale: మూలంలో స్పష్టంగా ఉన్న ‘అగ్నితో’ అనే సాధనార్థాన్ని నిలుపుతూ ఆజ్ఞను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: ఈ వచనంలో బిరుదు కాకుండా దైవనామమే ఉంది. అందువల్ల దానిని దాచకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది; ఒక నిర్దిష్ట సంప్రదాయపు బిరుదును చేర్చలేదు.
- issue: శత్రువులు హతులవడంలో దేవుని క్రియాశీలత
  choice: వారందరినీ ... హతులుగా అప్పగిస్తున్నాను
  alternative: వారందరూ ... హతులవుతారు
  rationale: మూలంలోని మొదటి పురుష క్రియను, దాని వాగ్దానాత్మక నిశ్చయాన్ని నిలిపింది; నిష్క్రియాత్మకంగా చేసి దైవక్రియను తగ్గించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే పదజాలం వాడింది. మూలంలోని యుద్ధసంబంధ కఠినతను మెత్తబరచలేదు; అసహజమైన పదక్షరానువాదాన్ని మాత్రం పాదసూచికతో స్పష్టం చేసింది.
