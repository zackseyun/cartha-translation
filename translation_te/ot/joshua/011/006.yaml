  source_fidelity: 'The translation accurately represents the Hebrew: Yahweh speaks to Joshua, the prohibition against fearing the enemy, the imminent temporal promise, the vivid participial ‘I am giving,’ the enemies as battle-slain before Israel, and the commands concerning horses and chariots are all retained. ‘వారికి భయపడకు’ naturally conveys the idiomatic force of מִפְּנֵיהֶם in modern Telugu.'
