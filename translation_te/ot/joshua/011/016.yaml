source:
  edition: WLC
  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֣רֶץ הַ/זֹּ֗את הָ/הָ֤ר וְ/אֶת כָּל הַ/נֶּ֨גֶב֙ וְ/אֵת֙ כָּל אֶ֣רֶץ הַ/גֹּ֔שֶׁן וְ/אֶת הַ/שְּׁפֵלָ֖ה וְ/אֶת הָ/עֲרָבָ֑ה וְ/אֶת הַ֥ר יִשְׂרָאֵ֖ל וּ/שְׁפֵלָתֹֽ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
translation:
  language: te
  text: 'యెహోషువ ఈ భూభాగమంతటినీ స్వాధీనం చేసుకున్నాడు: కొండప్రాంతాన్ని, నెగెబు ప్రాంతమంతటినీ, గోషెను దేశమంతటినీ[c], లోతట్టు ప్రాంతాన్ని[a], అరాబాను[b], ఇశ్రాయేలు కొండప్రాంతాన్ని, దాని లోతట్టు ప్రాంతాన్ని[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లోతట్టు ప్రాంతం’కు బదులుగా ‘షెఫేలా’ అని కూడా అనువదించవచ్చు. ఈ హీబ్రూ పదం మధ్య కొండప్రాంతానికి, తీర మైదానానికి మధ్యనున్న తక్కువ ఎత్తుగల కొండల ప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అరాబా’ ఒక భౌగోళిక ప్రాంతనామం. సందర్భానుసారంగా కొందరు దీనిని ‘యొర్దాను లోయ’ లేదా ‘ఎడారి మైదానం’ అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడి ‘గోషెను దేశం’ కనానులోని ఒక ప్రాంతాన్ని సూచిస్తుంది; అది ఐగుప్తులోని గోషెను ప్రాంతమే కావాల్సిన అవసరం లేదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: స్వాధీనం చేసుకున్నాడు
  rationale: לקח యొక్క ప్రాథమిక భావం ‘తీసుకోవడం’; ఇక్కడ విజయయాత్ర సారాంశ సందర్భంలో భూభాగాన్ని తన అధీనంలోకి తెచ్చుకోవడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: ఈ దేశమంతటినీ
  rationale: אֶרֶץ ఇక్కడ తరువాత పేర్కొనే ప్రాంతాలన్నిటినీ కలిపిన భూభాగాన్ని సూచిస్తుంది; הַזֹּאת లోని సూచనార్థాన్ని ‘ఈ’ నిలుపుతుంది.
- source_word: הָהָר
  choice: కొండప్రాంతం
  rationale: యెహోషువ గ్రంథంలో ఇది విడివిడిగా ఉన్న కొండలను కాక, ఎత్తైన భౌగోళిక ప్రాంతాన్ని సాధారణంగా సూచిస్తుంది.
- source_word: הַנֶּגֶב
  choice: నెగెబు ప్రాంతం
  rationale: ఇది కేవలం ‘దక్షిణం’ అనే దిశార్థం కాక, గుర్తించదగిన దక్షిణ భౌగోళిక ప్రాంతనామంగా వాడబడింది.
- source_word: אֶרֶץ הַגֹּשֶׁן
  choice: గోషెను దేశం
  rationale: హీబ్రూ నిర్మాణాన్ని నేరుగా నిలుపుతుంది; ఇది ఐగుప్తులోని గోషెనే అని ప్రధాన పాఠ్యంలో నిర్ధారించదు.
- source_word: הַשְּׁפֵלָה
  choice: లోతట్టు ప్రాంతం
  rationale: మధ్య ఎత్తైన ప్రాంతానికి, తీర మైదానానికి మధ్యనున్న తక్కువ ఎత్తుగల కొండల ప్రాంతాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా అనువదిస్తుంది.
- source_word: הָעֲרָבָה
  choice: అరాబా
  rationale: ఇది ప్రత్యేక ప్రాంతాన్ని సూచించే భౌగోళిక పదం; ‘యొర్దాను లోయ’ అని అనువదిస్తే భావం అనవసరంగా సంకుచితమయ్యే అవకాశం ఉంది.
- source_word: הַר יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కొండప్రాంతం
  rationale: הַר యొక్క ప్రాంతీయ భావాన్ని నిలుపుతూ, ఇశ్రాయేలుతోనున్న సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וּשְׁפֵלָתוֹ
  choice: దాని లోతట్టు ప్రాంతం
  rationale: పుంలింగ ఏకవచన ప్రత్యయం ముందు ఉన్న ‘ఇశ్రాయేలు కొండప్రాంతం’ వైపు సహజంగా సూచిస్తుంది; ఎత్తైన ప్రాంతం–లోతట్టు ప్రాంతం జతను నిలుపుతుంది.
