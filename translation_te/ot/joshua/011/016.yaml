translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే భాషను ఉపయోగించాం. భౌగోళిక ప్రాంతనామాలైన ‘నెగెబు’, ‘అరాబా’లను లిప్యంతరీకరించి, వివరణ అవసరమైన చోట పాదటిప్పణులు ఇచ్చాం. ‘అంతటినీ/అంతటినీ’ ద్వారా హీబ్రూలో పునరావృతమయ్యే כָּל భావాన్ని సాధ్యమైనంతవరకు నిలిపాం.
