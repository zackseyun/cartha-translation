  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא הָיְתָ֣ה עִ֗יר אֲשֶׁ֤ר הִשְׁלִ֨ימָה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל בִּלְתִּ֥י הַ/חִוִּ֖י יֹשְׁבֵ֣י גִבְע֑וֹן אֶת הַ/כֹּ֖ל לָקְח֥וּ בַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
translation:
  language: te
  text: ఇశ్రాయేలీయులతో శాంతి చేసుకున్న పట్టణం ఒక్కటీ లేదు—గిబ్యోనులో నివసించిన హివ్వీయులు తప్ప. వారందరినీ వారు యుద్ధంలో స్వాధీనం చేసుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁלִימָה אֶל
  choice: శాంతి చేసుకున్న
  rationale: హిఫిల్ రూపంలోని שׁלם ఇక్కడ శాంతియుత సంబంధం లేదా ఒప్పందంలోకి రావడాన్ని సూచిస్తుంది. సందర్భంలో గిబ్యోనీయుల ఒప్పందాన్ని దృష్టిలో ఉంచుతూ, ‘లొంగిపోయిన’ అనే అధిక నిర్దిష్ట భావాన్ని చేర్చకుండా ‘శాంతి చేసుకున్న’ అని అనువదించాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ ఉన్నా, ఆధునిక తెలుగు వాడుకలో జాతి సమూహాన్ని సహజంగా, సమగ్రంగా సూచించడానికి ‘ఇశ్రాయేలీయులు’ అనుకూలం.
- source_word: בִּלְתִּי
  choice: తప్ప
  rationale: ముందున్న సంపూర్ణ నిరాకరణకు ఏకైక మినహాయింపును స్పష్టంగా సూచిస్తుంది.
- source_word: הַחִוִּי יֹשְׁבֵי גִבְעוֹן
  choice: గిబ్యోనులో నివసించిన హివ్వీయులు
  rationale: יֹשְׁבֵי అనే నివాసాన్ని సూచించే కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֶת הַכֹּל
  choice: మిగిలిన పట్టణాలన్నిటినీ
  rationale: ‘అన్నిటినీ’ అనే హీబ్రూ పదబంధానికి సందర్భం నుండి పట్టణాలే సూచిత కర్మగా కనిపిస్తున్నాయి. మినహాయించబడిన గిబ్యోను తరువాత ‘మిగిలిన’ అని చెప్పడం తెలుగు వాక్యార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: לָקְחוּ
  choice: స్వాధీనం చేసుకున్నారు
  rationale: לקח మూలార్థం ‘తీసుకొను’; యుద్ధ సందర్భంలో పట్టణాలను చేజిక్కించుకోవడం అనే భావాన్ని సహజంగా వ్యక్తపరుస్తూ, విధ్వంసం వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: בַמִּלְחָמָה
  choice: యుద్ధంలో
  rationale: పట్టణాలు యుద్ధం ద్వారా స్వాధీనం అయ్యాయని తెలిపే సహజమైన, నేరుగా ఉన్న తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన గద్యాన్ని ఉపయోగించాం. హీబ్రూ వాక్యంలోని నిరాకరణ–మినహాయింపు నిర్మాణాన్ని డాష్‌తో స్పష్టంగా చూపించాం; వివరణాత్మక లేదా మతశాఖాపరమైన పదజాలాన్ని చేర్చలేదు.
