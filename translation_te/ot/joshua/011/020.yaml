source:
  edition: WLC
  text: כִּ֣י מֵ/אֵ֣ת יְהוָ֣ה הָיְתָ֡ה לְ/חַזֵּ֣ק אֶת לִבָּ/ם֩ לִ/קְרַ֨את הַ/מִּלְחָמָ֤ה אֶת יִשְׂרָאֵל֙ לְמַ֣עַן הַֽחֲרִימָ֔/ם לְ/בִלְתִּ֥י הֱיוֹת לָ/הֶ֖ם תְּחִנָּ֑ה כִּ֚י לְמַ֣עַן הַשְׁמִידָ֔/ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
translation:
  language: te
  text: ఎందుకంటే, వారు ఇశ్రాయేలుతో యుద్ధానికి తలపడేలా వారి హృదయాలను కఠినపరచడం యెహోవా నుంచే జరిగింది[a]; వారిని సంపూర్ణ నాశనానికి అంకితం చేయడానికి[b], వారి కొరకు కనికర విన్నపం లేకుండా[c] వారిని నాశనం చేయడానికి, యెహోవా మోషేకు ఆజ్ఞాపించిన ప్రకారమే జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి హృదయాలను బలపరచడం.’ ఇక్కడ భావం వారు ప్రతిఘటనలో దృఢంగా, మొండిగా నిలిచేలా చేయడం.
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీలో ఇది తీర్పు కింద ఒకరిని లేదా దేనినైనా సంపూర్ణ నాశనానికి ప్రత్యేకించి అంకితం చేయడాన్ని సూచించే సాంకేతిక పదం. మరో అనువాదం: ‘వారిని పూర్తిగా నాశనం చేయడానికి.’'
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘వారికి కనికరం లేకుండా’ లేదా ‘వారికి అనుగ్రహం లేకుండా.’ హెబ్రీ పదబంధం సంక్షిప్తంగా ఉంది; అది వారి కొరకు ఎటువంటి విన్నపం లేకపోవడాన్నీ, వారికి కనికరం లేదా అనుగ్రహం లేకపోవడాన్నీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  choice: యెహోవా నుంచే జరిగింది
  rationale: ఈ పదబంధం కార్యానికి మూలం యెహోవాయేనని స్పష్టంగా తెలియజేస్తుంది. ‘నుంచే’ అనే రూపం దైవకర్తృత్వాన్ని తగ్గించకుండా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְחַזֵּק אֶת לִבָּם
  choice: వారి హృదయాలను కఠినపరచడం
  rationale: חזק అనే క్రియకు ప్రాథమికంగా ‘బలపరచు’ అనే భావం ఉన్నా, ఈ సందర్భంలో ప్రతిఘటనలో దృఢంగా, మొండిగా నిలిచేలా చేయడం ఉద్దేశం. ‘హృదయాలను కఠినపరచడం’ మూలంలోని రూపకాన్ని, దాని సందర్భార్థాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  choice: వారు ఇశ్రాయేలుతో యుద్ధానికి తలపడేలా
  rationale: לִקְרַאת మరియు యుద్ధపదజాలం కలిసి శత్రుత్వపూర్వకంగా యుద్ధంలో ఎదుర్కోవడాన్ని సూచిస్తాయి. ‘యుద్ధానికి తలపడడం’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לְמַעַן הַחֲרִימָם
  choice: వారిని సంపూర్ణ నాశనానికి అంకితం చేయడానికి
  rationale: חרם అనేది తీర్పు కింద పూర్తిగా నాశనానికి ప్రత్యేకింపబడడాన్ని సూచించే సాంకేతిక పదం. ‘నాశనం చేయడం’ మాత్రమే అనకుండా ‘నాశనానికి అంకితం’ అని చెప్పడం ఆ ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: לְבִלְתִּי הֱיוֹת לָהֶם תְּחִנָּה
  choice: వారికి కనికరం దక్కకుండా
  rationale: תְּחִנָּהలో వేడుకోలు, అనుగ్రహం లేదా కనికరం అనే అనుబంధ భావాలు ఉన్నాయి. ఈ సంక్షిప్త హెబ్రీ పదబంధంలో వేడుకునే వ్యక్తిని ఊహించి చేర్చకుండా, సందర్భానికి సరిపోయే ఫలితాన్ని సహజమైన తెలుగులో తెలిపింది.
- source_word: לְמַעַן הַשְׁמִידָם
  choice: వారిని నాశనం చేయడానికి
  rationale: שמד సంపూర్ణమైన విధ్వంసాన్ని సూచిస్తుంది. ‘నాశనం చేయడం’ బలమైనదీ, స్పష్టమైనదీ, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనదీ.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యెహోవా మోషేకు ఆజ్ఞాపించిన ప్రకారమే
  rationale: כַּאֲשֶׁר ముందుగా ఇచ్చిన ఆజ్ఞతో అనుగుణతను సూచిస్తుంది. ‘ప్రకారమే’ ఆ ఖచ్చితమైన అనుగుణతను తెలియజేస్తుంది.
theological_decisions:
- issue: కనానీయుల హృదయాలను కఠినపరచడంలో దైవకర్తృత్వం
  choice: ‘యెహోవా నుంచే జరిగింది’ అని దైవకర్తృత్వాన్ని స్పష్టంగా నిలుపడం
  alternative: యెహోవా వారి హృదయాలు కఠినపడడానికి అనుమతించాడు
  rationale: హెబ్రీ వాక్యం ఈ కార్యానికి మూలాన్ని నేరుగా యెహోవాకే ఆపాదిస్తుంది. దాన్ని కేవలం అనుమతిగా మార్చడం మూలంలో లేని సిద్ధాంతపరమైన మృదుత్వాన్ని చేర్చుతుంది.
- issue: חרם అనే తీర్పు సంబంధిత పదం
  choice: ‘సంపూర్ణ నాశనానికి అంకితం చేయడం’
  alternative: ‘పూర్తిగా నాశనం చేయడం’ లేదా ‘నిషేధం కింద ఉంచడం’
  rationale: ఈ ఎంపిక సాధారణ విధ్వంసానికి మించిన, తీర్పు కింద ప్రత్యేకించి నాశనానికి అప్పగించే సాంకేతిక భావాన్ని కనిపించేలా ఉంచుతుంది.
- issue: నాశనం చేసే క్రియలకు వ్యాకరణపరంగా సూచింపబడిన కర్త
  choice: తెలుగులో కర్తను అదనంగా నిర్దేశించకుండా ఉద్దేశార్థక క్రియారూపాలను వాడడం
  alternative: ప్రతి క్రియకూ యెహోవా లేదా ఇశ్రాయేలు/యెహోషువను స్పష్టమైన కర్తగా చేర్చడం
  rationale: హెబ్రీ అనంతక్రియలలో కర్త సందర్భం ద్వారా గ్రహించబడుతుంది; ప్రతి చోట ఒకే కర్తను స్పష్టంగా చేరిస్తే మూలంలోని కొంత సంక్షిప్తత, సంభావ్య అస్పష్టత తొలగిపోతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. ‘హృదయాలను కఠినపరచడం,’ ‘నాశనానికి అంకితం చేయడం’ వంటి మూలపాఠంలోని కీలక రూపకాలు, తీర్పు సంబంధిత పదజాలం నిలుపబడ్డాయి. వాక్య ప్రవాహం కోసం రెండవ వాక్యంలో ఉద్దేశార్థక నిర్మాణం వాడబడింది; మూలంలో స్పష్టంగా లేని కర్తను అనవసరంగా చేర్చలేదు.
