revisions:
- from: ఉత్తరాన ఉన్న రాజులకూ—కొండ ప్రాంతంలో, కిన్నెరెతుకు దక్షిణాన ఉన్న అరాబాలో, దిగువ ప్రాంతంలో, పడమటి వైపున ఉన్న దోరు మెరక ప్రాంతాల్లో[a][b] ఉన్న రాజులకూ—
  to: మరియు ఉత్తరాన కొండ ప్రాంతంలో, కిన్నెరెతుకు దక్షిణాన ఉన్న అరాబాలో, దిగువ ప్రాంతంలో, పడమటి వైపున[b] ఉన్న దోరు మెరక ప్రాంతాల్లో[a] ఉన్న రాజులకూ—
  rationale: మూలంలోని ఒక్క ‘రాజులకు’ అనే గ్రహీతను తెలుగులో ఒక్కసారే ఉంచి, దానికి సంబంధించిన అన్ని భౌగోళిక విశేషణాలను వరుసగా ఇచ్చాము. వచనం ముందటి వచనపు జాబితాకు కొనసాగింపు కాబట్టి ఆరంభంలోని ‘మరియు,’ అంత్యంలోని దీర్ఘవిరామం నిలుపబడ్డాయి. నָפוֹת మరియు מִיָּםకు సంబంధించిన అనిశ్చితి లేదా దిశార్థాన్ని పాదసూచికలు యథావిధిగా, కానీ సరైన అంకరులతో, భద్రపరుస్తాయి.
