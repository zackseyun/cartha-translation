source:
  edition: WLC
  text: וְֽ/אֶל הַ/מְּלָכִ֞ים אֲשֶׁ֣ר מִ/צְּפ֗וֹן בָּ/הָ֧ר וּ/בָ/עֲרָבָ֛ה נֶ֥גֶב כִּֽנֲר֖וֹת וּ/בַ/שְּׁפֵלָ֑ה וּ/בְ/נָפ֥וֹת דּ֖וֹר מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/002.yaml
  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
translation:
  language: te
  text: మరియు ఉత్తరాన కొండ ప్రాంతంలో, కిన్నెరెతుకు దక్షిణాన ఉన్న అరాబాలో, దిగువ ప్రాంతంలో, పడమటి వైపున[b] ఉన్న దోరు మెరక ప్రాంతాల్లో[a] ఉన్న రాజులకూ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దోరు జిల్లాల్లో,’ ‘దోరు ప్రాంతంలో,’ లేదా ‘దోరు వాలుల్లో’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం అరుదైనది; అది సూచించే భూస్వరూపం గురించి భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘సముద్రం నుండి.’ హీబ్రూ భౌగోళిక వాడుకలో ఇది సాధారణంగా ‘పడమటి వైపున’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל הַמְּלָכִים
  choice: రాజులకూ
  rationale: ముందటి వచనంలోని జాబితాను וְ కొనసాగిస్తుంది; אֶל గ్రహీతలను సూచిస్తుంది. అందువల్ల తెలుగు వాక్యప్రవాహంలో ‘రాజులకూ’ సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר מִצְּפוֹן
  choice: ఉత్తరాన ఉన్న
  rationale: ఈ మాటలు రాజుల భౌగోళిక స్థానాన్ని తెలియజేస్తాయి. ‘ఉత్తరాన ఉన్న’ అనేది ‘ఉత్తరం నుండి వచ్చిన’ అనే చలనార్థాన్ని అనవసరంగా చేర్చకుండా స్థానార్థాన్ని నిలుపుతుంది.
- source_word: בָּהָר
  choice: కొండ ప్రాంతంలో
  rationale: యెహోషువలో הַר ఒక ప్రత్యేక పర్వతాన్ని కాక విస్తృతమైన కొండ ప్రాంతాన్ని సూచించగలదు; ‘కొండ ప్రాంతం’ ఆ ప్రాంతీయ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּבָעֲרָבָה
  choice: అరాబాలో
  rationale: עֲרָבָה ఇక్కడ నిర్దిష్ట భౌగోళిక ప్రాంతనామం. సాధారణమైన ‘మైదానం’ అని మార్చకుండా ‘అరాబా’గా ఉంచడం భౌగోళిక ప్రత్యేకతను కాపాడుతుంది.
- source_word: נֶגֶב כִּנֲרוֹת
  choice: కిన్నెరెతుకు దక్షిణాన ఉన్న
  rationale: ఇక్కడ נֶגֶב ఉత్తర ప్రాంతమైన కిన్నెరెతుతో సంబంధించి దిశను సూచిస్తుంది; సాంకేతిక ప్రాంతనామమైన ‘నెగెవు’ కంటే ‘దక్షిణాన’ సందర్భానికి సరిపోతుంది.
- source_word: וּבַשְּׁפֵלָה
  choice: దిగువ ప్రాంతంలో
  rationale: שְׁפֵלָה దిగువ నేలలు లేదా పాదభూముల ప్రాంతాన్ని సూచిస్తుంది. సాధారణ పాఠకునికి అర్థమయ్యేలా ‘దిగువ ప్రాంతం’ అని అనువదించబడింది.
- source_word: וּבְנָפוֹת דּוֹר
  choice: దోరు మెరక ప్రాంతాల్లో[a]
  rationale: נָפוֹת అరుదైన భౌగోళిక పదం; దోరుతో అనుబంధమైన ఎత్తైన లేదా వాలుగా ఉన్న భూభాగం అనే సాధ్యమైన భావాన్ని ‘మెరక ప్రాంతాలు’ అందిస్తుంది. ఖచ్చితమైన అర్థం వివాదాస్పదం కాబట్టి ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: מִיָּם
  choice: పడమటి వైపున[b]
  rationale: יָם అక్షరార్థంగా ‘సముద్రం’; హీబ్రూ భౌగోళిక వాడుకలో మధ్యధరా సముద్ర దిశ కారణంగా ఇది తరచుగా ‘పడమర’ను సూచిస్తుంది. ‘పడమటి వైపున’ దిశార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభగ్రాహ్యమైన శైలి ఉపయోగించబడింది. ఇది ముందటి వచనంలో ప్రారంభమైన వాక్యానికి కొనసాగింపు కావడంతో చివరలో దీర్ఘవిరామం ఉంచబడింది. హీబ్రూలోని వరుస భౌగోళిక పదబంధాలు నిలుపబడగా, తెలుగు స్పష్టత కోసం ‘ఉన్న’ అవసరమైన చోట చేర్చబడింది.
