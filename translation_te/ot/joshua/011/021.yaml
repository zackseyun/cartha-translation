base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
translation:
  language: te
  text: ఆ సమయంలో యెహోషువ వచ్చి, కొండ ప్రాంతం నుండి—హెబ్రోను నుండి, దెబీరు నుండి, అనాబు నుండి, యూదా కొండ ప్రాంతమంతటి నుండి, ఇశ్రాయేలు కొండ ప్రాంతమంతటి నుండి—అనాకీయులను నిర్మూలించాడు. యెహోషువ వారిని వారి పట్టణాలతో సహా నాశనానికి అంకితం చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత పదశః: “వారిని నిషేధానికి అంకితం చేశాడు.” ఇక్కడి హెబ్రీ క్రియ వ్యక్తులను లేదా వస్తువులను నాశనానికి అంకితం చేసే భావాన్ని కలిగి ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא అనే క్రియ కథన సందర్భంలో ‘వచ్చాడు/వెళ్లాడు’ అనే భావాలను ఇవ్వగలదు. ఇక్కడ చర్యకు చేరుకొని దాన్ని చేపట్టిన భావాన్ని సహజమైన తెలుగు కథనశైలిలో ‘వచ్చి’ తెలియజేస్తుంది.
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: ఇది ముందున్న కథనంతో కాలసంబంధాన్ని చూపే సాధారణ పదబంధం; ‘ఆ సమయంలో’ ఆధునిక తెలుగులో సహజంగా, అర్థాన్ని విస్తరించకుండా ఉంటుంది.
- source_word: וַיַּכְרֵת
  choice: నిర్మూలించాడు
  rationale: כרת యొక్క మూలార్థం ‘నరికివేయడం/తొలగించడం’; ఇక్కడ ఒక ప్రజాసమూహాన్ని ఆ ప్రాంతం నుండి పూర్తిగా తొలగించడాన్ని సూచిస్తుంది. ‘నిర్మూలించాడు’ తెలుగు పాఠకునికి సహజంగా ఉండి, తరువాతి חרם క్రియకు వేరైన పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: הָעֲנָקִים
  choice: అనాకీయులను
  rationale: ప్రజాసమూహపు పేరును తెలుగు ధ్వన్యనుకరణతో ఇచ్చి, బహువచన సమూహార్థాన్ని ‘-యులు’ రూపంలో తెలియజేస్తుంది.
- source_word: מִן הָהָר
  choice: కొండ ప్రాంతం నుండి
  rationale: యెహోషువ గ్రంథంలో הָהָר సాధారణంగా ఒకే కొండకన్నా ఎత్తైన భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది; అందువల్ల ‘కొండ ప్రాంతం’ సరైనది.
- source_word: מִן חֶבְרוֹן מִן דְּבִר מִן עֲנָב
  choice: హెబ్రోను నుండి, దెబీరు నుండి, అనాబు నుండి
  rationale: స్థలనామాలను ధ్వన్యనుకరణ చేసి, హెబ్రీ పాఠంలోని מן పునరుక్తిని తెలుగులో ‘నుండి’ పునరుక్తితో నిలిపింది.
- source_word: וּמִכֹּל הַר יְהוּדָה
  choice: యూదా కొండ ప్రాంతమంతటి నుండి
  rationale: మొత్తం యూదా ఎత్తైన ప్రాంతాన్ని సూచించే భౌగోళిక పదబంధంగా అనువదించబడింది.
- source_word: וּמִכֹּל הַר יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కొండ ప్రాంతమంతటి నుండి
  rationale: ‘ఇశ్రాయేలు’ అనే భౌగోళిక-రాజకీయ నామాన్ని వివరణాత్మకంగా మార్చకుండా యథాతథంగా నిలిపింది.
- source_word: עִם עָרֵיהֶם
  choice: వారి పట్టణాలతోపాటు
  rationale: עִם యొక్క సహచర్య భావాన్ని ‘తోపాటు’ తెలియజేస్తుంది; עָרִיםకు ఆధునిక తెలుగులో సహజమైన ‘పట్టణాలు’ ఎంచుకుంది.
- source_word: הֶחֱרִימָם
  choice: వారిని నాశనానికి ప్రతిష్ఠించాడు
  rationale: חרם హిఫీల్ రూపం వ్యక్తులను లేదా వస్తువులను నిషిద్ధమైనవిగా చేసి వినాశానికి అప్పగించే ప్రత్యేక భావాన్ని కలిగి ఉంది. ‘నాశనానికి ప్రతిష్ఠించాడు’ సాధారణ ‘నాశనం చేశాడు’ కంటే ఆ సాంకేతిక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: חרם యుద్ధ పరిభాష అనువాదం
  choice: వారిని నాశనానికి ప్రతిష్ఠించాడు
  alternative: వారిని పూర్తిగా నాశనం చేశాడు; వారిని శాపిత నిషేధం కింద ఉంచాడు
  rationale: ఈ వచనంలో כרת మరియు חרם రెండూ ఉన్నాయి. వాటిని ఒకే తెలుగు క్రియతో సమతలీకరించకుండా, మొదటిదాన్ని ‘నిర్మూలించాడు’గా, రెండవదాన్ని ‘నాశనానికి ప్రతిష్ఠించాడు’గా వేరు చేసింది. దీనివల్ల חרםలోని ఆచార-యుద్ధ సంబంధిత అంకిత భావం నిలుస్తుంది; అయితే దాని అర్థాన్ని ఏ ప్రత్యేక మతసిద్ధాంతం ప్రకారం విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే కథనశైలి వాడబడింది. హెబ్రీ జాబితా నిర్మాణాన్ని డాష్‌లతో, ‘నుండి’ పునరుక్తితో నిలిపింది. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
