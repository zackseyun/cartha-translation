revisions:
- from: ఆ సమయంలో యెహోషువ వచ్చి, కొండ ప్రాంతం నుండి—హెబ్రోను నుండి, దెబీరు నుండి, అనాబు నుండి, యూదా కొండ ప్రాంతమంతటి నుండి, ఇశ్రాయేలు కొండ ప్రాంతమంతటి నుండి—అనాకీయులను నిర్మూలించాడు. వారి పట్టణాలతోపాటు వారిని యెహోషువ నాశనానికి ప్రతిష్ఠించాడు.[a]
  to: ఆ సమయంలో యెహోషువ వచ్చి, కొండ ప్రాంతం నుండి—హెబ్రోను నుండి, దెబీరు నుండి, అనాబు నుండి, యూదా కొండ ప్రాంతమంతటి నుండి, ఇశ్రాయేలు కొండ ప్రాంతమంతటి నుండి—అనాకీయులను నిర్మూలించాడు. యెహోషువ వారిని వారి పట్టణాలతో సహా నాశనానికి అంకితం చేశాడు.[a]
