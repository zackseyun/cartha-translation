source:
  edition: WLC
  text: רַ֣ק כָּל הֶ/עָרִ֗ים הָ/עֹֽמְדוֹת֙ עַל תִּלָּ֔/ם לֹ֥א שְׂרָפָ֖/ם יִשְׂרָאֵ֑ל זוּלָתִ֛י אֶת חָצ֥וֹר לְ/בַדָּ֖/הּ שָׂרַ֥ף יְהוֹשֻֽׁעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/013.yaml
  text: But Israel did not burn any of the cities that stood on their mounds[a], except Hazor alone; Joshua burned it.
translation:
  language: te
  text: అయితే, తమ తమ దిబ్బలపై నిలిచి ఉన్న పట్టణాల్లో దేనినీ ఇశ్రాయేలు తగలబెట్టలేదు; హాసోరును మాత్రమే యెహోషువ తగలబెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ తమ టెల్‌లపై నిలిచి ఉన్న పట్టణాలు.” ‘టెల్’ అంటే వరుసగా ఏర్పడిన నివాసపు పొరల వల్ల రూపొందిన పురాతన పట్టణ దిబ్బ.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ముందటి వృత్తాంతంతో ఉన్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; వాక్యారంభంలోని మినహాయింపు భావాన్ని కూడా సందర్భం ద్వారా నిలుపుతుంది.
- source_word: כָּל הֶעָרִים
  choice: పట్టణాల్లో దేనినీ
  rationale: తరువాతి నిషేధంతో కలిసి ఉన్న పంపిణీ భావాన్ని తెలుగులో సహజంగా ‘దేనినీ ... లేదు’ అని వ్యక్తపరుస్తుంది.
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  choice: తమ తమ దిబ్బలపై నిలిచి ఉన్న
  rationale: עֹמְדוֹת లోని ‘నిలిచి ఉన్న’ చిత్రణను కాపాడుతూ, תֵּל సూచించే నివాసపు పొరలతో ఏర్పడిన ఎత్తైన దిబ్బలను సాధారణ పాఠకునికి అర్థమయ్యే పదంతో అందిస్తుంది.
- source_word: לֹא שְׂרָפָם יִשְׂרָאֵל
  choice: దేనినీ ఇశ్రాయేలు తగలబెట్టలేదు
  rationale: హీబ్రూ నిషేధార్థాన్ని స్పష్టమైన తెలుగు వాక్యక్రమంలో అందిస్తుంది; ‘వాటిని’ అని మళ్లీ చెప్పాల్సిన అవసరం లేదు.
- source_word: זוּלָתִי ... לְבַדָּהּ
  choice: హాసోరును మాత్రమే
  rationale: హాసోరు ఒక్కటే మినహాయింపు అనే ద్విగుణిత ఉద్ఘాటనను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שָׂרַף יְהוֹשֻׁעַ
  choice: యెహోషువ తగలబెట్టాడు
  rationale: మూలంలోని క్రియ పునరుక్తిని నిలుపుతూ, హాసోరును కాల్చిన కర్త యెహోషువ అని స్పష్టపరుస్తుంది.
- source_word: חָצוֹר
  choice: హాసోరు
  rationale: హీబ్రూ స్థలనామానికి తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
