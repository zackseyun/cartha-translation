  text: No Anakim were left in the land of the sons of Israel[a]; only in Gaza, Gath[b], and Ashdod did some remain.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజల దేశంలో అనాకీయులు ఎవరూ మిగిలి ఉండలేదు; గాజాలో, గాతులో, అష్డోదులో మాత్రమే కొందరు మిగిలారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נוֹתַר
  choice: మిగిలి ఉండలేదు
  rationale: నిఫాల్ రూపం యెహోషువ దండయాత్రల తర్వాత ఎవరూ శేషంగా ఉండని ఫలితస్థితిని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ ప్రయోగం సహజంగా ఉంది.
- source_word: עֲנָקִים
  choice: అనాకీయులు
  rationale: ఇది ఒక ప్రజావర్గపు పేరు. హీబ్రూ జాతినామాన్ని తెలుగు రూపంలో నిలుపుతూ, వ్యక్తుల సమూహాన్ని సూచించే ‘-యులు’ రూపం వాడబడింది.
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల దేశంలో
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారుల దేశంలో.’ ఇక్కడ בְּנֵי יִשְׂרָאֵל స్థిరమైన సమూహనామంగా ఇశ్రాయేలు ప్రజలను సూచిస్తుంది; ‘ఇశ్రాయేలు ప్రజలు’ అనేది సహజమైన, అర్థనిష్ఠమైన ఆధునిక తెలుగు.
- source_word: רַק
  choice: మాత్రమే
  rationale: ముందటి సంపూర్ణ నిరాకరణకు మినహాయింపు లేదా పరిమితిని స్పష్టంగా సూచిస్తుంది.
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
  choice: గాజా, గాతు, అష్డోదులలో
  rationale: స్థలపేర్లు తెలుగు బైబిలు వినియోగానికి అనుగుణంగా లిప్యంతరీకరించబడ్డాయి; హీబ్రూలో పునరావృతమైన ఉపసర్గను తెలుగులో సమన్వయ జాబితా చివర ఒక్కసారి చూపడం సహజం.
- source_word: נִשְׁאָרוּ
  choice: కొందరు మిగిలి ఉన్నారు
  rationale: బహువచన క్రియకు ముందే ప్రస్తావించిన అనాకీయులే అంతర్లీన కర్తలు. తెలుగులో ‘కొందరు’ చేర్చడం ఆ శేషసమూహాన్ని సహజంగా వ్యక్తపరుస్తుంది; కొత్త భావాన్ని జోడించదు.
