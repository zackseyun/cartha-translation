source:
  edition: WLC
  text: וְ/אַתֶּ֣ם רְאִיתֶ֗ם אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לְ/כָל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
translation:
  language: te
  text: మీ దేవుడైన యెహోవా మీ ఎదుటనుండి ఈ జనాలన్నిటి విషయంలో చేసినదంతా మీరే చూశారు[a]. ఎందుకంటే మీ కోసం యుద్ధం చేసేవాడు మీ దేవుడైన యెహోవాయే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘మీ ఎదుటనుండి’; ఇక్కడ ఇది ఈ జనాలు ఇశ్రాయేలీయుల సమక్షం నుండి వెళ్లగొట్టబడినట్లు సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם רְאִיתֶם
  choice: మీరే చూశారు
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘మీరే’ సహజంగా వ్యక్తం చేస్తుంది; సంపూర్ణ క్రియ ఇశ్రాయేలీయులు ప్రత్యక్షంగా అనుభవించిన గత కార్యాన్ని సూచిస్తుంది.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: చేసినదంతా
  rationale: ‘చేయు’ అనే విస్తృతార్థక క్రియను అనవసరంగా నిర్దిష్టం చేయకుండా, కార్యాల సంపూర్ణ పరిధిని తెలుగులో సహజంగా తెలుపుతుంది.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా ఉంచి, రెండవ పురుష బహువచన సంబంధాన్ని ‘మీ దేవుడు’గా కాపాడుతుంది.
- source_word: לְכָל הַגּוֹיִם הָאֵלֶּה
  choice: ఈ జనాలన్నిటికి
  rationale: עשהతో వచ్చిన לְ ప్రభావిత వస్తువును సూచిస్తుంది; ‘చేసినది’ అనే క్రియ స్వభావాన్ని సందర్భానికే వదిలి మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: מִפְּנֵיכֶם
  choice: మీ ఎదుటనుండి
  rationale: ‘మీ ముఖసన్నిధి నుండి’ అనే హీబ్రూ రూపానికి దగ్గరగా ఉండి, ఇశ్రాయేలు ఎదుటనుండి జనాలు తొలగించబడిన భావాన్ని కాపాడుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: మీ పక్షంగా యుద్ధం చేసినవాడు ... యెహోవాయే
  rationale: הוּא యొక్క ఉద్ఘాటనను ‘యెహోవాయే’తోనూ, substantival participleను ‘యుద్ధం చేసినవాడు’తోనూ వ్యక్తం చేస్తుంది; לָכֶםలోని ప్రయోజనార్థాన్ని ‘మీ పక్షంగా’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: దేవుడు ఇశ్రాయేలు కొరకు యుద్ధం చేసిన విధానం
  choice: మీ పక్షంగా యుద్ధం చేసినవాడు
  alternative: మీ కొరకు యుద్ధం చేసినవాడు
  rationale: לָכֶם దేవుడు వారి ప్రయోజనం కోసం, వారి తరఫున యుద్ధం చేశాడని సూచిస్తుంది. ‘మీ పక్షంగా’ ఆ ప్రతినిధిత్వ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; దానిని మానవ సహకారాన్ని నిరాకరించే అదనపు సిద్ధాంత ప్రకటనగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘మీరే’ మరియు ‘యెహోవాయే’ మూలంలోని ఉద్ఘాటనలను కాపాడుతాయి. ‘మీ ఎదుటనుండి’ అనే కొంత మూలసన్నిహిత రూపానికి పాదసూచిక వివరణ జోడించబడింది.
