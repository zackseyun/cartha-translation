id: JOS.23.5
reference: Joshua 23:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֗ם ה֚וּא יֶהְדֳּפֵ֣/ם מִ/פְּנֵי/כֶ֔ם וְ/הוֹרִ֥ישׁ אֹתָ֖/ם מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּם֙ אֶת אַרְצָ֔/ם כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
translation:
  language: te
  text: మీ దేవుడైన యాహ్వే ఆయనే వారిని మీ ఎదుటనుండి తరిమివేసి, మీ ఎదుటనుండి వారిని స్వాధీనం కోల్పోయేలా చేస్తాడు. మీ దేవుడైన యాహ్వే మీకు చెప్పినట్లే, మీరు వారి దేశాన్ని స్వాధీనం చేసుకుంటారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్వాధీనం చేసుకుంటారు’ అనే హీబ్రూ క్రియకు ‘వారసత్వంగా పొందుతారు’ అని కూడా అర్థం కావచ్చు. ఇక్కడ భూస్వాధీన సందర్భానికి తగిన ‘స్వాధీనం చేసుకుంటారు’ అనే అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మీ దేవుడైన యాహ్వే మీకు చెప్పినట్లే.’ ఆ మాటలో వాగ్దాన భావం ఉంది; అయినా ప్రధాన పాఠ్యం ‘చెప్పినట్లే’ అనే మూల క్రియార్థాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సాధారణ ఆధునిక లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు / మీ దేవుడైన
  rationale: యెహోవా అనే దైవనామంతో నిర్మాణంలోనూ, బహువచన ద్వితీయ పురుష ప్రత్యయంతోనూ ఇది ఇశ్రాయేలు యొక్క ఏకవచన దేవుణ్ణే సూచిస్తుంది; తెలుగులో సహజంగా ‘మీ దేవుడైన యాహ్వే’ అని ఇచ్చింది.
- source_word: הוּא
  choice: ఆయనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను, కార్యాన్ని యాహ్వే స్వయంగా చేస్తాడనే భావాన్ని కాపాడుతుంది.
- source_word: יֶהְדֳּפֵם
  choice: వారిని … తరిమివేసి
  rationale: הדף బలవంతంగా వెనక్కి నెట్టడం లేదా తరిమివేయడం అనే భావాన్ని ఇస్తుంది; ఈ భూస్వాధీన సందర్భంలో ‘తరిమివేయడం’ సహజంగా సరిపోతుంది.
- source_word: מִפְּנֵיכֶם / מִלִּפְנֵיכֶם
  choice: మీ ఎదుటనుండి
  rationale: రెండుసార్లు వచ్చిన హీబ్రూ స్థలసూచక నుడికారాన్ని స్పష్టమైన, సహజమైన తెలుగులో ఒకే విధంగా నిలిపింది.
- source_word: וְהוֹרִישׁ אֹתָם
  choice: వారిని … తొలగిస్తాడు
  rationale: హిఫీల్ రూపం ప్రస్తుతం భూమిని ఆక్రమించినవారు దాని స్వాధీనాన్ని కోల్పోయేలా చేయడాన్ని సూచిస్తుంది. ముందున్న ‘తరిమివేస్తాడు’తో పూర్తిగా ఒకే పదాన్ని వాడకుండా, తెలుగులో సహజంగా భేదాన్ని ఉంచింది.
- source_word: וִירִשְׁתֶּם
  choice: మీరు … స్వాధీనం చేసుకుంటారు
  rationale: కాల్ రూపం ‘వారసత్వంగా పొందడం’ లేదా ‘స్వాధీనం చేసుకోవడం’ అనే అర్థాలు ఇవ్వగలదు; జయించి భూమిని పొందే ఈ సందర్భంలో రెండవది ప్రధాన పాఠ్యంలో స్పష్టంగా సరిపోతుంది.
- source_word: אֶת אַרְצָם
  choice: వారి దేశాన్ని
  rationale: జనాలు నివసిస్తున్న వారి భూభాగాన్ని సూచించే సహజ తెలుగు రూపం.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: చెప్పినట్లే
  rationale: דבר యొక్క ప్రాథమిక ‘మాట్లాడు/చెప్పు’ భావాన్ని నిలుపుతుంది; ఆ మాట వాగ్దాన స్వభావమైందనే సందర్భార్థాన్ని బలవంతంగా ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: לָכֶם
  choice: మీతో
  rationale: తెలుగులో ‘మీతో చెప్పాడు’ అనేది దైవవాక్య గ్రహీతలను సహజంగా సూచిస్తుంది; భావపరంగా ‘మీకు చెప్పాడు’ కూడా సాధ్యమే.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, దాని నామస్వరూపాన్ని కాపాడింది.
- issue: ירש ధాతువు హిఫీల్, కాల్ రూపాల మధ్య భావభేదం
  choice: ‘వారిని తొలగిస్తాడు’ / ‘వారి దేశాన్ని స్వాధీనం చేసుకుంటారు’
  alternative: రెండింటికీ ‘తరిమివేయడం’; లేదా ఇశ్రాయేలు చర్యకు ‘వారసత్వంగా పొందడం’
  rationale: మొదటి రూపం పూర్వ నివాసులు స్వాధీనాన్ని కోల్పోవడాన్ని, రెండవది ఇశ్రాయేలు భూమిని పొందడాన్ని సూచిస్తుంది. వేర్వేరు తెలుగు పదబంధాలు ఈ న్యాయపరమైన భూస్వామ్య వ్యత్యాసాన్ని అతిశయింపకుండా నిలుపుతాయి.
- issue: దేవుని కార్యసాధకత్వంపై הוּא ఇచ్చే ఉద్ఘాటన
  choice: ‘ఆయనే’
  alternative: సర్వనామాన్ని ఉద్ఘాటన లేకుండా ‘ఆయన’గా ఇవ్వడం
  rationale: జనాలను తొలగించేది ఇశ్రాయేలు శక్తి మాత్రమే కాదని, యాహ్వే స్వయంగా కార్యం చేస్తాడని హీబ్రూ వాక్యం ఉద్ఘాటిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ పునరుక్తి (‘మీ ఎదుటనుండి’) మరియు הוּא ఉద్ఘాటన (‘ఆయనే’) ఉద్దేశపూర్వకంగా నిలిపాయి. [a], [b] గుర్తులను సంబంధిత చివరి వాక్యభాగం వద్ద ఉంచాం.
