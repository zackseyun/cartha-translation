source:
  edition: WLC
  text: וַ/יִּקְרָ֤א יְהוֹשֻׁ֨עַ֙ לְ/כָל יִשְׂרָאֵ֔ל לִ/זְקֵנָי/ו֙ וּ/לְ/רָאשָׁ֔י/ו וּ/לְ/שֹׁפְטָ֖י/ו וּ/לְ/שֹֽׁטְרָ֑י/ו וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אֲנִ֣י זָקַ֔נְתִּי בָּ֖אתִי בַּ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
translation:
  language: te
  text: 'అప్పుడు యెహోషువ ఇశ్రాయేలీయులందరినీ—వారి పెద్దలను, ప్రధానులను, న్యాయాధిపతులను, అధికారులను—పిలిపించి, వారితో ఇలా అన్నాడు: “నేను ముసలివాడినయ్యాను; వయసు పైబడింది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ నుడికారం అక్షరార్థంగా ‘నేను దినాల్లోకి వచ్చాను’; భావం: ‘నా వయసు బాగా పైబడింది.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְ
  choice: పిలిపించి
  rationale: קרא తో לְ ఇక్కడ వ్యక్తులను తన సమక్షానికి రప్పించేలా పిలవడం లేదా సమావేశపరచడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘పిలిపించి’ ఈ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరినీ
  rationale: హీబ్రూ పాఠంలోని ‘ఇశ్రాయేలంతా’ అనే సమష్టి సూచనను నిలుపుతుంది; తరువాతి పరిపాలనా వర్గాల జాబితా ఆ ప్రజలకు ప్రాతినిధ్యం వహించినవారిని పేర్కొంటుంది.
- source_word: לִזְקֵנָיו
  choice: వారి పెద్దలను
  rationale: זְקֵנִים ఇక్కడ వయోవృద్ధులను మాత్రమే కాక సమాజపు గుర్తింపు పొందిన పెద్దలను సూచిస్తుంది. సమష్టిగా ఉన్న ఇశ్రాయేలీయులను సూచించే ఏకవచన ప్రత్యయాన్ని తెలుగులో సహజమైన బహువచనంతో అందించింది.
- source_word: וּלְרָאשָׁיו
  choice: ప్రధానులను
  rationale: רָאשִׁים అక్షరార్థంగా ‘తలలు’ అయినా, ఈ పరిపాలనా జాబితాలో ముఖ్య నాయకులు లేదా ప్రధానులను సూచిస్తుంది. ‘ప్రధానులు’ మూల రూపకాన్ని కృత్రిమంగా అనిపించకుండా పదవివర్గ భేదాన్ని నిలుపుతుంది.
- source_word: וּלְשֹׁפְטָיו
  choice: న్యాయాధిపతులను
  rationale: שֹׁפְטִים ఈ పౌర పరిపాలనా సందర్భంలో తీర్పు చెప్పే అధికారులను సూచిస్తుంది; ‘న్యాయాధిపతులు’ స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: וּלְשֹׁטְרָיו
  choice: అధికారులను
  rationale: שֹׁטְרִים అనేది పరిపాలనా లేదా అమలు బాధ్యతలు నిర్వహించే అధికారులను సూచిస్తుంది. ‘లేఖకులు’ అనడం ఇక్కడ అతిగా సంకుచితమవుతుంది.
- source_word: אֲנִי זָקַנְתִּי
  choice: నేను ముసలివాడినయ్యాను
  rationale: హీబ్రూ సంపూర్ణ క్రియ వృద్ధాప్య స్థితికి చేరిన ప్రక్రియను సూచిస్తుంది. ‘ముసలివాడినయ్యాను’ ఆ మార్పును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָּאתִי בַּיָּמִים
  choice: వయసు పైబడింది
  rationale: ‘దినాల్లోకి వచ్చాను’ అనే హీబ్రూ నుడికారానికి అర్థం వయసులో బాగా ముందుకు వెళ్లడం. తెలుగు నుడికారమైన ‘వయసు పైబడింది’ అదే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: తరువాత నాయకత్వ వర్గాల జాబితా ఉన్నప్పుడు ‘ఇశ్రాయేలీయులందరూ’ అనే మాటకు ఉన్న పరిధి
  choice: ‘ఇశ్రాయేలీయులందరినీ’ అనే సమష్టి వాక్యాన్ని నిలిపి, తరువాత పెద్దలు, ప్రధానులు, న్యాయాధిపతులు, అధికారులు అనే ప్రాతినిధ్య వర్గాలను యథాతథంగా పేర్కొనడం
  alternative: ‘ఇశ్రాయేలు నాయకులందరినీ’ అని మాత్రమే అనువదించి సమష్టి సూచనను నాయకులకు పరిమితం చేయడం
  rationale: మూల హీబ్రూ ముందుగా ‘ఇశ్రాయేలంతా’ అని స్పష్టంగా చెప్పి, తరువాత సంబంధిత నాయకత్వ వర్గాలను వరుసగా పేర్కొంటుంది. అందువల్ల ఏ అంశాన్నీ కలిపివేయకుండా రెండింటినీ అనువాదంలో ఉంచడం మూలంలోని నిర్మాణాన్నీ, దాని స్వల్ప ఉద్రిక్తతనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే కథన శైలి వాడబడింది. ‘ముసలివాడినయ్యాను’ సాధారణ పాఠకునికి స్పష్టంగా ఉండగా, ‘వయసు పైబడింది’ మూలంలోని సమాంతర వృద్ధాప్య ప్రకటనను నిలుపుతుంది. డాష్‌ల మధ్యనున్న జాబితా ‘ఇశ్రాయేలీయులందరూ’ మరియు వారి ప్రాతినిధ్య నాయకత్వ వర్గాల మధ్య సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
