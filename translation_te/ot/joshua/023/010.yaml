source:
  edition: WLC
  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
translation:
  language: te
  text: మీలోని ఒక్క మనిషి వెయ్యిమందిని వెంటాడతాడు[a], ఎందుకంటే మీ దేవుడైన యాహ్వే[b] మీ కొరకు యుద్ధం చేసేవాడు ఆయనే, ఆయన మీతో చెప్పినట్టే[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెయ్యిమందిని తరుముతాడు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ దైవనామం YHWH; దీనిని “యాహ్వే”గా లిప్యంతరీకరించారు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆయన మీకు వాగ్దానం చేసినట్టే”; హీబ్రూలో అక్షరార్థంగా, “ఆయన మీతో చెప్పినట్టే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד מִכֶּם
  choice: మీలో ఒక్క పురుషుడు
  rationale: హీబ్రూ పదబంధంలోని ఏకవచన పుంలింగ రూపాన్ని ప్రతినిధి భావంతో నిలుపుతూ, తెలుగులో సహజమైన విభక్తి నిర్మాణాన్ని వాడింది.
- source_word: יִרְדָּף אָלֶף
  choice: వెయ్యిమందిని తరిమివేస్తాడు
  rationale: רדף అనే క్రియకు యుద్ధ సందర్భంలో ‘వెంటాడటం/తరిమివేయటం’ అనే భావం ఉంది; אָלֶף ఇక్కడ ప్రత్యర్థుల సంఖ్యను సూచిస్తున్నందున తెలుగులో ‘వెయ్యిమందిని’ అని స్పష్టం చేసింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేసే కారణార్థక ప్రయోగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించి, సంబంధ సూచక నిర్మాణాన్ని సహజ తెలుగులో ఇచ్చింది.
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: మీ పక్షంగా యుద్ధం చేసేవాడు
  rationale: ఎంఫాటిక్ సర్వనామం మరియు ఆర్టికల్‌తో కూడిన పార్టిసిపిల్ దేవుడు తన ప్రజల పక్షంగా యుద్ధం చేసే వాడనే లక్షణాత్మక భావాన్ని వ్యక్తం చేస్తాయి.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: తాను మీతో చెప్పినట్టే
  rationale: דבר యొక్క మూలార్థమైన ‘మాట్లాడు/చెప్పు’ను నిలుపుతూ, promissory forceను పాఠకుడు సందర్భం నుంచి గ్రహించేలా చేసింది; ‘తాను’ ముందున్న ఎంఫాటిక్ దైవకర్తను సహజంగా కొనసాగిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపం దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; ఇతర లిప్యంతరీకరణను పాదటిప్పణిలో సూచించింది.
- issue: אִישׁ אֶחָד లోని లింగ సూచన
  choice: ఒక్క పురుషుడు
  alternative: ఒక్క వ్యక్తి; ఒక్క మనిషి
  rationale: హీబ్రూ రూపం పుంలింగ ఏకవచనంలో ఉండి ప్రతినిధిగా పనిచేస్తుంది. దాని లింగరూపాన్ని తటస్థీకరించకుండా నిలిపింది.
- issue: דִּבֶּר యొక్క వాగ్దానార్థక సందర్భం
  choice: చెప్పినట్టే
  alternative: వాగ్దానం చేసినట్టే
  rationale: సందర్భం వాగ్దానాన్ని సూచించినప్పటికీ క్రియ అక్షరార్థంగా ‘చెప్పాడు/మాట్లాడాడు’; అంతర్లీన వాగ్దాన భావాన్ని వ్యాఖ్యానంగా ప్రధాన పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. బహువచన ‘మీ’ను నిలిపింది; యుద్ధసందర్భాన్ని సహజంగా వ్యక్తం చేసింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
