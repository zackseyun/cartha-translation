- from: మీ దేవుడైన యెహోవా మీకు ఆజ్ఞాపించిన ఆయన నిబంధనను మీరు ఉల్లంఘించి[a], వెళ్లి ఇతర దేవుళ్లను సేవించి, వాటికి సాష్టాంగపడితే, యెహోవా కోపం మీ మీద రగులుతుంది; ఆయన మీకు ఇచ్చిన ఈ మంచి దేశం నుండి మీరు త్వరగా నశించిపోతారు.[b]
