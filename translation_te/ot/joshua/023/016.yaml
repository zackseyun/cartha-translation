source:
  edition: WLC
  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
translation:
  language: te
  text: మీ దేవుడైన యాహ్వే మీకు ఆజ్ఞాపించిన నిబంధనను మీరు ఉల్లంఘించి[a], వెళ్లి ఇతర దేవుళ్లను సేవించి, వాటికి వంగి నమస్కరిస్తే, యాహ్వే కోపం మీ మీద రగులుతుంది; ఆయన మీకు ఇచ్చిన మంచి దేశం నుండి మీరు త్వరగా నశించిపోతారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు ... నిబంధనను ఉల్లంఘించినప్పుడు.’ హీబ్రూ ప్రారంభ నిర్మాణాన్ని షరతార్థకంగా (‘ఉల్లంఘిస్తే’) లేదా కాలార్థకంగా (‘ఉల్లంఘించినప్పుడు’) అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ వాక్యప్రయోగం అక్షరార్థంగా ‘మంచి దేశం మీద నుండి’; యాహ్వే ఇచ్చిన దేశం నుంచి వారు తొలగించబడతారని ఇది నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָבְרְכֶם
  choice: మీరు ఉల్లంఘించి ... పడితే
  rationale: ב + క్రియార్థక నామరూపం ఇక్కడ షరతుతో కూడిన పరిస్థితిని సూచిస్తుంది. עבר ברית అనే నిబంధనా వాడుకకు ‘నిబంధనను ఉల్లంఘించడం’ సహజమైన తెలుగు సమానం.
- source_word: בְּרִית
  choice: నిబంధన
  rationale: దేవునికీ ఇశ్రాయేలుకూ మధ్య ఉన్న బంధంలోని ధార్మిక, న్యాయపరమైన గంభీరతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: యెహోవాతో అన్వయించి ఏకవచన దైవబిరుదుగా ఉంది.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: మీకు ఆజ్ఞాపించిన
  rationale: ‘పాటించమని’ వంటి మూలంలో లేని భావాన్ని చేర్చకుండా సంబంధ వాక్యాన్ని సహజంగా తెలుపుతుంది.
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: వెళ్లి ... సేవించి
  rationale: ఇతర దేవుళ్లవైపు మళ్లి వాటికి మతపరమైన సేవ చేయడాన్ని తెలుపుతూ, తరువాతి సాష్టాంగపడే క్రియతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లు
  rationale: ప్రత్యర్థి దేవతలను సూచించే సాధారణ హీబ్రూ పదబంధానికి సూటి, సహజమైన అనువాదం.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: వాటికి సాష్టాంగపడితే
  rationale: క్రియలోని శరీరాన్ని వంచి నమస్కరించే భావాన్ని నిలుపుతూ, ముందున్న ‘సేవించడం’తో కలిపివేయదు.
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  choice: యెహోవా కోపం మీ మీద రగులుతుంది
  rationale: חרה אף లోని మండే కోపం అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַאֲבַדְתֶּם מְהֵרָה מֵעַל הָאָרֶץ
  choice: దేశం నుండి మీరు త్వరగా నశించిపోతారు
  rationale: אבד యొక్క నశించే భావాన్నీ, מעל ద్వారా దేశం నుంచి తొలగించబడే ఫలితాన్నీ కలిపి వ్యక్తం చేస్తుంది.
- source_word: הָאָרֶץ הַטּוֹבָה אֲשֶׁר נָתַן לָכֶם
  choice: ఆయన మీకు ఇచ్చిన ఈ మంచి దేశం
  rationale: వాగ్దాన దేశాన్ని సందర్భానుసారంగా సూచిస్తూ, దాని మంచితనాన్నీ దేవుని దానాన్నీ కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సంప్రదాయంగా గుర్తించదగిన ‘యెహోవా’ రూపాన్ని వాడాం.
- issue: నిబంధన హెచ్చరిక వాక్యనిర్మాణం
  choice: షరతును సూచించే ‘పడితే’
  alternative: కాలార్థకంగా ‘ఉల్లంఘించినప్పుడు’
  rationale: హీబ్రూ ప్రారంభ నిర్మాణం కాలార్థకంగానూ షరతార్థకంగానూ అర్థమవుతుంది. ఈ ఉపదేశ సందర్భంలో హెచ్చరిక యొక్క షరతు భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: అన్యదేవతల ముందు నమస్కారం
  choice: సేవించి, వాటికి సాష్టాంగపడితే
  alternative: వాటిని ఆరాధిస్తే
  rationale: రెండు వేర్వేరు హీబ్రూ క్రియలను ఒకే ‘ఆరాధన’ పదంలో కలపకుండా, మతసేవ మరియు శరీరంతో వంగి నమస్కరించడం అనే రెండు చర్యలను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘నిబంధన,’ ‘సేవించడం,’ ‘సాష్టాంగపడడం,’ ‘కోపం రగులడం’ వంటి పదాలు మూలంలోని న్యాయపరమైన, ఆరాధనాపరమైన, రూపకాల భేదాలను నిలుపుతాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
