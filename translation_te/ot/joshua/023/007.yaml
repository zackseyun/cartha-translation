source:
  edition: WLC
  text: לְ/בִלְתִּי בוֹא֙ בַּ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וּ/בְ/שֵׁ֨ם אֱלֹהֵי/הֶ֤ם לֹא תַזְכִּ֨ירוּ֙ וְ/לֹ֣א תַשְׁבִּ֔יעוּ וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִֽשְׁתַּחֲו֖וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
translation:
  language: te
  text: మీతోపాటు ఇంకా మిగిలి ఉన్న ఈ జనాంగాల మధ్యకు మీరు వెళ్లకూడదు; వారి దేవుళ్ల పేరును ప్రస్తావించకూడదు[a], ఆ దేవుళ్ల పేర్లతో ఎవరినీ ప్రమాణం చేయించకూడదు[b], వారిని సేవించకూడదు, వారికి సాగిలపడకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి దేవుళ్ల పేరును పిలవకూడదు.” హీబ్రూ క్రియకు ‘ప్రస్తావించు’ అనే అర్థంతోపాటు, ఈ సందర్భంలో దేవత పేరును పిలిచి ఆశ్రయించే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆ దేవుళ్ల పేర్లతో ప్రమాణం చేయకూడదు.” హీబ్రూ క్రియ కారణార్థకంగా, అక్షరార్థంలో ‘ప్రమాణం చేయించు’ అని ఉంది; అది ఇతరులతో ఆ దేవుళ్ల పేర్ల మీద ప్రమాణం చేయించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא בַּגּוֹיִם הָאֵלֶּה
  choice: ఈ జనాల మధ్యకు మీరు వెళ్లకూడదు
  rationale: לְבִלְתִּי + infinitive నిషేధాత్మక ఉద్దేశాన్ని సూచిస్తుంది. בוא + ב ఇక్కడ కేవలం భౌగోళిక ప్రవేశం కంటే ఆ జనాలతో కలిసిమెలిసి ఉండడాన్ని సూచిస్తుంది; అందుకే సహజమైన తెలుగులో ‘మధ్యకు వెళ్లకూడదు’ అని ఇచ్చాం.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: మీతోపాటు ఇంకా మిగిలి ఉన్న
  rationale: שׁאר ధాతువు మిగిలి ఉండడాన్ని, אִתְּכֶם ఇశ్రాయేలీయులతోపాటు వారి ఉనికిని సూచిస్తాయి. ‘ఇంకా’ ఆ కొనసాగుతున్న పరిస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  choice: వారి దేవుళ్ల పేర్లను ప్రస్తావించకూడదు
  rationale: Hiphil הזכיר కు ‘ప్రస్తావించు’ లేదా సందర్భానుసారంగా ‘ఆహ్వానించు/పేరుపెట్టి మొరపెట్టు’ అనే భావాలు ఉండవచ్చు. ప్రధాన పాఠంలో ప్రత్యక్షమైన ‘ప్రస్తావించు’ను ఉంచి, ఆచారసంబంధ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం. హీబ్రూలో ‘పేరు’ ఏకవచనంలో ఉన్నా, తెలుగులో బహువచన దేవుళ్లతో ‘పేర్లను’ సహజం.
- source_word: וְלֹא תַשְׁבִּיעוּ
  choice: వాటి పేర్లతో ఎవరినీ ప్రమాణం చేయించకూడదు
  rationale: שׁבע యొక్క Hiphil రూపం కారణార్థకం—‘ప్రమాణం చేయించు’. హీబ్రూలో కర్మ వ్యక్తం కాలేదు; తెలుగులో అర్థస్పష్టత కోసం ‘ఎవరినీ’ చేర్చాం. ప్రమాణం ఆ దేవుళ్ల పేర్లతో చేయబడుతుందని సందర్భం స్పష్టం చేస్తుంది.
- source_word: וְלֹא תַעַבְדוּם
  choice: వాటిని సేవించకూడదు
  rationale: עבד మతపరమైన సేవను కూడా సూచించే ‘సేవించు’. తరువాతి సాగిలపడే క్రియతో ఉన్న భేదాన్ని కాపాడేందుకు సాధారణ ‘ఆరాధించు’గా కలిపివేయలేదు.
- source_word: וְלֹא תִשְׁתַּחֲווּ לָהֶם
  choice: వాటికి సాగిలపడకూడదు
  rationale: ఈ రూపంలోని שׁחה శరీరంతో వంగి నమస్కరించడం లేదా సాష్టాంగపడడం సూచిస్తుంది. ‘సాగిలపడు’ ఆధునిక గౌరవప్రదమైన తెలుగులో ఆ నిర్దిష్ట చర్యను తెలియజేస్తుంది.
theological_decisions:
- issue: విగ్రహారాధనకు సంబంధించిన చర్యల వరుస
  choice: ‘ప్రస్తావించు—ప్రమాణం చేయించు—సేవించు—సాగిలపడు’ అనే వేర్వేరు నిషేధాలను నిలిపాం.
  alternative: అన్నిటినీ సాధారణంగా ‘ఆరాధించకూడదు’ అని సంక్షిప్తం చేయడం.
  rationale: మూల హీబ్రూ విదేశీ దేవుళ్ల పట్ల విధేయతను తెలిపే అనుబంధమైనా భిన్నమైన చర్యలను వరుసగా పేర్కొంటుంది. వాటిని విడిగా ఉంచడం పాఠంలోని స్పష్టతను, ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను వాడాం. ‘సేవించు’ మరియు ‘సాగిలపడు’ అనే వేర్వేరు క్రియలను ఉంచి మూలంలోని కార్యభేదాన్ని కాపాడాం; అనవసరమైన సంప్రదాయపరమైన పదజాలాన్ని నివారించాం.
