id: JOS.23.8
reference: Joshua 23:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֛י אִם בַּ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּדְבָּ֑קוּ כַּ/אֲשֶׁ֣ר עֲשִׂיתֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/008.yaml
  text: But you shall cling to Yahweh your God[a], just as you have done to this day.
translation:
  language: te
  text: అయితే, ఇప్పటివరకు మీరు చేసినట్లే మీ దేవుడైన యాహ్వేను అంటిపెట్టుకొని ఉండండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గట్టిగా పట్టుకొని ఉండండి”; హీబ్రూ క్రియ సన్నిహితమైన, నిష్ఠగల అనుబంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: అయితే
  rationale: ముందటి హెచ్చరికకు బలమైన వ్యతిరేక భావాన్ని కలిగిస్తుంది; షరతుగా కాకుండా విరుద్ధ ప్రోత్సాహంగా సహజంగా వ్యక్తమవుతుంది.
- source_word: בַּיהוָה
  choice: యెహోవాను
  rationale: דבק అనే క్రియతో ב ఉపసర్గ హత్తుకొని ఉండవలసిన వ్యక్తిని సూచిస్తుంది; తెలుగులో కర్మవిభక్తితో చెప్పడం సహజం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా తెలిసిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: ఇక్కడ אֱלֹהִים ఏకవచనార్థంలో యెహోవాను సూచిస్తుంది; రెండవ పురుష బహువచన ప్రత్యయం 'మీ' ద్వారా నిబంధన సంబంధం స్పష్టమవుతుంది.
- source_word: תִּדְבָּקוּ
  choice: హత్తుకొని ఉండండి
  rationale: דבק లోని సన్నిహితంగా అంటిపెట్టుకొని, నిష్ఠతో అనుబంధమై ఉండే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כַּאֲשֶׁר עֲשִׂיתֶם
  choice: చేసినట్లే
  rationale: ఆజ్ఞాపించబడిన నిష్ఠను వారి ఇంతవరకు ఉన్న ప్రవర్తనతో పోల్చే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఇప్పటివరకు
  rationale: మాట్లాడుతున్న ప్రస్తుత దినం వరకు కొనసాగిన ప్రవర్తనను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే నిబంధన నామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని 'ప్రభువు' అనే బిరుదుతో భర్తీ చేయకుండా నిలుపుతూ, సాధారణ తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఉపయోగించింది.
- issue: דבק క్రియలోని నిబంధన సంబంధ భావం
  choice: హత్తుకొని ఉండండి
  alternative: గట్టిగా పట్టుకొని ఉండండి
  rationale: ఇది కేవలం పట్టుకోవడాన్ని కాకుండా యెహోవాతో సన్నిహితమైన, స్థిరమైన విధేయ అనుబంధాన్ని సూచిస్తుంది; అయితే ఆ భావాన్ని పాఠ్యంలో సిద్ధాంతపరంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. మూలంలోని వ్యతిరేకత, కొనసాగుతున్న నిష్ఠ, నిబంధనాత్మక అనుబంధం సహజంగా నిలుపబడ్డాయి.
