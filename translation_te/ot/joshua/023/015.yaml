source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּ/אֲשֶׁר בָּ֤א עֲלֵי/כֶם֙ כָּל הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֲלֵי/כֶ֑ם כֵּן֩ יָבִ֨יא יְהוָ֜ה עֲלֵי/כֶ֗ם אֵ֚ת כָּל הַ/דָּבָ֣ר הָ/רָ֔ע עַד הַשְׁמִיד֣/וֹ אוֹתְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
translation:
  language: te
  text: 'ఇలా జరుగుతుంది: మీ దేవుడైన యాహ్వే మీతో చెప్పిన ప్రతి మంచి మాట మీ మీదికి వచ్చినట్లే, ఆలాగే యాహ్వే ప్రతి చెడు మాటను[a] మీ మీదికి తెస్తాడు; ఆయన మీకు ఇచ్చిన ఈ మంచి భూమి మీదనుండి మిమ్మల్ని నాశనం చేసే వరకు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రతి చెడు విషయం,” లేదా “విపత్తంతటినీ.” హీబ్రూలో అక్షరార్థంగా “ప్రతి చెడు మాట/విషయం”; ఇది ముందున్న “ప్రతి మంచి మాట” అనే పదబంధానికి సమాంతరంగా ఉంది.
    reason: דָּבָר మరియు רָע పదాల విస్తృత అర్థపరిధిని, అలాగే వాక్యంలోని ఉద్దేశపూర్వక పదసమాంతరతను తెలియజేయడానికి.
lexical_decisions:
- source_word: וְהָיָה
  choice: అలా జరుగుతుంది
  rationale: భవిష్యత్తులో నిశ్చయంగా సంభవించే పరిస్థితిని సూచించే గంభీరమైన వాక్య సూచిక. తెలుగులో సహజత కోసం పోలిక వాక్యం తరువాత ఉంచబడింది.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: వచ్చినట్లే ... రప్పిస్తాడు
  rationale: మంచి మాటల నెరవేర్పుకు, రాబోయే తీర్పుకు మధ్యనున్న ‘ఎలాగో—అలాగే’ పోలికను సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: בָּא עֲלֵיכֶם
  choice: మీ మీదికి వచ్చిన
  rationale: ఇప్పటికే నెరవేరిన దైవ వాక్యాన్ని సూచించే సంపూర్ణ క్రియను, עַל యొక్క దిశాత్మక భావంతో సహా ప్రతిబింబిస్తుంది.
- source_word: כָּל הַדָּבָר הַטּוֹב
  choice: ప్రతి మంచి మాట
  rationale: דָּבָר యొక్క ‘మాట/విషయం’ పరిధిలో ‘మాట’ను ఎంచుకుని, తరువాతి ‘ప్రతి చెడు మాట’తో ఉద్దేశపూర్వక సమాంతరతను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: יָבִיא ... עֲלֵיכֶם
  choice: మీ మీదికి రప్పిస్తాడు
  rationale: హిఫీల్ రూపంలోని కారణార్థక బలాన్ని, పునరావృతమైన עַל భావాన్ని నిలుపుతుంది.
- source_word: כָּל הַדָּבָר הָרָע
  choice: ప్రతి చెడు మాట
  rationale: ముందున్న ‘ప్రతి మంచి మాట’తో పదసంబంధ సమాంతరతను నిలుపుతుంది; ‘చెడు’ ఇక్కడ నైతిక దుష్టత్వాన్ని తప్పనిసరిగా సూచించకుండా ప్రతికూల తీర్పును కూడా సూచించగలదు.
- source_word: עַד הַשְׁמִידוֹ אֹתְכֶם
  choice: మిమ్మల్ని నాశనం చేసేవరకు
  rationale: తీర్పు చేరే అంతిమ ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: ఈ మంచి దేశం మీద నుండి
  rationale: מֵעַל యొక్క ‘మీద నుండి’ అనే స్థలార్థాన్ని కాపాడుతూ, אֲדָמָהను సందర్భానుసారంగా ‘దేశం’గా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా ప్రత్యక్షంగా సూచిస్తుంది.
- issue: దేవుడు రప్పించే הָרָע యొక్క అర్థం
  choice: చెడు మాట
  alternative: చెడు విషయం; విపత్తు
  rationale: దేవునికి నైతిక చెడును ఆపాదించకుండా ఉండేందుకని భావాన్ని పూర్తిగా వివరణాత్మకంగా మార్చకుండా, హీబ్రూ పదంలోని ప్రతికూల/విపత్తు భావాన్నీ ‘మంచి మాట—చెడు మాట’ అనే ఉద్రిక్త సమాంతరతనూ కాపాడుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ పోలిక నిర్మాణం తెలుగులో సహజంగా వినిపించేందుకు ప్రధాన ప్రకటనను చివర ఉంచింది. ‘మంచి మాట/చెడు మాట’ సమాంతరతను ఉద్దేశపూర్వకంగా నిలిపింది.
