- from: 'మీ దేవుడైన యాహ్వే మీతో చెప్పిన ప్రతి మంచి మాట మీ మీదికి వచ్చినట్లే, మీ దేవుడైన యాహ్వే మీకు ఇచ్చిన ఈ మంచి దేశం మీద నుండి మిమ్మల్ని నాశనం చేసేవరకు, యాహ్వే ప్రతి చెడు మాటను[a] మీ మీదికి రప్పిస్తాడు. అలా జరుగుతుంది.


    [a] లేదా “ప్రతి చెడు విషయం,” లేదా “విపత్తంతటినీ.” హీబ్రూలో అక్షరార్థంగా “ప్రతి చెడు మాట/విషయం”; ఇది ముందున్న “ప్రతి మంచి మాట” అనే పదబంధానికి సమాంతరంగా ఉంది.'
  to: 'ఇలా జరుగుతుంది: మీ దేవుడైన యాహ్వే మీతో చెప్పిన ప్రతి మంచి మాట మీ మీదికి వచ్చినట్లే, ఆలాగే యాహ్వే ప్రతి చెడు మాటను[a] మీ మీదికి తెస్తాడు; ఆయన మీకు ఇచ్చిన ఈ మంచి భూమి మీదనుండి మిమ్మల్ని నాశనం చేసే వరకు.'
  rationale: The revision joins the opening future formula to the whole statement, explicitly renders the Hebrew correlative comparison as ‘ఎలాగైతే ... ఆలాగే,’ and places the destruction-from-the-land clause after the main future judgment clause. It retains ‘ప్రతి మంచి మాట/ప్రతి చెడు మాట,’ ‘యాహ్వే,’ the causative judgment action, and the footnote’s lexical alternatives without resolving the adverse sense of רָע into a doctrinal interpretation.
