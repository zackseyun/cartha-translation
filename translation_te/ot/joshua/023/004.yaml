  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘జనాలు’ అనే పదం మూలంలోని ప్రజాసమూహాలను సూచిస్తుంది; దానిని ‘దేశాలు’గా మార్చి భూభాగ భావాన్ని మూలంలో లేనంతగా చేర్చలేదు.
