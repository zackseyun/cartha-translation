source:
  edition: WLC
  text: רְאוּ֩ הִפַּ֨לְתִּי לָ/כֶ֜ם אֶֽת הַ֠/גּוֹיִם הַ/נִּשְׁאָרִ֥ים הָ/אֵ֛לֶּה בְּ/נַחֲלָ֖ה לְ/שִׁבְטֵי/כֶ֑ם מִן הַ/יַּרְדֵּ֗ן וְ/כָל הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִכְרַ֔תִּי וְ/הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֥וֹא הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
translation:
  language: te
  text: చూడండి, యొర్దాను నుండి సూర్యుడు అస్తమించే దిక్కున ఉన్న మహాసముద్రం వరకు, నేను నిర్మూలించిన జనాలన్నిటితో పాటు మిగిలి ఉన్న ఈ జనాలను మీ గోత్రాలకు స్వాస్థ్యంగా కేటాయించాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో, ‘సూర్యుడు అస్తమించే దిక్కు’; అంటే పడమటి దిక్కు.
    reason: పడమటను సూచించే మూలభాషా నుడికారంలోని చిత్రాత్మక భావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: רְאוּ
  choice: చూడండి
  rationale: బహువచన ఆజ్ఞారూపంలోని అవధాన పిలుపును ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִפַּלְתִּי
  choice: పంచిపెట్టాను
  rationale: ఇక్కడ నేరుగా ‘పడేలా చేశాను’ అని కాక, చీట్ల ద్వారా భాగాలను కేటాయించే భూవిభజన భావం ఉంది. ‘పంచిపెట్టాను’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది; చీట్ల విధానాన్ని పాఠ్యంలో అనవసరంగా విస్తరించదు.
- source_word: בְּנַחֲלָה
  choice: స్వాస్థ్యంగా
  rationale: వంశపారంపర్యంగా పొందే భూస్వాధీన భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: לְשִׁבְטֵיכֶם
  choice: మీ గోత్రాలకు
  rationale: కేటాయింపును పొందే ఇశ్రాయేలు గోత్రాలను స్పష్టంగా సూచిస్తుంది.
- source_word: הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה
  choice: మిగిలి ఉన్న ఈ జనాలను
  rationale: నִשְׁאָרִים అనే కొనసాగుతున్న స్థితిని క్రియాత్మక పదబంధంగా నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: מִן הַיַּרְדֵּן ... וְהַיָּם הַגָּדוֹל
  choice: యొర్దాను మొదలుకొని ... మహాసముద్రం వరకు
  rationale: హెబ్రీలోని ‘మరియు’తో అనుసంధానమైన సరిహద్దు పదబంధాన్ని సందర్భానుసారంగా ‘మొదలుకొని ... వరకు’ అని అందించి భౌగోళిక విస్తృతిని స్పష్టం చేస్తుంది.
- source_word: וְכָל הַגּוֹיִם אֲשֶׁר הִכְרַתִּי
  choice: నేను నిర్మూలించిన జనాలందరితోపాటు
  rationale: כרת యొక్క ఈ సందర్భంలోని నాశనం/తొలగింపు భావాన్ని ‘నిర్మూలించిన’ నిలుపుతుంది; ‘తోపాటు’ ఈ వాక్యభాగాన్ని కేటాయింపులో చేర్చబడిన సమూహంగా సహజంగా కలుపుతుంది.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: సూర్యుడు అస్తమించే దిక్కున
  rationale: పడమటను సూచించే హెబ్రీ చిత్రాత్మక నుడికారాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
