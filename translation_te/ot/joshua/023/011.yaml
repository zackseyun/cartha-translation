id: JOS.23.11
reference: Joshua 23:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹֽׁתֵי/כֶ֑ם לְ/אַהֲבָ֖ה אֶת יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/011.yaml
  text: Therefore, take great care to love Yahweh your God.
translation:
  language: te
  text: కాబట్టి మీ దేవుడైన యాహ్వేను ప్రేమించడానికి ఎంతో జాగ్రత్తగా ఉండండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  choice: కాబట్టి ... మిమ్మల్ని మీరు ... కాపాడుకోండి
  rationale: ఈ క్రియ అప్రమత్తంగా స్వీయ సంరక్షణ చేసుకోవాలనే ఆజ్ఞను తెలియజేస్తుంది. సందర్భంలోని అనుసంధానాన్ని ‘కాబట్టి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מְאֹד
  choice: ఎంతో జాగ్రత్తగా
  rationale: తీవ్రతను సూచించే ఈ అవ్యయం, కాపాడుకోవాలనే ఆజ్ఞతో కలిపి తెలుగులో సహజంగా బలమైన అప్రమత్తతను వ్యక్తం చేస్తుంది.
- source_word: לְנַפְשֹׁתֵיכֶם
  choice: మిమ్మల్ని మీరు
  rationale: ఇక్కడ נֶפֶשׁ విడిగా ‘ఆత్మ’ను సూచించకుండా సంపూర్ణ వ్యక్తిని సూచిస్తుంది; ప్రతిబింబార్థాన్ని తెలుగులో స్పష్టంగా ఉంచారు.
- source_word: לְאַהֲבָה
  choice: ప్రేమించేలా
  rationale: ల ఉపసర్గతో కూడిన క్రియానామం ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. ‘ప్రేమించేలా’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తూ ఆ స్వల్ప అస్పష్టతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ చతురక్షర నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించారు.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: బహువచన ద్వితీయ పురుష ప్రత్యయం ఇశ్రాయేలుతోనున్న నిబంధన సంబంధాన్ని ‘మీ దేవుడు’ అని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిబంధన సంబంధమైన హెచ్చరికలో נֶפֶשׁ పదార్థం
  choice: సంపూర్ణ వ్యక్తిని సూచించే ప్రతిబింబార్థం—‘మిమ్మల్ని మీరు’
  alternative: ‘మీ ఆత్మలను’ లేదా ‘మీ ప్రాణాలను’
  rationale: ఈ నిర్మాణంలో נֶפֶשׁ శరీరానికి భిన్నమైన అమూర్త భాగాన్ని ప్రత్యేకంగా చెప్పడం లేదు; ప్రజలు తమ సంపూర్ణ జీవనాన్ని అప్రమత్తంగా కాపాడుకొని యాహ్వేను ప్రేమించాలని హెచ్చరిస్తోంది.
- issue: לְאַהֲבָה యొక్క ఉద్దేశం/ఫలిత సంబంధం
  choice: ‘ప్రేమించేలా’
  alternative: ‘ప్రేమించడానికి’
  rationale: ‘ప్రేమించేలా’ అనేది తమను తాము కాపాడుకోవడం ప్రేమించడాన్ని లక్ష్యంగా పెట్టుకున్నదా లేక దానికి దారితీసే ఫలితమా అన్న హెబ్రీ నిర్మాణంలోని స్వల్ప విస్తృతిని అనవసరంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ఆజ్ఞారూపాన్ని వాడారు. ‘మిమ్మల్ని మీరు’ మూలంలోని ప్రతిబింబ బలాన్ని నిలుపుతుంది; ‘ఎంతో జాగ్రత్తగా’ దాని తీవ్రతను స్పష్టంగా తెలియజేస్తుంది. దైవనామం ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
