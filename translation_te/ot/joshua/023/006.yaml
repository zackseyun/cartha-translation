revisions:
- from: కాబట్టి మోషే ధర్మశాస్త్ర గ్రంథంలో[a] రాసి ఉన్నదంతా జాగ్రత్తగా పాటించి ఆచరించడానికి మీరు ఎంతో దృఢంగా ఉండండి; దానినుంచి కుడికిగానీ ఎడమకుగానీ తొలగిపోవద్దు.
  to: కాబట్టి మోషే ధర్మశాస్త్ర గ్రంథంలో[a] వ్రాయబడి ఉన్నదంతా పాటించి ఆచరించడానికి మీరు ఎంతో దృఢంగా ఉండండి; దాని నుండి కుడికిగానీ ఎడమకిగానీ తొలగిపోకుండా ఉండండి.
