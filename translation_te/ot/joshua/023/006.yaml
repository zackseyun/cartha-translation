id: JOS.23.6
reference: Joshua 23:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/חֲזַקְתֶּ֣ם מְאֹ֔ד לִ/שְׁמֹ֣ר וְ/לַ/עֲשׂ֔וֹת אֵ֚ת כָּל הַ/כָּת֔וּב בְּ/סֵ֖פֶר תּוֹרַ֣ת מֹשֶׁ֑ה לְ/בִלְתִּ֥י סוּר מִמֶּ֖/נּוּ יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
translation:
  language: te
  text: కాబట్టి మోషే ధర్మశాస్త్ర గ్రంథంలో[a] వ్రాయబడి ఉన్నదంతా పాటించి ఆచరించడానికి మీరు ఎంతో దృఢంగా ఉండండి; దాని నుండి కుడికిగానీ ఎడమకిగానీ తొలగిపోకుండా ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మోషే ఉపదేశ గ్రంథంలో.’ హీబ్రూ తోరా అనే పదానికి ‘ఉపదేశం’ అనే అర్థం కూడా ఉంది; అయితే ఇక్కడ అది ప్రత్యేకంగా మోషేకు సంబంధించిన నిబంధనా శాసన సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  choice: మీరు ఎంతో దృఢంగా ఉండండి
  rationale: חזק యొక్క బలం, స్థిరత్వం అనే భావాన్ని బహువచన సంబోధనతో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; מְאֹד ఇచ్చే తీవ్రతను ‘ఎంతో’ నిలుపుతుంది.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: జాగ్రత్తగా పాటించి ఆచరించడానికి
  rationale: שׁמרలోని శ్రద్ధగా కాపాడి పాటించడం అనే నిబంధనా భావాన్నీ, עשהలోని కార్యరూపంలో చేయడం అనే భావాన్నీ విడివిడిగా నిలుపుతుంది.
- source_word: כָּל הַכָּתוּב
  choice: రాసి ఉన్నదంతా
  rationale: లిఖిత విషయాల సమగ్రతను సహజంగా, మూలానికి సన్నిహితంగా తెలియజేస్తుంది.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: మోషే ధర్మశాస్త్ర గ్రంథంలో
  rationale: סֵפֶרను ‘గ్రంథం’గా, ఈ సందర్భంలో మోషేకు సంబంధించిన నిబంధనా శాసన సముదాయాన్ని సూచించే תּוֹרָהను ‘ధర్మశాస్త్రం’గా అనువదిస్తుంది.
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ
  choice: దానినుంచి ... తొలగిపోవద్దు
  rationale: ప్రయోజనార్థక నిషేధ భావాన్ని తెలుగులో ప్రత్యక్ష హెచ్చరికగా సహజంగా అందిస్తుంది; ఏకవచన ప్రత్యయం వ్రాయబడిన ధర్మశాస్త్రాన్ని సమగ్ర ఏకకంగా సూచిస్తుంది.
- source_word: יָמִין וּשְׂמֹאול
  choice: కుడికిగానీ ఎడమకుగానీ
  rationale: ఏ దిశలోనూ మార్గం తప్పకూడదనే హీబ్రూ రూపకాన్ని తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: మోషే నిబంధనా సందర్భంలో תּוֹרָה అనువాదం
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం
  rationale: תּוֹרָהకు ‘ఉపదేశం’ అనే విస్తృత అర్థం ఉన్నప్పటికీ, ఈ సూత్రబద్ధ ప్రయోగంలో అది మోషేతో అనుసంధానమైన లిఖిత నిబంధనా శాసన సముదాయాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం’ ఆ నిర్దిష్ట సూచనను స్పష్టంగా అందిస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. బహువచన సంబోధనను స్పష్టంగా ఉంచి, ‘కుడి/ఎడమ’ రూపకాన్ని అలాగే నిలిపింది.
