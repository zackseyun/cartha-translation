  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֤י הוֹלֵךְ֙ הַ/יּ֔וֹם בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וִ/ידַעְתֶּ֞ם בְּ/כָל לְבַבְ/כֶ֣ם וּ/בְ/כָל נַפְשְׁ/כֶ֗ם כִּ֣י לֹֽא נָפַל֩ דָּבָ֨ר אֶחָ֜ד מִ/כֹּ֣ל הַ/דְּבָרִ֣ים הַ/טּוֹבִ֗ים אֲשֶׁ֨ר דִּבֶּ֜ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ עֲלֵי/כֶ֔ם הַ/כֹּל֙ בָּ֣אוּ לָ/כֶ֔ם לֹֽא נָפַ֥ל מִמֶּ֖/נּוּ דָּבָ֥ר אֶחָֽד־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
translation:
  language: te
  text: ఇదిగో, నేడు నేను లోకులందరూ వెళ్లే మార్గంలో వెళ్తున్నాను.[a] మీ దేవుడైన యాహ్వే మీ విషయంలో పలికిన మంచి మాటలన్నిటిలో ఒక్క మాట కూడా విఫలం కాలేదని మీ హృదయమంతటితోను ప్రాణమంతటితోను మీకు తెలుసు. అవన్నీ మీకు నెరవేరాయి; వాటిలో ఒక్క మాట కూడా విఫలం కాలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “లోకులందరూ వెళ్లే మార్గం” అనేది మనుషులందరికీ సాధారణమైన గతి, ముఖ్యంగా మరణం, అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “ఒక్క మాట కూడా పడిపోలేదు” అని ఉంది; అంటే ఒక్క మాట కూడా విఫలం కాలేదు లేదా నెరవేరకుండా పోలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ప్రసంగంలోని గంభీరమైన శ్రద్ధాకర్షణను సహజమైన తెలుగు బైబిలు శైలిలో నిలుపుతుంది.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: లోకమంతా వెళ్లే మార్గంలో
  rationale: మనుషులందరికీ కలిగే మరణాన్ని సూచించే హీబ్రూ రూపకాన్ని నేరుగా ‘చనిపోవడం’గా విప్పకుండా నిలుపుతూ, తెలుగులో అర్థమయ్యేలా చెబుతుంది.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: మీ పూర్ణ హృదయంతో, పూర్ణ ప్రాణంతో
  rationale: ‘హృదయం—ప్రాణం’ అనే మూలభాషా జంటను, సంపూర్ణ అంతరంగ నిశ్చయాన్ని కాపాడుతుంది.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: ఒక్క మాట కూడా విఫలం కాలేదు
  rationale: ‘ఒక్క మాట పడిపోలేదు’ అనే హీబ్రూ నుడికార భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, דָּבָר మరియు דִּבֶּר మధ్యనున్న ‘మాట—పలికిన’ సంబంధాన్ని నిలుపుతుంది.
- source_word: הַדְּבָרִים הַטּוֹבִים
  choice: మంచి మాటలు
  rationale: ‘వాగ్దానాలు’ అని మరింత వ్యాఖ్యానాత్మకంగా మార్చకుండా, దేవుడు పలికిన మాటలనే సూచించే మూలపద సంబంధాన్ని కాపాడుతుంది.
- source_word: עֲלֵיכֶם
  choice: మీ గురించి
  rationale: עַל అనే విభక్తి ఇక్కడ సూచించే ‘మీను గూర్చి/మీ విషయంలో’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: הַכֹּל בָּאוּ לָכֶם
  choice: అవన్నీ మీకు నెరవేరాయి
  rationale: అక్షరార్థమైన ‘మీ వద్దకు వచ్చాయి’ అనే చిత్రంలోని నెరవేర్పు భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత నామమే ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: దేవుని మంచి మాటల నెరవేర్పు
  choice: ఒక్క మాట కూడా విఫలం కాలేదు
  alternative: ఒక్క వాగ్దానం కూడా తప్పిపోలేదు
  rationale: ‘వాగ్దానం’ అనే భావం సందర్భంలో సముచితమైనదైనా, మూలంలోని ‘మాట’ మరియు ‘పలికాడు’ అనే పదసంబంధాన్ని ప్రధాన పాఠంలో నిలిపి, నెరవేర్పును ‘విఫలం కాలేదు’ ద్వారా వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘ఎరుగుదురు’ అనే గౌరవబహువచన రూపం వాక్య గంభీరతను నిలుపుతుంది; మిగతా నిర్మాణం అతిగా ప్రాచీనంగా కాకుండా ఉంచబడింది.
