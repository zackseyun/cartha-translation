source:
  edition: WLC
  text: וַ/יּ֤וֹרֶשׁ יְהוָה֙ מִ/פְּנֵי/כֶ֔ם גּוֹיִ֖ם גְּדֹלִ֣ים וַ/עֲצוּמִ֑ים וְ/אַתֶּ֗ם לֹא עָ֤מַד אִישׁ֙ בִּ/פְנֵי/כֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
translation:
  language: te
  text: యాహ్వే మీ ఎదుటనుండి గొప్పవీ, బలమైనవీ అయిన జనాంగాలను వెళ్లగొట్టాడు[a]. మీ విషయానికి వస్తే, ఈ దినం వరకు ఏ ఒక్క మనిషీ మీ ఎదుట నిలువలేకపోయాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్వాధీనం నుండి తొలగించాడు’ లేదా ‘తొలగించాడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ, ఇశ్రాయేలు ఆ దేశాన్ని స్వాధీనం చేసుకునేలా అక్కడి జనాంగాలను తొలగించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో పదశః, ‘ఏ ఒక్క మనిషీ మీ ఎదుట నిలబడలేదు.’ ఇది ఎవరూ మిమ్మల్ని ఎదిరించి తట్టుకోలేకపోయారని తెలిపే యుద్ధసంబంధమైన నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  choice: వెళ్లగొట్టాడు
  rationale: హిఫిల్ రూపంలోని ירשׁ ఇక్కడ ఇతరులను దేశం నుండి తొలగించి, ఆ దేశాన్ని ఇశ్రాయేలు స్వాధీనం చేసుకునేలా చేయడాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సైనిక-భూస్వాధీన సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ మూలంలో దేవుని వ్యక్తిగత నామమైన చతురక్షర నామం నేరుగా ఉంది; బిరుదుతో భర్తీ చేయకుండా దానిని తెలుగులో లిప్యంతరీకరించాం.
- source_word: מִפְּנֵיכֶם
  choice: మీ ఎదుటనుండి
  rationale: מן + פנים అనే ప్రయోగం జయసందర్భంలో ఒకరి ఎదుట లేదా సన్నిధి నుండి తొలగించడాన్ని సూచిస్తుంది. ఈ రూపం హీబ్రూ దృశ్యాన్ని నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంది.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  choice: గొప్పవీ బలమైనవీ అయిన జనాంగాలు
  rationale: גָּדוֹל పరిమాణం లేదా ప్రాముఖ్యతను, עָצוּם బలాన్ని సూచిస్తాయి. ‘జనాంగాలు’ అనే పదం ఈ జయసందర్భంలో రాజకీయ-జాతి సమూహాల భావాన్ని తెలియజేస్తుంది.
- source_word: וְאַתֶּם
  choice: మీ విషయానికొస్తే
  rationale: ప్రత్యేకంగా ముందుకు తెచ్చిన బహువచన సర్వనామంలోని ఉద్ఘాటనను, అవసరానికి మించిన విరోధార్థం కలపకుండా ఈ ప్రయోగం వ్యక్తం చేస్తుంది.
- source_word: לֹא עָמַד אִישׁ בִּפְנֵיכֶם
  choice: ఏ ఒక్క మనిషీ మీ ఎదుట నిలువలేకపోయాడు
  rationale: పదశః ‘ఒక మనిషి మీ ఎదుట నిలబడలేదు.’ యుద్ధ సందర్భంలో ‘ఎదుట నిలబడడం’ అంటే ఎదిరించి తట్టుకోవడం; తెలుగులో ‘నిలువలేకపోయాడు’ ఆ సామర్థ్యార్థాన్ని సహజంగా వ్యక్తం చేస్తూనే మూలంలోని ఏకవచన మానవ సూచనను నిలుపుతుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: కథనంలోని ప్రస్తుత క్షణం వరకు ఈ పరిస్థితి కొనసాగిందని తెలిపే సహజమైన తెలుగు కాలప్రయోగం.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. దాన్ని వ్యక్తిగత నామంగా నిలుపుతూ, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘మీ ఎదుటనుండి’ అనే మూలరూప దృశ్యాన్ని నిలిపి, ‘నిలువలేకపోయాడు’ ద్వారా దాని యుద్ధసంబంధ భావాన్ని స్పష్టం చేశాం. రెండు పాదాల మధ్య ఉన్న ఉద్ఘాటనను ‘మీ విషయానికొస్తే’తో వ్యక్తం చేశాం.
