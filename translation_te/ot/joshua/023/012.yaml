source:
  edition: WLC
  text: כִּ֣י אִם שׁ֣וֹב תָּשׁ֗וּבוּ וּ/דְבַקְתֶּם֙ בְּ/יֶ֨תֶר֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וְ/הִֽתְחַתַּנְתֶּ֥ם בָּ/הֶ֛ם וּ/בָאתֶ֥ם בָּ/הֶ֖ם וְ/הֵ֥ם בָּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
translation:
  language: te
  text: ఎందుకంటే, ఒకవేళ మీరు నిజంగానే వెనుదిరిగి, ఈ జనాంగాలలో మిగిలినవారిని—మీతో పాటు ఇంకా ఉన్న వీరిని—అంటిపెట్టుకొని[a], వారితో వివాహ సంబంధాలు ఏర్పరచుకొని, వారితో కలిసిమెలిసి ఉండి, వారు మీతో కలిసిమెలిసి ఉంటే[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గట్టిగా అంటిపెట్టుకొని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీరు వారి మధ్యకు వెళ్లి, వారు మీ మధ్యకు వచ్చి.” హీబ్రూ నుడికారం కేవలం భౌతిక కదలికను మాత్రమే కాక, విస్తృతమైన సామాజిక సంబంధాలను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ఎందుకంటే, ఒకవేళ
  rationale: ముందటి వాక్యంలోని హెచ్చరికను కొనసాగిస్తూ షరతును ప్రవేశపెడుతుంది; కారణసూచక అనుసంధానాన్ని, షరతును రెండింటినీ నిలుపుతుంది.
- source_word: שׁוֹב תָּשׁוּבוּ
  choice: మీరు నిజంగా వెనుదిరిగి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియలోని బలాన్ని ‘నిజంగా’ తెలియజేస్తుంది; ‘వెనుదిరిగి’ అనే పదం ఒడంబడిక నిబద్ధతనుంచి తిరిగిపోవడమనే ప్రతికూల సందర్భానికి సరిపోతుంది.
- source_word: וּדְבַקְתֶּם
  choice: హత్తుకొని
  rationale: דבק సూచించే సన్నిహితమైన, బలమైన అనుబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం సమీపంలో ఉండడానికంటే గాఢమైన అనుబంధాన్ని సూచిస్తుంది.
- source_word: בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה
  choice: ఈ జనాలలో మిగిలినవారిని
  rationale: יֶתֶר యొక్క ‘మిగిలిన భాగం/వారు’ అనే సాధారణ భావాన్ని ఇస్తుంది; ‘శేషం’ అనే పదానికి ఇతర సందర్భాల్లో కలగగల ప్రత్యేక వేదాంతార్థాన్ని ఇక్కడ అనవసరంగా రప్పించదు.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: మీ మధ్య ఇంకా మిగిలివున్న వీరిని
  rationale: మూలంలోని పునరుక్త నిర్దేశాన్ని నిలుపుతూ, ఆ జనాలు ఇశ్రాయేలీయుల మధ్య ఇంకా ఉన్నారనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהִתְחַתַּנְתֶּם בָּהֶם
  choice: వారితో వివాహ సంబంధాలు పెట్టుకొని
  rationale: חתן హిత్పయేల్ రూపం పరస్పర వివాహ బంధాల్లో ప్రవేశించడాన్ని సూచిస్తుంది; ఇది ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: וּבָאתֶם בָּהֶם
  choice: వారితో కలిసిమెలిసి ఉంటూ
  rationale: వ్యక్తులతో వాడిన בוא ב అనే నుడికారం కేవలం భౌతికంగా వెళ్లడంకన్నా వారి మధ్య ప్రవేశించి సామాజిక సంబంధాలు కలిగి ఉండడాన్ని సూచించగలదు. ఇప్పటికే వివాహం ప్రత్యేకంగా చెప్పబడినందున విస్తృత సహవాస భావాన్ని ఎంచుకున్నాం.
- source_word: וְהֵם בָּכֶם
  choice: వారు మీతో కలిసిమెలిసి ఉంటే
  rationale: ముందటి నుడికారానికి సమాంతరంగా ఉన్న సంక్షిప్త పరస్పర వాక్యభాగాన్ని తెలుగులో అర్థమయ్యేలా పూరిస్తుంది; పరస్పర కలయికను నిలుపుతుంది.
theological_decisions:
- issue: שׁוֹב תָּשׁוּבוּ లోని ఒడంబడిక హెచ్చరిక
  choice: వెనుదిరిగి
  alternative: తిరిగి
  rationale: ఇక్కడ ఉద్దేశం తటస్థమైన తిరిగిరావడం కాదు; దేవునిపట్ల నిబద్ధతనుంచి వెనక్కి మరలడమనే ప్రతికూల గమనాన్ని సందర్భం సూచిస్తుంది.
- issue: יֶתֶר ను ప్రత్యేక వేదాంతార్థం గల ‘శేషం’గా చదివే అవకాశం
  choice: మిగిలినవారు
  alternative: శేషం
  rationale: ఇక్కడ పదం సాదాసీదాగా ఇంకా మిగిలి ఉన్న జనాలను సూచిస్తుంది. అనుకూలమైన లేదా విమోచనాత్మకమైన ‘శేషం’ భావాన్ని పాఠ్యంలోకి దిగుమతి చేయకుండా ఉంటుంది.
- issue: וּבָאתֶם בָּהֶם ను లైంగిక నిగూఢార్థానికి పరిమితం చేసే అవకాశం
  choice: వారితో కలిసిమెలిసి ఉంటూ
  alternative: వారి మధ్యకు వెళ్లి
  rationale: హీబ్రూ నుడికారం సామాజిక రాకపోకలు, కలయిక, సంబంధాలను విస్తృతంగా సూచించగలదు. వివాహ సంబంధం ముందే స్పష్టంగా చెప్పబడినందున లైంగిక భావానికి మాత్రమే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని షరతు వాక్యం తదుపరి వచనంలో పూర్తవుతుందనే నిర్మాణాన్ని చివరి కామాతో నిలిపాం. పునరుక్తిని పూర్తిగా తొలగించకుండా ఎమ్ డాష్‌లతో సహజంగా అమర్చాం.
