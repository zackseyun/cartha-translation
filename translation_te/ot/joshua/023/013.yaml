source:
  edition: WLC
  text: יָד֨וֹעַ֙ תֵּֽדְע֔וּ כִּי֩ לֹ֨א יוֹסִ֜יף יְהוָ֣ה אֱלֹהֵי/כֶ֗ם לְ/הוֹרִ֛ישׁ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֜ם לְ/פַ֣ח וּ/לְ/מוֹקֵ֗שׁ וּ/לְ/שֹׁטֵ֤ט בְּ/צִדֵּי/כֶם֙ וְ/לִ/צְנִנִ֣ים בְּ/עֵינֵי/כֶ֔ם עַד אֲבָדְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/013.yaml
  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
translation:
  language: te
  text: మీ దేవుడైన యాహ్వే ఇకపై ఈ జనాలను మీ ఎదుటనుంచి వెళ్లగొట్టడని[a] మీరు నిశ్చయంగా తెలుసుకోండి. అవి మీకు ఉచ్చుగానూ వలగానూ, మీ పక్కలలో కొరడాగానూ[b], మీ కళ్లలో ముళ్లుగానూ ఉంటాయి—మీ దేవుడైన యాహ్వే మీకు ఇచ్చిన ఈ మంచి దేశం మీదనుంచి మీరు నశించిపోయే వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ జనాలను మీ ఎదుటనుంచి వెళ్లగొట్టడం ఇక కొనసాగించడు.”
    reason: లֹא יוֹסִיף తో infinitive కలయికను ‘ఇకపై చేయడు’ అని లేదా ‘చేయడం కొనసాగించడు’ అని అనువదించవచ్చు.
  - marker: b
    text: ఇక్కడ “కొరడా” అని అనువదించిన హెబ్రీ పదం అర్థం నిర్ధారించడం కష్టం; అది కొరడా వంటి బాధించే సాధనాన్ని లేదా తీవ్రమైన బాధను సూచించవచ్చు.
    reason: అరుదైన, అర్థం వివాదాస్పదమైన మూలపదం వల్ల ఉన్న నిజమైన పదార్థ అనిశ్చితిని తెలియజేస్తుంది.
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  choice: మీరు నిశ్చయంగా తెలుసుకోండి
  rationale: జ్ఞానానికి సంబంధించిన క్రియ యొక్క infinitive absolute, finite verb కలయిక ఇక్కడ బలమైన నిశ్చయాన్ని సూచిస్తుంది. ఈ తెలుగుపదబంధం ఆ ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא יוֹסִיף ... לְהוֹרִישׁ
  choice: ఇకపై ... వెళ్లగొట్టడు
  rationale: יסף తో infinitive కలయిక కొనసాగుతున్న కార్యం ఇక జరగదనే భావాన్ని ఇస్తుంది. 'ఇకపై' ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; ירש Hiphil యొక్క జయసంబంధ సందర్భార్థాన్ని 'వెళ్లగొట్టు' తెలియజేస్తుంది.
- source_word: מִלִּפְנֵיכֶם
  choice: మీ ఎదుటనుంచి
  rationale: మూలంలోని స్థలసంబంధ రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యే విధంగా ఉంది.
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: ఉచ్చుగానూ వలగానూ
  rationale: సమీపార్థకమైన రెండు హెబ్రీ పదాల వాక్చాతుర్య జోడీని రెండు భిన్నమైన, సుపరిచిత తెలుగు పదాలతో నిలుపుతుంది.
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  choice: మీ పక్కలకు కొరడాగా
  rationale: అర్థం కష్టమైన שֹׁטֵט పదాన్ని శరీరానికి బాధ కలిగించే సాధనంగా అర్థం చేసుకునే సంప్రదాయ భావాన్ని నిలుపుతుంది; అనిశ్చితిని పాదసూచికలో వెల్లడించింది.
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  choice: మీ కళ్లలో ముళ్లుగా
  rationale: తీవ్రమైన, నిరంతర బాధను సూచించే మూలంలోని శరీర రూపకాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: עַד אֲבָדְכֶם
  choice: మీరు నశించిపోయే వరకు
  rationale: עַד తో వచ్చిన infinitive construct హెచ్చరిక ఫలితానికి చివరి హద్దును సూచిస్తుంది; ఈ రూపం దానిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: ఈ మంచి దేశం మీదనుంచి
  rationale: אדמה ఇక్కడ కేవలం మట్టిని కాక దేవుడు ఇచ్చిన దేశాన్ని సూచిస్తుంది. 'మీదనుంచి' מעל యొక్క స్థలభావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. 'యాహ్వే' దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా నిలుపుతుంది.
- issue: హెచ్చరిక స్వభావం
  choice: యాహ్వే జనాలను వెళ్లగొట్టడం ఆపడం, వారి వల్ల ఇశ్రాయేలుకు బాధ కలగడం, చివరికి ఇచ్చిన దేశం నుంచి నశించడం అనే పాఠ్య క్రమాన్ని నిలుపడం
  alternative: దీనిని కేవలం సైనిక అంచనాగా వివరించడం
  rationale: వాక్యం దేవుని కార్యం నిలిచిపోవడాన్ని, జనాల వల్ల కలిగే హానిని, ఇచ్చిన దేశాన్ని కోల్పోవడాన్ని పరస్పరం కలుపుతుంది. అదనపు సిద్ధాంత వివరణ లేకుండా ఆ నిబంధనాత్మక ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఉచ్చు–వల, పక్కలు–కళ్లు అనే మూలంలోని సమాంతర శరీర రూపకాలను నిలిపి, దీర్ఘ వాక్యాన్ని డ్యాష్ ద్వారా పఠనయోగ్యంగా ఉంచింది.
