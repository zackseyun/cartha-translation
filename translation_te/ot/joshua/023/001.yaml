id: JOS.23.1
reference: Joshua 23:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִ/יָּמִ֣ים רַבִּ֔ים אַ֠חֲרֵי אֲשֶׁר הֵנִ֨יחַ יְהוָ֧ה לְ/יִשְׂרָאֵ֛ל מִ/כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִ֑יב וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
translation:
  language: te
  text: యాహ్వే ఇశ్రాయేలుకు వారి చుట్టుపక్కల ఉన్న శత్రువులందరి నుండి విశ్రాంతి ఇచ్చిన తరువాత చాలా కాలం[a] గడిచింది; యెహోషువ వృద్ధుడు, వయసు మళ్లినవాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చాలా రోజుల తరువాత.”
    reason: lexical_alternative
  - marker: b
    text: “వయసు మళ్లినవాడు” అనే హీబ్రూ నుడికారానికి అక్షరార్థం “దినాల్లోకి వచ్చినవాడు.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: గడిచింది
  rationale: కొత్త కథన దృశ్యాన్ని ప్రారంభించే היה యొక్క wayyiqtol రూపం. తరువాత వచ్చే కాలసూచక పదబంధంతో కలిపి ‘చాలా కాలం గడిచింది’ అని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేయబడింది.
- source_word: מִיָּמִים רַבִּים
  choice: చాలా కాలం
  rationale: అక్షరార్థంగా ‘అనేక రోజుల తరువాత’ అనే భావం; ఇక్కడ గణనీయమైన కాలవ్యవధిని సూచిస్తుంది. ‘చాలా కాలం’ తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది; మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: తరువాత
  rationale: కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేసే సంయుక్త ప్రయోగాన్ని తెలుగులో నేరుగా, సహజంగా అందిస్తుంది.
- source_word: הֵנִיחַ
  choice: విశ్రాంతి ఇచ్చిన
  rationale: נוח హిఫిల్ రూపం ఈ సందర్భంలో శత్రువుల బాధ నుండి ఉపశమనాన్ని లేదా ప్రశాంత స్థితిని కలిగించడాన్ని సూచిస్తుంది. ‘విశ్రాంతి ఇచ్చిన’ మూలంలోని కార్యసాధక భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన నాలుగు హల్లుల పేరును బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణ ‘Yahweh’కు అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: ప్రజల లేదా జాతి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంతో అందిస్తుంది; లְ ఉపసర్గలోని పరోక్ష కర్మ భావాన్ని ‘కు’ ద్వారా చూపిస్తుంది.
- source_word: מִכָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: చుట్టూ ఉన్న శత్రువులందరి నుండి
  rationale: శత్రువుల నుండి సంపూర్ణంగా లభించిన ఉపశమనంతో పాటు מִסָּבִיב లోని చుట్టుపక్కల అనే స్థల భావాన్ని కూడా కాపాడుతుంది.
- source_word: וִיהוֹשֻׁעַ
  choice: అప్పటికి యెహోషువ
  rationale: దీర్ఘ కాలసూచక ఉపవాక్యం తరువాత ప్రధాన పాత్ర స్థితిని తెలిపే సంబంధాన్ని ‘అప్పటికి’ స్పష్టంగా చేస్తుంది; పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరిస్తుంది.
- source_word: זָקֵן
  choice: ముసలివాడై
  rationale: యెహోషువ వృద్ధాప్య స్థితిని సూటిగా తెలిపే సాధారణ ఆధునిక తెలుగు రూపం.
- source_word: בָּא בַּיָּמִים
  choice: వయసు బాగా మళ్లినవాడయ్యాడు
  rationale: అక్షరార్థంగా ‘దినాల్లోకి వచ్చాడు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థక ప్రయోగం; ముదిమి బాగా వచ్చిన భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా దైవ నామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, Yahweh అనే పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని కాలవ్యవధి, చుట్టుపక్కల శత్రువుల నుండి లభించిన విశ్రాంతి, యెహోషువ వృద్ధాప్యాన్ని తెలిపే సమాంతర పదప్రయోగం కాపాడబడ్డాయి. అక్షరార్థ హీబ్రూ నుడికారాలు పాఠాన్ని భారంగా చేయకుండా పాదసూచికల్లో వివరించబడ్డాయి.
