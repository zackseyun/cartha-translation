  to: '“లేచి, ప్రజలను పవిత్రపరచి, వారితో ఇలా చెప్పు: ‘రేపటికి మిమ్మల్ని మీరు పవిత్రపరచుకోండి. ఎందుకంటే ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా చెబుతున్నాడు: ఇశ్రాయేలూ, నాశనానికి అంకితం చేయబడినది[a] మీ మధ్య ఉంది. దాన్ని మీ మధ్యనుండి తొలగించేంతవరకు మీరు మీ శత్రువుల ఎదుట నిలబడలేరు.’”'
  rationale: 'సురక్షితమైన రెండు సవరణలు మాత్రమే చేయబడ్డాయి: ఆంగ్ల POB audit trailకు అనుగుణంగా దైవనామాన్ని ‘యాహ్వే’గా మార్చడం, అలాగే పవిత్రపరచు క్రియల పదసంబంధం మరియు ఆచారపూర్వక భావం స్పష్టంగా ఉండేందుకు ‘ప్రతిష్ఠించు’ స్థానంలో ‘పవిత్రపరచు’ వాడటం. חֵרֶםకు సంబంధించిన భావం, సమష్టి సంబోధన, మరియు కాలపరమైన షరతు మార్చబడలేదు.'
