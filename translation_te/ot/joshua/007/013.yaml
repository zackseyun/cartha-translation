source:
  edition: WLC
  text: קֻ֚ם קַדֵּ֣שׁ אֶת הָ/עָ֔ם וְ/אָמַרְתָּ֖ הִתְקַדְּשׁ֣וּ לְ/מָחָ֑ר כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל חֵ֤רֶם בְּ/קִרְבְּ/ךָ֙ יִשְׂרָאֵ֔ל לֹ֣א תוּכַ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֶ֔י/ךָ עַד הֲסִירְ/כֶ֥ם הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
translation:
  language: te
  text: '“లేచి, ప్రజలను పవిత్రపరచి, వారితో ఇలా చెప్పు: ‘రేపటికి మిమ్మల్ని మీరు పవిత్రపరచుకోండి. ఎందుకంటే ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా చెబుతున్నాడు: ఇశ్రాయేలూ, నాశనానికి అంకితం చేయబడినది[a] మీ మధ్య ఉంది. దాన్ని మీ మధ్యనుండి తొలగించేంతవరకు మీరు మీ శత్రువుల ఎదుట నిలబడలేరు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ חֵרֶם (హేరెమ్): తిరిగి తీసుకోలేని విధంగా అంకితం చేయబడినది; ఈ సందర్భంలో నాశనానికి నియమించబడినది. దీన్ని సంప్రదాయంగా ‘నిషిద్ధ వస్తువు’ లేదా ‘అంకితమైనది’ అని కూడా అనువదిస్తారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻם
  choice: లేచి
  rationale: తక్షణ చర్యను ప్రారంభించమని యెహోషువకు ఇచ్చిన ఆజ్ఞ; ఆధునిక తెలుగులో సహజంగా ఉండి ఆజ్ఞలోని అత్యవసరతను నిలుపుతుంది.
- source_word: קַדֵּשׁ אֶת־הָעָם
  choice: ప్రజలను ప్రతిష్ఠించి
  rationale: పియేల్ రూపంలోని ‘పవిత్రమైన ఉద్దేశం కోసం సిద్ధపరచు/వేరుచేయు’ అనే భావాన్ని తెలియజేస్తుంది; తరువాతి ఆత్మవాచక రూపంతో పదసంబంధాన్ని కాపాడుతుంది.
- source_word: הִתְקַדְּשׁוּ לְמָחָר
  choice: రేపటి కోసం మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి
  rationale: హిత్పయేల్ ఆజ్ఞలోని ఆత్మవాచక భావాన్ని, మరుసటి దినాన్ని దృష్టిలో ఉంచుకున్న సిద్ధపాటును రెండింటినీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన దైవనామ రూపం; మూలంలోని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయదు.
- source_word: חֵרֶם
  choice: నాశనానికి అంకితం చేయబడినది
  rationale: తిరిగి తీసుకోలేని విధంగా అంకితం చేయబడి, ఈ సందర్భంలో నాశనానికి నియమించబడిన వస్తువు అనే భావాన్ని స్పష్టం చేస్తుంది; కేవలం ‘శపించబడినది’ అనే తప్పుదారి పట్టించే అర్థాన్ని నివారిస్తుంది.
- source_word: בְּקִרְבְּךָ יִשְׂרָאֵל
  choice: ఇశ్రాయేలూ, ... మీ మధ్య
  rationale: ఇశ్రాయేలును సమష్టిగా ఏకవచనంలో సంబోధించే మూల భావాన్ని తెలుగులో సహజమైన సంబోధనతో వ్యక్తం చేస్తుంది.
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ
  choice: మీరు మీ శత్రువుల ఎదుట నిలబడలేరు
  rationale: శత్రువులను ఎదిరించి నిలిచి జయించలేకపోవడం అనే హీబ్రూ నుడికారాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַד הֲסִירְכֶם
  choice: తొలగించేంతవరకు
  rationale: ఇశ్రాయేలు మళ్లీ శత్రువుల ఎదుట నిలబడటానికి ముందుగా నెరవేర్చవలసిన కాలపరమైన షరతును కాపాడుతుంది.
theological_decisions:
- issue: חֵרֶם అనే పదాన్ని తీర్పు/పవిత్ర యుద్ధ సందర్భంలో అనువదించడం
  choice: నాశనానికి అంకితం చేయబడినది
  alternative: నిషిద్ధ వస్తువు; శాపగ్రస్తమైనది; అంకితమైనది
  rationale: ఈ పదం సాధారణ శాపాన్ని మాత్రమే సూచించదు; తిరిగి తీసుకోలేని అంకితాన్ని, ఇక్కడ ప్రత్యేకంగా నాశనానికి నియమించబడినదాన్ని సూచిస్తుంది. అనువాదం ఆ ఉద్రిక్తతను దాచకుండా అర్థాన్ని స్పష్టం చేస్తుంది.
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఉపయోగిస్తుంది.
- issue: ఇశ్రాయేలు యొక్క సమష్టి బాధ్యత
  choice: ఏకవచన మూల సంబోధనను సహజ తెలుగు బహువచన గౌరవ/సమష్టి రూపంలో వ్యక్తీకరించడం
  alternative: నీవు/నీ మధ్య అని అక్షరార్థ ఏకవచనం
  rationale: హీబ్రూలో ఇశ్రాయేలు ఒక సమష్టి వ్యక్తిగా సంబోధించబడింది. తెలుగులో ‘ఇశ్రాయేలూ ... మీ మధ్య’ అనడం ఈ సమష్టి భావాన్ని అసహజత లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ‘ప్రతిష్ఠించు’ అనే పదం ఆచారపరమైన సిద్ధపాటు మరియు పవిత్ర ఉద్దేశం కోసం వేరుచేయడం అనే భావాలను మోస్తుంది. మూలంలోని ప్రత్యక్ష సంబోధన, ఆజ్ఞల అత్యవసరత, సమష్టి బాధ్యత కాపాడబడ్డాయి.
