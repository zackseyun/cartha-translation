id: JOS.7.8
reference: Joshua 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ֖י אֲדֹנָ֑/י מָ֣ה אֹמַ֔ר אַ֠חֲרֵי אֲשֶׁ֨ר הָפַ֧ךְ יִשְׂרָאֵ֛ל עֹ֖רֶף לִ/פְנֵ֥י אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
translation:
  language: te
  text: దయచేసి, ప్రభువా, ఇశ్రాయేలు తన శత్రువుల ఎదుట వెన్నుచూపిన తర్వాత నేనేమి చెప్పగలను?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేనేమి చెప్పాలి?”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తన శత్రువుల ఎదుట తన వెనుక మెడను తిప్పింది”; ఇది ఓటమిలో వెనుదిరగడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: בִּי
  choice: అయ్యో
  rationale: ఉన్నతుని ఎదుట చేసే తీవ్రమైన విజ్ఞప్తి లేదా వేదనను తెలిపే ఈ సంభోదన కణానికి, సందర్భానుసారంగా ‘అయ్యో’ సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: దేవుణ్ణి నేరుగా గౌరవంతో సంబోధించే దైవ బిరుదును ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; మూలంలో లేని నిబంధన నామాన్ని చేర్చదు.
- source_word: מָה אֹמַר
  choice: నేనేమి చెప్పగలను?
  rationale: అక్షరార్థంగా ‘నేనేమి చెప్పాలి?’ అయినప్పటికీ, యెహోషువ వ్యక్తం చేస్తున్న నిస్సహాయతను తెలుగు విలాప-ప్రార్థనా శైలిలో సహజంగా తెలియజేస్తుంది.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: తర్వాత
  rationale: ప్రశ్నకు దారితీసిన ఘటనను సరళంగా, సహజంగా పరిచయం చేస్తుంది.
- source_word: הָפַךְ ... עֹרֶף
  choice: వెన్నుచూపిన
  rationale: అక్షరార్థంగా ‘మెడ వెనుక భాగాన్ని తిప్పడం’; యుద్ధంలో ఓడి వెనుదిరగడాన్ని తెలిపే హీబ్రూ నుడికారానికి సమానమైన సహజ తెలుగు నుడికారం.
- source_word: לִפְנֵי אֹיְבָיו
  choice: తన శత్రువులకు
  rationale: శత్రువుల ఎదుట నుండి వెనుదిరిగిన భావాన్ని ‘వెన్నుచూపు’ అనే తెలుగు నుడికారంతో కలిపి సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אֲדֹנָי అనే దైవ బిరుదు అనువాదం
  choice: ప్రభువా
  alternative: నా ప్రభువా
  rationale: ఇక్కడ ఇది దేవునికి వాడిన గౌరవసూచక దైవ బిరుదు. ‘ప్రభువా’ దాని సాధారణ ప్రయోగాన్ని నిలుపుతుంది; మూలంలో లేని దైవ నామాన్ని ప్రవేశపెట్టదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనలోని గౌరవం, వేదన, నిస్సహాయతలను నిలిపే సరళమైన గంభీర శైలి. ‘వెన్నుచూపు’ అనే సహజ తెలుగు నుడికారం హీబ్రూ యుద్ధ నుడికారాన్ని సమర్థంగా ప్రతిబింబిస్తుంది.
