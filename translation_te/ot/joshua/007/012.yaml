source:
  edition: WLC
  text: וְ/לֹ֨א יֻכְל֜וּ בְּנֵ֣י יִשְׂרָאֵ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֵי/הֶ֔ם עֹ֗רֶף יִפְנוּ֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם כִּ֥י הָי֖וּ לְ/חֵ֑רֶם לֹ֤א אוֹסִיף֙ לִֽ/הְי֣וֹת עִמָּ/כֶ֔ם אִם לֹ֥א תַשְׁמִ֛ידוּ הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
translation:
  language: te
  text: కాబట్టి ఇశ్రాయేలీయులు తమ శత్రువుల ఎదుట నిలువలేరు. వారు తమ శత్రువుల ఎదుట వెన్ను తిప్పుతారు; ఎందుకంటే వారు నిర్మూలనకు అంకితమైనవారయ్యారు.[a] మీ మధ్యనుండి నిర్మూలనకు అంకితమైనదాన్ని మీరు నాశనం చేస్తే తప్ప, ఇకపై నేను మీతో ఉండను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ חֵרֶם (ఖేరెమ్) అనే పదం దేవునికి అప్పగించబడి, నిషేధాజ్ఞ ప్రకారం నిర్మూలించవలసిన వ్యక్తిని లేదా వస్తువును సూచిస్తుంది. సంప్రదాయ అనువాదాల్లో దీనిని ‘శాపగ్రస్తమైనది’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ మొత్తం ప్రజలను సూచిస్తుంది. ఆధునిక సహజ తెలుగులో ‘ఇశ్రాయేలీయులు’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יֻכְלוּ
  choice: నిలువలేరు
  rationale: ఈ సందర్భంలోని అసమర్థతను వర్తమాన ఫలితంగా సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: לָקוּם לִפְנֵי אֹיְבֵיהֶם
  choice: తమ శత్రువుల ఎదుట నిలువలేరు
  rationale: శత్రువులను ఎదుర్కొని స్థిరంగా నిలబడటమనే హీబ్రూ రూపకాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: עֹרֶף יִפְנוּ
  choice: తమ శత్రువులకు వెన్ను చూపుతారు
  rationale: అక్షరార్థంలోని మెడ/వీపు తిప్పడం అనే చిత్రాన్ని కాపాడుతూ, ఓటమిలో వెనుదిరగడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָיוּ לְחֵרֶם
  choice: నిర్మూలనకు అంకితమైనవారయ్యారు
  rationale: חֵרֶם లోని దేవునికి అప్పగించబడటం మరియు తీర్పుగా నాశనం చేయబడటం అనే రెండు భావాలను కలిపి ఉంచుతుంది; కేవలం ‘శాపగ్రస్తులు’ అని సరళీకరించదు.
- source_word: לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם
  choice: ఇకపై నేను మీతో ఉండను
  rationale: దేవుని సహవాస సన్నిధి కొనసాగదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אִם לֹא
  choice: చేస్తే తప్ప
  rationale: ప్రతికూల షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תַשְׁמִידוּ
  choice: మీరు నాశనం చేస్తే
  rationale: హిఫిల్ రూపంలోని నిర్ణాయక నిర్మూలన భావాన్ని బలంగా, అయితే అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: הַחֵרֶם
  choice: నిర్మూలనకు అంకితమైనదాన్ని
  rationale: సమాజంలో ఉన్న నిర్దిష్ట నిషిద్ధ వస్తువు లేదా దానితో సంబంధమైనదాన్ని సూచిస్తూ, ముందటి חֵרֶם పదంతో పదసంబంధాన్ని కాపాడుతుంది.
- source_word: מִקִּרְבְּכֶם
  choice: మీ మధ్యనుండి
  rationale: సమాజం లోపలినుండి తొలగించడమనే ఒడంబడిక సంబంధిత భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ఒకే వాక్యంలో חֵרֶם యొక్క స్థితి మరియు నిర్దిష్ట వస్తువు అనే రెండు వినియోగాలు
  choice: ‘నిర్మూలనకు అంకితమైనవారయ్యారు’ / ‘నిర్మూలనకు అంకితమైనదాన్ని’
  alternative: ‘శాపగ్రస్తులయ్యారు’ / ‘శాపగ్రస్తమైనదాన్ని’; లేదా ‘నిషేధం కిందికి వచ్చారు’ / ‘నిషిద్ధమైనదాన్ని’
  rationale: ఒకే హీబ్రూ పదంలోని ఆరాధనా-న్యాయ సంబంధమైన అనుసంధానాన్ని నిలుపుతూ, ఇశ్రాయేలు పొందిన స్థితిని మరియు వారి మధ్యనున్న నిర్దిష్ట దానిని వేరుచేస్తుంది. ‘శాపం’ అనే ఒక్క భావానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన వాక్యశైలి. חֵרֶם యొక్క న్యాయ-ఆరాధనా ఉద్వేగాన్ని వివరణాత్మక పదబంధంతో కాపాడి, పాదటిప్పణిలో ప్రత్యామ్నాయ సంప్రదాయ పదాన్ని ఇచ్చాం.
