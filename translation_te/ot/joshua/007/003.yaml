base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
translation:
  language: te
  text: 'వారు యెహోషువ దగ్గరికి తిరిగి వచ్చి అతనితో ఇలా అన్నారు: “ప్రజలందరినీ పైకి వెళ్లనివ్వవద్దు. దాదాపు రెండువేలమంది గానీ మూడువేలమంది గానీ పైకి వెళ్లి హాయిపై దాడి చేయనివ్వండి. ప్రజలందరికీ అక్కడ శ్రమ కలిగించవద్దు[a], ఎందుకంటే అక్కడివారు కొద్దిమందే.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలందరినీ అక్కడ అలసిపోయేలా చేయవద్దు.” హీబ్రూ క్రియ అనవసరమైన శ్రమవల్ల అలసట లేదా భారం కలిగించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֶל־יְהוֹשֻׁעַ
  choice: వారు యెహోషువ దగ్గరికి తిరిగి వచ్చి
  rationale: שוב అనే క్రియ తిరిగి రావడాన్ని సూచిస్తుంది; లక్ష్యాన్ని తెలుగులో సహజంగా ‘దగ్గరికి’తో వ్యక్తం చేశాం.
- source_word: אַל־יַעַל כָּל־הָעָם
  choice: ప్రజలందరూ వెళ్లవద్దు
  rationale: אַל + జస్సివ్ నిషేధాత్మక సలహాను తెలియజేస్తుంది. עלהకు ఉన్న పైకి వెళ్లడం అనే రూపాన్ని సందర్భంలో అసహజంగా బలవంతం చేయకుండా ‘వెళ్లడం’గా ఇచ్చాం; הָעָם అనే విస్తృత పదాన్ని ‘ప్రజలు’గానే నిలిపాం.
- source_word: כְּאַלְפַּיִם אִישׁ אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: దాదాపు రెండువేలమంది గానీ మూడువేలమంది గానీ
  rationale: כְּ ఇక్కడ సుమారు సంఖ్యను సూచిస్తుంది. אוֹ తెలిపే ప్రత్యామ్నాయ అంచనాను తెలుగులో సహజమైన ‘గానీ...గానీ’ నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: יַעֲלוּ וְיַכּוּ אֶת־הָעָי
  choice: వెళ్లి హాయిని ముట్టడించాలి
  rationale: נכהకు ప్రాథమికంగా కొట్టడం/దాడి చేయడం అనే భావం ఉంది. పట్టణంపై సైనిక చర్యను ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ‘ముట్టడించాలి’ ఎంచుకున్నాం; ఇది ‘జయించాలి’ అని ఫలితాన్ని ముందుగానే నిర్ధారించదు.
- source_word: אַל־תְּיַגַּע שָׁמָּה אֶת־כָּל־הָעָם
  choice: ప్రజలందరినీ అక్కడ ప్రయాసపెట్టవద్దు
  rationale: יגע పియేల్ రూపం శ్రమ కలిగించడం, అలసటకు గురిచేయడం అనే భావాలను కలిగి ఉంది. ‘ప్రయాసపెట్టవద్దు’ అనవసర శ్రమ అనే సందర్భార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: כִּי מְעַט הֵמָּה
  choice: ఎందుకంటే అక్కడివారు కొద్దిమందే
  rationale: సర్వనామం హాయి నివాసులు లేదా రక్షకులను సూచిస్తుంది; తెలుగులో సూచన స్పష్టంగా ఉండేందుకు ‘అక్కడివారు’ అని ఇచ్చాం, వారి ఖచ్చిత గుర్తింపును మరింత సంకుచితం చేయలేదు.
