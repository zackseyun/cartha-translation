- from: వారు యెహోషువ దగ్గరికి తిరిగి వచ్చి అతనితో, “ప్రజలందరూ వెళ్లవద్దు. దాదాపు రెండువేలమంది గానీ మూడువేలమంది గానీ వెళ్లి హాయిని ముట్టడించాలి. ప్రజలందరినీ అక్కడ ప్రయాసపెట్టవద్దు[a]; ఎందుకంటే అక్కడివారు కొద్దిమందే” అన్నారు.
  to: 'వారు యెహోషువ దగ్గరికి తిరిగి వచ్చి అతనితో ఇలా అన్నారు: “ప్రజలందరినీ పైకి వెళ్లనివ్వవద్దు. దాదాపు రెండువేలమంది గానీ మూడువేలమంది గానీ పైకి వెళ్లి హాయిపై దాడి చేయనివ్వండి. ప్రజలందరికీ అక్కడ శ్రమ కలిగించవద్దు[a], ఎందుకంటే అక్కడివారు కొద్దిమందే.”'
