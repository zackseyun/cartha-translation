translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ ‘ప్రజలు’ అనే విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సైన్యం లేదా సైనికులు అని సంకుచితం చేయలేదు. సంఖ్యలలోని సుమారు భావం, హాయి ప్రజలు కొద్దిమందనే సూచన నిలుపబడ్డాయి.
