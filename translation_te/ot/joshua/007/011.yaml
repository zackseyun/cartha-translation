id: JOS.7.11
reference: Joshua 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חָטָא֙ יִשְׂרָאֵ֔ל וְ/גַם֙ עָבְר֣וּ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי אוֹתָ֑/ם וְ/גַ֤ם לָֽקְחוּ֙ מִן הַ/חֵ֔רֶם וְ/גַ֤ם גָּֽנְבוּ֙ וְ/גַ֣ם כִּֽחֲשׁ֔וּ וְ/גַ֖ם שָׂ֥מוּ בִ/כְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
translation:
  language: te
  text: ఇశ్రాయేలు పాపం చేసింది. నేను వారికి ఆజ్ఞాపించిన నా నిబంధనను కూడా వారు అతిక్రమించారు. నాశనానికి అంకితం చేసిన వాటిలో కొన్నిటిని కూడా తీసుకున్నారు[a]; దొంగిలించారు కూడా; మోసం చేశారు కూడా[b]; వాటిని తమ వస్తువుల మధ్య కూడా పెట్టుకున్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “నాశనార్థం అంకితం చేసిన వాటిలో నుంచి తీసుకున్నారు” లేదా “నిషేధిత వస్తువులలో నుంచి తీసుకున్నారు.”'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “అబద్ధమాడారు”; “దానిని నిరాకరించారు.”'
    reason: lexical_alternative
  - marker: c
    text: 'అక్షరార్థంగా: “తమ పాత్రలు/సామగ్రి మధ్య పెట్టారు.” సందర్భంలో ఇది ఆ వస్తువులను తమ సొత్తులో కలిపి దాచడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָא יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పాపం చేసింది
  rationale: దేవునికి వ్యతిరేకంగా చేసిన పాపమనే నైతిక, ఆధ్యాత్మిక తీవ్రతను నేరుగా తెలియజేస్తుంది. హీబ్రూ వాక్యంలాగే అపరాధాన్ని సమష్టిగా ఇశ్రాయేలుకే ఆపాదిస్తుంది.
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  choice: నా నిబంధనను ... అతిక్రమించారు
  rationale: עבר అనే క్రియ నిబంధన విధించిన హద్దును దాటడం, ఉల్లంఘించడం అనే భావాన్ని ఇస్తుంది; ‘అతిక్రమించారు’ ఆ అధికారిక నిబంధన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר צִוִּיתִי אוֹתָם
  choice: నేను వారికి ఆజ్ఞాపించిన
  rationale: మూలంలో ఉన్నదానినే అనుసరించి, ‘పాటించమని’ వంటి స్పష్టీకరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: לָקְחוּ מִן־הַחֵרֶם
  choice: నాశనానికి అంకితం చేసిన వాటిలో కొన్నిటిని తీసుకున్నారు
  rationale: חֵרֶם ఇక్కడ దేవునికి ప్రత్యేకంగా ఉంచబడి నాశనం చేయవలసిన వస్తువులను సూచిస్తుంది. ఈ అనువాదం అంకిత భావాన్నీ నాశన ఉద్దేశాన్నీ రెండింటినీ తెలియజేస్తుంది.
- source_word: גָּנְבוּ
  choice: దొంగిలించారు
  rationale: క్రియ యొక్క సూటి అర్థాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: כִּחֲשׁוּ
  choice: మోసం చేశారు
  rationale: ఈ క్రియకు అబద్ధమాడడం, నిరాకరించడం, మోసపూర్వకంగా ప్రవర్తించడం అనే అర్థ పరిధి ఉంది. ‘మోసం చేశారు’ ఆ విస్తృతిని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: שָׂמוּ בִכְלֵיהֶם
  choice: వాటిని తమ వస్తువుల మధ్య పెట్టుకున్నారు
  rationale: כְּלִים పాత్రలు, సామగ్రి, వ్యక్తిగత వస్తువులు వంటి విస్తృత అర్థం కలిగిన పదం. సందర్భంలో నిషేధిత వస్తువులను తమ సొత్తులో కలిపి దాచడాన్ని ఈ సహజ తెలుగు వ్యక్తీకరణ సూచిస్తుంది.
- source_word: וְגַם ... וְגַם ... וְגַם
  choice: కూడా ... ; ... ; ...
  rationale: హీబ్రూలో పునరావృతమైన גַם ఆరోపణలను వరుసగా పేరుస్తూ బలపరుస్తుంది. తెలుగులో ప్రతి ఖండంలో ‘కూడా’ అని యాంత్రికంగా పునరావృతం చేయకుండా, మొదటి రెండు చోట్ల దానిని ఉంచి తరువాత అర్ధవిరామాలతో ఆరోపణల సంచిత బలాన్ని సహజంగా నిలిపాం.
theological_decisions:
- issue: ఒక వ్యక్తి చేసిన అపరాధాన్ని ఇశ్రాయేలు సమాజమంతటికీ ఆపాదించడం
  choice: ‘ఇశ్రాయేలు పాపం చేసింది’ అని సమష్టి కర్తను, తరువాత బహువచన క్రియలను యథాతథంగా నిలిపాం.
  alternative: అపరాధాన్ని ఆకానుకు మాత్రమే పరిమితం చేస్తూ వివరణాత్మకంగా అనువదించడం.
  rationale: హీబ్రూ పాఠ్యం నిబంధన సమాజమైన ఇశ్రాయేలుకే పాపాన్ని స్పష్టంగా ఆపాదిస్తుంది. ఈ సమష్టి బాధ్యతలోని వేదాంతపరమైన ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘నిబంధన’, ‘అతిక్రమించారు’, ‘నాశనానికి అంకితం’ వంటి పదాలు మూలంలోని నిబంధనాత్మక, న్యాయపరమైన బరువును నిలుపుతాయి. ఇశ్రాయేలు అనే ఏకవచన సమష్టి పేరుతో ‘చేసింది’, తరువాత సభ్యులను సూచించే బహువచనంతో ‘వారు’ అన్న మార్పు మూలంలోని సంఖ్యా మార్పును సహజ తెలుగులో సంరక్షిస్తుంది.
