  to: ఇశ్రాయేలు పాపం చేసింది. నేను వారికి ఆజ్ఞాపించిన నా నిబంధనను కూడా వారు అతిక్రమించారు. నాశనానికి అంకితం చేసిన వాటిలో కొన్నిటిని కూడా తీసుకున్నారు[a]; దొంగిలించారు కూడా; మోసం చేశారు కూడా[b]; వాటిని తమ వస్తువుల మధ్య కూడా పెట్టుకున్నారు[c].
  rationale: సవరించిన పాఠ్యం హీబ్రూలోని ప్రతి וְגַם ఆరోపణకు తెలుగులో ‘కూడా’ను పునరావృతం చేసి ఆరోపణల సంచిత బలాన్ని నిలుపుతుంది. పాదసూచిక a నుండి ‘శాపిత’ను తొలగించి, חֵרֶם యొక్క సందర్భానుగుణమైన నాశనార్థ అంకితం/నిషేధ భావాన్నే ఇచ్చింది. సమష్టి ‘ఇశ్రాయేలు’ మరియు తరువాతి బహువచన క్రియలు యథాతథంగా ఉంచబడ్డాయి.
