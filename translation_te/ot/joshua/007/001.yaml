source:
  edition: WLC
  text: וַ/יִּמְעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מַ֖עַל בַּ/חֵ֑רֶם וַ/יִּקַּ֡ח עָכָ֣ן בֶּן כַּרְמִי֩ בֶן זַבְדִּ֨י בֶן זֶ֜רַח לְ/מַטֵּ֤ה יְהוּדָה֙ מִן הַ/חֵ֔רֶם וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
translation:
  language: te
  text: అయితే ఇశ్రాయేలీయులు నాశనానికి అంకితం చేసిన వాటి[a] విషయంలో నమ్మకద్రోహానికి పాల్పడ్డారు. యూదా గోత్రానికి చెందిన జెరహు కుమారుడైన జబ్దీ కుమారుడైన కర్మీ కుమారుడు ఆకాను, నాశనానికి అంకితం చేసిన వాటిలో కొన్నిటిని తీసుకున్నాడు. అందుచేత యాహ్వే కోపం ఇశ్రాయేలీయుల మీద రగులుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రత్యేకంగా అంకితం చేసినవి’; మరింత అక్షరార్థంగా, ‘నిషేధం కింద ఉంచినవి.’ హీబ్రూ חֵרֶם అనే పదం దేవునికి ప్రత్యేకపరచబడి, నాశనం చేయడానికి లేదా సాధారణ మానవ వినియోగం నుండి తొలగించడానికి ఉంచిన వ్యక్తులను లేదా వస్తువులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ ... מַעַל
  choice: నమ్మకద్రోహానికి పాల్పడ్డారు
  rationale: మעל అనే క్రియ, దాని సహజాత నామవాచకంతో కలిసి, ఒడంబడిక సంబంధమైన విశ్వాసభంగాన్ని బలంగా వ్యక్తం చేస్తుంది. ‘నమ్మకద్రోహానికి పాల్పడ్డారు’ అనే రూపం ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ కుటుంబపరమైన సంజ్ఞను తెలుగులో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఇవ్వడం అసహజంగా ఉంటుంది; ‘ఇశ్రాయేలీయులు’ జాతి సమూహాన్ని సహజంగా సూచిస్తూ సామూహిక బాధ్యతను నిలుపుతుంది.
- source_word: בַּחֵרֶם / מִן הַחֵרֶם
  choice: నాశనానికి అంకితం చేసిన వాటి / వాటిలో
  rationale: חֵרֶם సాధారణ మానవ వినియోగం నుండి తొలగించి దేవునికి ప్రత్యేకపరచబడిన, ఈ సందర్భంలో నాశనానికి ఉంచబడిన వస్తువులను సూచిస్తుంది. ఈ అనువాదం అంకితం మరియు నాశనం అనే రెండు అంశాలను నిలుపుతుంది.
- source_word: וַיִּקַּח ... מִן
  choice: వాటిలో కొన్నిటిని తీసుకున్నాడు
  rationale: מִן ఇక్కడ సమూహంలో కొంత భాగాన్ని సూచిస్తుంది; అందువల్ల తెలుగులో సహజంగా ‘కొన్నిటిని’ అని స్పష్టం చేయబడింది.
- source_word: לְמַטֵּה יְהוּדָה
  choice: యూదా గోత్రానికి చెందిన
  rationale: గోత్ర వంశావళి సందర్భంలో מַטֶּה కు ‘గోత్రం’ సరైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: וַיִּחַר אַף יְהוָה
  choice: యెహోవా కోపం ... రగులుకుంది
  rationale: హీబ్రూలోని ‘కోపం మండింది’ అనే సజీవ రూపకాన్ని సహజమైన తెలుగు ప్రయోగమైన ‘కోపం రగులుకుంది’ ద్వారా నిలిపింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందించింది.
theological_decisions:
- issue: ఇశ్రాయేలీయుల సామూహిక నమ్మకద్రోహం మరియు ఆకాను చేసిన వ్యక్తిగత చర్య మధ్య ఉన్న ఉద్రిక్తత
  choice: మొదటి వాక్యంలో ఇశ్రాయేలీయులనే సామూహిక కర్తగా ఉంచి, తరువాత ఆకానును వ్యక్తిగత కార్యదారునిగా స్పష్టంగా పేర్కొనడం.
  alternative: నేరాన్ని పూర్తిగా ఆకానుకే పరిమితం చేయడం, లేదా సామూహిక అంశాన్ని మాత్రమే చెప్పడం.
  rationale: హీబ్రూ పాఠం ఒక వ్యక్తి చర్యను జాతి నమ్మకద్రోహంగా పేర్కొంటూ వ్యక్తిగత పాపం మరియు సామూహిక పరిణామాన్ని కలిపి ఉంచుతుంది; అనువాదం ఆ theological tension‌ను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వంశావళి క్రమాన్ని హీబ్రూ మూలానికి అనుగుణంగా నిలిపింది; సాంకేతిక పదమైన חֵרֶם యొక్క భావవ్యాప్తిని ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా అందించింది.
