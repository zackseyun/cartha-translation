source:
  edition: WLC
  text: וְ/נִקְרַבְתֶּ֥ם בַּ/בֹּ֖קֶר לְ/שִׁבְטֵי/כֶ֑ם וְ/הָיָ֡ה הַ/שֵּׁבֶט֩ אֲשֶׁר יִלְכְּדֶ֨/נּוּ יְהוָ֜ה יִקְרַ֣ב לַ/מִּשְׁפָּח֗וֹת וְ/הַ/מִּשְׁפָּחָ֞ה אֲשֶֽׁר יִלְכְּדֶ֤/נָּה יְהוָה֙ תִּקְרַ֣ב לַ/בָּתִּ֔ים וְ/הַ/בַּ֨יִת֙ אֲשֶׁ֣ר יִלְכְּדֶ֣/נּוּ יְהוָ֔ה יִקְרַ֖ב לַ/גְּבָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
translation:
  language: te
  text: ఉదయం మీరు మీ గోత్రాలవారీగా ముందుకు రావాలి. యాహ్వే ఏ గోత్రాన్ని ఎంపిక చేస్తాడో[a], ఆ గోత్రం వంశాలవారీగా ముందుకు రావాలి. యాహ్వే ఏ వంశాన్ని ఎంపిక చేస్తాడో, ఆ వంశం కుటుంబాలవారీగా ముందుకు రావాలి. యాహ్వే ఏ కుటుంబాన్ని ఎంపిక చేస్తాడో, ఆ కుటుంబంలోని పురుషులు ఒక్కొక్కరుగా[b] ముందుకు రావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పట్టుకుంటాడో’ లేదా ‘స్వాధీనం చేసుకుంటాడో’ అని కూడా అనువదించవచ్చు. హెబ్రీ క్రియకు ఆ అర్థాలు ఉన్నాయి; ఇక్కడ అది యాహ్వే సూచించి గుర్తించే గోత్రం, వంశం లేదా కుటుంబాన్ని సూచిస్తుంది—బహుశా పవిత్ర చీటి ద్వారా.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘పురుషులవద్దకు’ అనే పదబంధం ఉంది; సందర్భంలో ఇది కుటుంబంలోని పురుషులను ఒక్కొక్కరిగా గుర్తించే చివరి దశను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם / יִקְרַב / תִּקְרַב
  choice: ముందుకు రావాలి
  rationale: קרב ఇక్కడ యాహ్వే సమక్షంలో గుర్తింపు కోసం క్రమపద్ధతిలో హాజరుకావడాన్ని సూచిస్తుంది. పదేపదే వచ్చే హెబ్రీ క్రియను తెలుగులో ఒకే సహజమైన పదబంధంతో నిలిపింది.
- source_word: לְשִׁבְטֵיכֶם
  choice: మీ గోత్రాలవారీగా
  rationale: לְ ఇక్కడ సమూహాల ప్రకారం క్రమంగా రావాలనే విభజనార్థాన్ని ఇస్తుంది; ‘గోత్రాలవారీగా’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִלְכְּדֶנּוּ / יִלְכְּדֶנָּה
  choice: ఎంపిక చేస్తాడో
  rationale: לכד సాధారణంగా ‘పట్టుకోవడం/స్వాధీనం చేసుకోవడం’ అని అర్థమిచ్చినా, ఇక్కడ దైవికంగా సూచించబడే గోత్రం, వంశం లేదా కుటుంబాన్ని గుర్తించే ప్రక్రియను సూచిస్తుంది. మూలపదంలోని బలమైన ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చింది.
- source_word: לַמִּשְׁפָּחוֹת
  choice: వంశాలవారీగా
  rationale: מִשְׁפָּחָה ఇక్కడ గోత్రం కంటే చిన్నది, కుటుంబం కంటే విస్తృతమైన వంశ సమూహాన్ని సూచిస్తుంది.
- source_word: לַבָּתִּים
  choice: కుటుంబాలవారీగా
  rationale: בַּיִת ఇక్కడ భవనాలను కాకుండా వంశంలోని గృహ లేదా కుటుంబ సమూహాలను సూచిస్తుంది.
- source_word: לַגְּבָרִים
  choice: ఒక్కొక్క పురుషుని చొప్పున
  rationale: గుర్తింపు ప్రక్రియ చివరికి కుటుంబంలోని వ్యక్తిగత పురుషుల స్థాయికి చేరుతుందనే పంపిణీ భావాన్నీ, మూలంలోని పుంలింగ సూచననూ నిలిపింది.
- source_word: וְהָיָה
  choice: క్రమానుసార వాక్య నిర్మాణంలో వ్యక్తీకరించబడింది
  rationale: హెబ్రీ సూత్రప్రాయ అనుసంధానాన్ని తెలుగులో ప్రతి దశను వరుస వాక్యాలుగా సహజంగా అమర్చడం ద్వారా వ్యక్తం చేసింది; అసహజమైన ‘అప్పుడు ఇలా జరుగుతుంది’ అనే పదబంధాన్ని నివారించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: వచనంలో వ్యక్తిగత దైవనామమే నేరుగా ఉంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించింది.
- issue: లాట్ లేదా ఎంపిక విధానం స్పష్టీకరణ
  choice: ప్రధాన పాఠంలో విధానాన్ని పేర్కొనలేదు
  alternative: ‘చీటి ద్వారా ఎంపిక చేస్తాడో’ అని విస్తరించడం
  rationale: సందర్భం పవిత్ర చీటి ద్వారా గుర్తింపును సూచించవచ్చుగానీ, ఈ వచనం ఆ విధానాన్ని ప్రత్యక్షంగా చెప్పదు. అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించింది. ‘గోత్రం—వంశం—కుటుంబం—ఒక్కొక్క పురుషుడు’ అనే క్రమంగా కుదుస్తూ వచ్చే నిర్మాణాన్ని, అలాగే ‘ముందుకు రావాలి’ అనే పునరావృతాన్ని నిలిపింది.
