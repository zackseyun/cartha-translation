  revised_text: అప్పుడు యెహోషువ జెరహు కుమారుడైన ఆకానును, వెండిని, ఆ పైవస్త్రాన్ని, నాలుక ఆకారంలో ఉన్న బంగారు ముక్కను[a], అతని కుమారులను, కుమార్తెలను, అతని ఎద్దును, గాడిదను, మందను, గుడారాన్ని, అతనికి చెందిన సమస్తాన్ని తీసుకున్నాడు. ఇశ్రాయేలీయులందరూ అతనితో ఉన్నారు. వారు వారందరినీ, ఆ వస్తువులన్నిటినీ ఆకోరు లోయకు తీసుకువెళ్లారు.[b]
