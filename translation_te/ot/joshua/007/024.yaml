source:
  edition: WLC
  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
translation:
  language: te
  text: అప్పుడు యెహోషువ జెరహు కుమారుడైన ఆకానును, వెండిని, ఆ పైవస్త్రాన్ని, నాలుక ఆకారంలో ఉన్న బంగారు ముక్కను[a], అతని కుమారులను, కుమార్తెలను, అతని ఎద్దును, గాడిదను, మందను, గుడారాన్ని, అతనికి చెందిన సమస్తాన్ని తీసుకున్నాడు. ఇశ్రాయేలీయులందరూ అతనితో ఉన్నారు. వారు వారందరినీ, ఆ వస్తువులన్నిటినీ ఆకోరు లోయకు తీసుకువెళ్లారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “బంగారు నాలుక”; అంటే నాలుక ఆకారంలో ఉన్న బంగారు ముక్క. సంప్రదాయంగా “చీలాకారపు బంగారు ముక్క” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: “ఆకోరు” అనే పేరు హీబ్రూలో “కష్టం” లేదా “విపత్తు” అనే భావమున్న పదాన్ని ధ్వనింపజేస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: అప్పుడు ... తీసుకున్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది. לקח కు సాధారణ అర్థమైన ‘తీసుకున్నాడు’నే ఉంచి, బలవంతాన్ని సూచించే అదనపు భావాన్ని చేర్చలేదు.
- source_word: עָכָן בֶּן זֶרַח
  choice: జెరహు కుమారుడైన ఆకాను
  rationale: పితృనామ సంబంధాన్ని నేరుగా, సహజమైన తెలుగు నిర్మాణంలో తెలిపింది.
- source_word: הַכֶּסֶף
  choice: వెండి
  rationale: כֶּסֶף ఇక్కడ మునుపు పేర్కొన్న దొంగిలించిన వెండిని సూచిస్తుంది; ‘డబ్బు’ అని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
- source_word: הָאַדֶּרֶת
  choice: పైవస్త్రం
  rationale: אַדֶּרֶת ప్రత్యేకమైన బయటి వస్త్రం లేదా అంగీని సూచిస్తుంది; ‘పైవస్త్రం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: לְשׁוֹן הַזָּהָב
  choice: నాలుక ఆకారంలో ఉన్న బంగారు ముక్క
  rationale: לָשׁוֹן అక్షరార్థంగా ‘నాలుక’; ఇక్కడ ఆకారాన్ని సూచిస్తుంది. ‘బంగారు కడ్డీ’ కంటే మూలభాష చిత్రణను స్పష్టంగా కాపాడుతుంది.
- source_word: בָּנָיו ... בְּנֹתָיו
  choice: అతని కుమారులను, కుమార్తెలను
  rationale: హీబ్రూ కుమారులు, కుమార్తెలు అని విడిగా పేర్కొంటుంది; ‘పిల్లలు’ అని సాధారణీకరించలేదు.
- source_word: שׁוֹרוֹ
  choice: అతని ఎద్దును
  rationale: ఏకవచన రూపాన్ని కాపాడుతూ שׁוֹר కు సాధారణ సమానార్థకాన్ని వాడింది.
- source_word: חֲמֹרוֹ
  choice: అతని గాడిదను
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: צֹאנוֹ
  choice: అతని మందను
  rationale: צֹאן గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచించే సమూహవాచకం; ‘మంద’ దాని విస్తృతిని నిలుపుతుంది.
- source_word: אָהֳלוֹ
  choice: అతని గుడారాన్ని
  rationale: మూలంలోని సాధారణ అర్థాన్ని విస్తరణ లేకుండా అందిస్తుంది.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: అతనికి చెందిన సమస్తాన్ని
  rationale: అతని ఆధీనంలోని ఆస్తి అంతటినీ సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: ఇశ్రాయేలీయులందరూ అతనితో ఉన్నారు
  rationale: ‘అతనితో’ అన్న ప్రత్యయం సందర్భానుసారం యెహోషువను సూచిస్తుంది. తెలుగులో సంభావ్య గందరగోళం ఉన్నప్పటికీ మూలంలోని సర్వనామ నిర్మాణాన్ని నిలిపి, కొత్త పేరును చేర్చలేదు.
- source_word: וַיַּעֲלוּ אֹתָם עֵמֶק עָכוֹר
  choice: వారు వారిని ఆకోరు లోయకు తీసుకువెళ్లారు
  rationale: ఆకోరు లోయ దిశగా సమూహాన్ని నడిపించడాన్ని సహజ తెలుగు కథనంగా వ్యక్తం చేసింది; బహువచన కర్మప్రత్యయం కుటుంబం, వస్తువులు సహా ముందున్న జాబితాను సూచిస్తుంది.
theological_decisions:
- issue: ఆకాను కుటుంబ సభ్యుల దోషం లేదా నిర్దోషిత్వాన్ని ఈ వచనంలో సూచించాలా
  choice: ‘అతని కుమారులను, కుమార్తెలను’ అని ఎలాంటి వివరణాత్మక అర్హత లేకుండా ఉంచడం
  alternative: వారు సహదోషులని లేదా కేవలం అక్కడికి తీసుకురాబడ్డారని సూచించే వివరణను చేర్చడం
  rationale: ఈ వచనం వారిని తీసుకెళ్లినవారిలో లెక్కిస్తుంది గాని వారి ప్రమేయాన్ని లేదా వారికి కలిగిన పరిణామాన్ని స్వయంగా వివరించదు. అందువల్ల వచనం చెప్పని తీర్పును అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా చదవగల కథనశైలి. పొడవైన హీబ్రూ జాబితిని తెలుగులో స్పష్టత కోసం రెండు ప్రధాన వాక్యాలుగా విభజించాం. వ్యక్తుల విషయంలో ‘వారిని’, వస్తువులతో కూడిన మొత్తం జాబితి విషయంలోనూ హీబ్రూ బహువచన కర్మను సహజంగా ప్రతిబింబించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
