- from: అప్పుడు యెహోషువ జెరహు కుమారుడైన ఆకానును, వెండిని, ఆ పైవస్త్రాన్ని, నాలుక ఆకారంలో ఉన్న బంగారు ముక్కను[a], అతని కుమారులను, కుమార్తెలను, ఎద్దును, గాడిదను, మందను, గుడారాన్ని, అతనికి చెందిన సమస్తాన్ని తీసుకున్నాడు. ఇశ్రాయేలీయులందరూ అతనితో ఉన్నారు. వారు వారిని ఆకోరు లోయకు తీసుకువెళ్లారు.[b]
  to: అప్పుడు యెహోషువ జెరహు కుమారుడైన ఆకానును, వెండిని, ఆ పైవస్త్రాన్ని, నాలుక ఆకారంలో ఉన్న బంగారు ముక్కను[a], అతని కుమారులను, కుమార్తెలను, అతని ఎద్దును, గాడిదను, మందను, గుడారాన్ని, అతనికి చెందిన సమస్తాన్ని తీసుకున్నాడు. ఇశ్రాయేలీయులందరూ అతనితో ఉన్నారు. వారు వారందరినీ, ఆ వస్తువులన్నిటినీ ఆకోరు లోయకు తీసుకువెళ్లారు.[b]
  rationale: చివరి కర్మలో మనుషులు, వస్తువులు రెండూ ఉన్నాయని స్పష్టపరచడానికి “వారందరినీ, ఆ వస్తువులన్నిటినీ” అని సవరించబడింది. ఇది మూలంలోని సమష్టి బహువచనాన్ని తెలుగులో సహజంగా వివరిస్తుంది; కుటుంబ సభ్యుల స్థితి లేదా దోషం గురించి ఎటువంటి వ్యాఖ్యానాన్ని చేర్చదు. బంగారు వస్తువుపై పాదసూచికను సంప్రదాయ “wedge” అనువాదానికి దగ్గరగా సవరించాం.
