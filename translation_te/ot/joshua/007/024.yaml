    rationale: אֹתָם అనేది ఆకాను, అతని కుటుంబ సభ్యులు, అలాగే జాబితాలోని వస్తువులన్నిటినీ సమష్టిగా సూచిస్తుంది. “వారిని” తెలుగులో ప్రధానంగా మనుషులకే వర్తించినట్లు వినిపిస్తుంది; కాబట్టి వస్తువులు కూడా తీసుకువెళ్లబడ్డాయనే అంశం అస్పష్టమవుతుంది.
