    issue: Footnote glosses the related Hebrew word with verbal expressions
    rationale: The audit trail identifies the relevant resemblance as ‘trouble’ or ‘disturbance’; noun glosses such as ‘ఇబ్బంది’ and ‘కలత’ better represent this lexical note.
  - severity: low
