id: JOS.7.26
reference: Joshua 7:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּקִ֨ימוּ עָלָ֜י/ו גַּל אֲבָנִ֣ים גָּד֗וֹל עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יָּ֥שָׁב יְהוָ֖ה מֵ/חֲר֣וֹן אַפּ֑/וֹ עַל כֵּ֠ן קָרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ עֵ֣מֶק עָכ֔וֹר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
translation:
  language: te
  text: వారు అతని మీద పెద్ద రాళ్లకుప్ప వేశారు; అది ఈనాటివరకు ఉంది. అప్పుడు యాహ్వే తన మండుతున్న కోపం నుండి వెనుదిరిగాడు. అందుకే ఆ స్థలాన్ని ఈనాటివరకు “ఆకోరు లోయ”[a] అని పిలుస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆకోరు” అనే పేరు, ‘ఇబ్బంది’ లేదా ‘కలత’ అనే అర్థమిచ్చే హీబ్రూ పదంలా వినిపిస్తుంది; యెహోషువ 7:25 చూడండి.
    reason: స్థలనామంలో ఉన్న హీబ్రూ పదప్రయోగం తెలుగులో ధ్వన్యంతరీకరణ ద్వారా కనిపించదు.
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו גַּל אֲבָנִים גָּדוֹל
  choice: వారు అతని మీద పెద్ద రాళ్లకుప్ప వేశారు
  rationale: హిఫిల్ రూపమైన וַיָּקִימוּ ఇక్కడ రాళ్లను పోగుచేసి కుప్ప వేయడాన్ని సూచిస్తుంది. ‘అతని మీద’ అనేది עָלָיוను నేరుగా నిలుపుతుంది; ‘పెద్ద రాళ్లకుప్ప’ గַל אֲבָנִים גָּדוֹל‌కు సహజమైన ఆధునిక తెలుగు.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: అది నేటివరకూ ఉంది / నేటివరకూ
  rationale: ఈ హీబ్రూ నుడికారం రచయిత కాలం వరకూ కొనసాగిన స్థితిని సూచిస్తుంది. తెలుగులో ‘నేటివరకూ కుప్ప వేశారు’ అంటే చర్య కొనసాగిందనే అపార్థం కలుగుతుంది కాబట్టి, మొదటి సందర్భంలో దాని కొనసాగిన ఉనికిని స్పష్టంగా చెప్పాం.
- source_word: וַיָּשָׁב יְהוָה
  choice: అప్పుడు యాహ్వే ... వెనుదిరిగాడు
  rationale: שׁוּב యొక్క ‘తిరుగు/వెనుదిరుగు’ రూపకాన్ని నిలిపి, దేవుని భావస్థితి గురించి మూలంలో లేని సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: מֵחֲרוֹן אַפּוֹ
  choice: మండుతున్న తన కోపం నుండి
  rationale: חֲרוֹן אַףలోని వేడి/మండుట అనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: స్థలనామానికి ముందు వచ్చే కారణసూచక సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: ఆ స్థలాన్ని ... అని పిలుస్తున్నారు
  rationale: హీబ్రూ నామకరణ సూత్రంలోని పేర్కొనని ఏకవచన కర్తను తెలుగులో సహజమైన అనిర్దిష్ట బహువచనంతో తెలిపి, עַד הַיּוֹם הַזֶּה సూచించే కొనసాగుతున్న పేరును నిలిపాం.
- source_word: עֵמֶק עָכוֹר
  choice: ఆకోరు లోయ
  rationale: స్థలనామాన్ని అనువదించి ‘కష్టాల లోయ’గా మార్చకుండా ధ్వన్యంతరీకరించాం; עכרతో ఉన్న పదప్రయోగాన్ని పాదసూచికలో వివరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ధ్వన్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: מֵחֲרוֹן אַפּוֹలో దైవకోప వర్ణన
  choice: మండుతున్న తన కోపం నుండి వెనుదిరిగాడు
  alternative: తన తీవ్రమైన కోపాన్ని విడిచిపెట్టాడు
  rationale: మూలంలోని ‘మండుట’ మరియు ‘వెనుదిరుగుట’ రూపకాలను నిలిపి, దేవుని కోపం గురించి పాఠ్యంలో లేని సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వచనం. ‘నేటివరకూ’ అనే నుడికారాన్ని సహజంగా చేయడానికి మొదటి సందర్భంలో కుప్ప కొనసాగి ఉన్నదని స్పష్టీకరించాం; రెండవ సందర్భంలో కొనసాగుతున్న పిలుపు రూపాన్ని వాడాం. పాదసూచిక గుర్తు సంబంధిత ‘ఆకోరు’ పేరువద్ద ఉంచాం.
