revisions:
- from: యెహోషువ తెల్లవారగానే లేచి, ఇశ్రాయేలును దాని గోత్రాలవారీగా ముందుకు రప్పించాడు. అప్పుడు యూదా గోత్రం పట్టుబడింది[a].
  to: యెహోషువ తెల్లవారగానే లేచి, ఇశ్రాయేలును దాని గోత్రాలవారీగా ముందుకు రప్పించాడు. అప్పుడు యూదా గోత్రం ఎంపిక చేయబడింది[a].
