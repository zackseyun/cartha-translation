source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֤ם יְהוֹשֻׁ֨עַ֙ בַּ/בֹּ֔קֶר וַ/יַּקְרֵ֥ב אֶת יִשְׂרָאֵ֖ל לִ/שְׁבָטָ֑י/ו וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/016.yaml
  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
translation:
  language: te
  text: యెహోషువ తెల్లవారగానే లేచి, ఇశ్రాయేలును దాని గోత్రాలవారీగా ముందుకు రప్పించాడు. అప్పుడు యూదా గోత్రం ఎంపిక చేయబడింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘యూదా గోత్రం తీసుకోబడింది.’ ఇది ఎంపిక ప్రక్రియలో ప్రత్యేకంగా గుర్తించబడడాన్ని సూచించే నుడికారం; విధానాన్ని ఈ వచనం స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: తెల్లవారగానే లేచి
  rationale: שׁכם హిఫిల్ రూపం పెందలకడనే లేవడాన్ని సూచిస్తుంది; בַּבֹּקֶרతో కలిపి కాలప్రాధాన్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּקְרֵב
  choice: ముందుకు రప్పించాడు
  rationale: קרב హిఫిల్‌కు ‘దగ్గరకు తీసుకురావడం/ముందుకు రప్పించడం’ అనే భావం ఉంది. ఎంపిక ప్రక్రియ సందర్భంలో ‘ముందుకు రప్పించాడు’ సహజంగా ఉండి, కేవలం ‘సమర్పించాడు’ అనే అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: ఇక్కడ నిబంధన ప్రజలను సమష్టిగా సూచించే ‘ఇశ్రాయేలు’ అనే మూలపద రూపాన్ని నిలుపుతుంది.
- source_word: לִשְׁבָטָיו
  choice: దాని గోత్రాలవారీగా
  rationale: לְ ఇక్కడ గోత్ర విభాగాల ప్రకారం వరుసగా ముందుకు తేవడాన్ని సూచిస్తుంది; ‘గోత్రాలవారీగా’ ఆ పంపిణీ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וַיִּלָּכֵד
  choice: పట్టుబడింది
  rationale: לכד నిఫాల్ యొక్క మూలరూపకమైన ‘పట్టబడింది’ అనే భావాన్ని నిలుపుతూ, ఈ పవిత్ర ఎంపిక ప్రక్రియలో ‘గుర్తించబడింది’ అనే సందర్భార్థాన్ని వెంటనే పరిష్కరించకుండా ఉంచుతుంది.
- source_word: שֵׁבֶט יְהוּדָה
  choice: యూదా గోత్రం
  rationale: హీబ్రూ సమాస సంబంధానికి సూటిగా, ప్రామాణిక తెలుగులో సహజమైన రూపం.
theological_decisions:
- issue: וַיִּלָּכֵד సూచించే ఎంపిక ప్రక్రియ స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘పట్టుబడింది’ అనే రూపక నిష్క్రియను నిలుపడం
  alternative: ‘ఎంపికైంది’, ‘చీట్ల ద్వారా ఎంపికైంది’, లేదా ‘గుర్తించబడింది’
  rationale: ఈ వాక్యభాగం ప్రక్రియను ‘చీట్ల ద్వారా’ గానీ ‘యెహోవా చేత’ గానీ స్పష్టంగా చెప్పదు. హీబ్రూ నుడికారాన్ని నిలిపి, లేని వివరాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ఉండటం మూలపాఠ్యంలోని అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథన శైలి, అయితే ‘పట్టుబడింది’ అనే హీబ్రూ నుడికారాన్ని వివరణాత్మక పాదటిప్పణితో నిలిపింది.
