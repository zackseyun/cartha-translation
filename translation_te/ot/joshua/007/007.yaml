- from: 'అప్పుడు యెహోషువ ఇలా అన్నాడు: “అయ్యో, ప్రభువైన యెహోవా[a], ఈ ప్రజలను యొర్దాను నది దాటించి, అమోరీయుల చేతికి అప్పగించి మమ్మల్ని నాశనం చేయడానికే ఇక్కడికి తీసుకొచ్చావా? మేము యొర్దాను అవతలే ఉండిపోవడానికి ఒప్పుకుని ఉంటే ఎంత బాగుండేది!”'
  to: 'అప్పుడు యెహోషువ ఇలా అన్నాడు: “అయ్యో, ప్రభువైన యెహోవా[a], మమ్మల్ని అమోరీయుల చేతికి అప్పగించి నాశనం చేయడానికే ఎందుకని అసలు ఈ ప్రజలను యొర్దాను దాటింపజేశావు? మేము యొర్దాను అవతలే నివసించడానికి ఒప్పుకుని ఉంటే ఎంత బాగుండేది!”'
  rationale: The revision removes the unwarranted ‘here,’ restores the source’s explicit causative crossing of the Jordan, preserves the distinction between ‘this people’ and ‘us,’ and reflects the lament’s emphatic question in natural modern Telugu. The footnote remains correctly anchored and explanatory.
