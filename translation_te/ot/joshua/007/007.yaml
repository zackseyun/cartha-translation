id: JOS.7.7
reference: Joshua 7:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
translation:
  language: te
  text: 'అప్పుడు యెహోషువ ఇలా అన్నాడు: “అయ్యో, ప్రభువైన యెహోవా[a], మమ్మల్ని అమోరీయుల చేతికి అప్పగించి నాశనం చేయడానికే ఎందుకని అసలు ఈ ప్రజలను యొర్దాను దాటింపజేశావు? మేము యొర్దాను అవతలే నివసించడానికి ఒప్పుకుని ఉంటే ఎంత బాగుండేది!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయులో “అదోనాయ్ యెహోవా”; ఇది ప్రభువు అనే బిరుదుతో యెహోవా అనే దైవ నామాన్ని కలిపిన సంబోధన.
    reason: మూలంలోని సంయుక్త దైవ సంబోధనను స్పష్టం చేయడం.
lexical_decisions:
- source_word: אֲהָהּ
  choice: అయ్యో
  rationale: వేదనను, దిగ్భ్రాంతిని వ్యక్తపరిచే ఆకస్మిక విలాపోక్తికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אֲדֹנָי יְהוִה
  choice: ప్రభువైన యెహోవా
  rationale: אֲדֹנָי అనే అధిపత్య బిరుదును, יהוה అనే దైవ నామాన్ని రెండింటినీ పునరుక్తి లేకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: הֵעֲבַרְתָּ הַעֲבִיר
  choice: దాటించి ... తీసుకొచ్చావా?
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే తీవ్రతను ప్రశ్న యొక్క సందర్భం, ‘చేయడానికే’ అనే దృష్టిపాతం ద్వారా సహజ తెలుగులో వ్యక్తపరుస్తుంది; యొర్దాను దాటింపజేసిన భావం స్పష్టంగా ఉంటుంది.
- source_word: אֶת־הָעָם הַזֶּה
  choice: ఈ ప్రజలను
  rationale: עָם యొక్క సమూహార్థాన్ని సహజమైన తెలుగు బహువచన ప్రయోగంతో అందిస్తుంది.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: అమోరీయుల చేతికి అప్పగించి
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హెబ్రీయ రూపకంలోని అధికారానికి అప్పగించే భావాన్ని తెలుగు బైబిలు శైలిలో సహజంగా నిలుపుతుంది.
- source_word: לְהַאֲבִידֵנוּ
  choice: మమ్మల్ని నాశనం చేయడానికి
  rationale: పూర్తిగా నశింపజేయడం అనే గంభీరమైన భావాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וְלוּ
  choice: ఎంత బాగుండేది
  rationale: జరిగిపోని ప్రత్యామ్నాయాన్ని కోరుకునే ఆవేదనభరిత ఆశను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הוֹאַלְנוּ
  choice: ఒప్పుకుని ఉంటే
  rationale: సంతృప్తి అనే అదనపు భావాన్ని చేర్చకుండా, సమ్మతి లేదా సంకల్పం అనే క్రియ యొక్క సంకల్పార్థాన్ని నిలుపుతుంది.
- source_word: וַנֵּשֶׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతలే ఉండిపోవడానికి
  rationale: యొర్దాను తూర్పు వైపున స్థిరంగా మిగిలిపోవాలనే సందర్భార్థాన్ని ‘అవతలే ఉండిపోవడం’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אֲדֹנָי יְהוִה అనే సంయుక్త దైవ సంబోధన
  choice: ప్రభువైన యెహోవా
  alternative: ప్రభువైన దేవా / నా ప్రభువా, యెహోవా
  rationale: మూలంలోని అధిపత్య బిరుదునూ దైవ నామాన్నీ విడిచిపెట్టకుండా, తెలుగు వాక్య నిర్మాణంలో సహజంగా అందిస్తుంది; ‘నా’ అనే భావం మసొరెటిక్ పఠనంలో స్పష్టంగా లేకపోవడంతో దాన్ని చేర్చలేదు.
- issue: యెహోషువ ప్రశ్నలో దేవుని ఉద్దేశంపై వ్యక్తమైన తీవ్ర ఆవేదన
  choice: మమ్మల్ని నాశనం చేయడానికే ఇక్కడికి తీసుకొచ్చావా?
  alternative: మమ్మల్ని నాశనం చేయడానికి అమోరీయుల చేతికి అప్పగించేందుకే దాటించావా?
  rationale: వక్త పలికిన కఠినమైన ప్రశ్నను మృదువుచేయకుండా నిలుపుతుంది; అయితే అది కథకుని ధార్మిక తీర్పు కాక, యెహోషువ విలాపంగా ఉద్ధరణ చిహ్నాల్లోనే ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకుడికి సులభంగా అర్థమయ్యే విలాప శైలి. ‘యొర్దాను’, ‘అమోరీయులు’, ‘యెహోవా’ వంటి స్థిరమైన బైబిలు నామరూపాలు వాడబడ్డాయి. మూలంలోని భావోద్వేగ తీవ్రతను తగ్గించకుండా, పదపదానువాదపు అసహజతను నివారించాం.
