  revision_rationale: The revision removes the unwarranted ‘here,’ restores the source’s explicit causative crossing of the Jordan, preserves the distinction between ‘this people’ and ‘us,’ and reflects the lament’s emphatic question in natural modern Telugu. The footnote remains correctly anchored and explanatory.
