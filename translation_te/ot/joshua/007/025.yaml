  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ מֶ֣ה עֲכַרְתָּ֔/נוּ יַעְכֳּרְ/ךָ֥ יְהוָ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּרְגְּמ֨וּ אֹת֤/וֹ כָל יִשְׂרָאֵל֙ אֶ֔בֶן וַ/יִּשְׂרְפ֤וּ אֹתָ/ם֙ בָּ/אֵ֔שׁ וַ/יִּסְקְל֥וּ אֹתָ֖/ם בָּ/אֲבָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
translation:
  language: te
  text: అప్పుడు యెహోషువ, “నీవు మాకు ఎందుకు ఆపద తెచ్చావు? యాహ్వే ఈ రోజున నీకు ఆపద తెస్తాడు” అన్నాడు.[a] ఇశ్రాయేలీయులందరూ అతనిని రాళ్లతో కొట్టారు.[b] తరువాత వారిని అగ్నితో కాల్చి, రాళ్లతో కొట్టారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆపద తెచ్చావు … ఆపద తెస్తాడు”—హీబ్రూలో ఈ రెండు చోట్లా ఒకే క్రియ వాడబడింది; అందువల్ల పదప్రయోగం నిలుపబడింది.
    reason: lexical_alternative
  - marker: b
    text: ఈ వచనంలో రాళ్లతో కొట్టడాన్ని సూచించే రెండు వేర్వేరు హీబ్రూ క్రియలు ఉన్నాయి; తెలుగులో రెండింటినీ సహజంగా ఒకే విధంగా అనువదించారు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పాఠ్యం మొదట ‘అతనిని’ అని ఏకవచనంలో చెప్పి, తరువాత ‘వారిని’ అని బహువచనానికి మారుతుంది. అది ఆకానుతో పాటు మరికొందరినో, అతని ఇంటివారినో లేదా ఆస్తులనో కలుపవచ్చు; అనువాదం ఈ మార్పును పరిష్కరించకుండా అలాగే ఉంచింది.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכָּרְךָ
  choice: మమ్మల్ని కష్టానికి గురిచేశావు / నిన్ను కష్టానికి గురిచేస్తాడు
  rationale: עכר అనే ఒకే క్రియ రెండుసార్లు వాడబడిన పరస్పర పదప్రయోగాన్ని తెలుగులో ఒకే సహజమైన పదబంధంతో నిలిపింది; అది కలిగించిన కష్టం లేదా విపత్తు భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- source_word: בַּיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: హీబ్రూ పదబంధంలోని తక్షణతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיִּרְגְּמוּ אֹתוֹ ... אֶבֶן
  choice: అతన్ని రాళ్లతో కొట్టారు
  rationale: רגם ఇక్కడ రాళ్లతో శిక్ష అమలు చేయడాన్ని సూచిస్తుంది. తెలుగు వాక్యం సాధనమైన రాళ్లను స్పష్టంగా ఉంచుతూ సహజంగా ఉంటుంది.
- source_word: וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ
  choice: వారు వారిని అగ్నితో కాల్చి
  rationale: మూలంలోని బహువచన కర్మను, అలాగే అగ్ని అనే స్పష్టమైన సాధనాన్ని నిలిపింది.
- source_word: וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים
  choice: రాళ్లతో కొట్టారు
  rationale: סקל కూడా రాళ్లతో కొట్టడాన్ని సూచిస్తుంది. ముందున్న רגםతో ఉన్న హీబ్రూ క్రియాభేదాన్ని సహజమైన తెలుగులో బలవంతంగా సృష్టించకుండా పాదటిప్పణిలో తెలిపింది.
theological_decisions:
- issue: ఆకాను గురించిన ఏకవచనం తరువాత బహువచనానికి మారడం
  choice: మూలంలోని ‘అతన్ని’ నుండి ‘వారిని’ అనే మార్పును ప్రధాన పాఠ్యంలో నిలిపివేయడం
  alternative: అన్ని సర్వనామాలను ఆకానును మాత్రమే సూచించే ఏకవచనంగా సమన్వయించడం; లేదా బహువచనం అతని ఆస్తులను మాత్రమే సూచిస్తుందని వ్యాఖ్యానించడం
  rationale: మసొరెటిక్ పాఠ్యం స్పష్టంగా ఏకవచనం నుండి బహువచనానికి మారుతుంది. సందర్భంలో ఆకాను కుటుంబం, ఆస్తులు ఉన్నప్పటికీ, బహువచనం ఎవరిని లేదా వేటిని కలుపుతుందో అనువాదం తేల్చకుండా మూలంలోని ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. హీబ్రూ పదప్రయోగం మరియు ఏకవచన-బహువచన మార్పు నిలుపబడ్డాయి. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
