- from: నిషిద్ధంగా అర్పించబడిన వస్తువుతో పాటు పట్టుబడినవాడు అగ్నితో కాల్చబడాలి[a]—అతడూ, అతనికి చెందినదంతా. ఎందుకంటే అతడు యెహోవా నిబంధనను ఉల్లంఘించాడు; ఇశ్రాయేలులో ఘోరమైన పని చేశాడు.
