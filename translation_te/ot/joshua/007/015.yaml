source:
  edition: WLC
  text: וְ/הָיָה֙ הַ/נִּלְכָּ֣ד בַּ/חֵ֔רֶם יִשָּׂרֵ֣ף בָּ/אֵ֔שׁ אֹת֖/וֹ וְ/אֶת כָּל אֲשֶׁר ל֑/וֹ כִּ֤י עָבַר֙ אֶת בְּרִ֣ית יְהוָ֔ה וְ/כִֽי עָשָׂ֥ה נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
translation:
  language: te
  text: నాశనానికి అంకితపరచబడిన వస్తువుతో పట్టుబడినవానిని, అతనికి చెందినదంతటినీ అగ్నితో కాల్చాలి[a]. ఎందుకంటే అతడు యెహోవా నిబంధనను ఉల్లంఘించాడు, ఇశ్రాయేలులో ఘోరమైన పని చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా, “శాపగ్రస్తమైన వస్తువు.” హీబ్రూ חֵרֶם (ఖేరెమ్) దేవునికి ప్రత్యేకంగా అంకితపరచబడి, సాధారణ వినియోగం నుంచి తొలగించబడి, నాశనానికి నియమించబడిన దానిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּלְכָּד
  choice: పట్టుబడినవాడు
  rationale: לכד ధాతువు నిష్క్రియ కృదంతం; ఇక్కడ యుద్ధంలో బందీ కావడం కాక, చీట్ల ద్వారా దోషిగా గుర్తించబడడాన్ని సూచిస్తుంది. ‘పట్టుబడినవాడు’ సహజంగా ఉండి ఆ న్యాయసందర్భాన్ని నిలుపుతుంది.
- source_word: בַּחֵרֶם
  choice: నిషిద్ధంగా అర్పించబడిన వస్తువుతో పాటు
  rationale: חֵרֶם అనేది దేవునికి ప్రత్యేకంగా అర్పించబడి, సాధారణ వినియోగం నుంచి నిషేధించబడి, తరచుగా నాశనానికి నియమించబడినదాన్ని సూచిస్తుంది. ఈ అనువాదం అర్పణ భావాన్నీ నిషేధ భావాన్నీ కలిపి తెలియజేస్తుంది; בְּ సూచించే సంబంధాన్ని ‘తో పాటు’ వ్యక్తం చేస్తుంది.
- source_word: יִשָּׂרֵף בָּאֵשׁ
  choice: అగ్నితో కాల్చబడాలి
  rationale: నిఫాల్ అసంపూర్ణ క్రియతో కూడిన సాధనార్థక పదబంధాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: అతడూ, అతనికి చెందినదంతా
  rationale: దోషితోపాటు అతనికి చెందిన సమస్తం తీర్పులో చేర్చబడిందని తెలిపే విస్తృతమైన, సహజమైన ప్రయోగం; సందర్భం నిర్దిష్టం చేయని పరిధిని కుదించదు.
- source_word: עָבַר אֶת בְּרִית יְהוָה
  choice: యెహోవా నిబంధనను ఉల్లంఘించాడు
  rationale: నిబంధన విధించిన హద్దును అతిక్రమించడం అనే עבר యొక్క న్యాయ-నిబంధన బలాన్ని ‘ఉల్లంఘించాడు’ స్పష్టంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’గా అందిస్తుంది.
- source_word: נְבָלָה
  choice: ఘోరమైన పని
  rationale: ఇది సాధారణ మూర్ఖత్వం కాక, సమాజంలో నైతిక దిగ్భ్రాంతి కలిగించే నీచమైన లేదా అవమానకరమైన చర్యను సూచిస్తుంది. ‘ఘోరమైన పని’ ఆ నైతిక తీవ్రతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: בְּ ఇక్కడ స్థలార్థకంగా, నిబంధన సమాజం మధ్య జరిగిన అపరాధాన్ని సూచిస్తుంది.
theological_decisions:
- issue: నిబంధన-తీర్పు సందర్భంలో חֵרֶם అనువాదం
  choice: నిషిద్ధంగా అర్పించబడిన వస్తువు
  alternative: శాపగ్రస్తమైన వస్తువు; నాశనానికి అర్పించబడినది
  rationale: ఈ పదం దైవ నిషేధం కింద ఉంచబడి దేవునికి ప్రత్యేకపరచబడినదాన్ని, తరచుగా నాశనానికి నిర్ణయించబడినదాన్ని సూచిస్తుంది. ఎంచుకున్న రూపం దాని అర్పణ స్థితినీ సాధారణ వినియోగంపై నిషేధాన్నీ నిలుపుతుంది; సంప్రదాయ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచడం.
- issue: అతనికి చెందినదంతా అనే పదబంధపు పరిధి
  choice: పరిధిని సాధారణంగానే ఉంచడం
  alternative: ఆస్తులకే పరిమితం చేయడం; కుటుంబ సభ్యులను స్పష్టంగా చేర్చడం
  rationale: మూలంలోని כָּל אֲשֶׁר לוֹ విస్తృతమైనది; ఈ వాక్యం మాత్రమే దాని పరిధిని ఖచ్చితంగా నిర్వచించదు. అందువల్ల అనువాదం ఆ అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన న్యాయ-నిబంధన స్వరం. వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా విభజించబడింది. ‘అతనికి చెందినదంతా’ అనే మూలంలోని విస్తృతతను వివరణాత్మకంగా కుదించలేదు.
