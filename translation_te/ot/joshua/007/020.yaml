  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֧עַן עָכָ֛ן אֶת יְהוֹשֻׁ֖עַ וַ/יֹּאמַ֑ר אָמְנָ֗ה אָנֹכִ֤י חָטָ֨אתִי֙ לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כָ/זֹ֥את וְ/כָ/זֹ֖את עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
translation:
  language: te
  text: 'ఆకాను యెహోషువకు జవాబిచ్చి ఇలా అన్నాడు: “నిజమే, నేను ఇశ్రాయేలు దేవుడైన యెహోవాకు విరోధంగా పాపం చేశాను. నేను చేసినది ఇదే[a]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇలాగూ అలాగూ చేశాను.” ఈ హీబ్రూ నుడికారం తాను చేసినదాని వివరాలను పరిచయం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ సంభాషణ సూత్రంలో రెండు క్రియలు ఉన్నా, ఆధునిక తెలుగులో ‘జవాబిచ్చాడు’ మాటల ఆరంభాన్ని సహజంగా తెలియజేస్తుంది; ‘జవాబిచ్చి అన్నాడు’ అనవసర పునరుక్తిగా వినిపిస్తుంది.
- source_word: עָכָן
  choice: ఆకాను
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: אָמְנָה
  choice: నిజమే
  rationale: అంగీకారం మరియు గంభీరమైన ధృవీకరణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אָנֹכִי חָטָאתִי
  choice: నేను ... పాపం చేశాను
  rationale: స్వతంత్ర సర్వనామంలోని స్వల్ప ఉద్ఘాటనను ‘నేను’ నిలుపుతుంది; సంపూర్ణ క్రియను ఒప్పుకోలు సందర్భంలో సహజమైన భూతకాలంతో అనువదించాం.
- source_word: לַיהוָה
  choice: యెహోవాకు విరోధంగా
  rationale: חטא తో వచ్చిన לְ అపరాధానికి గురైన వ్యక్తిని సూచిస్తుంది; ‘విరోధంగా పాపం చేశాను’ తెలుగులో ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది. יהוה అనే దైవనామాన్ని ‘యెహోవా’గా ఉంచాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ వాక్యాంశంగా అందిస్తుంది.
- source_word: וְכָזֹאת וְכָזֹאת עָשִׂיתִי
  choice: నేను చేసినది ఇదే
  rationale: ఇది తరువాతి వచనంలో వచ్చే వివరాలను పరిచయం చేసే హీబ్రూ నుడికారం. పదక్షర రూపం తెలుగులో అసహజంగా ఉండటం వల్ల దాని ప్రసంగ కార్యాన్ని సహజంగా తెలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యేక దైవనామం నేరుగా ఉంది; దానిని సాధారణ బిరుదుతో మార్చకుండా తెలుగు సంప్రదాయంలో సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలిపాం.
- issue: חטא ל־ యొక్క సంబంధం
  choice: యెహోవాకు విరోధంగా పాపం చేశాను
  alternative: యెహోవాకు పాపం చేశాను
  rationale: ఇక్కడ לְ అపరాధానికి గురైన దేవుణ్ణి సూచిస్తుంది. ‘విరోధంగా’ అనే పదం తెలుగులో ఆ భావాన్ని అపార్థం లేకుండా వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఒప్పుకోలు ధోరణిని నిలిపాం. మాటల ప్రవాహం సహజంగా ఉండేలా హీబ్రూ సంభాషణ సూత్రాన్ని సంక్షిప్తం చేశాం; తదుపరి వచనంలో వివరాలు వస్తాయని సూచించేందుకు చివరలో ద్విబిందువు ఉంచాం.
