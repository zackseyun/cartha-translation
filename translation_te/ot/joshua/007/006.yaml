source:
  edition: WLC
  text: וַ/יִּקְרַ֨ע יְהוֹשֻׁ֜עַ שִׂמְלֹתָ֗י/ו וַ/יִּפֹּל֩ עַל פָּנָ֨י/ו אַ֜רְצָ/ה לִ/פְנֵ֨י אֲר֤וֹן יְהוָה֙ עַד הָ/עֶ֔רֶב ה֖וּא וְ/זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲל֥וּ עָפָ֖ר עַל רֹאשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
translation:
  language: te
  text: అప్పుడు యెహోషువ తన బట్టలు చింపుకొని, ఇశ్రాయేలు పెద్దలతో కలిసి యాహ్వే మందసం ఎదుట నేలమీద ముఖం మోపి సాయంత్రం వరకు పడి ఉన్నాడు. వారందరూ తమ తలల మీద దుమ్ము పోసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: తల మీద దుమ్ము పోసుకోవడం శోకం, అవమానం లేదా దుఃఖాన్ని వ్యక్తం చేసే ఆచారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרַע שִׂמְלֹתָיו
  choice: తన బట్టలు చింపుకొని
  rationale: శోకం లేదా తీవ్ర వేదన సందర్భంలో వస్త్రాలు చింపుకోవడాన్ని సూచించే స్పష్టమైన, సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וַיִּפֹּל עַל־פָּנָיו אַרְצָה
  choice: నేలమీద ముఖం మోపి పడ్డాడు
  rationale: ముఖం నేలకు ఉండేలా సాగిలపడిన శరీర భంగిమను స్పష్టంగా తెలియజేస్తుంది; కేవలం భావార్థాన్ని చెప్పకుండా హీబ్రూ వాక్యంలోని భౌతిక చిత్రాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: యాహ్వే మందసం ఎదుట
  rationale: לִפְנֵי అనే పదంలోని ‘ఎదుట/సన్నిధిలో’ భావాన్ని, אֲרוֹן అనే మందసాన్ని, అలాగే దైవనామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: עַד הָעֶרֶב
  choice: సాయంత్రం వరకు
  rationale: కాలపరిమితిని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: అతడూ ఇశ్రాయేలు పెద్దలూ
  rationale: యెహోషువతో పాటు ఇశ్రాయేలు పెద్దలు కూడా ఈ శోకక్రియలో పాల్గొన్నారని స్పష్టపరుస్తుంది. ముందున్న ఏకవచన క్రియను చెరపకుండా, వారు సాయంత్రం వరకు అలాగే ఉన్నారని వాక్య నిర్మాణం తెలియజేస్తుంది.
- source_word: וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם
  choice: తమ తలల మీద దుమ్ము పోసుకున్నారు
  rationale: హీబ్రూ నుడికారంలోని శోకసూచక చర్యను సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణగా నిలిపింది.
- issue: యెహోషువతో పాటు పెద్దలు ఏ చర్యలో భాగస్వాములయ్యారనే వాక్యనిర్మాణం
  choice: అతడూ పెద్దలూ సాయంత్రం వరకు అలాగే ఉన్నారని తెలపడం
  alternative: ఏకవచన క్రియను బహువచనంగా మార్చి వారందరూ సాగిలపడ్డారని నేరుగా చెప్పడం
  rationale: హీబ్రూలో ముందుగా యెహోషువను ఉద్దేశించిన ఏకవచన క్రియ వచ్చి, తరువాత ‘అతడూ ఇశ్రాయేలు పెద్దలూ’ అని ఉంది. అందువల్ల పెద్దల భాగస్వామ్యాన్ని చూపుతూ మూలంలోని వ్యాకరణ ఉద్రిక్తతను పూర్తిగా చెరపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మందసం’ బైబిలు సందర్భానికి తగిన స్పష్టమైన పదంగా, ‘బట్టలు’ సహజ ఆధునిక పదంగా వాడబడ్డాయి.
