revisions:
- from: అప్పుడు యెహోషువ తన బట్టలు చింపుకొని, యాహ్వే మందసం ఎదుట నేలమీద ముఖం మోపి పడ్డాడు. అతడూ ఇశ్రాయేలు పెద్దలూ సాయంత్రం వరకు అలాగే ఉండి, తమ తలల మీద దుమ్ము పోసుకున్నారు.[a]
  to: అప్పుడు యెహోషువ తన బట్టలు చింపుకొని, ఇశ్రాయేలు పెద్దలతో కలిసి యాహ్వే మందసం ఎదుట నేలమీద ముఖం మోపి సాయంత్రం వరకు పడి ఉన్నాడు. వారందరూ తమ తలల మీద దుమ్ము పోసుకున్నారు.[a]
  rationale: The revision preserves every action and temporal element in the Hebrew while clarifying that the elders joined Joshua in his prostration. ‘వారందరూ’ then naturally identifies Joshua and the elders as those who put dust on their heads. The footnote remains correctly anchored to that mourning gesture.
