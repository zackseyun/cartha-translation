  text: וַ/יִּשְׁלַח֩ יְהוֹשֻׁ֨עַ אֲנָשִׁ֜ים מִֽ/ירִיח֗וֹ הָ/עַ֞י אֲשֶׁ֨ר עִם בֵּ֥ית אָ֨וֶן֙ מִ/קֶּ֣דֶם לְ/בֵֽית אֵ֔ל וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ לֵ/אמֹ֔ר עֲל֖וּ וְ/רַגְּל֣וּ אֶת הָ/אָ֑רֶץ וַֽ/יַּעֲלוּ֙ הָ/אֲנָשִׁ֔ים וַֽ/יְרַגְּל֖וּ אֶת הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
translation:
  language: te
  text: యెహోషువ యెరికో నుండి కొందరు మనుషులను బేతావెను సమీపంలో[a], బేతేలుకు తూర్పున ఉన్న హాయికి పంపాడు. వారితో, “మీరు పైకి వెళ్లి ఆ దేశాన్ని వేగు చూడండి” అని చెప్పాడు. ఆ మనుషులు పైకి వెళ్లి హాయిని వేగు చూశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సమీపంలో” అని అనువదించిన హీబ్రూ మాటకు అక్షరార్థం “తో”; భౌగోళిక వర్ణనలో అది “పక్కన” లేదా “సమీపంలో” అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపి
  rationale: שלח అనే క్రియకు సహజమైన కథన తెలుగు సమానార్థకం; తరువాతి ప్రధాన క్రియతో వాక్యాన్ని సులభంగా అనుసంధానిస్తుంది.
- source_word: אֲנָשִׁים
  choice: కొందరు మనుషులను
  rationale: హీబ్రూ పురుష బహువచనాన్ని స్పష్టంగా నిలుపుతూ, తెలుగులో సహజంగా అనిశ్చిత బృందాన్ని సూచిస్తుంది.
- source_word: מִירִיחוֹ
  choice: యెరికో నుండి
  rationale: మూలంలోని מן విభక్తి సూచించే బయలుదేరిన స్థలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הָעַי
  choice: హాయి పట్టణం
  rationale: స్థలనామాన్ని తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించి, సాధారణ పాఠకునికి అది పట్టణమని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  choice: బేతావెనుకు సమీపంలో
  rationale: עִם అక్షరార్థంగా ‘తో’ అయినప్పటికీ, ఇక్కడ భౌగోళిక సామీప్యాన్ని సూచిస్తుంది; అసలు అస్పష్టతను పాదసూచికలో తెలియజేస్తుంది.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: బేతేలుకు తూర్పున
  rationale: భౌగోళిక సంబంధాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో తెలుపుతుంది.
- source_word: עֲלוּ
  choice: వెళ్లి
  rationale: עלה లో ఉన్న ఎత్తైన ప్రదేశానికి కదలిక భావం సందర్భంలో ఉండవచ్చు; అయితే ఆధునిక తెలుగులో ‘పైకి వెళ్లండి’ అసహజంగా లేదా తప్పుదారి పట్టించేలా ఉండే అవకాశం వల్ల సహజ దిశాక్రియను ఎంచుకున్నాం.
- source_word: וְרַגְּלוּ
  choice: వేగు చూడండి
  rationale: רגל పియేల్ రూపంలోని సైనిక గూఢచర్యం లేదా పరిశీలన భావాన్ని గౌరవప్రదమైన, సులభంగా అర్థమయ్యే తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶת הָאָרֶץ
  choice: ఆ ప్రాంతాన్ని
  rationale: ఇక్కడ אָרֶץ విస్తృత ‘దేశం’ కంటే పరిశీలించాల్సిన స్థానిక భూభాగాన్ని సూచిస్తుంది; ‘ప్రాంతం’ సందర్భానుగుణంగా సహజం.
- source_word: וַיַּעֲלוּ
  choice: వెళ్లి
  rationale: ఆజ్ఞలోని עלה క్రియతో కథన ప్రతిధ్వనిని నిలుపుతూ సహజ తెలుగు క్రమాన్ని ఇస్తుంది.
- source_word: וַיְרַגְּלוּ
  choice: వేగు చూశారు
  rationale: ముందటి ఆజ్ఞలో వాడిన పదబంధంతో పదసామ్యాన్ని నిలుపుతుంది.
