reference: Joshua 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יִשְׁמְע֣וּ הַֽ/כְּנַעֲנִ֗י וְ/כֹל֙ יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נָסַ֣בּוּ עָלֵ֔י/נוּ וְ/הִכְרִ֥יתוּ אֶת שְׁמֵ֖/נוּ מִן הָ/אָ֑רֶץ וּ/מַֽה תַּעֲשֵׂ֖ה לְ/שִׁמְ/ךָ֥ הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
translation:
  language: te
  text: కనానీయులు, దేశంలోని నివాసులందరూ ఇది వింటారు; వారు మనలను చుట్టుముట్టి, భూమి మీద నుండి మన పేరును తుడిచివేస్తారు.[a] నీ గొప్ప పేరు కోసం నీవు ఏమి చేస్తావు?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘భూమి మీద నుండి మన పేరును తుడిచివేస్తారు’ అనేది ఒక ప్రజాసమూహం ఉనికినీ జ్ఞాపకాన్నీ పూర్తిగా నిర్మూలించడాన్ని తెలిపే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా, “నీ గొప్ప పేరును గురించి నీవు ఏమి చేస్తావు?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  choice: ఇది వింటారు
  rationale: שׁמע యొక్క అసంపూర్ణ క్రియారూపం ఇక్కడ యెహోషువ ఊహిస్తున్న భవిష్యత్ పరిణామాన్ని సూచిస్తుంది. ఓటమి సంగతి అనే భావం సందర్భం ద్వారా స్పష్టమవుతుంది; అందుకే ‘ఇది’ సహజమైన తెలుగు అనుసంధానంగా వాడబడింది.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులు
  rationale: హీబ్రూలో రూపం ఏకవచనమైనా, ఇది ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచనం సహజం.
- source_word: וְכֹל יֹשְׁבֵי הָאָרֶץ
  choice: ఈ దేశ నివాసులందరూ
  rationale: יֹשְׁבֵי అంటే నివసించేవారు/నివాసులు. ఇక్కడ הָאָרֶץ చుట్టుపక్కల దేశప్రాంతాన్ని సూచిస్తుంది; సమస్త భూమిని కాదు.
- source_word: וְנָסַבּוּ עָלֵינוּ
  choice: వారు మనలను చుట్టుముట్టి
  rationale: נסב + עַל యుద్ధ సందర్భంలో చుట్టుముట్టడం లేదా ముట్టడించడం అనే భావాన్ని ఇస్తుంది.
- source_word: וְהִכְרִיתוּ אֶת שְׁמֵנוּ מִן הָאָרֶץ
  choice: భూమిమీద మన పేరు లేకుండా తుడిచివేస్తారు
  rationale: అక్షరార్థమైన ‘మన పేరును నరికివేస్తారు’ తెలుగులో అసహజం. ప్రజల ఉనికినీ జ్ఞాపకాన్నీ పూర్తిగా నిర్మూలించడం అనే హీబ్రూ నుడికార భావాన్ని ఈ రూపం తెలియజేస్తూ ‘పేరు’ను నిలుపుతుంది.
- source_word: וּמַה תַּעֲשֶׂה
  choice: అప్పుడు ... నీవు ఏమి చేస్తావు?
  rationale: ప్రశ్నార్థక పదం మరియు రెండవ పురుష ఏకవచన అసంపూర్ణ క్రియారూపం దేవునికి చేసిన ప్రత్యక్ష విజ్ఞప్తిని సూచిస్తాయి. ‘అప్పుడు’ సందర్భంలోని పరిణామ సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְשִׁמְךָ הַגָּדוֹל
  choice: నీ గొప్ప పేరు కోసం
  rationale: לְ అనే ఉపసర్గ ఇక్కడ దేవుని పేరు, అంటే ప్రజల మధ్య ఆయన గౌరవం, నిమిత్తం అనే భావాన్ని ఇస్తుంది; మూలంలోని సంక్షిప్తతను కూడా కాపాడుతుంది.
theological_decisions:
- issue: ‘నీ గొప్ప పేరు’ అనే విజ్ఞప్తి భావం
  choice: ఇశ్రాయేలు గతి వల్ల ఇతర జనాల మధ్య దేవుని బహిరంగ గౌరవానికి కలిగే ప్రభావం గురించి చేసిన విజ్ఞప్తి
  alternative: దేవుని పేరును గురించిన సాధారణ లేదా పూర్తిగా వ్యక్తిగత ఆందోళన
  rationale: సందర్భంలో ఇశ్రాయేలు నిర్మూలన యెహోవా పేరుపై ఇతర జనాల దృష్టిలో ప్రభావం చూపుతుందని యెహోషువ వాదిస్తున్నాడు. అనువాదం ఈ భావాన్ని విస్తరించి సిద్ధాంతీకరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. ‘కనానీయులూ’లోని దీర్ఘ ‘ఊ’ సముచ్చయార్థక ‘కూడా/మరియు’ భావాన్ని సహజంగా కలుపుతుంది. హీబ్రూ నుడికారంలోని ‘పేరు’ భావం ప్రధాన పాఠ్యంలో నిలుపబడగా, దాని అర్థం పాదటిప్పణిలో వివరించబడింది.
