source:
  edition: WLC
  text: וַ/יַּכּ֨וּ מֵ/הֶ֜ם אַנְשֵׁ֣י הָ/עַ֗י כִּ/שְׁלֹשִׁ֤ים וְ/שִׁשָּׁה֙ אִ֔ישׁ וַֽ/יִּרְדְּפ֞וּ/ם לִ/פְנֵ֤י הַ/שַּׁ֨עַר֙ עַד הַ/שְּׁבָרִ֔ים וַ/יַּכּ֖וּ/ם בַּ/מּוֹרָ֑ד וַ/יִּמַּ֥ס לְבַב הָ/עָ֖ם וַ/יְהִ֥י לְ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
translation:
  language: te
  text: ఆయి పట్టణానికి చెందిన వారు వారిలో దాదాపు ముప్పై ఆరుగురిని కొట్టిపడేశారు. వారు ద్వారం ముందునుంచి షెబారీము[a] వరకు వారిని తరిమి, దిగువ దారిలో వారిని కొట్టిపడేశారు. అప్పుడు ప్రజల హృదయం కరిగిపోయి నీరైపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాతిగనుల వరకు,’ లేదా ‘విరిగిన ప్రదేశాల వరకు’; שברים అనే హీబ్రూ పదాన్ని షెబారీము అనే స్థలనామంగా గానీ, వివరణాత్మక పదంగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ מֵהֶם
  choice: వారిలో ... హతమార్చారు
  rationale: యుద్ధ సందర్భంలో נכה ప్రాణాంతకంగా కొట్టడాన్ని సూచిస్తుంది; מן సమూహంలోనుంచి జరిగిన నష్టాన్ని తెలియజేస్తుంది.
- source_word: אַנְשֵׁי הָעַי
  choice: ఆయి పట్టణపు మనుషులు
  rationale: ఆయికి చెందిన యోధులను సూచించే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ
  choice: దాదాపు ముప్పై ఆరుగురిని
  rationale: సంఖ్యకు ముందున్న כְּ సుమారు అనే భావాన్ని ఇస్తుంది.
- source_word: וַיִּרְדְּפוּם
  choice: వారిని తరిమి
  rationale: సైనిక సందర్భంలో רדף వెంబడించడం లేదా తరమడం; తెలుగులో 'తరిమి' సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: לִפְנֵי הַשַּׁעַר
  choice: ద్వారం ముందునుంచి
  rationale: לפני లోని స్థలార్థాన్ని కాపాడుతుంది.
- source_word: עַד הַשְּׁבָרִים
  choice: షెబారీము వరకు
  rationale: ఇది స్థలనామమా లేక వివరణాత్మక సాధారణ నామవాచకమా అన్న సందిగ్ధత ఉంది; ప్రధాన పాఠ్యంలో స్థలనామంగా లిప్యంతరీకరించి ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
- source_word: וַיַּכּוּם בַּמּוֹרָד
  choice: దిగువ దారిలో వారిని కొట్టారు
  rationale: מורד దిగే వాలు లేదా దిగువ దారిని సూచిస్తుంది; రెండో נכה ను 'కొట్టారు'గా ఇవ్వడం మూలంలోని పునరుక్తిని నిలుపుతూ, మొదటి వాక్యంలోని మరణాలకంటే ఇక్కడ ఫలితాన్ని అతిగా నిర్ధారించదు.
- source_word: וַיִּמַּס לְבַב הָעָם
  choice: ప్రజల గుండె కరిగిపోయి
  rationale: ధైర్యం పూర్తిగా క్షీణించినదనే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా యథాతథంగా నిలుపుతుంది.
- source_word: וַיְהִי לְמָיִם
  choice: నీరైపోయింది
  rationale: మూలంలో ఉపమాన సూచకం లేకుండా 'నీరు అయింది' అనే బలమైన రూపకం ఉంది; సహజమైన తెలుగు రూపంలో అదే చిత్రాన్ని కాపాడుతుంది.
