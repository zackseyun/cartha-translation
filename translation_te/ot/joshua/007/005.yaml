  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. మూలంలోని యుద్ధ తీవ్రతను, గుండె కరిగి నీరైపోవడం అనే వరుస రూపకాన్ని నిలుపుకున్నాం; అస్పష్టమైన స్థలనామానికి పాదటిప్పణి ఇచ్చాం.
