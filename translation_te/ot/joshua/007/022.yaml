translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. చిన్న వాక్యాలతో హీబ్రూ కథన వేగం, కనుగొనబడిన క్షణంలోని ఉద్ఘాటన నిలుపబడ్డాయి.
