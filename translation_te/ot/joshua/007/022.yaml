language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוֹשֻׁ֨עַ֙ מַלְאָכִ֔ים וַ/יָּרֻ֖צוּ הָ/אֹ֑הֱלָ/ה וְ/הִנֵּ֧ה טְמוּנָ֛ה בְּ/אָהֳל֖/וֹ וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
translation:
  language: te
  text: అప్పుడు యెహోషువ సందేశకులను పంపాడు; వారు గుడారానికి పరుగెత్తారు. ఇదిగో, అది అతని గుడారంలో దాచబడి ఉంది, వెండి దాని కింద ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: కథన సందర్భంలో שׁלח క్రియకు సహజమైన, నేరమైన తెలుగు సమానార్థకం.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఇక్కడ మనుష్యులైన సమాచారవాహకులు లేదా పంపబడినవారు ఉద్దేశించబడ్డారు; సందర్భం వల్ల దేవదూతలు అనే అర్థం రాదు.
- source_word: וַיָּרֻצוּ
  choice: పరుగెత్తారు
  rationale: רץ సూచించే స్పష్టమైన పరుగెత్తే చర్యను నిలుపుతుంది; ‘త్వరపడ్డారు’ కంటే మూలానికి దగ్గరగా ఉంది.
- source_word: הָאֹהֱלָה
  choice: గుడారం దగ్గరికి
  rationale: దిశను తెలిపే הָ suffix గుడారం వైపు కదలికను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కనుగొన్న దృశ్యాన్ని ఉద్ఘాటించే హీబ్రూ కథన సూచక పదం యొక్క నాటకీయ బలాన్ని నిలుపుతుంది.
- source_word: טְמוּנָה
  choice: దాచబడి ఉంది
  rationale: స్త్రీలింగ ఏకవచన రూపం ముందటి వచనంలోని వస్త్రాన్ని సూచిస్తుంది; ‘పాతిపెట్టబడి’ అని చెప్పడం మూలపదం కంటే ఎక్కువ నిర్దిష్టతను చేర్చుతుంది.
- source_word: בְּאָהֳלוֹ
  choice: అతని గుడారంలో
  rationale: స్థలార్థక ఉపసర్గతో కూడిన మూడవ పురుష ఏకవచన ప్రత్యయం ఆకాను సూచిస్తుంది.
- source_word: וְהַכֶּסֶף
  choice: వెండి
  rationale: హీబ్రూలో సమన్వయ conjunction ఉన్నప్పటికీ, తెలుగులో తదుపరి స్వతంత్ర వాక్యంలోని ‘వెండి’ సహజంగా అదనపు దృశ్యవివరాన్ని తెలియజేస్తుంది.
- source_word: תַּחְתֶּיהָ
  choice: దాని కింద
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందటి వచనంలోని వస్త్రాన్ని సహజంగా సూచిస్తుంది; సంబంధాన్ని అధికంగా వ్యాఖ్యానించకుండా ఉంచుతుంది.
