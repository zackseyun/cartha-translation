id: JOS.7.19
reference: Joshua 7:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל עָכָ֗ן בְּנִ/י֙ שִֽׂים נָ֣א כָב֗וֹד לַֽ/יהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל וְ/תֶן ל֣/וֹ תוֹדָ֑ה וְ/הַגֶּד נָ֥א לִ/י֙ מֶ֣ה עָשִׂ֔יתָ אַל תְּכַחֵ֖ד מִמֶּֽ/נִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
translation:
  language: te
  text: అప్పుడు యెహోషువ ఆకానుతో, “నా కుమారుడా, దయచేసి ఇశ్రాయేలు దేవుడైన యెహోవాకు మహిమనిచ్చి, ఆయనకు కృతజ్ఞతలు చెల్లించు[a]. నువ్వు ఏమి చేశావో దయచేసి నాకు చెప్పు; దాన్ని నాకు దాచకు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు కృతజ్ఞతాస్తుతి అర్పించు”; ఈ సందర్భంలో “ఆయన ముందు ఒప్పుకో” అనే భావం కూడా ఉండవచ్చు.
    reason: תוֹדָה అనే పదానికి కృతజ్ఞత, స్తుతి, ఒప్పుకోలు అనే అర్థసాధ్యతలు ఉన్నాయి.
lexical_decisions:
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: పుంలింగ ఏకవచన సంబోధనను, దానిలోని తండ్రివంటి గంభీరమైన అనునయ స్వరాన్ని నిలుపుతుంది.
- source_word: שִׂים נָא כָבוֹד
  choice: దయచేసి ... మహిమ చెల్లించి
  rationale: అక్షరార్థంగా ‘మహిమను ఉంచు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; נָא లోని వినయపూర్వక విన్నపాన్ని ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוה ను పేరుగా ప్రతిబింబిస్తూ, ל ఉపసర్గను ‘కు’తో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: మూలంలోని సంబంధార్థక పదబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా అందిస్తుంది.
- source_word: וְתֶן לוֹ תוֹדָה
  choice: ఆయనకు కృతజ్ఞతలు అర్పించు
  rationale: תוֹדָה యొక్క సాధారణ కృతజ్ఞత/కృతజ్ఞతాస్తుతి భావాన్ని నిలుపుతుంది; ఈ న్యాయవిచారణ సందర్భంలో సాధ్యమైన ‘ఒప్పుకోలు’ భావాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: וְהַגֶּד נָא לִי
  choice: దయచేసి నాకు చెప్పు
  rationale: נגד హిఫీల్ ఆజ్ఞారూపంలోని ‘తెలియజేయు/చెప్పు’ భావాన్నీ, נָא లోని వినయపూర్వక విన్నపాన్నీ స్పష్టంగా అందిస్తుంది.
- source_word: מֶה עָשִׂיתָ
  choice: నువ్వు ఏమి చేశావో
  rationale: పూర్తయిన కార్యం ప్రస్తుత విచారణకు సంబంధించినదని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אַל תְּכַחֵד מִמֶּנִּי
  choice: దాన్ని నా దగ్గర దాచకు
  rationale: כחד లోని దాచడం లేదా మరుగుపరచడం అనే భావాన్ని నేరుగా అందిస్తుంది; తెలుగులో అవసరమైన సూచనార్థక కర్మను ‘దాన్ని’గా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఒప్పుకోలు సందర్భంలో תוֹדָה అర్థం
  choice: ప్రధాన పాఠంలో దేవునికి అర్పించే కృతజ్ఞతగా అనువదించడం
  alternative: ఆయన ఎదుట ఒప్పుకో; లేదా ఆయనకు కృతజ్ఞతాస్తుతి అర్పించు
  rationale: תוֹדָה కృతజ్ఞత, స్తుతి, కొన్ని సందర్భాల్లో ఒప్పుకోలు అనే భావాలను కలిగి ఉండగలదు. ఆకాను నిజం చెప్పవలసిన సందర్భం ఒప్పుకోలు భావాన్ని సూచించినా, ప్రధాన పాఠంలో దానిని మాత్రమే నిర్ణయించకుండా మూలంలోని అర్థ విస్తృతిని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టంగా ఉండే శైలి వాడబడింది. యెహోషువ మాటల్లోని అనునయం కోసం ‘నా కుమారుడా’, ‘దయచేసి’ ఉంచబడ్డాయి; దేవుని సంబోధనలో గౌరవార్థక ‘ఆయనకు’ వాడబడింది.
