source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ מִן הָ/עָם֙ שָׁ֔מָּ/ה כִּ/שְׁלֹ֥שֶׁת אֲלָפִ֖ים אִ֑ישׁ וַ/יָּנֻ֕סוּ לִ/פְנֵ֖י אַנְשֵׁ֥י הָ/עָֽי־׃
base_translation:
