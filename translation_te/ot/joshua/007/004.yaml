  yaml_path: translation/ot/joshua/007/004.yaml
  text: So about three thousand men from the people went up there, but they fled before the men of Ai.
translation:
  language: te
  text: అప్పుడు ప్రజలలోనుండి దాదాపు మూడు వేలమంది అక్కడికి ఎక్కి వెళ్లారు; కానీ వారు ఆయి మనుష్యుల ఎదుటనుండి పారిపోయారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: అక్కడికి వెళ్లారు
  rationale: עלה అనే క్రియకు ప్రాథమికంగా ‘పైకి వెళ్లడం’ అనే భావం ఉన్నా, ఇక్కడ హాయి వైపు సైనిక కదలికను సహజమైన ఆధునిక తెలుగులో ‘అక్కడికి వెళ్లారు’ అని వ్యక్తం చేశాం; క్రియలో లేని ‘యుద్ధానికి’ అనే భావాన్ని చేర్చలేదు.
- source_word: מִן הָעָם
  choice: ప్రజల్లోనుండి
  rationale: עם అక్షరార్థంగా ‘ప్రజలు.’ ఇక్కడ ఇశ్రాయేలు ప్రజలలోనుండి తీసుకున్న ఒక బృందాన్ని సూచిస్తుంది; ‘సైన్యం’ లేదా ‘సైనికులు’ అని మరింత నిర్దిష్టం చేయలేదు.
- source_word: שָׁמָּה
  choice: అక్కడికి
  rationale: ఇది ముందుగా పేర్కొన్న గమ్యస్థానం వైపు దిశను సూచించే క్రియావిశేషణం; తెలుగులో ‘అక్కడికి’ సహజంగా ఉంది.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: దాదాపు మూడు వేలమంది
  rationale: సంఖ్యకు ముందున్న כִּ సుమారు అనే భావాన్ని ఇస్తుంది. אִישׁ ఇక్కడ వ్యక్తులను లెక్కించే పదం కాబట్టి, మూలంలో లేని సైనిక హోదాను చేర్చకుండా ‘మూడు వేలమంది’ అని అనువదించాం.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయారు
  rationale: נוס అంటే ‘పారిపోవడం’; పరాజయ సందర్భానికి సరిపోయే స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: לִפְנֵי
  choice: ఎదుటనుండి
  rationale: పారిపోవడం అనే క్రియతో కలిసినప్పుడు ప్రత్యర్థుల సన్నిధినుండి వెనుదిరగడాన్ని సూచిస్తుంది; ‘ఎదుటనుండి’ మూలసంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אַנְשֵׁי הָעָי
  choice: హాయి పట్టణపు మనుష్యులు
  rationale: ఇది హాయి నగరపు పురుషులను, సందర్భంలో దాని యోధులను సూచిస్తుంది. మూలంలోని సాధారణ אִישׁ పదాన్ని గౌరవిస్తూ ‘మనుష్యులు’ అని, స్థలనామం స్పష్టత కోసం ‘పట్టణపు’ అని ఇచ్చాం.
