  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. మూలంలోని సుమారు సంఖ్యను, ప్రజలలోనుండి ఎంపికైన బృందాన్ని, హాయి మనుష్యుల ఎదుటనుండి పారిపోయిన భావాన్ని నిలుపుకుంది.
