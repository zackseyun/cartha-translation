id: JOS.7.17
reference: Joshua 7:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֶת מִשְׁפַּ֣חַת יְהוּדָ֔ה וַ/יִּלְכֹּ֕ד אֵ֖ת מִשְׁפַּ֣חַת הַ/זַּרְחִ֑י וַ/יַּקְרֵ֞ב אֶת מִשְׁפַּ֤חַת הַ/זַּרְחִי֙ לַ/גְּבָרִ֔ים וַ/יִּלָּכֵ֖ד זַבְדִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
translation:
  language: te
  text: తరువాత అతడు యూదా వంశాన్ని దగ్గరకు రప్పించాడు; జెరహీయుల వంశం ఎంపికైంది. ఆ తరువాత అతడు జెరహీయుల వంశాన్ని పురుషులవారీగా[a] దగ్గరకు రప్పించాడు; జబ్ది ఎంపికయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పురుషులను బట్టి.” ఇక్కడి హీబ్రూ పదబంధం జెరహీయుల వంశంలోని పురుషులను ఒక్కొక్కరిగా ముందుకు రప్పించారని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: దగ్గరకు రప్పించాడు
  rationale: హిఫిల్ రూపంలోని ‘దగ్గరకు తీసుకురావడం/సమక్షంలో నిలపడం’ అనే విధానపరమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מִשְׁפַּחַת
  choice: వంశం
  rationale: ఇక్కడ ఇది గోత్రంలో భాగమైన బంధుత్వ సమూహాన్ని సూచిస్తుంది. ‘కుటుంబం’ కంటే ‘వంశం’ ఈ సామాజిక స్థాయిని తెలుగులో మెరుగ్గా తెలియజేస్తుంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపం.
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  choice: ఎంపికైంది / ఎంపికయ్యాడు
  rationale: లాటరీ లేదా దైవిక గుర్తింపు ప్రక్రియలో ఒక సమూహం లేదా వ్యక్తి నిర్ణయించబడడాన్ని సందర్భానుసారంగా తెలియజేస్తుంది; ‘పట్టుబడింది’ అనే తెలుగు రూపం నేరస్థుడు లేదా శత్రువు చిక్కాడనే అనవసర భావాన్ని కలిగించవచ్చు.
- source_word: הַזַּרְחִי
  choice: జెరహీయుల
  rationale: జెరహు సంతతివారిని సూచించే జాతివాచక రూపాన్ని సహజమైన తెలుగు బహువచన సంబంధరూపంలో అందిస్తుంది.
- source_word: לַגְּבָרִים
  choice: పురుషులవారీగా
  rationale: అక్షరార్థంగా ‘పురుషులకు/పురుషులను బట్టి’; ఈ క్రమబద్ధమైన గుర్తింపు సందర్భంలో వంశంలోని పురుషులను ఒక్కొక్కరిగా ముందుకు రప్పించారనే పంపిణీ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: זַבְדִּי
  choice: జబ్ది
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: וַיִּלְכֹּד / וַיִּלָּכֵד అనే క్రియలోని ‘పట్టుకోవడం’ రూపకం
  choice: ఎంపికైంది / ఎంపికయ్యాడు
  alternative: పట్టుబడింది / పట్టుబడ్డాడు
  rationale: ఈ వాక్యంలో యుద్ధంలో పట్టుకోవడం కాక, దేవుని సమక్షంలో జరిగిన గుర్తింపు ప్రక్రియ ఉద్దేశించబడింది. అనువాదం ఆ సందర్భార్థాన్ని ఇస్తుంది; ఎంపిక ఎలా జరిగిందో వచనంలో లేని వివరాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘వంశం’ గోత్రంలోని బంధుత్వ విభాగాన్ని సూచిస్తుంది; ప్రక్రియను అతిగా వివరించకుండా హీబ్రూ వాక్య నిర్మాణం, క్రమం నిలుపబడ్డాయి.
