source:
  edition: WLC
  text: וַ/יַּקְרֵ֥ב אֶת בֵּית֖/וֹ לַ/גְּבָרִ֑ים וַ/יִּלָּכֵ֗ד עָכָ֞ן בֶּן כַּרְמִ֧י בֶן זַבְדִּ֛י בֶּן זֶ֖רַח לְ/מַטֵּ֥ה יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/018.yaml
  text: Then he brought his household near man by man[a], and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.
translation:
  language: te
  text: తరువాత అతడు తన ఇంటివారిని పురుషుల వారీగా[a] దగ్గరకు రప్పించాడు. అప్పుడు యూదా గోత్రానికి చెందిన కర్మీ కుమారుడు, జబ్ది కుమారుడు, జెరహు కుమారుడైన ఆకాను పట్టుబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక్కొక్క పురుషుని చొప్పున.’ హెబ్రీ పదబంధం సంక్షిప్తంగా ఉంది; చీట్లు వేసే ప్రక్రియలో ఇంటివారిని పురుషుల ఆధారంగా ముందుకు రప్పించడాన్ని ఇది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: దగ్గరకు రప్పించాడు
  rationale: קרב హిఫిల్ రూపం ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ అనే భావం ఇస్తుంది. చీట్లు వేసి గుర్తించే ఈ సందర్భంలో ‘దగ్గరకు రప్పించాడు’ మూలంలోని రూపకల్పనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בֵּיתוֹ
  choice: అతని ఇంటివారిని
  rationale: בַּיִת ఇక్కడ భవనాన్ని కాక కుటుంబ లేదా గృహ సమూహాన్ని సూచిస్తుంది; ‘ఇంటివారు’ ఆధునిక తెలుగులో ఆ సామాజిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַגְּבָרִים
  choice: ఒక్కొక్క పురుషుని చొప్పున
  rationale: ఈ సంక్షిప్త హెబ్రీ పదబంధం ఇంటివారిని పురుషుల వారీగా ముందుకు రప్పించిన ప్రక్రియను సూచించవచ్చు. పురుష బహువచనాన్ని, విధానపరమైన భావాన్ని రెండింటినీ ఈ అనువాదం నిలుపుతుంది.
- source_word: וַיִּלָּכֵד
  choice: పట్టుబడ్డాడు
  rationale: לכד నిఫాల్ రూపం అక్షరార్థంగా ‘పట్టుబడడం’ అని అర్థం. చీటి ద్వారా గుర్తింపబడిన సందర్భమైనప్పటికీ, మరింత వ్యాఖ్యానాత్మకమైన ‘ఎంపికయ్యాడు’కు బదులు హెబ్రీ నుడికారాన్ని నిలుపుతుంది.
- source_word: עָכָן
  choice: ఆకాను
  rationale: హెబ్రీ వ్యక్తి పేరును తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: בֶּן כַּרְמִי בֶן זַבְדִּי בֶּן זֶרַח
  choice: జెరహు కుమారుడైన జబ్ది కుమారుడు కర్మీ కుమారుడైన
  rationale: హెబ్రీ వంశావళి క్రమాన్ని పూర్తిగా కాపాడుతూ, తెలుగులో సహజంగా వ్యక్తి పేరుకు ముందు వచ్చే విధంగా పూర్వీకుల నుంచి ఆకాను వరకు క్రమపరిచాం.
- source_word: לְמַטֵּה יְהוּדָה
  choice: యూదా గోత్రానికి చెందిన
  rationale: గోత్ర సందర్భంలో מַטֶּה అంటే ‘గోత్రం’; ఈ రూపం అనుబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
