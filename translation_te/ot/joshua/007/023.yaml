source:
  edition: WLC
  text: וַ/יִּקָּחוּ/ם֙ מִ/תּ֣וֹךְ הָ/אֹ֔הֶל וַ/יְבִאוּ/ם֙ אֶל יְהוֹשֻׁ֔עַ וְ/אֶ֖ל כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּצִּקֻ֖/ם לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/023.yaml
  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
translation:
  language: te
  text: వారు వాటిని గుడారం లోపలి నుండి తీసుకొని యెహోషువయొద్దకు, ఇశ్రాయేలు కుమారులందరి యొద్దకు తీసుకువచ్చారు; వాటిని యాహ్వే సన్నిధిలో పరచి ఉంచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటిని యాహ్వే సన్నిధిలో కుమ్మరించారు.” హీబ్రూ క్రియకు అక్షరార్థంగా “కుమ్మరించు” అనే అర్థం ఉంది; అయితే ఇక్కడ స్వాధీనం చేసుకున్న వస్తువులను ఆయన సన్నిధిలో పరచి ఉంచడాన్ని సూచించే అవకాశం ఎక్కువగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחוּם
  choice: వారు వాటిని తీసుకొని
  rationale: לקח అనే క్రియకు ఈ కథన సందర్భంలో సహజమైన అర్థం ‘తీసుకొను’; ‘పట్టుకొను’ అనవసరంగా బలప్రయోగ భావాన్ని కలిగిస్తుంది.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: గుడారం లోపల నుండి
  rationale: מִתּוֹךְ గుడారం అంతర్భాగం నుండి తీసినట్లు స్పష్టంగా సూచిస్తుంది; కేవలం ‘గుడారం నుండి’ అనడం ఆ స్థలసూచనను కొంత తగ్గిస్తుంది.
- source_word: וַיְבִאוּם
  choice: తీసుకొచ్చారు
  rationale: בוא యొక్క హిఫీల్ రూపం ఇక్కడ ‘తీసుకురావడం’ అనే సాధారణ గమనార్థాన్నే ఇస్తుంది; ‘సమర్పించారు’ అనడం మూలంలో స్పష్టంగా లేని ఆచార భావాన్ని చేర్చుతుంది.
- source_word: אֶל יְהוֹשֻׁעַ וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: యెహోషువ దగ్గరికి, ఇశ్రాయేలు కుమారులందరి దగ్గరికి
  rationale: రెండుసార్లు వచ్చిన אֶל ను సమాంతరంగా వ్యక్తం చేస్తూ, בְּנֵי יִשְׂרָאֵל అనే మూలపదబంధాన్ని పారదర్శకంగా ‘ఇశ్రాయేలు కుమారులు’గా నిలిపింది.
- source_word: וַיַּצִּקֻם
  choice: వాటిని కుమ్మరించారు
  rationale: יצק యొక్క ప్రాథమిక అర్థం ‘కుమ్మరించు/పోయు.’ ఇక్కడ వస్తువులను యెహోవా సన్నిధిలో బయటకు కుమ్మరించి ఉంచిన భావం సాధ్యమైనందున, రూపకాన్ని సున్నితంగా మార్చకుండా నిలిపి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי ఇక్కడ ‘ఎదుట/సన్నిధిలో’ అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘సన్నిధిలో’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ వ్యక్తినామమైన יהוה ను తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; దానిని బిరుదుతో భర్తీ చేయలేదు.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపంలో నిలిపాం; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: בְּנֵי יִשְׂרָאֵל అనే సమూహనామం
  choice: ఇశ్రాయేలు కుమారులందరు
  alternative: ఇశ్రాయేలీయులందరు; ఇశ్రాయేలు సంతానమంతా
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే ఒడంబడిక-కథన పదబంధాన్ని పారదర్శకంగా నిలిపాం. ‘ఇశ్రాయేలీయులు’ మరింత సహజమైన ప్రత్యామ్నాయం అయినా మూలరూపాన్ని తక్కువగా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘గుడారం లోపల నుండి’ అనే స్థలసూచనను స్పష్టంగా ఉంచి, ‘ఇశ్రాయేలు కుమారులు’ అనే మూలపదబంధాన్ని నిలిపాం. יצק క్రియలోని ‘కుమ్మరించు’ రూపకాన్ని ప్రధాన పాఠంలో కాపాడి, సందర్భానుకూలమైన ‘పరచి ఉంచారు’ అర్థాన్ని పాదసూచికలో ఇచ్చాం.
