source:
  edition: WLC
  text: ו/אראה בַ/שָּׁלָ֡ל אַדֶּ֣רֶת שִׁנְעָר֩ אַחַ֨ת טוֹבָ֜ה וּ/מָאתַ֧יִם שְׁקָלִ֣ים כֶּ֗סֶף וּ/לְשׁ֨וֹן זָהָ֤ב אֶחָד֙ חֲמִשִּׁ֤ים שְׁקָלִים֙ מִשְׁקָל֔/וֹ וָֽ/אֶחְמְדֵ֖/ם וָֽ/אֶקָּחֵ֑/ם וְ/הִנָּ֨/ם טְמוּנִ֥ים בָּ/אָ֛רֶץ בְּ/ת֥וֹךְ הָ/אָֽהֳלִ֖/י וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
translation:
  language: te
  text: దోపుడుసొమ్ములో షినారు దేశపు అందమైన ఒక పైవస్త్రాన్ని,[a] రెండువందల షెకెల్ల వెండిని, యాభై షెకెల్ల బరువున్న ఒక బంగారు కడ్డీని[b] నేను చూశాను. వాటిని కాంక్షించి తీసుకున్నాను. ఇదిగో, అవి నా గుడారం లోపల నేలలో దాచబడి ఉన్నాయి; వెండి దాని కింద ఉంది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పైవస్త్రం’ అని అనువదించిన హెబ్రీ పదం విలువైన అంగీని లేదా మాంటిల్‌ను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా ‘బంగారు నాలుక’; బహుశా నాలుక ఆకారంలో ఉన్న బంగారు ముక్కను సూచిస్తుంది. కొన్ని అనువాదాల్లో ‘బంగారు మేకు’ లేదా ‘బంగారు చీలిక’ అని ఉంటుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘దాని కింద’ అనే హెబ్రీ ప్రత్యయం స్త్రీలింగ ఏకవచనంలో ఉంది; అది బహుశా పైవస్త్రాన్ని సూచిస్తుంది.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: בַשָּׁלָל
  choice: దోపుడుసొమ్ములో
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న కొల్లసొమ్మును సూచిస్తుంది; సందర్భానికి సహజమైన ఆధునిక తెలుగు.
- source_word: אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה
  choice: షినారు దేశపు అందమైన ఒక పైవస్త్రం
  rationale: אַדֶּרֶת విలువైన బయటి వస్త్రం లేదా మాంటిల్‌ను సూచించగలదు; שִׁנְעָר మూలస్థానాన్ని, טוֹבָה దాని ఆకర్షణీయమైన నాణ్యతను తెలియజేస్తాయి.
- source_word: וּמָאתַיִם שְׁקָלִים כֶּסֶף
  choice: రెండువందల తులాల వెండి
  rationale: שקל ఇక్కడ బరువు ప్రమాణం. తెలుగు బైబిలు పఠనంలో పరిచితమైన ‘తులం’ను ఉపయోగించి సంఖ్యను యథాతథంగా ఉంచింది.
- source_word: וּלְשׁוֹן זָהָב אֶחָד
  choice: నాలుక ఆకారపు ఒక బంగారు ముద్ద
  rationale: לשון అక్షరార్థంగా ‘నాలుక’; ఇక్కడ నాలుక ఆకారంలో పోతపోసిన బంగారు ముక్కను సూచిస్తుంది. మూలంలోని స్పష్టమైన రూపకాన్ని నిలిపింది.
- source_word: חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  choice: యాభై తులాల బరువున్న
  rationale: బంగారు ముక్క బరువును తెలిపే ఉపవాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וָאֶחְמְדֵם
  choice: వాటిని ఆశించి
  rationale: חמד బలమైన, ఇక్కడ తప్పైన కోరికను సూచిస్తుంది; ‘ఆశించి’ ఆ నైతిక భావాన్ని సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: וָאֶקָּחֵם
  choice: తీసుకున్నాను
  rationale: לקח అనే సాధారణ ‘తీసుకొను’ క్రియను అతిశయింపకుండా నేరుగా అనువదించింది.
- source_word: וְהִנָּם
  choice: ఇదిగో, అవి
  rationale: హిన్నే రూపం శ్రోత దృష్టిని వస్తువుల ప్రస్తుత స్థానంపై నిలుపుతుంది; ‘ఇదిగో’ ఆ తక్షణత్వాన్ని కాపాడుతుంది.
- source_word: טְמוּנִים בָּאָרֶץ
  choice: నేలలో దాచబడి ఉన్నాయి
  rationale: טמן దాచిపెట్టడాన్ని, אֶרֶץ ఇక్కడ గుడారంలోని నేలను సూచిస్తాయి.
- source_word: בְּתוֹךְ הָאֳהֳלִי
  choice: నా గుడారం లోపల
  rationale: అంతర్భాగంలోని స్థానాన్ని ఆధునిక తెలుగులో సహజంగా తెలుపుతుంది.
- source_word: וְהַכֶּסֶף תַּחְתֶּיהָ
  choice: వెండి ఆ పైవస్త్రం కింద ఉంది
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం అత్యంత సహజంగా పైవస్త్రాన్నే సూచిస్తుంది; అస్పష్ట సర్వనామం బదులు సూచిత నామాన్ని పాఠ్యంలో స్పష్టం చేసింది, పాదటిప్పణిలో వ్యాకరణ వివరాన్ని తెలిపింది.
