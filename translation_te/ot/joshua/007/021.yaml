translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన-ఒప్పుకోలు శైలిని పాటించింది. ప్రాచీన బరువు ప్రమాణాన్ని ‘తులం’గా ఉంచి ఆధునిక విలువకు మార్చలేదు. ‘నాలుక ఆకారపు’ అనే పదబంధంతో మూలంలోని రూపాన్ని పాఠ్యంలోనే నిలిపి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
