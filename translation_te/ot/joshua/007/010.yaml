translation:
  language: te
  text: 'యాహ్వే యెహోషువతో ఇలా అన్నాడు: “లేచి నిలబడు. నీవు ఎందుకు ఇలా ముఖం నేలకు ఆనించి పడివున్నావు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: וַיֹּאמֶר
  choice: అని అన్నాడు
  rationale: హీబ్రూ కథనంలో సాధారణంగా వచ్చే אמר క్రియకు సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణం.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే, తెలుగులో సుపరిచితమైన రూపం.
- source_word: קֻם לָךְ
  choice: లేచి నిలబడు
  rationale: קום ఆజ్ఞ ఇక్కడ నేలపై సాష్టాంగపడి ఉన్న స్థితి నుంచి లేవమనే భావాన్ని ఇస్తుంది; לָךְను విడిగా కృత్రిమంగా అనువదించకుండా ఆజ్ఞ బలంలో కలిపాం.
- source_word: לָמָּה זֶּה
  choice: ఎందుకు ఇలా
  rationale: לָמָּהలోని ‘ఎందుకు’ ప్రశ్నతో పాటు זֶּה ఇచ్చే సూచనాత్మక/ఉద్ఘాటన భావాన్ని ‘ఇలా’ ద్వారా సహజంగా నిలిపాం.
- source_word: אַתָּה נֹפֵל
  choice: నీవు ... పడి ఉన్నావు
  rationale: వ్యక్తమైన אַתָּהను ‘నీవు’గా ఉంచి, సందర్భంలో కొనసాగుతున్న భంగిమను సూచించే participleను తెలుగు స్థిత్యర్థక నిర్మాణంతో అందించాం.
- source_word: עַל־פָּנֶיךָ
  choice: సాష్టాంగపడి
  rationale: అక్షరార్థంగా ‘నీ ముఖంపై’ అయినా, సందర్భంలో ముఖం నేలకు ఆనించి పడి ఉండే వినయభంగిమను సహజమైన తెలుగు పదంతో తెలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాక దేవుని ప్రత్యేక నామమే ఉంది; అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా నామరూపాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష సంభాషణగా రూపొందించాం. ‘ఎందుకు ఇలా’ ద్వారా హీబ్రూలోని לָמָּה זֶּה ఉద్ఘాటనను అతిశయించకుండా ఉంచాం.
