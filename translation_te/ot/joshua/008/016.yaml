translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని కర్మ మార్పు—‘వారిని’ నుండి ‘యెహోషువను’—అలాగే ఉంచబడింది. రెండు నిజమైన పదార్థ సందిగ్ధతలను పాదటిప్పణుల్లో నమోదు చేశాం.
