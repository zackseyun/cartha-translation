  text: וַ/יִּזָּעֲק֗וּ כָּל הָ/עָם֙ אֲשֶׁ֣ר ב/עיר לִ/רְדֹּ֖ף אַחֲרֵי/הֶ֑ם וַֽ/יִּרְדְּפוּ֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/יִּנָּתְק֖וּ מִן הָ/עִֽיר־־׃
base_translation:
