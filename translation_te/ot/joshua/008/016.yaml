  yaml_path: translation/ot/joshua/008/016.yaml
  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
translation:
  language: te
  text: పట్టణంలో ఉన్న ప్రజలందరూ వారిని తరుమడానికి పిలువబడ్డారు[a]. వారు యెహోషువను తరుమారు; అలా వారు పట్టణం నుండి దూరంగా లాగబడిపోయారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కేకలు వేశారు.” హీబ్రూ క్రియకు అలా అరవడం అనే అర్థం ఉండవచ్చు; అయితే ఇక్కడ తరుమడానికి పిలువబడడం లేదా సమీకరించబడడం అనే భావం సందర్భానికి ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పట్టణం నుండి విడదీయబడ్డారు” లేదా “పట్టణం నుండి తెంచివేయబడ్డారు.” హీబ్రూ పదం వారిని బయటకు లాగి పట్టణం నుండి వేరు చేసిన భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  choice: సమీకరించబడ్డారు
  rationale: זעק నిఫ్అల్ రూపం ఇక్కడ కేవలం ‘కేకలు వేశారు’ అనే అర్థం కంటే, తరుమడానికి ప్రజలను పిలిచి సమీకరించడాన్ని సూచిస్తుంది. సైనిక సందర్భంలో ‘సమీకరించబడ్డారు’ సహజంగా ఉంది; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  choice: పట్టణంలో ఉన్న ప్రజలందరూ
  rationale: עָם అంటే సాధారణంగా ‘ప్రజలు’ లేదా సందర్భానుసారంగా ‘దళం.’ ‘పురుషులందరూ’ అని అనువదిస్తే మూలంలో లేని లింగ నిర్దిష్టత చేరుతుంది.
- source_word: לִרְדֹּף אַחֲרֵיהֶם
  choice: వారిని తరుమడానికి
  rationale: רדף + אחרי అనేది వెంబడించడం లేదా తరుమడం అనే స్థిరమైన ప్రయోగం. సైనిక కథనంలో ‘తరుమడం’ సహజమైన ఆధునిక తెలుగు.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  choice: వారు యెహోషువను తరుముతూ
  rationale: ముందు బహువచన కర్మ ‘వారిని’ ఉన్నప్పటికీ, ఇక్కడ మూలపాఠం యెహోషువపై దృష్టి కేంద్రీకరిస్తుంది. ఆ మార్పును సవరించకుండా నిలిపాం.
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  choice: పట్టణం నుండి దూరంగా లాగబడ్డారు
  rationale: נתק నిఫ్అల్ రూపం లాగివేయబడడం, విడదీయబడడం లేదా తెగిపోవడం అనే భావాలను కలిగి ఉంది. సందర్భంలో వారిని పట్టణ రక్షణస్థానం నుండి బయటకు లాగి దూరం చేసిన వ్యూహాత్మక ఫలితాన్ని ఈ అనువాదం తెలియజేస్తుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
