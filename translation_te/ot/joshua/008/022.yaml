  text: וְ/אֵ֨לֶּה יָצְא֤וּ מִן הָ/עִיר֙ לִ/קְרָאתָ֔/ם וַ/יִּֽהְי֤וּ לְ/יִשְׂרָאֵל֙ בַּ/תָּ֔וֶךְ אֵ֥לֶּה מִ/זֶּ֖ה וְ/אֵ֣לֶּה מִ/זֶּ֑ה וַ/יַּכּ֣וּ אוֹתָ֔/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֥יד וּ/פָלִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
translation:
  language: te
  text: వీరు పట్టణం నుండి వారికి ఎదురుగా బయలుదేరారు. దాంతో వారు ఇశ్రాయేలీయుల మధ్య చిక్కుకున్నారు—వీరు ఒక వైపున, వారు మరో వైపున ఉన్నారు.[a] ఇశ్రాయేలీయులు వారిని హతమార్చి, వారిలో ప్రాణాలతో మిగిలినవాడుగాని తప్పించుకున్నవాడుగాని ఎవ్వరినీ మిగల్చలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, పదశః, “వీరు ఈ వైపు నుండి, వీరు ఈ వైపు నుండి” అని ఉంది; ఇది ఇశ్రాయేలీయులు ఆయీ వారిని రెండు వైపుల నుంచి చుట్టుముట్టినట్లు సూచించే ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: ఈ చివరి వాక్యభాగంలో హీబ్రూ క్రియ అకస్మాత్తుగా ఏకవచనంలో ఉంది; పదశః, “అతడు అతనికి ప్రాణాలతో మిగిలినవాడినిగాని తప్పించుకున్నవాడినిగాని మిగల్చలేదు.” ఈ ఏకవచన రూపాల సూచన స్పష్టంగా లేదు; భావం ఏమిటంటే ఎవరూ బతికి మిగలలేదు లేదా తప్పించుకోలేదు.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: పట్టణంలో ఉన్న ఇశ్రాయేలీయులు కూడా
  rationale: సూచక సర్వనామం మునుపు ప్రస్తావించిన మాటువేసిన ఇశ్రాయేలు దళాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘వీరు’ అంటే సూచన అస్పష్టంగా ఉండవచ్చు కాబట్టి సందర్భార్థాన్ని సంక్షిప్తంగా వ్యక్తం చేశాం.
- source_word: יָצְאוּ מִן הָעִיר
  choice: పట్టణంలో ... బయలుదేరారు
  rationale: יצא అంటే బయటికి రావడం లేదా బయలుదేరడం. మాటువేసిన దళం అప్పటికే పట్టణాన్ని స్వాధీనం చేసుకున్న సందర్భంలో, సహజమైన తెలుగు కథనానికి ‘బయలుదేరారు’ సరిపోతుంది.
- source_word: לִקְרָאתָם
  choice: వారిని ఎదుర్కోవడానికి
  rationale: לקראת అంటే కలవడానికి లేదా ఎదుర్కోవడానికి. యుద్ధ సందర్భంలోని ప్రతికూల భావాన్ని ‘ఎదుర్కోవడానికి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ
  choice: వారు ఇశ్రాయేలీయుల మధ్య చిక్కుకున్నారు
  rationale: పదశః ‘ఇశ్రాయేలు మధ్యలో అయ్యారు.’ ఇక్కడ ఐవారు రెండు ఇశ్రాయేలు దళాల మధ్య చిక్కుకున్న యుద్ధ పరిస్థితిని సహజంగా తెలిపాం.
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  choice: వీరు ఒక వైపున, వారు మరో వైపున ఉన్నారు
  rationale: రెండు వైపుల నుంచి చుట్టుముట్టిన పరిస్థితిని సూచించే హీబ్రూ సమాంతర ప్రయోగాన్ని తెలుగులో సహజంగా, దాని రెండు-వైపుల నిర్మాణాన్ని నిలుపుతూ అనువదించాం.
- source_word: וַיַּכּוּ אוֹתָם
  choice: ఇశ్రాయేలీయులు వారిని హతమార్చి
  rationale: యుద్ధ సందర్భంలో נכה ప్రాణాంతకంగా కొట్టడం లేదా సంహరించడం అనే భావం ఇస్తుంది. అస్పష్టమైన సర్వనామాల వల్ల గందరగోళం రాకుండా కర్తను సందర్భానుసారంగా స్పష్టం చేశాం.
- source_word: שָׂרִיד וּפָלִיט
  choice: ప్రాణాలతో మిగిలినవాడుగాని తప్పించుకున్నవాడుగాని
  rationale: మొదటి పదం బతికి మిగిలినవాడిని, రెండవది తప్పించుకుని పారిపోయినవాడిని సూచిస్తుంది. రెండు వర్గాల భేదాన్ని నిలిపాం.
theological_decisions:
- issue: הִשְׁאִיר לוֹ లో ఏకవచన కర్త, ఏకవచన సర్వనామ ప్రత్యయానికి సూచన
  choice: వారిలో ... ఎవ్వరూ లేకుండా చేశారు
  alternative: అతడు అతనికి మిగిలినవాడినిగాని తప్పించుకున్నవాడినిగాని మిగల్చలేదు
  rationale: హీబ్రూలో ముందున్న బహువచనం నుంచి ఏకవచన క్రియకు అకస్మాత్తుగా మార్పు ఉంది; ఇది ఇశ్రాయేలును సమష్టిగా చూడవచ్చు, లేదా వాక్యనిర్మాణపరంగా నిర్దిష్టత లేని ప్రయోగం కావచ్చు. ప్రధాన పాఠంలో ఏ వ్యక్తిని కర్తగా నిర్బంధంగా గుర్తించకుండా ఫలితాన్ని సహజ తెలుగులో తెలిపి, రూపభేదాన్ని పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. అస్పష్టమైన సర్వనామాలు పాఠకుడిని గందరగోళపరచే చోట సందర్భంలోని సమూహాలను స్పష్టం చేశాం. హీబ్రూ చివరి భాగంలోని అసాధారణ ఏకవచన మార్పును ప్రధాన వాక్యాన్ని కృత్రిమంగా చేయకుండా పాదసూచికలో సంరక్షించాం.
