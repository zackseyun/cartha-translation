source:
  edition: WLC
  text: וְ/עָשִׂ֨יתָ לָ/עַ֜י וּ/לְ/מַלְכָּ֗/הּ כַּ/אֲשֶׁ֨ר עָשִׂ֤יתָ לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ רַק שְׁלָלָ֥/הּ וּ/בְהֶמְתָּ֖/הּ תָּבֹ֣זּוּ לָ/כֶ֑ם שִׂים לְ/ךָ֥ אֹרֵ֛ב לָ/עִ֖יר מֵ/אַחֲרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
translation:
  language: te
  text: నీవు యెరికోకూ దాని రాజుకూ చేసినట్లే హాయికీ దాని రాజుకూ చేయాలి. కాని దాని దోపుడు సొమ్మును, పశువులను మీరు మీ కోసం దోచుకోవచ్చు.[a] ఆ పట్టణం వెనుక మాటు వేయడానికి ఒక దళాన్ని ఉంచు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు మీ కోసం దోచుకుంటారు.” హీబ్రూ రూపాన్ని సాధారణ భవిష్యత్ ప్రకటనగా లేదా అధికారపూర్వక అనుమతిగా అర్థం చేసుకోవచ్చు. యెరికోలో దోపుడు నిషేధించబడిన నేపథ్యానికి భిన్నంగా, ఇక్కడ అనుమతి భావాన్ని ప్రధాన పాఠం చూపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మాటును.” హీబ్రూ ఏకవచన కృదంతం మాటును ఒక ఏర్పాటుగా గానీ, మాటు వేసే దళాన్ని సమష్టిగా గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: సంయోజక వావుతో వచ్చిన ఖల్ పరిపూర్ణ రూపం ఈ ఆదేశ సందర్భంలో యెహోషువకు ఇచ్చిన నిర్దేశాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చేయాలి’ సహజంగా ఆ బలాన్ని తెలియజేస్తుంది.
- source_word: לָעַי
  choice: హాయికి
  rationale: హీబ్రూ స్థలనామం עַי ను తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘హాయి’గా లిప్యంతరీకరించి, దత్తివిభక్తిని జోడించాం.
- source_word: וּלְמַלְכָּהּ
  choice: దాని రాజుకు
  rationale: స్త్రీలింగ ప్రత్యయం పట్టణాన్నే తిరిగి సూచిస్తుంది; తెలుగులో ‘దాని రాజుకు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: చేసినట్లే
  rationale: యెరికోకు జరిగినదాన్ని హాయికి చేయవలసిన దానికి నమూనాగా చూపే తులనాత్మక భావాన్ని కాపాడుతుంది.
- source_word: רַק
  choice: అయితే
  rationale: యెరికోతో చేసిన పోలికకు వెంటనే వచ్చే ముఖ్యమైన మినహాయింపును తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: שְׁלָלָהּ
  choice: దాని దోపుడు సొమ్మును
  rationale: యుద్ధంలో స్వాధీనం చేసుకునే వస్తుసంపదను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּבְהֶמְתָּהּ
  choice: పశువులను
  rationale: בְּהֵמָה ఇక్కడ ఆస్తిగా పరిగణించే పెంపుడు జంతువులను సూచిస్తుంది; ‘పశువులు’ సంక్షిప్తమైన, సాధారణ తెలుగు పదం.
- source_word: תָּבֹזּוּ לָכֶם
  choice: మీరు మీ కోసం దోచుకోవచ్చు
  rationale: రెండవ పురుష బహువచనం యెహోషువ సైన్యాన్ని ఉద్దేశిస్తుంది. యెరికో విషయంలో ఉన్న నిషేధానికి భిన్నంగా ఇక్కడ అనుమతి ఇవ్వబడుతున్న సందర్భార్థాన్ని ‘దోచుకోవచ్చు’ చూపిస్తుంది; לָכֶם ను ‘మీ కోసం’గా నిలిపాం.
- source_word: שִׂים לְךָ
  choice: ఉంచు
  rationale: యెహోషువకు ఇచ్చిన ఏకవచన ఆజ్ఞ. సైనిక దళాన్ని ఒక స్థానంలో నియమించే భావాన్ని తెలుగులో ‘ఉంచు’ సహజంగా తెలియజేస్తుంది; לְךָ లోని ప్రయోజనార్థక భావం సందర్భంలో అంతర్భూతంగా ఉంది.
- source_word: אֹרֵב
  choice: మాటువేసి ఉండే దళాన్ని
  rationale: ఈ ఏకవచన కృదంతం మాటు చర్యనో, సమష్టిగా మాటువేసే దళాన్నో సూచించగలదు. ప్రధాన పాఠంలో సైనిక సందర్భానికి స్పష్టమైన సమష్టి భావాన్ని ఎంచుకున్నాం.
- source_word: מֵאַחֲרֶיהָ
  choice: ఆ పట్టణం వెనుక
  rationale: స్త్రీలింగ ప్రత్యయం ‘పట్టణం’ను సూచిస్తుంది; భౌగోళిక స్థానాన్ని తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: תָּבֹזּוּ యొక్క విధి—భవిష్య సూచనా లేదా అధికారపూర్వక అనుమతా
  choice: దోచుకోవచ్చు
  alternative: దోచుకుంటారు / దోచుకోవాలి
  rationale: హీబ్రూ రూపం సాధారణ భవిష్యత్తుగానూ ఆదేశాత్మక అధికారప్రదానంగానూ అర్థమవవచ్చు. యెరికో దోపుడు సొమ్ముపై ఉన్న నిషేధంతో కనిపించే వ్యత్యాసం ఇక్కడ అనుమతి భావానికి బలం ఇస్తుంది; అయినా రూపంలోని అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. యెహోషువను ఉద్దేశించిన ఏకవచన రూపాలు (‘నీవు’, ‘ఉంచు’), సైన్యాన్ని ఉద్దేశించిన బహువచన రూపం (‘మీరు’) వేరు చేసి నిలిపాం. యుద్ధసందర్భాన్ని అతిగా మృదువుపరచకుండా మూలంలోని ప్రత్యక్షతను కాపాడాం.
