    rationale: ‘యెరికోకు, దాని రాజుకు ... హాయికి, దాని రాజుకు’ అనే విరామ నిర్మాణం కొద్దిగా గట్టిగా ఉంది. సమాంతర దత్తి ప్రత్యయాలతో కలిపి రాయడం చదవడానికి సులభం.
