    rationale: ఇది అర్థసాధ్యమే అయినా, యెరికోతో పోలికకు ఉన్న స్పష్టమైన మినహాయింపును ‘కాని’ మరింత సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
  - severity: low
