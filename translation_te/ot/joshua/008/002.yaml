revisions:
- from: నీవు యెరికోకు, దాని రాజుకు చేసినట్లే హాయికి, దాని రాజుకు చేయాలి. అయితే దాని దోపుడు సొమ్మును, పశువులను మీరు మీ కోసం దోచుకోవచ్చు.[a] ఆ పట్టణం వెనుక మాటువేసి ఉండే దళాన్ని[b] ఉంచు.
  to: నీవు యెరికోకూ దాని రాజుకూ చేసినట్లే హాయికీ దాని రాజుకూ చేయాలి. కాని దాని దోపుడు సొమ్మును, పశువులను మీరు మీ కోసం దోచుకోవచ్చు.[a] ఆ పట్టణం వెనుక మాటు వేయడానికి ఒక దళాన్ని ఉంచు.[b]
  rationale: సవరణలు అర్థాన్ని మార్చకుండా మినహాయింపు భావాన్ని స్పష్టం చేశాయి, దత్తి-సమాంతర నిర్మాణాన్ని సాఫీ చేశాయి, మరియు మాటు వేసే సైనిక దళం అనే భావాన్ని సహజ ఆధునిక తెలుగులో వ్యక్తం చేశాయి. పాదటిప్పణి గుర్తులు వాటి సంబంధిత పదబంధాల వద్దనే నిలిపాయి.
