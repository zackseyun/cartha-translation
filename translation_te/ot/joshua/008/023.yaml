translation:
  language: te
  text: అయితే వారు ఆయి రాజును సజీవంగా పట్టుకుని, అతనిని యెహోషువ దగ్గరికి తీసుకొచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
