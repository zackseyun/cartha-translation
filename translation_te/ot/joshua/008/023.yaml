    text: లేదా, “మరియు వారు ఆయి రాజును సజీవంగా పట్టుకుని, అతనిని యెహోషువ దగ్గరికి తీసుకొచ్చారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: అయితే
  rationale: ఈ సంధాయకం కథనంలోని తదుపరి చర్యను కలుపుతూ, చుట్టుపక్కల ఉన్న సంహార నేపథ్యానికి స్వల్ప వ్యత్యాసాన్ని సూచించవచ్చు. ఆధునిక తెలుగులో ‘అయితే’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘మరియు’ కూడా సాధ్యమే.
- source_word: מֶלֶךְ הָעַי
  choice: హాయి రాజును
  rationale: ఈ నిర్మాణం ‘హాయి పట్టణపు రాజు’ అనే అర్థాన్ని ఇస్తుంది. సందర్భంలో స్థలనామం స్పష్టంగా ఉన్నందున సహజమైన తెలుగు రూపంగా ‘హాయి రాజు’ వాడబడింది.
- source_word: תָּפְשׂוּ
  choice: పట్టుకొని
  rationale: సైనిక సందర్భంలో ఈ క్రియ ఒకరిని అదుపులోకి తీసుకోవడం లేదా బంధించడం అనే భావాన్ని ఇస్తుంది; ‘పట్టుకొని’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: חָי
  choice: ప్రాణాలతో
  rationale: రాజును చంపకుండా సజీవంగా పట్టుకున్నారని సూచించే విధేయ విశేషణం. తెలుగులో ‘ప్రాణాలతో పట్టుకొని’ సహజమైన నుడికారం.
- source_word: וַיַּקְרִבוּ
  choice: దగ్గరికి తీసుకొచ్చారు
  rationale: קרב క్రియ యొక్క హిఫీల్ రూపం ‘దగ్గరకు తీసుకురావడం’ అని అర్థం. ‘తీసుకొచ్చారు’ మాత్రమే అనడం కంటే ‘దగ్గరికి తీసుకొచ్చారు’ మూలంలోని సమీపింపజేసే భావాన్ని నిలుపుతుంది.
- source_word: אֹתוֹ אֶל יְהוֹשֻׁעַ
  choice: యెహోషువ దగ్గరికి
  rationale: సర్వనామం మరియు אֶל యెహోషువను గమ్యంగా చూపుతాయి. ‘యెహోషువ ఎదుటికి’ అని అనడం మూలంలో స్పష్టంగా లేని న్యాయసభ లేదా సమర్పణ భావాన్ని జోడించవచ్చు.
