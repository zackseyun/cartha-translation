  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתֶּ֗ם תָּקֻ֨מוּ֙ מֵ/הָ֣/אוֹרֵ֔ב וְ/הוֹרַשְׁתֶּ֖ם אֶת הָ/עִ֑יר וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/007.yaml
  text: Then you shall rise up from the ambush and take the city[a], for Yahweh your God will give it into your hand.
translation:
  language: te
  text: అప్పుడు మీరు మాటు వేసిన స్థలం నుండి లేచి, ఆ పట్టణాన్ని స్వాధీనం చేసుకోండి[a]; మీ దేవుడైన యాహ్వే దానిని మీ చేతికి అప్పగిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ పట్టణాన్ని ఆక్రమించండి.” హీబ్రూ క్రియ సైనికంగా స్వాధీనం చేసుకోవడాన్ని సూచించవచ్చు; అయితే కేవలం పట్టుకోవడం అనే చర్యకన్నా అధీనంలోకి తీసుకోవడం అనే భావాన్నీ కలిగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקֻמוּ
  choice: లేచి
  rationale: קום అనే క్రియ ఇక్కడ మాటుగా దాగి ఉన్న స్థానం నుండి కార్యానికి లేవడాన్ని సూచించే సైనిక ఆదేశక్రమంలో ఉంది; ఆధునిక తెలుగులో ‘లేచి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מֵהָאוֹרֵב
  choice: మాటు వేసిన చోటు నుండి
  rationale: אֹרֵב మాటుగా వేచి ఉండడాన్ని లేదా మాటు స్థానాన్ని సూచిస్తుంది. తెలుగులో ‘మాటు వేసిన చోటు నుండి’ స్థలార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהוֹרַשְׁתֶּם
  choice: స్వాధీనం చేసుకోండి
  rationale: ירשׁ హిఫీల్ రూపం ఇక్కడ పట్టణాన్ని కేవలం పట్టుకోవడమే కాక దాని మీద అధికారం సంపాదించడాన్ని సూచించగలదు; ‘స్వాధీనం చేసుకోండి’ ఆ స్వాధీనత భావాన్ని నిలుపుతుంది.
- source_word: הָעִיר
  choice: ఆ పట్టణాన్ని
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న עִירను సందర్భంలోని ముందుగా ప్రస్తావించిన పట్టణంగా సహజ తెలుగులో ‘ఆ పట్టణాన్ని’ అని అనువదించాం.
- source_word: וּנְתָנָהּ
  choice: దాన్ని ... అప్పగిస్తాడు
  rationale: ఆదేశక్రమం తరువాత వచ్చిన సంపూర్ణ క్రియ నిశ్చయమైన భవిష్యత్ ఫలితాన్ని తెలియజేస్తుంది. ‘అప్పగిస్తాడు’ ఇవ్వడం ద్వారా వారి అధికారంలోకి తేవడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రెండవ పురుష బహువచన ప్రత్యయంతో ఉన్న నిర్మాణాన్ని నేరుగా ‘మీ దేవుడు’గా అందించాం.
- source_word: בְּיֶדְכֶם
  choice: మీ చేతికి
  rationale: హీబ్రూ ‘చేతిలో/చేతికి ఇవ్వడం’ అనే నుడికారం అధికారం లేదా నియంత్రణలోకి అప్పగించడాన్ని సూచిస్తుంది; ‘మీ చేతికి’ ఆ బైబిలీయ రూపకాన్ని తెలుగులో అర్థమయ్యేలా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం; ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: וְהוֹרַשְׁתֶּםలోని స్వాధీనత భావం
  choice: స్వాధీనం చేసుకోండి
  alternative: పట్టుకోండి
  rationale: ఈ క్రియ సైనిక ఆక్రమణతో పాటు అధీనంలోకి తెచ్చుకోవడం లేదా స్వాధీనం పొందడం అనే భావాన్ని కలిగి ఉండగలదు. ప్రధాన పాఠంలో విస్తృత భావాన్ని ఉంచి, సంకుచిత సైనిక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ఆదేశశైలిని వాడాం. రెండవ పురుష బహువచనాన్ని ‘మీరు/మీ’తో స్పష్టంగా ఉంచాం; హీబ్రూ ‘చేతికి అప్పగించడం’ అనే రూపకాన్ని అర్థవంతంగా నిలిపాం.
