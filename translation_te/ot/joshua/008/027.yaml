id: JOS.8.27
reference: Joshua 8:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֣ק הַ/בְּהֵמָ֗ה וּ/שְׁלַל֙ הָ/עִ֣יר הַ/הִ֔יא בָּזְז֥וּ לָ/הֶ֖ם יִשְׂרָאֵ֑ל כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה אֶת יְהוֹשֻֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/027.yaml
  text: Only the livestock and the spoil of that city Israel took as plunder for themselves[b][a], according to the word of Yahweh that he had commanded Joshua.
translation:
  language: te
  text: యహ్వే యెహోషువకు ఆజ్ఞాపించిన మాట ప్రకారం, ఆ పట్టణంలోని పశువులనూ దోపుడు సొత్తునూ మాత్రమే ఇశ్రాయేలీయులు తమకోసం స్వాధీనం చేసుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: అయితే … మాత్రం
  rationale: ముందటి సంపూర్ణ నాశన వృత్తాంతానికి విరుద్ధంగా ఇక్కడ మినహాయింపును సూచిస్తుంది; తెలుగులో ‘అయితే … మాత్రం’ సహజంగా ఆ పరిమితిని తెలియజేస్తుంది.
- source_word: הַבְּהֵמָה
  choice: పశువులను
  rationale: ఇక్కడ యుద్ధంలో స్వాధీనం చేసుకున్న పెంపుడు జంతువులను సూచించే సహజమైన సామూహిక పదం.
- source_word: וּשְׁלַל
  choice: దోపుడు సొమ్మును
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న వస్తువులు లేదా సంపద అనే అర్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּזְזוּ לָהֶם
  choice: తమ కోసం కొల్లగొట్టుకున్నారు
  rationale: בזז అనే క్రియలోని యుద్ధదోపిడి భావాన్నీ, לָהֶם లోని తమ ప్రయోజనం లేదా స్వాధీన భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: ఇక్కడ జాతిని సమూహ కర్తగా సూచిస్తున్నందున తెలుగులో వ్యక్తులను సూచించే బహువచన రూపం సహజంగా ఉంటుంది.
- source_word: כִּדְבַר
  choice: మాట ప్రకారం
  rationale: యహ్వే ఇచ్చిన ఆజ్ఞకు అనుగుణంగా చర్య జరిగిందనే భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
  choice: యెహోషువకు ఆజ్ఞాపించిన
  rationale: సంబంధవాక్యాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచి, ఆ ఆజ్ఞ ముందే యెహోషువకు ఇవ్వబడిందనే సందర్భాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించిన ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా ‘యహ్వే’ అని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. ‘అయితే … మాత్రం’ నిర్మాణం హీబ్రూ వాక్యంలోని మినహాయింపు-ప్రాధాన్యాన్ని సహజంగా ప్రతిబింబిస్తుంది.
