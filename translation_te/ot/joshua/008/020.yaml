source:
  edition: WLC
  text: וַ/יִּפְנ֣וּ אַנְשֵׁי֩ הָ/עַ֨י אַחֲרֵי/הֶ֜ם וַ/יִּרְא֗וּ וְ/הִנֵּ֨ה עָלָ֜ה עֲשַׁ֤ן הָ/עִיר֙ הַ/שָּׁמַ֔יְמָ/ה וְ/לֹא הָיָ֨ה בָ/הֶ֥ם יָדַ֛יִם לָ/נ֖וּס הֵ֣נָּה וָ/הֵ֑נָּה וְ/הָ/עָם֙ הַ/נָּ֣ס הַ/מִּדְבָּ֔ר נֶהְפַּ֖ךְ אֶל הָ/רוֹדֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
translation:
  language: te
  text: అప్పుడు ఆయి పట్టణపు మనుషులు వెనక్కి తిరిగి చూశారు. ఇదిగో, పట్టణపు పొగ ఆకాశంవైపు పైకి లేస్తోంది[a]. ఇటుగానీ అటుగానీ పారిపోవడానికి వారికి శక్తి లేకపోయింది[b]. అరణ్యం వైపు పారిపోయిన ప్రజలు తమను తరుముతున్నవాని మీదికి తిరిగారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వ్యక్తీకరణ అక్షరార్థంగా ‘ఆకాశంవైపు’ అని ఉంది; ‘ఆకాశానికి ఎగసింది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ నుడికారం అక్షరార్థంగా ‘వారిలో చేతులు లేవు’ అని ఉంది; ఇక్కడ అది తప్పించుకునే శక్తి లేదా సామర్థ్యం లేదని అర్థం.
    reason: cultural_note
  - marker: c
    text: హీబ్రూలో ‘తరుముతున్నవాడు’ అని ఏకవచనంలో ఉంది; అది తరుముతున్న సైన్యాన్ని సమూహంగా సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ ... אַחֲרֵיהֶם וַיִּרְאוּ
  choice: వెనక్కి తిరిగి చూశారు
  rationale: తిరగడం, చూడడం అనే రెండు వరుస చర్యలను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: אַנְשֵׁי הָעַי
  choice: హాయి పట్టణపు మనుషులు
  rationale: సైనిక సందర్భంలో హాయి పట్టణానికి చెందిన పురుషులను సూచించే మూలపదానికి దగ్గరగా ఉండి, స్థలనామం పట్టణమని పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: వారు అకస్మాత్తుగా గమనించిన దృశ్యంపై దృష్టి నిలిపే హీబ్రూ కథన సూచిక బలాన్ని కాపాడుతుంది.
- source_word: עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  choice: పట్టణపు పొగ ఆకాశం వైపు పైకి లేస్తోంది
  rationale: పొగ కొనసాగుతూ పైకి లేస్తున్న దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తూ, దిశార్థకమైన ‘ఆకాశం వైపు’ అనే భావాన్ని మతపరమైన అదనపు సూచన లేకుండా అందిస్తుంది.
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם
  choice: వారికి శక్తి లేకపోయింది
  rationale: అక్షరార్థంగా ‘వారిలో చేతులు లేవు’ అనే హీబ్రూ నుడికారానికి ఇక్కడ కార్యసామర్థ్యం లేదా తప్పించుకునే శక్తి లేదనే అర్థం.
- source_word: לָנוּס הֵנָּה וָהֵנָּה
  choice: ఇటుగానీ అటుగానీ పారిపోవడానికి
  rationale: ఏ దిశలోనూ తప్పించుకోలేని స్థితిని తెలుగులో సహజంగా, మూలంలోని జంట దిశాపదాలకు దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: וְהָעָם הַנָּס הַמִּדְבָּר
  choice: అరణ్యం వైపు పారిపోయిన ప్రజలు
  rationale: ముందుగా అరణ్యం వైపు పారిపోతున్నట్లు కనిపించిన సమూహాన్ని గుర్తించి, ఇప్పుడు జరిగిన దిశామార్పును స్పష్టం చేస్తుంది.
- source_word: נֶהְפַּךְ אֶל הָרֹדֵף
  choice: తమను తరుముతున్న వారి మీదికి తిరిగారు
  rationale: యుద్ధ సందర్భంలోని ప్రతిదాడి దిశను వ్యక్తం చేస్తుంది; మూలంలోని ఏకవచన కర్తృవాచక పదం సమూహార్థకంగా ఉండవచ్చనే అంశాన్ని పాదసూచికలో తెలియజేస్తుంది.
