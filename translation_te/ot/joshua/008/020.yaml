  to: అప్పుడు ఆయి పట్టణపు మనుషులు వెనక్కి తిరిగి చూశారు. ఇదిగో, పట్టణపు పొగ ఆకాశంవైపు పైకి లేస్తోంది[a]. ఇటుగానీ అటుగానీ పారిపోవడానికి వారికి శక్తి లేకపోయింది[b]. అరణ్యం వైపు పారిపోయిన ప్రజలు తమను తరుముతున్నవాని మీదికి తిరిగారు[c].
