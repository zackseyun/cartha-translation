  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ నుడికారాన్ని అర్థవంతంగా అనువదించి, దాని అక్షరరూపాన్ని పాదసూచికలో నిలిపాం; సమూహార్థక ఏకవచనంలోని అస్పష్టతను కూడా పాదసూచికలో కాపాడాం.
