translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘హాయి,’ ‘ఇశ్రాయేలు,’ ‘అరాబా’ అనే పేర్లు సాధారణ తెలుగు బైబిలు రూపాలకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని స్థలం/సమయం మరియు భౌగోళిక పదార్థ సందిగ్ధతలు పాదసూచికల్లో నిలుపబడ్డాయి.
