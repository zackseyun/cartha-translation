  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
translation:
  language: te
  text: అప్పుడు హాయి రాజు అది చూసినప్పుడు, అతడూ అతని ప్రజలందరూ త్వరపడి తెల్లవారగానే లేచారు. ఆ పట్టణపు పురుషులు రాజుతోను అతని ప్రజలందరితోను కలిసి, ఇశ్రాయేలుతో యుద్ధం చేయడానికి అరాబాకు ఎదురుగా ఉన్న నిర్ణయించిన స్థలానికి[a] బయలుదేరారు.[b] అయితే పట్టణం వెనుక అతనికి వ్యతిరేకంగా మాటువేసి ఉన్నవారు ఉన్నారని అతనికి తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిర్ణయించిన సమయానికి.’ హీబ్రూ పదం నిర్ణయించిన స్థలాన్నీ సమయాన్నీ సూచించగలదు.
    reason: lexical_ambiguity
  - marker: b
    text: లేదా, ‘మైదానానికి.’ ఇక్కడి హీబ్రూ పదం అరాబా అనే ప్రాంతాన్నిగానీ, సాధారణంగా ఎడారి మైదానం లేదా గడ్డి మైదానాన్నిగానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు
  rationale: హీబ్రూ కథనంలో కొత్త సంఘటనను ముందుకు నడిపించే సాధారణ సూచకం; తెలుగులో సహజమైన కథన అనుసంధానంగా ‘అప్పుడు’ వాడబడింది.
- source_word: כִּרְאוֹת
  choice: చూసిన వెంటనే
  rationale: כְּ + క్రియార్థక నామరూపం కాలసంబంధ భావాన్ని ఇస్తుంది; సందర్భంలో చర్య వెంటనే జరిగిన భావం సహజంగా వ్యక్తమవుతుంది. హీబ్రూలో కర్మ స్పష్టంగా లేకపోవడంతో తెలుగులో ‘అది’ చేర్చబడింది.
- source_word: וַיְמַהֲרוּ וַיַּשְׁכִּימוּ
  choice: వారు త్వరపడి తెల్లవారుజామునే లేచారు
  rationale: రెండు క్రియలూ బహువచనంలో ఉన్నాయి. שׁכם హిఫీల్ రూపానికి ‘తెల్లవారుజామునే లేచారు’ సహజమైన సమీపార్థం.
- source_word: אַנְשֵׁי הָעִיר
  choice: ఆ పట్టణపు పురుషులు
  rationale: అక్షరార్థంగా ‘పట్టణపు పురుషులు’; యుద్ధ సందర్భం వల్ల లింగం, సైనిక సందర్భం రెండూ నిలుస్తాయి.
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  choice: ఇశ్రాయేలును ఎదుర్కొని యుద్ధం చేయడానికి
  rationale: లִקְרַאת యొక్క ‘ఎదుర్కొనడానికి/కలుసుకోవడానికి’ భావాన్ని తరువాతి ‘యుద్ధానికి’ అనే ఉద్దేశంతో సహజంగా కలిపింది.
- source_word: הוּא וְכָל עַמּוֹ
  choice: రాజు, అతని ప్రజలందరూ
  rationale: עַם ను సందర్భానుసారంగా ‘సైన్యం’గా సంకుచితం చేయకుండా మూలంలోని విస్తృతమైన ‘ప్రజలు’ భావం నిలుపబడింది.
- source_word: לַמּוֹעֵד
  choice: నిర్ణయించిన స్థలానికి
  rationale: מוֹעֵד కాలాన్నీ స్థలాన్నీ సూచించగలదు. తరువాత వచ్చే భౌగోళిక వివరణ కారణంగా ఇక్కడ స్థలార్థం ప్రధాన పాఠ్యంలో ఎంచుకోబడింది; కాలార్థం పాదసూచికలో నిలుపబడింది.
- source_word: לִפְנֵי הָעֲרָבָה
  choice: అరాబాకు ఎదురుగా
  rationale: לִפְנֵי యొక్క ‘ముందు/ఎదురుగా’ భావాన్ని సహజ తెలుగులో ఇచ్చింది. עֲרָבָה ను భౌగోళిక నామంగా ఉంచి, సాధారణ భూభాగార్థాన్ని పాదసూచికలో తెలిపింది.
- source_word: אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר
  choice: పట్టణం వెనుక తన కోసం ఒక దళం మాటువేసి ఉంది
  rationale: אֹרֵב మాటువేసిన వ్యక్తి లేదా దళాన్ని సూచించగలదు; యుద్ధ సందర్భంలో ‘మాటువేసిన దళం’ స్పష్టంగా, సహజంగా ఉంది.
