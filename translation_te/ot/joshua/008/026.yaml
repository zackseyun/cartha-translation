source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֨עַ֙ לֹֽא הֵשִׁ֣יב יָד֔/וֹ אֲשֶׁ֥ר נָטָ֖ה בַּ/כִּיד֑וֹן עַ֚ד אֲשֶׁ֣ר הֶחֱרִ֔ים אֵ֖ת כָּל יֹשְׁבֵ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
translation:
  language: te
  text: మరియు యెహోషువ, ఈటెతో చాపిన తన చేతిని, ఆయి నివాసులందరినీ నిర్మూలనకు అంకితం చేసే వరకు వెనక్కి తీసుకోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయి నివాసులందరినీ పూర్తిగా నిర్మూలించే వరకు.” ఇక్కడి హీబ్రూ క్రియ ఏదైనా వ్యక్తిని లేదా వస్తువును ప్రత్యేకంగా నిర్మూలనకు అంకితం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: వెనక్కి తీసుకోలేదు
  rationale: హిఫిల్ రూపానికి ‘తిరిగి తీసుకురావడం’ అనే భావం ఉంది; యుద్ధ సందర్భంలో చాపిన చేతిని ‘వెనక్కి తీసుకోవడం’ సహజమైన తెలుగు ప్రయోగం.
- source_word: יָדוֹ
  choice: తన చేతిని
  rationale: మూలంలోని శరీర భాగ సూచనను నేరుగా నిలుపుతుంది; తెలుగు వాక్యనిర్మాణంలో కర్తకు తిరిగి సూచించేందుకు ‘తన’ సహజం.
- source_word: נָטָה
  choice: చాపిన
  rationale: చేయిని ముందుకు చాచడం లేదా విస్తరించడం అనే మూల భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּכִּידוֹן
  choice: ఈటె పట్టుకొని
  rationale: כידון ఈటె లేదా బల్లెం వంటి ఆయుధాన్ని సూచిస్తుంది. చేతిని ఆయుధంతో చాపాడనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הֶחֱרִים
  choice: నిర్మూలనకు అంకితం చేసేవరకు
  rationale: חרם యొక్క హిఫిల్ రూపంలో ఉన్న నిషేధం కింద ఉంచి నాశనానికి అంకితం చేసే సాంకేతిక భావాన్ని కేవలం ‘నాశనం చేశాడు’గా సరళీకరించకుండా నిలుపుతుంది.
- source_word: כָּל יֹשְׁבֵי הָעָי
  choice: ఐ పట్టణ నివాసులందరినీ
  rationale: ‘ఐలో నివసించే వారందరూ’ అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וִיהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపాన్ని వాడింది; వచనం స్వతంత్రంగా ఉల్లేఖించబడుతున్నందున ఆరంభ సంధికారకాన్ని తెలుగు ప్రవాహంలో ప్రత్యేకంగా చూపలేదు.
theological_decisions:
- issue: యుద్ధ తీర్పు సందర్భంలో חרם పదం అనువాదం
  choice: నిర్మూలనకు అంకితం చేశాడు
  alternative: పూర్తిగా నిర్మూలించాడు
  rationale: ఈ ఎంపిక חרםలోని ప్రత్యేకమైన అంకిత-నిషేధ భావాన్ని కాపాడుతుంది; అదే సమయంలో దాని ఫలితం నిర్మూలన అని స్పష్టం చేస్తుంది. పాఠ్యంలో లేని మతశాఖాపరమైన వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. חרם పదంలోని న్యాయ-ఆరాధన సంబంధిత ఉద్రిక్తతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా నిలిపింది.
