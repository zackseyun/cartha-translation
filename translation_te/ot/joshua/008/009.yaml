base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
translation:
  language: te
  text: యెహోషువ వారిని పంపాడు; వారు మాటువేసే స్థలానికి[a] వెళ్లి, బేతేలు, ఆయి మధ్యలో, ఆయికి పడమరగా ఉండిపోయారు. ఆ రాత్రి యెహోషువ ప్రజల మధ్యలో గడిపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మాటువేసిన దళం దగ్గరకు.’ హీబ్రూ పదం మాటువేసిన దళాన్నిగానీ, మాటువేసే స్థలాన్నిగానీ సూచించగలదు; ఇక్కడ సందర్భం వారు ఆక్రమించిన స్థానాన్ని సూచించడం ఎక్కువగా అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: వారిని పంపాడు
  rationale: שׁלח ఇక్కడ యెహోషువ వారిని వెళ్లేలా పంపాడనే సాధారణ భావాన్ని ఇస్తుంది; ‘పంపాడు’ సహజమైన, స్పష్టమైన తెలుగు.
- source_word: הַמַּאְרָב
  choice: మాటువద్దకు
  rationale: ఈ నామవాచకం మాటువేసే దళాన్నిగానీ, వారు మాటువేసి ఉండే స్థానాన్నిగానీ సూచించగలదు. సందర్భంలో గమ్యస్థాన భావం బలంగా ఉన్నందున ‘మాటువద్దకు’ అని ఇచ్చి, మూలంలోని అర్థవిస్తృతిని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיֵּשְׁבוּ
  choice: ఉండిపోయారు
  rationale: ישׁב అనే క్రియకు కూర్చోవడం, నివసించడం, ఒకచోట ఉండడం అనే భావాలు ఉన్నాయి. ఇక్కడ సైనికులు తమ స్థానంలో నిలిచి ఉన్నారనే సందర్భార్థాన్ని అతిగా వివరించకుండా ‘ఉండిపోయారు’ సహజంగా తెలియజేస్తుంది.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: బేతేలుకు హాయికి మధ్య
  rationale: రెండు ప్రదేశాల మధ్యనున్న భౌగోళిక స్థానాన్ని నేరుగా తెలిపే నిర్మాణం; పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מִיָּם לָעָי
  choice: హాయికి పడమటి వైపున
  rationale: יָם అక్షరార్థంగా ‘సముద్రం’ అయినా, ఇక్కడ భౌగోళిక దిశగా ‘పడమర’ను సూచిస్తుంది.
- source_word: וַיָּלֶן
  choice: గడిపాడు
  rationale: לון ఇక్కడ రాత్రంతా ఒకచోట ఉండడాన్ని సూచిస్తుంది. ‘ఆ రాత్రి ... గడిపాడు’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: בְּתוֹךְ הָעָם
  choice: ప్రజల మధ్య
  rationale: בְּתוֹךְ ఒక సమూహం నడుమ లేదా మధ్య ఉండడాన్ని సూచిస్తుంది; ‘ప్రజల మధ్య’ స్పష్టమైన, సహజమైన అనువాదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని వాడాం. వరుస హీబ్రూ వావ్ సంధులను తెలుగులో సహజంగా ప్రవహించేలా మొదట ‘అప్పుడు’తో, తరువాత వాక్య విభజనతో వ్యక్తం చేశాం; విరుద్ధ భావాన్ని సూచించే పదాన్ని చేర్చలేదు.
