  to: 'అప్పుడు యాహ్వే యెహోషువతో ఇలా అన్నాడు: “భయపడకు, నిరుత్సాహపడకు. యుద్ధవీరులందరినీ[a] నీతో తీసుకొని, లేచి హాయికి ఎక్కి వెళ్లు. చూడు, హాయి రాజును, అతని ప్రజలను, అతని పట్టణాన్ని, అతని దేశాన్ని నీ చేతికి అప్పగించాను.”'
