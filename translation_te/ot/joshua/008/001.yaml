id: JOS.8.1
reference: Joshua 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే యెహోషువతో ఇలా అన్నాడు: “భయపడకు, నిరుత్సాహపడకు. యుద్ధవీరులందరినీ[a] నీతో తీసుకొని, లేచి హాయికి ఎక్కి వెళ్లు. చూడు, హాయి రాజును, అతని ప్రజలను, అతని పట్టణాన్ని, అతని దేశాన్ని నీ చేతికి అప్పగించాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా “యుద్ధపు ప్రజలందరినీ”; సందర్భంలో యుద్ధంలో పాల్గొనే బలగమంతటినీ సూచిస్తుంది. “యోధులందరినీ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: భయపడకు, దిగులుపడకు
  rationale: రెండు వేర్వేరు నిషేధ ఆజ్ఞలను నిలుపుతూ, రెండవ క్రియలోని మనోధైర్యం కోల్పోయే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: קַח עִמְּךָ
  choice: నీతో తీసుకొని
  rationale: ‘నీతో’ అనే హీబ్రూ సంబంధపదాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כָּל עַם הַמִּלְחָמָה
  choice: యుద్ధవీరులందరినీ
  rationale: అక్షరార్థంగా ‘యుద్ధపు ప్రజలందరు’; సందర్భంలో పోరాడే సైనిక బలగాన్ని సూచిస్తుంది. ‘యుద్ధవీరులు’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וְקוּם עֲלֵה
  choice: లేచి ... వెళ్లు
  rationale: రెండు ఆజ్ఞల క్రమాన్ని నిలుపుతుంది; హాయి వైపు భౌగోళికంగా ‘ఎక్కి వెళ్లు’ అనేది సాధ్యమైనా, ఆధునిక తెలుగులో గమ్యానికి బయలుదేరే భావానికి ‘వెళ్లు’ సహజంగా ఉంటుంది.
- source_word: הָעָי
  choice: హాయి
  rationale: స్థలనామాన్ని తెలుగు బైబిలు వాడుకలో గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం.
- source_word: רְאֵה
  choice: చూడు
  rationale: దైవిక హామీపై దృష్టి పెట్టించే ఆజ్ఞార్థక పదం; ప్రాచీన శైలిని ఆశ్రయించకుండా మూలంలోని సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: נָתַתִּי בְיָדְךָ
  choice: నీ చేతికి అప్పగించాను
  rationale: హీబ్రూ సంపూర్ణ క్రియలోని నిశ్చితమైన, పూర్తయిన హామీని నిలుపుతూ ‘చేతికి ఇవ్వడం’ అనే అధికారాధీనత భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מֶלֶךְ הָעַי
  choice: హాయి రాజును
  rationale: హీబ్రూ సమాస సంబంధాన్ని నేరుగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: עַמּוֹ וְאֶת עִירוֹ וְאֶת אַרְצוֹ
  choice: అతని ప్రజలను, అతని పట్టణాన్ని, అతని దేశాన్ని
  rationale: ఏకవచన పుంలింగ ప్రత్యయాన్ని రాజుతో అనుసంధానించి, మూలంలోని సమాంతర జాబితాను నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; దాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం; ‘యాహ్వే’ ఉచ్చారణపరమైన ప్రత్యామ్నాయం.
- issue: נָתַתִּי అనే సంపూర్ణ క్రియలో దైవిక హామీ
  choice: అప్పగించాను
  alternative: అప్పగిస్తున్నాను
  rationale: విజయం ఇంకా చారిత్రకంగా అమలుకావలసి ఉన్నా, హీబ్రూ సంపూర్ణ రూపం దానిని దేవుని నిర్ణయంలో నిశ్చితమైనదిగా చెబుతుంది. అందుకే పూర్తయిన క్రియారూపాన్ని నిలిపాం.
- issue: כָּל עַם הַמִּלְחָמָה లోని సైనిక సమూహ సూచన
  choice: యుద్ధవీరులందరినీ
  alternative: యుద్ధపు ప్రజలందరినీ
  rationale: ఈ పదబంధం సమస్త జనాభాను కాక యుద్ధంలో పాల్గొనే బలగాన్ని సూచిస్తుంది. వ్యాఖ్యానాత్మకంగా ‘సైన్యం’ అని కుదించకుండా, వ్యక్తుల సమూహ భావాన్ని నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ఆజ్ఞలు ఏకవచనంలో నేరుగా ఉంచబడ్డాయి. మూలంలోని పునరుక్త ‘అతని’ నిర్మాణం ఉద్దేశపూర్వకంగా నిలుపబడింది; పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
