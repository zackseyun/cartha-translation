  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הָ/עָ֨ם הַ/מִּלְחָמָ֜ה אֲשֶׁ֣ר אִתּ֗/וֹ עָלוּ֙ וַֽ/יִּגְּשׁ֔וּ וַ/יָּבֹ֖אוּ נֶ֣גֶד הָ/עִ֑יר וַֽ/יַּחֲנוּ֙ מִ/צְּפ֣וֹן לָ/עַ֔י וְ/הַ/גַּ֖י בינ/ו וּ/בֵין הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/011.yaml
  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
translation:
  language: te
  text: అతనితో ఉన్న యుద్ధదళమంతా పైకి వెళ్లి సమీపించి, పట్టణానికి ఎదురుగా వచ్చి, ఆయికి ఉత్తరంగా మకాం వేశారు; అతనికీ, ఆయికీ మధ్య లోయ ఉండగా ఇలా జరిగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “అతనికీ, ఆయికీ మధ్య.” ఏకవచన సర్వనామం బహుశా యెహోషువను సూచిస్తుంది; అయితే కొందరు దీనిని సమూహార్థంగా “వారికీ, ఆయికీ మధ్య” అని అర్థం చేసుకుంటారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  choice: యుద్ధ ప్రజలందరూ
  rationale: అక్షరార్థంగా ‘యుద్ధపు ప్రజలందరూ.’ ఇది పౌరులందరినీ కాక యుద్ధంలో పాల్గొనే సమూహాన్ని సూచిస్తుంది. ‘యుద్ధ ప్రజలు’ అనే రూపం עָם లోని సామూహిక భావాన్ని, మూలంలో లేని పురుష లింగ నిర్దిష్టతను చేర్చకుండా నిలుపుతుంది.
- source_word: אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న
  rationale: యెహోషువతో పాటు ఉన్న యుద్ధ ప్రజలను గుర్తించే సంబంధవాచక ఉపవాక్యం.
- source_word: עָלוּ
  choice: పైకి వెళ్లి
  rationale: עלה యొక్క సాధారణ దిశార్థమైన ‘పైకి వెళ్లడం’ను నిలుపుతుంది; సందర్భానికి మించిన ‘దండెత్తి వెళ్లడం’ వంటి వివరణను చేర్చదు.
- source_word: וַיִּגְּשׁוּ
  choice: సమీపించారు
  rationale: נגשׁ సూచించే దగ్గరకు రావడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיָּבֹאוּ נֶגֶד הָעִיר
  choice: పట్టణానికి ఎదురుగా వచ్చి
  rationale: נֶגֶד లోని ‘ఎదురుగా/ముఖాముఖిగా’ ఉన్న స్థాన భావాన్ని, పట్టణంలోకి ప్రవేశించారనే అర్థం రాకుండా నిలుపుతుంది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה అనే శిబిరం వేసి నిలిచే చర్యకు సహజమైన తెలుగు ప్రయోగం.
- source_word: מִצְּפוֹן לָעַי
  choice: హాయికి ఉత్తరంగా
  rationale: హాయి పట్టణానికి సంబంధించి వారి మకాం ఉన్న దిశను సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: הַגַּי
  choice: లోయ
  rationale: גַּי కి విస్తృతమైన, సాధారణ పాఠకులకు సులభమైన సమానార్థం; ‘కనుమ’ లేదా ‘లోతైన వాగు’ వంటి మరింత నిర్దిష్ట భౌగోళిక అర్థాన్ని రుద్దదు.
- source_word: בֵּינוֹ וּבֵין הָעָי
  choice: అతనికి, హాయికి మధ్య
  rationale: హీబ్రూ వ్యంజన పాఠంలోని మూడవ పురుష ఏకవచన పురుష ప్రత్యయాన్ని యథాతథంగా నిలుపుతుంది. ఇది సహజంగా యెహోషువను సూచించవచ్చు; అయితే సమూహార్థ అవగాహన కూడా సాధ్యమే.
