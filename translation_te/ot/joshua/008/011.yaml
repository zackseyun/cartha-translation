translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూ కథనంలోని వరుస కదలికలను నిలిపి, మూలంలో లేని లింగ నిర్దిష్టతను లేదా సైనిక వివరణను చేర్చలేదు. ప్రధాన పాఠంలో ఉన్న క్లిష్టమైన ఏకవచనాన్ని పాదటిప్పణితో సహా సంరక్షించాం.
