id: JOS.8.18
reference: Joshua 8:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ נְ֠טֵה בַּ/כִּיד֤וֹן אֲשֶׁר בְּ/יָֽדְ/ךָ֙ אֶל הָ/עַ֔י כִּ֥י בְ/יָדְ/ךָ֖ אֶתְּנֶ֑/נָּה וַ/יֵּ֧ט יְהוֹשֻׁ֛עַ בַּ/כִּיד֥וֹן אֲשֶׁר בְּ/יָד֖/וֹ אֶל הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
translation:
  language: te
  text: అప్పుడు యాహ్వే యెహోషువతో, “నీ చేతిలో ఉన్న ఈటెను[a] ఆయి వైపు చాపు; ఎందుకంటే దాన్ని నీ చేతికి అప్పగిస్తాను” అని చెప్పాడు. అప్పుడు యెహోషువ తన చేతిలో ఉన్న ఈటెను ఆ పట్టణం వైపు చాపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బల్లెము” లేదా “విసిరే ఈటె.” హీబ్రూ పదం כִּידוֹן సందర్భానుసారం ఈటె, బల్లెము లేదా విసిరే ఈటెను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని ప్రత్యేక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిప్యంతరీకరణలో నిలుపుతుంది.
- source_word: נְטֵה / וַיֵּט (נטה)
  choice: చాపు / చాపాడు
  rationale: ఆయుధాన్ని ఒక దిశగా పొడిగించి పట్టే భౌతిక సంజ్ఞను సహజమైన తెలుగులో తెలియజేస్తుంది; కేవలం ‘చూపు’ అని అర్థాన్ని పరిమితం చేయదు.
- source_word: כִּידוֹן
  choice: బల్లెము
  rationale: ఇది ఈటె, బల్లెము, విసిరే ఈటె వంటి ఆయుధాన్ని సూచించగల పదం. ‘బల్లెము’ సందర్భానికి సరిపోయే గౌరవప్రదమైన సాధారణ పదం; అసలు పదంలోని ఖచ్చిత ఆయుధరకం అనిశ్చితిని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: אֲשֶׁר בְּיָדְךָ / אֲשֶׁר בְּיָדוֹ
  choice: నీ చేతిలో ఉన్న / తన చేతిలో ఉన్న
  rationale: హీబ్రూ సంబంధవాచక నిర్మాణాన్ని స్పష్టంగా నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: אֶל הָעַי
  choice: హాయి వైపు
  rationale: దిశను సూచించే אֶל భావాన్ని ‘వైపు’ సహజంగా వ్యక్తం చేస్తుంది; పట్టణంపై దాడి చేయమనే అదనపు భావాన్ని చేర్చదు.
- source_word: כִּי בְיָדְךָ אֶתְּנֶנָּה
  choice: ఎందుకంటే దాన్ని నీ చేతికి అప్పగిస్తాను
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ అధికార-అప్పగింత నుడికారాన్ని తెలుగులో అర్థవంతంగా నిలుపుతుంది; క్రియ యొక్క భవిష్యత్ భావాన్ని కూడా కాపాడుతుంది.
- source_word: אֶל הָעִיר
  choice: ఆ పట్టణం వైపు
  rationale: మొదట స్థలనామం, తరువాత ‘పట్టణం’ అని ఉన్న హీబ్రూ పదవైవిధ్యాన్ని సమన్వయం చేయకుండా కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం YHWH అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: వచనంలో יְהוָה అనే ప్రత్యేక దైవనామం నేరుగా ఉంది. దాన్ని సాధారణ బిరుదుతో మార్చకుండా, మూలనామానికి సమీపమైన తెలుగు రూపంలో అందించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘నీ చేతికి అప్పగిస్తాను’ అనే రూపం హీబ్రూ నుడికారంలోని అధికారానికి అప్పగించే భావాన్ని స్పష్టంగా తెలియజేస్తుంది. పాదటిప్పణి గుర్తు సంబంధిత ఆయుధపదం వెంట ఉంచబడింది.
