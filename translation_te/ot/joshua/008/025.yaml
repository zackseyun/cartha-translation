source:
  edition: WLC
  text: וַ/יְהִי֩ כָל הַ/נֹּ֨פְלִ֜ים בַּ/יּ֤וֹם הַ/הוּא֙ מֵ/אִ֣ישׁ וְ/עַד אִשָּׁ֔ה שְׁנֵ֥ים עָשָׂ֖ר אָ֑לֶף כֹּ֖ל אַנְשֵׁ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
translation:
  language: te
  text: ఆ రోజున పురుషుల నుండి స్త్రీల వరకు నేలకొరిగినవారు మొత్తం పన్నెండు వేల మంది—అంటే ఐ పట్టణ ప్రజలందరూ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఐ పట్టణ నివాసులందరూ.” హీబ్రూలో అక్షరార్థంగా “ఐ పురుషులందరూ”; ఇక్కడ అది పట్టణ జనాభాను సమష్టిగా సూచించే నుడికారం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: మొత్తం ... మంది
  rationale: హీబ్రూ היה రూపం ఇక్కడ ఫలితాన్ని లేదా సారాంశాన్ని తెలిపే వాక్యాన్ని ప్రవేశపెడుతుంది. తెలుగులో ప్రత్యేకంగా ‘జరిగింది’ అని చేర్చకుండా సంఖ్యను తెలిపే సహజ వాక్య నిర్మాణంలో దాని భావం వ్యక్తమవుతుంది.
- source_word: כָל הַנֹּפְלִים
  choice: నేలకొరిగినవారు
  rationale: נפל అనే పదానికి అక్షరార్థంగా ‘పడినవారు’ అని అర్థం; యుద్ధ సందర్భంలో అది మరణించినవారిని సూచిస్తుంది. ‘నేలకొరిగినవారు’ మూలంలోని రూపకాన్ని నిలుపుతూ ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాలాన్ని సూచించే హీబ్రూ పదబంధానికి సహజమైన, నేరమైన తెలుగు రూపం.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: పురుషుని మొదలుకొని స్త్రీ వరకు
  rationale: మూలంలోని ఏకవచన పంపిణీ నిర్మాణాన్నీ, జనాభా అంతటినీ కలుపుకునే సమగ్ర భావాన్నీ నిలుపుతుంది.
- source_word: שְׁנֵים עָשָׂר אָלֶף
  choice: పన్నెండు వేల మంది
  rationale: సంఖ్యను నేరుగా అనువదిస్తూ, వ్యక్తులను లెక్కిస్తున్నందున సహజ తెలుగుకు ‘మంది’ చేర్చబడింది.
- source_word: כֹּל אַנְשֵׁי הָעָי
  choice: వారంతా ఐ పట్టణ ప్రజలే
  rationale: אַנְשֵׁי అనే పదం అక్షరార్థంగా ‘పురుషులు’ అయినా, ఇక్కడ ముందే స్త్రీలు కూడా స్పష్టంగా చేర్చబడ్డారు; అందువల్ల ఈ పదబంధం పట్టణ జనాభాను సమష్టిగా సూచించే నుడికారంగా గ్రహించబడింది. ‘ప్రజలు’ ఆ సమష్టి భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; అక్షరార్థం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions:
- issue: మృతుల సారాంశంలోని లింగ సూచక భాష
  choice: ‘పురుషుని మొదలుకొని స్త్రీ వరకు’ అని లింగ సూచనను నిలిపి, చివరి నుడికారాన్ని ‘ఐ పట్టణ ప్రజలు’ అని అనువదించడం
  alternative: ‘ఐ పట్టణ పురుషులందరూ’
  rationale: మొదటి పదబంధం పురుషులను, స్త్రీలను స్పష్టంగా కలుపుతుంది. చివరి אַנְשֵׁי הָעָי అక్షరార్థంగా ‘ఐ పురుషులు’ అయినప్పటికీ ఈ సందర్భంలో పట్టణ జనాభాను సమష్టిగా సూచించవచ్చు. ప్రధాన పాఠం సందర్భానుసార సమష్టి భావాన్ని ఇస్తూ, మూలంలోని పదప్రయోగాన్ని పాదటిప్పణిలో పారదర్శకంగా నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి ఉపయోగించబడింది. ‘నేలకొరిగినవారు’ యుద్ధ సందర్భంలోని మరణార్థాన్ని స్పష్టంగా తెలియజేస్తూనే హీబ్రూ రూపకాన్ని నిలుపుతుంది. ఎమ్-డాష్ చివరి సమానాధికార సారాంశాన్ని గుర్తిస్తుంది.
