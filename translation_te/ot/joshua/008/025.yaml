revisions:
- from: ఆ రోజున పురుషుని మొదలుకొని స్త్రీ వరకు నేలకొరిగినవారు మొత్తం పన్నెండు వేల మంది—వారంతా ఐ పట్టణ ప్రజలే.[a]
  to: ఆ రోజున పురుషుల నుండి స్త్రీల వరకు నేలకొరిగినవారు మొత్తం పన్నెండు వేల మంది—అంటే ఐ పట్టణ ప్రజలందరూ.[a]
  rationale: Minor idiomatic revisions improve modern Telugu flow and make the final appositional total explicit, without changing the source’s ambiguity concerning אַנְשֵׁי הָעָי. The note preserves the literal masculine Hebrew expression and documents the corporate alternative.
  reviewer_model: gpt-5.6-terra
