source:
  edition: WLC
  text: וַ/יָּ֧קָם יְהוֹשֻׁ֛עַ וְ/כָל עַ֥ם הַ/מִּלְחָמָ֖ה לַ/עֲל֣וֹת הָ/עָ֑י וַ/יִּבְחַ֣ר יְ֠הוֹשֻׁעַ שְׁלֹשִׁ֨ים אֶ֤לֶף אִישׁ֙ גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/יִּשְׁלָחֵ֖/ם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/003.yaml
  text: So Joshua and all the fighting people rose to go up against Ai[a], and Joshua chose thirty thousand men, mighty men of valor[c][b], and sent them out by night.
translation:
  language: te
  text: అప్పుడు యెహోషువ, యుద్ధంలో పోరాడే వారందరూ ఆయి మీదికి వెళ్లడానికి లేచారు.[a] యెహోషువ ముప్పై వేలమంది పరాక్రమవంతులైన యోధులను ఎన్నుకొని, రాత్రివేళ వారిని పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయి వైపుకు పైకి వెళ్లడానికి.” హెబ్రీలో “పైకి వెళ్లడం” అనే మాట ఉంది; సైనిక సందర్భంలో అది ఆయి మీదికి కదలడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ కథనంలో చర్య ప్రారంభాన్ని సూచిస్తుంది. ‘లేచి’ అనేది బయలుదేరడాన్ని అతిగా వ్యాఖ్యానించకుండా హెబ్రీ కథన క్రమాన్ని నిలుపుతుంది.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: యుద్ధానికి సిద్ధంగా ఉన్న ప్రజలందరూ
  rationale: అక్షరార్థంగా ‘యుద్ధపు ప్రజలందరూ.’ עַם లోని సమష్టి భావాన్ని నిలుపుతూ, సందర్భంలోని సైనిక పాత్రను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘సైన్యం’ కంటే తక్కువ సంస్థాగతమైన పదబంధం.
- source_word: לַעֲלוֹת הָעָי
  choice: హాయి పట్టణం మీదికి వెళ్లారు
  rationale: עלה మూలంగా ‘పైకి వెళ్లడం’ అనే దిశాభావాన్ని కలిగి ఉన్నా, ఇక్కడ సైనిక సందర్భంలో పట్టణానికి వ్యతిరేకంగా కదలడాన్ని సూచిస్తుంది. ‘మీదికి వెళ్లారు’ దిశాభావాన్నీ శత్రుత్వ సందర్భాన్నీ నిలుపుతుంది.
- source_word: הָעָי
  choice: హాయి పట్టణం
  rationale: స్థలనామాన్ని తెలుగులో ‘హాయి’గా లిప్యంతరీకరించి, సాధారణ పాఠకునికి అది నగరమని స్పష్టమయ్యేందుకు ‘పట్టణం’ జోడించబడింది.
- source_word: וַיִּבְחַר
  choice: ఎన్నుకొని
  rationale: בחר అంటే ‘ఎన్నుకొను/ఎంచుకొను.’ కథన ప్రవాహంలో ‘ఎన్నుకొని’ సహజంగా ఉంది.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: ముప్పై వేలమంది
  rationale: మూలంలోని సంఖ్యను, వ్యక్తులను సూచించే אִישׁ భావాన్ని సహజమైన తెలుగు సంఖ్యారూపంలో వ్యక్తం చేస్తుంది.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: ఈ సైనిక పదబంధం శక్తి, సామర్థ్యం, శౌర్యం గల పోరాట యోధులను సూచిస్తుంది. ఈ అనువాదం పురాతన శైలిని ఆశ్రయించకుండా రెండు పదాల బలాన్నీ అందిస్తుంది.
- source_word: וַיִּשְׁלָחֵם
  choice: వారిని పంపించాడు
  rationale: שלח తో కూడిన బహువచన కర్మప్రత్యయం ‘వారిని పంపించాడు’ అని నేరుగా అర్థమిస్తుంది; సందర్భం అవసరమైన సైనిక కదలికను తెలియజేస్తుంది.
- source_word: לָיְלָה
  choice: రాత్రివేళ
  rationale: ఇది కాలాన్ని సూచించే క్రియావిశేషణ ప్రయోగం. ‘రాత్రివేళ’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
