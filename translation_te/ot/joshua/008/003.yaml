- from: కాబట్టి యెహోషువ, యుద్ధానికి సిద్ధంగా ఉన్న ప్రజలందరూ లేచి హాయి పట్టణం మీదికి వెళ్లారు.[a] యెహోషువ ముప్పై వేలమంది పరాక్రమవంతులైన యోధులను ఎన్నుకొని, రాత్రివేళ వారిని పంపించాడు.
