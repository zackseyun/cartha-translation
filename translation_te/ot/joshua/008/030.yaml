id: JOS.8.30
reference: Joshua 8:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֣ז יִבְנֶ֤ה יְהוֹשֻׁ֨עַ֙ מִזְבֵּ֔חַ לַֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר עֵיבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/030.yaml
  text: Then Joshua built an altar to Yahweh[a], the God of Israel, on Mount Ebal.
translation:
  language: te
  text: అప్పుడు యెహోషువ ఇశ్రాయేలు దేవుడైన యాహ్వేకు ఏబాలు కొండపై ఒక బలిపీఠం కట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సూచించే కాలవాచక క్రియావిశేషణం; ఆధునిక తెలుగులో సహజంగా కథన క్రమాన్ని కొనసాగిస్తుంది.
- source_word: יִבְנֶה
  choice: కట్టాడు
  rationale: రూపపరంగా imperfect అయినప్పటికీ, אָז తరువాత కథన సందర్భంలో పూర్తయిన గత సంఘటనను సూచిస్తుంది; తెలుగు సాధారణ భూతకాలం తగినది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: מִזְבֵּחַ
  choice: ఒక బలిపీఠం
  rationale: బలి అర్పణకు నిర్మించిన పీఠాన్ని సూచిస్తుంది; ఈ సందర్భంలో మొదటి ప్రస్తావన కావడంతో ‘ఒక’ సహజంగా ఉంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: לְ సమర్పణ లేదా ఉద్దేశాన్ని సూచిస్తుంది. దైవనామమైన יהוהను తెలుగులో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించి, చతుర్థీ విభక్తితో అందించాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: యెహోవాను ఇశ్రాయేలు దేవునిగా గుర్తించే construct సంబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: בְּהַר עֵיבָל
  choice: ఏబాలు కొండమీద
  rationale: בְּ ఇక్కడ స్థలాన్ని సూచిస్తుంది; కొండపై జరిగిన చర్యను తెలుగులో ‘కొండమీద’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా పేరుగానే ఉంచాం; తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠ్యంలో వాడి, మూలరూపానికి దగ్గరైన ‘యాహ్వే’ను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘ఇశ్రాయేలు దేవుడైన యెహోవాకు’ అనే సహజ తెలుగు నిర్మాణంలో మూలంలోని అన్వయాన్ని నిలిపాం.
