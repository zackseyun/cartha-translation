  yaml_path: translation/ot/joshua/008/010.yaml
  text: Joshua rose early in the morning and mustered the people[a], and he and the elders of Israel went up before the people to Ai.
translation:
  language: te
  text: యెహోషువ ఉదయాన్నే లేచి ప్రజలను సమీకరించాడు[a]; అతడూ ఇశ్రాయేలు పెద్దలూ ప్రజల ముందు హాయికి పైకి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రజలను లెక్కించాడు’ లేదా ‘ప్రజలను పరిశీలించాడు.’ ఇక్కడి హీబ్రూ క్రియ లెక్కించడం, పరిశీలించడం, నియమించడం లేదా సైనికంగా సమీకరించడం అనే అర్థాలను ఇవ్వగలదు; ఈ సైనిక సందర్భంలో ‘సమీకరించాడు’ అనేది తగినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם יְהוֹשֻׁעַ בַּבֹּקֶר
  choice: యెహోషువ ఉదయాన్నే లేచి
  rationale: హిఫిల్ రూపంలోని שׁכם ‘తెల్లవారగానే/ఉదయాన్నే లేవడం’ అనే భావాన్ని ఇస్తుంది. ‘ఉదయాన్నే లేచి’ కాల ప్రాధాన్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיִּפְקֹד אֶת־הָעָם
  choice: ప్రజలను సమీకరించాడు
  rationale: פקד అనే క్రియకు లెక్కించడం, తనిఖీ చేయడం, నియమించడం, సైనిక సమీకరణ చేయడం వంటి అర్థాలు ఉన్నాయి. హాయి మీద దాడికి సిద్ధమవుతున్న సైనిక సందర్భంలో ‘సమీకరించాడు’ అనేది అనవసరంగా కేవలం లెక్కపెట్టడానికే పరిమితం కాకుండా ప్రధాన భావాన్ని అందిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలను / ప్రజలకు
  rationale: మూలపాఠం ‘ప్రజలు’ అనే విస్తృత పదాన్నే వాడుతుంది. సందర్భం యోధులను సూచించినా, ‘సైన్యం’ అని సంకుచితం చేయకుండా మూలంలోని పదప్రయోగాన్ని నిలిపాం.
- source_word: וַיַּעַל
  choice: వెళ్లారు
  rationale: עלה ప్రాథమికంగా ‘పైకి వెళ్లడం’ అని అర్థం. తెలుగులో గమ్యస్థానానికి ‘పైకి వెళ్లారు’ అనడం అసహజంగా లేదా అవసరానికి మించి భౌగోళిక భావాన్ని బలపరచవచ్చు; అందుచేత సందర్భానుకూలంగా ‘వెళ్లారు’ ఎంచుకున్నాం.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: అతడూ ఇశ్రాయేలు పెద్దలూ
  rationale: స్పష్ట సర్వనామం యెహోషువను పెద్దలతో కలిపి ప్రత్యేకంగా చూపుతుంది. సంయుక్త కర్తను తెలుగులో సహజంగా, ఖచ్చితంగా వ్యక్తం చేశాం.
- source_word: לִפְנֵי הָעָם
  choice: ప్రజలకు ముందుగా
  rationale: לפני అంటే ‘ముందు/ఎదుట’. ఇక్కడ ప్రయాణ క్రమంలో ప్రజల ముందు ఉన్నారనే భావాన్ని, ‘నాయకత్వం వహిస్తూ’ అని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: הָעָי
  choice: హాయి పట్టణానికి
  rationale: స్థలనామాన్ని తెలుగులో ప్రాచుర్యమున్న ‘హాయి’గా లిప్యంతరీకరించాం. సాధారణ పదమైన ‘హాయి’తో గందరగోళం రాకుండా గమ్యస్థానమని స్పష్టం చేయడానికి ‘పట్టణానికి’ చేర్చాం.
