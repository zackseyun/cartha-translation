translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. సైనిక సందర్భాన్ని స్పష్టం చేస్తూనే మూలంలోని ‘ప్రజలు’ అనే విస్తృత పదాన్ని నిలిపాం; פקד పదంలోని నిజమైన అర్థ వైవిధ్యాన్ని పాదసూచికలో భద్రపరిచాం.
