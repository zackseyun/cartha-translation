  text: וְ/אַֽחֲרֵי כֵ֗ן קָרָא֙ אֶת כָּל דִּבְרֵ֣י הַ/תּוֹרָ֔ה הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה כְּ/כָל הַ/כָּת֖וּב בְּ/סֵ֥פֶר הַ/תּוֹרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/034.yaml
  text: And afterward he read all the words of the law[a], the blessing and the curse[b], according to all that is written in the Book of the Law.
translation:
  language: te
  text: ఆ తరువాత అతడు ధర్మశాస్త్రం[b]లోని మాటలన్నిటినీ—ఆశీర్వాదాన్నీ శాపాన్నీ—ధర్మశాస్త్ర గ్రంథంలో వ్రాయబడి ఉన్నదంతటి ప్రకారం చదివాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చదివాడు” అని అనువదించిన హీబ్రూ క్రియకు ఈ సందర్భంలో “ప్రకటించాడు” లేదా “బహిరంగంగా చదివాడు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ధర్మశాస్త్రం” అని అనువదించిన హీబ్రూ తోరా అనే పదానికి “ఉపదేశం” అని కూడా అర్థం. ఇక్కడ నిబంధన పత్రం ప్రస్తావన వల్ల “ధర్మశాస్త్రం” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: ఈ పదబంధం మునుపటి కార్యాల తరువాత జరిగిన కాలక్రమాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా కథన అనుసంధానాన్ని నిలుపుతుంది.
- source_word: קָרָא
  choice: బిగ్గరగా చదివాడు
  rationale: ధర్మశాస్త్రంలోని మాటలు ప్రత్యక్ష కర్మగా ఉన్న ఈ బహిరంగ సందర్భంలో, క్రియ చదివి వినిపించడం లేదా ప్రకటించడం అనే భావాన్ని ఇస్తుంది. 'బిగ్గరగా చదివాడు' ప్రజల సమక్షంలో జరిగిన పఠనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת כָּל דִּבְרֵי הַתּוֹרָה
  choice: ధర్మశాస్త్రంలోని మాటలన్నిటినీ
  rationale: דִּבְרֵי అనే స్పష్టమైన 'మాటలు' భావాన్ని నిలుపుతూ, పత్రరూప నిబంధన సందర్భంలో תּוֹרָהను 'ధర్మశాస్త్రం'గా అనువదిస్తుంది.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: ఆశీర్వాదాన్ని, శాపాన్ని
  rationale: ఏకవచన రూపాలు నిబంధనలోని ఆశీర్వాదం, శాపం అనే సమగ్ర విభాగాలను సూచిస్తాయి; మూలంలోని సమాంతరతను నిలుపుతుంది.
- source_word: כְּכָל הַכָּתוּב
  choice: రాసి ఉన్నదంతటి ప్రకారం
  rationale: యెహోషువ చదివినది లిఖిత ప్రమాణానికి అనుగుణంగా ఉందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּסֵפֶר הַתּוֹרָה
  choice: ధర్మశాస్త్ర గ్రంథంలో
  rationale: סֵפֶרను సందర్భానుగుణంగా 'గ్రంథం'గా, תּוֹרָהను పత్రరూప నిబంధన సందర్భంలో 'ధర్మశాస్త్రం'గా అందిస్తుంది.
theological_decisions:
- issue: תּוֹרָה పదానికి 'ధర్మశాస్త్రం' లేదా 'ఉపదేశం' అనే అనువాదం
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం
  rationale: תּוֹרָהకు విస్తృతంగా 'ఉపదేశం' అనే అర్థం ఉన్నప్పటికీ, ఇక్కడ ఆశీర్వాదం-శాపం కలిగిన లిఖిత నిబంధన పత్రం ప్రస్తావన 'ధర్మశాస్త్రం'ను సందర్భానికి తగిన ఎంపికగా చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని కాలక్రమం, 'మాటలన్నీ,' ఆశీర్వాదం-శాపం అనే జంట, లిఖిత గ్రంథానికి అనుగుణత అన్నీ నిలుపబడ్డాయి. పాదసూచిక సూచికలు ప్రధాన వచనంలో రెండూ చేర్చబడ్డాయి.
