  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని ఉపయోగించాం. సైనిక సందర్భాన్ని ‘మోహరించారు’ తెలియజేస్తుంది; అయితే ‘ప్రజలు,’ ‘శిబిరం,’ ‘వెనుక భాగం’ వంటి మూలపాఠంలోని పదభేదాలను అనవసరంగా సైనిక సాంకేతిక పదాలుగా మార్చలేదు.
