source:
  edition: WLC
  text: וַ/יָּשִׂ֨ימוּ הָ/עָ֜ם אֶת כָּל הַֽ/מַּחֲנֶ֗ה אֲשֶׁר֙ מִ/צְּפ֣וֹן לָ/עִ֔יר וְ/אֶת עֲקֵב֖/וֹ מִ/יָּ֣ם לָ/עִ֑יר וַ/יֵּ֧לֶךְ יְהוֹשֻׁ֛עַ בַּ/לַּ֥יְלָה הַ/ה֖וּא בְּ/ת֥וֹךְ הָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
translation:
  language: te
  text: కాబట్టి ప్రజలు పట్టణానికి ఉత్తరంగా ఉన్న శిబిరమంతటినీ, దాని వెనుక భాగాన్ని[a] పట్టణానికి పడమరగా[b] మోహరించారు. యెహోషువ ఆ రాత్రి లోయ మధ్యలోకి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని వెనుక రక్షక దళాన్ని.”
    reason: alternative_reading
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా “పట్టణానికి సముద్రం వైపున”; ఇక్కడ “సముద్రం” దిశను సూచిస్తూ “పడమర” అనే అర్థంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: మోహరించారు
  rationale: שׂים అనే విస్తృతార్థక క్రియకు ‘ఉంచారు/అమర్చారు’ అనే అర్థాలు ఉన్నా, ఇక్కడ సైనిక బలగాలను ఉద్దేశపూర్వకంగా స్థానాల్లో నిలిపిన సందర్భాన్ని ‘మోహరించారు’ సహజంగా తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సందర్భంలో యోధులు ఉద్దేశించబడినప్పటికీ, హెబ్రీ పాఠంలో ఉన్న విస్తృత పదమైన ‘ప్రజలు’నే నిలుపుతుంది.
- source_word: כָּל הַמַּחֲנֶה
  choice: శిబిరమంతటినీ
  rationale: כָּל మరియు מַחֲנֶהలను నేరుగా, సహజమైన తెలుగులో తెలియజేస్తుంది; ‘సైన్యం’ అని మార్చి మూలపాఠాన్ని కుదించదు.
- source_word: אֲשֶׁר מִצְּפוֹן לָעִיר
  choice: పట్టణానికి ఉత్తరంగా ఉన్న
  rationale: శిబిరం పట్టణానికి సంబంధించి ఏ దిశలో ఉందో స్పష్టంగా, సహజంగా తెలుపుతుంది.
- source_word: עֲקֵבוֹ
  choice: దాని వెనుక భాగాన్ని
  rationale: עָקֵב యొక్క మూలభావమైన ‘మడమ/వెనుక భాగం’ను నిలుపుతుంది. ‘వెనుక దళం’ సాధ్యమైన సైనిక అర్థమే అయినా, అది కొంత ఎక్కువ వివరణాత్మకం కాబట్టి పాదసూచికలో ఇచ్చబడింది.
- source_word: מִיָּם לָעִיר
  choice: పట్టణానికి పడమరగా
  rationale: యָם అక్షరార్థంగా ‘సముద్రం’ అయినా, హెబ్రీ భౌగోళిక దిశా ప్రయోగంలో సాధారణంగా పడమరను సూచిస్తుంది.
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: הלך అనే సాధారణ గమన క్రియకు సందర్భానుకూలమైన సరళ తెలుగు రూపం.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: కాలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּתוֹךְ הָעֵמֶק
  choice: లోయ మధ్యలోకి
  rationale: గమన క్రియతో కలిసి, లోయ మధ్యభాగంలోకి జరిగిన కదలికను తెలియజేస్తుంది.
