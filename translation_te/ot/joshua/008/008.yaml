source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/תָפְשְׂ/כֶ֣ם אֶת הָ/עִ֗יר תַּצִּ֤יתוּ אֶת הָ/עִיר֙ בָּ/אֵ֔שׁ כִּ/דְבַ֥ר יְהוָ֖ה תַּעֲשׂ֑וּ רְא֖וּ צִוִּ֥יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
translation:
  language: te
  text: మీరు ఆ పట్టణాన్ని స్వాధీనం చేసుకున్నప్పుడు, ఆ పట్టణానికి నిప్పంటించాలి. యహ్వే మాట ప్రకారం[a] మీరు చేయాలి. చూడండి, నేను మీకు ఆజ్ఞాపించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వే ఆజ్ఞ ప్రకారం అలాగే చేయాలి.” హీబ్రూ పదబంధం అక్షరార్థంగా, “యహ్వే మాట ప్రకారం మీరు చేయాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  choice: మీరు … స్వాధీనం చేసుకున్నప్పుడు
  rationale: ఈ నిర్మాణం తరువాతి చర్యకు ముందు జరిగే పట్టణ స్వాధీనాన్ని కాలసంబంధ ఉపవాక్యంగా సూచిస్తుంది. ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉండి సైనిక సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעִיר
  choice: ఆ పట్టణం
  rationale: ఇక్కడ עִיר సైనిక దాడికి గురైన నివాసస్థలాన్ని సూచిస్తుంది; సందర్భంలో ముందే ప్రస్తావించిన పట్టణం కనుక ‘ఆ పట్టణం’ సహజం.
- source_word: תַּצִּיתוּ אֶת־הָעִיר בָּאֵשׁ
  choice: ఆ పట్టణానికి నిప్పంటించాలి
  rationale: יצת హిఫీల్ రూపం అగ్ని అంటించడం అనే కారణార్థాన్ని కలిగి ఉంది. ‘నిప్పంటించాలి’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כִּדְבַר יְהוָה
  choice: యెహోవా మాట ప్రకారం
  rationale: דָּבָר యొక్క ‘మాట’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, כְ ఉపసర్గలోని ‘ప్రకారం’ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందించబడింది.
- source_word: תַּעֲשׂוּ
  choice: మీరు చేయాలి
  rationale: ఇక్కడ అపూర్ణ క్రియ ఆదేశార్థక బలంతో ఉంది. ‘చేయాలి’ ఆధునిక తెలుగులో ఆ నిర్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: רְאוּ
  choice: చూడండి
  rationale: ఇది బహువచన శ్రోతల దృష్టిని ఆకర్షించే ప్రత్యక్ష ఆజ్ఞ. ‘చూడండి’ మూలంలోని దృశ్య క్రియను, దాని ఉద్బోధక బలాన్ని నిలుపుతుంది.
- source_word: צִוִּיתִי אֶתְכֶם
  choice: నేను మీకు ఆజ్ఞాపించాను
  rationale: పూర్తయిన ఆజ్ఞాపన చర్యను సరళంగా వ్యక్తం చేస్తూ, బహువచన సంబోధనను ‘మీకు’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం బిరుదును కాకుండా దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల వ్యక్తిగత నామాన్ని తెలుగులో లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: כִּדְבַר יְהוָה లో דָּבָר భావం
  choice: యెహోవా మాట ప్రకారం
  alternative: యెహోవా ఆజ్ఞ ప్రకారం
  rationale: సందర్భంలో ఇది ఆజ్ఞను సూచించవచ్చుగానీ, హీబ్రూ పదం అక్షరార్థంగా ‘మాట/విషయం.’ ప్రధాన పాఠంలో ‘మాట’ను ఉంచి, సందర్భానుకూల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇవ్వడం అసలు పదబంధంలోని విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన, కథనానికి తగిన శైలి వాడబడింది. రెండవ పురుష బహువచనం అంతటా నిలుపబడింది. మూలంలోని పునరుక్తి (‘పట్టణం’) మరియు సంక్షిప్త ఆజ్ఞల వరుస సాధ్యమైనంతవరకు కాపాడబడ్డాయి.
