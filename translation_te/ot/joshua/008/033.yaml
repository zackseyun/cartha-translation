source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֡ל וּ/זְקֵנָ֡י/ו וְ/שֹׁטְרִ֣ים וְ/שֹׁפְטָ֡י/ו עֹמְדִ֣ים מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לָ/אָר֡וֹן נֶגֶד֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם נֹשְׂאֵ֣י אֲר֣וֹן בְּרִית יְהוָ֗ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח חֶצְי/וֹ֙ אֶל מ֣וּל הַר גְּרִזִ֔ים וְ/הַֽ/חֶצְי֖/וֹ אֶל מ֣וּל הַר עֵיבָ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֜ה מֹשֶׁ֣ה עֶֽבֶד יְהוָ֗ה לְ/בָרֵ֛ךְ אֶת הָ/עָ֥ם יִשְׂרָאֵ֖ל בָּ/רִאשֹׁנָֽה־׀׀׀׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజలందరూ—వారి పెద్దలు, అధికారులు, న్యాయాధిపతులతో సహా, నివాస పరదేశులూ స్థానికులూ సమానంగా—యహ్వే నిబంధన మందసాన్ని మోస్తున్న లేవీయ యాజకులకు ఎదురుగా, మందసానికి ఇటు అటు నిలబడ్డారు[a]. వారిలో సగం గెరిజీము కొండకు ఎదురుగా, మిగతా సగం ఏబాలు కొండకు ఎదురుగా నిలబడ్డారు. ఇశ్రాయేలు ప్రజలను ఆశీర్వదించమని యహ్వే సేవకుడైన మోషే మొదట[b] ఆజ్ఞాపించిన ప్రకారమే వారు అలా నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నివాస విదేశీయుడూ స్థానికుడూ ఒకే విధంగా.”
    reason: గేర్ మరియు ఎజ్రాహ్ అనే సామాజిక వర్గాలకు ప్రత్యామ్నాయ సహజ తెలుగు రూపం.
  - marker: b
    text: హీబ్రూలో “మొదట.” ఇది “మొదటి కార్యంగా” అని అర్థం కావచ్చు; లేదా మోషే ఇంతకుముందు ఇచ్చిన ఆజ్ఞను సూచించవచ్చు.
    reason: కాలసూచక పదబంధంలోని నిజమైన ద్వంద్వార్థాన్ని సంరక్షించడం.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలందరూ
  rationale: జాతి మొత్తాన్ని సూచించే సమష్టి భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו
  choice: వారి పెద్దలు, అధికారులు, న్యాయాధిపతులతో సహా
  rationale: ప్రత్యయాలు ఇశ్రాయేలు సమాజానికే చెందిన నాయకులను సూచిస్తాయి; ‘అధికారులు’ పరిపాలనా పాత్రను, ‘న్యాయాధిపతులు’ న్యాయపాత్రను స్పష్టంగా తెలియజేస్తాయి.
- source_word: מִזֶּה וּמִזֶּה לָאָרוֹן
  choice: మందసానికి ఇటూ అటూ
  rationale: మూలంలోని రెండు వైపుల స్థలవిభజనను సంక్షిప్తంగా, దృశ్యమానంగా నిలుపుతుంది.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: లేవీయ యాజకులు
  rationale: యాజకులు లేవీ వంశానికి చెందినవారనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; appositional ambiguityని అవసరం లేకుండా అధికంగా వివరిచదు.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: యెహోవా నిబంధన మందసాన్ని మోస్తున్న
  rationale: హీబ్రూ వర్తమాన కృదంతపు కార్యవివరణను నేరుగా నిలుపుతూ, నిబంధన మందసానికి యెహోవాతో ఉన్న సంబంధాన్ని స్పష్టంగా చెబుతుంది.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: నివాస పరదేశులూ, స్వదేశంలో పుట్టినవారూ ఒకే విధంగా
  rationale: గేర్ అనేది సమాజం మధ్య నివసించే పరదేశిని, ఎజ్రాహ్ స్థానికంగా పుట్టిన సభ్యుణ్ని సూచిస్తుంది; సమాన భాగస్వామ్యాన్ని ‘ఒకే విధంగా’ తెలియజేస్తుంది.
- source_word: חֶצְיוֹ ... וְהַחֶצְיוֹ
  choice: ప్రజల్లో సగం ... మిగతా సగం
  rationale: ప్రత్యయం కూడిన సమూహాన్నే సూచిస్తుందని తెలుగులో స్పష్టం చేసి, రెండు భాగాల విభజనను సహజంగా అందిస్తుంది.
- source_word: בָּרִאשֹׁנָה
  choice: మొదట
  rationale: మూలపదం యొక్క సంక్షిప్తతను, అది ‘మొదటి కార్యంగా’ లేదా ‘మునుపు’ అనే రెండు అవకాశాలు కలిగి ఉండటాన్ని ప్రధాన పాఠ్యంలో పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: యెహోవా అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత నిబంధన నామమైన יהוה ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందించాం.
- issue: గేర్ మరియు ఎజ్రాహ్ సమాన భాగస్వామ్యం
  choice: నివాస పరదేశులూ, స్వదేశంలో పుట్టినవారూ ఒకే విధంగా
  alternative: అన్యులూ ఇశ్రాయేలీయులూ
  rationale: మూలంలోని సామాజిక-చట్టపరమైన వర్గాలను తరువాతి కాలపు మతపరమైన విభాగాలుగా మార్చకుండా, ఈ కార్యక్రమంలో వారి సమాన చేర్పును నిలుపుతుంది.
- issue: בָּרִאשֹׁנָה యొక్క కాల/క్రమ భావం
  choice: మొదట
  alternative: మునుపు; మొదటి కార్యంగా
  rationale: ఈ పదబంధం మోషే గతంలో ఇచ్చిన ఆజ్ఞను సూచించవచ్చు లేదా ఆశీర్వాదాన్ని మొదటి కార్యంగా చేయడాన్ని సూచించవచ్చు; ప్రధాన పాఠ్యం ఆ ఉద్రిక్తతను నిలుపి, పాదసూచికలో అవకాశాలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘మందసం,’ ‘లేవీయ యాజకులు,’ ‘నిబంధన’ వంటి బైబిలు సందర్భానికి అవసరమైన పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా విభజించాం.
