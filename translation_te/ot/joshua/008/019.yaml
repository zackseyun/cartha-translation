  text: וְ/הָ/אוֹרֵ֡ב קָם֩ מְהֵרָ֨ה מִ/מְּקוֹמ֤/וֹ וַ/יָּר֨וּצוּ֙ כִּ/נְט֣וֹת יָד֔/וֹ וַ/יָּבֹ֥אוּ הָ/עִ֖יר וַֽ/יִּלְכְּד֑וּ/הָ וַֽ/יְמַהֲר֔וּ וַ/יַּצִּ֥יתוּ אֶת הָ/עִ֖יר בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/019.yaml
  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
translation:
  language: te
  text: అప్పుడు మాటువేసి ఉన్న దళంలోని వారు తమ స్థలం నుండి వెంటనే లేచి, అతడు తన చేయి చాపగానే[a] పరుగెత్తి నగరంలోకి ప్రవేశించారు. వారు ఆ నగరాన్ని స్వాధీనం చేసుకొని, త్వరపడి దానికి నిప్పంటించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతడు తన చేయి చాపినప్పుడు’ అని కూడా అనువదించవచ్చు. హెబ్రీ నిర్మాణం అతని సంకేతం ఇచ్చిన క్షణాన్ని సూచిస్తుంది; అది తక్షణ స్పందనను లేదా సాధారణ కాలసంబంధాన్ని తెలియజేసేలా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹרֵב
  choice: మాటువేసి ఉన్న దళం
  rationale: ఈ పదం మాటువేసి వేచివున్న సైనిక సమూహాన్ని సమష్టిగా సూచిస్తుంది. ‘దళం’ అనే పదం అమూర్తమైన ‘మాటు’ కంటే వ్యక్తుల సమూహాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  choice: తమ స్థలం నుంచి వెంటనే లేచి
  rationale: קום ఇక్కడ దాగివున్న దళం చర్యకు దిగడాన్ని సూచిస్తుంది; מְהֵרָה దాని తక్షణత్వాన్ని తెలియజేస్తుంది. సమష్టి దళంలోని సభ్యులను దృష్టిలో ఉంచి సహజమైన తెలుగులో ‘తమ స్థలం’ వాడబడింది.
- source_word: וַיָּרֻצוּ
  choice: పరుగెత్తి
  rationale: బహువచన క్రియ దళంలోని సభ్యుల చర్యను సూచిస్తుంది. మూలార్థమైన వేగంగా పరుగెత్తడాన్ని నేరుగా నిలుపుతుంది.
- source_word: כִּנְטוֹת יָדוֹ
  choice: అతడు తన చెయ్యి చాపగానే
  rationale: כְּ తో కూడిన infinitive construct కాలసంబంధాన్ని, సందర్భంలో సంకేతం ఇచ్చిన క్షణానికే స్పందించడాన్ని సూచిస్తుంది. ‘చాపగానే’ ఆ తక్షణ క్రమాన్ని సహజంగా వ్యక్తపరుస్తుంది; కేవలం ‘చాపినప్పుడు’ అనే అర్థసంభావ్యతను పాదసూచికలో ఉంచాం.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: పట్టణంలోకి ప్రవేశించింది
  rationale: בוא ఇక్కడ గమ్యస్థానంలోకి వెళ్లడాన్ని సూచిస్తుంది. ‘ప్రవేశించింది’ ఆధునిక, గౌరవప్రదమైన సైనిక వర్ణనకు సరిపోతుంది.
- source_word: וַיִּלְכְּדוּהָ
  choice: దాన్ని స్వాధీనం చేసుకొని
  rationale: לכד పట్టణాన్ని పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే సైనిక భావాన్ని ఇస్తుంది. ‘స్వాధీనం చేసుకున్నారు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיְמַהֲרוּ
  choice: త్వరపడి
  rationale: తరువాతి చర్యను ఆలస్యం లేకుండా చేసినట్లు ఈ క్రియ ప్రత్యేకంగా నొక్కిచెబుతుంది. ముందున్న מְהֵרָה పునరుక్తిని కూడా అనువాదంలో నిలుపుతుంది.
- source_word: וַיַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: ఆ పట్టణానికి నిప్పంటించారు
  rationale: Hiphil రూపం అగ్ని అంటించే కారణక చర్యను సూచిస్తుంది. ‘నిప్పంటించారు’ సహజమైన ఆధునిక తెలుగు; అదనంగా ‘అగ్నితో’ అనడం తెలుగులో అనవసర పునరుక్తి అవుతుంది.
