source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֨עַ וְ/כָֽל יִשְׂרָאֵ֜ל רָא֗וּ כִּֽי לָכַ֤ד הָֽ/אֹרֵב֙ אֶת הָ/עִ֔יר וְ/כִ֥י עָלָ֖ה עֲשַׁ֣ן הָ/עִ֑יר וַ/יָּשֻׁ֕בוּ וַ/יַּכּ֖וּ אֶת אַנְשֵׁ֥י הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
translation:
  language: te
  text: యెహోషువ మరియు ఇశ్రాయేలీయులందరూ మాటువేసిన దళం[a] పట్టణాన్ని స్వాధీనం చేసుకుందని, పట్టణపు పొగ పైకి లేచిందని చూసినప్పుడు, వెనుదిరిగి ఆయి పురుషులను కొట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాటువేసి ఉన్నవారు.” హీబ్రూ పదం మాటువేసి ఉన్న వ్యక్తుల సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ
  choice: చూసినప్పుడు
  rationale: చూడడం, గ్రహించడం రెండింటినీ సూచించగల సాధారణ క్రియ. ఇక్కడ పొగను ప్రత్యక్షంగా చూడడం సహా తరువాతి రెండు ఉపవాక్యాలు వారు గమనించిన విషయాన్ని తెలియజేస్తాయి; కాబట్టి concrete narrative senseను నిలుపుతుంది.
- source_word: כִּי ... וְכִי
  choice: …అని, …అని
  rationale: యెహోషువ, ఇశ్రాయేలీయులు చూసిన విషయాన్ని తెలిపే content clausesగా సహజమైన తెలుగులో అనువదించబడింది.
- source_word: לָכַד
  choice: స్వాధీనం చేసుకుందని
  rationale: పట్టుకోవడం లేదా జయించి స్వాధీనపరచుకోవడం అనే అర్థం. పట్టణంపై సైనిక చర్య సందర్భంలో ఈ రూపం సహజంగా ఉంది.
- source_word: הָאֹרֵב
  choice: మాటువేసిన దళం
  rationale: మాటువేసి ఉన్న వ్యక్తులను లేదా దళాన్ని సూచించే participial collective. తెలుగులో వ్యక్తులతో కూడిన సైనిక బృందం అని స్పష్టమవుతుంది; 'మాటు' అనే అమూర్త పదం వల్ల కలిగే అస్పష్టతను నివారిస్తుంది.
- source_word: הָעִיר
  choice: పట్టణం
  rationale: నిర్దిష్ట పట్టణాన్ని సూచించే సాధారణ నామవాచకం; వచనంలో పునరుక్తిని స్పష్టత కోసం నిలుపుకుంది.
- source_word: עָלָה עֲשַׁן הָעִיר
  choice: పట్టణపు పొగ పైకి లేచిందని
  rationale: హీబ్రూ పదబంధంలోని పైకి కదలిక చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיָּשֻׁבוּ
  choice: వెనుదిరిగి
  rationale: యుద్ధంలో దిశను మార్చి తిరిగి పోరాటానికి రావడం అనే సందర్భోచిత భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: וַיַּכּוּ
  choice: హతమార్చారు
  rationale: נכה యుద్ధసందర్భంలో ప్రాణాంతకంగా కొట్టివేయడాన్ని సాధారణంగా సూచిస్తుంది. హాయి పురుషులపై తిరిగి దాడిచేసిన ఈ సందర్భంలో 'హతమార్చారు' సహజమైన, బలమైన తెలుగు ప్రయోగం.
- source_word: אַנְשֵׁי הָעָי
  choice: హాయి పట్టణపు పురుషులను
  rationale: אַנְשֵׁי యొక్క లింగనిర్దిష్టమైన 'పురుషులు' భావాన్ని నిలుపుతుంది; మూలం స్పష్టంగా 'యోధులు' అని పరిమితం చేయనందున అలా అనువదించలేదు.
