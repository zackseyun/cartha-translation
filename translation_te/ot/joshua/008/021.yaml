translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యుద్ధకథనానికి తగిన గంభీరతతో రూపొందించబడింది. హీబ్రూ వాక్యక్రమంలోని పరిశీలన—తిరుగుదల—దాడి వరుసను నిలుపుకుంది.
