translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచన శైలిలో అనువదించబడింది. వ్యూహాత్మక సందర్భాన్ని స్పష్టంగా ఉంచుతూ మూలంలోని సాధారణ పదాలను అనవసరంగా సైనిక సాంకేతిక పదాలుగా మార్చలేదు.
