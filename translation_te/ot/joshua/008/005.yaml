id: JOS.8.5
reference: Joshua 8:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֗י וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתִּ֔/י נִקְרַ֖ב אֶל הָ/עִ֑יר וְ/הָיָ֗ה כִּֽי יֵצְא֤וּ לִ/קְרָאתֵ֨/נוּ֙ כַּ/אֲשֶׁ֣ר בָּ/רִֽאשֹׁנָ֔ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/005.yaml
  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
translation:
  language: te
  text: నేనూ నాతో ఉన్న ప్రజలందరమూ పట్టణానికి దగ్గరవుతాం[a]. వారు మొదటిసారిలాగే[b] మనకు ఎదురుగా బయలుదేరి వచ్చినప్పుడు, మనం వారి ఎదుట నుంచి పారిపోతాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పట్టణం సమీపానికి వస్తాం.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మొదట జరిగినట్లే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרַב
  choice: దగ్గరవుతాం
  rationale: קרב అనే క్రియ పట్టణం వైపు సమీపించడాన్ని సూచిస్తుంది. ప్రణాళికగా చెప్పబడుతున్న భవిష్యత్ చర్యను సహజమైన ఆధునిక తెలుగులో ‘దగ్గరవుతాం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలందరమూ
  rationale: עם యొక్క సాధారణ అర్థమైన ‘ప్రజలు’నే ఉంచి, దానిని ‘సైనికులు’ లేదా ‘పురుషులు’ అని సందర్భానికి మించి సంకుచితం చేయలేదు.
- source_word: אֲשֶׁר אִתִּי
  choice: నాతో ఉన్న
  rationale: యెహోషువతో కలిసి ఉన్న సమూహాన్ని గుర్తించే సంబంధవాచక భావాన్ని సంక్షిప్తమైన సహజ తెలుగు నిర్మాణంతో తెలిపింది.
- source_word: וְהָיָה כִּי
  choice: వచ్చినప్పుడు
  rationale: తదుపరి సంఘటనను పరిచయం చేసే హెబ్రీ కాలసూచక నిర్మాణాన్ని తెలుగులో సహజమైన ‘-నప్పుడు’ రూపంతో వ్యక్తం చేసింది.
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  choice: మనకు ఎదురుగా బయలుదేరి వచ్చినప్పుడు
  rationale: יצא + לקראת లోని బయటకు రావడం, ఎదుర్కొనేందుకు రావడం అనే రెండు చలన భావాలనూ ఇది నిలుపుతుంది; ‘దాడి చేయడానికి’ అని ఉద్దేశాన్ని అదనంగా నిర్దేశించదు.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: మొదటిసారిలాగే
  rationale: మునుపటి ఆయి సంఘటనను సూచించే ‘మొదట జరిగినట్లే’ అనే భావాన్ని సహజంగా, సందర్భోచితంగా తెలియజేస్తుంది.
- source_word: וְנַסְנוּ
  choice: మనం ... పారిపోతాం
  rationale: נוס లోని బలమైన ‘పారిపోవడం’ అనే భావాన్ని నిలుపుతుంది; ‘వెనక్కి తగ్గుతాం’ అని మృదువుగా చేయలేదు. ఈ క్రమంలో ఉద్దేశించిన భవిష్యత్ చర్యను సూచిస్తుంది.
- source_word: לִפְנֵיהֶם
  choice: వారి ఎదుట నుంచి
  rationale: נוס తో కలిసినప్పుడు వారి సమక్షం నుంచి పారిపోవడం అనే హెబ్రీ ప్రయోగాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַאֲנִי וְכָל הָעָם
  choice: నేనూ ... ప్రజలందరమూ
  rationale: ప్రారంభ వావ్ తెలిపే అనుసంధానం తెలుగులో ‘-నూ ... -మూ’ సముచ్చయ నిర్మాణంలో సహజంగా ప్రతిఫలిస్తుంది; బహువచన క్రియ వక్తతో పాటు మొత్తం సమూహాన్ని కలుపుతుంది.
