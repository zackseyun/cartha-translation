  terminology: “ప్రజలు” properly preserves the broad sense of הָעָם rather than narrowing it to soldiers. “పట్టణం,” “దగ్గరవుతాం,” and “పారిపోతాం” are accurate, accessible choices. The footnote anchors are correctly placed and the footnotes correspond to the stated lexical alternatives.
