source:
  edition: WLC
  text: וְ/אֶת מֶ֧לֶךְ הָ/עַ֛י תָּלָ֥ה עַל הָ/עֵ֖ץ עַד עֵ֣ת הָ/עָ֑רֶב וּ/כְ/ב֣וֹא הַ/שֶּׁמֶשׁ֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ וַ/יֹּרִ֧ידוּ אֶת נִבְלָת֣/וֹ מִן הָ/עֵ֗ץ וַ/יַּשְׁלִ֤יכוּ אוֹתָ/הּ֙ אֶל פֶּ֨תַח֙ שַׁ֣עַר הָ/עִ֔יר וַ/יָּקִ֤ימוּ עָלָי/ו֙ גַּל אֲבָנִ֣ים גָּד֔וֹל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
translation:
  language: te
  text: ఆయి రాజును అతడు ఒక చెట్టుకు సాయంకాలం వరకు వేలాడదీశాడు[a]. సూర్యుడు అస్తమించినప్పుడు[b] యెహోషువ ఆజ్ఞాపించగా, వారు అతని మృతదేహాన్ని చెట్టు నుండి దించి, పట్టణ ద్వారం ప్రవేశం వద్ద పడవేశారు. అతని మీద పెద్ద రాళ్ల కుప్పను పేర్చారు; అది ఈనాటివరకు నిలిచి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ క్రియకు ‘వేలాడదీయడం’ లేదా ‘తగిలించడం’ అని అర్థం; అది మరణవిధానాన్ని స్వయంగా నిర్దిష్టం చేయదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సూర్యాస్తమయ సమయంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּלָה
  choice: వేలాడదీశాడు
  rationale: హీబ్రూ క్రియలో ఉన్న ‘వేలాడదీయడం/తగిలించడం’ అనే సాధారణ భావాన్ని నిలుపుతుంది; ‘ఉరితీశాడు’ లేదా ‘కొయ్యకు గుచ్చాడు’ అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הָעֵץ
  choice: ఒక చెట్టు
  rationale: עֵץ సాధారణంగా ‘చెట్టు’ లేదా ‘కలప’ అని అర్థం. ఇక్కడ కలపతో చేసిన నిర్మాణం సూచితమై ఉండవచ్చు, అయినా మూలంలోని సాదా పదప్రయోగాన్ని ‘చెట్టు’ నిలుపుతుంది.
- source_word: עַד עֵת הָעָרֶב
  choice: సాయంకాలం వరకు
  rationale: కాలపరిమితిని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: సూర్యుడు అస్తమించినప్పుడు
  rationale: హీబ్రూ నుడికారంలోని సూర్యాస్తమయ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: נִבְלָתוֹ
  choice: అతని మృతదేహాన్ని
  rationale: మరణించిన శరీరాన్ని సూచించే మూలపదపు స్పష్టతను నిలుపుతూ, మనిషిని అవమానించేలా వినిపించని సాధారణ తెలుగు పదాన్ని వాడుతుంది.
- source_word: וַיַּשְׁלִיכוּ אֹתָהּ
  choice: పడవేశారు
  rationale: విసిరివేయడం అనే బలమైన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: పట్టణ ద్వార ప్రవేశం దగ్గర
  rationale: ‘ద్వారం యొక్క ప్రవేశం/తెరువు’ అనే మూల నిర్మాణాన్ని సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో అందిస్తుంది.
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: పెద్ద రాళ్ల కుప్ప
  rationale: రాళ్లతో చేసిన పెద్ద గుట్ట లేదా కుప్ప అనే భావాన్ని సరళంగా, ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు ఉంది
  rationale: కథకుని కాలం వరకు ఆ రాళ్ల కుప్ప కొనసాగి ఉందనే సూత్రప్రాయ భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ప్రారంభ వాక్యంలోని కర్త
  choice: ‘అతడు’ అని ఏకవచన కర్తగా అనువదించడం; సందర్భంలో అది యెహోషువను సూచిస్తుంది
  alternative: ‘వారు ఆయి రాజును వేలాడదీశారు’ అని బహువచనంగా అనువదించడం
  rationale: హీబ్రూలో క్రియ తృతీయ పురుష ఏకవచనంలో ఉంది, కానీ కర్త పేరు ఆ ఉపవాక్యంలో ప్రత్యక్షంగా లేదు. తరువాతి ఉపవాక్యంలో యెహోషువ పేరు స్పష్టంగా వస్తుంది. కాబట్టి మూలంలోని ఏకవచనాన్ని, స్వల్ప సూచనాత్మకతను ‘అతడు’ నిలుపుతుంది.
- issue: వేలాడదీయడం మరణవిధానమా లేక మృతదేహ ప్రదర్శనమా
  choice: ‘వేలాడదీశాడు’ అని తటస్థంగా ఉంచడం
  alternative: ‘ఉరితీశాడు’ లేదా ‘కొయ్యకు గుచ్చాడు’ అని నిర్దిష్ట మరణవిధానంగా చెప్పడం
  rationale: תָּלָה స్వయంగా ఉరిశిక్షనో గుచ్చివేతనో నిర్దిష్టంగా చెప్పదు. అందువల్ల మూలంలోని చారిత్రక అస్పష్టతను అనువాదం పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి వాడబడింది. ‘మృతదేహం,’ ‘పట్టణ ద్వార ప్రవేశం,’ ‘రాళ్ల కుప్ప’ వంటి పదాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంపికయ్యాయి; మూలంలోని ఏకవచన కర్త మరియు వేలాడదీయడంలోని అస్పష్టత నిలుపబడ్డాయి.
