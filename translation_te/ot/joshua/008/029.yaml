  to: ఆయి రాజును అతడు ఒక చెట్టుకు సాయంకాలం వరకు వేలాడదీశాడు[a]. సూర్యుడు అస్తమించినప్పుడు[b] యెహోషువ ఆజ్ఞాపించగా, వారు అతని మృతదేహాన్ని చెట్టు నుండి దించి, పట్టణ ద్వారం ప్రవేశం వద్ద పడవేశారు. అతని మీద పెద్ద రాళ్ల కుప్పను పేర్చారు; అది ఈనాటివరకు నిలిచి ఉంది.
  rationale: సవరణలు అర్థాన్ని మార్చవు. పట్టణ ద్వారం ప్రవేశస్థానాన్ని సూచించే పదబంధాన్ని సహజీకరించాం, చెట్టు నుండి దించడాన్ని స్పష్టీకరించాం, మరియు చివరి హీబ్రూ సూత్రవాక్యాన్ని కథన దృష్టికోణంతో కూడిన సహజ తెలుగు వాక్యంగా చేశాం. వేలాడదీయడంలోని చారిత్రక అస్పష్టత, అలాగే ప్రారంభంలోని సూచిత ఏకవచన కర్త, నిలుపబడ్డాయి.
