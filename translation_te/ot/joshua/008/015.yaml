source:
  edition: WLC
  text: וַ/יִּנָּֽגְע֛וּ יְהוֹשֻׁ֥עַ וְ/כָל יִשְׂרָאֵ֖ל לִ/פְנֵי/הֶ֑ם וַ/יָּנֻ֖סוּ דֶּ֥רֶךְ הַ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/015.yaml
  text: And Joshua and all Israel let themselves be beaten before them and fled by the way of the wilderness[a][b].
translation:
  language: te
  text: యెహోషువ, ఇశ్రాయేలు అంతా వారి ఎదుట ఓడిపోయి, అరణ్యానికి వెళ్లే దారి గుండా పారిపోయారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి ఎదుట ఓడిపోయారు.’ సందర్భాన్ని బట్టి, అయి పట్టణపు మనుష్యులను పట్టణం నుంచి దూరంగా రప్పించడానికి వారు ఓడిపోయినట్లు నటించారని భావించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అరణ్య మార్గంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְעוּ
  choice: ఓడిపోయినట్లు కనబడేలా చేసి
  rationale: నిఫాల్ రూపం సైనిక సందర్భంలో ఓడిపోవడం లేదా దెబ్బతినడం అనే భావాన్ని ఇస్తుంది. అయితే ఈ సందర్భంలో ఇది శత్రువును పట్టణం నుంచి దూరంగా రప్పించడానికి చేసిన వ్యూహాత్మక నకిలీ ఓటమి. ఈ అనువాదం ఆ సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, వారు నిజంగా ఓడిపోయారని తేల్చదు.
- source_word: לִפְנֵיהֶם
  choice: వారి ఎదుట
  rationale: לִפְנֵי + ప్రత్యయం యొక్క స్థలసంబంధ భావాన్ని సహజంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయారు
  rationale: נוּס అనే క్రియకు ఉన్న సాధారణమైన ‘పారిపోవడం’ భావాన్ని నేరుగా అందిస్తుంది; ‘వెనుదిరిగారు’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: అరణ్యానికి వెళ్లే దారిలో
  rationale: דֶּרֶךְ అనేది దారి లేదా మార్గం; ఈ పదబంధం అరణ్యానికి వెళ్లే దారిని లేదా అరణ్య దిశలోని మార్గాన్ని సూచించగలదు. ఎంపిక చేసిన రూపం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: יְהוֹשֻׁעַ וְכָל יִשְׂרָאֵל
  choice: యెహోషువ, ఇశ్రాయేలీయులందరూ
  rationale: ‘ఇశ్రాయేలు అంతా’ అనే సామూహిక భావాన్ని సాధారణ తెలుగు పాఠకులకు సహజంగా ‘ఇశ్రాయేలీయులందరూ’ అని అందిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు నిజంగా ఓడిందా, లేక ఓడినట్లు నటించిందా?
  choice: ఓడిపోయినట్లు కనబడేలా చేసి
  alternative: వారి ఎదుట ఓడిపోయి
  rationale: క్రియారూపం సాధారణ నిష్క్రియార్థాన్ని అనుమతించినప్పటికీ, పరిసర కథనం దీనిని పన్నిన యుద్ధ వ్యూహంగా చూపుతుంది. ప్రధాన పాఠం వ్యూహాత్మక భావాన్ని తెలియజేస్తుంది; సరళ నిష్క్రియార్థాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వ్యూహాత్మక నకిలీ ఓటమిని స్పష్టంగా సూచించినప్పటికీ, హెబ్రీ క్రియలోని నిష్క్రియార్థ సాధ్యతను పాదసూచికలో భద్రపరిచాం. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తు [a], [b] అనుగుణంగా చేర్చబడింది.
