  text: And he commanded them, saying, “Look, you are to lie in ambush against the city, behind the city. Do not go very far from the city, and all of you must be ready.”
translation:
  language: te
  text: 'అతడు వారికి ఇలా ఆజ్ఞాపించాడు: “చూడండి, మీరు పట్టణం వెనుకగా, పట్టణంపై దాడి చేయడానికి మాటువేసి ఉండాలి. పట్టణానికి చాలా దూరంగా వెళ్లకండి. మీరందరూ సిద్ధంగా ఉండండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרְבִים לָעִיר
  choice: పట్టణం మీద దాడి చేయడానికి మాటువేసి ఉండాలి
  rationale: אֹרְבִים మాటువేసి ఉండడాన్ని సూచిస్తుంది; לָעִיר లక్ష్యమైన పట్టణాన్ని సూచిస్తుంది. తెలుగులో ఉద్దేశాన్ని సహజంగా స్పష్టం చేయడానికి ‘దాడి చేయడానికి’ చేర్చబడింది.
- source_word: מֵאַחֲרֵי הָעִיר
  choice: పట్టణం వెనుకవైపు
  rationale: పట్టణానికి వెనుకనున్న స్థానాన్ని ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: נְכֹנִים
  choice: సిద్ధంగా
  rationale: ఈ సందర్భంలో సైనిక చర్యకు సంసిద్ధంగా ఉండాలనే భావాన్ని నేరుగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సైనిక ఆజ్ఞా శైలి. హీబ్రూ వాక్యంలోని పునరుక్తిని వీలైనంతగా నిలుపుతూ, లక్ష్యభాషలో స్పష్టత కోసం వాక్యక్రమాన్ని స్వల్పంగా సర్దుబాటు చేశాం.
