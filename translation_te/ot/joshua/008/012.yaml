  yaml_path: translation/ot/joshua/008/012.yaml
  text: And he took about five thousand men and set them in ambush between Bethel and Ai[b][a], west of the city.
translation:
  language: te
  text: అతడు దాదాపు ఐదు వేల మంది పురుషులను తీసుకొని, వారిని బేతేలు, హాయి మధ్య, పట్టణానికి పడమటి వైపున మాటులో నియమించాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాదాపు ఐదు వేల మంది’—హీబ్రూలో ‘ఐదు’ సంఖ్యకు ముందు ఉన్న ఉపసర్గ ఈ సంఖ్య సుమారుగా చెప్పబడిందని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘పట్టణానికి సముద్రం వైపున’; ‘సముద్రం’ అనే మాట ఇక్కడ ‘పడమర’ అనే దిశను సూచించే నానుడిగా వాడబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: అతడు ... తీసుకొని
  rationale: לקח అనే క్రియకు సాధారణ అర్థమైన ‘తీసుకొను’ను నిలుపుతుంది; సైనిక సందర్భంలో ఎంపిక చేశాడనే భావం ఉండవచ్చుగాని, మూలంలో లేనిదాన్ని స్పష్టంగా చేర్చదు.
- source_word: כַּחֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: దాదాపు ఐదువేల మంది పురుషులను
  rationale: సంఖ్యకు ముందు ఉన్న כ అక్షరం సుమారు అనే భావాన్ని సూచిస్తుంది; אִישׁ ఇక్కడ సమూహవాచకంగా పురుషులను సూచిస్తుంది.
- source_word: וַיָּשֶׂם אוֹתָם אֹרֵב
  choice: వారిని ... మాటుగా ఉంచాడు
  rationale: שׂים యొక్క ‘ఉంచు/నిలుపు’ భావాన్ని, אֹרֵב యొక్క పొంచి ఉండే సైనిక దళం అనే భావాన్ని సహజమైన తెలుగు ప్రయోగంలో వ్యక్తం చేస్తుంది.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: బేతేలు, హాయి మధ్య
  rationale: రెండు స్థలాల మధ్యనున్న స్థానాన్ని నేరుగా తెలియజేస్తుంది; పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: מִיָּם לָעִיר
  choice: పట్టణానికి పడమటి వైపున
  rationale: יָם అంటే అక్షరార్థంగా ‘సముద్రం’; హీబ్రూ భౌగోళిక దిశా ప్రయోగంలో అది ‘పడమర’ను సూచిస్తుంది. తెలుగులో స్థానార్థం స్పష్టంగా ఉండేలా అనువదించబడింది.
