translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘మాటుగా ఉంచాడు’ సైనిక సందర్భాన్ని సహజంగా తెలియజేస్తుంది. మూలంలోని సుమారు సంఖ్యను, పడమర దిశకు సంబంధించిన హీబ్రూ నానుడిని పాదసూచికలతో సంరక్షించింది.
