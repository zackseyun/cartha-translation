reference: Joshua 8:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׂרֹ֥ף יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑י וַ/יְשִׂימֶ֤/הָ תֵּל עוֹלָם֙ שְׁמָמָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/028.yaml
  text: So Joshua burned Ai and made it a permanent mound[a], a desolation to this day.
translation:
  language: te
  text: యెహోషువ ఆయిని తగలబెట్టి, దానిని శాశ్వతమైన శిథిలదిబ్బగా[a], ఈ దినం వరకు నిర్జన స్థలంగా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దీర్ఘకాలం నిలిచే శిథిలదిబ్బగా.’ హెబ్రీ పదం עוֹלָם చాలా సుదీర్ఘమైన లేదా కాలపరిమితి తెలియని వ్యవధిని సూచించగలదు; దాన్ని తరచుగా ‘ఎప్పటికీ’ లేదా ‘శాశ్వతమైన’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: తగలబెట్టి
  rationale: שׂרף అగ్నితో కాల్చడాన్ని సూచిస్తుంది. పట్టణాన్ని ధ్వంసం చేసిన సందర్భంలో ‘తగలబెట్టి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: הָעָי
  choice: హాయి
  rationale: ఇది స్థలనామం; హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: וַיְשִׂימֶהָ
  choice: దానిని ... చేశాడు
  rationale: שׂים క్రియకు జతైన స్త్రీలింగ ఏకవచన ప్రత్యయం ‘దానిని ఉంచాడు/చేశాడు’ అనే భావాన్నిస్తుంది; తరువాతి స్థితిని తెలుగులో సహజంగా తెలియజేయడానికి ఫలితార్థకంగా అనువదించబడింది.
- source_word: תֵּל
  choice: శిథిలదిబ్బ
  rationale: תֵּל సాధారణంగా నాశనమైన పట్టణ అవశేషాలతో ఏర్పడిన దిబ్బను సూచిస్తుంది. ‘శిథిలదిబ్బ’ ఆ నిర్దిష్ట భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עוֹלָם
  choice: శాశ్వతమైన
  rationale: עוֹלָם సుదీర్ఘమైన లేదా కాలపరిమితి తెలియని కొనసాగింపును సూచించగలదు. ఇక్కడ శిథిలదిబ్బగా నిలిచే స్థితిని సూచించే ‘శాశ్వతమైన’ సహజంగా ఉంటుంది; దాని భావవ్యాప్తిని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: שְׁמָמָה
  choice: నిర్జన ప్రదేశం
  rationale: ఈ నామవాచకం పాడైపోయిన, నిర్జనమైన స్థితిని సూచిస్తుంది. తెలుగులో ‘నిర్జన ప్రదేశం’ రెండవ విధేయ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: కథకుని కాలం వరకు ఆ స్థితి కొనసాగిందని తెలిపే ప్రామాణిక హెబ్రీ నుడికారానికి ఇది సంక్షిప్తమైన సహజ తెలుగు సమానం.
