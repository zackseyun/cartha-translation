translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలి. హెబ్రీ వాక్యంలోని రెండు విధేయ భావాలు—శిథిలదిబ్బ మరియు నిర్జన ప్రదేశం—రెండూ నిలుపబడ్డాయి.
