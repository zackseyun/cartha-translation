translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘లాగేవరకు’ మూలపద చిత్రాన్ని నిలుపుతుంది; ‘రప్పించేవరకు’ అనే సందర్భానుకూల ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
