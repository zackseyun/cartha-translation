  text: וְ/יָצְא֣וּ אַחֲרֵ֗י/נוּ עַ֣ד הַתִּיקֵ֤/נוּ אוֹתָ/ם֙ מִן הָ/עִ֔יר כִּ֣י יֹֽאמְר֔וּ נָסִ֣ים לְ/פָנֵ֔י/נוּ כַּ/אֲשֶׁ֖ר בָּ/רִֽאשֹׁנָ֑ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/006.yaml
  text: And they will come out after us until we have drawn them away from the city[a], for they will say[b], ‘They are fleeing before us as at the first,’ and we will flee before them.
translation:
  language: te
  text: వారు మన వెంబడి బయటకు వస్తారు; మనం వారిని పట్టణం నుండి దూరంగా లాగేవరకు వారు మన వెంటే వస్తారు[a]. ఎందుకంటే, ‘వీరు మొదటిసారిలాగే మన ఎదుట నుండి పారిపోతున్నారు’ అని వారు అంటారు[b]. అప్పుడు మనం వారి ఎదుట నుండి పారిపోతాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత స్పష్టంగా చెప్పాలంటే, ‘మనం వారిని పట్టణం నుండి దూరంగా ఆకర్షించేవరకు.’ హీబ్రూ క్రియకు లాగడం, వేరుచేయడం అనే భావం ఉంది; ఇక్కడ అది యుద్ధవ్యూహంగా వారిని పట్టణం నుండి దూరం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మొదటిసారిలాగే’ అనేది అయి ఎదుట ఇశ్రాయేలీయులు ఇంతకు ముందు వెనుదిరిగిన సంఘటనను సూచిస్తుంది (యెహోషువ 7:4–5 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: וְיָצְאוּ אַחֲרֵינוּ
  choice: వారు మన వెంట బయలుదేరి ... వస్తారు
  rationale: యుద్ధ సందర్భంలో పట్టణం నుండి ఇశ్రాయేలీయులను వెంబడిస్తూ బయటకు రావడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַד הַתִּיקֵנוּ אוֹתָם מִן הָעִיר
  choice: మనం వారిని పట్టణం నుండి దూరంగా లాగేవరకు
  rationale: נתק హిఫీల్ రూపంలోని ‘లాగి వేరుచేయడం/దూరం చేయడం’ అనే మూలార్థాన్ని కాపాడుతూ, వ్యూహాత్మక భావాన్ని అతిగా వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: כִּי יֹאמְרוּ
  choice: ఎందుకంటే ... అని వారు అనుకుంటారు
  rationale: אמר సాధారణంగా ‘చెప్పు’ అయినా, ఇక్కడ శత్రువులు పరిస్థితిని తమలో తాము అర్థం చేసుకునే భావం ఉంది; సహజ తెలుగులో ‘అనుకుంటారు’ అనేది ఆ సందర్భాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: נָסִים לְפָנֵינוּ
  choice: వీరు మన ఎదుట నుండి పారిపోతున్నారు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను ‘పారిపోతున్నారు’గా, לְפָנֵינוּను సైనిక సందర్భానికి తగిన ‘మన ఎదుట నుండి’గా అందిస్తుంది.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: మొదటిసారిలాగే
  rationale: అయి దగ్గర ఇశ్రాయేలు గతంలో వెనుదిరిగిన నిర్దిష్ట తొలి సంఘటనను సూచించే తులనాత్మక భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: అప్పుడు మనం వారి ఎదుట నుండి పారిపోదాం
  rationale: ప్రణాళికలో ఉద్దేశపూర్వక తదుపరి చర్యను తెలుగులో సహజమైన ప్రేరణార్థక రూపంతో తెలియజేస్తూ, ముందటి ‘పారిపోతున్నారు’తో పదసామ్యాన్ని నిలుపుతుంది.
