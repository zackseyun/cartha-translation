  source_fidelity: 'మొదటి వాక్యం హీబ్రూ నిషేధ-సంబంధ ఉపవాక్య భావాన్ని సముచితంగా ఇస్తుంది: ఇశ్రాయేలు వెంట బయలుదేరని ఎవరూ హాయి లేదా బేతేలులో మిగలలేదు. అయితే הָעִיר פְּתוּחָהలోని విశేషణాత్మక స్థితి ‘పట్టణాన్ని తెరిచి వదిలి’ అన్న క్రియారూపంతో కొంత మారుతుంది; ‘పట్టణాన్ని తెరిచి ఉంచి’ అనేది మూలంలోని ‘the city open’కు మరింత సన్నిహితం.'
  naturalness: ‘హాయిలోగాని బేతేలులోగాని’లో విభక్తి-అవ్యయ సంధి భారంగా ఉంది. ఆధునిక ప్రామాణిక తెలుగులో ‘హాయిలో లేదా బేతేలులో’ సహజంగా, నిషేధంతో కలిసి రెండింటిలోనూ ఎవరూ లేరనే అర్థాన్ని స్పష్టంగా ఇస్తుంది. ‘పట్టణాన్ని తెరిచి ఉంచి’ సహజమైన కథన తెలుగు.
  terminology: స్థలనామాలు ‘హాయి,’ ‘బేతేలు,’ మరియు ప్రజాసూచక రూపం ‘ఇశ్రాయేలీయులు’ స్థిరంగా, అర్థవంతంగా ఉన్నాయి. ‘ఒక్కడు’కు పాదటిప్పణిలో אִישׁ ఇక్కడ సాధారణంగా ఏ వ్యక్తినైనా సూచిస్తుందని చెప్పడం తగినదే. ‘కాపలా లేకుండా’ అనేది పాదటిప్పణిలో మాత్రమే ఉన్న సందర్భానుగుణ ప్రత్యామ్నాయం కాబట్టి సముచితం.
