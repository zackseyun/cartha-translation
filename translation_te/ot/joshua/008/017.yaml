source:
  edition: WLC
  text: וְ/לֹֽא נִשְׁאַ֣ר אִ֗ישׁ בָּ/עַי֙ וּ/בֵ֣ית אֵ֔ל אֲשֶׁ֥ר לֹֽא יָצְא֖וּ אַחֲרֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעַזְב֤וּ אֶת הָ/עִיר֙ פְּתוּחָ֔ה וַֽ/יִּרְדְּפ֖וּ אַחֲרֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/017.yaml
  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
translation:
  language: te
  text: ఇశ్రాయేలీయుల వెంట బయలుదేరని ఒక్కడు కూడా హాయిలో లేదా బేతేలులో మిగలలేదు.[a] వారు పట్టణాన్ని తెరిచి ఉంచి, ఇశ్రాయేలీయులను వెంబడించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒక్కడు’ అనేది హీబ్రూ אִישׁ (ఈష్‌) అనే ఏకవచన పుంలింగ పదానికి అనువాదం; ఇక్కడ అది వెనుక మిగిలిన ఏ వ్యక్తినైనా సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, భావానువాదంగా, ‘వారు పట్టణాన్ని కాపలా లేకుండా వదిలారు.’ హీబ్రూలో అక్షరార్థంగా ‘పట్టణాన్ని తెరిచి’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר אִישׁ
  choice: ఒక్కడు కూడా మిగలలేదు
  rationale: שׁאר యొక్క ‘మిగిలి ఉండు’ అనే భావాన్ని, אִישׁ యొక్క ఏకవచన పుంలింగ రూపాన్ని తెలుగు నిషేధ వాక్యానికి సహజమైన ‘ఒక్కడు కూడా ... మిగలలేదు’ అనే నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: בָּעַי וּבֵית אֵל
  choice: హాయిలోగాని బేతేలులోగాని
  rationale: నిషేధ వాక్యంలో రెండు ప్రాంతాల్లోనూ ఎవరూ మిగలలేదనే భావాన్ని తెలుగులో ‘లోగాని ... లోగాని’ సహజంగా తెలియజేస్తుంది. స్థలనామాలను హాయి, బేతేలు అని లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר לֹא יָצְאוּ אַחֲרֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల వెంట బయలుదేరని
  rationale: יצא యొక్క బయలుదేరే కదలికను, אחרי యొక్క ‘వెంట/తరువాత’ అనే దిశార్థాన్ని నిలుపుతూ, సంబంధవాచక ఉపవాక్యాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: וַיַּעַזְבוּ
  choice: వారు ... వదిలి
  rationale: עזב అనే క్రియకు కథన సందర్భంలో సరళమైన ‘వదిలి’ సరిపోతుంది; తరువాతి విశేషణమే పట్టణం రక్షణలేని స్థితిని సూచించనిస్తుంది.
- source_word: הָעִיר פְּתוּחָה
  choice: పట్టణాన్ని తెరిచి
  rationale: פְּתוּחָה యొక్క మౌలికమైన ‘తెరిచి ఉన్న’ చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భార్థమైన ‘కాపలా లేకుండా’ అనే వివరణను పాదటిప్పణిలో ఇస్తుంది.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులను వెంబడించారు
  rationale: רדף అనే సైనిక కథన క్రియను ఆధునిక తెలుగులో స్పష్టమైన ‘వెంబడించారు’తో అనువదిస్తుంది; אחרי భావం ఈ క్రియలోనే సహజంగా ఇమిడివుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని పునరుక్త ‘ఇశ్రాయేలు’ సూచనను స్పష్టత కోసం ‘ఇశ్రాయేలీయులు’గా వ్యక్తపరిచాం; ‘పట్టణాన్ని తెరిచి’ అనే మూలచిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని వ్యూహాత్మక భావాన్ని పాదటిప్పణిలో వివరించాం.
