id: JOS.8.32
reference: Joshua 8:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּכְתָּב שָׁ֖ם עַל הָ/אֲבָנִ֑ים אֵ֗ת מִשְׁנֵה֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁ֣ר כָּתַ֔ב לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
translation:
  language: te
  text: మోషే ఇశ్రాయేలు కుమారుల ఎదుట[b] రాసిన ధర్మశాస్త్రపు ఒక ప్రతిని[a] అతడు అక్కడ ఆ రాళ్ల మీద రాశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మోషే ధర్మశాస్త్రపు పునరావృత రూపం’; లేదా, ‘మోషే ధర్మశాస్త్రపు నకలు.’ హీబ్రూ పదం ప్రతి, నకలు లేదా పునరావృత రూపం అనే అర్థాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇశ్రాయేలు కుమారుల సమక్షంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  choice: రాశాడు
  rationale: כתב అనే సాధారణ ‘రాయడం’ క్రియను సహజంగా అందిస్తుంది. రాతి ఉపరితలం వల్ల ‘చెక్కించాడు’ అని ప్రత్యేకంగా చెప్పడానికి హీబ్రూ క్రియ స్వయంగా ఆధారం ఇవ్వదు.
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే ఈ క్రియావిశేషణానికి సహజమైన తెలుగు సమానం.
- source_word: עַל הָאֲבָנִים
  choice: ఆ రాళ్ల మీద
  rationale: עַל రాయబడిన ఉపరితలాన్ని సూచిస్తుంది; నిర్దిష్ట బహువచనాన్ని ‘ఆ రాళ్లు’గా వ్యక్తం చేశాం.
- source_word: מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: మోషే ధర్మశాస్త్రపు ఒక ప్రతిని
  rationale: מִשְׁנֵה ఇక్కడ ప్రతి, నకలు లేదా పునరావృత రూపం అనే అర్థాలను కలిగి ఉండవచ్చు. రాళ్ల మీద రాసే సందర్భంలో ‘ఒక ప్రతి’ సహజంగా సరిపోతుంది; ఎంత భాగం రాయబడిందో ఇది నిర్ణయించదు.
- source_word: תּוֹרָה
  choice: ధర్మశాస్త్రం
  rationale: ఈ నిబంధనాత్మక సందర్భంలోను ‘మోషే ధర్మశాస్త్రం’ అనే స్థిరమైన ప్రయోగంలోను ఇది గుర్తించదగిన, సహజమైన ఎంపిక; ‘ఉపదేశం’ కూడా మూలపద పరిధిలో ఉంది.
- source_word: אֲשֶׁר כָּתַב
  choice: మోషే ... రాసిన
  rationale: సాపేక్ష వాక్యాన్ని తెలుగులో సహజమైన కృదంత నిర్మాణంగా ఇచ్చాం. కర్త మోషే అని నిర్మాణంలో స్పష్టం చేయడం ద్వారా ప్రధాన క్రియ కర్త అయిన యెహోషువతో గందరగోళం రాకుండా చేశాం.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: ఇది ‘ముందు’ లేదా ‘సమక్షంలో’ అనే భావాన్ని కలిగి ఉంటుంది. ‘ఎదుట’ మూలంలోని సంక్షిప్తతను, బహిరంగ సమక్ష భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పురుష బహువచన నిర్మాణాన్ని పారదర్శకంగా నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో అర్థమయ్యే రూపాన్ని ఉపయోగించాం.
theological_decisions:
- issue: מִשְׁנֵה תּוֹרַת מֹשֶׁה యొక్క పరిధి
  choice: ‘మోషే ధర్మశాస్త్రపు ఒక ప్రతి’ అని అనువదించి, ధర్మశాస్త్రమంతా రాశాడా లేక ఎంపిక చేసిన భాగాన్ని రాశాడా అనేది నిర్ణయించలేదు.
  alternative: ‘మోషే ధర్మశాస్త్రపు పునరావృత రూపం’ లేదా ‘మోషే ధర్మశాస్త్రపు నకలు’
  rationale: రాయబడిన విషయపు పరిమాణాన్ని వాక్యం నిర్వచించదు. అందువల్ల మూలంలోని అనిశ్చితిని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. తెలుగు కృదంత క్రమం వల్ల మోషే ముందుగా రాసిన ధర్మశాస్త్రానికే ‘ప్రతి’ సంబంధించినదని స్పష్టమవుతుంది; అయినా ఆ ప్రతిలోని విషయపు పరిధిని అనువాదం నిర్దేశించదు.
