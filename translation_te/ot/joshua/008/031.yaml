id: JOS.8.31
reference: Joshua 8:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר צִוָּה֩ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל כַּ/כָּתוּב֙ בְּ/סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה מִזְבַּח֙ אֲבָנִ֣ים שְׁלֵמ֔וֹת אֲשֶׁ֛ר לֹֽא הֵנִ֥יף עֲלֵי/הֶ֖ן בַּרְזֶ֑ל וַ/יַּעֲל֨וּ עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה וַֽ/יִּזְבְּח֖וּ שְׁלָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
translation:
  language: te
  text: యెహోవా సేవకుడైన మోషే ఇశ్రాయేలు కుమారులకు ఆజ్ఞాపించినట్లుగా, మోషే ధర్మశాస్త్ర గ్రంథంలో వ్రాయబడిన ప్రకారం, వాటిమీద ఇనుప పనిముట్టును ఉపయోగించని చెక్కుచెదరని రాళ్లతో చేసిన ఒక బలిపీఠం[a] అక్కడ ఉంది. దానిమీద వారు యెహోవాకు దహనబలులు అర్పించి, సమాధానబలులు[b] అర్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కోతపడని రాళ్లతో.” హీబ్రూ పదానికి “సంపూర్ణమైన, చెక్కుచెదరని రాళ్లు” అనే అర్థం ఉంది; తరువాతి మాట వాటిమీద ఇనుప పనిముట్టును ఉపయోగించలేదని వివరిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “సమాధానబలులు” అనే పదాన్ని “సహవాస బలులు” లేదా “క్షేమ బలులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినట్లుగా
  rationale: ముందుగా ఇచ్చిన ఆజ్ఞకు అనుగుణంగా జరిగిన కార్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֶבֶד יְהוָה
  choice: యెహోవా సేవకుడు
  rationale: మోషేకు సంబంధించిన గౌరవసూచక బిరుదును సహజంగా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబ-సమూహ వ్యక్తీకరణను లింగరూపంతో సహా నిలుపుతుంది.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: మోషే ధర్మశాస్త్ర గ్రంథంలో
  rationale: గ్రంథం మరియు తోరా/ధర్మశాస్త్రం అనే రెండు భావాలనూ గుర్తించదగిన తెలుగు పదబంధంలో ఉంచుతుంది.
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  choice: చెక్కుచెదరని రాళ్లతో ఒక బలిపీఠం
  rationale: שְׁלֵמוֹת లోని సంపూర్ణంగా, దెబ్బతినకుండా ఉన్న రాళ్లు అనే చిత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; 'చెక్కని రాళ్లు' అనే సందర్భార్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  choice: ఇనుప పనిముట్టు తగలని
  rationale: అక్షరార్థంగా ఇనుమును వాటిమీద ఎత్తలేదు అనే నుడికారాన్ని, రాళ్లను ఇనుప పనిముట్టుతో పని చేయలేదనే ఉద్దేశంతో స్పష్టంగా అందిస్తుంది.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: పూర్తిగా దహింపబడే ఈ నిర్దిష్ట బలి రకానికి స్థిరమైన తెలుగు బైబిలు పదాన్ని ఉపయోగిస్తుంది.
- source_word: שְׁלָמִים
  choice: సమాధాన బలులు
  rationale: సాంప్రదాయికంగా గుర్తించదగిన బలి పదాన్ని వాడుతూ, సహవాసం మరియు క్షేమం అనే విస్తృత భావాలను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: యెహోవా అనే దైవనామం יְהוָה
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు పాఠకులకు స్థిరంగా పరిచయమైన వ్యక్తినామ రూపాన్ని వాడి, సాధారణ బిరుదైన 'ప్రభువు'గా మార్చకుండా మూలంలోని దైవనామ స్వభావాన్ని నిలుపుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే సమూహ కుటుంబ వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని పితృవంశీయ కుటుంబ చిత్రాన్ని సమతలీకరించకుండా నిలుపుతుంది.
- issue: שְׁלָמִים బలి పదంలోని భావ విస్తృతి
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు / క్షేమ బలులు
  rationale: ఒకే సిద్ధాంతార్థానికి పరిమితం చేయకుండా, ఇతర సముచిత భావాలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. హీబ్రూ వాక్యంలో క్రియ స్పష్టంగా లేక సందర్భం ద్వారా గ్రహించబడే 'బలిపీఠాన్ని కట్టారు' అనే భావాన్ని తెలుగులో సంపూర్ణ వాక్యార్థం కోసం వ్యక్తం చేశాం.
