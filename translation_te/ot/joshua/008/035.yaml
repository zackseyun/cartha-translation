id: JOS.8.35
reference: Joshua 8:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא הָיָ֣ה דָבָ֔ר מִ/כֹּ֖ל אֲשֶׁר צִוָּ֣ה מֹשֶׁ֑ה אֲשֶׁ֨ר לֹֽא קָרָ֜א יְהוֹשֻׁ֗עַ נֶ֣גֶד כָּל קְהַ֤ל יִשְׂרָאֵל֙ וְ/הַ/נָּשִׁ֣ים וְ/הַ/טַּ֔ף וְ/הַ/גֵּ֖ר הַ/הֹלֵ֥ךְ בְּ/קִרְבָּֽ/ם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
translation:
  language: te
  text: మోషే ఆజ్ఞాపించిన వాటన్నిటిలో యెహోషువ చదవకుండా వదిలిన మాట ఒక్కటీ లేదు. అతడు ఇశ్రాయేలు సమాజమంతటి, స్త్రీల, చిన్నపిల్లల, వారి మధ్య నివసించే పరదేశి[a][b]—వారి అందరి ఎదుట చదివాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరదేశి’ అంటే ఇశ్రాయేలీయుడు కాకపోయినా వారి మధ్య నివసించే విదేశీయుడు.
    reason: cultural_note
  - marker: b
    text: అక్షరార్థంగా ‘వారి మధ్య నడిచే’; ఇక్కడ ‘వారి మధ్య నివసించే’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר
  choice: మాట
  rationale: చదవబడిన మోషే ఆజ్ఞలను సూచించే సందర్భంలో ‘మాట’ సహజంగా ఉండి, మూలంలోని వాక్సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: మోషే ఇచ్చిన అధికారపూర్వకమైన నిబంధన ఆదేశాల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: קָרָא
  choice: చదివాడు
  rationale: ముందటి వచనాల్లో ధర్మశాస్త్రాన్ని బహిరంగంగా చదివిన సందర్భానికి ఇది అత్యంత సరైన అర్థం.
- source_word: נֶגֶד
  choice: ఎదుట
  rationale: సమకూడిన ప్రజల సమక్షంలో బహిరంగంగా చదవడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קְהַל
  choice: సమాజం
  rationale: ఇశ్రాయేలు అధికారికంగా సమకూడిన సమూహాన్ని సూచిస్తుంది; తరువాతి కాలపు సంఘవ్యవస్థ భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: הַטַּף
  choice: చిన్నపిల్లలు
  rationale: టఫ్ అనే పదంలోని చిన్నవారు లేదా ఆధారపడిన పిల్లలు అనే భావాన్ని సాధారణ తెలుగు పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: הַגֵּר
  choice: పరదేశి
  rationale: ఇశ్రాయేలీయుడు కాకపోయినా వారి మధ్య స్థిరంగా నివసించే వ్యక్తి అనే సామాజిక వర్గాన్ని సూచించే సుపరిచితమైన బైబిలు తెలుగు పదం.
- source_word: הַהֹלֵךְ בְּקִרְבָּם
  choice: వారి మధ్య నివసించే
  rationale: ‘వారి మధ్య నడిచే’ అనే మూలరూపం ఇక్కడ సమాజంలో నివసించడాన్ని సూచించే జాతీయంగా వాడిన ప్రయోగం; ‘నివసించే’ ఆధునిక తెలుగులో ఉద్దేశాన్ని సహజంగా అందిస్తుంది, అక్షరార్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  choice: చదవకుండా వదిలిన మాట ఒక్కటీ లేదు
  rationale: హీబ్రూ ద్వినిషేధం తెలియజేసే సంపూర్ణతను సహజమైన ఆధునిక తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నిబంధన బోధను విన్న ప్రజల పరిధి
  choice: ఇశ్రాయేలు సమాజమంతటితో పాటు స్త్రీలు, చిన్నపిల్లలు, వారి మధ్య నివసించే పరదేశిని కూడా స్పష్టంగా పేర్కొనడం
  alternative: ఈ వర్గాలన్నిటినీ ‘ఇశ్రాయేలు సమాజమంతా’ అనే సాధారణ పదబంధంలో కలిపివేయడం
  rationale: హీబ్రూ పాఠం ఈ వర్గాలను ప్రత్యేకంగా పేర్కొంటుంది. అందువల్ల నిబంధన పఠనంలో వారి స్పష్టమైన భాగస్వామ్యాన్ని అనువాదం నిలుపుతుంది.
- issue: మోషే ఆజ్ఞల్లో ఏదీ విడిచిపెట్టబడలేదనే సంపూర్ణత
  choice: ‘చదవకుండా వదిలిన మాట ఒక్కటీ లేదు’ అని అనువదించడం
  alternative: హీబ్రూ ద్వినిషేధాన్ని పదక్రమంతోనే ‘చదవని మాట లేదు’ అని అనువదించడం
  rationale: రెండు రూపాలూ సంపూర్ణతనే తెలియజేస్తాయి; ఎంచుకున్న రూపం ఆధునిక తెలుగులో స్పష్టంగా ఉండి, యెహోషువ పఠనంలోని సమగ్రతను అతిశయ వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి తగిన శైలి వాడబడింది. హీబ్రూ ద్వినిషేధాన్ని యథాతథంగా అనుకరించకుండా దాని సంపూర్ణతను ‘ఒక్కటీ లేదు’ అనే సహజ ప్రయోగంతో నిలిపాము. జాబితా ప్రధాన సమాజంలో భాగమైన వర్గాలను స్పష్టంగా చూపేలా డాష్‌ల మధ్య ఉంచబడింది.
