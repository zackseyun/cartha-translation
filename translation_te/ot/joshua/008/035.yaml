- from: మోషే ఆజ్ఞాపించిన వాటన్నిటిలో యెహోషువ చదవకుండా వదిలిన మాట ఒక్కటీ లేదు. అతడు ఇశ్రాయేలు సమాజమంతటి ఎదుట—స్త్రీలు, చిన్నపిల్లలు, వారి మధ్య నివసించే పరదేశి[a][b] ఎదుట—అంతా చదివాడు.
