language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
translation:
  language: te
  text: 'ఇలా జరిగింది: ఇశ్రాయేలీయులు, తాము వారిని వెంబడించిన అరణ్యంలోని పొలంలో, ఆయి నివాసులందరినీ చంపి ముగించిన తరువాత, వారందరూ కత్తి ధారకు పడి పూర్తిగా అంతమయ్యారు[a]. అప్పుడు ఇశ్రాయేలీయులందరూ ఆయికి తిరిగి వచ్చి, దానిని కత్తి ధారతో కొట్టారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారందరూ పూర్తిగా నశించిపోయేవరకు”; హీబ్రూలో ఈ పదబంధం సంపూర్ణంగా అంతమవడాన్ని సూచిస్తుంది.
    reason: עַד תֻּמָּם కు “పూర్తిగా అంతమయ్యారు” అనే ప్రధాన అనువాదంతో పాటు, సంపూర్ణ వినాశన భావాన్ని వ్యక్తం చేసే సహజమైన ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: ముగించినప్పుడు ... అప్పుడు
  rationale: కాలసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు కథన క్రమంలో చూపిస్తుంది; తరువాత జరిగిన తిరుగు చర్యను ‘అప్పుడు’ స్పష్టం చేస్తుంది.
- source_word: לַהֲרֹג
  choice: చంపడం
  rationale: הרג యొక్క ప్రత్యక్ష హింసాత్మక అర్థాన్ని మృదువుచేయకుండా తెలియజేస్తుంది.
- source_word: יֹשְׁבֵי הָעַי
  choice: హాయి నివాసులు
  rationale: ישב కృదంతం ఇక్కడ పట్టణంలో నివసించేవారిని సూచిస్తుంది.
- source_word: בַּשָּׂדֶה בַּמִּדְבָּר
  choice: పొలంలో—... అరణ్యంలో
  rationale: שדה, מדבר అనే రెండు స్థలపదాలను విడిగా నిలుపుతూ, నగరానికి వెలుపలి యుద్ధస్థలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר רְדָפוּם בּוֹ
  choice: తాము వారిని వెంబడించిన
  rationale: సందర్భంలో వెంబడించినవారు ఇశ్రాయేలీయులు, వెంబడింపబడినవారు హాయి నివాసులు; ‘తాము’ ప్రధాన కర్తతో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: לְפִי חֶרֶב
  choice: కత్తివాత
  rationale: ‘కత్తి నోటికి’ అనే హీబ్రూ యుద్ధనుడికారానికి సహజమైన, గంభీరమైన తెలుగు సమానార్థకం.
- source_word: עַד תֻּמָּם
  choice: పూర్తిగా అంతమయ్యారు
  rationale: సమూహం సంపూర్ణంగా తుదముట్టిన భావాన్ని, మూలంలోని పూర్తి/అంతం మూలార్థాన్ని నిలుపుతుంది.
- source_word: וַיָּשֻׁבוּ כָל יִשְׂרָאֵל הָעַי
  choice: ఇశ్రాయేలీయులందరూ హాయికి తిరిగివచ్చి
  rationale: שוב యొక్క తిరిగి రావడం అనే అర్థాన్నీ, הָעַי అనే గమ్యాన్నీ స్పష్టంగా అందిస్తుంది.
- source_word: וַיַּכּוּ אֹתָהּ
  choice: దానిని ... హతమార్చారు
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం హాయి పట్టణాన్ని సూచిస్తుందనే మూలరూపాన్ని నిలుపుతూ, נכה యొక్క బలమైన యుద్ధార్థాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యుద్ధంలో జరిగిన సంపూర్ణ సంహారాన్ని ఎలా అనువదించాలి
  choice: ‘చంపడం,’ ‘కత్తివాత పడి,’ ‘హతమార్చారు’ అనే ప్రత్యక్ష పదాలతో హింసను యథాతథంగా చూపించడం
  alternative: ‘ఓడించారు’ లేదా ‘జయించారు’ వంటి మృదువైన పదాలు వాడడం
  rationale: వచనం హత్యనూ సంపూర్ణ నాశనాన్నీ స్పష్టంగా వర్ణిస్తుంది. దానిని మృదువుచేయకూడదు; అదే సమయంలో ఈ వచనంలో లేని దైవశిక్ష లేదా యుద్ధన్యాయ వివరణను చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలి. హింసను మృదువుచేయకుండా, మూలంలోని స్థలవివరాలు మరియు సంపూర్ణత భావం నిలుపబడ్డాయి; దీర్ఘ వాక్యాన్ని చదవడానికి సులభంగా రెండు వాక్యాలుగా అమర్చాం.
