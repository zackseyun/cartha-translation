translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; భూసరిహద్దు ప్రయాణవివరణకు తగిన సంక్షిప్త, గౌరవప్రద శైలి. మూలంలోని స్థలనామాలు లిప్యంతరీకరించబడ్డాయి. ఆంగ్ల పాదటీపీలోని ‘Arkites/Archites’ భేదం హీబ్రూ పాఠభేదం కాదు, కేవలం ఆంగ్ల లిప్యంతరీకరణ భేదం; తెలుగులో ప్రత్యేక పాదటీపీ అవసరం లేదు.
