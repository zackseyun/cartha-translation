  yaml_path: translation/ot/joshua/016/002.yaml
  text: Then it went out from Bethel to Luz[a], and passed on to the border of the Arkites at Ataroth.
translation:
  language: te
  text: ఆ సరిహద్దు బేతేలు నుండి లూజుకు వెళ్లి, అతారోతు వద్దనున్న అర్కీయుల సరిహద్దు వరకు సాగింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצָא
  choice: అక్కడి నుండి ఆ సరిహద్దు ... వెళ్లి
  rationale: మునుపటి వచనంలో పేర్కొన్న సరిహద్దే కొనసాగుతున్న కర్త. ఆధునిక తెలుగులో కర్తను స్పష్టంగా పేర్కొనడం సహజం; וְ యొక్క సందర్భానుగుణ కొనసాగింపును ‘అక్కడి నుండి’ తెలియజేస్తుంది.
- source_word: מִבֵּית אֵל
  choice: బేతేలు నుండి
  rationale: స్థలనామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, מִן ఉపసర్గను ‘నుండి’గా అనువదించాం.
- source_word: לוּזָה
  choice: లూజుకు
  rationale: దిశను సూచించే ה־ను గమ్యార్థక ‘కు’తో సహజంగా వ్యక్తం చేశాం.
- source_word: וְעָבַר
  choice: సాగింది
  rationale: సరిహద్దు వర్ణనలో עבר భౌగోళిక రేఖ ముందుకు కొనసాగడాన్ని సూచిస్తుంది; ‘దాటింది’ అనడం అనవసరంగా ఒక ప్రదేశాన్ని అడ్డంగా దాటిన భావం కలిగించవచ్చు.
- source_word: אֶל גְּבוּל
  choice: సరిహద్దు వైపు
  rationale: אֶל దిశను, גְּבוּל సరిహద్దును సూచిస్తాయి; ‘వైపు’ మూలంలోని దిశార్థాన్ని కాపాడుతుంది.
- source_word: הָאַרְכִּי
  choice: అర్కీయుల
  rationale: జనవాచక ఏకవచన రూపం ఒక వంశం లేదా ప్రజాసమూహాన్ని సూచిస్తున్నందున తెలుగులో సహజమైన బహువచన సంబంధరూపాన్ని వాడాం.
- source_word: עֲטָרוֹת
  choice: అతారోతు దగ్గర
  rationale: స్థలనామాన్ని లిప్యంతరీకరించాం. హీబ్రూ పదక్రమంలో చివర ఉన్న స్థలనామం సరిహద్దు ఉన్న ప్రదేశాన్ని నిర్దేశిస్తున్నందున తెలుగులో ‘దగ్గర’తో సంబంధాన్ని స్పష్టం చేశాం.
