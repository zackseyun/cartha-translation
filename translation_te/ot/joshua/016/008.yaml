id: JOS.16.8
reference: Joshua 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/תַּפּ֜וּחַ יֵלֵ֨ךְ הַ/גְּב֥וּל יָ֨מָּ/ה֙ נַ֣חַל קָנָ֔ה וְ/הָי֥וּ תֹצְאֹתָ֖י/ו הַ/יָּ֑מָּ/ה זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
translation:
  language: te
  text: తప్పూవహు నుండి సరిహద్దు పడమటి వైపుగా కానా వాగు[a] వరకు సాగుతుంది; దాని అంత్యస్థానాలు సముద్రం వద్ద ఉన్నాయి. వారి కుటుంబాల ప్రకారం ఎఫ్రాయిము కుమారుల గోత్రానికి చెందిన స్వాస్థ్యభాగం ఇదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వాగు” అనే పదాన్ని “కాలానుగుణంగా నీరు ప్రవహించే వాగుపడక” లేదా “లోయ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּפּוּחַ
  choice: తప్పూవహు నుండి
  rationale: מִן ఆ సరిహద్దు మొదలయ్యే స్థలాన్ని సూచిస్తుంది; స్థలపేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: יֵלֵךְ הַגְּבוּל
  choice: సరిహద్దు ... సాగి
  rationale: భూసరిహద్దుల వర్ణనలో הלך సరిహద్దు వెళ్లే మార్గాన్ని సూచిస్తుంది; తెలుగులో ‘సాగి’ సహజంగా ఉంటుంది.
- source_word: יָמָּה
  choice: పడమటి వైపుగా
  rationale: ఈ దిశాసూచక రూపం అక్షరార్థంగా సముద్రం వైపు అన్న భావం కలిగినా, భూసరిహద్దు వర్ణనల్లో సాధారణంగా పడమటి దిశను సూచిస్తుంది.
- source_word: נַחַל קָנָה
  choice: కానా వాగు
  rationale: נַחַל ప్రవాహం ఉండే వాగు, వాగుపడక లేదా లోయను సూచించగలదు; సాధారణ పాఠకులకు ‘వాగు’ స్పష్టంగా, భౌగోళికంగా తగినదిగా ఉంది.
- source_word: וְהָיוּ תֹצְאֹתָיו הַיָּמָּה
  choice: సముద్రం దగ్గర ముగిసింది
  rationale: సరిహద్దు సూత్రంలో תֹצְאֹתָיו దాని అంత్యస్థానాన్ని సూచిస్తుంది; బహువచన హీబ్రూ రూపాన్ని తెలుగులో సహజమైన ఏకవచన క్రియతో వ్యక్తం చేశాం.
- source_word: זֹאת נַחֲלַת
  choice: ఇదే ... లభించిన స్వాస్థ్యం
  rationale: ఈ పదబంధం ముందుగా వివరించిన భూభాగాన్ని అధికారికంగా సంగ్రహిస్తుంది; ‘స్వాస్థ్యం’ వారసత్వంగా కేటాయించబడిన భూభాగ భావాన్ని నిలుపుతుంది.
- source_word: מַטֵּה בְנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము కుమారుల గోత్రానికి
  rationale: מַטֵּה ఇక్కడ గోత్రాన్ని సూచిస్తుంది; בְנֵי אֶפְרַיִם అనే ప్రామాణిక గోత్రపదబంధంలోని పురుష కుటుంబ రూపాన్ని యథాతథంగా నిలిపాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחוֹת గోత్రంలోని కుటుంబ లేదా వంశ విభాగాలను సూచిస్తుంది; ఈ సందర్భంలో ‘వంశాలు’ సహజంగా ఉంది.
theological_decisions:
- issue: בְנֵי אֶפְרַיִם లోని లింగసూచక గోత్రపదం
  choice: ఎఫ్రాయిము కుమారులు
  alternative: ఎఫ్రాయిము సంతతివారు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఎఫ్రాయిము కుమారులు’ అని ఉండి, గోత్రానికి స్థిరమైన గుర్తింపుగా పనిచేస్తుంది. మూలంలోని పురుష కుటుంబ రూపాన్ని తటస్థ పదంతో భర్తీ చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; భూసరిహద్దు వర్ణనకు తగిన గంభీరతను ఉంచుతూ, సామాన్య పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం ఉపయోగించాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
