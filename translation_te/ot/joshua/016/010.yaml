id: JOS.16.10
reference: Joshua 16:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֣א הוֹרִ֔ישׁוּ אֶת הַֽ/כְּנַעֲנִ֖י הַ/יּוֹשֵׁ֣ב בְּ/גָ֑זֶר וַ/יֵּ֨שֶׁב הַֽ/כְּנַעֲנִ֜י בְּ/קֶ֤רֶב אֶפְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/010.yaml
  text: But they did not drive out the Canaanites who lived in Gezer, so the Canaanites have lived in the midst of Ephraim to this day and became forced laborers.
translation:
  language: te
  text: అయితే గెజెరులో నివసిస్తున్న కనానీయులను వారు వెళ్లగొట్టలేదు. కనానీయులు ఈ రోజు వరకు ఎఫ్రాయిమీయుల మధ్య నివసిస్తూ, నిర్బంధ కూలీ సేవకు లోబడినవారయ్యారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: వెళ్లగొట్టలేదు
  rationale: హిఫీల్ రూపం ఇక్కడ ఆ ప్రాంతం నుంచి ప్రజలను తొలగించడం లేదా వెళ్లగొట్టడం అనే భావాన్ని ఇస్తుంది.
- source_word: בְּקֶרֶב אֶפְרַיִם
  choice: ఎఫ్రాయిమీయుల మధ్య
  rationale: గోత్రప్రజల సమాజం మధ్య నివసించారనే సహజ తెలుగు భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְמַס עֹבֵד
  choice: నిర్బంధ శ్రమ చేసే వారు
  rationale: מַס అనేది ఇక్కడ కేవలం పన్ను కంటే విధింపబడిన శ్రమదళాన్ని సూచిస్తుంది; עֹבֵד ఆ శ్రమను నిర్వర్తించే స్థితిని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: చివరి క్రియ వַיְהִי యొక్క కాలభావం
  choice: వారయ్యారు
  alternative: ఉన్నారు / ఉంటూ వచ్చారు
  rationale: హీబ్రూ వరుసలోని ఏకవచన సమూహకర్తకు అనుగుణంగా వారు నిర్బంధ శ్రమదళంగా మారిన ఘటనను చూపుతుంది; దానిని తప్పనిసరిగా నేటివరకు కొనసాగిన స్థితిగా విస్తరించదు.
- issue: రెండు వాక్యభాగాల సంబంధం
  choice: అందువల్ల
  alternative: మరియు
  rationale: వెళ్లగొట్టకపోవడం వల్ల కనానీయులు వారి మధ్య నివసించారనే సందర్భసంబంధాన్ని సహజంగా తెలుపుతుంది, అయితే మూలంలోని וַ సాధారణ సంధికి మించిన కఠిన కారణార్థాన్ని బలవంతం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, కానీ చారిత్రక వర్ణనకు తగిన గంభీరతతో అనువదించబడింది. మూలంలోని ‘ఈ రోజు వరకు’ అనే కాలసూచన నివాసానికి అనుసంధానించబడింది; చివరి క్రియకు ఉన్న భూతకాల ఘటనాభావం నిలుపబడింది.
