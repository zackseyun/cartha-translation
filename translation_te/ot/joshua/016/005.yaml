source:
  edition: WLC
  text: וַ/יְהִ֛י גְּב֥וּל בְּנֵֽי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָ֑/ם וַ/יְהִ֞י גְּב֤וּל נַחֲלָתָ/ם֙ מִזְרָ֔חָ/ה עַטְר֣וֹת אַדָּ֔ר עַד בֵּ֥ית חוֹרֹ֖ן עֶלְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/005.yaml
  text: 'And the territory of the sons of Ephraim by their clans was as follows: the border of their inheritance on the east was Ataroth-addar[a], as far as Upper Beth-horon.'
translation:
  language: te
  text: 'ఎఫ్రాయిము సంతానానికి తమ వంశాల ప్రకారం ఉన్న ప్రాంతం ఇది: వారి స్వాస్థ్యపు సరిహద్దు తూర్పు వైపున అతారోత్-అద్దారు నుండి ఎగువ బేత్-హోరోను వరకు ఉంది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּבוּל
  choice: ప్రాంతం / సరిహద్దు
  rationale: ఈ పదం వచనంలో రెండుసార్లు వస్తుంది. మొదటిది ఎఫ్రాయిము వంశస్థులకు కేటాయించిన భూభాగాన్ని సమగ్రంగా సూచించేందున ‘ప్రాంతం’ అని, రెండవది స్థలాల మధ్య సరిహద్దు రేఖను సూచించేందున ‘సరిహద్దు’ అని అనువదించబడింది.
- source_word: בְּנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము వంశస్థులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఎఫ్రాయిము కుమారులు’ అయినా, ఇక్కడ గోత్రానికి చెందిన వారిని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, వంశావళి భావాన్ని నిలుపుతూ ‘వంశస్థులు’ ఎంచుకున్నాం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వారి వంశాల ప్రకారం
  rationale: గోత్రంలోని కుటుంబ-వంశ విభాగాల ప్రకారం భూమి కేటాయించబడిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נַחֲלָתָם
  choice: వారి స్వాస్థ్యం
  rationale: యెహోషువలో ఈ పదం వారసత్వంగా కేటాయించబడిన భూమిని సూచిస్తుంది; ‘స్వాస్థ్యం’ ఆ భూసంబంధమైన వారసత్వ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מִזְרָחָה
  choice: తూర్పున
  rationale: సరిహద్దు వివరణలో తూర్పు వైపు లేదా తూర్పు భాగాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: עַטְרוֹת אַדָּר
  choice: అతారోత్-అద్దారు
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం; సంయుక్త స్థలనామ స్వరూపాన్ని సూచించేందుకు హైఫన్ ఉంచాం.
- source_word: עַד
  choice: వరకు
  rationale: సరిహద్దు విస్తరించిన చివరి స్థానాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  choice: ఎగువ బేత్-హోరోను
  rationale: עֶלְיוֹן అనే విశేషణం దిగువ బేత్-హోరోనుకు భిన్నమైన ఎత్తైన స్థలాన్ని గుర్తిస్తుంది; తెలుగులో సహజమైన క్రమంలో ‘ఎగువ’ను ముందుంచాం.
