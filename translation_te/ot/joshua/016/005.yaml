translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూసరిహద్దు జాబితాకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూలోని రెండు וַיְהִי వాక్య నిర్మాణాలను తెలుగులో సహజమైన ఒక పరిచయ వాక్యంగా మలిచాం. ఆంగ్ల పాఠంలోని అడుగుటిప్పణి ఆంగ్ల వాక్యనిర్మాణ ప్రత్యామ్నాయానికే సంబంధించినది; తెలుగులో భౌగోళిక భావం స్పష్టంగా ఉండటంతో అడుగుటిప్పణి అవసరం లేదు.
