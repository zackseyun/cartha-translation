  text: וְ/הֶ/עָרִ֗ים הַ/מִּבְדָּלוֹת֙ לִ/בְנֵ֣י אֶפְרַ֔יִם בְּ/ת֖וֹךְ נַחֲלַ֣ת בְּנֵֽי מְנַשֶּׁ֑ה כָּֽל הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/009.yaml
  text: And the cities set apart for the sons of Ephraim within the inheritance of the sons of Manasseh—all the cities and their villages[a].
translation:
  language: te
  text: మనష్షే వంశస్థుల స్వాస్థ్యంలో ఎఫ్రాయిము వంశస్థుల కోసం ప్రత్యేకించబడిన పట్టణాలు—ఆ పట్టణాలన్నీ, వాటి గ్రామాలతో సహా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎఫ్రాయిము వంశస్థుల కోసం వేరుచేయబడిన పట్టణాలు.” హీబ్రూ భాగవాచక రూపం, ఈ పట్టణాలు ఎఫ్రాయిము కోసం ప్రత్యేకంగా గుర్తించబడ్డాయని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: పట్టణాలు
  rationale: עִיר పట్టణం లేదా నగరాన్ని సూచించగలదు. యెహోషువలోని భూభాగాల జాబితాల సందర్భంలో సహజమైన ఆధునిక తెలుగు పదంగా ‘పట్టణాలు’ ఎంచుకున్నాం.
- source_word: הַמִּבְדָּלוֹת
  choice: ప్రత్యేకంగా ఉంచబడిన
  rationale: בדל మూలపదం వేరుచేయడం లేదా ప్రత్యేకపరచడం అనే భావాన్ని ఇస్తుంది. మనష్షే స్వాస్థ్యంలో ఉన్నప్పటికీ ఇవి ఎఫ్రాయిము కోసం ప్రత్యేకించబడ్డాయని ఈ రూపం తెలియజేస్తుంది.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము వంశస్థుల కోసం
  rationale: בני అక్షరార్థంగా ‘కుమారులు’ అయినా, ఇక్కడ మొత్తం గోత్రాన్ని సూచించే వంశపరమైన ప్రయోగం. ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా చెప్పేందుకు ‘వంశస్థులు’ వాడాం.
- source_word: בְּתוֹךְ
  choice: మధ్యలో
  rationale: మరొక గోత్రపు భూస్వాస్థ్యపు పరిధిలో ఉన్న స్థానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נַחֲלַת
  choice: స్వాస్థ్యం
  rationale: נחלה యెహోషువలో వారసత్వంగా కేటాయించబడిన భూభాగాన్ని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఆ వారసత్వ-భూభాగ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: మనష్షే వంశస్థులు
  rationale: ఇది వ్యక్తిగత కుమారులను కాక గోత్ర సమూహాన్ని సూచిస్తుంది; అందువల్ల సహజమైన ‘వంశస్థులు’ ఎంచుకున్నాం.
- source_word: כָּל הֶעָרִים
  choice: ఆ పట్టణాలన్నీ
  rationale: כָּל మొత్తం సమూహాన్ని సూచిస్తుంది. ముందే పేర్కొన్న ప్రత్యేక పట్టణాలను తిరిగి సూచించేందుకు ‘ఆ పట్టణాలన్నీ’ సహజంగా ఉంది.
- source_word: וְחַצְרֵיהֶן
  choice: వాటి గ్రామాలతో సహా
  rationale: חָצֵר ఇలాంటి భూభాగాల జాబితాల్లో పట్టణాలకు అనుబంధమైన గ్రామాలు లేదా గోడలులేని నివాసాలను సూచిస్తుంది. ‘గ్రామాలు’ సాధారణ పాఠకులకు స్పష్టమైన పదం.
theological_decisions: []
