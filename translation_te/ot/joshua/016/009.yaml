  register: ఆధునిక ప్రామాణిక తెలుగు; భూకేటాయింపు సందర్భానికి తగిన గౌరవప్రదమైన, సహజమైన శైలి. గోత్రపరమైన בני అనే ప్రయోగాన్ని అక్షరార్థమైన ‘కుమారులు’గా కాక, సందర్భానుసారంగా ‘వంశస్థులు’గా అందించాం.
