source:
  edition: WLC
  text: וְ/יָצָ֨א הַ/גְּב֜וּל הַ/יָּ֗מָּ/ה הַֽ/מִּכְמְתָת֙ מִ/צָּפ֔וֹן וְ/נָסַ֧ב הַ/גְּב֛וּל מִזְרָ֖חָ/ה תַּאֲנַ֣ת שִׁלֹ֑ה וְ/עָבַ֣ר אוֹת֔/וֹ מִ/מִּזְרַ֖ח יָנֽוֹחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/006.yaml
  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
translation:
  language: te
  text: ఆ సరిహద్దు ఉత్తరాన ఉన్న మిక్మెతాతు వైపు పడమటికి[a] సాగింది. అక్కడి నుంచి అది తానత్‌-షిలో వైపు తూర్పునకు తిరిగి, దానికి తూర్పుగా యానోహా వరకు సాగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సముద్రం వైపు”; ఇది పడమటి దిశను సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא הַגְּבוּל
  choice: ఆ సరిహద్దు ... సాగింది
  rationale: సరిహద్దుల వర్ణనలో יצא సరిహద్దు రేఖ ముందుకు కొనసాగడాన్ని సూచిస్తుంది. తెలుగులో ‘సాగింది’ సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַיָּמָּה
  choice: పడమటికి[a]
  rationale: అక్షరార్థంగా ‘సముద్రం వైపు’; ఇది పడమటి దిశను సూచించే సాధారణ హీబ్రూ నుడికారం. ప్రధాన పాఠ్యంలో స్పష్టమైన దిశను ఇచ్చి, అక్షరార్థాన్ని అధస్సూచికలో ఉంచాం.
- source_word: הַמִּכְמְתָת מִצָּפוֹן
  choice: ఉత్తరాన ఉన్న మిక్మెతాతు వైపు
  rationale: מִצָּפוֹן అనే పదబంధం మిక్మెతాతు లేదా సరిహద్దుకు సంబంధించిన ఉత్తర స్థానాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో స్థల సంబంధాన్ని సహజంగా వ్యక్తం చేశాం; మూలంలోని సంక్షిప్తత వల్ల సంబంధంలో కొంత అస్పష్టత ఉంది.
- source_word: וְנָסַב הַגְּבוּל מִזְרָחָה
  choice: అక్కడి నుంచి అది ... తూర్పునకు తిరిగి
  rationale: נסב సరిహద్దు దిశ మారడాన్ని సూచిస్తుంది. పునరుక్తిని తగ్గిస్తూ ‘అది’తో సరిహద్దునే సూచించాం; ‘అక్కడి నుంచి’ క్రమాన్ని సహజంగా కలుపుతుంది.
- source_word: תַּאֲנַת שִׁלֹה
  choice: తానత్‌-షిలో
  rationale: స్థల నామాన్ని హీబ్రూ ధ్వనులకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: וְעָבַר אוֹתוֹ מִמִּזְרַח
  choice: దానికి తూర్పుగా ... సాగింది
  rationale: సరిహద్దు తానత్‌-షిలోకు తూర్పు వైపున దాటుతూ లేదా కొనసాగుతూ వెళ్లిందనే స్థల సంబంధాన్ని సహజ తెలుగులో తెలిపాం. ‘దాన్ని దాటింది’ అనడం స్థలాన్ని అడ్డంగా దాటిందనే అపార్థం కలిగించవచ్చు.
- source_word: יָנוֹחָה
  choice: యానోహు వరకు
  rationale: స్థల నామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం. దిశను సూచించే అంత్యప్రత్యయం గమ్యభావాన్ని కలిగిస్తున్నందున తెలుగులో ‘వరకు’ ఉపయోగించాం.
