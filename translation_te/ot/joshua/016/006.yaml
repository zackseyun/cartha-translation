translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భౌగోళిక సరిహద్దు వర్ణనకు తగిన సరళమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. స్థల నామాలను మూల హీబ్రూ ఉచ్చారణకు సాధ్యమైనంత దగ్గరగా లిప్యంతరీకరించాం.
