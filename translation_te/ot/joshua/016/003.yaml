- from: అక్కడి నుండి ఆ సరిహద్దు పడమటి వైపుగా యఫ్లేతీయుల సరిహద్దు వరకు దిగిపోయి, దిగువ బేత్-హోరోను సరిహద్దు వరకు, గెజెరు వరకు సాగింది; దాని చివరలు సముద్రం దగ్గర ఉన్నాయి.
