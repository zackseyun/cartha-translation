source:
  edition: WLC
  text: וְ/יָֽרַד יָ֜מָּ/ה אֶל גְּב֣וּל הַ/יַּפְלֵטִ֗י עַ֣ד גְּב֧וּל בֵּית חוֹרֹ֛ן תַּחְתּ֖וֹן וְ/עַד גָּ֑זֶר וְ/הָי֥וּ תצאת/ו יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/003.yaml
  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
translation:
  language: te
  text: అక్కడి నుండి ఆ సరిహద్దు పడమటి వైపున యఫ్లేతీయుల సరిహద్దు వరకు దిగింది; అది దిగువ బేత్-హోరోను సరిహద్దు వరకు, గెజెరు వరకు సాగింది; దాని చివరలు సముద్రం వద్ద ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָרַד
  choice: దిగిపోయి
  rationale: సరిహద్దు వర్ణనలో భూభాగపు దిగువ వైపు సాగడాన్ని సూచించే ירד భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יָמָּה
  choice: పడమటి వైపుగా
  rationale: దిశను సూచించే ఈ రూపం ఇశ్రాయేలు భౌగోళిక సందర్భంలో సాధారణంగా మధ్యధరా సముద్రం వైపు, అంటే పడమటి వైపుగా అనే అర్థం ఇస్తుంది.
- source_word: אֶל גְּבוּל הַיַּפְלֵטִי
  choice: యఫ్లేతీయుల సరిహద్దు వరకు
  rationale: גְּבוּלను సరిహద్దుగా, gentilic designation‌ను ప్రజాసమూహాన్ని సూచించే యఫ్లేతీయులు అని లిప్యంతరీకరించింది.
- source_word: עַד גְּבוּל בֵּית חוֹרֹן תַּחְתּוֹן
  choice: దిగువ బేత్-హోరోను సరిహద్దు వరకు
  rationale: עַד తెలిపే విస్తృతిని ‘వరకు’తో, תַּחְתּוֹן ద్వారా ఎగువ బేత్-హోరోను నుండి వేరుచేసే భావాన్ని ‘దిగువ’తో స్పష్టంగా తెలిపింది.
- source_word: וְעַד גָּזֶר
  choice: గెజెరు వరకు
  rationale: పునరుక్తమైన עַד సరిహద్దు ఎంతదూరం సాగిందో సూచిస్తుంది; స్థలనామాన్ని లిప్యంతరీకరించింది.
- source_word: וְהָיוּ תֹצְאֹתָיו יָמָּה
  choice: దాని చివరలు సముద్రం దగ్గర ఉన్నాయి
  rationale: సరిహద్దు సూత్రంలో תֹצְאֹתָיו దాని అంత్యబిందువులు లేదా చివరలను సూచిస్తుంది. చివరి יָמָּהను ఇక్కడ దిశగా కాక గమ్యస్థానమైన సముద్రంగా తీసుకుంది.
