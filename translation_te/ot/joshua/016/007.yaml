  yaml_path: translation/ot/joshua/016/007.yaml
  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
translation:
  language: te
  text: అప్పుడు సరిహద్దు యానోహా నుండి అతారోతుకు, నయరాతుకు[a] దిగిపోయి, యెరికోను తాకి[b], యొర్దాను వరకు వెళ్లింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నయరాతా’; దీనిని ‘నయరాతు వైపు’ అని అర్థం చేసుకోవచ్చు. కొందరు దీనిని ‘నయరా’ అనే స్థలనామ రూపంతో సంబంధపరుస్తారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘యెరికోకు చేరి’; ఇక్కడి హీబ్రూ క్రియ సరిహద్దు రేఖ ఒక ప్రదేశాన్ని చేరడం లేదా తాకడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘యొర్దాను వైపు బయటికి వెళ్లింది’; ఈ హీబ్రూ ప్రయోగం సరిహద్దు రేఖ సాగిన దిశను లేదా దాని ముగింపు స్థానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: అప్పుడు సరిహద్దు ... దిగిపోయి
  rationale: భూసరిహద్దు వర్ణనలో ירד ఎత్తు లేదా దిశపరంగా కిందికి సాగడాన్ని సూచిస్తుంది. తెలుగులో కర్తను స్పష్టంచేయడానికి సందర్భం నుంచి ‘సరిహద్దు’ చేర్చబడింది; వావ్ క్రమాన్ని ‘అప్పుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: מִיָּנוֹחָה
  choice: యానోహు నుండి
  rationale: מן అనే ఉపసర్గను ‘నుండి’గా అనువదించి, స్థల నామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: עֲטָרוֹת
  choice: అతారోతుకు
  rationale: స్థల నామాన్ని అనువదించకుండా లిప్యంతరీకరించాం; గమ్యాన్ని తెలిపే హీబ్రూ దిశార్థక రూపాన్ని తెలుగులో ‘కు’తో వ్యక్తం చేశాం.
- source_word: וְנַעֲרָתָה
  choice: నయరాకు
  rationale: మసొరా పాఠంలోని నయరా రూపాన్ని ప్రధాన పాఠంలో నిలిపి, నయరాతుతో సాధ్యమైన సంబంధాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּפָגַע בִּירִיחוֹ
  choice: యెరికోను తాకి
  rationale: సరిహద్దు వర్ణనలో פגע ఒక ప్రాంతాన్ని కలవడం, చేరడం లేదా తాకడాన్ని సూచించగలదు. ‘తాకి’ దాని స్థలసంబంధ భావాన్ని, ఉన్న సందిగ్ధతను కాపాడుతుంది.
- source_word: וְיָצָא הַיַּרְדֵּן
  choice: యొర్దాను దగ్గర ముగిసింది
  rationale: సరిహద్దు సూత్రాలలో יצא దాని గమనం చివరకు ఒక ప్రదేశానికి చేరడాన్ని లేదా అక్కడ ముగియడాన్ని సూచించగలదు. సహజ తెలుగులో ‘దగ్గర ముగిసింది’ ఈ కార్యాన్ని స్పష్టంగా చెబుతుంది; మరింత అక్షరార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: הַיַּרְדֵּן
  choice: యొర్దాను
  rationale: నది పేరును స్థిరమైన తెలుగు బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం; సందర్భంలో ‘నది’ అనేది అంతర్భూతంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన భౌగోళిక వర్ణన. హీబ్రూలో అంతర్భూతమైన సరిహద్దును తెలుగులో కర్తగా స్పష్టంచేశాం. స్థల నామాలను అనువదించకుండా తెలుగు లిపిలో ఇచ్చాం; פגע మరియు יצא పదాల అర్థవ్యాప్తిని పాదసూచికల్లో కాపాడాం.
