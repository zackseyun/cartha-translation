lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  choice: తమ స్వాస్థ్యాన్ని పొందారు
  rationale: נחל అనే క్రియ ఇక్కడ కేటాయించబడిన భూస్వాస్థ్యం వారికి లభించడాన్ని సూచిస్తుంది. తెలుగులో ‘స్వాస్థ్యాన్ని పొందారు’ అనేది ఆ భావాన్ని సహజంగా తెలియజేస్తూ, క్రియలో అంతర్భూతమైన కర్మను స్పష్టం చేస్తుంది.
- source_word: בְנֵי יוֹסֵף
  choice: యోసేపు కుమారులైన
  rationale: బహువచన రూపమైన בְנֵי యొక్క ‘కుమారులు’ అనే వంశావళి నుడికారాన్ని నిలుపుతూ, తరువాత వచ్చే మనష్షే, ఎఫ్రాయిములతో సహజంగా అనుసంధానిస్తుంది; సందర్భంలో ఇది వారి గోత్రవంశాలనూ సూచించగలదు.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: హీబ్రూ వ్యక్తి/గోత్ర నామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: וְאֶפְרָיִם
  choice: ఎఫ్రాయిములు
  rationale: హీబ్రూ నామాన్ని ప్రాచుర్యంలో ఉన్న తెలుగు రూపంలో ఇచ్చి, మనష్షేతో కూడిన సంయుక్త కర్తకు తగిన బహువచన వాక్యనిర్మాణంలో ఉంచబడింది.
- source_word: וַ
  choice: వాక్యక్రమం ద్వారా కొనసాగింపు
  rationale: హీబ్రూ וַ కథనాన్ని ముందుకు నడిపిస్తుంది. ఈ చిన్న వాక్యంలో తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని ప్రారంభించడం అసహజంగా ఉండగలదని, వాక్యక్రమం ద్వారానే కథన కొనసాగింపును వ్యక్తం చేశాం.
