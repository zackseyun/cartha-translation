  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘కుమారులు’ అనే వంశావళి నుడికారం నిలుపబడింది; సందర్భానుసారంగా మనష్షే, ఎఫ్రాయిము గోత్రవంశాలు ఉద్దేశించబడుతున్నాయి. పాదసూచిక గుర్తు దానికి సంబంధించిన క్రియ తరువాత ఉంచబడింది.
