  text: וַ/יֵּצֵ֨א הַ/גּוֹרָ֜ל לִ/בְנֵ֤י יוֹסֵף֙ מִ/יַּרְדֵּ֣ן יְרִיח֔וֹ לְ/מֵ֥י יְרִיח֖וֹ מִזְרָ֑חָ/ה הַ/מִּדְבָּ֗ר עֹלֶ֧ה מִ/ירִיח֛וֹ בָּ/הָ֖ר בֵּֽית אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
translation:
  language: te
  text: యోసేపు కుమారులకు చీటి ద్వారా దక్కిన భూభాగం యెరికో దగ్గర యొర్దాను నుండి తూర్పున యెరికో జలాల వరకు, అరణ్యం గుండా యెరికో నుండి బేతేలు కొండప్రాంతానికి పైకి సాగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యోసేపు కుమారులకు చీటి బయటికి వచ్చింది.” భూవిభజన సందర్భంలో ఇది చీటి ద్వారా వారికి దక్కిన భూభాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: వచ్చిన చీటి ప్రకారం వారి భూభాగం
  rationale: ‘చీటి బయటికి వచ్చింది’ అనే అక్షరార్థం తెలుగులో అసహజంగా ఉంటుంది. భూవిభజన సందర్భంలో చీటి ద్వారా వారికి దక్కిన భూభాగమే వాక్యానికి భావవిషయం; అందువల్ల ప్రక్రియను, ఫలితాన్ని సహజంగా కలిపి తెలిపింది.
- source_word: לִבְנֵי יוֹסֵף
  choice: యోసేపు కుమారులకు
  rationale: హీబ్రూ బంధుత్వ వ్యక్తీకరణను నిలుపుతుంది; సందర్భంలో ఇది యోసేపు గోత్రసంతతిని సమష్టిగా సూచిస్తుంది.
- source_word: מִיַּרְדֵּן יְרִיחוֹ
  choice: యెరికో దగ్గర యొర్దాను నుండి
  rationale: యెరికోకు ఆనుకుని ఉన్న యొర్దాను ప్రాంతాన్ని ప్రారంభబిందువుగా స్పష్టంగా, అతివ్యాఖ్య లేకుండా తెలుపుతుంది.
- source_word: לְמֵי יְרִיחוֹ מִזְרָחָה
  choice: తూర్పున ఉన్న యెరికో జలాల వరకు
  rationale: ‘జలాలు’ అనే సమష్టి బహువచనాన్ని నిలిపి, מִזְרָחָה యొక్క తూర్పు దిశ/స్థాన భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַמִּדְבָּר
  choice: అరణ్యం
  rationale: מדבר ఇక్కడ ఎడారి అని తప్పనిసరిగా నిర్దిష్టం చేయకుండా, జనావాసం తక్కువైన అడవి/వన్యప్రాంతాన్ని సూచిస్తుంది.
- source_word: עֹלֶה מִירִיחוֹ בָּהָר בֵּית־אֵל
  choice: పైకి వెళ్లి, యెరికో నుండి బేతేలు కొండప్రాంతంలోకి సాగింది
  rationale: యెరికో నుండి ఎత్తైన బేతేలు ప్రాంతానికి ఎక్కే భౌగోళిక గమనాన్ని, הר ను ఒక్క కొండగా కాక కొండప్రాంతంగా గ్రహించి తెలిపింది.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన స్థలనామ రూపం.
