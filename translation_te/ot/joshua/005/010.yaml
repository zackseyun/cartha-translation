reference: Joshua 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/גִּלְגָּ֑ל וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בָּ/עֶ֖רֶב בְּ/עַֽרְב֥וֹת יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/010.yaml
  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు గిల్గాలులో[a] మకాం వేశారు. ఆ నెల పద్నాలుగో రోజు సాయంకాలం యెరికో మైదానాల్లో పస్కాను ఆచరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులు,’ లేదా ‘ఇశ్రాయేలు సంతానం.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה అంటే శిబిరం వేసి బస చేయడం. ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజంగా ఉండి సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధమైన, పుంలింగ బహువచన రూపాన్ని పారదర్శకంగా నిలుపుతుంది; ‘ఇశ్రాయేలీయులు’ మరింత నుడికారమైన ప్రత్యామ్నాయం.
- source_word: בַּגִּלְגָּל
  choice: గిల్గాలులో
  rationale: స్థలాన్ని సూచించే בְּ ఉపసర్గను తెలుగులో సహజమైన స్థానవాచక విభక్తితో వ్యక్తం చేసింది.
- source_word: וַיַּעֲשׂוּ אֶת הַפֶּסַח
  choice: పస్కాను ఆచరించారు
  rationale: పస్కాతో వాడిన עשה అనే నుడికారం దానిని నిర్వహించడం లేదా పాటించడం అనే అర్థం ఇస్తుంది; ‘ఆచరించారు’ ఉత్సవ సంబంధ సందర్భానికి సహజమైనది.
- source_word: הַפֶּסַח
  choice: పస్కా
  rationale: ఈ పండుగ లేదా బలి ఆచరణకు తెలుగులో స్థిరపడిన బైబిలు పదం.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: ఆ నెల పద్నాలుగో రోజు
  rationale: హీబ్రూ కాలగణన వ్యక్తీకరణను కచ్చితంగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: בָּעֶרֶב
  choice: సాయంకాలం
  rationale: ఆచరణ జరిగిన సమయాన్ని తెలిపే עֶרֶבకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  choice: యెరికో మైదానాల్లో
  rationale: עֲרָבוֹת ఇక్కడ యెరికో సమీపంలోని విశాల మైదాన లేదా మైదానప్రాంతాన్ని సూచిస్తుంది; ‘మైదానాల్లో’ భౌగోళిక భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతానం
  rationale: ఇక్కడ సిద్ధాంతపరమైన వివాదం లేదు. అయినా మూలంలోని కుటుంబసంబంధమైన పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠంలో నిలిపి, తెలుగులో మరింత నుడికారమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని వరుస వాక్య నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా అందించాం; కాలం, స్థలం, ఆచరణ వివరాలన్నీ నిలిపాం.
