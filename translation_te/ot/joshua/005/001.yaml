  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּל מַלְכֵ֣י הָ/אֱמֹרִ֡י אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן יָ֗מָּ/ה וְ/כָל מַלְכֵ֤י הַֽ/כְּנַעֲנִי֙ אֲשֶׁ֣ר עַל הַ/יָּ֔ם אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל עַד עבר/נו וַ/יִּמַּ֣ס לְבָבָ֗/ם וְ/לֹא הָ֨יָה בָ֥/ם עוֹד֙ ר֔וּחַ מִ/פְּנֵ֖י בְּנֵֽי יִשְׂרָאֵֽל־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
translation:
  language: te
  text: యొర్దానుకు అవతల పడమటి వైపున ఉన్న అమోరీయుల రాజులందరూ, సముద్రం దగ్గర ఉన్న[a] కనానీయుల రాజులందరూ, మేము దాటిపోయే వరకు[b] యాహ్వే ఇశ్రాయేలు కుమారుల ఎదుట యొర్దాను నీళ్లను ఎండబెట్టాడని విన్నప్పుడు, ఇశ్రాయేలు కుమారుల కారణంగా వారి హృదయం కరిగిపోయింది; వారిలో ఇక ధైర్యం లేకపోయింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సముద్రతీరంలో ఉన్న.” ఇక్కడ ఈ మాట తీరప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన పాఠసాక్ష్యాలు “మేము దాటిపోయే వరకు”కు బదులు “వారు దాటిపోయే వరకు” అని చదువుతాయి.
    reason: textual_variant
  - marker: c
    text: 'హీబ్రూ నానుడి అక్షరార్థం: “వారిలో ఇక ఆత్మ ఉండలేదు”; అంటే వారు ధైర్యాన్ని, స్థైర్యాన్ని కోల్పోయారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: వַיְהִי ఇక్కడ కథనాన్ని కొనసాగిస్తూ కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో విడిగా ‘ఇలా జరిగింది’ అని చేర్చడం కంటే ‘విన్నప్పుడు’ అనడం సహజంగా అదే కథన సంబంధాన్ని తెలియజేస్తుంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: యొర్దానుకు అవతల పడమటి వైపున
  rationale: עֵבֶר అనేది ‘అవతల వైపు’ను, יָמָּה పడమటి దిశను సూచిస్తాయి; రెండింటినీ స్పష్టంగా నిలిపింది.
- source_word: אֲשֶׁר עַל הַיָּם
  choice: సముద్రం దగ్గర ఉన్న
  rationale: మూలంలోని ‘సముద్రం వద్ద’ అనే భౌగోళిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; తీరప్రాంతం అనే భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: הוֹבִישׁ
  choice: ఎండబెట్టాడు
  rationale: יבש హిఫీల్ రూపంలోని కారణార్థక భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబ-జాతీయ పురుషలింగ వ్యక్తీకరణను నిలిపింది.
- source_word: עַד עברנו
  choice: మేము దాటిపోయే వరకు
  rationale: మసొరా వ్యంజన పాఠంలోని ప్రథమ పురుష బహువచనాన్ని ప్రధాన పాఠంలో నిలిపి, మూడవ పురుష పాఠాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: וַיִּמַּס לְבָבָם
  choice: వారి హృదయం కరిగిపోయింది
  rationale: మూలంలోని ఏకవచన సమూహవాచక ‘హృదయం’ను, భయంతో ధైర్యం కోల్పోవడాన్ని తెలిపే కరుగుదల రూపకాన్ని నిలిపింది.
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  choice: వారిలో ఇక ధైర్యం లేకపోయింది
  rationale: רוּחַ ఇక్కడ శ్వాస లేదా ఆత్మ అనే మౌలిక అర్థం కంటే అంతరంగ ధైర్యం, స్థైర్యం అనే సందర్భోచిత భావాన్ని కలిగిన నానుడి; తెలుగులో అర్థస్పష్టత కోసం భావానువాదం చేసింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది; దానిని బిరుదుగా మార్చకుండా సమీప లిప్యంతరీకరణతో నిలిపింది.
- issue: בְנֵי יִשְׂרָאֵל అనే జాతీయ సంబోధన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పురుషలింగ కుటుంబ-జాతీయ రూపాన్ని తటస్థీకరించకుండా నిలిపింది.
- issue: עַד עברנו లో క్రియాపురుషం
  choice: మేము దాటిపోయే వరకు
  alternative: వారు దాటిపోయే వరకు
  rationale: మసొరా వ్యంజన పాఠం సూచించే ప్రథమ పురుష బహువచనాన్ని ప్రధాన పాఠంలో ఉంచింది. కథన సందర్భానికి సరిపోయే మూడవ పురుష పాఠం ప్రాచీన సాక్ష్యాల్లో ఉన్నందున దానిని పాదటిప్పణిలో సంరక్షించింది.
- issue: רוּחַ యొక్క సందర్భార్థం
  choice: ధైర్యం
  alternative: ఆత్మ / ఊపిరి
  rationale: ఇక్కడ ఇశ్రాయేలీయుల భయంతో రాజులు తమ అంతరంగ స్థైర్యాన్ని కోల్పోయారని నానుడి సూచిస్తుంది; ‘ఆత్మ’ అని అనువదించి మానవ స్వరూపంపై అనవసరమైన సిద్ధాంతార్థాన్ని రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని సమూహవాచక ఏకవచన ‘హృదయం’ మరియు ప్రథమ పురుష ‘మేము’ ఉద్దేశపూర్వకంగా నిలిపబడ్డాయి; అస్పష్టతలు పాదటిప్పణుల్లో ఇవ్వబడ్డాయి.
