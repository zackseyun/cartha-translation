source:
  edition: WLC
  text: וַ/יְהִ֗י בִּֽ/הְי֣וֹת יְהוֹשֻׁעַ֮ בִּ/ירִיחוֹ֒ וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִישׁ֙ עֹמֵ֣ד לְ/נֶגְדּ֔/וֹ וְ/חַרְבּ֥/וֹ שְׁלוּפָ֖ה בְּ/יָד֑/וֹ וַ/יֵּ֨לֶךְ יְהוֹשֻׁ֤עַ אֵלָי/ו֙ וַ/יֹּ֣אמֶר ל֔/וֹ הֲ/לָ֥/נוּ אַתָּ֖ה אִם לְ/צָרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
translation:
  language: te
  text: యెహోషువ యెరికో దగ్గర ఉన్నప్పుడు[a], అతడు కళ్లు పైకెత్తి చూశాడు. ఇదిగో, ఒక మనిషి తన ఖడ్గాన్ని ఒరనుంచి తీసి చేతిలో పట్టుకొని అతనికి ఎదురుగా నిలబడి ఉన్నాడు. యెహోషువ అతని దగ్గరికి వెళ్లి, “నీవు మా పక్షమా, లేక మా శత్రువుల పక్షమా?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెరికోలో.’ హీబ్రూ విభక్తి నగరం లోపల అనే అర్థాన్నిగానీ, దాని వద్ద లేదా పరిసరాల్లో అనే విస్తృత స్థలార్థాన్నిగానీ ఇవ్వగలదు.
    reason: స్థలసూచక హీబ్రూ בְּ యొక్క నిజమైన భావసందిగ్ధతను నమోదు చేయడం.
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת
  choice: ఉన్నప్పుడు
  rationale: హీబ్రూ కథనారంభ సూత్రం וַיְהִי మరియు కాలసూచక infinitive construct బִּהְיוֹת కలిపి తెలుగులో సహజంగా కాలపరిస్థితిని తెలిపే ‘ఉన్నప్పుడు’గా అనువదించబడ్డాయి; ప్రత్యేకంగా ‘జరిగింది’ అని చేర్చడం తెలుగులో భారంగా ఉంటుంది.
- source_word: בִּירִיחוֹ
  choice: యెరికో దగ్గర
  rationale: בְּ స్థలాన్ని విస్తృతంగా సూచించగలదు. నగరం లోపలనే ఉన్నాడని నిర్దిష్టం చేయకుండా, సందర్భానికి సరిపోయే ‘దగ్గర’ ఎంపికైంది.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: అతడు కళ్లు పైకెత్తి చూశాడు
  rationale: రెండు హీబ్రూ క్రియల దృశ్యరూపాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన సంయుక్త ప్రయోగం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అనూహ్యంగా కనిపించిన దృశ్యంపై దృష్టి నిలిపే హీబ్రూ సూచక అవ్యయపు సజీవ బలాన్ని కాపాడుతుంది.
- source_word: אִישׁ
  choice: ఒక మనిషి
  rationale: ఈ వచనం ఆ వ్యక్తిని ఇంతకంటే స్పష్టంగా గుర్తించదు; ‘దూత’ లేదా ‘యోధుడు’ అని ముందుగానే వ్యాఖ్యానించలేదు.
- source_word: עֹמֵד לְנֶגְדּוֹ
  choice: అతనికి ఎదురుగా నిలబడి ఉన్నాడు
  rationale: לְנֶגֶד తెలిపే ఎదురెదురు స్థితిని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: తన ఖడ్గాన్ని ఒరనుంచి తీసి చేతిలో పట్టుకొని
  rationale: שְׁלוּפָה అంటే బయటకు తీసిన/ఒరనుంచి దూసిన స్థితి. తెలుగులో ‘ఒరనుంచి తీసి చేతిలో పట్టుకొని’ ఆ భంగిమను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ ... אֵלָיו
  choice: అతని దగ్గరికి వెళ్లి
  rationale: ఆ వ్యక్తివైపు యెహోషువ కదలడాన్ని సరళంగా తెలియజేస్తుంది; మూలంలో లేని అదనపు భావాన్ని చేర్చదు.
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  choice: నీవు మా పక్షమా, లేక మా శత్రువుల పక్షమా?
  rationale: לְ ఇక్కడ పక్షం లేదా విధేయతను సూచిస్తుంది. ‘మా పక్షమా’ అనే రూపం సైనిక సందర్భంలో స్పష్టమైన ఆధునిక తెలుగు.
theological_decisions:
- issue: యెహోషువకు ఎదురైన ‘మనిషి’ గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘ఒక మనిషి’ అని తటస్థంగా అనువదించడం
  alternative: దేవదూత, యెహోవా దూత, దేవుని ప్రత్యక్షత, లేదా క్రీస్తు అవతారానికి పూర్వపు ప్రత్యక్షత అని పేర్కొనడం
  rationale: ఈ వచనంలోని אִישׁ కేవలం ‘మనిషి’ అని పరిచయం చేస్తుంది. తరువాతి సందర్భం అతని గుర్తింపుపై వ్యాఖ్యానానికి దారితీయవచ్చు గాని, ఈ వచనం చెప్పినదానికంటే అనువాదం ముందుకు వెళ్లకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథన గాంభీర్యాన్ని కాపాడే శైలి. ‘ఇదిగో’ మూలంలోని దృష్టి ఆకర్షణను నిలుపుతుంది; ‘ఖడ్గం,’ ‘పక్షం’ వంటి పదాలు సందర్భానికి తగిన గౌరవప్రదమైన సాధారణ వాడుక.
