source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ שַׂר צְבָ֨א יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ שַׁל נַֽעַלְ/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֥ר אַתָּ֛ה עֹמֵ֥ד עָלָ֖י/ו קֹ֣דֶשׁ ה֑וּא וַ/יַּ֥עַשׂ יְהוֹשֻׁ֖עַ כֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/015.yaml
  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
translation:
  language: te
  text: అప్పుడు యాహ్వే సైన్యానికి అధిపతి[a] యెహోషువతో, “నీ పాదం మీదున్న నీ చెప్పును తీసివేయి[b], ఎందుకంటే నీవు నిలబడి ఉన్న స్థలం పవిత్రమైనది” అన్నాడు. యెహోషువ అలాగే చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాహ్వే సైన్యాధిపతి” లేదా “యాహ్వే సేనాధిపతి.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “నీ చెప్పు … నీ పాదం” అని ఏకవచనంలో ఉంది. నిర్గమకాండము 3:5లోని ప్రసిద్ధ బహువచన పదప్రయోగంతో పోల్చండి.
    reason: cross_reference
lexical_decisions:
- source_word: שַׂר צְבָא יְהוָה
  choice: యాహ్వే సైన్యాధిపతి
  rationale: సైనిక సందర్భంలో שַׂר‌ను ‘అధిపతి’గా, צְבָאను ‘సైన్యం’గా సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ఆ వ్యక్తి స్వరూపాన్ని అదనంగా నిర్ధారించదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సాధారణ ఆధునిక లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: שַׁל נַעַלְךָ מֵעַל רַגְלְךָ
  choice: నీ పాదం మీద నుండి నీ చెప్పును తీసివేయి
  rationale: ఆజ్ఞ యొక్క ప్రత్యక్షతను, అలాగే మూలంలోని ‘చెప్పు’ మరియు ‘పాదం’ ఏకవచన రూపాలను నిలుపుతుంది.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עֹמֵד עָלָיו
  choice: నీవు నిలబడి ఉన్న స్థలం
  rationale: హీబ్రూ వర్తమాన స్థితిని సహజమైన తెలుగు సంబంధవాచక నిర్మాణంలో వ్యక్తం చేస్తుంది; ‘దాని మీద’ అనే భావం తెలుగులో సందర్భానుసారంగా అంతర్భూతమై ఉంటుంది.
- source_word: קֹדֶשׁ הוּא
  choice: పవిత్రమైనది
  rationale: קֹדֶשׁ యొక్క మతపరమైన బరువును స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో అందిస్తుంది.
- source_word: וַיַּעַשׂ יְהוֹשֻׁעַ כֵּן
  choice: యెహోషువ అలాగే చేశాడు
  rationale: యెహోషువ ఆ ఆజ్ఞకు లోబడినట్లు తెలిపే హీబ్రూ కథన సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: שַׂר צְבָא יְהוָה అని పిలువబడిన వక్త యొక్క స్వరూపం
  choice: ‘యాహ్వే సైన్యాధిపతి’ అనే వివరణాత్మక బిరుదును మాత్రమే ఉపయోగించడం
  alternative: దేవదూతల సైన్యాధిపతి; యాహ్వే ప్రత్యక్షత; అవతారానికి ముందటి క్రీస్తు ప్రత్యక్షత
  rationale: ఈ వచనం వక్తకు ఈ బిరుదునే ఇస్తుంది; ఆయన దేవదూతా, దైవప్రత్యక్షతా, క్రీస్తు ప్రత్యక్షతా అని స్పష్టంగా నిర్ణయించదు. అందువల్ల అనిశ్చితిని అలాగే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. మూలంలోని ఏకవచన చెప్పు/పాదం రూపాలను ఉద్దేశపూర్వకంగా నిలిపి, అసహజతను పాదటిప్పణిలో వివరించింది.
