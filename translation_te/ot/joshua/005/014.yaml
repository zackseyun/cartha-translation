id: JOS.5.14
reference: Joshua 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֹ֗א כִּ֛י אֲנִ֥י שַׂר צְבָֽא יְהוָ֖ה עַתָּ֣ה בָ֑אתִי וַ/יִּפֹּל֩ יְהוֹשֻׁ֨עַ אֶל פָּנָ֥י/ו אַ֨רְצָ/ה֙ וַ/יִּשְׁתָּ֔חוּ וַ/יֹּ֣אמֶר ל֔/וֹ מָ֥ה אֲדֹנִ֖/י מְדַבֵּ֥ר אֶל עַבְדּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
translation:
  language: te
  text: అతడు ఇలా అన్నాడు[a], “కాదు; యెహోవా సైన్యానికి అధిపతిగా నేను ఇప్పుడు వచ్చాను.” అప్పుడు యెహోషువ నేలమీద ముఖం పెట్టి పడిపోయి, నమస్కరించి[b], అతనితో ఇలా అన్నాడు, “నా ప్రభువు తన సేవకునితో ఏమి చెబుతున్నాడు?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరి పక్షమూ కాదు; యెహోవా సైన్యానికి అధిపతిగా నేను ఇప్పుడు వచ్చాను.”
    reason: లֹא అనే నిరాకరణ ముందటి ‘మా పక్షమా, మా శత్రువుల పక్షమా?’ అనే రెండు ప్రత్యామ్నాయాలకు సమాధానంగా ‘ఎవరి పక్షమూ కాదు’ అనే భావంలో అర్థం చేసుకోవచ్చు.
  - marker: b
    text: హీబ్రూ క్రియను “ఆరాధించి” అని కూడా అనువదించవచ్చు. ఇక్కడ వక్త ఎవరో ఈ వచనం నుంచే ముందుగా నిర్ణయించకుండా, కనిపించే చర్యను తెలిపేందుకు “నమస్కరించి” అని అనువదించబడింది.
    reason: మూల క్రియలో గౌరవంతో వంగడం మరియు ఆరాధించడం అనే రెండూ సందర్భానుసారంగా సాధ్యమైన భావాలు.
lexical_decisions:
- source_word: לֹא ... כִּי
  choice: కాదు; ...గా
  rationale: ముందటి ప్రశ్నకు నేరుగా నిరాకరణను తెలిపి, ఆ తరువాత వక్త తన అసలు హోదాను సరిదిద్దుతూ వెల్లడించే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שַׂר
  choice: అధిపతి
  rationale: సైనిక సందర్భంలో నాయకత్వ హోదాను స్పష్టంగా తెలిపే ఆధునిక, గౌరవప్రదమైన తెలుగు పదం.
- source_word: צְבָא יְהוָה
  choice: యెహోవా సైన్యం
  rationale: צָבָא లోని సైనిక భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తూ, יהוה అనే దైవనామాన్ని యెహోవా అని లిప్యంతరీకరిస్తుంది.
- source_word: עַתָּה בָאתִי
  choice: నేను ఇప్పుడు వచ్చాను
  rationale: రాక పూర్తయి ప్రస్తుత సందర్భానికి వర్తిస్తున్నదనే భావాన్ని సహజ తెలుగు క్రియారూపంలో వ్యక్తం చేస్తుంది.
- source_word: אֶל־פָּנָיו אַרְצָה
  choice: నేలవైపు ముఖం మోపి పడి
  rationale: ముఖం నేలవైపు ఉండే శరీర భంగిమను మూలపాఠానికి దగ్గరగా, సహజంగా వర్ణిస్తుంది.
- source_word: וַיִּשְׁתָּחוּ
  choice: సాష్టాంగ నమస్కారం చేసి
  rationale: లోతైన వినయంతో నేలపై వంగి నమస్కరించిన క్రియను చూపుతుంది; దానిని తప్పనిసరిగా ఆరాధనగా నిర్ణయించదు.
- source_word: אֲדֹנִי
  choice: నా ప్రభువు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో కూడిన గౌరవ సంబోధనను నిలుపుతుంది; ఈ వచనం మాత్రమే ఆధారంగా వక్తను దేవుడిగా గుర్తించదు.
- source_word: מְדַבֵּר אֶל־עַבְדּוֹ
  choice: తన సేవకునితో ఏమి చెబుతున్నాడు
  rationale: వర్తమాన సంభాషణ భావాన్ని, యెహోషువ తనను సేవకునిగా తగ్గించుకొని పలికిన తీరును కాపాడుతుంది.
theological_decisions:
- issue: యెహోషువ చేసిన క్రియను స్పష్టంగా ఆరాధనగా అనువదించాలా
  choice: ప్రధాన పాఠంలో ‘సాష్టాంగ నమస్కారం చేసి’ అని ఇవ్వడం
  alternative: ‘ఆరాధించి’ అని అనువదించడం
  rationale: שחה అనే క్రియ వినయంగా వంగి నమస్కరించడానికీ, సందర్భానుసారం ఆరాధించడానికీ వాడబడుతుంది. ఈ వచనం ఒక్కటే ఆ క్రియ యొక్క ఖచ్చితమైన దైవశాస్త్రీయ స్వభావాన్ని నిర్ణయించనందున భౌతిక చర్యను ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలియజేశాం.
- issue: వక్తను దైవ ప్రత్యక్షతగా లేదా దేవదూతగా అనువాదంలో గుర్తించాలా
  choice: ‘యెహోవా సైన్యానికి అధిపతి’ అనే మూలపాఠ హోదాకే పరిమితం కావడం
  alternative: దేవదూతగా లేదా దైవ ప్రత్యక్షతగా సూచించే పదజాలాన్ని వాడడం
  rationale: ఈ వచనం వక్త హోదాను తెలుపుతుంది గాని అతని అస్తిత్వ స్వరూపాన్ని స్పష్టంగా నిర్ణయించదు. అందువల్ల అనువాదం ఆ సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘యెహోవా’ దైవనామంగా నిలుపబడింది; ‘నా ప్రభువు’ గౌరవ సంబోధనగా ఉంచబడింది. పాఠం వక్త స్వరూపాన్ని గానీ యెహోషువ చర్యను తప్పనిసరిగా ఆరాధనగా గానీ ముందుగానే నిర్ణయించదు.
