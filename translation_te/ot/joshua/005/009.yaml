  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֗וֹם גַּלּ֛וֹתִי אֶת חֶרְפַּ֥ת מִצְרַ֖יִם מֵ/עֲלֵי/כֶ֑ם וַ/יִּקְרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ גִּלְגָּ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
translation:
  language: te
  text: యెహోవా యెహోషువతో, “నేడు నేను ఐగుప్తు అవమానాన్ని మీ మీద నుండి దొర్లించివేశాను” అని చెప్పాడు. అందుచేత ఆ స్థలానికి నేటివరకు గిల్గాలు[a] అనే పేరు ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “గిల్గాలు” అనే హెబ్రీయ పేరు, “దొర్లించివేశాను” అనే హెబ్రీయ క్రియతో శబ్దసామ్యం కలిగి ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- source_word: גַּלּוֹתִי
  choice: దొర్లించివేశాను
  rationale: גלל అనే మూలంలోని ‘దొర్లించడం’ భావాన్ని నిలుపుతూ, గిల్గాలు అనే స్థలనామంతో ఉన్న శబ్దప్రయోగాన్ని సాధ్యమైనంతవరకు సూచిస్తుంది.
- source_word: חֶרְפַּת מִצְרַיִם
  choice: ఐగుప్తు అవమానాన్ని
  rationale: ‘నింద, అవమానం, అపకీర్తి’ అనే భావపరిధిలో సహజమైన తెలుగు పదాన్ని ఎంచుకొని, ‘ఐగుప్తు’తో ఉన్న సంబంధం ఏ విధమైనదో స్పష్టీకరించకుండా హెబ్రీయ మూలంలోని సందిగ్ధతను నిలిపింది.
- source_word: מֵעֲלֵיכֶם
  choice: మీ మీద నుండి
  rationale: అవమానం వారిమీద ఉన్నదనీ అది తొలగించబడిందనీ తెలిపే స్థలాత్మక రూపకాన్ని కాపాడుతుంది.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל
  choice: అందుచేత ఆ స్థలానికి గిల్గాలు అనే పేరు పెట్టారు
  rationale: మూలంలో కర్త స్పష్టంగా లేకపోవడాన్ని తెలుగులో అనిర్దిష్ట బహువచన క్రియతో సహజంగా నిలుపుతూ, ముందరి మాటతో పేరుపెట్టడానికి ఉన్న సంబంధాన్ని ‘అందుచేత’ తెలియజేస్తుంది.
- source_word: גִּלְגָּל
  choice: గిల్గాలు
  rationale: స్థలనామాన్ని తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది; మూలంలోని శబ్దప్రయోగం పాదసూచికలో వివరించబడింది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటి వరకూ దానికి అదే పేరు
  rationale: కథకుని కాలదృష్టిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఐగుప్తు అవమానం’ అనే పదబంధం అర్థం
  choice: అది దాస్యపు అవమానమా, ఐగుప్తీయులు చేసిన నిందా, లేక నిబంధన గుర్తుకు సంబంధించిన అపకీర్తియా అని ప్రధాన పాఠ్యంలో నిర్దిష్టంగా చెప్పలేదు.
  alternative: దీనిని ఇశ్రాయేలు ఐగుప్తులో అనుభవించిన దాస్యపు అవమానంగా లేదా సున్నతి లేకపోవడం వల్ల కలిగిన నిబంధన అపకీర్తిగా స్పష్టీకరించడం.
  rationale: חֶרְפַּת מִצְרַיִם అనే హెబ్రీయ నిర్మాణం సంబంధాన్ని నిర్దిష్టం చేయదు; అందువల్ల దాని నిజమైన వ్యాఖ్యాన విస్తృతిని, వేదాంత ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలి. ‘ఐగుప్తు అవమానం’ అనే మూలపాఠ్య సందిగ్ధతను ఉద్దేశపూర్వకంగా నిలిపింది; శబ్దప్రయోగాన్ని ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిపి తెలియజేస్తాయి.
