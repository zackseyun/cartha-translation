  to: యెహోవా యెహోషువతో, “నేడు నేను ఐగుప్తు అవమానాన్ని మీ మీద నుండి దొర్లించివేశాను” అని చెప్పాడు. అందుచేత ఆ స్థలానికి నేటివరకు గిల్గాలు[a] అనే పేరు ఉంది.
