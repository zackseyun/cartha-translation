  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶם֙ הֵקִ֣ים תַּחְתָּ֔/ם אֹתָ֖/ם מָ֣ל יְהוֹשֻׁ֑עַ כִּי עֲרֵלִ֣ים הָי֔וּ כִּ֛י לֹא מָ֥לוּ אוֹתָ֖/ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
translation:
  language: te
  text: వారి స్థానంలో నిలబెట్టిన వారి కుమారులకు[a] యెహోషువ సున్నతి చేశాడు. ఎందుకంటే వారు సున్నతి పొందనివారే; ప్రయాణంలో వారికి సున్నతి చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారికి బదులుగా’; ఈ కుమారులు మునుపటి తరం స్థానాన్ని స్వీకరించారని హీబ్రూ పదబంధం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: వారి కుమారులకు
  rationale: సున్నతి సందర్భంలో ఇది మగ సంతానాన్ని ప్రత్యేకంగా సూచిస్తుంది; అందువల్ల విస్తృతార్థకమైన ‘పిల్లలు’ కంటే ‘కుమారులు’ ఖచ్చితమైనది.
- source_word: הֵקִים תַּחְתָּם
  choice: వారి స్థానంలో ఆయన నిలబెట్టిన
  rationale: హిఫిల్ రూపమైన הֵקִים మరియు תַּחְתָּם కలిపి, మునుపటి తరానికి బదులుగా కుమారులు వారి స్థానాన్ని స్వీకరించారని సూచిస్తాయి.
- source_word: אֹתָם מָל יְהוֹשֻׁעַ
  choice: యెహోషువ సున్నతి చేశాడు
  rationale: מוּל అనేది సున్నతి చేయడాన్ని సూచించే సాధారణ క్రియ; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా కర్మను ముందే ఉంచి సహజంగా అనువదించబడింది.
- source_word: עֲרֵלִים
  choice: సున్నతి పొందనివారుగా
  rationale: వారి భౌతిక, నిబంధన సంబంధ స్థితిని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כִּי לֹא מָלוּ אֹתָם
  choice: వారికి సున్నతి చేయలేదు
  rationale: హీబ్రూలో క్రియకు నిర్దిష్ట కర్త చెప్పబడలేదు. తెలుగులో కర్తలేని ఈ నిర్మాణం ఆ అనిర్దిష్టతను సహజంగా కాపాడుతుంది.
- source_word: בַּדָּרֶךְ
  choice: ప్రయాణంలో
  rationale: అరణ్య ప్రయాణ కాలాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
theological_decisions:
- issue: నిబంధనకు సంబంధించిన శారీరక స్థితి
  choice: సున్నతి పొందనివారుగా
  alternative: సున్నతి లేనివారుగా
  rationale: ఇక్కడ రూపకార్థం కాకుండా నిజమైన శారీరక సున్నతే ఉద్దేశించబడింది. ‘సున్నతి పొందనివారు’ అనే రూపం చర్య జరగలేదనే తరువాతి వివరణతోనూ సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ మూలంలోని రెండవ బహువచన క్రియకు నిర్దిష్ట కర్త లేకపోవడాన్ని ‘సున్నతి చేయలేదు’ అనే కర్తలేని నిర్మాణంతో నిలుపుకుంది; [a] గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
