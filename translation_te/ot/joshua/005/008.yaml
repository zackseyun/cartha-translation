  text: And when all the nation had finished being circumcised[a], they remained in their places in the camp until they recovered.
translation:
  language: te
  text: జాతి అంతటివారు సున్నతి పొందడం పూర్తయిన తర్వాత, వారు కోలుకునే వరకు శిబిరంలో తమ తమ స్థలాల్లోనే ఉండిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారు స్వస్థపడే వరకు,” లేదా “వారు తిరిగి తేరుకునే వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: పూర్తయినప్పుడు
  rationale: హీబ్రూ కథన సూత్రం కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది; తెలుగులో సహజమైన క్రమాన్ని చూపేందుకు ‘అప్పుడు’ భావాన్ని ప్రధాన వాక్య నిర్మాణంలో వ్యక్తం చేశాం.
- source_word: תַּמּוּ
  choice: పూర్తయినప్పుడు
  rationale: క్రియ కార్యసమాప్తిని సూచిస్తుంది; తెలుగు కాలసంబంధ నిర్మాణంలో ‘పూర్తయినప్పుడు’ సహజంగా ఉంటుంది.
- source_word: כָל הַגּוֹי
  choice: జాతివారందరికీ
  rationale: ఇది ఇశ్రాయేలును ఏకవచన సామూహిక సముదాయంగా సూచిస్తుంది; ‘జాతివారందరూ’ అనే భావాన్ని తెలుగులో సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: לְהִמּוֹל
  choice: సున్నతి చేయడం
  rationale: నిఫాల్ రూపంలోని సున్నతి పొందే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘జాతివారందరికీ’తో కలిపి కర్మణి భావం నిలుస్తుంది.
- source_word: וַיֵּשְׁבוּ
  choice: ఉండిపోయారు
  rationale: ఇక్కడ కూర్చున్న భంగిమకన్నా, కోలుకునేంతవరకు అక్కడే కొనసాగి ఉండడమే సందర్భార్థం.
- source_word: תַחְתָּם
  choice: తమ తమ స్థలాల్లోనే
  rationale: పదశః ‘వారి కింద’ అని కాక, ఉన్న చోటనే ఉండడాన్ని సూచించే హీబ్రూ నుడికారాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בַּמַּחֲנֶה
  choice: శిబిరంలో
  rationale: స్థలాన్ని సూచించే ప్రామాణికమైన, సహజమైన తెలుగు రూపం.
- source_word: עַד חֲיוֹתָם
  choice: వారు కోలుకునే వరకు
  rationale: חיה ఇక్కడ సున్నతి అనంతరం ఆరోగ్యం లేదా బలం తిరిగి పొందడాన్ని సూచిస్తుంది; ‘కోలుకునే’ అనేది సహజమైనదైనా, మూలంలోని ‘బతకడం/తేరుకోవడం’ పరిధిని పాదటిప్పణిలో నిలిపాం.
