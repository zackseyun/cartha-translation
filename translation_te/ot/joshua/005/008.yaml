  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సున్నతి’ అనే సుపరిచిత బైబిలు పదాన్ని ఉంచి, అరుదైన లేదా అతిగా సంస్కృతీకృత రూపాలను నివారించాం.
