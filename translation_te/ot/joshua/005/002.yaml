source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא אָמַ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ עֲשֵׂ֥ה לְ/ךָ֖ חַֽרְב֣וֹת צֻרִ֑ים וְ/שׁ֛וּב מֹ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל שֵׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
translation:
  language: te
  text: ఆ సమయంలో యెహోవా యెహోషువతో, “నీ కోసం చెకుముకి రాతి కత్తులు చేసుకో; ఇశ్రాయేలు కుమారులకు మళ్లీ రెండోసారి సున్నతి చేయి[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మళ్లీ రెండోసారి” అంటే అదే వ్యక్తులకు రెండుసార్లు సున్నతి చేయడం కాదు; ఇశ్రాయేలు ప్రజల సమూహంగా సున్నతిని తిరిగి నిర్వహించడాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: కథన సందర్భాన్ని పరిచయం చేసే సాధారణ హీబ్రూ కాలసూచక పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: עֲשֵׂה לְךָ
  choice: నీవు ... చేసుకొని
  rationale: ఆజ్ఞతో కూడిన ప్రయోజనార్థక సర్వనామ భావాన్ని సహజమైన తెలుగు క్రియారూపంలో వ్యక్తం చేస్తుంది.
- source_word: חַרְבוֹת צֻרִים
  choice: చెకుముకిరాతి కత్తులు
  rationale: సున్నతి సందర్భంలో חַרְבוֹת అనేది ఖడ్గాలకన్నా కోయడానికి ఉపయోగించే కత్తులను సూచిస్తుంది; צֻרִים వాటి పదార్థమైన చెకుముకిరాతిని తెలుపుతుంది.
- source_word: וְשׁוּב ... שֵׁנִית
  choice: మళ్లీ, రెండోసారి
  rationale: పునరావృతిని సూచించే రెండు హీబ్రూ అంశాలనూ కూలదోసకుండా తెలుగులో విడివిడిగా నిలుపుతుంది.
- source_word: מֹל
  choice: సున్నతి చేయి
  rationale: నిబంధన సందర్భంలోని క్రియకు స్పష్టమైన, సాధారణ తెలుగు సమానం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ రూపాన్నీ, ఈ సందర్భంలో సున్నతి పొందే పురుషులనే సూచిస్తున్న భావాన్నీ కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపం దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితమైందని ఇది ప్రకటించదు.
- issue: ‘మళ్లీ, రెండోసారి’ అనే పునరుక్తి భావం
  choice: రెండు సూచనలనూ ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: కేవలం ‘మళ్లీ’ అని అనువదించడం
  rationale: וְשׁוּב మరియు שֵׁנִית రెండూ పునరావృతిని సూచిస్తాయి. ఇది అదే వ్యక్తులకు రెండుసార్లు సున్నతి చేయాలని తప్పనిసరిగా అర్థం కాదనే సందర్భపరమైన ఉద్రిక్తతను పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చెకుముకిరాతి కత్తులు’ మూలంలోని పదార్థాన్నీ పనిముట్టు స్వభావాన్నీ స్పష్టంగా తెలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
