  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
translation:
  language: te
  text: ఎందుకంటే, ఐగుప్తు నుండి బయలుదేరిన ప్రజలంతా సున్నతి పొందినవారే. అయితే, వారు ఐగుప్తు నుండి బయలుదేరిన తర్వాత దారిలో అరణ్యంలో పుట్టిన ప్రజలందరికీ సున్నతి చేయలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “వారు ఐగుప్తు నుండి బయలుదేరినప్పుడు దారిలో అరణ్యంలో పుట్టిన ప్రజలందరికీ సున్నతి చేయలేదు.”'
    reason: బְּצֵאתָם అనే కాలసూచక నిర్మాణానికి రూపసన్నిహిత ప్రత్యామ్నాయాన్ని ఇస్తుంది; ప్రధాన పాఠంలోని ‘బయలుదేరిన తర్వాత’ సందర్భానుకూల వివరణను నిలుపుతుంది.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలో చెప్పిన కార్యానికి ఈ వాక్యం వివరణ ఇస్తోంది; అందువల్ల కారణసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֻלִים הָיוּ
  choice: సున్నతి పొందినవారే
  rationale: היה తో కూడిన కర్మణి కృదంతం ముందే ఏర్పడిన స్థితిని సూచిస్తుంది; తెలుగు సందర్భంలో ఈ రూపం ఆ స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలంతా / ప్రజలందరికీ
  rationale: హీబ్రూ పదం సమూహాన్ని సూచిస్తుంది; మూలంలో లేని ‘పురుషులు’ అనే పరిమితిని అనువాదంలో చేర్చలేదు.
- source_word: הַיֹּצְאִים
  choice: బయలుదేరిన
  rationale: ఐగుప్తు నుండి బయలుదేరిన తరాన్ని సూచించే నామవాచకార్థక కృదంతాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וְכָל הָעָם הַיִּלֹּדִים
  choice: అయితే ... పుట్టిన ప్రజలందరికీ
  rationale: וְ ఇక్కడ రెండు తరాల మధ్య వ్యత్యాసాన్ని కలుపుతోంది; ‘అయితే’ ఆ వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా చేస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: నిర్గమ ప్రయాణ సందర్భంలోని జనావాసంలేని ప్రదేశాన్ని సూచించే సాంప్రదాయబద్ధమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: בַּדֶּרֶךְ
  choice: ప్రయాణమార్గంలో
  rationale: కేవలం రహదారిని కాకుండా ప్రయాణకాలం మరియు ప్రయాణపథం రెండింటినీ సూచించే సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּצֵאתָם מִמִּצְרַיִם
  choice: వారు ఐగుప్తు నుండి బయలుదేరిన తర్వాత
  rationale: అరణ్యప్రయాణంలో పుట్టిన తరాన్ని నిర్గమానంతర కాలంతో అనుసంధానిస్తుంది; హీబ్రూ నిర్మాణంలోని మరింత రూపసన్నిహిత పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: לֹא מָלוּ
  choice: సున్నతి చేయలేదు
  rationale: హీబ్రూలోని క్రియాశీల బహువచన రూపాన్ని, కర్తను ఊహించి చేర్చకుండా, తెలుగులో సహజమైన అనిర్దిష్ట కర్త నిర్మాణంతో నిలుపుతుంది.
