  text: וַ/יִּשְׁבֹּ֨ת הַ/מָּ֜ן מִֽ/מָּחֳרָ֗ת בְּ/אָכְלָ/ם֙ מֵ/עֲב֣וּר הָ/אָ֔רֶץ וְ/לֹא הָ֥יָה ע֛וֹד לִ/בְנֵ֥י יִשְׂרָאֵ֖ל מָ֑ן וַ/יֹּאכְל֗וּ מִ/תְּבוּאַת֙ אֶ֣רֶץ כְּנַ֔עַן בַּ/שָּׁנָ֖ה הַ/הִֽיא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
translation:
  language: te
  text: వారు దేశపు పంటను[a] తిన్న మరుసటి రోజున మన్నా ఆగిపోయింది. ఇశ్రాయేలు కుమారులకు[b] ఇక మన్నా లేదు; ఆ సంవత్సరం వారు కనాను దేశపు దిగుబడిని తిన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశపు పాత పంటను.’ ఇక్కడి హీబ్రూ పదం గత సంవత్సరపు పంటలో నిల్వచేసిన ధాన్యాన్ని మరింత నిర్దిష్టంగా సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇశ్రాయేలు కుమారులు’ అనేది హీబ్రూ పదబంధానికి మరింత అక్షరానుసారమైన అనువాదం; భావపరంగా ఇది ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  choice: నిలిచిపోయింది
  rationale: שׁבת ఇక్కడ విశ్రాంతిదిన ఆచరణను కాక, సరఫరా ఆగిపోవడాన్ని సూచిస్తుంది; ‘నిలిచిపోయింది’ సహజంగా ఆ ముగింపును తెలియజేస్తుంది.
- source_word: הַמָּן / מָן
  choice: మన్నా
  rationale: అరణ్యంలో దేవుడు అందించిన ఆహారానికి తెలుగులో ప్రాచుర్యంలో ఉన్న ప్రామాణిక రూపం.
- source_word: מִמָּחֳרָת
  choice: మరుసటి రోజున
  rationale: ముందటి వచనంలో పేర్కొన్న భోజనం తరువాతి రోజును సూచించే సహజమైన కాలవ్యక్తీకరణ.
- source_word: בְּאָכְלָם
  choice: వారు ... తిన్న
  rationale: ב ప్రిఫిక్స్ గల infinitive construct ఇక్కడ కాలసంబంధాన్ని తెలియజేస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘తిన్న మరుసటి రోజున’ క్రమాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: దేశపు పంటలోనిది
  rationale: עֲבוּר దేశంలో పండిన ఆహారధాన్యం లేదా పంటను సూచిస్తుంది. ‘పంటలోనిది’ విస్తృత భావాన్ని నిలుపుతుంది; పాత నిల్వపంట అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְלֹא הָיָה עוֹד
  choice: ఇక ... లభించలేదు
  rationale: అక్షరార్థంగా ‘ఇక లేదు’; మన్నా సరఫరా ఇక కొనసాగలేదనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: మూలంలోని בְּנֵי అనే పుంలింగ బంధుత్వపదాన్ని పారదర్శకంగా నిలుపుతూ, తెలుగులో అర్థమయ్యే రూపం.
- source_word: מִתְּבוּאַת
  choice: దిగుబడిలోనిది
  rationale: תְּבוּאָה పంట దిగుబడిని సూచిస్తుంది; ముందున్న עֲבוּר‌కు భిన్నమైనప్పటికీ సమీపార్థాన్ని కాపాడుతుంది.
- source_word: אֶרֶץ כְּנַעַן
  choice: కనాను దేశపు
  rationale: ‘కనాను దేశం’ అనే పూర్తి భౌగోళిక వ్యక్తీకరణను నిలుపుతుంది.
- source_word: בַּשָּׁנָה הַהִיא
  choice: ఆ సంవత్సరం
  rationale: మూలంలోని నిర్దిష్ట గత సంవత్సర సూచనకు సహజమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథనశైలిని ఉపయోగించాం. మూలంలోని రెండు వ్యవసాయ పదాలకు వరుసగా ‘పంట’ మరియు ‘దిగుబడి’ అని భేదం ఉంచాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
