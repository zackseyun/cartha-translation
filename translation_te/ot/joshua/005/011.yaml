source:
  edition: WLC
  text: וַ/יֹּ֨אכְל֜וּ מֵ/עֲב֥וּר הָ/אָ֛רֶץ מִ/מָּֽחֳרַ֥ת הַ/פֶּ֖סַח מַצּ֣וֹת וְ/קָל֑וּי בְּ/עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/011.yaml
  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
translation:
  language: te
  text: 'వారు పస్కా పండుగ మరుసటి రోజున ఆ దేశపు పంటలో[a] కొంత తిన్నారు: పులియని రొట్టెలను, కాల్చిన ధాన్యాన్ని[b]—సరిగ్గా ఆ రోజునే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశపు పాత పంట.’ హీబ్రూ పదం దేశపు పంటను లేదా దిగుబడిని సూచిస్తుంది; సందర్భాన్ని బట్టి కొందరు దీనిని మునుపటి కోతలో నిల్వ చేసిన పంటగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వేపిన ధాన్యం.’ హీబ్రూ పదం నిప్పుపై కాల్చి లేదా వేయించి సిద్ధం చేసిన ధాన్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: వారు తిన్నారు
  rationale: అఖల్ అనే క్రియ యొక్క వయ్యిక్టోల్ రూపం కథనంలోని తదుపరి సంఘటనను తెలియజేస్తుంది; తెలుగులో సహజమైన కథన ప్రవాహం కోసం ‘వారు తిన్నారు’ అని అనువదించాం.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: ఆ దేశపు పంటలో కొంత
  rationale: עֲבוּר ఇక్కడ ఆ దేశపు పంట లేదా దిగుబడిని సూచిస్తుంది. מן భాగార్థక భావాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘పంటలో కొంత’ అని ఇచ్చాం; ‘పాత పంట’ అనే భావం సందర్భపరంగా సాధ్యమైనా పదంలో స్పష్టంగా లేదు.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: పస్కా పండుగ మరుసటి రోజున
  rationale: ఈ పదబంధం పస్కా తరువాతి రోజును కాలసూచనగా నిర్దిష్టంగా తెలియజేస్తుంది.
- source_word: מַצּוֹת
  choice: పొంగని రొట్టెలు
  rationale: పస్కా సందర్భంలో పులియబెట్టని రొట్టెలను సూచించే పదానికి సాధారణ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: וְקָלוּי
  choice: వేయించిన ధాన్యం
  rationale: קָלוּי నిప్పుతో వేయించిన లేదా కాల్చిన ధాన్యాన్ని సూచిస్తుంది; ‘వేయించిన ధాన్యం’ ఆధునిక పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: సరిగ్గా ఆ రోజునే
  rationale: ఈ హీబ్రూ నుడికారం అదే నిర్దిష్ట రోజును నొక్కి చెబుతుంది. తెలుగు కథన దృక్కోణంలో ‘ఆ’ సహజంగా ఉండగా, ‘సరిగ్గా...నే’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని సంఘటనల క్రమం, పస్కా కాలసూచన, అదే రోజుపై ఉన్న ఉద్ఘాటన నిలుపబడ్డాయి. ‘పాత పంట’ అనే సందర్భాధారిత అర్థాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా పాదసూచికలో ఇచ్చాం.
