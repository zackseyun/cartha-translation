base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
translation:
  language: te
  text: 'యెహోషువ వారికి సున్నతి చేయడానికి కారణం ఇదే[a]: ఐగుప్తు నుండి బయలుదేరిన ప్రజలందరిలోని పురుషులు, అంటే యుద్ధవీరులందరూ[b], ఐగుప్తు నుండి బయలుదేరిన తరువాత మార్గమధ్యంలో అరణ్యంలో చనిపోయారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత పదానుసారంగా, “యెహోషువ సున్నతి చేసిన విషయం ఇదే.” ఇక్కడి హీబ్రూ నుడికారం యెహోషువ చేసిన కార్యానికి కారణాన్ని పరిచయం చేస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: “యుద్ధవీరులు” అనే మాటను “యుద్ధం చేసే పురుషులు” లేదా “పోరాట యోధులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר
  choice: కారణం ఇదే
  rationale: ‘విషయం ఇదే’ అనే మరింత రూపానుగత అర్థం ఇక్కడ యెహోషువ చేసిన కార్యానికి వివరణను పరిచయం చేసే హీబ్రూ నుడికారంగా ఉంది; సహజమైన తెలుగులో దాని వివరణాత్మక భావాన్ని ‘కారణం ఇదే’ స్పష్టంగా అందిస్తుంది.
- source_word: אֲשֶׁר מָל יְהוֹשֻׁעַ
  choice: యెహోషువ వారికి సున్నతి చేయడానికి
  rationale: హీబ్రూ సంబంధవాక్యం సందర్భంలో యెహోషువ చేసిన సున్నతి కార్యానికి కారణాన్ని సూచిస్తుంది. కర్మను తెలుగు వాక్యానికి అవసరమైన విధంగా సందర్భం నుండి ‘వారికి’ అని వ్యక్తం చేశాం.
- source_word: מָל
  choice: సున్నతి చేయడానికి
  rationale: మూల క్రియకు ఆధునిక ప్రామాణిక తెలుగులో ఖచ్చితమైన, సాధారణంగా అర్థమయ్యే సమానార్థకం.
- source_word: כָּל הָעָם הַיֹּצֵא מִמִּצְרַיִם הַזְּכָרִים
  choice: ఐగుప్తు నుండి బయలుదేరిన ప్రజలలోని పురుషులు
  rationale: ‘ప్రజలందరూ’ అనే సమూహంలో తరువాతి ‘పురుషులు’ అనే పదం సూచించే వర్గాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; మూలంలో లింగాన్ని ప్రత్యేకంగా పేర్కొనడాన్ని నిలుపుతుంది.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: అంటే యుద్ధవీరులందరూ
  rationale: ‘పురుషులు’ అనే పదానికి సమాంతర వివరణగా ఉన్న సైనిక వర్గీకరణను ‘అంటే’ ద్వారా సహజంగా చూపిస్తుంది. ‘యుద్ధవీరులు’ ప్రస్తుత తెలుగులో స్పష్టమైన సైనిక పదం.
- source_word: מֵתוּ
  choice: చనిపోయారు
  rationale: కథనానికి సహజమైన తెలుగు భూతకాల రూపం; ముందుగా జరిగిన మరణాన్ని సందర్భం మరియు ‘తర్వాత’ అనే కాలసూచన స్పష్టం చేస్తాయి.
- source_word: בַּמִּדְבָּר בַּדֶּרֶךְ
  choice: దారిలో అరణ్యంలో
  rationale: ప్రయాణ మార్గంలోనే, అరణ్యంలో వారు మరణించారనే రెండు స్థానసూచనలను మూల క్రమానికి దగ్గరగా నిలుపుతుంది.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: ఐగుప్తు నుండి బయలుదేరిన తర్వాత
  rationale: నిర్గమనానంతర ప్రయాణంలో మరణం సంభవించిందనే కాలసంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
