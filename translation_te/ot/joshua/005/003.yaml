base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/003.yaml
  text: So Joshua made for himself flint knives and circumcised the sons of Israel at Gibeath-haaraloth[a][b][c].
translation:
  language: te
  text: అప్పుడు యెహోషువ తనకోసం చెకుముకి రాతి కత్తులు తయారుచేసి, గిబ్యత్-హాఅరాలోత్ వద్ద ఇశ్రాయేలు కుమారులకు సున్నతి చేశాడు.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెకుముకి రాతి ఖడ్గాలు/పదునైన కత్తులు.” ఇక్కడ ఉపయోగించిన హీబ్రూ పదం సాధారణంగా “ఖడ్గం” అని అర్థమిస్తుంది; ఈ సందర్భంలో మాత్రం సున్నతి చేయడానికి ఉపయోగించిన కోసే పనిముట్లను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులు”; దీనిని “ఇశ్రాయేలీయులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “గిబ్యత్-హాఅరాలోత్” అనే హీబ్రూ పేరుకు అక్షరార్థంగా “శిశ్నాగ్ర చర్మాల కొండ” అని అర్థం.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: తయారుచేసి
  rationale: עשה అనే క్రియకు ఈ సందర్భంలో ‘చేశాడు/తయారుచేశాడు’ అనే అర్థం ఉంది; పనిముట్ల తయారీని సహజంగా తెలుపుతుంది.
- source_word: לּוֹ
  choice: తనకోసం
  rationale: యెహోషువ తన ఉపయోగం కోసం వాటిని సిద్ధం చేసుకున్నాడనే సందర్భానుగుణ ప్రతిబింబార్థాన్ని తెలుపుతుంది.
- source_word: חַרְבוֹת צֻרִים
  choice: చెకుముకిరాతి కత్తులు
  rationale: חֶרֶב సాధారణంగా ‘ఖడ్గం’ అని అర్థమైనా, ఇక్కడ సున్నతి కోసం ఉపయోగించే కోసే పనిముట్టును సూచిస్తుంది; צֻרִים దాని చెకుముకిరాతి పదార్థాన్ని తెలుపుతుంది.
- source_word: וַיָּמָל
  choice: సున్నతి చేశాడు
  rationale: מול అనే క్రియకు స్పష్టంగా ‘సున్నతి చేయడం’ అనే అర్థమే ఉంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: హీబ్రూ పదబంధంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని కాపాడుతూ, తెలుగు వాక్యనిర్మాణానికి తగిన విభక్తిని ఉపయోగిస్తుంది.
- source_word: אֶל
  choice: దగ్గర
  rationale: స్థలనామంతో వచ్చిన אֶל ఇక్కడ చర్య జరిగిన ప్రదేశాన్ని సూచిస్తుంది; తెలుగులో ‘దగ్గర’ సహజంగా ఉంటుంది.
- source_word: גִּבְעַת הָעֲרָלוֹת
  choice: గిబియత్-హారాలోతు
  rationale: ప్రదేశనామాన్ని లిప్యంతరీకరించడం ద్వారా మూలంలోని స్థలనామ స్వరూపాన్ని నిలుపుతుంది; దాని పారదర్శక అర్థాన్ని పాదసూచికలో ఇస్తుంది.
