translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘సున్నతి’ అనే విస్తృతంగా అర్థమయ్యే బైబిలు పదం నిలుపబడింది. స్థలనామం లిప్యంతరీకరించి, దాని అర్థం పాదసూచికలో వివరించబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
