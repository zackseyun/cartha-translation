source:
  edition: WLC
  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
translation:
  language: te
  text: ఎందుకంటే, ఐగుప్తు నుండి బయలుదేరిన యుద్ధపురుషులైన ఆ జనమంతా అంతమయ్యే వరకు ఇశ్రాయేలీయులు అరణ్యంలో నలభై సంవత్సరాలు నడిచారు; వారు యెహోవా మాట వినలేదు కాబట్టి, వారి పితరులకు మనకు ఇస్తానని యెహోవా ప్రమాణం చేసిన పాలు తేనెలు ప్రవహించే దేశాన్ని వారికి చూపనని యెహోవా వారితో ప్రమాణం చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘మనకు’ అని ఉంది; కొన్ని ప్రాచీన అనువాదాలు ‘వారికి’ అని చదువుతాయి.
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని పరిస్థితికి కారణాన్ని వివరించే సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָלְכוּ
  choice: నడిచారు
  rationale: మూలంలోని నడవడం/వెళ్లడం అనే దృశ్యభావాన్ని నిలుపుతూ, అరణ్య సంచారాన్ని సూచిస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని వంశసంబంధమైన, పురుషలింగ రూపాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: బైబిలు భౌగోళిక సందర్భంలోని జనావాసం లేని విస్తార ప్రాంతాన్ని సూచించే సహజమైన ప్రామాణిక పదం.
- source_word: עַד תֹּם
  choice: అంతరించిపోయే వరకు
  rationale: సమూహం పూర్తిగా లేకుండా పోయిన సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది; మరణ విధానాన్ని అదనంగా నిర్దేశించదు.
- source_word: כָּל הַגּוֹי אַנְשֵׁי הַמִּלְחָמָה
  choice: యుద్ధపురుషులైన ఆ జనమంతా
  rationale: జనసమూహ భావాన్నీ, దానిని వివరించే యుద్ధపురుషులు అనే అనుబంధాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  choice: యెహోవా స్వరానికి లోబడలేదు
  rationale: ‘స్వరాన్ని వినడం’ అనే హీబ్రూ నుడికారంలోని వినికిడి చిత్రాన్ని ‘స్వరానికి’ ద్వారా ఉంచి, సందర్భంలోని విధేయత భావాన్ని ‘లోబడలేదు’తో స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో పరిచితమైన రూపంలో ప్రతిబింబిస్తుంది.
- source_word: נִשְׁבַּע ... לְבִלְתִּי הַרְאוֹתָם
  choice: వారికి చూపనని ... ప్రమాణం చేశాడు
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని, ప్రమాణంలోని నిరాకరణ విషయాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: పాలు తేనెలు ప్రవహించే దేశం
  rationale: సమృద్ధిని తెలిపే మూల రూపకాన్ని సాంప్రదాయబద్ధంగా, అర్థమయ్యే విధంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా ప్రత్యక్షంగా సూచిస్తుంది.
- issue: לָנוּ లోని ప్రథమ పురుష బహువచనం
  choice: మనకు
  alternative: వారికి
  rationale: మసొరేటిక్ పాఠంలోని ‘మనకు’ అనే అనూహ్యమైన పఠనాన్ని సరిచేయకుండా నిలుపుతుంది; కొన్ని ప్రాచీన సాక్ష్యాలలో కనిపించే ‘వారికి’ పఠనాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. మూలంలోని దీర్ఘ వాక్యాన్ని పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించినా, కారణ సంబంధం, యుద్ధపురుషుల అనుబంధ వివరణ, ప్రమాణ భాష, ‘మనకు’ అనే పాఠభేద ఉద్రిక్తత అన్నీ నిలుపబడ్డాయి.
