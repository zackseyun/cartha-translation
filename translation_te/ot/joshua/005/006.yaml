revisions:
- from: ఎందుకంటే ఇశ్రాయేలు కుమారులు నలభై సంవత్సరాలు అరణ్యంలో నడిచారు. ఐగుప్తు నుండి బయలుదేరిన యుద్ధపురుషులైన ఆ జనమంతా అంతరించిపోయే వరకు వారు అలా నడిచారు; ఎందుకంటే వారు యెహోవా స్వరానికి లోబడలేదు. అందువల్ల యెహోవా వారి పితరులకు మనకు ఇస్తానని ప్రమాణం చేసిన దేశాన్ని—పాలు తేనెలు ప్రవహించే దేశాన్ని—వారికి చూపనని యెహోవా వారితో ప్రమాణం చేశాడు.[a]
  to: ఎందుకంటే, ఐగుప్తు నుండి బయలుదేరిన యుద్ధపురుషులైన ఆ జనమంతా అంతమయ్యే వరకు ఇశ్రాయేలీయులు అరణ్యంలో నలభై సంవత్సరాలు నడిచారు; వారు యెహోవా మాట వినలేదు కాబట్టి, వారి పితరులకు మనకు ఇస్తానని యెహోవా ప్రమాణం చేసిన పాలు తేనెలు ప్రవహించే దేశాన్ని వారికి చూపనని యెహోవా వారితో ప్రమాణం చేశాడు.[a]
  rationale: పునరుక్తిని తొలగించి, ‘అంతమయ్యే వరకు’ అనే పరిమితి పదబంధాన్ని అరణ్యనడకతో నేరుగా కలిపాం. కారణ సంబంధాన్ని ‘వారు యెహోవా మాట వినలేదు కాబట్టి’ ద్వారా స్పష్టంగా ఉంచాం. ‘మనకు’ అనే మూలపాఠ పఠనం మరియు దానికి సంబంధించిన పాదటిప్పణి యథాతథంగా నిలిచాయి.
