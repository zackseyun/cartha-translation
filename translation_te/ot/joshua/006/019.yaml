source:
  edition: WLC
  text: וְ/כֹ֣ל כֶּ֣סֶף וְ/זָהָ֗ב וּ/כְלֵ֤י נְחֹ֨שֶׁת֙ וּ/בַרְזֶ֔ל קֹ֥דֶשׁ ה֖וּא לַֽ/יהוָ֑ה אוֹצַ֥ר יְהוָ֖ה יָבֽוֹא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
translation:
  language: te
  text: అయితే వెండి, బంగారం అంతా, అలాగే కంచుతో చేసిన వస్తువులన్నీ, ఇనుముతో చేసిన వస్తువులన్నీ యాహ్వేకు పవిత్రమైనవి; అవి యాహ్వే ఖజానాలోకి చేరాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: హీబ్రూలో ‘పవిత్రమైనది’, ‘చేరాలి’ అనే పదాలు ఏకవచనంలో ఉన్నాయి; జాబితాలోని లోహాలు, వస్తువులన్నిటినీ ఒక సమష్టిగా పరిగణించింది.
    reason: source_form
lexical_decisions:
- source_word: וְ/כֹל
  choice: అయితే ... అంతా
  rationale: וְ సాధారణంగా ‘మరియు’ అని అర్థమిచ్చినా, ముందటి వచనంలోని నిషేధానికి భిన్నంగా ఈ వస్తువులకు ఏమి చేయాలో చెప్పే సందర్భంలో ‘అయితే’ సహజమైన వ్యతిరేక భావాన్ని తెలియజేస్తుంది. כֹּל యొక్క సమగ్ర భావాన్ని ‘అంతా/అన్నీ’గా నిలిపాం.
- source_word: כֶּסֶף וְ/זָהָב
  choice: వెండి, బంగారం
  rationale: ఇక్కడ ఇతర లోహాలతో కలిపి ప్రస్తావించబడినందున כֶּסֶף అంటే డబ్బు కాదు, వెండి లోహమే.
- source_word: וּ/כְלֵי נְחֹשֶׁת וּ/בַרְזֶל
  choice: కంచు, ఇనుముతో చేసిన వస్తువులు
  rationale: כְּלִי అనేది పాత్రలు, పనిముట్లు, సామగ్రి వంటి అనేక రకాల తయారుచేసిన వస్తువులను సూచించగల విస్తృత పదం; అందువల్ల ‘వస్తువులు’ మూలంలోని పరిధిని సంకుచితం చేయదు. נְחֹשֶׁתకు ఈ పురాతన వస్తుసందర్భంలో ‘కంచు’ సహజమైన ఎంపిక.
- source_word: קֹדֶשׁ הוּא לַ/יהוָה
  choice: యాహ్వేకు పవిత్రమైనవి
  rationale: కֹדֶשׁ ఇక్కడ దేవునికి ప్రత్యేకంగా కేటాయించబడిన పవిత్ర స్థితిని సూచిస్తుంది. తెలుగు వాక్యంలో జాబితాకు అనుగుణంగా బహువచనం వాడినా, హీబ్రూ ఏకవచన సమష్టి నిర్మాణాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: לַ/יהוָה / יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో ఉన్న దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אוֹצַר יְהוָה
  choice: యాహ్వే ఖజానా
  rationale: אוֹצָר విలువైన లోహాలు, వస్తువులు నిల్వచేసే ఖజానా లేదా నిల్వగదిని సూచిస్తుంది; ఈ సందర్భంలో ‘ఖజానా’ అత్యంత సహజం.
- source_word: יָבֽוֹא
  choice: చేరాలి
  rationale: ‘రావాలి/వెళ్లాలి’ అనే దిశాపరమైన భేదాన్ని అనవసరంగా ముందుకు తేవకుండా, అవి నిర్ణీత ఖజానాలోకి వెళ్లి చేరాలనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. క్రియను కర్మణి రూపంలోకి మార్చి ఎవరో వాటిని తీసుకువస్తారని మూలంలో లేని విషయాన్ని చేర్చలేదు.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: ఈ వచనం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా, హీబ్రూ నామానికి దగ్గరైన ‘యాహ్వే’ రూపాన్ని ఉంచడం మూలపాఠాన్ని పారదర్శకంగా ప్రతిబింబిస్తుంది.
- issue: קֹדֶשׁ యొక్క అర్పణ/పవిత్రత భావం
  choice: పవిత్రమైనవి
  alternative: ప్రతిష్ఠితమైనవి; యాహ్వేకే చెందినవి
  rationale: ‘పవిత్రమైనవి’ మూలపదంలోని పవిత్రతను నేరుగా నిలుపుతుంది; కేవలం యాజమాన్య భావానికి లేదా ఒక ప్రత్యేక ఆచారపద్ధతికి దాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘వస్తువులు’ అనే విస్తృత పదం మూలంలోని כְּלִי పరిధిని కాపాడుతుంది; ‘ఖజానా’ సందర్భానికి తగిన సాధారణ పదం.
