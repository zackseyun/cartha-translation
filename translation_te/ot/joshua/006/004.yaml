source:
  edition: WLC
  text: וְ/שִׁבְעָ֣ה כֹהֲנִ֡ים יִשְׂאוּ֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י הָ/אָר֔וֹן וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י תָּסֹ֥בּוּ אֶת הָ/עִ֖יר שֶׁ֣בַע פְּעָמִ֑ים וְ/הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּ/שּׁוֹפָרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/004.yaml
  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
translation:
  language: te
  text: ఏడుగురు యాజకులు ఏడు పొట్టేళ్ల కొమ్ము బూరలను[a] మందసం ముందు మోయాలి. ఏడవ రోజున మీరు పట్టణం చుట్టూ ఏడుసార్లు తిరగాలి; యాజకులు ఆ బూరలను ఊదాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏడు పొట్టేళ్ల కొమ్ములు.’ హీబ్రూ పదబంధం కొమ్ముతో చేసిన ఊదే వాద్యాలను సూచిస్తుంది; అవి బహుశా పొట్టేళ్ల కొమ్ములతో చేసినవి.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: మోయాలి
  rationale: נשא ఇక్కడ వస్తువులను మోయడాన్ని సూచిస్తుంది. ఆజ్ఞాత్మక సందర్భంలో ‘మోయాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: పొట్టేళ్ల కొమ్ము బూరలు
  rationale: שׁוֹפָר కొమ్ముతో చేసిన ఊదే వాద్యాన్ని సూచిస్తుంది; הַיּוֹבְלִים దాని రకాన్ని వివరిస్తుంది. ‘పొట్టేళ్ల కొమ్ము బూరలు’ వాద్యపు మూలాన్నీ దాని ఉపయోగాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది; ‘సునాద సంవత్సరపు బూరలు’ అని అనువదిస్తే ఈ సందర్భంలో తప్పుదారి పట్టించవచ్చు.
- source_word: לִפְנֵי הָאָרוֹן
  choice: మందసం ముందు
  rationale: לִפְנֵי స్థలపరంగా ‘ముందు’ అని అర్థం. మూలంలో ఈ వాక్యంలో లేని ‘నిబంధన మందసం’ అనే విస్తరణను చేర్చలేదు.
- source_word: תָּסֹבּוּ אֶת הָעִיר
  choice: మీరు పట్టణం చుట్టూ ... తిరగాలి
  rationale: סבב అంటే చుట్టూ తిరగడం లేదా ప్రదక్షిణగా వెళ్లడం. సైనిక ఊరేగింపు భావాన్ని బలవంతంగా చేర్చకుండా ‘చుట్టూ తిరగాలి’ మూల క్రియను సహజంగా అందిస్తుంది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: పునరావృత చర్యతో פְּעָמִים ‘సార్లు’ అని సహజంగా అనువదించబడుతుంది.
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: ఆ బూరలను ఊదాలి
  rationale: תקע + ב + שׁוֹפָר కొమ్ము బూరను ఊదడాన్ని సూచించే సాధారణ ప్రయోగం. ముందే వాద్యపు రకం తెలిపినందున పునరుక్తిని నివారించేందుకు ‘ఆ బూరలను’ వాడబడింది.
