translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘మందసం’ బైబిలు సందర్భానికి తగిన స్థిర పదంగా ఉంచబడింది; క్రియారూపాల్లో ఆజ్ఞాత్మక భావాన్ని ‘మోయాలి/తిరగాలి/ఊదాలి’తో సహజంగా వ్యక్తం చేశాం.
