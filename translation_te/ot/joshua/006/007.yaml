  to: 'వారు ప్రజలతో ఇలా అన్నారు: “ముందుకు వెళ్లి పట్టణం చుట్టూ తిరగండి. సాయుధులు[a] యాహ్వే మందసం ముందు వెళ్లాలి.”'
