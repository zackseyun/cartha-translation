id: JOS.6.7
reference: Joshua 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ו/יאמרו אֶל הָ/עָ֔ם עִבְר֖וּ וְ/סֹ֣בּוּ אֶת הָ/עִ֑יר וְ/הֶ֣/חָל֔וּץ יַעֲבֹ֕ר לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/007.yaml
  text: And they said to the people[a], “Pass on and go around the city, and let the armed men pass before the ark of Yahweh.”
translation:
  language: te
  text: 'వారు ప్రజలతో ఇలా అన్నారు: “ముందుకు వెళ్లి పట్టణం చుట్టూ తిరగండి. సాయుధులు[a] యాహ్వే మందసం ముందు వెళ్లాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముందరి దళం”; అంటే మందసం ముందు వెళ్లే సాయుధులు.
    reason: חָלוּץ అనే పదం సాయుధులనే కాక, మందసం ముందుగా సాగే దళాన్ని కూడా సూచించగలదు.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: వారు ... అన్నారు
  rationale: అמר్ క్రియ యొక్క బహువచన రూపాన్ని అలాగే ఉంచుతూ, హీబ్రూ కథనంలోని తదుపరి చర్యను సహజమైన తెలుగు వాక్యక్రమంలో తెలియజేస్తుంది.
- source_word: אֶל־הָעָם
  choice: ప్రజలతో
  rationale: עָם అనే పదానికి సాధారణ అర్థం ‘ప్రజలు.’ సైనిక సందర్భం ఉన్నప్పటికీ ‘సైన్యం’ అని అర్థాన్ని అనవసరంగా కుదించకుండా మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: עִבְרוּ
  choice: ముందుకు వెళ్లి
  rationale: ఇక్కడ עבר ఏదైనా నది లేదా సరిహద్దును దాటడాన్ని కాక, ఊరేగింపులో ముందుకు కదలడాన్ని సూచిస్తుంది.
- source_word: וְסֹבּוּ אֶת־הָעִיר
  choice: పట్టణం చుట్టూ తిరగండి
  rationale: סבב సూచించే పట్టణం చుట్టూ కదలడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని అదనపు సైనిక భావాన్ని చేర్చదు.
- source_word: וְהֶחָלוּץ
  choice: ఆయుధాలు ధరించినవారు
  rationale: חָלוּץ యుద్ధానికి ఆయుధాలు ధరించి సిద్ధమైనవారిని, సందర్భానుసారం ముందరి దళాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఆయుధసన్నద్ధతను స్పష్టంగా తెలియజేస్తుంది; దళస్థాన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: יַעֲבֹר
  choice: నడవాలి
  rationale: ఈ సందర్భంలో ఈ అపూర్ణ క్రియ ఆజ్ఞాత్మక సూచనను వ్యక్తం చేస్తుంది. ‘నడవాలి’ ఊరేగింపు సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: యెహోవా మందసం ముందు
  rationale: לִפְנֵי యొక్క స్థానార్థమైన ‘ముందు’ను కాపాడుతూ, אֲרוֹןను ఒడంబడిక మందసం సందర్భానికి అనుగుణంగా ‘మందసం’గా అనువదించింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగానే అందించడం మూలానికి దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. ఆజ్ఞలను సహజమైన బహువచన రూపాల్లో ఇచ్చి, సైనిక సందర్భాన్ని అవసరానికి మించి విస్తరించలేదు.
