id: JOS.6.6
reference: Joshua 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֞א יְהוֹשֻׁ֤עַ בִּן נוּן֙ אֶל הַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם שְׂא֖וּ אֶת אֲר֣וֹן הַ/בְּרִ֑ית וְ/שִׁבְעָ֣ה כֹֽהֲנִ֗ים יִשְׂאוּ֙ שִׁבְעָ֤ה שֽׁוֹפְרוֹת֙ יוֹבְלִ֔ים לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
translation:
  language: te
  text: అప్పుడు నూను కుమారుడైన యెహోషువ యాజకులను పిలిచి వారితో, “నిబంధన మందసాన్ని మోయండి; ఏడుగురు యాజకులు యెహోవా మందసం ముందు పొట్టేళ్ల కొమ్ములతో చేసిన ఏడు బూరలను[a] మోయాలి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పొట్టేళ్ల కొమ్ముల ఏడు బూరలను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: קרא క్రియ ఇక్కడ యెహోషువ యాజకులను ఉద్దేశించి మాట్లాడటాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పిలిచి’ సహజంగా, తగిన గంభీరతతో ఉంది.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువ
  rationale: హీబ్రూ పితృనామ సంబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులను
  rationale: ఆరాధనా సందర్భంలోని כֹּהֵן పదానికి ప్రామాణికమైన తెలుగు పదం.
- source_word: שְׂאוּ
  choice: మోయండి
  rationale: נשׂא ఆజ్ఞారూపం మందసాన్ని ఒక ప్రదేశం నుంచి మరొక ప్రదేశానికి తీసుకెళ్లే సందర్భంలో ఉంది; ‘మోయండి’ ఉద్దేశించిన కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲרוֹן הַבְּרִית
  choice: నిబంధన మందసాన్ని
  rationale: నిబంధనకు సంబంధించిన పవిత్ర పెట్టెను సూచించే స్థిరమైన, మూలానికి నమ్మకమైన తెలుగు ప్రయోగం.
- source_word: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ
  choice: ఏడుగురు యాజకులు ... మోయాలి
  rationale: ఆజ్ఞ తరువాత వచ్చే హీబ్రూ అసంపూర్ణ క్రియ ఇక్కడ భవిష్యదర్థం కంటే నిర్దేశాత్మక భావాన్ని కలిగి ఉంది; ‘మోయాలి’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים
  choice: పొట్టేళ్ల కొమ్ములతో చేసిన ఏడు బూరలను
  rationale: שׁוֹפָר కొమ్ము బూరను సూచిస్తుంది; יוֹבְלִים ఇక్కడ ‘సునాద సంవత్సరం’ అనే సాంకేతిక అర్థం కంటే పొట్టేళ్ల కొమ్ములను సూచిస్తుంది.
- source_word: לִפְנֵי
  choice: ముందు
  rationale: ఊరేగింపులోని స్థాన సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֲרוֹן יְהוָה
  choice: యెహోవా మందసం
  rationale: మందసానికి దైవనామంతో ఉన్న సంబంధాన్ని నేరుగా నిలుపుతుంది; יְהוָה అనే నామానికి తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా వ్యక్తినామంగానే ఉంచి, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది.
- issue: אֲרוֹן הַבְּרִית మరియు אֲרוֹן יְהוָה అనే రెండు వర్ణనల సంబంధం
  choice: మొదట ‘నిబంధన మందసం’, తరువాత ‘యెహోవా మందసం’
  alternative: రెండుచోట్లా ‘నిబంధన మందసం’
  rationale: ఒకే వస్తువును సూచించినప్పటికీ మూలపాఠం ఉపయోగించిన వేర్వేరు పదబంధాలను అలాగే నిలిపి, వాటి ధార్మిక సంబంధాలను సమతలీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ప్రత్యక్ష వాక్యంలోని ఆజ్ఞా భావం ‘మోయండి’ మరియు ‘మోయాలి’ ద్వారా నిలుపబడింది. మూలంలోని రెండు మందసం-పదబంధాల భేదం కాపాడబడింది.
