source:
  edition: WLC
  text: וַ/יַּשְׁבַּ֣ע יְהוֹשֻׁ֔עַ בָּ/עֵ֥ת הַ/הִ֖יא לֵ/אמֹ֑ר אָר֨וּר הָ/אִ֜ישׁ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֤ר יָקוּם֙ וּ/בָנָ֞ה אֶת הָ/עִ֤יר הַ/זֹּאת֙ אֶת יְרִיח֔וֹ בִּ/בְכֹר֣/וֹ יְיַסְּדֶ֔/נָּה וּ/בִ/צְעִיר֖/וֹ יַצִּ֥יב דְּלָתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
translation:
  language: te
  text: 'ఆ సమయంలో యెహోషువ వారిచేత ప్రమాణం చేయించి[a] ఇలా చెప్పాడు: “ఈ పట్టణమైన యెరికోను తిరిగి కట్టడానికి పూనుకునే వ్యక్తి యెహోవా ఎదుట శాపగ్రస్తుడు! తన జ్యేష్ఠ కుమారుణ్ణి కోల్పోయే మూల్యంతో[b] దాని పునాది వేస్తాడు; తన కనిష్ఠ కుమారుణ్ణి కోల్పోయే మూల్యంతో దాని ద్వారాలను నిలబెడతాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “వారిని ప్రమాణబద్ధులను చేసి.” హీబ్రూ క్రియ కారణార్థక రూపంలో ఉంది: యెహోషువ ప్రజలచేత ప్రమాణం చేయించాడు.'
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తన జ్యేష్ఠునితో/లో … తన కనిష్ఠునితో/లో.” ఈ ప్రయోగం బహుశా వారిని కోల్పోవడమనే మూల్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: వారిచేత ప్రమాణం చేయిస్తూ
  rationale: 'హిఫీల్ రూపంలోని కారణార్థాన్ని చూపిస్తుంది: యెహోషువ తానే ప్రమాణం చేశాడని కాక, సందర్భంలో ఉన్నవారిని ప్రమాణబద్ధులను చేశాడని తెలియజేస్తుంది.'
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: సహజమైన ఆధునిక తెలుగు కాలసూచక ప్రయోగం.
- source_word: אָרוּר הָאִישׁ לִפְנֵי יְהוָה
  choice: వ్యక్తి యెహోవా సన్నిధిలో శాపగ్రస్తుడు
  rationale: హీబ్రూ శాపసూత్రపు గంభీరతను, యెహోవా సమక్షంలో దాని ధార్మిక బలాన్ని నిలుపుతుంది; הָאִישׁ ఇక్కడ సాధారణంగా ఎవరినైనా సూచిస్తుంది.
- source_word: יָקוּם וּבָנָה
  choice: తిరిగి కట్టడానికి పూనుకునే
  rationale: నాశనమైన పట్టణాన్ని పునర్నిర్మించేందుకు కార్యాచరణ మొదలుపెట్టడమనే సందర్భార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הָעִיר הַזֹּאת אֶת יְרִיחוֹ
  choice: ఈ యెరికో పట్టణాన్ని
  rationale: ‘ఈ పట్టణం, యెరికో’ అనే సమానాధికార నిర్మాణాన్ని తెలుగులో సహజమైన క్రమంలో అందిస్తుంది.
- source_word: בִּבְכֹרוֹ
  choice: తన జ్యేష్ఠ కుమారుని మూల్యంగా చెల్లించి
  rationale: בְּ ఉపసర్గ ఇక్కడ నష్టం లేదా మూల్యం అనే భావాన్ని సూచించే అవకాశాన్ని స్పష్టంగా అందిస్తుంది; మరణం ఎలా సంభవిస్తుందో లేదా బలి అర్పించబడిందో నిర్ణయించదు.
- source_word: יְיַסְּדֶנָּה
  choice: దాని పునాది వేస్తాడు
  rationale: יסד క్రియకు నిర్మాణ సందర్భంలో ఉన్న స్పష్టమైన భౌతిక అర్థాన్ని అందిస్తుంది.
- source_word: וּבִצְעִירוֹ
  choice: తన చిన్న కుమారుని మూల్యంగా చెల్లించి
  rationale: జ్యేష్ఠ కుమారునితో ఉన్న సమాంతరతను నిలుపుతూ కుటుంబంలోని చిన్న కుమారుడిని సూచిస్తుంది.
- source_word: יַצִּיב דְּלָתֶיהָ
  choice: దాని ద్వారాలు నిలబెడతాడు
  rationale: పట్టణ ద్వారాలను వాటి స్థానంలో ఏర్పాటు చేయడమనే నిర్మాణ దశను దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ప్రత్యక్ష రూపంలో అందిస్తుంది.
theological_decisions:
- issue: యెహోషువ పలికిన మాటల స్వభావం
  choice: యెరికోను తిరిగి కట్టేవారిపై యెహోవా సన్నిధిలో ప్రకటించిన గంభీరమైన శాపం
  alternative: యెహోషువ వ్యక్తిగత కోరిక లేదా కేవలం పౌర నిషేధం
  rationale: ‘యెహోవా సన్నిధిలో శాపగ్రస్తుడు’ అనే మాటలు దీనికి ధార్మిక గంభీరతను ఇస్తాయి; పాఠం చెప్పిన దానికంటే అధికంగా దాని కార్యవిధానాన్ని వివరించలేదు.
- issue: కుమారులకు సంబంధించిన పునర్నిర్మాణ శాపం
  choice: పునాది, ద్వారాల నిర్మాణ దశలతో ముడిపడిన కుమారుల నష్టం
  alternative: కుమారులను ఉద్దేశపూర్వకంగా బలి ఇవ్వడం లేదా వివరించని సాధారణ దురదృష్టం
  rationale: ‘మూల్యంగా చెల్లించి’ అనే అనువాదం తీవ్రమైన నష్టాన్ని తెలియజేస్తుంది; అయితే అది బలి విధానమా లేక మరొక విధంగా మరణమా అనేది వచనం స్పష్టంగా చెప్పనందున నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన శాపప్రకటనకు తగిన మర్యాదపూర్వక శైలి. ‘జ్యేష్ఠ కుమారుడు’ మరియు ‘చిన్న కుమారుడు’ అనే సమాంతర పదబంధాలు కుటుంబ సంబంధాన్ని స్పష్టంచేస్తాయి. హీబ్రూలోని సాధారణ పుంలింగ ‘మనిషి’ని తెలుగులో సహజమైన సమగ్ర పదమైన ‘వ్యక్తి’గా అందించాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
