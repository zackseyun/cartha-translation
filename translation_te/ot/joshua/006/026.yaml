revisions:
- from: 'ఆ సమయంలో యెహోషువ వారిచేత ప్రమాణం చేయిస్తూ[a] ఇలా అన్నాడు: “ఈ యెరికో పట్టణాన్ని తిరిగి కట్టడానికి పూనుకునే వ్యక్తి యెహోవా సన్నిధిలో శాపగ్రస్తుడు! తన జ్యేష్ఠ కుమారుని మూల్యంగా చెల్లించి[b] దాని పునాది వేస్తాడు; తన చిన్న కుమారుని మూల్యంగా చెల్లించి దాని ద్వారాలు నిలబెడతాడు.”'
  to: 'ఆ సమయంలో యెహోషువ వారిచేత ప్రమాణం చేయించి[a] ఇలా చెప్పాడు: “ఈ పట్టణమైన యెరికోను తిరిగి కట్టడానికి పూనుకునే వ్యక్తి యెహోవా ఎదుట శాపగ్రస్తుడు! తన జ్యేష్ఠ కుమారుణ్ణి కోల్పోయే మూల్యంతో[b] దాని పునాది వేస్తాడు; తన కనిష్ఠ కుమారుణ్ణి కోల్పోయే మూల్యంతో దాని ద్వారాలను నిలబెడతాడు.”'
  rationale: కారణార్థక క్రియను తెలుగులో సహజంగా సవరించాం; ద్వారాలకు అవసరమైన కర్మవిభక్తిని చేర్చాం; కుమారుల విషయంలోని మూల్య/నష్ట భావాన్ని స్పష్టంగా వ్యక్తం చేస్తూనే, ఆ నష్టం ఏ విధంగా సంభవిస్తుందో మూలపాఠం చెప్పని విషయాన్ని నిర్ణయించలేదు. పాదటిప్పణి సూచికలు, వాటి వివరణలు ప్రధాన పాఠ్యంతో సరిపోలేలా నిలిపాం.
